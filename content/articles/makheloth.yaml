body:
  en:
    - "Makheloth is a camp of Israel in the wilderness, named only in the list of stations in Numbers 33: “And they removed from Haradah, and pitched in Makheloth. And they removed from Makheloth, and encamped at Tahath.” It lies in the long run of stations between Hazeroth and Ezion-gaber of which the Bible tells no events. The name means “assemblies”, from the same root as Kehelathah three stations earlier, and nothing in the text explains it."
    - "Its site is unknown. The map places it, with low confidence, at Kuntillet Ajrud in north-eastern Sinai, a desert way station of about 800 BC famous for its painted jars and inscriptions blessing travellers “by Yahweh of Samaria and his Asherah”; but nothing connects that site with Makheloth beyond its position on an old route. Since the order and course of these stations are themselves reconstructed, any point on the map is a guess."
  ru:
    - "Макелоф — стан Израиля в пустыне, известный только по перечню в 33-й главе Чисел: «И отправились из Харады и расположились станом в Макелофе. И отправились из Макелофа и расположились станом в Тахафе». Он стоит в длинном ряду станов между Асирофом и Ецион-Гавером, о которых Библия не рассказывает никаких событий. Имя значит «собрания», от того же корня, что и Кегелафа тремя станами раньше, и текст его никак не объясняет."
    - "Место его неизвестно. На карте он с малой уверенностью помещён в Кунтиллет-Аджруд на северо-востоке Синая — пустынную станцию около 800 г. до н. э., знаменитую расписными сосудами и надписями, благословляющими путников «Яхве Самарийским и его Ашерой»; но ничто, кроме положения на старом пути, не связывает это место с Макелофом. Поскольку и порядок, и направление этих станов восстанавливаются лишь предположительно, любая точка на карте — догадка."
  uk:
    - "Макелот — табір Ізраїлю в пустелі, названий лише в переліку стоянок у Книзі Чисел, розділ 33: «І рушили з Гаради та й отаборились у Макелотї. І рушили з Макелоти та й отаборились у Талатї.» Він лежить у довгій низці стоянок між Хацеротом і Ецйон-Гевером, про які Біблія не розповідає подій. Назва означає «збори», від того самого кореня, що й Кегелата трьома стоянками раніше, і ніщо в тексті цього не пояснює."
    - "Місце його невідоме. Мапа розміщує його, з низькою впевненістю, у Кунтіллет-Аджруді на північному сході Синаю, пустельній придорожній стоянці близько 800 р. до н. е., відомій розмальованими глечиками та написами, що благословляють мандрівників «Яхве Самарійським та його Ашерою»; але ніщо не пов’язує це місце з Макелотом, крім положення на давньому шляху. Оскільки порядок і хід цих стоянок самі є реконструкцією, будь-яка точка на мапі — здогад."
  es:
    - "Maquelot es un campamento de Israel en el desierto, nombrado solo en la lista de estaciones de Números 33: «Y partidos de Harada, asentaron en Maceloth. Y partidos de Maceloth, asentaron en Tahath». Se encuentra en la larga serie de estaciones entre Haserot y Ezión-geber de las que la Biblia no cuenta ningún suceso. El nombre significa «asambleas», de la misma raíz que Ceelata, tres estaciones antes, y nada en el texto lo explica."
    - "Su emplazamiento se desconoce. El mapa la sitúa, con baja confianza, en Kuntillet Ajrud, en el nordeste del Sinaí, una estación de postas del desierto de hacia 800 a. C. famosa por sus jarras pintadas y sus inscripciones que bendicen a los viajeros «por Yahveh de Samaria y su Asera»; pero nada conecta ese sitio con Maquelot más allá de su posición en una ruta antigua. Como el orden y el curso de estas estaciones están ellos mismos reconstruidos, cualquier punto del mapa es una conjetura."
  pt:
    - "Maquelote é um acampamento de Israel no deserto, citado apenas na lista de etapas de Números 33: “Partiram de Harada e acamparam em Macelote. Partiram de Macelote e acamparam em Taate.” Situa-se na longa sequência de etapas entre Hazerote e Eziom-Geber, das quais a Bíblia não conta acontecimentos. O nome significa “assembleias”, da mesma raiz de Queelata, três etapas antes, e nada no texto o explica."
    - "Seu sítio é desconhecido. O mapa o situa, com baixa confiança, em Kuntillet Ajrud, no nordeste do Sinai, um posto de parada no deserto de cerca de 800 a.C., famoso por seus jarros pintados e inscrições que abençoam viajantes “por Javé de Samaria e sua Asherá”; mas nada liga esse sítio a Maquelote além de sua posição numa rota antiga. Como a ordem e o curso dessas etapas são eles próprios reconstruídos, qualquer ponto no mapa é um palpite."
  de:
    - "Makhelot ist ein Lager Israels in der Wüste, nur in der Stationenliste von 4. Mose 33 genannt: „Von Harada zogen sie aus und lagerten sich in Makheloth. Von Makheloth zogen sie aus und lagerten sich in Thahath.“ Es liegt in der langen Reihe von Stationen zwischen Hazerot und Ezjon-Geber, von denen die Bibel keine Ereignisse erzählt. Der Name bedeutet „Versammlungen“, von derselben Wurzel wie Kehelata drei Stationen früher, und nichts im Text erklärt ihn."
    - "Seine Lage ist unbekannt. Die Karte setzt es, mit geringer Sicherheit, nach Kuntillet Ajrud im nordöstlichen Sinai, einer Wüstenstation von etwa 800 v. Chr., berühmt für ihre bemalten Krüge und Inschriften, die Reisende „bei Jahwe von Samaria und seiner Aschera“ segnen; doch nichts verbindet diesen Ort mit Makhelot außer seiner Lage an einer alten Route. Da Reihenfolge und Verlauf dieser Stationen selbst rekonstruiert sind, ist jeder Punkt auf der Karte eine Vermutung."
  fr:
    - "Makhéloth est un campement d’Israël dans le désert, nommé seulement dans la liste des étapes de Nombres 33 : « Ils partirent de Harada, et campèrent à Makhéloth. Ils partirent de Makhéloth, et campèrent à Tahath. » Elle se trouve dans la longue série d’étapes entre Hatséroth et Étsjon-Guéber dont la Bible ne raconte aucun événement. Le nom signifie « assemblées », de la même racine que Kehélatha, trois étapes plus tôt, et rien dans le texte ne l’explique."
    - "Son site est inconnu. La carte la place, avec une faible confiance, à Kuntillet Ajrud, dans le nord-est du Sinaï, relais du désert d’environ 800 av. J.-C. célèbre pour ses jarres peintes et ses inscriptions bénissant les voyageurs « par Yahvé de Samarie et son Ashéra » ; mais rien ne relie ce site à Makhéloth, sinon sa position sur une ancienne route. Comme l’ordre et le tracé de ces étapes sont eux-mêmes reconstitués, tout point de la carte est une conjecture."
  it:
    - "Makelot è un accampamento d’Israele nel deserto, nominato solo nell’elenco delle tappe di Numeri 33: «Partirono da Harada e si accamparono a Makheloth. Partirono da Makheloth e si accamparono a Tahath». Si trova nella lunga serie di tappe tra Cazerot ed Ezion-Gheber di cui la Bibbia non racconta eventi. Il nome significa «assemblee», dalla stessa radice di Keelata tre tappe prima, e nulla nel testo lo spiega."
    - "Il suo sito è sconosciuto. La mappa la colloca, con scarsa fiducia, a Kuntillet Ajrud nel Sinai nord-orientale, una stazione di sosta nel deserto dell’800 a.C. circa famosa per le sue giare dipinte e per le iscrizioni che benedicono i viaggiatori «per Yahweh di Samaria e la sua Asherah»; ma nulla collega quel sito con Makelot oltre la sua posizione su un’antica via. Poiché l’ordine e il percorso di queste tappe sono essi stessi ricostruiti, ogni punto sulla mappa è un’ipotesi."
  pl:
    - "Makhelot to obóz Izraela na pustyni, wymieniony tylko na liście stacji w Lb 33: „A ruszywszy się z Charada, położyli się obozem w Makelot. A ruszywszy się z Makelot, położyli się obozem w Tahat.” Leży w długim ciągu stacji między Chasserot a Esjon-Geber, o których Biblia nie opowiada żadnych wydarzeń. Nazwa znaczy „zgromadzenia”, od tego samego rdzenia co Kehelata trzy stacje wcześniej, a nic w tekście jej nie wyjaśnia."
    - "Jego położenie jest nieznane. Mapa umieszcza je, z niską pewnością, w Kuntillet Adżrud w północno-wschodnim Synaju, pustynnej stacji z około 800 r. p.n.e., słynnej z malowanych dzbanów i inskrypcji błogosławiących podróżnych „przez Jahwe z Samarii i jego Aszerę”; ale nic nie łączy tego miejsca z Makhelot poza jego położeniem na dawnym szlaku. Ponieważ sama kolejność i przebieg tych stacji są rekonstruowane, każdy punkt na mapie jest domysłem."
  nl:
    - "Makhelot is een legerplaats van Israël in de woestijn, alleen genoemd in de lijst van pleisterplaatsen in Numeri 33: “En zij verreisden van Harada, en legerden zich in Makheloth. En zij verreisden van Makheloth, en legerden zich in Tachath.” Het ligt in de lange reeks pleisterplaatsen tussen Hazerot en Ezeon-Geber waarvan de Bijbel geen gebeurtenissen vertelt. De naam betekent “vergaderingen”, van dezelfde wortel als Kehelata drie pleisterplaatsen eerder, en niets in de tekst verklaart hem."
    - "De ligging is onbekend. De kaart plaatst het, met weinig zekerheid, bij Kuntillet Ajrud in het noordoosten van de Sinaï, een woestijnpleisterplaats van omstreeks 800 v.Chr., beroemd om zijn beschilderde kruiken en inscripties die reizigers zegenen “door Jahweh van Samaria en zijn Asjera”; maar niets verbindt die plaats met Makhelot behalve haar ligging aan een oude route. Omdat de volgorde en het verloop van deze pleisterplaatsen zelf gereconstrueerd zijn, is elk punt op de kaart een gissing."
  cs:
    - "Makhelót je tábor Izraele na poušti, uvedený jen v seznamu stanic v Numeri 33: „A hnuvše se z Arad, položili se v Machelot. Potom hnuvše se z Machelot, položili se v Tahat.“ Leží v dlouhé řadě stanic mezi Chacerótem a Ecjon-geberem, o nichž Bible nevypráví žádné události. Jméno znamená „shromáždění“, ze stejného kořene jako Kehelata o tři stanice dříve, a nic v textu je nevysvětluje."
    - "Jeho poloha je neznámá. Mapa jej s nízkou jistotou klade do Kuntillet Ajrud v severovýchodním Sinaji, pouštní stanice u cesty z doby kolem roku 800 př. n. l., proslulé malovanými nádobami a nápisy žehnajícími poutníkům „Jahve Samařským a jeho Ašerou“; nic však nespojuje to místo s Makhelótem kromě jeho polohy na staré cestě. Protože pořadí a průběh těchto stanic jsou samy rekonstruovány, je každý bod na mapě dohadem."
  sv:
    - "Makhelot är ett läger för Israel i öknen, nämnt endast i förteckningen över stationer i Fjärde Mosebok 33: ”Och de bröto upp från Harada och lägrade sig i Makhelot. Och de bröto upp från Makhelot och lägrade sig i Tahat.” Det ligger i den långa raden av stationer mellan Haserot och Esjon-Geber om vilka Bibeln inte berättar några händelser. Namnet betyder ”församlingar”, av samma rot som Kehelata tre stationer tidigare, och inget i texten förklarar det."
    - "Dess läge är okänt. Kartan placerar det, med låg säkerhet, vid Kuntillet Ajrud i nordöstra Sinai, en ökenstation från omkring 800 f.Kr. berömd för sina målade krukor och inskrifter som välsignar resenärer ”genom Jahve av Samaria och hans Asherah”; men inget förbinder platsen med Makhelot utöver dess läge vid en gammal färdväg. Eftersom ordningen och sträckningen av dessa stationer själva är rekonstruerade, är varje punkt på kartan en gissning."
  nb:
    - "Makhelot er en leirplass for Israel i ørkenen, nevnt bare i listen over stasjoner i 4 Mos 33: «Og de drog fra Harada og leiret sig i Makhelot. Og de drog fra Makhelot og leiret sig i Tahat.» Den ligger i den lange rekken av stasjoner mellom Haserot og Esjon-Geber som Bibelen ikke forteller noen hendelser om. Navnet betyr «forsamlinger», av den samme roten som Kehelata tre stasjoner tidligere, og ingenting i teksten forklarer det."
    - "Dens beliggenhet er ukjent. Kartet plasserer den, med lav sikkerhet, ved Kuntillet Ajrud i det nordøstlige Sinai, en ørkenstasjon fra omkring 800 f.Kr. kjent for sine malte krukker og innskrifter som velsigner reisende «ved Jahve av Samaria og hans Asjera»; men ingenting knytter det stedet til Makhelot utover dets plassering på en gammel rute. Siden rekkefølgen og forløpet av disse stasjonene selv er rekonstruert, er ethvert punkt på kartet et gjett."
  tl:
    - "Ang Maceloth ay kampo ng Israel sa ilang, na pinangalanan lamang sa talaan ng mga himpilan sa Mga Bilang 33: “At sila'y naglakbay mula sa Harada, at humantong sa Maceloth. At sila'y naglakbay mula sa Maceloth, at humantong sa Tahath.” Nasa mahabang hanay ito ng mga himpilan sa pagitan ng Haseroth at Esion-geber na walang isinasalaysay na pangyayari ang Biblia. Ang pangalan ay nangangahulugang “mga kapulungan”, mula sa iisang ugat ng Ceelatha tatlong himpilan ang nauna, at walang nagpapaliwanag nito sa teksto."
    - "Hindi alam ang pook nito. Inilalagay ito ng mapa, na may mababang katiyakan, sa Kuntillet Ajrud sa hilagang-silangang Sinai, isang himpilan ng daan sa disyerto noong mga 800 BK na tanyag sa mga pininturahang banga at mga inskripsiyong nagpapala sa mga manlalakbay “sa pamamagitan ni Yahweh ng Samaria at ng kaniyang Asherah”; ngunit walang nag-uugnay sa pook na iyon sa Maceloth maliban sa posisyon nito sa isang lumang ruta. Yamang ang pagkakasunud-sunod at takbo ng mga himpilang ito ay muling binubuo mismo, anumang punto sa mapa ay hula."
  da:
    - "Makhelot er en lejr for Israel i ørkenen, kun nævnt i listen over stationer i Fjerde Mosebog 33: »Og de rejste fra Harada, og de lejrede sig i Makeheloth. Og de rejste fra Makeheloth, og de lejrede sig i Thabath.« Den ligger i den lange række af stationer mellem Haserot og Esjon-Geber, om hvilke Bibelen ikke fortæller nogen begivenheder. Navnet betyder »forsamlinger«, af samme rod som Kehelata tre stationer tidligere, og intet i teksten forklarer det."
    - "Dens sted er ukendt. Kortet placerer den, med lav sikkerhed, ved Kuntillet Ajrud i det nordøstlige Sinai, en ørkenrasteplads fra omkring 800 f.Kr., berømt for sine malede krukker og indskrifter, der velsigner rejsende »ved Jahve af Samaria og hans Asjera«; men intet forbinder det sted med Makhelot ud over dets placering på en gammel rute. Da rækkefølgen og forløbet af disse stationer selv er rekonstrueret, er ethvert punkt på kortet et gæt."
  sr:
    - "Макидот је логор Израиља у пустињи, наведен само у списку станица у Књизи Бројева 33: „А из Харада отишавши стадоше у логор у Макидоту. А из Макидота отишавши стадоше у логор у Катату.“ Лежи у дугом низу станица између Асирота и Есион-Гавера о којима Библија не приповеда никакве догађаје. Име значи „зборови“, од истог корена као Макелата три станице раније, и ништа у тексту га не објашњава."
    - "Његово налазиште је непознато. Мапа га, са малим поуздањем, смешта на Кунтилет Аџруд у североисточном Синају, пустињску путну станицу из око 800. п. н. е. прочуту по осликаним врчевима и натписима који благосиљају путнике „Јахвеом Самарије и његовом Ашером“; али ништа не повезује то налазиште с Макидотом осим положаја на старом путу. Пошто су редослед и ток ових станица и сами реконструисани, свака тачка на мапи је нагађање."
  hu:
    - "Makhelót Izráel egyik pusztai tábora, amelyet csak a Számok könyve 33. fejezetének állomásjegyzéke nevez meg: „És elindulának Haradából, és tábort ütének Makhélótban. És elindulának Makhélótból, és tábort ütének Tháhátban.” A Hacérót és Ecjón-Géber közötti hosszú állomássor tagja, amelyről a Biblia nem mond eseményeket. A név „gyülekezeteket” jelent, ugyanabból a gyökből, mint három állomással korábbi Kehelata, és a szöveg semmivel sem magyarázza."
    - "Helye ismeretlen. A térkép alacsony bizonyossággal az északkelet-sínai Kuntillet Ajrudra teszi, egy Kr. e. 800 körüli sivatagi pihenőállomásra, amely festett korsóiról és az utazókat áldó feliratairól híres: „Samária Jahvéja és az ő Aserája által”; de semmi sem köti ezt a helyet Makhelóthoz azon kívül, hogy egy régi úton fekszik. Mivel ezen állomások sorrendje és útvonala maga is rekonstrukció, a térkép bármely pontja találgatás."
  fi:
    - "Makhelot on Israelin leiripaikka erämaassa, mainittu vain 4. Moos. 33:n asemaluettelossa: ”Ja he lähtivät Haradasta ja leiriytyivät Makhelotiin. Ja he lähtivät Makhelotista ja leiriytyivät Tahatiin.” Se sijaitsee Haserotin ja Esjon-Geberin välisessä pitkässä asemajaksossa, jonka tapahtumista Raamattu ei kerro mitään. Nimi tarkoittaa ”kokouksia”, samasta juuresta kuin Kehelata kolme asemaa aiemmin, eikä teksti selitä sitä."
    - "Sen sijainti on tuntematon. Kartta sijoittaa sen, heikolla varmuudella, Kuntillet Ajrudiin Koillis-Siinailla, noin vuoden 800 eaa. autiomaan tienvarsiasemaan, joka on kuuluisa maalatuista ruukuistaan ja kirjoituksistaan, jotka siunaavat matkaajia ”Samarian Jahven ja hänen Asheransa kautta”; mutta mikään ei yhdistä tuota paikkaa Makhelotiin paitsi sen sijainti vanhalla reitillä. Koska näiden asemien järjestys ja kulku ovat itsekin rekonstruoituja, mikä tahansa piste kartalla on arvaus."
  vi:
    - "Mác-hê-lốt là một nơi đóng trại của Y-sơ-ra-ên trong đồng vắng, chỉ được nêu trong danh sách các chặng ở Dân số ký 33: “Đi từ Ha-ra-đa và đóng trại tại Mác-hê-lốt. Đoạn, đi từ Mác-hê-lốt và đóng trại tại Ta-hát”. Nó nằm trong dãy dài các chặng giữa Hát-sê-rốt và Ê-xi-ôn-Ghê-be mà Kinh Thánh không kể sự kiện nào. Tên có nghĩa “các hội chúng”, cùng gốc với Kê-hê-la-tha ba chặng trước, và không có gì trong văn bản giải thích điều đó."
    - "Địa điểm không được biết. Bản đồ đặt nó, với độ tin cậy thấp, tại Kuntillet Ajrud ở đông bắc Si-na-i, một trạm dừng chân trong sa mạc khoảng năm 800 TCN nổi tiếng vì những bình vẽ và bản khắc chúc phúc cho lữ khách “bởi Yahweh của Sa-ma-ri và Asherah của Ngài”; nhưng không có gì nối địa điểm ấy với Mác-hê-lốt ngoài vị trí trên một con đường xưa. Vì thứ tự và lộ trình của các chặng này tự chúng cũng là sự dựng lại, mọi điểm trên bản đồ đều là phỏng đoán."
  ro:
    - "Machelot este o tabără a lui Israel în pustie, numită doar în lista popasurilor din Numeri 33: „Și au purces din Haradat, și au tăbărît în Machilot. Și au purces din Machilot, și au tăbărît în Kataat.” Se află în lungul șir de popasuri dintre Hațerot și Ețion-Gheber despre care Biblia nu spune niciun eveniment. Numele înseamnă „adunări”, de la aceeași rădăcină ca Chehelata, cu trei popasuri mai devreme, și nimic în text nu îl explică."
    - "Locul ei este necunoscut. Harta o plasează, cu încredere scăzută, la Kuntillet Ajrud, în nord-estul Sinaiului, un popas din deșert de pe la 800 î.Hr., faimos pentru vasele sale pictate și inscripțiile care binecuvântează călătorii „de Yahweh din Samaria și de Așera lui”; dar nimic nu leagă acel sit de Machelot dincolo de poziția lui pe un drum vechi. Cum ordinea și cursul acestor popasuri sunt ele însele reconstituite, orice punct de pe hartă este o presupunere."
  bg:
    - "Макелот е стан на Израил в пустинята, назован само в списъка на стоянките в Числа 33: „И като се дигнаха от Харада разположиха стан в Макилот. И като се дигнаха от Макилот разположиха стан в Тахат.“ Той е в дългата поредица от стоянки между Асирот и Ецион-Гавер, за които Библията не разказва никакви събития. Името означава „събрания“, от същия корен като Кехелата три стоянки по-рано, и нищо в текста не го обяснява."
    - "Местоположението му е неизвестно. Картата го поставя, с ниска степен на увереност, в Кунтилет Аджруд в североизточен Синай — пустинна станция от около 800 г. пр.н.е., прочута с изрисуваните си делви и надписи, които благославят пътниците „чрез Яхве Самарийски и неговата Ашера“; но нищо не свързва това място с Макелот освен положението му на стар път. Тъй като редът и трасето на тези стоянки сами по себе си са реконструирани, всяка точка на картата е догадка."
