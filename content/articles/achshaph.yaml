# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the app's candidates are named without choosing; Eusebius' placing at Tabor is called a confusion, as scholars treat it.
id: achshaph
place: a8ce5c4
title:
  en: "Achshaph"
  ru: "Ахсаф"
  uk: "Ахшаф"
  es: "Acsaf"
  pt: "Acsafe"
  de: "Achschaf"
