body:
  en:
    - "Achshaph was a Canaanite royal city on the plain of Acco, in the lot of Asher. It is well known outside the Bible: Thutmose III lists it among the towns he took in the fifteenth century BC, its ruler Endaruta wrote to Pharaoh in the Amarna letters and was told to guard the king's town and make ready for the Egyptian archers, and a scribe of the thirteenth century names it in Papyrus Anastasi I among the towns an envoy should know. Where it stood is disputed. The map offers Tel Regev (Tell el-Harbaj) near the mouth of the Kishon south-east of Haifa Bay; Tell Keisan, the large mound 8 km south-east of Acre that French excavators dug in 1971–1976 and found occupied from the Early Bronze Age to the Persian period; Tell Bir el-Gharbi to its north; and Tel Kabri further up the coast. Eusebius placed it at the foot of Mount Tabor, which is surely a confusion."
    - "“And it came to pass, when Jabin king of Hazor had heard those things, that he sent to Jobab king of Madon, and to the king of Shimron, and to the king of Achshaph”, and the kings of the north gathered at the waters of Merom, where Joshua fell on them and chased them to great Sidon. In the roll of the thirty-one kings stands “the king of Achshaph, one”, and in Asher's inheritance “their border was Helkath, and Hali, and Beten, and Achshaph”, running towards Carmel. Nothing more is told of it, and the name does not survive."
    - "The plain today is the Zebulun valley of Israel between Haifa and Acre, industrial on the bay and farmed inland, with Tell Keisan among the fields and Tel Regev beside the Kishon."
  ru:
    - "Ахсаф — ханаанский царский город на равнине Акко, в уделе Асира. Вне Библии он хорошо известен: Тутмос III числит его среди городов, взятых им в XV веке до н. э., его правитель Эндарута писал фараону в письмах из Амарны и получил приказ охранять город царя и приготовиться к приходу египетских лучников, а писец XIII века называет его в папирусе Анастаси I среди городов, которые должен знать гонец. Где он стоял, спорно. На карте предложены Тель-Регев (Телль-эль-Харбадж) у устья Киссона к юго-востоку от Хайфского залива; Телль-Кейсан — большой холм в 8 км к юго-востоку от Акко, который французские археологи копали в 1971–1976 годах и нашли заселённым от раннего бронзового века до персидского времени; Телль-Бир-эль-Гарби к северу от него и Тель-Кабри дальше по берегу. Евсевий поместил его у подножия Фавора, что наверняка путаница."
    - "«Услышав сие, Иавин, царь Асорский, послал к Иоваву, царю Мадонскому, и к царю Шимронскому, и к царю Ахсафскому», и цари севера собрались при водах Меромских, где Иисус Навин напал на них и преследовал до Сидона великого. В перечне тридцати одного царя стоит «один царь Ахсафа», а в уделе Асира «пределом их были: Хелкаф, Хали, Ветен и Ахсаф», и граница идёт к Кармилу. Больше о нём ничего не рассказано, и имя не сохранилось."
    - "Равнина сегодня — израильская долина Звулун между Хайфой и Акко, промышленная у залива и земледельческая в глубине; Телль-Кейсан стоит среди полей, а Тель-Регев — у Киссона."
  uk:
    - "Ахшаф був ханаанським царським містом на рівнині Акко, в уділі Асіра. Він добре відомий і поза Біблією: Тутмос III включає його до міст, узятих у XV столітті до н. е., його володар Ендарута писав фараонові в листах з Амарни, і йому було наказано охороняти царське місто та готувати його до приходу єгипетських лучників, а писар XIII століття називає його в папірусі Анастасі I серед міст, які мусить знати посланець. Де він стояв — спірне. На мапі пропонують Тель-Регев (Телль-ель-Харбадж) біля гирла Кішону на південний схід від Хайфської затоки; Телль-Кейсан, великий пагорб за 8 км на південний схід від Акко, який французькі археологи розкопували в 1971–1976 рр. і виявили, що він був заселений від ранньої бронзової доби до перської; Телль-Бір-ель-Гарбі на північ від нього; і Тель-Кабрі далі вгору по узбережжю. Євсевій розміщував його біля підніжжя гори Фавор, що, певно, є плутаниною."
    - "«Як же дочувсь про се Евин, царь Асорський, післав він посли до Йобаба, царя Мадонського, та до царя Симронського, та до царя Ахсафського», і царі півночі зібралися при водах Меромських, де Ісус Навин напав на них і гнав їх «до Сидону великого». У переліку тридцяти одного царя стоїть «царь Ахсафський, один», а в спадщині Асіра «границї їх були Хелкат, Халі, Бетен і Ахсаф», що йшли в бік Кармеля. Більше про нього нічого не розповідається, і назва не збереглася."
    - "Рівнина нині — Завулонська долина Ізраїлю між Хайфою та Акко, промислова над затокою та оброблювана вглибині, із Телль-Кейсаном серед полів і Тель-Регевом поряд із Кішоном."
  es:
    - "Acsaf era una ciudad real cananea en la llanura de Aco, en el lote de Aser. Es bien conocida fuera de la Biblia: Tutmosis III la incluye entre las que tomó en el siglo XV a. C., su gobernante Endaruta escribió al faraón en las cartas de Amarna, donde se le ordenó guardar la ciudad del rey y preparar a los arqueros egipcios, y un escriba del siglo XIII la nombra en el papiro Anastasi I entre las que debía conocer un enviado. Se discute dónde estuvo. El mapa ofrece Tel Regev (Tell el-Harbaj), cerca de la desembocadura del Cisón, al sudeste de la bahía de Haifa; Tell Keisan, montículo a 8 km al sudeste de Acre estudiado por franceses en 1971–1976 y ocupado desde la Edad del Bronce Antiguo hasta el período persa; Tell Bir el-Gharbi, al norte de este; y Tel Kabri, más arriba en la costa. Eusebio la situó al pie del monte Tabor, seguramente una confusión."
    - "Cuando Jabín rey de Hasor «envió mensaje á Jobab rey de Madón, y al rey de Simrom, y al rey de Achsaph», los reyes del norte se reunieron junto a las aguas de Merom, donde Josué cayó sobre ellos y los persiguió hasta Sidón la grande. En la lista de los treinta y un reyes figura «el rey de Achsaph, otro», y en la heredad de Aser «su término fué Helchât, y Halí, y Betén, y Axaph», en dirección al Carmelo. Nada más se cuenta de ella, y el nombre no sobrevive."
    - "La llanura es hoy el valle de Zabulón, en Israel, entre Haifa y Acre, industrial en la bahía y cultivada tierra adentro, con Tell Keisan entre los campos y Tel Regev junto al Cisón."
  pt:
    - "Acsafe era uma cidade real cananeia na planície de Aco, no lote de Aser. É bem conhecida fora da Bíblia: Tutmés III a lista entre as cidades que tomou no século XV a.C., o seu governante Endaruta escreveu ao Faraó nas cartas de Amarna e foi instruído a guardar a cidade do rei e a preparar-se para os arqueiros egípcios, e um escriba do século XIII a nomeia no Papiro Anastasi I entre as cidades que um enviado deveria conhecer. Onde ficava é discutido. O mapa oferece Tel Regev (Tell el-Harbaj), perto da foz do Quisom, a sudeste da baía de Haifa; Tell Keisan, o grande montículo a 8 km a sudeste de Acre, que escavadores franceses exploraram em 1971–1976 e acharam ocupado desde a Idade do Bronze Antigo até o período persa; Tell Bir el-Gharbi, ao norte dele; e Tel Kabri, mais acima na costa. Eusébio a situou ao pé do monte Tabor, o que certamente é confusão."
    - "“Quando Jabim, rei de Hazor, ouviu isso, enviou mensageiros a Jobabe, rei de Madom, ao rei de Sinrom, ao rei de Acsafe”, e os reis do norte se reuniram nas águas de Merom, onde Josué caiu sobre eles e os perseguiu até a grande Sidom. No rol dos trinta e um reis consta “o rei de Acsafe, um”, e na herança de Aser “a sua fronteira foi Helcate, Hali, Béten, Acsafe”, rumo ao Carmelo. Nada mais se conta dela, e o nome não sobrevive."
    - "A planície é hoje o vale de Zebulom, em Israel, entre Haifa e Acre, industrial junto à baía e cultivada no interior, com Tell Keisan entre os campos e Tel Regev junto ao Quisom."
  de:
    - "Achschaf war eine kanaanäische Königsstadt in der Ebene von Akko, im Los Assers. Auch außerhalb der Bibel ist sie bekannt: Thutmosis III. führt sie im 15. Jahrhundert v. Chr. unter den eroberten Städten auf, ihr Herrscher Endaruta schrieb in den Amarna-Briefen an den Pharao und sollte die Stadt des Königs bewachen und sich auf die ägyptischen Bogenschützen vorbereiten, und im Papyrus Anastasi I nennt ein Schreiber des 13. Jahrhunderts sie unter den Städten, die ein Gesandter kennen sollte. Ihre Lage ist umstritten: Tel Regev (Tell el-Harbaj) bei der Kischonmündung südöstlich der Bucht von Haifa; Tell Keisan, der große Hügel 8 km südöstlich von Akko, 1971–1976 französisch ausgegraben, von der Frühbronzezeit bis zur Perserzeit besiedelt; Tell Bir el-Gharbi nördlich davon; Tel Kabri weiter an der Küste. Eusebius setzte sie an den Fuß des Tabor, gewiss eine Verwechslung."
    - "„Da aber Jabin, der König zu Hazor, solches hörte, sandte er zu Jobab, dem König zu Madon, und zum König zu Simron und zum König zu Achsaph“, und die Könige des Nordens versammelten sich an den Wassern von Merom, wo Josua sie überfiel und bis zum großen Sidon jagte. In der Liste der einunddreißig Könige steht „der König zu Achsaph“, und im Erbteil Assers „war ihr Gebiet Helkath, Hali, Beten, Achsaph“, in Richtung Karmel. Mehr wird von ihr nicht erzählt, und der Name hat sich nicht erhalten."
    - "Die Ebene ist heute das Sebulontal Israels zwischen Haifa und Akko, an der Bucht industriell genutzt, im Landesinnern landwirtschaftlich, mit Tell Keisan zwischen den Feldern und Tel Regev am Kischon."
  fr:
    - "Acschaph était une ville royale cananéenne de la plaine d’Acco, dans le lot d’Aser. Elle est bien connue hors de la Bible : Thoutmosis III la range parmi les villes qu’il prit au XVe siècle av. J.-C., son souverain Endaruta écrivit au pharaon dans les lettres d’Amarna et reçut l’ordre de garder la ville du roi et de se tenir prêt pour les archers égyptiens, et un scribe du XIIIe siècle la nomme dans le papyrus Anastasi I parmi les villes qu’un envoyé doit connaître. Son site est discuté. On propose Tel Regev (Tell el-Harbaj), près de l’embouchure du Kison, au sud-est de la baie de Haïfa ; Tell Keisan, grand tertre à 8 km au sud-est d’Acre, fouillé par des Français en 1971-1976 et occupé du Bronze ancien à l’époque perse ; Tell Bir el-Gharbi, au nord ; et Tel Kabri, plus haut sur la côte. Eusèbe la plaçait au pied du mont Thabor, ce qui est sûrement une confusion."
    - "« Jabin, roi de Hatsor, ayant appris ces choses, envoya des messagers à Jobab, roi de Madon, au roi de Schimron, au roi d’Acschaph » ; les rois du nord se rassemblèrent près des eaux de Mérom, où Josué fondit sur eux et les poursuivit jusqu’à Sidon la grande. Dans la liste des trente et un rois figure « le roi d’Acschaph, un », et dans l’héritage d’Aser, « leur limite passait par Helkath, Hali, Béthen, Acschaph », en direction du Carmel. On n’en dit rien de plus, et le nom n’a pas survécu."
    - "La plaine est aujourd’hui la vallée de Zabulon, en Israël, entre Haïfa et Acre, industrielle sur la baie et cultivée à l’intérieur, avec Tell Keisan parmi les champs et Tel Regev à côté du Kison."
