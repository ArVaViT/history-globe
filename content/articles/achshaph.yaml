# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the app's candidates are named without choosing; Eusebius' placing at Tabor is called a confusion, as scholars treat it.
id: achshaph
place: a8ce5c4
title:
  en: "Achshaph"
  ru: "Ахсаф"
body:
  en:
    - "Achshaph was a Canaanite royal city on the plain of Acco, in the lot of Asher. It is well known outside the Bible: Thutmose III lists it among the towns he took in the fifteenth century BC, its ruler Endaruta wrote to Pharaoh in the Amarna letters and was told to guard the king's town and make ready for the Egyptian archers, and a scribe of the thirteenth century names it in Papyrus Anastasi I among the towns an envoy should know. Where it stood is disputed. The map offers Tel Regev (Tell el-Harbaj) near the mouth of the Kishon south-east of Haifa Bay; Tell Keisan, the large mound 8 km south-east of Acre that French excavators dug in 1971–1976 and found occupied from the Early Bronze Age to the Persian period; Tell Bir el-Gharbi to its north; and Tel Kabri further up the coast. Eusebius placed it at the foot of Mount Tabor, which is surely a confusion."
    - "“And it came to pass, when Jabin king of Hazor had heard those things, that he sent to Jobab king of Madon, and to the king of Shimron, and to the king of Achshaph”, and the kings of the north gathered at the waters of Merom, where Joshua fell on them and chased them to great Sidon. In the roll of the thirty-one kings stands “the king of Achshaph, one”, and in Asher's inheritance “their border was Helkath, and Hali, and Beten, and Achshaph”, running towards Carmel. Nothing more is told of it, and the name does not survive."
    - "The plain today is the Zebulun valley of Israel between Haifa and Acre, industrial on the bay and farmed inland, with Tell Keisan among the fields and Tel Regev beside the Kishon."
  ru:
    - "Ахсаф — ханаанский царский город на равнине Акко, в уделе Асира. Вне Библии он хорошо известен: Тутмос III числит его среди городов, взятых им в XV веке до н. э., его правитель Эндарута писал фараону в письмах из Амарны и получил приказ охранять город царя и приготовиться к приходу египетских лучников, а писец XIII века называет его в папирусе Анастаси I среди городов, которые должен знать гонец. Где он стоял, спорно. На карте предложены Тель-Регев (Телль-эль-Харбадж) у устья Киссона к юго-востоку от Хайфского залива; Телль-Кейсан — большой холм в 8 км к юго-востоку от Акко, который французские археологи копали в 1971–1976 годах и нашли заселённым от раннего бронзового века до персидского времени; Телль-Бир-эль-Гарби к северу от него и Тель-Кабри дальше по берегу. Евсевий поместил его у подножия Фавора, что наверняка путаница."
    - "«Услышав сие, Иавин, царь Асорский, послал к Иоваву, царю Мадонскому, и к царю Шимронскому, и к царю Ахсафскому», и цари севера собрались при водах Меромских, где Иисус Навин напал на них и преследовал до Сидона великого. В перечне тридцати одного царя стоит «один царь Ахсафа», а в уделе Асира «пределом их были: Хелкаф, Хали, Ветен и Ахсаф», и граница идёт к Кармилу. Больше о нём ничего не рассказано, и имя не сохранилось."
    - "Равнина сегодня — израильская долина Звулун между Хайфой и Акко, промышленная у залива и земледельческая в глубине; Телль-Кейсан стоит среди полей, а Тель-Регев — у Киссона."
scripture:
