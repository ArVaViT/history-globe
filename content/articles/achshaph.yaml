body:
  en:
    - "Achshaph was a Canaanite royal city on the plain of Acco, in the lot of Asher. It is well known outside the Bible: Thutmose III lists it among the towns he took in the fifteenth century BC, its ruler Endaruta wrote to Pharaoh in the Amarna letters and was told to guard the king's town and make ready for the Egyptian archers, and a scribe of the thirteenth century names it in Papyrus Anastasi I among the towns an envoy should know. Where it stood is disputed. The map offers Tel Regev (Tell el-Harbaj) beside the Kishon south-east of Haifa Bay; Tell Keisan, the large mound 8 km south-east of Acre that French excavators dug in 1971–1976, occupied from the Early Bronze Age into the Hellenistic period and again in Byzantine times; Tell Bir el-Gharbi to its north; and Tel Kabri further up the coast."
    - "“And it came to pass, when Jabin king of Hazor had heard those things, that he sent to Jobab king of Madon, and to the king of Shimron, and to the king of Achshaph”, and the kings of the north gathered at the waters of Merom, where Joshua fell on them and chased them to great Sidon. In the roll of the thirty-one kings stands “the king of Achshaph, one”, and in Asher's inheritance “their border was Helkath, and Hali, and Beten, and Achshaph”, running towards Carmel. Nothing more is told of it, and the name does not survive. Eusebius placed it at the village of Chasalus below Mount Tabor, the place he also gives for Chesulloth, so he seems to have confused the two names."
    - "The plain today is the Zebulun valley of Israel between Haifa and Acre, industrial on the bay and farmed inland, with Tell Keisan among the fields and Tel Regev beside the Kishon."
  ru:
    - "Ахсаф — ханаанский царский город на равнине Акко, в уделе Асира. Вне Библии он хорошо известен: Тутмос III числит его среди городов, взятых им в XV веке до н. э., его правитель Эндарута писал фараону в письмах из Амарны и получил приказ охранять город царя и приготовиться к приходу египетских лучников, а писец XIII века называет его в папирусе Анастаси I среди городов, которые должен знать гонец. Где он стоял, спорно. На карте предложены Тель-Регев (Телль-эль-Харбадж) у Киссона к юго-востоку от Хайфского залива; Телль-Кейсан — большой холм в 8 км к юго-востоку от Акко, который французские археологи копали в 1971–1976 годах, заселённый от раннего бронзового века до эллинистического времени и вновь в византийскую эпоху; Телль-Бир-эль-Гарби к северу от него и Тель-Кабри дальше по берегу."
    - "«Услышав сие, Иавин, царь Асорский, послал к Иоваву, царю Мадонскому, и к царю Шимронскому, и к царю Ахсафскому», и цари севера собрались при водах Меромских, где Иисус Навин напал на них и преследовал до Сидона великого. В перечне тридцати одного царя стоит «один царь Ахсафа», а в уделе Асира «пределом их были: Хелкаф, Хали, Ветен и Ахсаф», и граница идёт к Кармилу. Больше о нём ничего не рассказано, и имя не сохранилось. Евсевий поместил его в селение Хасалус под Фавором — туда же, куда и Кесуллоф, так что он, по-видимому, спутал два названия."
    - "Равнина сегодня — израильская долина Звулун между Хайфой и Акко, промышленная у залива и земледельческая в глубине; Телль-Кейсан стоит среди полей, а Тель-Регев — у Киссона."
  uk:
    - "Ахшаф був ханаанським царським містом на рівнині Акко, в уділі Асіра. Він добре відомий і поза Біблією: Тутмос III включає його до міст, узятих у XV столітті до н. е., його володар Ендарута писав фараонові в листах з Амарни й отримав наказ охороняти царське місто та готувати його до приходу єгипетських лучників, а писар XIII століття називає його в папірусі Анастасі I серед міст, які мусить знати посланець. Де він стояв — спірне. На мапі пропонують Тель-Регев (Телль-ель-Харбадж) біля Кішону на південний схід від Хайфської затоки; Телль-Кейсан, великий пагорб за 8 км на південний схід від Акко, який французькі археологи розкопували в 1971–1976 рр., заселений від ранньої бронзової доби до елліністичної і знову за візантійських часів; Телль-Бір-ель-Гарбі на північ від нього; і Тель-Кабрі далі вгору по узбережжю."
    - "«Як же дочувсь про се Евин, царь Асорський, післав він посли до Йобаба, царя Мадонського, та до царя Симронського, та до царя Ахсафського», і царі півночі зібралися при водах Меромських, де Ісус Навин напав на них і гнав їх «до Сидону великого». У переліку тридцяти одного царя стоїть «царь Ахсафський, один», а в спадщині Асіра «границї їх були Хелкат, Халі, Бетен і Ахсаф», що йшли в бік Кармеля. Більше про нього нічого не розповідається, і назва не збереглася. Євсевій розміщував його в селі Хасалус під горою Фавор, там само, де й Кесуллот, тож він, схоже, сплутав дві назви."
    - "Рівнина нині — Завулонська долина Ізраїлю між Хайфою та Акко, промислова над затокою та оброблювана вглибині, із Телль-Кейсаном серед полів і Тель-Регевом поряд із Кішоном."
  es:
    - "Acsaf era una ciudad real cananea en la llanura de Aco, en el lote de Aser. Es bien conocida fuera de la Biblia: Tutmosis III la incluye entre las que tomó en el siglo XV a. C., su gobernante Endaruta escribió al faraón en las cartas de Amarna, donde se le ordenó guardar la ciudad del rey y preparar a los arqueros egipcios, y un escriba del siglo XIII la nombra en el papiro Anastasi I entre las que debía conocer un enviado. Se discute dónde estuvo. El mapa ofrece Tel Regev (Tell el-Harbaj), junto al Cisón, al sudeste de la bahía de Haifa; Tell Keisan, montículo a 8 km al sudeste de Acre estudiado por franceses en 1971–1976 y ocupado desde la Edad del Bronce Antiguo hasta el período helenístico y de nuevo en época bizantina; Tell Bir el-Gharbi, al norte de este; y Tel Kabri, más arriba en la costa."
    - "Cuando Jabín rey de Hasor «envió mensaje á Jobab rey de Madón, y al rey de Simrom, y al rey de Achsaph», los reyes del norte se reunieron junto a las aguas de Merom, donde Josué cayó sobre ellos y los persiguió hasta Sidón la grande. En la lista de los treinta y un reyes figura «el rey de Achsaph, otro», y en la heredad de Aser «su término fué Helchât, y Halí, y Betén, y Axaph», en dirección al Carmelo. Nada más se cuenta de ella, y el nombre no sobrevive. Eusebio la situó en la aldea de Chasalus, al pie del monte Tabor, el mismo lugar que da para Quesulot, así que parece haber confundido los dos nombres."
    - "La llanura es hoy el valle de Zabulón, en Israel, entre Haifa y Acre, industrial en la bahía y cultivada tierra adentro, con Tell Keisan entre los campos y Tel Regev junto al Cisón."
  pt:
    - "Acsafe era uma cidade real cananeia na planície de Aco, no lote de Aser. É bem conhecida fora da Bíblia: Tutmés III a lista entre as cidades que tomou no século XV a.C., o seu governante Endaruta escreveu ao Faraó nas cartas de Amarna e foi instruído a guardar a cidade do rei e a preparar-se para os arqueiros egípcios, e um escriba do século XIII a nomeia no Papiro Anastasi I entre as cidades que um enviado deveria conhecer. Onde ficava é discutido. O mapa oferece Tel Regev (Tell el-Harbaj), junto ao Quisom, a sudeste da baía de Haifa; Tell Keisan, o grande montículo a 8 km a sudeste de Acre, que escavadores franceses exploraram em 1971–1976, ocupado desde a Idade do Bronze Antigo até o período helenístico e de novo na época bizantina; Tell Bir el-Gharbi, ao norte dele; e Tel Kabri, mais acima na costa."
    - "“Quando Jabim, rei de Hazor, ouviu isso, enviou mensageiros a Jobabe, rei de Madom, ao rei de Sinrom, ao rei de Acsafe”, e os reis do norte se reuniram nas águas de Merom, onde Josué caiu sobre eles e os perseguiu até a grande Sidom. No rol dos trinta e um reis consta “o rei de Acsafe, um”, e na herança de Aser “a sua fronteira foi Helcate, Hali, Béten, Acsafe”, rumo ao Carmelo. Nada mais se conta dela, e o nome não sobrevive. Eusébio a situou na aldeia de Chasalus, ao pé do monte Tabor, o mesmo lugar que dá para Quesulote, de modo que parece ter confundido os dois nomes."
    - "A planície é hoje o vale de Zebulom, em Israel, entre Haifa e Acre, industrial junto à baía e cultivada no interior, com Tell Keisan entre os campos e Tel Regev junto ao Quisom."
  de:
    - "Achschaf war eine kanaanäische Königsstadt in der Ebene von Akko, im Los Assers. Auch außerhalb der Bibel ist sie bekannt: Thutmosis III. führt sie im 15. Jahrhundert v. Chr. unter seinen Eroberungen auf, ihr Herrscher Endaruta schrieb in den Amarna-Briefen dem Pharao und sollte die Königsstadt bewachen und sich auf die ägyptischen Bogenschützen vorbereiten, und im Papyrus Anastasi I nennt ein Schreiber des 13. Jahrhunderts sie unter den Städten, die ein Gesandter kennen sollte. Ihre Lage ist umstritten: Tel Regev (Tell el-Harbaj) am Kischon südöstlich der Bucht von Haifa; Tell Keisan, der große Hügel 8 km südöstlich von Akko, 1971–1976 französisch ausgegraben, von der Frühbronzezeit bis in die hellenistische und wieder in byzantinischer Zeit besiedelt; Tell Bir el-Gharbi nördlich davon; Tel Kabri weiter an der Küste."
    - "„Da aber Jabin, der König zu Hazor, solches hörte, sandte er zu Jobab, dem König zu Madon, und zum König zu Simron und zum König zu Achsaph“, und die Könige des Nordens versammelten sich an den Wassern von Merom, wo Josua sie überfiel und bis zum großen Sidon jagte. In der Liste der einunddreißig Könige steht „der König zu Achsaph“, und im Erbteil Assers „war ihr Gebiet Helkath, Hali, Beten, Achsaph“, in Richtung Karmel. Mehr wird von ihr nicht erzählt, und der Name hat sich nicht erhalten. Eusebius setzte sie in das Dorf Chasalus am Fuß des Tabor, wohin er auch Kesullot setzt, und scheint die beiden Namen verwechselt zu haben."
    - "Die Ebene ist heute das Sebulontal Israels zwischen Haifa und Akko, an der Bucht industriell genutzt, im Landesinnern landwirtschaftlich, mit Tell Keisan zwischen den Feldern und Tel Regev am Kischon."
  fr:
    - "Acschaph était une ville royale cananéenne de la plaine d’Acco, dans le lot d’Aser. Elle est bien connue hors de la Bible : Thoutmosis III la range parmi les villes qu’il prit au XVe siècle av. J.-C., son souverain Endaruta écrivit au pharaon dans les lettres d’Amarna et reçut l’ordre de garder la ville du roi et de se tenir prêt pour les archers égyptiens, et un scribe du XIIIe siècle la nomme dans le papyrus Anastasi I parmi les villes qu’un envoyé doit connaître. Son site est discuté. On propose Tel Regev (Tell el-Harbaj), au bord du Kison, au sud-est de la baie de Haïfa ; Tell Keisan, grand tertre à 8 km au sud-est d’Acre, fouillé par des Français en 1971-1976 et occupé du Bronze ancien à l’époque hellénistique, puis de nouveau à l’époque byzantine ; Tell Bir el-Gharbi, au nord ; et Tel Kabri, plus haut sur la côte."
    - "« Jabin, roi de Hatsor, ayant appris ces choses, envoya des messagers à Jobab, roi de Madon, au roi de Schimron, au roi d’Acschaph » ; les rois du nord se rassemblèrent près des eaux de Mérom, où Josué fondit sur eux et les poursuivit jusqu’à Sidon la grande. Dans la liste des trente et un rois figure « le roi d’Acschaph, un », et dans l’héritage d’Aser, « leur limite passait par Helkath, Hali, Béthen, Acschaph », en direction du Carmel. On n’en dit rien de plus, et le nom n’a pas survécu. Eusèbe la plaçait au village de Chasalus, au pied du mont Thabor, là même où il place Kesulloth, si bien qu’il semble avoir confondu les deux noms."
    - "La plaine est aujourd’hui la vallée de Zabulon, en Israël, entre Haïfa et Acre, industrielle sur la baie et cultivée à l’intérieur, avec Tell Keisan parmi les champs et Tel Regev à côté du Kison."
  it:
    - "Acsaf era una città reale cananea sulla piana di Acco, nel lotto di Aser. È ben nota anche fuori della Bibbia: Tutmosi III la elenca fra le città da lui prese nel XV secolo a.C., il suo sovrano Endaruta scrisse al faraone nelle lettere di Amarna e gli fu detto di custodire la città del re e di preparare gli arcieri egiziani, e uno scriba del XIII secolo la nomina nel Papiro Anastasi I tra le città che un inviato doveva conoscere. Dove sorgesse è discusso. La carta offre Tel Regev (Tell el-Harbaj) presso il Kison a sud-est della baia di Haifa; Tell Keisan, il grande tell a 8 km a sud-est di Acri che archeologi francesi scavarono nel 1971–1976, occupato dall’antica età del Bronzo al periodo ellenistico e di nuovo in età bizantina; Tell Bir el-Gharbi a nord di esso; e Tel Kabri più avanti lungo la costa."
    - "«Or come Iabin, re di Hatsor, ebbe udito queste cose, mandò de’ messi a Iobab re di Madon, al re di Scimron, al re di Acsaf», e i re del nord si radunarono presso le acque di Merom, dove Giosuè piombò loro addosso e li inseguì fino a Sidone la grande. Nell’elenco dei trentun re sta «il re di Acsaf», e nell’eredità di Aser «il loro territorio comprendeva: Helkath, Hali, Beten, Acshaf», verso il Carmelo. Nient’altro se ne racconta, e il nome non sopravvive. Eusebio la pone nel villaggio di Chasalus ai piedi del monte Tabor, lo stesso luogo che indica per Chesullot, e sembra quindi aver confuso i due nomi."
    - "La piana è oggi la valle di Zabulon in Israele, fra Haifa e Acri, industriale sulla baia e coltivata nell’interno, con Tell Keisan tra i campi e Tel Regev accanto al Kison."
  pl:
    - "Akszaf było kananejskim miastem królewskim na równinie Akko, w losie Aszera. Znane jest dobrze spoza Biblii: Totmes III wymienia je wśród miast zdobytych w XV wieku p.n.e., jego władca Endaruta pisał do faraona w listach z Amarna i otrzymał polecenie strzeżenia miasta króla i przygotowania się na egipskich łuczników, a pisarz z XIII wieku wymienia je w papirusie Anastasi I wśród miast, które powinien znać posłaniec. Gdzie leżało, jest sporne. Mapa podaje Tel Regew (Tell el-Harbaj) nad Kiszonem na południowy wschód od Zatoki Hajfy; Tell Keisan, wielki tell 8 km na południowy wschód od Akki, który Francuzi badali w latach 1971–1976, zamieszkany od wczesnej epoki brązu do okresu hellenistycznego i ponownie w czasach bizantyjskich; leżący na północ od niego Tell Bir el-Gharbi; i Tel Kabri dalej na północ wybrzeża."
    - "„To gdy usłyszał Jabin, król Hasor, posłał do Johaba, króla Madon, i do króla Symron, i do króla Achsaf”, a królowie północy zebrali się u wód Merom, gdzie Jozue uderzył na nich i gonił ich aż do wielkiego Sydonu. W wykazie trzydziestu jeden królów figuruje „król Aksaf jeden”, a w dziedzictwie Aszera „I była granica ich: Helkat, i Chali, i Beten, i Achsaf”, biegnąca ku Karmelowi. Nic więcej o nim nie opowiedziano, a nazwa nie przetrwała. Euzebiusz umieszczał je we wsi Chasalus u stóp góry Tabor, tam gdzie umieszcza też Kislot, więc zdaje się, że pomylił te dwie nazwy."
    - "Równina jest dziś Doliną Zabulona w Izraelu między Hajfą a Akką, uprzemysłowioną nad zatoką i uprawianą w głębi lądu, z Tell Keisan wśród pól i Tel Regew obok Kiszonu."
  nl:
    - "Achsaf was een Kanaänitische koningsstad in de vlakte van Akko, in het lot van Aser. Het is ook buiten de Bijbel bekend: Thoetmosis III noemt het onder zijn veroveringen van de vijftiende eeuw v.Chr., zijn heerser Endaruta schreef in de Amarnabrieven aan de farao en kreeg het bevel de koningsstad te bewaken en de Egyptische boogschutters klaar te houden, en Papyrus Anastasi I (dertiende eeuw) noemt het onder de steden die een gezant kennen moest. Waar het lag, is omstreden: Tel Regev (Tell el-Harbaj) aan de Kison, ten zuidoosten van de Baai van Haifa; Tell Keisan, de grote heuvel 8 km ten zuidoosten van Akko, door Fransen opgegraven in 1971–1976 en bewoond van de vroege bronstijd tot in de hellenistische tijd en opnieuw in de Byzantijnse tijd; Tell Bir el-Gharbi ten noorden daarvan; en Tel Kabri verder aan de kust."
    - "“Het geschiedde daarna, als Jabin, de koning van Hazor, dit hoorde, zo zond hij tot Jobab, den koning van Madon, en tot den koning van Simron, en tot den koning van Achsaf”, en de koningen van het noorden verzamelden zich bij de wateren van Merom, waar Jozua hen overviel en tot het grote Sidon achtervolgde. In de lijst van de eenendertig koningen staat “de koning van Achsaf, een”, en in Asers erfdeel “hun landpale was Helkath, en Hali, en Beten, en Achsaf”, in de richting van de Karmel. Meer wordt er van de stad niet verteld, en de naam is niet bewaard. Eusebius plaatste het bij het dorp Chasalus aan de voet van de Tabor, waar hij ook Kesullot plaatst, zodat hij de twee namen lijkt te hebben verward."
    - "De vlakte is tegenwoordig de vallei van Zebulon in Israël tussen Haifa en Akko, aan de baai industrieel en landinwaarts bebouwd, met Tell Keisan tussen de akkers en Tel Regev naast de Kison."
  cs:
    - "Achšaf bylo kenaanské královské město na pláni Akko, v údělu Ašer. Je dobře známé i mimo Bibli: Thutmosis III. je uvádí mezi městy, která dobyl v 15. století př. n. l., jeho vládce Endaruta psal faraonovi v Amarnských listech a bylo mu řečeno, aby střežil královo město a připravil se na egyptské lučištníky, a písař 13. století je jmenuje v papyru Anastasi I mezi městy, která má posel znát. Kde stálo, je sporné. Mapa nabízí Tel Regev (Tell el-Harbaj) u Kíšonu jihovýchodně od Haifského zálivu; Tell Keisan, velký pahorek 8 km jihovýchodně od Akka, který francouzští archeologové kopali v letech 1971–1976, osídlený od rané doby bronzové do doby helénistické a znovu v době byzantské; Tell Bir el-Gharbi severně od něj; a Tel Kabri dále po pobřeží."
    - "„To když uslyšel Jabín, král Azor, poslal k Jobábovi, králi Mádon, a k králi Simron, a k králi Achzaf“ a králové severu se shromáždili u vod Merom, kde na ně Jozue udeřil a honil je až k Sidónu velikému. V soupisu jedenatřiceti králů stojí „král Achzaf jeden“ a v Ašerově dědictví „byla meze jejich: Helkat a Chali, a Beten, a Achzaf“, směrem ke Karmelu. Nic víc se o něm nevypráví a jméno se nezachovalo. Eusebios je umístil do vesnice Chasalus pod horou Tábor, kam klade i Kesulót, takže zřejmě obě jména zaměnil."
    - "Pláň je dnes Zebulunské údolí Izraele mezi Haifou a Akkem, u zálivu průmyslové a ve vnitrozemí obdělávané, s Tell Keisan mezi poli a Tel Regev u Kíšonu."
  sv:
    - "Akshaf var en kananeisk kungastad på Ackos slätt, i Ashers lott. Den är väl känd utanför Bibeln: Thutmosis III räknar upp den bland de städer han intog på 1400-talet f.Kr., dess härskare Endaruta skrev till farao i Amarnabreven och fick order att bevaka kungens stad och hålla sig redo för de egyptiska bågskyttarna, och en skriftlärd på 1200-talet f.Kr. nämner den i Papyrus Anastasi I bland de städer ett sändebud bör känna till. Var den låg är omstritt. Kartan anger Tel Regev (Tell el-Harbaj) vid Kishon sydost om Haifabukten; Tell Keisan, den stora kullen 8 km sydost om Akko som franska utgrävare grävde 1971–1976, bebodd från äldre bronsåldern till den hellenistiska tiden och åter under bysantinsk tid; Tell Bir el-Gharbi norr om den; och Tel Kabri längre norrut längs kusten."
    - "”Då nu Jabin, konungen i Hasor, hörde detta, sände han bud till Jobab, konungen i Madon, och till konungen i Simron och konungen i Aksaf”, och kungarna i norr samlades vid Meroms vatten, där Josua föll över dem och förföljde dem till Stora Sidon. I förteckningen över de trettioen kungarna står ”konungen i Aksaf en”, och i Ashers arvedel ”Och deras gräns omfattade Helkat, Hali, Beten, Aksaf” och löpte mot Karmel. Mer berättas inte om den, och namnet har inte överlevt. Eusebios placerade den vid byn Chasalus vid foten av Tabor, samma plats som han anger för Kesullot, så han tycks ha blandat ihop de två namnen."
    - "Slätten är i dag Sebulondalen i Israel mellan Haifa och Akko, industriell vid bukten och odlad inåt land, med Tell Keisan bland åkrarna och Tel Regev vid Kishon."
  nb:
    - "Aksjaf var en kana'anittisk kongeby på Akko-sletten, i Asjers lodd. Den er velkjent utenfor Bibelen: Tutmosis III regner den blant byene han tok på 1400-tallet f.Kr., herskeren Endaruta skrev til farao i Amarna-brevene og fikk beskjed om å vokte kongens by og gjøre seg klar for de egyptiske bueskytterne, og en skriver fra 1200-tallet nevner den i Papyrus Anastasi I blant byene et sendebud bør kjenne. Hvor den lå, er omstridt. Kartet tilbyr Tel Regev (Tell el-Harbaj) ved Kisjon sørøst for Haifabukta; Tell Keisan, den store tellen 8 km sørøst for Acre som franske utgravere gravde i 1971–1976, bebodd fra eldre bronsealder og inn i hellenistisk tid og igjen i bysantinsk tid; Tell Bir el-Gharbi nord for den; og Tel Kabri lenger opp langs kysten."
    - "«Da Jabin, kongen i Hasor, hørte dette, sendte han bud til Jobab, kongen i Madon, og til kongen i Simron og til kongen i Aksaf», og kongene i nord samlet seg ved Merom-vannet, der Josva overfalt dem og forfulgte dem til det store Sidon. I listen over de en og tretti kongene står «kongen i Aksaf én», og i Asjers arv lå «Helkat og Hali og Beten og Aksaf», på veien mot Karmel. Mer fortelles ikke om den, og navnet har ikke overlevd. Eusebius plasserte den ved landsbyen Chasalus ved foten av Tabor, samme sted som han oppgir for Kesullot, så han ser ut til å ha forvekslet de to navnene."
    - "Sletten er i dag Sebulon-dalen i Israel mellom Haifa og Acre, industriell ved bukta og oppdyrket innover i landet, med Tell Keisan blant åkrene og Tel Regev ved Kisjon."
  tl:
    - "Ang Achsaph ay maharlikang lungsod ng mga Cananeo sa kapatagan ng Acho, sa bahagi ni Aser. Kilala sa labas ng Biblia: nasa talaan ni Thutmose III ng mga sinakop niya noong ika-15 siglo BK, sumulat ang pinuno nitong si Endaruta sa Faraon sa mga liham ng Amarna at inutusang bantayan ang bayan ng hari at ihanda ang mga mamamanang Egipcio, at binanggit ito ng eskriba noong ika-13 siglo sa Papirus Anastasi I sa mga bayang dapat malaman ng sugo. Pinagtatalunan ang lugar. Alok ng mapa: Tel Regev (Tell el-Harbaj) sa tabi ng Cison sa timog-silangan ng Look ng Haifa; ang Tell Keisan, burol 8 km sa timog-silangan ng Acre na hinukay ng mga Pranses noong 1971–1976, tinirhan mula Maagang Panahon ng Tanso hanggang Helenistiko at muli noong Bisantino; ang Tell Bir el-Gharbi sa hilaga nito; at ang Tel Kabri na mas hilaga."
    - "“At nangyari nang mabalitaan ni Jabin na hari sa Hasor, na siya'y nagsugo kay Jobab na hari sa Madon, at sa hari sa Simron, at sa hari sa Achsaph”, at nagtipon ang mga hari sa hilaga sa tubig ng Merom, kung saan sila sinalakay ni Josue at hinabol hanggang sa malaking Sidon. Sa talaan ng tatlumpu't isang hari ay nakatayo “ang hari sa Achsaph, isa”, at sa mana ni Aser, “ang kanilang hangganan ay Helchat, at Hali, at Beten, at Axaph”, na patungo sa Carmelo. Wala nang ibang isinasalaysay tungkol dito, at hindi nananatili ang pangalan. Inilagay ito ni Eusebio sa nayon ng Chasalus sa paanan ng Bundok Thabor, ang lugar ding ibinibigay niya para sa Chesulloth, kaya mukhang napagpalit niya ang dalawang pangalan."
    - "Ang kapatagan ngayon ay ang Libis ng Zabulon ng Israel sa pagitan ng Haifa at Acre, industriyal sa tabi ng look at sinasaka sa loob ng lupain, na ang Tell Keisan ay nasa gitna ng mga bukid at ang Tel Regev sa tabi ng Cison."
  da:
    - "Aksjaf var en kana'anæisk kongeby på Akkos slette, i Asers lod. Den er velkendt uden for Bibelen: Thutmosis 3. opregner den blandt de byer, han indtog i 1400-tallet f.Kr., dens hersker Endaruta skrev til Farao i Amarna-brevene og fik besked om at vogte kongens by og gøre sig klar til de egyptiske bueskytter, og en skriver fra 1200-tallet nævner den i Papyrus Anastasi I blandt de byer, et sendebud bør kende. Hvor den lå, er omtvistet. Kortet tilbyder Tel Regev (Tell el-Harbaj) ved Kisjon sydøst for Haifabugten; Tell Keisan, den store tell 8 km sydøst for Acre, som franske udgravere gravede i 1971–1976, beboet fra tidlig bronzealder ind i den hellenistiske tid og igen i byzantinsk tid; Tell Bir el-Gharbi mod nord; og Tel Kabri længere oppe ad kysten."
    - "»Og det skete, der Jabin, Kongen af Hazor, hørte det, da sendte han til Jobab, Kongen af Madon, og til Kongen af Simron og til Kongen af Aksaf«, og kongerne i nord samledes ved Søen Merom, hvor Josva faldt over dem og forfulgte dem »indtil det store Zidon«. I fortegnelsen over de enogtredive konger står »Kongen af Aksaf een«, og i Asers arv var »deres Landemærke ... Helkath og Hali og Beten og Aksaf«, løbende mod Karmel. Mere fortælles der ikke om den, og navnet lever ikke. Eusebios placerede den ved landsbyen Chasalus ved foden af Tabor, samme sted som han angiver for Kesullot, så han synes at have forvekslet de to navne."
    - "Sletten er i dag Zebulon-dalen i Israel mellem Haifa og Acre, industrialiseret ved bugten og dyrket længere inde, med Tell Keisan mellem markerne og Tel Regev ved Kisjon."
  sr:
    - "Ахсаф је био хананејски краљевски град на равници Ако, у уделу Асировом. Добро је познат и изван Библије: Тутмес III га наводи међу градовима које је заузео у 15. веку п. н. е., његов владар Ендарута у писмима из Амарне писао је фараону и добио налог да чува краљев град и спреми се за египатске стрелце, а писар из 13. века именује га у Папирусу Анастази I међу градовима које посланик мора познавати. Где је стајао, спорно је. Карта нуди Тел Регев (Тел ел-Харбаџ) поред Кисона југоисточно од залива Хаифе; Тел Кејсан, велику хумку 8 км југоисточно од Акре коју су француски ископавачи копали 1971–1976, настањену од раног бронзаног доба до хеленистичког периода и поново у византијско доба; Тел Бир ел-Гарби северно од њега; и Тел Кабри даље уз обалу."
    - "„А кад то чу Јавин цар асорски, посла к Јоваву цару адонском и к цару имронском и к цару ахсавском“, и цареви севера окупише се код воде Мером, где је Исус ударио на њих и гонио их до Сидона великог. У списку од тридесет и једног цара стоји „цар ахсавски један“, а у наследству Асировом „међа им би: Хелкат и Алија и Ветен, и Ахсаф“, пружајући се ка Кармелу. Више се о њему ништа не прича, и име се није сачувало. Јевсевије га је смештао у село Хасалус у подножју Тавора, где смешта и Кесулот, па је, изгледа, побркао два имена."
    - "Равница је данас Завулонска долина у Израелу између Хаифе и Акре, индустријска на заливу а обрађена у унутрашњости, с Тел Кејсаном међу пољима и Тел Регевом поред Кисона."
  hu:
    - "Aksaf kánaáni királyi város volt az akkói síkságon, Áser sorsvetésében. A Biblián kívül is jól ismert: III. Thotmesz Kr. e. 15. századi hadjáratában elfoglalt városai között sorolja fel, uralkodója, Endaruta levelet írt a fáraónak az amarnai levelekben, és azt a parancsot kapta, hogy őrizze a király városát, és készítse fel magát az egyiptomi íjászokra, a 13. századi Anastasi I-papirusz írnoka pedig azon városok között említi, amelyeket egy követnek ismernie kell. Hogy hol állt, vitatott. A térkép Tel Regevet (Tell el-Harbaj) kínálja a Kison mellett, a Haifai-öböl délkeleti oldalán; a Tell Keisant, az Akkától 8 km-re délkeletre fekvő nagy halmot, amelyet francia ásatók 1971–1976 között tártak fel, és amely a korai bronzkortól a hellenisztikus korig, majd a bizánci korban ismét lakott volt; tőle északra a Tell Bir el-Gharbit; és a part mentén feljebb a Tel Kabrit."
    - "„Mikor pedig meghallotta ezt Jábin, Hásornak királya, külde Jobábhoz, Mádonnak királyához, és Simronnak királyához, és Aksáfnak királyához”, és az északi királyok Mérom vizeinél gyűltek össze, ahol Józsué rájuk rontott, és a nagy Szidónig üldözte őket. A harmincegy király jegyzékében szerepel „Aksáfnak királya egy”, Áser örökségében pedig „lőn az ő határuk: Helkath, Háli, Beten és Aksáf”, a Kármel felé haladva. Többet nem mondanak róla, a név pedig nem maradt fenn. Euszébiosz a Tábor-hegy alatti Khaszalusz faluba helyezte, oda, ahová Kiszlótot is teszi, így úgy tűnik, összekeverte a két nevet."
    - "A síkság ma Izráel Zebulon-völgye Haifa és Akka között, az öböl mentén iparvidék, beljebb mezőgazdasági terület, a szántók között a Tell Keisannal, a Kison mellett pedig a Tel Regevvel."
  fi:
    - "Aksaf oli kanaanilainen kuningaskaupunki Akkon tasangolla, Asserin arvan alueella. Se tunnetaan hyvin Raamatun ulkopuolelta: Tutmosis III luettelee sen valloittamiensa kaupunkien joukossa 1400-luvulla eaa., sen hallitsija Endaruta kirjoitti faraolle Amarna-kirjeissä ja sai käskyn vartioida kuninkaan kaupunkia ja valmistautua egyptiläisten jousimiesten tuloon, ja 1200-luvun kirjuri nimeää sen Anastasi I -papyruksessa niiden kaupunkien joukossa, jotka lähettilään tulee tuntea. Sijainti on kiistanalainen. Kartalla on Tel Regev (Tell el-Harbaj) Kisonin varrella Haifanlahden kaakkoispuolella; Tell Keisan, suuri kumpu 8 km Acresta kaakkoon, jota ranskalaiset kaivoivat 1971–1976 ja joka oli asuttu varhaispronssikaudelta hellenistiselle ajalle ja uudelleen bysanttilaisella ajalla; sen pohjoispuolella Tell Bir el-Gharbi; ja kauempana rannikolla Tel Kabri."
    - "”Kun Jaabin, Haasorin kuningas, sen kuuli, lähetti hän sanan Joobabille, Maadonin kuninkaalle, ja Simronin kuninkaalle ja Aksafin kuninkaalle”, ja pohjoisen kuninkaat kokoontuivat Meromin vesille, missä Joosua kävi heidän kimppuunsa ja ajoi heitä takaa suureen Sidoniin. Kolmenkymmenenyhden kuninkaan luettelossa on ”Aksafin kuningas yksi”, ja Asserin perintöosassa ”heidän alueellaan tuli olemaan Helkat, Hali, Beten ja Aksaf”, Karmelia kohti. Muuta siitä ei kerrota, eikä nimi ole säilynyt. Eusebios sijoitti sen Taborvuoren alapuolella olevaan Chasaluksen kylään, jonka hän antaa myös Kesullotille, joten hän näyttää sekoittaneen nimet."
    - "Tasanko on nykyisin Israelin Sebulonin laakso Haifan ja Acren välillä, lahden rannalla teollisuusaluetta ja sisämaassa viljelysmaata, ja Tell Keisan on peltojen keskellä ja Tel Regev Kisonin varrella."
  vi:
    - "Ạc-sáp là một kinh thành của người Ca-na-an trên đồng bằng A-cô, thuộc phần đất của A-se. Thành được biết đến nhiều ngoài Kinh Thánh: Thutmose III liệt kê nó trong số các thành ông chiếm vào thế kỷ 15 TCN, người cai trị nó là Endaruta đã viết thư cho Pha-ra-ôn trong các thư Amarna và được dặn phải canh giữ thành của nhà vua và chuẩn bị cho các cung thủ Ai Cập, và một văn sĩ ở thế kỷ 13 TCN nêu tên nó trong Papyrus Anastasi I trong số các thành mà một sứ giả cần biết. Thành nằm ở đâu thì còn tranh cãi. Bản đồ đưa ra Tel Regev (Tell el-Harbaj) bên sông Ki-sôn phía đông nam vịnh Haifa; Tell Keisan, gò lớn cách Acre 8 km về phía đông nam mà các nhà khai quật người Pháp đã đào trong những năm 1971–1976, có người ở từ đầu thời Đồ Đồng cho đến thời Hy Lạp hóa và lại có người ở vào thời Byzantine; Tell Bir el-Gharbi ở phía bắc của nó; và Tel Kabri xa hơn dọc bờ biển."
    - "“Vừa khi Gia-bin, vua Hát-so, đã hay các sự này, bèn sai sứ giả đến cùng Giô-báp, vua Ma-đôn, đến cùng Sim-rôn, vua Ạc-sáp”, và các vua phương bắc nhóm lại tại nước Mê-rôm, nơi Giô-suê xông vào họ và đuổi theo đến Si-đôn lớn. Trong bản liệt kê ba mươi mốt vua có “vua Ạc-sáp”, và trong sản nghiệp của A-se: “Giới hạn họ là Hên-cát, Ha-li, Bê-ten, Ạc-sáp”, chạy về phía Cạt-mên. Không có điều gì khác được kể về nó, và tên không còn tồn tại. Eusebius đặt nó tại làng Chasalus dưới núi Tha-bô, nơi ông cũng nêu cho Kê-su-lốt, nên dường như ông đã lẫn lộn hai tên ấy."
    - "Đồng bằng ngày nay là thung lũng Sa-bu-lôn của Israel giữa Haifa và Acre, mang tính công nghiệp ở phía vịnh và được canh tác ở phía nội địa, với Tell Keisan giữa các cánh đồng và Tel Regev bên sông Ki-sôn."
  ro:
    - "Acșaf era o cetate regală canaanită pe câmpia Acoului, în partea lui Așer. Este bine cunoscută și în afara Bibliei: Tutmes al III-lea o enumeră printre cetățile pe care le-a luat în secolul al XV-lea î.Hr., conducătorul ei Endaruta i-a scris faraonului în scrisorile de la Amarna și i s-a spus să păzească cetatea regelui și să facă pregătiri pentru sosirea arcașilor egipteni, iar un scrib din secolul al XIII-lea o numește în Papirusul Anastasi I printre cetățile pe care un sol trebuie să le cunoască. Locul unde se afla este disputat. Harta propune Tel Regev (Tell el-Harbaj), lângă Chison, la sud-est de golful Haifa; Tell Keisan, tellul mare aflat la 8 km sud-est de Acra, săpat de arheologi francezi în 1971–1976, locuit din epoca bronzului timpuriu până în epoca elenistică și din nou în vremea bizantină; Tell Bir el-Gharbi, la nord de acesta; și Tel Kabri, mai departe pe coastă."
    - "Iar Iabin, regele Hațorului, după ce a auzit acestea, „a trimis la Iovav împăratul Madonului și la împăratul Semeronului și la împăratul Ashiafului”, iar regii din nord s-au adunat la apele Merom, unde Iosua a căzut asupra lor și i-a urmărit până la Sidonul cel mare. În lista celor treizeci și unu de regi figurează regele din Acșaf, unul dintre ei, iar în moștenirea lui Așer „au fost hotarele lor: Elcat, Ali, Veden, Ahasaf”, în direcția Carmelului. Nimic mai mult nu se spune despre el, iar numele nu s-a păstrat. Eusebiu l-a așezat la satul Chasalus, sub muntele Tabor, locul pe care îl indică și pentru Chesulot, așa că pare să fi confundat cele două nume."
    - "Câmpia este astăzi valea Zabulonului din Israel, între Haifa și Acra, industrială pe golf și cultivată spre interior, cu Tell Keisan printre ogoare și Tel Regev lângă Chison."
  bg:
    - "Ахсаф бил ханаански царски град на равнината на Акон, в дела на Асир. Той е добре известен и извън Библията: Тутмос III го включва сред градовете, които превзел през XV в. пр.н.е., неговият владетел Ендарута писал до фараона в Амарнските писма и му било казано да пази царския град и да се приготви за идването на египетските стрелци, а писар от XIII в. пр.н.е. го назовава в папирус „Анастаси I“ сред градовете, които един пратеник трябва да познава. Къде е стоял, е спорно. Картата предлага Тел Регев (Тел ел-Харбадж) до Кисон, югоизточно от Хайфския залив; Тел Кейсан, голямата могила на 8 км югоизточно от Акре, разкопана от французи през 1971–1976 г., обитавана от ранната бронзова епоха до елинистическия период и отново във византийско време; Тел Бир ел-Гарби на север от нея; и Тел Кабри по-нагоре по крайбрежието."
    - "„И като чу това Явин Асорский цар, прати на Иовава Мадонския цар, и на Симвронския цар, и на Ахсафския цар“, и царете на север се събрали при водите на Мером, където Иисус Навин ги нападнал и ги прогонил до големия Сидон. В списъка на тридесет и един царе стои „Ахсафский цар, един“, а в наследството на Асир „пределът им беше Хелкат, и Али, и Ветен, и Ахсаф“, и стигал към Кармил. Нищо повече не се разказва за него и името не е оцеляло. Евсевий го поставял при селото Хазалус под Тавор, същото място, което посочва и за Кесулот, така че изглежда е объркал двете имена."
    - "Равнината днес е долината на Завулон в Израил между Хайфа и Акре — индустриална при залива и обработвана навътре, с Тел Кейсан сред нивите и Тел Регев до Кисон."
