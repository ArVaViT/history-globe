body:
  en:
    - "Achshaph was a Canaanite royal city on the plain of Acco, in the lot of Asher. It is well known outside the Bible: Thutmose III lists it among the towns he took in the fifteenth century BC, its ruler Endaruta wrote to Pharaoh in the Amarna letters and was told to guard the king's town and make ready for the Egyptian archers, and a scribe of the thirteenth century names it in Papyrus Anastasi I among the towns an envoy should know. Where it stood is disputed. The map offers Tel Regev (Tell el-Harbaj) beside the Kishon south-east of Haifa Bay; Tell Keisan, the large mound 8 km south-east of Acre that French excavators dug in 1971–1976, occupied from the Early Bronze Age into the Hellenistic period and again in Byzantine times; Tell Bir el-Gharbi to its north; and Tel Kabri further up the coast. Eusebius placed it at the foot of Mount Tabor, which is surely a confusion."
    - "“And it came to pass, when Jabin king of Hazor had heard those things, that he sent to Jobab king of Madon, and to the king of Shimron, and to the king of Achshaph”, and the kings of the north gathered at the waters of Merom, where Joshua fell on them and chased them to great Sidon. In the roll of the thirty-one kings stands “the king of Achshaph, one”, and in Asher's inheritance “their border was Helkath, and Hali, and Beten, and Achshaph”, running towards Carmel. Nothing more is told of it, and the name does not survive."
    - "The plain today is the Zebulun valley of Israel between Haifa and Acre, industrial on the bay and farmed inland, with Tell Keisan among the fields and Tel Regev beside the Kishon."
  ru:
    - "Ахсаф — ханаанский царский город на равнине Акко, в уделе Асира. Вне Библии он хорошо известен: Тутмос III числит его среди городов, взятых им в XV веке до н. э., его правитель Эндарута писал фараону в письмах из Амарны и получил приказ охранять город царя и приготовиться к приходу египетских лучников, а писец XIII века называет его в папирусе Анастаси I среди городов, которые должен знать гонец. Где он стоял, спорно. На карте предложены Тель-Регев (Телль-эль-Харбадж) у Киссона к юго-востоку от Хайфского залива; Телль-Кейсан — большой холм в 8 км к юго-востоку от Акко, который французские археологи копали в 1971–1976 годах, заселённый от раннего бронзового века до эллинистического времени и вновь в византийскую эпоху; Телль-Бир-эль-Гарби к северу от него и Тель-Кабри дальше по берегу. Евсевий поместил его у подножия Фавора, что наверняка путаница."
    - "«Услышав сие, Иавин, царь Асорский, послал к Иоваву, царю Мадонскому, и к царю Шимронскому, и к царю Ахсафскому», и цари севера собрались при водах Меромских, где Иисус Навин напал на них и преследовал до Сидона великого. В перечне тридцати одного царя стоит «один царь Ахсафа», а в уделе Асира «пределом их были: Хелкаф, Хали, Ветен и Ахсаф», и граница идёт к Кармилу. Больше о нём ничего не рассказано, и имя не сохранилось."
    - "Равнина сегодня — израильская долина Звулун между Хайфой и Акко, промышленная у залива и земледельческая в глубине; Телль-Кейсан стоит среди полей, а Тель-Регев — у Киссона."
  uk:
    - "Ахшаф був ханаанським царським містом на рівнині Акко, в уділі Асіра. Він добре відомий і поза Біблією: Тутмос III включає його до міст, узятих у XV столітті до н. е., його володар Ендарута писав фараонові в листах з Амарни й отримав наказ охороняти царське місто та готувати його до приходу єгипетських лучників, а писар XIII століття називає його в папірусі Анастасі I серед міст, які мусить знати посланець. Де він стояв — спірне. На мапі пропонують Тель-Регев (Телль-ель-Харбадж) біля Кішону на південний схід від Хайфської затоки; Телль-Кейсан, великий пагорб за 8 км на південний схід від Акко, який французькі археологи розкопували в 1971–1976 рр., заселений від ранньої бронзової доби до елліністичної і знову за візантійських часів; Телль-Бір-ель-Гарбі на північ від нього; і Тель-Кабрі далі вгору по узбережжю. Євсевій розміщував його біля підніжжя гори Фавор, що, певно, є плутаниною."
    - "«Як же дочувсь про се Евин, царь Асорський, післав він посли до Йобаба, царя Мадонського, та до царя Симронського, та до царя Ахсафського», і царі півночі зібралися при водах Меромських, де Ісус Навин напав на них і гнав їх «до Сидону великого». У переліку тридцяти одного царя стоїть «царь Ахсафський, один», а в спадщині Асіра «границї їх були Хелкат, Халі, Бетен і Ахсаф», що йшли в бік Кармеля. Більше про нього нічого не розповідається, і назва не збереглася."
    - "Рівнина нині — Завулонська долина Ізраїлю між Хайфою та Акко, промислова над затокою та оброблювана вглибині, із Телль-Кейсаном серед полів і Тель-Регевом поряд із Кішоном."
  es:
    - "Acsaf era una ciudad real cananea en la llanura de Aco, en el lote de Aser. Es bien conocida fuera de la Biblia: Tutmosis III la incluye entre las que tomó en el siglo XV a. C., su gobernante Endaruta escribió al faraón en las cartas de Amarna, donde se le ordenó guardar la ciudad del rey y preparar a los arqueros egipcios, y un escriba del siglo XIII la nombra en el papiro Anastasi I entre las que debía conocer un enviado. Se discute dónde estuvo. El mapa ofrece Tel Regev (Tell el-Harbaj), junto al Cisón, al sudeste de la bahía de Haifa; Tell Keisan, montículo a 8 km al sudeste de Acre estudiado por franceses en 1971–1976 y ocupado desde la Edad del Bronce Antiguo hasta el período helenístico y de nuevo en época bizantina; Tell Bir el-Gharbi, al norte de este; y Tel Kabri, más arriba en la costa. Eusebio la situó al pie del monte Tabor, seguramente una confusión."
    - "Cuando Jabín rey de Hasor «envió mensaje á Jobab rey de Madón, y al rey de Simrom, y al rey de Achsaph», los reyes del norte se reunieron junto a las aguas de Merom, donde Josué cayó sobre ellos y los persiguió hasta Sidón la grande. En la lista de los treinta y un reyes figura «el rey de Achsaph, otro», y en la heredad de Aser «su término fué Helchât, y Halí, y Betén, y Axaph», en dirección al Carmelo. Nada más se cuenta de ella, y el nombre no sobrevive."
    - "La llanura es hoy el valle de Zabulón, en Israel, entre Haifa y Acre, industrial en la bahía y cultivada tierra adentro, con Tell Keisan entre los campos y Tel Regev junto al Cisón."
  pt:
    - "Acsafe era uma cidade real cananeia na planície de Aco, no lote de Aser. É bem conhecida fora da Bíblia: Tutmés III a lista entre as cidades que tomou no século XV a.C., o seu governante Endaruta escreveu ao Faraó nas cartas de Amarna e foi instruído a guardar a cidade do rei e a preparar-se para os arqueiros egípcios, e um escriba do século XIII a nomeia no Papiro Anastasi I entre as cidades que um enviado deveria conhecer. Onde ficava é discutido. O mapa oferece Tel Regev (Tell el-Harbaj), junto ao Quisom, a sudeste da baía de Haifa; Tell Keisan, o grande montículo a 8 km a sudeste de Acre, que escavadores franceses exploraram em 1971–1976, ocupado desde a Idade do Bronze Antigo até o período helenístico e de novo na época bizantina; Tell Bir el-Gharbi, ao norte dele; e Tel Kabri, mais acima na costa. Eusébio a situou ao pé do monte Tabor, o que certamente é confusão."
    - "“Quando Jabim, rei de Hazor, ouviu isso, enviou mensageiros a Jobabe, rei de Madom, ao rei de Sinrom, ao rei de Acsafe”, e os reis do norte se reuniram nas águas de Merom, onde Josué caiu sobre eles e os perseguiu até a grande Sidom. No rol dos trinta e um reis consta “o rei de Acsafe, um”, e na herança de Aser “a sua fronteira foi Helcate, Hali, Béten, Acsafe”, rumo ao Carmelo. Nada mais se conta dela, e o nome não sobrevive."
    - "A planície é hoje o vale de Zebulom, em Israel, entre Haifa e Acre, industrial junto à baía e cultivada no interior, com Tell Keisan entre os campos e Tel Regev junto ao Quisom."
  de:
    - "Achschaf war eine kanaanäische Königsstadt in der Ebene von Akko, im Los Assers. Auch außerhalb der Bibel ist sie bekannt: Thutmosis III. führt sie im 15. Jahrhundert v. Chr. unter seinen Eroberungen auf, ihr Herrscher Endaruta schrieb in den Amarna-Briefen dem Pharao und sollte die Königsstadt bewachen und sich auf die ägyptischen Bogenschützen vorbereiten, und im Papyrus Anastasi I nennt ein Schreiber des 13. Jahrhunderts sie unter den Städten, die ein Gesandter kennen sollte. Ihre Lage ist umstritten: Tel Regev (Tell el-Harbaj) am Kischon südöstlich der Bucht von Haifa; Tell Keisan, der große Hügel 8 km südöstlich von Akko, 1971–1976 französisch ausgegraben, von der Frühbronzezeit bis in die hellenistische und wieder in byzantinischer Zeit besiedelt; Tell Bir el-Gharbi nördlich davon; Tel Kabri weiter an der Küste. Eusebius setzte sie an den Fuß des Tabor, gewiss eine Verwechslung."
    - "„Da aber Jabin, der König zu Hazor, solches hörte, sandte er zu Jobab, dem König zu Madon, und zum König zu Simron und zum König zu Achsaph“, und die Könige des Nordens versammelten sich an den Wassern von Merom, wo Josua sie überfiel und bis zum großen Sidon jagte. In der Liste der einunddreißig Könige steht „der König zu Achsaph“, und im Erbteil Assers „war ihr Gebiet Helkath, Hali, Beten, Achsaph“, in Richtung Karmel. Mehr wird von ihr nicht erzählt, und der Name hat sich nicht erhalten."
    - "Die Ebene ist heute das Sebulontal Israels zwischen Haifa und Akko, an der Bucht industriell genutzt, im Landesinnern landwirtschaftlich, mit Tell Keisan zwischen den Feldern und Tel Regev am Kischon."
  fr:
    - "Acschaph était une ville royale cananéenne de la plaine d’Acco, dans le lot d’Aser. Elle est bien connue hors de la Bible : Thoutmosis III la range parmi les villes qu’il prit au XVe siècle av. J.-C., son souverain Endaruta écrivit au pharaon dans les lettres d’Amarna et reçut l’ordre de garder la ville du roi et de se tenir prêt pour les archers égyptiens, et un scribe du XIIIe siècle la nomme dans le papyrus Anastasi I parmi les villes qu’un envoyé doit connaître. Son site est discuté. On propose Tel Regev (Tell el-Harbaj), au bord du Kison, au sud-est de la baie de Haïfa ; Tell Keisan, grand tertre à 8 km au sud-est d’Acre, fouillé par des Français en 1971-1976 et occupé du Bronze ancien à l’époque hellénistique, puis de nouveau à l’époque byzantine ; Tell Bir el-Gharbi, au nord ; et Tel Kabri, plus haut sur la côte. Eusèbe la plaçait au pied du mont Thabor, sûrement par confusion."
    - "« Jabin, roi de Hatsor, ayant appris ces choses, envoya des messagers à Jobab, roi de Madon, au roi de Schimron, au roi d’Acschaph » ; les rois du nord se rassemblèrent près des eaux de Mérom, où Josué fondit sur eux et les poursuivit jusqu’à Sidon la grande. Dans la liste des trente et un rois figure « le roi d’Acschaph, un », et dans l’héritage d’Aser, « leur limite passait par Helkath, Hali, Béthen, Acschaph », en direction du Carmel. On n’en dit rien de plus, et le nom n’a pas survécu."
    - "La plaine est aujourd’hui la vallée de Zabulon, en Israël, entre Haïfa et Acre, industrielle sur la baie et cultivée à l’intérieur, avec Tell Keisan parmi les champs et Tel Regev à côté du Kison."
  it:
    - "Acsaf era una città reale cananea sulla piana di Acco, nel lotto di Aser. È ben nota anche fuori della Bibbia: Tutmosi III la elenca fra le città da lui prese nel XV secolo a.C., il suo sovrano Endaruta scrisse al faraone nelle lettere di Amarna e gli fu detto di custodire la città del re e di preparare gli arcieri egiziani, e uno scriba del XIII secolo la nomina nel Papiro Anastasi I tra le città che un inviato doveva conoscere. Dove sorgesse è discusso. La carta offre Tel Regev (Tell el-Harbaj) presso il Kison a sud-est della baia di Haifa; Tell Keisan, il grande tell a 8 km a sud-est di Acri che archeologi francesi scavarono nel 1971–1976, occupato dall’antica età del Bronzo al periodo ellenistico e di nuovo in età bizantina; Tell Bir el-Gharbi a nord di esso; e Tel Kabri più avanti lungo la costa. Eusebio la pose ai piedi del monte Tabor, certamente per confusione."
    - "«Or come Iabin, re di Hatsor, ebbe udito queste cose, mandò de’ messi a Iobab re di Madon, al re di Scimron, al re di Acsaf», e i re del nord si radunarono presso le acque di Merom, dove Giosuè piombò loro addosso e li inseguì fino a Sidone la grande. Nell’elenco dei trentun re sta «il re di Acsaf», e nell’eredità di Aser «il loro territorio comprendeva: Helkath, Hali, Beten, Acshaf», verso il Carmelo. Nient’altro se ne racconta, e il nome non sopravvive."
    - "La piana è oggi la valle di Zabulon in Israele, fra Haifa e Acri, industriale sulla baia e coltivata nell’interno, con Tell Keisan tra i campi e Tel Regev accanto al Kison."
  pl:
    - "Akszaf było kananejskim miastem królewskim na równinie Akko, w losie Aszera. Znane jest dobrze spoza Biblii: Totmes III wymienia je wśród miast zdobytych w XV wieku p.n.e., jego władca Endaruta pisał do faraona w listach z Amarna i otrzymał polecenie strzeżenia miasta króla i przygotowania się na egipskich łuczników, a pisarz z XIII wieku wymienia je w papirusie Anastasi I wśród miast, które powinien znać posłaniec. Gdzie leżało, jest sporne. Mapa podaje Tel Regew (Tell el-Harbaj) nad Kiszonem na południowy wschód od Zatoki Hajfy; Tell Keisan, wielki tell 8 km na południowy wschód od Akki, który Francuzi badali w latach 1971–1976, zamieszkany od wczesnej epoki brązu do okresu hellenistycznego i ponownie w czasach bizantyjskich; leżący na północ od niego Tell Bir el-Gharbi; i Tel Kabri dalej na północ wybrzeża. Euzebiusz umieszczał je u stóp góry Tabor, co jest zapewne pomyłką."
    - "„To gdy usłyszał Jabin, król Hasor, posłał do Johaba, króla Madon, i do króla Symron, i do króla Achsaf”, a królowie północy zebrali się u wód Merom, gdzie Jozue uderzył na nich i gonił ich aż do wielkiego Sydonu. W wykazie trzydziestu jeden królów figuruje „król Aksaf jeden”, a w dziedzictwie Aszera „I była granica ich: Helkat, i Chali, i Beten, i Achsaf”, biegnąca ku Karmelowi. Nic więcej o nim nie opowiedziano, a nazwa nie przetrwała."
    - "Równina jest dziś Doliną Zabulona w Izraelu między Hajfą a Akką, uprzemysłowioną nad zatoką i uprawianą w głębi lądu, z Tell Keisan wśród pól i Tel Regew obok Kiszonu."
  nl:
    - "Achsaf was een Kanaänitische koningsstad in de vlakte van Akko, in het lot van Aser. Het is ook buiten de Bijbel bekend: Thoetmosis III noemt het onder zijn veroveringen van de vijftiende eeuw v.Chr., zijn heerser Endaruta schreef in de Amarnabrieven aan de farao en kreeg het bevel de koningsstad te bewaken en de Egyptische boogschutters klaar te houden, en Papyrus Anastasi I (dertiende eeuw) noemt het onder de steden die een gezant kennen moest. Waar het lag, is omstreden: Tel Regev (Tell el-Harbaj) aan de Kison, ten zuidoosten van de Baai van Haifa; Tell Keisan, de grote heuvel 8 km ten zuidoosten van Akko, door Fransen opgegraven in 1971–1976 en bewoond van de vroege bronstijd tot in de hellenistische tijd en opnieuw in de Byzantijnse tijd; Tell Bir el-Gharbi ten noorden daarvan; en Tel Kabri verder aan de kust. Eusebius plaatste het aan de voet van de Tabor, stellig een vergissing."
    - "“Het geschiedde daarna, als Jabin, de koning van Hazor, dit hoorde, zo zond hij tot Jobab, den koning van Madon, en tot den koning van Simron, en tot den koning van Achsaf”, en de koningen van het noorden verzamelden zich bij de wateren van Merom, waar Jozua hen overviel en tot het grote Sidon achtervolgde. In de lijst van de eenendertig koningen staat “de koning van Achsaf, een”, en in Asers erfdeel “hun landpale was Helkath, en Hali, en Beten, en Achsaf”, in de richting van de Karmel. Meer wordt er van de stad niet verteld, en de naam is niet bewaard."
    - "De vlakte is tegenwoordig de vallei van Zebulon in Israël tussen Haifa en Akko, aan de baai industrieel en landinwaarts bebouwd, met Tell Keisan tussen de akkers en Tel Regev naast de Kison."
  cs:
    - "Achšaf bylo kenaanské královské město na pláni Akko, v údělu Ašer. Je dobře známé i mimo Bibli: Thutmosis III. je uvádí mezi městy, která dobyl v 15. století př. n. l., jeho vládce Endaruta psal faraonovi v Amarnských listech a bylo mu řečeno, aby střežil královo město a připravil se na egyptské lučištníky, a písař 13. století je jmenuje v papyru Anastasi I mezi městy, která má posel znát. Kde stálo, je sporné. Mapa nabízí Tel Regev (Tell el-Harbaj) u Kíšonu jihovýchodně od Haifského zálivu; Tell Keisan, velký pahorek 8 km jihovýchodně od Akka, který francouzští archeologové kopali v letech 1971–1976, osídlený od rané doby bronzové do doby helénistické a znovu v době byzantské; Tell Bir el-Gharbi severně od něj; a Tel Kabri dále po pobřeží. Eusebios je umístil k úpatí hory Tábor, což je jistě záměna."
    - "„To když uslyšel Jabín, král Azor, poslal k Jobábovi, králi Mádon, a k králi Simron, a k králi Achzaf“ a králové severu se shromáždili u vod Merom, kde na ně Jozue udeřil a honil je až k Sidónu velikému. V soupisu jedenatřiceti králů stojí „král Achzaf jeden“ a v Ašerově dědictví „byla meze jejich: Helkat a Chali, a Beten, a Achzaf“, směrem ke Karmelu. Nic víc se o něm nevypráví a jméno se nezachovalo."
    - "Pláň je dnes Zebulunské údolí Izraele mezi Haifou a Akkem, u zálivu průmyslové a ve vnitrozemí obdělávané, s Tell Keisan mezi poli a Tel Regev u Kíšonu."
  sv:
    - "Akshaf var en kananeisk kungastad på Ackos slätt, i Ashers lott. Den är väl känd utanför Bibeln: Thutmosis III räknar upp den bland de städer han intog på 1400-talet f.Kr., dess härskare Endaruta skrev till farao i Amarnabreven och fick order att bevaka kungens stad och hålla sig redo för de egyptiska bågskyttarna, och en skriftlärd på 1200-talet f.Kr. nämner den i Papyrus Anastasi I bland de städer ett sändebud bör känna till. Var den låg är omstritt. Kartan anger Tel Regev (Tell el-Harbaj) vid Kishon sydost om Haifabukten; Tell Keisan, den stora kullen 8 km sydost om Akko som franska utgrävare grävde 1971–1976, bebodd från äldre bronsåldern till den hellenistiska tiden och åter under bysantinsk tid; Tell Bir el-Gharbi norr om den; och Tel Kabri längre norrut längs kusten. Eusebios placerade den vid foten av Tabor, vilket säkert är en sammanblandning."
    - "”Då nu Jabin, konungen i Hasor, hörde detta, sände han bud till Jobab, konungen i Madon, och till konungen i Simron och konungen i Aksaf”, och kungarna i norr samlades vid Meroms vatten, där Josua föll över dem och förföljde dem till Stora Sidon. I förteckningen över de trettioen kungarna står ”konungen i Aksaf en”, och i Ashers arvedel ”Och deras gräns omfattade Helkat, Hali, Beten, Aksaf” och löpte mot Karmel. Mer berättas inte om den, och namnet har inte överlevt."
    - "Slätten är i dag Sebulondalen i Israel mellan Haifa och Akko, industriell vid bukten och odlad inåt land, med Tell Keisan bland åkrarna och Tel Regev vid Kishon."
