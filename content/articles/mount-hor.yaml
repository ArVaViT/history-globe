# Overview article (ADR 0007). Mainstream facts only; the site is disputed, and the candidates are given without choosing one.
id: mount-hor
place: ad8027f
title:
  en: "Mount Hor"
  ru: "Гора Ор"
  uk: "Гора Гор"
  es: "Monte Hor"
  pt: "Monte Hor"
  de: "Berg Hor"
  fr: "Mont Hor"
  it: "Monte Or"
  pl: "Góra Hor"
  nl: "Hor"
  cs: "Hora Hor"
body:
  en:
    - "Mount Hor is the mountain “by the coast of the land of Edom” where Aaron died. From Kadesh the whole congregation came to Mount Hor, and there the LORD told Moses that Aaron would not enter the land because of the rebellion at Meribah. Moses, Aaron and Eleazar went up “in the sight of all the congregation”; Moses stripped Aaron of his garments and put them on Eleazar, “and Aaron died there in the top of the mount”, and Israel mourned him thirty days. The list of stations dates his death to the first day of the fifth month of the fortieth year after the exodus, at the age of a hundred and twenty-three. From Mount Hor Israel set out “by the way of the Red sea, to compass the land of Edom”. Deuteronomy, however, places Aaron's death at Moserah, perhaps a camp at the mountain's foot, perhaps another tradition; Moses is told he will die “as Aaron thy brother died in mount Hor”."
    - "Where the mountain stood is disputed. Josephus says Aaron died on one of the high mountains that enclose Petra, and Jewish, Christian and Muslim tradition settled on Jebel Harun, “Aaron's mountain”, the highest peak above the city at about 1,350 m. On its upper slope a church and monastery of St Aaron stood from the fifth century, named in a Petra papyrus of 573 and excavated by the Finnish Jabal Harun Project from 1997; on the summit a Mamluk shrine with a white dome, restored under Sultan al-Nasir Muhammad, marks the tomb. Many scholars object that Jebel Harun lies in the heart of Edom, not on its border, and look instead to the edge of the wilderness of Zin: Har Zin, or hills nearer Kadesh-barnea such as Imaret el-Khureisheh, Jebel es-Sabha and Jebel el-Hamrah; Jebel Madurah was H. C. Trumbull's choice in 1884. Nothing found so far settles the question."
    - "Another Mount Hor marks the northern border of the land in Numbers 34, between the Great Sea and the entrance of Hamath, a peak of the Lebanon range that no one has identified. Today Jebel Harun, reached by a long trail from Petra, is a place of pilgrimage for all three faiths, its white shrine visible from almost everywhere in the ruins; Har Zin is a bare height in the Negev of Israel above the Zin valley."
  ru:
    - "Гора Ор — гора «у пределов земли Едомской», на которой умер Аарон. От Кадеса всё общество пришло к горе Ор, и там Господь сказал Моисею, что Аарон не войдёт в землю из-за непокорности у вод Меривы. Моисей, Аарон и Елеазар взошли на гору «в глазах всего общества»; Моисей снял с Аарона одежды и облёк в них Елеазара, «и умер там Аарон на вершине горы», и Израиль оплакивал его тридцать дней. Перечень станов датирует его смерть первым днём пятого месяца сорокового года по исходе из Египта, в возрасте ста двадцати трёх лет. От горы Ор Израиль отправился «путем Чермного моря, чтобы миновать землю Едома». Второзаконие, однако, помещает смерть Аарона в Мозер, что читатели понимали как стан у подножия горы или как иное предание; Моисею сказано, что он умрёт, «как умер Аарон, брат твой, на горе Ор»."
    - "Где стояла гора — спорно. Иосиф Флавий говорит, что Аарон умер на одной из высоких гор, окружающих Петру, и иудейское, христианское и мусульманское предание остановилось на Джебель-Харуне, «горе Аарона», высочайшей вершине над городом, около 1350 м. На её верхнем склоне с V века стояли церковь и монастырь святого Аарона, названные в петрском папирусе 573 года и раскопанные финским проектом «Джабаль-Харун» с 1997 года; на вершине гробницу отмечает мамлюкское святилище с белым куполом, восстановленное при султане ан-Насире Мухаммаде. Многие учёные возражают, что Джебель-Харун лежит в сердце Едома, а не на его границе, и смотрят на край пустыни Син: Хар-Цин или холмы ближе к Кадес-Варни — Имарет-эль-Хурейше, Джебель-эс-Сабха и Джебель-эль-Хамра; Джебель-Мадура был выбором Г. К. Трамбулла в 1884 году. Ничто из найденного пока вопроса не решает."
    - "Другая гора Ор обозначает в 34-й главе Чисел северную границу земли, между Великим морем и входом в Емаф, — вершина Ливанского хребта, которую никто не отождествил. Сегодня Джебель-Харун, куда ведёт долгая тропа из Петры, — место паломничества для всех трёх вер, его белое святилище видно почти отовсюду среди развалин; Хар-Цин — голая высота в израильском Негеве над долиной Цин."
  uk:
    - "Гора Гор — гора «на границї землї Едомської», де помер Аарон. З Кадеса вся громада прийшла до гори Гор, і там Господь сказав Мойсеєві, що Аарон не ввійде в землю через бунт при Мериві. Мойсей, Аарон і Елеазар зійшли на гору «перед очима в усієї громади»; Мойсей зняв з Аарона одіж і одягнув у неї Елеазара, «І вмер Арон на верховинї Ор-гори», і Ізраїль оплакував його тридцять днів. Перелік стоянок датує його смерть першим днем п’ятого місяця сорокового року після виходу, у віці ста двадцяти трьох років. Від гори Гор Ізраїль вирушив «шляхом до Червоного моря, щоб обминути Едом землю». Повторення Закону, однак, розміщує смерть Аарона в Мосері, можливо, табір біля підніжжя гори, можливо, інша традиція; Мойсею сказано, що він помре, «так як Арон, брат твій, вмер на горі Гор»."
    - "Де стояла гора, спірно. Йосиф Флавій каже, що Аарон помер на одній із високих гір, які оточують Петру, і єврейська, християнська та мусульманська традиції зупинилися на Джебель-Гарун, «горі Аарона», найвищій вершині над містом, близько 1350 м. На її верхньому схилі від V ст. стояли церква й монастир святого Аарона, названі в петрійському папірусі 573 р. та розкопані фінським проєктом Джебель-Гарун від 1997 р.; на вершині мамлюцька святиня з білим куполом, відновлена за султана ан-Насіра Мухаммада, позначає гробницю. Багато вчених заперечують, що Джебель-Гарун лежить у серці Едому, а не на його межі, і шукають натомість край пустелі Сін: Хар-Цін, або пагорби ближче до Кадеш-Барнеа, як-от Імарет-ель-Хурейша, Джебель-ес-Сабха й Джебель-ель-Хамра; Джебель-Мадура був вибором Г. К. Трамбулла 1884 р. Нічого, знайденого досі, не розв’язує питання."
    - "Інша Гора Гор позначає північний кордон землі в Числах 34, між Великим морем і входом у Хамат, вершина хребта Ліван, яку ніхто не ототожнив. Сьогодні Джебель-Гарун, до якої веде довга стежка від Петри, — місце паломництва для всіх трьох релігій, її біла святиня видна майже звідусіль серед руїн; Хар-Цін — гола висота в Негеві Ізраїлю над долиною Сін."
  es:
    - "El monte Hor es la montaña «en los confines de la tierra de Edom» donde murió Aarón. De Cades toda la congregación llegó al monte Hor, y allí Jehová dijo a Moisés que Aarón no entraría en la tierra por la rebelión de Meriba. Moisés, Aarón y Eleazar subieron «á ojos de toda la congregación»; Moisés despojó a Aarón de sus vestiduras y se las puso a Eleazar, «y Aarón murió allí en la cumbre del monte», e Israel lo lloró treinta días. La lista de estaciones fecha su muerte el primer día del mes quinto del año cuarenta después del éxodo, a la edad de ciento veintitrés años. Desde el monte Hor, Israel partió «camino del mar Bermejo, para rodear la tierra de Edom». Deuteronomio, sin embargo, sitúa la muerte de Aarón en Moserá, quizá un campamento al pie de la montaña, quizá otra tradición; a Moisés se le dice que morirá «al modo que murió Aarón tu hermano en el monte de Hor»."
    - "Se discute dónde estaba la montaña. Josefo dice que Aarón murió en una de las altas montañas que rodean Petra, y la tradición judía, cristiana y musulmana eligió el Yebel Harún, «la montaña de Aarón», el pico más alto sobre la ciudad, a unos 1350 m. En su ladera superior se alzó desde el siglo V una iglesia y monasterio de San Aarón, nombrado en un papiro de Petra de 573 y excavado por el Proyecto Jabal Harun finlandés desde 1997; en la cumbre, un santuario mameluco de cúpula blanca, restaurado bajo el sultán al-Nasir Muhammad, señala la tumba. Muchos estudiosos objetan que el Yebel Harún está en el corazón de Edom, no en su frontera, y miran al borde del desierto de Zin: Har Zin, o colinas más cercanas a Cades-barnea, como Imaret el-Khureisheh, Yebel es-Sabha y Yebel el-Hamrah; H. C. Trumbull eligió en 1884 el Yebel Madurah. Nada hallado hasta ahora la resuelve."
    - "Otro monte Hor marca la frontera norte de la tierra en Números 34, entre el Mar Grande y la entrada de Hamat, una cima de la cordillera del Líbano que nadie ha identificado. Hoy el Yebel Harún, al que se llega por un largo sendero desde Petra, es lugar de peregrinación para las tres religiones, y su santuario blanco se ve desde casi todas partes de las ruinas; Har Zin es una altura pelada del Néguev israelí sobre el valle de Zin."
  pt:
    - "O monte Hor é a montanha “junto à fronteira da terra de Edom” onde Arão morreu. De Cades toda a congregação chegou ao monte Hor, e ali o SENHOR disse a Moisés que Arão não entraria na terra por causa da rebelião em Meribá. Moisés, Arão e Eleazar subiram “à vista de toda a congregação”; Moisés tirou as vestes de Arão e as pôs em Eleazar, e “Arão morreu ali no topo do monte”, e Israel o chorou trinta dias. A lista de etapas data sua morte do primeiro dia do quinto mês do quadragésimo ano depois do êxodo, aos cento e vinte e três anos. Do monte Hor, Israel partiu “pelo caminho do mar Vermelho, para contornar a terra de Edom”. Deuteronômio, porém, põe a morte de Arão em Moserá, talvez um acampamento ao pé da montanha, talvez outra tradição; a Moisés se diz que morrerá “assim como Arão, seu irmão, morreu no Monte Hor”."
    - "Onde ficava a montanha é disputado. Josefo diz que Arão morreu numa das altas montanhas que cercam Petra, e a tradição judaica, cristã e muçulmana fixou-se no Jebel Harun, “a montanha de Arão”, o pico mais alto acima da cidade, a cerca de 1.350 m. Em sua encosta superior, uma igreja e mosteiro de Santo Arão, do século V, citados num papiro de Petra de 573, são escavados desde 1997 pelo Projeto Jabal Harun finlandês; no cume, um santuário mameluco de cúpula branca, restaurado sob o sultão al-Nasir Muhammad, marca o túmulo. Muitos objetam que o Jebel Harun fica no coração de Edom, e não em sua fronteira, e olham antes para a borda do deserto de Zim: Har Zin, ou colinas mais perto de Cades-Barneia, como Imaret el-Khureisheh, Jebel es-Sabha e Jebel el-Hamrah; Jebel Madurah foi a escolha de H. C. Trumbull em 1884. Nada achado até agora resolve a questão."
    - "Outro monte Hor marca a fronteira norte da terra em Números 34, entre o Mar Grande e a entrada de Hamate, um pico da cordilheira do Líbano que ninguém identificou. Hoje o Jebel Harun, alcançado por uma longa trilha a partir de Petra, é lugar de peregrinação das três religiões, seu santuário branco visível de quase todo ponto das ruínas; Har Zin é uma altura nua no Neguebe de Israel acima do vale de Zim."
  de:
    - "Der Berg Hor ist der Berg „an den Grenzen des Landes der Edomiter“, auf dem Aaron starb. Von Kadesch kam die Gemeinde zum Berg; der HERR sagte Mose, Aaron werde wegen Meriba nicht ins Land kommen. Mose, Aaron und Eleasar „stiegen auf den Berg Hor vor der ganzen Gemeinde“; Mose zog Aaron die Kleider aus und Eleasar an, „Und Aaron starb daselbst oben auf dem Berge“, und Israel trauerte dreißig Tage. Die Stationenliste datiert seinen Tod auf den 1. Tag des 5. Monats im 40. Jahr nach dem Auszug, mit 123 Jahren. Vom Berg Hor zog Israel „auf dem Wege gegen das Schilfmeer, daß sie um der Edomiter Land hinzögen“. Das 5. Buch Mose nennt Mosera, vielleicht ein Lager am Fuß des Berges oder eine andere Überlieferung; Mose soll sterben, „gleich wie dein Bruder Aaron starb auf dem Berge Hor“."
    - "Wo der Berg stand, ist umstritten. Josephus sagt, Aaron sei auf einem der hohen Berge um Petra gestorben, und jüdische, christliche und muslimische Überlieferung fand ihn im Jebel Harun, „Aarons Berg“, dem höchsten Gipfel über der Stadt, etwa 1350 m. An seinem oberen Hang stand seit dem 5. Jahrhundert eine Kirche mit Kloster des heiligen Aaron, in einem Petra-Papyrus von 573 genannt und seit 1997 vom finnischen Jabal Harun Project ausgegraben; auf dem Gipfel markiert ein mamlukisches Heiligtum mit weißer Kuppel, unter Sultan al-Nasir Muhammad restauriert, das Grab. Viele wenden ein, der Jebel Harun liege im Herzen Edoms, nicht an seiner Grenze, und suchen am Rand der Wüste Zin: Har Zin oder Hügel näher bei Kadesch-Barnea wie Imaret el-Khureisheh, Jebel es-Sabha, Jebel el-Hamrah; Jebel Madurah war 1884 H. C. Trumbulls Wahl. Kein Fund entscheidet die Frage."
    - "Ein weiterer Berg Hor markiert die Nordgrenze des Landes in 4. Mose 34, zwischen dem Mittelmeer und dem Eingang nach Hamat, ein Gipfel des Libanongebirges, den niemand identifiziert hat. Heute ist der Jebel Harun, über einen langen Pfad von Petra zu erreichen, ein Wallfahrtsort für alle drei Religionen, sein weißes Heiligtum fast von überall in den Ruinen sichtbar; Har Zin ist eine kahle Höhe im Negev Israels über dem Zintal."
  fr:
    - "Le mont Hor est la montagne « sur la frontière du pays d’Édom » où mourut Aaron. De Qadesh, toute l’assemblée vint au mont Hor, et là l’Éternel dit à Moïse qu’Aaron n’entrerait pas dans le pays à cause de la rébellion à Meriba. Moïse, Aaron et Éléazar montèrent « aux yeux de toute l’assemblée » ; Moïse dépouilla Aaron de ses vêtements pour en revêtir Éléazar, « Aaron mourut là, au sommet de la montagne », et Israël le pleura trente jours. La liste des étapes date sa mort du premier jour du cinquième mois de la quarantième année de l’exode, à cent vingt-trois ans. Du mont Hor, Israël partit « par le chemin de la mer Rouge, pour contourner le pays d’Édom ». Le Deutéronome place pourtant la mort d’Aaron à Moséra, peut-être un campement au pied de la montagne, ou une autre tradition ; Moïse apprend qu’il mourra « comme Aaron, ton frère, est mort sur la montagne de Hor »."
    - "Son emplacement est discuté. Selon Flavius Josèphe, Aaron mourut sur l’une des hautes montagnes qui enserrent Pétra, et les traditions juive, chrétienne et musulmane se sont fixées sur le djebel Haroun, « la montagne d’Aaron », plus haut sommet au-dessus de la ville, à environ 1 350 m. Sur sa pente haute, une église et un monastère de saint Aaron, dès le Ve siècle, cités par un papyrus de Pétra de 573, sont fouillés depuis 1997 par le Jabal Harun Project finlandais ; au sommet, un sanctuaire mamelouk à dôme blanc, restauré sous le sultan al-Nasir Muhammad, marque la tombe. Beaucoup objectent que le djebel Haroun est au cœur d’Édom, non à sa frontière, et cherchent vers le désert de Tsin : Har Zin, ou des collines plus proches de Kadès-Barnéa (Imaret el-Khureisheh, djebel es-Sabha, djebel el-Hamrah) ; H. C. Trumbull choisit en 1884 le djebel Madurah. Rien n’a tranché."
    - "Un autre mont Hor marque la frontière nord du pays en Nombres 34, entre la Grande mer et l’entrée de Hamath, sommet de la chaîne du Liban que nul n’a identifié. Aujourd’hui, le djebel Haroun, atteint par un long sentier depuis Pétra, est un lieu de pèlerinage pour les trois religions, son sanctuaire blanc visible de presque partout dans les ruines ; Har Zin est une hauteur nue du Négev d’Israël au-dessus de la vallée de Tsin."
  it:
    - "Il Monte Or è il monte «sui confini del paese di Edom» dove morì Aronne. Da Kades tutta la raunanza giunse al Monte Or, e là l’Eterno disse a Mosè che Aronne non sarebbe entrato nella terra per la ribellione di Meriba. Mosè, Aronne ed Eleazaro salirono «a vista di tutta la raunanza»; Mosè spogliò Aronne dei paramenti e ne rivestì Eleazaro, «e Aaronne morì quivi sulla cima del monte», e Israele lo pianse trenta giorni. L’elenco delle tappe data la sua morte al primo giorno del quinto mese del quarantesimo anno dopo l’esodo, a centoventitré anni. Dal Monte Or Israele partì «movendo verso il mar Rosso per fare il giro del paese di Edom». Il Deuteronomio però pone la morte di Aronne a Mosera, forse un accampamento ai piedi del monte, forse un’altra tradizione; a Mosè è detto che morirà «come Aaronne tuo fratello è morto sul monte di Hor»."
    - "Dove sorgesse il monte è discusso. Giuseppe Flavio dice che Aronne morì su uno dei monti alti che racchiudono Petra, e la tradizione ebraica, cristiana e musulmana si fissò sul Jebel Harun, «il monte di Aronne», la vetta più alta sopra la città, a circa 1350 m. Sul pendio alto sorgeva dal V secolo una chiesa con monastero di sant’Aronne, citata in un papiro di Petra del 573 e scavata dal Jabal Harun Project finlandese dal 1997; sulla cima un santuario mamelucco con cupola bianca, restaurato sotto il sultano al-Nasir Muhammad, segna la tomba. Molti obiettano che il Jebel Harun sta nel cuore di Edom, non al suo confine, e guardano invece al margine del deserto di Zin: Har Zin, o colline più vicine a Kades-Barnea come Imaret el-Khureisheh, Jebel es-Sabha e Jebel el-Hamrah; il Jebel Madurah fu la scelta di H. C. Trumbull nel 1884. Nessun reperto risolve la questione."
    - "Un altro Monte Or segna il confine settentrionale della terra in Numeri 34, tra il Mare Grande e Lebo-Camat, una vetta della catena del Libano che nessuno ha identificato. Oggi il Jebel Harun, raggiunto da un lungo sentiero da Petra, è luogo di pellegrinaggio per tutte e tre le fedi, il suo santuario bianco visibile quasi da ogni punto delle rovine; Har Zin è un’altura spoglia nel Negheb d’Israele sopra la valle di Zin."
  pl:
    - "Góra Hor to góra „nad granicą ziemi Edomskiej”, na której umarł Aaron. Z Kadesz całe zgromadzenie przyszło do góry Hor i tam Pan powiedział Mojżeszowi, że Aaron nie wejdzie do ziemi z powodu buntu w Meribie. Mojżesz, Aaron i Eleazar wstąpili „przed oczyma wszystkiego zgromadzenia”; Mojżesz zdjął z Aarona szaty i włożył je na Eleazara, „i umarł tam Aaron na wierzchu góry”, a Izrael opłakiwał go trzydzieści dni. Lista stacji datuje jego śmierć na pierwszy dzień piątego miesiąca czterdziestego roku po wyjściu, w wieku stu dwudziestu trzech lat. Z góry Hor Izrael wyruszył „drogą ku morzu czerwonemu, aby obeszli ziemię Edomską”. Księga Powtórzonego Prawa umieszcza jednak śmierć Aarona w Mosera, może w obozie u stóp góry, może to inna tradycja; Mojżeszowi mówi się, że umrze, „jako umarł Aaron, brat twój, na górze Hor”."
    - "Gdzie stała góra, jest sporne. Józef Flawiusz mówi, że Aaron umarł na jednej z wysokich gór otaczających Petrę, a tradycja żydowska, chrześcijańska i muzułmańska osiadła na Dżabal Harun, „górze Aarona”, najwyższym szczycie nad miastem, około 1350 m. Na jej górnym zboczu od V w. stał kościół i klasztor św. Aarona, wymieniony w papirusie z Petry z 573 r. i wykopywany przez fiński Jabal Harun Project od 1997 r.; na szczycie mameluckie sanktuarium z białą kopułą, odnowione za sułtana an-Nasira Muhammada, wyznacza grób. Wielu uczonych sprzeciwia się, że Dżabal Harun leży w sercu Edomu, a nie na jego granicy, i szuka raczej na skraju pustyni Sin: Har Sin albo wzgórz bliżej Kadesz-Barnea, jak Imaret el-Khureisheh, Dżabal es-Sabha i Dżabal el-Hamrah; Dżabal Madura było wyborem H. C. Trumbulla w 1884 r. Nic dotąd znalezionego nie rozstrzyga sprawy."
    - "Inna góra Hor wyznacza północną granicę ziemi w Lb 34, między Wielkim Morzem a wejściem do Chamatu, szczyt pasma Libanu, którego nikt nie zidentyfikował. Dziś Dżabal Harun, osiągalny długim szlakiem z Petry, jest miejscem pielgrzymek dla trzech religii, a jego białe sanktuarium widać prawie z każdego miejsca w ruinach; Har Sin to naga wysokość w Negewie w Izraelu nad doliną Sin."
  nl:
    - "De berg Hor is de berg “aan de pale van het land van Edom” waar Aäron stierf. De hele gemeente kwam van Kades, en daar zei de HEER tot Mozes dat Aäron het land niet zou binnengaan om de opstand bij Meriba. Mozes, Aäron en Eleazar klommen op “voor de ogen der ganse vergadering”; Mozes trok Aäron zijn klederen uit en Eleazar aan, “en Aaron stierf aldaar, op de hoogte diens bergs”, en Israël rouwde hem dertig dagen. De lijst van pleisterplaatsen dateert zijn dood op de eerste dag van de vijfde maand van het veertigste jaar na de uittocht, op 123-jarige leeftijd. Van de berg Hor vertrok Israël “op den weg der Schelfzee, dat zij om het land der Edomieten heentogen”. Deuteronomium plaatst Aärons dood echter bij Mosera, misschien een kamp aan de voet van de berg, misschien een andere overlevering; Mozes hoort dat hij zal sterven “gelijk als uw broeder Aaron stierf op den berg Hor”."
    - "Waar de berg stond, is omstreden. Josephus zegt dat Aäron stierf op een van de hoge bergen rond Petra, en de joodse, christelijke en islamitische overlevering koos de Jebel Harun, “Aarons berg”, de hoogste piek boven de stad op ongeveer 1.350 m. Op zijn hogere helling stond vanaf de vijfde eeuw een kerk en klooster van Sint-Aäron, genoemd in een Petra-papyrus van 573 en sinds 1997 opgegraven door het Finse Jabal Harun Project; op de top markeert een mamelukse schrijn met een witte koepel, hersteld onder sultan al-Nasir Muhammad, het graf. Velen werpen tegen dat de Jebel Harun in het hart van Edom ligt, niet aan de grens, en kijken liever naar de rand van de woestijn Zin: Har Zin, of heuvels dichter bij Kades-Barnea zoals Imaret el-Khureisheh, Jebel es-Sabha en Jebel el-Hamrah; de Jebel Madurah was de keuze van H. C. Trumbull in 1884. Wat tot nu toe is gevonden, beslist de vraag niet."
    - "Een andere berg Hor markeert de noordgrens van het land in Numeri 34, tussen de Grote Zee en de ingang van Hamat, een piek van het Libanongebergte die niemand heeft geïdentificeerd. Tegenwoordig is de Jebel Harun, bereikt via een lang pad vanuit Petra, een bedevaartsplaats voor alle drie de geloven, met zijn witte schrijn vrijwel overal in de ruïnes zichtbaar; Har Zin is een kale hoogte in de Negev van Israël boven het Zindal."
  cs:
    - "Hora Hor je hora „při pomezí země Edom“, kde zemřel Áron. Z Kádeše přišlo celé shromáždění k hoře Hor a tam Hospodin řekl Mojžíšovi, že Áron nevejde do země pro vzpouru u Meriby. Mojžíš, Áron a Eleazar vystoupili „před očima všeho množství“; Mojžíš svlékl Áronovi roucho a oblékl je Eleazarovi a „umřel tam Aron na pahrbku hory“, a Izrael ho oplakával třicet dní. Seznam stanic datuje jeho smrt na první den pátého měsíce čtyřicátého roku po exodu, ve věku sto dvaceti tří let. Od hory Hor se Izrael vydal „cestou k moři Rudému, aby obešli zemi Idumejskou“. Deuteronomium však klade Áronovu smrt do Moserahu, snad tábor na úpatí hory, snad jiná tradice; Mojžíšovi je řečeno, že zemře, „jako umřel Aron, bratr tvůj, na hoře řečené Hor“."
    - "Kde hora stála, je sporné. Josephus praví, že Áron zemřel na jedné z vysokých hor, které obklopují Petru, a židovská, křesťanská i muslimská tradice se usadila na Jebel Harun, „Áronově hoře“, nejvyšším vrcholu nad městem, asi 1350 m. Na jeho horním svahu stál od 5. století kostel a klášter svatého Árona, jmenovaný v petrském papyru z roku 573 a vykopávaný finským Jabal Harun Project od roku 1997; na vrcholu označuje hrob mamlúcká svatyně s bílou kupolí, obnovená za sultána an-Násira Muhammada. Mnozí badatelé namítají, že Jebel Harun leží v srdci Edómu, ne na jeho hranici, a hledí raději na okraj pouště Sín: Har Zin nebo pahorky blíže Kádeš-barney jako Imaret el-Khureisheh, Jebel es-Sabha a Jebel el-Hamrah; Jebel Madurah byl volbou H. C. Trumbulla roku 1884. Nic dosud nalezeného otázku nerozhoduje."
    - "Jiná hora Hor označuje severní hranici země v Numeri 34, mezi Velkým mořem a vchodem do Chamatu, vrchol libanonského pohoří, který nikdo neurčil. Dnes je Jebel Harun, dostupný dlouhou stezkou z Petry, poutním místem všech tří náboženství, jeho bílá svatyně je vidět téměř odevšad ze zřícenin; Har Zin je holá výšina v izraelském Negevu nad údolím Zin."
