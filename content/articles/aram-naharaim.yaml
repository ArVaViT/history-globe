# Overview article (ADR 0007). Mainstream facts only; written about the name Aram-naharaim, the title of Psalm 60 (Synodal 59) and the Egyptian Naharin, without restating the Mesopotamia and Paddan-aram articles; Egyptian reigns are given by century only.
id: aram-naharaim
place: a3c7b44
title:
  en: "Aram-naharaim"
  ru: "Сирия Месопотамская"
  uk: "Арам-Нагараїм"
  es: "Aram-naharaim"
  pt: "Arã-Naaraim"
  de: "Aram-Naharajim"
  fr: "Aram-Naharaïm"
  it: "Aram-Naharàim"
  nl: "Aram-Naharaïm"
