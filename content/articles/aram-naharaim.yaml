body:
  en:
    - "Aram-naharaim, “Aram of the two rivers”, is the Hebrew name of the country in the great bend of the Euphrates, around Haran and towards the Khabur, in today's south-eastern Turkey and north-eastern Syria; the map places it at Haran. The Septuagint renders it Mesopotamia, and in the title of Psalm 60 “Mesopotamia of Syria”, whence the Synodal “Syria of Mesopotamia” here and in 1 Chronicles 19:6; elsewhere both the Synodal Bible and the King James Version write Mesopotamia, and the King James keeps Aram-naharaim only in that title. Egyptian texts of the New Kingdom call the same region Naharin: it was the land of the Hurrian kingdom of Mitanni."
    - "The title of Psalm 60 sets the psalm in David's wars: “when he strove with Aram-naharaim and with Aram-zobah, when Joab returned, and smote of Edom in the valley of salt twelve thousand”; the parallel accounts give eighteen thousand and credit David and Abishai. Chronicles also says that the Ammonites hired chariots and horsemen against David “out of Mesopotamia, and out of Syria-maachah, and out of Zobah”, where the Hebrew again has Aram-naharaim. Elsewhere the name marks the home of Abraham's kin, the town of Balaam and the land of Chushan-rishathaim, the first oppressor in Judges."
    - "In the fifteenth century BC Naharin was Egypt's great rival in Syria. Officers of Thutmose I record in their tombs that they fought in Naharin, and Thutmose III, in the thirty-third year of his reign, crossed the Euphrates, set up his stela beside that of Thutmose I and laid waste the towns of Naharin. Later the two powers made peace, and the Amarna letters keep the correspondence of the Mitannian king Tushratta with Amenhotep III and Akhenaten. Mitanni fell to the Hittites and then the Assyrians in the fourteenth and thirteenth centuries BC, and Aramaean tribes then settled the country, which is why the Bible calls it Aram."
  ru:
    - "Арам-Нахараим, «Арам двух рек», — еврейское имя страны в большой излучине Евфрата, вокруг Харрана и в сторону Хабура, на нынешнем юго-востоке Турции и северо-востоке Сирии; карта ставит её у Харрана. Септуагинта передаёт его как Месопотамия, а в надписании псалма 59 (в еврейском счёте 60) — «Месопотамия Сирийская», откуда синодальное «Сирия Месопотамская» здесь и в 1 Паралипоменон 19:6; в остальных местах и Синодальный перевод, и Библия короля Якова пишут Месопотамия, а английский перевод сохраняет Арам-Нахараим только в этом надписании. Египетские тексты Нового царства называют ту же область Нахарин: это была земля хурритского царства Митанни."
    - "Надписание псалма 59 относит его к войнам Давида: «когда он воевал с Сириею Месопотамскою и с Сириею Цованскою, и когда Иоав, возвращаясь, поразил двенадцать тысяч Идумеев в долине Соляной»; параллельные рассказы называют восемнадцать тысяч и приписывают победу Давиду и Авессе. Паралипоменон говорит также, что Аммонитяне наняли против Давида колесницы и всадников «из Сирии Месопотамской и из Сирии Мааха и из Сувы». В других местах это имя обозначает родину родни Авраама, город Валаама и страну Хусарсафема, первого угнетателя в Книге Судей."
    - "В XV в. до н. э. Нахарин был главным соперником Египта в Сирии. Военачальники Тутмоса I пишут в своих гробницах, что воевали в Нахарине, а Тутмос III на тридцать третьем году правления переправился через Евфрат, поставил свою стелу рядом со стелой Тутмоса I и опустошил города Нахарина. Позже две державы заключили мир, и амарнские письма сохранили переписку митаннийского царя Тушратты с Аменхотепом III и Эхнатоном. Митанни пало под ударами хеттов, а затем ассирийцев в XIV–XIII вв. до н. э., и затем страну заселили арамейские племена, поэтому Библия и называет её Арамом."
  uk:
    - "Арам-Нагараїм, «Арам двох рік», — єврейська назва країни у великому вигині Євфрату, навколо Харана й у напрямку Хабуру, у нинішній південно-східній Туреччині та північно-східній Сирії; мапа ставить її в Харані. Септуагінта передає її як Месопотамія, а в заголовку Псалма 60 — «Месопотамія Сирії», звідки синодальне «Сирія Месопотамська» тут і в 1 Хронік 19:6; в інших місцях і Синодальна Біблія, і Біблія короля Якова пишуть Месопотамія, а Біблія короля Якова зберігає Арам-Нагараїм лише в тому заголовку. Єгипетські тексти Нового царства називають цей самий край Нахарін: це була земля хурритського царства Мітанні."
    - "Заголовок Псалма 60 відносить псалом до воєн Давида: «як він воював з Сирийцями в Мезопотамії і з Сирийцями Зобанськими, і Йоаб, вернувшись, побив Едоміїв на Соляній долинї…» — дванадцять тисяч, за текстом Біблії короля Якова; паралельні розповіді дають вісімнадцять тисяч і приписують перемогу Давидові й Авішаю. Хроніки кажуть також, що аммонітяни найняли колісниці й вершників проти Давида «із Сириї Месопотамської, і з Сириї Маахової та з Соби», де в єврейському тексті знову стоїть Арам-Нагараїм. В інших місцях назва означає батьківщину родичів Авраама, місто Валаама та країну Кушан-Ришатаїма, першого гнобителя в Книзі Суддів."
    - "У XV ст. до н. е. Нахарін був великим суперником Єгипту в Сирії. Офіцери Тутмоса I записують у своїх гробницях, що воювали в Нахаріні, а Тутмос III на тридцять третьому році свого правління перейшов Євфрат, поставив свою стелу поруч зі стелою Тутмоса I і спустошив міста Нахаріну. Пізніше обидві держави уклали мир, і листи з Амарни зберігають листування мітаннійського царя Тушратти з Аменхотепом III та Ехнатоном. Мітанні впали під ударами хеттів, а потім ассирійців у XIV–XIII ст. до н. е., і тоді країну заселили арамейські племена, тому Біблія й називає її Арам."
  es:
    - "Aram-naharaim, «Aram de los dos ríos», es el nombre hebreo del país situado en el gran recodo del Éufrates, en torno a Harán y hacia el Khabur, en el actual sureste de Turquía y noreste de Siria; el mapa lo sitúa en Harán. La Septuaginta lo traduce Mesopotamia, y en el título del Salmo 60 «Mesopotamia de Siria», de donde el sinodal «Siria de Mesopotamia» aquí y en 1 Crónicas 19:6; en otros lugares tanto la Biblia sinodal como la versión King James escriben Mesopotamia, y la King James conserva Aram-naharaim solo en ese título. Los textos egipcios del Reino Nuevo llaman Naharin a la misma región: era la tierra del reino hurrita de Mitani."
    - "El título del Salmo 60 sitúa el salmo en las guerras de David: «cuando tuvo guerra contra Aram-Naharaim y contra Aram de Soba, y volvió Joab, é hirió de Edom en el valle de las Salinas doce mil»; los relatos paralelos dan dieciocho mil y lo atribuyen a David y a Abisai. Crónicas dice también que los amonitas contrataron carros y jinetes contra David «de Siria de los ríos, y de la Siria de Maachâ, y de Soba», donde el hebreo vuelve a tener Aram-naharaim. En otros pasajes el nombre designa la patria de la parentela de Abraham, la ciudad de Balaam y la tierra de Cusán-risataim, el primer opresor en Jueces."
    - "En el siglo XV a. C. Naharin fue la gran rival de Egipto en Siria. Oficiales de Tutmosis I registran en sus tumbas que combatieron en Naharin, y Tutmosis III, en el año 33 de su reinado, cruzó el Éufrates, erigió su estela junto a la de Tutmosis I y devastó las ciudades de Naharin. Más tarde las dos potencias hicieron la paz, y las cartas de Amarna conservan la correspondencia del rey mitanio Tushratta con Amenhotep III y Ajenatón. Mitani cayó ante los hititas y luego ante los asirios en los siglos XIV y XIII a. C., y tribus arameas poblaron entonces el país, por lo cual la Biblia lo llama Aram."
  pt:
    - "Arã-Naaraim, “Arã dos dois rios”, é o nome hebraico do país na grande curva do Eufrates, ao redor de Harã e em direção ao Khabur, no atual sudeste da Turquia e nordeste da Síria; o mapa o situa em Harã. A Septuaginta o traduz por Mesopotâmia, e no título do Salmo 60 por Mesopotâmia da Síria, de onde vem a forma sinodal Síria da Mesopotâmia aqui e em 1 Crônicas 19:6; em outros lugares, tanto a Bíblia sinodal quanto a Versão King James escrevem Mesopotâmia, e a King James conserva Arã-Naaraim apenas naquele título. Textos egípcios do Novo Império chamam a mesma região Naharin: era a terra do reino hurrita de Mitani."
    - "O título do Salmo 60 situa o salmo nas guerras de Davi, quando ele lutou contra Arã-Naaraim e contra Arã-Zobá, quando Joabe voltou e feriu doze mil de Edom no vale do Sal; os relatos paralelos dão dezoito mil e atribuem a vitória a Davi e a Abisai. Crônicas diz também que os amonitas contrataram carros e cavaleiros contra Davi “da Mesopotâmia, de Arã-Maaca e de Zobá”, onde o hebraico traz de novo Arã-Naaraim. Em outros lugares o nome designa a terra dos parentes de Abraão, a cidade de Balaão e a terra de Cusã-Risataim, o primeiro opressor em Juízes."
    - "No século XV a.C., Naharin era a grande rival do Egito na Síria. Oficiais de Tutmés I registram em seus túmulos que lutaram em Naharin, e Tutmés III, no trigésimo terceiro ano de seu reinado, atravessou o Eufrates, ergueu sua estela ao lado da de Tutmés I e devastou as cidades de Naharin. Mais tarde as duas potências fizeram a paz, e as cartas de Amarna guardam a correspondência do rei mitaniano Tushratta com Amenófis III e Aquenaton. Mitani caiu diante dos hititas e depois dos assírios nos séculos XIV e XIII a.C., e tribos arameias se estabeleceram então no país, razão pela qual a Bíblia o chama Arã."
  de:
    - "Aram-Naharajim, „Aram der zwei Flüsse“, ist der hebräische Name des Landes in der großen Schleife des Euphrat, um Haran und gegen den Chabur hin, im heutigen Südosten der Türkei und Nordosten Syriens; die Karte setzt es nach Haran. Die Septuaginta gibt ihn mit Mesopotamien wieder, im Titel von Psalm 60 mit Mesopotamien von Syrien, daher die Synodalübersetzung Syrien von Mesopotamien hier und in 1. Chronik 19,6; sonst schreiben sowohl die Synodalbibel als auch die King-James-Bibel Mesopotamien, und die King-James-Bibel behält Aram-Naharajim nur in jenem Titel. Ägyptische Texte des Neuen Reiches nennen dieselbe Gegend Naharin: Es war das Land des hurritischen Königreichs Mitanni."
    - "Der Titel von Psalm 60 stellt den Psalm in Davids Kriege: „da er gestritten hatte mit den Syrern zu Mesopotamien und mit den Syrern von Zoba; da Joab umkehrte und schlug der Edomiter im Salztal zwölftausend“; die Parallelberichte nennen achtzehntausend und rechnen es David und Abischai an. Die Chronik sagt auch, dass die Ammoniter gegen David Wagen und Reiter dingten „aus Mesopotamien, aus dem Syrien von Maacha und aus Zoba“, wo der hebräische Text wieder Aram-Naharajim hat. Sonst bezeichnet der Name die Heimat von Abrahams Verwandten, die Stadt Bileams und das Land Kuschan-Rischatajims, des ersten Unterdrückers im Richterbuch."
    - "Im fünfzehnten Jahrhundert v. Chr. war Naharin Ägyptens großer Rivale in Syrien. Offiziere Thutmosis' I. halten in ihren Gräbern fest, dass sie in Naharin kämpften, und Thutmosis III. überschritt im 33. Jahr seiner Herrschaft den Euphrat, errichtete seine Stele neben der Thutmosis' I. und verwüstete die Städte Naharins. Später schlossen die beiden Mächte Frieden, und die Amarna-Briefe bewahren den Schriftwechsel des mitannischen Königs Tuschratta mit Amenophis III. und Echnaton. Mitanni fiel im vierzehnten und dreizehnten Jahrhundert v. Chr. an die Hethiter und dann an die Assyrer, und aramäische Stämme besiedelten danach das Land, weshalb die Bibel es Aram nennt."
  fr:
    - "Aram-Naharaïm, « Aram des deux fleuves », est le nom hébreu du pays de la grande boucle de l’Euphrate, autour de Haran et vers le Khabour, dans l’actuel sud-est de la Turquie et nord-est de la Syrie ; la carte le place à Haran. La Septante le rend par Mésopotamie, et dans le titre du psaume 60 par « Mésopotamie de Syrie », d’où la Bible synodale « Syrie de Mésopotamie » ici et en 1 Chroniques 19:6 ; ailleurs, la Bible synodale comme la version du roi Jacques écrivent Mésopotamie, et la King James ne garde Aram-Naharaïm que dans ce titre. Les textes égyptiens du Nouvel Empire appellent la même région Naharin : c’était le pays du royaume hourrite du Mitanni."
    - "Le titre du psaume 60 place le psaume dans les guerres de David : « Lorsqu’il fit la guerre aux Syriens de Mésopotamie et aux Syriens de Tsoba, et que Joab revint et battit dans la vallée du sel douze mille Édomites » ; les récits parallèles donnent dix-huit mille et l’attribuent à David et à Abischaï. Les Chroniques disent aussi que les Ammonites prirent à leur solde des chars et des cavaliers contre David « chez les Syriens de Mésopotamie et chez les Syriens de Maaca et de Tsoba », où l’hébreu porte de nouveau Aram-Naharaïm. Ailleurs, le nom désigne le pays de la parenté d’Abraham, la ville de Balaam et le pays de Cuschan-Rischeathaïm, le premier oppresseur du livre des Juges."
    - "Au XVe siècle av. J.-C., Naharin était le grand rival de l’Égypte en Syrie. Des officiers de Thoutmosis Ier rapportent dans leurs tombes avoir combattu à Naharin, et Thoutmosis III, la trente-troisième année de son règne, franchit l’Euphrate, dressa sa stèle à côté de celle de Thoutmosis Ier et ravagea les villes de Naharin. Plus tard, les deux puissances firent la paix, et les lettres d’Amarna conservent la correspondance du roi mitannien Toushratta avec Aménophis III et Akhénaton. Le Mitanni tomba aux mains des Hittites puis des Assyriens aux XIVe et XIIIe siècles av. J.-C., et des tribus araméennes s’établirent alors dans le pays, ce qui explique que la Bible l’appelle Aram."
  it:
    - "Aram-Naharàim, «Aram dei due fiumi», è il nome ebraico del paese nella grande ansa dell’Eufrate, intorno a Carran e verso il Khabur, nell’odierna Turchia sud-orientale e Siria nord-orientale; la carta lo colloca a Carran. La Settanta lo rende Mesopotamia, e nel titolo del Salmo 60 «Mesopotamia di Siria», donde il sinodale «Siria di Mesopotamia» qui e in 1 Cronache 19,6; altrove sia la Bibbia sinodale sia la King James Version scrivono Mesopotamia, e la King James conserva Aram-Naharàim solo in quel titolo. I testi egizi del Nuovo Regno chiamano la stessa regione Naharin: era la terra del regno hurrita di Mitanni."
    - "Il titolo del Salmo 60 colloca il salmo nelle guerre di Davide: «quand’egli mosse guerra ai Siri di Mesopotamia e ai Siri di Soba e Joab tornò, e sconfisse 12.000 Idumei nella valle del Sale»; i racconti paralleli parlano di diciottomila e ne attribuiscono il merito a Davide e Abisai. Le Cronache dicono anche che gli Ammoniti presero al loro soldo carri e cavalieri contro Davide «presso i Siri di Mesopotamia e presso i Siri di Maaca e di Tsoba», dove l’ebraico ha di nuovo Aram-Naharàim. Altrove il nome indica la patria dei parenti di Abramo, la città di Balaam e il paese di Cusan-Risataim, il primo oppressore nel libro dei Giudici."
    - "Nel XV secolo a.C. Naharin era la grande rivale dell’Egitto in Siria. Ufficiali di Tutmosi I ricordano nelle loro tombe di aver combattuto in Naharin, e Tutmosi III, nel trentatreesimo anno di regno, attraversò l’Eufrate, eresse la sua stele accanto a quella di Tutmosi I e devastò le città di Naharin. Più tardi le due potenze fecero la pace, e le lettere di Amarna conservano la corrispondenza del re mitannico Tushratta con Amenofi III e Akhenaton. Mitanni cadde in mano agli Ittiti e poi agli Assiri nel XIV e XIII secolo a.C., e tribù aramaiche si stanziarono allora nel paese, ed è per questo che la Bibbia lo chiama Aram."
  nl:
    - "Aram-Naharaïm, ‘Aram van de twee rivieren’, is de Hebreeuwse naam van het land in de grote bocht van de Eufraat, rond Haran en richting de Khabur, in het huidige zuidoosten van Turkije en noordoosten van Syrië; de kaart plaatst het bij Haran. De Septuaginta geeft het weer als Mesopotamië, en in het opschrift van Psalm 60 als “Mesopotamië van Syrië”, vandaar de Synodale lezing “Syrië van Mesopotamië” hier en in 1 Kronieken 19:6; elders hebben zowel de Synodale Bijbel als de King James Version Mesopotamië, en de King James Version bewaart Aram-Naharaïm alleen in dat opschrift. Egyptische teksten uit het Nieuwe Rijk noemen dezelfde streek Naharin: het was het land van het Hurritische koninkrijk Mitanni."
    - "Het opschrift van Psalm 60 plaatst de psalm in Davids oorlogen: toen hij streed tegen Aram-Naharaïm en tegen Aram-Soba, en Joab terugkeerde en twaalfduizend Edomieten sloeg in het Zoutdal; de parallelle verhalen noemen achttienduizend en schrijven het toe aan David en Abisai. Kronieken zegt ook dat de Ammonieten wagens en ruiters tegen David huurden “uit Mesopotamië, en uit Syrië-Maacha, en uit Zoba”, waar de Hebreeuwse tekst opnieuw Aram-Naharaïm heeft. Elders markeert de naam het woongebied van Abrahams verwanten, de stad van Bileam en het land van Kusan-Risataïm, de eerste onderdrukker in Richteren."
    - "In de vijftiende eeuw v.Chr. was Naharin de grote rivaal van Egypte in Syrië. Officieren van Thoetmosis I vermelden in hun graven dat zij in Naharin streden, en Thoetmosis III stak in het drieëndertigste jaar van zijn regering de Eufraat over, richtte zijn stèle op naast die van Thoetmosis I en verwoestte de steden van Naharin. Later sloten de twee machten vrede, en de Amarnabrieven bewaren de briefwisseling van de Mitannische koning Tushratta met Amenhotep III en Achnaton. Mitanni viel in de veertiende en dertiende eeuw v.Chr. aan de Hettieten en daarna aan de Assyriërs, en Aramese stammen vestigden zich vervolgens in het land, en daarom noemt de Bijbel het Aram."
  pl:
    - "Aram Naharaim, „Aram dwóch rzek”, to hebrajska nazwa kraju w wielkim zakolu Eufratu, wokół Charanu i w stronę Chaburu, na obszarze dzisiejszej południowo-wschodniej Turcji i północno-wschodniej Syrii; mapa umieszcza go w Charanie. Septuaginta oddaje ją jako Mezopotamię, a w tytule Psalmu 60 jako „Mezopotamię Syrii”, skąd synodalne „Syria Mezopotamii” tu i w 1 Księdze Kronik 19,6; gdzie indziej zarówno Biblia synodalna, jak i Biblia Króla Jakuba piszą Mezopotamia, a Biblia Króla Jakuba zachowuje Aram Naharaim tylko w tym tytule. Egipskie teksty Nowego Państwa nazywają ten sam region Naharin: była to ziemia huryckiego królestwa Mitanni."
    - "Tytuł Psalmu 60 umieszcza psalm w wojnach Dawida: „Gdy walczył przeciw Syryjczykom Nacharaim, i przeciw Syryjczykom Soby; gdy się wrócił Joab, poraziwszy Edomczyków w dolinie solnej dwanaście tysięcy”; w paralelnych opisach mowa o osiemnastu tysiącach, a zasługę przypisuje się Dawidowi i Abiszajowi. Kroniki mówią także, że Ammonici najęli przeciw Dawidowi rydwany i jazdę „z Mezopotamii i z Syryi Maacha, i z Soby”, gdzie hebrajski znów ma Aram Naharaim. Poza tym nazwa wyznacza ojczyznę krewnych Abrahama, miasto Balaama i ziemię Kuszana-Riszataima, pierwszego ciemiężcy w Księdze Sędziów."
    - "W XV w. p.n.e. Naharin był wielkim rywalem Egiptu w Syrii. Dowódcy Totmesa I zapisali w swoich grobowcach, że walczyli w Naharin, a Totmes III w trzydziestym trzecim roku panowania przeprawił się przez Eufrat, postawił swoją stelę obok steli Totmesa I i spustoszył miasta Naharin. Później oba mocarstwa zawarły pokój, a listy z Amarna zachowały korespondencję króla Mitanni Tuszratty z Amenhotepem III i Echnatonem. Mitanni uległo Hetytom, a potem Asyryjczykom w XIV i XIII w. p.n.e.; kraj zasiedliły wówczas plemiona aramejskie, dlatego Biblia nazywa go Aram."
  cs:
    - "Aram-naharajim, „Aram dvou řek“, je hebrejské jméno země ve velkém ohbí Eufratu, kolem Cháranu a směrem k Chaburu, v dnešním jihovýchodním Turecku a severovýchodní Sýrii; mapa je klade k Cháranu. Septuaginta je překládá Mezopotámie a v nadpisu žalmu 60 „Mezopotámie Syrská“, odkud synodální „Sýrie Mezopotámská“ zde a v 1 Pa 19,6; jinde synodální Bible i Bible krále Jakuba píší Mezopotámie a Bible krále Jakuba si Aram-naharajim ponechává jen v onom nadpisu. Egyptské texty Nové říše nazývají tutéž oblast Naharin: byla zemí churritského království Mitanni."
    - "Nadpis žalmu 60 klade žalm do Davidových válek: „Když válku vedl proti Syrii Naharaim, a proti Syrii Soba, kdyžto navrátil se Joáb, pobiv Idumejských v údolí slaném dvanácte tisíců.“ Souběžná líčení uvádějí osmnáct tisíc a připisují porážku Davidovi a Abišajovi. Paralipomenon také říká, že Amonité najali proti Davidovi vozy a jezdce „z Mezopotamie a z Syrie Maacha a z Soba“, kde má hebrejština opět Aram-naharajim. Jinde jméno označuje domov příbuzných Abrahamových, město Bileámovo a zemi Kúšan-rišatajima, prvního utlačovatele v knize Soudců."
    - "V patnáctém století př. n. l. byl Naharin velkým soupeřem Egypta v Sýrii. Důstojníci Thutmose I. ve svých hrobkách zaznamenávají, že bojovali v Naharinu, a Thutmose III. překročil ve třicátém třetím roce své vlády Eufrat, postavil svou stélu vedle stély Thutmose I. a zpustošil města Naharinu. Později obě mocnosti uzavřely mír a amarnské listy uchovávají korespondenci mitannského krále Tušratty s Amenhotepem III. a Achnatonem. Mitanni podlehlo ve čtrnáctém a třináctém století př. n. l. Chetitům a pak Asyřanům a zemi poté osídlily aramejské kmeny, a proto ji Bible nazývá Aram."
  sv:
    - "Aram-Naharajim, ”Aram mellan de två floderna”, är det hebreiska namnet på landet i Eufrats stora krök, kring Harran och mot Khabur, i dagens sydöstra Turkiet och nordöstra Syrien; kartan placerar det vid Harran. Septuaginta återger det som Mesopotamien, och i Psalm 60:s rubrik som ”Mesopotamien i Syrien”, varav synodalbibelns ”Syrien i Mesopotamien” här och i Första Krönikeboken 19:6; på andra ställen skriver både synodalbibeln och King James-översättningen Mesopotamien, och King James behåller Aram-Naharajim bara i den rubriken. Egyptiska texter från Nya riket kallar samma trakt Naharin: det var det hurritiska riket Mitannis land."
    - "Rubriken till Psalm 60 placerar psalmen i Davids krig: ”när han var i fejd med Aram-Naharaim och Aram-Soba, och Joab kom tillbaka och slog edoméerna i Saltdalen, tolv tusen man”; de parallella berättelserna anger arton tusen och tillskriver det David och Avishaj. Krönikeböckerna säger också att ammoniterna lejde vagnar och ryttare mot David ”från Aram-Naharaim, från Aram-Maaka och från Soba”, där hebreiskan åter har Aram-Naharajim. Annars markerar namnet hemorten för Abrahams släkt, Bileams stad och landet för Kushan-Rishatajim, den förste förtryckaren i Domarboken."
    - "På 1400-talet f.Kr. var Naharin Egyptens store rival i Syrien. Thutmosis I:s officerare uppger i sina gravar att de stred i Naharin, och Thutmosis III korsade i sitt trettiotredje regeringsår Eufrat, reste sin stele bredvid Thutmosis I:s och förödde Naharins städer. Senare slöt de två makterna fred, och Amarnabreven bevarar den mitannitiske kungen Tushrattas korrespondens med Amenhotep III och Akhenaton. Mitanni föll för Hettitiska riket och sedan Assyrien på 1300- och 1200-talen f.Kr., och arameiska stammar bosatte sedan landet, vilket är skälet till att Bibeln kallar det Aram."
  nb:
    - "Aram-Naharajim, «Aram ved de to elvene», er det hebraiske navnet på landet i den store svingen av Eufrat, rundt Harran og mot Khabur, i dagens sørøstlige Tyrkia og nordøstlige Syria; kartet plasserer det ved Harran. Septuaginta gjengir det som Mesopotamia, og i overskriften til Salme 60 «Mesopotamia i Syria», hvorav synodalbibelens «Syria i Mesopotamia» her og i 1. Krønikebok 19,6; ellers skriver både synodalbibelen og King James-oversettelsen Mesopotamia, og King James beholder Aram-Naharajim bare i den overskriften. Egyptiske tekster fra Det nye riket kaller den samme regionen Naharin: det var landet til det hurrittiske kongeriket Mitanni."
    - "Overskriften til Salme 60 setter salmen i Davids kriger: «da han stred mot syrerne fra Mesopotamia og mot syrerne fra Soba, og Joab kom tilbake og slo edomittene i Saltdalen, tolv tusen»; de parallelle beretningene oppgir atten tusen og krediterer David og Abisjai. Krønikebøkene sier også at ammonittene leide vogner og hestfolk mot David «fra Mesopotamia og fra syrerne i Ma'aka og fra Soba», der hebraisk igjen har Aram-Naharajim. Ellers markerer navnet hjemstedet til Abrahams slekt, Bileams by og landet til Kusjan-Rishatajim, den første undertrykkeren i Dommerboken."
    - "På 1400-tallet f.Kr. var Naharin Egypts store rival i Syria. Offiserer under Tutmosis I forteller i gravene sine at de kjempet i Naharin, og Tutmosis III krysset i sitt trettitredje regjeringsår Eufrat, reiste steleen sin ved siden av Tutmosis I's og ødela byene i Naharin. Senere sluttet de to maktene fred, og Amarna-brevene bevarer korrespondansen mellom den mitanniske kongen Tusjratta og Amenhotep III og Akhenaton. Mitanni falt til hettittene og så assyrerne på 1300- og 1200-tallet f.Kr., og arameiske stammer bosatte da landet, og derfor kaller Bibelen det Aram."
  tl:
    - "Ang Aram-naharaim, “Aram ng dalawang ilog”, ay ang pangalang Hebreo ng bansa sa malaking liko ng Eufrates, sa palibot ng Haran at patungo sa Khabur, sa timog-silangang Turkey at hilagang-silangang Siria ngayon; inilalagay ito ng mapa sa Haran. Isinasalin ito ng Septuaginta bilang Mesopotamia, at sa pamagat ng Salmo 60 ay “Mesopotamia ng Siria”, kaya ang Sinodal na “Siria ng Mesopotamia” dito at sa 1 Cronica 19:6; sa ibang lugar, parehong Mesopotamia ang isinusulat ng Sinodal na Biblia at ng King James Version, at pinananatili ng King James ang Aram-naharaim sa pamagat na iyon lamang. Tinatawag ng mga tekstong Egipcio ng Bagong Kaharian ang parehong rehiyon na Naharin: ito ang lupain ng kahariang Hurriano ng Mitanni."
    - "Inilalagay ng pamagat ng Salmo 60 ang salmo sa mga digmaan ni David: nang makipagtunggali siya sa Aram-naharaim at sa Aram-soba, nang bumalik si Joab at patayin ang labindalawang libo sa Edom sa Libis ng Asin; ang mga kahilera ay nagsasabing labingwalong libo at pinararangalan sina David at Abisai. Sinasabi rin ng Mga Cronica na umupa ang mga Ammonita ng mga karo at mangangabayo laban kay David “mula sa Mesopotamia, at mula sa Aram-maacha, at mula sa Soba”, kung saan ang Hebreo ay muling may Aram-naharaim. Sa ibang lugar, minamarkahan ng pangalan ang tahanan ng mga kamag-anak ni Abraham, ang bayan ni Balaam at ang lupain ni Chusan-risathaim, ang unang mang-api sa Mga Hukom."
    - "Noong ika-15 siglo BK, ang Naharin ang dakilang karibal ng Egipto sa Siria. Itinatala ng mga opisyal ni Thutmose I sa kanilang mga libingan na nakipaglaban sila sa Naharin, at si Thutmose III, sa ika-33 taon ng kaniyang paghahari, ay tumawid sa Eufrates, itinayo ang kaniyang estela sa tabi ng kay Thutmose I at winasak ang mga bayan ng Naharin. Kalaunan ay nagkasundo ang dalawang kapangyarihan, at iniingatan ng mga liham ng Amarna ang sulatan ng haring Mitanniano na si Tushratta kay Amenhotep III at Akhenaten. Bumagsak ang Mitanni sa mga Hetheo at pagkatapos sa mga Asirio noong ika-14 at ika-13 siglo BK, at nanirahan sa bansa ang mga tribong Arameo, kaya Aram ang tawag dito ng Biblia."
  da:
    - "Aram-Naharajim, »Aram ved de to floder«, er det hebraiske navn på landet i Eufrats store bue, omkring Karan og mod Khabur, i nutidens sydøstlige Tyrkiet og nordøstlige Syrien; kortet placerer det ved Karan. Septuaginta gengiver det Mesopotamien, og i Salme 60's overskrift »Mesopotamien i Syrien«, hvorfra synodalbibelens »Syrien i Mesopotamien« stammer her og i 1 Krønikebog 19,6; ellers skriver både synodalbibelen og King James Version Mesopotamien, og King James beholder kun Aram-Naharajim i den overskrift. Egyptiske tekster fra Det Nye Rige kalder den samme egn Naharin: det var det hurritiske rige Mitannis land."
    - "Salme 60's overskrift sætter salmen i Davids krige: »der han stred med Mesopotamierne og med Syrerne af Zoba, og der Joab kom tilbage og slog Edomiterne i Saltdalen, tolv Tusinde«; de parallelle beretninger siger atten tusinde og tilskriver det David og Abisjaj. Krønikebøgerne siger også, at ammonitterne lejede stridsvogne og ryttere mod David »fra Mesopotamien og fra Syria-Maaka og fra Zoba«, hvor den hebraiske tekst igen har Aram-Naharajim. Andre steder markerer navnet hjemstedet for Abrahams slægt, Bileams by og Kusan-Risathaims land, den første undertrykker i Dommerbogen."
    - "I 1400-tallet f.Kr. var Naharin Egyptens store rival i Syrien. Thutmosis 1.s officerer skriver i deres grave, at de kæmpede i Naharin, og Thutmosis 3. krydsede i sit treogtredivte regeringsår Eufrat, rejste sin stele ved siden af Thutmosis 1.s og hærgede Naharins byer. Senere sluttede de to magter fred, og Amarna-brevene bevarer korrespondancen mellem Mitannis konge Tushratta og Amenhotep 3. og Akhenaton. Mitanni faldt til hittitterne og siden assyrerne i 1300- og 1200-tallet f.Kr., og arameiske stammer bosatte sig da i landet, hvorfor Bibelen kalder det Aram."
  sr:
    - "Арам-Нахараим, „Арам двеју река“, хебрејско је име земље у великом завоју Еуфрата, око Харана и ка Хабуру, у данашњој југоисточној Турској и североисточној Сирији; карта га поставља у Харан. Септуагинта га преводи као Месопотамија, а у наслову Псалма 60 као „Месопотамија Сирије“, одакле синодално „Сирија Месопотамска“ овде и у 1. Летописа 19,6; другде и синодална Библија и Библија краља Џејмса пишу Месопотамија, а Џејмсова задржава Арам-Нахараим само у том наслову. Египатски текстови Новог краљевства зову исту област Нахарин: то је била земља хуритског краљевства Митани."
    - "Наслов Псалма 60 смешта псалам у Давидове ратове: када се борио с Арам-Нахараимом и с Арам-Совом, када се Јоав вратио и поразио Едом у Сланој долини, дванаест хиљада; паралелни извештаји дају осамнаест хиљада и приписују заслугу Давиду и Ависају. Летописи такође кажу да су Амонци најмили кола и коњике против Давида „из Месопотамије и из Сирије Махе и из Сове“, где хебрејски опет има Арам-Нахараим. Другде име означава завичај Аврамове родбине, град Валамов и земљу Хусан-Рисатајимову, првог тлачитеља у Судијама."
    - "У 15. веку п. н. е. Нахарин је био велики супарник Египта у Сирији. Официри Тутмеса I бележе у својим гробницама да су се борили у Нахарину, а Тутмес III је у тридесет трећој години своје владавине прешао Еуфрат, подигао своју стелу поред Тутмесове I и опустошио градове Нахарина. Касније су две силе склопиле мир, а писма из Амарне чувају преписку митанског цара Тушрате с Аменхотепом III и Ехнатоном. Митани су пали пред Хетитима, а затим Асирцима у 14. и 13. веку п. н. е., а арамејска племена су потом населила земљу, због чега је Библија зове Арам."
