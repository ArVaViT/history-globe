# Overview article (ADR 0007). Mainstream facts only; Jebus is taken as Jerusalem, as the Bible says, and the minority view that separates them (the Shufat candidate on the map) is named as such; no absolute dates are given for David.
id: jebus
place: a403c45
title:
  en: "Jebus"
  ru: "Иевус"
  uk: "Євус"
  es: "Jebús"
  pt: "Jebus"
  de: "Jebus"
  fr: "Jébus"
  pl: "Jebus"
  it: "Gebus"
