# Overview article (ADR 0007). Mainstream facts only; Jebus is taken as Jerusalem, as the Bible says, and the minority view that separates them (the Shufat candidate on the map) is named as such; no absolute dates are given for David.
id: jebus
place: a403c45
title:
  en: "Jebus"
  ru: "Иевус"
  uk: "Євус"
  es: "Jebús"
  pt: "Jebus"
  de: "Jebus"
  fr: "Jébus"
body:
  en:
    - "Jebus is the name the Bible gives Jerusalem in the days before David, when the Jebusites held it; the record here stands at Jerusalem. In the border lists of Joshua the city appears as “the Jebusite; the same is Jerusalem”, and among the towns of Benjamin as “Jebusi, which is Jerusalem”. The Levite of Judges 19 “came over against Jebus, which is Jerusalem”, and his servant proposed to turn in to “this city of the Jebusites”, but his master would not lodge in a city of strangers and went on to Gibeah. The Chronicler says that “David and all Israel went to Jerusalem, which is Jebus”, and that “the inhabitants of Jebus said to David, Thou shalt not come hither.”"
    - "The Jebusites are counted among the peoples of Canaan from Genesis onward, and Ezekiel reminds Jerusalem that “thy father was an Amorite, and thy mother an Hittite”. Neither Judah nor Benjamin drove them out: “the Jebusites dwell with the children of Judah at Jerusalem unto this day.” David took “the strong hold of Zion” from them and made it the city of David, and when the plague was stayed he bought the threshing floor of Araunah the Jebusite, where Solomon later built the Temple. Zechariah could still promise that Ekron would be “as a Jebusite”, a stranger absorbed into Judah."
    - "Outside the Bible the city is never called Jebus. Egyptian execration texts of the nineteenth or eighteenth century BC seem to name Rushalimum, and the Amarna letters of the fourteenth century, written by its ruler Abdi-Heba, call it Urusalim; the name Jerusalem is therefore older than the Bible's Jebus, which most scholars take for a name formed from the people, or for the name of the citadel. A few, following J. Maxwell Miller, have argued that Jebus was a separate town north of Jerusalem, at Shuafat, and that the two were later confused; most reject this, since the Bible itself equates them. The Jebusite city has been sought on the ridge of the City of David above the Gihon spring, where fortifications of the Middle Bronze Age and remains of the Late Bronze Age have been found."
  ru:
    - "Иевус — имя, которым Библия называет Иерусалим во дни до Давида, когда им владели Иевусеи; запись здесь стоит в Иерусалиме. В пограничных списках книги Иисуса Навина город назван «Иевуса, который есть Иерусалим», а среди городов Вениамина — «Иевус, иначе Иерусалим». Левит из 19-й главы Судей «пришел к Иевусу, что ныне Иерусалим», и слуга предложил ему: «зайдем в этот город Иевусеев и ночуем в нем», но господин не захотел ночевать в городе чужих и пошёл дальше в Гиву. Летописец говорит, что «пошел Давид и весь Израиль к Иерусалиму, то есть к Иевусу», и что «сказали жители Иевуса Давиду: не войдешь сюда»."
    - "Иевусеи числятся среди народов Ханаана начиная с книги Бытия, а Иезекииль напоминает Иерусалиму: «отец твой Аморрей, и мать твоя Хеттеянка». Ни Иуда, ни Вениамин не изгнали их: «Иевусеи живут с сынами Иуды в Иерусалиме даже до сего дня». Давид взял у них крепость Сион и сделал её городом Давидовым, а когда язва прекратилась, купил гумно Орны Иевусеянина, где Соломон потом построил Храм. Захария ещё мог обещать, что Екрон будет «как Иевусей», чужак, вошедший в Иудею."
    - "Вне Библии город никогда не называется Иевусом. Египетские тексты проклятий XIX или XVIII века до н. э., по-видимому, называют Рушалимум, а амарнские письма XIV века, написанные его правителем Абди-Хебой, зовут его Урусалим; имя Иерусалим, стало быть, старше библейского Иевуса, в котором большинство учёных видят имя, образованное от народа, или имя крепости. Немногие, вслед за Дж. Максвеллом Миллером, доказывали, что Иевус был отдельным городом к северу от Иерусалима, в Шуафате, и что позже их смешали; большинство это отвергает, поскольку сама Библия отождествляет их. Иевусейский город ищут на гребне города Давидова над источником Гион, где найдены укрепления среднего бронзового века и остатки позднего бронзового века."
  uk:
    - "Євус — назва, яку Біблія дає Єрусалиму за днів до Давида, коли його тримали євусеї; тут запис стоїть при Єрусалимі. У переліках меж у Книзі Ісуса Навина місто з’являється як «нагірньої стїни Евузійської, се Ерусалим», а серед міст Веніямина як «Евусі, се Ерусалим». Левіт із Книги Суддів 19 «прибув у Евус, се Ерусалим», і його слуга запропонував завернути в «Евузіївський город», але пан не захотів ночувати в місті чужинців і пішов далі до Гіви. Літописець каже, що «пійшов Давид і ввесь Ізраїль у Ерусалим, се б то в Евус», і що «сказали осадники Евуса Давидові: Не доступиш ти сюди!»"
    - "Євусеїв зараховують до народів Ханаану від Книги Буття, і Єзекіїль нагадує Єрусалиму: «батько твій — Аморій, а мати Гетійка». Ні Юда, ні Веніямин їх не вигнали: «от і живуть Евузії з синами Юди в Ерусалимі по сей день». Давид узяв у них «замок Сион» і зробив його Містом Давида, а коли чума зупинилася, купив гумно Орни Євусея, де пізніше Соломон збудував храм. Захарія ще міг обіцяти, що Екрон буде «як Евузій», чужинець, поглинений Юдою."
    - "Поза Біблією місто ніколи не називають Євусом. Єгипетські тексти прокляття XIX–XVIII ст. до н. е., схоже, називають Рушалімум, а амарнські листи XIV ст., писані його правителем Абді-Хебою, називають його Урусалім; назва Єрусалим, отже, давніша за біблійний Євус, який більшість дослідників вважає назвою, утвореною від народу, або назвою цитаделі. Деякі, слідом за Дж. Максвеллом Міллером, доводили, що Євус був окремим містом на північ від Єрусалима, у Шуафаті, і що їх пізніше сплутали; більшість це відкидає, бо сама Біблія ототожнює їх. Євусейське місто шукали на хребті Міста Давида над джерелом Гіхон, де знайдено укріплення середнього бронзового віку і рештки пізнього бронзового віку."
  es:
    - "Jebús es el nombre que da la Biblia a Jerusalén en los días anteriores a David, cuando la tenían los jebuseos; el registro aquí está en Jerusalén. En las listas de fronteras de Josué la ciudad aparece como «el Jebuseo al mediodía: esta es Jerusalem», y entre las ciudades de Benjamín como «Jebus, que es Jerusalem». El levita de Jueces 19 «llegó hasta enfrente de Jebus, que es Jerusalem», y su criado propuso entrar en «esta ciudad de los Jebuseos», pero su señor no quiso alojarse en una ciudad de extranjeros y siguió hasta Gabaa. El Cronista dice que «se fué David con todo Israel á Jerusalem, la cual es Jebus», y que «los moradores de Jebus dijeron á David: No entrarás acá»."
    - "Los jebuseos se cuentan entre los pueblos de Canaán desde el Génesis, y Ezequiel recuerda a Jerusalén que «tu padre Amorrheo, y tu madre Hethea». Ni Judá ni Benjamín los expulsaron: «quedó el Jebuseo en Jerusalem con los hijos de Judá, hasta hoy». David les tomó «la fortaleza de Sión» y la hizo la ciudad de David, y cuando se detuvo la plaga compró la era de Arauna el jebuseo, donde Salomón construiría más tarde el Templo. Zacarías aún podía prometer que Ecrón sería «como el Jebuseo», un extranjero absorbido en Judá."
    - "Fuera de la Biblia la ciudad nunca se llama Jebús. Los textos egipcios de execración del siglo XIX o XVIII a. C. parecen nombrar Rushalimum, y las cartas de Amarna del siglo XIV, escritas por su gobernante Abdi-Heba, la llaman Urusalim; el nombre de Jerusalén es, por tanto, más antiguo que el Jebús de la Biblia, que la mayoría de los estudiosos toman por un nombre formado a partir del pueblo, o por el nombre de la ciudadela. Unos pocos, siguiendo a J. Maxwell Miller, han sostenido que Jebús era una población distinta al norte de Jerusalén, en Shuafat, y que más tarde se confundieron; la mayoría lo rechaza, pues la propia Biblia las equipara. La ciudad jebusea se ha buscado en la loma de la Ciudad de David sobre la fuente de Gihón, donde se han hallado fortificaciones de la Edad del Bronce Medio y restos del Bronce Final."
  pt:
    - "Jebus é o nome que a Bíblia dá a Jerusalém nos dias anteriores a Davi, quando os jebuseus a possuíam; o registro aqui fica em Jerusalém. Nas listas de fronteira de Josué a cidade aparece como “a encosta dos jebuseus (também chamada Jerusalém)”, e entre as cidades de Benjamim como “a cidade dos jebuseus (também chamada Jerusalém)”. O levita de Juízes 19 chegou “perto de Jebus (também chamada Jerusalém)”, e seu servo propôs entrar “nesta cidade dos jebuseus”, mas o seu senhor não quis pernoitar numa cidade de estrangeiros e seguiu para Gibeá. O cronista diz que “Davi e todo o Israel foram para Jerusalém (também chamada de Jebus)”, e que “Os habitantes de Jebus disseram a Davi: ‘Você não entrará aqui!’”"
    - "Os jebuseus são contados entre os povos de Canaã desde Gênesis, e Ezequiel lembra a Jerusalém que “O seu pai era amorreu, e a sua mãe, heteia”. Nem Judá nem Benjamim os expulsou: “os jebuseus vivem com os filhos de Judá em Jerusalém até o dia de hoje”. Davi tomou deles “a fortaleza de Sião” e fez dela a cidade de Davi, e quando a praga cessou comprou a eira de Araúna, o jebuseu, onde Salomão construiu depois o Templo. Zacarias ainda podia prometer que Ecrom seria “como um jebuseu”, um estrangeiro absorvido por Judá."
    - "Fora da Bíblia a cidade nunca é chamada Jebus. Textos egípcios de execração do século XIX ou XVIII a.C. parecem nomear Rushalimum, e as cartas de Amarna do século XIV, escritas por seu governante Abdi-Heba, a chamam Urusalim; o nome Jerusalém é, portanto, mais antigo que o Jebus da Bíblia, que a maioria dos estudiosos toma por um nome formado a partir do povo ou pelo nome da cidadela. Alguns, seguindo J. Maxwell Miller, sustentaram que Jebus era uma cidade separada ao norte de Jerusalém, em Shuafat, e que as duas foram depois confundidas; a maioria rejeita isso, já que a própria Bíblia as equipara. A cidade jebusita foi procurada na crista da Cidade de Davi acima da fonte de Giom, onde se acharam fortificações do Bronze Médio e restos do Bronze Tardio."
  de:
    - "Jebus ist der Name, den die Bibel Jerusalem in den Tagen vor David gibt, als die Jebusiter es hielten; die Aufzeichnung steht hier bei Jerusalem. In den Grenzlisten Josuas erscheint die Stadt „an der Mittagseite des Jebusiters, das ist Jerusalem“ und unter den Städten Benjamins als „die Jebusiter, das ist Jerusalem“. Der Levit in Richter 19 „kam bis vor Jebus, das ist Jerusalem“, und sein Knecht schlug vor, „in diese Stadt der Jebusiter“ einzukehren, doch sein Herr wollte nicht in einer fremden Stadt übernachten und zog weiter nach Gibea. Der Chronist sagt: „David zog hin und das ganze Israel gen Jerusalem, das ist Jebus“, und „die Bürger zu Jebus sprachen zu David: Du sollst nicht hereinkommen“."
    - "Die Jebusiter werden von der Genesis an zu den Völkern Kanaans gezählt, und Hesekiel erinnert Jerusalem: „dein Vater aus den Amoritern und deine Mutter aus den Hethitern“. Weder Juda noch Benjamin vertrieb sie: „also blieben die Jebusiter mit den Kindern Juda zu Jerusalem bis auf diesen Tag.“ David gewann ihnen „die Burg Zion“ ab und machte sie zur Stadt Davids, und als die Plage aufhörte, kaufte er die Tenne Araunas, des Jebusiters, wo Salomo später den Tempel baute. Sacharja konnte noch verheißen, Ekron werde sein „wie die Jebusiter“, ein in Juda aufgenommener Fremder."
    - "Außerhalb der Bibel heißt die Stadt nie Jebus. Ägyptische Ächtungstexte des 19. oder 18. Jahrhunderts v. Chr. scheinen Rushalimum zu nennen, und die Amarnabriefe des 14. Jahrhunderts, von ihrem Herrscher Abdi-Heba geschrieben, nennen sie Urusalim; der Name Jerusalem ist also älter als das biblische Jebus, das die meisten Forscher für einen vom Volk gebildeten Namen oder für den Namen der Zitadelle halten. Einige, J. Maxwell Miller folgend, haben vertreten, Jebus sei eine eigene Stadt nördlich von Jerusalem gewesen, bei Schuafat, und beide seien später verwechselt worden; die meisten lehnen das ab, da die Bibel selbst sie gleichsetzt. Die jebusitische Stadt hat man auf dem Höhenrücken der Stadt Davids über der Gihonquelle gesucht, wo Befestigungen der Mittelbronzezeit und Reste der Spätbronzezeit gefunden wurden."
  fr:
    - "Jébus est le nom que la Bible donne à Jérusalem aux jours d’avant David, quand les Jébusiens la tenaient ; la fiche se tient à Jérusalem. Dans les listes de Josué, la ville apparaît sous le nom de « Jebus, qui est Jérusalem », aussi bien dans la frontière de Juda que parmi les villes de Benjamin. Le Lévite de Juges 19 « arriva jusque devant Jebus, qui est Jérusalem », et son serviteur proposa de s’arrêter dans « cette ville des Jébusiens », mais son maître ne voulut pas loger dans une ville d’étrangers et poursuivit jusqu’à Guibea. Le Chroniqueur dit que « David marcha avec tout Israël sur Jérusalem, qui est Jebus », et que « les habitants de Jebus dirent à David : Tu n’entreras point ici. »"
    - "Les Jébusiens sont comptés parmi les peuples de Canaan dès la Genèse, et Ézéchiel rappelle à Jérusalem : « ton père était un Amoréen, et ta mère une Héthienne ». Ni Juda ni Benjamin ne les chassèrent : « les Jébusiens ont habité avec les fils de Juda à Jérusalem jusqu’à ce jour. » David leur prit « la forteresse de Sion » et en fit la cité de David, et quand la plaie s’arrêta, il acheta l’aire d’Aravna le Jébusien, où Salomon bâtit plus tard le Temple. Zacharie pouvait encore promettre qu’Ékron serait « comme les Jébusiens », des étrangers absorbés en Juda."
    - "Hors de la Bible, la ville n’est jamais appelée Jébus. Des textes d’exécration égyptiens du XIXe ou XVIIIe siècle av. J.-C. semblent nommer Rushalimum, et les lettres d’Amarna du XIVe siècle, écrites par son souverain Abdi-Heba, l’appellent Urusalim ; le nom de Jérusalem est donc plus ancien que le Jébus de la Bible, que la plupart des spécialistes prennent pour un nom formé d’après le peuple, ou pour le nom de la citadelle. Quelques-uns, à la suite de J. Maxwell Miller, ont soutenu que Jébus était une ville distincte au nord de Jérusalem, à Shuafat, et que les deux furent plus tard confondues ; la plupart rejettent cette thèse, puisque la Bible elle-même les identifie. La ville jébusienne a été cherchée sur la crête de la Cité de David au-dessus de la source de Guihon, où l’on a trouvé des fortifications du Bronze moyen et des vestiges du Bronze récent."
