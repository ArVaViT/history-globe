body:
  en:
    - "Egypt is the land of the lower Nile: a strip of watered valley and the wide Delta, shut in by desert, from the First Cataract at Syene (Aswan) to the Mediterranean. The Bible calls it Mizraim. Upper and Lower Egypt were united about 3000 BC, and the pyramids of Giza rose in the Old Kingdom, in the twenty-sixth and twenty-fifth centuries BC. In the New Kingdom (c. 1550–1069 BC) the pharaohs held Canaan as a province, and the stele of Merneptah, about 1208 BC, carries the oldest known mention of Israel outside the Bible."
    - 'Abram went down into Egypt in a famine, Joseph was sold there and rose to govern it, and Jacob''s family settled in the land of Goshen. Exodus tells how a new king enslaved the Israelites and how God brought them "out of the land of Egypt, out of the house of bondage". The date of the exodus is disputed: the figures of 1 Kings point to about 1446 BC, many scholars prefer the thirteenth century, the age of Rameses II, and others hold that the story cannot be dated. Egypt remained the great power to the south: Solomon married a pharaoh''s daughter, Shishak (Shoshenq I) marched on Jerusalem in the fifth year of Rehoboam, about 925 BC, and Isaiah cried, "Woe to them that go down to Egypt for help".'
    - "Pharaoh Necho killed Josiah at Megiddo in 609 BC and was routed at Carchemish in 605. After the fall of Jerusalem Judeans fleeing the Babylonians carried Jeremiah to Egypt, where he prophesied to the Jews of Migdol, Tahpanhes and Noph. Papyri from Elephantine show a Jewish garrison with a temple of its own on the Nile under Persian rule, which began with Cambyses in 525 BC. Alexander founded Alexandria in 331 BC; the Ptolemies ruled Egypt until 30 BC, and under them the Law was translated into Greek for the Jews of Alexandria, the beginning of the Septuagint."
    - 'Matthew tells how Joseph took the child and his mother by night into Egypt until the death of Herod, "that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son", the words of Hosea. Jews from Egypt heard the apostles at Pentecost, and Apollos, "born at Alexandria", was "mighty in the scriptures". Isaiah''s oracle on Egypt ends with a blessing: "Blessed be Egypt my people". Eusebius records the tradition that Mark founded the church of Alexandria; the Copts, Egypt''s Christians, still count their years from the reign of Diocletian. The Arab Republic of Egypt, with its capital at Cairo, has more than a hundred million people, nearly all of them along the Nile.'
  ru:
    - "Египет — страна нижнего Нила: полоса орошаемой долины и широкая Дельта, зажатые пустыней, от первого порога у Сиены (Асуана) до Средиземного моря. В Библии он зовётся Мицраим. Верхний и Нижний Египет объединились около 3000 г. до н. э., а пирамиды Гизы поднялись в Древнем царстве, в XXVI–XXV веках до н. э. В Новом царстве (ок. 1550–1069 гг. до н. э.) фараоны держали Ханаан как провинцию, а стела Мернептаха, около 1208 г. до н. э., несёт древнейшее известное упоминание Израиля вне Библии."
    - "Аврам сошёл в Египет во время голода, Иосиф был продан туда и возвысился до правителя страны, а семья Иакова поселилась в земле Гесем. Книга Исход рассказывает, как новый царь поработил Израильтян и как Бог вывел их «из земли Египетской, из дома рабства». Дата исхода спорна: по числам Третьей книги Царств он приходится примерно на 1446 г. до н. э., многие учёные предпочитают XIII век, время Рамсеса II, а иные считают, что рассказ вообще нельзя датировать. Египет оставался великой державой на юге: Соломон женился на дочери фараона, Сусаким (Шешонк I) вышел против Иерусалима на пятом году Ровоама, около 925 г. до н. э., а Исаия восклицал: «Горе тем, которые идут в Египет за помощью»."
    - "Фараон Нехао убил Иосию при Мегиддоне в 609 г. до н. э. и был разбит при Кархемисе в 605 г. После падения Иерусалима Иудеи, бежавшие от Вавилонян, увели в Египет Иеремию, и он пророчествовал там Иудеям Магдола, Тафниса и Нофа. Папирусы с Элефантины показывают иудейский гарнизон с собственным храмом на Ниле под властью Персии, которая началась с Камбиза в 525 г. до н. э. Александр основал Александрию в 331 г. до н. э.; Птолемеи правили Египтом до 30 г. до н. э., и при них Закон был переведён на греческий для александрийских Иудеев — так началась Септуагинта."
    - "Матфей рассказывает, как Иосиф ночью взял Младенца и Матерь Его в Египет и был там до смерти Ирода, «да сбудется реченное Господом через пророка, который говорит: из Египта воззвал Я Сына Моего», — слова Осии. Иудеи из Египта слышали апостолов в день Пятидесятницы, а Аполлос, «родом из Александрии», был «сведущий в Писаниях». Пророчество Исаии о Египте кончается благословением: «благословен народ Мой — Египтяне». Евсевий передаёт предание, что церковь в Александрии основал Марк; копты, христиане Египта, до сих пор ведут счёт лет от воцарения Диоклетиана. В Арабской Республике Египет со столицей в Каире живёт более ста миллионов человек, почти все — вдоль Нила."
  uk:
    - "Єгипет — це земля нижнього Нілу: смуга зрошеної долини та широка Дельта, затиснуті пустелею, від Першого порога біля Сієни (Асуан) до Середземного моря. Біблія називає його Міцраїм. Верхній і Нижній Єгипет були об'єднані близько 3000 р. до н. е., а піраміди Гізи постали в Старому царстві, у XXVI–XXV ст. до н. е. У Новому царстві (бл. 1550–1069 рр. до н. е.) фараони тримали Ханаан як провінцію, а стела Мернептаха, близько 1208 р. до н. е., несе найдавнішу відому згадку про Ізраїль поза Біблією."
    - "Аврам зійшов до Єгипту під час голоду, Йосипа продали туди, і він піднісся до управління ним, а родина Якова оселилася в землі Гошен. Книга Виходу розповідає, як новий цар поневолив ізраїльтян і як Бог вивів їх «з Египту, із дому невольницького». Дата виходу є спірною: цифри 1 Книги Царів вказують на близько 1446 р. до н. е., багато вчених віддають перевагу XIII ст., добі Рамсеса II, а інші вважають, що історію не можна датувати. Єгипет лишався великою державою на півдні: Соломон одружився з дочкою фараона, Сусакім (Шешонк I) виступив на Єрусалим на п'ятому році Ровоама, близько 925 р. до н. е., а Ісая вигукнув: «Горе тим, що до Египту за підмогою ходять»."
    - "Фараон Нехао вбив Йосію в Мегіддо в 609 р. до н. е. і був розбитий при Каркемиші в 605 р. Після падіння Єрусалима юдеї, що тікали від вавилонян, повели Єремію до Єгипту, де він пророкував юдеям Мігдолу, Тафнісу та Нофу. Папіруси з Елефантини показують юдейську залогу з власним храмом на Нілі під персами, чия влада почалася з Камбіза в 525 р. до н. е. Александр заснував Александрію в 331 р. до н. е.; Птолемеї правили Єгиптом до 30 р. до н. е., і за них Закон було перекладено грецькою для юдеїв Александрії, початок Септуагінти."
    - "Матвій розповідає, як Йосип узяв Дитя і Його матір уночі до Єгипту аж до смерті Ірода, «щоб справдилось, що сказав Господь через пророка, глаголючи: Із Єгипту покликав я сина мого», — слова Осії. Юдеї з Єгипту чули апостолів на П'ятдесятницю, а Аполлос, «родом Александриєць», був «сильний у писаннях». Оракул Ісаї про Єгипет закінчується благословенням: «Благословен нарід мій — Египтїї». Євсевій передає переказ, що Марк заснував церкву Александрії; копти, християни Єгипту, досі ведуть літочислення від правління Діоклетіана. Арабська Республіка Єгипет зі столицею в Каїрі має понад сто мільйонів мешканців, майже всі вони вздовж Нілу."
  es:
    - "Egipto es la tierra del bajo Nilo: una franja de valle regado y el ancho Delta, cercados por el desierto, desde la primera catarata en Sevene (Asuán) hasta el Mediterráneo. La Biblia lo llama Mizraim. El Alto y el Bajo Egipto se unieron hacia el 3000 a. C., y las pirámides de Guiza se alzaron en el Reino Antiguo, en los siglos XXVI y XXV a. C. En el Reino Nuevo (h. 1550–1069 a. C.) los faraones poseyeron Canaán como provincia, y la estela de Mernepta, hacia el 1208 a. C., contiene la mención más antigua conocida de Israel fuera de la Biblia."
    - "Abram descendió a Egipto en una hambruna, José fue vendido allí y llegó a gobernarlo, y la familia de Jacob se estableció en la tierra de Gosén. El Éxodo cuenta cómo un nuevo rey esclavizó a los israelitas y cómo Dios los sacó «de la tierra de Egipto, de casa de siervos». La fecha del éxodo es objeto de debate: las cifras de 1 Reyes apuntan hacia el 1446 a. C., muchos estudiosos prefieren el siglo XIII, la época de Ramesés II, y otros sostienen que el relato no puede fecharse. Egipto siguió siendo la gran potencia del sur: Salomón se casó con la hija de un faraón, Sisac (Sheshonq I) marchó sobre Jerusalén en el quinto año de Roboam, hacia el 925 a. C., e Isaías clamó: «¡Ay de los que descienden á Egipto por ayuda!»."
    - "El faraón Necao mató a Josías en Meguido en el 609 a. C. y fue derrotado en Carquemis en el 605. Tras la caída de Jerusalén, judeos que huían de los babilonios llevaron a Jeremías a Egipto, donde profetizó a los judíos de Migdol, Tafnes y Nof. Los papiros de Elefantina muestran una guarnición judía con templo propio en el Nilo bajo dominio persa, que comenzó con Cambises en el 525 a. C. Alejandro fundó Alejandría en el 331 a. C.; los Ptolomeos gobernaron Egipto hasta el 30 a. C., y bajo ellos la Ley fue traducida al griego para los judíos de Alejandría, principio de la Septuaginta."
    - "Mateo cuenta cómo José tomó de noche al niño y a su madre y se fue a Egipto hasta la muerte de Herodes, «para que se cumpliese lo que fué dicho por el Señor, por el profeta que dijo: De Egipto llamé á mi Hijo», palabras de Oseas. Judíos de Egipto oyeron a los apóstoles en Pentecostés, y Apolos, «natural de Alejandría», era «poderoso en las Escrituras». El oráculo de Isaías sobre Egipto termina con una bendición: «Bendito el pueblo mío Egipto». Eusebio recoge la tradición de que Marcos fundó la iglesia de Alejandría; los coptos, los cristianos de Egipto, cuentan todavía sus años desde el reinado de Diocleciano. La República Árabe de Egipto, con su capital en El Cairo, tiene más de cien millones de habitantes, casi todos a lo largo del Nilo."
  pt:
    - "O Egito é a terra do baixo Nilo: uma faixa de vale irrigado e o amplo Delta, cercados de deserto, da Primeira Catarata em Sevene (Assuã) ao Mediterrâneo. A Bíblia o chama Mizraim. O Alto e o Baixo Egito foram unidos por volta de 3000 a.C., e as pirâmides de Gizé se ergueram no Antigo Império, nos séculos XXVI e XXV a.C. No Novo Império (c. 1550–1069 a.C.), os faraós mantinham Canaã como província, e a estela de Merneptá, por volta de 1208 a.C., traz a menção mais antiga conhecida de Israel fora da Bíblia."
    - "Abrão desceu ao Egito numa fome, José foi vendido ali e subiu a governá-lo, e a família de Jacó se estabeleceu na terra de Gósen. O Êxodo conta como um novo rei escravizou os israelitas e como Deus os tirou “da terra do Egito, da casa da escravidão”. A data do êxodo é disputada: os números de 1 Reis apontam para cerca de 1446 a.C., muitos estudiosos preferem o século XIII, a época de Ramessés II, e outros sustentam que a narrativa não pode ser datada. O Egito continuou sendo a grande potência ao sul: Salomão casou-se com a filha de um faraó, Sisaque (Sheshonq I) marchou contra Jerusalém no quinto ano de Roboão, por volta de 925 a.C., e Isaías clamou: “Ai dos que descem ao Egito em busca de ajuda”."
    - "O faraó Neco matou Josias em Megido em 609 a.C. e foi derrotado em Carquemis em 605. Depois da queda de Jerusalém, judeus que fugiam dos babilônios levaram Jeremias ao Egito, onde ele profetizou aos judeus de Migdol, Tafnes e Nofe. Papiros de Elefantina mostram uma guarnição judaica com templo próprio no Nilo sob domínio persa, que começou com Cambises em 525 a.C. Alexandre fundou Alexandria em 331 a.C.; os Ptolomeus governaram o Egito até 30 a.C., e sob eles a Lei foi traduzida para o grego para os judeus de Alexandria, o começo da Septuaginta."
    - "Mateus conta como José levou o menino e sua mãe, de noite, ao Egito até a morte de Herodes, “para que se cumprisse o que foi dito pelo Senhor por meio do profeta, que disse: ‘Do Egito chamei o meu filho’”, palavras de Oseias. Judeus do Egito ouviram os apóstolos em Pentecostes, e Apolo, “natural de Alexandria”, era “poderoso nas Escrituras”. O oráculo de Isaías sobre o Egito termina com uma bênção: “Bendito seja o Egito, meu povo”. Eusébio registra a tradição de que Marcos fundou a igreja de Alexandria; os coptas, cristãos do Egito, ainda contam seus anos a partir do reinado de Diocleciano. A República Árabe do Egito, com capital no Cairo, tem mais de cem milhões de habitantes, quase todos ao longo do Nilo."
  de:
    - "Ägypten ist das Land des unteren Nils: ein Streifen bewässerten Tals und das weite Delta, von Wüste umschlossen, vom Ersten Katarakt bei Syene (Assuan) bis zum Mittelmeer. Die Bibel nennt es Mizraim. Ober- und Unterägypten wurden um 3000 v. Chr. vereint, und die Pyramiden von Gizeh erhoben sich im Alten Reich, im 26. und 25. Jahrhundert v. Chr. Im Neuen Reich (ca. 1550–1069 v. Chr.) hielten die Pharaonen Kanaan als Provinz, und die Stele des Merenptah um 1208 v. Chr. trägt die älteste bekannte Erwähnung Israels außerhalb der Bibel."
    - "Abram zog in einer Hungersnot nach Ägypten hinab, Josef wurde dorthin verkauft und stieg auf, es zu regieren, und Jakobs Familie ließ sich im Land Goschen nieder. Das Buch Exodus erzählt, wie ein neuer König die Israeliten versklavte und wie Gott sie „aus Ägyptenland, aus dem Diensthause“ führte. Das Datum des Exodus ist umstritten: Die Zahlen des 1. Buchs der Könige weisen auf etwa 1446 v. Chr., viele Gelehrte bevorzugen das 13. Jahrhundert, die Zeit Ramses’ II., und andere meinen, die Geschichte lasse sich nicht datieren. Ägypten blieb die Großmacht im Süden: Salomo heiratete eine Tochter eines Pharao, Schischak (Schoschenq I.) zog im fünften Jahr Rehabeams, um 925 v. Chr., gegen Jerusalem, und Jesaja rief: „Weh denen, die hinabziehen nach Ägypten um Hilfe“."
    - "Pharao Necho tötete Josia 609 v. Chr. bei Megiddo und wurde 605 bei Karkemisch geschlagen. Nach dem Fall Jerusalems brachten vor den Babyloniern fliehende Judäer Jeremia nach Ägypten, wo er den Juden von Migdol, Tachpanhes und Noph weissagte. Papyri aus Elephantine zeigen eine jüdische Garnison mit eigenem Tempel am Nil unter persischer Herrschaft, die mit Kambyses 525 v. Chr. begann. Alexander gründete 331 v. Chr. Alexandria; die Ptolemäer herrschten bis 30 v. Chr. über Ägypten, und unter ihnen wurde das Gesetz für die Juden Alexandrias ins Griechische übersetzt, der Anfang der Septuaginta."
    - "Matthäus erzählt, wie Josef das Kind und seine Mutter bei Nacht nach Ägypten brachte, bis zum Tod des Herodes, „auf daß erfüllet würde, was der HERR durch den Propheten gesagt hat, der da spricht: ‚Aus Ägypten habe ich meinen Sohn gerufen‘“, die Worte Hoseas. Juden aus Ägypten hörten die Apostel an Pfingsten, und Apollos, „von Geburt aus Alexandrien“, war „mächtig in der Schrift“. Jesajas Orakel über Ägypten endet mit einem Segen: „Gesegnet bist du, Ägypten, mein Volk“. Eusebius überliefert die Tradition, Markus habe die Kirche von Alexandria gegründet; die Kopten, die Christen Ägyptens, zählen ihre Jahre noch immer von der Regierung Diokletians an. Die Arabische Republik Ägypten mit der Hauptstadt Kairo hat mehr als hundert Millionen Einwohner, fast alle entlang des Nils."
  fr:
    - "L’Égypte est le pays du bas Nil : une bande de vallée irriguée et le large Delta, enserrés par le désert, de la première cataracte à Syène (Assouan) jusqu’à la Méditerranée. La Bible l’appelle Mitsraïm. La Haute et la Basse-Égypte furent unies vers 3000 av. J.-C., et les pyramides de Gizeh s’élevèrent sous l’Ancien Empire, aux XXVIe et XXVe siècles av. J.-C. Sous le Nouvel Empire (vers 1550–1069 av. J.-C.), les pharaons tenaient Canaan comme province, et la stèle de Merenptah, vers 1208 av. J.-C., porte la plus ancienne mention connue d’Israël hors de la Bible."
    - "Abram descendit en Égypte lors d’une famine, Joseph y fut vendu et s’éleva jusqu’à la gouverner, et la famille de Jacob s’établit au pays de Gosen. L’Exode raconte comment un nouveau roi asservit les Israélites et comment Dieu les fit sortir « du pays d’Égypte, de la maison de servitude ». La date de l’exode est débattue : les chiffres de 1 Rois pointent vers 1446 av. J.-C. environ, beaucoup de spécialistes préfèrent le XIIIe siècle, l’époque de Ramsès II, et d’autres tiennent que le récit ne peut être daté. L’Égypte resta la grande puissance au sud : Salomon épousa une fille de pharaon, Schischak (Sheshonq Ier) marcha sur Jérusalem la cinquième année de Roboam, vers 925 av. J.-C., et Ésaïe s’écria : « Malheur à ceux qui descendent en Égypte pour avoir du secours »."
    - "Pharaon Néco tua Josias à Meguiddo en 609 av. J.-C. et fut battu à Carkemisch en 605. Après la chute de Jérusalem, des Judéens fuyant les Babyloniens emmenèrent Jérémie en Égypte, où il prophétisa aux Juifs de Migdol, de Tachpanès et de Noph. Les papyrus d’Éléphantine montrent une garnison juive dotée de son propre temple sur le Nil sous la domination perse, qui commença avec Cambyse en 525 av. J.-C. Alexandre fonda Alexandrie en 331 av. J.-C. ; les Ptolémées régnèrent sur l’Égypte jusqu’en 30 av. J.-C., et sous eux la Loi fut traduite en grec pour les Juifs d’Alexandrie, début de la Septante."
    - "Matthieu raconte que Joseph emmena de nuit l’enfant et sa mère en Égypte jusqu’à la mort d’Hérode, « afin que s’accomplît ce que le Seigneur avait annoncé par le prophète : J’ai appelé mon fils hors d’Égypte », paroles d’Osée. Des Juifs d’Égypte entendirent les apôtres à la Pentecôte, et Apollos, « originaire d’Alexandrie », était « versé dans les Écritures ». L’oracle d’Ésaïe sur l’Égypte s’achève par une bénédiction : « Bénis soient l’Égypte, mon peuple ». Eusèbe rapporte la tradition selon laquelle Marc fonda l’Église d’Alexandrie ; les coptes, chrétiens d’Égypte, comptent encore leurs années depuis le règne de Dioclétien. La République arabe d’Égypte, dont la capitale est Le Caire, compte plus de cent millions d’habitants, presque tous le long du Nil."
  it:
    - "L’Egitto è la terra del basso Nilo: una striscia di valle irrigata e l’ampio Delta, chiusi dal deserto, dalla Prima Cateratta a Siene (Assuan) fino al Mediterraneo. La Bibbia lo chiama Mizraim. L’Alto e il Basso Egitto furono uniti intorno al 3000 a.C., e le piramidi di Giza sorsero nell’Antico Regno, nel XXVI e XXV secolo a.C. Nel Nuovo Regno (1550–1069 a.C. circa) i faraoni tennero Canaan come provincia, e la stele di Merenptah, intorno al 1208 a.C., reca la più antica menzione nota di Israele fuori dalla Bibbia."
    - "Abramo scese in Egitto durante una carestia, Giuseppe vi fu venduto e salì a governarlo, e la famiglia di Giacobbe si stabilì nel paese di Gosen. L’Esodo racconta come un nuovo re rese schiavi gli Israeliti e come Dio li fece uscire «dal paese d’Egitto, dalla casa di servitù». La data dell’esodo è controversa: le cifre di 1 Re indicano il 1446 a.C. circa, molti studiosi preferiscono il XIII secolo, l’età di Ramses II, e altri ritengono che il racconto non sia databile. L’Egitto restò la grande potenza a sud: Salomone sposò una figlia del faraone, Sisak (Sheshonq I) marciò su Gerusalemme nel quinto anno di Roboamo, intorno al 925 a.C., e Isaia gridò: «Guai a quelli che scendono in Egitto in cerca di soccorso»."
    - "Il faraone Neco uccise Giosia a Meghiddo nel 609 a.C. e fu messo in rotta a Carchemis nel 605. Dopo la caduta di Gerusalemme i Giudei in fuga dai Babilonesi portarono Geremia in Egitto, dove profetizzò ai Giudei di Migdol, Tafni e Nof. I papiri di Elefantina mostrano una guarnigione ebraica con un tempio proprio sul Nilo sotto il dominio persiano, iniziato con Cambise nel 525 a.C. Alessandro fondò Alessandria nel 331 a.C.; i Tolomei governarono l’Egitto fino al 30 a.C., e sotto di loro la Legge fu tradotta in greco per gli Ebrei di Alessandria, l’inizio della Settanta."
    - "Matteo racconta come Giuseppe prese di notte il bambino e sua madre in Egitto fino alla morte di Erode, «affinché si adempiesse quello che fu detto dal Signore per mezzo del profeta: Fuor d’Egitto chiamai il mio figliuolo», parole di Osea. Ebrei d’Egitto udirono gli apostoli a Pentecoste, e Apollo, «oriundo d’Alessandria», era «potente nelle Scritture». L’oracolo di Isaia sull’Egitto termina con una benedizione: «Benedetti siano l’Egitto, mio popolo…» Eusebio registra la tradizione che Marco fondò la chiesa di Alessandria; i Copti, i cristiani d’Egitto, contano ancora gli anni dal regno di Diocleziano. La Repubblica Araba d’Egitto, con capitale al Cairo, ha più di cento milioni di abitanti, quasi tutti lungo il Nilo."
  pl:
    - "Egipt to kraj dolnego Nilu: pas nawodnionej doliny i szeroka Delta, zamknięte pustynią, od Pierwszej Katarakty w Syene (Asuan) po Morze Śródziemne. Biblia nazywa go Micraim. Górny i Dolny Egipt zjednoczono około 3000 r. p.n.e., a piramidy w Gizie wzniesiono w Starym Państwie, w XXVI i XXV w. p.n.e. W Nowym Państwie (ok. 1550–1069 p.n.e.) faraonowie trzymali Kanaan jako prowincję, a stela Merneptaha, około 1208 r. p.n.e., zawiera najstarszą znaną wzmiankę o Izraelu poza Biblią."
    - "Abram zstąpił do Egiptu podczas głodu, Józef został tam sprzedany i doszedł do rządów nad nim, a rodzina Jakuba osiedliła się w ziemi Goszen. Księga Wyjścia opowiada, jak nowy król zniewolił Izraelitów i jak Bóg wyprowadził ich „z ziemi Egipskiej, z domu niewoli”. Data wyjścia jest sporna: liczby z Księgi Królewskiej wskazują około 1446 r. p.n.e., wielu uczonych woli XIII w., wiek Ramsesa II, a inni sądzą, że opowieści nie da się datować. Egipt pozostał wielką potęgą na południu: Salomon ożenił się z córką faraona, Sziszak (Szeszonk I) wyruszył na Jerozolimę w piątym roku Roboama, około 925 r. p.n.e., a Izajasz wołał: „Biada tym, którzy zstępują do Egiptu o pomoc”."
    - "Faraon Necho zabił Jozjasza pod Megiddo w 609 r. p.n.e. i został rozgromiony pod Karkemisz w 605 r. Po upadku Jerozolimy Judejczycy uciekający przed Babilończykami zabrali Jeremiasza do Egiptu, gdzie prorokował Żydom z Migdol, Tachpanches i Nof. Papirusy z Elefantyny ukazują żydowski garnizon z własną świątynią nad Nilem pod rządami perskimi, które zaczęły się od Kambyzesa w 525 r. p.n.e. Aleksander założył Aleksandrię w 331 r. p.n.e.; Ptolemeusze rządzili Egiptem do 30 r. p.n.e., a za nich Prawo przełożono na grecki dla Żydów Aleksandrii, co stało się początkiem Septuaginty."
    - "Mateusz opowiada, jak Józef wziął w nocy dziecię i jego matkę do Egiptu aż do śmierci Heroda, „aby się wypełniło, co powiedziano od Pana przez proroka, mówiącego: Z Egiptum wezwał syna mego”, słowa Ozeasza. Żydzi z Egiptu słyszeli apostołów w Pięćdziesiątnicę, a Apollos, „rodem z Aleksandryi”, był „możnym w Pismach”. Wyrocznia Izajasza o Egipcie kończy się błogosławieństwem: „Błogosławiony lud mój Egipski”. Euzebiusz zapisuje tradycję, że Marek założył Kościół w Aleksandrii; Koptowie, chrześcijanie Egiptu, wciąż liczą swe lata od panowania Dioklecjana. Arabska Republika Egiptu, ze stolicą w Kairze, liczy ponad sto milionów ludzi, niemal wszystkich wzdłuż Nilu."
  nl:
    - "Egypte is het land van de benedenloop van de Nijl: een strook bevloeide vallei en de brede Delta, door woestijn ingesloten, van de Eerste Cataract bij Syene (Aswan) tot de Middellandse Zee. De Bijbel noemt het Misraïm. Boven- en Neder-Egypte werden omstreeks 3000 v.Chr. verenigd, en de piramiden van Gizeh verrezen in het Oude Rijk, in de 26e en 25e eeuw v.Chr. In het Nieuwe Rijk (ca. 1550–1069 v.Chr.) hielden de farao's Kanaän als provincie, en de stèle van Merneptah, omstreeks 1208 v.Chr., draagt de oudst bekende vermelding van Israël buiten de Bijbel."
    - "Abram trok bij hongersnood naar Egypte, Jozef werd er verkocht en ging het besturen, en Jakobs familie vestigde zich in het land Gosen. Exodus vertelt hoe een nieuwe koning de Israëlieten tot slaaf maakte en hoe God hen leidde “uit Egypteland, uit het diensthuis”. De datum van de uittocht is omstreden: de getallen van 1 Koningen wijzen op omstreeks 1446 v.Chr., velen geven de voorkeur aan de dertiende eeuw, de tijd van Ramses II, en anderen menen dat het verhaal niet te dateren is. Egypte bleef de grote macht in het zuiden: Salomo huwde een dochter van een farao, Sisak (Sjosjenq I) trok in het vijfde jaar van Rehabeam, omstreeks 925 v.Chr., op tegen Jeruzalem, en Jesaja riep: “Wee dengenen, die in Egypte om hulp aftrekken”."
    - "Farao Necho doodde Josia in 609 v.Chr. bij Megiddo en werd in 605 bij Karkemis verslagen. Na de val van Jeruzalem voerden Judeeërs die voor de Babyloniërs vluchtten Jeremia naar Egypte, waar hij profeteerde tot de Joden van Migdol, Tachpanhes en Nof. Papyri uit Elephantine tonen een Joods garnizoen met een eigen tempel aan de Nijl onder Perzisch bewind, dat met Cambyses in 525 v.Chr. begon. Alexander stichtte Alexandrië in 331 v.Chr.; de Ptolemaeën regeerden Egypte tot 30 v.Chr., en onder hen werd de Wet in het Grieks vertaald voor de Joden van Alexandrië, het begin van de Septuaginta."
    - "Mattheüs vertelt hoe Jozef het kind en zijn moeder bij nacht naar Egypte bracht tot de dood van Herodes, “opdat vervuld zou worden hetgeen van den Heere gesproken is door den profeet, zeggende: Uit Egypte heb Ik Mijn Zoon geroepen”, de woorden van Hosea. Joden uit Egypte hoorden de apostelen met Pinksteren, en Apollos, “van geboorte een Alexandrier”, was “machtig zijnde in de Schriften”. Jesaja's orakel over Egypte eindigt met een zegen: “Gezegend zij Mijn volk, de Egyptenaars”. Eusebius vermeldt de overlevering dat Marcus de kerk van Alexandrië stichtte; de Kopten, Egypte's christenen, tellen hun jaren nog vanaf de regering van Diocletianus. De Arabische Republiek Egypte, met Caïro als hoofdstad, telt meer dan honderd miljoen mensen, bijna allemaal langs de Nijl."
  cs:
    - "Egypt je země dolního Nilu: pás zavlažovaného údolí a široká Delta, sevřené pouští, od prvního kataraktu u Asuánu po Středozemní moře. Bible jej nazývá Micrajim. Horní a Dolní Egypt byly sjednoceny kolem roku 3000 př. n. l. a pyramidy v Gíze vyrostly ve Staré říši, v 26. a 25. století př. n. l. V Nové říši (asi 1550–1069 př. n. l.) drželi faraóni Kanaán jako provincii a Merneptahova stéla, kolem roku 1208 př. n. l., nese nejstarší známou zmínku o Izraeli mimo Bibli."
    - "Abram sestoupil do Egypta za hladu, Josef tam byl prodán a vystoupil, aby jej spravoval, a rodina Jákobova se usadila v zemi Gošen. Exodus vypráví, jak nový král zotročil Izraelce a jak je Bůh vyvedl „z země Egyptské, z domu služby“. Datum exodu je sporné: údaje První knihy Královské ukazují na asi 1446 př. n. l., mnozí badatelé dávají přednost 13. století, době Ramesse II., a jiní tvrdí, že příběh nelze datovat. Egypt zůstal velmocí na jihu: Šalomoun se oženil s faraonovou dcerou, Šíšak (Šošenk I.) táhl na Jeruzalém v pátém roce Rechabeámově, asi 925 př. n. l., a Izajáš volal: „Běda těm, kteříž se utíkají do Egypta o pomoc“."
    - "Faraon Nekó zabil Jošijáše u Megida roku 609 př. n. l. a byl poražen u Karkemíše roku 605. Po pádu Jeruzaléma odvedli Judejci prchající před Babylóňany Jeremjáše do Egypta, kde prorokoval Židům v Migdolu, Tachpanchés a Nofu. Papyry z Elefantiny ukazují židovskou posádku s vlastním chrámem na Nilu za perské vlády, která začala Kambýsem roku 525 př. n. l. Alexandr založil Alexandrii roku 331 př. n. l.; Ptolemaiovci vládli Egyptu do roku 30 př. n. l. a za nich byl Zákon přeložen do řečtiny pro Židy v Alexandrii, počátek Septuaginty."
    - "Matouš vypráví, jak Josef vzal dítě a jeho matku v noci do Egypta až do smrti Herodovy, „aby se naplnilo povědění Páně skrze proroka, řkoucího: Z Egypta povolal jsem Syna svého“, slova Ozeášova. Židé z Egypta slyšeli apoštoly o Letnicích a Apollos, „rodem z Alexandrie“, byl „učený v Písmě“. Izajášova věštba o Egyptě končí požehnáním: „Požehnaný lid můj Egyptský“. Eusebios zaznamenává tradici, že Marek založil církev v Alexandrii; Koptové, křesťané Egypta, dosud počítají své roky od vlády Diocletiana. Egyptská arabská republika s hlavním městem Káhirou má více než sto milionů lidí, téměř všechny podél Nilu."
  sv:
    - "Egypten är landet vid nedre Nilen: en remsa bevattnad dal och det vida deltat, instängt av öken, från första katarakten vid Syene (Aswan) till Medelhavet. Bibeln kallar det Misraim. Övre och Nedre Egypten förenades omkring 3000 f.Kr., och pyramiderna i Giza restes under Gamla riket, på 2500- och 2400-talen f.Kr. Under Nya riket (ca 1550–1069 f.Kr.) höll faraonerna Kanaan som provins, och Merneptahs stele, omkring 1208 f.Kr., bär det äldsta kända omnämnandet av Israel utanför Bibeln."
    - "Abram drog ner till Egypten under en hungersnöd, Josef såldes dit och steg till att styra det, och Jakobs familj bosatte sig i landet Goshen. Andra Mosebok berättar hur en ny kung förslavade israeliterna och hur Gud förde dem ”ur Egyptens land, ur träldomshuset”. Tiden för uttåget är omtvistad: siffrorna i Första Konungaboken pekar mot omkring 1446 f.Kr., många forskare föredrar 1200-talet, Ramses II:s tid, och andra anser att berättelsen inte kan dateras. Egypten förblev stormakten i söder: Salomo gifte sig med en faraos dotter, Shishak (Shoshenq I) tågade mot Jerusalem i Rehabeams femte år, omkring 925 f.Kr., och Jesaja ropade: ”Ve dem som draga åstad ned till Egypten för att få hjälp”."
    - "Farao Necho dödade Josia vid Megiddo 609 f.Kr. och slogs på flykten vid Karkemish 605. Efter Jerusalems fall förde judar som flydde babylonierna Jeremia till Egypten, där han profeterade för judarna i Migdol, Tachpanches och Nof. Papyrer från Elefantine visar en judisk garnison med ett eget tempel vid Nilen under persiskt välde, som inleddes med Kambyses 525 f.Kr. Alexander grundade Alexandria 331 f.Kr.; ptolemaierna härskade över Egypten till 30 f.Kr., och under dem översattes Lagen till grekiska för Alexandrias judar, början på Septuaginta."
    - "Matteus berättar hur Josef tog barnet och dess moder med sig om natten till Egypten, till Herodes död, ”för att det skulle fullbordas, som var sagt av Herren genom profeten som sade: Ut ur Egypten kallade jag min son”, Hoseas ord. Judar från Egypten hörde apostlarna vid pingsten, och Apollos, ”bördig från Alexandria”, var ”mycket förfaren i skrifterna”. Jesajas utsaga om Egypten slutar med en välsignelse: ”Välsignad vare du Egypten, mitt folk”. Eusebios återger traditionen att Markus grundade kyrkan i Alexandria; kopterna, Egyptens kristna, räknar fortfarande sina år från Diocletianus regeringstid. Arabrepubliken Egypten, med huvudstad i Kairo, har mer än hundra miljoner invånare, nästan alla längs Nilen."
  nb:
    - "Egypt er landet ved nedre Nil: en stripe av vannet dal og det brede Deltaet, lukket inne av ørken, fra første katarakt ved Syene (Aswan) til Middelhavet. Bibelen kaller det Misrajim. Øvre og Nedre Egypt ble forent omkring 3000 f.Kr., og pyramidene i Giza reiste seg i Det gamle rike, på 2500- og 2400-tallet f.Kr. I Det nye rike (ca. 1550–1069 f.Kr.) holdt faraoene Kanaan som en provins, og Merneptahs stele, omkring 1208 f.Kr., bærer den eldste kjente omtalen av Israel utenfor Bibelen."
    - "Abram drog ned til Egypt i en hungersnød, Josef ble solgt dit og steg til å styre det, og Jakobs familie slo seg ned i landet Gosen. 2. Mosebok forteller hvordan en ny konge gjorde israelittene til slaver og hvordan Gud førte dem «ut av Egyptens land, av trælehuset». Tidspunktet for utferden er omdiskutert: tallene i 1. Kongebok peker mot omkring 1446 f.Kr., mange forskere foretrekker 1200-tallet, Ramses IIs tid, og andre mener at fortellingen ikke kan dateres. Egypt forble stormakten i sør: Salomo giftet seg med en farao-datter, Sjisjak (Sjosjenk I) rykket mot Jerusalem i Rehabeams femte år, omkring 925 f.Kr., og Jesaja ropte: «Ve dem som farer ned til Egypten efter hjelp»."
    - "Farao Neko drepte Josjia ved Megiddo i 609 f.Kr. og ble slått ved Karkemisj i 605. Etter Jerusalems fall førte judeere som flyktet fra babylonerne, Jeremia til Egypt, der han profeterte for jødene i Migdol, Tahpanhes og Nof. Papyrusene fra Elephantine viser en jødisk garnison med eget tempel ved Nilen under persisk herredømme, som begynte med Kambyses i 525 f.Kr. Aleksander grunnla Aleksandria i 331 f.Kr.; ptolemeerne styrte Egypt til 30 f.Kr., og under dem ble Loven oversatt til gresk for jødene i Aleksandria, begynnelsen på Septuaginta."
    - "Matteus forteller hvordan Josef tok barnet og dets mor om natten til Egypt til Herodes' død, «forat det skulde opfylles som er talt av Herren ved profeten, som sier: Fra Egypten kalte jeg min sønn», ord av Hosea. Jøder fra Egypt hørte apostlene ved pinse, og Apollos, «født i Aleksandria», var «sterk i skriftene». Jesajas orakel om Egypt ender med en velsignelse: «Velsignet være mitt folk Egypten». Eusebius gjengir tradisjonen om at Markus grunnla menigheten i Aleksandria; koptene, Egypts kristne, regner fremdeles årene fra Diokletians regjeringstid. Den arabiske republikken Egypt, med hovedstad i Kairo, har mer enn hundre millioner innbyggere, nesten alle langs Nilen."
  tl:
    - "Ang Egipto ay ang lupain ng ibabang Nilo: isang guhit ng libis na may tubig at ang malawak na Delta, na nakukulong ng disyerto, mula sa Unang Talon sa Seveneh (Aswan) hanggang sa Mediteraneo. Tinatawag ito ng Bibliya na Mizraim. Nagkaisa ang Itaas at Mababang Egipto noong mga 3000 BK, at tumaas ang mga piramide ng Giza sa Matandang Kaharian, noong ika-26 at ika-25 siglo BK. Sa Bagong Kaharian (c. 1550–1069 BK), hawak ng mga faraon ang Canaan bilang lalawigan, at dala ng estela ni Merneptah, mga 1208 BK, ang pinakamatandang kilalang banggit ng Israel sa labas ng Bibliya."
    - "Bumaba si Abram sa Egipto noong taggutom, ipinagbili roon si Jose at umangat upang pamahalaan ito, at nanirahan ang pamilya ni Jacob sa lupain ng Gosen. Isinasalaysay ng Exodo kung paanong inalipin ng bagong hari ang mga Israelita at kung paanong inilabas sila ng Dios sa “lupain ng Egipto, sa bahay ng pagkaalipin”. Pinagtatalunan ang petsa ng exodo: tumuturo ang mga bilang ng 1 Mga Hari sa mga 1446 BK, mas pinipili ng maraming iskolar ang ika-13 siglo, ang panahon ni Rameses II, at ang iba ay naniniwalang hindi maipepetsa ang kuwento. Nanatiling dakilang kapangyarihan sa timog ang Egipto: nagasawa si Salomon ng anak ng isang faraon, nagmartsa si Sisac (Shoshenq I) laban sa Jerusalem sa ikalimang taon ni Roboam, mga 925 BK, at sumigaw si Isaias, “Sa aba nila na nagsisilusong sa Egipto na humihinging tulong”."
    - "Pinatay ni Faraon Nechao si Josias sa Megiddo noong 609 BK at tinalo sa Carchemis noong 605. Pagkatapos ng pagbagsak ng Jerusalem, dinala ng mga taga-Juda na tumatakas sa mga Babilonio si Jeremias sa Egipto, kung saan nagpropesiya siya sa mga Judio ng Migdol, Taphnes at Nof. Ipinakikita ng mga papiro mula sa Elephantine ang isang kampamentong Judio na may sariling templo sa Nilo sa ilalim ng pamamahalang Persiano, na nagsimula kay Cambises noong 525 BK. Itinatag ni Alejandro ang Alejandria noong 331 BK; namuno ang mga Ptolemeo sa Egipto hanggang 30 BK, at sa ilalim nila ay isinalin sa Griyego ang Kautusan para sa mga Judio ng Alejandria, ang simula ng Septuaginta."
    - "Isinasalaysay ni Mateo kung paanong dinala ni Jose ang bata at ang kaniyang ina nang gabi sa Egipto hanggang sa pagkamatay ni Herodes, “upang maganap ang sinabi ng Panginoon sa pamamagitan ng propeta, na nagsasabi, Mula sa Egipto ay tinawag ko ang aking anak”, ang mga salita ni Oseas. Nakarinig ang mga Judio mula sa Egipto sa mga apostol sa Pentecostes, at si Apolos, “isang Alejandrino sa lahi”, ay “makapangyarihan ukol sa mga kasulatan”. Nagtatapos sa basbas ang orakulo ni Isaias tungkol sa Egipto: “Pagpalain ang bayan kong Egipto”. Itinatala ni Eusebio ang tradisyon na itinatag ni Marcos ang iglesia ng Alejandria; ang mga Copto, ang mga Kristiyano ng Egipto, ay binibilang pa rin ang kanilang mga taon mula sa paghahari ni Diocleciano. Ang Republikang Arabe ng Egipto, na ang kabisera ay Cairo, ay may mahigit sandaang milyong tao, halos lahat ay nasa tabi ng Nilo."
  da:
    - "Egypten er landet ved den nedre Nil: en strimmel af vandet dal og det brede Delta, lukket inde af ørken, fra Første Katarakt ved Syene (Aswan) til Middelhavet. Bibelen kalder det Mizrajim. Øvre og Nedre Egypten blev forenet omkring 3000 f.Kr., og Gizas pyramider rejste sig i Det Gamle Rige, i 2500- og 2400-tallet f.Kr. I Det Nye Rige (ca. 1550–1069 f.Kr.) holdt faraoerne Kana'an som provins, og Merneptahs stele, omkring 1208 f.Kr., bærer den ældste kendte omtale af Israel uden for Bibelen."
    - "Abram drog ned til Egypten under en hungersnød, Josef blev solgt dér og steg til at styre det, og Jakobs familie bosatte sig i Gosjen. 2 Mosebog fortæller, hvordan en ny konge gjorde israelitterne til slaver, og hvordan Gud førte dem »af Ægyptens Land, af Trælles Hus«. Datoen for udtoget er omstridt: Tallene i Kongebøgerne peger på omkring 1446 f.Kr., mange forskere foretrækker 1200-tallet, Ramses 2.s tid, og andre mener, at fortællingen ikke kan dateres. Egypten forblev den store magt mod syd: Salomo giftede sig med en faraos datter, Sjisjak (Sjosjenq 1.) drog mod Jerusalem i Rehabeams femte år, omkring 925 f.Kr., og Esajas råbte: »Ve dem, som fare ned til Ægypten om Hjælp«."
    - "Farao Neko dræbte Josias ved Megiddo i 609 f.Kr. og blev slået ved Karkemisj i 605. Efter Jerusalems fald førte judæere, der flygtede fra babylonierne, Jeremias til Egypten, hvor han profeterede for jøderne i Migdol, Takpanes og Nof. Papyri fra Elefantine viser en jødisk garnison med et eget tempel ved Nilen under persisk herredømme, der begyndte med Kambyses i 525 f.Kr. Alexander grundlagde Alexandria i 331 f.Kr.; ptolemæerne herskede over Egypten indtil 30 f.Kr., og under dem blev loven oversat til græsk for Alexandrias jøder, begyndelsen til Septuaginta."
    - "Mattæus fortæller, hvordan Josef tog barnet og dets mor med om natten til Egypten indtil Herodes' død, »for at det skulde opfyldes, som er talt af Herren ved Profeten, der siger: Fra Ægypten kaldte jeg min Søn«, Hoseas' ord. Jøder fra Egypten hørte apostlene til pinse, og Apollos, »født i Aleksandria«, var »stærk i Skrifterne«. Esajas' orakel over Egypten ender med en velsignelse: »Velsignet være mit Folk, Ægypterne«. Eusebios optegner traditionen om, at Markus grundlagde kirken i Alexandria; kopterne, Egyptens kristne, regner stadig deres år fra Diokletians regeringstid. Den Arabiske Republik Egypten, med hovedstad i Kairo, har mere end hundrede millioner indbyggere, næsten alle langs Nilen."
  sr:
    - "Египат је земља доњег Нила: појас натопљене долине и широка Делта, затворени пустињом, од Првог катаракта у Сиени (Асуан) до Средоземног мора. Библија га зове Мисраим. Горњи и Доњи Египат уједињени су око 3000. п. н. е., а пирамиде у Гизи подигнуте су у Старом царству, у 26. и 25. веку п. н. е. У Новом царству (око 1550–1069. п. н. е.) фараони су држали Ханан као провинцију, а Мернептахова стела, око 1208. п. н. е., носи најстарији познати помен Израиља изван Библије."
    - "Аврам је сишао у Египат у глади, Јосиф је тамо продат и успео да њиме управља, а Јаковљева породица настанила се у земљи Гесем. Књига Изласка приповеда како је нови цар поробио Израиљце и како их је Бог извео „из земље мисирске, из дома ропског“. Датум изласка је спорен: бројке из 1. Књиге о царевима упућују на око 1446. п. н. е., многи научници радије узимају 13. век, доба Рамзеса II, а други држе да се прича не може датирати. Египат је остао велика сила на југу: Соломун се оженио фараоновом кћерком, Сисак (Шошенк I) је кренуо на Јерусалим у петој години Ровоамовој, око 925. п. н. е., а Исаија је узвикнуо: „Тешко онима који иду у Мисир за помоћ“."
    - "Фараон Нехаон убио је Јосију у Мегиду 609. п. н. е. и био је разбијен код Хархемиса 605. После пада Јерусалима, Јудејци који су бежали од Вавилонаца одвели су Јеремију у Египат, где је пророковао Јеврејима у Мигдолу, Тафнесу и Нофу. Папируси из Елефантине показују јеврејску посаду са сопственим храмом на Нилу под персијском влашћу, која је почела с Камбизом 525. п. н. е. Александар је основао Александрију 331. п. н. е.; Птолемејевићи су владали Египтом до 30. п. н. е., и под њима је Закон преведен на грчки за александријске Јевреје, почетак Септуагинте."
    - "Матеј приповеда како је Јосиф узео дете и његову мајку ноћу у Египат до Иродове смрти, „да се изврши шта је Господ рекао преко пророка који говори: Из Мисира дозвах Сина свог“, речи Осијине. Јевреји из Египта чули су апостоле на Педесетници, а Аполо, „родом из Александрије“, био је „силан у књигама“. Исаијино пророчанство о Египту завршава се благословом: „Да је благословен мој народ мисирски и асирски“. Јевсевије бележи предање да је Марко основао цркву Александрије; Копти, египатски хришћани, и даље броје своје године од владавине Диоклецијана. Арапска Република Египат, с престоницом у Каиру, има више од сто милиона становника, готово сви дуж Нила."
  hu:
    - "Egyiptom az alsó Nílus földje: öntözött völgy és széles Delta sávja, sivatag által körülzárva, az első kataraktától Szevénénél (Asszuánnál) a Földközi-tengerig. A Biblia Micráimnak nevezi. Alsó- és Felső-Egyiptom Kr. e. 3000 körül egyesült, a gizai piramisok az Ó-Birodalomban emelkedtek, a Kr. e. 26. és 25. században. Az Újbirodalomban (Kr. e. 1550–1069 körül) a fáraók Kánaánt tartományként birtokolták, és Merneptah Kr. e. 1208 körüli sztéléje viseli Izráel legrégebbi, Biblián kívüli ismert említését."
    - "Ábrám éhínség idején ment le Egyiptomba, Józsefet ott adták el és ott emelkedett a kormányzására, Jákób családja pedig Gósen földjén telepedett le. A Kivonulás könyve elmondja, hogyan tette rabszolgává az izraelitákat egy új király, és hogyan hozta ki őket Isten „Égyiptomnak földéről, a szolgálat házából”. A kivonulás időpontja vitatott: az 1Királyok számadatai Kr. e. 1446 körülre mutatnak, sok tudós a 13. századot, II. Ramszesz korát részesíti előnyben, mások szerint a történet nem keltezhető. Egyiptom a déli nagyhatalom maradt: Salamon feleségül vette egy fáraó leányát, Sisak (I. Sosenk) Roboám ötödik évében, Kr. e. 925 körül Jeruzsálem ellen vonult, Ézsaiás pedig felkiáltott: „Jaj nékik, a kik Égyiptomba mennek segítségért”."
    - "Nékó fáraó Kr. e. 609-ben Megiddónál megölte Jósiást, Kr. e. 605-ben pedig Karkemisnél megfutamodott. Jeruzsálem eleste után a babiloniak elől menekülő júdeaiak Jeremiást Egyiptomba vitték, ahol a migdoli, tahpanhészi és nofi zsidóknak prófétált. Az elephantinéi papiruszok zsidó helyőrséget mutatnak saját templommal a Níluson a perzsa uralom alatt, amely Kr. e. 525-ben Kambüszésszel kezdődött. Nagy Alexandrosz Kr. e. 331-ben megalapította Alexandriát; a Ptolemaiosziak Kr. e. 30-ig uralták Egyiptomot, és alattuk fordították le a Törvényt görögre az alexandriai zsidóknak, ami a Septuaginta kezdete."
    - "Máté elmondja, hogyan vitte József a gyermeket és anyját éjjel Egyiptomba Heródes haláláig, „hogy beteljesedjék, a mit az Úr mondott a próféta által, a ki így szólt: Égyiptomból hívtam ki az én fiamat”, Hóseás szavait. Egyiptomi zsidók hallották az apostolokat pünkösdkor, és Apollós, „alekszandriai származású”, „az írásokban tudós” volt. Ézsaiás Egyiptomról szóló jövendölése áldással végződik: „Áldott népem, Égyiptom!” Eusebius feljegyzi a hagyományt, hogy Márk alapította az alexandriai egyházat; a koptok, Egyiptom keresztényei ma is Diocletianus uralkodásától számítják éveiket. Az Egyiptomi Arab Köztársaságnak, fővárosa Kairó, több mint százmillió lakosa van, szinte mind a Nílus mentén."
  fi:
    - "Egypti on Niilin alajuoksun maa: kastellun laakson kaistale ja laaja Delta, aavikon ympäröimä, Syenen (Assuan) ensimmäisestä koskesta Välimerelle. Raamattu kutsuu sitä Misraimiksi. Ylä- ja Ala-Egypti yhdistettiin noin 3000 eaa., ja Gizan pyramidit nousivat Vanhassa valtakunnassa, 2500- ja 2400-luvuilla eaa. Uudessa valtakunnassa (n. 1550–1069 eaa.) faraot hallitsivat Kanaania provinssina, ja Merneptahin steela noin vuodelta 1208 eaa. sisältää vanhimman tunnetun maininnan Israelista Raamatun ulkopuolella."
    - "Abram meni alas Egyptiin nälänhädän aikana, Joosef myytiin sinne ja nousi hallitsemaan sitä, ja Jaakobin perhe asettui Gosenin maahan. 2. Mooseksen kirja kertoo, kuinka uusi kuningas orjuutti israelilaiset ja kuinka Jumala vei heidät ”pois Egyptin maasta, orjuuden pesästä”. Exoduksen ajoitus on kiistanalainen: 1. Kuninkaiden kirjan luvut viittaavat noin vuoteen 1446 eaa., monet tutkijat pitävät parempana 1200-lukua, Ramses II:n aikaa, ja toiset katsovat, ettei kertomusta voi ajoittaa. Egypti pysyi suurvaltana etelässä: Salomo meni naimisiin faraon tyttären kanssa, Sisak (Shoshenq I) hyökkäsi Jerusalemiin Rehabeamin viidentenä vuonna, noin 925 eaa., ja Jesaja huudahti: ”Voi niitä, jotka menevät alas Egyptiin apua etsimään”."
    - "Farao Neko surmasi Josian Megiddossa vuonna 609 eaa. ja kärsi tappion Karkemisissa vuonna 605. Jerusalemin kukistumisen jälkeen babylonialaisia pakenevat juutalaiset veivät Jeremian Egyptiin, missä hän ennusti Migdolin, Tahpanhesin ja Nofin juutalaisille. Elefantinen saaren papyrukset osoittavat juutalaisen varuskunnan, jolla oli oma temppeli Niilillä persialaisten vallan aikana, joka alkoi Kambysesta vuonna 525 eaa. Aleksandros perusti Aleksandrian vuonna 331 eaa.; ptolemaiokset hallitsivat Egyptiä vuoteen 30 eaa. asti, ja heidän aikanaan laki käännettiin kreikaksi Aleksandrian juutalaisille, Septuagintan alku."
    - "Matteus kertoo, kuinka Joosef vei lapsen ja hänen äitinsä yöllä Egyptiin Herodeksen kuolemaan asti, ”että kävisi toteen, minkä Herra on puhunut profeetan kautta, joka sanoo: ’Egyptistä minä kutsuin poikani’”, Hoosean sanat. Egyptistä tulleet juutalaiset kuulivat apostolit helluntaina, ja Apollos, ”syntyisin Aleksandriasta”, oli ”väkevä raamatuissa”. Jesajan Egyptiä koskeva ennustus päättyy siunaukseen: ”Siunattu olkoon Egypti, minun kansani”. Eusebios kertoo perinteen, että Markus perusti Aleksandrian seurakunnan; koptit, Egyptin kristityt, laskevat yhä vuosiaan Diocletianuksen hallituskaudesta. Egyptin arabitasavallassa, pääkaupunkinaan Kairo, on yli sata miljoonaa asukasta, lähes kaikki Niilin varrella."
  vi:
    - "Ê-díp-tô là xứ của hạ lưu Sông Ni-lơ: một dải thung lũng được tưới nước và châu thổ rộng, bị sa mạc bao quanh, từ Thác thứ nhất tại Sy-e-nê (Aswan) đến Địa Trung Hải. Kinh Thánh gọi nó là Mích-ra-im. Thượng và Hạ Ai Cập được thống nhất khoảng năm 3000 TCN, và các kim tự tháp Giza mọc lên vào thời Cổ Vương quốc, vào các thế kỷ 26 và 25 TCN. Vào thời Tân Vương quốc (khoảng 1550–1069 TCN), các pharaoh nắm Ca-na-an như một tỉnh, và bia của Merneptah, khoảng năm 1208 TCN, mang lời nhắc đến Y-sơ-ra-ên cổ nhất được biết ngoài Kinh Thánh."
    - "Áp-ram xuống Ê-díp-tô trong nạn đói, Giô-sép bị bán ở đó và lên cai trị nó, và gia đình Gia-cốp định cư trong xứ Gô-sen. Sách Xuất Ê-díp-tô Ký kể một vua mới bắt dân Y-sơ-ra-ên làm nô lệ và Đức Chúa Trời đem họ “ra khỏi xứ Ê-díp-tô, là nhà nô lệ”. Niên đại của cuộc xuất hành còn tranh cãi: các con số của 1 Các Vua chỉ về khoảng năm 1446 TCN, nhiều học giả ưa thế kỷ 13, thời Ramesses II, và những người khác cho rằng câu chuyện không thể định niên đại. Ê-díp-tô vẫn là cường quốc lớn ở phía nam: Sa-lô-môn cưới con gái một pharaoh, Si-sắc (Shoshenq I) tiến đánh Giê-ru-sa-lem vào năm thứ năm của Rô-bô-am, khoảng năm 925 TCN, và Ê-sai kêu lên: “Khốn thay cho những kẻ xuống Ê-díp-tô đặng cầu cứu”."
    - "Pha-ra-ôn Nê-cô giết Giô-si-a tại Mê-ghi-đô năm 609 TCN và bị đánh tan tại Cạt-kê-mít năm 605. Sau khi Giê-ru-sa-lem thất thủ, những người Giu-đa chạy trốn người Ba-by-lôn đem Giê-rê-mi sang Ê-díp-tô, nơi ông nói tiên tri cho người Do Thái ở Mít-đôn, Tác-pha-nết và Nốp. Các papyrus từ Elephantine cho thấy một đồn binh Do Thái có đền thờ riêng bên Sông Ni-lơ dưới thời Ba Tư, vốn bắt đầu với Cambyses năm 525 TCN. A-léc-xan-đơ lập A-léc-xan-tri năm 331 TCN; nhà Ptolemy cai trị Ê-díp-tô đến năm 30 TCN, và dưới họ Luật pháp được dịch sang tiếng Hy Lạp cho người Do Thái ở A-léc-xan-tri, khởi đầu của bản Septuagint."
    - "Ma-thi-ơ kể Giô-sép đem con trẻ và mẹ trong đêm sang Ê-díp-tô cho đến khi Hê-rốt chết, “hầu cho ứng nghiệm lời Chúa đã dùng đấng tiên tri mà phán rằng: Ta đã gọi Con ta ra khỏi nước Ê-díp-tô”, lời của Ô-sê. Người Do Thái từ Ê-díp-tô nghe các sứ đồ ngày Lễ Ngũ Tuần, và A-bô-lô, “quê tại thành A-léc-xan-tri”, “hiểu Kinh Thánh”. Lời sấm của Ê-sai về Ê-díp-tô kết thúc bằng một phước lành: “Ê-díp-tô dân ta … đều hãy được phước”. Eusebius ghi truyền thống rằng Mác lập hội thánh A-léc-xan-tri; người Copt, các Cơ Đốc nhân của Ai Cập, vẫn tính năm từ thời Diocletianus. Cộng hòa Ả Rập Ai Cập, thủ đô Cairo, có hơn một trăm triệu dân, gần như toàn bộ dọc Sông Ni-lơ."
  ro:
    - "Egiptul este țara Nilului de jos: o fâșie de vale udată și larga Deltă, închisă de deșert, de la prima cataractă de la Siene (Assuan) până la Mediterana. Biblia îl numește Mițraim. Egiptul de Sus și cel de Jos au fost unite pe la 3000 î.Hr., iar piramidele de la Giza s-au ridicat în Regatul Vechi, în secolele al XXVI-lea și al XXV-lea î.Hr. În Regatul Nou (cca 1550–1069 î.Hr.), faraonii au ținut Canaanul ca provincie, iar stela lui Merneptah, pe la 1208 î.Hr., poartă cea mai veche pomenire cunoscută a lui Israel în afara Bibliei."
    - "Avram a coborât în Egipt în timpul unei foamete, Iosif a fost vândut acolo și s-a ridicat să-l cârmuiască, iar familia lui Iacov s-a așezat în ținutul Gosen. Exodul povestește cum un rege nou i-a robit pe israeliți și cum Dumnezeu i-a scos „din pământul Eghipetului, din casa robiei”. Data exodului este disputată: cifrele din 1 Regi arată spre 1446 î.Hr., mulți cercetători preferă secolul al XIII-lea, vremea lui Ramses al II-lea, iar alții susțin că istorisirea nu poate fi datată. Egiptul a rămas marea putere din sud: Solomon s-a însurat cu fiica unui faraon, Șișac (Șoșenq I) a mărșăluit asupra Ierusalimului în al cincilea an al lui Roboam, pe la 925 î.Hr., iar Isaia a strigat: „Vai celor ce se pogoară în Eghipet pentru ajutor”."
    - "Faraonul Necho l-a ucis pe Iosia la Meghido în 609 î.Hr. și a fost zdrobit la Carchemiș în 605. După căderea Ierusalimului, iudei care fugeau de babilonieni l-au dus pe Ieremia în Egipt, unde a profețit iudeilor din Migdol, Tahpanes și Nof. Papirusurile de la Elefantina arată o garnizoană iudaică cu un templu propriu pe Nil sub stăpânirea persană, care a început cu Cambise în 525 î.Hr. Alexandru a întemeiat Alexandria în 331 î.Hr.; Ptolemeii au stăpânit Egiptul până în 30 î.Hr., iar sub ei Legea a fost tradusă în greacă pentru iudeii din Alexandria, începutul Septuagintei."
    - "Matei povestește cum Iosif a luat pruncul și pe mama lui noaptea în Egipt până la moartea lui Irod, „ca să se plinească ceea ce s’au zis de Domnul, prin prorocul, ce zice: din Eghipet am chemat pre fiul meu”, cuvintele lui Osea. Iudei din Egipt i-au auzit pe apostoli la Cincizecime, iar Apolo, „Alexandrean de neam”, era „puternic fiind întru scripturi”. Oracolul lui Isaia despre Egipt se încheie cu o binecuvântare: „Bine este cuvântat poporul meu cel din Eghipet”. Eusebiu consemnează tradiția că Marcu a întemeiat biserica din Alexandria; copții, creștinii Egiptului, își numără încă anii de la domnia lui Dioclețian. Republica Arabă Egipt, cu capitala la Cairo, are peste o sută de milioane de locuitori, aproape toți de-a lungul Nilului."
  bg:
    - "Египет е земята на долния Нил: ивица напоявана долина и широката Делта, затворени от пустинята, от Първия праг при Сиена (Асуан) до Средиземно море. Библията го нарича Мицраим. Горен и Долен Египет се обединили около 3000 г. пр.н.е., а пирамидите в Гиза се издигнали в Старото царство, през XXVI и XXV в. пр.н.е. В Новото царство (ок. 1550–1069 г. пр.н.е.) фараоните държали Ханаан като провинция, а стелата на Мернептах, около 1208 г. пр.н.е., носи най-старото известно споменаване на Израил извън Библията."
    - "Аврам слязъл в Египет при глад, Йосиф бил продаден там и се издигнал да го управлява, а семейството на Яков се заселило в земята Гесем. Изход разказва как нов цар поробил израилтяните и как Бог ги извел „из Египетската земя, из дома на рабството“. Датата на изхода е спорна: числата в 3 Царе сочат около 1446 г. пр.н.е., много учени предпочитат XIII в., епохата на Рамзес II, а други смятат, че разказът не може да бъде датиран. Египет останал великата сила на юг: Соломон се оженил за дъщеря на фараон, Сусаким (Шешонк I) тръгнал срещу Йерусалим в петата година на Ровоам, около 925 г. пр.н.е., а Исаия викал: „Горко на онези които слазят в Египет за помощ“."
    - "Фараон Нехао убил Йосия при Мегидо през 609 г. пр.н.е. и бил разбит при Кархемис през 605 г. След падането на Йерусалим юдеи, бягащи от вавилонците, отвели Йеремия в Египет, където той пророкувал на юдеите в Мигдол, Тафнис и Ноф. Папирусите от Елефантина показват юдейски гарнизон със собствен храм на Нил под персийската власт, която започнала с Камбиз през 525 г. пр.н.е. Александър основал Александрия през 331 г. пр.н.е.; Птолемеите управлявали Египет до 30 г. пр.н.е. и при тях Законът бил преведен на гръцки за юдеите от Александрия — началото на Септуагинта."
    - "Матей разказва как Йосиф отвел нощем детето и майка Му в Египет до смъртта на Ирод, „да се сбъде казаното от Господа чрез пророка, който казва: Из Египет извиках сина си“, думите на Осия. Юдеи от Египет чули апостолите на Петдесетница, а Аполос, „роден в Александрия“, бил „силен в писанията“. Пророчеството на Исаия за Египет завършва с благословение: „Благословен Египет, людете мои“. Евсевий записва преданието, че Марко основал църквата в Александрия; коптите, християните на Египет, още броят годините си от царуването на Диоклетиан. Арабска република Египет, със столица Кайро, има над сто милиона жители, почти всички покрай Нил."
