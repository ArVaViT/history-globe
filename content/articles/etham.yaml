body:
  en:
    - "Etham is the second station of the Exodus. Israel left Rameses for Succoth, and “they took their journey from Succoth, and encamped in Etham, in the edge of the wilderness”; from Etham they were told to turn back and camp before Pi-hahiroth, between Migdol and the sea. After the crossing they “went three days' journey in the wilderness of Etham”, which the book of Exodus calls the wilderness of Shur, the desert east of the Egyptian frontier toward Canaan. Etham therefore lay where the cultivated Delta ends and the desert begins, on the eastern edge of Egypt, somewhere along the line of the modern Suez Canal."
    - "Where exactly is not known, and no site has been found. Many take the name to be the Egyptian word khetem, “fortress”: the pharaohs kept a line of forts on the eastern frontier, and papyri of the thirteenth century BC speak of the fortress of Tjeku, the district of Succoth, through which runaway slaves and Shasu nomads passed. On that reading Etham was a frontier post in the Wadi Tumilat, near Pithom (probably Tell er-Retaba) or at the Bitter Lakes beyond it. Others look to the north, to the great fortress of Tjaru at Tell Hebua by the old Pelusiac branch of the Nile, or to the ground near Qantara and Ismailia; the choice depends on which route one gives the Exodus, and the question is open."
    - "The region is today the Ismailia governorate of Egypt, on both banks of the Suez Canal, with the desert of Sinai beyond; Lake Timsah and the Bitter Lakes lie along the old edge of the cultivated land."
  ru:
    - "Ефам — второй стан исхода. Израиль вышел из Раамсеса в Сокхоф, и «двинулись сыны Израилевы из Сокхофа и расположились станом в Ефаме, в конце пустыни»; из Ефама им было велено обратиться и стать пред Пи-Гахирофом, между Мигдолом и морем. Перейдя море, они «шли три дня пути пустынею Ефам», которую книга Исход называет пустыней Сур, — степью к востоку от египетской границы, в сторону Ханаана. Значит, Ефам лежал там, где кончается возделанная Дельта и начинается пустыня, на восточной окраине Египта, где-то по линии нынешнего Суэцкого канала."
    - "Где именно — неизвестно, и никакого места не найдено. Многие видят в имени египетское слово хетем, «крепость»: фараоны держали на восточной границе цепь укреплений, и папирусы XIII века до н. э. говорят о крепости Чеку, области Сокхофа, через которую проходили беглые рабы и кочевники шасу. При таком чтении Ефам был пограничным постом в Вади-Тумилат, близ Пифома (вероятно, Телль-эр-Ретаба) или у Горьких озёр за ним. Другие смотрят на север — к большой крепости Чару в Телль-Хабуа у древнего Пелузийского рукава Нила или к окрестностям Эль-Кантары и Исмаилии; выбор зависит от того, каким путём вести исход, и вопрос остаётся открытым."
    - "Сегодня это египетская провинция Исмаилия по обоим берегам Суэцкого канала, за которым лежит Синайская пустыня; озеро Тимсах и Горькие озёра тянутся вдоль древнего края возделанной земли."
  uk:
    - "Етам — друга стоянка Виходу. Ізраїль вирушив із Раамсеса до Сокхоту, і «помандрували вони від Суккотта та й отаборились ув Етамі, уз край степу»; від Етама їм звеліли повернути назад і отаборитися перед Пі-Гахіротом, між Мігдолом і морем. Після переходу вони «ійшли три днї ходи у степу Етам», який Книга Виходу називає пустелею Сур, пустелею на схід від єгипетського кордону в бік Ханаану. Отже, Етам лежав там, де закінчується оброблена Дельта і починається пустеля, на східному краї Єгипту, десь уздовж лінії сучасного Суецького каналу."
    - "Де саме, невідомо, і місця не знайдено. Багато хто вважає, що назва — єгипетське слово хетем, «фортеця»: фараони тримали лінію фортець на східному кордоні, а папіруси XIII ст. до н. е. говорять про фортецю Чеку, округу Сокхоту, крізь яку проходили втікачі-раби й кочовики шасу. За цим прочитанням Етам був прикордонним постом у Вад-Тумілаті, поблизу Пітома (ймовірно, Телль-ер-Ретаба) або біля Гірких озер за ним. Інші дивляться на північ, на велику фортецю Чару в Телль-Хебуа біля старого пелусійського рукава Нілу, або на місцевість біля Кантари та Ісмаїлії; вибір залежить від того, який маршрут надавати Виходу, і питання відкрите."
    - "Область сьогодні — єгипетська провінція Ісмаїлія, на обох берегах Суецького каналу, з Синайською пустелею за ним; озеро Тімсах і Гіркі озера лежать вздовж давнього краю обробленої землі."
  es:
    - "Etam es la segunda estación del Éxodo. Israel salió de Ramesés hacia Sucot, y «partidos de Succoth, asentaron campo en Etham, á la entrada del desierto»; desde Etam se les dijo que dieran la vuelta y acamparan delante de Pi-hahirot, entre Migdol y el mar. Tras el cruce «anduvieron camino de tres días por el desierto de Etham», que el libro del Éxodo llama el desierto de Shur, el desierto al este de la frontera egipcia hacia Canaán. Etam estaba, pues, donde termina el Delta cultivado y comienza el desierto, en el borde oriental de Egipto, en algún punto de la línea del actual canal de Suez."
    - "No se sabe exactamente dónde, y no se ha hallado ningún sitio. Muchos toman el nombre por la palabra egipcia khetem, «fortaleza»: los faraones mantenían una línea de fuertes en la frontera oriental, y papiros del siglo XIII a. C. hablan de la fortaleza de Tjeku, el distrito de Sucot, por la que pasaban esclavos fugitivos y nómadas shasu. En esa lectura Etam era un puesto fronterizo en el uadi Tumilat, cerca de Pitón (probablemente Tell er-Retaba) o en los Lagos Amargos más allá. Otros miran al norte, a la gran fortaleza de Tjaru en Tell Hebua, junto al antiguo brazo pelusíaco del Nilo, o al terreno cercano a Qantara e Ismailía; la elección depende de la ruta que se dé al Éxodo, y la cuestión está abierta."
    - "La región es hoy la gobernación egipcia de Ismailía, en ambas orillas del canal de Suez, con el desierto del Sinaí más allá; el lago Timsah y los Lagos Amargos se extienden a lo largo del antiguo borde de las tierras cultivadas."
  pt:
    - "Etã é a segunda estação do Êxodo. Israel deixou Ramessés para Sucote, e “Eles partiram de Sucote e acamparam em Etã, na beira do deserto”; de Etã receberam ordem de voltar e acampar diante de Pi-Hairote, entre Migdol e o mar. Depois da travessia, “Caminharam a jornada de três dias no deserto de Etã”, que o livro do Êxodo chama de deserto de Sur, o deserto a leste da fronteira egípcia em direção a Canaã. Etã ficava, portanto, onde termina o Delta cultivado e começa o deserto, no limite oriental do Egito, em algum ponto ao longo da linha do atual Canal de Suez."
    - "Onde exatamente não se sabe, e nenhum local foi achado. Muitos tomam o nome pela palavra egípcia khetem, “fortaleza”: os faraós mantinham uma linha de fortes na fronteira oriental, e papiros do século XIII a.C. falam da fortaleza de Tjeku, o distrito de Sucote, por onde passavam escravos fugitivos e nômades shasu. Nessa leitura, Etã era um posto de fronteira no uádi Tumilat, perto de Pitom (provavelmente Tell er-Retaba) ou nos Lagos Amargos além dela. Outros olham para o norte, para a grande fortaleza de Tjaru, em Tell Hebua, junto ao antigo braço pelusíaco do Nilo, ou para o terreno perto de Qantara e Ismaília; a escolha depende da rota que se dá ao Êxodo, e a questão está aberta."
    - "A região é hoje a província de Ismaília, no Egito, nas duas margens do Canal de Suez, com o deserto do Sinai além; o Lago Timsah e os Lagos Amargos ficam ao longo da antiga borda da terra cultivada."
  de:
    - "Etam ist die zweite Station des Exodus. Israel brach von Ramses nach Sukkot auf, und „also zogen sie aus von Sukkoth und lagerten sich in Etham, vorn an der Wüste“; von Etam wurde ihnen befohlen umzukehren und sich vor Pi-Hahirot zu lagern, zwischen Migdol und dem Meer. Nach der Durchquerung heißt es: „und gingen mitten durchs Meer in die Wüste und reisten drei Tagereisen in der Wüste Etham“, die das Buch Exodus die Wüste Schur nennt, die Wüste östlich der ägyptischen Grenze Richtung Kanaan. Etam lag daher dort, wo das bebaute Delta endet und die Wüste beginnt, am Ostrand Ägyptens, irgendwo entlang der Linie des heutigen Sueskanals."
    - "Wo genau, ist nicht bekannt, und kein Ort ist gefunden worden. Viele halten den Namen für das ägyptische Wort chetem, „Festung“: Die Pharaonen unterhielten eine Reihe von Festungen an der Ostgrenze, und Papyri des 13. Jahrhunderts v. Chr. sprechen von der Festung von Tscheku, dem Bezirk von Sukkot, durch den entlaufene Sklaven und Schasu-Nomaden zogen. Nach dieser Lesart war Etam ein Grenzposten im Wadi Tumilat, nahe Pitom (wahrscheinlich Tell er-Retaba) oder an den Bitterseen dahinter. Andere blicken nach Norden, zur großen Festung von Tscharu in Tell Hebua am alten pelusischen Nilarm, oder auf das Gelände bei Qantara und Ismailia; die Wahl hängt davon ab, welche Route man dem Exodus gibt, und die Frage ist offen."
    - "Die Region ist heute das ägyptische Gouvernement Ismailia, auf beiden Ufern des Sueskanals, mit der Wüste Sinai dahinter; der Timsahsee und die Bitterseen liegen am alten Rand des bebauten Landes."
  fr:
    - "Étham est la deuxième étape de l’Exode. Israël quitta Ramsès pour Succoth, et « Ils partirent de Succoth, et ils campèrent à Étham, à l’extrémité du désert » ; d’Étham, on leur dit de revenir sur leurs pas et de camper devant Pi-Hahiroth, entre Migdol et la mer. Après la traversée, ils « firent trois journées de marche dans le désert d’Étham », que le livre de l’Exode appelle le désert de Schur, le désert à l’est de la frontière égyptienne vers Canaan. Étham se trouvait donc là où finit le Delta cultivé et où commence le désert, sur la bordure orientale de l’Égypte, quelque part le long de l’actuel canal de Suez."
    - "On ne sait pas exactement où, et aucun site n’a été trouvé. Beaucoup tiennent le nom pour le mot égyptien khetem, « forteresse » : les pharaons entretenaient une ligne de forts à la frontière orientale, et des papyrus du XIIIe siècle av. J.-C. parlent de la forteresse de Tjeku, le district de Succoth, que franchissaient esclaves en fuite et nomades shasou. Dans cette lecture, Étham était un poste-frontière dans le Wadi Tumilat, près de Pithom (probablement Tell er-Retaba) ou aux lacs Amers au-delà. D’autres regardent vers le nord, vers la grande forteresse de Tjarou à Tell Hebua, près de l’ancien bras pélusiaque du Nil, ou vers les terres près de Qantara et d’Ismaïlia ; le choix dépend de l’itinéraire que l’on donne à l’Exode, et la question est ouverte."
    - "La région est aujourd’hui le gouvernorat d’Ismaïlia, en Égypte, sur les deux rives du canal de Suez, avec le désert du Sinaï au-delà ; le lac Timsah et les lacs Amers longent l’ancienne lisière des terres cultivées."
  it:
    - "Etam è la seconda stazione dell’Esodo. Israele lasciò Ramses per Succot, ed essi «Partirono da Succoth e si accamparono a Etham che è all’estremità del deserto»; da Etam fu detto loro di tornare indietro e accamparsi davanti a Pi-Achirot, fra Migdol e il mare. Dopo il passaggio «fecero tre giornate di marcia nel deserto di Etham», che il libro dell’Esodo chiama deserto di Sur, il deserto a est della frontiera egiziana verso Canaan. Etam si trovava quindi dove termina il Delta coltivato e comincia il deserto, sul margine orientale dell’Egitto, da qualche parte lungo la linea dell’odierno Canale di Suez."
    - "Dove esattamente non si sa, e non è stato trovato alcun sito. Molti ritengono che il nome sia la parola egizia khetem, «fortezza»: i faraoni tenevano una linea di forti sulla frontiera orientale, e papiri del XIII secolo a.C. parlano della fortezza di Tjeku, il distretto di Succot, attraverso la quale passavano schiavi fuggitivi e nomadi Shasu. Secondo questa lettura Etam era un posto di frontiera nel Wadi Tumilat, presso Pitom (probabilmente Tell er-Retaba) o ai Laghi Amari al di là. Altri guardano a nord, alla grande fortezza di Tjaru a Tell Hebua presso l’antico ramo pelusiaco del Nilo, o al terreno presso Qantara e Ismailia; la scelta dipende dal percorso che si dà all’Esodo, e la questione è aperta."
    - "La regione è oggi il governatorato egiziano di Ismailia, su entrambe le rive del Canale di Suez, con il deserto del Sinai al di là; il Lago Timsah e i Laghi Amari si stendono lungo l’antico margine della terra coltivata."
  pl:
    - "Etam to druga stacja Wyjścia. Izrael opuścił Ramses ku Sukkot i „wyciągnąwszy z Suchotu położyli się obozem w Etam, na końcu puszczy”; z Etam kazano im zawrócić i obozować przed Pi-Hachirot, między Migdolem a morzem. Po przejściu przez morze „uszedłszy trzy dni drogi po puszczy Etam”, którą Księga Wyjścia nazywa pustynią Szur, pustynią na wschód od granicy egipskiej ku Kanaanowi. Etam leżało więc tam, gdzie kończy się uprawna Delta, a zaczyna pustynia, na wschodnim skraju Egiptu, gdzieś wzdłuż linii dzisiejszego Kanału Sueskiego."
    - "Gdzie dokładnie, nie wiadomo, i żadnego miejsca nie znaleziono. Wielu uważa nazwę za egipskie słowo chetem, „twierdza”: faraonowie utrzymywali linię fortec na wschodniej granicy, a papirusy z XIII w. p.n.e. mówią o twierdzy Tjeku, okręgu Sukkot, przez który przechodzili zbiegli niewolnicy i koczownicy Szasu. W tym odczytaniu Etam było posterunkiem granicznym w Wadi Tumilat, blisko Pitom (prawdopodobnie Tell er-Retaba) lub nad Jeziorami Gorzkimi za nim. Inni patrzą na północ, ku wielkiej twierdzy Tjaru w Tell Hebua nad dawną odnogą pelusyjską Nilu, albo ku terenom koło Kantary i Ismailii; wybór zależy od trasy, jaką się nadaje Wyjściu, i kwestia pozostaje otwarta."
    - "Region ten to dziś egipska muhafaza Ismailia, po obu brzegach Kanału Sueskiego, z pustynią Synaju za nim; jezioro Timsah i Jeziora Gorzkie leżą wzdłuż dawnego skraju uprawnej ziemi."
  nl:
    - "Etam is het tweede station van de Uittocht. Israël verliet Raämses naar Sukkot, en toen “reisden zij uit Sukkoth; en zij legerden zich in Etham, aan het einde der woestijn”; vanuit Etam kregen zij opdracht terug te keren en te kamperen voor Pi-Hachirot, tussen Migdol en de zee. Na de doortocht: “zij gingen drie dagreizen in de woestijn Etham”, die het boek Exodus de woestijn Sur noemt, de woestijn ten oosten van de Egyptische grens richting Kanaän. Etam lag daarom waar de bebouwde Delta eindigt en de woestijn begint, aan de oostrand van Egypte, ergens langs de lijn van het huidige Suezkanaal."
    - "Waar precies, is niet bekend, en geen plaats is gevonden. Velen nemen de naam voor het Egyptische woord khetem, “vesting”: de farao's hielden een rij forten aan de oostgrens, en papyri uit de dertiende eeuw v.Chr. spreken van de vesting Tjeku, het district Sukkot, waardoorheen weggelopen slaven en Shasu-nomaden trokken. Volgens die lezing was Etam een grenspost in de Wadi Tumilat, bij Pitom (waarschijnlijk Tell er-Retaba) of aan de Bittermeren daarachter. Anderen kijken naar het noorden, naar de grote vesting Tjaru bij Tell Hebua aan de oude Pelusische arm van de Nijl, of naar de grond bij Qantara en Ismailia; de keuze hangt af van de route die men de Uittocht geeft, en de vraag is open."
    - "De streek is nu het Egyptische gouvernement Ismailia, aan beide oevers van het Suezkanaal, met de woestijn van de Sinaï erachter; het Timsahmeer en de Bittermeren liggen langs de oude rand van het bebouwde land."
  cs:
    - "Etam je druhá stanice exodu. Izrael opustil Ramesse a vydal se do Sukot a „hnuvše se z Sochot, položili se v Etam, jenž jest při kraji pouště“; z Etamu jim bylo řečeno, aby se obrátili zpět a utábořili před Pi-hachirótem, mezi Migdolem a mořem. Po přechodu, jak se praví, „ušedše tří dnů cesty po poušti Etam“, kterou Kniha Exodus nazývá pouští Šur, pouští východně od egyptské hranice směrem ke Kanaánu. Etam tedy ležel tam, kde končí obdělávaná Delta a začíná poušť, na východním okraji Egypta, někde podél linie dnešního Suezského průplavu."
    - "Kde přesně, není známo a žádné místo nebylo nalezeno. Mnozí pokládají jméno za egyptské slovo chetem, „pevnost“: faraóni udržovali linii pevností na východní hranici a papyry ze 13. století př. n. l. mluví o pevnosti Čeku, okrese Sukot, kterým procházeli uprchlí otroci a nomádi Šasu. Podle tohoto čtení byl Etam pohraniční stanicí ve Wadi Tumilat, poblíž Pitomu (pravděpodobně Tell er-Retaba) nebo u Hořkých jezer za ním. Jiní hledí na sever, k velké pevnosti Čaru v Tell Hebua u starého pelúsijského ramene Nilu, nebo k půdě u Qantary a Ismailie; volba závisí na tom, jakou trasu exodu kdo přijímá, a otázka je otevřená."
    - "Oblast je dnes egyptský guvernorát Ismailia na obou březích Suezského průplavu, se Sinajskou pouští za ním; jezero Timsah a Hořká jezera leží podél starého okraje obdělávané země."
  sv:
    - "Etam är uttågets andra station. Israel lämnade Rameses för Suckot, och ”de bröto upp från Suckot och lägrade sig i Etam, där öknen begynte”; från Etam fick de order att vända om och slå läger framför Pi-Hachirot, mellan Migdol och havet. Efter övergången tågade de ”tre dagsresor i Etams öken”, som Andra Mosebok kallar Shurs öken, öknen öster om den egyptiska gränsen mot Kanaan. Etam låg alltså där det odlade deltat slutar och öknen börjar, på Egyptens östra kant, någonstans längs den nuvarande Suezkanalens linje."
    - "Var exakt är inte känt, och ingen plats har hittats. Många tar namnet för det egyptiska ordet khetem, ”fästning”: faraonerna höll en rad fästningar vid östgränsen, och papyrer från 1200-talet f.Kr. talar om fästningen Tjeku, Suckots distrikt, genom vilken förrymda slavar och shasu-nomader passerade. Enligt den läsningen var Etam en gränspost i Wadi Tumilat, nära Pitom (sannolikt Tell er-Retaba) eller vid Bittersjöarna bortom den. Andra tittar norrut, på den stora fästningen Tjaru vid Tell Hebua vid den gamla pelusiska Nilgrenen, eller på marken nära Qantara och Ismailia; valet beror på vilken väg man ger uttåget, och frågan är öppen."
    - "Området är i dag Egyptens guvernement Ismailia, på båda sidor om Suezkanalen, med Sinais öken bortom; Timsahsjön och Bittersjöarna ligger längs den gamla kanten av det odlade landet."
  nb:
    - "Etam er den andre stasjonen på utferden. Israel forlot Ramses for Sukkot, og «brøt op fra Sukkot og slo leir i Etam ved grensen av ørkenen»; fra Etam ble de bedt om å vende om og slå leir foran Pi-Hakirot, mellom Migdol og havet. Etter overgangen «drog de tre dagsreiser i Etams ørken», som 2. Mosebok kaller ørkenen Sjur, ørkenen øst for den egyptiske grensen mot Kanaan. Etam lå derfor der det dyrkede Deltaet slutter og ørkenen begynner, i den østlige kanten av Egypt, et sted langs linjen til den moderne Suezkanalen."
    - "Hvor nøyaktig er ukjent, og intet sted er funnet. Mange tar navnet for å være det egyptiske ordet khetem, «festning»: faraoene holdt en rekke festninger på østgrensen, og papyri fra 1200-tallet f.Kr. taler om festningen Tjeku, distriktet Sukkot, som bortløpne slaver og shasu-nomader passerte. Etter denne lesningen var Etam en grensepost i Wadi Tumilat, nær Pitom (trolig Tell er-Retaba) eller ved Bittersjøene bortenfor. Andre ser nordover, mot den store festningen Tjaru ved Tell Hebua ved den gamle pelusiske grenen av Nilen, eller til området nær Qantara og Ismailia; valget avhenger av hvilken rute man gir utferden, og spørsmålet er åpent."
    - "Området er i dag Egypts Ismailia-guvernement, på begge sider av Suezkanalen, med Sinai-ørkenen bortenfor; Timsah-sjøen og Bittersjøene ligger langs den gamle kanten av det dyrkede landet."
  tl:
    - "Ang Etham ang ikalawang himpilan ng Exodo. Umalis ang Israel sa Rameses patungong Succoth, at “naglakbay mula sa Succoth, at humantong sa Etham, sa hangganan ng ilang”; mula sa Etham ay sinabihan silang bumalik at humimpil sa harap ng Pi-hahiroth, sa pagitan ng Migdol at ng dagat. Pagkatawid, “naglakbay na tatlong araw sa ilang ng Etham”, na tinatawag ng aklat ng Exodo na ilang ng Shur, ang disyerto sa silangan ng hangganang Egipcio patungong Canaan. Kaya nasa Etham kung saan nagtatapos ang sinasaka na Delta at nagsisimula ang disyerto, sa silangang gilid ng Egipto, saanman sa guhit ng makabagong Kanal ng Suez."
    - "Hindi alam ang eksaktong lugar, at walang natagpuang pook. Maraming kumukuha sa pangalan bilang salitang Egipcio na khetem, “kuta”: nag-ingat ang mga faraon ng hanay ng mga kuta sa silangang hangganan, at binabanggit ng mga papiro ng ika-13 siglo BK ang kuta ng Tjeku, ang distrito ng Succoth, na dinaanan ng mga tumakas na alipin at nomadang Shasu. Sa pagbasang iyon, ang Etham ay isang bantayan sa hangganan sa Wadi Tumilat, malapit sa Phithom (marahil ang Tell er-Retaba) o sa Mapait na mga Lawa sa kabila nito. Ang iba ay tumitingin sa hilaga, sa dakilang kuta ng Tjaru sa Tell Hebua sa tabi ng lumang sangang Pelusiac ng Nilo, o sa lupa malapit sa Qantara at Ismailia; nakasalalay ang pagpili sa ruta ng Exodo, at bukas ang tanong."
    - "Ang rehiyon ngayon ay ang gobernadurya ng Ismailia ng Egipto, sa magkabilang pampang ng Kanal ng Suez, na may disyerto ng Sinai sa kabila; ang Lawa ng Timsah at ang Mapait na mga Lawa ay nasa tabi ng lumang gilid ng sinasaka na lupa."
