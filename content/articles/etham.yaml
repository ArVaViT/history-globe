# Overview article (ADR 0007). Mainstream facts only; the place is unlocated and the candidates are given without choosing; the Egyptian etymology is reported as the common suggestion.
id: etham
place: a27d0e0
title:
  en: "Etham"
  ru: "Ефам"
  uk: "Етам"
  es: "Etam"
  pt: "Etã"
  de: "Etam"
  fr: "Étham"
body:
  en:
    - "Etham is the second station of the Exodus. Israel left Rameses for Succoth, and “they took their journey from Succoth, and encamped in Etham, in the edge of the wilderness”; from Etham they were told to turn back and camp before Pi-hahiroth, between Migdol and the sea. After the crossing they “went three days' journey in the wilderness of Etham”, which the book of Exodus calls the wilderness of Shur, the desert east of the Egyptian frontier toward Canaan. Etham therefore lay where the cultivated Delta ends and the desert begins, on the eastern edge of Egypt, somewhere along the line of the modern Suez Canal."
    - "Where exactly is not known, and no site has been found. Many take the name to be the Egyptian word khetem, “fortress”: the pharaohs kept a line of forts on the eastern frontier, and papyri of the thirteenth century BC speak of the fortress of Tjeku, the district of Succoth, through which runaway slaves and Shasu nomads passed. On that reading Etham was a frontier post in the Wadi Tumilat, near Pithom (Tell er-Retaba) or at the Bitter Lakes beyond it. Others look to the north, to the great fortress of Tjaru at Tell Hebua by the old Pelusiac branch of the Nile, or to the ground near Qantara and Ismailia; the choice depends on which route one gives the Exodus, and the question is open."
    - "The region is today the Ismailia governorate of Egypt, on both banks of the Suez Canal, with the desert of Sinai beyond; Lake Timsah and the Bitter Lakes lie along the old edge of the cultivated land."
  ru:
    - "Ефам — второй стан исхода. Израиль вышел из Раамсеса в Сокхоф, и «двинулись сыны Израилевы из Сокхофа и расположились станом в Ефаме, в конце пустыни»; из Ефама им было велено обратиться и стать пред Пи-Гахирофом, между Мигдолом и морем. Перейдя море, они «шли три дня пути пустынею Ефам», которую книга Исход называет пустыней Сур, — степью к востоку от египетской границы, в сторону Ханаана. Значит, Ефам лежал там, где кончается возделанная Дельта и начинается пустыня, на восточной окраине Египта, где-то по линии нынешнего Суэцкого канала."
    - "Где именно — неизвестно, и никакого места не найдено. Многие видят в имени египетское слово хетем, «крепость»: фараоны держали на восточной границе цепь укреплений, и папирусы XIII века до н. э. говорят о крепости Чеку, области Сокхофа, через которую проходили беглые рабы и кочевники шасу. При таком чтении Ефам был пограничным постом в Вади-Тумилат, близ Пифома (Телль-эр-Ретаба) или у Горьких озёр за ним. Другие смотрят на север — к большой крепости Чару в Телль-Хабуа у древнего Пелузийского рукава Нила или к окрестностям Эль-Кантары и Исмаилии; выбор зависит от того, каким путём вести исход, и вопрос остаётся открытым."
    - "Сегодня это египетская провинция Исмаилия по обоим берегам Суэцкого канала, за которым лежит Синайская пустыня; озеро Тимсах и Горькие озёра тянутся вдоль древнего края возделанной земли."
  uk:
    - "Етам — друга стоянка Виходу. Ізраїль вирушив із Раамсеса до Сокхоту, і «помандрували вони від Суккотта та й отаборились ув Етамі, уз край степу»; від Етама їм звеліли повернути назад і отаборитися перед Пі-Гахіротом, між Мігдолом і морем. Після переходу вони «ійшли три днї ходи у степу Етам», який Книга Виходу називає пустелею Сур, пустелею на схід від єгипетського кордону в бік Ханаану. Отже, Етам лежав там, де закінчується оброблена Дельта і починається пустеля, на східному краї Єгипту, десь уздовж лінії сучасного Суецького каналу."
    - "Де саме, невідомо, і місця не знайдено. Багато хто вважає, що назва — єгипетське слово хетем, «фортеця»: фараони тримали лінію фортець на східному кордоні, а папіруси XIII ст. до н. е. говорять про фортецю Чеку, округу Сокхоту, крізь яку проходили втікачі-раби й кочовики шасу. За цим прочитанням Етам був прикордонним постом у Вад-Тумілаті, поблизу Пітома (Телль-ер-Ретаба) або біля Гірких озер за ним. Інші дивляться на північ, на велику фортецю Чару в Телль-Хебуа біля старого пелусійського рукава Нілу, або на місцевість біля Кантари та Ісмаїлії; вибір залежить від того, який маршрут надавати Виходу, і питання відкрите."
    - "Область сьогодні — єгипетська провінція Ісмаїлія, на обох берегах Суецького каналу, з Синайською пустелею за ним; озеро Тімсах і Гіркі озера лежать вздовж давнього краю обробленої землі."
  es:
    - "Etam es la segunda estación del Éxodo. Israel salió de Ramesés hacia Sucot, y «partidos de Succoth, asentaron campo en Etham, á la entrada del desierto»; desde Etam se les dijo que dieran la vuelta y acamparan delante de Pi-hahirot, entre Migdol y el mar. Tras el cruce «anduvieron camino de tres días por el desierto de Etham», que el libro del Éxodo llama el desierto de Shur, el desierto al este de la frontera egipcia hacia Canaán. Etam estaba, pues, donde termina el Delta cultivado y comienza el desierto, en el borde oriental de Egipto, en algún punto de la línea del actual canal de Suez."
    - "No se sabe exactamente dónde, y no se ha hallado ningún sitio. Muchos toman el nombre por la palabra egipcia khetem, «fortaleza»: los faraones mantenían una línea de fuertes en la frontera oriental, y papiros del siglo XIII a. C. hablan de la fortaleza de Tjeku, el distrito de Sucot, por la que pasaban esclavos fugitivos y nómadas shasu. En esa lectura Etam era un puesto fronterizo en el uadi Tumilat, cerca de Pitón (Tell er-Retaba) o en los Lagos Amargos más allá. Otros miran al norte, a la gran fortaleza de Tjaru en Tell Hebua, junto al antiguo brazo pelusíaco del Nilo, o al terreno cercano a Qantara e Ismailía; la elección depende de la ruta que se dé al Éxodo, y la cuestión está abierta."
    - "La región es hoy la gobernación egipcia de Ismailía, en ambas orillas del canal de Suez, con el desierto del Sinaí más allá; el lago Timsah y los Lagos Amargos se extienden a lo largo del antiguo borde de las tierras cultivadas."
  pt:
    - "Etã é a segunda estação do Êxodo. Israel deixou Ramessés para Sucote, e “Eles partiram de Sucote e acamparam em Etã, na beira do deserto”; de Etã receberam ordem de voltar e acampar diante de Pi-Hairote, entre Migdol e o mar. Depois da travessia, “Caminharam a jornada de três dias no deserto de Etã”, que o livro do Êxodo chama de deserto de Sur, o deserto a leste da fronteira egípcia em direção a Canaã. Etã ficava, portanto, onde termina o Delta cultivado e começa o deserto, no limite oriental do Egito, em algum ponto ao longo da linha do atual Canal de Suez."
    - "Onde exatamente não se sabe, e nenhum local foi achado. Muitos tomam o nome pela palavra egípcia khetem, “fortaleza”: os faraós mantinham uma linha de fortes na fronteira oriental, e papiros do século XIII a.C. falam da fortaleza de Tjeku, o distrito de Sucote, por onde passavam escravos fugitivos e nômades shasu. Nessa leitura, Etã era um posto de fronteira no uádi Tumilat, perto de Pitom (Tell er-Retaba) ou nos Lagos Amargos além dela. Outros olham para o norte, para a grande fortaleza de Tjaru, em Tell Hebua, junto ao antigo braço pelusíaco do Nilo, ou para o terreno perto de Qantara e Ismaília; a escolha depende da rota que se dá ao Êxodo, e a questão está aberta."
    - "A região é hoje a província de Ismaília, no Egito, nas duas margens do Canal de Suez, com o deserto do Sinai além; o Lago Timsah e os Lagos Amargos ficam ao longo da antiga borda da terra cultivada."
  de:
    - "Etam ist die zweite Station des Exodus. Israel brach von Ramses nach Sukkot auf, und „also zogen sie aus von Sukkoth und lagerten sich in Etham, vorn an der Wüste“; von Etam wurde ihnen befohlen umzukehren und sich vor Pi-Hahirot zu lagern, zwischen Migdol und dem Meer. Nach der Durchquerung heißt es: „und gingen mitten durchs Meer in die Wüste und reisten drei Tagereisen in der Wüste Etham“, die das Buch Exodus die Wüste Schur nennt, die Wüste östlich der ägyptischen Grenze Richtung Kanaan. Etam lag daher dort, wo das bebaute Delta endet und die Wüste beginnt, am Ostrand Ägyptens, irgendwo entlang der Linie des heutigen Sueskanals."
    - "Wo genau, ist nicht bekannt, und kein Ort ist gefunden worden. Viele halten den Namen für das ägyptische Wort chetem, „Festung“: Die Pharaonen unterhielten eine Reihe von Festungen an der Ostgrenze, und Papyri des 13. Jahrhunderts v. Chr. sprechen von der Festung von Tscheku, dem Bezirk von Sukkot, durch den entlaufene Sklaven und Schasu-Nomaden zogen. Nach dieser Lesart war Etam ein Grenzposten im Wadi Tumilat, nahe Pitom (Tell er-Retaba) oder an den Bitterseen dahinter. Andere blicken nach Norden, zur großen Festung von Tscharu in Tell Hebua am alten pelusischen Nilarm, oder auf das Gelände bei Qantara und Ismailia; die Wahl hängt davon ab, welche Route man dem Exodus gibt, und die Frage ist offen."
    - "Die Region ist heute das ägyptische Gouvernement Ismailia, auf beiden Ufern des Sueskanals, mit der Wüste Sinai dahinter; der Timsahsee und die Bitterseen liegen am alten Rand des bebauten Landes."
  fr:
    - "Étham est la deuxième étape de l’Exode. Israël quitta Ramsès pour Succoth, et « Ils partirent de Succoth, et ils campèrent à Étham, à l’extrémité du désert » ; d’Étham, on leur dit de revenir sur leurs pas et de camper devant Pi-Hahiroth, entre Migdol et la mer. Après la traversée, ils « firent trois journées de marche dans le désert d’Étham », que le livre de l’Exode appelle le désert de Schur, le désert à l’est de la frontière égyptienne vers Canaan. Étham se trouvait donc là où finit le Delta cultivé et où commence le désert, sur la bordure orientale de l’Égypte, quelque part le long de l’actuel canal de Suez."
    - "On ne sait pas exactement où, et aucun site n’a été trouvé. Beaucoup tiennent le nom pour le mot égyptien khetem, « forteresse » : les pharaons entretenaient une ligne de forts à la frontière orientale, et des papyrus du XIIIe siècle av. J.-C. parlent de la forteresse de Tjeku, le district de Succoth, que franchissaient esclaves en fuite et nomades shasou. Dans cette lecture, Étham était un poste-frontière dans le Wadi Tumilat, près de Pithom (Tell er-Retaba) ou aux lacs Amers au-delà. D’autres regardent vers le nord, vers la grande forteresse de Tjarou à Tell Hebua, près de l’ancien bras pélusiaque du Nil, ou vers les terres près de Qantara et d’Ismaïlia ; le choix dépend de l’itinéraire que l’on donne à l’Exode, et la question est ouverte."
    - "La région est aujourd’hui le gouvernorat d’Ismaïlia, en Égypte, sur les deux rives du canal de Suez, avec le désert du Sinaï au-delà ; le lac Timsah et les lacs Amers longent l’ancienne lisière des terres cultivées."
