# Overview article (ADR 0007). Mainstream facts only; the valley is disputed and the candidates on the map are given without a choice.
id: valley-of-iphtahel
place: a3e0180
title:
  en: "Valley of Iphtahel"
  ru: "Долина Ифтах-Ел"
  uk: "Долина Іфтах-Ел"
  es: "Valle de Iftah-el"
  pt: "Vale de Iftá-El"
  de: "Jiftach-El-Tal"
  fr: "Vallée de Jiphtach-El"
body:
  en:
    - "The valley of Iphtahel, “God opens”, is a landmark on the tribal borders of Lower Galilee and nothing more. Zebulun's border turns “on the north side to Hannathon: and the outgoings thereof are in the valley of Jiphthah-el”, and Asher's border “reacheth to Zebulun, and to the valley of Jiphthah-el toward the north side of Beth-emek, and Neiel, and goeth out to Cabul”. The valley therefore lay where Zebulun and Asher met, between the hills of Lower Galilee and the plain of Acco, near Cabul (Kabul) and Hannathon, usually placed at Tel Hannaton at the western end of the Beth Netofa valley."
    - "Which valley is meant is disputed. The commonest view takes it for the Wadi el-Malik, the lower course of Nahal Zippori, which runs west from the Beth Netofa basin past Shefa-'Amr toward the plain of Acco; others prefer the Wadi 'Abbelin (I'billin) a little to the north, which suits Cabul and the Asher border better, or the Beth Netofa valley itself; the area of Khirbet Shifat has also been named, and an older suggestion connected the name with Jotapata (Yodefat). The map keeps these candidates. No town bears the valley's name, no excavation can settle it, and it plays no part in any story. Today these are the farmed wadis between the Arab towns of Shefa-'Amr, I'billin and Kabul in northern Israel."
  ru:
    - "Долина Ифтах-Ел, «Бог отворяет», — примета на границах колен в Нижней Галилее, и только. Предел Завулона «поворачивает предел от севера к Ханнафону и оканчивается долиною Ифтах-Ел», а предел Асира «примыкает к Завулону и к долине Ифтах-Ел с севера, и входит в пределы Асафы в Беф-Емек и Неиел, и идет у Кавула». Долина, стало быть, лежала там, где сходились Завулон и Асир, между холмами Нижней Галилеи и равниной Акко, близ Кавула (Кабуля) и Ханнафона, который обычно помещают в Тель-Ханнатоне на западном краю долины Бейт-Нетофа."
    - "Какая именно долина имеется в виду, спорно. Чаще всего в ней видят Вади-эль-Малик, нижнее течение Нахаль-Циппори, которое идёт на запад из котловины Бейт-Нетофа мимо Шфарама к равнине Акко; другие предпочитают Вади-Аббелин (Иблин) чуть севернее, которое лучше подходит Кавулу и границе Асира, или саму долину Бейт-Нетофа; называли и окрестности Хирбет-Шифата, а старое предположение связывало имя с Иотапатой (Йодфатом). Карта хранит этих кандидатов. Ни один город не носит имени долины, никакие раскопки спора не решат, и ни в одном рассказе она не участвует. Сегодня это возделанные вади между арабскими городами Шфарам, Иблин и Кабуль на севере Израиля."
  uk:
    - "Долина Іфтах-Ел, «Бог відчиняє», — лише орієнтир на племінних межах Нижньої Галілеї. Межа Завулона повертає «від півночі на Ханнатон, а кінчається в Іфтах-Ел долинї», а межа Асіра «торкається до Зебулона та до Іфтах-Ел долини на півночі, та до Бет-Емек і Неіел, і йде на Кабул з лївого боку». Отже, долина лежала там, де сходилися Завулон і Асір, між пагорбами Нижньої Галілеї та рівниною Акко, поблизу Кабула (Кабул) і Ханнатона, який зазвичай ставлять у Тель-Ханнатоні на західному краю долини Бейт-Нетофа."
    - "Яку долину мають на увазі, спірно. Найпоширеніша думка вважає її Вади-ель-Малік, нижньою течією Нахаль-Ціппорі, що тече на захід від улоговини Бейт-Нетофа повз Шефарам до рівнини Акко; інші віддають перевагу Вади-Аббелін (Ібілін) трохи північніше, що краще пасує до Кабула та межі Асіра, або самій долині Бейт-Нетофа; називали також район Хірбет-Шифата, а старіша пропозиція пов’язувала назву з Йотапатою (Йодефат). Мапа зберігає цих кандидатів. Жодне місто не носить назви долини, жодні розкопки не можуть це вирішити, і вона не відіграє ролі в жодній розповіді. Нині це оброблювані вади між арабськими містами Шефарам, Ібілін і Кабул на півночі Ізраїлю."
  es:
    - "El valle de Iftah-el, «Dios abre», es un hito de las fronteras tribales de la Baja Galilea y nada más. La frontera de Zabulón «torna este término al norte á Hanatón, viniendo á salir al valle de Iphtael», y la de Aser «llega á Zabulón, y al valle de Iphtael al norte, á Beth-emec, y á Nehiel, y sale á Cabul á la izquierda». El valle se hallaba, pues, donde Zabulón y Aser se encontraban, entre las colinas de la Baja Galilea y la llanura de Aco, cerca de Cabul (Kabul) y Hanatón, que suele situarse en Tel Hannaton, en el extremo occidental del valle de Bet Netofa."
    - "Se discute qué valle se significa. La opinión más común lo toma por el Wadi el-Malik, el curso bajo del Nahal Zippori, que corre hacia el oeste desde la cuenca de Bet Netofa, pasando por Shefa-'Amr, hacia la llanura de Aco; otros prefieren el Wadi 'Abbelin (I'billin), algo más al norte, que encaja mejor con Cabul y la frontera de Aser, o el propio valle de Bet Netofa; también se ha nombrado la zona de Khirbet Shifat, y una sugerencia más antigua relacionaba el nombre con Jotapata (Yodefat). El mapa conserva estos candidatos. Ninguna ciudad lleva el nombre del valle, ninguna excavación puede resolverlo y no desempeña papel en ningún relato. Hoy son los wadis cultivados entre las ciudades árabes de Shefa-'Amr, I'billin y Kabul, en el norte de Israel."
  pt:
    - "O vale de Iftá-El, “Deus abre”, é um marco das fronteiras tribais da Baixa Galileia e nada mais. A fronteira de Zebulom contorna “pelo norte até Hanatom; e terminava no vale de Iftá-El”, e a de Aser “chegava a Zebulom e ao vale de Iftá-El, ao norte, para Bete-Emeque e Neiel. Saía para Cabul”. O vale ficava, portanto, onde Zebulom e Aser se encontravam, entre as colinas da Baixa Galileia e a planície de Aco, perto de Cabul (Kabul) e Hanatom, geralmente situada em Tel Hannaton, na extremidade ocidental do vale de Beth Netofa."
    - "Qual vale se tem em vista é discutido. A visão mais comum o toma pelo Wadi el-Malik, o curso inferior do Nahal Zippori, que corre para oeste da bacia de Beth Netofa, passando por Shefa-'Amr, rumo à planície de Aco; outros preferem o Wadi 'Abbelin (I'billin), um pouco ao norte, que se ajusta melhor a Cabul e à fronteira de Aser, ou o próprio vale de Beth Netofa; a área de Khirbet Shifat também foi nomeada, e uma sugestão mais antiga ligou o nome a Jotapata (Yodefat). O mapa conserva esses candidatos. Nenhuma cidade leva o nome do vale, nenhuma escavação pode resolvê-lo, e ele não tem papel em nenhuma história. Hoje são os uádis cultivados entre as cidades árabes de Shefa-'Amr, I'billin e Kabul, no norte de Israel."
  de:
    - "Das Jiftach-El-Tal, „Gott öffnet“, ist ein Orientierungspunkt an den Stammesgrenzen Untergaliläas und nichts weiter. Sebuluns Grenze lenkt sich „mitternachtwärts gen Hannathon und endet im Tal Jephthah-El“, und Assers Grenze „stößt an Sebulon und an das Tal Jephthah-El mitternachtwärts, Beth-Emek, Negiel und kommt hinaus gen Kabul zur Linken“. Das Tal lag also dort, wo Sebulon und Asser zusammentrafen, zwischen den Hügeln Untergaliläas und der Ebene von Akko, nahe Kabul und Hannaton, meist bei Tel Hannaton am Westende des Beth-Netofa-Tals angesetzt."
    - "Welches Tal gemeint ist, ist umstritten. Die häufigste Ansicht hält es für das Wadi el-Malik, den Unterlauf des Nahal Zippori, der vom Beth-Netofa-Becken an Shefa-'Amr vorbei nach Westen zur Ebene von Akko fließt; andere bevorzugen das etwas nördlichere Wadi 'Abbelin (I'billin), das besser zu Kabul und zur Grenze Assers passt, oder das Beth-Netofa-Tal selbst; auch die Gegend von Khirbet Shifat wurde genannt, und ein älterer Vorschlag verband den Namen mit Jotapata (Jodefat). Die Karte behält diese Kandidaten. Keine Stadt trägt den Namen des Tals, keine Ausgrabung kann es entscheiden, und es spielt in keiner Geschichte eine Rolle. Heute sind es die bewirtschafteten Wadis zwischen den arabischen Städten Shefa-'Amr, I'billin und Kabul im Norden Israels."
  fr:
    - "La vallée de Jiphtach-El, « Dieu ouvre », est un repère des frontières tribales de la Basse Galilée et rien de plus. La frontière de Zabulon tourne « du côté du nord vers Hannathon, et aboutissait à la vallée de Jiphthach-El », et celle d’Aser « atteignait Zabulon et la vallée de Jiphthach-El au nord de Beth-Émek et de Neïel, et se prolongeait vers Cabul ». La vallée se trouvait donc là où Zabulon et Aser se rejoignaient, entre les collines de la Basse Galilée et la plaine d’Acco, près de Cabul (Kabul) et de Hannathon, d’ordinaire placée à Tel Hannaton à l’extrémité ouest de la vallée de Beth Netofa."
    - "La vallée visée est discutée. L’opinion la plus courante y voit le Wadi el-Malik, cours inférieur du Nahal Zippori, qui court vers l’ouest depuis le bassin de Beth Netofa devant Shefa-’Amr vers la plaine d’Acco ; d’autres préfèrent le Wadi ’Abbelin (I’billin), un peu plus au nord, qui convient mieux à Cabul et à la frontière d’Aser, ou la vallée de Beth Netofa elle-même ; la région de Khirbet Shifat a aussi été nommée, et une ancienne suggestion rattachait le nom à Jotapata (Yodefat). La carte garde ces candidats. Aucune ville ne porte le nom de la vallée, aucune fouille ne peut trancher, et elle ne joue aucun rôle dans aucun récit. Ce sont aujourd’hui les oueds cultivés entre les villes arabes de Shefa-’Amr, d’I’billin et de Kabul, dans le nord d’Israël."
scripture:
  - Josh.19.14
  - Josh.19.27
sources:
