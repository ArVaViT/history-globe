# Overview article (ADR 0007). Mainstream facts only; the valley is disputed and the candidates on the map are given without a choice.
id: valley-of-iphtahel
place: a3e0180
title:
  en: "Valley of Iphtahel"
  ru: "Долина Ифтах-Ел"
body:
  en:
    - "The valley of Iphtahel, “God opens”, is a landmark on the tribal borders of Lower Galilee and nothing more. Zebulun's border turns “on the north side to Hannathon: and the outgoings thereof are in the valley of Jiphthah-el”, and Asher's border “reacheth to Zebulun, and to the valley of Jiphthah-el toward the north side of Beth-emek, and Neiel, and goeth out to Cabul”. The valley therefore lay where Zebulun and Asher met, between the hills of Lower Galilee and the plain of Acco, near Cabul (Kabul) and Hannathon, usually placed at Tel Hannaton at the western end of the Beth Netofa valley."
    - "Which valley is meant is disputed. The commonest view takes it for the Wadi el-Malik, the lower course of Nahal Zippori, which runs west from the Beth Netofa basin past Shefa-'Amr toward the plain of Acco; others prefer the Wadi 'Abbelin (I'billin) a little to the north, which suits Cabul and the Asher border better, or the Beth Netofa valley itself; the area of Khirbet Shifat has also been named, and an older suggestion connected the name with Jotapata (Yodefat). The map keeps these candidates. No town bears the valley's name, no excavation can settle it, and it plays no part in any story. Today these are the farmed wadis between the Arab towns of Shefa-'Amr, I'billin and Kabul in northern Israel."
  ru:
    - "Долина Ифтах-Ел, «Бог отворяет», — примета на границах колен в Нижней Галилее, и только. Предел Завулона «поворачивает предел от севера к Ханнафону и оканчивается долиною Ифтах-Ел», а предел Асира «примыкает к Завулону и к долине Ифтах-Ел с севера, и входит в пределы Асафы в Беф-Емек и Неиел, и идет у Кавула». Долина, стало быть, лежала там, где сходились Завулон и Асир, между холмами Нижней Галилеи и равниной Акко, близ Кавула (Кабуля) и Ханнафона, который обычно помещают в Тель-Ханнатоне на западном краю долины Бейт-Нетофа."
    - "Какая именно долина имеется в виду, спорно. Чаще всего в ней видят Вади-эль-Малик, нижнее течение Нахаль-Циппори, которое идёт на запад из котловины Бейт-Нетофа мимо Шфарама к равнине Акко; другие предпочитают Вади-Аббелин (Иблин) чуть севернее, которое лучше подходит Кавулу и границе Асира, или саму долину Бейт-Нетофа; называли и окрестности Хирбет-Шифата, а старое предположение связывало имя с Иотапатой (Йодфатом). Карта хранит этих кандидатов. Ни один город не носит имени долины, никакие раскопки спора не решат, и ни в одном рассказе она не участвует. Сегодня это возделанные вади между арабскими городами Шфарам, Иблин и Кабуль на севере Израиля."
scripture:
  - Josh.19.14
  - Josh.19.27
sources:
