# Overview article (ADR 0007). Mainstream facts only; the valley is disputed and the candidates on the map are given without a choice.
id: valley-of-iphtahel
place: a3e0180
title:
  en: "Valley of Iphtahel"
  ru: "Долина Ифтах-Ел"
  uk: "Долина Іфтах-Ел"
  es: "Valle de Iftah-el"
  pt: "Vale de Iftá-El"
  de: "Jiftach-El-Tal"
  fr: "Vallée de Jiphtach-El"
  pl: "Dolina Jiftach-El"
  it: "Valle di Iftach-El"
  nl: "Dal van Jiftach-El"
  cs: "Jiftachelské údolí"
  sv: "Jiftach-Eldalen"
  nb: "Jiftah-El-dalen"
  tl: "Libis ng Iphta-el"
  da: "Jiftah-Els Dal"
body:
  en:
    - "The valley of Iphtahel, “God opens”, is a landmark on the tribal borders of Lower Galilee and nothing more. Zebulun's border turns “on the north side to Hannathon: and the outgoings thereof are in the valley of Jiphthah-el”, and Asher's border “reacheth to Zebulun, and to the valley of Jiphthah-el toward the north side of Beth-emek, and Neiel, and goeth out to Cabul”. The valley therefore lay where Zebulun and Asher met, between the hills of Lower Galilee and the plain of Acco, near Cabul (Kabul) and Hannathon, usually placed at Tel Hannaton at the western end of the Beth Netofa valley."
    - "Which valley is meant is disputed. One view takes it for the Wadi el-Malik, the lower course of Nahal Zippori, which runs west from the Beth Netofa basin toward the plain of Acco; others prefer the Wadi 'Abbelin (I'billin) a little to the north, which suits Cabul and the Asher border better, or the Beth Netofa valley itself; the area of Khirbet Shifat has also been named, and an older suggestion connected the name with Jotapata (Yodefat). The map keeps these candidates. No town bears the valley's name, no excavation can settle it, and it plays no part in any story. Today these are the farmed wadis between the Arab towns of Shefa-'Amr, I'billin and Kabul in northern Israel."
  ru:
    - "Долина Ифтах-Ел, «Бог отворяет», — примета на границах колен в Нижней Галилее, и только. Предел Завулона «поворачивает предел от севера к Ханнафону и оканчивается долиною Ифтах-Ел», а предел Асира «примыкает к Завулону и к долине Ифтах-Ел с севера, и входит в пределы Асафы в Беф-Емек и Неиел, и идет у Кавула». Долина, стало быть, лежала там, где сходились Завулон и Асир, между холмами Нижней Галилеи и равниной Акко, близ Кавула (Кабуля) и Ханнафона, который обычно помещают в Тель-Ханнатоне на западном краю долины Бейт-Нетофа."
    - "Какая именно долина имеется в виду, спорно. По одному мнению, это Вади-эль-Малик, нижнее течение Нахаль-Циппори, которое идёт на запад из котловины Бейт-Нетофа к равнине Акко; другие предпочитают Вади-Аббелин (Иблин) чуть севернее, которое лучше подходит Кавулу и границе Асира, или саму долину Бейт-Нетофа; называли и окрестности Хирбет-Шифата, а старое предположение связывало имя с Иотапатой (Йодфатом). Карта хранит этих кандидатов. Ни один город не носит имени долины, никакие раскопки спора не решат, и ни в одном рассказе она не участвует. Сегодня это возделанные вади между арабскими городами Шфарам, Иблин и Кабуль на севере Израиля."
  uk:
    - "Долина Іфтах-Ел, «Бог відчиняє», — лише орієнтир на племінних межах Нижньої Галілеї. Межа Завулона повертає «від півночі на Ханнатон, а кінчається в Іфтах-Ел долинї», а межа Асіра «торкається до Зебулона та до Іфтах-Ел долини на півночі, та до Бет-Емек і Неіел, і йде на Кабул з лївого боку». Отже, долина лежала там, де сходилися Завулон і Асір, між пагорбами Нижньої Галілеї та рівниною Акко, поблизу Кабула (Кабул) і Ханнатона, який зазвичай ставлять у Тель-Ханнатоні на західному краю долини Бейт-Нетофа."
    - "Яку долину мають на увазі, спірно. Одна думка вважає її Вади-ель-Малік, нижньою течією Нахаль-Ціппорі, що тече на захід від улоговини Бейт-Нетофа до рівнини Акко; інші віддають перевагу Вади-Аббелін (Ібілін) трохи північніше, що краще пасує до Кабула та межі Асіра, або самій долині Бейт-Нетофа; називали також район Хірбет-Шифата, а старіша пропозиція пов’язувала назву з Йотапатою (Йодефат). Мапа зберігає цих кандидатів. Жодне місто не носить назви долини, жодні розкопки не можуть це вирішити, і вона не відіграє ролі в жодній розповіді. Нині це оброблювані вади між арабськими містами Шефарам, Ібілін і Кабул на півночі Ізраїлю."
  es:
    - "El valle de Iftah-el, «Dios abre», es un hito de las fronteras tribales de la Baja Galilea y nada más. La frontera de Zabulón «torna este término al norte á Hanatón, viniendo á salir al valle de Iphtael», y la de Aser «llega á Zabulón, y al valle de Iphtael al norte, á Beth-emec, y á Nehiel, y sale á Cabul á la izquierda». El valle se hallaba, pues, donde Zabulón y Aser se encontraban, entre las colinas de la Baja Galilea y la llanura de Aco, cerca de Cabul (Kabul) y Hanatón, que suele situarse en Tel Hannaton, en el extremo occidental del valle de Bet Netofa."
    - "Se discute qué valle se significa. Una opinión lo toma por el Wadi el-Malik, el curso bajo del Nahal Zippori, que corre hacia el oeste desde la cuenca de Bet Netofa hacia la llanura de Aco; otros prefieren el Wadi 'Abbelin (I'billin), algo más al norte, que encaja mejor con Cabul y la frontera de Aser, o el propio valle de Bet Netofa; también se ha nombrado la zona de Khirbet Shifat, y una sugerencia más antigua relacionaba el nombre con Jotapata (Yodefat). El mapa conserva estos candidatos. Ninguna ciudad lleva el nombre del valle, ninguna excavación puede resolverlo y no desempeña papel en ningún relato. Hoy son los wadis cultivados entre las ciudades árabes de Shefa-'Amr, I'billin y Kabul, en el norte de Israel."
  pt:
    - "O vale de Iftá-El, “Deus abre”, é um marco das fronteiras tribais da Baixa Galileia e nada mais. A fronteira de Zebulom contorna “pelo norte até Hanatom; e terminava no vale de Iftá-El”, e a de Aser “chegava a Zebulom e ao vale de Iftá-El, ao norte, para Bete-Emeque e Neiel. Saía para Cabul”. O vale ficava, portanto, onde Zebulom e Aser se encontravam, entre as colinas da Baixa Galileia e a planície de Aco, perto de Cabul (Kabul) e Hanatom, geralmente situada em Tel Hannaton, na extremidade ocidental do vale de Beth Netofa."
    - "Qual vale se tem em vista é discutido. Uma visão o toma pelo Wadi el-Malik, o curso inferior do Nahal Zippori, que corre para oeste da bacia de Beth Netofa rumo à planície de Aco; outros preferem o Wadi 'Abbelin (I'billin), um pouco ao norte, que se ajusta melhor a Cabul e à fronteira de Aser, ou o próprio vale de Beth Netofa; a área de Khirbet Shifat também foi nomeada, e uma sugestão mais antiga ligou o nome a Jotapata (Yodefat). O mapa conserva esses candidatos. Nenhuma cidade leva o nome do vale, nenhuma escavação pode resolvê-lo, e ele não tem papel em nenhuma história. Hoje são os uádis cultivados entre as cidades árabes de Shefa-'Amr, I'billin e Kabul, no norte de Israel."
  de:
    - "Das Jiftach-El-Tal, „Gott öffnet“, ist ein Orientierungspunkt an den Stammesgrenzen Untergaliläas und nichts weiter. Sebuluns Grenze lenkt sich „mitternachtwärts gen Hannathon und endet im Tal Jephthah-El“, und Assers Grenze „stößt an Sebulon und an das Tal Jephthah-El mitternachtwärts, Beth-Emek, Negiel und kommt hinaus gen Kabul zur Linken“. Das Tal lag also dort, wo Sebulon und Asser zusammentrafen, zwischen den Hügeln Untergaliläas und der Ebene von Akko, nahe Kabul und Hannaton, meist bei Tel Hannaton am Westende des Beth-Netofa-Tals angesetzt."
    - "Welches Tal gemeint ist, ist umstritten. Eine Ansicht hält es für das Wadi el-Malik, den Unterlauf des Nahal Zippori, der vom Beth-Netofa-Becken nach Westen zur Ebene von Akko fließt; andere bevorzugen das etwas nördlichere Wadi 'Abbelin (I'billin), das besser zu Kabul und zur Grenze Assers passt, oder das Beth-Netofa-Tal selbst; auch die Gegend von Khirbet Shifat wurde genannt, und ein älterer Vorschlag verband den Namen mit Jotapata (Jodefat). Die Karte behält diese Kandidaten. Keine Stadt trägt den Namen des Tals, keine Ausgrabung kann es entscheiden, und es spielt in keiner Geschichte eine Rolle. Heute sind es die bewirtschafteten Wadis zwischen den arabischen Städten Shefa-'Amr, I'billin und Kabul im Norden Israels."
  fr:
    - "La vallée de Jiphtach-El, « Dieu ouvre », est un repère des frontières tribales de la Basse Galilée et rien de plus. La frontière de Zabulon tourne « du côté du nord vers Hannathon, et aboutissait à la vallée de Jiphthach-El », et celle d’Aser « atteignait Zabulon et la vallée de Jiphthach-El au nord de Beth-Émek et de Neïel, et se prolongeait vers Cabul ». La vallée se trouvait donc là où Zabulon et Aser se rejoignaient, entre les collines de la Basse Galilée et la plaine d’Acco, près de Cabul (Kabul) et de Hannathon, d’ordinaire placée à Tel Hannaton à l’extrémité ouest de la vallée de Beth Netofa."
    - "La vallée visée est discutée. Une opinion y voit le Wadi el-Malik, cours inférieur du Nahal Zippori, qui court vers l’ouest depuis le bassin de Beth Netofa vers la plaine d’Acco ; d’autres préfèrent le Wadi ’Abbelin (I’billin), un peu plus au nord, qui convient mieux à Cabul et à la frontière d’Aser, ou la vallée de Beth Netofa elle-même ; la région de Khirbet Shifat a aussi été nommée, et une ancienne suggestion rattachait le nom à Jotapata (Yodefat). La carte garde ces candidats. Aucune ville ne porte le nom de la vallée, aucune fouille ne peut trancher, et elle ne joue aucun rôle dans aucun récit. Ce sont aujourd’hui les oueds cultivés entre les villes arabes de Shefa-’Amr, d’I’billin et de Kabul, dans le nord d’Israël."
  pl:
    - "Dolina Jiftach-El, „Bóg otwiera”, jest punktem orientacyjnym na granicach plemiennych Dolnej Galilei i niczym więcej. Granica Zabulona skręca „od północy ku Hannaton, a kończy się u doliny Jeftael”, a granica Aszera „bieży aż do Zabulon, i do doliny Jeftach El na północy, Betemek i do Nehyjel, wychodząc do Kabul ku lewej stronie”. Dolina leżała więc tam, gdzie spotykały się Zabulon i Aszer, między wzgórzami Dolnej Galilei a równiną Akko, blisko Kabul i Channaton, umieszczanego zwykle w Tel Channaton na zachodnim krańcu doliny Bet Netofa."
    - "Która dolina jest tu na myśli, jest sporne. Jeden pogląd bierze ją za Wadi el-Malik, dolny bieg Nachal Cippori, płynący na zachód z basenu Bet Netofa ku równinie Akko; inni wolą Wadi Abbelin (Ibillin) nieco na północ, które lepiej pasuje do Kabul i granicy Aszera, albo samą dolinę Bet Netofa; wymieniano też okolice Chirbet Szifat, a starsza sugestia łączyła nazwę z Jotapatą (Jodefat). Mapa zachowuje tych kandydatów. Żadne miasto nie nosi nazwy doliny, żadne wykopaliska nie mogą tego rozstrzygnąć, a w żadnej opowieści nie odgrywa roli. Dziś są to uprawiane wadi między arabskimi miastami Szefa-Amr, Ibillin i Kabul w północnym Izraelu."
  it:
    - "La valle di Iftach-El, «Dio apre», è un punto di riferimento sui confini tribali della Bassa Galilea e nulla più. Il confine di Zabulon gira «dal lato di settentrione verso Hannathon, e facea capo alla valle d’Iftah-El», e quello di Aser «giungeva a Zabulon e alla valle di Iftah-El al nord di Beth-Emek e di Neiel, e si prolungava verso Cabul a sinistra». La valle si trovava dunque dove Zabulon e Aser si incontravano, fra le colline della Bassa Galilea e la piana di Acco, presso Cabul (Kabul) e Cannaton, di solito collocata a Tel Hannaton all’estremità occidentale della valle di Bet Netofa."
    - "Quale valle si intenda è discusso. Un’opinione la identifica con il Wadi el-Malik, il corso inferiore del Nahal Zippori, che corre a ovest dal bacino di Bet Netofa verso la piana di Acco; altri preferiscono il Wadi ’Abbelin (I’billin) poco più a nord, che si accorda meglio con Cabul e il confine di Aser, o la valle di Bet Netofa stessa; è stata nominata anche l’area di Khirbet Shifat, e un’antica proposta collegava il nome a Iotapata (Yodefat). La mappa conserva questi candidati. Nessuna città porta il nome della valle, nessuno scavo può risolverlo, ed essa non ha parte in alcun racconto. Oggi sono gli uadi coltivati fra le città arabe di Shefa-’Amr, I’billin e Kabul nel nord di Israele."
  nl:
    - "Het dal van Jiftach-El, “God opent”, is een oriëntatiepunt op de stamgrenzen van Beneden-Galilea en niets meer. De grens van Zebulon keert zich om “tegen het noorden naar Hannathon, en haar uitgangen zijn het dal van Jiftah-El”, en die van Aser “reikt aan Zebulon, en aan het dal Jiftha-El noordwaarts naar Beth-Emek, en Nehiel, en komt uit tot Kabul ter linkerhand”. Het dal lag dus waar Zebulon en Aser samenkwamen, tussen de heuvels van Beneden-Galilea en de vlakte van Akko, bij Kabul en Channaton, gewoonlijk geplaatst op Tel Hannaton aan het westelijke einde van de Beth Netofa-vallei."
    - "Welk dal bedoeld is, wordt betwist. Eén opvatting neemt het voor de Wadi el-Malik, de benedenloop van Nahal Zippori, die vanuit het Beth Netofa-bekken naar het westen loopt richting de vlakte van Akko; anderen geven de voorkeur aan de Wadi ’Abbelin (I’billin) iets noordelijker, die beter bij Kabul en de grens van Aser past, of aan de Beth Netofa-vallei zelf; het gebied van Khirbet Shifat is ook genoemd, en een oudere suggestie verbond de naam met Jotapata (Jodefat). De kaart houdt deze kandidaten. Geen stad draagt de naam van het dal, geen opgraving kan het beslechten, en het speelt geen rol in enig verhaal. Tegenwoordig zijn dit de bebouwde wadi’s tussen de Arabische steden Shefa-’Amr, I’billin en Kabul in het noorden van Israël."
  cs:
    - "Jiftachelské údolí, „Bůh otvírá“, je orientační bod na kmenových hranicích Dolní Galileje a nic víc. Hranice Zebulunova: „Točí se také táž meze od půlnoci do Anaton, a dochází až k údolí Jeftael“, a hranice Ašerova: „… dosahá k losu Zabulonovu, a do údolí Jeftael k půlnoci, a do Betemek a Nehiel, a táhne se do Kábul na levou stranu“. Údolí tedy leželo tam, kde se Zebulun a Ašer stýkaly, mezi pahorky Dolní Galileje a pláni Akko, poblíž Kabulu a Chananonu, obvykle kladeného do Tel Chananon na západním konci údolí Bejt Netofa."
    - "Které údolí se myslí, je sporné. Jeden názor je pokládá za Wádí el-Malik, dolní tok Nachal Cipori, který teče na západ od pánve Bejt Netofa k pláni Akko; jiní dávají přednost Wádí 'Abbelín (I'billin) o něco severněji, které lépe vyhovuje Kabulu a hranici Ašerově, nebo samotnému údolí Bejt Netofa; jmenována byla i oblast Chirbet Šifat a starší návrh spojoval jméno s Jotapatou (Jodefat). Mapa ponechává tyto kandidáty. Žádné město nenese jméno údolí, žádné vykopávky to nerozhodnou a v žádném příběhu nehraje roli. Dnes jsou to obdělávaná vádí mezi arabskými městy Šfar'am, I'billin a Kabul v severním Izraeli."
  sv:
    - "Jiftach-Eldalen, ”Gud öppnar”, är ett landmärke på stamgränserna i Nedre Galileen och inte mer. Sebulons gräns böjer sig ”i norr till Hannaton och gick så ut vid Jifta-Els dal”, och Ashers gräns ”träffade Sebulon och Jifta-Els dal i norr, vidare Bet-Haemek och Negiel och gick så ut till Kabul i norr”. Dalen låg alltså där Sebulon och Asher möttes, mellan Nedre Galileens kullar och Ackoslätten, nära Kabul och Hannaton, vanligen förlagt till Tel Hannaton vid västra änden av Bet Netofa-dalen."
    - "Vilken dal som avses är omstritt. En uppfattning tar den för Wadi el-Malik, den nedre delen av Nahal Zippori, som rinner västerut från Bet Netofa-bäckenet mot Ackoslätten; andra föredrar Wadi 'Abbelin (I'billin) något längre norrut, vilket passar Kabul och Ashers gräns bättre, eller själva Bet Netofa-dalen; trakten kring Khirbet Shifat har också nämnts, och ett äldre förslag förband namnet med Jotapata (Yodefat). Kartan behåller dessa kandidater. Ingen stad bär dalens namn, ingen utgrävning kan avgöra saken, och den spelar ingen roll i någon berättelse. I dag är detta de odlade wadierna mellan de arabiska städerna Shefa-'Amr, I'billin och Kabul i norra Israel."
  nb:
    - "Jiftah-El-dalen, «Gud åpner», er et landemerke på stammegrensene i Nedre Galilea og ikke noe mer. Sebulons grense svinger «omkring dette sted nordover til Hannaton og endte i Jiftah-El-dalen», og Asjers grense «støtte til Sebulon og Jiftah-El-dalen, nordenfor Bet-Haemek og Ne'iel, og gikk så frem til Kabul i nord». Dalen lå derfor der Sebulon og Asjer møttes, mellom åsene i Nedre Galilea og Akko-sletten, nær Kabul og Hannaton, vanligvis plassert ved Tel Hannaton i den vestlige enden av Bet Netofa-dalen."
    - "Hvilken dal som menes, er omdiskutert. Ett syn tar den for Wadi el-Malik, nedre løp av Nahal Zippori, som løper vestover fra Bet Netofa-bassenget mot Akko-sletten; andre foretrekker Wadi 'Abbelin (I'billin) litt lenger nord, som passer bedre med Kabul og Asjers grense, eller selve Bet Netofa-dalen; området rundt Khirbet Shifat er også blitt nevnt, og et eldre forslag knyttet navnet til Jotapata (Yodefat). Kartet beholder disse kandidatene. Ingen by bærer dalens navn, ingen utgravning kan avgjøre saken, og den spiller ingen rolle i noen fortelling. I dag er dette de dyrkede wadiene mellom de arabiske byene Shefa-'Amr, I'billin og Kabul i Nord-Israel."
  tl:
    - "Ang libis ng Iphta-el, “Ang Diyos ay nagbubukas”, ay palatandaan sa mga hangganan ng mga lipi sa Mababang Galilea at wala nang iba. Ang hangganan ng Zabulon ay “paliko sa hilagaan na patungo sa Hanaton: at ang labasan niyaon ay sa libis ng Iphta-el”, at ang kay Aser ay “abot sa Zabulon, at sa libis ng Iphta-el na dakong hilagaan sa Beth-emec at Nehiel; at palabas sa Cabul”. Kaya ang libis ay nasa pagtatagpo ng Zabulon at Aser, sa pagitan ng mga burol ng Mababang Galilea at kapatagan ng Acho, malapit sa Cabul (Kabul) at Hanaton, na karaniwang inilalagay sa Tel Hannaton sa kanlurang dulo ng libis ng Beth Netofa."
    - "Pinagtatalunan kung aling libis ang tinutukoy. Itinuturing ito ng isang pananaw na Wadi el-Malik, ang ibabang daloy ng Nahal Zippori, na tumatakbo pakanluran mula sa palanggana ng Beth Netofa patungo sa kapatagan ng Acho; mas gusto ng iba ang Wadi 'Abbelin (I'billin) nang kaunti sa hilaga, na mas bagay sa Cabul at hangganan ni Aser, o ang libis ng Beth Netofa mismo; pinangalanan din ang paligid ng Khirbet Shifat, at iniugnay ng mas lumang mungkahi ang pangalan sa Jotapata (Yodefat). Pinananatili ng mapa ang mga kandidatong ito. Walang bayang may pangalan ng libis, walang paghuhukay na makapagpapasya, at walang bahagi ito sa anumang kuwento. Ngayon ito ang mga sinasakang wadi sa pagitan ng mga bayang Arabe ng Shefa-'Amr, I'billin at Kabul sa hilagang Israel."
  da:
    - "Jiftah-Els dal, »Gud åbner«, er et landemærke på stammegrænserne i Nedre Galilæa og intet mere. Zebulons grænse drejer »mod Nord til Hannathon; og dets Udgang er i Jiftha-Els Dal«, og Asers grænse »støder op til Sebulon og til Jeftha-Els Dal, Nord om Beth-Emek og Negiel, og gaar ud til Kabul«. Dalen lå altså, hvor Zebulon og Aser mødtes, mellem Nedre Galilæas bjerge og Akko-sletten, nær Kabul og Hannaton, sædvanligvis placeret ved Tel Hannaton i den vestlige ende af Beth Netofa-dalen."
    - "Hvilken dal der menes, er omstridt. Ét synspunkt tager den for Wadi el-Malik, den nedre del af Nahal Zippori, der løber mod vest fra Beth Netofa-bassinet mod Akko-sletten; andre foretrækker Wadi 'Abbelin (I'billin) lidt mod nord, som passer bedre til Kabul og Asers grænse, eller Beth Netofa-dalen selv; området omkring Khirbet Shifat er også blevet nævnt, og et ældre forslag knyttede navnet til Jotapata (Yodefat). Kortet beholder disse kandidater. Ingen by bærer dalens navn, ingen udgravning kan afgøre det, og den spiller ingen rolle i nogen historie. I dag er det de dyrkede wadier mellem de arabiske byer Shefa-'Amr, I'billin og Kabul i det nordlige Israel."
scripture:
  - Josh.19.14
  - Josh.19.27
sources:
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (2nd ed., 1979)"
  - "Z. Kallai, Historical Geography of the Bible: The Tribal Territories of Israel (1986)"
  - "A. F. Rainey and R. S. Notley, The Sacred Bridge: Carta's Atlas of the Biblical World (2006)"
  - "'Iphtahel', in D. N. Freedman (ed.), The Anchor Bible Dictionary (1992)"
