# Overview article (ADR 0007). Mainstream facts only; the Synodal numbering of 1 Samuel 24 differs by one verse from the English.
id: engedi
place: a51df0e
title:
  en: "Engedi"
  ru: "Ен-Гадди"
  uk: "Ен-Геді"
  es: "Engadi"
  pt: "En-Gedi"
  de: "En-Gedi"
  fr: "En-Guédi"
  it: "En-Ghedi"
  pl: "En-Gedi"
  nl: "En-Gedi"
  cs: "Én-gedi"
  sv: "En-Gedi"
