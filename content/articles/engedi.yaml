# Overview article (ADR 0007). Mainstream facts only; the Synodal numbering of 1 Samuel 24 differs by one verse from the English.
id: engedi
place: a51df0e
title:
  en: "Engedi"
  ru: "Ен-Гадди"
  uk: "Ен-Геді"
  es: "Engadi"
  pt: "En-Gedi"
  de: "En-Gedi"
  fr: "En-Guédi"
body:
  en:
    - "Engedi, “the spring of the kid”, is the oasis on the western shore of the Dead Sea, where a spring and two canyons, Nahal David and Nahal Arugot, come down through cliffs 300 m high to a fan of palms and gardens. It was Hazazon-tamar, where Chedorlaomer smote the Amorites, and one of the six towns of Judah in the wilderness. David, fleeing Saul, “dwelt in strong holds at En-gedi”; Saul came with three thousand men “upon the rocks of the wild goats”, entered a cave to relieve himself, and David, hidden in its depths, cut off the skirt of his robe and let him go. In Jehoshaphat's reign Moabites and Ammonites came up by Engedi against Judah. The Song of Songs knows its vineyards, “a cluster of camphire in the vineyards of En-gedi”, and Ezekiel foresaw fishermen on the healed sea “from En-gedi even unto En-eglaim”."
    - "The ibex and the hyrax still live there, and archaeology has found the rest. Above the spring stands a Chalcolithic temple of the fourth millennium BC. Tel Goren by the Arugot was a royal estate of the last kings of Judah, with vats for the perfume made from the balsam that grew only here and at Jericho; Pliny ranked Engedi second to Jerusalem for fertility and palms, and Josephus praised its balsam. The Sicarii raided it from Masada in AD 68 and killed seven hundred. Letters of Bar Kokhba to the men of Engedi, and the archive of Babatha, were found in the Cave of Letters a few kilometres south. The Roman and Byzantine village had a synagogue whose mosaic floor, uncovered in 1970, lists the signs of the zodiac and curses anyone who reveals “the secret of the town”, perhaps the balsam recipe."
    - "The site was deserted after the Arab conquest. Kibbutz Ein Gedi was founded in 1956, and the oasis is now a nature reserve with a botanical garden and a field school; the Dead Sea has fallen so far that the shore lies far from the spring, and sinkholes have closed parts of the old road."
  ru:
    - "Ен-Гадди, «источник козлёнка», — оазис на западном берегу Мёртвого моря, где источник и два каньона, Нахаль-Давид и Нахаль-Аругот, спускаются через скалы высотой 300 м к вееру пальм и садов. Это был Хацацон-Фамар, где Кедорлаомер поразил Аморреев, и один из шести городов Иуды в пустыне. Давид, бежавший от Саула, «жил в безопасных местах Ен-Гадди»; Саул пришёл с тремя тысячами людей искать его «по горам, где живут серны», зашёл для нужды в пещеру, а Давид, скрытый в её глубине, отрезал край его одежды и отпустил его. В царствование Иосафата Моавитяне и Аммонитяне пришли через Ен-Гадди на Иудею. Песнь песней знает его виноградники: «Как кисть кипера, возлюбленный мой у меня в виноградниках Енгедских», а Иезекииль предвидел рыболовов на исцелённом море «от Ен-Гадди до Эглаима»."
    - "Горные козлы и даманы живут здесь до сих пор, а остальное нашла археология. Над источником стоит халколитический храм IV тысячелетия до н. э. Тель-Горен у Аругота был царским поместьем последних царей Иудеи с чанами для благовония из бальзама, росшего только здесь и в Иерихоне; Плиний ставил Ен-Гадди вторым после Иерусалима по плодородию и пальмам, а Иосиф Флавий хвалил его бальзам. Сикарии напали на него с Масады в 68 г. н. э. и убили семьсот человек. Письма Бар-Кохбы к жителям Ен-Гадди и архив Бабаты нашли в Пещере писем в нескольких километрах южнее. У римско-византийского селения была синагога, чей мозаичный пол, открытый в 1970 году, перечисляет знаки зодиака и проклинает всякого, кто откроет «тайну города», — быть может, рецепт бальзама."
    - "После арабского завоевания место опустело. Кибуц Эйн-Геди основан в 1956 году, а оазис теперь заповедник с ботаническим садом и полевой школой; Мёртвое море отступило так далеко, что берег лежит вдали от источника, а провалы закрыли части старой дороги."
  uk:
    - "Ен-Геді, «джерело козеняти», — оазис на західному березі Мертвого моря, де джерело і два каньйони, Нахаль-Давид і Нахаль-Аругот, спускаються крізь скелі заввишки 300 м до віяла пальм і садів. Це був Хацацон-Тамар, де Кедорлаомер розбив аморіїв, і одне з шести міст Юди в пустелі. Давид, тікаючи від Саула, «перебував в безпечних місцях в Ен-Гадди»; Саул прийшов із трьома тисячами людей «по горах, куди дикі кози можуть ходити», зайшов до печери справити природну потребу, а Давид, захований у її глибині, відрізав край його плаща й відпустив його. За Йосафата моавитяни й аммонітяни піднялися проти Юди через Ен-Геді. Пісня над піснями знає його виноградники: «мов гроно кипрове в виноградниках Енгадських», а Єзекіїль бачив рибалок на оздоровленому морі «від Енгадди до Еглайму»."
    - "Нубійський козел і дамани й досі живуть там, а решту знайшла археологія. Над джерелом стоїть халколітичний храм IV тис. до н. е. Телль-Горен біля Аругот був царським маєтком останніх царів Юди, з чанами для парфумів із бальзаму, що ріс лише тут і в Єрихоні; Пліній ставив Ен-Геді на друге місце після Єрусалима за родючістю та пальмами, а Йосиф Флавій вихваляв його бальзам. Сикарії напали на нього з Масади в 68 р. н. е. і вбили сімсот. Листи Бар-Кохби до жителів Ен-Геді та архів Бабати знайдено в Печері Листів за кілька кілометрів на південь. Римське й візантійське село мало синагогу, мозаїчна підлога якої, відкрита в 1970 р., перелічує знаки зодіаку й проклинає всякого, хто виявить «таємницю міста», можливо, рецепт бальзаму."
    - "Місце було покинуте після арабського завоювання. Кібуц Ейн-Геді було засновано в 1956 р., і оазис нині є природним заповідником з ботанічним садом і польовою школою; Мертве море відступило так далеко, що берег лежить далеко від джерела, а провалля закрили частини старої дороги."
  es:
    - "Engadi, «la fuente del cabrito», es el oasis de la orilla occidental del mar Muerto, donde una fuente y dos cañones, el Nahal David y el Nahal Arugot, bajan entre acantilados de 300 m de altura hasta un abanico de palmeras y huertos. Era Hazezon-tamar, donde Quedorlaomer hirió a los amorreos, y una de las seis ciudades de Judá en el desierto. David, huyendo de Saúl, «habitó en los parajes fuertes en Engaddi»; Saúl vino con tres mil hombres «por las cumbres de los peñascos de las cabras monteses», entró en una cueva a cubrir sus pies, y David, escondido en su fondo, cortó la orilla de su manto y lo dejó ir. En el reinado de Josafat, moabitas y amonitas subieron por Engadi contra Judá. El Cantar de los Cantares conoce sus viñas, «Racimo de copher en las viñas de Engadi es para mí mi amado», y Ezequiel previó pescadores en el mar sanado «desde En-gadi hasta En-eglaim»."
    - "El íbice y el damán aún viven allí, y la arqueología ha hallado el resto. Sobre la fuente se alza un templo calcolítico del cuarto milenio a. C. Tel Goren, junto al Arugot, fue una finca real de los últimos reyes de Judá, con cubas para el perfume hecho con el bálsamo que crecía solo aquí y en Jericó; Plinio puso a Engadi en segundo lugar tras Jerusalén por su fertilidad y sus palmeras, y Josefo elogió su bálsamo. Los sicarios la asaltaron desde Masada en el 68 d. C. y mataron a setecientos. Cartas de Bar Kojba a los hombres de Engadi, y el archivo de Babata, se hallaron en la Cueva de las Cartas, a unos kilómetros al sur. La aldea romana y bizantina tenía una sinagoga cuyo mosaico, descubierto en 1970, enumera los signos del zodiaco y maldice a quien revele «el secreto de la ciudad», quizá la receta del bálsamo."
    - "El sitio fue abandonado tras la conquista árabe. El kibutz Ein Gedi se fundó en 1956, y el oasis es hoy una reserva natural con un jardín botánico y una escuela de campo; el mar Muerto ha retrocedido tanto que la orilla queda lejos de la fuente, y los sumideros han cerrado partes del antiguo camino."
  pt:
    - "En-Gedi, “a fonte do cabrito”, é o oásis na margem ocidental do Mar Morto, onde uma fonte e dois desfiladeiros, Nahal David e Nahal Arugot, descem entre penhascos de 300 m de altura até um leque de palmeiras e jardins. Era Hazazom-Tamar, onde Quedorlaomer derrotou os amorreus, e uma das seis cidades de Judá no deserto. Davi, fugindo de Saul, “habitou nas fortalezas de En-Gedi”; Saul veio com três mil homens “perto dos rochedos das cabras monteses”, entrou numa caverna para aliviar-se, e Davi, escondido no fundo dela, cortou a ponta do seu manto e o deixou ir. No reinado de Josafá, moabitas e amonitas subiram por En-Gedi contra Judá. O Cântico dos Cânticos conhece suas vinhas: “um cacho de flores de hena das vinhas de En-Gedi”, e Ezequiel previu pescadores no mar curado “Desde En-Gedi até En-Eglaim”."
    - "O íbex e o híraz ainda vivem ali, e a arqueologia achou o resto. Acima da fonte ergue-se um templo calcolítico do quarto milênio a.C. Tel Goren, junto ao Arugot, era uma propriedade real dos últimos reis de Judá, com tinas para o perfume feito do bálsamo que só crescia aqui e em Jericó; Plínio classificava En-Gedi em segundo lugar depois de Jerusalém em fertilidade e palmeiras, e Josefo louvou seu bálsamo. Os sicários a atacaram a partir de Massada em 68 d.C. e mataram setecentos. Cartas de Bar Kokhba aos homens de En-Gedi e o arquivo de Babata foram achados na Caverna das Cartas, a poucos quilômetros ao sul. A aldeia romana e bizantina tinha uma sinagoga cujo piso de mosaico, descoberto em 1970, lista os signos do zodíaco e amaldiçoa quem revelar “o segredo da cidade”, talvez a receita do bálsamo."
    - "O local foi abandonado depois da conquista árabe. O Kibutz Ein Gedi foi fundado em 1956, e o oásis é hoje uma reserva natural com jardim botânico e escola de campo; o Mar Morto baixou tanto que a margem fica longe da fonte, e dolinas fecharam trechos da antiga estrada."
  de:
    - "En-Gedi, „Quelle des Böckleins“, ist die Oase am Westufer des Toten Meeres, wo eine Quelle und zwei Schluchten, Nahal David und Nahal Arugot, durch 300 m hohe Felswände zu einem Fächer aus Palmen und Gärten herabkommen. Es war Hazezon-Tamar, wo Kedorlaomer die Amoriter schlug, und eine der sechs Städte Judas in der Wüste. David, der vor Saul floh, „barg sich auf den Berghöhen zu Engedi“; Saul kam mit dreitausend Mann „auf den Felsen der Gemsen“, betrat eine Höhle, um sich zu erleichtern, und David, in ihrer Tiefe verborgen, schnitt den Zipfel seines Mantels ab und ließ ihn gehen. In der Regierungszeit Josaphats zogen Moabiter und Ammoniter über En-Gedi gegen Juda herauf. Das Hohelied kennt seine Weinberge, „eine Traube von Zyperblumen in den Weinbergen zu Engedi“, und Hesekiel sah Fischer am gesundeten Meer voraus: „von Engedi bis zu En-Eglaim“."
    - "Steinbock und Klippschliefer leben dort noch, und die Archäologie hat den Rest gefunden. Oberhalb der Quelle steht ein kupfersteinzeitlicher Tempel des 4. Jahrtausends v. Chr. Tel Goren am Arugot war ein königliches Gut der letzten Könige Judas, mit Becken für das Parfüm aus Balsam, der nur hier und in Jericho wuchs; Plinius setzte En-Gedi bei Fruchtbarkeit und Palmen an zweite Stelle nach Jerusalem, und Josephus pries seinen Balsam. Die Sikarier überfielen es 68 n. Chr. von Masada aus und töteten siebenhundert. Briefe Bar Kochbas an die Männer von En-Gedi und das Archiv der Babatha fand man in der Höhle der Briefe einige Kilometer südlich. Das römische und byzantinische Dorf hatte eine Synagoge, deren 1970 freigelegter Mosaikboden die Tierkreiszeichen verzeichnet und jeden verflucht, der „das Geheimnis der Stadt“ verrät, vielleicht das Balsamrezept."
    - "Der Ort wurde nach der arabischen Eroberung verlassen. Der Kibbuz Ein Gedi wurde 1956 gegründet, und die Oase ist heute ein Naturschutzgebiet mit botanischem Garten und Feldschule; das Tote Meer ist so weit gesunken, dass das Ufer weit von der Quelle entfernt liegt, und Erdfälle haben Teile der alten Straße gesperrt."
  fr:
    - "En-Guédi, « la source du chevreau », est l’oasis sur la rive occidentale de la mer Morte, où une source et deux canyons, le Nahal David et le Nahal Arugot, descendent entre des falaises hautes de 300 m vers un éventail de palmiers et jardins. C’était Hatsatson-Thamar, où Kedorlaomer battit les Amoréens, et l’une des six villes de Juda dans le désert. David, fuyant Saül, « monta vers les lieux forts d’En-Guédi, où il demeura » ; Saül vint avec trois mille hommes « jusque sur les rochers des boucs sauvages », entra dans une grotte pour se soulager, et David, caché au fond, coupa un pan de son manteau et l’épargna. Sous Josaphat, Moabites et Ammonites montèrent par En-Guédi contre Juda. Le Cantique des cantiques connaît ses vignes, « une grappe de troëne des vignes d’En-Guédi », et Ézéchiel voyait des pêcheurs sur la mer guérie « depuis En-Guédi jusqu’à En-Églaïm »."
    - "Le bouquetin et le daman y vivent encore ; l’archéologie a trouvé le reste. Au-dessus de la source se dresse un temple chalcolithique du IVe millénaire av. J.-C. Tel Goren, près des Arugot, était un domaine royal des derniers rois de Juda, avec des cuves pour le parfum de baume, qui ne poussait qu’ici et à Jéricho ; Pline classait En-Guédi seconde après Jérusalem pour la fertilité et les palmiers, et Josèphe vantait son baume. Les sicaires la pillèrent depuis Massada en 68 apr. J.-C. et tuèrent sept cents personnes. Des lettres de Bar Kokhba aux hommes d’En-Guédi, et les archives de Babatha, furent trouvées dans la grotte des Lettres, à quelques kilomètres au sud. Le village romain et byzantin avait une synagogue dont la mosaïque, découverte en 1970, énumère les signes du zodiaque et maudit quiconque révèle « le secret de la ville », peut-être la recette du baume."
    - "Le site fut abandonné après la conquête arabe. Le kibboutz Ein Gedi fut fondé en 1956, et l’oasis est aujourd’hui une réserve naturelle avec un jardin botanique et une école de terrain ; la mer Morte a tant reculé que le rivage est loin de la source, et des dolines ont fermé des tronçons de l’ancienne route."
