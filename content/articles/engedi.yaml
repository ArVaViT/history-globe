body:
  en:
    - "Engedi, “the spring of the kid”, is the oasis on the western shore of the Dead Sea, where a spring and two canyons, Nahal David and Nahal Arugot, come down through the cliffs to a fan of palms and gardens. It was Hazazon-tamar, where Chedorlaomer smote the Amorites, and one of the six towns of Judah in the wilderness. David, fleeing Saul, “dwelt in strong holds at En-gedi”; Saul came with three thousand men “upon the rocks of the wild goats”, entered a cave to relieve himself, and David, hidden in its depths, cut off the skirt of his robe and let him go. In Jehoshaphat's reign Moabites and Ammonites came up by Engedi against Judah. The Song of Songs knows its vineyards, “a cluster of camphire in the vineyards of En-gedi”, and Ezekiel foresaw fishermen on the healed sea “from En-gedi even unto En-eglaim”."
    - "The ibex and the hyrax still live there, and archaeology has found the rest. Above the spring stands a Chalcolithic temple of the fourth millennium BC. Tel Goren was a settlement of the last century of the kingdom of Judah, whose excavators took its vats for a perfume industry, perhaps using the balsam that grew here and at Jericho; Pliny ranked Engedi second to Jerusalem for fertility and palms, and Josephus praised its balsam. The Sicarii raided it from Masada in AD 68 and killed seven hundred. Letters of Bar Kokhba to the men of Engedi, and the archive of Babatha, were found in the Cave of Letters a few kilometres south. The Roman and Byzantine village had a synagogue whose mosaic floor, uncovered in 1970, lists the signs of the zodiac and curses anyone who reveals “the secret of the town”, perhaps the balsam recipe."
    - "The Jewish village burned down in the sixth or early seventh century, and after a short-lived Mamluk settlement the site was deserted. Kibbutz Ein Gedi grew from a Nahal army outpost set up in 1953, and the oasis is now a nature reserve with a botanical garden and a field school; the Dead Sea has fallen so far that the shore lies far from the spring, and sinkholes have closed parts of the old road."
  ru:
    - "Ен-Гадди, «источник козлёнка», — оазис на западном берегу Мёртвого моря, где источник и два каньона, Нахаль-Давид и Нахаль-Аругот, спускаются через скалы к вееру пальм и садов. Это был Хацацон-Фамар, где Кедорлаомер поразил Аморреев, и один из шести городов Иуды в пустыне. Давид, бежавший от Саула, «жил в безопасных местах Ен-Гадди»; Саул пришёл с тремя тысячами людей искать его «по горам, где живут серны», зашёл для нужды в пещеру, а Давид, скрытый в её глубине, отрезал край его одежды и отпустил его. В царствование Иосафата Моавитяне и Аммонитяне пришли через Ен-Гадди на Иудею. Песнь песней знает его виноградники: «Как кисть кипера, возлюбленный мой у меня в виноградниках Енгедских», а Иезекииль предвидел рыболовов на исцелённом море «от Ен-Гадди до Эглаима»."
    - "Горные козлы и даманы живут здесь до сих пор, а остальное нашла археология. Над источником стоит халколитический храм IV тысячелетия до н. э. Тель-Горен был поселением последнего столетия Иудейского царства, и раскопавшие его археологи сочли его чаны частью производства благовоний, возможно из бальзама, росшего здесь и в Иерихоне; Плиний ставил Ен-Гадди вторым после Иерусалима по плодородию и пальмам, а Иосиф Флавий хвалил его бальзам. Сикарии напали на него с Масады в 68 г. н. э. и убили семьсот человек. Письма Бар-Кохбы к жителям Ен-Гадди и архив Бабаты нашли в Пещере писем в нескольких километрах южнее. У римско-византийского селения была синагога, чей мозаичный пол, открытый в 1970 году, перечисляет знаки зодиака и проклинает всякого, кто откроет «тайну города», — быть может, рецепт бальзама."
    - "Еврейское селение сгорело в VI или начале VII века, а после недолгого мамлюкского поселения место опустело. Кибуц Эйн-Геди вырос из армейского форпоста «Нахаль», устроенного в 1953 году, а оазис теперь заповедник с ботаническим садом и полевой школой; Мёртвое море отступило так далеко, что берег лежит вдали от источника, а провалы закрыли части старой дороги."
  uk:
    - "Ен-Геді, «джерело козеняти», — оазис на західному березі Мертвого моря, де джерело і два каньйони, Нахаль-Давид і Нахаль-Аругот, спускаються крізь скелі до віяла пальм і садів. Це був Хацацон-Тамар, де Кедорлаомер розбив аморіїв, і одне з шести міст Юди в пустелі. Давид, тікаючи від Саула, «перебував в безпечних місцях в Ен-Гадди»; Саул прийшов із трьома тисячами людей «по горах, куди дикі кози можуть ходити», зайшов до печери справити природну потребу, а Давид, захований у її глибині, відрізав край його плаща й відпустив його. За Йосафата моавитяни й аммонітяни піднялися проти Юди через Ен-Геді. Пісня над піснями знає його виноградники: «мов гроно кипрове в виноградниках Енгадських», а Єзекіїль бачив рибалок на оздоровленому морі «від Енгадди до Еглайму»."
    - "Нубійський козел і дамани й досі живуть там, а решту знайшла археологія. Над джерелом стоїть халколітичний храм IV тис. до н. е. Телль-Горен був поселенням останнього століття Юдейського царства, і археологи, що його розкопали, вважали тамтешні чани частиною парфумного виробництва, можливо з бальзаму, що ріс тут і в Єрихоні; Пліній ставив Ен-Геді на друге місце після Єрусалима за родючістю та пальмами, а Йосиф Флавій вихваляв його бальзам. Сикарії напали на нього з Масади в 68 р. н. е. і вбили сімсот. Листи Бар-Кохби до жителів Ен-Геді та архів Бабати знайдено в Печері Листів за кілька кілометрів на південь. Римське й візантійське село мало синагогу, мозаїчна підлога якої, відкрита в 1970 р., перелічує знаки зодіаку й проклинає всякого, хто виявить «таємницю міста», можливо, рецепт бальзаму."
    - "Єврейське село згоріло в VI або на початку VII ст., а після недовгого мамлюцького поселення місце було покинуте. Кібуц Ейн-Геді виріс з армійського форпосту «Нахаль», заснованого в 1953 р., і оазис нині є природним заповідником з ботанічним садом і польовою школою; Мертве море відступило так далеко, що берег лежить далеко від джерела, а провалля закрили частини старої дороги."
  es:
    - "Engadi, «la fuente del cabrito», es el oasis de la orilla occidental del mar Muerto, donde una fuente y dos cañones, el Nahal David y el Nahal Arugot, bajan entre los acantilados hasta un abanico de palmeras y huertos. Era Hazezon-tamar, donde Quedorlaomer hirió a los amorreos, y una de las seis ciudades de Judá en el desierto. David, huyendo de Saúl, «habitó en los parajes fuertes en Engaddi»; Saúl vino con tres mil hombres «por las cumbres de los peñascos de las cabras monteses», entró en una cueva a cubrir sus pies, y David, escondido en su fondo, cortó la orilla de su manto y lo dejó ir. En el reinado de Josafat, moabitas y amonitas subieron por Engadi contra Judá. El Cantar de los Cantares conoce sus viñas, «Racimo de copher en las viñas de Engadi es para mí mi amado», y Ezequiel previó pescadores en el mar sanado «desde En-gadi hasta En-eglaim»."
    - "El íbice y el damán aún viven allí, y la arqueología ha hallado el resto. Sobre la fuente se alza un templo calcolítico del cuarto milenio a. C. Tel Goren fue un asentamiento del último siglo del reino de Judá, cuyos excavadores tomaron sus cubas por una industria de perfume, quizá con el bálsamo que crecía aquí y en Jericó; Plinio puso a Engadi en segundo lugar tras Jerusalén por su fertilidad y sus palmeras, y Josefo elogió su bálsamo. Los sicarios la asaltaron desde Masada en el 68 d. C. y mataron a setecientos. Cartas de Bar Kojba a los hombres de Engadi, y el archivo de Babata, se hallaron en la Cueva de las Cartas, a unos kilómetros al sur. La aldea romana y bizantina tenía una sinagoga cuyo mosaico, descubierto en 1970, enumera los signos del zodiaco y maldice a quien revele «el secreto de la ciudad», quizá la receta del bálsamo."
    - "La aldea judía ardió en el siglo VI o a comienzos del VII, y tras un breve asentamiento mameluco el sitio fue abandonado. El kibutz Ein Gedi nació de un puesto militar del Nahal establecido en 1953, y el oasis es hoy una reserva natural con un jardín botánico y una escuela de campo; el mar Muerto ha retrocedido tanto que la orilla queda lejos de la fuente, y los sumideros han cerrado partes del antiguo camino."
  pt:
    - "En-Gedi, “a fonte do cabrito”, é o oásis na margem ocidental do Mar Morto, onde uma fonte e dois desfiladeiros, Nahal David e Nahal Arugot, descem entre os penhascos até um leque de palmeiras e jardins. Era Hazazom-Tamar, onde Quedorlaomer derrotou os amorreus, e uma das seis cidades de Judá no deserto. Davi, fugindo de Saul, “habitou nas fortalezas de En-Gedi”; Saul veio com três mil homens “perto dos rochedos das cabras monteses”, entrou numa caverna para aliviar-se, e Davi, escondido no fundo dela, cortou a ponta do seu manto e o deixou ir. No reinado de Josafá, moabitas e amonitas subiram por En-Gedi contra Judá. O Cântico dos Cânticos conhece suas vinhas: “um cacho de flores de hena das vinhas de En-Gedi”, e Ezequiel previu pescadores no mar curado “Desde En-Gedi até En-Eglaim”."
    - "O íbex e o híraz ainda vivem ali, e a arqueologia achou o resto. Acima da fonte ergue-se um templo calcolítico do quarto milênio a.C. Tel Goren foi um povoado do último século do reino de Judá, cujos escavadores tomaram suas tinas por uma indústria de perfume, talvez com o bálsamo que crescia aqui e em Jericó; Plínio classificava En-Gedi em segundo lugar depois de Jerusalém em fertilidade e palmeiras, e Josefo louvou seu bálsamo. Os sicários a atacaram a partir de Massada em 68 d.C. e mataram setecentos. Cartas de Bar Kokhba aos homens de En-Gedi e o arquivo de Babata foram achados na Caverna das Cartas, a poucos quilômetros ao sul. A aldeia romana e bizantina tinha uma sinagoga cujo piso de mosaico, descoberto em 1970, lista os signos do zodíaco e amaldiçoa quem revelar “o segredo da cidade”, talvez a receita do bálsamo."
    - "A aldeia judaica foi destruída pelo fogo no século VI ou no início do VII, e depois de um breve povoado mameluco o local foi abandonado. O Kibutz Ein Gedi nasceu de um posto militar do Nahal instalado em 1953, e o oásis é hoje uma reserva natural com jardim botânico e escola de campo; o Mar Morto baixou tanto que a margem fica longe da fonte, e dolinas fecharam trechos da antiga estrada."
  de:
    - "En-Gedi, „Quelle des Böckleins“, ist die Oase am Westufer des Toten Meeres, wo eine Quelle und zwei Schluchten, Nahal David und Nahal Arugot, durch die Felswände zu einem Fächer aus Palmen und Gärten herabkommen. Es war Hazezon-Tamar, wo Kedorlaomer die Amoriter schlug, und eine der sechs Städte Judas in der Wüste. David, der vor Saul floh, „barg sich auf den Berghöhen zu Engedi“; Saul kam mit dreitausend Mann „auf den Felsen der Gemsen“, betrat eine Höhle, um sich zu erleichtern, und David, in ihrer Tiefe verborgen, schnitt den Zipfel seines Mantels ab und ließ ihn gehen. In der Regierungszeit Josaphats zogen Moabiter und Ammoniter über En-Gedi gegen Juda herauf. Das Hohelied kennt seine Weinberge, „eine Traube von Zyperblumen in den Weinbergen zu Engedi“, und Hesekiel sah Fischer am gesundeten Meer voraus: „von Engedi bis zu En-Eglaim“."
    - "Steinbock und Klippschliefer leben dort noch; die Archäologie fand den Rest. Über der Quelle steht ein kupfersteinzeitlicher Tempel des 4. Jahrtausends v. Chr. Tel Goren war eine Siedlung des letzten Jahrhunderts des Reiches Juda, deren Ausgräber ihre Becken einer Parfümherstellung zuschrieben, vielleicht aus dem Balsam, der hier und in Jericho wuchs; Plinius setzte En-Gedi bei Fruchtbarkeit und Palmen an zweite Stelle nach Jerusalem, und Josephus pries seinen Balsam. Die Sikarier überfielen es 68 n. Chr. von Masada aus und töteten siebenhundert. Briefe Bar Kochbas an die Männer von En-Gedi und das Archiv der Babatha fand man in der Höhle der Briefe einige Kilometer südlich. Das römische und byzantinische Dorf hatte eine Synagoge, deren 1970 freigelegter Mosaikboden die Tierkreiszeichen verzeichnet und jeden verflucht, der „das Geheimnis der Stadt“ verrät, vielleicht das Balsamrezept."
    - "Das jüdische Dorf brannte im 6. oder frühen 7. Jahrhundert nieder, und nach einer kurzlebigen mamlukischen Siedlung wurde der Ort verlassen. Der Kibbuz Ein Gedi ging aus einem 1953 errichteten Militärposten des Nachal hervor, und die Oase ist heute ein Naturschutzgebiet mit botanischem Garten und Feldschule; das Tote Meer ist so weit gesunken, dass das Ufer weit von der Quelle entfernt liegt, und Erdfälle haben Teile der alten Straße gesperrt."
  fr:
    - "En-Guédi, « la source du chevreau », est l’oasis sur la rive occidentale de la mer Morte, où une source et deux canyons, le Nahal David et le Nahal Arugot, descendent entre les falaises vers un éventail de palmiers et jardins. C’était Hatsatson-Thamar, où Kedorlaomer battit les Amoréens, et l’une des six villes de Juda dans le désert. David, fuyant Saül, « monta vers les lieux forts d’En-Guédi, où il demeura » ; Saül vint avec trois mille hommes « jusque sur les rochers des boucs sauvages », entra dans une grotte pour se soulager, et David, caché au fond, coupa un pan de son manteau et l’épargna. Sous Josaphat, Moabites et Ammonites montèrent par En-Guédi contre Juda. Le Cantique des cantiques connaît ses vignes, « une grappe de troëne des vignes d’En-Guédi », et Ézéchiel voyait des pêcheurs sur la mer guérie « depuis En-Guédi jusqu’à En-Églaïm »."
    - "Le bouquetin et le daman y vivent encore ; l’archéologie a trouvé le reste. Au-dessus de la source se dresse un temple chalcolithique du IVe millénaire av. J.-C. Tel Goren fut un établissement du dernier siècle du royaume de Juda, dont les fouilleurs virent dans les cuves une parfumerie, peut-être au baume qui poussait ici et à Jéricho ; Pline classait En-Guédi seconde après Jérusalem pour la fertilité et les palmiers, et Josèphe vantait son baume. Les sicaires la pillèrent depuis Massada en 68 apr. J.-C. et tuèrent sept cents personnes. Des lettres de Bar Kokhba aux hommes d’En-Guédi et les archives de Babatha furent trouvées dans la grotte des Lettres, quelques kilomètres au sud. Le village romain et byzantin avait une synagogue dont la mosaïque, découverte en 1970, énumère les signes du zodiaque et maudit quiconque révèle « le secret de la ville », peut-être la recette du baume."
    - "Le village juif brûla au VIe ou au début du VIIe siècle, et après un bref établissement mamelouk le site fut abandonné. Le kibboutz Ein Gedi est né d’un poste militaire du Nahal établi en 1953, et l’oasis est aujourd’hui une réserve naturelle avec un jardin botanique et une école de terrain ; la mer Morte a tant reculé que le rivage est loin de la source, et des dolines ont fermé des tronçons de l’ancienne route."
  it:
    - "En-Ghedi, «la sorgente del capretto», è l’oasi sulla riva occidentale del Mar Morto, dove una sorgente e due canyon, il Nahal David e il Nahal Arugot, scendono attraverso le rupi fino a un ventaglio di palme e giardini. Era Casason-Tamar, dove Chedorlaomer sconfisse gli Amorei, e una delle sei città di Giuda nel deserto. Davide, in fuga da Saul, «si stabilì nei luoghi forti di En-Ghedi»; Saul venne con tremila uomini «sulle rocce delle capre salvatiche», entrò in una spelonca per fare i suoi bisogni, e Davide, nascosto in fondo, tagliò il lembo del suo mantello e lo lasciò andare. Sotto Giosafat Moabiti e Ammoniti salirono contro Giuda passando per En-Ghedi. Il Cantico dei Cantici ne conosce le vigne, «un grappolo di cipro delle vigne d’En-Ghedi», ed Ezechiele previde pescatori sul mare risanato «da En-ghedi fino ad En-eglaim»."
    - "Lo stambecco e l’irace vi vivono ancora, e l’archeologia ha trovato il resto. Sopra la sorgente si trova un tempio calcolitico del IV millennio a.C. Tel Goren era un insediamento dell’ultimo secolo del regno di Giuda, i cui scavatori interpretarono le vasche come un’industria del profumo, forse dal balsamo che cresceva qui e a Gerico; Plinio collocava En-Ghedi al secondo posto dopo Gerusalemme per fertilità e palme, e Giuseppe Flavio ne lodava il balsamo. I Sicari la assalirono da Masada nel 68 d.C. e uccisero settecento persone. Lettere di Bar Kokhba agli uomini di En-Ghedi e l’archivio di Babatha furono trovati nella Grotta delle Lettere qualche chilometro a sud. Il villaggio romano e bizantino aveva una sinagoga il cui pavimento a mosaico, scoperto nel 1970, elenca i segni dello zodiaco e maledice chiunque riveli «il segreto della città», forse la ricetta del balsamo."
    - "Il villaggio ebraico bruciò nel VI o all’inizio del VII secolo, e dopo un breve insediamento mamelucco il sito fu abbandonato. Il kibbutz Ein Gedi nacque da un avamposto militare del Nahal fondato nel 1953, e l’oasi è ora una riserva naturale con un giardino botanico e una scuola sul campo; il Mar Morto si è ritirato tanto che la riva si trova lontana dalla sorgente, e voragini hanno chiuso parti dell’antica strada."
  pl:
    - "En-Gedi, „źródło koźlęcia”, to oaza na zachodnim brzegu Morza Martwego, gdzie źródło i dwa kaniony, Nachal Dawid i Nachal Arugot, schodzą przez klify ku wachlarzowi palm i ogrodów. Było to Chasason-Tamar, gdzie Kedorlaomer pobił Amorytów, i jedno z sześciu miast Judy na pustyni. Dawid, uciekając przed Saulem, „mieszkał na miejscach obronnych Engaddy”; Saul przybył z trzema tysiącami ludzi „po wierzchu skał kóz dzikich”, wszedł do jaskini za potrzebą, a Dawid, ukryty w jej głębi, uciął skraj jego płaszcza i darował mu życie. Za panowania Jozafata Moabici i Ammonici wyruszyli przez En-Gedi przeciw Judzie. Pieśń nad Pieśniami zna jego winnice, „grono cyprowe na winnicach, w Engaddy”, a Ezechiel przewidział rybaków nad uzdrowionym morzem „od Engaddy aż do zdroju Eglaim”."
    - "Koziorożec i góralek wciąż tam żyją, a resztę znalazła archeologia. Nad źródłem stoi chalkolityczna świątynia z IV tysiąclecia p.n.e. Tel Goren był osadą z ostatniego stulecia królestwa Judy, a jego badacze uznali tamtejsze kadzie za wytwórnię perfum, może z balsamu, który rósł tu i w Jerychu; Pliniusz stawiał En-Gedi na drugim miejscu po Jerozolimie pod względem żyzności i palm, a Józef Flawiusz chwalił jego balsam. Sykariusze napadli na nie z Masady w 68 r. n.e. i zabili siedmiuset ludzi. Listy Bar Kochby do mieszkańców En-Gedi oraz archiwum Babaty znaleziono w Jaskini Listów kilka kilometrów na południe. Rzymska i bizantyjska wieś miała synagogę, której mozaikowa posadzka, odsłonięta w 1970 r., wylicza znaki zodiaku i przeklina każdego, kto zdradza „tajemnicę miasta”, być może przepis na balsam."
    - "Żydowska wieś spłonęła w VI lub na początku VII w., a po krótkotrwałej osadzie mameluckiej miejsce opustoszało. Kibuc Ejn Gedi wyrósł z wojskowej placówki Nachal założonej w 1953 r., a oaza jest dziś rezerwatem przyrody z ogrodem botanicznym i szkołą terenową; Morze Martwe cofnęło się tak daleko, że brzeg leży daleko od źródła, a zapadliska zamknęły części starej drogi."
  nl:
    - "En-Gedi, “de bron van het geitje”, is de oase aan de westoever van de Dode Zee, waar een bron en twee kloven, Nachal David en Nachal Arugot, door de kliffen neerkomen in een waaier van palmen en tuinen. Het was Hazezon-Tamar, waar Kedorlaomer de Amorieten versloeg, en een van de zes steden van Juda in de woestijn. David, voor Saul gevlucht, “bleef in de vestingen van En-gedi”; Saul kwam met drieduizend man “boven op de rotsstenen der steenbokken”, ging een grot in om zich te ontlasten, en David, diep in de grot verborgen, sneed de slip van zijn mantel af en liet hem gaan. Onder Josafat trokken Moabieten en Ammonieten via En-Gedi tegen Juda op. Het Hooglied kent zijn wijngaarden, “een tros van Cyprus, in de wijngaarden van En-gedi”, en Ezechiël voorzag vissers aan de genezen zee “van En-gedi aan tot En-eglaim toe”."
    - "De steenbok en de klipdas leven er nog; de archeologie vond de rest. Boven de bron staat een Chalcolithische tempel uit het vierde millennium v.Chr. Tel Goren was een nederzetting uit de laatste eeuw van het koninkrijk Juda, waarvan de opgravers de kuipen hielden voor een parfumindustrie, misschien met de balsem die hier en bij Jericho groeide; Plinius rangschikte En-Gedi na Jeruzalem qua vruchtbaarheid en palmen, en Josephus prees zijn balsem. De Sicariërs overvielen het in 68 n.Chr. vanuit Masada en doodden zevenhonderd mensen. Brieven van Bar Kochba aan de mannen van En-Gedi en het archief van Babatha werden gevonden in de Brievengrot enkele kilometers zuidelijker. Het Romeinse en Byzantijnse dorp had een synagoge met een mozaïekvloer, in 1970 blootgelegd, die de tekens van de dierenriem opsomt en wie “het geheim van de stad” verraadt vervloekt, misschien het balsemrecept."
    - "Het Joodse dorp brandde af in de zesde of vroege zevende eeuw, en na een kortstondige Mammelukse nederzetting werd de plaats verlaten. Kibboets Ein Gedi groeide uit een Nachal-legerpost die in 1953 werd opgezet, en de oase is nu een natuurreservaat met een botanische tuin en een veldschool; de Dode Zee is zo ver gezakt dat de oever ver van de bron ligt, en zinkgaten hebben delen van de oude weg afgesloten."
  cs:
    - "Én-gedi, „pramen kozlete“, je oáza na západním břehu Mrtvého moře, kde pramen a dvě soutěsky, Nahal David a Nahal Arugot, sestupují mezi útesy k vějíři palem a zahrad. Byl to Chacacon-tamar, kde Kedorlaomer porazil Amorejce, a jedno ze šesti měst Judy na poušti. David, prchající před Saulem, „bydlil v místech bezpečných Engadi“; Saul vzal tři tisíce mužů a odešel hledat Davida „na skalách kamsíků“, vešel do jeskyně, aby se vyprázdnil, a David, ukrytý v jejích hlubinách, uřízl cíp jeho roucha a nechal ho jít. Za vlády Jozafatovy přitáhli Moábští a Amónští proti Judsku přes Én-gedi. Píseň písní zná jeho vinice, „hrozen cyprový na vinicích v Engadi“, a Ezechiel předvídal rybáře na uzdraveném moři „od Engadi až do studnice Eglaim“."
    - "Kozorožci a damani tu žijí dosud a archeologie našla ostatní. Nad pramenem stojí chalkolitický chrám ze 4. tisíciletí př. n. l. Tel Goren byl osadou posledního století Judského království a archeologové, kteří jej odkryli, pokládali tamní kádě za výrobnu vonných látek, snad z balzámu, který rostl tady a v Jerichu; Plinius řadil Én-gedi na druhé místo po Jeruzalémě pro úrodnost a palmy a Josephus chválil jeho balzám. Sikárové jej přepadli z Masady roku 68 n. l. a zabili sedm set. Dopisy Bar Kochby mužům z Én-gedi a archiv Babaty byly nalezeny v Jeskyni dopisů několik kilometrů na jih. Římská a byzantská vesnice měla synagogu, jejíž mozaiková podlaha, odkrytá roku 1970, uvádí znamení zvěrokruhu a proklíná každého, kdo vyzradí „tajemství města“, snad recept na balzám."
    - "Židovská vesnice vyhořela v 6. nebo na počátku 7. století a po krátkém mamlúckém osídlení bylo místo opuštěno. Kibuc Ein Gedi vyrostl z vojenské základny Nachal zřízené roku 1953 a oáza je nyní přírodní rezervací s botanickou zahradou a terénní školou; Mrtvé moře kleslo tak daleko, že břeh leží daleko od pramene, a propadliny uzavřely části staré silnice."
  sv:
    - "En-Gedi, ”killingens källa”, är oasen vid Döda havets västra strand, där en källa och två kanjoner, Nahal David och Nahal Arugot, kommer ner genom klipporna till en solfjäder av palmer och trädgårdar. Det var Hasason-Tamar, där Kedorlaomer slog amoréerna, och en av Judas sex städer i öknen. David, som flydde undan Saul, ”uppehöll sig sedan på En-Gedis bergfästen”; Saul kom med tre tusen man ”på Stenbocksklipporna”, gick in i en grotta för att uträtta sina behov, och David, gömd längst inne, skar av flikarna på hans mantel och lät honom gå. Under Josafats regering drog moabiter och ammoniter upp förbi En-Gedi mot Juda. Höga visan känner dess vingårdar, ”en klase cyperblommor från En-Gedis vingårdar”, och Hesekiel förutsåg fiskare vid det helade havet ”från En-Gedi ända till En-Eglaim”."
    - "Stenbocken och klippgrävlingen lever där ännu, och arkeologin har funnit resten. Ovanför källan står ett kalkolitiskt tempel från fjärde årtusendet f.Kr. Tel Goren var en bosättning från det sista århundradet av kungariket Juda, vars utgrävare tog dess kar för en parfymindustri, kanske med den balsam som växte här och vid Jeriko; Plinius rangordnade En-Gedi näst efter Jerusalem för fruktbarhet och palmer, och Josefus prisade dess balsam. Sikarierna överföll den från Masada år 68 e.Kr. och dödade sjuhundra. Bar Kokhbas brev till männen i En-Gedi och Babathas arkiv hittades i Brevens grotta några kilometer söderut. Den romerska och bysantinska byn hade en synagoga vars mosaikgolv, blottat 1970, förtecknar zodiakens tecken och förbannar den som avslöjar ”stadens hemlighet”, kanske balsamreceptet."
    - "Den judiska byn brann ner på 500-talet eller början av 600-talet, och efter en kortvarig mamlukisk bosättning övergavs platsen. Kibbutzen Ein Gedi växte fram ur en Nahal-armébas som sattes upp 1953, och oasen är nu ett naturreservat med en botanisk trädgård och en fältskola; Döda havet har sjunkit så långt att stranden ligger långt från källan, och sjunkhål har stängt delar av den gamla vägen."
  nb:
    - "En-Gedi, «killingens kilde», er oasen på vestsiden av Dødehavet, der en kilde og to kløfter, Nahal David og Nahal Arugot, kommer ned gjennom klippene til en vifte av palmer og hager. Det var Haseson-Tamar, der Kedorlaomer slo amorittene, og en av Judas seks byer i ørkenen. David, som flyktet fra Saul, «holdt til i fjellborgene ved En-Gedi»; Saul kom med tre tusen mann «på Stenbukk-klippene», gikk inn i en hule for å gjøre sitt fornødne, og David, skjult innerst i den, skar av flikene på kappen hans og lot ham gå. I Josjafats tid kom moabitter og ammonitter opp forbi En-Gedi mot Juda. Høysangen kjenner dens vingårder: «Min elskede er mig en cyperdrue i En-Gedis vingårder», og Esekiel så fiskere ved det helbredede havet «fra En-Gedi til En-Egla'im»."
    - "Steinbukken og klippegrevlingen lever der fremdeles, og arkeologien har funnet resten. Ovenfor kilden står et kalkolittisk tempel fra det fjerde årtusen f.Kr. Tel Goren var en bosetning fra det siste århundret av Judariket, hvis utgravere regnet karene for en parfymeindustri, kanskje med balsamen som vokste her og i Jeriko; Plinius rangerte En-Gedi som nummer to etter Jerusalem for fruktbarhet og palmer, og Josefus priste dens balsam. Sikarierne plyndret den fra Masada i 68 e.Kr. og drepte sju hundre. Brev fra Bar Kokhba til mennene i En-Gedi, og Babathas arkiv, ble funnet i Brevhulen noen kilometer sør. Den romerske og bysantinske landsbyen hadde en synagoge hvis mosaikkgulv, avdekket i 1970, lister dyrekretsens tegn og forbanner enhver som røper «byens hemmelighet», kanskje balsamoppskriften."
    - "Den jødiske landsbyen brant ned på 500- eller tidlig 600-tallet, og etter en kortvarig mamelukkisk bosetning ble stedet forlatt. Kibbutz Ein Gedi vokste frem av en Nahal-hærpost opprettet i 1953, og oasen er nå et naturreservat med botanisk hage og feltskole; Dødehavet har sunket så langt at stranden ligger langt fra kilden, og synkehull har stengt deler av den gamle veien."
  tl:
    - "Ang En-gedi, “bukal ng batang kambing”, ay oasis sa kanlurang baybayin ng Dagat na Patay, kung saan ang isang bukal at ang mga bangin ng Nahal David at Nahal Arugot ay bumababa sa mga palma at halamanan. Ito ang Hasason-tamar, kung saan sinaktan ni Chedorlaomer ang mga Amorreo, at isa sa anim na bayan ng ilang ng Juda. Si David, tumatakas kay Saul, ay “tumahan sa mga katibayan ng En-gaddi”; dumating si Saul kasama ang 3,000 lalaki, “sa mga bundok ng maiilap na kambing”, pumasok sa yungib upang magbawas, at pinutol ni David, nakatago sa kalaliman, ang laylayan ng balabal niya at pinalaya siya. Sa panahon ni Josaphat, umahon ang mga Moabita at Ammonita sa En-gedi laban sa Juda. Alam ng Awit ni Salomon ang mga ubasan nito, “kumpol ng bulaklak ng alhena … sa mga ubasan ng En-gadi”, at nakita ni Ezekiel ang mga mangingisda sa gumaling na dagat “mula sa En-gedi hanggang sa En-eglaim”."
    - "Nariyan pa ang ibex at hyrax, at nasa arkeolohiya ang iba pa. Sa itaas ng bukal ay may templong Chalcolitiko ng ika-4 na milenyo BK. Ang Tel Goren ay paninirahan ng huling siglo ng kaharian ng Juda, na ang mga tangke ay itinuring ng mga tagahukay na industriya ng pabango, marahil gamit ang balsamong tumubo rito at sa Jerico; itinuring ni Plinio ang En-gedi na ikalawa sa Jerusalem sa kasaganaan at mga palma, at pinuri ni Josefo ang balsamo nito. Sinalakay ito ng mga Sicario mula sa Masada noong 68 AD at pinatay ang pitong daan. Ang mga liham ni Bar Kokhba sa mga lalaki ng En-gedi, at ang arkibo ni Babatha, ay natagpuan sa Yungib ng mga Liham ilang kilometro sa timog. May sinagoga ang nayong Romano at Bizantino na ang sahig na mosaiko, na natuklasan noong 1970, ay naglilista ng mga tanda ng zodiac at sumusumpa sa sinumang magbunyag ng “lihim ng bayan”, marahil ang resipe ng balsamo."
    - "Nasunog ang nayong Judio noong ika-6 o maagang ika-7 siglo, at pagkatapos ng maikling paninirahang Mamluk ay iniwan ang pook. Lumago ang Kibbutz Ein Gedi mula sa isang himpilang hukbong Nahal na itinayo noong 1953, at ang oasis ngayon ay liwasang pangkalikasan na may hardin botaniko at paaralang panlarangan; bumaba nang labis ang Dagat na Patay kaya malayo sa bukal ang baybayin, at isinara ng mga biglang lumubog na hukay sa lupa ang bahagi ng lumang daan."
  da:
    - "En-Gedi, »gedekillingens kilde«, er oasen på Det Døde Havs vestkyst, hvor en kilde og to kløfter, Nahal David og Nahal Arugot, kommer ned gennem klipperne til en vifte af palmer og haver. Det var Hasason-Tamar, hvor Kedorlaomer slog amoritterne, og en af Judas seks byer i ørkenen. David, der flygtede for Saul, »blev udi Befæstningerne i Engedi«; Saul kom med tre tusind mand »paa Stengedernes Klipper«, gik ind i en hule for at forrette sin nødtørft, og David, skjult i dens dyb, skar kanten af hans kappe af og lod ham gå. I Josafats regeringstid drog moabitter og ammonitter op forbi En-Gedi mod Juda. Højsangen kender dens vingårde, »en Koferdrue, i Vingaardene, udi En-Gedi«, og Ezekiel forudså fiskere ved det helbredte hav »fra En-Gedi og indtil En-Eglaim«."
    - "Stenbukken og klippegrævlingen lever der stadig, og arkæologien har fundet resten. Over kilden står et tempel fra kobberalderen fra 4. årtusinde f.Kr. Tel Goren var en bosættelse fra det sidste århundrede af Judas kongerige, hvis udgravere anså dens kar for en parfumeindustri, måske ved brug af den balsam, der voksede her og ved Jeriko; Plinius rangerede En-Gedi som nummer to efter Jerusalem i frugtbarhed og palmer, og Josefus priste dens balsam. Sikarierne plyndrede den fra Masada i 68 e.Kr. og dræbte syv hundrede. Bar Kokhbas breve til En-Gedis mænd og Babathas arkiv blev fundet i Brevenes Hule nogle få kilometer mod syd. Den romerske og byzantinske landsby havde en synagoge, hvis mosaikgulv, afdækket i 1970, opregner stjernetegnene og forbander enhver, der røber »byens hemmelighed«, måske balsamopskriften."
    - "Den jødiske landsby brændte ned i 500-tallet eller begyndelsen af 600-tallet, og efter en kortvarig mamelukisk bosættelse blev stedet forladt. Kibbutz Ein Gedi voksede ud af en Nahal-hærforpost oprettet i 1953, og oasen er nu et naturreservat med en botanisk have og en markskole; Det Døde Hav er faldet så langt, at kysten ligger langt fra kilden, og synkehuller har lukket dele af den gamle vej."
  sr:
    - "Енгад, „извор јарета“, јесте оаза на западној обали Мртвог мора, где извор и два кањона, Нахал Давид и Нахал Аругот, силазе кроз литице у лепезу палми и вртова. Био је Асасон-Тамар, где је Ходологомор потукао Амореје, и један од шест градова Јудиних у пустињи. Давид је, бежећи од Саула, „живео у утврђењима Ен Гедија“; Саул је дошао с три хиљаде људи „по врлетима где су дивокозе“, ушао у пећину да се олакша, а Давид, скривен у њеној дубини, одсекао му је скут плашта и пустио га. За Јосафатове владавине Моавци и Амонци дошли су преко Енгада на Јуду. Песма над песмама зна његове винограде, „Драги ми је мој грозд кипров из винограда енгадских“, а Језекиљ је предвидео рибаре на исцељеном мору „од Енгада до Ен-еглаима“."
    - "Козорози и дамани још увек тамо живе, а остало је нашла археологија. Изнад извора стоји халколитски храм из 4. миленијума п. н. е. Тел Горен био је насеље последњег столећа Јудиног краљевства, чији су ископавачи његове каце схватили као парфимерску индустрију, можда уз употребу балсама који је расао овде и у Јерихону; Плиније је Енгад рангирао одмах иза Јерусалима по плодности и палмама, а Јосиф Флавије хвалио је његов балсам. Сикарији су га напали из Масаде 68. н. е. и убили седам стотина. Писма Бар Кохбе људима Енгада и архива Бабате нађени су у Пећини писама неколико километара јужније. Римско и византијско село имало је синагогу чији мозаички под, откривен 1970, набраја знаке зодијака и проклиње свакога ко открије „тајну града“, можда рецепт за балсам."
    - "Јеврејско село је изгорело у 6. или раном 7. веку, а после краткотрајног мамелучког насеља налазиште је напуштено. Кибуц Ејн Геди израстао је из војног упоришта Нахал постављеног 1953, а оаза је сада природни резерват с ботаничком баштом и теренском школом; Мртво море је пало толико да обала лежи далеко од извора, а вртаче су затвориле делове старог пута."
  hu:
    - "Én-Gedi, „a gödölye forrása”, a Holt-tenger nyugati partján fekvő oázis, ahol egy forrás és két kanyon, a Nahal Dávid és a Nahal Arugot, a sziklafalakon át leereszkedik a pálmák és kertek legyezőjéig. Ez volt Hacecon-Támár, ahol Kedorlaomer megverte az emoreusokat, és Júda hat pusztai városának egyike. Dávid, Saul elől menekülve, „Engedi erősségei közt tartózkodék”; Saul háromezer emberrel jött „a vadkecskék kőszikláin”, bement egy barlangba szükségét végezni, Dávid pedig, a mélyén elrejtőzve, levágta köntösének szélét, és elengedte. Jósafát idejében moábiak és ammóniak jöttek fel Én-Gedinél Júda ellen. Az Énekek éneke ismeri szőlőit: „Mint az Engedi szőlőiben a cziprusfürt”, Ezékiel pedig halászokat látott a meggyógyított tengeren „Éngeditől Énegláimig”."
    - "A kőszáli kecske és a szirti borz ma is él ott, a többit a régészet találta meg. A forrás fölött áll egy Kr. e. 4. évezredi rézkori templom. Tel Goren Júda királysága utolsó századának települése volt, amelynek ásatói kádjait parfümiparnak vették, talán az itt és Jerikónál termő balzsamot használva; Plinius Én-Gedit Jeruzsálem után a második helyre sorolta termékenységben és pálmákban, Josephus pedig balzsamát dicsérte. A szikariusok Kr. u. 68-ban Maszadából portyáztak rá, és hétszázat megöltek. Bar Kohba levelei Én-Gedi férfiaihoz és Babatha levéltára a néhány kilométerrel délre fekvő Levelek barlangjában kerültek elő. A római és bizánci falunak zsinagógája volt, amelynek 1970-ben feltárt mozaikpadlója felsorolja az állatöv jegyeit, és megátkoz mindenkit, aki felfedi „a város titkát”, talán a balzsamreceptet."
    - "A zsidó falu a 6. században vagy a 7. század elején leégett, és egy rövid életű mameluk település után a hely elnéptelenedett. Az Ein Gedi kibuc egy 1953-ban felállított Nahal katonai előőrsből nőtt ki, az oázis pedig ma természetvédelmi terület botanikus kerttel és terepiskolával; a Holt-tenger annyira visszahúzódott, hogy a part messze van a forrástól, és víznyelők zárták el a régi út részeit."
  fi:
    - "En-Gedi, ”vohlan lähde”, on Kuolleenmeren länsirannan keidas, jossa lähde ja kaksi kanjonia, Nahal David ja Nahal Arugot, laskeutuvat kallioiden läpi palmujen ja puutarhojen viuhkaan. Se oli Hasason-Tamar, missä Kedorlaomer löi amorilaiset, ja yksi Juudan kuudesta erämaakaupungista. Daavid, paetessaan Saulia, ”oleskeli Een-Gedin vuorten huipuilla”; Saul tuli kolmentuhannen miehen kanssa etsimään Daavidia ”Kauriskallioiden itäpuolelta”, meni luolaan tarpeilleen, ja Daavid, kätkeytyneenä sen syvyyksiin, leikkasi irti hänen viittansa liepeen ja päästi hänet menemään. Josafatin aikana moabilaiset ja ammonilaiset nousivat En-Gedin kautta Juudaa vastaan. Laulujen laulu tuntee sen viinitarhat, ”kooferkukka-terttu Een-Gedin viinitarhoista”, ja Hesekiel ennusti kalastajia parantuneella merellä ”Een-Gedistä Een-Eglaimiin asti”."
    - "Vuorikauriit ja klippahyraksit elävät siellä yhä, ja arkeologia on löytänyt loput. Lähteen yläpuolella on kalkoliittinen temppeli neljänneltä vuosituhannelta eaa. Tel Goren oli Juudan kuningaskunnan viimeisen vuosisadan asutus, jonka kaivajat katsoivat sen altaiden olleen hajuvesiteollisuutta, ehkä käyttäen täällä ja Jerikossa kasvanutta balsamia; Plinius asetti En-Gedin hedelmällisyydessä ja palmuissa Jerusalemin jälkeen toiseksi, ja Josefus ylisti sen balsamia. Sikarit ryöstivät sen Masadasta vuonna 68 jaa. ja tappoivat seitsemänsataa. Bar Kokhban kirjeet En-Gedin miehille ja Babatan arkisto löydettiin Kirjeiden luolasta muutaman kilometrin etelässä. Roomalaisen ja bysanttilaisen ajan kylässä oli synagoga, jonka mosaiikkilattia, paljastettu vuonna 1970, luettelee eläinradan merkit ja kiroaa jokaisen, joka paljastaa ”kaupungin salaisuuden”, ehkä balsamin reseptin."
    - "Juutalaiskylä paloi 500-luvulla tai 600-luvun alussa, ja lyhytikäisen mamelukkiasutuksen jälkeen paikka autioitui. Ein Gedin kibbutsi kasvoi Nahal-armeijan vuonna 1953 perustamasta etuvartiosta, ja keidas on nyt luonnonsuojelualue, jossa on kasvitieteellinen puutarha ja kenttäkoulu; Kuollutmeri on laskenut niin paljon, että ranta on kaukana lähteestä, ja maanvajoamat ovat sulkeneet osia vanhasta tiestä."
  vi:
    - "Ên-ghê-đi, “suối của con dê con”, là ốc đảo trên bờ tây Biển Chết, nơi một suối và hai hẻm núi, Nahal David và Nahal Arugot, chảy xuống qua vách đá đến một bãi bồi hình quạt đầy chà là và vườn tược. Đó là Hát-sát-son-Tha-ma, nơi Kết-rô-Lao-me đánh người A-mô-rít, và là một trong sáu thành của Giu-đa trong đồng vắng. Đa-vít, trốn Sau-lơ, “ngụ tại trong đồn Ên-ghê-đi”; Sau-lơ đem ba ngàn người đến “các hòn đá của dê rừng”, vào một cái hang để đại tiện, và Đa-vít, ẩn sâu bên trong, cắt vạt áo ông rồi tha cho ông. Dưới triều Giô-sa-phát, người Mô-áp và Am-môn đi lên qua Ên-ghê-đi nghịch cùng Giu-đa. Nhã Ca biết các vườn nho của nó, “Lương nhân tôi giống như một chùm hoa phụng tiên cho tôi. Trong vườn nho Ên-Ghê-đi”, và Ê-xê-chi-ên thấy trước những người đánh cá trên biển được chữa lành “từ Ên-Ghê-đi cho đến Ên-Ê-la-im”."
    - "Dê rừng núi và chuột đá hyrax vẫn sống ở đó, và khảo cổ học đã tìm thấy phần còn lại. Phía trên suối có một đền thờ thời đồ đá đồng của thiên niên kỷ 4 TCN. Tel Goren là một khu định cư của thế kỷ cuối cùng của vương quốc Giu-đa, mà các nhà khai quật coi các bể của nó là của một ngành chế nước hoa, có lẽ dùng nhựa balsam mọc ở đây và ở Giê-ri-cô; Plinius xếp Ên-ghê-đi thứ hai sau Giê-ru-sa-lem về độ màu mỡ và chà là, và Josephus ca ngợi balsam của nó. Nhóm Sicarii đột kích nó từ Masada năm 68 và giết bảy trăm người. Các thư của Bar Kokhba gửi người Ên-ghê-đi, và kho lưu trữ của Babatha, được tìm thấy trong Hang Thư cách vài kilômét về phía nam. Làng La Mã và Byzantine có một hội đường với nền khảm, phát hiện năm 1970, liệt kê các dấu hiệu hoàng đạo và nguyền rủa bất cứ ai tiết lộ “điều bí mật của thị trấn”, có lẽ là công thức balsam."
    - "Ngôi làng Do Thái bị cháy vào thế kỷ 6 hoặc đầu thế kỷ 7, và sau một khu định cư Mamluk ngắn ngủi, địa điểm bị bỏ hoang. Kibbutz Ein Gedi lớn lên từ một tiền đồn quân đội Nahal lập năm 1953, và ốc đảo nay là khu bảo tồn thiên nhiên với một vườn thực vật và một trường dã ngoại; Biển Chết đã rút xa đến nỗi bờ biển nằm xa suối, và các hố sụt đã đóng một phần con đường cũ."
  ro:
    - "En-Ghedi, „izvorul iedului”, este oaza de pe malul vestic al Mării Moarte, unde un izvor și două canioane, Nahal David și Nahal Arugot, coboară prin stânci spre un evantai de palmieri și grădini. Era Hațațon-Tamar, unde Chedorlaomer i-a lovit pe amoriți, și una dintre cele șase cetăți ale lui Iuda din pustie. David, fugind de Saul, „a șezut în strâmtorile Engadului”; Saul a venit cu trei mii de oameni „în fața Sadeemului”, a intrat într-o peșteră să-și facă nevoile, iar David, ascuns în adâncul ei, i-a tăiat poala mantiei și l-a lăsat să plece. În domnia lui Iosafat, moabiții și amoniții au urcat pe la En-Ghedi împotriva lui Iuda. Cântarea Cântărilor îi cunoaște viile, „Strugur din chipru este frățiorul meu mie, din viile Engadi”, iar Ezechiel a prevăzut pescari pe marea vindecată de la En-Ghedi până la En-Eglaim."
    - "Ibexul și damanul mai trăiesc acolo, iar arheologia a găsit restul. Deasupra izvorului stă un templu calcolitic din mileniul al IV-lea î.Hr. Tel Goren a fost o așezare din ultimul secol al regatului lui Iuda, ale cărei cuve cei care au făcut săpăturile le-au luat drept o industrie a parfumurilor, poate folosind balsamul care creștea aici și la Ierihon; Pliniu a așezat En-Ghedi pe locul al doilea după Ierusalim ca rodnicie și palmieri, iar Iosif Flaviu a lăudat balsamul lui. Sicarii l-au atacat din Masada în 68 d.Hr. și au ucis șapte sute. Scrisori ale lui Bar Kohba către oamenii din En-Ghedi și arhiva Babathei au fost găsite în Peștera Scrisorilor, la câțiva kilometri spre sud. Satul roman și bizantin avea o sinagogă al cărei pavaj de mozaic, descoperit în 1970, înșiră semnele zodiacului și blestemă pe oricine dezvăluie „taina cetății”, poate rețeta balsamului."
    - "Satul iudaic a ars în secolul al VI-lea sau la începutul celui de-al VII-lea, iar după o așezare mamelucă de scurtă durată locul a fost părăsit. Kibuțul Ein Gedi a crescut dintr-un avanpost militar Nahal înființat în 1953, iar oaza este acum o rezervație naturală cu grădină botanică și o școală de teren; Marea Moartă a scăzut atât de mult încât țărmul se află departe de izvor, iar dolinele au închis părți din vechiul drum."
  bg:
    - "Ен-Гади, „изворът на козлето“, е оазисът на западния бряг на Мъртво море, където извор и два каньона, Нахал Давид и Нахал Аругот, слизат през скалите към ветрило от палми и градини. Това бил Хацацон-Тамар, където Кедорлаомер поразил аморейците, и един от шестте града на Юда в пустинята. Давид, бягайки от Саул, „седна в крепките места на Ен-гади“; Саул дошъл с три хиляди мъже да го търси „по скалите на дивите кози“, влязъл в една пещера по нужда, а Давид, скрит в дълбините ѝ, отрязал полата на мантията му и го пуснал. При царуването на Йосафат моавци и амонци дошли през Ен-Гади срещу Юда. Песен на песните познава лозята му: „Китка кипрова … В лозята на Енгади“, а Йезекиил предвидил рибари по изцеленото море „от Ен-гади до Ен-еглаим“."
    - "Козирогът и даманът и днес живеят там, а археологията е открила останалото. Над извора стои халколитен храм от IV хил. пр.н.е. Тел Горен бил селище от последния век на Юдейското царство, чиито разкопвачи смятат съдовете му за част от производство на благовония, може би от балсама, който растял тук и в Йерихон; Плиний поставял Ен-Гади след Йерусалим по плодородие и палми, а Йосиф Флавий хвалел балсама му. Сикариите го нападнали от Масада през 68 г. н.е. и избили седемстотин души. Писма на Бар Кохба до мъжете на Ен-Гади и архивът на Бабата били намерени в Пещерата на писмата на няколко километра на юг. Римското и византийско село имало синагога, чийто мозаечен под, открит през 1970 г., изброява зодиакалните знаци и проклина всеки, който издаде „тайната на града“ — може би рецептата за балсама."
    - "Юдейското село изгоряло през VI или началото на VII в., а след краткотрайно мамлюкско селище мястото опустяло. Кибуцът Ейн Геди израснал от армейски пост на „Нахал“, създаден през 1953 г., а оазисът днес е природен резерват с ботаническа градина и полево училище; Мъртво море се е оттеглило толкова, че брегът лежи далеч от извора, а пропадания на почвата са затворили части от стария път."
