# Overview article (ADR 0007). Mainstream facts only; Hosea's Beth-aven as a name for Bethel is the usual reading, and the separate Beth-aven of Joshua is pointed to.
id: beth-aven-hosea
place: a696a95
title:
  en: "Beth-aven of Hosea"
  ru: "Беф-Авен у Осии"
body:
  en:
    - "Beth-aven, “house of wickedness”, is in Hosea a mocking name for Bethel, “house of God”, the royal sanctuary of the northern kingdom where Jeroboam had set up a golden calf. The prophet warns Judah, “come not ye unto Gilgal, neither go ye up to Beth-aven, nor swear, The LORD liveth”; he sounds the alarm “in Gibeah, and the trumpet in Ramah: cry aloud at Beth-aven, after thee, O Benjamin”; and he foretells that “The inhabitants of Samaria shall fear because of the calves of Beth-aven: for the people thereof shall mourn over it”. A few verses later the same place is “Aven” and then Bethel under its own name, “So shall Beth-el do unto you because of your great wickedness”. Amos plays on the same word when he says that “Beth-el shall come to nought”."
    - "The Bible also knows a Beth-aven near Ai, “on the east side of Beth-el”, in Joshua and Samuel; the map records it separately, and scholars still debate whether it was a real village or an older name of the sanctuary of Bethel itself. The chain of alarm in Hosea's second passage, from Gibeah through Ramah to Beth-aven, runs north along the border of Benjamin, and Albrecht Alt read it as an echo of the Syro-Ephraimite war of the 730s BC, when Judah pushed into Israelite land while Tiglath-pileser III was crushing the north; others doubt that setting. Hosea foretold that the calf of Bethel would be carried to Assyria; the shrine itself lived on until Josiah tore it down."
    - "Bethel is identified with Beitin, 16 km north of Jerusalem, where excavations of 1934–1960 found the Iron Age town but not the sanctuary; the article on Bethel tells its story. Today Beitin is a Palestinian village north-east of Ramallah."
  ru:
    - "Беф-Авен, «дом нечестия», — у Осии насмешливое имя Вефиля, «дома Божия», царского святилища северного царства, где Иеровоам поставил золотого тельца. Пророк предостерегает Иуду: «не ходите в Галгал, и не восходите в Беф-Авен, и не клянитесь: жив Господь!»; он трубит тревогу: «Вострубите рогом в Гиве, трубою в Раме; возглашайте в Беф-Авене: за тобою, Вениамин!»; и предрекает: «За тельца Беф-Авена вострепещут жители Самарии; восплачет о нем народ его». Несколькими стихами ниже то же место названо «Авен», а затем Вефиль своим именем: «Вот что причинит вам Вефиль за крайнее нечестие ваше». Амос играет тем же словом, говоря, что «Вефиль обратится в ничто»."
    - "Библия знает и Беф-Авен близ Гая, «с восточной стороны Вефиля», в книгах Иисуса Навина и Царств; на карте он отмечен отдельно, а учёные до сих пор спорят, было ли это настоящее селение или старое имя самого святилища Вефиля. Цепочка тревоги во втором отрывке Осии, от Гивы через Раму к Беф-Авену, идёт на север вдоль границы Вениамина, и Альбрехт Альт прочёл её как отзвук сиро-ефремской войны 730-х годов до н. э., когда Иуда вторгся в израильские земли, пока Феглаффелласар III сокрушал север; другие в этом сомневаются. Осия предрекал, что тельца Вефиля унесут в Ассирию; само святилище дожило до Иосии, который его разрушил."
    - "Вефиль отождествляют с Бейтином в 16 км к северу от Иерусалима, где раскопки 1934–1960 годов нашли город железного века, но не святилище; его историю рассказывает статья о Вефиле. Сегодня Бейтин — палестинская деревня к северо-востоку от Рамаллы."
