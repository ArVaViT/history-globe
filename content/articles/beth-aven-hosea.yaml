# Overview article (ADR 0007). Mainstream facts only; Hosea's Beth-aven as a name for Bethel is the usual reading, and the separate Beth-aven of Joshua is pointed to.
id: beth-aven-hosea
place: a696a95
title:
  en: "Beth-aven of Hosea"
  ru: "Беф-Авен у Осии"
  uk: "Бет-Авен Осії"
  es: "Bet-avén de Oseas"
  pt: "Bete-Áven de Oseias"
  de: "Bet-Awen bei Hosea"
  fr: "Beth-Aven d’Osée"
  it: "Bet-Aven in Osea"
  pl: "Bet-Awen u Ozeasza"
  nl: "Beth-Awen bij Hosea"
  cs: "Bét-aven u Ozeáše"
body:
  en:
    - "Beth-aven, “house of wickedness”, is in Hosea a mocking name for Bethel, “house of God”, the royal sanctuary of the northern kingdom where Jeroboam had set up a golden calf. The prophet warns Judah, “come not ye unto Gilgal, neither go ye up to Beth-aven, nor swear, The LORD liveth”; he sounds the alarm “in Gibeah, and the trumpet in Ramah: cry aloud at Beth-aven, after thee, O Benjamin”; and he foretells that “The inhabitants of Samaria shall fear because of the calves of Beth-aven: for the people thereof shall mourn over it”. A few verses later the same place is “Aven” and then Bethel under its own name, “So shall Beth-el do unto you because of your great wickedness”. Amos plays on the same word when he says that “Beth-el shall come to nought”."
    - "The Bible also knows a Beth-aven near Ai, “on the east side of Beth-el”, in Joshua and Samuel; the map records it separately, and scholars still debate whether it was a real village or an older name of the sanctuary of Bethel itself. The chain of alarm in Hosea's second passage, from Gibeah through Ramah to Beth-aven, runs north along the border of Benjamin, and Albrecht Alt read it as an echo of the Syro-Ephraimite war of the 730s BC, when Judah pushed into Israelite land while Tiglath-pileser III was crushing the north; others doubt that setting. Hosea foretold that the calf of Bethel would be carried to Assyria; the shrine itself lived on until Josiah tore it down."
    - "Bethel is identified with Beitin, 16 km north of Jerusalem, where excavations of 1934–1960 found the Iron Age town but not the sanctuary; the article on Bethel tells its story. Today Beitin is a Palestinian village north-east of Ramallah."
  ru:
    - "Беф-Авен, «дом нечестия», — у Осии насмешливое имя Вефиля, «дома Божия», царского святилища северного царства, где Иеровоам поставил золотого тельца. Пророк предостерегает Иуду: «не ходите в Галгал, и не восходите в Беф-Авен, и не клянитесь: жив Господь!»; он трубит тревогу: «Вострубите рогом в Гиве, трубою в Раме; возглашайте в Беф-Авене: за тобою, Вениамин!»; и предрекает: «За тельца Беф-Авена вострепещут жители Самарии; восплачет о нем народ его». Несколькими стихами ниже то же место названо «Авен», а затем Вефиль своим именем: «Вот что причинит вам Вефиль за крайнее нечестие ваше». Амос играет тем же словом, говоря, что «Вефиль обратится в ничто»."
    - "Библия знает и Беф-Авен близ Гая, «с восточной стороны Вефиля», в книгах Иисуса Навина и Царств; на карте он отмечен отдельно, а учёные до сих пор спорят, было ли это настоящее селение или старое имя самого святилища Вефиля. Цепочка тревоги во втором отрывке Осии, от Гивы через Раму к Беф-Авену, идёт на север вдоль границы Вениамина, и Альбрехт Альт прочёл её как отзвук сиро-ефремской войны 730-х годов до н. э., когда Иуда вторгся в израильские земли, пока Феглаффелласар III сокрушал север; другие в этом сомневаются. Осия предрекал, что тельца Вефиля унесут в Ассирию; само святилище дожило до Иосии, который его разрушил."
    - "Вефиль отождествляют с Бейтином в 16 км к северу от Иерусалима, где раскопки 1934–1960 годов нашли город железного века, но не святилище; его историю рассказывает статья о Вефиле. Сегодня Бейтин — палестинская деревня к северо-востоку от Рамаллы."
  uk:
    - "Бет-Авен, «дім беззаконня», в Осії — глузливе ім'я Бет-Елу, «дому Божого», царського святилища північного царства, де Єровоам поставив золотого бичка. Пророк застерігає Юду: «ой не ходїте в Галгал, не йдїть у Бет-Авен, та й не кленїтесь: Як жив Господь»; він б'є на сполох: «Затрубіте рогом у Гиві, трубою у Рамі, дайте гасло в Бет-Авенї: позад тебе (ворог), Бенямине!»; і провіщає, що «Задля телця Бет-Авена затремтять Самарийські осадники; заплаче по ньому нарід його». Кілька віршів далі те саме місце — «Авен», а потім Бет-Ел під власним ім'ям: «Ось, до чого довів вас Бетель — за безмірну безбожність вашу!» Амос грає на тому самому слові, коли каже, що «Бетель в нїщо обернеться»."
    - "Біблія знає також Бет-Авен поблизу Гая, «на схід сонця від Бетеля», в книгах Ісуса Навина і Самуїла; мапа відзначає його окремо, і вчені й далі сперечаються, чи це було справжнє село, чи давня назва самого святилища Бет-Елу. Ланцюг тривоги в Осіїному другому уривку, від Гіви через Раму до Бет-Авена, йде на північ уздовж кордону Веніяміна, і Альбрехт Альт читав його як відлуння сиро-єфремівської війни 730-х рр. до н. е., коли Юда посунув на ізраїльську землю, поки Тіглатпаласар III розтрощував північ; інші сумніваються в такому тлі. Осія провістив, що бичка Бет-Елу віднесуть до Ассирії; саме святилище прожило аж до Йосії, який його зруйнував."
    - "Бет-Ел ототожнюють з Бейтіном, за 16 км на північ від Єрусалима, де розкопки 1934–1960 рр. знайшли місто залізної доби, але не святилище; його історію розповідає стаття про Бет-Ел. Нині Бейтін — палестинське село на північний схід від Рамалли."
  es:
    - "Bet-avén, «casa de maldad», es en Oseas un nombre burlón para Betel, «casa de Dios», el santuario real del reino del norte donde Jeroboam había erigido un becerro de oro. El profeta advierte a Judá: «no entréis en Gilgal, ni subáis á Beth-aven; ni juréis, Vive Jehová»; da la alarma «en Gabaa, trompeta en Ramá: sonad tambor en Beth-aven: tras ti, oh Benjamín»; y predice que «Por las becerras de Beth-aven serán atemorizados los moradores de Samaria: porque su pueblo lamentará á causa del becerro». Unos versículos después el mismo lugar es «Avén» y luego Betel con su propio nombre, «Así hará á vosotros Beth-el por la maldad de vuestra maldad». Amós juega con la misma palabra cuando dice que «Beth-el será deshecha»."
    - "La Biblia conoce también un Bet-avén cerca de Hai, «hacia el oriente de Beth-el», en Josué y Samuel; el mapa lo registra aparte, y los estudiosos debaten aún si fue una aldea real o un nombre más antiguo del propio santuario de Betel. La cadena de alarma del segundo pasaje de Oseas, de Gabaa a Ramá y a Bet-avén, corre hacia el norte a lo largo de la frontera de Benjamín, y Albrecht Alt la leyó como eco de la guerra siro-efraimita de la década de 730 a. C., cuando Judá avanzó sobre tierra israelita mientras Tiglat-pileser III aplastaba el norte; otros dudan de ese marco. Oseas predijo que el becerro de Betel sería llevado a Asiria; el santuario mismo sobrevivió hasta que Josías lo derribó."
    - "Betel se identifica con Beitin, a 16 km al norte de Jerusalén, donde las excavaciones de 1934–1960 hallaron la ciudad de la edad del Hierro pero no el santuario; el artículo sobre Betel cuenta su historia. Hoy Beitin es una aldea palestina al nordeste de Ramala."
  pt:
    - "Bete-Áven, “casa da maldade”, é em Oseias um nome zombeteiro de Betel, “casa de Deus”, o santuário real do reino do norte onde Jeroboão pusera um bezerro de ouro. O profeta adverte Judá: “não venham a Gilgal, nem subam a Bete-Áven, nem jurem: ‘Tão certo como vive o SENHOR’”; dá o alarme: “Toquem a trombeta em Gibeá, e o clarim em Ramá! Deem o grito de guerra em Bete-Áven; atrás de você, Benjamim!”; e prediz que “Os habitantes de Samaria ficarão aterrorizados por causa dos bezerros de Bete-Áven, pois o seu povo lamentará por ele”. Poucos versículos depois, o mesmo lugar é “Áven” e depois Betel com o seu próprio nome: “Assim Betel fará a vocês por causa da sua grande impiedade”. Amós joga com a mesma palavra ao dizer que “Betel será reduzida a nada”."
    - "A Bíblia conhece também uma Bete-Áven perto de Ai, “a leste de Betel”, em Josué e Samuel; o mapa a registra à parte, e os estudiosos ainda discutem se era uma aldeia real ou um nome mais antigo do próprio santuário de Betel. A cadeia de alarme na segunda passagem de Oseias, de Gibeá por Ramá até Bete-Áven, corre para o norte ao longo da fronteira de Benjamim, e Albrecht Alt a leu como eco da guerra siro-efraimita da década de 730 a.C., quando Judá avançou em terra israelita enquanto Tiglate-Pileser III esmagava o norte; outros duvidam desse cenário. Oseias predisse que o bezerro de Betel seria levado à Assíria; o próprio santuário durou até que Josias o derrubou."
    - "Betel é identificada com Beitin, 16 km ao norte de Jerusalém, onde escavações de 1934–1960 acharam a cidade da Idade do Ferro, mas não o santuário; o artigo sobre Betel conta a sua história. Hoje Beitin é uma aldeia palestina a nordeste de Ramallah."
  de:
    - "Bet-Awen, „Haus des Frevels“, ist bei Hosea ein spöttischer Name für Bethel, „Haus Gottes“, das königliche Heiligtum des Nordreichs, wo Jerobeam ein goldenes Kalb aufgestellt hatte. Der Prophet warnt Juda: „Geht nicht hin gen Gilgal und kommt nicht hinauf gen Beth-Aven und schwört nicht: So wahr der HERR lebt!“; er schlägt Alarm: „blaset Posaunen zu Gibea, ja, drommetet zu Rama, ja, ruft zu Beth-Aven: ‚Hinter dir, Benjamin!‘“; und er sagt voraus: „Die Einwohner zu Samaria sorgen um das Kalb zu Beth-Aven; denn sein Volk trauert darum“. Wenige Verse später heißt derselbe Ort „Awen“ und dann Bethel unter seinem eigenen Namen: „Ebenso soll's euch zu Beth-El auch gehen um eurer großen Bosheit willen“. Amos spielt mit demselben Wort, wenn er sagt: „Beth-El wird Beth-Aven werden“."
    - "Die Bibel kennt auch ein Bet-Awen bei Ai, „gegen Morgen vor Beth-El“, bei Josua und Samuel; die Karte verzeichnet es gesondert, und Gelehrte debattieren noch, ob es ein wirkliches Dorf oder ein älterer Name des Heiligtums von Bethel selbst war. Die Alarmkette in Hoseas zweiter Stelle, von Gibea über Rama nach Bet-Awen, verläuft nach Norden entlang der Grenze Benjamins, und Albrecht Alt las sie als Widerhall des syrisch-ephraimitischen Krieges der 730er Jahre v. Chr., als Juda in israelitisches Land vordrang, während Tiglat-Pileser III. den Norden zermalmte; andere bezweifeln diese Einordnung. Hosea sagte voraus, das Kalb von Bethel werde nach Assyrien getragen; das Heiligtum selbst bestand fort, bis Josia es niederriss."
    - "Bethel wird mit Beitin gleichgesetzt, 16 km nördlich von Jerusalem, wo Grabungen 1934–1960 die eisenzeitliche Stadt, aber nicht das Heiligtum fanden; der Artikel über Bethel erzählt seine Geschichte. Heute ist Beitin ein palästinensisches Dorf nordöstlich von Ramallah."
  fr:
    - "Beth-Aven, « maison de méchanceté », est chez Osée un nom moqueur de Béthel, « maison de Dieu », sanctuaire royal du royaume du nord où Jéroboam avait dressé un veau d’or. Le prophète avertit Juda : « N’allez pas à Guilgal, ne montez pas à Beth-Aven, et ne jurez pas : L’Éternel est vivant ! » ; il donne l’alarme : « Sonnez de la trompette à Guibea, sonnez de la trompette à Rama ! Poussez des cris à Beth-Aven ! Derrière toi, Benjamin ! » ; et il prédit que « Les habitants de Samarie seront consternés au sujet des veaux de Beth-Aven ; le peuple mènera deuil sur l’idole ». Quelques versets plus loin, le même lieu est « Aven » puis Béthel sous son propre nom : « Voilà ce que vous attirera Béthel, à cause de votre extrême méchanceté ». Amos joue sur le même mot quand il dit « Béthel anéanti »."
    - "La Bible connaît aussi un Beth-Aven près d’Aï, « à l’orient de Béthel », dans Josué et Samuel ; la carte l’enregistre à part, et les savants débattent encore s’il était un vrai village ou un ancien nom du sanctuaire de Béthel même. La chaîne d’alarme du second passage d’Osée, de Guibea par Rama à Beth-Aven, court vers le nord le long de la frontière de Benjamin, et Albrecht Alt y lut un écho de la guerre syro-éphraïmite des années 730 av. J.-C., quand Juda poussa en terre israélite tandis que Tiglath-Piléser III écrasait le nord ; d’autres doutent de ce cadre. Osée prédit que le veau de Béthel serait emporté en Assyrie ; le sanctuaire lui-même vécut jusqu’à ce que Josias l’abatte."
    - "Béthel est identifiée à Beitin, à 16 km au nord de Jérusalem, où les fouilles de 1934-1960 ont trouvé la ville de l’âge du Fer mais non le sanctuaire ; l’article sur Béthel raconte son histoire. Aujourd’hui Beitin est un village palestinien au nord-est de Ramallah."
  it:
    - "Bet-Aven, «casa dell’iniquità», è in Osea un nome beffardo per Betel, «casa di Dio», il santuario reale del regno del nord dove Geroboamo aveva posto un vitello d’oro. Il profeta avverte Giuda: «Non andate a Ghilgal, e non salite a Beth-aven, e non giurate dicendo: “Vive l’Eterno!”»; dà l’allarme: «Sonate il corno in Ghibea, sonate la tromba in Rama! Date l’allarme a Beth-aven! Alle tue spalle, o Beniamino!»; e predice che «Gli abitanti di Samaria trepideranno per le vitelle di Beth-aven; sì, il popolo farà cordoglio per l’idolo». Pochi versetti dopo lo stesso luogo è «Aven» e poi Betel con il suo nome: «Così vi farà Bethel, a motivo della vostra immensa malvagità». Amos gioca sulla stessa parola quando dice che «Bethel sarà ridotto a niente»."
    - "La Bibbia conosce anche un Bet-Aven presso Ai, «a oriente di Bethel», in Giosuè e Samuele; la carta lo registra separatamente, e gli studiosi discutono ancora se fosse un vero villaggio o un nome più antico del santuario di Betel stessa. La catena di allarme nel secondo passo di Osea, da Gabaa attraverso Rama a Bet-Aven, corre a nord lungo il confine di Beniamino, e Albrecht Alt la lesse come eco della guerra siro-efraimita degli anni 730 a.C., quando Giuda si spinse in terra israelita mentre Tiglat-Pilèser III schiacciava il nord; altri dubitano di quel contesto. Osea predisse che il vitello di Betel sarebbe stato portato in Assiria; il santuario stesso sopravvisse finché Giosia lo abbatté."
    - "Betel è identificata con Beitin, a 16 km a nord di Gerusalemme, dove gli scavi del 1934–1960 hanno trovato la città dell’età del Ferro ma non il santuario; la voce su Betel ne racconta la storia. Oggi Beitin è un villaggio palestinese a nord-est di Ramallah."
  pl:
    - "Bet-Awen, „dom nieprawości”, jest u Ozeasza szyderczą nazwą Betel, „domu Boga”, królewskiego sanktuarium królestwa północnego, gdzie Jeroboam postawił złotego cielca. Prorok ostrzega Judę: „nie chodźcie do Galgal, ani wstępujcie do Bet Awen, ani przysięgajcie mówiąc: Jako żyje Pan!”; bije na alarm: „Zatrąbcie w trąbę w Gabaa, i w trąbę w Rama; krzyczcie w Bet Awen: Nieprzyjaciel za tobą, o Benjaminie!”; i przepowiada, że „Dla jałowic Bet Aweńskich zatrwożą się obywatele Samaryjscy, gdy kwilić będą nad nim, lud jego”. Kilka wersetów dalej to samo miejsce jest Awen, a potem Betel pod własnym imieniem: „Oto tak wam uczyni Betel dla wielkiej złości waszej”. Amos gra tym samym słowem, gdy mówi, że „Betel się wniwecz obróci”."
    - "Biblia zna także Bet-Awen koło Aj, „na wschód słońca od Betel”, w Księgach Jozuego i Samuela; mapa zapisuje je osobno, a uczeni wciąż spierają się, czy była to prawdziwa wieś, czy starsza nazwa samego sanktuarium Betel. Łańcuch alarmu w drugim fragmencie Ozeasza, od Gibea przez Rama do Bet-Awen, biegnie na północ wzdłuż granicy Beniamina, a Albrecht Alt czytał go jako echo wojny syryjsko-efraimskiej z lat 730. p.n.e., gdy Juda wdarła się w ziemię izraelską, podczas gdy Tiglat-Pileser III miażdżył północ; inni wątpią w takie tło. Ozeasz przepowiedział, że cielec z Betel zostanie zawieziony do Asyrii; samo sanktuarium przetrwało, aż Jozjasz je zburzył."
    - "Betel utożsamia się z Beitin, 16 km na północ od Jerozolimy, gdzie wykopaliska z lat 1934–1960 znalazły miasto z epoki żelaza, lecz nie sanktuarium; jego dzieje opowiada hasło Betel. Dziś Beitin jest palestyńską wsią na północny wschód od Ramallah."
  nl:
    - "Beth-Awen, “huis van de boosheid”, is bij Hosea een spotnaam voor Bethel, “huis van God”, het koninklijke heiligdom van het noordelijke koninkrijk waar Jerobeam een gouden kalf had opgesteld. De profeet waarschuwt Juda: “komt gij toch niet te Gilgal, en gaat niet op naar Beth-Aven, en zweert niet: Zo waarachtig als de HEERE leeft”; hij slaat alarm: “Blaast de bazuin te Gibea, de trompet te Rama; roept luide te Beth-Aven; achter u, Benjamin!”; en hij voorzegt dat “de inwoners van Samaria zullen verschrikt zijn over het kalf van Beth-Aven; want zijn volk zal over hetzelve treuren”. Enkele verzen verder heet dezelfde plaats “Awen” en daarna Bethel onder zijn eigen naam: “Alzo heeft Beth-El ulieden gedaan, vanwege de boosheid uwer boosheid”. Amos speelt met hetzelfde woord als hij zegt dat “Beth-El zal worden tot niet”."
    - "De Bijbel kent ook een Beth-Awen bij Ai, “aan het oosten van Beth-El”, in Jozua en Samuël; de kaart vermeldt het apart, en geleerden debatteren nog of het een echt dorp was of een oudere naam van het heiligdom van Bethel zelf. De alarmketen in Hosea’s tweede passage, van Gibea via Rama naar Beth-Awen, loopt noordwaarts langs de grens van Benjamin, en Albrecht Alt las haar als een echo van de Syrisch-Efraïmitische oorlog van de jaren 730 v.Chr., toen Juda Israëlitisch land binnendrong terwijl Tiglat-Pileser III het noorden verpletterde; anderen betwijfelen die situering. Hosea voorzegde dat het kalf van Bethel naar Assyrië zou worden gevoerd; het heiligdom zelf bestond voort tot Josia het sloopte."
    - "Bethel wordt geïdentificeerd met Beitin, 16 km ten noorden van Jeruzalem, waar opgravingen van 1934–1960 de ijzertijdstad vonden maar niet het heiligdom; het artikel over Bethel vertelt zijn verhaal. Tegenwoordig is Beitin een Palestijns dorp ten noordoosten van Ramallah."
  cs:
    - "Bét-aven, „dům zlovůle“, je u Ozeáše posměšné jméno pro Bét-el, „dům Boží“, královskou svatyni severního království, kde Jarobeám vztyčil zlaté tele. Prorok varuje Judu: „Protož nechoďtež do Galgala, aniž vstupujte do Betaven, aniž přisahejte: Živť jest Hospodin“; svolává poplach „Trubte trubou v Gabaa, a na pozoun v Ráma; křičte v Betaven: Po tobě, ó Beniamine“; a předpovídá: „Z příčiny jalovic Betavenských děsiti se budou obyvatelé Samařští, když kvíliti bude nad nimi lid jejich“. O několik veršů později je totéž místo „Avenu“ a pak Bét-el pod svým vlastním jménem: „Aj, toť vám způsobí Bethel pro přílišnou nešlechetnost vaši“. Amos si pohrává s týmž slovem, když praví, že „Bethel přijde na nic“."
    - "Bible zná také Bét-aven u Aje, „k východní straně Bethel“, v Jozue a Samuelovi; mapa jej zaznamenává zvlášť a badatelé stále diskutují, zda šlo o skutečnou vesnici, nebo o starší jméno samotné svatyně Bét-elu. Řetěz poplachu ve druhé pasáži Ozeášově, z Gibeje přes Rámu do Bét-avenu, vede na sever podél hranice Benjamínovy a Albrecht Alt jej četl jako ozvěnu syrsko-efrajimské války 30. let 8. století př. n. l., kdy Juda pronikal do izraelské země, zatímco Tiglatpilesar III. drtil sever; jiní toto zasazení zpochybňují. Ozeáš předpověděl, že tele z Bét-elu bude odneseno do Asýrie; svatyně sama žila dál, dokud ji Jošijáš nezbořil."
    - "Bét-el se ztotožňuje s Bejtinem, 16 km severně od Jeruzaléma, kde vykopávky z let 1934–1960 našly město doby železné, ale ne svatyni; příběh Bét-elu vypráví heslo Bét-el. Dnes je Bejtin palestinskou vesnicí severovýchodně od Rámalláhu."
