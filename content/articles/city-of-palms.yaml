# Overview article (ADR 0007). Mainstream facts only; the city of palms is Jericho by the Bible's own words, and the minority views on Judges 1 are named.
id: city-of-palms
place: a529e92
title:
  en: "City of Palms"
  ru: "Город Пальм"
  uk: "Місто Пальм"
  es: "Ciudad de las Palmas"
  pt: "Cidade das Palmeiras"
  de: "Palmenstadt"
  fr: "Ville des palmiers"
  it: "Città delle Palme"
  pl: "Miasto Palm"
  nl: "Palmstad"
  cs: "Město palem"
  sv: "Palmstaden"
  nb: "Palmebyen"
  tl: "Bayan ng mga Palma"
body:
  en:
    - "“The city of palm trees” is a name the Bible gives to Jericho, the oasis town of the Jordan valley whose date palms were famous in antiquity. Chronicles makes the equation plainly: the captives released by the men of Samaria were carried “to Jericho, the city of palm trees, to their brethren”. From Mount Nebo Moses saw “the plain of the valley of Jericho, the city of palm trees, unto Zoar”; the Kenites, the family of Moses' father-in-law, “went up out of the city of palm trees with the children of Judah into the wilderness of Judah”; and Eglon of Moab, with Ammon and Amalek, “went and smote Israel, and possessed the city of palm trees”, holding the oasis until Ehud killed him."
    - "Jericho's palm groves are described by Strabo, Josephus and Pliny, and Strabo and Josephus also praise the balsam of its well-watered plain; Josephus says the palms there were many and of several kinds. Some scholars have doubted that the city of palms of Judges 1 was Jericho, which lay in ruins through much of the period of the judges, and have proposed instead Tamar in the Arabah or Zoar at the south end of the Dead Sea, nearer the Negeb of Arad where the Kenites settled; the map shows both as minor candidates. For the other three passages Jericho is not seriously disputed."
    - "Today the oasis of Jericho (Ariha) in the West Bank still grows dates among its banana groves and citrus, and the mound of Tell es-Sultan, the Old Testament city, rises beside the spring of Elisha; the article on Jericho tells its history."
  ru:
    - "«Город Пальм» — имя, которое Библия даёт Иерихону, оазисному городу в долине Иордана, чьи финиковые пальмы славились в древности. Паралипоменон говорит это прямо: пленных, отпущенных жителями Самарии, отправили «в Иерихон, город пальм, к братьям их». С горы Нево Моисей увидел «равнину долины Иерихона, город Палм, до Сигора»; Кенеяне, родня тестя Моисеева, «пошли из города Пальм с сынами Иудиными в пустыню Иудину»; а Еглон Моавитский с Аммонитянами и Амаликитянами «пошел и поразил Израиля, и овладели они городом Пальм», удерживая оазис, пока его не убил Аод."
    - "Пальмовые рощи Иерихона описывают Страбон, Иосиф Флавий и Плиний, а Страбон и Иосиф хвалят ещё и бальзам его обильно орошённой равнины; Иосиф говорит, что пальм там много и они разных видов. Некоторые учёные сомневались, что город Пальм 1-й главы Судей — Иерихон, лежавший в развалинах большую часть эпохи судей, и предлагали вместо него Тамару в Араве или Сигор на южном конце Мёртвого моря, ближе к Негеву Арада, где поселились Кенеяне; на карте оба показаны как второстепенные кандидаты. Для трёх остальных мест Иерихон всерьёз не оспаривается."
    - "Сегодня оазис Иерихона (Арихи) на Западном берегу по-прежнему растит финики среди банановых и цитрусовых рощ, а холм Телль-эс-Султан, ветхозаветный город, поднимается у источника Елисея; его историю рассказывает статья об Иерихоне."
  uk:
    - "«Місто Пальм» — назва, яку Біблія дає Єрихону, оазисному містові Йорданської долини, фінікові пальми якого були відомі в давнину. Книга Хронік робить це прирівнювання виразно: бранців, відпущених самарійцями, відвели «у Ерихон, місто в пальмах, до братів їх». З гори Нево Мойсей бачив «поділлє Єрихону, міста пальмового, до Зоару»; кенеї, рід Мойсеєвого тестя, «повиходили із Пальмового міста (Ерихону) на Юдину пустиню»; а Еглон Моавський з Аммоном і Амалеком «побив Ізраїля та й підневолив Пальмовий город», тримаючи оазис, доки Егуд не вбив його."
    - "Пальмові гаї Єрихону описують Страбон, Йосиф Флавій і Пліній, а Страбон і Йосиф хвалять також бальзам його добре зрошуваної рівнини; Йосиф каже, що пальм там було багато і різних видів. Деякі вчені сумнівалися, що місто пальм із Книги Суддів 1 було Єрихоном, який лежав у руїнах упродовж значної частини доби суддів, і пропонували натомість Тамар в Араві або Сігор на південному краї Мертвого моря, ближче до Негеву Араду, де оселилися кенеї; мапа показує обидва як другорядних кандидатів. Щодо трьох інших уривків Єрихон серйозно не оскаржують."
    - "Сьогодні оазис Єрихон (Аріха) на Західному березі й досі вирощує фініки серед бананових гаїв і цитрусів, а пагорб Телль-ес-Султан, старозавітне місто, здіймається поряд із джерелом Єлисея; стаття про Єрихон розповідає його історію."
  es:
    - "«Ciudad de las palmas» es un nombre que la Biblia da a Jericó, la ciudad oasis del valle del Jordán cuyas palmeras datileras eran famosas en la Antigüedad. Crónicas hace la equiparación con claridad: los cautivos liberados por los hombres de Samaria fueron llevados «hasta Jericó, ciudad de las palmas, cerca de sus hermanos». Desde el monte Nebo, Moisés vio «la campiña, la vega de Jericó, ciudad de las palmas, hasta Soar»; los quenitas, la familia del suegro de Moisés, «subieron de la ciudad de las palmas con los hijos de Judá al desierto de Judá»; y Eglón de Moab, con Amón y Amalec, «fué, é hirió á Israel, y tomó la ciudad de las palmas», y retuvo el oasis hasta que Aod lo mató."
    - "Estrabón, Josefo y Plinio describen los palmerales de Jericó, y Estrabón y Josefo alaban también el bálsamo de su llanura bien regada; Josefo dice que las palmeras eran allí muchas y de varias clases. Algunos estudiosos han dudado de que la ciudad de las palmas de Jueces 1 fuera Jericó, que yació en ruinas durante buena parte del periodo de los jueces, y han propuesto en su lugar Tamar, en la Arabá, o Zoar, en el extremo sur del mar Muerto, más cerca del Néguev de Arad, donde se asentaron los quenitas; el mapa muestra ambas como candidatas menores. Para los otros tres pasajes, Jericó no se discute seriamente."
    - "Hoy el oasis de Jericó (Ariha), en Cisjordania, aún produce dátiles entre sus bananos y cítricos, y el montículo de Tell es-Sultan, la ciudad del Antiguo Testamento, se alza junto a la fuente de Eliseo; el artículo sobre Jericó cuenta su historia."
  pt:
    - "“A cidade das palmeiras” é um nome que a Bíblia dá a Jericó, a cidade-oásis do vale do Jordão cujas tamareiras eram famosas na Antiguidade. As Crônicas fazem a equação claramente: os cativos libertados pelos homens de Samaria foram levados “a Jericó, a cidade das palmeiras, aos seus irmãos”. Do monte Nebo, Moisés viu “a planície do vale de Jericó, a cidade das palmeiras, até Zoar”; os queneus, a família do sogro de Moisés, “subiram da cidade das palmeiras com os filhos de Judá para o deserto de Judá”; e Eglom de Moabe, com Amom e Amaleque, “marchou, feriu Israel e tomou posse da cidade das palmeiras”, mantendo o oásis até que Eúde o matou."
    - "Os palmeirais de Jericó são descritos por Estrabão, Josefo e Plínio, e Estrabão e Josefo louvam também o bálsamo de sua planície bem regada; Josefo diz que as palmeiras ali eram muitas e de várias espécies. Alguns estudiosos duvidaram de que a cidade das palmeiras de Juízes 1 fosse Jericó, que jazia em ruínas durante boa parte do período dos juízes, e propuseram em seu lugar Tamar, na Arabá, ou Zoar, no extremo sul do Mar Morto, mais perto do Neguebe de Arade onde os queneus se estabeleceram; o mapa mostra ambos como candidatos menores. Para as outras três passagens, Jericó não é seriamente contestada."
    - "Hoje o oásis de Jericó (Ariha), na Cisjordânia, ainda cultiva tâmaras entre bananais e citros, e o monte de Tell es-Sultan, a cidade do Antigo Testamento, ergue-se junto à fonte de Eliseu; o artigo sobre Jericó conta a sua história."
  de:
    - "„Die Palmenstadt“ ist ein Name, den die Bibel Jericho gibt, der Oasenstadt im Jordantal, deren Dattelpalmen in der Antike berühmt waren. Die Chronik stellt die Gleichung klar her: Die von den Männern Samarias freigelassenen Gefangenen wurden „gen Jericho, zur Palmenstadt, zu ihren Brüdern“ gebracht. Vom Berg Nebo sah Mose „die Gegend der Ebene Jerichos, der Palmenstadt, bis gen Zoar“; die Keniter, die Sippe von Moses Schwiegervater, „zogen herauf aus der Palmenstadt mit den Kindern Juda in die Wüste Juda“; und Eglon von Moab zog mit Ammon und Amalek „hin und schlug Israel und nahm ein die Palmenstadt“ und hielt die Oase, bis Ehud ihn tötete."
    - "Jerichos Palmenhaine werden von Strabon, Josephus und Plinius beschrieben, und Strabon und Josephus preisen auch den Balsam seiner gut bewässerten Ebene; Josephus sagt, die Palmen dort seien zahlreich und von mehreren Arten gewesen. Manche Gelehrte haben bezweifelt, dass die Palmenstadt von Richter 1 Jericho war, das während großer Teile der Richterzeit in Trümmern lag, und haben stattdessen Tamar in der Araba oder Zoar am Südende des Toten Meeres vorgeschlagen, näher am Negev von Arad, wo sich die Keniter niederließen; die Karte zeigt beide als Nebenkandidaten. Für die drei anderen Stellen ist Jericho nicht ernsthaft umstritten."
    - "Heute baut die Oase von Jericho (Ariha) im Westjordanland noch immer Datteln zwischen ihren Bananenhainen und Zitrusbäumen an, und der Hügel Tell es-Sultan, die Stadt des Alten Testaments, erhebt sich neben der Elisa-Quelle; der Artikel über Jericho erzählt seine Geschichte."
  fr:
    - "« La ville des palmiers » est un nom que la Bible donne à Jéricho, l’oasis de la vallée du Jourdain dont les dattiers étaient célèbres dans l’Antiquité. Les Chroniques établissent clairement l’équation : les captifs relâchés par les hommes de Samarie furent conduits « à Jéricho, la ville des palmiers, auprès de leurs frères ». Du Mont Nebo, Moïse vit « la vallée de Jéricho, la ville des palmiers, jusqu’à Tsoar » ; les Kéniens, famille du beau-père de Moïse, « montèrent de la ville des palmiers, avec les fils de Juda, dans le désert de Juda » ; et Églon de Moab, avec Ammon et Amalek, « battit Israël, et ils s’emparèrent de la ville des palmiers », tenant l’oasis jusqu’à ce qu’Éhud le tue."
    - "Les palmeraies de Jéricho sont décrites par Strabon, Josèphe et Pline, et Strabon et Josèphe vantent aussi le baume de sa plaine bien arrosée ; Josèphe dit que les palmiers y étaient nombreux et de plusieurs espèces. Certains spécialistes ont douté que la ville des palmiers de Juges 1 soit Jéricho, qui était en ruine pendant une bonne partie de l’époque des juges, et ont proposé à la place Tamar dans l’Araba ou Tsoar à l’extrémité sud de la mer Morte, plus près du Négev d’Arad où s’établirent les Kéniens ; la carte montre les deux comme candidats mineurs. Pour les trois autres passages, Jéricho n’est pas sérieusement contestée."
    - "Aujourd’hui, l’oasis de Jéricho (Ariha), en Cisjordanie, produit encore des dattes parmi ses bananeraies et ses agrumes, et le tertre de Tell es-Sultan, la ville de l’Ancien Testament, s’élève près de la source d’Élisée ; l’article sur Jéricho en retrace l’histoire."
  it:
    - "«La città delle palme» è un nome che la Bibbia dà a Gerico, la città-oasi della valle del Giordano le cui palme da dattero erano famose nell’antichità. Le Cronache pongono chiaramente l’equazione: i prigionieri liberati dagli uomini di Samaria furono condotti «a Gerico, la città delle palme, dai loro fratelli». Dal Monte Nebo Mosè vide «la valle di Gerico, città delle palme, fino a Tsoar»; i Kenei, la famiglia del suocero di Mosè, «salirono dalla città delle palme, coi figliuoli di Giuda, nel deserto di Giuda»; ed Eglon di Moab, con Ammon e Amalek, «andò e batté Israele e s’impadronì della città delle palme», tenendo l’oasi finché Eud non lo uccise."
    - "I palmeti di Gerico sono descritti da Strabone, Giuseppe Flavio e Plinio, e Strabone e Giuseppe Flavio lodano anche il balsamo della sua pianura ben irrigata; Giuseppe Flavio dice che le palme vi erano numerose e di più specie. Alcuni studiosi hanno dubitato che la città delle palme di Giudici 1 fosse Gerico, rimasta in rovina per gran parte del periodo dei giudici, e hanno proposto invece Tamar nell’Araba o Soar all’estremità meridionale del Mar Morto, più vicina al Negheb di Arad dove si stabilirono i Kenei; la mappa mostra entrambe come candidati minori. Per gli altri tre passi Gerico non è seriamente discussa."
    - "Oggi l’oasi di Gerico (Ariha), in Cisgiordania, coltiva ancora datteri fra i suoi banani e agrumi, e il tell di Tell es-Sultan, la città dell’Antico Testamento, si leva accanto alla sorgente di Eliseo; l’articolo su Gerico ne racconta la storia."
  pl:
    - "„Miasto Palm” jest nazwą, jaką Biblia nadaje Jerychu, miastu oazy w dolinie Jordanu, którego palmy daktylowe były sławne w starożytności. Księga Kronik wyraźnie je utożsamia: jeńcy uwolnieni przez mężów z Samarii zostali zaprowadzeni „do Jerycha, miasta palm, do braci ich”. Z góry Nebo Mojżesz widział „równinę doliny Jerycha, miasta osadzonego palmami, aż do Segor”; Kenici, rodzina teścia Mojżesza, „wyszli z miasta Palm z synami Judowymi na puszczą Judowę”; a Eglon z Moabu, z Ammonem i Amalekiem, „ruszył się, i poraził Izraela, i opanował miasto Palm”, trzymając oazę, dopóki Ehud go nie zabił."
    - "Gaje palmowe Jerycha opisują Strabon, Józef Flawiusz i Pliniusz, a Strabon i Józef Flawiusz chwalą też balsam jego dobrze nawodnionej równiny; Józef Flawiusz mówi, że palm było tam wiele i różnych rodzajów. Niektórzy uczeni wątpili, czy miastem palm z Sdz 1 było Jerycho, które leżało w ruinie przez znaczną część okresu sędziów, i proponowali zamiast tego Tamar w Arabie lub Soar na południowym krańcu Morza Martwego, bliżej Negewu Aradu, gdzie osiedlili się Kenici; mapa pokazuje oba jako kandydatów drugorzędnych. W pozostałych trzech miejscach Jerycho nie budzi poważnych wątpliwości."
    - "Dziś oaza Jerycha (Ariha) na Zachodnim Brzegu nadal uprawia daktyle wśród gajów bananowych i cytrusowych, a kopiec Tell es-Sultan, starotestamentowe miasto, wznosi się obok źródła Elizeusza; artykuł o Jerychu opowiada jego dzieje."
  nl:
    - "“De Palmstad” is een naam die de Bijbel aan Jericho geeft, de oasestad in de Jordaanvallei wier dadelpalmen in de oudheid beroemd waren. Kronieken maakt de gelijkstelling duidelijk: de gevangenen die door de mannen van Samaria werden vrijgelaten, werden gebracht “te Jericho, de Palmstad, bij hun broederen”. Vanaf de berg Nebo zag Mozes “het effen veld der vallei van Jericho, de palmstad, tot Zoar toe”; de Kenieten, de familie van Mozes' schoonvader, “togen ook uit de Palmstad op, met de kinderen van Juda, naar de woestijn van Juda”; en Eglon van Moab, met Ammon en Amalek, “toog heen, en sloeg Israël, en zij namen de Palmstad in bezit”, en hield de oase vast tot Ehud hem doodde."
    - "Jericho's palmbossen worden beschreven door Strabo, Flavius Josephus en Plinius, en Strabo en Josephus prijzen ook de balsem van de goed bewaterde vlakte; Josephus zegt dat de palmen daar talrijk waren en van verschillende soorten. Sommige geleerden hebben betwijfeld dat de palmstad van Richteren 1 Jericho was, dat een groot deel van de richterentijd in puin lag, en hebben in plaats daarvan Tamar in de Araba voorgesteld, of Zoar aan de zuidkant van de Dode Zee, dichter bij de Negev van Arad waar de Kenieten zich vestigden; de kaart toont beide als kleine kandidaten. Voor de andere drie passages wordt Jericho niet serieus betwist."
    - "Tegenwoordig kweekt de oase van Jericho (Ariha) op de Westelijke Jordaanoever nog steeds dadels te midden van bananenplantages en citrusvruchten, en de heuvel van Tell es-Sultan, de oudtestamentische stad, verheft zich naast de bron van Elisa; het artikel over Jericho vertelt haar geschiedenis."
  cs:
    - "„Město palmové“ je jméno, které Bible dává Jerichu, oáze v údolí Jordánu, jejíž datlové palmy byly ve starověku proslulé. Letopisy to říkají zcela jasně: zajatci propuštění muži Samaří byli dovedeni „do Jericha města palmového k bratřím jejich“. Z hory Nebo viděl Mojžíš „roviny údolí Jericha, města palmovím osazeného, až do Segor“; Kénejci, rod Mojžíšova tchána, „odebrali se z města palmového s syny Juda na poušť Judovu“; a Eglon Moábský, s Amónem a Amalekem, „vytáh, porazil Izraele, a opanovali město palmové“ a držel oázu, dokud ho Ehúd nezabil."
    - "Jerišské palmové háje popisují Strabón, Josephus a Plinius; Strabón a Josephus chválí i balzám jeho dobře zavlažené roviny; Josephus praví, že palem tam bylo mnoho a několika druhů. Někteří badatelé pochybovali, že městem palem z Sd 1 bylo Jericho, které leželo v rozvalinách po větší část doby soudců, a navrhli místo něj Tamar v Arabě nebo Soar na jižním konci Mrtvého moře, blíže Negevu u Aradu, kde se Kénejci usadili; mapa ukazuje oba jako vedlejší kandidáty. U ostatních tří míst není Jericho vážně sporné."
    - "Dnes oáza Jericha (Ariha) na Západním břehu dosud pěstuje datle mezi svými banánovníkovými háji a citrusy a pahorek Tell es-Sultan, město Starého zákona, se tyčí vedle Elíšova pramene; článek o Jerichu vypráví jeho dějiny."
  sv:
    - "”Palmstaden” är ett namn som Bibeln ger Jeriko, oasstaden i Jordandalen vars dadelpalmer var berömda i antiken. Krönikeboken gör likställandet tydligt: fångarna som männen i Samaria frigav fördes ”till Jeriko, Palmstaden, till deras bröder där”. Från berget Nebo såg Mose ”Jordanslätten, det är lågslätten vid Jeriko – Palmstaden – ända till Soar”; kainéerna, släkten till Moses svärfader, ”hade dragit upp från Palmstaden med Juda barn till Juda öken”; och Eglon av Moab tågade med Ammon och Amalek ”åstad och slog Israel, varefter de intogo Palmstaden” och höll oasen tills Ehud dödade honom."
    - "Jerikos palmlundar beskrivs av Strabon, Josefus och Plinius, och Strabon och Josefus prisar också balsamen på dess välbevattnade slätt; Josefus säger att palmerna där var många och av flera slag. Några forskare har betvivlat att Palmstaden i Domarboken 1 var Jeriko, som låg i ruiner under stora delar av domartiden, och har i stället föreslagit Tamar i Arava eller Soar vid Döda havets södra ände, närmare Arads Negev där kainéerna bosatte sig; kartan visar båda som mindre kandidater. För de andra tre ställena är Jeriko inte seriöst ifrågasatt."
    - "I dag odlar oasen Jeriko (Ariha) på Västbanken fortfarande dadlar bland sina bananlundar och citrusfrukter, och kullen Tell es-Sultan, Gamla testamentets stad, reser sig intill Elishas källa; artikeln om Jeriko berättar dess historia."
  nb:
    - "«Palmebyen» er et navn Bibelen gir Jeriko, oasebyen i Jordandalen hvis daddelpalmer var berømte i oldtiden. Krønikebøkene gjør sammenstillingen tydelig: fangene som folkene i Samaria slapp fri, ble ført «til Jeriko, Palmestaden, til deres brødre». Fra Nebo så Moses «Jordan-sletten, dalen ved Jeriko – Palmestaden – like til Soar»; kenittene, slekten til Moses' svoger, «drog med Judas barn fra Palmestaden op til Juda ørken»; og Eglon av Moab, sammen med Ammon og Amalek, «drog ut og slo Israel, og de inntok Palmestaden», og holdt oasen til Ehud drepte ham."
    - "Jerikos palmelunder beskrives av Strabon, Josefus og Plinius, og Strabon og Josefus priser også balsamen fra den velvannede sletten; Josefus sier at palmene der var mange og av flere slag. Noen forskere har tvilt på at palmebyen i Dommerboken 1 var Jeriko, som lå i ruiner gjennom store deler av dommertiden, og har i stedet foreslått Tamar i Arava eller Soar i sørenden av Dødehavet, nærmere Negev ved Arad der kenittene slo seg ned; kartet viser begge som mindre kandidater. For de tre andre tekstene er Jeriko ikke alvorlig omstridt."
    - "I dag dyrker oasen Jeriko (Ariha) på Vestbredden fremdeles daddel blant bananlunder og sitrus, og haugen Tell es-Sultan, den gammeltestamentlige byen, reiser seg ved Elisjas kilde; artikkelen om Jeriko forteller dens historie."
  tl:
    - "Ang “bayan ng mga puno ng palma” ay pangalang ibinibigay ng Bibliya sa Jerico, ang bayang-oasis ng libis ng Jordan na bantog noong sinaunang panahon dahil sa mga palma ng datiles. Malinaw na itinutumbas ito ng Mga Cronica: ang mga bihag na pinalaya ng mga lalaki ng Samaria ay dinala “sa Jerico, na bayan ng mga puno ng palma, sa kanilang mga kapatid”. Mula sa Bundok Nebo, nakita ni Moises ang “Kapatagan ng libis ng Jerico na bayan ng mga puno ng palma hanggang sa Soar”; ang mga Cineo, ang angkan ng biyenan ni Moises, ay “umahon sa bayan ng mga puno ng palma na kasama ng mga anak ni Juda sa ilang ng Juda”; at si Eglon ng Moab, kasama ang Ammon at Amalec, “yumaon at sinaktan niya ang Israel, at kanilang inari ang bayan ng mga puno ng palma”, at hinawakan ang oasis hanggang patayin siya ni Aod."
    - "Inilalarawan nina Strabo, Josefo at Plinio ang mga palmahan ng Jerico, at pinupuri rin nina Strabo at Josefo ang balsamo ng mabuting-patubig nitong kapatagan; sinasabi ni Josefo na marami at iba't iba ang uri ng mga palma roon. Pinagdududahan ng ilang iskolar na ang bayan ng mga palma sa Mga Hukom 1 ay Jerico, na wasak sa malaking bahagi ng panahon ng mga hukom, at iminungkahi sa halip ang Tamar sa Araba o ang Zoar sa timog dulo ng Dagat na Patay, na mas malapit sa Negeb ng Arad kung saan nanirahan ang mga Cineo; ipinapakita ng mapa ang dalawa bilang maliliit na kandidato. Sa iba pang tatlong talata, hindi seryosong pinagtatalunan ang Jerico."
    - "Ngayon, ang oasis ng Jerico (Ariha) sa West Bank ay nagtatanim pa rin ng datiles sa gitna ng mga saging at sitrus, at ang tel ng Tell es-Sultan, ang lungsod ng Lumang Tipan, ay nakatayo sa tabi ng bukal ni Eliseo; isinasalaysay ng artikulo tungkol sa Jerico ang kasaysayan nito."
