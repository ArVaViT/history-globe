# Overview article (ADR 0007). Manahath = Malha in south-west Jerusalem, after the excavators of 1987–1989 (the map's point); the Manahethites of 1 Chr 2 are linked with it as is usual. Plain facts only about the modern site.
id: manahath
place: a6e2c95
