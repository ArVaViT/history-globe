body:
  en:
    - "Manahath appears in the genealogies of Chronicles as the place to which certain families of Benjamin were moved: “these are the sons of Ehud: these are the heads of the fathers of the inhabitants of Geba, and they removed them to Manahath”. The Manahethites of Judah, listed among the descendants of Salma with Bethlehem and the Netophathites, are usually taken to be its people. It is believed to have stood at Malha, on a ridge in south-west Jerusalem, whose Arabic village al-Maliha kept a similar name."
    - "Excavations by the Israel Antiquities Authority at Malha in 1987–1989, before the building of the shopping mall and the Biblical Zoo, uncovered a village of the Middle Bronze Age, about 1800–1700 BC, with houses, terraces and stone mounds, built over remains of the Intermediate Bronze Age, about 2200–2100 BC; the excavators identified the site with Manahath. The Arab village of al-Maliha was occupied in the fighting of 1948; Malha is today a neighbourhood of Jerusalem."
  ru:
    - "Манахаф встречается в родословиях Паралипоменона как место, куда были переселены некоторые роды Вениамина: «вот сыновья Егуда, которые были главами родов, живших в Геве и переселенных в Манахаф». Менухотян Иуды, перечисленных среди потомков Салмы вместе с вифлеемлянами и нетофафянами, обычно считают его жителями. Полагают, что он стоял в Мальхе, на гряде в юго-западной части Иерусалима, где арабская деревня эль-Малиха сохраняла сходное имя."
    - "Раскопки Управления древностей Израиля в Мальхе в 1987–1989 гг., перед постройкой торгового центра и Библейского зоопарка, открыли селение среднего бронзового века, около 1800–1700 гг. до н. э., с домами, террасами и каменными насыпями, построенное над остатками промежуточного бронзового века, около 2200–2100 гг. до н. э.; раскопщики отождествили место с Манахафом. Арабская деревня эль-Малиха была занята в боях 1948 г.; ныне Мальха — район Иерусалима."
  uk:
    - "Манахат з'являється в родоводах Хронік як місце, куди переселили деякі родини Веніяміна: «А це сини Егудові, що були головами в родах, що жили в Геві, а переселились у Манахат». Манахатян Юди, перелічених серед нащадків Салми разом із Віфлеємом і нетофатянами, зазвичай вважають його мешканцями. Вважають, що він стояв у Малсі, на хребті на південному заході Єрусалима, чиє арабське село аль-Маліха зберегло схожу назву."
    - "Розкопки Управління старожитностей Ізраїлю в Малсі в 1987–1989 рр., перед будівництвом торгового центру й Біблійного зоопарку, виявили село середньої бронзової доби, близько 1800–1700 рр. до н. е., з будинками, терасами й кам'яними насипами, збудоване над залишками проміжної бронзової доби, близько 2200–2100 рр. до н. е.; розкопувачі ототожнили місце з Манахатом. Арабське село аль-Маліха було зайняте під час боїв 1948 р.; Малха — нині район Єрусалима."
  es:
    - "Manahat aparece en las genealogías de Crónicas como el lugar al que fueron trasladadas ciertas familias de Benjamín: «estos son los hijos de Ehud, estos las cabezas de padres que habitaron en Gabaa, y fueron trasportados á Manahath». Los manahetitas de Judá, enumerados entre los descendientes de Salma con Belén y los netofatitas, suelen tomarse por su gente. Se cree que se alzó en Malha, en una cresta del suroeste de Jerusalén, cuya aldea árabe al-Maliha conservó un nombre parecido."
    - "Las excavaciones de la Autoridad de Antigüedades de Israel en Malha en 1987–1989, antes de la construcción del centro comercial y del Zoo Bíblico, sacaron a la luz una aldea del Bronce Medio, hacia 1800–1700 a. C., con casas, terrazas y montones de piedras, construida sobre restos del Bronce Intermedio, hacia 2200–2100 a. C.; los excavadores identificaron el lugar con Manahat. La aldea árabe de al-Maliha fue ocupada en los combates de 1948; Malha es hoy un barrio de Jerusalén."
  pt:
    - "Manaate aparece nas genealogias de Crônicas como o lugar para onde foram levadas certas famílias de Benjamim: “Estes são os filhos de Eúde. Estes são os chefes de casas paternas dos habitantes de Geba, que foram levados cativos para Manaate”. Os manaatitas de Judá, listados entre os descendentes de Salma com Belém e os netofatitas, são geralmente tomados por seu povo. Acredita-se que ficava em Malha, numa cordilheira no sudoeste de Jerusalém, cuja aldeia árabe al-Maliha conservou um nome semelhante."
    - "Escavações da Autoridade de Antiguidades de Israel em Malha em 1987–1989, antes da construção do shopping center e do Zoológico Bíblico, revelaram uma aldeia da Idade do Bronze Médio, por volta de 1800–1700 a.C., com casas, terraços e montes de pedras, construída sobre restos do Bronze Intermediário, por volta de 2200–2100 a.C.; os escavadores identificaram o sítio com Manaate. A aldeia árabe de al-Maliha foi ocupada nos combates de 1948; Malha é hoje um bairro de Jerusalém."
  de:
    - "Manahat erscheint in den Genealogien der Chronik als der Ort, in den bestimmte Familien Benjamins versetzt wurden: „Dies sind die Kinder Ehuds (die da Häupter waren der Vaterhäuser unter den Bürgern zu Geba und zogen weg gen Manahath“. Die Manahatiter Judas, unter den Nachkommen Salmas mit Bethlehem und den Netofatitern aufgeführt, werden gewöhnlich für seine Bewohner gehalten. Man nimmt an, es habe bei Malcha gestanden, auf einem Höhenzug im Südwesten Jerusalems, dessen arabisches Dorf al-Maliha einen ähnlichen Namen bewahrte."
    - "Grabungen der israelischen Altertümerbehörde in Malcha 1987–1989, vor dem Bau des Einkaufszentrums und des Biblischen Zoos, legten ein Dorf der Mittelbronzezeit, etwa 1800–1700 v. Chr., mit Häusern, Terrassen und Steinhügeln frei, über Resten der Zwischenbronzezeit, etwa 2200–2100 v. Chr. gebaut; die Ausgräber setzten die Stätte mit Manahat gleich. Das arabische Dorf al-Maliha wurde in den Kämpfen von 1948 besetzt; Malcha ist heute ein Stadtteil Jerusalems."
  fr:
    - "Manahath apparaît dans les généalogies des Chroniques comme le lieu où furent transportées certaines familles de Benjamin : « Voici les fils d’Échud, qui étaient chefs de famille parmi les habitants de Guéba, et qui les transportèrent à Manachath ». Les Manahétiens de Juda (Hatsi-Hammanachthi dans Louis Segond), cités parmi les descendants de Salma avec Bethléem et les Nethophatiens, passent d’ordinaire pour ses habitants. On croit qu’elle se dressait à Malha, sur une crête du sud-ouest de Jérusalem, dont le village arabe d’al-Maliha garda un nom semblable."
    - "Les fouilles de l’Autorité des antiquités d’Israël à Malha en 1987–1989, avant la construction du centre commercial et du Zoo biblique, ont mis au jour un village du Bronze moyen, vers 1800–1700 av. J.-C., avec maisons, terrasses et tertres de pierre, bâti sur des vestiges du Bronze intermédiaire, vers 2200–2100 av. J.-C. ; les fouilleurs ont identifié le site avec Manahath. Le village arabe d’al-Maliha fut occupé lors des combats de 1948 ; Malha est aujourd’hui un quartier de Jérusalem."
  it:
    - "Manaat compare nelle genealogie delle Cronache come il luogo dove furono trasferite alcune famiglie di Beniamino: «Questi sono i figliuoli di Ehud, che erano capi delle famiglie che abitavano Gheba e che furon trasportati schiavi a Manahath». I Manahatei di Giuda, elencati tra i discendenti di Salma con Betlemme e i Netofatei, sono di solito ritenuti i suoi abitanti. Si crede che sorgesse a Malha, su una dorsale nel sud-ovest di Gerusalemme, il cui villaggio arabo al-Maliha conservava un nome simile."
    - "Gli scavi dell’Israel Antiquities Authority a Malha nel 1987–1989, prima della costruzione del centro commerciale e dello Zoo Biblico, portarono alla luce un villaggio della media età del Bronzo, circa 1800–1700 a.C., con case, terrazze e tumuli di pietre, costruito sopra resti dell’età del Bronzo intermedia, circa 2200–2100 a.C.; gli scavatori identificarono il sito con Manaat. Il villaggio arabo di al-Maliha fu occupato nei combattimenti del 1948; Malha è oggi un quartiere di Gerusalemme."
  nl:
    - "Manahat komt voor in de genealogieën van Kronieken als de plaats waarheen sommige families van Benjamin werden overgebracht: “Dezen nu zijn de kinderen van Ehud; dezen waren hoofden der vaderen van de inwoners te Geba, en hij voerde hen over naar Manahath”. De Manathieten van Juda, vermeld onder de nakomelingen van Salma met Bethlehem en de Netofathieten, worden gewoonlijk voor zijn bewoners gehouden. Het wordt verondersteld te hebben gestaan bij Malha, op een bergrug in het zuidwesten van Jeruzalem, waarvan het Arabische dorp al-Maliha een gelijkaardige naam bewaarde."
    - "Opgravingen van de Israel Antiquities Authority te Malha in 1987–1989, vóór de bouw van het winkelcentrum en de Biblical Zoo, brachten een dorp uit de midden-bronstijd aan het licht, ongeveer 1800–1700 v.Chr., met huizen, terrassen en steenhopen, gebouwd over resten uit de tussenliggende bronstijd, ongeveer 2200–2100 v.Chr.; de opgravers vereenzelvigden de plaats met Manahat. Het Arabische dorp al-Maliha werd in de gevechten van 1948 ingenomen; Malha is tegenwoordig een wijk van Jeruzalem."
  pl:
    - "Manachat pojawia się w rodowodach Kronik jako miejsce, dokąd przeniesiono pewne rodziny Beniamina: „A cić są synowie Echudowi: ci są książętami narodów mieszkających w Gabaa, którzy je przenieśli do Manakat”. Manachatczyków z Judy, wymienionych wśród potomków Salmy obok Betlejem i Netofatczyków, uważa się zwykle za jej mieszkańców. Sądzi się, że stało w Malcha, na grzbiecie w południowo-zachodniej Jerozolimie; arabska wieś al-Maliha zachowała podobną nazwę."
    - "Wykopaliska Izraelskiej Służby Starożytności w Malcha w latach 1987-1989, przed budową centrum handlowego i Biblijnego Zoo, odsłoniły wieś ze średniego brązu, około 1800-1700 p.n.e., z domami, tarasami i kamiennymi kopcami, zbudowaną na pozostałościach brązu przejściowego, około 2200-2100 p.n.e.; badacze utożsamili stanowisko z Manachat. Arabską wieś al-Maliha zajęto w walkach 1948 roku; Malcha jest dziś dzielnicą Jerozolimy."
  cs:
    - "Manachat se objevuje v rodokmenech Paralipomena jako místo, kam byly přestěhovány určité rodiny Benjamínovy: „Ti jsou synové Echudovi, ti jsou knížata čeledí otcovských, bydlících v Gabaa, kteříž je uvedli do Manáhat“. Manachetští z Judy, uvedení mezi potomky Salmy spolu s Betlémem a Netofatskými, se obvykle pokládají za jeho obyvatele. Má se za to, že stálo v Malše, na hřebeni v jihozápadním Jeruzalémě, jehož arabská vesnice al-Maliha zachovala podobné jméno."
    - "Vykopávky Izraelského úřadu pro starožitnosti v Malše v letech 1987–1989, před stavbou obchodního centra a Biblické zoo, odkryly vesnici ze střední doby bronzové, asi 1800–1700 př. n. l., s domy, terasami a kamennými mohylami, postavenou nad pozůstatky z přechodné doby bronzové, asi 2200–2100 př. n. l.; vykopávači místo ztotožnili s Manachatem. Arabská vesnice al-Maliha byla obsazena v bojích roku 1948; Malcha je dnes čtvrtí Jeruzaléma."
  sv:
    - "Manachat förekommer i Krönikeböckernas släktregister som platsen dit vissa benjaminitiska familjer flyttades: ”Och dessa voro Ehuds söner, och de voro familjehuvudmän för dem som bodde i Geba, och som blevo bortförda till Manahat”. Judas manachatiter, upptagna bland Salmas ättlingar med Betlehem och netofatiterna, antas vara dess folk. Den tros ha legat vid Malha, på en rygg i sydvästra Jerusalem, vars arabiska by al-Maliha bevarade ett liknande namn."
    - "Utgrävningar av Israel Antiquities Authority vid Malha 1987–1989, före bygget av köpcentret och Biblical Zoo, grävde fram en by från mellersta bronsåldern, omkring 1800–1700 f.Kr., med hus, terrasser och stenhögar, byggd över lämningar från den mellanliggande bronsåldern, omkring 2200–2100 f.Kr.; utgrävarna identifierade platsen med Manachat. Den arabiska byn al-Maliha ockuperades under striderna 1948; Malha är i dag en stadsdel i Jerusalem."
  nb:
    - "Manahat forekommer i slektstavlene i Krønikebøkene som stedet noen benjaminittiske familier ble flyttet til: «Og dette var Ehuds sønner, som var familiehoder blandt Gebas innbyggere, og som blev bortført til Manahat». Manahtittene i Juda, oppført blant Salmas etterkommere sammen med Betlehem og netofatittene, regnes vanligvis for å være dens folk. Man tror at den lå ved Malha, på en rygg i sørvestlige Jerusalem, hvis arabiske landsby al-Maliha bevarte et liknende navn."
    - "Utgravninger ved Israels oldtidsmyndighet i Malha i 1987–1989, før kjøpesenteret og den bibelske zoo ble bygget, avdekket en landsby fra mellombronsealderen, omkring 1800–1700 f.Kr., med hus, terrasser og steinhauger, bygget over levninger fra den mellomliggende bronsealderen, omkring 2200–2100 f.Kr.; utgraverne identifiserte stedet med Manahat. Den arabiske landsbyen al-Maliha ble inntatt under kampene i 1948; Malha er i dag en bydel i Jerusalem."
