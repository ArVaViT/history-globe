# Overview article (ADR 0007). Mainstream facts only; the location on the Western Hill is the usual view and is said to be a reconstruction; the Russian Bible's renderings are noted.
id: second-quarter
place: a5ab519
title:
  en: "Second Quarter"
  ru: "Вторая часть"
  uk: "Друга частина"
  es: "Segundo Barrio"
  pt: "Segundo Bairro"
  de: "Zweiter Stadtteil"
  fr: "Second quartier"
body:
  en:
    - "The Second Quarter, in Hebrew the Mishneh, was a district of Jerusalem in the last century of the kingdom of Judah. When the book of the law was found in the temple in Josiah's eighteenth year, 622 BC, Hilkiah the priest and the king's officers went to the prophetess Huldah, “now she dwelt in Jerusalem in the college”, as the King James Bible has it after an old Jewish reading; the Hebrew says “in the Mishneh”, the Second, and the Russian Bible “in the second part”. Zephaniah, Josiah's contemporary, hears on the day of the LORD “the noise of a cry from the fish gate, and an howling from the second, and a great crashing from the hills”, naming the quarter beside the gate on the north side of the city. Nehemiah's list says Judah the son of Senuah was “second over the city”, which some read as “over the Second Quarter”."
    - "Archaeology has given the name a place. In the eighth century BC Jerusalem spread from the old ridge of the City of David and the Temple Mount across the valley onto the Western Hill, perhaps swollen by refugees after the fall of Samaria in 722 BC. In 1970 Nahman Avigad found in the Jewish Quarter a wall seven metres thick, the Broad Wall, built by Hezekiah to enclose the new suburb; Isaiah speaks of houses pulled down to build it. The Mishneh is usually taken to be this new quarter on the Western Hill, west of the temple, though the Bible never draws its bounds."
    - "Today the Second Quarter is the Jewish Quarter of the Old City, where a stretch of the Broad Wall lies open to view below the modern houses."
  ru:
    - "Вторая часть, по-еврейски Мишне, — район Иерусалима в последнее столетие Иудейского царства. Когда в восемнадцатый год Иосии, в 622 г. до н. э., в храме нашли книгу закона, священник Хелкия и царские слуги пошли к пророчице Олдаме: «жила же она в Иерусалиме, во второй части». Английская Библия короля Иакова по старому иудейскому толкованию пишет «в училище». Софония, современник Иосии, слышит в день Господень вопль у Рыбных ворот, рыдание из второй части и великое разрушение на холмах, называя квартал у ворот на северной стороне города; русская Библия передаёт это как «рыдание у других ворот». Список Неемии говорит, что Иуда, сын Сенуи, был «вторым над городом», что некоторые читают как «над второй частью»."
    - "Археология дала имени место. В VIII веке до н. э. Иерусалим вышел со старого гребня города Давидова и храмовой горы через долину на Западный холм, возможно, разросшись от беженцев после падения Самарии в 722 г. до н. э. В 1970 году Нахман Авигад нашёл в Еврейском квартале стену толщиной семь метров, Широкую стену, которую Езекия построил, чтобы обнести новый пригород; Исаия говорит о домах, разобранных ради её постройки. Мишне обычно считают этим новым кварталом на Западном холме, к западу от храма, хотя Библия нигде не очерчивает его границ."
    - "Сегодня Вторая часть — Еврейский квартал Старого города, где отрезок Широкой стены открыт для обозрения под современными домами."
  uk:
    - "Друга частина, івритом Мішне, була районом Єрусалима в останнє століття царства Юди. Коли в храмі знайшли книгу закону на вісімнадцятому році Йосії, у 622 р. до н. е., священник Хелкія й царські урядовці пішли до пророчиці Хулди, яка, за Біблією короля Якова, що йде за давнім єврейським прочитанням, жила в Єрусалимі «в колегії»; в івриті ж стоїть «у Мішне», тобто «у Другій», а в Біблії Куліша — «в другій частї». Софонія, сучасник Йосії, у день Господній чує «крик від Рибалчиної брами й риданнє від других воріт» (в івриті — «від Другої») і «велике зворушеннє по всїх узгірях», називаючи цю частину поруч із брамою на північній стороні міста. Список Неемії каже, що «Юда, син Сенуїн, був другим над містом», що дехто читає як «над Другою частиною»."
    - "Археологія дала цій назві місце. У VIII ст. до н. е. Єрусалим розрісся зі старого хребта Міста Давида й Храмової гори через долину на Західний пагорб, можливо, роздутий біженцями після падіння Самарії в 722 р. до н. е. У 1970 р. Нахман Авігад знайшов в Єврейському кварталі стіну завтовшки сім метрів, Широку стіну, збудовану Єзекією, щоб оточити нове передмістя; Ісая говорить про зруйновані будинки, з яких її будували. Мішне зазвичай вважають цією новою частиною на Західному пагорбі, на захід від храму, хоча Біблія ніде не визначає її меж."
    - "Нині Друга частина — це Єврейський квартал Старого міста, де відрізок Широкої стіни відкритий для огляду під сучасними будинками."
  es:
    - "El Segundo Barrio, en hebreo la Mishné, era un distrito de Jerusalén en el último siglo del reino de Judá. Cuando se halló el libro de la ley en el templo en el año dieciocho de Josías, 622 a. C., el sacerdote Hilcías y los oficiales del rey fueron a la profetisa Hulda, «la cual moraba en Jerusalem en el colegio», como lo tiene la King James Bible según una antigua lectura judía; el hebreo dice «en la Mishné», la Segunda, y la Biblia rusa «en la segunda parte». Sofonías, contemporáneo de Josías, oye en el día del Señor «voz de clamor desde la puerta del pescado, y aullido desde la segunda, y grande quebrantamiento desde los collados», nombrando el barrio junto a la puerta del lado norte de la ciudad. La lista de Nehemías dice que Judá hijo de Senuá era «el segundo en la ciudad», lo que algunos leen como «sobre el Segundo Barrio»."
    - "La arqueología ha dado un lugar al nombre. En el siglo VIII a. C. Jerusalén se extendió desde la antigua cresta de la Ciudad de David y el monte del Templo a través del valle hasta la Colina Occidental, quizá engrosada por refugiados tras la caída de Samaria en 722 a. C. En 1970 Nahman Avigad halló en el Barrio Judío un muro de siete metros de grosor, el Muro Ancho, construido por Ezequías para cercar el nuevo suburbio; Isaías habla de casas derribadas para edificarlo. La Mishné suele tomarse por este nuevo barrio de la Colina Occidental, al oeste del templo, aunque la Biblia nunca traza sus límites."
    - "Hoy el Segundo Barrio es el Barrio Judío de la Ciudad Vieja, donde un tramo del Muro Ancho queda a la vista bajo las casas modernas."
  pt:
    - "O Segundo Bairro, em hebraico Mishné, era um distrito de Jerusalém no último século do reino de Judá. Quando o livro da lei foi achado no templo, no décimo oitavo ano de Josias, 622 a.C., o sacerdote Hilquias e os oficiais do rei foram à profetisa Hulda, “ora, ela morava em Jerusalém no colégio”, como diz a Bíblia King James segundo uma antiga leitura judaica; o hebraico diz “no Mishné”, o Segundo, e a Bíblia russa “na segunda parte”. Sofonias, contemporâneo de Josias, ouve no dia do SENHOR “um grito vindo da Porta dos Peixes, um lamento vindo do segundo distrito e um grande estrondo vindo das colinas”, nomeando o bairro junto à porta do lado norte da cidade. A lista de Neemias diz que Judá, filho de Hassenuá, era “o segundo no comando da cidade”, o que alguns leem como “sobre o Segundo Bairro”."
    - "A arqueologia deu um lugar ao nome. No século VIII a.C. Jerusalém se estendeu da antiga crista da Cidade de Davi e do Monte do Templo, atravessando o vale, até a Colina Ocidental, talvez inchada por refugiados depois da queda de Samaria em 722 a.C. Em 1970, Nahman Avigad achou no Bairro Judeu um muro de sete metros de espessura, o Muro Largo, construído por Ezequias para cercar o novo subúrbio; Isaías fala de casas derrubadas para construí-lo. O Mishné costuma ser tomado por esse novo bairro na Colina Ocidental, a oeste do templo, embora a Bíblia nunca trace seus limites."
    - "Hoje o Segundo Bairro é o Bairro Judeu da Cidade Velha, onde um trecho do Muro Largo está aberto à vista, abaixo das casas modernas."
  de:
    - "Der Zweite Stadtteil, hebräisch die Mischne, war ein Bezirk Jerusalems im letzten Jahrhundert des Königreichs Juda. Als im achtzehnten Jahr Josias, 622 v. Chr., das Gesetzbuch im Tempel gefunden wurde, gingen der Priester Hilkija und die Beamten des Königs zur Prophetin Hulda, „und sie wohnte zu Jerusalem im andern Teil“; die King-James-Bibel hat nach einer alten jüdischen Lesart „in the college“, der hebräische Text sagt „in der Mischne“, dem Zweiten, und die russische Bibel „im zweiten Teil“. Zefanja, Josias Zeitgenosse, hört am Tag des HERRN „ein lautes Geschrei … von dem Fischtor her und ein Geheul von dem andern Teil der Stadt und ein großer Jammer von den Hügeln“ und nennt so den Stadtteil beim Tor an der Nordseite. Nehemias Liste sagt, Juda, der Sohn Hasnuas, sei „über den andern Teil der Stadt“ gewesen, was manche als „über den Zweiten Stadtteil“ lesen."
    - "Die Archäologie hat dem Namen einen Ort gegeben. Im 8. Jahrhundert v. Chr. breitete sich Jerusalem vom alten Höhenzug der Davidsstadt und des Tempelbergs über das Tal auf den Westhügel aus, vielleicht angeschwollen durch Flüchtlinge nach dem Fall Samarias 722 v. Chr. Im Jahr 1970 fand Nahman Avigad im Jüdischen Viertel eine sieben Meter dicke Mauer, die Breite Mauer, die Hiskia baute, um den neuen Vorort zu umschließen; Jesaja spricht von Häusern, die zu ihrem Bau abgerissen wurden. Die Mischne gilt meist als dieser neue Stadtteil auf dem Westhügel, westlich des Tempels, obwohl die Bibel seine Grenzen nie zieht."
    - "Heute ist der Zweite Stadtteil das Jüdische Viertel der Altstadt, wo ein Stück der Breiten Mauer unterhalb der modernen Häuser offen zu sehen ist."
  fr:
    - "Le Second quartier, en hébreu la Mishné, était un quartier de Jérusalem dans le dernier siècle du royaume de Juda. Quand le livre de la loi fut trouvé au temple la dix-huitième année de Josias, en 622 av. J.-C., le prêtre Hilkija et les officiers du roi allèrent auprès de la prophétesse Hulda : « Elle habitait à Jérusalem, dans l’autre quartier de la ville » (Louis Segond) ; la King James met « in the college » d’après une ancienne lecture juive, la Bible russe « dans la seconde partie » ; l’hébreu « dans la Mishné », le Second. Sophonie, contemporain de Josias, entend au jour de l’Éternel « des cris à la porte des poissons, des lamentations dans l’autre quartier de la ville, et un grand désastre sur les collines », nommant le quartier près de la porte au nord de la ville. Chez Néhémie, Juda, fils de Senua, était « le second chef de la ville », que certains lisent « du Second quartier »."
    - "L’archéologie a donné un lieu au nom. Au VIIIe siècle av. J.-C., Jérusalem s’étendit de l’ancienne crête de la Cité de David et du mont du Temple à travers la vallée jusqu’à la colline occidentale, peut-être enflée par les réfugiés après la chute de Samarie en 722 av. J.-C. En 1970, Nahman Avigad découvrit dans le quartier juif un mur épais de sept mètres, la Muraille large, bâtie par Ézéchias pour enclore le nouveau faubourg ; Ésaïe parle de maisons abattues pour la construire. La Mishné est d’ordinaire tenue pour ce nouveau quartier de la colline occidentale, à l’ouest du temple, bien que la Bible n’en trace jamais les limites."
    - "Aujourd’hui, le Second quartier est le quartier juif de la Vieille Ville, où un tronçon de la Muraille large est visible sous les maisons modernes."
