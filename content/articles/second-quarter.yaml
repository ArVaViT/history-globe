# Overview article (ADR 0007). Mainstream facts only; the location on the Western Hill is the usual view and is said to be a reconstruction; the Russian Bible's renderings are noted.
id: second-quarter
place: a5ab519
title:
  en: "Second Quarter"
  ru: "Вторая часть"
body:
  en:
    - "The Second Quarter, in Hebrew the Mishneh, was a district of Jerusalem in the last century of the kingdom of Judah. When the book of the law was found in the temple in Josiah's eighteenth year, 622 BC, Hilkiah the priest and the king's officers went to the prophetess Huldah, “now she dwelt in Jerusalem in the college”, as the King James Bible has it after an old Jewish reading; the Hebrew says “in the Mishneh”, the Second, and the Russian Bible “in the second part”. Zephaniah, Josiah's contemporary, hears on the day of the LORD “the noise of a cry from the fish gate, and an howling from the second, and a great crashing from the hills”, naming the quarter beside the gate on the north side of the city. Nehemiah's list says Judah the son of Senuah was “second over the city”, which some read as “over the Second Quarter”."
    - "Archaeology has given the name a place. In the eighth century BC Jerusalem spread from the old ridge of the City of David and the Temple Mount across the valley onto the Western Hill, perhaps swollen by refugees after the fall of Samaria in 722 BC. In 1970 Nahman Avigad found in the Jewish Quarter a wall seven metres thick, the Broad Wall, built by Hezekiah to enclose the new suburb; Isaiah speaks of houses pulled down to build it. The Mishneh is usually taken to be this new quarter on the Western Hill, west of the temple, though the Bible never draws its bounds."
    - "Today the Second Quarter is the Jewish Quarter of the Old City, where a stretch of the Broad Wall lies open to view below the modern houses."
  ru:
    - "Вторая часть, по-еврейски Мишне, — район Иерусалима в последнее столетие Иудейского царства. Когда в восемнадцатый год Иосии, в 622 г. до н. э., в храме нашли книгу закона, священник Хелкия и царские слуги пошли к пророчице Олдаме: «жила же она в Иерусалиме, во второй части». Английская Библия короля Иакова по старому иудейскому толкованию пишет «в училище». Софония, современник Иосии, слышит в день Господень вопль у Рыбных ворот, рыдание из второй части и великое разрушение на холмах, называя квартал у ворот на северной стороне города; русская Библия передаёт это как «рыдание у других ворот». Список Неемии говорит, что Иуда, сын Сенуи, был «вторым над городом», что некоторые читают как «над второй частью»."
    - "Археология дала имени место. В VIII веке до н. э. Иерусалим вышел со старого гребня города Давидова и храмовой горы через долину на Западный холм, возможно, разросшись от беженцев после падения Самарии в 722 г. до н. э. В 1970 году Нахман Авигад нашёл в Еврейском квартале стену толщиной семь метров, Широкую стену, которую Езекия построил, чтобы обнести новый пригород; Исаия говорит о домах, разобранных ради её постройки. Мишне обычно считают этим новым кварталом на Западном холме, к западу от храма, хотя Библия нигде не очерчивает его границ."
    - "Сегодня Вторая часть — Еврейский квартал Старого города, где отрезок Широкой стены открыт для обозрения под современными домами."
