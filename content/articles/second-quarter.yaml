# Overview article (ADR 0007). Mainstream facts only; the location on the Western Hill is the usual view and is said to be a reconstruction; the Russian Bible's renderings are noted.
id: second-quarter
place: a5ab519
title:
  en: "Second Quarter"
  ru: "Вторая часть"
  uk: "Друга частина"
  es: "Segundo Barrio"
  pt: "Segundo Bairro"
  de: "Zweiter Stadtteil"
  fr: "Second quartier"
  it: "Secondo Quartiere"
  pl: "Dzielnica Druga"
  cs: "Druhá čtvrť"
  nl: "Tweede Wijk"
  sv: "Nya staden"
  nb: "Nybyen"
  tl: "Ikalawang Purok"
body:
  en:
    - "The Second Quarter, in Hebrew the Mishneh, was a district of Jerusalem in the last century of the kingdom of Judah. When the book of the law was found in the temple in Josiah's eighteenth year, 622 BC, Hilkiah the priest and the king's officers went to the prophetess Huldah, “now she dwelt in Jerusalem in the college”, as the King James Bible has it after an old Jewish reading; the Hebrew says “in the Mishneh”, the Second, and the Russian Bible “in the second part”. Zephaniah, Josiah's contemporary, hears on the day of the LORD “the noise of a cry from the fish gate, and an howling from the second, and a great crashing from the hills”, naming the quarter beside the gate on the north side of the city. Nehemiah's list says Judah the son of Senuah was “second over the city”, which some read as “over the Second Quarter”."
    - "Archaeology has given the name a place. By the late eighth century BC Jerusalem had spread from the old ridge of the City of David and the Temple Mount across the valley onto the Western Hill, perhaps swollen by refugees after the fall of Samaria in 722 BC. In 1970 Nahman Avigad found in the Jewish Quarter a wall seven metres thick, the Broad Wall, built, it is usually thought, by Hezekiah to enclose the new suburb; Isaiah speaks of houses pulled down to build it. The Mishneh is usually taken to be this new quarter on the Western Hill, west of the temple, though the Bible never draws its bounds."
    - "Today the Western Hill's ancient suburb lies under the Jewish Quarter of the Old City, where a stretch of the Broad Wall lies open to view below the modern houses."
  ru:
    - "Вторая часть, по-еврейски Мишне, — район Иерусалима в последнее столетие Иудейского царства. Когда в восемнадцатый год Иосии, в 622 г. до н. э., в храме нашли книгу закона, священник Хелкия и царские слуги пошли к пророчице Олдаме: «жила же она в Иерусалиме, во второй части». Английская Библия короля Иакова по старому иудейскому толкованию пишет «в училище». Софония, современник Иосии, слышит в день Господень вопль у Рыбных ворот, рыдание из второй части и великое разрушение на холмах, называя квартал у ворот на северной стороне города; русская Библия передаёт это как «рыдание у других ворот». Список Неемии говорит, что Иуда, сын Сенуи, был «вторым над городом», что некоторые читают как «над второй частью»."
    - "Археология дала имени место. К концу VIII века до н. э. Иерусалим вышел со старого гребня города Давидова и храмовой горы через долину на Западный холм, возможно, разросшись от беженцев после падения Самарии в 722 г. до н. э. В 1970 году Нахман Авигад нашёл в Еврейском квартале стену толщиной семь метров, Широкую стену, которую, как обычно считают, построил Езекия, чтобы обнести новый пригород; Исаия говорит о домах, разобранных ради её постройки. Мишне обычно считают этим новым кварталом на Западном холме, к западу от храма, хотя Библия нигде не очерчивает его границ."
    - "Сегодня древний пригород на Западном холме лежит под Еврейским кварталом Старого города, где отрезок Широкой стены открыт для обозрения под современными домами."
  uk:
    - "Друга частина, івритом Мішне, була районом Єрусалима в останнє століття царства Юди. Коли в храмі знайшли книгу закону на вісімнадцятому році Йосії, у 622 р. до н. е., священник Хелкія й царські урядовці пішли до пророчиці Хулди, яка, за Біблією короля Якова, що йде за давнім єврейським прочитанням, жила в Єрусалимі «в колегії»; в івриті ж стоїть «у Мішне», тобто «у Другій», а в Біблії Куліша — «в другій частї». Софонія, сучасник Йосії, у день Господній чує «крик від Рибалчиної брами й риданнє від других воріт» (в івриті — «від Другої») і «велике зворушеннє по всїх узгірях», називаючи цю частину поруч із брамою на північній стороні міста. Список Неемії каже, що «Юда, син Сенуїн, був другим над містом», що дехто читає як «над Другою частиною»."
    - "Археологія дала цій назві місце. До кінця VIII ст. до н. е. Єрусалим розрісся зі старого хребта Міста Давида й Храмової гори через долину на Західний пагорб, можливо, роздутий біженцями після падіння Самарії в 722 р. до н. е. У 1970 р. Нахман Авігад знайшов в Єврейському кварталі стіну завтовшки сім метрів, Широку стіну, збудовану, як зазвичай вважають, Єзекією, щоб оточити нове передмістя; Ісая говорить про зруйновані будинки, з яких її будували. Мішне зазвичай вважають цією новою частиною на Західному пагорбі, на захід від храму, хоча Біблія ніде не визначає її меж."
    - "Нині давнє передмістя на Західному пагорбі лежить під Єврейським кварталом Старого міста, де відрізок Широкої стіни відкритий для огляду під сучасними будинками."
  es:
    - "El Segundo Barrio, en hebreo la Mishné, era un distrito de Jerusalén en el último siglo del reino de Judá. Cuando se halló el libro de la ley en el templo en el año dieciocho de Josías, 622 a. C., el sacerdote Hilcías y los oficiales del rey fueron a la profetisa Hulda, «la cual moraba en Jerusalem en el colegio», como lo tiene la King James Bible según una antigua lectura judía; el hebreo dice «en la Mishné», la Segunda, y la Biblia rusa «en la segunda parte». Sofonías, contemporáneo de Josías, oye en el día del Señor «voz de clamor desde la puerta del pescado, y aullido desde la segunda, y grande quebrantamiento desde los collados», nombrando el barrio junto a la puerta del lado norte de la ciudad. La lista de Nehemías dice que Judá hijo de Senuá era «el segundo en la ciudad», lo que algunos leen como «sobre el Segundo Barrio»."
    - "La arqueología ha dado un lugar al nombre. A fines del siglo VIII a. C. Jerusalén ya se había extendido desde la antigua cresta de la Ciudad de David y el monte del Templo a través del valle hasta la Colina Occidental, quizá engrosada por refugiados tras la caída de Samaria en 722 a. C. En 1970 Nahman Avigad halló en el Barrio Judío un muro de siete metros de grosor, el Muro Ancho, construido, según se suele pensar, por Ezequías para cercar el nuevo suburbio; Isaías habla de casas derribadas para edificarlo. La Mishné suele tomarse por este nuevo barrio de la Colina Occidental, al oeste del templo, aunque la Biblia nunca traza sus límites."
    - "Hoy el antiguo suburbio de la Colina Occidental yace bajo el Barrio Judío de la Ciudad Vieja, donde un tramo del Muro Ancho queda a la vista bajo las casas modernas."
  pt:
    - "O Segundo Bairro, em hebraico Mishné, era um distrito de Jerusalém no último século do reino de Judá. Quando o livro da lei foi achado no templo, no décimo oitavo ano de Josias, 622 a.C., o sacerdote Hilquias e os oficiais do rei foram à profetisa Hulda, “ora, ela morava em Jerusalém no colégio”, como diz a Bíblia King James segundo uma antiga leitura judaica; o hebraico diz “no Mishné”, o Segundo, e a Bíblia russa “na segunda parte”. Sofonias, contemporâneo de Josias, ouve no dia do SENHOR “um grito vindo da Porta dos Peixes, um lamento vindo do segundo distrito e um grande estrondo vindo das colinas”, nomeando o bairro junto à porta do lado norte da cidade. A lista de Neemias diz que Judá, filho de Hassenuá, era “o segundo no comando da cidade”, o que alguns leem como “sobre o Segundo Bairro”."
    - "A arqueologia deu um lugar ao nome. No fim do século VIII a.C. Jerusalém já se estendera da antiga crista da Cidade de Davi e do Monte do Templo, atravessando o vale, até a Colina Ocidental, talvez inchada por refugiados depois da queda de Samaria em 722 a.C. Em 1970, Nahman Avigad achou no Bairro Judeu um muro de sete metros de espessura, o Muro Largo, construído, ao que se costuma pensar, por Ezequias para cercar o novo subúrbio; Isaías fala de casas derrubadas para construí-lo. O Mishné costuma ser tomado por esse novo bairro na Colina Ocidental, a oeste do templo, embora a Bíblia nunca trace seus limites."
    - "Hoje o antigo subúrbio da Colina Ocidental jaz sob o Bairro Judeu da Cidade Velha, onde um trecho do Muro Largo está aberto à vista, abaixo das casas modernas."
  de:
    - "Der Zweite Stadtteil, hebräisch die Mischne, war ein Bezirk Jerusalems im letzten Jahrhundert des Königreichs Juda. Als im achtzehnten Jahr Josias, 622 v. Chr., das Gesetzbuch im Tempel gefunden wurde, gingen der Priester Hilkija und die Beamten des Königs zur Prophetin Hulda, „und sie wohnte zu Jerusalem im andern Teil“; die King-James-Bibel hat nach einer alten jüdischen Lesart „in the college“, der hebräische Text sagt „in der Mischne“, dem Zweiten, und die russische Bibel „im zweiten Teil“. Zefanja, Josias Zeitgenosse, hört am Tag des HERRN „ein lautes Geschrei … von dem Fischtor her und ein Geheul von dem andern Teil der Stadt und ein großer Jammer von den Hügeln“ und nennt so den Stadtteil beim Tor an der Nordseite. Nehemias Liste sagt, Juda, der Sohn Hasnuas, sei „über den andern Teil der Stadt“ gewesen, was manche als „über den Zweiten Stadtteil“ lesen."
    - "Die Archäologie hat dem Namen einen Ort gegeben. Bis zum späten 8. Jahrhundert v. Chr. hatte sich Jerusalem vom alten Höhenzug der Davidsstadt und des Tempelbergs über das Tal auf den Westhügel aus, vielleicht angeschwollen durch Flüchtlinge nach dem Fall Samarias 722 v. Chr. Im Jahr 1970 fand Nahman Avigad im Jüdischen Viertel eine sieben Meter dicke Mauer, die Breite Mauer, die, wie man meist annimmt, Hiskia baute, um den neuen Vorort zu umschließen; Jesaja spricht von Häusern, die zu ihrem Bau abgerissen wurden. Die Mischne gilt meist als dieser neue Stadtteil auf dem Westhügel, westlich des Tempels, obwohl die Bibel seine Grenzen nie zieht."
    - "Heute liegt der antike Vorort auf dem Westhügel unter dem Jüdischen Viertel der Altstadt, wo ein Stück der Breiten Mauer unterhalb der modernen Häuser offen zu sehen ist."
  fr:
    - "Le Second quartier, en hébreu la Mishné, était un quartier de Jérusalem dans le dernier siècle du royaume de Juda. Quand le livre de la loi fut trouvé au temple la dix-huitième année de Josias, en 622 av. J.-C., le prêtre Hilkija et les officiers du roi allèrent auprès de la prophétesse Hulda : « Elle habitait à Jérusalem, dans l’autre quartier de la ville » (Louis Segond) ; la King James met « in the college » d’après une ancienne lecture juive, la Bible russe « dans la seconde partie » ; l’hébreu « dans la Mishné », le Second. Sophonie, contemporain de Josias, entend au jour de l’Éternel « des cris à la porte des poissons, des lamentations dans l’autre quartier de la ville, et un grand désastre sur les collines », nommant le quartier près de la porte au nord de la ville. Chez Néhémie, Juda, fils de Senua, était « le second chef de la ville », que certains lisent « du Second quartier »."
    - "L’archéologie a donné un lieu au nom. À la fin du VIIIe siècle av. J.-C., Jérusalem s’était étendue de l’ancienne crête de la Cité de David et du mont du Temple à travers la vallée jusqu’à la colline occidentale, peut-être enflée par les réfugiés après la chute de Samarie en 722 av. J.-C. En 1970, Nahman Avigad découvrit dans le quartier juif un mur épais de sept mètres, la Muraille large, bâtie, pense-t-on d’ordinaire, par Ézéchias pour enclore le nouveau faubourg ; Ésaïe parle de maisons abattues pour la construire. La Mishné est d’ordinaire tenue pour ce nouveau quartier de la colline occidentale, à l’ouest du temple, bien que la Bible n’en trace jamais les limites."
    - "Aujourd’hui, l’ancien faubourg de la colline occidentale se trouve sous le quartier juif de la Vieille Ville, où un tronçon de la Muraille large est visible sous les maisons modernes."
  it:
    - "Il Secondo Quartiere, in ebraico la Mishneh, era un distretto di Gerusalemme nell’ultimo secolo del regno di Giuda. Quando il libro della legge fu trovato nel tempio nel diciottesimo anno di Giosia, il 622 a.C., il sacerdote Chelkia e i funzionari del re andarono dalla profetessa Culda, «now she dwelt in Jerusalem in the college», come ha la King James Bible secondo un’antica lettura ebraica; l’ebraico dice «nella Mishneh», la Seconda, e la Bibbia russa «nella seconda parte». Sofonia, contemporaneo di Giosia, sente nel giorno del Signore «un grido dalla porta dei pesci, un urlo dalla seconda cinta, e un gran fracasso dalle colline», nominando il quartiere accanto alla porta sul lato nord della città. L’elenco di Neemia dice che Giuda figlio di Senua era «il secondo capo della città», che alcuni leggono come «capo sul Secondo Quartiere»."
    - "L’archeologia ha dato un posto al nome. Entro la fine dell’VIII secolo a.C. Gerusalemme si era estesa dall’antica dorsale della Città di Davide e del Monte del Tempio attraverso la valle sul Colle Occidentale, forse ingrossata dai profughi dopo la caduta di Samaria nel 722 a.C. Nel 1970 Nahman Avigad trovò nel Quartiere Ebraico un muro spesso sette metri, il Muro Largo, costruito, si ritiene di solito, da Ezechia per racchiudere il nuovo sobborgo; Isaia parla di case demolite per costruirlo. La Mishneh è di solito ritenuta questo nuovo quartiere sul Colle Occidentale, a ovest del tempio, benché la Bibbia non ne tracci mai i confini."
    - "Oggi l’antico sobborgo del Colle Occidentale giace sotto il Quartiere Ebraico della Città Vecchia, dove un tratto del Muro Largo giace allo scoperto sotto le case moderne."
  pl:
    - "Dzielnica Druga, po hebrajsku Miszne, była dzielnicą Jerozolimy w ostatnim stuleciu królestwa Judy. Gdy w osiemnastym roku Jozjasza, 622 p.n.e., odnaleziono w świątyni księgę Prawa, kapłan Chilkiasz i urzędnicy króla poszli do prorokini Chuldy: „a ona mieszkała w Jeruzalemie na drugiej stronie miasta”; Biblia Króla Jakuba ma tu, według dawnego odczytania żydowskiego, „in the college”, hebrajski tekst mówi „w Miszne”, czyli w Drugiej, a Biblia rosyjska „w drugiej części”. Sofoniasz, współczesny Jozjaszowi, słyszy w dzień Pana „głos wołania od bramy rybnej, i narzekanie od drugiej strony (miasta), i skruszenie wielkie od pagórków”, wymieniając dzielnicę obok bramy po północnej stronie miasta. Lista Nehemiasza mówi, że Juda, syn Senuy, był „nad miastem wtóry”, co niektórzy czytają jako „nad Drugą Dzielnicą”."
    - "Archeologia nadała nazwie miejsce. Pod koniec VIII wieku p.n.e. Jerozolima rozrosła się już ze starego grzbietu Miasta Dawida i Góry Świątynnej przez dolinę na Wzgórze Zachodnie, być może nabrzmiała od uchodźców po upadku Samarii w 722 roku p.n.e. W 1970 roku Nachman Awigad znalazł w Dzielnicy Żydowskiej mur grubości siedmiu metrów, Szeroki Mur, zbudowany, jak się zwykle uważa, przez Ezechiasza, by otoczyć nowe przedmieście; Izajasz mówi o domach burzonych na jego budowę. Miszne uważa się zwykle za tę nową dzielnicę na Wzgórzu Zachodnim, na zachód od świątyni, choć Biblia nigdy nie wyznacza jej granic."
    - "Dziś dawne przedmieście na Wzgórzu Zachodnim leży pod Dzielnicą Żydowską Starego Miasta, gdzie odcinek Szerokiego Muru leży odsłonięty poniżej nowoczesnych domów."
  cs:
    - "Druhá čtvrť, hebrejsky Mišne, byla čtvrť Jeruzaléma v posledním století judského království. Když byla v chrámě nalezena kniha zákona v osmnáctém roce Jošijášově, roku 622 př. n. l., šel kněz Chilkijáš a královi úředníci k prorokyni Chuldě, „nebo bydlila v Jeruzalémě na druhé straně“; v King James Bible stojí „in the college“ podle starého židovského čtení, hebrejsky „v Mišne“, tedy Druhé, a ruská Bible má „ve druhé části“. Sofonjáš, Jošijášův současník, slyší v den Hospodinův „hlas křiku od brány rybné, a kvílení od druhé strany a třeskot veliký od pahrbků“, jmenuje čtvrť vedle brány na severní straně města. Nehemjášův seznam praví, že Juda syn Senuův byl „nad městem druhý“, což někteří čtou „nad Druhou čtvrtí“."
    - "Archeologie dala jménu místo. Koncem 8. století př. n. l. se už Jeruzalém rozšířil ze starého hřebene Města Davidova a Chrámové hory přes údolí na Západní pahorek, snad rozrostlý o uprchlíky po pádu Samaří roku 722 př. n. l. Roku 1970 nalezl Nachman Avigad v Židovské čtvrti hradbu sedm metrů tlustou, Širokou hradbu, kterou, jak se obvykle soudí, Chizkijáš obehnal nové předměstí; Izajáš mluví o domech zbořených na její stavbu. Mišne se obvykle pokládá za tuto novou čtvrť na Západním pahorku, západně od chrámu, ač Bible její hranice nikdy nevymezuje."
    - "Dnes leží starověké předměstí na Západním pahorku pod Židovskou čtvrtí Starého Města, kde úsek Široké hradby leží otevřený pohledu pod moderními domy."
  nl:
    - "De Tweede Wijk, in het Hebreeuws de Misjne, was een wijk van Jeruzalem in de laatste eeuw van het koninkrijk Juda. Toen in Josia’s achttiende jaar, 622 v.Chr., het wetboek in de tempel werd gevonden, gingen de priester Chilkia en de ambtenaren van de koning naar de profetes Chulda, “now she dwelt in Jerusalem in the college”, zoals de King James Bible het heeft naar een oude Joodse lezing; het Hebreeuws zegt “in de Misjne”, de Tweede, en de Russische Bijbel “in het tweede deel”. Zefanja, Josia’s tijdgenoot, hoort op de dag van de HEER “een stem des gekrijts zijn van de Vispoort af, en een gehuil van het tweede gedeelte, en een grote breuk van de heuvelen af”, waarmee hij de wijk noemt naast de poort aan de noordkant van de stad. Nehemia’s lijst zegt dat Juda, de zoon van Senua, “de tweede over de stad” was, wat sommigen lezen als over de Tweede Wijk."
    - "De archeologie heeft de naam een plaats gegeven. Tegen het eind van de 8e eeuw v.Chr. had Jeruzalem zich uitgebreid vanaf de oude rug van de Stad van David en de Tempelberg over de vallei naar de Westelijke Heuvel, misschien gezwollen door vluchtelingen na de val van Samaria in 722 v.Chr. In 1970 vond Nahman Avigad in de Joodse Wijk een muur van zeven meter dik, de Brede Muur, naar men meestal aanneemt door Chizkia gebouwd om de nieuwe voorstad te omsluiten; Jesaja spreekt van huizen die werden afgebroken om hem te bouwen. De Misjne wordt meestal gelijkgesteld met deze nieuwe wijk op de Westelijke Heuvel, ten westen van de tempel, hoewel de Bijbel haar grenzen nooit trekt."
    - "Tegenwoordig ligt de oude voorstad op de Westelijke Heuvel onder de Joodse Wijk van de Oude Stad, waar een stuk van de Brede Muur onder de moderne huizen open ligt."
  sv:
    - "Nya staden, på hebreiska Mishne, var ett distrikt i Jerusalem under Judas kungarikes sista århundrade. När lagboken hittades i templet i Josias artonde år, 622 f.Kr., gick prästen Hilkia och kungens tjänstemän till profetissan Hulda, ”now she dwelt in Jerusalem in the college”, som King James-översättningen har det efter en gammal judisk läsning; hebreiskan säger ”i Mishne”, den andra, och den ryska bibeln ”i andra delen”. Sefanja, Josias samtida, ser att på HERRENS dag ”skall klagorop höras ifrån Fiskporten och jämmer från Nya staden och stort brak från höjderna”, och nämner kvarteret bredvid porten på stadens norra sida. Nehemjas förteckning säger att Juda, Hassenuas son, var ”den andre i befälet över staden”, vilket vissa läser som ”över Nya staden”."
    - "Arkeologin har gett namnet en plats. Vid slutet av 700-talet f.Kr. hade Jerusalem spridit sig från den gamla åsen med Davids stad och Tempelberget över dalen till Västra kullen, kanske uppsvällt av flyktingar efter Samarias fall 722 f.Kr. År 1970 fann Nahman Avigad i Judiska kvarteret en sju meter tjock mur, Breda muren, byggd, tror man vanligen, av Hiskia för att omsluta den nya förstaden; Jesaja talar om hus som revs för att bygga den. Mishne tas vanligen för att vara detta nya kvarter på Västra kullen, väster om templet, fastän Bibeln aldrig drar dess gränser."
    - "I dag ligger Västra kullens antika förstad under Gamla stans Judiska kvarter, där en sträcka av Breda muren ligger öppen för beskådan nedanför de moderna husen."
  nb:
    - "Nybyen, på hebraisk Mishne, var en bydel i Jerusalem det siste århundret av kongeriket Juda. Da lovboken ble funnet i tempelet i Josjias attende år, 622 f.Kr., gikk presten Hilkia og kongens embetsmenn til profetinnen Hulda, som bodde i Jerusalem «in the college», slik King James-bibelen har det etter en gammel jødisk lesning; det hebraiske sier «i Mishne», den andre, og den russiske bibelen «i den andre delen». Sefanja, Josjias samtidige, hører på Herrens dag «skrik fra Fiskeporten og hyl fra stadens andre del og stort brak fra haugene», og nevner bydelen ved siden av porten på nordsiden av byen. Nehemjas liste sier at Juda, Hassenuas sønn, var «den næst øverste i byen», noe noen leser som «over Nybyen»."
    - "Arkeologien har gitt navnet en plass. Mot slutten av 700-tallet f.Kr. hadde Jerusalem bredt seg fra den gamle ryggen i Davidsbyen og Tempelhøyden over dalen til Vestre høyde, kanskje oppsvulmet av flyktninger etter Samarias fall i 722 f.Kr. I 1970 fant Nahman Avigad i Jødekvarteret en mur sju meter tykk, Bredmuren, bygd, tror man vanligvis, av Hiskia for å omslutte den nye forstaden; Jesaja taler om hus som rives for å bygge den. Mishne tas vanligvis for å være denne nye bydelen på Vestre høyde, vest for tempelet, selv om Bibelen aldri trekker grensene for den."
    - "I dag ligger Vestre høyde med sin gamle forstad under Jødekvarteret i gamlebyen, der en strekning av Bredmuren ligger åpen for innsyn under de moderne husene."
  tl:
    - "Ang Ikalawang Purok (Hebreo: Mishneh) ay distrito ng Jerusalem sa huling siglo ng kaharian ng Juda. Nang matagpuan ang aklat ng kautusan sa templo sa ika-18 taon ni Josias, 622 BK, pumunta si Hilcias na saserdote at mga opisyal ng hari kay Hulda na propetisa, na “tumatahan sa Jerusalem sa ikalawang bahagi”; “in the college” sa King James Bible, ayon sa lumang pagbasang Judio; “sa Mishneh”, ang Ikalawa, sa Hebreo, at “sa ikalawang bahagi” sa Bibliyang Ruso. Naririnig ni Zefanias, kapanahon ni Josias, sa araw ng Panginoon “ingay ng hiyawan na mula sa pintuang-bayan ng mga isda, at ng pananambitan mula sa ikalawang bahagi, at malaking hugong na mula sa mga burol”, na pinangangalanan ang purok sa tabi ng pintuang-bayan sa hilaga ng lungsod. Sa listahan ni Nehemias, si Jehudas na anak ni Senua ay “ikalawa sa bayan”, na binabasa ng ilan na “sa Ikalawang Purok”."
    - "Binigyan ng arkeolohiya ng lugar ang pangalan. Pagsapit ng huling bahagi ng ika-8 siglo BK, kumalat ang Jerusalem mula sa lumang tagaytay ng Bayan ni David at Bundok ng Templo sa kabila ng libis hanggang sa Kanlurang Burol, marahil dahil sa dami ng mga takas pagkatapos ng pagbagsak ng Samaria noong 722 BK. Noong 1970, nakatagpo si Nahman Avigad sa Purok ng mga Judio ng pader na pitong metro ang kapal, ang Malapad na Kuta, na itinayo, ayon sa karaniwang akala, ni Ezechias upang paligiran ang bagong suburb; nagsasalita si Isaias tungkol sa mga bahay na ginigiba upang itayo ito. Karaniwang itinuturing ang Mishneh na ang bagong purok na ito sa Kanlurang Burol, sa kanluran ng templo, bagaman hindi kailanman iginuguhit ng Bibliya ang mga hangganan nito."
    - "Ngayon, ang sinaunang suburb ng Kanlurang Burol ay nasa ilalim ng Purok ng mga Judio ng Lumang Lungsod, kung saan nakabukas sa tanaw ang isang bahagi ng Malapad na Kuta sa ibaba ng mga makabagong bahay."
