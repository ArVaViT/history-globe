body:
  en:
    - "Pirathon was a village “in the land of Ephraim, in the mount of the Amalekites”, identified with Far'ata, a village on a hill about 10 km west of Nablus (ancient Shechem) that preserves the name; the identification is generally accepted. Why a hill of Ephraim should be called after the Amalekites is unexplained, though the song of Deborah also speaks of Ephraim and Amalek together. A minority has looked for it nearer Jerusalem, at Parah in Benjamin."
    - "The minor judge Abdon the son of Hillel, “a Pirathonite”, judged Israel eight years; “he had forty sons and thirty nephews, that rode on threescore and ten ass colts”, and he was buried in Pirathon. Benaiah the Pirathonite was one of David's thirty mighty men and commander of the division for the eleventh month, “of the children of Ephraim”. That is all the Bible tells of the place."
    - "About 160 BC the Seleucid general Bacchides fortified Pharathon among the strong places of Judea, with Jericho, Emmaus, Beth-horon, Bethel and Timnath, and Josephus repeats the list; whether this is Far'ata or a place nearer Jerusalem is uncertain. Far'ata today is a Palestinian village in the Qalqilya governorate of the West Bank."
  ru:
    - "Пирафон был селением «в земле Ефремовой, на горе Амаликовой», которое отождествляют с Фаратой, деревней на холме примерно в 10 км к западу от Наблуса (древнего Сихема), сохранившей имя; отождествление общепринято. Почему гора в уделе Ефрема названа по Амаликитянам, не объяснено, хотя и песнь Деворы говорит о Ефреме и Амалике вместе. Меньшинство искало его ближе к Иерусалиму, в Фаре в уделе Вениамина."
    - "Малый судья Авдон, сын Гиллела, «Пирафонянин», судил Израиля восемь лет; «у него было сорок сыновей и тридцать внуков, ездивших на семидесяти молодых ослах», и погребён он был в Пирафоне. Ванея Пирафонянин был одним из тридцати храбрых Давида и начальником отделения на одиннадцатый месяц, «из сынов Ефремовых». Это всё, что Библия говорит о месте."
    - "Около 160 г. до н. э. селевкидский полководец Вакхид укрепил Фарафон среди крепостей Иудеи, с Иерихоном, Эммаусом, Беф-Ороном, Вефилем и Фамнафой, и Иосиф Флавий повторяет этот список; Фарата ли это или место ближе к Иерусалиму, неясно. Фарата сегодня — палестинская деревня в провинции Калькилия на Западном берегу."
  uk:
    - "Пірафон був селом «в Ефраїм-землї, на горі Амалекійській», яке ототожнюють із Фарʼатою — селом на пагорбі приблизно за 10 км на захід від Наблуса (давній Сихем), що зберегло назву; це ототожнення загальноприйняте. Чому пагорб Єфрема названо на честь амалекитян, не пояснено, хоча й пісня Деборина згадує Єфрема та Амалека разом. Меншість шукала його ближче до Єрусалима, у Парі в землі Веніяміна."
    - "Малий суддя Абдон, син Гіллела, «Пиратонїй», судив Ізраїль вісім років; «У сього було сорок синів і трийцятеро внуків, що їздили на сїмдесятьох ослятах», і його поховано в Пірафоні. Беная Пірафонянин був одним із тридцяти Давидових хоробрих і начальником відділу на одинадцятий місяць, «з синів Ефраїмових». Це все, що Біблія розповідає про це місце."
    - "Близько 160 р. до н. е. селевкідський полководець Бакхід укріпив Фаратон серед сильних місць Юдеї, поряд з Єрихоном, Еммаусом, Бет-Хороном, Бет-Елом і Тімнатом, і Йосиф Флавій повторює цей перелік; чи це Фарʼата, чи місце ближче до Єрусалима, невідомо. Фарʼата сьогодні — палестинське село в мухафазі Калькілія на Західному березі."
  es:
    - "Piratón era una aldea «en la tierra de Ephraim, en el monte de Amalec», identificada con Far'ata, una aldea en una colina a unos 10 km al oeste de Nablus (la antigua Siquem) que conserva el nombre; la identificación es generalmente aceptada. Por qué una colina de Efraín debería llamarse por los amalecitas no se explica, aunque el cántico de Débora habla también de Efraín y Amalec juntos. Una minoría la ha buscado más cerca de Jerusalén, en Para de Benjamín."
    - "El juez menor Abdón hijo de Hilel, «Piratonita», juzgó a Israel ocho años; «tuvo cuarenta hijos y treinta nietos, que cabalgaban sobre setenta asnos», y fue sepultado en Piratón. Benaía el piratonita fue uno de los treinta valientes de David y jefe de la división del mes undécimo, «de los hijos de Ephraim». Eso es todo lo que la Biblia cuenta del lugar."
    - "Hacia 160 a. C. el general seléucida Báquides fortificó Faratón entre las plazas fuertes de Judea, con Jericó, Emaús, Bet-horón, Betel y Timnat, y Josefo repite la lista; si esta es Far'ata o un lugar más cercano a Jerusalén es incierto. Far'ata es hoy una aldea palestina en la gobernación de Qalqilya, en Cisjordania."
  pt:
    - "Piratom era uma aldeia “na terra de Efraim, na região montanhosa dos amalequitas”, identificada com Far'ata, aldeia numa colina a cerca de 10 km a oeste de Nablus (a antiga Siquém) que conserva o nome; a identificação é geralmente aceita. Por que uma colina de Efraim receberia o nome dos amalequitas é inexplicado, embora o cântico de Débora também fale de Efraim e Amaleque juntos. Uma minoria a procurou mais perto de Jerusalém, em Pará, em Benjamim."
    - "O juiz menor Abdom, filho de Hilel, “o piratonita”, julgou Israel oito anos; “teve quarenta filhos e trinta netos, que montavam em setenta jumentinhos”, e foi sepultado em Piratom. Benaia, o piratonita, foi um dos trinta valentes de Davi e comandante da divisão do décimo primeiro mês, “dos filhos de Efraim”. É tudo o que a Bíblia conta do lugar."
    - "Por volta de 160 a.C., o general selêucida Báquides fortificou Faratom entre as praças fortes da Judeia, com Jericó, Emaús, Bete-Horom, Betel e Timnate, e Josefo repete a lista; se é Far'ata ou um lugar mais próximo de Jerusalém, é incerto. Far'ata é hoje uma aldeia palestina na província de Qalqilya, na Cisjordânia."
  de:
    - "Piraton war ein Dorf „im Lande Ephraim auf dem Gebirge der Amalekiter“, gleichgesetzt mit Far'ata, einem Dorf auf einem Hügel etwa 10 km westlich von Nablus (dem antiken Sichem), das den Namen bewahrt; die Gleichsetzung wird allgemein anerkannt. Warum ein Hügel Ephraims nach den Amalekitern heißen sollte, ist ungeklärt, obwohl auch das Lied der Debora Ephraim und Amalek zusammen nennt. Eine Minderheit hat es näher bei Jerusalem gesucht, bei Para in Benjamin."
    - "Der kleine Richter Abdon, „ein Sohn Hillels, ein Pirathoniter“, richtete Israel acht Jahre; „der hatte vierzig Söhne und dreißig Enkel, die auf siebzig Eselsfüllen ritten“, und er wurde in Piraton begraben. Benaja der Pirathoniter war einer von Davids dreißig Helden und führte die Abteilung des elften Monats, „aus den Kindern Ephraim“. Das ist alles, was die Bibel von dem Ort erzählt."
    - "Um 160 v. Chr. befestigte der seleukidische Feldherr Bakchides Pharathon unter den festen Plätzen Judäas, mit Jericho, Emmaus, Bet-Horon, Bethel und Timnat, und Josephus wiederholt die Liste; ob das Far'ata oder ein Ort näher bei Jerusalem ist, bleibt unsicher. Far'ata ist heute ein palästinensisches Dorf im Gouvernement Qalqilya im Westjordanland."
  fr:
    - "Pirathon était un village « dans le pays d’Éphraïm, sur la montagne des Amalécites », identifié à Far‘ata, village sur une colline à environ 10 km à l’ouest de Naplouse (l’ancienne Sichem) qui conserve le nom ; l’identification est généralement admise. Pourquoi une colline d’Éphraïm serait nommée d’après les Amalécites n’est pas expliqué, bien que le cantique de Débora parle aussi ensemble d’Éphraïm et d’Amalek. Une minorité l’a cherchée plus près de Jérusalem, à Para en Benjamin."
    - "Le juge mineur Abdon, fils d’Hillel, « le Pirathonite », jugea Israël huit ans ; « il eut quarante fils et trente petits-fils, qui montaient sur soixante dix ânons », et il fut enterré à Pirathon. Benaja le Pirathonite fut l’un des trente vaillants de David et commandant de la division du onzième mois, « des fils d’Éphraïm ». C’est tout ce que la Bible dit du lieu."
    - "Vers 160 av. J.-C., le général séleucide Bacchidès fortifia Pharathon parmi les places fortes de Judée, avec Jéricho, Emmaüs, Beth-Horon, Béthel et Timnath, et Flavius Josèphe reprend la liste ; s’agit-il de Far‘ata ou d’un lieu plus proche de Jérusalem, c’est incertain. Far‘ata est aujourd’hui un village palestinien du gouvernorat de Qalqilya, en Cisjordanie."
  it:
    - "Piraton era un villaggio «nel paese di Efraim, sul monte Amalek», identificato con Far’ata, un villaggio su una collina circa 10 km a ovest di Nablus (l’antica Sichem) che ne conserva il nome; l’identificazione è generalmente accettata. Perché una collina di Efraim debba prendere nome dagli Amalekiti non è spiegato, benché anche il cantico di Debora parli insieme di Efraim e di Amalek. Una minoranza l’ha cercata più vicino a Gerusalemme, a Para in Beniamino."
    - "Il giudice minore Abdon figlio di Illel, «il Pirathonita», giudicò Israele otto anni; «Ebbe quaranta figliuoli e trenta nipoti, i quali cavalcavano settanta asinelli», e fu sepolto a Piraton. Benaia il Piratonita fu uno dei trenta prodi di Davide e comandante della divisione dell’undicesimo mese, «de’ figliuoli di Efraim». È tutto ciò che la Bibbia racconta del luogo."
    - "Verso il 160 a.C. il generale seleucide Bacchide fortificò Faraton tra le piazzeforti della Giudea, con Gerico, Emmaus, Bet-Oron, Betel e Timna, e Giuseppe Flavio ripete l’elenco; se si tratti di Far’ata o di un luogo più vicino a Gerusalemme è incerto. Far’ata è oggi un villaggio palestinese nel governatorato di Qalqilya, in Cisgiordania."
  pl:
    - "Pirhaton było wsią „w ziemi Efraimskiej, na górze Amalekitów”, utożsamianą z Far'ata, wsią na wzgórzu około 10 km na zachód od Nablusu (dawnego Sychem), która zachowuje nazwę; utożsamienie jest powszechnie przyjmowane. Dlaczego wzgórze Efraima miałoby nosić nazwę od Amalekitów, nie wiadomo, choć pieśń Debory mówi o Efraimie i Amaleku razem. Mniejszość szukała go bliżej Jerozolimy, w Para w Beniaminie."
    - "Mniejszy sędzia Abdon, syn Hillela, „Faratończyk”, sądził Izraela osiem lat; „A ten miał czterdzieści synów, i trzydzieści wnuków, którzy jeździli na siedemdziesięciu oślętach”, i został pochowany w Pirhaton. Benajasz Faratończyk był jednym z trzydziestu dzielnych mężów Dawida i dowódcą zmiany na miesiąc jedenasty, „z synów Efraimowych”. To wszystko, co Biblia mówi o tym miejscu."
    - "Około 160 roku p.n.e. seleucydzki wódz Bakchides umocnił Faraton wśród warowni Judei, obok Jerycha, Emaus, Bet-Choron, Betel i Timnat, a Józef Flawiusz powtarza listę; czy jest to Far'ata, czy miejsce bliższe Jerozolimy, nie jest pewne. Far'ata jest dziś palestyńską wsią w muhafazie Kalkilja na Zachodnim Brzegu."
  cs:
    - "Piraton byl vesnice „v zemi Efraim na hoře Amalechitské“, ztotožněná s Far'atou, vesnicí na pahorku asi 10 km západně od Nábulusu (starověkého Šekemu), která jméno zachovává; ztotožnění je obecně přijímáno. Proč by měl efrajimský pahorek nést jméno po Amalechitských, není vysvětleno, ačkoli Deborina píseň mluví o Efrajimu a Amalekovi také společně. Menšina jej hledala blíže Jeruzaléma, v Para v Benjamínovi."
    - "Vedlejší soudce Abdón syn Hilelův, „Faratonský“, soudil Izraele osm let; „Ten měl čtyřidceti synů a třidceti vnuků, kteříž jezdili na sedmdesáti mezcích“, a byl pohřben v Piratonu. Benajáš Piratonský byl jedním z Davidových třiceti hrdinů a velitelem oddílu na jedenáctý měsíc, „z synů Efraimových“. To je vše, co Bible o místě vypráví."
    - "Asi roku 160 př. n. l. opevnil seleukovský vojevůdce Bakchidés Faraton mezi pevná místa Judska, s Jerichem, Emauzami, Bét-chorónem, Bét-elem a Timnou, a Josephus seznam opakuje; zda je to Far'ata, nebo místo blíže Jeruzaléma, je nejisté. Far'ata je dnes palestinská vesnice v guvernorátu Kalkílija na Západním břehu."
  nl:
    - "Piraton was een dorp “in het land van Efraim, op den berg van den Amalekiet”, gelijkgesteld met Far’ata, een dorp op een heuvel zo’n 10 km ten westen van Nabloes (het oude Sichem) dat de naam bewaart; de identificatie wordt algemeen aanvaard. Waarom een heuvel in Efraïm naar de Amalekieten zou heten, is onverklaard, al spreekt het lied van Debora ook van Efraïm en Amalek samen. Een minderheid heeft het dichter bij Jeruzalem gezocht, bij Para in Benjamin."
    - "De kleine richter Abdon, zoon van Hillel, “de Pirhathoniet”, richtte Israël acht jaar; “hij had veertig zonen, en dertig zoons zonen, rijdende op zeventig ezelveulens”, en hij werd begraven te Piraton. Benaja de Pirhathoniet was een van Davids dertig helden en bevelhebber van de afdeling voor de elfde maand, “van de kinderen van Efraim”. Dat is alles wat de Bijbel van de plaats vertelt."
    - "Omstreeks 160 v.Chr. versterkte de Seleucidische veldheer Bacchides Faraton onder de sterke plaatsen van Judea, met Jericho, Emmaüs, Beth-Horon, Bethel en Timnat, en Josephus herhaalt de lijst; of dit Far’ata is of een plaats dichter bij Jeruzalem, is onzeker. Far’ata is tegenwoordig een Palestijns dorp in het gouvernement Qalqilya op de Westelijke Jordaanoever."
  sv:
    - "Piraton var en by ”i Efraims land, i amalekiternas bergsbygd”, identifierad med Far'ata, en by på en kulle cirka 10 km väster om Nablus (forntida Shekem) som bevarar namnet; identifikationen är allmänt godtagen. Varför en kulle i Efraim skulle kallas efter amalekiterna är oförklarat, fastän Deboras sång också talar om Efraim och Amalek tillsammans. En minoritet har sökt den närmare Jerusalem, vid Para i Benjamin."
    - "Den mindre domaren Avdon, Hillels son, ”pirgatoniten”, dömde Israel i åtta år; ”Han hade fyrtio söner och trettio sonsöner, vilka plägade rida på sjuttio åsnor”, och han blev begravd i Piraton. Benaja från Piraton var en av Davids trettio hjältar och befälhavare för avdelningen för elfte månaden, ”av Efraims barn”. Det är allt Bibeln berättar om platsen."
    - "Omkring 160 f.Kr. befäste den seleukidiske fältherren Bakchides Faraton bland Judeens starka platser, med Jeriko, Emmaus, Bet-Horon, Betel och Timnat, och Josefus upprepar förteckningen; om detta är Far'ata eller en plats närmare Jerusalem är osäkert. Far'ata är i dag en palestinsk by i Qalqilya-guvernementet på Västbanken."
  nb:
    - "Piraton var en landsby «i Efra'ims land, på Amalekitter-fjellet», identifisert med Far'ata, en landsby på en høyde omtrent 10 km vest for Nablus (det gamle Sikem) som bevarer navnet; identifikasjonen er alminnelig godtatt. Hvorfor en høyde i Efraim skulle være oppkalt etter amalekittene, er uforklart, selv om Deboras sang også taler om Efraim og Amalek sammen. Et mindretall har søkt det nærmere Jerusalem, ved Para i Benjamin."
    - "Den mindre dommeren Abdon, Hillels sønn, «piratonitten», dømte Israel i åtte år; «han hadde firti sønner og tretti sønnesønner, som red på sytti asenfoler», og han ble begravet i Piraton. Benaja fra Piraton var en av Davids tretti helter og sjef for avdelingen for den ellevte måneden, «av Efra'ims barn». Det er alt Bibelen forteller om stedet."
    - "Omkring 160 f.Kr. befestet den seleukidiske generalen Bakkides Faraton blant Judeas faste steder, sammen med Jeriko, Emmaus, Bet-Horon, Betel og Timna, og Josefus gjentar listen; om dette er Far'ata eller et sted nærmere Jerusalem, er usikkert. Far'ata er i dag en palestinsk landsby i guvernementet Qalqilya på Vestbredden."
  tl:
    - "Ang Piraton ay isang nayon “sa lupain ng Ephraim, sa lupaing maburol ng mga Amalecita”, na kinikilala sa Far'ata, isang nayon sa isang burol na mga 10 km sa kanluran ng Nablus (ang sinaunang Sichem) na nagpapanatili ng pangalan; karaniwang tinatanggap ang pagkilala. Hindi maipaliwanag kung bakit ipapangalan sa mga Amalecita ang isang burol ng Ephraim, bagaman nagsasalita rin ang awit ni Debora tungkol sa Ephraim at Amalec nang magkasama. Isang minorya ang naghanap nito nang mas malapit sa Jerusalem, sa Para ng Benjamin."
    - "Ang menor na hukom na si Abdon na anak ni Hillel, “Piratonita”, ay naghukom sa Israel nang walong taon; “nagkaroon ng apat na pung anak at tatlong pung apo na sumasakay sa pitong pung asno”, at inilibing siya sa Piraton. Si Benaias na Piratonita ay isa sa tatlumpung makapangyarihang lalaki ni David at pinuno ng pangkat para sa ikalabing-isang buwan, “sa mga anak ni Ephraim”. Iyon na lamang ang sinasabi ng Bibliya tungkol sa lugar."
    - "Bandang 160 BK, pinatibay ng heneral na Seleucida na si Bacchides ang Pharathon sa mga matatag na lugar ng Judea, kasama ang Jerico, Emaus, Beth-horon, Beth-el at Timnath, at inuulit ni Josephus ang listahan; hindi tiyak kung ito ay ang Far'ata o isang lugar na mas malapit sa Jerusalem. Ang Far'ata ngayon ay isang nayong Palestino sa gobernorato ng Qalqilya sa West Bank."
  da:
    - "Piraton var en landsby »udi Efraims Land paa Amalekiternes Bjerg«, identificeret med Far'ata, en landsby på en bakke omkring 10 km vest for Nablus (det gamle Sikem), som bevarer navnet; identifikationen er almindeligt accepteret. Hvorfor en høj i Efraim skulle være opkaldt efter amalekitterne, er uforklaret, selv om Deboras sang også nævner Efraim og Amalek sammen. Et mindretal har søgt den nærmere Jerusalem, ved Para i Benjamin."
    - "Den mindre dommer Abdon, Hillels søn, »Pireathoniteren«, dømte Israel i otte år; han »havde fyrretyve Sønner og tredive Sønnesønner, som rede paa halvfjerdsindstyve Asenfoler«, og han blev begravet i Piraton. Benaja piratoniten var en af Davids tredive helte og anfører for afdelingen for den ellevte måned, »af Efraims Børn«. Det er alt, Bibelen fortæller om stedet."
    - "Omkring 160 f.Kr. befæstede den seleukidiske general Bakkhides Faraton blandt Judæas stærke steder, sammen med Jeriko, Emmaus, Bet-Horon, Betel og Timna, og Josefus gentager listen; om det er Far'ata eller et sted nærmere Jerusalem, er usikkert. Far'ata er i dag en palæstinensisk landsby i Qalqilya-guvernementet på Vestbredden."
  sr:
    - "Фаратон је било село „у земљи Јефремовој на гори амаличкој“, поистовећено с Фар’атом, селом на брду око 10 км западно од Наблуса (древног Сихема) које чува име; идентификација је опште прихваћена. Зашто би брдо Јефремово носило име по Амаличанима, необјашњено је, мада и Деворина песма говори о Јефрему и Амалику заједно. Мањина га је тражила ближе Јерусалиму, у Фари у Венијамину."
    - "Мањи судија Авдон, син Елилов, „Фаратоњанин“, судио је Израиљу осам година; „Он имаше четрдесет синова и тридесет унука, који јахаху седамдесеторо магаради“, а погребен је у Фаратону. Венаја Фаратоњанин био је један од Давидових тридесет јунака и заповедник одреда за једанаести месец, „од синова Јефремових“. То је све што Библија казује о месту."
    - "Око 160. п. н. е. селеукидски војсковођа Бакхид утврдио је Фаратон међу јаким местима Јудеје, с Јерихоном, Емаусом, Вет-Ороном, Ветиљем и Тамнатом, а Јосиф Флавије понавља списак; да ли је то Фар’ата или место ближе Јерусалиму, неизвесно је. Фар’ата је данас палестинско село у гувернорату Калкиља на Западној обали."
