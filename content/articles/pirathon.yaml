# Overview article (ADR 0007). Mainstream facts only; the Pharathon of 1 Maccabees is given as possibly, not certainly, the same place.
id: pirathon
place: a40647c
title:
  en: "Pirathon"
  ru: "Пирафон"
body:
  en:
    - "Pirathon was a village “in the land of Ephraim, in the mount of the Amalekites”, identified with Far'ata, a village on a hill about 10 km west of Nablus (ancient Shechem) that preserves the name; the identification is generally accepted. Why a hill of Ephraim should be called after the Amalekites is unexplained, though the song of Deborah also speaks of Ephraim and Amalek together. A minority has looked for it nearer Jerusalem, at Parah in Benjamin."
    - "The minor judge Abdon the son of Hillel, “a Pirathonite”, judged Israel eight years; “he had forty sons and thirty nephews, that rode on threescore and ten ass colts”, and he was buried in Pirathon. Benaiah the Pirathonite was one of David's thirty mighty men and commander of the division for the eleventh month, “of the children of Ephraim”. That is all the Bible tells of the place."
    - "About 160 BC the Seleucid general Bacchides fortified Pharathon among the strong places of Judea, with Jericho, Emmaus, Beth-horon, Bethel and Timnath, and Josephus repeats the list; whether this is Far'ata or a place nearer Jerusalem is uncertain. Far'ata today is a Palestinian village in the Qalqilya governorate of the West Bank."
  ru:
    - "Пирафон был селением «в земле Ефремовой, на горе Амаликовой», которое отождествляют с Фаратой, деревней на холме примерно в 10 км к западу от Наблуса (древнего Сихема), сохранившей имя; отождествление общепринято. Почему гора в уделе Ефрема названа по Амаликитянам, не объяснено, хотя и песнь Деворы говорит о Ефреме и Амалике вместе. Меньшинство искало его ближе к Иерусалиму, в Фаре в уделе Вениамина."
    - "Малый судья Авдон, сын Гиллела, «Пирафонянин», судил Израиля восемь лет; «у него было сорок сыновей и тридцать внуков, ездивших на семидесяти молодых ослах», и погребён он был в Пирафоне. Ванея Пирафонянин был одним из тридцати храбрых Давида и начальником отделения на одиннадцатый месяц, «из сынов Ефремовых». Это всё, что Библия говорит о месте."
    - "Около 160 г. до н. э. селевкидский полководец Вакхид укрепил Фарафон среди крепостей Иудеи, с Иерихоном, Эммаусом, Беф-Ороном, Вефилем и Фамнафой, и Иосиф Флавий повторяет этот список; Фарата ли это или место ближе к Иерусалиму, неясно. Фарата сегодня — палестинская деревня в провинции Калькилия на Западном берегу."
