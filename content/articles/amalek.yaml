# Overview article (ADR 0007). Mainstream facts only; the Amalekites are known from the Bible alone, and that is said; Haman's title is given with both readings.
id: amalek
place: ab95484
title:
  en: "Amalek"
  ru: "Амалик"
  uk: "Амалек"
  es: "Amalec"
  pt: "Amaleque"
  de: "Amalek"
  fr: "Amalek"
body:
  en:
    - "Amalek is the name of a people rather than a country: the Amalekites were nomads of the Negev and the deserts between Canaan and Egypt. The spies found them “in the land of the south”, Saul pursued them “from Havilah until thou comest to Shur, that is over against Egypt”, and in the days of Gideon they came up with the Midianites and “the children of the east” to strip the harvest. Genesis makes Amalek a grandson of Esau, born to Eliphaz by his concubine Timna, so a kinsman of Edom; Balaam calls him “the first of the nations”. No inscription or excavation has yet identified the Amalekites: a people of tents in the desert leaves little behind, and everything known of them comes from the Bible."
    - "Their first appearance is the attack at Rephidim, soon after the crossing of the sea: “Then came Amalek, and fought with Israel in Rephidim.” Joshua fought while Moses held up his hands on the hill, and the Lord told Moses to write it in a book, for “I will utterly put out the remembrance of Amalek from under heaven”. Deuteronomy remembers how Amalek “smote the hindmost of thee, even all that were feeble behind thee”, and commands Israel to blot out his memory once it has rest in the land. When Israel tried to enter Canaan against Moses' word, Amalekites and Canaanites drove them back to Hormah."
    - "The command was given to Saul: “Now go and smite Amalek, and utterly destroy all that they have.” Saul won, but spared Agag the king and the best of the flocks, and Samuel told him the kingdom was torn from him and hewed Agag in pieces at Gilgal. In David's day Amalekites burned Ziklag and carried off its women until he overtook them; the man who claimed to have killed Saul on Gilboa was an Amalekite. The last of them, Chronicles says, were destroyed by Simeonites in Mount Seir in Hezekiah's reign, and Psalm 83 still lists Amalek among Israel's enemies. In Esther, Haman the persecutor is “the Agagite”, and Jewish tradition made him a descendant of Agag; the Greek Bible and the Synodal text call him a Bugaean instead."
    - "Nothing of Amalek can be shown on the ground today: the map marks the deserts south of Beersheba, where the Bible places them. The name lives on in the synagogue, where Deuteronomy's “Remember what Amalek did unto thee” is read on the sabbath before Purim, and in the Hebrew phrase for an enemy who must not be forgotten."
  ru:
    - "Амалик — имя народа, а не страны: Амаликитяне были кочевниками Негева и пустынь между Ханааном и Египтом. Соглядатаи донесли, что Амалик живёт «на южной части земли», Саул преследовал их «от Хавилы до окрестностей Сура, что пред Египтом», а во дни Гедеона они вместе с Мадианитянами и жителями востока приходили грабить урожай. Книга Бытия делает Амалика внуком Исава, сыном Елифаза от наложницы Фамны, то есть родичем Едома; Валаам говорит о нём: «первый из народов Амалик». Ни одна надпись и ни одни раскопки пока не опознали Амаликитян: народ шатров в пустыне оставляет мало следов, и всё, что о них известно, известно из Библии."
    - "Впервые они появляются в нападении при Рефидиме вскоре после перехода через море: «И пришли Амаликитяне и воевали с Израильтянами в Рефидиме». Иисус Навин сражался, а Моисей держал на холме поднятые руки, и Господь велел Моисею записать в книгу, что «Я совершенно изглажу память Амаликитян из поднебесной». Второзаконие помнит, как Амалик «побил сзади тебя всех ослабевших», и велит Израилю, когда он получит покой в земле, изгладить его память. Когда Израиль попытался войти в Ханаан вопреки слову Моисея, Амаликитяне и Хананеи отогнали его до Хормы."
    - "Это повеление было дано Саулу: «теперь иди и порази Амалика и истреби все, что у него». Саул победил, но пощадил царя Агага и лучший скот, и Самуил объявил ему, что царство отторгнуто от него, и разрубил Агага в Галгале. Во дни Давида Амаликитяне сожгли Секелаг и увели его женщин, пока Давид не настиг их; человек, уверявший, что это он убил Саула на Гелвуе, был Амаликитянин. Последних из них, по книге Паралипоменон, истребили Симеониты на горе Сеир при Езекии, а псалом 82 ещё числит Амалика среди врагов Израиля. В книге Есфирь гонитель Аман по еврейскому тексту — агагитянин, и иудейское предание сделало его потомком Агага; греческая Библия и Синодальный перевод называют его Вугеянином."
    - "Показать Амалика на земле сегодня нельзя: на карте отмечены пустыни к югу от Вирсавии, где его помещает Библия. Имя живёт в синагоге, где слова Второзакония «помни, как поступил с тобою Амалик» читают в субботу перед Пуримом, и в еврейском языке — как имя врага, которого нельзя забыть."
  uk:
    - "Амалек — назва народу, а не краю: амалекитяни були кочовиками Негеву та пустель між Ханааном і Єгиптом. Розвідники знайшли їх «в землї полуденнїй», Саул гнав їх «від Хавили та й до Сира, що навпроти Египту», а за днів Гедеона вони приходили з мідіянітянами та «ті що жили на востоцї», щоб оббирати жнива. Буття робить Амалека онуком Ісава, народженим Еліфазові від наложниці Фамни, тобто родичем Едома; Валаам називає його «Первим... між всїма царствами». Жоден напис чи розкопки досі не ототожнили амалекитян: народ наметів у пустелі залишає по собі мало, і все відоме про нього походить із Біблії."
    - "Їхня перша поява — напад у Рефідімі невдовзі після переходу крізь море: «І прийшов Амалек, і бив на Ізраїля в Рефидимі.» Ісус Навин бився, поки Мойсей тримав угору руки на пагорбі, і Господь звелів Мойсеєві записати це в книгу, бо «зотру до щаду й память Амалекову спід небес». Второзаконня пам'ятає, як Амалик «порозбивав твої задні лави, всїх малосильних позад тебе», і наказує Ізраїлю стерти його пам'ять, щойно той матиме спокій у землі. Коли Ізраїль спробував увійти в Ханаан усупереч слову Мойсея, амалекитяни й ханаанці відігнали його до Хорми."
    - "Наказ було дано Саулові: «Оце ж іди та й побий Амалика і розпростори проклін на все що в його». Саул переміг, але помилував царя Агага та найкращих з отар, і Самуїл сказав йому, що царство вирвано від нього, і розтяв Агага на шматки в Гілгалі. За днів Давида амалекитяни спалили Ціклаг і забрали його жінок, поки він їх не наздогнав; той, хто стверджував, що вбив Саула на Гілбоа, був амалекитянином. Останніх із них, як кажуть Хроніки, знищили симеоніти на горі Сеїр за царювання Єзекії, а Псалом 83 і далі зараховує Амалика до ворогів Ізраїля. У книзі Естер гонитель Аман за єврейським текстом агагянин, і юдейське передання зробило його нащадком Агага; грецька Біблія і Синодальний текст називають його натомість вугейцем."
    - "Від Амалека нині нічого не можна показати на місцевості: мапа позначає пустелі на південь від Беер-Шеви, де розміщує їх Біблія. Назва живе в синагозі, де в суботу перед Пуримом читають слова Второзаконня «Памятай, що вчинив з тобою Амалик в дорозї», та в єврейському вислові для ворога, якого не можна забувати."
  es:
    - "Amalec es el nombre de un pueblo más que de un país: los amalecitas eran nómadas del Néguev y de los desiertos entre Canaán y Egipto. Los espías los hallaron en «la tierra del mediodía», Saúl los persiguió «desde Havila hasta llegar á Shur, que está á la frontera de Egipto», y en los días de Gedeón subieron con los madianitas y «los orientales» para despojar la cosecha. El Génesis hace de Amalec un nieto de Esaú, nacido de Elifaz y de su concubina Timna, de modo que es pariente de Edom; Balaam lo llama «cabeza de gentes». Ninguna inscripción ni excavación ha identificado aún a los amalecitas: un pueblo de tiendas en el desierto deja poco tras de sí, y todo lo que se sabe de ellos procede de la Biblia."
    - "Su primera aparición es el ataque en Refidim, poco después del paso del mar: «Y vino Amalec, y peleó con Israel en Rephidim.» Josué combatió mientras Moisés mantenía alzadas las manos en el monte, y Jehová dijo a Moisés que lo escribiera en un libro, porque «del todo tengo de raer la memoria de Amalec de debajo del cielo». El Deuteronomio recuerda cómo Amalec «te desbarató la retaguardia de todos los flacos que iban detrás de ti», y manda a Israel borrar su memoria una vez que tenga reposo en la tierra. Cuando Israel intentó entrar en Canaán contra la palabra de Moisés, amalecitas y cananeos los hicieron retroceder hasta Horma."
    - "El mandato fue dado a Saúl: «Ve pues, y hiere á Amalec, y destruiréis en él todo lo que tuviere». Saúl venció, pero perdonó a Agag el rey y lo mejor de los rebaños, y Samuel le dijo que el reino le era arrebatado y cortó en pedazos a Agag en Gilgal. En tiempos de David, los amalecitas incendiaron Siclag y se llevaron a sus mujeres hasta que él los alcanzó; el hombre que afirmó haber matado a Saúl en Gilboa era un amalecita. Los últimos de ellos, dicen las Crónicas, fueron exterminados por los simeonitas en el monte Seir en el reinado de Ezequías, y el Salmo 83 aún enumera a Amalec entre los enemigos de Israel. En Ester, Amán el perseguidor es «Agageo», y la tradición judía lo hizo descendiente de Agag; la Biblia griega y el texto sinodal lo llaman, en cambio, bugeo."
    - "Nada de Amalec puede mostrarse hoy sobre el terreno: el mapa señala los desiertos al sur de Beerseba, donde la Biblia los sitúa. El nombre pervive en la sinagoga, donde el «Acuérdate de lo que te hizo Amalec» del Deuteronomio se lee el sábado anterior a Purim, y en la expresión hebrea para el enemigo que no debe ser olvidado."
  pt:
    - "Amaleque é o nome de um povo mais que de um país: os amalequitas eram nômades do Neguebe e dos desertos entre Canaã e o Egito. Os espias os encontraram “na terra do Sul”, Saul os perseguiu “desde Havilá até chegar a Sur, que fica a leste do Egito”, e nos dias de Gideão subiram com os midianitas e “os povos do oriente” para saquear a colheita. Gênesis faz de Amaleque neto de Esaú, nascido de Elifaz e de sua concubina Timna, portanto parente de Edom; Balaão o chama “a primeira das nações”. Nenhuma inscrição ou escavação identificou ainda os amalequitas: um povo de tendas no deserto deixa pouco, e tudo o que se sabe deles vem da Bíblia."
    - "Sua primeira aparição é o ataque em Refidim, logo após a travessia do mar: “Então Amaleque veio e lutou contra Israel em Refidim.” Josué lutou enquanto Moisés levantava as mãos na colina, e o SENHOR mandou Moisés escrever isso num livro, pois “eu apagarei totalmente a memória de Amaleque de debaixo do céu”. Deuteronômio lembra como Amaleque “atacou a sua retaguarda, todos os que estavam fracos atrás de você”, e ordena a Israel que apague a sua memória quando tiver descanso na terra. Quando Israel tentou entrar em Canaã contra a palavra de Moisés, amalequitas e cananeus os fizeram recuar até Hormá."
    - "A ordem foi dada a Saul: “Agora vá, ataque os amalequitas e destrua totalmente tudo o que lhes pertence.” Saul venceu, mas poupou Agague, o rei, e o melhor do rebanho, e Samuel lhe disse que o reino lhe seria tirado e despedaçou Agague em Gilgal. Nos dias de Davi, amalequitas queimaram Ziclague e levaram as suas mulheres até que ele os alcançou; o homem que alegou ter matado Saul no Gilboa era amalequita. Os últimos deles, diz Crônicas, foram destruídos por simeonitas no monte Seir no reinado de Ezequias, e o Salmo 83 ainda lista Amaleque entre os inimigos de Israel. Em Ester, Hamã, o perseguidor, é “o agagita”, e a tradição judaica o fez descendente de Agague; a Bíblia grega e o texto sinodal o chamam, em vez disso, de bugeu."
    - "Nada de Amaleque pode ser mostrado hoje no terreno: o mapa marca os desertos ao sul de Berseba, onde a Bíblia os situa. O nome vive na sinagoga, onde “Lembre-se do que Amaleque fez a você no caminho”, de Deuteronômio, é lido no sábado antes do Purim, e na expressão hebraica para um inimigo que não deve ser esquecido."
  de:
    - "Amalek ist der Name eines Volkes, nicht eines Landes: Die Amalekiter waren Nomaden des Negev und der Wüsten zwischen Kanaan und Ägypten. Die Kundschafter fanden sie „im Lande gegen Mittag“, Saul verfolgte sie „von Hevila an bis gen Sur, das vor Ägypten liegt“, und in den Tagen Gideons zogen sie mit den Midianitern und „denen aus dem Morgenlande“ herauf, um die Ernte zu plündern. Das erste Buch Mose macht Amalek zu einem Enkel Esaus, dem Eliphas von seiner Nebenfrau Timna geboren, also zu einem Verwandten Edoms; Bileam nennt ihn „die Ersten unter den Heiden“. Keine Inschrift und keine Grabung hat die Amalekiter bisher nachgewiesen: Ein Zeltvolk der Wüste hinterlässt wenig, und alles, was man von ihnen weiß, stammt aus der Bibel."
    - "Ihr erster Auftritt ist der Überfall bei Refidim, bald nach dem Durchzug durchs Meer: „Da kam Amalek und stritt wider Israel in Raphidim.“ Josua kämpfte, während Mose auf dem Hügel seine Hände hielt, und der Herr trug Mose auf, es in ein Buch zu schreiben, denn „ich will den Amalek unter dem Himmel austilgen, daß man sein nicht mehr gedenke“. Das fünfte Buch Mose erinnert daran, wie Amalek „die letzten deines Heeres“ schlug, „alle die Schwachen, die dir hinten nachzogen“, und gebietet Israel, sein Gedächtnis auszutilgen, sobald es Ruhe im Land hat. Als Israel gegen das Wort des Mose in Kanaan eindringen wollte, schlugen Amalekiter und Kanaaniter es zurück bis Horma."
    - "Der Befehl erging an Saul: „So zieh nun hin und schlage die Amalekiter und verbanne sie mit allem, was sie haben.“ Saul siegte, verschonte aber den König Agag und das Beste der Herden, und Samuel sagte ihm, das Königtum sei ihm entrissen, und hieb Agag in Gilgal in Stücke. Zu Davids Zeit brannten Amalekiter Ziklag nieder und führten seine Frauen fort, bis er sie einholte; der Mann, der Saul auf dem Gilboa getötet haben wollte, war ein Amalekiter. Die Letzten von ihnen, sagt die Chronik, wurden unter Hiskia von Simeoniten im Gebirge Seir vernichtet, und Psalm 83 führt Amalek noch unter den Feinden Israels auf. Im Buch Ester ist der Verfolger Haman „der Agagiter“, und die jüdische Überlieferung machte ihn zum Nachkommen Agags; die griechische Bibel und der Synodaltext nennen ihn stattdessen einen Bugäer."
    - "Von Amalek lässt sich heute nichts im Gelände zeigen: Die Karte markiert die Wüsten südlich von Beerscheba, wo die Bibel sie ansiedelt. Der Name lebt in der Synagoge fort, wo am Sabbat vor Purim aus dem Fünften Buch Mose „Gedenke, was dir die Amalekiter taten auf dem Wege“ gelesen wird, und in der hebräischen Wendung für einen Feind, den man nicht vergessen darf."
  fr:
    - "Amalek est le nom d’un peuple plutôt que d’un pays : les Amalécites étaient des nomades du Négev et des déserts entre Canaan et l’Égypte. Les espions les trouvèrent dans « la contrée du midi », Saül les battit « depuis Havila jusqu’à Schur, qui est en face de l’Égypte », et du temps de Gédéon ils montaient avec Madian et « les fils de l’Orient » pour piller les récoltes. La Genèse fait d’Amalek un petit-fils d’Ésaü, né d’Éliphaz et de sa concubine Thimna, donc un parent d’Édom ; Balaam l’appelle « la première des nations ». Aucune inscription ni fouille n’a encore identifié les Amalécites : un peuple de tentes dans le désert laisse peu de traces, et tout ce qu’on en sait vient de la Bible."
    - "Leur première apparition est l’attaque de Rephidim, peu après la traversée de la mer : « Amalek vint combattre Israël à Rephidim. » Josué combattit pendant que Moïse tenait les mains levées sur la colline, et l’Éternel dit à Moïse de l’écrire dans un livre, car « j’effacerai la mémoire d’Amalek de dessous les cieux ». Le Deutéronome rappelle comment Amalek « tomba sur toi par derrière, sur tous ceux qui se traînaient les derniers », et ordonne à Israël d’effacer sa mémoire quand il aura du repos dans le pays. Quand Israël voulut entrer en Canaan contre la parole de Moïse, Amalécites et Cananéens le repoussèrent jusqu’à Horma."
    - "L’ordre fut donné à Saül : « Va maintenant, frappe Amalek, et dévouez par interdit tout ce qui lui appartient. » Saül vainquit, mais épargna Agag, le roi, et le meilleur du bétail ; Samuel lui annonça que le royaume lui était arraché, et mit Agag en pièces à Guilgal. Au temps de David, des Amalécites brûlèrent Tsiklag et emmenèrent ses femmes jusqu’à ce qu’il les rattrape ; l’homme qui disait avoir tué Saül sur le Guilboa était amalécite. Les derniers d’entre eux, disent les Chroniques, furent détruits par des Siméonites au mont Séir sous Ézéchias, et le Psaume 83 compte encore Amalek parmi les ennemis d’Israël. Dans Esther, le persécuteur Haman est « l’Agaguite », et la tradition juive en fit un descendant d’Agag ; la Bible grecque et le texte synodal le disent plutôt Bougéen."
    - "Rien d’Amalek ne se montre aujourd’hui sur le terrain : la carte marque les déserts au sud de Beer-Schéba, où la Bible les place. Le nom vit dans la synagogue, où le « Souviens-toi de ce que te fit Amalek » du Deutéronome est lu le sabbat avant Pourim, et dans l’expression hébraïque désignant un ennemi qu’il ne faut pas oublier."
