# Overview article (ADR 0007). Mainstream facts only; the Amalekites are known from the Bible alone, and that is said; Haman's title is given with both readings.
id: amalek
place: ab95484
title:
  en: "Amalek"
  ru: "Амалик"
body:
  en:
    - "Amalek is the name of a people rather than a country: the Amalekites were nomads of the Negev and the deserts between Canaan and Egypt. The spies found them “in the land of the south”, Saul pursued them “from Havilah until thou comest to Shur, that is over against Egypt”, and in the days of Gideon they came up with the Midianites and “the children of the east” to strip the harvest. Genesis makes Amalek a grandson of Esau, born to Eliphaz by his concubine Timna, so a kinsman of Edom; Balaam calls him “the first of the nations”. No inscription or excavation has yet identified the Amalekites: a people of tents in the desert leaves little behind, and everything known of them comes from the Bible."
    - "Their first appearance is the attack at Rephidim, soon after the crossing of the sea: “Then came Amalek, and fought with Israel in Rephidim.” Joshua fought while Moses held up his hands on the hill, and the Lord told Moses to write it in a book, for “I will utterly put out the remembrance of Amalek from under heaven”. Deuteronomy remembers how Amalek “smote the hindmost of thee, even all that were feeble behind thee”, and commands Israel to blot out his memory once it has rest in the land. When Israel tried to enter Canaan against Moses' word, Amalekites and Canaanites drove them back to Hormah."
    - "The command was given to Saul: “Now go and smite Amalek, and utterly destroy all that they have.” Saul won, but spared Agag the king and the best of the flocks, and Samuel told him the kingdom was torn from him and hewed Agag in pieces at Gilgal. In David's day Amalekites burned Ziklag and carried off its women until he overtook them; the man who claimed to have killed Saul on Gilboa was an Amalekite. The last of them, Chronicles says, were destroyed by Simeonites in Mount Seir in Hezekiah's reign, and Psalm 83 still lists Amalek among Israel's enemies. In Esther, Haman the persecutor is “the Agagite”, and Jewish tradition made him a descendant of Agag; the Greek Bible and the Synodal text call him a Bugaean instead."
    - "Nothing of Amalek can be shown on the ground today: the map marks the deserts south of Beersheba, where the Bible places them. The name lives on in the synagogue, where Deuteronomy's “Remember what Amalek did unto thee” is read on the sabbath before Purim, and in the Hebrew phrase for an enemy who must not be forgotten."
  ru:
    - "Амалик — имя народа, а не страны: Амаликитяне были кочевниками Негева и пустынь между Ханааном и Египтом. Соглядатаи донесли, что Амалик живёт «на южной части земли», Саул преследовал их «от Хавилы до окрестностей Сура, что пред Египтом», а во дни Гедеона они вместе с Мадианитянами и жителями востока приходили грабить урожай. Книга Бытия делает Амалика внуком Исава, сыном Елифаза от наложницы Фамны, то есть родичем Едома; Валаам говорит о нём: «первый из народов Амалик». Ни одна надпись и ни одни раскопки пока не опознали Амаликитян: народ шатров в пустыне оставляет мало следов, и всё, что о них известно, известно из Библии."
    - "Впервые они появляются в нападении при Рефидиме вскоре после перехода через море: «И пришли Амаликитяне и воевали с Израильтянами в Рефидиме». Иисус Навин сражался, а Моисей держал на холме поднятые руки, и Господь велел Моисею записать в книгу, что «Я совершенно изглажу память Амаликитян из поднебесной». Второзаконие помнит, как Амалик «побил сзади тебя всех ослабевших», и велит Израилю, когда он получит покой в земле, изгладить его память. Когда Израиль попытался войти в Ханаан вопреки слову Моисея, Амаликитяне и Хананеи отогнали его до Хормы."
    - "Это повеление было дано Саулу: «теперь иди и порази Амалика и истреби все, что у него». Саул победил, но пощадил царя Агага и лучший скот, и Самуил объявил ему, что царство отторгнуто от него, и разрубил Агага в Галгале. Во дни Давида Амаликитяне сожгли Секелаг и увели его женщин, пока Давид не настиг их; человек, уверявший, что это он убил Саула на Гелвуе, был Амаликитянин. Последних из них, по книге Паралипоменон, истребили Симеониты на горе Сеир при Езекии, а псалом 82 ещё числит Амалика среди врагов Израиля. В книге Есфирь гонитель Аман по еврейскому тексту — агагитянин, и иудейское предание сделало его потомком Агага; греческая Библия и Синодальный перевод называют его Вугеянином."
    - "Показать Амалика на земле сегодня нельзя: на карте отмечены пустыни к югу от Вирсавии, где его помещает Библия. Имя живёт в синагоге, где слова Второзакония «помни, как поступил с тобою Амалик» читают в субботу перед Пуримом, и в еврейском языке — как имя врага, которого нельзя забыть."
