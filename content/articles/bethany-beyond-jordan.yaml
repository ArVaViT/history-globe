# Overview article (ADR 0007). Mainstream facts only; Bethany beyond Jordan of John 1:28 (Bethabara in the KJV and the Synodal Bible), not Bethany near Jerusalem; the traditional site at al-Maghtas is given as the tradition, Riesner's Batanea reading as an alternative.
id: bethany-beyond-jordan
place: a6e060d
title:
  en: "Bethany beyond Jordan"
  ru: "Вифавара"
  uk: "Віфавара"
  es: "Betábara"
  pt: "Betânia do outro lado do Jordão"
  de: "Betabara"
  fr: "Béthabara"
  it: "Betania oltre il Giordano"
  nl: "Bethanië aan de overzijde van de Jordaan"
  pl: "Betania za Jordanem"
  cs: "Betabara za Jordánem"
  sv: "Betania på andra sidan Jordan"
  nb: "Betania hinsides Jordan"
  tl: "Betania sa kabila ng Jordan"
  da: "Betania hinsides Jordan"
  sr: "Витанија преко Јордана"
body:
  en:
    - "Bethany beyond Jordan was the place east of the river where John the Baptist was baptizing when the priests and Levites from Jerusalem came to question him. Most Greek manuscripts of John 1:28 read Bethany; Origen, finding no Bethany by the Jordan in his day, preferred Bethabara (Hebrew for “house of the crossing”), which was shown there as the place of John's baptism, and the King James Version and the Synodal Bible follow that reading. Since Byzantine times the site has been placed at al-Maghtas, by the Wadi al-Kharrar on the east bank about 9 km north of the Dead Sea, opposite Qasr al-Yahud on the west bank. Rainer Riesner has argued instead that the name stands for Batanea, the old Bashan, far to the north."
    - "John's Gospel places here John's first testimony. Asked “Who art thou?”, he answered that he baptized with water, “but there standeth one among you, whom ye know not”, and the evangelist adds: “These things were done in Bethabara beyond Jordan, where John was baptizing”. The next day John saw Jesus coming and said, “Behold the Lamb of God, which taketh away the sin of the world”, and on the day after two of his disciples heard him and “followed Jesus”. Later, before the raising of Lazarus, Jesus “went away again beyond Jordan into the place where John at first baptized; and there he abode”."
    - "The sixth-century Madaba mosaic map marks “Bethabara, the place of the baptism of St John” on the west bank, and the pilgrim Theodosius describes a church of John the Baptist at the place of baptism, built by the emperor Anastasius, who reigned 491–518, on great vaults because of the Jordan's floods. Excavations begun after the Israel–Jordan peace treaty of 1994 uncovered at al-Maghtas Byzantine churches, baptismal pools and a monastery on Tell al-Kharrar, the hill that tradition links with Elijah's ascent. In 2015 UNESCO inscribed the Jordanian side as Baptism Site “Bethany Beyond the Jordan” (Al-Maghtas); the western site, Qasr al-Yahud, faces it across the river."
  ru:
    - "Вифавара, в большинстве греческих рукописей Вифания за Иорданом, — место к востоку от реки, где крестил Иоанн Креститель, когда к нему пришли с вопросами священники и левиты из Иерусалима. Ориген, не найдя в своё время Вифании у Иордана, предпочёл чтение Вифавара (по-еврейски «дом переправы») — так называлось место, которое там показывали как место крещения Иоанна; этому чтению следуют Синодальный перевод и Библия короля Якова. С византийского времени это место ищут в аль-Махтасе, у Вади-эль-Харрар на восточном берегу, примерно в 9 км к северу от Мёртвого моря, напротив Каср-эль-Яхуда на западном берегу. Райнер Риснер, напротив, считает, что имя означает Батанею, древний Васан, далеко на севере."
    - "Евангелие от Иоанна помещает здесь первое свидетельство Иоанна. На вопрос «кто ты?» он ответил, что крестит в воде, «но стоит среди вас Некто, Которого вы не знаете», и евангелист добавляет: «Это происходило в Вифаваре при Иордане, где крестил Иоанн». На другой день Иоанн увидел идущего Иисуса и сказал: «вот Агнец Божий, Который берет на Себя грех мира», а на следующий день двое его учеников услышали его и «пошли за Иисусом». Позже, перед воскрешением Лазаря, Иисус «пошел опять за Иордан, на то место, где прежде крестил Иоанн, и остался там»."
    - "Мадабская мозаичная карта VI в. отмечает «Вифавару, место крещения святого Иоанна» на западном берегу, а паломник Феодосий описывает у места крещения церковь Иоанна Предтечи, построенную императором Анастасием, правившим в 491–518 гг., на больших сводах из-за разливов Иордана. Раскопки, начатые после израильско-иорданского мирного договора 1994 г., открыли в аль-Махтасе византийские церкви, крестильные купели и монастырь на холме Телль-эль-Харрар, который предание связывает с вознесением Илии. В 2015 г. ЮНЕСКО внесла иорданскую сторону в список как место крещения «Вифания за Иорданом» (аль-Махтас); западное место, Каср-эль-Яхуд, лежит напротив, за рекой."
  uk:
    - "Віфавара за Йорданом була місцем на схід від річки, де хрестив Іван Христитель, коли священики й левити з Єрусалима прийшли розпитати його. Більшість грецьких рукописів Івана 1:28 читають Віфанія; Оріген, не знайшовши за своїх часів Віфанії біля Йордану, віддав перевагу Віфаварі (по-єврейськи «дім переправи»), яку показували там як місце хрещення Івана, і Біблія короля Якова та Синодальна Біблія йдуть за цим читанням. Від візантійських часів місце поміщають в аль-Магтасі, біля вади аль-Харрар на східному березі приблизно за 9 км на північ від Мертвого моря, навпроти Каср-аль-Яхуда на західному березі. Райнер Різнер натомість доводив, що назва означає Батанею, давній Башан, далеко на півночі."
    - "Євангелія від Івана вміщує тут перше свідчення Івана. На запитання «Хто ж єси?» він відповів, що хрестить водою, «серед вас же стоїть, котрого ви не знаєте», і євангелист додає: «Се в Витаварі стало ся, за Йорданом, де Йоан хрестив». Наступного дня Іван побачив Ісуса, що йшов до нього, і сказав: «Ось Агнець Божий, що бере на себе гріхи сьвіта», а ще через день двоє його учнів почули його й «пійшли слїдом за Ісусом». Пізніше, перед воскресінням Лазаря, Ісус «пійшов ізнов на той бік у те місце, де Йоан перше хрестив, та й пробував там»."
    - "Мадабська мозаїчна мапа VI ст. має на західному березі напис «Віфавара, місце хрещення святого Івана», а прочанин Феодосій описує церкву Івана Христителя на місці хрещення, збудовану імператором Анастасієм, що правив 491–518 рр., на великих склепіннях через повені Йордану. Розкопки, розпочаті після ізраїльсько-йорданського мирного договору 1994 р., виявили в аль-Магтасі візантійські церкви, хрестильні басейни та монастир на Телль-аль-Харрар, пагорбі, який передання пов'язує з вознесінням Іллі. 2015 р. ЮНЕСКО внесло йорданську сторону до Списку як Місце хрещення «Віфанія за Йорданом» (аль-Магтас); західне місце, Каср-аль-Яхуд, лежить навпроти нього через річку."
  es:
    - "Betábara, en la mayoría de los manuscritos griegos Betania al otro lado del Jordán, era el lugar al este del río donde Juan el Bautista bautizaba cuando los sacerdotes y levitas de Jerusalén acudieron a interrogarlo. Orígenes, al no hallar en su tiempo ninguna Betania junto al Jordán, prefirió en Juan 1:28 la lectura Betábara (en hebreo, «casa del paso»), que se mostraba allí como el lugar del bautismo de Juan, y la versión King James y la Biblia sinodal siguen esa lectura. Desde la época bizantina el sitio se ha puesto en al-Maghtas, junto al Wadi al-Kharrar, en la orilla oriental, a unos 9 km al norte del mar Muerto, frente a Qasr al-Yahud, en la orilla occidental. Rainer Riesner ha sostenido en cambio que el nombre equivale a Batanea, el antiguo Basán, mucho más al norte."
    - "El Evangelio de Juan sitúa aquí el primer testimonio de Juan. Preguntado «¿Tú, quién eres?», respondió que bautizaba con agua, «mas en medio de vosotros ha estado á quien vosotros no conocéis», y el evangelista añade: «Estas cosas acontecieron en Betábara, de la otra parte del Jordán, donde Juan bautizaba». Al día siguiente Juan vio venir a Jesús y dijo: «He aquí el Cordero de Dios, que quita el pecado del mundo», y al otro día dos de sus discípulos lo oyeron y «siguieron á Jesús». Más tarde, antes de la resurrección de Lázaro, Jesús «volvióse tras el Jordán, á aquel lugar donde primero había estado bautizando Juan; y estúvose allí»."
    - "El mapa mosaico de Madaba, del siglo VI, marca «Betábara, lugar del bautismo de san Juan» en la orilla occidental, y el peregrino Teodosio describe una iglesia de Juan el Bautista en el lugar del bautismo, construida por el emperador Anastasio, que reinó de 491 a 518, sobre grandes bóvedas a causa de las crecidas del Jordán. Las excavaciones iniciadas tras el tratado de paz entre Israel y Jordania de 1994 sacaron a la luz en al-Maghtas iglesias bizantinas, piscinas bautismales y un monasterio en Tell al-Kharrar, la colina que la tradición vincula con la ascensión de Elías. En 2015 la UNESCO inscribió el lado jordano como Lugar del Bautismo «Betania, al otro lado del Jordán» (Al-Maghtas); el sitio occidental, Qasr al-Yahud, lo enfrenta al otro lado del río."
  pt:
    - "Betânia do outro lado do Jordão era o lugar a leste do rio onde João Batista batizava quando os sacerdotes e levitas de Jerusalém foram interrogá-lo. A maioria dos manuscritos gregos de João 1:28 traz Betânia; Orígenes, não encontrando em sua época nenhuma Betânia junto ao Jordão, preferiu Betábara (em hebraico, “casa da travessia”), que ali era mostrada como o lugar do batismo de João, e a Versão King James e a Bíblia sinodal seguem essa leitura. Desde os tempos bizantinos o sítio é situado em al-Maghtas, junto ao uádi al-Kharrar, na margem leste, cerca de 9 km ao norte do mar Morto, defronte de Qasr al-Yahud, na margem oeste. Rainer Riesner argumentou, em vez disso, que o nome representa Batanéia, a antiga Basã, bem mais ao norte."
    - "O Evangelho de João situa aqui o primeiro testemunho de João. Perguntado “Quem é você?”, ele respondeu que batizava em água, “mas no meio de vocês está alguém que vocês não conhecem”, e o evangelista acrescenta (a KJV e a Bíblia sinodal trazem aqui Betábara): “Essas coisas aconteceram em Betânia, do outro lado do Jordão, onde João estava batizando”. No dia seguinte João viu Jesus vindo em sua direção e disse: “Eis o Cordeiro de Deus, que tira o pecado do mundo!”, e no dia seguinte dois de seus discípulos o ouviram e “seguiram a Jesus”. Mais tarde, antes da ressurreição de Lázaro, Jesus “se retirou novamente para o outro lado do Jordão, para o lugar onde João batizava no princípio, e permaneceu ali”."
    - "O mapa de Madaba, do século VI, marca “Betábara, o lugar do batismo de São João” na margem oeste, e o peregrino Teodósio descreve uma igreja de João Batista no lugar do batismo, construída pelo imperador Anastásio, que reinou de 491 a 518, sobre grandes abóbadas por causa das cheias do Jordão. Escavações iniciadas depois do tratado de paz entre Israel e a Jordânia, em 1994, revelaram em al-Maghtas igrejas bizantinas, tanques batismais e um mosteiro em Tell al-Kharrar, a colina que a tradição liga à subida de Elias. Em 2015 a UNESCO inscreveu o lado jordaniano como Local do Batismo “Betânia do Outro Lado do Jordão” (Al-Maghtas); o sítio ocidental, Qasr al-Yahud, fica de frente para ele, do outro lado do rio."
  de:
    - "Betabara, in den meisten griechischen Handschriften Betanien jenseits des Jordan, war der Ort östlich des Flusses, an dem Johannes der Täufer taufte, als die Priester und Leviten aus Jerusalem kamen, um ihn zu befragen. Die meisten griechischen Handschriften von Johannes 1,28 lesen Betanien; Origenes, der zu seiner Zeit kein Betanien am Jordan fand, bevorzugte Betabara (hebräisch „Haus der Furt“), das dort als Ort der Taufe des Johannes gezeigt wurde, und die King-James-Bibel und die Synodalbibel folgen dieser Lesart. Seit byzantinischer Zeit wird die Stätte in al-Maghtas am Wadi al-Charrar am Ostufer etwa 9 km nördlich des Toten Meeres angesetzt, gegenüber von Qasr al-Jahud am Westufer. Rainer Riesner hat stattdessen vertreten, der Name stehe für Batanäa, das alte Baschan, weit im Norden."
    - "Das Johannesevangelium verlegt hierher das erste Zeugnis des Johannes. Gefragt: „Wer bist du?“, antwortete er, er taufe mit Wasser, „aber er ist mitten unter euch getreten, den ihr nicht kennt“, und der Evangelist fügt hinzu: „Dies geschah zu Bethabara jenseit des Jordans, wo Johannes taufte.“ Am nächsten Tag sah Johannes Jesus kommen und sprach: „Siehe, das ist Gottes Lamm, welches der Welt Sünde trägt!“, und am Tag darauf hörten ihn zwei seiner Jünger und „folgten Jesu nach“. Später, vor der Auferweckung des Lazarus, „zog hin wieder jenseit des Jordans an den Ort, da Johannes zuvor getauft hatte, und blieb allda“."
    - "Die Mosaikkarte von Madaba aus dem sechsten Jahrhundert verzeichnet „Betabara, Ort der Taufe des heiligen Johannes“ am Westufer, und der Pilger Theodosius beschreibt eine Kirche Johannes des Täufers an der Taufstelle, vom Kaiser Anastasius, der 491–518 regierte, wegen der Hochwasser des Jordan auf großen Gewölben errichtet. Nach dem israelisch-jordanischen Friedensvertrag von 1994 begonnene Grabungen legten in al-Maghtas byzantinische Kirchen, Taufbecken und ein Kloster auf dem Tell al-Charrar frei, dem Hügel, den die Überlieferung mit der Himmelfahrt des Elia verbindet. 2015 nahm die UNESCO die jordanische Seite als Taufstätte „Betanien jenseits des Jordan“ (al-Maghtas) in die Welterbeliste auf; die westliche Stätte, Qasr al-Jahud, liegt ihr über den Fluss gegenüber."
  fr:
    - "Béthabara, ou Béthanie au-delà du Jourdain, était le lieu, à l’est du fleuve, où Jean-Baptiste baptisait quand les sacrificateurs et les Lévites de Jérusalem vinrent l’interroger. La plupart des manuscrits grecs de Jean 1:28 portent Béthanie ; Origène, ne trouvant de son temps aucune Béthanie près du Jourdain, préféra Béthabara (en hébreu « maison du passage »), que l’on montrait là comme le lieu du baptême de Jean, et la version du roi Jacques et la Bible synodale suivent cette leçon. Depuis l’époque byzantine, le site est placé à al-Maghtas, près de l’ouadi al-Kharrar, sur la rive orientale, à environ 9 km au nord de la mer Morte, en face de Qasr al-Yahud sur la rive occidentale. Rainer Riesner a soutenu au contraire que le nom représente la Batanée, l’ancien Basan, bien plus au nord."
    - "L’Évangile de Jean place ici le premier témoignage de Jean. À la question « Toi, qui es-tu ? », il répondit qu’il baptisait d’eau, « mais au milieu de vous il y a quelqu’un que vous ne connaissez pas », et l’évangéliste ajoute : « Ces choses se passèrent à Béthanie, au-delà du Jourdain, où Jean baptisait. » Le lendemain, Jean vit Jésus venant à lui et dit : « Voici l’Agneau de Dieu, qui ôte le péché du monde », et le jour d’après deux de ses disciples l’entendirent et « suivirent Jésus ». Plus tard, avant la résurrection de Lazare, Jésus « s’en alla de nouveau au-delà du Jourdain, dans le lieu où Jean avait d’abord baptisé. Et il y demeura »."
    - "La carte-mosaïque de Madaba, du VIe siècle, marque « Béthabara, lieu du baptême de saint Jean » sur la rive occidentale, et le pèlerin Théodose décrit une église de Jean-Baptiste au lieu du baptême, bâtie par l’empereur Anastase, qui régna de 491 à 518, sur de grandes voûtes à cause des crues du Jourdain. Les fouilles commencées après le traité de paix israélo-jordanien de 1994 ont mis au jour à al-Maghtas des églises byzantines, des bassins baptismaux et un monastère sur Tell al-Kharrar, la colline que la tradition relie à l’ascension d’Élie. En 2015, l’UNESCO a inscrit le côté jordanien comme Site du baptême « Béthanie au-delà du Jourdain » (Al-Maghtas) ; le site occidental, Qasr al-Yahud, lui fait face de l’autre côté du fleuve."
  it:
    - "Betania oltre il Giordano era il luogo a est del fiume dove Giovanni Battista battezzava quando i sacerdoti e i leviti da Gerusalemme vennero a interrogarlo. La maggior parte dei manoscritti greci di Giovanni 1,28 legge Betania; Origene, non trovando ai suoi giorni alcuna Betania presso il Giordano, preferì Betabara (in ebraico «casa del guado»), che vi era mostrata come luogo del battesimo di Giovanni, e la King James Version e la Bibbia sinodale seguono questa lettura. Fin dall’epoca bizantina il sito è collocato ad al-Maghtas, presso il Wadi al-Kharrar sulla riva orientale, a circa 9 km a nord del Mar Morto, di fronte a Qasr al-Yahud sulla riva occidentale. Rainer Riesner ha invece sostenuto che il nome stia per Batanea, l’antico Basan, molto più a nord."
    - "Il Vangelo di Giovanni colloca qui la prima testimonianza di Giovanni. Alla domanda «Tu chi sei?», egli rispose che battezzava con acqua, ma «nel mezzo di voi è presente uno che voi non conoscete», e l’evangelista aggiunge: «Queste cose avvennero in Betania al di là del Giordano, dove Giovanni stava battezzando». Il giorno dopo Giovanni vide Gesù venire verso di lui e disse: «Ecco l’Agnello di Dio, che toglie il peccato del mondo!», e il giorno ancora seguente due suoi discepoli lo udirono e «seguirono Gesù». Più tardi, prima della risurrezione di Lazzaro, Gesù «se ne andò di nuovo al di là del Giordano, nel luogo dove Giovanni da principio stava battezzando; e quivi dimorò»."
    - "La mappa musiva di Madaba, del VI secolo, segna «Betabara, luogo del battesimo di san Giovanni» sulla riva occidentale, e il pellegrino Teodosio descrive una chiesa di san Giovanni Battista nel luogo del battesimo, costruita dall’imperatore Anastasio, che regnò dal 491 al 518, su grandi volte a causa delle piene del Giordano. Gli scavi iniziati dopo il trattato di pace tra Israele e Giordania del 1994 hanno portato alla luce ad al-Maghtas chiese bizantine, vasche battesimali e un monastero a Tell al-Kharrar, la collina che la tradizione collega all’ascesa di Elia. Nel 2015 l’UNESCO ha iscritto il lato giordano come Sito del battesimo «Betania oltre il Giordano» (Al-Maghtas); il sito occidentale, Qasr al-Yahud, gli sta di fronte al di là del fiume."
  nl:
    - "Bethanië aan de overzijde van de Jordaan was de plaats ten oosten van de rivier waar Johannes de Doper doopte toen de priesters en Levieten uit Jeruzalem kwamen om hem te ondervragen. De meeste Griekse handschriften van Johannes 1:28 lezen Bethanië; Origenes, die in zijn tijd geen Bethanië aan de Jordaan vond, gaf de voorkeur aan Bethabara (Hebreeuws voor ‘huis van de overtocht’), dat daar werd getoond als de plaats van Johannes' doop, en de King James Version en de Synodale Bijbel volgen die lezing. Sinds de Byzantijnse tijd wordt de plaats gezocht bij al-Maghtas, bij de Wadi al-Kharrar op de oostelijke oever ongeveer 9 km ten noorden van de Dode Zee, tegenover Qasr al-Yahud op de westelijke oever. Rainer Riesner heeft daarentegen betoogd dat de naam staat voor Batanea, het oude Basan, ver in het noorden."
    - "Het Johannesevangelie plaatst hier Johannes' eerste getuigenis. Gevraagd “Wie zijt gij?”, antwoordde hij dat hij met water doopte, “maar Hij staat midden onder ulieden, Dien gij niet kent”, en de evangelist voegt toe: “Deze dingen zijn geschied in Bethabara, over de Jordaan, waar Johannes was dopende”. De volgende dag zag Johannes Jezus komen en zei: “Zie het Lam Gods, Dat de zonde der wereld wegneemt!”, en de dag daarna hoorden twee van zijn discipelen hem en “volgden Jezus”. Later, vóór de opwekking van Lazarus, ging Jezus “wederom over de Jordaan, tot de plaats, waar Johannes eerst doopte; en Hij bleef aldaar”."
    - "De zesde-eeuwse mozaïekkaart van Madaba markeert “Bethabara, de plaats van de doop van de heilige Johannes” op de westelijke oever, en de pelgrim Theodosius beschrijft een kerk van Johannes de Doper op de doopplaats, gebouwd door keizer Anastasius, die regeerde van 491 tot 518, op grote gewelven vanwege de overstromingen van de Jordaan. Opgravingen die na het vredesverdrag tussen Israël en Jordanië van 1994 begonnen, brachten bij al-Maghtas Byzantijnse kerken, doopbaden en een klooster op Tell al-Kharrar aan het licht, de heuvel die door de overlevering met Elia's hemelvaart wordt verbonden. In 2015 plaatste UNESCO de Jordaanse zijde op de werelderfgoedlijst als Baptism Site “Bethany Beyond the Jordan” (Al-Maghtas); de westelijke plaats, Qasr al-Yahud, ligt aan de overkant van de rivier ertegenover."
  pl:
    - "Betania za Jordanem było miejscem na wschód od rzeki, gdzie chrzcił Jan Chrzciciel, gdy kapłani i lewici z Jerozolimy przyszli go wypytać. Większość greckich rękopisów J 1,28 ma Betanię; Orygenes, nie znajdując w swoich czasach żadnej Betanii nad Jordanem, wolał Betabarę (po hebrajsku „dom przeprawy”), którą pokazywano tam jako miejsce chrztu Janowego, a Biblia Króla Jakuba i Biblia synodalna idą za tym odczytaniem. Od czasów bizantyjskich miejsce to umieszcza się w al-Maghtas, przy Wadi al-Charrar na wschodnim brzegu, około 9 km na północ od Morza Martwego, naprzeciw Kasr al-Jahud na brzegu zachodnim. Rainer Riesner twierdził natomiast, że nazwa odnosi się do Batanei, dawnego Baszanu, daleko na północy."
    - "Ewangelia Jana umieszcza tu pierwsze świadectwo Jana. Zapytany: „Któżeś jest”, odpowiedział, że chrzci wodą, „ale w pośrodku was stoi, którego wy nie znacie”, a ewangelista dodaje: „To się stało w Betabarze za Jordanem, gdzie Jan chrzcił”. Nazajutrz Jan ujrzał Jezusa idącego i rzekł: „Oto Baranek Boży, który gładzi grzech świata”, a dzień później dwaj jego uczniowie usłyszeli go i „szli za Jezusem”. Później, przed wskrzeszeniem Łazarza, Jezus „odszedł zasię za Jordan na ono miejsce, gdzie przedtem Jan chrzcił, i tamże mieszkał”."
    - "Mozaikowa mapa z Madaby z VI wieku oznacza na brzegu zachodnim „Betabarę, miejsce chrztu św. Jana”, a pielgrzym Teodozjusz opisuje kościół Jana Chrzciciela w miejscu chrztu, zbudowany przez cesarza Anastazjusza, panującego w latach 491-518, na wielkich sklepieniach z powodu powodzi Jordanu. Wykopaliska rozpoczęte po traktacie pokojowym izraelsko-jordańskim z 1994 roku odsłoniły w al-Maghtas bizantyjskie kościoły, baseny chrzcielne i klasztor na Tell al-Charrar, wzgórzu, które tradycja wiąże z wniebowzięciem Eliasza. W 2015 roku UNESCO wpisało stronę jordańską na listę jako Miejsce Chrztu „Betania za Jordanem” (Al-Maghtas); stanowisko zachodnie, Kasr al-Jahud, leży naprzeciw, po drugiej stronie rzeki."
  cs:
    - "Betabara za Jordánem bylo místo východně od řeky, kde Jan Křtitel křtil, když k němu přišli kněží a levité z Jeruzaléma, aby se ho vyptávali. Většina řeckých rukopisů Janova evangelia 1,28 čte Betanie; Órigenés, který v jeho době žádnou Betanii u Jordánu nenalezl, dal přednost Betabaře (hebrejsky „dům přechodu“), která tam byla ukazována jako místo Janova křtu, a Bible krále Jakuba i synodální Bible toto čtení následují. Od byzantských dob se místo klade k al-Maghtas u Wádí al-Charrár na východním břehu asi 9 km severně od Mrtvého moře, naproti Kasr al-Jahúd na západním břehu. Rainer Riesner naopak tvrdil, že jméno označuje Batanaiu, starý Bášan, daleko na severu."
    - "Janovo evangelium klade sem Janovo první svědectví. Na otázku „Ty kdo jsi?“ odpověděl, že křtí vodou, „ale uprostřed vás stojí, jehož vy neznáte“, a evangelista dodává: „Toto v Betabaře stalo se za Jordánem, kdežto Jan křtil.“ Druhého dne uviděl Jan Ježíše přicházet a řekl: „Aj, Beránek Boží, kterýž snímá hřích světa“, a dalšího dne ho slyšeli dva z jeho učedníků a „šli za Ježíšem“. Později, před vzkříšením Lazara, Ježíš „odšel opět za Jordán na to místo, kdež nejprv Jan křtil, a pozůstal tam“."
    - "Madabská mozaiková mapa ze šestého století značí „Betabara, místo křtu svatého Jana“ na západním břehu a poutník Theodosios popisuje kostel Jana Křtitele na místě křtu, vystavěný císařem Anastasiem, který vládl v letech 491–518, na velkých klenbách kvůli záplavám Jordánu. Vykopávky zahájené po izraelsko-jordánské mírové smlouvě z roku 1994 odkryly v al-Maghtas byzantské kostely, křtitelné jímky a klášter na Tell al-Charrár, pahorku, který tradice spojuje s Eliášovým vzestupem. V roce 2015 zapsala UNESCO jordánskou stranu jako Místo křtu „Betanie za Jordánem“ (Al-Maghtas); západní místo Kasr al-Jahúd leží naproti přes řeku."
  sv:
    - "Betania på andra sidan Jordan var platsen öster om floden där Johannes döparen döpte när prästerna och leviterna från Jerusalem kom för att förhöra honom. De flesta grekiska handskrifter av Joh 1:28 har Betania; Origenes, som på sin tid inte fann något Betania vid Jordan, föredrog Betabara (hebreiska för ”övergångens hus”), som visades där som platsen för Johannes dop, och King James-bibeln och den synodala bibeln följer båda den läsarten. Sedan bysantinsk tid har platsen förlagts till al-Maghtas, vid Wadi al-Kharrar på östra stranden omkring 9 km norr om Döda havet, mitt emot Qasr al-Yahud på västra stranden. Rainer Riesner har i stället hävdat att namnet står för Batanea, det gamla Bashan, långt i norr."
    - "Johannesevangeliet förlägger Johannes första vittnesbörd hit. På frågan ”Vem är du då?” svarade han att han döpte i vatten, men att ”mitt ibland eder står en som I icke kännen”, och evangelisten tillägger: ”Detta skedde i Betania, på andra sidan Jordan, där Johannes döpte”. Dagen därefter såg Johannes Jesus komma och sade: ”Se, Guds Lamm, som borttager världens synd!”, och dagen efter hörde två av hans lärjungar honom och ”följde Jesus”. Senare, före uppväckandet av Lasaros, begav Jesus sig åter bort ”till det ställe på andra sidan Jordan, där Johannes först hade döpt, och stannade kvar där”."
    - "Madabamosaikkartan från 500-talet markerar ”Betabara, platsen för Sankt Johannes dop” på västra stranden, och pilgrimen Theodosius beskriver en kyrka åt Johannes döparen på dopplatsen, byggd av kejsar Anastasius, som regerade 491–518, på stora valv på grund av Jordans översvämningar. Utgrävningar som inleddes efter fredsavtalet mellan Israel och Jordanien 1994 blottade vid al-Maghtas bysantinska kyrkor, dopbassänger och ett kloster på Tell al-Kharrar, kullen som traditionen knyter till Elias himmelsfärd. År 2015 skrev Unesco in den jordanska sidan som Dopplatsen ”Betania på andra sidan Jordan” (Al-Maghtas); den västra platsen, Qasr al-Yahud, ligger mitt emot på andra sidan floden."
  nb:
    - "Betania hinsides Jordan var stedet øst for elven der døperen Johannes døpte da prestene og levittene fra Jerusalem kom for å spørre ham ut. De fleste greske håndskrifter av Joh 1,28 har Betania; Origenes, som ikke fant noen Betania ved Jordan i sin tid, foretrakk Betabara (hebraisk for «overgangens hus»), som ble vist der som stedet for Johannes' dåp, og King James-oversettelsen og den synodale bibelen følger denne lesemåten. Siden bysantinsk tid er stedet blitt plassert ved al-Maghtas, ved Wadi al-Kharrar på østbredden omtrent 9 km nord for Dødehavet, midt imot Qasr al-Yahud på vestbredden. Rainer Riesner har i stedet hevdet at navnet står for Batanea, det gamle Basan, langt mot nord."
    - "Johannesevangeliet plasserer her Johannes' første vitnesbyrd. På spørsmålet «Hvem er du?» svarte han at han døpte med vann, «midt iblandt eder står den I ikke kjenner», og evangelisten legger til: «Dette skjedde i Betania på hin side Jordan, hvor Johannes døpte». Dagen efter så Johannes Jesus komme og sa: «Se der Guds lam, som bærer verdens synd!», og dagen efter hørte to av hans disipler ham, og «de fulgte efter Jesus». Senere, før oppvekkelsen av Lasarus, heter det at Jesus «drog atter bort til hin side av Jordan, til det sted hvor Johannes først døpte og han blev der»."
    - "Madaba-mosaikkens kart fra 500-tallet markerer «Betabara, stedet for døperen Johannes' dåp» på vestbredden, og pilegrimen Theodosius beskriver en kirke for døperen Johannes ved dåpsstedet, bygd av keiser Anastasios, som regjerte 491–518, på store hvelv på grunn av Jordans flommer. Utgravninger som begynte etter fredsavtalen mellom Israel og Jordan i 1994, avdekket ved al-Maghtas bysantinske kirker, døpebasseng og et kloster på Tell al-Kharrar, høyden som tradisjonen knytter til Elias' himmelfart. I 2015 satte UNESCO dåpsstedet «Betania hinsides Jordan» (Al-Maghtas) på den jordanske siden på verdensarvlisten; det vestlige stedet, Qasr al-Yahud, ligger rett overfor på den andre siden av elven."
  tl:
    - "Ang Betania sa kabila ng Jordan ay ang pook sa silangan ng ilog kung saan nagbabautismo si Juan Bautista nang lumapit ang mga saserdote at Levita mula sa Jerusalem upang usisain siya. Karamihan sa mga manuskritong Griyego ng Juan 1:28 ay bumabasa ng Betania; si Origenes, na walang matagpuang Betania sa tabi ng Jordan noong kaniyang kapanahunan, ay mas pinili ang Bethabara (Hebreo para sa “bahay ng tawiran”), na ipinakilala roon bilang pook ng bautismo ni Juan, at sinusunod ng King James Version at ng Bibliyang Sinodal ang pagbasang iyon. Mula pa noong panahong Bizantino ay inilalagay ang pook sa al-Maghtas, sa tabi ng Wadi al-Kharrar sa silangang pampang, mga 9 km sa hilaga ng Dagat na Patay, sa tapat ng Qasr al-Yahud sa kanlurang pampang. Si Rainer Riesner ay nangatwiran na ang pangalan ay tumutukoy sa halip sa Batanea, ang dating Basan, na malayo sa hilaga."
    - "Inilalagay ng Ebanghelyo ni Juan dito ang unang patotoo ni Juan. Nang tanungin ng “Sino ka baga?”, sumagot siya na siya'y bumabautismo sa tubig, “datapuwa't sa gitna ninyo'y may isang nakatayo na hindi ninyo nakikilala”, at idinadagdag ng ebanghelista: “Ang mga bagay na ito'y ginawa sa Betania, sa dako pa roon ng Jordan, na pinagbabautismuhan ni Juan”. Kinabukasan ay nakita ni Juan si Jesus na lumalapit at sinabi, “Narito, ang Cordero ng Dios, na nagaalis ng kasalanan ng sanglibutan!”, at nang sumunod na araw ay narinig siya ng dalawa sa kaniyang mga alagad at “sila'y nagsisunod kay Jesus”. Nang bandang huli, bago ibangon si Lazaro, si Jesus ay “muling naparoon sa dako pa roon ng Jordan sa dako nang una'y pinagbautismuhan ni Juan; at siya'y tumira doon”."
    - "Minamarkahan ng mapa ng Madaba noong ika-6 na siglo ang “Bethabara, ang pook ng bautismo ni San Juan” sa kanlurang pampang, at inilalarawan ng peregrinong si Teodosio ang isang simbahan ni Juan Bautista sa pook ng bautismo, na itinayo ng emperador Anastasio, na naghari noong 491–518, sa malalaking bóveda dahil sa mga baha ng Jordan. Ang mga paghuhukay na sinimulan matapos ang kasunduang pangkapayapaan ng Israel at Jordan noong 1994 ay nakatagpo sa al-Maghtas ng mga simbahang Bizantino, mga paliguang bautismuhan at isang monasteryo sa Tell al-Kharrar, ang burol na iniuugnay ng tradisyon sa pag-akyat ni Elias. Noong 2015 inilista ng UNESCO ang panig ng Jordan bilang Pook ng Bautismo “Betania sa Kabila ng Jordan” (Al-Maghtas); ang kanlurang pook, ang Qasr al-Yahud, ay nakaharap dito sa kabila ng ilog."
  da:
    - "Betania hinsides Jordan var stedet øst for floden, hvor Johannes Døberen døbte, da præsterne og leviterne fra Jerusalem kom for at udspørge ham. De fleste græske håndskrifter har ved Johannes 1,28 læsemåden Betania; Origenes, der ikke i sin tid fandt noget Betania ved Jordan, foretrak Betabara (hebraisk for »overgangens hus«), som blev vist dér som stedet for Johannes' dåb, og King James-oversættelsen og den russiske synodalbibel følger den læsemåde. Siden den byzantinske tid har man placeret stedet ved al-Maghtas, ved Wadi al-Kharrar på østbredden cirka 9 km nord for Det Døde Hav, over for Qasr al-Yahud på vestbredden. Rainer Riesner har i stedet hævdet, at navnet står for Batanæa, det gamle Basan, langt mod nord."
    - "Johannesevangeliet placerer Johannes' første vidnesbyrd her. Spurgt »Hvem er du?« svarede han, at han døbte med vand, men »midt iblandt eder staar den, I ikke kende«, og evangelisten tilføjer: »Dette skete i Bethania hinsides Jordan, hvor Johannes døbte«. Næste dag så Johannes Jesus komme og sagde: »Se det Guds Lam, som bærer Verdens Synd«, og dagen efter hørte to af hans disciple ham og »fulgte Jesus«. Senere, før Lazarus' opvækkelse, gik Jesus væk igen: Han »drog atter bort hinsides Jordan til det Sted, hvor Johannes først døbte, og han blev der«."
    - "500-tallets Madaba-mosaikkort markerer »Betabara, stedet for Sankt Johannes' dåb« på vestbredden, og pilgrimmen Theodosius beskriver en kirke for Johannes Døberen ved dåbsstedet, bygget af kejser Anastasius, der regerede 491–518, på store hvælvinger på grund af Jordans oversvømmelser. Udgravninger, påbegyndt efter fredsaftalen mellem Israel og Jordan i 1994, afdækkede ved al-Maghtas byzantinske kirker, dåbsbassiner og et kloster på Tell al-Kharrar, den høj, som traditionen knytter til Elijas himmelfart. I 2015 optog UNESCO den jordanske side som dåbsstedet »Bethany Beyond the Jordan« (Al-Maghtas); det vestlige sted, Qasr al-Yahud, ligger over for det på den anden side af floden."
  sr:
    - "Витанија преко Јордана било је место источно од реке где је Јован Крститељ крштавао када су свештеници и Левити из Јерусалима дошли да га испитају. Већина грчких рукописа у Јн 1,28 има Витанија; Ориген, не налазећи у своје време никакву Витанију код Јордана, дао је предност Витавари (хебр. „дом прелаза“), која се тамо показивала као место Јовановог крштавања, а превод Краља Џејмса и Синодална Библија прате то читање. Од византијског доба место се смешта у Ел Магтас, код Вади ел Харара на источној обали око 9 км северно од Мртвог мора, насупрот Каср ел Јахуду на западној обали. Рајнер Ризнер је уместо тога тврдио да име стоји за Батанију, стари Васан, далеко на северу."
    - "Јеванђеље по Јовану овде смешта Јованово прво сведочанство. На питање „Ко си ти?“ одговорио је да крштава водом, „а међу вама стоји кога ви не знате“, а јеванђелиста додаје: „Ово би у Витанији преко Јордана где Јован крштаваше“. Сутрадан је Јован угледао Исуса како долази и рекао: „Гле, јагње Божије које узе на се грехе света“, а дан после тога двојица његових ученика су га чула и „отидоше за Исусом“. Касније, пре подизања Лазара, Исус „отиде опет преко Јордана на оно место где Јован пре крштаваше; и оста онде“."
    - "Мадабска мозаичка карта из 6. века бележи на западној обали „Витавару, место крштења светог Јована“, а ходочасник Теодосије описује цркву Јована Крститеља на месту крштења, коју је подигао цар Анастасије, који је владао 491–518, на великим сводовима због поплава Јордана. Ископавања започета после мировног споразума између Израела и Јордана 1994. открила су у Ел Магтасу византијске цркве, крстионице и манастир на Тел ел Харару, брегу који предање повезује с Илијиним узлажењем. Године 2015. УНЕСКО је јорданску страну уписао као Место крштења „Витанија преко Јордана“ (Ел Магтас); западно налазиште, Каср ел Јахуд, лежи насупрот њему преко реке."
