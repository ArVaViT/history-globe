body:
  en:
    - "Iconium is the modern city of Konya, on the edge of the central Anatolian plateau, and the ancient town lies beneath it. In 401 BC Xenophon, marching east with the younger Cyrus, calls it the last city of Phrygia; the army rested there three days before crossing into Lycaonia. Later writers count it as a city of Lycaonia. Its coins of the first century BC show Perseus, for the Greeks explained its name from the image, eikon, of the Gorgon's head."
    - "Strabo describes Iconium as a well-settled town with a richer territory than the dry Lycaonian plain around it; the town had once been held by King Polemon. Mark Antony gave Lycaonia to Amyntas of Galatia, and on Amyntas' death in 25 BC it passed to the new Roman province of Galatia. Under Claudius the city took the name Claudiconium, and Hadrian made it a Roman colony. Pliny calls it a most famous city."
    - 'Paul and Barnabas came here after being driven out of Antioch of Pisidia. They spoke in the synagogue, and "a great multitude both of the Jews and also of the Greeks believed." They stayed a long time, but the city was divided; when Gentiles and Jews with their rulers set out to stone them, they fled to Lystra and Derbe. The Second Letter to Timothy recalls the persecutions Paul endured at Iconium. Jews from Iconium later helped turn the people of Lystra against Paul. On the way back the apostles passed through Iconium again, and later the brethren there spoke well of Timothy.'
    - "The Acts of Paul, written in Asia in the second century, set the story of Thecla, a young woman of Iconium who left her betrothed to follow Paul, in this city. In the third century bishops from Galatia, Cilicia and neighbouring lands met at Iconium and ruled that baptism given outside the church was not valid, as Firmilian of Caesarea told Cyprian. In the later fourth century Amphilochius, bishop of Iconium, was a leading figure at the Council of Constantinople in 381."
  ru:
    - "Икония — нынешний город Конья на краю Центрально-Анатолийского плато; древний город лежит под современным. В 401 г. до н. э. Ксенофонт, шедший на восток с Киром Младшим, называет его последним городом Фригии; войско отдыхало здесь три дня, прежде чем вступить в Ликаонию. Позднейшие авторы относят Иконию к Ликаонии. На её монетах I века до н. э. изображён Персей: греки объясняли имя города от изображения (эйкон) головы Горгоны."
    - "Страбон описывает Иконию как хорошо населённый город с более плодородной округой, чем окружающая его сухая Ликаонская равнина; прежде городом владел царь Полемон. Марк Антоний отдал Ликаонию галатскому царю Аминте, а после смерти Аминты в 25 г. до н. э. она отошла к новой римской провинции Галатии. При Клавдии город получил имя Клавдикония, а Адриан сделал его римской колонией. Плиний называет его знаменитейшим городом."
    - "Павел и Варнава пришли сюда, изгнанные из Антиохии Писидийской. Они говорили в синагоге, и «уверовало великое множество Иудеев и Еллинов». Они пробыли здесь долго, но народ в городе разделился; когда язычники и Иудеи с начальниками своими задумали побить их камнями, апостолы удалились в Листру и Дервию. Второе послание к Тимофею вспоминает гонения, перенесённые Павлом в Иконии. Позже иудеи из Иконии помогли настроить жителей Листры против Павла. На обратном пути апостолы снова прошли через Иконию, а впоследствии братия здесь свидетельствовали о Тимофее."
    - "Деяния Павла, написанные в Асии во II веке, помещают в этот город историю Феклы — девушки из Иконии, которая оставила жениха, чтобы следовать за Павлом. В III веке епископы из Галатии, Киликии и соседних земель собрались в Иконии и постановили, что крещение вне Церкви недействительно, как писал Киприану Фирмилиан Кесарийский. Во второй половине IV века Амфилохий, епископ Иконийский, был одним из видных участников Константинопольского собора 381 г."
  uk:
    - "Іконія — сучасне місто Конья на краю центрального анатолійського плато, і давнє місто лежить під ним. 401 р. до н. е. Ксенофонт, йдучи на схід з Киром Молодшим, називає його останнім містом Фрігії; військо відпочивало там три дні, перш ніж перейти до Лікаонії. Пізніші автори зараховують його до міст Лікаонії. Його монети I ст. до н. е. показують Персея, бо греки пояснювали його назву від образу, ейкон, голови Горгони."
    - "Страбон описує Іконію як добре залюднене місто з багатшою територією, ніж суха лікаонська рівнина довкола; колись місто тримав цар Полемон. Марк Антоній віддав Лікаонію Аминті Галатійському, а по смерті Аминти 25 р. до н. е. вона перейшла до нової римської провінції Галатія. За Клавдія місто прийняло назву Клавдіконій, а Адріан зробив його римською колонією. Пліній називає його найславетнішим містом."
    - "Павло і Варнава прийшли сюди, коли їх вигнали з Антіохії Пісідійської. Вони говорили в синагозі, і «увірувало велике множество і Жидів і Єленян». Вони пробули довго, але місто розділилося; коли язичники й юдеї з їхніми старшинами вирушили побити їх камінням, вони втекли до Лістри й Дервії. Друге послання до Тимофія згадує переслідування, які Павло зазнав в Іконії. Юдеї з Іконії пізніше допомогли настроїти жителів Лістри проти Павла. Дорогою назад апостоли знову пройшли через Іконію, а пізніше тамтешні брати добре відгукувалися про Тимофія."
    - "Діяння Павла, написані в Азії у II ст., поміщають у цьому місті історію Фекли, молодої жінки з Іконії, яка покинула нареченого, щоб піти за Павлом. У III ст. єпископи з Галатії, Кілікії та сусідніх країн зібралися в Іконії й постановили, що хрещення, звершене поза церквою, недійсне, як розповів Кіпріяну Фірміліан Кесарійський. Наприкінці IV ст. Амфілохій, єпископ Іконії, був провідною постаттю на Константинопольському соборі 381 року."
  es:
    - "Iconio es la actual ciudad de Konya, en el borde de la meseta central de Anatolia, y la ciudad antigua yace bajo ella. En el 401 a. C. Jenofonte, que marchaba hacia el este con Ciro el Joven, la llama la última ciudad de Frigia; el ejército descansó allí tres días antes de entrar en Licaonia. Escritores posteriores la cuentan como ciudad de Licaonia. Sus monedas del siglo I a. C. muestran a Perseo, pues los griegos explicaban su nombre por la imagen, eikon, de la cabeza de la Gorgona."
    - "Estrabón describe Iconio como una ciudad bien poblada con un territorio más rico que la árida llanura licaonia de alrededor; la ciudad había estado en manos del rey Polemón. Marco Antonio dio Licaonia a Amintas de Galacia, y a la muerte de Amintas, en el 25 a. C., pasó a la nueva provincia romana de Galacia. Bajo Claudio la ciudad tomó el nombre de Claudiconio, y Adriano la hizo colonia romana. Plinio la llama una ciudad muy famosa."
    - "Pablo y Bernabé llegaron aquí tras ser expulsados de Antioquía de Pisidia. Hablaron en la sinagoga y «creyó una grande multitud de Judíos, y asimismo de Griegos». Se quedaron mucho tiempo, pero la ciudad estaba dividida; cuando gentiles y judíos con sus magistrados se dispusieron a apedrearlos, huyeron a Listra y Derbe. La Segunda carta a Timoteo recuerda las persecuciones que Pablo sufrió en Iconio. Judíos de Iconio ayudaron más tarde a volver al pueblo de Listra contra Pablo. A la vuelta los apóstoles pasaron de nuevo por Iconio, y más tarde los hermanos de allí hablaron bien de Timoteo."
    - "Los Hechos de Pablo, escritos en Asia en el siglo II, sitúan en esta ciudad la historia de Tecla, una joven de Iconio que dejó a su prometido para seguir a Pablo. En el siglo III obispos de Galacia, Cilicia y tierras vecinas se reunieron en Iconio y dictaminaron que el bautismo dado fuera de la Iglesia no era válido, como Firmiliano de Cesarea comunicó a Cipriano. A fines del siglo IV Anfiloquio, obispo de Iconio, fue una figura destacada del concilio de Constantinopla del 381."
  pt:
    - "Icônio é a moderna cidade de Konya, na orla do planalto central da Anatólia, e a cidade antiga jaz sob ela. Em 401 a.C., Xenofonte, marchando para o leste com Ciro, o Jovem, chama-a a última cidade da Frígia; o exército descansou ali três dias antes de passar à Licaônia. Escritores posteriores a contam como cidade da Licaônia. Suas moedas do século I a.C. mostram Perseu, pois os gregos explicavam o seu nome pela imagem, eikon, da cabeça da Górgona."
    - "Estrabão descreve Icônio como uma cidade bem povoada, com território mais rico que a seca planície licaônica ao redor; a cidade fora outrora mantida pelo rei Polemon. Marco Antônio deu a Licaônia a Amintas da Galácia, e com a morte de Amintas em 25 a.C. ela passou à nova província romana da Galácia. Sob Cláudio, a cidade tomou o nome Claudiconium, e Adriano fez dela uma colônia romana. Plínio a chama uma cidade famosíssima."
    - "Paulo e Barnabé vieram aqui depois de expulsos de Antioquia da Pisídia. Falaram na sinagoga, e “creu uma grande multidão, tanto de judeus como de gregos”. Ficaram muito tempo, mas a cidade se dividiu; quando gentios e judeus com seus chefes se dispuseram a apedrejá-los, eles fugiram para Listra e Derbe. A Segunda Carta a Timóteo recorda as perseguições que Paulo suportou em Icônio. Judeus de Icônio ajudaram depois a voltar o povo de Listra contra Paulo. Na volta, os apóstolos passaram de novo por Icônio, e depois os irmãos dali falaram bem de Timóteo."
    - "Os Atos de Paulo, escritos na Ásia no século II, situam nesta cidade a história de Tecla, uma jovem de Icônio que deixou o noivo para seguir Paulo. No século III, bispos da Galácia, da Cilícia e de terras vizinhas reuniram-se em Icônio e decidiram que o batismo dado fora da igreja não era válido, como Firmiliano de Cesareia contou a Cipriano. No fim do século IV, Anfilóquio, bispo de Icônio, foi figura de destaque no Concílio de Constantinopla em 381."
  de:
    - "Ikonion ist die heutige Stadt Konya am Rand der zentralanatolischen Hochebene, und die antike Stadt liegt unter ihr. Im Jahr 401 v. Chr. nennt Xenophon, der mit dem jüngeren Kyrus nach Osten zog, es die letzte Stadt Phrygiens; das Heer ruhte dort drei Tage, ehe es nach Lykaonien übertrat. Spätere Schriftsteller zählen es zu den Städten Lykaoniens. Seine Münzen des 1. Jahrhunderts v. Chr. zeigen Perseus, denn die Griechen erklärten seinen Namen aus dem Bild, eikon, des Gorgonenhaupts."
    - "Strabon beschreibt Ikonion als gut besiedelte Stadt mit einem reicheren Gebiet als dem der trockenen lykaonischen Ebene ringsum; die Stadt hatte einst König Polemon gehört. Marcus Antonius gab Lykaonien an Amyntas von Galatien, und nach Amyntas' Tod 25 v. Chr. fiel es an die neue römische Provinz Galatien. Unter Klaudius nahm die Stadt den Namen Claudiconium an, und Hadrian machte sie zur römischen Kolonie. Plinius nennt sie eine hochberühmte Stadt."
    - "Paulus und Barnabas kamen hierher, nachdem sie aus Antiochia in Pisidien vertrieben worden waren. Sie sprachen in der Synagoge, „daß eine große Menge der Juden und Griechen gläubig ward“. Sie blieben lange, doch die Stadt spaltete sich; als Heiden und Juden mit ihren Obersten sie steinigen wollten, flohen sie nach Lystra und Derbe. Der zweite Brief an Timotheus erinnert an die Verfolgungen, die Paulus in Ikonion erduldete. Juden aus Ikonion halfen später mit, die Leute von Lystra gegen Paulus aufzubringen. Auf dem Rückweg kamen die Apostel noch einmal durch Ikonion, und später sprachen die Brüder dort gut von Timotheus."
    - "Die Paulusakten, im 2. Jahrhundert in Asia geschrieben, verlegen die Geschichte von Thekla, einer jungen Frau aus Ikonion, die ihren Verlobten verließ, um Paulus zu folgen, in diese Stadt. Im 3. Jahrhundert trafen sich Bischöfe aus Galatien, Kilikien und Nachbarländern in Ikonion und entschieden, dass eine Taufe außerhalb der Kirche ungültig sei, wie Firmilian von Caesarea Cyprian berichtete. Im späteren 4. Jahrhundert war Amphilochios, Bischof von Ikonion, eine führende Gestalt auf dem Konzil von Konstantinopel 381."
  fr:
    - "Icone est la ville moderne de Konya, au bord du plateau central d’Anatolie, et l’ancienne ville repose sous elle. En 401 av. J.-C., Xénophon, marchant vers l’est avec Cyrus le Jeune, l’appelle la dernière ville de Phrygie ; l’armée s’y reposa trois jours avant de passer en Lycaonie. Des auteurs postérieurs la comptent comme une ville de Lycaonie. Ses monnaies du Ier siècle av. J.-C. montrent Persée, car les Grecs expliquaient son nom par l’image, eikon, de la tête de la Gorgone."
    - "Strabon décrit Icone comme une ville bien peuplée au territoire plus riche que la plaine lycaonienne aride qui l’entoure ; la ville avait été tenue autrefois par le roi Polémon. Marc Antoine donna la Lycaonie à Amyntas de Galatie, et à la mort d’Amyntas en 25 av. J.-C., elle passa à la nouvelle province romaine de Galatie. Sous Claude, la ville prit le nom de Claudiconium, et Hadrien en fit une colonie romaine. Pline l’appelle une ville très célèbre."
    - "Paul et Barnabas y vinrent après avoir été chassés d’Antioche de Pisidie. Ils parlèrent dans la synagogue, et « une grande multitude de Juifs et de Grecs crurent ». Ils y restèrent assez longtemps, mais la ville se divisa ; quand les païens et les Juifs, avec leurs chefs, se mirent en mouvement pour les lapider, ils se réfugièrent à Lystre et à Derbe. La seconde épître à Timothée rappelle les persécutions que Paul endura à Icone. Des Juifs d’Icone aidèrent plus tard à retourner le peuple de Lystre contre Paul. Au retour, les apôtres repassèrent par Icone, et plus tard les frères d’Icone rendirent un bon témoignage à Timothée."
    - "Les Actes de Paul, écrits en Asie au IIe siècle, situent dans cette ville l’histoire de Thècle, une jeune femme d’Icone qui quitta son fiancé pour suivre Paul. Au IIIe siècle, des évêques de Galatie, de Cilicie et des pays voisins se réunirent à Icone et décidèrent que le baptême donné hors de l’Église n’était pas valide, comme Firmilien de Césarée l’écrivit à Cyprien. À la fin du IVe siècle, Amphiloque, évêque d’Icone, fut une figure majeure du concile de Constantinople de 381."
  pl:
    - "Ikonium to dzisiejsze miasto Konya, na skraju środkowoanatolijskiego płaskowyżu, a starożytne miasto leży pod nim. W 401 r. p.n.e. Ksenofont, maszerując na wschód z Cyrusem Młodszym, nazywa je ostatnim miastem Frygii; wojsko odpoczywało tam trzy dni przed wejściem do Likaonii. Późniejsi pisarze zaliczają je do miast Likaonii. Jego monety z I w. p.n.e. ukazują Perseusza, bo Grecy objaśniali jego nazwę od wizerunku, eikon, głowy Gorgony."
    - "Strabon opisuje Ikonium jako dobrze zaludnione miasto z bogatszym terytorium niż otaczająca je sucha równina likaońska; miasto należało niegdyś do króla Polemona. Marek Antoniusz dał Likaonię Amyntasowi z Galacji, a po śmierci Amyntasa w 25 r. p.n.e. przeszła do nowej rzymskiej prowincji Galacji. Za Klaudiusza miasto przyjęło nazwę Claudiconium, a Hadrian uczynił je rzymską kolonią. Pliniusz nazywa je miastem najsłynniejszym."
    - "Paweł i Barnaba przybyli tu po wypędzeniu z Antiochii Pizydyjskiej. Przemawiali w synagodze i „uwierzyło i Żydów, i Greków wielkie mnóstwo”. Zostali długo, lecz miasto było podzielone; gdy poganie i Żydzi z przełożonymi chcieli ich ukamienować, uciekli do Listry i Derbe. Drugi List do Tymoteusza przypomina prześladowania, jakie Paweł znosił w Ikonium. Żydzi z Ikonium pomogli później obrócić lud Listry przeciw Pawłowi. W drodze powrotnej apostołowie znów przeszli przez Ikonium, a później tamtejsi bracia dobrze świadczyli o Tymoteuszu."
    - "Dzieje Pawła, napisane w Azji w II w., umieszczają w tym mieście opowieść o Tekli, młodej kobiecie z Ikonium, która porzuciła narzeczonego, by pójść za Pawłem. W III w. biskupi z Galacji, Cylicji i sąsiednich krain zebrali się w Ikonium i orzekli, że chrzest udzielony poza Kościołem jest nieważny, jak Firmilian z Cezarei donosił Cyprianowi. W późniejszym IV w. Amfilochiusz, biskup Ikonium, był czołową postacią soboru w Konstantynopolu w 381 r."
  it:
    - "Icònio è la moderna città di Konya, al margine dell’altopiano anatolico centrale, e l’antica città giace sotto di essa. Nel 401 a.C. Senofonte, marciando a est con Ciro il Giovane, la chiama l’ultima città della Frigia; l’esercito vi riposò tre giorni prima di entrare in Licaonia. Gli scrittori posteriori la contano fra le città della Licaonia. Le sue monete del I secolo a.C. mostrano Perseo, poiché i Greci spiegavano il suo nome dall’immagine, eikon, della testa della Gorgone."
    - "Strabone descrive Icònio come una città ben popolata con un territorio più ricco dell’arida pianura licaonica attorno; la città era stata un tempo tenuta dal re Polemone. Marco Antonio diede la Licaonia ad Aminta di Galazia, e alla morte di Aminta nel 25 a.C. passò alla nuova provincia romana di Galazia. Sotto Claudio la città prese il nome Claudiconium, e Adriano ne fece una colonia romana. Plinio la chiama una città celeberrima."
    - "Paolo e Barnaba vennero qui dopo essere stati scacciati da Antiochia di Pisidia. Parlarono nella sinagoga, e «una gran moltitudine di Giudei e di Greci credette». Vi restarono a lungo, ma la città era divisa; quando Gentili e Giudei con i loro capi si mossero per lapidarli, fuggirono a Listra e a Derbe. La Seconda lettera a Timoteo ricorda le persecuzioni che Paolo sopportò a Icònio. Giudei di Icònio contribuirono poi a volgere il popolo di Listra contro Paolo. Sulla via del ritorno gli apostoli passarono di nuovo per Icònio, e più tardi i fratelli di lì parlarono bene di Timoteo."
    - "Gli Atti di Paolo, scritti in Asia nel II secolo, ambientano in questa città la storia di Tecla, una giovane di Icònio che lasciò il fidanzato per seguire Paolo. Nel III secolo vescovi della Galazia, della Cilicia e delle terre vicine si riunirono a Icònio e stabilirono che il battesimo dato fuori della Chiesa non era valido, come Firmiliano di Cesarea riferì a Cipriano. Nel tardo IV secolo Anfilochio, vescovo di Icònio, fu una figura di spicco al concilio di Costantinopoli del 381."
  nl:
    - "Ikonium is de moderne stad Konya, aan de rand van het centrale Anatolische plateau, en de oude stad ligt eronder. In 401 v.Chr. noemt Xenophon, oostwaarts trekkend met de jongere Cyrus, het de laatste stad van Frygië; het leger rustte er drie dagen voordat het Lykaonië binnentrok. Latere schrijvers rekenen het tot de steden van Lykaonië. Zijn munten uit de 1e eeuw v.Chr. tonen Perseus, want de Grieken verklaarden de naam uit het beeld, eikon, van het Gorgonenhoofd."
    - "Strabo beschrijft Ikonium als een goed bewoonde stad met een rijker gebied dan de droge Lykaonische vlakte eromheen; de stad was eens in handen van koning Polemon. Marcus Antonius gaf Lykaonië aan Amyntas van Galatië, en bij Amyntas’ dood in 25 v.Chr. ging het over naar de nieuwe Romeinse provincie Galatië. Onder Claudius nam de stad de naam Claudiconium aan, en Hadrianus maakte haar tot Romeinse kolonie. Plinius noemt haar een zeer beroemde stad."
    - "Paulus en Barnabas kwamen hier nadat zij uit Antiochië in Pisidië waren verdreven. Zij spraken in de synagoge, en “een grote menigte, beiden van Joden en Grieken, geloofde”. Zij bleven er lang, maar de stad was verdeeld; toen heidenen en Joden met hun oversten erop uit trokken om hen te stenigen, vluchtten zij naar Lystra en Derbe. De Tweede Brief aan Timoteüs herinnert aan de vervolgingen die Paulus te Ikonium onderging. Joden uit Ikonium hielpen later de bevolking van Lystra tegen Paulus opzetten. Op de terugweg kwamen de apostelen opnieuw door Ikonium, en later spraken de broeders daar goed over Timoteüs."
    - "De Handelingen van Paulus, in Asia in de 2e eeuw geschreven, plaatsen het verhaal van Thekla, een jonge vrouw uit Ikonium die haar verloofde verliet om Paulus te volgen, in deze stad. In de 3e eeuw kwamen bisschoppen uit Galatië, Cilicië en naburige landen te Ikonium bijeen en bepaalden dat een doop buiten de kerk ongeldig was, zoals Firmilianus van Caesarea aan Cyprianus meldde. In de latere 4e eeuw was Amphilochius, bisschop van Ikonium, een leidende figuur op het Concilie van Konstantinopel in 381."
  cs:
    - "Ikonium je moderní město Konya na okraji středoanatolské náhorní plošiny a staré město leží pod ním. Roku 401 př. n. l. je Xenofón, táhnoucí na východ s Kýrem Mladším, nazývá posledním městem Frygie; vojsko tam odpočívalo tři dny, než přešlo do Lykaonie. Pozdější pisatelé je počítají za město Lykaonie. Jeho mince z 1. stol. př. n. l. ukazují Persea, neboť Řekové vysvětlovali jeho jméno z obrazu, eikón, hlavy Gorgony."
    - "Strabón popisuje Ikonium jako dobře osídlené město s bohatším územím než suchá lykaonská rovina kolem; město kdysi držel král Polemón. Marcus Antonius dal Lykaonii Amyntovi Galatskému a po Amyntově smrti roku 25 př. n. l. připadla nové římské provincii Galacii. Za Klaudia město přijalo jméno Claudiconium a Hadrianus z něj učinil římskou kolonii. Plinius je nazývá nejslavnějším městem."
    - "Pavel a Barnabáš sem přišli poté, co byli vyhnáni z Antiochie Pisidské. Mluvili v synagoze a „uvěřilo i Židů i Řeků veliké množství“. Zůstali dlouho, ale město bylo rozdělené; když se pohané i Židé s jejich knížaty chystali je ukamenovat, uprchli do Lystry a Derbe. Druhý list Timoteovi připomíná pronásledování, která Pavel v Ikoniu snášel. Židé z Ikonia později pomohli obrátit lid Lystry proti Pavlovi. Na zpáteční cestě apoštolové Ikoniem prošli znovu a později tamní bratří mluvili o Timoteovi dobře."
    - "Skutky Pavlovy, napsané v Asii ve 2. století, kladou do tohoto města příběh Tekly, mladé ženy z Ikonia, která opustila snoubence, aby následovala Pavla. Ve 3. století se v Ikoniu sešli biskupové z Galacie, Kilikie a sousedních zemí a rozhodli, že křest udělený mimo církev není platný, jak Firmilianus z Cesareje sdělil Cypriánovi. V pozdním 4. století byl Amfilochios, biskup ikonijský, přední postavou na koncilu v Konstantinopoli roku 381."
  sv:
    - "Ikonion är dagens Konya, i kanten av Anatoliens centrala platå, och den antika staden ligger under den. År 401 f.Kr. kallar Xenofon, som marscherade österut med Kyros den yngre, den sista staden i Frygien; armén vilade där tre dagar innan den gick in i Lykaonien. Senare författare räknar den som en stad i Lykaonien. Dess mynt från första århundradet f.Kr. visar Perseus, ty grekerna förklarade dess namn av bilden, eikon, av gorgonhuvudet."
    - "Strabon beskriver Ikonion som en välbefolkad stad med ett rikare område än den torra lykaoniska slätten omkring; staden hade en gång hållits av kung Polemon. Marcus Antonius gav Lykaonien åt Amyntas av Galatien, och när Amyntas dog 25 f.Kr. övergick det till den nya romerska provinsen Galatien. Under Claudius tog staden namnet Claudiconium, och Hadrianus gjorde den till en romersk koloni. Plinius kallar den en mycket berömd stad."
    - "Paulus och Barnabas kom hit efter att ha drivits ut ur Antiochia i Pisidien. De talade i synagogan, och ”en stor hop av både judar och greker kommo till tro”. De stannade en lång tid, men staden splittrades; när hedningar och judar med sina föreståndare ville stena dem flydde de till Lystra och Derbe. Andra Timoteusbrevet minns förföljelserna Paulus utstod i Ikonion. Judar från Ikonion bidrog senare till att vända Lystras folk mot Paulus. På återvägen passerade apostlarna Ikonion igen, och senare talade bröderna där väl om Timoteus."
    - "Pauli gärningar, skrivna i Asien på 100-talet, förlägger berättelsen om Thekla, en ung kvinna från Ikonion som lämnade sin trolovade för att följa Paulus, till denna stad. På 200-talet möttes biskopar från Galatien, Kilikien och angränsande länder i Ikonion och beslöt att dop givet utanför kyrkan inte var giltigt, som Firmilianus av Caesarea berättade för Cyprianus. Under senare delen av 300-talet var Amfilochios, biskop av Ikonion, en ledande gestalt vid kyrkomötet i Konstantinopel 381."
  nb:
    - "Ikonium er dagens by Konya, i kanten av det sentrale anatoliske platået, og den gamle byen ligger under den. I 401 f.Kr. kaller Xenofon, på marsj østover med Kyros den yngre, den siste byen i Frygia; hæren hvilte der tre dager før den krysset inn i Lykaonia. Senere forfattere regner den som en by i Lykaonia. Dens mynter fra det første århundre f.Kr. viser Perseus, for grekerne forklarte navnet ut fra bildet, eikon, av Gorgos' hode."
    - "Strabon beskriver Ikonium som en godt bebodd by med et rikere område enn den tørre lykaoniske sletten rundt; byen hadde en gang vært holdt av kong Polemon. Marcus Antonius ga Lykaonia til Amyntas av Galatia, og ved Amyntas' død i 25 f.Kr. gikk det til den nye romerske provinsen Galatia. Under Klaudius tok byen navnet Claudiconium, og Hadrian gjorde den til en romersk koloni. Plinius kaller den en høyt berømt by."
    - "Paulus og Barnabas kom hit etter å ha blitt drevet ut av Antiokia i Pisidia. De talte i synagogen, og «en stor mengde både av jøder og av grekere kom til troen». De ble der lenge, men byen var delt; da hedningene og jødene med sine styresmenn gikk løs for å stene dem, flyktet de til Lystra og Derbe. Andre Timoteusbrev minner om forfølgelsene Paulus utholdt i Ikonium. Jøder fra Ikonium bidro senere til å sette folket i Lystra opp mot Paulus. På tilbakeveien passerte apostlene Ikonium igjen, og senere talte brødrene der vel om Timoteus."
    - "Pauli gjerninger, skrevet i Asia på 100-tallet, legger historien om Thekla, en ung kvinne fra Ikonium som forlot sin forlovede for å følge Paulus, til denne byen. På 200-tallet møttes biskoper fra Galatia, Kilikia og nabolandene i Ikonium og slo fast at dåp gitt utenfor kirken ikke var gyldig, slik Firmilian av Cæsarea fortalte Cyprian. Sent på 300-tallet var Amfilokios, biskop av Ikonium, en ledende skikkelse ved kirkemøtet i Konstantinopel i 381."
  tl:
    - "Ang Iconio ay ang makabagong lungsod ng Konya, sa gilid ng gitnang talampas ng Anatolia, at ang sinaunang bayan ay nasa ilalim nito. Noong 401 BK, tinawag ito ni Jenofonte, na nagmamartsa patungong silangan kasama ng nakababatang Ciro, na huling lungsod ng Frigia; nagpahinga roon ang hukbo nang tatlong araw bago tumawid sa Licaonia. Binibilang ito ng mga huling manunulat na lungsod ng Licaonia. Ipinakikita ng mga barya nito noong unang siglo BK si Perseo, sapagkat ipinaliwanag ng mga Griyego ang pangalan nito mula sa larawan, eikon, ng ulo ng Gorgon."
    - "Inilalarawan ni Strabo ang Iconio bilang isang bayang maayos ang pagkakatira na may lupaing higit na mayaman kaysa sa tuyong kapatagan ng Licaonia sa palibot; minsang hinawakan ng haring Polemon ang bayan. Ibinigay ni Marco Antonio ang Licaonia kay Amyntas ng Galacia, at sa kamatayan ni Amyntas noong 25 BK ay napunta ito sa bagong lalawigang Romano ng Galacia. Sa ilalim ni Claudio, kinuha ng lungsod ang pangalang Claudiconium, at ginawa itong kolonyang Romano ni Hadriano. Tinatawag ito ni Plinio na pinakatanyag na lungsod."
    - "Dumating dito sina Pablo at Bernabe matapos itaboy sa Antioquia ng Pisidia. Nagsalita sila sa sinagoga, at “nagsisampalataya ang lubhang marami sa mga Judio at sa mga Griego.” Matagal silang nanatili, ngunit nahati ang lungsod; nang magtangka ang mga Gentil at mga Judio kasama ang kanilang mga pinuno na batuhin sila, tumakas sila patungong Listra at Derbe. Inaalala ng Ikalawang Sulat kay Timoteo ang mga pag-uusig na tiniis ni Pablo sa Iconio. Tumulong ang mga Judio mula sa Iconio nang bandang huli na ibaling ang bayan ng Listra laban kay Pablo. Sa pagbabalik, dumaan muli ang mga apostol sa Iconio, at nang bandang huli ay nagsalita nang mabuti ang mga kapatid doon tungkol kay Timoteo."
    - "Inilalagay ng Mga Gawa ni Pablo, na isinulat sa Asia noong ika-2 siglo, sa lungsod na ito ang kuwento ni Tecla, isang dalagang taga-Iconio na iniwan ang kaniyang kasintahan upang sumunod kay Pablo. Noong ika-3 siglo, nagtipon sa Iconio ang mga obispo mula sa Galacia, Cilicia at karatig na lupain at nagpasyang hindi balido ang bautismong ibinigay sa labas ng simbahan, gaya ng sinabi ni Firmiliano ng Cesarea kay Cipriano. Noong huling bahagi ng ika-4 na siglo, si Anfiloquio, obispo ng Iconio, ay nangungunang tao sa Konsilyo ng Constantinopla noong 381."
  da:
    - "Ikonion er nutidens Konya, i kanten af det centrale Anatoliens plateau, og den gamle by ligger under den. I 401 f.Kr. kalder Xenofon, på march mod øst med Kyros den Yngre, den Frygiens sidste by; hæren hvilede dér tre dage, før den gik over i Lykaonien. Senere forfattere regner den som en by i Lykaonien. Dens mønter fra 1. århundrede f.Kr. viser Perseus, for grækerne forklarede dens navn ud fra billedet, eikon, af Gorgos hoved."
    - "Strabon beskriver Ikonion som en vel bebygget by med et rigere område end den tørre lykaoniske slette omkring den; byen havde engang været holdt af kong Polemon. Marcus Antonius gav Lykaonien til Amyntas af Galatien, og ved Amyntas' død i 25 f.Kr. gik det til den nye romerske provins Galatien. Under Klaudius tog byen navnet Claudiconium, og Hadrian gjorde den til romersk koloni. Plinius kalder den en højt berømt by."
    - "Paulus og Barnabas kom hertil, efter at være drevet ud af Antiokia i Pisidien. De talte i synagogen, og »en stor Mængde, baade af Jøder og Grækere, troede«. De blev længe, men byen var splittet; da hedninger og jøder med deres rådsherrer ville stene dem, flygtede de til Lystra og Derbe. Andet Timotheusbrev mindes de forfølgelser, Paulus udholdt i Ikonion. Jøder fra Ikonion hjalp senere med at vende folket i Lystra mod Paulus. På tilbagevejen drog apostlene gennem Ikonion igen, og senere talte brødrene der godt om Timotheus."
    - "Paulus' gerninger, skrevet i Asien i 2. århundrede, henlægger historien om Thekla, en ung kvinde fra Ikonion, der forlod sin forlovede for at følge Paulus, til denne by. I 3. århundrede mødtes biskopper fra Galatien, Kilikien og nabolandene i Ikonion og bestemte, at dåb givet uden for kirken ikke var gyldig, som Firmilian af Cæsarea fortalte Cyprian. I det senere 300-tal var Amphilochius, biskop af Ikonion, en ledende skikkelse ved koncilet i Konstantinopel i 381."
  sr:
    - "Икониј је данашњи град Коња, на рубу средње анатолске висоравни, а древни град лежи испод њега. Ксенофонт, марширајући на исток с Киром Млађим 401. п. н. е., назива га последњим градом Фригије; војска се ту одмарала три дана пре преласка у Ликаонију. Каснији писци га убрајају у градове Ликаоније. Његов новац из првог века п. н. е. приказује Персеја, јер су Грци име тумачили по слици, еикон, Горгонине главе."
    - "Страбон описује Икониј као добро насељен град са богатијом облашћу од суве ликаонске равнице око њега; град је некад држао краљ Полемон. Марко Антоније дао је Ликаонију Аминти из Галатије, а по Аминтиној смрти 25. п. н. е. прешла је на нову римску провинцију Галатију. Под Клаудијем град је примио име Клаудиконијум, а Хадријан га је учинио римском колонијом. Плиније га назива најчувенијим градом."
    - "Павле и Варнава дошли су овамо пошто су били протерани из Антиохије Писидијске. Говорили су у синагоги, „тако да верова велико мноштво Јевреја и Грка“. Остали су дуго, али је град био подељен; кад су незнабошци и Јевреји са својим поглаварима кренули да их каменују, побегли су у Листру и Дерву. Друга посланица Тимотију подсећа на прогоне које је Павле поднео у Иконију. Јевреји из Иконија касније су помогли да се народ Листре окрене против Павла. На повратку апостоли су поново прошли кроз Икониј, а касније су тамошња браћа добро сведочила о Тимотију."
    - "Дела Павлова, писана у Азији у другом веку, смештају у овај град причу о Текли, младој жени из Иконија која је оставила вереника да следи Павла. У трећем веку епископи из Галатије, Киликије и суседних земаља састали су се у Иконију и одлучили да крштење изван цркве није важеће, као што је Фирмилијан Цезарејски поручио Кипријану. Крајем четвртог века Амфилохије, епископ Иконија, био је водећа личност на Сабору у Цариграду 381."
  hu:
    - "Ikónium a mai Konya, a közép-anatóliai fennsík szélén, az ókori város alatta fekszik. Kr. e. 401-ben Xenophón, aki az ifjabb Círusszal keletre vonult, Frígia utolsó városának nevezi; a sereg három napot pihent ott, mielőtt átkelt Likaóniába. Későbbi írók Likaónia városának számítják. Kr. e. 1. századi érméi Perszeuszt ábrázolják, mert a görögök a nevét a Gorgó-fej képéből, az eikonból magyarázták."
    - "Sztrabón Ikóniumot jól lakott városnak írja, a száraz likaóniai síkságnál gazdagabb területtel; a várost egykor Polemón király tartotta. Marcus Antonius Likaóniát a galáciai Amyntasnak adta, és Amyntas Kr. e. 25-ös halálakor az új római Galácia provinciához került. Klaudius alatt a város a Claudiconium nevet vette fel, Hadrianus pedig római kolóniává tette. Plinius a legnevezetesebb városnak nevezi."
    - "Pál és Barnabás itt jelent meg, miután kiűzték őket a piszídiai Antiókhiából. A zsinagógában beszéltek, és „mind zsidóknak, mind görögöknek nagy sokasága lőn hívővé.” Sokáig maradtak, de a város megoszlott; amikor a pogányok és a zsidók vezetőikkel követ akartak rájuk dobni, Lisztrába és Derbébe menekültek. A Timóteushoz írt második levél felidézi az Ikóniumban elszenvedett üldözéseket. Ikóniumi zsidók később a lisztraiakat is Pál ellen fordították. Visszaúton az apostolok ismét áthaladtak Ikóniumon, és később az ottani testvérek jót mondtak Timóteusról."
    - "A Pál-cselekedetek, a 2. században Ázsiában írva, e városba helyezik Thekla történetét, egy ikóniumi fiatal nőét, aki otthagyta jegyesét, hogy Pált kövesse. A 3. században Galácia, Kilikia és a szomszédos tartományok püspökei gyűltek össze Ikóniumban, és kimondták, hogy az egyházon kívül adott keresztség nem érvényes, ahogyan a cézáreai Firmilianus elmondta Cyprianusnak. A 4. század végén Amphilochius, Ikónium püspöke vezető személyisége volt a 381-es konstantinápolyi zsinatnak."
  fi:
    - "Ikonion on nykyinen Konyan kaupunki Keski-Anatolian ylätasangon reunalla, ja muinainen kaupunki sijaitsee sen alla. Vuonna 401 eaa. Ksenofon, marssiessaan itään nuoremman Kyyroksen kanssa, kutsuu sitä Fryygian viimeiseksi kaupungiksi; armeija lepäsi siellä kolme päivää ennen siirtymistään Lykaoniaan. Myöhemmät kirjoittajat lukevat sen Lykaonian kaupungiksi. Sen 1. vuosisadan eaa. kolikoissa on Perseus, sillä kreikkalaiset selittivät sen nimen Gorgon pään kuvasta, eikonista."
    - "Strabon kuvaa Ikonionin hyvin asutuksi kaupungiksi, jolla oli rikkaampi alue kuin sitä ympäröivällä kuivalla Lykaonian tasangolla; kaupunkia oli kerran hallinnut kuningas Polemon. Marcus Antonius antoi Lykaonian Galatian Amyntakselle, ja Amyntaksen kuoltua vuonna 25 eaa. se siirtyi uuteen Rooman Galatian provinssiin. Klaudiuksen aikana kaupunki sai nimen Claudiconium, ja Hadrianus teki siitä roomalaisen siirtokunnan. Plinius kutsuu sitä hyvin kuuluisaksi kaupungiksi."
    - "Paavali ja Barnabas tulivat tänne karkotettuina Pisidian Antiokiasta. He puhuivat synagogassa, ja ”suuri joukko sekä juutalaisia että kreikkalaisia uskoi”. He viipyivät pitkään, mutta kaupunki jakautui; kun pakanat ja juutalaiset johtajineen lähtivät kivittämään heitä, he pakenivat Lystraan ja Derbeen. Toinen kirje Timoteukselle muistaa vainot, jotka Paavali kärsi Ikonionissa. Juutalaiset Ikonionista auttoivat myöhemmin kääntämään Lystran väen Paavalia vastaan. Paluumatkalla apostolit kulkivat Ikonionin kautta jälleen, ja myöhemmin siellä olevat veljet puhuivat hyvää Timoteuksesta."
    - "Paavalin teot, kirjoitettu Aasiassa 100-luvulla, sijoittavat tähän kaupunkiin Teklan tarinan, nuoren ikonionilaisen naisen, joka jätti kihlattunsa seuratakseen Paavalia. 200-luvulla Galatian, Kilikian ja naapurimaiden piispat kokoontuivat Ikonionissa ja päättivät, että kirkon ulkopuolella annettu kaste ei ollut pätevä, kuten Kesarean Firmilianos kertoi Cyprianukselle. 300-luvun lopulla Ikonionin piispa Amfilokhios oli johtava hahmo Konstantinopolin kirkolliskokouksessa vuonna 381."
  vi:
    - "Y-cô-ni là thành phố Konya hiện đại, ở rìa cao nguyên trung Anatolia, và thành cổ nằm bên dưới. Năm 401 TCN Xenophon, hành quân về phía đông cùng Si-ru trẻ, gọi đó là thành cuối cùng của Phi-ri-gi; quân đội nghỉ ở đó ba ngày trước khi vượt vào Ly-cao-ni. Các tác giả về sau kể đó là thành của Ly-cao-ni. Tiền đúc thế kỷ 1 TCN của thành cho thấy Perseus, vì người Hy Lạp giải thích tên từ hình, eikon, của đầu Gorgon."
    - "Strabo mô tả Y-cô-ni là một thành dân cư đông, có lãnh thổ phì nhiêu hơn đồng bằng Ly-cao-ni khô cằn quanh đó; thành từng do vua Polemon nắm giữ. Mark Antony ban Ly-cao-ni cho Amyntas của Ga-la-ti, và khi Amyntas chết năm 25 TCN nó thuộc tỉnh La Mã mới Ga-la-ti. Dưới Cơ-lốt, thành lấy tên Claudiconium, và Hadrian biến nó thành thuộc địa La Mã. Pliny gọi đó là một thành rất nổi tiếng."
    - "Phao-lô và Ba-na-ba đến đây sau khi bị đuổi khỏi An-ti-ốt xứ Bi-si-đi. Họ giảng trong hội đường, và “giảng một cách đến nỗi có rất nhiều người Giu-đa và người Gờ-réc tin theo”. Họ ở lại lâu, nhưng thành bị chia rẽ; khi “những người ngoại và người Giu-đa cùng các quan mình nổi lên đặng hà hiếp và ném đá hai sứ đồ”, họ chạy đến Lít-trơ và Đẹt-bơ. Thư thứ hai gửi Ti-mô-thê nhắc các cuộc bắt bớ Phao-lô chịu tại Y-cô-ni. Người Do Thái từ Y-cô-ni về sau giúp xúi dân Lít-trơ chống Phao-lô. Trên đường về, các sứ đồ lại đi qua Y-cô-ni, và về sau anh em ở đó nói tốt về Ti-mô-thê."
    - "Công vụ Phao-lô, viết ở A-si vào thế kỷ 2, đặt câu chuyện về Thecla, một thiếu nữ ở Y-cô-ni rời hôn phu để theo Phao-lô, ở thành này. Vào thế kỷ 3, các giám mục từ Ga-la-ti, Si-li-si và các xứ lân cận họp tại Y-cô-ni và phán quyết rằng phép báp-tem ban ngoài Hội thánh không có giá trị, như Firmilian xứ Sê-sa-rê nói với Cyprian. Cuối thế kỷ 4, Amphilochius, giám mục Y-cô-ni, là nhân vật hàng đầu tại Công đồng Constantinople năm 381."
  ro:
    - "Iconia este orașul modern Konya, la marginea podișului Anatoliei centrale, iar orașul antic se află sub el. În 401 î.Hr., Xenofon, mărșăluind spre est cu Cir cel Tânăr, îl numește ultimul oraș al Frigiei; armata s-a odihnit acolo trei zile înainte de a trece în Licaonia. Scriitori de mai târziu îl numără printre orașele Licaoniei. Monedele lui din secolul I î.Hr. îl arată pe Perseu, fiindcă grecii explicau numele lui prin imaginea, eikon, capului Gorgonei."
    - "Strabon descrie Iconia ca pe un oraș bine populat, cu un teritoriu mai bogat decât uscata câmpie licaoniană din jur; orașul fusese odinioară stăpânit de regele Polemon. Marcus Antonius a dat Licaonia lui Amyntas al Galatiei, iar la moartea lui Amyntas, în 25 î.Hr., ea a trecut noii provincii romane Galatia. Sub Claudiu, orașul a luat numele Claudiconium, iar Hadrian l-a făcut colonie romană. Pliniu îl numește un oraș foarte vestit."
    - "Pavel și Barnaba au venit aici după ce fuseseră izgoniți din Antiohia Pisidiei. Au vorbit în sinagogă și „au crezut din Iudei și din Elini mulțime multă”. Au stat mult timp, dar orașul s-a împărțit; când neamurile și iudeii, cu căpeteniile lor, au pornit să-i omoare cu pietre, ei au fugit la Listra și Derba. A doua epistolă către Timotei amintește de persecuțiile pe care Pavel le-a îndurat la Iconia. Iudei din Iconia au ajutat mai târziu să fie întors poporul din Listra împotriva lui Pavel. La întoarcere, apostolii au trecut din nou prin Iconia, iar mai târziu frații de acolo au vorbit bine despre Timotei."
    - "Faptele lui Pavel, scrise în Asia în secolul al II-lea, plasează în acest oraș povestea Teclei, o tânără din Iconia care și-a părăsit logodnicul ca să-l urmeze pe Pavel. În secolul al III-lea, episcopi din Galatia, Cilicia și ținuturile învecinate s-au întâlnit la Iconia și au hotărât că botezul dat în afara Bisericii nu este valid, după cum i-a spus Firmilian al Cezareei lui Ciprian. În a doua parte a secolului al IV-lea, Amfilohie, episcopul Iconiei, a fost o figură de frunte la Sinodul de la Constantinopol din 381."
  bg:
    - "Икония е днешният град Коня, на края на Централноанадолското плато, а древният град лежи под него. През 401 г. пр.н.е. Ксенофонт, който вървеше на изток с Кир Млади, я нарича последния град на Фригия; войската почива там три дни, преди да премине в Ликаония. По-късните автори я броят за град на Ликаония. Монетите ѝ от I в. пр.н.е. изобразяват Персей, понеже гърците обясняваха името ѝ от образа, ейкон, на главата на Горгоната."
    - "Страбон описва Икония като добре населен град с по-богата земя от сухата Ликаонска равнина около него; някога градът е бил владение на цар Полемон. Марк Антоний даде Ликаония на Аминта Галатийски, а след смъртта на Аминта през 25 г. пр.н.е. тя премина към новата римска провинция Галатия. При Клавдий градът прие името Клавдикония, а Адриан го направи римска колония. Плиний го нарича най-прочут град."
    - "Павел и Варнава дойдоха тук, след като бяха изгонени от Антиохия Писидийска. Те говориха в синагогата и „много множество Юдеи и Елини поверваха“. Те останаха дълго време, но градът се раздели; когато езичници и юдеи с началниците си се надигнаха да ги убият с камъни, те избягаха в Листра и Дервия. Второто послание до Тимотей припомня гоненията, които Павел претърпя в Икония. По-късно юдеи от Икония помогнаха да се настрои народът в Листра против Павел. На връщане апостолите отново минаха през Икония, а по-късно братята там свидетелстваха добре за Тимотей."
    - "„Деяния на Павел“, написани в Азия през II в., поставят в този град историята на Текла — млада жена от Икония, която остави годеника си, за да последва Павел. През III в. епископи от Галатия, Киликия и съседните земи се събраха в Икония и постановиха, че кръщението, дадено извън Църквата, не е действително, както Фирмилиан Кесарийски съобщи на Киприан. В края на IV в. Амфилохий, епископ на Икония, беше водеща фигура на Константинополския събор през 381 г."
