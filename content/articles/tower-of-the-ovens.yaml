# Overview article (ADR 0007). Mainstream facts only; the tower of the furnaces on Nehemiah's western wall; position and the origin of the name given as uncertain.
id: tower-of-the-ovens
place: a721f7f
title:
  en: "Tower of the Ovens"
  ru: "Башня Печная"
  uk: "Вежа Пічна"
  es: "Torre de los Hornos"
  pt: "Torre dos Fornos"
  de: "Ofenturm"
  fr: "Tour des Fours"
body:
  en:
    - "The Tower of the Ovens, “the tower of the furnaces” in the King James Version, was a tower on the wall of Jerusalem rebuilt by Nehemiah in the mid-fifth century BC. In the list of builders Malchijah son of Harim and Hashub son of Pahath-moab “repaired the other piece, and the tower of the furnaces”; at the dedication of the wall the second choir set out “from beyond the tower of the furnaces even unto the broad wall”, and went on round by the north to the sheep gate. The name may come from bakers' ovens or kilns nearby; Jeremiah mentions a bakers' street in the city, but nothing ties it to this tower."
    - "From its place in the lists, between the Broad Wall and the Valley Gate, the tower stood on the western side of the city, and some put it at the north-west corner of the wall. It has not been found. In the Jewish Quarter of the Old City Nahman Avigad uncovered in 1970 a stretch of a massive late-eighth-century wall, often identified with the Broad Wall, but whether Nehemiah's wall still ran so far west is debated. The map places the tower simply in Jerusalem."
  ru:
    - "Башня Печная стояла на стене Иерусалима, восстановленной Неемией в середине V века до н. э. В списке строителей сказано, что Малхия, сын Харима, и Хашшув, сын Пахаф-Моава, чинили второй участок; «они же чинили и башню Печную»; при освящении стены второй хор шёл «по стене от Печной башни и до широкой стены» и дальше кругом по северной стороне к Овечьим воротам. Имя, возможно, дано по хлебным печам или обжиговым печам поблизости; Иеремия упоминает в городе улицу хлебопеков, но ничто не связывает её с этой башней."
    - "По месту в списках, между Широкой стеной и воротами Долины, башня стояла на западной стороне города, и некоторые помещают её у северо-западного угла стены. Она не найдена. В Еврейском квартале Старого города Нахман Авигад в 1970 году открыл участок мощной стены конца VIII века до н. э., которую часто отождествляют с Широкой стеной, но заходила ли стена Неемии так далеко на запад, спорно. На карте башня помещена просто в Иерусалиме."
  uk:
    - "Вежа Пічна, «Пічана башта» у перекладі Куліша, була вежею на мурі Єрусалима, відбудованою Неемією в середині V ст. до н. е. У переліку будівничих Малхія, син Харима, і Хашшув, син Пахат-Моава, «вони ж поправляли і башту Пічану»; на освяченні муру другий хор вирушив «по мурі від Пічаної башти і до широкого муру» і пішов далі навколо півночі до Овечих воріт. Назва може походити від пекарських печей чи горнів поблизу; Єремія згадує в місті пекарську вулицю, але ніщо не пов’язує її з цією вежею."
    - "З її місця в переліках, між Широкою стіною і Воротами Долини, вежа стояла на західному боці міста, і дехто ставить її на північно-західному куті муру. Її не знайдено. В Єврейському кварталі Старого міста Нахман Авігад виявив 1970 року ділянку масивного муру кінця VIII ст. до н. е., який часто ототожнюють із Широкою стіною, але чи доходив Неемієвий мур так далеко на захід, дискутується. Мапа просто позначає вежу в Єрусалимі."
  es:
    - "La Torre de los Hornos, «the tower of the furnaces» en la versión King James, era una torre de la muralla de Jerusalén reconstruida por Nehemías a mediados del siglo V a. C. En la lista de los constructores, Malquías hijo de Harim y Hasub hijo de Pahat-moab «restauraron la otra medida, y la torre de los Hornos»; en la dedicación de la muralla el segundo coro salió «desde la torre de los Hornos hasta el muro ancho», y siguió por el norte hasta la Puerta de las Ovejas. El nombre puede proceder de hornos de panaderos o de alfareros cercanos; Jeremías menciona una calle de los panaderos en la ciudad, pero nada la vincula a esta torre."
    - "Por su lugar en las listas, entre el Muro Ancho y la Puerta del Valle, la torre se alzaba en el lado occidental de la ciudad, y algunos la sitúan en el ángulo noroeste de la muralla. No se ha hallado. En el Barrio Judío de la Ciudad Vieja, Nahman Avigad sacó a la luz en 1970 un tramo de una muralla masiva de finales del siglo VIII a. C., a menudo identificada con el Muro Ancho, pero se discute si la muralla de Nehemías llegaba todavía tan al oeste. El mapa sitúa la torre sencillamente en Jerusalén."
  pt:
    - "A Torre dos Fornos, a “torre das fornalhas” na versão King James, era uma torre na muralha de Jerusalém reconstruída por Neemias em meados do século V a.C. Na lista dos construtores, Malquias, filho de Harim, e Hassube, filho de Paate-Moabe, “repararam outra parte, bem como a Torre dos Fornos”; na dedicação da muralha, o segundo coro partiu “passando pela Torre dos Fornos, até a Muralha Larga” e seguiu pelo norte até a Porta das Ovelhas. O nome pode vir de fornos de padeiros ou de olarias próximos; Jeremias menciona uma rua dos padeiros na cidade, mas nada a liga a esta torre."
    - "Por seu lugar nas listas, entre o Muro Largo e a Porta do Vale, a torre ficava no lado ocidental da cidade, e alguns a põem no canto noroeste da muralha. Não foi encontrada. No Bairro Judeu da Cidade Velha, Nahman Avigad descobriu em 1970 um trecho de uma maciça muralha do fim do século VIII, muitas vezes identificada com o Muro Largo, mas se a muralha de Neemias ainda corria tão para oeste é debatido. O mapa situa a torre simplesmente em Jerusalém."
  de:
    - "Der Ofenturm, in der King-James-Bibel „Turm der Schmelzöfen“, war ein Turm an der Mauer Jerusalems, den Nehemia Mitte des fünften Jahrhunderts v. Chr. wiederaufbaute. In der Liste der Bauleute heißt es von Malkija, dem Sohn Harims, und Haschub, dem Sohn Pahat-Moabs: „bauten ein andres Stück und den Ofenturm“; bei der Einweihung der Mauer zog der zweite Chor „oben auf der Mauer zum Ofenturm hinan und bis an die breite Mauer“ und weiter im Norden herum zum Schaftor. Der Name mag von Backöfen oder Brennöfen in der Nähe kommen; Jeremia erwähnt eine Bäckergasse in der Stadt, doch nichts verbindet sie mit diesem Turm."
    - "Nach seiner Stellung in den Listen, zwischen der Breiten Mauer und dem Taltor, stand der Turm auf der Westseite der Stadt, und manche setzen ihn an die Nordwestecke der Mauer. Er ist nicht gefunden worden. Im Jüdischen Viertel der Altstadt legte Nahman Avigad 1970 ein Stück einer massiven Mauer des späten achten Jahrhunderts frei, oft mit der Breiten Mauer gleichgesetzt, doch ist umstritten, ob Nehemias Mauer noch so weit nach Westen verlief. Die Karte setzt den Turm schlicht nach Jerusalem."
  fr:
    - "La Tour des Fours, « tour des fourneaux » dans la version King James, était une tour du mur de Jérusalem rebâtie par Néhémie au milieu du Ve siècle av. J.-C. Dans la liste des bâtisseurs, Malkija fils de Harim et Haschub fils de Pachath-Moab réparèrent « une autre portion de la muraille et la tour des fours » ; à la dédicace du mur, le second chœur se mit en marche : « Passant au-dessus de la tour des fours, on alla jusqu’à la muraille large », puis poursuivit par le nord jusqu’à la porte des brebis. Le nom peut venir de fours de boulangers ou de fours à poterie voisins ; Jérémie mentionne une rue des boulangers dans la ville, mais rien ne la relie à cette tour."
    - "D’après sa place dans les listes, entre la Muraille large et la porte de la Vallée, la tour se dressait sur le côté ouest de la ville, et certains la placent à l’angle nord-ouest du mur. Elle n’a pas été retrouvée. Dans le quartier juif de la Vieille Ville, Nahman Avigad dégagea en 1970 un tronçon d’un massif mur de la fin du VIIIe siècle, souvent identifié à la Muraille large, mais on débat si le mur de Néhémie allait encore aussi loin vers l’ouest. La carte place simplement la tour à Jérusalem."
