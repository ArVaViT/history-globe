# Overview article (ADR 0007). Mainstream facts only; the tower of the furnaces on Nehemiah's western wall; position and the origin of the name given as uncertain.
id: tower-of-the-ovens
place: a721f7f
title:
  en: "Tower of the Ovens"
  ru: "Башня Печная"
  uk: "Вежа Пічна"
  es: "Torre de los Hornos"
  pt: "Torre dos Fornos"
  de: "Ofenturm"
  fr: "Tour des Fours"
  pl: "Wieża Pieców"
  it: "Torre dei Forni"
  nl: "Oventoren"
  cs: "Věž pecí"
  sv: "Ugnstornet"
  nb: "Ovnstårnet"
  tl: "Moog ng mga Hurno"
  da: "Ovntårnet"
  sr: "Кула од пећи"
  hu: "Kemencék tornya"
  fi: "Uunien torni"
  vi: "Tháp Lò"
  ro: "Turnul Cuptoarelor"
  bg: "Кулата на пещите"
body:
  en:
    - "The Tower of the Ovens, “the tower of the furnaces” in the King James Version, was a tower on the wall of Jerusalem rebuilt by Nehemiah in the mid-fifth century BC. In the list of builders Malchijah son of Harim and Hashub son of Pahath-moab “repaired the other piece, and the tower of the furnaces”; at the dedication of the wall the second choir set out “from beyond the tower of the furnaces even unto the broad wall”, and went on round by the north to the sheep gate. The name may come from bakers' ovens or kilns nearby; Jeremiah mentions a bakers' street in the city, but nothing ties it to this tower."
    - "From its place in the lists, between the Broad Wall and the Valley Gate, the tower stood on the western side of the city, and some put it at the north-west corner of the wall. It has not been found. In the Jewish Quarter of the Old City Nahman Avigad uncovered around 1970 a stretch of a massive eighth-century wall, often identified with the Broad Wall, but whether Nehemiah's wall still ran so far west is debated. The map places the tower simply in Jerusalem."
  ru:
    - "Башня Печная стояла на стене Иерусалима, восстановленной Неемией в середине V века до н. э. В списке строителей сказано, что Малхия, сын Харима, и Хашшув, сын Пахаф-Моава, чинили второй участок; «они же чинили и башню Печную»; при освящении стены второй хор шёл «по стене от Печной башни и до широкой стены» и дальше кругом по северной стороне к Овечьим воротам. Имя, возможно, дано по хлебным печам или обжиговым печам поблизости; Иеремия упоминает в городе улицу хлебопеков, но ничто не связывает её с этой башней."
    - "По месту в списках, между Широкой стеной и воротами Долины, башня стояла на западной стороне города, и некоторые помещают её у северо-западного угла стены. Она не найдена. В Еврейском квартале Старого города Нахман Авигад около 1970 года открыл участок мощной стены VIII века до н. э., которую часто отождествляют с Широкой стеной, но заходила ли стена Неемии так далеко на запад, спорно. На карте башня помещена просто в Иерусалиме."
  uk:
    - "Вежа Пічна, «Пічана башта» у перекладі Куліша, була вежею на мурі Єрусалима, відбудованою Неемією в середині V ст. до н. е. У переліку будівничих Малхія, син Харима, і Хашшув, син Пахат-Моава, «вони ж поправляли і башту Пічану»; на освяченні муру другий хор вирушив «по мурі від Пічаної башти і до широкого муру» і пішов далі навколо півночі до Овечих воріт. Назва може походити від пекарських печей чи горнів поблизу; Єремія згадує в місті пекарську вулицю, але ніщо не пов’язує її з цією вежею."
    - "З її місця в переліках, між Широкою стіною і Воротами Долини, вежа стояла на західному боці міста, і дехто ставить її на північно-західному куті муру. Її не знайдено. В Єврейському кварталі Старого міста Нахман Авігад виявив близько 1970 року ділянку масивного муру VIII ст. до н. е., який часто ототожнюють із Широкою стіною, але чи доходив Неемієвий мур так далеко на захід, дискутується. Мапа просто позначає вежу в Єрусалимі."
  es:
    - "La Torre de los Hornos, «the tower of the furnaces» en la versión King James, era una torre de la muralla de Jerusalén reconstruida por Nehemías a mediados del siglo V a. C. En la lista de los constructores, Malquías hijo de Harim y Hasub hijo de Pahat-moab «restauraron la otra medida, y la torre de los Hornos»; en la dedicación de la muralla el segundo coro salió «desde la torre de los Hornos hasta el muro ancho», y siguió por el norte hasta la Puerta de las Ovejas. El nombre puede proceder de hornos de panaderos o de alfareros cercanos; Jeremías menciona una calle de los panaderos en la ciudad, pero nada la vincula a esta torre."
    - "Por su lugar en las listas, entre el Muro Ancho y la Puerta del Valle, la torre se alzaba en el lado occidental de la ciudad, y algunos la sitúan en el ángulo noroeste de la muralla. No se ha hallado. En el Barrio Judío de la Ciudad Vieja, Nahman Avigad sacó a la luz hacia 1970 un tramo de una muralla masiva del siglo VIII a. C., a menudo identificada con el Muro Ancho, pero se discute si la muralla de Nehemías llegaba todavía tan al oeste. El mapa sitúa la torre sencillamente en Jerusalén."
  pt:
    - "A Torre dos Fornos, a “torre das fornalhas” na versão King James, era uma torre na muralha de Jerusalém reconstruída por Neemias em meados do século V a.C. Na lista dos construtores, Malquias, filho de Harim, e Hassube, filho de Paate-Moabe, “repararam outra parte, bem como a Torre dos Fornos”; na dedicação da muralha, o segundo coro partiu “passando pela Torre dos Fornos, até a Muralha Larga” e seguiu pelo norte até a Porta das Ovelhas. O nome pode vir de fornos de padeiros ou de olarias próximos; Jeremias menciona uma rua dos padeiros na cidade, mas nada a liga a esta torre."
    - "Por seu lugar nas listas, entre o Muro Largo e a Porta do Vale, a torre ficava no lado ocidental da cidade, e alguns a põem no canto noroeste da muralha. Não foi encontrada. No Bairro Judeu da Cidade Velha, Nahman Avigad descobriu por volta de 1970 um trecho de uma maciça muralha do século VIII, muitas vezes identificada com o Muro Largo, mas se a muralha de Neemias ainda corria tão para oeste é debatido. O mapa situa a torre simplesmente em Jerusalém."
  de:
    - "Der Ofenturm, in der King-James-Bibel „Turm der Schmelzöfen“, war ein Turm an der Mauer Jerusalems, den Nehemia Mitte des fünften Jahrhunderts v. Chr. wiederaufbaute. In der Liste der Bauleute heißt es von Malkija, dem Sohn Harims, und Haschub, dem Sohn Pahat-Moabs: „bauten ein andres Stück und den Ofenturm“; bei der Einweihung der Mauer zog der zweite Chor „oben auf der Mauer zum Ofenturm hinan und bis an die breite Mauer“ und weiter im Norden herum zum Schaftor. Der Name mag von Backöfen oder Brennöfen in der Nähe kommen; Jeremia erwähnt eine Bäckergasse in der Stadt, doch nichts verbindet sie mit diesem Turm."
    - "Nach seiner Stellung in den Listen, zwischen der Breiten Mauer und dem Taltor, stand der Turm auf der Westseite der Stadt, und manche setzen ihn an die Nordwestecke der Mauer. Er ist nicht gefunden worden. Im Jüdischen Viertel der Altstadt legte Nahman Avigad um 1970 ein Stück einer massiven Mauer des achten Jahrhunderts frei, oft mit der Breiten Mauer gleichgesetzt, doch ist umstritten, ob Nehemias Mauer noch so weit nach Westen verlief. Die Karte setzt den Turm schlicht nach Jerusalem."
  fr:
    - "La Tour des Fours, « tour des fourneaux » dans la version King James, était une tour du mur de Jérusalem rebâtie par Néhémie au milieu du Ve siècle av. J.-C. Dans la liste des bâtisseurs, Malkija fils de Harim et Haschub fils de Pachath-Moab réparèrent « une autre portion de la muraille et la tour des fours » ; à la dédicace du mur, le second chœur se mit en marche : « Passant au-dessus de la tour des fours, on alla jusqu’à la muraille large », puis poursuivit par le nord jusqu’à la porte des brebis. Le nom peut venir de fours de boulangers ou de fours à poterie voisins ; Jérémie mentionne une rue des boulangers dans la ville, mais rien ne la relie à cette tour."
    - "D’après sa place dans les listes, entre la Muraille large et la porte de la Vallée, la tour se dressait sur le côté ouest de la ville, et certains la placent à l’angle nord-ouest du mur. Elle n’a pas été retrouvée. Dans le quartier juif de la Vieille Ville, Nahman Avigad dégagea vers 1970 un tronçon d’un massif mur du VIIIe siècle, souvent identifié à la Muraille large, mais on débat si le mur de Néhémie allait encore aussi loin vers l’ouest. La carte place simplement la tour à Jérusalem."
  pl:
    - "Wieża Pieców, w Biblii Króla Jakuba „wieża palenisk”, była wieżą w murze Jerozolimy odbudowanym przez Nehemiasza w połowie V wieku p.n.e. Na liście budowniczych Malkiasz, syn Charima, i Chaszub, syn Pachat-Moaba, pracowali, jak czytamy: „Części zaś drugiej poprawiał Malchyjasz, syn Harymowy, i Hasub, syn Pachatmoabowy, także i wieżę Tannurym”; przy poświęceniu muru drugi chór wyruszył „po murze od wieży Tannurym aż do muru szerokiego” i ruszył dalej przez północ do Bramy Owczej. Nazwa może pochodzić od piekarskich pieców lub pieców do wypału w pobliżu; Jeremiasz wspomina ulicę piekarską w mieście, ale nic nie łączy jej z tą wieżą."
    - "Z miejsca na listach, między Szerokim Murem a Bramą Doliny, wieża stała po zachodniej stronie miasta, a niektórzy umieszczają ją w północno-zachodnim narożniku muru. Nie została odnaleziona. W Dzielnicy Żydowskiej Starego Miasta Nachman Awigad odsłonił około 1970 roku odcinek masywnego muru z VIII wieku, często utożsamianego z Szerokim Murem, ale czy mur Nehemiasza biegł jeszcze tak daleko na zachód, jest sporne. Mapa umieszcza wieżę po prostu w Jerozolimie."
  it:
    - "La Torre dei Forni, «the tower of the furnaces» nella King James Version, era una torre sul muro di Gerusalemme ricostruita da Neemia a metà del V secolo a.C. Nell’elenco dei costruttori Malchia figlio di Carim e Cassub figlio di Paat-Moab «restaurarono un’altra parte delle mura e la torre de’ Forni»; alla dedicazione del muro il secondo coro: «Passando al disopra della torre de’ Forni, esso andò fino alle mura larghe», e proseguì poi a nord fino alla porta delle Pecore. Il nome può venire da forni di fornai o fornaci vicini; Geremia menziona nella città una via dei fornai, ma nulla la lega a questa torre."
    - "Dal suo posto negli elenchi, fra il Muro Largo e la Porta della Valle, la torre sorgeva sul lato occidentale della città, e alcuni la pongono all’angolo nord-occidentale del muro. Non è stata trovata. Nel Quartiere Ebraico della Città Vecchia Nahman Avigad portò alla luce intorno al 1970 un tratto di un massiccio muro dell’VIII secolo, spesso identificato con il Muro Largo, ma se il muro di Neemia corresse ancora così a ovest è discusso. La mappa colloca la torre semplicemente a Gerusalemme."
  nl:
    - "De Oventoren, in de King James Version “the tower of the furnaces”, was een toren op de muur van Jeruzalem die Nehemia in het midden van de vijfde eeuw v.Chr. herbouwde. In de lijst van bouwers staat: “De andere mate verbeterden Malchia, de zoon van Harim, en Hassub, de zoon van Pahath-Moab; daartoe den Bakoventoren”; bij de inwijding van de muur vertrok het tweede koor “van boven den Bakoventoren, tot aan den breden muur”, en ging verder langs het noorden naar de Schapenpoort. De naam kan afkomstig zijn van bakkersovens of ovens in de buurt; Jeremia vermeldt een bakkersstraat in de stad, maar niets verbindt die met deze toren."
    - "Naar zijn plaats in de lijsten, tussen de Brede Muur en de Dalpoort, stond de toren aan de westzijde van de stad, en sommigen plaatsen hem op de noordwesthoek van de muur. Hij is niet gevonden. In de Joodse Wijk van de Oude Stad legde Nahman Avigad rond 1970 een stuk bloot van een massieve muur uit de achtste eeuw v.Chr., vaak vereenzelvigd met de Brede Muur, maar of de muur van Nehemia nog zo ver naar het westen liep, wordt betwist. De kaart plaatst de toren eenvoudig in Jeruzalem."
  cs:
    - "Věž pecí, v King James Version „tower of the furnaces“, byla věž na hradbě Jeruzaléma, kterou Nehemjáš obnovil v polovině 5. stol. př. n. l. V seznamu stavitelů stojí: „Druhý pak díl opravoval Malkiáš syn Charimův, a Chasub syn Pachat Moábův, a věži Tannurim“; při vysvěcení hradby druhý sbor vyšel „od věže Tannurim až ke zdi široké“ a pokračoval dokola severem k Ovčí bráně. Jméno může pocházet z pekařských pecí nebo pecí na pálení poblíž; Jeremjáš zmiňuje ve městě ulici pekařů, ale nic ji s touto věží nespojuje."
    - "Podle místa v seznamech, mezi Širokou hradbou a Bránou v údolí, stála věž na západní straně města a někteří ji kladou do severozápadního rohu hradby. Nebyla nalezena. V Židovské čtvrti Starého Města odkryl Nachman Avigad kolem roku 1970 úsek mohutné hradby z 8. století, často ztotožňované se Širokou hradbou, ale zda Nehemjášova hradba sahala ještě tak daleko na západ, je sporné. Mapa klade věž prostě do Jeruzaléma."
  sv:
    - "Ugnstornet, ”the tower of the furnaces” i King James-översättningen, var ett torn på Jerusalems mur som Nehemja byggde upp i mitten av 400-talet f.Kr. I förteckningen över byggarna heter det: ”En annan sträcka sattes i stånd av Malkia, Harims son, och av Hassub, Pahat-Moabs son, och därjämte Ugnstornet”; vid invigningen av muren gick den andra lovsångskören ”ovanpå muren, upp genom Ugnstornet ända till Breda muren”, och fortsatte sedan runt norrut till Fårporten. Namnet kan komma från bagarugnar eller tegelugnar i närheten; Jeremia nämner en bagaregata i staden, men ingenting förbinder den med detta torn."
    - "Av sin plats i förteckningarna, mellan Breda muren och Dalporten, stod tornet på stadens västra sida, och några förlägger det till murens nordvästra hörn. Det har inte hittats. I Gamla stadens judiska kvarter frilade Nahman Avigad omkring 1970 en sträcka av en massiv mur från 700-talet f.Kr., ofta identifierad med Breda muren, men om Nehemjas mur ännu gick så långt västerut är omdebatterat. Kartan placerar tornet helt enkelt i Jerusalem."
  nb:
    - "Ovnstårnet, «ovnenes tårn» i King James-oversettelsen, var et tårn i Jerusalems mur som Nehemja gjenreiste midt på 400-tallet f.Kr. I listen over byggerne heter det: «Et annet stykke blev satt i stand av Malkia, Harims sønn, og Hassub, Pahat-Moabs sønn, og dessuten Ovnstårnet»; ved innvielsen av muren la det andre koret ut «ovenfor Ovnstårnet, bort til den brede mur», og gikk videre rundt i nord til Saueporten. Navnet kan komme fra bakerovner eller tegloovner i nærheten; Jeremia nevner en bakernes gate i byen, men ingenting knytter den til dette tårnet."
    - "Ut fra plasseringen i listene, mellom Bredmuren og Dalporten, sto tårnet på vestsiden av byen, og noen plasserer det i murens nordvesthjørne. Det er ikke funnet. I Det jødiske kvarter i Gamlebyen avdekket Nahman Avigad omkring 1970 en strekning av en massiv mur fra 700-tallet f.Kr., ofte identifisert med Bredmuren, men om Nehemjas mur fortsatt løp så langt mot vest, er omdiskutert. Kartet plasserer tårnet ganske enkelt i Jerusalem."
  tl:
    - "Ang Moog ng mga Hurno, na “the tower of the furnaces” sa King James Version, ay moog sa pader ng Jerusalem na itinayong muli ni Nehemias sa kalagitnaan ng ika-5 siglo BK. Sa talaan ng mga nagtayo, sina Malchias na anak ni Harim at Hasub na anak ni Pahath-moab ay nag-ayos ng “ibang bahagi at ang moog ng mga hurno”; sa pagtatalaga ng pader, ang ikalawang koro ay lumabas “sa itaas ng moog ng mga hurno, hanggang sa maluwang na kuta”, at nagpatuloy sa hilaga patungo sa Pintuang-bayan ng mga Tupa. Maaaring mula sa mga hurno ng panadero o tapahan sa malapit ang pangalan; binabanggit ni Jeremias ang kalye ng mga panadero sa lunsod, ngunit walang nag-uugnay nito sa moog na ito."
    - "Mula sa lugar nito sa mga talaan, sa pagitan ng Malapad na Kuta at ng Pintuang-bayan ng Libis, nakatayo ang moog sa kanlurang panig ng lunsod, at inilalagay ito ng ilan sa hilagang-kanlurang sulok ng pader. Hindi pa ito natatagpuan. Sa Purok ng mga Judio ng Lumang Lunsod, naglantad si Nahman Avigad noong mga 1970 ng bahagi ng malaking pader ng ika-8 siglo, na madalas kilalanin bilang Malapad na Kuta, ngunit pinagtatalunan kung umabot pa nang ganoon kalayo sa kanluran ang pader ni Nehemias. Inilalagay lamang ng mapa ang moog sa Jerusalem."
  da:
    - "Ovntårnet, »ovnenes tårn« i King James-oversættelsen, var et tårn på Jerusalems mur, genopbygget af Nehemias i midten af 400-tallet f.Kr. I listen over bygmestre var det Malkija, Harims søn, og Hasjub, Pahat-Moabs søn, der »istandsatte en anden Strækning, tilmed Ovntaarnet«; ved murens indvielse tog det andet kor af sted og gik »hen op til Ovntaarnet og indtil den brede Mur« og fortsatte rundt mod nord til Fåreporten. Navnet kan komme af bagerovne eller teglovne i nærheden; Jeremias nævner en bagergade i byen, men intet knytter den til dette tårn."
    - "Ud fra dets plads i listerne, mellem Den Brede Mur og Dalporten, stod tårnet på byens vestlige side, og nogle placerer det i murens nordvestlige hjørne. Det er ikke fundet. I den gamle bys jødiske kvarter blottede Nahman Avigad omkring 1970 et stykke af en massiv mur fra 700-tallet f.Kr., ofte identificeret med Den Brede Mur, men om Nehemias' mur stadig løb så langt mod vest, er omdiskuteret. Kortet placerer tårnet blot i Jerusalem."
  sr:
    - "Кула од пећи, у Верзији краља Јакова „кула од топионица“, била је кула на зиду Јерусалима коју је обновио Немија средином 5. века п. н. е. У списку градитеља Малхија син Харимов и Асув син Фат-Моавов поправљају, како гласи текст: „Толико поправља Малахија син Харимов и Асув син Фат-Моавов и кулу код пећи“; при посвећењу зида други хор је кренуо „изнад куле пећке до широког зида“ и ишао даље око севера до Овчје капије. Име можда потиче од пекарских пећи или пећи за печење у близини; Јеремија помиње пекарску улицу у граду, али ништа је не веже за ову кулу."
    - "Судећи по месту у списковима, између Широког зида и Долинске капије, кула је стајала на западној страни града, а неки је смештају на северозападни угао зида. Није пронађена. У Јеврејској четврти Старог града Нахман Авигад је око 1970. открио део масивног зида из 8. века, често поистовећеног са Широким зидом, али је спорно да ли је Немијин зид још ишао тако далеко на запад. Карта кулу једноставно смешта у Јерусалим."
  hu:
    - "A Kemencék tornya, Károlinál „a kemenczék tornya”, Jeruzsálem falának egy tornya volt, amelyet Nehémiás a Kr. e. 5. század közepén újjáépített. Az építők jegyzékében: „A kőfal másik darabját javítgatá Malkija, Hárim fia és Hassub, a Pahath-Moáb fia, és a kemenczéknek tornyát”; a fal avatásán a második kar elindult „a kemenczék tornya mellett, mind a széles kőfalig”, és északról megkerülve a Juhkapuig ment tovább. A név a közeli pékkemencékből vagy égetőkemencékből eredhet; Jeremiás megemlít egy sütők utcáját a városban, de semmi sem köti ehhez a toronyhoz."
    - "A jegyzékekben elfoglalt helyéből a Széles fal és a Völgykapu között a torony a város nyugati oldalán állt, és egyesek a fal északnyugati sarkára teszik. Nem találták meg. Az Óváros zsidó negyedében Nahman Avigad 1970 körül feltárta egy hatalmas 8. századi fal egy szakaszát, amelyet gyakran a Széles fallal azonosítanak, de hogy Nehémiás fala még ilyen messze nyugatra futott-e, vitatott. A térkép a tornyot egyszerűen Jeruzsálemben jelöli."
  fi:
    - "Uunien torni, King James -käännöksessä ”sulatusuunien torni”, oli Jerusalemin muurin torni, jonka Nehemia jälleenrakensi 400-luvun puolivälissä eaa. Rakentajien luettelossa kerrotaan: ”Toisen osan korjasivat Malkia, Haarimin poika, ja Hassub, Pahat-Mooabin poika, sekä sen lisäksi Uunitornin”; muurin vihkiäisissä toinen laulukunta lähti ”Uunitornin yläpuolitse, aina Leveälle muurille asti” ja jatkoi pohjoisen kautta Lammasportille. Nimi voi tulla leipurien uuneista tai läheisistä polttouuneista; Jeremia mainitsee kaupungissa leipurien kadun, mutta mikään ei yhdistä sitä tähän torniin."
    - "Luetteloiden järjestyksestä, Leveän muurin ja Laaksoportin välistä, päätellen torni oli kaupungin länsipuolella, ja jotkut sijoittavat sen muurin luoteiskulmaan. Sitä ei ole löydetty. Vanhankaupungin juutalaiskorttelissa Nahman Avigad paljasti noin 1970 pätkän massiivista 700-luvun muuria, jonka usein tunnistetaan Leveäksi muuriksi, mutta onko Nehemian muuri yhä kulkenut niin kauas länteen, on kiistanalaista. Kartta sijoittaa tornin yksinkertaisesti Jerusalemiin."
  vi:
    - "Tháp Lò, “tháp các lò” trong bản King James, là một tháp trên tường thành Giê-ru-sa-lem do Nê-hê-mi xây lại vào giữa thế kỷ 5 TCN. Trong danh sách những người xây, Manh-ki-gia con của Ha-rim và Ha-súp con của Pha-hát-Mô-áp “tu bổ một phần khác và cái tháp lò”; trong lễ khánh thành vách thành, tốp thứ nhì khởi hành “từ tháp các Lò cho đến vách rộng”, rồi đi tiếp vòng phía bắc đến cửa Chiên. Tên có thể xuất phát từ lò bánh mì hay lò nung gần đó; Giê-rê-mi nhắc đến một phố thợ bánh trong thành, nhưng không gì nối nó với tháp này."
    - "Từ vị trí trong các danh sách, giữa Vách Rộng và Cửa Trũng, tháp đứng ở phía tây của thành, và một số người đặt nó ở góc tây bắc của tường. Chưa tìm thấy nó. Trong Khu Do Thái của Thành Cổ, khoảng năm 1970 Nahman Avigad phát lộ một đoạn tường đồ sộ thế kỷ 8, thường được đồng nhất với Vách Rộng, nhưng liệu vách của Nê-hê-mi còn chạy xa về phía tây đến thế không thì còn tranh luận. Bản đồ chỉ đặt tháp ở Giê-ru-sa-lem."
  ro:
    - "Turnul Cuptoarelor, „turnul furnalelor” în versiunea King James, era un turn de pe zidul Ierusalimului refăcut de Neemia pe la mijlocul secolului al V-lea î.Hr. În lista zidarilor, Malchia, fiul lui Harim, și Hașub, fiul lui Pahat-Moab, au refăcut cealaltă parte și turnul cuptoarelor: „Și cealaltă parte au zidit-o Melhia fiul lui Iram și Asuv fiul lui Faat Moav, până la turnul Tanarim”; la sfințirea zidului, al doilea cor a pornit „pre deasupra turnului Tanurimi, și până la zidul cel lat” și a mers mai departe în jurul laturii nordice până la Poarta Oilor. Numele poate veni de la cuptoarele brutarilor sau de la cuptoarele de ars din apropiere; Ieremia pomenește o uliță a brutarilor în cetate, dar nimic nu o leagă de acest turn."
    - "După locul din liste, între Zidul cel Lat și Poarta Văii, turnul se afla pe latura de vest a cetății, iar unii îl așază la colțul nord-vestic al zidului. Nu a fost găsit. În Cartierul Evreiesc al Orașului Vechi, Nahman Avigad a scos la iveală în jurul anului 1970 un tronson dintr-un zid masiv din secolul al VIII-lea, adesea identificat cu Zidul cel Lat, dar dacă zidul lui Neemia mergea încă atât de departe spre vest este dezbătut. Harta așază turnul pur și simplu în Ierusalim."
  bg:
    - "Кулата на пещите, в King James Version „the tower of the furnaces“, била кула на стената на Йерусалим, възстановена от Неемия в средата на V в. пр.н.е. В списъка на строителите Малхия, синът на Харим, и Хашув, синът на Пахат-Моав, „поправиха другата част и стълпа на пещите“; при освещаването на стената вторият хор тръгнал „отгоре на стълпа на пещите, и до широката стена“ и продължил наоколо по северната страна до Овчата порта. Името може да идва от хлебарски пещи или от пещи за изпичане наблизо; Йеремия споменава улица на хлебарите в града, но нищо не я свързва с тази кула."
    - "Според мястото ѝ в списъците, между Широката стена и Портата на долината, кулата стояла на западната страна на града и някои я поставят в северозападния ъгъл на стената. Тя не е намерена. В Еврейския квартал на Стария град Нахман Авигад разкрил около 1970 г. участък от масивна стена от VIII в., често отъждествявана с Широката стена, но дали Неемиевата стена все още е минавала толкова на запад, е спорно. Картата поставя кулата просто в Йерусалим."
