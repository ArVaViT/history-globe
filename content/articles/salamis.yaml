# Overview article (ADR 0007). Mainstream facts only; dates of the Cypriot kings and of Epiphanius are approximate; the martyrdom of Barnabas is given as later legend.
id: salamis
place: afa863b
title:
  en: "Salamis"
  ru: "Саламин"
  uk: "Саламін"
  es: "Salamina"
  pt: "Salamina"
  de: "Salamis"
  fr: "Salamine"
body:
  en:
    - "Salamis lay on the east coast of Cyprus at the mouth of the Pediaeus river, about 6 km north of modern Famagusta. Greek legend made Teucer, son of Telamon, its founder after the Trojan War; archaeology traces the town to the eleventh century BC, when it took over from the older harbour town at nearby Enkomi. Its cemetery holds the so-called royal tombs of the eighth and seventh centuries BC, with chariots, sacrificed horses and rich goods from Egypt and Syria. About 673 BC the Assyrian king Esarhaddon named Kisu, king of Salamis, among ten kings of Cyprus whom he summoned for his building work at Nineveh, in the same list as Manasseh, king of Judah."
    - "Under Persian rule Salamis was the leading Greek kingdom of the island; its king Evagoras I, praised by Isocrates, reigned from about 411 to 374 BC and waged a long war against Persia. In 306 BC Demetrius, son of Antigonus, besieged the city and destroyed the fleet of Ptolemy I off its shore. Under the later Ptolemies and under Rome the seat of government passed to Paphos, but Salamis remained the island's largest city, with a theatre, a gymnasium and a temple of Zeus."
    - "Barnabas, one of the leaders of the church at Antioch, was a Levite of Cyprus. Sent out with Saul, he sailed from Seleucia to the island, and at Salamis, the first stop of the journey, they preached the word of God in the synagogues of the Jews, with John Mark to help them. After parting from Paul, Barnabas took Mark and sailed again to Cyprus. A later legend, the Acts of Barnabas, tells that he was martyred at Salamis."
    - "In the Jewish revolt of 116–117 under Trajan the Jews of Cyprus rose under Artemion; Jerome's Chronicle says they overthrew Salamis after killing its gentile inhabitants, and Cassius Dio reports that afterwards no Jew might set foot on the island. In the fourth century earthquakes ruined the city, and Constantius II rebuilt it as Constantia, which became the capital of Cyprus. Its bishop Epiphanius, from about 367 to 403, wrote a great work against all heresies."
  ru:
    - "Саламин лежал на восточном берегу Кипра, в устье реки Педиеос, примерно в 6 км к северу от нынешней Фамагусты. Греческое предание называло его основателем Тевкра, сына Теламона, после Троянской войны; археология возводит город к XI веку до н. э., когда он сменил более древнюю гавань у соседней Энкоми. На его кладбище находятся так называемые царские гробницы VIII–VII веков до н. э., с колесницами, принесёнными в жертву конями и богатыми вещами из Египта и Сирии. Около 673 г. до н. э. ассирийский царь Асардан назвал Кису, царя Саламина, среди десяти царей Кипра, которых он призвал на свои стройки в Ниневии, в одном списке с Манассией, царём Иудейским."
    - "Под властью персов Саламин был главным греческим царством острова; его царь Евагор I, которого восхвалял Исократ, правил примерно с 411 по 374 г. до н. э. и вёл долгую войну с Персией. В 306 г. до н. э. Деметрий, сын Антигона, осадил город и уничтожил у его берегов флот Птолемея I. При поздних Птолемеях и при Риме управление островом перешло в Паф, но Саламин оставался крупнейшим городом Кипра, с театром, гимнасием и храмом Зевса."
    - "Варнава, один из руководителей церкви в Антиохии, был левитом родом с Кипра. Посланный вместе с Савлом, он отплыл из Селевкии на остров, и в Саламине, первой остановке пути, они проповедовали слово Божие в синагогах Иудейских, а Иоанн Марк помогал им. Разлучившись с Павлом, Варнава взял Марка и снова отплыл в Кипр. Позднейшее сказание, Деяния Варнавы, говорит, что он принял мученическую смерть в Саламине."
    - "Во время иудейского восстания 116–117 гг. при Траяне иудеи Кипра поднялись во главе с Артемионом; Хроника Иеронима сообщает, что они разрушили Саламин, перебив жителей-язычников, а Дион Кассий пишет, что после этого ни одному иудею не позволялось ступить на остров. В IV веке землетрясения разрушили город, и Констанций II отстроил его под именем Констанция; он стал столицей Кипра. Его епископ Епифаний, примерно с 367 по 403 г., написал большой труд против всех ересей."
  uk:
    - "Саламін лежав на східному узбережжі Кіпру, в гирлі річки Педіей, приблизно за 6 км на північ від сучасної Фамагусти. Грецька легенда робила його засновником Тевкра, сина Теламона, по Троянській війні; археологія простежує місто від XI ст. до н. е., коли воно змінило давніший портовий осередок неподалік, в Енкомі. У його некрополі є так звані царські гробниці VIII–VII ст. до н. е. з колісницями, принесеними в жертву кіньми й багатим добром з Єгипту та Сирії. Близько 673 р. до н. е. ассирійський цар Асархаддон назвав Кісу, царя Саламіна, серед десяти кіпрських царів, яких він покликав для своїх будівель у Ніневії, в тому самому переліку, що й Манасія, цар Юди."
    - "Під персами Саламін був провідним грецьким царством острова; його цар Евагор I, якого вихваляв Ісократ, правив приблизно з 411 до 374 р. до н. е. і вів довгу війну проти Персії. У 306 р. до н. е. Деметрій, син Антігона, облягав місто й знищив біля його берега флот Птолемея I. За пізніших Птолемеїв і за Рима осідок влади перейшов до Пафоса, але Саламін лишався найбільшим містом острова, із театром, гімнасієм і храмом Зевса."
    - "Варнава, один із керівників церкви в Антіохії, був левитом із Кіпру. Посланий разом із Савлом, він поплив із Селевкії на острів, і в Саламіні, першій зупинці подорожі, вони проповідували слово Боже в синагогах юдеїв, а Іван Марко їм допомагав. Розлучившись із Павлом, Варнава взяв Марка й знову поплив на Кіпр. Пізніша легенда, «Діяння Варнави», розповідає, що він прийняв мученицьку смерть у Саламіні."
    - "Під час юдейського повстання 116–117 рр. за Траяна євреї Кіпру повстали на чолі з Артеміоном; Хроніка Ієроніма каже, що вони зруйнували Саламін, перебивши його нееврейських жителів, а Касій Діон повідомляє, що по тому жоден єврей не смів ступити на острів. У IV ст. землетруси зруйнували місто, і Констанцій II відбудував його як Констанцію, що стала столицею Кіпру. Його єпископ Єпіфаній, приблизно з 367 до 403 р., написав велику працю проти всіх єресей."
  es:
    - "Salamina estaba en la costa oriental de Chipre, en la desembocadura del río Pediaios, a unos 6 km al norte de la actual Famagusta. La leyenda griega hizo de Teucro, hijo de Telamón, su fundador tras la guerra de Troya; la arqueología remonta la ciudad al siglo XI a. C., cuando tomó el relevo de la ciudad portuaria más antigua de la cercana Enkomi. Su cementerio contiene las llamadas tumbas reales de los siglos VIII y VII a. C., con carros, caballos sacrificados y ricos bienes de Egipto y Siria. Hacia 673 a. C. el rey asirio Esar-hadón nombró a Kisu, rey de Salamina, entre diez reyes de Chipre a los que convocó para sus obras en Nínive, en la misma lista que Manasés, rey de Judá."
    - "Bajo dominio persa Salamina fue el principal reino griego de la isla; su rey Evágoras I, elogiado por Isócrates, reinó de hacia 411 a 374 a. C. y sostuvo una larga guerra contra Persia. En 306 a. C. Demetrio, hijo de Antígono, sitió la ciudad y destruyó la flota de Tolomeo I frente a su costa. Bajo los últimos Tolomeos y bajo Roma la sede del gobierno pasó a Pafos, pero Salamina siguió siendo la mayor ciudad de la isla, con un teatro, un gimnasio y un templo de Zeus."
    - "Bernabé, uno de los dirigentes de la iglesia de Antioquía, era un levita de Chipre. Enviado con Saulo, zarpó de Seleucia hacia la isla, y en Salamina, la primera escala del viaje, predicaron la palabra de Dios en las sinagogas de los judíos, con Juan Marcos como ayudante. Tras separarse de Pablo, Bernabé tomó a Marcos y navegó de nuevo a Chipre. Una leyenda posterior, los Hechos de Bernabé, cuenta que fue martirizado en Salamina."
    - "En la revuelta judía de 116–117 bajo Trajano los judíos de Chipre se alzaron bajo Artemión; la Crónica de Jerónimo dice que arrasaron Salamina tras matar a sus habitantes gentiles, y Dión Casio informa de que después ningún judío podía poner el pie en la isla. En el siglo IV los terremotos arruinaron la ciudad, y Constancio II la reconstruyó como Constancia, que se convirtió en la capital de Chipre. Su obispo Epifanio, de hacia 367 a 403, escribió una gran obra contra todas las herejías."
  pt:
    - "Salamina ficava na costa leste de Chipre, na foz do rio Pediaios, a cerca de 6 km ao norte da atual Famagusta. A lenda grega fez de Teucro, filho de Télamon, seu fundador depois da Guerra de Troia; a arqueologia traça a cidade até o século XI a.C., quando assumiu o lugar da cidade portuária mais antiga da vizinha Enkomi. Seu cemitério guarda os chamados túmulos reais dos séculos VIII e VII a.C., com carros, cavalos sacrificados e ricos bens do Egito e da Síria. Por volta de 673 a.C., o rei assírio Esar-Hadom nomeou Kisu, rei de Salamina, entre dez reis de Chipre que convocou para suas obras em Nínive, na mesma lista de Manassés, rei de Judá."
    - "Sob o domínio persa, Salamina foi o principal reino grego da ilha; seu rei Evágoras I, louvado por Isócrates, reinou de cerca de 411 a 374 a.C. e travou longa guerra contra a Pérsia. Em 306 a.C., Demétrio, filho de Antígono, sitiou a cidade e destruiu a frota de Ptolomeu I diante de sua costa. Sob os últimos Ptolomeus e sob Roma a sede do governo passou a Pafos, mas Salamina continuou a maior cidade da ilha, com teatro, ginásio e um templo de Zeus."
    - "Barnabé, um dos líderes da igreja de Antioquia, era um levita de Chipre. Enviado com Saulo, navegou de Selêucia para a ilha, e em Salamina, a primeira parada da viagem, pregaram a palavra de Deus nas sinagogas dos judeus, com João Marcos para ajudá-los. Depois de separar-se de Paulo, Barnabé levou Marcos e navegou de novo para Chipre. Uma lenda posterior, os Atos de Barnabé, conta que ele foi martirizado em Salamina."
    - "Na revolta judaica de 116–117 sob Trajano, os judeus de Chipre se ergueram sob Artemion; a Crônica de Jerônimo diz que derrubaram Salamina depois de matar seus habitantes gentios, e Cássio Dio relata que depois disso nenhum judeu podia pôr o pé na ilha. No século IV terremotos arruinaram a cidade, e Constâncio II a reconstruiu como Constância, que se tornou a capital de Chipre. Seu bispo Epifânio, de cerca de 367 a 403, escreveu uma grande obra contra todas as heresias."
  de:
    - "Salamis lag an der Ostküste Zyperns an der Mündung des Flusses Pedieos, etwa 6 km nördlich des heutigen Famagusta. Die griechische Sage machte Teukros, Sohn des Telamon, nach dem Trojanischen Krieg zu seinem Gründer; die Archäologie verfolgt die Stadt bis ins 11. Jahrhundert v. Chr. zurück, als sie vom älteren Hafenort im nahen Enkomi übernahm. Ihr Friedhof enthält die sogenannten Königsgräber des 8. und 7. Jahrhunderts v. Chr. mit Wagen, geopferten Pferden und reichen Beigaben aus Ägypten und Syrien. Um 673 v. Chr. nannte der assyrische König Asarhaddon Kisu, den König von Salamis, unter zehn Königen Zyperns, die er für seine Bauarbeiten in Ninive aufbot, in derselben Liste wie Manasse, den König von Juda."
    - "Unter persischer Herrschaft war Salamis das führende griechische Königreich der Insel; sein König Euagoras I., von Isokrates gerühmt, regierte von etwa 411 bis 374 v. Chr. und führte einen langen Krieg gegen Persien. Im Jahr 306 v. Chr. belagerte Demetrios, Sohn des Antigonos, die Stadt und vernichtete vor ihrer Küste die Flotte Ptolemaios' I. Unter den späteren Ptolemäern und unter Rom ging der Regierungssitz nach Paphos, doch Salamis blieb die größte Stadt der Insel, mit Theater, Gymnasium und einem Tempel des Zeus."
    - "Barnabas, einer der Leiter der Gemeinde in Antiochia, war ein Levit aus Zypern. Mit Saulus ausgesandt, fuhr er von Seleukia zur Insel, und in Salamis, der ersten Station der Reise, „verkündigten sie das Wort Gottes in der Juden Schulen; sie hatten aber auch Johannes zum Diener“, Johannes Markus. Nach der Trennung von Paulus nahm Barnabas Markus zu sich und schiffte erneut nach Zypern. Eine spätere Legende, die Barnabasakten, erzählt, er sei in Salamis als Märtyrer gestorben."
    - "Im jüdischen Aufstand von 116–117 unter Trajan erhoben sich die Juden Zyperns unter Artemion; die Chronik des Hieronymus sagt, sie hätten Salamis zerstört, nachdem sie seine nichtjüdischen Einwohner getötet hatten, und Cassius Dio berichtet, danach habe kein Jude die Insel betreten dürfen. Im 4. Jahrhundert ruinierten Erdbeben die Stadt, und Constantius II. baute sie als Constantia wieder auf, die Hauptstadt Zyperns wurde. Ihr Bischof Epiphanius schrieb von etwa 367 bis 403 ein großes Werk gegen alle Häresien."
  fr:
    - "Salamine se trouvait sur la côte orientale de Chypre, à l’embouchure du Pédiaios, à environ 6 km au nord de l’actuelle Famagouste. La légende grecque faisait de Teucros, fils de Télamon, son fondateur après la guerre de Troie ; l’archéologie fait remonter la ville au XIe siècle av. J.-C., quand elle prit le relais de l’ancien port d’Enkomi, tout proche. Sa nécropole renferme les prétendues tombes royales des VIIIe et VIIe siècles av. J.-C., avec chars, chevaux sacrifiés et riches objets d’Égypte et de Syrie. Vers 673 av. J.-C., le roi assyrien Esar-Haddon nomma Kisou, roi de Salamine, parmi dix rois de Chypre qu’il convoqua pour ses travaux à Ninive, dans la même liste que Manassé, roi de Juda."
    - "Sous la domination perse, Salamine fut le principal royaume grec de l’île ; son roi Évagoras Ier, loué par Isocrate, régna d’environ 411 à 374 av. J.-C. et mena une longue guerre contre la Perse. En 306 av. J.-C., Démétrius, fils d’Antigone, assiégea la ville et détruisit au large la flotte de Ptolémée Ier. Sous les derniers Ptolémées et sous Rome, le siège du gouvernement passa à Paphos, mais Salamine resta la plus grande ville de l’île, avec un théâtre, un gymnase et un temple de Zeus."
    - "Barnabas, l’un des responsables de l’Église d’Antioche, était un Lévite de Chypre. Envoyé avec Saul, il fit voile de Séleucie vers l’île, et à Salamine, première étape du voyage, ils annoncèrent la parole de Dieu dans les synagogues des Juifs, avec Jean Marc pour aide. Après s’être séparé de Paul, Barnabas prit Marc et s’embarqua de nouveau pour Chypre. Une légende postérieure, les Actes de Barnabas, raconte qu’il fut martyrisé à Salamine."
    - "Dans la révolte juive de 116–117 sous Trajan, les Juifs de Chypre se soulevèrent sous Artémion ; la Chronique de Jérôme dit qu’ils renversèrent Salamine après avoir tué ses habitants païens, et Dion Cassius rapporte qu’ensuite aucun Juif ne put mettre le pied dans l’île. Au IVe siècle, des séismes ruinèrent la ville, et Constance II la rebâtit sous le nom de Constantia, qui devint la capitale de Chypre. Son évêque Épiphane, d’environ 367 à 403, écrivit une grande œuvre contre toutes les hérésies."
