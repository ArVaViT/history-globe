# Overview article (ADR 0007). Mainstream facts only; the dating of the Negeb highland fortresses is named as debated; present-day figures are approximate.
id: negeb
place: a1cb244
title:
  en: "Negeb"
  ru: "Негев"
body:
  en:
    - 'The Negeb is the dry south of the land, the triangle of desert between the hills of Judah and the Sinai peninsula, from the Beersheba basin down to the Gulf of Aqaba, bounded by the Mediterranean coast on the west and the Arabah on the east. The Hebrew negev means dry land, and since the desert lay south of Judah the word came to mean "south" itself; the King James Version renders it "the south", and the Synodal Bible likewise speaks of the south and "the south country". Rain falls only in the north, about 200 mm a year at Beersheba and far less farther south, where the land breaks into the limestone highlands and the great craters of Ramon and Hatira.'
    - 'Abraham "journeyed, going on still toward the south", dwelt between Kadesh and Shur, dug wells and planted a grove at Beersheba, and Isaac "dwelt in the south country". From Kadesh-barnea the spies "ascended by the south" to Hebron and reported that "The Amalekites dwell in the land of the south"; the king of Arad, "which dwelt in the south", fought Israel on its way. Joshua''s southern cities of Judah "toward the coast of Edom southward" lay here, with Beersheba as the limit of the settled land. David from Ziklag raided "the south of Judah", of the Jerahmeelites and of the Kenites, and the Amalekites burned Ziklag in return. Archaeology shows the Beersheba valley settled in the Iron Age, with the fortress and sanctuary of Arad; the many small forts of the highlands are dated by some to Solomon''s century and by others later.'
    - 'The prophets look to the Negeb as part of the land to be restored: "The cities of the south shall be shut up", Jeremiah warns, yet men "shall buy fields" again in the cities of the south, and Obadiah promises that "they of the south shall possess the mount of Esau". The psalm prays for a return "as the streams in the south", the flash floods of the desert wadis. After the exile Edomites settled the northern Negeb, which became Idumea, and from the fourth century BC the Nabataeans ran the incense road across it from Petra to Gaza, building Avdat, Mamshit, Shivta and Haluza, which flourished as Byzantine towns and were inscribed by UNESCO in 2005.'
    - "Today the Negev makes up more than half of Israel's land but holds only a small share of its people. Beersheba, its capital, has grown to more than 200,000, the Bedouin Arabs number well over two hundred thousand, and Eilat stands at the southern tip; Ben-Gurion, who urged the settling of the desert, is buried at Sde Boker above the wilderness of Zin."
  ru:
    - "Негев — сухой юг страны, треугольник пустыни между горами Иудеи и Синайским полуостровом, от котловины Вирсавии до залива Акаба, ограниченный с запада Средиземноморским побережьем, а с востока Аравой. Еврейское «негев» значит сухая земля, а поскольку пустыня лежала к югу от Иудеи, слово стало означать и сам «юг»; Синодальный перевод так и передаёт его: «к югу», «в земле полуденной», «полуденную страну». Дожди выпадают лишь на севере, около 200 мм в год у Вирсавии, и много меньше южнее, где земля переходит в известняковые нагорья и большие кратеры Рамон и Хатира."
    - "Авраам «продолжал идти к югу», поселился между Кадесом и Суром, копал колодцы и насадил рощу при Вирсавии, а об Исааке сказано: «жил он в земле полуденной». Из Кадеса соглядатаи «пошли в южную страну, и дошли до Хеврона» и донесли: «Амалик живет на южной части земли»; «Ханаанский царь Арада, живущий к югу», воевал с Израилем на пути. Здесь лежали южные города Иуды «в смежности с Идумеею на юге» из списка Иисуса Навина, а Вирсавия была пределом обитаемой земли. Давид из Секелага нападал «на полуденную страну Иудеи», Иерахмеела и Кенеи, а Амаликитяне в отместку сожгли Секелаг. Археология показывает долину Вирсавии заселённой в железном веке, с крепостью и святилищем Арада; многочисленные малые крепости нагорья одни относят к веку Соломона, другие — к более позднему времени."
    - "Пророки видят Негев частью земли, которая будет восстановлена: «Южные города заперты», предупреждает Иеремия, но в городах южных снова «будут покупать поля за серебро», а Авдий обещает: «завладеют те, которые к югу, горою Исава». Псалом молится о возвращении, «как потоки на полдень», — внезапные паводки пустынных вади. После плена северный Негев заселили Идумеи, и он стал Идумеей, а с IV века до н. э. Набатеи вели через него путь благовоний из Петры в Газу, построив Авдат, Мамшит, Шивту и Халуцу, которые расцвели как византийские города и в 2005 году внесены в список ЮНЕСКО."
    - "Сегодня Негев составляет больше половины территории Израиля, но в нём живёт лишь малая часть населения. Вирсавия, его столица, выросла до более чем 200 000 жителей, арабов-бедуинов — намного больше двухсот тысяч, а на южной оконечности стоит Эйлат; Бен-Гурион, призывавший заселять пустыню, похоронен в Сде-Бокере над пустыней Син."
