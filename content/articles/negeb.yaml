# Overview article (ADR 0007). Mainstream facts only; the dating of the Negeb highland fortresses is named as debated; present-day figures are approximate.
id: negeb
place: a1cb244
title:
  en: "Negeb"
  ru: "Негев"
  uk: "Негев"
  es: "Néguev"
  pt: "Neguebe"
  de: "Negev"
  fr: "Négev"
  it: "Negheb"
  pl: "Negew"
