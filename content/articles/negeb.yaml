body:
  en:
    - 'The Negeb is the dry south of the land, the triangle of desert between the hills of Judah and the Sinai peninsula, from the Beersheba basin down to the Gulf of Aqaba, bounded by the Sinai desert on the west and the Arabah on the east. The Hebrew negev means dry land, and since the desert lay south of Judah the word came to mean "south" itself; the King James Version renders it "the south", and the Synodal Bible likewise speaks of the south and "the south country". Rain falls only in the north, about 200 mm a year at Beersheba and far less farther south, where the land breaks into the limestone highlands and the great craters of Ramon and Hatira.'
    - 'Abraham "journeyed, going on still toward the south", dwelt between Kadesh and Shur, dug wells and planted a grove at Beersheba, and Isaac "dwelt in the south country". From Kadesh-barnea the spies "ascended by the south" to Hebron and reported: "The Amalekites dwell in the land of the south"; the king of Arad, "which dwelt in the south", fought Israel on its way. Joshua''s southern cities of Judah "toward the coast of Edom southward" lay here, with Beersheba as the limit of settlement. David from Ziklag raided the Amalekites and their neighbours, while telling Achish he had raided "the south of Judah", of the Jerahmeelites and of the Kenites; the Amalekites burned Ziklag in return. The Beersheba valley was settled in the Iron Age, with Arad''s fortress and sanctuary; the highlands'' many small forts are dated by some to Solomon''s century, though their date and purpose are debated.'
    - 'The prophets look to the Negeb as part of the land to be restored: "The cities of the south shall be shut up", Jeremiah warns, yet men "shall buy fields" again in the cities of the south, and Obadiah promises that "they of the south shall possess the mount of Esau". The psalm prays for a return "as the streams in the south", the flash floods of the desert wadis. After the exile Edomites settled the northern Negeb, which became Idumea, and from the third century BC the Nabataeans ran the incense road across it from Petra to Gaza, building Avdat, Mamshit, Shivta and Haluza, which flourished as Byzantine towns and were inscribed by UNESCO in 2005.'
    - "Today the Negev makes up more than half of Israel's land but holds only a small share of its people. Beersheba, its capital, has grown to more than 200,000, the Bedouin Arabs number well over two hundred thousand, and Eilat stands at the southern tip; Ben-Gurion, who urged the settling of the desert, is buried at Sde Boker above the wilderness of Zin."
  ru:
    - "Негев — сухой юг страны, треугольник пустыни между горами Иудеи и Синайским полуостровом, от котловины Вирсавии до залива Акаба, ограниченный с запада Синайской пустыней, а с востока Аравой. Еврейское «негев» значит сухая земля, а поскольку пустыня лежала к югу от Иудеи, слово стало означать и сам «юг»; Синодальный перевод так и передаёт его: «к югу», «в земле полуденной», «полуденную страну». Дожди выпадают лишь на севере, около 200 мм в год у Вирсавии, и много меньше южнее, где земля переходит в известняковые нагорья и большие кратеры Рамон и Хатира."
    - "Авраам «продолжал идти к югу», поселился между Кадесом и Суром, копал колодцы и насадил рощу при Вирсавии, а об Исааке сказано: «жил он в земле полуденной». Из Кадеса соглядатаи «пошли в южную страну, и дошли до Хеврона» и донесли: «Амалик живет на южной части земли»; «Ханаанский царь Арада, живущий к югу», воевал с Израилем на пути. Здесь лежали южные города Иуды «в смежности с Идумеею на юге» из списка Иисуса Навина, а Вирсавия была пределом обитаемой земли. Давид из Секелага нападал на Амаликитян и их соседей, а Анхусу говорил, что нападал «на полуденную страну Иудеи», Иерахмеела и Кенеи; Амаликитяне в отместку сожгли Секелаг. Археология показывает долину Вирсавии заселённой в железном веке, с крепостью и святилищем Арада; многочисленные малые крепости нагорья одни относят к веку Соломона, хотя их дата и назначение спорны."
    - "Пророки видят Негев частью земли, которая будет восстановлена: «Южные города заперты», предупреждает Иеремия, но в городах южных снова «будут покупать поля за серебро», а Авдий обещает: «завладеют те, которые к югу, горою Исава». Псалом молится о возвращении, «как потоки на полдень», — внезапные паводки пустынных вади. После плена северный Негев заселили Идумеи, и он стал Идумеей, а с III века до н. э. Набатеи вели через него путь благовоний из Петры в Газу, построив Авдат, Мамшит, Шивту и Халуцу, которые расцвели как византийские города и в 2005 году внесены в список ЮНЕСКО."
    - "Сегодня Негев составляет больше половины территории Израиля, но в нём живёт лишь малая часть населения. Вирсавия, его столица, выросла до более чем 200 000 жителей, арабов-бедуинов — намного больше двухсот тысяч, а на южной оконечности стоит Эйлат; Бен-Гурион, призывавший заселять пустыню, похоронен в Сде-Бокере над пустыней Син."
  uk:
    - "Негев — це суха південна частина краю, трикутник пустелі між юдейськими горами та Синайським півостровом, від басейну Беер-Шеви до Акабської затоки, обмежений із заходу Синайською пустелею, а зі сходу Аравою. Єврейське слово негев означає суху землю, і оскільки пустеля лежала на південь від Юдеї, слово почало означати саме «південь»; Біблія короля Якова передає його як «південь», і Синодальний переклад так само говорить про південь і «південну країну». Дощі випадають лише на півночі, приблизно 200 мм на рік у Беер-Шеві й значно менше далі на південь, де земля переходить у вапнякове нагір'я та великі кратери Рамон і Хатіра."
    - "Авраам «подававсь... усе далїй та далїй, простуючи на полуднє», жив між Кадешем і Суром, копав колодязі й насадив гай у Беер-Шеві, а Ісаак, як сказано, «жив бо він у землї полуденнїй». З Кадеш-Барнеа розвідники піднялися південним краєм до Хеврона й доповіли: «Амалек живе в землї полуденнїй»; цар Араду, «котрого осада була на полуднї», воював з Ізраїлем у дорозі. Південні міста Юди «проти гряницї Ідумейської в полуденнїй країнї» лежали тут, а Беер-Шева була межею заселеної землі. Давид з Ціклагу нападав на амаликитян та їхніх сусідів, а Анхузові казав, що нападав на «полуденню сторону в Юдеї, або на полуденню сторону Ерахмеелї, чи на полуденню сторону Кенеї»; амаликитяни в відповідь спалили Ціклаг. Долина Беер-Шеви була заселена в залізну добу, з фортецею й святилищем Араду; численні малі фортеці нагір'я одні датують століттям Соломона, хоча їхня дата й призначення дискусійні."
    - "Пророки дивляться на Негев як на частину краю, що буде відновлений: «Міста полуденньої країни позачинюються», — застерігає Єремія, і все ж люди знову «куповати муть поля» по «городах полуденних», а Овадія обіцяє: «Полудняне одержять гору Езавову». Псалом просить про повернення «як потоки на спражену землю» — раптові повені пустельних уаді. Після вигнання едомити оселилися в північному Негеві, який став Ідумеєю, а з III століття до н. е. набатеї вели через нього Шлях пахощів від Петри до Гази, збудувавши Авдат, Мамшит, Шивту й Халуцу, які розквітли як візантійські міста й 2005 року були внесені до списку ЮНЕСКО."
    - "Сьогодні Негев становить понад половину території Ізраїлю, але мешкає в ньому лише невелика частка населення. Беер-Шева, його столиця, зросла до понад 200 000 мешканців, бедуїнів-арабів налічується значно понад двісті тисяч, а Ейлат стоїть на південному вістрі; Бен-Ґуріон, який закликав заселити пустелю, похований у Сде-Бокері над пустелею Сін."
  es:
    - "El Néguev es el sur árido del país, el triángulo de desierto entre las colinas de Judá y la península del Sinaí, desde la cuenca de Beerseba hasta el golfo de Aqaba, limitado por el desierto del Sinaí al oeste y por el Arabá al este. El hebreo negev significa tierra seca, y como el desierto quedaba al sur de Judá, la palabra pasó a significar el «sur» mismo; la King James Version lo traduce «el sur», y la Biblia sinodal habla igualmente del sur y de la «tierra del sur». La lluvia cae solo en el norte, unos 200 mm al año en Beerseba y mucho menos más al sur, donde la tierra se quiebra en las tierras altas calizas y los grandes cráteres de Ramón y Hatira."
    - "Abraham iba «caminando y yendo hacia el Mediodía», habitó entre Cades y Shur, cavó pozos y plantó un bosque en Beerseba, e Isaac «habitaba en la tierra del Mediodía». Desde Cades-barnea los espías «subieron por el mediodía» hasta Hebrón e informaron: «Amalec habita la tierra del mediodía»; el rey de Arad, «el cual habitaba al mediodía», combatió a Israel en su camino. Aquí estaban las ciudades de Judá de Josué «hacia el término de Edom al mediodía», con Beerseba como límite de lo habitado. David, desde Siclag, atacó a amalecitas y vecinos, pero decía a Aquis que había corrido «al mediodía de Judá», al de los jerameelitas y al de los quenitas; los amalecitas quemaron Siclag en represalia. El valle de Beerseba se pobló en la Edad del Hierro, con la fortaleza y santuario de Arad; unos datan muchos fortines de las tierras altas en el siglo de Salomón, aunque su fecha y función se discuten."
    - "Los profetas ven el Néguev como parte de la tierra que será restaurada: «Las ciudades del mediodía fueron cerradas», advierte Jeremías, y sin embargo de nuevo «heredades comprarán» en las ciudades del mediodía, y Abdías promete que «los del mediodía poseerán el monte de Esaú». El salmo ruega un retorno «como los arroyos en el austro», las crecidas repentinas de los uadis del desierto. Después del exilio, los edomitas se establecieron en el norte del Néguev, que se convirtió en Idumea, y desde el siglo III a. C. los nabateos regentaron a través de él la ruta del incienso de Petra a Gaza, construyendo Avdat, Mamshit, Shivta y Haluza, que florecieron como ciudades bizantinas y fueron inscritas por la UNESCO en 2005."
    - "Hoy el Néguev constituye más de la mitad del territorio de Israel, pero alberga solo una pequeña parte de su población. Beerseba, su capital, ha crecido hasta más de 200 000 habitantes, los árabes beduinos son bastante más de doscientos mil, y Eilat se alza en el extremo sur; Ben Gurión, que instó a poblar el desierto, está enterrado en Sde Boker, sobre el desierto de Zin."
  pt:
    - "O Neguebe é o sul árido da terra, o triângulo de deserto entre as colinas de Judá e a península do Sinai, da bacia de Berseba até o golfo de Aqaba, limitado pelo deserto do Sinai a oeste e pela Arabá a leste. O hebraico negev significa terra seca e, como o deserto ficava ao sul de Judá, a palavra passou a significar o próprio “sul”; a Bíblia King James a traduz por “o sul”, e a Bíblia Sinodal fala igualmente do sul e da “terra do sul”. A chuva cai só no norte, cerca de 200 mm por ano em Berseba e muito menos mais ao sul, onde a terra se quebra nas terras altas calcárias e nas grandes crateras de Ramon e Hatira."
    - "Abraão “viajou, seguindo sempre em direção ao Sul”, habitou entre Cades e Sur, cavou poços e plantou um bosque em Berseba, e Isaque “morava na terra do Sul”. De Cades-Barneia os espias “subiram pelo Sul” até Hebrom e relataram: “Amaleque habita na terra do Sul”; o rei de Arade, “que habitava no Sul”, combateu Israel em seu caminho. As cidades meridionais de Judá, “em direção à fronteira de Edom, no Sul”, ficavam aqui, com Berseba como limite da terra habitada. Davi, de Ziclague, atacou os amalequitas e seus vizinhos, mas dizia a Aquis que fizera incursões “contra o sul de Judá, contra o sul dos jerameelitas e contra o sul dos queneus”; os amalequitas incendiaram Ziclague em represália. O vale de Berseba era povoado na Idade do Ferro, com a fortaleza e o santuário de Arade; uns datam do século de Salomão os muitos fortes pequenos das terras altas, embora data e função sejam debatidas."
    - "Os profetas veem o Neguebe como parte da terra a ser restaurada: “As cidades do Sul estão fechadas”, adverte Jeremias, mas ainda assim os homens “comprarão campos” nas cidades do Sul, e Obadias promete que “os do Sul possuirão o monte de Esaú”. O salmo pede um retorno “como as torrentes no Neguebe”, as cheias repentinas dos uádis do deserto. Depois do exílio, os edomitas se fixaram no norte do Neguebe, que se tornou a Iduméia, e a partir do século III a.C. os nabateus fizeram passar por ele a rota do incenso, de Petra a Gaza, construindo Avdat, Mamshit, Shivta e Haluza, que floresceram como cidades bizantinas e foram inscritas pela UNESCO em 2005."
    - "Hoje o Neguebe forma mais da metade do território de Israel, mas abriga só uma pequena parcela de sua população. Berseba, sua capital, cresceu para mais de 200 mil habitantes, os árabes beduínos somam bem mais de duzentos mil, e Eilat fica na ponta sul; Ben-Gurion, que defendeu o povoamento do deserto, está sepultado em Sde Boker, acima do deserto de Zim."
  de:
    - "Der Negev ist der trockene Süden des Landes, das Wüstendreieck zwischen dem Bergland Judas und der Sinai-Halbinsel, vom Becken von Beerscheba bis hinab zum Golf von Akaba, im Westen von der Wüste Sinai und im Osten von der Araba begrenzt. Das hebräische negev bedeutet trockenes Land, und da die Wüste südlich von Juda lag, wurde das Wort zur Bezeichnung für „Süden“ selbst; die King-James-Bibel gibt es mit „the south“ wieder, und die Lutherbibel spricht ebenso vom Süden: „Mittagsland“ und „gegen Mittag“. Regen fällt nur im Norden, etwa 200 mm im Jahr bei Beerscheba und weit weniger weiter südlich, wo das Land in kalkige Hochländer und die großen Krater Ramon und Hatira zerfällt."
    - "Abraham zog „weiter und zog aus ins Mittagsland“, wohnte zwischen Kadesch und Schur, grub Brunnen und pflanzte einen Hain bei Beerscheba, und Isaak „wohnte im Lande gegen Mittag“. Von Kadesch-Barnea zogen die Kundschafter „hinauf ins Mittagsland“ nach Hebron und meldeten: „So wohnen die Amalekiter im Lande gegen Mittag“; der König von Arad, „der gegen Mittag wohnte“, bekämpfte Israel unterwegs. Josuas Südstädte Judas „an der Grenze der Edomiter gegen Mittag“ lagen hier, mit Beerscheba als Siedlungsgrenze. David überfiel aus Ziklag Amalekiter und Nachbarn, sagte aber Achis, er sei „in das Mittagsland Juda's“ eingefallen, der Jerachmeeliter und der Keniter; die Amalekiter verbrannten dafür Ziklag. Das Becken von Beerscheba war eisenzeitlich besiedelt, mit Arads Festung und Heiligtum; die kleinen Hochlandfestungen datieren manche in Salomos Jahrhundert, doch Alter und Zweck sind strittig."
    - "Die Propheten sehen im Negev einen Teil des Landes, das wiederhergestellt werden soll: „Die Städte gegen Mittag sind verschlossen“, warnt Jeremia, doch man wird wieder „Äcker um Geld kaufen“ in „Städten gegen Mittag“, und Obadja verheißt: „die gegen Mittag werden das Gebirge Esau … besitzen“. Der Psalm bittet um Heimkehr „wie du die Bäche wiederbringst im Mittagslande“, den Sturzfluten der Wüstentäler. Nach dem Exil siedelten Edomiter im nördlichen Negev, der zu Idumäa wurde, und ab dem 3. Jahrhundert v. Chr. betrieben die Nabatäer die Weihrauchstraße von Petra nach Gaza quer durch ihn und bauten Avdat, Mamschit, Schivta und Chaluza, die als byzantinische Städte blühten und 2005 von der UNESCO eingetragen wurden."
    - "Heute macht der Negev über die Hälfte der Landesfläche Israels aus, hat aber nur einen kleinen Anteil seiner Bevölkerung. Beerscheba, seine Hauptstadt, ist auf mehr als 200.000 Einwohner gewachsen, die beduinischen Araber zählen weit über zweihunderttausend, und Eilat liegt an der Südspitze; Ben-Gurion, der die Besiedlung der Wüste forderte, ist in Sde Boker oberhalb der Wüste Zin begraben."
  fr:
    - "Le Négev est le sud aride du pays, le triangle de désert entre les collines de Juda et la péninsule du Sinaï, du bassin de Beer-Schéba jusqu’au golfe d’Aqaba, borné à l’ouest par le désert du Sinaï et à l’est par l’Araba. L’hébreu negev signifie terre sèche, et comme le désert s’étendait au sud de Juda, le mot en vint à signifier « le sud » lui-même ; la King James le rend par « the south », et la Bible synodale russe parle de même du sud et de « la contrée du sud » ; Louis Segond dit « le midi » et « la contrée du midi ». La pluie ne tombe qu’au nord, environ 200 mm par an à Beer-Schéba et bien moins plus au sud, où le pays se brise en hautes terres calcaires et en grands cratères, ceux de Ramon et de Hatira."
    - "Abraham continua « ses marches, en s’avançant vers le midi », s’établit entre Kadès et Schur, creusa des puits et planta des tamaris à Beer-Schéba, et Isaac « habitait dans le pays du midi ». De Kadès-Barnéa, les explorateurs « montèrent, par le midi » jusqu’à Hébron et dirent : « Les Amalécites habitent la contrée du midi » ; le roi d’Arad, « qui habitait le midi », combattit Israël en chemin. Les villes de Juda « vers la frontière d’Édom » s’y trouvaient, Beer-Schéba marquant la limite du pays habité. De Tsiklag, David pillait les Amalécites et leurs voisins, mais disait à Akisch avoir pillé « le midi de Juda », des Jerachmeélites et des Kéniens ; les Amalécites brûlèrent Tsiklag en retour. La vallée de Beer-Schéba était peuplée à l’âge du Fer, avec forteresse et sanctuaire à Arad ; certains datent du siècle de Salomon les petits forts du haut pays, mais date et rôle sont débattus."
    - "Les prophètes voient dans le Négev une part du pays à restaurer : « Les villes du midi sont fermées », avertit Jérémie, et pourtant on « achètera des champs » de nouveau dans les villes du midi, et Abdias promet que « ceux du midi posséderont la montagne d’Ésaü ». Le psaume demande un retour « comme des ruisseaux dans le midi », les crues soudaines des oueds du désert. Après l’exil, des Édomites s’installèrent dans le nord du Négev, qui devint l’Idumée, et dès le IIIe siècle av. J.-C. les Nabatéens y firent passer la route de l’encens de Pétra à Gaza, bâtissant Avdat, Mamshit, Shivta et Haluza, qui prospérèrent comme villes byzantines et furent inscrites par l’UNESCO en 2005."
    - "Aujourd’hui, le Négev représente plus de la moitié du territoire d’Israël, mais n’abrite qu’une faible part de sa population. Beer-Schéba, sa capitale, compte plus de 200 000 habitants, les Arabes bédouins bien plus de deux cent mille, et Eilat se dresse à la pointe sud ; Ben-Gourion, qui pressait de peupler le désert, est enterré à Sde Boker, au-dessus du désert de Tsin."
  it:
    - "Il Negheb è il sud arido del paese, il triangolo di deserto tra le colline di Giuda e la penisola del Sinai, dal bacino di Bersabea giù fino al Golfo di Aqaba, delimitato a ovest dal deserto del Sinai e a est dall’Araba. L’ebraico negev significa terra arida, e poiché il deserto si trovava a sud di Giuda la parola venne a significare il «sud» stesso; la King James Version la rende «the south», e anche la Bibbia sinodale russa parla di sud e di «paese del sud». La pioggia cade solo a nord, circa 200 mm l’anno a Bersabea e molto meno più a sud, dove la terra si spezza negli altipiani calcarei e nei grandi crateri di Ramon e di Chatira."
    - "Abramo proseguì «da un accampamento all’altro, verso mezzogiorno», dimorò tra Kades e Sur, scavò pozzi e piantò un boschetto a Bersabea; Isacco «abitava nel paese del mezzodì». Da Kades-Barnea le spie «salirono per il mezzogiorno» fino a Ebron e riferirono: «Gli Amalekiti abitano la parte meridionale del paese»; il re di Arad, «che abitava il mezzogiorno», combatté Israele in cammino. Le città di Giuda in Giosuè, «verso il confine di Edom, dal lato di mezzogiorno», erano qui, con Bersabea limite dell’abitato. Davide da Siclag razziava Amalekiti e vicini, ma diceva ad Akis di aver fatto scorrerie «verso il mezzogiorno di Giuda, … degli Jerahmeeliti e … dei Kenei»; gli Amalekiti incendiarono Siclag. La valle di Bersabea era abitata nell’età del Ferro, con la fortezza e il santuario di Arad; alcuni datano al secolo di Salomone molti fortini degli altipiani, ma data e funzione sono discusse."
    - "I profeti guardano al Negheb come a parte del paese da restaurare: «Le città del mezzogiorno sono chiuse», avverte Geremia, eppure di nuovo «si compreranno de’ campi» nelle città del mezzogiorno, e Abdia promette che «quelli del mezzogiorno possederanno il monte d’Esaù». Il salmo prega per un ritorno «come tornano i rivi nella terra del Mezzodì», le piene improvvise degli uadi del deserto. Dopo l’esilio gli Edomiti si stabilirono nel Negheb settentrionale, che divenne l’Idumea, e dal III secolo a.C. i Nabatei gestirono attraverso di esso la via dell’incenso da Petra a Gaza, costruendo Avdat, Mamshit, Shivta e Haluza, che fiorirono come città bizantine e nel 2005 furono iscritte dall’UNESCO nel patrimonio mondiale."
    - "Oggi il Negev costituisce più della metà del territorio di Israele ma ospita solo una piccola parte della sua popolazione. Bersabea, il suo capoluogo, è cresciuta fino a più di 200.000 abitanti, gli arabi beduini sono ben più di duecentomila, ed Eilat sorge all’estremità meridionale; Ben-Gurion, che sollecitò l’insediamento nel deserto, è sepolto a Sde Boker, sopra il deserto di Zin."
  pl:
    - "Negew to suche południe kraju, trójkąt pustyni między wzgórzami Judy a półwyspem Synaj, od kotliny Beer-Szeby po Zatokę Akaba, ograniczony od zachodu pustynią Synaj, a od wschodu Arabą. Hebrajskie negew znaczy ziemię suchą, a ponieważ pustynia leżała na południe od Judy, słowo to zaczęło oznaczać samo „południe”; Biblia Króla Jakuba oddaje je jako „the south”, a Biblia synodalna mówi podobnie o południu i o „kraju południowym”. Deszcz pada tylko na północy, około 200 mm rocznie w Beer-Szebie, a znacznie mniej dalej na południe, gdzie ziemia przechodzi w wapienne wyżyny i wielkie kratery Ramon i Chatira."
    - "Abraham „ruszył się… idąc, i ciągnąc ku południu”, mieszkał między Kadesz a Szur, kopał studnie i zasadził gaj w Beer-Szebie, a Izaak „mieszkał w ziemi południowej”. Z Kadesz-Barnea zwiadowcy szli „ku południowi” do Hebronu i donieśli: „Amalek mieszka w ziemi na południe”; król Aradu, „który mieszkał na południe”, walczył z Izraelem w drodze. Tu leżały południowe miasta Judy „podle granicy Edom ku południowi”, z Beer-Szebą jako kresem ziemi zasiedlonej. Dawid z Siklag napadał na Amalekitów i ich sąsiadów, a Achisowi mówił, że wpadał „ku południu Judy, i ku południu w Jerameel, i ku południu Ceni”; Amalekici w odwecie spalili Siklag. Archeologia ukazuje dolinę Beer-Szeby zasiedloną w epoce żelaza, z twierdzą i sanktuarium w Aradzie; liczne małe forty wyżyn jedni datują na wiek Salomona, choć ich datowanie i przeznaczenie są sporne."
    - "Prorocy widzą w Negewie część ziemi, która ma zostać odnowiona: „Miasta na południe zawarte będą”, ostrzega Jeremiasz, a jednak w miastach południa znów „rolę za pieniądze kupować będą”, i Abdiasz zapowiada, że „odziedziczą krainę południową z górą Ezawa”. Psalm modli się o powrót „jako strumienie na południe”, czyli nagłe wezbrania wadi pustyni. Po wygnaniu Edomici osiedlili się w północnym Negewie, który stał się Idumeą, a od III wieku p.n.e. Nabatejczycy prowadzili przez niego szlak kadzidlany z Petry do Gazy, budując Awdat, Mamszit, Szivta i Chaluca, które rozkwitły jako miasta bizantyńskie i w 2005 roku zostały wpisane na listę UNESCO."
    - "Dziś Negew stanowi ponad połowę terytorium Izraela, lecz mieszka w nim tylko niewielki odsetek ludności. Beer-Szeba, jego stolica, rozrosła się do ponad 200 tysięcy mieszkańców, Arabowie beduińscy liczą grubo ponad dwieście tysięcy, a na południowym krańcu leży Ejlat; Dawid Ben Gurion, który nawoływał do zasiedlenia pustyni, jest pochowany w Sede Boker nad pustynią Sin."
  cs:
    - "Negev je suchý jih země, pouštní trojúhelník mezi judskými pahorky a Sinajským poloostrovem, od Beer-šebské kotliny dolů k Akabskému zálivu, na západě ohraničený Sinajskou pouští a na východě Arabou. Hebrejské negev znamená suchou zemi, a protože poušť ležela jižně od Judska, začalo slovo znamenat samotný „jih“; King James Version je překládá „the south“ a ruská synodální Bible rovněž mluví o jihu a o „jižní zemi“. Déšť padá jen na severu, asi 200 mm ročně v Beer-šebě a mnohem méně dále na jih, kde se země láme ve vápencovou vysočinu a velké krátery Ramon a Chatira."
    - "Abraham, o němž se praví: „hnul se Abram dále, a odebral se odtud ku poledni“, bydlel mezi Kádeš a Šurem, kopal studny a v Beer-šebě vysadil hájek, a Izák „bydlil v zemi polední“. Z Kádeš-barnea vyzvědači „šli stranou polední“ do Hebronu a hlásili: „Amalech bydlí v kraji poledním“; král Aradu, „kterýž bydlil na poledne“, bojoval proti Izraeli na jeho cestě. Jozuova jižní města Judy „podlé pomezí Edom na poledne“ ležela zde, s Beer-šebou jako hranicí osídlené země. David z Siklagu podnikal výpady na Amalechity a jejich sousedy, Achisovi však tvrdil, že vpadl „k straně polední Judově“, Jerachmeelovy a Cinejského; Amalechité na oplátku Siklag vypálili. Archeologie ukazuje Beer-šebské údolí osídlené v době železné, s pevností a svatyní v Aradu; mnohé malé pevnůstky vysočiny datují někteří do Šalomounova století, jejich datace a účel jsou však sporné."
    - "Proroci hledí na Negev jako na část země, která má být obnovena: „Města polední uzavírána budou“, varuje Jeremjáš, a přesto lidé „Pole za peníze kupovati budou“ opět v městech poledních, a Obadjáš slibuje, že „děditi budou v krajině polední s horou Ezau“. Žalm prosí o návrat „tak jako potoky na vyprahlou krajinu“, nečekané záplavy pouštních vádí. Po exilu se Edomci usadili v severním Negevu, který se stal Idumeou, a od 3. století př. n. l. vedli Nabatejci přes něj kadidlovou cestu z Petry do Gazy a postavili Avdat, Mamšit, Šivtu a Chalucu, které vzkvétaly jako byzantská města a byly roku 2005 zapsány UNESCO."
    - "Dnes tvoří Negev přes polovinu izraelské země, ale žije v něm jen malý podíl obyvatel. Beer-šeba, jeho hlavní město, vyrostla na více než 200 000 obyvatel, beduínských Arabů je dobře přes dvě stě tisíc a na jižním cípu stojí Ejlat; Ben Gurion, který naléhal na osídlení pouště, je pohřben v Sde Boker nad Sínskou pouští."
  nl:
    - "De Negev is het droge zuiden van het land, de driehoek van woestijn tussen de heuvels van Juda en het Sinaïschiereiland, van het bekken van Berseba tot de Golf van Akaba, begrensd door de Sinaïwoestijn in het westen en de Araba in het oosten. Het Hebreeuwse negev betekent droog land, en omdat de woestijn ten zuiden van Juda lag, kreeg het woord de betekenis van “zuid” zelf; de King James Version geeft het weer met “the south”, en ook de Synodale Bijbel spreekt van het zuiden en van het “zuidelijke land”. Regen valt alleen in het noorden, zo’n 200 mm per jaar bij Berseba en veel minder verder zuidelijk, waar het land overgaat in het kalksteenhoogland en de grote kraters van Ramon en Chatira."
    - "Abraham reisde “gaande en trekkende naar het zuiden”, woonde tussen Kades en Sur, groef putten en plantte een bos bij Berseba, en Isaak “woonde in het zuiderland”. Vanuit Kades-Barnea de verspieders “trokken op in het zuiden” naar Hebron en meldden: “De Amalekieten wonen in het land van het zuiden”; de koning van Arad, “wonende tegen het zuiden”, streed tegen Israël onderweg. Jozua’s steden van Juda “tot de landpale van Edom, tegen het zuiden” lagen hier, met Berseba als bewoningsgrens. David viel vanuit Siklag de Amalekieten en hun buren aan, maar zei Achis te zijn ingevallen “tegen het zuiden van Juda”, “tegen het zuiden der Jerahmeelieten” en der Kenieten; de Amalekieten verbrandden daarop Siklag. Het dal van Berseba was bewoond in de ijzertijd, met vesting en heiligdom van Arad; de kleine forten van het hoogland dateren sommigen uit Salomo’s eeuw, al zijn datering en doel omstreden."
    - "De profeten zien de Negev als deel van het te herstellen land: “De steden van het zuiden zijn toegesloten”, waarschuwt Jeremia, en toch geldt in de steden van het zuiden weer: “Velden zal men voor geld kopen”, en Obadja belooft dat “die van het zuiden zullen Ezau’s gebergte ... erfelijk bezitten”. De psalm bidt om een terugkeer “gelijk waterstromen in het zuiden”, de plotselinge watervloeden van de woestijnbeekbeddingen. Na de ballingschap vestigden Edomieten zich in de noordelijke Negev, die Idumea werd, en vanaf de 3e eeuw v.Chr. beheerden de Nabateeërs de wierookroute van Petra naar Gaza, waarbij ze Avdat, Mamshit, Shivta en Chaloetsa bouwden, die als Byzantijnse steden bloeiden en in 2005 door UNESCO werden ingeschreven."
    - "Tegenwoordig vormt de Negev meer dan de helft van Israëls grondgebied, maar woont er maar een klein deel van de bevolking. Berseba, de hoofdstad, is gegroeid tot meer dan 200.000 inwoners, de bedoeïenen tellen ruim tweehonderdduizend, en Eilat ligt aan de zuidpunt; Ben-Gurion, die de vestiging in de woestijn bepleitte, ligt begraven in Sde Boker boven de woestijn van Zin."
  sv:
    - "Negev är landets torra södra del, öken-triangeln mellan Judas berg och Sinaihalvön, från Beer Sheva-bäckenet ned till Akababukten, avgränsad av Sinaiöknen i väster och Arava i öster. Det hebreiska negev betyder torrt land, och eftersom öknen låg söder om Juda kom ordet att betyda själva ”söder”; King James-översättningen återger det som ”the south”, och den synodala bibeln talar likaså om söder och om ”södra landet”. Regn faller bara i norr, omkring 200 mm om året i Beer Sheva och långt mindre längre söderut, där landet bryts upp i kalkstenshögland och de stora kratrarna Ramon och Hatira."
    - "Abraham ”drog sig allt längre mot Sydlandet”, bodde mellan Kadesh och Shur, grävde brunnar och planterade en lund vid Beer Sheva, och Isak ”bodde i Sydlandet”. Från Kadesh-Barnea gick spejarna: ”De drogo upp till Sydlandet och kommo till Hebron”, och rapporterade: ”Amalekiterna bo i Sydlandet”; kungen av Arad, ”som bodde i Sydlandet”, stred mot Israel på dess väg. Josuas södra städer i Juda, ”mot Edoms gräns, i Sydlandet”, låg här, med Beer Sheva som bosättningens gräns. David plundrade från Siklag amalekiterna och deras grannar, medan han sade till Akish att han plundrat ”den del av Sydlandet, som tillhör Juda”, jerachmeeliternas och kainéernas; amalekiterna brände Siklag till gengäld. Beer Sheva-dalen bosattes under järnåldern, med Arads fästning och helgedom; högplatåns många små fort dateras av vissa till Salomos århundrade, men datering och syfte är omstridda."
    - "Profeterna ser Negev som en del av det land som ska återupprättas: ”Städerna i Sydlandet äro tillslutna”, varnar Jeremia, men man ska åter ”köpa åkrar” i Sydlandets städer, och Obadja lovar att ”Sydlandets folk skall taga Esaus berg i besittning”. Psalmen ber om en återvändo ”såsom du återför bäckarna i Sydlandet”, ökenvadiernas plötsliga översvämningar. Efter exilen bosatte sig edoméerna i norra Negev, som blev Idumeen, och från 200-talet f.Kr. drev nabatéerna rökelsevägen över det från Petra till Gaza och byggde Avdat, Mamshit, Shivta och Haluza, som blomstrade som bysantinska städer och 2005 upptogs på Unescos världsarvslista."
    - "I dag utgör Negev mer än hälften av Israels mark men rymmer bara en liten andel av folket. Beer Sheva, dess huvudstad, har vuxit till över 200 000, beduinaraberna är långt över tvåhundratusen och Eilat ligger vid den södra spetsen; Ben-Gurion, som drev på bosättningen av öknen, är begravd i Sde Boker ovanför öknen Sin."
  nb:
    - "Negev er landets tørre sør, ørkentrekanten mellom Judas åser og Sinai-halvøya, fra Beer-Sjeba-bassenget ned til Aqababukta, avgrenset av Sinai-ørkenen i vest og Arava i øst. Det hebraiske negev betyr tørt land, og siden ørkenen lå sør for Juda kom ordet til å bety selve «sør»; King James Version gjengir det som «the south», og den synodale bibelen taler likeså om sør og «sørlandet». Regn faller bare i nord, omtrent 200 mm i året i Beer-Sjeba og langt mindre lenger sør, der landet brytes opp i kalksteinshøylandet og de store kraterne Ramon og Hatira."
    - "Abraham «drog efter hvert videre til sydlandet», «bodde mellem Kades og Sur», gravde brønner og plantet en tamarisk i Beer-Sjeba, og Isak «bodde i sydlandet». Fra Kadesj-Barnea «drog [de] op til sydlandet» til Hebron, og spionene meldte: «Amalekittene bor i sydlandet»; kongen i Arad, «som bodde i sydlandet», kjempet mot Israel på veien. Josvas sørlige byer i Juda «mot Edoms landemerke, i sydlandet» lå her, med Beer-Sjeba som bosetningens grense. David plyndret fra Siklag amalekittene og deres naboer, mens han sa til Akisj at han hadde gjort innfall «i sydlandet, både blandt Judas menn og blandt jerahme'elittene og kenittene»; amalekittene brente Siklag til gjengjeld. Beer-Sjeba-dalen ble bosatt i jernalderen, med Arads festning og helligdom; høylandets mange små festninger dateres av noen til Salomos århundre, men datering og formål er omstridt."
    - "Profetene ser på Negev som en del av landet som skal gjenopprettes: «Sydlandets byer er lukket», advarer Jeremia, men likevel skal menn igjen «kjøpe marker» i byene i sør, og Obadja lover at «de som bor i sydlandet, skal ta Esaus berg i eie». Salmen ber om en hjemkomst «likesom bekker i sydlandet», ørkenens flomførende tørrelver. Etter eksilet slo edomittene seg ned i det nordlige Negev, som ble Idumea, og fra 200-tallet f.Kr. drev nabateerne virakveien over det fra Petra til Gasa og bygde Avdat, Mamshit, Shivta og Haluza, som blomstret som bysantinske byer og ble innskrevet av UNESCO i 2005."
    - "I dag utgjør Negev mer enn halvparten av Israels land, men har bare en liten andel av folket. Beer-Sjeba, hovedstaden, har vokst til mer enn 200 000, beduinarabere teller godt over to hundre tusen, og Eilat ligger ved den sørlige spissen; Ben-Gurion, som oppfordret til bosetting av ørkenen, er gravlagt i Sde Boker over ørkenen Sin."
