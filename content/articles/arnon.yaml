body:
  en:
    - "The Arnon is the river that cuts the Moabite plateau in two, today the Wadi Mujib in Jordan. It rises in the desert east of the King's Highway, gathers the Wadi Wala and other tributaries, and falls through a canyon several hundred metres deep to the Dead Sea, which it enters half-way down the eastern shore. The gorge was the great barrier of the tableland: the Bible speaks of its “brooks” and its “fords”, and the King's Highway had to descend one wall and climb the other."
    - "“Arnon is the border of Moab, between Moab and the Amorites”, Numbers says, and then quotes a fragment of the lost book of the wars of the Lord. Sihon of Heshbon had taken the land north of the river from Moab; Israel took it from Sihon and held “from Arnon unto Jabbok”, and Aroer “on the bank of the river Arnon” marked the southern end of Reuben. Balak met Balaam at a town of Moab “in the border of Arnon”. Jephthah reminded the Ammonites that Israel had dwelt along the Arnon for “three hundred years”. In Jehu's days Hazael of Damascus seized the land “from Aroer, which is by the river Arnon”. Isaiah pictured the daughters of Moab “at the fords of Arnon” like birds driven from the nest, and Jeremiah bade Moab's mourners “tell ye it in Arnon”."
    - "Mesha, king of Moab, records on his stele that he built the road at the Arnon; the Romans, after AD 106, carried the Via Nova Traiana across the gorge, and milestones still stand along the descent. Eusebius knew the Arnon as a steep gorge north of Areopolis, guarded by posts of soldiers. Travellers of the nineteenth century, Burckhardt among them, were the first Europeans to describe the canyon, and the modern highway, with a bridge at the bottom, still winds down and up its walls."
    - "Since 1987 the lower gorge has been a nature reserve, now the Mujib Biosphere Reserve, often called the lowest nature reserve in the world, home to ibex and to a wet-canyon trail popular with hikers; a dam finished in the early 2000s holds the river above it. The name Arnon survives nowhere on the ground, but the Mujib is the same river the Moabites and Israelites crossed."
  ru:
    - "Арнон — река, рассекающая Моавитское плато надвое, ныне Вади-Муджиб в Иордании. Она начинается в пустыне к востоку от Царской дороги, принимает Вади-Вала и другие притоки и падает каньоном глубиной в несколько сотен метров к Мёртвому морю, в которое впадает посередине восточного берега. Ущелье было главной преградой плоскогорья: Библия говорит о его потоках и бродах, а Царской дороге приходилось спускаться по одной стене и подниматься по другой."
    - "«Арнон граница Моава, между Моавом и Аморреем», — говорит книга Чисел и затем приводит отрывок из утраченной книги браней Господних. Сигон Есевонский отнял у Моава землю к северу от реки; Израиль отнял её у Сигона и владел ею «от Арнона до Иавока», а Ароер «на берегу потока Арнона» отмечал южный край Рувима. Валак встретил Валаама в городе Моавитском, «который на границе при Арноне». Иеффай напоминал Аммонитянам, что Израиль жил вдоль Арнона «триста лет». Во дни Ииуя Азаил Дамасский захватил землю «начиная от Ароера, который при потоке Арноне». Исаия видел дочерей Моава «у бродов Арнонских» подобными птицам, выброшенным из гнезда, а Иеремия велел плачущим о Моаве возвестить в Арноне, что он опустошён."
    - "Меса, царь Моавитский, записал на своей стеле, что построил дорогу у Арнона; римляне после 106 г. н. э. провели через ущелье Новую Траянову дорогу, и вдоль спуска до сих пор стоят её мильные камни. Евсевий знал Арнон как крутое ущелье к северу от Ареополя, которое стерегли военные посты. Путешественники XIX века, среди них Буркхардт, первыми из европейцев описали каньон, а современное шоссе с мостом на дне всё так же вьётся вниз и вверх по его стенам."
    - "С 1987 года нижняя часть ущелья — заповедник, ныне биосферный заповедник Муджиб, который часто называют самым низко лежащим заповедником мира, с горными козлами и популярной у туристов тропой по воде; плотина, достроенная в начале 2000-х, держит реку выше. Имя Арнон нигде на местности не сохранилось, но Муджиб — та же река, которую переходили Моавитяне и Израильтяне."
  uk:
    - "Арнон — річка, що розтинає Моавське плато надвоє, нині вадій Муджиб в Йорданії. Вона починається в пустелі на схід від Царського шляху, збирає вадій Вала та інші притоки й падає каньйоном глибиною кілька сотень метрів до Мертвого моря, куди впадає посередині східного берега. Ущелина була великою перепоною плато: Біблія говорить про її «потоки» й «броди», а Царському шляхові доводилося спускатися одним схилом і підніматися другим."
    - "«Арнон границя Моабова, між Моабіями і Аморіями», — каже книга Числа, а далі цитує уривок із втраченої книги воєн Господніх. Сігон Гесбонський відібрав у Моаба землю на північ від річки; Ізраїль узяв її в Сігона й тримав її «від Арнона до Ябока», а Ароер, «що на березї Арнон-річки», позначав південний край Рувима. Валак зустрів Валаама в моавському місті «в Ір-Моаб, на побережю Арнона, що на самому краю займища». Єфтай нагадав аммонітянам, що Ізраїль жив уздовж Арнона «триста год». За днів Єгу Азаїл Дамаський захопив землю «від Ароеру на Арнон ріцї». Ісая уявляв дочок Моава «коло бродів Арнону», як птахів, викинених із гнізда, а Єремія наказував плакальникам Моава: «вістїте в Арнонї»."
    - "Меша, цар Моава, записує на своїй стелі, що збудував дорогу над Арноном; римляни після 106 р. н. е. провели через ущелину Нову Траянову дорогу (Via Nova Traiana), і верстові камені й досі стоять уздовж спуску. Євсевій знав Арнон як стрімку ущелину на північ від Ареополя, охоронювану військовими постами. Мандрівники XIX століття, серед них Буркгардт, були першими європейцями, які описали каньйон, а сучасна траса з мостом унизу й досі в'ється вниз і вгору його стінами."
    - "Від 1987 року нижня ущелина є заповідником, нині біосферним заповідником Муджиб, який часто називають найнижчим заповідником у світі, домівкою гірських козлів і мокрої каньйонної стежки, популярної серед мандрівників; гребля, завершена на початку 2000-х, тримає річку вище. Назва Арнон ніде на місцевості не збереглася, але Муджиб — та сама річка, яку перетинали моавитяни та ізраїльтяни."
  es:
    - "El Arnón es el río que corta en dos la meseta de Moab, hoy el uadi Mujib, en Jordania. Nace en el desierto al este de la Calzada del Rey, recoge el uadi Wala y otros afluentes, y se despeña por un cañón de varios cientos de metros de profundidad hasta el mar Muerto, al que llega a mitad de la orilla oriental. La garganta era la gran barrera de la meseta: la Biblia habla de sus «arroyos» y de sus «vados», y la Calzada del Rey tenía que descender una pared y subir la otra."
    - "«Arnón es término de Moab, entre Moab y el Amorrheo», dice Números, y luego cita un fragmento del perdido libro de las batallas de Jehová. Sehón de Hesbón había tomado a Moab la tierra al norte del río; Israel se la tomó a Sehón y poseyó «desde Arnón hasta Jaboc», y Aroer «junto á la ribera del arroyo de Arnón» marcaba el extremo meridional de Rubén. Balac salió a recibir a Balaam a una ciudad de Moab «junto al término de Arnón». Jefté recordó a los amonitas que Israel había habitado a lo largo del Arnón «por trescientos años». En los días de Jehú, Hazael de Damasco se apoderó de la tierra «desde Aroer que está junto al arroyo de Arnón». Isaías imaginó a las hijas de Moab «en los vados de Arnón» como aves espantadas de su nido, y Jeremías mandó a los que lloraban por Moab: «denunciad en Arnón»."
    - "Mesa, rey de Moab, registra en su estela que construyó el camino del Arnón; los romanos, después de 106 d. C., llevaron la Vía Nova Traiana a través de la garganta, y aún se alzan miliarios a lo largo del descenso. Eusebio conocía el Arnón como una garganta escarpada al norte de Areópolis, guardada por puestos de soldados. Los viajeros del siglo XIX, Burckhardt entre ellos, fueron los primeros europeos en describir el cañón, y la carretera moderna, con un puente en el fondo, sigue bajando y subiendo en curvas por sus paredes."
    - "Desde 1987 la garganta inferior es una reserva natural, hoy la Reserva de la Biosfera de Mujib, a menudo llamada la reserva natural más baja del mundo, hogar de íbices y de un sendero de cañón húmedo popular entre los excursionistas; una presa terminada a principios de la década de 2000 retiene el río por encima de ella. El nombre Arnón no sobrevive en ningún lugar del terreno, pero el Mujib es el mismo río que cruzaron moabitas e israelitas."
  pt:
    - "O Arnom é o rio que corta ao meio o planalto de Moabe, hoje o uádi Mujib, na Jordânia. Nasce no deserto a leste da Estrada Real, reúne o uádi Wala e outros afluentes e cai por um desfiladeiro de várias centenas de metros de profundidade até o mar Morto, que alcança na metade da margem oriental. A garganta era a grande barreira do altiplano: a Bíblia fala de seus “vales” e de seus “vaus”, e a Estrada Real tinha de descer uma parede e subir a outra."
    - "“O Arnom é a fronteira de Moabe, entre Moabe e os amorreus”, diz Números, e em seguida cita um fragmento do perdido livro das guerras do SENHOR. Seom de Hesbom havia tomado de Moabe a terra ao norte do rio; Israel a tomou de Seom e ocupou “desde o Arnom até o Jaboque”, e Aroer, “que está à beira do vale do Arnom”, marcava o extremo sul de Rúben. Balaque encontrou Balaão numa cidade de Moabe “que fica na fronteira do Arnom”. Jefté lembrou aos amonitas que Israel habitara ao longo do Arnom “durante trezentos anos”. Nos dias de Jeú, Hazael de Damasco tomou a terra “desde Aroer, que fica junto ao vale do Arnom”. Isaías imaginou as filhas de Moabe “nos vaus do Arnom” como pássaros expulsos do ninho, e Jeremias mandou os que choravam por Moabe: “Anunciem junto ao Arnom”."
    - "Mesa, rei de Moabe, registra em sua estela que construiu a estrada no Arnom; os romanos, depois de 106 d.C., levaram a Via Nova Traiana através do desfiladeiro, e marcos miliários ainda se erguem ao longo da descida. Eusébio conhecia o Arnom como uma garganta íngreme ao norte de Areópolis, guardada por postos de soldados. Viajantes do século XIX, entre eles Burckhardt, foram os primeiros europeus a descrever o desfiladeiro, e a rodovia moderna, com uma ponte no fundo, ainda serpenteia descendo e subindo suas paredes."
    - "Desde 1987 o baixo desfiladeiro é uma reserva natural, hoje a Reserva da Biosfera de Mujib, muitas vezes chamada a reserva natural mais baixa do mundo, lar de íbex e de uma trilha de cânion úmido popular entre os caminhantes; uma barragem concluída no início dos anos 2000 retém o rio acima dela. O nome Arnom não sobrevive no terreno, mas o Mujib é o mesmo rio que moabitas e israelitas atravessaram."
  de:
    - "Der Arnon ist der Fluss, der das moabitische Plateau in zwei Teile schneidet, heute der Wadi Mudschib in Jordanien. Er entspringt in der Wüste östlich der Königsstraße, nimmt den Wadi Wala und andere Zuflüsse auf und stürzt durch einen mehrere hundert Meter tiefen Canyon zum Toten Meer, das er auf halber Höhe des Ostufers erreicht. Die Schlucht war die große Barriere des Hochlands: Die Bibel spricht von seinen „Bächen“ und seinen „Furten“, und die Königsstraße musste die eine Wand hinab- und die andere hinaufsteigen."
    - "„Der Arnon ist die Grenze Moabs zwischen Moab und den Amoritern“, sagt das Vierte Buch Mose und zitiert dann ein Bruchstück aus dem verlorenen Buch von den Kriegen des HERRN. Sihon von Heschbon hatte das Land nördlich des Flusses Moab genommen; Israel nahm es Sihon ab und hielt es „vom Arnon an bis an den Jabbok“, und Aroër „das am Ufer des Bachs Arnon liegt“ bezeichnete das Südende Rubens. Balak traf Bileam in einer Stadt Moabs, „die da liegt an der Grenze des Arnon“. Jeftah erinnerte die Ammoniter daran, dass Israel „dreihundert Jahre“ am Arnon gewohnt hatte. In Jehus Tagen nahm Hasaël von Damaskus das Land „von Aroer an, das am Bach Arnon liegt“. Jesaja malte die Töchter Moabs „in den Furten des Arnon“ wie aus dem Nest vertriebene Vögel, und Jeremia hieß Moabs Trauernde: „sagt's am Arnon“."
    - "Mesa, der König von Moab, berichtet auf seiner Stele, dass er die Straße am Arnon baute; die Römer führten nach 106 n. Chr. die Via Nova Traiana durch die Schlucht, und Meilensteine stehen noch am Abstieg. Eusebius kannte den Arnon als steile Schlucht nördlich von Areopolis, von Soldatenposten bewacht. Reisende des 19. Jahrhunderts, unter ihnen Burckhardt, waren die ersten Europäer, die den Canyon beschrieben, und die moderne Straße mit einer Brücke am Grund windet sich noch immer an seinen Wänden hinab und hinauf."
    - "Seit 1987 ist die untere Schlucht ein Naturreservat, heute das Biosphärenreservat Mudschib, oft das tiefstgelegene Naturreservat der Welt genannt, Heimat von Steinböcken und eines bei Wanderern beliebten Nasscanyon-Pfads; ein Anfang der 2000er Jahre fertiggestellter Damm hält den Fluss oberhalb zurück. Der Name Arnon überlebt nirgends im Gelände, doch der Mudschib ist derselbe Fluss, den Moabiter und Israeliten überquerten."
  fr:
    - "L’Arnon est le fleuve qui coupe en deux le plateau moabite, aujourd’hui le Wadi Mujib, en Jordanie. Il naît dans le désert à l’est de la route royale, rassemble le Wadi Wala et d’autres affluents, et tombe par un canyon profond de plusieurs centaines de mètres jusqu’à la mer Morte, qu’il atteint à mi-chemin de la rive orientale. La gorge était la grande barrière du haut plateau : la Bible parle de ses « torrents » et de ses « passages », et la route royale devait descendre une paroi et gravir l’autre."
    - "« L’Arnon est la frontière de Moab, entre Moab et les Amoréens », disent les Nombres, qui citent ensuite un fragment du livre perdu des guerres de l’Éternel. Sihon de Hesbon avait pris à Moab le pays au nord du fleuve ; Israël le lui prit et tint le pays « depuis l’Arnon jusqu’au Jabbok », et « Aroër sur les bords du torrent d’Arnon » marquait l’extrémité sud de Ruben. Balak rencontra Balaam à une ville de Moab « qui est sur la limite de l’Arnon ». Jephté rappela aux Ammonites qu’Israël habitait le long de l’Arnon depuis « trois cents ans ». Aux jours de Jéhu, Hazaël de Damas conquit le pays « depuis Aroër sur le torrent de l’Arnon ». Ésaïe vit les filles de Moab « au passage de l’Arnon » comme des oiseaux chassés du nid, et Jérémie dit aux endeuillés de Moab : « Publiez sur l’Arnon »."
    - "Mescha, roi de Moab, consigne sur sa stèle qu’il a construit la route de l’Arnon ; les Romains, après 106 apr. J.-C., firent passer la Via Nova Traiana à travers la gorge, et des bornes milliaires se dressent encore le long de la descente. Eusèbe connaissait l’Arnon comme une gorge abrupte au nord d’Aréopolis, gardée par des postes de soldats. Des voyageurs du XIXe siècle, dont Burckhardt, furent les premiers Européens à décrire le canyon, et la route moderne, avec un pont au fond, serpente encore en descendant et remontant ses parois."
    - "Depuis 1987, la gorge inférieure est une réserve naturelle, aujourd’hui la réserve de biosphère de Mujib, souvent dite la plus basse réserve naturelle du monde, refuge de bouquetins et site d’un sentier de canyon humide prisé des randonneurs ; un barrage achevé au début des années 2000 retient le fleuve en amont. Le nom d’Arnon ne survit nulle part sur le terrain, mais le Mujib est le fleuve même que franchirent Moabites et Israélites."
  it:
    - "L’Arnon è il fiume che taglia in due l’altopiano moabita, oggi lo Wadi Mujib in Giordania. Nasce nel deserto a est della Via del Re, raccoglie lo Wadi Wala e altri affluenti, e cade attraverso un canyon profondo parecchie centinaia di metri nel Mar Morto, in cui entra a metà della riva orientale. La gola era la grande barriera dell’altopiano: la Bibbia parla dei suoi «torrenti» e dei suoi «guadi», e la Via del Re doveva scendere una parete e risalire l’altra."
    - "«L’Arnon è il confine di Moab, fra Moab e gli Amorei», dicono i Numeri, che poi citano un frammento del perduto libro delle guerre del Signore. Sicon di Chesbon aveva tolto a Moab la terra a nord del fiume; Israele la tolse a Sicon e tenne il paese «dall’Arnon fino al Jabbok», e Aroer «sull’orlo della valle dell’Arnon» segnava l’estremità meridionale di Ruben. Balak incontrò Balaam in una città di Moab «sul confine segnato dall’Arnon». Iefte ricordò agli Ammoniti che Israele abitava lungo l’Arnon da «trecent’anni». Ai giorni di Ieu, Cazaèl di Damasco si impadronì del paese «fino ad Aroer ch’è presso la valle dell’Arnon». Isaia immaginò le figlie di Moab «ai guadi dell’Arnon» come uccelli scacciati dal nido, e Geremia disse agli afflitti di Moab: «annunziate sull’Arnon che Moab è devastato»."
    - "Mesa, re di Moab, registra sulla sua stele di aver costruito la strada sull’Arnon; i Romani, dopo il 106 d.C., portarono la Via Nova Traiana attraverso la gola, e pietre miliari restano lungo la discesa. Eusebio conosceva l’Arnon come una ripida gola a nord di Areopoli, presidiata da posti di soldati. I viaggiatori dell’Ottocento, fra cui Burckhardt, furono i primi europei a descrivere il canyon, e la strada moderna, con un ponte sul fondo, scende e risale ancora le sue pareti."
    - "Dal 1987 la gola inferiore è una riserva naturale, oggi la Riserva della Biosfera di Mujib, spesso detta la riserva naturale più bassa del mondo, patria di stambecchi e di un sentiero in canyon umido popolare tra gli escursionisti; una diga ultimata nei primi anni 2000 trattiene il fiume a monte. Il nome Arnon non sopravvive da nessuna parte sul terreno, ma il Mujib è lo stesso fiume che Moabiti e Israeliti attraversarono."
  pl:
    - "Arnon to rzeka, która przecina wyżynę Moabu na dwoje, dziś Wadi Mujib w Jordanii. Wypływa na pustyni na wschód od Drogi Królewskiej, zbiera Wadi Wala i inne dopływy i spada kanionem głębokim na kilkaset metrów do Morza Martwego, do którego wpada w połowie wschodniego brzegu. Wąwóz był wielką przeszkodą wyżyny: Biblia mówi o jego potokach i brodach, a Droga Królewska musiała zejść jedną ścianą i wspiąć się drugą."
    - "„Arnon jest granica Moabska między Moabczykiem i Amorejczykiem”, mówi Księga Liczb, a następnie cytuje fragment zaginionej księgi wojen Pana. Sychon z Cheszbonu zabrał Moabowi ziemię na północ od rzeki; Izrael zabrał ją Sychonowi i trzymał „od Arnonu aż do Jaboku”, a „Aroer, które jest u potoku Arnon” wyznaczało południowy kraniec Rubena. Balak spotkał Balaama w mieście Moabu, „które jest na granicy Arnonu”. Jefte przypomniał Ammonitom, że Izrael mieszkał wzdłuż Arnonu „przez trzy sta lat”. Za dni Jehu Chazael z Damaszku zajął ziemię „od Aroer, które jest u potoku Arnon”. Izajasz przedstawiał córki Moabu „przy brodach Arnon” jak ptaki wypłoszone z gniazda, a Jeremiasz kazał żałobnikom Moabu: „opowiadajcie w Arnon”."
    - "Mesza, król Moabu, zapisuje na swej steli, że zbudował drogę nad Arnonem; Rzymianie po 106 r. n.e. poprowadzili Via Nova Traiana przez wąwóz, a kamienie milowe wciąż stoją wzdłuż zejścia. Euzebiusz znał Arnon jako stromy wąwóz na północ od Areopolis, strzeżony przez posterunki żołnierzy. Podróżnicy XIX wieku, wśród nich Burckhardt, byli pierwszymi Europejczykami, którzy opisali ten kanion, a nowoczesna szosa z mostem na dnie wciąż wije się w dół i w górę jego ścian."
    - "Od 1987 roku dolny wąwóz jest rezerwatem przyrody, dziś Rezerwatem Biosfery Mujib, często zwanym najniżej położonym rezerwatem przyrody na świecie, domem koziorożców i mokrego szlaku kanionowego lubianego przez turystów; zapora ukończona na początku lat 2000. zatrzymuje rzekę powyżej. Nazwa Arnon nigdzie w terenie nie przetrwała, lecz Mujib to ta sama rzeka, którą przekraczali Moabici i Izraelici."
  nl:
    - "De Arnon is de rivier die het Moabitische plateau in tweeën snijdt, tegenwoordig de Wadi Mujib in Jordanië. Hij ontspringt in de woestijn ten oosten van de Koningsweg, verzamelt de Wadi Wala en andere zijrivieren, en stort door een canyon van enkele honderden meters diep naar de Dode Zee, die hij halverwege de oostoever bereikt. De kloof was de grote barrière van het tafelland: de Bijbel spreekt van zijn “beken” en zijn “veren”, en de Koningsweg moest de ene wand afdalen en de andere beklimmen."
    - "“De Arnon is de landpale van Moab, tussen Moab en tussen de Amorieten”, zegt Numeri, en haalt daarna een fragment aan uit het verloren boek van de oorlogen van de HEER. Sihon van Chesbon had het land ten noorden van de rivier op Moab veroverd; Israël nam het van Sihon en hield het “van de Arnon af tot de Jabbok toe”, en Aroër “aan den oever der beek Arnon” markeerde het zuidelijke einde van Ruben. Balak ontmoette Bileam bij een stad van Moab “aan de landpale van de Arnon”. Jefta herinnerde de Ammonieten eraan dat Israël “driehonderd jaren” langs de Arnon had gewoond. In Jehu’s dagen greep Hazaël van Damascus het land “van Aroër, dat aan de beek van Arnon is”. Jesaja zag de dochters van Moab “aan de veren van Arnon” als vogels uit het nest gedreven, en Jeremia gebood Moabs rouwenden: “verkondigt te Arnon”."
    - "Mesa, koning van Moab, vermeldt op zijn stèle dat hij de weg bij de Arnon aanlegde; de Romeinen voerden na 106 n.Chr. de Via Nova Traiana over de kloof, en mijlpalen staan nog langs de afdaling. Eusebius kende de Arnon als een steile kloof ten noorden van Areopolis, bewaakt door soldatenposten. Reizigers van de negentiende eeuw, onder wie Burckhardt, waren de eerste Europeanen die de canyon beschreven, en de moderne snelweg, met een brug onderaan, kronkelt nog altijd langs zijn wanden omlaag en omhoog."
    - "Sinds 1987 is de benedenkloof een natuurreservaat, nu het Mujib Biosphere Reserve, vaak het laagst gelegen natuurreservaat ter wereld genoemd, thuis van steenbokken en een natte canyonroute die populair is bij wandelaars; een begin deze eeuw voltooide dam houdt de rivier erboven vast. De naam Arnon is nergens ter plekke bewaard, maar de Mujib is dezelfde rivier die Moabieten en Israëlieten overstaken."
  cs:
    - "Arnon je řeka, která rozděluje moábskou planinu na dvě poloviny, dnes vádí Mujib v Jordánsku. Pramení v poušti východně od Královské cesty, shromažďuje vádí Wala a další přítoky a padá kaňonem hlubokým několik set metrů k Mrtvému moři, do něhož ústí v polovině východního břehu. Soutěska byla velkou překážkou náhorní plošiny: Bible mluví o jejích „potocích“ a „brodech“ a Královská cesta musela sestoupit jednou stěnou a vystoupat druhou."
    - "„Arnon jest pomezí Moábské mezi Moábskými a Amorejskými“, praví Numeri a poté citují úryvek ze ztracené knihy bojů Hospodinových. Sichon z Chešbónu vzal zemi severně od řeky Moábovi; Izrael ji vzal Sichonovi a držel ji „od Arnon až do Jabok“ a Aroer „při břehu potoka Arnon“ označoval jižní konec Rúbenova území. Balak se setkal s Bileámem v moábském městě, „kteréž bylo při řece Arnon, jenž jest při konci pomezí“. Jiftách připomněl Amónovcům, že Izrael bydlel podél Arnonu „tři sta let“. Za dnů Jehú Chazael Damašský zabral zemi „od Aroer, kteréž jest při potoku Arnon“. Izajáš zobrazil dcery Moábu „při brodech Arnon“ jako ptáky vyhnané z hnízda a Jeremjáš nařídil truchlícím Moábu: „oznamte u Arnon“."
    - "Meša, král Moábu, zaznamenává na své stéle, že vybudoval cestu u Arnonu; Římané po roce 106 n. l. převedli Via Nova Traiana přes soutěsku a milníky stojí podél sestupu dosud. Eusebios znal Arnon jako příkrou soutěsku severně od Areopole, střeženou vojenskými stanovišti. Cestovatelé 19. století, mezi nimi Burckhardt, byli prvními Evropany, kdo kaňon popsali, a moderní silnice s mostem na dně se po jeho stěnách stále vine dolů a nahoru."
    - "Od roku 1987 je dolní soutěska přírodní rezervací, dnes biosférickou rezervací Mujib, často nazývanou nejníže položenou přírodní rezervací světa, domovem kozorožců a vodní kaňonové stezky oblíbené mezi turisty; přehrada dokončená v prvních letech 21. století drží řeku nad ní. Jméno Arnon nepřežívá nikde na zemi, ale Mujib je táž řeka, kterou přecházeli Moábci a Izraelci."
  sv:
    - "Arnon är floden som skär Moabs platå i två, i dag Wadi Mujib i Jordanien. Den har sitt ursprung i öknen öster om Kungsvägen, samlar Wadi Wala och andra bifloder och störtar genom en kanjon flera hundra meter djup ned till Döda havet, som den når halvvägs ned på östra stranden. Klyftan var högplatåns stora hinder: Bibeln talar om dess bäckar och dess vadställen, och Kungsvägen måste gå ned längs ena väggen och upp längs den andra."
    - "”Arnon är Moabs gräns och flyter fram mellan Moabs land och amoréernas”, säger Fjärde Mosebok och citerar sedan ett fragment av den förlorade ”Boken om HERRENS krig”. Sichon av Heshbon hade tagit landet norr om floden från Moab; Israel tog det från Sichon och höll det ”från Arnon ända till Jabbok”, och Aroer ”vid bäcken Arnons strand” markerade Rubens södra ände. Balak gick Bileam till mötes ”till Ir i Moab, vid gränsen där Arnon flyter”. Jefta påminde ammoniterna om att Israel hade bott längs Arnon ”i tre hundra år”. På Jehus tid tog Hasael av Damaskus landet ”från Aroer vid bäcken Arnon”. Jesaja målade hur Moabs döttrar kommer ”till Arnons vadställen” som fåglar drivna från boet, och Jeremia manade Moabs sörjande: ”Förkunnen vid Arnon”."
    - "Mesha, Moabs kung, uppger på sin stele att han byggde vägen vid Arnon; romarna förde efter 106 e.Kr. Via Nova Traiana över klyftan, och milstolpar står ännu längs nedfarten. Eusebios kände Arnon som en brant klyfta norr om Areopolis, bevakad av soldatposteringar. Resenärer på 1800-talet, bland dem Burckhardt, var de första européer som beskrev kanjonen, och den moderna landsvägen, med en bro på botten, slingrar sig ännu ned och upp längs dess väggar."
    - "Sedan 1987 har den nedre klyftan varit naturreservat, nu Mujibs biosfärreservat, ofta kallat världens lägst belägna naturreservat, hem för stenbock och för en vandringsled genom en våt kanjon som är populär bland vandrare; en damm som färdigställdes i början av 2000-talet håller floden ovanför. Namnet Arnon lever inte kvar någonstans i terrängen, men Mujib är samma flod som moabiterna och israeliterna korsade."
  nb:
    - "Arnon er elven som skjærer Moabs høyslette i to, i dag Wadi Mujib i Jordan. Den har sitt utspring i ørkenen øst for Kongeveien, samler Wadi Wala og andre sideelver, og faller gjennom en kløft flere hundre meter dyp ned til Dødehavet, som den når halvveis nede på østbredden. Kløften var høylandets store barriere: Bibelen taler om dens «bekker» og dens «ferjesteder», og Kongeveien måtte gå ned den ene veggen og opp den andre."
    - "«Arnon er grensen mellem Moab og amorittene», sier 4. Mosebok, og siterer så et fragment av den tapte boken om Herrens kriger. Sihon av Hesjbon hadde tatt landet nord for elven fra Moab; Israel tok det fra Sihon og holdt landet «fra Arnon til Jabbok», og Aroer «ved bredden av Arnon-åen» markerte sørenden av Ruben. Balak møtte Bileam i en by i Moab «som ligger på grensen ved Arnon». Jefta minnet ammonittene om at Israel hadde bodd langs Arnon i «tre hundre år». I Jehus dager la Hasael av Damaskus under seg landet «like fra Aroer ved Arnon-åen». Jesaja skildret Moabs døtre «ved Arnons ferjesteder» som fugler jaget fra reiret, og Jeremia ba Moabs sørgende: «Kunngjør ved Arnon»."
    - "Mesa, konge av Moab, forteller på steleen sin at han bygde veien ved Arnon; romerne førte etter 106 e.Kr. Via Nova Traiana over kløften, og milepæler står ennå langs nedstigningen. Eusebius kjente Arnon som en bratt kløft nord for Areopolis, voktet av soldatposter. Reisende på 1800-tallet, blant dem Burckhardt, var de første europeerne som beskrev kløften, og den moderne hovedveien, med en bro på bunnen, slynger seg fortsatt ned og opp veggene."
    - "Siden 1987 har den nedre kløften vært et naturreservat, nå Mujib Biosphere Reserve, ofte kalt verdens laveste naturreservat, hjem for steinbukk og en våtkløftsti som er populær blant fotturister; en demning ferdigstilt tidlig på 2000-tallet holder elven tilbake over den. Navnet Arnon har ikke overlevd noe sted på bakken, men Mujib er den samme elven som moabittene og israelittene krysset."
  tl:
    - "Ang Arnon ay ang ilog na humahati sa talampas ng Moab, ang Wadi Mujib ngayon sa Jordan. Bumubukal ito sa disyerto sa silangan ng Lansangan ng Hari, tumatanggap ng Wadi Wala at iba pang sanga, at bumabagsak sa isang kanyon na ilang daang metro ang lalim patungo sa Dagat na Patay, na pinapasok nito sa kalagitnaan ng silangang baybayin. Ang bangin ang dakilang hadlang ng kapatagan: binabanggit ng Biblia ang mga “libis” at “tawiran” nito, at kailangang bumaba ng Lansangan ng Hari sa isang dingding at umakyat sa kabila."
    - "Sabi ng Mga Bilang, “ang Arnon ay hangganan ng Moab, na nasa pagitan ng Moab at ng mga Amorrheo”, at sinisipi ang isang piraso ng nawalang aklat ng mga digmaan ng Panginoon. Kinuha ni Sehon ng Hesbon ang lupain sa hilaga ng ilog mula sa Moab; kinuha ito ng Israel kay Sehon at hinawakan “mula sa Arnon hanggang Jaboc”, at ang Aroer “na nasa tabi ng libis ng Arnon” ang katimugang dulo ng Ruben. Sinalubong ni Balac si Balaam sa bayan ng Moab “na nasa hangganan ng Arnon”. Ipinaalala ni Jephte sa mga Ammonita ang “tatlong daang taon” ng Israel sa tabi ng Arnon. Sa mga araw ni Jehu, sinakop ni Hazael ng Damasco ang lupain “mula sa Aroer, na nasa siping ng libis ng Arnon”. Inilarawan ni Isaias ang mga anak na babae ng Moab “sa mga tawiran ng Arnon” gaya ng ibong itinaboy sa pugad, at sinabi ni Jeremias sa mga nananangis ng Moab, “saysayin ninyo sa Arnon”."
    - "Itinatala ni Mesa, hari ng Moab, sa kaniyang estela na ginawa niya ang daan sa Arnon; pagkatapos ng 106 AD, dinala ng mga Romano ang Via Nova Traiana sa kabila ng bangin, at nakatayo pa ang mga batong-milya sa pagbaba. Kilala ni Eusebio ang Arnon bilang matarik na bangin sa hilaga ng Areopolis, na binabantayan ng mga himpilan ng sundalo. Ang mga manlalakbay noong ika-19 na siglo, kabilang si Burckhardt, ang unang mga Europeong naglarawan sa kanyon, at paliku-liko pa rin ang makabagong lansangan, na may tulay sa ilalim, pababa at pataas sa mga dingding nito."
    - "Mula 1987, reserbang pangkalikasan ang mas mababang bangin, ngayon ang Reserbang Biosphere ng Mujib, na madalas tawaging pinakamababang reserbang pangkalikasan sa mundo, tahanan ng ibex at ng isang landas na basang kanyon na paborito ng mga naglalakad; pinipigilan ng isang dam na natapos noong unang bahagi ng dekada 2000 ang ilog sa itaas nito. Wala nang pangalang Arnon sa lupa, ngunit ang Mujib ang parehong ilog na tinawid ng mga Moabita at Israelita."
