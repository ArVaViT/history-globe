# Overview article (ADR 0007). Mainstream facts only; Nimrah is the same town; Eusebius' Bethnamaris and Josephus' Bethennabris are noted; Tall Nimrin and Tall Bleibil are the two candidates.
id: beth-nimrah
place: af66b89
