body:
  en:
    - "Beth-nimrah was a town of Gad in the Jordan valley, north-east of the Dead Sea and under 20 km from Jericho across the river. The Gadites and Reubenites asked for the land because it was “a place for cattle”, and Nimrah is in their first list of its towns; when Moses gave it them, “the children of Gad built Dibon, and Ataroth … and Beth-nimrah, and Beth-haran, fenced cities: and folds for sheep”. Joshua places it with Beth-haram, Succoth and Zaphon “in the valley”, the lower Jordan plain that had been Sihon's. The “waters of Nimrim” in the oracles on Moab are usually taken for a different stream, far to the south."
    - "The town lived on. Eusebius knew a village Bethnabris five Roman miles north of Livias, and the Bethennabris where Josephus says Jewish fugitives gathered in AD 68 before Placidus drove them into the Jordan is probably the same. The name survives in the Wadi Nimrin and at Tall Nimrin, a mound at the mouth of the wadi beside the modern town of South Shuna in Jordan. Excavations there from 1989 found a town of the Middle Bronze Age, the Iron Age and the Persian to Byzantine periods, which suits the biblical and the later Beth-nimrah; the neighbouring Tall Bleibil, with Iron Age pottery, is the other candidate, and the Bible gives nothing more to choose by."
  ru:
    - "Беф-Нимра — город Гада в долине Иордана, к северо-востоку от Мёртвого моря, менее чем в 20 км от Иерихона за рекой. Гадитяне и Рувимляне просили эту землю, потому что она была «место годное для стад», и Нимра стоит в их первом списке её городов; когда Моисей отдал её им, «построили сыны Гадовы Дивон и Атароф … и Беф-Нимру и Беф-Гаран, города укрепленные и дворы для овец». Книга Иисуса Навина ставит её с Беф-Гарамом, Сокхофом и Цафоном «на долине», в нижней Иорданской равнине, бывшей владением Сигона. «воды Нимрима» в пророчествах о Моаве обычно считают другим потоком, далеко на юге."
    - "Город жил и дальше. Евсевий знал селение Бетнабрис в пяти римских милях к северу от Ливиады, а Бетеннабрис, где, по словам Иосифа Флавия, в 68 году собрались иудейские беглецы, прежде чем Плацид загнал их в Иордан, — вероятно, то же место. Имя сохранилось в Вади-Нимрин и в Телль-Нимрине, холме у устья вади рядом с нынешним городом Южная Шуна в Иордании. Раскопки там с 1989 года открыли город среднего бронзового века, железного века и от персидского до византийского времени, что подходит и к библейской, и к поздней Беф-Нимре; соседний Телль-Блейбель с керамикой железного века — второй кандидат, а Библия больше ничего для выбора не даёт."
  uk:
    - "Бет-Німра було містом Гада в Йорданській долині, на північний схід від Мертвого моря і менш як за 20 км від Єрихону через річку. Гадіти й рувимівці попросили землі, бо край годився для худоби, і Німра є в їхньому першому переліку міст; коли Мойсей дав її їм, «побудували сини Гадові: Дибон да Атарот та Ароер ... Бет-Нимра і Бет-Гаран, утверджені міста і кошарі для дрібної скотини». Ісус Навин ставить його разом із Бет-Гарамом, Сокхотом і Цафоном «на поділлї», в нижній Йорданській рівнині, що була Сігонова. «Води в Нимримі» в пророцтвах про Моав зазвичай вважають іншим потоком, далеко на півдні."
    - "Місто жило далі. Євсевій знав село Бетнабріс за п'ять римських миль на північ від Лівіади, і Бетеннабріс, де, за Йосифом Флавієм, юдейські втікачі зібралися в 68 р. н. е., перш ніж Плацид загнав їх в Йордан, імовірно, те саме. Назва зберігається у вадії Німрін і в Талль-Німріні, пагорбі в гирлі вадію біля сучасного міста Південна Шуна в Йорданії. Розкопки там від 1989 року виявили місто середньої бронзової доби, залізної доби та періодів від перського до візантійського, що пасує і біблійному, і пізнішому Бет-Німрі; сусідній Талль-Блейбіль з керамікою залізної доби — інший кандидат, і Біблія не дає нічого більше, щоб вибрати."
  es:
    - "Bet-nimra era una ciudad de Gad en el valle del Jordán, al nordeste del mar Muerto y a menos de 20 km de Jericó al otro lado del río. Los gaditas y rubenitas pidieron la tierra porque era «lugar de ganado», y Nimra figura en su primera lista de ciudades; cuando Moisés se la dio, «los hijos de Gad edificaron á Dibón, y á Ataroth, ... Y á Beth-nimra, y á Betharán: ciudades fuertes, y también majadas para ovejas». Josué la sitúa con Bet-haram, Sucot y Zafón en «la campiña», la llanura del bajo Jordán que había sido de Sehón. Las «aguas de Nimrim» de los oráculos sobre Moab se toman por lo común por un arroyo distinto, mucho más al sur."
    - "La ciudad siguió viva. Eusebio conocía una aldea Bethnabris a cinco millas romanas al norte de Livias, y la Bethennabris donde Josefo dice que se reunieron fugitivos judíos en 68 d. C. antes de que Plácido los empujara al Jordán es probablemente la misma. El nombre sobrevive en el uadi Nimrin y en Tall Nimrin, un montículo en la desembocadura del uadi junto a la ciudad moderna de Shuna del Sur, en Jordania. Las excavaciones allí desde 1989 hallaron una ciudad de la Edad del Bronce Medio, de la edad del Hierro y de los períodos persa a bizantino, lo que cuadra con la Bet-nimra bíblica y con la posterior; el vecino Tall Bleibil, con cerámica de la edad del Hierro, es el otro candidato, y la Biblia no da nada más para elegir."
  pt:
    - "Bete-Ninra era uma cidade de Gade no vale do Jordão, a nordeste do mar Morto e a menos de 20 km de Jericó, do outro lado do rio. Gaditas e rubenitas pediram a terra porque “era um lugar para gado”, e Ninra figura em sua primeira lista de cidades; quando Moisés a deu a eles, “Os filhos de Gade construíram Dibom, Atarote, Aroer, … Bete-Ninra e Bete-Harã: cidades fortificadas e currais para ovelhas”. Josué a põe com Bete-Harã, Sucote e Zafom “no vale”, a planície do baixo Jordão que fora de Seom. As “águas de Ninrim” nos oráculos sobre Moabe costumam ser tomadas por outro riacho, muito ao sul."
    - "A cidade sobreviveu. Eusébio conhecia uma aldeia Bethnabris a cinco milhas romanas ao norte de Lívias, e a Bethennabris onde, segundo Josefo, fugitivos judeus se reuniram em 68 d.C. antes que Plácido os lançasse ao Jordão é provavelmente a mesma. O nome sobrevive no uádi Nimrin e em Tall Nimrin, um montículo na foz do uádi, junto à cidade moderna de South Shuna, na Jordânia. Escavações ali desde 1989 acharam uma cidade do Bronze Médio, da Idade do Ferro e dos períodos persa a bizantino, o que convém à Bete-Ninra bíblica e à posterior; a vizinha Tall Bleibil, com cerâmica da Idade do Ferro, é o outro candidato, e a Bíblia nada dá para escolher."
  de:
    - "Bet-Nimra war eine Stadt Gads im Jordantal, nordöstlich des Toten Meeres und unter 20 km von Jericho jenseits des Flusses. Gaditer und Rubeniter erbaten das Land, weil es eine „gute Stätte für ihr Vieh“ war, und Nimra steht in ihrer ersten Liste seiner Städte; als Mose es ihnen gab: „Da bauten die Kinder Gad Dibon, Ataroth, Aroer“ … „Beth-Nimra und Beth-Haran, verschlossene Städte und Schafhürden“. Josua stellt es mit Bet-Haram, Sukkot und Zafon „im Tal“ zusammen, der unteren Jordanebene, die Sihon gehört hatte. Die „Wasser zu Nimrim“ in den Sprüchen über Moab hält man gewöhnlich für einen anderen Bach, weit im Süden."
    - "Die Stadt lebte fort. Eusebius kannte ein Dorf Bethnabris fünf römische Meilen nördlich von Livias, und das Bethennabris, wo sich nach Josephus 68 n. Chr. jüdische Flüchtlinge sammelten, ehe Placidus sie in den Jordan trieb, ist wahrscheinlich dasselbe. Der Name lebt im Wadi Nimrin und in Tall Nimrin fort, einem Hügel an der Wadimündung neben der modernen Stadt Süd-Schuna in Jordanien. Grabungen dort seit 1989 fanden eine Stadt der Mittelbronzezeit, der Eisenzeit und der persischen bis byzantinischen Zeit, was zum biblischen und zum späteren Bet-Nimra passt; das benachbarte Tall Bleibil, mit eisenzeitlicher Keramik, ist der andere Kandidat, und die Bibel gibt nichts mehr zur Entscheidung."
  fr:
    - "Beth-Nimra était une ville de Gad dans la vallée du Jourdain, au nord-est de la mer Morte et à moins de 20 km de Jéricho de l’autre côté du fleuve. Gadites et Rubénites demandèrent le pays parce que c’était « un lieu propre pour des troupeaux », et Nimra figure dans leur première liste de ses villes ; quand Moïse le leur donna, « Les fils de Gad bâtirent Dibon, Atharoth… Beth-Nimra et Beth-Haran, villes fortes, et ils firent des parcs pour les troupeaux ». Josué la place avec Beth-Haram, Succoth et Tsaphon « dans la vallée », la plaine du bas Jourdain qui avait été à Sihon. Les « eaux de Nimrim » des oracles sur Moab sont d’ordinaire tenues pour un autre cours d’eau, bien plus au sud."
    - "La ville survécut. Eusèbe connaissait un village Bethnabris à cinq milles romains au nord de Livias, et la Bennabris où, dit Josèphe, des fugitifs juifs se rassemblèrent en 68 apr. J.-C. avant que Placidus les jette dans le Jourdain est probablement la même. Le nom survit dans le Wadi Nimrin et à Tall Nimrin, tertre à l’embouchure de l’oued près de la ville moderne de Shuna du Sud, en Jordanie. Les fouilles menées là depuis 1989 ont trouvé une ville des âges du Bronze moyen et du Fer et des époques perse à byzantine, ce qui convient à la Beth-Nimra biblique et à la tardive ; le voisin Tall Bleibil, avec de la céramique de l’âge du Fer, est l’autre candidat, et la Bible ne donne rien de plus pour choisir."
  it:
    - "Bet-Nimra era una città di Gad nella valle del Giordano, a nord-est del Mar Morto e a meno di 20 km da Gerico al di là del fiume. I Gaditi e i Rubeniti chiesero la terra perché erano «luoghi da bestiame», e Nimra è nel primo elenco delle sue città; quando Mosè la diede loro, «E i figliuoli di Gad edificarono Dibon, Ataroth, [...] Beth-Nimra e Beth-Haran, città fortificate, e fecero de’ recinti per i greggi». Giosuè la pone con Bet-Aram, Succot e Zafon «nella valle», la piana del basso Giordano che era stata di Sicon. Le «acque di Nimrim» negli oracoli su Moab sono di solito ritenute un corso d’acqua diverso, molto più a sud."
    - "La città sopravvisse. Eusebio conosceva un villaggio Bethnabris a cinque miglia romane a nord di Livias, e la Bethennabris dove Flavio Giuseppe dice che i fuggiaschi giudei si radunarono nel 68 d.C. prima che Placido li spingesse nel Giordano è probabilmente la stessa. Il nome sopravvive nello Wadi Nimrin e a Tall Nimrin, un tell alla foce del wadi presso la città moderna di South Shuna in Giordania. Gli scavi lì dal 1989 hanno trovato una città del Bronzo Medio, dell’età del Ferro e dei periodi persiano-bizantino, il che si accorda con la Bet-Nimra biblica e posteriore; il vicino Tall Bleibil, con ceramica dell’età del Ferro, è l’altro candidato, e la Bibbia non dà altro su cui scegliere."
  pl:
    - "Bet-Nimra było miastem Gada w Dolinie Jordanu, na północny wschód od Morza Martwego i niecałe 20 km od Jerycha po drugiej stronie rzeki. Gadyci i Rubenici poprosili o tę ziemię, bo „miejsce ono było sposobne dla bydła”, a Nimra jest w ich pierwszym wykazie jej miast; gdy Mojżesz im ją dał, „I pobudowali synowie Gadowi Dybon, i Atarot … Betnimera, i Betaran, miasta obronne, i obory dla bydła”. Jozue umieszcza je z Bet-Haram, Sukkot i Safon: „W dolinie też Beram, i Betnimra, i Sochot, i Safon”, w dolnej równinie Jordanu, która należała do Sychona. „Wody Nymrym” w wyroczniach o Moabie uważa się zwykle za inny potok, daleko na południu."
    - "Miasto przetrwało. Euzebiusz znał wieś Bethnabris pięć mil rzymskich na północ od Livias, a Bethennabris, gdzie według Józefa Flawiusza zebrali się żydowscy uciekinierzy w 68 r. n.e., zanim Placidus zapędził ich w Jordan, jest prawdopodobnie tym samym. Nazwa przetrwała w Wadi Nimrin i w Tall Nimrin, kopcu u ujścia wadi obok współczesnego miasta South Shuna w Jordanii. Wykopaliska tam od 1989 roku odsłoniły miasto ze średniej epoki brązu, epoki żelaza i okresów od perskiego do bizantyjskiego, co pasuje do biblijnego i późniejszego Bet-Nimra; sąsiedni Tall Bleibil, z ceramiką epoki żelaza, jest drugim kandydatem, a Biblia nie daje nic więcej, by wybierać."
  nl:
    - "Beth-Nimra was een stad van Gad in de Jordaanvallei, ten noordoosten van de Dode Zee en minder dan 20 km van Jericho over de rivier. De Gadieten en Rubenieten vroegen om het land omdat het “een plaats voor vee” was, en Nimra staat in hun eerste lijst van de steden ervan; toen Mozes het hun gaf, “de kinderen van Gad bouwden Dibon, en Ataroth ... En Beth-Nimra, en Beth-Haran, vaste steden en schaapskooien”. Jozua plaatst haar met Beth-Haram, Sukkot en Zafon “in het dal”, de benedenvlakte van de Jordaan die van Sihon was geweest. De “wateren van Nimrim” in de godsspraken over Moab worden gewoonlijk voor een andere beek gehouden, ver naar het zuiden."
    - "De stad bleef bestaan. Eusebius kende een dorp Bethnabris vijf Romeinse mijlen ten noorden van Livias, en het Bethennabris waar volgens Josephus Joodse vluchtelingen zich in 68 n.Chr. verzamelden voordat Placidus hen de Jordaan in dreef, is waarschijnlijk hetzelfde. De naam leeft voort in de Wadi Nimrin en in Tall Nimrin, een heuvel aan de monding van de wadi naast de moderne stad Zuid-Shuna in Jordanië. Opgravingen daar vanaf 1989 vonden een stad uit de middenbronstijd, de ijzertijd en de Perzische tot Byzantijnse tijd, wat past bij het bijbelse en het latere Beth-Nimra; de naburige Tall Bleibil, met ijzertijdaardewerk, is de andere kandidaat, en de Bijbel geeft niets meer om uit te kiezen."
  cs:
    - "Bét-nimra bylo město Gádovo v Jordánském údolí, severovýchodně od Mrtvého moře a necelých 20 km od Jericha přes řeku. Gádovci a Rúbenovci o zemi žádali, protože to bylo „místo příhodné pro dobytek“, a Nimra je v jejich prvním seznamu jejích měst; když jim ji Mojžíš dal, „vzdělali synové Gád, Dibon, Atarot a Aroer“ … „A Betnemra a Betaran, města hrazená, a stáje pro dobytky“. Jozue je klade s Bét-haramem, Sukotem a Cafonem „V údolí“, do dolní jordánské pláně, která patřila Sichonovi. „Vody Nimrim“ v proroctvích o Moábu se obvykle pokládají za jiný potok, daleko na jihu."
    - "Město žilo dál. Eusebios znal vesnici Bethnabris pět římských mil severně od Livias a Bethennabris, kde se podle Josepha Flavia roku 68 n. l. shromáždili židovští uprchlíci, než je Placidus zahnal do Jordánu, je pravděpodobně totéž. Jméno přežívá ve Wadi Nimrin a v Tall Nimrin, pahorku u ústí vádí vedle moderního města Jižní Šuna v Jordánsku. Vykopávky tam od roku 1989 našly město ze střední doby bronzové, z doby železné a z perského až byzantského období, což odpovídá biblickému i pozdějšímu Bét-nimra; sousední Tall Bleibil, s keramikou z doby železné, je druhým kandidátem a Bible nedává nic dalšího, podle čeho vybrat."
  sv:
    - "Bet-Nimra var en stad i Gad i Jordandalen, nordost om Döda havet och under 20 km från Jeriko över floden. Gaditerna och rubeniterna bad om landet därför att det var ”en trakt för boskap”, och Nimra står i deras första förteckning över dess städer; när Mose gav det åt dem: ”Gads barn byggde upp Dibon, Atarot … Bet-Nimra och Bet-Haran, befästa städer och boskapsgårdar”. Josua placerar den med Bet-Haram, Suckot och Safon ”i dalen”, den nedre Jordanslätten som hade varit Sichons. ”Nimrims vatten” i utsagorna om Moab tas vanligen för en annan ström, långt söderut."
    - "Staden levde vidare. Eusebios kände en by Bethnabris fem romerska mil norr om Livias, och det Bethennabris där Josefus säger att judiska flyktingar samlades år 68 e.Kr. innan Placidus drev dem ut i Jordan är sannolikt detsamma. Namnet lever kvar i Wadi Nimrin och vid Tall Nimrin, en kulle vid wadins mynning intill den moderna staden Södra Shuna i Jordanien. Utgrävningar där från 1989 fann en stad från mellersta bronsåldern, järnåldern och den persiska till bysantinska tiden, vilket passar både det bibliska och det senare Bet-Nimra; den närliggande Tall Bleibil, med järnåldersfynd, är den andra kandidaten, och Bibeln ger inget mer att välja efter."
  nb:
    - "Bet-Nimra var en by i Gad i Jordandalen, nordøst for Dødehavet og under 20 km fra Jeriko over elven. Gadittene og rubenittene ba om landet fordi det var «vel skikket for feavl», og Nimra står i deres første liste over byene der; da Moses ga dem det, «Gads barn bygget op igjen Dibon og Atarot og Aroer … Bet-Nimra og Bet-Haran, faste byer og hegn for feet». Josva plasserer den med Bet-Haram, Sukkot og Safon «i dalen», den nedre Jordan-sletten som hadde vært Sihons. «Nimrims vann» i utsagnene mot Moab regnes vanligvis for en annen bekk, langt mot sør."
    - "Byen levde videre. Eusebius kjente en landsby Bethnabris fem romerske mil nord for Livias, og Bethennabris, der Josefus sier jødiske flyktninger samlet seg i 68 e.Kr. før Placidus drev dem ut i Jordan, er trolig det samme. Navnet lever videre i Wadi Nimrin og ved Tall Nimrin, en tell ved munningen av wadien ved den moderne byen Sør-Shuna i Jordan. Utgravninger der fra 1989 fant en by fra mellombronsealder, jernalder og persisk til bysantinsk tid, noe som passer for både den bibelske og den senere Bet-Nimra; den nærliggende Tall Bleibil, med keramikk fra jernalderen, er den andre kandidaten, og Bibelen gir ikke mer å velge etter."
  tl:
    - "Ang Beth-nimra ay bayan ni Gad sa libis ng Jordan, hilagang-silangan ng Dagat na Patay at wala pang 20 km mula Jerico sa kabila ng ilog. Hiniling ng mga Gadita at Rubenita ang lupain dahil ito ay “dako sa hayop”, at ang Nimra ay nasa unang talaan ng mga bayan nito; nang ibigay ito ni Moises sa kanila, “itinayo ng mga anak ni Gad ang Dibon, at ang Ataroth, … At ang Beth-nimra at ang Bet-haran: na mga bayang nakukutaan, at kulungan din naman ng mga tupa”. Inilalagay ito ni Josue kasama ng Beth-aram, Succoth at Saphon “sa libis”, ang ibabang kapatagan ng Jordan na kay Sehon. Ang “tubig ng Nimrim” sa mga hula tungkol sa Moab ay karaniwang itinuturing na ibang batis, malayo sa timog."
    - "Nabuhay ang bayan. Kilala ni Eusebio ang nayong Bethnabris limang milyang Romano sa hilaga ng Livias, at ang Bethennabris kung saan nagtipon ang mga takas na Judio noong 68 AD bago sila itaboy ni Placidus sa Jordan, ayon kay Josefo, ay marahil iisa. Nabubuhay ang pangalan sa Wadi Nimrin at sa Tall Nimrin, burol sa bukana ng wadi sa tabi ng makabagong bayan ng Timog Shuna sa Jordan. Ang mga paghuhukay doon mula 1989 ay nakatuklas ng bayan ng Gitnang Panahon ng Tanso, Panahon ng Bakal at panahong Persiano hanggang Bisantino, na angkop sa biblikal at kalaunang Beth-nimra; ang karatig na Tall Bleibil, na may palayok ng Panahon ng Bakal, ang isa pang kandidato, at wala nang maibibigay ang Biblia upang makapamili."
