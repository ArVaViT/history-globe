body:
  en:
    - "Immer is one of the places in Babylonia from which a group of exiles returned with Zerubbabel, known only from the list of returning families: “these were they which went up from Tel-melah, Tel-harsa, Cherub, Addan, and Immer: but they could not shew their father's house, and their seed, whether they were of Israel”. Nehemiah repeats the list. These returnees, six hundred and fifty-two in Ezra and six hundred and forty-two in Nehemiah, could not prove their descent, but they were still counted among those who returned; a few priestly families with the same problem were kept from the priesthood until a priest should stand up “with Urim and with Thummim”."
    - "The site is unknown. The other names, Tel-melah “mound of salt” and Tel-harsha, suggest ruined mounds that the Babylonians resettled with deportees, as Ezekiel's Tel-abib by the river Chebar was, and Babylonian tablets of the sixth and fifth centuries BC show Judeans living in such villages in central and southern Babylonia. Whether Cherub, Addan and Immer are three places or one, and whether Immer here is linked to the priestly family of that name, cannot be decided; the Synodal Bible joins the names differently in Ezra and in Nehemiah. Nothing more is known."
  ru:
    - "Иммер — одно из мест в Вавилонии, откуда вернулась с Зоровавелем группа изгнанников; он известен только по списку возвратившихся семей: «И вот вышедшие из Тел-Мелаха, Тел-Харши, Херуб-Аддан-Иммера, которые не могли показать о поколении своем и о племени своем от Израиля ли они». Неемия повторяет список. Эти люди, шестьсот пятьдесят два по Ездре и шестьсот сорок два по Неемии, не смогли доказать своего происхождения, но их всё же причислили к возвратившимся; несколько священнических семей с той же бедой были отстранены от священства, «доколе не восстанет священник с уримом и туммимом»."
    - "Место неизвестно. Другие имена, Тел-Мелах, «соляной холм», и Тел-Харша, указывают на заброшенные холмы, которые вавилоняне заселяли переселенцами, как Тел-Авив при реке Ховаре у Иезекииля, а вавилонские таблички VI–V веков до н. э. показывают Иудеев, живших в таких селениях в средней и южной Вавилонии. Три ли это места — Херув, Аддан и Иммер — или одно, и связан ли Иммер со священническим родом того же имени, решить нельзя; Синодальный перевод соединяет эти имена по-разному у Ездры и у Неемии. Больше ничего не известно."
  uk:
    - "Іммер — одне з місць у Вавилонії, звідки група вигнанців повернулася із Зоровавелем, відоме лише з переліку родин, що повернулися: «А оце ті, що вийшли з Телмелаха, Тел-харші, Херуб-Аддан-Іммера, та що не могли сказати про своє поколїннє й про своє племя — чи вони від Ізраїля». Неемія повторює перелік. Ці повернуті, шістсот п’ятдесят два в Ездри й шістсот сорок два в Неемії, не могли довести свого походження, але їх усе ж зарахували до тих, хто повернувся; кілька священицьких родин з тією самою проблемою відсторонили від священства, доки не постане священик «із урімом і туммімом»."
    - "Місце невідоме. Інші назви, Тель-Мелах, «пагорб солі», і Тель-Харша, натякають на зруйновані городища, які вавилоняни заселили депортованими, як і Тел-Авів Єзекіїля біля річки Хебар, і вавилонські таблички VI–V ст. до н. е. показують юдеїв, що жили в таких селах у центральному і південному Вавилоні. Чи Херув, Аддан та Іммер — три місця чи одне, і чи Іммер тут пов’язаний зі священицьким родом із таким іменем, вирішити не можна; Синодальна Біблія по-різному з’єднує ці назви в Ездри та в Неемії. Більше нічого невідомо."
  es:
    - "Imer es uno de los lugares de Babilonia de los que regresó con Zorobabel un grupo de desterrados, conocido solo por la lista de familias que volvieron: «Y estos fueron los que subieron de Tel-mela, Tel-harsa, Chêrub, Addan, é Immer, los cuales no pudieron mostrar la casa de sus padres, ni su linaje, si eran de Israel». Nehemías repite la lista. Estos repatriados, seiscientos cincuenta y dos en Esdras y seiscientos cuarenta y dos en Nehemías, no pudieron probar su ascendencia, pero se les siguió contando entre los que volvieron; unas pocas familias sacerdotales con el mismo problema fueron apartadas del sacerdocio hasta que hubiese sacerdote «con Urim y Thummim»."
    - "El sitio se ignora. Los otros nombres, Tel-mela, «montículo de sal», y Tel-harsa, sugieren montículos en ruinas que los babilonios repoblaron con deportados, como Tel-abib, junto al río Quebar, de Ezequiel, y tablillas babilónicas de los siglos VI y V a. C. muestran a judeos viviendo en aldeas así en el centro y el sur de Babilonia. Si Querub, Addán e Imer son tres lugares o uno, y si el Imer de aquí está vinculado a la familia sacerdotal de ese nombre, no puede decidirse; la Biblia sinodal une los nombres de manera distinta en Esdras y en Nehemías. No se sabe nada más."
  pt:
    - "Imer é um dos lugares da Babilônia de onde um grupo de exilados voltou com Zorobabel, conhecido apenas pela lista das famílias que retornaram: “Estes foram os que subiram de Tel-Melá, Tel-Harsa, Querube, Adã e Imer; mas eles não puderam provar as casas de seus pais e sua descendência, se eles eram de Israel”. Neemias repete a lista. Esses retornados, seiscentos e cinquenta e dois em Esdras e seiscentos e quarenta e dois em Neemias, não podiam provar sua descendência, mas ainda assim eram contados entre os que voltaram; algumas famílias sacerdotais com o mesmo problema foram afastadas do sacerdócio até que se levantasse um sacerdote “com o Urim e com o Tumim”."
    - "O sítio é desconhecido. Os outros nomes, Tel-Melá “monte de sal” e Tel-Harsa, sugerem montes em ruínas que os babilônios repovoaram com deportados, como foi o Tel-Abibe de Ezequiel junto ao rio Quebar, e tábuas babilônicas dos séculos VI e V a.C. mostram judeus vivendo em tais aldeias na Babilônia central e meridional. Se Querube, Adã e Imer são três lugares ou um, e se o Imer daqui se liga à família sacerdotal de mesmo nome, não se pode decidir; a Bíblia Sinodal une os nomes de modo diferente em Esdras e em Neemias. Nada mais se sabe."
  de:
    - "Immer ist einer der Orte in Babylonien, aus denen eine Gruppe von Verbannten mit Serubbabel zurückkehrte, nur aus der Liste der heimkehrenden Familien bekannt: „Und diese zogen auch mit herauf von Thel-Melah, Thel-Harsa, Cherub, Addon und Immer, aber sie konnten nicht anzeigen ihr Vaterhaus noch ihr Geschlecht, ob sie aus Israel wären“. Nehemia wiederholt die Liste. Diese Heimkehrer, bei Esra sechshundertzweiundfünfzig und bei Nehemia sechshundertzweiundvierzig, konnten ihre Abstammung nicht belegen, wurden aber doch zu den Heimgekehrten gezählt; einige Priesterfamilien mit demselben Problem blieben vom Priestertum ausgeschlossen, „bis ein Priester aufstände mit dem Licht und Recht“."
    - "Die Stätte ist unbekannt. Die anderen Namen, Tel-Melach „Salzhügel“ und Tel-Harscha, deuten auf Ruinenhügel, die die Babylonier mit Deportierten neu besiedelten, wie bei Hesekiels Tel-Abib am Fluss Kebar, und babylonische Tafeln des 6. und 5. Jahrhunderts v. Chr. zeigen Judäer in solchen Dörfern in Mittel- und Südbabylonien. Ob Kerub, Addan und Immer drei Orte oder einer sind und ob das Immer hier mit der gleichnamigen Priesterfamilie zusammenhängt, lässt sich nicht entscheiden; die Synodalübersetzung verbindet die Namen bei Esra und bei Nehemia unterschiedlich. Mehr ist nicht bekannt."
  fr:
    - "Immer est l’un des lieux de Babylonie d’où un groupe d’exilés revint avec Zorobabel, connu seulement par la liste des familles revenues, qui nomme ceux venus de Tel-Mélach, de Tel-Harscha, de Kérub, d’Addan et d’Immer, « et qui ne purent pas faire connaître leur maison paternelle et leur race, pour prouver qu’ils étaient d’Israël ». Néhémie répète la liste. Ces revenants, 652 chez Esdras et 642 chez Néhémie, ne purent prouver leur ascendance, mais ils furent quand même comptés parmi ceux qui revinrent ; quelques familles sacerdotales ayant le même problème furent écartées du sacerdoce jusqu’à ce qu’un sacrificateur « ait consulté l’urim et le thummim »."
    - "Le site est inconnu. Les autres noms, Tel-Mélach « tertre de sel » et Tel-Harscha, suggèrent des tertres en ruine que les Babyloniens repeuplèrent de déportés, comme le Tel-Abib d’Ézéchiel près du fleuve Kebar, et des tablettes babyloniennes des VIe et Ve siècles av. J.-C. montrent des Judéens vivant dans de tels villages du centre et du sud de la Babylonie. Que Kérub, Addan et Immer soient trois lieux ou un seul, et que l’Immer d’ici soit lié à la famille sacerdotale de ce nom, on ne peut le décider ; la Bible synodale joint les noms différemment chez Esdras et chez Néhémie. On ne sait rien de plus."
  pl:
    - "Immer to jedno z miejsc w Babilonii, z których grupa wygnańców wróciła z Zorobabelem, znane tylko z wykazu powracających rodzin: „wyszli z Telmelachu: Telcharsa, Cherub, Addam i Immer; ale nie mogli okazać domu ojców swoich, i nasienia swego, jeźli z Izraela byli”. Nehemiasz powtarza wykaz. Ci powracający, sześciuset pięćdziesięciu dwóch u Ezdrasza i sześciuset czterdziestu dwóch u Nehemiasza, nie mogli udowodnić swego pochodzenia, lecz nadal zaliczano ich do powracających; kilka rodzin kapłańskich z tym samym problemem odsunięto od kapłaństwa, dopóki nie powstanie kapłan „z Urym i z Tummim”."
    - "Miejsce jest nieznane. Inne nazwy, Tel-Melach „pagórek soli” i Tel-Charsza, sugerują ruiny pagórków, które Babilończycy zasiedlili deportowanymi, jak Tel-Abib nad rzeką Kebar u Ezechiela, a babilońskie tabliczki z VI i V w. p.n.e. pokazują Judejczyków mieszkających w takich wsiach w środkowej i południowej Babilonii. Czy Cherub, Addan i Immer to trzy miejsca, czy jedno, i czy Immer tutaj łączy się z rodziną kapłańską o tym imieniu, nie można rozstrzygnąć; Biblia synodalna łączy nazwy inaczej u Ezdrasza i inaczej u Nehemiasza. Nic więcej nie wiadomo."
  it:
    - "Immer è uno dei luoghi della Babilonia da cui un gruppo di esuli tornò con Zorobabele, noto solo dall’elenco delle famiglie rimpatriate: «quelli che tornarono da Tel-Melah, da Tel-Harsha, da Kerub-Addan, da Immer, e che non poterono indicare la loro casa patriarcale e la loro discendenza per provare ch’erano d’Israele». Neemia ripete l’elenco. Questi rimpatriati, seicentocinquantadue in Esdra e seicentoquarantadue in Neemia, non poterono provare la loro discendenza, ma furono comunque contati fra quelli che tornarono; alcune famiglie sacerdotali con lo stesso problema furono escluse dal sacerdozio finché si presentasse un sacerdote «con l’Urim e il Thummim»."
    - "Il sito è ignoto. Gli altri nomi, Tel-Mela «collina del sale» e Tel-Carsa, suggeriscono tell in rovina che i Babilonesi ripopolarono con deportati, come il Tel-Abib di Ezechiele presso il fiume Chebar, e tavolette babilonesi dei secoli VI e V a.C. mostrano Giudei che vivevano in tali villaggi nella Babilonia centrale e meridionale. Se Cherub, Addan e Immer siano tre luoghi o uno, e se Immer qui sia collegato alla famiglia sacerdotale con quel nome, non si può decidere; la Bibbia sinodale unisce i nomi in modo diverso in Esdra e in Neemia. Nulla di più si sa."
  nl:
    - "Immer is een van de plaatsen in Babylonië vanwaar een groep ballingen met Zerubbabel terugkeerde, alleen bekend uit de lijst van terugkerende families: “Dezen togen ook op van Tel-melah, Tel-harsa, Cherub, Addan en Immer; doch zij konden hunner vaderen huis en hun zaad niet bewijzen, of zij uit Israel waren”. Nehemia herhaalt de lijst. Deze terugkeerders, zeshonderd tweeënvijftig in Ezra en zeshonderd tweeënveertig in Nehemia, konden hun afkomst niet bewijzen, maar werden toch gerekend tot degenen die terugkeerden; enkele priesterfamilies met hetzelfde probleem werden van het priesterschap geweerd tot er een priester zou opstaan “met urim en met thummim”."
    - "De plaats is onbekend. De andere namen, Tel-Melach “heuvel van zout” en Tel-Charsa, wijzen op ruïneheuvels die de Babyloniërs met ontheemden herbevolkten, zoals Ezechiëls Tel-Abib aan de rivier de Kebar, en Babylonische tabletten uit de 6e en 5e eeuw v.Chr. tonen Judeeërs die in zulke dorpen in midden- en zuidelijk Babylonië woonden. Of Cherub, Addan en Immer drie plaatsen zijn of één, en of Immer hier verband houdt met het priestergeslacht van die naam, is niet te beslissen; de Synodale Bijbel verbindt de namen in Ezra en in Nehemia verschillend. Verder is niets bekend."
  cs:
    - "Imer je jedno z míst v Babylonii, odkud se skupina vyhnanců vrátila se Zerubábelem, známé jen ze seznamu vracejících se rodin: „Tito také byli, kteříž šli z Telmelach, Telcharsa, Cherub, Addan a Immer, ale nemohli ukázati domu otců svých a semene svého, že by z Izraele byli“. Nehemjáš seznam opakuje. Tito navrátilci, šest set padesát dva u Ezdráše a šest set čtyřicet dva u Nehemjáše, nemohli prokázat svůj původ, ale přesto byli počítáni mezi ty, kdo se vrátili; několik kněžských rodin se stejným problémem bylo vyloučeno z kněžství, dokud nestane kněz „s urim a thumim“."
    - "Poloha je neznámá. Ostatní jména, Tel-melach „pahorek soli“ a Tel-charša, naznačují zříceninové pahorky, které Babylóňané znovu osídlili deportovanými, jako byl Ezechielův Tel-abíb u řeky Kebar, a babylonské tabulky 6. a 5. stol. př. n. l. ukazují Judejce žijící v takových vesnicích ve střední a jižní Babylonii. Zda Kerúb, Addan a Imer jsou tři místa, nebo jedno, a zda je Imer zde spojen s kněžskou rodinou téhož jména, nelze rozhodnout; synodální Bible spojuje jména jinak v Ezdrášovi a v Nehemjášovi. Nic dalšího není známo."
