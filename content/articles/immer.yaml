body:
  en:
    - "Immer is one of the places in Babylonia from which a group of exiles returned with Zerubbabel, known only from the list of returning families: “these were they which went up from Tel-melah, Tel-harsa, Cherub, Addan, and Immer: but they could not shew their father's house, and their seed, whether they were of Israel”. Nehemiah repeats the list. These returnees, six hundred and fifty-two in Ezra and six hundred and forty-two in Nehemiah, could not prove their descent, but they were still counted among those who returned; a few priestly families with the same problem were put from the priesthood and barred from the most holy things until a priest should stand up “with Urim and with Thummim”."
    - "The site is unknown. The other names, Tel-melah “mound of salt” and Tel-harsha, suggest ruined mounds that the Babylonians resettled with deportees, as Ezekiel's Tel-abib by the river Chebar was, and Babylonian tablets of the sixth and fifth centuries BC show Judeans living in such villages in central and southern Babylonia. Whether Cherub, Addan and Immer are three places or one, and whether Immer here is linked to the priestly family of that name, cannot be decided; the Synodal Bible joins the names differently in Ezra and in Nehemiah. Nothing more is known."
  ru:
    - "Иммер — одно из мест в Вавилонии, откуда вернулась с Зоровавелем группа изгнанников; он известен только по списку возвратившихся семей: «И вот вышедшие из Тел-Мелаха, Тел-Харши, Херуб-Аддан-Иммера, которые не могли показать о поколении своем и о племени своем от Израиля ли они». Неемия повторяет список. Эти люди, шестьсот пятьдесят два по Ездре и шестьсот сорок два по Неемии, не смогли доказать своего происхождения, но их всё же причислили к возвратившимся; несколько священнических семей с той же бедой были отстранены от священства и не могли есть великих святынь, «доколе не восстанет священник с уримом и туммимом»."
    - "Место неизвестно. Другие имена, Тел-Мелах, «соляной холм», и Тел-Харша, указывают на заброшенные холмы, которые вавилоняне заселяли переселенцами, как Тел-Авив при реке Ховаре у Иезекииля, а вавилонские таблички VI–V веков до н. э. показывают Иудеев, живших в таких селениях в средней и южной Вавилонии. Три ли это места — Херув, Аддан и Иммер — или одно, и связан ли Иммер со священническим родом того же имени, решить нельзя; Синодальный перевод соединяет эти имена по-разному у Ездры и у Неемии. Больше ничего не известно."
  uk:
    - "Іммер — одне з місць у Вавилонії, звідки група вигнанців повернулася із Зоровавелем, відоме лише з переліку родин, що повернулися: «А оце ті, що вийшли з Телмелаха, Тел-харші, Херуб-Аддан-Іммера, та що не могли сказати про своє поколїннє й про своє племя — чи вони від Ізраїля». Неемія повторює перелік. Ці повернуті, шістсот п’ятдесят два в Ездри й шістсот сорок два в Неемії, не могли довести свого походження, але їх усе ж зарахували до тих, хто повернувся; кілька священицьких родин з тією самою проблемою відсторонили від священства й від найсвятішого, доки не постане священик «із урімом і туммімом»."
    - "Місце невідоме. Інші назви, Тель-Мелах, «пагорб солі», і Тель-Харша, натякають на зруйновані городища, які вавилоняни заселили депортованими, як і Тел-Авів Єзекіїля біля річки Хебар, і вавилонські таблички VI–V ст. до н. е. показують юдеїв, що жили в таких селах у центральному і південному Вавилоні. Чи Херув, Аддан та Іммер — три місця чи одне, і чи Іммер тут пов’язаний зі священицьким родом із таким іменем, вирішити не можна; Синодальна Біблія по-різному з’єднує ці назви в Ездри та в Неемії. Більше нічого невідомо."
  es:
    - "Imer es uno de los lugares de Babilonia de los que regresó con Zorobabel un grupo de desterrados, conocido solo por la lista de familias que volvieron: «Y estos fueron los que subieron de Tel-mela, Tel-harsa, Chêrub, Addan, é Immer, los cuales no pudieron mostrar la casa de sus padres, ni su linaje, si eran de Israel». Nehemías repite la lista. Estos repatriados, seiscientos cincuenta y dos en Esdras y seiscientos cuarenta y dos en Nehemías, no pudieron probar su ascendencia, pero se les siguió contando entre los que volvieron; unas pocas familias sacerdotales con el mismo problema fueron apartadas del sacerdocio y de las cosas santísimas hasta que hubiese sacerdote «con Urim y Thummim»."
    - "El sitio se ignora. Los otros nombres, Tel-mela, «montículo de sal», y Tel-harsa, sugieren montículos en ruinas que los babilonios repoblaron con deportados, como Tel-abib, junto al río Quebar, de Ezequiel, y tablillas babilónicas de los siglos VI y V a. C. muestran a judeos viviendo en aldeas así en el centro y el sur de Babilonia. Si Querub, Addán e Imer son tres lugares o uno, y si el Imer de aquí está vinculado a la familia sacerdotal de ese nombre, no puede decidirse; la Biblia sinodal une los nombres de manera distinta en Esdras y en Nehemías. No se sabe nada más."
  pt:
    - "Imer é um dos lugares da Babilônia de onde um grupo de exilados voltou com Zorobabel, conhecido apenas pela lista das famílias que retornaram: “Estes foram os que subiram de Tel-Melá, Tel-Harsa, Querube, Adã e Imer; mas eles não puderam provar as casas de seus pais e sua descendência, se eles eram de Israel”. Neemias repete a lista. Esses retornados, seiscentos e cinquenta e dois em Esdras e seiscentos e quarenta e dois em Neemias, não podiam provar sua descendência, mas ainda assim eram contados entre os que voltaram; algumas famílias sacerdotais com o mesmo problema foram afastadas do sacerdócio e das coisas sagradas até que se levantasse um sacerdote “com o Urim e com o Tumim”."
    - "O sítio é desconhecido. Os outros nomes, Tel-Melá “monte de sal” e Tel-Harsa, sugerem montes em ruínas que os babilônios repovoaram com deportados, como foi o Tel-Abibe de Ezequiel junto ao rio Quebar, e tábuas babilônicas dos séculos VI e V a.C. mostram judeus vivendo em tais aldeias na Babilônia central e meridional. Se Querube, Adã e Imer são três lugares ou um, e se o Imer daqui se liga à família sacerdotal de mesmo nome, não se pode decidir; a Bíblia Sinodal une os nomes de modo diferente em Esdras e em Neemias. Nada mais se sabe."
  de:
    - "Immer ist einer der Orte in Babylonien, aus denen eine Gruppe von Verbannten mit Serubbabel zurückkehrte, nur aus der Liste der heimkehrenden Familien bekannt: „Und diese zogen auch mit herauf von Thel-Melah, Thel-Harsa, Cherub, Addon und Immer, aber sie konnten nicht anzeigen ihr Vaterhaus noch ihr Geschlecht, ob sie aus Israel wären“. Nehemia wiederholt die Liste. Diese Heimkehrer, bei Esra sechshundertzweiundfünfzig und bei Nehemia sechshundertzweiundvierzig, konnten ihre Abstammung nicht belegen, wurden aber doch zu den Heimgekehrten gezählt; einige Priesterfamilien mit demselben Problem wurden vom Priestertum ausgeschlossen und durften nicht vom Hochheiligen essen, „bis ein Priester aufstände mit dem Licht und Recht“."
    - "Die Stätte ist unbekannt. Die anderen Namen, Tel-Melach „Salzhügel“ und Tel-Harscha, deuten auf Ruinenhügel, die die Babylonier mit Deportierten neu besiedelten, wie bei Hesekiels Tel-Abib am Fluss Kebar, und babylonische Tafeln des 6. und 5. Jahrhunderts v. Chr. zeigen Judäer in solchen Dörfern in Mittel- und Südbabylonien. Ob Kerub, Addan und Immer drei Orte oder einer sind und ob das Immer hier mit der gleichnamigen Priesterfamilie zusammenhängt, lässt sich nicht entscheiden; die Synodalübersetzung verbindet die Namen bei Esra und bei Nehemia unterschiedlich. Mehr ist nicht bekannt."
  fr:
    - "Immer est l’un des lieux de Babylonie d’où un groupe d’exilés revint avec Zorobabel, connu seulement par la liste des familles revenues, qui nomme ceux venus de Tel-Mélach, de Tel-Harscha, de Kérub, d’Addan et d’Immer, « et qui ne purent pas faire connaître leur maison paternelle et leur race, pour prouver qu’ils étaient d’Israël ». Néhémie répète la liste. Ces revenants, 652 chez Esdras et 642 chez Néhémie, ne purent prouver leur ascendance, mais ils furent quand même comptés parmi ceux qui revinrent ; quelques familles sacerdotales ayant le même problème furent écartées du sacerdoce et des choses très saintes jusqu’à ce qu’un sacrificateur « ait consulté l’urim et le thummim »."
    - "Le site est inconnu. Les autres noms, Tel-Mélach « tertre de sel » et Tel-Harscha, suggèrent des tertres en ruine que les Babyloniens repeuplèrent de déportés, comme le Tel-Abib d’Ézéchiel près du fleuve Kebar, et des tablettes babyloniennes des VIe et Ve siècles av. J.-C. montrent des Judéens vivant dans de tels villages du centre et du sud de la Babylonie. Que Kérub, Addan et Immer soient trois lieux ou un seul, et que l’Immer d’ici soit lié à la famille sacerdotale de ce nom, on ne peut le décider ; la Bible synodale joint les noms différemment chez Esdras et chez Néhémie. On ne sait rien de plus."
  pl:
    - "Immer to jedno z miejsc w Babilonii, z których grupa wygnańców wróciła z Zorobabelem, znane tylko z wykazu powracających rodzin: „wyszli z Telmelachu: Telcharsa, Cherub, Addam i Immer; ale nie mogli okazać domu ojców swoich, i nasienia swego, jeźli z Izraela byli”. Nehemiasz powtarza wykaz. Ci powracający, sześciuset pięćdziesięciu dwóch u Ezdrasza i sześciuset czterdziestu dwóch u Nehemiasza, nie mogli udowodnić swego pochodzenia, lecz nadal zaliczano ich do powracających; kilka rodzin kapłańskich z tym samym problemem odsunięto od kapłaństwa i od rzeczy najświętszych, dopóki nie powstanie kapłan „z Urym i z Tummim”."
    - "Miejsce jest nieznane. Inne nazwy, Tel-Melach „pagórek soli” i Tel-Charsza, sugerują ruiny pagórków, które Babilończycy zasiedlili deportowanymi, jak Tel-Abib nad rzeką Kebar u Ezechiela, a babilońskie tabliczki z VI i V w. p.n.e. pokazują Judejczyków mieszkających w takich wsiach w środkowej i południowej Babilonii. Czy Cherub, Addan i Immer to trzy miejsca, czy jedno, i czy Immer tutaj łączy się z rodziną kapłańską o tym imieniu, nie można rozstrzygnąć; Biblia synodalna łączy nazwy inaczej u Ezdrasza i inaczej u Nehemiasza. Nic więcej nie wiadomo."
  it:
    - "Immer è uno dei luoghi della Babilonia da cui un gruppo di esuli tornò con Zorobabele, noto solo dall’elenco delle famiglie rimpatriate: «quelli che tornarono da Tel-Melah, da Tel-Harsha, da Kerub-Addan, da Immer, e che non poterono indicare la loro casa patriarcale e la loro discendenza per provare ch’erano d’Israele». Neemia ripete l’elenco. Questi rimpatriati, seicentocinquantadue in Esdra e seicentoquarantadue in Neemia, non poterono provare la loro discendenza, ma furono comunque contati fra quelli che tornarono; alcune famiglie sacerdotali con lo stesso problema furono escluse dal sacerdozio e dalle cose santissime finché si presentasse un sacerdote «con l’Urim e il Thummim»."
    - "Il sito è ignoto. Gli altri nomi, Tel-Mela «collina del sale» e Tel-Carsa, suggeriscono tell in rovina che i Babilonesi ripopolarono con deportati, come il Tel-Abib di Ezechiele presso il fiume Chebar, e tavolette babilonesi dei secoli VI e V a.C. mostrano Giudei che vivevano in tali villaggi nella Babilonia centrale e meridionale. Se Cherub, Addan e Immer siano tre luoghi o uno, e se Immer qui sia collegato alla famiglia sacerdotale con quel nome, non si può decidere; la Bibbia sinodale unisce i nomi in modo diverso in Esdra e in Neemia. Nulla di più si sa."
  nl:
    - "Immer is een van de plaatsen in Babylonië vanwaar een groep ballingen met Zerubbabel terugkeerde, alleen bekend uit de lijst van terugkerende families: “Dezen togen ook op van Tel-melah, Tel-harsa, Cherub, Addan en Immer; doch zij konden hunner vaderen huis en hun zaad niet bewijzen, of zij uit Israel waren”. Nehemia herhaalt de lijst. Deze terugkeerders, zeshonderd tweeënvijftig in Ezra en zeshonderd tweeënveertig in Nehemia, konden hun afkomst niet bewijzen, maar werden toch gerekend tot degenen die terugkeerden; enkele priesterfamilies met hetzelfde probleem werden van het priesterschap geweerd en van het allerheiligste uitgesloten tot er een priester zou opstaan “met urim en met thummim”."
    - "De plaats is onbekend. De andere namen, Tel-Melach “heuvel van zout” en Tel-Charsa, wijzen op ruïneheuvels die de Babyloniërs met ontheemden herbevolkten, zoals Ezechiëls Tel-Abib aan de rivier de Kebar, en Babylonische tabletten uit de 6e en 5e eeuw v.Chr. tonen Judeeërs die in zulke dorpen in midden- en zuidelijk Babylonië woonden. Of Cherub, Addan en Immer drie plaatsen zijn of één, en of Immer hier verband houdt met het priestergeslacht van die naam, is niet te beslissen; de Synodale Bijbel verbindt de namen in Ezra en in Nehemia verschillend. Verder is niets bekend."
  cs:
    - "Imer je jedno z míst v Babylonii, odkud se skupina vyhnanců vrátila se Zerubábelem, známé jen ze seznamu vracejících se rodin: „Tito také byli, kteříž šli z Telmelach, Telcharsa, Cherub, Addan a Immer, ale nemohli ukázati domu otců svých a semene svého, že by z Izraele byli“. Nehemjáš seznam opakuje. Tito navrátilci, šest set padesát dva u Ezdráše a šest set čtyřicet dva u Nehemjáše, nemohli prokázat svůj původ, ale přesto byli počítáni mezi ty, kdo se vrátili; několik kněžských rodin se stejným problémem bylo vyloučeno z kněžství a z nejsvětějších věcí, dokud nestane kněz „s urim a thumim“."
    - "Poloha je neznámá. Ostatní jména, Tel-melach „pahorek soli“ a Tel-charša, naznačují zříceninové pahorky, které Babylóňané znovu osídlili deportovanými, jako byl Ezechielův Tel-abíb u řeky Kebar, a babylonské tabulky 6. a 5. stol. př. n. l. ukazují Judejce žijící v takových vesnicích ve střední a jižní Babylonii. Zda Kerúb, Addan a Imer jsou tři místa, nebo jedno, a zda je Imer zde spojen s kněžskou rodinou téhož jména, nelze rozhodnout; synodální Bible spojuje jména jinak v Ezdrášovi a v Nehemjášovi. Nic dalšího není známo."
  sv:
    - "Immer är en av platserna i Babylonien från vilka en grupp landsflyktiga återvände med Serubbabel, känd bara från förteckningen över de återvändande familjerna: ”dessa voro de som drogo åstad från Tel-Mela, Tel-Harsa, Kerub, Addan och Immer, men som icke kunde uppgiva sina familjer och sin släkt och huruvida de voro av Israel”. Nehemja upprepar förteckningen. Dessa återvändare, sexhundrafemtiotvå hos Esra och sexhundrafyrtiotvå hos Nehemja, kunde inte styrka sin härkomst, men de räknades ändå bland dem som återvänt; några prästsläkter med samma problem uteslöts ur prästadömet och förvägrades det högheliga tills en präst uppstod ”med urim och tummim”."
    - "Platsen är okänd. De andra namnen, Tel-Melach ”saltets kulle” och Tel-Harsha, antyder ruinkullar som babylonierna återbosatte med deporterade, liksom Hesekiels Tel-Abib vid floden Kebar, och babyloniska tavlor från 500- och 400-talen f.Kr. visar judéer bosatta i sådana byar i mellersta och södra Babylonien. Om Keruv, Addan och Immer är tre platser eller en, och om Immer här hänger samman med prästsläkten med samma namn, kan inte avgöras; den ryska synodalbibeln förenar namnen olika hos Esra och hos Nehemja. Inget mer är känt."
  nb:
    - "Immer er ett av stedene i Babylonia hvorfra en gruppe eksiler vendte tilbake med Serubabel, kjent bare fra listen over hjemvendte familier: «Og dette var de som drog hjem fra Tel-Melah, Tel-Harsa, Kerub, Addan og Immer, men ikke kunde opgi sin familie og sin ætt, eller om de var av Israel». Nehemja gjentar listen. Disse hjemvendte, seks hundre og to og femti hos Esra og seks hundre og to og førti hos Nehemja, kunne ikke bevise sin avstamning, men ble likevel regnet blant de hjemvendte; noen få prestefamilier med samme problem ble utelukket fra prestedømmet og avskåret fra det høyhellige til en prest skulle stå fram «med urim og tummim»."
    - "Stedet er ukjent. De andre navnene, Tel-Melah «saltets haug» og Tel-Harsja, antyder ruinhauger som babylonerne bosatte på nytt med deporterte, slik Esekiels Tel-Abib ved elven Kebar var, og babylonske tavler fra 500- og 400-tallet f.Kr. viser judeere som bodde i slike landsbyer i det sentrale og sørlige Babylonia. Om Kerub, Addan og Immer er tre steder eller ett, og om Immer her henger sammen med prestefamilien med det navnet, kan ikke avgjøres; den synodale bibelen forbinder navnene ulikt hos Esra og hos Nehemja. Ingenting mer er kjent."
  tl:
    - "Ang Immer ay isa sa mga lugar sa Babilonia na pinagmulan ng isang pangkat ng mga ipinatapon na bumalik kasama ni Zorobabel, na kilala lamang mula sa talaan ng mga angkang bumalik: “At ang mga ito ang nagsiahon mula sa Tel-mela, Tel-harsa, Cherub, Addan, at Immer: nguni't hindi nila naipakilala ang mga sangbahayan ng kanilang mga magulang, at ang kanilang binhi kung sila'y taga Israel”. Inuulit ito ni Nehemias. Ang mga bumalik na ito, animnaraan at limampu't dalawa sa Ezra at animnaraan at apatnapu't dalawa sa Nehemias, ay hindi nakapagpatunay ng kanilang angkan, ngunit binilang pa rin sa mga bumalik; ang ilang pamilyang saserdote na may gayunding suliranin ay inalis sa pagkasaserdote at pinagbawalan sa mga pinakabanal na bagay “hanggang sa tumayo ang isang saserdote na may Urim at Thummim”."
    - "Hindi alam ang lugar. Ang ibang pangalan, ang Tel-mela “burol ng asin” at Tel-harsa, ay nagpapahiwatig ng mga wasak na burol na muling tinirhan ng mga Babilonyo ng mga ipinatapon, gaya ng Tel-abib sa tabi ng ilog Chebar kay Ezekiel, at ipinakikita ng mga tableta ng Babilonya noong ika-6 at ika-5 siglo BK na nanirahan ang mga taga-Juda sa gayong mga nayon sa gitna at timog na Babilonia. Hindi mapagpasyahan kung ang Cherub, Addan at Immer ay tatlong lugar o isa, at kung ang Immer dito ay may kaugnayan sa pamilyang saserdote na may gayunding pangalan; magkaiba ang pagdurugtong ng Synodal Bible sa mga pangalan sa Ezra at sa Nehemias. Wala nang ibang alam."
  da:
    - "Immer er et af stederne i Babylonien, hvorfra en gruppe landflygtige vendte tilbage med Zerubbabel, kendt kun fra listen over hjemvendende slægter: »Og disse ere de som droge op fra Thel-Mela, Thel-Harsa, Kerub, Addan og Immer; men de kunde ikke angive deres Fædres Hus og deres Slægt, om de vare af Israel«. Nehemias gentager listen. Disse hjemvendte, 652 i Ezra og 642 i Nehemias, kunne ikke bevise deres afstamning, men de blev dog regnet blandt dem, der vendte tilbage; nogle få præsteslægter med det samme problem blev afvist fra præstedømmet og udelukket fra de højhellige ting, indtil en præst skulle stå »med Urim og med Thummim«."
    - "Stedet er ukendt. De andre navne, Tel-Melah, »saltets høj«, og Tel-Harsja, antyder ruinhøje, som babylonierne genbosatte med deporterede, som Ezekiels Tel-Abib ved floden Kebar var, og babylonske tavler fra 500-tallet og 400-tallet f.Kr. viser judæere, der bor i sådanne landsbyer i det centrale og sydlige Babylonien. Om Kerub, Addan og Immer er tre steder eller ét, og om Immer her har forbindelse til præsteslægten af samme navn, kan ikke afgøres; den russiske synodalbibel sammenføjer navnene forskelligt i Ezra og i Nehemias. Mere vides ikke."
  sr:
    - "Имир је једно од места у Вавилонији из којих се група изгнаника вратила са Зоровавељем, познато само из списка повратничких породица: „И ови пођоше из Тел-Мелеха и Тел-Арисе, Херув, Адан и Имир, али не могоше показати отачки дом свој и семе своје, еда ли су од Израиља“. Немија понавља списак. Ти повратници, шест стотина педесет и два у Јездри и шест стотина четрдесет и два у Немији, нису могли доказати своје порекло, али су се ипак убрајали међу оне који су се вратили; неколико свештеничких породица са истим проблемом било је одлучено од свештенства и ускраћено од најсветијег све док не настане свештеник „с Уримом и Тумимом“."
    - "Место је непознато. Остала имена, Тел-Мелех „хумка соли“ и Тел-Харса, указују на срушене хумке које су Вавилонци поново населили прогнаницима, као што је био Језекиљев Телавив поред реке Хевар, а вавилонске плочице из шестог и петог века п. н. е. показују Јудејце који живе у таквим селима у средњој и јужној Вавилонији. Да ли су Херув, Адан и Имир три места или једно, и да ли је Имир овде повезан са свештеничком породицом тог имена, не може се одлучити; руски синодски превод повезује имена различито у Јездри и у Немији. Ништа више се не зна."
  hu:
    - "Immer egyike azoknak a babiloni helyeknek, ahonnan a száműzöttek egy csoportja Zerubbábellel visszatért, és csak a hazatérő családok jegyzékéből ismerjük: „És ezek, a kik feljövének Tél-Melahból, Tél-Harsából, Kerub-Addán-Immérből, de nem mondhatták meg családjukat és eredetüket, hogy Izráel közül valók-é”. Nehémiás megismétli a jegyzéket. Ezek a hazatérők, Ezsdrásnál hatszázötvenkettő, Nehémiásnál hatszáznegyvenkettő, nem tudták igazolni származásukat, de a hazatérők között továbbra is számon tartották őket; néhány hasonló gonddal küzdő papi családot kizártak a papságból és a legszentebb dolgokból, amíg „pap ítél az Urimmal és Tummimmal”."
    - "A hely ismeretlen. A többi név, Tél-Melah, „a só halma”, és Tél-Harsa, romhalmokat sugall, amelyeket a babiloniak deportáltakkal népesítettek be újra, mint Ezékiel Tél-Ábibját a Kebár folyónál, és a Kr. e. 6. és 5. századi babiloni táblák Közép- és Dél-Babilóniában ilyen falvakban élő júdeaiakat mutatnak. Hogy Kerúb, Addan és Immer három hely-e vagy egy, és hogy az itteni Immer az azonos nevű papi családdal összefügg-e, nem dönthető el; a szinodális Biblia Ezsdrásban és Nehémiásban másképp kapcsolja össze a neveket. Mást nem tudunk."
  fi:
    - "Immer on yksi Babylonian paikoista, joista ryhmä pakkosiirtolaisia palasi Serubbabelin mukana, tunnettu vain palaavien sukujen luettelosta: ”Nämä olivat ne, jotka lähtivät Teel-Melahista, Teel-Harsasta, Kerub-Addanista ja Immeristä, voimatta ilmoittaa perhekuntaansa ja syntyperäänsä, olivatko israelilaisia”. Nehemia toistaa luettelon. Nämä palaajat, kuusisataa viisikymmentäkaksi Esrassa ja kuusisataa neljäkymmentäkaksi Nehemiassa, eivät voineet todistaa polveutumistaan, mutta heidät luettiin silti palanneiden joukkoon; muutama saman ongelman omaava pappissuku erotettiin papinvirasta ja estettiin syömästä korkeasti pyhää, ”ennenkuin nousisi pappi, joka voi hoitaa uurimia ja tummimia”."
    - "Paikka on tuntematon. Muut nimet, Tel-Mela ”suolakumpu” ja Tel-Harsa, viittaavat raunioituneisiin kumpuihin, joihin babylonialaiset asuttivat pakkosiirtolaisia, kuten Hesekielin Tel-Abib Kebar-joen varrella, ja babylonialaiset taulut 500- ja 400-luvuilta eaa. osoittavat juutalaisten asuneen tällaisissa kylissä Keski- ja Etelä-Babyloniassa. Onko Kerub, Addan ja Immer kolme paikkaa vai yksi, ja onko tämä Immer yhteydessä samannimiseen pappissukuun, ei voi ratkaista; synodaalinen Raamattu yhdistää nimet eri tavoin Esrassa ja Nehemiassa. Muuta ei tiedetä."
  vi:
    - "Y-mê là một trong những nơi ở Ba-by-lôn mà một nhóm người lưu đày trở về cùng Xô-rô-ba-bên, chỉ được biết từ bảng các gia tộc trở về: “Nầy là những người ở Tên-Mê-la. Tên-Hạt-sa, Kê-rúp-A-đan, và Y-mê trở lên, không thể nói rõ gia tộc và phổ hệ mình, đặng chỉ rằng mình thuộc về dòng dõi Y-sơ-ra-ên hay chăng”. Nê-hê-mi lặp lại bảng. Những người trở về này, 652 người trong E-xơ-ra và 642 người trong Nê-hê-mi, không thể chứng minh dòng dõi, nhưng vẫn được kể trong số những người trở về; vài gia đình thầy tế lễ cùng vấn đề bị truất khỏi chức tế lễ và cấm ăn vật chí thánh “cho đến chừng nào có thầy tế lễ cậy U-rim và Thu-mim mà cầu hỏi Đức Chúa Trời”."
    - "Địa điểm không được biết. Các tên khác, Tên-Mê-la “gò muối” và Tên-Ha-sa, gợi các gò đổ nát mà người Ba-by-lôn cho dân bị đày định cư lại, như Tên-A-bíp của Ê-xê-chi-ên bên sông Kê-ba, và các bảng đất sét Babylon thế kỷ 6 và 5 TCN cho thấy người Giu-đa sống trong các làng như vậy ở trung và nam Ba-by-lôn. Kê-rúp, A-đan và Y-mê là ba nơi hay một, và Y-mê ở đây có liên hệ với gia tộc thầy tế lễ cùng tên hay không, không quyết định được; bản Synodal nối các tên khác nhau trong E-xơ-ra và trong Nê-hê-mi. Không biết gì thêm."
  ro:
    - "Imer este unul dintre locurile din Babilonia din care un grup de exilați s-a întors cu Zorobabel, cunoscut doar din lista familiilor întoarse: „Și cei cari s’au suit dela Telmeleh, Telarisa, Heruv, Idan, Emir, și n’au putut să spue casa lor părintească și neamul lor, și dacă sunt din Israil”. Neemia repetă lista. Acești întorși, șase sute cincizeci și doi în Ezra și șase sute patruzeci și doi în Neemia, nu și-au putut dovedi descendența, dar erau totuși numărați printre cei întorși; câteva familii preoțești cu aceeași problemă au fost scoase din preoție și oprite de la lucrurile preasfinte până când avea să se ridice un preot „luminat și desăvârșit”."
    - "Locul este necunoscut. Celelalte nume, Tel-Melah, „movila de sare”, și Tel-Harșa, sugerează movile în ruină pe care babilonienii le-au repopulat cu deportați, așa cum a fost Tel-Abib de lângă râul Chebar al lui Ezechiel, iar tăblițe babiloniene din secolele al VI-lea și al V-lea î.Hr. arată iudei trăind în astfel de sate din Babilonia centrală și de sud. Dacă Cherub, Adan și Imer sunt trei locuri sau unul și dacă Imer de aici este legat de familia preoțească cu același nume nu se poate decide; Biblia sinodală unește numele diferit în Ezra și în Neemia. Nu se mai știe nimic."
  bg:
    - "Имер е едно от местата във Вавилония, от които група изгнаници се върна със Зоровавел, известно само от списъка на завръщащите се родове: „А тези бяха възлезлите от Тел-мелах, Тел-ариса, Херув, Адан, и Емир; и не могоха да покажат дома на отечествието си и семето си, да ли бяха от Израиля“. Неемия повтаря списъка. Тези завърнали се, шестстотин петдесет и двама според Ездра и шестстотин четиридесет и двама според Неемия, не можаха да докажат произхода си, но все пак бяха причислени към завърналите се; няколко свещенически рода със същия проблем бяха отстранени от свещенството и не им беше позволено да ядат от пресветите неща, докато не възстане свещеник „с Урим и Тумим“."
    - "Мястото не е известно. Другите имена, Тел-Мелах, „могила от сол“, и Тел-Харша, подсказват разрушени могили, които вавилонците заселваха с изселници, както беше Тел-Авив на Йезекиил при реката Ховар, а вавилонски плочки от VI и V в. пр.н.е. показват юдеи, живеещи в такива села в Средна и Южна Вавилония. Дали Херув, Адан и Имер са три места или едно и дали Имер тук е свързан със свещеническия род със същото име, не може да се реши; Синодалната Библия съединява имената различно в Ездра и в Неемия. Нищо повече не се знае."
