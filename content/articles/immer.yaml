# Overview article (ADR 0007). Mainstream facts only; Immer is an unlocated place in Babylonia; whether Cherub, Addan and Immer are one name or three is uncertain and the Synodal readings are noted.
id: immer
place: ae4d198
title:
  en: "Immer"
  ru: "Иммер"
body:
  en:
    - "Immer is one of the places in Babylonia from which a group of exiles returned with Zerubbabel, known only from the list of returning families: “these were they which went up from Tel-melah, Tel-harsa, Cherub, Addan, and Immer: but they could not shew their father's house, and their seed, whether they were of Israel”. Nehemiah repeats the list. These returnees, six hundred and fifty-two in Ezra and six hundred and forty-two in Nehemiah, could not prove their descent, but they were still counted among those who returned; a few priestly families with the same problem were kept from the priesthood until a priest should stand up “with Urim and with Thummim”."
    - "The site is unknown. The other names, Tel-melah “mound of salt” and Tel-harsha, suggest ruined mounds that the Babylonians resettled with deportees, as Ezekiel's Tel-abib by the river Chebar was, and Babylonian tablets of the sixth and fifth centuries BC show Judeans living in such villages in central and southern Babylonia. Whether Cherub, Addan and Immer are three places or one, and whether Immer here is linked to the priestly family of that name, cannot be decided; the Synodal Bible joins the names differently in Ezra and in Nehemiah. Nothing more is known."
  ru:
    - "Иммер — одно из мест в Вавилонии, откуда вернулась с Зоровавелем группа изгнанников; он известен только по списку возвратившихся семей: «И вот вышедшие из Тел-Мелаха, Тел-Харши, Херуб-Аддан-Иммера, которые не могли показать о поколении своем и о племени своем от Израиля ли они». Неемия повторяет список. Эти люди, шестьсот пятьдесят два по Ездре и шестьсот сорок два по Неемии, не смогли доказать своего происхождения, но их всё же причислили к возвратившимся; несколько священнических семей с той же бедой были отстранены от священства, «доколе не восстанет священник с уримом и туммимом»."
    - "Место неизвестно. Другие имена, Тел-Мелах, «соляной холм», и Тел-Харша, указывают на заброшенные холмы, которые вавилоняне заселяли переселенцами, как Тел-Авив при реке Ховаре у Иезекииля, а вавилонские таблички VI–V веков до н. э. показывают Иудеев, живших в таких селениях в средней и южной Вавилонии. Три ли это места — Херув, Аддан и Иммер — или одно, и связан ли Иммер со священническим родом того же имени, решить нельзя; Синодальный перевод соединяет эти имена по-разному у Ездры и у Неемии. Больше ничего не известно."
scripture:
