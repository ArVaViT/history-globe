# Overview article (ADR 0007). The land of Moriah of Gen 22: its link with the Temple hill (2 Chr 3:1, Josephus, rabbinic tradition) is shown beside the Samaritan Gerizim tradition and the ancient versions, without choosing. The mountain itself is mount-moriah.yaml.
