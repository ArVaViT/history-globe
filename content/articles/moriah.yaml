body:
  en:
    - "The land of Moriah is where God sent Abraham to offer his son: “get thee into the land of Moriah; and offer him there for a burnt offering upon one of the mountains which I will tell thee of.” After the ram was offered in Isaac's place, Abraham named the place Jehovah-jireh, and the saying grew up, “In the mount of the LORD it shall be seen.” Genesis gives no other clue to where the land lay, except that Abraham saw the place afar off on the third day of the journey."
    - "The only other Moriah in the Bible is the hill in Jerusalem where Solomon built the Temple, on the threshing floor bought by David, and Josephus says plainly that Abraham offered Isaac at the place where the Temple was later built; rabbinic tradition holds the same. The Samaritans place the offering on Mount Gerizim, and their Pentateuch reads the name with a sense of “vision”. The Greek Septuagint renders the phrase as “the high land”, and the Syriac Peshitta has “the land of the Amorites”, which some scholars have taken as a possible original reading; on that view Genesis need not point to a single mountain at all."
  ru:
    - "Земля Мориа — это место, куда Бог послал Авраама принести в жертву сына: «пойди в землю Мориа и там принеси его во всесожжение на одной из гор, о которой Я скажу тебе». Когда вместо Исаака был принесён овен, Авраам нарёк месту имя Иегова-ире, и возникла поговорка: «на горе Иеговы усмотрится». Других указаний на то, где лежала эта земля, Бытие не даёт, кроме того, что на третий день пути Авраам увидел это место издали."
    - "Единственное другое Мориа в Библии — холм в Иерусалиме, где Соломон построил храм, на гумне, купленном Давидом, и Иосиф Флавий прямо говорит, что Авраам принёс Исаака на том месте, где позже был построен храм; так же учит раввинское предание. Самаряне помещают жертвоприношение на горе Гаризим, а их Пятикнижие читает имя со значением «видения». Греческая Септуагинта передаёт выражение как «высокая земля», а сирийская Пешитта читает «земля аморреев», и некоторые учёные считали это возможным первоначальным чтением; при таком взгляде Бытие и не обязательно указывает на одну определённую гору."
  de:
    - "Das Land Morija ist der Ort, wohin Gott Abraham sandte, um seinen Sohn zu opfern: „Nimm Isaak, deinen einzigen Sohn, den du lieb hast, und gehe hin in das Land Morija und opfere ihn daselbst zum Brandopfer auf einem Berge, den ich dir sagen werde.“ Nachdem der Widder an Isaaks Stelle geopfert war, nannte Abraham den Ort „Der HERR sieht“ (Jehovah-jireh in der King-James-Bibel), und es entstand das Sprichwort: „Auf dem Berge, da der HERR sieht.“ Das Erste Buch Mose gibt keinen anderen Hinweis, wo das Land lag, außer dass Abraham am dritten Tag der Reise „die Stätte von ferne“ sah."
    - "Das einzige andere Morija in der Bibel ist der Hügel in Jerusalem, wo Salomo den Tempel baute, auf der Tenne, die David gekauft hatte, und Josephus sagt klar, Abraham habe Isaak dort geopfert, wo später der Tempel gebaut wurde; die rabbinische Überlieferung vertritt dasselbe. Die Samaritaner verlegen das Opfer auf den Berg Garizim, und ihr Pentateuch liest den Namen im Sinne von Erscheinung. Die griechische Septuaginta gibt den Ausdruck mit hohes Land wieder, und die syrische Peschitta hat Land der Amoriter, was manche Gelehrte als mögliche ursprüngliche Lesart angesehen haben; nach dieser Ansicht müsste das Erste Buch Mose überhaupt nicht auf einen einzelnen Berg weisen."
  fr:
    - "Le pays de Morija est celui où Dieu envoya Abraham offrir son fils : « va-t’en au pays de Morija, et là offre-le en holocauste sur l’une des montagnes que je te dirai. » Après que le bélier eut été offert à la place d’Isaac, Abraham nomma le lieu Jehova-Jiré, et le dicton s’établit : sur la montagne de l’Éternel il sera vu. La Genèse ne donne aucun autre indice sur l’emplacement du pays, sinon qu’Abraham aperçut le lieu de loin le troisième jour du voyage."
    - "Le seul autre Morija de la Bible est la colline de Jérusalem où Salomon bâtit le Temple, sur l’aire achetée par David, et Josèphe dit sans détour qu’Abraham offrit Isaac à l’endroit où le Temple fut bâti plus tard ; la tradition rabbinique le tient de même. Les Samaritains placent l’offrande sur le mont Garizim, et leur Pentateuque lit le nom avec un sens de « vision ». La Septante grecque rend l’expression par « la haute terre », et la Peshitta syriaque porte « le pays des Amorites », que certains savants ont tenu pour une leçon originelle possible ; dans cette vue, la Genèse n’aurait pas besoin de désigner une seule montagne."
  pt:
    - "A terra de Moriá é aonde Deus mandou Abraão para oferecer seu filho: “vá para a terra de Moriá. Ofereça-o ali como holocausto sobre um dos montes que eu lhe disser.” Depois que o carneiro foi oferecido no lugar de Isaque, Abraão chamou o lugar de “O SENHOR Proverá”, e surgiu o dito: “No monte do SENHOR se proverá.” O Gênesis não dá nenhuma outra pista de onde ficava a terra, exceto que Abraão viu o lugar de longe no terceiro dia da jornada."
    - "O único outro Moriá na Bíblia é a colina de Jerusalém onde Salomão construiu o Templo, na eira comprada por Davi, e Josefo diz claramente que Abraão ofereceu Isaque no lugar onde o Templo foi construído mais tarde; a tradição rabínica sustenta o mesmo. Os samaritanos situam a oferta no monte Gerizim, e seu Pentateuco lê o nome com o sentido de “visão”. A Septuaginta grega traduz a expressão como a terra alta, e a Peshitta siríaca traz a terra dos amorreus, que alguns estudiosos tomaram como possível leitura original; nesse entendimento, o Gênesis nem precisaria apontar para um único monte."
  it:
    - "Il paese di Moria è dove Dio mandò Abramo a offrire suo figlio: «Prendi ora il tuo figliuolo, il tuo unico, colui che ami, Isacco, e vattene nel paese di Moriah, e offrilo quivi in olocausto sopra uno dei monti che ti dirò». Dopo che l’ariete fu offerto al posto di Isacco, Abramo chiamò quel luogo Iehovah-jireh, e nacque il detto: «Al monte dell’Eterno sarà provveduto». La Genesi non dà altro indizio su dove si trovasse il paese, se non che Abramo vide il luogo da lontano il terzo giorno di viaggio."
    - "L’unico altro Moria della Bibbia è il colle di Gerusalemme dove Salomone costruì il Tempio, sull’aia comprata da Davide, e Giuseppe Flavio dice chiaramente che Abramo offrì Isacco nel luogo in cui fu poi costruito il Tempio; la tradizione rabbinica sostiene lo stesso. I Samaritani collocano l’offerta sul monte Gerizim, e il loro Pentateuco legge il nome nel senso di «visione». La Settanta greca rende l’espressione come «la terra alta», e la Peshitta siriaca ha «la terra degli Amorrei», che alcuni studiosi hanno considerato una possibile lettura originaria; secondo questa ipotesi la Genesi non dovrebbe affatto indicare un unico monte."
  nl:
    - "Het land Moria is waar God Abraham heen zond om zijn zoon te offeren: “ga heen naar het land Moria, en offer hem aldaar tot een brandoffer, op een van de bergen, dien Ik u zeggen zal.” Nadat de ram in Isaaks plaats was geofferd, noemde Abraham de plaats “De HEERE zal het voorzien!” (in de King James Version Jehovah-jireh), en het gezegde kwam op: “Op den berg des HEEREN zal het voorzien worden!” Genesis geeft geen andere aanwijzing waar het land lag, behalve dat Abraham de plaats op de derde dag van de reis van verre zag."
    - "De enige andere Moria in de Bijbel is de heuvel in Jeruzalem waar Salomo de Tempel bouwde, op de dorsvloer die David had gekocht, en Josephus zegt duidelijk dat Abraham Isaak offerde op de plaats waar later de Tempel werd gebouwd; de rabbijnse overlevering houdt hetzelfde aan. De Samaritanen plaatsen het offer op de berg Gerizim, en hun Pentateuch leest de naam met de betekenis ‘visioen’. De Griekse Septuaginta geeft de uitdrukking weer als “het hoge land”, en de Syrische Peshitta heeft “het land van de Amorieten”, wat sommige geleerden als een mogelijke oorspronkelijke lezing hebben beschouwd; in die opvatting hoeft Genesis helemaal niet naar één enkele berg te wijzen."
  pl:
    - "Ziemia Moria to miejsce, do którego Bóg posłał Abrahama, by ofiarował syna: „a idź do ziemi Moryja, i tam go ofiaruj na ofiarę paloną, na jednej górze, o którejć powiem”. Gdy baranka złożono w ofierze w miejsce Izaaka, Abraham nazwał to miejsce „Pan obmyśli” (hebrajskie Jahwe-Jire) i powstało powiedzenie: „Na górze Pańskiej będzie obmyślono”. Księga Rodzaju nie podaje innej wskazówki, gdzie leżała ta ziemia, poza tym, że Abraham ujrzał to miejsce z daleka trzeciego dnia podróży."
    - "Jedyną inną Morią w Biblii jest wzgórze w Jerozolimie, gdzie Salomon zbudował Świątynię, na bojowisku kupionym przez Dawida, a Józef Flawiusz mówi wprost, że Abraham ofiarował Izaaka w miejscu, gdzie później zbudowano Świątynię; tę samą tradycję ma literatura rabiniczna. Samarytanie umieszczają ofiarę na górze Garizim, a ich Pięcioksiąg czyta nazwę w znaczeniu „widzenia”. Grecka Septuaginta oddaje to wyrażenie jako „ziemia wyniosła”, a syryjska Peszitta ma „ziemia Amorytów”, co niektórzy uczeni uznali za możliwe pierwotne czytanie; według tego poglądu Księga Rodzaju wcale nie musi wskazywać jednej góry."
  uk:
    - "Земля Морія — це місце, куди Бог послав Авраама принести в жертву свого сина: «йди в Морія землю, та й принеси його там у всепаленнє-жертву на одній горі, що тобі речу». Після того як замість Ісаака принесли барана, Авраам дав місцю ім'я Єгова-Уре, і виникло приказування: «На горі Господа побачять». Інших ознак того, де лежала ця земля, Буття не дає, крім того, що третього дня подорожі Авраам побачив це місце здалеку."
    - "Єдина інша Морія в Біблії — пагорб в Єрусалимі, де Соломон збудував Храм, на току, купленому Давидом, і Йосиф Флавій прямо каже, що Авраам приносив Ісаака на місці, де згодом збудували Храм; так само вважає рабинська традиція. Самарійці розміщують жертвопринесення на горі Герезим, а їхнє П'ятикнижжя читає цю назву зі значенням «видіння». Грецька Септуагінта передає цю фразу як «висока земля», а сирійська Пешитта має «земля амореїв», що деякі вчені вважали можливим первісним прочитанням; за такого погляду Буття взагалі не обов'язково вказує на єдину гору."
  cs:
    - "Země Moria je místo, kam Bůh poslal Abrahama obětovat jeho syna: „jdi do země Moria; a obětuj ho tam v obět zápalnou na jedné hoře, o níž povím tobě.“ Poté, co byl beran obětován místo Izáka, nazval Abraham místo „Hospodin opatří“ (Jahve-jire) a vzniklo rčení: „Na hoře Hospodinově opatří se.“ Genesis nedává jiné stopy, kde země ležela, kromě toho, že Abraham spatřil místo zdaleka třetího dne cesty."
    - "Jediná další Moria v Bibli je návrší v Jeruzalémě, kde Šalomoun vystavěl chrám, na humně koupeném Davidem, a Josephus Flavius jasně říká, že Abraham obětoval Izáka na místě, kde byl později chrám vystavěn; totéž drží rabínská tradice. Samaritáni kladou oběť na horu Gerizim a jejich Pentateuch čte jméno ve smyslu „vidění“. Řecká Septuaginta vykládá spojení jako „vysoká země“ a syrská Pešitta má „země Amorejských“, což někteří badatelé pokládali za možné původní čtení; podle tohoto názoru by Genesis vůbec nemusela ukazovat na jedinou horu."
  es:
    - "La tierra de Moriah es adonde Dios envió a Abraham a ofrecer a su hijo: «vete á tierra de Moriah, y ofrécelo allí en holocausto sobre uno de los montes que yo te diré». Después de que se ofreciera el carnero en lugar de Isaac, Abraham puso al lugar el nombre de Jehová-jireh, y surgió el dicho de que en el monte del Señor se vería. El Génesis no da otra pista sobre dónde estaba la tierra, salvo que Abraham vio el lugar de lejos al tercer día del viaje."
    - "La única otra mención de Moriah en la Biblia es el monte de Jerusalén donde Salomón edificó el Templo, en la era comprada por David, y Josefo dice claramente que Abraham ofreció a Isaac en el lugar donde más tarde se edificó el Templo; la tradición rabínica sostiene lo mismo. Los samaritanos sitúan la ofrenda en el monte Gerizim, y su Pentateuco lee el nombre con un sentido de «visión». La Septuaginta griega traduce la expresión como «la tierra alta», y la Peshitta siríaca tiene «la tierra de los amorreos», lo cual algunos estudiosos han tomado por una posible lectura original; según esa opinión, el Génesis no tiene por qué apuntar a una sola montaña."
  sv:
    - "Moria land är dit Gud sände Abraham för att offra sin son: ”gå bort till Moria land, och offra honom där såsom brännoffer, på ett berg som jag skall säga dig.” Sedan väduren offrats i Isaks ställe gav Abraham platsen namnet HERREN utser, och ordspråket uppstod: ”Berget där HERREN låter se sig.” Första Moseboken ger inga andra ledtrådar till var landet låg, utom att Abraham såg platsen på långt håll på tredje dagen av färden."
    - "Det enda andra Moria i Bibeln är kullen i Jerusalem där Salomo byggde templet, på tröskplatsen som David köpte, och Josefus säger rakt ut att Abraham offrade Isak på den plats där templet senare byggdes; rabbinsk tradition håller detsamma. Samariterna förlägger offret till berget Gerisim, och deras Pentateuk läser namnet med en innebörd av ”syn”. Den grekiska Septuaginta återger frasen som ”det höga landet”, och den syriska Peshitta har ”amoréernas land”, vilket vissa forskare har tagit som en möjlig ursprunglig läsning; enligt den uppfattningen behöver Första Moseboken inte peka på ett enda berg alls."
