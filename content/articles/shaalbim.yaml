# Overview article (ADR 0007). Mainstream facts only; Selbit (Sha'alvim) is given as the usual identification, resting on the name; the Synodal gloss in Judges 1:35 is explained as the Greek translators' reading.
id: shaalbim
place: ae89331
title:
  en: "Shaalbim"
  ru: "Шаалвим"
body:
  en:
    - "Shaalbim, in Joshua Shaalabbin, was a town of Dan in the valley of Aijalon, where the road from the coast begins to climb toward Jerusalem. Joshua lists it with Aijalon and Ithlah among the towns of the tribe, but Dan could not take the valley: “the Amorites would dwell in mount Heres in Aijalon, and in Shaalbim: yet the hand of the house of Joseph prevailed, so that they became tributaries”. The Greek translators took the three names for common words, and the Synodal Bible keeps their gloss, “where the bears and the foxes are”, since Shaalbim recalls the Hebrew word for fox. Under Solomon the town belonged to the second of the twelve districts that fed the court, under Ben-dekar, “in Makaz, and in Shaalbim, and Beth-shemesh, and Elon-beth-hanan”, and Eliahba the Shaalbonite, one of David's mighty men, most likely came from here."
    - "The name survives at Selbit, a village site about 5 km north-west of Aijalon (Yalo) at the edge of the valley, and the identification is generally accepted; the map also notes Khirbet Salhab far to the north as a candidate with little support. In 1949 Eleazar Sukenik excavated at Selbit a synagogue of the Samaritans, with a mosaic floor and an inscription in Samaritan letters quoting the Song of the Sea, “The LORD shall reign for ever and ever”, evidence of a Samaritan community here in the Byzantine period, when Samaritans spread into the lowlands west of their mountain."
    - "Beside the ruin stands the religious kibbutz of Sha'alvim, founded in 1951 and named after the biblical town, in the Ayalon valley of central Israel near Latrun, where the main road from Tel Aviv to Jerusalem still climbs past the sites of Aijalon and Shaalbim."
  ru:
    - "Шаалвим, в книге Иисуса Навина Шаалаввин, был городом Дана в долине Аиалонской, где дорога от побережья начинает подниматься к Иерусалиму. Книга Иисуса Навина называет его вместе с Аиалоном и Ифлой среди городов колена, но Дан не смог взять долину: «И остались Аморреи жить на горе Херес где медведи и лисицы, в Аиалоне и Шаалвиме; но рука сынов Иосифовых одолела Аморреев, и сделались они данниками им». Слов «где медведи и лисицы» в еврейском тексте нет: греческие переводчики приняли имена за нарицательные слова, поскольку Шаалвим напоминает еврейское слово «лисица», и Синодальный перевод сохранил их пояснение. При Соломоне город входил во второй из двенадцати округов, кормивших двор, под началом Бен-Декера, «в Макаце и в Шаалбиме, в Вефсамисе и в Елоне и в Беф-Ханане», а Елияхба Шаалбонянин, один из храбрых Давида, скорее всего, был родом отсюда."
    - "Имя сохранилось в Сальбите, месте деревни примерно в 5 км к северо-западу от Аиалона (Яло) на краю долины, и отождествление общепринято; на карте отмечен и Хирбет-Сальхаб далеко на севере как кандидата с малой поддержкой. В 1949 году Элиэзер Сукеник раскопал в Сальбите синагогу самарян с мозаичным полом и надписью самарянскими буквами, приводящей слова песни у моря: «Господь будет царствовать вовеки и в вечность», — свидетельство самарянской общины здесь в византийское время, когда самаряне расселялись по низменностям к западу от своей горы."
    - "Рядом с развалинами стоит религиозный киббуц Шаалвим, основанный в 1951 году и названный по библейскому городу, в долине Аялон в центре Израиля близ Латруна, где главная дорога из Тель-Авива в Иерусалим и сегодня поднимается мимо мест Аиалона и Шаалвима."
