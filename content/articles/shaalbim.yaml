body:
  en:
    - "Shaalbim, in Joshua Shaalabbin, was a town of Dan in the valley of Aijalon, where the road from the coast begins to climb toward Jerusalem. Joshua lists it with Aijalon and Ithlah among the towns of the tribe, but Dan could not take the valley: “the Amorites would dwell in mount Heres in Aijalon, and in Shaalbim: yet the hand of the house of Joseph prevailed, so that they became tributaries”. The Greek translators added a gloss on the names, “where the bears and the foxes are”, since Shaalbim recalls the Hebrew word for fox, and the Synodal Bible keeps it. Under Solomon the town belonged to the second of the twelve districts that fed the court, under Ben-dekar, “in Makaz, and in Shaalbim, and Beth-shemesh, and Elon-beth-hanan”, and Eliahba the Shaalbonite, one of David's mighty men, most likely came from here."
    - "The name survives at Selbit, a village site about 5 km north-west of Aijalon (Yalo) at the edge of the valley, and the identification is generally accepted; the map also notes Khirbet Salhab far to the north as a candidate with little support. In 1949 Eleazar Sukenik excavated at Selbit a synagogue of the Samaritans, with a mosaic floor and an inscription in Samaritan letters quoting the Song of the Sea, “The LORD shall reign for ever and ever”, evidence of a Samaritan community here in the Byzantine period, when Samaritans spread into the lowlands west of their mountain."
    - "Beside the ruin stands the religious kibbutz of Sha'alvim, founded in 1951 and named after the biblical town, in the Ayalon valley of central Israel near Latrun, where the main road from Tel Aviv to Jerusalem still climbs past the sites of Aijalon and Shaalbim."
  ru:
    - "Шаалвим, в книге Иисуса Навина Шаалаввин, был городом Дана в долине Аиалонской, где дорога от побережья начинает подниматься к Иерусалиму. Книга Иисуса Навина называет его вместе с Аиалоном и Ифлой среди городов колена, но Дан не смог взять долину: «И остались Аморреи жить на горе Херес где медведи и лисицы, в Аиалоне и Шаалвиме; но рука сынов Иосифовых одолела Аморреев, и сделались они данниками им». Слов «где медведи и лисицы» в еврейском тексте нет: греческие переводчики добавили к именам это пояснение, поскольку Шаалвим напоминает еврейское слово «лисица», и Синодальный перевод сохранил его. При Соломоне город входил во второй из двенадцати округов, кормивших двор, под началом Бен-Декера, «в Макаце и в Шаалбиме, в Вефсамисе и в Елоне и в Беф-Ханане», а Елияхба Шаалбонянин, один из храбрых Давида, скорее всего, был родом отсюда."
    - "Имя сохранилось в Сальбите, месте деревни примерно в 5 км к северо-западу от Аиалона (Яло) на краю долины, и отождествление общепринято; на карте отмечен и Хирбет-Сальхаб далеко на севере как кандидата с малой поддержкой. В 1949 году Элиэзер Сукеник раскопал в Сальбите синагогу самарян с мозаичным полом и надписью самарянскими буквами, приводящей слова песни у моря: «Господь будет царствовать вовеки и в вечность», — свидетельство самарянской общины здесь в византийское время, когда самаряне расселялись по низменностям к западу от своей горы."
    - "Рядом с развалинами стоит религиозный киббуц Шаалвим, основанный в 1951 году и названный по библейскому городу, в долине Аялон в центре Израиля близ Латруна, где главная дорога из Тель-Авива в Иерусалим и сегодня поднимается мимо мест Аиалона и Шаалвима."
  uk:
    - "Шаалвім, у книзі Ісуса Навина Шаалаввін, було містом Дана в Аялонській долині, де дорога від узбережжя починає підніматися до Єрусалима. Ісус Навин перелічує його з Аялоном та Іфлою серед міст коліна, але Дан не зміг узяти долини: «остались Аморії на горі Херес, в Аялонї й у Саалбимі. Як почав же брати над ними гору дом Йосифів, поробились вони крепаками». Грецькі перекладачі додали до назв тлумачення «де ведмеді й лисиці», бо Шаалвім нагадує івритське слово «лисиця», і Синодальна Біблія його зберігає. За Соломона місто належало до другого з дванадцяти округів, що годували двір, під Бен-Декером, «в Маказї й в Шаалбимі й в Бетсамисї й в Елонї й в Бетхананї», і Еліяхба Шаалбонянин, один із могутніх Давида, найімовірніше походив звідси."
    - "Назва збереглася в Сельбіті, на місці села приблизно за 5 км на північний захід від Аялона (Яло) на краю долини, і ототожнення загальноприйняте; карта згадує також Хірбет-Салхаб далеко на півночі як кандидата з малою підтримкою. У 1949 р. Елеазар Сукенік розкопав у Сельбіті синагогу самарян, із мозаїчною підлогою та написом самарянськими літерами, що цитує Пісню на морі, про вічне царювання Господа (Вих. 15:18), свідчення самарянської громади тут у візантійський період, коли самаряни поширилися на низовини на захід від своєї гори."
    - "Поряд із руїною стоїть релігійний кібуц Шаалвім, заснований у 1951 р. і названий за біблійним містом, в Аялонській долині в центральному Ізраїлі поблизу Латруна, де головна дорога з Тель-Авіва до Єрусалима й досі піднімається повз місця Аялона та Шаалвіма."
  es:
    - "Saalbim, en Josué Saalabín, era una ciudad de Dan en el valle de Ajalón, donde el camino de la costa empieza a subir hacia Jerusalén. Josué la enumera con Ajalón e Itla entre las ciudades de la tribu, pero Dan no pudo tomar el valle: «Y quiso el Amorrheo habitar en el monte de Heres, en Ajalón y en Saalbín; mas como la mano de la casa de José tomó fuerzas, hiciéronlos tributarios». Los traductores griegos añadieron una glosa a los nombres, «donde están los osos y las zorras», pues Saalbim recuerda la palabra hebrea para zorra, y la Biblia sinodal la conserva. Bajo Salomón la ciudad pertenecía al segundo de los doce distritos que abastecían la corte, a cargo de Ben-decar, «en Maccas, y en Saalbim, y en Beth-semes, y en Elón, y en Beth-hanan», y Eliaba el saalbonita, uno de los valientes de David, procedía muy probablemente de aquí."
    - "El nombre sobrevive en Selbit, un yacimiento de aldea a unos 5 km al noroeste de Ajalón (Yalo), en el borde del valle, y la identificación es generalmente aceptada; el mapa señala también Khirbet Salhab, muy al norte, como candidato con poco apoyo. En 1949 Eleazar Sukenik excavó en Selbit una sinagoga de los samaritanos, con suelo de mosaico y una inscripción en letras samaritanas que cita el Cántico del Mar, «Jehová reinará por los siglos de los siglos», prueba de una comunidad samaritana aquí en el período bizantino, cuando los samaritanos se extendieron por las tierras bajas al oeste de su monte."
    - "Junto a las ruinas se alza el kibutz religioso de Sha'alvim, fundado en 1951 y que lleva el nombre de la ciudad bíblica, en el valle de Ayalón, en el centro de Israel, cerca de Latrun, donde la carretera principal de Tel Aviv a Jerusalén aún sube junto a los lugares de Ajalón y Saalbim."
  pt:
    - "Saalabim era uma cidade de Dã no vale de Aijalom, onde a estrada da costa começa a subir em direção a Jerusalém. Josué a lista com Aijalom e Itla entre as cidades da tribo, mas Dã não pôde tomar o vale: “os amorreus persistiram em habitar no monte Heres, em Aijalom e em Saalabim. Contudo, a mão da casa de José prevaleceu, de modo que eles foram sujeitos a trabalhos forçados”. Os tradutores gregos acrescentaram uma glosa aos nomes, “onde estão os ursos e as raposas”, já que Saalabim lembra a palavra hebraica para raposa, e a Bíblia Sinodal a conserva. Sob Salomão a cidade pertencia ao segundo dos doze distritos que alimentavam a corte, sob Ben-Dequer, “em Macaz, em Saalabim, Bete-Semes e Elom-Bete-Hanã”, e Eliaba, o saalbonita, um dos valentes de Davi, muito provavelmente era daqui."
    - "O nome sobrevive em Selbit, um sítio de aldeia a cerca de 5 km a noroeste de Aijalom (Yalo), na orla do vale, e a identificação é geralmente aceita; o mapa anota também Khirbet Salhab, bem ao norte, como candidato de pouco apoio. Em 1949 Eleazar Sukenik escavou em Selbit uma sinagoga dos samaritanos, com piso de mosaico e uma inscrição em letras samaritanas citando o Cântico do Mar, “O SENHOR reinará para todo o sempre”, prova de uma comunidade samaritana aqui no período bizantino, quando os samaritanos se espalharam pelas terras baixas a oeste de seu monte."
    - "Ao lado da ruína fica o kibutz religioso de Sha'alvim, fundado em 1951 e nomeado em honra da cidade bíblica, no vale de Ayalon, no centro de Israel, perto de Latrun, onde a estrada principal de Tel Aviv a Jerusalém ainda sobe passando pelos locais de Aijalom e Saalabim."
  de:
    - "Schaalbim, bei Josua Schaalabbin, war eine Stadt Dans im Tal von Ajalon, wo die Straße von der Küste nach Jerusalem anzusteigen beginnt. Josua führt es mit Ajalon und Jitla unter den Städten des Stammes auf, doch Dan konnte das Tal nicht einnehmen: „die Amoriter blieben wohnen auf dem Gebirge Heres, zu Ajalon und Saalbim. Doch ward ihnen die Hand des Hauses Joseph zu schwer, und wurden zinsbar“. Die griechischen Übersetzer fügten den Namen eine Deutung hinzu, „wo die Bären und die Füchse sind“, da Schaalbim an das hebräische Wort für Fuchs erinnert, und die russische Synodalübersetzung behält sie bei. Unter Salomo gehörte die Stadt zum zweiten der zwölf Versorgungsbezirke, unter Ben-Deker, „zu Makaz und zu Saalbim und zu Beth-Semes und zu Elon und Beth-Hanan“, und Eljachba der Schaalboniter, einer von Davids Helden, stammte höchstwahrscheinlich von hier."
    - "Der Name überlebt in Selbit, einer Dorfstätte etwa 5 km nordwestlich von Ajalon (Yalo) am Rand des Tals, und die Gleichsetzung wird allgemein anerkannt; die Karte vermerkt auch Chirbet Salhab weit im Norden als Kandidaten mit wenig Rückhalt. Im Jahr 1949 grub Eleazar Sukenik in Selbit eine Synagoge der Samaritaner aus, mit Mosaikboden und einer Inschrift in samaritanischen Buchstaben, die das Lied am Meer zitiert, „Der HERR wird König sein immer und ewig“, ein Beleg für eine samaritanische Gemeinde hier in byzantinischer Zeit, als sich die Samaritaner im Tiefland westlich ihres Berges ausbreiteten."
    - "Neben der Ruine steht der religiöse Kibbuz Scha'alwim, 1951 gegründet und nach der biblischen Stadt benannt, im Ajalon-Tal in Mittelisrael nahe Latrun, wo die Hauptstraße von Tel Aviv nach Jerusalem noch immer an den Stätten von Ajalon und Schaalbim vorbei ansteigt."
  fr:
    - "Schaalbim, Schaalabbin chez Josué, était une ville de Dan dans la vallée d’Ajalon, là où la route de la côte commence à monter vers Jérusalem. Josué la cite avec Ajalon et Jithla parmi les villes de la tribu, mais Dan ne put prendre la vallée : « Les Amoréens voulurent rester à Har-Hérès, à Ajalon et à Schaalbim ; mais la main de la maison de Joseph s’appesantit sur eux, et ils furent assujettis à un tribut ». Les traducteurs grecs ont ajouté aux noms une glose, « où sont les ours et les renards », puisque Schaalbim rappelle le mot hébreu pour renard, et la Bible synodale russe la garde. Sous Salomon, la ville relevait du deuxième des douze districts qui nourrissaient la cour, sous le fils de Déker, « à Makats, à Saalbim, à Beth-Schémesch, à Élon et à Beth-Hanan », et Éliachba de Schaalbon, l’un des vaillants de David, venait très probablement d’ici."
    - "Le nom survit à Selbit, site d’un village à environ 5 km au nord-ouest d’Ajalon (Yalo) au bord de la vallée, et l’identification est généralement admise ; la carte note aussi Khirbet Salhab, très au nord, comme candidat peu soutenu. En 1949, Eleazar Sukenik fouilla à Selbit une synagogue samaritaine, avec un sol de mosaïque et une inscription en lettres samaritaines citant le Cantique de la mer, « L’Éternel régnera éternellement et à toujours », preuve d’une communauté samaritaine ici à l’époque byzantine, quand les Samaritains se répandirent dans les basses terres à l’ouest de leur montagne."
    - "À côté de la ruine se dresse le kibboutz religieux de Sha‘alvim, fondé en 1951 et nommé d’après la ville biblique, dans la vallée d’Ayalon, au centre d’Israël, près de Latroun, où la grande route de Tel-Aviv à Jérusalem monte encore devant les sites d’Ajalon et de Schaalbim."
  it:
    - "Saalbim, in Giosuè Saalabbin, era una città di Dan nella valle di Aialon, dove la strada dalla costa comincia a salire verso Gerusalemme. Giosuè la elenca con Aialon e Itla tra le città della tribù, ma Dan non poté prendere la valle: «Gli Amorei si mostrarono decisi a restare a Har-Heres, ad Aialon ed a Shaalbim; ma la mano della casa di Giuseppe si aggravò su loro sì che furon soggetti a servitù». I traduttori greci aggiunsero ai nomi una glossa, «dove sono gli orsi e le volpi», poiché Saalbim richiama la parola ebraica per volpe, e la Bibbia sinodale la conserva. Sotto Salomone la città apparteneva al secondo dei dodici distretti che rifornivano la corte, sotto Ben-Deker, «a Makats, a Shaalbim, a Beth-Scemesh, a Elon di Beth-Hanan», e Eliacba lo Saalbonita, uno dei prodi di Davide, veniva molto probabilmente da qui."
    - "Il nome sopravvive a Selbit, un sito di villaggio circa 5 km a nord-ovest di Aialon (Yalo) al margine della valle, e l’identificazione è generalmente accettata; la mappa nota anche Khirbet Salhab, molto più a nord, come candidato con scarso sostegno. Nel 1949 Eleazar Sukenik scavò a Selbit una sinagoga dei Samaritani, con un pavimento a mosaico e un’iscrizione in lettere samaritane che cita il Cantico del mare, «L’Eterno regnerà per sempre, in perpetuo», prova di una comunità samaritana qui in epoca bizantina, quando i Samaritani si diffusero nelle pianure a ovest del loro monte."
    - "Accanto alla rovina sorge il kibbutz religioso di Sha’alvim, fondato nel 1951 e intitolato alla città biblica, nella valle dell’Ayalon nel centro di Israele presso Latrun, dove la strada principale da Tel Aviv a Gerusalemme sale ancora oltre i siti di Aialon e di Saalbim."
  pl:
    - "Szaalbim, w Księdze Jozuego Szaalabbin, było miastem Dana w dolinie Ajjalonu, gdzie droga znad wybrzeża zaczyna wspinać się ku Jerozolimie. Jozue wymienia je z Ajjalonem i Itlą wśród miast pokolenia, lecz Dan nie zdołał zająć doliny: „począł mieszkać Amorejczyk na górze Hares, w Ajalon i w Salebim; i wzmocniła się ręka domu Józefowego, i byli hołdownikami ich”. Greccy tłumacze dodali do nazw glosę „gdzie niedźwiedzie i lisy”, bo Szaalbim przypomina hebrajskie słowo na lisa, a Biblia synodalna ją zachowuje. Za Salomona miasto należało do drugiego z dwunastu okręgów zaopatrujących dwór, pod Ben-Dekarem, „w Makas, i w Salbim, i w Betsames, i w Elon i Bethanan”, a Eliachba Szaalbończyk, jeden z dzielnych mężów Dawida, najpewniej stąd pochodził."
    - "Nazwa przetrwała w Selbit, stanowisku wsi około 5 km na północny zachód od Ajjalonu (Jalo) na skraju doliny, i utożsamienie jest powszechnie przyjmowane; mapa odnotowuje też Chirbet Salhab daleko na północy jako kandydata o niewielkim poparciu. W 1949 roku Eleazar Sukenik odkopał w Selbit synagogę Samarytan z posadzką mozaikową i napisem samarytańskim pismem cytującym Pieśń nad Morzem, „Pan królować będzie na wieki wieczne”, świadectwo wspólnoty samarytańskiej tu w okresie bizantyńskim, gdy Samarytanie rozprzestrzenili się na nizinach na zachód od swej góry."
    - "Obok ruiny stoi religijny kibuc Szaalwim, założony w 1951 roku i nazwany od biblijnego miasta, w dolinie Ajalon w środkowym Izraelu koło Latrun, gdzie główna droga z Tel Awiwu do Jerozolimy wciąż wspina się obok miejsc Ajjalonu i Szaalbim."
  cs:
    - "Šaalbim, v Jozuovi Šaalabbin, bylo město Danovo v údolí Ajalon, kde cesta od pobřeží začíná stoupat k Jeruzalému. Jozue je uvádí s Ajalonem a Jitlou mezi městy pokolení, ale Dan nemohl údolí dobýt: „počal Amorejský svobodně bydliti na hoře Heres, v Aialon a v Salbim, ale když se zsilila ruka čeledi Jozefovy, uvedeni jsou pod plat“. Řečtí překladatelé připojili ke jménům výklad „kde jsou medvědi a lišky“, neboť Šaalbim připomíná hebrejské slovo pro lišku, a synodální Bible jej zachovává. Za Šalomouna město patřilo ke druhému z dvanácti okresů zásobujících dvůr, pod Ben-dekerem, „v Makaz a v Salbim, a v Betsemes a v Elon Betchanan“, a Eliachba Šaalbonský, jeden z Davidových hrdinů, pocházel nejspíš odtud."
    - "Jméno přežívá v Selbítu, místě vesnice asi 5 km severozápadně od Ajalonu (Jalo) na okraji údolí, a ztotožnění je obecně přijímáno; mapa uvádí i Chirbet Salhab daleko na severu jako kandidáta s malou podporou. Roku 1949 vykopal Eleazar Sukenik v Selbítu synagogu Samařanů s mozaikovou podlahou a nápisem samařským písmem citujícím Píseň o moři, „Hospodin kralovati bude na věky věků“, doklad samařské obce zde v byzantské době, kdy se Samařané šířili do nížin západně od své hory."
    - "Vedle zříceniny stojí náboženský kibuc Ša'alvim, založený roku 1951 a pojmenovaný po biblickém městě, v údolí Ajalon ve středním Izraeli poblíž Latrunu, kde hlavní silnice z Tel Avivu do Jeruzaléma dosud stoupá kolem míst Ajalonu a Šaalbimu."
  nl:
    - "Saälbim, bij Jozua Saälabbin, was een stad van Dan in de vallei van Ajalon, waar de weg van de kust naar Jeruzalem begint te stijgen. Jozua noemt het met Ajalon en Jitla onder de steden van de stam, maar Dan kon de vallei niet innemen: “Ook wilden de Amorieten wonen op het gebergte van Heres, te Ajalon, en te Saalbim; maar de hand van het huis van Jozef werd zwaar, zodat zij cijnsbaar werden”. De Griekse vertalers voegden aan de namen een glosse toe, “waar de beren en de vossen zijn”, aangezien Saälbim aan het Hebreeuwse woord voor vos doet denken, en de Synodale Bijbel bewaart die. Onder Salomo hoorde de stad bij het tweede van de twaalf districten die het hof voedden, onder Ben-Deker, “in Makaz, en in Saalbim, en Beth-Semes, en Elon-Beth-hanan”, en Eljachba de Saälboniet, een van Davids helden, kwam waarschijnlijk van hier."
    - "De naam leeft voort in Selbit, een dorpsplaats zo’n 5 km ten noordwesten van Ajalon (Yalo) aan de rand van de vallei, en de identificatie wordt algemeen aanvaard; de kaart noteert ook Khirbet Salhab ver naar het noorden als kandidaat met weinig steun. In 1949 groef Eleazar Sukenik te Selbit een synagoge van de Samaritanen op, met een mozaïekvloer en een opschrift in Samaritaanse letters dat het Lied van de Zee aanhaalt, “De HEERE zal in eeuwigheid en geduriglijk regeren!”, bewijs van een Samaritaanse gemeenschap hier in de Byzantijnse tijd, toen de Samaritanen zich verspreidden over het laagland ten westen van hun berg."
    - "Naast de ruïne staat de religieuze kibboets Sha’alvim, gesticht in 1951 en genoemd naar de bijbelse stad, in de vallei van Ayalon in centraal Israël bij Latrun, waar de hoofdweg van Tel Aviv naar Jeruzalem nog steeds langs de plaatsen van Ajalon en Saälbim omhoogklimt."
  sv:
    - "Shaalbim, i Josua Saalabbin, var en stad i Dan i Ajalondalen, där vägen från kusten börjar stiga mot Jerusalem. Josua förtecknar den med Ajalon och Jitla bland stammens städer, men Dan kunde inte ta dalen: ”amoréerna förmådde hålla sig kvar i Har-Heres, Ajalon och Saalbim; men Josefs barns hand blev tung över dem, så att de blevo arbetspliktiga under dessa”. De grekiska översättarna lade till en glosa till namnen, ”där björnarna och rävarna finns”, eftersom Shaalbim erinrar om det hebreiska ordet för räv, och den synodala bibeln behåller den. Under Salomo hörde staden till det andra av de tolv distrikten som försörjde hovet, under Ben-Deker, ”i Makas, Saalbim, Bet-Semes, Elon, Bet-Hanan”, och Eljachba saalboniten, en av Davids hjältar, kom sannolikt härifrån."
    - "Namnet överlever vid Selbit, en bosättningsplats cirka 5 km nordväst om Ajalon (Yalo) i dalens kant, och identifikationen är allmänt godtagen; kartan noterar också Khirbet Salhab långt i norr som en kandidat med litet stöd. År 1949 grävde Eleasar Sukenik vid Selbit ut en samarisk synagoga, med mosaikgolv och en inskription med samariska bokstäver som citerar Havssången, ”HERREN är konung alltid och evinnerligen”, belägg för ett samariskt samfund här under bysantinsk tid, då samarierna spred sig i låglandet väster om sitt berg."
    - "Bredvid ruinen ligger den religiösa kibbutzen Sha'alvim, grundad 1951 och uppkallad efter den bibliska staden, i Ayalondalen i centrala Israel nära Latrun, där huvudvägen från Tel Aviv till Jerusalem ännu stiger förbi platserna för Ajalon och Shaalbim."
  nb:
    - "Sjaalbim, i Josva Sa'alabbin, var en by i Dan i Ajalon-dalen, der veien fra kysten begynner å stige mot Jerusalem. Josva oppfører den sammen med Ajalon og Jitla blant stammens byer, men Dan kunne ikke ta dalen: «Det lyktes amorittene å bli boende i Har-Heres, i Ajalon og i Sa'albim; men Josefs barns hånd lå tungt på dem, og de blev arbeidspliktige». De greske oversetterne la til en glose til navnene, «hvor bjørnene og revene er», siden Sjaalbim minner om det hebraiske ordet for rev, og den synodale bibelen beholder den. Under Salomo hørte byen til det andre av de tolv distriktene som forsynte hoffet, under Ben-Dekar, «i Makas og Sa'albim og Bet-Semes og Elon-Bet-Hanan», og Eljahba fra Saalbon, en av Davids helter, kom mest sannsynlig herfra."
    - "Navnet overlever ved Selbit, et landsbysted omtrent 5 km nordvest for Ajalon (Yalo) i kanten av dalen, og identifikasjonen er alminnelig godtatt; kartet nevner også Khirbet Salhab langt mot nord som en kandidat med lite støtte. I 1949 gravde Eleazar Sukenik ved Selbit ut en samaritansk synagoge, med mosaikkgulv og en inskripsjon med samaritanske bokstaver som siterer Havsangen, «Herren skal være konge i all evighet», bevis på et samaritansk samfunn her i bysantinsk tid, da samaritanene spredte seg i lavlandet vest for fjellet sitt."
    - "Ved siden av ruinen ligger den religiøse kibbutzen Sha'alvim, grunnlagt i 1951 og oppkalt etter den bibelske byen, i Ayalon-dalen i det sentrale Israel nær Latrun, der hovedveien fra Tel Aviv til Jerusalem fortsatt stiger forbi stedene Ajalon og Sjaalbim."
  tl:
    - "Ang Saalbim, Saalabbin sa Josue, ay bayan ng Dan sa libis ng Ajalon, kung saan nagsisimulang umakyat ang daan mula baybayin tungong Jerusalem. Inililista ito ni Josue kasama ng Ajalon at Jeth-la sa bayan ng lipi, ngunit hindi nakuha ng Dan ang libis: “inibig ng mga Amorrheo na tumahan sa bundok ng Heres, sa Ajalon, at sa Saalbin: gayon ma'y nanaig ang kamay ng sangbahayan ni Jose, na anopa't sila'y naging mga tagapagpaatag”. Dinagdagan ng mga tagasalin na Griyego ang mga pangalan ng paliwanag, “kung saan naroon ang mga oso at mga soro”, dahil kahawig ng salitang Hebreo para sa soro ang Saalbim, pinananatili ito ng Bibliyang Sinodal. Sa ilalim ni Salomon, kabilang ito sa ikalawa sa 12 distritong panustos ng korte, sa ilalim ni Ben-dacer, “sa Maccas, at sa Saalbim, at sa Beth-semes, at sa Elonbeth-hanan”, at malamang taga rito si Eliahba na Saalbonita, isa sa mga makapangyarihan ni David."
    - "Nananatili ang pangalan sa Selbit, isang lugar ng nayon na mga 5 km sa hilagang-kanluran ng Ajalon (Yalo) sa gilid ng libis, at karaniwang tinatanggap ang pagkilala; itinatala rin ng mapa ang Khirbet Salhab sa malayong hilaga bilang kandidatong may kaunting suporta. Noong 1949, hinukay ni Eleazar Sukenik sa Selbit ang sinagoga ng mga Samaritano, na may sahig na mosaiko at inskripsiyon sa mga titik Samaritano na sumisipi sa Awit ng Dagat, “Ang Panginoon ay maghahari magpakailan man”, patunay ng pamayanang Samaritano rito noong panahong Bisantino, nang kumalat ang mga Samaritano sa mababang lupain sa kanluran ng kanilang bundok."
    - "Sa tabi ng guho ay nakatayo ang relihiyosong kibbutz ng Sha'alvim, itinatag noong 1951 at pinangalanan sa bayan sa Bibliya, sa libis ng Ayalon sa gitnang Israel malapit sa Latrun, kung saan ang pangunahing daan mula Tel Aviv patungong Jerusalem ay patuloy na umaakyat sa tabi ng mga lugar ng Ajalon at Saalbim."
  da:
    - "Sja'albim, i Josvabogen Saalabbin, var en by i Dan i Ajjalon-dalen, hvor vejen fra kysten begynder at stige mod Jerusalem. Josva opregner den sammen med Ajjalon og Jitla blandt stammens byer, men Dan kunne ikke tage dalen: »Amoriterne boede roligt i Har-Heres, i Ajalon og i Saalbim; dog var Josefs Huses Haand dem svar; og de bleve skatskyldige«. De græske oversættere tilføjede en glose til navnene, »hvor bjørnene og rævene er«, da Sja'albim minder om det hebraiske ord for ræv, og den synodale bibel beholder den. Under Salomo hørte byen til det andet af de tolv distrikter, der forsynede hoffet, under Ben-Deker, »i Makaz og i Saalbim og i Beth-Semes og Elon og Beth-Hanan«, og Eljahba sja'alboniten, en af Davids helte, kom højst sandsynligt herfra."
    - "Navnet lever videre ved Selbit, en landsbyplads omkring 5 km nordvest for Ajjalon (Yalo) i dalens udkant, og identifikationen er almindeligt accepteret; kortet noterer også Khirbet Salhab langt mod nord som en kandidat med ringe støtte. I 1949 udgravede Eleazar Sukenik i Selbit en samaritansk synagoge med mosaikgulv og en indskrift med samaritanske bogstaver, der citerer Havets sang, »Herren skal regere evindelig og altid«, bevis for et samaritansk samfund her i byzantinsk tid, da samaritanerne bredte sig til lavlandet vest for deres bjerg."
    - "Ved siden af ruinen ligger den religiøse kibbutz Sha'alvim, grundlagt i 1951 og opkaldt efter den bibelske by, i Ayalon-dalen i det centrale Israel nær Latrun, hvor hovedvejen fra Tel Aviv til Jerusalem stadig stiger forbi Ajjalons og Sja'albims steder."
  sr:
    - "Салвим, код Исуса Навина Салавин, био је град Данов у долини Ајалона, где пут са обале почиње да се пење према Јерусалиму. Исус Навин га наводи с Ајалоном и Јетлом међу градовима племена, али Дан није могао да узме долину: „Амореји стадоше живети у гори Ересу, у Ајалону и у Салвиму; а кад осили рука дома Јосифовог, плаћаше данак“. Грчки преводиоци додали су тумачење имена, „где су медведи и лисице“, пошто Салвим подсећа на хебрејску реч за лисицу, а Синодална библија га задржава. Под Соломуном град је припадао другом од дванаест округа који су хранили двор, под Вен-Декером, „у Макасу и у Салвиму и Вет-Семесу и Елону вет-анатском“, а Елијава Салвоњанин, један од Давидових јунака, највероватније је отуда."
    - "Име се чува у Селбиту, селу на налазишту око 5 км северозападно од Ајалона (Јало) на ободу долине, и идентификација је опште прихваћена; карта наводи и Хирбет Салхаб далеко на северу као кандидата са мало подршке. Елеазар Сукеник је 1949. у Селбиту ископао синагогу Самарићана, с мозаичким подом и натписом самарићанским словима који цитира Песму о мору, „Господ ће царовати довека“, доказ самарићанске заједнице овде у византијском периоду, кад су се Самарићани ширили по низији западно од своје планине."
    - "Поред рушевине стоји религиозни кибуц Шаалвим, основан 1951. и назван по библијском граду, у долини Ајалон у централном Израелу близу Латруна, где главни пут од Тел Авива до Јерусалима и даље се пење поред места Ајалона и Салвима."
