body:
  en:
    - "Magog is in the table of nations a son of Japheth, named between Gomer and Madai among the peoples of the far north. In Ezekiel it is a land: “Son of man, set thy face against Gog, the land of Magog, the chief prince of Meshech and Tubal”. Gog's host of Persians, Cushites and Put, Gomer and Togarmah “of the north quarters” will come against Israel in the latter years and be destroyed on its mountains, “and I will send a fire on Magog, and among them that dwell carelessly in the isles”. Revelation makes Gog and Magog the nations of the four quarters of the earth whom Satan gathers after the thousand years, a verse that stands as 20:8 in most Bibles and in the Synodal Bible at the end of 20:7."
    - "Where Magog lay no one knows, and every identification rests on the name. Josephus said that the Magogites were the Scythians, the horsemen of the steppe north of the Black Sea who had swept through Western Asia in the seventh century BC, and Jerome and most ancient and medieval readers followed him; in Greek and Jewish eyes the Scythians stood for the barbarian north. Many modern scholars look instead to Anatolia, where Meshech, Tubal, Gomer and Togarmah all belong: Gog is then Gyges, king of Lydia, the Gugu of Ashurbanipal's annals who died fighting the Cimmerians in the mid-seventh century BC, and Magog an Assyrian way of saying “land of Gog”, Lydia. A few have sought Magog in Babylonia, and others take Gog and Magog as names of the enemy of the last days with no country behind them at all. The map offers Lydia, Scythia and Babylonia as candidates without choosing."
    - "The later history of the name is richer than its geography. Jewish and Christian writers made Gog and Magog the nations of the end, and the legend of Alexander's gate had them walled up in the north until the last days; the Quran knows them as Yajuj and Majuj behind Dhu l-Qarnayn's barrier, and medieval maps drew their enclosed land in the far north-east. In modern times the attempt to read Rosh in Ezekiel as Russia, and Magog as its land, is rejected by most scholars, since Ezekiel's names belong to the peoples of Anatolia and the steppe known in his own day."
  ru:
    - "Магог в таблице народов — сын Иафета, названный между Гомером и Мадаем среди народов дальнего севера. У Иезекииля это земля: «сын человеческий! обрати лице твое к Гогу в земле Магог, князю Роша, Мешеха и Фувала». Полчище Гога — Персы, Ефиопляне и Ливийцы, Гомер и дом Фогарма «от пределов севера» — в последние годы придёт на Израиль и погибнет на его горах, «и пошлю огонь на землю Магог и на жителей островов, живущих беспечно». Откровение делает Гога и Магога народами на четырёх углах земли, которых сатана соберёт после тысячи лет; в большинстве Библий это стих 20:8, а в Синодальном переводе — конец стиха 20:7."
    - "Где лежал Магог, никто не знает, и всякое отождествление держится на имени. Иосиф Флавий говорил, что магогиты — это скифы, конники степи к северу от Чёрного моря, прошедшие через Переднюю Азию в VII веке до н. э., и Иероним и большинство древних и средневековых читателей последовали за ним; в глазах греков и Иудеев скифы олицетворяли варварский север. Многие современные учёные смотрят на Анатолию, где лежат Мешех, Фувал, Гомер и Фогарма: Гог тогда — Гиг, царь Лидии, тот Гугу из анналов Ашшурбанапала, что погиб в бою с киммерийцами в середине VII века до н. э., а Магог — ассирийское «земля Гога», Лидия. Немногие искали Магог в Вавилонии, а иные считают Гога и Магога именами врага последних дней, за которыми не стоит никакой страны. На карте Лидия, Скифия и Вавилония предложены как кандидаты, без выбора между ними."
    - "Позднейшая история имени богаче его географии. Иудейские и христианские писатели сделали Гога и Магога народами конца времён, а легенда о вратах Александра заперла их на севере до последних дней; Коран знает их как Яджудж и Маджудж за преградой Зу-ль-Карнайна, а средневековые карты рисовали их замкнутую землю на крайнем северо-востоке. В новое время попытку прочесть Роша у Иезекииля как Россию, а Магог как её землю большинство учёных отвергает: имена Иезекииля принадлежат народам Анатолии и степи, известным в его собственные дни."
  uk:
    - "Магог у Таблиці народів — син Яфета, названий між Гомером і Мадаєм серед народів далекої півночі. В Єзекіїля це земля: «Сину чоловічий! поверни твій вид проти Гога в Магог-землї, проти князя Рошського, Мешехського й Тубалського». Військо Гога з персів, кушитів і Фута, Гомера та Фогарми «від північних гряниць» прийде проти Ізраїлю в останні роки й буде знищене на його горах, «І пошлю огонь на Магога й на безжурних поморян». Одкровення робить Гога й Магога народами чотирьох країв світу, яких сатана збирає після тисячі років, — вірш, що в більшості Біблій стоїть як 20:8, а в Синодальному — наприкінці 20:7."
    - "Де лежав Магог, ніхто не знає, і кожне ототожнення спирається на назву. Йосиф Флавій казав, що магогіти — це скіфи, вершники степу на північ від Чорного моря, які пройшли Західною Азією в VII ст. до н. е., і Ієронім та більшість давніх і середньовічних читачів пішли за ним; у грецьких і єврейських очах скіфи уособлювали варварську північ. Багато сучасних учених натомість дивляться на Анатолію, до якої належать Мешех, Тувал, Гомер і Фогарма: Гог тоді — Гіг, цар Лідії, Гугу з анналів Ашшурбаніпала, що загинув у боротьбі з кіммерійцями в середині VII ст. до н. е., а Магог — ассирійський спосіб сказати «земля Гога», Лідія. Деякі шукали Магог у Вавилонії, а інші розуміють Гога й Магога як імена ворога останніх днів, за якими немає жодної країни. Мапа пропонує Лідію, Скіфію й Вавилонію як кандидатів, не обираючи."
    - "Пізніша історія назви багатша за її географію. Єврейські й християнські письменники зробили Гога й Магога народами кінця, а легенда про браму Александра замуровувала їх на півночі до останніх днів; Коран знає їх як Яджуджа й Маджуджа за загатою Зу-ль-Карнайна, а середньовічні мапи малювали їхній замкнений край на далекому північному сході. У новий час спроба читати Рош в Єзекіїля як Росію, а Магог — як її землю відкидається більшістю вчених, бо імена Єзекіїля належать народам Анатолії та степу, відомим у його власні дні."
  es:
    - "Magog es, en la tabla de las naciones, un hijo de Jafet, nombrado entre Gomer y Madai entre los pueblos del lejano norte. En Ezequiel es una tierra: «Hijo del hombre, pon tu rostro contra Gog en tierra de Magog, príncipe de la cabecera de Mesech y Tubal». La hueste de Gog, de persas, cusitas y Fut, Gomer y Togarma «á los lados del norte», vendrá contra Israel en los últimos años y será destruida en sus montes, «Y enviaré fuego sobre Magog, y sobre los que moran seguramente en las islas». El Apocalipsis hace de Gog y Magog las naciones de los cuatro extremos de la tierra que Satanás reúne tras los mil años, un versículo que figura como 20:8 en la mayoría de las Biblias y, en la Biblia sinodal, al final de 20:7."
    - "Nadie sabe dónde estaba Magog, y toda identificación descansa en el nombre. Josefo dijo que los magogitas eran los escitas, los jinetes de la estepa al norte del mar Negro que habían recorrido el Asia occidental en el siglo VII a. C., y Jerónimo y la mayoría de los lectores antiguos y medievales lo siguieron; a ojos de griegos y judíos, los escitas representaban el norte bárbaro. Muchos estudiosos modernos miran en cambio a Anatolia, a donde pertenecen Mesec, Tubal, Gomer y Togarma: Gog sería entonces Giges, rey de Lidia, el Gugu de los anales de Asurbanipal que murió combatiendo a los cimerios a mediados del siglo VII a. C., y Magog una manera asiria de decir «tierra de Gog», Lidia. Unos pocos han buscado Magog en Babilonia, y otros toman Gog y Magog como nombres del enemigo de los últimos días sin país alguno detrás. El mapa ofrece Lidia, Escitia y Babilonia como candidatas sin elegir."
    - "La historia posterior del nombre es más rica que su geografía. Los escritores judíos y cristianos hicieron de Gog y Magog las naciones del fin, y la leyenda de la puerta de Alejandro los tenía emparedados en el norte hasta los últimos días; el Corán los conoce como Yayuj y Mayuj tras la barrera de Dhu l-Qarnayn, y los mapas medievales dibujaban su tierra cercada en el lejano nordeste. En tiempos modernos, el intento de leer Ros en Ezequiel como Rusia, y Magog como su tierra, es rechazado por la mayoría de los estudiosos, pues los nombres de Ezequiel pertenecen a los pueblos de Anatolia y de la estepa conocidos en su propia época."
  pt:
    - "Magogue consta na tabela das nações como filho de Jafé, nomeado entre Gômer e Madai entre os povos do extremo norte. Em Ezequiel é uma terra: “Filho do homem, volte o seu rosto para Gogue, da terra de Magogue, o príncipe de Rôs, Meseque e Tubal”. A hoste de Gogue, de persas, cuxitas e Pute, Gômer e Togarma “nos confins do norte”, virá contra Israel nos últimos anos e será destruída em seus montes: “Enviarei fogo sobre Magogue e sobre aqueles que habitam seguros nas ilhas”. O Apocalipse faz de Gogue e Magogue as nações dos quatro cantos da terra que Satanás reúne depois dos mil anos, versículo que é 20:8 na maioria das Bíblias e, na Bíblia Sinodal, o fim de 20:7."
    - "Onde ficava Magogue ninguém sabe, e toda identificação repousa no nome. Josefo dizia que os magogitas eram os citas, os cavaleiros da estepe ao norte do mar Negro que haviam varrido a Ásia Ocidental no século VII a.C., e Jerônimo e a maioria dos leitores antigos e medievais o seguiram; aos olhos de gregos e judeus, os citas representavam o norte bárbaro. Muitos estudiosos modernos olham antes para a Anatólia, a que pertencem Meseque, Tubal, Gômer e Togarma: Gogue seria então Giges, rei da Lídia, o Gugu dos anais de Assurbanípal, que morreu combatendo os cimérios em meados do século VII a.C., e Magogue um modo assírio de dizer “terra de Gogue”, a Lídia. Alguns procuraram Magogue na Babilônia, e outros tomam Gogue e Magogue como nomes do inimigo dos últimos dias, sem país algum por trás. O mapa oferece Lídia, Cítia e Babilônia como candidatas sem escolher."
    - "A história posterior do nome é mais rica que sua geografia. Escritores judeus e cristãos fizeram de Gogue e Magogue as nações do fim, e a lenda da porta de Alexandre os tinha emparedados no norte até os últimos dias; o Alcorão os conhece como Yajuj e Majuj atrás da barreira de Dhul-Qarnayn, e mapas medievais desenhavam sua terra cercada no extremo nordeste. Nos tempos modernos, a tentativa de ler Rôs em Ezequiel como Rússia, e Magogue como sua terra, é rejeitada pela maioria dos estudiosos, pois os nomes de Ezequiel pertencem aos povos da Anatólia e da estepe conhecidos em seu próprio tempo."
  de:
    - "Magog ist in der Völkertafel ein Sohn Jafets, zwischen Gomer und Madai unter den Völkern des fernen Nordens genannt. Bei Hesekiel ist es ein Land: „Du Menschenkind, wende dich gegen Gog, der im Lande Magog ist und der oberste Fürst in Mesech und Thubal“. Gogs Heer aus Persern, Kuschiten und Put, Gomer und Togarma, „so gegen Mitternacht liegt“, wird in den letzten Jahren gegen Israel ziehen und auf seinen Bergen vernichtet werden, „Und ich will Feuer werfen über Magog und über die, so in den Inseln sicher wohnen“. Die Offenbarung macht Gog und Magog zu den Völkern der vier Enden der Erde, die der Satan nach den tausend Jahren sammelt, eine Stelle, die in den meisten Bibeln als 20,8 und in der Synodalbibel am Ende von 20,7 steht."
    - "Wo Magog lag, weiß niemand, und jede Gleichsetzung beruht auf dem Namen. Josephus sagte, die Magogiter seien die Skythen, die Reiter der Steppe nördlich des Schwarzen Meeres, die im 7. Jahrhundert v. Chr. Vorderasien durchzogen, und Hieronymus und die meisten antiken und mittelalterlichen Leser folgten ihm; in griechischen und jüdischen Augen standen die Skythen für den barbarischen Norden. Viele neuere Gelehrte blicken nach Anatolien, wohin Meschech, Tubal, Gomer und Togarma gehören: Gog ist dann Gyges, König von Lydien, der Gugu in Assurbanipals Annalen, der Mitte des 7. Jahrhunderts v. Chr. im Kampf gegen die Kimmerier fiel, und Magog eine assyrische Weise, „Land Gogs“ zu sagen, Lydien. Manche suchen Magog in Babylonien, andere sehen in Gog und Magog Namen des Feindes der letzten Tage ganz ohne Land. Die Karte nennt Lydien, Skythien und Babylonien, ohne zu wählen."
    - "Die spätere Geschichte des Namens ist reicher als seine Geographie. Jüdische und christliche Schriftsteller machten Gog und Magog zu den Völkern des Endes, und die Legende vom Tor Alexanders ließ sie bis zu den letzten Tagen im Norden eingemauert sein; der Koran kennt sie als Yajuj und Majuj hinter dem Wall des Dhu l-Qarnayn, und mittelalterliche Karten zeichneten ihr eingeschlossenes Land im äußersten Nordosten. In neuerer Zeit wird der Versuch, Rosch bei Hesekiel als Russland und Magog als sein Land zu lesen, von den meisten Gelehrten abgelehnt, da Hesekiels Namen zu den Völkern Anatoliens und der Steppe gehören, die zu seiner Zeit bekannt waren."
  fr:
    - "Magog est, dans la table des nations, un fils de Japhet, nommé entre Gomer et Madaï parmi les peuples de l’extrême nord. Chez Ézéchiel, c’est un pays : « Fils de l’homme, tourne ta face vers Gog, au pays de Magog, vers le prince de Rosch, de Méschec et de Tubal ». L’armée de Gog, composée de Perses, de Cuschites et de Puth, de Gomer et de Togarma « à l’extrémité du septentrion », viendra contre Israël dans les dernières années et sera détruite sur ses montagnes : « J’enverrai le feu dans Magog, et parmi ceux qui habitent en sécurité les îles ». L’Apocalypse fait de Gog et Magog les nations des quatre coins de la terre que Satan rassemble après les mille ans, verset qui est 20:8 dans la plupart des Bibles et, dans la Bible synodale, la fin de 20:7."
    - "On ne sait où se trouvait Magog, et toute identification repose sur le nom. Flavius Josèphe disait que les Magogites étaient les Scythes, les cavaliers de la steppe au nord de la mer Noire qui avaient déferlé sur l’Asie occidentale au VIIe siècle av. J.-C., et Jérôme et la plupart des lecteurs antiques et médiévaux le suivirent ; pour Grecs et Juifs, les Scythes figuraient le nord barbare. Beaucoup de modernes se tournent vers l’Anatolie, où se placent Méschec, Tubal, Gomer et Togarma : Gog serait alors Gygès, roi de Lydie, le Gugu des annales d’Assurbanipal, mort en combattant les Cimmériens au milieu du VIIe siècle av. J.-C., et Magog le « pays de Gog » à l’assyrienne, la Lydie. Certains l’ont cherchée en Babylonie, d’autres prennent Gog et Magog pour des noms de l’ennemi des derniers jours, sans pays. La carte propose Lydie, Scythie et Babylonie sans choisir."
    - "L’histoire ultérieure du nom est plus riche que sa géographie. Des auteurs juifs et chrétiens firent de Gog et Magog les nations de la fin, et la légende de la porte d’Alexandre les faisait murer dans le nord jusqu’aux derniers jours ; le Coran les connaît sous le nom de Yajuj et Majuj derrière la barrière de Dhou l-Qarnayn, et les cartes médiévales dessinaient leur pays clos dans l’extrême nord-est. À l’époque moderne, la tentative de lire Rosch chez Ézéchiel comme la Russie, et Magog comme son pays, est rejetée par la plupart des savants, car les noms d’Ézéchiel appartiennent aux peuples d’Anatolie et de la steppe connus de son temps."
  it:
    - "Magog è, nella tavola delle nazioni, un figlio di Iafet, nominato tra Gomer e Madai fra i popoli dell’estremo nord. In Ezechiele è una terra: «Figliuol d’uomo, volgi la tua faccia verso Gog del paese di Magog, principe sovrano di Mescec e di Tubal». L’esercito di Gog, di Persiani, Cusiti e gente di Put, Gomer e Togarma «dell’estremità del settentrione», verrà contro Israele negli ultimi anni e sarà distrutto sui suoi monti, «E manderò il fuoco su Magog e su quelli che abitano sicuri nelle isole». L’Apocalisse fa di Gog e Magog le nazioni dei quattro angoli della terra che Satana raduna dopo i mille anni, un versetto che nella maggior parte delle Bibbie è 20,8 e nella Bibbia sinodale sta alla fine di 20,7."
    - "Dove sorgesse Magog nessuno lo sa, e ogni identificazione poggia sul nome. Giuseppe Flavio disse che i Magogiti erano gli Sciti, cavalieri della steppa a nord del Mar Nero che nel VII secolo a.C. avevano percorso l’Asia occidentale, e Girolamo e la maggior parte dei lettori antichi e medievali lo seguirono; per Greci ed ebrei gli Sciti rappresentavano il nord barbaro. Molti studiosi moderni guardano invece all’Anatolia, patria di Mesec, Tubal, Gomer e Togarma: Gog sarebbe allora Gige, re di Lidia, il Gugu degli annali di Assurbanipal che morì combattendo contro i Cimmeri a metà del VII secolo a.C., e Magog un modo assiro di dire «terra di Gog», la Lidia. Alcuni hanno cercato Magog in Babilonia, altri considerano Gog e Magog nomi del nemico degli ultimi giorni, senza alcun paese. La mappa offre Lidia, Scizia e Babilonia senza sceglierne una."
    - "La storia successiva del nome è più ricca della sua geografia. Scrittori ebrei e cristiani fecero di Gog e Magog le nazioni della fine, e la leggenda della porta di Alessandro li voleva murati nel nord fino agli ultimi giorni; il Corano li conosce come Yajuj e Majuj dietro la barriera di Dhu l-Qarnayn, e le mappe medievali disegnavano la loro terra recintata nell’estremo nord-est. Nei tempi moderni il tentativo di leggere Rosh in Ezechiele come Russia, e Magog come la sua terra, è respinto dalla maggior parte degli studiosi, poiché i nomi di Ezechiele appartengono ai popoli dell’Anatolia e della steppa noti ai suoi giorni."
  pl:
    - "Magog w tablicy narodów jest synem Jafeta, wymienionym między Gomerem a Madajem wśród ludów dalekiej północy. U Ezechiela jest krajem: „Synu człowieczy! obróć twarz swoję przeciw Gogowi w ziemi Magog, książęciu głównemu w Mesech i Tubal”. Zastęp Goga, złożony z Persów, Kuszytów i Put, Gomera i Togarmy, mieszkającej „w stronach północnych”, przyjdzie przeciw Izraelowi w latach ostatnich i zostanie zniszczony na jego górach: „I puszczę ogień na Magoga, i na tych, co bezpiecznie na wyspach mieszkają”. Apokalipsa czyni Goga i Magoga narodami czterech stron ziemi, które szatan zbiera po tysiącu lat, wers, który w większości Biblii stoi jako 20,8, a w Biblii synodalnej na końcu 20,7."
    - "Gdzie leżał Magog, nie wie nikt, a każde utożsamienie opiera się na nazwie. Józef Flawiusz mówił, że Magogici to Scytowie, jeźdźcy stepu na północ od Morza Czarnego, którzy przetoczyli się przez Azję Zachodnią w VII w. p.n.e., a Hieronim i większość starożytnych i średniowiecznych czytelników poszła za nim; w oczach Greków i Żydów Scytowie oznaczali barbarzyńską północ. Wielu współczesnych uczonych patrzy na Anatolię, do której należą Meszek, Tubal, Gomer i Togarma: Gog to wtedy Gyges, król Lidii, Gugu z annałów Aszurbanipala, który zginął w walce z Cymeryjczykami w połowie VII w. p.n.e., a Magog to asyryjski sposób na powiedzenie „kraj Goga”, Lidia. Niektórzy szukali Magoga w Babilonii, a inni uważają Goga i Magoga za imiona wroga dni ostatnich, bez żadnego kraju. Mapa podaje Lidię, Scytię i Babilonię bez wyboru."
    - "Późniejsze dzieje nazwy są bogatsze niż jej geografia. Pisarze żydowscy i chrześcijańscy uczynili Goga i Magoga narodami końca, a legenda o bramie Aleksandra kazała zamknąć ich za murem na północy do dni ostatnich; Koran zna ich jako Jadżudż i Madżudż za zaporą Zu al-Karnajna, a średniowieczne mapy rysowały ich zamknięty kraj na dalekim północnym wschodzie. W czasach nowożytnych próba czytania Rosz u Ezechiela jako Rosji, a Magoga jako jej kraju, jest odrzucana przez większość uczonych, bo imiona Ezechiela należą do ludów Anatolii i stepu znanych w jego własnych czasach."
  nl:
    - "Magog is in de volkerentafel een zoon van Jafet, genoemd tussen Gomer en Madai onder de volken van het verre noorden. Bij Ezechiël is het een land: “Mensenkind! zet uw aangezicht tegen Gog, het land van Magog, den hoofdvorst van Mesech en Tubal”. Gogs leger van Perzen, Kusieten en Put, Gomer en Togarma “aan de zijden van het noorden” zal in de laatste jaren tegen Israël optrekken en op zijn bergen worden vernietigd, “En Ik zal een vuur zenden in Magog, en onder degenen, die in de eilanden zeker wonen”. Openbaring maakt van Gog en Magog de volken van de vier hoeken der aarde die Satan na de duizend jaar verzamelt, een vers dat in de meeste Bijbels als 20:8 staat en in de Synodale Bijbel aan het eind van 20:7."
    - "Niemand weet waar Magog lag, en elke identificatie berust op de naam. Josephus zei dat de Magogieten de Scythen waren, de ruiters van de steppe ten noorden van de Zwarte Zee die in de zevende eeuw v.Chr. door West-Azië trokken, en Hiëronymus en de meeste oude en middeleeuwse lezers volgden hem; voor Grieken en joden stonden de Scythen voor het barbaarse noorden. Veel moderne geleerden kijken liever naar Anatolië, thuis van Mesech, Tubal, Gomer en Togarma: Gog is dan Gyges, koning van Lydië, de Gugu uit Assurbanipals annalen die in het midden van de zevende eeuw v.Chr. strijdend tegen de Cimmeriërs stierf, en Magog een Assyrische manier om “land van Gog” te zeggen, Lydië. Enkelen zochten Magog in Babylonië, anderen vatten Gog en Magog op als namen van de eindtijdvijand zonder land erachter. De kaart toont Lydië, Scythië en Babylonië als kandidaten zonder te kiezen."
    - "De latere geschiedenis van de naam is rijker dan zijn geografie. Joodse en christelijke schrijvers maakten van Gog en Magog de volken van het einde, en de legende van Alexanders poort liet hen tot de laatste dagen in het noorden ingemuurd zitten; de Koran kent hen als Yajuj en Majuj achter de barrière van Dhu l-Qarnayn, en middeleeuwse kaarten tekenden hun omsloten land in het verre noordoosten. In moderne tijden wordt de poging om Rosj bij Ezechiël als Rusland te lezen, en Magog als zijn land, door de meeste geleerden verworpen, aangezien Ezechiëls namen horen bij de volken van Anatolië en de steppe die in zijn eigen tijd bekend waren."
  cs:
    - "Magog je v tabulce národů syn Jafetův, jmenovaný mezi Gomerem a Madajem mezi národy dalekého severu. U Ezechiela je to země: „Synu člověčí, obrať tvář svou proti Gogovi, země Magog, knížeti a hlavě v Mešech a Tubal“. Gogovo vojsko Peršanů, Kúšitů a Putu, Gomer a Togarma „od stran půlnočních“ přitáhnou na Izraele v pozdních letech a budou zničeni na jeho horách, a „vypustím také oheň na Magoga i na ty, kteříž přebývají na ostrovích bezpečně“. Zjevení činí z Goga a Magoga národy čtyř stran země, které satan shromáždí po tisíci letech, verš, který ve většině Biblí stojí jako 20,8 a v synodální Bibli na konci 20,7."
    - "Kde Magog ležel, nikdo neví a každé určení spočívá na jménu. Josephus tvrdil, že Magogové jsou Skythové, jezdci stepi severně od Černého moře, kteří v 7. století př. n. l. přehnali Přední Asií, a Jeroným i většina starověkých a středověkých čtenářů ho následovali; v řeckých i židovských očích Skythové představovali barbarský sever. Mnozí moderní badatelé hledí raději do Anatolie, kam patří Mešek, Túbal, Gomer i Togarma: Gog je pak Gyges, král Lýdie, Gugu z Aššurbanipalových análů, který padl v boji s Kimmerijci v polovině 7. století př. n. l., a Magog asyrský způsob, jak říci „země Gogova“, tedy Lýdie. Několik badatelů hledalo Magog v Babylonii a jiní chápou Goga a Magoga jako jména nepřítele posledních dnů bez jakékoli země za nimi. Mapa nabízí jako kandidáty Lýdii, Skythii a Babylonii bez volby."
    - "Pozdější dějiny jména jsou bohatší než jeho zeměpis. Židovští a křesťanští spisovatelé učinili z Goga a Magoga národy konce a pověst o Alexandrově bráně je nechala zazdít na severu do posledních dnů; Korán je zná jako Jádžúdž a Mádžúdž za hrází Dhú l-Karnajna a středověké mapy kreslily jejich uzavřenou zemi na dalekém severovýchodě. V novověku je pokus číst Roš u Ezechiela jako Rusko a Magog jako jeho zemi odmítán většinou badatelů, protože Ezechielova jména patří národům Anatolie a stepi známým v jeho vlastní době."
