body:
  en:
    - "Ashdod lay in the southern coastal plain a few kilometres inland from the Mediterranean, between Jabneh and Ashkelon; its mound, Tel Ashdod, stands south of the modern city, and its harbour, Ashdod-Yam, lay on the shore. Excavations directed by Moshe Dothan from 1962 to 1972 uncovered a Canaanite town of the Bronze Age, and Ashdod is named in trade texts from Ugarit. Destroyed at the end of the Late Bronze Age, it was settled by the Philistines in the twelfth century BC and became one of their five cities."
    - "When the Philistines captured the ark of God, they brought it to Ashdod and set it beside Dagon in his temple; the image of Dagon fell down before it, the people were struck with plague, and the ark was sent on to Gath. Uzziah of Judah later broke down Ashdod's wall. When its king Azuri plotted against Assyria, Sargon II deposed him and set up his brother Ahimiti; the people then raised a usurper, Yamani, and Sargon took Ashdod, Gath and Ashdod-Yam, about 711 BC. Isaiah dates a prophecy to the year that the Assyrian commander, the Tartan, took Ashdod. Herodotus says the Egyptian king Psammetichus besieged Azotus for twenty-nine years, longer than any other city he knew of."
    - "In Nehemiah's day the people of Ashdod were among those angered by the rebuilding of Jerusalem's walls, and Nehemiah rebuked Jews whose children spoke half in the speech of Ashdod. In the Hellenistic age the town, now Azotus, was a Greek city. Judas Maccabeus pulled down its altars, and about 147 BC Jonathan burned Azotus together with the temple of Dagon and those who had fled into it. Pompey freed the city from Jewish rule in 63 BC, Gabinius had it rebuilt, and Herod left it to his sister Salome."
    - "After baptising the Ethiopian official, Philip was found at Azotus and preached in all the towns on his way to Caesarea. During the Jewish revolt Vespasian took Azotus and placed a garrison there. Eusebius calls it a famous city of Palestine in his day, and its bishop Silvanus attended the Council of Nicaea in 325. The sixth-century Madaba map shows both inland Azotus and Azotus by the sea."
  ru:
    - "Азот стоял на юге прибрежной равнины, в нескольких километрах от Средиземного моря, между Иавнеей и Аскалоном; его холм, Тель-Ашдод, находится к югу от современного города, а гавань, Ашдод-Ям, лежала на берегу. Раскопки 1962–1972 гг., которыми руководил Моше Дотан, открыли ханаанский город бронзового века, а Азот упоминается в торговых текстах из Угарита. Разрушенный в конце позднего бронзового века, он в XII веке до н. э. был заселён филистимлянами и стал одним из пяти их городов."
    - "Захватив ковчег Божий, филистимляне принесли его в Азот и поставили подле Дагона в его храме; изваяние Дагона упало перед ковчегом, жителей поразила болезнь, и ковчег отправили дальше, в Геф. Позднее Озия, царь Иудейский, разрушил стены Азота. Когда царь Азота Азури замыслил отпасть от Ассирии, Саргон II низложил его и поставил царём его брата Ахимити; тогда народ возвёл на престол самозванца Ямани, и Саргон около 711 г. до н. э. взял Азот, Геф и Ашдод-Ям. Исаия датирует одно пророчество годом, когда ассирийский военачальник Тартан взял Азот. Геродот пишет, что египетский царь Псамметих осаждал Азот двадцать девять лет — дольше, чем любой другой известный ему город."
    - "Во дни Неемии азотяне были среди тех, кому досаждало восстановление стен Иерусалима, и Неемия обличал иудеев, чьи дети вполовину говорили по-азотски. В эллинистическую эпоху Азот стал греческим городом. Иуда Маккавей разрушил его жертвенники, а около 147 г. до н. э. Ионафан сжёг Азот вместе с храмом Дагона и укрывшимися в нём. В 63 г. до н. э. Помпей освободил город от власти иудеев, Габиний велел его отстроить, а Ирод завещал его своей сестре Саломии."
    - "Крестив евнуха-ефиоплянина, Филипп оказался в Азоте и благовествовал всем городам на пути до Кесарии. Во время Иудейской войны Веспасиан взял Азот и поставил в нём гарнизон. Евсевий называет его знаменитым городом Палестины своего времени, а его епископ Силуан участвовал в Никейском соборе 325 г. Мозаичная карта из Мадабы VI века показывает и Азот во внутренней части страны, и Приморский Азот."
  uk:
    - "Ашдод лежав на південній прибережній рівнині за кілька кілометрів углиб від Середземного моря, між Явнеєю та Ашкелоном; його пагорб, Тель-Ашдод, стоїть на південь від сучасного міста, а гавань, Ашдод-Ям, лежала на березі. Розкопки під керівництвом Моше Дотана з 1962 до 1972 року виявили ханаанське місто бронзової доби, і Ашдод названо в торговельних текстах з Угарита. Зруйнований наприкінці пізньої бронзової доби, він був заселений филистимлянами в XII столітті до н. е. і став одним з їхніх п'яти міст."
    - "Коли филистимляни захопили ковчег Божий, вони принесли його до Ашдоду й поставили біля Даґона в його храмі; образ Даґона впав перед ним, народ уразила чума, і ковчег відіслали до Гату. Уззія Юдейський пізніше зруйнував мур Ашдоду. Коли його цар Азурі змовлявся проти Ассирії, Саргон II скинув його й поставив його брата Ахіміті; тоді народ підняв узурпатора Яманні, і Саргон узяв Ашдод, Гат та Ашдод-Ям близько 711 р. до н. е. Ісая датує пророцтво роком, коли ассирійський воєначальник, Тартан, узяв Ашдод. Геродот каже, що єгипетський цар Псамметіх облягав Азот двадцять дев'ять років, довше за будь-яке інше відоме йому місто."
    - "За Неемії ашдодяни були серед тих, кого розгнівала відбудова мурів Єрусалима, і Неемія докоряв юдеям, діти яких говорили наполовину мовою Ашдоду. В елліністичну добу місто, тепер Азот, було грецьким. Юда Маккавей зруйнував його жертовники, а близько 147 р. до н. е. Йонатан спалив Азот разом із храмом Даґона та тими, хто сховався в ньому. Помпей звільнив місто від юдейської влади в 63 р. до н. е., Габіній його відбудував, а Ірод залишив його своїй сестрі Саломеї."
    - "Охрестивши ефіопського вельможу, Пилип опинився в Азоті і проповідував по всіх містах дорогою до Кесарії. Під час юдейського повстання Веспасіан узяв Азот і поставив там залогу. Євсевій називає його славним містом Палестини свого часу, а його єпископ Сильван був на Нікейському соборі в 325 році. Мадабська карта VI століття показує і Азот у глибині суходолу, і Азот над морем."
  es:
    - "Asdod se hallaba en la llanura costera meridional, a pocos kilómetros tierra adentro del Mediterráneo, entre Jabnea y Ascalón; su montículo, Tel Ashdod, se alza al sur de la ciudad moderna, y su puerto, Ashdod-Yam, estaba en la orilla. Las excavaciones dirigidas por Moshe Dothan de 1962 a 1972 sacaron a la luz una ciudad cananea de la Edad del Bronce, y Asdod se nombra en textos comerciales de Ugarit. Destruida al final de la Edad del Bronce Final, fue poblada por los filisteos en el siglo XII a. C. y se convirtió en una de sus cinco ciudades."
    - "Cuando los filisteos capturaron el arca de Dios, la llevaron a Asdod y la pusieron junto a Dagón en su templo; la imagen de Dagón cayó ante ella, el pueblo fue herido de plaga, y el arca fue enviada a Gat. Uzías de Judá derribó más tarde la muralla de Asdod. Cuando su rey Azuri conspiró contra Asiria, Sargón II lo depuso y puso en su lugar a su hermano Ahimiti; el pueblo alzó entonces a un usurpador, Yamani, y Sargón tomó Asdod, Gat y Ashdod-Yam hacia 711 a. C. Isaías fecha una profecía en el año en que el comandante asirio, el Tartán, tomó Asdod. Heródoto dice que el rey egipcio Psamético sitió Azoto durante veintinueve años, más que a cualquier otra ciudad que conociera."
    - "En tiempos de Nehemías los habitantes de Asdod estaban entre los irritados por la reconstrucción de las murallas de Jerusalén, y Nehemías reprendió a judíos cuyos hijos hablaban en parte la lengua de Asdod. En la época helenística la ciudad, ahora Azoto, era una ciudad griega. Judas Macabeo derribó sus altares, y hacia 147 a. C. Jonatán quemó Azoto junto con el templo de Dagón y los que se habían refugiado en él. Pompeyo liberó la ciudad del dominio judío en 63 a. C., Gabinio la hizo reconstruir, y Herodes la dejó a su hermana Salomé."
    - "Tras bautizar al funcionario etíope, Felipe fue hallado en Azoto y predicó en todas las ciudades de su camino hasta Cesarea. Durante la revuelta judía, Vespasiano tomó Azoto y puso allí una guarnición. Eusebio la llama una ciudad famosa de Palestina en su tiempo, y su obispo Silvano asistió al Concilio de Nicea en 325. El mapa de Madaba, del siglo VI, muestra tanto la Azoto del interior como la Azoto marítima."
  pt:
    - "Asdode ficava na planície costeira meridional, a alguns quilômetros para o interior do Mediterrâneo, entre Jabne e Ascalom; seu montículo, Tel Ashdod, fica ao sul da cidade moderna, e seu porto, Asdode-Yam, ficava na orla. Escavações dirigidas por Moshe Dothan de 1962 a 1972 trouxeram à luz uma cidade cananeia da Idade do Bronze, e Asdode é citada em textos comerciais de Ugarit. Destruída no fim do Bronze Final, foi povoada pelos filisteus no século XII a.C. e tornou-se uma de suas cinco cidades."
    - "Quando os filisteus tomaram a arca de Deus, levaram-na a Asdode e a puseram ao lado de Dagom em seu templo; a imagem de Dagom caiu diante dela, o povo foi ferido de peste, e a arca foi enviada a Gate. Uzias de Judá derrubou depois o muro de Asdode. Quando seu rei Azuri conspirou contra a Assíria, Sargão II o depôs e pôs seu irmão Ahimiti; o povo levantou então um usurpador, Yamani, e Sargão tomou Asdode, Gate e Asdode-Yam, por volta de 711 a.C. Isaías data uma profecia do ano em que o comandante assírio, o Tartã, tomou Asdode. Heródoto diz que o rei egípcio Psamético sitiou Azoto por vinte e nove anos, mais que qualquer outra cidade que conhecesse."
    - "Nos dias de Neemias, o povo de Asdode estava entre os que se irritaram com a reconstrução das muralhas de Jerusalém, e Neemias repreendeu judeus cujos filhos “falavam metade no idioma de Asdode”. Na época helenística a cidade, agora Azoto, era grega. Judas Macabeu derrubou seus altares, e por volta de 147 a.C. Jônatas queimou Azoto junto com o templo de Dagom e os que nele se haviam refugiado. Pompeu libertou a cidade do domínio judaico em 63 a.C., Gabínio a mandou reconstruir, e Herodes a deixou à sua irmã Salomé."
    - "Depois de batizar o eunuco etíope, Filipe “foi achado em Azoto” e pregou em todas as cidades pelo caminho até Cesareia. Durante a revolta judaica, Vespasiano tomou Azoto e pôs ali uma guarnição. Eusébio a chama cidade famosa da Palestina em seu tempo, e seu bispo Silvano participou do Concílio de Niceia em 325. O mapa de Madaba, do século VI, mostra tanto Azoto do interior quanto Azoto marítima."
  de:
    - "Aschdod lag in der südlichen Küstenebene einige Kilometer landeinwärts vom Mittelmeer, zwischen Jabne und Aschkelon; sein Hügel, Tel Aschdod, steht südlich der modernen Stadt, und sein Hafen, Aschdod-Jam, lag am Strand. Grabungen unter Moshe Dothan von 1962 bis 1972 legten eine kanaanäische Stadt der Bronzezeit frei, und Aschdod wird in Handelstexten aus Ugarit genannt. Am Ende der Spätbronzezeit zerstört, wurde es im 12. Jahrhundert v. Chr. von den Philistern besiedelt und eine ihrer fünf Städte."
    - "Als die Philister die Lade Gottes erbeuteten, brachten sie sie nach Aschdod und stellten sie neben Dagon in seinen Tempel; das Bild Dagons fiel vor ihr nieder, das Volk wurde von einer Seuche geschlagen, und die Lade wurde nach Gat weitergeschickt. Usija von Juda riss später Aschdods Mauer nieder. Als sein König Azuri gegen Assyrien ränkte, setzte Sargon II. ihn ab und seinen Bruder Ahimiti ein; das Volk erhob dann einen Usurpator, Jamani, und Sargon nahm Aschdod, Gat und Aschdod-Jam um 711 v. Chr. ein. Jesaja datiert eine Weissagung auf das Jahr, in dem der assyrische Feldherr, der Tartan, Aschdod einnahm. Herodot sagt, der ägyptische König Psammetich habe Azotos neunundzwanzig Jahre belagert, länger als jede andere Stadt, die er kenne."
    - "Zu Nehemias Zeit gehörten die Leute von Aschdod zu denen, die über den Wiederaufbau der Mauern Jerusalems erzürnt waren, und Nehemia tadelte Juden, deren Kinder halb in der Sprache von Aschdod redeten. In hellenistischer Zeit war die Stadt, nun Azotus, eine griechische Stadt. Judas Makkabäus riss ihre Altäre nieder, und um 147 v. Chr. verbrannte Jonatan Azotus samt dem Tempel Dagons und denen, die sich dorthin geflüchtet hatten. Pompeius befreite die Stadt 63 v. Chr. von jüdischer Herrschaft, Gabinius ließ sie wieder aufbauen, und Herodes hinterließ sie seiner Schwester Salome."
    - "Nach der Taufe des äthiopischen Kämmerers wurde Philippus in Azotus gefunden und predigte in allen Städten auf seinem Weg nach Cäsarea. Im jüdischen Aufstand nahm Vespasian Azotus ein und legte eine Besatzung hinein. Eusebius nennt es zu seiner Zeit eine berühmte Stadt Palästinas, und sein Bischof Silvanus nahm 325 am Konzil von Nicäa teil. Die Madaba-Karte des 6. Jahrhunderts zeigt sowohl das Azotus im Binnenland als auch das Azotus am Meer."
  fr:
    - "Asdod se trouvait dans la plaine côtière méridionale, à quelques kilomètres de la Méditerranée, à l’intérieur des terres, entre Jabné et Askalon ; son tertre, Tel Asdod, s’élève au sud de la ville moderne, et son port, Asdod-Yam, était sur le rivage. Les fouilles dirigées par Moshe Dothan de 1962 à 1972 ont révélé une ville cananéenne de l’âge du Bronze, et Asdod est nommée dans des textes commerciaux d’Ougarit. Détruite à la fin du Bronze récent, elle fut peuplée par les Philistins au XIIe siècle av. J.-C. et devint l’une de leurs cinq villes."
    - "Quand les Philistins prirent l’arche de Dieu, ils l’amenèrent à Asdod et la placèrent à côté de Dagon dans son temple ; l’image de Dagon tomba devant elle, le peuple fut frappé de la peste, et l’arche fut envoyée à Gath. Ozias de Juda abattit plus tard le mur d’Asdod. Quand son roi Azuri conspira contre l’Assyrie, Sargon II le déposa et mit à sa place son frère Ahimiti ; le peuple éleva alors un usurpateur, Yamani, et Sargon prit Asdod, Gath et Asdod-Yam, vers 711 av. J.-C. Ésaïe date une prophétie de l’année où le commandant assyrien, le Tharthan, prit Asdod. Hérodote dit que le roi d’Égypte Psammétique assiégea Azotos pendant vingt-neuf ans, plus longtemps que toute autre ville connue de lui."
    - "Du temps de Néhémie, les gens d’Asdod comptaient parmi ceux que courrouçait la reconstruction des murs de Jérusalem, et Néhémie réprimanda des Juifs dont les enfants parlaient à moitié la langue d’Asdod. À l’époque hellénistique, la ville, devenue Azotos, était une cité grecque. Judas Maccabée abattit ses autels, et vers 147 av. J.-C. Jonathan brûla Azotos avec le temple de Dagon et ceux qui s’y étaient réfugiés. Pompée affranchit la ville de la domination juive en 63 av. J.-C., Gabinius la fit rebâtir, et Hérode la laissa à sa sœur Salomé."
    - "Après avoir baptisé le haut fonctionnaire éthiopien, Philippe fut retrouvé à Azotos et prêcha dans toutes les villes jusqu’à Césarée. Pendant la révolte juive, Vespasien prit Azotos et y mit une garnison. Eusèbe l’appelle une ville célèbre de Palestine de son temps, et son évêque Silvanus assista au concile de Nicée en 325. La carte de Madaba du VIe siècle montre à la fois Azotos de l’intérieur et Azotos-sur-mer."
  it:
    - "Asdod sorgeva nella pianura costiera meridionale a pochi chilometri nell’entroterra dal Mediterraneo, tra Iabne e Ascalona; il suo tell, Tel Ashdod, si trova a sud della città moderna, e il suo porto, Ashdod-Yam, era sulla riva. Gli scavi diretti da Moshe Dothan dal 1962 al 1972 hanno portato alla luce una città cananea dell’età del Bronzo, e Asdod è nominata in testi commerciali di Ugarit. Distrutta alla fine del Bronzo Tardo, fu abitata dai Filistei nel XII secolo a.C. e divenne una delle loro cinque città."
    - "Quando i Filistei presero l’arca di Dio, la portarono ad Asdod e la posero accanto a Dagon nel suo tempio; l’immagine di Dagon cadde davanti ad essa, il popolo fu colpito da una piaga, e l’arca fu mandata a Gat. Ozia di Giuda abbatté poi le mura di Asdod. Quando il suo re Azuri congiurò contro l’Assiria, Sargon II lo depose e pose suo fratello Ahimiti; il popolo innalzò allora un usurpatore, Yamani, e Sargon prese Asdod, Gat e Ashdod-Yam, intorno al 711 a.C. Isaia data una profezia all’anno in cui il comandante assiro, il Tartan, prese Asdod. Erodoto dice che il re egizio Psammetico assediò Azoto per ventinove anni, più a lungo di ogni altra città che conoscesse."
    - "Ai giorni di Neemia la gente di Asdod era fra quelli irritati dalla ricostruzione delle mura di Gerusalemme, e Neemia rimproverò i Giudei i cui figli parlavano per metà la lingua di Asdod. In età ellenistica la città, ora Azoto, era una città greca. Giuda Maccabeo ne abbatté gli altari, e intorno al 147 a.C. Gionata bruciò Azoto insieme al tempio di Dagon e a quelli che vi si erano rifugiati. Pompeo liberò la città dal dominio giudaico nel 63 a.C., Gabinio la fece ricostruire, ed Erode la lasciò a sua sorella Salome."
    - "Dopo aver battezzato il funzionario etiope, Filippo si ritrovò in Azoto e predicò in tutte le città lungo la via per Cesarea. Durante la rivolta giudaica Vespasiano prese Azoto e vi pose una guarnigione. Eusebio la chiama una celebre città della Palestina ai suoi giorni, e il suo vescovo Silvano partecipò al concilio di Nicea nel 325. La mappa di Madaba del VI secolo mostra sia Azoto nell’entroterra sia Azoto sul mare."
  pl:
    - "Aszdod leżał na południowej równinie nadbrzeżnej kilka kilometrów w głąb lądu od Morza Śródziemnego, między Jabne a Aszkelonem; jego tell, Tel Aszdod, stoi na południe od współczesnego miasta, a port, Aszdod-Jam, leżał na brzegu. Wykopaliska prowadzone przez Moshe Dothana w latach 1962–1972 odsłoniły kananejskie miasto z epoki brązu, a Aszdod jest wymieniany w tekstach handlowych z Ugarit. Zniszczony pod koniec późnej epoki brązu, został zasiedlony przez Filistynów w XII wieku p.n.e. i stał się jednym z ich pięciu miast."
    - "Gdy Filistyni zdobyli skrzynię Bożą, przynieśli ją do Aszdodu i postawili obok Dagona w jego świątyni; posąg Dagona upadł przed nią, lud dotknęła plaga, a skrzynię odesłano do Gat. Uzzjasz z Judy rozwalił później mur Aszdodu. Gdy jego król Azuri knuł przeciw Asyrii, Sargon II go złożył i osadził jego brata Ahimitiego; lud wyniósł wtedy uzurpatora Yamaniego, a Sargon zdobył Aszdod, Gat i Aszdod-Jam około 711 r. p.n.e. Izajasz datuje proroctwo rokiem, w którym asyryjski dowódca, Tartan, zdobył Aszdod. Herodot mówi, że egipski król Psametyk oblegał Azot przez dwadzieścia dziewięć lat, dłużej niż jakiekolwiek miasto, jakie znał."
    - "Za Nehemiasza mieszkańcy Aszdodu byli wśród tych, których rozgniewała odbudowa murów Jerozolimy, a Nehemiasz zganił Żydów, których dzieci mówiły w połowie językiem Aszdodu. W epoce hellenistycznej miasto, zwane Azotem, było miastem greckim. Juda Machabeusz zburzył jego ołtarze, a około 147 r. p.n.e. Jonatan spalił Azot wraz ze świątynią Dagona i tymi, którzy do niej uciekli. Pompejusz uwolnił miasto spod władzy żydowskiej w 63 r. p.n.e., Gabiniusz kazał je odbudować, a Herod zostawił je swej siostrze Salome."
    - "Po ochrzczeniu etiopskiego urzędnika Filip znalazł się w Azocie i głosił we wszystkich miastach w drodze do Cezarei. Podczas powstania żydowskiego Wespazjan zdobył Azot i umieścił tam załogę. Euzebiusz nazywa je sławnym miastem Palestyny swoich czasów, a jego biskup Sylwan uczestniczył w Soborze Nicejskim w 325 roku. Szóstowieczna mapa z Madaby pokazuje zarówno Azot w głębi lądu, jak Azot nad morzem."
  nl:
    - "Asdod lag in de zuidelijke kustvlakte enkele kilometers landinwaarts van de Middellandse Zee, tussen Jabne en Askelon; zijn heuvel, Tel Asdod, staat ten zuiden van de moderne stad, en zijn haven, Asdod-Yam, lag aan de kust. Opgravingen onder leiding van Moshe Dothan van 1962 tot 1972 brachten een Kanaänitische stad uit de bronstijd aan het licht, en Asdod wordt genoemd in handelsteksten uit Ugarit. Aan het eind van de late bronstijd verwoest, werd het in de twaalfde eeuw v.Chr. door de Filistijnen bewoond en een van hun vijf steden."
    - "Toen de Filistijnen de ark Gods veroverden, brachten zij haar naar Asdod en zetten haar naast Dagon in zijn tempel; het beeld van Dagon viel ervoor neer, het volk werd met pest geslagen, en de ark werd naar Gat gezonden. Uzzia van Juda brak later Asdods muur af. Toen zijn koning Azuri tegen Assyrië samenspande, zette Sargon II hem af en stelde zijn broer Ahimiti aan; het volk verhief toen een usurpator, Yamani, en Sargon nam Asdod, Gat en Asdod-Yam in, omstreeks 711 v.Chr. Jesaja dateert een profetie in het jaar dat de Assyrische bevelhebber, de Tartan, Asdod innam. Herodotus zegt dat de Egyptische koning Psammetichus Azotus negenentwintig jaar belegerde, langer dan enige andere stad die hij kende."
    - "In Nehemia’s dagen behoorden de mensen van Asdod tot hen die zich ergerden aan de herbouw van Jeruzalems muren, en Nehemia berispte Joden wier kinderen half de taal van Asdod spraken. In de hellenistische tijd was de stad, nu Azotus, een Griekse stad. Judas Makkabeüs brak haar altaren af, en omstreeks 147 v.Chr. verbrandde Jonatan Azotus samen met de tempel van Dagon en hen die erin gevlucht waren. Pompeius bevrijdde de stad in 63 v.Chr. van Joodse heerschappij, Gabinius liet haar herbouwen, en Herodes liet haar na aan zijn zuster Salome."
    - "Nadat hij de Ethiopische hoveling had gedoopt, werd Filippus teruggevonden te Azotus en predikte in alle steden op weg naar Caesarea. Tijdens de Joodse opstand nam Vespasianus Azotus in en legde er een garnizoen. Eusebius noemt het in zijn tijd een beroemde stad van Palestina, en zijn bisschop Silvanus woonde in 325 het Concilie van Nicea bij. De Madabakaart uit de zesde eeuw toont zowel het landinwaartse Azotus als Azotus aan zee."
  cs:
    - "Ašdod ležel na jižní pobřežní pláni několik kilometrů ve vnitrozemí od Středozemního moře, mezi Jabne a Aškelonem; jeho pahorek, Tel Ašdod, stojí jižně od moderního města a jeho přístav, Ašdod-Jam, ležel na pobřeží. Vykopávky vedené Moše Dótanem v letech 1962 až 1972 odkryly kenaanské město doby bronzové a Ašdod je jmenován v obchodních textech z Ugaritu. Zničen na konci pozdní doby bronzové, byl osídlen Pelištejci ve 12. století př. n. l. a stal se jedním z jejich pěti měst."
    - "Když Pelištejci zajali truhlu Boží, přinesli ji do Ašdodu a postavili ji vedle Dagona v jeho chrámu; Dagonova podoba před ní padla, lid byl zasažen morem a truhla byla poslána do Gatu. Uzijáš Judský později zbořil hradbu Ašdodu. Když jeho král Azuri strojil spiknutí proti Asýrii, Sargon II. ho sesadil a dosadil jeho bratra Achimitiho; lid pak povýšil uzurpátora Jamaniho a Sargon dobyl Ašdod, Gat a Ašdod-Jam asi roku 711 př. n. l. Izajáš datuje proroctví do roku, kdy asyrský velitel, Tartan, dobyl Ašdod. Hérodotos praví, že egyptský král Psammétichos obléhal Azotos dvacet devět let, déle než kterékoli jiné město, o němž věděl."
    - "Za Nehemjášových dnů byli obyvatelé Ašdodu mezi těmi, které rozhněvala obnova jeruzalémských hradeb, a Nehemjáš pokáral Židy, jejichž děti mluvily napůl řečí Ašdodu. V helénistické době bylo město, nyní Azotos, řeckým městem. Juda Makabejský zbořil jeho oltáře a kolem roku 147 př. n. l. Jonatan spálil Azotos spolu s chrámem Dagonovým a těmi, kdo se do něj uchýlili. Pompeius osvobodil město od židovské vlády roku 63 př. n. l., Gabinius je dal přestavět a Herodes je odkázal své sestře Salome."
    - "Po křtu etiopského úředníka byl Filip nalezen v Azotu a kázal ve všech městech na cestě do Cesareje. Za židovského povstání Vespasianus Azotos dobyl a umístil tam posádku. Eusebios je nazývá slavným městem Palestiny své doby a jeho biskup Silvanus se zúčastnil koncilu v Nikaii roku 325. Madabská mapa ze 6. století ukazuje Azotos ve vnitrozemí i Azotos u moře."
  sv:
    - "Ashdod låg på södra kustslätten några kilometer inåt land från Medelhavet, mellan Javne och Ashkelon; dess kulle, Tel Ashdod, ligger söder om den moderna staden, och dess hamn, Ashdod-Yam, låg vid stranden. Utgrävningar under ledning av Moshe Dothan 1962–1972 blottlade en kananeisk stad från bronsåldern, och Ashdod nämns i handelstexter från Ugarit. Förstörd vid slutet av senare bronsåldern bosattes den av filistéerna på 1100-talet f.Kr. och blev en av deras fem städer."
    - "När filistéerna tog Guds ark förde de den till Ashdod och ställde den bredvid Dagon i hans tempel; Dagons bild föll ned inför den, folket drabbades av pest, och arken sändes vidare till Gat. Ussia av Juda bröt senare ned Ashdods mur. När dess kung Azuri smidde ränker mot Assyrien avsatte Sargon II honom och insatte hans bror Ahimiti; folket upphöjde då en usurpator, Yamani, och Sargon intog Ashdod, Gat och Ashdod-Yam omkring 711 f.Kr. Jesaja daterar en profetia till det år då den assyriske befälhavaren, Tartan, intog Ashdod. Herodotos säger att den egyptiske kungen Psammetichos belägrade Azotos i tjugonio år, längre än någon annan stad han kände till."
    - "På Nehemjas tid hörde Ashdods folk till dem som blev vreda över återuppbyggnaden av Jerusalems murar, och Nehemja tillrättavisade judar vars barn talade till hälften Ashdods språk. Under den hellenistiska tiden var staden, nu Azotos, en grekisk stad. Judas Mackabeus rev ned dess altare, och omkring 147 f.Kr. brände Jonatan Azotos tillsammans med Dagons tempel och dem som hade flytt in i det. Pompejus befriade staden från judiskt välde år 63 f.Kr., Gabinius lät bygga upp den, och Herodes lämnade den åt sin syster Salome."
    - "Efter att ha döpt den etiopiske hovmannen blev Filippos funnen i Azotos och predikade i alla städer på vägen till Caesarea. Under det judiska upproret intog Vespasianus Azotos och lade en garnison där. Eusebios kallar den en berömd stad i Palestina på sin tid, och dess biskop Silvanus deltog i konciliet i Nicaea år 325. Madabakartan från 500-talet visar både Azotos inåt land och Azotos vid havet."
