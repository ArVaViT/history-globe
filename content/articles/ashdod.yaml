# Overview article (ADR 0007). Mainstream facts only; Assyrian dates follow the standard chronology, disputed things are said to be disputed.
id: ashdod
place: a30c937
title:
  en: "Ashdod"
  ru: "Азот"
  uk: "Ашдод"
  es: "Asdod"
  pt: "Asdode"
  de: "Aschdod"
  fr: "Asdod"
  it: "Asdod"
  pl: "Aszdod"
