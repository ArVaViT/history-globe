body:
  en:
    - "Hierapolis was a city of Phrygia in the Lycus valley of western Asia Minor, on a high terrace on the north side of the valley, across from Laodicea and a few hours' walk from Colossae. It was a Hellenistic foundation of the third or second century BC; some scholars credit the Seleucids, others the Attalid kings of Pergamum. Its hot springs, rich in lime, have built the white travertine cascades of Pamukkale below the ruins. Strabo describes the waters that harden into stone and the Plutonium, a small opening full of a vapour that killed any animal that went in, though the eunuch priests of Cybele, he says, entered unharmed."
    - "Writing to Colossae, Paul sends greetings from Epaphras, “who is one of you”, and adds: “For I bear him record, that he hath a great zeal for you, and them that are in Laodicea, and them in Hierapolis.” Epaphras had evidently brought the gospel to all three cities of the valley, which lay within a day's walk of each other. This is the only mention of Hierapolis in the Bible."
    - "Rebuilt after the earthquake of AD 60 under Nero, the city prospered under the empire; the Stoic philosopher Epictetus was born there about AD 50. Eusebius names Papias, an early collector of traditions about the Gospels, as bishop of Hierapolis, and quotes Polycrates of Ephesus, who wrote about 190 that Philip, “one of the twelve apostles”, was buried at Hierapolis with two of his daughters. A fifth-century octagonal martyrium of Philip stands on the hill outside the north-eastern walls, and in 2011 Francesco D'Andria announced a tomb in a church nearby that he took to be Philip's; in 2013 his team found the Plutonium. Italian excavations began in 1957 under Paolo Verzone. Hierapolis-Pamukkale, near Denizli in Turkey, has been on the UNESCO World Heritage list since 1988."
  ru:
    - "Иераполь — город Фригии в долине Лика на западе Малой Азии, на высокой террасе северного края долины, напротив Лаодикии и в нескольких часах пути от Колосс. Это эллинистическое основание III или II в. до н. э.; одни учёные приписывают его Селевкидам, другие — Атталидам Пергама. Его горячие источники, богатые известью, создали под развалинами белые травертиновые каскады Памуккале. Страбон описывает воды, застывающие в камень, и Плутоний — небольшое отверстие, полное испарений, убивавших всякое вошедшее туда животное, хотя жрецы-евнухи Кибелы, по его словам, входили туда невредимыми."
    - "В послании в Колоссы Павел передаёт привет от Епафраса, который «ваш», и прибавляет: «Свидетельствую о нем, что он имеет великую ревность и заботу о вас и о находящихся в Лаодикии и Иераполе». Епафрас, по-видимому, принёс Евангелие во все три города долины, лежавшие в дне пути друг от друга. Это единственное упоминание Иераполя в Библии."
    - "Отстроенный после землетрясения 60 г. н. э. при Нероне, город процветал в эпоху империи; около 50 г. н. э. в нём родился философ-стоик Эпиктет. Евсевий называет епископом Иераполя Папия, раннего собирателя преданий о Евангелиях, и приводит слова Поликрата Ефесского, писавшего около 190 г., что Филипп, «один из двенадцати апостолов», погребён в Иераполе с двумя своими дочерьми. На холме за северо-восточной стеной города стоит восьмиугольный мартирий Филиппа V в., а в 2011 г. Франческо Д'Андриа объявил о находке в соседней церкви гробницы, которую он счёл гробницей Филиппа; в 2013 г. его группа нашла Плутоний. Итальянские раскопки начались в 1957 г. под руководством Паоло Верцоне. Иераполь-Памуккале близ Денизли в Турции с 1988 г. входит в список Всемирного наследия ЮНЕСКО."
  uk:
    - "Ієраполіс був містом Фрігії в долині Ліка в західній Малій Азії, на високій терасі на північному боці долини, навпроти Лаодікеї та за кілька годин ходу від Колос. Це було елліністичне заснування III чи II ст. до н. е.; одні вчені приписують його Селевкідам, інші — Атталідам Пергама. Його гарячі, багаті на вапно джерела збудували білі травертинові каскади Памуккале під руїнами. Страбон описує води, що твердіють у камінь, і Плутоніон — невеликий отвір, повний пари, що вбивала будь-яку тварину, яка входила, хоча скопці-жерці Кібели, каже він, входили неушкодженими."
    - "Пишучи до Колос, Павло передає привіт від Епафраса, «що з вас», і додає: «Сьвідкую бо за нього, що має велику ревність про вас і про Лаодичан і Єрополян». Епафрас, вочевидь, приніс євангелію в усі три міста долини, які лежали в межах денного переходу одне від одного. Це єдина згадка про Ієраполіс у Біблії."
    - "Відбудований після землетрусу 60 р. н. е. за Нерона, Ієраполіс процвітав за імперії; стоїчний філософ Епіктет народився там близько 50 р. н. е. Євсевій називає Папія, раннього збирача переказів про Євангелія, єпископом Ієраполіса й цитує Полікрата Ефеського, який близько 190 р. писав, що Пилип, «один із дванадцяти апостолів», похований в Ієраполісі разом із двома дочками. П'ятого століття восьмикутний мартирій Пилипа стоїть на пагорбі за північно-східними мурами, а 2011 р. Франческо Д'Андрія оголосив про гробницю в сусідній церкві, яку він вважав Пилиповою; 2013 р. його група знайшла Плутоніон. Італійські розкопки почалися 1957 р. під керівництвом Паоло Верцоне. Ієраполіс-Памуккале, поблизу Денізлі в Туреччині, внесений до Списку всесвітньої спадщини ЮНЕСКО від 1988 р."
  es:
    - "Hierápolis era una ciudad de Frigia en el valle del Lico, en el occidente de Asia Menor, sobre una alta terraza del lado norte del valle, frente a Laodicea y a pocas horas de camino de Colosas. Fue una fundación helenística de los siglos III o II a. C.; unos estudiosos la atribuyen a los seléucidas, otros a los reyes atálidas de Pérgamo. Sus aguas termales, ricas en cal, han formado las blancas cascadas de travertino de Pamukkale bajo las ruinas. Estrabón describe las aguas que se endurecen en piedra y el Plutonio, una pequeña abertura llena de un vapor que mataba a todo animal que entrara, aunque los sacerdotes eunucos de Cibeles, dice, entraban sin daño."
    - "Escribiendo a Colosas, Pablo envía saludos de Epafras, «el cual es de vosotros», y añade: «Porque le doy testimonio, que tiene gran celo por vosotros, y por los que están en Laodicea, y los que en Hierápolis». Evidentemente Epafras había llevado el evangelio a las tres ciudades del valle, que distaban entre sí una jornada de camino. Esta es la única mención de Hierápolis en la Biblia."
    - "Reconstruida tras el terremoto del año 60 d. C. bajo Nerón, la ciudad prosperó bajo el Imperio; el filósofo estoico Epicteto nació allí hacia 50 d. C. Eusebio nombra a Papías, antiguo recopilador de tradiciones sobre los Evangelios, como obispo de Hierápolis, y cita a Polícrates de Éfeso, que hacia 190 escribió que Felipe, «uno de los doce apóstoles», fue sepultado en Hierápolis con dos de sus hijas. Un martirio octogonal de Felipe, del siglo V, se alza en la colina fuera de las murallas nororientales, y en 2011 Francesco D'Andria anunció el hallazgo de una tumba en una iglesia cercana que tomó por la de Felipe; en 2013 su equipo halló el Plutonio. Las excavaciones italianas comenzaron en 1957 bajo Paolo Verzone. Hierápolis-Pamukkale, cerca de Denizli, en Turquía, figura en la lista del Patrimonio Mundial de la UNESCO desde 1988."
  pt:
    - "Hierápolis era uma cidade da Frígia no vale do Lico, no oeste da Ásia Menor, num alto terraço no lado norte do vale, defronte de Laodiceia e a poucas horas de caminhada de Colossos. Foi uma fundação helenística do século III ou II a.C.; alguns estudiosos a atribuem aos selêucidas, outros aos reis atálidas de Pérgamo. Suas fontes termais, ricas em cal, formaram as cascatas brancas de travertino de Pamukkale abaixo das ruínas. Estrabão descreve as águas que se endurecem em pedra e o Plutônio, uma pequena abertura cheia de um vapor que matava qualquer animal que entrasse, embora os sacerdotes eunucos de Cibele, diz ele, entrassem sem dano."
    - "Escrevendo a Colossos, Paulo envia saudações de Epafras, “que é um de vocês”, e acrescenta: “Pois dou testemunho dele de que tem grande zelo por vocês, e pelos que estão em Laodiceia, e pelos que estão em Hierápolis.” Epafras evidentemente havia levado o evangelho às três cidades do vale, que ficavam a um dia de caminhada umas das outras. Esta é a única menção de Hierápolis na Bíblia."
    - "Reconstruída depois do terremoto de 60 d.C., sob Nero, a cidade prosperou sob o império; o filósofo estoico Epicteto nasceu ali por volta de 50 d.C. Eusébio cita Papias, um dos primeiros coletores de tradições sobre os Evangelhos, como bispo de Hierápolis, e cita Polícrates de Éfeso, que escreveu por volta de 190 que Filipe, “um dos doze apóstolos”, foi sepultado em Hierápolis com duas de suas filhas. Um martírio octogonal de Filipe, do século V, ergue-se na colina fora das muralhas nordeste, e em 2011 Francesco D'Andria anunciou um túmulo numa igreja próxima que considerou ser o de Filipe; em 2013 sua equipe encontrou o Plutônio. As escavações italianas começaram em 1957 sob Paolo Verzone. Hierápolis-Pamukkale, perto de Denizli, na Turquia, consta da lista do Patrimônio Mundial da UNESCO desde 1988."
  de:
    - "Hierapolis war eine Stadt Phrygiens im Lykostal im Westen Kleinasiens, auf einer hohen Terrasse an der Nordseite des Tals, gegenüber von Laodizea und einige Wegstunden von Kolossae entfernt. Es war eine hellenistische Gründung des dritten oder zweiten Jahrhunderts v. Chr.; manche Gelehrte schreiben sie den Seleukiden zu, andere den Attalidenkönigen von Pergamon. Seine kalkreichen heißen Quellen haben die weißen Sinterterrassen von Pamukkale unterhalb der Ruinen aufgebaut. Strabon beschreibt die Wasser, die zu Stein erhärten, und das Plutonium, eine kleine Öffnung voller Dämpfe, die jedes Tier töteten, das hineinging, während die verschnittenen Priester der Kybele, wie er sagt, unversehrt eintraten."
    - "Im Brief nach Kolossae sendet Paulus Grüße von Epaphras, „der von den euren ist“, und fügt hinzu: „Ich gebe ihm Zeugnis, daß er großen Fleiß hat um euch und um die zu Laodizea und zu Hierapolis.“ Epaphras hatte offenbar das Evangelium in alle drei Städte des Tals gebracht, die innerhalb eines Tagesmarsches voneinander lagen. Dies ist die einzige Erwähnung von Hierapolis in der Bibel."
    - "Nach dem Erdbeben des Jahres 60 n. Chr. unter Nero wiederaufgebaut, blühte die Stadt unter dem Kaiserreich; der stoische Philosoph Epiktet wurde dort um 50 n. Chr. geboren. Eusebius nennt Papias, einen frühen Sammler von Überlieferungen über die Evangelien, als Bischof von Hierapolis und zitiert Polykrates von Ephesus, der um 190 schrieb, Philippus, „einer der zwölf Apostel“, sei mit zwei seiner Töchter in Hierapolis begraben. Ein achteckiges Martyrion des Philippus aus dem fünften Jahrhundert steht auf dem Hügel außerhalb der nordöstlichen Mauern, und 2011 gab Francesco D'Andria ein Grab in einer nahen Kirche bekannt, das er für das des Philippus hielt; 2013 fand sein Team das Plutonium. Italienische Grabungen begannen 1957 unter Paolo Verzone. Hierapolis-Pamukkale bei Denizli in der Türkei steht seit 1988 auf der UNESCO-Welterbeliste."
  fr:
    - "Hiérapolis était une cité de Phrygie, dans la vallée du Lycos, en Asie Mineure occidentale, sur une haute terrasse du côté nord de la vallée, en face de Laodicée et à quelques heures de marche de Colosses. C’était une fondation hellénistique des IIIe ou IIe siècles av. J.-C. ; certains en créditent les Séleucides, d’autres les rois attalides de Pergame. Ses sources chaudes, riches en calcaire, ont bâti les cascades de travertin blanc de Pamukkale au-dessous des ruines. Strabon décrit les eaux qui durcissent en pierre et le Plutonion, petite ouverture pleine d’une vapeur qui tuait tout animal qui y entrait, bien que les prêtres eunuques de Cybèle, dit-il, y entraient sans mal."
    - "Écrivant à Colosses, Paul transmet les salutations d’Épaphras, « qui est des vôtres », et ajoute : « Car je lui rends le témoignage qu’il a une grande sollicitude pour vous, pour ceux de Laodicée, et pour ceux d’Hiérapolis. » Épaphras avait manifestement apporté l’Évangile aux trois villes de la vallée, distantes d’une journée de marche au plus. C’est la seule mention d’Hiérapolis dans la Bible."
    - "Reconstruite après le tremblement de terre de 60 apr. J.-C., sous Néron, la ville prospéra sous l’Empire ; le philosophe stoïcien Épictète y naquit vers 50. Eusèbe nomme Papias, ancien collecteur de traditions sur les Évangiles, évêque d’Hiérapolis, et cite Polycrate d’Éphèse, qui écrivit vers 190 que Philippe, « l’un des douze apôtres », fut enterré à Hiérapolis avec deux de ses filles. Un martyrion octogonal de Philippe, du Ve siècle, se dresse sur la colline hors des murs nord-est, et en 2011 Francesco D’Andria annonça une tombe dans une église voisine qu’il tint pour celle de Philippe ; en 2013 son équipe trouva le Plutonion. Les fouilles italiennes commencèrent en 1957 sous Paolo Verzone. Hiérapolis-Pamukkale, près de Denizli, en Turquie, est inscrite au patrimoine mondial de l’UNESCO depuis 1988."
  it:
    - "Gerapoli era una città della Frigia nella valle del Lico, nell’Asia Minore occidentale, su un’alta terrazza sul lato nord della valle, di fronte a Laodicea e a poche ore di cammino da Colosse. Fu una fondazione ellenistica del III o II secolo a.C.; alcuni studiosi la attribuiscono ai Seleucidi, altri ai re attalidi di Pergamo. Le sue sorgenti calde, ricche di calcare, hanno costruito le bianche cascate di travertino di Pamukkale sotto le rovine. Strabone descrive le acque che si induriscono in pietra e il Plutonio, una piccola apertura piena di un vapore che uccideva ogni animale vi entrasse, mentre i sacerdoti eunuchi di Cibele, dice, vi entravano illesi."
    - "Scrivendo a Colosse, Paolo manda i saluti di Epafra, «che è dei vostri», e aggiunge: «Poiché io gli rendo questa testimonianza ch’egli si dà molta pena per voi e per quelli di Laodicea e per quelli di Jerapoli». Epafra aveva evidentemente portato il Vangelo a tutte e tre le città della valle, distanti l’una dall’altra non più di una giornata di cammino. È l’unica menzione di Gerapoli nella Bibbia."
    - "Ricostruita dopo il terremoto del 60 d.C. sotto Nerone, la città prosperò sotto l’impero; il filosofo stoico Epitteto vi nacque verso il 50 d.C. Eusebio nomina Papia, un antico raccoglitore di tradizioni sui Vangeli, come vescovo di Gerapoli, e cita Policrate di Efeso, che verso il 190 scrisse che Filippo, «uno dei dodici apostoli», fu sepolto a Gerapoli con due delle sue figlie. Un martyrium ottagonale di Filippo del V secolo sorge sulla collina fuori dalle mura nord-orientali, e nel 2011 Francesco D’Andria annunciò una tomba in una chiesa vicina che ritenne di Filippo; nel 2013 la sua équipe trovò il Plutonio. Gli scavi italiani iniziarono nel 1957 sotto Paolo Verzone. Gerapoli-Pamukkale, presso Denizli in Turchia, è nella lista del patrimonio mondiale dell’UNESCO dal 1988."
  nl:
    - "Hiërapolis was een stad in Frygië in de Lycusvallei in het westen van Klein-Azië, op een hoog terras aan de noordzijde van het dal, tegenover Laodicea en een paar uur lopen van Kolosse. Het was een hellenistische stichting uit de derde of tweede eeuw v.Chr.; sommige geleerden schrijven haar toe aan de Seleuciden, andere aan de Attaliden, de koningen van Pergamum. De kalkrijke warme bronnen hebben de witte travertijnterrassen van Pamukkale onder de ruïnes opgebouwd. Strabo beschrijft het water dat tot steen verhardt en het Plutonium, een kleine opening vol damp die elk dier doodde dat erin ging, hoewel de ontmande priesters van Cybele er volgens hem ongedeerd binnengingen."
    - "Schrijvend aan Kolosse zendt Paulus groeten van Epafras, “die uit de uwen is”, en voegt toe: “Want ik geef hem getuigenis, dat hij groten ijver heeft over u en degenen, die in Laodicea zijn, en degenen, die in Hierapolis zijn.” Epafras had blijkbaar het evangelie aan alle drie de steden van het dal gebracht, die binnen een dagreis van elkaar lagen. Dit is de enige vermelding van Hiërapolis in de Bijbel."
    - "Herbouwd na de aardbeving van 60 n.Chr. onder Nero, bloeide de stad onder het keizerrijk; de stoïsche filosoof Epictetus werd er omstreeks 50 n.Chr. geboren. Eusebius noemt Papias, een vroege verzamelaar van overleveringen over de evangeliën, als bisschop van Hiërapolis, en citeert Polycrates van Efeze, die omstreeks 190 schreef dat Filippus, “een van de twaalf apostelen”, met twee van zijn dochters te Hiërapolis was begraven. Een achthoekig martyrium van Filippus uit de vijfde eeuw staat op de heuvel buiten de noordoostelijke muren, en in 2011 maakte Francesco D'Andria een graf bekend in een kerk daarbij dat hij voor dat van Filippus hield; in 2013 vond zijn team het Plutonium. Italiaanse opgravingen begonnen in 1957 onder Paolo Verzone. Hierapolis-Pamukkale, bij Denizli in Turkije, staat sinds 1988 op de werelderfgoedlijst van UNESCO."
  pl:
    - "Hierapolis było miastem Frygii w dolinie Lykosu w zachodniej Azji Mniejszej, na wysokim tarasie po północnej stronie doliny, naprzeciw Laodycei i o kilka godzin drogi pieszo od Kolos. Było założeniem hellenistycznym z III lub II w. p.n.e.; część uczonych przypisuje je Seleucydom, inni królom z dynastii Attalidów z Pergamonu. Jego gorące źródła, bogate w wapń, utworzyły białe trawertynowe kaskady Pamukkale poniżej ruin. Strabon opisuje wody twardniejące w kamień oraz Plutonion, niewielki otwór pełen oparów, które zabijały każde zwierzę, jakie weszło do środka, choć kapłani-eunuchowie Kybele, jak mówi, wchodzili do niego bezpiecznie."
    - "Pisząc do Kolos, Paweł przekazuje pozdrowienia od Epafrasa, „który z was jest”, i dodaje: „Bo mu daję świadectwo, iż gorliwą miłość ma przeciwko wam i przeciwko tym, którzy są w Laodycei i którzy są w Hijerapolu”. Epafras najwyraźniej przyniósł ewangelię do wszystkich trzech miast doliny, odległych od siebie o dzień drogi pieszo. Jest to jedyna wzmianka o Hierapolis w Biblii."
    - "Odbudowane po trzęsieniu ziemi w 60 r. n.e. za Nerona, miasto prosperowało za cesarstwa; stoicki filozof Epiktet urodził się tu około 50 r. n.e. Euzebiusz wymienia Papiasza, wczesnego zbieracza tradycji o Ewangeliach, jako biskupa Hierapolis i cytuje Polikratesa z Efezu, który około 190 roku pisał, że Filip, „jeden z dwunastu apostołów”, został pochowany w Hierapolis wraz z dwiema córkami. Ośmioboczne martyrium Filipa z V wieku stoi na wzgórzu poza północno-wschodnim murem, a w 2011 roku Francesco D'Andria ogłosił odkrycie grobu w pobliskim kościele, który uznał za grób Filipa; w 2013 roku jego zespół odnalazł Plutonion. Włoskie wykopaliska rozpoczęły się w 1957 roku pod kierunkiem Paola Verzone. Hierapolis-Pamukkale, koło Denizli w Turcji, od 1988 roku znajduje się na liście światowego dziedzictwa UNESCO."
  cs:
    - "Hierapolis bylo město ve Frygii v údolí Lykosu v západní Malé Asii, na vysoké terase na severní straně údolí, naproti Laodikeji a několik hodin chůze od Kolos. Bylo helénistickým založením třetího nebo druhého století př. n. l.; někteří badatelé je připisují Seleukovcům, jiní attalovským králům z Pergamonu. Jeho horké prameny bohaté na vápno vytvořily pod zříceninami bílé travertinové kaskády Pamukkale. Strabón popisuje vody, které tuhnou v kámen, a Plútónion, malý otvor plný výparu, který zabíjel každé zvíře, jež do něj vešlo, ačkoli, jak říká, kněží-kastráti Kybelé do něj vcházeli bez úhony."
    - "Pavel v listu do Kolos posílá pozdrav od Epafry, „kterýž od vás jest“, a dodává: „Nebo svědectví jemu vydávám, žeť vás velmi horlivě miluje, a též i ty, kteříž jsou v Laodicii, i kteříž jsou v Hierapoli.“ Epafras zřejmě přinesl evangelium do všech tří měst údolí, která ležela v dosahu jednodenní cesty. Je to jediná zmínka o Hierapoli v Bibli."
    - "Po zemětřesení roku 60 n. l. bylo město za Nerona znovu vystavěno a za císařství vzkvétalo; stoický filozof Epiktétos se tam narodil kolem roku 50 n. l. Eusebius jmenuje Papia, raného sběratele tradic o evangeliích, biskupem Hierapole a cituje Polykrata z Efezu, který kolem roku 190 napsal, že Filip, „jeden ze dvanácti apoštolů“, byl pohřben v Hierapoli se dvěma svými dcerami. Osmiboké martyrium Filipovo z pátého století stojí na návrší mimo severovýchodní hradby a roku 2011 oznámil Francesco D'Andria hrobku v nedalekém kostele, kterou pokládal za Filipovu; roku 2013 jeho tým nalezl Plútónion. Italské vykopávky začaly roku 1957 pod vedením Paola Verzoneho. Hierapolis-Pamukkale u Denizli v Turecku je od roku 1988 na seznamu světového dědictví UNESCO."
  sv:
    - "Hierapolis var en stad i Frygien i Lykosdalen i västra Mindre Asien, på en hög terrass på dalens norra sida, mitt emot Laodikeia och några timmars väg från Kolossai. Den var en hellenistisk grundläggning från 200- eller 100-talet f.Kr.; några forskare tillskriver den seleukiderna, andra attaliderna i Pergamon. Dess heta källor, rika på kalk, har byggt de vita travertinkaskaderna i Pamukkale nedanför ruinerna. Strabon beskriver vattnet som hårdnar till sten och Plutonium, en liten öppning full av en ånga som dödade varje djur som gick in, fast Kybeles eunuckpräster, säger han, gick in oskadda."
    - "I brevet till Kolossai sänder Paulus hälsningar från Epafras, ”eder landsman”, och tillägger: ”Ty jag giver honom det vittnesbördet, att han har stor möda för eder likasom ock för dem som bo i Laodicea och i Hierapolis.” Epafras hade uppenbarligen fört evangeliet till alla tre städerna i dalen, som låg inom en dagsmarsch från varandra. Det är det enda omnämnandet av Hierapolis i Bibeln."
    - "Återuppbyggd efter jordbävningen år 60 e.Kr. under Nero blomstrade staden under kejsartiden; den stoiske filosofen Epiktetos föddes där omkring år 50. Eusebios nämner Papias, en tidig samlare av traditioner om evangelierna, som biskop av Hierapolis, och citerar Polykrates av Efesos, som omkring 190 skrev att Filippos, ”en av de tolv apostlarna”, var begravd i Hierapolis med två av sina döttrar. Ett åttkantigt martyrion för Filippos från 400-talet står på kullen utanför de nordöstra murarna, och 2011 tillkännagav Francesco D'Andria en grav i en kyrka i närheten som han tog för Filippos; 2013 fann hans team Plutonium. Italienska utgrävningar började 1957 under Paolo Verzone. Hierapolis-Pamukkale, nära Denizli i Turkiet, står sedan 1988 på Unescos världsarvslista."
  nb:
    - "Hierapolis var en by i Frygia i Lykos-dalen i det vestlige Lilleasia, på en høy terrasse på nordsiden av dalen, overfor Laodikea og noen timers gange fra Kolossai. Det var en hellenistisk grunnleggelse fra 200- eller 100-tallet f.Kr.; noen forskere tilskriver seleukidene, andre attalidene av Pergamon. Dens varme kilder, rike på kalk, har bygd de hvite travertinkaskadene i Pamukkale under ruinene. Strabon beskriver vannet som stivner til stein og Plutonion, en liten åpning full av en damp som drepte ethvert dyr som gikk inn, selv om Kybeles evnukkprester, sier han, gikk inn uskadd."
    - "I brevet til Kolossai sender Paulus hilsen fra Epafras, «han som er fra eders by», og legger til: «for jeg gir ham det vidnesbyrd at han har meget strev for eder og dem i Laodikea og dem i Hierapolis.» Epafras hadde åpenbart brakt evangeliet til alle tre byene i dalen, som lå innenfor en dags gange fra hverandre. Dette er den eneste omtalen av Hierapolis i Bibelen."
    - "Gjenreist etter jordskjelvet i 60 e.Kr. under Nero blomstret byen under keiserriket; den stoiske filosofen Epiktet ble født der omkring 50 e.Kr. Eusebius nevner Papias, en tidlig samler av tradisjoner om evangeliene, som biskop av Hierapolis, og siterer Polykrates av Efesos, som skrev omkring 190 at Filip, «en av de tolv apostler», ble gravlagt i Hierapolis sammen med to av sine døtre. Et åttekantet martyrium for Filip fra 400-tallet står på høyden utenfor de nordøstlige murene, og i 2011 kunngjorde Francesco D'Andria en grav i en kirke i nærheten som han tok for å være Filips; i 2013 fant hans team Plutonion. Italienske utgravninger begynte i 1957 under Paolo Verzone. Hierapolis-Pamukkale, nær Denizli i Tyrkia, har stått på UNESCOs verdensarvliste siden 1988."
  tl:
    - "Ang Hierapolis ay lungsod ng Frigia sa libis ng Lico sa kanlurang Asia Minor, sa isang mataas na patag na burol sa hilagang bahagi ng libis, kaharap ng Laodicea at ilang oras na lakad mula sa Colosas. Itinatag ito noong panahong Helenistiko, noong ika-3 o ika-2 siglo BK; iniuugnay ito ng ilang iskolar sa mga Seleucida, ng iba sa mga haring Attalida ng Pergamo. Ang mainit nitong mga bukal, na mayaman sa apog, ang humubog sa puting travertino na mga talon ng Pamukkale sa ibaba ng mga guho. Inilalarawan ni Strabo ang tubig na tumitigas at nagiging bato at ang Plutonium, isang maliit na butas na punô ng singaw na pumapatay sa anumang hayop na pumasok, bagaman ang mga paring kapon ni Cibeles, ayon sa kaniya, ay pumapasok nang walang pinsala."
    - "Sa pagsulat sa Colosas, ipinaaabot ni Pablo ang bati ni Epafras, “na isa sa inyo”, at idinadagdag: “Sapagka't siya'y binibigyan kong patotoo na siya'y totoong nagpapagal sa inyo, at sa nangasa Laodicea, at sa nangasa Hierapolis.” Maliwanag na dinala ni Epafras ang ebanghelyo sa tatlong lungsod ng libis, na magkakalapit at nasa loob ng isang araw na lakad. Ito ang tanging banggit sa Hierapolis sa Biblia."
    - "Muling itinayo ito matapos ang lindol noong 60 AD sa ilalim ni Nero, at umunlad; dito isinilang si Epicteto na pilosopong Estoiko noong mga 50 AD. Pinangalanan ni Eusebio si Papias, naunang tagapagtipon ng mga tradisyon ng mga Ebanghelyo, na obispo ng Hierapolis, at sinipi si Policrates ng Efeso, na sumulat noong mga 190 na si Felipe, “isa sa labindalawang apostol”, ay nakalibing sa Hierapolis kasama ng dalawa niyang anak na babae. Sa burol sa labas ng hilagang-silangang pader ay may walong-sulok na martyrium ni Felipe noong ika-5 siglo; noong 2011 inihayag ni Francesco D'Andria ang libingang inakalang kay Felipe sa kalapit na simbahan, at noong 2013 nakita ng kaniyang pangkat ang Plutonium. Nagsimula noong 1957 ang paghuhukay ng Italyano sa ilalim ni Paolo Verzone; nasa talaan ng UNESCO World Heritage ang Hierapolis-Pamukkale, malapit sa Denizli, Turkey, mula 1988."
  da:
    - "Hierapolis var en by i Frygien i Lykosdalen i det vestlige Lilleasien, på en høj terrasse på dalens nordside, over for Laodikea og få timers gang fra Kolossæ. Den var en hellenistisk grundlæggelse fra 200-tallet eller 100-tallet f.Kr.; nogle forskere tilskriver seleukiderne, andre Pergamons attalidekonger. Dens varme kilder, rige på kalk, har opbygget Pamukkales hvide travertinkaskader under ruinerne. Strabon beskriver vandet, der hærder til sten, og Plutonium, en lille åbning fuld af en damp, der dræbte ethvert dyr, som gik ind, skønt Kybeles eunukpræster, siger han, gik uskadte ind."
    - "I sit brev til Kolossæ sender Paulus hilsen fra Epafras, »som er fra eders By«, og tilføjer: »Thi jeg giver ham det Vidnesbyrd, at han har megen Møje for eder og dem i Laodikea og dem i Hierapolis.« Epafras havde åbenbart bragt evangeliet til alle tre byer i dalen, som lå inden for en dags gang fra hinanden. Det er det eneste sted, Hierapolis nævnes i Bibelen."
    - "Genopbygget efter jordskælvet i 60 e.Kr. under Nero blomstrede byen under kejserdømmet; den stoiske filosof Epiktet blev født der omkring 50 e.Kr. Eusebios nævner Papias, en tidlig samler af overleveringer om evangelierne, som biskop af Hierapolis og citerer Polykrates af Efesos, som skrev omkring 190, at Filip, »en af de tolv apostle«, blev begravet i Hierapolis sammen med to af sine døtre. Et ottekantet martyrium for Filip fra 400-tallet står på bakken uden for de nordøstlige mure, og i 2011 annoncerede Francesco D'Andria en grav i en kirke i nærheden, som han anså for Filips; i 2013 fandt hans hold Plutonium. Italienske udgravninger begyndte i 1957 under Paolo Verzone. Hierapolis-Pamukkale, nær Denizli i Tyrkiet, har stået på UNESCOs Verdensarvsliste siden 1988."
  sr:
    - "Хијераполис је био град Фригије у долини Лика у западној Малој Азији, на високој тераси на северној страни долине, наспрам Лаодикије и неколико сати хода од Колоса. Основан је у хеленистичко доба, у трећем или другом веку п. н. е.; неки научници заслуге приписују Селеукидима, други пергамским Аталидима. Његови топли извори, богати кречом, изградили су беле травертинске каскаде Памукалеа испод рушевина. Страбон описује воде које се стврдњавају у камен и Плутонијум, мали отвор пун паре која је убијала сваку животињу која је ушла, мада су, каже, евнуси-свештеници Кибеле улазили неповређени."
    - "Пишући Колошанима, Павле шаље поздраве од Епафраса, „који је од вас“, и додаје: „Јер ја сведочим за њега да има велику ревност и бригу за вас и за оне који су у Лаодикији и у Јерапољу.“ Епафрас је очигледно донео јеванђеље у сва три града долине, која су лежала на дан хода једно од другог. То је једини помен Хијераполиса у Библији."
    - "Обновљен после земљотреса 60. н. е. под Нероном, град је напредовао под царством; стоички филозоф Епиктет рођен је ту око 50. н. е. Јевсевије именује Папију, раног сакупљача предања о јеванђељима, као епископа Хијераполиса и цитира Поликрата Ефеског, који је око 190. писао да је Филип, „један од дванаест апостола“, сахрањен у Хијераполису са две своје кћери. Осмоугаони мартиријум Филипа из петог века стоји на брду изван североисточних зидина, а 2011. Франческо Д'Андрија објавио је гробницу у оближњој цркви коју је узео за Филипову; 2013. његов тим је нашао Плутонијум. Италијанска ископавања почела су 1957. под Паолом Верцонеом. Хијераполис-Памукале, близу Денизлија у Турској, налази се на УНЕСКО-вој листи светске баштине од 1988."
  hu:
    - "Hierapolisz Frígia városa volt a Lükosz-völgyben, Kis-Ázsia nyugati részén, a völgy északi oldalán egy magas teraszon, Laodiceával szemben és Kolosszétól néhány órányi járásra. Hellenisztikus alapítású volt a Kr. e. 3. vagy 2. századból; egyes kutatók a Szeleukidáknak, mások a pergamoni Attalidáknak tulajdonítják. Mészben gazdag forró forrásai építették a romok alatti Pamukkale fehér travertin-lépcsőit. Sztrabón leírja a kővé keményedő vizeket és a Plutóniumot, egy kis nyílást, amely tele volt a bele hatoló minden állatot megölő gőzzel, bár Kübelé eunuch papjai, mondja, sértetlenül bementek."
    - "A Kolosszéba írva Pál Epafrász üdvözletét küldi, „ki ti közületek való”, és hozzáteszi: „Mert bizonyságot teszek ő felőle, hogy sokat fárad érettetek és azokért, kik Laodiczeában és Jerápolisban vannak.” Epafrász nyilván a völgy mindhárom városába elvitte az evangéliumot, amelyek egy napi járóföldön belül feküdtek egymástól. Ez Hierapolisz egyetlen említése a Bibliában."
    - "A Kr. u. 60-as földrengés után Nero alatt újjáépített város a császárság alatt virágzott; a sztoikus filozófus, Epiktétosz Kr. u. 50 körül itt született. Eusebius Papiászt, az evangéliumokról szóló hagyományok korai gyűjtőjét nevezi meg Hierapolisz püspökeként, és idézi az efezusi Polükratészt, aki 190 körül azt írta, hogy Fülöp, „a tizenkét apostol egyike”, két leányával együtt Hierapoliszban van eltemetve. Fülöp 5. századi nyolcszögletű martyriuma az északkeleti falakon kívüli dombon áll, és 2011-ben Francesco D'Andria bejelentett egy sírt egy közeli templomban, amelyet Fülöpének tartott; 2013-ban csapata megtalálta a Plutóniumot. Az olasz ásatások 1957-ben kezdődtek Paolo Verzone vezetésével. A törökországi Denizli melletti Hierapolisz-Pamukkale 1988 óta szerepel az UNESCO Világörökségi listáján."
  fi:
    - "Hierapolis oli Fryygian kaupunki Lykoksen laaksossa Länsi-Vähässä-Aasiassa, korkealla terassilla laakson pohjoispuolella, Laodikeaa vastapäätä ja muutaman tunnin kävelymatkan päässä Kolossaista. Se oli hellenistinen perustus 200- tai 100-luvulta eaa.; jotkut tutkijat pitävät sen perustajina seleukideja, toiset Pergamonin Attalos-kuninkaita. Sen kalkkipitoiset kuumat lähteet ovat rakentaneet raunioiden alapuolelle Pamukkalen valkoiset travertiinikaskadit. Strabon kuvaa kiveksi kovettuvaa vettä ja Ploutonionia, pientä aukkoa, joka oli täynnä höyryä, joka tappoi jokaisen siihen menneen eläimen, vaikka Kybelen kastroidut papit, hän sanoo, menivät sinne vahingoittumatta."
    - "Kirjoittaessaan Kolossaihin Paavali lähettää tervehdyksen Epafrakselta, joka on ”teikäläinen”, ja lisää: ”Sillä minä annan hänestä sen todistuksen, että hän näkee paljon vaivaa teidän hyväksenne ja niiden hyväksi, jotka ovat Laodikeassa, sekä niiden, jotka ovat Hierapolissa.” Epafras oli ilmeisesti tuonut evankeliumin kaikkiin laakson kolmeen kaupunkiin, jotka sijaitsivat päivämatkan sisällä toisistaan. Tämä on Hierapoliksen ainoa maininta Raamatussa."
    - "Neron aikaisen vuoden 60 jaa. maanjäristyksen jälkeen uudelleen rakennettu kaupunki vaurastui keisarikunnan aikana; stoalainen filosofi Epiktetos syntyi siellä noin vuonna 50 jaa. Eusebios nimeää Papiaksen, evankeliumiperinteen varhaisen kerääjän, Hierapoliksen piispaksi ja lainaa Efesoksen Polykratesta, joka kirjoitti noin vuonna 190, että Filippos, ”yksi kahdestatoista apostolista”, oli haudattu Hierapolikseen kahden tyttärensä kanssa. 400-luvun kahdeksankulmainen Filippoksen marttyyrikirkko seisoo kukkulalla koillisten muurien ulkopuolella, ja vuonna 2011 Francesco D'Andria ilmoitti läheisestä kirkosta haudan, jonka hän piti Filippoksen haudana; vuonna 2013 hänen ryhmänsä löysi Ploutonionin. Italialaiset kaivaukset alkoivat vuonna 1957 Paolo Verzonen johdolla. Hierapolis-Pamukkale Denizlin lähellä Turkissa on ollut UNESCOn maailmanperintöluettelossa vuodesta 1988."
  vi:
    - "Hi-ê-ra-bô-li là một thành của Phi-ri-gi trong thung lũng Lycus ở tây Tiểu Á, trên một bậc thềm cao ở phía bắc thung lũng, đối diện Lao-đi-xê và cách Cô-lô-se vài giờ đi bộ. Đó là nền lập thời Hy Lạp hóa vào thế kỷ 3 hoặc 2 TCN; một số học giả ghi công cho nhà Seleucid, những người khác cho các vua Attalid của Bẹt-găm. Các suối nước nóng giàu vôi của thành đã tạo nên các bậc thang travertine trắng Pamukkale bên dưới tàn tích. Strabo mô tả những dòng nước cứng lại thành đá và Plutonium, một lỗ nhỏ đầy hơi độc giết mọi con vật đi vào, dù ông nói các thầy tế lễ hoạn của Cybele vào mà không hề hấn gì."
    - "Viết cho Cô-lô-se, Phao-lô gửi lời chào của Ê-pháp-ra, “người hàng xứ với anh em”, và thêm: “Vì tôi làm chứng cho người rằng, người làm việc rất là khó nhọc vì anh em, lại vì người Lao-đi-xê và người Hi-ê-ra-bô-li nữa”. Ê-pháp-ra hiển nhiên đã đem Tin Lành đến cả ba thành của thung lũng, cách nhau trong vòng một ngày đi bộ. Đây là lần duy nhất Hi-ê-ra-bô-li được nhắc đến trong Kinh Thánh."
    - "Được xây lại sau trận động đất năm 60 dưới thời Nero, thành thịnh vượng dưới đế quốc; triết gia phái Stoic Epictetus sinh ở đó khoảng năm 50. Eusebius nêu Papias, người sưu tập sớm các truyền thống về các sách Phúc Âm, là giám mục Hi-ê-ra-bô-li, và trích Polycrates xứ Ê-phê-sô, người viết khoảng năm 190 rằng Phi-líp, “một trong mười hai sứ đồ”, được chôn ở Hi-ê-ra-bô-li cùng hai con gái. Một martyrium hình bát giác thế kỷ 5 của Phi-líp đứng trên đồi ngoài tường đông bắc, và năm 2011 Francesco D'Andria công bố một ngôi mộ trong một nhà thờ gần đó mà ông cho là của Phi-líp; năm 2013 nhóm của ông tìm thấy Plutonium. Các cuộc khai quật của Ý bắt đầu năm 1957 dưới Paolo Verzone. Hierapolis-Pamukkale, gần Denizli ở Thổ Nhĩ Kỳ, nằm trong danh sách Di sản Thế giới của UNESCO từ năm 1988."
  ro:
    - "Hierapole era un oraș al Frigiei, în valea Lycusului din vestul Asiei Mici, pe o terasă înaltă de pe latura de nord a văii, în fața Laodiceei și la câteva ore de mers de Colose. A fost o întemeiere elenistică din secolul al III-lea sau al II-lea î.Hr.; unii cercetători o atribuie seleucizilor, alții regilor atalizi ai Pergamului. Izvoarele ei termale, bogate în calcar, au construit cascadele albe de travertin de la Pamukkale, dedesubtul ruinelor. Strabon descrie apele care se întăresc în piatră și Plutoniul, o mică deschidere plină de un abur care ucidea orice animal care intra, deși preoții eunuci ai Cibelei, spune el, intrau nevătămați."
    - "Scriind către Colose, Pavel trimite salutări de la Epafras, „care este dintre voi”, și adaugă: „Că mărturisesc de dânsul, că are râvnă multă pentru voi, și pentru cei din Laodichia și din Ierapoli”. Epafras adusese, se pare, Evanghelia în toate cele trei orașe ale văii, aflate la o zi de mers unul de altul. Aceasta este singura pomenire a Hierapolei în Biblie."
    - "Reconstruit după cutremurul din 60 d.Hr., sub Nero, orașul a prosperat sub imperiu; filosoful stoic Epictet s-a născut acolo în jurul anului 50 d.Hr. Eusebiu îl numește pe Papias, un timpuriu culegător de tradiții despre Evanghelii, episcop al Hierapolei și îl citează pe Polycrate din Efes, care scria în jurul anului 190 că Filip, „unul dintre cei doisprezece apostoli”, a fost îngropat la Hierapole cu două dintre fiicele sale. Un martyrium octogonal al lui Filip din secolul al V-lea se află pe dealul din afara zidurilor nord-estice, iar în 2011 Francesco D'Andria a anunțat un mormânt într-o biserică din apropiere, pe care l-a socotit al lui Filip; în 2013 echipa lui a găsit Plutoniul. Săpăturile italiene au început în 1957 sub Paolo Verzone. Hierapolis-Pamukkale, lângă Denizli, în Turcia, se află din 1988 pe lista Patrimoniului Mondial UNESCO."
  bg:
    - "Йерапол беше град във Фригия в долината на Лик в западна Мала Азия, на висока тераса на северната страна на долината, срещу Лаодикия и на няколко часа път пеша от Колоса. Той е елинистическо основаване от III или II в. пр.н.е.; някои учени го приписват на Селевкидите, други — на Аталидските царе на Пергам. Горещите му извори, богати на вар, са изградили белите травертинови каскади на Памуккале под развалините. Страбон описва водите, които се втвърдяват в камък, и Плутониона — малък отвор, пълен с пара, която убивала всяко животно, влязло вътре, макар скопените жреци на Кибела, казва той, да влизали невредими."
    - "Пишейки до Колоса, Павел предава поздрави от Епафрас, „който е от вас“, и добавя: „Защото свидетелствувам за него че има голема ревност за вас и за тези които са в Лаодикия и в Иеропол.“ Очевидно Епафрас беше донесъл евангелието и в трите града на долината, които лежаха на един ден път пеша един от друг. Това е единственото споменаване на Йерапол в Библията."
    - "Възстановен след земетресението от 60 г. н.е. при Нерон, градът процъфтяваше при империята; стоическият философ Епиктет е роден там около 50 г. н.е. Евсевий назовава Папий, ранен събирач на предания за Евангелията, като епископ на Йерапол и цитира Поликрат Ефески, който около 190 г. пише, че Филип, „един от дванадесетте апостоли“, е погребан в Йерапол с две от дъщерите си. Осмоъгълен мартириум на Филип от V в. стои на хълма извън североизточните стени, а през 2011 г. Франческо д'Андрия обяви гробница в близка църква, която смяташе за гроба на Филип; през 2013 г. екипът му откри Плутониона. Италианските разкопки започнаха през 1957 г. под ръководството на Паоло Верцоне. Йерапол-Памуккале, близо до Денизли в Турция, е в списъка на световното наследство на ЮНЕСКО от 1988 г."
