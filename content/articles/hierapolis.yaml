# Overview article (ADR 0007). The site at Pamukkale is certain; the founder (Seleucid or Attalid) is debated, and the Philip of Polycrates' letter may be the evangelist rather than the apostle.
id: hierapolis
place: a11bbbe
title:
  en: "Hierapolis"
  ru: "Иераполь"
  uk: "Ієраполіс"
  es: "Hierápolis"
  pt: "Hierápolis"
  de: "Hierapolis"
