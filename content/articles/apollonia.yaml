body:
  en:
    - "Apollonia was a town of Mygdonia in Macedonia, south of Lake Bolbe, today Lake Volvi, on the Via Egnatia between Amphipolis and Thessalonica; the Roman itineraries put it 30 or 33 Roman miles from Amphipolis and 36 or 38 from Thessalonica. Its remains lie at Bountroumia, between the villages of Apollonia, Nea Apollonia and Kokkalou. Nikolaos Moutsopoulos located the site in the 1980s, and a Latin inscription with a letter of the emperor Hadrian naming the city settled the question; Fanoula Papazoglou had already placed the town on the south shore of the lake, near Polina."
    - "Acts mentions the town only in passing. After Philippi, Paul and Silas went on along the road: “when they had passed through Amphipolis and Apollonia, they came to Thessalonica, where was a synagogue of the Jews”. Luke records no stay or preaching there. A local tradition nevertheless shows a rock by the ancient site, with a great plane tree on it, from which Paul is said to have preached, the so-called Bema of the Apostle Paul."
    - "Xenophon names an Apollonia with Acanthus as the largest cities near Olynthus, whose envoys went to Sparta in 382 BC; the Greek archaeological service takes it to be this town. Excavations of the archaeological service between 1991 and 2010 traced parts of a city wall enclosing about 33 hectares, with cemeteries outside it; the finds from the site include Archaic and Early Classical pottery kilns, a gold wreath of ivy leaves of the fourth century BC, a marble Nike of the second century BC and a looted Macedonian tomb. A Latin inscription records a hostelry for travellers and another the water supply, and an Early Christian basilica shows that the town lived on into late antiquity."
  ru:
    - "Аполлония была городом Мигдонии в Македонии, к югу от озера Болба, ныне Волви, на Эгнатиевой дороге между Амфиполем и Фессалоникой; римские дорожники считают от неё 30 или 33 римские мили до Амфиполя и 36 или 38 до Фессалоники. Её развалины лежат в местности Бундрумья, между сёлами Аполлония, Неа-Аполлония и Коккалу. Николаос Муцопулос определил это место в 1980-е гг., а латинская надпись с письмом императора Адриана, где назван город, решила вопрос; ещё Фанула Папазоглу помещала город на южном берегу озера, у Полины."
    - "Деяния упоминают город мимоходом. После Филипп Павел и Сила пошли дальше по дороге: «Прошедши через Амфиполь и Аполлонию, они пришли в Фессалонику, где была Иудейская синагога». Лука не говорит ни об остановке, ни о проповеди здесь. Тем не менее местное предание показывает у древнего городища скалу с большим платаном, с которой будто бы проповедовал Павел, — так называемую кафедру апостола Павла."
    - "Ксенофонт называет Аполлонию вместе с Аканфом крупнейшими городами близ Олинфа, послы которых в 382 г. до н. э. пришли в Спарту; греческая археологическая служба считает, что речь об этом городе. Её раскопки 1991–2010 гг. проследили отрезки городской стены, охватывавшей около 33 га, с кладбищами за ней; среди находок с городища — гончарные печи архаической и раннеклассической эпохи, золотой венок из листьев плюща IV в. до н. э., мраморная Ника II в. до н. э. и разграбленная македонская гробница. Латинская надпись говорит о постоялом дворе для путников, другая — о водопроводе, а раннехристианская базилика показывает, что город жил и в поздней античности."
  uk:
    - "Аполлонія була містом Мігдонії в Македонії, на південь від озера Болбе, нині Волві, на Егнатієвій дорозі між Амфіполісом і Салоніками; римські дорожники ставлять її за 30 або 33 римські милі від Амфіполіса та за 36 або 38 від Салонік. Її рештки лежать у Бунтрумії, між селами Аполлонія, Неа-Аполлонія й Коккалу. Ніколаос Мутсопулос визначив місце в 1980-х рр., а латинський напис із листом імператора Адріана, що називає місто, розв'язав питання; Фануля Папазоглу вже раніше поміщала місто на південному березі озера, поблизу Поліни."
    - "Діяння згадують місто лише побіжно. Після Філіппів Павло й Сила рушили далі дорогою: «Перейшовши ж Амфиполь та Аполонию, прийшли в Солунь, де була школа Жидівська». Лука не пише ні про зупинку, ні про проповідь там. Проте місцеве передання показує біля давнього міста скелю з великим платаном на ній, з якої нібито проповідував Павло, — так звану Біму апостола Павла."
    - "Ксенофонт називає Аполлонію разом з Акантом найбільшими містами поблизу Олінфа, чиї посли вирушили до Спарти 382 р. до н. е.; грецька археологічна служба вважає, що йдеться саме про це місто. Розкопки археологічної служби 1991–2010 рр. простежили частини міського муру, що огороджував близько 33 гектарів, із цвинтарями поза ним; серед знахідок із городища — печі для випалу кераміки архаїчної та ранньокласичної доби, золотий вінок із плющових листків IV ст. до н. е., мармурова Ніка II ст. до н. е. та пограбована македонська гробниця. Латинський напис згадує заїзд для мандрівників, інший — водопостачання, а ранньохристиянська базиліка свідчить, що місто жило й у пізню античність."
  es:
    - "Apolonia era una ciudad de Migdonia, en Macedonia, al sur del lago Bolbe, hoy lago Volvi, en la Vía Egnatia entre Anfípolis y Tesalónica; los itinerarios romanos la sitúan a 30 o 33 millas romanas de Anfípolis y a 36 o 38 de Tesalónica. Sus restos yacen en Bountroumia, entre las aldeas de Apolonia, Nea Apolonia y Kokkalou. Nikolaos Moutsopoulos localizó el sitio en la década de 1980, y una inscripción latina con una carta del emperador Adriano que nombra la ciudad zanjó la cuestión; Fanoula Papazoglou ya había situado la ciudad en la orilla sur del lago, cerca de Polina."
    - "Los Hechos mencionan la ciudad solo de pasada. Después de Filipos, Pablo y Silas siguieron por el camino: «pasando por Amphípolis y Apolonia, llegaron á Tesalónica, donde estaba la sinagoga de los Judíos». Lucas no registra allí estancia ni predicación. Sin embargo, una tradición local muestra junto al antiguo emplazamiento una roca con un gran plátano encima, desde la cual se dice que predicó Pablo, el llamado Bema del Apóstol Pablo."
    - "Jenofonte nombra una Apolonia, con Acanto, como las mayores ciudades cercanas a Olinto, cuyos enviados fueron a Esparta en 382 a. C.; el servicio arqueológico griego la considera esta ciudad. Las excavaciones del servicio arqueológico entre 1991 y 2010 trazaron partes de una muralla que encerraba unas 33 hectáreas, con necrópolis fuera de ella; entre los hallazgos del sitio hay hornos de cerámica de época arcaica y clásica temprana, una corona de oro de hojas de hiedra del siglo IV a. C., una Niké de mármol del siglo II a. C. y una tumba macedonia saqueada. Una inscripción latina registra una posada para viajeros y otra el abastecimiento de agua, y una basílica paleocristiana muestra que la ciudad perduró hasta la Antigüedad tardía."
  pt:
    - "Apolônia era uma cidade da Migdônia, na Macedônia, ao sul do lago Bolbe, hoje lago Volvi, na Via Egnácia entre Anfípolis e Tessalônica; os itinerários romanos a situam a 30 ou 33 milhas romanas de Anfípolis e a 36 ou 38 de Tessalônica. Suas ruínas ficam em Bountroumia, entre as aldeias de Apolônia, Nea Apolônia e Kokkalou. Nikolaos Moutsopoulos localizou o sítio na década de 1980, e uma inscrição latina com uma carta do imperador Adriano que menciona a cidade resolveu a questão; Fanoula Papazoglou já havia situado a cidade na margem sul do lago, perto de Polina."
    - "Atos menciona a cidade apenas de passagem. Depois de Filipos, Paulo e Silas seguiram pela estrada: “Depois de passarem por Anfípolis e Apolônia, chegaram a Tessalônica, onde havia uma sinagoga judaica”. Lucas não registra ali nenhuma estadia nem pregação. Uma tradição local, porém, mostra junto ao sítio antigo uma rocha com um grande plátano, da qual Paulo teria pregado, o chamado Bema do Apóstolo Paulo."
    - "Xenofonte menciona uma Apolônia, junto com Acanto, como as maiores cidades perto de Olinto, cujos enviados foram a Esparta em 382 a.C.; o serviço arqueológico grego a considera esta cidade. Escavações do serviço arqueológico entre 1991 e 2010 revelaram trechos de uma muralha que cercava cerca de 33 hectares, com cemitérios fora dela; entre os achados do sítio estão fornos de cerâmica do período arcaico e do início do clássico, uma coroa de ouro de folhas de hera do século IV a.C., uma Nice de mármore do século II a.C. e um túmulo macedônico saqueado. Uma inscrição latina registra uma hospedaria para viajantes e outra o abastecimento de água, e uma basílica paleocristã mostra que a cidade sobreviveu até a Antiguidade tardia."
  de:
    - "Apollonia war eine Stadt in Mygdonien in Mazedonien, südlich des Sees Bolbe, des heutigen Volvisees, an der Via Egnatia zwischen Amphipolis und Thessalonich; die römischen Itinerare setzen sie 30 oder 33 römische Meilen von Amphipolis und 36 oder 38 von Thessalonich an. Ihre Überreste liegen bei Bountroumia, zwischen den Dörfern Apollonia, Nea Apollonia und Kokkalou. Nikolaos Moutsopoulos lokalisierte die Stätte in den 1980er Jahren, und eine lateinische Inschrift mit einem Brief des Kaisers Hadrian, der die Stadt nennt, entschied die Frage; Fanoula Papazoglou hatte die Stadt schon am Südufer des Sees bei Polina angesetzt."
    - "Die Apostelgeschichte erwähnt die Stadt nur im Vorbeigehen. Nach Philippi zogen Paulus und Silas auf der Straße weiter: „Nachdem sie aber durch Amphipolis und Apollonia gereist waren, kamen sie gen Thessalonich; da war eine Judenschule.“ Lukas berichtet von keinem Aufenthalt und keiner Predigt dort. Eine örtliche Überlieferung zeigt dennoch neben der antiken Stätte einen Felsen mit einer großen Platane, von dem aus Paulus gepredigt haben soll, das sogenannte Bema des Apostels Paulus."
    - "Xenophon nennt ein Apollonia mit Akanthos als die größten Städte in der Nähe von Olynth, deren Gesandte 382 v. Chr. nach Sparta gingen; der griechische Antikendienst hält es für diese Stadt. Grabungen des Antikendienstes zwischen 1991 und 2010 verfolgten Teile einer Stadtmauer, die etwa 33 Hektar umschloss, mit Gräberfeldern außerhalb; zu den Funden von der Stätte gehören archaische und frühklassische Töpferöfen, ein goldener Efeublattkranz des vierten Jahrhunderts v. Chr., eine marmorne Nike des zweiten Jahrhunderts v. Chr. und ein geplündertes makedonisches Grab. Eine lateinische Inschrift verzeichnet eine Herberge für Reisende, eine andere die Wasserversorgung, und eine frühchristliche Basilika zeigt, dass die Stadt bis in die Spätantike fortbestand."
  fr:
    - "Apollonie était une ville de Mygdonie, en Macédoine, au sud du lac Bolbé, aujourd’hui lac Volvi, sur la Via Egnatia entre Amphipolis et Thessalonique ; les itinéraires romains la placent à 30 ou 33 milles romains d’Amphipolis et à 36 ou 38 de Thessalonique. Ses vestiges se trouvent à Bountroumia, entre les villages d’Apollonia, Nea Apollonia et Kokkalou. Nikolaos Moutsopoulos localisa le site dans les années 1980, et une inscription latine portant une lettre de l’empereur Hadrien et nommant la cité trancha la question ; Fanoula Papazoglou avait déjà placé la ville sur la rive sud du lac, près de Polina."
    - "Les Actes ne mentionnent la ville qu’en passant. Après Philippes, Paul et Silas poursuivirent leur route : « Paul et Silas passèrent par Amphipolis et Apollonie, et ils arrivèrent à Thessalonique, où les Juifs avaient une synagogue. » Luc n’y note ni séjour ni prédication. Une tradition locale montre néanmoins près du site antique un rocher, surmonté d’un grand platane, d’où Paul aurait prêché, le Bêma de l’apôtre Paul."
    - "Xénophon nomme une Apollonie avec Acanthe comme les plus grandes cités proches d’Olynthe, dont les envoyés allèrent à Sparte en 382 av. J.-C. ; le service archéologique grec y voit cette ville. Ses fouilles de 1991 à 2010 ont suivi des tronçons d’un rempart enfermant environ 33 hectares, avec des cimetières à l’extérieur ; on a trouvé sur le site des fours de potiers de l’époque archaïque et du début de l’époque classique, une couronne d’or de feuilles de lierre du IVe siècle av. J.-C., une Nikè de marbre du IIe siècle av. J.-C. et une tombe macédonienne pillée. Une inscription latine mentionne une auberge pour les voyageurs, une autre l’adduction d’eau, et une basilique paléochrétienne montre que la ville survécut jusqu’à l’Antiquité tardive."
  it:
    - "Apollonia era una città della Migdonia, in Macedonia, a sud del lago Bolbe, oggi lago Volvi, sulla via Egnazia tra Anfipoli e Tessalonica; gli itinerari romani la pongono a 30 o 33 miglia romane da Anfipoli e a 36 o 38 da Tessalonica. I suoi resti si trovano a Bountroumia, tra i villaggi di Apollonia, Nea Apollonia e Kokkalou. Nikolaos Moutsopoulos individuò il sito negli anni Ottanta, e un’iscrizione latina con una lettera dell’imperatore Adriano che nomina la città risolse la questione; Fanoula Papazoglou aveva già collocato la città sulla riva meridionale del lago, presso Polina."
    - "Gli Atti menzionano la città solo di sfuggita. Dopo Filippi, Paolo e Sila proseguirono lungo la strada: «passati per Amfipoli e per Apollonia, vennero a Tessalonica, dov’era una sinagoga de’ Giudei». Luca non registra alcuna sosta né predicazione. Una tradizione locale mostra tuttavia presso l’antico sito una roccia con sopra un grande platano, da cui Paolo avrebbe predicato, il cosiddetto Bema dell’apostolo Paolo."
    - "Senofonte nomina un’Apollonia insieme ad Acanto come le maggiori città vicine a Olinto, i cui inviati andarono a Sparta nel 382 a.C.; il servizio archeologico greco la ritiene questa città. Gli scavi del servizio archeologico tra il 1991 e il 2010 hanno individuato tratti di una cinta muraria che racchiudeva circa 33 ettari, con necropoli all’esterno; tra i reperti dal sito vi sono fornaci per ceramica di epoca arcaica e protoclassica, una corona d’oro di foglie d’edera del IV secolo a.C., una Nike di marmo del II secolo a.C. e una tomba macedone depredata. Un’iscrizione latina ricorda un ospizio per viaggiatori e un’altra l’approvvigionamento idrico, e una basilica paleocristiana mostra che la città sopravvisse fino alla tarda antichità."
  nl:
    - "Apollonia was een stad in Mygdonië in Macedonië, ten zuiden van het meer van Bolbe, tegenwoordig het meer van Volvi, aan de Via Egnatia tussen Amfipolis en Tessalonica; de Romeinse reisgidsen plaatsen haar op 30 of 33 Romeinse mijlen van Amfipolis en 36 of 38 van Tessalonica. De resten liggen bij Bountroumia, tussen de dorpen Apollonia, Nea Apollonia en Kokkalou. Nikolaos Moutsopoulos lokaliseerde de plaats in de jaren tachtig, en een Latijnse inscriptie met een brief van keizer Hadrianus waarin de stad wordt genoemd, besliste de kwestie; Fanoula Papazoglou had de stad al op de zuidoever van het meer, bij Polina, geplaatst."
    - "Handelingen vermeldt de stad slechts terloops. Na Filippi vervolgden Paulus en Silas hun weg langs de weg: “door Amfipolis en Apollonia hun weg genomen hebbende, kwamen zij te Thessalonica, alwaar een synagoge der Joden was”. Lukas vermeldt er geen verblijf of prediking. Toch toont een plaatselijke overlevering bij de antieke plaats een rots met een grote plataan erop, vanwaar Paulus zou hebben gepredikt, de zogeheten Bema van de apostel Paulus."
    - "Xenofon noemt een Apollonia met Acanthus als de grootste steden bij Olynthus, wier gezanten in 382 v.Chr. naar Sparta gingen; de Griekse archeologische dienst houdt haar voor deze stad. Opgravingen van de archeologische dienst tussen 1991 en 2010 brachten delen van een stadsmuur aan het licht die ongeveer 33 hectare omsloot, met begraafplaatsen daarbuiten; de vondsten van de vindplaats omvatten pottenbakkersovens uit de archaïsche en vroeg-klassieke tijd, een gouden krans van klimopbladeren uit de vierde eeuw v.Chr., een marmeren Nike uit de tweede eeuw v.Chr. en een geplunderd Macedonisch graf. Een Latijnse inscriptie vermeldt een herberg voor reizigers en een andere de watervoorziening, en een vroegchristelijke basiliek toont dat de stad tot in de late oudheid voortbestond."
  pl:
    - "Apollonia było miastem Mygdonii w Macedonii, na południe od jeziora Bolbe, dziś Volvi, przy Via Egnatia między Amfipolis a Tesaloniką; rzymskie itineraria umieszczają je 30 lub 33 mile rzymskie od Amfipolis i 36 lub 38 od Tesaloniki. Jego pozostałości leżą w Buntrumii, między wsiami Apollonia, Nea Apollonia i Kokkalu. Nikolaos Mutsopulos wskazał to miejsce w latach osiemdziesiątych XX wieku, a łaciński napis z listem cesarza Hadriana, wymieniający miasto, rozstrzygnął sprawę; Fanula Papazoglu umieściła już wcześniej miasto na południowym brzegu jeziora, w pobliżu Poliny."
    - "Dzieje Apostolskie wspominają miasto tylko mimochodem. Po Filippi Paweł i Sylas szli dalej drogą: „A przeszedłszy Amfipolim i Apoloniję przyszli do Tesaloniki, gdzie była bóżnica żydowska”. Łukasz nie zapisuje tam ani pobytu, ani nauczania. Miejscowa tradycja pokazuje jednak przy starożytnym stanowisku skałę z wielkim platanem, z której miał nauczać Paweł, tak zwaną Bemę Apostoła Pawła."
    - "Ksenofont wymienia Apollonię wraz z Akantos jako największe miasta w pobliżu Olintu, których posłowie udali się do Sparty w 382 p.n.e.; grecka służba archeologiczna uważa, że chodzi o to miasto. Wykopaliska tej służby w latach 1991-2010 odsłoniły fragmenty muru miejskiego otaczającego około 33 hektary, z cmentarzami poza nim; wśród znalezisk z tego miejsca są piece garncarskie z okresu archaicznego i wczesnoklasycznego, złoty wieniec z liści bluszczu z IV w. p.n.e., marmurowa Nike z II w. p.n.e. i rozgrabiony grobowiec macedoński. Łaciński napis wspomina zajazd dla podróżnych, a inny wodociąg, zaś wczesnochrześcijańska bazylika świadczy, że miasto przetrwało do późnego antyku."
  cs:
    - "Apollonie bylo město v Mygdonii v Makedonii, jižně od jezera Bolbé, dnes Volvi, na Via Egnatia mezi Amfipolí a Tesalonikou; římské itineráře ji kladou 30 nebo 33 římských mil od Amfipole a 36 nebo 38 od Tesaloniky. Její zbytky leží u Buntrumie, mezi vesnicemi Apollonia, Nea Apollonia a Kokkalou. Nikolaos Mutsopulos místo určil v 80. letech 20. století a otázku rozhodl latinský nápis s dopisem císaře Hadriana, který město jmenuje; Fanula Papazoglu už dříve umístila město na jižní břeh jezera, poblíž Poliny."
    - "Skutky zmiňují město jen mimochodem. Po Filipách šli Pavel a Silas dál po cestě: „A prošedše město Amfipolim a Apollonii, přišli do Tessaloniky, kdež byla Židovská škola.“ Lukáš neuvádí žádný pobyt ani kázání. Místní tradice přesto ukazuje u starověkého místa skálu s velkým platanem, z níž prý Pavel kázal, takzvané Béma apoštola Pavla."
    - "Xenofón jmenuje Apollonii spolu s Akanthem jako největší města poblíž Olynthu, jejichž vyslanci odešli roku 382 př. n. l. do Sparty; řecká archeologická služba má za to, že jde o toto město. Vykopávky archeologické služby v letech 1991 až 2010 vysledovaly části hradby obepínající asi 33 hektarů a hřbitovy za ní; nálezy z lokality zahrnují pece na archaickou a raně klasickou keramiku, zlatý věnec z listů břečťanu ze čtvrtého století př. n. l., mramorovou Níké ze druhého století př. n. l. a vyrabovanou makedonskou hrobku. Latinský nápis dosvědčuje hostinec pro pocestné a jiný vodovod a raně křesťanská bazilika ukazuje, že město žilo i v pozdní antice."
  sv:
    - "Apollonia var en stad i Mygdonien i Makedonien, söder om Bolbe-sjön, i dag Volvi-sjön, vid Via Egnatia mellan Amfipolis och Tessalonike; de romerska vägbeskrivningarna placerar den 30 eller 33 romerska mil från Amfipolis och 36 eller 38 från Tessalonike. Dess lämningar ligger vid Bountroumia, mellan byarna Apollonia, Nea Apollonia och Kokkalou. Nikolaos Moutsopoulos lokaliserade platsen på 1980-talet, och en latinsk inskrift med ett brev från kejsar Hadrianus som nämner staden avgjorde frågan; Fanoula Papazoglou hade redan placerat staden på sjöns södra strand, nära Polina."
    - "Apostlagärningarna nämner staden bara i förbigående. Efter Filippi fortsatte Paulus och Silas längs vägen: ”foro över Amfipolis och Apollonia och kommo så till Tessalonika. Där hade judarna en synagoga”. Lukas anger ingen vistelse eller predikan där. En lokal tradition visar ändå en klippa vid den antika platsen, med ett stort platanträd på, varifrån Paulus sägs ha predikat, den så kallade Aposteln Paulus bema."
    - "Xenofon nämner en Apollonia tillsammans med Akanthos som de största städerna nära Olynthos, vars sändebud gick till Sparta år 382 f.Kr.; den grekiska arkeologiska myndigheten antar att det är denna stad. Myndighetens utgrävningar mellan 1991 och 2010 spårade delar av en stadsmur som omslöt omkring 33 hektar, med gravfält utanför; fynden från platsen omfattar keramikugnar från arkaisk och tidigklassisk tid, en guldkrans av murgrönsblad från 300-talet f.Kr., en marmor-Nike från 100-talet f.Kr. och en plundrad makedonisk grav. En latinsk inskrift anger ett härbärge för resande och en annan vattenförsörjningen, och en tidigkristen basilika visar att staden levde vidare in i senantiken."
