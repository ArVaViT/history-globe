body:
  en:
    - "Sidon, today Saida in Lebanon, lies on the Phoenician coast about 40 km south of Beirut and 40 km north of Tyre, on a headland sheltered by small offshore islets that made two harbours. People lived here from prehistoric times; excavations at the College Site since 1998 have uncovered the Bronze Age town and its burials, with goods from Egypt. In the fourteenth century BC its ruler Zimredda appears in the Amarna letters."
    - "In Genesis Sidon is the firstborn of Canaan, and both the Bible and Homer call the Phoenicians Sidonians: Solomon said that none could hew timber like the Sidonians, and Homer praises Sidonian robes and silver. Jezebel was the daughter of Ethbaal, king of the Sidonians, and Elijah lodged with a widow at Zarephath, a town belonging to Sidon. In 701 BC King Luli fled from Sennacherib to Cyprus, in 677 BC Esarhaddon took and destroyed the city, and the next year its king Abdi-Milkutti was beheaded; the prophets spoke against Tyre and Sidon alike."
    - "Under the Persians Sidon was the leading Phoenician city and furnished the finest ships of Xerxes' fleet. Its kings built a temple of the healing god Eshmun outside the city, and the inscribed sarcophagi of Tabnit and Eshmunazar II come from their tombs. Sidon rebelled against Artaxerxes III under King Tennes and was burned, in the mid-fourth century BC (the exact year is disputed). In 333 BC it opened its gates to Alexander, and the carved Alexander Sarcophagus was found in its royal cemetery."
    - "Under the Ptolemies, the Seleucids and then Rome, Sidon minted its own coins and was known for glass and purple dye. People from around Tyre and Sidon came to Jesus; he went into the borders of Tyre and Sidon, where a Syrophoenician woman begged him to cast the devil out of her daughter, and he said that Tyre and Sidon would have repented at his works. On his voyage to Rome Paul was allowed to visit friends at Sidon. Eusebius names Zenobius, a presbyter of the church at Sidon, among the martyrs of the Great Persecution."
  ru:
    - "Сидон, ныне Сайда в Ливане, стоит на финикийском побережье, примерно в 40 км к югу от Бейрута и в 40 км к северу от Тира, на мысу, прикрытом небольшими островками, которые образовали две гавани. Люди жили здесь с доисторических времён; раскопки на так называемом участке Колледжа, идущие с 1998 г., открыли город бронзового века и его погребения с египетскими вещами. В XIV веке до н. э. его правитель Зимредда упоминается в Амарнских письмах."
    - "В книге Бытия Сидон — первенец Ханаана, а Библия и Гомер одинаково называют финикиян сидонянами: Соломон говорил, что никто не умеет рубить дерева так, как сидоняне, а Гомер хвалит сидонские ткани и серебро. Иезавель была дочерью Ефваала, царя Сидонского, а Илия жил у вдовы в Сарепте Сидонской. В 701 г. до н. э. царь Лули бежал от Сеннахирима на Кипр, в 677 г. до н. э. Асардан взял и разрушил город, а на следующий год его царь Абди-Милкути был обезглавлен; пророки возвещали суд и Тиру, и Сидону."
    - "При персах Сидон был первым городом Финикии и дал лучшие корабли флоту Ксеркса. Его цари построили за городом храм бога-целителя Эшмуна, а из их гробниц происходят саркофаги Табнита и Эшмуназара II с надписями. При царе Теннесе Сидон восстал против Артаксеркса III и был сожжён в середине IV века до н. э. (точный год спорный). В 333 г. до н. э. он открыл ворота Александру, а в его царском некрополе был найден резной «саркофаг Александра»."
    - "При Птолемеях, Селевкидах, а затем при Риме Сидон чеканил свою монету и славился стеклом и пурпуром. Жители окрестностей Тира и Сидона приходили к Иисусу; Он приходил в пределы Тирские и Сидонские, где сирофиникиянка просила Его изгнать беса из её дочери, и сказал, что Тир и Сидон покаялись бы, увидев Его дела. По пути в Рим Павлу позволили навестить в Сидоне друзей. Евсевий называет пресвитера сидонской церкви Зиновия среди мучеников Великого гонения."
  uk:
    - "Сідон, нині Сайда в Лівані, лежить на фінікійському узбережжі приблизно за 40 км на південь від Бейрута і за 40 км на північ від Тіру, на мисі, захищеному невеликими острівцями поблизу берега, що утворили дві гавані. Люди жили тут ще з доісторичних часів; розкопки на ділянці Коледжу з 1998 року відкрили місто бронзової доби та його поховання з речами з Єгипту. У XIV ст. до н. е. його правитель Зімрідда з’являється в листах з Амарни."
    - "У Книзі Буття Сідон — первороджений Ханаана, і Біблія, і Гомер називають фінікійців сідонянами: Соломон казав, що ніхто не вміє рубати дерево так, як сідоняни, а Гомер хвалить сідонські шати й срібло. Єзавель була донькою Ефваала, царя сідонського, а Ілля оселився в удови в Сареписі, місті, що належало Сідону. У 701 р. до н. е. цар Лулі втік від Сінаххеріба на Кіпр, у 677 р. до н. е. Асархаддон узяв і зруйнував місто, а наступного року його царя Абді-Мілкутті було обезголовлено; пророки виголошували прокляття на Тір і Сідон нарівні."
    - "За персів Сідон був провідним фінікійським містом і постачав найкращі кораблі флоту Ксеркса. Його царі збудували поза містом храм бога-цілителя Ешмуна, а саркофаги Табніта й Ешмуназара II з написами походять з їхніх гробниць. За царя Теннеса Сідон повстав проти Артаксеркса III і був спалений — у середині IV ст. до н. е. (точний рік спірний). У 333 р. до н. е. він відчинив ворота Александрові, а різьблений Саркофаг Александра знайшли в його царському некрополі."
    - "За Птолемеїв, Селевкідів, а потім Риму Сідон карбував власну монету і славився склом та пурпуровою фарбою. Люди з околиць Тіру й Сідону приходили до Ісуса; Він прийшов на межі Тіру й Сідону, де сирофінікійка благала Його вигнати біса з її доньки, і сказав, що Тір і Сідон покаялися б, побачивши Його діла. Під час плавання до Риму Павлові дозволили відвідати друзів у Сідоні. Євсевій називає Зенобія, пресвітера церкви в Сідоні, серед мучеників Великого гоніння."
  es:
    - "Sidón, hoy Saida, en el Líbano, se encuentra en la costa fenicia, a unos 40 km al sur de Beirut y 40 km al norte de Tiro, en un promontorio protegido por pequeños islotes que formaban dos puertos. Se vivió aquí desde la prehistoria; las excavaciones del College Site, desde 1998, han sacado a la luz la ciudad de la Edad del Bronce y sus sepulturas, con ajuares de Egipto. En el siglo XIV a. C. su gobernante Zimrida aparece en las cartas de Amarna."
    - "En el Génesis, Sidón es el primogénito de Canaán, y tanto la Biblia como Homero llaman sidonios a los fenicios: Salomón dijo que nadie sabía labrar la madera como los sidonios, y Homero alaba los vestidos y la plata sidonios. Jezabel era hija de Et-baal, rey de los sidonios, y Elías se alojó con una viuda en Sarepta, ciudad que pertenecía a Sidón. En 701 a. C. el rey Luli huyó de Senaquerib a Chipre; en 677 a. C. Esar-hadón tomó y destruyó la ciudad, y al año siguiente su rey Abdi-Milkuti fue decapitado; los profetas hablaron contra Tiro y contra Sidón por igual."
    - "Bajo los persas, Sidón fue la principal ciudad fenicia y aportó los mejores barcos de la flota de Jerjes. Sus reyes edificaron fuera de la ciudad un templo del dios sanador Eshmún, y los sarcófagos con inscripciones de Tabnit y de Eshmunazar II proceden de sus tumbas. Sidón se rebeló contra Artajerjes III bajo el rey Tennes y fue incendiada, a mediados del siglo IV a. C. (el año exacto se discute). En 333 a. C. abrió sus puertas a Alejandro, y el Sarcófago de Alejandro, tallado, se halló en su cementerio real."
    - "Bajo los Ptolomeos, los seléucidas y luego Roma, Sidón acuñó moneda propia y era conocida por su vidrio y su tinte de púrpura. Gente de los alrededores de Tiro y de Sidón acudió a Jesús; él fue a los términos de Tiro y de Sidón, donde una mujer sirofenicia le rogó que echase el demonio de su hija, y dijo que Tiro y Sidón se habrían arrepentido ante sus obras. En su viaje a Roma, a Pablo se le permitió visitar a unos amigos en Sidón. Eusebio nombra a Zenobio, presbítero de la iglesia de Sidón, entre los mártires de la Gran Persecución."
  pt:
    - "Sidom, hoje Saida, no Líbano, fica na costa da Fenícia, a cerca de 40 km ao sul de Beirute e 40 km ao norte de Tiro, num promontório protegido por pequenas ilhotas que formavam dois portos. Há ocupação humana desde a pré-história; as escavações do College Site, desde 1998, revelaram a cidade da Idade do Bronze e seus sepultamentos, com objetos do Egito. No século XIV a.C., seu governante Zimreda aparece nas cartas de Amarna."
    - "Em Gênesis, Sidom é o primogênito de Canaã, e tanto a Bíblia como Homero chamam os fenícios de sidônios: Salomão disse que ninguém sabia cortar madeira como os sidônios, e Homero elogia as vestes e a prata sidônias. Jezabel era filha de Etbaal, rei dos sidônios, e Elias hospedou-se com uma viúva em Sarepta, cidade pertencente a Sidom. Em 701 a.C. o rei Luli fugiu de Senaqueribe para Chipre; em 677 a.C. Esar-Hadom tomou e destruiu a cidade, e no ano seguinte seu rei Abdi-Milcute foi decapitado; os profetas falaram tanto contra Tiro como contra Sidom."
    - "Sob os persas, Sidom foi a principal cidade fenícia e forneceu os melhores navios da frota de Xerxes. Seus reis construíram fora da cidade um templo ao deus curador Eshmun, e os sarcófagos com inscrições de Tabnite e Eshmunazar II vêm de seus túmulos. Sidom revoltou-se contra Artaxerxes III sob o rei Tennes e foi incendiada em meados do século IV a.C. (o ano exato é discutido). Em 333 a.C. abriu as portas a Alexandre, e o Sarcófago de Alexandre, esculpido, foi encontrado em seu cemitério real."
    - "Sob os ptolomeus, os selêucidas e depois Roma, Sidom cunhou moeda própria e era conhecida pelo vidro e pela tinta púrpura. Gente dos arredores de Tiro e Sidom foi a Jesus; ele foi às fronteiras de Tiro e Sidom, onde uma mulher siro-fenícia lhe pediu que expulsasse o demônio de sua filha, e disse que Tiro e Sidom teriam se arrependido diante de suas obras. Na viagem a Roma, Paulo recebeu permissão para visitar amigos em Sidom. Eusébio cita Zenóbio, presbítero da igreja de Sidom, entre os mártires da Grande Perseguição."
  de:
    - "Sidon, heute Saida im Libanon, liegt an der phönizischen Küste etwa 40 km südlich von Beirut und 40 km nördlich von Tyrus auf einer Landzunge, die kleine vorgelagerte Inseln schützen und die zwei Häfen entstehen ließen. Schon seit prähistorischer Zeit lebten hier Menschen; Grabungen am College Site seit 1998 haben die bronzezeitliche Stadt und ihre Gräber mit Beigaben aus Ägypten freigelegt. Im 14. Jahrhundert v. Chr. erscheint ihr Herrscher Zimredda in den Amarna-Briefen."
    - "In der Genesis ist Sidon der Erstgeborene Kanaans, und sowohl die Bibel als auch Homer nennen die Phönizier Sidonier: Salomo sagte, niemand verstehe es, Holz zu hauen wie die Sidonier, und Homer rühmt sidonische Gewänder und Silber. Isebel war die Tochter Ethbaals, des Königs der Sidonier, und Elia wohnte bei einer Witwe in Sarepta, einer Stadt, die zu Sidon gehörte. 701 v. Chr. floh König Luli vor Sanherib nach Zypern, 677 v. Chr. nahm Asarhaddon die Stadt ein und zerstörte sie, und im Jahr darauf wurde ihr König Abdi-Milkutti enthauptet; die Propheten sprachen gegen Tyrus und Sidon gleichermaßen."
    - "Unter den Persern war Sidon die führende phönizische Stadt und stellte die besten Schiffe der Flotte des Xerxes. Seine Könige errichteten außerhalb der Stadt einen Tempel des Heilgottes Eschmun, und die beschrifteten Sarkophage von Tabnit und Eschmunazar II. stammen aus ihren Gräbern. Sidon erhob sich unter König Tennes gegen Artaxerxes III. und wurde Mitte des vierten Jahrhunderts v. Chr. niedergebrannt (das genaue Jahr ist umstritten). 333 v. Chr. öffnete es Alexander die Tore, und der reliefgeschmückte Alexandersarkophag wurde in seiner königlichen Nekropole gefunden."
    - "Unter den Ptolemäern, den Seleukiden und dann Rom prägte Sidon eigene Münzen und war für Glas und Purpurfarbstoff bekannt. Menschen aus der Gegend von Tyrus und Sidon kamen zu Jesus; er ging in das Gebiet von Tyrus und Sidon, wo eine syrophönizische Frau ihn bat, den Teufel aus ihrer Tochter auszutreiben, und er sagte, Tyrus und Sidon hätten bei seinen Taten Buße getan. Auf seiner Reise nach Rom durfte Paulus Freunde in Sidon besuchen. Eusebius nennt Zenobius, einen Presbyter der Gemeinde von Sidon, unter den Märtyrern der Großen Verfolgung."
  fr:
    - "Sidon, aujourd’hui Saïda au Liban, s’étend sur la côte phénicienne à environ 40 km au sud de Beyrouth et à 40 km au nord de Tyr, sur un promontoire abrité par de petits îlots qui formaient deux ports. On y vit depuis la préhistoire ; les fouilles du College Site, depuis 1998, ont mis au jour la ville de l’âge du bronze et ses sépultures, avec des objets venus d’Égypte. Au XIVe siècle av. J.-C., son souverain Zimredda figure dans les lettres d’Amarna."
    - "Dans la Genèse, Sidon est le premier-né de Canaan, et la Bible comme Homère appellent les Phéniciens des Sidoniens : Salomon disait que nul ne savait couper le bois comme les Sidoniens, et Homère vante les robes et l’argenterie sidoniennes. Jézabel était la fille d’Ethbaal, roi des Sidoniens, et Élie logea chez une veuve de Sarepta, ville de Sidon. En 701 av. J.-C., le roi Luli s’enfuit à Chypre devant Sanchérib ; en 677 av. J.-C., Esar-Haddon prit et détruisit la ville, et l’année suivante son roi Abdi-Milkutti fut décapité ; les prophètes parlèrent contre Tyr et contre Sidon."
    - "Sous les Perses, Sidon fut la première cité phénicienne et fournit les plus beaux navires de la flotte de Xerxès. Ses rois bâtirent hors de la ville un temple du dieu guérisseur Eshmoun, et les sarcophages inscrits de Tabnit et d’Eshmunazar II viennent de leurs tombes. Sidon se révolta contre Artaxerxès III sous le roi Tennès et fut incendiée, au milieu du IVe siècle av. J.-C. (l’année exacte est discutée). En 333 av. J.-C., elle ouvrit ses portes à Alexandre, et le sarcophage sculpté dit d’Alexandre fut trouvé dans sa nécropole royale."
    - "Sous les Ptolémées, les Séleucides, puis Rome, Sidon frappa ses propres monnaies et fut réputée pour son verre et sa pourpre. Des gens des environs de Tyr et de Sidon vinrent à Jésus ; il alla dans le territoire de Tyr et de Sidon, où une Syro-Phénicienne le pria de chasser le démon hors de sa fille, et il dit que Tyr et Sidon se seraient repenties devant ses œuvres. Lors de son voyage vers Rome, Paul put rendre visite à des amis à Sidon. Eusèbe nomme Zénobe, presbytre de l’Église de Sidon, parmi les martyrs de la Grande Persécution."
