body:
  en:
    - "Aijalon was a town of the Shephelah, reckoned at different times to Dan, Ephraim and Benjamin, at the upper end of the valley that bears its name, the main approach from the coastal plain up to Gibeon and Jerusalem. It is usually identified with Yalo, the Arab village that kept the name, on a spur above the valley about 20 km west of Jerusalem; the small tell beside it, Tell el-Qoqa, has also been proposed, and Khirbet Haiyan near Ai is a distant third. The town appears in the fourteenth century BC in the Amarna letters as Ayyaluna, named among the towns threatened by the Apiru, near which the king of Jerusalem complained that his caravan had been robbed, and in the list of towns taken by Shoshenq I, the Shishak of the Bible, about 925 BC."
    - "In Joshua's battle for Gibeon the moon stood still “in the valley of Ajalon”. The town was allotted to Dan and given with its pastures to the Levites of Kohath, but “the Amorites would dwell in mount Heres in Aijalon, and in Shaalbim” until the house of Joseph made them tributaries. After the battle at the pass of Michmash Saul's men pursued the Philistines “from Michmash to Aijalon”. Chronicles names Benjaminite clans “of the inhabitants of Aijalon, who drove away the inhabitants of Gath”. Rehoboam fortified it among his fenced cities “in Judah and in Benjamin”, and in the days of Ahaz the Philistines took it together with Beth-shemesh, Timnah and other towns of the Shephelah."
    - "Eusebius knew a village Alon near Nicopolis (Emmaus). The valley below it has seen armies pass from Judas Maccabeus to the Crusaders, and in 1948 the fighting for the Latrun salient. Yalo and its neighbours Imwas and Beit Nuba were destroyed in June 1967, and their lands now lie in Canada Park (Ayalon Park) beside the Tel Aviv-Jerusalem highway."
  ru:
    - "Аиалон — город Шефелы, причислявшийся в разное время к Дану, Ефрему и Вениамину, в верхнем конце долины, носящей его имя, — главного подъёма с приморской равнины к Гаваону и Иерусалиму. Обычно его отождествляют с Яло, арабской деревней, сохранившей имя, на отроге над долиной примерно в 20 км к западу от Иерусалима; предлагали и небольшой телль рядом с ней, Телль-эль-Кока, а Хирбет-Хайян близ Гая — далёкий третий вариант. Город упоминается в XIV веке до н. э. в письмах из Амарны как Айялуна, которая названа среди городов, которым угрожали хапиру, и близ которой, как жаловался царь Иерусалима, ограбили его караван, и в списке городов, взятых Шешонком I, библейским Сусакимом, около 925 г. до н. э."
    - "В битве Иисуса Навина за Гаваон луна остановилась «над долиною Аиалонскою». Город достался Дану и был отдан с предместьями левитам из рода Каафа, но «остались Аморреи жить на горе Херес... в Аиалоне и Шаалвиме», пока сыны Иосифовы не сделали их данниками. После битвы у теснины Михмаса люди Саула поражали Филистимлян «от Михмаса до Аиалона». Паралипоменон называет вениамитские роды — «главами поколений жителей Аиалона», которые «выгнали жителей Гефа». Ровоам укрепил его среди своих крепостей «в колене Иудином и Вениаминовом», а во дни Ахаза Филистимляне взяли его вместе с Вефсамисом, Фимной и другими городами Шефелы."
    - "Евсевий знал селение Алон близ Никополя (Эммауса). По долине под ним проходили войска от Иуды Маккавея до крестоносцев, а в 1948 году здесь шли бои за латрунский выступ. Яло и соседние Имвас и Бейт-Нуба были разрушены в июне 1967 года, и их земли теперь лежат в парке Канада (Аялон) у шоссе Тель-Авив — Иерусалим."
  uk:
    - "Аялон було містом Шефели, яке в різний час зараховували до Дану, Єфрема і Веніяміна; він лежав на верхньому кінці долини, що носить його назву, — головного підходу від прибережної рівнини до Гаваона та Єрусалима. Його зазвичай ототожнюють з Ялу, арабським селом, що зберегло назву, на відрозі над долиною приблизно за 20 км на захід від Єрусалима; пропонували також невеликий тель поруч, Телль-ель-Кока, а Хірбет-Хайян біля Гая — далекий третій варіант. Місто з'являється у XIV столітті до н. е. в листах з Амарни як Айялуна, яке назване серед міст, яким загрожували апіру, і поблизу якого цар Єрусалима скаржився, що його караван пограбовано, а також у переліку міст, узятих Шешонком I, біблійним Сусакімом, близько 925 р. до н. е."
    - "У битві Ісуса Навина за Гаваон місяць зупинився над Аялоном: «місяцю, над Аялоном!» Місто було віддане Данові й разом з пасовищами дане левітам Кааф, але «остались Аморії на горі Херес, в Аялонї й у Саалбимі», доки дім Йосипів не зробив їх данниками. Після битви в проході Міхмасу люди Саула гнали филистимлян «від Михмасу до Аялону». Хроніки називають рід веніяминян «головами над родинами осадників в Аялонї. Вони вигнали осадників із Гета». Ровоам укріпив його серед своїх укріплених міст, «що були в поколїннї Юдиному та Беняминовому», а за днів Ахаза филистимляни взяли його разом із Бет-Шемешем, Тімною та іншими містами Шефели."
    - "Євсевій знав село Алон поблизу Нікополя (Еммаусу). Долина під ним бачила, як проходять війська від Юди Маккавея до хрестоносців, а в 1948 році — бої за виступ Латрун. Ялу та його сусіди Імвас і Бейт-Нуба були зруйновані в червні 1967 року, а їхні землі лежать нині в Парку Канада (Парк Аялон) біля траси Тель-Авів — Єрусалим."
  es:
    - "Ajalón era una ciudad de la Sefelá, contada en distintas épocas entre Dan, Efraín y Benjamín, en el extremo superior del valle que lleva su nombre, la principal vía de acceso desde la llanura costera hasta Gabaón y Jerusalén. Se identifica por lo común con Yalo, la aldea árabe que conservó el nombre, sobre un espolón por encima del valle a unos 20 km al oeste de Jerusalén; también se ha propuesto el pequeño tell que hay junto a ella, Tell el-Qoqa, y Khirbet Haiyan, cerca de Hai, es una tercera opción lejana. La ciudad aparece en el siglo XIV a. C. en las cartas de Amarna como Ayyaluna, nombrada entre las ciudades amenazadas por los apiru, cerca de donde el rey de Jerusalén se quejó de que habían robado su caravana, y en la lista de ciudades tomadas por Sheshonq I, el Sisac de la Biblia, hacia 925 a. C."
    - "En la batalla de Josué por Gabaón la luna se detuvo «en el valle de Ajalón». La ciudad fue asignada a Dan y dada con sus ejidos a los levitas de Coat, pero «quiso el Amorrheo habitar en el monte de Heres, en Ajalón y en Saalbín» hasta que la casa de José los hizo tributarios. Tras la batalla en el paso de Micmas, los hombres de Saúl persiguieron a los filisteos «desde Michmas hasta Ajalón». Las Crónicas nombran clanes de Benjamín «de los moradores de Ajalón, los cuales echaron á los moradores de Gath». Roboam la fortificó entre sus ciudades fuertes «en Judá y en Benjamín», y en los días de Acaz los filisteos la tomaron junto con Bet-semes, Timna y otras ciudades de la Sefelá."
    - "Eusebio conoció una aldea Alón cerca de Nicópolis (Emaús). El valle que hay bajo ella ha visto pasar ejércitos desde Judas Macabeo hasta los cruzados, y en 1948 el combate por el saliente de Latrún. Yalo y sus vecinas Imwas y Beit Nuba fueron destruidas en junio de 1967, y sus tierras forman hoy el Parque Canadá (Parque Ayalon), junto a la autopista Tel Aviv-Jerusalén."
  pt:
    - "Aijalom era uma cidade da Sefelá, contada em épocas diversas entre as de Dã, Efraim e Benjamim, na parte alta do vale que leva o seu nome, o principal acesso da planície costeira a Gibeão e Jerusalém. É geralmente identificada com Yalo, a aldeia árabe que conservou o nome, num esporão acima do vale, cerca de 20 km a oeste de Jerusalém; o pequeno tell ao lado, Tell el-Qoqa, também foi proposto, e Khirbet Haiyan, perto de Ai, é um distante terceiro. A cidade aparece no século XIV a.C. nas cartas de Amarna como Ayyaluna, citada entre as cidades ameaçadas pelos apiru, perto da qual o rei de Jerusalém se queixou de que sua caravana fora roubada, e na lista de cidades tomadas por Sesonq I, o Sisaque da Bíblia, por volta de 925 a.C."
    - "Na batalha de Josué por Gibeão, a lua parou “no vale de Aijalom”. A cidade foi atribuída a Dã e dada com suas pastagens aos levitas de Coate, mas “os amorreus persistiram em habitar no monte Heres, em Aijalom e em Saalabim”, até que a casa de José os sujeitou a trabalhos forçados. Depois da batalha na passagem de Micmás, os homens de Saul perseguiram os filisteus “desde Micmás até Aijalom”. Crônicas nomeia clãs benjamitas “dos habitantes de Aijalom, os quais puseram em fuga os habitantes de Gate”. Roboão a fortificou entre as suas cidades fortificadas “em Judá e em Benjamim”, e nos dias de Acaz os filisteus a tomaram junto com Bete-Semes, Timna e outras cidades da Sefelá."
    - "Eusébio conheceu uma aldeia Alon perto de Nicópolis (Emaús). O vale abaixo dela viu passar exércitos, de Judas Macabeu aos cruzados, e em 1948 o combate pela saliência de Latrun. Yalo e as vizinhas Imwas e Beit Nuba foram destruídas em junho de 1967, e suas terras estão agora no Parque Canadá (Parque Ayalon), junto à rodovia Tel Aviv–Jerusalém."
  de:
    - "Ajalon war eine Stadt der Schefela, zu verschiedenen Zeiten zu Dan, Ephraim und Benjamin gerechnet, am oberen Ende des nach ihr benannten Tals, dem Hauptaufstieg von der Küstenebene nach Gibeon und Jerusalem. Gewöhnlich wird sie mit Yalo gleichgesetzt, dem arabischen Dorf, das den Namen bewahrte, auf einem Sporn über dem Tal etwa 20 km westlich von Jerusalem; auch der kleine Tell daneben, Tell el-Qoqa, wurde vorgeschlagen, und Chirbet Haiyan bei Ai ist ein ferner Dritter. Die Stadt erscheint im 14. Jahrhundert v. Chr. in den Amarna-Briefen als Ayyaluna, das unter den von den Apiru bedrohten Städten genannt wird und in dessen Nähe, wie der König von Jerusalem klagte, seine Karawane ausgeraubt wurde, und in der Liste der Städte, die Schoschenq I., der biblische Schischak, um 925 v. Chr. einnahm."
    - "In Josuas Schlacht um Gibeon stand der Mond still „im Tal Ajalon“. Die Stadt wurde Dan zugeteilt und mit ihren Weiden den Leviten aus dem Geschlecht Kehats gegeben, aber „die Amoriter blieben wohnen auf dem Gebirge Heres, zu Ajalon und Saalbim“, bis das Haus Josef sie zinsbar machte. Nach der Schlacht am Pass von Michmas verfolgten Sauls Männer die Philister „von Michmas bis gen Ajalon“. Die Chronik nennt Sippen Benjamins „unter den Bürgern zu Ajalon; sie verjagten die zu Gath“. Rehabeam befestigte sie unter seinen festen Städten „in Juda und Benjamin“, und zur Zeit des Ahas nahmen die Philister sie zusammen mit Bet-Schemesch, Timna und anderen Städten der Schefela."
    - "Eusebius kannte ein Dorf Alon bei Nikopolis (Emmaus). Das Tal darunter sah Heere ziehen, von Judas Makkabäus bis zu den Kreuzfahrern, und 1948 die Kämpfe um den Latrun-Vorsprung. Yalo und seine Nachbarn Imwas und Beit Nuba wurden im Juni 1967 zerstört, und ihr Land liegt heute im Canada Park (Ayalon-Park) an der Schnellstraße Tel Aviv–Jerusalem."
  fr:
    - "Ajalon était une ville de la Shéphéla, comptée selon les époques à Dan, à Éphraïm et à Benjamin, à l’extrémité supérieure de la vallée qui porte son nom, principale voie de montée de la plaine côtière vers Gabaon et Jérusalem. Elle est d’ordinaire identifiée à Yalo, village arabe qui a gardé le nom, sur un éperon au-dessus de la vallée, à environ 20 km à l’ouest de Jérusalem ; le petit tell voisin, Tell el-Qoqa, a aussi été proposé, et Khirbet Haiyan, près d’Aï, vient loin en troisième. La ville apparaît au XIVe siècle av. J.-C. dans les lettres d’Amarna sous le nom d’Ayyaluna, nommée parmi les villes menacées par les Apirou, et c’est près d’elle que le roi de Jérusalem se plaint qu’on a pillé sa caravane ; elle figure aussi dans la liste des villes prises par Chéchonq Ier, le Schischak de la Bible, vers 925 av. J.-C."
    - "Dans la bataille de Josué pour Gabaon, la lune s’arrêta « sur la vallée d’Ajalon ». La ville fut attribuée à Dan et donnée avec ses pâturages aux lévites de Kehath, mais « les Amoréens voulurent rester à Har-Hérès, à Ajalon et à Schaalbim » jusqu’à ce que la maison de Joseph les eût assujettis à un tribut. Après la bataille du défilé de Micmasch, les hommes de Saül poursuivirent les Philistins « depuis Micmasch jusqu’à Ajalon ». Les Chroniques nomment des clans de Benjamin, « chefs de famille parmi les habitants d’Ajalon, [qui] mirent en fuite les habitants de Gath ». Roboam la fortifia parmi ses villes fortes « en Juda et en Benjamin », et du temps d’Achaz les Philistins la prirent avec Beth-Schémesch, Thimna et d’autres villes de la Shéphéla."
    - "Eusèbe connaissait un village Alon près de Nicopolis (Emmaüs). La vallée au-dessous a vu passer des armées, de Judas Maccabée aux croisés, et en 1948 les combats pour le saillant de Latroun. Yalo et ses voisins Imwas et Beit Nuba furent détruits en juin 1967, et leurs terres forment aujourd’hui le parc Canada (parc Ayalon), le long de l’autoroute Tel-Aviv-Jérusalem."
  it:
    - "Aialon era una città della Sefela, attribuita in tempi diversi a Dan, a Efraim e a Beniamino, all’estremità superiore della valle che porta il suo nome, la via principale di accesso dalla pianura costiera su verso Gabaon e Gerusalemme. È di solito identificata con Yalo, il villaggio arabo che ne ha conservato il nome, su uno sperone sopra la valle a circa 20 km a ovest di Gerusalemme; è stato proposto anche il piccolo tell accanto, Tell el-Qoqa, e Khirbet Haiyan presso Ai è un lontano terzo. La città compare nel XIV secolo a.C. nelle lettere di Amarna come Ayyaluna, nominata fra le città minacciate dagli Apiru, presso la quale il re di Gerusalemme si lamentò che la sua carovana era stata derubata, e nell’elenco delle città prese da Sosenq I, il Sisak della Bibbia, intorno al 925 a.C."
    - "Nella battaglia di Giosuè per Gabaon la luna si fermò «sulla valle d’Aialon». La città fu assegnata a Dan e data con i suoi pascoli ai leviti di Keat, ma «gli Amorei si mostrarono decisi a restare a Har-Heres, ad Aialon ed a Shaalbim» finché la casa di Giuseppe li rese tributari. Dopo la battaglia al passo di Micmas gli uomini di Saul inseguirono i Filistei «da Micmas ad Ajalon». Le Cronache nominano clan beniaminiti «che abitavano Ajalon, e misero in fuga gli abitanti di Gath». Roboamo la fortificò fra le sue città fortificate, «che erano in Giuda e in Beniamino», e ai giorni di Acaz i Filistei la presero insieme a Bet-Semes, Timna e altre città della Sefela."
    - "Eusebio conosceva un villaggio Alon presso Nicopoli (Emmaus). La valle sottostante ha visto passare eserciti da Giuda Maccabeo ai crociati, e nel 1948 i combattimenti per il saliente di Latrun. Yalo e i suoi vicini Imwas e Beit Nuba furono distrutti nel giugno 1967, e le loro terre sono ora nel Canada Park (Ayalon Park) accanto all’autostrada Tel Aviv–Gerusalemme."
  pl:
    - "Ajjalon było miastem Szefeli, zaliczanym w różnych czasach do Dana, Efraima i Beniamina, u górnego końca doliny noszącej jego imię, głównej drogi z równiny nadmorskiej w górę do Gibeonu i Jerozolimy. Utożsamia się je zwykle z Jalo, arabską wsią, która zachowała nazwę, na ostrodze nad doliną, około 20 km na zachód od Jerozolimy; proponowano też mały tell obok niej, Tell el-Qoqa, a Chirbet Haiyan koło Aj jest dalekim trzecim kandydatem. Miasto pojawia się w XIV wieku p.n.e. w listach z Amarna jako Ayyaluna, wymieniane wśród miast zagrożonych przez Apiru, i obok niego król Jerozolimy skarżył się na rabunek karawany, oraz w wykazie miast zdobytych przez Szoszenka I, biblijnego Sziszaka, około 925 r. p.n.e."
    - "W bitwie Jozuego o Gibeon księżyc zatrzymał się „w dolinie Ajalon”. Miasto przydzielono Danowi i oddano wraz z pastwiskami lewitom z rodu Kehata, lecz „począł mieszkać Amorejczyk na górze Hares, w Ajalon i w Salebim”, aż dom Józefa uczynił ich hołdownikami. Po bitwie w przesmyku Mikmas ludzie Saula ścigali Filistynów „od Machmas aż do Ajalon”. Księga Kronik wymienia rody beniaminitów, których naczelnicy byli „książętami narodów mieszkających w Ajalon; ci wygnali obywateli z Get”. Roboam obwarował je wśród swych miast warownych, „które były w Judzie i w pokoleniu Benjaminowem”, a za dni Achaza Filistyni zajęli je razem z Bet-Szemesz, Timną i innymi miastami Szefeli."
    - "Euzebiusz znał wieś Alon w pobliżu Nikopolis (Emaus). Dolina poniżej widziała przechodzące armie od Judy Machabeusza po krzyżowców, a w 1948 roku walki o występ Latrun. Jalo i jego sąsiadki Imwas i Beit Nuba zburzono w czerwcu 1967 roku, a ich ziemie leżą dziś w Parku Kanada (Parku Ajjalon) obok autostrady Tel Awiw–Jerozolima."
  nl:
    - "Ajalon was een stad van de Sefela, op verschillende tijden gerekend tot Dan, Efraïm en Benjamin, aan het bovenste einde van het dal dat haar naam draagt, de hoofdtoegang vanuit de kustvlakte omhoog naar Gibeon en Jeruzalem. Zij wordt gewoonlijk geïdentificeerd met Yalo, het Arabische dorp dat de naam bewaarde, op een uitloper boven het dal, zo’n 20 km ten westen van Jeruzalem; de kleine tell ernaast, Tell el-Qoqa, is ook voorgesteld, en Khirbet Haiyan bij Ai is een verre derde. De stad verschijnt in de veertiende eeuw v.Chr. in de Amarnabrieven als Ayyaluna, genoemd onder de door de Apiru bedreigde steden, in de buurt waarvan de koning van Jeruzalem klaagde dat zijn karavaan was beroofd, en in de lijst van steden die Sjosjenk I, de Sisak van de Bijbel, omstreeks 925 v.Chr. innam."
    - "In Jozua’s slag om Gibeon stond de maan stil “in het dal van Ajalon”. De stad werd aan Dan toegewezen en met haar weiden aan de Levieten van Kehat gegeven, maar daar “wilden de Amorieten wonen op het gebergte van Heres, te Ajalon, en te Saalbim”, tot het huis van Jozef hen cijnsbaar maakte. Na de slag bij de pas van Michmas achtervolgden Sauls mannen de Filistijnen “van Michmas tot Ajalon”. Kronieken noemt Benjaminitische geslachten “van de inwoners te Ajalon; dezen hebben de inwoners van Gath verdreven”. Rehabeam versterkte haar onder zijn vaste steden “in Juda en in Benjamin”, en in de dagen van Achaz namen de Filistijnen haar in samen met Beth-Semes, Timna en andere steden van de Sefela."
    - "Eusebius kende een dorp Alon bij Nicopolis (Emmaüs). Het dal eronder zag legers voorbijtrekken van Judas Makkabeüs tot de kruisvaarders, en in 1948 de gevechten om de saillant van Latrun. Yalo en zijn buren Imwas en Beit Nuba werden in juni 1967 verwoest, en hun land ligt nu in Canada Park (Ayalon Park) naast de snelweg Tel Aviv-Jeruzalem."
  cs:
    - "Ajalon bylo město v Šefele, v různých dobách počítané k Danu, Efrajimu a Benjamínu, na horním konci údolí, které nese jeho jméno, hlavního přístupu z pobřežní roviny vzhůru ke Gibeonu a Jeruzalému. Obvykle se ztotožňuje s Yalo, arabskou vesnicí, která jméno uchovala, na výběžku nad údolím asi 20 km západně od Jeruzaléma; navržen byl též malý tell vedle ní, Tell el-Qoqa, a Chirbet Haiyan u Aje je vzdálenou třetí možností. Město se ve 14. století př. n. l. objevuje v Amarnských listech jako Ayyaluna, jmenované mezi městy ohroženými Apiru, poblíž něhož si jeruzalémský král stěžoval, že mu byla oloupena karavana, a v seznamu měst dobytých Šošenkem I., biblickým Šíšakem, kolem roku 925 př. n. l."
    - "V Jozuově bitvě o Gibeon se měsíc zastavil „v údolí Aialon“. Město bylo přiděleno Danovi a dáno s pastvinami levitům z Kehatova rodu, ale Amorejský „počal svobodně bydliti na hoře Heres, v Aialon a v Salbim“, avšak „když se zsilila ruka čeledi Jozefovy, uvedeni jsou pod plat“. Po bitvě v průsmyku Michmas Saulovi muži honili Pelištejce „od Michmas až do Aialon“. Letopisy jmenují benjamínské rody, „knížata čeledí otcovských, bydlících v Aialon; ti zahnali obyvatele Gát“. Rechabeám jej zařadil mezi svá hrazená města „v pokolení Judově a Beniaminově“ a za dnů Achazových je Pelištejci dobyli spolu s Bét-šemešem, Timnou a dalšími městy Šefely."
    - "Eusebios znal vesnici Alon poblíž Nikopole (Emauz). Údolí pod ní vidělo procházet vojska od Judy Makabejského až ke křižákům a v roce 1948 boje o latrunský výběžek. Yalo a jeho sousedé Imwas a Beit Nuba byly zničeny v červnu 1967 a jejich půda leží nyní v Kanadském parku (Park Ajalon) při dálnici Tel Aviv–Jeruzalém."
