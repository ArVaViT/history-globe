# Overview article (ADR 0007). Mainstream facts only; Yalo is given as the usual identification, the neighbouring tell as the alternative.
id: aijalon
place: a1c600b
title:
  en: "Aijalon"
  ru: "Аиалон"
body:
  en:
    - "Aijalon was a town of the Shephelah, reckoned at different times to Dan, Ephraim and Benjamin, at the upper end of the valley that bears its name, the main approach from the coastal plain up to Gibeon and Jerusalem. It is usually identified with Yalo, the Arab village that kept the name, on a spur above the valley about 20 km west of Jerusalem; the small tell beside it, Tell el-Qoqa, has also been proposed, and Khirbet Haiyan near Ai is a distant third. The town appears in the fourteenth century BC in the Amarna letters as Ayyaluna, raided by the Apiru, near which the king of Jerusalem complained that his caravan had been robbed, and in the list of towns taken by Shoshenq I, the Shishak of the Bible, about 925 BC."
    - "In Joshua's battle for Gibeon the moon stood still “in the valley of Ajalon”. The town was allotted to Dan and given with its pastures to the Levites of Kohath, but “the Amorites would dwell in mount Heres in Aijalon, and in Shaalbim” until the house of Joseph made them tributaries. After the battle at the pass of Michmash Saul's men pursued the Philistines “from Michmash to Aijalon”. Chronicles names Benjaminite clans “of the inhabitants of Aijalon, who drove away the inhabitants of Gath”. Rehoboam fortified it among his fenced cities “in Judah and in Benjamin”, and in the days of Ahaz the Philistines took it together with Beth-shemesh, Timnah and other towns of the Shephelah."
    - "Eusebius knew a village Alon near Nicopolis (Emmaus). The valley below it has seen armies pass from Judas Maccabeus to the Crusaders, and in 1948 the fighting for the Latrun salient. Yalo and its neighbours Imwas and Beit Nuba were destroyed in June 1967, and their lands now lie in Canada Park (Ayalon Park) beside the Tel Aviv-Jerusalem highway."
  ru:
    - "Аиалон — город Шефелы, причислявшийся в разное время к Дану, Ефрему и Вениамину, в верхнем конце долины, носящей его имя, — главного подъёма с приморской равнины к Гаваону и Иерусалиму. Обычно его отождествляют с Яло, арабской деревней, сохранившей имя, на отроге над долиной примерно в 20 км к западу от Иерусалима; предлагали и небольшой телль рядом с ней, Телль-эль-Кока, а Хирбет-Хайян близ Гая — далёкий третий вариант. Город упоминается в XIV веке до н. э. в письмах из Амарны как Айялуна, на которую нападали хапиру и близ которой, как жаловался царь Иерусалима, ограбили его караван, и в списке городов, взятых Шешонком I, библейским Сусакимом, около 925 г. до н. э."
    - "В битве Иисуса Навина за Гаваон луна остановилась «над долиною Аиалонскою». Город достался Дану и был отдан с предместьями левитам из рода Каафа, но «остались Аморреи жить на горе Херес... в Аиалоне и Шаалвиме», пока сыны Иосифовы не сделали их данниками. После битвы у теснины Михмаса люди Саула поражали Филистимлян «от Михмаса до Аиалона». Паралипоменон называет вениамитские роды — «главами поколений жителей Аиалона», которые «выгнали жителей Гефа». Ровоам укрепил его среди своих крепостей «в колене Иудином и Вениаминовом», а во дни Ахаза Филистимляне взяли его вместе с Вефсамисом, Фимной и другими городами Шефелы."
    - "Евсевий знал селение Алон близ Никополя (Эммауса). По долине под ним проходили войска от Иуды Маккавея до крестоносцев, а в 1948 году здесь шли бои за латрунский выступ. Яло и соседние Имвас и Бейт-Нуба были разрушены в июне 1967 года, и их земли теперь лежат в парке Канада (Аялон) у шоссе Тель-Авив — Иерусалим."
