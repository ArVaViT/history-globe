# Overview article (ADR 0007). Mainstream facts only; Tel Shimron is the accepted site, the minor candidate in Lebanon on the map is named; the Egyptian and Josephus references are given as usually read.
id: shimron
place: a072bae
title:
  en: "Shimron"
  ru: "Шимрон"
  uk: "Шімрон"
  es: "Simrón"
  pt: "Sinrom"
  de: "Schimron"
  fr: "Schimron"
body:
  en:
    - "Shimron was a Canaanite city in Lower Galilee whose king answered the call of Jabin of Hazor: Jabin “sent to Jobab king of Madon, and to the king of Shimron, and to the king of Achshaph”, and their combined forces were routed by Joshua at the waters of Merom. Later the town is listed among the twelve cities of Zebulun, “Kattath, and Nahallal, and Shimron, and Idalah, and Beth-lehem”. The king of “Shimron-meron” in the list of defeated kings is probably the same. The Bible says nothing more of it."
    - "The town is generally placed at Tel Shimron, a large mound on the north-western edge of the Jezreel Valley, about 2 km north-east of Nahalal; its Arabic name, Khirbet Sammuniyeh, preserves the name, as does Simonias, a village on the border of Galilee that Josephus mentions in his account of the revolt of AD 66–67. Egyptian lists of the second millennium BC and the Amarna letters name a town Shim'on or Shamhuna, usually taken to be this one. Excavations begun in the late 2010s have exposed Bronze Age, Iron Age and Roman remains. The map also shows Maroun al-Ras in southern Lebanon, proposed by a few for Shimron-meron. Tel Shimron lies today in the fields of northern Israel."
  ru:
    - "Шимрон — ханаанский город в Нижней Галилее, чей царь откликнулся на призыв Иавина Асорского: Иавин «послал к Иоваву, царю Мадонскому, и к царю Шимронскому, и к царю Ахсафскому», и их соединённые силы Иисус Навин разбил у вод Меромских. Позже город назван среди двенадцати городов Завулона: «Каттаф, Нагалал, Шимрон, Идеала и Вифлеем». Царь «Шимрон-Мерона» в списке побеждённых царей — вероятно, тот же. Больше Библия о нём ничего не говорит."
    - "Город обычно помещают на Тель-Шимрон — большой холм у северо-западного края Изреельской долины, примерно в 2 км к северо-востоку от Нагалала; имя сохранилось в арабском названии Хирбет-Саммуние и в Симониаде — селении на границе Галилеи, которое Иосиф Флавий упоминает в рассказе о восстании 66–67 годов н. э. Египетские списки II тысячелетия до н. э. и амарнские письма называют город Шимон или Шамхуна, который обычно считают этим. Раскопки, начатые в конце 2010-х годов, открыли слои бронзового и железного веков и римского времени. На карте показан и Марун-эр-Рас на юге Ливана, который некоторые предлагали для Шимрон-Мерона. Тель-Шимрон лежит сегодня среди полей на севере Израиля."
  uk:
    - "Шімрон був ханаанським містом у Нижній Галілеї, цар якого відгукнувся на заклик Явіна з Гацору: «післав він посли до Йобаба, царя Мадонського, та до царя Симронського, та до царя Ахсафського», і їхні об'єднані сили були розбиті Ісусом Навином при водах Мерому. Згодом місто названо серед дванадцяти міст Завулона: «Каттаф, Нагалал, Симрон, Ідеала та Бетлеєм». Цар «Симрон-Меронський» у переліку переможених царів, імовірно, той самий. Більше Біблія про нього нічого не каже."
    - "Місто зазвичай поміщають на Тель-Шімроні, великому кургані на північно-західному краю Їзреельської долини, приблизно за 2 км на північний схід від Нагалалу; арабська назва, Хірбет-Саммуніє, зберігає це ім'я, так само як і Сімоніяс, село на межі Галілеї, яке згадує Йосиф Флавій у розповіді про повстання 66–67 рр. н. е. Єгипетські переліки II тис. до н. е. та амарнські листи називають місто Шім'он або Шамхуна, яке зазвичай ототожнюють із цим. Розкопки, розпочаті наприкінці 2010-х років, виявили залишки бронзового віку, залізного віку та римської доби. Карта також показує Мароун-ер-Рас на півдні Лівану, запропонований деякими для Шімрон-Мерона. Тель-Шімрон лежить нині серед полів північного Ізраїлю."
  es:
    - "Simrón era una ciudad cananea de la Baja Galilea cuyo rey respondió a la llamada de Jabín de Hazor: Jabín «envió mensaje á Jobab rey de Madón, y al rey de Simrom, y al rey de Achsaph», y sus fuerzas combinadas fueron derrotadas por Josué junto a las aguas de Merom. Más tarde la ciudad figura entre las doce ciudades de Zabulón, «Catah, y Naalal, y Simrón, é Ideala, y Beth-lehem». El rey de «Simrom-meron» en la lista de los reyes vencidos es probablemente el mismo. La Biblia no dice nada más de ella."
    - "La ciudad se sitúa por lo común en Tel Shimron, un gran montículo en el borde noroccidental del valle de Jezreel, a unos 2 km al noreste de Nahalal; su nombre árabe, Khirbet Sammuniyeh, conserva el nombre, como lo hace Simonías, una aldea en la frontera de Galilea que Josefo menciona en su relato de la revuelta de 66–67 d. C. Las listas egipcias del segundo milenio a. C. y las cartas de Amarna nombran una ciudad Shim'on o Shamhuna, por lo común tomada por esta. Las excavaciones iniciadas a finales de la década de 2010 han sacado a la luz restos de las Edades del Bronce y del Hierro y de época romana. El mapa muestra también Maroun al-Ras, en el sur del Líbano, propuesta por unos pocos para Simrón-merón. Tel Shimron se halla hoy entre los campos del norte de Israel."
  pt:
    - "Sinrom era uma cidade cananeia da Baixa Galileia cujo rei atendeu ao chamado de Jabim de Hazor: Jabim “enviou mensageiros a Jobabe, rei de Madom, ao rei de Sinrom, ao rei de Acsafe”, e suas forças combinadas foram derrotadas por Josué nas águas de Merom. Mais tarde a cidade é listada entre as doze cidades de Zebulom, “Catate, Naalal, Sinrom, Idala e Belém”. O rei de “Sinrom-Merom” na lista dos reis derrotados é provavelmente o mesmo. A Bíblia nada mais diz dela."
    - "A cidade é geralmente situada em Tel Shimron, um grande monte na orla noroeste do vale de Jezreel, a cerca de 2 km a nordeste de Nahalal; seu nome árabe, Khirbet Sammuniyeh, preserva o nome, assim como Simonias, uma aldeia na fronteira da Galileia que Josefo menciona em seu relato da revolta de 66–67 d.C. Listas egípcias do segundo milênio a.C. e as cartas de Amarna nomeiam uma cidade Shim'on ou Shamhuna, geralmente tomada por esta. Escavações iniciadas no fim da década de 2010 expuseram restos do Bronze, do Ferro e do período romano. O mapa mostra também Maroun al-Ras, no sul do Líbano, proposta por uns poucos para Sinrom-Merom. Tel Shimron fica hoje entre os campos do norte de Israel."
  de:
    - "Schimron war eine kanaanäische Stadt in Untergaliläa, deren König dem Ruf Jabins von Hazor folgte: Als Jabin davon hörte, „sandte er zu Jobab, dem König zu Madon, und zum König zu Simron und zum König zu Achsaph“, und ihre vereinten Streitkräfte wurden von Josua an den Wassern von Merom geschlagen. Später steht die Stadt unter den zwölf Städten Sebulons, „Kattath, Nahalal, Simron, Jedeala und Bethlehem“. Der König von „Simron-Meron“ in der Liste der besiegten Könige ist wahrscheinlich derselbe. Mehr sagt die Bibel nicht."
    - "Die Stadt wird allgemein bei Tel Schimron angesetzt, einem großen Hügel am Nordwestrand der Jesreel-Ebene, etwa 2 km nordöstlich von Nahalal; sein arabischer Name, Chirbet Sammunije, bewahrt den Namen, ebenso Simonias, ein Dorf an der Grenze Galiläas, das Josephus in seinem Bericht über den Aufstand von 66–67 n. Chr. nennt. Ägyptische Listen des 2. Jahrtausends v. Chr. und die Amarna-Briefe nennen eine Stadt Schim'on oder Schamhuna, meist für diese gehalten. Seit den späten 2010er Jahren begonnene Grabungen haben Reste der Bronzezeit, der Eisenzeit und der römischen Zeit freigelegt. Die Karte zeigt auch Marun er-Ras im Südlibanon, von einigen für Schimron-Meron vorgeschlagen. Tel Schimron liegt heute inmitten der Felder Nordisraels."
  fr:
    - "Schimron était une ville cananéenne de Basse Galilée dont le roi répondit à l’appel de Jabin de Hatsor : Jabin « envoya des messagers à Jobab, roi de Madon, au roi de Schimron, au roi d’Acschaph », et leurs forces conjointes furent mises en déroute par Josué aux eaux de Mérom. Plus tard, la ville figure parmi les douze villes de Zabulon, « Katthath, Nahalal, Schimron, Jideala, Bethléhem ». Le roi de « Schimron-Meron » dans la liste des rois vaincus est probablement le même. La Bible n’en dit rien de plus."
    - "On place généralement la ville à Tel Shimron, grand tertre sur le bord nord-ouest de la vallée de Jizreel, à environ 2 km au nord-est de Nahalal ; son nom arabe, Khirbet Sammuniyeh, conserve le nom, comme Simonias, village aux confins de la Galilée que mentionne Flavius Josèphe dans son récit de la révolte de 66–67 apr. J.-C. Des listes égyptiennes du IIe millénaire av. J.-C. et les lettres d’Amarna nomment une ville Shim‘on ou Shamhuna, d’ordinaire tenue pour celle-ci. Des fouilles commencées à la fin des années 2010 ont mis au jour des vestiges des âges du Bronze et du Fer et de l’époque romaine. La carte montre aussi Maroun al-Ras, dans le sud du Liban, proposé par quelques-uns pour Schimron-Meron. Tel Shimron se trouve aujourd’hui parmi les champs du nord d’Israël."
