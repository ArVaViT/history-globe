body:
  en:
    - "Shimron was a Canaanite city in Lower Galilee whose king answered the call of Jabin of Hazor: Jabin “sent to Jobab king of Madon, and to the king of Shimron, and to the king of Achshaph”, and their combined forces were routed by Joshua at the waters of Merom. Later the town is listed among the twelve cities of Zebulun, “Kattath, and Nahallal, and Shimron, and Idalah, and Beth-lehem”. The king of “Shimron-meron” in the list of defeated kings is probably the same. The Bible says nothing more of it."
    - "The town is generally placed at Tel Shimron, a large mound on the north-western edge of the Jezreel Valley, about 2 km north-east of Nahalal; its Arabic name, Khirbet Sammuniyeh, preserves the name, as does Simonias, a village on the border of Galilee that Josephus mentions in his account of the revolt of AD 66–67. Egyptian lists of the second millennium BC and the Amarna letters name a town Shim'on or Shamhuna, usually taken to be this one. Excavations begun in the late 2010s have exposed Bronze Age, Iron Age and Roman remains. The map also shows Maroun al-Ras in southern Lebanon, proposed by a few for Shimron-meron. Tel Shimron lies today in the fields of northern Israel."
  ru:
    - "Шимрон — ханаанский город в Нижней Галилее, чей царь откликнулся на призыв Иавина Асорского: Иавин «послал к Иоваву, царю Мадонскому, и к царю Шимронскому, и к царю Ахсафскому», и их соединённые силы Иисус Навин разбил у вод Меромских. Позже город назван среди двенадцати городов Завулона: «Каттаф, Нагалал, Шимрон, Идеала и Вифлеем». Царь «Шимрон-Мерона» в списке побеждённых царей — вероятно, тот же. Больше Библия о нём ничего не говорит."
    - "Город обычно помещают на Тель-Шимрон — большой холм у северо-западного края Изреельской долины, примерно в 2 км к северо-востоку от Нагалала; имя сохранилось в арабском названии Хирбет-Саммуние и в Симониаде — селении на границе Галилеи, которое Иосиф Флавий упоминает в рассказе о восстании 66–67 годов н. э. Египетские списки II тысячелетия до н. э. и амарнские письма называют город Шимон или Шамхуна, который обычно считают этим. Раскопки, начатые в конце 2010-х годов, открыли слои бронзового и железного веков и римского времени. На карте показан и Марун-эр-Рас на юге Ливана, который некоторые предлагали для Шимрон-Мерона. Тель-Шимрон лежит сегодня среди полей на севере Израиля."
  uk:
    - "Шімрон був ханаанським містом у Нижній Галілеї, цар якого відгукнувся на заклик Явіна з Гацору: «післав він посли до Йобаба, царя Мадонського, та до царя Симронського, та до царя Ахсафського», і їхні об'єднані сили були розбиті Ісусом Навином при водах Мерому. Згодом місто названо серед дванадцяти міст Завулона: «Каттаф, Нагалал, Симрон, Ідеала та Бетлеєм». Цар «Симрон-Меронський» у переліку переможених царів, імовірно, той самий. Більше Біблія про нього нічого не каже."
    - "Місто зазвичай поміщають на Тель-Шімроні, великому кургані на північно-західному краю Їзреельської долини, приблизно за 2 км на північний схід від Нагалалу; арабська назва, Хірбет-Саммуніє, зберігає це ім'я, так само як і Сімоніяс, село на межі Галілеї, яке згадує Йосиф Флавій у розповіді про повстання 66–67 рр. н. е. Єгипетські переліки II тис. до н. е. та амарнські листи називають місто Шім'он або Шамхуна, яке зазвичай ототожнюють із цим. Розкопки, розпочаті наприкінці 2010-х років, виявили залишки бронзового віку, залізного віку та римської доби. Карта також показує Мароун-ер-Рас на півдні Лівану, запропонований деякими для Шімрон-Мерона. Тель-Шімрон лежить нині серед полів північного Ізраїлю."
  es:
    - "Simrón era una ciudad cananea de la Baja Galilea cuyo rey respondió a la llamada de Jabín de Hazor: Jabín «envió mensaje á Jobab rey de Madón, y al rey de Simrom, y al rey de Achsaph», y sus fuerzas combinadas fueron derrotadas por Josué junto a las aguas de Merom. Más tarde la ciudad figura entre las doce ciudades de Zabulón, «Catah, y Naalal, y Simrón, é Ideala, y Beth-lehem». El rey de «Simrom-meron» en la lista de los reyes vencidos es probablemente el mismo. La Biblia no dice nada más de ella."
    - "La ciudad se sitúa por lo común en Tel Shimron, un gran montículo en el borde noroccidental del valle de Jezreel, a unos 2 km al noreste de Nahalal; su nombre árabe, Khirbet Sammuniyeh, conserva el nombre, como lo hace Simonías, una aldea en la frontera de Galilea que Josefo menciona en su relato de la revuelta de 66–67 d. C. Las listas egipcias del segundo milenio a. C. y las cartas de Amarna nombran una ciudad Shim'on o Shamhuna, por lo común tomada por esta. Las excavaciones iniciadas a finales de la década de 2010 han sacado a la luz restos de las Edades del Bronce y del Hierro y de época romana. El mapa muestra también Maroun al-Ras, en el sur del Líbano, propuesta por unos pocos para Simrón-merón. Tel Shimron se halla hoy entre los campos del norte de Israel."
  pt:
    - "Sinrom era uma cidade cananeia da Baixa Galileia cujo rei atendeu ao chamado de Jabim de Hazor: Jabim “enviou mensageiros a Jobabe, rei de Madom, ao rei de Sinrom, ao rei de Acsafe”, e suas forças combinadas foram derrotadas por Josué nas águas de Merom. Mais tarde a cidade é listada entre as doze cidades de Zebulom, “Catate, Naalal, Sinrom, Idala e Belém”. O rei de “Sinrom-Merom” na lista dos reis derrotados é provavelmente o mesmo. A Bíblia nada mais diz dela."
    - "A cidade é geralmente situada em Tel Shimron, um grande monte na orla noroeste do vale de Jezreel, a cerca de 2 km a nordeste de Nahalal; seu nome árabe, Khirbet Sammuniyeh, preserva o nome, assim como Simonias, uma aldeia na fronteira da Galileia que Josefo menciona em seu relato da revolta de 66–67 d.C. Listas egípcias do segundo milênio a.C. e as cartas de Amarna nomeiam uma cidade Shim'on ou Shamhuna, geralmente tomada por esta. Escavações iniciadas no fim da década de 2010 expuseram restos do Bronze, do Ferro e do período romano. O mapa mostra também Maroun al-Ras, no sul do Líbano, proposta por uns poucos para Sinrom-Merom. Tel Shimron fica hoje entre os campos do norte de Israel."
  de:
    - "Schimron war eine kanaanäische Stadt in Untergaliläa, deren König dem Ruf Jabins von Hazor folgte: Als Jabin davon hörte, „sandte er zu Jobab, dem König zu Madon, und zum König zu Simron und zum König zu Achsaph“, und ihre vereinten Streitkräfte wurden von Josua an den Wassern von Merom geschlagen. Später steht die Stadt unter den zwölf Städten Sebulons, „Kattath, Nahalal, Simron, Jedeala und Bethlehem“. Der König von „Simron-Meron“ in der Liste der besiegten Könige ist wahrscheinlich derselbe. Mehr sagt die Bibel nicht."
    - "Die Stadt wird allgemein bei Tel Schimron angesetzt, einem großen Hügel am Nordwestrand der Jesreel-Ebene, etwa 2 km nordöstlich von Nahalal; sein arabischer Name, Chirbet Sammunije, bewahrt den Namen, ebenso Simonias, ein Dorf an der Grenze Galiläas, das Josephus in seinem Bericht über den Aufstand von 66–67 n. Chr. nennt. Ägyptische Listen des 2. Jahrtausends v. Chr. und die Amarna-Briefe nennen eine Stadt Schim'on oder Schamhuna, meist für diese gehalten. Seit den späten 2010er Jahren begonnene Grabungen haben Reste der Bronzezeit, der Eisenzeit und der römischen Zeit freigelegt. Die Karte zeigt auch Marun er-Ras im Südlibanon, von einigen für Schimron-Meron vorgeschlagen. Tel Schimron liegt heute inmitten der Felder Nordisraels."
  fr:
    - "Schimron était une ville cananéenne de Basse Galilée dont le roi répondit à l’appel de Jabin de Hatsor : Jabin « envoya des messagers à Jobab, roi de Madon, au roi de Schimron, au roi d’Acschaph », et leurs forces conjointes furent mises en déroute par Josué aux eaux de Mérom. Plus tard, la ville figure parmi les douze villes de Zabulon, « Katthath, Nahalal, Schimron, Jideala, Bethléhem ». Le roi de « Schimron-Meron » dans la liste des rois vaincus est probablement le même. La Bible n’en dit rien de plus."
    - "On place généralement la ville à Tel Shimron, grand tertre sur le bord nord-ouest de la vallée de Jizreel, à environ 2 km au nord-est de Nahalal ; son nom arabe, Khirbet Sammuniyeh, conserve le nom, comme Simonias, village aux confins de la Galilée que mentionne Flavius Josèphe dans son récit de la révolte de 66–67 apr. J.-C. Des listes égyptiennes du IIe millénaire av. J.-C. et les lettres d’Amarna nomment une ville Shim‘on ou Shamhuna, d’ordinaire tenue pour celle-ci. Des fouilles commencées à la fin des années 2010 ont mis au jour des vestiges des âges du Bronze et du Fer et de l’époque romaine. La carte montre aussi Maroun al-Ras, dans le sud du Liban, proposé par quelques-uns pour Schimron-Meron. Tel Shimron se trouve aujourd’hui parmi les champs du nord d’Israël."
  it:
    - "Simron era una città cananea nella Bassa Galilea il cui re rispose all’appello di Iabin di Asor: Iabin «mandò de’ messi a Iobab re di Madon, al re di Scimron, al re di Acsaf», e le loro forze unite furono sbaragliate da Giosuè alle acque di Merom. Più tardi la città è elencata tra le dodici città di Zabulon, «Kattath, Nahalal, Scimron, Ideala e Bethlehem». Il re di «Scimron-Meron» nell’elenco dei re sconfitti è probabilmente lo stesso. La Bibbia non dice altro di essa."
    - "La città è generalmente collocata a Tel Shimron, un grande tell sul margine nord-occidentale della valle di Izreel, circa 2 km a nord-est di Nahalal; il suo nome arabo, Khirbet Sammuniyeh, ne conserva il nome, come Simonias, un villaggio al confine della Galilea che Giuseppe Flavio menziona nel suo racconto della rivolta del 66–67 d.C. Elenchi egizi del II millennio a.C. e le lettere di Amarna nominano una città Shim’on o Shamhuna, di solito ritenuta questa. Scavi iniziati alla fine degli anni 2010 hanno messo in luce resti dell’età del Bronzo, del Ferro e di epoca romana. La mappa mostra anche Maroun al-Ras nel Libano meridionale, proposta da pochi per Simron-Meron. Tel Shimron si trova oggi tra i campi del nord di Israele."
  pl:
    - "Szimron było kananejskim miastem w Dolnej Galilei, którego król odpowiedział na wezwanie Jabina z Chasoru: Jabin „posłał do Johaba, króla Madon, i do króla Symron, i do króla Achsaf”, a ich połączone siły rozgromił Jozue nad wodami Merom. Później miasto wymieniono wśród dwunastu miast Zabulona, „I Katet, i Nahalal, i Symeron, i Jedala, i Betlehem”. Król „Symron Meron” na liście pokonanych królów to prawdopodobnie ten sam. Biblia nie mówi o nim nic więcej."
    - "Miasto zwykle umieszcza się w Tel Szimron, wielkim kopcu na północno-zachodnim skraju doliny Jizreel, około 2 km na północny wschód od Nahalal; jego arabska nazwa, Chirbet Sammunija, zachowuje imię, tak jak Symonias, wieś na granicy Galilei, którą wymienia Józef Flawiusz w relacji o powstaniu z lat 66–67 n.e. Egipskie listy z II tysiąclecia p.n.e. i listy z Amarny wymieniają miasto Szim'on lub Szamchuna, zwykle uważane za to samo. Wykopaliska rozpoczęte pod koniec lat 2010. odsłoniły pozostałości z epoki brązu, żelaza i rzymskie. Mapa pokazuje też Marun ar-Ras w południowym Libanie, który nieliczni proponowali dla Szimron-Meron. Tel Szimron leży dziś wśród pól północnego Izraela."
  cs:
    - "Šimron bylo kenaanské město v Dolní Galileji, jehož král odpověděl na volání Jabína z Chacoru: Jabín „poslal k Jobábovi, králi Mádon, a k králi Simron, a k králi Achzaf“ a jejich spojená vojska rozprášil Jozue u vod Meromu. Později je město uvedeno mezi dvanácti městy Zebulunovými, „Katet, Naalol, Simron, Idala a Betlém“. Král „Simron Meron“ v seznamu poražených králů je pravděpodobně týž. Bible o něm neříká nic víc."
    - "Město se obecně klade do Tel Šimron, velkého pahorku na severozápadním okraji Jizreelského údolí, asi 2 km severovýchodně od Nahalalu; jeho arabské jméno, Chirbet Sammúnija, jméno zachovává, stejně jako Simonias, vesnice na hranici Galileje, kterou Josephus zmiňuje ve svém líčení povstání v letech 66–67 n. l. Egyptské seznamy 2. tisíciletí př. n. l. a amarnské dopisy jmenují město Šim'on či Šamchuna, obvykle pokládané za toto. Vykopávky zahájené koncem 2010. let odkryly zbytky z doby bronzové, železné i římské. Mapa ukazuje také Márún ar-Rás v jižním Libanonu, navržený několika učenci pro Šimron-meron. Tel Šimron leží dnes mezi poli severního Izraele."
  nl:
    - "Simron was een Kanaänitische stad in Neder-Galilea wier koning gehoor gaf aan de oproep van Jabin van Hazor: toen Jabin het hoorde, “zo zond hij tot Jobab, den koning van Madon, en tot den koning van Simron, en tot den koning van Achsaf”, en hun gezamenlijke strijdkrachten werden door Jozua verslagen bij de wateren van Merom. Later staat de stad onder de twaalf steden van Zebulon, “En Kattath, en Nahalal, en Simron, en Jidala, en Bethlehem”. De koning van “Simron-Meron” in de lijst van verslagen koningen is waarschijnlijk dezelfde. De Bijbel zegt er verder niets van."
    - "De stad wordt algemeen geplaatst bij Tel Shimron, een grote heuvel aan de noordwestrand van de vallei van Jizreël, zo’n 2 km ten noordoosten van Nahalal; zijn Arabische naam, Khirbet Sammuniyeh, bewaart de naam, evenals Simonias, een dorp op de grens van Galilea dat Josephus noemt in zijn verslag van de opstand van 66–67 n.Chr. Egyptische lijsten uit het 2e millennium v.Chr. en de Amarnabrieven noemen een stad Shim’on of Shamhuna, meestal opgevat als deze. Opgravingen die in de late jaren 2010 begonnen, hebben resten uit de brons-, ijzertijd en Romeinse tijd blootgelegd. De kaart toont ook Maroun al-Ras in Zuid-Libanon, door enkelen voorgesteld voor Simron-Meron. Tel Shimron ligt tegenwoordig tussen de akkers van Noord-Israël."
  sv:
    - "Shimron var en kananeisk stad i Nedre Galileen vars kung svarade på Javins av Hasor kallelse: när Javin hörde detta, ”sände han bud till Jobab, konungen i Madon, och till konungen i Simron och konungen i Aksaf”, och deras förenade styrkor slogs i flykt av Josua vid Meroms vatten. Senare räknas staden upp bland Sebulons tolv städer: ”Kattat, Nahalal, Simron, Jidala och Bet-Lehem”. Kungen av ”Simron-Meron” i förteckningen över besegrade kungar är sannolikt densamme. Bibeln säger inget mer om staden."
    - "Staden förläggs vanligen till Tel Shimron, en stor tell i nordvästra kanten av Jisreeldalen, omkring 2 km nordost om Nahalal; dess arabiska namn, Khirbet Sammuniyeh, bevarar namnet, liksom Simonias, en by vid Galileens gräns som Josefus nämner i sin skildring av upproret 66–67 e.Kr. Egyptiska förteckningar från andra årtusendet f.Kr. och Amarnabreven nämner en stad Shim'on eller Shamhuna, som vanligen anses vara denna. Utgrävningar som inleddes i slutet av 2010-talet har frilagt lämningar från bronsåldern, järnåldern och romartiden. Kartan visar också Maroun al-Ras i södra Libanon, som några har föreslagit för Shimron-Meron. Tel Shimron ligger i dag bland åkrarna i norra Israel."
  nb:
    - "Sjimron var en kanaanittisk by i Nedre Galilea hvis konge fulgte oppropet fra Jabin av Hasor: «Da Jabin, kongen i Hasor, hørte dette, sendte han bud til Jobab, kongen i Madon, og til kongen i Simron og til kongen i Aksaf», og deres samlede styrker ble slått av Josva ved Merom-vannet. Senere nevnes byen blant Sebulons tolv byer, «Kattat og Nahalal og Simron og Jidala og Betlehem». Kongen i «Simron-Meron» i listen over slåtte konger er trolig den samme. Bibelen sier ikke mer om byen."
    - "Byen plasseres vanligvis ved Tel Sjimron, en stor haug i nordvestkanten av Jisreeldalen, omkring 2 km nordøst for Nahalal; det arabiske navnet, Khirbet Sammuniyeh, bevarer navnet, det samme gjør Simonias, en landsby på grensen til Galilea som Josefus nevner i beretningen om opprøret i 66–67 e.Kr. Egyptiske lister fra 2. årtusen f.Kr. og Amarna-brevene nevner en by Shim'on eller Shamhuna, som vanligvis regnes for å være denne. Utgravninger som begynte sent på 2010-tallet, har avdekket levninger fra bronsealder, jernalder og romertid. Kartet viser også Maroun al-Ras i Sør-Libanon, foreslått av noen som Sjimron-Meron. Tel Sjimron ligger i dag blant jordene i Nord-Israel."
  tl:
    - "Ang Simron ay isang lunsod ng mga Cananeo sa Mababang Galilea na ang hari ay tumugon sa panawagan ni Jabin ng Hasor: si Jabin ay “nagsugo kay Jobab na hari sa Madon, at sa hari sa Simron, at sa hari sa Achsaph”, at ang kanilang pinagsamang hukbo ay tinalo ni Josue sa mga tubig ng Merom. Pagkaraan, ang bayan ay napapabilang sa labindalawang lunsod ng Zabulon: “sa Catah, at sa Naalal, at sa Simron, at sa Ideala, at sa Bethlehem”. Ang hari ng “Simron-meron” sa talaan ng mga natalong hari ay marahil iisa rin sa kaniya. Wala nang iba pang sinasabi ang Biblia tungkol dito."
    - "Karaniwang inilalagay ang bayan sa Tel Shimron, isang malaking burol sa hilagang-kanlurang gilid ng Libis ng Jezreel, mga 2 km sa hilagang-silangan ng Nahalal; ang pangalang Arabe nitong Khirbet Sammuniyeh ang nagpapanatili ng pangalan, gaya rin ng Simonias, isang nayon sa hangganan ng Galilea na binabanggit ni Josefo sa kaniyang salaysay ng paghihimagsik noong 66–67 AD. Ang mga talaang Ehipsiyo noong ikalawang milenyo BK at ang mga sulat ng Amarna ay may binabanggit na bayang Shim'on o Shamhuna, na karaniwang itinuturing na ito. Ang mga paghuhukay na sinimulan noong huling bahagi ng dekada 2010 ay naglantad ng mga labi mula sa Panahong Tanso, Panahong Bakal at panahong Romano. Ipinakikita rin ng mapa ang Maroun al-Ras sa timog ng Libano, na iminungkahi ng ilan para sa Simron-meron. Ang Tel Shimron ay nasa mga bukid ng hilagang Israel ngayon."
  da:
    - "Sjimron var en kana'anæisk by i Nedre Galilæa, hvis konge fulgte kaldet fra Jabin af Hazor: Jabin sendte bud »til Jobab, Kongen af Madon, og til Kongen af Simron og til Kongen af Aksaf«, og deres forenede styrker blev slået af Josva ved Meroms vande. Senere nævnes byen blandt Zebulons tolv byer: »Kattath og Nahalal og Simron og Jidala og Bethlehem«. Kongen af »Simron-Meron« på listen over de besejrede konger er sandsynligvis den samme. Bibelen siger intet mere om byen."
    - "Byen placeres almindeligvis ved Tel Shimron, en stor tell i den nordvestlige udkant af Jizre'el-dalen, omkring 2 km nordøst for Nahalal; dens arabiske navn, Khirbet Sammuniyeh, har bevaret navnet, ligesom Simonias, en landsby på Galilæas grænse, som Josefus nævner i sin beretning om opstanden i 66–67 e.Kr. Egyptiske lister fra 2. årtusinde f.Kr. og Amarna-brevene nævner en by Shim'on eller Shamhuna, som sædvanligvis antages at være denne. Udgravninger, der begyndte i slutningen af 2010'erne, har blotlagt rester fra bronzealderen, jernalderen og romertiden. Kortet viser også Maroun al-Ras i det sydlige Libanon, som nogle få har foreslået som Sjimron-Meron. Tel Shimron ligger i dag på markerne i det nordlige Israel."
  sr:
    - "Симрон је био ханански град у Доњој Галилеји чији се цар одазвао позиву Јавина из Асора: Јавин „посла к Јоваву цару адонском и к цару имронском и к цару ахсавском“, а њихове здружене снаге Исус је разбио на водама Мером. Касније се град помиње међу дванаест градова Завулонових: „с Кататом и с Налалом и Симроном и Идалом и Витлејемом“. Цар „симрон-меронски“ у списку поражених царева вероватно је исти. Библија о њему више ништа не казује."
    - "Град се углавном смешта на Тел Симрон, велики хум на северозападном ободу Језраелске долине, око 2 км североисточно од Наалала; његово арапско име, Хирбет Самунијех, чува име, као и Симонија, село на граници Галилеје које Јосиф Флавије помиње у опису устанка 66–67. н. е. Египатски спискови из 2. миленијума п. н. е. и амарнска писма именују град Шим’он или Шамхуна, који се обично сматра овим градом. Ископавања започета крајем 2010-их открила су остатке из бронзаног и гвозденог доба и из римског времена. Карта приказује и Марун ал-Рас у јужном Либану, који неки предлажу за Симрон-Мерон. Тел Симрон данас лежи међу њивама северног Израела."
  hu:
    - "Simrón kánaáni város volt Alsó-Galileában, amelynek királya engedett a hácóri Jábin hívásának: Jábin „külde Jobábhoz, Mádonnak királyához, és Simronnak királyához, és Aksáfnak királyához”, és egyesült seregüket Józsué Mérom vizeinél szétverte. Később a várost Zebulon tizenkét városa között sorolják fel: „Kattáth, Nahalál, Simron, Jidealá és Bethlehem”. A legyőzött királyok felsorolásában szereplő „Simron Meronnak királya” valószínűleg ugyanaz. A Biblia többet nem mond róla."
    - "A várost általában Tel Simrónnál keresik, a Jezréel-völgy északnyugati szélén álló nagy település-dombon, Nahalaltól mintegy 2 km-re északkeletre; arab neve, a Khirbet Szammúníje megőrzi a nevet, ahogyan Simoniász is, a galileai határ menti falu, amelyet Josephus megemlít a Kr. u. 66–67-es felkelés elbeszélésében. A Kr. e. második évezredi egyiptomi jegyzékek és az amarnai levelek említenek egy Sim'on vagy Samhuna nevű várost, amelyet többnyire azonosnak tartanak ezzel. A 2010-es évek végén kezdődött ásatások bronzkori, vaskori és római kori maradványokat tártak fel. A térkép a dél-libanoni Maroun al-Rast is mutatja, amelyet néhányan Simrón-Merónnak javasoltak. Tel Simrón ma Észak-Izrael szántóföldjei között fekszik."
  fi:
    - "Simron oli kanaanilainen kaupunki Ala-Galileassa, jonka kuningas vastasi Hasorin Jabinin kutsuun: Jabin ”lähetti sanan Joobabille, Maadonin kuninkaalle, ja Simronin kuninkaalle ja Aksafin kuninkaalle”, ja Joosua voitti heidän yhdistetyt joukkonsa Meromin vesillä. Myöhemmin kaupunki mainitaan Sebulonin kahdentoista kaupungin joukossa: ”Kattat, Nahalal, Simron, Jidala ja Beetlehem”. Voitettujen kuninkaiden luettelon ”Simron-Meronin kuningas” on todennäköisesti sama. Raamattu ei kerro siitä enempää."
    - "Kaupunki sijoitetaan yleensä Tel Simroniin, laajalle kumpareelle Jisreelin laakson luoteisreunalla noin 2 km Nahalalista koilliseen; sen arabialainen nimi Khirbet Sammuniyeh säilyttää nimen, samoin kuin Simonias, Galilean rajalla sijainnut kylä, jonka Josefus mainitsee kertoessaan vuosien 66–67 jaa. kapinasta. Toisen vuosituhannen eaa. egyptiläisissä luetteloissa ja Amarna-kirjeissä mainitaan kaupunki Shim'on tai Shamhuna, jonka yleensä katsotaan olevan tämä. 2010-luvun lopulla alkaneissa kaivauksissa on paljastunut pronssikauden, rautakauden ja Rooman ajan jäänteitä. Kartalla näkyy myös Maroun al-Ras Etelä-Libanonissa, jota muutamat ovat ehdottaneet Simron-Meroniksi. Tel Simron sijaitsee nykyään Pohjois-Israelin pelloilla."
  vi:
    - "Sim-rôn là một thành của người Ca-na-an ở Hạ Ga-li-lê, vua thành này đáp lời kêu gọi của Gia-bin, vua Hát-so: Gia-bin “sai sứ giả đến cùng Giô-báp, vua Ma-đôn, đến cùng Sim-rôn, vua Ạc-sáp”, và các đạo quân liên minh của họ bị Giô-suê đánh tan tại các suối Mê-rôm. Về sau thị trấn được kể trong số mười hai thành của Sa-bu-lôn: “Cát-tát, Na-ha-la, Sim-rôn, Di-đê-a-la, và Bết-lê-hem”. Vua “Sim-rôn-Mê-rôn” trong danh sách các vua bị đánh bại có lẽ là cùng một nơi. Kinh Thánh không nói gì thêm về nó."
    - "Thị trấn thường được đặt tại Tel Shimron, một gò lớn ở rìa tây bắc thung lũng Gít-rê-ên, cách Nahalal khoảng 2 km về phía đông bắc; tên Ả Rập của nó, Khirbet Sammuniyeh, còn giữ tên cũ, cũng như Simonias, một làng ở biên giới Ga-li-lê mà Josephus nhắc đến khi thuật cuộc nổi dậy năm 66–67. Các danh sách Ai Cập của thiên niên kỷ 2 TCN và các thư Amarna nêu một thị trấn tên Shim'on hay Shamhuna, thường được cho là nơi này. Các cuộc khai quật bắt đầu cuối thập niên 2010 đã phát lộ di tích thời đồ đồng, thời đồ sắt và thời La Mã. Bản đồ cũng cho thấy Maroun al-Ras ở nam Li-ban, do một số ít người đề nghị cho Sim-rôn-Mê-rôn. Ngày nay Tel Shimron nằm giữa những cánh đồng ở bắc Israel."
  ro:
    - "Șimron era o cetate canaanită din Galileea de Jos, al cărei rege a răspuns chemării lui Iabin al Hațorului: Iabin „a trimis la Iovav împăratul Madonului și la împăratul Semeronului și la împăratul Ashiafului”, iar forțele lor unite au fost zdrobite de Iosua la apele Meromului. Mai târziu cetatea este numărată printre cele douăsprezece cetăți ale lui Zabulon: „Cottat, Naalol, Semron, Iedala și Vitleem”. Regele de la Șimron-Meron din lista regilor înfrânți este probabil același. Biblia nu mai spune nimic despre ea."
    - "Cetatea este plasată în general la Tel Shimron, un tell mare de la marginea nord-vestică a Văii Izreel, la aproximativ 2 km nord-est de Nahalal; numele ei arab, Khirbet Sammuniyeh, păstrează numele, la fel ca Simonias, un sat de la hotarul Galileii pe care îl pomenește Iosif Flaviu în relatarea răscoalei din 66–67 d.Hr. Listele egiptene din mileniul al II-lea î.Hr. și scrisorile de la Amarna pomenesc o cetate Shim'on sau Shamhuna, socotită de obicei aceasta. Săpăturile începute la sfârșitul anilor 2010 au scos la iveală vestigii din epoca bronzului, din epoca fierului și din epoca romană. Harta arată și Maroun al-Ras din sudul Libanului, propus de câțiva pentru Șimron-Meron. Tel Shimron se află astăzi în câmpurile din nordul Israelului."
  bg:
    - "Шимрон бил ханаански град в Долна Галилея, чийто цар откликнал на призива на Явин от Хацор: Явин „прати на Иовава Мадонския цар, и на Симвронския цар, и на Ахсафския цар“, а съединените им сили били разбити от Иисус Навин при водите на Мером. По-късно градът е изброен сред дванадесетте града на Завулон: „Катат, и Наадал, и Симрон, и Идала, и Витлеем“. „Симрон-меронский цар“ в списъка на победените царе вероятно е същият. Друго Библията не казва за него."
    - "Градът обикновено се поставя при Тел Шимрон — голяма могила на северозападния край на Изреелската долина, на около 2 км североизточно от Нахалал; арабското му име, Хирбет Самуние, пази названието, както и Симониада, село на границата на Галилея, което Йосиф Флавий споменава в разказа си за въстанието от 66–67 г. н.е. Египетски списъци от II хилядолетие пр.н.е. и писмата от Амарна назовават град Шимон или Шамхуна, обикновено смятан за същия. Разкопките, започнали в края на 2010-те години, са разкрили останки от бронзовата, желязната и римската епоха. Картата показва и Марун ер-Рас в Южен Ливан, предлаган от неколцина за Шимрон-Мерон. Днес Тел Шимрон лежи сред полетата на Северен Израел."
