# Overview article (ADR 0007). Mainstream facts only; whether the Gilgal of Elijah and Elisha is Jiljiliya or the Gilgal by Jericho is given as debated; the map leans to Jiljiliya.
id: gilgal-elisha
place: a6399b3
title:
  en: "Gilgal of Elijah and Elisha"
  ru: "Галгал Илии и Елисея"
  uk: "Гілгал Іллі та Єлисея"
  es: "Gilgal de Elías y Eliseo"
  pt: "Gilgal de Elias e Eliseu"
  de: "Gilgal bei Elia und Elisa"
  fr: "Guilgal d’Élie et d’Élisée"
  pl: "Gilgal Eliasza i Elizeusza"
  it: "Gàlgala di Elia ed Eliseo"
  nl: "Gilgal van Elia en Elisa"
  cs: "Gilgal Elijášův a Elíšův"
body:
  en:
    - "This Gilgal is the starting point of Elijah's last journey and a gathering place of the prophets around Elisha. It came to pass, “when the LORD would take up Elijah into heaven by a whirlwind, that Elijah went with Elisha from Gilgal”, and from there to Beth-el, Jericho and the Jordan, where Elijah was taken up. Later “Elisha came again to Gilgal: and there was a dearth in the land; and the sons of the prophets were sitting before him”; when one of them shredded wild gourds into the pot, they cried “there is death in the pot”, and Elisha made the pottage harmless by throwing in meal."
    - "Which Gilgal this was is debated. The famous Gilgal of Joshua lay near Jericho, but the Hebrew text says that from Gilgal “they went down to Beth-el”, and Bethel stands high in the hills, so many look for a Gilgal in the hill country instead. The usual candidate, and the map's, is Jiljiliya, a village some 12 km north of Bethel whose name keeps the old one; others hold that the route Gilgal, Bethel, Jericho, Jordan makes better sense if it began by Jericho, and that a school of prophets fits the old sanctuary there. The Gilgal of Deuteronomy, named beside Gerizim and Ebal and “the plains of Moreh”, is sometimes linked with the northern site. No excavation has decided the matter. Jiljiliya today is a small Palestinian village in the West Bank."
  ru:
    - "Этот Галгал — начало последнего пути Илии и место, где пророки собирались вокруг Елисея. «В то время, как Господь восхотел вознести Илию в вихре на небо, шел Илия с Елисеем из Галгала», а оттуда в Вефиль, Иерихон и к Иордану, где Илия был взят. Позже «Елисей же возвратился в Галгал. И был голод в земле той, и сыны пророков сидели пред ним»; когда один из них накрошил в котёл диких плодов, они закричали: «смерть в котле, человек Божий!», и Елисей обезвредил похлёбку, всыпав муки."
    - "Какой это Галгал, спорно. Знаменитый Галгал Иисуса Навина лежал у Иерихона, но в еврейском тексте сказано, что из Галгала они «сошли» в Вефиль, а Вефиль стоит высоко в горах, поэтому многие ищут Галгал в нагорье. Обычный кандидат, принятый и на карте, — Джильджилия, селение примерно в 12 км к северу от Вефиля, сохранившее древнее имя; другие считают, что путь Галгал — Вефиль — Иерихон — Иордан понятнее, если он начался у Иерихона, и что школа пророков подходит к тамошнему древнему святилищу. Галгал Второзакония, названный рядом с Гаризимом и Гевалом, «близ дубравы Море», иногда связывают с северным местом. Раскопки вопроса не решили. Джильджилия сегодня — небольшое палестинское селение на Западном берегу."
  uk:
    - "Цей Гілгал — відправна точка останньої мандрівки Іллі й місце збору пророків навколо Єлисея. Сталося, «того часу, як Господь схотїв взяти Ілию у вихрі на небо, йшов Ілия з Елисеєм із Галгалу», а звідти — до Бет-Ела, Єрихона й Йордану, де Іллю було взято. Пізніше «Елисей же пійшов знов у Галгал. А була тодї голоднеча в тій землї; ученики пророцькі седїли перед ним»; коли один із них накришив у казан дикого зілля, вони закричали: «Смерть у казанї», і Єлисей зробив юшку нешкідливою, всипавши борошна."
    - "Який це був Гілгал, оспорюють. Знаменитий Гілгал Ісуса Навина лежав поблизу Єрихона, але давньоєврейський текст каже, що з Гілгала «пійшли вони в Бетель», а Бет-Ел стоїть високо в горах, тому багато хто шукає Гілгал радше в гірській країні. Звичайний кандидат, і кандидат карти, — Джільджилія, село приблизно за 12 км на північ від Бет-Ела, назва якого зберігає давню; інші вважають, що маршрут Гілгал — Бет-Ел — Єрихон — Йордан має більше сенсу, якщо починається біля Єрихона, і що школа пророків личить давній святині там. Гілгал Повторення Закону, названий поряд із Герізімом і Евалом та «дубравою Море», іноді пов’язують із північним місцем. Жодні розкопки не вирішили питання. Джільджилія сьогодні — невелике палестинське село на Західному березі."
  es:
    - "Este Gilgal es el punto de partida del último viaje de Elías y un lugar de reunión de los profetas en torno a Eliseo. Aconteció que «cuando quiso Jehová alzar á Elías en un torbellino al cielo, Elías venía con Eliseo de Gilgal», y de allí fueron a Betel, Jericó y el Jordán, donde Elías fue arrebatado. Más tarde «Eliseo se volvió á Gilgal. Había entonces grande hambre en la tierra. Y los hijos de los profetas estaban con él»; cuando uno de ellos cortó calabazas silvestres en la olla, clamaron: «la muerte en la olla», y Eliseo hizo inofensivo el potaje echando harina."
    - "Cuál fue este Gilgal es discutido. El famoso Gilgal de Josué estaba cerca de Jericó, pero el texto hebreo dice que desde Gilgal «Descendieron pues á Beth-el», y Betel está en lo alto de las colinas, de modo que muchos buscan un Gilgal en la región montañosa. El candidato habitual, y el del mapa, es Jiljiliya, una aldea a unos 12 km al norte de Betel cuyo nombre conserva el antiguo; otros sostienen que la ruta Gilgal, Betel, Jericó, Jordán tiene más sentido si empezaba junto a Jericó, y que una escuela de profetas encaja con el antiguo santuario de allí. El Gilgal del Deuteronomio, nombrado junto a Gerizim y Ebal y «los llanos de Moreh», se vincula a veces con el sitio del norte. Ninguna excavación ha resuelto el asunto. Jiljiliya es hoy una pequeña aldea palestina en Cisjordania."
  pt:
    - "Este Gilgal é o ponto de partida da última viagem de Elias e um ponto de reunião dos profetas em torno de Eliseu. Aconteceu que, “Quando o SENHOR estava para levar Elias ao céu em um redemoinho, Elias partiu de Gilgal com Eliseu”, e dali para Betel, Jericó e o Jordão, onde Elias foi arrebatado. Mais tarde “Eliseu voltou a Gilgal. Havia fome na terra; e os filhos dos profetas estavam sentados diante dele”; quando um deles cortou trepadeiras silvestres na panela, clamaram: “há morte na panela!”, e Eliseu tornou o ensopado inofensivo lançando nele farinha."
    - "Qual Gilgal era este é debatido. O célebre Gilgal de Josué ficava perto de Jericó, mas o texto hebraico diz que de Gilgal “eles desceram a Betel”, e Betel está bem alto nas colinas, de modo que muitos procuram um Gilgal na região montanhosa. O candidato usual, e o do mapa, é Jiljiliya, uma aldeia a cerca de 12 km ao norte de Betel cujo nome guarda o antigo; outros sustentam que o percurso Gilgal, Betel, Jericó, Jordão faz mais sentido se começasse junto a Jericó, e que uma escola de profetas combina com o antigo santuário ali. O Gilgal de Deuteronômio, nomeado ao lado de Gerizim e Ebal e “junto aos carvalhos de Moré”, é às vezes ligado ao sítio setentrional. Nenhuma escavação decidiu a questão. Jiljiliya é hoje uma pequena aldeia palestina na Cisjordânia."
  de:
    - "Dieses Gilgal ist der Ausgangspunkt von Elias letzter Reise und ein Sammelplatz der Propheten um Elisa. Es geschah: „Da aber der HERR wollte Elia im Wetter gen Himmel holen, gingen Elia und Elisa von Gilgal“, und von dort nach Bethel, Jericho und zum Jordan, wo Elia entrückt wurde. Später heißt es: „Da aber Elisa wieder gen Gilgal kam, ward Teuerung im Lande, und die Kinder der Propheten wohnten vor ihm“; als einer von ihnen Wildkürbisse in den Topf zerschnitt, schrien sie: „der Tod im Topf!“, und Elisa machte das Gemüse unschädlich, indem er Mehl hineintat."
    - "Welches Gilgal das war, ist umstritten. Das berühmte Gilgal Josuas lag bei Jericho, doch der hebräische Text sagt, dass sie von Gilgal „hinab gen Beth-El“ kamen, und Bethel liegt hoch im Bergland; deshalb suchen viele ein Gilgal im Bergland. Der übliche Kandidat, auch der der Karte, ist Dschildschilja, ein Dorf etwa 12 km nördlich von Bethel, dessen Name den alten bewahrt; andere meinen, die Wegfolge Gilgal, Bethel, Jericho, Jordan ergebe mehr Sinn, wenn sie bei Jericho begonnen habe, und eine Prophetenschule passe zum alten Heiligtum dort. Das Gilgal des fünften Buches Mose, neben Garizim und Ebal und „dem Hain More“ genannt, wird bisweilen mit der nördlichen Stätte verbunden. Keine Grabung hat die Frage entschieden. Dschildschilja ist heute ein kleines palästinensisches Dorf im Westjordanland."
  fr:
    - "Ce Guilgal est le point de départ du dernier voyage d’Élie et un lieu de rassemblement des prophètes autour d’Élisée. « Lorsque l’Éternel fit monter Élie au ciel dans un tourbillon, Élie partait de Guilgal avec Élisée », puis de là vers Béthel, Jéricho et le Jourdain, où Élie fut enlevé. Plus tard, « Élisée revint à Guilgal, et il y avait une famine dans le pays. Comme les fils des prophètes étaient assis devant lui » ; quand l’un d’eux eut coupé des coloquintes sauvages dans le pot, ils s’écrièrent : « La mort est dans le pot », et Élisée rendit le potage inoffensif en y jetant de la farine."
    - "Quel Guilgal c’était, on en débat. Le célèbre Guilgal de Josué se trouvait près de Jéricho, mais le texte hébreu dit que de Guilgal « ils descendirent à Béthel », et Béthel se dresse haut dans les collines, si bien que beaucoup cherchent plutôt un Guilgal dans la montagne. Le candidat habituel, et celui de la carte, est Jiljiliya, un village à quelque 12 km au nord de Béthel dont le nom garde l’ancien ; d’autres soutiennent que l’itinéraire Guilgal, Béthel, Jéricho, Jourdain a plus de sens s’il partait de Jéricho, et qu’une école de prophètes convient à l’ancien sanctuaire de ce lieu. Le Guilgal du Deutéronome, nommé à côté du Garizim et de l’Ébal et des « chênes de Moré », est parfois rattaché au site du nord. Aucune fouille n’a tranché. Jiljiliya est aujourd’hui un petit village palestinien de Cisjordanie."
  pl:
    - "Ten Gilgal jest punktem wyjścia ostatniej podróży Eliasza i miejscem zgromadzeń proroków wokół Elizeusza. Stało się, „gdy miał wziąć Pan Elijasza w wichrze do nieba, że wyszedł Elijasz z Elizeuszem z Galgal”, a stamtąd do Betel, Jerycha i Jordanu, gdzie Eliasz został wzięty. Później „wrócił się Elizeusz do Galgal, a głód był w onej ziemi, i synowie proroccy mieszkali przy nim”; gdy jeden z nich pokrajał dzikie tykwy do garnca, zawołali: „Śmierć w garncu”, a Elizeusz uczynił potrawę nieszkodliwą, wrzuciwszy do niej mąkę."
    - "Który to Gilgal, jest sporne. Słynny Gilgal Jozuego leżał koło Jerycha, lecz tekst hebrajski mówi, że z Gilgal zstąpili do Betel, a Betel leży wysoko w górach, więc wielu szuka Gilgal raczej w górach. Zwykły kandydat, i kandydat mapy, to Dżildżilija, wieś około 12 km na północ od Betel, której nazwa zachowuje dawną; inni uważają, że trasa Gilgal, Betel, Jerycho, Jordan ma więcej sensu, jeśli zaczynała się koło Jerycha, i że szkoła proroków pasuje do dawnego sanktuarium tam. Gilgal z Księgi Powtórzonego Prawa, wymieniony obok Gerizim i Ebal w słowach „przeciwko Galgal, przy równinie Morech”, bywa wiązany z miejscem północnym. Żadne wykopaliska nie rozstrzygnęły sprawy. Dżildżilija to dziś mała palestyńska wieś na Zachodnim Brzegu."
  it:
    - "Questa Gàlgala è il punto di partenza dell’ultimo viaggio di Elia e un luogo di riunione dei profeti attorno a Eliseo. Avvenne «quando l’Eterno volle rapire in cielo Elia in un turbine, Elia si partì da Ghilgal con Eliseo», e di lì a Betel, a Gerico e al Giordano, dove Elia fu rapito. Più tardi «Eliseo se ne tornò a Ghilgal, e v’era carestia nel paese. Or mentre i discepoli de’ profeti stavan seduti davanti a lui»; quando uno di loro tagliò zucche selvatiche nella pentola, essi gridarono: «C’è la morte, nella marmitta», ed Eliseo rese innocua la minestra gettandovi della farina."
    - "Quale Gàlgala fosse è discusso. La famosa Gàlgala di Giosuè sorgeva presso Gerico, ma il testo ebraico dice che da Gàlgala «discesero a Bethel», e Betel sta in alto sui monti, così molti cercano invece una Gàlgala nella regione collinosa. Il candidato consueto, e quello della mappa, è Jiljiliya, un villaggio circa 12 km a nord di Betel il cui nome conserva quello antico; altri ritengono che il percorso Gàlgala, Betel, Gerico, Giordano abbia più senso se cominciasse presso Gerico, e che una scuola di profeti si addica all’antico santuario di là. La Gàlgala del Deuteronomio, nominata accanto a Garizim ed Ebal e alla «querce di Moreh», è talvolta collegata al sito settentrionale. Nessuno scavo ha deciso la questione. Jiljiliya è oggi un piccolo villaggio palestinese in Cisgiordania."
  nl:
    - "Dit Gilgal is het beginpunt van Elia’s laatste reis en een verzamelplaats van de profeten rond Elisa. Het geschiedde, “als de HEERE Elia met een onweder ten hemel opnemen zou, dat Elia met Elisa ging van Gilgal”, en vandaar naar Bethel, Jericho en de Jordaan, waar Elia werd opgenomen. Later, toen “Elisa weder te Gilgal kwam, zo was er honger in dat land, en de zonen der profeten zaten voor zijn aangezicht”; toen een van hen de wilde kolokwinten in de pot sneed, riepen ze: “de dood is in den pot”, en Elisa maakte het moes onschadelijk door er meel in te werpen."
    - "Welk Gilgal dit was, is omstreden. Het beroemde Gilgal van Jozua lag bij Jericho, maar volgens de Hebreeuwse tekst “gingen zij af naar Beth-El” vanuit Gilgal, en Bethel ligt hoog in het bergland, zodat velen een Gilgal in het bergland zoeken. De gebruikelijke kandidaat, ook van de kaart, is Jiljiliya, een dorp ongeveer 12 km ten noorden van Bethel waarvan de naam de oude bewaart; anderen menen dat de route Gilgal, Bethel, Jericho, Jordaan meer zin heeft als ze bij Jericho begon, en dat een profetenschool bij het oude heiligdom daar past. Het Gilgal van Deuteronomium, genoemd naast Gerizim en Ebal en “de eikenbossen van More”, wordt soms met de noordelijke plaats in verband gebracht. Geen opgraving heeft de kwestie beslist. Jiljiliya is nu een klein Palestijns dorp op de Westoever."
  cs:
    - "Tento Gilgal je výchozím bodem Elijášovy poslední cesty a shromaždištěm proroků kolem Elíši. Stalo se, „když měl již vzíti Hospodin Eliáše u vichru do nebe, že vyšel Eliáš s Elizeem z Galgala“, a odtud do Bét-elu, Jericha a k Jordánu, kde byl Elijáš vzat. Později „Elizeus navrátil se do Galgala. Byl pak hlad v té zemi, a synové proročtí seděli před ním“; když jeden z nich nakrájel do hrnce plané tykve, vykřikli „Smrt v hrnci“, a Elíša učinil kaši neškodnou tím, že do ní vsypal mouku."
    - "Který Gilgal to byl, je sporné. Slavný Jozuův Gilgal ležel u Jericha, ale hebrejský text praví, že z Gilgalu sestoupili do Bét-elu, a Bét-el stojí vysoko v horách, takže mnozí hledají Gilgal spíše v pahorkatině. Obvyklým kandidátem, i na mapě, je Jiljiliya, vesnice asi 12 km severně od Bét-elu, jejíž jméno zachovává staré; jiní soudí, že trasa Gilgal, Bét-el, Jericho, Jordán dává lepší smysl, začala-li u Jericha, a že škola proroků se hodí ke staré svatyni tam. Gilgal z Deuteronomia, jmenovaný vedle Gerizimu a Ébalu a „blízko rovin More“, se někdy spojuje se severním místem. Žádné vykopávky věc nerozhodly. Jiljiliya je dnes malá palestinská vesnice na Západním břehu."
