# Overview article (ADR 0007). Mainstream facts only; Roman and Byzantine dates follow the excavation reports, and the disputed dating of the synagogue is named as such.
id: chorazin
place: a593a48
title:
  en: "Chorazin"
  ru: "Хоразин"
  uk: "Хоразин"
  es: "Corazín"
  pt: "Corazim"
  de: "Chorazin"
  fr: "Chorazin"
body:
  en:
    - "Chorazin stood on the basalt hills above the northern shore of the Sea of Galilee, about 3 km north of Capernaum, at the ruin called Khirbet Karazeh, where the old name survives. H. Kohl and C. Watzinger studied its synagogue from 1905, and Ze'ev Yeivin excavated the site in 1962–1964 and 1980–1987. The town uncovered belongs mostly to the third and fourth centuries AD: houses, streets, a ritual bath and olive presses, all built of the local black basalt around the synagogue."
    - 'Chorazin is named in the Gospels only once, in a saying given by both Matthew and Luke. Matthew sets it among the cities "wherein most of his mighty works were done, because they repented not": "Woe unto thee, Chorazin! woe unto thee, Bethsaida!" Had those works been done in Tyre and Sidon, Jesus said, they would have repented long ago in sackcloth and ashes, and it would be more tolerable for Tyre and Sidon at the day of judgment. The Gospels describe no particular event at Chorazin.'
    - "A teaching in the Babylonian Talmud says that the grain of Kerazayim, usually taken to be Chorazin, would have been brought for the omer offering if the place had been nearer Jerusalem. In the early fourth century Eusebius described Chorazin as a village of Galilee, now deserted, two miles from Capernaum. Its basalt synagogue, decorated with carved reliefs, is dated by its excavator to the late third or early fourth century; it seems to have been damaged in the fourth century and later restored, but its dates remain debated."
  ru:
    - "Хоразин стоял на базальтовых холмах над северным берегом Галилейского моря, примерно в 3 км к северу от Капернаума, на развалинах Хирбет-Керазе, где сохранилось древнее имя. Синагогу здесь изучали Г. Коль и К. Ватцингер начиная с 1905 г., а в 1962–1964 и 1980–1987 гг. городище раскапывал Зеэв Йеивин. Открытый город относится в основном к III–IV векам н. э.: дома, улицы, ритуальная купальня и давильни для оливок, всё из местного чёрного базальта, окружали синагогу."
    - "Хоразин упомянут в Евангелиях лишь однажды — в речении, которое приводят и Матфей, и Лука. Матфей называет его среди городов, «в которых наиболее явлено было сил Его, за то, что они не покаялись»: «горе тебе, Хоразин! горе тебе, Вифсаида!» Если бы в Тире и Сидоне явлены были такие силы, сказал Иисус, они давно покаялись бы во вретище и пепле, и Тиру и Сидону отраднее будет в день суда. Никаких отдельных событий в Хоразине Евангелия не описывают."
    - "Одно из учений Вавилонского Талмуда говорит, что зерно из Керазаима — его обычно отождествляют с Хоразином — приносили бы для омера, будь это место ближе к Иерусалиму. В начале IV века Евсевий описывал Хоразин как селение Галилеи, ныне запустевшее, в двух милях от Капернаума. Базальтовую синагогу, украшенную резными рельефами, раскопщик датирует концом III или началом IV века; по-видимому, в IV веке она пострадала и позже была восстановлена, но её даты по-прежнему спорны."
  uk:
    - "Хоразин стояв на базальтових пагорбах над північним берегом Галілейського моря, приблизно за 3 км на північ від Капернаума, на руїнах, званих Хірбет-Каразе, де стара назва збереглася. Г. Коль і К. Ватцінгер досліджували його синагогу від 1905 р., а Зеев Єйвін розкопував місце в 1962–1964 і 1980–1987 рр. Відкрите місто здебільшого належить до III–IV ст. н. е.: будинки, вулиці, ритуальна купіль і олійні преси, усе збудоване з місцевого чорного базальту навколо синагоги."
    - "Хоразин названо в Євангеліях лише раз, у вислові, який подають і Матвій, і Лука. Матвій ставить його серед міст, «де стало ся найбільше чудес Його, що не покаялись»: «Горе тобі, Хоразине! горе тобі, Витсаїдо!» Якби ті чудеса були вчинені в Тирі та Сидоні, сказав Ісус, вони давно покаялися б у веретищі та попелі, і Тиру та Сидону буде легше в день суду. Євангелії не описують жодної окремої події в Хоразині."
    - "Вчення у Вавилонському Талмуді каже, що зерно Керазаїма, яке зазвичай вважають Хоразином, було б принесене для жертви омера, якби місце було ближче до Єрусалима. На початку IV ст. Євсевій описав Хоразин як село в Галілеї, нині безлюдне, за дві милі від Капернаума. Його базальтова синагога, прикрашена різьбленими рельєфами, датована її розкопувачем кінцем III або початком IV ст.; вона, схоже, була пошкоджена в IV ст. і пізніше відновлена, але її дати лишаються спірними."
  es:
    - "Corazín se alzaba en las colinas de basalto sobre la orilla norte del mar de Galilea, a unos 3 km al norte de Cafarnaúm, en la ruina llamada Khirbet Karazeh, donde sobrevive el antiguo nombre. H. Kohl y C. Watzinger estudiaron su sinagoga desde 1905, y Ze'ev Yeivin excavó el sitio en 1962–1964 y 1980–1987. La ciudad descubierta pertenece sobre todo a los siglos III y IV d. C.: casas, calles, un baño ritual y almazaras, todo construido con el basalto negro local en torno a la sinagoga."
    - "Corazín se nombra en los Evangelios una sola vez, en un dicho que recogen Mateo y Lucas. Mateo la sitúa entre las ciudades «en las cuales habían sido hechas muy muchas de sus maravillas, porque no se habían arrepentido»: «¡Ay de ti, Corazín! ¡Ay de ti, Bethsaida!». Si esas maravillas se hubieran hecho en Tiro y Sidón, dijo Jesús, se habrían arrepentido hace mucho en saco y ceniza, y el castigo sería más tolerable para Tiro y Sidón en el día del juicio. Los Evangelios no describen ningún acontecimiento concreto en Corazín."
    - "Una enseñanza del Talmud babilónico dice que el grano de Kerazayim, que suele identificarse con Corazín, habría sido llevado para la ofrenda del omer si el lugar hubiera estado más cerca de Jerusalén. A principios del siglo IV Eusebio describió Corazín como una aldea de Galilea, ya desierta, a dos millas de Cafarnaúm. Su sinagoga de basalto, decorada con relieves tallados, es fechada por su excavador a finales del siglo III o principios del IV; parece haber sufrido daños en el siglo IV y haber sido restaurada más tarde, pero sus fechas siguen en debate."
  pt:
    - "Corazim ficava nas colinas de basalto acima da margem norte do Mar da Galileia, cerca de 3 km ao norte de Cafarnaum, nas ruínas chamadas Khirbet Karazeh, onde o antigo nome sobrevive. H. Kohl e C. Watzinger estudaram sua sinagoga a partir de 1905, e Ze'ev Yeivin escavou o local em 1962–1964 e 1980–1987. A cidade descoberta pertence sobretudo aos séculos III e IV d.C.: casas, ruas, um banho ritual e lagares de azeite, tudo construído com o basalto negro local em torno da sinagoga."
    - "Corazim é nomeada nos Evangelhos uma única vez, numa palavra de Jesus dada por Mateus e por Lucas. Mateus a põe entre as cidades “nas quais a maioria das suas obras poderosas havia sido realizada, porque não se arrependeram”: “Ai de você, Corazim! Ai de você, Betsaida!” Se aquelas obras tivessem sido feitas em Tiro e Sidom, disse Jesus, há muito elas se teriam arrependido em pano de saco e cinzas, e haveria mais tolerância para Tiro e Sidom no dia do juízo. Os Evangelhos não descrevem nenhum acontecimento particular em Corazim."
    - "Um ensinamento do Talmude Babilônico diz que o trigo de Kerazayim, geralmente tomada por Corazim, seria trazido para a oferta do ômer se o lugar estivesse mais perto de Jerusalém. No início do século IV, Eusébio descreveu Corazim como uma aldeia da Galileia, agora deserta, a duas milhas de Cafarnaum. Sua sinagoga de basalto, decorada com relevos esculpidos, é datada por seu escavador do fim do século III ou início do IV; parece ter sido danificada no século IV e depois restaurada, mas suas datas continuam debatidas."
  de:
    - "Chorazin lag auf den Basalthügeln oberhalb des Nordufers des Sees Genezareth, etwa 3 km nördlich von Kapernaum, bei der Ruine Khirbet Karazeh, wo der alte Name fortlebt. H. Kohl und C. Watzinger untersuchten ab 1905 seine Synagoge, und Ze’ev Yeivin grub den Ort 1962–1964 und 1980–1987 aus. Die freigelegte Stadt gehört größtenteils dem 3. und 4. Jahrhundert n. Chr. an: Häuser, Straßen, ein rituelles Bad und Ölpressen, alle aus dem örtlichen schwarzen Basalt um die Synagoge gebaut."
    - "Chorazin wird in den Evangelien nur einmal genannt, in einem Wort, das Matthäus und Lukas überliefern. Matthäus stellt es unter die Städte, „in welchen am meisten seiner Taten geschehen waren, und hatten sich doch nicht gebessert“: „Wehe dir Chorazin! Weh dir, Bethsaida!“ Wären diese Taten in Tyrus und Sidon geschehen, sagte Jesus, hätten sie längst in Sack und Asche Buße getan, und es werde Tyrus und Sidon am Tag des Gerichts erträglicher gehen. Die Evangelien beschreiben kein bestimmtes Ereignis in Chorazin."
    - "Eine Lehre im Babylonischen Talmud besagt, dass das Getreide von Kerazajim, gewöhnlich für Chorazin gehalten, für das Omer-Opfer herbeigeschafft worden wäre, wenn der Ort näher bei Jerusalem gelegen hätte. Anfang des 4. Jahrhunderts beschrieb Eusebius Chorazin als Dorf in Galiläa, nun verlassen, zwei Meilen von Kapernaum entfernt. Seine mit geschnitzten Reliefs verzierte Basaltsynagoge wird von ihrem Ausgräber in das späte 3. oder frühe 4. Jahrhundert datiert; sie scheint im 4. Jahrhundert beschädigt und später wiederhergestellt worden zu sein, doch ihre Daten bleiben umstritten."
  fr:
    - "Chorazin se dressait sur les collines de basalte au-dessus de la rive nord de la Mer de Galilée, à environ 3 km au nord de Capernaüm, à la ruine appelée Khirbet Karazeh, où le nom ancien survit. H. Kohl et C. Watzinger étudièrent sa synagogue à partir de 1905, et Ze’ev Yeivin fouilla le site en 1962–1964 et 1980–1987. La ville mise au jour date surtout des IIIe et IVe siècles apr. J.-C. : maisons, rues, bain rituel et pressoirs à olives, tous construits en basalte noir local autour de la synagogue."
    - "Chorazin n’est nommée qu’une fois dans les Évangiles, dans une parole rapportée par Matthieu et par Luc. Matthieu la range parmi les villes « dans lesquelles avaient eu lieu la plupart de ses miracles, parce qu’elles ne s’étaient pas repenties » : « Malheur à toi, Chorazin ! Malheur à toi, Bethsaïda ! » Si ces œuvres avaient été faites à Tyr et à Sidon, dit Jésus, elles se seraient repenties depuis longtemps dans le sac et la cendre, et Tyr et Sidon seraient traitées plus doucement au jour du jugement. Les Évangiles ne décrivent aucun événement précis à Chorazin."
    - "Un enseignement du Talmud de Babylone dit que le grain de Kerazayim, généralement tenu pour Chorazin, aurait été apporté pour l’offrande de l’omer si le lieu avait été plus proche de Jérusalem. Au début du IVe siècle, Eusèbe décrivait Chorazin comme un village de Galilée, alors désert, à deux milles de Capernaüm. Sa synagogue de basalte, ornée de reliefs sculptés, est datée par son fouilleur de la fin du IIIe ou du début du IVe siècle ; elle semble avoir été endommagée au IVe siècle puis restaurée, mais ses dates restent débattues."
scripture:
  - Matt.11.20-Matt.11.22
  - Luke.10.13-Luke.10.14
