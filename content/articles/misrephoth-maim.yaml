# Overview article (ADR 0007). Mainstream facts only; the site and the meaning of the name are disputed, and the candidates are given without choosing one.
id: misrephoth-maim
place: a5bf0bd
title:
  en: "Misrephoth-maim"
  ru: "Мисрефоф-Маим"
body:
  en:
    - "Misrephoth-maim marks the north-western limit of Joshua’s campaigns, towards the land of Sidon. After the battle at the waters of Merom the LORD delivered the northern kings into Israel’s hand, “who smote them, and chased them unto great Zidon, and unto Misrephoth-maim, and unto the valley of Mizpeh eastward”. Later, among the land still to be taken, the LORD promises: “All the inhabitants of the hill country from Lebanon unto Misrephoth-maim, and all the Sidonians, them will I drive out from before the children of Israel.” The name is obscure: the King James margin offers “salt pits” or “burnings of waters”, perhaps hot springs or places where salt or lime was burned, and some read the Hebrew as “Misrephoth to the west”. Nothing more is told."
    - "The place should lie on or near the coast of southern Phoenicia, at the southern edge of the Sidonians’ land. The candidates on the map are the Litani River, which is marked first, a natural boundary; Ain Mesherfi and Khirbet el-Musheirifeh near the headland of Rosh HaNikra, whose names recall Misrephoth; the village of Srifa east of Tyre; and Rosh HaNikra itself, the white cliffs on today’s Israel–Lebanon border. None has been confirmed by excavation or inscription."
  ru:
    - "Мисрефоф-Маим обозначает северо-западный предел походов Иисуса Навина, в сторону земли Сидонской. После битвы у вод Меромских Господь предал северных царей в руки Израильтян, «и поразили они их, и преследовали их до Сидона великого и до Мисрефоф-Маима, и до долины Мицфы к востоку». Позже, среди земли, которую ещё предстояло взять, Господь обещает: «Всех горных жителей от Ливана до Мисрефоф-Маима, всех Сидонян Я изгоню от лица сынов Израилевых». Имя темно: на полях английской Библии короля Якова предложено «соляные копи» или «горение вод» — быть может, горячие источники или места, где выжигали соль или известь, а некоторые читают еврейский текст как «Мисрефоф к западу». Больше ничего не рассказано."
    - "Место должно лежать на побережье южной Финикии или близ него, на южном краю земли Сидонян. Кандидаты на карте — река Литани, которая стоит первой, как естественная граница; Айн-Мешерфи и Хирбет-эль-Мушейрифе у мыса Рош-ха-Никра, чьи имена напоминают Мисрефоф; селение Срифа к востоку от Тира; и сам Рош-ха-Никра — белые скалы на нынешней границе Израиля и Ливана. Ни раскопки, ни надписи ни одно из этих мест не подтвердили."
scripture:
  - Josh.11.8
  - Josh.13.6
sources:
