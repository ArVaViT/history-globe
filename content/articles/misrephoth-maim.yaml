# Overview article (ADR 0007). Mainstream facts only; the site and the meaning of the name are disputed, and the candidates are given without choosing one.
id: misrephoth-maim
place: a5bf0bd
title:
  en: "Misrephoth-maim"
  ru: "Мисрефоф-Маим"
  uk: "Місрефот-Маїм"
  es: "Misrefot-maim"
  pt: "Misrefote-Maim"
  de: "Misrefot-Majim"
  fr: "Misrephoth-Maïm"
body:
  en:
    - "Misrephoth-maim marks the north-western limit of Joshua’s campaigns, towards the land of Sidon. After the battle at the waters of Merom the LORD delivered the northern kings into Israel’s hand, “who smote them, and chased them unto great Zidon, and unto Misrephoth-maim, and unto the valley of Mizpeh eastward”. Later, among the land still to be taken, the LORD promises: “All the inhabitants of the hill country from Lebanon unto Misrephoth-maim, and all the Sidonians, them will I drive out from before the children of Israel.” The name is obscure: the King James margin offers “salt pits” or “burnings of waters”, perhaps hot springs or places where salt or lime was burned, and some read the Hebrew as “Misrephoth to the west”. Nothing more is told."
    - "The place should lie on or near the coast of southern Phoenicia, at the southern edge of the Sidonians’ land. The candidates on the map are the Litani River, which is marked first, a natural boundary; Ain Mesherfi and Khirbet el-Musheirifeh near the headland of Rosh HaNikra, whose names recall Misrephoth; the village of Srifa east of Tyre; and Rosh HaNikra itself, the white cliffs on today’s Israel–Lebanon border. None has been confirmed by excavation or inscription."
  ru:
    - "Мисрефоф-Маим обозначает северо-западный предел походов Иисуса Навина, в сторону земли Сидонской. После битвы у вод Меромских Господь предал северных царей в руки Израильтян, «и поразили они их, и преследовали их до Сидона великого и до Мисрефоф-Маима, и до долины Мицфы к востоку». Позже, среди земли, которую ещё предстояло взять, Господь обещает: «Всех горных жителей от Ливана до Мисрефоф-Маима, всех Сидонян Я изгоню от лица сынов Израилевых». Имя темно: на полях английской Библии короля Якова предложено «соляные копи» или «горение вод» — быть может, горячие источники или места, где выжигали соль или известь, а некоторые читают еврейский текст как «Мисрефоф к западу». Больше ничего не рассказано."
    - "Место должно лежать на побережье южной Финикии или близ него, на южном краю земли Сидонян. Кандидаты на карте — река Литани, которая стоит первой, как естественная граница; Айн-Мешерфи и Хирбет-эль-Мушейрифе у мыса Рош-ха-Никра, чьи имена напоминают Мисрефоф; селение Срифа к востоку от Тира; и сам Рош-ха-Никра — белые скалы на нынешней границе Израиля и Ливана. Ни раскопки, ни надписи ни одно из этих мест не подтвердили."
  uk:
    - "Місрефот-Маїм позначає північно-західну межу походів Ісуса Навина, у бік землі Сідона. Після битви при водах Мерому Господь віддав північних царів в руки Ізраїлю, «били вони їх і гнали їх до Сидону великого і до Мисрефот-Маїму і до Мицфи-долини на схід сонця». Пізніше, серед землі, що ще треба було взяти, Господь обіцяє: «Усїх нагірних осадників від Ливану до Мизрефот-Маіму, всїх Сидонян я попроганяю сам перед Ізраїльом». Назва темна: на полях Біблії короля Якова пропонуються «соляні ями» або «спалювання вод», можливо, гарячі джерела або місця, де палили сіль чи вапно, а дехто читає староєврейське як «Місрефот на заході». Більше нічого не розповідається."
    - "Місце має лежати на узбережжі південної Фінікії або поблизу нього, на південному краю землі сідонян. Кандидати на мапі — ріка Літані, позначена першою, природна межа; Айн-Мешерфі та Хірбет-ель-Мушейріфе біля мису Рош-ха-Нікра, чиї назви нагадують Місрефот; село Срифа на схід від Тіру; і сам Рош-ха-Нікра, білі скелі на сучасному кордоні Ізраїлю з Ліваном. Жодне не підтверджене розкопками чи написом."
  es:
    - "Misrefot-maim marca el límite noroccidental de las campañas de Josué, hacia la tierra de Sidón. Tras la batalla junto a las aguas de Merom, Jehová entregó los reyes del norte en manos de Israel, «los cuales los hirieron y siguieron hasta Sidón la grande, y hasta las aguas calientes, y hasta el llano de Mizpa al oriente» (la Reina-Valera traduce el nombre como «las aguas calientes»). Más tarde, entre la tierra todavía por tomar, Jehová promete: «Todos los que habitan en las montañas desde el Líbano hasta las aguas calientes, todos los Sidonios; yo los desarraigaré delante de lo hijos de Israel». El nombre es oscuro: el margen de la versión del rey Jacobo ofrece «salinas» o «quemaduras de aguas», quizá fuentes termales o lugares donde se quemaba sal o cal, y algunos leen el hebreo como «Misrefot al oeste». No se cuenta nada más."
    - "El lugar debe de estar en la costa del sur de Fenicia, o cerca de ella, en el borde meridional de la tierra de los sidonios. Los candidatos del mapa son el río Litani, marcado en primer lugar, una frontera natural; Ain Mesherfi y Khirbet el-Musheirifeh, cerca del cabo de Rosh HaNikra, cuyos nombres recuerdan Misrefot; la aldea de Srifa, al este de Tiro; y la propia Rosh HaNikra, los acantilados blancos de la actual frontera entre Israel y el Líbano. Ninguno ha sido confirmado por excavación o inscripción."
  pt:
    - "Misrefote-Maim marca o limite noroeste das campanhas de Josué, rumo à terra de Sidom. Depois da batalha nas águas de Merom, o SENHOR entregou os reis do norte nas mãos de Israel, que “os feriram, e os perseguiram até a grande Sidom, e até Misrefote-Maim, e até o vale de Mispá, a leste”. Mais tarde, entre a terra ainda por tomar, o SENHOR promete: “todos os habitantes da região montanhosa, desde o Líbano até Misrefote-Maim, isto é, todos os sidônios. Eu os expulsarei de diante dos filhos de Israel.” O nome é obscuro: a margem da King James oferece “salinas” ou “queimas de águas”, talvez fontes quentes ou lugares onde se queimava sal ou cal, e alguns leem o hebraico como “Misrefote ao oeste”. Nada mais se conta."
    - "O lugar deve ficar na costa ou perto dela, no sul da Fenícia, no limite meridional da terra dos sidônios. Os candidatos no mapa são o rio Litani, marcado em primeiro lugar, uma fronteira natural; Ain Mesherfi e Khirbet el-Musheirifeh, perto do promontório de Rosh HaNikra, cujos nomes lembram Misrefote; a aldeia de Srifa, a leste de Tiro; e o próprio Rosh HaNikra, os penhascos brancos na atual fronteira Israel–Líbano. Nenhum foi confirmado por escavação ou inscrição."
  de:
    - "Misrefot-Majim bezeichnet die nordwestliche Grenze von Josuas Feldzügen, zum Land Sidon hin. Nach der Schlacht an den Wassern von Merom gab der HERR die nördlichen Könige in Israels Hand: „und schlugen sie und jagten sie bis gen Groß-Sidon und bis an die warmen Wasser und bis an die Ebene Mizpa gegen Morgen“. Später, unter dem Land, das noch einzunehmen war, verheißt der HERR: „Alle, die auf dem Gebirge wohnen, vom Libanon an bis an die warmen Wasser, alle Sidonier: ich will sie vertreiben vor den Kindern Israel.“ Der Name ist dunkel: Der Rand der King-James-Version bietet „Salzgruben“ oder „Wasserbrände“, vielleicht heiße Quellen oder Orte, wo Salz oder Kalk gebrannt wurde, und manche lesen das Hebräische als „Misrefot im Westen“. Mehr wird nicht erzählt."
    - "Der Ort sollte an oder nahe der Küste des südlichen Phönizien liegen, am Südrand des Landes der Sidonier. Die Kandidaten auf der Karte sind der Litani, der zuerst eingetragen ist, eine natürliche Grenze; Ain Mesherfi und Khirbet el-Musheirifeh bei der Landspitze Rosch ha-Nikra, deren Namen an Misrefot erinnern; das Dorf Srifa östlich von Tyrus; und Rosch ha-Nikra selbst, die weißen Klippen an der heutigen Grenze zwischen Israel und dem Libanon. Keiner ist durch Ausgrabung oder Inschrift bestätigt."
  fr:
    - "Misrephoth-Maïm marque la limite nord-ouest des campagnes de Josué, vers le pays de Sidon. Après la bataille aux eaux de Mérom, l’Éternel livra les rois du nord entre les mains d’Israël, qui « les battirent et les poursuivirent jusqu’à Sidon la grande, jusqu’à Misrephoth-Maïm, et jusqu’à la vallée de Mitspa vers l’orient ». Plus tard, parmi le pays restant à prendre, l’Éternel promet : « tous les habitants de la montagne, depuis le Liban jusqu’à Misrephoth-Maïm, tous les Sidoniens. Je les chasserai devant les enfants d’Israël. » Le nom est obscur : la marge de la version du roi Jacques propose « salines » ou « brûlures d’eaux », peut-être des sources chaudes ou des lieux où l’on brûlait du sel ou de la chaux, et certains lisent l’hébreu « Misrephoth à l’ouest ». On n’en dit rien de plus."
    - "Le lieu devrait se trouver sur la côte ou près de la côte du sud de la Phénicie, à la lisière méridionale du pays des Sidoniens. Les candidats de la carte sont le Litani, marqué en premier, frontière naturelle ; Aïn Mesherfi et Khirbet el-Musheirifeh près du promontoire de Rosh Hanikra, dont les noms rappellent Misrephoth ; le village de Srifa à l’est de Tyr ; et Rosh Hanikra lui-même, les falaises blanches de l’actuelle frontière israélo-libanaise. Aucun n’a été confirmé par une fouille ou une inscription."
scripture:
  - Josh.11.8
  - Josh.13.6
sources:
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
  - "R. G. Boling and G. E. Wright, Joshua (Anchor Bible 6, 1982)"
  - "A. F. Rainey and R. S. Notley, The Sacred Bridge: Carta's Atlas of the Biblical World (2006)"
