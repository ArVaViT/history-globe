body:
  en:
    - "Baal-peor, “the lord of Peor”, was the god worshipped at Peor, a height of Moab above the plains where Israel camped before crossing the Jordan, and the name came to stand for the place and for what happened there. While Israel “abode in Shittim”, the people took part in the sacrifices to the gods of Moab, “and Israel joined himself unto Baal-peor”, and a plague followed. The episode became a byword for apostasy. Moses reminds the next generation: “Your eyes have seen what the LORD did because of Baal-peor”; the psalm recalls that they “joined themselves also unto Baal-peor, and ate the sacrifices of the dead”; and Hosea sets it against God's first delight in Israel: “they went to Baal-peor, and separated themselves unto that shame”."
    - "As a place, Baal-peor is the same as Peor, or the town of Beth-peor below it, in the hills north-west of Madaba facing the Dead Sea; which peak it was no one knows, and proposed ruins such as Khirbet el-Muhatta rest on position alone. Nothing of the cult itself has been found, and what is known of the god comes only from these passages."
  ru:
    - "Ваал-Фегор, «господин Фегора», — бог, которому поклонялись на Фегоре, высоте Моава над равнинами, где Израиль стоял станом перед переходом Иордана; имя стало означать и само место, и то, что там произошло. Когда «жил Израиль в Ситтиме», народ участвовал в жертвах богам Моава, и «прилепился Израиль к Ваал-Фегору», а за этим последовало поражение. Этот случай стал нарицательным для отступничества. Моисей напоминает следующему поколению: «Глаза ваши видели все, что сделал Господь Бог наш с Ваал-Фегором»; псалом вспоминает: «Они прилепились к Ваалфегору и ели жертвы бездушным»; а Осия противопоставляет его первой радости Бога об Израиле: «они пошли к Ваал-Фегору и предались постыдному»."
    - "Как место Ваал-Фегор — то же, что Фегор или городок Беф-Фегор под ним, в холмах к северо-западу от Мадабы, обращённых к Мёртвому морю; какая это вершина, никто не знает, и предлагаемые развалины, например Хирбет-эль-Мухатта, держатся лишь на положении. Ничего от самого культа не найдено, и всё, что известно об этом боге, известно только из этих мест Писания."
  uk:
    - "Ваал-Пеор, «володар Пеору», був богом, якого шанували в Пеорі, на висоті Моаба над рівнинами, де Ізраїль стояв табором перед переходом Йордану, і ім'я стало означати місце й те, що там сталося. Коли «жив Ізраїль у Ситтимі», народ узяв участь у жертвах богам Моава, «прихиливсь Ізраїль до Бааль-Пеора», і настала пошесть. Цей епізод став символом відступництва. Мойсей нагадує наступному поколінню: «Очі ваші бачили, що вдїяв Господь з Бааль Пеором»; псалом згадує, що вони: «Пристали вони до Баал-Пегора, й їли жертви мертвих ідолів»; а Осія протиставляє це першій Божій радості в Ізраїлі: «вони обернулись до Вааль-Пеора й віддали себе гидотї»."
    - "Як місце, Ваал-Пеор — те саме, що й Пеор, або містечко Бет-Пеор під ним, у пагорбах на північний захід від Мадаби, звернених до Мертвого моря; яка це була вершина, ніхто не знає, а запропоновані руїни, як-от Хірбет-ель-Мухатта, спираються лише на розташування. Від самого культу нічого не знайдено, і те, що відомо про бога, походить лише з цих уривків."
  es:
    - "Baal-peor, «el señor de Peor», era el dios adorado en Peor, una altura de Moab sobre las llanuras donde Israel acampó antes de cruzar el Jordán, y el nombre pasó a designar el lugar y lo que allí sucedió. Mientras «reposó Israel en Sittim», el pueblo participó en los sacrificios a los dioses de Moab, «Y allegóse el pueblo á Baal-peor», y siguió una plaga. El episodio se convirtió en sinónimo de apostasía. Moisés lo recuerda a la generación siguiente: «Vuestros ojos vieron lo que hizo Jehová con motivo de Baal-peor»; el salmo recuerda que «Allegáronse asimismo á Baal-peor, y comieron los sacrificios de los muertos»; y Oseas lo contrapone al primer deleite de Dios en Israel: «Ellos entraron á Baal-peor, y se apartaron para vergüenza»."
    - "Como lugar, Baal-peor es lo mismo que Peor, o la ciudad de Bet-peor que hay bajo ella, en las colinas al noroeste de Madaba frente al mar Muerto; qué cumbre era, nadie lo sabe, y las ruinas propuestas, como Khirbet el-Muhatta, descansan solo en la posición. No se ha hallado nada del propio culto, y lo que se sabe del dios procede únicamente de estos pasajes."
  pt:
    - "Baal-Peor, “o senhor de Peor”, era o deus adorado em Peor, uma altura de Moabe acima das planícies onde Israel acampou antes de atravessar o Jordão, e o nome passou a designar o lugar e o que ali aconteceu. Enquanto “Israel permaneceu em Sitim”, o povo tomou parte nos sacrifícios aos deuses de Moabe, e “Israel juntou-se a Baal-Peor”, e seguiu-se uma praga. O episódio tornou-se sinônimo de apostasia. Moisés lembra à geração seguinte: “Os seus olhos viram o que o SENHOR fez por causa de Baal-Peor”; o salmo recorda que “Eles também se juntaram a Baal-Peor, e comeram os sacrifícios oferecidos aos mortos”; e Oseias o contrapõe ao primeiro deleite de Deus em Israel: “eles foram a Baal-Peor, e se consagraram àquela coisa vergonhosa”."
    - "Como lugar, Baal-Peor é o mesmo que Peor, ou a cidade de Bete-Peor abaixo dela, nas colinas a noroeste de Madaba, defronte do mar Morto; qual pico era ninguém sabe, e as ruínas propostas, como Khirbet el-Muhatta, se apoiam só na posição. Nada do culto em si foi achado, e o que se sabe do deus vem apenas dessas passagens."
  de:
    - "Baal-Peor, „der Herr des Peor“, war der Gott, der am Peor verehrt wurde, einer Höhe Moabs über den Ebenen, wo Israel lagerte, ehe es den Jordan überschritt, und der Name wurde zum Namen des Ortes und dessen, was dort geschah. „Und Israel wohnte in Sittim“, und das Volk nahm an den Opfern für die Götter Moabs teil, „und Israel hängte sich an den Baal-Peor“, und eine Plage folgte. Die Episode wurde zum Inbegriff des Abfalls. Mose mahnt die nächste Generation: „Eure Augen haben gesehen, was der HERR getan hat wider den Baal-Peor“; der Psalm erinnert, dass sie sich „an den Baal-Peor hingen und aßen von den Opfern der toten Götzen“; und Hosea stellt es Gottes erster Freude an Israel gegenüber: „hernach gingen sie zu Baal-Peor und gelobten sich dem schändlichen Abgott“."
    - "Als Ort ist Baal-Peor dasselbe wie Peor oder die Stadt Bet-Peor darunter, in den Bergen nordwestlich von Madaba mit Blick auf das Tote Meer; welcher Gipfel es war, weiß niemand, und vorgeschlagene Ruinen wie Chirbet el-Muhatta beruhen allein auf der Lage. Vom Kult selbst wurde nichts gefunden, und was man vom Gott weiß, stammt nur aus diesen Stellen."
  fr:
    - "Baal-Peor, « le seigneur de Peor », était le dieu adoré à Peor, hauteur de Moab dominant les plaines où Israël campa avant de passer le Jourdain, et le nom en vint à désigner le lieu et ce qui s’y passa. Tandis qu’« Israël demeurait à Sittim », le peuple prit part aux sacrifices offerts aux dieux de Moab, « Israël s’attacha à Baal-Peor », et une plaie suivit. L’épisode devint un symbole d’apostasie. Moïse rappelle à la génération suivante : « Vos yeux ont vu ce que l’Éternel a fait à l’occasion de Baal-Peor » ; le psaume rappelle qu’« Ils s’attachèrent à Baal-Peor, et mangèrent des victimes sacrifiées aux morts » ; et Osée l’oppose à la première joie de Dieu en Israël : « ils sont allés vers Baal-Peor, ils se sont consacrés à l’infâme idole »."
    - "Comme lieu, Baal-Peor est le même que Peor, ou que la ville de Beth-Peor au-dessous, dans les collines au nord-ouest de Madaba face à la mer Morte ; quel sommet c’était, nul ne le sait, et des ruines proposées comme Khirbet el-Muhatta ne reposent que sur la position. Rien du culte lui-même n’a été trouvé, et ce que l’on sait du dieu ne vient que de ces passages."
  it:
    - "Baal-Peor, «il signore di Peor», era il dio adorato a Peor, un’altura di Moab sopra le pianure dove Israele era accampato prima di attraversare il Giordano, e il nome giunse a indicare il luogo e ciò che vi accadde. Mentre Israele era «stanziato a Sittim», il popolo prese parte ai sacrifici agli dèi di Moab, «Israele si unì a Baal-Peor», e seguì una piaga. L’episodio divenne sinonimo di apostasia. Mosè ricorda alla generazione successiva: «Gli occhi vostri videro ciò che l’Eterno fece nel caso di Baal-Peor»; il salmo ricorda che «Si congiunsero anche con Baal-Peor e mangiarono dei sacrifizi dei morti»; e Osea lo contrappone alla prima gioia di Dio in Israele: «non appena giunsero a Baal-peor, si appartarono per darsi all’ignominia degl’idoli»."
    - "Come luogo, Baal-Peor è lo stesso di Peor, o della città di Bet-Peor sotto di esso, sulle colline a nord-ovest di Madaba di fronte al Mar Morto; quale vetta fosse nessuno lo sa, e le rovine proposte come Khirbet el-Muhatta poggiano soltanto sulla posizione. Nulla del culto stesso è stato trovato, e ciò che si sa del dio viene soltanto da questi passi."
  pl:
    - "Baal-Peor, „pan Peoru”, był bogiem czczonym w Peor, na wzniesieniu Moabu nad równinami, gdzie Izrael obozował przed przejściem Jordanu, a nazwa zaczęła oznaczać miejsce i to, co się tam wydarzyło. Gdy „mieszkał Izrael w Syttim”, lud brał udział w ofiarach dla bogów Moabu, „przyłączył się Izrael do służby Baal Fegora”, i nastąpiła plaga. Epizod stał się przysłowiem odstępstwa. Mojżesz przypomina następnemu pokoleniu: „Oczy wasze widziały, co uczynił Pan dla Baal fegora”; psalm wspomina, że „sprzęgli się też byli z bałwanem Baalfegorem, a jedli ofiary umarłych”; a Ozeasz przeciwstawia to pierwszej radości Boga z Izraela: „oni poszli za Baal Fegorem, a oddali się tej obrzydliwości”."
    - "Jako miejsce Baal-Peor to to samo co Peor albo miasto Bet-Peor pod nim, we wzgórzach na północny zachód od Madaby, zwróconych ku Morzu Martwemu; który to był szczyt, nie wiadomo, a proponowane ruiny, takie jak Chirbet el-Muhatta, opierają się tylko na położeniu. Nic z samego kultu nie znaleziono, a to, co wiadomo o bogu, pochodzi tylko z tych fragmentów."
  nl:
    - "Baäl-Peor, “de heer van Peor”, was de god die te Peor werd vereerd, een hoogte in Moab boven de vlakten waar Israël kampeerde voordat het de Jordaan overstak, en de naam kwam te staan voor de plaats en voor wat daar gebeurde. Terwijl Israël “verbleef te Sittim”, namen de mensen deel aan de offers aan de goden van Moab; “Als nu Israel zich koppelde aan Baal-Peor, ontstak de toorn des HEEREN tegen Israel”, en er volgde een plaag. De episode werd een spreekwoord voor afval. Mozes herinnert de volgende generatie: “Uw ogen hebben gezien, wat God om Baal-Peor gedaan heeft”; de psalm gedenkt: “Ook hebben zij zich gekoppeld aan Baal-Peor, en zij hebben de offeranden der doden gegeten”; en Hosea stelt het tegenover Gods eerste vreugde in Israël: “zij gingen in tot Baal-Peor, en zonderden zich af tot die schaamte”."
    - "Als plaats is Baäl-Peor dezelfde als Peor, of de stad Beth-Peor eronder, in de heuvels ten noordwesten van Madaba met uitzicht op de Dode Zee; welke top het was, weet niemand, en voorgestelde ruïnes als Khirbet el-Muhatta berusten alleen op ligging. Van de cultus zelf is niets gevonden, en wat van de god bekend is, komt alleen uit deze passages."
  cs:
    - "Báal-peór, „pán Peóru“, byl bůh uctívaný na Peóru, výšině Moábu nad pláněmi, kde Izrael tábořil před přechodem Jordánu, a jméno začalo označovat místo i to, co se tam stalo. Když „pobyl Izrael v Setim“, lid se zúčastnil obětí bohům Moábu, „I připojil se lid Izraelský k modle Belfegor“, a následoval mor. Událost se stala příslovím odpadlictví. Mojžíš připomíná další generaci: „Oči vaše viděly, co učinil Hospodin pro Belfegor“; žalm vzpomíná, že „Spřáhli se také byli s modlou Belfegor, a jedli oběti mrch“; a Ozeáš to staví proti Božímu prvnímu zalíbení v Izraeli: „oni odešli za Belfegor, a oddali se té ohavnosti“."
    - "Jako místo je Báal-peór totéž co Peór, nebo město Bét-peór pod ním, v pahorcích severozápadně od Madaby obrácených k Mrtvému moři; která výšina to byla, nikdo neví, a navržené zříceniny jako Chirbet el-Muhatta se opírají jen o polohu. Z kultu samotného se nenašlo nic a co se o bohu ví, pochází jen z těchto míst."
  sv:
    - "Baal-Peor, ”Peors herre”, var guden som dyrkades vid Peor, en höjd i Moab ovanför slätterna där Israel lägrade sig innan de gick över Jordan, och namnet kom att stå för platsen och för vad som hände där. Medan Israel ”uppehöll sig i Sittim”, deltog folket i offren till Moabs gudar, och ”Israel slöt sig till Baal-Peor”, och en pest följde. Episoden blev ett ordspråk för avfall. Mose påminner nästa generation: ”I haven med egna ögon sett vad HERREN har gjort i fråga om Baal-Peor”; psalmen minns att ”De slöto sig till Baal-Peor och åto det som var offrat åt döda”; och Hosea ställer det mot Guds första glädje i Israel: ”när de kommo till Baal-Peor, invigde de sig åt skändlighetsguden”."
    - "Som plats är Baal-Peor detsamma som Peor, eller staden Bet-Peor nedanför den, i bergen nordväst om Madaba mot Döda havet; vilken topp det var vet ingen, och föreslagna ruiner såsom Khirbet el-Muhatta vilar enbart på läget. Ingenting av själva kulten har hittats, och vad som är känt om guden kommer bara från dessa ställen."
  nb:
    - "Baal-Peor, «Peors herre», var guden som ble dyrket ved Peor, en høyde i Moab over slettene der Israel leiret før krysningen av Jordan, og navnet kom til å stå for stedet og for det som skjedde der. Mens Israel «opholdt sig i Sittim», tok folket del i offermåltidene for Moabs guder, «og Israel holdt sig til Ba'al-Peor», og en pest fulgte. Episoden ble et ordspråk om frafall. Moses minner det neste slektsleddet: «I har med egne øine sett hvad Herren gjorde da det hendte det med Ba'al Peor»; salmen minnes at de «bandt sig til Ba'al-Peor og åt av offere til døde»; og Hosea setter det opp mot Guds første glede i Israel: «da de kom til Ba'al-Peor, vidde de sig til avgudsdyrkelsen og blev vederstyggelige»."
    - "Som sted er Baal-Peor det samme som Peor, eller byen Bet-Peor under den, i åsene nordvest for Madaba mot Dødehavet; hvilken topp det var, vet ingen, og foreslåtte ruiner som Khirbet el-Muhatta hviler på beliggenhet alene. Ingenting av selve kulten er funnet, og det som er kjent om guden, kommer bare fra disse tekstene."
  tl:
    - "Ang Baal-peor, “panginoon ng Peor”, ay diyos na sinamba sa Peor, isang kataasan ng Moab sa itaas ng mga kapatagang pinagkampuhan ng Israel bago tumawid sa Jordan, at ang pangalan ay naging sagisag ng lugar at ng nangyari roon. Habang ang Israel ay “tumahan sa Sittim”, nakibahagi ang bayan sa mga hain sa mga diyos ng Moab, “At ang Israel ay nakilakip sa diosdiosang Baal-peor”, at sumunod ang salot. Naging kasabihan ang pangyayari para sa pagtalikod. Ipinaalala ni Moises sa susunod na salinlahi: “Nakita ng inyong mga mata ang ginawa ng Panginoon tungkol kay Baal-peor”; naaalala ng salmo na “Sila'y nangakilakip naman sa diosdiosang Baal-peor, at nagsikain ng mga hain sa mga patay”; at inihahambing ni Oseas ito sa unang kagalakan ng Diyos sa Israel: “nguni't sila'y nagsiparoon kay Baalpeor, at nangagsitalaga sa mahalay na bagay”."
    - "Bilang lugar, ang Baal-peor ay ang Peor, o ang bayan ng Beth-peor sa ibaba nito, sa mga burol sa hilagang-kanluran ng Madaba na nakaharap sa Dagat na Patay; walang nakaaalam kung aling tuktok ito, at ang mga iminungkahing guho gaya ng Khirbet el-Muhatta ay nakasalig lamang sa posisyon. Walang natagpuan sa mismong kulto, at ang nalalaman tungkol sa diyos ay mula lamang sa mga talatang ito."
  da:
    - "Ba'al-Peor, »Peors herre«, var guden, der blev dyrket ved Peor, en højde i Moab over de sletter, hvor Israel lå i lejr før overgangen over Jordan, og navnet kom til at stå for stedet og for det, der skete dér. Mens Israel »boede i Sittim«, deltog folket i ofrene til Moabs guder, »og Israel lod sig koble til Baal-Peor«, og en plage fulgte. Episoden blev et mundheld for frafald. Moses minder den næste generation: »Eders Øjne have set, hvad Herren har gjort for Baal-Peors Skyld«; salmen husker, at »de bandt sig til Baal-Peor og aade af Ofrene til de døde Afguder«; og Hoseas stiller det over for Guds første glæde ved Israel: »de gik ind til Baal-Peor og viede sig til Skændsel«."
    - "Som sted er Ba'al-Peor det samme som Peor, eller byen Bet-Peor nedenfor, i bjergene nordvest for Madaba med udsigt over Det Døde Hav; hvilken top det var, ved ingen, og foreslåede ruiner som Khirbet el-Muhatta hviler alene på beliggenhed. Intet af selve kulten er fundet, og hvad man ved om guden, stammer kun fra disse steder."
  sr:
    - "Велфегор, „господар Фегора“, био је бог којем су се клањали на Фегору, висини Моава изнад равница где је Израиљ логоровао пре преласка Јордана, а име је почело да стоји за место и за оно што се ту збило. У време када „живљаше Израиљ у Ситиму“, народ је учествовао у жртвама богова Моава, „И Израиљ приону уз Велфегора“, и уследила је куга. Догађај је постао синоним за отпад. Мојсије подсећа наредни нараштај: „Очи су ваше виделе шта учини Господ с Велфегора“; псалам се сећа: „И присташе за Велфегором, и једоше принесено на жртву мртвима“; а Осија га супротставља Божјој првој радости над Израиљем: „они отидоше к Велфегору, и одвојише се за срамотом“."
    - "Као место Велфегор је исто што и Фегор, или град Вет-Фегор испод њега, у брдима северозападно од Мадабе према Мртвом мору; који је био врх, нико не зна, а предложене рушевине као Хирбет ел-Мухата почивају само на положају. Од самог култа ништа није нађено, а што се о богу зна, потиче само из ових одломака."
  hu:
    - "Baál-Peór, „Peór ura”, az az isten volt, akit Peórnál imádtak, Moáb egyik magaslatán, azon síkságok fölött, ahol Izráel táborozott a Jordánon való átkelés előtt, és a név a helyet és az ott történteket is jelölte. Amíg Izráel „Sittimben lakozik vala”, a nép részt vett Moáb isteneinek áldozatain, „és odaszegődék Izráel Bál-Peórhoz”, és csapás következett. Az eset a hitehagyás szinonimája lett. Mózes emlékezteti a következő nemzedéket: „Szemeitekkel láttátok, a mit cselekedett az Úr Baal-Peór miatt”; a zsoltár felidézi, hogy hozzácsapódtak Baál-Peórhoz, és a holtak áldozataiból ettek; Hóseás pedig szembeállítja Isten Izráel feletti első örömével: „bementek Baál-Peorhoz és a gyalázatosnak adták magokat”."
    - "Helyként Baál-Peór azonos Peórral, vagy az alatta lévő Bét-Peór várossal, a Mádabától északnyugatra fekvő dombokon, a Holt-tengerre nézve; hogy melyik csúcs volt, senki sem tudja, a javasolt romok, mint a Khirbet el-Muhatta, kizárólag a fekvésre épülnek. Magából a kultuszból semmi sem került elő, és az istenről csak ezekből a szakaszokból tudunk."
  fi:
    - "Baal-Peor, ”Peorin herra”, oli jumala, jota palvottiin Peorilla, Moabin kukkulalla tasankojen yläpuolella, joilla Israel leiriytyi ennen Jordanin ylitystä, ja nimi tuli tarkoittamaan paikkaa ja sitä, mitä siellä tapahtui. Kun Israel ”asettui Sittimiin”, kansa osallistui Moabin jumalien uhreihin, ja Israel ”antautui palvelemaan Baal-Peoria”, ja rutto seurasi. Jakso tuli luopumuksen sananparreksi. Mooses muistuttaa seuraavaa sukupolvea: ”Te olette omin silmin nähneet, mitä Herra teki Baal-Peorin asiassa”; psalmi muistaa, että he ”antautuivat palvelemaan Baal-Peoria ja söivät kuolleitten jumalien uhreja”; ja Hoosea asettaa sen Jumalan ensimmäisen ilon Israelista vastakohdaksi: ”He tulivat Baal-Peoriin, vihkiytyivät häpeäjumalalle”."
    - "Paikkana Baal-Peor on sama kuin Peor tai sen alapuolinen Bet-Peorin kaupunki Kuolleelle merelle päin Madabasta luoteeseen olevilla kukkuloilla; mikä huippu se oli, ei kukaan tiedä, ja ehdotetut rauniot kuten Khirbet el-Muhatta perustuvat vain sijaintiin. Itse kultista ei ole löydetty mitään, ja kaikki jumalasta tiedetty tulee vain näistä kohdista."
  vi:
    - "Ba-anh-Phê-ô, “chúa của Phê-ô”, là thần được thờ tại Phê-ô, một đỉnh cao của Mô-áp phía trên các đồng bằng nơi Y-sơ-ra-ên đóng trại trước khi qua sông Giô-đanh, và tên ấy trở thành chỉ nơi chốn và điều đã xảy ra ở đó. Khi Y-sơ-ra-ên “ở tại Si-tim”, dân tham dự các lễ cúng các thần của Mô-áp, “Y-sơ-ra-ên cũng thờ thần Ba-anh-Phê-ô”, và một tai vạ theo sau. Biến cố ấy trở thành điển hình của sự bội đạo. Môi-se nhắc thế hệ kế tiếp: “mắt các ngươi đã thấy điều Đức Giê-hô-va đã làm” nhân dịp của Ba-anh-Phê-ô; thi thiên nhớ lại rằng họ “cúng thờ Ba-anh-Phê-ô, ăn của lễ cúng kẻ chết”; và Ô-sê đặt nó đối lại niềm vui đầu tiên của Đức Chúa Trời nơi Y-sơ-ra-ên: “chúng nó đã vào nơi Ba-anh-Phê-ô; dâng mình cho vật xấu hổ”."
    - "Là một địa điểm, Ba-anh-Phê-ô cũng là Phê-ô, hay thành Bết-Phê-o bên dưới, trong vùng đồi tây bắc Madaba nhìn ra Biển Chết; đó là đỉnh nào thì không ai biết, và các tàn tích được đề xuất như Khirbet el-Muhatta chỉ dựa vào vị trí. Chưa tìm thấy gì của chính sự thờ phượng, và những gì biết về vị thần chỉ đến từ các đoạn này."
  ro:
    - "Baal-Peor, „domnul Peorului”, era zeul adorat la Peor, o înălțime a Moabului deasupra câmpiilor unde tăbărase Israel înainte de a trece Iordanul, iar numele a ajuns să stea pentru locul acela și pentru ce s-a petrecut acolo. Pe când „a poposit Israil în Satin”, poporul a luat parte la jertfele aduse zeilor Moabului, iar „s’a închinat Israil lui Veelfegor”, și a urmat o ciumă. Episodul a devenit simbol al apostaziei. Moise le amintește generației următoare: „Ochii voștri au văzut toate câte au făcut Domnul Dumnezeul nostru lui Veelfegor”; psalmul amintește că s-au alipit și ei de Baal-Peor și au mâncat jertfele celor morți; iar Osea îl pune în contrast cu prima plăcere a lui Dumnezeu în Israel: au mers la Baal-Peor și s-au dedicat acelei rușini."
    - "Ca loc, Baal-Peor este același cu Peor, sau cu cetatea Bet-Peor de sub el, în dealurile de la nord-vest de Madaba, cu fața spre Marea Moartă; care a fost vârful nu se știe, iar ruinele propuse, ca Khirbet el-Muhatta, se sprijină doar pe poziție. Nimic din cultul însuși nu a fost găsit, iar ce se știe despre zeu vine numai din aceste pasaje."
  bg:
    - "Ваал-Фегор, „господарят на Фегор“, бил богът, на когото се кланяли във Фегор, възвишение на Моав над равнините, където Израил се разположил преди да премине Йордан, а името започнало да означава мястото и онова, което се случило там. Докато „остана Израил в Ситтим“, народът взел участие в жертвите на моавските богове, „И прилепи се Израил при Ваалфегора“, и последвала чума. Епизодът станал символ на отстъпничеството. Мойсей напомня на следващото поколение: „Очите ви видяха що направи Господ заради Ваалфегора“; псалмът си спомня, че „И прилепиха се при Ваалфегоря, И ядоха жъртви принесени на мъртвите“; а Осия го противопоставя на първата радост на Бога в Израил: „те отидоха към Ваалфегора, И предадоха себе си на срама“."
    - "Като място Ваал-Фегор е същото като Фегор или като града Бет-Фегор под него, в хълмовете северозападно от Мадаба с изглед към Мъртво море; кой връх е бил, никой не знае, а предложените развалини като Хирбет ел-Мухатта се опират само на положението. Нищо от самия култ не е намерено и каквото се знае за бога, идва само от тези пасажи."
