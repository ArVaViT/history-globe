# Overview article (ADR 0007). Mainstream facts only; Baal-peor is first the god of Peor and only by extension a place; the site is that of Peor, itself not surely located.
id: baal-peor
place: a3d6e81
title:
  en: "Baal-peor"
  ru: "Ваал-Фегор"
  uk: "Ваал-Пеор"
  es: "Baal-peor"
  pt: "Baal-Peor"
  de: "Baal-Peor"
  fr: "Baal-Peor"
  it: "Baal-Peor"
  pl: "Baal-Peor"
  nl: "Baäl-Peor"
  cs: "Báal-peór"
body:
  en:
    - "Baal-peor, “the lord of Peor”, was the god worshipped at Peor, a height of Moab above the plains where Israel camped before crossing the Jordan, and the name came to stand for the place and for what happened there. While Israel “abode in Shittim”, the people took part in the sacrifices of Moab and Midian, “and Israel joined himself unto Baal-peor”, and a plague followed. The episode became a byword for apostasy. Moses reminds the next generation: “Your eyes have seen what the LORD did because of Baal-peor”; the psalm recalls that they “joined themselves also unto Baal-peor, and ate the sacrifices of the dead”; and Hosea sets it against God's first delight in Israel: “they went to Baal-peor, and separated themselves unto that shame”."
    - "As a place, Baal-peor is the same as Peor, or the town of Beth-peor below it, in the hills north-west of Madaba facing the Dead Sea; which peak it was no one knows, and proposed ruins such as Khirbet el-Muhatta rest on position alone. Nothing of the cult itself has been found, and what is known of the god comes only from these passages."
  ru:
    - "Ваал-Фегор, «господин Фегора», — бог, которому поклонялись на Фегоре, высоте Моава над равнинами, где Израиль стоял станом перед переходом Иордана; имя стало означать и само место, и то, что там произошло. Когда «жил Израиль в Ситтиме», народ участвовал в жертвах Моава и Мадиама, и «прилепился Израиль к Ваал-Фегору», а за этим последовало поражение. Этот случай стал нарицательным для отступничества. Моисей напоминает следующему поколению: «Глаза ваши видели все, что сделал Господь Бог наш с Ваал-Фегором»; псалом вспоминает: «Они прилепились к Ваалфегору и ели жертвы бездушным»; а Осия противопоставляет его первой радости Бога об Израиле: «они пошли к Ваал-Фегору и предались постыдному»."
    - "Как место Ваал-Фегор — то же, что Фегор или городок Беф-Фегор под ним, в холмах к северо-западу от Мадабы, обращённых к Мёртвому морю; какая это вершина, никто не знает, и предлагаемые развалины, например Хирбет-эль-Мухатта, держатся лишь на положении. Ничего от самого культа не найдено, и всё, что известно об этом боге, известно только из этих мест Писания."
  uk:
    - "Ваал-Пеор, «володар Пеору», був богом, якого шанували в Пеорі, на висоті Моаба над рівнинами, де Ізраїль стояв табором перед переходом Йордану, і ім'я стало означати місце й те, що там сталося. Коли «жив Ізраїль у Ситтимі», народ узяв участь у жертвах Моава та Мадіама, «прихиливсь Ізраїль до Бааль-Пеора», і настала пошесть. Цей епізод став символом відступництва. Мойсей нагадує наступному поколінню: «Очі ваші бачили, що вдїяв Господь з Бааль Пеором»; псалом згадує, що вони: «Пристали вони до Баал-Пегора, й їли жертви мертвих ідолів»; а Осія протиставляє це першій Божій радості в Ізраїлі: «вони обернулись до Вааль-Пеора й віддали себе гидотї»."
    - "Як місце, Ваал-Пеор — те саме, що й Пеор, або містечко Бет-Пеор під ним, у пагорбах на північний захід від Мадаби, звернених до Мертвого моря; яка це була вершина, ніхто не знає, а запропоновані руїни, як-от Хірбет-ель-Мухатта, спираються лише на розташування. Від самого культу нічого не знайдено, і те, що відомо про бога, походить лише з цих уривків."
  es:
    - "Baal-peor, «el señor de Peor», era el dios adorado en Peor, una altura de Moab sobre las llanuras donde Israel acampó antes de cruzar el Jordán, y el nombre pasó a designar el lugar y lo que allí sucedió. Mientras «reposó Israel en Sittim», el pueblo participó en los sacrificios de Moab y Madián, «Y allegóse el pueblo á Baal-peor», y siguió una plaga. El episodio se convirtió en sinónimo de apostasía. Moisés lo recuerda a la generación siguiente: «Vuestros ojos vieron lo que hizo Jehová con motivo de Baal-peor»; el salmo recuerda que «Allegáronse asimismo á Baal-peor, y comieron los sacrificios de los muertos»; y Oseas lo contrapone al primer deleite de Dios en Israel: «Ellos entraron á Baal-peor, y se apartaron para vergüenza»."
    - "Como lugar, Baal-peor es lo mismo que Peor, o la ciudad de Bet-peor que hay bajo ella, en las colinas al noroeste de Madaba frente al mar Muerto; qué cumbre era, nadie lo sabe, y las ruinas propuestas, como Khirbet el-Muhatta, descansan solo en la posición. No se ha hallado nada del propio culto, y lo que se sabe del dios procede únicamente de estos pasajes."
  pt:
    - "Baal-Peor, “o senhor de Peor”, era o deus adorado em Peor, uma altura de Moabe acima das planícies onde Israel acampou antes de atravessar o Jordão, e o nome passou a designar o lugar e o que ali aconteceu. Enquanto “Israel permaneceu em Sitim”, o povo tomou parte nos sacrifícios de Moabe e de Midiã, e “Israel juntou-se a Baal-Peor”, e seguiu-se uma praga. O episódio tornou-se sinônimo de apostasia. Moisés lembra à geração seguinte: “Os seus olhos viram o que o SENHOR fez por causa de Baal-Peor”; o salmo recorda que “Eles também se juntaram a Baal-Peor, e comeram os sacrifícios oferecidos aos mortos”; e Oseias o contrapõe ao primeiro deleite de Deus em Israel: “eles foram a Baal-Peor, e se consagraram àquela coisa vergonhosa”."
    - "Como lugar, Baal-Peor é o mesmo que Peor, ou a cidade de Bete-Peor abaixo dela, nas colinas a noroeste de Madaba, defronte do mar Morto; qual pico era ninguém sabe, e as ruínas propostas, como Khirbet el-Muhatta, se apoiam só na posição. Nada do culto em si foi achado, e o que se sabe do deus vem apenas dessas passagens."
  de:
    - "Baal-Peor, „der Herr des Peor“, war der Gott, der am Peor verehrt wurde, einer Höhe Moabs über den Ebenen, wo Israel lagerte, ehe es den Jordan überschritt, und der Name wurde zum Namen des Ortes und dessen, was dort geschah. „Und Israel wohnte in Sittim“, und das Volk nahm an den Opfern Moabs und Midians teil, „und Israel hängte sich an den Baal-Peor“, und eine Plage folgte. Die Episode wurde zum Inbegriff des Abfalls. Mose mahnt die nächste Generation: „Eure Augen haben gesehen, was der HERR getan hat wider den Baal-Peor“; der Psalm erinnert, dass sie sich „an den Baal-Peor hingen und aßen von den Opfern der toten Götzen“; und Hosea stellt es Gottes erster Freude an Israel gegenüber: „hernach gingen sie zu Baal-Peor und gelobten sich dem schändlichen Abgott“."
    - "Als Ort ist Baal-Peor dasselbe wie Peor oder die Stadt Bet-Peor darunter, in den Bergen nordwestlich von Madaba mit Blick auf das Tote Meer; welcher Gipfel es war, weiß niemand, und vorgeschlagene Ruinen wie Chirbet el-Muhatta beruhen allein auf der Lage. Vom Kult selbst wurde nichts gefunden, und was man vom Gott weiß, stammt nur aus diesen Stellen."
  fr:
    - "Baal-Peor, « le seigneur de Peor », était le dieu adoré à Peor, hauteur de Moab dominant les plaines où Israël campa avant de passer le Jourdain, et le nom en vint à désigner le lieu et ce qui s’y passa. Tandis qu’« Israël demeurait à Sittim », le peuple prit part aux sacrifices de Moab et de Madian, « Israël s’attacha à Baal-Peor », et une plaie suivit. L’épisode devint un symbole d’apostasie. Moïse rappelle à la génération suivante : « Vos yeux ont vu ce que l’Éternel a fait à l’occasion de Baal-Peor » ; le psaume rappelle qu’« Ils s’attachèrent à Baal-Peor, et mangèrent des victimes sacrifiées aux morts » ; et Osée l’oppose à la première joie de Dieu en Israël : « ils sont allés vers Baal-Peor, ils se sont consacrés à l’infâme idole »."
    - "Comme lieu, Baal-Peor est le même que Peor, ou que la ville de Beth-Peor au-dessous, dans les collines au nord-ouest de Madaba face à la mer Morte ; quel sommet c’était, nul ne le sait, et des ruines proposées comme Khirbet el-Muhatta ne reposent que sur la position. Rien du culte lui-même n’a été trouvé, et ce que l’on sait du dieu ne vient que de ces passages."
  it:
    - "Baal-Peor, «il signore di Peor», era il dio adorato a Peor, un’altura di Moab sopra le pianure dove Israele era accampato prima di attraversare il Giordano, e il nome giunse a indicare il luogo e ciò che vi accadde. Mentre Israele era «stanziato a Sittim», il popolo prese parte ai sacrifici di Moab e di Madian, «Israele si unì a Baal-Peor», e seguì una piaga. L’episodio divenne sinonimo di apostasia. Mosè ricorda alla generazione successiva: «Gli occhi vostri videro ciò che l’Eterno fece nel caso di Baal-Peor»; il salmo ricorda che «Si congiunsero anche con Baal-Peor e mangiarono dei sacrifizi dei morti»; e Osea lo contrappone alla prima gioia di Dio in Israele: «non appena giunsero a Baal-peor, si appartarono per darsi all’ignominia degl’idoli»."
    - "Come luogo, Baal-Peor è lo stesso di Peor, o della città di Bet-Peor sotto di esso, sulle colline a nord-ovest di Madaba di fronte al Mar Morto; quale vetta fosse nessuno lo sa, e le rovine proposte come Khirbet el-Muhatta poggiano soltanto sulla posizione. Nulla del culto stesso è stato trovato, e ciò che si sa del dio viene soltanto da questi passi."
  pl:
    - "Baal-Peor, „pan Peoru”, był bogiem czczonym w Peor, na wzniesieniu Moabu nad równinami, gdzie Izrael obozował przed przejściem Jordanu, a nazwa zaczęła oznaczać miejsce i to, co się tam wydarzyło. Gdy „mieszkał Izrael w Syttim”, lud brał udział w ofiarach Moabu i Madianu, „przyłączył się Izrael do służby Baal Fegora”, i nastąpiła plaga. Epizod stał się przysłowiem odstępstwa. Mojżesz przypomina następnemu pokoleniu: „Oczy wasze widziały, co uczynił Pan dla Baal fegora”; psalm wspomina, że „sprzęgli się też byli z bałwanem Baalfegorem, a jedli ofiary umarłych”; a Ozeasz przeciwstawia to pierwszej radości Boga z Izraela: „oni poszli za Baal Fegorem, a oddali się tej obrzydliwości”."
    - "Jako miejsce Baal-Peor to to samo co Peor albo miasto Bet-Peor pod nim, we wzgórzach na północny zachód od Madaby, zwróconych ku Morzu Martwemu; który to był szczyt, nie wiadomo, a proponowane ruiny, takie jak Chirbet el-Muhatta, opierają się tylko na położeniu. Nic z samego kultu nie znaleziono, a to, co wiadomo o bogu, pochodzi tylko z tych fragmentów."
  nl:
    - "Baäl-Peor, “de heer van Peor”, was de god die te Peor werd vereerd, een hoogte in Moab boven de vlakten waar Israël kampeerde voordat het de Jordaan overstak, en de naam kwam te staan voor de plaats en voor wat daar gebeurde. Terwijl Israël “verbleef te Sittim”, namen de mensen deel aan de offers van Moab en Midian; “Als nu Israel zich koppelde aan Baal-Peor, ontstak de toorn des HEEREN tegen Israel”, en er volgde een plaag. De episode werd een spreekwoord voor afval. Mozes herinnert de volgende generatie: “Uw ogen hebben gezien, wat God om Baal-Peor gedaan heeft”; de psalm gedenkt: “Ook hebben zij zich gekoppeld aan Baal-Peor, en zij hebben de offeranden der doden gegeten”; en Hosea stelt het tegenover Gods eerste vreugde in Israël: “zij gingen in tot Baal-Peor, en zonderden zich af tot die schaamte”."
    - "Als plaats is Baäl-Peor dezelfde als Peor, of de stad Beth-Peor eronder, in de heuvels ten noordwesten van Madaba met uitzicht op de Dode Zee; welke top het was, weet niemand, en voorgestelde ruïnes als Khirbet el-Muhatta berusten alleen op ligging. Van de cultus zelf is niets gevonden, en wat van de god bekend is, komt alleen uit deze passages."
  cs:
    - "Báal-peór, „pán Peóru“, byl bůh uctívaný na Peóru, výšině Moábu nad pláněmi, kde Izrael tábořil před přechodem Jordánu, a jméno začalo označovat místo i to, co se tam stalo. Když „pobyl Izrael v Setim“, lid se zúčastnil obětí Moábu a Midjánu, „I připojil se lid Izraelský k modle Belfegor“, a následoval mor. Událost se stala příslovím odpadlictví. Mojžíš připomíná další generaci: „Oči vaše viděly, co učinil Hospodin pro Belfegor“; žalm vzpomíná, že „Spřáhli se také byli s modlou Belfegor, a jedli oběti mrch“; a Ozeáš to staví proti Božímu prvnímu zalíbení v Izraeli: „oni odešli za Belfegor, a oddali se té ohavnosti“."
    - "Jako místo je Báal-peór totéž co Peór, nebo město Bét-peór pod ním, v pahorcích severozápadně od Madaby obrácených k Mrtvému moři; která výšina to byla, nikdo neví, a navržené zříceniny jako Chirbet el-Muhatta se opírají jen o polohu. Z kultu samotného se nenašlo nic a co se o bohu ví, pochází jen z těchto míst."
