# Overview article (ADR 0007). Mainstream facts only; the name survives at Ain Hajla and Deir Hajla, which the map shows as its two candidates.
id: beth-hoglah
place: aabd0ba
title:
  en: "Beth-hoglah"
  ru: "Беф-Хогла"
body:
  en:
    - "Beth-hoglah, “house of the partridge”, was a town of Benjamin in the Jordan valley south-east of Jericho, close to the river and the northern shore of the Dead Sea. Joshua uses it twice as a border mark. Judah's northern line begins “from the bay of the sea at the uttermost part of Jordan: And the border went up to Beth-hogla, and passed along by the north of Beth-arabah”, and Benjamin's southern line “passed along to the side of Beth-hoglah northward” to end “at the north bay of the salt sea at the south end of Jordan”. The towns of Benjamin are then listed, “Jericho, and Beth-hoglah, and the valley of Keziz”."
    - "The name survives at Ain Hajla, a spring among palms about 8 km south-east of Jericho, and at Deir Hajla, the monastery beside it; the map shows both, little more than a kilometre apart. Jerome knew the place: explaining the threshing floor of Atad where Joseph mourned Jacob, he says that in his day it was called Bethagla, three miles from Jericho and two from the Jordan, and derived the name from the mourners who went round in a circle. Deir Hajla is the monastery of St Gerasimus, who founded his community in the Jordan plain in the fifth century and is remembered for the lion that served him; the present buildings were raised by Greek monks in the 1880s on older foundations. The Iron Age town has not been excavated and may lie under or near them."
    - "Today Deir Hajla stands among date groves between Jericho and the baptism site of Qasr al-Yahud, a working Greek Orthodox monastery open to visitors."
  ru:
    - "Беф-Хогла, «дом куропатки», — город Вениамина в долине Иордана к юго-востоку от Иерихона, близ реки и северного берега Мёртвого моря. Книга Иисуса Навина дважды берёт его пограничной вехой. Северный предел Иуды начинается «от залива моря, от устья Иордана; отсюда предел восходит к Беф-Хогле и проходит с северной стороны к Беф-Араве», а южный предел Вениамина: «отсюда проходит предел подле Беф-Хоглы к северу, и оканчивается предел у северного залива моря Соленого, у южного конца Иордана». Затем перечислены города Вениамина: «Иерихон, Беф-Хогла и Емек-Кециц»."
    - "Имя сохранилось в Айн-Хаджле, источнике среди пальм примерно в 8 км к юго-востоку от Иерихона, и в Дейр-Хаджле, монастыре рядом с ним; на карте показаны оба места, чуть больше чем в километре друг от друга. Иероним знал это место: объясняя гумно Атада, где Иосиф оплакивал Иакова, он говорит, что в его дни оно называлось Бетагла, в трёх милях от Иерихона и в двух от Иордана, и выводил имя из плакальщиков, ходивших по кругу. Дейр-Хаджла — монастырь святого Герасима, который основал свою общину на Иорданской равнине в V веке и памятен львом, служившим ему; нынешние здания возведены греческими монахами в 1880-х годах на старых основаниях. Город железного века не раскапывали; он может лежать под ними или рядом."
    - "Сегодня Дейр-Хаджла стоит среди финиковых рощ между Иерихоном и местом крещения Каср-эль-Яхуд — действующий греческий православный монастырь, открытый для посетителей."
