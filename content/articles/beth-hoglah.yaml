# Overview article (ADR 0007). Mainstream facts only; the name survives at Ain Hajla and Deir Hajla, which the map shows as its two candidates.
id: beth-hoglah
place: aabd0ba
title:
  en: "Beth-hoglah"
  ru: "Беф-Хогла"
  uk: "Бет-Хогла"
  es: "Bet-hogla"
  pt: "Bete-Hogla"
  de: "Bet-Hogla"
  fr: "Beth-Hogla"
