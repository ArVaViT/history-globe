body:
  en:
    - "Beth-hoglah, “house of the partridge”, was a town of Benjamin in the Jordan valley south-east of Jericho, close to the river and the northern shore of the Dead Sea. Joshua uses it twice as a border mark. Judah's northern line begins “from the bay of the sea at the uttermost part of Jordan: And the border went up to Beth-hogla, and passed along by the north of Beth-arabah”, and Benjamin's southern line “passed along to the side of Beth-hoglah northward” to end “at the north bay of the salt sea at the south end of Jordan”. The towns of Benjamin are then listed, “Jericho, and Beth-hoglah, and the valley of Keziz”."
    - "The name survives at Ain Hajla, a spring among palms about 8 km south-east of Jericho, and at Deir Hajla, the monastery beside it; the map shows both, little more than a kilometre apart. Jerome knew the place: explaining the threshing floor of Atad where Joseph mourned Jacob, he says that in his day it was called Bethagla, three miles from Jericho and two from the Jordan, and derived the name from the mourners who went round in a circle. Deir Hajla is the monastery of St Gerasimus, who founded his community in the Jordan plain in the fifth century and is remembered for the lion that served him; the present buildings were raised by Greek monks in the 1880s on older foundations. The Iron Age town has not been excavated and may lie under or near them."
    - "Today Deir Hajla stands among date groves between Jericho and the baptism site of Qasr al-Yahud, a working Greek Orthodox monastery open to visitors."
  ru:
    - "Беф-Хогла, «дом куропатки», — город Вениамина в долине Иордана к юго-востоку от Иерихона, близ реки и северного берега Мёртвого моря. Книга Иисуса Навина дважды берёт его пограничной вехой. Северный предел Иуды начинается «от залива моря, от устья Иордана; отсюда предел восходит к Беф-Хогле и проходит с северной стороны к Беф-Араве», а южный предел Вениамина: «отсюда проходит предел подле Беф-Хоглы к северу, и оканчивается предел у северного залива моря Соленого, у южного конца Иордана». Затем перечислены города Вениамина: «Иерихон, Беф-Хогла и Емек-Кециц»."
    - "Имя сохранилось в Айн-Хаджле, источнике среди пальм примерно в 8 км к юго-востоку от Иерихона, и в Дейр-Хаджле, монастыре рядом с ним; на карте показаны оба места, чуть больше чем в километре друг от друга. Иероним знал это место: объясняя гумно Атада, где Иосиф оплакивал Иакова, он говорит, что в его дни оно называлось Бетагла, в трёх милях от Иерихона и в двух от Иордана, и выводил имя из плакальщиков, ходивших по кругу. Дейр-Хаджла — монастырь святого Герасима, который основал свою общину на Иорданской равнине в V веке и памятен львом, служившим ему; нынешние здания возведены греческими монахами в 1880-х годах на старых основаниях. Город железного века не раскапывали; он может лежать под ними или рядом."
    - "Сегодня Дейр-Хаджла стоит среди финиковых рощ между Иерихоном и местом крещения Каср-эль-Яхуд — действующий греческий православный монастырь, открытый для посетителей."
  uk:
    - "Бет-Хогла, «дім куріпки», було містом Веніяміна в Йорданській долині на південний схід від Єрихону, поблизу річки та північного берега Мертвого моря. Ісус Навин двічі використовує його як прикордонну позначку. Північна лінія Юди починається «від затоку морського від устя Йорданського. Тодї підіймається гряниця вгору на Бет-Гоглу і йде на північ від Бет-Араби», а південна лінія Веніяміна «тягнеться гряниця на нагірню стїну Бет-Хоглїйську на північ» і кінчається «над північнїм затоном Солоного моря на полуденньому концї Йордань-ріки». Потім перелічено міста Веніяміна: «Ерихон та Бет-Гогла, Емек-Казиз»."
    - "Назва зберігається в Айн-Хаджлі, джерелі серед пальм приблизно за 8 км на південний схід від Єрихону, і в Дейр-Хаджлі, монастирі поряд; мапа показує обидва, на відстані трохи більше кілометра. Єронім знав це місце: пояснюючи тік Атада, де Йосип оплакував Якова, він каже, що за його часів його звали Бетагла, за три милі від Єрихону й дві від Йордану, і виводив назву від плакальників, що ходили колом. Дейр-Хаджла — монастир св. Герасима, який заснував свою громаду в Йорданській рівнині в V столітті і якого пам'ятають за лева, що йому служив; нинішні будівлі звели грецькі ченці в 1880-х роках на давніших фундаментах. Місто залізної доби не розкопували, і воно може лежати під ними або поряд."
    - "Нині Дейр-Хаджла стоїть серед фінікових гаїв між Єрихоном і місцем хрещення Каср-аль-Яхуд — діючий грецький православний монастир, відкритий для відвідувачів."
  es:
    - "Bet-hogla, «casa de la perdiz», era una ciudad de Benjamín en el valle del Jordán al sudeste de Jericó, cerca del río y de la orilla norte del mar Muerto. Josué la usa dos veces como mojón fronterizo. La línea septentrional de Judá comienza «desde la lengua del mar, desde el fin del Jordán: Y sube este término por Beth-hogla, y pasa del norte á Beth-araba», y la línea meridional de Benjamín «torna á pasar este término por el lado de Beth-hogla hacia el norte» para terminar «á la lengua del mar Salado al norte, al cabo del Jordán al mediodía». Las ciudades de Benjamín se enumeran luego: «Jericó, Beth-hogla, y el valle de Casis»."
    - "El nombre sobrevive en Ain Hajla, un manantial entre palmeras a unos 8 km al sudeste de Jericó, y en Deir Hajla, el monasterio que hay junto a él; el mapa muestra ambos, a poco más de un kilómetro uno de otro. Jerónimo conocía el lugar: al explicar la era de Atad donde José lloró a Jacob, dice que en su tiempo se llamaba Betagla, a tres millas de Jericó y a dos del Jordán, y derivaba el nombre de los dolientes que daban vueltas en círculo. Deir Hajla es el monasterio de san Gerásimo, que fundó su comunidad en la llanura del Jordán en el siglo V y es recordado por el león que le servía; los edificios actuales fueron levantados por monjes griegos en la década de 1880 sobre cimientos más antiguos. La ciudad de la edad del Hierro no ha sido excavada y puede yacer bajo ellos o cerca."
    - "Hoy Deir Hajla se alza entre palmerales de dátiles entre Jericó y el lugar del bautismo de Qasr al-Yahud, un monasterio greco-ortodoxo en funcionamiento abierto a los visitantes."
  pt:
    - "Bete-Hogla, “casa da perdiz”, era uma cidade de Benjamim no vale do Jordão, a sudeste de Jericó, perto do rio e da margem norte do mar Morto. Josué a usa duas vezes como marco de fronteira. A linha norte de Judá começa “na baía do mar, na foz do Jordão. A fronteira subia a Bete-Hogla e passava pelo norte de Bete-Arabá”, e a linha sul de Benjamim “passava para a encosta de Bete-Hogla, ao norte; e a fronteira terminava na baía norte do Mar Salgado, na extremidade sul do Jordão”. As cidades de Benjamim são então listadas: “Jericó, Bete-Hogla, Emeque-Queziz”."
    - "O nome sobrevive em Ain Hajla, uma fonte entre palmeiras cerca de 8 km a sudeste de Jericó, e em Deir Hajla, o mosteiro ao lado; o mapa mostra os dois, a pouco mais de um quilômetro um do outro. Jerônimo conhecia o lugar: ao explicar a eira de Atade onde José pranteou Jacó, diz que em seu tempo se chamava Betagla, a três milhas de Jericó e duas do Jordão, e derivou o nome dos que choravam andando em círculo. Deir Hajla é o mosteiro de Santo Gerásimo, que fundou sua comunidade na planície do Jordão no século V e é lembrado pelo leão que o serviu; os edifícios atuais foram erguidos por monges gregos na década de 1880 sobre alicerces mais antigos. A cidade da Idade do Ferro não foi escavada e pode estar sob eles ou perto."
    - "Hoje Deir Hajla se ergue entre tamarais, entre Jericó e o local de batismo de Qasr al-Yahud, um mosteiro greco-ortodoxo em atividade, aberto a visitantes."
  de:
    - "Bet-Hogla, „Haus des Rebhuhns“, war eine Stadt Benjamins im Jordantal südöstlich von Jericho, nahe dem Fluss und dem Nordufer des Toten Meeres. Josua gebraucht sie zweimal als Grenzmarke. Judas Nordlinie beginnt „von der Zunge des Meers, die am Ende des Jordans ist, und geht herauf gen Beth-Hogla und zieht sich mitternachtswärts von Beth-Araba“, und Benjamins Südlinie „geht an der Seite Beth-Hoglas, das gegen Mitternacht liegt, und ihr Ende ist an der Zunge des Salzmeers gegen Mitternacht, an dem Ende des Jordans gegen Mittag“. Die Städte Benjamins werden dann aufgeführt: „Jericho, Beth-Hogla, Emek-Keziz“."
    - "Der Name lebt in Ain Hadschla fort, einer Quelle unter Palmen etwa 8 km südöstlich von Jericho, und in Deir Hadschla, dem Kloster daneben; die Karte zeigt beide, wenig mehr als einen Kilometer voneinander entfernt. Hieronymus kannte den Ort: Zur Erklärung der Tenne Atad, wo Josef um Jakob klagte, sagt er, sie heiße zu seiner Zeit Bethagla, drei Meilen von Jericho und zwei vom Jordan, und leitete den Namen von den Trauernden ab, die im Kreis gingen. Deir Hadschla ist das Kloster des heiligen Gerasimos, der im 5. Jahrhundert seine Gemeinschaft in der Jordanebene gründete und durch den Löwen im Gedächtnis geblieben ist, der ihm diente; die heutigen Gebäude errichteten griechische Mönche in den 1880er Jahren auf älteren Fundamenten. Die eisenzeitliche Stadt wurde nicht ausgegraben und mag unter oder nahe ihnen liegen."
    - "Heute steht Deir Hadschla zwischen Dattelhainen zwischen Jericho und der Taufstätte Qasr al-Yahud, ein in Betrieb befindliches griechisch-orthodoxes Kloster, das Besuchern offensteht."
  fr:
    - "Beth-Hogla, « maison de la perdrix », était une ville de Benjamin dans la vallée du Jourdain au sud-est de Jéricho, près du fleuve et de la rive nord de la mer Morte. Josué l’emploie deux fois comme repère de frontière. La ligne nord de Juda commence ainsi : « La limite septentrionale partait de la langue de mer qui est à l’embouchure du Jourdain. Elle montait vers Beth-Hogla, passait au nord de Beth-Araba », et la ligne sud de Benjamin « continuait sur le côté septentrional de Beth-Hogla, pour aboutir à la langue septentrionale de la mer Salée, vers l’embouchure du Jourdain au midi ». Les villes de Benjamin sont ensuite énumérées : « Jéricho, Beth-Hogla, Émek-Ketsits »."
    - "Le nom survit à Ain Hajla, source parmi les palmiers à environ 8 km au sud-est de Jéricho, et à Deir Hajla, le monastère à côté ; la carte montre les deux, à guère plus d’un kilomètre l’un de l’autre. Jérôme connaissait le lieu : expliquant l’aire d’Athad où Joseph pleura Jacob, il dit que de son temps on l’appelait Bethagla, à trois milles de Jéricho et deux du Jourdain, et tirait le nom des pleureurs qui tournaient en cercle. Deir Hajla est le monastère de saint Gérasime, qui fonda sa communauté dans la plaine du Jourdain au Ve siècle et reste connu pour le lion qui le servit ; les bâtiments actuels furent élevés par des moines grecs dans les années 1880 sur des fondations plus anciennes. La ville de l’âge du Fer n’a pas été fouillée et peut se trouver sous eux ou près d’eux."
    - "Aujourd’hui Deir Hajla se dresse parmi des palmeraies entre Jéricho et le site du baptême de Qasr al-Yahud, monastère grec orthodoxe en activité ouvert aux visiteurs."
  it:
    - "Bet-Cogla, «casa della pernice», era una città di Beniamino nella valle del Giordano a sud-est di Gerico, vicino al fiume e alla riva settentrionale del Mar Morto. Giosuè la usa due volte come segno di confine. La linea settentrionale di Giuda comincia «dal braccio di mare ov’è la foce del Giordano; di là saliva verso Beth-Hogla, passava al nord di Beth-Araba», e la linea meridionale di Beniamino «passava quindi per il versante settentrionale di Beth-Hogla e facea capo al braccio nord del mar Salato, all’estremità meridionale del Giordano». Le città di Beniamino sono poi elencate: «Gerico, Beth-Hogla, Emek-Ketsits»."
    - "Il nome sopravvive ad Ain Hajla, una sorgente tra le palme a circa 8 km a sud-est di Gerico, e a Deir Hajla, il monastero accanto; la carta mostra entrambi, a poco più di un chilometro l’uno dall’altro. Girolamo conosceva il luogo: spiegando l’aia di Atad dove Giuseppe pianse Giacobbe, dice che ai suoi giorni si chiamava Betagla, a tre miglia da Gerico e due dal Giordano, e derivava il nome dai piangenti che giravano in cerchio. Deir Hajla è il monastero di san Gerasimo, che fondò la sua comunità nella piana del Giordano nel V secolo ed è ricordato per il leone che lo serviva; gli edifici attuali furono innalzati da monaci greci negli anni 1880 su fondamenta più antiche. La città dell’età del Ferro non è stata scavata e può giacere sotto o vicino a essi."
    - "Oggi Deir Hajla sorge tra palmeti fra Gerico e il luogo del battesimo di Qasr al-Yahud, un monastero greco-ortodosso attivo aperto ai visitatori."
  pl:
    - "Bet-Chogla, „dom kuropatwy”, było miastem Beniamina w Dolinie Jordanu na południowy wschód od Jerycha, blisko rzeki i północnego brzegu Morza Martwego. Jozue dwukrotnie używa go jako znaku granicznego. Północna linia Judy zaczyna się „od skały morskiej, od końca Jordanu. A ciągnie się ta granica do Betaglu, i bieży od północy aż do Betaraba”, a południowa linia Beniamina: „bieży ta granica ku stronie Betogla na północy, a kończy się u skały morza słonego na północy, ku końcowi Jordanu na południe”. Miasta Beniamina wylicza się potem: „Jerycho i Betagal, i dolina Kasys”."
    - "Nazwa przetrwała w Ain Hajla, źródle wśród palm około 8 km na południowy wschód od Jerycha, i w Deir Hajla, klasztorze obok niego; mapa pokazuje oba, oddalone o niewiele więcej niż kilometr. Hieronim znał to miejsce: wyjaśniając klepisko Atad, gdzie Józef opłakiwał Jakuba, mówi, że za jego dni nazywało się Bethagla, trzy mile od Jerycha i dwie od Jordanu, i wywodził nazwę od żałobników, którzy chodzili w kółko. Deir Hajla to klasztor św. Gerazyma, który założył swą wspólnotę w równinie Jordanu w V wieku i jest pamiętany ze względu na lwa, który mu służył; obecne budynki wznieśli greccy mnisi w latach 80. XIX wieku na starszych fundamentach. Miasto z epoki żelaza nie było wykopywane i może leżeć pod nimi lub obok."
    - "Dziś Deir Hajla stoi wśród gajów daktylowych między Jerychem a miejscem chrztu Qasr al-Yahud, czynny grecko-prawosławny klasztor otwarty dla zwiedzających."
  nl:
    - "Beth-Chogla, “huis van de patrijs”, was een stad van Benjamin in de Jordaanvallei ten zuidoosten van Jericho, dicht bij de rivier en de noordoever van de Dode Zee. Jozua gebruikt haar tweemaal als grensmerk. Juda’s noordelijke lijn begint “van de tong der zee, van het uiterste van de Jordaan. En deze landpale zal opgaan tot Beth-hogla, en zal doorgaan van het noorden naar Beth-araba”, en Benjamins zuidelijke lijn “Verder gaat deze landpale door aan de zijde van Beth-hogla noordwaarts” om te eindigen “aan de tong der Zoutzee noordwaarts, aan het uiterste van de Jordaan zuidwaarts”. De steden van Benjamin worden dan opgesomd: “Jericho, en Beth-hogla, en Emek-Keziz”."
    - "De naam leeft voort in Ain Hajla, een bron tussen palmen zo’n 8 km ten zuidoosten van Jericho, en in Deir Hajla, het klooster ernaast; de kaart toont beide, nauwelijks een kilometer van elkaar. Hieronymus kende de plaats: de dorsvloer van Atad verklarend, waar Jozef Jakob beweende, zegt hij dat zij in zijn tijd Bethagla heette, drie mijl van Jericho en twee van de Jordaan, en leidde de naam af van de rouwenden die in een kring rondgingen. Deir Hajla is het klooster van Sint-Gerasimus, die in de vijfde eeuw zijn gemeenschap in de Jordaanvlakte stichtte en wordt herinnerd om de leeuw die hem diende; de huidige gebouwen werden in de jaren 1880 door Griekse monniken op oudere funderingen opgetrokken. De ijzertijdstad is niet opgegraven en kan eronder of ernaast liggen."
    - "Tegenwoordig staat Deir Hajla tussen dadelpalmbossen tussen Jericho en de doopplaats Qasr al-Yahud, een werkend Grieks-orthodox klooster dat voor bezoekers openstaat."
  cs:
    - "Bét-chogla, „dům koroptve“, bylo město Benjamínovo v Jordánském údolí jihovýchodně od Jericha, blízko řeky a severního břehu Mrtvého moře. Jozue je dvakrát užívá jako hraniční znak. Severní čára Judy vede „od zátoky moře a od kraje Jordánu. Odkudž jde meze ta do Betogla, a táhne se od půlnoci do Betaraba“ a jižní čára Benjamínova „jde k straně Betogla na půlnoci, a skonává se meze ta při zátoce moře slaného od půlnoční strany, tu kdež vpadá Jordán do moře na polední straně“. Města Benjamínova jsou pak vyjmenována: „Jericho, Betogla a údolí Kasis“."
    - "Jméno přežívá v Ain Hajla, prameni mezi palmami asi 8 km jihovýchodně od Jericha, a v Deir Hajla, klášteře vedle něj; mapa ukazuje obojí, od sebe sotva kilometr. Jeroným místo znal: vykládaje humno Atad, kde Josef oplakával Jákoba, praví, že se za jeho dnů nazývalo Bethagla, tři míle od Jericha a dvě od Jordánu, a odvozuje jméno od truchlících, kteří chodili v kruhu. Deir Hajla je klášter svatého Gerasima, který založil své společenství v Jordánské pláni v 5. století a je připomínán pro lva, který mu sloužil; dnešní budovy vztyčili řečtí mniši v 80. letech 19. století na starších základech. Město doby železné nebylo vykopáno a může ležet pod nimi nebo vedle nich."
    - "Dnes stojí Deir Hajla mezi datlovými háji mezi Jerichem a křestním místem Qasr al-Yahud, činný řecký pravoslavný klášter přístupný návštěvníkům."
