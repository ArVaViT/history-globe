# Overview article (ADR 0007). Mainstream facts only; a wilderness station: the site is a guess and the article says so.
id: oboth
place: a0ef1e1
title:
  en: "Oboth"
  ru: "Овоф"
body:
  en:
    - "Oboth was a camp of Israel on the last stretch of the wilderness journey. After Aaron died on Mount Hor the people went “by the way of the Red sea, to compass the land of Edom”, lost heart, and were bitten by the fiery serpents; then “the children of Israel set forward, and pitched in Oboth”, and from Oboth went on to Iye-abarim “in the wilderness which is before Moab, toward the sunrising”. The itinerary of Numbers 33 puts Oboth between Punon and Iye-abarim, “in the border of Moab”. The name may mean “water-skins”, though the same letters spell the spirits of the dead that the law forbids to consult; nothing in the text explains it."
    - "The station must lie on the road that skirts Edom from the south, somewhere in or beside the Arabah, since Punon is Feinan, the copper district on its eastern edge. Beyond that the Bible gives nothing. The usual guess since the nineteenth century has been the oasis of Ain el-Weibeh on the west side of the Arabah opposite Feinan, which the map marks first; Gharandal, the Roman station of Arindela in the hills of Edom, En Hazeva, the Roman fort of Tamar, and Telah have also been proposed. No excavation can test a camp of tents, and the choice rests on the shape of the route."
    - "Today the places named lie along the Wadi Araba road between the Dead Sea and Aqaba, on both sides of the Israeli-Jordanian border: desert, acacia and a few springs."
  ru:
    - "Овоф — стан Израиля на последнем отрезке пути по пустыне. После смерти Аарона на горе Ор народ пошёл «путем Чермного моря, чтобы миновать землю Едома», стал малодушествовать и был ужален ядовитыми змеями; затем сыны Израилевы отправились и «остановились в Овофе», а из Овофа пошли в Ийе-Аварим, «в пустыне, что против Моава, к восходу солнца». Перечень станов в 33-й главе Чисел ставит Овоф между Пуноном и Ийм-Аваримом, «на пределах Моава». Имя, возможно, значит «мехи для воды», хотя теми же буквами пишутся духи мёртвых, вопрошать которых запрещает закон; текст его никак не объясняет."
    - "Стан должен лежать на дороге, огибающей Едом с юга, где-то в Араве или рядом с ней, поскольку Пунон — это Файнан, медный край на её восточной кромке. Больше Библия ничего не даёт. Обычная догадка с XIX века — оазис Айн-эль-Вейбе на западной стороне Аравы напротив Файнана, который на карте стоит первым; предлагали также Гарандаль, римскую станцию Ариндела в горах Едома, Эйн-Хацеву, римскую крепость Тамар, и Телах. Раскопками стан из шатров не проверить, и выбор зависит от того, как представлять себе маршрут."
    - "Сегодня названные места лежат вдоль дороги по Вади-Араба между Мёртвым морем и Акабой, по обе стороны израильско-иорданской границы: пустыня, акации и несколько источников."
