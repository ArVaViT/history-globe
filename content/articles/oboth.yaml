body:
  en:
    - "Oboth was a camp of Israel on the last stretch of the wilderness journey. After Aaron died on Mount Hor the people went “by the way of the Red sea, to compass the land of Edom”, lost heart, and were bitten by the fiery serpents; then “the children of Israel set forward, and pitched in Oboth”, and from Oboth went on to Iye-abarim “in the wilderness which is before Moab, toward the sunrising”. The itinerary of Numbers 33 puts Oboth between Punon and Iye-abarim, “in the border of Moab”. The name may mean “water-skins”, though the same letters spell the spirits of the dead that the law forbids to consult; nothing in the text explains it."
    - "The station must lie on the road that skirts Edom from the south, somewhere in or beside the Arabah, since Punon is Feinan, the copper district on its eastern edge. Beyond that the Bible gives nothing. The usual guess has been the oasis of Ain el-Weibeh on the west side of the Arabah opposite Feinan, which the map marks first; Gharandal, the Roman station of Arindela in the hills of Edom, En Hazeva, the Roman fort of Tamar, and Telah have also been proposed. No excavation can test a camp of tents, and the choice rests on the shape of the route."
    - "Today the places named lie along the Wadi Araba road between the Dead Sea and Aqaba, on both sides of the Israeli-Jordanian border: desert, acacia and a few springs."
  ru:
    - "Овоф — стан Израиля на последнем отрезке пути по пустыне. После смерти Аарона на горе Ор народ пошёл «путем Чермного моря, чтобы миновать землю Едома», стал малодушествовать и был ужален ядовитыми змеями; затем сыны Израилевы отправились и «остановились в Овофе», а из Овофа пошли в Ийе-Аварим, «в пустыне, что против Моава, к восходу солнца». Перечень станов в 33-й главе Чисел ставит Овоф между Пуноном и Ийм-Аваримом, «на пределах Моава». Имя, возможно, значит «мехи для воды», хотя теми же буквами пишутся духи мёртвых, вопрошать которых запрещает закон; текст его никак не объясняет."
    - "Стан должен лежать на дороге, огибающей Едом с юга, где-то в Араве или рядом с ней, поскольку Пунон — это Файнан, медный край на её восточной кромке. Больше Библия ничего не даёт. Обычная догадка — оазис Айн-эль-Вейбе на западной стороне Аравы напротив Файнана, который на карте стоит первым; предлагали также Гарандаль, римскую станцию Ариндела в горах Едома, Эйн-Хацеву, римскую крепость Тамар, и Телах. Раскопками стан из шатров не проверить, и выбор зависит от того, как представлять себе маршрут."
    - "Сегодня названные места лежат вдоль дороги по Вади-Араба между Мёртвым морем и Акабой, по обе стороны израильско-иорданской границы: пустыня, акации и несколько источников."
  uk:
    - "Овот був табором Ізраїлю на останньому відтинку мандрів пустелею. Після смерті Аарона на горі Гор народ рушив «шляхом до Червоного моря, щоб обминути Едом землю», занепав духом і був покусаний вогненними зміями; потім «рушили сини Ізрайлеві в дорогу та й отаборились в Оботї», а від Овота пішли до Ійє-Аварім «у степу, що розкинувся перед Моабом на схід соньця». Перелік стоянок у Числах 33 ставить Овот між Пуноном та Ійє-Аварімом, «на границї Моаба». Ім’я може означати «бурдюки для води», хоча тими самими літерами пишуться духи померлих, до яких закон забороняє звертатися; текст цього не пояснює."
    - "Стоянка мусила лежати на дорозі, що огинає Едом із півдня, десь в Араві або поряд із нею, бо Пунон — це Фейнан, мідний район на її східному краю. Більше Біблія нічого не повідомляє. Найчастіше припускають оазу Айн-ель-Вейбе на західному боці Арави навпроти Фейнана, яку мапа позначає першою; пропонували також Гарандал, римську станцію Аріндела в едомських горах, Ен-Хацеву, римський форт Тамар, і Телах. Жодні розкопки не можуть перевірити табір із наметів, і вибір ґрунтується на конфігурації маршруту."
    - "Нині названі місця лежать уздовж дороги Ваді-Арава між Мертвим морем та Акабою, по обидва боки ізраїльсько-йорданського кордону: пустеля, акації та кілька джерел."
  es:
    - "Obot fue un campamento de Israel en el último tramo de la travesía del desierto. Después de morir Aarón en el monte Hor, el pueblo partió «camino del mar Bermejo, para rodear la tierra de Edom», perdió el ánimo y fue mordido por las serpientes ardientes; luego «partieron los hijos de Israel, y asentaron campo en Oboth», y de Obot siguieron a Ije-abarim, «en el desierto que está delante de Moab, al nacimiento del sol». El itinerario de Números 33 sitúa Obot entre Funón e Ije-abarim, «en el término de Moab». El nombre podría significar «odres», aunque las mismas letras escriben los espíritus de los muertos que la ley prohíbe consultar; nada en el texto lo explica."
    - "La estación debe de estar en el camino que bordea Edom por el sur, en algún lugar del Arabá o junto a él, pues Funón es Feinan, la zona del cobre en su borde oriental. Más allá de eso la Biblia no dice nada. La conjetura habitual ha sido el oasis de Ain el-Weibeh, en el lado occidental del Arabá frente a Feinan, que el mapa señala en primer lugar; también se han propuesto Gharandal, la estación romana de Arindela en las colinas de Edom, En Hazeva, el fuerte romano de Tamar, y Telah. Ninguna excavación puede poner a prueba un campamento de tiendas, y la elección se apoya en la forma de la ruta."
    - "Hoy los lugares nombrados se hallan a lo largo de la carretera del uadi Araba entre el mar Muerto y Aqaba, a ambos lados de la frontera entre Israel y Jordania: desierto, acacias y unas pocas fuentes."
  pt:
    - "Obote era um acampamento de Israel no último trecho da jornada pelo deserto. Depois da morte de Arão no Monte Hor, o povo seguiu “pelo caminho do mar Vermelho, para contornar a terra de Edom”, desanimou e foi mordido pelas serpentes abrasadoras; então “os filhos de Israel viajaram e acamparam em Obote”, e de Obote seguiram para Ie-Abarim, “no deserto que está defronte de Moabe, em direção ao nascer do sol”. O itinerário de Números 33 põe Obote entre Punom e Ie-Abarim, “na fronteira de Moabe”. O nome pode significar “odres”, embora as mesmas letras formem os espíritos dos mortos que a lei proíbe consultar; nada no texto o explica."
    - "A estação deve ficar na estrada que contorna Edom pelo sul, em algum ponto da Arabá ou junto a ela, já que Punom é Feinan, o distrito do cobre em sua margem oriental. Além disso a Bíblia nada informa. A hipótese habitual é o oásis de Ain el-Weibeh, no lado oeste da Arabá, defronte de Feinan, que o mapa marca em primeiro lugar; Gharandal, a estação romana de Arindela nas colinas de Edom, En Hazeva, o forte romano de Tamar e Telá também foram propostos. Nenhuma escavação pode testar um acampamento de tendas, e a escolha se apoia no traçado da rota."
    - "Hoje os lugares citados ficam ao longo da estrada do Uádi Araba, entre o Mar Morto e Aqaba, dos dois lados da fronteira israelo-jordaniana: deserto, acácias e algumas fontes."
  de:
    - "Obot war ein Lager Israels auf dem letzten Abschnitt der Wüstenwanderung. Nach Aarons Tod auf dem Berg Hor zog das Volk „auf dem Wege gegen das Schilfmeer, daß sie um der Edomiter Land hinzögen“, wurde mutlos und von den Feuerschlangen gebissen; dann „die Kinder Israel zogen aus und lagerten sich in Oboth“, und von Oboth ging es weiter nach Ije-Abarim, „in der Wüste Moab, gegenüber gegen der Sonne Aufgang“. Die Stationenliste von Numeri 33 setzt Obot zwischen Punon und Ije-Abarim, „in der Moabiter Gebiet“. Der Name bedeutet vielleicht „Wasserschläuche“, doch dieselben Buchstaben schreiben auch die Totengeister, die zu befragen das Gesetz verbietet; nichts im Text erklärt ihn."
    - "Die Station muss an der Straße liegen, die Edom von Süden her umgeht, irgendwo in oder neben der Araba, da Punon das Feinan ist, der Kupferbezirk an ihrem Ostrand. Darüber hinaus gibt die Bibel nichts her. Die übliche Vermutung ist die Oase Ajin el-Weibe auf der Westseite der Araba gegenüber von Feinan, die die Karte zuerst nennt; Gharandal, die römische Station Arindela im Bergland Edoms, En Hazeva, das römische Kastell Tamar und Telach wurden ebenfalls vorgeschlagen. Keine Grabung kann ein Zeltlager prüfen, und die Wahl beruht auf dem Verlauf der Route."
    - "Heute liegen die genannten Orte an der Straße durch das Wadi Araba zwischen dem Toten Meer und Akaba, auf beiden Seiten der israelisch-jordanischen Grenze: Wüste, Akazien und einige Quellen."
  fr:
    - "Oboth fut un campement d’Israël sur la dernière étape du voyage dans le désert. Après la mort d’Aaron sur le mont Hor, le peuple prit « le chemin de la mer Rouge, pour contourner le pays d’Édom », perdit courage et fut mordu par les serpents brûlants ; puis « les enfants d’Israël partirent, et ils campèrent à Oboth », et d’Oboth allèrent à Ijé-Abarim « dans le désert qui est vis-à-vis de Moab, vers le soleil levant ». L’itinéraire de Nombres 33 place Oboth entre Punon et Ijé-Abarim, « sur la frontière de Moab ». Le nom peut signifier « outres », bien que les mêmes lettres désignent les esprits des morts que la loi interdit de consulter ; rien dans le texte ne l’explique."
    - "La halte doit se trouver sur la route qui longe Édom par le sud, quelque part dans l’Araba ou à côté, puisque Punon est Feinan, le district du cuivre sur son bord oriental. Au-delà, la Bible ne donne rien. L’hypothèse courante est l’oasis d’Aïn el-Weibeh, sur le côté ouest de l’Araba en face de Feinan, que la carte marque en premier ; Gharandal, la station romaine d’Arindéla dans les collines d’Édom, En Hazeva, le fort romain de Tamar, et Thélach ont aussi été proposés. Aucune fouille ne peut éprouver un campement de tentes, et le choix repose sur le tracé de la route."
    - "Aujourd’hui, les lieux nommés s’échelonnent le long de la route du Wadi Araba entre la mer Morte et Aqaba, de part et d’autre de la frontière israélo-jordanienne : désert, acacias et quelques sources."
  it:
    - "Obot era un accampamento di Israele nell’ultimo tratto del viaggio nel deserto. Dopo la morte di Aronne sul Monte Or il popolo andò «verso il mar Rosso per fare il giro del paese di Edom», si perse d’animo e fu morso dai serpenti ardenti; poi «i figliuoli d’Israele partirono e si accamparono a Oboth», e da Obot proseguirono per Iie-Abarim «nel deserto ch’è dirimpetto a Moab dal lato dove sorge il sole». L’itinerario di Numeri 33 pone Obot tra Punon e Iie-Abarim, «sui confini di Moab». Il nome può significare «otri», benché le stesse lettere scrivano gli spiriti dei morti che la legge proibisce di consultare; nulla nel testo lo spiega."
    - "La tappa deve trovarsi sulla strada che costeggia Edom da sud, da qualche parte nell’Araba o accanto ad essa, dato che Punon è Feinan, il distretto del rame sul suo margine orientale. Oltre a questo la Bibbia non dà nulla. L’ipotesi abituale è l’oasi di Ain el-Weibeh sul lato occidentale dell’Araba, di fronte a Feinan, che la mappa segna per prima; sono stati proposti anche Gharandal, la stazione romana di Arindela sulle alture di Edom, En Hazeva, il forte romano di Tamar, e Tela. Nessuno scavo può mettere alla prova un accampamento di tende, e la scelta poggia sulla forma del percorso."
    - "Oggi i luoghi nominati si trovano lungo la strada del Wadi Araba tra il Mar Morto e Aqaba, su entrambi i lati del confine israelo-giordano: deserto, acacie e poche sorgenti."
  pl:
    - "Obot było obozem Izraela na ostatnim odcinku wędrówki przez pustynię. Po śmierci Aarona na górze Hor lud poszedł „drogą ku morzu czerwonemu, aby obeszli ziemię Edomską”, stracił ducha i został pokąsany przez węże ogniste; potem „ruszyli się synowie Izraelscy, a stanęli obozem w Obot”, a z Obot poszli dalej do Ije-Abarim, „na puszczy, która jest przeciw Moabczykom od wschodu słońca”. Itinerarium z Lb 33 umieszcza Obot między Punon a Ije-Abarim, „na granicy Moabskiej”. Nazwa może znaczyć „bukłaki”, chociaż te same litery oddają duchy zmarłych, których prawo zakazuje się radzić; tekst niczego nie wyjaśnia."
    - "Stacja musi leżeć przy drodze omijającej Edom od południa, gdzieś w Arabie lub obok niej, skoro Punon to Fenan, okręg miedzi na jej wschodnim skraju. Poza tym Biblia niczego nie podaje. Zwykłym przypuszczeniem jest oaza Ajn el-Weibe po zachodniej stronie Araby naprzeciw Fenan, którą mapa zaznacza jako pierwszą; proponowano też Gharandal, rzymską stację Arindela we wzgórzach Edomu, En Chazewa, rzymski fort Tamar oraz Telach. Żadne wykopaliska nie mogą zbadać obozu namiotów, a wybór opiera się na kształcie trasy."
    - "Dziś wymienione miejsca leżą wzdłuż drogi Wadi Araba między Morzem Martwym a Akabą, po obu stronach granicy izraelsko-jordańskiej: pustynia, akacje i kilka źródeł."
  cs:
    - "Óbót byl tábor Izraele na posledním úseku putování pouští. Když Áron zemřel na hoře Hor, lid šel „cestou k moři Rudému, aby obešli zemi Idumejskou“, ztratil odvahu a byl pokousán ohnivými hady; pak „hnuli se odtud synové Izraelští, a položili se v Obot“ a z Óbótu šli dál do Ijje-abarím, „na poušti, kteráž jest naproti zemi Moábské k východu slunce“. Itinerář Numeri 33 klade Óbót mezi Punon a Ijje-abarím, „na pomezí Moábském“. Jméno může znamenat „měchy na vodu“, ač stejná hebrejská písmena píší duchy zemřelých, jejichž dotazování zákon zakazuje; text nic nevysvětluje."
    - "Zastávka musí ležet na cestě, která obchází Edom z jihu, někde v Arabě nebo vedle ní, neboť Punon je Fejnán, měděná oblast na jejím východním okraji. Dále Bible nic neuvádí. Obvyklou domněnkou je oáza Ajn el-Vajba na západní straně Araby naproti Fejnánu, kterou mapa vyznačuje první; navrhovány byly také Gharandal, římská stanice Arindela v edomských horách, En Chazeva, římská pevnost Tamar, a Telach. Žádné vykopávky nemohou prověřit tábor ze stanů a volba spočívá na tvaru trasy."
    - "Dnes leží zmíněná místa podél silnice Vádí Araba mezi Mrtvým mořem a Akabou, po obou stranách izraelsko-jordánské hranice: poušť, akácie a několik pramenů."
  nl:
    - "Obot was een kamp van Israël op het laatste stuk van de woestijnreis. Nadat Aäron op de berg Hor was gestorven, trok het volk “op den weg der Schelfzee, dat zij om het land der Edomieten heentogen”, verloor de moed en werd door de vurige slangen gebeten; toen “verreisden de kinderen Israels, en zij legerden zich te Oboth”, en van Obot trok het verder naar Ijje-Abarim “in de woestijn, die tegenover Moab is, tegen den opgang der zon”. De reisroute van Numeri 33 plaatst Obot tussen Punon en Ijje-Abarim, “in de landpale van Moab”. De naam betekent misschien “waterzakken”, hoewel dezelfde letters de geesten der doden spellen die de wet verbiedt te raadplegen; niets in de tekst verklaart hem."
    - "De halteplaats moet liggen aan de weg die Edom aan de zuidkant omzoomt, ergens in of naast de Araba, want Punon is Feinan, het kopergebied aan de oostrand ervan. Verder geeft de Bijbel niets. De gebruikelijke gok is de oase Ain el-Weibeh aan de westkant van de Araba tegenover Feinan, die de kaart als eerste aanwijst; Gharandal, het Romeinse station Arindela in het Edomitische bergland, En Hazeva, het Romeinse fort Tamar, en Telach zijn ook voorgesteld. Geen opgraving kan een tentenkamp toetsen, en de keuze rust op de vorm van de route."
    - "Tegenwoordig liggen de genoemde plaatsen langs de weg door de Wadi Araba tussen de Dode Zee en Akaba, aan beide kanten van de Israëlisch-Jordaanse grens: woestijn, acacia’s en enkele bronnen."
  sv:
    - "Ovot var ett läger för Israel på den sista sträckan av ökenvandringen. Sedan Aron dött på berget Hor tog folket, som det heter, ”vägen åt Röda havet till, för att gå omkring Edoms land”, tappade modet och blev bitna av de giftiga ormarna; därefter ”Israels barn bröto upp och lägrade sig i Obot”, och från Ovot gick de vidare till Ije-Haabarim ”i öknen som ligger framför Moab, österut”. Vandringsförteckningen i 4 Mos 33 placerar Ovot mellan Punon och Ije-Haabarim, ”vid Moabs gräns”. Namnet kan betyda ”vattenskinn”, fastän samma bokstäver stavar de dödas andar som lagen förbjuder att rådfråga; ingenting i texten förklarar det."
    - "Stationen måste ligga på vägen som kantar Edom söderifrån, någonstans i eller invid Arava, eftersom Punon är Feinan, koppardistriktet på dess östra kant. Utöver det ger Bibeln ingenting. Den vanliga gissningen har varit oasen Ain el-Weibeh på västra sidan av Arava mittemot Feinan, som kartan markerar först; Gharandal, den romerska stationen Arindela i Edoms berg, En Hazeva, det romerska fortet Tamar och Telach har också föreslagits. Ingen utgrävning kan pröva ett tältläger, och valet vilar på färdvägens form."
    - "I dag ligger de nämnda platserna längs Wadi Araba-vägen mellan Döda havet och Akaba, på båda sidor av gränsen mellan Israel och Jordanien: öken, akacior och några få källor."
  nb:
    - "Obot var en av Israels leirplasser på den siste strekningen av ørkenvandringen. Etter at Aron døde på Hor-fjellet, tok folket «veien til det Røde Hav for å dra omkring Edoms land», mistet motet og ble bitt av ildslangene; så «brøt Israels barn op og leiret sig i Obot», og fra Obot gikk de videre til Ije-Abarim «i ørkenen rett i øst for Moab». Ferdaberetningen i 4. Mosebok 33 setter Obot mellom Punon og Ije-Abarim, «ved Moabs grense». Navnet kan bety «vannsekker», men de samme bokstavene staver dødningenes ånder som loven forbyr å rådspørre; ingenting i teksten forklarer det."
    - "Stasjonen må ligge ved veien som går langs Edom fra sør, et sted i eller ved Arava, siden Punon er Feinan, kobberdistriktet i Aravas østkant. Utover det gir Bibelen ingenting. Det vanlige gjettet har vært oasen Ain el-Weibeh på vestsiden av Arava rett overfor Feinan, som kartet markerer først; Gharandal, den romerske stasjonen Arindela i Edoms åser, En Hazeva, det romerske fortet Tamar og Telah er også foreslått. Ingen utgravning kan prøve en teltleir, og valget hviler på rutens form."
    - "I dag ligger de nevnte stedene langs Wadi Araba-veien mellom Dødehavet og Aqaba, på begge sider av grensen mellom Israel og Jordan: ørken, akasie og noen få kilder."
  tl:
    - "Ang Oboth ay isang kampamento ng Israel sa huling bahagi ng paglalakbay sa ilang. Pagkamatay ni Aaron sa Bundok Hor, ang bayan ay napunta sa “daang patungo sa Dagat na Mapula upang lumiko sa lupain ng Edom”, nawalan ng loob, at kinagat ng mababangis na ahas; pagkatapos ay “ang mga anak ni Israel ay naglakbay, at humantong sa Oboth”, at mula sa Oboth ay nagpatuloy sa Ije-abarim “sa ilang na nasa tapat ng Moab, sa dakong sinisikatan ng araw”. Inilalagay ng itineraryo ng Mga Bilang 33 ang Oboth sa pagitan ng Phunon at Ije-abarim, “sa hangganan ng Moab”. Maaaring nangangahulugan ang pangalan ng “mga balat na sisidlan ng tubig”, bagaman ang parehong mga titik ang bumabaybay sa mga espiritu ng patay na ipinagbabawal ng kautusan na konsultahin; walang nagpapaliwanag nito sa teksto."
    - "Dapat nasa daan ang himpilang umiikot sa Edom mula sa timog, sa isang lugar sa loob o sa tabi ng Araba, yamang ang Phunon ay Feinan, ang distrito ng tanso sa silangang gilid nito. Higit pa roon, wala nang ibinibigay ang Bibliya. Ang karaniwang hula ay ang oasis ng Ain el-Weibeh sa kanlurang panig ng Araba sa tapat ng Feinan, na unang minamarkahan ng mapa; iminungkahi rin ang Gharandal, ang himpilang Romano ng Arindela sa mga burol ng Edom, ang En Hazeva, ang kutang Romano ng Tamar, at ang Thela. Walang paghuhukay na makasusubok sa kampo ng mga tolda, at ang pagpili ay nakasalalay sa hugis ng ruta."
    - "Ngayon, ang mga lugar na binanggit ay nasa tabi ng daan ng Wadi Araba sa pagitan ng Dagat na Patay at Aqaba, sa magkabilang panig ng hangganan ng Israel at Jordan: disyerto, akasya at ilang bukal."
  da:
    - "Obot var en af Israels lejre på den sidste strækning af ørkenvandringen. Efter at Aron var død på Bjerget Hor, drog folket »paa Vejen til det røde Hav, for at drage omkring Edoms Land«, tabte modet og blev bidt af de giftige slanger; derpå »Israels Børn rejste derfra, og de lejrede sig i Oboth«, og fra Obot drog de videre til Ijje-ha-Abarim »i Ørken, som er lige foran Moab, mod Solens Opgang«. Rejseberetningen i 4 Mos 33 sætter Obot mellem Punon og Ijje-ha-Abarim, »ved Moabiternes Landemærke«. Navnet kan betyde »vandsække«, selv om de samme bogstaver staver de dødes ånder, som loven forbyder at rådspørge; intet i teksten forklarer det."
    - "Stationen må ligge på vejen, der løber uden om Edom fra syd, et sted i eller ved Araba, da Punon er Feinan, kobberdistriktet på dens østlige kant. Ud over det giver Bibelen intet. Det sædvanlige gæt har været oasen Ain el-Weibeh på Arabas vestside over for Feinan, som kortet markerer først; Gharandal, den romerske station Arindela i Edoms bjerge, En Hazeva, det romerske fort Tamar og Telah er også blevet foreslået. Ingen udgravning kan prøve en teltlejr, og valget hviler på rutens forløb."
    - "I dag ligger de nævnte steder langs Wadi Araba-vejen mellem Det Døde Hav og Aqaba, på begge sider af den israelsk-jordanske grænse: ørken, akacier og nogle få kilder."
