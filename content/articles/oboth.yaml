# Overview article (ADR 0007). Mainstream facts only; a wilderness station: the site is a guess and the article says so.
id: oboth
place: a0ef1e1
title:
  en: "Oboth"
  ru: "Овоф"
  uk: "Овот"
  es: "Obot"
  pt: "Obote"
  de: "Obot"
  fr: "Oboth"
  it: "Obot"
  pl: "Obot"
  cs: "Óbót"
