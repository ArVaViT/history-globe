# Overview article (ADR 0007). Mainstream facts only; a wilderness station: the site is a guess and the article says so.
id: oboth
place: a0ef1e1
title:
  en: "Oboth"
  ru: "Овоф"
  uk: "Овот"
  es: "Obot"
  pt: "Obote"
  de: "Obot"
  fr: "Oboth"
body:
  en:
    - "Oboth was a camp of Israel on the last stretch of the wilderness journey. After Aaron died on Mount Hor the people went “by the way of the Red sea, to compass the land of Edom”, lost heart, and were bitten by the fiery serpents; then “the children of Israel set forward, and pitched in Oboth”, and from Oboth went on to Iye-abarim “in the wilderness which is before Moab, toward the sunrising”. The itinerary of Numbers 33 puts Oboth between Punon and Iye-abarim, “in the border of Moab”. The name may mean “water-skins”, though the same letters spell the spirits of the dead that the law forbids to consult; nothing in the text explains it."
    - "The station must lie on the road that skirts Edom from the south, somewhere in or beside the Arabah, since Punon is Feinan, the copper district on its eastern edge. Beyond that the Bible gives nothing. The usual guess since the nineteenth century has been the oasis of Ain el-Weibeh on the west side of the Arabah opposite Feinan, which the map marks first; Gharandal, the Roman station of Arindela in the hills of Edom, En Hazeva, the Roman fort of Tamar, and Telah have also been proposed. No excavation can test a camp of tents, and the choice rests on the shape of the route."
    - "Today the places named lie along the Wadi Araba road between the Dead Sea and Aqaba, on both sides of the Israeli-Jordanian border: desert, acacia and a few springs."
  ru:
    - "Овоф — стан Израиля на последнем отрезке пути по пустыне. После смерти Аарона на горе Ор народ пошёл «путем Чермного моря, чтобы миновать землю Едома», стал малодушествовать и был ужален ядовитыми змеями; затем сыны Израилевы отправились и «остановились в Овофе», а из Овофа пошли в Ийе-Аварим, «в пустыне, что против Моава, к восходу солнца». Перечень станов в 33-й главе Чисел ставит Овоф между Пуноном и Ийм-Аваримом, «на пределах Моава». Имя, возможно, значит «мехи для воды», хотя теми же буквами пишутся духи мёртвых, вопрошать которых запрещает закон; текст его никак не объясняет."
    - "Стан должен лежать на дороге, огибающей Едом с юга, где-то в Араве или рядом с ней, поскольку Пунон — это Файнан, медный край на её восточной кромке. Больше Библия ничего не даёт. Обычная догадка с XIX века — оазис Айн-эль-Вейбе на западной стороне Аравы напротив Файнана, который на карте стоит первым; предлагали также Гарандаль, римскую станцию Ариндела в горах Едома, Эйн-Хацеву, римскую крепость Тамар, и Телах. Раскопками стан из шатров не проверить, и выбор зависит от того, как представлять себе маршрут."
    - "Сегодня названные места лежат вдоль дороги по Вади-Араба между Мёртвым морем и Акабой, по обе стороны израильско-иорданской границы: пустыня, акации и несколько источников."
  uk:
    - "Овот був табором Ізраїлю на останньому відтинку мандрів пустелею. Після смерті Аарона на горі Гор народ рушив «шляхом до Червоного моря, щоб обминути Едом землю», занепав духом і був покусаний вогненними зміями; потім «рушили сини Ізрайлеві в дорогу та й отаборились в Оботї», а від Овота пішли до Ійє-Аварім «у степу, що розкинувся перед Моабом на схід соньця». Перелік стоянок у Числах 33 ставить Овот між Пуноном та Ійє-Аварімом, «на границї Моаба». Ім’я може означати «бурдюки для води», хоча тими самими літерами пишуться духи померлих, до яких закон забороняє звертатися; текст цього не пояснює."
    - "Стоянка мусила лежати на дорозі, що огинає Едом із півдня, десь в Араві або поряд із нею, бо Пунон — це Фейнан, мідний район на її східному краю. Більше Біблія нічого не повідомляє. Від XIX ст. найчастіше припускають оазу Айн-ель-Вейбе на західному боці Арави навпроти Фейнана, яку мапа позначає першою; пропонували також Гарандал, римську станцію Аріндела в едомських горах, Ен-Хацеву, римський форт Тамар, і Телах. Жодні розкопки не можуть перевірити табір із наметів, і вибір ґрунтується на конфігурації маршруту."
    - "Нині названі місця лежать уздовж дороги Ваді-Арава між Мертвим морем та Акабою, по обидва боки ізраїльсько-йорданського кордону: пустеля, акації та кілька джерел."
  es:
    - "Obot fue un campamento de Israel en el último tramo de la travesía del desierto. Después de morir Aarón en el monte Hor, el pueblo partió «camino del mar Bermejo, para rodear la tierra de Edom», perdió el ánimo y fue mordido por las serpientes ardientes; luego «partieron los hijos de Israel, y asentaron campo en Oboth», y de Obot siguieron a Ije-abarim, «en el desierto que está delante de Moab, al nacimiento del sol». El itinerario de Números 33 sitúa Obot entre Funón e Ije-abarim, «en el término de Moab». El nombre podría significar «odres», aunque las mismas letras escriben los espíritus de los muertos que la ley prohíbe consultar; nada en el texto lo explica."
    - "La estación debe de estar en el camino que bordea Edom por el sur, en algún lugar del Arabá o junto a él, pues Funón es Feinan, la zona del cobre en su borde oriental. Más allá de eso la Biblia no dice nada. La conjetura habitual desde el siglo XIX ha sido el oasis de Ain el-Weibeh, en el lado occidental del Arabá frente a Feinan, que el mapa señala en primer lugar; también se han propuesto Gharandal, la estación romana de Arindela en las colinas de Edom, En Hazeva, el fuerte romano de Tamar, y Telah. Ninguna excavación puede poner a prueba un campamento de tiendas, y la elección se apoya en la forma de la ruta."
    - "Hoy los lugares nombrados se hallan a lo largo de la carretera del uadi Araba entre el mar Muerto y Aqaba, a ambos lados de la frontera entre Israel y Jordania: desierto, acacias y unas pocas fuentes."
  pt:
    - "Obote era um acampamento de Israel no último trecho da jornada pelo deserto. Depois da morte de Arão no Monte Hor, o povo seguiu “pelo caminho do mar Vermelho, para contornar a terra de Edom”, desanimou e foi mordido pelas serpentes abrasadoras; então “os filhos de Israel viajaram e acamparam em Obote”, e de Obote seguiram para Ie-Abarim, “no deserto que está defronte de Moabe, em direção ao nascer do sol”. O itinerário de Números 33 põe Obote entre Punom e Ie-Abarim, “na fronteira de Moabe”. O nome pode significar “odres”, embora as mesmas letras formem os espíritos dos mortos que a lei proíbe consultar; nada no texto o explica."
    - "A estação deve ficar na estrada que contorna Edom pelo sul, em algum ponto da Arabá ou junto a ela, já que Punom é Feinan, o distrito do cobre em sua margem oriental. Além disso a Bíblia nada informa. A hipótese habitual desde o século XIX é o oásis de Ain el-Weibeh, no lado oeste da Arabá, defronte de Feinan, que o mapa marca em primeiro lugar; Gharandal, a estação romana de Arindela nas colinas de Edom, En Hazeva, o forte romano de Tamar e Telá também foram propostos. Nenhuma escavação pode testar um acampamento de tendas, e a escolha se apoia no traçado da rota."
    - "Hoje os lugares citados ficam ao longo da estrada do Uádi Araba, entre o Mar Morto e Aqaba, dos dois lados da fronteira israelo-jordaniana: deserto, acácias e algumas fontes."
  de:
    - "Obot war ein Lager Israels auf dem letzten Abschnitt der Wüstenwanderung. Nach Aarons Tod auf dem Berg Hor zog das Volk „auf dem Wege gegen das Schilfmeer, daß sie um der Edomiter Land hinzögen“, wurde mutlos und von den Feuerschlangen gebissen; dann „die Kinder Israel zogen aus und lagerten sich in Oboth“, und von Oboth ging es weiter nach Ije-Abarim, „in der Wüste Moab, gegenüber gegen der Sonne Aufgang“. Die Stationenliste von Numeri 33 setzt Obot zwischen Punon und Ije-Abarim, „in der Moabiter Gebiet“. Der Name bedeutet vielleicht „Wasserschläuche“, doch dieselben Buchstaben schreiben auch die Totengeister, die zu befragen das Gesetz verbietet; nichts im Text erklärt ihn."
    - "Die Station muss an der Straße liegen, die Edom von Süden her umgeht, irgendwo in oder neben der Araba, da Punon das Feinan ist, der Kupferbezirk an ihrem Ostrand. Darüber hinaus gibt die Bibel nichts her. Die übliche Vermutung seit dem 19. Jahrhundert ist die Oase Ajin el-Weibe auf der Westseite der Araba gegenüber von Feinan, die die Karte zuerst nennt; Gharandal, die römische Station Arindela im Bergland Edoms, En Hazeva, das römische Kastell Tamar und Telach wurden ebenfalls vorgeschlagen. Keine Grabung kann ein Zeltlager prüfen, und die Wahl beruht auf dem Verlauf der Route."
    - "Heute liegen die genannten Orte an der Straße durch das Wadi Araba zwischen dem Toten Meer und Akaba, auf beiden Seiten der israelisch-jordanischen Grenze: Wüste, Akazien und einige Quellen."
  fr:
    - "Oboth fut un campement d’Israël sur la dernière étape du voyage dans le désert. Après la mort d’Aaron sur le mont Hor, le peuple prit « le chemin de la mer Rouge, pour contourner le pays d’Édom », perdit courage et fut mordu par les serpents brûlants ; puis « les enfants d’Israël partirent, et ils campèrent à Oboth », et d’Oboth allèrent à Ijé-Abarim « dans le désert qui est vis-à-vis de Moab, vers le soleil levant ». L’itinéraire de Nombres 33 place Oboth entre Punon et Ijé-Abarim, « sur la frontière de Moab ». Le nom peut signifier « outres », bien que les mêmes lettres désignent les esprits des morts que la loi interdit de consulter ; rien dans le texte ne l’explique."
    - "La halte doit se trouver sur la route qui longe Édom par le sud, quelque part dans l’Araba ou à côté, puisque Punon est Feinan, le district du cuivre sur son bord oriental. Au-delà, la Bible ne donne rien. L’hypothèse courante depuis le XIXe siècle est l’oasis d’Aïn el-Weibeh, sur le côté ouest de l’Araba en face de Feinan, que la carte marque en premier ; Gharandal, la station romaine d’Arindéla dans les collines d’Édom, En Hazeva, le fort romain de Tamar, et Thélach ont aussi été proposés. Aucune fouille ne peut éprouver un campement de tentes, et le choix repose sur le tracé de la route."
    - "Aujourd’hui, les lieux nommés s’échelonnent le long de la route du Wadi Araba entre la mer Morte et Aqaba, de part et d’autre de la frontière israélo-jordanienne : désert, acacias et quelques sources."
scripture:
