# Overview article (ADR 0007). Mainstream facts only; the gate is placed on the east side by the palace and Temple as most do; the question whether Chronicles and Nehemiah mean the same gate is left open; the gate is said not to have been found.
id: horse-gate
place: af8b51e
title:
  en: "Horse Gate"
  ru: "Конские ворота"
  uk: "Кінські ворота"
  es: "Puerta de los Caballos"
  pt: "Porta dos Cavalos"
  de: "Rosstor"
  fr: "Porte des Chevaux"
  pl: "Brama Końska"
  it: "Porta dei Cavalli"
  nl: "Paardenpoort"
  cs: "Koňská brána"
  sv: "Hästporten"
  nb: "Hesteporten"
  tl: "Pintuang-bayan ng mga Kabayo"
  da: "Hesteporten"
  sr: "Коњска капија"
body:
  en:
    - "The Horse Gate was a gate on the east side of Jerusalem at the royal quarter, where the palace of the kings of Judah adjoined the Temple on the south, and it is named for the way by which the horses were brought into the palace. It is the scene of the death of Athaliah. When Jehoiada had crowned the boy Joash in the Temple, he ordered the usurping queen taken out of the sanctuary, “and when she was come to the entering of the horse gate by the king's house, they slew her there”; the parallel in Kings says she went “by the way by the which the horses came into the king's house”. Many take this for an entrance of the palace rather than a gate of the city wall."
    - "Nehemiah's wall had a Horse Gate on the same side. In his account of the rebuilding, after the tower that stood out from the king's upper house, “From above the horse gate repaired the priests, every one over against his house”: the priests lived there, below the Temple, and the gate opened eastward toward the Kidron. Jeremiah's promise of the city rebuilt runs the measuring line from the tower of Hananeel round to the Corner Gate and down “unto the brook of Kidron, unto the corner of the horse gate toward the east”, the whole to be “holy unto the LORD”. Whether the gate of Chronicles and the gate of Nehemiah are one and the same, or a palace gate and a city gate near it, is not settled, but both are usually placed at the south-east corner of the Temple and palace area."
    - "The gate has not been found. The ground is the Ophel, the slope between the City of David and the Temple Mount, where the Mazars uncovered buildings and a gatehouse of the First Temple period in 1986–1987 and Eilat Mazar dug again in 2009–2013; the Herodian retaining walls of the Temple Mount cover the rest. Today it is the Ophel archaeological garden below the south-east corner of the Haram, beside the road down to Silwan."
  ru:
    - "Конские ворота были воротами на восточной стороне Иерусалима у царского квартала, где дворец царей Иудиных примыкал к храму с юга, и названы они по пути, которым коней вводили во дворец. Это место смерти Гофолии. Когда Иодай помазал в храме отрока Иоаса, он велел вывести царицу-захватчицу из святилища, «и когда она пришла ко входу конских ворот царского дома, там умертвили ее»; параллельное место в книге Царств говорит, что она «прошла чрез вход конский к дому царскому». Многие видят здесь вход во дворец, а не ворота городской стены."
    - "В стене Неемии были Конские ворота на той же стороне. В его рассказе о восстановлении, после башни, выступавшей от верхнего царского дома, «далее ворот Конских чинили священники, каждый против своего дома»: священники жили там, ниже храма, и ворота открывались на восток, к Кедрону. Обетование Иеремии о восстановленном городе ведёт землемерную вервь от башни Анамеила к воротам угольным и вниз, «до потока Кедрона, до угла конских ворот к востоку», и всё это «будет святынею Господа». Одни ли это ворота у летописца и у Неемии или дворцовые ворота и городские рядом с ними, не решено, но и те и другие обычно помещают у юго-восточного угла храмовой и дворцовой площади."
    - "Ворота не найдены. Это Офел, склон между городом Давидовым и Храмовой горой, где Мазары в 1986–1987 годах открыли здания и привратное сооружение времён Первого храма, а Эйлат Мазар копала снова в 2009–2013 годах; остальное скрыто иродианскими подпорными стенами Храмовой горы. Сегодня это археологический сад Офел под юго-восточным углом Харама, у дороги вниз в Силуан."
  uk:
    - "Кінські ворота були воротами на східному боці Єрусалима біля царського кварталу, де палац царів Юди прилягав до храму з півдня, і названі за шляхом, яким коней вводили в палац. Це місце смерті Аталії. Коли Йодай увінчав хлопчика Йоаса в храмі, він наказав вивести узурпаторку з святилища, «але як вона прийшла до ввіходу кінської брами дому царського, то там вбили її»; паралельне місце в Книгах Царів каже, що вона пройшла «кінській увіход ід царській палатї». Багато хто вважає це входом до палацу, а не воротами міського муру."
    - "У мурі Неемії були Кінські ворота з того самого боку. В його оповіді про відбудову, після вежі, що виступала від верхнього царського дому, «Дальш від воріт Кінських лагодили сьвященники, кожний проти свого дому»: священики жили там, під храмом, і ворота відчинялися на схід, до Кедрону. Обіцянка Єремії про відбудоване місто веде вимірювальну лінію від вежі Хананела навколо до Наріжних воріт і вниз «до Кедрон-потока, до угла кінської брами ʼд сходові сонця», усе це мало бути «сьвяті Господеві». Чи ворота Хронік і ворота Неемії — одні й ті самі, чи палацові ворота й міські ворота поруч, не вирішено, але і ті, і другі зазвичай розміщують на південно-східному куті храмової та палацової ділянки."
    - "Ворота не знайдено. Місцевість — Офел, схил між Містом Давида і Храмовою горою, де Мазари відкрили будівлі й надбрамну споруду часів Першого храму в 1986–1987 роках, а Ейлат Мазар копала знову в 2009–2013 роках; іродіанські підпірні мури Храмової гори прикривають решту. Сьогодні це археологічний сад Офел під південно-східним кутом Харама, біля дороги вниз до Сільвана."
  es:
    - "La Puerta de los Caballos era una puerta del lado este de Jerusalén, en el barrio real, donde el palacio de los reyes de Judá lindaba por el sur con el Templo, y recibe su nombre del camino por el que se introducían los caballos en el palacio. Es el escenario de la muerte de Atalía. Cuando Joiada coronó al niño Joás en el Templo, ordenó sacar del santuario a la reina usurpadora, y «luego que hubo ella pasado la entrada de la puerta de los caballos de la casa del rey, allí la mataron»; el paralelo de Reyes dice que fue por «el camino por donde entran los de á caballo á la casa del rey». Muchos lo toman por una entrada del palacio más que por una puerta de la muralla de la ciudad."
    - "El muro de Nehemías tenía una Puerta de los Caballos en el mismo lado. En su relato de la reconstrucción, tras la torre que sobresalía de la casa alta del rey: «Desde la puerta de los Caballos restauraron los sacerdotes, cada uno enfrente de su casa»: los sacerdotes vivían allí, bajo el Templo, y la puerta se abría hacia el este, hacia el Cedrón. La promesa de Jeremías de la ciudad reedificada hace correr el cordel de medir desde la torre de Hananeel hasta la puerta de la Esquina y hacia abajo «hasta el arroyo de Cedrón, hasta la esquina de la puerta de los caballos al oriente», todo lo cual «será santo á Jehová». Si la puerta de Crónicas y la de Nehemías son una misma, o una puerta del palacio y una puerta de la ciudad próxima a ella, no está resuelto, pero ambas suelen situarse en el ángulo sudeste del área del Templo y el palacio."
    - "La puerta no se ha hallado. El terreno es el Ofel, la ladera entre la Ciudad de David y el monte del Templo, donde los Mazar sacaron a la luz edificios y una caseta de entrada de época del Primer Templo en 1986–1987 y Eilat Mazar excavó de nuevo en 2009–2013; los muros de contención herodianos del monte del Templo cubren el resto. Hoy es el jardín arqueológico del Ofel, bajo el ángulo sudeste del Haram, junto a la carretera que baja a Silwan."
  pt:
    - "A Porta dos Cavalos era uma porta no lado leste de Jerusalém, no quarteirão real, onde o palácio dos reis de Judá confinava com o Templo ao sul, e é assim chamada pelo caminho por onde os cavalos eram levados ao palácio. É o cenário da morte de Atalia. Quando Joiada coroou o menino Joás no Templo, mandou tirar do santuário a rainha usurpadora; “Ela foi até a entrada da porta dos cavalos para a casa do rei; e eles a mataram lá”; o paralelo em Reis diz que ela foi “pelo caminho da entrada dos cavalos para a casa do rei”. Muitos tomam isso por uma entrada do palácio e não por uma porta da muralha da cidade."
    - "A muralha de Neemias tinha uma Porta dos Cavalos no mesmo lado. Em seu relato da reconstrução, depois da torre que se projetava da casa superior do rei, “Acima da Porta dos Cavalos, os sacerdotes fizeram reparos, cada um em frente à sua própria casa”: os sacerdotes moravam ali, abaixo do Templo, e a porta se abria para o leste, rumo ao Cedrom. A promessa de Jeremias da cidade reconstruída leva a linha de medir da torre de Hananeel até a Porta da Esquina e abaixo “até o ribeiro de Cedrom, até a esquina da porta dos cavalos em direção ao leste”, e todos esses campos “serão santos para o SENHOR”. Se a porta de Crônicas e a porta de Neemias são uma só, ou uma porta do palácio e uma porta da cidade perto dela, não está resolvido, mas ambas são geralmente situadas no canto sudeste da área do Templo e do palácio."
    - "A porta não foi encontrada. O terreno é o Ofel, a encosta entre a Cidade de Davi e o monte do Templo, onde os Mazar trouxeram à luz edifícios e uma casa de portão do período do Primeiro Templo em 1986–1987 e Eilat Mazar escavou de novo em 2009–2013; os muros de arrimo herodianos do monte do Templo cobrem o resto. Hoje é o jardim arqueológico do Ofel abaixo do canto sudeste do Haram, junto à estrada que desce a Silwan."
  de:
    - "Das Rosstor war ein Tor an der Ostseite Jerusalems beim Königsviertel, wo der Palast der Könige von Juda im Süden an den Tempel grenzte, und es ist nach dem Weg benannt, auf dem die Pferde in den Palast geführt wurden. Es ist der Schauplatz von Ataljas Tod. Als Jojada den Knaben Joas im Tempel gekrönt hatte, ließ er die widerrechtliche Königin aus dem Heiligtum führen, „und da sie kam zum Eingang des Roßtors am Hause des Königs, töteten sie sie daselbst“; der Parallelbericht der Königsbücher sagt, sie sei „des Weges, da die Rosse zum Hause des Königs gehen“ hineingegangen. Viele halten dies eher für einen Palasteingang als für ein Tor der Stadtmauer."
    - "Nehemias Mauer hatte auf derselben Seite ein Rosstor. In seinem Bericht über den Wiederaufbau heißt es nach dem Turm, der vom oberen Haus des Königs vorsprang: „Aber vom Roßtor an bauten die Priester, ein jeglicher gegenüber seinem Hause“: Die Priester wohnten dort, unterhalb des Tempels, und das Tor öffnete sich ostwärts zum Kidron. Jeremias Verheißung der wiederaufgebauten Stadt führt die Messschnur vom Turm Hananeel zum Ecktor und hinab „bis an den Bach Kidron, bis zur Ecke am Roßtor gegen Morgen“, das Ganze werde „dem Herrn heilig sein“. Ob das Tor der Chronik und das Tor Nehemias ein und dasselbe sind oder ein Palasttor und ein nahes Stadttor, ist nicht entschieden, doch beide werden meist an der Südostecke des Tempel- und Palastbereichs angesetzt."
    - "Das Tor ist nicht gefunden. Das Gelände ist der Ofel, der Hang zwischen der Stadt Davids und dem Tempelberg, wo die Mazars 1986–1987 Gebäude und ein Torhaus der Zeit des Ersten Tempels freilegten und Eilat Mazar 2009–2013 erneut grub; die herodianischen Stützmauern des Tempelbergs bedecken den Rest. Heute ist es der archäologische Garten des Ofel unter der Südostecke des Haram, neben der Straße hinab nach Silwan."
  fr:
    - "La porte des Chevaux était une porte du côté est de Jérusalem, au quartier royal, là où le palais des rois de Juda touchait le Temple au sud, et elle tire son nom du chemin par lequel on faisait entrer les chevaux dans le palais. C’est le lieu de la mort d’Athalie. Quand Jehojada eut couronné l’enfant Joas dans le Temple, il ordonna de sortir la reine usurpatrice du sanctuaire, et « elle se rendit à la maison du roi par l’entrée de la porte des chevaux : c’est là qu’ils lui donnèrent la mort » ; le parallèle des Rois dit qu’elle alla « par le chemin de l’entrée des chevaux ». Beaucoup y voient une entrée du palais plutôt qu’une porte du rempart de la ville."
    - "Le mur de Néhémie avait une porte des Chevaux du même côté. Dans son récit de la reconstruction, après la tour qui faisait saillie de la maison supérieure du roi : « Au-dessus de la porte des chevaux, les sacrificateurs travaillèrent chacun devant sa maison » : les prêtres y habitaient, au-dessous du Temple, et la porte s’ouvrait à l’est vers le Cédron. La promesse de Jérémie sur la ville rebâtie fait courir le cordeau de la tour de Hananeel à la porte de l’angle, puis « jusqu’au torrent de Cédron, jusqu’à l’angle de la porte des chevaux à l’orient », tous ces champs « seront consacrés à l’Éternel ». On ne tranche pas si la porte des Chroniques et celle de Néhémie sont une seule et même porte, ou une porte du palais et une porte de la ville voisine, mais on place d’ordinaire les deux à l’angle sud-est de l’aire du Temple et du palais."
    - "La porte n’a pas été retrouvée. Le terrain est l’Ophel, la pente entre la Cité de David et le mont du Temple, où les Mazar mirent au jour des bâtiments et une porterie de la période du Premier Temple en 1986–1987 et où Eilat Mazar fouilla de nouveau en 2009–2013 ; les murs de soutènement hérodiens du mont du Temple couvrent le reste. C’est aujourd’hui le jardin archéologique de l’Ophel, sous l’angle sud-est du Haram, à côté de la route qui descend vers Silwan."
  pl:
    - "Brama Końska była bramą po wschodniej stronie Jerozolimy w dzielnicy królewskiej, gdzie pałac królów Judy przylegał do Świątyni od południa, i nazwano ją od drogi, którą wprowadzano konie do pałacu. Jest sceną śmierci Atalii. Gdy Jojada ukoronował chłopca Joasza w Świątyni, kazał wyprowadzić uzurpatorkę z sanktuarium, „gdy przyszła ku wejściu bramy, którą wodzono konie do domu królewskiego, tamże ją zabili”; odpowiednik w Księgach Królewskich mówi, że przyszła „na drogę, którą wodzono konie do domu królewskiego”. Wielu uważa to za wejście do pałacu, a nie bramę muru miejskiego."
    - "Mur Nehemiasza miał Bramę Końską po tej samej stronie. W jego opisie odbudowy, po wieży wystającej z górnego domu króla: „Od bramy końskiej poprawiali kapłani, każdy przeciw domowi swemu”: kapłani mieszkali tam, poniżej Świątyni, a brama otwierała się na wschód ku Cedronowi. Obietnica Jeremiasza o odbudowanym mieście wiedzie linię mierniczą od wieży Chananeel przez Bramę Narożną w dół „aż do potoku Cedron, aż do węgła bramy końskiej wschodniej”, a o całym tym obszarze powiedziano: „poświęcone będą Panu”. Czy brama z Kronik i brama Nehemiasza to ta sama, czy brama pałacowa i pobliska brama miejska, nie jest rozstrzygnięte, ale obie zwykle umieszcza się w południowo-wschodnim narożniku terenu Świątyni i pałacu."
    - "Bramy nie odnaleziono. Teren to Ofel, stok między Miastem Dawida a Wzgórzem Świątynnym, gdzie Mazarowie odsłonili w latach 1986–1987 budynki i budynek bramny z okresu Pierwszej Świątyni, a Eilat Mazar prowadziła wykopaliska ponownie w latach 2009–2013; herodiańskie mury oporowe Wzgórza Świątynnego pokrywają resztę. Dziś jest to ogród archeologiczny Ofel poniżej południowo-wschodniego narożnika Haramu, obok drogi w dół do Silwanu."
  it:
    - "La Porta dei Cavalli era una porta sul lato orientale di Gerusalemme nel quartiere regio, dove il palazzo dei re di Giuda confinava a sud con il Tempio, e prende il nome dalla via per cui i cavalli erano condotti nel palazzo. È la scena della morte di Atalia. Quando Ioiada ebbe incoronato nel Tempio il fanciullo Ioas, ordinò di portare la regina usurpatrice fuori del santuario, ed «ella giunse alla casa del re per la strada della porta dei cavalli; e quivi fu uccisa»; il passo parallelo dei Re dice la stessa cosa. Molti la intendono come un ingresso del palazzo piuttosto che una porta delle mura della città."
    - "Le mura di Neemia avevano una Porta dei Cavalli sullo stesso lato. Nel suo racconto della ricostruzione, dopo la torre che sporgeva dalla casa superiore del re, «I sacerdoti lavorarono alle riparazioni al disopra della porta de’ Cavalli, ciascuno dirimpetto alla propria casa»: i sacerdoti vi abitavano, sotto il Tempio, e la porta si apriva a oriente verso il Cedron. La promessa di Geremia della città ricostruita fa correre la corda per misurare dalla torre di Hananeel alla Porta dell’Angolo e giù «fino al torrente di Kidron, fino all’angolo della porta de’ cavalli verso oriente», il tutto destinato a essere «consacrato all’Eterno». Se la porta delle Cronache e quella di Neemia siano la stessa, o una porta del palazzo e una della città vicina, non è stabilito, ma entrambe sono di solito collocate all’angolo sud-orientale dell’area del Tempio e del palazzo."
    - "La porta non è stata trovata. Il terreno è l’Ofel, il pendio fra la Città di Davide e il Monte del Tempio, dove i Mazar portarono alla luce edifici e un ingresso fortificato del periodo del Primo Tempio nel 1986–1987 e Eilat Mazar scavò di nuovo nel 2009–2013; i muri di contenimento erodiani del Monte del Tempio coprono il resto. Oggi è il giardino archeologico dell’Ofel sotto l’angolo sud-orientale dell’Haram, accanto alla strada che scende a Silwan."
  nl:
    - "De Paardenpoort was een poort aan de oostkant van Jeruzalem bij de koninklijke wijk, waar het paleis van de koningen van Juda in het zuiden aan de tempel grensde, en zij is genoemd naar de weg waarlangs de paarden het paleis werden binnengebracht. Hier vond Atalia de dood. Toen Jojada de jonge Joas in de tempel had gekroond, gebood hij de usurpatorkoningin uit het heiligdom te halen, en “zij ging naar den ingang van de Paardenpoort, naar het huis des konings; en zij doodden ze daar”; de parallel in Koningen zegt dat zij “den weg van den ingang der paarden naar het huis des konings” ging. Velen houden dit voor een ingang van het paleis eerder dan een poort van de stadsmuur."
    - "Nehemia’s muur had aan dezelfde kant een Paardenpoort. In zijn verslag van de herbouw, na de toren die uitstak vanaf het bovenhuis van de koning, staat: “Van boven de Paardenpoort verbeterden de priesteren, een iegelijk tegenover zijn huis”: de priesters woonden daar, onder de tempel, en de poort opende naar het oosten, richting de Kidron. Jeremia’s belofte van de herbouwde stad laat het meetsnoer lopen van de toren Hananeel rond naar de Hoekpoort en omlaag “tot aan de beek Kidron, tot aan den hoek van de Paardenpoort tegen het oosten”, alles “den HEERE een heiligheid”. Of de poort van Kronieken en die van Nehemia één en dezelfde zijn, of een paleispoort en een stadspoort daarbij, is niet beslist, maar beide worden gewoonlijk op de zuidoostelijke hoek van het tempel- en paleisgebied geplaatst."
    - "De poort is niet gevonden. Het terrein is de Ofel, de helling tussen de Stad van David en de Tempelberg, waar de Mazars in 1986–1987 gebouwen en een poortgebouw uit de tijd van de Eerste Tempel blootlegden en Eilat Mazar in 2009–2013 opnieuw groef; de Herodiaanse keermuren van de Tempelberg bedekken de rest. Nu is het de archeologische tuin van de Ofel onder de zuidoostelijke hoek van de Haram, naast de weg omlaag naar Silwan."
  cs:
    - "Koňská brána byla branou na východní straně Jeruzaléma u královské čtvrti, kde palác judských králů sousedil na jihu s chrámem, a je pojmenována podle cesty, jíž se koně vodili do paláce. Je dějištěm smrti Atalji. Když Jojada korunoval chlapce Joaše v chrámu, nařídil vyvést uzurpující královnu ze svatyně a „šla, kudy se chodí k bráně koňské k domu královskému, a tu ji zabili“; paralela v Královských praví, že šla „kudy koni vcházejí do domu královského“. Mnozí to pokládají spíše za vchod do paláce než za bránu městské hradby."
    - "Nehemjášova hradba měla Koňskou bránu na téže straně. V jeho vyprávění o obnově, po věži vystupující z horního domu královského, „Od brány koňské opravovali kněží, jeden každý naproti domu svému“: kněží tam bydleli, pod chrámem, a brána se otevírala k východu ke Kidronu. Jeremjášův slib o znovuvystavěném městě vede měřicí šňůru od věže Chananeel k Rohové bráně a dolů „až ku potoku Cedron, až k úhlu brány východní koňské“, a o všem se praví, že „posvěcené bude Hospodinu“. Zda brána z Letopisů a brána z Nehemjáše jsou jedna a táž, nebo palácová brána a městská brána poblíž, není rozhodnuto, ale obě se obvykle kladou na jihovýchodní roh oblasti chrámu a paláce."
    - "Brána nebyla nalezena. Půda je Ofel, svah mezi Městem Davidovým a Chrámovou horou, kde Mazarové odkryli roku 1986–1987 budovy a vrátnici z doby Prvního chrámu a Ejlat Mazar kopala znovu v letech 2009–2013; herodiánské opěrné zdi Chrámové hory kryjí zbytek. Dnes je to archeologická zahrada Ofel pod jihovýchodním rohem Haramu, vedle cesty dolů do Silwánu."
  sv:
    - "Hästporten var en port på Jerusalems östra sida vid kungakvarteret, där Judas kungars palats gränsade till templet i söder, och den är uppkallad efter vägen på vilken hästarna fördes in i palatset. Det är skådeplatsen för Ataljas död. När Jojada hade krönt pojken Joash i templet lät han föra den usurpatoriska drottningen ut ur helgedomen, och ”när hon hade kommit fram dit där Hästporten för in i konungshuset, dödade de henne där”; parallellstället i Kungaboken säger att hon kom ”till den plats där hästarna plägade föras in i konungshuset”. Många tar detta för en ingång till palatset snarare än en port i stadsmuren."
    - "Nehemjas mur hade en Hästport på samma sida. I hans berättelse om återuppbyggnaden, efter tornet som sköt ut från det övre konungshuset, står det: ”Ovanför Hästporten arbetade prästerna, var och en mitt emot sitt eget hus”: prästerna bodde där, nedanför templet, och porten öppnade sig österut mot Kidron. Jeremias löfte om den återuppbyggda staden drar mätsnöret från Hananeltornet runt till Hörnporten och ned ”intill bäcken Kidron och intill hörnet vid Hästporten österut”, allt ”helgade åt HERREN”. Om Krönikebokens port och Nehemjas port är en och samma, eller en palatsport och en stadsport nära den, är inte avgjort, men båda placeras vanligen vid sydöstra hörnet av tempel- och palatsområdet."
    - "Porten har inte hittats. Marken är Ofel, sluttningen mellan Davids stad och Tempelberget, där familjen Mazar frilade byggnader och en portbyggnad från första tempelperioden 1986–1987 och Eilat Mazar grävde igen 2009–2013; Tempelbergets herodianska stödmurar täcker resten. I dag är det den arkeologiska trädgården Ofel nedanför sydöstra hörnet av Haram, intill vägen ned till Silwan."
  nb:
    - "Hesteporten var en port på østsiden av Jerusalem ved kongekvarteret, der palasset til Judas konger grenset til tempelet i sør, og den er oppkalt etter veien hestene ble ført inn i palasset. Den er åstedet for Ataljas død. Da Jojada hadde kronet gutten Joasj i tempelet, beordret han den usurperende dronningen ført ut av helligdommen, og «da hun kom dit hvor Hesteporten fører inn til kongens hus, drepte de henne»; parallellen i Kongebøkene sier at hun gikk «den vei som hestene pleier å kjøre inn til kongens hus». Mange tar dette for en inngang til palasset snarere enn en port i bymuren."
    - "Nehemjas mur hadde en Hesteport på samme side. I hans beretning om gjenoppbyggingen, etter tårnet som sprang fram fra kongens øvre hus: «Ovenfor Hesteporten arbeidet prestene, hver av dem midt imot sitt eget hus»: prestene bodde der, under tempelet, og porten åpnet seg østover mot Kedron. Jeremias løfte om byen gjenreist lar målesnoren løpe fra Hananel-tårnet rundt til Hjørneporten og ned «like til Kedrons bekk, til Hesteportens hjørne mot øst», alle markene skal være «hellige for Herren». Om porten i Krønikebøkene og porten hos Nehemja er den samme, eller en palassport og en byport i nærheten, er ikke avgjort, men begge plasseres vanligvis i sørøsthjørnet av tempel- og palassområdet."
    - "Porten er ikke funnet. Grunnen er Ofel, skråningen mellom Davidsbyen og Tempelberget, der ekteparet Mazar avdekket bygninger og et portbygg fra første tempels tid i 1986–1987 og Eilat Mazar gravde igjen i 2009–2013; Tempelbergets herodianske støttemurer dekker resten. I dag er det den arkeologiske hagen på Ofel under sørøsthjørnet av Haram, ved veien ned til Silwan."
  tl:
    - "Ang Pintuang-bayan ng mga Kabayo ay isang pintuan sa silangang panig ng Jerusalem sa maharlikang kuwarter, kung saan ang palasyo ng mga hari ng Juda ay katabi ng Templo sa timog, at ipinangalan ito sa daang pinagdadaanan ng mga kabayo papasok sa palasyo. Dito namatay si Athalia. Nang koronahan ni Joiada ang batang si Joas sa Templo, iniutos niyang ilabas sa santuwaryo ang mang-aagaw na reyna, “at siya'y naparoon sa pasukan ng pintuang-daan ng kabayo sa bahay ng hari: at pinatay nila siya roon”; sinasabi ng kahambing sa Mga Hari na siya'y naparoon “sa daan na pinapasukan ng mga kabayo sa bahay ng hari”. Inaakala ng marami na ito ay pasukan ng palasyo sa halip na pintuan ng pader ng lungsod."
    - "May Pintuang-bayan ng mga Kabayo rin ang pader ni Nehemias sa gayunding panig. Sa muling pagtatayo, pagkatapos ng tore mula sa itaas na bahay ng hari, “Sa itaas ng pintuang-bayan ng mga kabayo, mga saserdote ang naghusay na bawa't isa'y sa tapat ng kaniyang sariling bahay”: nakatira doon ang mga saserdote, sa ibaba ng Templo, at bukas ito sa silangan patungong Cedron. Sa pangako ni Jeremias, umaabot ang panukat na pisi ng muling itinayong lungsod mula sa tore ng Hananeel hanggang sa Pintuang-bayan sa Sulok at pababa “hanggang sa batis ng Cedron, hanggang sa sulok ng pintuang-bayan ng kabayo sa dakong silanganan”, na lahat ay magiging “banal sa Panginoon”. Hindi mapagpasyahan kung iisa ang pintuan ng Mga Cronica at ang kay Nehemias, o pintuan ng palasyo at ng lungsod na magkalapit, ngunit karaniwang inilalagay ang dalawa sa timog-silangang sulok ng Templo at palasyo."
    - "Hindi pa natatagpuan ang pintuan. Ang lupain ay ang Ophel, ang dalisdis sa pagitan ng Bayan ni David at ng Bundok ng Templo, kung saan nahukay ng mga Mazar ang mga gusali at isang gatehouse mula sa panahon ng Unang Templo noong 1986–1987 at muling humukay si Eilat Mazar noong 2009–2013; ang mga pader na pang-ayuda ni Herodes ng Bundok ng Templo ang tumatakip sa iba pa. Ngayon ito ang hardin arkeolohiko ng Ophel sa ibaba ng timog-silangang sulok ng Haram, sa tabi ng daan pababa sa Silwan."
  da:
    - "Hesteporten var en port på Jerusalems østside ved det kongelige kvarter, hvor judæerkongernes palads grænsede op til templet mod syd, og den er opkaldt efter den vej, ad hvilken hestene blev ført ind i paladset. Her døde Atalja. Da Jojada havde kronet drengen Joas i templet, befalede han den usurperende dronning ført ud af helligdommen, »og hun kom til Indgangen til Hesteporten ved Kongens Hus, og de dræbte hende der«; parallelstedet i Kongebøgerne siger, at hun »gik den Vej, ad hvilken Hestene gaa til Kongens Hus«. Mange tager dette for en indgang til paladset snarere end en port i bymuren."
    - "Nehemias' mur havde en Hesteport på samme side. I hans beretning om genopbygningen, efter tårnet, der sprang frem fra kongens høje hus: »Fra Hesteporten istandsatte Præsterne et Stykke, hver tværs over for sit Hus«: præsterne boede dér, under templet, og porten åbnede sig mod øst mod Kedron. Jeremias' løfte om den genopbyggede by lader målesnoren løbe fra Hananels tårn rundt til Hjørneporten og ned »indtil Kedrons Bæk, indtil Hesteportens Hjørne imod Østen skal være Herren en Helligdom«. Om Krønikebøgernes port og Nehemias' port er den samme, eller en paladsport og en byport nær den, er ikke afgjort, men begge placeres sædvanligvis i sydøsthjørnet af tempel- og paladsområdet."
    - "Porten er ikke fundet. Stedet er Ofel, skråningen mellem Davidsbyen og Tempelbjerget, hvor Mazar-familien afdækkede bygninger og et porthus fra Første Tempels tid i 1986–1987, og Eilat Mazar gravede igen i 2009–2013; Tempelbjergets herodianske støttemure dækker resten. I dag er det Ofel-arkæologihaven under Haram'ens sydøsthjørne, ved siden af vejen ned til Silwan."
  sr:
    - "Коњска капија била је капија на источној страни Јерусалима у краљевској четврти, где је палата јудејских царева додиривала Храм с југа, и названа је по путу којим су коњи вођени у палату. То је позорница смрти Готолије. Пошто је Јодај крунисао дечака Јоаса у Храму, наредио је да се узурпаторка изведе из светилишта, „те отиде како се иде вратима коњским у дом царев, и онде је погубише“; паралела у Царевима каже да је стигла „на пут којим се иде у дом царски коњским вратима“. Многи то узимају за улаз палате, а не за капију градског зида."
    - "Немијин зид имао је Коњску капију на истој страни. У његовом извештају о обнови, после куле која је излазила из царевог горњег дома: „Од врата коњских поправљаше свештеници сваки према својој кући“: свештеници су ту живели, испод Храма, а капија се отварала на исток према Кедрону. Јеремијино обећање обновљеног града води мерачко уже од куле Ананеилове око до Угаоне капије и доле „до потока Кедрона, до угла коњских врата к истоку“, и све то ће „бити светиња Господу“. Да ли су капија из Летописа и капија из Немије једно исто, или палатна капија и градска капија близу ње, није решено, али се обе обично смештају на југоисточни угао Храма и палате."
    - "Капија није пронађена. Тло је Офел, падина између Давидовог града и Храмовне горе, где су Мазарови открили зграде и капијско здање из доба Првог храма 1986–1987, а Елат Мазар поново копала 2009–2013; Иродови потпорни зидови Храмовне горе покривају остало. Данас је то археолошки врт Офел испод југоисточног угла Харама, поред пута доле у Силван."
