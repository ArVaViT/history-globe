body:
  en:
    - 'Emmaus is the village to which two disciples walked on the day of the resurrection, "a village called Emmaus, which was from Jerusalem about threescore furlongs". Its site is disputed. Most manuscripts of Luke give sixty stadia, about 11 km; some, among them Codex Sinaiticus, give 160, about 30 km. Four places are most often named: Emmaus-Nicopolis (Imwas) near Latrun, the Emmaus of the ancient church; Abu Ghosh on the road west to the coast, held to be Emmaus from the twelfth century; el-Qubeibeh to the north-west, so held from the later Middle Ages; and Motza, west of Jerusalem, where the map point stands.'
    - "Emmaus-Nicopolis lay where the road from the coastal plain begins to climb towards Jerusalem, and it was the Emmaus of the Maccabean and Roman wars. About 165 BC Judas Maccabeus defeated a Seleucid army camped there. In 43 BC Cassius sold its people into slavery when the levy he demanded was slow to come in, and in 4 BC the Roman governor Varus burned the town after its inhabitants had fled."
    - 'In Luke''s account one of the two travellers is named Cleopas. Jesus joined them on the road unrecognised and opened the Scriptures to them. At the village they urged him to stay, "for it is toward evening, and the day is far spent"; as he blessed and broke the bread "their eyes were opened, and they knew him; and he vanished out of their sight". The same hour they returned to Jerusalem and found the eleven.'
    - "In AD 68 Vespasian camped at Emmaus and left the Fifth Legion there. After the war, Josephus says, he gave land to 800 discharged soldiers at a place called Ammaus, 30 stadia from Jerusalem in the standard Greek text (some manuscripts read 60); many identify it with Motza, the Mozah of Joshua's list, whose later name Qalunya is thought to recall the Latin colonia. About 221 Emmaus-Nicopolis became a city named Nicopolis after an embassy led by Julius Africanus. Eusebius took it for the home of Cleopas, and Jerome, telling of Paula's visit in the 380s, writes that the Lord, known there in the breaking of bread, made the house of Cleopas a church. Remains of a Byzantine church still stand at Imwas."
  ru:
    - "Эммаус — селение, в которое в день воскресения шли двое учеников: «в селение, отстоящее стадий на шестьдесят от Иерусалима, называемое Эммаус». Его местоположение спорно. Большинство рукописей Евангелия от Луки дают шестьдесят стадий, около 11 км; некоторые, в том числе Синайский кодекс, — 160, около 30 км. Чаще всего называют четыре места: Эммаус-Никополь (Имвас) у Латруна — Эммаус древней Церкви; Абу-Гош на дороге к побережью, который считали Эммаусом с XII века; эль-Кубейбу к северо-западу, которую так называли с позднего Средневековья; и Моцу к западу от Иерусалима, где стоит точка на карте."
    - "Эммаус-Никополь лежал там, где дорога с прибрежной равнины начинает подниматься к Иерусалиму, и именно он был Эммаусом Маккавейских и римских войн. Около 165 г. до н. э. Иуда Маккавей разбил стоявшее здесь селевкидское войско. В 43 г. до н. э. Кассий продал его жителей в рабство, когда требуемая им подать поступала слишком медленно, а в 4 г. до н. э. римский наместник Вар сжёг город, жители которого бежали."
    - "По рассказу Луки, одного из двух путников звали Клеопа. Иисус, не узнанный ими, присоединился к ним в дороге и изъяснял им Писание. У селения они упросили Его остаться, «потому что день уже склонился к вечеру»; когда Он благословил и преломил хлеб, «открылись у них глаза, и они узнали Его. Но Он стал невидим для них». В тот же час они возвратились в Иерусалим и нашли вместе одиннадцать апостолов."
    - "В 68 г. н. э. Веспасиан стал лагерем у Эммауса и оставил там Пятый легион. После войны, по словам Иосифа Флавия, он дал землю 800 отпущенным воинам в месте под названием Аммаус, в 30 стадиях от Иерусалима по принятому греческому тексту (в некоторых рукописях — 60); многие отождествляют его с Моцой из списка книги Иисуса Навина, позднее название которой, Калуния, по-видимому, восходит к латинскому colonia. Около 221 г. Эммаус-Никополь стал городом Никополем после посольства во главе с Юлием Африканом. Евсевий считал его родиной Клеопы, а Иероним, рассказывая о том, как Павла пришла сюда в 380-х гг., пишет, что Господь, узнанный здесь в преломлении хлеба, освятил дом Клеопы как церковь. Развалины византийской церкви и сейчас стоят в Имвасе."
  uk:
    - "Еммаус — село, до якого йшли двоє учнів у день воскресіння, «на село, зване Емаус, гоней з шістьдесять од Єрусалиму». Його місце є спірним. Більшість рукописів Луки подають шістдесят стадій, близько 11 км; деякі, серед них Синайський кодекс, подають 160, близько 30 км. Найчастіше називають чотири місця: Еммаус-Нікополь (Імвас) поблизу Латруну, Еммаус давньої Церкви; Абу-Гош на дорозі на захід до узбережжя, який вважають Еммаусом з XII ст.; ель-Кубейбе на північному заході, так вважаний з пізнього Середньовіччя; і Моца, на захід від Єрусалима, де стоїть точка на мапі."
    - "Еммаус-Нікополь лежав там, де дорога з прибережної рівнини починає підійматися до Єрусалима, і був Еммаусом макавейських і римських воєн. Близько 165 р. до н. е. Юда Макавей розбив там селевкідське військо, що стояло табором. У 43 р. до н. е. Кассій продав його мешканців у рабство, коли вимагана ним подать надходила повільно, а в 4 р. до н. е. римський намісник Вар спалив місто після того, як його мешканці втекли."
    - "В оповіді Луки одного з двох мандрівників названо Клеопою. Ісус приєднався до них на дорозі невпізнаним і відкрив їм Писання. У селі вони вмовляли Його лишитися, «бо вже надвечір, і нахилив ся день»; коли Він благословив і переломив хліб, «Їм же відкрились очі, й пізнали вони Його; й став ся Він невидимий їм». Тієї ж години вони повернулися до Єрусалима й знайшли одинадцятьох."
    - "У 68 р. н. е. Веспасіан отаборився в Еммаусі й залишив там П'ятий легіон. Після війни, каже Йосиф Флавій, він дав землю 800 демобілізованим воїнам у місці, званому Аммаус, за 30 стадій від Єрусалима в стандартному грецькому тексті (деякі рукописи читають 60); багато хто ототожнює його з Моцою, Моцою зі списку Ісуса Навина, чия пізніша назва Калунія, як вважають, нагадує латинське colonia. Близько 221 р. Еммаус-Нікополь став містом, названим Нікополем після посольства, очоленого Юлієм Африканом. Євсевій вважав його домом Клеопи, а Ієронім, розповідаючи про відвідини Павли в 380-х рр., пише, що Господь, пізнаний там у ламанні хліба, зробив дім Клеопи церквою. Рештки візантійської церкви досі стоять в Імвасі."
  es:
    - "Emaús es la aldea a la que caminaron dos discípulos el día de la resurrección, «una aldea que estaba de Jerusalem sesenta estadios, llamada Emmaús». Su emplazamiento es objeto de debate. La mayoría de los manuscritos de Lucas dan sesenta estadios, unos 11 km; algunos, entre ellos el Códice Sinaítico, dan 160, unos 30 km. Cuatro lugares se nombran con más frecuencia: Emaús-Nicópolis (Imwas), cerca de Latrun, el Emaús de la Iglesia antigua; Abu Ghosh, en el camino al oeste hacia la costa, tenido por Emaús desde el siglo XII; el-Qubeibeh, al noroeste, así tenido desde la baja Edad Media; y Motza, al oeste de Jerusalén, donde está el punto del mapa."
    - "Emaús-Nicópolis se hallaba donde el camino de la llanura costera empieza a subir hacia Jerusalén, y era el Emaús de las guerras macabeas y romanas. Hacia el 165 a. C. Judas Macabeo derrotó allí a un ejército seléucida acampado. En el 43 a. C. Casio vendió como esclavos a sus habitantes cuando el tributo que exigió tardó en llegar, y en el 4 a. C. el gobernador romano Varo quemó la ciudad después de que sus habitantes huyeran."
    - "En el relato de Lucas, uno de los dos viajeros se llama Cleofas. Jesús se unió a ellos en el camino sin ser reconocido y les abrió las Escrituras. En la aldea le instaron a quedarse, «porque se hace tarde, y el día ya ha declinado»; cuando bendijo y partió el pan, «entonces fueron abiertos los ojos de ellos, y le conocieron; mas él se desapareció de los ojos de ellos». En la misma hora volvieron a Jerusalén y hallaron a los once."
    - "En el 68 d. C. Vespasiano acampó en Emaús y dejó allí la Legión V. Después de la guerra, dice Josefo, dio tierras a 800 soldados licenciados en un lugar llamado Ammaus, a 30 estadios de Jerusalén según el texto griego estándar (algunos manuscritos leen 60); muchos lo identifican con Motza, la Mosa de la lista de Josué, cuyo nombre posterior, Qalunya, se piensa que recuerda el latín colonia. Hacia el 221 Emaús-Nicópolis pasó a ser una ciudad llamada Nicópolis tras una embajada dirigida por Julio Africano. Eusebio la tomó por la patria de Cleofas, y Jerónimo, al contar la visita de Paula en la década del 380, escribe que el Señor, conocido allí en el partir del pan, hizo de la casa de Cleofas una iglesia. Restos de una iglesia bizantina siguen en pie en Imwas."
  pt:
    - "Emaús é a aldeia para onde dois discípulos caminharam no dia da ressurreição, “uma aldeia chamada Emaús, que ficava a sessenta estádios de Jerusalém”. Seu local é disputado. A maioria dos manuscritos de Lucas dá sessenta estádios, cerca de 11 km; alguns, entre eles o Códice Sinaítico, dão 160, cerca de 30 km. Quatro lugares são mais citados: Emaús-Nicópolis (Imwas), perto de Latrun, a Emaús da igreja antiga; Abu Ghosh, na estrada para o oeste, rumo à costa, tida por Emaús desde o século XII; el-Qubeibeh, a noroeste, assim tida desde o fim da Idade Média; e Motza, a oeste de Jerusalém, onde está o ponto do mapa."
    - "Emaús-Nicópolis ficava onde a estrada da planície costeira começa a subir para Jerusalém, e era a Emaús das guerras macabaicas e romanas. Por volta de 165 a.C., Judas Macabeu derrotou ali um exército selêucida acampado. Em 43 a.C., Cássio vendeu seu povo como escravo quando o tributo que exigira tardou a chegar, e em 4 a.C. o governador romano Varo queimou a cidade depois que os habitantes fugiram."
    - "No relato de Lucas, um dos dois viajantes se chama Cleopas. Jesus juntou-se a eles no caminho sem ser reconhecido e abriu-lhes as Escrituras. Na aldeia, insistiram com ele que ficasse: “pois já é quase noite, e o dia está quase no fim”; quando ele abençoou e partiu o pão, “Os olhos deles foram abertos e eles o reconheceram; então ele desapareceu da vista deles”. Na mesma hora voltaram a Jerusalém e encontraram os onze."
    - "Em 68 d.C., Vespasiano acampou em Emaús e deixou ali a Quinta Legião. Depois da guerra, diz Josefo, deu terras a 800 soldados dispensados num lugar chamado Ammaus, a 30 estádios de Jerusalém no texto grego padrão (alguns manuscritos leem 60); muitos o identificam com Motza, a Mozá da lista de Josué, cujo nome posterior, Qalunya, se pensa lembrar o latim colonia. Por volta de 221, Emaús-Nicópolis tornou-se uma cidade chamada Nicópolis, após uma embaixada chefiada por Júlio Africano. Eusébio a tomou pela casa de Cleopas, e Jerônimo, ao contar a visita de Paula na década de 380, escreve que o Senhor, ali reconhecido no partir do pão, fez da casa de Cleopas uma igreja. Restos de uma igreja bizantina ainda se erguem em Imwas."
  de:
    - "Emmaus ist das Dorf, zu dem am Tag der Auferstehung zwei Jünger gingen, „in einen Flecken, der war von Jerusalem sechzig Feld Wegs weit; des Name heißt Emmaus“. Seine Lage ist umstritten. Die meisten Handschriften des Lukas geben sechzig Stadien an, etwa 11 km; einige, darunter der Codex Sinaiticus, geben 160 an, etwa 30 km. Vier Orte werden am häufigsten genannt: Emmaus-Nikopolis (Imwas) bei Latrun, das Emmaus der alten Kirche; Abu Ghosh an der Straße nach Westen zur Küste, seit dem 12. Jahrhundert für Emmaus gehalten; el-Qubeibeh im Nordwesten, seit dem späteren Mittelalter so gehalten; und Motza westlich von Jerusalem, wo der Punkt der Karte steht."
    - "Emmaus-Nikopolis lag dort, wo die Straße aus der Küstenebene zu steigen beginnt in Richtung Jerusalem, und es war das Emmaus der makkabäischen und römischen Kriege. Um 165 v. Chr. besiegte Judas Makkabäus dort ein lagerndes seleukidisches Heer. Im Jahr 43 v. Chr. verkaufte Cassius seine Bewohner in die Sklaverei, als die von ihm geforderte Abgabe zu langsam einging, und 4 v. Chr. brannte der römische Statthalter Varus die Stadt nieder, nachdem ihre Einwohner geflohen waren."
    - "In Lukas’ Bericht wird einer der beiden Wanderer Kleopas genannt. Jesus schloss sich ihnen unerkannt auf dem Weg an und erschloss ihnen die Schrift. Im Dorf nötigten sie ihn zu bleiben: „denn es will Abend werden, und der Tag hat sich geneigt“; als er das Brot segnete und brach: „Da wurden ihre Augen geöffnet, und sie erkannten ihn. Und er verschwand vor ihnen.“ In derselben Stunde kehrten sie nach Jerusalem zurück und fanden die Elf."
    - "Im Jahr 68 n. Chr. lagerte Vespasian bei Emmaus und ließ dort die Fünfte Legion zurück. Nach dem Krieg, sagt Josephus, gab er 800 entlassenen Soldaten Land an einem Ort namens Ammaus, im üblichen griechischen Text 30 Stadien von Jerusalem entfernt (einige Handschriften lesen 60); viele setzen ihn mit Motza gleich, dem Moza der Liste Josuas, dessen späterer Name Qalunya an das lateinische colonia erinnern soll. Um 221 wurde Emmaus-Nikopolis nach einer von Julius Africanus geführten Gesandtschaft eine Stadt mit dem Namen Nikopolis. Eusebius hielt es für die Heimat des Kleopas, und Hieronymus schreibt, indem er von Paulas Besuch in den 380er Jahren erzählt, der Herr, dort am Brotbrechen erkannt, habe das Haus des Kleopas zu einer Kirche gemacht. Reste einer byzantinischen Kirche stehen noch in Imwas."
  fr:
    - "Emmaüs est le village où deux disciples marchèrent le jour de la résurrection, « un village nommé Émmaüs, éloigné de Jérusalem de soixante stades ». Son emplacement est discuté. La plupart des manuscrits de Luc donnent soixante stades, environ 11 km ; certains, dont le Codex Sinaiticus, donnent 160, environ 30 km. Quatre lieux sont le plus souvent cités : Emmaüs-Nicopolis (Imwas) près de Latroun, l’Emmaüs de l’Église ancienne ; Abu Ghosh sur la route de l’ouest vers la côte, tenue pour Emmaüs depuis le XIIe siècle ; el-Qubeibeh au nord-ouest, ainsi tenue depuis la fin du Moyen Âge ; et Motza, à l’ouest de Jérusalem, où se trouve le point de la carte."
    - "Emmaüs-Nicopolis se trouvait là où la route venant de la plaine côtière commence à monter vers Jérusalem, et c’était l’Emmaüs des guerres maccabéennes et romaines. Vers 165 av. J.-C., Judas Maccabée y vainquit une armée séleucide qui y campait. En 43 av. J.-C., Cassius vendit sa population en esclavage parce que le tribut qu’il exigeait tardait à rentrer, et en 4 av. J.-C. le gouverneur romain Varus incendia la ville après la fuite de ses habitants."
    - "Dans le récit de Luc, l’un des deux voyageurs s’appelle Cléopas. Jésus les rejoignit sur la route sans être reconnu et leur ouvrit les Écritures. Au village, ils le pressèrent de rester, « car le soir approche, le jour est sur son déclin » ; lorsqu’il bénit et rompit le pain, « leurs yeux s’ouvrirent, et ils le reconnurent ; mais il disparut de devant eux ». À l’heure même, ils retournèrent à Jérusalem et trouvèrent les onze."
    - "En 68 apr. J.-C., Vespasien campa à Emmaüs et y laissa la Ve légion. Après la guerre, dit Josèphe, il donna des terres à 800 soldats libérés en un lieu appelé Ammaüs, à 30 stades de Jérusalem selon le texte grec courant (certains manuscrits portent 60) ; beaucoup l’identifient à Motza, la Motsa de la liste de Josué, dont le nom ultérieur Qalunya est censé rappeler le latin colonia. Vers 221, Emmaüs-Nicopolis devint une ville nommée Nicopolis après une ambassade menée par Julius Africanus. Eusèbe la tenait pour la patrie de Cléopas, et Jérôme, racontant la visite de Paula dans les années 380, écrit que le Seigneur, reconnu là à la fraction du pain, fit de la maison de Cléopas une église. Les restes d’une église byzantine se dressent encore à Imwas."
  it:
    - "Emmaus è il villaggio verso cui due discepoli camminarono il giorno della risurrezione, «un villaggio nominato Emmaus, distante da Gerusalemme sessanta stadi». Il suo sito è controverso. La maggior parte dei manoscritti di Luca dà sessanta stadi, circa 11 km; alcuni, fra cui il Codice Sinaitico, ne danno 160, circa 30 km. Quattro luoghi sono nominati più spesso: Emmaus-Nicopoli (Imwas) presso Latrun, l’Emmaus della Chiesa antica; Abu Ghosh, sulla strada a ovest verso la costa, ritenuta Emmaus dal XII secolo; el-Qubeibeh a nord-ovest, così ritenuta dal tardo Medioevo; e Motza, a ovest di Gerusalemme, dove si trova il punto della mappa."
    - "Emmaus-Nicopoli sorgeva dove la strada dalla pianura costiera comincia a salire verso Gerusalemme, ed era l’Emmaus delle guerre maccabaiche e romane. Intorno al 165 a.C. Giuda Maccabeo sconfisse un esercito seleucide accampato là. Nel 43 a.C. Cassio vendette come schiavi i suoi abitanti perché il tributo da lui richiesto tardava ad arrivare, e nel 4 a.C. il governatore romano Varo bruciò la città dopo la fuga dei suoi abitanti."
    - "Nel racconto di Luca uno dei due viaggiatori si chiama Cleopa. Gesù si unì a loro lungo la strada senza essere riconosciuto e aprì loro le Scritture. Al villaggio lo pregarono di fermarsi, «perché si fa sera e il giorno è già declinato»; quando egli benedisse e spezzò il pane, «gli occhi loro furono aperti, e lo riconobbero; ma egli sparì d’innanzi a loro». Nella stessa ora tornarono a Gerusalemme e trovarono gli undici."
    - "Nel 68 d.C. Vespasiano si accampò a Emmaus e vi lasciò la Quinta Legione. Dopo la guerra, dice Giuseppe Flavio, diede terra a 800 soldati congedati in un luogo detto Ammaus, a 30 stadi da Gerusalemme nel testo greco comune (alcuni manoscritti leggono 60); molti lo identificano con Motza, la Mosa dell’elenco di Giosuè, il cui nome posteriore Qalunya si ritiene ricordi il latino colonia. Intorno al 221 Emmaus-Nicopoli divenne una città detta Nicopoli dopo un’ambasceria guidata da Giulio Africano. Eusebio la ritenne la patria di Cleopa, e Girolamo, raccontando la visita di Paola negli anni 380, scrive che il Signore, riconosciuto là nello spezzare il pane, fece della casa di Cleopa una chiesa. Resti di una chiesa bizantina sono ancora in piedi a Imwas."
  pl:
    - "Emaus to wieś, do której dwaj uczniowie szli w dzień zmartwychwstania: „do miasteczka, które było na sześćdziesiąt stajan od Jeruzalemu, które zwano Emaus”. Jej położenie jest sporne. Większość rękopisów Łukasza podaje sześćdziesiąt stadiów, około 11 km; niektóre, wśród nich Kodeks synajski, podają 160, około 30 km. Najczęściej wymienia się cztery miejsca: Emaus-Nikopolis (Imwas) koło Latrun, Emaus dawnego Kościoła; Abu Gosz przy drodze na zachód ku wybrzeżu, uważane za Emaus od XII w.; el-Kubejba na północnym zachodzie, tak uważana od późnego średniowiecza; i Moca, na zachód od Jerozolimy, gdzie stoi punkt na mapie."
    - "Emaus-Nikopolis leżało tam, gdzie droga z równiny nadmorskiej zaczyna się wspinać ku Jerozolimie, i było Emaus wojen machabejskich i rzymskich. Około 165 r. p.n.e. Juda Machabeusz pokonał tam obozującą armię seleucydzką. W 43 r. p.n.e. Kasjusz sprzedał jego mieszkańców w niewolę, gdy żądany przez niego haracz napływał zbyt wolno, a w 4 r. p.n.e. rzymski namiestnik Warus spalił miasto po ucieczce jego mieszkańców."
    - "W relacji Łukasza jeden z dwóch wędrowców nazywa się Kleofas. Jezus dołączył do nich w drodze nierozpoznany i otworzył przed nimi Pisma. We wsi nalegali, by został, „boć się ma ku wieczorowi, i już się dzień nachylił”; gdy błogosławił i łamał chleb, „otworzyły się oczy ich, i poznali go; ale on zniknął z oczu ich”. W tej samej godzinie wrócili do Jerozolimy i zastali jedenastu."
    - "W 68 r. n.e. Wespazjan obozował pod Emaus i zostawił tam V Legię. Po wojnie, mówi Józef Flawiusz, dał ziemię 800 zwolnionym żołnierzom w miejscu zwanym Ammaus, o 30 stadiów od Jerozolimy w standardowym tekście greckim (niektóre rękopisy mają 60); wielu utożsamia je z Moca, Moca z wykazu Jozuego, której późniejsza nazwa Kalunija ma przypominać łacińskie colonia. Około 221 r. Emaus-Nikopolis stało się miastem zwanym Nikopolis po poselstwie pod wodzą Juliusza Afrykana. Euzebiusz uważał je za dom Kleofasa, a Hieronim, opowiadając o wizycie Pauli w latach osiemdziesiątych IV w., pisze, że Pan, poznany tam przy łamaniu chleba, uczynił dom Kleofasa kościołem. Pozostałości bizantyjskiego kościoła wciąż stoją w Imwas."
  nl:
    - "Emmaüs is het dorp waarheen twee leerlingen liepen op de dag van de opstanding, “naar een vlek, dat zestig stadiën van Jeruzalem was, welks naam was Emmaus”. De ligging is omstreden. De meeste handschriften van Lukas geven zestig stadiën, zo'n 11 km; sommige, onder meer de Codex Sinaiticus, geven er 160, zo'n 30 km. Vier plaatsen worden het vaakst genoemd: Emmaüs-Nicopolis (Imwas) bij Latrun, het Emmaüs van de oude kerk; Abu Ghosh aan de weg westwaarts naar de kust, sinds de twaalfde eeuw voor Emmaüs gehouden; el-Qubeibeh in het noordwesten, sinds de latere middeleeuwen zo gehouden; en Motza, ten westen van Jeruzalem, waar het punt op de kaart staat."
    - "Emmaüs-Nicopolis lag waar de weg uit de kustvlakte naar Jeruzalem begint te stijgen, en het was het Emmaüs van de Makkabeeënoorlogen en de Romeinse oorlogen. Omstreeks 165 v.Chr. versloeg Judas Makkabeüs er een Seleucidisch leger dat er kampeerde. In 43 v.Chr. verkocht Cassius de bewoners als slaven toen de geëiste heffing traag binnenkwam, en in 4 v.Chr. verbrandde de Romeinse gouverneur Varus de stad nadat de inwoners waren gevlucht."
    - "In Lukas' verhaal heet een van de twee reizigers Kleopas. Jezus voegde zich onherkend bij hen op de weg en opende hun de Schriften. Bij het dorp drongen zij erop aan dat hij bleef: “Blijf met ons; want het is bij den avond, en de dag is gedaald”; toen hij het brood zegende en brak, “hun ogen werden geopend, en zij kenden Hem; en Hij kwam weg uit hun gezicht”. Datzelfde uur keerden zij terug naar Jeruzalem en vonden de elf."
    - "In 68 n.Chr. legerde Vespasianus zich bij Emmaüs en liet er het Vijfde Legioen achter. Na de oorlog gaf hij, zegt Josephus, land aan 800 afgezwaaide soldaten op een plaats Ammaus, 30 stadiën van Jeruzalem in de standaard Griekse tekst (sommige handschriften lezen 60); velen identificeren die met Motza, het Moza van Jozua's lijst, wiens latere naam Qalunya aan het Latijnse colonia zou herinneren. Omstreeks 221 werd Emmaüs-Nicopolis een stad met de naam Nicopolis na een gezantschap onder Julius Africanus. Eusebius hield het voor het huis van Kleopas, en Hieronymus schrijft, vertellend over Paula's bezoek in de jaren 380, dat de Heer, daar herkend bij het breken van het brood, het huis van Kleopas tot kerk maakte. Resten van een Byzantijnse kerk staan nog te Imwas."
  cs:
    - "Emauzy jsou vesnice, do níž šli dva učedníci v den vzkříšení, „do městečka, kteréž bylo vzdálí od Jeruzaléma honů šedesáte, jemuž jméno Emaus“. Jeho poloha je sporná. Většina rukopisů Lukáše uvádí šedesát stadií, asi 11 km; některé, mezi nimi Kodex Sinajský, uvádějí 160, asi 30 km. Nejčastěji se jmenují čtyři místa: Emauzy-Nikopolis (Imwas) u Latrúnu, Emauzy staré církve; Abu Ghosh na cestě na západ k pobřeží, pokládané za Emauzy od 12. století; el-Qubeibeh na severozápadě, pokládané za ně od pozdního středověku; a Motza, západně od Jeruzaléma, kde stojí bod mapy."
    - "Emauzy-Nikopolis ležely tam, kde cesta z pobřežní roviny začíná stoupat k Jeruzalému, a byly Emauzy makabejských a římských válek. Kolem roku 165 př. n. l. u nich Juda Makabejský porazil seleukovské vojsko, které tam tábořilo. Roku 43 př. n. l. Kassios prodal jejich lid do otroctví, když se pomalu shromažďovala daň, kterou požadoval, a roku 4 př. n. l. římský místodržitel Varus město spálil poté, co jeho obyvatelé uprchli."
    - "V Lukášově vyprávění je jeden ze dvou poutníků jmenován Kleofáš. Ježíš se k nim na cestě připojil nepoznán a vyložil jim Písma. U vesnice naléhali, aby zůstal, „nebo se již připozdívá, a den se nachýlil“; když požehnal a lámal chléb, „I otevříny jsou oči jejich, a poznali ho. On pak zmizel od očí jejich“. Téže hodiny se vrátili do Jeruzaléma a nalezli jedenáct."
    - "Roku 68 n. l. se Vespasianus utábořil v Emauzách a nechal tam Pátou legii. Po válce, praví Josephus, dal půdu 800 propuštěným vojákům na místě zvaném Ammaus, 30 stadií od Jeruzaléma ve standardním řeckém textu (některé rukopisy čtou 60); mnozí je ztotožňují s Motzou, Mocou ze seznamu Jozuova, jejíž pozdější jméno Qalunya prý připomíná latinské colonia. Kolem roku 221 se Emauzy-Nikopolis staly městem zvaným Nikopolis po poselstvu vedeném Juliem Africanem. Eusebios je pokládal za domov Kleofášův a Jeroným, vypravuje o návštěvě Pauly v 80. letech 4. století, píše, že Pán, poznaný tam při lámání chleba, učinil z domu Kleofášova kostel. Zbytky byzantského kostela dosud stojí v Imwasu."
  sv:
    - "Emmaus är byn dit två lärjungar vandrade på uppståndelsedagen, ”en by som hette Emmaus, och som låg sextio stadiers väg från Jerusalem”. Dess läge är omtvistat. De flesta handskrifter av Lukas anger sextio stadier, omkring 11 km; några, bland dem Codex Sinaiticus, anger 160, omkring 30 km. Fyra platser nämns oftast: Emmaus-Nikopolis (Imwas) nära Latrun, den gamla kyrkans Emmaus; Abu Ghosh vid vägen västerut mot kusten, ansett vara Emmaus sedan 1100-talet; el-Qubeibeh åt nordväst, ansett så sedan senare medeltiden; och Motza, väster om Jerusalem, där kartans punkt står."
    - "Emmaus-Nikopolis låg där vägen från kustslätten börjar stiga mot Jerusalem, och det var Emmaus under mackabeernas och romarnas krig. Omkring 165 f.Kr. besegrade Judas Mackabeus en seleukidisk armé som låg förlagd där. År 43 f.Kr. sålde Cassius dess folk som slavar när den avgift han krävde dröjde, och 4 f.Kr. brände den romerske ståthållaren Varus staden sedan invånarna flytt."
    - "I Lukas berättelse heter en av de två vandrarna Kleopas. Jesus slöt sig till dem på vägen, oigenkänd, och öppnade Skrifterna för dem. I byn nödgade de honom att stanna, ”ty det lider mot aftonen, och dagen nalkas redan sitt slut”; när han välsignade och bröt brödet ”öppnades deras ögon, så att de kände igen honom. Men då försvann han ur deras åsyn”. I samma stund vände de tillbaka till Jerusalem och fann de elva."
    - "År 68 e.Kr. slog Vespasianus läger vid Emmaus och lämnade femte legionen där. Efter kriget, säger Josefus, gav han mark åt 800 avskedade soldater på en plats som kallas Ammaus, 30 stadier från Jerusalem i den gängse grekiska texten (några handskrifter har 60); många identifierar den med Motza, Mosa i Josuas förteckning, vars senare namn Qalunya anses erinra om latinets colonia. Omkring 221 blev Emmaus-Nikopolis en stad med namnet Nikopolis efter ett sändebud lett av Julius Africanus. Eusebios höll den för Kleopas hemort, och Hieronymus, som berättar om Paulas besök på 380-talet, skriver att Herren, känd där vid brödbrytelsen, gjorde Kleopas hus till en kyrka. Lämningar av en bysantinsk kyrka står ännu i Imwas."
  nb:
    - "Emmaus er landsbyen to disipler gikk til på oppstandelsesdagen, «en by som ligger seksti stadier fra Jerusalem, og som heter Emmaus». Dens beliggenhet er omdiskutert. De fleste håndskrifter av Lukas gir seksti stadier, omtrent 11 km; noen, blant dem Codex Sinaiticus, gir 160, omtrent 30 km. Fire steder nevnes oftest: Emmaus-Nikopolis (Imwas) nær Latrun, oldkirkens Emmaus; Abu Ghosh på veien vestover til kysten, regnet for Emmaus fra 1100-tallet; el-Qubeibeh i nordvest, regnet slik fra senere middelalder; og Motza, vest for Jerusalem, der kartpunktet står."
    - "Emmaus-Nikopolis lå der veien fra kystsletten begynner å stige mot Jerusalem, og var Makkabeertidens og romertidens Emmaus. Omkring 165 f.Kr. beseiret Judas Makkabeus en seleukidisk hær som lå leiret der. I 43 f.Kr. solgte Cassius dens folk som slaver da den skatten han krevde, kom for sent inn, og i 4 f.Kr. brente den romerske landshøvdingen Varus byen etter at innbyggerne hadde flyktet."
    - "I Lukas' beretning heter en av de to vandrerne Kleopas. Jesus sluttet seg til dem på veien ukjent og åpnet skriftene for dem. I landsbyen nødde de ham til å bli, «for det stunder til aften, og dagen heller!»; da han tok brødet, velsignet og brøt det, «blev deres øine åpnet, og de kjente ham; og han blev usynlig for dem». I samme stund vendte de tilbake til Jerusalem og fant de elleve."
    - "I 68 e.Kr. slo Vespasian leir ved Emmaus og lot Femte legion bli der. Etter krigen, sier Josefus, gav han land til 800 avskjedigede soldater på et sted kalt Ammaus, 30 stadier fra Jerusalem i den vanlige greske teksten (noen håndskrifter har 60); mange identifiserer det med Motza, Mosa i Josvas liste, hvis senere navn Qalunya antas å minne om det latinske colonia. Omkring 221 ble Emmaus-Nikopolis en by med navnet Nikopolis etter et sendebud ledet av Julius Africanus. Eusebius regnet den for Kleopas' hjem, og Hieronymus skriver, i beretningen om Paulas besøk på 380-tallet, at Herren, kjent der ved brødsbrytelsen, gjorde Kleopas' hus til en kirke. Rester av en bysantinsk kirke står fremdeles i Imwas."
  tl:
    - "Ang Emaus ay ang nayong pinuntahan ng dalawang alagad sa araw ng muling pagkabuhay, “isang nayong ngala'y Emaus, na may anim na pung estadio ang layo sa Jerusalem”. Pinagtatalunan ang pook nito. Anim na pung estadio, mga 11 km, ang nasa karamihan ng manuskrito ni Lucas; may ilan, kabilang ang Codex Sinaiticus, na 160, mga 30 km. Apat na pook ang pinakamadalas banggitin: ang Emaus-Nicopolis (Imwas) malapit sa Latrun, ang Emaus ng sinaunang iglesia; ang Abu Ghosh sa daan sa kanluran patungong baybayin, na itinuring na Emaus mula ika-12 siglo; ang el-Qubeibeh sa hilagang-kanluran, na itinuring ding gayon mula huling Gitnang Panahon; at ang Motza, sa kanluran ng Jerusalem, kung saan ang punto ng mapa."
    - "Ang Emaus-Nicopolis ay nasa pook kung saan nagsisimulang umakyat patungong Jerusalem ang daan mula sa kapatagang baybayin, at ito ang Emaus ng mga digmaang Macabeo at Romano. Noong mga 165 BK, tinalo ni Judas Macabeo ang hukbong Seleucida na nakakampo roon. Noong 43 BK, ipinagbili ni Cassius sa pagkaalipin ang mga tao nito nang mabagal dumating ang hiningi niyang buwis, at noong 4 BK sinunog ng gobernador na Romano na si Varus ang bayan matapos tumakas ang mga naninirahan."
    - "Sa salaysay ni Lucas, pinangalanang Cleopas ang isa sa dalawang manlalakbay. Sumama si Jesus sa kanila sa daan nang hindi nakilala at binuksan ang Kasulatan sa kanila. Sa nayon, hinimok nila siyang manatili, “sapagka't gumagabi na, at kumikiling na ang araw”; nang basbasan at putol-putulin niya ang tinapay, “nangabuksan ang kanilang mga mata, at siya'y nakilala nila; at siya'y nawala sa kanilang mga paningin”. Nang oras ding iyon ay bumalik sila sa Jerusalem at nasumpungan ang labing-isa."
    - "Noong 68 AD, humimpil si Vespasiano sa Emaus at iniwan doon ang Ikalimang Legiyon. Pagkatapos ng digmaan, sabi ni Josefo, nagbigay siya ng lupa sa 800 pinalayang sundalo sa isang pook na tinatawag na Ammaus, 30 estadio mula sa Jerusalem sa karaniwang tekstong Griyego (60 ang binabasa ng ilang manuskrito); kinikilala ito ng marami sa Motza, ang Moza ng talaan ni Josue, na ang huling pangalang Qalunya ay inaakalang nagpapaalala sa Latin na colonia. Noong mga 221, ang Emaus-Nicopolis ay naging lungsod na pinangalanang Nicopolis matapos ang isang sugong pinamunuan ni Julio Africano. Itinuring ito ni Eusebio na tahanan ni Cleopas, at isinulat ni Jeronimo, na nagsasalaysay ng pagdalaw ni Paula noong dekada 380, na ginawang simbahan ng Panginoon, na nakilala roon sa pagpuputol ng tinapay, ang bahay ni Cleopas. May mga labi pa ng simbahang Bizantino sa Imwas."
  da:
    - "Emmaus er landsbyen, som to disciple gik til på opstandelsesdagen, »en Landsby, som laa tresindstyve Stadier fra Jerusalem, dens Navn var Emmaus«. Dens sted er omstridt. De fleste håndskrifter af Lukas angiver tres stadier, cirka 11 km; nogle, blandt dem Codex Sinaiticus, angiver 160, cirka 30 km. Fire steder nævnes oftest: Emmaus-Nikopolis (Imwas) nær Latrun, den gamle kirkes Emmaus; Abu Ghosh på vejen vest mod kysten, anset for Emmaus siden 1100-tallet; el-Qubeibeh mod nordvest, anset sådan siden senere middelalder; og Motza, vest for Jerusalem, hvor kortets punkt står."
    - "Emmaus-Nikopolis lå, hvor vejen fra kystsletten begynder at stige mod Jerusalem, og det var makkabæerkrigenes og de romerske krigs Emmaus. Omkring 165 f.Kr. besejrede Judas Makkabæus en seleukidisk hær, der lå lejret dér. I 43 f.Kr. solgte Cassius dens folk som slaver, da den afgift, han krævede, var langsom om at komme ind, og i 4 f.Kr. brændte den romerske guvernør Varus byen, efter at dens indbyggere var flygtet."
    - "I Lukas' beretning hedder den ene af de to rejsende Kleofas. Jesus sluttede sig til dem på vejen uden at blive genkendt og åbnede Skrifterne for dem. I landsbyen nødte de ham til at blive, »thi det er mod Aften, og Dagen hælder«; da han velsignede og brød brødet, »bleve deres Øjne aabnede, og de kendte ham; og han blev usynlig for dem«. I samme time vendte de tilbage til Jerusalem og fandt de elleve."
    - "I 68 e.Kr. slog Vespasian lejr ved Emmaus og efterlod Femte Legion dér. Efter krigen gav han, siger Josefus, jord til 800 afskedigede soldater på et sted kaldet Ammaus, 30 stadier fra Jerusalem i den gængse græske tekst (nogle håndskrifter har 60); mange identificerer det med Motza, Josvas listes Mosa, hvis senere navn Qalunya antages at minde om det latinske colonia. Omkring 221 blev Emmaus-Nikopolis en by ved navn Nikopolis efter en delegation ledet af Julius Africanus. Eusebius tog den for Kleofas' hjem, og Hieronymus, der fortæller om Paulas besøg i 380'erne, skriver, at Herren, genkendt dér ved brødets brydelse, gjorde Kleofas' hus til en kirke. Rester af en byzantinsk kirke står stadig ved Imwas."
