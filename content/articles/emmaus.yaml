  - "Josephus, Antiquities 12.298-312 (Judas and Gorgias at Emmaus); 14.275 and Jewish War 1.222 (Cassius); Antiquities 17.291 and Jewish War 2.71 (Varus)"
  - "Josephus, Jewish War 4.444-445 (Vespasian and the Fifth Legion); 7.217 (Ammaus, 30 stadia in Niese's text, 60 in other manuscripts)"
  - "Jerome, Chronicle (Nicopolis founded, Julius Africanus' embassy, c. AD 221); Letter 108.8"
  - "Eusebius, Onomasticon, s.v. Emmaous (C. U. Wolf's translation, no. 457)"
  - "D. Pringle, The Churches of the Crusader Kingdom of Jerusalem, vol. 1 (1993), nos. 1 (Abu Ghosh) and 10 ('Amwas)"
  - "L.-H. Vincent and F.-M. Abel, Emmaüs, sa basilique et son histoire (1932)"
