body:
  en:
    - "Syene, today Aswan, is the town at the First Cataract of the Nile, far up the river where it breaks through granite and Egypt proper ends and Nubia begins. It was Egypt's southern gate, a market and garrison town, with the quarries that gave the pharaohs the red granite of their obelisks, and opposite it the island of Elephantine, Yeb to the Egyptians, with its temple of the ram god Khnum and its fortress. Strabo and Pliny record that at Syene the noonday sun of the summer solstice stood straight overhead and lit the bottom of a well, the observation from which Eratosthenes measured the size of the earth."
    - "For Ezekiel Syene marks the far end of Egypt, as Dan and Beersheba mark Israel: the land will be made desolate “from the tower of Syene even unto the border of Ethiopia”, and “from the tower of Syene shall they fall in it by the sword”; the Hebrew reads “from Migdol to Syene”, as the Synodal Bible has it, Migdol being the fortress at the northern frontier. In Isaiah the exiles are to return “from the north and from the west; and these from the land of Sinim”. Older readers took Sinim for a far land, even China; the great Isaiah scroll from Qumran reads Sewenim, the people of Syene, and most modern versions follow it, so that the prophet promises return from Egypt's furthest south."
    - "That there were Jews to return from Syene is known from the Aramaic papyri found on Elephantine and at Aswan from the 1890s: letters, contracts and lists of a Jewish garrison serving the Persian kings in the fifth century BC, with a temple of their God, YHW, on the island. In 410 BC the priests of Khnum, with the Persian governor's connivance, destroyed the temple, and the community wrote in 407 to Bagoas, governor of Judah, and to the sons of Sanballat of Samaria for help to rebuild it. Today Aswan is a city of the Egyptian south below the High Dam, finished in 1970, which created Lake Nasser; Elephantine, with the ruins of the Khnum temple and the Jewish quarter, is excavated by German and Swiss institutes, and the temples of Philae, flooded by the reservoir of the old dam, were moved to a higher island."
  ru:
    - "Сиена, нынешний Асуан, — город у первого порога Нила, далеко вверх по реке, где она прорывается сквозь гранит и собственно Египет кончается, а начинается Нубия. Это были южные ворота Египта, торговый и гарнизонный город с каменоломнями, дававшими фараонам красный гранит для обелисков, а напротив — остров Элефантина, по-египетски Йеб, с храмом бараноголового бога Хнума и крепостью. Страбон и Плиний записали, что в Сиене полуденное солнце летнего солнцестояния стояло прямо над головой и освещало дно колодца; по этому наблюдению Эратосфен измерил окружность Земли."
    - "Для Иезекииля Сиена отмечает дальний край Египта, как Дан и Вирсавия — Израиля: земля будет опустошена «от Мигдола до Сиены, до самого предела Ефиопии», и «от Мигдола до Сиены будут падать в нем от меча»; Мигдол — крепость на северной границе, а Библия короля Иакова читает здесь «от башни Сиены». У Исаии изгнанники вернутся «от севера и моря, а другие из земли Синим». Прежние читатели видели в Синим далёкую страну, даже Китай; большой свиток Исаии из Кумрана читает «Севеним», жители Сиены, и большинство современных переводов следуют ему, так что пророк обещает возвращение с самого юга Египта."
    - "Что из Сиены было кому возвращаться, известно по арамейским папирусам, найденным на Элефантине и в Асуане с 1890-х годов: письма, договоры и списки иудейского гарнизона, служившего персидским царям в V веке до н. э., с храмом их Бога, Йахо, на острове. В 410 г. до н. э. жрецы Хнума при попустительстве персидского наместника разрушили храм, и община писала в 407 году Багою, наместнику Иудеи, и сыновьям Санаваллата Самарийского с просьбой помочь восстановить его. Сегодня Асуан — город египетского юга ниже Высотной плотины, законченной в 1970 году и создавшей озеро Насер; Элефантину с развалинами храма Хнума и иудейского квартала раскапывают германский и швейцарский институты, а храмы Филе, затопленные водохранилищем старой плотины, перенесли на более высокий остров."
  uk:
    - "Сієна, нині Асуан, — місто при Першому порозі Нілу, далеко вгору по річці, де вона проривається крізь граніт і закінчується власне Єгипет та починається Нубія. Це були південні ворота Єгипту, ринок і гарнізонне місто, з каменоломнями, що дали фараонам червоний граніт їхніх обелісків, а навпроти нього — острів Елефантина, єгипетською Єб, з храмом барана-бога Хнума та фортецею. Страбон і Пліній повідомляють, що в Сієні опівдні в день літнього сонцестояння сонце стояло прямо над головою й освітлювало дно колодязя — спостереження, з якого Ератосфен виміряв розмір землі."
    - "Для Єзекіїля Сієна позначає дальній кінець Єгипту, так як Дан і Беер-Шева — Ізраїлю: земля стане пусткою «від Мигдола до Сіени й до гряницї Етіопської», і «од Мигдола до Сіени падати муть у йому од меча»; староєврейський текст читається «від Мигдола до Сієни», як подає й Синодальний переклад, де Мигдол — фортеця на північному кордоні. В Ісаї вигнанці повернуться «одні від півночі, другі з Синим-країни». Давніші читачі вважали Сіним далекою країною, навіть Китаєм; великий сувій Ісаї з Кумрана читає Севеним, люди Сієни, і більшість сучасних перекладів іде за ним, так що пророк обіцяє повернення з найдальшого півдня Єгипту."
    - "Що в Сієні жили юдеї, яким було б куди повертатися, відомо з арамейських папірусів, знайдених на Елефантині й в Асуані з 1890-х років: листів, договорів і списків юдейського гарнізону, що служив перським царям у V ст. до н. е., з храмом їхнього Бога, YHW, на острові. У 410 р. до н. е. жерці Хнума за змовництва перського намісника зруйнували храм, і громада 407 року написала Багою, намісникові Юди, та синам Санаваллата Самарійського з проханням допомогти його відбудувати. Нині Асуан — місто єгипетського півдня нижче від Високої греблі, завершеної 1970 року, що створила озеро Насер; Елефантину з руїнами храму Хнума та юдейським кварталом розкопують німецькі й швейцарські інститути, а храми Філе, затоплені водосховищем старої греблі, перенесли на вищий острів."
  es:
    - "Sevene, hoy Asuán, es la ciudad de la primera catarata del Nilo, muy arriba del río, donde este atraviesa el granito y termina el Egipto propiamente dicho y empieza Nubia. Era la puerta meridional de Egipto, ciudad de mercado y guarnición, con las canteras que daban a los faraones el granito rojo de sus obeliscos, y frente a ella la isla de Elefantina, Yeb para los egipcios, con su templo del dios carnero Jnum y su fortaleza. Estrabón y Plinio registran que en Sevene el sol del mediodía del solsticio de verano quedaba justo en el cenit e iluminaba el fondo de un pozo, la observación con la que Eratóstenes midió el tamaño de la tierra."
    - "Para Ezequiel, Sevene marca el extremo de Egipto, como Dan y Beerseba marcan el de Israel: la tierra será asolada «desde Migdol hasta Seveneh, hasta el término de Etiopía», y «desde Migdol hasta Seveneh caerán en él á cuchillo»; el hebreo dice «desde Migdol hasta Sevene», como tiene la Biblia sinodal, siendo Migdol la fortaleza de la frontera septentrional. En Isaías los desterrados volverán «del norte y del occidente, y estotros de la tierra de los Sineos». Los lectores antiguos tomaron Sinim por una tierra lejana, incluso China; el gran rollo de Isaías de Qumrán lee Sewenim, el pueblo de Sevene, y la mayoría de las versiones modernas lo siguen, de modo que el profeta promete el regreso desde el extremo sur de Egipto."
    - "Que había judíos que pudieran volver de Sevene se sabe por los papiros arameos hallados en Elefantina y en Asuán desde la década de 1890: cartas, contratos y listas de una guarnición judía al servicio de los reyes persas en el siglo V a. C., con un templo de su Dios, YHW, en la isla. En 410 a. C. los sacerdotes de Jnum, con la connivencia del gobernador persa, destruyeron el templo, y la comunidad escribió en 407 a Bagoas, gobernador de Judá, y a los hijos de Sanbalat de Samaria pidiendo ayuda para reconstruirlo. Hoy Asuán es una ciudad del sur egipcio situada bajo la Gran Presa, terminada en 1970, que creó el lago Nasser; Elefantina, con las ruinas del templo de Jnum y el barrio judío, es excavada por institutos alemanes y suizos, y los templos de Filé, inundados por el embalse de la antigua presa, fueron trasladados a una isla más alta."
  pt:
    - "Sevene, hoje Assuã, é a cidade da Primeira Catarata do Nilo, longe rio acima, onde ele rompe o granito e termina o Egito propriamente dito e começa a Núbia. Era a porta sul do Egito, cidade de mercado e guarnição, com as pedreiras que davam aos faraós o granito vermelho de seus obeliscos, e diante dela a ilha de Elefantina, Yeb para os egípcios, com seu templo do deus-carneiro Khnum e sua fortaleza. Estrabão e Plínio registram que em Sevene o sol do meio-dia do solstício de verão ficava a pino e iluminava o fundo de um poço, a observação com que Eratóstenes mediu o tamanho da Terra."
    - "Para Ezequiel, Sevene marca o extremo do Egito, como Dã e Berseba marcam Israel: a terra será assolada “desde a torre de Sevene até a fronteira da Etiópia”, e “eles cairão pela espada desde a torre de Sevene”; o hebraico lê “de Migdol a Sevene”, como tem a Bíblia Sinodal, sendo Migdol a fortaleza da fronteira norte. Em Isaías, os exilados voltarão “estes do norte e do oeste, e estes da terra de Sinim”. Leitores antigos tomaram Sinim por uma terra distante, até a China; o grande rolo de Isaías de Qumran lê Sevenim, o povo de Sevene, e a maioria das versões modernas o segue, de modo que o profeta promete o retorno do extremo sul do Egito."
    - "Que havia judeus para voltar de Sevene se sabe pelos papiros aramaicos achados em Elefantina e em Assuã desde a década de 1890: cartas, contratos e listas de uma guarnição judaica a serviço dos reis persas no século V a.C., com um templo de seu Deus, YHW, na ilha. Em 410 a.C., os sacerdotes de Khnum, com a conivência do governador persa, destruíram o templo, e em 407 a comunidade escreveu a Bagoas, governador de Judá, e aos filhos de Sambalá de Samaria pedindo ajuda para reconstruí-lo. Hoje Assuã é uma cidade do sul egípcio abaixo da Represa de Assuã, concluída em 1970, que criou o lago Nasser; Elefantina, com as ruínas do templo de Khnum e o bairro judaico, é escavada por institutos alemães e suíços, e os templos de Filas, inundados pelo reservatório da antiga represa, foram transferidos para uma ilha mais alta."
  de:
    - "Syene, das heutige Assuan, ist die Stadt am Ersten Nilkatarakt, weit flussaufwärts, wo der Nil durch Granit bricht, das eigentliche Ägypten endet und Nubien beginnt. Es war Ägyptens südliches Tor, Markt- und Garnisonsstadt, mit den Steinbrüchen, die den Pharaonen den roten Granit ihrer Obelisken lieferten; gegenüber lag die Insel Elephantine, ägyptisch Yeb, mit dem Tempel des Widdergottes Chnum und ihrer Festung. Strabon und Plinius berichten, dass in Syene die Mittagssonne zur Sommersonnenwende senkrecht stand und den Grund eines Brunnens beleuchtete, die Beobachtung, aus der Eratosthenes die Größe der Erde maß."
    - "Für Hesekiel bezeichnet Syene das Ende Ägyptens, wie Dan und Beerscheba das Israels: Er will „Ägyptenland wüst und öde machen von Migdol bis gen Syene und bis an die Grenze des Mohrenlandes“, und „von Migdol bis gen Syene sollen sie durchs Schwert fallen“; so liest der hebräische Text, ebenso die Synodalbibel, und Migdol ist die Festung an der Nordgrenze. Bei Jesaja sollen die Verbannten zurückkehren: „jene von Mitternacht und diese vom Meer und jene von Lande Sinim“. Ältere Leser hielten Sinim für ein fernes Land, gar China; die große Jesajarolle von Qumran liest Sewenim, die Leute von Syene, und die meisten modernen Übersetzungen folgen ihr, sodass der Prophet die Rückkehr aus Ägyptens äußerstem Süden verheißt."
    - "Dass Juden in Syene lebten, zeigen die aramäischen Papyri, die seit den 1890er Jahren auf Elephantine und in Assuan gefunden wurden: Briefe, Verträge und Listen einer jüdischen Garnison im Dienst der persischen Könige im fünften Jahrhundert v. Chr., mit einem Tempel ihres Gottes YHW auf der Insel. 410 v. Chr. zerstörten die Priester des Chnum mit Duldung des persischen Statthalters den Tempel, und die Gemeinde bat 407 Bagoas, den Statthalter von Juda, und die Söhne Sanballats von Samaria um Hilfe zum Wiederaufbau. Heute ist Assuan eine Stadt des ägyptischen Südens unterhalb des 1970 vollendeten Hochdamms, der den Nassersee schuf; Elephantine mit den Ruinen des Chnum-Tempels und des jüdischen Viertels wird von deutschen und schweizerischen Instituten ausgegraben, und die Tempel von Philae, vom Stausee des alten Damms überflutet, wurden auf eine höhere Insel versetzt."
  fr:
    - "Syène, aujourd’hui Assouan, est la ville de la première cataracte du Nil, loin en amont, là où le fleuve fend le granite et où finit l’Égypte proprement dite et commence la Nubie. Elle était la porte méridionale de l’Égypte, ville de marché et de garnison, avec les carrières qui donnaient aux pharaons le granite rose de leurs obélisques, et en face d’elle l’île d’Éléphantine, Yeb pour les Égyptiens, avec son temple du dieu-bélier Khnoum et sa forteresse. Strabon et Pline rapportent qu’à Syène le soleil de midi au solstice d’été se tenait à la verticale et éclairait le fond d’un puits, l’observation d’où Ératosthène mesura la taille de la terre."
    - "Pour Ézéchiel, Syène marque l’extrémité de l’Égypte, comme Dan et Beer-Schéba celle d’Israël : le pays sera désolé « depuis Migdol jusqu’à Syène et aux frontières de l’Éthiopie », et « de Migdol à Syène ils tomberont par l’épée » ; l’hébreu lit « de Migdol à Syène », comme la Bible synodale, Migdol étant la forteresse de la frontière nord (certaines traductions disent « la tour de Syène »). Chez Ésaïe, les exilés reviendront « les uns du septentrion et de l’occident, les autres du pays de Sinim ». Les anciens lecteurs prenaient Sinim pour un pays lointain, voire la Chine ; le grand rouleau d’Ésaïe de Qumrân porte Sewenim, les gens de Syène, et la plupart des versions modernes le suivent, de sorte que le prophète promet un retour du plus lointain sud de l’Égypte."
    - "Qu’il y ait eu des Juifs à Syène pour revenir, les papyrus araméens trouvés à Éléphantine et à Assouan depuis les années 1890 le montrent : lettres, contrats et listes d’une garnison juive au service des rois perses au Ve siècle av. J.-C., avec un temple de leur Dieu, YHW, sur l’île. En 410 av. J.-C., les prêtres de Khnoum, avec la complicité du gouverneur perse, détruisirent le temple, et la communauté écrivit en 407 à Bagoas, gouverneur de Juda, et aux fils de Sanballat de Samarie pour obtenir de l’aide afin de le rebâtir. Assouan est aujourd’hui une ville du sud égyptien en aval du haut barrage, achevé en 1970, qui créa le lac Nasser ; Éléphantine, avec les ruines du temple de Khnoum et le quartier juif, est fouillée par des instituts allemands et suisses, et les temples de Philæ, inondés par la retenue de l’ancien barrage, furent déplacés sur une île plus haute."
  pl:
    - "Syene, dziś Asuan, to miasto przy pierwszej katarakcie Nilu, daleko w górze rzeki, gdzie przebija się ona przez granit i kończy się właściwy Egipt, a zaczyna Nubia. Była południową bramą Egiptu, miastem targowym i garnizonowym, z kamieniołomami, które dawały faraonom czerwony granit na obeliski, a naprzeciw niej leżała wyspa Elefantyna, egipskie Jeb, ze świątynią barana-boga Chnuma i twierdzą. Strabon i Pliniusz zapisali, że w Syene w południe w dniu przesilenia letniego słońce stało prosto nad głową i oświetlało dno studni, a była to obserwacja, z której Eratostenes zmierzył wielkość ziemi."
    - "U Ezechiela Syene wyznacza dalszy kraniec Egiptu, tak jak Dan i Beer-Szeba wyznaczają Izrael: kraj zostanie spustoszony od wieży Syene aż po granicę Etiopii i „od wieży Sewene od miecza upadną w niej”; hebrajski tekst brzmi „od Migdol do Syene”, jak ma Biblia synodalna, przy czym Migdol było twierdzą na północnej granicy. U Izajasza wygnańcy mają wrócić „od północy i od morza, a drudzy z ziemi Synim”. Dawniejsi czytelnicy brali Sinim za daleką krainę, nawet Chiny; wielki zwój Izajasza z Qumran czyta Sewenim, lud Syene, i większość nowoczesnych przekładów idzie za nim, tak że prorok obiecuje powrót z najdalszego południa Egiptu."
    - "To, że byli Żydzi, którzy mieli wracać z Syene, wiadomo z aramejskich papirusów znalezionych na Elefantynie i w Asuanie od lat dziewięćdziesiątych XIX wieku: listów, umów i spisów żydowskiego garnizonu służącego królom perskim w V wieku p.n.e., ze świątynią ich Boga, JHW, na wyspie. W 410 roku p.n.e. kapłani Chnuma, przy przyzwoleniu perskiego namiestnika, zburzyli świątynię, a w 407 roku wspólnota napisała do Bagoasa, namiestnika Judy, i do synów Sanballata z Samarii z prośbą o pomoc w odbudowie. Dziś Asuan to miasto egipskiego południa poniżej Wysokiej Tamy, ukończonej w 1970 roku, która stworzyła jezioro Nasera; Elefantyna, z ruinami świątyni Chnuma i dzielnicą żydowską, jest badana przez niemieckie i szwajcarskie instytuty, a świątynie Fileae, zalewane przez zbiornik starej tamy, przeniesiono na wyższą wyspę."
  it:
    - "Siene, oggi Assuan, è la città alla prima cateratta del Nilo, molto a monte, dove il fiume si apre un varco nel granito e finisce l’Egitto propriamente detto e comincia la Nubia. Era la porta meridionale dell’Egitto, una città di mercato e di guarnigione, con le cave che davano ai faraoni il granito rosso dei loro obelischi, e di fronte a essa l’isola di Elefantina, Yeb per gli Egizi, con il tempio del dio-ariete Khnum e la sua fortezza. Strabone e Plinio riferiscono che a Siene il sole di mezzogiorno del solstizio d’estate stava a picco e illuminava il fondo di un pozzo, l’osservazione da cui Eratostene misurò le dimensioni della terra."
    - "Per Ezechiele Siene segna l’estremo limite dell’Egitto, come Dan e Bersabea segnano Israele: il paese sarà ridotto a deserto «da Migdol a Syene, fino alle frontiere dell’Etiopia», e «da Migdol a Syene essi cadranno per la spada»; l’ebraico legge «da Migdol a Siene», come ha la Bibbia sinodale, essendo Migdol la fortezza della frontiera settentrionale. In Isaia gli esuli torneranno: «questi altri vengon da settentrione e da occidente, e questi dal paese de’ Sinim». I lettori più antichi prendevano Sinim per una terra lontana, perfino la Cina; il grande rotolo di Isaia di Qumran legge Sewenim, gli abitanti di Siene, e la maggior parte delle versioni moderne lo segue, così che il profeta promette il ritorno dall’estremo sud dell’Egitto."
    - "Che ci fossero Giudei da far tornare da Siene è noto dai papiri aramaici trovati a Elefantina e ad Assuan dagli anni 1890: lettere, contratti ed elenchi di una guarnigione giudaica al servizio dei re persiani nel V secolo a.C., con un tempio del loro Dio, YHW, sull’isola. Nel 410 a.C. i sacerdoti di Khnum, con la connivenza del governatore persiano, distrussero il tempio, e nel 407 la comunità scrisse a Bagoa, governatore di Giuda, e ai figli di Sanballàt di Samaria per averne aiuto nella ricostruzione. Oggi Assuan è una città del sud egiziano sotto l’Alta Diga, ultimata nel 1970, che creò il lago Nasser; Elefantina, con le rovine del tempio di Khnum e del quartiere giudaico, è scavata da istituti tedeschi e svizzeri, e i templi di File, sommersi dal bacino della vecchia diga, furono spostati su un’isola più alta."
  nl:
    - "Syene, tegenwoordig Aswan, is de stad bij de Eerste Cataract van de Nijl, ver stroomopwaarts waar de rivier door graniet breekt en Egypte in eigenlijke zin eindigt en Nubië begint. Het was de zuidelijke poort van Egypte, een markt- en garnizoensstad, met de steengroeven die de farao’s het rode graniet voor hun obelisken leverden, en daartegenover het eiland Elephantine, bij de Egyptenaren Yeb, met zijn tempel van de ramsgod Chnoem en zijn vesting. Strabo en Plinius vermelden dat in Syene de middagzon op de zomerzonnewende recht boven het hoofd stond en de bodem van een put verlichtte, de waarneming waarmee Eratosthenes de grootte van de aarde mat."
    - "Voor Ezechiël markeert Syene het uiterste einde van Egypte, zoals Dan en Berseba dat van Israël doen: het land zal woest worden gemaakt “van den toren van Syene af, tot aan de landpale van Morenland”, en “van den toren van Syene af zullen zij daarin door het zwaard vallen”; het Hebreeuws leest van Migdol tot Syene, zoals de Synodale Bijbel het heeft, waarbij Migdol de vesting aan de noordgrens is. Bij Jesaja zullen de ballingen terugkeren “van het noorden en van het westen” en “uit het land van Sinim”. Oudere lezers namen Sinim voor een ver land, zelfs China; de grote Jesajarol uit Qumran leest Sewenim, het volk van Syene, en de meeste moderne vertalingen volgen die lezing, zodat de profeet terugkeer belooft uit het uiterste zuiden van Egypte."
    - "Dat er Joden waren om uit Syene terug te keren, is bekend uit de Aramese papyri die sinds de jaren 1890 op Elephantine en bij Aswan zijn gevonden: brieven, contracten en lijsten van een Joods garnizoen in dienst van de Perzische koningen in de vijfde eeuw v.Chr., met een tempel van hun God, YHW, op het eiland. In 410 v.Chr. verwoestten de priesters van Chnoem, met oogluikend toezien van de Perzische gouverneur, de tempel, en de gemeenschap schreef in 407 aan Bagoas, gouverneur van Juda, en aan de zonen van Sanballat van Samaria om hulp bij de herbouw. Nu ligt Aswan in het Egyptische zuiden onder de Hoge Dam, voltooid in 1970, die het Nassermeer schiep; Elephantine, met de ruïnes van de Chnoemtempel en de Joodse wijk, wordt door Duitse en Zwitserse instituten opgegraven, en de tempels van Filae, overstroomd door het stuwmeer van de oude dam, werden naar een hoger eiland verplaatst."
  cs:
    - "Syéné, dnešní Asuán, je město u První katarakty Nilu, daleko proti proudu, kde řeka proráží žulu, končí vlastní Egypt a začíná Núbie. Byla jižní branou Egypta, tržním a posádkovým městem, s lomy, které dávaly faraonům červenou žulu na jejich obelisky, a naproti ní leží ostrov Elefantiné, egyptsky Jeb, s chrámem beraního boha Chnuma a s pevností. Strabón a Plinius zaznamenávají, že v Syéné stálo polední slunce letního slunovratu přímo v nadhlavníku a osvětlovalo dno studny, což bylo pozorování, z něhož Eratosthenés změřil velikost Země."
    - "Pro Ezechiela Syéné označuje daleký konec Egypta, jako Dan a Beer-šeba označují Izrael: země bude zpustošena „od věže Sevéne až do pomezí Mouřenínského“ a „od věže Sevéne mečem padati budou v ní“; hebrejsky stojí „od Migdolu po Syénu“, jak to má synodální překlad, přičemž Migdol je pevnost na severní hranici. U Izajáše se mají vyhnanci vracet „onino od půlnoci a od moře, a jiní z země Sinim“. Starší vykladači pokládali Sinim za vzdálenou zemi, dokonce za Čínu; velký izajášský svitek z Kumránu čte Sewenim, lid Syéné, a většina moderních překladů ho následuje, takže prorok slibuje návrat z nejzazšího jihu Egypta."
    - "Že měli z Syéné koho navrátit Židé, je známo z aramejských papyrů nalezených na Elefantiné a v Asuánu od 90. let 19. století: dopisů, smluv a seznamů židovské posádky sloužící perským králům v 5. stol. př. n. l., s chrámem jejich Boha, JHW, na ostrově. V roce 410 př. n. l. kněží Chnuma se svolením perského místodržícího chrám zničili a obec napsala roku 407 Bagoasovi, místodržiteli Judy, a synům Sanbalatovým v Samaří o pomoc s jeho obnovením. Dnes je Asuán městem egyptského jihu pod Vysokou přehradou, dokončenou roku 1970, která vytvořila Násirovo jezero; Elefantiné, se zříceninami chrámu Chnumova a židovské čtvrti, zkoumají německé a švýcarské ústavy a chrámy na Filé, zaplavované nádrží staré přehrady, byly přeneseny na vyšší ostrov."
  sv:
    - "Syene, i dag Aswan, är staden vid Nilens första katarakt, långt uppströms där floden bryter igenom granit och det egentliga Egypten tar slut och Nubien börjar. Den var Egyptens södra port, en marknads- och garnisonsstad, med stenbrotten som gav faraonerna den röda granit som obeliskerna hugdes av, och mitt emot den ön Elefantine, Yeb för egyptierna, med sitt tempel åt vädurguden Khnum och sin fästning. Strabon och Plinius antecknar att middagssolen vid sommarsolståndet i Syene stod rakt upp och lyste ner på botten av en brunn, den iakttagelse som Eratosthenes mätte jordens storlek med."
    - "För Hesekiel markerar Syene Egyptens yttersta ände, som Dan och Beer Sheva markerar Israels: landet ska göras öde ”från Migdol till Sevene, fram till Etiopiens gräns”, och ”från Migdol till Sevene skola de som bo där falla för svärd”; hebreiskan lyder ”från Migdol till Syene”, som även den synodala bibeln har det, med Migdol som fästningen vid den norra gränsen. Hos Jesaja ska de landsflyktiga återvända ”somliga från norr och andra från väster, somliga ock från sinéernas land”. Äldre läsare tog Sinim för ett avlägset land, till och med Kina; den stora Jesajarullen från Qumran har Sewenim, Syenes folk, och de flesta moderna översättningar följer den, så att profeten utlovar återkomst från Egyptens yttersta söder."
    - "Att det fanns judar att återvända från Syene vet man från de arameiska papyrer som hittats på Elefantine och i Aswan sedan 1890-talet: brev, kontrakt och förteckningar från en judisk garnison i de persiska kungarnas tjänst på 400-talet f.Kr., med ett tempel åt deras Gud, YHW, på ön. År 410 f.Kr. förstörde Khnums präster templet, med den persiske guvernörens goda minne, och samfundet skrev 407 till Bagoas, guvernör i Juda, och till Sanballats söner i Samaria för att få hjälp att bygga upp det. I dag är Aswan en stad i södra Egypten nedanför Höga dammen, färdig 1970, som skapade Nassersjön; Elefantine, med ruinerna av Khnumtemplet och det judiska kvarteret, grävs ut av tyska och schweiziska institut, och templen på Philae, som översvämmades av den gamla dammens magasin, flyttades till en högre ö."
  nb:
    - "Syene, i dag Aswan, er byen ved Nilens første stryk, langt oppe i elven der den bryter gjennom granitt og det egentlige Egypt tar slutt og Nubia begynner. Den var Egypts sørlige port, en markeds- og garnisonsby, med steinbruddene som ga faraoene den røde granitten til obeliskene deres, og midt overfor den øya Elefantine, Yeb for egypterne, med tempelet til værguden Khnum og festningen. Strabon og Plinius beretter at ved Syene sto middagssolen ved sommersolverv rett over hodet og lyste opp bunnen av en brønn, observasjonen som Eratosthenes målte jordens størrelse ut fra."
    - "For Esekiel markerer Syene den ytterste enden av Egypt, slik Dan og Beer-Sjeba markerer Israel: landet skal gjøres øde «fra Migdol til Syene og like til Etiopias grense», og «fra Migdol til Syene skal de der falle for sverdet»; slik lyder det hebraiske, som synodalbibelen har det, og Migdol er festningen ved den nordlige grensen. Hos Jesaja skal de landflyktige vende tilbake «nogen fra nord og nogen fra vest og nogen fra Sinims land». Eldre lesere tok Sinim for et fjernt land, til og med Kina; den store Jesaja-rullen fra Qumran har Sewenim, folket i Syene, og de fleste moderne oversettelser følger den, slik at profeten lover hjemvending fra Egypts ytterste sør."
    - "At det fantes jøder som kunne vende tilbake fra Syene, er kjent fra de arameiske papyrusene funnet på Elefantine og ved Aswan fra 1890-årene: brev, kontrakter og lister fra en jødisk garnison i de persiske kongenes tjeneste på 400-tallet f.Kr., med et tempel for deres Gud, YHW, på øya. I 410 f.Kr. ødela Khnums prester, med den persiske guvernørens stilltiende samtykke, tempelet, og samfunnet skrev i 407 til Bagoas, guvernør i Juda, og til sønnene til Sanballat av Samaria for å be om hjelp til å bygge det opp igjen. I dag er Aswan en by i det egyptiske sør nedenfor Høydammen, ferdig i 1970, som skapte Nasser-sjøen; Elefantine, med ruinene av Khnum-tempelet og det jødiske kvarteret, utgraves av tyske og sveitsiske institutter, og tempelene på Philae, oversvømt av reservoaret til den gamle dammen, ble flyttet til en høyere øy."
  tl:
    - "Ang Seveneh, ang Aswan ngayon, ay ang bayan sa Unang Katarata ng Nilo, malayo sa itaas ng ilog kung saan ito bumabagtas sa granito at nagtatapos ang tunay na Egipto at nagsisimula ang Nubia. Ito ang timugang pintuan ng Egipto, isang bayan ng pamilihan at garison, na may mga tibagan na nagbigay sa mga paraon ng pulang granito para sa kanilang mga obelisko, at sa tapat nito ay ang pulo ng Elephantine, Yeb sa mga Ehipsiyo, na may templo ng diyos-tupa na si Khnum at kuta nito. Itinatala nina Estrabon at Plinio na sa Seveneh ang araw sa katanghaliang-tapat ng solstisyo ng tag-init ay tuwid na nasa itaas at nagliliwanag sa ilalim ng isang balon, ang obserbasyon na pinagbatayan ni Eratosthenes sa pagsukat ng laki ng daigdig."
    - "Para kay Ezekiel, ang Seveneh ang malayong dulo ng Egipto, gaya ng Dan at Beer-seba sa Israel: gagawing sira ang lupain “mula sa moog ng Seveneh hanggang sa hangganan ng Etiopia”, at “mula sa moog ng Seveneh ay mangabubuwal sila roon sa pamamagitan ng tabak”; ang Hebreo ay may “mula sa Migdol hanggang sa Seveneh”, gaya ng sa Synodal na Bibliya, na ang Migdol ay ang kuta sa hilagang hangganan. Sa Isaias, babalik ang mga ipinatapon “mula sa hilagaan, at mula sa kalunuran; at ang mga ito ay mula sa lupain ng Sinim”. Itinuring ng mga naunang mambabasa ang Sinim na malayong lupain, maging ang Tsina; ang dakilang balumbon ng Isaias mula sa Qumran ay may Sewenim, ang mga tao ng Seveneh, na sinusunod ng karamihan ng makabagong salin, kaya ipinangangako ng propeta ang pagbabalik mula sa pinakamalayong timog ng Egipto."
    - "Na may mga Judiong babalik mula sa Seveneh ay alam mula sa mga papirong Arameo na natagpuan sa Elephantine at Aswan mula dekada 1890: mga liham, kontrata at talaan ng garison na Judio na naglingkod sa mga haring Persiyano noong ika-5 siglo BK, may templo ng Diyos nilang si YHW sa pulo. Noong 410 BK, winasak ng mga saserdote ni Khnum ang templo sa pagkunsinti ng gobernador na Persiyano, at noong 407 ay sumulat ang pamayanan kay Bagoas, gobernador ng Juda, at sa mga anak ni Sanballat ng Samaria upang humingi ng tulong sa muling pagtatayo. Ang Aswan ngayon ay lunsod sa timog ng Egipto sa ibaba ng Mataas na Dam (1970), na lumikha sa Lawa ng Nasser; hinuhukay ng mga institusyong Aleman at Suwisa ang Elephantine, na may guho ng templo ni Khnum at ng purok ng mga Judio, at inilipat sa mas mataas na pulo ang mga templo ng Philae, na binaha ng imbakan ng lumang dam."
  da:
    - "Syene, i dag Aswan, er byen ved Nilens første katarakt, langt oppe ad floden, hvor den bryder gennem granit, og hvor Egypten i egentlig forstand ender og Nubien begynder. Det var Egyptens sydlige port, en markeds- og garnisonsby med de stenbrud, der gav faraoerne den røde granit til deres obelisker, og over for den lå øen Elefantine, Yeb for egypterne, med sit tempel for væderguden Khnum og sin fæstning. Strabon og Plinius beretter, at middagssolen ved sommersolhverv i Syene stod lige over hovedet og lyste ned til bunden af en brønd, den iagttagelse, hvorfra Eratosthenes målte jordens størrelse."
    - "For Ezekiel markerer Syene Egyptens yderste ende, som Dan og Beersheba markerer Israels: landet skal gøres øde fra Migdol til Syene og til Etiopiens grænse, og »fra Migdol til Syene skulle de falde der ved Sværdet«; Migdol var fæstningen ved den nordlige grænse, således lyder det hebraiske, og således har Synodalbibelen det. Hos Esajas skal de landflygtige vende tilbage »fra Norden og fra Vesten, og disse, de komme fra Sinas Land«. Ældre læsere tog Sinim for et fjernt land, endda Kina; den store Esajas-rulle fra Qumran læser Sewenim, folket i Syene, og de fleste moderne oversættelser følger den, så profeten lover hjemvendelse fra Egyptens yderste syd."
    - "At der var jøder, der kunne vende tilbage fra Syene, ved vi fra de arameiske papyrusser fundet på Elefantine og ved Aswan fra 1890'erne: breve, kontrakter og lister fra en jødisk garnison i de persiske kongers tjeneste i 400-tallet f.Kr., med et tempel for deres Gud, YHW, på øen. I 410 f.Kr. ødelagde Khnums præster med den persiske guvernørs stiltiende billigelse templet, og samfundet skrev i 407 til Bagoas, guvernør i Juda, og til Sanballats sønner i Samaria for at få hjælp til at genopbygge det. I dag er Aswan en by i det egyptiske syd neden for Højdæmningen, færdig i 1970, som skabte Nassersøen; Elefantine, med ruinerne af Khnum-templet og det jødiske kvarter, udgraves af tyske og schweiziske institutter, og Philaes templer, oversvømmet af den gamle dæmnings reservoir, blev flyttet til en højere ø."
