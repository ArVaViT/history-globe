body:
  en:
    - "Trogyllium was the Trogilian promontory, the western spur of Mount Mycale on the coast of Asia Minor, across a narrow strait from the island of Samos. Strabo calls it a kind of spur of Mycale, says that beyond it Mycale and Samos form a strait about seven stadia wide, and reckons the voyage from there across the Aegean to Cape Sunium at 1,600 stadia. It is the cape now called Dip Burnu, at the end of the Mycale ridge on the Dilek peninsula in Turkey, which is a national park."
    - "On Paul's last voyage to Jerusalem the ship sailed along the coast from island to island: “we sailed thence, and came the next day over against Chios; and the next day we arrived at Samos, and tarried at Trogyllium; and the next day we came to Miletus.” The words “and tarried at Trogyllium” are found in Codex Bezae and the Byzantine manuscripts that the King James Version follows, and in the Russian Synodal Bible, but not in the oldest manuscripts, such as Codex Sinaiticus and Codex Vaticanus, so most modern translations leave them out."
  ru:
    - "Трогиллий — Трогилийский мыс, западный отрог горы Микале на побережье Малой Азии, отделённый узким проливом от острова Самос. Страбон называет его своего рода отрогом Микале, пишет, что за ним Микале и Самос образуют пролив шириной около семи стадиев, и считает путь оттуда через Эгейское море до мыса Суний в 1600 стадиев. Это мыс, ныне называемый Дип-Бурну, на конце хребта Микале на полуострове Дилек в Турции, где теперь национальный парк."
    - "В последнем плавании Павла в Иерусалим корабль шёл вдоль берега от острова к острову: «отплыв оттуда, в следующий день мы остановились против Хиоса, а на другой пристали к Самосу и, побывав в Трогиллии, в следующий день прибыли в Милит». Слова о Трогиллии есть в Кодексе Безы и в византийских рукописях, которым следуют английская Библия короля Якова и Синодальный перевод, но их нет в древнейших рукописях, таких как Синайский и Ватиканский кодексы, поэтому большинство современных переводов их опускают."
  uk:
    - "Трогілій — це Трогілійський мис, західний відріг гори Мікале на березі Малої Азії, через вузьку протоку від острова Самос. Страбон називає його своєрідним відрогом Мікале, каже, що за ним Мікале й Самос утворюють протоку завширшки близько семи стадіїв, і обчислює плавання звідти через Егейське море до мису Суніон у 1600 стадіїв. Це мис, нині званий Діп-Бурну, на кінці хребта Мікале на півострові Дилек у Туреччині, що є національним парком."
    - "Під час останнього плавання Павла до Єрусалима корабель ішов уздовж узбережжя від острова до острова: «А відпливши звідтіля, причалили ми другого дня проти Хиоса, на другий же день поплили в Самос, та, побувши в Трогилиї, другого дня прийшли в Милет». Слова «та, побувши в Трогилиї» є в Кодексі Безі та у візантійських рукописах, яким слідує Біблія короля Якова, і в російській Синодальній Біблії, але не в найдавніших рукописах, як-от Синайський і Ватиканський кодекси, тож більшість сучасних перекладів їх опускає."
  es:
    - "Trogilio era el promontorio trogilio, el espolón occidental del monte Mícale en la costa de Asia Menor, al otro lado de un estrecho angosto de la isla de Samos. Estrabón lo llama una especie de espolón del Mícale, dice que más allá el Mícale y Samos forman un estrecho de unos siete estadios de ancho, y calcula la travesía desde allí a través del Egeo hasta el cabo Sunio en 1600 estadios. Es el cabo hoy llamado Dip Burnu, al final de la cresta del Mícale, en la península de Dilek, en Turquía, que es un parque nacional."
    - "En el último viaje de Pablo a Jerusalén, la nave navegó a lo largo de la costa de isla en isla: «navegando de allí, al día siguiente llegamos delante de Chîo, y al otro día tomamos puerto en Samo: y habiendo reposado en Trogilio, al día siguiente llegamos á Mileto». Las palabras «y habiendo reposado en Trogilio» se hallan en el Códice Beza y en los manuscritos bizantinos que sigue la versión King James, y en la Biblia sinodal rusa, pero no en los manuscritos más antiguos, como el Códice Sinaítico y el Códice Vaticano, por lo que la mayoría de las traducciones modernas las omiten."
  pt:
    - "Trogílio era o promontório trogiliano, o esporão ocidental do monte Mícale, na costa da Ásia Menor, do outro lado de um estreito pouco largo da ilha de Samos. Estrabão o chama de uma espécie de esporão do Mícale, diz que além dele o Mícale e Samos formam um estreito de cerca de sete estádios de largura e calcula a travessia dali pelo Egeu até o cabo Súnion em 1.600 estádios. É o cabo hoje chamado Dip Burnu, na extremidade da cordilheira do Mícale, na península de Dilek, na Turquia, que é um parque nacional."
    - "Na última viagem de Paulo a Jerusalém, o navio costeou de ilha em ilha: “Navegando dali, chegamos no dia seguinte diante de Quios. No outro dia, tocamos em Samos e ficamos em Trogílio, e no dia seguinte chegamos a Mileto.” As palavras “e ficamos em Trogílio” se encontram no Códice de Beza e nos manuscritos bizantinos que a Versão King James segue, e na Bíblia sinodal russa, mas não nos manuscritos mais antigos, como o Códice Sinaítico e o Códice Vaticano, de modo que a maioria das traduções modernas as omite."
  de:
    - "Trogyllion war das Trogilische Vorgebirge, der westliche Ausläufer des Mykale-Gebirges an der Küste Kleinasiens, durch eine schmale Meerenge von der Insel Samos getrennt. Strabon nennt es eine Art Ausläufer der Mykale, sagt, dahinter bildeten Mykale und Samos eine etwa sieben Stadien breite Meerenge, und rechnet die Fahrt von dort über die Ägäis zum Kap Sunion mit 1600 Stadien. Es ist das heute Dip Burnu genannte Kap am Ende des Mykale-Rückens auf der Dilek-Halbinsel in der Türkei, die ein Nationalpark ist."
    - "Auf der letzten Reise des Paulus nach Jerusalem fuhr das Schiff die Küste entlang von Insel zu Insel: „Und von da schifften wir und kamen des andern Tages hin gegen Chios; und des folgenden Tages stießen wir an Samos und blieben in Trogyllion; und des nächsten Tages kamen wir gen Milet.“ Die Worte „und blieben in Trogyllion“ stehen im Codex Bezae und in den byzantinischen Handschriften, denen die King-James-Bibel folgt, und in der russischen Synodalbibel, nicht aber in den ältesten Handschriften wie dem Codex Sinaiticus und dem Codex Vaticanus, sodass die meisten modernen Übersetzungen sie weglassen."
  fr:
    - "Trogylle était le promontoire troglien, l’éperon occidental du mont Mycale sur la côte d’Asie Mineure, de l’autre côté d’un étroit détroit en face de l’île de Samos. Strabon l’appelle une sorte d’éperon du Mycale, dit qu’au-delà de lui le Mycale et Samos forment un détroit d’environ sept stades de large, et compte la traversée de là, à travers l’Égée, jusqu’au cap Sounion à 1 600 stades. C’est le cap aujourd’hui appelé Dip Burnu, au bout de la crête du Mycale, sur la presqu’île de Dilek, en Turquie, qui est un parc national."
    - "Lors du dernier voyage de Paul vers Jérusalem, le navire longea la côte d’île en île : de là ils arrivèrent le lendemain en face de Chios, le jour suivant ils abordèrent à Samos et firent halte à Trogylle, et le lendemain ils vinrent à Milet. Les mots qui mentionnent la halte à Trogylle se trouvent dans le Codex de Bèze et les manuscrits byzantins que suit la version du roi Jacques, et dans la Bible synodale russe, mais non dans les plus anciens manuscrits, tels que le Codex Sinaïticus et le Codex Vaticanus, de sorte que la plupart des traductions modernes les omettent."
  it:
    - "Trogilio era il promontorio omonimo, lo sperone occidentale del monte Micale sulla costa dell’Asia Minore, di fronte all’isola di Samo, oltre un braccio di mare stretto. Strabone lo chiama una specie di sperone del Micale, dice che oltre di esso il Micale e Samo formano uno stretto largo circa sette stadi, e calcola la traversata di là attraverso l’Egeo fino a Capo Sunio in 1600 stadi. È il capo oggi detto Dip Burnu, all’estremità della dorsale del Micale nella penisola di Dilek, in Turchia, che è un parco nazionale."
    - "Nell’ultimo viaggio di Paolo a Gerusalemme la nave costeggiò da isola a isola: il giorno dopo giunse di fronte a Chio, il giorno seguente approdò a Samo e il giorno ancora seguente giunse a Mileto. La notizia di una sosta a Trogilio si trova nel Codice Beza e nei manoscritti bizantini seguiti dalla King James Version, e nella Bibbia sinodale russa, ma non nei manoscritti più antichi, come il Codice Sinaitico e il Codice Vaticano, perciò la maggior parte delle traduzioni moderne la omette."
  nl:
    - "Trogyllium was de Trogilische landtong, de westelijke uitloper van de berg Mykale aan de kust van Klein-Azië, over een smalle zeestraat tegenover het eiland Samos. Strabo noemt het een soort uitloper van Mykale, zegt dat Mykale en Samos daarachter een zeestraat van ongeveer zeven stadiën breed vormen, en rekent de overtocht vandaar over de Egeïsche Zee naar Kaap Sunion op 1600 stadiën. Het is de kaap die nu Dip Burnu heet, aan het einde van de Mykale-rug op het schiereiland Dilek in Turkije, dat een nationaal park is."
    - "Op Paulus' laatste reis naar Jeruzalem voer het schip langs de kust van eiland naar eiland: “En van daar afgescheept zijnde, kwamen wij den volgenden dag tegen Chios over, en des anderen daags legden wij aan te Samos, en bleven te Trogyllion, en den dag daaraan kwamen wij te Milete.” De woorden “en bleven te Trogyllion” staan in de Codex Bezae en de Byzantijnse handschriften die de King James Version volgt, en in de Russische Synodale Bijbel, maar niet in de oudste handschriften, zoals de Codex Sinaiticus en de Codex Vaticanus, zodat de meeste moderne vertalingen ze weglaten."
  pl:
    - "Trogilium było przylądkiem Trogilion, zachodnim ostrogiem góry Mykale na wybrzeżu Azji Mniejszej, po drugiej stronie wąskiej cieśniny od wyspy Samos. Strabon nazywa je rodzajem ostrogu Mykale, mówi, że za nim Mykale i Samos tworzą cieśninę szeroką na około siedem stadiów, i liczy rejs stamtąd przez Morze Egejskie do przylądka Sunion na 1600 stadiów. Jest to przylądek zwany dziś Dip Burnu, na końcu grzbietu Mykale na półwyspie Dilek w Turcji, który jest parkiem narodowym."
    - "W ostatniej podróży Pawła do Jerozolimy okręt płynął wzdłuż wybrzeża od wyspy do wyspy: „A stamtąd odpłynąwszy, drugiego dnia przyszliśmy przeciw Chyju, a trzeciego dnia przypłynęliśmy do Samu, a pomieszkawszy w Trogillu, nazajutrz przyszliśmy do Miletu”. Słowa „a pomieszkawszy w Trogillu” występują w Kodeksie Bezy i w rękopisach bizantyjskich, za którymi idzie Biblia Króla Jakuba, oraz w rosyjskiej Biblii synodalnej, lecz nie w najstarszych rękopisach, takich jak Kodeks Synajski i Watykański, więc większość współczesnych przekładów je pomija."
  cs:
    - "Trogylion byl Trogilský mys, západní výběžek hory Mykalé na pobřeží Malé Asie, naproti ostrovu Samos přes úzký průliv. Strabón jej nazývá jakýmsi výběžkem Mykalé, říká, že za ním tvoří Mykalé a Samos průliv široký asi sedm stadií, a počítá plavbu odtud přes Egeis k mysu Sunion na 1 600 stadií. Je to mys nyní zvaný Dip Burnu, na konci hřebene Mykalé na poloostrově Dilek v Turecku, který je národním parkem."
    - "Na Pavlově poslední cestě do Jeruzaléma loď plula podél pobřeží od ostrova k ostrovu: „A odtud plavíce se, druhý den byli jsme proti Chium, a třetího dne přistavili jsme bárku k Sámu, a pobyvše v Trogyllí, nazejtří přišli jsme do Milétu.“ Slova „a pobyvše v Trogyllí“ se nacházejí v Kodexu Bezově a v byzantských rukopisech, které následuje Bible krále Jakuba, a v ruské synodální Bibli, ale ne v nejstarších rukopisech, jako je Kodex sinajský a vatikánský, takže je většina moderních překladů vynechává."
  sv:
    - "Trogyllion var Trogilioriska udden, den västra utlöparen av berget Mykale på Mindre Asiens kust, tvärs över ett smalt sund från ön Samos. Strabon kallar den en sorts utlöpare av Mykale, säger att bortom den bildar Mykale och Samos ett sund omkring sju stadier brett, och räknar överfarten därifrån över Egeiska havet till Kap Sunion till 1 600 stadier. Det är udden som nu kallas Dip Burnu, vid änden av Mykaleryggen på Dilekhalvön i Turkiet, som är en nationalpark."
    - "På Paulus' sista resa till Jerusalem seglade skeppet längs kusten från ö till ö: ”Därifrån seglade vi vidare och kommo följande dag mitt för Kios. Dagen därefter lade vi till vid Samos; och sedan vi hade legat över i Trogyllium, kommo vi nästföljande dag till Miletus.” Orden ”sedan vi hade legat över i Trogyllium” finns i Codex Bezae och i de bysantinska handskrifter som King James-översättningen följer, och i den ryska synodala bibeln, men inte i de äldsta handskrifterna, såsom Codex Sinaiticus och Codex Vaticanus, så de flesta moderna översättningar utelämnar dem."
  nb:
    - "Trogyllion var Trogilion-forberget, den vestlige odden av Mykale-fjellet på kysten av Lilleasia, over et smalt sund fra øya Samos. Strabon kaller det en slags odd av Mykale, sier at hinsides den danner Mykale og Samos et sund omkring sju stadier bredt, og regner seilasen derfra over Egeerhavet til Kapp Sunion til 1600 stadier. Det er kappet som nå kalles Dip Burnu, i enden av Mykale-ryggen på Dilek-halvøya i Tyrkia, som er en nasjonalpark."
    - "På Paulus' siste reise til Jerusalem seilte skipet langs kysten fra øy til øy: «Og derfra seilte vi videre og kom den næste dag bent ut for Kios; annen dag gikk vi innom Samos og lå over i Trogillium, og kom dagen efter til Milet.» Ordene «og lå over i Trogillium» finnes i Codex Bezae og de bysantinske håndskriftene som King James-oversettelsen følger, og i den russiske synodalbibelen, men ikke i de eldste håndskriftene, som Codex Sinaiticus og Codex Vaticanus, så de fleste moderne oversettelser utelater dem."
  tl:
    - "Ang Trogilio ay ang tangos ng Trogilio, ang kanlurang sanga ng Bundok Mycale sa baybayin ng Asia Minor, sa kabila ng makipot na kipot mula sa pulo ng Samos. Tinatawag ito ni Estrabon na uri ng sanga ng Mycale, sinasabing sa kabila nito ay bumubuo ang Mycale at Samos ng kipot na mga pitong estadio ang luwang, at tinatayang 1,600 estadio ang paglalayag mula roon sa Dagat Aegeo hanggang Kapa ng Sunium. Ito ang kapang tinatawag ngayong Dip Burnu, sa dulo ng tagaytay ng Mycale sa tangway ng Dilek sa Turkey, na pambansang liwasan."
    - "Sa huling paglalayag ni Pablo sa Jerusalem, naglayag ang barko sa baybayin mula pulo hanggang pulo: “sumapit kami nang sumunod na araw sa tapat ng Chio; at nang kinabukasan ay nagsidaong kami sa Samo; at nang kinabukasan ay nagsirating kami sa Mileto.” Ang pagtigil sa Trogilio ay nasa Codex Bezae at sa mga manuskritong Byzantino na sinusunod ng King James Version, at sa Bibliyang Synodal na Ruso, ngunit wala sa pinakamatatandang manuskrito, gaya ng Codex Sinaiticus at Codex Vaticanus, kaya iniiwan ito ng karamihan ng makabagong salin."
  da:
    - "Trogyllion var Trogilia-forbjerget, den vestlige udløber af Mykale-bjerget på Lilleasiens kyst, over et smalt stræde fra øen Samos. Strabon kalder det en slags udløber af Mykale, siger, at Mykale og Samos hinsides det danner et stræde omkring syv stadier bredt, og regner sejlturen derfra over Ægæerhavet til Kap Sunion til 1.600 stadier. Det er det forbjerg, der nu hedder Dip Burnu, ved enden af Mykale-højderyggen på Dilek-halvøen i Tyrkiet, som er en nationalpark."
    - "På Paulus' sidste rejse til Jerusalem sejlede skibet langs kysten fra ø til ø: »Og vi sejlede derfra og kom den næste Dag lige ud for Kios; Dagen derpaa lagde vi til ved Samos og kom næste Dag til Milet.« Ordene om, at de blev i Trogyllion, findes i Codex Bezae og de byzantinske håndskrifter, som King James-oversættelsen følger, og i den russiske Synodalbibel, men ikke i de ældste håndskrifter, såsom Codex Sinaiticus og Codex Vaticanus, så de fleste moderne oversættelser udelader dem."
  sr:
    - "Тригилија је био тригилијски рт, западни огранак планине Микале на обали Мале Азије, преко уског мореуза од острва Самоса. Страбон га назива неком врстом огранка Микале, каже да иза њега Микала и Самос чине мореуз широк око седам стадија, и рачуна пловидбу одатле преко Егеја до рта Сунион на 1.600 стадија. То је рт који се данас зове Дип Бурну, на крају гребена Микале на полуострву Дилек у Турској, које је национални парк."
    - "На Павловом последњем путу у Јерусалим брод је пловио дуж обале од острва до острва: „И оданде одвезавши се дођосмо сутрадан према Хију; а други дан одвезосмо се у сам, и ноћисмо у Тригилију; и сутрадан дођосмо у Милит.“ Речи „и ноћисмо у Тригилију“ налазе се у Безином кодексу и византијским рукописима које следи Верзија краља Јакова, и у руској синодалној Библији, али не у најстаријим рукописима, као што су Синајски и Ватикански кодекс, па их већина савремених превода изоставља."
scripture:
  - Acts.20.15
sources:
