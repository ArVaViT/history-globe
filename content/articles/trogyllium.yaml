# Overview article (ADR 0007). Trogyllium is the Trogilian promontory of Mycale facing Samos (Strabo 14.1.12–13), today Dip Burnu (Pleiades); the words "tarried at Trogyllium" are in D and the Byzantine text of Acts 20:15, not in P74, Sinaiticus, Alexandrinus, Vaticanus or Ephraemi, which is stated.
