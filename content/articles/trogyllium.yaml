  - "Pleiades, 'Trogilion (promontory)' (the modern Dip Burnu, extending from the Mykale mountains opposite Samos)"
  - "E. J. Banks, 'Trogyllium', International Standard Bible Encyclopedia (1915) (several early manuscripts omit the words; Westcott and Hort omit them as a Western interpolation)"
  - "Wikipedia, 'Textual variants in the Acts of the Apostles', Acts 20:15 (the words in D P 049 and many minuscules; omitted by P74 א A B C E 33 1739)"
