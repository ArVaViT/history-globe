body:
  en:
    - "Naioth is known from a single story. The name, usually “Naioth in Ramah”, means something like “dwellings” or “pastures”, and it seems to have been not a town but a quarter or compound in Samuel's home town of Ramah where a band of prophets lived under his lead. The Targum understood it as a house of study; the Septuagint only transliterates. Nothing of it is known archaeologically. Samuel's Ramah is often identified with er-Ram, about 9 km north of Jerusalem, and Naioth is placed within a short distance of it."
    - "When David fled from Saul he “came to Samuel to Ramah, and told him all that Saul had done to him. And he and Samuel went and dwelt in Naioth”. Saul three times sent messengers to seize him, and each time, seeing “the company of the prophets prophesying, and Samuel standing as appointed over them”, they were overcome by the Spirit of God and prophesied too. Saul then went himself, and “the Spirit of God was upon him also, and he went on, and prophesied, until he came to Naioth in Ramah”, where he stripped off his clothes and lay naked all that day and night: “Wherefore they say, Is Saul also among the prophets?” From Naioth David fled to Jonathan."
    - "The story is the fullest glimpse the Bible gives of the prophetic bands of Samuel's day, like the company that met Saul near Gibeah “with a psaltery, and a tabret, and a pipe, and a harp”, and the sons of the prophets who gathered round Elisha later. Er-Ram today is a Palestinian town north of Jerusalem in the West Bank; nothing marks the site of Naioth."
  ru:
    - "Наваф известен по одному рассказу. Имя, обычно «Наваф в Раме», значит что-то вроде «жилища» или «пастбища», и, по-видимому, это был не город, а квартал или подворье в Раме, родном городе Самуила, где под его началом жил сонм пророков. Таргум понял его как дом учения; Септуагинта лишь передаёт имя буквами. Археологически о нём ничего не известно. Раму Самуила часто отождествляют с Эр-Рамом примерно в 9 км к северу от Иерусалима, и Наваф помещают недалеко от неё."
    - "Бежав от Саула, Давид «пришел к Самуилу в Раму и рассказал ему все, что делал с ним Саул. И пошел он с Самуилом, и остановились они в Навафе в Раме». Саул трижды посылал слуг взять его, и каждый раз, увидев «сонм пророков пророчествующих и Самуила, начальствующего над ними», они покорялись Духу Божию и сами начинали пророчествовать. Тогда Саул пошёл сам, «и на него сошел Дух Божий, и он шел и пророчествовал, доколе не пришел в Наваф в Раме», где снял одежды и весь день и всю ночь лежал неодетый: «поэтому говорят: „неужели и Саул во пророках?“» Из Навафа Давид бежал к Ионафану."
    - "Этот рассказ — самый полный в Библии взгляд на пророческие братства времён Самуила, вроде сонма, встретившего Саула у Гивы «и пред ними псалтирь и тимпан, и свирель и гусли», и сынов пророческих, собиравшихся позже вокруг Елисея. Эр-Рам сегодня — палестинский город к северу от Иерусалима на Западном берегу; место Навафа ничем не отмечено."
  uk:
    - "Наіот відомий з єдиної історії. Назва, зазвичай «Наіот у Рамі», означає щось на кшталт «оселі» або «пасовища», і, схоже, це було не місто, а квартал чи подвір'я в рідному місті Самуїла, Рамі, де під його проводом жила громада пророків. Таргум розумів її як дім навчання; Септуагінта лише транслітерує. Археологічно про нього нічого не відомо. Самуїлову Раму часто ототожнюють з ер-Рамом, приблизно за 9 км на північ від Єрусалима, а Наіот розташовують на невеликій відстані від неї."
    - "Коли Давид утік від Саула, він «пійшов до Самуїла в Раму та й оповів йому все, що чинив із ним Саул. І пійшов він із Самуїлом, і перебували вони в Наватї». Саул тричі посилав посланців схопити його, і щоразу, побачивши «громаду віщуючих пророків і Самуїла навперед їх», вони підпадали під владу Духа Божого і теж пророкували. Тоді Саул пішов сам, і «найшов і на його дух Божий, так що він, ідучи, все віщував, аж покіль прибув в Нават, у Рамі», де він скинув із себе одяг і лежав нагий увесь той день і всю ніч: «Тим і пійшла приповідка: Хиба й Саул у пророках?» З Наіоту Давид утік до Йонатана."
    - "Це найповніша картина пророчих громад за часів Самуїла, яку подає Біблія, подібних до гурту, що зустрів Саула поблизу Гіви, де «арфа, бубен, сопілка і гуслї», та до пророчих синів, що пізніше збиралися навколо Єлисея. Ер-Рам сьогодні — палестинське містечко на північ від Єрусалима на Західному березі; місце Наіоту нічим не позначене."
  es:
    - "Naiot se conoce por una sola historia. El nombre, por lo general «Najoth en Rama», significa algo como «moradas» o «pastos», y parece que no era una ciudad, sino un barrio o recinto de Ramá, la ciudad natal de Samuel, donde vivía una compañía de profetas bajo su dirección. El Targum lo entendió como una casa de estudio; la Septuaginta solo lo transcribe. No se sabe nada de él por la arqueología. La Ramá de Samuel se identifica a menudo con er-Ram, a unos 9 km al norte de Jerusalén, y Naiot se sitúa a poca distancia de ella."
    - "Cuando David huyó de Saúl, «vino á Samuel en Rama, y díjole todo lo que Saúl había hecho con él. Y fuéronse él y Samuel, y moraron en Najoth». Saúl envió tres veces mensajeros para apresarlo, y cada vez, al ver «una compañía de profetas que profetizaban, y á Samuel que estaba allí, y los presidía», el espíritu de Dios vino sobre ellos y también profetizaron. Entonces fue el mismo Saúl, y «también vino sobre él el espíritu de Dios, é iba profetizando, hasta que llegó á Najoth en Rama», donde se despojó de sus vestidos y cayó desnudo todo aquel día y toda aquella noche: «De aquí se dijo: ¿También Saúl entre los profetas?». Desde Naiot David huyó a Jonatán."
    - "El relato es la visión más completa que da la Biblia de las compañías proféticas del tiempo de Samuel, como la que encontró a Saúl cerca de Gabaa «delante de ellos salterio, y adufe, y flauta, y arpa», y los hijos de los profetas que más tarde se reunieron en torno a Eliseo. Hoy er-Ram es una población palestina al norte de Jerusalén, en Cisjordania; nada señala el lugar de Naiot."
  pt:
    - "Naiote é conhecida por uma única história. O nome, geralmente “Naiote, em Ramá”, significa algo como “moradas” ou “pastagens”, e parece ter sido não uma cidade, mas um bairro ou complexo em Ramá, a cidade natal de Samuel, onde vivia um grupo de profetas sob a sua direção. O Targum a entendeu como uma casa de estudo; a Septuaginta apenas a transliterou. Nada dela se conhece arqueologicamente. A Ramá de Samuel é muitas vezes identificada com er-Ram, a cerca de 9 km ao norte de Jerusalém, e Naiote é situada a pouca distância dela."
    - "Quando Davi fugiu de Saul, “foi a Samuel em Ramá, relatando-lhe tudo o que Saul lhe havia feito. E ele e Samuel foram morar em Naiote”. Três vezes Saul enviou mensageiros para prendê-lo, e todas as vezes, ao ver “um grupo de profetas profetizando, com Samuel presidindo o grupo”, eles foram tomados pelo Espírito de Deus e também profetizaram. Então Saul foi pessoalmente, e “o Espírito de Deus desceu também sobre ele, e ele continuou o caminho profetizando, até chegar a Naiote, em Ramá”, onde tirou as vestes e ficou deitado nu todo aquele dia e toda aquela noite: “Por isso dizem: ‘Está Saul também entre os profetas?’” De Naiote Davi fugiu para junto de Jônatas."
    - "A história é o vislumbre mais completo que a Bíblia dá dos grupos de profetas do tempo de Samuel, como o que encontrou Saul perto de Gibeá, “precedidos por liras, tamborins, flautas e harpas”, e os filhos dos profetas que mais tarde se reuniram em torno de Eliseu. Hoje er-Ram é uma cidade palestina ao norte de Jerusalém, na Cisjordânia; nada assinala o local de Naiote."
  de:
    - "Najot ist nur aus einer einzigen Erzählung bekannt. Der Name, meist „Najot in Rama“, bedeutet etwa „Wohnstätten“ oder „Weiden“ und bezeichnet offenbar keine Stadt, sondern ein Viertel oder Gehöft in Samuels Heimatstadt Rama, wo unter seiner Leitung eine Schar von Propheten lebte. Das Targum verstand es als Lehrhaus; die Septuaginta gibt es nur in Lautschrift wieder. Archäologisch ist nichts davon bekannt. Samuels Rama wird oft mit er-Ram gleichgesetzt, etwa 9 km nördlich von Jerusalem, und Najot wird in geringer Entfernung davon angesetzt."
    - "Als David vor Saul floh, „kam [er] zu Samuel nach Rama und sagte ihm an alles, was ihm Saul getan hatte. Und er ging hin mit Samuel, und sie blieben zu Najoth“. Dreimal sandte Saul Boten, um ihn zu ergreifen, und jedes Mal wurden sie, als sie „den Chor der Propheten weissagen“ sahen, „und Samuel war ihr Vorsteher“, vom Geist Gottes ergriffen und weissagten ebenfalls. Da ging Saul selbst hin, und „der Geist Gottes kam auch auf ihn, und er ging einher und weissagte, bis er kam gen Najoth in Rama“, wo er seine Kleider auszog und den ganzen Tag und die ganze Nacht nackt dalag: „Daher spricht man: Ist Saul auch unter den Propheten?“ Von Najot floh David zu Jonatan."
    - "Die Erzählung ist der ausführlichste Einblick, den die Bibel in die Prophetenscharen zur Zeit Samuels gibt, wie in die Schar, die Saul bei Gibea begegnete, „vor ihnen her Psalter und Pauke und Flöte und Harfe“, und die Prophetenjünger, die sich später um Elisa versammelten. Er-Ram ist heute eine palästinensische Stadt nördlich von Jerusalem im Westjordanland; nichts markiert die Stätte von Najot."
  fr:
    - "Najoth n’est connue que par un seul récit. Le nom, le plus souvent « Najoth, près de Rama », signifie à peu près « demeures » ou « pâturages », et il semble désigner non une ville mais un quartier ou un enclos de Rama, la ville de Samuel, où vivait sous sa direction une troupe de prophètes. Le Targum y vit une maison d’étude ; la Septante se borne à transcrire. On n’en sait rien par l’archéologie. La Rama de Samuel est souvent identifiée à er-Ram, à environ 9 km au nord de Jérusalem, et Najoth est située à courte distance."
    - "Quand David s’enfuit loin de Saül, il « se rendit auprès de Samuel à Rama, et lui raconta tout ce que Saül lui avait fait. Puis il alla avec Samuel demeurer à Najoth ». Saül envoya trois fois des gens pour le prendre, et chaque fois, voyant « une assemblée de prophètes qui prophétisaient, ayant Samuel à leur tête », ils furent saisis par l’esprit de Dieu et prophétisèrent eux aussi. Saül y alla alors lui-même, et « l’esprit de Dieu fut aussi sur lui ; et Saül continua son chemin en prophétisant, jusqu’à son arrivée à Najoth, près de Rama », où il ôta ses vêtements et resta nu par terre tout ce jour et toute la nuit : « C’est pourquoi l’on dit : Saül est-il aussi parmi les prophètes ? » De Najoth, David s’enfuit auprès de Jonathan."
    - "Le récit est l’aperçu le plus complet que donne la Bible des troupes de prophètes du temps de Samuel, comme celle qui rencontra Saül près de Guibea, « précédés du luth, du tambourin, de la flûte et de la harpe », et les fils des prophètes qui se rassemblèrent plus tard autour d’Élisée. Er-Ram est aujourd’hui une ville palestinienne au nord de Jérusalem, en Cisjordanie ; rien ne marque l’emplacement de Najoth."
  it:
    - "Naiot è nota da un solo racconto. Il nome, di solito «Naioth presso Rama», significa qualcosa come «dimore» o «pascoli», e sembra che non fosse una città ma un quartiere o un recinto di Rama, la città natale di Samuele, dove viveva sotto la sua guida una schiera di profeti. Il Targum la intese come una casa di studio; la Settanta si limita a traslitterare. Nulla se ne sa dal punto di vista archeologico. La Rama di Samuele è spesso identificata con er-Ram, circa 9 km a nord di Gerusalemme, e Naiot è collocata a breve distanza da essa."
    - "Quando Davide fuggì da Saul, «venne da Samuele a Rama, e gli raccontò tutto quello che Saul gli avea fatto. Poi, egli e Samuele andarono a stare a Naioth». Saul inviò per tre volte dei messi per catturarlo, e ogni volta, vedendo «l’adunanza de’ profeti che profetavano, con Samuele che tenea la presidenza», furono investiti dallo spirito di Dio e si misero anch’essi a profetare. Allora Saul andò di persona, e «lo spirito di Dio investì anche lui; ed egli continuò il suo viaggio, profetando, finché giunse a Naioth, presso Rama», dove si spogliò delle vesti e giacque nudo tutto quel giorno e tutta quella notte: «Donde il detto: “Saul è anch’egli tra i profeti?”» Da Naiot Davide fuggì da Gionata."
    - "Il racconto è lo scorcio più ampio che la Bibbia offra delle schiere profetiche ai tempi di Samuele, come i profeti che Saul incontrò presso Gabaa, «preceduti da saltèri, da timpani, da flauti, da cetre», e i figli dei profeti che più tardi si radunarono attorno a Eliseo. Er-Ram è oggi una città palestinese a nord di Gerusalemme, in Cisgiordania; nulla segnala il sito di Naiot."
  pl:
    - "Najot znane jest z jednej tylko opowieści. Nazwa, zwykle w brzmieniu „Najot w Ramacie”, znaczy mniej więcej „siedziby” lub „pastwiska”, a samo miejsce wydaje się nie miastem, lecz dzielnicą albo zabudowaniami w rodzinnej Ramie Samuela, gdzie pod jego kierownictwem mieszkała gromada proroków. Targum rozumiał to jako dom nauki; Septuaginta tylko przepisuje nazwę. Archeologicznie nic o nim nie wiadomo. Ramę Samuela utożsamia się często z er-Ram, około 9 km na północ od Jerozolimy, a Najot umieszcza się w niewielkiej odległości od niej."
    - "Gdy Dawid uciekał przed Saulem, „przyszedł do Samuela, do Ramaty, i oznajmił mu wszystko, co mu czynił Saul. Poszedł tedy on i Samuel, a mieszkali w Najot”. Saul trzykrotnie wysyłał posłów, by go pojmali, a za każdym razem, gdy ujrzeli „gromadę proroków prorokujących, i Samuela stojącego, a przełożonego nad nimi”, ogarniał ich Duch Boży i prorokowali także oni. Wtedy Saul poszedł sam, i „przyszedł też nań Duch Boży; a tak idąc dalej prorokował, aż przyszedł do Najot w Ramacie”, gdzie zdjął z siebie szaty i leżał nagi przez cały ten dzień i całą noc: „stądże weszło w przypowieść: Azaż i Saul między prorokami?”. Z Najot Dawid uciekł do Jonatana."
    - "Opowieść ta jest najpełniejszym ukazaniem, jakie daje Biblia, gromad prorockich z czasów Samuela, takich jak ta, która spotkała Saula koło Gibea, gdy „przed nimi” szła „harfa, i bęben, i piszczałka, i lutnia”, oraz synów prorockich, którzy później gromadzili się wokół Elizeusza. Er-Ram jest dziś palestyńskim miastem na północ od Jerozolimy, na Zachodnim Brzegu; nic nie znaczy miejsca, gdzie było Najot."
  cs:
    - "Najot je známo z jediného příběhu. Jméno, obvykle „Náiot v Ráma“, znamená asi „příbytky“ nebo „pastviny“ a zdá se, že to nebylo město, ale čtvrť či areál v Samuelově rodném městě Rámě, kde pod jeho vedením žila skupina proroků. Targum je chápal jako dům studia, Septuaginta jméno jen přepisuje. Archeologicky o něm není nic známo. Samuelova Ráma se často ztotožňuje s er-Rámem, asi 9 km severně od Jeruzaléma, a Najot se klade do jeho těsné blízkosti."
    - "Když David utíkal před Saulem, „přišed k Samuelovi do Ráma, oznámil jemu všecko, co mu Saul učinil. I odšel on i Samuel, a bydlili v Náiot“. Saul třikrát poslal posly, aby ho jali, a pokaždé, když viděli „zástup proroků prorokujících, a Samuele jim představeného, an stojí“, přemohl je Duch Boží a prorokovali také. Pak šel Saul sám a „sstoupil i na něj Duch Boží, a jda dále, prorokoval, až i přišel do Náiot v Ráma“, kde svlékl roucho a ležel svlečený celý ten den a noc: „Odkudž se říká: Zdali také Saul mezi proroky?“ Z Najotu David utekl k Jonatanovi."
    - "Příběh je nejúplnějším pohledem, jaký Bible poskytuje na prorocké skupiny Samuelovy doby, podobně jako zástup, který potkal Saula u Gibey, „loutna, buben i píšťalka a harfa“, a synové proroků, kteří se později shromažďovali kolem Elíši. Er-Rám je dnes palestinské město severně od Jeruzaléma na Západním břehu; místo Najotu nic neoznačuje."
  nl:
    - "Najot is uit één verhaal bekend. De naam, meestal “Najoth bij Rama”, betekent zoiets als “woonplaatsen” of “weiden”, en het was kennelijk geen stad maar een wijk of terrein in Samuëls woonplaats Rama, waar een groep profeten onder zijn leiding woonde. De Targoem verstond het als een studiehuis; de Septuaginta geeft alleen een transcriptie. Archeologisch is er niets van bekend. Samuëls Rama wordt vaak gelijkgesteld met er-Ram, ongeveer 9 km ten noorden van Jeruzalem, en Najot wordt op korte afstand daarvan gezocht."
    - "Toen David voor Saul vluchtte, “hij kwam tot Samuel te Rama, en hij gaf hem te kennen al wat Saul hem gedaan had; en hij en Samuel gingen heen, en zij bleven te Najoth”. Saul zond driemaal boden om hem te grijpen, en telkens, toen ze “een vergadering van profeten, profeterende, en Samuel staande, over hen gesteld” zagen, werden ze door de Geest Gods overweldigd en profeteerden ook. Toen ging Saul zelf, en “dezelfde Geest Gods was ook op hem, en hij, al voortgaande, profeteerde, totdat hij te Najoth in Rama kwam”, waar hij zijn kleren uittrok en die hele dag en nacht naakt neerlag: “Daarom zegt men: Is Saul ook onder de profeten?” Vanuit Najot vluchtte David naar Jonatan."
    - "Het verhaal geeft de volledigste blik die de Bijbel biedt op de profetengroepen uit Samuëls tijd, zoals het gezelschap dat Saul bij Gibea tegenkwam “voor hun aangezichten luiten, en trommelen, en pijpen, en harpen”, en de profetenzonen die zich later rond Elisa verzamelden. Er-Ram is tegenwoordig een Palestijnse stad ten noorden van Jeruzalem op de Westelijke Jordaanoever; niets markeert de plaats van Najot."
  sv:
    - "Najot är känt från en enda berättelse. Namnet, vanligen ”Najot vid Rama”, betyder ungefär ”boningar” eller ”betesmarker”, och det förefaller inte ha varit en stad utan ett kvarter eller en gård i Samuels hemstad Rama där en skara profeter levde under hans ledning. Targum uppfattade det som ett studiehus; Septuaginta translittererar bara. Ingenting är känt om det arkeologiskt. Samuels Rama identifieras ofta med er-Ram, cirka 9 km norr om Jerusalem, och Najot placeras på kort avstånd därifrån."
    - "När David flydde från Saul ”begav han sig till Samuel i Rama och omtalade för denne allt vad Saul hade gjort honom. Och han och Samuel gingo till Najot och stannade där”. Saul sände tre gånger bud för att gripa honom, och varje gång, när de ”fingo se skaran av profeterna i profetisk hänryckning, och fingo se Samuel stå där såsom deras anförare”, kom Guds Ande över dem, och de fattades av hänryckning. Saul gick då själv, och ”Guds Ande kom också över honom, så att han hela vägen gick i profetisk hänryckning, ända till dess att han kom fram till Najot vid Rama”, där han kastade av sig kläderna och låg naken hela den dagen och natten: ”Därför plägar man säga: ’Är ock Saul bland profeterna?’” Från Najot flydde David till Jonatan."
    - "Berättelsen är den fylligaste inblick Bibeln ger i profetskarorna på Samuels tid, liksom skaran som mötte Saul nära Giva ”med psaltare, puka, flöjt och harpa före sig”, och profetlärjungarna som samlades kring Elisha senare. Er-Ram är i dag en palestinsk stad norr om Jerusalem på Västbanken; ingenting markerar platsen för Najot."
  nb:
    - "Najot er kjent fra én eneste fortelling. Navnet, vanligvis «Najot i Rama», betyr noe i retning av «boliger» eller «beitemarker», og det synes ikke å ha vært en by, men et kvarter eller en gård i Samuels hjemby Rama, der en flokk profeter bodde under hans ledelse. Targum forsto det som et studiehus; Septuaginta translittererer bare. Ingenting er kjent om det arkeologisk. Samuels Rama identifiseres ofte med er-Ram, omtrent 9 km nord for Jerusalem, og Najot plasseres i kort avstand fra den."
    - "Da David flyktet fra Saul, «kom han til Samuel i Rama og fortalte ham alt hvad Saul hadde gjort mot ham, og han og Samuel tok avsted til Nevajot og bodde der». Saul sendte tre ganger bud for å gripe ham, og hver gang, da de så «profetenes skare, som var i profetisk henrykkelse, og Samuel stående der som deres fører», ble de overveldet av Guds Ånd og profeterte også. Saul gikk så selv, og da «kom Guds Ånd også over ham, så at han hele veien gikk i profetisk henrykkelse til han kom til Nevajot ved Rama», der han rev av seg klærne og lå naken hele den dagen og natten: «derfor sier folk: Er også Saul blandt profetene?» Fra Najot flyktet David til Jonatan."
    - "Fortellingen er Bibelens fyldigste glimt av profetskarene på Samuels tid, som flokken som møtte Saul nær Gibea «med harpe og tromme og fløite og citar foran sig», og profetsønnene som senere samlet seg rundt Elisja. Er-Ram er i dag en palestinsk by nord for Jerusalem på Vestbredden; ingenting markerer stedet for Najot."
  tl:
    - "Ang Najoth ay kilala mula sa isang kuwento lamang. Ang pangalan, na karaniwang “Najoth sa Rama”, ay nangangahulugan ng tulad ng “mga tirahan” o “mga pastulan”, at tila hindi ito isang bayan kundi isang distrito o looban sa Rama, ang sariling bayan ni Samuel, kung saan nakatira ang isang pangkat ng mga propeta sa ilalim ng kaniyang pamumuno. Inunawa ito ng Targum bilang isang bahay-aralan; isinatitik lamang ito ng Septuagint. Walang nalalaman tungkol dito sa arkeolohiya. Ang Rama ni Samuel ay madalas ikilala sa er-Ram, mga 9 km sa hilaga ng Jerusalem, at inilalagay ang Najoth sa maikling layo mula rito."
    - "Nang tumakas si David kay Saul, siya ay “naparoon kay Samuel sa Rama, at isinaysay sa kaniya ang lahat ng ginawa ni Saul sa kaniya. At siya at si Samuel ay yumaon at tumahan sa Najoth”. Tatlong ulit na nagsugo si Saul ng mga sugo upang dakpin siya, at sa bawat pagkakataon, nang makita “ang pulutong ng mga propeta na nanganghuhula, at si Samuel ay tumatayong pinakapangulo sa kanila”, dumating sa kanila ang Espiritu ng Dios at nanghula rin sila. Pagkatapos ay si Saul na mismo ang pumunta, at “ang Espiritu ng Dios ay dumating din sa kaniya, at siya'y nagpatuloy, at nanghula hanggang sa siya'y dumating sa Najoth sa Rama”, kung saan hinubad niya ang kaniyang mga suot at nahigang hubad sa buong araw at gabing iyon: “Kaya't kanilang sinasabi, Pati ba si Saul ay nasa gitna ng mga propeta?” Mula sa Najoth tumakas si David kay Jonathan."
    - "Ang kuwento ang pinakamalawak na sulyap na ibinibigay ng Bibliya sa mga pangkat ng propeta noong kapanahunan ni Samuel, gaya ng pulutong na sumalubong kay Saul malapit sa Gibea “na may salterio, at pandereta, at flauta, at alpa”, at ang mga anak ng mga propeta na nagtipon sa palibot ni Eliseo nang huli. Ang er-Ram ay isang bayang Palestino ngayon sa hilaga ng Jerusalem sa West Bank; walang nagmamarka sa lugar ng Najoth."
  da:
    - "Najot kendes fra en enkelt fortælling. Navnet, sædvanligvis »Najot i Rama«, betyder noget i retning af »boliger« eller »græsgange«, og det synes ikke at have været en by, men et kvarter eller en indhegning i Samuels hjemby Rama, hvor en flok profeter boede under hans ledelse. Targum forstod det som et studiehus; Septuaginta gengiver det blot i translitteration. Intet er arkæologisk kendt om det. Samuels Rama identificeres ofte med er-Ram, omkring 9 km nord for Jerusalem, og Najot placeres i kort afstand fra den."
    - "Da David flygtede fra Saul, »kom til Samuel i Rama og gav ham alt det til Kende, som Saul havde gjort ham; og han og Samuel gik hen, og de bleve i Najoth«. Saul sendte tre gange bud for at gribe ham, og hver gang, da de så »en Forsamling af Profeter, som profeterede, og Samuel, som var sat over dem, stod hos«, blev de overvældet af Guds ånd og profeterede også. Saul gik da selv, og »Guds Aand kom ogsaa over ham, og han vedblev at gaa og profetere, indtil han kom til Najoth i Rama«, hvor han trak sit tøj af og lå nøgen hele den dag og hele den nat: »derfor siger man: Er Saul ogsaa iblandt Profeterne?« Fra Najot flygtede David til Jonatan."
    - "Fortællingen er Bibelens fyldigste glimt af profetflokkene i Samuels tid, ligesom flokken, der mødte Saul nær Gibea med »Salter og Tromme og Pibe og Harpe«, og de profeternes sønner, der senere samledes om Elisa. Er-Ram er i dag en palæstinensisk by nord for Jerusalem på Vestbredden; intet markerer Najots sted."
  sr:
    - "Најот је познат из само једне приче. Име, обично „Најот у Рами“, значи нешто као „станови“ или „пашњаци“, а изгледа да то није био град него четврт или обор у Самуиловом родном граду Рами, где је дружина пророка живела под његовим вођством. Таргум га је схватио као дом учења; Септуагинта његово име само транслитерује. О њему се археолошки не зна ништа. Самуилова Рама често се поистовећује с ер-Рамом, око 9 км северно од Јерусалима, а Најот се смешта на малу удаљеност од ње."
    - "Кад је Давид бежао од Саула, „дође к Самуилу у Раму, и приповеди му све што му је учинио Саул. И отидоше он и Самуило, и осташе у Најоту“. Саул је три пута слао људе да га ухвате, и сваки пут, видећи „збор пророка где пророкују, а Самуило им старешина“, обузео их је Дух Божји те су и они пророковали. Затим је Саул пошао сам, и „на њега сиђе дух Божји, те идући даље пророкова докле дође у Најот у Рами“, где је скинуо хаљине и лежао го цео тај дан и ноћ: „Стога се говори: Еда ли је и Саул међу пророцима?“ Из Најота је Давид побегао Јонатану."
    - "Прича је најпотпунији увид који Библија даје у пророчке дружине Самуиловог доба, попут оне која је срела Саула код Гаваје „а пред њима псалтири и бубњи и свирале и гусле“, и синова пророчких који су се касније окупљали око Јелисија. Ер-Рам је данас палестински град северно од Јерусалима на Западној обали; ништа не означава место Најота."
  hu:
    - "Najót egyetlen történetből ismert. A név, általában „Najót Rámában”, nagyjából „lakóhelyeket” vagy „legelőket” jelent, és úgy tűnik, nem város volt, hanem Sámuel szülővárosának, Rámának egy negyede vagy telepe, ahol prófétai csoport élt az ő vezetése alatt. A Targum tanházként értelmezte; a Szeptuaginta csupán átírja. Régészetileg semmi sem ismert belőle. Sámuel Rámáját gyakran azonosítják er-Rammal, Jeruzsálemtől mintegy 9 km-re északra, és Najótot ennek közelében keresik."
    - "Amikor Dávid Saul elől menekült, „elment Sámuelhez Rámába, és elbeszélte néki mindazt, a mit Saul vele cselekedett. Elméne ezután ő és Sámuel, és Nájóthban tartózkodának”. Saul háromszor küldött követeket, hogy megfogják, és mindannyiszor, amikor meglátták „a prófétáknak seregét, a kik prófétálának, és Sámuelt, a ki ott állott, mint az ő előljárójuk”, rájuk szállt az Isten lelke, és ők is prófétáltak. Saul ekkor maga ment el, és „az Istennek lelke szálla ő reá is, és folytonosan prófétála, míg eljutott Nájóthba, Rámában”, ahol levetette ruháit, és meztelenül feküdt egész nap és egész éjjel: „Azért mondják: Avagy Saul is a próféták közt van-é?” Najótból Dávid Jonatánhoz menekült."
    - "A történet a legteljesebb bepillantás, amelyet a Biblia a Sámuel korabeli prófétai csoportokba ad, mint amilyen az a sereg is volt, amely Gibea közelében találkozott Saullal „lant, dob, síp és hárfa” hangjával, vagy amilyenek a próféták fiai, akik később Elizeus köré gyűltek. Er-Ram ma palesztin város Jeruzsálemtől északra, Ciszjordániában; semmi sem jelöli Najót helyét."
  fi:
    - "Najot tunnetaan vain yhdestä kertomuksesta. Nimi, yleensä ”Najot Ramassa”, merkitsee jotakuinkin ”asumuksia” tai ”laitumia”, ja se näyttää olleen ei kaupunki vaan kaupunginosa tai pihapiiri Samuelin kotikaupungissa Ramassa, jossa profeettojen joukko asui hänen johdollaan. Targum käsitti sen opintotaloksi; Septuaginta vain translitteroi sen. Arkeologisesti siitä ei tiedetä mitään. Samuelin Rama tunnistetaan usein er-Ramiksi, noin 9 km Jerusalemista pohjoiseen, ja Najotin arvellaan sijainneen sen lähistöllä."
    - "Kun Daavid pakeni Saulia, hän ”meni Samuelin luo Raamaan ja kertoi hänelle kaikki, mitä Saul oli hänelle tehnyt. Ja hän ja Samuel menivät Naajotiin ja jäivät sinne”. Saul lähetti kolme kertaa sanansaattajia ottamaan hänet kiinni, ja joka kerta nämä näkivät ”profeettain joukon hurmoksissa ja Samuelin seisovan johtamassa heitä”, ja Jumalan Henki valtasi heidät ja he profetoivat hekin. Silloin Saul lähti itse, ja ”Jumalan henki tuli häneenkin, niin että hän kulki hurmoksissa, kunnes tuli Raaman Naajotiin”, jossa hän riisui vaatteensa ja makasi alastonna koko sen päivän ja yön: ”Sentähden on tapana sanoa: Onko Saulkin profeettain joukossa?” Najotista Daavid pakeni Jonatanin luo."
    - "Kertomus on Raamatun täydellisin vilkaisu Samuelin ajan profeettajoukkoihin, samoin kuin joukko, joka kohtasi Saulin lähellä Gibeaa ja jonka edellä kulki ”harppu, vaskirumpu, huilu ja kannel”, ja profeetanoppilaat, jotka kokoontuivat myöhemmin Elisan ympärille. Er-Ram on nykyään palestiinalaiskaupunki Jerusalemin pohjoispuolella Länsirannalla; mikään ei merkitse Najotin paikkaa."
  vi:
    - "Na-giốt chỉ được biết qua một câu chuyện. Tên này, thường là “Na-giốt trong Ra-ma”, có nghĩa đại khái là “nơi cư ngụ” hay “đồng cỏ”, và dường như không phải một thành mà là một khu hay một khuôn viên trong Ra-ma, quê của Sa-mu-ên, nơi một nhóm tiên tri sống dưới sự dẫn dắt của ông. Targum hiểu đó là một nhà học tập; bản Bảy Mươi chỉ phiên âm. Về mặt khảo cổ thì không biết gì về nơi này. Ra-ma của Sa-mu-ên thường được đồng nhất với er-Ram, cách Giê-ru-sa-lem khoảng 9 km về phía bắc, và Na-giốt được đặt trong khoảng cách ngắn quanh đó."
    - "Khi Đa-vít trốn Sau-lơ, ông “đi đến nhà Sa-mu-ên tại Ra-ma, rồi thuật cho người mọi điều Sau-lơ đã làm cho mình. Đoạn, người và Sa-mu-ên đi, ở tại Na-giốt”. Sau-lơ ba lần sai sứ đến bắt ông, và mỗi lần, khi thấy “một đám tiên tri đang nói tiên tri, và Sa-mu-ên đứng đầu những người ấy”, họ bị Thần của Đức Chúa Trời cảm động và cũng nói tiên tri. Sau đó chính Sau-lơ đến, và “Thần của Đức Chúa Trời cảm động đến phiên người, người cứ đi dọc đường nói tiên tri cho đến khi tới Na-giốt trong Ra-ma”, ở đó ông lột áo và nằm trần suốt ngày đêm ấy: “Bởi cớ ấy, có câu tục ngữ rằng: Sau-lơ há cũng vào hàng các tiên tri sao?” Từ Na-giốt, Đa-vít chạy đến với Giô-na-than."
    - "Câu chuyện là cái nhìn đầy đủ nhất mà Kinh Thánh cho về các nhóm tiên tri thời Sa-mu-ên, như đám người gặp Sau-lơ gần Ghi-bê-a với “đàn sắt, trống cơm, ống sáo, và đàn cầm”, và các môn đồ của những tiên tri tụ họp quanh Ê-li-sê về sau. Ngày nay er-Ram là một thị trấn của người Palestine ở phía bắc Giê-ru-sa-lem, trong Bờ Tây; không có gì đánh dấu địa điểm của Na-giốt."
  ro:
    - "Naiot este cunoscut dintr-o singură poveste. Numele, de obicei „Naiot din Rama”, înseamnă ceva de felul „locuințe” sau „pășuni” și pare să fi fost nu o cetate, ci un cartier sau o incintă din Rama, orașul natal al lui Samuel, unde locuia, sub conducerea lui, o ceată de profeți. Targumul l-a înțeles ca pe o casă de studiu; Septuaginta doar îl transliterează. Din punct de vedere arheologic nu se știe nimic despre el. Rama lui Samuel este adesea identificată cu er-Ram, la circa 9 km nord de Ierusalim, iar Naiot este plasat la mică distanță de ea."
    - "Când David a fugit de Saul, a „mers la Samuil în Armatem, și i-a spus lui toate câte i-a făcut Saul, și s’au dus Samuil și David, și au șezut în Navat la Rama”. Saul a trimis de trei ori soli să-l prindă și de fiecare dată, văzând „adunare de proroci, cari proroceau, și pre Samuil stând în fruntea lor”, ei au fost cuprinși de Duhul lui Dumnezeu și au prorocit și ei. Atunci Saul s-a dus el însuși și „a fost și preste el Duhul lui Dumnezeu, și a mers prorocind până ce a venit în Navat la Rama”, unde și-a dezbrăcat hainele și a zăcut gol toată ziua și toată noaptea: „pentru aceea s’a zis: au și Saul între proroci?” De la Naiot, David a fugit la Ionatan."
    - "Povestea este cea mai amplă privire pe care o oferă Biblia asupra cetelor de profeți din vremea lui Samuel, ca ceata care l-a întâmpinat pe Saul lângă Ghibea, cu „lăute și timpene și fluere și cobze”, și ca fiii profeților care s-au adunat mai târziu în jurul lui Elisei. Er-Ram este astăzi un oraș palestinian la nord de Ierusalim, în Cisiordania; nimic nu marchează locul Naiotului."
  bg:
    - "Наот е известен от един-единствен разказ. Името, обикновено „Наот в Рама“, означава нещо като „жилища“ или „пасища“ и, изглежда, е обозначавало не град, а квартал или поселение в родния град на Самуил, Рама, където под негово ръководство живеела дружина пророци. Таргумът го разбира като дом за учение; Септуагинта само транслитерира името. Археологически за него не се знае нищо. Рама на Самуил често се отъждествява с Ер-Рам, на около 9 км северно от Йерусалим, а Наот се поставя на малко разстояние от него."
    - "Когато Давид бягал от Саул, той „дойде при Самуила в Рама та му извести всичко що му беше сторил Саул; и отидоха, той и Самуил, та седяха в Навиот“. Три пъти Саул пращал вестители да го заловят и всеки път, като виждали „събранието на пророците които пророчествуваха, и Самуила който настояваше над тях“, те били обзети от Божия Дух и също пророкували. Тогава Саул отишъл сам и „Дух Божий дойде и на него; и като вървеше в пътя си пророчествуваше доде дойде в Навиот в Рама“, където съблякъл дрехите си и лежал гол през целия ден и нощ: „За това казват: И Саул ли е между пророците?“ От Наот Давид избягал при Йонатан."
    - "Разказът е най-пълната картина, която Библията дава за пророческите дружини от времето на Самуил — като дружината, която срещнала Саул близо до Гива „с псалтир, и тъпан, и свирка, и китара“, и като синовете на пророците, които по-късно се събирали около Елисей. Днес Ер-Рам е палестински град северно от Йерусалим на Западния бряг; нищо не отбелязва мястото на Наот."
