body:
  en:
    - "Telassar appears in the boast that Sennacherib's envoys made to Hezekiah in 701 BC, recorded in almost the same words in Kings and Isaiah: “Have the gods of the nations delivered them which my fathers have destroyed; as Gozan, and Haran, and Rezeph, and the children of Eden which were in Thelasar?” The “children of Eden” are Bit-Adini, an Aramaean kingdom on both banks of the middle Euphrates which Shalmaneser III conquered in 856–855 BC, so Telassar was presumably one of its towns. The name looks like Assyrian Til-Ashshuri, “mound of Ashur”, and may be a name the conquerors gave."
    - "No town of this name has been found in the territory of Bit-Adini. Many think of its capital Til Barsip, today Tell Ahmar on the Euphrates in northern Syria, which Shalmaneser renamed Kar-Shalmaneser; others point to a Til-Ashshuri known from Assyrian royal inscriptions, though that lay far to the east, in the Zagros; Tal Afar west of Mosul and Tell Bashir in northern Syria have also been suggested. The map shows all four, and none is proved. Til Barsip, excavated by the French in the 1920s and 1930s, is known for its Assyrian palace wall paintings."
  ru:
    - "Фалассар упоминается в похвальбе послов Сеннахирима перед Езекией в 701 году до н. э., которую книги Царств и Исаии передают почти одними словами: «Боги народов, которых разорили отцы мои, спасли ли их? Спасли ли Гозан, и Харан, и Рецеф, и сынов Едена, что в Фалассаре?» «Сыны Едена» — это Бит-Адини, арамейское царство на обоих берегах среднего Евфрата, которое Салманасар III покорил в 856–855 годах до н. э., так что Фалассар, по-видимому, был одним из его городов. Имя похоже на ассирийское Тиль-Ашшури, «холм Ашшура», и могло быть дано завоевателями."
    - "Города с таким именем на земле Бит-Адини не найдено. Многие думают о его столице Тиль-Барсипе — ныне Телль-Ахмар на Евфрате на севере Сирии, — который Салманасар переименовал в Кар-Салманасар; другие указывают на Тиль-Ассури, известный по надписям ассирийских царей, хотя он лежал далеко на востоке, в горах Загроса; предлагались также Талль-Афар к западу от Мосула и Телль-Башир на севере Сирии. На карте показаны все четыре варианта, и ни один не доказан. Тиль-Барсип, раскопанный французами в 1920–1930-х годах, известен росписями ассирийского дворца."
  uk:
    - "Телассар з’являється в хвастощах, які посланці Сінаххеріба виголосили Єзекії 701 р. до н. е., записаних майже тими самими словами в Книзі Царів та в Ісаї: «Хиба ж боги народів, що їх мої предки в нїщо пообертали, вирятували їх, — як Гозан та Харан та Резеф та людей Еденських у Талассарі?» «Сини Едена» — це Бит-Адіні, арамейське царство на обох берегах середнього Євфрату, яке Салманассар III підкорив у 856–855 рр. до н. е., тож Телассар, імовірно, був одним із його міст. Назва схожа на ассірійське Тіль-Ашшурі, «пагорб Ашшура», і може бути іменем, яке дали завойовники."
    - "Міста з такою назвою на території Бит-Адіні не знайдено. Багато хто думає про його столицю Тіль-Барсіп, нині Телль-Ахмар на Євфраті на півночі Сирії, яку Салманассар перейменував на Кар-Салманассар; інші вказують на Тіль-Ашшурі, відоме з ассірійських царських написів, хоч воно лежало далеко на сході, в Загросі; пропонували також Телль-Афар на захід від Мосула й Телль-Башир на півночі Сирії. Мапа показує всі чотири, і жодне не доведене. Тіль-Барсіп, розкопаний французами в 1920–1930-х роках, відомий настінними розписами ассірійського палацу."
  es:
    - "Telasar aparece en la jactancia que los enviados de Senaquerib hicieron a Ezequías en 701 a. C., recogida casi con las mismas palabras en Reyes y en Isaías: «¿Libráronlas los dioses de las gentes, que mis padres destruyeron, es á saber, Gozán, y Harán, y Reseph, y los hijos de Edén que estaban en Thalasar?» Los «hijos de Edén» son Bit-Adini, un reino arameo en ambas orillas del Éufrates medio que Salmanasar III conquistó en 856–855 a. C., de modo que Telasar era presumiblemente una de sus ciudades. El nombre recuerda al asirio Til-Ashuri, «montículo de Ashur», y puede ser un nombre dado por los conquistadores."
    - "No se ha encontrado ninguna ciudad de este nombre en el territorio de Bit-Adini. Muchos piensan en su capital Til Barsip, hoy Tell Ahmar, en el Éufrates, en el norte de Siria, que Salmanasar rebautizó Kar-Salmanasar; otros señalan un Til-Ashuri conocido por inscripciones reales asirias, aunque este estaba muy al este, en los Zagros; también se han sugerido Tal Afar, al oeste de Mosul, y Tell Bashir, en el norte de Siria. El mapa muestra los cuatro, y ninguno está probado. Til Barsip, excavada por los franceses en las décadas de 1920 y 1930, es conocida por las pinturas murales de su palacio asirio."
  pt:
    - "Telassar aparece na bazófia que os enviados de Senaqueribe fizeram a Ezequias em 701 a.C., registrada quase com as mesmas palavras em Reis e Isaías: “Acaso os deuses das nações as livraram, as quais os meus pais destruíram — Gozã, Harã, Rezefe e os filhos de Éden que estavam em Telassar?” Os “filhos de Éden” são Bit-Adini, um reino arameu nas duas margens do médio Eufrates que Salmaneser III conquistou em 856–855 a.C.; Telassar era, portanto, presumivelmente uma de suas cidades. O nome parece o assírio Til-Ashshuri, “monte de Assur”, e pode ser um nome dado pelos conquistadores."
    - "Nenhuma cidade com esse nome foi achada no território de Bit-Adini. Muitos pensam na capital, Til Barsip, hoje Tell Ahmar, no Eufrates, no norte da Síria, que Salmaneser rebatizou de Kar-Salmaneser; outros apontam um Til-Ashshuri conhecido de inscrições reais assírias, ainda que ficasse bem a leste, nos Zagros; Tal Afar, a oeste de Mossul, e Tell Bashir, no norte da Síria, também foram sugeridas. O mapa mostra as quatro, e nenhuma está provada. Til Barsip, escavada pelos franceses nas décadas de 1920 e 1930, é conhecida pelas pinturas murais de seu palácio assírio."
  de:
    - "Telassar erscheint in der Prahlerei, die Sanheribs Gesandte 701 v. Chr. gegenüber Hiskia vorbrachten, in fast gleichen Worten in den Königsbüchern und bei Jesaja überliefert: „Haben der Heiden Götter auch sie errettet, welche meine Väter haben verderbt: Gosan, Haran, Rezeph und die Kinder Edens, die zu Thelassar waren?“ Die „Kinder Edens“ sind Bit-Adini, ein aramäisches Königreich auf beiden Ufern des mittleren Euphrat, das Salmanassar III. 856–855 v. Chr. eroberte; Telassar war also vermutlich eine seiner Städte. Der Name sieht aus wie assyrisch Til-Aschschuri, „Hügel Assurs“, und könnte ein Name der Eroberer sein."
    - "In Bit-Adini ist keine Stadt dieses Namens gefunden worden. Viele denken an seine Hauptstadt Til Barsip, heute Tell Ahmar am Euphrat in Nordsyrien, die Salmanassar in Kar-Salmanassar umbenannte; andere verweisen auf ein aus assyrischen Königsinschriften bekanntes Til-Aschschuri, das aber weit im Osten im Zagros lag; auch Tal Afar westlich von Mossul und Tell Bashir in Nordsyrien wurden vorgeschlagen. Die Karte zeigt alle vier, und keines ist bewiesen. Til Barsip, in den 1920er und 1930er Jahren von den Franzosen ausgegraben, ist für seine assyrischen Palastwandmalereien bekannt."
  fr:
    - "Télassar apparaît dans la vantardise des envoyés de Sanchérib à Ézéchias en 701 av. J.-C., consignée presque dans les mêmes termes dans les Rois et chez Ésaïe : « Les dieux des nations que mes pères ont détruites les ont-ils délivrées, Gozan, Charan, Retseph, et les fils d’Éden qui sont à Telassar ? » Les « fils d’Éden » sont Bit-Adini, royaume araméen des deux rives de l’Euphrate moyen que Salmanasar III conquit en 856-855 av. J.-C. ; Télassar était donc sans doute l’une de ses villes. Le nom ressemble à l’assyrien Til-Ashshuri, « tertre d’Assour », et peut être un nom donné par les conquérants."
    - "Aucune ville de ce nom n’a été trouvée sur le territoire de Bit-Adini. Beaucoup pensent à sa capitale Til Barsip, l’actuelle Tell Ahmar sur l’Euphrate, dans le nord de la Syrie, que Salmanasar rebaptisa Kar-Salmanasar ; d’autres citent un Til-Ashshuri connu par les inscriptions royales assyriennes, mais situé loin à l’est, dans le Zagros ; Tal Afar, à l’ouest de Mossoul, et Tell Bashir, dans le nord de la Syrie, ont aussi été suggérés. La carte montre les quatre, et aucun n’est prouvé. Til Barsip, fouillée par les Français dans les années 1920 et 1930, est connue pour les peintures murales de son palais assyrien."
  pl:
    - "Telassar pojawia się w przechwałkach, które wysłannicy Sennacheryba wygłosili wobec Ezechiasza w 701 roku p.n.e., zapisanych niemal tymi samymi słowami w Księgach Królewskich i u Izajasza: „Izali wybawili bogowie narodów te, które wygubili ojcowie moi, Gozan, i Haran, i Resef, i syny Eden, którzy byli w Telassar?” Owe „syny Eden” to Bit-Adini, aramejskie królestwo po obu brzegach środkowego Eufratu, które Salmanasar III podbił w latach 856–855 p.n.e., więc Telassar było zapewne jednym z jego miast. Nazwa wygląda na asyryjskie Til-Aszszuri, „kopiec Aszura”, i może być nazwą nadaną przez zdobywców."
    - "Na terytorium Bit-Adini nie znaleziono miasta o tej nazwie. Wielu myśli o jego stolicy Til Barsip, dzisiejszym Tell Ahmar nad Eufratem w północnej Syrii, które Salmanasar przemianował na Kar-Salmanasar; inni wskazują na Til-Aszszuri znane z asyryjskich inskrypcji królewskich, choć leżało ono daleko na wschodzie, w Zagrosie; sugerowano też Tall Afar na zachód od Mosulu i Tell Baszir w północnej Syrii. Mapa pokazuje wszystkie cztery i żadne nie jest udowodnione. Til Barsip, badane przez Francuzów w latach dwudziestych i trzydziestych XX wieku, znane jest z malowideł ściennych asyryjskiego pałacu."
  it:
    - "Telassar compare nella vanteria che gli inviati di Sennacherib fecero a Ezechia nel 701 a.C., riportata quasi con le stesse parole nei Re e in Isaia: «Gli dèi delle nazioni che i miei padri distrussero, gli dèi di Gozan, di Haran, di Retsef, dei figliuoli di Eden ch’erano a Telassar, valsero eglino a liberarle?» I «figliuoli di Eden» sono Bit-Adini, un regno aramaico su entrambe le rive del medio Eufrate che Salmanàssar III conquistò nell’856–855 a.C., per cui Telassar era presumibilmente una sua città. Il nome somiglia all’assiro Til-Ashshuri, «tumulo di Assur», e può essere un nome dato dai conquistatori."
    - "Nel territorio di Bit-Adini non è stata trovata alcuna città con questo nome. Molti pensano alla sua capitale Til Barsip, oggi Tell Ahmar sull’Eufrate nella Siria settentrionale, che Salmanàssar ribattezzò Kar-Salmanàssar; altri indicano un Til-Ashshuri noto dalle iscrizioni reali assire, che però si trovava molto più a est, nello Zagros; sono stati proposti anche Tal Afar a ovest di Mosul e Tell Bashir nella Siria settentrionale. La mappa li mostra tutti e quattro, e nessuno è provato. Til Barsip, scavata dai Francesi negli anni 1920 e 1930, è nota per le pitture murali del suo palazzo assiro."
  nl:
    - "Telassar komt voor in de grootspraak van de gezanten van Sanherib tegen Chizkia in 701 v.Chr., in bijna dezelfde woorden vastgelegd in Koningen en Jesaja: “Hebben de goden der volken, die mijn vaders verdorven hebben, dezelve gered, als Gozan, en Haran, en Rezef, en de kinderen van Eden, die in Telasser waren?” “De kinderen van Eden” zijn Bit-Adini, een Aramees koninkrijk aan beide oevers van de middenloop van de Eufraat dat Salmaneser III in 856–855 v.Chr. veroverde, zodat Telassar vermoedelijk een van zijn steden was. De naam lijkt op het Assyrische Til-Ashshuri, “heuvel van Assur”, en kan een naam zijn die de veroveraars gaven."
    - "In het gebied van Bit-Adini is geen stad met deze naam gevonden. Velen denken aan de hoofdstad Til Barsip, tegenwoordig Tell Ahmar aan de Eufraat in het noorden van Syrië, die Salmaneser herdoopte tot Kar-Salmaneser; anderen wijzen op een Til-Ashshuri dat uit Assyrische koninklijke opschriften bekend is, hoewel dat ver naar het oosten lag, in de Zagros; Tal Afar ten westen van Mosoel en Tell Bashir in het noorden van Syrië zijn ook voorgesteld. De kaart toont alle vier, en geen is bewezen. Til Barsip, in de jaren 1920 en 1930 door de Fransen opgegraven, staat bekend om de muurschilderingen van het Assyrische paleis."
  cs:
    - "Telassar se objevuje v chlubení poslů Senacheribových k Chizkijášovi roku 701 př. n. l., zaznamenaném téměř týmiž slovy v Královské a u Izajáše: „Zdaliž jsou je vysvobodili bohové těch národů, kteréž zahladili otcové moji, totiž Gozana, Charana, Resefa a syny Eden, kteříž byli v Telasar?“ Synové Edenu jsou Bít-Adini, aramejské království na obou březích středního Eufratu, které Salmanasar III. dobyl v letech 856–855 př. n. l., takže Telassar byl nejspíš jedním z jeho měst. Jméno vypadá jako asyrské Til-Aššuri, „pahorek Aššurův“, a může to být jméno, které dobyvatelé dali."
    - "V území Bít-Adini nebylo město tohoto jména nalezeno. Mnozí myslí na jeho hlavní město Til Barsip, dnešní Tell Ahmar na Eufratu v severní Sýrii, které Salmanasar přejmenoval na Kár-Salmanasar; jiní ukazují na Til-Aššuri známé z asyrských královských nápisů, ač to leželo daleko na východě, v Zagrosu; navrhovány byly také Tal Afar západně od Mosulu a Tell Baší v severní Sýrii. Mapa ukazuje všechny čtyři a žádné není prokázáno. Til Barsip, vykopaný Francouzi ve 20. a 30. letech 20. století, je znám asyrskými nástěnnými malbami paláce."
  sv:
    - "Telassar förekommer i skrytet som Sanheribs sändebud framförde till Hiskia år 701 f.Kr., återgivet i nästan samma ord i Kungaboken och hos Jesaja: ”Hava väl de folk som mina fäder fördärvade, Gosan, Haran, Resef och Edens barn i Telassar, blivit räddade av sina gudar?” ”Edens barn” är Bit-Adini, ett arameiskt rike på båda sidor om mellersta Eufrat som Salmanassar III erövrade 856–855 f.Kr., så Telassar var förmodligen en av dess städer. Namnet liknar assyriskans Til-Ashshuri, ”Ashurs kulle”, och kan vara ett namn som erövrarna gav."
    - "Ingen stad med detta namn har hittats på Bit-Adinis område. Många tänker på dess huvudstad Til Barsip, i dag Tell Ahmar vid Eufrat i norra Syrien, som Salmanassar döpte om till Kar-Salmanassar; andra pekar på ett Til-Ashshuri som är känt från assyriska kungainskrifter, fast det låg långt österut, i Zagros; Tal Afar väster om Mosul och Tell Bashir i norra Syrien har också föreslagits. Kartan visar alla fyra, och ingen är bevisad. Til Barsip, utgrävt av fransmännen på 1920- och 1930-talen, är känt för sina assyriska palatsväggmålningar."
