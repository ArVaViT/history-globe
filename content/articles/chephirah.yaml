# Overview article (ADR 0007). Mainstream facts only; a minor place: the identification with Khirbet el-Kefireh rests on the name and surface finds and is generally accepted.
id: chephirah
place: a2e5054
title:
  en: "Chephirah"
  ru: "Кефира"
body:
  en:
    - "Chephirah, “village”, was one of the four towns of the Hivites who tricked Joshua into a treaty: when Israel marched to their cities on the third day, “their cities were Gibeon, and Chephirah, and Beeroth, and Kirjath-jearim”. It stood west of Gibeon on the edge of the hills, and is identified with Khirbet el-Kefireh, a ruin on a steep spur above the Wadi Qatanna about 7.5 km west-south-west of el-Jib, where the name survives; a surface survey in the 1970s found walls and pottery of the Iron Age and the Persian period, which fits the town's story, though it has not been fully excavated."
    - "It was allotted to Benjamin, listed with “Mizpeh, and Chephirah, and Mozah”, and its people kept their identity through the exile: among those who came home from Babylon were “the children of Kirjath-arim, Chephirah, and Beeroth, seven hundred and forty and three”, the same figure in Ezra and Nehemiah. The Bible tells nothing else of it."
    - "The ruin today lies in the West Bank west of Jerusalem, above the village of Qatanna and near Biddu, with the suburbs of Jerusalem and the settlement of Har Adar on the heights to the south."
  ru:
    - "Кефира, «селение», была одним из четырёх городов Евеев, хитростью заключивших союз с Иисусом Навином: когда Израиль на третий день пришёл к их городам, «города же их были: Гаваон, Кефира, Беероф и Кириаф-Иарим». Она стояла к западу от Гаваона на краю гор, и её отождествляют с Хирбет-эль-Кефире, руинами на крутом отроге над Вади-Катанна примерно в 7,5 км к западу-юго-западу от Эль-Джиба, где уцелело имя; обследование поверхности в 1970-х годах нашло стены и керамику железного века и персидского времени, что согласуется с историей города, хотя полностью он не раскопан."
    - "Она отошла Вениамину и названа в его списке: «Мицфе, Кефира и Моца», а её жители сохранили себя через плен: среди вернувшихся из Вавилона были «уроженцев Кириаф-Иарима, Кефиры и Беерофа семьсот сорок три» — одно и то же число у Ездры и у Неемии. Больше о ней в Библии ничего не рассказано."
    - "Руины сегодня лежат на Западном берегу к западу от Иерусалима, над селением Катанна и близ Бидду, а на высотах к югу — пригороды Иерусалима и поселение Хар-Адар."
