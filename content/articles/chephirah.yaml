body:
  en:
    - "Chephirah, “village”, was one of the four towns of the Hivites who tricked Joshua into a treaty: when Israel marched to their cities on the third day, “their cities were Gibeon, and Chephirah, and Beeroth, and Kirjath-jearim”. It stood west of Gibeon on the edge of the hills, and is identified with Khirbet el-Kefireh, a hilltop ruin about 7.5 km west-south-west of el-Jib, where the name survives; a surface survey in the 1970s found walls and pottery of the Early Bronze and Iron Ages and of the Hellenistic, Roman and Byzantine periods, though the site has never been excavated."
    - "It was allotted to Benjamin, listed with “Mizpeh, and Chephirah, and Mozah”, and its people kept their identity through the exile: among those who came home from Babylon were “the children of Kirjath-arim, Chephirah, and Beeroth, seven hundred and forty and three”, the same figure in Ezra and Nehemiah. The Bible tells nothing else of it."
    - "The ruin today lies in the West Bank west of Jerusalem, above the village of Qatanna and near Biddu, with the suburbs of Jerusalem and the settlement of Har Adar on the heights to the east and south-east."
  ru:
    - "Кефира, «селение», была одним из четырёх городов Евеев, хитростью заключивших союз с Иисусом Навином: когда Израиль на третий день пришёл к их городам, «города же их были: Гаваон, Кефира, Беероф и Кириаф-Иарим». Она стояла к западу от Гаваона на краю гор, и её отождествляют с Хирбет-эль-Кефире, руинами на вершине холма примерно в 7,5 км к западу-юго-западу от Эль-Джиба, где уцелело имя; обследование поверхности в 1970-х годах нашло стены и керамику раннего бронзового и железного веков, а также эллинистического, римского и византийского времени, хотя памятник никогда не раскапывали."
    - "Она отошла Вениамину и названа в его списке: «Мицфе, Кефира и Моца», а её жители сохранили себя через плен: среди вернувшихся из Вавилона были «уроженцев Кириаф-Иарима, Кефиры и Беерофа семьсот сорок три» — одно и то же число у Ездры и у Неемии. Больше о ней в Библии ничего не рассказано."
    - "Руины сегодня лежат на Западном берегу к западу от Иерусалима, над селением Катанна и близ Бидду, а на высотах к востоку и юго-востоку — пригороды Иерусалима и поселение Хар-Адар."
  uk:
    - "Кефіра, «село», була одним із чотирьох міст хіввеїв, які ошукали Ісуса Навина, виманивши договір: коли Ізраїль на третій день дійшов до їхніх міст, «міста ті були: Габаон, Кафира, Беерот і Кириятярим». Вона стояла на захід від Гаваона на краю гір і ототожнюється з Хірбет-ель-Кефіре, руїнами на вершині пагорба приблизно за 7,5 км на захід-південний захід від ель-Джіба, де назва збереглася; поверхневе обстеження 1970-х рр. знайшло мури та кераміку ранньої бронзової та залізної доби, а також елліністичного, римського й візантійського періодів, хоча пам’ятку ніколи не розкопували."
    - "Вона дісталася Веніяминові, названа поряд із «Мицфе, Кефира, Моза», і її мешканці зберегли свою тотожність під час вигнання: серед тих, хто повернувся з Вавилона, були «родом з Киріят-Яриму, Кефири та Беероту, сїмсот сорок три», — та сама цифра в Ездри й Неемії. Більше Біблія про неї нічого не розповідає."
    - "Руїни лежать сьогодні на Західному березі, на захід від Єрусалима, над селом Катанна й поблизу Бідду, а передмістя Єрусалима та поселення Хар-Адар — на висотах на сході й південному сході."
  es:
    - "Cafira, «aldea», era una de las cuatro ciudades de los heveos que engañaron a Josué para obtener un tratado: cuando Israel marchó a sus ciudades al tercer día, «sus ciudades eran Gabaón, Caphira, Beeroth, y Chiriath-jearim». Estaba al oeste de Gabaón, en el borde de las colinas, y se identifica con Khirbet el-Kefireh, una ruina en lo alto de una colina, a unos 7,5 km al oeste-sudoeste de el-Jib, donde sobrevive el nombre; una prospección de superficie en la década de 1970 halló muros y cerámica del Bronce Antiguo y de la Edad del Hierro y de los periodos helenístico, romano y bizantino, aunque el sitio nunca ha sido excavado."
    - "Fue asignada a Benjamín, enumerada con «Mizpa, Chephira, y Moza», y su gente conservó su identidad durante el destierro: entre los que volvieron a casa desde Babilonia estaban «los hijos de Chîriath-jearim, Cephira, y Beeroth, setecientos cuarenta y tres», la misma cifra en Esdras y en Nehemías. La Biblia no dice nada más de ella."
    - "La ruina se halla hoy en Cisjordania, al oeste de Jerusalén, sobre la aldea de Qatanna y cerca de Biddu, con los suburbios de Jerusalén y el asentamiento de Har Adar en las alturas del este y del sudeste."
  pt:
    - "Quefira, “aldeia”, era uma das quatro cidades dos heveus que enganaram Josué para obter um tratado: quando Israel marchou para as cidades deles no terceiro dia, “as cidades deles eram Gibeom, Cefira, Beerote e Quiriate-Jearim”. Ficava a oeste de Gibeão, na orla das colinas, e é identificada com Khirbet el-Kefireh, uma ruína no topo de uma colina, a cerca de 7,5 km a oés-sudoeste de el-Jib, onde o nome sobrevive; um levantamento de superfície na década de 1970 achou muros e cerâmica do Bronze Antigo e da Idade do Ferro e dos períodos helenístico, romano e bizantino, embora o sítio nunca tenha sido escavado."
    - "Foi atribuída a Benjamim, listada com “Mispá, Quefira, Mosa”, e seu povo conservou a identidade durante o exílio: entre os que voltaram da Babilônia estavam “Os filhos de Quiriate-Arim, Cefira e Beerote, setecentos e quarenta e três”, o mesmo número em Esdras e em Neemias. A Bíblia nada mais conta sobre ela."
    - "A ruína fica hoje na Cisjordânia, a oeste de Jerusalém, acima da aldeia de Qatanna e perto de Biddu, com os subúrbios de Jerusalém e o assentamento de Har Adar nas alturas a leste e a sudeste."
  de:
    - "Kefira, „Dorf“, war eine der vier Städte der Hiwiter, die Josua zu einem Vertrag überlisteten: Als Israel am dritten Tag zu ihren Städten zog, „die hießen Gibeon, Kaphira, Beeroth und Kirjath-Jearim“. Es lag westlich von Gibeon am Rand des Berglandes und wird mit Khirbet el-Kefireh gleichgesetzt, einer Ruine auf einer Hügelkuppe etwa 7,5 km west-südwestlich von el-Jib, wo der Name fortlebt; eine Oberflächenuntersuchung in den 1970er Jahren fand Mauern und Keramik der Frühbronze- und der Eisenzeit sowie der hellenistischen, römischen und byzantinischen Zeit, obwohl der Ort nie ausgegraben wurde."
    - "Es wurde Benjamin zugeteilt und steht in der Liste mit „Mizpe, Kaphira, Moza“, und seine Bewohner bewahrten ihre Identität durch das Exil: Unter den Heimkehrern aus Babylon waren „der Kinder von Kirjath-Arim, Kaphira und Beeroth siebenhundert und dreiundvierzig“, dieselbe Zahl bei Esra und bei Nehemia. Die Bibel erzählt sonst nichts von ihm."
    - "Die Ruine liegt heute im Westjordanland westlich von Jerusalem, oberhalb des Dorfes Qatanna und nahe Biddu, mit den Vororten Jerusalems und der Siedlung Har Adar auf den Höhen im Osten und Südosten."
  fr:
    - "Képhira, « village », était l’une des quatre villes des Héviens qui trompèrent Josué pour obtenir un traité : lorsqu’Israël marcha vers leurs villes le troisième jour, « leurs villes étaient Gabaon, Kephira, Beéroth et Kirjath-Jearim ». Elle se trouvait à l’ouest de Gabaon, en bordure des collines, et on l’identifie à Khirbet el-Kefireh, une ruine au sommet d’une colline, à environ 7,5 km à l’ouest-sud-ouest d’el-Jib, où le nom survit ; une prospection de surface dans les années 1970 y a trouvé des murs et de la poterie du Bronze ancien et de l’âge du Fer ainsi que des époques hellénistique, romaine et byzantine, bien que le site n’ait jamais été fouillé."
    - "Elle fut attribuée à Benjamin, portée sur la liste « Mitspé, Kephira, Motsa », et ses habitants gardèrent leur identité à travers l’exil : parmi ceux qui rentrèrent de Babylone figuraient « les fils de Kirjath-Arim, de Kephira et de Beéroth, sept cent quarante-trois », le même chiffre chez Esdras et Néhémie. La Bible n’en dit rien d’autre."
    - "La ruine se trouve aujourd’hui en Cisjordanie, à l’ouest de Jérusalem, au-dessus du village de Qatanna et près de Biddu, avec les faubourgs de Jérusalem et la colonie de Har Adar sur les hauteurs à l’est et au sud-est."
  it:
    - "Chefira, «villaggio», era una delle quattro città degli Evei che ingannarono Giosuè con un trattato: quando Israele marciò verso le loro città il terzo giorno, «le loro città erano Gabaon, Kefira, Beeroth e Kiriath-Jearim». Sorgeva a ovest di Gabaon sul margine delle colline, e si identifica con Khirbet el-Kefireh, una rovina in cima a una collina a circa 7,5 km a ovest-sud-ovest di el-Jib, dove il nome sopravvive; una ricognizione di superficie negli anni 1970 trovò mura e ceramica del Bronzo Antico e dell’età del Ferro e dei periodi ellenistico, romano e bizantino, benché il sito non sia mai stato scavato."
    - "Fu assegnata a Beniamino, elencata con «Mitspe, Kefira, Motsa», e i suoi abitanti conservarono la loro identità durante l’esilio: fra quelli che tornarono da Babilonia c’erano «gli uomini di Kiriath-Arim, di Kefira e di Beeroth, settecentoquarantatre», la stessa cifra in Esdra e in Neemia. La Bibbia non dice altro di essa."
    - "La rovina si trova oggi in Cisgiordania a ovest di Gerusalemme, sopra il villaggio di Qatanna e vicino a Biddu, con i sobborghi di Gerusalemme e l’insediamento di Har Adar sulle alture a est e a sud-est."
  pl:
    - "Kefira, „wieś”, była jednym z czterech miast Chiwwitów, którzy podstępem skłonili Jozuego do zawarcia układu: gdy Izraelici ruszyli do ich miast trzeciego dnia, „a miasta ich te były: Gabaon, i Kafira, i Beerot, i Karyjatyjarym”. Leżała na zachód od Gibeonu na skraju wzgórz i utożsamia się ją z Chirbet el-Kefire, ruiną na szczycie wzgórza, około 7,5 km na zachód-południowy zachód od el-Dżib, gdzie nazwa przetrwała; badanie powierzchniowe w latach siedemdziesiątych XX w. odnalazło mury i ceramikę z wczesnej epoki brązu i epoki żelaza oraz z okresów hellenistycznego, rzymskiego i bizantyjskiego, choć stanowiska nigdy nie badano wykopaliskami."
    - "Przydzielono ją Beniaminowi; wymieniona jest obok „Misfe, i Kafara, i Mosa”, a jej mieszkańcy zachowali swą tożsamość przez wygnanie: wśród wracających z Babilonu wymieniono „Synów z Karyjatyjarymu, z Kafiry i z Beerotu siedm set i czterdzieści i trzy”, ta sama liczba w Księdze Ezdrasza i Nehemiasza. Biblia nie mówi o niej nic więcej."
    - "Ruina leży dziś na Zachodnim Brzegu, na zachód od Jerozolimy, nad wsią Katanna i niedaleko Biddu, a na wzniesieniach na wschodzie i południowym wschodzie znajdują się przedmieścia Jerozolimy i osiedle Har Adar."
  nl:
    - "Kefira, “dorp”, was een van de vier steden van de Hevieten die Jozua misleidden tot een verdrag: toen Israël op de derde dag naar hun steden trok: “hun steden nu waren Gibeon, en Chefira, en Beeroth, en Kirjath-Jearim”. Het lag ten westen van Gibeon aan de rand van het heuvelland en wordt geïdentificeerd met Khirbet el-Kefireh, een ruïne op een heuveltop, ongeveer 7,5 km west-zuidwest van el-Jib, waar de naam voortleeft; een oppervlakteonderzoek in de jaren 1970 vond muren en aardewerk uit de Vroege Bronstijd en de IJzertijd en uit de Hellenistische, Romeinse en Byzantijnse tijd, al is de plaats nooit opgegraven."
    - "Zij werd toegewezen aan Benjamin, vermeld met “Mizpe, en Chefira, en Moza”, en haar bewoners behielden hun identiteit door de ballingschap heen: onder hen die uit Babylon thuiskwamen waren “de kinderen van Kirjath-Arim, Cefira en Beeroth, zevenhonderd drie en veertig”, hetzelfde getal in Ezra en Nehemia. Verder vertelt de Bijbel niets over haar."
    - "De ruïne ligt tegenwoordig op de Westelijke Jordaanoever ten westen van Jeruzalem, boven het dorp Qatanna en bij Biddu, met de buitenwijken van Jeruzalem en de nederzetting Har Adar op de hoogten ten oosten en zuidoosten ervan."
  cs:
    - "Kefíra, „vesnice“, bylo jedno ze čtyř měst Chivijců, kteří Jozue lstí přiměli ke smlouvě: když Izrael třetího dne přitáhl k jejich městům, „města pak jejich byla Gabaon a Kafira a Berot a Kariatjeharim“. Stála západně od Gibeonu na okraji hor a ztotožňuje se s Khirbet el-Kefireh, zříceninou na vrcholu kopce asi 7,5 km západojihozápadně od el-Jib, kde se jméno zachovalo; povrchový průzkum v 70. letech 20. století nalezl zdi a keramiku z rané doby bronzové a z doby železné i z helénistického, římského a byzantského období, ač tam nikdy nebyly vedeny vykopávky."
    - "Připadlo Benjamínovi, uvedeno s „Masfa, Kafira a Mosa“, a jeho lid si zachoval totožnost přes vyhnanství: mezi těmi, kdo se vrátili z Babylóna, se čte: „Synů Kariatarimských, Kafirských a Berotských sedm set čtyřidceti a tři“, tentýž počet u Ezdráše i Nehemjáše. Jinak o něm Bible nic neříká."
    - "Zřícenina leží dnes na Západním břehu západně od Jeruzaléma, nad vesnicí Qatanna a poblíž Biddu, s jeruzalémskými předměstími a osadou Har Adar na výšinách východně a jihovýchodně."
  sv:
    - "Kefira, ”byn”, var en av de fyra hivitiska städerna vars män lurade Josua till ett förbund: när Israel på tredje dagen kom till deras städer, ”voro deras städer: Gibeon, Kefira, Beerot och Kirjat-Jearim”. Den låg väster om Gibeon vid bergens kant och identifieras med Khirbet el-Kefireh, en ruin på en bergstopp omkring 7,5 km väst-sydväst om el-Jib, där namnet lever kvar; en ytinventering på 1970-talet fann murar och keramik från äldre bronsålder och järnålder samt från hellenistisk, romersk och bysantinsk tid, men platsen har aldrig grävts ut."
    - "Den tilldelades Benjamin och står i förteckningen ”Mispe, Kefira, Mosa”, och dess folk behöll sin identitet genom exilen: bland dem som kom hem från Babylon var ”Kirjat-Arims, Kefiras och Beerots barn: sju hundra fyrtiotre”, samma siffra i Esra och Nehemja. Bibeln berättar inget mer om den."
    - "Ruinen ligger i dag på Västbanken väster om Jerusalem, ovanför byn Qatanna och nära Biddu, med Jerusalems förorter och bosättningen Har Adar på höjderna åt öster och sydost."
  nb:
    - "Kefira, «landsbyen», var en av de fire byene til hevittene som lurte Josva til en avtale: da Israel brøt opp, «kom de den tredje dag til deres byer; det var Gibeon og Hakkefira og Be'erot og Kirjat-Jearim». Den lå vest for Gibeon i kanten av åsene, og identifiseres med Khirbet el-Kefireh, en ruin på en høyde omtrent 7,5 km vest-sørvest for el-Jib, der navnet lever; en overflateundersøkelse på 1970-tallet fant murer og keramikk fra tidlig bronsealder og jernalder og fra hellenistisk, romersk og bysantinsk tid, selv om stedet aldri er gravd ut."
    - "Den ble tildelt Benjamin, oppført med «Mispe og Hakkefira og Hammosa», og dens folk bevarte sin identitet gjennom eksilet: blant dem som kom hjem fra Babylon var «Kirjat-Arims, Kefiras og Be'erots barn, syv hundre og tre og firti», samme tall hos Esra og Nehemja. Bibelen forteller ikke noe mer om den."
    - "Ruinen ligger i dag på Vestbredden vest for Jerusalem, ovenfor landsbyen Qatanna og nær Biddu, med Jerusalems forsteder og bosetningen Har Adar på høydene i øst og sørøst."
  tl:
    - "Ang Caphira, “nayon”, ay isa sa apat na bayan ng mga Heveo na nanlinlang kay Josue upang makipagkasundo: nang magmartsa ang Israel sa kanilang mga lungsod sa ikatlong araw, “Ang kanila ngang mga bayan ay Gabaon, Caphira, at Beeroth, at Kiriath-jearim”. Nasa kanluran ito ng Gabaon sa gilid ng mga burol, at kinikilala sa Khirbet el-Kefireh, isang guho sa tuktok ng burol mga 7.5 km kanluran-timog-kanluran ng el-Jib, kung saan nananatili ang pangalan; natagpuan ng surbey sa ibabaw noong dekada 1970 ang mga pader at palayok ng Maagang Panahon ng Tanso at Panahon ng Bakal at ng mga panahong Helenistiko, Romano at Bizantino, bagaman hindi pa kailanman nahukay ang pook."
    - "Itinakda ito sa Benjamin, nakalista kasama ang “Mizpe, at Chephira, at Moza”, at pinanatili ng mga tao nito ang pagkakakilanlan sa pagkatapon: sa mga umuwi mula sa Babilonia ay “Ang mga anak ni Chiriathjearim, ni Cephira, at ni Beeroth, pitong daan at apat na pu't tatlo”, ang gayunding bilang sa Ezra at Nehemias. Wala nang sinasabi ang Bibliya tungkol dito."
    - "Ang guho ay nasa West Bank sa kanluran ng Jerusalem ngayon, sa itaas ng nayon ng Qatanna at malapit sa Biddu, na ang mga karatig-purok ng Jerusalem at ang pamayanan ng Har Adar ay nasa matataas na lugar sa silangan at timog-silangan."
  da:
    - "Kefira, »landsbyen«, var en af de fire byer, tilhørende hevitterne, som narrede Josva til en traktat: Da Israel drog til deres byer på den tredje dag, »deres Stæder vare Gibeon og Kefira og Beeroth og Kirjath-Jearim«. Den lå vest for Gibeon i udkanten af bjergene og identificeres med Khirbet el-Kefireh, en ruin på en bakketop cirka 7,5 km vestsydvest for el-Jib, hvor navnet består; en overfladeundersøgelse i 1970'erne fandt mure og potteskår fra tidlig bronzealder og jernalder og fra den hellenistiske, romerske og byzantinske tid, selv om stedet aldrig er udgravet."
    - "Den blev tildelt Benjamin, opført med »Mizpe og Kefira og Moza«, og dens folk bevarede deres identitet gennem eksilet: Blandt dem, der kom hjem fra Babylon, var »de Børn af Kirjath-Arim, Kefira og Beeroth, syv Hundrede og tre og fyrretyve«, det samme tal i Ezra og Nehemias. Bibelen fortæller intet andet om den."
    - "Ruinen ligger i dag på Vestbredden vest for Jerusalem, oven for landsbyen Qatanna og nær Biddu, med Jerusalems forstæder og bosættelsen Har Adar på højderne mod øst og sydøst."
  sr:
    - "Кефира, „село“, била је један од четири града Јевеја који су преваром измамили савез од Исуса Навина: када су синови Израиљеви трећег дана стигли до њихових градова, „а градови им беху: Гаваон и Кефира и Вирот и Киријат-Јарим“. Стајала је западно од Гаваона на рубу брда, а поистовећује се с Хирбет ел Кефиреом, рушевином на врху брда око 7,5 км западно-југозападно од ел Џиба, где је име сачувано; површински преглед 1970-их нашао је зидове и керамику из раног бронзаног и гвозденог доба и из хеленистичког, римског и византијског периода, мада налазиште никада није ископавано."
    - "Била је додељена Венијамину, наведена с „Миспа и Хефира и Моса“, а њени становници сачували су свој идентитет током изгнанства: међу онима који су се вратили из Вавилона били су „људи из Киријат-Јарима, Хефире и Вирота седам стотина и четрдесет и три“, исти број у Јездри и Немији. Библија о њој не приповеда ништа више."
    - "Рушевина данас лежи на Западној обали западно од Јерусалима, изнад села Катана и близу Бидуа, са јерусалимским предграђима и насељем Хар Адар на висовима источно и југоисточно."
scripture:
