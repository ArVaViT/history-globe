# Overview article (ADR 0007). Mainstream facts only; a minor place: the identification with Khirbet el-Kefireh rests on the name and surface finds and is generally accepted.
id: chephirah
place: a2e5054
title:
  en: "Chephirah"
  ru: "Кефира"
  uk: "Кефіра"
  es: "Cafira"
  pt: "Quefira"
  de: "Kefira"
  fr: "Képhira"
body:
  en:
    - "Chephirah, “village”, was one of the four towns of the Hivites who tricked Joshua into a treaty: when Israel marched to their cities on the third day, “their cities were Gibeon, and Chephirah, and Beeroth, and Kirjath-jearim”. It stood west of Gibeon on the edge of the hills, and is identified with Khirbet el-Kefireh, a ruin on a steep spur above the Wadi Qatanna about 7.5 km west-south-west of el-Jib, where the name survives; a surface survey in the 1970s found walls and pottery of the Iron Age and the Persian period, which fits the town's story, though it has not been fully excavated."
    - "It was allotted to Benjamin, listed with “Mizpeh, and Chephirah, and Mozah”, and its people kept their identity through the exile: among those who came home from Babylon were “the children of Kirjath-arim, Chephirah, and Beeroth, seven hundred and forty and three”, the same figure in Ezra and Nehemiah. The Bible tells nothing else of it."
    - "The ruin today lies in the West Bank west of Jerusalem, above the village of Qatanna and near Biddu, with the suburbs of Jerusalem and the settlement of Har Adar on the heights to the south."
  ru:
    - "Кефира, «селение», была одним из четырёх городов Евеев, хитростью заключивших союз с Иисусом Навином: когда Израиль на третий день пришёл к их городам, «города же их были: Гаваон, Кефира, Беероф и Кириаф-Иарим». Она стояла к западу от Гаваона на краю гор, и её отождествляют с Хирбет-эль-Кефире, руинами на крутом отроге над Вади-Катанна примерно в 7,5 км к западу-юго-западу от Эль-Джиба, где уцелело имя; обследование поверхности в 1970-х годах нашло стены и керамику железного века и персидского времени, что согласуется с историей города, хотя полностью он не раскопан."
    - "Она отошла Вениамину и названа в его списке: «Мицфе, Кефира и Моца», а её жители сохранили себя через плен: среди вернувшихся из Вавилона были «уроженцев Кириаф-Иарима, Кефиры и Беерофа семьсот сорок три» — одно и то же число у Ездры и у Неемии. Больше о ней в Библии ничего не рассказано."
    - "Руины сегодня лежат на Западном берегу к западу от Иерусалима, над селением Катанна и близ Бидду, а на высотах к югу — пригороды Иерусалима и поселение Хар-Адар."
  uk:
    - "Кефіра, «село», була одним із чотирьох міст хіввеїв, які ошукали Ісуса Навина, виманивши договір: коли Ізраїль на третій день дійшов до їхніх міст, «міста ті були: Габаон, Кафира, Беерот і Кириятярим». Вона стояла на захід від Гаваона на краю гір і ототожнюється з Хірбет-ель-Кефіре, руїнами на крутому відрозі над ваді Катанна приблизно за 7,5 км на захід-південний захід від ель-Джіба, де назва збереглася; поверхневе обстеження 1970-х рр. знайшло мури та кераміку залізної доби й персидського періоду, що пасує до розповіді про місто, хоча його повністю не розкопано."
    - "Вона дісталася Веніяминові, названа поряд із «Мицфе, Кефира, Моза», і її мешканці зберегли свою тотожність під час вигнання: серед тих, хто повернувся з Вавилона, були «родом з Киріят-Яриму, Кефири та Беероту, сїмсот сорок три», — та сама цифра в Ездри й Неемії. Більше Біблія про неї нічого не розповідає."
    - "Руїни лежать сьогодні на Західному березі, на захід від Єрусалима, над селом Катанна й поблизу Бідду, а передмістя Єрусалима та поселення Хар-Адар — на висотах на півдні."
  es:
    - "Cafira, «aldea», era una de las cuatro ciudades de los heveos que engañaron a Josué para obtener un tratado: cuando Israel marchó a sus ciudades al tercer día, «sus ciudades eran Gabaón, Caphira, Beeroth, y Chiriath-jearim». Estaba al oeste de Gabaón, en el borde de las colinas, y se identifica con Khirbet el-Kefireh, una ruina en un espolón escarpado sobre el uadi Qatanna, a unos 7,5 km al oeste-sudoeste de el-Jib, donde sobrevive el nombre; una prospección de superficie en la década de 1970 halló muros y cerámica de la Edad del Hierro y del periodo persa, lo que concuerda con la historia de la ciudad, aunque no ha sido excavada del todo."
    - "Fue asignada a Benjamín, enumerada con «Mizpa, Chephira, y Moza», y su gente conservó su identidad durante el destierro: entre los que volvieron a casa desde Babilonia estaban «los hijos de Chîriath-jearim, Cephira, y Beeroth, setecientos cuarenta y tres», la misma cifra en Esdras y en Nehemías. La Biblia no dice nada más de ella."
    - "La ruina se halla hoy en Cisjordania, al oeste de Jerusalén, sobre la aldea de Qatanna y cerca de Biddu, con los suburbios de Jerusalén y el asentamiento de Har Adar en las alturas del sur."
  pt:
    - "Quefira, “aldeia”, era uma das quatro cidades dos heveus que enganaram Josué para obter um tratado: quando Israel marchou para as cidades deles no terceiro dia, “as cidades deles eram Gibeom, Cefira, Beerote e Quiriate-Jearim”. Ficava a oeste de Gibeão, na orla das colinas, e é identificada com Khirbet el-Kefireh, uma ruína num esporão íngreme acima do uádi Qatanna, a cerca de 7,5 km a oés-sudoeste de el-Jib, onde o nome sobrevive; um levantamento de superfície na década de 1970 achou muros e cerâmica da Idade do Ferro e do período persa, o que se ajusta à história da cidade, embora ela não tenha sido plenamente escavada."
    - "Foi atribuída a Benjamim, listada com “Mispá, Quefira, Mosa”, e seu povo conservou a identidade durante o exílio: entre os que voltaram da Babilônia estavam “Os filhos de Quiriate-Arim, Cefira e Beerote, setecentos e quarenta e três”, o mesmo número em Esdras e em Neemias. A Bíblia nada mais conta sobre ela."
    - "A ruína fica hoje na Cisjordânia, a oeste de Jerusalém, acima da aldeia de Qatanna e perto de Biddu, com os subúrbios de Jerusalém e o assentamento de Har Adar nas alturas ao sul."
  de:
    - "Kefira, „Dorf“, war eine der vier Städte der Hiwiter, die Josua zu einem Vertrag überlisteten: Als Israel am dritten Tag zu ihren Städten zog, „die hießen Gibeon, Kaphira, Beeroth und Kirjath-Jearim“. Es lag westlich von Gibeon am Rand des Berglandes und wird mit Khirbet el-Kefireh gleichgesetzt, einer Ruine auf einem steilen Sporn über dem Wadi Qatanna etwa 7,5 km west-südwestlich von el-Jib, wo der Name fortlebt; eine Oberflächenuntersuchung in den 1970er Jahren fand Mauern und Keramik der Eisenzeit und der Perserzeit, was zur Geschichte der Stadt passt, obwohl sie nicht vollständig ausgegraben ist."
    - "Es wurde Benjamin zugeteilt und steht in der Liste mit „Mizpe, Kaphira, Moza“, und seine Bewohner bewahrten ihre Identität durch das Exil: Unter den Heimkehrern aus Babylon waren „der Kinder von Kirjath-Arim, Kaphira und Beeroth siebenhundert und dreiundvierzig“, dieselbe Zahl bei Esra und bei Nehemia. Die Bibel erzählt sonst nichts von ihm."
    - "Die Ruine liegt heute im Westjordanland westlich von Jerusalem, oberhalb des Dorfes Qatanna und nahe Biddu, mit den Vororten Jerusalems und der Siedlung Har Adar auf den Höhen im Süden."
  fr:
    - "Képhira, « village », était l’une des quatre villes des Héviens qui trompèrent Josué pour obtenir un traité : lorsqu’Israël marcha vers leurs villes le troisième jour, « leurs villes étaient Gabaon, Kephira, Beéroth et Kirjath-Jearim ». Elle se trouvait à l’ouest de Gabaon, en bordure des collines, et on l’identifie à Khirbet el-Kefireh, une ruine sur un éperon escarpé au-dessus du Wadi Qatanna, à environ 7,5 km à l’ouest-sud-ouest d’el-Jib, où le nom survit ; une prospection de surface dans les années 1970 y a trouvé des murs et de la poterie de l’âge du Fer et de l’époque perse, ce qui cadre avec l’histoire de la ville, bien qu’elle n’ait pas été entièrement fouillée."
    - "Elle fut attribuée à Benjamin, portée sur la liste « Mitspé, Kephira, Motsa », et ses habitants gardèrent leur identité à travers l’exil : parmi ceux qui rentrèrent de Babylone figuraient « les fils de Kirjath-Arim, de Kephira et de Beéroth, sept cent quarante-trois », le même chiffre chez Esdras et Néhémie. La Bible n’en dit rien d’autre."
    - "La ruine se trouve aujourd’hui en Cisjordanie, à l’ouest de Jérusalem, au-dessus du village de Qatanna et près de Biddu, avec les faubourgs de Jérusalem et la colonie de Har Adar sur les hauteurs au sud."
