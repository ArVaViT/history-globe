# Overview article (ADR 0007). Mainstream facts only; the date of the Samaritan temple follows the excavator, with Josephus' account noted; the date of its destruction is given as approximate.
id: mount-gerizim
place: a30e967
title:
  en: "Mount Gerizim"
  ru: "Гаризим"
  uk: "Гарізім"
  es: "Monte Gerizim"
  pt: "Monte Gerizim"
  de: "Garizim"
  fr: "Mont Garizim"
  it: "Monte Garizim"
  pl: "Góra Garizim"
