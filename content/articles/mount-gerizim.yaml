body:
  en:
    - "Mount Gerizim rises to 881 m on the south side of the pass of Shechem, facing Mount Ebal across the narrow valley in which Nablus now lies; Jacob's well and the ruins of Shechem are at its foot. Moses commanded that when Israel came into the land “thou shalt put the blessing upon mount Gerizim, and the curse upon mount Ebal”, and Joshua carried it out, “half of them over against mount Gerizim, and half of them over against mount Ebal”. When the men of Shechem made Abimelech king, his brother Jotham “went and stood in the top of mount Gerizim, and lifted up his voice, and cried” his fable of the trees that chose the bramble."
    - "For the Samaritans Gerizim is the mountain God chose, and their Pentateuch names it where the Jewish text has Ebal. Josephus says a temple was built on it in the days of Alexander the Great; the excavations of Yitzhak Magen in 1983–2006 uncovered a sacred precinct he dated to the mid-fifth century BC, much enlarged early in the second. Antiochus IV had the temple renamed for Zeus the Hospitable, and John Hyrcanus destroyed it about 110 BC. The Samaritan woman's words to Jesus at the well, “Our fathers worshipped in this mountain; and ye say, that in Jerusalem is the place where men ought to worship”, point to its bare summit, and he answered that “the hour cometh, when ye shall neither in this mountain, nor yet at Jerusalem, worship the Father”. Under Pilate a Samaritan crowd climbing the mountain to see vessels hidden by Moses was cut down, and the complaint cost Pilate his office."
    - "After the Samaritan revolt of 484 the emperor Zeno built on the summit an octagonal church of Mary the Mother of God, which Justinian fortified; its ruins stand beside the Hellenistic precinct. The Samaritans, fewer than a thousand today, keep the Passover with the sacrifice of lambs on the mountain each spring, and half of them live in the village of Kiryat Luza on its slope; the summit, Jebel et-Tur, is an archaeological park above Nablus in the West Bank."
  ru:
    - "Гора Гаризим поднимается на 881 м с южной стороны Сихемского прохода, напротив горы Гевал через узкую долину, в которой теперь лежит Наблус; у её подножия колодец Иакова и развалины Сихема. Моисей заповедал, что, когда Израиль войдёт в землю, «произнеси благословение на горе Гаризим, а проклятие на горе Гевал», по шести колен на каждой; Иисус Навин исполнил это, поставив ковчег между двумя горами, «одна половина их у горы Гаризим, а другая половина у горы Гевал». Когда жители Сихема поставили царём Авимелеха, его брат Иофам «пошел и стал на вершине горы Гаризима и, возвысив голос свой, кричал» свою притчу о деревьях, избравших терновник."
    - "Для самарян Гаризим — гора, которую избрал Бог, и их Пятикнижие называет её там, где иудейский текст ставит Гевал. Иосиф Флавий рассказывает, что храм на ней построили во дни Александра Великого; раскопки Ицхака Магена в 1983–2006 годах открыли священную ограду с сотнями надписей, которую он датировал серединой V века до н. э.; в начале II века её сильно расширили. Антиох IV велел переименовать храм в честь Зевса Странноприимца, а Иоанн Гиркан разрушил его около 110 г. до н. э. Слова самарянки Иисусу у колодца — «Отцы наши поклонялись на этой горе, а вы говорите, что место, где должно поклоняться, находится в Иерусалиме» — указывают на её голую вершину, и Он ответил, что «наступает время, когда и не на горе сей, и не в Иерусалиме будете поклоняться Отцу». При Пилате толпа, поднимавшаяся на гору, чтобы увидеть сосуды, зарытые Моисеем, была перебита, и жалоба стоила Пилату должности."
    - "После самарянского восстания 484 года император Зенон построил на вершине восьмиугольную церковь Марии Богородицы, которую Юстиниан укрепил; её развалины стоят рядом с эллинистической оградой. Самаряне, которых сегодня меньше тысячи, каждую весну совершают на горе Пасху с жертвой агнцев, и половина их живёт в селении Кирьят-Луза на её склоне; вершина, Джебель-эт-Тур, — археологический парк над Наблусом на Западном берегу."
  uk:
    - "Гарізім здіймається на 881 м на південному боці проходу Сихема, навпроти гори Гевал через вузьку долину, в якій тепер лежить Наблус; Колодязь Якова та руїни Сихема — біля його підніжжя. Мойсей наказав, що коли Ізраїль увійде в землю, «принеси благословеннє на Геризім горі а прокляттє на Ебаль горі», і Ісус Навин це виконав: «одна половина їх навпроти Гарисим гори, а друга половина навпроти Гебал гори». Коли сихемляни зробили Авімелеха царем, його брат Йотам «взійшов він на верх гори Гарисим, і покликнув голосно» свою байку про дерева, що обрали терен."
    - "Для самарян Гарізім — гора, яку обрав Бог, і їхнє П’ятикнижжя називає її там, де єврейський текст має Гевал. Йосиф Флавій каже, що храм на ній було збудовано за днів Александра Великого; розкопки Іцхака Магена в 1983–2006 рр. відкрили священну округу, яку він датував серединою V ст. до н. е., значно розширену на початку II ст. Антіох IV звелів перейменувати храм на Зевса Гостинного, а Іоанн Гіркан зруйнував його близько 110 р. до н. е. Слова самарянки до Ісуса біля криниці — «Батьки наші на сїй горі покланялись; а ви кажете, що в Єрусалимі місце, де треба покланяти ся» — вказують на її голу вершину, а він відповів, що «прийде час, коли нї на горі сїй, анї в Єрусалимі покланяти метесь ви Отцеві». За Пилата самарянський натовп, що піднімався на гору побачити посуд, захований Мойсеєм, був порубаний, і скарга коштувала Пилатові посади."
    - "Після самарянського повстання 484 р. імператор Зенон збудував на вершині восьмикутну церкву Марії Богородиці, яку Юстиніан укріпив; її руїни стоять поряд з елліністичною округою. Самаряни, яких сьогодні менш як тисяча, щовесни святкують Пасху з жертвоприношенням ягнят на горі, і половина з них живе в селі Кір’ят-Луза на її схилі; вершина, Джебель-ет-Тур, — археологічний парк над Наблусом на Західному березі."
  es:
    - "El monte Gerizim se eleva a 881 m en el lado sur del paso de Siquem, frente al monte Ebal al otro lado del estrecho valle donde hoy se encuentra Nablus; el pozo de Jacob y las ruinas de Siquem están a su pie. Moisés ordenó que, cuando Israel entrara en la tierra, «pondrás la bendición sobre el monte Gerizim, y la maldición sobre el monte Ebal», y Josué lo cumplió, «la mitad de ellos estaba hacia el monte de Gerizim, y la otra mitad hacia el monte de Ebal». Cuando los hombres de Siquem hicieron rey a Abimelec, su hermano Jotam «fué y púsose en la cumbre del monte de Gerizim, y alzando su voz clamó» su fábula de los árboles que eligieron la zarza."
    - "Para los samaritanos el Gerizim es la montaña que Dios eligió, y su Pentateuco la nombra donde el judío tiene Ebal. Josefo dice que allí se construyó un templo en los días de Alejandro Magno; las excavaciones de Yitzhak Magen en 1983–2006 hallaron un recinto sagrado que fechó a mediados del siglo V a. C., muy ampliado a inicios del II. Antíoco IV hizo rebautizar el templo en honor de Zeus Hospitalario, y Juan Hircano lo destruyó hacia 110 a. C. Las palabras de la samaritana a Jesús en el pozo, «Nuestros padres adoraron en este monte, y vosotros decís que en Jerusalem es el lugar donde es necesario adorar», apuntan a su desnuda cumbre, y él respondió que «la hora viene, cuando ni en este monte, ni en Jerusalem adoraréis al Padre». Bajo Pilato, una multitud samaritana que subía a la montaña a ver unos vasos escondidos por Moisés fue masacrada, y la queja costó a Pilato el cargo."
    - "Tras la rebelión samaritana de 484, el emperador Zenón construyó en la cumbre una iglesia octogonal de María Madre de Dios, que Justiniano fortificó; sus ruinas se alzan junto al recinto helenístico. Los samaritanos, hoy menos de mil, celebran la Pascua con el sacrificio de corderos en la montaña cada primavera, y la mitad de ellos vive en la aldea de Kiryat Luza, en su ladera; la cumbre, Yebel et-Tur, es un parque arqueológico sobre Nablus, en Cisjordania."
  pt:
    - "O monte Gerizim ergue-se a 881 m no lado sul da passagem de Siquém, de frente para o monte Ebal do outro lado do estreito vale em que hoje se situa Nablus; o poço de Jacó e as ruínas de Siquém estão ao seu pé. Moisés ordenou que, quando Israel entrasse na terra, “vocês colocarão a bênção sobre o monte Gerizim, e a maldição sobre o monte Ebal”, e Josué o cumpriu, “metade deles em frente ao monte Gerizim, e a outra metade em frente ao monte Ebal”. Quando os homens de Siquém fizeram Abimeleque rei, seu irmão Jotão “foi e ficou no topo do monte Gerizim e, levantando a voz, clamou” sua fábula das árvores que escolheram o espinheiro."
    - "Para os samaritanos, o Gerizim é a montanha que Deus escolheu, e seu Pentateuco a nomeia onde o texto judaico traz Ebal. Josefo diz que um templo foi construído nela nos dias de Alexandre Magno; as escavações de Yitzhak Magen em 1983–2006 acharam um recinto sagrado que ele datou de meados do século V a.C., muito ampliado no início do II. Antíoco IV mandou rebatizar o templo em honra de Zeus Hospitaleiro, e João Hircano o destruiu por volta de 110 a.C. As palavras da mulher samaritana a Jesus junto ao poço, “Nossos pais adoraram neste monte, e vocês, judeus, dizem que em Jerusalém é o lugar onde se deve adorar”, apontam para o cume nu, e ele respondeu que “a hora vem quando nem neste monte nem em Jerusalém vocês adorarão o Pai”. Sob Pilatos, uma multidão samaritana que subia a montanha para ver vasos escondidos por Moisés foi massacrada, e a queixa lhe custou o cargo."
    - "Depois da revolta samaritana de 484, o imperador Zenão construiu no cume uma igreja octogonal de Maria, Mãe de Deus, que Justiniano fortificou; suas ruínas estão ao lado do recinto helenístico. Os samaritanos, menos de mil hoje, celebram a Páscoa com o sacrifício de cordeiros na montanha a cada primavera, e metade deles vive na aldeia de Kiryat Luza, em sua encosta; o cume, Jebel et-Tur, é um parque arqueológico acima de Nablus, na Cisjordânia."
  de:
    - "Der Garizim erhebt sich 881 m hoch an der Südseite des Passes von Sichem, dem Ebal gegenüber über dem engen Tal, in dem heute Nablus liegt; Jakobs Brunnen und die Ruinen von Sichem liegen an seinem Fuß. Mose gebot, dass Israel beim Eintritt ins Land „den Segen sprechen lassen auf dem Berge Garizim und den Fluch auf dem Berge Ebal“ solle, und Josua führte es aus: „eine Hälfte neben dem Berge Garizim und die andere Hälfte neben dem Berge Ebal“. Als die Männer von Sichem Abimelech zum König machten, trat sein Bruder Jotam „auf die Höhe des Berges Garizim und hob auf seine Stimme, rief“ seine Fabel von den Bäumen, die den Dornbusch wählten."
    - "Den Samaritanern ist der Garizim der von Gott erwählte Berg; ihr Pentateuch nennt ihn, wo der jüdische Text Ebal hat. Nach Josephus wurde zur Zeit Alexanders des Großen ein Tempel auf ihm gebaut; Yitzhak Magen legte 1983–2006 einen heiligen Bezirk frei, nach seiner Datierung Mitte des 5. Jahrhunderts v. Chr. angelegt und Anfang des 2. stark erweitert. Antiochos IV. weihte den Tempel Zeus Xenios, und Johannes Hyrkanos zerstörte ihn um 110 v. Chr. Die Samariterin am Brunnen meint seinen Gipfel: „Unsere Väter haben auf diesem Berge angebetet, und ihr sagt, zu Jerusalem sei die Stätte, da man anbeten solle“; Jesus antwortete: „es kommt die Zeit, daß ihr weder auf diesem Berge noch zu Jerusalem werdet den Vater anbeten“. Unter Pilatus wurden Samaritaner, die den Berg hinaufzogen, um von Mose verborgene Gefäße zu sehen, niedergemacht; die Beschwerde kostete ihn sein Amt."
    - "Nach dem samaritanischen Aufstand von 484 baute Kaiser Zeno auf dem Gipfel eine achteckige Kirche der Maria, der Gottesmutter, die Justinian befestigte; ihre Ruinen stehen neben dem hellenistischen Bezirk. Die Samaritaner, heute weniger als tausend, feiern das Passa mit dem Opfer von Lämmern jedes Frühjahr auf dem Berg, und die Hälfte von ihnen lebt im Dorf Kiryat Luza an seinem Hang; der Gipfel, Jebel et-Tur, ist ein archäologischer Park oberhalb von Nablus im Westjordanland."
  fr:
    - "Le mont Garizim s’élève à 881 m sur le côté sud du défilé de Sichem, face au mont Ébal de l’autre côté de l’étroite vallée où se trouve aujourd’hui Naplouse ; le puits de Jacob et les ruines de Sichem sont à son pied. Moïse ordonna que, lorsqu’Israël entrerait dans le pays, « tu prononceras la bénédiction sur la montagne de Garizim, et la malédiction sur la montagne d’Ébal », et Josué l’exécuta, « moitié du côté du mont Garizim, moitié du côté du mont Ébal ». Quand les hommes de Sichem firent roi Abimélec, son frère Jotham « alla se placer sur le sommet de la montagne de Garizim, et voici ce qu’il leur cria à haute voix » : sa fable des arbres qui choisirent l’épine."
    - "Pour les Samaritains, le Garizim est la montagne choisie par Dieu, et leur Pentateuque la nomme là où le texte juif a Ébal. Flavius Josèphe dit qu’un temple y fut bâti sous Alexandre le Grand ; les fouilles de Yitzhak Magen en 1983–2006 ont mis au jour un enclos sacré qu’il data du milieu du Ve siècle av. J.-C., très agrandi au début du IIe. Antiochos IV fit consacrer le temple à Zeus l’Hospitalier, et Jean Hyrcan le détruisit vers 110 av. J.-C. Les mots de la Samaritaine à Jésus au puits, « Nos pères ont adoré sur cette montagne ; et vous dites, vous, que le lieu où il faut adorer est à Jérusalem », visent son sommet nu, et il répondit que « l’heure vient où ce ne sera ni sur cette montagne ni à Jérusalem que vous adorerez le Père ». Sous Pilate, une foule samaritaine montée voir des vases cachés par Moïse fut massacrée, et la plainte coûta sa charge à Pilate."
    - "Après la révolte samaritaine de 484, l’empereur Zénon bâtit au sommet une église octogonale de Marie, Mère de Dieu, que Justinien fortifia ; ses ruines se dressent à côté de l’enclos hellénistique. Les Samaritains, moins d’un millier aujourd’hui, célèbrent la Pâque avec le sacrifice d’agneaux sur la montagne chaque printemps, et la moitié d’entre eux vivent dans le village de Kiryat Luza sur sa pente ; le sommet, djebel et-Tur, est un parc archéologique au-dessus de Naplouse, en Cisjordanie."
  it:
    - "Il Monte Garizim si leva a 881 m sul lato sud del passo di Sichem, di fronte al Monte Ebal al di là della stretta valle in cui sorge oggi Nablus; il pozzo di Giacobbe e le rovine di Sichem sono ai suoi piedi. Mosè comandò che, quando Israele fosse entrato nella terra, «tu pronunzierai la benedizione sul monte Gherizim, e la maledizione sul monte Ebal», e Giosuè lo eseguì, «metà dal lato del monte Garizim, metà dal lato del monte Ebal». Quando gli uomini di Sichem fecero re Abimelech, suo fratello Iotam «andò a porsi sulla sommità del monte Garizim, e alzando la voce gridò» la sua favola degli alberi che scelsero il rovo."
    - "Per i Samaritani il Garizim è il monte scelto da Dio, e il loro Pentateuco lo nomina dove il testo ebraico ha Ebal. Giuseppe Flavio dice che vi fu costruito un tempio ai giorni di Alessandro Magno; gli scavi di Yitzhak Magen nel 1983–2006 hanno portato alla luce un recinto sacro da lui datato a metà del V secolo a.C., molto ampliato all’inizio del II. Antioco IV fece intitolare il tempio a Zeus Ospitale, e Giovanni Ircano lo distrusse verso il 110 a.C. Le parole della Samaritana a Gesù al pozzo, «I nostri padri hanno adorato su questo monte, e voi dite che a Gerusalemme è il luogo dove bisogna adorare», rimandano alla sua nuda cima, ed egli rispose: «l’ora viene che né su questo monte né a Gerusalemme adorerete il Padre». Sotto Pilato una folla samaritana che saliva al monte per vedere vasi nascosti da Mosè fu massacrata, e la protesta costò a Pilato la carica."
    - "Dopo la rivolta samaritana del 484 l’imperatore Zenone costruì sulla cima una chiesa ottagonale di Maria Madre di Dio, che Giustiniano fortificò; le sue rovine sorgono accanto al recinto ellenistico. I Samaritani, oggi meno di mille, celebrano la Pasqua con il sacrificio di agnelli sul monte ogni primavera, e metà di loro vive nel villaggio di Kiryat Luza sul suo pendio; la cima, Jebel et-Tur, è un parco archeologico sopra Nablus in Cisgiordania."
  pl:
    - "Garizim wznosi się do 881 m po południowej stronie przełęczy Sychem, naprzeciw góry Ebal przez wąską dolinę, w której leży dziś Nablus; u jego stóp są studnia Jakuba i ruiny Sychem. Mojżesz nakazał, co uczynić po wejściu do ziemi: „dasz błogosławieństwo to na górze Garyzym, a przeklęstwo na górze Hebal”, a Jozue to wykonał, gdy lud stał, „połowa ich przeciw górze Garyzym, a połowa ich przeciw górze Hebal”. Gdy mężowie Sychem ustanowili królem Abimeleka, jego brat Jotam „szedłszy stanął na wierzchu góry Garyzym, a podniósłszy głos swój wołał” swoją bajkę o drzewach, które wybrały cierniowy krzew."
    - "Dla Samarytan Garizim jest górą, którą wybrał Bóg, a ich Pięcioksiąg nazywa ją tam, gdzie tekst żydowski ma Ebal. Józef Flawiusz mówi, że za Aleksandra Wielkiego zbudowano na niej świątynię; wykopaliska Yitzhaka Magena w latach 1983–2006 odsłoniły święty obszar, który datował na połowę V w. p.n.e., znacznie powiększony na początku II w. Antioch IV kazał nazwać świątynię świątynią Zeusa Gościnnego, a Jan Hyrkan zburzył ją około 110 r. p.n.e. Słowa Samarytanki do Jezusa przy studni, „Ojcowie nasi na tej górze chwalili Boga, a wy powiadacie, że w Jeruzalemie jest miejsce, kędy przyzwoita chwalić”, wskazują na jej szczyt, a on odpowiedział: „idzie godzina, gdy ani na tej górze, ani w Jeruzalemie nie będziecie chwalili Ojca”. Za Piłata tłum samarytański wspinający się na górę, by zobaczyć naczynia ukryte przez Mojżesza, został wycięty, a skarga kosztowała Piłata urząd."
    - "Po powstaniu samarytańskim w 484 r. cesarz Zenon zbudował na szczycie ośmioboczny kościół Marii Matki Bożej, który ufortyfikował Justynian; jego ruiny stoją obok hellenistycznego obszaru. Samarytanie, których jest dziś mniej niż tysiąc, obchodzą Paschę z ofiarą baranków na górze co wiosnę, a połowa z nich mieszka we wsi Kiryat Luza na jej zboczu; szczyt, Dżabal et-Tur, jest parkiem archeologicznym nad Nablusem na Zachodnim Brzegu."
  nl:
    - "De Gerizim rijst op tot 881 m aan de zuidkant van de pas van Sichem, tegenover de Ebal aan de overkant van het smalle dal waarin nu Nabloes ligt; Jakobs bron en de ruïnes van Sichem liggen aan zijn voet. Mozes gebood dat Israël, wanneer het het land binnenkwam, “den zegen uitspreken op den berg Gerizim, en den vloek op den berg Ebal”, en Jozua voerde het uit, “een helft daarvan tegenover den berg Gerizim, en een helft daarvan tegenover den berg Ebal”. Toen de mannen van Sichem Abimelech koning maakten, ging zijn broer Jotam naar de top en “stond op de hoogte des bergs Gerizim, en verhief zijn stem, en riep” zijn fabel van de bomen die de doornstruik kozen."
    - "Voor de Samaritanen is de Gerizim de door God gekozen berg; hun Pentateuch noemt hem waar de joodse tekst Ebal heeft. Josephus zegt dat er in Alexanders tijd een tempel op werd gebouwd; Yitzhak Magen (opgravingen 1983–2006) legde een heilig complex bloot uit het midden van de vijfde eeuw v.Chr., begin tweede eeuw uitgebreid. Antiochus IV liet de tempel naar Zeus de Gastvrije noemen, en Johannes Hyrcanus verwoestte hem omstreeks 110 v.Chr. Zijn kale top ligt achter de woorden van de Samaritaanse vrouw: “Onze vaders hebben op dezen berg aangebeden; en gijlieden zegt, dat te Jeruzalem de plaats is, waar men moet aanbidden”, en Zijn antwoord: “de ure komt, wanneer gijlieden, noch op dezen berg, noch te Jeruzalem, den Vader zult aanbidden”. Onder Pilatus werd een Samaritaanse menigte op weg naar de door Mozes verborgen vaten neergehouwen; de klacht kostte hem zijn ambt."
    - "Na de Samaritaanse opstand van 484 bouwde keizer Zeno op de top een achthoekige kerk van Maria, de Moeder Gods, die Justinianus versterkte; haar ruïnes staan naast het hellenistische complex. De Samaritanen, tegenwoordig minder dan duizend, vieren het Pascha met het offer van lammeren op de berg elke lente, en de helft van hen woont in het dorp Kiryat Luza op zijn helling; de top, Jebel et-Tur, is een archeologisch park boven Nabloes op de Westoever."
  cs:
    - "Hora Gerizim vystupuje do 881 m na jižní straně průsmyku Šekemu, protilehlá hoře Ébal přes úzké údolí, v němž dnes leží Nábulus; Jákobova studna a zříceniny Šekemu jsou u jejího úpatí. Mojžíš přikázal, že až Izrael vejde do země, „dáš požehnání toto na hoře Garizim, a zlořečení na hoře Hébal“, a Jozue to provedl, „polovice jich proti hoře Garizim, a polovice proti hoře Hébal“. Když muži Šekemští učinili králem Abimeleka, jeho bratr Jotam „postavil se na vrchu hory Garizim, a pozdvihna hlasu svého, volal“ svou bajku o stromech, které zvolily trnku."
    - "Pro Samaritány je Gerizim hora, kterou Bůh vyvolil, a jejich Pentateuch ji jmenuje tam, kde židovský text má Ébal. Josephus praví, že na ní byl za dnů Alexandra Velikého postaven chrám; vykopávky Yitzhaka Magena v letech 1983–2006 odkryly posvátný okrsek, který datoval do poloviny 5. století př. n. l., značně rozšířený na počátku 2. století. Antiochos IV. dal chrám přejmenovat na chrám Dia Pohostinného a Jan Hyrkanos jej zničil kolem roku 110 př. n. l. Slova Samaritánky k Ježíšovi u studny, „Otcové naši na této hoře modlívali se, a vy pravíte, že v Jeruzalémě jest místo, kdežto náleží se modliti“, ukazují na její holý vrchol a on odpověděl: „žeť jde hodina, kdyžto ani na této hoře, ani v Jeruzalémě nebudete se modliti Otci“. Za Pilata byl dav Samaritánů, který vystupoval na horu, aby viděl nádoby ukryté Mojžíšem, pobit a stížnost stála Pilata úřad."
    - "Po samaritánském povstání roku 484 postavil císař Zenón na vrcholu osmiboký kostel Marie Matky Boží, který Justinianus opevnil; jeho zříceniny stojí vedle helénistického okrsku. Samaritáni, dnes méně než tisíc, slaví na hoře každé jaro pesach s obětí jehňat a polovina z nich žije ve vsi Kiryat Luza na jejím svahu; vrchol, Jebel et-Tur, je archeologickým parkem nad Nábulusem na Západním břehu."
  sv:
    - "Berget Gerisim reser sig 881 m på södra sidan av passet i Shekem, mitt emot berget Ebal över den smala dalen där Nablus nu ligger; Jakobs brunn och ruinerna av Shekem ligger vid dess fot. Mose befallde att när Israel kom in i landet ”skall du låta berget Gerissim bliva platsen för välsignelsen och berget Ebal platsen för förbannelsen”, och Josua genomförde det, ”den ena hälften vänd mot berget Gerissim och den andra hälften mot berget Ebal”. När Shekems män gjorde Avimelek till kung och hans bror Jotam fick höra det, ”gick han åstad och ställde sig på toppen av berget Gerissim och hov upp sin röst och ropade” sin fabel om träden som valde törnbusken."
    - "För samariterna är Gerisim berget Gud valde, och deras Pentateuk nämner det där den judiska texten har Ebal. Josefus säger att ett tempel byggdes på det på Alexander den stores tid; Yitzhak Magens utgrävningar 1983–2006 fann ett heligt område som han daterade till mitten av 400-talet f.Kr., utvidgat tidigt på 100-talet. Antiochos IV döpte om templet till Zeus Gästvänlige, och Johannes Hyrkanos förstörde det omkring 110 f.Kr. Den samaritiska kvinnans ord till Jesus vid brunnen, ”Våra fäder hava tillbett på detta berg, men I sägen att i Jerusalem den plats finnes, där man bör tillbedja”, syftar på dess kala topp, och han svarade att ”den tid kommer, då det varken är på detta berg eller i Jerusalem som I skolen tillbedja Fadern”. Under Pilatus höggs en samaritisk skara ned när den steg upp på berget för att se kärl dolda av Mose, och klagomålet kostade Pilatus ämbetet."
    - "Efter det samaritiska upproret 484 byggde kejsar Zeno på toppen en åttkantig kyrka åt Maria, Guds moder, som Justinianus befäste; dess ruiner står bredvid det hellenistiska området. Samariterna, i dag färre än tusen, firar påsk med offer av lamm på berget varje vår, och hälften av dem bor i byn Kiryat Luza på dess sluttning; toppen, Jebel et-Tur, är en arkeologisk park ovanför Nablus på Västbanken."
  nb:
    - "Garisim stiger til 881 m på sørsiden av passet ved Sikem, vendt mot Ebal over den trange dalen der Nablus nå ligger; Jakobs brønn og ruinene av Sikem ligger ved foten. Moses befalte at når Israel kom inn i landet, «da skal du lyse velsignelsen på fjellet Garisim og forbannelsen på fjellet Ebal», og Josva gjennomførte det, «den ene halvdel av dem mot Garisim-fjellet, og den andre halvdel mot Ebal-fjellet». Da Sikems menn gjorde Abimelek til konge, fikk hans bror Jotam vite det og «gikk op på toppen av Gerisim-fjellet; der stod han og ropte høit» med sin fabel om trærne som valgte tornebusken."
    - "For samaritanene er Garisim fjellet Gud utvalgte, og deres Pentateuk nevner det der den jødiske teksten har Ebal. Josefus sier at et tempel ble bygget på det i Aleksander den stores dager; Yitzhak Magens utgravninger i 1983–2006 avdekket et hellig område han daterte til midt på 400-tallet f.Kr., sterkt utvidet tidlig på 100-tallet. Antiokos IV lot tempelet omdøpe til Zevs den gjestfrie, og Johannes Hyrkan ødela det omkring 110 f.Kr. Den samaritanske kvinnens ord til Jesus ved brønnen, «Våre fedre tilbad på dette fjell, og I sier at i Jerusalem er det sted hvor en skal tilbede», peker på dets nakne topp, og han svarte at «den time kommer da I hverken skal tilbede Faderen på dette fjell eller i Jerusalem». Under Pilatus ble en samaritansk folkemengde som gikk opp på fjellet for å se kar skjult av Moses, hugget ned, og klagen kostet Pilatus embetet."
    - "Etter det samaritanske opprøret i 484 bygde keiser Zeno på toppen en åttekantet kirke for Maria, Guds mor, som Justinian befestet; ruinene ligger ved siden av det hellenistiske området. Samaritanene, i dag færre enn tusen, holder påske med lammeofring på fjellet hver vår, og halvparten av dem bor i landsbyen Kiryat Luza på dets skråning; toppen, Jebel et-Tur, er en arkeologisk park over Nablus på Vestbredden."
  tl:
    - "Ang Bundok Gerizim ay tumataas sa 881 m sa timog na panig ng daanan ng Sichem, nakaharap sa Bundok Ebal sa kabila ng makitid na libis kung saan nakatayo ang Nablus ngayon; ang balon ni Jacob at ang mga guho ng Sichem ay nasa paanan nito. Iniutos ni Moises na pagpasok ng Israel sa lupain, “iyong ilalagay ang pagpapala sa bundok ng Gerizim, at ang sumpa sa bundok ng Ebal”, at isinagawa ito ni Josue, “kalahati nila ay sa harap ng bundok ng Gerizim at kalahati nila ay sa harap ng bundok ng Ebal”. Nang gawing hari ng mga taga-Sichem si Abimelech, ang kapatid niyang si Jotham ay “yumaon at tumayo sa taluktok ng bundok Gerizim, at inilakas ang kaniyang tinig, at sumigaw” ng kaniyang pabula ng mga punong pumili ng dawag."
    - "Para sa mga Samaritano, piniling bundok ng Diyos ang Gerizim; nasa Pentateuko nila ito kung saan Ebal sa tekstong Judio. Ayon kay Josefo, may templong itinayo rito noong panahon ni Alejandro Magno; sa paghuhukay ni Yitzhak Magen (1983–2006) lumitaw ang banal na bakurang ipinetsa niya sa kalagitnaan ng ika-5 siglo BK, lubhang pinalaki sa simula ng ika-2. Pinangalanan ni Antioco IV ang templo kay Zeus na Mapagpatuloy; winasak ito ni Juan Hircano mga 110 BK. Ang sinabi ng Samaritana kay Jesus sa balon, “Nagsisamba ang aming mga magulang sa bundok na ito …”, ay tumutukoy sa hubad na tuktok nito; sagot niya, “dumarating ang oras, na kahit sa bundok na ito, ni sa Jerusalem, ay hindi ninyo sasambahin ang Ama”. Sa ilalim ni Pilato, pinaslang ang mga Samaritanong umakyat para makita ang mga sisidlang itinago ni Moises; dahil sa reklamo, natanggal si Pilato."
    - "Pagkatapos ng paghihimagsik ng mga Samaritano noong 484, itinayo ni Emperador Zeno sa tuktok ang walong-sulok na simbahan ni Maria na Ina ng Diyos, na pinatibay ni Justiniano; nasa tabi ng bakuran ng panahong Helenistiko ang mga guho nito. Ang mga Samaritano, wala pang isang libo ngayon, ay nagdiriwang ng Paskua na may paghahandog ng mga kordero sa bundok tuwing tagsibol, at kalahati sa kanila ay nakatira sa nayon ng Kiryat Luza sa dalisdis nito; ang tuktok, ang Jebel et-Tur, ay liwasang arkeolohikal sa itaas ng Nablus sa West Bank."
