# Overview article (ADR 0007). Mainstream facts only; a route, not a settlement: the Arabah road to the Gulf of Aqaba is the usual reading and is given as such.
id: way-of-the-red-sea
place: a55c970
title:
  en: "Way of the Red Sea"
  ru: "Путь Чермного моря"
body:
  en:
    - "The way of the Red Sea is the road by which Israel, turned back from the border of Canaan, went south again into the desert and later round the land of Edom. The Red Sea here is the Gulf of Aqaba, for Deuteronomy adds that they passed “from Elath, and from Ezion-gaber”, and the road is the one that runs from Kadesh and the Negeb highlands down into the Arabah and along that long valley to the head of the gulf, the track of the copper caravans of Timna and Feinan in all ages. It is the Bible's name for a route, not a place; no ancient source outside the Bible names it, and the map's point on the Arabah floor stands for the whole road. The “way of the wilderness of the Red sea” by which Israel left Egypt is a different road, on the Gulf of Suez side."
    - "After the spies' report and the people's refusal, the Lord said: “To morrow turn you, and get you into the wilderness by the way of the Red sea”, and Moses recalls the order, “turn you, and take your journey into the wilderness by the way of the Red sea”, and its fulfilment: “we turned, and took our journey into the wilderness by the way of the Red sea, as the LORD spake unto me: and we compassed mount Seir many days”."
    - "Thirty-eight years later, when Edom refused passage, “they journeyed from mount Hor by the way of the Red sea, to compass the land of Edom: and the soul of the people was much discouraged because of the way”; on this road came the fiery serpents and the serpent of brass. From the gulf they turned north-east around Edom to the brook Zered and the plains of Moab. The road today is the Arabah highway on each side of the border, Israel's Route 90 from the Dead Sea to Eilat and Jordan's road through Wadi Araba to Aqaba, past the copper mines of Timna and the Nabataean and Roman ruins of the valley."
  ru:
    - "Путь Чермного моря — дорога, которой Израиль, отвернув от границы Ханаана, снова ушёл на юг в пустыню, а позже обошёл землю Едома. Чермное море здесь — залив Акаба, ибо Второзаконие добавляет, что они прошли «от Елафа и Ецион-Гавера»; дорога же та, что спускается от Кадеса и нагорья Негева в Араву и идёт этой длинной долиной до вершины залива, — путь медных караванов Тимны и Фейнана во все века. Это библейское имя маршрута, а не места: ни один древний источник вне Библии его не называет, и точка, отмеченная на карте на дне Аравы, обозначает всю дорогу. Дорога выхода из Египта, когда «обвел Бог народ дорогою пустынною к Чермному морю», — другая, со стороны Суэцкого залива."
    - "После доклада соглядатаев и отказа народа Господь сказал: «завтра обратитесь и идите в пустыню к Чермному морю», и Моисей вспоминает приказ — «обратитесь и отправьтесь в пустыню по дороге к Чермному морю» — и его исполнение: «И обратились мы и отправились в пустыню к Чермному морю, как говорил мне Господь, и много времени ходили вокруг горы Сеира»."
    - "Тридцать восемь лет спустя, когда Едом отказал в проходе, «от горы Ор отправились они путем Чермного моря, чтобы миновать землю Едома. И стал малодушествовать народ на пути»; на этой дороге пришли ядовитые змеи и был поднят медный змей. От залива они повернули на северо-восток в обход Едома к потоку Заред и равнинам Моава. Сегодня эта дорога — шоссе Аравы по обе стороны границы: израильская трасса 90 от Мёртвого моря до Эйлата и иорданская дорога через Вади-Араба в Акабу, мимо медных рудников Тимны и набатейских и римских развалин долины."
