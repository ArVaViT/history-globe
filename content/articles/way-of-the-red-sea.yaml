# Overview article (ADR 0007). Mainstream facts only; a route, not a settlement: the Arabah road to the Gulf of Aqaba is the usual reading and is given as such.
id: way-of-the-red-sea
place: a55c970
title:
  en: "Way of the Red Sea"
  ru: "Путь Чермного моря"
  uk: "Шлях Червоного моря"
  es: "Camino del Mar Rojo"
  pt: "Caminho do Mar Vermelho"
  de: "Straße zum Roten Meer"
  fr: "Chemin de la mer Rouge"
  pl: "Droga nad Morzem Czerwonym"
  it: "Via del Mar Rosso"
  nl: "Weg naar de Rode Zee"
  cs: "Cesta k Rudému moři"
  sv: "Vägen mot Sävhavet"
  nb: "Veien til Rødehavet"
  tl: "Daan ng Dagat na Pula"
body:
  en:
    - "The way of the Red Sea is the road by which Israel, turned back from the border of Canaan, went south again into the desert and later round the land of Edom. The Red Sea here is the Gulf of Aqaba, for Deuteronomy adds that they passed “from Elath, and from Ezion-gaber”, and the road is the one that runs from Kadesh and the Negeb highlands down into the Arabah and along that long valley to the head of the gulf, the track of the copper caravans of Timna and Feinan in all ages. It is the Bible's name for a route, not a place; no ancient source outside the Bible names it, and the map's point on the Arabah floor stands for the whole road. The “way of the wilderness of the Red sea” by which Israel left Egypt is usually taken to be a different road, toward the Gulf of Suez, though the route of the Exodus is disputed."
    - "After the spies' report and the people's refusal, the Lord said: “To morrow turn you, and get you into the wilderness by the way of the Red sea”, and Moses recalls the order, “turn you, and take your journey into the wilderness by the way of the Red sea”, and its fulfilment: “we turned, and took our journey into the wilderness by the way of the Red sea, as the LORD spake unto me: and we compassed mount Seir many days”."
    - "Thirty-eight years later, when Edom refused passage, “they journeyed from mount Hor by the way of the Red sea, to compass the land of Edom: and the soul of the people was much discouraged because of the way”; on this road came the fiery serpents and the serpent of brass. From the gulf they turned north-east around Edom to the brook Zered and the plains of Moab. The road today is the Arabah highway on each side of the border, Israel's Route 90 from the Dead Sea to Eilat and Jordan's road through Wadi Araba to Aqaba, past the copper mines of Timna and the Nabataean and Roman ruins of the valley."
  ru:
    - "Путь Чермного моря — дорога, которой Израиль, отвернув от границы Ханаана, снова ушёл на юг в пустыню, а позже обошёл землю Едома. Чермное море здесь — залив Акаба, ибо Второзаконие добавляет, что они прошли «от Елафа и Ецион-Гавера»; дорога же та, что спускается от Кадеса и нагорья Негева в Араву и идёт этой длинной долиной до вершины залива, — путь медных караванов Тимны и Фейнана во все века. Это библейское имя маршрута, а не места: ни один древний источник вне Библии его не называет, и точка, отмеченная на карте на дне Аравы, обозначает всю дорогу. Дорога выхода из Египта, когда «обвел Бог народ дорогою пустынною к Чермному морю», — это, как обычно считают, другая дорога, к Суэцкому заливу, хотя маршрут Исхода спорен."
    - "После доклада соглядатаев и отказа народа Господь сказал: «завтра обратитесь и идите в пустыню к Чермному морю», и Моисей вспоминает приказ — «обратитесь и отправьтесь в пустыню по дороге к Чермному морю» — и его исполнение: «И обратились мы и отправились в пустыню к Чермному морю, как говорил мне Господь, и много времени ходили вокруг горы Сеира»."
    - "Тридцать восемь лет спустя, когда Едом отказал в проходе, «от горы Ор отправились они путем Чермного моря, чтобы миновать землю Едома. И стал малодушествовать народ на пути»; на этой дороге пришли ядовитые змеи и был поднят медный змей. От залива они повернули на северо-восток в обход Едома к потоку Заред и равнинам Моава. Сегодня эта дорога — шоссе Аравы по обе стороны границы: израильская трасса 90 от Мёртвого моря до Эйлата и иорданская дорога через Вади-Араба в Акабу, мимо медных рудников Тимны и набатейских и римских развалин долины."
  uk:
    - "Шлях Червоного моря — дорога, якою Ізраїль, завернений від кордону Ханаану, знову пішов на південь у пустелю, а пізніше навколо краю Едому. Червоне море тут — Акабська затока, бо Повторення Закону додає, що вони проходили «від Елата і від Езйон-Гебер», а дорога — та, що йде від Кадеша й негевського нагір’я вниз в Араву і вздовж цієї довгої долини до верхів’я затоки, стежка мідних караванів Тімни й Фейнана в усі віки. Це біблійна назва маршруту, а не місця; жодне давнє джерело поза Біблією її не називає, і точка мапи на дні Арави позначає всю дорогу. «Дорога до степу Червономорського», якою Ізраїль вийшов з Єгипту, — це, як зазвичай вважають, інша дорога, до Суецької затоки, хоча маршрут Виходу спірний."
    - "Після звіту розвідників і відмови народу Господь сказав: «завтра обернїтесь і рушайте в степ по дорозї до Червоного моря», і Мойсей пригадує наказ: «повернїтесь і рушайте в степ, в дорогу Червоного моря!» — і його виконання: «повернули ми та й рушили дальше степом до Червоного моря, як велїв менї Господь, і довго ми обминали Сеїр-гори»."
    - "Через тридцять вісім років, коли Едом відмовив у проході, «рушили дальше від Ор-гори шляхом до Червоного моря, щоб обминути Едом землю. І впав дух у людей в дорозї»; на цій дорозі з’явилися вогненні змії та мідний змій. Від затоки вони повернули на північний схід навколо Едому до потоку Заред і рівнин Моаву. Нині дорога — шосе вздовж Арави по обидва боки кордону, ізраїльське шосе 90 від Мертвого моря до Ейлата та йорданська дорога через Вади-Араба до Акаби, повз мідні копальні Тімни та набатейські й римські руїни долини."
  es:
    - "El camino del Mar Rojo es la ruta por la que Israel, devuelto desde la frontera de Canaán, descendió de nuevo al sur, al desierto, y más tarde rodeó la tierra de Edom. El Mar Rojo es aquí el golfo de Aqaba, pues el Deuteronomio añade que pasaron «por el camino de la llanura de Elath y de Esiongeber», y el camino es el que va desde Cades y las tierras altas del Néguev hasta el Arabá y, por ese largo valle, hasta la cabecera del golfo, la pista de las caravanas del cobre de Timna y Feinan en todas las épocas. Es el nombre bíblico de una ruta, no de un lugar; ninguna fuente antigua fuera de la Biblia lo nombra, y el punto del mapa en el suelo del Arabá representa todo el camino. El «camino del desierto del mar Bermejo» por el que Israel salió de Egipto suele considerarse un camino distinto, hacia el golfo de Suez, aunque la ruta del Éxodo es discutida."
    - "Tras el informe de los espías y la negativa del pueblo, el Señor dijo: «volveos mañana, y partíos al desierto, camino del mar Bermejo», y Moisés recuerda la orden, «volveos, y partíos al desierto camino del mar Bermejo», y su cumplimiento: «Y volvimos, y partímonos al desierto camino del mar Bermejo, como Jehová me había dicho; y rodeamos el monte de Seir por muchos días»."
    - "Treinta y ocho años después, cuando Edom rehusó el paso, «partieron del monte de Hor, camino del mar Bermejo, para rodear la tierra de Edom; y abatióse el ánimo del pueblo por el camino»; en este camino vinieron las serpientes ardientes y la serpiente de bronce. Desde el golfo giraron al noreste, rodeando Edom, hacia el arroyo Zered y las llanuras de Moab. El camino es hoy la carretera del Arabá a ambos lados de la frontera, la Ruta 90 de Israel desde el mar Muerto hasta Eilat y la carretera de Jordania por el Wadi Araba hasta Aqaba, pasando por las minas de cobre de Timna y las ruinas nabateas y romanas del valle."
  pt:
    - "O caminho do Mar Vermelho é a estrada por onde Israel, repelido da fronteira de Canaã, voltou para o sul, ao deserto, e depois contornou a terra de Edom. O Mar Vermelho aqui é o golfo de Aqaba, pois Deuteronômio acrescenta que passaram “de Elate e de Eziom-Geber”, e a estrada é a que vai de Cades e das terras altas do Neguebe até a Arabá e ao longo desse longo vale até a cabeceira do golfo, a trilha das caravanas de cobre de Timna e Feinan em todas as eras. É o nome bíblico de uma rota, não de um lugar; nenhuma fonte antiga fora da Bíblia a nomeia, e o ponto do mapa no fundo da Arabá representa toda a estrada. O “caminho do deserto, perto do Mar Vermelho” por onde Israel saiu do Egito costuma ser tida por outra estrada, rumo ao golfo de Suez, embora a rota do Êxodo seja discutida."
    - "Depois do relatório dos espias e da recusa do povo, o Senhor disse: “amanhã deem meia-volta e partam para o deserto pelo caminho do Mar Vermelho”, e Moisés recorda a ordem, “voltem-se e sigam a sua jornada para o deserto, pelo caminho do Mar Vermelho”, e seu cumprimento: “nos viramos e seguimos nossa jornada para o deserto, pelo caminho do Mar Vermelho, como o SENHOR me falou; e rodeamos o monte Seir por muitos dias”."
    - "Trinta e oito anos depois, quando Edom recusou passagem, “Eles viajaram do monte Hor pelo caminho do mar Vermelho, para contornar a terra de Edom. A alma do povo ficou muito desanimada por causa da jornada”; nessa estrada vieram as serpentes de fogo e a serpente de bronze. Do golfo viraram para nordeste, contornando Edom, até o ribeiro Zerede e as planícies de Moabe. A estrada hoje é a rodovia da Arabá em cada lado da fronteira, a Rota 90 de Israel do Mar Morto a Eilat e a estrada da Jordânia pelo Wadi Araba até Aqaba, passando pelas minas de cobre de Timna e pelas ruínas nabateias e romanas do vale."
  de:
    - "Die Straße zum Roten Meer ist der Weg, auf dem Israel, von der Grenze Kanaans zurückgewiesen, wieder nach Süden in die Wüste zog und später um das Land Edom herum. Das Rote Meer ist hier der Golf von Akaba, denn das Deuteronomium fügt hinzu, dass sie „auf dem Wege des Gefildes von Elath und Ezeon-Geber“ weiterzogen, und der Weg ist der von Kadesch und dem Negev-Hochland hinab in die Araba und durch dieses lange Tal zum Kopf des Golfs, die Spur der Kupferkarawanen von Timna und Feinan zu allen Zeiten. Es ist der biblische Name für eine Route, nicht für einen Ort; keine antike Quelle außerhalb der Bibel nennt ihn, und der Punkt der Karte auf dem Boden der Araba steht für die ganze Straße. Die „Straße durch die Wüste am Schilfmeer“, auf der Israel Ägypten verließ, gilt meist als ein anderer Weg, zum Golf von Suez hin, doch die Route des Auszugs ist umstritten."
    - "Nach dem Bericht der Kundschafter und der Weigerung des Volkes sagte der Herr: „Morgen wendet euch und ziehet in die Wüste auf dem Wege zum Schilfmeer“, und Mose erinnert an den Befehl, „Ihr aber wendet euch und ziehet nach der Wüste den Weg zum Schilfmeer“, und an seine Erfüllung: „Da wandten wir uns und zogen aus zur Wüste auf der Straße zum Schilfmeer, wie der HERR zu mir sagte, und umzogen das Gebirge Seir eine lange Zeit“."
    - "Achtunddreißig Jahre später, als Edom den Durchzug verweigerte, „zogen sie von dem Berge Hor auf dem Wege gegen das Schilfmeer, daß sie um der Edomiter Land hinzögen. Und das Volk ward verdrossen auf dem Wege“; auf dieser Straße kamen die feurigen Schlangen und die eherne Schlange. Vom Golf wandten sie sich nordöstlich um Edom zum Bach Sered und den Ebenen Moabs. Die Straße ist heute die Araba-Straße auf beiden Seiten der Grenze, Israels Route 90 vom Toten Meer nach Eilat und Jordaniens Straße durch das Wadi Araba nach Akaba, vorbei an den Kupferminen von Timna und den nabatäischen und römischen Ruinen des Tals."
  fr:
    - "Le chemin de la mer Rouge est la route par laquelle Israël, renvoyé de la frontière de Canaan, retourna vers le sud dans le désert puis contourna le pays d’Édom. La mer Rouge est ici le golfe d’Aqaba, car le Deutéronome ajoute qu’ils passèrent « d’Élath et d’Étsjon-Guéber », et la route est celle qui va de Qadesh et des hautes terres du Négev dans l’Araba et le long de cette longue vallée jusqu’au fond du golfe, la piste des caravanes de cuivre de Thimna et de Feinan de tout temps. C’est le nom biblique d’une route, non d’un lieu ; aucune source antique extérieure à la Bible ne la nomme, et le point de la carte sur le fond de l’Araba représente toute la route. « Le chemin du désert, vers la mer Rouge » par lequel Israël quitta l’Égypte passe d’ordinaire pour une autre route, vers le golfe de Suez, bien que l’itinéraire de l’Exode soit discuté."
    - "Après le rapport des espions et le refus du peuple, le Seigneur dit : « demain, tournez-vous, et partez pour le désert, dans la direction de la mer Rouge », et Moïse rappelle l’ordre, « tournez-vous, et partez pour le désert, dans la direction de la mer Rouge », et son exécution : « Nous nous tournâmes, et nous partîmes pour le désert, par le chemin de la mer Rouge, comme l’Éternel me l’avait ordonné ; nous suivîmes longtemps les contours de la montagne de Séir. »"
    - "Trente-huit ans plus tard, quand Édom refusa le passage, « ils partirent de la montagne de Hor par le chemin de la mer Rouge, pour contourner le pays d’Édom. Le peuple s’impatienta en route » ; sur cette route vinrent les serpents brûlants et le serpent d’airain. Du golfe, ils tournèrent au nord-est autour d’Édom vers le torrent de Zéred et les plaines de Moab. La route est aujourd’hui la route de l’Araba de chaque côté de la frontière, la route 90 d’Israël de la mer Morte à Eilat et la route jordanienne par le Wadi Araba jusqu’à Aqaba, devant les mines de cuivre de Thimna et les ruines nabatéennes et romaines de la vallée."
  pl:
    - "Droga nad Morzem Czerwonym to droga, którą Izrael, zawrócony z granicy Kanaanu, poszedł znów na południe w pustynię, a później dookoła ziemi Edomu. Morzem Czerwonym jest tu Zatoka Akaba, bo Księga Powtórzonego Prawa dodaje, że przeszli „od Elat, i od Asyjongaber”, a droga to ta, która biegnie z Kadesz i wyżyn Negewu w dół do Araby i wzdłuż tej długiej doliny do północnego krańca zatoki, szlak karawan miedzi z Timna i Fejnan we wszystkich wiekach. Jest to biblijna nazwa trasy, nie miejsca; żadne starożytne źródło poza Biblią jej nie wymienia, a punkt na mapie na dnie Araby oznacza całą drogę. Droga, którą Izrael wyszedł z Egiptu, gdy Bóg go obwodził „drogą pustyni nad morzem czerwonem”, to, jak się zwykle uważa, inna droga, ku Zatoce Sueskiej, choć trasa wyjścia z Egiptu jest sporna."
    - "Po doniesieniu szpiegów i odmowie ludu Pan rzekł: „przetoż jutro obróćcie się, a idźcie na puszczą, drogą ku morzu czerwonemu”, a Mojżesz przypomina rozkaz: „obróciwszy się, idźcie na puszczą, drogą ku morzu czerwonemu”, i jego wykonanie: „obróciwszy się, poszliśmy na puszczą, drogą ku morzu czerwonemu, jako mówił Pan do mnie, i krążyliśmy około około góry Seir przez wiele dni”."
    - "Trzydzieści osiem lat później, gdy Edom odmówił przejścia, „Potem ruszyli się od góry Hor drogą ku morzu czerwonemu, aby obeszli ziemię Edomską; i utrudził się lud bardzo w onej drodze”; na tej drodze przyszły węże ogniste i wąż miedziany. Znad zatoki skręcili na północny wschód wokół Edomu do potoku Zared i równin Moabu. Droga to dziś autostrada Araby po każdej stronie granicy, izraelska Droga nr 90 od Morza Martwego do Ejlatu i jordańska droga przez Wadi Araba do Akaby, obok kopalń miedzi w Timna oraz nabatejskich i rzymskich ruin doliny."
  it:
    - "La via del Mar Rosso è la strada per cui Israele, respinto dal confine di Canaan, tornò a sud nel deserto e poi girò attorno al paese di Edom. Il Mar Rosso qui è il golfo di Aqaba, perché il Deuteronomio aggiunge che passarono «Elath ed Etsion-Gheber», e la strada è quella che va da Kades e dagli altipiani del Negheb giù nell’Araba e lungo quella lunga valle fino al fondo del golfo, la pista delle carovane del rame di Timna e di Feinan in ogni epoca. È il nome biblico di un percorso, non di un luogo; nessuna fonte antica fuori della Bibbia lo nomina, e il punto della mappa sul fondo dell’Araba rappresenta l’intera strada. La «via del deserto, verso il mar Rosso» per cui Israele lasciò l’Egitto è di solito ritenuta una strada diversa, verso il golfo di Suez, benché il percorso dell’Esodo sia discusso."
    - "Dopo il rapporto degli esploratori e il rifiuto del popolo, il Signore disse: «domani tornate addietro, incamminatevi verso il deserto, in direzione del mar Rosso», e Mosè ricorda l’ordine, «tornate indietro e avviatevi verso il deserto, in direzione del mar Rosso», e il suo adempimento: «tornammo indietro e partimmo per il deserto in direzione del mar Rosso, come l’Eterno m’avea detto, e girammo attorno al monte Seir per lungo tempo»."
    - "Trentotto anni dopo, quando Edom rifiutò il passaggio, «gl’Israeliti si partirono dal monte Hor, movendo verso il mar Rosso per fare il giro del paese di Edom; e il popolo si fe’ impaziente nel viaggio»; su questa strada vennero i serpenti ardenti e il serpente di rame. Dal golfo svoltarono a nord-est attorno a Edom fino al torrente Zered e alle pianure di Moab. La strada è oggi la via dell’Araba su ciascun lato del confine, la Route 90 israeliana dal Mar Morto a Eilat e la strada giordana attraverso il Wadi Araba fino ad Aqaba, oltre le miniere di rame di Timna e le rovine nabatee e romane della valle."
  nl:
    - "De weg naar de Rode Zee is de weg waarlangs Israël, teruggewezen aan de grens van Kanaän, opnieuw naar het zuiden de woestijn introk en later om het land Edom heen trok. De Rode Zee is hier de Golf van Akaba, want Deuteronomium voegt toe dat zij langskwamen “van Elath, en van Ezeon-Geber”, en de weg is die van Kades en het hoogland van de Negev omlaag de Araba in en langs die lange vallei naar het noordelijke uiteinde van de golf, het pad van de kopercaravanen van Timna en Feinan in alle tijden. Het is de Bijbelse naam voor een route, niet voor een plaats; geen antieke bron buiten de Bijbel noemt hem, en het punt op de kaart op de bodem van de Araba staat voor de hele weg. De “weg van de woestijn der Schelfzee” waarlangs Israël Egypte verliet, geldt meestal als een andere weg, richting de Golf van Suez, al is de route van de uittocht omstreden."
    - "Na het verslag van de verspieders en de weigering van het volk zei de HEER: “wendt u morgen, en maakt uw reize naar de woestijn, op den weg naar de Schelfzee”, en Mozes herinnert aan het bevel, “Gij daarentegen, keert u, en reist naar de woestijn, den weg van de Schelfzee”, en de vervulling ervan: “Daarna keerden wij ons, en reisden naar de woestijn, den weg van de Schelfzee, gelijk de HEERE tot mij gesproken had, en wij togen om het gebergte Seir, vele dagen”."
    - "Achtendertig jaar later, toen Edom doortocht weigerde, “reisden zij van den berg Hor, op den weg der Schelfzee, dat zij om het land der Edomieten heentogen; doch de ziel des volks werd verdrietig op dezen weg”; op deze weg kwamen de vurige slangen en de koperen slang. Vanaf de golf trokken zij naar het noordoosten om Edom heen naar de beek Zered en de vlakten van Moab. De weg is tegenwoordig de Araba-snelweg aan beide zijden van de grens, Israëls Route 90 van de Dode Zee naar Eilat en Jordaniës weg door de Wadi Araba naar Akaba, langs de kopermijnen van Timna en de Nabateese en Romeinse ruïnes van de vallei."
  cs:
    - "Cesta k Rudému moři je cesta, kterou se Izrael, odvrácený od hranice Kanaánu, vydal znovu na jih do pouště a později kolem země Edómu. Rudé moře je zde Akabský záliv, neboť Deuteronomium dodává, že šli „od Elat a od Aziongaber“, a cesta je ta, která vede z Kádeše a negevské hornatiny dolů do Araby a podél onoho dlouhého údolí k nejzazšímu konci zálivu, stezka měděných karavan Timny a Fénánu ve všech dobách. Je to biblické jméno trasy, ne místa; žádný starověký pramen mimo Bibli ji nejmenuje a bod mapy na dně Araby zastupuje celou cestu. „Cesta přes poušť, kteráž jest při moři Rudém“, kterou Izrael opustil Egypt, je podle obvyklého výkladu jiná cesta, k Suezskému zálivu, ačkoli trasa exodu je sporná."
    - "Po zprávě zvědů a odmítnutí lidu řekl Hospodin: „obraťte se zase zítra, a beřte se na poušť cestou k moři Rudému“, a Mojžíš připomíná příkaz, „obrátíce se, jděte na poušť cestou k moři Rudému“, i jeho splnění: „obrátivše se, táhli jsme na tu poušť cestou k moři Rudému, jakož mluvil Hospodin ke mně, a obcházeli jsme horu Seir za dlouhý čas“."
    - "O třicet osm let později, když Edóm odepřel průchod, „hnuli se s hory Hor cestou k moři Rudému, aby obešli zemi Idumejskou; i ustával lid velice na cestě“; na této cestě přišli ohniví hadi a měděný had. Od zálivu se obrátili na severovýchod kolem Edómu k potoku Zered a k pláním Moábu. Cesta je dnes silnicí údolím Araba po obou stranách hranice, izraelskou silnicí č. 90 od Mrtvého moře do Ejlatu a jordánskou silnicí Wádí Araba do Akaby, kolem měděných dolů Timny a nabatejských a římských zřícenin údolí."
  sv:
    - "Vägen mot Sävhavet är vägen som Israel, avvisad vid Kanaans gräns, åter drog söderut in i öknen och senare runt Edoms land. Sävhavet är här Aqababukten, ty Femte Mosebok tillägger att de lämnade ”Elat och Esjon-Geber”, och vägen är den som löper från Kadesh och Negevhöglandet ner i Arava och längs den långa dalen till vikens inre del, spåret för kopparkaravanerna från Timna och Feinan i alla tider. Det är Bibelns namn på en väg, inte en plats; ingen forntida källa utanför Bibeln nämner den, och kartans punkt på Aravas botten står för hela vägen. ”En omväg genom öknen åt Röda havet till” som Israel lämnade Egypten på anses vanligen vara en annan väg, mot Suezbukten, fast uttågets väg är omstridd."
    - "Efter spejarnas rapport och folkets vägran sade Herren: ”vänden eder i morgon åt annat håll bryten upp och tagen vägen mot öknen, åt Röda havet till”, och Mose erinrar om befallningen, ”bryten nu upp och tagen vägen mot öknen, åt Röda havet till”, och dess fullbordan: ”vi bröto upp och togo vägen mot öknen, åt Röda havet till, såsom Herren hade tillsagt mig, och vi höllo en lång tid på med att tåga omkring Seirs bergsbygd”."
    - "Trettioåtta år senare, när Edom vägrade passage, ”Och de bröto upp från berget Hor och togo vägen åt Röda havet till, för att gå omkring Edoms land. Men under vägen blev folket otåligt”; på denna väg kom de brinnande ormarna och kopparormen. Från viken vände de nordost runt Edom till bäcken Sered och Moabs hedar. Vägen är i dag Aravamotorvägen på båda sidor om gränsen, Israels väg 90 från Döda havet till Eilat och Jordaniens väg genom Wadi Araba till Aqaba, förbi Timnas koppargruvor och dalens nabateiska och romerska ruiner."
  nb:
    - "Veien til Rødehavet er veien som Israel, vendt tilbake fra grensen til Kanaan, dro sørover igjen ut i ørkenen og senere rundt Edoms land. Rødehavet er her Aqababukta, for Femte Mosebok tilføyer at de passerte «fra Elat og Esjon-Geber», og veien er den som løper fra Kadesj og Negev-høylandet ned i Arava og langs den lange dalen til innerste del av bukten, sporet til kobberkaravanene fra Timna og Feinan i alle tider. Det er Bibelens navn på en rute, ikke et sted; ingen antikk kilde utenfor Bibelen nevner den, og kartets punkt på bunnen av Arava står for hele veien. «Omveien gjennem ørkenen mot det Røde Hav» som Israel forlot Egypt ved, regnes vanligvis for en annen vei, mot Suezbukta, selv om ruten for utgangen er omdiskutert."
    - "Etter speidernes rapport og folkets nektelse sa Herren: «vend derfor om imorgen og dra ut i ørkenen på veien til det Røde Hav!», og Moses minner om befalingen, «Men vend I om og ta ut i ørkenen, på veien til det Røde Hav!», og om oppfyllelsen: «Så vendte vi om og drog til ørkenen på veien til det Røde Hav, således som Herren hadde sagt til mig; og vi drog i lang tid omkring Se'ir-fjellene.»"
    - "Åtte og tretti år senere, da Edom nektet dem gjennomgang, «brøt de op fra fjellet Hor og tok veien til det Røde Hav for å dra omkring Edoms land; men på veien blev folket utålmodig»; på denne veien kom de brennende slangene og kobberslangen. Fra bukten svingte de nordøstover rundt Edom til Sered-bekken og Moabs sletter. Veien er i dag Arava-veien på hver side av grensen, Israels vei 90 fra Dødehavet til Eilat og Jordans vei gjennom Wadi Araba til Aqaba, forbi kobbergruvene ved Timna og de nabateiske og romerske ruinene i dalen."
  tl:
    - "Ang daan ng Dagat na Pula ay ang daang tinahak ng Israel, na pinabalik mula sa hangganan ng Canaan, pabalik sa timog sa disyerto at kalaunan paikot sa Edom. Ang Dagat na Pula rito ay ang Golpo ng Aqaba, sapagkat idinadagdag ng Deuteronomio na dumaan sila “mula sa Elath at mula sa Esion-geber”, at ang daan ay yaong mula sa Cades at sa matataas na lupain ng Negeb pababa sa Araba at sa mahabang libis na iyon hanggang sa dulo ng golpo, ang landas ng mga caravan ng tanso ng Timna at Feinan sa lahat ng panahon. Pangalan ito ng Biblia para sa ruta, hindi lugar; walang sinaunang batis sa labas ng Biblia ang nagpapangalan dito, at ang tuldok ng mapa sa sahig ng Araba ay para sa buong daan. Ang “daang patungo sa ilang sa tabi ng Dagat na Mapula” ng paglabas ng Israel sa Egipto ay karaniwang itinuturing na ibang daan, patungo sa Golpo ng Suez, bagaman pinagtatalunan ang ruta ng Exodo."
    - "Pagkatapos ng ulat ng mga tiktik at pagtanggi ng bayan, sinabi ng Panginoon: “bukas ay magbalik kayo at kayo'y pasa ilang sa daang patungo sa Dagat na Mapula”, at inaalala ni Moises ang utos, “bumalik kayo, at maglakbay kayo sa ilang sa daang patungo sa Dagat na Mapula”, at ang pagganap nito: “pumihit tayo, at lumakad tayo sa ilang na daang patungo sa Dagat na Mapula, gaya ng sinalita sa akin ng Panginoon; at tayo'y malaong lumigid sa bundok ng Seir”."
    - "Tatlumpu't walong taon pagkaraan, nang tumanggi ang Edom ng daanan, “naglakbay mula sa bundok ng Hor na napasa daang patungo sa Dagat na Mapula upang lumiko sa lupain ng Edom; at ang damdamin ng bayan ay nainip dahil sa daan”; sa daang ito dumating ang mga ahas na maapoy at ang ahas na tanso. Mula sa golpo, lumiko sila pahilagang-silangan sa palibot ng Edom patungo sa batis ng Zered at mga kapatagan ng Moab. Ang daan ngayon ay ang highway ng Araba sa magkabilang panig ng hangganan, ang Ruta 90 ng Israel mula sa Dagat na Patay hanggang Eilat at ang daan ng Jordan sa Wadi Araba hanggang Aqaba, sa tabi ng mga minahan ng tanso ng Timna at mga guho ng Nabateo at Romano sa libis."
