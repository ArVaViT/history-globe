body:
  en:
    - "Kedesh in Galilee was a Canaanite royal city in the hills of Upper Galilee, west of the Hula valley, at Tel Kedesh, a large double mound near today's border with Lebanon. Its name means “holy place”. Joshua counts “The king of Kedesh” among the kings he beat; the town fell to Naphtali, was made the northernmost of the cities of refuge, “Kedesh in Galilee in mount Naphtali”, and was given to the Levites of Gershon. Barak son of Abinoam, whom Deborah summoned “out of Kedesh-naphtali” to gather Zebulun and Naphtali, is usually taken to be from this Kedesh, though some place his muster at a Kedesh above the Sea of Galilee, nearer Mount Tabor."
    - "In the days of Pekah “came Tiglath-pileser king of Assyria, and took Ijon, and Abel-beth-maachah, and Janoah, and Kedesh, and Hazor, and Gilead, and Galilee, all the land of Naphtali, and carried them captive to Assyria”, in 733–732 BC. The town then passed to the Phoenicians: in 144/143 BC Jonathan Maccabeus beat the generals of Demetrius II on the plain of Hazor and pursued them to Kedesh, and Josephus knew Cydasa as a strong village of the Tyrians, always at odds with the Galileans, where Titus camped in AD 67 before taking Gischala."
    - "Excavations have shown the town of those later centuries. Sharon Herbert and Andrea Berlin, digging for the universities of Michigan and Minnesota in 1997–2012, uncovered on the lower mound a great administrative building of the Persian and Hellenistic periods, with an archive of more than two thousand clay sealings abandoned about 144 BC, around the time of Jonathan's campaign. On a low hill east of the mound a Roman temple of the second and third centuries AD, whose dedication of AD 117/118 names the “holy god of the sky”, probably Baal-shamin, was studied by Tel Aviv University; its walls still stand several metres high. The site is today in Israel's Upper Galilee near Kibbutz Malkia, with the temple and tombs open to visitors."
  ru:
    - "Кедес в Галилее — ханаанский царский город в горах Верхней Галилеи, к западу от долины Хула, на Тель-Кедеше, большом двойном холме близ нынешней границы с Ливаном. Имя значит «святое место». Иисус Навин считает царя Кедеса среди разбитых им царей; город достался Неффалиму, был сделан самым северным из городов убежища — «Кедес в Галилее на горе Неффалимовой» — и отдан левитам из рода Гирсона. Варака, сына Авиноамова, которого Девора призвала «из Кедеса Неффалимова» собрать Завулона и Неффалима, обычно считают уроженцем этого Кедеса, хотя некоторые помещают его сбор в Кедес над Галилейским морем, ближе к Фавору."
    - "Во дни Факея «пришел Феглаффелласар, царь Ассирийский, и взял Ион, Авел-Беф-Мааху, и Ианох, и Кедес, и Асор, и Галаад, и Галилею, всю землю Неффалимову, и переселил их в Ассирию» — в 733–732 годах до н. э. Затем город перешёл к финикиянам: в 144/143 году до н. э. Ионафан Маккавей разбил полководцев Деметрия II на равнине Асора и преследовал их до Кедеса, а Иосиф Флавий знал Кидасу как сильное селение Тирян, всегда враждовавшее с галилеянами, где Тит в 67 году н. э. стоял станом перед взятием Гисхалы."
    - "Раскопки показали город этих поздних веков. Шарон Герберт и Андреа Берлин, копавшие для университетов Мичигана и Миннесоты в 1997–2012 годах, открыли на нижнем холме большое административное здание персидского и эллинистического времени с архивом более чем из двух тысяч глиняных оттисков печатей, брошенным около 144 года до н. э., примерно во время похода Ионафана. На невысоком холме к востоку от городища римский храм II–III веков н. э., надпись которого 117/118 года называет «святого бога неба», вероятно Баал-Шамина, изучал Тель-Авивский университет; его стены до сих пор стоят на несколько метров в высоту. Сегодня это Верхняя Галилея в Израиле близ киббуца Малкия, и храм с гробницами открыты для посетителей."
  uk:
    - "Кедес у Галілеї був ханаанським царським містом у горах Верхньої Галілеї, на захід від долини Хула, у Тель-Кедесі — великому подвійному пагорбі поблизу сучасного кордону з Ліваном. Його назва означає «святе місце». Ісус Навин зараховує «Царь Кедеський» до царів, яких він переміг; місто дісталося Нефталиму, стало найпівнічнішим із міст-сховищ — «Кедес в Галилеї на Нафталїєвій горі» — і було віддане левітам з роду Гершома. Варака, сина Авіноама, якого Дебора покликала «з Кадеса Нефталимового», щоб зібрати Завулона й Нефталима, зазвичай уважають вихідцем із цього Кедеса, хоча дехто розміщує його збір у Кедесі над Галілейським морем, ближче до гори Фавор."
    - "За днів Факея «прийшов Теглатфелласар, царь Ассирийський, і звоював Йон, Абел-бет-Мааху, Янох, Кедес і Асор, Галаад і Галилею, усю землю Нефталїєву, та й одвів їх в Ассирию», — у 733–732 рр. до н. е. Згодом місто перейшло до фінікійців: у 144/143 р. до н. е. Йонатан Макавей розбив воєвод Димитрія II на рівнині Гацору й переслідував їх аж до Кедеса, а Йосиф Флавій знав Кідасу як сильне село тирян, що завжди ворогувало з галилеянами, де Тит розташувався табором у 67 р. н. е. перед здобуттям Гішали."
    - "Розкопки показали, яким було місто тих пізніших століть. Шерон Герберт і Андреа Берлін, що копали від імені університетів Мічигану й Міннесоти в 1997–2012 рр., відкрили на нижньому пагорбі велику адміністративну будівлю часів Персії та еллінізму з архівом із понад двох тисяч глиняних печаток, полишеним близько 144 р. до н. е., приблизно під час походу Йонатана. На низькому пагорбі на схід від городища римський храм II–III ст. н. е., чий напис-посвята 117/118 р. н. е. називає «святого бога неба», імовірно Баал-Шаміна, досліджував Тель-Авівський університет; його стіни й досі стоять на висоту кількох метрів. Сьогодні це місце лежить у ізраїльській Верхній Галілеї поблизу кібуцу Малкія, а храм і гробниці відкриті для відвідувачів."
  es:
    - "Cedes de Galilea fue una ciudad real cananea en las colinas de la Alta Galilea, al oeste del valle del Hula, en Tel Cedes, un gran montículo doble cerca de la actual frontera con el Líbano. Su nombre significa «lugar santo». Josué cuenta entre los reyes que derrotó a «el rey de Chêdes»; la ciudad correspondió a Neftalí, fue convertida en la más septentrional de las ciudades de refugio, «Cedes en Galilea, en el monte de Nephtalí», y se dio a los levitas de Gersón. Se suele suponer que Barac, hijo de Abinoam, a quien Débora llamó «de Cedes de Nephtalí» para reunir a Zabulón y a Neftalí, era de esta Cedes, aunque algunos sitúan su convocatoria en una Cedes sobre el Mar de Galilea, más cerca del monte Tabor."
    - "En tiempos de Peka «vino Tiglath-pileser rey de los Asirios, y tomó á Ahión, Abel-beth-maachâ, y Janoa, y Cedes, y Asor, y Galaad, y Galilea, y toda la tierra de Nephtalí; y trasportólos á Asiria», en 733–732 a. C. Después la ciudad pasó a los fenicios: en 144/143 a. C. Jonatán Macabeo derrotó a los generales de Demetrio II en la llanura de Hazor y los persiguió hasta Cedes, y Josefo conoció Cidasa como una fuerte aldea de los tirios, siempre enemistada con los galileos, donde Tito acampó en 67 d. C. antes de tomar Giscala."
    - "Las excavaciones han mostrado la ciudad de esos siglos posteriores. Sharon Herbert y Andrea Berlin, que excavaron para las universidades de Míchigan y Minnesota en 1997–2012, sacaron a la luz en el montículo bajo un gran edificio administrativo de los períodos persa y helenístico, con un archivo de más de dos mil sellos de arcilla abandonado hacia 144 a. C., en torno a la época de la campaña de Jonatán. En una colina baja al este del montículo, un templo romano de los siglos II y III d. C., cuya dedicatoria de 117/118 d. C. nombra al «dios santo del cielo», probablemente Baal-Shamin, fue estudiado por la Universidad de Tel Aviv; sus muros aún se alzan varios metros. Hoy el sitio se encuentra en la Alta Galilea israelí, cerca del kibutz Malkia, y el templo y las tumbas están abiertos a los visitantes."
  pt:
    - "Quedes, na Galileia, era uma cidade real cananeia nas colinas da Alta Galileia, a oeste do vale de Hula, em Tel Quedes, um grande montículo duplo perto da atual fronteira com o Líbano. Seu nome significa “lugar santo”. Josué conta “o rei de Quedes” entre os reis que derrotou; a cidade coube a Naftali, tornou-se a mais setentrional das cidades de refúgio, “Quedes, na Galileia, na região montanhosa de Naftali”, e foi dada aos levitas de Gérson. Baraque, filho de Abinoão, a quem Débora mandou chamar “de Quedes-Naftali” para reunir Zebulom e Naftali, costuma ser tido como natural desta Quedes, embora alguns situem a sua convocação numa Quedes acima do Mar da Galileia, mais perto do monte Tabor."
    - "Nos dias de Peca, “Tiglate-Pileser, rei da Assíria, veio e tomou Ijom, Abel-Bete-Maaca, Janoa, Quedes, Hazor, Gileade e a Galileia, toda a terra de Naftali; e os levou cativos para a Assíria”, em 733–732 a.C. A cidade passou então aos fenícios: em 144/143 a.C. Jônatas Macabeu derrotou os generais de Demétrio II na planície de Hazor e os perseguiu até Quedes, e Josefo conheceu Cidasa como uma forte aldeia dos tírios, sempre em desavença com os galileus, onde Tito acampou em 67 d.C. antes de tomar Giscala."
    - "As escavações mostraram a cidade desses séculos posteriores. Sharon Herbert e Andrea Berlin, escavando em nome das universidades de Michigan e Minnesota em 1997–2012, descobriram no montículo inferior um grande edifício administrativo dos períodos persa e helenístico, com um arquivo de mais de duas mil selagens de argila abandonado por volta de 144 a.C., mais ou menos na época da campanha de Jônatas. Numa colina baixa a leste do montículo, um templo romano dos séculos II e III d.C., cuja dedicatória de 117/118 d.C. nomeia o “deus santo do céu”, provavelmente Baal-Shamin, foi estudado pela Universidade de Tel Aviv; suas paredes ainda se erguem a vários metros de altura. O sítio fica hoje na Alta Galileia, em Israel, perto do kibutz Malkia, com o templo e os túmulos abertos à visitação."
  de:
    - "Kedesch in Galiläa war eine kanaanäische Königsstadt in den Bergen Obergaliläas westlich der Hulaebene, bei Tel Kedesch, einem großen Doppelhügel nahe der heutigen Grenze zum Libanon. Sein Name bedeutet „heiliger Ort“. Unter den Königen, die Josua schlug, steht „der König zu Kedes“; die Stadt fiel an Naftali, wurde als nördlichste der Freistädte bestimmt, „Kedes in Galiläa, auf dem Gebirge Naphthali“, und den Leviten von Gerschon gegeben. Barak, der Sohn Abinoams, den Debora „von Kedes-Naphthali“ rief, um Sebulon und Naftali zu versammeln, stammt gewöhnlich aus diesem Kedesch, obwohl manche seine Sammlung an ein Kedesch oberhalb des Sees Genezareth näher am Tabor verlegen."
    - "In den Tagen Pekachs „kam Thiglath-Pileser, der König von Assyrien, und nahm Ijon, Abel-Beth-Maacha, Janoah, Kedes, Hazor, Gilead und Galiläa, das ganze Land Naphthali, und führte sie weg nach Assyrien“, 733–732 v. Chr. Die Stadt fiel dann an die Phönizier: 144/143 v. Chr. schlug Jonatan Makkabäus die Feldherren Demetrius' II. in der Ebene von Hazor und verfolgte sie bis Kedesch, und Josephus kannte Kydasa als befestigtes Dorf der Tyrer, stets im Streit mit den Galiläern, wo Titus im Jahr 67 n. Chr. lagerte, ehe er Gischala einnahm."
    - "Ausgrabungen haben die Stadt jener späteren Jahrhunderte gezeigt. Sharon Herbert und Andrea Berlin legten bei Grabungen für die Universitäten Michigan und Minnesota 1997–2012 auf dem Unterhügel ein großes Verwaltungsgebäude der persischen und hellenistischen Zeit frei, mit einem Archiv von mehr als zweitausend Tonsiegeln, das um 144 v. Chr. aufgegeben wurde, etwa zur Zeit von Jonatans Feldzug. Auf einem niedrigen Hügel östlich des Siedlungshügels wurde ein römischer Tempel des 2. und 3. Jahrhunderts n. Chr., dessen Weihung von 117/118 n. Chr. den „heiligen Gott des Himmels“ nennt, wahrscheinlich Baal-Schamin, von der Universität Tel Aviv untersucht; seine Mauern stehen noch mehrere Meter hoch. Der Ort liegt heute in Israels Obergaliläa nahe dem Kibbuz Malkia, Tempel und Gräber sind für Besucher zugänglich."
  fr:
    - "Kédesch en Galilée était une ville royale cananéenne des collines de Haute Galilée, à l’ouest de la vallée de la Houla, à Tel Kedesh, grand tertre double près de l’actuelle frontière avec le Liban. Son nom signifie « lieu saint ». Josué compte « le roi de Kédesch » parmi les rois qu’il battit ; la ville échut à Nephthali, devint la plus septentrionale des villes de refuge, « Kédesch, en Galilée, dans la montagne de Nephthali », et fut donnée aux lévites de Guerschon. Barak, fils d’Abinoam, que Débora fit venir « de Kédesch-Nephthali » pour rassembler Zabulon et Nephthali, est généralement tenu pour originaire de ce Kédesch, bien que certains situent son rassemblement à un Kédesch au-dessus de la mer de Galilée, plus près du mont Thabor."
    - "Du temps de Péka, « Tiglath-Piléser, roi d’Assyrie, vint et prit Ijjon, Abel-Beth-Maaca, Janoach, Kédesch, Hatsor, Galaad et la Galilée, tout le pays de Nephthali, et il emmena captifs les habitants en Assyrie », en 733–732 av. J.-C. La ville passa ensuite aux Phéniciens : en 144/143 av. J.-C., Jonathan Maccabée battit les généraux de Démétrius II dans la plaine de Hatsor et les poursuivit jusqu’à Kédesch, et Flavius Josèphe connaissait Cydasa comme un solide village des Tyriens, toujours en conflit avec les Galiléens, où Titus campa en 67 apr. J.-C. avant de prendre Gischala."
    - "Les fouilles ont montré la ville de ces siècles tardifs. Sharon Herbert et Andrea Berlin, qui ont fouillé pour les universités du Michigan et du Minnesota en 1997–2012, ont mis au jour sur le tertre inférieur un grand bâtiment administratif des périodes perse et hellénistique, avec des archives de plus de deux mille bulles d’argile abandonnées vers 144 av. J.-C., à peu près au moment de la campagne de Jonathan. Sur une petite colline à l’est du tertre, un temple romain des IIe et IIIe siècles apr. J.-C., dont la dédicace de 117/118 apr. J.-C. nomme le « dieu saint du ciel », probablement Baal-Shamin, a été étudié par l’Université de Tel-Aviv ; ses murs se dressent encore sur plusieurs mètres de haut. Le site se trouve aujourd’hui en Haute Galilée israélienne, près du kibboutz Malkia, le temple et les tombes étant ouverts aux visiteurs."
  it:
    - "Kedes in Galilea era una città reale cananea sulle colline dell’Alta Galilea, a ovest della valle di Hula, a Tel Kedesh, un grande tell doppio presso l’odierno confine con il Libano. Il suo nome significa «luogo santo». Giosuè conta «il re di Kedes» tra i re che sconfisse; la città toccò a Neftali, fu fatta la più settentrionale delle città di rifugio, «Kedes in Galilea nella contrada montuosa di Neftali», e fu data ai leviti di Gherson. Barak figlio di Abinoam, che Debora fece chiamare «da Kades di Neftali» per radunare Zabulon e Neftali, è di solito ritenuto originario di questa Kedes, benché alcuni collochino la sua adunata in una Kedes sopra il Lago di Tiberiade, più vicina al monte Tabor."
    - "Al tempo di Pekach «venne Tiglath-Pileser, re di Assiria, e prese Ijon, Abel-Beth-Maaca, Janoah, Kedesh, Hatsor, Galaad, la Galilea, tutto il paese di Neftali, e ne menò gli abitanti in cattività in Assiria», nel 733–732 a.C. La città passò poi ai Fenici: nel 144/143 a.C. Gionata Maccabeo sconfisse i generali di Demetrio II nella pianura di Asor e li inseguì fino a Kedes, e Giuseppe Flavio conobbe Cidasa come un forte villaggio dei Tirii, sempre in contrasto con i Galilei, dove Tito pose il campo nel 67 d.C. prima di prendere Giscala."
    - "Gli scavi hanno mostrato la città di quei secoli più tardi. Sharon Herbert e Andrea Berlin, scavando per le università del Michigan e del Minnesota nel 1997–2012, hanno portato alla luce sul tell inferiore un grande edificio amministrativo dei periodi persiano ed ellenistico, con un archivio di più di duemila sigilli d’argilla abbandonato verso il 144 a.C., all’incirca al tempo della campagna di Gionata. Su una bassa collina a est del tell un tempio romano del II e III secolo d.C., la cui dedica del 117/118 d.C. nomina il «dio santo del cielo», probabilmente Baal-shamin, è stato studiato dall’Università di Tel Aviv; le sue mura si ergono ancora per vari metri. Il sito si trova oggi nell’Alta Galilea israeliana presso il kibbutz Malkia, con il tempio e le tombe aperti ai visitatori."
  pl:
    - "Kedesz w Galilei było kananejskim miastem królewskim na wzgórzach Górnej Galilei, na zachód od doliny Chula, w Tel Kedesz, wielkim podwójnym kopcu w pobliżu dzisiejszej granicy z Libanem. Jego nazwa znaczy „święte miejsce”. Jozue wymienia wśród pobitych królów: „Król Kades jeden”; miasto przypadło plemieniu Neftalego, zostało ustanowione najdalej wysuniętym na północ miastem schronienia, „Kades w Galilei na górze Neftali”, i zostało oddane Lewitom z rodu Gerszona. Barak, syn Abinoama, którego Debora wezwała „z Kades Neftalim”, by zebrał Zabulona i Neftalego, zwykle uchodzi za pochodzącego z tego Kedesz, choć niektórzy umieszczają jego zgromadzenie w Kedesz nad Jeziorem Galilejskim, bliżej góry Tabor."
    - "W czasach Pekacha „przyciągnął Teglet Falaser, król Assyryjski, i wziął Ajon i Abelbetmaacha, i Jonoe, i Kiedes, i Azor, i Galaad, i Galileę, wszystkę ziemię Neftali, a przeniósł obywatele jej do Assyryi” – w latach 733–732 p.n.e. Miasto przeszło następnie w ręce Fenicjan: w 144/143 r. p.n.e. Jonatan Machabeusz pobił wodzów Demetriusza II na równinie Chasoru i ścigał ich aż do Kedesz, a Józef Flawiusz znał Kidasę (Cydasa) jako mocną wieś Tyryjczyków, zawsze skłóconą z Galilejczykami, gdzie Tytus obozował w 67 r. n.e., zanim zdobył Gischalę."
    - "Wykopaliska ukazały miasto z tych późniejszych wieków. Sharon Herbert i Andrea Berlin, prowadząc prace dla uniwersytetów Michigan i Minnesoty w latach 1997–2012, odsłoniły na dolnym wzgórzu wielki budynek administracyjny z okresu perskiego i hellenistycznego, z archiwum ponad dwóch tysięcy glinianych pieczęci porzuconych około 144 r. p.n.e., mniej więcej w czasie wyprawy Jonatana. Na niskim pagórku na wschód od tellu rzymską świątynię z II i III w. n.e., której dedykacja z lat 117/118 n.e. wymienia „świętego boga nieba”, prawdopodobnie Baal-Szamina, badał Uniwersytet w Tel Awiwie; jej mury wciąż stoją na wysokość kilku metrów. Stanowisko leży dziś w izraelskiej Górnej Galilei, w pobliżu kibucu Malkija, a świątynia i grobowce są otwarte dla zwiedzających."
  nl:
    - "Kedes in Galilea was een Kanaänitische koningsstad in het heuvelland van Boven-Galilea, ten westen van de Hulavallei, bij Tel Kedesh, een grote dubbele heuvel nabij de huidige grens met Libanon. De naam betekent “heilige plaats”. Jozua telt “De koning van Kedes” onder de koningen die hij versloeg; de stad viel toe aan Naftali, werd als noordelijkste van de vrijsteden aangewezen, “Kedes in Galilea, op het gebergte van Nafthali”, en werd aan de Levieten van Gerson gegeven. Barak, zoon van Abinoam, die Debora “van Kedes-Nafthali” ontbood om Zebulon en Naftali bijeen te roepen, wordt gewoonlijk als afkomstig uit dit Kedes beschouwd, al plaatsen sommigen zijn oproep in een Kedes boven het Meer van Galilea, dichter bij de berg Tabor."
    - "In de dagen van Pekach “kwam Tiglath-Pilezer, de koning van Assyrië, en nam Ijon in, en Abel-Beth-maacha, en Janoah, en Kedes, en Hazor, en Gilead, en Galilea, het ganse land van Nafthali; en hij voerde hen weg naar Assyrië”, in 733–732 v.Chr. De stad kwam daarna aan de Feniciërs: in 144/143 v.Chr. versloeg Jonatan de Makkabeeër de bevelhebbers van Demetrius II op de vlakte van Hazor en achtervolgde hen tot Kedes, en Josephus kende Kydasa als een sterk dorp van de Tyriërs, altijd in strijd met de Galileeërs, waar Titus in 67 n.Chr. zijn kamp opsloeg voordat hij Gischala innam."
    - "Opgravingen hebben de stad van die latere eeuwen zichtbaar gemaakt. Sharon Herbert en Andrea Berlin, die in 1997–2012 groeven voor de universiteiten van Michigan en Minnesota, legden op de benedenheuvel een groot administratief gebouw uit de Perzische en hellenistische tijd bloot, met een archief van meer dan tweeduizend kleizegels, rond 144 v.Chr. verlaten, omstreeks de tijd van Jonatans veldtocht. Op een lage heuvel ten oosten van de tell werd een Romeinse tempel uit de tweede en derde eeuw n.Chr., waarvan de opdracht uit 117/118 n.Chr. de “heilige god van de hemel” noemt, waarschijnlijk Baäl-Samin, door de Universiteit van Tel Aviv onderzocht; de muren staan nog enkele meters hoog. De plaats ligt tegenwoordig in het Israëlische Boven-Galilea bij kibboets Malkia, met tempel en graven open voor bezoekers."
  cs:
    - "Kedeš v Galileji byl kanaánské královské město v pahorcích Horní Galileje, západně od údolí Chuly, u Tel Kedeše, velkého dvojitého pahorku poblíž dnešní hranice s Libanonem. Jeho jméno znamená „svaté místo“. Jozue počítá „Král Kedes jeden“ mezi krále, které porazil; město připadlo Neftalímu, stalo se nejsevernějším z útočištných měst, „Kádes v Galilei na hoře Neftalím“, a bylo dáno levitům z Geršona. Bárak, syn Abinoamův, kterého Debora povolala „z Kádes Neftalímova“, aby shromáždil Zebuluna a Neftalího, bývá pokládán za rodáka z tohoto Kedeše, i když někteří kladou jeho shromáždění do Kedeše nad Galilejským jezerem, blíže hoře Tábor."
    - "Za dnů Pekacha „přitáhl Tiglatfalazar král Assyrský, a vzal Jon a Abel, dům Maacha a Janoe, Kedes a Azor, i Galád a Galilei, i všecku zemi Neftalím, a přenesl obyvatele jejich do Assyrie“, v letech 733–732 př. n. l. Město pak připadlo Féničanům: roku 144/143 př. n. l. porazil Jonatan Makabejský na pláni u Chacoru vojevůdce Démétria II. a pronásledoval je až ke Kedeši a Josephus znal Kydasu jako silnou vesnici Tyrských, stále ve sporu s Galilejci, kde se roku 67 n. l. utábořil Titus před dobytím Gischaly."
    - "Vykopávky ukázaly město oněch pozdějších staletí. Sharon Herbertová a Andrea Berlinová, které kopaly za univerzity v Michiganu a Minnesotě v letech 1997–2012, odkryly na dolním pahorku velkou správní budovu z doby perské a helénistické s archivem více než dvou tisíc hliněných pečetí, opuštěným kolem roku 144 př. n. l., zhruba v době Jonatanova tažení. Na nízkém pahorku východně od tellu zkoumala Telavivská univerzita římský chrám z 2. a 3. století n. l., jehož zasvěcení z roku 117/118 n. l. jmenuje „svatého boha nebes“, nejspíše Baal-šamina; jeho zdi stojí dosud několik metrů vysoko. Místo leží dnes v izraelské Horní Galileji u kibucu Malkija, chrám a hrobky jsou přístupné návštěvníkům."
  sv:
    - "Kedesh i Galileen var en kanaaneisk kungastad i Övre Galileens berg, väster om Hulaslätten, vid Tel Kedesh, en stor dubbelkulle nära dagens gräns mot Libanon. Namnet betyder ”helig plats”. Josua räknar ”konungen i Kedes” bland de konungar han besegrade; staden föll till Naftali, gjordes till den nordligaste av tillflyktsstäderna, ”Kedes i Galileen, i Naftali bergsbygd”, och gavs åt Gershons leviter. Barak, Avinoams son, som Debora lät kalla ”från Kedes i Naftali” för att samla Sebulon och Naftali, anses vanligen vara från detta Kedesh, fastän vissa förlägger hans samling till ett Kedesh ovanför Galileiska sjön, närmare berget Tabor."
    - "I Pekachs dagar ”kom Tiglat-Pileser, konungen i Assyrien, och intog Ijon, Abel-Bet-Maaka, Janoa, Kedes, Hasor, Gilead och Galileen, hela Naftali land, och förde folket bort till Assyrien”, 733–732 f.Kr. Staden övergick sedan till fenicierna: 144/143 f.Kr. besegrade Jonatan Mackabeus Demetrios II:s fältherrar på Hasors slätt och förföljde dem till Kedesh, och Josefus kände Kydasa som en stark by tillhörande tyrierna, alltid i tvist med galileerna, där Titus slog läger år 67 e.Kr. innan han intog Gischala."
    - "Utgrävningar har visat staden under dessa senare århundraden. Sharon Herbert och Andrea Berlin, som grävde för universiteten i Michigan och Minnesota 1997–2012, fann på den nedre kullen en stor administrativ byggnad från persisk och hellenistisk tid, med ett arkiv av mer än två tusen lerförseglingar som övergavs omkring 144 f.Kr., ungefär vid tiden för Jonatans fälttåg. På en låg kulle öster om tellen har ett romerskt tempel från 100- och 200-talen e.Kr., vars invigning år 117/118 e.Kr. nämner ”himlens helige gud”, sannolikt Baal-Shamin, studerats av Tel Avivs universitet; dess murar står ännu flera meter höga. Platsen ligger i dag i Israels Övre Galileen nära kibbutzen Malkia, med templet och gravarna öppna för besökare."
  nb:
    - "Kedesj i Galilea var en kanaanittisk kongeby i åsene i Øvre Galilea, vest for Hula-dalen, ved Tel Kedesh, en stor dobbelthaug nær dagens grense til Libanon. Navnet betyr «hellig sted». Josva regner «kongen i Kedes» blant kongene han slo; byen tilfalt Naftali, ble gjort til den nordligste av tilfluktsbyene, «Kedes i Galilea i Naftali-fjellene», og ble gitt til Gersjons levitter. Barak, Abinoams sønn, som Debora kalte «fra Kedes i Naftali» for å samle Sebulon og Naftali, regnes vanligvis for å være fra denne Kedesj, selv om noen legger hans oppbud til en Kedesj over Galileasjøen, nærmere Tabor."
    - "I Pekahs dager «kom kongen i Assyria Tiglat-Pileser og tok Ijon og Abel-Bet-Ma'aka og Janoah og Kedes og Hasor og Gilead og Galilea, hele Naftalis land; og han bortførte innbyggerne til Assyria», i 733–732 f.Kr. Byen gikk så over til fønikerne: i 144/143 f.Kr. slo Jonatan Makkabeus generalene til Demetrios II på Hasor-sletten og forfulgte dem til Kedesj, og Josefus kjente Cydasa som en sterk landsby tilhørende tyrerne, alltid på kant med galileerne, der Titus slo leir i 67 e.Kr. før han inntok Gischala."
    - "Utgravninger har vist byen fra disse senere århundrene. Sharon Herbert og Andrea Berlin, som gravde for universitetene i Michigan og Minnesota i 1997–2012, avdekket på den nedre haugen en stor administrasjonsbygning fra persertiden og den hellenistiske tiden, med et arkiv på mer enn to tusen leirsegl forlatt omkring 144 f.Kr., omtrent på den tiden da Jonatans felttog fant sted. På en lav høyde øst for haugen ble et romersk tempel fra 100- og 200-tallet e.Kr., hvis innvielse fra 117/118 e.Kr. nevner «himmelens hellige gud», trolig Baalsjamin, undersøkt av Tel Aviv-universitetet; murene står fortsatt flere meter høye. Stedet ligger i dag i Israels Øvre Galilea nær kibbutzen Malkia, med tempelet og gravene åpne for besøkende."
  tl:
    - "Ang Cedes sa Galilea ay isang maharlikang lungsod ng mga Cananeo sa mga burol ng Mataas na Galilea, sa kanluran ng libis ng Hula, sa Tel Kedesh, isang malaking dobleng burol malapit sa kasalukuyang hangganan sa Libano. Ang pangalan nito ay nangangahulugang “banal na dako”. Itinatala ni Josue sa mga haring kaniyang tinalo ang “hari sa Chedes”; napunta ang bayan sa Nephtali, ginawang pinakahilagang lungsod ng kanlungan, “Cedes sa Galilea sa lupaing maburol ng Nepthali”, at ibinigay sa mga Levita ni Gerson. Si Barac na anak ni Abinoam, na ipinatawag ni Debora “mula sa Cedes-nephtali” upang tipunin ang Zabulon at Nephtali, ay karaniwang itinuturing na taga-Cedes na ito, bagaman inilalagay ng ilan ang kaniyang pagtitipon sa isang Cedes sa itaas ng Dagat ng Galilea, mas malapit sa Bundok Tabor."
    - "Sa mga araw ni Peka ay “naparoon si Tiglathpileser na hari sa Asiria, at sinakop ang Ihion, at ang Abel-bethmaacha, at ang Janoa, at ang Cedes, at ang Asor, at ang Galaad, at ang Galilea, ang buong lupain ng Nephtali; at kaniyang dinalang bihag sila sa Asiria”, noong 733–732 BK. Pagkatapos ay napunta ang bayan sa mga Fenicio: noong 144/143 BK, tinalo ni Jonathan Macabeo ang mga heneral ni Demetrio II sa kapatagan ng Hasor at hinabol sila hanggang sa Cedes, at kilala ni Josefo ang Cydasa bilang matibay na nayon ng mga taga-Tiro, laging may alitan sa mga Galileo, kung saan nagkampo si Tito noong 67 AD bago sakupin ang Gischala."
    - "Ipinakita ng mga paghuhukay ang bayan ng mga huling siglong iyon. Sina Sharon Herbert at Andrea Berlin, na naghukay para sa mga unibersidad ng Michigan at Minnesota noong 1997–2012, ay nakatuklas sa ibabang burol ng isang malaking gusaling pampangasiwaan ng panahong Persiano at Helenistiko, na may arkibo ng mahigit dalawang libong tatak na luwad na iniwan noong mga 144 BK, sa panahon ng kampanya ni Jonathan. Sa mababang burol sa silangan ng tel ay isang templong Romano noong ika-2 at ika-3 siglo AD, na ang alay noong 117/118 AD ay pinangangalanan ang “banal na diyos ng langit”, marahil si Baal-shamin, na pinag-aralan ng Tel Aviv University; nakatayo pa ang mga pader nito nang ilang metro ang taas. Ang pook ay nasa Mataas na Galilea ng Israel ngayon malapit sa Kibbutz Malkia, at bukas sa mga bisita ang templo at mga libingan."
  da:
    - "Kedesj i Galilæa var en kana'anæisk kongeby i højlandet i Øvre Galilæa, vest for Hula-dalen, ved Tel Kedesh, en stor dobbelthøj nær den nuværende grænse til Libanon. Navnet betyder »helligt sted«. Josva regner »Kongen af Kedes« blandt de konger, han slog; byen faldt til Naftali, blev gjort til den nordligste af tilflugtsbyerne, »Kedes i Galilæa paa Nafthali Bjerg«, og blev givet til leviterne af Gersjon. Barak, Abinoams søn, som Debora tilkaldte »af Kedes i Nafthali« for at samle Zebulon og Naftali, regnes sædvanligvis for at være fra dette Kedesj, selv om nogle placerer hans samling i et Kedesj over Genesaret Sø, nærmere Tabor."
    - "I Pekas dage »kom Thiglath-Pileser, Kongen af Assyrien, og tog Ijon og Abel-Beth-Maaka og Ianoa og Kedes og Hasor og Gilead og Galilæa, alt Nafthalis Land, og han bortførte dem til Assyrien«, i 733–732 f.Kr. Byen gik derpå til fønikerne: i 144/143 f.Kr. slog Jonatan Makkabæus Demetrius 2.s generaler på Hazors slette og forfulgte dem til Kedesj, og Josefus kendte Kydasa som en stærk landsby tilhørende tyrerne, altid i strid med galilæerne, hvor Titus lejrede sig i 67 e.Kr., før han indtog Gischala."
    - "Udgravninger har vist byen i disse senere århundreder. Sharon Herbert og Andrea Berlin, der gravede for universiteterne i Michigan og Minnesota i 1997–2012, afdækkede på den nedre høj en stor administrationsbygning fra den persiske og hellenistiske tid med et arkiv af mere end to tusind lerforseglinger, opgivet omkring 144 f.Kr., omkring tiden for Jonatans felttog. På en lav bakke øst for højen blev et romersk tempel fra 100- og 200-tallet e.Kr., hvis indvielse fra 117/118 e.Kr. nævner »den hellige himmelgud«, sandsynligvis Ba'al-Sjamin, undersøgt af Tel Aviv-universitetet; dets mure står endnu adskillige meter høje. Stedet ligger i dag i Israels Øvre Galilæa nær Kibbutz Malkia, med templet og gravene åbne for besøgende."
  sr:
    - "Кедес у Галилеји био је ханаански краљевски град у брдима Горње Галилеје, западно од долине Хула, на Тел Кедесу, великој двострукој хумци близу данашње границе с Ливаном. Његово име значи „свето место“. Исус Навин у списку побеђених царева наводи „цар кедески један“; град је припао Нефталиму, постао најсевернији од градова уточишта, „Кедес у Галилеји у гори Нефталимовој“, и дат је левитима из Гирсона. За Варака, сина Авинејемовог, кога је Девора дозвала „из Кедеса Нефталимовог“ да окупи Завулона и Нефталима, обично се узима да је из овог Кедеса, мада неки његово окупљање смештају у Кедес изнад Галилејског мора, ближе гори Тавор."
    - "У време Фекаја „дође Теглат-Феласар цар асирски, и узе Ијон и Авел-Ветмаху и Јанох и Кедес и Асор и Галад и Галилеју, сву земљу Нефталимову, и пресели народ оданде у Асирију“, 733–732. п. н. е. Град је затим прешао у руке Феничана: 144/143. п. н. е. Јонатан Макавеј потукао је војсковође Димитрија II на равници Асора и гонио их до Кедеса, а Јосиф Флавије је знао Кидасу као јако село Тираца, увек у завади с Галилејцима, где се Тит утаборио 67. н. е. пре заузећа Гишале."
    - "Ископавања су показала град тих каснијих векова. Шерон Херберт и Андреа Берлин, копајући за универзитете у Мичигену и Минесоти 1997–2012, откриле су на доњој хумци велику управну зграду из персијског и хеленистичког раздобља, с архивом од више од две хиљаде глинених печата напуштеном око 144. п. н. е., у време Јонатановог похода. На ниском брду источно од хумке Универзитет у Тел Авиву проучавао је римски храм из II и III века н. е., чије посвећење из 117/118. н. е. помиње „светог бога неба“, вероватно Вал-Самина; његови зидови још стоје високи неколико метара. Налазиште је данас у Горњој Галилеји у Израелу, близу кибуца Малкија, а храм и гробнице отворени су посетиоцима."
  hu:
    - "A galileai Kedes kánaáni királyi város volt Felső-Galilea dombjai között, a Hula-völgytől nyugatra, a Tel Kedesnél, egy nagy kettős halomnál a mai libanoni határ közelében. A neve „szent helyet” jelent. Józsué a legyőzött királyok között számlálja: „Kedesnek királya egy”; a város Naftálira jutott, a legészakibb menedékvárossá tették, „Kedest Galileában a Nafthali hegyén”, és Gérsón lévitáinak adták. Bárákot, az Abinoám fiát, akit Debóra „Kedes-Nafthaliból” hívatott, hogy Zebulont és Naftálit összegyűjtse, rendszerint e Kedes szülöttének tartják, bár egyesek a gyülekezést a Galileai-tenger fölötti, a Tábor-hegyhez közelebbi Kedesre helyezik."
    - "Pekah idejében „jött el Tiglát-Piléser, Assiria királya, és foglalta el Hijont, Abélt, Beth-Maakát, Jánoát, Kédest, Hásort, Gileádot, Galileát és a Nafthali egész földét, és hurczolta el őket, Assiriába”, Kr. e. 733–732-ben. A város ezután a föníciaiakhoz került: Kr. e. 144/143-ban Makkabeus Jonatán a Hácór síkságán megverte II. Démétriusz hadvezéreit, és Kedesig üldözte őket, Josephus pedig Kydasát a tírusziak erős falujaként ismerte, amely mindig viszálykodott a galileaiakkal, és ahol Titusz Kr. u. 67-ben tábort ütött, mielőtt elfoglalta Gischalát."
    - "Az ásatások megmutatták e későbbi századok városát. Sharon Herbert és Andrea Berlin a Michigani és a Minnesotai Egyetem megbízásából 1997 és 2012 között az alsó halmon a perzsa és a hellénisztikus kor nagy közigazgatási épületét tárta fel, több mint kétezer agyagpecsétet őrző levéltárral, amelyet Kr. e. 144 körül hagytak el, Jonatán hadjáratának idején. Egy alacsony dombon, a halomtól keletre áll egy Kr. u. 2–3. századi római templom, amelynek Kr. u. 117/118-as felirata a „menny szent istenét” nevezi meg, valószínűleg Baál-Samint; a Tel-Avivi Egyetem vizsgálta, falai még több méter magasak. A hely ma Izrael Felső-Galileájában van, Malkia kibuc közelében, a templom és a sírok látogathatók."
  fi:
    - "Galilean Kedes oli kanaanilainen kuninkaallinen kaupunki Ylä-Galilean kukkuloilla Hulan laaksosta länteen, paikassa Tel Kedesh, suuri kaksoiskumpu nykyisen Libanonin rajan lähellä. Sen nimi merkitsee ”pyhää paikkaa”. Joosuan luettelossa voitettujen kuninkaiden joukossa on ”Kedeksen kuningas yksi”; kaupunki joutui Naftalille, siitä tehtiin pohjoisin turvakaupungeista, ”Kedeksen Galileasta, Naftalin vuoristosta”, ja se annettiin Gersonin leeviläisille. Barakin, Abinoamin pojan, jonka Debora kutsui ”Naftalin Kedeksestä” kokoamaan Sebulonin ja Naftalin, katsotaan yleensä olleen tästä Kedeksestä, vaikka jotkut sijoittavat hänen kokoontumisensa Galileanjärven yläpuolella olevaan Kedekseen, lähemmäs Taborvuorta."
    - "Pekahin päivinä ”tuli Tiglat-Pileser, Assurin kuningas, ja valloitti Iijonin, Aabel-Beet-Maakan, Jaanoahin, Kedeksen, Haasorin, Gileadin ja Galilean, koko Naftalin maan, ja vei asukkaat pakkosiirtolaisuuteen Assuriin”, vuosina 733–732 eaa. Kaupunki siirtyi sitten foinikialaisille: vuonna 144/143 eaa. Jonatan Makkabilainen voitti Demetrios II:n kenraalit Hasorin tasangolla ja ajoi heitä takaa Kedekseen, ja Josephus tunsi Cydasan tyroslaisten vahvana kylänä, joka oli aina riidoissa galilealaisten kanssa ja jonne Titus leiriytyi vuonna 67 jaa. ennen Gischalan valtaamista."
    - "Kaivaukset ovat paljastaneet noiden myöhempien vuosisatojen kaupungin. Sharon Herbert ja Andrea Berlin, jotka kaivoivat Michiganin ja Minnesotan yliopistojen lukuun vuosina 1997–2012, paljastivat alakummulta suuren persialais- ja hellenistiskautisen hallintorakennuksen, jossa oli yli kahden tuhannen savisinetin arkisto, joka hylättiin noin 144 eaa., Jonatanin sotaretken aikoihin. Kummun itäpuolisella matalalla kukkulalla olevan 100- ja 200-luvun jaa. roomalaisen temppelin, jonka vuodelta 117/118 jaa. olevassa omistuskirjoituksessa mainitaan ”pyhä taivaan jumala”, luultavasti Baal-Shamin, tutki Tel Avivin yliopisto; sen seinät ovat yhä useita metrejä korkeat. Paikka on nykyään Israelin Ylä-Galileassa Kibbutz Malkian lähellä, ja temppeli ja haudat ovat avoinna kävijöille."
  vi:
    - "Kê-đe ở Ga-li-lê là một thành vua của người Ca-na-an trong các đồi thượng Ga-li-lê, phía tây thung lũng Hula, tại Tel Kedesh, một gò kép lớn gần biên giới Li-ban ngày nay. Tên có nghĩa “nơi thánh”. Giô-suê kể “vua Kê-đe” trong số các vua ông đánh bại; thành thuộc về Nép-ta-li, được lập làm thành ẩn náu cực bắc, “Kê-đe ở Ga-li-lê tại trên núi Nép-ta-li”, và được cấp cho người Lê-vi thuộc Ghẹt-sôn. Ba-rác con A-bi-nô-am, người Đê-bô-ra sai gọi “từ Kê-đe trong đất Nép-ta-li” để tập hợp Sa-bu-lôn và Nép-ta-li, thường được cho là người của Kê-đe này, dù có người đặt nơi tập hợp tại một Kê-đe phía trên Biển Ga-li-lê, gần núi Tha-bô hơn."
    - "Trong đời Phê-ca, “Tiếc-la-Phi-lê-se, vua A-si-ri, loán đến chiếm lấy Y-giôn, A-bên-Bết-Ma-ca, Gia-nô-ác, Kê-đe, Hát-so, miền Ga-la-át, miền Ga-li-lê, và cả địa phận Nép-ta-li; đoạn đem dân sự các xứ ấy sang A-si-ri”, vào năm 733–732 TCN. Sau đó thành chuyển sang người Phê-ni-xi: năm 144/143 TCN, Giô-na-than Ma-ca-bê đánh bại các tướng của Đê-mê-triu II trên đồng bằng Hát-so và đuổi họ đến Kê-đe, và Josephus biết Cydasa là một làng kiên cố của người Ty-rơ, luôn bất hòa với người Ga-li-lê, nơi Titus đóng trại năm 67 trước khi chiếm Gischala."
    - "Các cuộc khai quật đã cho thấy thành của những thế kỷ sau đó. Sharon Herbert và Andrea Berlin, đào cho các đại học Michigan và Minnesota năm 1997–2012, phát lộ trên gò dưới một tòa nhà hành chính lớn của thời Ba Tư và Hy Lạp hóa, với kho lưu trữ hơn hai nghìn dấu niêm bằng đất sét bị bỏ khoảng năm 144 TCN, vào lúc chiến dịch của Giô-na-than. Trên một ngọn đồi thấp phía đông gò, một đền thờ La Mã của thế kỷ 2 và 3, với bản dâng hiến năm 117/118 nêu “vị thần thánh của bầu trời”, có lẽ là Baal-shamin, đã được Đại học Tel Aviv nghiên cứu; tường của đền vẫn cao vài mét. Địa điểm nay nằm ở thượng Ga-li-lê của Israel gần Kibbutz Malkia, với đền và các ngôi mộ mở cho khách tham quan."
  ro:
    - "Chedeș din Galileea era o cetate regală canaanită în dealurile Galileii de Sus, la vest de valea Hula, la Tel Kedesh, o movilă dublă mare lângă granița actuală cu Libanul. Numele ei înseamnă „loc sfânt”. Iosua îl numără pe regele Chedeșului printre regii pe care i-a învins; cetatea a revenit lui Neftali, a fost făcută cea mai nordică dintre cetățile de scăpare, „Cadisul în Galilea în muntele lui Neftalì”, și a fost dată leviților din Gherșon. Barac, fiul lui Abinoam, pe care Debora l-a chemat „din Kadisul lui Neftalì” ca să adune pe Zabulon și pe Neftali, este socotit de obicei din acest Chedeș, deși unii așază adunarea lui la un Chedeș de deasupra Mării Galileii, mai aproape de Muntele Tabor."
    - "În zilele lui Pecah, „a venit Telgat-fellasar împăratul Asirienilor, și a luat Aia și Avel și Tamaaha și Anioh și Kenez și Asor și Galaad și Galilea tot pământul Netalimului, și i-au mutat pre ei în Asiriea”, în 733–732 î.Hr. Cetatea a trecut apoi la fenicieni: în 144/143 î.Hr., Ionatan Macabeul i-a învins pe generalii lui Dimitrie al II-lea în câmpia Hațorului și i-a urmărit până la Chedeș, iar Iosif Flaviu cunoștea Cydasa ca pe un sat puternic al tirienilor, mereu în dispută cu galileenii, unde Tit a tăbărât în 67 d.Hr. înainte de a lua Ghiscala."
    - "Săpăturile au arătat cum era cetatea în acele secole ulterioare. Sharon Herbert și Andrea Berlin, care au săpat pentru universitățile din Michigan și Minnesota în 1997–2012, au scos la lumină pe movila de jos o mare clădire administrativă din epoca persană și elenistică, cu o arhivă de peste două mii de sigilii de lut, abandonată pe la 144 î.Hr., în jurul campaniei lui Ionatan. Pe un deal jos, la est de movilă, un templu roman din secolele al II-lea și al III-lea d.Hr., a cărui dedicație din 117/118 d.Hr. îl numește pe „dumnezeul sfânt al cerului”, probabil Baal-Șamin, a fost studiat de Universitatea din Tel Aviv; zidurile sale stau și acum în picioare pe câțiva metri înălțime. Situl se află astăzi în Galileea de Sus a Israelului, lângă kibuțul Malkia, cu templul și mormintele deschise vizitatorilor."
  bg:
    - "Кедес в Галилея е бил ханаански царски град във възвишенията на Горна Галилея, на запад от долината Хула, при Тел Кедеш — голям двоен хълм близо до днешната граница с Ливан. Името му означава „свято място“. Иисус Навин брои „Кедеский цар“ сред царете, които победил; градът се паднал на Нефталим, станал най-северният от градовете за прибежище, „Кадес в Галилея в Нефталимовата гора“, и бил даден на левитите от Гирсон. Варак, синът на Авиноам, когото Девора повика „от Нефталимовия Кадис“, за да събере Завулон и Нефталим, обикновено се смята за родом от този Кедес, макар че някои поставят събирането му при Кедес над Галилейско езеро, по-близо до Тавор."
    - "В дните на Факей „дойде Теглат-феласар Асирийският цар та превзе Иион, Авел-вет-мааха, и Янох, и Кадес, и Асор, и Галаад, и Галилея, всичката Нефталимова земя, и заведе ги пленници в Асирия“, през 733–732 г. пр.н.е. След това градът преминал към финикийците: през 144/143 г. пр.н.е. Йонатан Макавей разбил военачалниците на Деметрий II в равнината при Хацор и ги преследвал до Кедес, а Йосиф Флавий познава Кидаса като силно село на тирийците, винаги враждуващо с галилейците, където Тит разположил стана си през 67 г. н.е., преди да превземе Гисхала."
    - "Разкопките показват града от тези по-късни векове. Шарън Хърбърт и Андреа Бърлин, които копаят за университетите в Мичиган и Минесота през 1997–2012 г., откриват на долния хълм голяма административна сграда от персийския и елинистическия период с архив от над две хиляди глинени печатни отпечатъка, изоставен около 144 г. пр.н.е., по времето на похода на Йонатан. На нисък хълм източно от могилата римски храм от II и III в. н.е., чийто посветителен надпис от 117/118 г. н.е. назовава „светия бог на небето“, вероятно Баал-Шамин, е проучен от Телавивския университет; стените му още се издигат на няколко метра. Днес мястото е в Горна Галилея в Израел, близо до кибуц Малкия, а храмът и гробниците са отворени за посетители."
