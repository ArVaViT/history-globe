# Overview article (ADR 0007). Mainstream facts only; Tel Kedesh in Upper Galilee is the accepted site for Kedesh in Galilee; whether Barak's Kedesh-naphtali is the same town is named as debated.
id: kedesh
place: a321cb8
title:
  en: "Kedesh"
  ru: "Кедес"
  uk: "Кедес"
  es: "Cedes"
  pt: "Quedes"
  de: "Kedesch"
  fr: "Kédesch"
body:
  en:
    - "Kedesh in Galilee was a Canaanite royal city in the hills of Upper Galilee, west of the Hula valley, at Tel Kedesh, a large double mound near today's border with Lebanon. Its name means “holy place”. Joshua counts “The king of Kedesh” among the kings he beat; the town fell to Naphtali, was made the northernmost of the cities of refuge, “Kedesh in Galilee in mount Naphtali”, and was given to the Levites of Gershon. Barak son of Abinoam, whom Deborah summoned “out of Kedesh-naphtali” to gather Zebulun and Naphtali, is usually taken to be from this Kedesh, though some place his muster at a Kedesh above the Sea of Galilee, nearer Mount Tabor."
    - "In the days of Pekah “came Tiglath-pileser king of Assyria, and took Ijon, and Abel-beth-maachah, and Janoah, and Kedesh, and Hazor, and Gilead, and Galilee, all the land of Naphtali, and carried them captive to Assyria”, in 733–732 BC. The town then passed to the Phoenicians: in 145 BC Jonathan Maccabeus beat the generals of Demetrius II on the plain of Hazor and pursued them to Kedesh, and Josephus knew Cydasa as a strong village of the Tyrians, always at odds with the Galileans, where Titus camped in AD 67 before taking Gischala."
    - "Excavations have shown the town of those later centuries. Sharon Herbert and Andrea Berlin, digging for the universities of Michigan and Minnesota in 1997–2012, uncovered on the lower mound a great administrative building of the Persian and Hellenistic periods, with an archive of more than two thousand clay sealings abandoned about 145 BC, the year of Jonathan's campaign. On the upper slope a Roman temple of the second and third centuries AD, whose dedication of AD 117/118 names the “holy god of the sky”, probably Baal-shamin, was studied by Tel Aviv University; its walls still stand several metres high. The site is today in Israel's Upper Galilee near Kibbutz Malkia, with the temple and tombs open to visitors."
  ru:
    - "Кедес в Галилее — ханаанский царский город в горах Верхней Галилеи, к западу от долины Хула, на Тель-Кедеше, большом двойном холме близ нынешней границы с Ливаном. Имя значит «святое место». Иисус Навин считает царя Кедеса среди разбитых им царей; город достался Неффалиму, был сделан самым северным из городов убежища — «Кедес в Галилее на горе Неффалимовой» — и отдан левитам из рода Гирсона. Варака, сына Авиноамова, которого Девора призвала «из Кедеса Неффалимова» собрать Завулона и Неффалима, обычно считают уроженцем этого Кедеса, хотя некоторые помещают его сбор в Кедес над Галилейским морем, ближе к Фавору."
    - "Во дни Факея «пришел Феглаффелласар, царь Ассирийский, и взял Ион, Авел-Беф-Мааху, и Ианох, и Кедес, и Асор, и Галаад, и Галилею, всю землю Неффалимову, и переселил их в Ассирию» — в 733–732 годах до н. э. Затем город перешёл к финикиянам: в 145 году до н. э. Ионафан Маккавей разбил полководцев Деметрия II на равнине Асора и преследовал их до Кедеса, а Иосиф Флавий знал Кидасу как сильное селение Тирян, всегда враждовавшее с галилеянами, где Тит в 67 году н. э. стоял станом перед взятием Гисхалы."
    - "Раскопки показали город этих поздних веков. Шарон Герберт и Андреа Берлин, копавшие для университетов Мичигана и Миннесоты в 1997–2012 годах, открыли на нижнем холме большое административное здание персидского и эллинистического времени с архивом более чем из двух тысяч глиняных оттисков печатей, брошенным около 145 года до н. э., в год похода Ионафана. На верхнем склоне римский храм II–III веков н. э., надпись которого 117/118 года называет «святого бога неба», вероятно Баал-Шамина, изучал Тель-Авивский университет; его стены до сих пор стоят на несколько метров в высоту. Сегодня это Верхняя Галилея в Израиле близ киббуца Малкия, и храм с гробницами открыты для посетителей."
  uk:
    - "Кедес у Галілеї був ханаанським царським містом у горах Верхньої Галілеї, на захід від долини Хула, у Тель-Кедесі — великому подвійному пагорбі поблизу сучасного кордону з Ліваном. Його назва означає «святе місце». Ісус Навин зараховує «Царь Кедеський» до царів, яких він переміг; місто дісталося Нефталиму, стало найпівнічнішим із міст-сховищ — «Кедес в Галилеї на Нафталїєвій горі» — і було віддане левітам з роду Гершома. Варака, сина Авіноама, якого Дебора покликала «з Кадеса Нефталимового», щоб зібрати Завулона й Нефталима, зазвичай уважають вихідцем із цього Кедеса, хоча дехто розміщує його збір у Кедесі над Галілейським морем, ближче до гори Фавор."
    - "За днів Факея «прийшов Теглатфелласар, царь Ассирийський, і звоював Йон, Абел-бет-Мааху, Янох, Кедес і Асор, Галаад і Галилею, усю землю Нефталїєву, та й одвів їх в Ассирию», — у 733–732 рр. до н. е. Згодом місто перейшло до фінікійців: у 145 р. до н. е. Йонатан Макавей розбив воєвод Димитрія II на рівнині Гацору й переслідував їх аж до Кедеса, а Йосиф Флавій знав Кідасу як сильне село тирян, що завжди ворогувало з галилеянами, де Тит розташувався табором у 67 р. н. е. перед здобуттям Гішали."
    - "Розкопки показали, яким було місто тих пізніших століть. Шерон Герберт і Андреа Берлін, що копали від імені університетів Мічигану й Міннесоти в 1997–2012 рр., відкрили на нижньому пагорбі велику адміністративну будівлю часів Персії та еллінізму з архівом із понад двох тисяч глиняних печаток, полишеним близько 145 р. до н. е., у рік походу Йонатана. На верхньому схилі римський храм II–III ст. н. е., чий напис-посвята 117/118 р. н. е. називає «святого бога неба», імовірно Баал-Шаміна, досліджував Тель-Авівський університет; його стіни й досі стоять на висоту кількох метрів. Сьогодні це місце лежить у ізраїльській Верхній Галілеї поблизу кібуцу Малкія, а храм і гробниці відкриті для відвідувачів."
  es:
    - "Cedes de Galilea fue una ciudad real cananea en las colinas de la Alta Galilea, al oeste del valle del Hula, en Tel Cedes, un gran montículo doble cerca de la actual frontera con el Líbano. Su nombre significa «lugar santo». Josué cuenta entre los reyes que derrotó a «el rey de Chêdes»; la ciudad correspondió a Neftalí, fue convertida en la más septentrional de las ciudades de refugio, «Cedes en Galilea, en el monte de Nephtalí», y se dio a los levitas de Gersón. Se suele suponer que Barac, hijo de Abinoam, a quien Débora llamó «de Cedes de Nephtalí» para reunir a Zabulón y a Neftalí, era de esta Cedes, aunque algunos sitúan su convocatoria en una Cedes sobre el Mar de Galilea, más cerca del monte Tabor."
    - "En tiempos de Peka «vino Tiglath-pileser rey de los Asirios, y tomó á Ahión, Abel-beth-maachâ, y Janoa, y Cedes, y Asor, y Galaad, y Galilea, y toda la tierra de Nephtalí; y trasportólos á Asiria», en 733–732 a. C. Después la ciudad pasó a los fenicios: en 145 a. C. Jonatán Macabeo derrotó a los generales de Demetrio II en la llanura de Hazor y los persiguió hasta Cedes, y Josefo conoció Cidasa como una fuerte aldea de los tirios, siempre enemistada con los galileos, donde Tito acampó en 67 d. C. antes de tomar Giscala."
    - "Las excavaciones han mostrado la ciudad de esos siglos posteriores. Sharon Herbert y Andrea Berlin, que excavaron para las universidades de Míchigan y Minnesota en 1997–2012, sacaron a la luz en el montículo bajo un gran edificio administrativo de los períodos persa y helenístico, con un archivo de más de dos mil sellos de arcilla abandonado hacia 145 a. C., el año de la campaña de Jonatán. En la ladera superior, un templo romano de los siglos II y III d. C., cuya dedicatoria de 117/118 d. C. nombra al «dios santo del cielo», probablemente Baal-Shamin, fue estudiado por la Universidad de Tel Aviv; sus muros aún se alzan varios metros. Hoy el sitio se encuentra en la Alta Galilea israelí, cerca del kibutz Malkia, y el templo y las tumbas están abiertos a los visitantes."
  pt:
    - "Quedes, na Galileia, era uma cidade real cananeia nas colinas da Alta Galileia, a oeste do vale de Hula, em Tel Quedes, um grande montículo duplo perto da atual fronteira com o Líbano. Seu nome significa “lugar santo”. Josué conta “o rei de Quedes” entre os reis que derrotou; a cidade coube a Naftali, tornou-se a mais setentrional das cidades de refúgio, “Quedes, na Galileia, na região montanhosa de Naftali”, e foi dada aos levitas de Gérson. Baraque, filho de Abinoão, a quem Débora mandou chamar “de Quedes-Naftali” para reunir Zebulom e Naftali, costuma ser tido como natural desta Quedes, embora alguns situem a sua convocação numa Quedes acima do Mar da Galileia, mais perto do monte Tabor."
    - "Nos dias de Peca, “Tiglate-Pileser, rei da Assíria, veio e tomou Ijom, Abel-Bete-Maaca, Janoa, Quedes, Hazor, Gileade e a Galileia, toda a terra de Naftali; e os levou cativos para a Assíria”, em 733–732 a.C. A cidade passou então aos fenícios: em 145 a.C. Jônatas Macabeu derrotou os generais de Demétrio II na planície de Hazor e os perseguiu até Quedes, e Josefo conheceu Cidasa como uma forte aldeia dos tírios, sempre em desavença com os galileus, onde Tito acampou em 67 d.C. antes de tomar Giscala."
    - "As escavações mostraram a cidade desses séculos posteriores. Sharon Herbert e Andrea Berlin, escavando em nome das universidades de Michigan e Minnesota em 1997–2012, descobriram no montículo inferior um grande edifício administrativo dos períodos persa e helenístico, com um arquivo de mais de duas mil selagens de argila abandonado por volta de 145 a.C., o ano da campanha de Jônatas. Na encosta superior, um templo romano dos séculos II e III d.C., cuja dedicatória de 117/118 d.C. nomeia o “deus santo do céu”, provavelmente Baal-Shamin, foi estudado pela Universidade de Tel Aviv; suas paredes ainda se erguem a vários metros de altura. O sítio fica hoje na Alta Galileia, em Israel, perto do kibutz Malkia, com o templo e os túmulos abertos à visitação."
  de:
    - "Kedesch in Galiläa war eine kanaanäische Königsstadt in den Bergen Obergaliläas westlich der Hulaebene, bei Tel Kedesch, einem großen Doppelhügel nahe der heutigen Grenze zum Libanon. Sein Name bedeutet „heiliger Ort“. Unter den Königen, die Josua schlug, steht „der König zu Kedes“; die Stadt fiel an Naftali, wurde als nördlichste der Freistädte bestimmt, „Kedes in Galiläa, auf dem Gebirge Naphthali“, und den Leviten von Gerschon gegeben. Barak, der Sohn Abinoams, den Debora „von Kedes-Naphthali“ rief, um Sebulon und Naftali zu versammeln, stammt gewöhnlich aus diesem Kedesch, obwohl manche seine Sammlung an ein Kedesch oberhalb des Sees Genezareth näher am Tabor verlegen."
    - "In den Tagen Pekachs „kam Thiglath-Pileser, der König von Assyrien, und nahm Ijon, Abel-Beth-Maacha, Janoah, Kedes, Hazor, Gilead und Galiläa, das ganze Land Naphthali, und führte sie weg nach Assyrien“, 733–732 v. Chr. Die Stadt fiel dann an die Phönizier: 145 v. Chr. schlug Jonatan Makkabäus die Feldherren Demetrius' II. in der Ebene von Hazor und verfolgte sie bis Kedesch, und Josephus kannte Kydasa als befestigtes Dorf der Tyrer, stets im Streit mit den Galiläern, wo Titus im Jahr 67 n. Chr. lagerte, ehe er Gischala einnahm."
    - "Ausgrabungen haben die Stadt jener späteren Jahrhunderte gezeigt. Sharon Herbert und Andrea Berlin legten bei Grabungen für die Universitäten Michigan und Minnesota 1997–2012 auf dem Unterhügel ein großes Verwaltungsgebäude der persischen und hellenistischen Zeit frei, mit einem Archiv von mehr als zweitausend Tonsiegeln, das um 145 v. Chr. aufgegeben wurde, im Jahr von Jonatans Feldzug. Am Oberhang wurde ein römischer Tempel des 2. und 3. Jahrhunderts n. Chr., dessen Weihung von 117/118 n. Chr. den „heiligen Gott des Himmels“ nennt, wahrscheinlich Baal-Schamin, von der Universität Tel Aviv untersucht; seine Mauern stehen noch mehrere Meter hoch. Der Ort liegt heute in Israels Obergaliläa nahe dem Kibbuz Malkia, Tempel und Gräber sind für Besucher zugänglich."
  fr:
    - "Kédesch en Galilée était une ville royale cananéenne des collines de Haute Galilée, à l’ouest de la vallée de la Houla, à Tel Kedesh, grand tertre double près de l’actuelle frontière avec le Liban. Son nom signifie « lieu saint ». Josué compte « le roi de Kédesch » parmi les rois qu’il battit ; la ville échut à Nephthali, devint la plus septentrionale des villes de refuge, « Kédesch, en Galilée, dans la montagne de Nephthali », et fut donnée aux lévites de Guerschon. Barak, fils d’Abinoam, que Débora fit venir « de Kédesch-Nephthali » pour rassembler Zabulon et Nephthali, est généralement tenu pour originaire de ce Kédesch, bien que certains situent son rassemblement à un Kédesch au-dessus de la mer de Galilée, plus près du mont Thabor."
    - "Du temps de Péka, « Tiglath-Piléser, roi d’Assyrie, vint et prit Ijjon, Abel-Beth-Maaca, Janoach, Kédesch, Hatsor, Galaad et la Galilée, tout le pays de Nephthali, et il emmena captifs les habitants en Assyrie », en 733–732 av. J.-C. La ville passa ensuite aux Phéniciens : en 145 av. J.-C., Jonathan Maccabée battit les généraux de Démétrius II dans la plaine de Hatsor et les poursuivit jusqu’à Kédesch, et Flavius Josèphe connaissait Cydasa comme un solide village des Tyriens, toujours en conflit avec les Galiléens, où Titus campa en 67 apr. J.-C. avant de prendre Gischala."
    - "Les fouilles ont montré la ville de ces siècles tardifs. Sharon Herbert et Andrea Berlin, qui ont fouillé pour les universités du Michigan et du Minnesota en 1997–2012, ont mis au jour sur le tertre inférieur un grand bâtiment administratif des périodes perse et hellénistique, avec des archives de plus de deux mille bulles d’argile abandonnées vers 145 av. J.-C., l’année de la campagne de Jonathan. Sur la pente supérieure, un temple romain des IIe et IIIe siècles apr. J.-C., dont la dédicace de 117/118 apr. J.-C. nomme le « dieu saint du ciel », probablement Baal-Shamin, a été étudié par l’Université de Tel-Aviv ; ses murs se dressent encore sur plusieurs mètres de haut. Le site se trouve aujourd’hui en Haute Galilée israélienne, près du kibboutz Malkia, le temple et les tombes étant ouverts aux visiteurs."
