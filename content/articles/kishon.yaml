body:
  en:
    - "The Kishon drains the valley of Jezreel westward to the Mediterranean. Gathering streams from the foot of Gilboa and the hills about Jenin, it flows north-west past Taanach and Megiddo along the foot of Mount Carmel, squeezes through the narrow pass between Carmel and the hills of Galilee, and reaches the sea at Haifa Bay; its course is about 70 km. For most of the year it is a sluggish stream, but after heavy rain it floods and turns the plain to mud. The song of Deborah calls it “that ancient river”, where the Synodal text keeps the Hebrew word as a name, Kedumim."
    - "Deborah told Barak that the LORD would draw Sisera “to the river Kishon” with his chariots, and Sisera gathered his nine hundred chariots of iron “from Harosheth of the Gentiles unto the river of Kishon”. Barak came down from Mount Tabor; the kings of Canaan fought “in Taanach by the waters of Megiddo”, and “The river of Kishon swept them away”: the chariots, as readers have long supposed, bogged in the flooded plain. Generations later Elijah, after the fire fell on Carmel, had the prophets of Baal brought “down to the brook Kishon, and slew them there”; the eastern spur of Carmel, where the traditional site of the contest stands at el-Muhraqa, looks straight down on the river. The psalmist prays that Israel's enemies perish “as to Sisera, as to Jabin, at the brook of Kison”. A few scholars have placed the battle of Judges 4 on the Nahal Tabor instead, the second candidate on the map."
    - "The Kishon's lower course became in the twentieth century the most polluted river in Israel, fouled by the refineries and chemical plants of Haifa Bay; the Kishon River Authority was set up in 1994, the discharges were stopped, the bed was dredged of contaminated sludge and a riverside park opened. The river is Nahal Kishon on Israeli maps, with the fishing harbour and shipyards of Haifa at its mouth."
  ru:
    - "Киссон выносит воды долины Изреель на запад, в Средиземное море. Собирая ручьи от подножия Гелвуя и холмов вокруг Дженина, он течёт на северо-запад мимо Фанааха и Мегиддо вдоль подножия горы Кармил, протискивается сквозь узкий проход между Кармилом и холмами Галилеи и выходит к морю в Хайфском заливе; его длина около 70 км. Большую часть года это ленивый ручей, но после сильных дождей он разливается и превращает равнину в грязь. Песнь Деворы зовёт его «поток Кедумим»: там, где в еврейском тексте стоит слово «древний», Синодальный перевод сохранил его как имя."
    - "Девора сказала Вараку, что Господь приведёт Сисару «к потоку Киссону» с его колесницами, и Сисара собрал девятьсот железных колесниц «из Харошеф-Гоима к потоку Киссону». Варак сошёл с горы Фавор; цари Ханаанские сразились «в Фанаахе у вод Мегиддонских», и «Поток Киссон увлек их»: колесницы, как давно предполагают читатели, увязли в затопленной равнине. Поколения спустя Илия, после того как огонь сошёл на Кармил, велел отвести пророков Ваала «к потоку Киссону и заколол их там»; восточный отрог Кармила, где в Эль-Мухраке стоит традиционное место состязания, смотрит прямо вниз на реку. Псалмопевец молится, чтобы враги Израиля погибли, как «Сисаре, что Иавину у потока Киссона». Немногие учёные помещали битву 4-й главы Судей на Нахаль-Тавор — второй кандидат на карте."
    - "Нижнее течение Киссона стало в XX веке самой загрязнённой рекой Израиля, отравленной нефтеперерабатывающими и химическими заводами Хайфского залива; в 1994 году было создано Управление реки Кишон, сбросы остановлены, русло очищено от заражённого ила, а на берегу открыт парк. На израильских картах река — Нахаль-Кишон, с рыбацкой гаванью и верфями Хайфы в устье."
  uk:
    - "Кішон відводить води Їзреельської долини на захід до Середземного моря. Збираючи струмки від підніжжя Гілбоа й пагорбів навколо Дженіна, він тече на північний захід повз Таанах і Мегіддо вздовж підніжжя Кармеля, протискується вузьким проходом між Кармелем і пагорбами Галілеї й виходить до моря в Хайфській затоці; довжина його течії — близько 70 км. Більшу частину року це млявий потік, але після сильних дощів він розливається й обертає рівнину на багнюку. Пісня Дебори називає його давньою рікою, тоді як текст Куліша зберігає староєврейське слово як назву: «Поток Кедумим, потік Кисон»."
    - "Дебора сказала Вараку, що Господь приведе Сісару з його колесницями «до потока Кисон», і Сісара зібрав свої дев’ятсот залізних колесниць «із поганського Гаросета на Кисон-бурчак». Варак зійшов з гори Фавор; царі Ханаану билися «в Танаах у вод Мегидонських», і «Той Кисон, бурчак (потужний), різко рвав і нїс їх»: колесниці, як давно припускають читачі, загрузли на залитій рівнині. Через покоління Ілля, після того як вогонь упав на Кармелі, звелів привести пророків Ваала, і «повїв їх Ілия до потока Кисона та й повбивав там»; східний відріг Кармеля, де стоїть традиційне місце змагання в Ель-Мухраці, прямо дивиться вниз на ріку. Псалмоспівець молиться, щоб вороги Ізраїлю загинули «що Сісері, що Явиму коло потока Кисона». Деякі вчені натомість поміщали битву з Книги Суддів, розділ 4, на Нахаль-Тавор, другого кандидата на мапі."
    - "Нижня течія Кішону у XX ст. стала найзабрудненішою рікою Ізраїлю, зіпсованою нафтопереробними й хімічними заводами Хайфської затоки; Управління ріки Кішон створено 1994 р., скиди припинено, дно очищено від забрудненого мулу, і відкрито парк уздовж ріки. На ізраїльських мапах ріка зветься Нахаль-Кішон, а в її гирлі — рибальський порт і верфі Хайфи."
  es:
    - "El Cisón drena el valle de Jezreel hacia el oeste, hasta el Mediterráneo. Reúne arroyos del pie del Gilboa y de las colinas en torno a Yenín, corre hacia el noroeste junto a Taanac y Meguido, al pie del monte Carmelo, se abre paso por el estrecho paso entre el Carmelo y las colinas de Galilea, y llega al mar en la bahía de Haifa; su curso es de unos 70 km. Durante la mayor parte del año es una corriente perezosa, pero tras fuertes lluvias se desborda y convierte la llanura en barro. El cántico de Débora lo llama «el antiguo torrente», donde el texto sinodal conserva la palabra hebrea como nombre, Kedumim."
    - "Débora dijo a Barac que Jehová atraería a Sísara «al arroyo de Cisón» con sus carros, y Sísara reunió sus novecientos carros de hierro «desde Haroseth de las Gentes hasta el arroyo de Cisón». Barac bajó del monte Tabor; los reyes de Canaán pelearon «en Taanac, junto á las aguas de Megiddo», y «Barriólos el torrente de Cisón»: los carros, como se supone desde hace tiempo, quedaron atascados en la llanura inundada. Generaciones después, Elías, tras caer el fuego en el Carmelo, llevó a los profetas de Baal «al arroyo de Cisón, y allí los degolló»; el espolón oriental del Carmelo, donde se alza el lugar tradicional del desafío, en el-Muhraqa, domina el río. El salmista ruega que los enemigos de Israel perezcan «como á Sísara, como á Jabín en el arroyo de Cisón». Unos pocos estudiosos sitúan la batalla de Jueces 4 más bien en el Nahal Tabor, segundo candidato del mapa."
    - "El curso bajo del Cisón se convirtió en el siglo XX en el río más contaminado de Israel, ensuciado por las refinerías y las plantas químicas de la bahía de Haifa; en 1994 se creó la Autoridad del Río Cisón, se detuvieron los vertidos, se dragó el lecho para retirar los lodos contaminados y se abrió un parque ribereño. En los mapas israelíes el río es el Nahal Kishon, con el puerto pesquero y los astilleros de Haifa en su desembocadura."
  pt:
    - "O Quisom drena o vale de Jezreel para oeste até o Mediterrâneo. Reunindo córregos ao pé do Gilboa e das colinas em torno de Jenin, corre para noroeste passando por Taanaque e Megido, ao longo do pé do monte Carmelo, espreme-se pela estreita passagem entre o Carmelo e as colinas da Galileia e chega ao mar na baía de Haifa; seu curso tem cerca de 70 km. Durante a maior parte do ano é um riacho lento, mas depois de chuvas fortes transborda e converte a planície em lama. O cântico de Débora o chama de “aquele antigo ribeiro”, onde o texto sinodal mantém a palavra hebraica como nome, Cedumim."
    - "Débora disse a Baraque que o SENHOR atrairia Sísera “para o ribeiro de Quisom” com seus carros, e Sísera reuniu seus novecentos carros de ferro “de Harosete dos Gentios até o ribeiro de Quisom”. Baraque desceu do monte Tabor; os reis de Canaã lutaram “em Taanaque, junto às águas de Megido”, e “O ribeiro de Quisom os arrastou”: os carros, como os leitores há muito supõem, atolaram na planície inundada. Gerações depois, Elias, após cair o fogo no Carmelo, prendeu os profetas de Baal e “os fez descer ao riacho de Quisom, e os matou ali”; o espigão oriental do Carmelo, onde fica o sítio tradicional da disputa, em el-Muhraqa, domina diretamente o rio. O salmista pede que os inimigos de Israel pereçam “como a Sísera, como a Jabim, no rio Quisom”. Poucos estudiosos situaram a batalha de Juízes 4 no Nahal Tabor, o segundo candidato no mapa."
    - "O curso inferior do Quisom tornou-se, no século XX, o rio mais poluído de Israel, conspurcado pelas refinarias e fábricas químicas da baía de Haifa; a Autoridade do Rio Quisom foi criada em 1994, as descargas foram interrompidas, o leito foi dragado do lodo contaminado e um parque ribeirinho foi aberto. O rio é Nahal Kishon nos mapas israelenses, com o porto pesqueiro e os estaleiros de Haifa em sua foz."
  de:
    - "Der Kischon entwässert die Jesreelebene nach Westen zum Mittelmeer. Er sammelt Bäche vom Fuß des Gilboa und aus den Hügeln um Dschenin, fließt nach Nordwesten an Taanach und Megiddo vorbei am Fuß des Karmel entlang, zwängt sich durch den engen Pass zwischen Karmel und den Hügeln Galiläas und erreicht in der Bucht von Haifa das Meer; sein Lauf misst etwa 70 km. Die meiste Zeit des Jahres ist er ein träger Bach, doch nach starkem Regen tritt er über die Ufer und verwandelt die Ebene in Schlamm. Das Lied der Debora nennt ihn den uralten Fluss; der Synodaltext belässt das hebräische Wort als Namen, Kedumim."
    - "Debora sagte Barak, der HERR werde Sisera „zu dir ziehen an das Wasser Kison mit seinen Wagen“, und Sisera rief seine neunhundert eisernen Wagen zusammen „von Haroseth der Heiden an das Wasser Kison“. Barak zog vom Tabor herab; die Könige Kanaans stritten „zu Thaanach am Wasser Megiddos“, und es heißt: „Der Bach Kison wälzte sie“; die Wagen, so vermutet man seit langem, versanken in der überfluteten Ebene. Später ließ Elia nach dem Feuer auf dem Karmel die Propheten Baals greifen und „führte sie hinab an den Bach Kison und schlachtete sie daselbst“; der östliche Karmelausläufer mit der überlieferten Stätte des Wettstreits bei el-Muhraqa blickt geradewegs auf den Fluss. Der Psalmist bittet, den Feinden Israels zu tun „wie Sisera, wie Jabin am Bach Kison“. Einige verlegen die Schlacht von Richter 4 stattdessen an den Nahal Tabor, den zweiten Kandidaten auf der Karte."
    - "Der Unterlauf des Kischon wurde im 20. Jahrhundert zum am stärksten verschmutzten Fluss Israels, verunreinigt von den Raffinerien und Chemiewerken der Bucht von Haifa; 1994 wurde die Kischon-Flussbehörde gegründet, die Einleitungen wurden gestoppt, das Bett wurde vom verseuchten Schlamm ausgebaggert, und ein Uferpark wurde eröffnet. Auf israelischen Karten heißt der Fluss Nahal Kishon, an seiner Mündung liegen Fischereihafen und Werften von Haifa."
  fr:
    - "Le Kison draine la vallée de Jizreel vers l’ouest jusqu’à la Méditerranée. Rassemblant des cours d’eau au pied du Guilboa et des collines autour de Jénine, il coule vers le nord-ouest devant Thaanac et Meguiddo, le long du pied du mont Carmel, se glisse par l’étroit passage entre le Carmel et les collines de Galilée, et atteint la mer dans la baie de Haïfa ; son cours est d’environ 70 km. Pendant la plus grande partie de l’année, c’est un cours d’eau paresseux, mais après de fortes pluies il déborde et change la plaine en boue. Le cantique de Débora l’appelle « le torrent des anciens temps », là où le texte synodal garde le mot hébreu comme un nom, Kedoumim."
    - "Débora dit à Barak que l’Éternel attirerait Sisera « au torrent de Kison » avec ses chars, et Sisera rassembla ses neuf cents chars de fer « depuis Haroscheth-Goïm » « vers le torrent de Kison ». Barak descendit du mont Thabor ; les rois de Canaan combattirent « à Thaanac, aux eaux de Meguiddo », et « le torrent de Kison les a entraînés » : les chars, croit-on depuis longtemps, s’enlisèrent dans la plaine inondée. Beaucoup plus tard, Élie, après le feu tombé sur le Carmel, fit descendre les prophètes de Baal « au torrent de Kison, où il les égorgea » ; l’éperon oriental du Carmel, avec le site traditionnel de l’épreuve à el-Muhraqa, domine le fleuve. Le psalmiste demande que les ennemis d’Israël soient traités « comme Sisera, comme Jabin au torrent de Kison ». Quelques savants situent plutôt la bataille de Juges 4 sur le Nahal Thabor, second candidat sur la carte."
    - "Le cours inférieur du Kison devint au XXe siècle la rivière la plus polluée d’Israël, souillée par les raffineries et les usines chimiques de la baie de Haïfa ; l’Autorité du fleuve Kison fut créée en 1994, les rejets furent arrêtés, le lit fut débarrassé par dragage des boues contaminées et un parc riverain fut ouvert. Le fleuve est le Nahal Kishon sur les cartes israéliennes, avec le port de pêche et les chantiers navals de Haïfa à son embouchure."
  it:
    - "Il Kison drena la valle di Izreel verso ovest fino al Mediterraneo. Raccogliendo ruscelli ai piedi del Gelboe e delle colline intorno a Jenin, scorre a nord-ovest oltre Taanach e Meghiddo lungo la base del Monte Carmelo, si stringe nello stretto passo tra il Carmelo e le colline della Galilea e raggiunge il mare nella baia di Haifa; il suo corso è di circa 70 km. Per lo più è un corso d’acqua pigro, ma dopo forti piogge straripa e trasforma la pianura in fango. Il cantico di Debora lo chiama «l’antico torrente», dove il testo sinodale conserva la parola ebraica come nome, Kedumim."
    - "Debora disse a Barak che l’Eterno avrebbe attirato Sisara «al torrente Kison» con i suoi carri, e Sisara radunò i suoi novecento carri di ferro «da Harosceth-Goim fino al torrente Kison». Barak scese dal monte Tabor; i re di Canaan combatterono «a Taanac, presso le acque di Meghiddo», e «Il torrente di Kison li travolse»: i carri, come da tempo si suppone, si impantanarono nella pianura inondata. Generazioni dopo Elia, caduto il fuoco sul Carmelo, fece scendere i profeti di Baal «al torrente Kison, e quivi li scannò»; lo sperone orientale del Carmelo, dove sorge il sito tradizionale della sfida a el-Muhraqa, guarda dritto sul fiume. Il salmista prega che ai nemici d’Israele sia fatto «come facesti … a Sisera, a Jabin presso al torrente di Chison». Alcuni collocano invece la battaglia di Giudici 4 sul Nahal Tabor, secondo candidato sulla mappa."
    - "Il corso inferiore del Kison divenne nel Novecento il fiume più inquinato d’Israele, insozzato dalle raffinerie e dagli impianti chimici della baia di Haifa; l’Autorità del fiume Kishon fu istituita nel 1994, gli scarichi furono fermati, il letto fu dragato dai fanghi contaminati e fu aperto un parco lungofiume. Il fiume è il Nahal Kishon sulle carte israeliane, con il porto peschereccio e i cantieri navali di Haifa alla sua foce."
  pl:
    - "Kiszon odwadnia dolinę Jizreel na zachód do Morza Śródziemnego. Zbierając strumienie u podnóża Gilboa i wzgórz wokół Dżeninu, płynie na północny zachód obok Taanak i Megiddo u stóp Karmelu, przeciska się przez wąskie przejście między Karmelem a wzgórzami Galilei i dociera do morza w zatoce Hajfy; jego bieg ma około 70 km. Przez większość roku jest leniwym strumieniem, ale po obfitych deszczach wylewa i zamienia równinę w błoto. Pieśń Debory nazywa go starożytną rzeką, przy czym tekst synodalny zachowuje hebrajskie słowo jako imię własne, Kedumim."
    - "Debora powiedziała Barakowi, że Pan przywiedzie Sisere „ku rzece Cyson” z jego wozami, a Sisera zebrał swoje dziewięćset żelaznych wozów „od Haroset pogańskiego aż do rzeki Cyson”. Barak zszedł z góry Tabor; królowie Kanaanu walczyli „w Tanach u wód Magieddo”, a „Potok Cyson porwał je”: wozy, jak od dawna sądzą czytelnicy, ugrzęzły w zalanej równinie. Pokolenia później, gdy ogień spadł na Karmel, Eliasz kazał pojmać proroków Baala: „A tak odwiódł je Elijasz do potoku Cyson, i tamże je pobił”; wschodnia ostroga Karmelu, gdzie stoi tradycyjne miejsce sporu, el-Muhraqa, patrzy prosto na rzekę. Psalmista modli się, by wrogowie Izraela zginęli „jako Sysarze, jako Jabinowi u potoku Cyson”. Niektórzy uczeni umieszczali bitwę z Sdz 4 raczej nad Nahal Tabor, drugim kandydatem na mapie."
    - "Dolny bieg Kiszonu stał się w XX w. najbardziej zanieczyszczoną rzeką Izraela, zatrutą przez rafinerie i zakłady chemiczne zatoki Hajfy; Urząd Rzeki Kiszon powołano w 1994 r., zrzuty wstrzymano, dno oczyszczono z zanieczyszczonego osadu i otwarto park nad rzeką. Na izraelskich mapach rzeka nosi nazwę Nahal Kiszon, a u jej ujścia leżą port rybacki i stocznie Hajfy."
  nl:
    - "De Kison voert het water van de vallei van Jizreël westwaarts naar de Middellandse Zee. Hij verzamelt beken van de voet van de Gilboa en de heuvels rond Jenin, stroomt noordwestwaarts langs Taänach en Megiddo aan de voet van de Karmel, wringt zich door de smalle pas tussen de Karmel en de heuvels van Galilea, en bereikt de zee in de Baai van Haifa; zijn loop is ongeveer 70 km. Het grootste deel van het jaar is het een trage stroom, maar na zware regen overstroomt hij en maakt van de vlakte modder. Het lied van Debora noemt hem de oude rivier, waar de Synodale tekst het Hebreeuwse woord als eigennaam behoudt, Kedumim."
    - "Debora zei Barak dat de HEER Sisera met zijn wagens “aan de beek Kison” tot hem zou trekken, en Sisera riep zijn negenhonderd ijzeren wagens bijeen “van Haroseth der heidenen tot de beek Kison”. Barak daalde af van de berg Tabor; de koningen van Kanaän streden “te Thaanach aan de wateren van Megiddo”, en “De beek Kison wentelde hen weg”: de wagens, zoals men lang meende, zaten vast in de overstroomde vlakte. Later liet Elia, na het vuur op de Karmel, de profeten van Baäl grijpen; hij “voerde hen af naar de beek Kison, en slachtte hen aldaar”; de oostelijke uitloper van de Karmel, met de traditionele plaats van de krachtmeting bij el-Muhraqa, kijkt recht neer op de rivier. De psalmist bidt dat Israëls vijanden vergaan “als Sisera, als Jabin aan de beek Kison”. Enkele geleerden plaatsen de slag van Richteren 4 liever op de Nahal Tavor, de tweede kandidaat op de kaart."
    - "De benedenloop van de Kison werd in de twintigste eeuw de meest vervuilde rivier van Israël, bezoedeld door de raffinaderijen en chemische fabrieken van de Baai van Haifa; in 1994 werd de Kishon River Authority opgericht, de lozingen werden gestopt, de bedding werd gebaggerd van vervuild slib en een park langs de rivier geopend. De rivier heet op Israëlische kaarten Nahal Kishon, met aan de monding de vissershaven en de scheepswerven van Haifa."
  cs:
    - "Kíšon odvodňuje Jizreelské údolí na západ do Středozemního moře. Sbírá potoky od úpatí Gilboy a z pahorků kolem Jeninu, teče na severozápad kolem Taanachu a Megida podél úpatí hory Karmel, protlačuje se úzkým průsmykem mezi Karmelem a galilejskými pahorky a ústí do moře v zálivu u Haify; jeho tok je dlouhý asi 70 km. Většinu roku je to líný potok, ale po vydatném dešti se rozvodní a obrátí rovinu v bláto. Píseň Debořina jej nazývá starodávnou řekou, kde synodální text ponechává hebrejské slovo jako jméno, Kedumim."
    - "Debora řekla Bárakovi, že Hospodin přivede Siseru s jeho vozy „ku potoku Císon“, a Sisera shromáždil svých devět set železných vozů „z Haroset pohanského, ku potoku Císon“. Bárak sestoupil z hory Tábor; králové kanaánští bojovali „v Tanach při vodách Mageddo“ a „Potok Císon smetl je“: vozy, jak se dávno soudí, uvízly v zaplavené rovině. O generace později Elijáš, když oheň spadl na Karmel, dal proroky Baalovy zjímat a „svedl Eliáš ku potoku Císon, a tam je zmordoval“; východní výběžek Karmelu, kde stojí tradiční místo zápasu v el-Muhraqa, shlíží přímo na řeku. Žalmista se modlí, aby nepřátelé Izraele zahynuli „jako Zizarovi, a jako Jabínovi při potoku Císon“. Několik badatelů kladlo bitvu z Soudců 4 místo toho k Nachal Tábor, druhému kandidátovi na mapě."
    - "Dolní tok Kíšonu se ve 20. století stal nejznečištěnější řekou v Izraeli, zamořenou rafineriemi a chemickými závody v zálivu u Haify; úřad pro řeku Kishon byl zřízen roku 1994, vypouštění bylo zastaveno, koryto bylo vybagrováno od kontaminovaných kalů a otevřel se park při řece. Na izraelských mapách je řeka Nahal Kishon, s rybářským přístavem a loděnicemi Haify při jejím ústí."
  sv:
    - "Kishon avvattnar Jisreeldalen västerut mot Medelhavet. Den samlar bäckar från foten av Gilboa och höjderna kring Jenin, flyter nordväst förbi Taanak och Megiddo längs foten av Karmel, tränger sig genom det smala passet mellan Karmel och Galileens höjder och når havet i Haifaviken; dess lopp är omkring 70 km. Större delen av året är den en trög ström, men efter kraftigt regn svämmar den över och förvandlar slätten till gyttja. Deboras sång kallar den ”urtidsbäcken”, där den synodala texten behåller det hebreiska ordet som ett namn, Kedumim."
    - "Debora sade till Barak att HERREN skulle dra Sisera ”till dig vid bäcken Kison” med hans vagnar, och Sisera samlade sina nio hundra järnvagnar för att ”draga från Haroset-Haggoim till bäcken Kison”. Barak steg ned från berget Tabor; Kanaans konungar stred ”vid Taanak, invid Megiddos vatten”, och ”Bäcken Kison ryckte dem bort”: vagnarna fastnade, som läsare länge har antagit, i den översvämmade slätten. Generationer senare lät Elia, sedan elden fallit på Karmel, föra Baals profeter ”ned till bäcken Kison och slakta dem där”; Karmels östra utlöpare, där den traditionella platsen för striden står vid el-Muhraqa, ser rakt ned på floden. Psalmisten ber att Israels fiender skall gå under ”såsom med Sisera och Jabin vid Kisons bäck”. Några forskare har i stället förlagt striden i Domarboken 4 till Nahal Tabor, den andra kandidaten på kartan."
    - "Kishons nedre lopp blev på 1900-talet Israels mest förorenade flod, nedsmutsad av Haifavikens raffinaderier och kemiska fabriker; Kishons flodmyndighet inrättades 1994, utsläppen stoppades, bädden muddrades från förorenat slam och en park vid floden öppnades. Floden är Nahal Kishon på israeliska kartor, med Haifas fiskehamn och varv vid dess mynning."
