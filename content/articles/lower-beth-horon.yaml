body:
  en:
    - "Lower Beth-horon, Beth-horon the nether, was the lower of the two towns of Beth-horon on the ridge between the valley of Aijalon and Gibeon, the one nearer the plain. It is the village of Beit Ur al-Tahta, “the lower Beit Ur”, about 400 m above the sea in the West Bank, some 19 km north-west of Jerusalem; Upper Beth-horon, Beit Ur al-Fauqa, stands 3 km further up the road and about 200 m higher. The famous ascent and descent of Beth-horon, used by Joshua, Judas Maccabeus and the Roman army, runs between the two."
    - "The Bible names the lower town where it draws borders and lists fortresses. The border of the sons of Joseph “goeth down westward to the coast of Japhleti, unto the coast of Beth-horon the nether, and to Gezer”; the border of Benjamin came down to Ataroth-adar, “near the hill that lieth on the south side of the nether Beth-horon”. The Chronicler says that Sherah, a daughter of Ephraim, “built Beth-horon the nether, and the upper”. In the account of Solomon's building, after Pharaoh had burned Gezer and given it as his daughter's dowry, “Solomon built Gezer, and Beth-horon the nether”, and Chronicles adds that he made the two Beth-horons “fenced cities, with walls, gates, and bars”: the lower town guarded the way up from Gezer and the coast."
    - "The village has not been excavated. Potsherds found there go back to the Late Bronze Age, earlier than those of the upper town; a Roman-period burial cave and the ruin of a Byzantine chapel have been recorded, and the Roman road up to the upper town can still be traced in places. Eusebius names the two villages together, about twelve miles from Jerusalem. Beit Ur al-Tahta is today a Palestinian village of the Ramallah governorate, and Route 443, the Israeli highway from Modi'in to Jerusalem, passes beside it along the ancient line."
  ru:
    - "Нижний Беф-Орон был нижним из двух городов Беф-Орона на гребне между долиной Аиалонской и Гаваоном, тем, что ближе к равнине. Это деревня Бейт-Ур-эт-Тахта, «нижний Бейт-Ур», около 400 м над уровнем моря на Западном берегу, примерно в 19 км к северо-западу от Иерусалима; Верхний Беф-Орон, Бейт-Ур-эль-Фаука, стоит на 3 км дальше по дороге и примерно на 200 м выше. Знаменитые подъём и спуск Вефорона, по которым шли Иисус Навин, Иуда Маккавей и римское войско, лежат между ними."
    - "Библия называет нижний город там, где проводит границы и перечисляет крепости. Предел сынов Иосифа «спускается к морю, к пределу Иафлета, до предела нижнего Беф-Орона и до Газера»; предел Вениамина нисходит к Атароф-Адару, «к горе, которая на южной стороне Беф-Орона нижнего». Летописец говорит, что Шеера, дочь Ефрема, «построила Беф-Орон нижний и верхний». В рассказе о постройках Соломона, после того как фараон сжёг Газер и отдал его в приданое дочери, сказано: «И построил Соломон Газер и нижний Бефорон», а Паралипоменон добавляет, что он обстроил оба Вефорона как «города укрепленные, со стенами, воротами и запорами»: нижний город стерёг подъём от Газера и побережья."
    - "Деревня не раскапывалась. Найденные здесь черепки восходят к позднему бронзовому веку, раньше, чем в верхнем городе; отмечены погребальная пещера римского времени и развалины византийской часовни, а римская дорога к верхнему городу местами прослеживается до сих пор. Евсевий называет оба селения вместе, примерно в двенадцати милях от Иерусалима. Бейт-Ур-эт-Тахта сегодня — палестинская деревня провинции Рамалла, а шоссе 443, израильская дорога из Модиина в Иерусалим, проходит рядом с ней по древней линии."
  uk:
    - "Нижній Бет-Хорон, Бет-Хорон нижній, був нижчим із двох міст Бет-Хорон на гребені між долиною Аялона й Гаваоном, тим, що ближче до рівнини. Це село Бейт-Ур-ат-Тахта, «нижній Бейт-Ур», приблизно за 400 м над рівнем моря на Західному березі, за якихось 19 км на північний захід від Єрусалима; Верхній Бет-Хорон, Бейт-Ур-аль-Фауква, стоїть за 3 км далі по дорозі й приблизно на 200 м вище. Славне сходження й спуск Бет-Хорона, що ним ішли Ісус Навин, Юда Макавей і римське військо, проходить між ними."
    - "Біблія називає нижнє місто там, де накреслює межі й перелічує фортеці. Межа синів Йосипа «спускається на захід сонця до займища Яфлетіївського, до займища низового Бет-Орона та до Газера»; межа Веніяміна спускалася до Атарот-Аддару, «до гори, що на полуднє від низового Бет-Орона». Автор Хронік каже, що Шеера, дочка Єфрема, «відбудувала Бет-Орон низший і висший». В оповіді про будівництво Соломона, після того як фараон спалив Гезер і віддав його як віно своєї дочки, «відбудував Соломон Газер і нижнїй Беторон», а Книга Хронік додає, що він зробив обидва Бет-Хорони «міста утверджені, з мурами, брамами та засовами»: нижнє місто стерегло шлях угору від Гезера й узбережжя."
    - "Село не розкопане. Знайдені там черепки сягають пізньої бронзової доби, раніше за черепки верхнього міста; записано римську поховальну печеру і руїну візантійської каплиці, а римську дорогу до верхнього міста ще місцями можна простежити. Євсевій називає обидва села разом, приблизно за дванадцять миль від Єрусалима. Бейт-Ур-ат-Тахта сьогодні — палестинське село мухафази Рамалла, а шосе 443, ізраїльська траса від Модиїна до Єрусалима, проходить поруч уздовж давньої лінії."
  es:
    - "Bet-horón de Abajo, Bet-horón la baja, era la más baja de las dos ciudades de Bet-horón en la cresta entre el valle de Ajalón y Gabaón, la más cercana a la llanura. Es la aldea de Beit Ur al-Tahta, «el Beit Ur bajo», a unos 400 m sobre el nivel del mar, en Cisjordania, a unos 19 km al noroeste de Jerusalén; Bet-horón de Arriba, Beit Ur al-Fauqa, está 3 km más arriba en el camino y a unos 200 m más alto. La famosa subida y bajada de Bet-horón, usada por Josué, Judas Macabeo y el ejército romano, discurre entre las dos."
    - "La Biblia nombra la ciudad baja cuando traza fronteras y enumera fortalezas. La frontera de los hijos de José «torna á descender hacia la mar al término de Japhlet, hasta el término de Beth-oron la de abajo, y hasta Gezer»; la frontera de Benjamín descendía a Atarot-adar, «al monte que está al mediodía de Beth-oron la de abajo». El Cronista dice que Seera, hija de Efraín, «edificó á Beth-oron la baja y la alta». En el relato de las construcciones de Salomón, después de que el faraón incendiara Gezer y la diera como dote de su hija, «Restauró pues Salomón á Gezer, y á la baja Beth-oron», y Crónicas añade que hizo de los dos Bet-horón «ciudades fortificadas, de muros, puertas, y barras»: la ciudad baja guardaba el camino de subida desde Gezer y la costa."
    - "La aldea no ha sido excavada. Los tiestos hallados allí se remontan al Bronce Final, más antiguos que los de la ciudad alta; se han registrado una cueva funeraria de época romana y las ruinas de una capilla bizantina, y la calzada romana que sube a la ciudad alta aún puede seguirse en algunos tramos. Eusebio nombra juntas las dos aldeas, a unas doce millas de Jerusalén. Beit Ur al-Tahta es hoy una aldea palestina de la gobernación de Ramala, y la ruta 443, la carretera israelí de Modiin a Jerusalén, pasa a su lado por el trazado antiguo."
  pt:
    - "Bete-Horom de Baixo era a mais baixa das duas cidades de Bete-Horom na crista entre o vale de Aijalom e Gibeão, a mais próxima da planície. É a aldeia de Beit Ur al-Tahta, “a Beit Ur inferior”, a cerca de 400 m acima do mar, na Cisjordânia, a uns 19 km a noroeste de Jerusalém; Bete-Horom de Cima, Beit Ur al-Fauqa, fica 3 km mais acima na estrada e uns 200 m mais alta. A famosa subida e descida de Bete-Horom, usada por Josué, Judas Macabeu e o exército romano, corre entre as duas."
    - "A Bíblia nomeia a cidade baixa ao traçar fronteiras e listar fortalezas. A fronteira dos filhos de José “desceu para o oeste até a fronteira dos jafletitas, até a fronteira de Bete-Horom inferior, e prosseguiu até Gezer”; a fronteira de Benjamim descia a Atarote-Adar, “pelo monte que fica ao sul de Bete-Horom Baixa”. O Cronista diz que Seerá, filha de Efraim, “edificou Bete-Horom, a baixa e a alta”. No relato das construções de Salomão, depois que o faraó queimou Gezer e a deu como dote à sua filha, “Salomão construiu na terra Gezer, Bete-Horom Baixa”, e as Crônicas acrescentam que ele fez as duas Bete-Horom “cidades fortificadas com muros, portas e trancas”: a cidade baixa guardava o caminho que sobe de Gezer e da costa."
    - "A aldeia não foi escavada. Cacos ali encontrados remontam à Idade do Bronze Recente, mais antigos que os da cidade alta; foram registrados uma caverna sepulcral do período romano e a ruína de uma capela bizantina, e a estrada romana que sobe à cidade alta ainda pode ser traçada em alguns trechos. Eusébio nomeia as duas aldeias juntas, a cerca de doze milhas de Jerusalém. Beit Ur al-Tahta é hoje uma aldeia palestina da província de Ramallah, e a Rota 443, a rodovia israelense de Modiin a Jerusalém, passa ao lado dela pelo traçado antigo."
  de:
    - "Unteres Bet-Horon, das niedere Bet-Horon, war die untere der beiden Städte Bet-Horon auf dem Höhenrücken zwischen dem Tal Ajalon und Gibeon, die der Ebene nähere. Es ist das Dorf Beit Ur al-Tahta, „das untere Beit Ur“, etwa 400 m über dem Meer im Westjordanland, rund 19 km nordwestlich von Jerusalem; Oberes Bet-Horon, Beit Ur al-Fauqa, liegt 3 km weiter oben an der Straße und etwa 200 m höher. Der berühmte Auf- und Abstieg von Bet-Horon, den Josua, Judas Makkabäus und das römische Heer benutzten, verläuft zwischen beiden."
    - "Die Bibel nennt die untere Stadt, wo sie Grenzen zieht und Festungen aufzählt. Die Grenze der Söhne Josefs „zieht sich hernieder abendwärts zu der Grenze des Japhletiters bis an die Grenze des niederen Beth-Horon und bis gen Geser“; die Grenze Benjamins kam hinab „gen Ataroth-Adar an den Berg, der gegen Mittag liegt von dem niederen Beth-Horon“. Von Scheera, einer Tochter Ephraims, sagt der Chronist: „die baute das niedere und obere Beth-Horon“. Im Bericht über Salomos Bauten, nachdem der Pharao Geser verbrannt und seiner Tochter als Mitgift gegeben hatte: „Also baute Salomo Geser und das niedere Beth-Horon“, und die Chronik fügt hinzu, beide Bet-Horon seien „feste Städte“ gewesen, „mit Mauern, Türen und Riegeln“: Die untere Stadt bewachte den Weg hinauf von Geser und der Küste."
    - "Das Dorf wurde nicht ausgegraben. Dort gefundene Scherben reichen bis in die Spätbronzezeit zurück, früher als die der oberen Stadt; eine Grabhöhle der römischen Zeit und die Ruine einer byzantinischen Kapelle sind verzeichnet, und die römische Straße zur oberen Stadt lässt sich stellenweise noch verfolgen. Eusebius nennt die beiden Dörfer zusammen, etwa zwölf Meilen von Jerusalem. Beit Ur al-Tahta ist heute ein palästinensisches Dorf im Gouvernement Ramallah, und die Route 443, die israelische Straße von Modi'in nach Jerusalem, führt neben ihm auf der antiken Linie vorbei."
  fr:
    - "Beth-Horon la basse était la plus basse des deux villes de Beth-Horon sur la crête entre la vallée d’Ajalon et Gabaon, celle qui est le plus près de la plaine. C’est le village de Beit Ur al-Tahta, « Beit Ur la basse », à environ 400 m d’altitude en Cisjordanie, à quelque 19 km au nord-ouest de Jérusalem ; Beth-Horon la haute, Beit Ur al-Fauqa, se trouve 3 km plus haut sur la route et environ 200 m plus haut. La célèbre montée et descente de Beth-Horon, utilisée par Josué, Judas Maccabée et l’armée romaine, passe entre les deux."
    - "La Bible nomme la ville basse là où elle trace des frontières et dresse des listes de forteresses. La limite des fils de Joseph « descendait à l’occident vers la frontière des Japhléthiens jusqu’à celle de Beth-Horon la basse et jusqu’à Guézer » ; celle de Benjamin descendait à Atharoth-Addar « par-dessus la montagne qui est au midi de Beth-Horon la basse ». Le Chroniqueur dit que Schééra, fille d’Éphraïm, « bâtit Beth-Horon la basse et Beth-Horon la haute ». Dans le récit des constructions de Salomon, après que Pharaon eut incendié Guézer et l’eut donnée en dot à sa fille, « Salomon bâtit Guézer, Beth-Horon la basse », et les Chroniques ajoutent qu’il fit des deux Beth-Horon des « villes fortes, ayant des murs, des portes et des barres » : la ville basse gardait la route montant de Guézer et de la côte."
    - "Le village n’a pas été fouillé. Les tessons qui y ont été trouvés remontent au Bronze récent, plus tôt que ceux de la ville haute ; une grotte funéraire de l’époque romaine et la ruine d’une chapelle byzantine ont été signalées, et la voie romaine montant vers la ville haute se suit encore par endroits. Eusèbe nomme ensemble les deux villages, à environ douze milles de Jérusalem. Beit Ur al-Tahta est aujourd’hui un village palestinien du gouvernorat de Ramallah, et la route 443, route israélienne de Modiin à Jérusalem, passe à côté de lui sur la ligne antique."
  it:
    - "Bet-Oron di sotto era la più bassa delle due città di Bet-Oron sulla dorsale tra la valle di Aialon e Gabaon, quella più vicina alla pianura. È il villaggio di Beit Ur al-Tahta, «il Beit Ur inferiore», a circa 400 m sul livello del mare in Cisgiordania, a circa 19 km a nord-ovest di Gerusalemme; Bet-Oron di sopra, Beit Ur al-Fauqa, sorge 3 km più avanti lungo la strada e circa 200 m più in alto. La famosa salita e discesa di Bet-Oron, percorsa da Giosuè, da Giuda Maccabeo e dall’esercito romano, corre tra le due."
    - "La Bibbia nomina la città bassa là dove traccia confini ed elenca fortezze. Il confine dei figli di Giuseppe «scendeva a occidente verso il confine dei Giafletei sino al confine di Beth-Horon disotto e fino a Ghezer»; il confine di Beniamino scendeva ad Atarot-Addar, «presso il monte che è a mezzogiorno di Beth-Horon disotto». Il Cronista dice che Sceera, figlia di Efraim, edificò «Beth-Horon, la inferiore e la superiore». Nel racconto delle costruzioni di Salomone, dopo che il faraone ebbe bruciato Ghezer e l’ebbe data in dote alla figlia, «Salomone ricostruì Ghezer, Beth-Horon inferiore», e le Cronache aggiungono che fece dei due Bet-Oron «città forti, munite di mura, di porte e di sbarre»: la città bassa sorvegliava la via che sale da Ghezer e dalla costa."
    - "Il villaggio non è stato scavato. I cocci trovati là risalgono al Bronzo Tardo, più antichi di quelli della città alta; sono state registrate una grotta sepolcrale di epoca romana e la rovina di una cappella bizantina, e la strada romana verso la città alta si può ancora seguire in alcuni tratti. Eusebio nomina insieme i due villaggi, a circa dodici miglia da Gerusalemme. Beit Ur al-Tahta è oggi un villaggio palestinese del governatorato di Ramallah, e la Route 443, l’autostrada israeliana da Modi‘in a Gerusalemme, gli passa accanto lungo il tracciato antico."
  pl:
    - "Dolny Bet-Choron był niższym z dwóch miast Bet-Choron na grzbiecie między doliną Ajjalon a Gibeonem, tym bliższym równiny. To wieś Beit Ur al-Tahta, „dolny Beit Ur”, położona około 400 m n.p.m. na Zachodnim Brzegu, jakieś 19 km na północny zachód od Jerozolimy; Górny Bet-Choron, Beit Ur al-Fauqa, leży 3 km dalej przy drodze i około 200 m wyżej. Słynne wejście i zejście Bet-Choron, używane przez Jozuego, Judasza Machabeusza i armię rzymską, biegnie między nimi."
    - "Biblia wymienia dolne miasto tam, gdzie wytycza granice i wylicza twierdze. Granica synów Józefa „ciągnie się ku morzu do granicy Jaflety, aż do granicy Bet Horonu dolnego, i aż do Gazer”; granica Beniamina schodziła do Atarot-Addar, „podle góry, która jest od południa Betoron dolnego”. Kronikarz mówi, że Seera, córka Efraima, „pobudowała Betoron niższe i wyższe”. W opowieści o budowlach Salomona, gdy faraon spalił Gezer i dał je jako posag córce, „zbudował Salomon Gazer i Betoron niższe”, a Księga Kronik dodaje, że uczynił oba Bet-Choron „miastami obronnymi w murach, z bramami i z zaworami”: dolne miasto strzegło drogi w górę od Gezer i wybrzeża."
    - "Wieś nie była badana wykopaliskowo. Znalezione tam skorupy sięgają późnej epoki brązu, wcześniejszej niż skorupy górnego miasta; odnotowano rzymską jaskinię grobową i ruinę bizantyjskiej kaplicy, a rzymską drogę w górę do górnego miasta wciąż można miejscami prześledzić. Euzebiusz wymienia obie wsie razem, około dwunastu mil od Jerozolimy. Beit Ur al-Tahta to dziś palestyńska wieś w muhafazie Ramallah, a obok niej, po starożytnej linii, biegnie droga nr 443, izraelska szosa z Modi'in do Jerozolimy."
  nl:
    - "Neder-Beth-Horon, Beth-Horon het benedenste, was de lagere van de twee steden Beth-Horon op de bergrug tussen het dal van Ajalon en Gibeon, die welke het dichtst bij de vlakte lag. Het is het dorp Beit Ur al-Tahta, “het onderste Beit Ur”, ongeveer 400 m boven de zee in de Westelijke Jordaanoever, zo'n 19 km ten noordwesten van Jeruzalem; Boven-Beth-Horon, Beit Ur al-Fauqa, ligt 3 km verder langs de weg omhoog en ongeveer 200 m hoger. De beroemde opgang en afdaling van Beth-Horon, gebruikt door Jozua, Judas Makkabeüs en het Romeinse leger, loopt tussen beide."
    - "De Bijbel noemt de benedenstad waar grenzen worden getrokken en vestingen opgesomd. De grens van de zonen van Jozef “gaat af tegen het westen naar de landpale Jafleti, tot aan de landpale van het benedenste Beth-horon, en tot Gezer”; de grens van Benjamin daalde af naar Atarot-Addar, “aan den berg, die aan de zuidzijde van het benedenste Beth-Horon is”. De Kroniekschrijver zegt dat Seera, een dochter van Efraïm, “die bouwde het lage en het hoge Beth-horon”. In het verslag van Salomo's bouwwerken, nadat de farao Gezer had verbrand en als bruidsschat aan zijn dochter had gegeven, staat er: “Alzo bouwde Salomo Gezer, en het lage Beth-horon”, en Kronieken voegt toe dat hij de twee Beth-Horons maakte tot “vaste steden met muren, deuren en grendelen”: de benedenstad bewaakte de weg omhoog vanaf Gezer en de kust."
    - "Het dorp is niet opgegraven. Potscherven die er zijn gevonden gaan terug tot de late bronstijd, vroeger dan die van de bovenstad; een grafgrot uit de Romeinse tijd en de ruïne van een Byzantijnse kapel zijn vastgelegd, en de Romeinse weg naar de bovenstad is op plaatsen nog te volgen. Eusebius noemt de twee dorpen samen, ongeveer twaalf mijl van Jeruzalem. Beit Ur al-Tahta is tegenwoordig een Palestijns dorp in het gouvernement Ramallah, en Route 443, de Israëlische snelweg van Modi'in naar Jeruzalem, loopt langs de oude lijn ernaast."
  cs:
    - "Dolní Bét-choron byl nižší ze dvou měst Bét-choron na hřbetu mezi údolím Ajalon a Gibeonem, to blíže k rovině. Je to vesnice Beit Ur al-Tahta, „dolní Beit Ur“, asi 400 m nad mořem na Západním břehu, asi 19 km severozápadně od Jeruzaléma; Horní Bét-choron, Beit Ur al-Fauqa, stojí o 3 km dále při silnici a asi o 200 m výše. Slavný výstup a sestup Bét-choronu, který užili Jozue, Juda Makabejský i římské vojsko, vede mezi nimi."
    - "Bible jmenuje dolní město tam, kde vytyčuje hranice a vypočítává pevnosti. Hranice synů Josefových „jde k moři ku pomezí Jefleti, až ku pomezí Betoron dolního, a až k Gázer“; hranice Benjamínova sestupovala k Atarót-addaru „vedlé hory, kteráž jest od poledne Betoron dolního“. Kronikář praví, že Šeera, dcera Efrajimova, „vystavěla Betoron dolní i horní“. V líčení Šalomounových staveb, poté co Farao vypálil Gezer a dal jej za věno své dceři, „vystavěl zase Šalomoun Gázer a Betoron dolní“ a Kroniky dodávají, že učinil oba Bét-choron „města ohrazená zdmi, branami i závorami“: dolní město střežilo cestu nahoru od Gezeru a od pobřeží."
    - "Vesnice nebyla vykopána. Nalezené střepy sahají do pozdní doby bronzové, jsou starší než střepy horního města; zaznamenána byla římská pohřební jeskyně a zřícenina byzantské kaple a římská silnice nahoru k hornímu městu je místy dosud vysledovatelná. Eusebius jmenuje obě vesnice spolu, asi dvanáct mil od Jeruzaléma. Beit Ur al-Tahta je dnes palestinská vesnice guvernorátu Ramalláh a dálnice č. 443, izraelská silnice z Modi'inu do Jeruzaléma, vede podél ní po dávné linii."
  sv:
    - "Nedre Bet-Horon var den lägre av de två städerna Bet-Horon på åsen mellan Ajalondalen och Gibeon, den som låg närmast slätten. Det är byn Beit Ur al-Tahta, ”nedre Beit Ur”, omkring 400 m över havet på Västbanken, ungefär 19 km nordväst om Jerusalem; Övre Bet-Horon, Beit Ur al-Fauqa, ligger 3 km längre upp längs vägen och omkring 200 m högre. Den berömda stigningen och sluttningen vid Bet-Horon, som användes av Josua, Judas Mackabeus och den romerska hären, löper mellan de två."
    - "Bibeln nämner den nedre staden där den drar gränser och förtecknar befästningar. Josefs söners gräns gick ”västerut ned till jafletiternas område, ända till Nedre Bet-Horons område och till Geser”; Benjamins gräns gick ned till Atarot-Addar ”över berget söder om Nedre Bet-Horon”. Krönikeförfattaren säger att Shera, en dotter till Efraim, ”byggde Nedre och Övre Bet-Horon”. I berättelsen om Salomos byggen, sedan farao hade bränt Geser och givit det som hemgift åt sin dotter, heter det: ”Salomo byggde upp Geser, ävensom Nedre Bet-Horon”, och Krönikeböckerna tillägger att han gjorde de två Bet-Horon till ”fasta städer med murar, portar och bommar”: den nedre staden bevakade vägen upp från Geser och kusten."
    - "Byn har inte grävts ut. Krukskärvor funna där går tillbaka till yngre bronsåldern, äldre än den övre stadens; en romersk gravgrotta och ruinen av ett bysantinskt kapell har registrerats, och den romerska vägen upp till den övre staden kan ännu spåras på vissa ställen. Eusebios nämner de två byarna tillsammans, omkring tolv romerska mil från Jerusalem. Beit Ur al-Tahta är i dag en palestinsk by i Ramallahs guvernement, och väg 443, den israeliska motorvägen från Modi'in till Jerusalem, går förbi den längs den forntida linjen."
  nb:
    - "Nedre Bet-Horon var den nedre av de to byene Bet-Horon på ryggen mellom Ajalon-dalen og Gibeon, den som lå nærmest sletten. Det er landsbyen Beit Ur al-Tahta, «nedre Beit Ur», omkring 400 m over havet på Vestbredden, omkring 19 km nordvest for Jerusalem; Øvre Bet-Horon, Beit Ur al-Fauqa, ligger 3 km lenger opp langs veien og omkring 200 m høyere. Den berømte oppstigningen og nedstigningen ved Bet-Horon, brukt av Josva, Judas Makkabeus og den romerske hæren, går mellom de to."
    - "Bibelen nevner den nedre byen der den trekker grenser og oppregner festninger. Josef-sønnenes grense «tok så vestover ned til jafletittenes land, til Nedre-Bet-Horons landemerke og til Geser»; Benjamins grense gikk ned til Atarot-Addar «over det fjell som ligger sønnenfor Nedre-Bet-Horon». Kronikeren sier at Sjera, en datter av Efraim, «bygget Nedre- og Øvre-Bet-Horon». I beretningen om Salomos byggevirksomhet, etter at Farao hadde brent Geser og gitt den som medgift til datteren, «men Salomo bygget Geser op igjen, og likeså bygget han op Nedre-Bet-Horon», og Krønikebøkene føyer til at han gjorde de to Bet-Horon til «faste byer med murer, dobbelte porter og bommer»: den nedre byen vernet veien opp fra Geser og kysten."
    - "Landsbyen er ikke utgravd. Potteskår funnet der går tilbake til senbronsealderen, tidligere enn de fra den øvre byen; en gravhule fra romertiden og ruinen av et bysantinsk kapell er registrert, og den romerske veien opp til den øvre byen kan fortsatt følges flere steder. Eusebius nevner de to landsbyene sammen, omkring tolv romerske mil fra Jerusalem. Beit Ur al-Tahta er i dag en palestinsk landsby i Ramallah-guvernementet, og vei 443, den israelske motorveien fra Modi'in til Jerusalem, går forbi den langs den gamle traseen."
  tl:
    - "Ang Beth-horon sa Ibaba ay ang mas mababa sa dalawang bayan ng Beth-horon sa tagaytay sa pagitan ng libis ng Ajalon at ng Gabaon, ang mas malapit sa kapatagan. Ito ang nayon ng Beit Ur al-Tahta, “ang mababang Beit Ur”, mga 400 m sa ibabaw ng dagat sa West Bank, mga 19 km sa hilagang-kanluran ng Jerusalem; ang Beth-horon sa Itaas, ang Beit Ur al-Fauqa, ay nakatayo 3 km pa sa itaas ng daan at mga 200 m na mas mataas. Ang bantog na pag-akyat at pagbaba sa Beth-horon, na ginamit nina Josue, Judas Macabeo at ng hukbong Romano, ay nasa pagitan ng dalawa."
    - "Pinangangalanan ng Biblia ang ibabang bayan kung saan gumuguhit ng hangganan at nagtatala ng kuta. Ang hangganan ng mga anak ni Jose ay “pababa sa dakong kalunuran sa hangganan ng mga Japhleteo, hanggang sa hangganan ng Beth-horon sa ibaba, hanggang sa Gezer”; ang hangganan ng Benjamin ay bumaba sa Ataroth-addar, “sa tabi ng bundok na dumudoon sa timugan ng Beth-horon sa ibaba”. Ayon sa may-akda ng Mga Cronica, si Seera, anak na babae ni Ephraim, ay “siyang nagtayo ng Bet-horon sa ibaba at sa itaas”. Sa mga itinayo ni Salomon, pagkatapos sunugin ni Faraon ang Gezer at ibigay bilang dote ng anak niya, “itinayo ni Salomon ang Gezer, at ang Beth-horon sa ibaba”, at idinaragdag ng Mga Cronica na ginawa niyang “mga bayang nakukutaan, na may mga kuta, mga pintuang-bayan, at mga halang” ang dalawang Beth-horon: binantayan ng ibabang bayan ang daang paakyat mula sa Gezer at sa baybayin."
    - "Hindi pa nahuhukay ang nayon. Ang mga pingas ng palayok na natagpuan doon ay umaabot sa Huling Panahon ng Tanso, mas maaga kaysa sa itaas na bayan; naitala ang isang yungib-libingan ng panahong Romano at ang guho ng isang kapilyang Bizantino, at matutunton pa sa ilang bahagi ang daang Romano paakyat sa itaas na bayan. Pinangangalanan ni Eusebio ang dalawang nayon nang magkasama, mga labindalawang milya mula sa Jerusalem. Ang Beit Ur al-Tahta ngayon ay nayong Palestino ng Ramallah Governorate, at ang Route 443, ang daanang Israeli mula Modi'in hanggang Jerusalem, ay dumaraan sa tabi nito sa sinaunang linya."
