# Overview article (ADR 0007). Mainstream facts only; written for the lower town alone, the pass and its battles being in the Beth-horon article; the archaeology is from surveys only, and is said so.
id: lower-beth-horon
place: a094036
title:
  en: "Lower Beth-horon"
  ru: "Нижний Беф-Орон"
  uk: "Нижній Бет-Хорон"
  es: "Bet-horón de Abajo"
  pt: "Bete-Horom de Baixo"
  de: "Unteres Bet-Horon"
  fr: "Beth-Horon la basse"
  it: "Bet-Oron di sotto"
  pl: "Dolny Bet-Choron"
  nl: "Neder-Beth-Horon"
