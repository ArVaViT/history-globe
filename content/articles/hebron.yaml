body:
  en:
    - "Hebron lies high in the hills of Judah, about 30 km south of Jerusalem, among springs and vineyards. The ancient town stood on the hill of Tel Rumeida: it was fortified in the Early Bronze Age, and in the Middle Bronze Age it was rebuilt as a city girded with massive walls. The Bible calls it Kiriath-arba in earlier times and says it was built seven years before Zoan in Egypt."
    - "In Genesis Abraham settles by the oaks of Mamre near Hebron and buys the cave of Machpelah from Ephron the Hittite to bury Sarah; Isaac and Jacob are later buried there too. After the conquest Hebron is given to Caleb. David was anointed king over Judah at Hebron and reigned there seven and a half years before he moved to Jerusalem, and Absalom began his revolt from it."
    - "Rehoboam counted Hebron among the fortified cities of Judah. Jar handles stamped for the king in the late eighth century BC bear its name as one of four places, a sign that it was a centre of royal administration. After the fall of Judah in 587 or 586 BC the south of the hills passed to Edomite settlers, the later Idumea, though Nehemiah's lists still place Judahites in Kiriath-arba. Judas Maccabeus took Hebron, pulled down its fortifications and burned its towers, and John Hyrcanus' conquest of Idumea in the late second century BC brought it under Hasmonean rule."
    - "The great stone enclosure that still stands over the cave of Machpelah is usually attributed to Herod the Great. In the war against Rome Simon bar Giora seized Hebron, and the Roman commander Cerialis then burned the town. Constantine ordered a basilica built at Mamre to end the pagan cult there, yet Sozomen, writing in the fifth century, describes a yearly fair there that drew Christians, Jews and pagans alike."
  ru:
    - "Хеврон лежит высоко в горах Иудеи, примерно в 30 км к югу от Иерусалима, среди источников и виноградников. Древний город стоял на холме Тель-Румейда: он был укреплён уже в раннем бронзовом веке, а в среднем бронзовом веке был отстроен заново и обнесён мощными стенами. Библия говорит, что прежде он назывался Кириаф-Арбы и был построен семью годами прежде египетского Цоана."
    - "В Книге Бытия Авраам селится у дубравы Мамре близ Хеврона и покупает у Ефрона Хеттеянина пещеру Махпелу, чтобы похоронить Сарру; позже там же погребены Исаак и Иаков. После завоевания Ханаана Хеврон получает Халев. В Хевроне Давид был помазан на царство над Иудой и царствовал здесь семь с половиной лет, прежде чем перейти в Иерусалим; отсюда же начал свой мятеж Авессалом."
    - "Ровоам включил Хеврон в число укреплённых городов Иудеи. На ручках кувшинов с царским клеймом конца VIII века до н. э. его имя стоит среди четырёх городов: здесь был центр царского управления. После падения Иудеи в 587 или 586 г. до н. э. юг нагорья заселили едомитяне, и край стал позднейшей Идумеей, хотя по спискам Неемии иудеи по-прежнему жили в Кириаф-Арбе. Иуда Маккавей взял Хеврон, срыл его укрепления и сжёг башни, а когда Иоанн Гиркан в конце II века до н. э. покорил Идумею, город перешёл под власть Хасмонеев."
    - "Огромную каменную ограду, которая и сейчас стоит над пещерой Махпелой, обычно приписывают Ироду Великому. В войне с Римом Хеврон захватил Симон бар Гиора, а затем римский военачальник Цериал сжёг город. Константин велел построить в Мамре базилику, чтобы положить конец языческому культу, но Созомен, писавший в V веке, рассказывает о ежегодной ярмарке у Мамре, куда сходились и христиане, и иудеи, и язычники."
  uk:
    - "Хеврон лежить високо в пагорбах Юди, приблизно за 30 км на південь від Єрусалима, серед джерел і виноградників. Давнє місто стояло на пагорбі Тель-Румейда: його було укріплено в ранньому бронзовому віці, а в середньому бронзовому віці його відбудовано як місто, оперезане масивними мурами. Біблія називає його в давніші часи Кір’ят-Арба й каже, що його збудовано за сім років перед Цоаном в Єгипті."
    - "У Книзі Буття Авраам оселяється біля дубів Мамре поблизу Хеврона й купує печеру Махпела в Ефрона Хетянина, щоб поховати Сарру; пізніше там поховані також Ісаак і Яків. Після завоювання Хеврон віддають Калебові. Давида було помазано царем над Юдою в Хевроні, і він царював там сім з половиною років, перш ніж переселився до Єрусалима, а Авесалом розпочав звідти своє повстання."
    - "Ровоам зарахував Хеврон до укріплених міст Юди. Ручки глеків з царськими печатками кінця VIII ст. до н. е. мають його назву як одного з чотирьох місць, що свідчить про те, що він був центром царського управління. Після падіння Юди 587 або 586 р. до н. е. південь пагорбів перейшов до едомських поселенців, пізнішої Ідумеї, хоча переліки Неемії ще розміщують юдеїв у Кір’ят-Арбі. Юда Макавей узяв Хеврон, зруйнував його укріплення й спалив його вежі, а завоювання Ідумеї Іваном Гірканом наприкінці II ст. до н. е. підпорядкувало його хасмонейській владі."
    - "Велику кам’яну огорожу, що досі стоїть над печерою Махпела, зазвичай приписують Іродові Великому. У війні проти Рима Симон бар-Гіора захопив Хеврон, а тоді римський командувач Цереаліс спалив місто. Костянтин наказав збудувати базиліку в Мамре, щоб покласти край поганському культові там, та Созомен, який писав у V ст., описує щорічний ярмарок там, що збирав християн, юдеїв і поган."
  es:
    - "Hebrón se halla en lo alto de las colinas de Judá, a unos 30 km al sur de Jerusalén, entre manantiales y viñedos. La antigua población se alzaba en la colina de Tel Rumeida: estuvo fortificada en la Edad del Bronce Antiguo, y en la Edad del Bronce Medio fue reconstruida como una ciudad ceñida por murallas macizas. La Biblia la llama Quiriat-arba en tiempos anteriores y dice que fue edificada siete años antes que Zoán en Egipto."
    - "En el Génesis Abraham se establece junto a las encinas de Mamre, cerca de Hebrón, y compra la cueva de Macpela a Efrón el hitita para sepultar a Sara; Isaac y Jacob son sepultados allí más tarde también. Tras la conquista Hebrón es dada a Caleb. David fue ungido rey de Judá en Hebrón y reinó allí siete años y medio antes de trasladarse a Jerusalén, y Absalón inició desde ella su rebelión."
    - "Roboam contó a Hebrón entre las ciudades fortificadas de Judá. Asas de jarras selladas para el rey a fines del siglo VIII a. C. llevan su nombre como uno de cuatro lugares, señal de que era un centro de administración real. Tras la caída de Judá en 587 o 586 a. C. el sur de las colinas pasó a colonos edomitas, la posterior Idumea, aunque las listas de Nehemías aún sitúan judaítas en Quiriat-arba. Judas Macabeo tomó Hebrón, derribó sus fortificaciones y quemó sus torres, y la conquista de Idumea por Juan Hircano a fines del siglo II a. C. la puso bajo dominio asmoneo."
    - "El gran recinto de piedra que aún se alza sobre la cueva de Macpela suele atribuirse a Herodes el Grande. En la guerra contra Roma, Simón bar Giora se apoderó de Hebrón, y el comandante romano Cerial quemó luego la ciudad. Constantino ordenó edificar una basílica en Mamre para acabar con el culto pagano allí, pero Sozomeno, que escribe en el siglo V, describe una feria anual que atraía por igual a cristianos, judíos y paganos."
  pt:
    - "Hebrom fica no alto das colinas de Judá, a cerca de 30 km ao sul de Jerusalém, entre fontes e vinhedos. A cidade antiga ficava na colina de Tel Rumeida: foi fortificada na Idade do Bronze Antigo e, no Bronze Médio, reconstruída como cidade cingida por muralhas maciças. A Bíblia a chama Quiriate-Arba em tempos antigos e diz que foi edificada sete anos antes de Zoã, no Egito."
    - "Em Gênesis, Abraão se estabelece junto aos carvalhos de Manre, perto de Hebrom, e compra a caverna de Macpela de Efrom, o heteu, para sepultar Sara; Isaque e Jacó são mais tarde sepultados ali também. Depois da conquista, Hebrom é dada a Calebe. Davi foi ungido rei sobre Judá em Hebrom e reinou ali sete anos e meio antes de se mudar para Jerusalém, e Absalão iniciou dali a sua revolta."
    - "Roboão contou Hebrom entre as cidades fortificadas de Judá. Alças de jarros carimbadas para o rei, do fim do século VIII a.C., trazem o seu nome como um dos quatro lugares, sinal de que era um centro da administração real. Depois da queda de Judá em 587 ou 586 a.C., o sul das colinas passou a colonos edomitas, a futura Iduméia, embora as listas de Neemias ainda situem judaítas em Quiriate-Arba. Judas Macabeu tomou Hebrom, derrubou suas fortificações e queimou suas torres, e a conquista da Iduméia por João Hircano no fim do século II a.C. a pôs sob domínio asmoneu."
    - "O grande recinto de pedra que ainda se ergue sobre a caverna de Macpela é usualmente atribuído a Herodes, o Grande. Na guerra contra Roma, Simão bar Giora se apoderou de Hebrom, e o comandante romano Cerial queimou então a cidade. Constantino mandou construir uma basílica em Manre para pôr fim ao culto pagão ali, mas Sozômeno, escrevendo no século V, descreve uma feira anual que atraía ali cristãos, judeus e pagãos igualmente."
  de:
    - "Hebron liegt hoch im Bergland Judas, etwa 30 km südlich von Jerusalem, zwischen Quellen und Weinbergen. Die antike Stadt stand auf dem Hügel Tel Rumeida: Sie war in der Frühbronzezeit befestigt, und in der Mittelbronzezeit wurde sie als von gewaltigen Mauern umgürtete Stadt neu gebaut. Die Bibel nennt sie früher Kirjat-Arba und sagt, sie sei sieben Jahre vor Zoan in Ägypten gebaut worden."
    - "Im ersten Buch Mose lässt sich Abraham bei den Eichen von Mamre nahe Hebron nieder und kauft von Efron dem Hethiter die Höhle Machpela, um Sara zu begraben; später werden auch Isaak und Jakob dort bestattet. Nach der Eroberung wird Hebron Kaleb gegeben. David wurde in Hebron zum König über Juda gesalbt und regierte dort siebeneinhalb Jahre, ehe er nach Jerusalem zog, und Absalom begann von dort aus seinen Aufstand."
    - "Rehabeam zählte Hebron zu den befestigten Städten Judas. Krughenkel mit dem Königsstempel aus dem späten 8. Jahrhundert v. Chr. tragen seinen Namen als einen von vier Orten, ein Zeichen, dass es ein Zentrum der königlichen Verwaltung war. Nach dem Fall Judas 587 oder 586 v. Chr. ging der Süden des Berglands an edomitische Siedler, das spätere Idumäa, obwohl Nehemias Listen noch Judäer in Kirjat-Arba nennen. Judas Makkabäus nahm Hebron ein, riss seine Befestigungen nieder und verbrannte seine Türme, und die Eroberung Idumäas durch Johannes Hyrkanos im späten 2. Jahrhundert v. Chr. brachte es unter hasmonäische Herrschaft."
    - "Die große Steinumfassung, die noch über der Höhle Machpela steht, wird gewöhnlich Herodes dem Großen zugeschrieben. Im Krieg gegen Rom besetzte Simon bar Giora Hebron, und der römische Befehlshaber Cerialis verbrannte dann die Stadt. Konstantin ließ in Mamre eine Basilika bauen, um den heidnischen Kult dort zu beenden, doch Sozomenos beschreibt im 5. Jahrhundert einen jährlichen Markt dort, der Christen, Juden und Heiden gleichermaßen anzog."
  fr:
    - "Hébron se trouve haut dans les collines de Juda, à environ 30 km au sud de Jérusalem, parmi les sources et les vignes. L’ancienne ville se dressait sur la colline de Tel Rumeida : elle fut fortifiée au Bronze ancien, et au Bronze moyen elle fut rebâtie comme une cité ceinte de murs massifs. La Bible l’appelle Kirjath-Arba aux temps anciens et dit qu’elle fut bâtie sept ans avant Tsoan en Égypte."
    - "Dans la Genèse, Abraham s’établit près des chênes de Mamré, près d’Hébron, et achète la caverne de Macpéla à Éphron le Héthien pour y enterrer Sara ; Isaac et Jacob y seront aussi enterrés plus tard. Après la conquête, Hébron est donnée à Caleb. David fut oint roi sur Juda à Hébron et y régna sept ans et demi avant de s’installer à Jérusalem, et Absalom commença sa révolte depuis cette ville."
    - "Roboam compta Hébron parmi les villes fortes de Juda. Des anses de jarres estampillées pour le roi à la fin du VIIIe siècle av. J.-C. portent son nom comme l’un de quatre lieux, signe qu’elle était un centre de l’administration royale. Après la chute de Juda en 587 ou 586 av. J.-C., le sud des collines passa à des colons édomites, l’Idumée ultérieure, bien que les listes de Néhémie placent encore des Judéens à Kirjath-Arba. Judas Maccabée prit Hébron, abattit ses fortifications et brûla ses tours, et la conquête de l’Idumée par Jean Hyrcan à la fin du IIe siècle av. J.-C. la plaça sous la domination hasmonéenne."
    - "La grande enceinte de pierre qui se dresse encore au-dessus de la caverne de Macpéla est d’ordinaire attribuée à Hérode le Grand. Dans la guerre contre Rome, Simon bar Giora s’empara d’Hébron, et le chef romain Cérialis brûla ensuite la ville. Constantin ordonna de bâtir une basilique à Mamré pour mettre fin au culte païen qui s’y tenait, mais Sozomène, écrivant au Ve siècle, y décrit une foire annuelle qui attirait chrétiens, Juifs et païens."
  pl:
    - "Hebron leży wysoko w górach Judy, około 30 km na południe od Jerozolimy, wśród źródeł i winnic. Dawne miasto stało na wzgórzu Tel Rumejda: było obwarowane we wczesnej epoce brązu, a w środkowej epoce brązu zostało odbudowane jako miasto opasane masywnymi murami. Biblia nazywa je dawniej Kiriat-Arba i mówi, że zbudowano je siedem lat przed Soan w Egipcie."
    - "W Księdze Rodzaju Abraham osiada przy dębach Mamre koło Hebronu i kupuje jaskinię Makpela od Efrona Chittyty, by pochować Sarę; Izaak i Jakub zostają tam później pochowani. Po podboju Hebron oddano Kalebowi. Dawid został namaszczony na króla Judy w Hebronie i panował tam siedem i pół roku, zanim przeniósł się do Jerozolimy, a Absalom rozpoczął z niego swój bunt."
    - "Roboam zaliczył Hebron do obwarowanych miast Judy. Uchwyty dzbanów z pieczęcią królewską z końca VIII w. p.n.e. noszą jego nazwę jako jednego z czterech miejsc, co świadczy, że był ośrodkiem administracji królewskiej. Po upadku Judy w 587 lub 586 r. p.n.e. południe gór przeszło w ręce osadników edomickich, późniejszej Idumei, choć wykazy Nehemiasza nadal umieszczają Judejczyków w Kiriat-Arba. Juda Machabeusz zdobył Hebron, zburzył jego umocnienia i spalił wieże, a podbój Idumei przez Jana Hirkana pod koniec II w. p.n.e. poddał go władzy hasmonejskiej."
    - "Wielkie kamienne ogrodzenie, które nadal stoi nad jaskinią Makpela, przypisuje się zwykle Herodowi Wielkiemu. W wojnie z Rzymem Szymon bar Giora zajął Hebron, a rzymski dowódca Cerialis spalił miasto. Konstantyn kazał zbudować bazylikę w Mamre, by zakończyć tamtejszy kult pogański, lecz Sozomen, pisząc w V w., opisuje coroczny jarmark, który przyciągał chrześcijan, Żydów i pogan."
  it:
    - "Ebron sorge in alto sui monti di Giuda, circa 30 km a sud di Gerusalemme, fra sorgenti e vigneti. L’antica città sorgeva sulla collina di Tel Rumeida: fu fortificata nel Bronzo Antico, e nel Bronzo Medio fu ricostruita come una città cinta da massicce mura. La Bibbia la chiama Kiriat-Arba in epoche precedenti e dice che fu costruita sette anni prima di Tanis in Egitto."
    - "Nella Genesi Abramo si stabilisce presso le querce di Mamre vicino a Ebron e compra la grotta di Macpela da Efron l’Ittita per seppellire Sara; più tardi vi sono sepolti anche Isacco e Giacobbe. Dopo la conquista Ebron è data a Caleb. Davide fu unto re di Giuda a Ebron e vi regnò sette anni e mezzo prima di trasferirsi a Gerusalemme, e Assalonne iniziò da lì la sua rivolta."
    - "Roboamo annoverò Ebron fra le città fortificate di Giuda. Manici di anfora bollati per il re alla fine dell’VIII secolo a.C. ne recano il nome come uno di quattro luoghi, segno che era un centro di amministrazione regia. Dopo la caduta di Giuda nel 587 o 586 a.C. il sud dei monti passò a coloni edomiti, la successiva Idumea, benché gli elenchi di Neemia collochino ancora Giudei a Kiriat-Arba. Giuda Maccabeo prese Ebron, ne abbatté le fortificazioni e ne bruciò le torri, e la conquista dell’Idumea da parte di Giovanni Ircano alla fine del II secolo a.C. la portò sotto il dominio asmoneo."
    - "Il grande recinto di pietra che si erge ancora sulla grotta di Macpela è di solito attribuito a Erode il Grande. Nella guerra contro Roma Simone bar Giora si impadronì di Ebron, e il comandante romano Cereale bruciò poi la città. Costantino ordinò di costruire una basilica a Mamre per porre fine al culto pagano, eppure Sozomeno, scrivendo nel V secolo, descrive una fiera annuale che attirava cristiani, giudei e pagani."
  nl:
    - "Hebron ligt hoog in het bergland van Juda, ongeveer 30 km ten zuiden van Jeruzalem, tussen bronnen en wijngaarden. De oude stad stond op de heuvel Tel Rumeida: zij was in de Vroege Bronstijd versterkt, en in de Midden-Bronstijd werd zij herbouwd als een stad omgord met massieve muren. De Bijbel noemt haar vroeger Kirjat-Arba en zegt dat zij zeven jaar vóór Zoan in Egypte was gebouwd."
    - "In Genesis vestigt Abraham zich bij de eiken van Mamre bij Hebron en koopt van Efron de Hethiet de grot van Machpela om Sara te begraven; later worden ook Isaak en Jakob daar begraven. Na de verovering wordt Hebron aan Kaleb gegeven. David werd in Hebron tot koning over Juda gezalfd en regeerde er zeven en een half jaar voordat hij naar Jeruzalem verhuisde, en Absalom begon zijn opstand vanuit de stad."
    - "Rehabeam rekende Hebron tot de versterkte steden van Juda. Kruikhenkels met de koninklijke stempel uit de late 8e eeuw v.Chr. dragen de naam als een van vier plaatsen, een teken dat het een centrum van koninklijk bestuur was. Na de val van Juda in 587 of 586 v.Chr. ging het zuiden van het bergland over naar Edomitische kolonisten, het latere Idumea, al plaatsen Nehemia’s lijsten nog Judeeërs in Kirjat-Arba. Judas Makkabeüs nam Hebron in, brak zijn vestingwerken af en verbrandde zijn torens, en Johannes Hyrcanus’ verovering van Idumea aan het eind van de 2e eeuw v.Chr. bracht het onder Hasmoneïsch gezag."
    - "De grote stenen omheining die nog boven de grot van Machpela staat, wordt gewoonlijk aan Herodes de Grote toegeschreven. In de oorlog tegen Rome nam Simon bar Giora Hebron in, en de Romeinse bevelhebber Cerialis verbrandde daarna de stad. Constantijn liet een basiliek bij Mamre bouwen om een eind te maken aan de heidense eredienst daar, maar Sozomenos beschrijft in de 5e eeuw een jaarlijkse markt daar die christenen, Joden en heidenen aantrok."
  cs:
    - "Hebron leží vysoko v judských horách, asi 30 km jižně od Jeruzaléma, mezi prameny a vinicemi. Staré město stálo na pahorku Tel Rumejda: bylo opevněno v rané době bronzové a ve střední době bronzové bylo přestavěno jako město obehnané mohutnými hradbami. Bible jej nazývá dříve Kirjat-arba a říká, že bylo vystavěno sedm let před Coanem v Egyptě."
    - "V Genesis se Abraham usazuje u dubů Mamre poblíž Hebronu a kupuje od Efróna Chetejského jeskyni Makpela, aby pohřbil Sáru; později jsou tam pohřbeni i Izák a Jákob. Po dobytí je Hebron dán Kálebovi. David byl v Hebronu pomazán králem nad Judou a kraloval tam sedm a půl roku, než se přestěhoval do Jeruzaléma, a Abšalom z něj zahájil svou vzpouru."
    - "Rechabeám počítal Hebron mezi opevněná města Judy. Držadla džbánů s razítkem pro krále z konce 8. stol. př. n. l. nesou jeho jméno jako jedno ze čtyř míst, což je znamení, že byl střediskem královské správy. Po pádu Judy roku 587 nebo 586 př. n. l. přešel jih hor na edómské osadníky, pozdější Idumeu, ačkoli Nehemjášovy seznamy dosud kladou Judovce do Kirjat-arba. Juda Makabejský dobyl Hebron, zbořil jeho opevnění a spálil jeho věže, a dobytí Idumeje Janem Hyrkánem koncem 2. stol. př. n. l. je přivedlo pod hasmonejskou vládu."
    - "Velká kamenná ohrada, která dosud stojí nad jeskyní Makpela, se obvykle připisuje Herodovi Velikému. Ve válce proti Římu zmocnil se Hebronu Šimon bar Giora a římský velitel Cerialis pak město spálil. Konstantin nařídil postavit v Mamre baziliku, aby ukončil tamní pohanský kult, přesto Sozomenos v 5. století popisuje každoroční trh, který tam přitahoval křesťany, Židy i pohany."
  sv:
    - "Hebron ligger högt i Judas berg, omkring 30 km söder om Jerusalem, bland källor och vingårdar. Den antika staden stod på kullen Tel Rumeida: den befästes under tidig bronsålder, och under mellanbronsåldern byggdes den upp på nytt som en stad omgjordad av massiva murar. Bibeln kallar den tidigare Kirjat-Arba och säger att den byggdes sju år före Soan i Egypten."
    - "I Första Moseboken slår Abraham sig ned vid Mamres terebintlund nära Hebron och köper grottan i Makpela av hetiten Efron för att begrava Sara; Isak och Jakob begravs senare där också. Efter erövringen ges Hebron till Kalev. David smordes till kung över Juda i Hebron och regerade där i sju och ett halvt år innan han flyttade till Jerusalem, och Absalom inledde sitt uppror därifrån."
    - "Rehabeam räknade Hebron bland Judas befästa städer. Krukhandtag stämplade för kungen sent på 700-talet f.Kr. bär dess namn som ett av fyra, ett tecken på att den var ett centrum för kunglig förvaltning. Efter Judas fall 587 eller 586 f.Kr. övergick södra bergen till edomitiska nybyggare, det senare Idumeen, fast Nehemjas förteckningar ännu placerar judéer i Kirjat-Arba. Judas mackabeen intog Hebron, rev dess befästningar och brände dess torn, och Johannes Hyrkanos erövring av Idumeen sent på 100-talet f.Kr. förde den under hasmoneiskt styre."
    - "Den stora stenomgärdningen som ännu står över grottan i Makpela tillskrivs vanligen Herodes den store. I kriget mot Rom intog Simon bar Giora Hebron, och den romerske befälhavaren Cerialis brände sedan staden. Konstantin lät bygga en basilika vid Mamre för att få ett slut på den hedniska kulten där, men Sozomenos, som skrev på 400-talet, beskriver en årlig marknad där som drog kristna, judar och hedningar lika."
  nb:
    - "Hebron ligger høyt i Judas åser, omtrent 30 km sør for Jerusalem, blant kilder og vingårder. Den gamle byen sto på høyden Tel Rumeida: den var befestet i tidlig bronsealder, og i mellombronsealder ble den gjenoppbygd som en by omgitt av massive murer. Bibelen kaller den Kirjat-Arba i tidligere tider og sier at den var «bygget syv år før Soan i Egypten»."
    - "I Første Mosebok slår Abraham seg ned ved Mamres terebintelund nær Hebron og kjøper Makpela-hulen av hetitten Efron for å begrave Sara; Isak og Jakob blir senere også gravlagt der. Etter erobringen gis Hebron til Kaleb. David ble salvet til konge over Juda i Hebron og regjerte der i sju og et halvt år før han flyttet til Jerusalem, og Absalom begynte sitt opprør fra den."
    - "Rehabeam regnet Hebron blant Judas befestede byer. Krukkehanker stemplet for kongen sent på 700-tallet f.Kr. bærer dens navn som ett av fire steder, et tegn på at den var et sentrum for kongelig administrasjon. Etter Judas fall i 587 eller 586 f.Kr. gikk den sørlige delen av åsene til edomittiske nybyggere, det senere Idumea, selv om Nehemjas lister fortsatt plasserer judeere i Kirjat-Arba. Judas Makkabeus tok Hebron, rev ned dens festningsverker og brente tårnene, og Johannes Hyrkans erobring av Idumea sent på 100-tallet f.Kr. brakte den under hasmoneisk styre."
    - "Den store steininngjerdingen som fortsatt står over Makpela-hulen, tilskrives vanligvis Herodes den store. I krigen mot Roma inntok Simon bar Giora Hebron, og den romerske sjefen Cerialis brente så byen. Konstantin beordret bygd en basilika ved Mamre for å få slutt på den hedenske kulten der, men Sozomenos, som skrev på 400-tallet, beskriver et årlig marked der som trakk kristne, jøder og hedninger like mye."
  tl:
    - "Ang Hebron ay nasa mataas na bahagi ng mga burol ng Juda, mga 30 km sa timog ng Jerusalem, sa gitna ng mga bukal at ubasan. Ang sinaunang bayan ay nakatayo sa burol ng Tel Rumeida: pinatibay ito sa Maagang Panahon ng Tanso, at sa Gitnang Panahon ng Tanso ay itinayong muli bilang lungsod na may napakalaking pader. Tinatawag ito ng Biblia na Chiriath-arba noong mas maaga at sinasabing itinayo ito pitong taon bago ang Zoan sa Egipto."
    - "Sa Genesis ay nanirahan si Abraham sa tabi ng mga encina ng Mamre malapit sa Hebron at binili ang yungib ng Macpela kay Ephron na Hetheo upang ilibing si Sara; inilibing din doon kalaunan sina Isaac at Jacob. Pagkatapos ng pananakop ay ibinigay ang Hebron kay Caleb. Pinahiran ng langis si David bilang hari sa Juda sa Hebron at naghari roon nang pitong taon at kalahati bago lumipat sa Jerusalem, at doon nagsimula si Absalom ng kaniyang paghihimagsik."
    - "Binilang ni Roboam ang Hebron sa mga nakukutaang lungsod ng Juda. Ang mga hawakan ng banga na tinatakan para sa hari sa huling bahagi ng ika-8 siglo BK ay may pangalan nito bilang isa sa apat na lugar, tanda na ito ay sentro ng pamamahalang maharlika. Pagkatapos ng pagbagsak ng Juda noong 587 o 586 BK ang timog ng mga burol ay napunta sa mga nanirahang Edomita, ang kalaunang Idumea, bagaman inilalagay pa rin ng mga talaan ni Nehemias ang mga Judeano sa Chiriath-arba. Sinakop ni Judas Macabeo ang Hebron, giniba ang mga kuta nito at sinunog ang mga moog, at ang pananakop ni Juan Hyrcanus sa Idumea sa huling bahagi ng ika-2 siglo BK ay nagdala dito sa ilalim ng pamamahalang Hasmoneo."
    - "Ang malaking batong bakuran na nakatayo pa rin sa ibabaw ng yungib ng Macpela ay karaniwang iniuugnay kay Herodes na Dakila. Sa digmaan laban sa Roma ay sinakop ni Simon bar Giora ang Hebron, at sinunog ng kumander Romano na si Cerialis ang bayan. Iniutos ni Constantino ang pagtatayo ng isang basilika sa Mamre upang wakasan ang paganong pagsamba roon, ngunit inilalarawan ni Sozomen, na sumulat noong ika-5 siglo, ang taunang perya roon na umakit sa mga Kristiyano, Judio at pagano."
  da:
    - "Hebron ligger højt i Judas bjerge, omkring 30 km syd for Jerusalem, blandt kilder og vingårde. Den gamle by stod på højen Tel Rumeida: den var befæstet i den tidlige bronzealder, og i mellembronzealderen blev den genopbygget som en by omgjordet af massive mure. Bibelen kalder den Kirjat-Arba i tidligere tid og siger, at den blev bygget syv år før Soan i Egypten."
    - "I Første Mosebog bosætter Abraham sig ved Mamres egetræer nær Hebron og køber Makpela-hulen af hetitten Efron for at begrave Sara; Isak og Jakob bliver senere begravet der også. Efter erobringen gives Hebron til Kaleb. David blev salvet til konge over Juda i Hebron og regerede dér i syv og et halvt år, før han flyttede til Jerusalem, og Absalon begyndte sit oprør derfra."
    - "Rehabeam regnede Hebron blandt Judas befæstede byer. Krukkehanke stemplet til kongen sent i 700-tallet f.Kr. bærer dens navn som et af fire steder, et tegn på, at den var et centrum for kongelig administration. Efter Judas fald i 587 eller 586 f.Kr. gik bjergenes syd over til edomitiske bosættere, det senere Idumæa, skønt Nehemias' lister stadig placerer judæere i Kirjat-Arba. Judas Makkabæus indtog Hebron, nedrev dens befæstninger og brændte dens tårne, og Johannes Hyrkanos' erobring af Idumæa sent i 2. århundrede f.Kr. bragte den under hasmonæisk styre."
    - "Den store stenindhegning, der stadig står over Makpela-hulen, tilskrives sædvanligvis Herodes den Store. I krigen mod Rom indtog Simon bar Giora Hebron, og den romerske kommandant Cerialis brændte derefter byen. Konstantin lod en basilika bygge ved Mamre for at gøre ende på den hedenske kult dér, men Sozomenos beskriver i 400-tallet et årligt marked dér, som tiltrak kristne, jøder og hedninger lige så godt."
  sr:
    - "Хеврон лежи високо у јудејским брдима, око 30 км јужно од Јерусалима, међу изворима и виноградима. Древни град стајао је на брду Тел Румејда: утврђен је у раном бронзаном добу, а у средњем бронзаном добу обновљен је као град опасан масивним зидинама. Библија га у ранија времена зове Киријат-Арба и каже да је саграђен седам година пре Соана у Египту."
    - "У Постању се Аврам насељава код храстова Мамрије близу Хеврона и купује пећину Макпелу од Ефрона Хетејина да сахрани Сару; Исак и Јаков су касније такође ту сахрањени. После освајања Хеврон је дат Халеву. Давид је помазан за цара над Јудом у Хеврону и ту је царевао седам и по година пре него што се преселио у Јерусалим, а Авесалом је из њега започео своју побуну."
    - "Ровоам је убројао Хеврон међу утврђене градове Јуде. Дршке крчага жигосане за цара из касног осмог века п. н. е. носе његово име као једно од четири места, знак да је био средиште краљевске управе. После пада Јуде 587. или 586. п. н. е. југ брда прешао је на едомске досељенике, каснију Идумеју, мада Немијини списци још смештају Јудејце у Киријат-Арбу. Јуда Макавејац узео је Хеврон, срушио његове утврде и спалио његове куле, а освајање Идумеје Јована Хиркана крајем другог века п. н. е. довело га је под хасмонејску власт."
    - "Велику камену ограду која још стоји над пећином Макпеле обично приписују Ироду Великом. У рату против Рима Симон бар Гиора запосео је Хеврон, а римски заповедник Церијал затим је спалио град. Константин је наредио да се сагради базилика у Мамрији да би се окончао незнабожачки култ тамо, а ипак Созомен, пишући у петом веку, описује годишњи сајам који је привлачио хришћане, Јевреје и незнабошце подједнако."
  hu:
    - "Hebron Júda hegyei között magasan fekszik, Jeruzsálemtől mintegy 30 km-re délre, források és szőlőültetvények között. Az ókori város a Tel Rumejda dombján állt: a kora bronzkorban megerősítették, a középső bronzkorban pedig masszív falakkal övezett városként építették újjá. A Biblia korábban Kirját-Arbának nevezi, és azt mondja, hogy hét évvel Cóán előtt építették Egyiptomban."
    - "A Teremtés könyvében Ábrahám a hebroni Mamré tölgyesénél telepszik le, és megvásárolja Makpéla barlangját a hettita Efróntól Sára eltemetésére; Izsákot és Jákóbot később szintén ott temetik el. A hódítás után Hebron Kálebé lesz. Dávidot Hebronban kenték fel Júda királyává, és hét és fél évig uralkodott ott, mielőtt Jeruzsálembe költözött, Absolon pedig innen indította lázadását."
    - "Roboám Hebront Júda megerősített városai között számolta. A Kr. e. 8. század végi, a király számára lepecsételt korsófülek négy hely egyikeként viselik a nevét, a királyi közigazgatás központjának jeleként. Júda Kr. e. 587 vagy 586-os bukása után a hegyek déli része edomita telepesek kezére került, a későbbi Idumeához, bár Nehémiás jegyzékei Júda fiait még Kirját-Arbában helyezik el. Júdás Makkabeus elfoglalta Hebront, lerombolta erődítményeit és felégette tornyait, János Hürkanosz Kr. e. 2. század végi idumeai hódítása pedig hasmóneus uralom alá hozta."
    - "A Makpéla barlangja fölött ma is álló nagy kőkerítést rendszerint Nagy Heródesnek tulajdonítják. A Róma elleni háborúban Simon bar Giora elfoglalta Hebront, majd a római parancsnok, Cerialis felégette a várost. Constantinus bazilikát építtetett Mamrénál, hogy véget vessen az ottani pogány kultusznak, ám Szozomenosz az 5. században egy ottani évi vásárról számol be, amely keresztényeket, zsidókat és pogányokat egyaránt odavonzott."
  fi:
    - "Hebron sijaitsee korkealla Juudan kukkuloilla noin 30 km Jerusalemista etelään lähteiden ja viinitarhojen keskellä. Muinainen kaupunki sijaitsi Tel Rumeidan kukkulalla: se linnoitettiin varhaispronssikaudella, ja keskipronssikaudella se rakennettiin uudelleen massiivisten muurien ympäröimäksi kaupungiksi. Raamattu kutsuu sitä aiemmin nimellä Kirjat-Arba ja sanoo sen rakennetun seitsemän vuotta ennen Soania Egyptissä."
    - "Genesiksessä Abraham asettuu Mamren tammien luo Hebronin lähelle ja ostaa Makpelan luolan heettiläiseltä Efronilta haudatakseen Saaran; Iisak ja Jaakob haudataan myöhemmin myös sinne. Valloituksen jälkeen Hebron annetaan Kalebille. Daavid voideltiin Juudan kuninkaaksi Hebronissa ja hallitsi siellä seitsemän ja puoli vuotta ennen siirtymistään Jerusalemiin, ja Absalom aloitti kapinansa sieltä."
    - "Rehabeam luki Hebronin Juudan linnoitettuihin kaupunkeihin. Kuninkaalle leimatut ruukunkorvat 700-luvun lopulta eaa. kantavat sen nimeä yhtenä neljästä paikasta, merkkinä siitä, että se oli kuninkaallisen hallinnon keskus. Juudan kaaduttua vuonna 587 tai 586 eaa. vuoriston etelä siirtyi edomilaisille asukkaille, myöhemmälle Idumealle, vaikka Nehemian luettelot sijoittavat vielä juudalaisia Kirjat-Arbaan. Juudas Makkabeus valloitti Hebronin, purki sen linnoitukset ja poltti sen tornit, ja Johannes Hyrkanoksen Idumean valloitus 100-luvun eaa. lopulla toi sen hasmonealaisen vallan alle."
    - "Suuri kivinen aitaus, joka seisoo yhä Makpelan luolan päällä, liitetään yleensä Herodes Suureen. Rooman vastaisessa sodassa Simon bar Giora valtasi Hebronin, ja roomalainen komentaja Cerialis poltti sitten kaupungin. Konstantinus käski rakentaa basilikan Mamreen lopettamaan siellä olleen pakanallisen palvonnan, mutta 400-luvulla kirjoittava Sozomenos kuvaa siellä vuosittaista markkinaa, joka veti puoleensa kristittyjä, juutalaisia ja pakanoita yhtä lailla."
  vi:
    - "Hếp-rôn nằm cao trong các đồi Giu-đa, cách Giê-ru-sa-lem khoảng 30 km về phía nam, giữa các suối và vườn nho. Thành cổ đứng trên đồi Tel Rumeida: được củng cố vào thời Đồ Đồng Sớm, và vào thời Đồ Đồng Giữa được xây lại thành một thành có tường đồ sộ bao quanh. Kinh Thánh gọi là Ki-ri-át-A-ra-ba thời trước và nói thành được xây bảy năm trước Xô-an ở Ê-díp-tô."
    - "Trong Sáng Thế Ký, Áp-ra-ham định cư bên những cây sồi Mam-rê gần Hếp-rôn và mua hang Mặc-bê-la từ Ép-rôn người Hê-tít để chôn Sa-ra; Y-sác và Gia-cốp về sau cũng được chôn ở đó. Sau cuộc chinh phục, Hếp-rôn được ban cho Ca-lép. Đa-vít được xức dầu làm vua Giu-đa tại Hếp-rôn và trị vì ở đó bảy năm rưỡi trước khi dời đến Giê-ru-sa-lem, và Áp-sa-lôm bắt đầu cuộc nổi loạn từ đó."
    - "Rô-bô-am kể Hếp-rôn trong các thành kiên cố của Giu-đa. Các quai bình đóng dấu cho nhà vua vào cuối thế kỷ 8 TCN mang tên thành như một trong bốn nơi, dấu hiệu rằng đó là trung tâm hành chính hoàng gia. Sau khi Giu-đa sụp đổ năm 587 hoặc 586 TCN, miền nam của các đồi chuyển sang những người Ê-đôm định cư, Y-đu-mê sau này, dù các bảng kê của Nê-hê-mi vẫn đặt người Giu-đa ở Ki-ri-át-A-ra-ba. Giu-đa Maccabee chiếm Hếp-rôn, phá các công sự và đốt các tháp, và cuộc chinh phục Y-đu-mê của Giăng Hyrcanus vào cuối thế kỷ 2 TCN đặt thành dưới quyền Hasmonean."
    - "Vòng tường đá lớn vẫn đứng trên hang Mặc-bê-la thường được gán cho Hê-rốt Đại đế. Trong cuộc chiến chống La Mã, Si-môn bar Giora chiếm Hếp-rôn, rồi chỉ huy La Mã Cerialis đốt thành. Constantine ra lệnh xây một thánh đường ở Mam-rê để chấm dứt sự thờ cúng ngoại giáo ở đó, nhưng Sozomen, viết vào thế kỷ 5, mô tả một hội chợ hằng năm ở đó thu hút cả Cơ Đốc nhân, người Do Thái và người ngoại giáo."
  ro:
    - "Hebronul se află sus, în dealurile lui Iuda, la circa 30 km spre sud de Ierusalim, printre izvoare și vii. Orașul antic se afla pe dealul Tel Rumeida: a fost fortificat în Bronzul Timpuriu, iar în Bronzul Mijlociu a fost reconstruit ca oraș încins cu ziduri masive. Biblia îl numește Chiriat-Arba în vremurile mai vechi și spune că a fost zidit cu șapte ani înaintea Țoanului din Egipt."
    - "În Geneza, Avraam se așază lângă stejarii din Mamre, lângă Hebron, și cumpără peștera Macpela de la Efron heteul ca să o îngroape pe Sara; Isaac și Iacov sunt îngropați și ei acolo mai târziu. După cucerire, Hebronul este dat lui Caleb. David a fost uns rege peste Iuda la Hebron și a domnit acolo șapte ani și jumătate înainte de a se muta la Ierusalim, iar Absalom și-a început răscoala de aici."
    - "Roboam a numărat Hebronul printre cetățile întărite ale lui Iuda. Toarte de vase ștampilate pentru rege la sfârșitul secolului al VIII-lea î.Hr. poartă numele lui ca unul din patru locuri, semn că era un centru al administrației regale. După căderea lui Iuda, în 587 sau 586 î.Hr., sudul dealurilor a trecut la coloniști edomiți, viitoarea Idumeea, deși listele lui Neemia îi mai plasează pe iudei în Chiriat-Arba. Iuda Macabeul a luat Hebronul, i-a dărâmat fortificațiile și i-a ars turnurile, iar cucerirea Idumeei de către Ioan Hircan, la sfârșitul secolului al II-lea î.Hr., l-a adus sub stăpânire hasmoneană."
    - "Marea incintă de piatră care se mai ridică deasupra peșterii Macpela este atribuită de obicei lui Irod cel Mare. În războiul împotriva Romei, Simon bar Giora a pus stăpânire pe Hebron, iar comandantul roman Cerialis a ars apoi orașul. Constantin a poruncit să se construiască o bazilică la Mamre pentru a pune capăt cultului păgân de acolo, dar Sozomen, scriind în secolul al V-lea, descrie un iarmaroc anual care atrăgea acolo deopotrivă creștini, iudei și păgâni."
  bg:
    - "Хеврон лежи високо в Юдейските хълмове, на около 30 км южно от Йерусалим, сред извори и лозя. Древният град стоеше на хълма Тел Румейда: той е бил укрепен през ранната бронзова епоха, а през средната бронзова епоха е съграден отново като град, опасан с масивни стени. Библията го нарича в по-ранните времена Кириат-Арба и казва, че е бил съграден седем години преди Цоан в Египет."
    - "В Битие Авраам се заселва при дъбовете на Мамре близо до Хеврон и купува пещерата Махпела от хетееца Ефрон, за да погребе Сара; по-късно там са погребани и Исаак и Яков. След завоеванието Хеврон е даден на Халев. Давид беше помазан за цар над Юда в Хеврон и царува там седем години и половина, преди да се премести в Йерусалим, а Авесалом започна бунта си оттам."
    - "Ровоам брои Хеврон сред укрепените градове на Юда. Дръжки на делви с царски печат от края на VIII в. пр.н.е. носят името му като едно от четири места — знак, че той е бил център на царската администрация. След падането на Юда през 587 или 586 г. пр.н.е. югът на хълмовете премина към едомски заселници, по-късната Идумея, макар списъците на Неемия още да поставят юдеи в Кириат-Арба. Юда Макавей превзе Хеврон, събори укрепленията му и изгори кулите му, а завоеванието на Идумея от Йоан Хиркан в края на II в. пр.н.е. го постави под хасмонейска власт."
    - "Голямата каменна ограда, която и днес стои над пещерата Махпела, обикновено се приписва на Ирод Велики. Във войната срещу Рим Симон бар Гиора завзе Хеврон, а римският военачалник Цериалис след това изгори града. Константин заповяда да се построи базилика в Мамре, за да се сложи край на езическия култ там, но Созомен, писал през V в., описва ежегоден панаир там, който привличал еднакво християни, юдеи и езичници."
