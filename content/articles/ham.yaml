body:
  en:
    - "“The land of Ham” is a poetic name for Egypt, used only in the Psalms. Ham was the second named of the three sons of Noah, and in the table of nations “the sons of Ham” are “Cush, and Mizraim, and Phut, and Canaan”, that is Nubia, Egypt, Libya and Canaan: the peoples of the south and of the Nile. Egypt is Mizraim everywhere else in the Bible; the psalmists, telling the story of the Exodus, reach for the ancestor's name instead. Whether the word is connected with Kemet, “the black land”, the Egyptians' own name for their country, has long been suggested and is not proved."
    - "Psalm 78 recalls the last plague, when God “smote all the firstborn in Egypt; the chief of their strength in the tabernacles of Ham”. Psalm 105 tells how “Israel also came into Egypt; and Jacob sojourned in the land of Ham”, and how Moses and Aaron “shewed his signs among them, and wonders in the land of Ham”; Psalm 106 remembers the people forgetting God, who had done “Wondrous works in the land of Ham, and terrible things by the Red sea”. In the Russian Synodal Bible these are Psalms 77, 104 and 105, after the Greek numbering. Chronicles also says of the Simeonites who moved to Gedor that “they of Ham had dwelt there of old”, a settled people of Hamite stock in the south of Canaan."
    - "The land of Ham is today simply Egypt, the Nile valley and the Delta; the name survives only in the psalms, where it is Egypt seen from Israel's side, the house of bondage from which the people were brought out."
  ru:
    - "«Земля Хамова» — поэтическое имя Египта, встречающееся только в Псалтири. Хам назван вторым из трёх сыновей Ноя, и в таблице народов «Сыны Хама: Хуш, Мицраим, Фут и Ханаан», то есть Нубия, Египет, Ливия и Ханаан — народы юга и Нила. Во всех прочих местах Библии Египет зовётся Мицраимом; псалмопевцы, пересказывая исход, берут вместо этого имя предка. Связано ли слово с Кемет, «чёрной землёй», как сами египтяне звали свою страну, давно предполагают, но не доказано."
    - "Псалом 77 вспоминает последнюю казнь, когда Бог «поразил всякого первенца в Египте, начатки сил в шатрах Хамовых». Псалом 104 рассказывает, как «пришел Израиль в Египет, и переселился Иаков в землю Хамову», и как Моисей и Аарон «показали между ними слова знамений Его и чудеса Его в земле Хамовой»; псалом 105 напоминает, как народ забыл Бога, сотворившего «дивное в земле Хамовой, страшное у Чермного моря». В еврейской Библии и в западных переводах это псалмы 78, 105 и 106. Паралипоменон говорит также о Симеонитах, перешедших к Гедору, что до них там жило «немного Хамитян», — оседлый народ Хамова рода на юге Ханаана."
    - "Земля Хамова сегодня — просто Египет, долина и дельта Нила; имя живёт только в псалмах, где это Египет, увиденный глазами Израиля, дом рабства, из которого был выведен народ."
  uk:
    - "«Земля Хамова» — поетична назва Єгипту, вживана лише в Псалмах. Хам названий другим із трьох синів Ноя, і в переліку народів «сини Хамові» — «Куш та Мизраїм, да Фут, да Канаан», тобто Нубія, Єгипет, Лівія і Ханаан: народи півдня й Нілу. Скрізь в іншому місці Біблії Єгипет — Міцраім; псалмоспівці, розповідаючи історію Виходу, натомість беруться за ім’я прабатька. Чи пов’язане це слово з Кемет, «чорною землею», власною назвою Єгипту у самих єгиптян, давно припускають, але не доведено."
    - "Псалом 78 згадує останню кару, коли Бог «побив всїх первороднїв в Египтї, первенцїв сили у Хамових шатрах». Псалом 105 розповідає, як «Прийшов Ізраїль до Египту, і Яков осївся в землї Хама», і як Мойсей та Аарон «творили між ними знамена його і чудеса в землї Хамовій»; Псалом 106 згадує, як народ забув Бога, що чинив «Чудеса в країнї Хама, страшне дїло на Червоному морі». У російській Синодальній Біблії це псалми 77, 104 і 105 за грецькою нумерацією. Хроніки також кажуть про симеонітів, які переселилися до Гедора, що до їхнього приходу «жило там тільки трохи Хомитян», осілий народ хамітського роду на півдні Ханаану."
    - "Земля Хамова сьогодні — просто Єгипет, долина Нілу й дельта; назва зберігається лише в псалмах, де це Єгипет, побачений з боку Ізраїлю, дім неволі, з якого вивели народ."
  es:
    - "«La tierra de Cam» es un nombre poético de Egipto, usado solo en los Salmos. Cam es el segundo nombrado de los tres hijos de Noé, y en la tabla de las naciones «los hijos de Châm» son «Cush, y Mizraim, y Phut, y Canaán», es decir, Nubia, Egipto, Libia y Canaán: los pueblos del sur y del Nilo. En todos los demás lugares de la Biblia Egipto es Mizraim; los salmistas, al contar la historia del Éxodo, recurren en cambio al nombre del antepasado. Desde hace tiempo se ha sugerido, sin probarse, que la palabra esté relacionada con Kemet, «la tierra negra», el nombre que los egipcios daban a su propio país."
    - "El Salmo 78 recuerda la última plaga, cuando Dios «hirió á todo primogénito en Egipto, las primicias de las fuerzas en las tiendas de Châm». El Salmo 105 cuenta cómo «Después entró Israel en Egipto, y Jacob fué extranjero en la tierra de Châm», y cómo Moisés y Aarón pusieron en ellos «las palabras de sus señales, y sus prodigios en la tierra de Châm»; el Salmo 106 recuerda al pueblo olvidando a Dios, que había hecho «Maravillas en la tierra de Châm, cosas formidables sobre el mar Bermejo». En la Biblia sinodal rusa estos son los salmos 77, 104 y 105, según la numeración griega. Crónicas dice también de los simeonitas que se trasladaron a Gedor que «los de Châm la habitaban de antes», un pueblo sedentario de estirpe camita en el sur de Canaán."
    - "La tierra de Cam es hoy simplemente Egipto, el valle del Nilo y el delta; el nombre pervive solo en los salmos, donde es Egipto visto desde el lado de Israel, la casa de servidumbre de la que fue sacado el pueblo."
  pt:
    - "“A terra de Cam” é um nome poético para o Egito, usado apenas nos Salmos. Cam é o segundo nomeado dos três filhos de Noé, e na tabela das nações “Os filhos de Cam foram: Cuxe, Mizraim, Pute e Canaã”, isto é, Núbia, Egito, Líbia e Canaã: os povos do sul e do Nilo. O Egito é Mizraim em todo o resto da Bíblia; os salmistas, ao contar a história do Êxodo, recorrem ao nome do antepassado. Se a palavra está ligada a Kemet, “a terra negra”, o nome que os próprios egípcios davam ao seu país, é algo há muito sugerido e não provado."
    - "O Salmo 78 recorda a última praga, quando Deus “feriu todos os primogênitos no Egito, as primícias da sua força nas tendas de Cam”. O Salmo 105 conta como “Israel também foi para o Egito. Jacó habitou na terra de Cam”, e como Moisés e Arão realizaram “milagres entre eles, e maravilhas na terra de Cam”; o Salmo 106 recorda o povo esquecendo Deus, que fizera “obras maravilhosas na terra de Cam, e coisas temíveis junto ao Mar Vermelho”. Na Bíblia Sinodal russa são os Salmos 77, 104 e 105, segundo a numeração grega. Crônicas diz também dos simeonitas que se mudaram para Gedor que “os que moravam lá antes eram descendentes de Cam”, um povo sedentário de estirpe camita no sul de Canaã."
    - "A terra de Cam é hoje simplesmente o Egito, o vale do Nilo e o Delta; o nome sobrevive apenas nos salmos, onde é o Egito visto do lado de Israel, a casa de servidão da qual o povo foi tirado."
  de:
    - "„Das Land Hams“ ist ein dichterischer Name für Ägypten, nur in den Psalmen gebraucht. Ham ist der an zweiter Stelle genannte der drei Söhne Noahs, und in der Völkertafel sind „die Kinder von Ham“: „Chus, Mizraim, Put und Kanaan“, das heißt Nubien, Ägypten, Libyen und Kanaan, die Völker des Südens und des Nils. Ägypten heißt sonst überall in der Bibel Mizraim; die Psalmisten greifen bei der Erzählung vom Auszug stattdessen zum Namen des Stammvaters. Ob das Wort mit Kemet, „dem schwarzen Land“, dem ägyptischen Eigennamen des Landes, zusammenhängt, ist seit langem vermutet worden und nicht bewiesen."
    - "Psalm 78 erinnert an die letzte Plage, als Gott „alle Erstgeburt in Ägypten schlug, die Erstlinge ihrer Kraft in den Hütten Hams“. Psalm 105 erzählt: „Und Israel zog nach Ägypten, und Jakob ward ein Fremdling im Lande Hams“, und wie Mose und Aaron „seine Zeichen unter ihnen und seine Wunder im Lande Hams“ taten; Psalm 106 erinnert daran, wie das Volk den Gott vergaß, der „Wunder im Lande Hams und schreckliche Werke am Schilfmeer“ getan hatte. In der russischen Synodalübersetzung sind dies nach der griechischen Zählung die Psalmen 77, 104 und 105. Die Chronik sagt auch von den Simeoniten, die nach Gedor zogen, dass „vormals wohnten daselbst die von Ham“, ein ansässiges Volk hamitischer Abstammung im Süden Kanaans."
    - "Das Land Hams ist heute schlicht Ägypten, das Niltal und das Delta; der Name lebt nur in den Psalmen fort, wo er Ägypten aus der Sicht Israels bezeichnet, das Haus der Knechtschaft, aus dem das Volk herausgeführt wurde."
  fr:
    - "« Le pays de Cham » est un nom poétique de l’Égypte, employé seulement dans les Psaumes. Cham est le deuxième nommé des trois fils de Noé, et dans la table des nations « les fils de Cham » sont « Cusch, Mitsraïm, Puth et Canaan », c’est-à-dire la Nubie, l’Égypte, la Libye et Canaan : les peuples du sud et du Nil. L’Égypte est partout ailleurs Mitsraïm dans la Bible ; les psalmistes, en racontant l’histoire de l’Exode, recourent au contraire au nom de l’ancêtre. Que le mot soit rattaché à Kemet, « la terre noire », nom que les Égyptiens donnaient à leur pays, on le suggère depuis longtemps sans l’avoir prouvé."
    - "Le Psaume 78 rappelle la dernière plaie, quand Dieu « frappa tous les premiers-nés en Égypte, les prémices de la force sous les tentes de Cham ». Le Psaume 105 raconte comment « Israël vint en Égypte, et Jacob séjourna dans le pays de Cham », et comment Moïse et Aaron « accomplirent par son pouvoir des prodiges au milieu d’eux, ils firent des miracles dans le pays de Cham » ; le Psaume 106 se souvient du peuple oubliant Dieu, qui avait accompli « des miracles dans le pays de Cham, des prodiges sur la mer Rouge ». Dans la Bible synodale russe, ce sont les Psaumes 77, 104 et 105, selon la numérotation grecque. Les Chroniques disent aussi, des Siméonites qui gagnèrent Guedor, que « ceux qui l’habitaient auparavant descendaient de Cham », un peuple sédentaire de souche chamite dans le sud de Canaan."
    - "Le pays de Cham est aujourd’hui simplement l’Égypte, la vallée du Nil et le Delta ; le nom ne survit que dans les psaumes, où il est l’Égypte vue du côté d’Israël, la maison de servitude d’où le peuple fut tiré."
  pl:
    - "Ziemia Chama to poetycka nazwa Egiptu, używana tylko w Psalmach. Cham jest wymieniany jako drugi z trzech synów Noego, a w tablicy narodów „synowie Chamowi” to: „Chus, i Micraim, i Put, i Chanaan”, czyli Nubia, Egipt, Libia i Kanaan: ludy południa i Nilu. W innych miejscach Biblii Egipt to Micraim; psalmiści, opowiadając dzieje wyjścia, sięgają zamiast tego po imię przodka. Czy słowo to łączy się z Kemet, „czarną ziemią”, egipską nazwą własnego kraju, od dawna się sugeruje, lecz nie udowodniono."
    - "Psalm 78 przypomina ostatnią plagę, gdy Bóg „pobił wszystko pierworodztwo w Egipcie, pierwiastki mocy ich w przybytkach Chamowych”. Psalm 105 opowiada, jak „wszedł Izrael do Egiptu, a Jakób był gościem w ziemi Chamowej”, i jak Mojżesz i Aaron „przedłożyli słowa znaków jego, i cuda w ziemi Chamowej”; Psalm 106 wspomina lud zapominający Boga, który czynił „Rzeczy dziwne w ziemi Chamowej, rzeczy straszne przy morzu Czerwonem”. W rosyjskiej Biblii synodalnej są to Psalmy 77, 104 i 105, według numeracji greckiej. Księgi Kronik mówią też o Symeonitach, którzy przeszli do Gedor, że „tam naród Chamów mieszkał przedtem”, osiadły lud pochodzenia chamickiego na południu Kanaanu."
    - "Ziemia Chama to dziś po prostu Egipt, dolina Nilu i Delta; nazwa przetrwała tylko w psalmach, gdzie jest Egiptem widzianym od strony Izraela, domem niewoli, z którego lud wyprowadzono."
  it:
    - "«La terra di Cam» è un nome poetico per l’Egitto, usato solo nei Salmi. Cam è il secondo nominato dei tre figli di Noè, e nella tavola delle nazioni i «figliuoli di Cam» sono «Cush, Mitsraim, Put e Canaan», cioè Nubia, Egitto, Libia e Canaan: i popoli del sud e del Nilo. Altrove nella Bibbia l’Egitto è Misraim; i salmisti, narrando la storia dell’Esodo, ricorrono invece al nome dell’antenato. Se la parola sia collegata a Kemet, «la terra nera», il nome che gli Egizi davano al proprio paese, è stato a lungo suggerito e non è provato."
    - "Il Salmo 78 ricorda l’ultima piaga, quando Dio «percosse tutti i primogeniti d’Egitto, le primizie del vigore nelle tende di Cham». Il Salmo 105 narra come «Allora Israele venne in Egitto, e Giacobbe soggiornò nel paese di Cham», e come Mosè e Aronne «compiron fra loro i miracoli da lui ordinati, fecero dei prodigi nella terra di Cham»; il Salmo 106 ricorda il popolo che dimenticò Dio, il quale aveva fatto «cose maravigliose nel paese di Cham, cose tremende al Mar rosso». Nella Bibbia sinodale russa questi sono i Salmi 77, 104 e 105, secondo la numerazione greca. Le Cronache dicono anche dei Simeoniti trasferitisi a Ghedor che «quelli che lo abitavano prima erano discendenti di Cam», un popolo stanziale di stirpe camitica nel sud di Canaan."
    - "La terra di Cam è oggi semplicemente l’Egitto, la valle del Nilo e il Delta; il nome sopravvive solo nei salmi, dove è l’Egitto visto dalla parte d’Israele, la casa di schiavitù da cui il popolo fu fatto uscire."
  nl:
    - "“Het land van Cham” is een dichterlijke naam voor Egypte, die alleen in de Psalmen voorkomt. Cham is de als tweede genoemde van de drie zonen van Noach, en in de volkerentafel zijn “de zonen van Cham” “Cusch en Mitsraim, en Put, en Kanaan”, dat zijn Nubië, Egypte, Libië en Kanaän: de volken van het zuiden en van de Nijl. Egypte is overal elders in de Bijbel Mitsraim; de psalmisten grijpen, als zij het verhaal van de uittocht vertellen, naar de naam van de stamvader. Of het woord verband houdt met Kemet, “het zwarte land”, de eigen naam van de Egyptenaren voor hun land, wordt al lang gesuggereerd en is niet bewezen."
    - "Psalm 78 herinnert aan de laatste plaag, toen God “al het eerstgeborene in Egypte” sloeg, “het beginsel der krachten in de tenten van Cham”. Psalm 105 vertelt: “Daarna kwam Israel in Egypte, en Jakob verkeerde als vreemdeling in het land van Cham”, en hoe Mozes en Aäron “de bevelen Zijner tekenen, en de wonderwerken in het land van Cham” deden; Psalm 106 gedenkt hoe het volk God vergat, die “Wonderdaden in het land van Cham; vreselijke dingen aan de Schelfzee” had gedaan. In de Russische Synodale Bijbel zijn dit Psalm 77, 104 en 105, naar de Griekse telling. Kronieken zegt ook van de Simeonieten die naar Gedor trokken dat “die van Cham woonden daar te voren”, een gevestigd volk van chamitische afkomst in het zuiden van Kanaän."
    - "Het land van Cham is nu gewoon Egypte, de Nijlvallei en de Delta; de naam leeft alleen voort in de psalmen, waar hij Egypte is gezien vanuit Israël, het diensthuis waaruit het volk werd geleid."
  cs:
    - "„Země Chamova“ je básnické jméno pro Egypt, užívané jen v Žalmech. Cham je uváděn jako druhý ze tří synů Noemových a v tabulce národů jsou „Synové pak Chamovi: Chus a Mizraim a Put a Kanán“, tedy Núbie, Egypt, Libye a Kanaán: národy jihu a Nilu. Egypt je jinde v Bibli Mizraim; žalmisté, vyprávějíce příběh exodu, sáhli místo toho po jménu praotce. Zda toto slovo souvisí s Kemet, „černou zemí“, vlastním jménem Egypťanů pro jejich zemi, se dlouho navrhuje a není dokázáno."
    - "Žalm 78 připomíná poslední ránu, kdy Bůh „pobil všecko prvorozené v Egyptě, prvotiny síly v staních Chamových“. Žalm 105 vypráví, jak „Potom všel Izrael do Egypta, a Jákob pohostinu byl v zemi Chamově“, a jak Mojžíš a Áron „předložili jim slova znamení jeho a zázraků v zemi Chamově“; Žalm 106 vzpomíná na lid zapomínající na Boha, který učinil „A předivné v zemi Chamově, přehrozné při moři Rudém“. V ruské synodální Bibli jsou to žalmy 77, 104 a 105 podle řeckého číslování. Letopisy také praví o Simeonovcích, kteří se přestěhovali do Gedoru, že „z Chama byli ti, kteříž bydlili tam před tím“, usedlý lid chamitského původu na jihu Kanaánu."
    - "Chamova země je dnes prostě Egypt, údolí Nilu a delta; jméno přežívá jen v žalmech, kde je Egyptem viděným z izraelské strany, domem otroctví, z něhož byl lid vyveden."
  sv:
    - "”Hams land” är ett poetiskt namn på Egypten, använt bara i Psaltaren. Ham var den andre nämnde av Noas tre söner, och i folkens tavla är ”Hams söner” ”Kus, Misraim, Put och Kanaan”, det vill säga Nubien, Egypten, Libyen och Kanaan: folken i söder och vid Nilen. Egypten är Misraim överallt annars i Bibeln; psalmisterna, som berättar om uttåget, griper i stället efter stamfaderns namn. Om ordet hör samman med Kemet, ”det svarta landet”, egypternas eget namn på sitt land, har länge föreslagits men är inte bevisat."
    - "Psalm 78 påminner om den sista plågan, när Gud ”slog allt förstfött i Egypten, kraftens förstling i Hams hyddor”. Psalm 105 berättar hur ”Israel kom till Egypten, Jakob blev en gäst i Hams land”, och hur Mose och Aron ”gjorde hans tecken ibland dem och under i Hams land”; Psalm 106 minns folkets glömska av Gud, som hade gjort ”så underbara verk i Hams land, så fruktansvärda gärningar vid Röda havet”. I den ryska synodalbibeln är dessa Psalm 77, 104 och 105, efter den grekiska numreringen. Krönikeboken säger också om simeoniterna som flyttade till Gedor att ”de som förut bodde där voro hamiter”, ett bofast folk av hamitisk stam i södra Kanaan."
    - "Hams land är i dag helt enkelt Egypten, Nildalen och deltat; namnet lever bara kvar i psalmerna, där det är Egypten sett från Israels sida, träldomshuset från vilket folket fördes ut."
  nb:
    - "«Kams land» er et poetisk navn på Egypt, brukt bare i Salmenes bok. Kam var den andre av Noahs tre sønner som nevnes, og i folkeslagstabellen er «Kams sønner» «Kus og Misra'im og Put og Kana'an», det vil si Nubia, Egypt, Libya og Kanaan: folkene i sør og ved Nilen. Egypt er Misra'im ellers i hele Bibelen; salmistene, når de forteller historien om utferden, griper i stedet etter stamfarens navn. Om ordet henger sammen med Kemet, «det svarte landet», egypternes eget navn på landet sitt, har lenge vært foreslått og er ikke bevist."
    - "Salme 78 minnes den siste plagen, da Gud «slo alle førstefødte i Egypten, styrkens førstegrøde i Kams telter». Salme 105 forteller hvordan Israel kom «til Egypten, og Jakob bodde som fremmed i Kams land», og hvordan Moses og Aron «gjorde hans tegn iblandt dem og undere i Kams land»; Salme 106 minnes folket som glemte Gud, som hadde gjort «undergjerninger i Kams land, forferdelige ting ved det Røde Hav». I den russiske synodalbibelen er disse Salme 77, 104 og 105, etter den greske nummereringen. Krønikebøkene sier også om simeonittene som flyttet til Gedor at «de som bodde der før, var av Kams ætt», et bofast folk av kamittisk stamme i det sørlige Kanaan."
    - "Kams land er i dag ganske enkelt Egypt, Nildalen og deltaet; navnet overlever bare i salmene, der det er Egypt sett fra Israels side, trelldomshuset folket ble ført ut av."
  tl:
    - "Ang Lupain ng Ham ay patulang pangalan ng Egipto, ginamit lamang sa Mga Awit. Si Ham ang ikalawang pinangalanan sa tatlong anak ni Noe, at sa talaan ng mga bansa ang mga anak ni Ham ay “si Cush, at si Mizraim, at si Phut, at si Canaan”, ibig sabihin ang Nubia, Egipto, Libya at Canaan: ang mga bayan ng timog at ng Nilo. Mizraim ang Egipto sa lahat ng ibang dako ng Biblia; sa pagsasalaysay ng Exodo, ang pangalan ng ninuno ang ginagamit ng mga mang-aawit. Matagal nang iminumungkahi, ngunit hindi pa napatutunayan, kung may kaugnayan ang salita sa Kemet, “ang itim na lupain”, ang sariling pangalan ng mga Egipcio sa kanilang bansa."
    - "Ginugunita ng Awit 78 ang huling salot, nang “sinaktan ang lahat na panganay sa Egipto, ang panguna ng kanilang kalakasan sa mga tolda ni Cham”. Isinasalaysay ng Awit 105 kung paanong “si Israel naman ay nasok sa Egipto; at si Jacob ay nakipamayan sa lupain ng Cham”, at kung paanong sina Moises at Aaron: “Kanilang inilagay sa gitna nila ang kaniyang mga tanda, at mga kababalaghan sa lupain ng Cham”; ginugunita ng Awit 106 ang bayang nakalimot sa Diyos, na gumawa ng “Kagilagilalas na mga gawa sa lupain ng Cham, at kakilakilabot na mga bagay sa Dagat na Mapula”. Sa Synodal Bible ng Rusya, ang mga ito ay Awit 77, 104 at 105, ayon sa bilang ng Griyego. Sinasabi rin ng Mga Cronica tungkol sa mga Simeonita na lumipat sa Gedor na “ang nagsisitahan nang una roon ay kay Cham”, isang bayang may lahing Hamita na naninirahan sa timog ng Canaan."
    - "Ang Lupain ng Ham ay ngayon simpleng Egipto, ang libis ng Nilo at ang Delta; nananatili lamang ang pangalan sa mga awit, kung saan ito ang Egiptong nakikita mula sa panig ng Israel, ang bahay ng pagkaalipin kung saan inilabas ang bayan."
  da:
    - "»Kams Land« er et poetisk navn for Egypten, kun brugt i Salmerne. Kam var den næstnævnte af Noas tre sønner, og i Folketavlen er »Kams Sønner« »Kus og Mizraim og Put og Kanaan«, det vil sige Nubien, Egypten, Libyen og Kana'an: sydens og Nilens folk. Egypten er Mizraim alle andre steder i Bibelen; salmisterne, der fortæller om udvandringen, griber i stedet efter stamfaderens navn. Om ordet hænger sammen med Kemet, »det sorte land«, egypternes eget navn for deres land, har længe været foreslået og er ikke bevist."
    - "Salme 78 mindes den sidste plage, da Gud »slog alle førstefødte i Ægypten, Kraftens Førstegrøde i Kams Telte«. Salme 105 fortæller, hvordan »Saa kom Israel til Ægypten og Jakob boede som fremmed i Kams Land«, og hvordan Moses og Aron kundgjorde »hans Tegns Ord iblandt dem og hans Undere i Kams Land«; Salme 106 mindes folket, der glemte Gud, som havde gjort »underfulde Gerninger i Kams Land, forfærdelige Ting ved det røde Hav«. I den russiske synodalbibel er det Salme 77, 104 og 105 efter den græske nummerering. Krønikebøgerne siger også om simeonitterne, der drog til Gedor, at »de, som boede der tilforn, nedstammede fra Kam«, et bofast folk af kamitisk herkomst i det sydlige Kana'an."
    - "Kams Land er i dag blot Egypten, Nildalen og Deltaet; navnet lever kun i salmerne, hvor det er Egypten set fra Israels side, trællehuset, hvorfra folket blev ført ud."
  sr:
    - "„Земља Хамова“ је песничко име Египта, употребљено само у Псалмима. Хам је био други именован од три Нојева сина, а у табели народа „синови Хамови“ су „Хус и Месраин, Фуд и Ханан“, то јест Нубија, Египат, Либија и Ханан: народи југа и Нила. Египат је свуда другде у Библији Мисир; псалмисти, приповедајући причу о Изласку, посежу уместо тога за именом праоца. Да ли је реч повезана с Кеметом, „црном земљом“, властитим именом Египћана за њихову земљу, дуго се претпоставља и није доказано."
    - "Псалам 78 сећа се последње пошасти, кад је Бог поразио све првенце: „Поби све првенце у Мисиру, први пород по колибама Хамовим“. Псалам 105 приповеда: „Тада дође Израиљ у Мисир, и Јаков се пресели у земљу Хамову“, и како Мојсије и Арон „показаше међу њима чудотворну силу Његову и знаке Његове у земљи Хамовој“; Псалам 106 памти народ који је заборавио Бога, који је учинио дела „дивна у земљи Хамовој, страшна на Црвеном Мору“. У руском синодском преводу то су Псалми 77, 104 и 105, по грчком нумерисању. Летописи такође кажу за Симеунове потомке који су се преселили у Гедор да су тамо пре живели они „који беху од Хама“, насељен народ хамитског порекла на југу Ханана."
    - "Земља Хамова је данас једноставно Египат, долина Нила и делта; име преживљава само у псалмима, где је Египат виђен с Израиљеве стране, дом ропства из кога је народ изведен."
  hu:
    - "„Hám földje” Egyiptom költői neve, amelyet csak a zsoltárok használnak. Hám Nóé három fia közül a második megnevezett, és a népek táblázatában „Khámnak pedig fiai”: „Khús, Miczráim, Pút és Kanaán”, vagyis Núbia, Egyiptom, Líbia és Kánaán: a dél és a Nílus népei. Egyiptom a Biblia minden más helyén Micráim; a zsoltárosok az Exodus történetét mesélve inkább az ősapa nevéhez nyúlnak. Hogy a szó összefügg-e Kemettel, „a fekete földdel”, az egyiptomiak saját országnevével, azt régóta feltételezik, de nem bizonyították."
    - "A 78. zsoltár az utolsó csapásra emlékezik, amikor Isten „megöle minden elsőszülöttet Égyiptomban, az erő zsengéjét Khám sátoraiban”. A 105. zsoltár elmondja, hogyan „beméne Izráel Égyiptomba, s Jákób a Khám földén zsellérkedék”, és hogyan Mózes és Áron „elvégezék azok között az ő jeleit, és a csodákat a Khám földén”; a 106. zsoltár arra emlékezik, hogy a nép elfeledkezett Istenről, aki nagy dolgokat tett, „Csodákat a Khám országában, félelmetes dolgokat a veres tenger mellett”. A szinodális orosz Bibliában ezek a 77., 104. és 105. zsoltár, a görög számozás szerint. A Krónikák is azt mondja a Gedórba költözött simeoniakról, hogy „Khámból valók laktak ott azelőtt”, vagyis Kánaán déli részén letelepült hámita eredetű nép."
    - "Hám földje ma egyszerűen Egyiptom, a Nílus-völgy és a Delta; a név csak a zsoltárokban él, ahol Egyiptom Izráel felől nézve, a szolgaság háza, ahonnan a népet kivezették."
  fi:
    - "”Haamin maa” on runollinen nimi Egyptille, jota käytetään vain Psalmeissa. Ham oli Nooan kolmesta pojasta toisena mainittu, ja kansojen taulussa ”Haamin pojat olivat Kuus, Misraim, Puut ja Kanaan”, eli Nubia, Egypti, Libya ja Kanaan: etelän ja Niilin kansat. Egypti on kaikkialla muualla Raamatussa Misraim; psalmistat, kertoessaan Exoduksen tarinaa, tarttuvat sen sijaan esi-isän nimeen. Onko sana yhteydessä Kemetiin, ”mustaan maahan”, egyptiläisten oman maansa nimeen, on esitetty pitkään, eikä sitä ole todistettu."
    - "Psalmi 78 muistelee viimeistä vitsausta, kun Jumala ”surmasi kaikki esikoiset Egyptistä, miehuuden ensimmäiset Haamin majoista”. Psalmi 105 kertoo, kuinka ”joutui Israel Egyptiin, Jaakob muukalaiseksi Haamin maahan”, ja kuinka Mooses ja Aaron ”tekivät hänen tunnustekonsa heidän keskellään, tekivät ihmeitä Haamin maassa”; Psalmi 106 muistaa kansan unohtaneen Jumalan, joka oli tehnyt ”ihmeitä Haamin maassa, peljättäviä tekoja Kaislameren rannalla”. Venäläisessä synodaalisessa Raamatussa nämä ovat psalmit 77, 104 ja 105 kreikkalaisen numeroinnin mukaan. Aikakirjat sanovat myös Gedoriin siirtyneistä simeonilaisista, että ”ne, jotka olivat asuneet siellä ennen, olivat haamilaisia”, vakiintunut haamilaista sukua oleva kansa Kanaanin eteläosassa."
    - "Haamin maa on nykyään yksinkertaisesti Egypti, Niilin laakso ja suisto; nimi säilyy vain psalmeissa, joissa se on Egypti Israelin puolelta nähtynä, orjuuden talo, josta kansa vietiin ulos."
  vi:
    - "“Xứ Cham” là tên mang tính thi ca của Ê-díp-tô, chỉ dùng trong sách Thi Thiên. Cham là người thứ hai được nêu tên trong ba con trai của Nô-ê, và trong bảng các dân tộc, “con trai của Cham” là “Cúc, Mích-ra-im, Phút và Ca-na-an”, tức Nubia, Ê-díp-tô, Li-by và Ca-na-an: các dân của phương nam và của sông Ni-lơ. Ở mọi nơi khác trong Kinh Thánh, Ê-díp-tô là Mích-ra-im; các tác giả Thi Thiên, khi kể câu chuyện Xuất Hành, lại dùng tên của tổ phụ. Việc từ này có liên hệ với Kemet, “đất đen”, tên mà người Ê-díp-tô tự gọi xứ mình, từ lâu đã được gợi ý và chưa được chứng minh."
    - "Thi Thiên 78 nhắc lại tai vạ cuối cùng, khi Đức Chúa Trời “đánh giết mọi con đầu lòng trong Ê-díp-tô, Tức là cường-tráng sanh đầu ở trong các trại Cham”. Thi Thiên 105 kể rằng “Bấy giờ Y-sơ-ra-ên cũng vào Ê-díp-tô; Gia-cốp ngụ tại trong xứ Cham”, và rằng Môi-se và A-rôn làm các dấu kỳ giữa họ: “Trong xứ Cham, tại giữa Ê-díp-tô, Hai người làm các dấu kỳ và phép lạ của Ngài”; Thi Thiên 106 nhớ việc dân quên Đức Chúa Trời, Đấng đã làm “Những việc lạ kỳ trong xứ Cham, Và các điều đáng kinh hãi ở bên Biển đỏ”. Trong bản Synodal Nga, đó là Thi Thiên 77, 104 và 105, theo cách đánh số Hy Lạp. Sách Sử Ký cũng nói về người Si-mê-ôn đến Ghê-đô rằng “khi trước dòng dõi Cham ở đó”, một dân định cư thuộc dòng Cham ở phía nam Ca-na-an."
    - "Đất Cham ngày nay đơn giản là Ê-díp-tô, thung lũng sông Ni-lơ và châu thổ; tên chỉ còn trong các Thi Thiên, nơi đó là Ê-díp-tô nhìn từ phía Y-sơ-ra-ên, nhà nô lệ mà dân được đem ra khỏi."
  ro:
    - "„Țara lui Ham” este un nume poetic pentru Egipt, folosit doar în Psalmi. Ham este al doilea numit dintre cei trei fii ai lui Noe, iar în tabelul popoarelor fiii lui Ham sunt Cuș, Mițraim, Put și Canaan, adică Nubia, Egiptul, Libia și Canaanul: popoarele sudului și ale Nilului. Egiptul este Mițraim peste tot în rest în Biblie; psalmiștii, spunând povestea Exodului, apelează în schimb la numele strămoșului. Dacă cuvântul este legat de Kemet, „țara neagră”, numele pe care egiptenii îl dădeau țării lor, s-a sugerat de mult, dar nu s-a dovedit."
    - "Psalmul 78 amintește ultima plagă, când Dumnezeu a lovit pe toți întâii născuți din Egipt, rodul puterii lor în corturile lui Ham. Psalmul 105 povestește cum Israel a venit în Egipt și Iacov a locuit ca străin în țara lui Ham și cum Moise și Aaron au făcut semnele Sale printre ei și minuni în țara lui Ham; Psalmul 106 își amintește de poporul care L-a uitat pe Dumnezeu, Cel care făcuse lucruri minunate în țara lui Ham și lucruri înfricoșătoare la Marea Roșie. În Biblia sinodală rusă aceștia sunt Psalmii 77, 104 și 105, după numerotarea greacă. Cronicile spun și despre simeoniții care s-au mutat la Ghedor că „erau din fiii lui Ham, acelora ce lăcuiau acolo mai dinainte”, un popor sedentar de neam hamit în sudul Canaanului."
    - "Țara lui Ham este astăzi pur și simplu Egiptul, valea Nilului și Delta; numele supraviețuiește doar în psalmi, unde este Egiptul văzut din partea lui Israel, casa robiei din care a fost scos poporul."
  bg:
    - "„Хамовата земя“ е поетично име на Египет, употребявано само в Псалмите. Хам беше вторият по ред от тримата синове на Ной, а в родословието на народите синовете на Хам са „Хус, и Мицраим, и Фут, и Ханаан“, тоест Нубия, Египет, Либия и Ханаан — народите на юга и на Нил. Навсякъде другаде в Библията Египет е Мицраим; псалмопевците, разказвайки историята на Изхода, посягат вместо това към името на прародителя. Дали думата е свързана с Кемет, „черната земя“, собственото име на египтяните за страната им, отдавна се предполага, но не е доказано."
    - "Псалом 78 припомня последната язва, когато Бог „порази всеки първороден в Египет, Начатък на силата им в жилищата на Хама“. Псалом 105 разказва как „дойде Израил в Египет, И Яков се пресели в Хамовата земя“, и как Мойсей и Аарон „Извършиха всред тях знаменията му И чудесата му в Хамовата земя“; Псалом 106 си спомня как народът забрави Бога, който беше сторил „велики дела в Египет, чудни в Хамовата земя, Страшни в червено Море“. В руската Синодална Библия това са Псалми 77, 104 и 105, по гръцката номерация. Летописи също казва за симеонците, които се преместиха в Гедор, че „тези които по-напред живееха там бяха от Хама“ — уседнал народ от хамитски произход в южен Ханаан."
    - "Земята на Хам днес е просто Египет — долината на Нил и делтата; името оцелява само в псалмите, където това е Египет, видян откъм Израил, домът на робството, от който народът беше изведен."
