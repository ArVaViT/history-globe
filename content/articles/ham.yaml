# Overview article (ADR 0007). Mainstream facts only; the link of the name with Egyptian Kemet is given as a suggestion; Psalm numbers follow the Hebrew, with the Synodal numbers noted.
id: ham
place: a2f3001
title:
  en: "Ham"
  ru: "Земля Хамова"
body:
  en:
    - "“The land of Ham” is a poetic name for Egypt, used only in the Psalms. Ham was the second son of Noah, and in the table of nations “the sons of Ham” are “Cush, and Mizraim, and Phut, and Canaan”, that is Nubia, Egypt, Libya and Canaan: the peoples of the south and of the Nile. Egypt is Mizraim everywhere else in the Bible; the psalmists, telling the story of the Exodus, reach for the ancestor's name instead. Whether the word is connected with Kemet, “the black land”, the Egyptians' own name for their country, has long been suggested and is not proved."
    - "Psalm 78 recalls the last plague, when God “smote all the firstborn in Egypt; the chief of their strength in the tabernacles of Ham”. Psalm 105 tells how “Israel also came into Egypt; and Jacob sojourned in the land of Ham”, and how Moses and Aaron “shewed his signs among them, and wonders in the land of Ham”; Psalm 106 remembers the people forgetting God, who had done “Wondrous works in the land of Ham, and terrible things by the Red sea”. In the Russian Synodal Bible these are Psalms 77, 104 and 105, after the Greek numbering. Chronicles also says of the Simeonites who moved to Gedor that “they of Ham had dwelt there of old”, a settled people of Hamite stock in the south of Canaan."
    - "The land of Ham is today simply Egypt, the Nile valley and the Delta; the name survives only in the psalms, where it is Egypt seen from Israel's side, the house of bondage from which the people were brought out."
  ru:
    - "«Земля Хамова» — поэтическое имя Египта, встречающееся только в Псалтири. Хам был вторым сыном Ноя, и в таблице народов «Сыны Хама: Хуш, Мицраим, Фут и Ханаан», то есть Нубия, Египет, Ливия и Ханаан — народы юга и Нила. Всюду в Библии Египет зовётся Мицраимом; псалмопевцы, пересказывая исход, берут вместо этого имя предка. Связано ли слово с Кемет, «чёрной землёй», как сами египтяне звали свою страну, давно предполагают, но не доказано."
    - "Псалом 77 вспоминает последнюю казнь, когда Бог «поразил всякого первенца в Египте, начатки сил в шатрах Хамовых». Псалом 104 рассказывает, как «пришел Израиль в Египет, и переселился Иаков в землю Хамову», и как Моисей и Аарон «показали между ними слова знамений Его и чудеса Его в земле Хамовой»; псалом 105 напоминает, как народ забыл Бога, сотворившего «дивное в земле Хамовой, страшное у Чермного моря». В еврейской Библии и в западных переводах это псалмы 78, 105 и 106. Паралипоменон говорит также о Симеонитах, перешедших к Гедору, что до них там жило «немного Хамитян», — оседлый народ Хамова рода на юге Ханаана."
    - "Земля Хамова сегодня — просто Египет, долина и дельта Нила; имя живёт только в псалмах, где это Египет, увиденный глазами Израиля, дом рабства, из которого был выведен народ."
