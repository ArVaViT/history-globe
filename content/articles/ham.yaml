body:
  en:
    - "“The land of Ham” is a poetic name for Egypt, used only in the Psalms. Ham was the second son of Noah, and in the table of nations “the sons of Ham” are “Cush, and Mizraim, and Phut, and Canaan”, that is Nubia, Egypt, Libya and Canaan: the peoples of the south and of the Nile. Egypt is Mizraim everywhere else in the Bible; the psalmists, telling the story of the Exodus, reach for the ancestor's name instead. Whether the word is connected with Kemet, “the black land”, the Egyptians' own name for their country, has long been suggested and is not proved."
    - "Psalm 78 recalls the last plague, when God “smote all the firstborn in Egypt; the chief of their strength in the tabernacles of Ham”. Psalm 105 tells how “Israel also came into Egypt; and Jacob sojourned in the land of Ham”, and how Moses and Aaron “shewed his signs among them, and wonders in the land of Ham”; Psalm 106 remembers the people forgetting God, who had done “Wondrous works in the land of Ham, and terrible things by the Red sea”. In the Russian Synodal Bible these are Psalms 77, 104 and 105, after the Greek numbering. Chronicles also says of the Simeonites who moved to Gedor that “they of Ham had dwelt there of old”, a settled people of Hamite stock in the south of Canaan."
    - "The land of Ham is today simply Egypt, the Nile valley and the Delta; the name survives only in the psalms, where it is Egypt seen from Israel's side, the house of bondage from which the people were brought out."
  ru:
    - "«Земля Хамова» — поэтическое имя Египта, встречающееся только в Псалтири. Хам был вторым сыном Ноя, и в таблице народов «Сыны Хама: Хуш, Мицраим, Фут и Ханаан», то есть Нубия, Египет, Ливия и Ханаан — народы юга и Нила. Всюду в Библии Египет зовётся Мицраимом; псалмопевцы, пересказывая исход, берут вместо этого имя предка. Связано ли слово с Кемет, «чёрной землёй», как сами египтяне звали свою страну, давно предполагают, но не доказано."
    - "Псалом 77 вспоминает последнюю казнь, когда Бог «поразил всякого первенца в Египте, начатки сил в шатрах Хамовых». Псалом 104 рассказывает, как «пришел Израиль в Египет, и переселился Иаков в землю Хамову», и как Моисей и Аарон «показали между ними слова знамений Его и чудеса Его в земле Хамовой»; псалом 105 напоминает, как народ забыл Бога, сотворившего «дивное в земле Хамовой, страшное у Чермного моря». В еврейской Библии и в западных переводах это псалмы 78, 105 и 106. Паралипоменон говорит также о Симеонитах, перешедших к Гедору, что до них там жило «немного Хамитян», — оседлый народ Хамова рода на юге Ханаана."
    - "Земля Хамова сегодня — просто Египет, долина и дельта Нила; имя живёт только в псалмах, где это Египет, увиденный глазами Израиля, дом рабства, из которого был выведен народ."
  uk:
    - "«Земля Хамова» — поетична назва Єгипту, вживана лише в Псалмах. Хам був другим сином Ноя, і в переліку народів «сини Хамові» — «Куш та Мизраїм, да Фут, да Канаан», тобто Нубія, Єгипет, Лівія і Ханаан: народи півдня й Нілу. Скрізь в іншому місці Біблії Єгипет — Міцраім; псалмоспівці, розповідаючи історію Виходу, натомість беруться за ім’я прабатька. Чи пов’язане це слово з Кемет, «чорною землею», власною назвою Єгипту у самих єгиптян, давно припускають, але не доведено."
    - "Псалом 78 згадує останню кару, коли Бог «побив всїх первороднїв в Египтї, первенцїв сили у Хамових шатрах». Псалом 105 розповідає, як «Прийшов Ізраїль до Египту, і Яков осївся в землї Хама», і як Мойсей та Аарон «творили між ними знамена його і чудеса в землї Хамовій»; Псалом 106 згадує, як народ забув Бога, що чинив «Чудеса в країнї Хама, страшне дїло на Червоному морі». У російській Синодальній Біблії це псалми 77, 104 і 105 за грецькою нумерацією. Хроніки також кажуть про симеонітів, які переселилися до Гедора, що до їхнього приходу «жило там тільки трохи Хомитян», осілий народ хамітського роду на півдні Ханаану."
    - "Земля Хамова сьогодні — просто Єгипет, долина Нілу й дельта; назва зберігається лише в псалмах, де це Єгипет, побачений з боку Ізраїлю, дім неволі, з якого вивели народ."
  es:
    - "«La tierra de Cam» es un nombre poético de Egipto, usado solo en los Salmos. Cam fue el segundo hijo de Noé, y en la tabla de las naciones «los hijos de Châm» son «Cush, y Mizraim, y Phut, y Canaán», es decir, Nubia, Egipto, Libia y Canaán: los pueblos del sur y del Nilo. En todos los demás lugares de la Biblia Egipto es Mizraim; los salmistas, al contar la historia del Éxodo, recurren en cambio al nombre del antepasado. Desde hace tiempo se ha sugerido, sin probarse, que la palabra esté relacionada con Kemet, «la tierra negra», el nombre que los egipcios daban a su propio país."
    - "El Salmo 78 recuerda la última plaga, cuando Dios «hirió á todo primogénito en Egipto, las primicias de las fuerzas en las tiendas de Châm». El Salmo 105 cuenta cómo «Después entró Israel en Egipto, y Jacob fué extranjero en la tierra de Châm», y cómo Moisés y Aarón pusieron en ellos «las palabras de sus señales, y sus prodigios en la tierra de Châm»; el Salmo 106 recuerda al pueblo olvidando a Dios, que había hecho «Maravillas en la tierra de Châm, cosas formidables sobre el mar Bermejo». En la Biblia sinodal rusa estos son los salmos 77, 104 y 105, según la numeración griega. Crónicas dice también de los simeonitas que se trasladaron a Gedor que «los de Châm la habitaban de antes», un pueblo sedentario de estirpe camita en el sur de Canaán."
    - "La tierra de Cam es hoy simplemente Egipto, el valle del Nilo y el delta; el nombre pervive solo en los salmos, donde es Egipto visto desde el lado de Israel, la casa de servidumbre de la que fue sacado el pueblo."
  pt:
    - "“A terra de Cam” é um nome poético para o Egito, usado apenas nos Salmos. Cam foi o segundo filho de Noé, e na tabela das nações “Os filhos de Cam foram: Cuxe, Mizraim, Pute e Canaã”, isto é, Núbia, Egito, Líbia e Canaã: os povos do sul e do Nilo. O Egito é Mizraim em todo o resto da Bíblia; os salmistas, ao contar a história do Êxodo, recorrem ao nome do antepassado. Se a palavra está ligada a Kemet, “a terra negra”, o nome que os próprios egípcios davam ao seu país, é algo há muito sugerido e não provado."
    - "O Salmo 78 recorda a última praga, quando Deus “feriu todos os primogênitos no Egito, as primícias da sua força nas tendas de Cam”. O Salmo 105 conta como “Israel também foi para o Egito. Jacó habitou na terra de Cam”, e como Moisés e Arão realizaram “milagres entre eles, e maravilhas na terra de Cam”; o Salmo 106 recorda o povo esquecendo Deus, que fizera “obras maravilhosas na terra de Cam, e coisas temíveis junto ao Mar Vermelho”. Na Bíblia Sinodal russa são os Salmos 77, 104 e 105, segundo a numeração grega. Crônicas diz também dos simeonitas que se mudaram para Gedor que “os que moravam lá antes eram descendentes de Cam”, um povo sedentário de estirpe camita no sul de Canaã."
    - "A terra de Cam é hoje simplesmente o Egito, o vale do Nilo e o Delta; o nome sobrevive apenas nos salmos, onde é o Egito visto do lado de Israel, a casa de servidão da qual o povo foi tirado."
  de:
    - "„Das Land Hams“ ist ein dichterischer Name für Ägypten, nur in den Psalmen gebraucht. Ham war der zweite Sohn Noahs, und in der Völkertafel sind „die Kinder von Ham“: „Chus, Mizraim, Put und Kanaan“, das heißt Nubien, Ägypten, Libyen und Kanaan, die Völker des Südens und des Nils. Ägypten heißt sonst überall in der Bibel Mizraim; die Psalmisten greifen bei der Erzählung vom Auszug stattdessen zum Namen des Stammvaters. Ob das Wort mit Kemet, „dem schwarzen Land“, dem ägyptischen Eigennamen des Landes, zusammenhängt, ist seit langem vermutet worden und nicht bewiesen."
    - "Psalm 78 erinnert an die letzte Plage, als Gott „alle Erstgeburt in Ägypten schlug, die Erstlinge ihrer Kraft in den Hütten Hams“. Psalm 105 erzählt: „Und Israel zog nach Ägypten, und Jakob ward ein Fremdling im Lande Hams“, und wie Mose und Aaron „seine Zeichen unter ihnen und seine Wunder im Lande Hams“ taten; Psalm 106 erinnert daran, wie das Volk den Gott vergaß, der „Wunder im Lande Hams und schreckliche Werke am Schilfmeer“ getan hatte. In der russischen Synodalübersetzung sind dies nach der griechischen Zählung die Psalmen 77, 104 und 105. Die Chronik sagt auch von den Simeoniten, die nach Gedor zogen, dass „vormals wohnten daselbst die von Ham“, ein ansässiges Volk hamitischer Abstammung im Süden Kanaans."
    - "Das Land Hams ist heute schlicht Ägypten, das Niltal und das Delta; der Name lebt nur in den Psalmen fort, wo er Ägypten aus der Sicht Israels bezeichnet, das Haus der Knechtschaft, aus dem das Volk herausgeführt wurde."
  fr:
    - "« Le pays de Cham » est un nom poétique de l’Égypte, employé seulement dans les Psaumes. Cham fut le deuxième fils de Noé, et dans la table des nations « les fils de Cham » sont « Cusch, Mitsraïm, Puth et Canaan », c’est-à-dire la Nubie, l’Égypte, la Libye et Canaan : les peuples du sud et du Nil. L’Égypte est partout ailleurs Mitsraïm dans la Bible ; les psalmistes, en racontant l’histoire de l’Exode, recourent au contraire au nom de l’ancêtre. Que le mot soit rattaché à Kemet, « la terre noire », nom que les Égyptiens donnaient à leur pays, on le suggère depuis longtemps sans l’avoir prouvé."
    - "Le Psaume 78 rappelle la dernière plaie, quand Dieu « frappa tous les premiers-nés en Égypte, les prémices de la force sous les tentes de Cham ». Le Psaume 105 raconte comment « Israël vint en Égypte, et Jacob séjourna dans le pays de Cham », et comment Moïse et Aaron « accomplirent par son pouvoir des prodiges au milieu d’eux, ils firent des miracles dans le pays de Cham » ; le Psaume 106 se souvient du peuple oubliant Dieu, qui avait accompli « des miracles dans le pays de Cham, des prodiges sur la mer Rouge ». Dans la Bible synodale russe, ce sont les Psaumes 77, 104 et 105, selon la numérotation grecque. Les Chroniques disent aussi, des Siméonites qui gagnèrent Guedor, que « ceux qui l’habitaient auparavant descendaient de Cham », un peuple sédentaire de souche chamite dans le sud de Canaan."
    - "Le pays de Cham est aujourd’hui simplement l’Égypte, la vallée du Nil et le Delta ; le nom ne survit que dans les psaumes, où il est l’Égypte vue du côté d’Israël, la maison de servitude d’où le peuple fut tiré."
  pl:
    - "Ziemia Chama to poetycka nazwa Egiptu, używana tylko w Psalmach. Cham był drugim synem Noego, a w tablicy narodów „synowie Chamowi” to: „Chus, i Micraim, i Put, i Chanaan”, czyli Nubia, Egipt, Libia i Kanaan: ludy południa i Nilu. W innych miejscach Biblii Egipt to Micraim; psalmiści, opowiadając dzieje wyjścia, sięgają zamiast tego po imię przodka. Czy słowo to łączy się z Kemet, „czarną ziemią”, egipską nazwą własnego kraju, od dawna się sugeruje, lecz nie udowodniono."
    - "Psalm 78 przypomina ostatnią plagę, gdy Bóg „pobił wszystko pierworodztwo w Egipcie, pierwiastki mocy ich w przybytkach Chamowych”. Psalm 105 opowiada, jak „wszedł Izrael do Egiptu, a Jakób był gościem w ziemi Chamowej”, i jak Mojżesz i Aaron „przedłożyli słowa znaków jego, i cuda w ziemi Chamowej”; Psalm 106 wspomina lud zapominający Boga, który czynił „Rzeczy dziwne w ziemi Chamowej, rzeczy straszne przy morzu Czerwonem”. W rosyjskiej Biblii synodalnej są to Psalmy 77, 104 i 105, według numeracji greckiej. Księgi Kronik mówią też o Symeonitach, którzy przeszli do Gedor, że „tam naród Chamów mieszkał przedtem”, osiadły lud pochodzenia chamickiego na południu Kanaanu."
    - "Ziemia Chama to dziś po prostu Egipt, dolina Nilu i Delta; nazwa przetrwała tylko w psalmach, gdzie jest Egiptem widzianym od strony Izraela, domem niewoli, z którego lud wyprowadzono."
  it:
    - "«La terra di Cam» è un nome poetico per l’Egitto, usato solo nei Salmi. Cam fu il secondo figlio di Noè, e nella tavola delle nazioni i «figliuoli di Cam» sono «Cush, Mitsraim, Put e Canaan», cioè Nubia, Egitto, Libia e Canaan: i popoli del sud e del Nilo. Altrove nella Bibbia l’Egitto è Misraim; i salmisti, narrando la storia dell’Esodo, ricorrono invece al nome dell’antenato. Se la parola sia collegata a Kemet, «la terra nera», il nome che gli Egizi davano al proprio paese, è stato a lungo suggerito e non è provato."
    - "Il Salmo 78 ricorda l’ultima piaga, quando Dio «percosse tutti i primogeniti d’Egitto, le primizie del vigore nelle tende di Cham». Il Salmo 105 narra come «Allora Israele venne in Egitto, e Giacobbe soggiornò nel paese di Cham», e come Mosè e Aronne «compiron fra loro i miracoli da lui ordinati, fecero dei prodigi nella terra di Cham»; il Salmo 106 ricorda il popolo che dimenticò Dio, il quale aveva fatto «cose maravigliose nel paese di Cham, cose tremende al Mar rosso». Nella Bibbia sinodale russa questi sono i Salmi 77, 104 e 105, secondo la numerazione greca. Le Cronache dicono anche dei Simeoniti trasferitisi a Ghedor che «quelli che lo abitavano prima erano discendenti di Cam», un popolo stanziale di stirpe camitica nel sud di Canaan."
    - "La terra di Cam è oggi semplicemente l’Egitto, la valle del Nilo e il Delta; il nome sopravvive solo nei salmi, dove è l’Egitto visto dalla parte d’Israele, la casa di schiavitù da cui il popolo fu fatto uscire."
  nl:
    - "“Het land van Cham” is een dichterlijke naam voor Egypte, die alleen in de Psalmen voorkomt. Cham was de tweede zoon van Noach, en in de volkerentafel zijn “de zonen van Cham” “Cusch en Mitsraim, en Put, en Kanaan”, dat zijn Nubië, Egypte, Libië en Kanaän: de volken van het zuiden en van de Nijl. Egypte is overal elders in de Bijbel Mitsraim; de psalmisten grijpen, als zij het verhaal van de uittocht vertellen, naar de naam van de stamvader. Of het woord verband houdt met Kemet, “het zwarte land”, de eigen naam van de Egyptenaren voor hun land, wordt al lang gesuggereerd en is niet bewezen."
    - "Psalm 78 herinnert aan de laatste plaag, toen God “al het eerstgeborene in Egypte” sloeg, “het beginsel der krachten in de tenten van Cham”. Psalm 105 vertelt: “Daarna kwam Israel in Egypte, en Jakob verkeerde als vreemdeling in het land van Cham”, en hoe Mozes en Aäron “de bevelen Zijner tekenen, en de wonderwerken in het land van Cham” deden; Psalm 106 gedenkt hoe het volk God vergat, die “Wonderdaden in het land van Cham; vreselijke dingen aan de Schelfzee” had gedaan. In de Russische Synodale Bijbel zijn dit Psalm 77, 104 en 105, naar de Griekse telling. Kronieken zegt ook van de Simeonieten die naar Gedor trokken dat “die van Cham woonden daar te voren”, een gevestigd volk van chamitische afkomst in het zuiden van Kanaän."
    - "Het land van Cham is nu gewoon Egypte, de Nijlvallei en de Delta; de naam leeft alleen voort in de psalmen, waar hij Egypte is gezien vanuit Israël, het diensthuis waaruit het volk werd geleid."
  cs:
    - "„Země Chamova“ je básnické jméno pro Egypt, užívané jen v Žalmech. Cham byl druhý syn Noema a v tabulce národů jsou „Synové pak Chamovi: Chus a Mizraim a Put a Kanán“, tedy Núbie, Egypt, Libye a Kanaán: národy jihu a Nilu. Egypt je jinde v Bibli Mizraim; žalmisté, vyprávějíce příběh exodu, sáhli místo toho po jménu praotce. Zda toto slovo souvisí s Kemet, „černou zemí“, vlastním jménem Egypťanů pro jejich zemi, se dlouho navrhuje a není dokázáno."
    - "Žalm 78 připomíná poslední ránu, kdy Bůh „pobil všecko prvorozené v Egyptě, prvotiny síly v staních Chamových“. Žalm 105 vypráví, jak „Potom všel Izrael do Egypta, a Jákob pohostinu byl v zemi Chamově“, a jak Mojžíš a Áron „předložili jim slova znamení jeho a zázraků v zemi Chamově“; Žalm 106 vzpomíná na lid zapomínající na Boha, který učinil „A předivné v zemi Chamově, přehrozné při moři Rudém“. V ruské synodální Bibli jsou to žalmy 77, 104 a 105 podle řeckého číslování. Letopisy také praví o Simeonovcích, kteří se přestěhovali do Gedoru, že „z Chama byli ti, kteříž bydlili tam před tím“, usedlý lid chamitského původu na jihu Kanaánu."
    - "Chamova země je dnes prostě Egypt, údolí Nilu a delta; jméno přežívá jen v žalmech, kde je Egyptem viděným z izraelské strany, domem otroctví, z něhož byl lid vyveden."
