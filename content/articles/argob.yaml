body:
  en:
    - "Argob was a district of Bashan, the kingdom of Og east of the Sea of Galilee, remembered for its walled towns. Moses recalls that Israel took “threescore cities, all the region of Argob, the kingdom of Og in Bashan”, and that “all these cities were fenced with high walls, gates, and bars; beside unwalled towns a great many”. The region went to the half-tribe of Manasseh, and “Jair the son of Manasseh took all the country of Argob unto the coasts of Geshuri and Maachathi” and named the towns after himself. Under Solomon it belonged to the sixth district, governed from Ramoth-gilead by Ben-geber, “threescore great cities with walls and brasen bars”. The name is usually explained from a Hebrew word for a clod of earth, that is, a land of rich soil."
    - "Where in Bashan it lay is not known. Nineteenth-century travellers, above all J. L. Porter, identified Argob with the Leja, the black lava field south-east of Damascus, whose basalt villages they took for the giant cities of Og; later scholars such as G. A. Smith found no evidence for this, a plain of barren rock hardly suits a name of rich clods, and many look instead to the fertile wheat country of the Hauran or the plateau between the Yarmuk and the Leja. No site has been dug as a city of Argob, and the map marks the region only approximately. An Argob is also named beside Pekah's victim Pekahiah in Kings, though whether that is a man or a place is unclear."
    - "The land in question is today the Daraa and Suwayda governorates of southern Syria and the northern edge of Jordan: the Hauran, with its basalt-built villages, the Druze mountain and the Leja still a tangle of lava."
  ru:
    - "Аргов — область Васана, царства Ога к востоку от Галилейского моря, памятная своими укреплёнными городами. Моисей вспоминает, что Израиль взял «шестьдесят городов, всю область Аргов, царство Ога Васанского» и что «все эти города укреплены были высокими стенами, воротами и запорами, кроме городов неукрепленных, весьма многих». Область отошла половине колена Манассии, и «Иаир, сын Манассиин, взял всю область Аргов, до пределов Гесурских и Маахских» и назвал селения своим именем. При Соломоне она входила в шестой округ, которым правил из Рамофа Галаадского Бен-Гевер: «шестьдесят больших городов со стенами и медными затворами». Имя обычно выводят из еврейского слова, означающего ком земли, то есть земля с тучной почвой."
    - "Где именно в Васане она лежала, неизвестно. Путешественники XIX века, прежде всего Дж. Л. Портер, отождествляли Аргов с Леджей — чёрным лавовым полем к юго-востоку от Дамаска, чьи базальтовые селения они принимали за исполинские города Ога; позднейшие учёные, как Дж. А. Смит, не нашли этому доказательств, равнина голого камня плохо вяжется с именем тучных комьев, и многие ищут Аргов в хлебородном Хауране или на плато между Ярмуком и Леджей. Ни одно место не раскопано как город Аргова, и карта отмечает область лишь приблизительно. Некий Аргов назван и рядом с Факией, убитым Факеем, в книге Царств, но человек это или место — неясно."
    - "Эта земля сегодня — мухафазы Даръа и Эс-Сувайда на юге Сирии и северная окраина Иордании: Хауран с его селениями из базальта, Друзская гора и Леджа, по-прежнему нагромождение лавы."
  uk:
    - "Аргов був округом Башану, царства Ога на схід від Галілейського моря, відомим своїми мурованими містами. Мойсей згадує, що Ізраїль узяв «шістьдесять міст, вся полоса Аргоб, царство Огове в Базанї», і що «Всї міста сї були укріплені високими мурами, брамами й засувами; окрім того багацько міст неукріплених». Область дісталася половині племені Манасії, і «Яір Манассієнко взяв усю полосу Аргоб до границї Гезуріїв і Маакатіїв» та назвав міста за собою. За Соломона вона належала до шостого округу, яким з Рамоту Гілеадського правив Бен-Гевер: «шістьдесять великих городів з мурами й мідяними засовами». Назву зазвичай пояснюють від єврейського слова, що означає грудку землі, тобто край родючого ґрунту."
    - "Де в Башані він лежав, невідомо. Мандрівники XIX століття, передусім Дж. Л. Портер, ототожнювали Аргов із Леджею, чорним лавовим полем на південний схід від Дамаска, чиї базальтові села вони вважали велетенськими містами Ога; пізніші вчені, як-от Дж. А. Сміт, не знайшли цьому доказів, рівнина безплідної скелі навряд чи пасує до назви родючих грудок, і багато хто шукає натомість родючий пшеничний край Хавран або плато між Ярмуком і Леджею. Жодне місце не розкопували як місто Аргова, і мапа позначає область лише приблизно. Аргов названо також поруч із Факією, жертвою Факея, у книгах Царів, хоча чи це людина, чи місце, неясно."
    - "Ця земля нині — мухафази Дераа і Сувейда в південній Сирії та північний край Йорданії: Хавран з базальтовими селами, Друзька гора і Леджа, досі плутанина лави."
  es:
    - "Argob era un distrito de Basán, el reino de Og al este del mar de Galilea, recordado por sus ciudades amuralladas. Moisés recuerda que Israel tomó «sesenta ciudades, toda la tierra de Argob, del reino de Og en Basán», y que «Todas éstas eran ciudades fortalecidas con alto muro, con puertas y barras; sin otras muy muchas ciudades sin muro». La región correspondió a la media tribu de Manasés, y «Jair hijo de Manasés tomó toda la tierra de Argob hasta el término de Gessuri y Machâti» y puso a las ciudades su propio nombre. Bajo Salomón pertenecía al sexto distrito, gobernado desde Ramot de Galaad por Ben-geber, con «sesenta grandes ciudades con muro y cerraduras de bronce». El nombre suele explicarse a partir de una palabra hebrea para el terrón de tierra, es decir, una tierra de suelo rico."
    - "No se sabe dónde, en Basán, estaba. Los viajeros del siglo XIX, sobre todo J. L. Porter, identificaron Argob con el Leja, el campo de lava negra al sudeste de Damasco, cuyas aldeas de basalto tomaron por las ciudades gigantes de Og; estudiosos posteriores como G. A. Smith no hallaron pruebas de ello, una llanura de roca estéril mal se aviene con un nombre de ricos terrones, y muchos miran más bien a la fértil región triguera del Haurán o a la meseta entre el Yarmuk y el Leja. Ningún sitio ha sido excavado como ciudad de Argob, y el mapa señala la región solo de manera aproximada. También se nombra un Argob junto a Pekaía, víctima de Peka, en Reyes, aunque no está claro si es un hombre o un lugar."
    - "La tierra en cuestión es hoy las gobernaciones de Daraa y Suwayda, en el sur de Siria, y el borde septentrional de Jordania: el Haurán, con sus aldeas construidas de basalto, la montaña drusa y el Leja, todavía un enredo de lava."
  pt:
    - "Argobe era um distrito de Basã, o reino de Ogue a leste do mar da Galileia, lembrado por suas cidades muradas. Moisés recorda que Israel tomou “sessenta cidades, toda a região de Argobe, o reino de Ogue em Basã”, e que “Todas estas eram cidades fortificadas com altos muros, portões e trancas, além de muitíssimas aldeias sem muros”. A região coube à meia tribo de Manassés, e “Jair, filho de Manassés, tomou toda a região de Argobe, até a fronteira dos gesuritas e dos maacatitas” e deu às cidades o seu nome. Sob Salomão pertencia ao sexto distrito, governado de Ramote-Gileade por Ben-Geber, “sessenta grandes cidades com muros e trancas de bronze”. O nome costuma ser explicado a partir de uma palavra hebraica para torrão de terra, isto é, uma terra de solo rico."
    - "Onde ficava em Basã não se sabe. Viajantes do século XIX, sobretudo J. L. Porter, identificaram Argobe com o Leja, o campo de lava negra a sudeste de Damasco, cujas aldeias de basalto tomaram pelas cidades gigantes de Ogue; estudiosos posteriores como G. A. Smith não acharam prova disso, uma planície de rocha estéril mal combina com um nome de ricos torrões, e muitos olham antes para a fértil região de trigo do Haurã ou para o planalto entre o Yarmuk e o Leja. Nenhum sítio foi escavado como cidade de Argobe, e o mapa marca a região apenas de modo aproximado. Um Argobe também é nomeado em Reis ao lado de Pecaías, vítima de Peca, embora não esteja claro se é um homem ou um lugar."
    - "A terra em questão é hoje as províncias de Daraa e Suwayda, no sul da Síria, e a borda setentrional da Jordânia: o Haurã, com suas aldeias de basalto, a montanha drusa e o Leja, ainda um emaranhado de lava."
  de:
    - "Argob war ein Bezirk Baschans, des Königreichs Ogs östlich des Sees Genezareth, bekannt für seine ummauerten Städte. Mose erinnert, Israel habe genommen „sechzig Städte, die ganze Gegend Argob, das Königreich Ogs von Basan“, und „alle diese Städte waren fest mit hohen Mauern, Toren und Riegeln, außer sehr vielen anderen Flecken ohne Mauern“. Die Gegend fiel an den halben Stamm Manasse, und „Jair, der Sohn Manasses, nahm die ganze Gegend Argob bis an die Grenze der Gessuriter und Maachathiter“ und benannte die Orte nach sich. Unter Salomo gehörte sie zum sechsten Bezirk, von Ramot in Gilead aus durch Ben-Geber verwaltet, „sechzig große Städte, vermauert und mit ehernen Riegeln“. Der Name wird gewöhnlich von einem hebräischen Wort für Erdscholle abgeleitet, also ein Land fruchtbaren Bodens."
    - "Wo in Baschan es lag, ist nicht bekannt. Reisende des 19. Jahrhunderts, vor allem J. L. Porter, setzten Argob mit der Leja gleich, dem schwarzen Lavafeld südöstlich von Damaskus, dessen Basaltdörfer sie für die Riesenstädte Ogs hielten; spätere Gelehrte wie G. A. Smith fanden dafür keinen Beleg, eine Ebene aus kahlem Fels passt kaum zu einem Namen fruchtbarer Schollen, und viele blicken stattdessen auf das fruchtbare Weizenland des Hauran oder die Hochebene zwischen Jarmuk und Leja. Keine Stätte wurde als Stadt Argobs ausgegraben, und die Karte markiert die Gegend nur ungefähr. Ein Argob wird in den Königsbüchern auch neben Pekachja genannt, dem Opfer Pekachs, doch ist unklar, ob es ein Mann oder ein Ort ist."
    - "Das fragliche Land sind heute die Gouvernements Daraa und Suwaida im Süden Syriens und der Nordrand Jordaniens: der Hauran mit seinen Dörfern aus Basalt, das Drusengebirge und die Leja, noch immer ein Gewirr aus Lava."
  fr:
    - "Argob était un district de Basan, le royaume d’Og à l’est de la mer de Galilée, resté célèbre pour ses villes fortifiées. Moïse rappelle qu’Israël prit « soixante villes, toute la contrée d’Argob, le royaume d’Og en Basan », et que « Toutes ces villes étaient fortifiées, avec de hautes murailles, des portes et des barres ; il y avait aussi des villes sans murailles en très grand nombre ». La région revint à la demi-tribu de Manassé, et « Jaïr, fils de Manassé, prit toute la contrée d’Argob jusqu’à la frontière des Gueschuriens et des Maacathiens » et donna son nom aux bourgs. Sous Salomon, elle appartenait au sixième district, gouverné depuis Ramoth en Galaad par Ben-Guéber, « soixante grandes villes à murailles et à barres d’airain ». Le nom s’explique d’ordinaire par un mot hébreu désignant une motte de terre, c’est-à-dire un pays de sol riche."
    - "On ignore où, en Basan, il se trouvait. Les voyageurs du XIXe siècle, surtout J. L. Porter, identifièrent Argob au Léja, le champ de lave noire au sud-est de Damas, dont ils prirent les villages de basalte pour les villes géantes d’Og ; des savants ultérieurs comme G. A. Smith n’en ont trouvé aucune preuve, une plaine de roche stérile convient mal à un nom de riches mottes, et beaucoup regardent plutôt la fertile région à blé du Havran ou le plateau entre le Yarmouk et le Léja. Aucun site n’a été fouillé comme ville d’Argob, et la carte ne marque la région que de façon approximative. Un Argob est aussi nommé à côté de Pekachja, victime de Péka, dans les Rois, sans que l’on sache s’il s’agit d’un homme ou d’un lieu."
    - "Le pays en question correspond aujourd’hui aux gouvernorats de Deraa et de Soueïda, dans le sud de la Syrie, et à la lisière nord de la Jordanie : le Havran, avec ses villages bâtis en basalte, la montagne druze et le Léja, encore un chaos de lave."
  it:
    - "Argob era un distretto di Basan, il regno di Og a est del Lago di Tiberiade, ricordato per le sue città murate. Mosè ricorda che Israele prese «sessanta città, tutta la contrada d’Argob, il regno di Og in Basan», e che «Tutte queste città erano fortificate, con alte mura, porte e sbarre, senza contare le città aperte, ch’erano in grandissimo numero». La regione andò alla mezza tribù di Manasse, e «Iair, figliuolo di Manasse, prese tutta la regione di Argob, sino ai confini dei Gheshuriti, e dei Mahacathiti» e diede alle borgate il proprio nome. Sotto Salomone apparteneva al sesto distretto, governato da Ramot di Galaad da Ben-Gheber, «sessanta grandi città murate e munite di sbarre di rame». Il nome si spiega di solito da una parola ebraica per zolla di terra, cioè una terra dal suolo ricco."
    - "Dove sorgesse in Basan non si sa. I viaggiatori dell’Ottocento, soprattutto J. L. Porter, identificarono Argob con il Leja, il campo di lava nera a sud-est di Damasco, i cui villaggi di basalto ritennero le città giganti di Og; studiosi successivi come G. A. Smith non ne trovarono prove, una pianura di roccia arida mal si accorda con un nome di zolle ricche, e molti guardano piuttosto alla fertile regione granaria dell’Auran o all’altopiano tra lo Yarmuk e il Leja. Nessun sito è stato scavato come città di Argob, e la carta segna la regione solo approssimativamente. Un Argob è nominato anche accanto a Pekachia, la vittima di Pekach, nei Re, benché non sia chiaro se si tratti di un uomo o di un luogo."
    - "La terra in questione è oggi nei governatorati di Daraa e Suwayda nella Siria meridionale e al margine settentrionale della Giordania: l’Auran, con i suoi villaggi costruiti in basalto, il monte dei Drusi e il Leja ancora un groviglio di lava."
  pl:
    - "Argob było okręgiem Baszanu, królestwa Oga na wschód od Jeziora Galilejskiego, pamiętanym z miast obwarowanych. Mojżesz przypomina, że Izrael wziął „sześćdziesiąt miast, wszystkę krainę Argob królestwa Ogowego w Basan” oraz że „Te wszystkie miasta opatrzone były murami wysokiemi, bramami, i zaworami, oprócz miasteczek murem nie obtoczonych bardzo wiele”. Region przypadł połowie pokolenia Manassesa, a „Jair, syn Manasesów, posiadł wszystkę krainę Argob aż do granicy Jessury i Machaty” i nazwał miasta od swego imienia. Za Salomona należał do szóstego okręgu, rządzonego z Ramot w Gileadzie przez Ben-Gebera: „sześćdziesiąt miast wielkich murowanych z zaworami miedzianemi”. Nazwę wyjaśnia się zwykle od hebrajskiego słowa oznaczającego bryłę ziemi, czyli kraj żyznej gleby."
    - "Gdzie w Baszanie leżało, nie wiadomo. Podróżnicy XIX wieku, zwłaszcza J. L. Porter, utożsamiali Argob z Leją, czarnym polem lawy na południowy wschód od Damaszku, którego bazaltowe wsie uważali za miasta olbrzymów Oga; późniejsi uczeni, jak G. A. Smith, nie znaleźli na to dowodów, równina jałowej skały słabo pasuje do nazwy żyznych brył, i wielu szuka raczej żyznego kraju pszenicy w Hauranie albo płaskowyżu między Jarmukiem a Leją. Żadne stanowisko nie było kopane jako miasto Argob, a mapa zaznacza region tylko w przybliżeniu. Argob wymieniony jest też obok Pekachiasza, ofiary Pekacha, w Księgach Królewskich, choć niejasne, czy to człowiek, czy miejsce."
    - "Ziemia ta to dziś muhafazy Daraa i Suwayda w południowej Syrii oraz północny skraj Jordanii: Hauran z wsiami budowanymi z bazaltu, góra Druzów i Leja, wciąż plątanina lawy."
  nl:
    - "Argob was een district van Basan, het koninkrijk van Og ten oosten van het Meer van Galilea, bekend om zijn ommuurde steden. Mozes herinnert eraan dat Israël “zestig steden, de ganse landstreek van Argob, het koninkrijk van Og in Bazan” nam, en dat “al die steden waren met hoge muren, poorten en grendelen gesterkt, behalve zeer vele onbemuurde steden”. De streek ging naar de halve stam Manasse, en “Jair, de zoon van Manasse, kreeg de ganse landstreek van Argob, tot aan de landpale der Gezurieten en Maachathieten”, en noemde de steden naar zichzelf. Onder Salomo behoorde het tot het zesde district, bestuurd vanuit Ramot in Gilead door Ben-Geber, “zestig grote steden, met muren en koperen grendelen”. De naam wordt gewoonlijk verklaard uit een Hebreeuws woord voor een kluit aarde, dat wil zeggen een land met rijke grond."
    - "Waar in Basan het lag, is niet bekend. Negentiende-eeuwse reizigers, vooral J. L. Porter, identificeerden Argob met de Leja, het zwarte lavaveld ten zuidoosten van Damascus, wier basaltdorpen zij voor de reuzensteden van Og hielden; latere geleerden zoals G. A. Smith vonden er geen bewijs voor, een vlakte van onvruchtbaar gesteente past slecht bij een naam van rijke kluiten, en velen zoeken liever in het vruchtbare tarweland van de Hauran of het plateau tussen de Yarmuk en de Leja. Nergens is een plaats als stad van Argob opgegraven, en de kaart markeert de streek slechts bij benadering. Een Argob wordt in Koningen ook genoemd naast Pekachja, het slachtoffer van Pekach, al is onduidelijk of het een man of een plaats is."
    - "Het land in kwestie is nu de gouvernementen Daraa en Suwayda in Zuid-Syrië en de noordrand van Jordanië: de Hauran, met zijn van basalt gebouwde dorpen, het Drusengebergte en de Leja, nog altijd een wirwar van lava."
  cs:
    - "Argob byl okrsek Bášanu, království Ogova východně od Galilejského jezera, pověstný svými opevněnými městy. Mojžíš připomíná, že Izrael dobyl „šedesáte měst, všecku krajinu Argob, království Oga v Bázan“ a že „Všecka ta města byla ohražená zdmi vysokými, branami a závorami, kromě měst otevřených, jichž bylo velmi mnoho“. Kraj připadl polovičnímu pokolení Manasesovu a „Jair, syn Manasse, vzal všecku krajinu Argob, až ku pomezí Gessuri a Machati“ a pojmenoval města po sobě. Za Šalomouna patřil k šestému okrsku spravovanému z Rámotu v Gileadu Ben-geberem, „šedesáte měst velikých hrazených a závřitých“. Jméno se obvykle vykládá z hebrejského slova pro hroudu země, tedy země bohaté půdy."
    - "Kde v Bášanu ležel, není známo. Cestovatelé 19. století, především J. L. Porter, ztotožnili Argob s Lejou, černým lávovým polem jihovýchodně od Damašku, jehož čedičové vesnice pokládali za obří města Ogova; pozdější badatelé jako G. A. Smith pro to nenašli doklad, pláň holé skály se ke jménu bohatých hrud sotva hodí, a mnozí hledí spíše k úrodnému pšeničnému kraji Havranu nebo na plošinu mezi Jarmúkem a Lejou. Žádné místo nebylo vykopáno jako město Argobu a mapa vyznačuje oblast jen přibližně. Argob je také jmenován vedle Pekachjáše, oběti Pekachovy, v Knihách královských, ač není jasné, zda jde o muže, či o místo."
    - "Dotčená země je dnes guvernoráty Dará a Suvajdá v jižní Sýrii a severním okrajem Jordánska: Havran s čedičovými vesnicemi, drúzská hora a Leja, dosud změť lávy."
  sv:
    - "Argov var ett distrikt i Bashan, Ogs rike öster om Galileiska sjön, ihågkommet för sina befästa städer. Mose påminner om att Israel intog ”sextio städer, hela landsträckan Argob, Ogs rike i Basan”, och att ”Alla dessa städer voro befästa med höga murar, med portar och bommar. Därtill kom en stor mängd småstäder.” Området gick till Manasses halva stam, och ”Jair, Manasses son, fick hela landsträckan Argob, ända till gesuréernas och maakatéernas område” och uppkallade städerna efter sig. Under Salomo hörde det till det sjätte distriktet, som styrdes från Ramot-Gilead av Ben-Gever, ”sextio stora städer med murar och kopparbommar”. Namnet förklaras vanligen av ett hebreiskt ord för en jordklump, det vill säga ett land med rik jord."
    - "Var i Bashan det låg är inte känt. Resenärer på 1800-talet, framför allt J. L. Porter, identifierade Argov med Leja, det svarta lavafältet sydost om Damaskus, vars basaltbyar de tog för Ogs jättestäder; senare forskare som G. A. Smith fann inget belägg för detta, en slätt av kal sten passar knappast ett namn om rika jordklumpar, och många söker i stället det bördiga vetelandet i Hauran eller platån mellan Yarmuk och Leja. Ingen plats har grävts ut som en stad i Argov, och kartan markerar området bara ungefärligt. Ett Argov nämns också bredvid Pekachs offer Pekachja i Konungaböckerna, men om det är en man eller en plats är oklart."
    - "Landet i fråga är i dag guvernementen Daraa och Suwayda i södra Syrien och Jordaniens norra kant: Hauran med sina basaltbyggda byar, Drusernas berg och Leja som ännu är ett vildnis av lava."
  nb:
    - "Argob var et distrikt i Basan, Ogs rike øst for Galileasjøen, kjent for sine befestede byer. Moses minnes at Israel tok «seksti byer, hele Argob-landet, Ogs rike i Basan», og at «Alle disse var faste byer med høie murer, dobbelte porter og bommer, foruten en stor mengde landsbyer». Området gikk til den halve Manasse stamme, og «Ja'ir, Manasses sønn, inntok hele Argob-landet like til gesurittenes og ma'akatittenes landemerker» og oppkalte byene etter seg selv. Under Salomo hørte det til det sjette distriktet, styrt fra Ramot-Gilead av Ben-Geber, «seksti store byer med murer og kobberbommer». Navnet forklares vanligvis ut fra et hebraisk ord for en jordklump, altså et land med rik jord."
    - "Hvor i Basan det lå, er ukjent. Reisende på 1800-tallet, først og fremst J. L. Porter, identifiserte Argob med Leja, det svarte lavafeltet sørøst for Damaskus, hvis basaltlandsbyer de tok for Ogs kjempebyer; senere forskere som G. A. Smith fant ingen støtte for dette, en slette av bar stein passer knapt til et navn om rike jordklumper, og mange ser i stedet mot det fruktbare hvetelandet Havran eller høysletten mellom Yarmuk og Leja. Ingen lokalitet er gravd ut som en by i Argob, og kartet markerer området bare omtrentlig. En Argob nevnes også ved siden av Pekahja, Pekas offer, i Kongebøkene, men om det er en mann eller et sted, er uklart."
    - "Landet det gjelder, er i dag guvernementene Daraa og Suwayda i Sør-Syria og nordkanten av Jordan: Havran, med sine basaltbygde landsbyer, drusernes fjell og Leja, fortsatt en floke av lava."
  tl:
    - "Ang Argob ay distrito ng Basan, ang kaharian ni Og sa silangan ng Dagat ng Galilea, na kilala sa mga bayan nitong may pader. Inaalala ni Moises na sinakop ng Israel ang “anim na pung bayan ang buong lupain ng Argob, ang kaharian ni Og, sa Basan”, at na “Ang lahat ng ito'y mga bayang nakukutaan ng matataas na kuta, na may mga pintuang-bayan at mga halang; bukod pa ang napakaraming mga bayan na walang kuta”. Napunta ito sa kalahating lipi ni Manases, at “Sinakop ni Jair na anak ni Manases ang buong lupain ng Argob, hanggang sa hangganan ng mga Gessureo at ng mga Machateo”, at ipinangalan niya sa sarili ang mga bayan. Sa ilalim ni Salomon, bahagi ito ng ikaanim na distrito ni Ben-geber sa Ramoth-galaad, “anim na pung malaking bayan na may mga kuta at mga halang na tanso”. Karaniwang hinango ang pangalan sa salitang Hebreo para sa bukol ng lupa, kaya lupang mayaman."
    - "Hindi alam kung saan sa Basan ito. Itinumbas ng mga manlalakbay noong ika-19 na siglo, lalo na si J. L. Porter, ang Argob sa Leja, ang itim na bukirang lava sa timog-silangan ng Damasco, na ang mga nayong basalto ay itinuring nilang mga lungsod na higante ni Og; walang nakita si G. A. Smith at ang mga kalaunang iskolar na patunay nito, ang kapatagan ng baog na bato ay hindi angkop sa pangalang mayamang lupa, at marami ang tumitingin sa halip sa mayabong na bukirang trigo ng Hauran o sa talampas sa pagitan ng Yarmuk at Leja. Walang lugar na hinukay bilang lungsod ng Argob, at tinatayang minamarkahan ng mapa ang rehiyon. Pinangalanan din ang isang Argob katabi ni Pekaia, biktima ni Peka, sa Mga Hari, bagaman hindi malinaw kung tao o lugar iyon."
    - "Ang lupaing tinutukoy ay ang Gobernorado ng Daraa at Suwayda sa timog Siria at hilagang gilid ng Jordan ngayon: ang Hauran, na may mga nayong itinayo sa basalto, ang bundok ng mga Druze at ang Leja na gusot pa rin ng lava."
  da:
    - "Argob var et distrikt i Basan, Ogs rige øst for Genesaret Sø, kendt for sine befæstede byer. Moses husker, at Israel indtog »Tresindstyve Stæder, hele Egnen Argob, som var Ogs Rige i Basan«, og at »Alle disse Stæder vare faste med høje Mure, dobbelte Porte og Stænger; desuden saare mange Stæder, som vare ubefæstede Byer«. Egnen gik til Manasse halve stamme, og »Jair, Manasse Søn, indtog hele Egnen Argob, indtil Gesuriternes og Maakathiternes Landemærke« og opkaldte byerne efter sig selv. Under Salomo hørte den til det sjette distrikt, styret fra Ramot i Gilead af Ben-Geber, »tresindstyve store Stæder med Mure og med Kobberstænger«. Navnet forklares sædvanligvis af et hebraisk ord for en jordklump, altså et land med rig jord."
    - "Hvor i Basan det lå, vides ikke. Rejsende i 1800-tallet, først og fremmest J. L. Porter, identificerede Argob med Leja, det sorte lavamark sydøst for Damaskus, hvis basaltlandsbyer de tog for Ogs kæmpebyer; senere forskere som G. A. Smith fandt intet belæg for dette, en slette af bar klippe passer næppe til et navn om rige jordklumper, og mange ser i stedet mod Haurans frugtbare hvedeland eller plateauet mellem Yarmuk og Leja. Intet sted er udgravet som en by i Argob, og kortet markerer egnen kun omtrentligt. En Argob nævnes også ved siden af Pekas offer Pekaja i Kongebøgerne, skønt det er uklart, om det er en mand eller et sted."
    - "Landet er i dag guvernementerne Daraa og Suwayda i det sydlige Syrien og Jordans nordkant: Hauran, med dets basaltbyggede landsbyer, drusernes bjerg og Leja, endnu et virvar af lava."
  sr:
    - "Аргов је био округ Васана, краљевства Огова источно од Галилејског мора, запамћен по зидинама својих градова. Мојсије се сећа да је Израиљ узео „шездесет градова, сав крај арговски, царство Ога у Васану“ и да „Сви ти градови беху утврђени зидом високим, вратима и преворницама, осим других места без зидова врло много“. Област је припала половини племена Манасијиног, а „Јаир син Манасијин узе сав крај арговски до међе гесурске и махатске“ и назвао градове по себи. Под Соломуном припадала је шестом округу, којим је из Рамота Галадског управљао Вен-Гевер: „шездесет великих градова са зидовима и преворницама бронзаним“. Име се обично објашњава од хебрејске речи за груду земље, то јест земља богатог тла."
    - "Где у Васану лежао, није познато. Путници 19. века, пре свих Џ. Л. Портер, поистоветили су Аргов са Леџом, црним лавним пољем југоисточно од Дамаска, чија су базалтна села сматрали дивовским градовима Ога; каснији научници као Џ. А. Смит нису нашли доказа за то, равница голе стене једва прилази имену богатих груда, а многи уместо тога гледају плодни пшенични крај Аврана или висораван између Јармука и Леџе. Ниједно налазиште није ископавано као град Аргова, а карта означава област само приближно. Аргов се именује и поред Фекајеве жртве Факије у Књигама о царевима, мада је нејасно да ли је то човек или место."
    - "Земља о којој је реч данас су гувернорати Дараа и Суваида у јужној Сирији и северни руб Јордана: Авран, са селима грађеним од базалта, планина Друза и Леџа, још увек плетиво лаве."
  hu:
    - "Argób Básán, Óg királyságának kerülete volt a Galileai-tengertől keletre, megerősített városairól emlékezetes. Mózes felidézi, hogy Izráel elfoglalta „hatvan várost, Argóbnak egész vidékét, a Básenbeli Ógnak országát”, és hogy „ezek a városok mind meg valának erősítve magas kőfalakkal, kapukkal és zárokkal, kivévén igen sok kerítetlen várost”. A vidék Manassé fél törzséhez került, és „Jair, Manassénak fia, kapta Argóbnak egész vidékét, a Gessuriták és Maakátiták határáig”, és a városokat a saját nevéről nevezte el. Salamon alatt a hatodik kerülethez tartozott, amelyet Rámót-Gileádból Ben-Geber kormányzott: „hatvan nagy város kőfallal és érczzárakkal megerősítve”. A nevet általában egy rögöt jelentő héber szóból magyarázzák, vagyis a termékeny föld országaként."
    - "Hogy Básánban hol feküdt, nem ismert. A 19. századi utazók, mindenekelőtt J. L. Porter, Argóbot a Lejával azonosították, a Damaszkusztól délkeletre fekvő fekete lávamezővel, amelynek bazaltfalvait Óg óriási városainak tartották; későbbi kutatók, például G. A. Smith nem találtak erre bizonyítékot, a terméketlen sziklasíkság aligha illik a termékeny rögök nevéhez, és sokan inkább a Hauran termékeny búzavidékén vagy a Jarmuk és a Leja közötti fennsíkon keresik. Egyetlen lelőhelyet sem ástak ki Argób városaként, a térkép a vidéket csak hozzávetőlegesen jelöli. A Királyok könyve Pekah áldozata, Pekahja mellett is megnevez egy Argóbot, bár nem világos, hogy férfi vagy hely."
    - "A szóban forgó terület ma Dél-Szíria Dara és Szuvejda kormányzósága, valamint Jordánia északi pereme: a Hauran bazalt építésű falvaival, a drúz hegység és a ma is lávatömbös Leja."
  fi:
    - "Argob oli Basanin, Oogin valtakunnan Galileanjärven itäpuolella, alue, jonka muistetaan muurein ympäröidyistä kaupungeistaan. Mooses muistuttaa, että Israel valloitti ”kuusikymmentä kaupunkia, koko Argobin seudun, Oogin valtakunnan Baasanissa”, ja että ”kaikki nämä kaupungit korkeilla muureilla, porteilla ja salvoilla varustettuja, ja sen lisäksi vielä suuren joukon linnoittamattomia pikkukaupunkeja”. Seutu joutui Manassen puolisukukunnalle, ja ”Jaair, Manassen poika, valtasi koko Argobin seudun aina gesurilaisten ja maakatilaisten alueeseen saakka” ja kutsui kaupungit oman nimensä mukaan. Salomon aikana se kuului kuudenteen piiriin, jota hallitsi Ramot-Gileadista Ben-Geber, ”kuusikymmentä suurta, muureilla ja vaskisalvoilla varustettua kaupunkia”. Nimi selitetään yleensä heprean mullan kokkaretta tarkoittavasta sanasta, siis rehevän maan maaksi."
    - "Missä Basanissa se sijaitsi, ei tiedetä. 1800-luvun matkailijat, ennen kaikkea J. L. Porter, samaistivat Argobin Lejaan, Damaskoksen kaakkoispuoliseen mustaan laavakenttään, jonka basalttikylät he katsoivat Oogin jättiläiskaupungeiksi; myöhemmät tutkijat kuten G. A. Smith eivät löytäneet tälle näyttöä, paljaan kallion tasanko tuskin sopii rehevien mullankokkareiden nimelle, ja monet katsovat sen sijaan Haurania, hedelmällistä vehnämaata, tai Jarmukin ja Lejan välistä ylängöä. Mitään kohdetta ei ole kaivettu Argobin kaupunkina, ja kartta merkitsee seudun vain likimääräisesti. Argob mainitaan myös Pekahin uhrin Pekahjan vieressä Kuningasten kirjoissa, vaikka on epäselvää, onko se mies vai paikka."
    - "Kyseinen maa on nykyisin Etelä-Syyrian Daran ja Suwaydan kuvernementit sekä Jordanian pohjoisreuna: Hauran basalttirakenteisine kylineen, Druusivuori ja Leja yhä laavan vyyhtinä."
  vi:
    - "Ạt-gốp là một quận của Ba-san, vương quốc của Óc phía đông Biển Ga-li-lê, được nhớ đến vì các thành có tường của nó. Môi-se nhắc lại rằng Y-sơ-ra-ên chiếm “sáu mươi cái thành và toàn miền Ạt-gốp, là nước của Óc trong xứ Ba-san”, và “Các thành nầy vốn là đồn lũy có vách cao, cửa và cây gài; cũng có lấy những thành không có vách rất nhiều”. Vùng này thuộc về nửa chi phái Ma-na-se, và “Giai-rơ, con trai Ma-na-se, chiếm lấy cả miền Ạt-gốp cho đến giới hạn dân Ghê-su-rít và Ma-ca-thít” và đặt tên các thành theo tên mình. Dưới thời Sa-lô-môn, nó thuộc quận thứ sáu, do Bên-Ghê-be cai trị từ Ra-mốt Ga-la-át, “sáu mươi thành lớn có tường thành và then cửa đồng”. Tên này thường được giải thích từ một từ Hê-bơ-rơ chỉ tảng đất, tức là một xứ có đất màu mỡ."
    - "Không biết nó nằm ở đâu trong Ba-san. Các du khách thế kỷ 19, nhất là J. L. Porter, đồng nhất Ạt-gốp với Leja, cánh đồng dung nham đen phía đông nam Đa-mách, mà các làng đá bazan của nó họ cho là các thành của người khổng lồ Óc; các học giả về sau như G. A. Smith không tìm thấy bằng chứng nào cho điều này, một đồng bằng đá cằn khó hợp với một cái tên có nghĩa là tảng đất màu mỡ, và nhiều người hướng đến vùng trồng lúa mì phì nhiêu Ha-vơ-ran hoặc cao nguyên giữa Yarmuk và Leja. Chưa có địa điểm nào được đào như một thành của Ạt-gốp, và bản đồ chỉ đánh dấu vùng này một cách gần đúng. Một Ạt-gốp cũng được nêu bên cạnh Phê-ca-hia, nạn nhân của Phê-ca, trong sách Các Vua, dù đó là người hay nơi thì không rõ."
    - "Vùng đất ấy ngày nay là các tỉnh Daraa và Suwayda ở miền nam Sy-ri và rìa bắc Gióc-đa-ni: Ha-vơ-ran, với những làng xây bằng đá bazan, núi người Druze và Leja vẫn là một mớ dung nham rối rắm."
  ro:
    - "Argob era un district al Basanului, regatul lui Og de la est de Marea Galileii, amintit pentru cetățile lui cu ziduri. Moise își amintește că Israel a luat „șasezeci de cetăți și toate cele de prin prejurul Argovului ale împăratului Og dela Vasan”, și că erau „Toate cetăți întărite, ziduri înalte, porți și zăvoare, afară de cetățile Ferezeilor cele multe foarte”. Regiunea a revenit jumătății de seminție a lui Manase, iar „Iair feciorul lui Manasì a luat toată laturea Argovului, până la hotarele Gargasii și ale Mahatii” și a numit cetățile după el. Sub Solomon aparținea celui de-al șaselea district, guvernat de la Ramot din Galaad de Ben-Gheber, cu „șasezeci de cetăți mari întărite și zăvoare de aramă”. Numele este explicat de obicei dintr-un cuvânt ebraic pentru bulgăre de pământ, adică o țară cu sol bogat."
    - "Unde se afla în Basan nu se știe. Călătorii din secolul al XIX-lea, mai ales J. L. Porter, au identificat Argobul cu Leja, câmpul negru de lavă de la sud-est de Damasc, ale cărui sate de bazalt le-au socotit cetățile uriașe ale lui Og; cercetători de mai târziu, ca G. A. Smith, nu au găsit nicio dovadă în acest sens, o câmpie de stâncă sterilă se potrivește greu cu un nume al bulgărilor bogați, iar mulți se uită în schimb la ținutul fertil de grâu al Haurânului sau la platoul dintre Yarmuk și Leja. Niciun loc nu a fost săpat ca oraș al Argobului, iar harta marchează regiunea doar aproximativ. Un Argob este numit și alături de Pecahia, victima lui Pecah, în Regi, deși nu este clar dacă este un om sau un loc."
    - "Ținutul este astăzi guvernoratele Daraa și Suwayda din sudul Siriei și marginea de nord a Iordaniei: Haurânul, cu satele lui construite din bazalt, muntele druzilor și Leja, încă un hățiș de lavă."
  bg:
    - "Аргов бил окръг на Васан, царството на Ог на изток от Галилейско езеро, запомнен със своите укрепени градове. Мойсей си спомня, че Израил превзел „шестдесет градове, всичката област на Аргов царството на Ога у Васан“ и че „Тези градове бяха всичките укрепени с високи стени, с врата и вереи; и освен тях твърде много неоградени градове“. Областта отишла на половината от племето на Манасия и „Яир синът Манасиин взе всичката област на Аргов до пределите на Гесурий и Маахатий“ и нарекъл градовете по името си. При Соломон тя принадлежала към шестия окръг, управляван от Рамот Галаадски от Бен-Гевер, „шестдесет големи градове с стени и медни вереи“. Името обикновено се обяснява от еврейска дума за буца пръст, тоест земя с богата почва."
    - "Къде във Васан е лежал, не се знае. Пътешествениците от XIX в., най-вече Дж. Л. Портър, отъждествявали Аргов с Леджа, черното лавово поле югоизточно от Дамаск, чиито базалтови селища смятали за градовете-гиганти на Ог; по-късни учени като Дж. А. Смит не намерили доказателства за това, равнина от безплодна скала едва ли подхожда на име с богати буци и мнозина гледат вместо това към плодородната пшенична земя на Хауран или платото между Ярмук и Леджа. Никое място не е разкопано като град на Аргов и картата отбелязва областта само приблизително. Аргов е назован и до Факия, жертвата на Факей, в Царе, макар да не е ясно дали е мъж или място."
    - "Разглежданата земя е днес мухафазите Дараа и Сувейда в южна Сирия и северният край на Йордания: Хауран с построените му от базалт села, Планината на друзите и Леджа, още сплетено лавово поле."
