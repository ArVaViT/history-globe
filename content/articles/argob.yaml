# Overview article (ADR 0007). Mainstream facts only; the region is unlocated, and the older identification with the Leja is given as superseded rather than refuted.
id: argob
place: a42a5b2
title:
  en: "Argob"
  ru: "Аргов"
  uk: "Аргов"
  es: "Argob"
  pt: "Argobe"
  de: "Argob"
  fr: "Argob"
body:
  en:
    - "Argob was a district of Bashan, the kingdom of Og east of the Sea of Galilee, remembered for its walled towns. Moses recalls that Israel took “threescore cities, all the region of Argob, the kingdom of Og in Bashan”, and that “all these cities were fenced with high walls, gates, and bars; beside unwalled towns a great many”. The region went to the half-tribe of Manasseh, and “Jair the son of Manasseh took all the country of Argob unto the coasts of Geshuri and Maachathi” and named the towns after himself. Under Solomon it belonged to the sixth district, governed from Ramoth-gilead by Ben-geber, “threescore great cities with walls and brasen bars”. The name is usually explained from a Hebrew word for a clod of earth, that is, a land of rich soil."
    - "Where in Bashan it lay is not known. Nineteenth-century travellers, above all J. L. Porter, identified Argob with the Leja, the black lava field south-east of Damascus, whose basalt villages they took for the giant cities of Og; most scholars since have doubted that a plain of barren rock could be a land of rich clods and look instead to the fertile wheat country of the Hauran or the plateau between the Yarmuk and the Leja. No site has been dug as a city of Argob, and the map marks the region only approximately. An Argob is also named beside Pekah's victim Pekahiah in Kings, though whether that is a man or a place is unclear."
    - "The land in question is today the Daraa and Suwayda governorates of southern Syria and the northern edge of Jordan: the Hauran, with its basalt-built villages, the Druze mountain and the Leja still a tangle of lava."
  ru:
    - "Аргов — область Васана, царства Ога к востоку от Галилейского моря, памятная своими укреплёнными городами. Моисей вспоминает, что Израиль взял «шестьдесят городов, всю область Аргов, царство Ога Васанского» и что «все эти города укреплены были высокими стенами, воротами и запорами, кроме городов неукрепленных, весьма многих». Область отошла половине колена Манассии, и «Иаир, сын Манассиин, взял всю область Аргов, до пределов Гесурских и Маахских» и назвал селения своим именем. При Соломоне она входила в шестой округ, которым правил из Рамофа Галаадского Бен-Гевер: «шестьдесят больших городов со стенами и медными затворами». Имя обычно выводят из еврейского слова, означающего ком земли, то есть земля с тучной почвой."
    - "Где именно в Васане она лежала, неизвестно. Путешественники XIX века, прежде всего Дж. Л. Портер, отождествляли Аргов с Леджей — чёрным лавовым полем к юго-востоку от Дамаска, чьи базальтовые селения они принимали за исполинские города Ога; большинство учёных с тех пор сомневаются, что равнина голого камня могла быть землёй тучных комьев, и ищут Аргов в хлебородном Хауране или на плато между Ярмуком и Леджей. Ни одно место не раскопано как город Аргова, и карта отмечает область лишь приблизительно. Некий Аргов назван и рядом с Факией, убитым Факеем, в книге Царств, но человек это или место — неясно."
    - "Эта земля сегодня — мухафазы Даръа и Эс-Сувайда на юге Сирии и северная окраина Иордании: Хауран с его селениями из базальта, Друзская гора и Леджа, по-прежнему нагромождение лавы."
  uk:
    - "Аргов був округом Башану, царства Ога на схід від Галілейського моря, відомим своїми мурованими містами. Мойсей згадує, що Ізраїль узяв «шістьдесять міст, вся полоса Аргоб, царство Огове в Базанї», і що «Всї міста сї були укріплені високими мурами, брамами й засувами; окрім того багацько міст неукріплених». Область дісталася половині племені Манасії, і «Яір Манассієнко взяв усю полосу Аргоб до границї Гезуріїв і Маакатіїв» та назвав міста за собою. За Соломона вона належала до шостого округу, яким з Рамоту Гілеадського правив Бен-Гевер: «шістьдесять великих городів з мурами й мідяними засовами». Назву зазвичай пояснюють від єврейського слова, що означає грудку землі, тобто край родючого ґрунту."
    - "Де в Башані він лежав, невідомо. Мандрівники XIX століття, передусім Дж. Л. Портер, ототожнювали Аргов із Леджею, чорним лавовим полем на південний схід від Дамаска, чиї базальтові села вони вважали велетенськими містами Ога; більшість учених відтоді сумнівалися, що рівнина безплідної скелі могла бути краєм родючих грудок, і шукають натомість родючий пшеничний край Хавран або плато між Ярмуком і Леджею. Жодне місце не розкопували як місто Аргова, і мапа позначає область лише приблизно. Аргов названо також поруч із Факією, жертвою Факея, у книгах Царів, хоча чи це людина, чи місце, неясно."
    - "Ця земля нині — мухафази Дераа і Сувейда в південній Сирії та північний край Йорданії: Хавран з базальтовими селами, Друзька гора і Леджа, досі плутанина лави."
  es:
    - "Argob era un distrito de Basán, el reino de Og al este del mar de Galilea, recordado por sus ciudades amuralladas. Moisés recuerda que Israel tomó «sesenta ciudades, toda la tierra de Argob, del reino de Og en Basán», y que «Todas éstas eran ciudades fortalecidas con alto muro, con puertas y barras; sin otras muy muchas ciudades sin muro». La región correspondió a la media tribu de Manasés, y «Jair hijo de Manasés tomó toda la tierra de Argob hasta el término de Gessuri y Machâti» y puso a las ciudades su propio nombre. Bajo Salomón pertenecía al sexto distrito, gobernado desde Ramot de Galaad por Ben-geber, con «sesenta grandes ciudades con muro y cerraduras de bronce». El nombre suele explicarse a partir de una palabra hebrea para el terrón de tierra, es decir, una tierra de suelo rico."
    - "No se sabe dónde, en Basán, estaba. Los viajeros del siglo XIX, sobre todo J. L. Porter, identificaron Argob con el Leja, el campo de lava negra al sudeste de Damasco, cuyas aldeas de basalto tomaron por las ciudades gigantes de Og; la mayoría de los estudiosos desde entonces han dudado de que una llanura de roca estéril pudiera ser una tierra de ricos terrones y miran más bien a la fértil región triguera del Haurán o a la meseta entre el Yarmuk y el Leja. Ningún sitio ha sido excavado como ciudad de Argob, y el mapa señala la región solo de manera aproximada. También se nombra un Argob junto a Pekaía, víctima de Peka, en Reyes, aunque no está claro si es un hombre o un lugar."
    - "La tierra en cuestión es hoy las gobernaciones de Daraa y Suwayda, en el sur de Siria, y el borde septentrional de Jordania: el Haurán, con sus aldeas construidas de basalto, la montaña drusa y el Leja, todavía un enredo de lava."
  pt:
    - "Argobe era um distrito de Basã, o reino de Ogue a leste do mar da Galileia, lembrado por suas cidades muradas. Moisés recorda que Israel tomou “sessenta cidades, toda a região de Argobe, o reino de Ogue em Basã”, e que “Todas estas eram cidades fortificadas com altos muros, portões e trancas, além de muitíssimas aldeias sem muros”. A região coube à meia tribo de Manassés, e “Jair, filho de Manassés, tomou toda a região de Argobe, até a fronteira dos gesuritas e dos maacatitas” e deu às cidades o seu nome. Sob Salomão pertencia ao sexto distrito, governado de Ramote-Gileade por Ben-Geber, “sessenta grandes cidades com muros e trancas de bronze”. O nome costuma ser explicado a partir de uma palavra hebraica para torrão de terra, isto é, uma terra de solo rico."
    - "Onde ficava em Basã não se sabe. Viajantes do século XIX, sobretudo J. L. Porter, identificaram Argobe com o Leja, o campo de lava negra a sudeste de Damasco, cujas aldeias de basalto tomaram pelas cidades gigantes de Ogue; a maioria dos estudiosos desde então duvida de que uma planície de rocha estéril pudesse ser uma terra de ricos torrões e olha antes para a fértil região de trigo do Haurã ou para o planalto entre o Yarmuk e o Leja. Nenhum sítio foi escavado como cidade de Argobe, e o mapa marca a região apenas de modo aproximado. Um Argobe também é nomeado em Reis ao lado de Pecaías, vítima de Peca, embora não esteja claro se é um homem ou um lugar."
    - "A terra em questão é hoje as províncias de Daraa e Suwayda, no sul da Síria, e a borda setentrional da Jordânia: o Haurã, com suas aldeias de basalto, a montanha drusa e o Leja, ainda um emaranhado de lava."
  de:
    - "Argob war ein Bezirk Baschans, des Königreichs Ogs östlich des Sees Genezareth, bekannt für seine ummauerten Städte. Mose erinnert, Israel habe genommen „sechzig Städte, die ganze Gegend Argob, das Königreich Ogs von Basan“, und „alle diese Städte waren fest mit hohen Mauern, Toren und Riegeln, außer sehr vielen anderen Flecken ohne Mauern“. Die Gegend fiel an den halben Stamm Manasse, und „Jair, der Sohn Manasses, nahm die ganze Gegend Argob bis an die Grenze der Gessuriter und Maachathiter“ und benannte die Orte nach sich. Unter Salomo gehörte sie zum sechsten Bezirk, von Ramot in Gilead aus durch Ben-Geber verwaltet, „sechzig große Städte, vermauert und mit ehernen Riegeln“. Der Name wird gewöhnlich von einem hebräischen Wort für Erdscholle abgeleitet, also ein Land fruchtbaren Bodens."
    - "Wo in Baschan es lag, ist nicht bekannt. Reisende des 19. Jahrhunderts, vor allem J. L. Porter, setzten Argob mit der Leja gleich, dem schwarzen Lavafeld südöstlich von Damaskus, dessen Basaltdörfer sie für die Riesenstädte Ogs hielten; die meisten Gelehrten haben seither bezweifelt, dass eine Ebene aus kahlem Fels ein Land fruchtbarer Schollen sein könne, und blicken stattdessen auf das fruchtbare Weizenland des Hauran oder die Hochebene zwischen Jarmuk und Leja. Keine Stätte wurde als Stadt Argobs ausgegraben, und die Karte markiert die Gegend nur ungefähr. Ein Argob wird in den Königsbüchern auch neben Pekachja genannt, dem Opfer Pekachs, doch ist unklar, ob es ein Mann oder ein Ort ist."
    - "Das fragliche Land sind heute die Gouvernements Daraa und Suwaida im Süden Syriens und der Nordrand Jordaniens: der Hauran mit seinen Dörfern aus Basalt, das Drusengebirge und die Leja, noch immer ein Gewirr aus Lava."
  fr:
    - "Argob était un district de Basan, le royaume d’Og à l’est de la mer de Galilée, resté célèbre pour ses villes fortifiées. Moïse rappelle qu’Israël prit « soixante villes, toute la contrée d’Argob, le royaume d’Og en Basan », et que « Toutes ces villes étaient fortifiées, avec de hautes murailles, des portes et des barres ; il y avait aussi des villes sans murailles en très grand nombre ». La région revint à la demi-tribu de Manassé, et « Jaïr, fils de Manassé, prit toute la contrée d’Argob jusqu’à la frontière des Gueschuriens et des Maacathiens » et donna son nom aux bourgs. Sous Salomon, elle appartenait au sixième district, gouverné depuis Ramoth en Galaad par Ben-Guéber, « soixante grandes villes à murailles et à barres d’airain ». Le nom s’explique d’ordinaire par un mot hébreu désignant une motte de terre, c’est-à-dire un pays de sol riche."
    - "On ignore où, en Basan, il se trouvait. Les voyageurs du XIXe siècle, surtout J. L. Porter, identifièrent Argob au Léja, le champ de lave noire au sud-est de Damas, dont ils prirent les villages de basalte pour les villes géantes d’Og ; la plupart des savants depuis en ont douté, une plaine de roche stérile ne pouvant être un pays de riches mottes, et regardent plutôt la fertile région à blé du Havran ou le plateau entre le Yarmouk et le Léja. Aucun site n’a été fouillé comme ville d’Argob, et la carte ne marque la région que de façon approximative. Un Argob est aussi nommé à côté de Pekachja, victime de Péka, dans les Rois, sans que l’on sache s’il s’agit d’un homme ou d’un lieu."
    - "Le pays en question correspond aujourd’hui aux gouvernorats de Deraa et de Soueïda, dans le sud de la Syrie, et à la lisière nord de la Jordanie : le Havran, avec ses villages bâtis en basalte, la montagne druze et le Léja, encore un chaos de lave."
