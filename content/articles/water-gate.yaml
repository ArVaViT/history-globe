# Overview article (ADR 0007). Mainstream facts only; the gate is unlocated; the Temple's own Water Gate in the Mishnah is distinguished; Eilat Mazar's gatehouse is reported as her suggestion.
id: water-gate
place: a0293ff
title:
  en: "Water Gate"
  ru: "Водяные ворота"
  uk: "Водяні ворота"
  es: "Puerta de las Aguas"
  pt: "Porta das Águas"
  de: "Wassertor"
  fr: "Porte des Eaux"
  pl: "Brama Wodna"
  it: "Porta delle Acque"
  nl: "Waterpoort"
  cs: "Vodní brána"
body:
  en:
    - "The Water Gate was a gate on the east side of Jerusalem in Nehemiah's day, on the slope of the City of David above the Gihon spring, from which it must have taken its name: the way the water carriers came up from the city's spring. Nehemiah's account of the wall places it after the Fountain Gate and the stairs of the City of David, where the Nethinim who dwelt in Ophel repaired “unto the place over against the water gate toward the east, and the tower that lieth out”; the temple servants lived near it, close to the water they fetched. The gate itself is not said to have been repaired, and since Nehemiah's wall ran along the crest of the ridge, leaving the spring outside, many think it was by then an inner gate in the old wall further down the slope."
    - "The square before it is the scene of the great reading of the Law. On the first day of the seventh month “all the people gathered themselves together as one man into the street that was before the water gate”, and Ezra read “from the morning until midday, before the men and the women, and those that could understand”, standing on a wooden pulpit, while the Levites “gave the sense, and caused them to understand the reading”. The people wept, were told to rejoice, and kept the Feast of Tabernacles in booths “in the street of the water gate, and in the street of the gate of Ephraim”. At the dedication of the wall one of the two processions went up “by the stairs of the city of David, at the going up of the wall, above the house of David, even unto the water gate eastward”."
    - "The Mishnah names a Water Gate among the gates of the Second Temple court, through which the water for the libation of Tabernacles was brought in; that is a different gate, inside the sanctuary. Kathleen Kenyon's trench on the eastern slope in the 1960s and Benjamin and Eilat Mazar's work on the Ophel in 1986–1987, which uncovered a gatehouse of the First Temple period that Eilat Mazar suggested was the Water Gate, are the nearest archaeology has come; the gate has not been found. The slope is now part of the City of David archaeological park beside the village of Silwan."
  ru:
    - "Водяные ворота были воротами на восточной стороне Иерусалима во дни Неемии, на склоне города Давидова над источником Гион, от которого они, должно быть, и получили имя: этим путём водоносы поднимались от городского источника. Рассказ Неемии о стене ставит их после ворот Источника и ступеней города Давидова, где нефинеи, жившие в Офеле, «починили напротив Водяных ворот к востоку и до выступающей башни»; храмовые служители жили рядом, близко к воде, которую носили. О починке самих ворот не сказано, и, поскольку стена Неемии шла по гребню хребта, оставляя источник снаружи, многие думают, что ворота к тому времени были внутренними, в старой стене ниже по склону."
    - "Площадь перед ними — место великого чтения Закона. В первый день седьмого месяца «собрался весь народ, как один человек, на площадь, которая пред Водяными воротами», и Ездра читал «от рассвета до полудня, пред мужчинами и женщинами и всеми, которые могли понимать», стоя на деревянном возвышении, а левиты «присоединяли толкование, и народ понимал прочитанное». Народ плакал, ему велели радоваться, и праздник Кущей справляли в кущах «на площади у Водяных ворот, и на площади у Ефремовых ворот». При освящении стены одно из двух шествий взошло «по ступеням города Давидова, по лестнице, ведущей на стену сверх дома Давидова до Водяных ворот к востоку»."
    - "Мишна называет Водяные ворота среди ворот двора Второго храма, через которые вносили воду для возлияния на Кущи; это другие ворота, внутри святилища. Траншея Кэтлин Кеньон на восточном склоне в 1960-х годах и работы Биньямина и Эйлат Мазар на Офеле в 1986–1987 годах, открывшие привратное здание времён Первого храма, в котором Эйлат Мазар предположила Водяные ворота, — самое близкое, к чему подошла археология; сами ворота не найдены. Склон теперь входит в археологический парк «Город Давида» рядом с деревней Силуан."
  uk:
    - "Водяні ворота були брамою на східному боці Єрусалима за днів Неемії, на схилі Міста Давида над джерелом Гіхон, від якого вона, певно, й дістала назву: шляхом, яким водоноси здіймалися від міського джерела. Розповідь Неемії про мур ставить її після Криничаних воріт і сходів Міста Давида, де нетинеї, що жили в Офелі, робили «проти Водяних воріт на схід і до виступаючої башти»; храмові слуги жили поблизу, близько до води, яку носили. Про саму браму не сказано, що її лагодили, і оскільки мур Неемії йшов по гребеню пасма, лишаючи джерело поза собою, багато хто думає, що вона тоді була вже внутрішньою брамою в старому мурі нижче по схилу."
    - "Площа перед нею — місце великого читання Закону. Першого дня сьомого місяця «зібрався ввесь народ, як один чоловік, на майданї, що перед Водяними ворітьми», і Ездра читав «як почало свитати, до пів дня, перед чоловіками і жінками й усїма, що могли втямити», стоячи на дерев’яному помості, а левити «читали … виразно і втямливо, а народ розумів прочитане». Народ плакав, йому веліли радіти, і він святкував свято Кущів у наметах «на майданї коло воріт Водяних, і на майданї коло воріт Ефраїмових». На освяченні муру одна з двох процесій піднялася, «вийшли вони по ступенях міста Давидового сходами, що йшли на мур понад домом Давидовим, до Водяних воріт ік сходу»."
    - "Мішна називає Водяні ворота серед воріт подвір’я Другого храму, крізь які вносили воду для узливання на свято Кущів; це інша брама, всередині святині. Траншея Кетлін Кеньйон на східному схилі в 1960-х роках і роботи Веніаміна й Ейлат Мазар на Офелі в 1986–1987 роках, що відкрили надбрамну споруду часів Першого храму, яку Ейлат Мазар вважала Водяними воротами, — найближче, до чого дійшла археологія; браму не знайдено. Схил нині входить до археологічного парку Міста Давида біля села Сільван."
  es:
    - "La Puerta de las Aguas era una puerta del lado oriental de Jerusalén en tiempos de Nehemías, en la ladera de la Ciudad de David sobre la fuente de Gihón, de la que debió de tomar su nombre: el camino por el que los aguadores subían desde la fuente de la ciudad. El relato de la muralla de Nehemías la sitúa después de la Puerta de la Fuente y las gradas de la Ciudad de David, donde los netineos que habitaban en Ofel repararon «hasta enfrente de la puerta de las Aguas al oriente, y la torre que sobresalía»; los servidores del templo vivían cerca de ella, junto al agua que acarreaban. No se dice que la puerta misma fuera reparada, y como la muralla de Nehemías corría por la cresta de la colina dejando la fuente fuera, muchos piensan que era entonces una puerta interior de la muralla antigua, más abajo en la ladera."
    - "La plaza ante ella es el escenario de la gran lectura de la Ley. El primer día del mes séptimo, «juntóse todo el pueblo como un solo hombre en la plaza que está delante de la puerta de las Aguas», y Esdras leyó «desde el alba hasta el medio día, en presencia de hombres y mujeres y entendidos», de pie sobre un púlpito de madera, mientras los levitas «ponían el sentido, de modo que entendiesen la lectura». El pueblo lloró, se le dijo que se regocijara, y celebró la fiesta de los Tabernáculos en cabañas «en la plaza de la puerta de las Aguas, y en la plaza de la puerta de Ephraim». En la dedicación de la muralla los de una de las dos procesiones «subieron por las gradas de la ciudad de David, por la subida del muro, desde la casa de David hasta la puerta de las Aguas al oriente»."
    - "La Misná nombra una Puerta de las Aguas entre las puertas del atrio del Segundo Templo, por la cual se introducía el agua para la libación de los Tabernáculos; esa es una puerta distinta, dentro del santuario. La zanja de Kathleen Kenyon en la ladera oriental en los años 1960 y los trabajos de Benjamin y Eilat Mazar en el Ofel en 1986–1987, que sacaron a la luz una puerta con edificio de guardia del período del Primer Templo que Eilat Mazar sugirió que era la Puerta de las Aguas, son lo más cerca que ha llegado la arqueología; la puerta no se ha hallado. La ladera forma hoy parte del parque arqueológico de la Ciudad de David, junto a la aldea de Silwan."
  pt:
    - "A Porta das Águas era uma porta no lado leste de Jerusalém nos dias de Neemias, na encosta da Cidade de Davi acima da fonte de Giom, da qual deve ter tirado o nome: o caminho por onde os carregadores de água subiam da fonte da cidade. O relato da muralha em Neemias a situa depois da Porta da Fonte e dos degraus da Cidade de Davi, onde os servos do templo que moravam em Ofel repararam “até o lugar em frente à Porta das Águas, em direção ao leste, e à torre que se projeta”; os servos do templo viviam perto dela, junto à água que buscavam. Não se diz que a porta tenha sido reparada, e, como a muralha de Neemias corria pelo alto da serra, deixando a fonte fora, muitos pensam que já era então uma porta interna na muralha antiga, mais abaixo na encosta."
    - "A praça diante dela é o cenário da grande leitura da Lei. No primeiro dia do sétimo mês, “Todo o povo se reuniu como um só homem na praça que ficava em frente à Porta das Águas”, e Esdras leu “desde o amanhecer até o meio-dia, na presença dos homens e das mulheres, e daqueles que podiam entender”, de pé numa tribuna de madeira, enquanto os levitas “deram o sentido, de modo que o povo entendesse a leitura”. O povo chorou, foi mandado alegrar-se e celebrou a Festa dos Tabernáculos em abrigos “na praça da Porta das Águas e na praça da Porta de Efraim”. Na dedicação da muralha, uma das duas procissões subiu “pelas escadas da Cidade de Davi, na subida da muralha, acima da casa de Davi, até a Porta das Águas, para o leste”."
    - "A Mixná nomeia uma Porta das Águas entre as portas do pátio do Segundo Templo, por onde se trazia a água para a libação dos Tabernáculos; é outra porta, dentro do santuário. A trincheira de Kathleen Kenyon na encosta oriental nos anos 1960 e o trabalho de Benjamin e Eilat Mazar em Ofel em 1986–1987, que revelou uma guarita do período do Primeiro Templo que Eilat Mazar sugeriu ser a Porta das Águas, são o mais perto que a arqueologia chegou; a porta não foi encontrada. A encosta é hoje parte do parque arqueológico da Cidade de Davi, junto à aldeia de Silwan."
  de:
    - "Das Wassertor war zu Nehemias Zeit ein Tor an der Ostseite Jerusalems, am Hang der Davidsstadt oberhalb der Gihonquelle, von der es seinen Namen haben muss: der Weg, auf dem die Wasserträger von der Quelle der Stadt heraufkamen. Nehemias Bericht über die Mauer setzt es nach dem Quelltor und den Stufen der Davidsstadt an, wo die Tempelknechte „am Ophel bis an das Wassertor gegen Morgen, da der Turm heraussieht“ wohnten, also nahe dem Wasser, das sie holten. Vom Tor selbst heißt es nicht, dass es ausgebessert wurde, und da Nehemias Mauer auf dem Kamm des Höhenzugs verlief und die Quelle draußen ließ, halten es viele für ein inzwischen inneres Tor in der alten Mauer weiter unten am Hang."
    - "Der Platz davor ist Schauplatz der großen Verlesung des Gesetzes. Am ersten Tag des siebten Monats „versammelte sich das ganze Volk wie ein Mann auf die breite Gasse vor dem Wassertor“, und Esra las „vom lichten Morgen an bis auf den Mittag, vor Mann und Weib und wer's vernehmen konnte“, auf einem „hölzernen, hohen Stuhl“ stehend, während die Leviten es „klar und verständlich“ lasen, „daß man verstand, was gelesen ward“. Das Volk weinte, wurde zur Freude aufgefordert und feierte das Laubhüttenfest in Hütten „auf der breiten Gasse am Wassertor und auf der breiten Gasse am Tor Ephraim“. Bei der Einweihung der Mauer zog eine der beiden Prozessionen „auf den Stufen zur Stadt Davids, die Mauer hinauf zu dem Hause Davids hinan und bis an das Wassertor gegen Morgen“."
    - "Die Mischna nennt ein Wassertor unter den Toren des Vorhofs des Zweiten Tempels, durch das das Wasser für das Trankopfer des Laubhüttenfests hereingebracht wurde; das ist ein anderes Tor, innerhalb des Heiligtums. Kathleen Kenyons Schnitt am Osthang in den 1960er Jahren und Benjamin und Eilat Mazars Arbeit am Ofel 1986–1987, die ein Torhaus der Zeit des Ersten Tempels freilegte, das Eilat Mazar für das Wassertor hielt, sind das Nächste, was die Archäologie erreicht hat; das Tor ist nicht gefunden. Der Hang gehört heute zum archäologischen Park der Davidsstadt neben dem Dorf Silwan."
  fr:
    - "La Porte des Eaux était une porte du côté est de Jérusalem à l’époque de Néhémie, sur la pente de la Cité de David au-dessus de la source de Guihon, dont elle a dû tirer son nom : le chemin par où les porteurs d’eau montaient de la source de la ville. Le récit du mur par Néhémie la place après la Porte de la Source et les degrés de la Cité de David, où les Néthiniens qui habitaient Ophel travaillèrent « jusque vis-à-vis de la porte des eaux, à l’orient, et de la tour en saillie » ; les serviteurs du Temple habitaient près d’elle, près de l’eau qu’ils allaient chercher. On ne dit pas que la porte elle-même ait été réparée, et comme le mur de Néhémie courait sur la crête de la colline, laissant la source à l’extérieur, beaucoup pensent qu’elle était alors une porte intérieure de l’ancien mur plus bas sur la pente."
    - "La place devant elle est la scène de la grande lecture de la Loi. Le premier jour du septième mois, « tout le peuple s’assembla comme un seul homme sur la place qui est devant la porte des eaux », et Esdras lut « depuis le matin jusqu’au milieu du jour … en présence des hommes et des femmes et de ceux qui étaient capables de l’entendre », debout sur une estrade de bois, tandis que les lévites « en donnaient le sens pour faire comprendre ce qu’ils avaient lu ». Le peuple pleura, reçut l’ordre de se réjouir et célébra la fête des Tabernacles sous des tentes « sur la place de la porte des eaux et sur la place de la porte d’Éphraïm ». À la dédicace du mur, l’un des deux cortèges monta « les degrés de la cité de David par la montée de la muraille, au-dessus de la maison de David, jusqu’à la porte des eaux, vers l’orient »."
    - "La Mishna nomme une Porte des Eaux parmi les portes du parvis du Second Temple, par laquelle on introduisait l’eau pour la libation des Tabernacles ; c’est une autre porte, à l’intérieur du sanctuaire. La tranchée de Kathleen Kenyon sur la pente orientale dans les années 1960 et les travaux de Benjamin et Eilat Mazar sur l’Ophel en 1986-1987, qui dégagèrent une porterie de l’époque du Premier Temple qu’Eilat Mazar proposa d’identifier à la Porte des Eaux, sont ce dont l’archéologie s’est approchée le plus ; la porte n’a pas été trouvée. La pente fait aujourd’hui partie du parc archéologique de la Cité de David, à côté du village de Silwan."
  pl:
    - "Brama Wodna była bramą po wschodniej stronie Jerozolimy za czasów Nehemiasza, na stoku Miasta Dawida nad źródłem Gichon, od którego musiała wziąć nazwę: tędy nosiciele wody wchodzili od miejskiego źródła. Relacja Nehemiasza o murze umieszcza ją po Bramie Źródlanej i schodach Miasta Dawida, gdzie Netynejczycy mieszkający w Ofelu naprawiali: „poprawiali aż na przeciwko bramie wodnej na wschód słońca, i wieży wysokiej”; słudzy świątyni mieszkali blisko niej, przy wodzie, którą nosili. Nie mówi się, by sama brama była naprawiana, a ponieważ mur Nehemiasza biegł wzdłuż grzbietu wzgórza, zostawiając źródło na zewnątrz, wielu sądzi, że była już wtedy bramą wewnętrzną w dawnym murze niżej na stoku."
    - "Plac przed nią jest sceną wielkiego czytania Prawa. Pierwszego dnia siódmego miesiąca „Zebrał się tedy wszystek lud jednostajnie na ulicę, która jest przed bramą wodną”, a Ezdrasz czytał „od poranku aż do południa przed mężami i niewiastami, i którzy zrozumieć mogli”, stojąc na drewnianej kazalnicy, podczas gdy Lewici, jak czytamy, „wykładając zmysł objaśniali to, co czytali”. Lud płakał, kazano mu się radować i obchodził święto Namiotów w szałasach „i na ulicy bramy wodnej, i na ulicy bramy Efraimowej”. Przy poświęceniu muru jedna z dwóch procesji, jak czytamy, „wstępowali po schodach miasta Dawidowego, którędy chodzą na mur, a od muru przy domu Dawidowym aż do bramy wodnej na wschód słońca”."
    - "Miszna wymienia Bramę Wodną wśród bram dziedzińca Drugiej Świątyni, przez którą wnoszono wodę do libacji święta Namiotów; to inna brama, wewnątrz sanktuarium. Wykop Kathleen Kenyon na wschodnim stoku w latach sześćdziesiątych oraz prace Binjamina i Ejlat Mazarów na Ofelu w latach 1986–1987, które odsłoniły budynek bramny z okresu Pierwszej Świątyni, w którym Ejlat Mazar widziała Bramę Wodną, są najbliższym punktem, do którego doszła archeologia; bramy nie odnaleziono. Stok jest dziś częścią parku archeologicznego Miasta Dawida obok wsi Silwan."
  it:
    - "La Porta delle Acque era una porta sul lato orientale di Gerusalemme ai tempi di Neemia, sul pendio della Città di Davide sopra la sorgente di Ghicon, da cui deve aver preso il nome: la via per cui i portatori d’acqua salivano dalla sorgente della città. Il racconto di Neemia sul muro la pone dopo la Porta della Fonte e la scalinata della Città di Davide, dove i Netinei che abitavano sull’Ofel restaurarono «fino dirimpetto alla porta delle Acque, verso oriente, e dirimpetto alla torre sporgente»; i servi del tempio abitavano vicino a essa, presso l’acqua che attingevano. Della porta stessa non si dice che sia stata riparata, e poiché il muro di Neemia correva lungo la cresta del crinale, lasciando fuori la sorgente, molti pensano che fosse ormai una porta interna nel vecchio muro più in basso sul pendio."
    - "La piazza davanti a essa è la scena della grande lettura della Legge. Il primo giorno del settimo mese «tutto il popolo si radunò come un sol uomo sulla piazza ch’è davanti alla porta delle Acque», ed Esdra lesse «dalla mattina presto fino a mezzogiorno, in presenza degli uomini, delle donne, e di quelli ch’eran capaci d’intendere», stando su una tribuna di legno, mentre i Leviti «ne davano il senso, per far capire al popolo quel che s’andava leggendo». Il popolo pianse, fu invitato a rallegrarsi, e celebrò la festa delle Capanne nelle capanne «sulla piazza della porta delle Acque, e sulla piazza della porta d’Efraim». Alla dedicazione del muro quelli di una delle due processioni «montarono, dirimpetto a loro la scalinata della città di Davide, là dove le mura salgono al disopra del livello della casa di Davide, e giunsero alla porta delle Acque, a oriente»."
    - "La Mishnà nomina una Porta delle Acque fra le porte del cortile del Secondo Tempio, da cui entrava l’acqua per la libazione della festa delle Capanne; è una porta diversa, dentro il santuario. La trincea di Kathleen Kenyon sul pendio orientale negli anni 1960 e il lavoro di Benjamin ed Eilat Mazar sull’Ofel nel 1986–1987, che portò alla luce un edificio di porta del periodo del Primo Tempio che Eilat Mazar propose fosse la Porta delle Acque, sono quanto di più vicino l’archeologia abbia raggiunto; la porta non è stata trovata. Il pendio fa oggi parte del parco archeologico della Città di Davide accanto al villaggio di Silwan."
  nl:
    - "De Waterpoort was een poort aan de oostzijde van Jeruzalem in de dagen van Nehemia, op de helling van de Stad van David boven de Gihonbron, waaraan ze haar naam moet hebben ontleend: de weg waarlangs de waterdragers van de bron van de stad omhoogkwamen. Het verslag van Nehemia over de muur plaatst haar na de Bronpoort en de trappen van de Stad van David, waar de Nethinim die in Ofel woonden de muur herstelden “tot tegenover de Waterpoort aan het oosten, en den uitstekenden toren”; de tempeldienaren woonden in de buurt, dicht bij het water dat zij haalden. Van de poort zelf wordt niet gezegd dat ze werd hersteld, en omdat de muur van Nehemia langs de kam van de bergrug liep en de bron buiten liet, denken velen dat ze toen een binnenpoort was in de oude muur verder langs de helling."
    - "Het plein ervoor is het toneel van de grote voorlezing van de Wet. Op de eerste dag van de zevende maand “verzamelde zich al het volk als een enig man op de straat voor de Waterpoort”, en Ezra las “van het morgen licht aan tot op den middag, voor de mannen en vrouwen, en de verstandigen”, staande op een houten spreekgestoelte, terwijl de Levieten “den zin verklarende, zo maakten zij, dat men het verstond in het lezen”. Het volk weende, kreeg te horen zich te verheugen, en vierde het Loofhuttenfeest in hutten “op de straat der Waterpoort, en op de straat van Efraimspoort”. Bij de inwijding van de muur ging een van de twee optochten omhoog “bij de trappen van Davids stad, door den opgang des muurs, boven Davids huis, tot aan de Waterpoort, tegen het oosten”."
    - "De Misjna noemt een Waterpoort onder de poorten van het hof van de Tweede Tempel, waardoor het water voor de plengoffers van het Loofhuttenfeest werd binnengebracht; dat is een andere poort, binnen het heiligdom. De proefsleuf van Kathleen Kenyon op de oosthelling in de jaren 1960 en het werk van Benjamin en Eilat Mazar op de Ofel in 1986–1987, dat een poortgebouw uit de tijd van de Eerste Tempel blootlegde dat Eilat Mazar voorstelde als de Waterpoort, zijn het dichtst dat de archeologie is gekomen; de poort is niet gevonden. De helling maakt nu deel uit van het archeologisch park van de Stad van David naast het dorp Silwan."
  cs:
    - "Vodní brána byla brána na východní straně Jeruzaléma v Nehemjášově době, na svahu Města Davidova nad pramenem Gichón, podle něhož musela mít své jméno: cesta, kterou vodonoši stoupali od městského pramene. Nehemjášův popis hradby ji klade za Pramennou bránu a schody Města Davidova, kde Netínejci, kteří bydleli v Ofelu, opravovali „až naproti bráně vodné k východu, a věži vysoké“; chrámoví služebníci bydleli poblíž, blízko vody, kterou nosili. O samotné bráně se neříká, že byla opravena, a protože Nehemjášova hradba vedla po hřebeni a pramen zůstával venku, mnozí soudí, že tehdy byla vnitřní branou ve staré hradbě dále dolů po svahu."
    - "Náměstí před ní je dějištěm velkého čtení Zákona. Prvního dne sedmého měsíce se „shromáždil všecken lid jednomyslně do ulice, kteráž jest proti bráně vodné“ a Ezdráš četl „od jitra až do poledne, při přítomnosti mužů i žen, i kteřížkoli rozuměti mohli“, stoje na dřevěné kazatelně, zatímco leviti „vykládajíce smysl, vysvětlovali to, což čtli“. Lid plakal, bylo mu řečeno, aby se radoval, a slavil svátek stánků ve stáncích „i v ulici brány vodné, i v ulici brány Efraim“. Při vysvěcení hradby jeden ze dvou průvodů šel nahoru „po stupních města Davidova, kudy se chodí na zed, a ode zdi při domě Davidově, až k bráně vodné k východu“."
    - "Mišna jmenuje Vodní bránu mezi branami nádvoří druhého chrámu, jíž se přinášela voda pro úlitbu svátku stánků; to je jiná brána, uvnitř svatyně. Sonda Kathleen Kenyonové na východním svahu v 60. letech 20. století a práce Benjamina a Eilat Mazarových na Ofelu v letech 1986–1987, která odkryla bránovou budovu z doby prvního chrámu, již Eilat Mazar navrhla jako Vodní bránu, jsou to nejbližší, k čemu se archeologie dostala; brána nebyla nalezena. Svah je nyní součástí archeologického parku Město Davidovo vedle vesnice Silwán."
