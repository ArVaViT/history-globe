# Overview article (ADR 0007). Mainstream facts only; the Solomonic dating of the Ophel buildings is given as disputed, and the reading of the "Isaiah" bulla as such.
id: ophel
place: af96edd
title:
  en: "Ophel"
  ru: "Офел"
