body:
  en:
    - "The Ophel is the rise of ground in Jerusalem between the City of David and the Temple Mount, the saddle over which the oldest town climbed to the royal and temple quarter that Solomon built on the hill to its north. The Hebrew word, always with the article, means a swelling or mound and was used of a citadel: Mesha of Moab built the wall of the Ophel at Dibon, the Synodal Bible keeps the word in Isaiah's picture of a forsaken city, where Ophel and the tower are left to the wild asses, and Micah's “strong hold of the daughter of Zion” is her ophel. In the nineteenth century explorers used Ophel for the whole ridge south of the Temple Mount; today it names the slope between the two, where the Ophel Archaeological Garden lies below the southern wall."
    - "The kings of Judah fortified it. Jotham “built the high gate of the house of the LORD, and on the wall of Ophel he built much”; Manasseh built an outer wall for the City of David “and compassed about Ophel, and raised it up a very great height”. After the exile “the Nethinims dwelt in Ophel”, the temple servants, near the Water Gate and the great tower that stood out from the wall, and Nehemiah's builders worked “unto the wall of Ophel”. Josephus calls it Ophlas and says that the old wall ran from it to the eastern cloister of the Temple."
    - "Charles Warren traced the Ophel wall and its towers in 1867; Kathleen Kenyon dug here in the 1960s, and Benjamin Mazar's great excavation south of the Temple Mount, from 1968, reached the Ophel. Eilat Mazar, with him in 1986–1987 and on her own in 2009–2013, uncovered a gatehouse and large buildings which she dated to the tenth century BC and ascribed to Solomon; other archaeologists date them to the ninth or eighth century, and the question is open. From these digs came a jar fragment with the earliest alphabetic inscription found in Jerusalem, of about the tenth century, and a clay seal impression of Hezekiah son of Ahaz king of Judah, found in 2009 and published in 2015, the first of a king of Judah found in a controlled excavation; a damaged bulla found beside it, read by Mazar as possibly that of Isaiah the prophet, is disputed."
  ru:
    - "Офел — возвышение в Иерусалиме между городом Давидовым и Храмовой горой, седловина, по которой древнейший город поднимался к царскому и храмовому кварталу, построенному Соломоном на холме к северу. Еврейское слово, всегда с артиклем, значит «вздутие», «холм» и обозначало крепость: Меса Моавитский строил стену Офела в Дивоне, Синодальный перевод читает его в картине покинутого города у Исаии, «Офел и башня», а «холм дщери Сиона» у Михея — её офел. В XIX веке исследователи называли Офелом весь гребень к югу от Храмовой горы; сегодня так зовут склон между ними, где под южной стеной лежит Археологический парк Офел."
    - "Цари Иуды укрепляли его. Иоафам «построил верхние ворота дома Господня, и многое построил на стене Офела»; Манассия построил внешнюю стену города Давидова «и провел ее вокруг Офела и высоко поднял ее». После плена «нефинеи жили в Офеле», служители Храма, у Водяных ворот и большой выступающей башни, а строители Неемии чинили «до стены Офела». Иосиф Флавий называет его Офлой и говорит, что старая стена шла от него к восточной галерее Храма."
    - "Чарльз Уоррен проследил стену Офела с её башнями в 1867 г.; Кэтлин Кеньон копала здесь в 1960-х, а большие раскопки Биньямина Мазара к югу от Храмовой горы, с 1968 г., дошли до Офела. Эйлат Мазар, вместе с ним в 1986–1987 гг. и самостоятельно в 2009–2013 гг., открыла воротное сооружение и большие здания, которые датировала X веком до н. э. и приписала Соломону; другие археологи относят их к IX или VIII веку, и вопрос открыт. Из этих раскопок происходят обломок сосуда с древнейшей алфавитной надписью, найденной в Иерусалиме, около X века, и оттиск печати Езекии, сына Ахаза, царя Иудейского, найденный в 2009 г. и опубликованный в 2015 г., первый оттиск царя Иуды, найденный в научных раскопках; повреждённая булла, найденная рядом, которую Мазар читала как возможную печать пророка Исаии, спорна."
  uk:
    - "Офел — це підвищення в Єрусалимі між Містом Давида та Храмовою горою, сідловина, якою найдавніше місто підіймалося до царського й храмового кварталу, що його Соломон збудував на пагорбі на північ від неї. Єврейське слово, завжди з артиклем, означає опух або горб і вживалося щодо цитаделі: Меша Моавський збудував мур Офела в Дівоні, Куліш зберігає це слово в образі покинутого міста в Ісаї — «З Офелу та з башти постануть, замість печер, сховища диким ослам», — а Міхеєва твердиня дочки Сіону є її офелом (у Куліша: «ти горбе дочки Сионової»). У XIX ст. дослідники називали Офелом увесь хребет на південь від Храмової гори; нині так називають схил між ними, де під південним муром лежить Археологічний парк Офел."
    - "Царі Юди укріплювали його. Йотам «збудував верхню браму дому Господнього й набудував богато на мурі Офеловому»; Манасія збудував зовнішній мур Міста Давида, «й протяг його кругом Офела, і підвів його високо». Після заслання «нетинеї жили в Офелї» — храмові слуги — біля Водяних воріт і великої башти, що виступала з муру, а будівничі Неемії працювали «до муру Офела». Йосиф Флавій називає його Офласом і каже, що старий мур ішов від нього до східного портика Храму."
    - "Чарлз Воррен простежив мур Офела та його вежі 1867 року; Кетлін Кенйон копала тут у 1960-х роках, а велике розкопування Беньяміна Мазара на південь від Храмової гори, що почалося 1968 року, дійшло до Офела. Ейлат Мазар, разом із ним у 1986–1987 роках і самостійно у 2009–2013 роках, відкрила будівлю брами та великі споруди, які датувала X ст. до н. е. й приписала Соломонові; інші археологи датують їх IX або VIII ст., і питання залишається відкритим. З цих розкопок походить уламок глека з найдавнішим алфавітним написом, знайденим у Єрусалимі, приблизно X ст., а також глиняний відбиток печатки Єзекії, сина Ахаза, царя Юди, знайдений 2009 року й оприлюднений 2015 року, перший відбиток печатки юдейського царя, знайдений у контрольованих розкопках; пошкоджена булла, знайдена поряд, яку Мазар прочитала як, можливо, печатку пророка Ісаї, є предметом суперечки."
  es:
    - "El Ofel es la elevación de terreno de Jerusalén entre la Ciudad de David y el monte del Templo, la silla sobre la que la ciudad más antigua ascendía hacia el barrio real y del templo que Salomón construyó en la colina al norte. La palabra hebrea, siempre con artículo, significa una hinchazón o montículo y se usaba para una ciudadela: Mesa de Moab construyó el muro del Ofel en Dibón, la Biblia sinodal conserva la palabra en la imagen de Isaías de una ciudad abandonada, donde el Ofel y la torre quedan para los asnos salvajes, y la «fortaleza de la hija de Sión» de Miqueas es su ofel. En el siglo XIX los exploradores usaban Ofel para toda la cresta al sur del monte del Templo; hoy designa la ladera entre ambos, donde el Jardín Arqueológico del Ofel se extiende bajo la muralla sur."
    - "Los reyes de Judá lo fortificaron. Jotam «edificó él la puerta mayor de la casa de Jehová» y construyó mucho en el muro del Ofel; Manasés «edificó el muro de afuera de la ciudad de David … y cercó á Ophel, y alzólo muy alto». Tras el exilio «los Nethineos habitaban en Ophel», los servidores del templo, cerca de la Puerta de las Aguas y de la gran torre que sobresalía del muro, y los constructores de Nehemías trabajaron «hasta el muro de Ophel». Josefo lo llama Ofla y dice que el antiguo muro iba desde allí hasta el pórtico oriental del Templo."
    - "Charles Warren trazó el muro del Ofel y sus torres en 1867; Kathleen Kenyon excavó aquí en la década de 1960, y la gran excavación de Benjamin Mazar al sur del monte del Templo, desde 1968, llegó al Ofel. Eilat Mazar, con él en 1986–1987 y por su cuenta en 2009–2013, sacó a la luz una casa de la puerta y grandes edificios que fechó en el siglo X a. C. y atribuyó a Salomón; otros arqueólogos los fechan en el siglo IX u VIII, y la cuestión sigue abierta. De estas excavaciones salió un fragmento de jarra con la inscripción alfabética más antigua hallada en Jerusalén, de hacia el siglo X, y la impresión de un sello de arcilla de Ezequías hijo de Acaz rey de Judá, hallada en 2009 y publicada en 2015, el primero de un rey de Judá hallado en una excavación controlada; una bulla dañada hallada junto a ella, que Mazar leyó como posiblemente del profeta Isaías, es discutida."
  pt:
    - "O Ofel é a elevação de terreno em Jerusalém entre a Cidade de Davi e o Monte do Templo, a sela sobre a qual a cidade mais antiga subia ao bairro real e do templo que Salomão construiu na colina ao norte. A palavra hebraica, sempre com artigo, significa um inchaço ou montículo e era usada para uma cidadela: Mesa de Moabe construiu o muro do Ofel em Dibom, a Bíblia Sinodal conserva a palavra na imagem de Isaías de uma cidade abandonada, em que Ofel e a torre ficam para os jumentos selvagens, e a “colina da filha de Sião” de Miqueias é o seu ofel. No século XIX os exploradores usavam Ofel para toda a crista ao sul do Monte do Templo; hoje designa a encosta entre os dois, onde fica o Jardim Arqueológico do Ofel, abaixo do muro sul."
    - "Os reis de Judá o fortificaram. Jotão “construiu a porta superior da casa do SENHOR, e construiu muito no muro de Ofel”; Manassés construiu um muro externo para a Cidade de Davi, “cercou Ofel com o muro e o ergueu a uma altura muito grande”. Depois do exílio, “os servos do templo moravam em Ofel”, perto da Porta das Águas e da torre que se projetava do muro, e os construtores de Neemias trabalharam “até a muralha de Ofel”. Josefo a chama de Ófla e diz que o muro antigo ia dali até o pórtico oriental do Templo."
    - "Charles Warren traçou o muro do Ofel e suas torres em 1867; Kathleen Kenyon escavou aqui na década de 1960, e a grande escavação de Benjamin Mazar ao sul do Monte do Templo, a partir de 1968, chegou ao Ofel. Eilat Mazar, com ele em 1986–1987 e sozinha em 2009–2013, descobriu uma casa de guarda do portão e grandes edifícios que datou do século X a.C. e atribuiu a Salomão; outros arqueólogos os datam do século IX ou VIII, e a questão está em aberto. Dessas escavações vieram um fragmento de jarro com a mais antiga inscrição alfabética encontrada em Jerusalém, de cerca do século X, e uma impressão de selo de argila de Ezequias, filho de Acaz, rei de Judá, achada em 2009 e publicada em 2015, o primeiro de um rei de Judá achado em escavação controlada; uma bula danificada encontrada ao lado, lida por Mazar como possivelmente a do profeta Isaías, é contestada."
  de:
    - "Der Ofel ist die Bodenerhebung in Jerusalem zwischen der Davidsstadt und dem Tempelberg, der Sattel, über den die älteste Stadt zum königlichen und Tempelviertel aufstieg, das Salomo auf dem Hügel nördlich davon baute. Das hebräische Wort, stets mit Artikel, bedeutet Anschwellung oder Hügel und bezeichnete eine Burg: Mesa von Moab baute die Mauer des Ofel in Dibon, die russische Synodalübersetzung behält das Wort in Jesajas Bild der verlassenen Stadt bei, wo Ofel und Turm dem Wild überlassen sind, und Michas „Feste der Tochter Zion“ ist ihr Ofel. Im 19. Jahrhundert nannten Forscher den ganzen Höhenzug südlich des Tempelbergs Ofel; heute bezeichnet das Wort den Hang dazwischen, wo der Archäologische Garten Ofel unterhalb der Südmauer liegt."
    - "Die Könige von Juda befestigten ihn. Jotam „baute das obere Tor am Hause des HERRN, und an der Mauer des Ophel baute er viel“; Manasse baute eine Außenmauer für die Davidsstadt „und umher an den Ophel und machte sie sehr hoch“. Nach dem Exil: „Die Tempelknechte wohnten am Ophel“, die Tempeldiener, nahe dem Wassertor und dem großen Turm, der aus der Mauer vorsprang, und Nehemias Bauleute arbeiteten „bis an die Mauer des Ophel“. Josephus nennt ihn Ophlas und sagt, die alte Mauer sei von dort zur östlichen Säulenhalle des Tempels gelaufen."
    - "Charles Warren verfolgte 1867 die Ofelmauer und ihre Türme; Kathleen Kenyon grub hier in den 1960er Jahren, und Benjamin Mazars große Grabung südlich des Tempelbergs erreichte ab 1968 den Ofel. Eilat Mazar legte, mit ihm 1986–1987 und allein 2009–2013, ein Torhaus und große Gebäude frei, die sie ins 10. Jahrhundert v. Chr. datierte und Salomo zuschrieb; andere Archäologen datieren sie ins 9. oder 8. Jahrhundert, und die Frage ist offen. Aus diesen Grabungen stammen ein Krugfragment mit der ältesten alphabetischen Inschrift Jerusalems, etwa aus dem 10. Jahrhundert, und ein Tonsiegelabdruck Hiskias, des Sohnes des Ahas, Königs von Juda, 2009 gefunden und 2015 veröffentlicht, der erste eines Königs von Juda aus einer kontrollierten Grabung; eine beschädigte Bulle daneben, die Mazar als möglicherweise die des Propheten Jesaja las, ist umstritten."
  fr:
    - "L’Ophel est la hauteur de Jérusalem entre la Cité de David et le mont du Temple, la selle par laquelle la plus ancienne ville montait au quartier royal et sacré que Salomon bâtit sur la colline au nord. Le mot hébreu, toujours avec l’article, signifie une enflure ou un tertre et s’employait d’une citadelle : Mescha de Moab bâtit le mur de l’Ophel à Dibon ; la Bible synodale russe garde le mot dans l’image d’Ésaïe d’une ville abandonnée, où l’Ophel et la tour sont laissés aux ânes sauvages (Louis Segond met « colline »), et la « colline de la fille de Sion » de Michée est son ophel. Au XIXe siècle, les explorateurs appelaient Ophel toute la crête au sud du mont du Temple ; aujourd’hui le nom désigne la pente entre les deux, où le Jardin archéologique de l’Ophel s’étend sous la muraille sud."
    - "Les rois de Juda la fortifièrent. Jotham « bâtit la porte supérieure de la maison de l’Éternel, et il fit beaucoup de constructions sur les murs de la colline » (l’Ophel) ; Manassé bâtit un mur extérieur pour la Cité de David « dont il entoura la colline, et il l’éleva à une grande hauteur ». Après l’exil, « les Néthiniens s’établirent sur la colline », les serviteurs du temple, près de la Porte des Eaux et de la grande tour en saillie, et les bâtisseurs de Néhémie travaillèrent « jusqu’au mur de la colline ». Flavius Josèphe l’appelle Ophlas et dit que l’ancien mur allait de là au portique oriental du Temple."
    - "Charles Warren releva le mur de l’Ophel et ses tours en 1867 ; Kathleen Kenyon fouilla ici dans les années 1960, et la grande fouille de Benjamin Mazar au sud du mont du Temple, à partir de 1968, atteignit l’Ophel. Eilat Mazar, avec lui en 1986–1987 puis seule en 2009–2013, mit au jour un corps de garde et de grands bâtiments qu’elle data du Xe siècle av. J.-C. et attribua à Salomon ; d’autres archéologues les datent du IXe ou du VIIIe siècle, et la question reste ouverte. Ces fouilles ont livré un fragment de jarre portant la plus ancienne inscription alphabétique trouvée à Jérusalem, d’environ le Xe siècle, et une empreinte de sceau en argile d’Ézéchias, fils d’Achaz, roi de Juda, trouvée en 2009 et publiée en 2015, la première d’un roi de Juda trouvée en fouille contrôlée ; une bulle abîmée découverte à côté, lue par Mazar comme possiblement celle du prophète Ésaïe, est contestée."
  it:
    - "L’Ofel è il rialzo di terreno a Gerusalemme tra la Città di Davide e il Monte del Tempio, la sella su cui la città più antica saliva verso il quartiere regio e del tempio che Salomone costruì sulla collina a nord. La parola ebraica, sempre con l’articolo, significa rigonfiamento o altura e fu usata per una cittadella: Mesa di Moab costruì il muro dell’ofel a Dibon, la Bibbia sinodale conserva la parola nell’immagine isaiana di una città abbandonata, dove l’ofel e la torre sono lasciati agli onagri, e il «colle della figliuola di Sion» di Michea è il suo ofel. Nell’Ottocento gli esploratori usavano Ofel per l’intera dorsale a sud del Monte del Tempio; oggi indica il pendio tra i due, dove il Giardino archeologico dell’Ofel si stende sotto il muro meridionale."
    - "I re di Giuda lo fortificarono. Iotam «costruì la porta superiore della casa dell’Eterno, e fece molti lavori sulle mura di Ofel»; Manasse costruì un muro esterno per la Città di Davide, «lo fe’ girare attorno ad Ofel, e lo tirò su a grande altezza». Dopo l’esilio i Nethinei, i servi del tempio, «si stabilirono sulla collina» (in ebraico ophel), presso la Porta delle Acque e la grande torre sporgente dal muro, e i costruttori di Neemia lavorarono «fino al muro della collina». Giuseppe Flavio la chiama Ophlas e dice che il vecchio muro correva da essa fino al portico orientale del Tempio."
    - "Charles Warren tracciò il muro dell’Ofel e le sue torri nel 1867; Kathleen Kenyon scavò qui negli anni 1960, e il grande scavo di Benjamin Mazar a sud del Monte del Tempio, dal 1968, raggiunse l’Ofel. Eilat Mazar, con lui nel 1986–1987 e da sola nel 2009–2013, portò alla luce un edificio di porta e grandi costruzioni che datò al X secolo a.C. e attribuì a Salomone; altri archeologi le datano al IX o all’VIII secolo, e la questione è aperta. Da questi scavi vennero un frammento di giara con la più antica iscrizione alfabetica trovata a Gerusalemme, del X secolo circa, e un’impronta di sigillo in argilla di Ezechia figlio di Acaz re di Giuda, trovata nel 2009 e pubblicata nel 2015, la prima di un re di Giuda trovata in uno scavo controllato; una bulla danneggiata trovata accanto, letta da Mazar come forse appartenente al profeta Isaia, è controversa."
  pl:
    - "Ofel to wzniesienie terenu w Jerozolimie między Miastem Dawida a Górą Świątynną, siodło, po którym najstarsze miasto wspinało się do dzielnicy królewskiej i świątynnej, którą Salomon zbudował na wzgórzu na północ od niego. Hebrajskie słowo, zawsze z rodzajnikiem, znaczy wzgórek lub kopiec i oznaczało cytadelę: Mesza z Moabu zbudował mur Ofelu w Dibon, Biblia synodalna zachowuje to słowo w obrazie opuszczonego miasta u Izajasza, gdzie Ofel i wieża zostają dzikim osłom, a u Micheasza wezwanie „baszto córki Syońskiej” odnosi się do jej ofelu. W XIX wieku badacze nazywali Ofelem cały grzbiet na południe od Góry Świątynnej; dziś nazwa oznacza stok między nimi, gdzie pod południowym murem leży Ogród Archeologiczny Ofel."
    - "Królowie Judy go umocnili. Jotam „zbudował bramę domu Pańskiego wysoką, i na murach Ofel wiele pobudował”; Manasses wzniósł zewnętrzny mur dla Miasta Dawida i „otoczył murem Ofel, i wywiódł go bardzo wysoko”. Po wygnaniu „Netynejczycy mieszkali w Ofelu”, słudzy świątyni, koło Bramy Wodnej i wielkiej wieży wystającej z muru, a budowniczowie Nehemiasza pracowali „aż do muru Ofel”. Józef Flawiusz nazywa go Ofla i mówi, że stary mur biegł od niego do wschodniego krużganka Świątyni."
    - "Charles Warren prześledził mur Ofelu i jego wieże w 1867 roku; Kathleen Kenyon kopała tu w latach 60. XX wieku, a wielkie wykopaliska Beniamina Mazara na południe od Góry Świątynnej, od 1968 roku, dotarły do Ofelu. Eilat Mazar, z nim w latach 1986–1987 i samodzielnie w latach 2009–2013, odsłoniła budynek bramny i duże budowle, które datowała na X wiek p.n.e. i przypisała Salomonowi; inni archeolodzy datują je na IX lub VIII wiek, a kwestia pozostaje otwarta. Z tych wykopalisk pochodzi fragment dzbana z najstarszym alfabetycznym napisem znalezionym w Jerozolimie, z około X wieku, a także odcisk gliniany pieczęci Ezechiasza, syna Achaza, króla Judy, znaleziony w 2009 i opublikowany w 2015 roku, pierwszy odcisk króla Judy znaleziony w kontrolowanych wykopaliskach; uszkodzona bulla znaleziona obok, odczytana przez Mazar jako możliwie należąca do proroka Izajasza, jest kwestionowana."
  cs:
    - "Ofel je vyvýšenina v Jeruzalémě mezi Městem Davidovým a Chrámovou horou, sedlo, přes něž nejstarší město stoupalo ke královské a chrámové čtvrti, kterou Šalomoun vystavěl na pahorku na sever od něj. Hebrejské slovo, vždy s členem, znamená ztluštění či pahorek a užívalo se o citadele: Meša z Moábu vystavěl hradbu Ofelu v Dibonu, synodální Bible slovo zachovává v Izajášově obraze opuštěného města, kde Ofel a věž připadnou divokým oslům, a Micheáš oslovuje Sion „bašto dcery Sionské“, v hebrejštině její ofel. V 19. století badatelé užívali Ofel pro celý hřeben jižně od Chrámové hory; dnes tak slove svah mezi oběma, kde pod jižní hradbou leží Archeologická zahrada Ofel."
    - "Králové judští jej opevňovali. Jotam „ustavěl bránu domu Hospodinova hořejší, a na zdi Ofel mnoho stavěl“; Manases vystavěl vnější zeď Města Davidova, „a obehnal Ofel, a vyhnal ji velmi vysoko“. Po exilu „Netinejští bydlili v Ofel“, chrámoví sluhové, poblíž Vodní brány a velké věže vyčnívající z hradby, a Nehemjášovi stavitelé pracovali „až ke zdi při Ofel“. Josephus jej nazývá Ofla a praví, že stará hradba šla od něj k východní podsíni Chrámu."
    - "Charles Warren vystopoval hradbu Ofelu a její věže roku 1867; Kathleen Kenyonová tu kopala v 60. letech a velké vykopávky Benjamina Mazara jižně od Chrámové hory se od roku 1968 dostaly až k Ofelu. Eilat Mazarová, s ním v letech 1986–1987 a sama v letech 2009–2013, odkryla vrátnici a velké budovy, které datovala do 10. století př. n. l. a připsala Šalomounovi; jiní archeologové je datují do 9. či 8. století a otázka je otevřená. Z těchto vykopávek pochází úlomek džbánu s nejstarším alfabetickým nápisem nalezeným v Jeruzalémě, asi z 10. století, a hliněný otisk pečeti Chizkijáše syna Achazova, krále Judy, nalezený roku 2009 a zveřejněný roku 2015, první takový od judského krále nalezený při kontrolovaném výzkumu; poškozená bula nalezená vedle, kterou Mazarová četla jako možnou bulu proroka Izajáše, je sporná."
  nl:
    - "De Ofel is de verhoging in Jeruzalem tussen de Stad van David en de Tempelberg, de zadel waarover de oudste stad opklom naar het koninklijke en tempelkwartier dat Salomo op de heuvel ten noorden ervan bouwde. Het Hebreeuwse woord, altijd met lidwoord, betekent een zwelling of heuvel en werd van een citadel gebruikt: Mesa van Moab bouwde de muur van de Ofel te Dibon, de Synodale Bijbel behoudt het woord in Jesaja’s beeld van een verlaten stad, waar Ofel en de toren aan de wilde ezels overblijven, en bij Micha is de “Ofel der dochter Sions” haar ophel. In de 19e eeuw gebruikten ontdekkingsreizigers Ofel voor de hele rug ten zuiden van de Tempelberg; tegenwoordig duidt het de helling daartussen aan, waar de Archeologische Tuin van de Ofel onder de zuidmuur ligt."
    - "De koningen van Juda versterkten haar. Jotam “bouwde de hoge poorten aan het huis des HEEREN; hij bouwde ook veel aan den muur van Ofel”; Manasse bouwde een buitenmuur voor de Stad van David “en omsingelde Ofel, en verhief dien zeer”. Na de ballingschap woonden in Ofel de Nethinim, de tempeldienaren, bij de Waterpoort en de grote toren die uit de muur stak, en Nehemia’s bouwers werkten “tot aan den muur van Ofel”. Josephus noemt haar Ophlas en zegt dat de oude muur van daar liep naar de oostelijke zuilengang van de tempel."
    - "Charles Warren bracht in 1867 de muur van de Ofel en haar torens in kaart; Kathleen Kenyon groef hier in de jaren 1960, en Benjamin Mazars grote opgraving ten zuiden van de Tempelberg, vanaf 1968, bereikte de Ofel. Eilat Mazar legde, met hem in 1986–1987 en alleen in 2009–2013, een poortgebouw en grote gebouwen bloot die zij in de 10e eeuw v.Chr. dateerde en aan Salomo toeschreef; andere archeologen dateren ze in de 9e of 8e eeuw, en de kwestie is open. Uit deze opgravingen kwam een kruikfragment met het oudste alfabetische opschrift dat in Jeruzalem is gevonden, van omstreeks de 10e eeuw, en een kleizegel van Chizkia, zoon van Achaz, koning van Juda, gevonden in 2009 en gepubliceerd in 2015, het eerste van een koning van Juda dat bij een gecontroleerde opgraving is gevonden; een beschadigde bulla ernaast, door Mazar gelezen als mogelijk die van de profeet Jesaja, is omstreden."
  sv:
    - "Ofel är höjden i Jerusalem mellan Davids stad och Tempelberget, sadeln över vilken den äldsta staden steg upp mot det kungliga kvarteret och tempelkvarteret som Salomo byggde på kullen norr om den. Det hebreiska ordet, alltid med bestämd artikel, betyder en svullnad eller kulle och användes om en citadell: Mesa av Moab byggde Ofels mur i Dibon, den synodala bibeln behåller ordet i Jesajas bild av en övergiven stad, där Ofel och tornet lämnas åt vildåsnor, och Mikas ”dotter Sions kulle” är hennes ofel. På 1800-talet använde upptäcktsresande Ofel om hela åsen söder om Tempelberget; i dag betecknar det sluttningen mellan de två, där Ofels arkeologiska trädgård ligger nedanför den södra muren."
    - "Judas kungar befäste den. Jotam ”byggde Övre porten till HERRENS hus, och på Ofelmuren utförde han stora byggnadsarbeten”; Manasse byggde en yttre mur till Davids stad ”och runt omkring Ofel, och gjorde den mycket hög”. Efter exilen var det tempelträlarna som ”bodde på Ofel”, nära Vattenporten och det stora utskjutande tornet, och Nehemjas byggare arbetade ”ända fram till Ofelmuren”. Josefus kallar den Ophlas och säger att den gamla muren löpte från den till tempelhallen i öster."
    - "Charles Warren kartlade Ofelmuren och dess torn 1867; Kathleen Kenyon grävde här på 1960-talet, och Benjamin Mazars stora utgrävning söder om Tempelberget från 1968 nådde Ofel. Eilat Mazar, som var med honom 1986–1987 och på egen hand 2009–2013, frilade en portbyggnad och stora byggnader som hon daterade till 900-talet f.Kr. och tillskrev Salomo; andra arkeologer daterar dem till 800- eller 700-talet, och frågan är öppen. Från dessa utgrävningar kom ett kärlfragment med den äldsta alfabetiska inskrift som hittats i Jerusalem, från omkring 900-talet, och ett lerstämpelavtryck av Hiskia, Achas son, Juda kung, funnet 2009 och publicerat 2015, det första av en kung av Juda som hittats vid en kontrollerad utgrävning; en skadad bulla som hittades bredvid, som Mazar läste som möjligen tillhörande profeten Jesaja, är omstridd."
