body:
  en:
    - "Susa lay in the plain of Khuzestan in south-western Iran, between the Karkheh and Dez rivers, at the modern town of Shush. It was founded by about 4000 BC on a mound later called the Acropolis, and for much of the next three thousand years it was one of the chief cities of Elam, though at times under Mesopotamian rule. The Elamite king Shutruk-Nahhunte carried Mesopotamian monuments home to it as booty in the twelfth century BC, and the mission of Jacques de Morgan found among them, in 1901–1902, the stele bearing the laws of Hammurabi."
    - "About 646 BC the Assyrian king Ashurbanipal took Susa, plundered its treasuries, destroyed its ziggurat and carried off its gods and the bones of the kings of Elam. The city rose again under the Persians: Darius I (522–486 BC) made it a royal residence and built a palace there, recording that cedar was brought from Lebanon, gold from Sardis and Bactria and ivory from Kush and India."
    - "In the Bible Susa is Shushan the palace. In a vision Daniel saw himself in Shushan by the river Ulai, the Eulaeus of the Greeks, and there saw the ram and the he-goat. Nehemiah was in Shushan in the twentieth year of Artaxerxes when he heard of the ruin of Jerusalem's walls, and there he served the king wine. The Book of Esther is set at the court of Ahasuerus in Shushan; he is usually identified with Xerxes I."
    - "In 331 BC Susa surrendered to Alexander the Great, who found in it fifty thousand talents, and in 324 BC he held there the mass wedding of his officers to Persian and Median noblewomen. Under the Seleucids it became a Greek city, Seleucia on the Eulaeus. It lived on under the Parthian and Sasanian kings, though it never regained its old place."
  ru:
    - "Сузы лежали на равнине Хузестана на юго-западе Ирана, между реками Керхе и Дез, там, где теперь город Шуш. Город возник не позднее ок. 4000 г. до н. э. на холме, позже названном Акрополем, и большую часть следующих трёх тысячелетий был одним из главных городов Елама, хотя временами попадал под власть Месопотамии. В XII веке до н. э. еламский царь Шутрук-Наххунте привёз сюда из Месопотамии памятники как военную добычу, и среди них экспедиция Жака де Моргана нашла в 1901–1902 гг. стелу с законами Хаммурапи."
    - "Около 646 г. до н. э. ассирийский царь Ашшурбанапал взял Сузы, разграбил сокровищницы, разрушил зиккурат и увёз в Ассирию богов города и кости еламских царей. При персах город поднялся вновь: Дарий I (522–486 гг. до н. э.) сделал его царской резиденцией и построил здесь дворец, записав, что кедр привезли с Ливана, золото — из Сард и Бактрии, а слоновую кость — из Куша и Индии."
    - "В Библии Сузы названы престольным городом. В видении Даниил увидел себя в Сузах у реки Улая, которую греки называли Эвлеем, и там увидел овна и козла. Неемия находился в Сузах в двадцатый год Артаксеркса, когда услышал о разрушенных стенах Иерусалима, и здесь подавал царю вино. Действие Книги Есфири происходит в Сузах при дворе царя, которого Синодальный перевод называет Артаксерксом, а еврейский текст — Ахашверошем; обычно его отождествляют с Ксерксом I."
    - "В 331 г. до н. э. Сузы сдались Александру Македонскому, который нашёл здесь пятьдесят тысяч талантов, а в 324 г. до н. э. устроил здесь массовую свадьбу своих приближённых со знатными персиянками и мидянками. При Селевкидах город стал греческим полисом — Селевкией-на-Эвлее. Он жил и при парфянских и сасанидских царях, хотя прежнего значения уже не вернул."
  uk:
    - "Сузи лежали на рівнині Хузестан на південному заході Ірану, між річками Каркех і Дез, біля сучасного міста Шуш. Їх заснували близько 4000 р. до н. е. на пагорбі, названому згодом Акрополем, і впродовж більшої частини наступних трьох тисяч років вони були одним із головних міст Елама, хоч часом під месопотамською владою. Еламський цар Шутрук-Нахунте у XII ст. до н. е. привіз до них як здобич месопотамські пам’ятки, і серед них місія Жака де Моргана 1901–1902 років знайшла стелу із законами Хаммурапі."
    - "Близько 646 р. до н. е. ассірійський цар Ашшурбаніпал узяв Сузи, пограбував їхні скарбниці, зруйнував зикурат і вивіз їхніх богів та кістки царів Елама. Місто знов постало за персів: Дарій I (522–486 рр. до н. е.) зробив його царською резиденцією і збудував там палац, зазначивши, що кедр привезли з Лівану, золото — із Сард і Бактрії, а слонову кістку — з Куша та Індії."
    - "У Біблії Сузи — це Шушан, палац. У видінні Даниїл побачив себе в Шушані біля ріки Улай, грецького Евлея, і там побачив барана й козла. Неемія перебував у Шушані на двадцятому році Артаксеркса, коли почув про руйнування мурів Єрусалима, і там подавав цареві вино. Книга Естер відбувається при дворі Ахашвероша в Шушані; його зазвичай ототожнюють із Ксерксом I."
    - "У 331 р. до н. е. Сузи здалися Александрові Великому, який знайшов у них п’ятдесят тисяч талантів, а в 324 р. до н. е. справив там масове весілля своїх офіцерів з перськими й мідійськими шляхтянками. За Селевкідів вони стали грецьким містом, Селевкією на Евлеї. Вони жили й за парфянських та сасанідських царів, хоч колишнього становища вже не відновили."
  es:
    - "Susa estaba en la llanura de Juzestán, en el suroeste de Irán, entre los ríos Karkheh y Dez, en la actual población de Shush. Fue fundada hacia 4000 a. C. sobre un montículo llamado después la Acrópolis, y durante buena parte de los tres mil años siguientes fue una de las principales ciudades de Elam, aunque a veces bajo dominio mesopotámico. El rey elamita Shutruk-Nahhunte llevó a ella como botín monumentos mesopotámicos en el siglo XII a. C., y la misión de Jacques de Morgan halló entre ellos, en 1901–1902, la estela con las leyes de Hammurabi."
    - "Hacia 646 a. C. el rey asirio Asurbanipal tomó Susa, saqueó sus tesoros, destruyó su zigurat y se llevó sus dioses y los huesos de los reyes de Elam. La ciudad resurgió bajo los persas: Darío I (522–486 a. C.) la hizo residencia real y construyó allí un palacio, y dejó constancia de que se trajo cedro del Líbano, oro de Sardis y de Bactriana, y marfil de Cus y de la India."
    - "En la Biblia, Susa es Susán, el palacio. En una visión Daniel se vio en Susán, junto al río Ulai, el Euleo de los griegos, y allí vio el carnero y el macho cabrío. Nehemías estaba en Susán, en el año veinte de Artajerjes, cuando supo de la ruina de las murallas de Jerusalén, y allí servía el vino al rey. El libro de Ester transcurre en la corte de Asuero en Susán; se le identifica habitualmente con Jerjes I."
    - "En 331 a. C. Susa se rindió a Alejandro Magno, que halló en ella cincuenta mil talentos, y en 324 a. C. celebró allí la boda colectiva de sus oficiales con damas nobles persas y medas. Bajo los seléucidas se convirtió en una ciudad griega, Seleucia del Euleo. Sobrevivió bajo los reyes partos y sasánidas, aunque nunca recobró su antiguo lugar."
  pt:
    - "Susã ficava na planície de Khuzestan, no sudoeste do Irã, entre os rios Karkheh e Dez, na atual cidade de Shush. Foi fundada por volta de 4000 a.C. num monte depois chamado Acrópole e, por boa parte dos três mil anos seguintes, foi uma das principais cidades de Elão, ainda que por vezes sob domínio mesopotâmico. O rei elamita Shutruk-Nahhunte levou para lá, como butim, monumentos mesopotâmicos no século XII a.C., e a missão de Jacques de Morgan encontrou entre eles, em 1901–1902, a estela com as leis de Hamurabi."
    - "Por volta de 646 a.C., o rei assírio Assurbanípal tomou Susã, saqueou seus tesouros, destruiu seu zigurate e levou seus deuses e os ossos dos reis de Elão. A cidade ressurgiu sob os persas: Dario I (522–486 a.C.) fez dela residência real e construiu ali um palácio, registrando que o cedro veio do Líbano, o ouro de Sardes e da Bactriana e o marfim de Cuxe e da Índia."
    - "Na Bíblia, é Susã, o palácio. Numa visão, Daniel viu-se em Susã, junto ao rio Ulai, o Eulaio dos gregos, e ali viu o carneiro e o bode. Neemias estava em Susã no vigésimo ano de Artaxerxes quando soube da ruína das muralhas de Jerusalém, e ali servia vinho ao rei. O livro de Ester se passa na corte de Assuero em Susã; ele costuma ser identificado com Xerxes I."
    - "Em 331 a.C., Susã rendeu-se a Alexandre, o Grande, que encontrou nela cinquenta mil talentos e, em 324 a.C., celebrou ali o casamento coletivo de seus oficiais com nobres persas e medas. Sob os selêucidas tornou-se cidade grega, Selêucia do Eulaio. Sobreviveu sob os reis partas e sassânidas, embora nunca recuperasse seu antigo lugar."
  de:
    - "Susa lag in der Ebene von Chuzestan im Südwesten des Iran, zwischen den Flüssen Karkheh und Dez, bei der heutigen Stadt Schusch. Es wurde um 4000 v. Chr. auf einem später Akropolis genannten Hügel gegründet und war in den folgenden dreitausend Jahren großenteils eine der Hauptstädte Elams, zeitweise unter mesopotamischer Herrschaft. Der elamische König Schutruk-Nahhunte brachte im zwölften Jahrhundert v. Chr. mesopotamische Denkmäler als Beute hierher, und die Mission von Jacques de Morgan fand unter ihnen 1901–1902 die Stele mit den Gesetzen Hammurabis."
    - "Um 646 v. Chr. nahm der assyrische König Assurbanipal Susa ein, plünderte seine Schatzhäuser, zerstörte seine Zikkurat und führte seine Götter und die Gebeine der Könige Elams fort. Unter den Persern erstand die Stadt neu: Darius I. (522–486 v. Chr.) machte sie zur Residenz und baute dort einen Palast, wobei er festhielt, dass Zedernholz aus dem Libanon, Gold aus Sardes und Baktrien und Elfenbein aus Kusch und Indien herbeigeschafft wurde."
    - "In der Bibel heißt Susa Schuschan, die Burg. In einer Vision sah sich Daniel in Susa am Fluss Ulai, dem Eulaios der Griechen, und sah dort den Widder und den Ziegenbock. Nehemia war im zwanzigsten Jahr des Artaxerxes in Susa, als er von der Zerstörung der Mauern Jerusalems hörte, und dort reichte er dem König den Wein. Das Buch Ester spielt am Hof des Ahasveros in Susa; er wird meist mit Xerxes I. gleichgesetzt."
    - "331 v. Chr. ergab sich Susa Alexander dem Großen, der dort fünfzigtausend Talente fand, und 324 v. Chr. feierte er dort die Massenhochzeit seiner Offiziere mit persischen und medischen Adligen. Unter den Seleukiden wurde es eine griechische Stadt, Seleukeia am Eulaios. Unter den parthischen und sasanidischen Königen lebte es fort, gewann aber seine alte Stellung nie zurück."
  fr:
    - "Suse se trouvait dans la plaine du Khouzestan, au sud-ouest de l’Iran, entre les rivières Karkheh et Dez, à l’emplacement de la ville moderne de Shush. Fondée vers 4000 av. J.-C. sur un tertre appelé plus tard l’Acropole, elle fut pendant une grande part des trois millénaires suivants l’une des principales villes d’Élam, tout en passant parfois sous domination mésopotamienne. Le roi élamite Shutruk-Nahhunte y rapporta en butin des monuments mésopotamiens au XIIe siècle av. J.-C., et la mission de Jacques de Morgan y trouva parmi eux, en 1901-1902, la stèle portant les lois d’Hammurabi."
    - "Vers 646 av. J.-C., le roi assyrien Assurbanipal prit Suse, pilla ses trésors, détruisit sa ziggurat et emporta ses dieux et les ossements des rois d’Élam. La ville se releva sous les Perses : Darius Ier (522-486 av. J.-C.) en fit une résidence royale et y bâtit un palais, consignant que le cèdre venait du Liban, l’or de Sardes et de Bactriane, et l’ivoire de Koush et de l’Inde."
    - "Dans la Bible, Suse est Suse la capitale. Dans une vision, Daniel se vit à Suse près du fleuve d’Ulaï, l’Eulaios des Grecs, et y vit le bélier et le bouc. Néhémie était à Suse la vingtième année d’Artaxerxès quand il apprit la ruine des murailles de Jérusalem, et c’est là qu’il servit le vin au roi. Le livre d’Esther se déroule à la cour d’Assuérus à Suse ; on l’identifie d’ordinaire à Xerxès Ier."
    - "En 331 av. J.-C., Suse se rendit à Alexandre le Grand, qui y trouva cinquante mille talents, et en 324 av. J.-C. il y célébra les noces collectives de ses officiers avec des nobles Perses et Mèdes. Sous les Séleucides, elle devint une ville grecque, Séleucie sur l’Eulaios. Elle survécut sous les rois parthes et sassanides, sans jamais retrouver sa place d’autrefois."
  pl:
    - "Suza leżała na równinie Chuzestanu w południowo-zachodnim Iranie, między rzekami Karcha i Dez, w dzisiejszym mieście Szusz. Została założona około 4000 roku p.n.e. na kopcu zwanym później Akropolem i przez znaczną część następnych trzech tysięcy lat była jednym z głównych miast Elamu, choć czasami pod władzą mezopotamską. Elamicki król Szutruk-Nahhunte zawiózł tu jako łup mezopotamskie pomniki w XII wieku p.n.e., a wyprawa Jacques'a de Morgana znalazła wśród nich w latach 1901–1902 stelę z prawami Hammurabiego."
    - "Około 646 roku p.n.e. asyryjski król Aszurbanipal zdobył Suzę, splądrował jej skarbce, zburzył zigurat i uprowadził jej bogów oraz kości królów Elamu. Miasto podniosło się za Persów: Dariusz I (522–486 p.n.e.) uczynił je rezydencją królewską i zbudował tam pałac, zapisując, że cedr sprowadzono z Libanu, złoto z Sardes i Baktrii, a kość słoniową z Kuszu i Indii."
    - "W Biblii Suza to Szuszan, pałac. W widzeniu Daniel ujrzał siebie w Suzie nad rzeką Ulaj, Eulajosem Greków, i tam zobaczył barana i kozła. Nehemiasz był w Suzie w dwudziestym roku Artakserksesa, gdy usłyszał o zburzeniu murów Jerozolimy, i tam podawał królowi wino. Księga Estery rozgrywa się na dworze Aswerusa w Suzie; utożsamia się go zwykle z Kserksesem I."
    - "W 331 roku p.n.e. Suza poddała się Aleksandrowi Wielkiemu, który znalazł w niej pięćdziesiąt tysięcy talentów, a w 324 roku p.n.e. urządził tam masowy ślub swych oficerów z perskimi i medyjskimi szlachciankami. Za Seleucydów stała się miastem greckim, Seleucją nad Eulajosem. Przetrwała pod królami Partów i Sasanidów, choć nigdy nie odzyskała dawnego miejsca."
  it:
    - "Susa sorgeva nella piana del Khuzestan, nell’Iran sud-occidentale, tra i fiumi Karkheh e Dez, presso l’odierna città di Shush. Fu fondata verso il 4000 a.C. su un tell poi detto Acropoli, e per gran parte dei tremila anni seguenti fu una delle città principali dell’Elam, benché a tratti sotto dominio mesopotamico. Il re elamita Shutruk-Nahhunte vi portò come bottino monumenti mesopotamici nel XII secolo a.C., e la missione di Jacques de Morgan vi trovò fra essi, nel 1901–1902, la stele con le leggi di Hammurabi."
    - "Verso il 646 a.C. il re assiro Assurbanipal prese Susa, ne saccheggiò i tesori, distrusse la sua ziggurat e portò via i suoi dèi e le ossa dei re dell’Elam. La città risorse sotto i Persiani: Dario I (522–486 a.C.) ne fece una residenza reale e vi costruì un palazzo, annotando che il cedro fu portato dal Libano, l’oro da Sardi e dalla Battriana, l’avorio da Kush e dall’India."
    - "Nella Bibbia Susa è Susan, la residenza reale. In una visione Daniele si vide a Susan presso il fiume Ulai, l’Eulaio dei Greci, e lì vide il montone e il capro. Neemia era a Susan nel ventesimo anno di Artaserse quando udì della rovina delle mura di Gerusalemme, e lì serviva il vino al re. Il libro di Ester è ambientato alla corte di Assuero a Susan; egli è di solito identificato con Serse I."
    - "Nel 331 a.C. Susa si arrese ad Alessandro Magno, che vi trovò cinquantamila talenti, e nel 324 a.C. vi celebrò le nozze di massa dei suoi ufficiali con nobildonne persiane e medie. Sotto i Seleucidi divenne una città greca, Seleucia sull’Eulaio. Sopravvisse sotto i re parti e sasanidi, benché non riacquistasse mai il suo antico rango."
  nl:
    - "Susa lag in de vlakte van Khuzestan in het zuidwesten van Iran, tussen de rivieren Karkheh en Dez, bij de huidige stad Shush. Het werd omstreeks 4000 v.Chr. gesticht op een heuvel die later de Akropolis werd genoemd, en gedurende een groot deel van de volgende drieduizend jaar was het een van de voornaamste steden van Elam, hoewel soms onder Mesopotamische heerschappij. De Elamitische koning Shutruk-Nahhunte voerde in de twaalfde eeuw v.Chr. Mesopotamische monumenten als buit naar Susa, en de expeditie van Jacques de Morgan vond daaronder in 1901–1902 de stèle met de wetten van Hammurabi."
    - "Omstreeks 646 v.Chr. nam de Assyrische koning Assurbanipal Susa in, plunderde zijn schatkamers, verwoestte zijn ziggoerat en voerde zijn goden en de beenderen van de koningen van Elam weg. De stad herrees onder de Perzen: Darius I (522–486 v.Chr.) maakte haar tot koninklijke residentie en bouwde er een paleis, en liet vastleggen dat er cederhout uit Libanon werd aangevoerd, goud uit Sardes en Bactrië en ivoor uit Kush en Indië."
    - "In de Bijbel is Susa Susan, de burcht. In een visioen zag Daniël zichzelf in Susan aan de rivier de Ulai, de Eulaeus van de Grieken, en zag daar de ram en de geitenbok. Nehemia was in Susan in het twintigste jaar van Artaxerxes toen hij van de ruïne van de muren van Jeruzalem hoorde, en daar diende hij de koning de wijn. Het boek Ester speelt zich af aan het hof van Ahasveros in Susan; hij wordt gewoonlijk vereenzelvigd met Xerxes I."
    - "In 331 v.Chr. gaf Susa zich over aan Alexander de Grote, die er vijftigduizend talenten aantrof, en in 324 v.Chr. hield hij daar het massahuwelijk van zijn officieren met Perzische en Medische edelvrouwen. Onder de Seleuciden werd het een Griekse stad, Seleucië aan de Eulaeus. Het leefde voort onder de Parthische en Sassanidische koningen, hoewel het zijn oude plaats nooit herwon."
  cs:
    - "Susy ležely v pláni Chúzestánu v jihozápadním Íránu, mezi řekami Karcha a Díz, u dnešního města Šúš. Byly založeny kolem roku 4000 př. n. l. na pahorku později nazvaném Akropole a po velkou část následujících tří tisíc let patřily k hlavním městům Élamu, byť občas pod mezopotámskou vládou. Élamský král Šutruk-Nahhunte do nich ve 12. stol. př. n. l. odvezl jako kořist mezopotámské památky a mise Jacquese de Morgana mezi nimi v letech 1901–1902 našla stélu se zákony Chammurapiho."
    - "Kolem roku 646 př. n. l. dobyl Susy asyrský král Aššurbanipal, vyplenil jejich pokladnice, zničil jejich zikkurat a odvezl jejich bohy a kosti élamských králů. Za Peršanů město znovu povstalo: Dareios I. (522–486 př. n. l.) z něj učinil královské sídlo a postavil tam palác, přičemž zaznamenal, že cedr byl přivezen z Libanonu, zlato ze Sard a Baktrie a slonovina z Kúšu a Indie."
    - "V Bibli jsou Susy Šúšan, palác. Ve vidění se Daniel viděl v Šúšanu u řeky Ulaj, řecky Eulaios, a tam spatřil berana a kozla. Nehemjáš byl v Šúšanu ve dvacátém roce Artaxerxově, když uslyšel o zbořených zdech Jeruzaléma, a tam podával králi víno. Kniha Ester se odehrává na dvoře Achašveroše v Šúšanu; ztotožňuje se obvykle s Xerxem I."
    - "V roce 331 př. n. l. se Susy vzdaly Alexandru Velikému, který v nich našel padesát tisíc talentů, a v roce 324 př. n. l. tam uspořádal hromadnou svatbu svých důstojníků s perskými a médskými šlechtičnami. Za Seleukovců se staly řeckým městem, Seleukeiou na Eulaiu. Žily dál za parthských a sásánovských králů, ačkoli už nikdy nezískaly své staré postavení."
  sv:
    - "Susa låg på slätten Khuzestan i sydvästra Iran, mellan floderna Karkheh och Dez, vid nutidens stad Shush. Det grundades omkring 4000 f.Kr. på en kulle som senare kallades Akropolis, och under större delen av de följande tretusen åren var det en av Elams främsta städer, fast periodvis under mesopotamiskt välde. Den elamitiske kungen Shutruk-Nahhunte förde mesopotamiska monument hem dit som byte på 1100-talet f.Kr., och Jacques de Morgans expedition fann bland dem 1901–1902 stelen med Hammurabis lagar."
    - "Omkring 646 f.Kr. intog den assyriske kungen Assurbanipal Susa, plundrade dess skattkammare, förstörde dess ziggurat och förde bort dess gudar och Elams kungars ben. Staden reste sig på nytt under perserna: Dareios I (522–486 f.Kr.) gjorde den till kungligt residens och byggde ett palats där, och antecknade att ceder hämtades från Libanon, guld från Sardes och Baktrien och elfenben från Kush och Indien."
    - "I Bibeln är Susa Shushan, borgen. I en syn såg Daniel sig själv i Shushan vid floden Ulai, grekernas Eulaios, och såg där väduren och bocken. Nehemja var i Shushan i Artaxerxes' tjugonde år när han fick höra om förödelsen av Jerusalems murar, och där var han kungens munskänk. Esters bok utspelar sig vid Ahasveros' hov i Shushan; han identifieras vanligen med Xerxes I."
    - "År 331 f.Kr. kapitulerade Susa för Alexander den store, som fann femtiotusen talenter där, och år 324 f.Kr. höll han där massbröllopet mellan sina officerare och persiska och mediska adelsdamer. Under seleukiderna blev det en grekisk stad, Seleukia vid Eulaios. Det levde vidare under de parthiska och sassanidiska kungarna, fast det aldrig återfick sin gamla ställning."
  nb:
    - "Susa lå på Khuzestan-sletten i sørvestlige Iran, mellom elvene Karkheh og Dez, ved den moderne byen Shush. Den ble grunnlagt omkring 4000 f.Kr. på en haug som senere ble kalt Akropolis, og i store deler av de neste tre tusen årene var den en av Elams viktigste byer, om enn til tider under mesopotamisk herredømme. Den elamittiske kongen Shutruk-Nahhunte førte mesopotamiske monumenter hjem dit som bytte på 1100-tallet f.Kr., og Jacques de Morgans ekspedisjon fant blant dem, i 1901–1902, steleen med Hammurabis lover."
    - "Omkring 646 f.Kr. inntok den assyriske kongen Assurbanipal Susa, plyndret skattkamrene, ødela ziggurat og førte bort gudene og beinene til Elams konger. Byen reiste seg igjen under perserne: Dareios I (522–486 f.Kr.) gjorde den til kongelig residens og bygde et palass der, og nedtegnet at sedertre ble hentet fra Libanon, gull fra Sardes og Baktria og elfenben fra Kusj og India."
    - "I Bibelen er Susa borgen Susan. I et syn så Daniel seg selv i Susan ved Ulai-elven, grekernes Eulaios, og så der væren og geitebukken. Nehemja var i Susan i Artaxerxes' tjuende år da han hørte om ruinene av Jerusalems murer, og der skjenket han kongen vin. Esters bok er lagt til hoffet til Ahasverus i Susan; han identifiseres vanligvis med Xerxes I."
    - "I 331 f.Kr. overga Susa seg til Aleksander den store, som fant femti tusen talenter der, og i 324 f.Kr. holdt han der massebryllupet mellom offiserene sine og persiske og mediske adelskvinner. Under seleukidene ble den en gresk by, Seleukia ved Eulaios. Den levde videre under de partiske og sasanidiske kongene, selv om den aldri gjenvant sin gamle plass."
  tl:
    - "Ang Susan ay nasa kapatagan ng Khuzestan sa timog-kanluran ng Iran, sa pagitan ng mga ilog Karkheh at Dez, sa makabagong bayan ng Shush. Itinatag ito noong mga 4000 BK sa isang burol na kalaunan ay tinawag na Acropolis, at sa halos buong sumunod na tatlong libong taon ay isa ito sa mga pangunahing lunsod ng Elam, bagaman kung minsan ay nasa ilalim ng pamamahalang Mesopotamiko. Dinala rito ng haring Elamita na si Shutruk-Nahhunte ang mga bantayog ng Mesopotamia bilang samsam noong ika-12 siglo BK, at ang misyon ni Jacques de Morgan ay nakatagpo sa mga ito, noong 1901–1902, ng estelang may mga batas ni Hammurabi."
    - "Noong mga 646 BK, sinakop ng haring Asirio na si Asurbanipal ang Susan, nilooban ang mga kabang-yaman nito, winasak ang ziggurat nito at dinala ang mga diyos nito at ang mga buto ng mga hari ng Elam. Muling bumangon ang lunsod sa ilalim ng mga Persiyano: ginawa ito ni Dario I (522–486 BK) na tirahan ng hari at nagtayo roon ng palasyo, na itinala niyang dinala ang sedro mula sa Libano, ginto mula sa Sardis at Bactria at garing mula sa Cus at India."
    - "Sa Biblia, ang Susa ay ang “Susan na bahay-hari”. Sa isang pangitain, nakita ni Daniel ang sarili sa Susan sa tabi ng ilog Ulai, ang Eulaeus ng mga Griego, at doon ay nakita niya ang tupang lalake at ang kambing na lalake. Si Nehemias ay nasa Susan nang ikadalawampung taon ni Artajerjes nang mabalitaan niya ang pagkawasak ng mga pader ng Jerusalem, at doon ay naglingkod siya ng alak sa hari. Ang mga pangyayari sa Aklat ni Esther ay nagaganap sa korte ni Assuero sa Susan; karaniwan siyang kinikilala kay Xerxes I."
    - "Noong 331 BK, sumuko ang Susan kay Alejandro Magno, na nakatagpo roon ng limampung libong talento, at noong 324 BK ay idinaos niya roon ang pangkatang kasalan ng kaniyang mga opisyal sa mga maharlikang babaing Persiyano at Medo. Sa ilalim ng mga Seleucida, ito ay naging lunsod Griego, ang Seleucia sa Eulaeus. Nagpatuloy ito sa ilalim ng mga haring Parto at Sasanida, bagaman hindi na nito nabawi ang dati nitong kalagayan."
  da:
    - "Susa lå på Khuzestan-sletten i det sydvestlige Iran, mellem floderne Karkheh og Dez, ved den moderne by Shush. Den blev grundlagt omkring 4000 f.Kr. på en tell, der senere blev kaldt Akropolis, og i meget af de følgende tre tusinde år var den en af Elams hovedbyer, dog til tider under mesopotamisk herredømme. Den elamitiske konge Shutruk-Nahhunte bragte mesopotamiske monumenter hjem til byen som bytte i 1100-tallet f.Kr., og Jacques de Morgans ekspedition fandt blandt dem i 1901–1902 stelen med Hammurabis love."
    - "Omkring 646 f.Kr. indtog den assyriske konge Assurbanipal Susa, plyndrede dens skatkamre, ødelagde dens ziggurat og førte dens guder og Elams kongers knogler bort. Byen rejste sig igen under perserne: Darius 1. (522–486 f.Kr.) gjorde den til kongelig residens og byggede et palads der og optegnede, at cedertræ blev hentet fra Libanon, guld fra Sardes og Baktrien og elfenben fra Kush og Indien."
    - "I Bibelen er Susa Susan, slottet. I et syn så Daniel sig selv i Susan ved floden Ulai, grækernes Eulaios, og så dér væderen og gedebukken. Nehemias var i Susan i Artaxerxes' tyvende år, da han hørte om ruinen af Jerusalems mure, og dér serverede han kongen vin. Esters Bog udspiller sig ved Ahasverus' hof i Susan; han identificeres sædvanligvis med Xerxes 1."
    - "I 331 f.Kr. overgav Susa sig til Alexander den Store, der fandt halvtreds tusind talenter dér, og i 324 f.Kr. holdt han dér massebryllup for sine officerer med persiske og mediske adelskvinder. Under seleukiderne blev den en græsk by, Seleukia ved Eulaios. Den levede videre under de parthiske og sassanidiske konger, selv om den aldrig genvandt sin gamle plads."
  sr:
    - "Суса је лежала на равници Хузестан у југозападном Ирану, између река Каркех и Дез, код савременог града Шуша. Основана је око 4000. п. н. е. на хуму касније званом Акропољ, и током већег дела следећих три хиљаде година била је један од главних градова Елама, мада је понекад била под месопотамском влашћу. Еламски цар Шутрук-Нахунте односио је овамо месопотамске споменике као плен у 12. веку п. н. е., а мисија Жака де Моргана међу њима је 1901–1902. нашла стелу са Хамурабијевим законима."
    - "Око 646. п. н. е. асирски цар Асурбанипал заузео је Сусу, опљачкао њене ризнице, разорио њен зигурат и однео њене богове и кости еламских царева. Град се поново подигао под Персијанцима: Дарије I (522–486. п. н. е.) учинио га је царском резиденцијом и онде подигао палату, забележивши да је кедар довезен из Ливана, злато из Сарда и Бактрије, а слоновача из Куша и Индије."
    - "У Библији је Суса Сусан, палата. У виђењу Данило се видео у Сусану крај реке Улај, коју су Грци звали Евлеј, и онде је видео овна и јарца. Немија је био у Сусану у двадесетој години Артаксерксовој када је чуо за рушевину јерусалимских зидова, и онде је цару точио вино. Књига о Јестири смештена је на двор Асвира у Сусану; он се обично поистовећује с Ксерксом I."
    - "Године 331. п. н. е. Суса се предала Александру Великом, који је у њој нашао педесет хиљада таланата, а 324. п. н. е. одржао је онде масовно венчање својих официра с персијским и мидијским племкињама. Под Селеукидима постала је грчки град, Селеукија на Евлеју. Живела је и под партским и сасанидским царевима, мада никад није повратила своје старо место."
  hu:
    - "Susán Huzesztán síkságán feküdt Délnyugat-Iránban, a Karkheh és a Dez folyó között, a mai Súsz város helyén. Kr. e. 4000 körül alapították egy később Akropoliszként ismert dombon, és a következő háromezer év nagy részében Élám egyik fő városa volt, bár időnként mezopotámiai uralom alatt. Sutruk-Nahhunte élámi király a Kr. e. 12. században mezopotámiai emlékműveket hurcolt ide zsákmányként, és Jacques de Morgan expedíciója 1901–1902-ben ezek között találta meg a Hammurapi törvényeit hordozó sztélét."
    - "Kr. e. 646 körül Assurbanipal asszír király elfoglalta Susánt, kifosztotta kincstárait, lerombolta zikkurátját, és elvitte isteneit és az élámi királyok csontjait. A város a perzsák alatt újra fellendült: I. Dárius (Kr. e. 522–486) királyi székhellyé tette és palotát épített ott, feljegyezve, hogy cédrust hoztak Libanonból, aranyat Szárdiszból és Baktriából, elefántcsontot pedig Kúsból és Indiából."
    - "A Bibliában Susán Susán vára. Dániel látomásában Susánban látta magát az Ulai folyónál, a görögök Eulaiosz folyójánál, és ott látta a kost és a bakot. Nehémiás Artaxerxész huszadik évében volt Susánban, amikor hírét vette Jeruzsálem falai romlásának, és ott szolgálta fel a bort a királynak. Eszter könyve Ahasvérus udvarában, Susánban játszódik; őt általában I. Xerxésszel azonosítják."
    - "Kr. e. 331-ben Susán megadta magát Nagy Sándornak, aki ötvenezer talentumot talált benne, Kr. e. 324-ben pedig itt tartotta tisztjeinek tömeges esküvőjét perzsa és méd nemes hölgyekkel. A Szeleukidák alatt görög várossá lett, Szeleukia az Eulaioszon. Tovább élt a pártus és a szászánida királyok alatt, bár régi helyét soha többé nem nyerte vissza."
  fi:
    - "Susa sijaitsi Kuzestanin tasangolla Lounais-Iranissa Karkhen ja Dezin jokien välissä nykyisen Shushin kaupungin kohdalla. Se perustettiin noin 4000 eaa. mennessä kumpareelle, jota myöhemmin kutsuttiin Akropoliiksi, ja suuren osan seuraavista kolmesta tuhannesta vuodesta se oli yksi Elamin tärkeimmistä kaupungeista, vaikka välillä Mesopotamian vallan alla. Elamin kuningas Shutruk-Nahhunte vei Mesopotamian muistomerkkejä sinne sotasaaliina 1100-luvulla eaa., ja Jacques de Morganin retkikunta löysi niiden joukosta vuosina 1901–1902 Hammurabin lakeja kantavan steelen."
    - "Noin 646 eaa. assyrialaiskuningas Assurbanipal valtasi Susan, ryösti sen aarrekammiot, hävitti sen zikkuratin ja vei mukanaan sen jumalat ja Elamin kuninkaiden luut. Kaupunki nousi uudelleen persialaisten alaisuudessa: Dareios I (522–486 eaa.) teki siitä kuninkaallisen asuinpaikan ja rakennutti sinne palatsin, ja hän kirjasi, että setri tuotiin Libanonista, kulta Sardeesta ja Baktriasta ja norsunluu Kushista ja Intiasta."
    - "Raamatussa Susa on Susan, palatsi. Näyssä Daniel näki itsensä Susanissa Ulai-joen, kreikkalaisten Eulaioksen, varrella ja näki siellä oinaan ja kauriinpukin. Nehemia oli Susanissa Artahsastan kahdentenakymmenentenä vuotena, kun hän kuuli Jerusalemin muurien raunioista, ja siellä hän tarjoili kuninkaalle viiniä. Esterin kirja sijoittuu Ahasveroksen hoviin Susanissa; hänet tunnistetaan yleensä Kserkses I:ksi."
    - "Vuonna 331 eaa. Susa antautui Aleksandros Suurelle, joka löysi sieltä viisikymmentätuhatta talenttia, ja vuonna 324 eaa. hän piti siellä upseeriensa joukkohäät persialaisten ja meedialaisten jalosukuisten naisten kanssa. Seleukidien aikana siitä tuli kreikkalainen kaupunki, Seleukia Eulaioksen varrella. Se jatkoi elämäänsä parttilaisten ja sassanidien kuninkaiden aikana, vaikka ei koskaan saanut takaisin vanhaa asemaansa."
  vi:
    - "Su-xơ nằm trong đồng bằng Khuzestan ở tây nam Iran, giữa sông Karkheh và sông Dez, tại thị trấn Shush ngày nay. Nó được lập vào khoảng năm 4000 TCN trên một gò sau này gọi là Acropolis, và trong phần lớn ba nghìn năm tiếp theo nó là một trong các thành chính của Ê-lam, dù có lúc dưới quyền cai trị của Mê-sô-bô-ta-mi. Vua Ê-lam Shutruk-Nahhunte mang các tượng đài Mê-sô-bô-ta-mi về đó làm chiến lợi phẩm vào thế kỷ 12 TCN, và phái đoàn của Jacques de Morgan tìm thấy trong số đó, năm 1901–1902, tấm bia khắc luật của Hammurabi."
    - "Khoảng năm 646 TCN, vua A-si-ri Ashurbanipal chiếm Su-xơ, cướp các kho báu, phá ziggurat của nó và mang đi các thần cùng xương cốt các vua Ê-lam. Thành lại trỗi dậy dưới người Phe-rơ-sơ: Đa-ri-út I (522–486 TCN) biến nó thành nơi ngự của hoàng gia và xây một cung điện ở đó, ghi lại rằng gỗ bá hương được mang từ Li-ban, vàng từ Sạt-đe và Bactria, ngà từ Cút và Ấn Độ."
    - "Trong Kinh Thánh, Su-xơ là cung Su-sơ. Trong một khải tượng, Đa-ni-ên thấy mình ở Su-sơ cạnh sông U-lai, tức Eulaeus của người Hy Lạp, và tại đó thấy con chiên đực và con dê đực. Nê-hê-mi đang ở Su-sơ vào năm thứ hai mươi đời Ạt-ta-xét-xe khi nghe tin vách thành Giê-ru-sa-lem đổ nát, và tại đó ông hầu rượu cho vua. Sách Ê-xơ-tê lấy bối cảnh triều đình của A-suê-ru ở Su-sơ; ông thường được đồng nhất với Xerxes I."
    - "Năm 331 TCN, Su-xơ đầu hàng A-léc-xan-đơ Đại đế, người tìm thấy trong đó năm mươi nghìn ta-lâng, và năm 324 TCN ông tổ chức tại đó lễ cưới tập thể giữa các sĩ quan của mình với các quý bà Ba Tư và Mê-đi. Dưới nhà Seleucus, nó trở thành thành Hy Lạp, Sê-lơ-xi trên sông Eulaeus. Nó tiếp tục tồn tại dưới các vua Parthia và Sasan, dù không bao giờ lấy lại vị trí xưa."
  ro:
    - "Susa se afla în câmpia Huzestanului, în sud-vestul Iranului, între râurile Karkheh și Dez, la actualul oraș Shush. A fost întemeiată pe la 4000 î.Hr. pe o movilă numită mai târziu Acropola și, timp de mare parte din următorii trei mii de ani, a fost una dintre cetățile de seamă ale Elamului, deși uneori sub stăpânire mesopotamiană. Regele elamit Șutruk-Nahunte a dus acasă, ca pradă, monumente mesopotamiene în secolul al XII-lea î.Hr., iar misiunea lui Jacques de Morgan a găsit printre ele, în 1901–1902, stela cu legile lui Hammurabi."
    - "Pe la 646 î.Hr., regele asirian Asurbanipal a cucerit Susa, i-a jefuit vistieriile, i-a nimicit ziguratul și a luat zeii ei și oasele regilor Elamului. Cetatea s-a ridicat din nou sub perși: Darius I (522–486 î.Hr.) a făcut din ea reședință regală și a zidit acolo un palat, consemnând că a adus cedru din Liban, aur din Sardes și Bactriana și fildeș din Kush și India."
    - "În Biblie, Susa este Șușan, palatul. Într-o vedenie, Daniel s-a văzut în Șușan, lângă râul Ulai, Eulaios al grecilor, și acolo a văzut berbecul și țapul. Neemia se afla în Șușan în anul al douăzecilea al lui Artaxerxe, când a aflat de dărâmarea zidurilor Ierusalimului, și acolo i-a servit regelui vinul. Cartea Esterei se petrece la curtea lui Ahașveroș din Șușan; el este identificat de obicei cu Xerxes I."
    - "În 331 î.Hr., Susa s-a predat lui Alexandru cel Mare, care a găsit în ea cincizeci de mii de talanți, iar în 324 î.Hr. a ținut acolo nunta în masă a ofițerilor săi cu nobile persane și mede. Sub Seleucizi a devenit oraș grecesc, Seleucia de pe Eulaios. A continuat să trăiască sub regii parți și sasanizi, deși nu și-a mai recăpătat niciodată vechiul loc."
  bg:
    - "Суза се намирала в равнината Хузестан в Югозападен Иран, между реките Керхе и Дез, при днешния град Шуш. Основана била към 4000 г. пр.н.е. на могила, по-късно наречена Акропола, и през по-голямата част от следващите три хилядолетия била един от главните градове на Елам, макар понякога да била под месопотамска власт. Еламският цар Шутрук-Наххунте донесъл в нея месопотамски паметници като плячка през XII в. пр.н.е., а мисията на Жак дьо Морган открила сред тях през 1901–1902 г. стелата със законите на Хамурапи."
    - "Около 646 г. пр.н.е. асирийският цар Ашурбанипал превзел Суза, ограбил съкровищниците ѝ, разрушил зикурата ѝ и отнесъл боговете ѝ и костите на еламските царе. Градът се възродил при персите: Дарий I (522–486 г. пр.н.е.) го направил царска резиденция и построил там дворец, като записал, че кедърът бил донесен от Ливан, златото — от Сарди и Бактрия, а слоновата кост — от Куш и Индия."
    - "В Библията Суза е „Суса столицата“. Във видение Даниил се видял в Суза при реката Улай, Евлей на гърците, и там видял овена и козела. Неемия бил в Суза в двадесетата година на Артаксеркс, когато чул за разрушението на стените на Йерусалим, и там поднасял вино на царя. Действието на книгата Естир се развива в двора на Асуир в Суза; той обикновено се отъждествява с Ксеркс I."
    - "През 331 г. пр.н.е. Суза се предала на Александър Велики, който намерил в нея петдесет хиляди таланта, а през 324 г. пр.н.е. той устроил там масовата сватба на своите офицери с персийски и мидийски благороднички. При Селевкидите тя станала гръцки град — Селевкия на Евлей. Продължила да съществува при партските и сасанидските царе, макар никога да не си възвърнала старото място."
scripture:
  - Dan.8.1-Dan.8.5
  - Neh.1.1-Neh.1.3
