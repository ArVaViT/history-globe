# Overview article (ADR 0007). Mainstream facts only; the gate is unlocated and its position on the north wall is the usual inference; the origin of the name is given as the common explanation.
id: fish-gate
place: a6057f5
title:
  en: "Fish Gate"
  ru: "Рыбные ворота"
  uk: "Рибні ворота"
  es: "Puerta del Pescado"
  pt: "Porta do Peixe"
  de: "Fischtor"
  fr: "Porte des Poissons"
body:
  en:
    - "The Fish Gate was a gate in the north wall of Jerusalem, named, it is usually thought, from the fish market beside it: Nehemiah complains that men of Tyre living in the city “brought fish, and all manner of ware, and sold on the sabbath unto the children of Judah, and in Jerusalem”, and fish from the coast and from Galilee would have come in by the northern road. Nehemiah's procession passed, going east, the Gate of Ephraim, the Old Gate, the Fish Gate, the tower of Hananel and the tower of Meah, and then reached the Sheep Gate, so the Fish Gate stood in the eastern part of the north wall, near the valley that ran down between the western hill and the Temple. It has not been found."
    - "Manasseh, after his return from Assyria, “built a wall without the city of David, on the west side of Gihon, in the valley, even to the entering in at the fish gate”, and carried it round Ophel. In Nehemiah's repair “the fish gate did the sons of Hassenaah build, who also laid the beams thereof, and set up the doors thereof, the locks thereof, and the bars thereof”. Zephaniah, in the days of Josiah, hears the coming judgement in the sounds of the northern quarter: “there shall be the noise of a cry from the fish gate, and an howling from the second, and a great crashing from the hills”, and then bids the merchants of the Maktesh, the hollow below, to howl, for the trading people are cut down."
    - "The Second Quarter, the Mishneh, which Zephaniah names with the gate, was the newer part of the city on the western hill, enclosed in the late eighth century BC by the Broad Wall that Nahman Avigad found in the Jewish Quarter. The Fish Gate would have let the road from the north into that quarter and down to the Temple. The present Damascus Gate, the main northern gate of the Old City, lies further north, on a line of wall first built in the Roman period."
  ru:
    - "Рыбные ворота были воротами в северной стене Иерусалима, названными, как обычно считают, по рыбному рынку рядом: Неемия жалуется, что Тиряне, жившие в городе, «привозили рыбу и всякий товар и продавали в субботу жителям Иудеи и в Иерусалиме», а рыба с побережья и из Галилеи приходила северной дорогой. Шествие Неемии прошло на восток Ефремовы ворота, Старые ворота, Рыбные ворота, башню Хананела и башню Меа и затем дошло до Овечьих ворот, так что Рыбные ворота стояли в восточной части северной стены, у лощины, спускавшейся между западным холмом и храмом. Они не найдены."
    - "Манассия, вернувшись из Ассирии, «построил внешнюю стену города Давидова, на западной стороне Геона, по лощине и до входа в Рыбные ворота» и провёл её вокруг Офела. При починке Неемии «Ворота Рыбные строили уроженцы Сенаи: они покрыли их, и вставили двери их, замки их и засовы их». Софония во дни Иосии слышит грядущий суд в звуках северной части города: «вопль у ворот рыбных и рыдание у других ворот и великое разрушение на холмах», — и велит рыдать торговцам «нижней части города», ибо исчезнет весь торговый народ."
    - "Рыдание «у других ворот» — по-еврейски это Мишне, «второй город», который Софония называет рядом с воротами: новая часть города на западном холме, обнесённая в конце VIII века до н. э. Широкой стеной, которую Нахман Авигад нашёл в Еврейском квартале. Рыбные ворота впускали дорогу с севера в этот квартал и вниз к храму. Нынешние Дамасские ворота, главные северные ворота Старого города, лежат севернее, на линии стены, впервые построенной в римское время."
  uk:
    - "Рибні ворота були брамою в північному мурі Єрусалима, названою, як зазвичай думають, за рибним ринком поряд: Неемія скаржиться, що тирійці, які жили в місті, «привозили рибу та всякий крам і продавали в суботу осадникам Юдеї та Ерусалиму», а риба з узбережжя та з Галілеї входила б північною дорогою. Процесія Неемії проходила, рухаючись на схід, Ворота Єфремові, Старі ворота, Рибні ворота, вежу Хананела та вежу Меа, а потім дійшла до Овечих воріт, тож Рибні ворота стояли у східній частині північного муру, біля долини, що спускалася між західним пагорбом і храмом. Їх не знайдено."
    - "Манасія, повернувшись з Ассирії, «построїв … знадвірний мур міста Давидового, на західньому боцї Геона, долиною аж до приходу в рибні ворота» і провів його довкола Офела. Під час відбудови Неемії «Ворота же Рибні будували ті, що родом з Сенаї; вони вкрили їх і вставили двері їх, замки їх і засуви їх». Софонія за днів Йосії чує прийдешній суд у звуках північного кварталу: «роздаватись крик від Рибалчиної брами й риданнє від других воріт і велике зворушеннє по всїх узгірях», а потім велить торговцям Мактеша, западини внизу, голосити, бо торговий люд винищено."
    - "Друга частина, Мішне, яку Софонія називає разом із воротами, була новішою частиною міста на західному пагорбі, огородженою наприкінці VIII ст. до н. е. Широкою стіною, яку Нахман Авігад знайшов у Єврейському кварталі. Рибні ворота пропускали б дорогу з півночі в цей квартал і вниз до храму. Нинішні Дамаські ворота, головна північна брама Старого міста, лежать далі на північ, на лінії муру, вперше збудованого в римську добу."
  es:
    - "La Puerta del Pescado era una puerta de la muralla norte de Jerusalén, llamada, según se suele pensar, por el mercado de pescado junto a ella: Nehemías se queja de que los tirios que vivían en la ciudad «traían pescado y toda mercadería, y vendían en sábado á los hijos de Judá en Jerusalem», y el pescado de la costa y de Galilea habría entrado por el camino del norte. La procesión de Nehemías pasó, yendo hacia el este, por la Puerta de Efraín, la Puerta Vieja, la Puerta del Pescado, la torre de Hananeel y la torre de Meá, y luego llegó a la Puerta de las Ovejas, de modo que la Puerta del Pescado estaba en la parte oriental de la muralla norte, cerca del valle que descendía entre la colina occidental y el Templo. No ha sido hallada."
    - "Manasés, tras su regreso de Asiria, «edificó el muro de afuera de la ciudad de David, al occidente de Gihón, en el valle, á la entrada de la puerta del pescado», y lo llevó en torno a Ofel. En la reparación de Nehemías, «los hijos de Senaa edificaron la puerta del Pescado: ellos la enmaderaron, y levantaron sus puertas, con sus cerraduras y sus cerrojos». Sofonías, en tiempos de Josías, oye el juicio que viene en los sonidos del barrio norte: «voz de clamor desde la puerta del pescado, y aullido desde la segunda, y grande quebrantamiento desde los collados», y luego ordena a los mercaderes del Mactes, la hondonada de abajo, que aúllen, pues el pueblo comerciante es destruido."
    - "El Segundo Barrio, el Mishneh, que Sofonías nombra con la puerta, era la parte más nueva de la ciudad en la colina occidental, cercada a finales del siglo VIII a. C. por el Muro Ancho que Nahman Avigad halló en el Barrio Judío. La Puerta del Pescado habría dado entrada al camino del norte hacia ese barrio y de allí al Templo. La actual Puerta de Damasco, la principal puerta norte de la Ciudad Vieja, se halla más al norte, en una línea de muralla levantada por primera vez en el periodo romano."
  pt:
    - "A Porta do Peixe era uma porta no muro norte de Jerusalém, assim chamada, segundo se pensa em geral, pelo mercado de peixe ao lado dela: Neemias se queixa de que homens de Tiro que viviam na cidade “traziam peixes e todo tipo de mercadorias, e vendiam no sábado aos filhos de Judá, e em Jerusalém”, e o peixe da costa e da Galileia teria entrado pela estrada do norte. A procissão de Neemias passou, indo para o leste, pela Porta de Efraim, pela Porta Velha, pela Porta do Peixe, pela torre de Hananel e pela torre de Meá, e então chegou à Porta das Ovelhas, de modo que a Porta do Peixe ficava na parte oriental do muro norte, perto do vale que descia entre a colina ocidental e o Templo. Não foi encontrada."
    - "Manassés, depois de voltar da Assíria, “construiu um muro externo para a cidade de Davi, no lado oeste de Giom, no vale, até a entrada da Porta dos Peixes”, e o levou em volta de Ofel. No reparo de Neemias, “Os filhos de Hassenaá edificaram a Porta dos Peixes. Eles colocaram as suas vigas, e assentaram as suas portas, os seus ferrolhos e as suas trancas”. Sofonias, nos dias de Josias, ouve o juízo que vem nos sons do bairro norte: “haverá um grito vindo da Porta dos Peixes, um lamento vindo do segundo distrito e um grande estrondo vindo das colinas”, e depois manda os comerciantes de Mactes, a depressão abaixo, lamentarem, pois o povo mercador foi exterminado."
    - "O Segundo Bairro, o Mishné, que Sofonias nomeia com a porta, era a parte mais nova da cidade na colina ocidental, cercada no fim do século VIII a.C. pela Muralha Larga que Nahman Avigad achou no Bairro Judeu. A Porta do Peixe daria passagem à estrada do norte para esse bairro e dali para baixo, até o Templo. A atual Porta de Damasco, a principal porta norte da Cidade Velha, fica mais ao norte, numa linha de muro construída primeiro no período romano."
  de:
    - "Das Fischtor war ein Tor in der Nordmauer Jerusalems, wie man gewöhnlich meint nach dem Fischmarkt daneben benannt: Nehemia klagt, dass Männer aus Tyrus, die in der Stadt wohnten, „Fische und allerlei Ware“ brachten und „verkauften’s am Sabbat den Kindern Juda’s in Jerusalem“, und Fische von der Küste und aus Galiläa werden über die Nordstraße hereingekommen sein. Nehemias Prozession passierte auf ihrem Weg nach Osten das Ephraimtor, das Alte Tor, das Fischtor, den Turm Hananeel und den Turm Mea und erreichte dann das Schaftor, sodass das Fischtor im östlichen Teil der Nordmauer stand, nahe dem Tal, das zwischen dem Westhügel und dem Tempel hinabführte. Es ist nicht gefunden worden."
    - "Manasse baute nach seiner Rückkehr aus Assyrien „die äußere Mauer an der Stadt Davids abendswärts an Gihon im Tal und wo man zum Fischtor eingeht und umher an den Ophel“. Bei Nehemias Ausbesserung: „Aber das Fischtor bauten die Kinder von Senaa, sie deckten es und setzten seine Türen ein, Schlösser und Riegel.“ Zefanja hört in den Tagen Josias das kommende Gericht in den Lauten des nördlichen Stadtviertels: „wird sich ein lautes Geschrei erheben von dem Fischtor her und ein Geheul von dem andern Teil der Stadt und ein großer Jammer von den Hügeln“, und fordert dann die Händler des Maktesch, der Senke darunter, zum Heulen auf, denn das Krämervolk ist vernichtet."
    - "Der Zweite Stadtteil, die Mischne, den Zefanja mit dem Tor nennt, war der neuere Teil der Stadt auf dem Westhügel, im späten 8. Jahrhundert v. Chr. von der Breiten Mauer umschlossen, die Nahman Avigad im Jüdischen Viertel fand. Das Fischtor hätte die Straße aus dem Norden in dieses Viertel und hinab zum Tempel eingelassen. Das heutige Damaskustor, das Haupttor der Altstadt im Norden, liegt weiter nördlich, auf einer erst in römischer Zeit gebauten Mauerlinie."
  fr:
    - "La Porte des Poissons était une porte du mur nord de Jérusalem, nommée, pense-t-on d’ordinaire, d’après le marché au poisson voisin : Néhémie se plaint que des Tyriens établis dans la ville, « qui apportaient du poisson et toutes sortes de marchandises, et qui les vendaient aux fils de Juda le jour du sabbat et dans Jérusalem », et le poisson de la côte et de Galilée serait entré par la route du nord. La procession de Néhémie, allant vers l’est, passa devant la Porte d’Éphraïm, la Vieille Porte, la Porte des Poissons, la tour de Hananeel et la tour de Méa, puis atteignit la Porte des Brebis ; la Porte des Poissons se trouvait donc dans la partie orientale du mur nord, près de la vallée qui descendait entre la colline occidentale et le Temple. On ne l’a pas retrouvée."
    - "Manassé, après son retour d’Assyrie, « bâtit en dehors de la ville de David, à l’occident, vers Guihon dans la vallée, un mur qui se prolongeait jusqu’à la porte des poissons », et le fit tourner autour de l’Ophel. Dans la réparation de Néhémie, « les fils de Senaa bâtirent la porte des poissons. Ils la couvrirent, et en posèrent les battants, les verrous et les barres ». Sophonie, du temps de Josias, entend le jugement venir dans les bruits du quartier nord : « Il y aura des cris à la porte des poissons, des lamentations dans l’autre quartier de la ville, et un grand désastre sur les collines », puis il invite les marchands du Maktesch, le creux en contrebas, à gémir, car le peuple marchand est retranché."
    - "Le Second quartier, le Mishné, que Sophonie nomme avec la porte, était la partie plus récente de la ville sur la colline occidentale, enclose à la fin du VIIIe siècle av. J.-C. par la Muraille large que Nahman Avigad trouva dans le quartier juif. La Porte des Poissons aurait laissé la route du nord entrer dans ce quartier et descendre vers le Temple. L’actuelle Porte de Damas, principale porte nord de la Vieille Ville, se trouve plus au nord, sur une ligne de mur d’abord bâtie à l’époque romaine."
