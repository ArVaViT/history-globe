body:
  en:
    - "The Fish Gate was a gate in the north wall of Jerusalem, named, it is usually thought, from the fish market beside it: Nehemiah complains that men of Tyre living in the city “brought fish, and all manner of ware, and sold on the sabbath unto the children of Judah, and in Jerusalem”, and fish from the coast and from Galilee would have come in by the northern road. Nehemiah's procession passed, going east, the Gate of Ephraim, the Old Gate, the Fish Gate, the tower of Hananel and the tower of Meah, and then reached the Sheep Gate, so the Fish Gate stood in the north wall west of the Temple, most often placed near the valley that ran down between the western hill and the Temple. It has not been found."
    - "Manasseh, after he was brought back from captivity in Babylon, “built a wall without the city of David, on the west side of Gihon, in the valley, even to the entering in at the fish gate”, and carried it round Ophel. In Nehemiah's repair “the fish gate did the sons of Hassenaah build, who also laid the beams thereof, and set up the doors thereof, the locks thereof, and the bars thereof”. Zephaniah, in the days of Josiah, hears the coming judgement in the sounds of the northern quarter: “there shall be the noise of a cry from the fish gate, and an howling from the second, and a great crashing from the hills”, and then bids the inhabitants of the Maktesh, the hollow below, to howl, for the trading people are cut down."
    - "The Second Quarter, the Mishneh, which Zephaniah names with the gate, was the newer part of the city on the western hill, enclosed in the eighth century BC by the Broad Wall that Nahman Avigad found in the Jewish Quarter. The Fish Gate would have let the road from the north into that quarter and down to the Temple. The present Damascus Gate, the main northern gate of the Old City, lies further north, on a line of wall first built in the Roman period."
  ru:
    - "Рыбные ворота были воротами в северной стене Иерусалима, названными, как обычно считают, по рыбному рынку рядом: Неемия жалуется, что Тиряне, жившие в городе, «привозили рыбу и всякий товар и продавали в субботу жителям Иудеи и в Иерусалиме», а рыба с побережья и из Галилеи приходила северной дорогой. Шествие Неемии прошло на восток Ефремовы ворота, Старые ворота, Рыбные ворота, башню Хананела и башню Меа и затем дошло до Овечьих ворот, так что Рыбные ворота стояли в северной стене к западу от храма — чаще всего их помещают у лощины, спускавшейся между западным холмом и храмом. Они не найдены."
    - "Манассия, возвращённый из плена в Вавилоне, «построил внешнюю стену города Давидова, на западной стороне Геона, по лощине и до входа в Рыбные ворота» и провёл её вокруг Офела. При починке Неемии «Ворота Рыбные строили уроженцы Сенаи: они покрыли их, и вставили двери их, замки их и засовы их». Софония во дни Иосии слышит грядущий суд в звуках северной части города: «вопль у ворот рыбных и рыдание у других ворот и великое разрушение на холмах», — и велит рыдать жителям «нижней части города», ибо исчезнет весь торговый народ."
    - "Рыдание «у других ворот» — по-еврейски это Мишне, «второй город», который Софония называет рядом с воротами: новая часть города на западном холме, обнесённая в VIII веке до н. э. Широкой стеной, которую Нахман Авигад нашёл в Еврейском квартале. Рыбные ворота впускали дорогу с севера в этот квартал и вниз к храму. Нынешние Дамасские ворота, главные северные ворота Старого города, лежат севернее, на линии стены, впервые построенной в римское время."
  uk:
    - "Рибні ворота були брамою в північному мурі Єрусалима, названою, як зазвичай думають, за рибним ринком поряд: Неемія скаржиться, що тирійці, які жили в місті, «привозили рибу та всякий крам і продавали в суботу осадникам Юдеї та Ерусалиму», а риба з узбережжя та з Галілеї входила б північною дорогою. Процесія Неемії проходила, рухаючись на схід, Ворота Єфремові, Старі ворота, Рибні ворота, вежу Хананела та вежу Меа, а потім дійшла до Овечих воріт, тож Рибні ворота стояли в північному мурі на захід від храму, найчастіше їх розміщують біля долини, що спускалася між західним пагорбом і храмом. Їх не знайдено."
    - "Манасія, повернутий з полону у Вавилоні, «построїв … знадвірний мур міста Давидового, на західньому боцї Геона, долиною аж до приходу в рибні ворота» і провів його довкола Офела. Під час відбудови Неемії «Ворота же Рибні будували ті, що родом з Сенаї; вони вкрили їх і вставили двері їх, замки їх і засуви їх». Софонія за днів Йосії чує прийдешній суд у звуках північного кварталу: «роздаватись крик від Рибалчиної брами й риданнє від других воріт і велике зворушеннє по всїх узгірях», а потім велить мешканцям Мактеша, западини внизу, голосити, бо торговий люд винищено."
    - "Друга частина, Мішне, яку Софонія називає разом із воротами, була новішою частиною міста на західному пагорбі, огородженою у VIII ст. до н. е. Широкою стіною, яку Нахман Авігад знайшов у Єврейському кварталі. Рибні ворота пропускали б дорогу з півночі в цей квартал і вниз до храму. Нинішні Дамаські ворота, головна північна брама Старого міста, лежать далі на північ, на лінії муру, вперше збудованого в римську добу."
  es:
    - "La Puerta del Pescado era una puerta de la muralla norte de Jerusalén, llamada, según se suele pensar, por el mercado de pescado junto a ella: Nehemías se queja de que los tirios que vivían en la ciudad «traían pescado y toda mercadería, y vendían en sábado á los hijos de Judá en Jerusalem», y el pescado de la costa y de Galilea habría entrado por el camino del norte. La procesión de Nehemías pasó, yendo hacia el este, por la Puerta de Efraín, la Puerta Vieja, la Puerta del Pescado, la torre de Hananeel y la torre de Meá, y luego llegó a la Puerta de las Ovejas, de modo que la Puerta del Pescado estaba en la muralla norte al oeste del Templo, y se la sitúa casi siempre cerca del valle que descendía entre la colina occidental y el Templo. No ha sido hallada."
    - "Manasés, tras ser devuelto del cautiverio en Babilonia, «edificó el muro de afuera de la ciudad de David, al occidente de Gihón, en el valle, á la entrada de la puerta del pescado», y lo llevó en torno a Ofel. En la reparación de Nehemías, «los hijos de Senaa edificaron la puerta del Pescado: ellos la enmaderaron, y levantaron sus puertas, con sus cerraduras y sus cerrojos». Sofonías, en tiempos de Josías, oye el juicio que viene en los sonidos del barrio norte: «voz de clamor desde la puerta del pescado, y aullido desde la segunda, y grande quebrantamiento desde los collados», y luego ordena a los moradores del Mactes, la hondonada de abajo, que aúllen, pues el pueblo comerciante es destruido."
    - "El Segundo Barrio, el Mishneh, que Sofonías nombra con la puerta, era la parte más nueva de la ciudad en la colina occidental, cercada en el siglo VIII a. C. por el Muro Ancho que Nahman Avigad halló en el Barrio Judío. La Puerta del Pescado habría dado entrada al camino del norte hacia ese barrio y de allí al Templo. La actual Puerta de Damasco, la principal puerta norte de la Ciudad Vieja, se halla más al norte, en una línea de muralla levantada por primera vez en el periodo romano."
  pt:
    - "A Porta do Peixe era uma porta no muro norte de Jerusalém, assim chamada, segundo se pensa em geral, pelo mercado de peixe ao lado dela: Neemias se queixa de que homens de Tiro que viviam na cidade “traziam peixes e todo tipo de mercadorias, e vendiam no sábado aos filhos de Judá, e em Jerusalém”, e o peixe da costa e da Galileia teria entrado pela estrada do norte. A procissão de Neemias passou, indo para o leste, pela Porta de Efraim, pela Porta Velha, pela Porta do Peixe, pela torre de Hananel e pela torre de Meá, e então chegou à Porta das Ovelhas, de modo que a Porta do Peixe ficava no muro norte a oeste do Templo, situada as mais das vezes perto do vale que descia entre a colina ocidental e o Templo. Não foi encontrada."
    - "Manassés, depois de ser trazido de volta do cativeiro na Babilônia, “construiu um muro externo para a cidade de Davi, no lado oeste de Giom, no vale, até a entrada da Porta dos Peixes”, e o levou em volta de Ofel. No reparo de Neemias, “Os filhos de Hassenaá edificaram a Porta dos Peixes. Eles colocaram as suas vigas, e assentaram as suas portas, os seus ferrolhos e as suas trancas”. Sofonias, nos dias de Josias, ouve o juízo que vem nos sons do bairro norte: “haverá um grito vindo da Porta dos Peixes, um lamento vindo do segundo distrito e um grande estrondo vindo das colinas”, e depois manda os moradores de Mactes, a depressão abaixo, lamentarem, pois o povo mercador foi exterminado."
    - "O Segundo Bairro, o Mishné, que Sofonias nomeia com a porta, era a parte mais nova da cidade na colina ocidental, cercada no século VIII a.C. pela Muralha Larga que Nahman Avigad achou no Bairro Judeu. A Porta do Peixe daria passagem à estrada do norte para esse bairro e dali para baixo, até o Templo. A atual Porta de Damasco, a principal porta norte da Cidade Velha, fica mais ao norte, numa linha de muro construída primeiro no período romano."
  de:
    - "Das Fischtor war ein Tor in der Nordmauer Jerusalems, wie man gewöhnlich meint nach dem Fischmarkt daneben benannt: Nehemia klagt, dass Männer aus Tyrus, die in der Stadt wohnten, „Fische und allerlei Ware“ brachten und „verkauften’s am Sabbat den Kindern Juda’s in Jerusalem“, und Fische von der Küste und aus Galiläa werden über die Nordstraße hereingekommen sein. Nehemias Prozession passierte auf ihrem Weg nach Osten das Ephraimtor, das Alte Tor, das Fischtor, den Turm Hananeel und den Turm Mea und erreichte dann das Schaftor, sodass das Fischtor in der Nordmauer westlich des Tempels stand, meist nahe dem Tal angesetzt, das zwischen dem Westhügel und dem Tempel hinabführte. Es ist nicht gefunden worden."
    - "Manasse baute, nachdem er aus der Gefangenschaft in Babel zurückgebracht worden war, „die äußere Mauer an der Stadt Davids abendswärts an Gihon im Tal und wo man zum Fischtor eingeht und umher an den Ophel“. Bei Nehemias Ausbesserung: „Aber das Fischtor bauten die Kinder von Senaa, sie deckten es und setzten seine Türen ein, Schlösser und Riegel.“ Zefanja hört in den Tagen Josias das kommende Gericht in den Lauten des nördlichen Stadtviertels: „wird sich ein lautes Geschrei erheben von dem Fischtor her und ein Geheul von dem andern Teil der Stadt und ein großer Jammer von den Hügeln“, und fordert dann die Bewohner des Maktesch, der Senke darunter, zum Heulen auf, denn das Krämervolk ist vernichtet."
    - "Der Zweite Stadtteil, die Mischne, den Zefanja mit dem Tor nennt, war der neuere Teil der Stadt auf dem Westhügel, im 8. Jahrhundert v. Chr. von der Breiten Mauer umschlossen, die Nahman Avigad im Jüdischen Viertel fand. Das Fischtor hätte die Straße aus dem Norden in dieses Viertel und hinab zum Tempel eingelassen. Das heutige Damaskustor, das Haupttor der Altstadt im Norden, liegt weiter nördlich, auf einer erst in römischer Zeit gebauten Mauerlinie."
  fr:
    - "La Porte des Poissons était une porte du mur nord de Jérusalem, nommée, pense-t-on d’ordinaire, d’après le marché au poisson voisin : Néhémie se plaint que des Tyriens établis dans la ville, « qui apportaient du poisson et toutes sortes de marchandises, et qui les vendaient aux fils de Juda le jour du sabbat et dans Jérusalem », et le poisson de la côte et de Galilée serait entré par la route du nord. La procession de Néhémie, allant vers l’est, passa devant la Porte d’Éphraïm, la Vieille Porte, la Porte des Poissons, la tour de Hananeel et la tour de Méa, puis atteignit la Porte des Brebis ; la Porte des Poissons se trouvait donc dans le mur nord à l’ouest du Temple, le plus souvent placée près de la vallée qui descendait entre la colline occidentale et le Temple. On ne l’a pas retrouvée."
    - "Manassé, après avoir été ramené de sa captivité à Babylone, « bâtit en dehors de la ville de David, à l’occident, vers Guihon dans la vallée, un mur qui se prolongeait jusqu’à la porte des poissons », et le fit tourner autour de l’Ophel. Dans la réparation de Néhémie, « les fils de Senaa bâtirent la porte des poissons. Ils la couvrirent, et en posèrent les battants, les verrous et les barres ». Sophonie, du temps de Josias, entend le jugement venir dans les bruits du quartier nord : « Il y aura des cris à la porte des poissons, des lamentations dans l’autre quartier de la ville, et un grand désastre sur les collines », puis il invite les habitants du Maktesch, le creux en contrebas, à gémir, car le peuple marchand est retranché."
    - "Le Second quartier, le Mishné, que Sophonie nomme avec la porte, était la partie plus récente de la ville sur la colline occidentale, enclose au VIIIe siècle av. J.-C. par la Muraille large que Nahman Avigad trouva dans le quartier juif. La Porte des Poissons aurait laissé la route du nord entrer dans ce quartier et descendre vers le Temple. L’actuelle Porte de Damas, principale porte nord de la Vieille Ville, se trouve plus au nord, sur une ligne de mur d’abord bâtie à l’époque romaine."
  it:
    - "La Porta dei Pesci era una porta del muro settentrionale di Gerusalemme, così chiamata, si ritiene di solito, dal mercato del pesce accanto ad essa: Neemia lamenta che uomini di Tiro che abitavano nella città «portavano del pesce e ogni sorta di cose, e le vendevano ai figliuoli di Giuda in giorni di sabato, e in Gerusalemme», e il pesce della costa e della Galilea sarebbe giunto dalla strada del nord. La processione di Neemia, andando verso est, passò la Porta di Efraim, la Porta Vecchia, la Porta dei Pesci, la torre di Cananeèl e la torre di Mea, e poi raggiunse la Porta delle Pecore, sicché la Porta dei Pesci stava nel muro settentrionale a ovest del Tempio, e la si colloca per lo più presso la valle che scendeva fra la collina occidentale e il Tempio. Non è stata trovata."
    - "Manasse, dopo essere stato ricondotto dalla prigionia in Babilonia, «costruì, fuori della città di Davide, a occidente, verso Ghihon nella valle, un muro che si prolungava fino alla porta dei pesci», e lo fece girare attorno a Ofel. Nel restauro di Neemia «I figliuoli di Senaa costruirono la porta de’ Pesci, ne fecero l’intelaiatura, e vi posero le imposte, le serrature e le sbarre». Sofonia, ai giorni di Giosia, ode il giudizio imminente nei suoni del quartiere settentrionale: «s’udrà un grido dalla porta dei pesci, un urlo dalla seconda cinta, e un gran fracasso dalle colline», e poi ordina agli abitanti del Maktesh, la conca sottostante, di urlare, perché il popolo dei commercianti è annientato."
    - "Il Secondo Quartiere, il Mishneh, che Sofonia nomina con la porta, era la parte più recente della città sulla collina occidentale, racchiusa nell’VIII secolo a.C. dal Muro Largo trovato da Nahman Avigad nel Quartiere Ebraico. La Porta dei Pesci avrebbe lasciato entrare la strada da nord in quel quartiere e giù verso il Tempio. L’attuale Porta di Damasco, la principale porta settentrionale della Città Vecchia, si trova più a nord, su una linea di mura costruita per la prima volta in epoca romana."
  pl:
    - "Brama Rybna była bramą w północnym murze Jerozolimy, nazwaną, jak zwykle sądzi się, od targu rybnego obok niej: Nehemiasz skarży się, że mieszkańcy Tyru w mieście „przynosili ryby, i rozmaite towary, a sprzedawali w sabat synom Judy, i w Jeruzalemie”, a ryby z wybrzeża i z Galilei wchodziły do miasta północną drogą. Procesja Nehemiasza mijała, idąc na wschód, Bramę Efraima, Bramę Starą, Bramę Rybną, wieżę Chananeela i wieżę Mea, po czym dochodziła do Bramy Owczej, więc Brama Rybna stała w północnym murze na zachód od świątyni, umieszczana najczęściej blisko doliny biegnącej między zachodnim wzgórzem a świątynią. Nie została odnaleziona."
    - "Manasses, sprowadzony z powrotem z niewoli w Babilonie, „budował mur około miasta Dawidowego ku zachodniej stronie Gichonu potoku aż do wejścia do bramy rybnej”, i poprowadził go wokół Ofelu. W naprawach Nehemiasza: „A bramę rybną budowali synowie Senaa, którzy ją też przykryli i przyprawili wrota do niej, i zamki jej, i zawory jej”. Sofoniasz za Jozjasza słyszy nadchodzący sąd w dźwiękach północnej dzielnicy: „będzie głos wołania od bramy rybnej, i narzekanie od drugiej strony (miasta), i skruszenie wielkie od pagórków”, a potem każe mieszkańcom Maktesz, zagłębienia poniżej, zawodzić, bo lud handlowy został wycięty."
    - "Druga Dzielnica, Miszne, którą Sofoniasz wymienia z bramą, była nowszą częścią miasta na zachodnim wzgórzu, otoczoną w VIII w. p.n.e. Szerokim Murem, który Nahman Awigad znalazł w Dzielnicy Żydowskiej. Przez Bramę Rybną droga z północy wchodziłaby do tej dzielnicy i schodziła w dół do świątyni. Obecna Brama Damasceńska, główna brama północna Starego Miasta, leży dalej na północ, na linii muru zbudowanego po raz pierwszy w okresie rzymskim."
  nl:
    - "De Vispoort was een poort in de noordmuur van Jeruzalem, naar men meestal denkt genoemd naar de vismarkt ernaast: Nehemia klaagt dat Tyriërs die in de stad woonden “die vis aanbrachten, en alle koopwaren, die zij op den sabbat verkochten aan de kinderen van Juda en te Jeruzalem”, en vis van de kust en uit Galilea zou over de noordelijke weg zijn binnengekomen. Nehemia's optocht passeerde, oostwaarts gaand, de Efraïmpoort, de Oude Poort, de Vispoort, de toren van Hananel en de toren van Mea, en bereikte dan de Schaapspoort, zodat de Vispoort in de noordmuur ten westen van de tempel stond, meestal geplaatst bij het dal dat tussen de westelijke heuvel en de tempel neerliep. Zij is niet gevonden."
    - "Manasse, nadat hij uit de gevangenschap in Babel was teruggebracht, “bouwde hij den buitenmuur aan de stad Davids, aan de westzijde van Gihon in het dal, en tot den ingang van de Vispoort”, en voerde hem rond Ofel. Bij Nehemia's herstel: “De Vispoort nu bouwden de kinderen van Senaa; zij zolderden die, en richtten haar deuren op, met haar sloten en haar grendelen”. Zefanja hoort in de dagen van Josia het komende oordeel in de geluiden van het noordelijke kwartier: “een stem des gekrijts zijn van de Vispoort af, en een gehuil van het tweede gedeelte, en een grote breuk van de heuvelen af”, en beveelt dan de inwoners van de Maktesj, de laagte beneden, te jammeren, want het handelsvolk is uitgehouwen."
    - "Het Tweede Kwartier, de Misjne, dat Zefanja met de poort noemt, was het nieuwere deel van de stad op de westelijke heuvel, in de achtste eeuw v.Chr. ingesloten door de Brede Muur die Nahman Avigad in de Joodse wijk vond. De Vispoort zou de weg uit het noorden in dat kwartier en omlaag naar de tempel hebben toegelaten. De huidige Damascuspoort, de hoofdpoort van de Oude Stad in het noorden, ligt verder noordelijk, op een muurlijn die pas in de Romeinse tijd werd aangelegd."
  cs:
    - "Rybí brána byla branou v severní hradbě Jeruzaléma, pojmenovanou, jak se obvykle soudí, podle rybího trhu vedle ní: Nehemjáš si stěžuje, že Týrští bydlící ve městě „nosili ryby i všelijaké koupě, a prodávali v sobotu synům Juda, a to v Jeruzalémě“, a ryby z pobřeží a z Galileje by přicházely severní cestou. Nehemjášův průvod minul na cestě na východ Efrajimskou bránu, Starou bránu, Rybí bránu, věž Chananel a věž Mea a pak dosáhl Ovčí brány, takže Rybí brána stála v severní hradbě západně od chrámu, nejčastěji se klade poblíž údolí, které sbíhalo mezi západním pahorkem a chrámem. Nebyla nalezena."
    - "Manases, když byl přiveden zpět ze zajetí v Babylóně, „vystavěl zed zevnitřní města Davidova k západní straně Gihonu potoku, až kudy se chodí k bráně rybné, a obehnal Ofel“. Při Nehemjášově opravě „Bránu pak rybnou stavěli synové Senaa. Ti položili trámy její, a vstavili vrata její s zámky i závorami jejími“. Sofonjáš za dnů Jošijášových slyší nadcházející soud ve zvucích severní čtvrti: „hlas křiku od brány rybné, a kvílení od druhé strany a třeskot veliký od pahrbků“, a pak vyzývá obyvatele Maktešu, kotliny pod ní, aby kvěleli, neboť obchodní lid je vyhlazen."
    - "Druhá čtvrť, Mišne, kterou Sofonjáš jmenuje s branou, byla novější část města na západním pahorku, uzavřená v 8. století př. n. l. širokou hradbou, kterou Nahman Avigad nalezl v Židovské čtvrti. Rybí brána by vpouštěla cestu ze severu do té čtvrti a dolů k chrámu. Dnešní Damašská brána, hlavní severní brána Starého města, leží dále na sever, na linii hradby poprvé vystavěné v římském období."
  sv:
    - "Fiskporten var en port i Jerusalems norra mur, uppkallad, antar man oftast, efter fiskmarknaden intill: Nehemja klagar över att tyrier som bodde i staden ”förde in fisk och alla slags varor och sålde dem på sabbaten till judarna, och detta i Jerusalem”, och fisk från kusten och från Galileen torde ha kommit in via norra vägen. Nehemjas tåg passerade österut Efraimsporten, Gamla porten, Fiskporten, Hananeltornet och Meatornet och nådde sedan Fårporten, så Fiskporten låg i norra muren väster om Templet, oftast placerad nära dalen som löpte ned mellan västra kullen och Templet. Den har inte hittats."
    - "Manasse, efter hemkomsten från fångenskapen i Babylon, ”byggde ... en yttre mur till Davids stad västerut mot Gihon i dalen, intill Fiskporten”, och förde den runt Ofel. Vid Nehemjas återuppbyggnad ”Fiskporten byggdes av Hassenaas barn; de timrade upp den och satte in dess dörrar, dess riglar och bommar”. Sefanja, på Josias tid, hör den kommande domen i ljuden från norra kvarteret: ”skall klagorop höras ifrån Fiskporten och jämmer från Nya staden och stort brak från höjderna”, och uppmanar sedan invånarna i Maktesh, svackan nedanför, att jämra sig, ty handelsfolket är utrotat."
    - "Nya staden, Mishne, som Sefanja nämner tillsammans med porten, var den yngre stadsdelen på västra kullen, som på 700-talet f.Kr. omslöts av Breda muren som Nahman Avigad fann i Judiska kvarteret. Fiskporten skulle ha släppt in vägen från norr i den stadsdelen och ned mot Templet. Dagens Damaskusport, Gamla stadens huvudport i norr, ligger längre norrut, på en murlinje som först byggdes under romersk tid."
  nb:
    - "Fiskeporten var en port i Jerusalems nordmur, som vanligvis antas å ha fått navn etter fiskemarkedet ved siden av: Nehemja klager over at «folk fra Tyrus, som opholdt sig der, kom med fisk og alle slags varer og solgte dem på sabbaten til Judas barn, og det i Jerusalem», og fisk fra kysten og fra Galilea ville ha kommet inn ad nordveien. Nehemjas prosesjon passerte, på vei østover, Efraimporten, Den gamle port, Fiskeporten, Hananel-tårnet og Mea-tårnet, og nådde så Saueporten, så Fiskeporten sto i nordmuren vest for tempelet, oftest plassert nær dalen som gikk ned mellom vestkullen og tempelet. Den er ikke funnet."
    - "Manasse, etter at han var ført tilbake fra fangenskapet i Babylon, «bygget ... en ytre mur for Davids stad vestenfor Gihon i dalen og til inngangen gjennem Fiske-porten», og lot den gå rundt Ofel. Ved Nehemjas gjenoppbygging gjaldt: «Fiskeporten blev bygget av Sena'as barn; de tømret den op og satte inn dører, låser og slåer.» Sefanja, i Josjias dager, hører den kommende dommen i lydene fra nordkanten av byen: «skal det lyde skrik fra Fiskeporten og hyl fra stadens andre del og stort brak fra haugene», og ber så innbyggerne i Maktesj, søkket nedenfor, om å hyle, for handelsfolket er hogd ned."
    - "Nybyen, Mishne, som Sefanja nevner sammen med porten, var den nyere delen av byen på vestkullen, innesluttet på 700-tallet f.Kr. av Bredmuren som Nahman Avigad fant i Jødekvarteret. Fiskeporten ville ha sluppet veien fra nord inn i denne bydelen og ned til tempelet. Dagens Damaskusport, den viktigste nordporten til Gamlebyen, ligger lenger nord, på en murlinje som først ble bygd i romersk tid."
  tl:
    - "Ang Pintuang-bayan ng mga Isda ay isang pintuan sa hilagang pader ng Jerusalem, na pinangalanan, ayon sa karaniwang palagay, mula sa pamilihan ng isda sa tabi nito: nagreklamo si Nehemias na ang mga taga-Tiro na naninirahan sa lungsod ay “nangagpapasok ng isda, at ng sarisaring kalakal, at nangagbibili sa sabbath sa mga anak ni Juda, at sa Jerusalem”, at ang isda mula sa baybayin at mula sa Galilea ay malamang na pumasok sa hilagang daan. Ang prusisyon ni Nehemias, patungong silangan, ay nagdaan sa Pintuang-bayan ng Ephraim, sa Lumang Pintuang-bayan, sa Pintuang-bayan ng mga Isda, sa Moog ng Hananeel at sa moog ng Meah, at pagkatapos ay dumating sa Pintuang-bayan ng mga Tupa, kaya ang Pintuang-bayan ng mga Isda ay nasa hilagang pader sa kanluran ng Templo, na kadalasang inilalagay malapit sa libis na bumababa sa pagitan ng kanlurang burol at ng Templo. Hindi pa ito natatagpuan."
    - "Si Manases, nang maibalik mula sa pagkabihag sa Babilonia, ay nagtayo ng “isang kutang panglabas sa bayan ni David, sa dakong kalunuran ng Gihon, sa libis, hanggang sa pasukan sa pintuang-bayan ng mga isda”, at ipinalibot ito sa Ophel. Sa pagpapaayos ni Nehemias, “ang pintuang-bayan ng mga isda ay itinayo ng mga anak ni Senaa; kanilang inilapat ang mga tahilan niyaon, at inilagay ang mga pinto niyaon, ang mga trangka niyaon, at ang mga halang niyaon”. Naririnig ni Zefanias, noong mga araw ni Josias, ang paparating na hatol sa mga tunog ng hilagang purok: “magkakaroon ng ingay ng hiyawan na mula sa pintuang-bayan ng mga isda, at ng pananambitan mula sa ikalawang bahagi, at malaking hugong na mula sa mga burol”, at pagkatapos ay iniuutos sa mga naninirahan sa Mactes, ang bangin sa ibaba, na manambitan, sapagkat ang mga mangangalakal ay lipol na."
    - "Ang Ikalawang Purok, ang Mishneh, na pinangalanan ni Zefanias kasama ng pintuan, ay ang mas bagong bahagi ng lungsod sa kanlurang burol, na nabakuran noong ika-8 siglo BK ng Malapad na Kuta na natagpuan ni Nahman Avigad sa Kwarter ng mga Judio. Papasukin sana ng Pintuang-bayan ng mga Isda ang daan mula sa hilaga patungo sa purok na iyon at pababa sa Templo. Ang kasalukuyang Pintuang Damasco, ang pangunahing hilagang pintuan ng Lumang Lungsod, ay nasa higit na hilaga, sa isang hanay ng pader na unang itinayo noong panahong Romano."
  da:
    - "Fiskeporten var en port i Jerusalems nordmur, opkaldt, som man som regel mener, efter fiskemarkedet ved siden af den: Nehemias klager over, at tyrere, der boede i byen, »førte Fisk og alle Haande Varer ind, og de solgte dem paa Sabbaten til Judas Børn og i Jerusalem«, og fisk fra kysten og fra Galilæa vil være kommet ind ad nordvejen. Nehemias' optog passerede mod øst Efraimsporten, Den Gamle Port, Fiskeporten, Hananels tårn og Meas tårn og nåede så Fåreporten; Fiskeporten lå altså i nordmuren vest for templet, oftest placeret nær dalen, der løb ned mellem vesthøjen og templet. Den er ikke fundet."
    - "Manasse byggede, efter at han var ført tilbage fra fangenskabet i Babylon, »den yderste Mur for Davids Stad, Vesten for Gihon i Dalen, og hen til Fiskeporten«, og førte den omkring Ofel. Ved Nehemias' istandsættelse: »Senaas Børn byggede Fiskeporten; de tømrede den og indsatte dens Døre med dens Laase og dens Stænger«. Sefanja, i Josias' dage, hører den kommende dom i lydene fra den nordlige bydel: »der skal paa denne Dag, siger Herren, lyde Raab fra Fiskeporten og Hylen fra Stadens anden Del og stor Forstyrrelse fra Højene«, og opfordrer så beboerne i Maktesj, hulningen nedenfor, til at hyle, for handelsfolket er udryddet."
    - "Den Anden Bydel, Mishne, som Sefanja nævner sammen med porten, var den nyere del af byen på vesthøjen, indhegnet i 700-tallet f.Kr. af Den Brede Mur, som Nahman Avigad fandt i Det Jødiske Kvarter. Fiskeporten ville have lukket vejen fra nord ind i den bydel og ned til templet. Den nuværende Damaskusport, den gamle bys vigtigste nordport, ligger længere mod nord på en murlinje, som først blev bygget i romertiden."
  sr:
    - "Рибља капија била је капија у северном зиду Јерусалима, названа, како се обично мисли, по рибљој пијаци поред ње: Немија се жали да Тирци који живљаху у граду „доношаху рибу и свакојаки трг и продаваху у суботу синовима Јудиним у Јерусалиму“, а риба с обале и из Галилеје улазила би северним путем. Немијина поворка је, идући на исток, прошла поред Јефремове капије, Старе капије, Рибље капије, куле Ананеилове и куле Меје, па дошла до Овчје капије, те је Рибља капија стајала у северном зиду западно од Храма, најчешће се ставља близу долине која се спуштала између западног брда и Храма. Није пронађена."
    - "Манасија је, пошто је враћен из заточеништва у Вавилону, по запису „озида зид иза града Давидовог са запада Гиону, од самог потока па до рибљих врата и око Офила“, то јест водио га је око Офела. У Немијиној обнови „врата рибља зидаше синови Асенајини, они их побрвнаше и метнуше крила и браве и преворнице“. Софонија у Јосијино доба чује долазећи суд у гласовима северног краја: „вика од рибљих врата, и јаук с друге стране, и полом велик с хумова“, а затим позива становнике Мактеса, удубљења испод, да ридају, јер је сав народ трговачки изгинуо."
    - "Други део, Мишне, који Софонија именује уз капију, био је новији део града на западном брду, ограђен у осмом веку п. н. е. Широким зидом који је Нахман Авигад пронашао у Јеврејској четврти. Рибља капија пропуштала би пут са севера у ту четврт и доле до Храма. Данашња Дамаскова капија, главна северна капија Старог града, лежи даље на северу, на линији зида подигнутог први пут у римско доба."
  hu:
    - "A Halkapu Jeruzsálem északi falának egyik kapuja volt, nevét – általában úgy vélik – a mellette lévő halpiacról kapta: Nehémiás panaszolja, hogy a városban lakó tíruszi férfiak „hoznak vala halat és mindenféle árút, melyeket eladnak vala szombat napon Júda fiainak Jeruzsálemben”, a tengerparti és galileai hal pedig az északi úton érkezett volna be. Nehémiás menete keleti irányban az Efraim kapuja, az Ó-kapu, a Halkapu, a Hananél-torony és a Méa-torony mellett haladt el, majd elérte a Juhkaput, így a Halkapu az északi falban állt a Templomtól nyugatra, leggyakrabban a nyugati domb és a Templom között lefutó völgy közelében. Nem találták meg."
    - "Manassé, miután visszatért a babiloni fogságból, felépítette „a Dávid városának külső kőfalát… Gihontól napnyugat felé a völgyben, a halkapu bemeneteléig”, és körülvezette Ófelen. Nehémiás helyreállítási munkájában „a halaknak kapuját pedig építék a Hasszenáa fiai, ők gerendázák be azt és állíták fel annak ajtait, kapcsait és závárait”. Sofóniás Jósiás napjaiban az északi városrész zajaiban hallja meg az eljövendő ítéletet: „kiáltó szózat a hal-kaputól fogva, és jajgatás az alsó városból, és nagy recsegés a halmok felől”, majd a Maktes, az alatta lévő mélyedés lakóit szólítja jajgatásra, mert a kalmár népet kivágják."
    - "A Második városnegyed, a Misné, amelyet Sofóniás a kapuval együtt említ, a város újabb része volt a nyugati dombon, amelyet Kr. e. a 8. században a Széles fal vett körül, amelyet Nahman Avigad talált meg a Zsidó negyedben. A Halkapu az északról érkező utat engedte volna be ebbe a városnegyedbe és le a Templomhoz. A mai Damaszkuszi-kapu, az Óváros fő északi kapuja, északabbra fekszik, a római korban épített falvonalon."
  fi:
    - "Kalaportti oli portti Jerusalemin pohjoismuurissa, ja sen nimi tulee yleisen käsityksen mukaan sen vieressä olleesta kalatorista: Nehemia valittaa, että kaupunkiin asettuneet tyyrolaiset ”toivat kalaa ja kaikenlaista kauppatavaraa ja myivät Juudan kansalle sapattina ja Jerusalemissa”, ja rannikolta ja Galileasta tuleva kala olisi tullut sisään pohjoista tietä. Nehemian kulkue ohitti itään kuljettaessa Efraimin portin, Vanhan portin, Kalaportin, Hananelin tornin ja Meahin tornin ja saapui sitten Lammasportille, joten Kalaportti oli pohjoismuurissa temppelin länsipuolella, useimmiten sijoitettuna lähelle laaksoa, joka laskeutui länsimäen ja temppelin välistä. Sitä ei ole löydetty."
    - "Manasse rakensi paluunsa jälkeen Babylonin vankeudesta ”Daavidin kaupungin ulomman muurin, länteen päin Giihonista, laaksoon, aina Kalaporttiin saakka”, ja johti sen Ofelin ympäri. Nehemian korjaustyössä ”Kalaportin rakensivat senaalaiset; he kattoivat sen ja asettivat paikoilleen sen ovet, teljet ja salvat”. Sefanja kuulee Josian päivinä tulevan tuomion pohjoisen kaupunginosan äänistä: ”kuuluu huuto Kalaportilta ja valitus toisesta kaupunginosasta ja suuri hävitys kukkuloilta”, ja kehottaa sitten Huhmaren, alapuolisen onkalon, asukkaita valittamaan, sillä kauppaa käyvä kansa on tuhottu."
    - "Toinen kaupunginosa, Mishne, jonka Sefanja mainitsee portin yhteydessä, oli kaupungin uudempi osa länsimäellä, jonka 700-luvulla eaa. rakennettu Leveä muuri sulki sisäänsä; Nahman Avigad löysi muurin juutalaiskorttelista. Kalaportti olisi päästänyt pohjoisen tien tähän kaupunginosaan ja edelleen alas temppelille. Nykyinen Damaskoksen portti, vanhankaupungin pääasiallinen pohjoisportti, sijaitsee kauempana pohjoisessa, roomalaisella ajalla ensimmäisen kerran rakennetulla muurilinjalla."
  vi:
    - "Cửa Cá là một cửa trong tường phía bắc Giê-ru-sa-lem, thường được cho là được đặt tên theo chợ cá bên cạnh: Nê-hê-mi than phiền rằng người Ty-rơ ở trong thành “đem cá và các thứ hàng hóa đến bán cho người Giu-đa và tại thành Giê-ru-sa-lem trong ngày sa-bát”, và cá từ bờ biển cùng từ Ga-li-lê hẳn đã vào qua con đường phía bắc. Đoàn rước của Nê-hê-mi, đi về hướng đông, đã qua Cửa Ép-ra-im, Cửa Cũ, Cửa Cá, tháp Ha-na-nê-ên và tháp Mê-a, rồi đến Cửa Chiên; vì vậy Cửa Cá nằm trong tường bắc, phía tây Đền thờ, thường được đặt gần thung lũng chạy xuống giữa đồi phía tây và Đền thờ. Cửa này chưa được tìm thấy."
    - "Ma-na-se, sau khi được đưa về từ cảnh bị giam ở Ba-by-lôn, “xây vách ngoài thành Đa-vít, về phía tây Ghi-hôn trong trũng, đến lối vào cửa cá”, và kéo vách ấy vòng quanh Ô-phên. Trong lần tu sửa của Nê-hê-mi: “Con cháu của Sê-na xây cất cửa Cá. Chúng đặt khuôn và tra cánh, chốt với then nó”. Sô-phô-ni, vào đời Giô-si-a, nghe sự phán xét sắp đến qua những âm thanh của khu phía bắc: “sẽ có tiếng kêu lớn nơi cửa cá, tiếng la lối nơi phố thứ hai, tiếng vỡ lở lớn nơi các đồi”, rồi bảo dân cư Maktesh, chỗ trũng bên dưới, hãy than khóc, vì dân buôn bán đã bị diệt."
    - "Khu Thứ Hai, Mishneh, mà Sô-phô-ni nêu tên cùng với cửa, là phần mới hơn của thành trên đồi phía tây, được bao quanh vào thế kỷ 8 TCN bởi Vách Rộng mà Nahman Avigad đã tìm thấy trong Khu Do Thái. Cửa Cá hẳn đã cho con đường từ phía bắc đi vào khu ấy và xuống Đền thờ. Cửa Đa-mách ngày nay, cửa bắc chính của Thành Cổ, nằm xa hơn về phía bắc, trên một đoạn tường được xây lần đầu vào thời La Mã."
  ro:
    - "Poarta Peștilor era o poartă din zidul de nord al Ierusalimului, numită, după cum se crede de obicei, după piața de pește de lângă ea: Neemia se plânge că tirienii care locuiau în oraș „aduceau pește și alte lucruri de vânzare, vindeau sâmbăta fiilor Iudei și în Ierusalim”, iar peștele de pe coastă și din Galileea ar fi intrat pe drumul dinspre nord. Procesiunea lui Neemia a trecut, mergând spre est, pe lângă Poarta lui Efraim, Poarta Veche, Poarta Peștilor, turnul lui Hananel și turnul Meah, apoi a ajuns la Poarta Oilor; deci Poarta Peștilor se afla în zidul de nord, la vest de Templu, cel mai adesea plasată lângă valea care cobora între dealul de vest și Templu. Nu a fost găsită."
    - "Manase, după ce a fost adus înapoi din captivitatea Babilonului, „a zidit zid afară de cetatea lui David ... până în pârîu, și către intrarea cea prin poarta peștelui”, și l-a dus în jurul Ofelului. La reparațiile lui Neemia, „poarta peștilor o au zidit fiii lui Asanà, aceștia o au acoperit pre ea, și au așezat porțile ei și încuietorile ei și zăvoarele ei”. Țefania, în zilele lui Iosia, aude judecata care vine în sunetele cartierului de nord: se va auzi un strigăt dinspre Poarta Peștilor, un vaiet dinspre al doilea cartier și o mare prăbușire dinspre dealuri; apoi le cere locuitorilor din Maktesh, scobitura de dedesubt, să se tânguiască, fiindcă poporul negustorilor este nimicit."
    - "Cartierul al Doilea, Mishneh, pe care Țefania îl numește împreună cu poarta, era partea mai nouă a orașului de pe dealul de vest, închisă în secolul al VIII-lea î.Hr. de Zidul cel Lat pe care l-a găsit Nahman Avigad în Cartierul Evreiesc. Poarta Peștilor ar fi lăsat drumul dinspre nord să intre în acel cartier și să coboare spre Templu. Poarta Damascului de azi, poarta principală de nord a Orașului Vechi, se află mai la nord, pe un traseu de zid construit întâia oară în epoca romană."
  bg:
    - "Рибната порта беше порта в северната стена на Йерусалим, наречена, както обикновено се смята, на рибния пазар до нея: Неемия се оплаква, че тиряни, живеещи в града, „доносяха риба и всякакви неща за продаване та продаваха в събота на Юдините синове и в Ерусалим“, а рибата от крайбрежието и от Галилея би влизала по северния път. Шествието на Неемия, движейки се на изток, мина покрай Ефремовата порта, Старата порта, Рибната порта, кулата Хананеил и кулата Мея и после стигна Овчата порта; следователно Рибната порта е стояла в северната стена на запад от Храма и най-често се поставя близо до долината, която се спускаше между западния хълм и Храма. Тя не е открита."
    - "Манасия, след като беше върнат от плен във Вавилон, „съгради стена вън от Давидовия град, към запад на Гион, в дола, дори до рибната порта“ и я прокара около Офел. При поправката на Неемия „рибната порта съградиха Сенаевите синове, които я направиха, и поставиха дверите ѝ, ключалниците ѝ, и вереите ѝ“. Софония, в дните на Йосия, чува идващия съд в звуците на северния квартал: „Ще бъде метеж на вик от рибната порта И ридание от Масена, И голямо съкрушение от хълмите“, и после призовава жителите на Мактес, низината отдолу, да плачат, защото търговските люде са изтребени."
    - "Втората част, Мишне, която Софония назовава заедно с портата, беше по-новата част на града на западния хълм, обградена през VIII в. пр.н.е. от Широката стена, която Нахман Авигад откри в Еврейския квартал. Рибната порта би пропускала пътя от север в тази част и надолу към Храма. Днешната Дамаска порта, главната северна порта на Стария град, лежи по на север, на линия на стената, изградена за първи път през римския период."
