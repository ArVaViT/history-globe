# Overview article (ADR 0007). Hammon of Asher is tentatively placed at Umm al-Amad near Naqoura (the map's point; ISBE, after Renan's Baal Hammon inscription and the Wadi Hamul); not the Hammon of Naphtali (1 Chr 6, see hammath.yaml).
id: hammon-asher
