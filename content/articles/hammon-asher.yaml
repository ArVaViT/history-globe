body:
  en:
    - "Hammon was a town on the northern border of Asher, in the hills behind the coast south of Tyre: “And Hebron, and Rehob, and Hammon, and Kanah, even unto great Zidon”. It is named only here, and is distinct from the Hammon of Naphtali in Chronicles. Its site is uncertain. The International Standard Bible Encyclopedia thought it most probably Umm al-Amad, a ruined town at the mouth of the Wadi Hamul about 10 miles south of Tyre, near Naqoura in southern Lebanon, because an inscription found there by Ernest Renan links the place with the god Baal Hammon; the town's ancient name is not known."
    - "Umm al-Amad, “mother of columns”, was built in the Persian or Hellenistic period, though some scholars argue for earlier origins. It has two temples, the temple of Milkashtart and an eastern temple with a throne chapel, of the third and second centuries BC, and several stelae with Phoenician inscriptions have been found there. Renan dug there in 1861 and Maurice Dunand in 1943–1945. In 2024 UNESCO placed the site under enhanced protection."
  ru:
    - "Хаммон — город на северной границе Асира, в холмах за побережьем к югу от Тира: «Еврон, Рехов, Хаммон и Кана, до Сидона великого». Он назван только здесь и отличен от Хаммона Неффалимова в Паралипоменоне. Его место не установлено. Международная стандартная библейская энциклопедия считала наиболее вероятным Умм-эль-Амад — развалины города в устье вади Хамуль, примерно в 16 км к югу от Тира, близ Накуры на юге Ливана, — потому что найденная там Эрнестом Ренаном надпись связывает это место с богом Баал-Хаммоном; древнее имя города неизвестно."
    - "Умм-эль-Амад, «мать колонн», был построен в персидское или эллинистическое время, хотя некоторые учёные считают его более древним. В нём два храма — храм Милькаштарт и восточный храм с тронной капеллой, III–II вв. до н. э., — и там найдено несколько стел с финикийскими надписями. Ренан копал здесь в 1861 г., а Морис Дюнан — в 1943–1945 гг. В 2024 г. ЮНЕСКО взяло памятник под усиленную охрану."
  uk:
    - "Хаммон був містом на північній межі Асіра, в горах за узбережжям на південь від Тіра: «Геброн, Рехов, Хаммон та Кана, до великого Сидону». Він названий лише тут і відмінний від Хаммона Нефталима в Хроніках. Його місце непевне. International Standard Bible Encyclopedia вважала найімовірнішим Умм-ель-Амад, зруйноване місто в гирлі Вади-Хамуль приблизно за 10 миль на південь від Тіра, біля Накури на півдні Лівану, бо напис, знайдений там Ернестом Ренаном, пов'язує місце з богом Ваал-Хаммоном; давня назва міста невідома."
    - "Умм-ель-Амад, «мати колон», збудовано в перський чи елліністичний період, хоча деякі вчені обстоюють давніше походження. Там є два храми — храм Мілкаштарта та східний храм із каплицею-троном — III–II ст. до н. е., і знайдено кілька стел з фінікійськими написами. Ренан копав там 1861 р., а Моріс Дюнан — у 1943–1945 рр. 2024 р. ЮНЕСКО взяло місце під посилений захист."
  es:
    - "Hamón era una ciudad en la frontera septentrional de Aser, en las colinas tras la costa al sur de Tiro: «Hebrón, y Rehob, y Hammón, y Cana, hasta la gran Sidón». Solo se nombra aquí, y es distinta de la Hamón de Neftalí en Crónicas. Su emplazamiento es incierto. La International Standard Bible Encyclopedia la creyó muy probablemente Umm al-Amad, una ciudad en ruinas en la desembocadura del Wadi Hamul, a unas 10 millas al sur de Tiro, cerca de Nakura, en el sur del Líbano, porque una inscripción hallada allí por Ernest Renan vincula el lugar con el dios Baal Hamón; el nombre antiguo de la ciudad no se conoce."
    - "Umm al-Amad, «madre de columnas», se construyó en época persa o helenística, aunque algunos estudiosos defienden orígenes más antiguos. Tiene dos templos, el templo de Milkashtart y un templo oriental con una capilla del trono, de los siglos III y II a. C., y allí se han hallado varias estelas con inscripciones fenicias. Renan excavó allí en 1861 y Maurice Dunand en 1943–1945. En 2024 la UNESCO puso el sitio bajo protección reforzada."
  pt:
    - "Hamom era uma cidade na fronteira norte de Aser, nas colinas atrás da costa ao sul de Tiro: “e Ebrom, Reobe, Hamom e Caná, até a grande Sidom”. É nomeada somente aqui e é distinta da Hamom de Naftali em Crônicas. Seu sítio é incerto. A International Standard Bible Encyclopedia achava mais provável Umm al-Amad, uma cidade em ruínas na foz do uádi Hamul, cerca de 10 milhas ao sul de Tiro, perto de Naqoura, no sul do Líbano, porque uma inscrição ali encontrada por Ernest Renan liga o lugar ao deus Baal Hamon; o nome antigo da cidade não é conhecido."
    - "Umm al-Amad, “mãe das colunas”, foi construída no período persa ou helenístico, embora alguns estudiosos defendam origens mais antigas. Tem dois templos, o templo de Milkashtart e um templo oriental com uma capela do trono, dos séculos III e II a.C., e várias estelas com inscrições fenícias foram encontradas ali. Renan escavou ali em 1861 e Maurice Dunand em 1943–1945. Em 2024 a UNESCO colocou o sítio sob proteção reforçada."
  de:
    - "Hammon war eine Stadt an der Nordgrenze Assers, in den Hügeln hinter der Küste südlich von Tyrus: „Ebron, Rehob, Hammon, Kana bis an Groß-Sidon“. Es wird nur hier genannt und ist vom Hammon Naftalis in der Chronik zu unterscheiden. Seine Lage ist ungewiss. Die International Standard Bible Encyclopedia hielt am ehesten Umm al-Amad für wahrscheinlich, eine Ruinenstadt an der Mündung des Wadi Hamul etwa 10 Meilen südlich von Tyrus, nahe Nakura im Südlibanon, weil eine dort von Ernest Renan gefundene Inschrift den Ort mit dem Gott Baal Hammon verbindet; der antike Name der Stadt ist nicht bekannt."
    - "Umm al-Amad, „Mutter der Säulen“, wurde in persischer oder hellenistischer Zeit erbaut, obwohl manche Gelehrte für frühere Ursprünge eintreten. Es hat zwei Tempel, den Tempel des Milkaschtart und einen Osttempel mit einer Thronkapelle, aus dem dritten und zweiten Jahrhundert v. Chr., und dort wurden mehrere Stelen mit phönizischen Inschriften gefunden. Renan grub dort 1861 und Maurice Dunand 1943–1945. 2024 stellte die UNESCO die Stätte unter verstärkten Schutz."
  fr:
    - "Hammon était une ville de la frontière nord d’Aser, dans les collines derrière la côte au sud de Tyr : « et vers Ébron, Rehob, Hammon et Kana, jusqu’à Sidon la grande ». Elle n’est nommée qu’ici et se distingue du Hammon de Nephthali dans les Chroniques. Son site est incertain. L’International Standard Bible Encyclopedia la jugeait très probablement Umm al-Amad, ville ruinée à l’embouchure de l’ouadi Hamul, à environ 10 milles au sud de Tyr, près de Naqoura, dans le sud du Liban, parce qu’une inscription trouvée là par Ernest Renan relie le lieu au dieu Baal Hammon ; le nom antique de la ville n’est pas connu."
    - "Umm al-Amad, « mère des colonnes », fut bâtie à l’époque perse ou hellénistique, bien que certains savants plaident pour des origines plus anciennes. Elle a deux temples, le temple de Milkashtart et un temple oriental avec une chapelle du trône, des IIIe et IIe siècles av. J.-C., et plusieurs stèles à inscriptions phéniciennes y ont été trouvées. Renan y fouilla en 1861 et Maurice Dunand en 1943–1945. En 2024, l’UNESCO a placé le site sous protection renforcée."
  it:
    - "Cammon era una città sul confine settentrionale di Aser, sulle colline dietro la costa a sud di Tiro: «verso Ebron, Rehob, Hammon e Kana, fino a Sidon la grande». È nominata solo qui ed è distinta dal Cammon di Neftali nelle Cronache. Il suo sito è incerto. La International Standard Bible Encyclopedia la riteneva con maggiore probabilità Umm al-Amad, una città in rovina alla foce del Wadi Hamul, a circa 10 miglia a sud di Tiro, presso Naqoura, nel Libano meridionale, perché un’iscrizione trovata là da Ernest Renan collega il luogo al dio Baal Hammon; il nome antico della città non è noto."
    - "Umm al-Amad, «madre delle colonne», fu costruita in epoca persiana o ellenistica, benché alcuni studiosi sostengano origini più antiche. Ha due templi, il tempio di Milkashtart e un tempio orientale con una cappella del trono, del III e II secolo a.C., e vi sono state trovate diverse stele con iscrizioni fenicie. Renan vi scavò nel 1861 e Maurice Dunand nel 1943–1945. Nel 2024 l’UNESCO ha posto il sito sotto protezione rafforzata."
  nl:
    - "Chammon was een stad op de noordgrens van Aser, in de heuvels achter de kust ten zuiden van Tyrus: “En Ebron, en Rehob, en Hammon, en Kana, tot aan groot Sidon.” Het wordt alleen hier genoemd en is te onderscheiden van het Chammon van Naftali in Kronieken. De ligging is onzeker. De International Standard Bible Encyclopedia hield het voor hoogstwaarschijnlijk Umm al-Amad, een ruïnestad aan de monding van de Wadi Hamul ongeveer 10 mijl ten zuiden van Tyrus, bij Naqoura in Zuid-Libanon, omdat een daar door Ernest Renan gevonden inscriptie de plaats met de god Baäl Chammon verbindt; de antieke naam van de stad is niet bekend."
    - "Umm al-Amad, ‘moeder van zuilen’, werd in de Perzische of hellenistische tijd gebouwd, hoewel sommige geleerden voor een vroeger begin pleiten. Er zijn twee tempels, de tempel van Milkashtart en een oostelijke tempel met een troonkapel, uit de derde en tweede eeuw v.Chr., en er zijn verscheidene stèles met Fenicische inscripties gevonden. Renan groef er in 1861 en Maurice Dunand in 1943–1945. In 2024 plaatste UNESCO de plaats onder versterkte bescherming."
  pl:
    - "Chammon było miastem na północnej granicy Aszera, we wzgórzach za wybrzeżem na południe od Tyru: „I do Hebronu, i Rohob, i Hamon, i Kana, aż do Sydonu wielkiego”. Jest wymienione tylko tu i różni się od Chammon z Neftalego w Kronikach. Jego położenie jest niepewne. International Standard Bible Encyclopedia uważała za najbardziej prawdopodobne Umm al-Amad, zrujnowane miasto u ujścia Wadi Chamul około 10 mil na południe od Tyru, koło Nakury w południowym Libanie, ponieważ napis znaleziony tam przez Ernesta Renana łączy to miejsce z bogiem Baal Hammon; starożytna nazwa miasta nie jest znana."
    - "Umm al-Amad, „matka kolumn”, zbudowano w okresie perskim lub hellenistycznym, choć niektórzy uczeni bronią wcześniejszego pochodzenia. Są tam dwie świątynie, świątynia Milkasztarta i świątynia wschodnia z kaplicą tronową, z III i II w. p.n.e., oraz znaleziono kilka stel z napisami fenickimi. Renan prowadził tam wykopaliska w 1861 roku, a Maurice Dunand w latach 1943-1945. W 2024 roku UNESCO objęło stanowisko wzmocnioną ochroną."
  cs:
    - "Chammon bylo město na severní hranici Ašeru, v kopcích za pobřežím jižně od Týru: „A do Ebron a Rohob, a Hamon a Kána až do Sidonu velikého“. Je jmenováno jen zde a je odlišné od Chammonu Neftalího v Paralipomenu. Jeho poloha je nejistá. International Standard Bible Encyclopedia je pokládala nejpravděpodobněji za Umm al-Amad, zříceninu města u ústí Wádí Chamúl asi 10 mil jižně od Týru, poblíž Nákúry v jižním Libanonu, protože nápis, který tam nalezl Ernest Renan, spojuje místo s bohem Baal Chammonem; starověké jméno města není známo."
    - "Umm al-Amad, „matka sloupů“, bylo vystavěno v perském nebo helénistickém období, ačkoli někteří badatelé hájí starší počátky. Má dva chrámy, chrám Milkaštartův a východní chrám s trůnní kaplí, z třetího a druhého století př. n. l., a bylo tam nalezeno několik stél s fénickými nápisy. Renan tam kopal roku 1861 a Maurice Dunand v letech 1943–1945. V roce 2024 postavila UNESCO místo pod zvýšenou ochranu."
