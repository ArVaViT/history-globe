body:
  en:
    - "Ptolemais, the Acco of the Old Testament, lies at the northern end of the bay that Mount Carmel closes on the south, on the coast road between Tyre and Caesarea. The Bronze and Iron Age town stood on the mound of Tel Akko, a little inland; in the Hellenistic age the city spread onto the small peninsula where the old city of Acre stands today. In the Amarna letters of the fourteenth century BC its ruler Satatna writes to the pharaoh, and a king of Babylon complains that men sent by Satatna and another ruler had killed Babylonian merchants in Canaan."
    - "Judges counts Accho among the towns whose inhabitants the tribe of Asher did not drive out. In 701 BC Sennacherib of Assyria lists Acco among the fortified cities of Luli, king of Sidon, that bowed at his feet. Under the Persians it was a base against Egypt: in the 370s BC, Diodorus says, the army sent to reconquer Egypt gathered at Ace. In the third century BC, under Ptolemy II, the city was renamed Ptolemais. In 219 BC its Ptolemaic commander handed it to Antiochus III, and from about 200 BC it stayed with the Seleucids. According to 1 Maccabees, about 150 BC Alexander Balas married Cleopatra, daughter of Ptolemy, at Ptolemais, and later, when Jonathan Maccabeus came into Ptolemais, its people shut the gates, seized him and put his men to the sword."
    - 'At the end of Paul''s third journey he and his companions sailed from Tyre to Ptolemais, "and saluted the brethren, and abode with them one day", then went on to Caesarea. Under Claudius the city became a Roman colony; Pliny calls it a colony of Claudius Caesar, once called Acce, and, like Josephus, tells of the river Belus nearby, whose sand was used for glass. In AD 67 Vespasian came to Ptolemais at the start of the war in Galilee, and the people of Sepphoris, who sided with Rome, met him there.'
    - "A church at Ptolemais is attested again about AD 190: Eusebius names Clarus of Ptolemais, with Narcissus of Jerusalem, Theophilus of Caesarea and Cassius of Tyre, among the bishops who wrote on the keeping of Easter. The city remained an important port under Roman and Byzantine rule until the Arab conquest in the seventh century, when its old name, as Akka, came back into use."
  ru:
    - "Птолемаида, ветхозаветный Акко, лежит у северного края залива, который с юга замыкает гора Кармил, на прибрежной дороге между Тиром и Кесарией. Город бронзового и железного веков стоял на холме Тель-Акко, немного в глубине суши; в эллинистическую эпоху город распространился на небольшой полуостров, где сегодня стоит старый город Акко. В амарнских письмах XIV века до н. э. его правитель Сататна пишет фараону, а царь Вавилона жалуется, что люди, посланные Сататной и ещё одним правителем, убили вавилонских купцов в Ханаане."
    - "Книга Судей называет Акко среди городов, жителей которых колено Асирово не изгнало. В 701 г. до н. э. ассирийский царь Сеннахирим перечисляет Акко среди укреплённых городов Лули, царя Сидона, которые склонились к его ногам. При персах город служил опорой против Египта: в 370-х гг. до н. э., по словам Диодора, войско, посланное отвоевать Египет, собралось у города Аке. В III веке до н. э., при Птолемее II, город переименовали в Птолемаиду. В 219 г. до н. э. птолемеевский военачальник сдал его Антиоху III, а примерно с 200 г. до н. э. он остался за Селевкидами. По Первой книге Маккавейской, около 150 г. до н. э. Александр Балас женился в Птолемаиде на Клеопатре, дочери Птолемея, а позже, когда в Птолемаиду вошёл Ионафан Маккавей, её жители заперли ворота, схватили его и перебили бывших с ним."
    - "В конце третьего путешествия Павел и его спутники приплыли из Тира в Птолемаиду и, «приветствовав братьев, пробыли у них один день», а затем отправились в Кесарию. При Клавдии город стал римской колонией; Плиний называет его колонией Клавдия Цезаря, прежде называвшейся Акке, и, как и Иосиф Флавий, рассказывает о соседней речке Бел, песок которой шёл на стекло. В 67 г. н. э. Веспасиан пришёл в Птолемаиду в начале войны в Галилее, и жители Сепфориса, державшие сторону Рима, встретили его там."
    - "Церковь в Птолемаиде вновь засвидетельствована около 190 г. н. э.: Евсевий называет Клара Птолемаидского вместе с Наркиссом Иерусалимским, Феофилом Кесарийским и Кассием Тирским среди епископов, писавших о праздновании Пасхи. Город оставался важным портом при римлянах и византийцах вплоть до арабского завоевания в VII веке, когда в обиход вернулось его старое имя — Акка."
  uk:
    - "Птолемаїда, Акко Старого Завіту, лежить на північному краї затоки, яку з півдня замикає гора Кармель, на узбережній дорозі між Тіром і Кесарією. Місто доби бронзи й заліза стояло на пагорбі Тель-Акко, трохи вглиб суходолу; в елліністичну добу воно розрослося на невеликий півострів, де сьогодні стоїть старе місто Акра. В амарнських листах XIV ст. до н. е. його правитель Сататна пише фараонові, а вавилонський цар скаржиться, що люди, надіслані Сататною та іншим правителем, убили вавилонських купців у Ханаані."
    - "Книга Суддів зараховує Акко до міст, мешканців яких плем’я Асира не вигнало. У 701 р. до н. е. Сінаххеріб Ассирійський зараховує Акко до укріплених міст Лулі, царя Сідона, що впали до його ніг. За персів воно було базою проти Єгипту: у 370-х рр. до н. е., за словами Діодора, військо, послане знову підкорити Єгипет, зібралося в Аке. У III ст. до н. е., за Птолемея II, місто перейменували на Птолемаїду. У 219 р. до н. е. його птолемеївський начальник віддав його Антіохові III, а від близько 200 р. до н. е. воно лишалося за Селевкідами. Згідно з 1 Книгою Макавеїв, близько 150 р. до н. е. Александр Бала одружився в Птолемаїді з Клеопатрою, дочкою Птолемея, а пізніше, коли Йонатан Макавей увійшов до Птолемаїди, її мешканці замкнули ворота, схопили його й перебили мечем його людей."
    - "Наприкінці третьої подорожі Павла він і його супутники попливли з Тіру до Птолемаїди, «привитавши братів, пробули в них один день», а потім вирушили до Кесарії. За Клавдія місто стало римською колонією; Пліній називає його колонією Клавдія Цезаря, колись званою Аке, і, як і Йосиф Флавій, розповідає про недалеку річку Бел, пісок якої йшов на скло. У 67 р. н. е. Веспасіан прибув до Птолемаїди на початку війни в Галілеї, і жителі Сефоріса, що трималися Риму, зустріли його там."
    - "Церква в Птолемаїді знову засвідчена близько 190 р. н. е.: Євсевій називає Клара з Птолемаїди разом із Наркісом Єрусалимським, Феофілом Кесарійським і Кассієм Тірським серед єпископів, що писали про дотримання Пасхи. Місто залишалося важливим портом за римського та візантійського панування аж до арабського завоювання в VII ст., коли стара назва в формі Акка знову ввійшла у вжиток."
  es:
    - "Tolemaida, el Aco del Antiguo Testamento, se encuentra en el extremo norte de la bahía que el monte Carmelo cierra por el sur, en el camino de la costa entre Tiro y Cesarea. La ciudad de las Edades del Bronce y del Hierro se alzaba en el montículo de Tel Akko, algo tierra adentro; en la época helenística la ciudad se extendió a la pequeña península donde se halla hoy la ciudad vieja de Acre. En las cartas de Amarna del siglo XIV a. C. su gobernante Satatna escribe al faraón, y un rey de Babilonia se queja de que hombres enviados por Satatna y otro gobernante habían matado a mercaderes babilonios en Canaán."
    - "Jueces cuenta Aco entre las ciudades cuyos habitantes la tribu de Aser no expulsó. En 701 a. C. Senaquerib de Asiria enumera Aco entre las ciudades fortificadas de Luli, rey de Sidón, que se postraron a sus pies. Bajo los persas fue una base contra Egipto: en la década de 370 a. C., dice Diodoro, el ejército enviado a reconquistar Egipto se reunió en Ace. En el siglo III a. C., bajo Tolomeo II, la ciudad fue rebautizada Tolemaida. En 219 a. C. su comandante ptolemaico la entregó a Antíoco III, y desde aproximadamente 200 a. C. quedó con los seléucidas. Según 1 Macabeos, hacia 150 a. C. Alejandro Balas se casó en Tolemaida con Cleopatra, hija de Tolomeo, y más tarde, cuando Jonatán Macabeo entró en Tolemaida, su gente cerró las puertas, lo apresó y pasó a espada a sus hombres."
    - "Al final del tercer viaje de Pablo, él y sus compañeros navegaron de Tiro a Tolemaida, «y habiendo saludado á los hermanos, nos quedamos con ellos un día», y siguieron a Cesarea. Bajo Claudio la ciudad se convirtió en colonia romana; Plinio la llama colonia de Claudio César, antes llamada Ace, y, como Josefo, habla del cercano río Belo, cuya arena se usaba para el vidrio. En 67 d. C. Vespasiano llegó a Tolemaida al comienzo de la guerra en Galilea, y la gente de Séforis, que se puso del lado de Roma, lo recibió allí."
    - "Una iglesia en Tolemaida está atestiguada de nuevo hacia el 190 d. C.: Eusebio nombra a Claro de Tolemaida, con Narciso de Jerusalén, Teófilo de Cesarea y Casio de Tiro, entre los obispos que escribieron sobre la celebración de la Pascua. La ciudad siguió siendo un puerto importante bajo el dominio romano y bizantino hasta la conquista árabe en el siglo VII, cuando su antiguo nombre, como Akka, volvió a usarse."
  pt:
    - "Ptolemaida, a Aco do Antigo Testamento, fica na ponta norte da baía que o Monte Carmelo fecha ao sul, na estrada da costa entre Tiro e Cesareia. A cidade da Idade do Bronze e do Ferro ficava no monte de Tel Akko, um pouco para o interior; na era helenística a cidade se espalhou pela pequena península onde hoje está a cidade velha de Acre. Nas cartas de Amarna do século XIV a.C., seu governante Satatna escreve ao faraó, e um rei da Babilônia se queixa de que homens enviados por Satatna e outro governante mataram mercadores babilônios em Canaã."
    - "Juízes conta Aco entre as cidades cujos habitantes a tribo de Aser não expulsou. Em 701 a.C., Senaqueribe da Assíria lista Aco entre as cidades fortificadas de Luli, rei de Sidom, que se curvaram a seus pés. Sob os persas foi base contra o Egito: na década de 370 a.C., diz Diodoro, o exército enviado para reconquistar o Egito reuniu-se em Ace. No século III a.C., sob Ptolomeu II, a cidade foi rebatizada Ptolemaida. Em 219 a.C. seu comandante ptolemaico a entregou a Antíoco III, e desde cerca de 200 a.C. ficou com os selêucidas. Segundo 1 Macabeus, por volta de 150 a.C. Alexandre Balas casou-se com Cleópatra, filha de Ptolomeu, em Ptolemaida, e mais tarde, quando Jônatas Macabeu entrou em Ptolemaida, seu povo fechou as portas, prendeu-o e passou seus homens a fio de espada."
    - "No fim da terceira viagem de Paulo, ele e seus companheiros navegaram de Tiro a Ptolemaida: “saudamos os irmãos e ficamos com eles um dia”, e depois seguiram para Cesareia. Sob Cláudio a cidade tornou-se colônia romana; Plínio a chama de colônia de Cláudio César, antes chamada Ace e, como Josefo, fala do rio Belo, ali perto, cuja areia era usada para fazer vidro. Em 67 d.C., Vespasiano veio a Ptolemaida no início da guerra na Galileia, e o povo de Séforis, que ficou do lado de Roma, o encontrou ali."
    - "Uma igreja em Ptolemaida é atestada de novo por volta de 190 d.C.: Eusébio nomeia Claro de Ptolemaida, com Narciso de Jerusalém, Teófilo de Cesareia e Cássio de Tiro, entre os bispos que escreveram sobre a data da Páscoa. A cidade continuou um porto importante sob o domínio romano e bizantino até a conquista árabe no século VII, quando o seu nome antigo, como Akka, voltou ao uso."
  de:
    - "Ptolemais, das Akko des Alten Testaments, liegt am Nordende der Bucht, die der Karmel im Süden abschließt, an der Küstenstraße zwischen Tyrus und Caesarea. Die bronze- und eisenzeitliche Stadt stand auf dem Hügel Tel Akko, etwas landeinwärts; in hellenistischer Zeit breitete sich die Stadt auf die kleine Halbinsel aus, auf der heute die Altstadt von Akko steht. In den Amarna-Briefen des 14. Jahrhunderts v. Chr. schreibt ihr Herrscher Schatatna an den Pharao, und ein König von Babylon klagt, von Schatatna und einem anderen Herrscher gesandte Männer hätten babylonische Kaufleute in Kanaan getötet."
    - "Die Richter nennen Akko unter den Städten, deren Einwohner Asser nicht vertrieb: „Asser vertrieb die Einwohner zu Akko nicht“. 701 v. Chr. führt Sanherib von Assyrien Akko unter den befestigten Städten des Luli, Königs von Sidon, auf, die sich ihm beugten. Unter den Persern war es Stützpunkt gegen Ägypten: Nach Diodor sammelte sich in den 370er Jahren v. Chr. das Heer zur Rückeroberung Ägyptens bei Ake. Im 3. Jahrhundert v. Chr. wurde sie unter Ptolemaios II. in Ptolemais umbenannt. Im Jahr 219 v. Chr. übergab ihr ptolemäischer Kommandant sie an Antiochos III., und seit etwa 200 v. Chr. blieb sie bei den Seleukiden. Nach dem 1. Makkabäerbuch heiratete Alexander Balas um 150 v. Chr. in Ptolemais Kleopatra, die Tochter des Ptolemaios, und als später Jonatan Makkabäus nach Ptolemais kam, schlossen die Einwohner die Tore, nahmen ihn gefangen und töteten seine Männer."
    - "Am Ende von Paulus' dritter Reise fuhren er und seine Gefährten von Tyrus nach Ptolemais, „und grüßten die Brüder und blieben einen Tag bei ihnen“, dann ging es weiter nach Caesarea. Unter Klaudius wurde die Stadt römische Kolonie; Plinius nennt sie eine Kolonie des Claudius Caesar, einst Acce genannt, und erzählt, wie Josephus, vom nahen Fluss Belos, dessen Sand zur Glasherstellung diente. Im Jahr 67 n. Chr. kam Vespasian zu Beginn des Krieges in Galiläa nach Ptolemais, und die Leute von Sepphoris, die zu Rom hielten, trafen ihn dort."
    - "Eine Kirche in Ptolemais ist um 190 n. Chr. wieder bezeugt: Eusebius nennt Clarus von Ptolemais mit Narzissus von Jerusalem, Theophilus von Caesarea und Cassius von Tyrus unter den Bischöfen, die über die Feier des Osterfestes schrieben. Die Stadt blieb unter römischer und byzantinischer Herrschaft ein wichtiger Hafen bis zur arabischen Eroberung im 7. Jahrhundert, als ihr alter Name als Akka wieder in Gebrauch kam."
  fr:
    - "Ptolémaïs, l’Acco de l’Ancien Testament, se trouve à l’extrémité nord de la baie que ferme au sud le mont Carmel, sur la route côtière entre Tyr et Césarée. La ville des âges du Bronze et du Fer s’élevait sur le tertre de Tel Akko, un peu à l’intérieur ; à l’époque hellénistique, elle s’étendit sur la petite péninsule où se trouve aujourd’hui la vieille ville d’Acre. Dans les lettres d’Amarna du XIVe siècle av. J.-C., son souverain Satatna écrit au pharaon, et un roi de Babylone se plaint que des hommes envoyés par Satatna et un autre souverain ont tué des marchands babyloniens en Canaan."
    - "Les Juges comptent Acco parmi les villes dont la tribu d’Aser ne chassa pas les habitants. En 701 av. J.-C., Sanchérib d’Assyrie cite Acco parmi les villes fortifiées de Louli, roi de Sidon, qui se prosternèrent à ses pieds. Sous les Perses, elle servit de base contre l’Égypte : dans les années 370 av. J.-C., dit Diodore, l’armée envoyée pour reconquérir l’Égypte se rassembla à Acé. Au IIIe siècle av. J.-C., sous Ptolémée II, la ville fut rebaptisée Ptolémaïs. En 219 av. J.-C., son commandant lagide la livra à Antiochos III, et dès environ 200 av. J.-C. elle resta aux Séleucides. Selon 1 Maccabées, vers 150 av. J.-C., Alexandre Balas épousa à Ptolémaïs Cléopâtre, fille de Ptolémée, et plus tard, quand Jonathan Maccabée entra dans Ptolémaïs, ses habitants fermèrent les portes, s’emparèrent de lui et passèrent ses hommes au fil de l’épée."
    - "À la fin du troisième voyage de Paul, lui et ses compagnons firent voile de Tyr à Ptolémaïs, « où nous saluâmes les frères, et passâmes un jour avec eux », puis allèrent à Césarée. Sous Claude, la ville devint colonie romaine ; Pline l’appelle colonie de Claude César, jadis nommée Acé, et, comme Flavius Josèphe, parle du fleuve Bélus voisin, dont le sable servait au verre. En 67 apr. J.-C., Vespasien vint à Ptolémaïs au début de la guerre en Galilée, et les gens de Sepphoris, qui s’étaient rangés du côté de Rome, l’y rencontrèrent."
    - "Une Église à Ptolémaïs est attestée de nouveau vers 190 apr. J.-C. : Eusèbe nomme Clarus de Ptolémaïs, avec Narcisse de Jérusalem, Théophile de Césarée et Cassius de Tyr, parmi les évêques qui écrivirent sur la date de Pâques. La ville resta un port important sous la domination romaine et byzantine jusqu’à la conquête arabe du VIIe siècle, où son ancien nom, Akka, revint en usage."
  it:
    - "Tolemaide, l’Acco dell’Antico Testamento, si trova all’estremità settentrionale della baia che il Monte Carmelo chiude a sud, sulla strada costiera tra Tiro e Cesarea. La città dell’età del Bronzo e del Ferro sorgeva sul tell di Tel Akko, un po’ nell’entroterra; in epoca ellenistica la città si estese sulla piccola penisola dove sorge oggi la città vecchia di Acri. Nelle lettere di Amarna del XIV secolo a.C. il suo governante Satatna scrive al faraone, e un re di Babilonia si lamenta che uomini inviati da Satatna e da un altro governante avevano ucciso mercanti babilonesi in Canaan."
    - "I Giudici contano Acco tra le città i cui abitanti la tribù di Aser non cacciò. Nel 701 a.C. Sennacherib d’Assiria elenca Acco tra le città fortificate di Luli, re di Sidone, che si prostrarono ai suoi piedi. Sotto i Persiani fu una base contro l’Egitto: negli anni 370 a.C., dice Diodoro, l’esercito inviato a riconquistare l’Egitto si radunò ad Ace. Nel III secolo a.C., sotto Tolomeo II, la città fu ribattezzata Tolemaide. Nel 219 a.C. il suo comandante tolemaico la consegnò ad Antioco III, e dal 200 a.C. circa rimase ai Seleucidi. Secondo 1 Maccabei, verso il 150 a.C. Alessandro Bala sposò a Tolemaide Cleopatra, figlia di Tolomeo, e più tardi, quando Gionata Maccabeo entrò a Tolemaide, i suoi abitanti chiusero le porte, lo catturarono e passarono a fil di spada i suoi uomini."
    - "Alla fine del terzo viaggio di Paolo, egli e i suoi compagni salparono da Tiro per Tolemaide, «e salutati i fratelli, dimorammo un giorno con loro», poi proseguirono per Cesarea. Sotto Claudio la città divenne colonia romana; Plinio la chiama colonia di Claudio Cesare, un tempo chiamata Acce, e, come Giuseppe Flavio, parla del vicino fiume Belo, la cui sabbia serviva per il vetro. Nel 67 d.C. Vespasiano giunse a Tolemaide all’inizio della guerra in Galilea, e gli abitanti di Sefforis, che si schierarono con Roma, lo incontrarono lì."
    - "Una chiesa a Tolemaide è attestata di nuovo verso il 190 d.C.: Eusebio nomina Claro di Tolemaide, con Narciso di Gerusalemme, Teofilo di Cesarea e Cassio di Tiro, tra i vescovi che scrissero sulla celebrazione della Pasqua. La città rimase un porto importante sotto il dominio romano e bizantino fino alla conquista araba nel VII secolo, quando il suo antico nome, come Akka, tornò in uso."
  pl:
    - "Ptolemaida, Akko ze Starego Testamentu, leży na północnym krańcu zatoki zamkniętej od południa przez Karmel, przy drodze nadmorskiej między Tyrem a Cezareą. Miasto z epoki brązu i żelaza stało na kopcu Tel Akko, nieco w głębi lądu; w epoce hellenistycznej rozlało się na niewielki półwysep, gdzie stoi dziś Stare Miasto Akki. W listach z Amarny z XIV wieku p.n.e. jej władca Satatna pisze do faraona, a król Babilonu skarży się, że ludzie wysłani przez Satatnę i innego władcę zabili babilońskich kupców w Kanaanie."
    - "Księga Sędziów wymienia Akko wśród miast, których mieszkańców pokolenie Aszera nie wypędziło. W 701 roku p.n.e. Sennacheryb asyryjski wymienia Akko wśród warownych miast Luliego, króla Sydonu, które padły mu do stóp. Za Persów było bazą przeciw Egiptowi: w latach 370. p.n.e., jak mówi Diodor, armia wysłana, by odzyskać Egipt, zebrała się w Ake. W III wieku p.n.e., za Ptolemeusza II, miasto przemianowano na Ptolemaidę. W 219 roku p.n.e. jego ptolemejski dowódca oddał je Antiochowi III, a od około 200 roku p.n.e. pozostawało przy Seleucydach. Według 1 Księgi Machabejskiej około 150 roku p.n.e. Aleksander Balas poślubił w Ptolemaidzie Kleopatrę, córkę Ptolemeusza, a później, gdy Jonatan Machabeusz wszedł do Ptolemaidy, jej mieszkańcy zamknęli bramy, pojmali go i wycięli jego ludzi."
    - "Pod koniec trzeciej podróży Pawła on i jego towarzysze odpłynęli z Tyru do Ptolemaidy: „przypłynęliśmy do Ptolemaidy, a pozdrowiwszy braci, zamieszkaliśmy u nich przez jeden dzień”, po czym udali się do Cezarei. Za Klaudiusza miasto stało się rzymską kolonią; Pliniusz nazywa je kolonią Klaudiusza Cezara, dawniej zwaną Ake, i podobnie jak Józef Flawiusz opowiada o pobliskiej rzece Belos, której piasek służył do wyrobu szkła. W 67 roku n.e. Wespazjan przybył do Ptolemaidy na początku wojny w Galilei, a mieszkańcy Sefforis, którzy stanęli po stronie Rzymu, spotkali go tam."
    - "Kościół w Ptolemaidzie poświadczony jest ponownie około 190 roku n.e.: Euzebiusz wymienia Klarusa z Ptolemaidy, razem z Narcyzem z Jerozolimy, Teofilem z Cezarei i Kasjuszem z Tyru, wśród biskupów, którzy pisali o święcie Wielkanocy. Miasto pozostawało ważnym portem pod władzą rzymską i bizantyńską aż do podboju arabskiego w VII wieku, gdy powróciła dawna nazwa, jako Akka."
  cs:
    - "Ptolemais, Akko Starého zákona, leží na severním konci zálivu, který na jihu uzavírá Karmel, na pobřežní cestě mezi Týrem a Cesareou. Město doby bronzové a železné stálo na pahorku Tel Akko, kousek ve vnitrozemí; v helénistické době se město rozšířilo na malý poloostrov, kde dnes stojí staré město Akko. V amarnských dopisech ze 14. století př. n. l. píše jeho vládce Šatatna faraonovi a babylónský král si stěžuje, že muži vyslaní Šatatnou a jiným vládcem zabili babylónské obchodníky v Kanaánu."
    - "Kniha Soudců počítá Akko mezi města, jejichž obyvatele pokolení Ašer nevyhnalo. Roku 701 př. n. l. uvádí asyrský Senacherib Akko mezi opevněnými městy Luliho, krále Sidónu, která se mu poklonila. Za Peršanů to byla základna proti Egyptu: v 70. letech 4. století př. n. l. se podle Diodóra vojsko vyslané k dobytí Egypta shromáždilo v Ace. Ve 3. století př. n. l. bylo město za Ptolemaia II. přejmenováno na Ptolemais. Roku 219 př. n. l. je jeho ptolemaiovský velitel předal Antiochovi III. a od asi roku 200 př. n. l. zůstalo u Seleukovců. Podle 1. Makabejské se kolem roku 150 př. n. l. oženil Alexandr Balas v Ptolemaidě s Kleopatrou, dcerou Ptolemaiovou, a později, když do Ptolemaidy vstoupil Jonatan Makabejský, obyvatelé zavřeli brány, zajali ho a jeho muže pobili mečem."
    - "Na konci Pavlovy třetí cesty on a jeho společníci odplouli z Týru do Ptolemaidy, „pozdravivše tu bratří, pobyli jsme u nich jeden den“, a pak pokračovali do Cesareje. Za Klaudia se město stalo římskou kolonií; Plinius je nazývá kolonií Claudia Caesara, kdysi zvanou Acce, a stejně jako Josephus vypráví o nedaleké řece Belos, jejíž písek se používal na sklo. Roku 67 n. l. přišel Vespasianus do Ptolemaidy na začátku války v Galileji a lid Sefóris, který stál na straně Říma, se tam s ním setkal."
    - "Církev v Ptolemaidě je doložena znovu kolem roku 190 n. l.: Eusebius jmenuje Klara z Ptolemaidy spolu s Narcisem Jeruzalémským, Theofilem z Cesareje a Cassiem z Týru mezi biskupy, kteří psali o slavení Velikonoc. Město zůstalo důležitým přístavem pod římskou i byzantskou vládou až do arabského dobytí v 7. století, kdy se jeho staré jméno vrátilo do užívání jako Akká."
  nl:
    - "Ptolemaïs, het Akko van het Oude Testament, ligt aan het noordeinde van de baai die de Karmel in het zuiden afsluit, aan de kustweg tussen Tyrus en Caesarea. De stad uit de brons- en ijzertijd lag op de heuvel Tel Akko, iets landinwaarts; in de hellenistische tijd breidde de stad zich uit over het schiereilandje waar nu de oude stad Akko ligt. In de Amarnabrieven uit de 14e eeuw v.Chr. schrijft haar heerser Satatna aan de farao, en een koning van Babylon klaagt dat door Satatna en een andere heerser gezonden mannen Babylonische kooplieden in Kanaän hadden gedood."
    - "Richteren telt Akko onder de steden waarvan de inwoners door de stam Aser niet werden verdreven. In 701 v.Chr. noemt Sanherib van Assyrië Akko onder de versterkte steden van Luli, koning van Sidon, die voor zijn voeten bogen. Onder de Perzen was het een uitvalsbasis tegen Egypte: in de jaren 370 v.Chr. verzamelde zich volgens Diodorus het leger dat Egypte moest heroveren bij Ace. In de 3e eeuw v.Chr. werd de stad onder Ptolemaeus II herdoopt tot Ptolemaïs. In 219 v.Chr. droeg haar Ptolemeïsche bevelhebber haar over aan Antiochus III, en vanaf omstreeks 200 v.Chr. bleef ze bij de Seleuciden. Volgens 1 Makkabeeën trouwde Alexander Balas omstreeks 150 v.Chr. te Ptolemaïs met Cleopatra, dochter van Ptolemaeus, en toen Jonatan Makkabeüs later Ptolemaïs binnenkwam, sloten de inwoners de poorten, grepen hem en joegen zijn mannen over de kling."
    - "Aan het eind van Paulus’ derde reis voeren hij en zijn metgezellen van Tyrus naar Ptolemaïs, “en de broeders gegroet hebbende, bleven een dag bij hen”, en trokken toen verder naar Caesarea. Onder Claudius werd de stad een Romeinse kolonie; Plinius noemt haar een kolonie van Claudius Caesar, vroeger Acce genoemd, en vertelt, net als Josephus, van de nabije rivier de Belus, wier zand voor glas werd gebruikt. In 67 n.Chr. kwam Vespasianus bij het begin van de oorlog in Galilea naar Ptolemaïs, en de bewoners van Sepphoris, die de zijde van Rome kozen, ontmoetten hem daar."
    - "Een kerk te Ptolemaïs is opnieuw bevestigd omstreeks 190 n.Chr.: Eusebius noemt Clarus van Ptolemaïs, met Narcissus van Jeruzalem, Theofilus van Caesarea en Cassius van Tyrus, onder de bisschoppen die schreven over het houden van Pasen. De stad bleef een belangrijke haven onder Romeins en Byzantijns bestuur tot de Arabische verovering in de 7e eeuw, toen haar oude naam, als Akka, weer in gebruik kwam."
  sv:
    - "Ptolemais, Gamla testamentets Acko, ligger i norra änden av viken som berget Karmel stänger i söder, vid kustvägen mellan Tyros och Caesarea. Bronsålderns och järnålderns stad låg på kullen Tel Akko, en bit inåt land; under hellenistisk tid bredde staden ut sig på den lilla halvön där Gamla stan i Akko ligger i dag. I Amarnabreven från 1300-talet f.Kr. skriver dess härskare Satatna till farao, och en kung av Babylon klagar över att män som sänts av Satatna och en annan härskare hade dödat babyloniska köpmän i Kanaan."
    - "Domarboken räknar Acko bland de städer vars invånare Asher inte fördrev. År 701 f.Kr. förtecknar Sanherib av Assyrien Acko bland Lulis, kungen av Sidons, befästa städer som böjde sig för hans fötter. Under perserna var det en bas mot Egypten: på 370-talet f.Kr., säger Diodoros, samlades armén som sänts för att återerövra Egypten vid Ake. På 200-talet f.Kr., under Ptolemaios II, döptes staden om till Ptolemais. År 219 f.Kr. överlämnade dess ptolemaiske befälhavare den till Antiochos III, och från omkring 200 f.Kr. förblev den hos seleukiderna. Enligt Första Mackabeerboken gifte sig Alexander Balas omkring 150 f.Kr. med Kleopatra, Ptolemaios dotter, i Ptolemais, och senare, när Jonatan Mackabeus kom in i Ptolemais, stängde dess folk portarna, grep honom och lät hans män falla för svärd."
    - "I slutet av Paulus tredje resa seglade han och hans följeslagare från Tyros till Ptolemais, där det heter: ”vi hälsade på hos bröderna där och stannade hos dem en dag”, och fortsatte sedan till Caesarea. Under Claudius blev staden en romersk koloni; Plinius kallar den en koloni av Claudius Caesar, tidigare kallad Acce, och berättar, liksom Josefus, om floden Belus i närheten, vars sand användes till glas. År 67 e.Kr. kom Vespasianus till Ptolemais vid krigets början i Galileen, och invånarna i Sepforis, som stod på Roms sida, mötte honom där."
    - "En kyrka i Ptolemais är åter belagd omkring år 190: Eusebios nämner Clarus av Ptolemais, tillsammans med Narkissos av Jerusalem, Teofilos av Caesarea och Cassius av Tyros, bland biskoparna som skrev om påskens firande. Staden förblev en viktig hamn under romerskt och bysantinskt styre fram till den arabiska erövringen på 600-talet, då dess gamla namn, som Akka, kom åter i bruk."
  nb:
    - "Ptolemais, Akko i Det gamle testamente, ligger i den nordlige enden av bukten som Karmel lukker i sør, ved kystveien mellom Tyros og Cæsarea. Bronse- og jernalderbyen lå på haugen Tel Akko, litt inne i landet; i hellenistisk tid bredte byen seg ut på den lille halvøya der gamlebyen i Akko ligger i dag. I Amarna-brevene fra 1300-tallet f.Kr. skriver herskeren Satatna til faraoen, og en konge av Babylon klager over at menn sendt av Satatna og en annen hersker hadde drept babylonske kjøpmenn i Kanaan."
    - "Dommernes bok regner Akko blant byene hvis innbyggere Asjer ikke drev bort. I 701 f.Kr. oppfører Sankerib av Assyria Akko blant de befestede byene til Luli, kongen av Sidon, som bøyde seg for føttene hans. Under perserne var det en base mot Egypt: på 370-tallet f.Kr., sier Diodoros, samlet hæren som ble sendt for å gjenerobre Egypt seg ved Ake. På 200-tallet f.Kr., under Ptolemaios II, ble byen omdøpt til Ptolemais. I 219 f.Kr. overga den ptolemaiske kommandanten den til Antiokhos III, og fra omkring 200 f.Kr. forble den hos seleukidene. Ifølge 1. Makkabeerbok giftet Aleksander Balas seg omkring 150 f.Kr. med Kleopatra, Ptolemaios' datter, i Ptolemais, og senere, da Jonatan Makkabeus kom inn i Ptolemais, stengte folket portene, grep ham og lot mennene hans falle for sverdet."
    - "På slutten av Paulus' tredje reise seilte han og hans følge fra Tyros til Ptolemais, «der hilste vi på brødrene og blev en dag hos dem», og dro så videre til Cæsarea. Under Klaudius ble byen en romersk koloni; Plinius kaller den en koloni av Klaudius Cæsar, tidligere kalt Acce, og forteller, som Josefus, om elven Belus i nærheten, hvis sand ble brukt til glass. I 67 e.Kr. kom Vespasian til Ptolemais ved starten av krigen i Galilea, og folket i Sepforis, som holdt med Roma, møtte ham der."
    - "En kirke i Ptolemais er belagt igjen omkring 190 e.Kr.: Eusebius nevner Klaros av Ptolemais, sammen med Narkissos av Jerusalem, Teofilus av Cæsarea og Cassius av Tyros, blant biskopene som skrev om feiringen av påsken. Byen forble en viktig havn under romersk og bysantinsk styre til den arabiske erobringen på 600-tallet, da det gamle navnet, som Akka, kom i bruk igjen."
  tl:
    - "Ang Tolemaida, ang Acho ng Lumang Tipan, ay nasa hilagang dulo ng look na isinasara ng Bundok Carmelo sa timog, sa daan sa baybayin sa pagitan ng Tiro at Cesarea. Nakatayo ang bayan ng Panahong Tanso at Bakal sa burol ng Tel Akko, bahagyang papasok sa lupain; sa panahong Helenistiko, kumalat ang lungsod sa maliit na tangway kung saan nakatayo ngayon ang lumang lungsod ng Acre. Sa mga liham ng Amarna noong ika-14 na siglo BK, sumusulat sa faraon ang pinuno nitong si Satatna, at nagrereklamo ang isang hari ng Babilonia na pinatay ng mga taong isinugo ni Satatna at ng isa pang pinuno ang mga mangangalakal na Babilonio sa Canaan."
    - "Binibilang ng Mga Hukom ang Acho sa mga bayang hindi napalayas ng lipi ni Aser ang mga naninirahan. Noong 701 BK, inilista ni Sennacherib ng Asiria ang Acho sa mga lungsod na may kuta ni Luli, hari ng Sidon, na yumuko sa kaniyang paanan. Sa ilalim ng mga Persiyano, base ito laban sa Egipto: noong dekada 370 BK, ayon kay Diodoro, nagtipon sa Ace ang hukbong isinugo upang sakupin muli ang Egipto. Noong ika-3 siglo BK, sa ilalim ni Ptolemeo II, pinangalanan ang lungsod na Tolemaida. Noong 219 BK, ibinigay ito ng Ptolemaikong kumander nito kay Antioco III, at mula mga 200 BK ay nanatili ito sa mga Seleucida. Ayon sa 1 Macabeo, mga 150 BK ay ikinasal si Alejandro Balas kay Cleopatra, anak ni Ptolemeo, sa Tolemaida, at kalaunan, nang pumasok doon si Jonathan Macabeo, isinara ng mga tao ang mga pintuan, dinakip siya at pinatay sa tabak ang mga tauhan niya."
    - "Sa katapusan ng ikatlong paglalakbay ni Pablo, siya at ang kaniyang mga kasama ay naglayag mula sa Tiro hanggang sa Tolemaida, “kami'y nagsibati sa mga kapatid, at kami'y nagsitahan sa kanilang isang araw”, at pagkatapos ay nagpatuloy sa Cesarea. Sa ilalim ni Claudio, ang lungsod ay naging koloniyang Romano; tinatawag ito ni Plinio na koloniya ni Claudio Cesar, na dating tinawag na Acce, at, gaya ni Josephus, nagsasalaysay ng ilog Belus sa malapit, na ang buhangin ay ginamit sa salamin. Noong AD 67, dumating si Vespasiano sa Tolemaida sa simula ng digmaan sa Galilea, at sinalubong siya roon ng mga taga-Sepphoris, na kumampi sa Roma."
    - "Muling pinatutunayan ang isang iglesia sa Tolemaida bandang AD 190: pinangalanan ni Eusebio si Claro ng Tolemaida, kasama sina Narciso ng Jerusalem, Teofilo ng Cesarea at Cassio ng Tiro, sa mga obispong sumulat tungkol sa pagdiriwang ng Pasko ng Pagkabuhay. Nanatiling mahalagang daungan ang lungsod sa ilalim ng pamamahalang Romano at Bisantino hanggang sa pananakop ng mga Arabe noong ika-7 siglo, nang bumalik sa gamit ang lumang pangalan nito, bilang Akka."
  da:
    - "Ptolemais, Det Gamle Testamentes Akko, ligger ved den nordlige ende af bugten, som Karmel lukker mod syd, på kystvejen mellem Tyrus og Cæsarea. Bronze- og jernalderbyen lå på højen Tel Akko, lidt inde i landet; i hellenistisk tid bredte byen sig ud på den lille halvø, hvor den gamle by Acre ligger i dag. I Amarna-brevene fra 1300-tallet f.Kr. skriver dens hersker Satatna til faraoen, og en konge af Babylon klager over, at mænd sendt af Satatna og en anden hersker havde dræbt babyloniske købmænd i Kana'an."
    - "Dommerbogen regner Akko blandt de byer, hvis indbyggere Aser ikke fordrev. I 701 f.Kr. opregner Sankerib af Assyrien Akko blandt de befæstede byer, tilhørende Luli, konge af Sidon, som bøjede sig for hans fødder. Under perserne var den en base mod Egypten: i 370'erne f.Kr. samledes ifølge Diodor hæren, der blev sendt for at generobre Egypten, i Ace. I 200-tallet f.Kr. blev byen under Ptolemaios 2. omdøbt til Ptolemais. I 219 f.Kr. overgav dens ptolemæiske kommandant den til Antiochos 3., og fra omkring 200 f.Kr. forblev den hos seleukiderne. Ifølge 1 Makkabæerbog giftede Alexander Balas sig omkring 150 f.Kr. i Ptolemais med Kleopatra, Ptolemaios' datter, og da Jonatan Makkabæer senere kom ind i Ptolemais, lukkede dens folk portene, greb ham og slog hans mænd ned med sværd."
    - "Ved slutningen af Paulus' tredje rejse sejlede han og hans ledsagere fra Tyrus til Ptolemais, »og vi hilste paa Brødrene og bleve een Dag hos dem«, og drog derpå videre til Cæsarea. Under Klaudius blev byen en romersk koloni; Plinius kalder den en koloni af Claudius Cæsar, engang kaldt Acce, og fortæller ligesom Josefus om floden Belus i nærheden, hvis sand blev brugt til glas. I 67 e.Kr. kom Vespasian til Ptolemais ved krigens begyndelse i Galilæa, og folkene fra Sepforis, som holdt med Rom, mødte ham dér."
    - "En kirke i Ptolemais er bevidnet igen omkring 190 e.Kr.: Eusebios nævner Clarus af Ptolemais, sammen med Narcissus af Jerusalem, Theofilus af Cæsarea og Cassius af Tyrus, blandt de biskopper, der skrev om påskens fejring. Byen forblev en vigtig havn under romersk og byzantinsk styre indtil den arabiske erobring i 600-tallet, da dens gamle navn, som Akka, kom i brug igen."
  sr:
    - "Птолемаида, Ако из Старог завета, лежи на северном крају залива који Кармил затвара на југу, на приобалном путу између Тира и Цезареје. Град бронзаног и гвозденог доба стајао је на хумци Тел Ако, мало у унутрашњости; у хеленистичко доба град се проширио на мало полуострво где данас стоји стари град Акра. У писмима из Амарне из 14. века п. н. е. његов владар Сататна пише фараону, а један вавилонски краљ жали се да су људи које су послали Сататна и још један владар у Ханану побили вавилонске трговце."
    - "Судије убрајају Акон међу градове чије становнике племе Асирово није истерало. Године 701. п. н. е. Сенахирим Асирски наводи Ако међу утврђеним градовима Лулија, краља Сидона, који су му се поклонили. Под Персијанцима био је база против Египта: 370-их п. н. е., каже Диодор, војска послата да поново освоји Египат окупила се у Аке. У 3. веку п. н. е., под Птолемејем II, град је преименован у Птолемаиду. Године 219. п. н. е. његов птолемејски заповедник предао га је Антиоху III, а од око 200. п. н. е. остао је код Селеукида. Према 1. Макавејској, око 150. п. н. е. Александар Бала оженио се у Птолемаиди Клеопатром, кћерју Птолемејевом, а касније, кад је Јонатан Макавејац ушао у Птолемаиду, њени људи затворили су капије, ухватили га и мачем побили његове људе."
    - "На крају Павловог трећег путовања он и његови сапутници пловили су из Тира у Птолемаиду, „и поздравивши се с браћом остасмо код њих један дан“, а затим отишли у Цезареју. Под Клаудијем је град постао римска колонија; Плиније је зове колонијом Клаудија Цезара, некад званом Аке, и, као и Јосиф Флавије, прича о оближњој реци Бел, чији се песак употребљавао за стакло. Године 67. н. е. Веспазијан је дошао у Птолемаиду на почетку рата у Галилеји, и ту су га дочекали становници Сефориса, који су стали на страну Рима."
    - "Црква у Птолемаиди поново је посведочена око 190. н. е.: Јевсевије именује Клара из Птолемаиде, с Наркисом Јерусалимским, Теофилом Цезаријским и Касијем Тирским, међу епископима који су писали о држању Васкрса. Град је остао важна лука под римском и византијском влашћу до арапског освајања у 7. веку, кад се његово старо име, као Акка, вратило у употребу."
  hu:
    - "Ptolemais, az Ószövetség Akkója, annak az öbölnek az északi végén fekszik, amelyet délről a Kármel zár le, a Tírusz és Cézárea közötti parti úton. A bronz- és vaskori város a Tel Akko halmán állt, kissé beljebb; a hellenisztikus korban a város ráterjedt arra a kis félszigetre, ahol ma Akkó óvárosa áll. A Kr. e. 14. századi amarnai levelekben uralkodója, Szatatna ír a fáraónak, Babilon királya pedig panaszkodik, hogy Szatatna és egy másik uralkodó által küldött emberek megölték a babiloni kereskedőket Kánaánban."
    - "A Bír 1,31 Akkót azon városok közé sorolja, amelyek lakóit Áser törzse nem űzte ki. Kr. e. 701-ben az asszír Szanhérib Akkót Luli, szidóni király megerősített városai között sorolja fel, amelyek lábainál meghajoltak. A perzsák alatt Egyiptom elleni támaszpont volt: a Kr. e. 370-es években, mondja Diodórosz, az Egyiptom visszahódítására küldött sereg Akénél gyűlt össze. A Kr. e. 3. században, II. Ptolemaiosz alatt a várost Ptolemaisnak nevezték át. Kr. e. 219-ben ptolemaida parancsnoka III. Antiokhosznak adta át, és Kr. e. 200 körüli időtől a szeleukidáknál maradt. Az 1Makk szerint Kr. e. 150 körül Alexandrosz Balasz Ptolemaisban vette feleségül Kleopátrát, Ptolemaiosz leányát, később pedig, amikor Makkabeus Jonatán Ptolemaisba ért, népe bezárta a kapukat, elfogta és emberei kardélre hányta."
    - "Pál harmadik útjának végén ő és társai Tíruszból Ptolemaiszba hajóztak, „köszöntvén az atyafiakat, nálok maradánk egy napig”, majd Cézáreába mentek tovább. Klaudius alatt a város római gyarmat lett; Plinius Claudius Caesar gyarmatának nevezi, amelyet egykor Accének hívtak, és Josephus Flaviushoz hasonlóan beszél a közeli Belosz folyóról, amelynek homokját üveghez használták. Kr. u. 67-ben Vespasianus a galileai háború kezdetén Ptolemaiszba érkezett, és a Rómához húzó Sepphórisz népe ott találkozott vele."
    - "A ptolemaiszi egyház Kr. u. 190 körül ismét igazolható: Euszebiosz megnevezi a ptolemaiszi Clarust, a jeruzsálemi Narkisszusszal, a cézáreai Teofilusszal és a tíruszi Cassiusszal együtt azon püspökök között, akik a húsvét megtartásáról írtak. A város római és bizánci uralom alatt fontos kikötő maradt a 7. századi arab hódításig, amikor régi neve Akka alakban újra használatba jött."
  fi:
    - "Ptolemais, Vanhan testamentin Akko, sijaitsee lahden pohjoispäässä, jonka Karmelvuori sulkee etelästä, Tyroksen ja Kesarean välisen rannikkotien varrella. Pronssi- ja rautakauden kaupunki seisoi Tel Akkon kumpareella hieman sisämaassa; hellenistisellä kaudella kaupunki levisi pienelle niemimaalle, jolla Akkon vanha kaupunki nykyään on. 1300-luvun eaa. Amarnan kirjeissä sen hallitsija Satatna kirjoittaa faraolle, ja Babylonin kuningas valittaa, että Satatnan ja toisen hallitsijan lähettämät miehet olivat tappaneet babylonialaisia kauppiaita Kanaanissa."
    - "Tuomarien kirja laskee Akkon niiden kaupunkien joukkoon, joiden asukkaita Asserin heimo ei karkoittanut. Vuonna 701 eaa. Assyrian Sanherib luettelee Akkon Sidonin kuninkaan Lulin linnoitettujen kaupunkien joukossa, jotka kumartuivat hänen jalkoihinsa. Persian alaisuudessa se oli tukikohta Egyptiä vastaan: Diodoroksen mukaan 370-luvulla eaa. Egyptin takaisinvaltaamiseen lähetetty armeija kokoontui Akeen. 200-luvulla eaa. Ptolemaios II:n aikana kaupunki nimettiin Ptolemaisiksi. Vuonna 219 eaa. ptolemaiolainen päällikkö luovutti sen Antiokhos III:lle, ja noin 200 eaa. lähtien se pysyi seleukidien hallussa. 1. Makkabeusten kirjan mukaan noin 150 eaa. Aleksandros Balas meni naimisiin Ptolemaioksen tyttären Kleopatran kanssa Ptolemaisissa, ja myöhemmin Jonatan Makkabin tullessa Ptolemaisiin sen asukkaat sulkivat portit, vangitsivat hänet ja surmasivat hänen miehensä miekalla."
    - "Paavalin kolmannen matkan lopussa hän ja hänen seuralaisensa purjehtivat Tyroksesta Ptolemaisiin ja ”tervehdimme veljiä siellä ja viivyimme päivän heidän luonansa”, ja jatkoivat sitten Kesareaan. Klaudiuksen aikana kaupungista tuli roomalainen siirtokunta; Plinius kutsuu sitä Klaudius Caesarin siirtokunnaksi, jota kutsuttiin ennen Akkeksi, ja Josephuksen tavoin kertoo läheisestä Belus-joesta, jonka hiekkaa käytettiin lasiin. Vuonna 67 jaa. Vespasianus tuli Ptolemaisiin Galilean sodan alussa, ja Rooman puolella olleet Sepphoriksen asukkaat tapasivat hänet siellä."
    - "Ptolemaisin seurakunta mainitaan jälleen noin 190 jaa.: Eusebios nimeää Ptolemaisin Claruksen, Jerusalemin Narkissoksen, Kesarean Teofiloksen ja Tyroksen Cassiuksen niiden piispojen joukossa, jotka kirjoittivat pääsiäisen vietosta. Kaupunki pysyi tärkeänä satamana Rooman ja Bysantin vallan alla arabien valloitukseen 600-luvulla asti, jolloin sen vanha nimi Akka otettiin uudelleen käyttöön."
  vi:
    - "Bê-tô-lê-mai, tức A-cô trong Cựu Ước, nằm ở đầu bắc của vịnh mà núi Cạt-mên khép lại ở phía nam, trên con đường ven biển giữa Ty-rơ và Sê-sa-rê. Thành thời Đồ Đồng và Đồ Sắt nằm trên gò Tel Akko, hơi vào trong đất liền; vào thời Hy Lạp hóa, thành lan ra bán đảo nhỏ nơi thành cổ Acre đứng ngày nay. Trong các thư Amarna thế kỷ 14 TCN, người cai trị nó là Satatna viết cho pharaô, và một vua Ba-by-lôn than phiền rằng những người do Satatna và một người cai trị khác sai đi đã giết các thương nhân Ba-by-lôn ở Ca-na-an."
    - "Sách Các Quan Xét kể A-cô trong số các thành mà chi phái A-se không đuổi được dân cư. Năm 701 TCN, San-chê-ríp của A-si-ri liệt kê A-cô trong số các thành kiên cố của Luli, vua Si-đôn, đã phủ phục dưới chân ông. Dưới thời Ba Tư nó là căn cứ chống Ai Cập: vào thập niên 370 TCN, Diodorus nói, đạo quân được sai đi tái chinh phục Ai Cập tập hợp ở Ace. Vào thế kỷ 3 TCN, dưới Ptolemaios II, thành được đổi tên là Bê-tô-lê-mai. Năm 219 TCN, chỉ huy Ptolemaios của nó trao thành cho Antiochus III, và từ khoảng năm 200 TCN nó ở với người Seleucus. Theo 1 Ma-ca-bê, khoảng năm 150 TCN, Alexander Balas cưới Cleopatra, con gái Ptolemaios, tại Bê-tô-lê-mai, và về sau, khi Giô-na-than Ma-ca-bê vào Bê-tô-lê-mai, dân thành đóng cổng, bắt ông và giết người của ông bằng gươm."
    - "Cuối chuyến đi thứ ba của Phao-lô, ông và các bạn đồng hành đi thuyền từ Ty-rơ đến Bê-tô-lê-mai, “chào thăm anh em và ở lại với họ một ngày”, rồi đi tiếp đến Sê-sa-rê. Dưới Cơ-lốt thành trở thành thuộc địa La Mã; Pliny gọi nó là thuộc địa của Claudius Caesar, xưa gọi là Acce, và cũng như Josephus, kể về sông Belus gần đó, có cát dùng làm thủy tinh. Năm 67, Vespasian đến Bê-tô-lê-mai khi bắt đầu cuộc chiến ở Ga-li-lê, và dân Sepphoris, đứng về phía Rô-ma, gặp ông ở đó."
    - "Một hội thánh ở Bê-tô-lê-mai lại được chứng thực khoảng năm 190: Eusebius nêu Clarus ở Bê-tô-lê-mai, cùng Nạt-xít ở Giê-ru-sa-lem, Thê-ô-phi-lơ ở Sê-sa-rê và Cassius ở Ty-rơ, trong số các giám mục viết về việc cử hành lễ Phục Sinh. Thành vẫn là một hải cảng quan trọng dưới sự cai trị La Mã và Byzantine cho đến cuộc chinh phục của người A-ráp ở thế kỷ 7, khi tên cũ của nó, Akka, được dùng lại."
  ro:
    - "Ptolemaida, Aco din Vechiul Testament, se află la capătul nordic al golfului pe care Muntele Carmel îl închide la sud, pe drumul de coastă dintre Tir și Cezareea. Orașul din Epoca bronzului și a fierului se afla pe movila Tel Akko, puțin în interior; în epoca elenistică, orașul s-a întins pe mica peninsulă unde se află astăzi vechiul oraș Acra. În scrisorile de la Amarna din secolul al XIV-lea î.Hr., conducătorul său Satatna îi scrie faraonului, iar un rege al Babilonului se plânge că oamenii trimiși de Satatna și de un alt conducător au ucis negustori babilonieni în Canaan."
    - "Judecătorii numără Aco printre cetățile ai căror locuitori nu au fost alungați de seminția lui Așer. În 701 î.Hr., Senaherib al Asiriei înșiră Aco printre cetățile întărite ale lui Luli, regele Sidonului, care s-au plecat la picioarele lui. Sub perși a fost o bază împotriva Egiptului: în anii 370 î.Hr., spune Diodor, armata trimisă să recucerească Egiptul s-a adunat la Ace. În secolul al III-lea î.Hr., sub Ptolemeu al II-lea, orașul a fost redenumit Ptolemaida. În 219 î.Hr., comandantul lui ptolemeic l-a predat lui Antioh al III-lea, iar din jurul anului 200 î.Hr. a rămas la seleucizi. Potrivit 1 Macabei, în jurul anului 150 î.Hr., Alexandru Balas s-a căsătorit la Ptolemaida cu Cleopatra, fiica lui Ptolemeu, iar mai târziu, când Ionatan Macabeul a intrat în Ptolemaida, locuitorii au închis porțile, l-au prins și i-au trecut oamenii prin sabie."
    - "La sfârșitul celei de-a treia călătorii a lui Pavel, el și însoțitorii lui au navigat de la Tir la Ptolemaida, unde, „închinându-ne fraților, am rămas o zi la ei”, apoi au mers mai departe la Cezareea. Sub Claudiu, orașul a devenit colonie romană; Pliniu o numește colonie a lui Claudius Caesar, numită odinioară Acce, și, ca și Iosif Flaviu, vorbește despre râul Belus din apropiere, al cărui nisip era folosit pentru sticlă. În anul 67 d.Hr., Vespasian a venit la Ptolemaida la începutul războiului din Galileea, iar locuitorii Sepforisului, care au ținut cu Roma, l-au întâlnit acolo."
    - "O biserică din Ptolemaida este atestată din nou în jurul anului 190 d.Hr.: Eusebiu îl numește pe Clarus din Ptolemaida, alături de Narcis al Ierusalimului, Teofil al Cezareei și Cassius al Tirului, printre episcopii care au scris despre ținerea Paștelui. Orașul a rămas un port important sub stăpânirea romană și bizantină până la cucerirea arabă din secolul al VII-lea, când vechiul său nume, ca Akka, a revenit în uz."
  bg:
    - "Птолемаида, Акон от Стария завет, се намира в северния край на залива, който планината Кармил затваря от юг, по крайбрежния път между Тир и Кесария. Градът от бронзовата и желязната епоха стоял на могилата Тел Ако, малко навътре от брега; в елинистическата епоха той се разпрострял върху малкия полуостров, където днес се намира старият град на Ако. В писмата от Амарна от XIV в. пр.н.е. неговият владетел Сататна пише на фараона, а един цар на Вавилон се оплаква, че хора, изпратени от Сататна и от друг владетел, избили вавилонски търговци в Ханаан."
    - "Съдии изброява Акон сред градовете, чиито жители племето Асир не изгонило. През 701 г. пр.н.е. асирийският цар Сенахирим изброява Акон сред укрепените градове на Лули, цар на Сидон, които се поклонили в нозете му. При персите той бил база срещу Египет: през 370-те години пр.н.е., казва Диодор, армията, изпратена да завладее отново Египет, се събрала в Аке. През III в. пр.н.е., при Птолемей II, градът бил преименуван на Птолемаида. През 219 г. пр.н.е. птолемеевият му командир го предал на Антиох III и от около 200 г. пр.н.е. той останал у Селевкидите. Според 1 Макавейска около 150 г. пр.н.е. Александър Балас се оженил в Птолемаида за Клеопатра, дъщерята на Птолемей, а по-късно, когато Йонатан Макавей влязъл в Птолемаида, жителите затворили портите, заловили го и избили хората му с меч."
    - "В края на третото пътуване на Павел той и спътниците му отплавали от Тир за Птолемаида, „дето поздравихме братята и преседехме у тех един ден“, а после продължили към Кесария. При Клавдий градът станал римска колония; Плиний го нарича колония на Клавдий Цезар, някога наричана Аке, и подобно на Йосиф Флавий разказва за близката река Белус, чийто пясък се използвал за стъкло. През 67 г. н.е. Веспасиан дошъл в Птолемаида в началото на войната в Галилея и жителите на Сефорис, които били на страната на Рим, го посрещнали там."
    - "Църква в Птолемаида отново е засвидетелствана около 190 г. н.е.: Евсевий назовава Клар от Птолемаида, заедно с Наркис Йерусалимски, Теофил Кесарийски и Касий Тирски, сред епископите, които писали за празнуването на Пасха. Градът останал важно пристанище при римското и византийското управление до арабското завоевание през VII в., когато старото му име, като Ака, отново влязло в употреба."
scripture:
  - Judg.1.31
  - Acts.21.7-Acts.21.8
