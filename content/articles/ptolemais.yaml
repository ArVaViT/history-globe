body:
  en:
    - "Ptolemais, the Acco of the Old Testament, lies at the northern end of the bay that Mount Carmel closes on the south, on the coast road between Tyre and Caesarea. The Bronze and Iron Age town stood on the mound of Tel Akko, a little inland; in the Hellenistic age the city spread onto the small peninsula where the old city of Acre stands today. In the Amarna letters of the fourteenth century BC its ruler Satatna writes to the pharaoh, and a king of Babylon complains that men sent by Satatna and another ruler had killed Babylonian merchants in Canaan."
    - "Judges counts Accho among the towns whose inhabitants the tribe of Asher did not drive out. In 701 BC Sennacherib of Assyria lists Acco among the fortified cities of Luli, king of Sidon, that bowed at his feet. Under the Persians it was a base against Egypt: in the 370s BC, Diodorus says, the army sent to reconquer Egypt gathered at Ace. In the third century BC, under Ptolemy II, the city was renamed Ptolemais. In 219 BC its Ptolemaic commander handed it to Antiochus III, and from about 200 BC it stayed with the Seleucids. According to 1 Maccabees, about 150 BC Alexander Balas married Cleopatra, daughter of Ptolemy, at Ptolemais, and later, when Jonathan Maccabeus came into Ptolemais, its people shut the gates, seized him and put his men to the sword."
    - 'At the end of Paul''s third journey he and his companions sailed from Tyre to Ptolemais, "and saluted the brethren, and abode with them one day", then went on to Caesarea. Under Claudius the city became a Roman colony; Pliny calls it a colony of Claudius Caesar, once called Acce, and, like Josephus, tells of the river Belus nearby, whose sand was used for glass. In AD 67 Vespasian came to Ptolemais at the start of the war in Galilee, and the people of Sepphoris, who sided with Rome, met him there.'
    - "A church at Ptolemais is attested again about AD 190: Eusebius names Clarus of Ptolemais, with Narcissus of Jerusalem, Theophilus of Caesarea and Cassius of Tyre, among the bishops who wrote on the keeping of Easter. The city remained an important port under Roman and Byzantine rule until the Arab conquest in the seventh century, when its old name, as Akka, came back into use."
  ru:
    - "Птолемаида, ветхозаветный Акко, лежит у северного края залива, который с юга замыкает гора Кармил, на прибрежной дороге между Тиром и Кесарией. Город бронзового и железного веков стоял на холме Тель-Акко, немного в глубине суши; в эллинистическую эпоху город распространился на небольшой полуостров, где сегодня стоит старый город Акко. В амарнских письмах XIV века до н. э. его правитель Сататна пишет фараону, а царь Вавилона жалуется, что люди, посланные Сататной и ещё одним правителем, убили вавилонских купцов в Ханаане."
    - "Книга Судей называет Акко среди городов, жителей которых колено Асирово не изгнало. В 701 г. до н. э. ассирийский царь Сеннахирим перечисляет Акко среди укреплённых городов Лули, царя Сидона, которые склонились к его ногам. При персах город служил опорой против Египта: в 370-х гг. до н. э., по словам Диодора, войско, посланное отвоевать Египет, собралось у города Аке. В III веке до н. э., при Птолемее II, город переименовали в Птолемаиду. В 219 г. до н. э. птолемеевский военачальник сдал его Антиоху III, а примерно с 200 г. до н. э. он остался за Селевкидами. По Первой книге Маккавейской, около 150 г. до н. э. Александр Балас женился в Птолемаиде на Клеопатре, дочери Птолемея, а позже, когда в Птолемаиду вошёл Ионафан Маккавей, её жители заперли ворота, схватили его и перебили бывших с ним."
    - "В конце третьего путешествия Павел и его спутники приплыли из Тира в Птолемаиду и, «приветствовав братьев, пробыли у них один день», а затем отправились в Кесарию. При Клавдии город стал римской колонией; Плиний называет его колонией Клавдия Цезаря, прежде называвшейся Акке, и, как и Иосиф Флавий, рассказывает о соседней речке Бел, песок которой шёл на стекло. В 67 г. н. э. Веспасиан пришёл в Птолемаиду в начале войны в Галилее, и жители Сепфориса, державшие сторону Рима, встретили его там."
    - "Церковь в Птолемаиде вновь засвидетельствована около 190 г. н. э.: Евсевий называет Клара Птолемаидского вместе с Наркиссом Иерусалимским, Феофилом Кесарийским и Кассием Тирским среди епископов, писавших о праздновании Пасхи. Город оставался важным портом при римлянах и византийцах вплоть до арабского завоевания в VII веке, когда в обиход вернулось его старое имя — Акка."
  uk:
    - "Птолемаїда, Акко Старого Завіту, лежить на північному краї затоки, яку з півдня замикає гора Кармель, на узбережній дорозі між Тіром і Кесарією. Місто доби бронзи й заліза стояло на пагорбі Тель-Акко, трохи вглиб суходолу; в елліністичну добу воно розрослося на невеликий півострів, де сьогодні стоїть старе місто Акра. В амарнських листах XIV ст. до н. е. його правитель Сататна пише фараонові, а вавилонський цар скаржиться, що люди, надіслані Сататною та іншим правителем, убили вавилонських купців у Ханаані."
    - "Книга Суддів зараховує Акко до міст, мешканців яких плем’я Асира не вигнало. У 701 р. до н. е. Сінаххеріб Ассирійський зараховує Акко до укріплених міст Лулі, царя Сідона, що впали до його ніг. За персів воно було базою проти Єгипту: у 370-х рр. до н. е., за словами Діодора, військо, послане знову підкорити Єгипет, зібралося в Аке. У III ст. до н. е., за Птолемея II, місто перейменували на Птолемаїду. У 219 р. до н. е. його птолемеївський начальник віддав його Антіохові III, а від близько 200 р. до н. е. воно лишалося за Селевкідами. Згідно з 1 Книгою Макавеїв, близько 150 р. до н. е. Александр Бала одружився в Птолемаїді з Клеопатрою, дочкою Птолемея, а пізніше, коли Йонатан Макавей увійшов до Птолемаїди, її мешканці замкнули ворота, схопили його й перебили мечем його людей."
    - "Наприкінці третьої подорожі Павла він і його супутники попливли з Тіру до Птолемаїди, «привитавши братів, пробули в них один день», а потім вирушили до Кесарії. За Клавдія місто стало римською колонією; Пліній називає його колонією Клавдія Цезаря, колись званою Аке, і, як і Йосиф Флавій, розповідає про недалеку річку Бел, пісок якої йшов на скло. У 67 р. н. е. Веспасіан прибув до Птолемаїди на початку війни в Галілеї, і жителі Сефоріса, що трималися Риму, зустріли його там."
    - "Церква в Птолемаїді знову засвідчена близько 190 р. н. е.: Євсевій називає Клара з Птолемаїди разом із Наркісом Єрусалимським, Феофілом Кесарійським і Кассієм Тірським серед єпископів, що писали про дотримання Пасхи. Місто залишалося важливим портом за римського та візантійського панування аж до арабського завоювання в VII ст., коли стара назва в формі Акка знову ввійшла у вжиток."
  es:
    - "Tolemaida, el Aco del Antiguo Testamento, se encuentra en el extremo norte de la bahía que el monte Carmelo cierra por el sur, en el camino de la costa entre Tiro y Cesarea. La ciudad de las Edades del Bronce y del Hierro se alzaba en el montículo de Tel Akko, algo tierra adentro; en la época helenística la ciudad se extendió a la pequeña península donde se halla hoy la ciudad vieja de Acre. En las cartas de Amarna del siglo XIV a. C. su gobernante Satatna escribe al faraón, y un rey de Babilonia se queja de que hombres enviados por Satatna y otro gobernante habían matado a mercaderes babilonios en Canaán."
    - "Jueces cuenta Aco entre las ciudades cuyos habitantes la tribu de Aser no expulsó. En 701 a. C. Senaquerib de Asiria enumera Aco entre las ciudades fortificadas de Luli, rey de Sidón, que se postraron a sus pies. Bajo los persas fue una base contra Egipto: en la década de 370 a. C., dice Diodoro, el ejército enviado a reconquistar Egipto se reunió en Ace. En el siglo III a. C., bajo Tolomeo II, la ciudad fue rebautizada Tolemaida. En 219 a. C. su comandante ptolemaico la entregó a Antíoco III, y desde aproximadamente 200 a. C. quedó con los seléucidas. Según 1 Macabeos, hacia 150 a. C. Alejandro Balas se casó en Tolemaida con Cleopatra, hija de Tolomeo, y más tarde, cuando Jonatán Macabeo entró en Tolemaida, su gente cerró las puertas, lo apresó y pasó a espada a sus hombres."
    - "Al final del tercer viaje de Pablo, él y sus compañeros navegaron de Tiro a Tolemaida, «y habiendo saludado á los hermanos, nos quedamos con ellos un día», y siguieron a Cesarea. Bajo Claudio la ciudad se convirtió en colonia romana; Plinio la llama colonia de Claudio César, antes llamada Ace, y, como Josefo, habla del cercano río Belo, cuya arena se usaba para el vidrio. En 67 d. C. Vespasiano llegó a Tolemaida al comienzo de la guerra en Galilea, y la gente de Séforis, que se puso del lado de Roma, lo recibió allí."
    - "Una iglesia en Tolemaida está atestiguada de nuevo hacia el 190 d. C.: Eusebio nombra a Claro de Tolemaida, con Narciso de Jerusalén, Teófilo de Cesarea y Casio de Tiro, entre los obispos que escribieron sobre la celebración de la Pascua. La ciudad siguió siendo un puerto importante bajo el dominio romano y bizantino hasta la conquista árabe en el siglo VII, cuando su antiguo nombre, como Akka, volvió a usarse."
  pt:
    - "Ptolemaida, a Aco do Antigo Testamento, fica na ponta norte da baía que o Monte Carmelo fecha ao sul, na estrada da costa entre Tiro e Cesareia. A cidade da Idade do Bronze e do Ferro ficava no monte de Tel Akko, um pouco para o interior; na era helenística a cidade se espalhou pela pequena península onde hoje está a cidade velha de Acre. Nas cartas de Amarna do século XIV a.C., seu governante Satatna escreve ao faraó, e um rei da Babilônia se queixa de que homens enviados por Satatna e outro governante mataram mercadores babilônios em Canaã."
    - "Juízes conta Aco entre as cidades cujos habitantes a tribo de Aser não expulsou. Em 701 a.C., Senaqueribe da Assíria lista Aco entre as cidades fortificadas de Luli, rei de Sidom, que se curvaram a seus pés. Sob os persas foi base contra o Egito: na década de 370 a.C., diz Diodoro, o exército enviado para reconquistar o Egito reuniu-se em Ace. No século III a.C., sob Ptolomeu II, a cidade foi rebatizada Ptolemaida. Em 219 a.C. seu comandante ptolemaico a entregou a Antíoco III, e desde cerca de 200 a.C. ficou com os selêucidas. Segundo 1 Macabeus, por volta de 150 a.C. Alexandre Balas casou-se com Cleópatra, filha de Ptolomeu, em Ptolemaida, e mais tarde, quando Jônatas Macabeu entrou em Ptolemaida, seu povo fechou as portas, prendeu-o e passou seus homens a fio de espada."
    - "No fim da terceira viagem de Paulo, ele e seus companheiros navegaram de Tiro a Ptolemaida: “saudamos os irmãos e ficamos com eles um dia”, e depois seguiram para Cesareia. Sob Cláudio a cidade tornou-se colônia romana; Plínio a chama de colônia de Cláudio César, antes chamada Ace e, como Josefo, fala do rio Belo, ali perto, cuja areia era usada para fazer vidro. Em 67 d.C., Vespasiano veio a Ptolemaida no início da guerra na Galileia, e o povo de Séforis, que ficou do lado de Roma, o encontrou ali."
    - "Uma igreja em Ptolemaida é atestada de novo por volta de 190 d.C.: Eusébio nomeia Claro de Ptolemaida, com Narciso de Jerusalém, Teófilo de Cesareia e Cássio de Tiro, entre os bispos que escreveram sobre a data da Páscoa. A cidade continuou um porto importante sob o domínio romano e bizantino até a conquista árabe no século VII, quando o seu nome antigo, como Akka, voltou ao uso."
  de:
    - "Ptolemais, das Akko des Alten Testaments, liegt am Nordende der Bucht, die der Karmel im Süden abschließt, an der Küstenstraße zwischen Tyrus und Caesarea. Die bronze- und eisenzeitliche Stadt stand auf dem Hügel Tel Akko, etwas landeinwärts; in hellenistischer Zeit breitete sich die Stadt auf die kleine Halbinsel aus, auf der heute die Altstadt von Akko steht. In den Amarna-Briefen des 14. Jahrhunderts v. Chr. schreibt ihr Herrscher Schatatna an den Pharao, und ein König von Babylon klagt, von Schatatna und einem anderen Herrscher gesandte Männer hätten babylonische Kaufleute in Kanaan getötet."
    - "Die Richter nennen Akko unter den Städten, deren Einwohner Asser nicht vertrieb: „Asser vertrieb die Einwohner zu Akko nicht“. 701 v. Chr. führt Sanherib von Assyrien Akko unter den befestigten Städten des Luli, Königs von Sidon, auf, die sich ihm beugten. Unter den Persern war es Stützpunkt gegen Ägypten: Nach Diodor sammelte sich in den 370er Jahren v. Chr. das Heer zur Rückeroberung Ägyptens bei Ake. Im 3. Jahrhundert v. Chr. wurde sie unter Ptolemaios II. in Ptolemais umbenannt. Im Jahr 219 v. Chr. übergab ihr ptolemäischer Kommandant sie an Antiochos III., und seit etwa 200 v. Chr. blieb sie bei den Seleukiden. Nach dem 1. Makkabäerbuch heiratete Alexander Balas um 150 v. Chr. in Ptolemais Kleopatra, die Tochter des Ptolemaios, und als später Jonatan Makkabäus nach Ptolemais kam, schlossen die Einwohner die Tore, nahmen ihn gefangen und töteten seine Männer."
    - "Am Ende von Paulus' dritter Reise fuhren er und seine Gefährten von Tyrus nach Ptolemais, „und grüßten die Brüder und blieben einen Tag bei ihnen“, dann ging es weiter nach Caesarea. Unter Klaudius wurde die Stadt römische Kolonie; Plinius nennt sie eine Kolonie des Claudius Caesar, einst Acce genannt, und erzählt, wie Josephus, vom nahen Fluss Belos, dessen Sand zur Glasherstellung diente. Im Jahr 67 n. Chr. kam Vespasian zu Beginn des Krieges in Galiläa nach Ptolemais, und die Leute von Sepphoris, die zu Rom hielten, trafen ihn dort."
    - "Eine Kirche in Ptolemais ist um 190 n. Chr. wieder bezeugt: Eusebius nennt Clarus von Ptolemais mit Narzissus von Jerusalem, Theophilus von Caesarea und Cassius von Tyrus unter den Bischöfen, die über die Feier des Osterfestes schrieben. Die Stadt blieb unter römischer und byzantinischer Herrschaft ein wichtiger Hafen bis zur arabischen Eroberung im 7. Jahrhundert, als ihr alter Name als Akka wieder in Gebrauch kam."
  fr:
    - "Ptolémaïs, l’Acco de l’Ancien Testament, se trouve à l’extrémité nord de la baie que ferme au sud le mont Carmel, sur la route côtière entre Tyr et Césarée. La ville des âges du Bronze et du Fer s’élevait sur le tertre de Tel Akko, un peu à l’intérieur ; à l’époque hellénistique, elle s’étendit sur la petite péninsule où se trouve aujourd’hui la vieille ville d’Acre. Dans les lettres d’Amarna du XIVe siècle av. J.-C., son souverain Satatna écrit au pharaon, et un roi de Babylone se plaint que des hommes envoyés par Satatna et un autre souverain ont tué des marchands babyloniens en Canaan."
    - "Les Juges comptent Acco parmi les villes dont la tribu d’Aser ne chassa pas les habitants. En 701 av. J.-C., Sanchérib d’Assyrie cite Acco parmi les villes fortifiées de Louli, roi de Sidon, qui se prosternèrent à ses pieds. Sous les Perses, elle servit de base contre l’Égypte : dans les années 370 av. J.-C., dit Diodore, l’armée envoyée pour reconquérir l’Égypte se rassembla à Acé. Au IIIe siècle av. J.-C., sous Ptolémée II, la ville fut rebaptisée Ptolémaïs. En 219 av. J.-C., son commandant lagide la livra à Antiochos III, et dès environ 200 av. J.-C. elle resta aux Séleucides. Selon 1 Maccabées, vers 150 av. J.-C., Alexandre Balas épousa à Ptolémaïs Cléopâtre, fille de Ptolémée, et plus tard, quand Jonathan Maccabée entra dans Ptolémaïs, ses habitants fermèrent les portes, s’emparèrent de lui et passèrent ses hommes au fil de l’épée."
    - "À la fin du troisième voyage de Paul, lui et ses compagnons firent voile de Tyr à Ptolémaïs, « où nous saluâmes les frères, et passâmes un jour avec eux », puis allèrent à Césarée. Sous Claude, la ville devint colonie romaine ; Pline l’appelle colonie de Claude César, jadis nommée Acé, et, comme Flavius Josèphe, parle du fleuve Bélus voisin, dont le sable servait au verre. En 67 apr. J.-C., Vespasien vint à Ptolémaïs au début de la guerre en Galilée, et les gens de Sepphoris, qui s’étaient rangés du côté de Rome, l’y rencontrèrent."
    - "Une Église à Ptolémaïs est attestée de nouveau vers 190 apr. J.-C. : Eusèbe nomme Clarus de Ptolémaïs, avec Narcisse de Jérusalem, Théophile de Césarée et Cassius de Tyr, parmi les évêques qui écrivirent sur la date de Pâques. La ville resta un port important sous la domination romaine et byzantine jusqu’à la conquête arabe du VIIe siècle, où son ancien nom, Akka, revint en usage."
