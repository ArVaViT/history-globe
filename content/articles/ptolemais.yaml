# Overview article (ADR 0007). Mainstream facts only; Assyrian dates follow the standard chronology. The place is Ptolemais of Acts 21:7 (the Hellenistic and Roman city on the peninsula of Acre); the older town on Tel Akko, the Acco of Judges 1:31, is a separate record (a5f4dfc) with its own article, acco.yaml.
