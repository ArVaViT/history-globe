body:
  en:
    - "Perez-uzzah, “the breach of Uzzah”, is the name David gave to the place where Uzzah died as the ark was being brought from Kiriath-jearim toward Jerusalem. At the threshing floor of Nachon, called Chidon in Chronicles, the oxen stumbled, Uzzah put out his hand to steady the ark, and God struck him: “And David was displeased, because the LORD had made a breach upon Uzzah: and he called the name of the place Perez-uzzah to this day.” Afraid, David left the ark in the house of Obed-edom the Gittite for three months."
    - "The place lay somewhere on the road between Kiriath-jearim and Jerusalem, but nothing fixes it; the point on the map stands at Jerusalem only as an approximation. The Synodal Bible translates the name rather than transliterating it, so in Russian the place is simply “the smiting of Uzzah”."
  ru:
    - "«Поражение Озы», по-еврейски Перец-Узза, — имя, которое Давид дал месту, где умер Оза, когда ковчег везли из Кириаф-Иарима в Иерусалим. У гумна Нахонова, в Паралипоменоне — Хидона, волы споткнулись, Оза простёр руку, чтобы поддержать ковчег, и Бог поразил его: «И опечалился Давид, что Господь поразил Озу. И назвал то место поражением Озы; так называется оно и до сего дня». Устрашившись, Давид оставил ковчег на три месяца в доме Аведдара Гефянина."
    - "Место лежало где-то на дороге между Кириаф-Иаримом и Иерусалимом, но ничто его не определяет; точка на карте стоит у Иерусалима лишь приблизительно. Синодальный перевод передаёт имя смыслом, а не звучанием, поэтому по-русски место называется просто «Поражение Озы»."
  uk:
    - "Перец-Уза, «прорив Ози», — ім’я, яке Давид дав місцю, де помер Оза, коли ковчег везли з Кіріят-Єарима до Єрусалима. На току Нахона, у Хроніках — Хідона, воли спіткнулися, Оза простяг руку, щоб підтримати ковчег, і Бог убив його: «І зажуривсь Давид тяжко, що Господь убив Озу. Місце се називаєсь „Убиттє Ози‟ й по сей день». Злякавшись, Давид залишив ковчег у домі Овед-Едома Гіттянина на три місяці."
    - "Місце лежало десь на дорозі між Кіріят-Єаримом і Єрусалимом, але ніщо його не визначає; точка на мапі стоїть в Єрусалимі лише як наближення. Куліш передає ім’я за змістом, а не за звучанням, тож українською місце зветься просто «Убиттє Ози»."
  es:
    - "Pérez-uza, «la rotura de Uza», es el nombre que David dio al lugar donde murió Uza cuando el arca era llevada desde Quiriat-jearim hacia Jerusalén. En la era de Nacón, llamada Quidón en Crónicas, los bueyes tropezaron, Uza extendió la mano para sujetar el arca, y Dios lo hirió: «Y David tuvo pesar, porque Jehová había hecho rotura en Uzza; por lo que llamó aquel lugar Pérez-uzza, hasta hoy». Temeroso, David dejó el arca en casa de Obed-edom el geteo durante tres meses."
    - "El lugar estaba en algún punto del camino entre Quiriat-jearim y Jerusalén, pero nada lo fija; el punto del mapa está en Jerusalén solo como aproximación. La Biblia sinodal traduce el nombre en lugar de transliterarlo, de modo que en ruso el lugar es simplemente «el golpe de Uza»."
  pt:
    - "Perez-Uzá, “a ruptura de Uzá”, é o nome que Davi deu ao lugar onde Uzá morreu quando a arca era levada de Quiriate-Jearim para Jerusalém. Na eira de Nacom, chamada Quidom em Crônicas, os bois tropeçaram, Uzá estendeu a mão para firmar a arca, e Deus o feriu: “Davi ficou desgostoso porque o SENHOR havia irrompido contra Uzá; e ele chamou aquele lugar de Perez-Uzá até o dia de hoje.” Com medo, Davi deixou a arca na casa de Obede-Edom, o geteu, por três meses."
    - "O lugar ficava em algum ponto da estrada entre Quiriate-Jearim e Jerusalém, mas nada o fixa; o ponto no mapa está em Jerusalém apenas como aproximação. A Bíblia Sinodal traduz o nome em vez de transliterá-lo, de modo que em russo o lugar é simplesmente “o golpe de Uzá”."
  de:
    - "Perez-Usa, „der Einbruch Usas“, ist der Name, den David dem Ort gab, wo Usa starb, als die Lade von Kirjat-Jearim nach Jerusalem gebracht wurde. An der Tenne Nachons, in der Chronik Chidon genannt, scheuten die Rinder, Usa streckte die Hand aus, um die Lade zu halten, und Gott schlug ihn: „Da ward David betrübt, daß der HERR den Usa so wegriß, und man hieß die Stätte Perez-Usa bis auf diesen Tag.“ Aus Furcht ließ David die Lade drei Monate im Haus Obed-Edoms, des Gathiters."
    - "Der Ort lag irgendwo an der Straße zwischen Kirjat-Jearim und Jerusalem, doch nichts legt ihn fest; der Punkt auf der Karte steht nur näherungsweise in Jerusalem. Die russische Synodalübersetzung übersetzt den Namen, statt ihn zu transkribieren, sodass der Ort auf Russisch schlicht „der Schlag über Usa“ heißt."
  fr:
    - "Pérets-Uzza, « brèche d’Uzza », est le nom que David donna au lieu où Uzza mourut pendant que l’arche était amenée de Kirjath-Jearim vers Jérusalem. À l’aire de Nacon, appelée Kidon dans les Chroniques, les bœufs la firent pencher, Uzza étendit la main pour retenir l’arche, et Dieu le frappa : « David fut irrité de ce que l’Éternel avait frappé Uzza d’un tel châtiment. Et ce lieu a été appelé jusqu’à ce jour Pérets-Uzza. » Pris de crainte, David laissa l’arche trois mois dans la maison d’Obed-Édom de Gath."
    - "Le lieu se trouvait quelque part sur la route entre Kirjath-Jearim et Jérusalem, mais rien ne le fixe ; le point de la carte est à Jérusalem seulement à titre d’approximation. La Bible synodale russe traduit le nom au lieu de le transcrire : en russe, le lieu s’appelle simplement « le coup porté à Uzza » (Louis Segond le transcrit : Pérets-Uzza)."
  it:
    - "Perez-Uzza, «la breccia di Uzza», è il nome che Davide diede al luogo in cui Uzza morì mentre l’arca veniva portata da Kiriat-Iearim verso Gerusalemme. All’aia di Nacon, chiamata Kidon nelle Cronache, i buoi inciamparono, Uzza stese la mano per sostenere l’arca, e Dio lo colpì: «Davide si attristò perché l’Eterno avea fatto una breccia nel popolo, colpendo Uzza; e quel luogo è stato chiamato Perets-Uzza fino al dì d’oggi.» Spaventato, Davide lasciò l’arca in casa di Obed-Edom di Gat per tre mesi."
    - "Il luogo si trovava da qualche parte sulla strada tra Kiriat-Iearim e Gerusalemme, ma nulla lo fissa; il punto sulla mappa sta a Gerusalemme solo come approssimazione. La Bibbia sinodale traduce il nome anziché traslitterarlo, per cui in russo il luogo è semplicemente «la percossa di Uzza»."
  pl:
    - "Peres-Uzza, „rozerwanie Uzzy”, to nazwa, jaką Dawid nadał miejscu, gdzie zginął Uzza, gdy niesiono arkę z Kiriat-Jearim ku Jerozolimie. Na klepisku Nakona, w Kronikach zwanym Kidon, woły się potknęły, Uzza wyciągnął rękę, by przytrzymać arkę, i Bóg go uderzył: „I zafrasował się Dawid, że Pan srodze zaraził Ozę, i nazwał miejsce ono Perezoza, aż do dnia tego”. Przestraszony Dawid zostawił arkę w domu Obed-Edoma z Gat na trzy miesiące."
    - "Miejsce leżało gdzieś przy drodze między Kiriat-Jearim a Jerozolimą, lecz nic go nie określa; punkt na mapie stoi w Jerozolimie tylko jako przybliżenie. Biblia synodalna tłumaczy nazwę zamiast ją transliterować, więc po rosyjsku miejsce to jest po prostu „porażeniem Uzzy”."
  cs:
    - "Perec-uza, „proražení Uzovo“, je jméno, které David dal místu, kde zemřel Uza, když se truhla vezla z Kirjat-jearímu k Jeruzalému. Na humně Nákonově, v Kronikách zvaném Kídonovo, se voli zapotácili, Uza vztáhl ruku, aby truhlu přidržel, a Bůh ho udeřil: „Tedy zkormoutil se David, proto že se Hospodin tak přísně obořil na Uzu. I nazváno to místo Peres Uza až do tohoto dne.“ Vyděšený David nechal truhlu v domě Obed-edoma Gatského na tři měsíce."
    - "Místo leželo někde na cestě mezi Kirjat-jearímem a Jeruzalémem, ale nic jej neurčuje; bod na mapě stojí v Jeruzalémě jen jako přiblížení. Synodální Bible jméno překládá místo přepisu, takže v ruštině je místo prostě „Uzovo poražení“."
  nl:
    - "Perez-Uzza, “de breuk van Uzza”, is de naam die David gaf aan de plaats waar Uzza stierf toen de ark van Kirjat-Jearim naar Jeruzalem werd gebracht. Bij de dorsvloer van Nachon, in Kronieken Kidon genoemd, struikelden de ossen, stak Uzza zijn hand uit om de ark te steunen, en God trof hem: “En David ontstak, omdat de HEERE een scheur gescheurd had aan Uza; en hij noemde dezelve plaats Perez-Uza, tot op dezen dag.” Bang liet David de ark drie maanden in het huis van Obed-Edom de Gatiet."
    - "De plaats lag ergens aan de weg tussen Kirjat-Jearim en Jeruzalem, maar niets legt haar vast; het punt op de kaart staat bij Jeruzalem slechts bij benadering. De Synodale Bijbel vertaalt de naam in plaats van hem te transcriberen, zodat de plaats in het Russisch eenvoudig “het neerslaan van Uzza” heet."
  sv:
    - "Peres-Ussa, ”Ussas genombrott”, är namnet David gav åt platsen där Ussa dog när arken fördes från Kirjat-Jearim mot Jerusalem. Vid Nakons tröskplats, kallad Kidon i Krönikeböckerna, snavade oxarna, Ussa räckte ut sin hand för att stödja arken, och Gud slog honom: ”Men det gick David hårt till sinne att HERREN så hade brutit ned Ussa; och han kallade det ställe Peres-Ussa, såsom det heter ännu i dag.” Rädd lät David arken stå kvar i gatiten Oved-Edoms hus i tre månader."
    - "Platsen låg någonstans på vägen mellan Kirjat-Jearim och Jerusalem, men ingenting fastställer den; punkten på kartan står vid Jerusalem endast som en approximation. Den synodala bibeln översätter namnet i stället för att translitterera det, så på ryska är platsen helt enkelt ”Ussas slag”."
  nb:
    - "Peres-Ussa, «Ussas brudd», er navnet David ga stedet der Ussa døde da arken ble hentet fra Kirjat-Jearim mot Jerusalem. Ved Nakons treskeplass, kalt Kidon i Krønikebøkene, snublet oksene, Ussa rakte ut hånden for å holde arken, og Gud slo ham: «Men David blev ille til mote, fordi Herren hadde slått Ussa ned; derfor er dette sted blitt kalt Peres-Ussa like til denne dag.» Redd lot David arken stå i gittitten Obed-Edoms hus i tre måneder."
    - "Stedet lå et sted på veien mellom Kirjat-Jearim og Jerusalem, men ingenting fastlegger det; punktet på kartet står i Jerusalem bare som en tilnærming. Den synodale bibelen oversetter navnet i stedet for å translitterere det, så på russisk er stedet rett og slett «Ussas slag»."
  tl:
    - "Ang Perez-uzza, “ang pagbasag kay Uzza”, ay ang pangalang ibinigay ni David sa lugar kung saan namatay si Uzza habang dinadala ang kaban mula sa Kiriath-jearim patungong Jerusalem. Sa giikan ng Nachon, na tinatawag na Chidon sa Mga Cronica, natisod ang mga baka, iniunat ni Uzza ang kaniyang kamay upang alalayan ang kaban, at sinaktan siya ng Dios: “At hindi minagaling ni David, sapagka't nagalit ang Panginoon kay Uzza: at kaniyang tinawag ang dakong yaon na Perez-uzza hanggang sa araw na ito.” Sa takot, iniwan ni David ang kaban sa bahay ni Obed-edom na taga-Gat sa loob ng tatlong buwan."
    - "Ang lugar ay nasa isang bahagi ng daan sa pagitan ng Kiriath-jearim at Jerusalem, ngunit walang nagtatakda rito; ang punto sa mapa ay nasa Jerusalem bilang pagtatantiya lamang. Isinasalin ng Bibliyang Sinodal ang pangalan sa halip na isatitik ito, kaya sa Ruso ang lugar ay simpleng “ang pagpuksa kay Uzza”."
