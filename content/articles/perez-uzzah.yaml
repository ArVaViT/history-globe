# Overview article (ADR 0007). Mainstream facts only; the place where Uzzah died beside the ark; its site is unknown; the Synodal Bible translates the name.
id: perez-uzzah
place: ae67841
title:
  en: "Perez-uzzah"
  ru: "Поражение Озы"
  uk: "Ураження Ози"
  es: "Pérez-uza"
  pt: "Perez-Uzá"
  de: "Perez-Usa"
  fr: "Pérets-Uzza"
  it: "Perez-Uzza"
  pl: "Peres-Uzza"
  cs: "Perec-uza"
  nl: "Perez-Uzza"
  sv: "Peres-Ussa"
