body:
  en:
    - "Perez-uzzah, “the breach of Uzzah”, is the name David gave to the place where Uzzah died as the ark was being brought from Kiriath-jearim toward Jerusalem. At the threshing floor of Nachon, called Chidon in Chronicles, the oxen stumbled, Uzzah put out his hand to steady the ark, and God struck him: “And David was displeased, because the LORD had made a breach upon Uzzah: and he called the name of the place Perez-uzzah to this day.” Afraid, David left the ark in the house of Obed-edom the Gittite for three months."
    - "The place lay somewhere on the road between Kiriath-jearim and Jerusalem, but nothing fixes it; the point on the map stands at Jerusalem only as an approximation. The Synodal Bible translates the name rather than transliterating it, so in Russian the place is simply “the smiting of Uzzah”."
    - "Chronicles gives the reason later in the story. When the ark moved on from Obed-edom's house, David ruled that only the Levites might carry it, and they bore it on poles on their shoulders, as Moses had commanded. The first attempt had failed, he told them, because they had not sought the LORD in the way the law required. Numbers gives a Levite clan the task of carrying the holy things on their shoulders and forbids them to touch them on pain of death. Josephus says that Uzzah died because he touched the ark though he was not a priest, and makes Obed-edom a Levite. The Babylonian Talmud (Sotah 35a) puts the blame on David, who carried the ark on a wagon although even schoolchildren knew it belonged on men's shoulders."
  ru:
    - "«Поражение Озы», по-еврейски Перец-Узза, — имя, которое Давид дал месту, где умер Оза, когда ковчег везли из Кириаф-Иарима в Иерусалим. У гумна Нахонова, в Паралипоменоне — Хидона, волы споткнулись, Оза простёр руку, чтобы поддержать ковчег, и Бог поразил его: «И опечалился Давид, что Господь поразил Озу. И назвал то место поражением Озы; так называется оно и до сего дня». Устрашившись, Давид оставил ковчег на три месяца в доме Аведдара Гефянина."
    - "Место лежало где-то на дороге между Кириаф-Иаримом и Иерусалимом, но ничто его не определяет; точка на карте стоит у Иерусалима лишь приблизительно. Синодальный перевод передаёт имя смыслом, а не звучанием, поэтому по-русски место называется просто «Поражение Озы»."
    - "Паралипоменон объясняет причину далее в рассказе. Когда ковчег переносили из дома Аведдара, Давид повелел, чтобы носили его только левиты, и они несли его на шестах на плечах, как заповедал Моисей. Первая попытка не удалась, сказал он им, потому что они взыскали Господа не так, как требовал закон. Книга Чисел поручает одному из левитских родов носить святыни на плечах и запрещает касаться их под страхом смерти. Иосиф Флавий пишет, что Оза умер, потому что коснулся ковчега, не будучи священником, и называет Аведдара левитом. Вавилонский Талмуд (Сота 35а) возлагает вину на Давида, который повёз ковчег на колеснице, хотя даже школьники знали, что его носят на плечах."
  uk:
    - "Перец-Уза, «прорив Ози», — ім’я, яке Давид дав місцю, де помер Оза, коли ковчег везли з Кіріят-Єарима до Єрусалима. На току Нахона, у Хроніках — Хідона, воли спіткнулися, Оза простяг руку, щоб підтримати ковчег, і Бог убив його: «І зажуривсь Давид тяжко, що Господь убив Озу. Місце се називаєсь „Убиттє Ози‟ й по сей день». Злякавшись, Давид залишив ковчег у домі Овед-Едома Гіттянина на три місяці."
    - "Місце лежало десь на дорозі між Кіріят-Єаримом і Єрусалимом, але ніщо його не визначає; точка на мапі стоїть в Єрусалимі лише як наближення. Куліш передає ім’я за змістом, а не за звучанням, тож українською місце зветься просто «Убиттє Ози»."
    - "Хроніки пояснюють причину далі в розповіді. Коли ковчег переносили з дому Овед-Едома, Давид наказав, щоб його несли лише левити, і вони несли його на жердинах на плечах, як заповідав Мойсей. Перша спроба не вдалася, сказав він їм, бо вони не шукали Господа так, як вимагав закон. Книга Чисел доручає одному з левитських родів носити святині на плечах і забороняє торкатися їх під загрозою смерті. Йосиф Флавій пише, що Оза помер, бо торкнувся ковчега, не будучи священиком, і робить Овед-Едома левитом. Вавилонський Талмуд (Сота 35а) покладає провину на Давида, який повіз ковчег на возі, хоча навіть школярі знали, що його носять на плечах."
  es:
    - "Pérez-uza, «la rotura de Uza», es el nombre que David dio al lugar donde murió Uza cuando el arca era llevada desde Quiriat-jearim hacia Jerusalén. En la era de Nacón, llamada Quidón en Crónicas, los bueyes tropezaron, Uza extendió la mano para sujetar el arca, y Dios lo hirió: «Y David tuvo pesar, porque Jehová había hecho rotura en Uzza; por lo que llamó aquel lugar Pérez-uzza, hasta hoy». Temeroso, David dejó el arca en casa de Obed-edom el geteo durante tres meses."
    - "El lugar estaba en algún punto del camino entre Quiriat-jearim y Jerusalén, pero nada lo fija; el punto del mapa está en Jerusalén solo como aproximación. La Biblia sinodal traduce el nombre en lugar de transliterarlo, de modo que en ruso el lugar es simplemente «el golpe de Uza»."
    - "Crónicas da la razón más adelante en el relato. Cuando el arca salió de la casa de Obed-edom, David dispuso que solo los levitas la llevaran, y la cargaron sobre sus hombros con las varas, como había mandado Moisés. El primer intento había fracasado, les dijo, porque no habían buscado a Jehová como la ley mandaba. Números encarga a un clan levita llevar las cosas santas sobre los hombros y le prohíbe tocarlas bajo pena de muerte. Josefo dice que Uza murió porque tocó el arca sin ser sacerdote, y hace de Obed-edom un levita. El Talmud de Babilonia (Sotah 35a) culpa a David, que llevó el arca en un carro aunque hasta los escolares sabían que debía ir sobre los hombros."
  pt:
    - "Perez-Uzá, “a ruptura de Uzá”, é o nome que Davi deu ao lugar onde Uzá morreu quando a arca era levada de Quiriate-Jearim para Jerusalém. Na eira de Nacom, chamada Quidom em Crônicas, os bois tropeçaram, Uzá estendeu a mão para firmar a arca, e Deus o feriu: “Davi ficou desgostoso porque o SENHOR havia irrompido contra Uzá; e ele chamou aquele lugar de Perez-Uzá até o dia de hoje.” Com medo, Davi deixou a arca na casa de Obede-Edom, o geteu, por três meses."
    - "O lugar ficava em algum ponto da estrada entre Quiriate-Jearim e Jerusalém, mas nada o fixa; o ponto no mapa está em Jerusalém apenas como aproximação. A Bíblia Sinodal traduz o nome em vez de transliterá-lo, de modo que em russo o lugar é simplesmente “o golpe de Uzá”."
    - "Crônicas dá a razão mais adiante na narrativa. Quando a arca partiu da casa de Obede-Edom, Davi ordenou que só os levitas a carregassem, e eles a levaram aos ombros com as varas, como Moisés havia ordenado. A primeira tentativa havia falhado, disse-lhes, porque não tinham buscado o SENHOR como a lei exigia. Números confia a um clã levita o transporte das coisas santas aos ombros e o proíbe de tocá-las sob pena de morte. Josefo diz que Uzá morreu porque tocou a arca sem ser sacerdote, e faz de Obede-Edom um levita. O Talmude Babilônico (Sotah 35a) culpa Davi, que levou a arca num carro, embora até as crianças da escola soubessem que ela devia ser levada aos ombros."
  de:
    - "Perez-Usa, „der Einbruch Usas“, ist der Name, den David dem Ort gab, wo Usa starb, als die Lade von Kirjat-Jearim nach Jerusalem gebracht wurde. An der Tenne Nachons, in der Chronik Chidon genannt, scheuten die Rinder, Usa streckte die Hand aus, um die Lade zu halten, und Gott schlug ihn: „Da ward David betrübt, daß der HERR den Usa so wegriß, und man hieß die Stätte Perez-Usa bis auf diesen Tag.“ Aus Furcht ließ David die Lade drei Monate im Haus Obed-Edoms, des Gathiters."
    - "Der Ort lag irgendwo an der Straße zwischen Kirjat-Jearim und Jerusalem, doch nichts legt ihn fest; der Punkt auf der Karte steht nur näherungsweise in Jerusalem. Die russische Synodalübersetzung übersetzt den Namen, statt ihn zu transkribieren, sodass der Ort auf Russisch schlicht „der Schlag über Usa“ heißt."
    - "Die Chronik nennt den Grund später in der Erzählung. Als die Lade aus dem Haus Obed-Edoms weitergebracht wurde, bestimmte David, dass nur die Leviten sie tragen durften, und sie trugen sie mit den Stangen auf ihren Schultern, wie Mose geboten hatte. Der erste Versuch sei gescheitert, sagte er ihnen, weil sie den HERRN nicht gesucht hatten, wie das Gesetz es verlangte. Das Buch Numeri überträgt einer levitischen Sippe das Tragen der heiligen Dinge auf den Schultern und verbietet ihr bei Todesstrafe, sie zu berühren. Josephus schreibt, Usa sei gestorben, weil er die Lade berührte, obwohl er kein Priester war, und macht Obed-Edom zum Leviten. Der Babylonische Talmud (Sota 35a) gibt David die Schuld, der die Lade auf einem Wagen fuhr, obwohl schon Schulkinder wussten, dass sie auf den Schultern zu tragen war."
  fr:
    - "Pérets-Uzza, « brèche d’Uzza », est le nom que David donna au lieu où Uzza mourut pendant que l’arche était amenée de Kirjath-Jearim vers Jérusalem. À l’aire de Nacon, appelée Kidon dans les Chroniques, les bœufs la firent pencher, Uzza étendit la main pour retenir l’arche, et Dieu le frappa : « David fut irrité de ce que l’Éternel avait frappé Uzza d’un tel châtiment. Et ce lieu a été appelé jusqu’à ce jour Pérets-Uzza. » Pris de crainte, David laissa l’arche trois mois dans la maison d’Obed-Édom de Gath."
    - "Le lieu se trouvait quelque part sur la route entre Kirjath-Jearim et Jérusalem, mais rien ne le fixe ; le point de la carte est à Jérusalem seulement à titre d’approximation. La Bible synodale russe traduit le nom au lieu de le transcrire : en russe, le lieu s’appelle simplement « le coup porté à Uzza » (Louis Segond le transcrit : Pérets-Uzza)."
    - "Les Chroniques donnent la raison plus loin dans le récit. Quand l’arche quitta la maison d’Obed-Édom, David ordonna que seuls les Lévites la portent, et ils la portèrent sur leurs épaules avec les barres, comme Moïse l’avait prescrit. La première tentative avait échoué, leur dit-il, parce qu’ils n’avaient pas cherché l’Éternel selon la loi. Le livre des Nombres confie à un clan lévitique le transport des choses saintes sur les épaules et lui interdit de les toucher sous peine de mort. Josèphe dit qu’Uzza mourut pour avoir touché l’arche sans être prêtre, et fait d’Obed-Édom un Lévite. Le Talmud de Babylone (Sota 35a) rejette la faute sur David, qui transporta l’arche sur un char alors que même les écoliers savaient qu’elle se portait sur les épaules."
  it:
    - "Perez-Uzza, «la breccia di Uzza», è il nome che Davide diede al luogo in cui Uzza morì mentre l’arca veniva portata da Kiriat-Iearim verso Gerusalemme. All’aia di Nacon, chiamata Kidon nelle Cronache, i buoi inciamparono, Uzza stese la mano per sostenere l’arca, e Dio lo colpì: «Davide si attristò perché l’Eterno avea fatto una breccia nel popolo, colpendo Uzza; e quel luogo è stato chiamato Perets-Uzza fino al dì d’oggi.» Spaventato, Davide lasciò l’arca in casa di Obed-Edom di Gat per tre mesi."
    - "Il luogo si trovava da qualche parte sulla strada tra Kiriat-Iearim e Gerusalemme, ma nulla lo fissa; il punto sulla mappa sta a Gerusalemme solo come approssimazione. La Bibbia sinodale traduce il nome anziché traslitterarlo, per cui in russo il luogo è semplicemente «la percossa di Uzza»."
    - "Le Cronache danno la ragione più avanti nel racconto. Quando l’arca ripartì dalla casa di Obed-Edom, Davide stabilì che solo i leviti la portassero, ed essi la portarono sulle spalle con le stanghe, come aveva ordinato Mosè. Il primo tentativo era fallito, disse loro, perché non avevano cercato l’Eterno come la legge richiedeva. Il libro dei Numeri affida a un clan levitico il trasporto delle cose sante sulle spalle e gli vieta di toccarle, pena la morte. Giuseppe Flavio dice che Uzza morì perché toccò l’arca senza essere sacerdote, e fa di Obed-Edom un levita. Il Talmud babilonese (Sotah 35a) dà la colpa a Davide, che trasportò l’arca su un carro benché perfino gli scolari sapessero che andava portata sulle spalle."
  pl:
    - "Peres-Uzza, „rozerwanie Uzzy”, to nazwa, jaką Dawid nadał miejscu, gdzie zginął Uzza, gdy niesiono arkę z Kiriat-Jearim ku Jerozolimie. Na klepisku Nakona, w Kronikach zwanym Kidon, woły się potknęły, Uzza wyciągnął rękę, by przytrzymać arkę, i Bóg go uderzył: „I zafrasował się Dawid, że Pan srodze zaraził Ozę, i nazwał miejsce ono Perezoza, aż do dnia tego”. Przestraszony Dawid zostawił arkę w domu Obed-Edoma z Gat na trzy miesiące."
    - "Miejsce leżało gdzieś przy drodze między Kiriat-Jearim a Jerozolimą, lecz nic go nie określa; punkt na mapie stoi w Jerozolimie tylko jako przybliżenie. Biblia synodalna tłumaczy nazwę zamiast ją transliterować, więc po rosyjsku miejsce to jest po prostu „porażeniem Uzzy”."
    - "Kroniki podają przyczynę dalej w opowieści. Gdy arkę przenoszono z domu Obed-Edoma, Dawid postanowił, że nosić ją mogą tylko lewici, i nieśli ją na drążkach na ramionach, jak nakazał Mojżesz. Pierwsza próba się nie powiodła, powiedział im, bo nie szukali Pana tak, jak wymagało prawo. Księga Liczb powierza jednemu z rodów lewickich noszenie rzeczy świętych na ramionach i zakazuje ich dotykać pod karą śmierci. Józef Flawiusz pisze, że Uzza zginął, bo dotknął arki, choć nie był kapłanem, i czyni Obed-Edoma lewitą. Talmud babiloński (Sota 35a) obarcza winą Dawida, który wiózł arkę na wozie, choć nawet uczniowie w szkole wiedzieli, że należy ją nosić na ramionach."
  cs:
    - "Perec-uza, „proražení Uzovo“, je jméno, které David dal místu, kde zemřel Uza, když se truhla vezla z Kirjat-jearímu k Jeruzalému. Na humně Nákonově, v Kronikách zvaném Kídonovo, se voli zapotácili, Uza vztáhl ruku, aby truhlu přidržel, a Bůh ho udeřil: „Tedy zkormoutil se David, proto že se Hospodin tak přísně obořil na Uzu. I nazváno to místo Peres Uza až do tohoto dne.“ Vyděšený David nechal truhlu v domě Obed-edoma Gatského na tři měsíce."
    - "Místo leželo někde na cestě mezi Kirjat-jearímem a Jeruzalémem, ale nic jej neurčuje; bod na mapě stojí v Jeruzalémě jen jako přiblížení. Synodální Bible jméno překládá místo přepisu, takže v ruštině je místo prostě „Uzovo poražení“."
    - "Kroniky uvádějí důvod dále ve vyprávění. Když truhlu odnášeli z domu Obed-edomova, David nařídil, aby ji nosili jen levité, a ti ji nesli na tyčích na ramenou, jak přikázal Mojžíš. První pokus se nezdařil, řekl jim, protože nehledali Hospodina tak, jak žádal zákon. Kniha Numeri svěřuje jednomu levitskému rodu nošení svatých věcí na ramenou a zakazuje mu dotýkat se jich pod trestem smrti. Josephus píše, že Uza zemřel, protože se dotkl truhly, ač nebyl kněz, a dělá z Obed-edoma levitu. Babylonský talmud (Sota 35a) přičítá vinu Davidovi, který vezl truhlu na voze, ačkoli i školáci věděli, že se nosí na ramenou."
  nl:
    - "Perez-Uzza, “de breuk van Uzza”, is de naam die David gaf aan de plaats waar Uzza stierf toen de ark van Kirjat-Jearim naar Jeruzalem werd gebracht. Bij de dorsvloer van Nachon, in Kronieken Kidon genoemd, struikelden de ossen, stak Uzza zijn hand uit om de ark te steunen, en God trof hem: “En David ontstak, omdat de HEERE een scheur gescheurd had aan Uza; en hij noemde dezelve plaats Perez-Uza, tot op dezen dag.” Bang liet David de ark drie maanden in het huis van Obed-Edom de Gatiet."
    - "De plaats lag ergens aan de weg tussen Kirjat-Jearim en Jeruzalem, maar niets legt haar vast; het punt op de kaart staat bij Jeruzalem slechts bij benadering. De Synodale Bijbel vertaalt de naam in plaats van hem te transcriberen, zodat de plaats in het Russisch eenvoudig “het neerslaan van Uzza” heet."
    - "Kronieken geeft de reden verderop in het verhaal. Toen de ark uit het huis van Obed-Edom verder werd gebracht, bepaalde David dat alleen de Levieten haar mochten dragen, en zij droegen haar met de draagstokken op hun schouders, zoals Mozes had geboden. De eerste poging was mislukt, zei hij hun, omdat zij de HEERE niet hadden gezocht zoals de wet het vroeg. Numeri geeft een Levitische familie de taak de heilige dingen op de schouders te dragen en verbiedt haar ze aan te raken op straffe van de dood. Josephus zegt dat Uzza stierf omdat hij de ark aanraakte terwijl hij geen priester was, en maakt van Obed-Edom een Leviet. De Babylonische Talmoed (Sota 35a) legt de schuld bij David, die de ark op een wagen vervoerde, hoewel zelfs schoolkinderen wisten dat zij op de schouders gedragen moest worden."
  sv:
    - "Peres-Ussa, ”Ussas bräsch”, är namnet David gav åt platsen där Ussa dog när arken fördes från Kirjat-Jearim mot Jerusalem. Vid Nakons tröskplats, kallad Kidon i Krönikeböckerna, snavade oxarna, Ussa räckte ut sin hand för att stödja arken, och Gud slog honom: ”Men det gick David hårt till sinne att HERREN så hade brutit ned Ussa; och han kallade det ställe Peres-Ussa, såsom det heter ännu i dag.” Rädd lät David arken stå kvar i gatiten Oved-Edoms hus i tre månader."
    - "Platsen låg någonstans på vägen mellan Kirjat-Jearim och Jerusalem, men ingenting fastställer den; punkten på kartan står vid Jerusalem endast som en approximation. Den synodala bibeln översätter namnet i stället för att translitterera det, så på ryska är platsen helt enkelt ”slaget mot Ussa”."
    - "Krönikeböckerna ger skälet längre fram i berättelsen. När arken fördes vidare från Oved-Edoms hus bestämde David att endast leviterna fick bära den, och de bar den på sina axlar med stängerna, så som Mose hade befallt. Det första försöket hade misslyckats, sade han till dem, eftersom de inte hade sökt HERREN så som lagen krävde. Fjärde Moseboken ger en levitisk släkt uppgiften att bära de heliga föremålen på axlarna och förbjuder den att röra vid dem vid dödsstraff. Josefus säger att Ussa dog därför att han rörde vid arken fast han inte var präst, och gör Oved-Edom till levit. Den babyloniska Talmud (Sotah 35a) lägger skulden på David, som förde arken på en vagn fast till och med skolbarn visste att den skulle bäras på axlarna."
  nb:
    - "Peres-Ussa, «Ussas brudd», er navnet David ga stedet der Ussa døde da arken ble hentet fra Kirjat-Jearim mot Jerusalem. Ved Nakons treskeplass, kalt Kidon i Krønikebøkene, snublet oksene, Ussa rakte ut hånden for å holde arken, og Gud slo ham: «Men David blev ille til mote, fordi Herren hadde slått Ussa ned; derfor er dette sted blitt kalt Peres-Ussa like til denne dag.» Redd lot David arken stå i gittitten Obed-Edoms hus i tre måneder."
    - "Stedet lå et sted på veien mellom Kirjat-Jearim og Jerusalem, men ingenting fastlegger det; punktet på kartet står i Jerusalem bare som en tilnærming. Den synodale bibelen oversetter navnet i stedet for å translitterere det, så på russisk er stedet rett og slett «Ussas slag»."
    - "Krønikebøkene gir grunnen senere i fortellingen. Da arken ble ført videre fra Obed-Edoms hus, bestemte David at bare levittene fikk bære den, og de bar den på skuldrene med stengene, slik Moses hadde befalt. Det første forsøket hadde slått feil, sa han til dem, fordi de ikke hadde søkt Herren slik loven krevde. Fjerde Mosebok gir en levittisk slekt oppgaven å bære de hellige tingene på skuldrene og forbyr den å røre ved dem under trussel om døden. Josefus sier at Ussa døde fordi han rørte ved arken uten å være prest, og gjør Obed-Edom til levitt. Den babylonske Talmud (Sota 35a) legger skylden på David, som fraktet arken på en vogn, selv om til og med skolebarn visste at den skulle bæres på skuldrene."
  tl:
    - "Ang Perez-uzza, “ang pagbasag kay Uzza”, ay ang pangalang ibinigay ni David sa lugar kung saan namatay si Uzza habang dinadala ang kaban mula sa Kiriath-jearim patungong Jerusalem. Sa giikan ng Nachon, na tinatawag na Chidon sa Mga Cronica, natisod ang mga baka, iniunat ni Uzza ang kaniyang kamay upang alalayan ang kaban, at sinaktan siya ng Dios: “At hindi minagaling ni David, sapagka't nagalit ang Panginoon kay Uzza: at kaniyang tinawag ang dakong yaon na Perez-uzza hanggang sa araw na ito.” Sa takot, iniwan ni David ang kaban sa bahay ni Obed-edom na taga-Gat sa loob ng tatlong buwan."
    - "Ang lugar ay nasa isang bahagi ng daan sa pagitan ng Kiriath-jearim at Jerusalem, ngunit walang nagtatakda rito; ang punto sa mapa ay nasa Jerusalem bilang pagtatantiya lamang. Isinasalin ng Bibliyang Sinodal ang pangalan sa halip na isatitik ito, kaya sa Ruso ang lugar ay simpleng “ang pagpuksa kay Uzza”."
    - "Ibinibigay ng Mga Cronica ang dahilan sa kalaunan ng salaysay. Nang ilipat ang kaban mula sa bahay ni Obed-edom, ipinag-utos ni David na mga Levita lamang ang magdadala nito, at pinasan nila ito sa kanilang mga balikat sa pamamagitan ng mga pingga, gaya ng iniutos ni Moises. Nabigo ang unang pagtatangka, sabi niya sa kanila, sapagkat hindi nila hinanap ang Panginoon ayon sa hinihingi ng kautusan. Iniaatas ng Mga Bilang sa isang angkan ng mga Levita ang pagpasan ng mga banal na bagay sa balikat at ipinagbabawal na hipuin ang mga ito, sa parusang kamatayan. Sinasabi ni Josefo na namatay si Uzza dahil hinipo niya ang kaban gayong hindi siya saserdote, at ginagawa niyang Levita si Obed-edom. Isinisisi ng Talmud ng Babilonia (Sotah 35a) ang pagkakamali kay David, na nagdala ng kaban sa isang kariton bagaman alam kahit ng mga batang mag-aaral na dapat itong pasanin sa balikat."
  da:
    - "Peres-Uzza, »Uzzas brud«, er det navn, David gav stedet, hvor Uzza døde, mens arken blev ført fra Kirjat-Jearim mod Jerusalem. På Nakons tærskeplads, kaldet Kidon i Krønikebøgerne, snublede oksene, Uzza rakte hånden ud for at støtte arken, og Gud slog ham: »Da blev David ilde tilfreds, fordi Herren havde gjort et Skaar paa Ussa, og man kaldte det Sted Perez-Ussa indtil denne Dag.« Bange lod David arken blive i gatitten Obed-Edoms hus i tre måneder."
    - "Stedet lå et sted på vejen mellem Kirjat-Jearim og Jerusalem, men intet fastlægger det; kortets punkt står i Jerusalem kun som en tilnærmelse. Den synodale bibel oversætter navnet i stedet for at translitterere det, så på russisk er stedet blot »slaget mod Uzza«."
    - "Krønikebøgerne giver grunden senere i fortællingen. Da arken blev ført videre fra Obed-Edoms hus, bestemte David, at kun levitterne måtte bære den, og de bar den på skuldrene med stængerne, som Moses havde befalet. Det første forsøg var slået fejl, sagde han til dem, fordi de ikke havde søgt Herren, som loven krævede. Fjerde Mosebog giver en levitisk slægt opgaven at bære de hellige ting på skuldrene og forbyder den at røre ved dem under dødsstraf. Josefus siger, at Uzza døde, fordi han rørte ved arken uden at være præst, og gør Obed-Edom til levit. Den babyloniske Talmud (Sotah 35a) lægger skylden på David, som kørte arken på en vogn, skønt selv skolebørn vidste, at den skulle bæres på skuldrene."
  sr:
    - "Фарес-Уза, „пробој Узин“, име је које је Давид дао месту где је Уза умро док се ковчег преносио из Киријат-Јарима према Јерусалиму. На гумну Нахоновом, у Летописима званом Хидон, волови су потегли на страну, Уза је пружио руку да придржи ковчег, и Бог га је ударио: „И ожалости се Давид што Господ уби Узу. Зато се прозва оно место Фарес-Уза до данас.“ Уплашен, Давид је оставио ковчег у кући Овид-Едома Гетејина на три месеца."
    - "Место је лежало негде на путу између Киријат-Јарима и Јерусалима, али ништа га не одређује; тачка на карти стоји у Јерусалиму само као приближност. Синодална библија име преводи уместо да га транслитерује, па је на руском место једноставно „удар Узин“."
    - "Летописи наводе разлог касније у причи. Када је ковчег пренет из куће Овид-Едомове, Давид је одредио да га носе само левити, и они су га носили на моткама на раменима, како је заповедио Мојсије. Први покушај није успео, рекао им је, јер нису тражили Господа онако како закон захтева. Књига бројева поверава једном левитском роду ношење светиња на раменима и забрањује му да их дотиче под претњом смрти. Јосиф Флавије пише да је Уза умро зато што је дотакао ковчег иако није био свештеник, и чини Овид-Едома левитом. Вавилонски Талмуд (Сота 35а) кривицу приписује Давиду, који је ковчег возио на колима, иако су и деца у школи знала да се носи на раменима."
  hu:
    - "Pérec-Uzza, „Uzzá törése”, annak a helynek a neve, amelyet Dávid adott ott, ahol Uzzá meghalt, amikor a ládát Kirját-Jeárimból Jeruzsálem felé hozták. Nákon, a Krónikákban Kidon szérűjénél az ökrök megbotlottak, Uzzá kinyújtotta kezét, hogy megtámassza a ládát, és Isten lesújtott rá: „És bosszankodék Dávid, hogy az Úr ilyen romlással rontotta meg Uzzát, és nevezé azt a helyet Péres Uzzának, mind e mai napig.” Megrettenve Dávid a ládát a gáti Obed-Edóm házában hagyta három hónapra."
    - "A hely valahol a Kirját-Jeárim és Jeruzsálem közötti úton feküdt, de semmi sem rögzíti; a térképen lévő pont Jeruzsálemnél csak megközelítés. A Szinodális Biblia lefordítja a nevet ahelyett, hogy átírná, így oroszul a hely egyszerűen „Uzzá lesújtása”."
    - "A Krónikák később adják meg az okot. Amikor a ládát továbbvitték Obed-Edóm házából, Dávid elrendelte, hogy csak a léviták vihetik, és azok rudakon, vállukon vitték, ahogyan Mózes megparancsolta. Az első kísérlet azért vallott kudarcot, mondta nekik, mert nem úgy keresték az Urat, ahogyan a törvény előírta. Mózes negyedik könyve egy lévita nemzetségre bízza a szent tárgyak vállon való hordozását, és halálbüntetés terhe mellett megtiltja, hogy hozzájuk érjenek. Josephus szerint Uzzá azért halt meg, mert megérintette a ládát, noha nem volt pap, és Obed-Edómot lévitának mondja. A Babilóniai Talmud (Szota 35a) Dávidot hibáztatja, aki szekéren vitette a ládát, holott még az iskolás gyerekek is tudták, hogy vállon kell hordozni."
  fi:
    - "Peres-Ussa, ”Ussan murtuma”, on nimi, jonka Daavid antoi paikalle, jossa Ussa kuoli, kun arkkia tuotiin Kirjat-Jearimista kohti Jerusalemia. Naakonin puimatantereella, jota Aikakirjoissa kutsutaan Kiidoniksi, härät kompastuivat, Ussa ojensi kätensä tukeakseen arkkia, ja Jumala löi hänet: ”Mutta Daavid pahastui siitä, että Herra niin oli murtanut Ussan. Siitä se paikka sai nimekseen Peres-Ussa, aina tähän päivään saakka.” Peloissaan Daavid jätti arkin gatilaisen Obed-Edomin taloon kolmeksi kuukaudeksi."
    - "Paikka sijaitsi jossakin Kirjat-Jearimin ja Jerusalemin välisellä tiellä, mutta mikään ei sitä määritä; kartan piste on Jerusalemissa vain likiarvona. Synodaalikäännös kääntää nimen eikä translitteroi sitä, joten venäjäksi paikka on yksinkertaisesti ”Ussan lyöminen”."
    - "Aikakirjat kertovat syyn myöhemmin. Kun arkki vietiin eteenpäin Obed-Edomin talosta, Daavid määräsi, että vain leeviläiset saivat kantaa sitä, ja he kantoivat sitä olallaan korennoilla, niin kuin Mooses oli käskenyt. Ensimmäinen yritys oli epäonnistunut, hän sanoi heille, koska he eivät olleet etsineet Herraa lain vaatimalla tavalla. Neljäs Mooseksen kirja antaa yhdelle leeviläissuvulle tehtäväksi kantaa pyhiä esineitä olallaan ja kieltää sitä kuoleman uhalla koskemasta niihin. Josefus sanoo, että Ussa kuoli, koska kosketti arkkia olematta pappi, ja tekee Obed-Edomista leeviläisen. Babylonialainen talmud (Sota 35a) syyttää Daavidia, joka kuljetti arkkia vaunuilla, vaikka koululaisetkin tiesivät, että sitä oli kannettava olalla."
  vi:
    - "Phê-rết-U-xa, “chỗ vỡ của U-xa”, là tên Đa-vít đặt cho nơi U-xa chết khi hòm giao ước đang được đưa từ Ki-ri-át-Giê-a-rim về hướng Giê-ru-sa-lem. Tại sân đạp lúa của Na-côn, trong sách Sử Ký gọi là Ki-đôn, những con bò vấp ngã, U-xa giơ tay đỡ hòm, và Đức Chúa Trời đánh ông: “Đa-vít lấy làm buồn thảm, vì Đức Giê-hô-va đã hành hại U-xa, và người ta gọi chỗ ấy là Hành hại U-xa cho đến ngày nay.” Sợ hãi, Đa-vít để hòm trong nhà Ô-bết-Ê-đôm người Gát ba tháng."
    - "Nơi này nằm đâu đó trên con đường giữa Ki-ri-át-Giê-a-rim và Giê-ru-sa-lem, nhưng không có gì xác định nó; điểm trên bản đồ đặt ở Giê-ru-sa-lem chỉ là phỏng chừng. Bản Synodal dịch tên thay vì phiên âm, nên trong tiếng Nga nơi này đơn giản là “sự đánh U-xa”."
    - "Sách Sử Ký nêu lý do ở đoạn sau của câu chuyện. Khi hòm được đưa đi từ nhà Ô-bết-Ê-đôm, Đa-vít truyền rằng chỉ người Lê-vi được khiêng hòm, và họ khiêng hòm trên vai bằng đòn, như Môi-se đã truyền. Ông nói với họ rằng lần đầu thất bại vì họ đã không tìm cầu Đức Giê-hô-va theo đúng luật. Sách Dân Số Ký giao cho một gia tộc Lê-vi việc khiêng các vật thánh trên vai và cấm họ chạm vào các vật ấy, với hình phạt là cái chết. Josephus nói U-xa chết vì đã chạm vào hòm dù không phải là thầy tế lễ, và cho Ô-bết-Ê-đôm là người Lê-vi. Talmud Ba-by-lôn (Sotah 35a) quy lỗi cho Đa-vít, vì ông đã chở hòm trên xe, dù ngay cả trẻ em đi học cũng biết hòm phải được khiêng trên vai."
  ro:
    - "Pereț-Uza, „spărtura lui Uza”, este numele pe care David l-a dat locului unde a murit Uza când chivotul era adus de la Chiriat-Iearim spre Ierusalim. La aria lui Nachon, numită Chidon în Cronici, boii s-au poticnit, Uza a întins mâna ca să sprijine chivotul, iar Dumnezeu l-a lovit: „Și s’a mâhnit David pentrucă au tăiat domnul pre Oza, și s’a chemat locul acela tăierea lui Oza, până în ziua aceasta.” Înspăimântat, David a lăsat chivotul în casa lui Obed-Edom ghititul pentru trei luni."
    - "Locul se afla undeva pe drumul dintre Chiriat-Iearim și Ierusalim, dar nimic nu îl fixează; punctul de pe hartă stă la Ierusalim doar ca aproximare. Biblia sinodală traduce numele în loc să-l transcrie, așa că în rusă locul este pur și simplu „lovirea lui Uza”."
    - "Cronicile dau motivul mai departe în relatare. Când chivotul a fost dus mai departe din casa lui Obed-Edom, David a hotărât ca numai leviții să-l poarte, iar ei l-au purtat pe umeri cu drugii, cum poruncise Moise. Prima încercare eșuase, le-a spus el, pentru că nu-l căutaseră pe Domnul așa cum cerea legea. Cartea Numeri încredințează unui neam levitic purtarea lucrurilor sfinte pe umeri și îi interzice să le atingă, sub pedeapsa morții. Iosif Flaviu spune că Uza a murit pentru că a atins chivotul fără să fie preot și face din Obed-Edom un levit. Talmudul babilonian (Sotah 35a) pune vina pe David, care a dus chivotul într-un car, deși până și școlarii știau că trebuie purtat pe umeri."
  bg:
    - "Перец-Уза, „поражението на Уза“, е името, което Давид дал на мястото, където Уза умрял, докато ковчегът бил пренасян от Кириат-Ярим към Йерусалим. При гумното на Нахон, наричан в Летописи Хидон, воловете се препънали, Уза протегнал ръка да придържи ковчега и Бог го поразил: „И оскърби се Давид че Господ направи поражения на Оза; и нарече името на мястото Фарез-Оза, дори до този ден.“ Уплашен, Давид оставил ковчега в дома на Овед-Едом Гетеца за три месеца."
    - "Мястото се намирало някъде по пътя между Кириат-Ярим и Йерусалим, но нищо не го установява; точката на картата стои в Йерусалим само като приблизително обозначение. Синодалната Библия превежда името, вместо да го транслитерира, така че на руски мястото е просто „поражението на Оза“."
    - "Летописи посочват причината по-нататък в разказа. Когато ковчегът бил пренесен от дома на Овед-Едом, Давид наредил да го носят само левитите, и те го носели на прътове на раменете си, както бил заповядал Мойсей. Първият опит се провалил, казал им той, защото не потърсили Господа така, както изисквал законът. Книга Числа възлага на един левитски род да носи светите неща на раменете си и му забранява да ги докосва под страх от смърт. Йосиф Флавий пише, че Уза умрял, защото докоснал ковчега, без да е свещеник, и прави Овед-Едом левит. Вавилонският Талмуд (Сота 35а) хвърля вината върху Давид, който возил ковчега на колесница, макар че и учениците знаели, че той се носи на рамене."
