body:
  en:
    - "Melita is the island of Malta, in the open sea less than a hundred kilometres south of Sicily. Farmers came over from Sicily in the Neolithic age, and between about 3600 and 2500 BC their descendants raised the great stone temples of Ġgantija, Ħaġar Qim, Mnajdra and Tarxien. Phoenicians later settled the island; Diodorus calls it a Phoenician colony with many harbours and weavers of fine linen. It came under Carthage, and two marble pillars of the second century BC, dedicated to Melqart of Tyre in Phoenician and Greek, later gave scholars the key to the Phoenician alphabet."
    - "In 218 BC, at the start of the Second Punic War, the Carthaginian garrison surrendered the island to the Roman consul Tiberius Sempronius, and Malta was joined to the province of Sicily. Its main town, also called Melita, stood where Mdina and Rabat stand today. Cicero accuses the governor Verres of stripping its ancient temple of Juno, which pirates and enemy fleets had always spared."
    - 'Paul, sailing to Rome as a prisoner, was caught off Crete by the wind Euroclydon and "driven up and down in Adria" for fourteen nights before the ship ran aground and broke up; all on board reached land. The islanders "shewed us no little kindness", and a viper fastened on Paul''s hand without harming him. Publius, "the chief man of the island", lodged them for three days, and Paul healed his father and other sick people. After three months they sailed on in a ship of Alexandria that had wintered there. Greek and Latin inscriptions from Malta give the same title, the "first" of the Melitans.'
    - "That Melita is Malta is the usual view. Adria then meant the open sea between Greece, Italy and Africa, not only today's Adriatic; a ship driven west from Crete by a north-easterly gale would reach Malta in about two weeks, as James Smith reckoned in 1848; and an Alexandrian ship would winter there on its way to Syracuse and Italy. Since Constantine Porphyrogenitus in the tenth century some have placed the wreck on Mljet, another Melite, in the Adriatic, and other islands have been proposed. Tradition places it at St Paul's Bay. By the fourth century Christians were buried in catacombs outside the walls of Melita."
  ru:
    - "Мелит — это остров Мальта в открытом море, менее чем в ста километрах к югу от Сицилии. Земледельцы переселились сюда с Сицилии в эпоху неолита, и около 3600–2500 гг. до н. э. их потомки возвели большие каменные храмы Джгантия, Хаджар-Ким, Мнайдра и Таршиен. Позже остров заселили финикийцы; Диодор называет его финикийской колонией со множеством гаваней и ткачами тонкого полотна. Остров перешёл под власть Карфагена, а две мраморные колонны II века до н. э., посвящённые Мелькарту Тирскому, с надписью по-финикийски и по-гречески, позднее дали учёным ключ к финикийскому алфавиту."
    - "В 218 г. до н. э., в начале Второй Пунической войны, карфагенский гарнизон сдал остров римскому консулу Тиберию Семпронию, и Мальту присоединили к провинции Сицилия. Её главный город, тоже называвшийся Мелитой, стоял там, где сегодня Мдина и Рабат. Цицерон обвиняет наместника Верреса в том, что тот ограбил здешний древний храм Юноны, который всегда щадили и пираты, и вражеские флоты."
    - "Павел, которого везли узником в Рим, у Крита попал в бурю от ветра эвроклидона; четырнадцать ночей, как сказано в Деяниях, «мы носимы были в Адриатическом море», а затем корабль сел на мель и разбился; все спаслись на землю. Иноплеменники «оказали нам немалое человеколюбие», а ехидна повисла на руке Павла, не причинив ему вреда. Начальник острова Публий три дня принимал их у себя, и Павел исцелил его отца и других больных. Через три месяца они отплыли на александрийском корабле, зимовавшем на острове. Греческие и латинские надписи с Мальты дают тот же титул — «первый» среди мелитян."
    - "Что Мелит — это Мальта, обычная точка зрения. Адриатическим морем тогда называли всё открытое море между Грецией, Италией и Африкой, а не только нынешнюю Адриатику; корабль, гонимый от Крита на запад северо-восточной бурей, дошёл бы до Мальты примерно за две недели, как рассчитал в 1848 г. Джеймс Смит; и александрийский корабль вполне мог зимовать здесь по пути в Сиракузы и Италию. Со времён Константина Багрянородного, с X века, некоторые помещают кораблекрушение на Млет, другой остров Мелита в Адриатике, предлагались и другие острова. Предание указывает на залив Святого Павла. К IV веку христиан хоронили в катакомбах за стенами Мелиты."
  uk:
    - "Мелита — це острів Мальта, у відкритому морі менш ніж за сто кілометрів на південь від Сицилії. Землероби переселилися із Сицилії в неоліті, і приблизно між 3600 і 2500 рр. до н. е. їхні нащадки спорудили великі кам’яні храми Джгантії, Хаджар-Хіма, Мнайдри й Тарксієна. Пізніше на острові оселилися фінікійці; Діодор називає його фінікійською колонією з багатьма гаванями й ткачами тонкого полотна. Він перейшов під владу Карфагена, і два мармурові стовпи II ст. до н. е., присвячені Мелькарту Тирському фінікійською та грецькою мовами, пізніше дали вченим ключ до фінікійської абетки."
    - "У 218 р. до н. е., на початку Другої Пунічної війни, карфагенський гарнізон здав острів римському консулові Тиберію Семпронію, і Мальту було приєднано до провінції Сицилія. Її головне місто, також зване Мелита, стояло там, де сьогодні стоять Мдіна й Рабат. Цицерон обвинувачує намісника Верреса в пограбуванні її давнього храму Юнони, який пірати й ворожі флоти завжди щадили."
    - "Павла, що плив до Риму як в’язень, застав біля Криту вітер Євроклидон, і «носило нас по Адриятицькому морю» чотирнадцять ночей, поки корабель не сів на мілину й не розбився; усі, хто був на борту, дісталися землі. Остров’яни «показали нам не мале милосердє», а гадюка вчепилася Павлові в руку, не заподіявши йому шкоди. Публій, «першого на острові», приймав їх три дні, і Павло оздоровив його батька й інших хворих. Через три місяці вони відплили далі на александрійському кораблі, що зимував там. Грецькі й латинські написи з Мальти дають той самий титул — «перший» серед мелітян."
    - "Що Мелита — це Мальта, є звичайним поглядом. Адрія тоді означала відкрите море між Грецією, Італією та Африкою, а не лише сьогоднішній Адріатичний басейн; корабель, відігнаний на захід від Криту північно-східним штормом, дістався б Мальти приблизно за два тижні, як підрахував Джеймс Сміт 1848 р.; а александрійський корабель зимував би там на шляху до Сиракуз та Італії. Від Костянтина Багрянородного в X ст. дехто розміщував кораблетрощу на Млєті, іншій Меліті, в Адріатиці, і пропонували інші острови. Традиція розміщує її в затоці святого Павла. До IV ст. християн ховали в катакомбах поза стінами Мелити."
  es:
    - "Melita es la isla de Malta, en mar abierto, a menos de cien kilómetros al sur de Sicilia. Agricultores llegaron de Sicilia en el Neolítico, y entre cerca de 3600 y 2500 a. C. sus descendientes levantaron los grandes templos de piedra de Ġgantija, Ħaġar Qim, Mnajdra y Tarxien. Más tarde se establecieron en la isla los fenicios; Diodoro la llama una colonia fenicia con muchos puertos y tejedores de lino fino. Pasó a depender de Cartago, y dos pilares de mármol del siglo II a. C., dedicados a Melqart de Tiro en fenicio y en griego, dieron más tarde a los estudiosos la clave del alfabeto fenicio."
    - "En 218 a. C., al comienzo de la Segunda Guerra Púnica, la guarnición cartaginesa entregó la isla al cónsul romano Tiberio Sempronio, y Malta quedó unida a la provincia de Sicilia. Su ciudad principal, llamada también Melita, se alzaba donde hoy están Mdina y Rabat. Cicerón acusa al gobernador Verres de haber despojado su antiguo templo de Juno, que piratas y flotas enemigas siempre habían respetado."
    - "Pablo, que navegaba a Roma como prisionero, fue sorprendido frente a Creta por el viento Euroclidón, y tras catorce noches «siendo llevados por el mar Adriático», la nave encalló y se deshizo; todos los que iban a bordo llegaron a tierra. Los isleños «nos mostraron no poca humanidad», y una víbora se prendió de la mano de Pablo sin hacerle daño. Publio, «el principal de la isla», los hospedó durante tres días, y Pablo sanó a su padre y a otros enfermos. Pasados tres meses siguieron viaje en una nave de Alejandría que había invernado allí. Inscripciones griegas y latinas de Malta dan el mismo título, el «primero» de los melitenses."
    - "Que Melita sea Malta es la opinión habitual. Adria significaba entonces el mar abierto entre Grecia, Italia y África, no solo el actual Adriático; una nave arrastrada hacia el oeste desde Creta por un temporal del nordeste llegaría a Malta en unas dos semanas, como calculó James Smith en 1848; y una nave alejandrina invernaría allí en su camino a Siracusa y a Italia. Desde Constantino Porfirogéneto, en el siglo X, algunos han situado el naufragio en Mljet, otra Melite, en el Adriático, y se han propuesto otras islas. La tradición lo sitúa en la bahía de San Pablo. En el siglo IV había cristianos enterrados en catacumbas fuera de las murallas de Melita."
  pt:
    - "Melita é a ilha de Malta, em mar aberto, a menos de cem quilômetros ao sul da Sicília. Agricultores vieram da Sicília no período Neolítico, e entre cerca de 3600 e 2500 a.C. seus descendentes ergueram os grandes templos de pedra de Ġgantija, Ħaġar Qim, Mnajdra e Tarxien. Os fenícios depois se estabeleceram na ilha; Diodoro a chama de colônia fenícia com muitos portos e tecelões de linho fino. Passou ao domínio de Cartago, e dois pilares de mármore do século II a.C., dedicados a Melqart de Tiro em fenício e grego, deram depois aos estudiosos a chave do alfabeto fenício."
    - "Em 218 a.C., no início da Segunda Guerra Púnica, a guarnição cartaginesa entregou a ilha ao cônsul romano Tibério Semprônio, e Malta foi anexada à província da Sicília. Sua cidade principal, também chamada Melita, ficava onde hoje estão Mdina e Rabat. Cícero acusa o governador Verres de despojar seu antigo templo de Juno, que piratas e frotas inimigas sempre haviam poupado."
    - "Paulo, navegando para Roma como prisioneiro, foi surpreendido ao largo de Creta pelo vento Euroclidão e, por catorze noites, levado “de um lado para outro no mar Adriático”, até que o navio encalhou e se despedaçou; todos a bordo chegaram à terra. Os ilhéus “demonstraram uma bondade incomum para conosco”, e uma víbora prendeu-se à mão de Paulo sem lhe fazer mal. Públio, “o homem principal da ilha”, os hospedou por três dias, e Paulo curou seu pai e outros doentes. Depois de três meses, seguiram em um navio de Alexandria que havia passado o inverno ali. Inscrições gregas e latinas de Malta dão o mesmo título, o “primeiro” dos melitenses."
    - "Que Melita seja Malta é a opinião usual. Adria significava então o mar aberto entre a Grécia, a Itália e a África, e não apenas o atual Adriático; um navio levado para oeste desde Creta por um vendaval de nordeste chegaria a Malta em cerca de duas semanas, como calculou James Smith em 1848; e um navio alexandrino invernaria ali a caminho de Siracusa e da Itália. Desde Constantino Porfirogeneta, no século X, alguns situam o naufrágio em Mljet, outra Melite, no Adriático, e outras ilhas foram propostas. A tradição o situa na baía de São Paulo. Já no século IV cristãos eram sepultados em catacumbas fora das muralhas de Melita."
  de:
    - "Melite ist die Insel Malta, im offenen Meer weniger als hundert Kilometer südlich von Sizilien. Bauern kamen in der Jungsteinzeit von Sizilien herüber, und zwischen etwa 3600 und 2500 v. Chr. errichteten ihre Nachkommen die großen Steintempel von Ġgantija, Ħaġar Qim, Mnajdra und Tarxien. Später ließen sich Phönizier auf der Insel nieder; Diodor nennt sie eine phönizische Kolonie mit vielen Häfen und Webern feinen Leinens. Sie kam unter Karthago, und zwei Marmorsäulen des 2. Jahrhunderts v. Chr., dem Melqart von Tyrus auf Phönizisch und Griechisch geweiht, gaben den Gelehrten später den Schlüssel zum phönizischen Alphabet."
    - "218 v. Chr., zu Beginn des Zweiten Punischen Krieges, übergab die karthagische Besatzung die Insel dem römischen Konsul Tiberius Sempronius, und Malta wurde der Provinz Sizilien angeschlossen. Seine Hauptstadt, ebenfalls Melite genannt, stand dort, wo heute Mdina und Rabat stehen. Cicero wirft dem Statthalter Verres vor, den alten Tempel der Juno geplündert zu haben, den Piraten und feindliche Flotten stets verschont hatten."
    - "Paulus, als Gefangener nach Rom unterwegs, wurde vor Kreta vom Sturmwind Euroklydon ergriffen und trieb vierzehn Nächte lang „im Adria-Meer“ umher, bis das Schiff auflief und zerbrach; alle an Bord erreichten das Land. Die Inselbewohner „erzeigten uns nicht geringe Freundschaft“, und eine Otter biss sich an der Hand des Paulus fest, ohne ihm zu schaden. Publius, „der Oberste der Insel“, beherbergte sie drei Tage, und Paulus heilte seinen Vater und andere Kranke. Nach drei Monaten fuhren sie in einem alexandrinischen Schiff weiter, das dort überwintert hatte. Griechische und lateinische Inschriften aus Malta nennen denselben Titel, den „Ersten“ der Melitaner."
    - "Dass Melite Malta ist, ist die übliche Ansicht. Adria bedeutete damals das offene Meer zwischen Griechenland, Italien und Afrika, nicht nur das heutige Adriatische Meer; ein Schiff, das ein Nordoststurm von Kreta nach Westen trieb, erreichte Malta in etwa zwei Wochen, wie James Smith 1848 berechnete; und ein alexandrinisches Schiff überwinterte dort auf dem Weg nach Syrakus und Italien. Seit Konstantin Porphyrogennetos im 10. Jahrhundert haben einige den Schiffbruch auf Mljet verlegt, einem anderen Melite in der Adria, und auch andere Inseln wurden vorgeschlagen. Die Überlieferung nennt die St.-Pauls-Bucht. Im 4. Jahrhundert wurden Christen bereits in Katakomben vor den Mauern von Melite bestattet."
  fr:
    - "Mélita est l’île de Malte, en pleine mer, à moins de cent kilomètres au sud de la Sicile. Des cultivateurs vinrent de Sicile à l’époque néolithique, et entre environ 3600 et 2500 av. J.-C. leurs descendants élevèrent les grands temples de pierre de Ġgantija, Ħaġar Qim, Mnajdra et Tarxien. Les Phéniciens s’installèrent plus tard dans l’île ; Diodore en fait une colonie phénicienne aux nombreux ports et aux tisserands de fin lin. Elle passa sous Carthage, et deux piliers de marbre du IIe siècle av. J.-C., dédiés à Melqart de Tyr en phénicien et en grec, donnèrent plus tard aux savants la clé de l’alphabet phénicien."
    - "En 218 av. J.-C., au début de la deuxième guerre punique, la garnison carthaginoise livra l’île au consul romain Tibère Sempronius, et Malte fut rattachée à la province de Sicile. Sa ville principale, appelée aussi Mélita, se trouvait là où se dressent aujourd’hui Mdina et Rabat. Cicéron accuse le gouverneur Verrès d’avoir dépouillé son antique temple de Junon, que les pirates et les flottes ennemies avaient toujours épargné."
    - "Paul, naviguant vers Rome comme prisonnier, fut pris au large de la Crète par le vent Euraquilon ; la quatorzième nuit, ils étaient encore « ballottés sur l’Adriatique », avant que le navire ne s’échoue et ne se brise ; tous à bord gagnèrent la terre. Les insulaires leur témoignèrent « une bienveillance peu commune », et une vipère s’attacha à la main de Paul sans lui faire de mal. Publius, « principal personnage de l’île », les logea trois jours, et Paul guérit son père et d’autres malades. Après trois mois, ils repartirent sur un navire d’Alexandrie qui avait passé l’hiver là. Des inscriptions grecques et latines de Malte donnent le même titre, le « premier » des Mélitains."
    - "Que Mélita soit Malte est l’opinion habituelle. L’Adria désignait alors la haute mer entre la Grèce, l’Italie et l’Afrique, pas seulement l’actuelle Adriatique ; un navire poussé vers l’ouest depuis la Crète par une tempête de nord-est atteindrait Malte en deux semaines environ, comme James Smith le calcula en 1848 ; et un navire d’Alexandrie y hivernerait en route vers Syracuse et l’Italie. Depuis Constantin Porphyrogénète au Xe siècle, certains ont placé le naufrage à Mljet, autre Mélite, dans l’Adriatique, et d’autres îles ont été proposées. La tradition le situe à la baie de Saint-Paul. Dès le IVe siècle, des chrétiens étaient enterrés dans des catacombes hors des murs de Mélita."
  it:
    - "Melita è l’isola di Malta, in mare aperto a meno di cento chilometri a sud della Sicilia. Agricoltori vennero dalla Sicilia nel Neolitico, e tra il 3600 e il 2500 a.C. circa i loro discendenti innalzarono i grandi templi di pietra di Ġgantija, Ħaġar Qim, Mnajdra e Tarxien. I Fenici si stabilirono poi sull’isola; Diodoro la chiama una colonia fenicia con molti porti e tessitori di lino fine. Passò sotto Cartagine, e due colonne di marmo del II secolo a.C., dedicate a Melqart di Tiro in fenicio e in greco, diedero poi agli studiosi la chiave dell’alfabeto fenicio."
    - "Nel 218 a.C., all’inizio della seconda guerra punica, la guarnigione cartaginese consegnò l’isola al console romano Tiberio Sempronio, e Malta fu unita alla provincia di Sicilia. La sua città principale, anch’essa chiamata Melita, sorgeva dove oggi sorgono Mdina e Rabat. Cicerone accusa il governatore Verre di aver spogliato il suo antico tempio di Giunone, che i pirati e le flotte nemiche avevano sempre risparmiato."
    - "Paolo, che navigava verso Roma come prigioniero, fu sorpreso al largo di Creta dal vento Euraquilone, e con lui tutti a bordo furono «portati qua e là per l’Adriatico» per quattordici notti prima che la nave si incagliasse e si sfasciasse; tutti raggiunsero la terra. Gli isolani «usarono verso noi umanità non comune», e una vipera si attaccò alla mano di Paolo senza fargli male. Publio, «l’uomo principale dell’isola», li ospitò per tre giorni, e Paolo guarì suo padre e altri malati. Dopo tre mesi ripartirono su una nave alessandrina che vi aveva svernato. Iscrizioni greche e latine di Malta danno lo stesso titolo, il «primo» dei Melitesi."
    - "Che Melita sia Malta è l’opinione abituale. L’Adria allora indicava il mare aperto tra Grecia, Italia e Africa, non solo l’odierno Adriatico; una nave spinta a ovest da Creta da una burrasca di nord-est raggiungerebbe Malta in circa due settimane, come calcolò James Smith nel 1848; e una nave alessandrina vi svernerebbe nel viaggio verso Siracusa e l’Italia. Dai tempi di Costantino Porfirogenito, nel X secolo, alcuni hanno collocato il naufragio a Mljet, un’altra Melite, nell’Adriatico, e sono state proposte altre isole. La tradizione lo pone nella baia di San Paolo. Già nel IV secolo i cristiani erano sepolti nelle catacombe fuori le mura di Melita."
  pl:
    - "Melita to wyspa Malta, na otwartym morzu mniej niż sto kilometrów na południe od Sycylii. Rolnicy przybyli z Sycylii w neolicie, a między około 3600 a 2500 r. p.n.e. ich potomkowie wznieśli wielkie kamienne świątynie Ġgantija, Ħaġar Qim, Mnajdra i Tarxien. Fenicjanie zasiedlili później wyspę; Diodor nazywa ją kolonią fenicką z wieloma portami i tkaczami cienkiego lnu. Przeszła pod władzę Kartaginy, a dwa marmurowe słupy z II w. p.n.e., poświęcone Melkartowi z Tyru po fenicku i po grecku, dały później uczonym klucz do alfabetu fenickiego."
    - "W 218 r. p.n.e., na początku drugiej wojny punickiej, kartagińska załoga oddała wyspę rzymskiemu konsulowi Tyberiuszowi Semproniuszowi, a Malta została dołączona do prowincji Sycylii. Jej główne miasto, także zwane Melita, stało tam, gdzie dziś Mdina i Rabat. Cyceron oskarża namiestnika Werresa o ograbienie jej starożytnej świątyni Junony, którą piraci i floty wroga zawsze oszczędzali."
    - "Paweł, płynąc jako więzień do Rzymu, został pochwycony koło Krety przez wiatr Euroklidon i przez czternaście nocy, gdy „myśmy się błąkali po morzu Adryjatyckiem”, aż okręt osiadł na mieliźnie i się rozbił; wszyscy na pokładzie dotarli do lądu. „On gruby lud pokazał nam nie lada ludzkość”, a żmija przypięła się do ręki Pawła, nie czyniąc mu szkody. Publiusz, „przedniejszy onej wyspy”, gościł ich przez trzy dni, a Paweł uzdrowił jego ojca i innych chorych. Po trzech miesiącach popłynęli dalej aleksandryjskim okrętem, który tam przezimował. Greckie i łacińskie inskrypcje z Malty podają ten sam tytuł, „pierwszy” z Melitańczyków."
    - "Że Melita to Malta, jest poglądem zwykłym. Adria oznaczała wtedy otwarte morze między Grecją, Italią i Afryką, nie tylko dzisiejszy Adriatyk; okręt pędzony na zachód od Krety północno-wschodnim sztormem dotarłby do Malty w około dwa tygodnie, jak obliczył James Smith w 1848 r.; a aleksandryjski okręt zimowałby tam w drodze do Syrakuz i Italii. Od Konstantyna Porfirogenety w X w. niektórzy umieszczają rozbicie na Mljet, innej Melite, na Adriatyku, i proponowano inne wyspy. Tradycja umieszcza je w Zatoce św. Pawła. Do IV w. chrześcijan chowano w katakumbach poza murami Melity."
  nl:
    - "Melita is het eiland Malta, in open zee minder dan honderd kilometer ten zuiden van Sicilië. Boeren kwamen in het neolithicum vanuit Sicilië over, en tussen ongeveer 3600 en 2500 v.Chr. bouwden hun nakomelingen de grote stenen tempels van Ġgantija, Ħaġar Qim, Mnajdra en Tarxien. Feniciërs vestigden zich later op het eiland; Diodorus noemt het een Fenicische kolonie met vele havens en wevers van fijn linnen. Het kwam onder Carthago, en twee marmeren zuilen uit de tweede eeuw v.Chr., in het Fenicisch en Grieks opgedragen aan Melqart van Tyrus, gaven geleerden later de sleutel tot het Fenicische alfabet."
    - "In 218 v.Chr., aan het begin van de Tweede Punische Oorlog, gaf het Carthaagse garnizoen het eiland over aan de Romeinse consul Tiberius Sempronius, en Malta werd bij de provincie Sicilië gevoegd. De hoofdstad, ook Melita genoemd, lag waar nu Mdina en Rabat liggen. Cicero beschuldigt de gouverneur Verres ervan de oeroude tempel van Juno te hebben geplunderd, die piraten en vijandelijke vloten altijd hadden gespaard."
    - "Paulus, als gevangene op weg naar Rome, werd bij Kreta overvallen door de wind Euroklydon; veertien nachten lang werd het schip “in de Adriatische zee herwaarts en derwaarts gedreven”, voordat het strandde en uiteenbrak; allen aan boord bereikten het land. De eilandbewoners “bewezen ons geen gemene vriendelijkheid”, en een adder hechtte zich aan Paulus' hand zonder hem te deren. Publius, “de voornaamste van het eiland”, herbergde hen drie dagen, en Paulus genas zijn vader en andere zieken. Na drie maanden voeren zij verder in een schip van Alexandrië dat daar had overwinterd. Griekse en Latijnse inscripties van Malta geven dezelfde titel, de “eerste” der Melitanen."
    - "Dat Melita Malta is, is de gebruikelijke opvatting. Adria betekende toen de open zee tussen Griekenland, Italië en Afrika, niet alleen de huidige Adriatische Zee; een schip dat door een noordoostelijke storm van Kreta westwaarts werd gedreven, zou Malta in ongeveer twee weken bereiken, zoals James Smith in 1848 berekende; en een Alexandrijns schip zou er overwinteren op weg naar Syracuse en Italië. Sinds Constantijn Porphyrogennetos in de tiende eeuw plaatsen sommigen de schipbreuk op Mljet, een ander Melite, in de Adriatische Zee, en ook andere eilanden zijn voorgesteld. De overlevering plaatst haar bij St Paul's Bay. In de vierde eeuw werden christenen begraven in catacomben buiten de muren van Melita."
  cs:
    - "Melita je ostrov Malta, na otevřeném moři méně než sto kilometrů jižně od Sicílie. Zemědělci přišli ze Sicílie v neolitu a mezi lety asi 3600 a 2500 př. n. l. jejich potomci vztyčili velké kamenné chrámy Ġgantija, Ħaġar Qim, Mnajdra a Tarxien. Později ostrov osídlili Féničané; Diodóros jej nazývá fénickou kolonií s mnoha přístavy a tkalci jemného plátna. Dostal se pod Kartágo a dva mramorové sloupy z 2. století př. n. l., zasvěcené Melkartovi z Týru fénicky a řecky, daly později učencům klíč k fénickému písmu."
    - "Roku 218 př. n. l., na počátku druhé punské války, vydala kartáginská posádka ostrov římskému konzulovi Tiberiovi Semproniovi a Malta byla připojena k provincii Sicílie. Její hlavní město, rovněž zvané Melita, stálo tam, kde dnes stojí Mdina a Rabat. Cicero obviňuje místodržitele Verra, že obral její dávný chrám Junony, který piráti i nepřátelské flotily vždy ušetřily."
    - "Pavel, plující do Říma jako vězeň, byl u Kréty zachvácen větrem Euroklydonem a čtrnáct nocí se loď plavila „po moři Adriatickém“, než se najela na mělčinu a rozlámala; všichni na palubě došli na zem. Ostrované „velikou přívětivost k nám ukázali“ a zmije se zavěsila na Pavlovu ruku, aniž mu uškodila. Publius, „kníže toho ostrova“, je tři dny ubytoval a Pavel uzdravil jeho otce a jiné nemocné. Po třech měsících odplouli alexandrijskou lodí, která tam přezimovala. Řecké a latinské nápisy z Malty uvádějí týž titul, „první“ z Melitanů."
    - "Že Melita je Malta, je obvyklé mínění. Adria tehdy znamenala otevřené moře mezi Řeckem, Itálií a Afrikou, ne jen dnešní Jadran; loď hnaná od Kréty na západ severovýchodní bouří by dosáhla Malty asi za dva týdny, jak spočítal James Smith roku 1848; a alexandrijská loď by tam přezimovala na cestě do Syrakus a Itálie. Od Konstantina Porfyrogenneta v 10. století někteří kladou ztroskotání na Mljet, jinou Melitu, v Jadranu, a navrženy byly i jiné ostrovy. Tradice je klade do zátoky svatého Pavla. Ve 4. století byli křesťané pohřbíváni v katakombách za hradbami Melity."
  sv:
    - "Melita är ön Malta, i öppet hav mindre än hundra kilometer söder om Sicilien. Bönder kom över från Sicilien under neolitisk tid, och mellan omkring 3600 och 2500 f.Kr. reste deras ättlingar de stora stentemplen i Ġgantija, Ħaġar Qim, Mnajdra och Tarxien. Fenicier bosatte sedan ön; Diodorus kallar den en fenicisk koloni med många hamnar och väverskor av fint linne. Den kom under Kartago, och två marmorpelare från 100-talet f.Kr., tillägnade Melqart av Tyros på fenikiska och grekiska, gav senare forskare nyckeln till det fenikiska alfabetet."
    - "År 218 f.Kr., vid början av andra puniska kriget, överlämnade den kartagiska garnisonen ön till den romerske konsuln Tiberius Sempronius, och Malta förenades med provinsen Sicilien. Dess huvudstad, också kallad Melita, låg där Mdina och Rabat ligger i dag. Cicero anklagar ståthållaren Verres för att ha plundrat dess urgamla Junotempel, som pirater och fientliga flottor alltid hade skonat."
    - "Paulus, på väg till Rom som fånge, överraskades utanför Kreta av vinden Euroklydon, och när de den fjortonde natten ”drevo omkring på Adriatiska havet” gick skeppet på grund och slogs sönder; alla ombord nådde land. Öborna ”visade oss en icke vanlig välvilja”, och en huggorm fastnade på Paulus hand utan att skada honom. Publius, ”den förnämste mannen på ön”, gav dem härbärge i tre dagar, och Paulus botade hans fader och andra sjuka. Efter tre månader seglade de vidare i ett alexandrinskt skepp som hade övervintrat där. Grekiska och latinska inskrifter från Malta ger samma titel, melitanernas ”förste”."
    - "Att Melita är Malta är den vanliga uppfattningen. Adria betydde då det öppna havet mellan Grekland, Italien och Afrika, inte bara dagens Adriatiska havet; ett skepp som drevs västerut från Kreta av en nordostlig storm skulle nå Malta på ungefär två veckor, som James Smith räknade 1848; och ett alexandrinskt skepp skulle övervintra där på väg till Syrakusa och Italien. Sedan Konstantin Porfyrogennetos på 900-talet har vissa förlagt skeppsbrottet till Mljet, ännu en Melite, i Adriatiska havet, och andra öar har föreslagits. Traditionen förlägger det till Sankt Pauls bukt. På 300-talet begravdes kristna i katakomber utanför Melitas murar."
  nb:
    - "Melita er øya Malta, ute i åpent hav mindre enn hundre kilometer sør for Sicilia. Bønder kom over fra Sicilia i yngre steinalder, og mellom omkring 3600 og 2500 f.Kr. reiste deres etterkommere de store steintemplene i Ġgantija, Ħaġar Qim, Mnajdra og Tarxien. Fønikerne bosatte senere øya; Diodoros kaller den en fønikisk koloni med mange havner og vevere av fint lin. Den kom under Kartago, og to marmorsøyler fra 100-tallet f.Kr., viet til Melkart av Tyros på fønikisk og gresk, ga senere forskerne nøkkelen til det fønikiske alfabetet."
    - "I 218 f.Kr., ved begynnelsen av Den andre puniske krig, overga den kartagiske garnisonen øya til den romerske konsulen Tiberius Sempronius, og Malta ble forent med provinsen Sicilia. Hovedbyen, også kalt Melita, lå der Mdina og Rabat ligger i dag. Cicero anklager guvernøren Verres for å ha plyndret dens gamle Juno-tempel, som sjørøvere og fiendtlige flåter alltid hadde spart."
    - "Paulus, som seilte til Roma som fange, ble overrasket utenfor Kreta av vinden Eurakylon og «drev omkring i Adriaterhavet» i fjorten netter før skipet gikk på grunn og brøt sammen; alle om bord nådde land. Øyboerne «viste ikke liten menneskekjærlighet mot oss», og en hoggorm bet seg fast i Paulus' hånd uten å skade ham. Publius, «den første mann på øen», ga dem husly i tre dager, og Paulus helbredet hans far og andre syke. Etter tre måneder seilte de videre i et skip fra Aleksandria som hadde overvintret der. Greske og latinske innskrifter fra Malta gir den samme tittelen, «den første» blant melitenserne."
    - "At Melita er Malta, er den vanlige oppfatningen. Adria betydde da det åpne havet mellom Hellas, Italia og Afrika, ikke bare dagens Adriaterhav; et skip drevet vestover fra Kreta av en nordøstlig storm ville nå Malta på omkring to uker, slik James Smith regnet ut i 1848; og et aleksandrinsk skip ville overvintre der på vei til Syrakus og Italia. Siden Konstantin Porfyrogennetos på 900-tallet har noen plassert forliset på Mljet, en annen Melite, i Adriaterhavet, og andre øyer er foreslått. Tradisjonen plasserer det i Sankt Pauls bukt. På 300-tallet ble kristne gravlagt i katakomber utenfor murene til Melita."
  tl:
    - "Ang Melita ay ang pulo ng Malta, sa bukas na dagat na wala pang isandaang kilometro sa timog ng Sicilia. Dumating ang mga magsasaka mula sa Sicilia noong Neolitiko, at sa pagitan ng mga 3600 at 2500 BK itinayo ng kanilang mga inapo ang mga dakilang templong bato ng Ġgantija, Ħaġar Qim, Mnajdra at Tarxien. Kalaunan ay nanirahan ang mga Fenicio sa pulo; tinatawag ito ni Diodorus na kolonyang Fenicio na may maraming daungan at mga manghahabi ng pinong lino. Napasailalim ito sa Cartago, at ang dalawang haliging marmol noong ika-2 siglo BK, na inialay kay Melqart ng Tiro sa Fenicio at Griyego, ang kalaunang nagbigay sa mga iskolar ng susi sa alpabetong Fenicio."
    - "Noong 218 BK, sa pagsisimula ng Ikalawang Digmaang Punico, isinuko ng gwardiyang Cartaginense ang pulo sa konsul Romano na si Tiberio Sempronio, at isinama ang Malta sa lalawigan ng Sicilia. Ang pangunahing bayan nito, na tinatawag ding Melita, ay nakatayo kung nasaan ang Mdina at Rabat ngayon. Inaakusahan ni Ciceron ang gobernador na si Verres na hinubaran ang sinaunang templo nito ni Juno, na laging pinaligtas ng mga pirata at ng mga armada ng kaaway."
    - "Si Pablo, na naglalayag patungong Roma bilang bilanggo, ay inabutan sa tapat ng Creta ng hanging Euraclidon at “ipinapadpad ng hangin sa magkabikabila ng Dagat ng Adriatico” sa loob ng labing-apat na gabi bago sumadsad at nawasak ang barko; lahat ng sakay ay nakarating sa lupa. “Pinagpakitaan kami ng hindi karaniwang kagandahang-loob” ng mga taga-pulo, at isang ulupong ang kumapit sa kamay ni Pablo nang hindi siya nasaktan. Si Publio, “ang pangulo sa pulong yaon”, ay nagkupkop sa kanila nang tatlong araw, at pinagaling ni Pablo ang kaniyang ama at ang iba pang may sakit. Pagkaraan ng tatlong buwan ay naglayag sila sa isang barko ng Alejandria na doon nagtaglamig. Ang mga inskripsiyong Griyego at Latin mula sa Malta ay nagbibigay ng gayon ding titulo, ang “una” ng mga Melitano."
    - "Karaniwang pananaw na ang Melita ay Malta. Noon ay Adria ang tawag sa bukas na dagat sa pagitan ng Grecia, Italia at Aprika, hindi lamang ang Adriatiko ngayon; ang barkong ipinadpad pakanluran mula sa Creta ng bagyong hilagang-silangan ay aabot sa Malta sa halos dalawang linggo, gaya ng tinantiya ni James Smith noong 1848; at magtataglamig doon ang isang barko ng Alejandria patungong Siracusa at Italia. Mula kay Constantino Porphyrogenitus noong ika-10 siglo, inilagay ng ilan ang pagkawasak sa Mljet, ibang Melite, sa Adriatiko, at iminungkahi ang iba pang pulo. Inilalagay ito ng tradisyon sa Look ni San Pablo. Pagsapit ng ika-4 na siglo, inililibing na ang mga Kristiyano sa mga catacomb sa labas ng mga pader ng Melita."
  da:
    - "Melita er øen Malta, i åbent hav mindre end hundrede kilometer syd for Sicilien. Bønder kom over fra Sicilien i den neolitiske tid, og mellem omkring 3600 og 2500 f.Kr. rejste deres efterkommere de store stentempler Ġgantija, Ħaġar Qim, Mnajdra og Tarxien. Fønikerne bosatte sig senere på øen; Diodor kalder den en fønikisk koloni med mange havne og vævere af fint lærred. Den kom under Karthago, og to marmorsøjler fra 100-tallet f.Kr., viet til Melqart af Tyrus på fønikisk og græsk, gav senere forskerne nøglen til det fønikiske alfabet."
    - "I 218 f.Kr., ved begyndelsen af Den Anden Puniske Krig, overgav den karthagiske garnison øen til den romerske konsul Tiberius Sempronius, og Malta blev lagt ind under provinsen Sicilien. Dens hovedby, også kaldet Melita, lå, hvor Mdina og Rabat ligger i dag. Cicero anklager guvernøren Verres for at have plyndret dens gamle Juno-tempel, som pirater og fjendtlige flåder altid havde skånet."
    - "Paulus, der sejlede til Rom som fange, blev ud for Kreta grebet af vinden Euroklydon og drev i fjorten nætter, som Apostlenes Gerninger siger, »i det adriatiske Hav«, før skibet løb på grund og gik i stykker; alle om bord nåede land. Øboerne »viste os en usædvanlig Menneskekærlighed«, og en hugorm hang sig fast i Paulus' hånd uden at skade ham. Publius, »Øens fornemste Mand«, lod dem bo hos sig i tre dage, og Paulus helbredte hans far og andre syge. Efter tre måneder sejlede de videre i et skib fra Alexandria, der havde overvintret dér. Græske og latinske indskrifter fra Malta giver den samme titel, melitanernes »første«."
    - "At Melita er Malta, er den almindelige opfattelse. Adria betød dengang det åbne hav mellem Grækenland, Italien og Afrika, ikke blot nutidens Adriaterhav; et skib, der blev drevet vestpå fra Kreta af en nordøstlig storm, ville nå Malta på omkring to uger, som James Smith regnede i 1848; og et skib fra Alexandria ville overvintre dér på vej til Syrakus og Italien. Siden Konstantin Porfyrogennetos i 900-tallet har nogle placeret forliset på Mljet, en anden Melite, i Adriaterhavet, og andre øer er blevet foreslået. Traditionen placerer det ved Sankt Pauls Bugt. I 300-tallet blev kristne begravet i katakomber uden for Melitas mure."
  sr:
    - "Мелита је острво Малта, на отвореном мору мање од сто километара јужно од Сицилије. Земљорадници су дошли са Сицилије у неолиту, и између око 3600. и 2500. п. н. е. њихови потомци подигли су велике камене храмове Ђгантије, Хаџар Кима, Мнајдре и Таршина. Феничани су касније населили острво; Диодор га назива феничанском колонијом са многим лукама и ткачима финог платна. Потпало је под Картагину, а два мермерна стуба из II века п. н. е., посвећена Мелкарту Тирском на феничанском и грчком, касније су научницима дала кључ феничанског алфабета."
    - "Године 218. п. н. е., на почетку Другог пунског рата, картагинска посада предала је острво римском конзулу Тиберију Семпронију, и Малта је припојена провинцији Сицилији. Њен главни град, такође звани Мелита, стајао је где данас стоје Мдина и Рабат. Цицерон оптужује намесника Вера да је опљачкао њен древни храм Јуноне, који су гусари и непријатељске флоте увек поштеђивали."
    - "Павле, пловећи у Рим као заробљеник, ухваћен је код Крита ветром Евроклидоном; „кад би четрнаеста ноћ, и ми се у поноћи плављасмо по адријанској пучини“, а затим се лађа насукала и разбила; сви на броду стигли су на копно. Острвљани су „чињаху нам не малу љубав“, а змија се закачила за Павлову руку не нашкодивши му. Поплије, поглавар острва, угостио их је три дана, а Павле је исцелио његовог оца и друге болеснике. После три месеца отпловили су даље на александријској лађи која је тамо презимила. Грчки и латински натписи из Малте дају исту титулу, „први“ међу Мелићанима."
    - "Да је Мелита Малта, уобичајено је гледиште. Адрија је тада значила отворено море између Грчке, Италије и Африке, а не само данашњи Јадран; лађа коју северо-источна олуја нагони на запад од Крита стигла би на Малту за око две недеље, како је 1848. израчунао Џејмс Смит; а александријска лађа презимила би тамо на путу за Сиракузу и Италију. Од Константина Порфирогенита у X веку неки смештају бродолом на Мљет, другу Мелиту, у Јадрану, а предложена су и друга острва. Предање га смешта у Залив светог Павла. До IV века хришћани су сахрањивани у катакомбама изван зидина Мелите."
  hu:
    - "Melita Málta szigete, nyílt tengeren, Szicíliától kevesebb mint száz kilométerre délre. Földművesek érkeztek ide Szicíliából a neolitikumban, és leszármazottaik Kr. e. 3600 és 2500 között emelték a Ġgantija, a Ħaġar Qim, a Mnajdra és a Tarxien nagy kőtemplomait. Később föníciaiak telepedtek le a szigeten; Diodórosz föníciai gyarmatnak nevezi, sok kikötővel és finom lenszövőkkel. Karthágó uralma alá került, és két Kr. e. 2. századi márványoszlop, amelyet föníciai és görög nyelven Tírusz Melkartjának ajánlottak, később a föníciai ábécé kulcsát adta a tudósoknak."
    - "Kr. e. 218-ban, a második pun háború kezdetén a karthágói helyőrség átadta a szigetet Tiberius Sempronius római consulnak, és Málta Szicília tartományához csatlakozott. Fő városa, szintén Melita, ott állt, ahol ma Mdina és Rabat. Cicero azzal vádolja Verres helytartót, hogy kifosztotta Juno ősi templomát, amelyet a kalózok és az ellenséges flották mindig megkíméltek."
    - "Pál, aki fogolyként Rómába hajózott, Kréta mellett elkapta az Euroklüdón szél, és tizennégy éjszakán át „ide s tova hányatánk az Ádrián”, mielőtt a hajó zátonyra futott és szétesett; mindenki partot ért. A szigetlakók „nem közönséges emberséget cselekesznek vala mi velünk”, és egy vipera csimpaszkodott Pál kezére anélkül, hogy bántotta volna. Publius, „a sziget főemberének”, három napig szállást adott nekik, és Pál meggyógyította az apját és más betegeket. Három hónap múlva egy ott telelt alexandriai hajón hajóztak tovább. Máltai görög és latin feliratok ugyanezt a címet adják, a melitaiak „első” emberét."
    - "Hogy Melita Málta, a szokásos nézet. Adria akkor a Görögország, Itália és Afrika közötti nyílt tengert jelentette, nem csak a mai Adriát; a Krétától nyugatra hajtott hajó északkeleti viharban mintegy két hét alatt érné el Máltát, ahogy James Smith 1848-ban kiszámította; és egy alexandriai hajó itt telelne Szirakúza és Itália felé menet. A tizedik századi Bíborbanszületett Konstantin óta egyesek a hajótörést az Adrián fekvő másik Melitére, Mljetre helyezték, és más szigeteket is javasoltak. A hagyomány a Szent Pál-öbölbe teszi. A 4. századra keresztényeket temettek Melita falain kívüli katakombákban."
  fi:
    - "Melita on Maltan saari, avomerellä alle sadan kilometrin päässä Sisiliasta etelään. Maanviljelijöitä tuli Sisiliasta neoliittisella kaudella, ja noin 3600–2500 eaa. heidän jälkeläisensä pystyttivät Ġgantijan, Ħaġar Qimin, Mnajdran ja Tarxienin suuret kivitemppelit. Foinikialaiset asuttivat saaren myöhemmin; Diodoros kutsuu sitä foinikialaiseksi siirtokunnaksi, jossa oli monta satamaa ja hienon pellavan kutojia. Se joutui Karthagon alaisuuteen, ja kaksi 100-luvun eaa. marmoripilaria, jotka oli omistettu Tyroksen Melqartille foinikiaksi ja kreikaksi, antoivat tutkijoille myöhemmin avaimen foinikialaiseen aakkostoon."
    - "Vuonna 218 eaa., toisen puunilaissodan alussa, Karthagon varusväki luovutti saaren Rooman konsuli Tiberius Semproniukselle, ja Malta liitettiin Sisilian provinssiin. Sen pääkaupunki, jota myös kutsuttiin Melitaksi, sijaitsi siellä, missä nyt ovat Mdina ja Rabat. Cicero syyttää maaherra Verrestä saaren muinaisen Junon temppelin ryöstämisestä, jonka merirosvot ja vihollislaivastot olivat aina säästäneet."
    - "Paavali, joka purjehti vankina Roomaan, joutui Kreetan edustalla Euroklydon-tuuleen. Laiva ajelehti neljätoista yötä (”meidän ajelehtiessamme Adrianmerellä”), kunnes ajoi karille ja hajosi; kaikki laivassa olleet pääsivät maihin. Saaren asukkaat ”osoittivat meille suurta ystävällisyyttä”, ja kyykäärme kävi kiinni Paavalin käteen vahingoittamatta häntä. Publius, ”saaren ensimmäinen mies”, majoitti heidät kolmeksi päiväksi, ja Paavali paransi hänen isänsä ja muita sairaita. Kolmen kuukauden kuluttua he purjehtivat edelleen aleksandrialaisella laivalla, joka oli talvehtinut siellä. Maltan kreikkalaiset ja latinalaiset kirjoitukset antavat saman arvonimen, melitalaisten ”ensimmäinen”."
    - "Se, että Melita on Malta, on tavallinen näkemys. Adria tarkoitti tuolloin Kreikan, Italian ja Afrikan välistä avomerta, ei vain nykyistä Adrianmerta; koillismyrskyn Kreetalta länteen ajama laiva saavuttaisi Maltan noin kahdessa viikossa, kuten James Smith laski vuonna 1848; ja aleksandrialainen laiva talvehtisi siellä matkallaan Syrakusaan ja Italiaan. Konstantinos Porfyrogennetoksesta 900-luvulla lähtien jotkut ovat sijoittaneet haaksirikon Mljetille, toiseen Melite-nimiseen saareen Adrianmerellä, ja muitakin saaria on ehdotettu. Perimätieto sijoittaa sen Pyhän Paavalin lahdelle. 300-luvulla kristittyjä haudattiin Melitan muurien ulkopuolella oleviin katakombeihin."
  vi:
    - "Melita là đảo Man-tơ (Malta), ngoài biển khơi, cách Sicily chưa đến một trăm km về phía nam. Nông dân từ Sicily sang vào thời Đá Mới, và khoảng 3600–2500 TCN hậu duệ của họ dựng các đền đá lớn Ġgantija, Ħaġar Qim, Mnajdra và Tarxien. Người Phê-ni-xi sau đó định cư trên đảo; Diodorus gọi nó là thuộc địa Phê-ni-xi có nhiều bến cảng và thợ dệt vải lanh mịn. Đảo thuộc Carthage, và hai cột đá cẩm thạch thế kỷ 2 TCN, dâng cho Melqart của Ty-rơ bằng tiếng Phê-ni-xi và Hy Lạp, về sau cho các học giả chìa khóa để đọc bảng chữ cái Phê-ni-xi."
    - "Năm 218 TCN, vào đầu Chiến tranh Punic thứ hai, đồn binh Carthage đầu hàng đảo cho chấp chính La Mã Tiberius Sempronius, và Man-tơ được nhập vào tỉnh Sicily. Thành chính của nó, cũng gọi là Melita, nằm nơi Mdina và Rabat ngày nay. Cicero buộc tội tổng trấn Verres đã cướp đền cổ của Juno, nơi mà hải tặc và hạm đội địch từ xưa luôn tha."
    - "Phao-lô, đi thuyền đến Rô-ma làm tù nhân, bị gió Ơ-ra-qui-lôn bắt gặp ngoài khơi Cơ-rết và “trôi nổi trên biển A-đờ-ria-tích” mười bốn đêm trước khi tàu mắc cạn và vỡ; hết thảy người trên tàu đều lên được bờ. Dân đảo “đãi chúng ta một cách nhân từ hiếm có”, và một con rắn lục cắn vào tay Phao-lô mà không hại ông. Búp-li-u, “người tù trưởng của đảo ấy”, tiếp đón họ ba ngày, và Phao-lô chữa lành cha ông và những người bệnh khác. Sau ba tháng họ đi tiếp trên một chiếc tàu A-léc-xan-tri đã qua mùa đông ở đó. Các bản khắc Hy Lạp và Latinh từ Man-tơ cũng ghi chức danh ấy, “người thứ nhất” của dân Melita."
    - "Quan điểm thông thường cho rằng Melita là Man-tơ. Khi ấy Adria chỉ vùng biển mở giữa Hy Lạp, Y-ta-li và châu Phi, không chỉ biển Adriatic ngày nay; một con tàu bị bão đông bắc đẩy về tây từ Cơ-rết sẽ đến Man-tơ trong khoảng hai tuần, như James Smith tính năm 1848; và một tàu A-léc-xan-tri sẽ qua đông ở đó trên đường đến Sy-ra-cu-sơ và Y-ta-li. Từ Constantine Porphyrogenitus ở thế kỷ 10, một số người đặt vụ đắm tàu ở Mljet, một Melite khác trong Adriatic, và các đảo khác cũng được đề nghị. Truyền thống đặt nó ở Vịnh Thánh Phao-lô. Đến thế kỷ 4, các tín đồ Cơ Đốc được chôn trong hầm mộ ngoài tường thành Melita."
  ro:
    - "Melita este insula Malta, în largul mării, la mai puțin de o sută de kilometri sud de Sicilia. Fermieri au venit din Sicilia în neolitic, iar între circa 3600 și 2500 î.Hr. urmașii lor au ridicat marile temple de piatră Ġgantija, Ħaġar Qim, Mnajdra și Tarxien. Fenicienii s-au așezat mai târziu pe insulă; Diodor o numește colonie feniciană cu multe porturi și țesători de in fin. A trecut sub Cartagina, iar două coloane de marmură din secolul al II-lea î.Hr., închinate lui Melqart din Tir în feniciană și greacă, au dat mai târziu savanților cheia alfabetului fenician."
    - "În 218 î.Hr., la începutul celui de-al Doilea Război Punic, garnizoana cartagineză a predat insula consulului roman Tiberiu Sempronius, iar Malta a fost alipită provinciei Sicilia. Orașul ei principal, numit și el Melita, se afla unde se află azi Mdina și Rabat. Cicero îl acuză pe guvernatorul Verres că a despuiat vechiul ei templu al Iunonei, pe care pirații și flotele dușmane îl cruțaseră mereu."
    - "Pavel, navigând spre Roma ca prizonier, a fost prins în largul Cretei de vântul Euroclidon și paisprezece nopți a fost purtat prin Adria – „purtându-ne noi cu corabia în marea Adriei” –, până când corabia a eșuat și s-a sfărâmat; toți cei de pe bord au ajuns la mal. Localnicii „au făcut nu puțină milă cu noi”, iar o viperă s-a prins de mâna lui Pavel fără să-i facă rău. În vecinătate erau „satele mai marelui ostrovului, anume Poplie; care primindu-ne pre noi, trei zile cu omenie ne-au ospătat”, iar Pavel i-a vindecat tatăl și alți bolnavi. După trei luni au plecat cu o corabie din Alexandria care iernase acolo. Inscripții grecești și latine din Malta dau același titlu, „primul” al melitenilor."
    - "Că Melita este Malta este părerea obișnuită. Adria însemna atunci marea deschisă dintre Grecia, Italia și Africa, nu doar Adriatica de azi; o corabie împinsă spre vest de la Creta de o furtună dinspre nord-est ar ajunge la Malta în circa două săptămâni, după cum a calculat James Smith în 1848; iar o corabie din Alexandria ar ierna acolo pe drumul spre Siracuza și Italia. Din vremea lui Constantin Porfirogenetul, în secolul al X-lea, unii au așezat naufragiul pe Mljet, o altă Melite, în Adriatica, și au fost propuse și alte insule. Tradiția îl așază în Golful Sfântul Pavel. Cel târziu în secolul al IV-lea, creștinii erau deja îngropați în catacombe în afara zidurilor Melitei."
  bg:
    - "Мелита е остров Малта, в откритото море на по-малко от сто километра южно от Сицилия. Земеделци дошли от Сицилия през неолита, а между около 3600 и 2500 г. пр.н.е. техните потомци издигнали големите каменни храмове Джгантия, Хаджар Ким, Мнайдра и Таршиен. По-късно островът бил заселен от финикийци; Диодор го нарича финикийска колония с много пристанища и тъкачи на фин лен. Той попаднал под властта на Картаген, а две мраморни колони от II в. пр.н.е., посветени на Мелкарт Тирски на финикийски и гръцки, по-късно дали на учените ключа към финикийската азбука."
    - "През 218 г. пр.н.е., в началото на Втората пуническа война, картагенският гарнизон предал острова на римския консул Тиберий Семпроний и Малта била присъединена към провинция Сицилия. Главният ѝ град, наричан също Мелита, стоял там, където днес са Мдина и Рабат. Цицерон обвинява управителя Верес, че ограбил древния ѝ храм на Юнона, който пиратите и вражеските флоти винаги щадели."
    - "Павел, който плаваше за Рим като затворник, беше застигнат край Крит от вятъра Евроклидон и четиринадесет нощи корабът беше носен „на сам на там по Адриатическо море“, преди корабът да заседне и да се разбие; всички на борда стигнаха до сушата. Островитяните „показаха нам големо чоловеколюбие“, а една усойница се залепи на ръката на Павел, без да му навреди. Поплий, „най-първия в острова“, ги прие за три дни и Павел изцели баща му и други болни. След три месеца те продължиха с александрийски кораб, който беше зимувал там. Гръцки и латински надписи от Малта дават същата титла — „първият“ на мелитяните."
    - "Че Мелита е Малта, е обичайното мнение. Адрия тогава означавала откритото море между Гърция, Италия и Африка, а не само днешното Адриатическо море; кораб, гонен на запад от Крит от североизточна буря, би стигнал Малта за около две седмици, както пресмята Джеймс Смит през 1848 г.; а александрийски кораб би зимувал там на път за Сиракуза и Италия. От Константин Багрянородни през X в. насам някои поставят корабокрушението на Млет, друга Мелита, в Адриатическо море, предлагани са и други острови. Традицията го поставя в залива „Свети Павел“. Към IV в. християните са погребвани в катакомби извън стените на Мелита."
