# Overview article (ADR 0007). Mainstream facts only; Melita is identified with Malta as in the usual view, and the alternatives are named.
id: malta
place: a57835d
title:
  en: "Malta"
  ru: "Мелит"
  uk: "Мальта"
  es: "Malta"
  pt: "Malta"
  de: "Malta"
  fr: "Malte"
body:
  en:
    - "Melita is the island of Malta, in the open sea less than a hundred kilometres south of Sicily. Farmers came over from Sicily in the Neolithic age, and between about 3600 and 2500 BC their descendants raised the great stone temples of Ġgantija, Ħaġar Qim, Mnajdra and Tarxien. Phoenicians later settled the island; Diodorus calls it a Phoenician colony with many harbours and weavers of fine linen. It came under Carthage, and two marble pillars of the second century BC, dedicated to Melqart of Tyre in Phoenician and Greek, later gave scholars the key to the Phoenician alphabet."
    - "In 218 BC, at the start of the Second Punic War, the Carthaginian garrison surrendered the island to the Roman consul Tiberius Sempronius, and Malta was joined to the province of Sicily. Its main town, also called Melita, stood where Mdina and Rabat stand today. Cicero accuses the governor Verres of stripping its ancient temple of Juno, which pirates and enemy fleets had always spared."
    - 'Paul, sailing to Rome as a prisoner, was caught off Crete by the wind Euroclydon and "driven up and down in Adria" for fourteen nights before the ship ran aground and broke up; all on board reached land. The islanders "shewed us no little kindness", and a viper fastened on Paul''s hand without harming him. Publius, "the chief man of the island", lodged them for three days, and Paul healed his father and other sick people. After three months they sailed on in a ship of Alexandria that had wintered there. Greek and Latin inscriptions from Malta give the same title, the "first" of the Melitans.'
    - "That Melita is Malta is the usual view. Adria then meant the open sea between Greece, Italy and Africa, not only today's Adriatic; a ship driven west from Crete by a north-easterly gale would reach Malta in about two weeks, as James Smith reckoned in 1848; and an Alexandrian ship would winter there on its way to Syracuse and Italy. Since Constantine Porphyrogenitus in the tenth century some have placed the wreck on Mljet, another Melite, in the Adriatic, and other islands have been proposed. Tradition places it at St Paul's Bay. By the fourth century Christians were buried in catacombs outside the walls of Melita."
  ru:
    - "Мелит — это остров Мальта в открытом море, менее чем в ста километрах к югу от Сицилии. Земледельцы переселились сюда с Сицилии в эпоху неолита, и около 3600–2500 гг. до н. э. их потомки возвели большие каменные храмы Джгантия, Хаджар-Ким, Мнайдра и Таршиен. Позже остров заселили финикийцы; Диодор называет его финикийской колонией со множеством гаваней и ткачами тонкого полотна. Остров перешёл под власть Карфагена, а две мраморные колонны II века до н. э., посвящённые Мелькарту Тирскому, с надписью по-финикийски и по-гречески, позднее дали учёным ключ к финикийскому алфавиту."
    - "В 218 г. до н. э., в начале Второй Пунической войны, карфагенский гарнизон сдал остров римскому консулу Тиберию Семпронию, и Мальту присоединили к провинции Сицилия. Её главный город, тоже называвшийся Мелитой, стоял там, где сегодня Мдина и Рабат. Цицерон обвиняет наместника Верреса в том, что тот ограбил здешний древний храм Юноны, который всегда щадили и пираты, и вражеские флоты."
    - "Павел, которого везли узником в Рим, у Крита попал в бурю от ветра эвроклидона; четырнадцать ночей, как сказано в Деяниях, «мы носимы были в Адриатическом море», а затем корабль сел на мель и разбился; все спаслись на землю. Иноплеменники «оказали нам немалое человеколюбие», а ехидна повисла на руке Павла, не причинив ему вреда. Начальник острова Публий три дня принимал их у себя, и Павел исцелил его отца и других больных. Через три месяца они отплыли на александрийском корабле, зимовавшем на острове. Греческие и латинские надписи с Мальты дают тот же титул — «первый» среди мелитян."
    - "Что Мелит — это Мальта, обычная точка зрения. Адриатическим морем тогда называли всё открытое море между Грецией, Италией и Африкой, а не только нынешнюю Адриатику; корабль, гонимый от Крита на запад северо-восточной бурей, дошёл бы до Мальты примерно за две недели, как рассчитал в 1848 г. Джеймс Смит; и александрийский корабль вполне мог зимовать здесь по пути в Сиракузы и Италию. Со времён Константина Багрянородного, с X века, некоторые помещают кораблекрушение на Млет, другой остров Мелита в Адриатике, предлагались и другие острова. Предание указывает на залив Святого Павла. К IV веку христиан хоронили в катакомбах за стенами Мелиты."
  uk:
    - "Мелита — це острів Мальта, у відкритому морі менш ніж за сто кілометрів на південь від Сицилії. Землероби переселилися із Сицилії в неоліті, і приблизно між 3600 і 2500 рр. до н. е. їхні нащадки спорудили великі кам’яні храми Джгантії, Хаджар-Хіма, Мнайдри й Тарксієна. Пізніше на острові оселилися фінікійці; Діодор називає його фінікійською колонією з багатьма гаванями й ткачами тонкого полотна. Він перейшов під владу Карфагена, і два мармурові стовпи II ст. до н. е., присвячені Мелькарту Тирському фінікійською та грецькою мовами, пізніше дали вченим ключ до фінікійської абетки."
    - "У 218 р. до н. е., на початку Другої Пунічної війни, карфагенський гарнізон здав острів римському консулові Тиберію Семпронію, і Мальту було приєднано до провінції Сицилія. Її головне місто, також зване Мелита, стояло там, де сьогодні стоять Мдіна й Рабат. Цицерон обвинувачує намісника Верреса в пограбуванні її давнього храму Юнони, який пірати й ворожі флоти завжди щадили."
    - "Павла, що плив до Риму як в’язень, застав біля Криту вітер Євроклидон, і «носило нас по Адриятицькому морю» чотирнадцять ночей, поки корабель не сів на мілину й не розбився; усі, хто був на борту, дісталися землі. Остров’яни «показали нам не мале милосердє», а гадюка вчепилася Павлові в руку, не заподіявши йому шкоди. Публій, «першого на острові», приймав їх три дні, і Павло оздоровив його батька й інших хворих. Через три місяці вони відплили далі на александрійському кораблі, що зимував там. Грецькі й латинські написи з Мальти дають той самий титул — «перший» серед мелітян."
    - "Що Мелита — це Мальта, є звичайним поглядом. Адрія тоді означала відкрите море між Грецією, Італією та Африкою, а не лише сьогоднішній Адріатичний басейн; корабель, відігнаний на захід від Криту північно-східним штормом, дістався б Мальти приблизно за два тижні, як підрахував Джеймс Сміт 1848 р.; а александрійський корабель зимував би там на шляху до Сиракуз та Італії. Від Костянтина Багрянородного в X ст. дехто розміщував кораблетрощу на Млєті, іншій Меліті, в Адріатиці, і пропонували інші острови. Традиція розміщує її в затоці святого Павла. До IV ст. християн ховали в катакомбах поза стінами Мелити."
  es:
    - "Melita es la isla de Malta, en mar abierto, a menos de cien kilómetros al sur de Sicilia. Agricultores llegaron de Sicilia en el Neolítico, y entre cerca de 3600 y 2500 a. C. sus descendientes levantaron los grandes templos de piedra de Ġgantija, Ħaġar Qim, Mnajdra y Tarxien. Más tarde se establecieron en la isla los fenicios; Diodoro la llama una colonia fenicia con muchos puertos y tejedores de lino fino. Pasó a depender de Cartago, y dos pilares de mármol del siglo II a. C., dedicados a Melqart de Tiro en fenicio y en griego, dieron más tarde a los estudiosos la clave del alfabeto fenicio."
    - "En 218 a. C., al comienzo de la Segunda Guerra Púnica, la guarnición cartaginesa entregó la isla al cónsul romano Tiberio Sempronio, y Malta quedó unida a la provincia de Sicilia. Su ciudad principal, llamada también Melita, se alzaba donde hoy están Mdina y Rabat. Cicerón acusa al gobernador Verres de haber despojado su antiguo templo de Juno, que piratas y flotas enemigas siempre habían respetado."
    - "Pablo, que navegaba a Roma como prisionero, fue sorprendido frente a Creta por el viento Euroclidón, y tras catorce noches «siendo llevados por el mar Adriático», la nave encalló y se deshizo; todos los que iban a bordo llegaron a tierra. Los isleños «nos mostraron no poca humanidad», y una víbora se prendió de la mano de Pablo sin hacerle daño. Publio, «el principal de la isla», los hospedó durante tres días, y Pablo sanó a su padre y a otros enfermos. Pasados tres meses siguieron viaje en una nave de Alejandría que había invernado allí. Inscripciones griegas y latinas de Malta dan el mismo título, el «primero» de los melitenses."
    - "Que Melita sea Malta es la opinión habitual. Adria significaba entonces el mar abierto entre Grecia, Italia y África, no solo el actual Adriático; una nave arrastrada hacia el oeste desde Creta por un temporal del nordeste llegaría a Malta en unas dos semanas, como calculó James Smith en 1848; y una nave alejandrina invernaría allí en su camino a Siracusa y a Italia. Desde Constantino Porfirogéneto, en el siglo X, algunos han situado el naufragio en Mljet, otra Melite, en el Adriático, y se han propuesto otras islas. La tradición lo sitúa en la bahía de San Pablo. En el siglo IV había cristianos enterrados en catacumbas fuera de las murallas de Melita."
  pt:
    - "Melita é a ilha de Malta, em mar aberto, a menos de cem quilômetros ao sul da Sicília. Agricultores vieram da Sicília no período Neolítico, e entre cerca de 3600 e 2500 a.C. seus descendentes ergueram os grandes templos de pedra de Ġgantija, Ħaġar Qim, Mnajdra e Tarxien. Os fenícios depois se estabeleceram na ilha; Diodoro a chama de colônia fenícia com muitos portos e tecelões de linho fino. Passou ao domínio de Cartago, e dois pilares de mármore do século II a.C., dedicados a Melqart de Tiro em fenício e grego, deram depois aos estudiosos a chave do alfabeto fenício."
    - "Em 218 a.C., no início da Segunda Guerra Púnica, a guarnição cartaginesa entregou a ilha ao cônsul romano Tibério Semprônio, e Malta foi anexada à província da Sicília. Sua cidade principal, também chamada Melita, ficava onde hoje estão Mdina e Rabat. Cícero acusa o governador Verres de despojar seu antigo templo de Juno, que piratas e frotas inimigas sempre haviam poupado."
    - "Paulo, navegando para Roma como prisioneiro, foi surpreendido ao largo de Creta pelo vento Euroclidão e, por catorze noites, levado “de um lado para outro no mar Adriático”, até que o navio encalhou e se despedaçou; todos a bordo chegaram à terra. Os ilhéus “demonstraram uma bondade incomum para conosco”, e uma víbora prendeu-se à mão de Paulo sem lhe fazer mal. Públio, “o homem principal da ilha”, os hospedou por três dias, e Paulo curou seu pai e outros doentes. Depois de três meses, seguiram em um navio de Alexandria que havia passado o inverno ali. Inscrições gregas e latinas de Malta dão o mesmo título, o “primeiro” dos melitenses."
    - "Que Melita seja Malta é a opinião usual. Adria significava então o mar aberto entre a Grécia, a Itália e a África, e não apenas o atual Adriático; um navio levado para oeste desde Creta por um vendaval de nordeste chegaria a Malta em cerca de duas semanas, como calculou James Smith em 1848; e um navio alexandrino invernaria ali a caminho de Siracusa e da Itália. Desde Constantino Porfirogeneta, no século X, alguns situam o naufrágio em Mljet, outra Melite, no Adriático, e outras ilhas foram propostas. A tradição o situa na baía de São Paulo. Já no século IV cristãos eram sepultados em catacumbas fora das muralhas de Melita."
  de:
    - "Melite ist die Insel Malta, im offenen Meer weniger als hundert Kilometer südlich von Sizilien. Bauern kamen in der Jungsteinzeit von Sizilien herüber, und zwischen etwa 3600 und 2500 v. Chr. errichteten ihre Nachkommen die großen Steintempel von Ġgantija, Ħaġar Qim, Mnajdra und Tarxien. Später ließen sich Phönizier auf der Insel nieder; Diodor nennt sie eine phönizische Kolonie mit vielen Häfen und Webern feinen Leinens. Sie kam unter Karthago, und zwei Marmorsäulen des 2. Jahrhunderts v. Chr., dem Melqart von Tyrus auf Phönizisch und Griechisch geweiht, gaben den Gelehrten später den Schlüssel zum phönizischen Alphabet."
    - "218 v. Chr., zu Beginn des Zweiten Punischen Krieges, übergab die karthagische Besatzung die Insel dem römischen Konsul Tiberius Sempronius, und Malta wurde der Provinz Sizilien angeschlossen. Seine Hauptstadt, ebenfalls Melite genannt, stand dort, wo heute Mdina und Rabat stehen. Cicero wirft dem Statthalter Verres vor, den alten Tempel der Juno geplündert zu haben, den Piraten und feindliche Flotten stets verschont hatten."
    - "Paulus, als Gefangener nach Rom unterwegs, wurde vor Kreta vom Sturmwind Euroklydon ergriffen und trieb vierzehn Nächte lang „im Adria-Meer“ umher, bis das Schiff auflief und zerbrach; alle an Bord erreichten das Land. Die Inselbewohner „erzeigten uns nicht geringe Freundschaft“, und eine Otter biss sich an der Hand des Paulus fest, ohne ihm zu schaden. Publius, „der Oberste der Insel“, beherbergte sie drei Tage, und Paulus heilte seinen Vater und andere Kranke. Nach drei Monaten fuhren sie in einem alexandrinischen Schiff weiter, das dort überwintert hatte. Griechische und lateinische Inschriften aus Malta nennen denselben Titel, den „Ersten“ der Melitaner."
    - "Dass Melite Malta ist, ist die übliche Ansicht. Adria bedeutete damals das offene Meer zwischen Griechenland, Italien und Afrika, nicht nur das heutige Adriatische Meer; ein Schiff, das ein Nordoststurm von Kreta nach Westen trieb, erreichte Malta in etwa zwei Wochen, wie James Smith 1848 berechnete; und ein alexandrinisches Schiff überwinterte dort auf dem Weg nach Syrakus und Italien. Seit Konstantin Porphyrogennetos im 10. Jahrhundert haben einige den Schiffbruch auf Mljet verlegt, einem anderen Melite in der Adria, und auch andere Inseln wurden vorgeschlagen. Die Überlieferung nennt die St.-Pauls-Bucht. Im 4. Jahrhundert wurden Christen bereits in Katakomben vor den Mauern von Melite bestattet."
  fr:
    - "Mélita est l’île de Malte, en pleine mer, à moins de cent kilomètres au sud de la Sicile. Des cultivateurs vinrent de Sicile à l’époque néolithique, et entre environ 3600 et 2500 av. J.-C. leurs descendants élevèrent les grands temples de pierre de Ġgantija, Ħaġar Qim, Mnajdra et Tarxien. Les Phéniciens s’installèrent plus tard dans l’île ; Diodore en fait une colonie phénicienne aux nombreux ports et aux tisserands de fin lin. Elle passa sous Carthage, et deux piliers de marbre du IIe siècle av. J.-C., dédiés à Melqart de Tyr en phénicien et en grec, donnèrent plus tard aux savants la clé de l’alphabet phénicien."
    - "En 218 av. J.-C., au début de la deuxième guerre punique, la garnison carthaginoise livra l’île au consul romain Tibère Sempronius, et Malte fut rattachée à la province de Sicile. Sa ville principale, appelée aussi Mélita, se trouvait là où se dressent aujourd’hui Mdina et Rabat. Cicéron accuse le gouverneur Verrès d’avoir dépouillé son antique temple de Junon, que les pirates et les flottes ennemies avaient toujours épargné."
    - "Paul, naviguant vers Rome comme prisonnier, fut pris au large de la Crète par le vent Euraquilon ; la quatorzième nuit, ils étaient encore « ballottés sur l’Adriatique », avant que le navire ne s’échoue et ne se brise ; tous à bord gagnèrent la terre. Les insulaires leur témoignèrent « une bienveillance peu commune », et une vipère s’attacha à la main de Paul sans lui faire de mal. Publius, « principal personnage de l’île », les logea trois jours, et Paul guérit son père et d’autres malades. Après trois mois, ils repartirent sur un navire d’Alexandrie qui avait passé l’hiver là. Des inscriptions grecques et latines de Malte donnent le même titre, le « premier » des Mélitains."
    - "Que Mélita soit Malte est l’opinion habituelle. L’Adria désignait alors la haute mer entre la Grèce, l’Italie et l’Afrique, pas seulement l’actuelle Adriatique ; un navire poussé vers l’ouest depuis la Crète par une tempête de nord-est atteindrait Malte en deux semaines environ, comme James Smith le calcula en 1848 ; et un navire d’Alexandrie y hivernerait en route vers Syracuse et l’Italie. Depuis Constantin Porphyrogénète au Xe siècle, certains ont placé le naufrage à Mljet, autre Mélite, dans l’Adriatique, et d’autres îles ont été proposées. La tradition le situe à la baie de Saint-Paul. Dès le IVe siècle, des chrétiens étaient enterrés dans des catacombes hors des murs de Mélita."
