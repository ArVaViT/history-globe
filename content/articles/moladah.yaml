body:
  en:
    - "Moladah was a town of the Negeb, the dry south of Judah around Beer-sheba, known only from lists. Joshua counts it among the southernmost towns of Judah “toward the coast of Edom”, and then among the towns given to Simeon inside Judah's lot: “Beer-sheba, or Sheba, and Moladah”. Chronicles repeats the Simeonite list, and after the exile the men of Judah settled again “at Jeshua, and at Moladah, and at Beth-phelet”. No story is set there, and no prophet names it."
    - "Where it stood is not certain. Josephus tells how Herod Agrippa, ruined and desperate, went to a tower at Malatha in Idumaea, and Eusebius measures distances in the Negeb from Malaatha, which is usually placed at Tel Malhata (Arabic Tell el-Milh), a large mound in the Beer-sheba valley east of the city with a fortified town of the Iron Age, excavated in the 1960s and 1990s. Many scholars take Malatha to be Moladah under a later form of the name, but others give Tel Malhata to Canaanite Arad or Hormah, and the first candidate on the map is Khirbet el-Waten, a smaller site nearer Beer-sheba; Khirbet Kuseife and Tel Yeshua have also been proposed. Nothing found at any of them names the town."
    - "Today the area is the eastern Beer-sheba valley in Israel, between the city and Arad, with Bedouin townships, fields and the excavated mound of Tel Malhata beside the Nevatim air base."
  ru:
    - "Молада — город Негева, сухого юга Иудеи вокруг Вирсавии, известный только по спискам. Иисус Навин числит его среди городов «с края колена сынов Иудиных в смежности с Идумеею на юге», а затем среди городов, отданных Симеону внутри удела Иуды: «Вирсавия или Шева, Молада». Паралипоменон повторяет симеоновский список, а после плена сыны Иуды снова поселились «в Иешуе, в Моладе и в Беф-Палете». Никакое событие там не происходит, и ни один пророк его не называет."
    - "Где он стоял, неизвестно точно. Иосиф Флавий рассказывает, как разорённый и отчаявшийся Ирод Агриппа пошёл к башне в Малафе в Идумее, а Евсевий отмеряет расстояния в Негеве от Малаафы, которую обычно помещают в Тель-Малхате (по-арабски Телль-эль-Мильх), большом холме в долине Вирсавии к востоку от города, с укреплённым городом железного века, раскопанным в 1960-х и 1990-х годах. Многие учёные считают Малафу позднейшей формой имени Молада, но другие отдают Тель-Малхату ханаанскому Араду или Хорме, а первый кандидат на карте — Хирбет-эль-Ватен, меньшее городище ближе к Вирсавии; предлагали также Хирбет-Кусейфе и Тель-Иешуа. Ни на одном из них не найдено ничего с именем города."
    - "Сегодня это восточная часть долины Беэр-Шевы в Израиле, между городом и Арадом, с бедуинскими посёлками, полями и раскопанным холмом Тель-Малхата рядом с авиабазой Неватим."
  uk:
    - "Молада була містом Негеву, сухого півдня Юди навколо Беер-Шеви, відомим лише з переліків. Ісус Навин зараховує її до найпівденніших міст Юди «проти гряницї Ідумейської», а потім до міст, даних Симеонові в уділі Юди: «Вирсавія, Саба і Молада». Книга Хронік повторює симеонівський перелік, а після полону люди Юди знову оселилися «В Ешуї, в Моладї й Бет-Палетї». Жодної історії там не розповідається, і жоден пророк її не називає."
    - "Де вона стояла, непевно. Йосиф Флавій розповідає, як Ірод Агриппа, розорений і зневірений, пішов до вежі в Малаті в Ідумеї, а Євсевій міряє відстані в Негеві від Малаати, яку зазвичай розміщують у Тель-Малхаті (арабською Телль-ель-Мільх), великому пагорбі в долині Беер-Шеви на схід від міста, з укріпленим містом залізної доби, розкопаним у 1960-х і 1990-х рр. Багато вчених уважають Малату Моладою в пізнішій формі назви, але інші віддають Тель-Малхату ханаанському Араду або Горме, і перший кандидат на мапі — Хірбет-ель-Ватен, менше поселення ближче до Беер-Шеви; пропонували також Хірбет-Кусейфе й Тель-Єшуа. Нічого, знайденого в жодному з них, не називає міста."
    - "Сьогодні ця місцевість — східна долина Беер-Шеви в Ізраїлі, між містом і Арадом, з бедуїнськими містечками, полями та розкопаним пагорбом Тель-Малхата поруч із авіабазою Неватім."
  es:
    - "Molada era una ciudad del Néguev, el seco sur de Judá en torno a Beerseba, conocida solo por listas. Josué la cuenta entre las ciudades más meridionales de Judá «hacia el término de Edom», y después entre las ciudades dadas a Simeón dentro de la suerte de Judá: «Beer-seba, Seba, y Molada». Crónicas repite la lista de Simeón, y tras el destierro los hombres de Judá se establecieron de nuevo «en Jesuá, Moladah, y en Beth-pelet». No se ambienta allí ningún relato, y ningún profeta la nombra."
    - "No es seguro dónde estaba. Josefo cuenta cómo Herodes Agripa, arruinado y desesperado, fue a una torre en Malatha, en Idumea, y Eusebio mide distancias en el Néguev desde Malaatha, que suele situarse en Tel Malhata (en árabe Tell el-Milh), un gran montículo en el valle de Beerseba, al este de la ciudad, con una ciudad fortificada de la Edad del Hierro, excavado en los años sesenta y noventa. Muchos estudiosos toman Malatha por Molada bajo una forma posterior del nombre, pero otros dan Tel Malhata a la cananea Arad o a Horma, y el primer candidato del mapa es Khirbet el-Waten, un sitio menor más cercano a Beerseba; también se han propuesto Khirbet Kuseife y Tel Yeshua. Nada hallado en ninguno nombra la ciudad."
    - "Hoy la zona es el valle oriental de Beerseba, en Israel, entre la ciudad y Arad, con poblados beduinos, campos y el montículo excavado de Tel Malhata junto a la base aérea de Nevatim."
  pt:
    - "Moladá era uma cidade do Neguebe, o seco sul de Judá em torno de Berseba, conhecida só por listas. Josué a conta entre as cidades mais meridionais de Judá “em direção à fronteira de Edom”, e depois entre as cidades dadas a Simeão dentro do lote de Judá: “Berseba (ou Seba), Moladá”. As Crônicas repetem a lista simeonita, e depois do exílio os homens de Judá se estabeleceram de novo “em Jesua, em Molada, em Bete-Pelete”. Nenhuma história se passa ali, e nenhum profeta a nomeia."
    - "Onde ficava não é certo. Josefo conta como Herodes Agripa, arruinado e desesperado, foi a uma torre em Malatha, na Iduméia, e Eusébio mede distâncias no Neguebe a partir de Malaatha, que costuma ser situada em Tel Malhata (em árabe Tell el-Milh), um grande montículo no vale de Berseba, a leste da cidade, com uma cidade fortificada da Idade do Ferro, escavada nas décadas de 1960 e 1990. Muitos estudiosos tomam Malatha por Moladá numa forma posterior do nome, mas outros dão Tel Malhata à cananeia Arade ou a Hormá, e o primeiro candidato no mapa é Khirbet el-Waten, um sítio menor mais perto de Berseba; Khirbet Kuseife e Tel Yeshua também foram propostos. Nada achado em qualquer deles nomeia a cidade."
    - "Hoje a área é o vale oriental de Berseba, em Israel, entre a cidade e Arade, com municípios beduínos, campos e o montículo escavado de Tel Malhata junto à base aérea de Nevatim."
  de:
    - "Molada war eine Stadt des Negev, des trockenen Südens Judas um Beerscheba, nur aus Listen bekannt. Josua zählt sie zu den südlichsten Städten Judas „an der Grenze der Edomiter gegen Mittag“ und dann zu den Städten, die Simeon innerhalb von Judas Los erhielt: „Beer-Seba, Seba, Molada“. Die Chronik wiederholt die simeonitische Liste, und nach dem Exil siedelten die Männer Judas wieder dort, wo es heißt: „und zu Jesua, Molada, Beth-Pelet“. Keine Geschichte spielt dort, und kein Prophet nennt sie."
    - "Wo sie stand, ist nicht sicher. Josephus erzählt, wie Herodes Agrippa, ruiniert und verzweifelt, zu einem Turm bei Malatha in Idumäa ging, und Eusebius misst Entfernungen im Negev von Malaatha aus, das man gewöhnlich in Tel Malhata (arabisch Tell el-Milh) ansetzt, einem großen Hügel im Tal von Beerscheba östlich der Stadt mit einer befestigten Stadt der Eisenzeit, in den 1960er und 1990er Jahren ausgegraben. Viele Gelehrte halten Malatha für Molada in späterer Namensform, andere geben Tel Malhata dem kanaanäischen Arad oder Horma, und der erste Kandidat auf der Karte ist Khirbet el-Waten, ein kleinerer Ort näher bei Beerscheba; auch Khirbet Kuseife und Tel Yeshua wurden vorgeschlagen. Nichts, was an einem von ihnen gefunden wurde, nennt die Stadt."
    - "Heute ist das Gebiet das östliche Tal von Beerscheba in Israel, zwischen der Stadt und Arad, mit Beduinenstädten, Feldern und dem ausgegrabenen Hügel Tel Malhata neben dem Luftwaffenstützpunkt Nevatim."
  fr:
    - "Molada était une ville du Négev, le sud aride de Juda autour de Beer-Schéba, connue seulement par des listes. Josué la compte parmi les villes les plus méridionales de Juda « vers la frontière d’Édom », puis parmi les villes données à Siméon dans le lot de Juda : « Beer-Schéba, Schéba, Molada ». Les Chroniques répètent la liste de Siméon, et après l’exil les hommes de Juda s’installèrent de nouveau « à Jéschua, à Molada, à Beth-Paleth ». Aucune histoire ne s’y déroule, et aucun prophète ne la nomme."
    - "Où elle se dressait n’est pas certain. Flavius Josèphe raconte comment Hérode Agrippa, ruiné et désespéré, alla dans une tour de Malatha en Idumée, et Eusèbe mesure les distances dans le Négev à partir de Malaatha, que l’on place d’ordinaire à Tel Malhata (en arabe Tell el-Milh), grand tertre de la vallée de Beer-Schéba à l’est de la ville, avec une ville fortifiée de l’âge du Fer, fouillée dans les années 1960 et 1990. Beaucoup de savants tiennent Malatha pour Molada sous une forme plus tardive du nom, mais d’autres donnent Tel Malhata à Arad cananéenne ou à Horma, et le premier candidat de la carte est Khirbet el-Waten, site plus petit plus près de Beer-Schéba ; Khirbet Kuseife et Tel Yeshua ont aussi été proposés. Rien de ce qu’on a trouvé dans aucun d’eux ne nomme la ville."
    - "Aujourd’hui, la région est la vallée orientale de Beer-Schéba, en Israël, entre la ville et Arad, avec des villes bédouines, des champs et le tertre fouillé de Tel Malhata à côté de la base aérienne de Nevatim."
  it:
    - "Molada era una città del Negheb, il secco sud di Giuda intorno a Bersabea, nota solo dagli elenchi. Giosuè la annovera tra le città più meridionali di Giuda «verso il confine di Edom», e poi tra le città date a Simeone entro la porzione di Giuda: «Beer-Sceba, Sceba, Molada». Le Cronache ripetono l’elenco simeonita, e dopo l’esilio gli uomini di Giuda si stabilirono di nuovo «in Jeshua, in Molada in Beth-Paleth». Nessuna storia vi è ambientata, e nessun profeta la nomina."
    - "Dove sorgesse non è certo. Giuseppe Flavio racconta come Erode Agrippa, rovinato e disperato, andò a una torre a Malata in Idumea, ed Eusebio misura le distanze nel Negheb da Malaatha, che di solito si colloca a Tel Malhata (in arabo Tell el-Milh), un grande tell nella valle di Bersabea a est della città, con una città fortificata dell’età del Ferro, scavata negli anni Sessanta e Novanta. Molti studiosi ritengono Malata la stessa Molada sotto una forma tarda del nome, ma altri attribuiscono Tel Malhata ad Arad cananea o a Corma, e il primo candidato sulla mappa è Khirbet el-Waten, un sito più piccolo vicino a Bersabea; sono stati proposti anche Khirbet Kuseife e Tel Yeshua. Nulla di ciò che vi è stato trovato nomina la città."
    - "Oggi la zona è la valle orientale di Bersabea in Israele, tra la città e Arad, con centri beduini, campi e il tell scavato di Tel Malhata accanto alla base aerea di Nevatim."
  pl:
    - "Molada było miastem Negewu, suchego południa Judy wokół Beer-Szeby, znanym tylko z list. Jozue zalicza je do najdalej na południe wysuniętych miast Judy „podle granicy Edom ku południowi”, a potem do miast oddanych Symeonowi w losie Judy: „Beerseba, i Seba, i Molada”. Księga Kronik powtarza listę symeonicką, a po niewoli mężowie Judy osiedlili się znów „w Jesue, i w Molada, i w Betfelet”. Nie ma tam żadnej opowieści i żaden prorok jej nie wymienia."
    - "Gdzie stało, nie jest pewne. Józef Flawiusz opowiada, jak Herod Agryppa, zrujnowany i zdesperowany, poszedł do wieży w Malatha w Idumei, a Euzebiusz mierzy odległości w Negewie od Malaatha, które zwykle umieszcza się w Tel Malhata (po arabsku Tell el-Milh), dużym kopcu w dolinie Beer-Szeby na wschód od miasta z obwarowanym miastem z epoki żelaza, wykopywanym w latach sześćdziesiątych i dziewięćdziesiątych XX w. Wielu uczonych uważa Malatha za Moladę w późniejszej formie nazwy, lecz inni dają Tel Malhata kananejskiemu Aradowi albo Hormie, a pierwszym kandydatem na mapie jest Khirbet el-Waten, mniejsze stanowisko bliżej Beer-Szeby; proponowano też Khirbet Kuseife i Tel Yeshua. Nic znalezionego w żadnym z nich nie wymienia miasta."
    - "Dziś obszar to wschodnia dolina Beer-Szeby w Izraelu, między miastem a Aradem, z beduińskimi miasteczkami, polami i wykopanym kopcem Tel Malhata obok bazy lotniczej Nevatim."
  nl:
    - "Molada was een stad in de Negev, het droge zuiden van Juda rond Berseba, alleen uit lijsten bekend. Jozua rekent het onder de zuidelijkste steden van Juda “tot de landpale van Edom”, en daarna onder de steden die aan Simeon werden gegeven binnen Juda's lot: “Beer-seba, en Seba, en Molada”. Kronieken herhaalt de lijst van Simeon, en na de ballingschap vestigden de mannen van Juda zich weer “te Jesua, en te Molada, en te Beth-Pelet”. Er is geen verhaal aan verbonden, en geen profeet noemt het."
    - "Waar het stond, is niet zeker. Josephus vertelt hoe Herodes Agrippa, geruïneerd en wanhopig, naar een toren te Malatha in Idumea ging, en Eusebius meet afstanden in de Negev vanaf Malaatha, dat gewoonlijk bij Tel Malhata (Arabisch Tell el-Milh) wordt gezocht, een grote heuvel in de Bersebavallei ten oosten van de stad met een versterkte stad uit de ijzertijd, opgegraven in de jaren zestig en negentig. Veel geleerden houden Malatha voor Molada onder een latere vorm van de naam, maar anderen geven Tel Malhata aan het Kanaänitische Arad of Chorma, en de eerste kandidaat op de kaart is Khirbet el-Waten, een kleinere plaats dichter bij Berseba; ook Khirbet Kuseife en Tel Yeshua zijn voorgesteld. Niets wat bij een ervan is gevonden, noemt de stad."
    - "Tegenwoordig is het gebied de oostelijke Bersebavallei in Israël, tussen de stad en Arad, met bedoeïenendorpen, velden en de opgegraven heuvel Tel Malhata naast de luchtmachtbasis Nevatim."
  cs:
    - "Molada bylo město Negevu, suchého jihu Judy kolem Beer-šeby, známé jen ze seznamů. Jozue je počítá mezi nejjižnější města Judy „podlé pomezí Edom“ a pak mezi města dána Simeonovi uvnitř losu Judova: „Bersabé, Seba a Molada“. Kroniky Simeonův seznam opakují a po exilu se Judští usadili znovu „v Jesua, v Molada, v Betfelet“. Nic se tam neodehrává a žádný prorok je nejmenuje."
    - "Kde stálo, není jisté. Josephus vypráví, jak Herodes Agrippa, zničený a zoufalý, odešel do věže v Malathě v Idumeji, a Eusebius měří vzdálenosti v Negevu od Malaathy, která se obvykle klade do Tel Malhata (arabsky Tell el-Milh), velkém pahorku v údolí Beer-šeby východně od města s opevněným městem z doby železné, vykopaným v 60. a 90. letech. Mnozí badatelé pokládají Malathu za Moladu v pozdější podobě jména, jiní však dávají Tel Malhata kanaánskému Aradu nebo Chormě a prvním kandidátem na mapě je Khirbet el-Waten, menší naleziště blíže Beer-šebě; navrženy byly také Khirbet Kuseife a Tel Yeshua. Nic nalezeného na žádném z nich město nejmenuje."
    - "Dnes je oblast východním údolím Beer-šeby v Izraeli, mezi městem a Aradem, s beduínskými městečky, poli a vykopaným pahorkem Tel Malhata vedle letecké základny Nevatim."
  sv:
    - "Molada var en stad i Negev, Judas torra söder kring Beer Sheva, känd endast från förteckningar. Josua räknar den bland Judas sydligaste städer ”mot Edoms gräns”, och sedan bland de städer som gavs åt Simeon inom Judas lott: ”Beer-Seba, Seba, Molada”. Krönikeböckerna upprepar den simeonitiska förteckningen, och efter exilen bosatte sig Judas män åter ”i Jesua, Molada, Bet-Pelet”. Ingen berättelse utspelar sig där, och ingen profet nämner den."
    - "Var den låg är inte säkert. Josefus berättar hur Herodes Agrippa, ruinerad och desperat, begav sig till ett torn i Malatha i Idumeen, och Eusebios mäter avstånd i Negev från Malaatha, som vanligen förläggs till Tel Malhata (arabiska Tell el-Milh), en stor kulle i Beer Sheva-dalen öster om staden med en befäst stad från järnåldern, utgrävd på 1960- och 1990-talen. Många forskare tar Malatha för Molada under en senare namnform, men andra ger Tel Malhata åt det kanaaneiska Arad eller Horma, och kartans första kandidat är Khirbet el-Waten, en mindre plats närmare Beer Sheva; Khirbet Kuseife och Tel Yeshua har också föreslagits. Ingenting som hittats vid någon av dem nämner staden."
    - "I dag är området östra Beer Sheva-dalen i Israel, mellan staden och Arad, med beduinsamhällen, fält och den utgrävda kullen Tel Malhata intill flygbasen Nevatim."
  nb:
    - "Molada var en by i Negev, det tørre sørlige Juda omkring Beer-Sjeba, kjent bare fra lister. Josva regner den blant de sørligste byene i Juda «mot Edoms landemerke», og deretter blant byene gitt til Simeon innenfor Judas lodd: «Be'er-seba og Seba og Molada». Krønikebøkene gjentar Simeon-listen, og etter eksilet bosatte Judas menn seg igjen «i Jesua, Molada, Bet-Pelet». Ingen fortelling er knyttet til stedet, og ingen profet nevner det."
    - "Hvor den lå, er ikke sikkert. Josefus forteller hvordan Herodes Agrippa, ruinert og fortvilet, dro til et tårn i Malatha i Idumea, og Eusebius måler avstander i Negev fra Malaatha, som vanligvis plasseres ved Tel Malhata (arabisk Tell el-Milh), en stor haug i Beer-Sjeba-dalen øst for byen med en befestet by fra jernalderen, utgravd i 1960-årene og 1990-årene. Mange forskere tar Malatha for å være Molada under en senere navneform, men andre gir Tel Malhata til det kanaanittiske Arad eller Horma, og kartets første kandidat er Khirbet el-Waten, et mindre sted nærmere Beer-Sjeba; Khirbet Kuseife og Tel Yeshua er også foreslått. Ingenting funnet på noen av dem navngir byen."
    - "I dag er området den østlige Beer-Sjeba-dalen i Israel, mellom byen og Arad, med beduinbyer, marker og den utgravde haugen Tel Malhata ved siden av flybasen Nevatim."
  tl:
    - "Ang Molada ay bayan ng Negeb, ang tuyong timog ng Juda sa palibot ng Beer-seba, na kilala lamang mula sa mga talaan. Ibinibilang ito ni Josue sa pinakatimugang mga bayan ng Juda “sa dako ng hangganan ng Edom sa timugan”, at pagkatapos ay sa mga bayang ibinigay sa Simeon sa loob ng bahagi ng Juda: “ang Beerseba, o Seba, at Molada”. Inuulit ng Mga Cronica ang talaan ng Simeon, at pagkatapos ng pagkatapon ay nanirahang muli ang mga taga-Juda “sa Jesua, at sa Moladah, at sa Beth-pelet”. Walang kuwentong itinakda roon, at walang propetang nagpapangalan dito."
    - "Hindi tiyak kung saan ito nakatayo. Isinasalaysay ni Josefo kung paanong si Herodes Agripa, lubog sa utang at desperado, ay pumunta sa isang tore sa Malatha sa Idumea, at sinusukat ni Eusebio ang mga distansya sa Negeb mula sa Malaatha, na karaniwang inilalagay sa Tel Malhata (Arabe Tell el-Milh), isang malaking burol sa libis ng Beer-seba sa silangan ng lungsod na may kutang bayan ng Panahon ng Bakal, na hinukay noong dekada 1960 at 1990. Maraming iskolar ang nagtuturing na ang Malatha ay Molada sa kalaunang anyo ng pangalan, ngunit ibinibigay ng iba ang Tel Malhata sa Cananeong Arad o Horma, at ang unang kandidato sa mapa ay ang Khirbet el-Waten, isang mas maliit na pook na mas malapit sa Beer-seba; iminungkahi rin ang Khirbet Kuseife at Tel Yeshua. Walang natagpuan sa alinman na nagpapangalan sa bayan."
    - "Ang lugar ngayon ay ang silangang libis ng Beer-seba sa Israel, sa pagitan ng lungsod at ng Arad, na may mga bayang Bedouin, bukid at ang hinukay na burol ng Tel Malhata sa tabi ng himpilang panghimpapawid ng Nevatim."
  da:
    - "Molada var en by i Negev, det tørre Sydjuda omkring Beersheba, kun kendt fra lister. Josva regner den blandt Judas sydligste byer »op mod Edoms Landemærke«, og dernæst blandt de byer, der blev givet til Simeon inden for Judas lod: »Beersaba og Seba og Molada«. Krønikebøgerne gentager Simeons liste, og efter eksilet bosatte Judas mænd sig igen »i Jesua og i Molada og i Beth-Peleth«. Ingen historie er knyttet til stedet, og ingen profet nævner det."
    - "Hvor den lå, er ikke sikkert. Josefus fortæller, hvordan Herodes Agrippa, ruineret og desperat, gik til et tårn ved Malatha i Idumæa, og Eusebios måler afstande i Negev fra Malaatha, som sædvanligvis placeres ved Tel Malhata (arabisk Tell el-Milh), en stor høj i Beersheba-dalen øst for byen med en befæstet jernalderby, udgravet i 1960'erne og 1990'erne. Mange forskere tager Malatha for at være Molada under en senere form af navnet, men andre giver Tel Malhata til det kana'anæiske Arad eller Horma, og kortets første kandidat er Khirbet el-Waten, et mindre sted nærmere Beersheba; Khirbet Kuseife og Tel Yeshua er også blevet foreslået. Intet fundet ved nogen af dem nævner byen."
    - "I dag er området den østlige Beersheba-dal i Israel, mellem byen og Arad, med beduinbyer, marker og den udgravede høj Tel Malhata ved siden af Nevatim-flybasen."
  sr:
    - "Молада је био град у Негеву, сувом југу Јуде око Вирсавеје, познат само из списака. Исус Навин га убраја међу најјужније градове Јуде „дуж међе едомске к југу“, а затим међу градове дате Симеуну у Јудином делу: „Вирсавеја и Савеја и Молада“. Летописи понављају симеунски списак, а после изгнанства Јудејци су се поново настанили „у Јесуји и Молади и Вет-Фелету“. Ниједна прича није смештена тамо, и ниједан пророк га не именује."
    - "Где је стајао, није сигурно. Јосиф Флавије приповеда како је Ирод Агрипа, упропашћен и очајан, отишао у кулу у Малати у Идумеји, а Јевсевије мери удаљености у Негеву од Малаате, која се обично смешта у Тел Малхату (арапски Тел ел-Милх), велику хумку у долини Вирсавеје источно од града с утврђеним градом гвозденог доба, ископавану 1960-их и 1990-их. Многи научници узимају да је Малата Молада под каснијим обликом имена, али други Тел Малхату дају ханаанском Араду или Хорми, а први кандидат на мапи је Хирбет ел-Ватен, мање налазиште ближе Вирсавеји; предлагани су и Хирбет Кусејфе и Тел Јешуа. Ништа нађено ни на једном од њих не именује град."
    - "Данас је то подручје источна долина Вирсавеје у Израелу, између града и Арада, са бедуинским насељима, њивама и ископаном хумком Тел Малхата крај ваздухопловне базе Неватим."
  hu:
    - "Moláda a Negev, Júda Beérseba körüli száraz déli részének városa volt, csak jegyzékekből ismert. Józsué Júda legdélibb városai közé számítja, „Edom határa felé”, majd Simeonnak Júda osztályrészén belül adott városai közé: „Beer-Seba, Seba és Móláda”. A Krónikák megismétli a simeoni jegyzéket, és a száműzetés után Júda férfiai ismét letelepedtek „Jésuában, Móladában és Beth-Péletben”. Nem helyeznek oda történetet, és próféta sem nevezi meg."
    - "Hogy hol állt, nem biztos. Josephus elmeséli, hogy Heródes Agrippa, tönkrement és kétségbeesett, Idumeában egy Malathánál lévő toronyba ment, Eusebius pedig a Negev távolságait Malaathától méri, amelyet rendszerint a Tel Malhatánál (arabul Tell el-Milh) keresnek, a Beérseba-völgy nagy halmánál a várostól keletre, vaskori erődített várossal, amelyet az 1960-as és 1990-es években ástak. Sok tudós Malathát Moládának tartja a név későbbi alakjában, mások azonban a Tel Malhatát a kánaáni Arádnak vagy Hormának adják, a térkép első jelöltje pedig a Khirbet el-Waten, kisebb hely Beérsebához közelebb; javasolták még a Khirbet Kuseifét és a Tel Yeshuát. Semmi, amit bármelyiken találtak, nem nevezi meg a várost."
    - "Ma a terület a keleti Beérseba-völgy Izraelben, a város és Arád között, beduin településekkel, mezőkkel és a Nevatim légitámaszpont melletti kiásott Tel Malhata halommal."
  fi:
    - "Molada oli Negevin, Beersebaa ympäröivän Juudan kuivan eteläosan, kaupunki, joka tunnetaan vain luetteloista. Joosua laskee sen Juudan eteläisimpiin kaupunkeihin ”Edomin rajalla” ja sitten Simeonille Juudan arpaosan sisällä annettuihin kaupunkeihin: ”Beerseba, Seba, Moolada”. Aikakirjat toistavat simeonilaisten luettelon, ja pakkosiirtolaisuuden jälkeen juudalaiset asettuivat jälleen ”Jeesuassa, Mooladassa, Beet-Peletissä”. Mitään tarinaa ei sijoiteta sinne, eikä yksikään profeetta nimeä sitä."
    - "Missä se sijaitsi, ei ole varmaa. Josephus kertoo, kuinka Herodes Agrippa, perikatoon ajautuneena ja epätoivoisena, meni Malathan torniin Idumeassa, ja Eusebios mittaa etäisyydet Negevissä Malaathasta, joka yleensä sijoitetaan Tel Malhataan (arabiaksi Tell el-Milh), suureen kumpuun Beerseban laaksossa kaupungista itään, jossa on rautakautinen linnoitettu kaupunki, kaivettu 1960- ja 1990-luvuilla. Monet tutkijat pitävät Malathaa Moladan myöhempänä nimimuotona, mutta toiset antavat Tel Malhatan kanaanilaiselle Aradille tai Hormalle, ja kartan ensimmäinen ehdokas on Khirbet el-Waten, pienempi paikka lähempänä Beersebaa; myös Khirbet Kuseifea ja Tel Yeshuaa on ehdotettu. Mikään niistä löydetty ei nimeä kaupunkia."
    - "Nykyään alue on Beerseban itäinen laakso Israelissa, kaupungin ja Aradin välissä, beduiinikyliä, peltoja ja kaivettu Tel Malhatan kumpu Nevatimin lentotukikohdan vieressä."
  vi:
    - "Mô-la-đa là một thành của Nê-ghép, miền nam khô của Giu-đa quanh Bê-e-Sê-ba, chỉ được biết qua các danh sách. Giô-suê kể nó trong các thành cực nam của Giu-đa “về phía ranh Ê-đôm tại miền nam”, rồi trong các thành cấp cho Si-mê-ôn bên trong phần đất của Giu-đa: “Bê-e-Sê-ba, Sê-ba, Mô-la-đa”. Sách Sử ký lặp lại danh sách của Si-mê-ôn, và sau thời lưu đày người Giu-đa lại định cư “tại Giê-sua, Mô-la-đa, Bết-phê-lê”. Không câu chuyện nào đặt ở đó, và không nhà tiên tri nào nêu tên."
    - "Thành đứng ở đâu không chắc chắn. Josephus kể Hê-rốt Ạc-ríp-ba, sạt nghiệp và tuyệt vọng, đến một tháp ở Malatha trong Y-đu-mê, và Eusebius đo các khoảng cách ở Nê-ghép từ Malaatha, thường được đặt tại Tel Malhata (tiếng Ả Rập Tell el-Milh), một gò lớn trong thung lũng Bê-e-Sê-ba phía đông thành phố có thị trấn kiên cố thời Đồ Sắt, được khai quật trong thập niên 1960 và 1990. Nhiều học giả coi Malatha là Mô-la-đa dưới dạng tên về sau, nhưng những người khác gán Tel Malhata cho A-rát của người Ca-na-an hay Họt-ma, và ứng viên đầu tiên trên bản đồ là Khirbet el-Waten, địa điểm nhỏ hơn gần Bê-e-Sê-ba hơn; Khirbet Kuseife và Tel Yeshua cũng được đề nghị. Không gì tìm thấy ở nơi nào nêu tên thành."
    - "Ngày nay khu vực là phía đông thung lũng Bê-e-Sê-ba ở Israel, giữa thành phố và A-rát, với các thị trấn Bedouin, ruộng đồng và gò Tel Malhata đã khai quật bên căn cứ không quân Nevatim."
  ro:
    - "Molada era o cetate din Neghev, sudul uscat al lui Iuda din jurul Beer-Șebei, cunoscută numai din liste. Iosua o numără printre cele mai sudice cetăți ale lui Iuda, spre hotarul Edomului, și apoi printre cetățile date lui Simeon în partea lui Iuda: „Virsaviea, Save, Molada”. Cronicile repetă lista lui Simeon, iar după exil oamenii lui Iuda s-au așezat din nou „în Iisu și în Moloda și în Vitfalat”. Nicio poveste nu se petrece acolo, și niciun proroc nu o numește."
    - "Unde se afla nu este sigur. Iosif Flaviu povestește cum Irod Agripa, ruinat și disperat, s-a dus la un turn din Malatha în Idumeea, iar Eusebiu măsoară distanțele din Neghev de la Malaatha, care se plasează de obicei la Tel Malhata (în arabă Tell el-Milh), o mare movilă din valea Beer-Șeba, la est de oraș, cu o cetate întărită din epoca fierului, excavată în anii 1960 și 1990. Mulți cercetători socotesc Malatha drept Molada sub o formă ulterioară a numelui, dar alții dau Tel Malhata Aradului canaanit sau Hormei, iar primul candidat de pe hartă este Khirbet el-Waten, un sit mai mic, mai aproape de Beer-Șeba; au fost propuse și Khirbet Kuseife și Tel Yeshua. Nimic din ce s-a găsit la vreunul nu numește cetatea."
    - "Astăzi zona este valea Beer-Șeba de est din Israel, între oraș și Arad, cu orașe beduine, câmpuri și movila excavată Tel Malhata de lângă baza aeriană Nevatim."
  bg:
    - "Молада е бил град в Негев — сухия юг на Юда около Вирсавия, известен само от списъци. Иисус Навин го брои сред най-южните градове на Юда „към пределите на Едом“, а после сред градовете, дадени на Симеон в дела на Юда: „Вирсавее, (и Савее,) и Молада“. Летописи повтарят Симеоновия списък, а след изгнанието юдеите отново се заселиха „в Иисуя, и в Молада, и в Вет-фелед“. Никакъв разказ не се развива там и никой пророк не го назовава."
    - "Къде е стоял, не е сигурно. Йосиф Флавий разказва как Ирод Агрипа, разорен и отчаян, отишъл в една кула в Малата в Идумея, а Евсевий измерва разстоянията в Негев от Малаата, която обикновено се поставя в Тел Малхата (на арабски Тел ел-Милх) — голям хълм в долината на Вирсавия източно от града, с укрепен град от желязната епоха, разкопан през 1960-те и 1990-те години. Много учени смятат Малата за Молада под по-късна форма на името, но други отреждат Тел Малхата на ханаанския Арад или на Хорма, а първият кандидат на картата е Хирбет ел-Уатен, по-малък обект по-близо до Вирсавия; предлагани са също Хирбет Кусейфе и Тел Йешуа. Нищо намерено на някое от тези места не назовава града."
    - "Днес районът е източната част на долината на Вирсавия в Израел, между града и Арад, с бедуински селища, ниви и разкопания хълм Тел Малхата до военновъздушната база Неватим."
