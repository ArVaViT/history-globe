body:
  en:
    - "Moladah was a town of the Negeb, the dry south of Judah around Beer-sheba, known only from lists. Joshua counts it among the southernmost towns of Judah “toward the coast of Edom”, and then among the towns given to Simeon inside Judah's lot: “Beer-sheba, or Sheba, and Moladah”. Chronicles repeats the Simeonite list, and after the exile the men of Judah settled again “at Jeshua, and at Moladah, and at Beth-phelet”. No story is set there, and no prophet names it."
    - "Where it stood is not certain. Josephus tells how Herod Agrippa, ruined and desperate, went to a tower at Malatha in Idumaea, and Eusebius measures distances in the Negeb from the fort of Malaatha; that name survives at Tel Malhata, a large mound in the Beer-sheba valley east of the city with a fortified town of the Iron Age, excavated in the 1960s and 1990s. Many scholars take Malatha to be Moladah under a later form of the name, but others give Tel Malhata to Canaanite Arad or Hormah, and the first candidate on the map is Khirbet el-Waten, a smaller site nearer Beer-sheba; Khirbet Kuseife and Tel Yeshua have also been proposed. Nothing found at any of them names the town."
    - "Today the area is the eastern Beer-sheba valley in Israel, between the city and Arad, with Bedouin townships, fields and the excavated mound of Tel Malhata beside the Nevatim air base."
  ru:
    - "Молада — город Негева, сухого юга Иудеи вокруг Вирсавии, известный только по спискам. Иисус Навин числит его среди городов «с края колена сынов Иудиных в смежности с Идумеею на юге», а затем среди городов, отданных Симеону внутри удела Иуды: «Вирсавия или Шева, Молада». Паралипоменон повторяет симеоновский список, а после плена сыны Иуды снова поселились «в Иешуе, в Моладе и в Беф-Палете». Никакое событие там не происходит, и ни один пророк его не называет."
    - "Где он стоял, неизвестно точно. Иосиф Флавий рассказывает, как разорённый и отчаявшийся Ирод Агриппа пошёл к башне в Малафе в Идумее, а Евсевий отмеряет расстояния в Негеве от крепости Малаафа; это имя сохранилось в Тель-Малхате, большом холме в долине Вирсавии к востоку от города, с укреплённым городом железного века, раскопанным в 1960-х и 1990-х годах. Многие учёные считают Малафу позднейшей формой имени Молада, но другие отдают Тель-Малхату ханаанскому Араду или Хорме, а первый кандидат на карте — Хирбет-эль-Ватен, меньшее городище ближе к Вирсавии; предлагали также Хирбет-Кусейфе и Тель-Иешуа. Ни на одном из них не найдено ничего с именем города."
    - "Сегодня это восточная часть долины Беэр-Шевы в Израиле, между городом и Арадом, с бедуинскими посёлками, полями и раскопанным холмом Тель-Малхата рядом с авиабазой Неватим."
  uk:
    - "Молада була містом Негеву, сухого півдня Юди навколо Беер-Шеви, відомим лише з переліків. Ісус Навин зараховує її до найпівденніших міст Юди «проти гряницї Ідумейської», а потім до міст, даних Симеонові в уділі Юди: «Вирсавія, Саба і Молада». Книга Хронік повторює симеонівський перелік, а після полону люди Юди знову оселилися «В Ешуї, в Моладї й Бет-Палетї». Жодної історії там не розповідається, і жоден пророк її не називає."
    - "Де вона стояла, непевно. Йосиф Флавій розповідає, як Ірод Агриппа, розорений і зневірений, пішов до вежі в Малаті в Ідумеї, а Євсевій міряє відстані в Негеві від форту Малаата; ця назва зберігається в Тель-Малхаті, великому пагорбі в долині Беер-Шеви на схід від міста, з укріпленим містом залізної доби, розкопаним у 1960-х і 1990-х рр. Багато вчених уважають Малату Моладою в пізнішій формі назви, але інші віддають Тель-Малхату ханаанському Араду або Горме, і перший кандидат на мапі — Хірбет-ель-Ватен, менше поселення ближче до Беер-Шеви; пропонували також Хірбет-Кусейфе й Тель-Єшуа. Нічого, знайденого в жодному з них, не називає міста."
    - "Сьогодні ця місцевість — східна долина Беер-Шеви в Ізраїлі, між містом і Арадом, з бедуїнськими містечками, полями та розкопаним пагорбом Тель-Малхата поруч із авіабазою Неватім."
  es:
    - "Molada era una ciudad del Néguev, el seco sur de Judá en torno a Beerseba, conocida solo por listas. Josué la cuenta entre las ciudades más meridionales de Judá «hacia el término de Edom», y después entre las ciudades dadas a Simeón dentro de la suerte de Judá: «Beer-seba, Seba, y Molada». Crónicas repite la lista de Simeón, y tras el destierro los hombres de Judá se establecieron de nuevo «en Jesuá, Moladah, y en Beth-pelet». No se ambienta allí ningún relato, y ningún profeta la nombra."
    - "No es seguro dónde estaba. Josefo cuenta cómo Herodes Agripa, arruinado y desesperado, fue a una torre en Malatha, en Idumea, y Eusebio mide distancias en el Néguev desde el fuerte de Malaatha; ese nombre sobrevive en Tel Malhata, un gran montículo en el valle de Beerseba, al este de la ciudad, con una ciudad fortificada de la Edad del Hierro, excavado en los años sesenta y noventa. Muchos estudiosos toman Malatha por Molada bajo una forma posterior del nombre, pero otros dan Tel Malhata a la cananea Arad o a Horma, y el primer candidato del mapa es Khirbet el-Waten, un sitio menor más cercano a Beerseba; también se han propuesto Khirbet Kuseife y Tel Yeshua. Nada hallado en ninguno nombra la ciudad."
    - "Hoy la zona es el valle oriental de Beerseba, en Israel, entre la ciudad y Arad, con poblados beduinos, campos y el montículo excavado de Tel Malhata junto a la base aérea de Nevatim."
  pt:
    - "Moladá era uma cidade do Neguebe, o seco sul de Judá em torno de Berseba, conhecida só por listas. Josué a conta entre as cidades mais meridionais de Judá “em direção à fronteira de Edom”, e depois entre as cidades dadas a Simeão dentro do lote de Judá: “Berseba (ou Seba), Moladá”. As Crônicas repetem a lista simeonita, e depois do exílio os homens de Judá se estabeleceram de novo “em Jesua, em Molada, em Bete-Pelete”. Nenhuma história se passa ali, e nenhum profeta a nomeia."
    - "Onde ficava não é certo. Josefo conta como Herodes Agripa, arruinado e desesperado, foi a uma torre em Malatha, na Iduméia, e Eusébio mede distâncias no Neguebe a partir do forte de Malaatha; esse nome sobrevive em Tel Malhata, um grande montículo no vale de Berseba, a leste da cidade, com uma cidade fortificada da Idade do Ferro, escavada nas décadas de 1960 e 1990. Muitos estudiosos tomam Malatha por Moladá numa forma posterior do nome, mas outros dão Tel Malhata à cananeia Arade ou a Hormá, e o primeiro candidato no mapa é Khirbet el-Waten, um sítio menor mais perto de Berseba; Khirbet Kuseife e Tel Yeshua também foram propostos. Nada achado em qualquer deles nomeia a cidade."
    - "Hoje a área é o vale oriental de Berseba, em Israel, entre a cidade e Arade, com municípios beduínos, campos e o montículo escavado de Tel Malhata junto à base aérea de Nevatim."
  de:
    - "Molada war eine Stadt des Negev, des trockenen Südens Judas um Beerscheba, nur aus Listen bekannt. Josua zählt sie zu den südlichsten Städten Judas „an der Grenze der Edomiter gegen Mittag“ und dann zu den Städten, die Simeon innerhalb von Judas Los erhielt: „Beer-Seba, Seba, Molada“. Die Chronik wiederholt die simeonitische Liste, und nach dem Exil siedelten die Männer Judas wieder dort, wo es heißt: „und zu Jesua, Molada, Beth-Pelet“. Keine Geschichte spielt dort, und kein Prophet nennt sie."
    - "Wo sie stand, ist nicht sicher. Josephus erzählt, wie Herodes Agrippa, ruiniert und verzweifelt, zu einem Turm bei Malatha in Idumäa ging, und Eusebius misst Entfernungen im Negev von der Festung Malaatha aus; dieser Name lebt in Tel Malhata fort, einem großen Hügel im Tal von Beerscheba östlich der Stadt mit einer befestigten Stadt der Eisenzeit, in den 1960er und 1990er Jahren ausgegraben. Viele Gelehrte halten Malatha für Molada in späterer Namensform, andere geben Tel Malhata dem kanaanäischen Arad oder Horma, und der erste Kandidat auf der Karte ist Khirbet el-Waten, ein kleinerer Ort näher bei Beerscheba; auch Khirbet Kuseife und Tel Yeshua wurden vorgeschlagen. Nichts, was an einem von ihnen gefunden wurde, nennt die Stadt."
    - "Heute ist das Gebiet das östliche Tal von Beerscheba in Israel, zwischen der Stadt und Arad, mit Beduinenstädten, Feldern und dem ausgegrabenen Hügel Tel Malhata neben dem Luftwaffenstützpunkt Nevatim."
  fr:
    - "Molada était une ville du Négev, le sud aride de Juda autour de Beer-Schéba, connue seulement par des listes. Josué la compte parmi les villes les plus méridionales de Juda « vers la frontière d’Édom », puis parmi les villes données à Siméon dans le lot de Juda : « Beer-Schéba, Schéba, Molada ». Les Chroniques répètent la liste de Siméon, et après l’exil les hommes de Juda s’installèrent de nouveau « à Jéschua, à Molada, à Beth-Paleth ». Aucune histoire ne s’y déroule, et aucun prophète ne la nomme."
    - "Où elle se dressait n’est pas certain. Flavius Josèphe raconte comment Hérode Agrippa, ruiné et désespéré, alla dans une tour de Malatha en Idumée, et Eusèbe mesure les distances dans le Négev à partir du fort de Malaatha ; ce nom survit à Tel Malhata, grand tertre de la vallée de Beer-Schéba à l’est de la ville, avec une ville fortifiée de l’âge du Fer, fouillée dans les années 1960 et 1990. Beaucoup de savants tiennent Malatha pour Molada sous une forme plus tardive du nom, mais d’autres donnent Tel Malhata à Arad cananéenne ou à Horma, et le premier candidat de la carte est Khirbet el-Waten, site plus petit plus près de Beer-Schéba ; Khirbet Kuseife et Tel Yeshua ont aussi été proposés. Rien de ce qu’on a trouvé dans aucun d’eux ne nomme la ville."
    - "Aujourd’hui, la région est la vallée orientale de Beer-Schéba, en Israël, entre la ville et Arad, avec des villes bédouines, des champs et le tertre fouillé de Tel Malhata à côté de la base aérienne de Nevatim."
  it:
    - "Molada era una città del Negheb, il secco sud di Giuda intorno a Bersabea, nota solo dagli elenchi. Giosuè la annovera tra le città più meridionali di Giuda «verso il confine di Edom», e poi tra le città date a Simeone entro la porzione di Giuda: «Beer-Sceba, Sceba, Molada». Le Cronache ripetono l’elenco simeonita, e dopo l’esilio gli uomini di Giuda si stabilirono di nuovo «in Jeshua, in Molada in Beth-Paleth». Nessuna storia vi è ambientata, e nessun profeta la nomina."
    - "Dove sorgesse non è certo. Giuseppe Flavio racconta come Erode Agrippa, rovinato e disperato, andò a una torre a Malata in Idumea, ed Eusebio misura le distanze nel Negheb dal forte di Malaatha; quel nome sopravvive a Tel Malhata, un grande tell nella valle di Bersabea a est della città, con una città fortificata dell’età del Ferro, scavata negli anni Sessanta e Novanta. Molti studiosi ritengono Malata la stessa Molada sotto una forma tarda del nome, ma altri attribuiscono Tel Malhata ad Arad cananea o a Corma, e il primo candidato sulla mappa è Khirbet el-Waten, un sito più piccolo vicino a Bersabea; sono stati proposti anche Khirbet Kuseife e Tel Yeshua. Nulla di ciò che vi è stato trovato nomina la città."
    - "Oggi la zona è la valle orientale di Bersabea in Israele, tra la città e Arad, con centri beduini, campi e il tell scavato di Tel Malhata accanto alla base aerea di Nevatim."
  pl:
    - "Molada było miastem Negewu, suchego południa Judy wokół Beer-Szeby, znanym tylko z list. Jozue zalicza je do najdalej na południe wysuniętych miast Judy „podle granicy Edom ku południowi”, a potem do miast oddanych Symeonowi w losie Judy: „Beerseba, i Seba, i Molada”. Księga Kronik powtarza listę symeonicką, a po niewoli mężowie Judy osiedlili się znów „w Jesue, i w Molada, i w Betfelet”. Nie ma tam żadnej opowieści i żaden prorok jej nie wymienia."
    - "Gdzie stało, nie jest pewne. Józef Flawiusz opowiada, jak Herod Agryppa, zrujnowany i zdesperowany, poszedł do wieży w Malatha w Idumei, a Euzebiusz mierzy odległości w Negewie od fortu Malaatha; ta nazwa przetrwała w Tel Malhata, dużym kopcu w dolinie Beer-Szeby na wschód od miasta z obwarowanym miastem z epoki żelaza, wykopywanym w latach sześćdziesiątych i dziewięćdziesiątych XX w. Wielu uczonych uważa Malatha za Moladę w późniejszej formie nazwy, lecz inni dają Tel Malhata kananejskiemu Aradowi albo Hormie, a pierwszym kandydatem na mapie jest Khirbet el-Waten, mniejsze stanowisko bliżej Beer-Szeby; proponowano też Khirbet Kuseife i Tel Yeshua. Nic znalezionego w żadnym z nich nie wymienia miasta."
    - "Dziś obszar to wschodnia dolina Beer-Szeby w Izraelu, między miastem a Aradem, z beduińskimi miasteczkami, polami i wykopanym kopcem Tel Malhata obok bazy lotniczej Nevatim."
  nl:
    - "Molada was een stad in de Negev, het droge zuiden van Juda rond Berseba, alleen uit lijsten bekend. Jozua rekent het onder de zuidelijkste steden van Juda “tot de landpale van Edom”, en daarna onder de steden die aan Simeon werden gegeven binnen Juda's lot: “Beer-seba, en Seba, en Molada”. Kronieken herhaalt de lijst van Simeon, en na de ballingschap vestigden de mannen van Juda zich weer “te Jesua, en te Molada, en te Beth-Pelet”. Er is geen verhaal aan verbonden, en geen profeet noemt het."
    - "Waar het stond, is niet zeker. Josephus vertelt hoe Herodes Agrippa, geruïneerd en wanhopig, naar een toren te Malatha in Idumea ging, en Eusebius meet afstanden in de Negev vanaf het fort Malaatha; die naam leeft voort in Tel Malhata, een grote heuvel in de Bersebavallei ten oosten van de stad met een versterkte stad uit de ijzertijd, opgegraven in de jaren zestig en negentig. Veel geleerden houden Malatha voor Molada onder een latere vorm van de naam, maar anderen geven Tel Malhata aan het Kanaänitische Arad of Chorma, en de eerste kandidaat op de kaart is Khirbet el-Waten, een kleinere plaats dichter bij Berseba; ook Khirbet Kuseife en Tel Yeshua zijn voorgesteld. Niets wat bij een ervan is gevonden, noemt de stad."
    - "Tegenwoordig is het gebied de oostelijke Bersebavallei in Israël, tussen de stad en Arad, met bedoeïenendorpen, velden en de opgegraven heuvel Tel Malhata naast de luchtmachtbasis Nevatim."
  cs:
    - "Molada bylo město Negevu, suchého jihu Judy kolem Beer-šeby, známé jen ze seznamů. Jozue je počítá mezi nejjižnější města Judy „podlé pomezí Edom“ a pak mezi města dána Simeonovi uvnitř losu Judova: „Bersabé, Seba a Molada“. Kroniky Simeonův seznam opakují a po exilu se Judští usadili znovu „v Jesua, v Molada, v Betfelet“. Nic se tam neodehrává a žádný prorok je nejmenuje."
    - "Kde stálo, není jisté. Josephus vypráví, jak Herodes Agrippa, zničený a zoufalý, odešel do věže v Malathě v Idumeji, a Eusebius měří vzdálenosti v Negevu od pevnosti Malaatha; toto jméno přežívá v Tel Malhata, velkém pahorku v údolí Beer-šeby východně od města s opevněným městem z doby železné, vykopaným v 60. a 90. letech. Mnozí badatelé pokládají Malathu za Moladu v pozdější podobě jména, jiní však dávají Tel Malhata kanaánskému Aradu nebo Chormě a prvním kandidátem na mapě je Khirbet el-Waten, menší naleziště blíže Beer-šebě; navrženy byly také Khirbet Kuseife a Tel Yeshua. Nic nalezeného na žádném z nich město nejmenuje."
    - "Dnes je oblast východním údolím Beer-šeby v Izraeli, mezi městem a Aradem, s beduínskými městečky, poli a vykopaným pahorkem Tel Malhata vedle letecké základny Nevatim."
