# Overview article (ADR 0007). Mainstream facts only; this is Janoah (Janohah) on Ephraim's eastern border, not the Janoah in Galilee taken by Tiglath-pileser; the identification with Khirbet Yanun is usual but not proved.
id: janoah-ephraim
place: a0bcd48
title:
  en: "Janoah in Ephraim"
  ru: "Ианох в Ефреме"
  uk: "Яноах в Єфремі"
  es: "Janoa de Efraín"
  pt: "Janoa em Efraim"
  de: "Janoach in Ephraim"
  fr: "Janoach en Éphraïm"
  pl: "Janoach w Efraimie"
  it: "Ianoach in Efraim"
  nl: "Janoach in Efraïm"
  cs: "Janoach v Efrajimovi"
  sv: "Janoach i Efraim"
  nb: "Janoah i Efraim"
  tl: "Janoa sa Ephraim"
  da: "Janoa i Efraim"
  sr: "Јанох у Јефрему"
  hu: "Jánóah Efraimban"
  fi: "Janoah Efraimissa"
  vi: "Gia-nô-ác ở Ép-ra-im"
  ro: "Ianoah din Efraim"
  bg: "Янох в Ефрем"
body:
  en:
    - "Janoah, or Janohah, was a town on the eastern border of Ephraim. Joshua traces the line from Michmethah round “eastward unto Taanath-shiloh, and passed by it on the east to Janohah”, and then “it went down from Janohah to Ataroth, and to Naarath, and came to Jericho, and went out at Jordan”. It thus stood where the hills of Ephraim begin to fall towards the Jordan valley. It is a different place from the Janoah in the north that Tiglath-pileser III took with Ijon, Kedesh and Hazor."
    - "Nothing else is told of it. Eusebius knew a village Iano in the district of Akrabattene, east of Neapolis (Shechem), and the name survives at Yanun, a small Palestinian village about 12 km south-east of Nablus; the map places the town at the ruin of Khirbet Yanun beside it, as most scholars do, though the site has not been excavated and other nearby ruins have also been proposed."
  ru:
    - "Ианох был городом на восточной границе Ефрема. Книга Иисуса Навина ведёт черту от Михмефафа, и она «поворачивает к восточной стороне Фаанаф-Силома и проходит его с восточной стороны Ианоха; от Ианоха, нисходя к Атарофу и Наарафу, примыкает к Иерихону и доходит до Иордана». Он стоял, стало быть, там, где горы Ефрема начинают спускаться к Иорданской долине. Это иное место, чем северный Ианох, который Феглаффелласар III взял вместе с Ионом, Кедесом и Асором."
    - "Больше о нём ничего не рассказано. Евсевий знал селение Иано в округе Акрабаттины, к востоку от Неаполя (Сихема), и имя сохранилось в Януне, маленькой палестинской деревне примерно в 12 км к юго-востоку от Наблуса; карта, как и большинство исследователей, помещает город на развалинах Хирбет-Янун рядом с ней, хотя раскопок там не было и предлагались также другие соседние развалины."
  uk:
    - "Яноах, або Яноха, було містом на східній межі Єфрема. Книга Ісуса Навина веде лінію від Міхметата, що «вертає на схід сонця на Таанат-Сило і проходить його з східньої сторони Яноха», а потім «Від Яноха ж тягнеться вона на Атарот і Наарат та стикається з займищем Ерихонським і кінчиться на Йорданї». Отже, воно стояло там, де єфремські пагорби починають спадати до Йорданської долини. Це інше місце, ніж Яноах на півночі, який Тіглатпаласар III узяв разом з Іййоном, Кедесом і Гацором."
    - "Більше нічого про нього не розповідається. Євсевій знав село Іано в окрузі Акраваттена, на схід від Неаполя (Сихема), і назва зберігається в Януні, малому палестинському селі приблизно за 12 км на південний схід від Наблуса; карта розміщує місто на руїні Хірбет-Янун поряд, як і більшість дослідників, хоча місце не розкопувалося, а також пропонували інші руїни поблизу."
  es:
    - "Janoa, o Janohá, era una población en la frontera oriental de Efraín. Josué traza la línea desde Micmetat y da «vuelta este término hacia el oriente á Tanath-silo, y de aquí pasa del oriente á Janoa», y luego «de Janoa desciende á Ataroth, y á Naaratha, y toca en Jericó, y sale al Jordán». Se hallaba, pues, donde las colinas de Efraín comienzan a descender hacia el valle del Jordán. Es un lugar distinto del Janoa del norte que Tiglat-pileser III tomó con Ijón, Cedes y Hazor."
    - "No se cuenta nada más de ella. Eusebio conocía una aldea Iano en el distrito de Acrabatene, al este de Neápolis (Siquem), y el nombre sobrevive en Yanun, una pequeña aldea palestina a unos 12 km al sudeste de Nablus; el mapa sitúa la población en la ruina de Khirbet Yanun, junto a ella, como hacen la mayoría de los estudiosos, aunque el sitio no ha sido excavado y se han propuesto también otras ruinas cercanas."
  pt:
    - "Janoa, ou Janoá, era uma cidade na fronteira oriental de Efraim. Josué traça a linha de Micmetate “até Taanate-Siló, e passou por ela a leste de Janoa”, e depois “Desceu de Janoa para Atarote e para Naara, chegou a Jericó, e saiu no Jordão”. Ficava, assim, onde as colinas de Efraim começam a descer rumo ao vale do Jordão. É um lugar diferente da Janoa do norte que Tiglate-Pileser III tomou com Ijom, Quedes e Hazor."
    - "Nada mais se conta dela. Eusébio conheceu uma aldeia Iano no distrito de Acrabatena, a leste de Neápolis (Siquém), e o nome sobrevive em Yanun, uma pequena aldeia palestina a cerca de 12 km a sudeste de Nablus; o mapa coloca a cidade na ruína de Khirbet Yanun, junto a ela, como faz a maioria dos estudiosos, embora o sítio não tenha sido escavado e outras ruínas próximas também tenham sido propostas."
  de:
    - "Janoach, auch Janocha, war eine Stadt an der Ostgrenze Ephraims. Josua zieht die Linie von Michmetat herum „aufgangwärts gen Janoha“, nachdem sie sich „herum gegen Aufgang gen Thaanath-Silo“ gelenkt hat, und dann „kommt herab von Janoha gen Ataroth und Naarath und stößt an Jericho und geht aus am Jordan“. Es stand also dort, wo das Bergland Ephraim zum Jordantal abzufallen beginnt. Es ist ein anderer Ort als das Janoach im Norden, das Tiglat-Pileser III. mit Ijon, Kedesch und Hazor nahm."
    - "Sonst wird nichts von ihm erzählt. Eusebius kannte ein Dorf Iano im Bezirk Akrabattene, östlich von Neapolis (Sichem), und der Name lebt in Janun fort, einem kleinen palästinensischen Dorf etwa 12 km südöstlich von Nablus; die Karte setzt die Stadt wie die meisten Forscher bei der Ruine Chirbet Janun daneben an, doch die Stätte ist nicht ausgegraben, und auch andere nahe Ruinen sind vorgeschlagen worden."
  fr:
    - "Janoach, ou Janochah, était une ville sur la frontière orientale d’Éphraïm. Josué trace la ligne depuis Micmethath : elle « tournait à l’orient vers Thaanath-Silo, et passait dans la direction de l’orient par Janoach », puis « De Janoach elle descendait à Atharoth et à Naaratha, touchait à Jéricho, et se prolongeait jusqu’au Jourdain ». Elle se trouvait donc là où les collines d’Éphraïm commencent à descendre vers la vallée du Jourdain. C’est un autre lieu que le Janoach du nord que prit Tiglath-Piléser III avec Ijjon, Kédesch et Hatsor."
    - "On ne sait rien d’autre. Eusèbe connaissait un village Iano dans le district d’Acrabattène, à l’est de Néapolis (Sichem), et le nom survit à Yanoun, un petit village palestinien à environ 12 km au sud-est de Naplouse ; la carte place la ville à la ruine de Khirbet Yanoun, tout près, comme le font la plupart des spécialistes, bien que le site n’ait pas été fouillé et que d’autres ruines voisines aient aussi été proposées."
  pl:
    - "Janoach, czyli Janocha, było miastem na wschodniej granicy Efraima. Jozue prowadzi linię od Mikmetat kołem „pod wschód słońca do Tanat Selo, i przechodzi ją od wschodu aż do Janoe”, a potem: „I ciągnie się od Janoe do Attarot i Naarata, a przychodzi do Jerycha, a wychodzi ku Jordanowi”. Stało więc tam, gdzie wzgórza Efraima zaczynają opadać ku dolinie Jordanu. Jest to inne miejsce niż Janoach na północy, które Tiglat-Pileser III zajął z Ijjon, Kedesz i Chasorem."
    - "Nic więcej o nim nie opowiedziano. Euzebiusz znał wieś Iano w okręgu Akrabattene, na wschód od Neapolis (Sychem), a nazwa przetrwała w Janun, małej palestyńskiej wsi około 12 km na południowy wschód od Nablusu; mapa umieszcza miasto w ruinie Chirbet Janun obok niej, jak czyni większość uczonych, choć stanowiska nie badano, a proponowano też inne pobliskie ruiny."
  it:
    - "Ianoach, o Ianoah, era una città sul confine orientale di Efraim. Giosuè traccia la linea da Micmetat, «girava a oriente verso Taanath-Scilo e le passava davanti, a oriente di Ianoah», e poi «da Ianoah scendeva ad Ataroth e a Naarah, toccava Gerico, e faceva capo al Giordano». Sorgeva dunque dove i colli di Efraim cominciano a scendere verso la valle del Giordano. È un luogo diverso dalla Ianoach del nord che Tiglat-Pilèser III prese con Ion, Kedes e Asor."
    - "Nulla di più se ne dice. Eusebio conosceva un villaggio Iano nel distretto di Acrabattene, a est di Neapoli (Sichem), e il nome sopravvive a Yanun, un piccolo villaggio palestinese circa 12 km a sud-est di Nablus; la mappa pone la città alla rovina di Khirbet Yanun accanto ad esso, come fanno i più, benché il sito non sia stato scavato e siano state proposte anche altre rovine vicine."
  nl:
    - "Janoach, of Janohah, was een stad aan de oostgrens van Efraïm. Jozua trekt de lijn vanaf Michmetat rond, “keert zich om tegen het oosten naar Thaanath-Silo, en gaat door dezelve van het oosten naar Janoah”, en dan “komt af van Janoah naar Ataroth en Naharoth, en stoot aan Jericho, en gaat uit aan de Jordaan”. Zij lag dus waar de heuvels van Efraïm naar het Jordaandal beginnen af te lopen. Het is een andere plaats dan het Janoach in het noorden dat Tiglat-Pileser III innam met Ijon, Kedes en Hazor."
    - "Verder wordt er niets van verteld. Eusebius kende een dorp Iano in het district Akrabattene, ten oosten van Neapolis (Sichem), en de naam leeft voort in Yanun, een klein Palestijns dorp ongeveer 12 km ten zuidoosten van Nablus; de kaart plaatst de stad bij de ruïne Khirbet Yanun ernaast, zoals de meeste geleerden doen, al is de plaats niet opgegraven en zijn ook andere nabije ruïnes voorgesteld."
  cs:
    - "Janoach, nebo Janoacha, bylo město na východní hranici Efrajima. Jozue vede čáru od Michmetatu kolem, „obchází meze k východu Tanatsilo, a přechází ji od východu k Janoe“, a pak „A sstupuje z Janoe do Atarot a Nárat, a přichází do Jericha, a vychází k Jordánu“. Stálo tedy tam, kde se efrajimské hory začínají svažovat k Jordánskému údolí. Je to jiné místo než Janoach na severu, který Tiglatpilesar III. dobyl s Ijónem, Kedešem a Chacorem."
    - "Nic jiného se o něm nevypráví. Eusebios znal vesnici Iano v okrese Akrabatténa, východně od Neapole (Šekemu), a jméno přežívá v Janúnu, malé palestinské vesnici asi 12 km jihovýchodně od Nábulusu; mapa klade město do zříceniny Chirbet Janún vedle ní, jak činí většina učenců, ačkoli místo nebylo vykopáno a navrženy byly i jiné blízké zříceniny."
  sv:
    - "Janoach, eller Janoa, var en stad vid Efraims östra gräns. Josua drar linjen från Mikmetat: ”Därifrån böjde sig gränsen österut till Taanat-Silo. Därefter gick den fram där i öster till Janoa”, och sedan: ”Från Janoa gick den ned till Atarot och Naara, träffade så Jeriko och gick ut vid Jordan”. Den låg alltså där Efraims berg börjar sluta mot Jordandalen. Det är en annan plats än Janoach i norr som Tiglat-Pileser III intog med Ijon, Kedesh och Hasor."
    - "Inget annat berättas om den. Eusebios kände en by Iano i distriktet Akrabattene, öster om Neapolis (Shekem), och namnet lever kvar i Yanun, en liten palestinsk by omkring 12 km sydost om Nablus; kartan placerar staden vid ruinen Khirbet Yanun intill, som de flesta forskare gör, fast platsen inte har grävts ut och andra närbelägna ruiner också har föreslagits."
  nb:
    - "Janoah, eller Janohah, var en by på Efraims østgrense. Josva trekker linjen fra Mikmetat rundt, den «bøide sig mot øst til Ta'anat-Silo og holdt frem østover til Janoah», og så «tok den så ned til Atarot og Na'ara, rørte ved Jeriko og endte ved Jordan». Den sto dermed der Efraims åser begynner å falle mot Jordan-dalen. Det er et annet sted enn Janoah i nord som Tiglat-Pileser 3. tok sammen med Ijon, Kedesj og Hasor."
    - "Ingenting annet fortelles om den. Eusebius kjente en landsby Iano i distriktet Akrabattene, øst for Neapolis (Sikem), og navnet overlever i Yanun, en liten palestinsk landsby omtrent 12 km sørøst for Nablus; kartet plasserer byen ved ruinen Khirbet Yanun ved siden av, som de fleste forskere gjør, selv om stedet ikke er gravd ut og andre ruiner i nærheten også er foreslått."
  tl:
    - "Ang Janoa, o Janohah, ay isang bayan sa silangang hangganan ng Ephraim. Iginuguhit ni Josue ang guhit mula sa Michmetat sa palibot na “paliko sa dakong silanganan hanggang sa Tanath-silo at patuloy sa silanganan ng Janoa”, at pagkatapos ay “pababa mula sa Janoa na patungo sa Ataroth at sa Naara, at abot hanggang sa Jerico, at palabas sa Jordan”. Kaya't nakatayo ito kung saan nagsisimulang bumaba ang mga burol ng Ephraim patungo sa libis ng Jordan. Ibang lugar ito kaysa sa Janoa sa hilaga na sinakop ni Tiglath-pileser III kasama ang Ihion, Cedes at Hasor."
    - "Wala nang isinasalaysay tungkol dito. Kilala ni Eusebio ang isang nayong Iano sa distrito ng Akrabattene, sa silangan ng Neapolis (Sichem), at nananatili ang pangalan sa Yanun, isang maliit na nayong Palestino mga 12 km sa timog-silangan ng Nablus; inilalagay ng mapa ang bayan sa guho ng Khirbet Yanun sa tabi nito, gaya ng karamihan sa mga iskolar, bagaman hindi pa nahuhukay ang lugar at iminungkahi rin ang ibang kalapit na guho."
  da:
    - "Janoa, eller Janoha, var en by på Efraims østgrænse. Josva trækker linjen fra Mikmetat rundt »i Øster til Thaanath-Silo, og det gaar forbi den, Østen for Janoa«, og derefter »kommer ned fra Janoa til Ataroth og Naara og skyder op mod Jeriko og gaar ud til Jordan«. Den stod altså, hvor Efraims bjerge begynder at falde mod Jordandalen. Den er et andet sted end Janoa i nord, som Tiglat-Pileser III tog sammen med Ijjon, Kedesj og Hazor."
    - "Intet andet fortælles om den. Eusebios kendte en landsby Iano i distriktet Akrabattene, øst for Neapolis (Sikem), og navnet overlever ved Yanun, en lille palæstinensisk landsby omkring 12 km sydøst for Nablus; kortet placerer byen ved ruinen Khirbet Yanun ved siden af den, som de fleste forskere gør, skønt stedet ikke er udgravet, og andre nærliggende ruiner også er foreslået."
  sr:
    - "Јанох, или Јаноха, био је град на источној граници Јефрема. Исус прати линију од Михмете око, „па се обрће међа к истоку до Танат-Силона, и пролази с истока до Јанохе“, а затим „потом силази од Јанохе до Атарота и Нарата, и дошавши до Јерихона удара у Јордан“. Стајао је дакле тамо где јефремова брда почињу да падају према долини Јордана. То је друго место од Јаноха на северу који је Теглат-Феласар III узео заједно са Ијоном, Кедесом и Асором."
    - "Ништа друго се о њему не прича. Јевсевије је знао село Иано у округу Акрабатена, источно од Неапоља (Сихема), а име преживљава у Јануну, малом палестинском селу око 12 км југоисточно од Наблуса; карта ставља град на рушевину Хирбет Јанун поред њега, као већина научника, мада налазиште није ископавано и предложене су и друге оближње рушевине."
  hu:
    - "Jánóah, másként Jánóhá, Efraim keleti határán fekvő város volt. Józsué Mikmetáttól körbe követi a vonalat: „fordul a határ kelet felé Thaanath-Silónak és átmegy azon napkelet felé Janoáhnak. Janoáhtól pedig lemegy Ataróthba és Naaróthba, és éri Jérikhót, és kimegy a Jordánnak”. Tehát ott állt, ahol Efraim dombjai a Jordán-völgy felé kezdenek lejteni. Más hely, mint az északi Jánóah, amelyet III. Tiglat-Pileszer Ijjónnal, Kedessel és Hácórral együtt elfoglalt."
    - "Mást nem mondanak róla. Eusebius ismert egy Iano falut Akrabattene kerületében, Neapolisztól (Sikemtől) keletre, és a név Janunban él tovább, egy kis palesztin faluban Náblusztól mintegy 12 km-re délkeletre; a térkép a várost a mellette lévő Hirbet Janun romjához helyezi, ahogy a legtöbb kutató, bár a helyet nem ásták ki, és más közeli romokat is javasoltak."
  fi:
    - "Janoah eli Janoha oli kaupunki Efraimin itärajalla. Joosua jäljittää linjan Mikmetatista ”itään päin Taanat-Siiloon ja menee sen itäpuolitse Janohaan”, ja sitten ”Janohasta se laskeutuu Atarotiin ja Naaraan, koskettaa Jerikoa ja päättyy Jordaniin”. Se sijaitsi siis siellä, missä Efraimin kukkulat alkavat laskeutua kohti Jordanin laaksoa. Se on eri paikka kuin pohjoisen Janoah, jonka Tiglat-Pileser III valtasi Ijonin, Kedeksen ja Hasorin kanssa."
    - "Muuta siitä ei kerrota. Eusebios tunsi Iano-nimisen kylän Akrabattenen piirissä Neapoliksesta (Sikem) itään, ja nimi säilyy Yanunissa, pienessä palestiinalaiskylässä noin 12 km Nablusista kaakkoon; kartta sijoittaa kaupungin sen vieressä olevaan Khirbet Yanunin rauniokohteeseen, kuten useimmat tutkijat tekevät, vaikka paikkaa ei ole kaivettu ja myös muita läheisiä raunioita on ehdotettu."
  vi:
    - "Gia-nô-ác, hay Gia-nô-ách, là một thành trên ranh giới phía đông của Ép-ra-im. Giô-suê vạch đường ranh từ Mít-mê-thát vòng “đông về lối Tha-a-nát-Si-lô, và qua khỏi đó đến Gia-nô-ách theo phía đông”, rồi “kế chạy từ Gia-nô-ách xuống A-ta-rốt và Na-ra-tha, đụng Giê-ri-cô, rồi giáp sông Giô-đanh”. Như vậy thành đứng nơi các đồi Ép-ra-im bắt đầu dốc xuống thung lũng Giô-đanh. Đó là một nơi khác với Gia-nô-ác ở phía bắc mà Tiếc-la-Phi-lê-se III chiếm cùng Y-giôn, Kê-đe và Hát-so."
    - "Không kể gì thêm về thành. Eusebius biết một làng Iano trong vùng Akrabattene, phía đông Nê-a-bô-li (Si-chem), và tên còn lại ở Yanun, một làng Palestine nhỏ cách Nablus khoảng 12 km về phía đông nam; bản đồ đặt thành tại phế tích Khirbet Yanun bên cạnh, như phần lớn học giả, dù địa điểm chưa được khai quật và các phế tích lân cận khác cũng được đề nghị."
  ro:
    - "Ianoah, sau Ianoha, era un oraș de la hotarul estic al lui Efraim. Iosua trasează linia de la Micmetat: „trec spre răsărit în Tinatasilo, și trec dela răsărit în Ianoha”, apoi aceasta coboară de la Ianoha la Atarot și Naarat, ajunge la Ierihon și iese la Iordan. Se afla deci unde dealurile lui Efraim încep să cadă spre valea Iordanului. Este un alt loc decât Ianoahul din nord, pe care Tiglat-Pileser al III-lea l-a luat împreună cu Ion, Chedeș și Hațor."
    - "Nu se spune nimic altceva despre el. Eusebiu cunoștea un sat Iano în districtul Acrabatene, la est de Neapolis (Sihem), iar numele supraviețuiește la Yanun, un mic sat palestinian la circa 12 km spre sud-est de Nablus; harta așază orașul la ruina Khirbet Yanun de lângă el, ca și cei mai mulți cercetători, deși locul nu a fost săpat și au fost propuse și alte ruine din apropiere."
  bg:
    - "Янох, или Яноха, беше град на източната граница на Ефрем. Книгата на Иисус Навин прокарва линията от Михметат наоколо, като „пределът се вращаше към изток до Танат-сило, и от там преминваше към изток в Янох“, а после „слазяше от Янох в Атарот и в Наарат, и достигаше в Иерихон, и излазяше в Йордан“. Така той е стоял там, където Ефремовите хълмове започват да се спускат към Йорданската долина. Той е различно място от Янох на север, който Теглатфеласар III превзе заедно с Йон, Кедес и Хацор."
    - "Нищо друго не се разказва за него. Евсевий познаваше село Яно в областта Акрабатене, на изток от Неапол (Сихем), а името оцелява в Янун, малко палестинско село на около 12 км югоизточно от Наблус; картата поставя града при развалината Хирбет Янун до него, както правят повечето учени, макар мястото да не е разкопавано и да са предлагани и други близки развалини."
scripture:
