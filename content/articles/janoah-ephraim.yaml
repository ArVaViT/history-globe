# Overview article (ADR 0007). Mainstream facts only; this is Janoah (Janohah) on Ephraim's eastern border, not the Janoah in Galilee taken by Tiglath-pileser; the identification with Khirbet Yanun is usual but not proved.
id: janoah-ephraim
place: a0bcd48
title:
  en: "Janoah in Ephraim"
  ru: "Ианох в Ефреме"
  uk: "Яноах в Єфремі"
  es: "Janoa de Efraín"
  pt: "Janoa em Efraim"
  de: "Janoach in Ephraim"
  fr: "Janoach en Éphraïm"
body:
  en:
    - "Janoah, or Janohah, was a town on the eastern border of Ephraim. Joshua traces the line from Michmethah round “eastward unto Taanath-shiloh, and passed by it on the east to Janohah”, and then “it went down from Janohah to Ataroth, and to Naarath, and came to Jericho, and went out at Jordan”. It thus stood where the hills of Ephraim begin to fall towards the Jordan valley. It is a different place from the Janoah in the north that Tiglath-pileser III took with Ijon, Kedesh and Hazor."
    - "Nothing else is told of it. Eusebius knew a village Iano in the district of Akrabattene, east of Neapolis (Shechem), and the name survives at Yanun, a small Palestinian village about 12 km south-east of Nablus; the map places the town at the ruin of Khirbet Yanun beside it, as most scholars do, though the site has not been excavated and other nearby ruins have also been proposed."
  ru:
    - "Ианох был городом на восточной границе Ефрема. Книга Иисуса Навина ведёт черту от Михмефафа, и она «поворачивает к восточной стороне Фаанаф-Силома и проходит его с восточной стороны Ианоха; от Ианоха, нисходя к Атарофу и Наарафу, примыкает к Иерихону и доходит до Иордана». Он стоял, стало быть, там, где горы Ефрема начинают спускаться к Иорданской долине. Это иное место, чем северный Ианох, который Феглаффелласар III взял вместе с Ионом, Кедесом и Асором."
    - "Больше о нём ничего не рассказано. Евсевий знал селение Иано в округе Акрабаттины, к востоку от Неаполя (Сихема), и имя сохранилось в Януне, маленькой палестинской деревне примерно в 12 км к юго-востоку от Наблуса; карта, как и большинство исследователей, помещает город на развалинах Хирбет-Янун рядом с ней, хотя раскопок там не было и предлагались также другие соседние развалины."
  uk:
    - "Яноах, або Яноха, було містом на східній межі Єфрема. Книга Ісуса Навина веде лінію від Міхметата, що «вертає на схід сонця на Таанат-Сило і проходить його з східньої сторони Яноха», а потім «Від Яноха ж тягнеться вона на Атарот і Наарат та стикається з займищем Ерихонським і кінчиться на Йорданї». Отже, воно стояло там, де єфремські пагорби починають спадати до Йорданської долини. Це інше місце, ніж Яноах на півночі, який Тіглатпаласар III узяв разом з Іййоном, Кедесом і Гацором."
    - "Більше нічого про нього не розповідається. Євсевій знав село Іано в окрузі Акраваттена, на схід від Неаполя (Сихема), і назва зберігається в Януні, малому палестинському селі приблизно за 12 км на південний схід від Наблуса; карта розміщує місто на руїні Хірбет-Янун поряд, як і більшість дослідників, хоча місце не розкопувалося, а також пропонували інші руїни поблизу."
  es:
    - "Janoa, o Janohá, era una población en la frontera oriental de Efraín. Josué traza la línea desde Micmetat y da «vuelta este término hacia el oriente á Tanath-silo, y de aquí pasa del oriente á Janoa», y luego «de Janoa desciende á Ataroth, y á Naaratha, y toca en Jericó, y sale al Jordán». Se hallaba, pues, donde las colinas de Efraín comienzan a descender hacia el valle del Jordán. Es un lugar distinto del Janoa del norte que Tiglat-pileser III tomó con Ijón, Cedes y Hazor."
    - "No se cuenta nada más de ella. Eusebio conocía una aldea Iano en el distrito de Acrabatene, al este de Neápolis (Siquem), y el nombre sobrevive en Yanun, una pequeña aldea palestina a unos 12 km al sudeste de Nablus; el mapa sitúa la población en la ruina de Khirbet Yanun, junto a ella, como hacen la mayoría de los estudiosos, aunque el sitio no ha sido excavado y se han propuesto también otras ruinas cercanas."
  pt:
    - "Janoa, ou Janoá, era uma cidade na fronteira oriental de Efraim. Josué traça a linha de Micmetate “até Taanate-Siló, e passou por ela a leste de Janoa”, e depois “Desceu de Janoa para Atarote e para Naara, chegou a Jericó, e saiu no Jordão”. Ficava, assim, onde as colinas de Efraim começam a descer rumo ao vale do Jordão. É um lugar diferente da Janoa do norte que Tiglate-Pileser III tomou com Ijom, Quedes e Hazor."
    - "Nada mais se conta dela. Eusébio conheceu uma aldeia Iano no distrito de Acrabatena, a leste de Neápolis (Siquém), e o nome sobrevive em Yanun, uma pequena aldeia palestina a cerca de 12 km a sudeste de Nablus; o mapa coloca a cidade na ruína de Khirbet Yanun, junto a ela, como faz a maioria dos estudiosos, embora o sítio não tenha sido escavado e outras ruínas próximas também tenham sido propostas."
  de:
    - "Janoach, auch Janocha, war eine Stadt an der Ostgrenze Ephraims. Josua zieht die Linie von Michmetat herum „aufgangwärts gen Janoha“, nachdem sie sich „herum gegen Aufgang gen Thaanath-Silo“ gelenkt hat, und dann „kommt herab von Janoha gen Ataroth und Naarath und stößt an Jericho und geht aus am Jordan“. Es stand also dort, wo das Bergland Ephraim zum Jordantal abzufallen beginnt. Es ist ein anderer Ort als das Janoach im Norden, das Tiglat-Pileser III. mit Ijon, Kedesch und Hazor nahm."
    - "Sonst wird nichts von ihm erzählt. Eusebius kannte ein Dorf Iano im Bezirk Akrabattene, östlich von Neapolis (Sichem), und der Name lebt in Janun fort, einem kleinen palästinensischen Dorf etwa 12 km südöstlich von Nablus; die Karte setzt die Stadt wie die meisten Forscher bei der Ruine Chirbet Janun daneben an, doch die Stätte ist nicht ausgegraben, und auch andere nahe Ruinen sind vorgeschlagen worden."
  fr:
    - "Janoach, ou Janochah, était une ville sur la frontière orientale d’Éphraïm. Josué trace la ligne depuis Micmethath : elle « tournait à l’orient vers Thaanath-Silo, et passait dans la direction de l’orient par Janoach », puis « De Janoach elle descendait à Atharoth et à Naaratha, touchait à Jéricho, et se prolongeait jusqu’au Jourdain ». Elle se trouvait donc là où les collines d’Éphraïm commencent à descendre vers la vallée du Jourdain. C’est un autre lieu que le Janoach du nord que prit Tiglath-Piléser III avec Ijjon, Kédesch et Hatsor."
    - "On ne sait rien d’autre. Eusèbe connaissait un village Iano dans le district d’Acrabattène, à l’est de Néapolis (Sichem), et le nom survit à Yanoun, un petit village palestinien à environ 12 km au sud-est de Naplouse ; la carte place la ville à la ruine de Khirbet Yanoun, tout près, comme le font la plupart des spécialistes, bien que le site n’ait pas été fouillé et que d’autres ruines voisines aient aussi été proposées."
scripture:
  - Josh.16.5-Josh.16.7
  - 2Kgs.15.29
sources:
  - "Eusebius, Onomasticon, s.v. Iano"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
  - "Z. Kallai, Historical Geography of the Bible: The Tribal Territories of Israel (1986)"
