# Overview article (ADR 0007). Mainstream facts only; this is the district of Goshen in southern Judah, not Goshen in Egypt; its extent is unknown and the town it is named after is located only by proposal.
id: goshen-judah
place: ad3e63c
title:
  en: "Land of Goshen in Judah"
  ru: "Земля Гошен в Иудее"
  uk: "Земля Гошен в Юді"
  es: "Tierra de Gosén, en Judá"
  pt: "Terra de Gósen em Judá"
  de: "Land Goschen in Juda"
  fr: "Pays de Gosen en Juda"
body:
  en:
    - "This Goshen is not the land in Egypt where Jacob's family settled but a district in the south of Canaan, named only in the summaries of Joshua's conquests. After the southern campaign “Joshua smote them from Kadesh-barnea even unto Gaza, and all the country of Goshen, even unto Gibeon”, and the closing summary of the whole conquest names “all the south country, and all the land of Goshen, and the valley, and the plain”. It seems to have lain between the hill country of Judah and the Negeb, and it most likely took its name from the town of Goshen, which Joshua lists among the hill towns of Judah in one district with Debir, Eshtemoh and Anim."
    - "Beyond these two verses nothing is known of the district: its borders are not given, and no other book names it. The town itself is unlocated. One proposal, which the map follows, puts it at ed-Dhahiriya, a hill town about 18 km south-west of Hebron, but this rests on the town's place in the list, not on any survival of the name. Ed-Dhahiriya today is a Palestinian town in the Hebron governorate of the West Bank, on the edge of the northern Negev."
  ru:
    - "Этот Гошен — не земля в Египте, где поселилась семья Иакова, а область на юге Ханаана, названная лишь в итоговых словах о завоеваниях Иисуса Навина. После южного похода Иисус поразил врагов «от Кадес-Варни до Газы, и всю землю Гошен даже до Гаваона», а заключительный перечень всего завоевания называет «всю землю полуденную, всю землю Гошен и низменные места». По-видимому, она лежала между нагорьем Иудеи и Негевом и, скорее всего, получила имя от города Гошен, который книга Иисуса Навина числит среди горных городов Иуды в одном округе с Давиром, Ештемо и Анимом."
    - "Кроме этих двух стихов, об области ничего не известно: её границы не указаны, и ни одна другая книга её не называет. Сам город не найден. По одному предположению, которому следует карта, он стоял на месте ад-Дахирии, горного городка примерно в 18 км к юго-западу от Хеврона, но оно опирается на место города в списке, а не на сохранившееся имя. Ад-Дахирия сегодня — палестинский город в мухафазе Хеврон на Западном берегу, на краю северного Негева."
  uk:
    - "Цей Гошен — не земля в Єгипті, де оселилася родина Якова, а округа на півдні Ханаану, названа лише в підсумках завоювань Ісуса Навина. Після південного походу «звоював Ісус всїх, що жили від Кадес-Барне до Гази і всю Гозен землю до Габаону», а завершальний підсумок усього завоювання називає «всю полуденну країну, і всю Гозен-землю, і поділлє й степ». Вона, схоже, лежала між гірською країною Юди та Негевом і, найімовірніше, дістала назву від міста Гошен, яке Книга Ісуса Навина перелічує серед гірських міст Юди в одному окрузі з Девіром, Ештемо й Анімом."
    - "Крім цих двох віршів, про округу нічого не відомо: її меж не подано, і жодна інша книга її не називає. Саме місто не локалізоване. Одна пропозиція, за якою йде карта, розміщує його в Ед-Захірії, гірському містечку приблизно за 18 км на південний захід від Хеврона, але вона спирається на місце міста в переліку, а не на збереження назви. Ед-Захірія сьогодні — палестинське містечко в Хевронському окрузі Західного берега, на краю північного Негеву."
  es:
    - "Este Gosén no es la tierra de Egipto donde se estableció la familia de Jacob, sino un distrito del sur de Canaán, nombrado solo en los resúmenes de las conquistas de Josué. Tras la campaña del sur, Josué los hirió «desde Cades-barnea hasta Gaza, y toda la tierra de Gosén hasta Gabaón», y el resumen final de toda la conquista nombra «toda la región del mediodía, y toda la tierra de Gosén, y los bajos y los llanos». Parece haber estado entre la región montañosa de Judá y el Néguev, y lo más probable es que tomara su nombre de la población de Gosén, que Josué enumera entre las ciudades de la montaña de Judá en un mismo distrito con Debir, Estemo y Anim."
    - "Más allá de estos dos versículos no se sabe nada del distrito: no se dan sus límites y ningún otro libro lo nombra. La población misma no está localizada. Una propuesta, que sigue el mapa, la sitúa en ed-Dhahiriya, una ciudad de colina a unos 18 km al suroeste de Hebrón, pero esto se apoya en el lugar de la población en la lista, no en ninguna pervivencia del nombre. Ed-Dhahiriya es hoy una ciudad palestina de la gobernación de Hebrón, en Cisjordania, en el borde del norte del Néguev."
  pt:
    - "Esta Gósen não é a terra no Egito onde se estabeleceu a família de Jacó, mas um distrito no sul de Canaã, nomeado apenas nos resumos das conquistas de Josué. Depois da campanha do sul, “Josué os feriu desde Cades-Barneia até Gaza, e toda a região de Gósen, até Gibeom”, e o resumo final de toda a conquista nomeia “todo o Sul, toda a terra de Gósen, a baixada, a Arabá”. Parece ter ficado entre a região montanhosa de Judá e o Neguebe, e muito provavelmente tomou o nome da cidade de Gósen, que Josué lista entre as cidades montanhosas de Judá num distrito com Debir, Estemoa e Anim."
    - "Além desses dois versículos nada se sabe do distrito: suas fronteiras não são dadas, e nenhum outro livro o nomeia. A própria cidade não está localizada. Uma proposta, que o mapa segue, a põe em ed-Dhahiriya, uma cidade de colina a cerca de 18 km a sudoeste de Hebrom, mas isso se apoia no lugar da cidade na lista, não em qualquer sobrevivência do nome. Ed-Dhahiriya é hoje uma cidade palestina na província de Hebrom, na Cisjordânia, na orla do norte do Neguebe."
  de:
    - "Dieses Goschen ist nicht das Land in Ägypten, wo Jakobs Familie sich niederließ, sondern ein Bezirk im Süden Kanaans, nur in den Zusammenfassungen von Josuas Eroberungen genannt. Nach dem Südfeldzug „schlug“ Josua sie „von Kades-Barnea an bis gen Gaza und das ganze Land Gosen bis gen Gibeon“, und die Schlusszusammenfassung der ganzen Eroberung nennt „alles, was gegen Mittag liegt, und das Land Gosen und die Gründe und das Gefilde“. Es scheint zwischen dem Bergland Judas und dem Negev gelegen zu haben und hat seinen Namen wahrscheinlich von der Stadt Goschen, die Josua unter den Bergstädten Judas in einem Bezirk mit Debir, Eschtemo und Anim aufführt."
    - "Über diese beiden Verse hinaus ist vom Bezirk nichts bekannt: Seine Grenzen werden nicht angegeben, und kein anderes Buch nennt ihn. Die Stadt selbst ist nicht lokalisiert. Ein Vorschlag, dem die Karte folgt, setzt sie bei ed-Dhahirija an, einer Bergstadt etwa 18 km südwestlich von Hebron, doch das beruht auf der Stellung der Stadt in der Liste, nicht auf dem Fortleben des Namens. Ed-Dhahirija ist heute eine palästinensische Stadt im Gouvernement Hebron des Westjordanlands, am Rand des nördlichen Negev."
  fr:
    - "Ce Gosen n’est pas le pays d’Égypte où s’établit la famille de Jacob mais un district du sud de Canaan, nommé seulement dans les résumés des conquêtes de Josué. Après la campagne du sud, « Josué les battit de Kadès-Barnéa à Gaza, il battit tout le pays de Gosen jusqu’à Gabaon », et le résumé final de toute la conquête dit que Josué s’empara « de tout le midi, de tout le pays de Gosen, de la vallée, de la plaine ». Il semble avoir été situé entre la montagne de Juda et le Négev, et il tira très probablement son nom de la ville de Gosen, que Josué inscrit parmi les villes de la montagne de Juda dans un même district avec Debir, Eschthemo et Anim."
    - "Au-delà de ces deux versets, on ne sait rien du district : ses limites ne sont pas données, et aucun autre livre ne le nomme. La ville elle-même n’est pas localisée. Une proposition, que suit la carte, la place à ed-Dhahiriya, ville de montagne à environ 18 km au sud-ouest d’Hébron, mais elle repose sur la place de la ville dans la liste, non sur une quelconque survivance du nom. Ed-Dhahiriya est aujourd’hui une ville palestinienne du gouvernorat d’Hébron, en Cisjordanie, en bordure du nord du Négev."
scripture:
  - Josh.10.41
