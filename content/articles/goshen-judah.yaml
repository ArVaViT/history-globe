body:
  en:
    - "This Goshen is not the land in Egypt where Jacob's family settled but a district in the south of Canaan, named only in the summaries of Joshua's conquests. After the southern campaign “Joshua smote them from Kadesh-barnea even unto Gaza, and all the country of Goshen, even unto Gibeon”, and the closing summary of the whole conquest names “all the south country, and all the land of Goshen, and the valley, and the plain”. It seems to have lain between the hill country of Judah and the Negeb, and it most likely took its name from the town of Goshen, which Joshua lists among the hill towns of Judah in one district with Debir, Eshtemoh and Anim."
    - "Beyond these two verses nothing is known of the district: its borders are not given, and no other book names it. The town itself is unlocated. One proposal, which the map follows, puts it at ed-Dhahiriya, a hill town about 18 km south-west of Hebron, but this rests on the town's place in the list, not on any survival of the name. Ed-Dhahiriya today is a Palestinian town in the Hebron governorate of the West Bank, on the edge of the northern Negev."
  ru:
    - "Этот Гошен — не земля в Египте, где поселилась семья Иакова, а область на юге Ханаана, названная лишь в итоговых словах о завоеваниях Иисуса Навина. После южного похода Иисус поразил врагов «от Кадес-Варни до Газы, и всю землю Гошен даже до Гаваона», а заключительный перечень всего завоевания называет «всю землю полуденную, всю землю Гошен и низменные места». По-видимому, она лежала между нагорьем Иудеи и Негевом и, скорее всего, получила имя от города Гошен, который книга Иисуса Навина числит среди горных городов Иуды в одном округе с Давиром, Ештемо и Анимом."
    - "Кроме этих двух стихов, об области ничего не известно: её границы не указаны, и ни одна другая книга её не называет. Сам город не найден. По одному предположению, которому следует карта, он стоял на месте ад-Дахирии, горного городка примерно в 18 км к юго-западу от Хеврона, но оно опирается на место города в списке, а не на сохранившееся имя. Ад-Дахирия сегодня — палестинский город в мухафазе Хеврон на Западном берегу, на краю северного Негева."
  uk:
    - "Цей Гошен — не земля в Єгипті, де оселилася родина Якова, а округа на півдні Ханаану, названа лише в підсумках завоювань Ісуса Навина. Після південного походу «звоював Ісус всїх, що жили від Кадес-Барне до Гази і всю Гозен землю до Габаону», а завершальний підсумок усього завоювання називає «всю полуденну країну, і всю Гозен-землю, і поділлє й степ». Вона, схоже, лежала між гірською країною Юди та Негевом і, найімовірніше, дістала назву від міста Гошен, яке Книга Ісуса Навина перелічує серед гірських міст Юди в одному окрузі з Девіром, Ештемо й Анімом."
    - "Крім цих двох віршів, про округу нічого не відомо: її меж не подано, і жодна інша книга її не називає. Саме місто не локалізоване. Одна пропозиція, за якою йде карта, розміщує його в Ед-Захірії, гірському містечку приблизно за 18 км на південний захід від Хеврона, але вона спирається на місце міста в переліку, а не на збереження назви. Ед-Захірія сьогодні — палестинське містечко в Хевронському окрузі Західного берега, на краю північного Негеву."
  es:
    - "Este Gosén no es la tierra de Egipto donde se estableció la familia de Jacob, sino un distrito del sur de Canaán, nombrado solo en los resúmenes de las conquistas de Josué. Tras la campaña del sur, Josué los hirió «desde Cades-barnea hasta Gaza, y toda la tierra de Gosén hasta Gabaón», y el resumen final de toda la conquista nombra «toda la región del mediodía, y toda la tierra de Gosén, y los bajos y los llanos». Parece haber estado entre la región montañosa de Judá y el Néguev, y lo más probable es que tomara su nombre de la población de Gosén, que Josué enumera entre las ciudades de la montaña de Judá en un mismo distrito con Debir, Estemo y Anim."
    - "Más allá de estos dos versículos no se sabe nada del distrito: no se dan sus límites y ningún otro libro lo nombra. La población misma no está localizada. Una propuesta, que sigue el mapa, la sitúa en ed-Dhahiriya, una ciudad de colina a unos 18 km al suroeste de Hebrón, pero esto se apoya en el lugar de la población en la lista, no en ninguna pervivencia del nombre. Ed-Dhahiriya es hoy una ciudad palestina de la gobernación de Hebrón, en Cisjordania, en el borde del norte del Néguev."
  pt:
    - "Esta Gósen não é a terra no Egito onde se estabeleceu a família de Jacó, mas um distrito no sul de Canaã, nomeado apenas nos resumos das conquistas de Josué. Depois da campanha do sul, “Josué os feriu desde Cades-Barneia até Gaza, e toda a região de Gósen, até Gibeom”, e o resumo final de toda a conquista nomeia “todo o Sul, toda a terra de Gósen, a baixada, a Arabá”. Parece ter ficado entre a região montanhosa de Judá e o Neguebe, e muito provavelmente tomou o nome da cidade de Gósen, que Josué lista entre as cidades montanhosas de Judá num distrito com Debir, Estemoa e Anim."
    - "Além desses dois versículos nada se sabe do distrito: suas fronteiras não são dadas, e nenhum outro livro o nomeia. A própria cidade não está localizada. Uma proposta, que o mapa segue, a põe em ed-Dhahiriya, uma cidade de colina a cerca de 18 km a sudoeste de Hebrom, mas isso se apoia no lugar da cidade na lista, não em qualquer sobrevivência do nome. Ed-Dhahiriya é hoje uma cidade palestina na província de Hebrom, na Cisjordânia, na orla do norte do Neguebe."
  de:
    - "Dieses Goschen ist nicht das Land in Ägypten, wo Jakobs Familie sich niederließ, sondern ein Bezirk im Süden Kanaans, nur in den Zusammenfassungen von Josuas Eroberungen genannt. Nach dem Südfeldzug „schlug“ Josua sie „von Kades-Barnea an bis gen Gaza und das ganze Land Gosen bis gen Gibeon“, und die Schlusszusammenfassung der ganzen Eroberung nennt „alles, was gegen Mittag liegt, und das Land Gosen und die Gründe und das Gefilde“. Es scheint zwischen dem Bergland Judas und dem Negev gelegen zu haben und hat seinen Namen wahrscheinlich von der Stadt Goschen, die Josua unter den Bergstädten Judas in einem Bezirk mit Debir, Eschtemo und Anim aufführt."
    - "Über diese beiden Verse hinaus ist vom Bezirk nichts bekannt: Seine Grenzen werden nicht angegeben, und kein anderes Buch nennt ihn. Die Stadt selbst ist nicht lokalisiert. Ein Vorschlag, dem die Karte folgt, setzt sie bei ed-Dhahirija an, einer Bergstadt etwa 18 km südwestlich von Hebron, doch das beruht auf der Stellung der Stadt in der Liste, nicht auf dem Fortleben des Namens. Ed-Dhahirija ist heute eine palästinensische Stadt im Gouvernement Hebron des Westjordanlands, am Rand des nördlichen Negev."
  fr:
    - "Ce Gosen n’est pas le pays d’Égypte où s’établit la famille de Jacob mais un district du sud de Canaan, nommé seulement dans les résumés des conquêtes de Josué. Après la campagne du sud, « Josué les battit de Kadès-Barnéa à Gaza, il battit tout le pays de Gosen jusqu’à Gabaon », et le résumé final de toute la conquête dit que Josué s’empara « de tout le midi, de tout le pays de Gosen, de la vallée, de la plaine ». Il semble avoir été situé entre la montagne de Juda et le Négev, et il tira très probablement son nom de la ville de Gosen, que Josué inscrit parmi les villes de la montagne de Juda dans un même district avec Debir, Eschthemo et Anim."
    - "Au-delà de ces deux versets, on ne sait rien du district : ses limites ne sont pas données, et aucun autre livre ne le nomme. La ville elle-même n’est pas localisée. Une proposition, que suit la carte, la place à ed-Dhahiriya, ville de montagne à environ 18 km au sud-ouest d’Hébron, mais elle repose sur la place de la ville dans la liste, non sur une quelconque survivance du nom. Ed-Dhahiriya est aujourd’hui une ville palestinienne du gouvernorat d’Hébron, en Cisjordanie, en bordure du nord du Négev."
  pl:
    - "Ten Goszen nie jest ziemią w Egipcie, gdzie osiedliła się rodzina Jakuba, lecz okręgiem na południu Kanaanu, wymienionym tylko w streszczeniach podbojów Jozuego. Po kampanii południowej: „poraził je Jozue od Kades Barny aż do Gazy, i wszystkę ziemię Gosen, i aż do Gabaon”, a końcowe streszczenie całego podboju wymienia „wszystkę na południe leżącą, i wszystkę ziemię Gosen, i równiny, i pola”. Wydaje się, że leżał między górami Judy a Negewem i najpewniej wziął nazwę od miasta Goszen, które Jozue wymienia wśród miast górskich Judy w jednym okręgu z Debirem, Esztemoa i Anim."
    - "Poza tymi dwoma wersetami nic o okręgu nie wiadomo: jego granic nie podano i żadna inna księga go nie wymienia. Samego miasta nie zlokalizowano. Jedna propozycja, za którą idzie mapa, umieszcza je w ad-Dahirijja, miasteczku na wzgórzu około 18 km na południowy zachód od Hebronu, ale opiera się to na miejscu miasta w wykazie, nie na przetrwaniu nazwy. Ad-Dahirijja to dziś palestyńskie miasto w muhafazie Hebron na Zachodnim Brzegu, na skraju północnego Negewu."
  it:
    - "Questa Gosen non è la terra in Egitto dove si stabilì la famiglia di Giacobbe ma un distretto del sud di Canaan, nominato solo nei riassunti delle conquiste di Giosuè. Dopo la campagna meridionale «Giosuè li batté da Kades-Barnea fino a Gaza, e batté tutto il paese di Goscen fino a Gabaon», e il riassunto conclusivo dell’intera conquista nomina «tutto il mezzogiorno, tutto il paese di Goscen, la regione bassa, la pianura». Sembra che si trovasse fra i monti di Giuda e il Negheb, e con ogni probabilità prese nome dalla città di Gosen, che Giosuè elenca fra le città dei monti di Giuda in un distretto con Debir, Estemoa e Anim."
    - "Oltre a questi due versetti nulla si sa del distretto: i suoi confini non sono dati, e nessun altro libro lo nomina. La città stessa non è localizzata. Una proposta, che la mappa segue, la pone a ed-Dhahiriya, una città collinare circa 18 km a sud-ovest di Ebron, ma ciò poggia sul posto della città nell’elenco, non su alcuna sopravvivenza del nome. Ed-Dhahiriya è oggi una città palestinese nel governatorato di Ebron in Cisgiordania, al margine del Negheb settentrionale."
  nl:
    - "Dit Gosen is niet het land in Egypte waar Jakobs familie zich vestigde, maar een district in het zuiden van Kanaän, dat alleen in de samenvattingen van Jozua’s veroveringen wordt genoemd. Na de zuidelijke veldtocht staat er: “Jozua sloeg hen van Kades-Barnea en tot Gaza toe; ook het ganse land Gosen, en tot Gibeon toe”, en de slotsamenvatting van de hele verovering noemt “al het zuiden, en al het land van Gosen, en de laagte, en het vlakke veld”. Het lijkt te hebben gelegen tussen het bergland van Juda en de Negev, en heeft zijn naam waarschijnlijk van de stad Gosen, die Jozua onder de bergsteden van Juda noemt in één district met Debir, Estemoa en Anim."
    - "Buiten deze twee verzen is niets over het district bekend: zijn grenzen worden niet gegeven en geen ander boek noemt het. De stad zelf is niet gelokaliseerd. Een voorstel, dat de kaart volgt, plaatst haar bij ed-Dhahiriya, een bergstad ongeveer 18 km ten zuidwesten van Hebron, maar dit berust op de plaats van de stad in de lijst, niet op een overgeleverde naam. Ed-Dhahiriya is nu een Palestijnse stad in het gouvernement Hebron op de Westoever, aan de rand van de noordelijke Negev."
  cs:
    - "Tento Gošen není zemí v Egyptě, kde se usadila Jákobova rodina, nýbrž okresem na jihu Kanaánu, jmenovaným jen v souhrnech Jozuových výbojů. Po jižním tažení „Pohubil tedy Jozue všecko od Kádesbarne až do Gázy, a všecku zemi Gosen až do Gabaon“ a závěrečný souhrn celého dobývání jmenuje „všecku stranu polední, i všecku zemi Gosen, i roviny, i pole“. Zdá se, že ležel mezi judskou pahorkatinou a Negevem a nejspíše dostal jméno od města Gošen, které Jozue uvádí mezi horskými městy Judovými v jednom okrese s Debírem, Eštemoou a Anim."
    - "Mimo tyto dva verše o okrese nic není známo: jeho hranice nejsou dány a žádná jiná kniha jej nejmenuje. Samotné město není lokalizováno. Jeden návrh, který mapa následuje, jej klade do ed-Dhahiriya, horského města asi 18 km jihozápadně od Hebronu, ale opírá se o místo města v seznamu, nikoli o zachování jména. Ed-Dhahiriya je dnes palestinské město v hebronské gubernii Západního břehu, na okraji severního Negevu."
  sv:
    - "Detta Goshen är inte landet i Egypten där Jakobs släkt bosatte sig utan ett distrikt i södra Kanaan, nämnt bara i sammanfattningarna av Josuas erövringar. Efter det södra fälttåget heter det: ”Josua intog allt som fanns mellan Kades-Barnea och Gasa, så ock hela landet Gosen ända till Gibeon”, och slutsammanfattningen av hela erövringen nämner ”hela Sydlandet och hela landet Gosen, Låglandet och Hedmarken”. Det tycks ha legat mellan Judas bergsbygd och Negev, och troligen fick det sitt namn av staden Goshen, som Josua räknar upp bland Judas bergsstäder i ett distrikt med Devir, Eshtemoa och Anim."
    - "Utöver dessa två verser är inget känt om distriktet: dess gränser anges inte, och ingen annan bok nämner det. Själva staden är olokaliserad. Ett förslag, som kartan följer, placerar den vid ed-Dhahiriya, en bergsstad omkring 18 km sydväst om Hebron, men det vilar på stadens plats i förteckningen, inte på något bevarat namn. Ed-Dhahiriya är i dag en palestinsk stad i guvernementet Hebron på Västbanken, i kanten av norra Negev."
  nb:
    - "Denne Gosen er ikke landet i Egypt der Jakobs familie slo seg ned, men et distrikt i det sørlige Kanaan, nevnt bare i sammendragene av Josvas erobringer. Etter felttoget i sør heter det: «Alt som fantes mellem Kades-Barnea og Gasa, og hele Gosenlandet like til Gibeon slo han under sig», og det avsluttende sammendraget av hele erobringen nevner «hele sydlandet og hele Gosen-landet og lavlandet og ødemarken». Det synes å ha ligget mellom Judas fjellland og Negev, og det har mest sannsynlig fått navn etter byen Gosen, som Josva oppfører blant fjellbyene i Juda i ett distrikt med Debir, Estemo og Anim."
    - "Utover disse to versene er ingenting kjent om distriktet: dets grenser oppgis ikke, og ingen annen bok nevner det. Selve byen er ikke lokalisert. Ett forslag, som kartet følger, plasserer den ved ed-Dhahiriya, en fjellby omtrent 18 km sørvest for Hebron, men dette hviler på byens plass i listen, ikke på at navnet har overlevd. Ed-Dhahiriya er i dag en palestinsk by i Hebron-guvernementet på Vestbredden, i utkanten av det nordlige Negev."
  tl:
    - "Ang Gosen na ito ay hindi ang lupain sa Egipto kung saan nanirahan ang pamilya ni Jacob kundi isang distrito sa timog ng Canaan, na pinangalanan lamang sa mga buod ng pananakop ni Josue. Pagkatapos ng kampanya sa timog, “sinaktan sila ni Josue mula sa Cades-barnea hanggang sa Gaza, at ang buong lupain ng Gosen, hanggang sa Gabaon”, at pinangangalanan ng pangwakas na buod ng buong pananakop ang “buong Timugan, at ang buong lupain ng Gosen, at ang mababang lupain, at ang Araba”. Tila nasa pagitan ito ng lupaing maburol ng Juda at ng Negeb, at malamang na kinuha ang pangalan nito sa bayan ng Gosen, na itinatala ni Josue sa mga bayan sa burol ng Juda sa iisang distrito kasama ang Debir, Estemo at Anim."
    - "Higit pa sa dalawang talatang ito ay walang nalalaman tungkol sa distrito: hindi ibinibigay ang mga hangganan nito, at walang ibang aklat na nagpapangalan dito. Hindi rin natutukoy ang bayan. Isang mungkahi, na sinusunod ng mapa, ay inilalagay ito sa ed-Dhahiriya, isang bayan sa burol mga 18 km sa timog-kanluran ng Hebron, ngunit nakasalalay ito sa lugar ng bayan sa talaan, hindi sa anumang natirang pangalan. Ang ed-Dhahiriya ngayon ay isang bayang Palestino sa gobernadorado ng Hebron sa West Bank, sa gilid ng hilagang Negeb."
  da:
    - "Denne Gosjen er ikke landet i Egypten, hvor Jakobs familie bosatte sig, men et distrikt i det sydlige Kana'an, kun nævnt i sammenfatningerne af Josvas erobringer. Efter felttoget mod syd hedder det: »Josva slog dem fra Kades-Barnea og indtil Gaza og alt Gosen Land og indtil Gibeon«, og den afsluttende sammenfatning af hele erobringen nævner »Sydlandet og hele Gosen Land og Lavlandet og den slette Mark«. Det synes at have ligget mellem Judas bjergland og Negev, og det har mest sandsynligt fået navn efter byen Gosjen, som Josva opregner blandt Judas bjergbyer i ét distrikt med Debir, Esjtemoa og Anim."
    - "Ud over disse to vers vides intet om distriktet: dets grænser er ikke givet, og ingen anden bog nævner det. Selve byen er ikke lokaliseret. Et forslag, som kortet følger, placerer den ved ed-Dhahiriya, en bjergby omkring 18 km sydvest for Hebron, men det hviler på byens plads i listen, ikke på nogen overlevelse af navnet. Ed-Dhahiriya er i dag en palæstinensisk by i Hebron-guvernementet på Vestbredden, i udkanten af det nordlige Negev."
  sr:
    - "Овај Гесем није земља у Египту у којој се настанила Јаковљева породица, већ област на југу Ханана, именована само у сажецима Исусових освајања. После јужног похода „поби их Исус од Кадис-Варније до Газе, и сву земљу госенску до Гаваона“, а завршни сажетак целог освајања именује „сав јужни крај и сву земљу госенску, и равницу и поље“. Изгледа да је лежала између јудејске горе и Негева и да је највероватније име добила по граду Гесему, који Исус набраја међу градовима у гори у једном крају с Давиром, Естемоном и Анимом."
    - "Осим ова два стиха о области се ништа не зна: њене међе се не дају и ни једна друга књига је не именује. Сам град није лоциран. Један предлог, који карта следи, ставља га у Ед-Дахирију, брдски град око 18 км југозападно од Хеврона, али то почива на месту града у списку, а не на преживелом имену. Ед-Дахирија је данас палестински град у хевронском гувернорату на Западној обали, на ободу северног Негева."
  hu:
    - "Ez a Gósen nem az Egyiptom földjén lévő vidék, ahol Jákób családja letelepedett, hanem Kánaán déli részének egy kerülete, amelyet csak Józsué hódításainak összefoglalásai említenek. A déli hadjárat után így szól a szöveg: „Megveré pedig őket Józsué Kádes Barneától fogva egész Gázáig, a Gósennek is minden földét, egész Gibeonig”, és az egész hódítás záró összefoglalása megnevezi „az egész déli vidéket, az egész Gósen földét, úgy a síkságot, mint a pusztát”. Úgy tűnik, Júda hegyvidéke és a Negev között feküdt, és nevét valószínűleg Gósen városáról kapta, amelyet Józsué Júda hegyi városai között sorol fel, egy kerületben Debirrel, Estemóával és Ánimmal."
    - "E két versen túl a kerületről semmit sem tudunk: határai nincsenek megadva, és más könyv nem nevezi meg. Maga a város ismeretlen helyű. Az egyik javaslat, amelyet a térkép követ, ed-Dhahirijára helyezi, egy hegyi városra mintegy 18 km-re délnyugatra Hebrontól, de ez a város jegyzékbeli helyén alapul, nem a név fennmaradásán. Ed-Dhahirije ma palesztin város Ciszjordánia hebroni kormányzóságában, az északi Negev szélén."
  fi:
    - "Tämä Gosen ei ole Egyptin maa, johon Jaakobin perhe asettui, vaan Kanaanin eteläosan alue, joka mainitaan vain Joosuan valloitusten yhteenvedoissa. Eteläisen sotaretken jälkeen ”Joosua valtasi heidän alueensa Kaades-Barneasta Gassaan saakka ja koko Goosenin maakunnan Gibeoniin saakka”, ja koko valloituksen päätösyhteenveto mainitsee ”koko Etelämaan ja koko Goosenin maakunnan, Alankomaan ja Aromaan”. Se näyttää sijainneen Juudan vuoriston ja Negevin välissä, ja se sai todennäköisesti nimensä Gosenin kaupungista, jonka Joosua luettelee Juudan vuoristokaupunkien joukossa samassa piirissä Debirin, Estemon ja Animin kanssa."
    - "Näiden kahden jakeen lisäksi alueesta ei tiedetä mitään: sen rajoja ei anneta, eikä mikään muu kirja mainitse sitä. Itse kaupunkia ei ole paikannettu. Yksi ehdotus, jota kartta seuraa, sijoittaa sen ed-Dhahiriyaan, vuoristokaupunkiin noin 18 km Hebronista lounaaseen, mutta tämä perustuu kaupungin paikkaan luettelossa, ei nimen säilymiseen. Ed-Dhahiriya on nykyään palestiinalaiskaupunki Länsirannan Hebronin kuvernementissa, pohjoisen Negevin reunalla."
  vi:
    - "Gô-sen này không phải xứ ở Ê-díp-tô nơi gia đình Gia-cốp định cư mà là một vùng ở phía nam Ca-na-an, chỉ được nêu tên trong các bản tóm lược cuộc chinh phục của Giô-suê. Sau chiến dịch phía nam, “Giô-suê đánh các vua đó từ Ca-đe-Ba-nê-a cho đến Ga-xa, và toàn xứ Gô-sen cho đến Ga-ba-ôn”, và bản tóm lược kết thúc toàn bộ cuộc chinh phục nêu “nào cả miền nam, nào toàn xứ Gô-sen, nào đất thấp và đồng bằng”. Vùng này dường như nằm giữa miền núi Giu-đa và Nê-ghép, và rất có thể lấy tên từ thành Gô-sen, mà Giô-suê liệt kê trong các thành miền núi của Giu-đa thuộc cùng một vùng với Đê-bia, Ết-thê-mô và A-nim."
    - "Ngoài hai câu này không biết gì thêm về vùng: ranh giới không được nêu, và không sách nào khác nhắc đến. Chính thành cũng chưa xác định được vị trí. Một đề nghị, mà bản đồ theo, đặt thành ở ed-Dhahiriya, một thị trấn trên đồi cách Hếp-rôn khoảng 18 km về phía tây nam, nhưng điều này dựa vào vị trí của thành trong bảng kê, không phải vào việc tên còn sót lại. Ngày nay ed-Dhahiriya là một thị trấn Palestine thuộc huyện Hếp-rôn của Bờ Tây, ở rìa bắc Negev."
  ro:
    - "Acest Gosen nu este țara din Egipt unde s-a așezat familia lui Iacov, ci un district din sudul Canaanului, pomenit doar în rezumatele cuceririlor lui Iosua. După campania din sud, Iosua i-a ucis „din Kadis-Varni până la Gaza tot pământul Goson până la Gavaon”, iar rezumatul final al întregii cuceriri numește „tot pământul Naghev și tot pământul Goson și câmpul”. Se pare că se afla între regiunea muntoasă a lui Iuda și Neghev și că și-a luat probabil numele de la orașul Gosen, pe care Iosua îl enumeră printre orașele de munte ale lui Iuda într-un district cu Debir, Eștemoa și Anim."
    - "Dincolo de aceste două versete nu se cunoaște nimic despre district: hotarele lui nu sunt date, iar nicio altă carte nu-l pomenește. Orașul însuși nu este localizat. O propunere, pe care o urmează harta, îl așază la ed-Dhahiriya, un oraș pe deal la circa 18 km spre sud-vest de Hebron, dar aceasta se sprijină pe locul orașului în listă, nu pe vreo supraviețuire a numelui. Ed-Dhahiriya este astăzi un oraș palestinian din guvernoratul Hebron din Cisiordania, la marginea Neghevului de nord."
  bg:
    - "Този Гесем не е земята в Египет, където се засели семейството на Яков, а област в южен Ханаан, назована само в обобщенията на завоеванията на Иисус Навин. След южния поход „порази ги Исус от Кадис-варни дори до Газа, и всичката земя Гесен дори до Гаваон“, а заключителното обобщение на цялото завоевание назовава „всичката южна, и всичката земя Гесен, и равнината и полето“. Изглежда, тя е лежала между Юдейската планинска област и Негев и най-вероятно е получила името си от град Гесем, който книгата на Иисус Навин изброява сред планинските градове на Юда в една област с Давир, Ещемоа и Аним."
    - "Извън тези два стиха нищо не се знае за областта: границите ѝ не са дадени и никоя друга книга не я назовава. Самият град не е локализиран. Едно предположение, което картата следва, го поставя в ед-Дахирия, планински град на около 18 км югозападно от Хеврон, но то почива на мястото на града в списъка, а не на някакво оцеляване на името. Ед-Дахирия днес е палестински град в губернаторство Хеврон на Западния бряг, на края на северния Негев."
