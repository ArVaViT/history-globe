# Overview article (ADR 0007). Calneh of Gen 10:10 in Shinar: the Talmudic identification with Nippur (G. Rawlinson; the map's point) and Albright's reading of the word as "all of them" are shown without choosing. Not the Calneh/Calno of the prophets (calneh.yaml).
id: calneh-shinar
place: aee80af
title:
  en: "Calneh in Shinar"
  ru: "Халне в Сеннааре"
  cs: "Kalne v Šineáru"
  uk: "Калне в Сеннаарі"
  pl: "Kalne w Szinear"
  es: "Calne en Sinar"
  pt: "Calné em Sinar"
  de: "Kalne in Schinar"
  fr: "Calné (Schinear)"
  it: "Calne in Sennaar"
  nl: "Kalne in Sinear"
body:
  en:
    - "Genesis names Calneh as the fourth of the first cities of Nimrod's kingdom: “the beginning of his kingdom was Babel, and Erech, and Accad, and Calneh, in the land of Shinar.” Babel, Erech and Accad are well-known cities of southern Mesopotamia, but no Babylonian city called Calneh is known. The Babylonian Talmud (Yoma 10a) equates it with Nippur, and George Rawlinson followed this; the map sets it there. W. F. Albright proposed instead that the Hebrew letters should be read not as a name but as wekullanah, “and all of them”, so that the verse ends “Babel, Erech and Accad, all of them in the land of Shinar”, and the Revised Standard Version follows him."
    - "Nippur, today Nuffar in south-central Iraq, was the holy city of Enlil, the chief god of Sumer, whose temple, the Ekur, kings of Babylonia from Naram-Sin of Akkad onward rebuilt to gain the god's favour. It was never a royal capital, but whoever ruled the south sought recognition there. Expeditions of the University of Pennsylvania dug the site from 1889 to 1900 and found tens of thousands of tablets, among them much of the Sumerian literature known today, and the Oriental Institute of Chicago resumed work there in 1948. It is distinct from the Calneh, or Calno, of Amos and Isaiah in northern Syria."
  ru:
    - "Книга Бытия называет Халне четвёртым из первых городов царства Нимрода: «Царство его вначале составляли: Вавилон, Эрех, Аккад и Халне в земле Сеннаар». Вавилон, Эрех и Аккад — известные города Южной Месопотамии, но вавилонский город с именем Халне неизвестен. Вавилонский Талмуд (Йома 10а) отождествляет его с Ниппуром, и Джордж Роулинсон следовал этому; карта ставит его там. У. Ф. Олбрайт предложил читать эти еврейские буквы не как имя, а как векулланá, «и все они», так что стих кончается словами «Вавилон, Эрех и Аккад — все они в земле Сеннаар», и ему следует английский Пересмотренный стандартный перевод (RSV)."
    - "Ниппур, ныне Нуффар в южной части центрального Ирака, был священным городом Энлиля, верховного бога Шумера, чей храм Экур восстанавливали цари Вавилонии начиная с Нарам-Суэна Аккадского, чтобы снискать милость бога. Он никогда не был царской столицей, но всякий, кто правил югом, искал там признания. Экспедиции Пенсильванского университета копали его с 1889 по 1900 г. и нашли десятки тысяч табличек, среди них бо́льшую часть известной сегодня шумерской литературы, а Восточный институт Чикаго возобновил работы в 1948 г. Это не Халне, или Хално, Амоса и Исаии на севере Сирии."
  cs:
    - "Genesis jmenuje Kalne jako čtvrté z prvních měst Nimrodova království: „Počátek pak jeho království byl Babylon a Erech, Achad a Chalne, v zemi Sinear.“ Babel, Erek a Akkad jsou známá města jižní Mezopotámie, ale žádné babylonské město zvané Kalne není známo. Babylonský Talmud (Joma 10a) je ztotožňuje s Nippurem a George Rawlinson tento názor následoval; mapa je klade tam. W. F. Albright navrhl místo toho, že hebrejská písmena se mají číst nikoli jako jméno, ale jako wekullanah, „a všechna“, takže verš končí „Babel, Erek a Akkad, všechna v zemi Šineár“, a Revised Standard Version ho následuje."
    - "Nippur, dnes Nuffar v jihostředním Iráku, bylo svaté město Enlila, hlavního boha Sumeru, jehož chrám Ekur obnovovali králové Babylonie od Naram-Sina Akkadského počínaje, aby získali přízeň boha. Nikdy nebylo královským hlavním městem, ale kdokoli vládl jihu, hledal tam uznání. Expedice University of Pennsylvania kopaly na místě v letech 1889 až 1900 a nalezly desetitisíce tabulek, mezi nimi velkou část dnes známé sumerské literatury, a Oriental Institute v Chicagu tam obnovil práci roku 1948. Je odlišné od Kalne, neboli Kalna, u Amose a Izajáše v severní Sýrii."
  uk:
    - "Буття називає Калне четвертим з-поміж перших міст царства Німрода: «Царюваннє ж його роспростерлось на Бабилон, і Ерех, і Аккад, і Калне у Синеяр землї». Вавилон, Ерех і Аккад — добре відомі міста південної Месопотамії, але вавилонського міста на ім'я Калне не знано. Вавилонський Талмуд (Йома 10а) прирівнює його до Ніппура, і Джордж Роулінсон пішов за цим; мапа ставить його там. В. Ф. Олбрайт натомість запропонував читати єврейські літери не як ім'я, а як wekullanah, «і всі вони», так що вірш закінчується «Вавилон, Ерех і Аккад, усі вони в землі Сеннаар», і Переглянутий стандартний переклад іде за ним."
    - "Ніппур, нині Нуффар у південно-центральному Іраку, був священним містом Енліля, головного бога Шумеру, чий храм Екур царі Вавилонії від Нарам-Суена Аккадського відбудовували, щоб здобути милість бога. Він ніколи не був царською столицею, але той, хто правив півднем, шукав там визнання. Експедиції Пенсильванського університету розкопували місце від 1889 до 1900 р. і знайшли десятки тисяч табличок, серед них значну частину відомої нині шумерської літератури, а Східний інститут Чикаго відновив там роботу 1948 р. Він відмінний від Калне, або Кално, в Амоса й Ісаї на півночі Сирії."
  pl:
    - "Księga Rodzaju wymienia Kalne jako czwarte z pierwszych miast królestwa Nimroda: „A początek królestwa jego był Babel, i Erech, i Achad, i Chalne w ziemi Senaar”. Babel, Erek i Akad to dobrze znane miasta południowej Mezopotamii, lecz nie znamy żadnego babilońskiego miasta zwanego Kalne. Talmud babiloński (Joma 10a) utożsamia je z Nippur, a George Rawlinson poszedł za tym; mapa umieszcza je tam. W. F. Albright zaproponował natomiast, by hebrajskie litery czytać nie jako nazwę, lecz jako wekullanah, „i wszystkie one”, tak że werset kończy się słowami o Babel, Erek i Akad, wszystkich w ziemi Szinear, i idzie za nim Revised Standard Version."
    - "Nippur, dziś Nuffar w środkowo-południowym Iraku, było świętym miastem Enlila, głównego boga Sumeru, którego świątynię, Ekur, odbudowywali królowie Babilonii od Naram-Sina z Akadu, by zyskać przychylność boga. Nigdy nie było stolicą królewską, lecz każdy, kto rządził południem, szukał tam uznania. Wyprawy University of Pennsylvania badały stanowisko od 1889 do 1900 roku i znalazły dziesiątki tysięcy tabliczek, wśród nich znaczną część znanej dziś literatury sumeryjskiej, a Oriental Institute w Chicago wznowił prace w 1948 roku. Odróżnia się je od Kalne, czyli Kalno, u Amosa i Izajasza w północnej Syrii."
  es:
    - "El Génesis nombra Calne como la cuarta de las primeras ciudades del reino de Nimrod: «la cabecera de su reino Babel, y Erech, y Accad, y Calneh, en la tierra de Shinar». Babel, Erec y Acad son ciudades bien conocidas del sur de Mesopotamia, pero no se conoce ninguna ciudad babilonia llamada Calne. El Talmud de Babilonia (Yoma 10a) la equipara con Nippur, y George Rawlinson lo siguió; el mapa la sitúa allí. W. F. Albright propuso en cambio que las letras hebreas no se leyeran como un nombre sino como wekullanah, «y todas ellas», de modo que el versículo terminara «Babel, Erec y Acad, todas ellas en la tierra de Sinar», y la Revised Standard Version lo sigue."
    - "Nippur, hoy Nuffar, en el centro-sur de Irak, era la ciudad santa de Enlil, el dios principal de Sumer, cuyo templo, el Ekur, reconstruyeron para ganarse el favor del dios los reyes de Babilonia desde Naram-Sin de Acad en adelante. Nunca fue capital real, pero quien gobernaba el sur buscaba allí reconocimiento. Expediciones de la Universidad de Pensilvania excavaron el lugar de 1889 a 1900 y hallaron decenas de miles de tablillas, entre ellas buena parte de la literatura sumeria conocida hoy, y el Instituto Oriental de Chicago reanudó allí el trabajo en 1948. Es distinta de la Calne, o Calno, de Amós e Isaías, en el norte de Siria."
  pt:
    - "O Gênesis nomeia Calné como a quarta das primeiras cidades do reino de Ninrode: “O princípio do seu reino foi Babel, Ereque, Acade e Calné, na terra de Sinar.” Babel, Ereque e Acade são cidades bem conhecidas do sul da Mesopotâmia, mas não se conhece nenhuma cidade babilônica chamada Calné. O Talmude da Babilônia (Yoma 10a) a equipara a Nipur, e George Rawlinson o seguiu; o mapa a coloca ali. W. F. Albright propôs, em vez disso, que as letras hebraicas não fossem lidas como um nome, mas como wekullanah, “e todas elas”, de modo que o versículo termina com Babel, Ereque e Acade, todas elas na terra de Sinar, e a Revised Standard Version o segue."
    - "Nipur, hoje Nuffar, no centro-sul do Iraque, era a cidade santa de Enlil, o deus principal de Sumer, cujo templo, o Ekur, os reis da Babilônia, de Naram-Sin de Acade em diante, reconstruíram para obter o favor do deus. Nunca foi uma capital real, mas quem governava o sul buscava ali reconhecimento. Expedições da Universidade da Pensilvânia escavaram o sítio de 1889 a 1900 e encontraram dezenas de milhares de tabuinhas, entre elas grande parte da literatura suméria hoje conhecida, e o Instituto Oriental de Chicago retomou o trabalho ali em 1948. É distinta da Calné, ou Calno, de Amós e Isaías, no norte da Síria."
  de:
    - "Das Erste Buch Mose nennt Kalne als vierte der ersten Städte in Nimrods Reich: „Und der Anfang seines Reiches war Babel, Erech, Akkad und Chalne im Lande Sinear.“ Babel, Erech und Akkad sind bekannte Städte Südmesopotamiens, aber eine babylonische Stadt namens Kalne ist nicht bekannt. Der Babylonische Talmud (Joma 10a) setzt es mit Nippur gleich, und George Rawlinson folgte dem; die Karte setzt es dorthin. W. F. Albright schlug stattdessen vor, die hebräischen Buchstaben nicht als Namen, sondern als wekullanah zu lesen, „und sie alle“, sodass der Vers mit Babel, Erech und Akkad, allesamt im Land Schinar, endet, und die Revised Standard Version folgt ihm."
    - "Nippur, heute Nuffar im südlichen Zentralirak, war die heilige Stadt Enlils, des obersten Gottes Sumers, dessen Tempel, das Ekur, die Könige Babyloniens von Naram-Sin von Akkad an wieder aufbauten, um die Gunst des Gottes zu gewinnen. Es war nie eine königliche Hauptstadt, aber wer den Süden beherrschte, suchte dort Anerkennung. Expeditionen der University of Pennsylvania gruben die Stätte von 1889 bis 1900 aus und fanden Zehntausende von Tafeln, darunter einen großen Teil der heute bekannten sumerischen Literatur, und das Oriental Institute der Universität Chicago nahm dort 1948 die Arbeit wieder auf. Es ist vom Kalne oder Kalno bei Amos und Jesaja im Norden Syriens zu unterscheiden."
  fr:
    - "La Genèse nomme Calné comme la quatrième des premières villes du royaume de Nimrod : « Il régna d’abord sur Babel, Érec, Accad et Calné, au pays de Schinear. » Babel, Érec et Accad sont des villes bien connues du sud de la Mésopotamie, mais on ne connaît aucune ville babylonienne appelée Calné. Le Talmud de Babylone (Yoma 10a) l’identifie à Nippur, et George Rawlinson le suivit ; la carte l’y place. W. F. Albright proposa plutôt que les lettres hébraïques soient lues non comme un nom mais comme wekullanah, « et toutes », de sorte que le verset s’achève « Babel, Érec et Accad, toutes dans le pays de Schinear », et la Revised Standard Version le suit."
    - "Nippur, aujourd’hui Nuffar, dans le centre-sud de l’Irak, était la ville sainte d’Enlil, le dieu suprême de Sumer, dont le temple, l’Ekur, fut rebâti par les rois de Babylonie, depuis Naram-Sin d’Akkad, pour gagner la faveur du dieu. Elle ne fut jamais capitale royale, mais quiconque régnait sur le sud y cherchait la reconnaissance. Des expéditions de l’université de Pennsylvanie fouillèrent le site de 1889 à 1900 et trouvèrent des dizaines de milliers de tablettes, dont une grande part de la littérature sumérienne connue aujourd’hui, et l’Oriental Institute de Chicago y reprit le travail en 1948. Elle se distingue du Calné, ou Calno, d’Amos et d’Ésaïe, dans le nord de la Syrie."
  it:
    - "La Genesi nomina Calne come la quarta delle prime città del regno di Nimrod: «E il principio del suo regno fu Babel, Erec, Accad e Calne nel paese di Scinear». Babele, Uruk e Accad sono ben note città della Mesopotamia meridionale, ma non si conosce alcuna città babilonese chiamata Calne. Il Talmud babilonese (Yoma 10a) la identifica con Nippur, e George Rawlinson lo seguì; la carta la pone là. W. F. Albright propose invece che le lettere ebraiche si debbano leggere non come un nome ma come wekullanah, «e tutte loro», così che il versetto finisce «Babele, Uruk e Accad, tutte nel paese di Sennaar», e la Revised Standard Version lo segue."
    - "Nippur, oggi Nuffar nell’Iraq centro-meridionale, era la città santa di Enlil, il dio principale di Sumer, il cui tempio, l’Ekur, fu ricostruito dai re di Babilonia, da Naram-Sin di Accad in poi, per ottenere il favore del dio. Non fu mai una capitale regale, ma chiunque dominasse il sud cercava là il riconoscimento. Spedizioni della University of Pennsylvania scavarono il sito dal 1889 al 1900 e trovarono decine di migliaia di tavolette, tra cui gran parte della letteratura sumerica oggi nota, e l’Oriental Institute di Chicago vi riprese il lavoro nel 1948. È distinta dalla Calne, o Calno, di Amos e Isaia nella Siria settentrionale."
  nl:
    - "Genesis noemt Kalne als de vierde van de eerste steden van Nimrods rijk: “het beginsel zijns rijks was Babel, en Erech, en Accad, en Calne in het land Sinear.” Babel, Erech en Akkad zijn bekende steden van Zuid-Mesopotamië, maar een Babylonische stad Kalne is niet bekend. De Babylonische Talmoed (Yoma 10a) stelt haar gelijk aan Nippur, en George Rawlinson volgde dit; de kaart zet haar daar. W. F. Albright stelde daarentegen voor de Hebreeuwse letters niet als een naam maar als wekullanah, “en zij allen”, te lezen, zodat het vers eindigt met “Babel, Erech en Akkad, ze allen in het land Sinear”, en de Revised Standard Version volgt hem."
    - "Nippur, tegenwoordig Nuffar in het centrale zuiden van Irak, was de heilige stad van Enlil, de hoofdgod van Sumer, wiens tempel, de Ekur, koningen van Babylonië van Naram-Sin van Akkad af herbouwden om de gunst van de god te winnen. Het was nooit een koninklijke hoofdstad, maar wie het zuiden regeerde, zocht daar erkenning. Expedities van de University of Pennsylvania groeven de plaats van 1889 tot 1900 op en vonden tienduizenden tabletten, onder meer een groot deel van de Sumerische literatuur die thans bekend is, en het Oriental Institute van Chicago hervatte er in 1948 het werk. Het is te onderscheiden van het Kalne, of Kalno, van Amos en Jesaja in het noorden van Syrië."
