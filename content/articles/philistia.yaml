body:
  en:
    - "Philistia is the southern coastal plain of Canaan, from the Yarkon near Joppa down to the brook of Egypt, between the sea and the Shephelah, the foothills of Judah. Here lay the five cities of the Philistines, Gaza, Ashkelon and Ashdod on the coast road and Ekron and Gath inland, each under its own lord: Joshua counts “five lords of the Philistines”. The Bible brings the Philistines from Caphtor, usually taken to be Crete: the LORD brought up “the Philistines from Caphtor”, says Amos, and Jeremiah calls them “the remnant of the country of Caphtor”. Reliefs of Rameses III at Medinet Habu show the Peleset among the Sea Peoples who attacked Egypt about 1175 BC, and the earliest Philistine towns, with their Aegean-style pottery, hearths and pig bones, were settled soon after."
    - "In the days of the judges and of Saul the Philistines were Israel's chief enemy: Samson fought them, they captured the ark at Ebenezer, and after Gilboa they stripped off Saul's armour and sent word “into the land of the Philistines round about”. David, who had served Achish of Gath, subdued them, and the psalm cries “Philistia, triumph thou because of me”. Uzziah broke down the walls of Gath, Jabneh and Ashdod. From the eighth century the plain passed under Assyria: Tiglath-pileser III took Gaza in 734, Sargon II crushed the revolt of Ashdod in 711, and Sennacherib in 701 restored Padi, king of Ekron, whom Hezekiah had held in Jerusalem. Isaiah warned, “Rejoice not thou, whole Palestina”, and in 604 BC Nebuchadnezzar destroyed Ashkelon; Ekron fell about the same time, and the Philistines vanish from history."
    - "A dedicatory inscription found at Ekron in 1996 names its kings Padi and Achish, known from the Assyrian annals, and excavations at Ashdod, Ashkelon, Ekron (Tel Miqne) and Gath (Tell es-Safi) have traced the Philistine cities from their founding to their fall. The Greek name of the whole land, Palaistine, which Herodotus used in the fifth century BC, is the name of Philistia; Hadrian made it the name of the Roman province after 135, and from it comes Palestine. The psalmist still named “Philistia, and Tyre, with Ethiopia” among the nations born into Zion, and Zechariah foretold a stranger in Ashdod, when God would “cut off the pride of the Philistines”."
    - "Today the old Philistine plain is divided: Gaza lies in the Gaza Strip, with some two million people, while Ashkelon, Ashdod, with one of Israel's two main ports, and the mounds of Ekron and Gath lie in Israel."
  ru:
    - "Земля Филистимская — южная приморская равнина Ханаана, от Яркона у Яффы до потока Египетского, между морем и Шефелой, предгорьями Иудеи. Здесь стояли пять городов Филистимлян: Газа, Аскалон и Азот на приморской дороге, Екрон и Геф в глубине, каждый со своим владельцем; книга Иисуса Навина считает «пять владельцев Филистимских». Библия выводит Филистимлян из Кафтора, под которым обычно понимают Крит: Господь вывел «Филистимлян — из Кафтора», говорит Амос, а Иеремия называет их «остаток острова Кафтора». Рельефы Рамсеса III в Мединет-Абу показывают пелесет среди «народов моря», напавших на Египет около 1175 г. до н. э., и первые филистимские города с их посудой эгейского образца, очагами и свиными костями были заселены вскоре после того."
    - "Во дни судей и Саула Филистимляне были главным врагом Израиля: с ними воевал Самсон, они захватили ковчег при Авен-Езере, а после Гелвуя сняли с Саула доспехи и разослали весть «по всей земле Филистимской». Давид, служивший Анхусу Гефскому, покорил их, и псалом восклицает: «Восклицай Мне, земля Филистимская!» Озия разрушил стены Гефа, Иавнеи и Азота. С VIII века равнина перешла под власть Ассирии: Феглаффелласар III взял Газу в 734 г., Саргон II подавил восстание Азота в 711 г., а Сеннахирим в 701 г. вернул на престол Падия, царя Екрона, которого Езекия держал в Иерусалиме. Исаия предупреждал: «не радуйся, земля Филистимская», а в 604 г. до н. э. Навуходоносор разрушил Аскалон; около того же времени пал Екрон, и Филистимляне исчезают из истории."
    - "Посвятительная надпись, найденная в Екроне в 1996 году, называет его царей Падия и Ахиша, известных по ассирийским анналам, а раскопки Азота, Аскалона, Екрона (Тель-Микне) и Гефа (Телль-эс-Сафи) проследили филистимские города от основания до гибели. Греческое имя всей страны, Палестина, которым в V веке до н. э. пользовался Геродот, — это имя Филистии; после 135 года Адриан сделал его названием римской провинции. Псалмопевец всё ещё называл «Филистимляне и Тир с Ефиопиею» среди народов, рождённых в Сионе, а Захария предрекал чужое племя в Азоте, когда Бог уничтожит «высокомерие Филистимлян»."
    - "Сегодня древняя филистимская равнина разделена: Газа лежит в секторе Газа, где живёт около двух миллионов человек, а Ашкелон, Ашдод с одним из двух главных портов Израиля и холмы Екрона и Гефа — в Израиле."
  uk:
    - "Філістія — південна прибережна рівнина Ханаану, від Яркону поблизу Яффи до єгипетського потоку, між морем і Шефелою, передгір’ями Юди. Тут лежали п’ять міст филистимлян — Газа, Ашкелон і Ашдод на прибережній дорозі та Екрон і Гат углибині, кожне під владою свого володаря: Ісус Навин лічить «пять князїв Филистимських». Біблія виводить филистимлян із Кафтору, який зазвичай ототожнюють із Критом: Господь вивів, як каже Амос, «Филистіїв із Кафтору», а Єремія називає їх «останок острова Кафтора». Рельєфи Рамсеса III у Мединет-Абу показують пелесет серед народів моря, що напали на Єгипет близько 1175 р. до н. е., а найдавніші филистимські міста з їхньою егейською за стилем керамікою, вогнищами та кістками свиней було засновано невдовзі по тому."
    - "За часів суддів і Саула филистимляни були головним ворогом Ізраїля: Самсон воював з ними, вони захопили ковчег при Авен-Езері, а після Гілбоа зняли з Саула зброю й розіслали вістку «по цїлій Филистійській землї навкруги». Давид, що служив Анхусові Гатському, підкорив їх, і псалом вигукує: «Филистійська земле, ликуй передо мною!» Озія зруйнував мури Гата, Ябне й Ашдода. Від VIII ст. рівнина перейшла під владу Ассирії: Тіглатпаласар III взяв Газу 734 р. до н. е., Саргон II придушив повстання Ашдода 711 р. до н. е., а Сінаххеріб 701 р. до н. е. повернув на престол Паді, царя Екрона, якого Єзекія тримав у Єрусалимі. Ісая застерігав: «Не радуйся, земле Филистійська», а 604 р. до н. е. Навуходоносор зруйнував Ашкелон; Екрон упав приблизно тоді ж, і филистимляни зникають з історії."
    - "Присвятний напис, знайдений в Екроні 1996 р., називає його царів Паді та Анхуса, відомих з ассирійських літописів, а розкопки в Ашдоді, Ашкелоні, Екроні (Тель-Мікне) і Гаті (Телль-ес-Сафі) простежили филистимські міста від заснування до загибелі. Грецька назва всієї землі, Palaistine, якою користувався Геродот у V ст. до н. е., — це назва Філістії; Адріан зробив її назвою римської провінції після 135 р. н. е., і від неї походить Палестина. Псалмоспівець ще згадує серед народів, що народилися в Сіоні: «Филистея і Тир вкупі з Етіопією», а Захарія провіщав чужинця в Ашдоді — тоді, як Бог скаже: «зломлю гордощі Филистіїв»."
    - "Сьогодні давня филистимська рівнина поділена: Газа лежить у секторі Газа, де живе близько двох мільйонів людей, а Ашкелон, Ашдод — з одним із двох головних портів Ізраїлю — та тели Екрона й Гата лежать в Ізраїлі."
  es:
    - "Filistea es la llanura costera meridional de Canaán, desde el Yarkon, cerca de Jope, hasta el arroyo de Egipto, entre el mar y la Sefelá, las estribaciones de Judá. Aquí estaban las cinco ciudades de los filisteos, Gaza, Ascalón y Asdod en el camino de la costa y Ecrón y Gat tierra adentro, cada una bajo su propio señor: Josué cuenta cinco señores de los filisteos. La Biblia hace venir a los filisteos de Caftor, que suele tomarse por Creta: el Señor hizo subir «á los Palestinos de Caphtor», dice Amós, y Jeremías los llama «el resto de la isla de Caphtor». Los relieves de Ramsés III en Medinet Habu muestran a los Peleset entre los Pueblos del Mar que atacaron Egipto hacia 1175 a. C., y las primeras ciudades filisteas, con su cerámica de estilo egeo, sus hogares y huesos de cerdo, se poblaron poco después."
    - "En tiempos de los jueces y de Saúl los filisteos fueron el principal enemigo de Israel: Sansón los combatió, capturaron el arca en Ebenezer, y tras Gilboa quitaron a Saúl sus armas y enviaron mensajeros «á tierra de los Filisteos al contorno». David, que había servido a Aquis de Gat, los sometió, y el salmo exclama: «haz júbilo sobre mí, oh Palestina». Uzías derribó las murallas de Gat, Jabnia y Asdod. Desde el siglo VIII la llanura pasó a Asiria: Tiglat-pileser III tomó Gaza en 734, Sargón II aplastó la revuelta de Asdod en 711, y Senaquerib en 701 restituyó a Padi, rey de Ecrón, a quien Ezequías había tenido en Jerusalén. Isaías advirtió: «No te alegres tú, Filistea toda», y en 604 a. C. Nabucodonosor destruyó Ascalón; Ecrón cayó hacia la misma época, y los filisteos desaparecen de la historia."
    - "Una inscripción dedicatoria hallada en Ecrón en 1996 nombra a sus reyes Padi y Aquis, conocidos por los anales asirios, y las excavaciones en Asdod, Ascalón, Ecrón (Tel Miqne) y Gat (Tell es-Safi) han seguido las ciudades filisteas desde su fundación hasta su caída. El nombre griego de toda la tierra, Palaistine, que Heródoto usó en el siglo V a. C., es el nombre de Filistea; Adriano lo hizo nombre de la provincia romana después del 135, y de él viene Palestina. El salmista aún nombra «Palestina, y Tiro, con Etiopía» entre las naciones nacidas en Sion, y Zacarías anunció un extranjero en Asdod, cuando Dios diría: «yo talaré la soberbia de los Palestinos»."
    - "Hoy la antigua llanura filistea está dividida: Gaza se encuentra en la Franja de Gaza, con unos dos millones de habitantes, mientras que Ascalón, Asdod, con uno de los dos principales puertos de Israel, y los montículos de Ecrón y Gat se hallan en Israel."
  pt:
    - "A Filístia é a planície costeira meridional de Canaã, do Yarkon, perto de Jope, até o ribeiro do Egito, entre o mar e a Sefelá, as colinas de Judá. Ali ficavam as cinco cidades dos filisteus, Gaza, Ascalom e Asdode na estrada da costa e Ecrom e Gate no interior, cada uma sob seu senhor: Josué conta “os cinco senhores dos filisteus”. A Bíblia faz os filisteus virem de Caftor, geralmente tomada por Creta: o SENHOR trouxe “os filisteus de Caftor”, diz Amós, e Jeremias os chama “o remanescente da ilha de Caftor”. Relevos de Ramessés III em Medinet Habu mostram os Peleset entre os Povos do Mar que atacaram o Egito por volta de 1175 a.C., e as primeiras cidades filisteias, com cerâmica de estilo egeu, lareiras e ossos de porco, foram fundadas logo depois."
    - "No tempo dos juízes e de Saul, os filisteus foram o principal inimigo de Israel: Sansão os combateu, capturaram a arca em Ebenézer e, depois de Gilboa, tiraram a armadura de Saul e “enviaram mensageiros por toda a terra dos filisteus”. Davi, que servira a Aquis de Gate, os subjugou, e o salmo exclama: “Dou gritos de triunfo sobre a Filístia”. Uzias derrubou os muros de Gate, Jabne e Asdode. A partir do século VIII a planície passou à Assíria: Tiglate-Pileser III tomou Gaza em 734, Sargão II esmagou a revolta de Asdode em 711, e Senaqueribe, em 701, restaurou Padi, rei de Ecrom, que Ezequias mantivera em Jerusalém. Isaías advertiu: “Não se alegrem, todos vocês da Filístia”, e em 604 a.C. Nabucodonosor destruiu Ascalom; Ecrom caiu por volta da mesma época, e os filisteus somem da história."
    - "Uma inscrição dedicatória achada em Ecrom em 1996 nomeia seus reis Padi e Aquis, conhecidos dos anais assírios, e escavações em Asdode, Ascalom, Ecrom (Tel Miqne) e Gate (Tell es-Safi) acompanharam as cidades filisteias da fundação à queda. O nome grego de toda a terra, Palaistine, que Heródoto usou no século V a.C., é o nome da Filístia; Adriano o fez nome da província romana depois de 135, e dele vem Palestina. O salmista ainda nomeia “a Filístia, Tiro, e também a Etiópia” entre as nações nascidas em Sião, e Zacarias predisse estrangeiros em Asdode, quando Deus declarou: “eliminarei o orgulho dos filisteus”."
    - "Hoje a antiga planície filisteia está dividida: Gaza fica na Faixa de Gaza, com cerca de dois milhões de pessoas, enquanto Ascalom, Asdode, com um dos dois principais portos de Israel, e os montes de Ecrom e Gate ficam em Israel."
  de:
    - "Philistäa ist die südliche Küstenebene Kanaans, vom Jarkon bei Joppe bis zum Bach Ägyptens, zwischen dem Meer und der Schefela, dem Vorland Judas. Hier lagen die fünf Städte der Philister, Gaza, Aschkelon und Aschdod an der Küstenstraße und Ekron und Gat im Landesinnern, jede unter einem eigenen Herrn: Josua zählt „fünf Herren der Philister“. Die Bibel lässt die Philister aus Kaftor kommen, meist für Kreta gehalten: Der HERR führte „die Philister aus Kaphthor“, sagt Amos, und Jeremia nennt sie „die das übrige sind aus der Insel Kaphthor“. Reliefs Ramses' III. in Medinet Habu zeigen die Peleset unter den Seevölkern, die um 1175 v. Chr. Ägypten angriffen, und die ältesten philistäischen Städte mit ihrer ägäischen Keramik, ihren Herden und Schweineknochen wurden bald danach besiedelt."
    - "Zur Zeit der Richter und Sauls waren die Philister Israels Hauptfeind: Simson kämpfte gegen sie, sie nahmen die Lade bei Eben-Eser, und nach Gilboa zogen sie Saul die Waffen ab und sandten Boten „in der Philister Land umher“. David, der Achis von Gat gedient hatte, unterwarf sie, und der Psalm ruft: „Philistäa jauchzt mir zu“. Usija riss die Mauern von Gat, Jabne und Aschdod nieder. Ab dem 8. Jahrhundert kam die Ebene unter Assyrien: Tiglat-Pileser III. nahm 734 Gaza, Sargon II. schlug 711 den Aufstand von Aschdod nieder, und Sanherib setzte 701 Padi, den König von Ekron, wieder ein, den Hiskia in Jerusalem festgehalten hatte. Jesaja warnte: „Freue dich nicht, du ganzes Philisterland“, und 604 v. Chr. zerstörte Nebukadnezar Aschkelon; Ekron fiel etwa gleichzeitig, und die Philister verschwinden aus der Geschichte."
    - "Eine Weihinschrift, 1996 in Ekron gefunden, nennt seine Könige Padi und Achis, aus den assyrischen Annalen bekannt, und Grabungen in Aschdod, Aschkelon, Ekron (Tel Miqne) und Gat (Tell es-Safi) haben die philistäischen Städte von der Gründung bis zum Untergang verfolgt. Der griechische Name des ganzen Landes, Palaistine, den Herodot im 5. Jahrhundert v. Chr. gebrauchte, ist der Name Philistäas; Hadrian machte ihn nach 135 zum Namen der römischen Provinz, und von ihm kommt Palästina. Der Psalmist nennt noch „die Philister und Tyrer“ mit Äthiopien unter den in Zion geborenen Völkern, und Sacharja kündigte einen Fremden in Aschdod an, wenn Gott „der Philister Pracht ausrotten“ würde."
    - "Heute ist die alte Philisterebene geteilt: Gaza liegt im Gazastreifen mit etwa zwei Millionen Menschen, während Aschkelon, Aschdod mit einem der beiden Haupthäfen Israels und die Hügel von Ekron und Gat in Israel liegen."
  fr:
    - "La Philistie est la plaine côtière méridionale de Canaan, du Yarkon près de Joppé jusqu’au torrent d’Égypte, entre la mer et la Shéphéla, les contreforts de Juda. Là se trouvaient les cinq villes des Philistins, Gaza, Askalon et Asdod sur la route côtière, Ékron et Gath dans l’intérieur, chacune sous son propre seigneur : Josué compte « les cinq princes des Philistins ». La Bible fait venir les Philistins de Caphtor, d’ordinaire identifiée à la Crète : l’Éternel a fait monter « les Philistins de Caphtor », dit Amos, et Jérémie les appelle « les restes de l’île de Caphtor ». Des reliefs de Ramsès III à Médinet Habou montrent les Péleset parmi les Peuples de la mer qui attaquèrent l’Égypte vers 1175 av. J.-C., et les plus anciennes villes philistines, avec leur céramique de style égéen, leurs foyers et leurs os de porc, furent fondées peu après."
    - "Du temps des juges et de Saül, les Philistins furent le principal ennemi d’Israël : Samson les combattit, ils prirent l’arche à Ében-Ézer, et après Guilboa ils enlevèrent les armes de Saül et firent annoncer la nouvelle de sa mort « par tout le pays des Philistins ». David, qui avait servi Akisch de Gath, les soumit, et le psaume s’écrie : « Pays des Philistins, pousse à mon sujet des cris de joie ! » Ozias abattit les murs de Gath, de Jabné et d’Asdod. Dès le VIIIe siècle, la plaine passa sous l’Assyrie : Tiglath-Piléser III prit Gaza en 734, Sargon II écrasa la révolte d’Asdod en 711, et Sanchérib en 701 rétablit Padi, roi d’Ékron, qu’Ézéchias avait retenu à Jérusalem. Ésaïe avertit : « Ne te réjouis pas, pays des Philistins », et en 604 av. J.-C. Nebucadnetsar détruisit Askalon ; Ékron tomba à peu près au même moment, et les Philistins disparaissent de l’histoire."
    - "Une inscription de dédicace trouvée à Ékron en 1996 nomme ses rois Padi et Akisch, connus par les annales assyriennes, et les fouilles d’Asdod, d’Askalon, d’Ékron (Tel Miqne) et de Gath (Tell es-Safi) ont retracé les villes philistines de leur fondation à leur chute. Le nom grec de tout le pays, Palaistine, qu’Hérodote employait au Ve siècle av. J.-C., est le nom de la Philistie ; Hadrien en fit le nom de la province romaine après 135, et de là vient Palestine. Le psalmiste nomme encore « le pays des Philistins, Tyr, avec l’Éthiopie » parmi les nations nées dans Sion, et Zacharie annonça un étranger à Asdod, quand Dieu dirait : « J’abattrai l’orgueil des Philistins »."
    - "Aujourd’hui, l’ancienne plaine philistine est partagée : Gaza se trouve dans la bande de Gaza, avec quelque deux millions d’habitants, tandis qu’Askalon, Asdod, avec l’un des deux principaux ports d’Israël, et les tertres d’Ékron et de Gath se trouvent en Israël."
  it:
    - "La Filistea è la pianura costiera meridionale di Canaan, dallo Yarkon presso Giaffa giù fino al torrente d’Egitto, tra il mare e la Sefela, le pendici di Giuda. Qui sorgevano le cinque città dei Filistei, Gaza, Ascalona e Asdod sulla via costiera ed Ekron e Gat nell’interno, ciascuna sotto il proprio signore: Giosuè conta «cinque principi dei Filistei». La Bibbia fa venire i Filistei da Caftor, di solito identificata con Creta: il Signore trasse «i Filistei da Caftor», dice Amos, e Geremia li chiama «ciò che resta dell’isola di Caftor». I rilievi di Ramses III a Medinet Habu mostrano i Peleset tra i Popoli del Mare che attaccarono l’Egitto verso il 1175 a.C., e le prime città filistee, con la loro ceramica di stile egeo, i focolari e le ossa di maiale, furono insediate poco dopo."
    - "Ai tempi dei giudici e di Saul i Filistei furono il principale nemico di Israele: Sansone li combatté, catturarono l’arca a Eben-Ezer, e dopo Gilboa spogliarono Saul delle sue armi e mandarono messaggeri «all’intorno per il paese de’ Filistei». Davide, che aveva servito Achis di Gat, li sottomise, e il salmo grida: «o Filistia, fammi delle acclamazioni!» Ozia abbatté le mura di Gat, di Iabne e di Asdod. Dall’VIII secolo la pianura passò sotto l’Assiria: Tiglat-Pilèser III prese Gaza nel 734, Sargon II schiacciò la rivolta di Asdod nel 711, e Sennacherib nel 701 restituì il trono a Padi, re di Ekron, che Ezechia aveva tenuto a Gerusalemme. Isaia avvertì: «Non ti rallegrare, o Filistia tutta quanta», e nel 604 a.C. Nabucodonosor distrusse Ascalona; Ekron cadde più o meno nello stesso tempo, e i Filistei scompaiono dalla storia."
    - "Un’iscrizione dedicatoria trovata a Ekron nel 1996 nomina i suoi re Padi e Achis, noti dagli annali assiri, e gli scavi di Asdod, Ascalona, Ekron (Tel Miqne) e Gat (Tell es-Safi) hanno ricostruito le città filistee dalla fondazione alla caduta. Il nome greco dell’intera regione, Palaistine, usato da Erodoto nel V secolo a.C., è il nome della Filistea; Adriano ne fece il nome della provincia romana dopo il 135, e da esso viene Palestina. Il salmista nomina ancora «la Filistia e Tiro, con l’Etiopia» tra le nazioni nate a Sion, e Zaccaria predisse uno straniero ad Asdod, quando il Signore avrebbe detto: «io annienterò l’orgoglio dei Filistei»."
    - "Oggi l’antica pianura filistea è divisa: Gaza si trova nella Striscia di Gaza, con circa due milioni di persone, mentre Ascalona, Asdod, con uno dei due principali porti di Israele, e i tell di Ekron e di Gat si trovano in Israele."
  pl:
    - "Filistea to południowa nadmorska równina Kanaanu, od Jarkonu koło Jafy w dół do potoku Egiptu, między morzem a Szefelą, podgórzem Judy. Tu leżało pięć miast Filistynów, Gaza, Aszkelon i Aszdod przy drodze nadmorskiej oraz Ekron i Gat w głębi lądu, każde pod własnym władcą: Jozue liczy „pięcioro księstw Filistyńskich”. Biblia wywodzi Filistynów z Kaftoru, zwykle utożsamianego z Kretą: Pan wyprowadził, mówi Amos, „jako Filistyńczyków z Kaftor”, a Jeremiasz nazywa ich „ostatek wyspy Kaftor”. Reliefy Ramzesa III w Medinet Habu ukazują Peleset wśród Ludów Morza, które zaatakowały Egipt około 1175 roku p.n.e., a najstarsze miasta filistyńskie, z ceramiką w stylu egejskim, paleniskami i kośćmi świń, zasiedlono wkrótce potem."
    - "W czasach sędziów i Saula Filistyni byli głównym wrogiem Izraela: walczył z nimi Samson, zdobyli arkę pod Eben-Ezer, a po Gilboa zdarli z Saula zbroję i rozesłali wieść „po ziemi Filistyńskiej wszędzie”. Dawid, który służył Achiszowi z Gat, ujarzmił ich, a psalm woła: „ty, Palestyno! wykrzykaj nademną”. Uzzjasz zburzył mury Gat, Jabne i Aszdod. Od VIII wieku równina przeszła pod władzę Asyrii: Tiglat-Pileser III zdobył Gazę w 734, Sargon II zdławił bunt Aszdod w 711, a Sennacheryb w 701 przywrócił Padiego, króla Ekron, którego Ezechiasz więził w Jerozolimie. Izajasz ostrzegał: „Nie raduj się, ty wszystka ziemio Filistyńska!”, a w 604 roku p.n.e. Nabuchodonozor zburzył Aszkelon; Ekron upadł mniej więcej w tym samym czasie i Filistyni znikają z historii."
    - "Napis dedykacyjny znaleziony w Ekron w 1996 roku wymienia jego królów Padiego i Achisza, znanych z annałów asyryjskich, a wykopaliska w Aszdod, Aszkelonie, Ekron (Tel Miknie) i Gat (Tell es-Safi) prześledziły miasta filistyńskie od założenia do upadku. Greckie imię całego kraju, Palaistine, którego użył Herodot w V wieku p.n.e., jest nazwą Filistei; Hadrian uczynił z niej nazwę rzymskiej prowincji po 135 roku, a stąd pochodzi Palestyna. Psalmista wciąż wymieniał wśród narodów zrodzonych dla Syjonu Filistynów, Tyryjczyków i Etiopczyków, a Zachariasz zapowiedział obcego w Aszdod i słowa Boga: „wykorzenię pychę Filistyńczyków”."
    - "Dziś dawna równina filistyńska jest podzielona: Gaza leży w Strefie Gazy, z około dwoma milionami mieszkańców, a Aszkelon, Aszdod, z jednym z dwóch głównych portów Izraela, oraz kopce Ekron i Gat leżą w Izraelu."
  cs:
    - "Pelištie je jižní pobřežní rovina Kanaánu, od Jarkonu u Joppe po potok Egyptský, mezi mořem a Šefelou, pahorkatinou Judska. Zde ležela pět měst Pelištejců, Gaza, Aškelon a Ašdod při pobřežní cestě a Ekron a Gat ve vnitrozemí, každé pod vlastním knížetem: Jozue počítá „patero knížetství Filistinských“. Bible přivádí Pelištejce z Kaftoru, obvykle chápaného jako Kréta: Amos praví, že Hospodin vyvedl „Filistinské z Kaftor“, a Jeremjáš je nazývá „ostatek krajiny Kaftor“. Reliéfy Ramesse III. v Medínet Habú ukazují Peleset mezi Mořskými národy, které asi roku 1175 př. n. l. napadly Egypt, a nejstarší pelištejská města s egejskou keramikou, ohništi a vepřovými kostmi byla osídlena brzy poté."
    - "Za soudců a Saula byli Pelištejci hlavním nepřítelem Izraele: bojoval s nimi Samson, zmocnili se truhly u Eben-ezeru a po Gilboa svlékli Saulovi zbroj a „poslali po zemi Filistinské vůkol“ zprávu. David, který sloužil Achišovi z Gatu, je podrobil a žalm volá: „proti mně, Palestino, trub“. Uzijáš zbořil hradby Gatu, Jabne a Ašdodu. Od 8. století přešla rovina pod Asýrii: Tiglatpilesar III. dobyl Gazu roku 734, Sargon II. potlačil povstání Ašdodu roku 711 a Senacherib roku 701 dosadil zpět Padiho, krále Ekronu, kterého Chizkijáš držel v Jeruzalémě. Izajáš varoval: „Neraduj se všecka ty země Filistinská“, a roku 604 př. n. l. Nebukadnesar zničil Aškelon; Ekron padl asi v téže době a Pelištejci mizejí z dějin."
    - "Zasvěcovací nápis nalezený roku 1996 v Ekronu jmenuje jeho krále Padiho a Achiše, známé z asyrských análů, a vykopávky v Ašdodu, Aškelonu, Ekronu (Tel Miqne) a Gatu (Tell es-Sáfi) vystopovaly pelištejská města od založení po zánik. Řecké jméno celé země, Palaistiné, které užíval Hérodotos v 5. století př. n. l., je jménem Pelištie; Hadrianus z něj po roce 135 učinil jméno římské provincie a odtud pochází Palestina. Žalmista ještě jmenuje „Filistinské a Tyrské i Mouřeníny“ mezi národy zrozenými na Sijónu a Zacharjáš předpověděl cizince v Ašdodu, kdy Bůh řekne: „vypléním pýchu Filistinských“."
    - "Dnes je stará pelištejská rovina rozdělena: Gaza leží v Pásmu Gazy s asi dvěma miliony obyvatel, zatímco Aškelon, Ašdod s jedním ze dvou hlavních izraelských přístavů a pahorky Ekronu a Gatu leží v Izraeli."
  nl:
    - "Filistea is de zuidelijke kustvlakte van Kanaän, van de Jarkon bij Joppe tot de beek van Egypte, tussen de zee en de Sefela, de uitlopers van Juda. Hier lagen de vijf steden van de Filistijnen, Gaza, Askelon en Asdod aan de kustweg en Ekron en Gat landinwaarts, elk onder een eigen heer: Jozua telt “vijf vorsten der Filistijnen”. De Bijbel laat de Filistijnen uit Kaftor komen, meestal opgevat als Kreta: de HEER voerde “de Filistijnen uit Kafthor” op, zegt Amos, en Jeremia noemt hen “het overblijfsel des eilands van Kafthor”. Reliëfs van Raämses III te Medinet Habu tonen de Peleset onder de Zeevolken die Egypte omstreeks 1175 v.Chr. aanvielen, en de oudste Filistijnse steden, met hun aardewerk in Egeïsche stijl, haarden en varkensbeenderen, ontstonden kort daarna."
    - "In de dagen van de richters en van Saul waren de Filistijnen Israëls voornaamste vijand: Simson streed tegen hen, zij veroverden de ark bij Eben-Haëzer, en na Gilboa togen zij Saul de wapenen uit en zonden bericht “in der Filistijnen land rondom”. David, die Achis van Gat had gediend, onderwierp hen, en de psalm roept: “juich over mij, o gij Palestina!” Uzzia brak de muren van Gat, Jabne en Asdod af. Vanaf de 8e eeuw kwam de vlakte onder Assyrië: Tiglat-Pileser III nam Gaza in 734, Sargon II sloeg de opstand van Asdod neer in 711, en Sanherib herstelde in 701 Padi, koning van Ekron, die Chizkia in Jeruzalem had vastgehouden. Jesaja waarschuwde: “Verheug u niet, gij gans Palestina!”, en in 604 v.Chr. verwoestte Nebukadnessar Askelon; Ekron viel omstreeks dezelfde tijd, en de Filistijnen verdwijnen uit de geschiedenis."
    - "Een wijdingsopschrift dat in 1996 te Ekron werd gevonden, noemt haar koningen Padi en Achis, bekend uit de Assyrische annalen, en opgravingen te Asdod, Askelon, Ekron (Tel Miqne) en Gat (Tell es-Safi) hebben de Filistijnse steden van hun stichting tot hun val gevolgd. De Griekse naam van het hele land, Palaistine, die Herodotus in de 5e eeuw v.Chr. gebruikte, is de naam van Filistea; Hadrianus maakte hem na 135 tot de naam van de Romeinse provincie, en daarvan komt Palestina. De psalmist noemde nog “de Filistijn, en de Tyrier, met den Moor” onder de volken die in Sion geboren worden, en Zacharia voorspelde een vreemdeling in Asdod, wanneer God zou zeggen: “Ik zal den hoogmoed der Filistijnen uitroeien”."
    - "Tegenwoordig is de oude Filistijnse vlakte verdeeld: Gaza ligt in de Gazastrook, met zo’n twee miljoen mensen, terwijl Askelon, Asdod, met een van Israëls twee grote havens, en de heuvels van Ekron en Gat in Israël liggen."
