body:
  en:
    - "Uphaz is named twice, both times as a source of gold. Jeremiah mocks the idols of the nations, plated with “silver spread into plates… from Tarshish, and gold from Uphaz, the work of the workman”, and the man clothed in linen whom Daniel sees by the Tigris has his loins “girded with fine gold of Uphaz”. No place of that name is known from any other text or inscription, and where it lay, if it was a place at all, is not known."
    - "Two explanations compete. Many take Uphaz as a variant or a scribal corruption of Ophir, the gold land of Solomon's voyages: the Syriac, the Targum and some Greek witnesses read Ophir at Jeremiah 10:9, and the map accordingly sets Uphaz with Ophir, whose own site is uncertain (southern Arabia, East Africa and India have all been proposed). Others connect the word with the rare term for refined gold in 1 Kings 10:18, where Solomon's throne is overlaid with “the best gold”, so that “gold of Uphaz” would mean simply pure gold and name no land at all. Beyond this nothing can be said of Uphaz."
  ru:
    - "Уфаз назван дважды, и оба раза как источник золота. Иеремия высмеивает идолов народов, обложенных серебром из Фарсиса и золотом из Уфаза, «дело художника и рук плавильщика», а у мужа в льняной одежде, которого Даниил видит у Тигра, «чресла его опоясаны золотом из Уфаза». Ни один другой текст и ни одна надпись такого места не знают, и где он лежал, если это вообще было место, неизвестно."
    - "Спорят два объяснения. Многие видят в Уфазе вариант или описку имени Офир, золотой страны Соломоновых плаваний: Офир читают в Иеремии 10:9 сирийский перевод, Таргум и некоторые греческие свидетели текста, и карта соответственно помещает Уфаз вместе с Офиром, место которого само неясно (предлагали южную Аравию, Восточную Африку и Индию). Другие связывают слово с редким названием очищенного золота в 3 Царств 10:18, где престол Соломона обложен «чистым золотом», так что «золото из Уфаза» значило бы просто чистое золото и не называло бы никакой страны. Больше об Уфазе сказать нечего."
  uk:
    - "Уфаз названий двічі, обидва рази як джерело золота. Єремія глузує з ідолів народів, покритих «Розплескане в листки срібло, привезене з Тарсису, та золото з Уфазу, — робота майстерних людей», а муж у льняній одежі, якого Даниїл бачить над Тигром, має стан «підперезаний золотом із Уфазу». Місця з такою назвою не відомо з жодного іншого тексту чи напису, і де він лежав, якщо взагалі був місцем, невідомо."
    - "Змагаються два пояснення. Багато хто бере Уфаз за варіант або переписувальне спотворення Офіру, золотої землі подорожей Соломона: сирійський переклад, таргум і деякі грецькі свідчення тексту читають Офір у Єремії 10:9, і мапа відповідно ставить Уфаз біля Офіру, чиє власне місце непевне (пропонували південну Аравію, Східну Африку й Індію). Інші пов’язують слово з рідкісним терміном для очищеного золота в 1 Цар. 10:18, де престол Соломона обтягнуто «щирим золотом», так що «золото з Уфазу» означало б просто чисте золото й не називало жодної землі. Понад це про Уфаз сказати нічого."
  es:
    - "Ufaz se nombra dos veces, ambas como fuente de oro. Jeremías se burla de los ídolos de las naciones, revestidos de «plata extendida de Tarsis, y oro de Uphaz; obrará el artífice», y el varón vestido de lienzos que Daniel ve junto al Tigris tiene los lomos «ceñidos … de oro de Uphaz». No se conoce ningún lugar con ese nombre por ningún otro texto ni inscripción, y se ignora dónde estaba, si es que era un lugar."
    - "Compiten dos explicaciones. Muchos toman Ufaz como una variante o una corrupción de escriba de Ofir, la tierra del oro de los viajes de Salomón: la versión siríaca, el Targum y algunos testigos griegos leen Ofir en Jeremías 10:9, y por eso el mapa sitúa Ufaz con Ofir, cuyo propio emplazamiento es incierto (se han propuesto Arabia meridional, África oriental y la India). Otros relacionan la palabra con el raro término para el oro refinado de 1 Reyes 10:18, donde el trono de Salomón está recubierto de «oro purísimo», de modo que «oro de Uphaz» significaría simplemente oro puro y no nombraría ninguna tierra. Más allá de esto, nada puede decirse de Ufaz."
  pt:
    - "Ufaz é nomeada duas vezes, ambas como fonte de ouro. Jeremias zomba dos ídolos das nações, revestidos de “prata batida em placas, que é trazida de Társis, e ouro de Ufaz, obra do artífice”, e o homem vestido de linho que Daniel vê junto ao Tigre tem a cintura “adornada com ouro puro de Ufaz”. Nenhum lugar com esse nome é conhecido em outro texto ou inscrição, e onde ficava, se era mesmo um lugar, não se sabe."
    - "Duas explicações competem. Muitos tomam Ufaz por variante ou corrupção de escriba de Ofir, a terra do ouro das viagens de Salomão: o siríaco, o targum e alguns testemunhos gregos leem Ofir em Jeremias 10:9, e o mapa por isso põe Ufaz com Ofir, cujo próprio sítio é incerto (sul da Arábia, África Oriental e Índia já foram propostos). Outros ligam a palavra ao raro termo para ouro refinado em 1 Reis 10:18, onde o trono de Salomão é revestido com “o ouro mais puro”, de modo que “ouro de Ufaz” significaria simplesmente ouro puro e não nomearia terra alguma. Além disso nada se pode dizer de Ufaz."
  de:
    - "Ufas wird zweimal genannt, beide Male als Herkunft von Gold. Jeremia verspottet die Götzen der Völker: „Silbernes Blech bringt man aus Tharsis, Gold aus Uphas, durch den Meister und Goldschmied zugerichtet“, und der Mann in Leinwand, den Daniel am Tigris sieht, hat um die Lenden „einen goldenen Gürtel“ (hebräisch: Gold von Ufas). Kein Ort dieses Namens ist aus einem anderen Text oder einer Inschrift bekannt, und wo er lag, falls er überhaupt ein Ort war, ist unbekannt."
    - "Zwei Erklärungen konkurrieren. Viele halten Ufas für eine Variante oder einen Schreibfehler für Ofir, das Goldland von Salomos Fahrten: Die syrische Übersetzung, der Targum und einige griechische Textzeugen lesen in Jeremia 10,9 Ofir, und die Karte setzt Ufas deshalb zu Ofir, dessen eigene Lage ungewiss ist (Südarabien, Ostafrika und Indien wurden vorgeschlagen). Andere verbinden das Wort mit dem seltenen Begriff für geläutertes Gold in 1. Könige 10,18, wo Salomos Thron mit „dem edelsten Golde“ überzogen ist, sodass „Gold von Ufas“ einfach reines Gold bedeutete und kein Land nennte. Darüber hinaus lässt sich über Ufas nichts sagen."
  fr:
    - "Uphaz n’est nommé que deux fois, chaque fois comme source d’or. Jérémie se moque des idoles des nations, revêtues de « lames d’argent » apportées de Tarsis et d’« or d’Uphaz : l’ouvrier et la main de l’orfèvre les mettent en œuvre », et l’homme vêtu de lin que Daniel voit près du Tigre a les reins ceints d’une « ceinture d’or d’Uphaz ». Aucun lieu de ce nom n’est connu par un autre texte ou une autre inscription, et l’on ignore où il se trouvait, si c’était bien un lieu."
    - "Deux explications s’opposent. Beaucoup prennent Uphaz pour une variante ou une corruption de copiste d’Ophir, le pays de l’or des voyages de Salomon : la version syriaque, le Targum et certains témoins grecs lisent Ophir en Jérémie 10:9, et la carte place donc Uphaz avec Ophir, dont le site est lui-même incertain (l’Arabie du Sud, l’Afrique orientale et l’Inde ont toutes été proposées). D’autres rattachent le mot au terme rare pour l’or raffiné en 1 Rois 10:18, où le trône de Salomon est recouvert d’« or pur », de sorte que l’« or d’Uphaz » signifierait simplement de l’or pur sans nommer aucun pays. On ne peut rien dire de plus d’Uphaz."
  pl:
    - "Ufaz jest wymienione dwukrotnie, oba razy jako źródło złota. Jeremiasz szydzi z bożków narodów: „Srebro ciągnione z zamorza przywożone bywa, a złoto z Ufas, dzieło rzemieślnicze”, a mąż odziany w len, którego Daniel widzi nad Tygrysem, ma biodra, które „przepasane były złotem szczerem z Ufas”. Żaden kraj o tej nazwie nie jest znany z żadnego innego tekstu ani inskrypcji, a gdzie leżał, jeśli w ogóle był miejscem, nie wiadomo."
    - "Rywalizują dwa wyjaśnienia. Wielu bierze Ufaz za wariant lub błąd kopisty zamiast Ofir, kraju złota z wypraw Salomona: Peszitta, targum i niektóre świadectwa greckie czytają Ofir w Jr 10,9, i mapa odpowiednio umieszcza Ufaz z Ofirem, którego własne położenie jest niepewne (proponowano południową Arabię, Afrykę Wschodnią i Indie). Inni łączą to słowo z rzadkim określeniem złota oczyszczonego w 1 Krl 10,18, gdzie tron Salomona jest pokryty „szczerem złotem”, tak że „złoto z Ufaz” oznaczałoby po prostu czyste złoto i nie nazywałoby żadnego kraju. Poza tym o Ufaz nie można nic powiedzieć."
  it:
    - "Ufaz è nominata due volte, entrambe come fonte d’oro. Geremia deride gli idoli delle nazioni, rivestiti di «argento battuto in lastre portato da Tarsis, oro venuto da Ufaz, opera di scultore e di man d’orefice», e l’uomo vestito di lino che Daniele vede presso il Tigri ha i fianchi cinti da «una cintura d’oro d’Ufaz». Nessun luogo con questo nome è noto da altri testi o iscrizioni, e dove si trovasse, se era un luogo, non si sa."
    - "Due spiegazioni si contendono il campo. Molti prendono Ufaz come variante o corruzione di copista di Ofir, la terra dell’oro dei viaggi di Salomone: il siriaco, il Targum e alcuni testimoni greci leggono Ofir in Geremia 10,9, e la mappa pone perciò Ufaz con Ofir, il cui sito è a sua volta incerto (sono state proposte l’Arabia meridionale, l’Africa orientale e l’India). Altri collegano la parola al raro termine per l’oro raffinato in 1 Re 10,18, dove il trono di Salomone è rivestito d’«oro finissimo», così che «oro di Ufaz» significherebbe semplicemente oro puro e non nominerebbe alcuna terra. Oltre a ciò nulla si può dire di Ufaz."
  nl:
    - "Ufaz wordt tweemaal genoemd, beide keren als bron van goud. Jeremia bespot de afgoden van de volken, bekleed met “uitgerekt zilver … van Tarsis gebracht, en goud van Ufaz, tot een werk des werkmeesters”, en de man met linnen bekleed die Daniël bij de Tigris ziet, heeft zijn lenden “omgord met fijn goud van Ufaz”. Geen plaats met die naam is uit enige andere tekst of enig opschrift bekend, en waar het lag, als het al een plaats was, is niet bekend."
    - "Twee verklaringen dingen mee. Velen nemen Ufaz voor een variant of een afschrijffout van Ofir, het goudland van de reizen van Salomo: de Syrische vertaling, de Targoem en sommige Griekse getuigen lezen Ofir in Jeremia 10:9, en de kaart plaatst Ufaz dienovereenkomstig bij Ofir, waarvan de eigen ligging onzeker is (Zuid-Arabië, Oost-Afrika en Indië zijn allemaal voorgesteld). Anderen verbinden het woord met de zeldzame term voor gezuiverd goud in 1 Koningen 10:18, waar de troon van Salomo met “dicht goud” wordt overtrokken, zodat “goud van Ufaz” eenvoudig zuiver goud zou betekenen en geen land zou noemen. Verder kan over Ufaz niets worden gezegd."
  cs:
    - "Úfaz je jmenován dvakrát, pokaždé jako zdroj zlata. Jeremjáš se vysmívá modlám národů, potaženým stříbrem a zlatem: „Stříbro tažené z zámoří přivážíno bývá, a zlato z Ufaz, dílo řemeslníka“, a u Tigridu Daniel vidí muže oděného v len, o němž se praví: „bedra jeho přepásaná byla zlatem ryzím z Ufaz“. Žádné místo toho jména není známo z jiného textu ani nápisu a kde ležel, byl-li to vůbec místo, není známo."
    - "Soupeří dvě vysvětlení. Mnozí berou Úfaz jako variantu nebo opisovačské zkomolení Ofíru, zlaté země Šalomounových plaveb: syrština, targum a někteří řečtí textoví svědkové čtou v Jeremjášovi 10,9 Ofír a mapa proto klade Úfaz k Ofíru, jehož vlastní poloha je nejistá (navrhována byla jižní Arábie, východní Afrika i Indie). Jiní spojují slovo s řídkým výrazem pro čisté zlato v 1. Královské 10,18, kde je Šalomounův trůn obložen „zlatem ryzím“, takže „zlato z Úfazu“ by znamenalo prostě čisté zlato a nepojmenovávalo žádnou zemi. Víc o Úfazu říci nelze."
  sv:
    - "Ufas nämns två gånger, båda gångerna som källa till guld. Jeremia hånar folkens avgudar, belagda med ”silverplåt, hämtad från Tarsis, guld, fört ifrån Ufas, arbetat av en konstnär”, och mannen klädd i linne som Daniel ser vid Tigris är ”omgjordad kring sina länder med ett bälte av guld från Ufas”. Ingen plats med det namnet är känd från någon annan text eller inskrift, och var det låg, om det alls var en plats, är inte känt."
    - "Två förklaringar tävlar. Många tar Ufas som en variant eller ett skrivarfel för Ofir, guldlandet i Salomos sjöresor: syriskan, targumen och några grekiska vittnen läser Ofir i Jer 10:9, och kartan placerar därför Ufas vid Ofir, vars eget läge är osäkert (södra Arabien, Östafrika och Indien har alla föreslagits). Andra förbinder ordet med den sällsynta termen för renat guld i 1 Kung 10:18, där Salomos tron överdras med ”fint guld”, så att ”guld från Ufas” helt enkelt skulle betyda rent guld och inte nämna något land alls. Utöver detta kan ingenting sägas om Ufas."
  nb:
    - "Ufas er nevnt to ganger, begge ganger som kilde til gull. Jeremia håner folkenes avguder, belagt med «uthamret sølv innført fra Tarsis og gull fra Ufas, et verk av treskjærerens og av gullsmedens hender», og mannen kledd i lin som Daniel ser ved Tigris, har lendene «omgjorde med et belte av gull fra Ufas». Intet sted med det navnet er kjent fra noen annen tekst eller innskrift, og hvor det lå, hvis det i det hele tatt var et sted, er ikke kjent."
    - "To forklaringer konkurrerer. Mange tar Ufas som en variant eller en skrivefeil for Ofir, gulllandet i Salomos seilaser: syrisk, targumen og noen greske vitner leser Ofir i Jer 10,9, og kartet setter derfor Ufas sammen med Ofir, hvis egen beliggenhet er usikker (det sørlige Arabia, Øst-Afrika og India er alle foreslått). Andre knytter ordet til det sjeldne uttrykket for renset gull i 1 Kong 10,18, der Salomos trone er overtrukket med «rent gull», slik at «gull fra Ufas» ganske enkelt ville bety rent gull og ikke nevne noe land i det hele tatt. Utover dette kan ingenting sies om Ufas."
  tl:
    - "Dalawang beses binanggit ang Uphaz, pareho bilang pinagmumulan ng ginto. Tinutuya ni Jeremias ang mga diyus-diyosan ng mga bansa, na binalutan ng “pilak na pinukpok na dinala rito mula sa Tarsis, at ginto mula sa Uphaz, na gawa ng manggagawa”, at ang lalaking nararamtan ng lino na nakita ni Daniel sa tabi ng Tigris ay may mga balakang na “binigkisan ng taganas na ginto sa Uphas”. Walang lugar na may ganitong pangalan ang kilala mula sa ibang teksto o inskripsiyon, at hindi alam kung saan ito naroon, kung lugar nga ito."
    - "Dalawang paliwanag ang nagtatagisan. Itinuturing ng marami ang Uphaz na baryante o sirang kopya ng Ophir, ang lupain ng ginto sa mga paglalayag ni Salomon: binabasa ng Siriaco, ng Targum at ng ilang saksing Griego ang Ophir sa Jeremias 10:9, at alinsunod dito ay inilalagay ng mapa ang Uphaz kasama ng Ophir, na hindi tiyak ang sariling pook (iminungkahi ang timugang Arabia, Silangang Africa at India). Iniuugnay naman ng iba ang salita sa bihirang termino para sa dalisay na ginto sa 1 Mga Hari 10:18, kung saan binalot ang luklukan ni Salomon ng “gintong pinakamainam”, kaya ang “ginto sa Uphas” ay nangangahulugang purong ginto lamang at walang pinangalanang lupain. Higit pa rito, wala nang masasabi tungkol sa Uphaz."
  da:
    - "Ufaz nævnes to gange, begge gange som kilde til guld. Jeremias spotter folkenes afguder, overtrukket med »hamret Sølv, der føres fra Tharsis, og Guld fra Ufas, et Værk af Mesteren og af Guldsmedens Hænder«, og manden klædt i linned, som Daniel ser ved Tigris, har sine lænder »omgjordede med Guld af Ufas«. Intet sted af det navn kendes fra nogen anden tekst eller indskrift, og hvor det lå, hvis det overhovedet var et sted, er ukendt."
    - "To forklaringer konkurrerer. Mange tager Ufaz som en variant eller en skriverfejl for Ofir, guldlandet i Salomos sørejser: den syriske tekst, targum og nogle græske vidner læser Ofir i Jer 10,9, og kortet placerer derfor Ufaz sammen med Ofir, hvis eget sted er usikkert (det sydlige Arabien, Østafrika og Indien er alle blevet foreslået). Andre forbinder ordet med det sjældne udtryk for raffineret guld i 1 Kong 10,18, hvor Salomos trone er belagt med »lutret Guld«, så at »Guld af Ufas« blot ville betyde rent guld og ikke nævne noget land. Ud over dette kan intet siges om Ufaz."
  sr:
    - "Уфаз се помиње двапут, оба пута као извор злата. Јеремија се руга идолима народа, обложеним: „Сребро ковано доноси се из Тарсиса и злато из Уфаза, дело уметничко“, а човек обучен у платно кога Данило види крај Тигра има бокове опасане: „појас беше око њега од чистог злата из Уфаза“. Ниједно место тог имена није познато из другог текста или натписа, а где је лежало, ако је уопште било место, није познато."
    - "Надмећу се два објашњења. Многи Уфаз узимају као варијанту или писарско искварење Офира, златне земље Соломонових путовања: сиријски превод, таргум и неки грчки сведоци читају Офир у Јер 10,9, и карта зато Уфаз поставља са Офиром, чије је налазиште и само несигурно (предлагани су јужна Арабија, источна Африка и Индија). Други реч повезују с ретким изразом за пречишћено злато у 1. Цар 10,18, где је Соломонов престо обложен „чистим златом“, тако да би „злато из Уфаза“ значило просто чисто злато и не именује никакву земљу. Мимо овога о Уфазу се не може рећи ништа."
