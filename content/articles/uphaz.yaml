# Overview article (ADR 0007). Mainstream facts only; Uphaz is unlocated, and the two readings (a variant of Ophir, or a word for refined gold) are given without a choice.
id: uphaz
place: af55829
title:
  en: "Uphaz"
  ru: "Уфаз"
body:
  en:
    - "Uphaz is named twice, both times as a source of gold. Jeremiah mocks the idols of the nations, plated with “silver spread into plates… from Tarshish, and gold from Uphaz, the work of the workman”, and the man clothed in linen whom Daniel sees by the Tigris has his loins “girded with fine gold of Uphaz”. No place of that name is known from any other text or inscription, and where it lay, if it was a place at all, is not known."
    - "Two explanations compete. Many take Uphaz as a variant or a scribal corruption of Ophir, the gold land of Solomon's voyages: some Hebrew manuscripts, the Syriac and the Targum read Ophir at Jeremiah 10:9, and the map accordingly sets Uphaz with Ophir, whose own site is uncertain (southern Arabia, East Africa and India have all been proposed). Others connect the word with the rare term for refined gold in 1 Kings 10:18, where Solomon's throne is overlaid with “the best gold”, so that “gold of Uphaz” would mean simply pure gold and name no land at all. Beyond this nothing can be said of Uphaz."
  ru:
    - "Уфаз назван дважды, и оба раза как источник золота. Иеремия высмеивает идолов народов, обложенных серебром из Фарсиса и золотом из Уфаза, «дело художника и рук плавильщика», а у мужа в льняной одежде, которого Даниил видит у Тигра, «чресла его опоясаны золотом из Уфаза». Ни один другой текст и ни одна надпись такого места не знают, и где он лежал, если это вообще было место, неизвестно."
    - "Спорят два объяснения. Многие видят в Уфазе вариант или описку имени Офир, золотой страны Соломоновых плаваний: Офир читают в Иеремии 10:9 некоторые еврейские рукописи, сирийский перевод и Таргум, и карта соответственно помещает Уфаз вместе с Офиром, место которого само неясно (предлагали южную Аравию, Восточную Африку и Индию). Другие связывают слово с редким названием очищенного золота в 3 Царств 10:18, где престол Соломона обложен «чистым золотом», так что «золото из Уфаза» значило бы просто чистое золото и не называло бы никакой страны. Больше об Уфазе сказать нечего."
