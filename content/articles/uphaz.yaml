# Overview article (ADR 0007). Mainstream facts only; Uphaz is unlocated, and the two readings (a variant of Ophir, or a word for refined gold) are given without a choice.
id: uphaz
place: af55829
title:
  en: "Uphaz"
  ru: "Уфаз"
  uk: "Уфаз"
  es: "Ufaz"
  pt: "Ufaz"
  de: "Ufas"
  fr: "Uphaz"
body:
  en:
    - "Uphaz is named twice, both times as a source of gold. Jeremiah mocks the idols of the nations, plated with “silver spread into plates… from Tarshish, and gold from Uphaz, the work of the workman”, and the man clothed in linen whom Daniel sees by the Tigris has his loins “girded with fine gold of Uphaz”. No place of that name is known from any other text or inscription, and where it lay, if it was a place at all, is not known."
    - "Two explanations compete. Many take Uphaz as a variant or a scribal corruption of Ophir, the gold land of Solomon's voyages: some Hebrew manuscripts, the Syriac and the Targum read Ophir at Jeremiah 10:9, and the map accordingly sets Uphaz with Ophir, whose own site is uncertain (southern Arabia, East Africa and India have all been proposed). Others connect the word with the rare term for refined gold in 1 Kings 10:18, where Solomon's throne is overlaid with “the best gold”, so that “gold of Uphaz” would mean simply pure gold and name no land at all. Beyond this nothing can be said of Uphaz."
  ru:
    - "Уфаз назван дважды, и оба раза как источник золота. Иеремия высмеивает идолов народов, обложенных серебром из Фарсиса и золотом из Уфаза, «дело художника и рук плавильщика», а у мужа в льняной одежде, которого Даниил видит у Тигра, «чресла его опоясаны золотом из Уфаза». Ни один другой текст и ни одна надпись такого места не знают, и где он лежал, если это вообще было место, неизвестно."
    - "Спорят два объяснения. Многие видят в Уфазе вариант или описку имени Офир, золотой страны Соломоновых плаваний: Офир читают в Иеремии 10:9 некоторые еврейские рукописи, сирийский перевод и Таргум, и карта соответственно помещает Уфаз вместе с Офиром, место которого само неясно (предлагали южную Аравию, Восточную Африку и Индию). Другие связывают слово с редким названием очищенного золота в 3 Царств 10:18, где престол Соломона обложен «чистым золотом», так что «золото из Уфаза» значило бы просто чистое золото и не называло бы никакой страны. Больше об Уфазе сказать нечего."
  uk:
    - "Уфаз названий двічі, обидва рази як джерело золота. Єремія глузує з ідолів народів, покритих «Розплескане в листки срібло, привезене з Тарсису, та золото з Уфазу, — робота майстерних людей», а муж у льняній одежі, якого Даниїл бачить над Тигром, має стан «підперезаний золотом із Уфазу». Місця з такою назвою не відомо з жодного іншого тексту чи напису, і де він лежав, якщо взагалі був місцем, невідомо."
    - "Змагаються два пояснення. Багато хто бере Уфаз за варіант або переписувальне спотворення Офіру, золотої землі подорожей Соломона: деякі староєврейські рукописи, сирійський переклад і таргум читають Офір у Єремії 10:9, і мапа відповідно ставить Уфаз біля Офіру, чиє власне місце непевне (пропонували південну Аравію, Східну Африку й Індію). Інші пов’язують слово з рідкісним терміном для очищеного золота в 1 Цар. 10:18, де престол Соломона обтягнуто «щирим золотом», так що «золото з Уфазу» означало б просто чисте золото й не називало жодної землі. Понад це про Уфаз сказати нічого."
  es:
    - "Ufaz se nombra dos veces, ambas como fuente de oro. Jeremías se burla de los ídolos de las naciones, revestidos de «plata extendida de Tarsis, y oro de Uphaz; obrará el artífice», y el varón vestido de lienzos que Daniel ve junto al Tigris tiene los lomos «ceñidos … de oro de Uphaz». No se conoce ningún lugar con ese nombre por ningún otro texto ni inscripción, y se ignora dónde estaba, si es que era un lugar."
    - "Compiten dos explicaciones. Muchos toman Ufaz como una variante o una corrupción de escriba de Ofir, la tierra del oro de los viajes de Salomón: algunos manuscritos hebreos, la versión siríaca y el Targum leen Ofir en Jeremías 10:9, y por eso el mapa sitúa Ufaz con Ofir, cuyo propio emplazamiento es incierto (se han propuesto Arabia meridional, África oriental y la India). Otros relacionan la palabra con el raro término para el oro refinado de 1 Reyes 10:18, donde el trono de Salomón está recubierto de «oro purísimo», de modo que «oro de Uphaz» significaría simplemente oro puro y no nombraría ninguna tierra. Más allá de esto, nada puede decirse de Ufaz."
  pt:
    - "Ufaz é nomeada duas vezes, ambas como fonte de ouro. Jeremias zomba dos ídolos das nações, revestidos de “prata batida em placas, que é trazida de Társis, e ouro de Ufaz, obra do artífice”, e o homem vestido de linho que Daniel vê junto ao Tigre tem a cintura “adornada com ouro puro de Ufaz”. Nenhum lugar com esse nome é conhecido em outro texto ou inscrição, e onde ficava, se era mesmo um lugar, não se sabe."
    - "Duas explicações competem. Muitos tomam Ufaz por variante ou corrupção de escriba de Ofir, a terra do ouro das viagens de Salomão: alguns manuscritos hebraicos, o siríaco e o targum leem Ofir em Jeremias 10:9, e o mapa por isso põe Ufaz com Ofir, cujo próprio sítio é incerto (sul da Arábia, África Oriental e Índia já foram propostos). Outros ligam a palavra ao raro termo para ouro refinado em 1 Reis 10:18, onde o trono de Salomão é revestido com “o ouro mais puro”, de modo que “ouro de Ufaz” significaria simplesmente ouro puro e não nomearia terra alguma. Além disso nada se pode dizer de Ufaz."
  de:
    - "Ufas wird zweimal genannt, beide Male als Herkunft von Gold. Jeremia verspottet die Götzen der Völker: „Silbernes Blech bringt man aus Tharsis, Gold aus Uphas, durch den Meister und Goldschmied zugerichtet“, und der Mann in Leinwand, den Daniel am Tigris sieht, hat um die Lenden „einen goldenen Gürtel“ (hebräisch: Gold von Ufas). Kein Ort dieses Namens ist aus einem anderen Text oder einer Inschrift bekannt, und wo er lag, falls er überhaupt ein Ort war, ist unbekannt."
    - "Zwei Erklärungen konkurrieren. Viele halten Ufas für eine Variante oder einen Schreibfehler für Ofir, das Goldland von Salomos Fahrten: Einige hebräische Handschriften, die syrische Übersetzung und der Targum lesen in Jeremia 10,9 Ofir, und die Karte setzt Ufas deshalb zu Ofir, dessen eigene Lage ungewiss ist (Südarabien, Ostafrika und Indien wurden vorgeschlagen). Andere verbinden das Wort mit dem seltenen Begriff für geläutertes Gold in 1. Könige 10,18, wo Salomos Thron mit „dem edelsten Golde“ überzogen ist, sodass „Gold von Ufas“ einfach reines Gold bedeutete und kein Land nennte. Darüber hinaus lässt sich über Ufas nichts sagen."
  fr:
    - "Uphaz n’est nommé que deux fois, chaque fois comme source d’or. Jérémie se moque des idoles des nations, revêtues de « lames d’argent » apportées de Tarsis et d’« or d’Uphaz : l’ouvrier et la main de l’orfèvre les mettent en œuvre », et l’homme vêtu de lin que Daniel voit près du Tigre a les reins ceints d’une « ceinture d’or d’Uphaz ». Aucun lieu de ce nom n’est connu par un autre texte ou une autre inscription, et l’on ignore où il se trouvait, si c’était bien un lieu."
    - "Deux explications s’opposent. Beaucoup prennent Uphaz pour une variante ou une corruption de copiste d’Ophir, le pays de l’or des voyages de Salomon : certains manuscrits hébreux, la version syriaque et le Targum lisent Ophir en Jérémie 10:9, et la carte place donc Uphaz avec Ophir, dont le site est lui-même incertain (l’Arabie du Sud, l’Afrique orientale et l’Inde ont toutes été proposées). D’autres rattachent le mot au terme rare pour l’or raffiné en 1 Rois 10:18, où le trône de Salomon est recouvert d’« or pur », de sorte que l’« or d’Uphaz » signifierait simplement de l’or pur sans nommer aucun pays. On ne peut rien dire de plus d’Uphaz."
