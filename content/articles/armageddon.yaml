body:
  en:
    - "Armageddon, in Greek Harmagedon, is the name in Revelation of the place where the kings of the earth are gathered for the last battle. It is usually explained as Hebrew har Megiddo, “mount of Megiddo”, the fortress at the western edge of the Jezreel Valley that guarded the pass through the Carmel ridge, and the map places it there. Because Megiddo is a mound in a plain rather than a mountain, other readings have been proposed: Charles C. Torrey in 1938 took the Greek to render har moed, the “mount of the congregation” of Isaiah 14:13, and Meredith Kline in 1996 followed him, seeing in it Zion as the mount of assembly; William Hendriksen read Har-Magedon as a symbol of every battle in which God delivers his oppressed people."
    - "The name comes in the vision of the seven vials. When the sixth angel poured out his vial “upon the great river Euphrates”, its water dried up “that the way of the kings of the east might be prepared”, and three unclean spirits “like frogs” went out from the dragon, the beast and the false prophet to gather the kings “to the battle of that great day of God Almighty”. After the warning “Behold, I come as a thief”, the text closes: “And he gathered them together into a place called in the Hebrew tongue Armageddon”. The battle itself is not described there."
  ru:
    - "Армагеддон, по-гречески Хармагедон, — имя, которое Откровение даёт месту, где цари земли собраны на последнюю брань. Обычно его объясняют как еврейское хар Мегиддо, «гора Мегиддо», — крепость на западном краю Изреельской долины, стерёгшая проход через хребет Кармил; там его и ставит карта. Так как Мегиддо — холм на равнине, а не гора, предлагались и другие прочтения: Чарльз Торри в 1938 г. видел в греческом слове передачу хар моэд, «гору собрания» из Исаии 14:13 (в Синодальном переводе «на горе в сонме богов»), а Мередит Клайн в 1996 г. последовал за ним, понимая под ней Сион как гору собрания; Уильям Хендриксен считал Хар-Магедон образом всякой битвы, в которой Бог избавляет Свой угнетённый народ."
    - "Имя стоит в видении семи чаш. Когда «Шестой Ангел вылил чашу свою в великую реку Евфрат», «высохла в ней вода, чтобы готов был путь царям от восхода солнечного», и три духа нечистых, «подобных жабам», вышли из уст дракона, зверя и лжепророка, чтобы собрать царей «на брань в оный великий день Бога Вседержителя». После предостережения «Се, иду как тать» сказано: «И он собрал их на место, называемое по-еврейски Армагеддон». Самой битвы здесь не описано."
  uk:
    - "Армагеддон, грецькою Гармагедон, — назва в Одкровенні місця, де збираються царі землі на останню битву. Її зазвичай пояснюють як єврейське har Megiddo, «гора Мегіддо», фортеця на західному краю Їзреельської долини, що стерегла прохід крізь хребет Кармелю, і мапа ставить його там. Оскільки Мегіддо — це пагорб на рівнині, а не гора, запропоновано інші прочитання: Чарлз К. Торрі 1938 р. вважав, що грецьке передає har moed, гору збору з Ісаї 14:13, а Мередіт Клайн 1996 р. пішов за ним, бачачи в ній Сіон як гору збору; Вільям Гендріксен читав Хар-Маґедон як символ кожної битви, в якій Бог визволяє свій пригнічений народ."
    - "Назва постає у видінні семи чаш. Коли шостий ангел вилив чашу свою «на велику ріку Євфрат», вода її висохла, «щоб готова була дорога царям, що зі сходу сонця», і три нечисті духи, «подобні до жаб», вийшли від змія, звіра й лжепророка, щоб зібрати царів «на війну в день той великий Бога Вседержителя». Після застереження «Ось іду, як злодїй» текст завершується словами: «І зібрав їх в одно місце, що зоветь ся по єврейськи Армагедон». Сама битва там не описана."
  es:
    - "Armagedón, en griego Harmagedón, es el nombre que da el Apocalipsis al lugar donde los reyes de la tierra se congregan para la última batalla. Suele explicarse como el hebreo har Meguido, «monte de Meguido», la fortaleza del borde occidental del valle de Jezreel que guardaba el paso por la sierra del Carmelo, y el mapa lo sitúa allí. Como Meguido es un montículo en una llanura y no una montaña, se han propuesto otras lecturas: Charles C. Torrey, en 1938, tomó el griego como traducción de har moed, el monte de la asamblea de Isaías 14:13, y Meredith Kline, en 1996, lo siguió, viendo en él a Sion como monte de reunión; William Hendriksen leyó Har-Magedón como símbolo de toda batalla en que Dios libra a su pueblo oprimido."
    - "El nombre aparece en la visión de las siete copas. Cuando el sexto ángel derramó su copa «sobre el gran río Eufrates», su agua se secó «para que fuese preparado el camino de los reyes del Oriente», y tres espíritus inmundos «á manera de ranas» salieron del dragón, de la bestia y del falso profeta para congregar a los reyes «para la batalla de aquel gran día del Dios Todopoderoso». Tras la advertencia «He aquí, yo vengo como ladrón», el texto concluye: «Y los congregó en el lugar que en hebreo se llama Armagedón». La batalla misma no se describe allí."
  pt:
    - "Armagedom, em grego Harmagedon, é o nome, no Apocalipse, do lugar onde os reis da terra são reunidos para a batalha final. Costuma-se explicá-lo como o hebraico har Megiddo, “monte de Megido”, a fortaleza na extremidade ocidental do vale de Jezreel que guardava a passagem pela cordilheira do Carmelo, e o mapa o situa ali. Como Megido é um montículo numa planície, e não uma montanha, foram propostas outras leituras: Charles C. Torrey, em 1938, entendeu que o grego traduz har moed, o “monte da congregação” de Isaías 14:13, e Meredith Kline, em 1996, o seguiu, vendo nele Sião como monte da assembleia; William Hendriksen leu Har-Magedon como símbolo de toda batalha em que Deus liberta o seu povo oprimido."
    - "O nome aparece na visão das sete taças. Quando o sexto anjo derramou a sua taça “sobre o grande rio, o Eufrates”, a água secou “para que se preparasse o caminho para os reis que vêm do nascente do sol”, e três espíritos imundos “semelhantes a rãs” saíram do dragão, da besta e do falso profeta para reunir os reis “para a guerra daquele grande dia do Deus Todo-Poderoso”. Depois do aviso “Eis que venho como um ladrão”, o texto conclui: “E ele os reuniu no lugar que em hebraico se chama ‘Armagedom’”. A própria batalha não é ali descrita."
  de:
    - "Harmagedon ist in der Offenbarung der Name des Ortes, an dem die Könige der Erde zur letzten Schlacht versammelt werden. Gewöhnlich wird er als hebräisch har Megiddo erklärt, „Berg von Megiddo“, die Festung am Westrand der Jesreelebene, die den Pass durch den Karmelzug bewachte, und die Karte setzt ihn dorthin. Weil Megiddo ein Hügel in einer Ebene und kein Berg ist, wurden andere Lesungen vorgeschlagen: Charles C. Torrey nahm 1938 an, das Griechische gebe har moed wieder, den Versammlungsberg von Jesaja 14,13 (in der King-James-Bibel der Berg der Versammlung), und Meredith Kline folgte ihm 1996 und sah darin Zion als Berg der Versammlung; William Hendriksen las Har-Magedon als Sinnbild jeder Schlacht, in der Gott sein bedrängtes Volk befreit."
    - "Der Name steht in der Vision der sieben Schalen. Als der sechste Engel seine Schale „auf den großen Wasserstrom Euphrat“ goss, vertrocknete sein Wasser, „auf daß bereitet würde der Weg den Königen vom Aufgang der Sonne“, und drei unreine Geister „gleich den Fröschen“ gingen aus dem Drachen, dem Tier und dem falschen Propheten aus, um die Könige „in den Streit auf jenen Tag Gottes, des Allmächtigen“ zu versammeln. Nach der Warnung „Siehe, ich komme wie ein Dieb“ schließt der Text: „Und er hat sie versammelt an einen Ort, der da heißt auf hebräisch Harmagedon.“ Die Schlacht selbst wird dort nicht beschrieben."
  fr:
    - "Armageddon, en grec Harmagedôn, est le nom, dans l’Apocalypse, du lieu où les rois de la terre sont rassemblés pour le dernier combat. On l’explique d’ordinaire par l’hébreu har Megiddo, « montagne de Meguiddo », la forteresse du bord occidental de la vallée de Jizreel qui gardait le passage à travers la crête du Carmel, et la carte l’y place. Comme Meguiddo est une butte dans une plaine plutôt qu’une montagne, d’autres lectures ont été proposées : Charles C. Torrey, en 1938, tint le grec pour la transcription de har moed, la « montagne de l’assemblée » d’Ésaïe 14:13, et Meredith Kline le suivit en 1996, y voyant Sion comme montagne d’assemblée ; William Hendriksen lut Har-Maguédon comme le symbole de tout combat où Dieu délivre son peuple opprimé."
    - "Le nom vient dans la vision des sept coupes. Lorsque le sixième ange versa sa coupe « sur le grand fleuve, l’Euphrate », son eau tarit « afin que le chemin des rois venant de l’Orient fût préparé », et trois esprits impurs « semblables à des grenouilles » sortirent du dragon, de la bête et du faux prophète pour rassembler les rois « pour le combat du grand jour du Dieu tout-puissant ». Après l’avertissement « Voici, je viens comme un voleur », le texte conclut : « Ils les rassemblèrent dans le lieu appelé en hébreu Harmaguédon. » Le combat lui-même n’y est pas décrit."
  it:
    - "Armaghedon, in greco Harmaghedon, è il nome che l’Apocalisse dà al luogo dove i re della terra sono radunati per l’ultima battaglia. Di solito si spiega come l’ebraico har Meghiddo, «monte di Meghiddo», la fortezza all’estremità occidentale della valle di Izreel che sorvegliava il passo attraverso la catena del Carmelo, e la carta lo colloca lì. Poiché Meghiddo è un tell in una pianura e non una montagna, sono state proposte altre letture: Charles C. Torrey nel 1938 ritenne che il greco rendesse har moed, il «monte dell’assemblea» di Isaia 14,13, e Meredith Kline nel 1996 lo seguì, vedendovi Sion come monte dell’assemblea; William Hendriksen lesse Har-Magedon come simbolo di ogni battaglia in cui Dio libera il suo popolo oppresso."
    - "Il nome compare nella visione delle sette coppe. Quando il sesto angelo versò la sua coppa «sul gran fiume Eufrate», la sua acqua fu asciugata «affinché fosse preparata la via ai re che vengono dal levante», e tre «spiriti immondi simili a rane» uscirono dal dragone, dalla bestia e dal falso profeta per radunare i re «per la battaglia del gran giorno dell’Iddio Onnipotente». Dopo l’avvertimento «Ecco, io vengo come un ladro», il testo si chiude: «Ed essi li radunarono nel luogo che si chiama in ebraico Harmaghedon». La battaglia stessa non vi è descritta."
  nl:
    - "Armageddon, in het Grieks Harmagedon, is in Openbaring de naam van de plaats waar de koningen van de aarde worden verzameld voor de laatste strijd. Het wordt gewoonlijk verklaard als Hebreeuws har Megiddo, ‘berg van Megiddo’, de vesting aan de westrand van de Jizreëlvallei die de pas door de Karmelrug bewaakte, en de kaart plaatst het daar. Omdat Megiddo een heuvel in een vlakte is en geen berg, zijn andere lezingen voorgesteld: Charles C. Torrey vatte het Grieks in 1938 op als weergave van har moed, “den berg der samenkomst” van Jesaja 14:13, en Meredith Kline volgde hem in 1996 en zag er Sion in als de berg van de vergadering; William Hendriksen las Har-Magedon als symbool van elke strijd waarin God zijn onderdrukte volk bevrijdt."
    - "De naam komt voor in het visioen van de zeven fiolen. Toen de zesde engel zijn fiool uitgoot “op de grote rivier, den Eufraat”, droogde haar water op, “opdat bereid zou worden de weg der koningen, die van den opgang der zon komen zullen”, en drie onreine geesten, “den vorsen gelijk”, gingen uit van de draak, het beest en de valse profeet om de koningen te verzamelen “tot den krijg van dien groten dag des almachtigen Gods”. Na de waarschuwing “Ziet, Ik kom als een dief” sluit de tekst: “En zij hebben hen vergaderd in de plaats, welke in het Hebreeuws genaamd wordt Armageddon.” De strijd zelf wordt daar niet beschreven."
  pl:
    - "Armagedon, po grecku Harmagedon, to nazwa z Apokalipsy miejsca, w którym królowie ziemi gromadzą się na ostatnią bitwę. Zwykle tłumaczy się ją jako hebrajskie har Megiddo, „góra Megiddo”, twierdzy na zachodnim skraju Doliny Jizreel, strzegącej przejścia przez grzbiet Karmelu; mapa umieszcza je właśnie tam. Ponieważ Megiddo jest wzgórzem pośrodku równiny, a nie górą, zaproponowano inne odczytania: Charles C. Torrey w 1938 roku uznał, że grecki zapis oddaje har moed, górę zgromadzenia z Księgi Izajasza 14,13, a Meredith Kline w 1996 roku poszedł za nim, widząc w niej Syjon jako górę zgromadzenia; William Hendriksen odczytywał Har-Magedon jako symbol każdej bitwy, w której Bóg wybawia swój uciskany lud."
    - "Nazwa pojawia się w wizji siedmiu czasz. Gdy szósty anioł wylał swą czaszę „na onę wielką rzekę Eufrates”, jej woda wyschła, „aby zgotowana była droga królom od wschodu słońca”, a trzy nieczyste duchy, „podobne żabom”, wyszły ze smoka, bestii i fałszywego proroka, by zgromadzić królów „na wojnę onego wielkiego dnia Boga wszechmogącego”. Po ostrzeżeniu „Oto idę jako złodziej” tekst kończy się słowami: „I zgromadził ich na miejsce, które zowią po żydowsku Armagieddon”. Samej bitwy tam nie opisano."
  cs:
    - "Armagedon, řecky Harmagedon, je jméno místa v Janově Zjevení, kde se shromáždí králové země k poslední bitvě. Obvykle se vykládá jako hebrejské har Megiddo, „hora Megido“, pevnost na západním okraji Jizreelského údolí, která střežila průsmyk hřebenem Karmelu, a mapa je klade tam. Protože Megido je pahorek v rovině, a ne hora, byly navrženy jiné výklady: Charles C. Torrey roku 1938 pokládal řecké slovo za přepis har moed, hory setkání (shromáždění) z Izajáše 14,13, a Meredith Kline ho roku 1996 následoval a spatřoval v něm Sijón jako horu shromáždění; William Hendriksen četl Har-Magedon jako symbol každé bitvy, v níž Bůh vysvobozuje svůj utlačovaný lid."
    - "Jméno přichází ve vidění sedmi koflíků. Když šestý anděl vylil koflík svůj „na tu velikou řeku Eufrates“, vyschla její voda, „aby připravena byla cesta králům od východu slunce“, a z úst draka, šelmy a falešného proroka vyšli tři nečistí duchové „podobní žabám“, aby shromáždili krále „k boji, k tomu velikému dni Boha všemohoucího“. Po varování „Aj, přicházímť jako zloděj“ text končí: „I shromáždil je na místo, kteréž slove Židovsky Armageddon.“ Sama bitva tam popsána není."
  sv:
    - "Harmagedon (grekiska Harmagedōn) är namnet i Uppenbarelseboken på platsen där jordens kungar samlas till den sista striden. Det förklaras vanligen som hebreiskans har Megiddo, ”Megiddos berg”, fästningen vid västra kanten av Jisreeldalen som bevakade passet genom Karmelryggen, och kartan placerar det där. Eftersom Megiddo är en kulle på en slätt snarare än ett berg har andra läsningar föreslagits: Charles C. Torrey tog 1938 den grekiska formen för att återge har moed, ”församlingens berg” i Jesaja 14:13, och Meredith Kline följde honom 1996 och såg i det Sion som församlingens berg; William Hendriksen läste Har-Magedon som en symbol för varje strid där Gud befriar sitt förtryckta folk."
    - "Namnet förekommer i visionen om de sju skålarna. När den sjätte ängeln göt ut sin skål ”över den stora floden Eufrat” torkade dess vatten ut, ”för att väg skulle beredas åt konungarna från östern”, och tre orena andar, ”lika paddor”, utgick ur draken, vilddjuret och den falske profeten för att samla kungarna ”till striden på Guds, den Allsmäktiges, stora dag”. Efter varningen ”Se, jag kommer såsom en tjuv” slutar texten: ”Och de församlade dem till den plats som på hebreiska heter Harmagedon.” Själva striden beskrivs inte där."
  nb:
    - "Harmageddon, på gresk Harmagedon, er navnet i Johannes' åpenbaring på stedet der jordens konger samles til den siste striden. Det forklares vanligvis som hebraisk har Megiddo, «Megiddos fjell», festningen i vestenden av Jisreel-dalen som voktet passet gjennom Karmel-ryggen, og kartet plasserer det der. Fordi Megiddo er en tell på en slette snarere enn et fjell, er andre lesninger foreslått: Charles C. Torrey tok i 1938 det greske for å gjengi har moed, «forsamlingens fjell» i Jesaja 14,13, og Meredith Kline fulgte ham i 1996 og så i det Sion som samlingsfjell; William Hendriksen leste Har-Magedon som et symbol på hver kamp der Gud befrir sitt undertrykte folk."
    - "Navnet står i synet av de sju skålene. Da den sjette engelen tømte skålen sin «ut i den store elv Eufrat», tørket vannet bort, «forat der skulde ryddes vei for kongene fra Østen», og tre urene ånder som «lignet padder» gikk ut fra dragen, dyret og den falske profeten for å samle kongene «til krigen på Guds, den allmektiges, store dag». Etter advarselen «Se, jeg kommer som en tyv» slutter teksten: «Og han samlet dem på det sted som på hebraisk heter Harmageddon.» Selve slaget beskrives ikke der."
scripture:
  - Rev.16.12-Rev.16.16
  - Isa.14.13
sources:
  - "C. C. Torrey, 'Armageddon', Harvard Theological Review 31 (1938) 237–248"
  - "M. G. Kline, 'Har Magedon: The End of the Millennium', Journal of the Evangelical Theological Society 39 (1996) 207–222"
  - "W. Hendriksen, More than Conquerors: An Interpretation of the Book of Revelation (1940)"
