# Overview article (ADR 0007). Mainstream facts only; the dating of the Edomite king list is named as debated and the site as a guess.
id: masrekah
place: a57e0a0
title:
  en: "Masrekah"
  ru: "Масрека"
body:
  en:
    - "Masrekah was the home of Samlah, one of the kings of Edom listed in Genesis 36 as reigning “before there reigned any king over the children of Israel”: “And Hadad died, and Samlah of Masrekah reigned in his stead.” Chronicles repeats the list almost word for word. The kings of this list do not succeed father to son, and most are tied to a town or land of their own, so Masrekah was presumably a town of some standing in Edom; when the list was compiled and how far back it reaches is debated. The name seems to come from sorek, a choice vine, and may mean “vineyard”."
    - "No other source names it, and its site is unknown. The map places it with moderate confidence within a few kilometres of Jebel el-Musraq in the south of Edom, chosen for the likeness of the name, in today’s southern Jordan between Petra and the Gulf of Aqaba. No ruin there has yielded anything that names the town."
  ru:
    - "Масрека — родина Самлы, одного из царей Едома, перечисленных в 36-й главе Бытия как царствовавшие «прежде царствования царей у сынов Израилевых»: «И умер Гадад, и воцарился по нем Самла из Масреки». Книга Паралипоменон повторяет перечень почти слово в слово. Цари этого списка не наследуют друг другу от отца к сыну, и большинство связаны каждый со своим городом или землёй, так что Масрека, по-видимому, была заметным городом Едома; когда составлен список и насколько далеко в прошлое он уходит — спорно. Имя, кажется, происходит от слова «сорек», отборная лоза, и может значить «виноградник»."
    - "Ни один другой источник её не называет, и место её неизвестно. На карте она с умеренной уверенностью поставлена в нескольких километрах от Джебель-эль-Мусрака на юге Едома, выбранного за сходство имени, — на нынешнем юге Иордании между Петрой и заливом Акаба. Ни одни развалины там не дали ничего, что называло бы этот город."
scripture:
