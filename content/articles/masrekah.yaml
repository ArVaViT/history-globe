body:
  en:
    - "Masrekah was the home of Samlah, one of the kings of Edom listed in Genesis 36 as reigning “before there reigned any king over the children of Israel”: “And Hadad died, and Samlah of Masrekah reigned in his stead.” Chronicles repeats the list almost word for word. The kings of this list do not succeed father to son, and most are tied to a town or land of their own, so Masrekah was presumably a town of some standing in Edom; when the list was compiled and how far back it reaches is debated. The name seems to come from sorek, a choice vine, and may mean “vineyard”."
    - "No other source names it, and its site is unknown. The map places it with moderate confidence within a few kilometres of Jebel el-Musraq in the south of Edom, chosen for the likeness of the name, in today’s southern Jordan between Petra and the Gulf of Aqaba. No ruin there has yielded anything that names the town."
  ru:
    - "Масрека — родина Самлы, одного из царей Едома, перечисленных в 36-й главе Бытия как царствовавшие «прежде царствования царей у сынов Израилевых»: «И умер Гадад, и воцарился по нем Самла из Масреки». Книга Паралипоменон повторяет перечень почти слово в слово. Цари этого списка не наследуют друг другу от отца к сыну, и большинство связаны каждый со своим городом или землёй, так что Масрека, по-видимому, была заметным городом Едома; когда составлен список и насколько далеко в прошлое он уходит — спорно. Имя, кажется, происходит от слова «сорек», отборная лоза, и может значить «виноградник»."
    - "Ни один другой источник её не называет, и место её неизвестно. На карте она с умеренной уверенностью поставлена в нескольких километрах от Джебель-эль-Мусрака на юге Едома, выбранного за сходство имени, — на нынешнем юге Иордании между Петрой и заливом Акаба. Ни одни развалины там не дали ничего, что называло бы этот город."
  uk:
    - "Масрека була домом Самли, одного з царів Едому, перелічених у Книзі Буття, розділ 36, що царювали «перш нїж царював там який царь в Ізраїлї»: «Умер же Гадад, і царював намість його Самла із Мазреки.» Книга Хронік повторює перелік майже слово в слово. Царі цього переліку не успадковують один одного від батька до сина, і більшість пов’язана з власним містом чи краєм, тож Масрека, мабуть, була містом певної ваги в Едомі; коли перелік складено і як далеко назад він сягає, є предметом суперечки. Назва, схоже, походить від сорек, добірна лоза, і може означати «виноградник»."
    - "Жодне інше джерело її не називає, і місце її невідоме. Мапа розміщує її, із середньою впевненістю, у кількох кілометрах від Джебель-ель-Мусрака на півдні Едому, обраного за схожість назви, в сучасній південній Йорданії між Петрою й Акабською затокою. Жодна руїна там не дала нічого, що називало б місто."
  es:
    - "Masreca era la patria de Samla, uno de los reyes de Edom enumerados en Génesis 36 que reinaron «antes que reinase rey sobre los hijos de Israel»: «Y murió Adad, y en su lugar reinó Samla, de Masreca». Crónicas repite la lista casi palabra por palabra. Los reyes de esta lista no se suceden de padre a hijo, y la mayoría están vinculados a una ciudad o tierra propia, de modo que Masreca era presumiblemente una ciudad de cierta importancia en Edom; se discute cuándo se compiló la lista y hasta dónde se remonta. El nombre parece proceder de sorek, una cepa selecta, y puede significar «viñedo»."
    - "Ninguna otra fuente la nombra, y se desconoce su emplazamiento. El mapa la sitúa, con confianza moderada, a pocos kilómetros del Yebel el-Musraq, en el sur de Edom, elegido por el parecido del nombre, en el actual sur de Jordania, entre Petra y el golfo de Aqaba. Ninguna ruina de allí ha dado nada que nombre la ciudad."
  pt:
    - "Masreca era a terra de Samlá, um dos reis de Edom listados em Gênesis 36 como tendo reinado “antes que qualquer rei reinasse sobre os filhos de Israel”: “Hadade morreu, e Samlá, de Masreca, reinou em seu lugar.” As Crônicas repetem a lista quase palavra por palavra. Os reis dessa lista não se sucedem de pai para filho, e a maioria está ligada a uma cidade ou terra própria, de modo que Masreca era presumivelmente uma cidade de certa importância em Edom; quando a lista foi compilada e até onde remonta é debatido. O nome parece vir de sorek, uma videira escolhida, e pode significar “vinhedo”."
    - "Nenhuma outra fonte a nomeia, e seu sítio é desconhecido. O mapa a situa, com confiança moderada, a poucos quilômetros de Jebel el-Musraq, no sul de Edom, escolhido pela semelhança do nome, no atual sul da Jordânia, entre Petra e o golfo de Aqaba. Nenhuma ruína ali forneceu algo que nomeie a cidade."
  de:
    - "Masreka war die Heimat Samlas, eines der Könige von Edom, die nach 1. Mose 36 regierten, „ehe denn die Kinder Israel Könige hatten“: „Da Hadad starb, regierte Samla von Masrek.“ Die Chronik wiederholt die Liste fast wörtlich. Die Könige dieser Liste folgen einander nicht vom Vater auf den Sohn, und die meisten sind an eine eigene Stadt oder ein eigenes Land gebunden, sodass Masreka vermutlich eine Stadt von einigem Rang in Edom war; wann die Liste entstand und wie weit sie zurückreicht, ist umstritten. Der Name scheint von sorek zu kommen, einer edlen Rebe, und bedeutet vielleicht „Weinberg“."
    - "Keine andere Quelle nennt es, und seine Lage ist unbekannt. Die Karte setzt es mit mäßiger Sicherheit wenige Kilometer vom Jebel el-Musraq im Süden Edoms an, gewählt wegen der Namensähnlichkeit, im heutigen Südjordanien zwischen Petra und dem Golf von Akaba. Keine Ruine dort hat etwas ergeben, das die Stadt nennt."
  fr:
    - "Masréka était la patrie de Samla, l’un des rois d’Édom énumérés en Genèse 36 comme ayant régné « avant qu’un roi régnât sur les enfants d’Israël » : « Hadad mourut ; et Samla, de Masréka, régna à sa place. » Les Chroniques répètent la liste presque mot pour mot. Les rois de cette liste ne se succèdent pas de père en fils, et la plupart sont liés à une ville ou à un pays propres, de sorte que Masréka était vraisemblablement une ville de quelque importance en Édom ; quand la liste fut composée et jusqu’où elle remonte, on en débat. Le nom semble venir de sorek, un cep de choix, et peut signifier « vignoble »."
    - "Aucune autre source ne la nomme, et son site est inconnu. La carte la place, avec une confiance modérée, à quelques kilomètres du djebel el-Musraq, dans le sud d’Édom, choisi pour la ressemblance du nom, dans l’actuelle Jordanie du sud, entre Pétra et le golfe d’Aqaba. Aucune ruine n’y a livré quoi que ce soit qui nomme la ville."
  it:
    - "Masreka era la patria di Samla, uno dei re di Edom elencati in Genesi 36 come regnanti «prima che alcun re regnasse sui figliuoli d’Israele»: «Hadad morì, e Samla, di Masreka, regnò in luogo suo». Le Cronache ripetono l’elenco quasi parola per parola. I re di questo elenco non si succedono di padre in figlio, e per lo più sono legati a una città o a una terra propria, così Masreka era presumibilmente una città di qualche rilievo in Edom; quando l’elenco fu compilato e fin dove risalga è discusso. Il nome sembra venire da sorek, una vite scelta, e può significare «vigneto»."
    - "Nessun’altra fonte la nomina, e il suo sito è sconosciuto. La mappa la colloca con fiducia moderata a pochi chilometri dal Jebel el-Musraq nel sud di Edom, scelto per la somiglianza del nome, nell’odierna Giordania meridionale tra Petra e il Golfo di Aqaba. Nessuna rovina là ha restituito nulla che nomini la città."
  pl:
    - "Masreka była domem Samli, jednego z królów Edomu wymienionych w Rdz 36 jako królujących „pierwej niż królował król nad syny Izraelskimi”: „I umarł Hadad, a królował miasto niego Samla z Masreki.” Księga Kronik powtarza listę niemal słowo w słowo. Królowie tej listy nie następują po sobie jako synowie po ojcach i większość jest związana z własnym miastem lub krajem, więc Masreka była zapewne miastem pewnej rangi w Edomie; kiedy sporządzono listę i jak daleko sięga wstecz, jest dyskutowane. Nazwa zdaje się pochodzić od sorek, wybornej winorośli, i może znaczyć „winnica”."
    - "Żadne inne źródło jej nie wymienia, a jej położenie jest nieznane. Mapa umieszcza ją z umiarkowaną pewnością w odległości kilku kilometrów od Dżabal el-Musraq na południu Edomu, wybranego ze względu na podobieństwo nazwy, w dzisiejszej południowej Jordanii między Petrą a Zatoką Akaba. Żadna ruina tam nie dostarczyła niczego, co wymieniałoby miasto."
  nl:
    - "Masreka was de woonplaats van Samla, een van de koningen van Edom die in Genesis 36 worden opgesomd als regerend “eer een koning regeerde over de kinderen Israëls”: “En Hadad stierf, en Samla, van Masreka, regeerde in zijn plaats.” Kronieken herhaalt de lijst bijna woordelijk. De koningen van deze lijst volgen elkaar niet van vader op zoon op, en de meesten worden verbonden met een eigen stad of land, dus Masreka was vermoedelijk een stad van enig aanzien in Edom; wanneer de lijst werd samengesteld en hoever ze terugreikt, wordt betwist. De naam lijkt af te stammen van sorek, een uitgelezen wijnstok, en kan “wijngaard” betekenen."
    - "Geen andere bron noemt haar, en de ligging is onbekend. De kaart plaatst haar met matige zekerheid binnen enkele kilometers van de Jebel el-Musraq in het zuiden van Edom, gekozen vanwege de gelijkenis van de naam, in het huidige zuidelijke Jordanië tussen Petra en de Golf van Akaba. Geen ruïne daar heeft iets opgeleverd dat de stad noemt."
  cs:
    - "Masreka byla domovem Samly, jednoho z edómských králů uvedených v Genesis 36 jako kralujících „prvé než kraloval král nad syny Izraelskými“: „Když pak umřel Adad, kraloval místo něho Semla z Masreka.“ Kroniky seznam opakují téměř doslova. Králové tohoto seznamu nenásledují otce synem a většina je spojena s vlastním městem nebo zemí, takže Masreka byla zřejmě město jistého významu v Edómu; kdy byl seznam sestaven a jak daleko sahá, je sporné. Jméno zřejmě pochází ze sorek, ušlechtilá réva, a může znamenat „vinici“."
    - "Žádný jiný pramen ji nejmenuje a její poloha je neznámá. Mapa ji s mírnou jistotou klade do vzdálenosti několika kilometrů od Jebel el-Musraq na jihu Edómu, zvolené pro podobnost jména, v dnešním jižním Jordánsku mezi Petrou a Akabským zálivem. Žádná tamní zřícenina nevydala nic, co by město jmenovalo."
  sv:
    - "Masreka var hemorten för Samla, en av Edoms konungar i Första Mosebok 36 som regerade ”innan ännu någon israelitisk konung var konung där”: ”När Hadad dog, blev Samla från Masreka konung efter honom.” Krönikeböckerna upprepar förteckningen nästan ord för ord. Konungarna i denna förteckning efterträder inte far till son, och de flesta är knutna till en egen stad eller ett eget land, så Masreka var förmodligen en stad av någon betydelse i Edom; när förteckningen sammanställdes och hur långt tillbaka den når är omdebatterat. Namnet tycks komma av sorek, en ädel vinranka, och kan betyda ”vingård”."
    - "Ingen annan källa nämner den, och dess läge är okänt. Kartan placerar den med måttlig säkerhet inom några kilometer från Jebel el-Musraq i södra Edom, vald för namnlikheten, i dagens södra Jordanien mellan Petra och Akababukten. Ingen ruin där har gett något som nämner staden."
  nb:
    - "Masreka var hjemstedet til Samla, en av Edoms konger oppført i Første Mosebok 36 som regjerte «før det regjerte nogen konge over Israels barn»: «Da Hadad døde, blev Samla fra Masreka konge i hans sted.» Krønikebøkene gjentar listen nesten ord for ord. Kongene i denne listen følger ikke far til sønn, og de fleste er knyttet til en egen by eller et eget land, så Masreka var antakelig en by av en viss betydning i Edom; når listen ble satt sammen og hvor langt tilbake den rekker, er omdiskutert. Navnet synes å komme fra sorek, en edel vinranke, og kan bety «vingård»."
    - "Ingen annen kilde nevner den, og beliggenheten er ukjent. Kartet plasserer den med moderat sikkerhet innen noen få kilometer fra Jebel el-Musraq i sørlige Edom, valgt på grunn av navnets likhet, i dagens sørlige Jordan mellom Petra og Akababukta. Ingen ruin der har gitt noe som navngir byen."
  tl:
    - "Ang Masreca ay tahanan ni Samla, isa sa mga hari ng Edom na nakatala sa Genesis 36 na naghari “bago maghari ang sinomang hari sa angkan ni Israel”: “namatay si Adad at naghari na kahalili niya si Samla na taga Masreca.” Halos salita por salita itong inuulit ng Mga Cronica. Ang mga hari sa talaang ito ay hindi nagpapalitan mula ama patungo sa anak, at karamihan ay nakatali sa sariling bayan o lupain, kaya ang Masreca ay marahil isang bayan na may kaunting katayuan sa Edom; pinagtatalunan kung kailan binuo ang talaan at gaano kalayo ang saklaw nito. Ang pangalan ay tila mula sa sorek, isang piling baging, at maaaring nangangahulugang “ubasan”."
    - "Walang ibang sanggunian na nagpapangalan dito, at hindi alam ang pook nito. Inilalagay ito ng mapa, na may katamtamang katiyakan, sa loob ng ilang kilometro mula sa Jebel el-Musraq sa timog ng Edom, na pinili dahil sa pagkakahawig ng pangalan, sa timog ng Jordan ngayon sa pagitan ng Petra at ng Golpo ng Aqaba. Walang guho roon ang nagbigay ng anumang nagpapangalan sa bayan."
  da:
    - "Masreka var hjemsted for Samla, en af Edoms konger opført i Første Mosebog 36 som regerende »førend der regerede en Konge over Israels Børn«: »Og Hadad døde, og Samla af Masreka blev Konge i hans Sted.« Krønikebøgerne gentager listen næsten ord for ord. Kongerne på denne liste følger ikke far til søn, og de fleste er knyttet til en by eller et land af deres eget, så Masreka var formodentlig en by af en vis betydning i Edom; hvornår listen blev samlet, og hvor langt tilbage den rækker, er omdiskuteret. Navnet synes at komme af sorek, en ædel vinstok, og kan betyde »vingård«."
    - "Ingen anden kilde nævner den, og dens sted er ukendt. Kortet placerer den, med moderat sikkerhed, inden for få kilometer fra Jebel el-Musraq i det sydlige Edom, valgt for navnets lighed, i nutidens sydlige Jordan mellem Petra og Akababugten. Ingen ruin dér har givet noget, der nævner byen."
  sr:
    - "Масека је био завичај Самаде, једног од едомских царева наведених у Постању 36 као оних који су владали „пре него се зацари цар над синовима Израиљевим“: „А кад умре Адад, зацари се на његово место Самада, из Масекаса.“ Дневници понављају списак готово реч по реч. Цареви овог списка не наслеђују један другог од оца на сина, и већина је везана за свој град или земљу, па је Масека вероватно био град неког значаја у Едому; када је списак састављен и колико далеко сеже, спорно је. Име као да потиче од сорек, племенита лоза, и може значити „виноград“."
    - "Ниједан други извор га не именује, а његово налазиште је непознато. Мапа га, са умереним поуздањем, смешта на неколико километара од Џебел ел-Мусрака на југу Едома, изабраног због сличности имена, у данашњем јужном Јордану између Петре и Акапског залива. Ниједна тамошња рушевина није дала ништа што именује град."
  hu:
    - "Maszréka Szamla otthona volt, Edom egyik királyáé, akit a Teremtés könyve 36. fejezete olyanok között sorol fel, akik uralkodtak, „minekelőtte Izráel fiai között király uralkodott volna”: „És meghala Hadád és uralkodék helyette a Masrekából való Szamlá.” A Krónikák szinte szóról szóra megismétli a jegyzéket. Ennek a jegyzéknek a királyai nem apáról fiúra követik egymást, és többségüket saját városhoz vagy földhöz kötik, így Maszréka feltehetően tekintélyes edomi város volt; hogy a jegyzéket mikor állították össze és meddig nyúlik vissza, vitatott. A név a szórekből, nemes szőlőtőből látszik eredni, és „szőlőskertet” jelenthet."
    - "Más forrás nem nevezi meg, és helye ismeretlen. A térkép mérsékelt biztonsággal a Jebel el-Musraq néhány kilométeres körzetébe teszi Edom déli részén, a név hasonlósága miatt, a mai dél-jordániai területen, Petra és az Akabai-öböl között. Az ottani romok egyike sem adott olyan leletet, amely megnevezné a várost."
  fi:
    - "Masreka oli Samlan, erään 1. Moos. 36:ssa luetellun Edomin kuninkaan, kotipaikka; he hallitsivat ”ennenkuin yksikään kuningas oli hallinnut israelilaisia”: ”Kun Hadad kuoli, tuli Samla, Masrekasta, kuninkaaksi hänen sijaansa.” Aikakirjat toistavat luettelon lähes sanasta sanaan. Tämän luettelon kuninkaat eivät seuraa toisiaan isältä pojalle, ja useimmat liittyvät omaan kaupunkiinsa tai maahansa, joten Masreka oli oletettavasti jonkin verran merkittävä kaupunki Edomissa; milloin luettelo laadittiin ja kuinka kauas taaksepäin se ulottuu, on kiistanalaista. Nimi näyttää tulevan sanasta sorek, jalo viiniköynnös, ja voi tarkoittaa ”viinitarhaa”."
    - "Mikään muu lähde ei mainitse sitä, ja sen sijainti on tuntematon. Kartta sijoittaa sen kohtalaisella varmuudella muutaman kilometrin säteelle Jebel el-Musraqista Edomin eteläosassa, valittu nimen samankaltaisuuden vuoksi, nykyisessä Etelä-Jordaniassa Petran ja Akabanlahden välillä. Yksikään siellä oleva rauniokohde ei ole tuottanut mitään, mikä nimeäisi kaupungin."
  vi:
    - "Ma-rê-ca là quê của Sam-la, một trong các vua Ê-đôm được liệt kê trong Sáng thế ký 36 là trị vì “Trước khi dân Y-sơ-ra-ên chưa có một vua nào cai trị”: “Vua Ha-đát băng, Sam-la, người Ma-rê-ca lên kế vị”. Sách Sử ký lặp lại danh sách gần như từng chữ. Các vua trong danh sách này không kế vị từ cha sang con, và phần lớn gắn với một thành hay xứ riêng của mình, nên Ma-rê-ca hẳn là một thành có tầm vóc ở Ê-đôm; danh sách được lập khi nào và lùi xa đến đâu còn tranh luận. Tên dường như đến từ sorek, cây nho tốt, và có thể nghĩa là “vườn nho”."
    - "Không nguồn nào khác nêu tên nó, và địa điểm không được biết. Bản đồ đặt nó, với độ tin cậy vừa phải, trong vòng vài km quanh Jebel el-Musraq ở nam Ê-đôm, được chọn vì tên giống nhau, thuộc nam Gióc-đa-ni ngày nay giữa Petra và vịnh Aqaba. Không di tích nào ở đó cho ra điều gì nêu tên thành."
  ro:
    - "Masreca era patria lui Samla, unul dintre regii Edomului înșiruiți în Facerea 36 ca domnind „mai ’nainte de a împărățì împărat în Israil”: „Și a murit Adad, și în locul lui a împărățit Samada, din Maseca.” Cronicile repetă lista aproape cuvânt cu cuvânt. Regii din această listă nu se succed de la tată la fiu, iar cei mai mulți sunt legați de o cetate sau de o țară proprie, așa că Masreca era probabil o cetate de oarecare însemnătate în Edom; când a fost alcătuită lista și cât de departe în timp ajunge este disputat. Numele pare să vină de la sorek, viță aleasă, și poate însemna „vie”."
    - "Nicio altă sursă nu o numește, iar locul ei este necunoscut. Harta o plasează cu încredere moderată la câțiva kilometri de Jebel el-Musraq, în sudul Edomului, ales pentru asemănarea numelui, în sudul Iordaniei de azi, între Petra și Golful Aqaba. Nicio ruină de acolo n-a dat ceva care să numească cetatea."
  bg:
    - "Масрека е родното място на Самла, един от едомските царе, изброени в Битие 36 като царували „преди да се възцари цар над синовете Израилеви“: „И умря Адад; и въцари се вместо него Самла, от Масрека.“ Летописи повтарят списъка почти дума по дума. Царете в този списък не се наследяват от баща на син и повечето са свързани със собствен град или земя, така че Масрека вероятно е бил град с известно значение в Едом; кога е съставен списъкът и колко назад във времето стига, е спорно. Името изглежда идва от сорек, „избрана лоза“, и може да означава „лозе“."
    - "Никой друг извор не го назовава и местоположението му е неизвестно. Картата го поставя с умерена увереност в рамките на няколко километра от Джебел ел-Мусрак в южната част на Едом, избран заради сходството на името, в днешна Южна Йордания между Петра и Акабския залив. Никоя развалина там не е дала нещо, което да назовава града."
