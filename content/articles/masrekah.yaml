# Overview article (ADR 0007). Mainstream facts only; the dating of the Edomite king list is named as debated and the site as a guess.
id: masrekah
place: a57e0a0
title:
  en: "Masrekah"
  ru: "Масрека"
  uk: "Масрека"
  es: "Masreca"
  pt: "Masreca"
  de: "Masreka"
  fr: "Masréka"
body:
  en:
    - "Masrekah was the home of Samlah, one of the kings of Edom listed in Genesis 36 as reigning “before there reigned any king over the children of Israel”: “And Hadad died, and Samlah of Masrekah reigned in his stead.” Chronicles repeats the list almost word for word. The kings of this list do not succeed father to son, and most are tied to a town or land of their own, so Masrekah was presumably a town of some standing in Edom; when the list was compiled and how far back it reaches is debated. The name seems to come from sorek, a choice vine, and may mean “vineyard”."
    - "No other source names it, and its site is unknown. The map places it with moderate confidence within a few kilometres of Jebel el-Musraq in the south of Edom, chosen for the likeness of the name, in today’s southern Jordan between Petra and the Gulf of Aqaba. No ruin there has yielded anything that names the town."
  ru:
    - "Масрека — родина Самлы, одного из царей Едома, перечисленных в 36-й главе Бытия как царствовавшие «прежде царствования царей у сынов Израилевых»: «И умер Гадад, и воцарился по нем Самла из Масреки». Книга Паралипоменон повторяет перечень почти слово в слово. Цари этого списка не наследуют друг другу от отца к сыну, и большинство связаны каждый со своим городом или землёй, так что Масрека, по-видимому, была заметным городом Едома; когда составлен список и насколько далеко в прошлое он уходит — спорно. Имя, кажется, происходит от слова «сорек», отборная лоза, и может значить «виноградник»."
    - "Ни один другой источник её не называет, и место её неизвестно. На карте она с умеренной уверенностью поставлена в нескольких километрах от Джебель-эль-Мусрака на юге Едома, выбранного за сходство имени, — на нынешнем юге Иордании между Петрой и заливом Акаба. Ни одни развалины там не дали ничего, что называло бы этот город."
  uk:
    - "Масрека була домом Самли, одного з царів Едому, перелічених у Книзі Буття, розділ 36, що царювали «перш нїж царював там який царь в Ізраїлї»: «Умер же Гадад, і царював намість його Самла із Мазреки.» Книга Хронік повторює перелік майже слово в слово. Царі цього переліку не успадковують один одного від батька до сина, і більшість пов’язана з власним містом чи краєм, тож Масрека, мабуть, була містом певної ваги в Едомі; коли перелік складено і як далеко назад він сягає, є предметом суперечки. Назва, схоже, походить від сорек, добірна лоза, і може означати «виноградник»."
    - "Жодне інше джерело її не називає, і місце її невідоме. Мапа розміщує її, із середньою впевненістю, у кількох кілометрах від Джебель-ель-Мусрака на півдні Едому, обраного за схожість назви, в сучасній південній Йорданії між Петрою й Акабською затокою. Жодна руїна там не дала нічого, що називало б місто."
  es:
    - "Masreca era la patria de Samla, uno de los reyes de Edom enumerados en Génesis 36 que reinaron «antes que reinase rey sobre los hijos de Israel»: «Y murió Adad, y en su lugar reinó Samla, de Masreca». Crónicas repite la lista casi palabra por palabra. Los reyes de esta lista no se suceden de padre a hijo, y la mayoría están vinculados a una ciudad o tierra propia, de modo que Masreca era presumiblemente una ciudad de cierta importancia en Edom; se discute cuándo se compiló la lista y hasta dónde se remonta. El nombre parece proceder de sorek, una cepa selecta, y puede significar «viñedo»."
    - "Ninguna otra fuente la nombra, y se desconoce su emplazamiento. El mapa la sitúa, con confianza moderada, a pocos kilómetros del Yebel el-Musraq, en el sur de Edom, elegido por el parecido del nombre, en el actual sur de Jordania, entre Petra y el golfo de Aqaba. Ninguna ruina de allí ha dado nada que nombre la ciudad."
  pt:
    - "Masreca era a terra de Samlá, um dos reis de Edom listados em Gênesis 36 como tendo reinado “antes que qualquer rei reinasse sobre os filhos de Israel”: “Hadade morreu, e Samlá, de Masreca, reinou em seu lugar.” As Crônicas repetem a lista quase palavra por palavra. Os reis dessa lista não se sucedem de pai para filho, e a maioria está ligada a uma cidade ou terra própria, de modo que Masreca era presumivelmente uma cidade de certa importância em Edom; quando a lista foi compilada e até onde remonta é debatido. O nome parece vir de sorek, uma videira escolhida, e pode significar “vinhedo”."
    - "Nenhuma outra fonte a nomeia, e seu sítio é desconhecido. O mapa a situa, com confiança moderada, a poucos quilômetros de Jebel el-Musraq, no sul de Edom, escolhido pela semelhança do nome, no atual sul da Jordânia, entre Petra e o golfo de Aqaba. Nenhuma ruína ali forneceu algo que nomeie a cidade."
  de:
    - "Masreka war die Heimat Samlas, eines der Könige von Edom, die nach 1. Mose 36 regierten, „ehe denn die Kinder Israel Könige hatten“: „Da Hadad starb, regierte Samla von Masrek.“ Die Chronik wiederholt die Liste fast wörtlich. Die Könige dieser Liste folgen einander nicht vom Vater auf den Sohn, und die meisten sind an eine eigene Stadt oder ein eigenes Land gebunden, sodass Masreka vermutlich eine Stadt von einigem Rang in Edom war; wann die Liste entstand und wie weit sie zurückreicht, ist umstritten. Der Name scheint von sorek zu kommen, einer edlen Rebe, und bedeutet vielleicht „Weinberg“."
    - "Keine andere Quelle nennt es, und seine Lage ist unbekannt. Die Karte setzt es mit mäßiger Sicherheit wenige Kilometer vom Jebel el-Musraq im Süden Edoms an, gewählt wegen der Namensähnlichkeit, im heutigen Südjordanien zwischen Petra und dem Golf von Akaba. Keine Ruine dort hat etwas ergeben, das die Stadt nennt."
  fr:
    - "Masréka était la patrie de Samla, l’un des rois d’Édom énumérés en Genèse 36 comme ayant régné « avant qu’un roi régnât sur les enfants d’Israël » : « Hadad mourut ; et Samla, de Masréka, régna à sa place. » Les Chroniques répètent la liste presque mot pour mot. Les rois de cette liste ne se succèdent pas de père en fils, et la plupart sont liés à une ville ou à un pays propres, de sorte que Masréka était vraisemblablement une ville de quelque importance en Édom ; quand la liste fut composée et jusqu’où elle remonte, on en débat. Le nom semble venir de sorek, un cep de choix, et peut signifier « vignoble »."
    - "Aucune autre source ne la nomme, et son site est inconnu. La carte la place, avec une confiance modérée, à quelques kilomètres du djebel el-Musraq, dans le sud d’Édom, choisi pour la ressemblance du nom, dans l’actuelle Jordanie du sud, entre Pétra et le golfe d’Aqaba. Aucune ruine n’y a livré quoi que ce soit qui nomme la ville."
