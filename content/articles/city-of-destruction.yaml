# Overview article (ADR 0007). Isa 19:18: the Masoretic "city of destruction" and the "city of the sun" of the Qumran Isaiah scrolls, Symmachus and the Vulgate are shown; the identification with Heliopolis follows the "sun" reading. Onias' temple is told in heliopolis.yaml.
id: city-of-destruction
place: adca4b1
title:
  en: "City of Destruction"
  ru: "Город солнца"
  de: "Stadt der Zerstörung"
  fr: "Ville du Soleil"
  pt: "Cidade da Destruição"
  it: "Città della Distruzione"
  nl: "Stad van de Zon"
  pl: "Miasto Zniszczenia"
  uk: "Місто сонця"
  cs: "Město zkázy"
  es: "Ciudad del Sol"
body:
  en:
    - "In Isaiah's oracle on Egypt, five cities will one day speak the language of Canaan and swear by the Lord: “one shall be called, The city of destruction.” The Hebrew text has ‘ir ha-heres, “city of destruction”, but the two Isaiah scrolls from Qumran (1QIsa-a and 4QIsa-b), some medieval Hebrew manuscripts, Symmachus and the Latin Vulgate read ‘ir ha-ḥeres, “city of the sun”, with a rare word for the sun. The Russian Synodal Bible follows this reading and calls it “the city of the sun”; the Greek Septuagint has instead “city of Asedek”, city of righteousness."
    - "The “city of the sun” is taken to be Heliopolis, the On of Genesis, the great city of the sun god north-east of modern Cairo, and the map follows this. Many scholars think the Masoretic “destruction” a deliberate change, made to remove the name of the sun or to turn it into a judgement; others keep it and read a play on the two words. The next verse promises “an altar to the LORD in the midst of the land of Egypt”, and Josephus says that Onias appealed to this prophecy when he built a Jewish temple at Leontopolis in the district of Heliopolis in the second century BC."
  ru:
    - "В пророчестве Исаии о Египте говорится, что однажды пять городов будут говорить языком Ханаанским и клясться Господом: «один назовется городом солнца». Еврейский масоретский текст читает здесь ‘ир ха-херес (с буквой «хе»), «город разрушения», как и английская Библия короля Якова, но оба свитка Исаии из Кумрана (1QIsa-a и 4QIsa-b), некоторые средневековые еврейские рукописи, Симмах и латинская Вульгата читают ‘ир ха-ḥерес (с буквой «хет»), «город солнца», с редким словом для солнца. Синодальный перевод следует этому чтению; греческая Септуагинта даёт иное — «город Аседек», город праведности."
    - "«Город солнца» понимают как Гелиополь, Он книги Бытия, великий город бога солнца к северо-востоку от нынешнего Каира, и карта следует этому. Многие учёные считают масоретское «разрушение» намеренной правкой, чтобы убрать имя солнца или превратить его в приговор; другие сохраняют его и видят игру двух слов. Следующий стих обещает: «жертвенник Господу будет посреди земли Египетской», и Иосиф Флавий пишет, что Ония ссылался на это пророчество, когда во II в. до н. э. построил иудейский храм в Леонтополе в округе Гелиополя."
  de:
    - "In Jesajas Spruch über Ägypten werden einst fünf Städte „reden nach der Sprache Kanaans und schwören bei dem HERRN Zebaoth“: „Eine wird heißen Ir-Heres.“ Der hebräische Text hat ʿir ha-heres, „Stadt der Zerstörung“, aber die beiden Jesajarollen aus Qumran (1QJesa und 4QJesb), einige mittelalterliche hebräische Handschriften, Symmachos und die lateinische Vulgata lesen ʿir ha-ḥeres, „Stadt der Sonne“, mit einem seltenen Wort für die Sonne. Die russische Synodalbibel folgt dieser Lesart und nennt sie Stadt der Sonne; die griechische Septuaginta hat stattdessen Stadt Asedek, Stadt der Gerechtigkeit."
    - "Die Stadt der Sonne wird für Heliopolis gehalten, das On der Genesis, die große Stadt des Sonnengottes nordöstlich des heutigen Kairo, und die Karte folgt dem. Viele Gelehrte halten die masoretische Zerstörung für eine absichtliche Änderung, um den Namen der Sonne zu tilgen oder ihn in ein Gericht zu verwandeln; andere behalten sie und lesen ein Wortspiel mit den beiden Wörtern. Der nächste Vers verheißt „des HERRN Altar mitten in Ägyptenland“, und Josephus sagt, Onias habe sich auf diese Weissagung berufen, als er im zweiten Jahrhundert v. Chr. in Leontopolis im Bezirk Heliopolis einen jüdischen Tempel baute."
  fr:
    - "Dans l’oracle d’Ésaïe sur l’Égypte, cinq villes parleront un jour la langue de Canaan et jureront par l’Éternel : « L’une d’elles sera appelée ville de la destruction. » Le texte hébreu porte ‘ir ha-heres, « ville de la destruction », mais les deux rouleaux d’Ésaïe de Qumrân (1QIsa-a et 4QIsa-b), quelques manuscrits hébreux médiévaux, Symmaque et la Vulgate latine lisent ‘ir ha-ḥeres, « ville du soleil », avec un mot rare pour le soleil. La Bible synodale russe suit cette leçon et l’appelle « la ville du soleil » ; la Septante grecque porte plutôt « ville d’Asédek », ville de justice."
    - "La « ville du soleil » est tenue pour Héliopolis, l’On de la Genèse, la grande ville du dieu-soleil au nord-est de l’actuel Caire, et la carte suit cet avis. Bien des savants pensent que la « destruction » massorétique est un changement délibéré, fait pour ôter le nom du soleil ou pour en faire un jugement ; d’autres la conservent et y lisent un jeu sur les deux mots. Le verset suivant promet « un autel à l’Éternel au milieu du pays d’Égypte », et Josèphe dit qu’Onias invoqua cette prophétie lorsqu’il bâtit un temple juif à Léontopolis, dans le district d’Héliopolis, au IIe siècle av. J.-C."
  pt:
    - "No oráculo de Isaías sobre o Egito, cinco cidades falarão um dia a língua de Canaã e jurarão pelo SENHOR: “Uma será chamada ‘A cidade da destruição’.” O texto hebraico traz ‘ir ha-heres, “cidade da destruição”, mas os dois rolos de Isaías de Qumran (1QIsa-a e 4QIsa-b), alguns manuscritos hebraicos medievais, Símaco e a Vulgata latina leem ‘ir ha-ḥeres, “cidade do sol”, com uma palavra rara para sol. A Bíblia sinodal russa segue essa leitura e a chama cidade do sol; a Septuaginta grega traz, em vez disso, cidade de Asedek, cidade de justiça."
    - "A “cidade do sol” é tomada por Heliópolis, a On do Gênesis, a grande cidade do deus-sol a nordeste do atual Cairo, e o mapa segue isso. Muitos estudiosos pensam que a “destruição” massorética foi uma mudança deliberada, feita para eliminar o nome do sol ou transformá-lo num julgamento; outros a mantêm e leem um jogo com as duas palavras. O versículo seguinte promete “um altar ao SENHOR no meio da terra do Egito”, e Josefo diz que Onias recorreu a essa profecia quando construiu um templo judaico em Leontópolis, no distrito de Heliópolis, no século II a.C."
  it:
    - "Nell’oracolo di Isaia sull’Egitto, cinque città parleranno un giorno la lingua di Canaan e giureranno per il Signore; una di esse avrà un nome che il testo ebraico dà come ‘ir ha-heres, «città della distruzione», ma i due rotoli di Isaia di Qumran (1QIsa-a e 4QIsa-b), alcuni manoscritti ebraici medievali, Simmaco e la Vulgata latina leggono ‘ir ha-ḥeres, «città del sole», con una parola rara per il sole. La Bibbia sinodale russa segue questa lettura e la chiama «città del sole»; la Settanta greca ha invece «città di Asedek», città di giustizia."
    - "La «città del sole» è ritenuta Eliopoli, l’On della Genesi, la grande città del dio sole a nord-est dell’odierno Cairo, e la carta segue questa ipotesi. Molti studiosi pensano che la «distruzione» masoretica sia una modifica deliberata, fatta per eliminare il nome del sole o per trasformarlo in un giudizio; altri la mantengono e vi leggono un gioco tra le due parole. Il versetto seguente promette che «in mezzo al paese d’Egitto, vi sarà un altare eretto all’Eterno», e Giuseppe Flavio dice che Onia si richiamò a questa profezia quando costruì un tempio ebraico a Leontopoli, nel distretto di Eliopoli, nel II secolo a.C."
  nl:
    - "In Jesaja's godsspraak over Egypte zullen vijf steden eens de taal van Kanaän spreken en zweren bij de HEER: “een zal genoemd zijn een stad der verstoring.” De Hebreeuwse tekst heeft ‘ir ha-heres, “stad van de verwoesting”, maar de twee Jesajarollen uit Qumran (1QIsa-a en 4QIsa-b), enkele middeleeuwse Hebreeuwse handschriften, Symmachus en de Latijnse Vulgaat lezen ‘ir ha-ḥeres, “stad van de zon”, met een zeldzaam woord voor de zon. De Russische Synodale Bijbel volgt deze lezing en noemt haar “stad van de zon”; de Griekse Septuaginta heeft in plaats daarvan “stad Asedek”, stad der gerechtigheid."
    - "De “stad van de zon” wordt opgevat als Heliopolis, het On van Genesis, de grote stad van de zonnegod ten noordoosten van het moderne Caïro, en de kaart volgt dit. Veel geleerden achten het masoretische “verwoesting” een opzettelijke wijziging, aangebracht om de naam van de zon te verwijderen of er een oordeel van te maken; anderen behouden het en lezen een woordspeling met de twee woorden. Het volgende vers belooft: “Te dien dage zal de HEERE een altaar hebben in het midden van Egypteland”, en Josephus zegt dat Onias zich op deze profetie beriep toen hij in de tweede eeuw v.Chr. een Joodse tempel bouwde te Leontopolis in het district Heliopolis."
  pl:
    - "W wyroczni Izajasza o Egipcie pięć miast będzie pewnego dnia mówić językiem Kanaanu i przysięgać na Pana: „lecz jedno z nich miastem spustoszenia nazwane będzie”. Tekst hebrajski ma ‘ir ha-heres, „miasto zniszczenia”, ale oba zwoje Izajasza z Qumran (1QIsa-a i 4QIsa-b), niektóre średniowieczne rękopisy hebrajskie, Symmachus i łacińska Wulgata czytają ‘ir ha-ḥeres, „miasto słońca”, rzadkim słowem oznaczającym słońce. Rosyjska Biblia synodalna idzie za tym czytaniem i nazywa je „miastem słońca”; grecka Septuaginta ma natomiast „miasto Asedek”, miasto sprawiedliwości."
    - "„Miasto słońca” uważa się za Heliopolis, On z Księgi Rodzaju, wielkie miasto boga słońca na północny wschód od dzisiejszego Kairu, i mapa idzie za tym. Wielu uczonych sądzi, że masorecki „zniszczenia” jest celową zmianą, dokonaną, by usunąć imię słońca albo by nadać mu sens sądu; inni zachowują je i widzą grę słów obu wyrazów. Następny werset obiecuje „ołtarz Pański w pośród ziemi Egipskiej”, a Józef Flawiusz mówi, że Onias powołał się na to proroctwo, budując żydowską świątynię w Leontopolis w okręgu Heliopolis w II w. p.n.e."
  uk:
    - "У пророцтві Ісаї про Єгипет п'ять міст одного дня говоритимуть мовою Ханаану й присягатимуть Господом, і одне з них зватиметься, за одним прочитанням, містом руйнування. Єврейський текст має ‘ir ha-heres, «місто руйнування», але обидва сувої Ісаї з Кумрана (1QIsa-a і 4QIsa-b), деякі середньовічні єврейські рукописи, Симах і латинська Вульгата читають ‘ir ha-ḥeres, «місто сонця», з рідкісним словом для сонця. Російська Синодальна Біблія йде за цим прочитанням і називає його «містом сонця»; грецька Септуагінта має натомість «місто Аседек», місто праведності."
    - "«Місто сонця» розуміють як Геліополь, Он з Буття, велике місто бога сонця на північний схід від сучасного Каїра, і мапа йде за цим. Багато вчених думають, що масоретське «руйнування» — навмисна зміна, зроблена, щоб прибрати ім'я сонця або перетворити його на присуд; інші зберігають його й бачать гру двох слів. Наступний вірш обіцяє: «В той час стане жертовник Господень посеред землї Египецької», а Йосиф Флавій каже, що Оній посилався на це пророцтво, коли збудував єврейський храм у Леонтополі в окрузі Геліополя в II ст. до н. е."
  cs:
    - "V Izajášově věštbě o Egyptě bude jednou pět měst mluvit jazykem Kanaánu a přísahat při Hospodinu: „jedno pak nazváno bude město zpuštění.“ Hebrejský text má 'ir ha-heres, „město zkázy“, ale oba izajášské svitky z Kumránu (1QIsa-a a 4QIsa-b), některé středověké hebrejské rukopisy, Symmachos a latinská Vulgáta čtou 'ir ha-ḥeres, „město slunce“, s řídkým slovem pro slunce. Ruská synodální Bible toto čtení následuje a nazývá je „městem slunce“; řecká Septuaginta má místo toho „město Asedek“, město spravedlnosti."
    - "„Město slunce“ se pokládá za Héliopolis, tedy On z knihy Genesis, velké město boha slunce severovýchodně od dnešní Káhiry, a mapa tak činí. Mnozí badatelé míní, že masoretské „zkáza“ je záměrná změna, provedená, aby se odstranilo jméno slunce nebo aby se z něj učinil soud; jiní je ponechávají a čtou hru dvou slov. Další verš slibuje „oltář Hospodinův u prostřed země Egyptské“ a Josephus Flavius říká, že se na toto proroctví odvolával Onias, když ve druhém století př. n. l. postavil židovský chrám v Leontopoli v okrese Héliopole."
  es:
    - "En el oráculo de Isaías sobre Egipto, cinco ciudades hablarán un día la lengua de Canaán y jurarán por el Señor, y una de ellas se llamará ciudad de la destrucción. El texto hebreo tiene ‘ir ha-heres, «ciudad de la destrucción», pero los dos rollos de Isaías de Qumrán (1QIsa-a y 4QIsa-b), algunos manuscritos hebreos medievales, Símaco y la Vulgata latina leen ‘ir ha-ḥeres, «ciudad del sol», con una palabra rara para el sol. La Biblia sinodal rusa sigue esta lectura y la llama «la ciudad del sol»; la Septuaginta griega tiene en cambio «ciudad de Asedek», ciudad de justicia."
    - "La «ciudad del sol» se toma por Heliópolis, la On del Génesis, la gran ciudad del dios sol al noreste de la actual El Cairo, y el mapa lo sigue. Muchos estudiosos piensan que la «destrucción» masorética es un cambio deliberado, hecho para quitar el nombre del sol o para convertirlo en un juicio; otros la mantienen y leen un juego entre las dos palabras. El versículo siguiente promete «altar para Jehová en medio de la tierra de Egipto», y Josefo dice que Onías invocó esta profecía cuando construyó un templo judío en Leontópolis, en el distrito de Heliópolis, en el siglo II a. C."
