body:
  en:
    - "The Arabah is the floor of the great rift valley that runs from the Sea of Galilee down the Jordan to the Dead Sea and on to the Gulf of Aqaba. The Hebrew Bible calls the whole trench ha-Arabah and the Dead Sea the sea of the Arabah; the King James Version translates the word as “the plain”, and the Synodal Bible as “равнина”, so the name itself appears in the KJV only at Joshua 18:18 and in the Synodal text only within town names such as Беф-Арава. Today the name is kept for the southern part alone: the dry valley of about 165 km between the Dead Sea and Aqaba, which climbs to a watershed some 230 m above sea level and falls again to the gulf. Rain hardly falls, but the hills on both sides hold copper, worked since prehistoric times at Timna in the west and Faynan in the east."
    - "Moses spoke his last words “in the plain over against the Red sea”, and Israel had come up “through the way of the plain from Elath, and from Ezion-gaber” before turning to Moab. Joshua took “the valley, and the plain”, and the kingdom of Sihon reached “the sea of the plain, even the salt sea”. The Arabah of the Jordan was the night road of fugitives: Abner “walked all that night through the plain” to Mahanaim after losing to Joab, the murderers of Ish-bosheth “gat them away through the plain all night”, and when Jerusalem fell Zedekiah “went the way toward the plain” and was overtaken “in the plains of Jericho”."
    - "To the prophets the Arabah is the picture of drought: the man who trusts in man “shall be like the heath in the desert”, the Hebrew says a shrub in the Arabah, and Sharon in Isaiah's lament “is like a wilderness”, again the Arabah. Ezekiel's river from the temple flows east and its waters “go down into the desert, and go into the sea”, whose waters are healed, and Zechariah sees the land about Jerusalem “turned as a plain”."
    - "Excavation has restored the Arabah's working life. At Timna, Beno Rothenberg found the Egyptian temple of Hathor beside mines of the thirteenth and twelfth centuries BC, and later work has dated the largest smelting camps to the eleventh to ninth centuries; at Khirbet en-Nahas in Faynan a fortress and slag heaps of the same age are read by some as early Edom and by others as later. Since the peace treaty of 1994 the valley is the border between Israel and Jordan, with the Wadi Araba crossing near Aqaba; Israeli farms on its western side grow dates and peppers; Timna is a park."
  ru:
    - "Арава — дно великой рифтовой долины, идущей от Галилейского моря вниз по Иордану к Мёртвому морю и дальше к заливу Акаба. Еврейская Библия называет весь этот жёлоб га-Арава, а Мёртвое море — морем Аравы; Библия короля Иакова переводит слово как «the plain», а Синодальный перевод — как «равнина», так что само имя в Библии короля Иакова стоит лишь в Нав. 18:18, а в Синодальном тексте — лишь в именах городов вроде Беф-Аравы. Сегодня его сохраняют только за южной частью: сухой долиной длиной около 165 км между Мёртвым морем и Акабой, которая поднимается к водоразделу примерно на 230 м над уровнем моря и снова спускается к заливу. Дождей почти не бывает, но горы по обе стороны хранят медь, которую добывали с доисторических времён в Тимне на западе и в Файнане на востоке."
    - "Моисей произнёс свои последние слова «на равнине против Суфа», а Израиль перед тем прошёл «путем равнины, от Елафа и Ецион-Гавера» и повернул к Моаву. Иисус Навин взял «низменные места, и равнину», а царство Сигона доходило «до моря равнины, моря Соленого». Арава у Иордана была ночной дорогой беглецов: Авенир и его люди после поражения от Иоава «шли равниною всю ту ночь» до Маханаима, убийцы Иевосфея «шли пустынною дорогою всю ночь», а когда пал Иерусалим, Седекия «ушел дорогою к равнине», и его настигли «на равнинах Иерихонских»."
    - "Для пророков Арава — образ засухи: надеющийся на человека «будет как вереск в пустыне», по-еврейски — куст в Араве, и Сарон в плаче Исаии «похож стал на пустыню», снова Арава. Река Иезекииля из храма течёт на восток, «сойдет на равнину и войдет в море», и воды его становятся здоровыми, а Захария видит, как земля вокруг Иерусалима «будет, как равнина»."
    - "Раскопки вернули Араве её трудовую жизнь. В Тимне Бено Ротенберг нашёл египетский храм Хатхор рядом с рудниками XIII–XII веков до н. э., а позднейшие работы отнесли крупнейшие плавильные лагеря к XI–IX векам; в Хирбет-эн-Нахасе в Файнане крепость и отвалы шлака того же времени одни читают как ранний Едом, другие датируют позже. После мирного договора 1994 года долина — граница Израиля и Иордании с переходом Вади-Араба у Акабы; израильские хозяйства на её западной стороне выращивают финики и перец, а Тимна стала парком."
  uk:
    - "Арава — дно великої рифтової долини, що тягнеться від Галілейського моря вниз Йорданом до Мертвого моря і далі до Акабської затоки. Єврейська Біблія називає весь цей жолоб га-Арава, а Мертве море — морем Арави; Біблія короля Якова перекладає слово як «the plain», а Синодальний переклад — як «равнина», тож саме ім'я стоїть у Біблії короля Якова лише в Ісусі Навині 18:18, а в Синодальному тексті — лише в назвах міст на кшталт Беф-Арава. Нині назву зберігають лише за південною частиною: сухою долиною завдовжки близько 165 км між Мертвим морем та Акабою, що здіймається до вододілу приблизно на 230 м над рівнем моря і знову спадає до затоки. Дощі майже не випадають, але пагорби з обох боків містять мідь, яку добувають із доісторичних часів в Тімні на заході та Фейнані на сході."
    - "Мойсей виголосив свої останні слова «в степу, на поділлї, проти Червоного моря», а Ізраїль пройшов «від дороги на поділлю, від Елата і від Езйон-Гебер», перш ніж повернути до Моаба. Ісус Навин узяв «поділлє й степ», а царство Сігона сягало «до моря степового, Солоного моря». Арава Йордану була нічним шляхом утікачів: Авенір після поразки від Йоава «йшов... рівниною всю ніч» до Маханаїма, вбивці Ішбошета «ійшли пустинею всю ніч», а коли впав Єрусалим, Седекія «утїк дорогою на рівнину пустинї» і був наздогнаний «в Ерихонському степу»."
    - "Для пророків Арава — образ посухи: людина, що надіється на людину, «буде, як билина в степу» (єврейською — кущ в Араві), а Шарон в Ісаїному плачі «став, як пустиня» (знову Арава). Річка Єзекіїля з храму тече на схід, і її води «попливе рівниною та й увійде в море», води якого оздоровлюються, а Захарія бачить землю навколо Єрусалима, що «буде, як би одно поділле»."
    - "Розкопки повернули Араві її робоче життя. У Тімні Бено Ротенберг знайшов єгипетський храм Хатхор біля копалень XIII–XII століть до н. е., а пізніші роботи датували найбільші плавильні табори XI–IX століттями; у Хірбет-ен-Нахасі у Фейнані фортеця й відвали шлаку того самого віку трактують одні як ранній Едом, інші — як пізніший. Від мирного договору 1994 року долина є кордоном між Ізраїлем та Йорданією, з переходом Вадій-Арава біля Акаби; ізраїльські ферми на її західному боці вирощують фініки та перець; Тімна — парк."
  es:
    - "El Arabá es el fondo del gran valle del rift que va del mar de Galilea, por el Jordán, hasta el mar Muerto y más allá hasta el golfo de Áqaba. La Biblia hebrea llama a toda la fosa ha-Arabá y al mar Muerto el mar del Arabá; la versión del rey Jacobo traduce la palabra como «the plain», y la Biblia sinodal como «равнина», de modo que el nombre mismo aparece en la versión del rey Jacobo solo en Josué 18:18 y en el texto sinodal solo dentro de nombres de ciudades como Беф-Арава. Hoy el nombre se reserva para la parte meridional: el valle seco de unos 165 km entre el mar Muerto y Áqaba, que asciende hasta una divisoria de aguas a unos 230 m sobre el nivel del mar y vuelve a descender hasta el golfo. Apenas llueve, pero las colinas de ambos lados contienen cobre, trabajado desde tiempos prehistóricos en Timna, al oeste, y en Faynan, al este."
    - "Moisés pronunció sus últimas palabras «en el llano delante del mar Bermejo», e Israel había subido «por el camino de la llanura de Elath y de Esiongeber» antes de volverse hacia Moab. Josué tomó «los bajos y los llanos», y el reino de Sehón llegaba hasta «la mar de la llanura, el mar Salado». El Arabá del Jordán era el camino nocturno de los fugitivos: Abner y los suyos «caminaron por la campiña toda aquella noche» hasta Mahanaim tras perder ante Joab, los asesinos de Is-boset «caminaron toda la noche por el camino de la campiña», y cuando cayó Jerusalén Sedequías «se fué camino de la campiña» y fue alcanzado «en las llanuras de Jericó»."
    - "Para los profetas el Arabá es la imagen de la sequía: el hombre que confía en el hombre «será como la retama en el desierto», el hebreo dice un arbusto en el Arabá, y Sarón en el lamento de Isaías «hase tornado Sarón como desierto», de nuevo el Arabá. El río de Ezequiel que sale del templo corre hacia el este y sus aguas «descenderán á la llanura, y entrarán en la mar», cuyas aguas son sanadas, y Zacarías dice de la tierra en torno a Jerusalén que «se tornará como llanura»."
    - "La excavación ha devuelto al Arabá su vida de trabajo. En Timna, Beno Rothenberg halló el templo egipcio de Hathor junto a minas de los siglos XIII y XII a. C., y trabajos posteriores han fechado los mayores campamentos de fundición entre los siglos XI y IX; en Khirbet en-Nahas, en Faynan, una fortaleza y montones de escoria de la misma época son leídos por unos como el Edom primitivo y por otros como posteriores. Desde el tratado de paz de 1994 el valle es la frontera entre Israel y Jordania, con el paso del uadi Araba cerca de Áqaba; las granjas israelíes de su lado occidental cultivan dátiles y pimientos; Timna es un parque."
  pt:
    - "A Arabá é o fundo do grande vale do rifte que vai do mar da Galileia, pelo Jordão, até o mar Morto e daí ao golfo de Aqaba. A Bíblia hebraica chama toda a fenda de ha-Arabá e o mar Morto de mar da Arabá; a King James Version traduz a palavra como “a planície”, e a Bíblia sinodal como “равнина”, de modo que o nome em si aparece na KJV só em Josué 18:18 e no texto sinodal só em nomes de cidades como Беф-Арава. Hoje o nome se reserva à parte meridional: o vale seco de cerca de 165 km entre o mar Morto e Aqaba, que sobe a uma divisória de águas a cerca de 230 m acima do nível do mar e desce de novo ao golfo. Quase não chove, mas as colinas de ambos os lados guardam cobre, trabalhado desde tempos pré-históricos em Timna, a oeste, e em Faynan, a leste."
    - "Moisés falou as suas últimas palavras “na Arabá, defronte de Sufe”, e Israel havia se afastado “do caminho da Arabá, de Elate e de Eziom-Geber” antes de se voltar para Moabe. Josué tomou “a baixada, a Arabá”, e o reino de Seom chegava “até o mar do Arabá, o Mar Salgado”. A Arabá do Jordão era a estrada noturna dos fugitivos: Abner e seus homens “marcharam toda aquela noite pela Arabá” até Maanaim depois de perder para Joabe, os assassinos de Is-Bosete “marcharam pelo caminho da Arabá toda a noite”, e quando Jerusalém caiu Zedequias “saiu em direção à Arabá” e foi alcançado “nas planícies de Jericó”."
    - "Para os profetas a Arabá é a imagem da seca: o homem que confia no homem “será como um arbusto no deserto”, o hebraico diz um arbusto na Arabá, e Sarom, no lamento de Isaías, “é como um deserto”, de novo a Arabá. O rio do templo em Ezequiel corre para o leste e as suas águas “descerão para a Arabá. Então elas irão para o mar”, cujas águas são curadas, e Zacarias vê a terra em torno de Jerusalém “como a Arabá”."
    - "A escavação devolveu à Arabá a sua vida de trabalho. Em Timna, Beno Rothenberg achou o templo egípcio de Hátor junto a minas dos séculos XIII e XII a.C., e trabalhos posteriores datam os maiores acampamentos de fundição dos séculos XI a IX; em Khirbet en-Nahas, em Faynan, uma fortaleza e montes de escória da mesma época são lidos por alguns como do primeiro Edom e por outros como posteriores. Desde o tratado de paz de 1994 o vale é a fronteira entre Israel e a Jordânia, com a passagem de Wadi Araba perto de Aqaba; fazendas israelenses no lado ocidental produzem tâmaras e pimentões; Timna é um parque."
  de:
    - "Die Araba ist der Boden des großen Grabenbruchs, der vom See Genezareth den Jordan hinab zum Toten Meer und weiter zum Golf von Akaba verläuft. Die hebräische Bibel nennt den ganzen Graben ha-Araba und das Tote Meer das Meer der Araba; die King-James-Bibel übersetzt das Wort mit „the plain“ und die Synodalbibel mit „равнина“, so dass der Name selbst in der King-James-Bibel nur in Josua 18,18 und im Synodaltext nur in Ortsnamen wie Беф-Арава erscheint. Heute ist der Name allein dem südlichen Teil vorbehalten: dem trockenen Tal von etwa 165 km zwischen dem Toten Meer und Akaba, das zu einer Wasserscheide etwa 230 m über dem Meeresspiegel ansteigt und wieder zum Golf abfällt. Regen fällt kaum, doch die Berge zu beiden Seiten bergen Kupfer, das seit vorgeschichtlicher Zeit in Timna im Westen und Fainan im Osten abgebaut wurde."
    - "Mose sprach seine letzten Worte „auf dem Gefilde gegen das Schilfmeer“, und Israel war „auf dem Wege des Gefildes von Elath und Ezeon-Geber“ heraufgezogen, ehe es sich nach Moab wandte. Josua nahm „die Gründe und das Gefilde“, und das Reich Sihons reichte „bis an das Meer im Gefilde, nämlich das Salzmeer“. Die Araba des Jordan war der nächtliche Fluchtweg: Abner und seine Männer „gingen die ganze Nacht über das Blachfeld“ nach Mahanajim, nachdem sie gegen Joab verloren hatten, die Mörder Isch-Boschets gingen „des Weges auf dem Blachfelde die ganze Nacht“, und als Jerusalem fiel, „floh“ Zedekia „des Weges zum blachen Felde“ und wurde „im blachen Felde zu Jericho“ ergriffen."
    - "Den Propheten ist die Araba das Bild der Dürre: Wer sich auf Menschen verlässt, „der wird sein wie die Heide in der Wüste“, hebräisch ein Strauch in der Araba, und „Saron ist wie eine Wüste“ in Jesajas Klage, wieder die Araba. Hesekiels Fluss vom Tempel fließt nach Osten, und sein Wasser wird „durchs Blachfeld fließen ins Meer“, damit dessen Wasser gesund werde, und Sacharja sieht das Land um Jerusalem „wie auf einem Gefilde“."
    - "Die Ausgrabungen haben der Araba ihr Arbeitsleben zurückgegeben. In Timna fand Beno Rothenberg den ägyptischen Hathortempel neben Minen des 13. und 12. Jahrhunderts v. Chr., und spätere Arbeiten haben die größten Verhüttungslager ins 11. bis 9. Jahrhundert datiert; in Chirbet en-Nahas in Fainan werden eine Festung und Schlackenhalden derselben Zeit von manchen als frühes Edom gelesen, von anderen als späteres. Seit dem Friedensvertrag von 1994 ist das Tal die Grenze zwischen Israel und Jordanien, mit dem Grenzübergang Wadi Araba bei Akaba; israelische Höfe auf der Westseite bauen Datteln und Paprika an; Timna ist ein Park."
  fr:
    - "L’Araba est le fond de la grande vallée du rift qui va de la mer de Galilée, le long du Jourdain, jusqu’à la mer Morte et au golfe d’Aqaba. La Bible hébraïque appelle toute la dépression ha-Araba et la mer Morte la mer de l’Araba ; la King James Version traduit le mot par « the plain », et la Bible synodale par « равнина », si bien que le nom lui-même n’apparaît dans la KJV qu’en Josué 18, 18 et, dans le texte synodal, que dans des noms de villes comme Беф-Арава. Aujourd’hui le nom est réservé à la seule partie sud : la vallée sèche d’environ 165 km entre la mer Morte et Aqaba, qui monte jusqu’à une ligne de partage des eaux à quelque 230 m d’altitude avant de redescendre vers le golfe. Il n’y pleut presque pas, mais les collines de part et d’autre recèlent du cuivre, exploité dès la préhistoire à Timna à l’ouest et à Faynan à l’est."
    - "Moïse prononça ses dernières paroles « dans la plaine, vis-à-vis de Suph », et Israël avait passé « à distance du chemin de la plaine, d’Élath et d’Étsjon-Guéber » avant de se tourner vers Moab. Josué s’empara « de la vallée, de la plaine », et le royaume de Sihon allait jusqu’à « la mer de la plaine, la mer Salée ». L’Araba du Jourdain était la route nocturne des fugitifs : Abner et ses gens « marchèrent toute la nuit dans la plaine » jusqu’à Mahanaïm après leur défaite devant Joab, les meurtriers d’Isch-Boscheth « marchèrent toute la nuit au travers de la plaine », et lors de la chute de Jérusalem Sédécias et les siens « prirent le chemin de la plaine » ; le roi fut atteint « dans les plaines de Jéricho »."
    - "Pour les prophètes, l’Araba est l’image de la sécheresse : l’homme qui se confie en l’homme « est comme un misérable dans le désert », l’hébreu dit un arbrisseau dans l’Araba, et le Saron, dans la lamentation d’Ésaïe, « est comme un désert », encore l’Araba. Le fleuve d’Ézéchiel sorti du temple coule vers l’est et ses eaux « descendront dans la plaine, et entreront dans la mer », dont les eaux deviennent saines, et Zacharie voit le pays autour de Jérusalem devenir « comme la plaine »."
    - "Les fouilles ont rendu à l’Araba sa vie de travail. À Timna, Beno Rothenberg a trouvé le temple égyptien d’Hathor près de mines des XIIIe et XIIe siècles av. J.-C., et des travaux ultérieurs ont daté les plus grands camps de fonte des XIe au IXe siècles ; à Khirbet en-Nahas, à Faynan, une forteresse et des tas de scories de la même époque sont lus par les uns comme l’Édom ancien, par les autres comme plus tardifs. Depuis le traité de paix de 1994, la vallée est la frontière entre Israël et la Jordanie, avec le passage de Wadi Araba près d’Aqaba ; les fermes israéliennes de son côté ouest produisent dattes et poivrons ; Timna est un parc."
  it:
    - "L’Araba è il fondo della grande fossa tettonica che va dal Lago di Tiberiade giù per il Giordano fino al Mar Morto e oltre fino al golfo di Aqaba. La Bibbia ebraica chiama l’intera fossa ha-Araba e il Mar Morto il mare dell’Araba; la King James Version traduce la parola «the plain», e la Bibbia sinodale «равнина», così il nome stesso compare nella KJV solo in Giosuè 18,18 e nel testo sinodale solo nei nomi di città come Беф-Арава. Oggi il nome è riservato alla sola parte meridionale: la valle arida di circa 165 km tra il Mar Morto e Aqaba, che sale a uno spartiacque a circa 230 m sul livello del mare e scende di nuovo al golfo. Vi piove appena, ma le colline su entrambi i lati contengono rame, lavorato dalla preistoria a Timna a ovest e a Faynan a est."
    - "Mosè pronunciò le sue ultime parole «nella pianura dirimpetto a Suf», e il Deuteronomio ricorda «la via della pianura, come pure Elath ed Etsion-Gheber», che Israele lasciò prima di volgersi verso Moab. Giosuè prese «la regione bassa, la pianura», e il regno di Sicon giungeva fino a «il mare della pianura ch’è il mar Salato». L’Araba del Giordano era la via notturna dei fuggiaschi: Abner, dopo la sconfitta davanti a Ioab, camminò tutta quella notte per la valle fino a Maanaim, gli assassini di Is-Baal «camminarono tutta la notte attraverso la pianura», e quando Gerusalemme cadde Sedecia «prese la via della pianura» e fu raggiunto «nelle pianure di Gerico»."
    - "Per i profeti l’Araba è l’immagine della siccità: l’uomo che confida nell’uomo «è come un tamerice nella pianura sterile», in ebraico un arbusto nell’Araba, e Saron nel lamento di Isaia «è come un deserto», di nuovo l’Araba. Il fiume di Ezechiele dal tempio scorre a oriente e le sue acque «scenderanno nella pianura ed entreranno nel mare», le cui acque sono risanate, e Zaccaria vede il paese intorno a Gerusalemme «mutato in pianura»."
    - "Gli scavi hanno restituito all’Araba la sua vita di lavoro. A Timna Beno Rothenberg trovò il tempio egizio di Hathor accanto a miniere del XIII e XII secolo a.C., e lavori successivi hanno datato i più grandi campi di fusione all’XI–IX secolo; a Khirbet en-Nahas a Faynan una fortezza e scorie della stessa epoca sono lette da alcuni come l’antico Edom e da altri come più tarde. Dopo il trattato di pace del 1994 la valle è il confine tra Israele e Giordania, con il valico dello Wadi Araba presso Aqaba; le fattorie israeliane sul lato occidentale coltivano datteri e peperoni; Timna è un parco."
  pl:
    - "Araba to dno wielkiego rowu tektonicznego biegnącego od Jeziora Galilejskiego w dół Jordanem do Morza Martwego i dalej do Zatoki Akaba. Biblia hebrajska nazywa cały ten rów ha-Araba, a Morze Martwe morzem Araby; Biblia króla Jakuba oddaje to słowo jako „równina”, a Biblia synodalna jako „равнина”, więc sama nazwa pojawia się w Biblii króla Jakuba tylko w Joz 18,18, a w tekście synodalnym tylko w nazwach miast, takich jak Беф-Арава. Dziś nazwę zachowuje się wyłącznie dla części południowej: suchej doliny długiej na około 165 km między Morzem Martwym a Akabą, która wznosi się do działu wodnego około 230 m n.p.m. i znów opada ku zatoce. Deszcz prawie nie pada, lecz wzgórza po obu stronach kryją miedź, wydobywaną od czasów prehistorycznych w Timna na zachodzie i w Faynan na wschodzie."
    - "Mojżesz wypowiedział swe ostatnie słowa „na równinie przeciw morzu czerwonemu”, a Izrael szedł „drogą równą od Elat, i od Asyjongaber”, zanim zwrócił się ku Moabowi. Jozue wziął „i równiny, i pola”, a królestwo Sychona sięgało „aż do morza pustyni, do morza słonego”. Araba Jordanu była nocną drogą zbiegów: Abner i jego mężowie, pokonani przez Joaba, „szli polem całą onę noc” do Mahanaim, zabójcy Isz-Boszeta „poszli drogą puszczy przez całą onę noc”, a gdy padła Jerozolima, Sedekiasz „uszedł drogą do pustyni” i został pojmany „na polach Jerycho”."
    - "Dla proroków Araba jest obrazem suszy: człowiek ufający człowiekowi „stanie się jako wrzos na puszczy”, co po hebrajsku oznacza krzak w Arabie, a Szaron w lamencie Izajasza „się stał jako pustynia”, znów Araba. Rzeka Ezechiela płynąca ze świątyni biegnie na wschód, a jej wody „schodzą po równinie, i wchodzą w morze”, którego wody zostają uzdrowione, a Zachariasz widzi ziemię wokół Jerozolimy: „uczyniona będzie ta wszystka ziemia, jako równina”."
    - "Wykopaliska przywróciły Arabie jej życie pracy. W Timna Beno Rothenberg odkrył egipską świątynię Hathor obok kopalń z XIII i XII wieku p.n.e., a późniejsze prace datowały największe obozy hutnicze na XI–IX wiek; w Chirbet en-Nahas w Faynan twierdza i hałdy żużla z tej samej epoki są odczytywane przez jednych jako wczesny Edom, przez innych jako późniejsze. Od traktatu pokojowego z 1994 roku dolina jest granicą między Izraelem a Jordanią, z przejściem Wadi Araba koło Akaby; izraelskie gospodarstwa po jej zachodniej stronie uprawiają daktyle i papryki; Timna jest parkiem."
  nl:
    - "De Araba is de bodem van de grote slenk die van het Meer van Galilea langs de Jordaan naar de Dode Zee loopt en verder naar de Golf van Akaba. De Hebreeuwse Bijbel noemt de hele geul ha-Araba en de Dode Zee de zee van de Araba; de King James Version vertaalt het woord als “the plain”, en de Synodale Bijbel als «равнина», zodat de naam zelf in de KJV alleen voorkomt in Jozua 18:18 en in de Synodale tekst alleen in plaatsnamen als Беф-Арава. Tegenwoordig is de naam alleen voor het zuidelijke deel bewaard: de droge vallei van ongeveer 165 km tussen de Dode Zee en Akaba, die tot een waterscheiding van zo’n 230 m boven zeeniveau stijgt en weer daalt naar de golf. Er valt nauwelijks regen, maar de heuvels aan weerszijden bevatten koper, dat sinds de prehistorie wordt gewonnen bij Timna in het westen en Faynan in het oosten."
    - "Mozes sprak zijn laatste woorden “op het vlakke veld tegenover Suf”, en Israël was “van den weg des vlakken velds, van Elath, en van Ezeon-Geber” gekomen voordat het naar Moab afboog. Jozua nam “de laagte, en het vlakke veld” in, en het rijk van Sihon reikte “tot aan de zee des vlakken velds, de Zoutzee”. De Araba van de Jordaan was de nachtweg van vluchtelingen: Abner en zijn mannen “gingen dienzelfden gansen nacht over het vlakke veld” naar Machanaïm na Joab te hebben verloren, de moordenaars van Isboset “gingen henen, den weg op het vlakke veld, den gansen nacht”, en toen Jeruzalem viel, ging het zo: “de koning trok door den weg des vlakken velds”; hij werd achterhaald “in de vlakke velden van Jericho”."
    - "Voor de profeten is de Araba het beeld van droogte: wie op mensen vertrouwt “zal zijn als de heide in de wildernis”, in het Hebreeuws een struik in de Araba, en Saron in Jesaja’s klacht “is geworden als een woestijn”, opnieuw de Araba. Ezechiëls rivier uit de tempel stroomt naar het oosten en haar wateren “dalen af in het vlakke veld; daarna komen zij in de zee”, waarvan het water gezond wordt, en Zacharia ziet het land rond Jeruzalem “als een vlak veld gemaakt”."
    - "Opgravingen hebben het werkzame leven van de Araba hersteld. Bij Timna vond Beno Rothenberg de Egyptische tempel van Hathor naast mijnen uit de dertiende en twaalfde eeuw v.Chr., en later werk dateerde de grootste smeltkampen in de elfde tot negende eeuw; bij Khirbet en-Nahas in Faynan worden een fort en slakkenhopen uit dezelfde tijd door sommigen als vroeg Edom gelezen en door anderen als later. Sinds het vredesverdrag van 1994 is de vallei de grens tussen Israël en Jordanië, met de grensovergang Wadi Araba bij Akaba; Israëlische boerderijen aan de westzijde telen dadels en paprika’s; Timna is een park."
  cs:
    - "Araba je dno velkého riftového údolí, které vede od Galilejského jezera po Jordánu k Mrtvému moři a dál k Akabskému zálivu. Hebrejská Bible nazývá celý příkop ha-Araba a Mrtvé moře mořem Araby; Bible krále Jakuba překládá slovo jako „the plain“ a synodální Bible jako „равнина“, takže samo jméno se v překladu krále Jakuba vyskytuje jen v Jozue 18,18 a v synodálním textu jen v názvech měst, například Беф-Арава. Dnes je jméno vyhrazeno jen jižní části: suchému údolí dlouhému asi 165 km mezi Mrtvým mořem a Akabou, které stoupá k rozvodí asi 230 m nad mořem a zase klesá k zálivu. Téměř tu neprší, ale pahorky po obou stranách skrývají měď, těženou od pravěku v Timně na západě a ve Fajnánu na východě."
    - "Mojžíš pronesl svá poslední slova „na rovinách proti moři Rudému“ a Izrael přišel „s cesty polní od Elat a od Aziongaber“, než se obrátil k Moábu. Jozue vzal „i roviny, i pole“ a Sichonovo království sahalo „k moři pouště, jenž jest moře slané“. Jordánská Araba byla nocí cestou uprchlíků: Abner a jeho lid po porážce od Joába „šli přes pole celou tu noc“ do Machanajim, vrahové Íš-bošetovi „šli cestou po pustinách celou tu noc“ a když padl Jeruzalém, ušel král Sidkijáš „cestou pouště“ a Chaldejci ho postihli „na rovinách Jerišských“."
    - "Pro proroky je Araba obrazem sucha: člověk, který doufá v člověka, „bude podobný vřesu na pustině“, hebrejsky keři v Arabě, a Šaron v Izajášově nářku je „učiněn jako poušť“, opět Araba. Ezechielova řeka z chrámu teče na východ a její vody „sstupujíce po rovině, vejdou do moře“, jehož vody jsou uzdraveny, a Zacharjáš vidí zemi kolem Jeruzaléma, kdy „učiněna bude všecka tato země jako rovina“."
    - "Vykopávky vrátily Arabě její pracovní život. V Timně Beno Rothenberg našel egyptský chrám Hathor vedle dolů z 13. a 12. století př. n. l. a pozdější práce datovaly největší tavicí tábory do 11. až 9. století; v Chirbet en-Nahas ve Fajnánu jsou pevnost a haldy strusky téhož stáří čteny jedněmi jako raný Edóm a jinými jako pozdější. Od mírové smlouvy z roku 1994 je údolí hranicí mezi Izraelem a Jordánskem, s přechodem Wadi Araba poblíž Akaby; izraelské farmy na jeho západní straně pěstují datle a papriky; Timna je parkem."
