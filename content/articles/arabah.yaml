# Overview article (ADR 0007). Mainstream facts only; the dating of the Timna and Faynan copper works is given as debated; the KJV and the Synodal Bible render the name as a common noun, which is said.
id: arabah
place: a2bb5ef
title:
  en: "Arabah"
  ru: "Арава"
  uk: "Арава"
  es: "Arabá"
  pt: "Arabá"
  de: "Araba"
