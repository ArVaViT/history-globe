# Overview article (ADR 0007). Mainstream facts only; second-millennium dates follow the middle chronology.
id: carchemish
place: af6c730
title:
  en: "Carchemish"
  ru: "Кархемис"
  uk: "Каркемиш"
  es: "Carquemis"
  pt: "Carquemis"
  de: "Karkemisch"
  fr: "Carkemisch"
  it: "Carchemis"
  pl: "Karkemisz"
  nl: "Karkemis"
  cs: "Karkemíš"
  sv: "Karkemish"
body:
  en:
    - "Carchemish stood on the west bank of the Euphrates at the main crossing of the river in northern Syria; its ruins lie on today's border between Turkey and Syria, beside Karkamış and Jarabulus. The site was settled in the Neolithic and Chalcolithic periods, and the city is named in the archives of Ebla in the third millennium BC. In the eighteenth century BC the letters of Mari show its kings, among them Aplahanda, ruling an important centre of trade. In the fourteenth century BC the Hittite king Suppiluliuma I captured Carchemish and made his son Piyassili, also called Sharri-Kushuh, its king, and it became the seat of Hittite power in Syria."
    - 'When the Hittite empire fell about 1200 BC, Kuzi-Teshub, of the same royal line, ruled on at Carchemish as Great King, and the city became the leading Neo-Hittite state, known for its Luwian hieroglyphic inscriptions and carved stone reliefs. Its king Sangara paid tribute to Shalmaneser III in 853 BC, and Pisiri paid tribute to Tiglath-pileser III. In 717 BC, Sargon II records, Pisiri broke his oath and sent hostile messages to Mita, king of Mushki; Sargon led him away in bonds with his family and settled Assyrians in the city. Isaiah has the Assyrian king boast: "Is not Calno as Carchemish?"'
    - "In 605 BC the army of Pharaoh Necho of Egypt lay at Carchemish. The Babylonian Chronicle relates that the crown prince Nebuchadnezzar crossed the Euphrates, defeated the Egyptians there and overtook the survivors in the district of Hamath, so that not one man escaped home. Jeremiah dates this defeat of Necho's army at Carchemish to the fourth year of Jehoiakim, king of Judah, and 2 Chronicles tells of an earlier march of Necho “to fight against Carchemish by Euphrates”, when Josiah went out against him. The victory opened the lands west of the Euphrates to Babylon."
    - "Afterwards Carchemish was a lesser place. Excavations have found settlement in the Persian period, rebuilding in Hellenistic times, monumental buildings of the late Roman period and an early Byzantine phase. The British Museum dug at the site in 1878–1881 and again in 1911–1914 and 1920, under D. G. Hogarth and then Leonard Woolley, with T. E. Lawrence among the staff; since 2011 a Turkish and Italian team led by Nicolò Marchetti has resumed work on the Turkish side."
  ru:
    - "Кархемис стоял на западном берегу Евфрата, у главной переправы через реку в северной Сирии; его развалины лежат на нынешней границе Турции и Сирии, рядом с Каркамышем и Джараблусом. Место было заселено в неолите и халколите, а город упоминается в архивах Эблы III тысячелетия до н. э. В XVIII веке до н. э. письма из Мари показывают его царей, среди них Аплаханду, правителями крупного торгового центра. В XIV веке до н. э. хеттский царь Суппилулиума I взял Кархемис и посадил в нём царём своего сына Пияссили, называемого также Шарри-Кушух, и город стал средоточием хеттской власти в Сирии."
    - "Когда около 1200 г. до н. э. пала Хеттская держава, Кузи-Тешуб из того же царского рода продолжал править в Кархемисе как великий царь, и город стал главным из новохеттских государств, известным лувийскими иероглифическими надписями и каменными рельефами. Его царь Сангара платил дань Салманассару III в 853 г. до н. э., а Писири — Феглаффелласару III. В 717 г. до н. э., как сообщает Саргон II, Писири нарушил клятву и слал враждебные послания Мите, царю Мушки; Саргон увёл его в оковах вместе с семьёй и поселил в городе ассирийцев. У Исаии царь Ассирийский хвалится: «Халне не то же ли, что Кархемис?»"
    - "В 605 г. до н. э. войско египетского фараона Нехао стояло в Кархемисе. Вавилонская хроника рассказывает, что наследник престола Навуходоносор переправился через Евфрат, разбил там египтян и настиг уцелевших в области Емафа, так что ни один не вернулся домой. Иеремия относит это поражение войска Нехао при Кархемисе к четвёртому году Иоакима, царя Иудейского, а Вторая книга Паралипоменон рассказывает о более раннем походе Нехао «на войну к Кархемису на Евфрате», когда Иосия вышел навстречу ему. Победа открыла Вавилону земли к западу от Евфрата."
    - "После этого Кархемис стал второстепенным местом. Раскопки обнаружили поселение персидского времени, перестройку в эллинистическую эпоху, монументальные постройки позднеримского периода и ранневизантийский слой. Британский музей вёл здесь работы в 1878–1881 годах и снова в 1911–1914 и 1920 годах под руководством Д. Хогарта, а затем Леонарда Вулли, и среди сотрудников был Т. Э. Лоуренс; с 2011 года турецко-итальянская экспедиция во главе с Николо Маркетти возобновила раскопки на турецкой стороне."
  uk:
    - "Каркемиш стояв на західному березі Євфрату біля головної переправи через річку в північній Сирії; його руїни лежать на сьогоднішньому кордоні між Туреччиною та Сирією, поряд із Каркамишем і Джераблусом. Місце було заселене в неолітичний і халколітичний періоди, а місто названо в архівах Ебли в III тис. до н. е. У XVIII ст. до н. е. листи з Марі показують його царів, серед них Аплаханду, що правили важливим торговим центром. У XIV ст. до н. е. хетський цар Суппілуліума I здобув Каркемиш і зробив його царем свого сина Піяссілі, званого також Шаррікушухом, і він став осередком хетської влади в Сирії."
    - "Коли хетська імперія впала близько 1200 р. до н. е., Кузі-Тешуб із того самого царського роду продовжував правити в Каркемиші як Великий цар, і місто стало провідною неохетською державою, відомою лувійськими ієрогліфічними написами та різьбленими кам'яними рельєфами. Його цар Сангара сплачував данину Салманассару III у 853 р. до н. е., а Пісіріс — Тіглатпаласару III. У 717 р. до н. е., повідомляє Саргон II, Пісіріс порушив присягу й надіслав ворожі послання Міті, цареві Мушкі; Саргон повів його в кайданах із родиною й оселив ассирійців у місті. Ісая вкладає в уста ассирійського царя хвастощі: «Хиба Хальне не те, що й Кархемис?»"
    - "У 605 р. до н. е. військо фараона Нехао Єгипетського стояло в Каркемиші. Вавилонська хроніка розповідає, що наслідний принц Навуходоносор переправився через Євфрат, розбив там єгиптян і наздогнав уцілілих в окрузі Хамат, так що жодна людина не повернулася додому. Єремія датує цю поразку війська Нехао в Каркемиші четвертим роком Йоакима, царя Юди, а Друга книга Хронік розповідає про раніший похід Нехао «на войну до Кархемису на Евфратї», коли Йосія вийшов йому назустріч. Перемога відкрила землі на захід від Євфрату для Вавилона."
    - "Згодом Каркемиш був меншим місцем. Розкопки знайшли заселення в персидський період, перебудову в елліністичні часи, монументальні будівлі пізньоримського періоду та ранню візантійську фазу. Британський музей копав на цьому місці в 1878–1881 рр. і знову в 1911–1914 та 1920 рр. під керівництвом Д. Дж. Гогарта, а потім Леонарда Вулі, серед співробітників був Т. Е. Лоуренс; від 2011 р. турецько-італійська група під керівництвом Нікколо Маркетті поновила роботи на турецькому боці."
  es:
    - "Carquemis se alzaba en la orilla occidental del Éufrates, en el principal vado del río en el norte de Siria; sus ruinas se hallan hoy en la frontera entre Turquía y Siria, junto a Karkamış y Jarabulus. El sitio estuvo poblado en el Neolítico y el Calcolítico, y la ciudad se nombra en los archivos de Ebla en el tercer milenio a. C. En el siglo XVIII a. C. las cartas de Mari muestran a sus reyes, entre ellos Aplahanda, gobernando un importante centro comercial. En el siglo XIV a. C. el rey hitita Suppiluliuma I conquistó Carquemis e hizo rey de ella a su hijo Piyassili, llamado también Sharri-Kushuh, y la ciudad se convirtió en sede del poder hitita en Siria."
    - "Cuando el Imperio hitita cayó hacia el 1200 a. C., Kuzi-Teshub, de la misma línea real, siguió gobernando en Carquemis como Gran Rey, y la ciudad se convirtió en el principal Estado neohitita, conocido por sus inscripciones jeroglíficas luvitas y sus relieves de piedra tallada. Su rey Sangara pagó tributo a Salmanasar III en el 853 a. C., y Pisiri lo pagó a Tiglat-pileser III. En el 717 a. C., según registra Sargón II, Pisiri quebrantó su juramento y envió mensajes hostiles a Mita, rey de Mushki; Sargón se lo llevó atado con su familia y asentó asirios en la ciudad. Isaías hace jactarse al rey asirio: «¿No es Calno como Carchêmis?»."
    - "En el 605 a. C. el ejército del faraón Necao de Egipto estaba en Carquemis. La Crónica babilónica relata que el príncipe heredero Nabucodonosor cruzó el Éufrates, derrotó allí a los egipcios y alcanzó a los supervivientes en el distrito de Hamat, de modo que ni un solo hombre volvió a casa. Jeremías fecha esta derrota del ejército de Necao en Carquemis en el cuarto año de Joacim, rey de Judá, y 2 Crónicas cuenta una marcha anterior de Necao, que «subió á hacer guerra en Carchêmis junto á Eufrates», cuando Josías salió contra él. La victoria abrió a Babilonia las tierras al oeste del Éufrates."
    - "Después Carquemis fue un lugar menor. Las excavaciones han hallado población en el periodo persa, reconstrucción en tiempos helenísticos, edificios monumentales de la época romana tardía y una fase bizantina temprana. El Museo Británico excavó en el sitio en 1878–1881 y de nuevo en 1911–1914 y 1920, bajo D. G. Hogarth y luego Leonard Woolley, con T. E. Lawrence entre el personal; desde 2011 un equipo turco-italiano dirigido por Nicolò Marchetti ha reanudado los trabajos en el lado turco."
  pt:
    - "Carquemis ficava na margem oeste do Eufrates, na principal travessia do rio no norte da Síria; suas ruínas estão hoje na fronteira entre a Turquia e a Síria, junto a Karkamış e Jarabulus. O local foi habitado nos períodos neolítico e calcolítico, e a cidade é nomeada nos arquivos de Ebla, no terceiro milênio a.C. No século XVIII a.C., as cartas de Mari mostram seus reis, entre eles Aplahanda, governando um importante centro de comércio. No século XIV a.C., o rei hitita Suppiluliuma I capturou Carquemis e fez de seu filho Piyassili, também chamado Sarri-Kusuh, rei da cidade, que se tornou a sede do poder hitita na Síria."
    - "Quando o império hitita caiu, por volta de 1200 a.C., Kuzi-Teshub, da mesma linhagem real, continuou a governar em Carquemis como Grande Rei, e a cidade tornou-se o principal estado neo-hitita, conhecido por suas inscrições em hieróglifos luvitas e seus relevos de pedra esculpida. Seu rei Sangara pagou tributo a Salmaneser III em 853 a.C., e Pisiri pagou tributo a Tiglate-Pileser III. Em 717 a.C., registra Sargão II, Pisiri quebrou o juramento e enviou mensagens hostis a Mita, rei de Mushki; Sargão o levou preso, com a família, e estabeleceu assírios na cidade. Isaías faz o rei assírio se gabar: “Não é Calno como Carquemis?”"
    - "Em 605 a.C., o exército do faraó Neco, do Egito, estava em Carquemis. A Crônica Babilônica relata que o príncipe herdeiro Nabucodonosor atravessou o Eufrates, derrotou ali os egípcios e alcançou os sobreviventes na região de Hamate, de modo que nenhum homem escapou para casa. Jeremias data essa derrota do exército de Neco em Carquemis no quarto ano de Jeoaquim, rei de Judá, e 2 Crônicas conta uma marcha anterior de Neco, que subiu “para lutar contra Carquemis, junto ao Eufrates”, quando Josias saiu contra ele. A vitória abriu à Babilônia as terras a oeste do Eufrates."
    - "Depois disso, Carquemis foi um lugar menor. As escavações encontraram ocupação no período persa, reconstrução na época helenística, edifícios monumentais do fim do período romano e uma fase bizantina antiga. O Museu Britânico escavou no local em 1878–1881 e de novo em 1911–1914 e 1920, sob D. G. Hogarth e depois Leonard Woolley, com T. E. Lawrence entre a equipe; desde 2011, uma equipe turco-italiana dirigida por Nicolò Marchetti retomou o trabalho no lado turco."
  de:
    - "Karkemisch lag am Westufer des Euphrat an der wichtigsten Furt des Flusses in Nordsyrien; seine Ruinen liegen an der heutigen Grenze zwischen der Türkei und Syrien, neben Karkamış und Dscharabulus. Der Ort war in der Jungsteinzeit und Kupfersteinzeit besiedelt, und die Stadt wird in den Archiven von Ebla im 3. Jahrtausend v. Chr. genannt. Im 18. Jahrhundert v. Chr. zeigen die Briefe von Mari ihre Könige, darunter Aplahanda, die ein wichtiges Handelszentrum beherrschten. Im 14. Jahrhundert v. Chr. eroberte der hethitische König Suppiluliuma I. Karkemisch und machte seinen Sohn Piyassili, auch Scharri-Kuschuh genannt, zu dessen König, und es wurde zum Sitz der hethitischen Macht in Syrien."
    - "Als das Hethiterreich um 1200 v. Chr. fiel, herrschte Kuzi-Teschub aus derselben Königslinie in Karkemisch als Großkönig weiter, und die Stadt wurde der führende neohethitische Staat, bekannt für seine luwischen Hieroglypheninschriften und geschnitzten Steinreliefs. Sein König Sangara zahlte 853 v. Chr. Salmanassar III. Tribut, und Pisiri zahlte Tiglat-Pileser III. Tribut. Im Jahr 717 v. Chr. brach Pisiri, wie Sargon II. berichtet, seinen Eid und schickte feindliche Botschaften an Mita, den König von Muski; Sargon führte ihn mit seiner Familie in Fesseln weg und siedelte Assyrer in der Stadt an. Jesaja lässt den König von Assyrien prahlen: „Ist Kalno nicht wie Karchemis?“"
    - "Im Jahr 605 v. Chr. lag das Heer des Pharao Necho von Ägypten bei Karkemisch. Die Babylonische Chronik berichtet, dass der Kronprinz Nebukadnezar den Euphrat überschritt, die Ägypter dort besiegte und die Überlebenden im Bezirk von Hamat einholte, sodass nicht ein Mann nach Hause entkam. Jeremia datiert diese Niederlage von Nechos Heer bei Karkemisch in das vierte Jahr Jojakims, des Königs von Juda, und die 2. Chronik erzählt von einem früheren Zug Nechos, „zu streiten wider Karchemis am Euphrat“, als Josia ihm entgegenzog. Der Sieg öffnete Babylon die Länder westlich des Euphrat."
    - "Danach war Karkemisch ein geringerer Ort. Ausgrabungen haben Besiedlung in der Perserzeit, einen Wiederaufbau in hellenistischer Zeit, monumentale Bauten der späten römischen Zeit und eine frühbyzantinische Phase gefunden. Das Britische Museum grub am Ort 1878–1881 und wieder 1911–1914 und 1920 unter D. G. Hogarth und dann Leonard Woolley, mit T. E. Lawrence unter den Mitarbeitern; seit 2011 hat ein türkisch-italienisches Team unter Nicolò Marchetti die Arbeit auf der türkischen Seite wieder aufgenommen."
  fr:
    - "Carkemisch se dressait sur la rive ouest de l’Euphrate, au principal passage du fleuve dans le nord de la Syrie ; ses ruines se trouvent sur l’actuelle frontière entre la Turquie et la Syrie, près de Karkamış et de Jarabulus. Le site fut occupé au néolithique et au chalcolithique, et la ville est nommée dans les archives d’Ebla au IIIe millénaire av. J.-C. Au XVIIIe siècle av. J.-C., les lettres de Mari montrent ses rois, dont Aplahanda, régnant sur un centre commercial important. Au XIVe siècle av. J.-C., le roi hittite Suppiluliuma Ier s’empara de Carkemisch et en fit roi son fils Piyassili, aussi appelé Sharri-Kushuh ; elle devint le siège du pouvoir hittite en Syrie."
    - "Quand l’empire hittite tomba vers 1200 av. J.-C., Kuzi-Teshub, de la même lignée royale, continua de régner à Carkemisch comme Grand Roi, et la ville devint le principal État néo-hittite, connu pour ses inscriptions en hiéroglyphes louvites et ses reliefs de pierre sculptée. Son roi Sangara paya tribut à Salmanasar III en 853 av. J.-C., et Pisiri à Tiglath-Piléser III. En 717 av. J.-C., rapporte Sargon II, Pisiri rompit son serment et envoya des messages hostiles à Mita, roi de Mushki ; Sargon l’emmena enchaîné avec sa famille et installa des Assyriens dans la ville. Ésaïe fait dire au roi d’Assyrie : « N’en a-t-il pas été de Calno comme de Carkemisch ? »"
    - "En 605 av. J.-C., l’armée du Pharaon Néco d’Égypte se trouvait à Carkemisch. La Chronique babylonienne rapporte que le prince héritier Nebucadnetsar franchit l’Euphrate, y vainquit les Égyptiens et rattrapa les survivants dans la région de Hamath, si bien que pas un homme ne rentra chez lui. Jérémie date cette défaite de l’armée de Néco à Carkemisch de la quatrième année de Jojakim, roi de Juda, et 2 Chroniques raconte une marche antérieure de Néco, monté « pour combattre à Carkemisch sur l’Euphrate », quand Josias marcha à sa rencontre. La victoire ouvrit à Babylone les pays à l’ouest de l’Euphrate."
    - "Ensuite, Carkemisch ne fut plus qu’une place secondaire. Les fouilles ont trouvé une occupation à l’époque perse, une reconstruction à l’époque hellénistique, des bâtiments monumentaux de la fin de l’époque romaine et une phase byzantine ancienne. Le British Museum fouilla le site en 1878–1881, puis en 1911–1914 et en 1920, sous D. G. Hogarth, puis Leonard Woolley, avec T. E. Lawrence parmi le personnel ; depuis 2011, une équipe turco-italienne dirigée par Nicolò Marchetti a repris les travaux du côté turc."
  it:
    - "Carchemis sorgeva sulla riva occidentale dell’Eufrate, al principale guado del fiume nella Siria settentrionale; le sue rovine si trovano sull’attuale confine fra Turchia e Siria, accanto a Karkamış e Jarabulus. Il sito fu abitato nel Neolitico e nel Calcolitico, e la città è nominata negli archivi di Ebla nel III millennio a.C. Nel XVIII secolo a.C. le lettere di Mari mostrano i suoi re, fra cui Aplahanda, a capo di un importante centro commerciale. Nel XIV secolo a.C. il re ittita Suppiluliuma I conquistò Carchemis e ne fece re suo figlio Piyassili, detto anche Sharri-Kushuh, e la città divenne la sede del potere ittita in Siria."
    - "Quando l’impero ittita cadde, intorno al 1200 a.C., Kuzi-Teshub, della stessa linea regale, continuò a regnare a Carchemis come Gran Re, e la città divenne il principale stato neoittita, noto per le sue iscrizioni in geroglifico luvio e i rilievi in pietra scolpita. Il suo re Sangara pagò tributo a Salmanàssar III nell’853 a.C., e Pisiri a Tiglat-Pilèser III. Nel 717 a.C., registra Sargon II, Pisiri violò il giuramento e inviò messaggi ostili a Mita, re di Mushki; Sargon lo condusse via in catene con la famiglia e vi insediò degli Assiri. Isaia fa vantare così il re d’Assiria: «Non è egli avvenuto di Calno come di Carkemish?»"
    - "Nel 605 a.C. l’esercito del faraone Neco d’Egitto stava a Carchemis. La Cronaca babilonese racconta che il principe ereditario Nabucodonosor attraversò l’Eufrate, vi sconfisse gli Egizi e raggiunse i superstiti nella regione di Camat, così che nemmeno un uomo tornò a casa. Geremia data questa sconfitta dell’esercito di Neco a Carchemis al quarto anno di Ioiakim, re di Giuda, e 2 Cronache narra una precedente spedizione di Neco, salito «per combattere a Carkemish, sull’Eufrate», quando Giosia gli mosse contro. La vittoria aprì a Babilonia le terre a ovest dell’Eufrate."
    - "In seguito Carchemis fu un luogo minore. Gli scavi hanno trovato insediamenti in epoca persiana, ricostruzioni in epoca ellenistica, edifici monumentali della tarda epoca romana e una fase protobizantina. Il British Museum scavò nel sito nel 1878–1881 e di nuovo nel 1911–1914 e nel 1920, sotto D. G. Hogarth e poi Leonard Woolley, con T. E. Lawrence fra il personale; dal 2011 una squadra turco-italiana guidata da Nicolò Marchetti ha ripreso i lavori sul versante turco."
  pl:
    - "Karkemisz leżało na zachodnim brzegu Eufratu przy głównej przeprawie przez rzekę w północnej Syrii; jego ruiny leżą na dzisiejszej granicy turecko-syryjskiej, obok Karkamış i Dżarabulus. Miejsce zasiedlono w neolicie i chalkolicie, a miasto wymienia archiwum z Ebli w III tysiącleciu p.n.e. W XVIII w. p.n.e. listy z Mari ukazują jego królów, wśród nich Aplahandę, rządzących ważnym ośrodkiem handlu. W XIV w. p.n.e. król hetycki Suppiluliuma I zdobył Karkemisz i uczynił jego królem swego syna Pijasilego, zwanego też Szarri-Kuszuch, a miasto stało się siedzibą władzy hetyckiej w Syrii."
    - "Gdy około 1200 r. p.n.e. upadło cesarstwo hetyckie, Kuzi-Teszub z tej samej linii królewskiej rządził dalej w Karkemisz jako Wielki Król, a miasto stało się czołowym państwem neohetyckim, znanym z luwijskich inskrypcji hieroglificznych i rzeźbionych kamiennych reliefów. Jego król Sangara płacił daninę Salmanasarowi III w 853 r. p.n.e., a Pisiri płacił daninę Tiglat-Pileserowi III. W 717 r. p.n.e., jak zapisuje Sargon II, Pisiri złamał przysięgę i wysłał wrogie poselstwa do Mity, króla Muszków; Sargon uprowadził go w kajdanach z rodziną i osiedlił w mieście Asyryjczyków. Izajasz każe królowi asyryjskiemu chełpić się: „Izali Chalmo nie jest jako Karchemis?”"
    - "W 605 r. p.n.e. wojsko faraona Necho z Egiptu stało pod Karkemisz. Kronika babilońska opowiada, że następca tronu Nabuchodonozor przeprawił się przez Eufrat, pokonał tam Egipcjan i dogonił niedobitków w okręgu Chamatu, tak że ani jeden człowiek nie uszedł do domu. Jeremiasz datuje tę klęskę wojska Necho pod Karkemisz na czwarty rok Jojakima, króla Judy, a Druga Księga Kronik opowiada o wcześniejszej wyprawie Necho, który wyciągnął, „aby walczył przeciw Karchemis nad rzeką Eufrates”, gdy Jozjasz wyruszył przeciw niemu. Zwycięstwo otworzyło Babilonowi ziemie na zachód od Eufratu."
    - "Potem Karkemisz było miejscem mniejszego znaczenia. Wykopaliska odnalazły osadnictwo z okresu perskiego, przebudowę w czasach hellenistycznych, monumentalne budowle późnego okresu rzymskiego i wczesną fazę bizantyjską. British Museum prowadziło wykopaliska na stanowisku w latach 1878–1881 i ponownie 1911–1914 oraz 1920, pod kierunkiem D. G. Hogartha, a potem Leonarda Woolleya, z T. E. Lawrence'em wśród personelu; od 2011 r. turecko-włoski zespół pod kierunkiem Nicolò Marchettiego wznowił prace po stronie tureckiej."
  nl:
    - "Karkemis stond aan de westoever van de Eufraat bij de belangrijkste oversteek van de rivier in Noord-Syrië; de ruïnes liggen aan de huidige grens tussen Turkije en Syrië, naast Karkamış en Jarabulus. De plaats was bewoond in het Neolithicum en het Chalcolithicum, en de stad wordt genoemd in de archieven van Ebla in het derde millennium v.Chr. In de achttiende eeuw v.Chr. tonen de brieven van Mari haar koningen, onder wie Aplahanda, die een belangrijk handelscentrum bestuurden. In de veertiende eeuw v.Chr. veroverde de Hettitische koning Suppiluliuma I Karkemis en maakte zijn zoon Piyassili, ook Sharri-Kushuh genoemd, tot koning ervan, en het werd de zetel van de Hettitische macht in Syrië."
    - "Toen het Hettitische rijk omstreeks 1200 v.Chr. viel, bleef Kuzi-Teshub, uit dezelfde koninklijke lijn, in Karkemis regeren als Groot Koning, en de stad werd de leidende Neo-Hettitische staat, bekend om haar Luwische hiërogliefeninscripties en gebeeldhouwde steenreliëfs. Haar koning Sangara betaalde in 853 v.Chr. schatting aan Salmaneser III, en Pisiri betaalde schatting aan Tiglat-Pileser III. In 717 v.Chr., zo vermeldt Sargon II, verbrak Pisiri zijn eed en stuurde vijandige boodschappen aan Mita, koning van Mushki; Sargon voerde hem met zijn gezin geboeid weg en vestigde Assyriërs in de stad. Jesaja laat de Assyrische koning pochen: “Is niet Kalno gelijk Karchemis?”"
    - "In 605 v.Chr. lag het leger van farao Necho van Egypte bij Karkemis. De Babylonische Kroniek vertelt dat kroonprins Nebukadnessar de Eufraat overstak, de Egyptenaren daar versloeg en de overlevenden inhaalde in het district Hamat, zodat niemand het thuis haalde. Jeremia dateert deze nederlaag van Nechos leger bij Karkemis in het vierde jaar van Jojakim, koning van Juda, en 2 Kronieken vertelt van een eerdere tocht van Necho, die optoog “om te krijgen tegen Karchemis, aan den Frath”, toen Josia hem tegemoet trok. De overwinning opende de landen ten westen van de Eufraat voor Babylon."
    - "Daarna was Karkemis een mindere plaats. Opgravingen hebben bewoning gevonden in de Perzische tijd, herbouw in de hellenistische tijd, monumentale gebouwen uit de late Romeinse tijd en een vroeg-Byzantijnse fase. Het British Museum groef op de plaats in 1878–1881 en opnieuw in 1911–1914 en 1920, onder D.G. Hogarth en daarna Leonard Woolley, met T.E. Lawrence onder het personeel; sinds 2011 hervat een Turks-Italiaans team onder leiding van Nicolò Marchetti het werk aan Turkse zijde."
  cs:
    - "Karkemíš stál na západním břehu Eufratu u hlavního brodu přes řeku v severní Sýrii; jeho zříceniny leží na dnešní hranici mezi Tureckem a Sýrií, vedle Karkamış a Džarábulusu. Lokalita byla osídlena v neolitu a chalkolitu a město je jmenováno v archivech Ebly ve 3. tisíciletí př. n. l. V 18. století př. n. l. ukazují dopisy z Mari jeho krále, mezi nimi Aplahandu, vládnoucí důležitému obchodnímu středisku. Ve 14. století př. n. l. chetitský král Suppiluliuma I. Karkemíš dobyl a učinil jeho králem svého syna Piyaššiliho, zvaného též Šarri-Kušuch, a město se stalo sídlem chetitské moci v Sýrii."
    - "Když chetitská říše kolem roku 1200 př. n. l. padla, vládl v Karkemíši dál jako Velký král Kuzi-Tešub téhož královského rodu a město se stalo vedoucím novochetitským státem, známým luwijskými hieroglyfickými nápisy a vytesávanými kamennými reliéfy. Jeho král Sangara platil roku 853 př. n. l. tribut Salmanasarovi III. a Pisiri platil tribut Tiglatpilesarovi III. Roku 717 př. n. l., zaznamenává Sargon II., Pisiri porušil přísahu a poslal nepřátelské zprávy Mitovi, králi Mušku; Sargon jej odvedl v poutech i s rodinou a usadil ve městě Asyřany. Izajáš nechává asyrského krále chlubit se: „Zdaliž jako Charkemis není Chalno?“"
    - "Roku 605 př. n. l. ležela u Karkemíše armáda faraona Nekóa egyptského. Babylonská kronika vypráví, že korunní princ Nebukadnesar přešel Eufrat, Egypťany tam porazil a dostihl přeživší v kraji Chamat, takže se nikdo nedostal domů. Jeremjáš datuje tuto porážku Nekóova vojska u Karkemíše do čtvrtého roku Jójakima, krále judského, a Druhá kniha Letopisů vypráví o dřívějším tažení Nekóa, který přitáhl, „aby bojoval proti Charkemis podlé Eufraten“, když proti němu vytáhl Jošijáš. Vítězství otevřelo Babylonu země západně od Eufratu."
    - "Potom byl Karkemíš méně významným místem. Vykopávky nalezly osídlení v perském období, přestavbu v helénistické době, monumentální budovy z pozdního římského období a ranou byzantskou fázi. Britské muzeum kopalo na místě v letech 1878–1881 a znovu 1911–1914 a 1920 pod vedením D. G. Hogartha a poté Leonarda Woolleyho, s T. E. Lawrencem mezi pracovníky; od roku 2011 obnovil práce na turecké straně turecko-italský tým vedený Nicolò Marchettim."
  sv:
    - "Karkemish låg på Eufrats västra strand vid flodens huvudövergång i norra Syrien; dess ruiner ligger på dagens gräns mellan Turkiet och Syrien, intill Karkamış och Jarabulus. Platsen var bebodd redan under neolitikum och kalkolitikum, och staden nämns i arkiven i Ebla under tredje årtusendet f.Kr. På 1700-talet f.Kr. visar breven från Mari dess kungar, bland dem Aplahanda, som styrde ett viktigt handelscentrum. På 1300-talet f.Kr. intog den hettitiske kungen Suppiluliuma I Karkemish och gjorde sin son Piyassili, även kallad Sharri-Kushuh, till dess kung, och staden blev säte för hettitisk makt i Syrien."
    - "När det hettitiska riket föll omkring 1200 f.Kr. fortsatte Kuzi-Teshub, av samma kungaätt, att styra i Karkemish som storkung, och staden blev den ledande nyhettitiska staten, känd för sina luwiska hieroglyfinskrifter och sina huggna stenreliefer. Dess kung Sangara betalade tribut till Salmanassar III 853 f.Kr., och Pisiri betalade tribut till Tiglat-Pileser III. År 717 f.Kr., enligt Sargon II, bröt Pisiri sin ed och sände fientliga budskap till Mita, kung av Mushki; Sargon förde bort honom i bojor med hans familj och bosatte assyrier i staden. Jesaja låter den assyriske kungen skryta: ”Har det icke gått Kalno såsom Karkemis?”"
    - "År 605 f.Kr. låg farao Nechos egyptiska armé vid Karkemish. Den babyloniska krönikan berättar att kronprinsen Nebukadnessar gick över Eufrat, besegrade egyptierna där och hann ifatt de överlevande i Hamats trakt, så att inte en man kom hem. Jeremia daterar detta nederlag för Nechos armé vid Karkemish till Jojakims, Juda kungs, fjärde regeringsår, och Andra Krönikeboken berättar om en tidigare marsch av Necho ”för att strida vid Karkemis, som ligger vid Frat”, då Josia gick ut mot honom. Segern öppnade länderna väster om Eufrat för Babylon."
    - "Därefter var Karkemish en mindre plats. Utgrävningar har funnit bebyggelse under persisk tid, ombyggnad under hellenistisk tid, monumentala byggnader från sen romersk tid och en tidigbysantinsk fas. British Museum grävde på platsen 1878–1881 och åter 1911–1914 och 1920, under D. G. Hogarth och sedan Leonard Woolley, med T. E. Lawrence bland personalen; sedan 2011 har ett turkiskt-italienskt team under Nicolò Marchetti återupptagit arbetet på den turkiska sidan."
