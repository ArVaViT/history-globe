# Overview article (ADR 0007). Mainstream facts only; this record is the Gulf of Aqaba (the app's "Red Sea" at Elath); the Exodus crossing is another record (red-sea.yaml) and is only pointed to.
id: red-sea-aqaba
place: ad64d75
title:
  en: "Red Sea"
  ru: "Чермное море"
  uk: "Червоне море"
  es: "Mar Rojo"
  pt: "Mar Vermelho"
  de: "Rotes Meer"
  fr: "Mer Rouge"
body:
  en:
    - "This article is about the Red Sea's eastern arm, the Gulf of Aqaba or Eilat, the stretch of the Bible's Red Sea that is beyond doubt: it runs some 160 km north from the Straits of Tiran to Elath and Ezion-geber. (The sea of the Exodus crossing and the meaning of its name are treated in the other Red Sea article.) The gulf is a trench of the great rift, up to 1,850 m deep and at most about 24 km wide, between the granite mountains of Sinai and the Hejaz, with coral reefs along both shores."
    - "God set Israel's bounds “from the Red sea even unto the sea of the Philistines, and from the desert unto the river”. After the refusal at Kadesh the people were sent back “into the wilderness by the way of the Red sea”, went round Edom by that road, and “the soul of the people was much discouraged because of the way”; Jephthah recalled that Israel “walked through the wilderness unto the Red sea, and came to Kadesh”. At the head of the gulf Solomon built his fleet at Ezion-geber beside Eloth, and Hiram's sailors took it to Ophir. In Jeremiah's oracle on Edom the cry of its fall is heard as far as the Red Sea: “at the cry the noise thereof was heard in the Red sea”."
    - "The gulf took its ancient name, the Aelanites, from Aela or Aelana, the biblical Elath at its head, which Strabo knew as the end of the overland road from Gaza; in Eusebius' day the Tenth Legion was stationed there. The copper mines of Timna lie in the Arabah just north of it. Today four states meet at the gulf, Egypt, Israel, Jordan and Saudi Arabia; Aqaba is Jordan's only seaport and Eilat Israel's outlet to the south, and Egypt's closing of the Straits of Tiran to Israeli shipping in 1967 helped bring on the Six-Day War."
  ru:
    - "Эта статья — о восточном рукаве Чермного моря, заливе Акаба, или Эйлатском, — той части библейского Чермного моря, о которой нет спора: он тянется примерно на 160 км к северу от Тиранского пролива до Елафа и Ецион-Гавера. (О море перехода в книге Исход и о значении его имени говорит другая статья о Чермном море.) Залив — впадина великого разлома, глубиной до 1850 м и шириной не больше примерно 24 км, между гранитными горами Синая и Хиджаза, с коралловыми рифами по обоим берегам."
    - "Бог провёл пределы Израиля «от моря Чермного до моря Филистимского и от пустыни до реки великой Евфрата». После отказа у Кадеса народ отослали назад «в пустыню к Чермному морю», и они обошли Едом этой дорогой. «И стал малодушествовать народ на пути». Иеффай вспоминал, что Израиль «пошел в пустыню к Чермному морю и пришел в Кадес». У вершины залива Соломон построил флот в Ецион-Гавере при Елафе, и корабельщики Хирама водили его в Офир. В пророчестве Иеремии о Едоме крик его падения доносится до Чермного моря: «отголосок крика их слышен будет у Чермного моря»."
    - "Залив получил древнее имя Эланитского от Элы, или Эланы, — библейского Елафа у его вершины, который Страбон знал как конец сухопутной дороги из Газы; во времена Евсевия там стоял Десятый легион. Медные рудники Тимны лежат в Араве чуть к северу. Сегодня у залива сходятся четыре государства — Египет, Израиль, Иордания и Саудовская Аравия; Акаба — единственный морской порт Иордании, Эйлат — выход Израиля на юг, а закрытие Египтом Тиранского пролива для израильских судов в 1967 году стало одним из поводов к Шестидневной войне."
  uk:
    - "Ця стаття — про східне рамено Червоного моря, затоку Акаба, або Ейлат, ділянку біблійного Червоного моря, що не викликає сумнівів: вона тягнеться приблизно на 160 км на північ від Тиранської протоки до Елата й Еціон-Гевера. (Море переходу під час Виходу та значення його назви розглянуто в іншій статті «Червоне море».) Затока — це западина великого рифту, завглибшки до 1850 м і завширшки щонайбільше близько 24 км, між гранітними горами Синаю та Хіджазу, з коралевими рифами вздовж обох берегів."
    - "Бог визначив межі Ізраїлю «від Червоного моря та й до моря Филистимського, і від пустинї до Ефрату». Після відмови в Кадесі народові було наказано повернутися «в степ по дорозї до Червоного моря»; він обійшов Едом цим шляхом, і «впав дух у людей в дорозї»; Єфтай нагадав, що Ізраїль «дійшов степом до Червоного моря, й прийшов у Кадес». На вершині затоки Соломон збудував свій флот в Еціон-Гевері поруч з Елотом, і Хірамові моряки повели його до Офіру. В оракулі Єремії про Едом крик його падіння чути аж до Червоного моря: «луна від їх крику чутна буде поза Червоним морем»."
    - "Затока дістала свою давню назву, Аеланітська, від Аели, або Аелани, біблійного Елата на її вершині, який Страбон знав як кінець сухопутної дороги з Гази; за днів Євсевія там стояв Десятий легіон. Мідні копальні Тімни лежать в Араві просто на північ від нього. Сьогодні в затоці сходяться чотири держави — Єгипет, Ізраїль, Йорданія та Саудівська Аравія; Акаба — єдиний морський порт Йорданії, а Ейлат — вихід Ізраїлю на південь, і закриття Єгиптом Тиранської протоки для ізраїльського судноплавства 1967 року сприяло початку Шестиденної війни."
  es:
    - "Este artículo trata del brazo oriental del mar Rojo, el golfo de Aqaba o de Eilat, el tramo del mar Rojo bíblico que está fuera de toda duda: corre unos 160 km al norte desde el estrecho de Tirán hasta Elat y Ezión-geber. (El mar del cruce del Éxodo y el significado de su nombre se tratan en el otro artículo sobre el mar Rojo.) El golfo es una fosa de la gran falla, de hasta 1850 m de profundidad y como máximo unos 24 km de anchura, entre las montañas graníticas del Sinaí y del Hiyaz, con arrecifes de coral a lo largo de ambas orillas."
    - "Dios fijó los límites de Israel «desde el mar Bermejo hasta la mar de Palestina, y desde el desierto hasta el río». Tras la negativa en Cades, el pueblo fue enviado de vuelta «al desierto, camino del mar Bermejo», rodeó Edom por ese camino, y «abatióse el ánimo del pueblo por el camino»; Jefté recordó que Israel «anduvo por el desierto hasta el mar Bermejo, y llegó á Cades». En la cabecera del golfo Salomón construyó su flota en Ezión-geber, junto a Eloth, y los marineros de Hiram la llevaron a Ofir. En el oráculo de Jeremías sobre Edom el clamor de su caída se oye hasta el mar Rojo: «el grito de su voz se oyó en el mar Bermejo»."
    - "El golfo tomó su antiguo nombre, el de los elanitas, de Ela o Elana, la Elat bíblica en su cabecera, que Estrabón conocía como el fin del camino terrestre desde Gaza; en tiempos de Eusebio estaba allí acuartelada la Legión Décima. Las minas de cobre de Timna están en el Arabá, justo al norte. Hoy cuatro Estados se encuentran en el golfo, Egipto, Israel, Jordania y Arabia Saudí; Aqaba es el único puerto marítimo de Jordania y Eilat la salida de Israel hacia el sur, y el cierre por Egipto del estrecho de Tirán a la navegación israelí en 1967 contribuyó a provocar la Guerra de los Seis Días."
  pt:
    - "Este artigo trata do braço oriental do Mar Vermelho, o golfo de Aqaba ou Eilat, o trecho do Mar Vermelho bíblico que está fora de dúvida: corre cerca de 160 km para o norte desde o Estreito de Tirã até Elate e Eziom-Geber. (O mar da travessia do Êxodo e o sentido de seu nome são tratados no outro artigo Mar Vermelho.) O golfo é uma fossa do grande rifte, com até 1.850 m de profundidade e no máximo cerca de 24 km de largura, entre as montanhas graníticas do Sinai e do Hejaz, com recifes de coral nas duas margens."
    - "Deus fixou os limites de Israel “desde o Mar Vermelho até o mar dos filisteus, e desde o deserto até o Rio”. Depois da recusa em Cades, o povo foi mandado de volta “para o deserto pelo caminho do Mar Vermelho”, contornou Edom por essa estrada, e “a alma do povo ficou muito desanimada por causa da jornada”; Jefté lembrou que Israel “passou pelo deserto até o Mar Vermelho, e chegou a Cades”. Na cabeça do golfo Salomão construiu sua frota em Eziom-Geber, junto a Elate, e os marinheiros de Hirão a levaram a Ofir. No oráculo de Jeremias sobre Edom o clamor de sua queda se ouve até o Mar Vermelho: “há um grito cujo som se ouve no mar Vermelho”."
    - "O golfo tomou seu nome antigo, Elanítico, de Aela ou Aelana, a Elate bíblica em sua cabeça, que Estrabão conhecia como o fim da estrada terrestre vinda de Gaza; no tempo de Eusébio a Décima Legião estava estacionada ali. As minas de cobre de Timna ficam na Arabá, logo ao norte. Hoje quatro Estados se encontram no golfo, Egito, Israel, Jordânia e Arábia Saudita; Aqaba é o único porto marítimo da Jordânia e Eilat a saída de Israel para o sul, e o fechamento do Estreito de Tirã pelo Egito aos navios israelenses em 1967 ajudou a provocar a Guerra dos Seis Dias."
  de:
    - "Dieser Artikel handelt vom östlichen Arm des Roten Meeres, dem Golf von Akaba oder Elat, dem Abschnitt des biblischen Roten Meeres, der außer Zweifel steht: Er reicht etwa 160 km von der Straße von Tiran nach Norden bis Elat und Ezjon-Geber. (Das Meer des Exodus-Zuges und die Bedeutung seines Namens behandelt der andere Artikel Rotes Meer.) Der Golf ist ein Graben des großen Grabenbruchs, bis zu 1850 m tief und höchstens etwa 24 km breit, zwischen den Granitbergen des Sinai und des Hedschas, mit Korallenriffen an beiden Ufern."
    - "Gott setzte Israels Grenzen „von dem Schilfmeer bis an das Philistermeer und von der Wüste bis an den Strom“. Nach der Weigerung in Kadesch wurde das Volk zurückgeschickt: „ziehet in die Wüste auf dem Wege zum Schilfmeer“, zog auf diesem Weg um Edom herum, und „das Volk ward verdrossen auf dem Wege“; Jeftah erinnerte: „da sie aus Ägypten zogen, wandelte Israel durch die Wüste bis ans Schilfmeer und kam gen Kades“. Am Kopf des Golfs baute Salomo seine Flotte in Ezjon-Geber bei Elat, und Hirams Seeleute fuhren damit nach Ofir. In Jeremias Spruch über Edom hört man den Schrei seines Falls bis zum Roten Meer: „ihr Geschrei wird man am Schilfmeer hören“."
    - "Der Golf erhielt seinen antiken Namen, der Aelanitische, von Aila oder Aelana, dem biblischen Elat an seinem Kopf, das Strabon als Ende der Landstraße von Gaza kannte; zu Eusebius' Zeit war dort die Zehnte Legion stationiert. Die Kupferminen von Timna liegen in der Araba gleich nördlich davon. Heute treffen am Golf vier Staaten zusammen, Ägypten, Israel, Jordanien und Saudi-Arabien; Akaba ist Jordaniens einziger Seehafen und Elat Israels Zugang nach Süden, und Ägyptens Sperrung der Straße von Tiran für israelische Schiffe 1967 trug zum Ausbruch des Sechstagekriegs bei."
  fr:
    - "Cet article traite du bras oriental de la mer Rouge, le golfe d’Aqaba ou d’Eilat, la part de la mer Rouge biblique qui ne fait aucun doute : il s’étend sur quelque 160 km vers le nord, du détroit de Tiran à Élath et Étsjon-Guéber. (La mer de la traversée de l’Exode et le sens de son nom sont traités dans l’autre article Mer Rouge.) Le golfe est une fosse du grand rift, profonde jusqu’à 1 850 m et large d’au plus 24 km environ, entre les montagnes de granit du Sinaï et du Hedjaz, avec des récifs coralliens le long des deux rives."
    - "Dieu fixa les limites d’Israël « depuis la mer Rouge jusqu’à la mer des Philistins, et depuis le désert jusqu’au fleuve ». Après le refus à Qadesh, le peuple fut renvoyé « pour le désert, dans la direction de la mer Rouge », contourna Édom par cette route, et « le peuple s’impatienta en route » ; Jephté rappela qu’Israël « a marché dans le désert jusqu’à la mer Rouge, et il est arrivé à Kadès ». À la tête du golfe, Salomon construisit sa flotte à Étsjon-Guéber, près d’Éloth, et les matelots de Hiram la menèrent à Ophir. Dans l’oracle de Jérémie sur Édom, le cri de sa chute s’entend jusqu’à la mer Rouge : « Leur cri se fait entendre jusqu’à la mer Rouge »."
    - "Le golfe reçut son nom antique, élanitique, d’Aila ou Aelana, l’Élath biblique à sa tête, que Strabon connaissait comme le terme de la route terrestre venant de Gaza ; à l’époque d’Eusèbe, la Xe légion y était stationnée. Les mines de cuivre de Thimna se trouvent dans l’Araba, juste au nord. Aujourd’hui, quatre États se rejoignent au golfe, l’Égypte, Israël, la Jordanie et l’Arabie saoudite ; Aqaba est le seul port maritime de la Jordanie et Eilat l’ouverture d’Israël vers le sud, et la fermeture du détroit de Tiran aux navires israéliens par l’Égypte en 1967 contribua à déclencher la guerre des Six Jours."
