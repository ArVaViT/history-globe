body:
  en:
    - "This article is about the Red Sea's eastern arm, the Gulf of Aqaba or Eilat, the stretch of the Bible's Red Sea that is beyond doubt: it runs some 160 km north from the Straits of Tiran to Elath and Ezion-geber. (The sea of the Exodus crossing and the meaning of its name are treated in the other Red Sea article.) The gulf is a trench of the great rift, up to 1,850 m deep and at most about 24 km wide, between the granite mountains of Sinai and the Hejaz, with coral reefs along both shores."
    - "God set Israel's bounds “from the Red sea even unto the sea of the Philistines, and from the desert unto the river”. After the refusal at Kadesh the people were sent back “into the wilderness by the way of the Red sea”, went round Edom by that road, and “the soul of the people was much discouraged because of the way”; Jephthah recalled that Israel “walked through the wilderness unto the Red sea, and came to Kadesh”. At the head of the gulf Solomon built his fleet at Ezion-geber beside Eloth, and Hiram's sailors took it to Ophir. In Jeremiah's oracle on Edom the cry of its fall is heard as far as the Red Sea: “at the cry the noise thereof was heard in the Red sea”."
    - "The gulf took its ancient name, the Aelanites, from Aela or Aelana, the biblical Elath at its head, which Strabo knew as the end of the overland road from Gaza; in Eusebius' day the Tenth Legion was stationed there. The copper mines of Timna lie in the Arabah just north of it. Today four states meet at the gulf, Egypt, Israel, Jordan and Saudi Arabia; Aqaba is Jordan's only seaport and Eilat Israel's outlet to the south, and Egypt's closing of the Straits of Tiran to Israeli shipping in 1967 helped bring on the Six-Day War."
  ru:
    - "Эта статья — о восточном рукаве Чермного моря, заливе Акаба, или Эйлатском, — той части библейского Чермного моря, о которой нет спора: он тянется примерно на 160 км к северу от Тиранского пролива до Елафа и Ецион-Гавера. (О море перехода в книге Исход и о значении его имени говорит другая статья о Чермном море.) Залив — впадина великого разлома, глубиной до 1850 м и шириной не больше примерно 24 км, между гранитными горами Синая и Хиджаза, с коралловыми рифами по обоим берегам."
    - "Бог провёл пределы Израиля «от моря Чермного до моря Филистимского и от пустыни до реки великой Евфрата». После отказа у Кадеса народ отослали назад «в пустыню к Чермному морю», и они обошли Едом этой дорогой. «И стал малодушествовать народ на пути». Иеффай вспоминал, что Израиль «пошел в пустыню к Чермному морю и пришел в Кадес». У вершины залива Соломон построил флот в Ецион-Гавере при Елафе, и корабельщики Хирама водили его в Офир. В пророчестве Иеремии о Едоме крик его падения доносится до Чермного моря: «отголосок крика их слышен будет у Чермного моря»."
    - "Залив получил древнее имя Эланитского от Элы, или Эланы, — библейского Елафа у его вершины, который Страбон знал как конец сухопутной дороги из Газы; во времена Евсевия там стоял Десятый легион. Медные рудники Тимны лежат в Араве чуть к северу. Сегодня у залива сходятся четыре государства — Египет, Израиль, Иордания и Саудовская Аравия; Акаба — единственный морской порт Иордании, Эйлат — выход Израиля на юг, а закрытие Египтом Тиранского пролива для израильских судов в 1967 году стало одним из поводов к Шестидневной войне."
  uk:
    - "Ця стаття — про східне рамено Червоного моря, затоку Акаба, або Ейлат, ділянку біблійного Червоного моря, що не викликає сумнівів: вона тягнеться приблизно на 160 км на північ від Тиранської протоки до Елата й Еціон-Гевера. (Море переходу під час Виходу та значення його назви розглянуто в іншій статті «Червоне море».) Затока — це западина великого рифту, завглибшки до 1850 м і завширшки щонайбільше близько 24 км, між гранітними горами Синаю та Хіджазу, з коралевими рифами вздовж обох берегів."
    - "Бог визначив межі Ізраїлю «від Червоного моря та й до моря Филистимського, і від пустинї до Ефрату». Після відмови в Кадесі народові було наказано повернутися «в степ по дорозї до Червоного моря»; він обійшов Едом цим шляхом, і «впав дух у людей в дорозї»; Єфтай нагадав, що Ізраїль «дійшов степом до Червоного моря, й прийшов у Кадес». На вершині затоки Соломон збудував свій флот в Еціон-Гевері поруч з Елотом, і Хірамові моряки повели його до Офіру. В оракулі Єремії про Едом крик його падіння чути аж до Червоного моря: «луна від їх крику чутна буде поза Червоним морем»."
    - "Затока дістала свою давню назву, Аеланітська, від Аели, або Аелани, біблійного Елата на її вершині, який Страбон знав як кінець сухопутної дороги з Гази; за днів Євсевія там стояв Десятий легіон. Мідні копальні Тімни лежать в Араві просто на північ від нього. Сьогодні в затоці сходяться чотири держави — Єгипет, Ізраїль, Йорданія та Саудівська Аравія; Акаба — єдиний морський порт Йорданії, а Ейлат — вихід Ізраїлю на південь, і закриття Єгиптом Тиранської протоки для ізраїльського судноплавства 1967 року сприяло початку Шестиденної війни."
  es:
    - "Este artículo trata del brazo oriental del mar Rojo, el golfo de Aqaba o de Eilat, el tramo del mar Rojo bíblico que está fuera de toda duda: corre unos 160 km al norte desde el estrecho de Tirán hasta Elat y Ezión-geber. (El mar del cruce del Éxodo y el significado de su nombre se tratan en el otro artículo sobre el mar Rojo.) El golfo es una fosa de la gran falla, de hasta 1850 m de profundidad y como máximo unos 24 km de anchura, entre las montañas graníticas del Sinaí y del Hiyaz, con arrecifes de coral a lo largo de ambas orillas."
    - "Dios fijó los límites de Israel «desde el mar Bermejo hasta la mar de Palestina, y desde el desierto hasta el río». Tras la negativa en Cades, el pueblo fue enviado de vuelta «al desierto, camino del mar Bermejo», rodeó Edom por ese camino, y «abatióse el ánimo del pueblo por el camino»; Jefté recordó que Israel «anduvo por el desierto hasta el mar Bermejo, y llegó á Cades». En la cabecera del golfo Salomón construyó su flota en Ezión-geber, junto a Eloth, y los marineros de Hiram la llevaron a Ofir. En el oráculo de Jeremías sobre Edom el clamor de su caída se oye hasta el mar Rojo: «el grito de su voz se oyó en el mar Bermejo»."
    - "El golfo tomó su antiguo nombre, el de los elanitas, de Ela o Elana, la Elat bíblica en su cabecera, que Estrabón conocía como el fin del camino terrestre desde Gaza; en tiempos de Eusebio estaba allí acuartelada la Legión Décima. Las minas de cobre de Timna están en el Arabá, justo al norte. Hoy cuatro Estados se encuentran en el golfo, Egipto, Israel, Jordania y Arabia Saudí; Aqaba es el único puerto marítimo de Jordania y Eilat la salida de Israel hacia el sur, y el cierre por Egipto del estrecho de Tirán a la navegación israelí en 1967 contribuyó a provocar la Guerra de los Seis Días."
  pt:
    - "Este artigo trata do braço oriental do Mar Vermelho, o golfo de Aqaba ou Eilat, o trecho do Mar Vermelho bíblico que está fora de dúvida: corre cerca de 160 km para o norte desde o Estreito de Tirã até Elate e Eziom-Geber. (O mar da travessia do Êxodo e o sentido de seu nome são tratados no outro artigo Mar Vermelho.) O golfo é uma fossa do grande rifte, com até 1.850 m de profundidade e no máximo cerca de 24 km de largura, entre as montanhas graníticas do Sinai e do Hejaz, com recifes de coral nas duas margens."
    - "Deus fixou os limites de Israel “desde o Mar Vermelho até o mar dos filisteus, e desde o deserto até o Rio”. Depois da recusa em Cades, o povo foi mandado de volta “para o deserto pelo caminho do Mar Vermelho”, contornou Edom por essa estrada, e “a alma do povo ficou muito desanimada por causa da jornada”; Jefté lembrou que Israel “passou pelo deserto até o Mar Vermelho, e chegou a Cades”. Na cabeça do golfo Salomão construiu sua frota em Eziom-Geber, junto a Elate, e os marinheiros de Hirão a levaram a Ofir. No oráculo de Jeremias sobre Edom o clamor de sua queda se ouve até o Mar Vermelho: “há um grito cujo som se ouve no mar Vermelho”."
    - "O golfo tomou seu nome antigo, Elanítico, de Aela ou Aelana, a Elate bíblica em sua cabeça, que Estrabão conhecia como o fim da estrada terrestre vinda de Gaza; no tempo de Eusébio a Décima Legião estava estacionada ali. As minas de cobre de Timna ficam na Arabá, logo ao norte. Hoje quatro Estados se encontram no golfo, Egito, Israel, Jordânia e Arábia Saudita; Aqaba é o único porto marítimo da Jordânia e Eilat a saída de Israel para o sul, e o fechamento do Estreito de Tirã pelo Egito aos navios israelenses em 1967 ajudou a provocar a Guerra dos Seis Dias."
  de:
    - "Dieser Artikel handelt vom östlichen Arm des Roten Meeres, dem Golf von Akaba oder Elat, dem Abschnitt des biblischen Roten Meeres, der außer Zweifel steht: Er reicht etwa 160 km von der Straße von Tiran nach Norden bis Elat und Ezjon-Geber. (Das Meer des Exodus-Zuges und die Bedeutung seines Namens behandelt der andere Artikel Rotes Meer.) Der Golf ist ein Graben des großen Grabenbruchs, bis zu 1850 m tief und höchstens etwa 24 km breit, zwischen den Granitbergen des Sinai und des Hedschas, mit Korallenriffen an beiden Ufern."
    - "Gott setzte Israels Grenzen „von dem Schilfmeer bis an das Philistermeer und von der Wüste bis an den Strom“. Nach der Weigerung in Kadesch wurde das Volk zurückgeschickt: „ziehet in die Wüste auf dem Wege zum Schilfmeer“, zog auf diesem Weg um Edom herum, und „das Volk ward verdrossen auf dem Wege“; Jeftah erinnerte: „da sie aus Ägypten zogen, wandelte Israel durch die Wüste bis ans Schilfmeer und kam gen Kades“. Am Kopf des Golfs baute Salomo seine Flotte in Ezjon-Geber bei Elat, und Hirams Seeleute fuhren damit nach Ofir. In Jeremias Spruch über Edom hört man den Schrei seines Falls bis zum Roten Meer: „ihr Geschrei wird man am Schilfmeer hören“."
    - "Der Golf erhielt seinen antiken Namen, der Aelanitische, von Aila oder Aelana, dem biblischen Elat an seinem Kopf, das Strabon als Ende der Landstraße von Gaza kannte; zu Eusebius' Zeit war dort die Zehnte Legion stationiert. Die Kupferminen von Timna liegen in der Araba gleich nördlich davon. Heute treffen am Golf vier Staaten zusammen, Ägypten, Israel, Jordanien und Saudi-Arabien; Akaba ist Jordaniens einziger Seehafen und Elat Israels Zugang nach Süden, und Ägyptens Sperrung der Straße von Tiran für israelische Schiffe 1967 trug zum Ausbruch des Sechstagekriegs bei."
  fr:
    - "Cet article traite du bras oriental de la mer Rouge, le golfe d’Aqaba ou d’Eilat, la part de la mer Rouge biblique qui ne fait aucun doute : il s’étend sur quelque 160 km vers le nord, du détroit de Tiran à Élath et Étsjon-Guéber. (La mer de la traversée de l’Exode et le sens de son nom sont traités dans l’autre article Mer Rouge.) Le golfe est une fosse du grand rift, profonde jusqu’à 1 850 m et large d’au plus 24 km environ, entre les montagnes de granit du Sinaï et du Hedjaz, avec des récifs coralliens le long des deux rives."
    - "Dieu fixa les limites d’Israël « depuis la mer Rouge jusqu’à la mer des Philistins, et depuis le désert jusqu’au fleuve ». Après le refus à Qadesh, le peuple fut renvoyé « pour le désert, dans la direction de la mer Rouge », contourna Édom par cette route, et « le peuple s’impatienta en route » ; Jephté rappela qu’Israël « a marché dans le désert jusqu’à la mer Rouge, et il est arrivé à Kadès ». À la tête du golfe, Salomon construisit sa flotte à Étsjon-Guéber, près d’Éloth, et les matelots de Hiram la menèrent à Ophir. Dans l’oracle de Jérémie sur Édom, le cri de sa chute s’entend jusqu’à la mer Rouge : « Leur cri se fait entendre jusqu’à la mer Rouge »."
    - "Le golfe reçut son nom antique, élanitique, d’Aila ou Aelana, l’Élath biblique à sa tête, que Strabon connaissait comme le terme de la route terrestre venant de Gaza ; à l’époque d’Eusèbe, la Xe légion y était stationnée. Les mines de cuivre de Thimna se trouvent dans l’Araba, juste au nord. Aujourd’hui, quatre États se rejoignent au golfe, l’Égypte, Israël, la Jordanie et l’Arabie saoudite ; Aqaba est le seul port maritime de la Jordanie et Eilat l’ouverture d’Israël vers le sud, et la fermeture du détroit de Tiran aux navires israéliens par l’Égypte en 1967 contribua à déclencher la guerre des Six Jours."
  it:
    - "Questo articolo riguarda il braccio orientale del Mar Rosso, il Golfo di Aqaba o di Eilat, il tratto del Mar Rosso biblico che è fuori dubbio: corre per circa 160 km a nord dallo Stretto di Tiran fino a Elat e a Ezion-Gheber. (Il mare dell’attraversamento dell’Esodo e il significato del suo nome sono trattati nell’altro articolo sul Mar Rosso.) Il golfo è una fossa della grande spaccatura, profonda fino a 1.850 m e larga al massimo circa 24 km, tra le montagne granitiche del Sinai e dell’Hegiaz, con barriere coralline lungo entrambe le rive."
    - "Dio fissò i confini di Israele «dal mar Rosso al mar de’ Filistei, e dal deserto sino al fiume». Dopo il rifiuto a Kades il popolo fu rimandato indietro: «avviatevi verso il deserto, in direzione del mar Rosso», girò attorno a Edom per quella strada, e «il popolo si fe’ impaziente nel viaggio»; Iefte ricordò che Israele «attraversò il deserto fino al mar Rosso e giunse a Kades». In fondo al golfo Salomone costruì la sua flotta a Ezion-Gheber presso Elat, e i marinai di Chiram la condussero a Ofir. Nell’oracolo di Geremia su Edom il grido della sua caduta si sente fino al Mar Rosso: «s’ode il loro grido fino al mar Rosso»."
    - "Il golfo prese il suo antico nome, Elanitico, da Ela o Elana, l’Elat biblica in fondo ad esso, che Strabone conosceva come termine della strada terrestre da Gaza; ai tempi di Eusebio vi era di stanza la Decima Legione. Le miniere di rame di Timna si trovano nell’Araba subito a nord. Oggi al golfo si incontrano quattro Stati, Egitto, Israele, Giordania e Arabia Saudita; Aqaba è l’unico porto della Giordania ed Eilat lo sbocco di Israele verso sud, e la chiusura dello Stretto di Tiran alla navigazione israeliana da parte dell’Egitto nel 1967 contribuì a provocare la guerra dei Sei Giorni."
  pl:
    - "Ten artykuł dotyczy wschodniego ramienia Morza Czerwonego, Zatoki Akaba, czyli Ejlat, odcinka biblijnego Morza Czerwonego, co do którego nie ma wątpliwości: biegnie około 160 km na północ od Cieśniny Tirańskiej do Elat i Esjon-Geber. (Morze przejścia Wyjścia i znaczenie jego nazwy omawia drugi artykuł o Morzu Czerwonym.) Zatoka jest rowem wielkiego uskoku, głębokim do 1850 m i szerokim co najwyżej około 24 km, między granitowymi górami Synaju i Hidżazu, z rafami koralowymi wzdłuż obu brzegów."
    - "Bóg wyznaczył granice Izraela „od morza czerwonego aż do morza Filistyńskiego, a od puszczy aż do rzeki”. Po odmowie w Kadesz lud odesłano „na puszczą, drogą ku morzu czerwonemu”, obeszli Edom tą drogą, a „utrudził się lud bardzo w onej drodze”; Jefte przypominał, że z Egiptu „szedł Izrael przez puszczą aż ku morzu czerwonemu, a przyszedł do Kades”. U wierzchołka zatoki Salomon zbudował swą flotę w Esjon-Geber obok Elat, a żeglarze Hirama popłynęli nią do Ofiru. W wyroczni Jeremiasza o Edomie wołanie o jego upadku słychać aż w Morzu Czerwonym: „głos i krzyk ich słyszeć będą na morzu Czerwonem”."
    - "Zatoka wzięła swą dawną nazwę, Ailanicka, od Ajli lub Ailany, biblijnego Elat u jej wierzchołka, które Strabon znał jako koniec drogi lądowej z Gazy; w czasach Euzebiusza stacjonował tam X Legion. Kopalnie miedzi Timna leżą w Arabie tuż na północ od niego. Dziś w zatoce spotykają się cztery państwa, Egipt, Izrael, Jordania i Arabia Saudyjska; Akaba jest jedynym portem morskim Jordanii, a Ejlat wyjściem Izraela na południe, i zamknięcie przez Egipt Cieśniny Tirańskiej dla żeglugi izraelskiej w 1967 roku przyczyniło się do wybuchu wojny sześciodniowej."
  cs:
    - "Tento článek se týká východního ramene Rudého moře, Akabského neboli Ejlatského zálivu, úseku biblického Rudého moře, o němž není pochyb: sahá asi 160 km na sever od Tiránského průlivu k Élatu a Ecjon-geberu. (Moře přechodu při Exodu a význam jeho jména se probírá v druhém článku o Rudém moři.) Záliv je příkop velkého riftu, hluboký až 1 850 m a nejvýše asi 24 km široký, mezi žulovými horami Sinaje a Hidžázu, s korálovými útesy podél obou břehů."
    - "Bůh vymezil hranice Izraele: „Položím pak meze tvé od moře Rudého až k moři Filistinskému, a od pouště až k řece“. Po odmítnutí v Kádeš byl lid poslán zpět: „beřte se na poušť cestou k moři Rudému“, tou cestou obešli Edóm a „i ustával lid velice na cestě“; Jiftách připomněl, že „šel Izrael přes poušť až k moři Rudému, a přišel do Kádes“. Na konci zálivu Šalomoun postavil svou flotilu v Ecjon-geberu vedle Élotu a Chírámovi námořníci s ní pluli do Ofíru. V Jeremjášově věštbě o Edómu je volání o jeho pádu slyšet až k Rudému moři: „hlas a křik jejich slyšán bude u moře Rudého“."
    - "Záliv dostal své starověké jméno Aelanitský podle Aily neboli Aelany, biblického Élatu na jeho konci, který Strabón znal jako konec pozemní cesty z Gazy; za Eusebiových dnů tam byla dislokována desátá legie. Měděné doly Timny leží v Arabě těsně severně od něj. Dnes se na zálivu stýkají čtyři státy, Egypt, Izrael, Jordánsko a Saúdská Arábie; Akaba je jediným jordánským přístavem a Ejlat izraelským východem na jih, a uzavření Tiránského průlivu Egyptem pro izraelskou plavbu roku 1967 přispělo k vypuknutí Šestidenní války."
  nl:
    - "Dit artikel gaat over de oostelijke arm van de Rode Zee, de Golf van Akaba of Eilat, het deel van de bijbelse Rode Zee dat buiten twijfel staat: hij loopt zo’n 160 km noordwaarts van de Straat van Tiran tot Elat en Ezeon-Geber. (De zee van de doortocht bij de Uittocht en de betekenis van haar naam worden behandeld in het andere artikel Rode Zee.) De golf is een geul van de grote slenk, tot 1850 m diep en hoogstens zo’n 24 km breed, tussen de granieten bergen van de Sinaï en de Hidjaz, met koraalriffen langs beide oevers."
    - "God stelde Israëls grenzen “van de zee Suf tot aan de zee der Filistijnen, en van de woestijn tot aan de rivier”. Na de weigering te Kades werd het volk teruggestuurd: “maakt uw reize naar de woestijn, op den weg naar de Schelfzee”, trok langs die weg om Edom heen, en “de ziel des volks werd verdrietig op dezen weg”; Jefta herinnerde eraan: “zo wandelde Israel door de woestijn tot aan de Schelfzee, en kwam te Kades”. Aan het hoofd van de golf bouwde Salomo zijn vloot bij Ezeon-Geber naast Eloth, en Hirams zeelieden brachten haar naar Ofir. In Jeremia’s godsspraak over Edom is de kreet van zijn val te horen tot aan de Rode Zee: “het gekrijt, welks geluid gehoord is bij de Schelfzee”."
    - "De golf ontleende zijn antieke naam, de Aelanitische, aan Aela of Aelana, het bijbelse Elat aan zijn hoofd, dat Strabo kende als het eindpunt van de landweg vanuit Gaza; in Eusebius’ dagen lag daar het Tiende Legioen. De kopermijnen van Timna liggen in de Araba net ten noorden ervan. Tegenwoordig ontmoeten vier staten elkaar aan de golf, Egypte, Israël, Jordanië en Saoedi-Arabië; Akaba is Jordaniës enige zeehaven en Eilat Israëls uitgang naar het zuiden, en Egyptes sluiting van de Straat van Tiran voor Israëlische schepen in 1967 hielp de Zesdaagse Oorlog te veroorzaken."
  sv:
    - "Denna artikel handlar om Röda havets östra arm, Akababukten eller Eilatbukten, den del av Bibelns Röda hav som är utom allt tvivel: den löper omkring 160 km norrut från Tiransundet till Elat och Esjon-Geber. (Havet vid uttågets övergång och betydelsen av dess namn behandlas i den andra artikeln om Röda havet.) Bukten är en gravsänka i den stora riftdalen, upp till 1 850 m djup och som mest omkring 24 km bred, mellan Sinais och Hejaz granitberg, med korallrev längs båda stränderna."
    - "Gud satte Israels gränser ”från Röda havet till filistéernas hav, och från öknen till floden”. Efter vägran vid Kadesh fick folket befallningen: ”bryten upp och tagen vägen mot öknen, åt Röda havet till”, gick runt Edom på den vägen, och ”under vägen blev folket otåligt”; Jefta erinrade om att Israel ”hade tågat genom öknen ända till Röda havet och sedan kommit till Kades”. Vid buktens spets byggde Salomo sin flotta i Esjon-Geber bredvid Elot, och Hirams sjömän förde den till Ofir. I Jeremias orakel över Edom hörs ropet vid dess fall ända till Röda havet: ”man skriar så, att ljudet höres ända borta vid Röda havet”."
    - "Bukten fick sitt antika namn, Ailaniterna, av Aila eller Ailana, bibliska Elat vid dess spets, som Strabon kände som slutet på landvägen från Gaza; på Eusebios tid var tionde legionen förlagd där. Koppargruvorna i Timna ligger i Arava strax norr därom. I dag möts fyra stater vid bukten, Egypten, Israel, Jordanien och Saudiarabien; Aqaba är Jordaniens enda hamn och Eilat Israels utlopp åt söder, och Egyptens stängning av Tiransundet för israelisk sjöfart 1967 bidrog till att utlösa sexdagarskriget."
  nb:
    - "Denne artikkelen handler om Rødehavets østlige arm, Aqababukta eller Eilat-bukta, den delen av Bibelens Rødehav som er hevet over tvil: den løper omkring 160 km nordover fra Tiran-stredet til Elat og Esjon-Geber. (Havet ved utferdens overgang og betydningen av navnet er behandlet i den andre artikkelen om Rødehavet.) Bukten er en grøft i den store riftdalen, opptil 1850 m dyp og høyst omtrent 24 km bred, mellom granittfjellene i Sinai og Hejaz, med korallrev langs begge kyster."
    - "Gud satte Israels grenser «fra det Røde Hav til filistrenes hav og fra ørkenen til elven». Etter nektelsen i Kadesj ble folket sendt tilbake til å «dra ut i ørkenen på veien til det Røde Hav», dro rundt Edom på den veien, og «på veien blev folket utålmodig»; Jefta minnet om at Israel «vandret [...] i ørkenen til det Røde Hav og kom til Kades». Innerst i bukten bygde Salomo flåten sin i Esjon-Geber ved Elot, og Hirams sjøfolk tok den til Ofir. I Jeremias orakel om Edom høres ropet om dets fall helt til Rødehavet: «det lyder skrik som høres like til det Røde Hav»."
    - "Bukten fikk sitt antikke navn, den elanittiske, etter Aela eller Aelana, det bibelske Elat innerst i den, som Strabon kjente som enden av landeveien fra Gasa; på Eusebius' tid var Den tiende legion stasjonert der. Kobbergruvene i Timna ligger i Arava like nord for den. I dag møtes fire stater ved bukten, Egypt, Israel, Jordan og Saudi-Arabia; Aqaba er Jordans eneste havneby og Eilat Israels utgang mot sør, og Egypts stenging av Tiran-stredet for israelsk skipsfart i 1967 bidro til å utløse Seksdagerskrigen."
  tl:
    - "Ang artikulong ito ay tungkol sa silangang sanga ng Dagat na Pula, ang Golpo ng Aqaba o Eilat, ang bahagi ng Dagat na Pula ng Bibliya na walang alinlangan: tumatakbo ito nang mga 160 km pahilaga mula sa Kipot ng Tiran hanggang sa Elath at Esion-geber. (Ang dagat ng pagtawid sa Exodo at ang kahulugan ng pangalan nito ay tinatalakay sa kabilang artikulo ng Dagat na Pula.) Ang golpo ay isang hukay ng malaking lambak-bitak (rift), hanggang 1,850 m ang lalim at hindi hihigit sa humigit-kumulang 24 km ang lapad, sa pagitan ng mga bundok na granito ng Sinai at ng Hejaz, na may mga bahura ng korales sa magkabilang baybayin."
    - "Itinakda ng Dios ang mga hangganan ng Israel “mula sa Dagat na Mapula hanggang sa dagat ng Filistia at mula sa ilang hanggang sa Ilog ng Eufrates”. Pagkatapos ng pagtangging iyon sa Cades, pinabalik ang bayan “pasa ilang sa daang patungo sa Dagat na Mapula”, umikot sa Edom sa daang iyon, at “ang damdamin ng bayan ay nainip dahil sa daan”; naalala ni Jephte na “ang Israel ay naglakad sa ilang hanggang sa Dagat na Mapula, at napasa Cades”. Sa dulo ng golpo, itinayo ni Salomon ang kaniyang hukbong-dagat sa Esion-geber sa tabi ng Elath, at dinala ito ng mga mandaragat ni Hiram sa Ophir. Sa orakulo ni Jeremias tungkol sa Edom, naririnig ang sigaw ng pagbagsak nito hanggang sa Dagat na Pula: “may hiyawan, na ang ingay ay naririnig sa Dagat na Mapula”."
    - "Nakuha ng golpo ang sinaunang pangalan nito, ang Aelanites, mula sa Aela o Aelana, ang Elath ng Bibliya sa dulo nito, na kilala ni Strabo bilang dulo ng daan sa lupa mula sa Gaza; noong panahon ni Eusebio, nakadestino roon ang Ikasampung Legion. Ang mga minahan ng tanso ng Timna ay nasa Araba sa hilaga lamang nito. Sa ngayon, apat na estado ang nagtatagpo sa golpo, ang Egipto, Israel, Jordan at Saudi Arabia; ang Aqaba ang tanging daungang-dagat ng Jordan at ang Eilat ang labasan ng Israel sa timog, at ang pagsasara ng Egipto sa Kipot ng Tiran sa paglalayag ng Israel noong 1967 ay nakatulong sa pagsiklab ng Digmaan ng Anim na Araw."
  da:
    - "Denne artikel handler om Det Røde Havs østlige arm, Aqababugten eller Eilatbugten, den strækning af Bibelens Røde Hav, der er hævet over tvivl: den løber omkring 160 km nordpå fra Tiransundet til Elat og Esjon-Geber. (Havet ved udtoget og betydningen af dets navn behandles i den anden artikel om Det Røde Hav.) Bugten er en grav i den store forkastning, op til 1850 m dyb og højst omkring 24 km bred, mellem Sinais og Hejaz' granitbjerge, med koralrev langs begge kyster."
    - "Gud satte Israels grænser »fra det røde Hav indtil Filistrenes Hav og fra Ørken indtil Floden«. Efter afvisningen ved Kadesj blev folket sendt tilbage »i Ørken ad Vejen til det røde Hav«, drog uden om Edom ad den vej, og »Folkets Sjæl blev utaalmodig paa Vejen«; Jefta mindede om, at da de drog op af Egypten, »vandrede Israel i Ørken indtil det røde Hav, og kom til Kades«. Ved bugtens inderste del byggede Salomo sin flåde i Esjon-Geber ved siden af Elot, og Hirams sømænd tog den til Ofir. I Jeremias' udsagn om Edom høres råbet om dets fald helt til Det Røde Hav: »Lyden deraf høres ved det røde Hav«."
    - "Bugten fik sit gamle navn, den ailanitiske, af Aila eller Ailana, Bibelens Elat ved dens inderste del, som Strabon kendte som enden af landevejen fra Gaza; i Eusebios' tid var 10. legion stationeret dér. Timnas kobberminer ligger i Araba lige nord for den. I dag mødes fire stater ved bugten, Egypten, Israel, Jordan og Saudi-Arabien; Aqaba er Jordans eneste havneby og Eilat Israels udgang mod syd, og Egyptens lukning af Tiransundet for israelsk skibsfart i 1967 var med til at fremkalde Seksdageskrigen."
  sr:
    - "Овај чланак говори о источном краку Црвеног мора, Акапском или Ејлатском заливу, делу библијског Црвеног мора који је ван сумње: протеже се око 160 км на север од Тиранског мореуза до Елата и Есион-Гавера. (Море прелаза при изласку и значење његовог имена обрађени су у другом чланку о Црвеном мору.) Залив је јарак великог расједа, дубок до 1850 м и широк највише око 24 км, између гранитних планина Синаја и Хиџаза, с коралним гребенима дуж обе обале."
    - "Бог је поставио међе Израиљу „од мора црвеног до мора филистејског и од пустиње до реке“. После одбијања код Кадиса народ је враћен „у пустињу к црвеном мору“, том је путем обишао Едом, и „ослаби дух народу од пута“; Јефтај се сећао: „пређе Израиљ преко пустиње до Црвеног Мора и дође до Кадиса“. На врху залива Соломун је градио своју флоту у Есион-Гаверу поред Елота, а Хирамови морнари одвели су је у Офир. У Јеремијином пророштву о Едому вапај његовог пада чује се све до Црвеног мора: „вика ће се њихова чути на црвеном мору“."
    - "Залив је добио своје старо име, Еланитски, по Ели или Елани, библијском Елату на његовом врху, који је Страбон знао као крај копненог пута из Газе; у Јевсевијево доба тамо је била стационирана Десета легија. Бакарни рудници Тимне леже у Арави одмах северно од њега. Данас се на заливу сусрећу четири државе, Египат, Израел, Јордан и Саудијска Арабија; Акаба је једина јорданска морска лука, а Ејлат израелски излаз на југ, а затварање Тиранског мореуза за израелску пловидбу од Египта 1967. помогло је да дође до Шестодневног рата."
  hu:
    - "Ez a cikk a Vörös-tenger keleti ágáról, az Akabai- vagy Eilati-öbölről szól, a Biblia Vörös-tengerének arról a szakaszáról, amely kétségtelen: mintegy 160 km hosszan nyúlik észak felé a Tirán-szorostól Élátig és Ecjón-Géberig. (A kivonulás tengerének átkelését és nevének jelentését a másik Vörös-tenger cikk tárgyalja.) Az öböl a nagy hasadékvölgy árka, legfeljebb 1850 m mély és legfeljebb mintegy 24 km széles, a Sínai és a Hidzsáz gránithegyei között, mindkét partján korallzátonyokkal."
    - "Isten ezt mondta Izráel határáról: „határodat a veres tengertől a Filiszteusok tengeréig vetem, és a pusztától fogva a folyóvízig”. A kádesi megtagadás után a népet visszaküldték „a pusztába, a veres tenger útján”, ezen az úton kerülték meg Edomot, és „a népnek lelke megkeseredék útközben”; Jefte emlékeztetett, hogy Izráel „a pusztában bolyongott … egész a Veres tengerig, és mikor Kádesbe ért”. Az öböl csücskén Salamon az Élót melletti Ecjón-Géberben építette flottáját, és Hírám tengerészei elvitték Ofírba. Jeremiás Edomról szóló jövendölésében bukásának kiáltása hallatszik egészen a Vörös-tengerig: „az ő kiáltásuk szava elhallatszik a veres tengerig”."
    - "Az öböl ókori nevét, az Aelanites-t, Aelától vagy Aelanától kapta, a csücskén lévő bibliai Élátról, amelyet Sztrabón a Gázából vezető szárazföldi út végeként ismert; Euszebiosz napjaiban a Tizedik légió állomásozott ott. Timna rézbányái az Arábában fekszenek, közvetlenül északra tőle. Ma négy állam találkozik az öbölnél: Egyiptom, Izrael, Jordánia és Szaúd-Arábia; Akaba Jordánia egyetlen tengeri kikötője, Eilat Izrael déli kijárata, és az, hogy Egyiptom 1967-ben lezárta a Tirán-szorost az izraeli hajózás előtt, hozzájárult a hatnapos háború kitöréséhez."
  fi:
    - "Tämä artikkeli koskee Punaisenmeren itäistä haaraa, Akabanlahtea eli Eilatinlahtea, Raamatun Punaisenmeren epäilemätöntä osaa: se ulottuu noin 160 km pohjoiseen Tiranin salmesta Elatiin ja Esjon-Geberiin. (Exoduksen ylityksen meri ja sen nimen merkitys käsitellään toisessa Punainenmeri-artikkelissa.) Lahti on suuren hautavajoaman uurre, jopa 1 850 m syvä ja enintään noin 24 km leveä, Siinain ja Hidjazin graniittivuorten välissä, ja molempia rantoja reunustavat koralliriutat."
    - "Jumala asetti Israelin rajat ”Kaislamerestä filistealaisten mereen ja erämaasta Eufrat-virtaan asti”. Kadeksen kieltäytymisen jälkeen kansa lähetettiin takaisin: ”painukaa erämaahan, Kaislameren tietä”. Se kiersi Edomin sitä tietä, ja ”matkalla kansa kävi kärsimättömäksi”; Jefta muisti, että Israel ”kulki erämaan kautta Kaislamerelle saakka ja tuli Kaadekseen”. Lahden pohjukassa Salomo rakensi laivastonsa Esjon-Geberissä Elotin vieressä, ja Hiramin merimiehet veivät sen Ofiriin. Jeremian Edomia koskevassa ennustuksessa sen kukistumisen huuto kuuluu Punaiselle merelle asti: ”huudetaan, niin että ääni kuuluu Kaislamerelle asti”."
    - "Lahti sai muinaisen nimensä, Aelanites, Aelasta eli Aelanasta, Raamatun Elatista sen pohjukassa, jonka Strabon tunsi Gazasta lähtevän maatien päätepisteenä; Eusebioksen aikana X legioona oli sijoitettu sinne. Timnan kuparikaivokset ovat Arabassa sen pohjoispuolella. Nykyään lahdella kohtaavat neljä valtiota, Egypti, Israel, Jordania ja Saudi-Arabia; Aqaba on Jordanian ainoa merisatama ja Eilat Israelin ulospääsy etelään, ja Egyptin sulkiessa Tiranin salmen Israelin laivaliikenteeltä vuonna 1967 tämä auttoi kuuden päivän sodan syttymisessä."
  vi:
    - "Bài này nói về nhánh phía đông của Biển Đỏ, vịnh Aqaba hay Eilat, đoạn của Biển Đỏ trong Kinh Thánh không còn nghi ngờ: nó chạy khoảng 160 km về phía bắc từ eo biển Tiran đến Ê-lát và Ê-xi-ôn-Ghê-be. (Biển của cuộc vượt qua trong sách Xuất Ê-díp-tô Ký và ý nghĩa tên của nó được bàn trong bài Biển Đỏ kia.) Vịnh là một rãnh của thung lũng tách giãn lớn, sâu đến 1.850 m và rộng nhất khoảng 24 km, giữa các dãy núi đá granit của Sinai và Hejaz, với các rạn san hô dọc cả hai bờ."
    - "Đức Chúa Trời định bờ cõi Y-sơ-ra-ên “từ Biển đỏ chí biển Phi-li-tin, từ đồng vắng đến sông cái”. Sau sự khước từ ở Ca-đe, dân được sai trở lại “đi đến đồng vắng về hướng Biển đỏ”, đi vòng quanh Ê-đôm theo con đường ấy, và “giữa đường dân sự ngã lòng”; Giép-thê nhắc rằng Y-sơ-ra-ên “đi ngang qua đồng vắng cho đến Biển đỏ, rồi tới Ca-đe”. Ở đầu vịnh, Sa-lô-môn đóng đoàn tàu của mình tại Ê-xi-ôn-Ghê-be cạnh Ê-lát, và thủy thủ của Hi-ram đưa nó đến Ô-phia. Trong lời sấm của Giê-rê-mi về Ê-đôm, tiếng kêu về sự sụp đổ của nó nghe đến tận Biển Đỏ: “tiếng kêu của chúng nó nghe thấu đến Biển đỏ”."
    - "Vịnh lấy tên cổ, Aelanites, từ Aela hay Aelana, Ê-lát trong Kinh Thánh ở đầu vịnh, mà Strabo biết như điểm cuối của con đường bộ từ Ga-xa; vào thời Eusebius, Quân đoàn Mười đóng ở đó. Các mỏ đồng Thim-na nằm ở A-ra-ba ngay phía bắc. Ngày nay bốn quốc gia gặp nhau ở vịnh, Ai Cập, Israel, Jordan và Ả Rập Xê Út; Aqaba là hải cảng duy nhất của Jordan và Eilat là lối ra phía nam của Israel, và việc Ai Cập đóng eo biển Tiran đối với tàu thuyền Israel năm 1967 đã góp phần đưa đến Chiến tranh Sáu Ngày."
  ro:
    - "Acest articol este despre brațul estic al Mării Roșii, Golful Aqaba sau Eilat, porțiunea Mării Roșii a Bibliei care este în afara oricărui dubiu: se întinde pe circa 160 km spre nord de la Strâmtoarea Tiran până la Elat și Ețion-Gheber. (Marea trecerii din Exod și sensul numelui ei sunt tratate în celălalt articol despre Marea Roșie.) Golful este o groapă a marii fracturi tectonice, adâncă de până la 1850 m și lată de cel mult circa 24 km, între munții de granit ai Sinaiului și Hejaz, cu recifuri de corali pe ambele maluri."
    - "Dumnezeu a pus hotarele lui Israel „de la marea Roșie până la marea Filistenilor, și dela pustiu până la rîul cel mare al Eufratului”. După refuzul de la Cades, poporul a fost trimis înapoi „în pustie pre calea cea despre marea Roșie”, a ocolit Edomul pe acel drum, iar „s’a împuținat cu sufletul poporul pre cale”; Ieftae a amintit că „a mers Israil prin pustie până la marea Roșie, și a venit în Kadis”. La capul golfului, Solomon și-a construit flota la Ețion-Gheber, lângă Elot, iar marinarii lui Hiram au dus-o la Ofir. În oracolul lui Ieremia despre Edom, strigătul căderii lui se aude până la Marea Roșie."
    - "Golful și-a luat numele antic, Aelanites, de la Aela sau Aelana, Elatul biblic de la capul lui, pe care Strabon îl cunoștea drept capătul drumului terestru dinspre Gaza; pe vremea lui Eusebiu era staționată acolo Legiunea a X-a. Minele de cupru de la Timna se află în Araba, chiar la nord de el. Astăzi patru state se întâlnesc la golf, Egiptul, Israelul, Iordania și Arabia Saudită; Aqaba este singurul port maritim al Iordaniei, iar Eilat ieșirea Israelului spre sud, iar închiderea de către Egipt a Strâmtorii Tiran pentru navigația israeliană, în 1967, a contribuit la izbucnirea Războiului de Șase Zile."
  bg:
    - "Тази статия е за източния ръкав на Червено море, залива Акаба, или Ейлат — участъка от библейското Червено море, който е несъмнен: той се простира около 160 км на север от протока Тиран до Елат и Ецион-Гавер. (Морето от преминаването при Изхода и значението на името му се разглеждат в другата статия за Червено море.) Заливът е падина на големия разлом, дълбока до 1850 м и широка най-много около 24 км, между гранитните планини на Синай и Хиджаз, с коралови рифове по двата бряга."
    - "Бог поставил пределите на Израил „от червено море до Филистимско Море, и от пустинята до река Ефрат“. След отказа при Кадеш народът бил върнат „в пустинята към червено Море“, заобиколил Едом по този път и „людете по пътя станаха малодушни“; Йефтай припомнил, че Израил „отиде през пустинята при червено Море, и дойде в Кадис“. В северния край на залива Соломон построил флота си в Ецион-Гавер до Елот, а моряците на Хирам го отвели до Офир. В пророчеството на Йеремия за Едом викът от падането му се чува чак до Червено море: „Екотът на гласа му се чуе до червено Море“."
    - "Заливът получил древното си име, Еланитски, от Аела или Елана, библейския Елат в северния му край, който Страбон познавал като края на сухопътния път от Газа; по времето на Евсевий там бил разположен Десети легион. Медните мини на Тимна лежат в Арава точно на север от него. Днес четири държави се срещат при залива — Египет, Израел, Йордания и Саудитска Арабия; Акаба е единственото морско пристанище на Йордания, а Ейлат — изходът на Израел на юг, и затварянето на протока Тиран от Египет за израелските кораби през 1967 г. допринесло за избухването на Шестдневната война."
