body:
  en:
    - "This Gath appears in two short notes in the genealogies of Chronicles, and it is not certain that it is the Philistine city of Goliath. Among the sons of Ephraim were Ezer and Elead, “whom the men of Gath that were born in that land slew, because they came down to take away their cattle”; Ephraim mourned many days, and named a son born afterwards Beriah, “because it went evil with his house”. In the list of Benjamin, Beriah and Shema, “heads of the fathers of the inhabitants of Aijalon”, are those “who drove away the inhabitants of Gath”. The phrase “born in that land” sets the men of Gath apart as natives, and the stories look like old clan memories whose date cannot be fixed."
    - "Where this Gath was is disputed. Some take it for the Philistine Gath (Tell es-Safi); others, noting the link with Aijalon and Beth-horon in the same chapters, look for a nearer town, such as Gittaim near Lod or Gath-padalla in the Sharon plain, known from the Amarna letters and placed at Jatt; small sites in the Aijalon area have also been suggested. Nothing ties any of them to these verses, and the map's point is one choice among several."
  ru:
    - "Этот Геф появляется в двух коротких заметках родословий Паралипоменона, и неясно, тот ли это филистимский город Голиафа. Среди сыновей Ефрема были Езер и Елеад: «И убили их жители Гефа, уроженцы той земли, за то, что они пошли захватить стада их»; Ефрем плакал много дней и назвал родившегося потом сына Берией, «потому что несчастье постигло дом его». В списке Вениамина о Берии и Шеме сказано: «Они были главами поколений жителей Аиалона. Они выгнали жителей Гефа». Слова «уроженцы той земли» отличают жителей Гефа как местных, а сами рассказы похожи на старые родовые предания, которые невозможно датировать."
    - "Где был этот Геф, спорно. Одни считают его филистимским Гефом (Телль-эс-Сафи); другие, видя связь с Аиалоном и Беф-Ороном в тех же главах, ищут более близкий город — Гиффаим близ Лидды или Гат-Падаллу на Саронской равнине, известную по амарнским письмам и помещаемую в Джатт; предлагали и небольшие места в округе Аиалона. Ничто не связывает ни одно из них с этими стихами, и точка на карте — лишь один выбор из нескольких."
  uk:
    - "Цей Гат фігурує у двох коротких примітках у родоводах Хронік, і не певно, чи це філістимське місто Голіята. Серед синів Єфрема були Езер і Елеад, яких «вбили осадники Гета, тубільці того краю, за те, що вони напали були, щоб загарбати їхні череди»; Єфрем плакав за ними багато днів і дав синові, що народився потім, ім’я Берія, «бо нещастя спало на господу його». У переліку Веніямина Берія й Шема були «головами над родинами осадників в Аялоні» і саме вони «вигнали осадників із Гета». Слова «тубільці того краю» виокремлюють мешканців Гата як місцевих, а самі розповіді скидаються на давні родові спогади, дату яких не можна визначити."
    - "Де був цей Гат, суперечать. Дехто вважає його філістимським Гатом (Тель-ес-Сафі); інші, зважаючи на зв’язок з Аялоном і Бет-Хороном у тих самих розділах, шукають ближче місто, як-от Гіттаїм поблизу Лідди або Гат-Падалла на рівнині Шарон, відоме з амарнських листів і розміщуване в Джатті; пропонували й невеликі поселення в околицях Аялона. Ніщо не пов’язує жодне з них із цими віршами, і точка на карті — лише один вибір із кількох."
  es:
    - "Este Gat aparece en dos breves notas de las genealogías de Crónicas, y no es seguro que sea la ciudad filistea de Goliat. Entre los hijos de Efraín estaban Ezer y Elead, a quienes «los hijos de Gath, naturales de aquella tierra, los mataron, porque vinieron á tomarles sus ganados»; Efraín hizo duelo muchos días y puso a un hijo nacido después el nombre de Bería, «por cuanto había estado en aflicción en su casa». En la lista de Benjamín, Bería y Sema, «cabezas de las familias de los moradores de Ajalón», son los que «echaron á los moradores de Gath». La expresión «naturales de aquella tierra» distingue a los hombres de Gat como oriundos del país, y los relatos parecen antiguos recuerdos de clan cuya fecha no puede fijarse."
    - "Dónde estuvo este Gat es discutido. Unos lo identifican con la Gat filistea (Tell es-Safi); otros, advirtiendo el vínculo con Ajalón y Bet-horón en los mismos capítulos, buscan una población más cercana, como Gitaim, cerca de Lida, o Gat-padala, en la llanura de Sarón, conocida por las cartas de Amarna y situada en Jatt; también se han sugerido pequeños yacimientos de la zona de Ajalón. Nada vincula a ninguno de ellos con estos versículos, y el punto del mapa es una elección entre varias."
  pt:
    - "Esta Gate aparece em duas breves notas nas genealogias de Crônicas, e não é certo que seja a cidade filisteia de Golias. Entre os filhos de Efraim estavam Ezer e Eleade, “a quem os homens de Gate, que nasceram na terra, mataram, porque desceram para tomar o seu gado”; Efraim lamentou por muitos dias e deu o nome de Berias a um filho nascido depois, “porque havia infortúnio em sua casa”. Na lista de Benjamim, Berias e Sema, “chefes de casas paternas dos habitantes de Aijalom”, são aqueles que “puseram em fuga os habitantes de Gate”. A expressão “que nasceram na terra” distingue os homens de Gate como nativos, e as histórias parecem antigas lembranças de clãs, cuja data não se pode fixar."
    - "Onde ficava esta Gate é disputado. Alguns a tomam pela Gate filisteia (Tell es-Safi); outros, notando a ligação com Aijalom e Bete-Horom nos mesmos capítulos, procuram uma cidade mais próxima, como Gitaim, perto de Lode, ou Gate-Padala, na planície de Sarom, conhecida pelas cartas de Amarna e situada em Jatt; também foram sugeridos pequenos sítios na região de Aijalom. Nada liga qualquer um deles a estes versículos, e o ponto do mapa é uma escolha entre várias."
  de:
    - "Dieses Gat erscheint in zwei kurzen Notizen der Geschlechtsregister der Chronik, und es ist nicht sicher, dass es die philistäische Stadt Goliats ist. Unter den Söhnen Ephraims waren Eser und Elead; „die Männer zu Gath, die Einheimischen im Lande, erwürgten sie, darum daß sie hinabgezogen waren ihr Vieh zu nehmen“. Ephraim trug lange Zeit Leid und nannte einen später geborenen Sohn Beria, „darum daß es in seinem Hause übel zuging“. In der Liste Benjamins sind Beria und Schema „Häupter der Vaterhäuser unter den Bürgern zu Ajalon“; „sie verjagten die zu Gath“. Die Wendung „die Einheimischen im Lande“ hebt die Männer von Gat als Ureinwohner ab, und die Geschichten wirken wie alte Sippenerinnerungen, deren Zeit sich nicht bestimmen lässt."
    - "Wo dieses Gat lag, ist umstritten. Manche halten es für das philistäische Gat (Tell es-Safi); andere suchen mit Blick auf die Verbindung zu Ajalon und Bet-Horon in denselben Kapiteln eine nähere Stadt, etwa Gittajim bei Lod oder Gat-Padalla in der Scharonebene, das aus den Amarnabriefen bekannt ist und bei Jatt angesetzt wird; auch kleine Stätten im Gebiet von Ajalon sind vorgeschlagen worden. Nichts verbindet eine davon mit diesen Versen, und der Punkt auf der Karte ist eine Wahl unter mehreren."
  fr:
    - "Ce Gath apparaît dans deux brèves notices des généalogies des Chroniques, et il n’est pas certain qu’il s’agisse de la ville philistine de Goliath. Parmi les fils d’Éphraïm se trouvaient Ézer et Élead : « Les hommes de Gath, nés dans le pays, les tuèrent, parce qu’ils étaient descendus pour prendre leurs troupeaux » ; Éphraïm « fut longtemps dans le deuil », et il appela Beria un fils né ensuite, « parce que le malheur était dans sa maison ». Dans la liste de Benjamin, Beria et Schéma, « chefs de famille parmi les habitants d’Ajalon », sont ceux qui « mirent en fuite les habitants de Gath ». L’expression « nés dans le pays » fait des hommes de Gath des indigènes, et ces récits ressemblent à d’anciens souvenirs de clan dont la date ne peut être fixée."
    - "L’emplacement de ce Gath est discuté. Certains y voient le Gath philistin (Tell es-Safi) ; d’autres, notant le lien avec Ajalon et Beth-Horon dans les mêmes chapitres, cherchent une ville plus proche, telle que Guitthaïm près de Lydde ou Gath-Padalla dans la plaine de Saron, connue par les lettres d’Amarna et située à Jatt ; de petits sites de la région d’Ajalon ont aussi été proposés. Rien ne rattache aucun d’eux à ces versets, et le point de la carte est un choix parmi plusieurs."
  pl:
    - "Ten Gat pojawia się w dwóch krótkich wzmiankach w rodowodach z Ksiąg Kronik i nie jest pewne, czy to filistyński gród Goliata. Wśród synów Efraima byli Ezer i Elead: „A pobili ich mężowie z Get, co się byli zrodzili w onej ziemi; albowiem byli wtargnęli, aby pobrali dobytki ich”; Efraim płakał przez wiele dni, a syna urodzonego potem nazwał Beria, ponieważ w jego domu działo się źle. W wykazie Beniamina Beria i Szema, książęta narodów „mieszkających w Ajalon”, to ci, którzy „wygnali obywateli z Get”. Określenie „co się byli zrodzili w onej ziemi” wyróżnia mężów z Gat jako rodowitych mieszkańców, a opowieści wyglądają na dawne wspomnienia rodowe, których daty nie sposób ustalić."
    - "Gdzie leżał ten Gat, jest sporne. Jedni uważają go za filistyński Gat (Tell es-Safi); inni, zwracając uwagę na związek z Ajjalonem i Bet-Choron w tych samych rozdziałach, szukają bliższego miasta, jak Gittaim koło Lod albo Gat-Padalla na równinie Szaron, znana z listów z Amarna i umieszczana w Jatt; sugerowano też niewielkie stanowiska w okolicy Ajjalonu. Nic nie wiąże żadnego z nich z tymi wersetami, a punkt na mapie jest jednym wyborem spośród kilku."
  it:
    - "Questa Gat compare in due brevi note nelle genealogie delle Cronache, e non è certo che sia la città filistea di Golia. Tra i figli di Efraim vi furono Ezer ed Elead, «uccisi da quei di Gath, nativi del paese, perch’erano scesi a predare il loro bestiame»; Efraim li pianse per molto tempo e chiamò Beria un figlio nato in seguito, «perché questo era avvenuto mentre avea l’afflizione in casa». Nell’elenco di Beniamino, Beria e Scema, «capi delle famiglie che abitavano Ajalon», sono coloro che «misero in fuga gli abitanti di Gath». L’espressione «nativi del paese» distingue gli uomini di Gat come indigeni, e i racconti sembrano antichi ricordi di clan, la cui data non si può fissare."
    - "Dove fosse questa Gat è controverso. Alcuni la identificano con la Gat filistea (Tell es-Safi); altri, notando il legame con Aialon e Bet-Oron negli stessi capitoli, cercano una città più vicina, come Ghittaim presso Lidda o Gat-Padalla nella pianura del Saròn, nota dalle lettere di Amarna e collocata a Jatt; sono stati proposti anche piccoli siti nella zona di Aialon. Nulla lega alcuno di questi luoghi a tali versetti, e il punto della mappa è una scelta fra molte."
  nl:
    - "Dit Gat komt voor in twee korte aantekeningen in de geslachtsregisters van Kronieken, en het is niet zeker dat het de Filistijnse stad van Goliat is. Onder de zonen van Efraïm waren Ezer en Elead; “de mannen van Gath, die in het land geboren waren, doodden hen, omdat zij afgekomen waren om hun vee te nemen”; daarom “droeg Efraim, hun vader, vele dagen leed”, en hij gaf een later geboren zoon de naam Beria, “omdat zij in ellende was in zijn huis”. In de lijst van Benjamin zijn Beria en Sema, “hoofden der vaderen van de inwoners te Ajalon”, van wie het heet: “dezen hebben de inwoners van Gath verdreven”. De uitdrukking “in het land geboren” stelt de mannen van Gat als inheemsen voor, en de verhalen lijken oude herinneringen van geslachten waarvan de datering niet vast te stellen is."
    - "Waar dit Gat lag, is omstreden. Sommigen houden het voor het Filistijnse Gat (Tell es-Safi); anderen, die wijzen op het verband met Ajalon en Beth-Horon in dezelfde hoofdstukken, zoeken een nabijere stad, zoals Gittaïm bij Lydda of Gat-Padalla in de Saronvlakte, bekend uit de brieven van Amarna en gelokaliseerd bij Jatt; ook kleine vindplaatsen in de omgeving van Ajalon zijn voorgesteld. Niets verbindt een van deze met deze verzen, en het punt op de kaart is één keuze uit meerdere."
  cs:
    - "Tento Gat se objevuje ve dvou stručných poznámkách v rodokmenech Letopisů a není jisté, že jde o pelištejské město Goliáše. Mezi syny Efrajimovými byli Ezer a Elead, „I zbili je muži Gát, kteříž zrozeni byli v zemi té; nebo sstoupili byli, aby zajali dobytky jejich“; Efrajim truchlil mnoho dní a později narozeného syna nazval Beria, „že byl v zámutku pro rodinu svou“. V seznamu Benjamínově jsou Beria a Šema „knížata čeledí otcovských, bydlících v Aialon“, a ti „zahnali obyvatele Gát“. Slova „zrozeni byli v zemi té“ vymezují muže z Gatu jako domorodce a příběhy vypadají jako staré rodové vzpomínky, jejichž dobu nelze určit."
    - "Kde tento Gat ležel, je sporné. Někteří jej pokládají za pelištejský Gat (Tell es-Safí); jiní, všímajíce si spojení s Ajalonem a Bét-choronem ve stejných kapitolách, hledají blíže ležící město, například Gitajim u Lodu nebo Gat-padalla na Šaronské pláni, známou z amarnských dopisů a kladenou do Jattu; navrhována byla i malá sídliště v oblasti Ajalonu. Nic žádné z těchto možností s těmito verši nespojuje a bod na mapě je jednou volbou z několika."
  sv:
    - "Detta Gat förekommer i två korta notiser i Krönikebokens släkttavlor, och det är inte säkert att det är Goljats filisteiska stad. Bland Efraims söner fanns Eser och Elad; ”män från Gat, som voro födda där i landet, dräpte dem, därför att de hade dragit ned för att taga deras boskapshjordar”; Efraim sörjde i lång tid och gav en son som föddes därefter namnet Beria, ”därför att det hade skett under en olyckstid för hans hus”. I Benjamins släktlista är Beria och Shema, ”familjehuvudmän för Ajalons invånare”, de som ”förjagade Gats invånare”. Uttrycket ”födda där i landet” skiljer ut männen från Gat som infödda, och berättelserna ser ut som gamla släktminnen vars tid inte kan fastställas."
    - "Var detta Gat låg är omstritt. Några tar det för det filisteiska Gat (Tell es-Safi); andra, som noterar kopplingen till Ajalon och Bet-Horon i samma kapitel, söker en närmare stad, såsom Gittajim nära Lod eller Gat-Padalla på Saronslätten, känd från Amarnabreven och förlagd till Jatt; små platser i Ajalonområdet har också föreslagits. Inget knyter någon av dem till dessa verser, och kartans punkt är ett val bland flera."
  nb:
    - "Denne Gat forekommer i to korte notiser i slektsregistrene i Krønikebøkene, og det er ikke sikkert at det er filisterbyen til Goliat. Blant Efraims sønner var Eser og Elad, som «blev drept av menn fra Gat som var født der i landet, fordi de hadde draget ned for å røve deres fe»; Efraim sørget i lang tid og ga en sønn som ble født senere, navnet Beria, «fordi der hadde vært ulykke i hans hus». I Benjamins liste er Beria og Sjema, «familiehodene blandt Ajalons innbyggere», de som «drev Gats innbyggere på flukt». Uttrykket «født der i landet» setter mennene fra Gat for seg som innfødte, og fortellingene ser ut som gamle slektsminner som ikke kan dateres."
    - "Hvor denne Gat lå, er omstridt. Noen mener det er den filistiske Gat (Tell es-Safi); andre, som legger merke til forbindelsen med Ajalon og Bet-Horon i de samme kapitlene, leter etter en nærmere by, som Gittajim ved Lod eller Gat-Padalla i Sjaron-sletten, kjent fra Amarna-brevene og plassert ved Jatt; små steder i Ajalon-området er også foreslått. Ingenting knytter noen av dem til disse versene, og kartets punkt er ett valg blant flere."
  tl:
    - "Ang Gath na ito ay lumilitaw sa dalawang maikling tala sa mga talaangkanan ng Mga Cronica, at hindi tiyak na ito ang lungsod ng mga Filisteo ni Goliath. Sa mga anak ni Ephraim ay sina Ezer at Elad, “na siyang mga pinatay ng mga lalake ng Gath na mga ipinanganak sa lupain, sapagka't sila'y nagsilusong upang kunin ang kanilang mga hayop”; tumangis si Ephraim ng maraming araw, at pinangalanan ang isang anak na ipinanganak pagkaraan na Berias, “sapagka't sumakaniyang bahay ang kasamaan”. Sa talaan ng Benjamin, sina Berias at Sema, “mga pangulo sa mga sangbahayan ng mga magulang ng mga taga Ajalon”, ay yaong “nangagpatakas sa mga taga Gath”. Ang pariralang “ipinanganak sa lupain” ay naghihiwalay sa mga lalaki ng Gath bilang mga katutubo, at ang mga kuwento ay tila matatandang alaala ng angkan na hindi matitiyak ang petsa."
    - "Pinagtatalunan kung saan naroon ang Gath na ito. Itinuturing ito ng ilan na Gath ng mga Filisteo (Tell es-Safi); ang iba, na napapansin ang kaugnayan sa Ajalon at Beth-horon sa magkaparehong kabanata, ay naghahanap ng mas malapit na bayan, gaya ng Githaim malapit sa Lod o Gath-padalla sa kapatagan ng Saron, na kilala mula sa mga liham ng Amarna at inilalagay sa Jatt; may iminungkahi ring maliliit na lugar sa palibot ng Ajalon. Walang nag-uugnay sa alinman sa mga ito sa mga talatang ito, at ang tuldok ng mapa ay isang pagpili sa gitna ng ilan."
  da:
    - "Denne Gat optræder i to korte noter i Krønikebøgernes slægtsregistre, og det er ikke sikkert, at den er Goliats filistæiske by. Blandt Efraims sønner var Ezer og Elead, »dem sloge Mændene af Gath, som vare fødte i Landet, ihjel, fordi de vare dragne ned at tage deres Kvæg«; Efraim sørgede mange dage og kaldte en søn, der blev født derefter, Beria, »thi det var sket under Ulykke i hans Hus«. I Benjamins liste er Beria og Sjema, »Øverster for deres Fædrenehuse iblandt Indbyggerne i Ajalon«, dem, der »dreve Indbyggerne i Gath paa Flugt«. Udtrykket »fødte i Landet« stiller mændene fra Gat op som indfødte, og beretningerne ligner gamle slægtsminder, hvis tid ikke kan fastlægges."
    - "Hvor denne Gat lå, er omstridt. Nogle regner den for den filistæiske Gat (Tell es-Safi); andre, som lægger mærke til forbindelsen med Ajjalon og Bet-Horon i de samme kapitler, leder efter en nærmere by, såsom Gittajim nær Lydda eller Gat-Padalla på Saron-sletten, kendt fra Amarna-brevene og placeret ved Jatt; små steder i Ajjalon-området er også blevet foreslået. Intet knytter nogen af dem til disse vers, og kortets punkt er ét valg blandt flere."
  sr:
    - "Овај Гат појављује се у две кратке белешке у родословима Летописа и није сигурно да је то филистејски град Голијатов. Међу Јефремовим синовима били су Есер и Елеад, „а њих убише људи из Гата, рођени у земљи, јер сиђоше да им узму стоку“; Јефрем је туговао дуго времена и сину који му се потом родио наденуо је име Верија, „јер несрећа задеси дом њихов“. У списку Венијаминовом Верија и Сема, „поглавари домова отачких онима који живљаху у Ејалону“, јесу они за које стоји да „испираше становнике гатске“. Израз „рођени у земљи“ издваја људе из Гата као домороце, а приче изгледају као старе породичне успомене чији се датум не може одредити."
    - "Где је тај Гат био, спорно је. Неки га узимају за филистејски Гат (Тел ес-Сафи); други, примећујући везу са Ајалоном и Вет-Ороном у истим главама, траже ближи град, као Гитајим код Лиде или Гат-Падалу на сароској равници, познату из Амарнских писама и стављену у Јат; предложена су и мала налазишта у подручју Ајалона. Ништа не везује ни једно од њих за ове стихове, а тачка на карти један је избор међу више."
  hu:
    - "Ez a Gát a Krónikák nemzetségtáblázatainak két rövid feljegyzésében szerepel, és nem bizonyos, hogy azonos Góliát filiszteus városával. Efraim fiai között volt Ézer és Eleád: „megölék ezeket a Gáthbeliek, a földnek lakosai; mert alámentek vala, hogy barmaikat elhajtsák”; Efraim sok napig gyászolt, és később született fiát Bériának nevezte, „mivelhogy szerencsétlenség történt az ő házában”. Benjámin jegyzékében Béria és Séma, „fők az Ajalonban lakozó nemzetségek közt”, azok, akik „űzték vala el Gáthnak lakóit”. A gáthiak „a földnek lakosai” megjelölése bennszülöttekként különíti el őket, a történetek pedig régi nemzetségi emlékeknek tűnnek, amelyek kora nem határozható meg."
    - "Hogy hol volt ez a Gát, vitatott. Egyesek a filiszteus Gáttal (Tell es-Szafi) azonosítják; mások, tekintettel az Ajjalonnal és Bét-Hóronnal való kapcsolatra ugyanazokban a fejezetekben, közelebbi várost keresnek, például a Lód melletti Gittajimot vagy a Sáron-síkságon fekvő Gát-Padallát, amelyet az Amarna-levelekből ismerünk, és Jattra helyeznek; az Ajjalon vidékén lévő kis lelőhelyeket is javasolták. Egyik sem kapcsolódik bizonyíthatóan ezekhez a versekhez, és a térkép pontja a több lehetőség közül az egyik választás."
  fi:
    - "Tämä Gat esiintyy kahdessa lyhyessä maininnassa Aikakirjojen sukuluetteloissa, eikä ole varmaa, onko se Goljatin filistealainen kaupunki. Efraimin poikia olivat Eser ja Elead: ”Gatin miehet, siinä maassa syntyneet, tappoivat heidät, koska he olivat lähteneet ottamaan heidän karjaansa”; Efraim suri monta päivää ja antoi myöhemmin syntyneelle pojalle nimen Beria, ”koska se oli tapahtunut hänen perheensä onnettomuuden aikana”. Benjaminin luettelossa Beria ja Sema, ”Aijalonin asukasten perhekunta-päämiehiä”, olivat ne, jotka ”karkoittivat Gatin asukkaat”. Ilmaus ”siinä maassa syntyneet” erottaa Gatin miehet kotoperäisiksi, ja kertomukset näyttävät vanhoilta sukumuistoilta, joiden ajankohtaa ei voi määrittää."
    - "Missä tämä Gat sijaitsi, on kiistanalaista. Jotkut pitävät sitä filistealaisena Gatina (Tell es-Safi); toiset, huomioiden yhteyden Ajaloniin ja Bet-Horoniin samoissa luvuissa, etsivät lähempää kaupunkia, kuten Gittaimia Lodin lähellä tai Amarna-kirjeistä tunnettua Gat-Padallaa Saronin tasangolla, joka sijoitetaan Jattiin; myös pieniä paikkoja Ajalonin alueella on ehdotettu. Mikään ei sido yhtäkään näistä näihin jakeisiin, ja kartan piste on yksi valinta monien joukossa."
  vi:
    - "Gát này xuất hiện trong hai ghi chú ngắn ở các gia phả của sách Sử Ký, và không chắc đó có phải là thành Phi-li-tin của Gô-li-át hay không. Trong số các con trai của Ép-ra-im có Ê-xe và Ê-lê-át, “bị người đất Gát giết, vì có xuống Gát đặng cướp súc vật của họ”; Ép-ra-im than khóc nhiều ngày, và đặt tên một người con trai sinh sau là Bê-ri-a, “vì nhà người đã bị tai họa”. Trong bảng kê của Bên-gia-min, Bê-ri-a và Sê-ma, “hai người làm trưởng tộc của dân cư A-gia-lôn, và đã đuổi dân thành Gát”. Việc người Gát được nói là sinh ra tại xứ ấy cho thấy họ là dân bản địa, và các câu chuyện trông như ký ức cổ của các gia tộc mà niên đại không thể xác định."
    - "Gát này ở đâu còn tranh cãi. Có người cho đó là Gát của người Phi-li-tin (Tell es-Safi); những người khác, lưu ý mối liên hệ với A-gia-lôn và Bết-Hô-rôn trong cùng các chương, tìm một thành gần hơn, như Ghi-tha-im gần Ly-đa hay Gat-padalla trong đồng bằng Sa-rôn, được biết từ các thư Amarna và đặt tại Jatt; những địa điểm nhỏ trong vùng A-gia-lôn cũng được đề nghị. Không gì buộc địa điểm nào với những câu này, và điểm trên bản đồ chỉ là một lựa chọn trong nhiều khả năng."
  ro:
    - "Acest Gat apare în două scurte însemnări din genealogiile Cronicilor și nu este sigur că este cetatea filisteană a lui Goliat. Printre fiii lui Efraim erau Ezer și Elead, pe care „i-au ucis pre ei oamenii din Ghet, cei născuți în pământul acela, pentrucă s’au pogorît, ca să le ia vitele lor”; Efraim i-a plâns multe zile și a numit Beria pe un fiu născut după aceea, „pentrucă întru necazuri s’a născut în casa mea”. În lista lui Beniamin, Beria și Șema, capii familiilor locuitorilor din Aialon, sunt cei care „au gonit pre cei ce lăcuiau în Ghet”. Formula „cei născuți în pământul acela” îi arată pe oamenii din Gat ca băștinași, iar povestirile par amintiri vechi de clan, a căror dată nu poate fi stabilită."
    - "Unde se afla acest Gat este disputat. Unii îl socotesc Gatul filistean (Tell es-Safi); alții, observând legătura cu Aialon și Bet-Horon în aceleași capitole, caută un oraș mai apropiat, precum Ghitaim lângă Lida sau Gat-Padalla din câmpia Șaronului, cunoscut din scrisorile de la Amarna și plasat la Jatt; au fost sugerate și locuri mici din zona Aialonului. Nimic nu leagă vreunul dintre ele de aceste versete, iar punctul de pe hartă este o alegere dintre mai multe."
  bg:
    - "Този Гет се появява в две кратки бележки в родословията на Летописи и не е сигурно, че е филистимският град на Голиат. Сред синовете на Ефрем бяха Езер и Елеад, които „убиха ги Гетските мъже които се родиха в това място, защото слязоха да вземат скотовете им“; Ефрем жалеше много дни и нарече един син, роден по-късно, Берия, „понеже се роди в скръб която се случи в дома му“. В списъка на Вениамин Берия и Шема, „началници на отечествия на живеещите в Еалон“, са тези, които „изпъдиха Гетските жители“. Изразът „които се родиха в това място“ отличава мъжете от Гет като местни, а разказите изглеждат като стари родови спомени, чиято дата не може да се установи."
    - "Къде е бил този Гет, е спорно. Някои го смятат за филистимския Гет (Тел ес-Сафи); други, като отбелязват връзката с Аялон и Бет-Орон в същите глави, търсят по-близък град, например Гитаим близо до Лида или Гат-Падала в Сароновата равнина, известен от писмата от Амарна и поставян в Джат; предлагани са и малки места в района на Аялон. Нищо не свързва което и да е от тях с тези стихове, а точката на картата е един избор сред няколко."
