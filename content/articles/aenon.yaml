body:
  en:
    - "Aenon, from the Semitic word for a spring, was the place “near to Salim” where John the Baptist baptized for a time. Its site is uncertain. Eusebius placed it eight miles south of Scythopolis, Beth-shean, near Salim and the Jordan, and the map follows that tradition with a point in the Jordan valley at Umm el-Amdan. Claude Conder proposed instead the springs of Ainun and the village of Salim in the hills east of Nablus, near the head of the Wadi Far'a. The sixth-century Madaba mosaic map also marks an Ainon “where now is Sapsaphas” on the east bank opposite Bethabara, the place of John's baptism."
    - "John's Gospel sets the scene after Jesus' first Passover in Jerusalem: Jesus and his disciples were baptizing in the land of Judaea, “and John also was baptizing in Ænon near to Salim, because there was much water there”, “for John was not yet cast into prison”. After a dispute about purifying, John's disciples told him that the one “that was with thee beyond Jordan” was now baptizing and all men came to him, and John answered, “He must increase, but I must decrease”. The words “beyond Jordan” suggest that Aenon itself lay west of the river."
  ru:
    - "Енон, от семитского слова «источник», — место «близ Салима», где некоторое время крестил Иоанн Креститель. Где оно было, неизвестно. Евсевий помещал его в восьми милях к югу от Скифополя, Беф-Сана, близ Салима и Иордана, и карта следует этому преданию, ставя точку в долине Иордана у Умм-эль-Амдана. Клод Кондер предлагал другое место — источники Айнун и село Салим в горах к востоку от Наблуса, у верховьев Вади-Фара. Мадабская мозаичная карта VI в. отмечает ещё один Енон, «где ныне Сапсафас», на восточном берегу напротив Вифавары, места крещения Иоанна."
    - "Евангелие от Иоанна относит этот эпизод ко времени после первой Пасхи Иисуса в Иерусалиме: Иисус с учениками крестил в земле Иудейской, «а Иоанн также крестил в Еноне, близ Салима, потому что там было много воды», «ибо Иоанн еще не был заключен в темницу». После спора об очищении ученики Иоанна сказали ему, что Тот, «Который был с тобою при Иордане», теперь крестит и все идут к Нему, и Иоанн ответил: «Ему должно расти, а мне умаляться». Греческий текст говорит здесь «за Иорданом», и это указывает, что сам Енон лежал к западу от реки."
  uk:
    - "Енон, від семітського слова «джерело», був місцем «поблизу Салима», де якийсь час хрестив Іван Христитель. Його місцезнаходження невідоме. Євсевій розміщував його за вісім миль на південь від Скіфополя, Бет-Шеана, поблизу Салима й Йордану, і мапа дотримується цієї традиції, ставлячи точку в долині Йордану в Умм-ель-Амдані. Клод Кондер натомість запропонував джерела Айнун і село Салім у горах на схід від Наблуса, біля верхів'я вади Фараа. Мадабська мозаїчна мапа VI ст. також позначає Айнон, «де нині Сапсафас», на східному березі навпроти Віфавари, місця хрещення Івана."
    - "Євангелія від Івана розміщує сцену після першої Пасхи Ісуса в Єрусалимі: Ісус і Його учні хрестили в юдейській землі, «хрестив же й Йоан у Єнонї поблизу Салима, бо води було там багато», «ще бо не вкинуто в темницю Йоана». Після суперечки про очищення учні Івана сказали йому, що той, «що був з тобою за Йорданом», тепер хрестить і всі йдуть до Нього, а Іван відповів: «Той мусить рости, я ж малїти». Слова «за Йорданом» наводять на думку, що сам Енон лежав на захід від річки."
  es:
    - "Enón, de la palabra semítica que designa un manantial, era el lugar «junto á Salim» donde Juan el Bautista bautizó durante un tiempo. Su emplazamiento es incierto. Eusebio lo situó a ocho millas al sur de Escitópolis, Bet-seán, cerca de Salim y del Jordán, y el mapa sigue esa tradición con un punto en el valle del Jordán, en Umm el-Amdan. Claude Conder propuso en cambio las fuentes de Ainun y la aldea de Salim en las colinas al este de Nablus, cerca de la cabecera del Wadi Far'a. El mapa mosaico de Madaba, del siglo VI, marca también un Ainón «donde ahora está Sapsafas» en la orilla oriental, frente a Betábara, el lugar del bautismo de Juan."
    - "El Evangelio de Juan sitúa la escena después de la primera Pascua de Jesús en Jerusalén: Jesús y sus discípulos bautizaban en la tierra de Judea, «y bautizaba también Juan en Enón junto á Salim, porque había allí muchas aguas», «porque Juan no había sido aún puesto en la carcel». Tras una discusión sobre la purificación, los discípulos de Juan le dijeron que «el que estaba contigo de la otra parte del Jordán» bautizaba ahora y todos iban a él, y Juan respondió: «A él conviene crecer, mas á mí menguar». Las palabras «de la otra parte del Jordán» sugieren que la propia Enón estaba al oeste del río."
  pt:
    - "Enom, de um termo semítico que significa nascente, foi o lugar “perto de Salim” onde João Batista batizou durante algum tempo. Sua localização é incerta. Eusébio a situou a oito milhas ao sul de Citópolis, Bete-Seã, perto de Salim e do Jordão, e o mapa segue essa tradição com um ponto no vale do Jordão em Umm el-Amdan. Claude Conder propôs, em vez disso, as nascentes de Ainun e a aldeia de Salim nas colinas a leste de Nablus, perto da cabeceira do uádi Far'a. O mapa de Madaba, do século VI, marca também um Ainon “onde agora está Sapsafas”, na margem leste, defronte de Betábara, o lugar do batismo de João."
    - "O Evangelho de João situa a cena depois da primeira Páscoa de Jesus em Jerusalém: Jesus e seus discípulos batizavam na terra da Judeia, “e João também estava batizando em Enom, perto de Salim, porque havia muita água ali”, “pois João ainda não tinha sido lançado na prisão”. Depois de uma discussão sobre a purificação, os discípulos de João lhe disseram que aquele “que estava com o senhor do outro lado do Jordão” agora batizava e todos iam até ele, e João respondeu: “É necessário que ele cresça e que eu diminua”. As palavras “do outro lado do Jordão” sugerem que a própria Enom ficava a oeste do rio."
  de:
    - "Änon, vom semitischen Wort für eine Quelle, war der Ort „nahe bei Salim“, wo Johannes der Täufer eine Zeit lang taufte. Seine Lage ist ungewiss. Eusebius setzte ihn acht Meilen südlich von Skythopolis, Bet-Schean, nahe bei Salim und dem Jordan an, und die Karte folgt dieser Überlieferung mit einem Punkt im Jordantal bei Umm el-Amdan. Claude Conder schlug stattdessen die Quellen von Ainun und das Dorf Salim in den Bergen östlich von Nablus nahe dem Beginn des Wadi Fara vor. Auch die Mosaikkarte von Madaba aus dem sechsten Jahrhundert verzeichnet ein Ainon, „wo jetzt Sapsaphas ist“, am Ostufer gegenüber von Bethabara, dem Ort der Taufe des Johannes."
    - "Das Johannesevangelium setzt die Szene nach dem ersten Passa Jesu in Jerusalem an: Jesus und seine Jünger kamen „in das jüdische Land“ und tauften dort, „Johannes aber taufte auch noch zu Enon, nahe bei Salim, denn es war viel Wasser daselbst“, „denn Johannes war noch nicht ins Gefängnis gelegt“. Nach einem Streit über die Reinigung sagten die Jünger des Johannes ihm, der, „der bei dir war jenseit des Jordans“, taufe nun und jedermann komme zu ihm, und Johannes antwortete: „Er muß wachsen, ich aber muß abnehmen.“ Die Worte „jenseit des Jordans“ lassen vermuten, dass Änon selbst westlich des Flusses lag."
  fr:
    - "Énon, du mot sémitique pour une source, était le lieu « près de Salim » où Jean-Baptiste baptisa un temps. Son site est incertain. Eusèbe le plaçait à huit milles au sud de Scythopolis, Beth-Schean, près de Salim et du Jourdain, et la carte suit cette tradition avec un point dans la vallée du Jourdain, à Umm el-Amdan. Claude Conder proposa plutôt les sources d’Aïnoun et le village de Salim, dans les collines à l’est de Naplouse, près de la tête de l’ouadi Far’a. La carte-mosaïque de Madaba, du VIe siècle, marque aussi un Ainon « où est maintenant Sapsaphas » sur la rive orientale, en face de Béthabara, lieu du baptême de Jean."
    - "L’Évangile de Jean situe la scène après la première Pâque de Jésus à Jérusalem : Jésus et ses disciples baptisaient dans le pays de Judée, et « Jean aussi baptisait à Énon, près de Salim, parce qu’il y avait là beaucoup d’eau », « car Jean n’avait pas encore été mis en prison ». Après une dispute sur la purification, les disciples de Jean lui dirent que « celui qui était avec toi au-delà du Jourdain » baptisait maintenant et que tous allaient à lui, et Jean répondit : « Il faut qu’il croisse, et que je diminue. » Les mots « au-delà du Jourdain » suggèrent qu’Énon elle-même se trouvait à l’ouest du fleuve."
  it:
    - "Enon, dalla parola semitica per «sorgente», era il luogo «presso Salim» dove Giovanni Battista battezzò per un certo tempo. Il suo sito è incerto. Eusebio lo collocava a otto miglia a sud di Scitopoli, Beth-Shean, vicino a Salim e al Giordano, e la carta segue questa tradizione con un punto nella valle del Giordano a Umm el-Amdan. Claude Conder propose invece le sorgenti di Ainun e il villaggio di Salim sulle colline a est di Nablus, presso la testata del Wadi Far’a. Anche la mappa musiva di Madaba, del VI secolo, segna un Ainon «dove ora è Sapsafas» sulla riva orientale di fronte a Betabara, il luogo del battesimo di Giovanni."
    - "Il Vangelo di Giovanni colloca la scena dopo la prima Pasqua di Gesù a Gerusalemme: Gesù e i suoi discepoli battezzavano nella campagna della Giudea, e «anche Giovanni stava battezzando a Enon, presso Salim, perché c’era là molt’acqua», «poiché Giovanni non era ancora stato messo in prigione». Dopo una discussione sulla purificazione, i discepoli di Giovanni gli riferirono che colui «che era con te di là dal Giordano» ora battezzava e tutti andavano a lui, e Giovanni rispose: «Bisogna che egli cresca, e che io diminuisca». Le parole «di là dal Giordano» suggeriscono che Enon stessa si trovasse a ovest del fiume."
  nl:
    - "Enon, van het Semitische woord voor een bron, was de plaats “bij Salim” waar Johannes de Doper een tijd lang doopte. De ligging is onzeker. Eusebius plaatste het acht mijl ten zuiden van Scythopolis, Beth-Sean, bij Salim en de Jordaan, en de kaart volgt die overlevering met een punt in de Jordaanvallei bij Umm el-Amdan. Claude Conder stelde in plaats daarvan de bronnen van Ainun en het dorp Salim voor in de heuvels ten oosten van Nablus, bij de bovenloop van de Wadi Far'a. De zesde-eeuwse mozaïekkaart van Madaba markeert ook een Ainon “waar nu Sapsafas is” op de oostelijke oever tegenover Bethabara, de plaats van Johannes' doop."
    - "Het Johannesevangelie plaatst het tafereel na het eerste paasfeest van Jezus in Jeruzalem: Jezus en zijn discipelen doopten in het land van Judea, “en Johannes doopte ook in Enon bij Salim, dewijl aldaar vele wateren waren”, “want Johannes was nog niet in de gevangenis geworpen”. Na een twist over de reiniging zeiden Johannes' discipelen tot hem dat Hij “Die met u was over de Jordaan” nu doopte en allen tot Hem kwamen, en Johannes antwoordde: “Hij moet wassen, maar ik minder worden.” De woorden “over de Jordaan” wijzen erop dat Enon zelf ten westen van de rivier lag."
  pl:
    - "Ainon, od semickiego słowa oznaczającego źródło, było miejscem „blisko Salim”, gdzie przez pewien czas chrzcił Jan Chrzciciel. Jego położenie jest niepewne. Euzebiusz umieścił je osiem mil na południe od Scytopolis, czyli Bet-Szean, w pobliżu Salim i Jordanu, a mapa idzie za tą tradycją, wskazując punkt w dolinie Jordanu w Umm el-Amdan. Claude Conder zaproponował natomiast źródła Ajnun i wieś Salim we wzgórzach na wschód od Nablusu, u wylotu Wadi Far'a. Mapa mozaikowa z Madaby z VI wieku oznacza także Ainon, „gdzie teraz jest Sapsafas”, na wschodnim brzegu naprzeciw Betabary, miejsca chrztu Janowego."
    - "Ewangelia Jana umieszcza tę scenę po pierwszej Wielkanocy Jezusa w Jerozolimie: Jezus i jego uczniowie chrzcili w ziemi judzkiej, „chrzcił też i Jan w Enon, blisko Salim; bo tam było wiele wód”, „bo jeszcze Jan nie był podany do więzienia”. Po sporze o oczyszczanie uczniowie Jana powiedzieli mu, że ten, „który był z tobą za Jordanem”, teraz chrzci, a wszyscy idą do niego; Jan odpowiedział: „On musi rość, a mnie musi ubywać”. Słowa „za Jordanem” sugerują, że samo Ainon leżało na zachód od rzeki."
  cs:
    - "Ainón, podle semitského slova pro pramen, bylo místo „blízko Sálim“, kde Jan Křtitel nějaký čas křtil. Jeho poloha je nejistá. Eusebius je umístil osm mil jižně od Skythopole, Bét-šeanu, poblíž Sálimu a Jordánu a mapa sleduje tuto tradici bodem v Jordánském údolí u Umm el-Amdan. Claude Conder navrhl místo toho prameny Ajnún a vesnici Salim v kopcích východně od Nábulusu, poblíž horního toku Wádí Far'a. Také madabská mozaiková mapa ze šestého století značí Ainón, „kde je nyní Sapsafas“, na východním břehu naproti Betabaře, místu Janova křtu."
    - "Janovo evangelium klade výjev po prvním Ježíšově velikonočním svátku v Jeruzalémě: Ježíš a jeho učedníci křtili v zemi Judské, „a Jan také křtil v Enon, blízko Sálim, nebo byly tam vody mnohé“, „nebo ještě Jan nebyl vsazen do žaláře“. Po sporu o očišťování řekli Janovi jeho učedníci, že ten, „kterýž byl s tebou za Jordánem“, nyní křtí a všichni jdou k němu, a Jan odpověděl: „Onť musí růsti, já pak menšiti se.“ Slova „za Jordánem“ naznačují, že Ainón samo leželo západně od řeky."
  sv:
    - "Ainon, av det semitiska ordet för källa, var platsen ”nära Salim” där Johannes döparen döpte en tid. Dess läge är osäkert. Eusebios förlade den åtta romerska mil söder om Skytopolis, Bet-Shean, nära Salim och Jordan, och kartan följer den traditionen med en punkt i Jordandalen vid Umm el-Amdan. Claude Conder föreslog i stället källorna vid Ainun och byn Salim i bergen öster om Nablus, nära övre delen av Wadi Far'a. Madabamosaikkartan från 500-talet markerar också ett Ainon ”där nu är Sapsafas” på östra stranden mitt emot Betabara, platsen för Johannes’ dop."
    - "Johannesevangeliet placerar scenen efter Jesu första påsk i Jerusalem: Jesus och hans lärjungar döpte i Judeen, och ”också Johannes döpte, i Enon, nära Salim, ty där fanns mycket vatten”, ty ”Johannes hade nämligen ännu icke blivit kastad i fängelse”. Efter en tvist om reningen sade Johannes’ lärjungar till honom att den ”som var hos dig på andra sidan Jordan” nu döpte och att alla kom till honom, och Johannes svarade: ”Det är såsom sig bör att han växer till, och att jag förminskas.” Orden ”på andra sidan Jordan” tyder på att Ainon självt låg väster om floden."
  nb:
    - "Ainon, fra det semittiske ordet for en kilde, var stedet «nær ved Salim» der døperen Johannes en tid døpte. Beliggenheten er usikker. Eusebius plasserte det åtte romerske mil sør for Skytopolis, Bet-Sjan, nær Salim og Jordan, og kartet følger den tradisjonen med et punkt i Jordandalen ved Umm el-Amdan. Claude Conder foreslo i stedet kildene ved Ainun og landsbyen Salim i åsene øst for Nablus, nær øvre ende av Wadi Far'a. Madaba-mosaikkens kart fra 500-tallet markerer også et Ainon «hvor Sapsaphas nå er» på østbredden midt imot Betabara, stedet for Johannes' dåp."
    - "Johannesevangeliet setter scenen etter Jesu første påske i Jerusalem: Jesus og disiplene hans døpte i Judea, og «Johannes døpte, i Ænon, nær ved Salim, fordi det var meget vann der», «for Johannes var enda ikke kastet i fengsel». Etter en strid om renselsen sa Johannes' disipler til ham at han «som var hos dig på hin side Jordan» nå døpte og at alle kom til ham, og Johannes svarte: «Han skal vokse, jeg skal avta.» Ordene «på hin side Jordan» antyder at Ainon selv lå vest for elven."
