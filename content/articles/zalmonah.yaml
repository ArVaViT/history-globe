# Overview article (ADR 0007). Mainstream facts only; Zalmonah is known only from the itinerary, and the candidate sites are named without a choice.
id: zalmonah
place: a1c6a50
title:
  en: "Zalmonah"
  ru: "Салмон"
  uk: "Салмона"
  es: "Salmona"
  pt: "Zalmona"
  de: "Zalmona"
  fr: "Tsalmona"
body:
  en:
    - "Zalmonah is a camp of Israel on the way from Mount Hor towards Moab, known only from the list of stations in Numbers 33: “And they departed from mount Hor, and pitched in Zalmonah. And they departed from Zalmonah, and pitched in Punon.” No story is told of it. Since Punon is almost certainly Feinan, the copper-mining centre on the eastern side of the Arabah, Zalmonah should lie somewhere between Mount Hor and Feinan, in or beside the Arabah south of the Dead Sea; where exactly depends in part on where Mount Hor itself is placed, which is also disputed."
    - "Several spots have been suggested on the strength of the name, which may mean “shady” or “dark”: Wadi es-Salmaneh, where the map draws it, a ruin called Rujm Talat az-Zalma on the Jordanian side, Bir Madhkur on the road from the Arabah to Petra, and Wadi Umran farther south. None has produced remains that can be tied to the Israelite journey, and Zalmonah remains no more than a name in the itinerary."
  ru:
    - "Салмон — стан Израиля на пути от горы Ор к Моаву, известный только по списку стоянок в 33-й главе Чисел: «И отправились они от горы Ор и расположились станом в Салмоне. И отправились из Салмона и расположились станом в Пуноне». Никакого рассказа о нём нет. Поскольку Пунон почти наверняка — Фейнан, центр добычи меди на восточной стороне Аравы, Салмон должен лежать где-то между горой Ор и Фейнаном, в Араве или рядом с ней к югу от Мёртвого моря; где именно, зависит отчасти от того, где искать саму гору Ор, а это тоже спорно."
    - "По созвучию с именем, которое может значить «тенистый» или «тёмный», предлагали несколько мест: Вади эс-Сальмане, где его рисует карта, развалины Руджм-Талат-аз-Залма на иорданской стороне, Бир-Мазкур на дороге из Аравы к Петре и Вади Умран южнее. Ни одно не дало находок, которые можно связать с путём Израиля, и Салмон остаётся лишь именем в перечне стоянок."
  uk:
    - "Салмона — табір Ізраїлю на шляху від гори Гор до Моаву, відомий лише з переліку стоянок у Числах 33: «І рушили вони від Гор гори та й отаборились у Залмонї. І рушили із Залмони та й отаборились у Пупонї». Жодної розповіді про неї немає. Оскільки Пунон майже напевно є Фейнаном, центром видобутку міді на східному боці Арави, Салмона має лежати десь між горою Гор і Фейнаном, в Араві або поряд із нею на південь від Мертвого моря; де саме, почасти залежить від того, де ставити саму гору Гор, що теж оспорюється."
    - "Кілька місць запропоновано на підставі назви, яка може означати «тінистий» або «темний»: Вади-ес-Сальмане, де її позначає мапа, руїна на ім’я Руджм-Талат-аз-Зальма на йорданському боці, Бір-Мадхкур на дорозі з Арави до Петри і Вади-Умран далі на південь. Жодне не дало решток, які можна було б пов’язати з ізраїльською мандрівкою, і Салмона лишається не більше ніж назвою в переліку."
  es:
    - "Salmona es un campamento de Israel en el camino del monte Hor hacia Moab, conocido solo por la lista de estaciones de Números 33: «Y partidos del monte de Hor, asentaron en Salmona. Y partidos de Salmona, asentaron en Phunón». No se cuenta ninguna historia de él. Como Funón es casi con certeza Feinan, el centro minero de cobre del lado oriental del Arabá, Salmona debería hallarse en algún lugar entre el monte Hor y Feinan, en el Arabá al sur del mar Muerto o junto a él; dónde exactamente depende en parte de dónde se sitúe el propio monte Hor, que también se discute."
    - "Se han sugerido varios lugares por el nombre, que puede significar «sombrío» u «oscuro»: el Wadi es-Salmaneh, donde lo traza el mapa, una ruina llamada Rujm Talat az-Zalma en el lado jordano, Bir Madhkur en el camino del Arabá a Petra, y el Wadi Umran, más al sur. Ninguno ha dado restos que puedan vincularse con el viaje israelita, y Salmona sigue siendo no más que un nombre en el itinerario."
  pt:
    - "Zalmona é um acampamento de Israel no caminho do monte Hor para Moabe, conhecido apenas pela lista de estações de Números 33: “Partiram do monte Hor e acamparam em Salmona. Partiram de Salmona e acamparam em Punom.” Nenhuma história é contada sobre ela. Como Punom é quase certamente Feinan, o centro de mineração de cobre no lado oriental da Arabá, Zalmona deve ficar em algum ponto entre o monte Hor e Feinan, na Arabá ao sul do Mar Morto ou junto a ela; onde exatamente depende em parte de onde se coloca o próprio monte Hor, também discutido."
    - "Vários pontos foram sugeridos com base no nome, que pode significar “sombrio” ou “escuro”: o Wadi es-Salmaneh, onde o mapa a traça, uma ruína chamada Rujm Talat az-Zalma, do lado jordaniano, Bir Madhkur, na estrada da Arabá para Petra, e o Wadi Umran, mais ao sul. Nenhum deu vestígios que possam ser ligados à jornada israelita, e Zalmona continua sendo apenas um nome no itinerário."
  de:
    - "Zalmona ist ein Lager Israels auf dem Weg vom Berg Hor Richtung Moab, nur aus der Stationenliste in Numeri 33 bekannt: „Und von dem Berge Hor zogen sie aus und lagerten sich in Zalmona. Von Zalmona zogen sie aus und lagerten sich in Phunon.“ Keine Geschichte wird davon erzählt. Da Punon fast sicher Feinan ist, das Kupferbergbauzentrum auf der Ostseite der Araba, muss Zalmona irgendwo zwischen dem Berg Hor und Feinan liegen, in oder neben der Araba südlich des Toten Meeres; wo genau, hängt zum Teil davon ab, wo der Berg Hor selbst angesetzt wird, was ebenfalls umstritten ist."
    - "Mehrere Stellen sind auf Grund des Namens vorgeschlagen worden, der „schattig“ oder „dunkel“ bedeuten mag: das Wadi es-Salmaneh, wo die Karte es einzeichnet, eine Ruine namens Rujm Talat az-Zalma auf der jordanischen Seite, Bir Madhkur an der Straße von der Araba nach Petra und das Wadi Umran weiter südlich. Keiner hat Überreste erbracht, die mit der israelitischen Wanderung verbunden werden könnten, und Zalmona bleibt nicht mehr als ein Name in der Stationenliste."
  fr:
    - "Tsalmona est un campement d’Israël sur la route du mont Hor vers Moab, connu seulement par la liste des étapes de Nombres 33 : « Ils partirent de la montagne de Hor, et campèrent à Tsalmona. Ils partirent de Tsalmona, et campèrent à Punon. » Aucun récit n’en est fait. Comme Punon est presque certainement Feinan, le centre minier de cuivre du côté oriental de l’Araba, Tsalmona doit se trouver entre le mont Hor et Feinan, dans l’Araba au sud de la mer Morte ou à côté ; l’endroit exact dépend en partie de la place du mont Hor lui-même, lui aussi discuté."
    - "Plusieurs lieux ont été suggérés d’après le nom, qui peut signifier « ombragé » ou « sombre » : le Wadi es-Salmaneh, où la carte le dessine, une ruine appelée Rujm Talat az-Zalma du côté jordanien, Bir Madhkur sur la route de l’Araba à Pétra, et le Wadi Umran plus au sud. Aucun n’a livré de vestiges qu’on puisse rattacher au voyage israélite, et Tsalmona reste un simple nom dans l’itinéraire."
