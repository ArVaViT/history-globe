body:
  en:
    - "Zalmonah is a camp of Israel on the way from Mount Hor towards Moab, known only from the list of stations in Numbers 33: “And they departed from mount Hor, and pitched in Zalmonah. And they departed from Zalmonah, and pitched in Punon.” No story is told of it. Since Punon is almost certainly Feinan, the copper-mining centre on the eastern side of the Arabah, Zalmonah should lie somewhere between Mount Hor and Feinan, in or beside the Arabah south of the Dead Sea; where exactly depends in part on where Mount Hor itself is placed, which is also disputed."
    - "Several spots have been suggested on the strength of the name, which may mean “shady” or “dark”: Wadi es-Salmaneh, where the map draws it, a ruin called Rujm Talat az-Zalma on the Jordanian side, Bir Madhkur on the road from the Arabah to Petra, and Wadi Umran farther south. None has produced remains that can be tied to the Israelite journey, and Zalmonah remains no more than a name in the itinerary."
  ru:
    - "Салмон — стан Израиля на пути от горы Ор к Моаву, известный только по списку стоянок в 33-й главе Чисел: «И отправились они от горы Ор и расположились станом в Салмоне. И отправились из Салмона и расположились станом в Пуноне». Никакого рассказа о нём нет. Поскольку Пунон почти наверняка — Фейнан, центр добычи меди на восточной стороне Аравы, Салмон должен лежать где-то между горой Ор и Фейнаном, в Араве или рядом с ней к югу от Мёртвого моря; где именно, зависит отчасти от того, где искать саму гору Ор, а это тоже спорно."
    - "По созвучию с именем, которое может значить «тенистый» или «тёмный», предлагали несколько мест: Вади эс-Сальмане, где его рисует карта, развалины Руджм-Талат-аз-Залма на иорданской стороне, Бир-Мазкур на дороге из Аравы к Петре и Вади Умран южнее. Ни одно не дало находок, которые можно связать с путём Израиля, и Салмон остаётся лишь именем в перечне стоянок."
  uk:
    - "Салмона — табір Ізраїлю на шляху від гори Гор до Моаву, відомий лише з переліку стоянок у Числах 33: «І рушили вони від Гор гори та й отаборились у Залмонї. І рушили із Залмони та й отаборились у Пупонї». Жодної розповіді про неї немає. Оскільки Пунон майже напевно є Фейнаном, центром видобутку міді на східному боці Арави, Салмона має лежати десь між горою Гор і Фейнаном, в Араві або поряд із нею на південь від Мертвого моря; де саме, почасти залежить від того, де ставити саму гору Гор, що теж оспорюється."
    - "Кілька місць запропоновано на підставі назви, яка може означати «тінистий» або «темний»: Вади-ес-Сальмане, де її позначає мапа, руїна на ім’я Руджм-Талат-аз-Зальма на йорданському боці, Бір-Мадхкур на дорозі з Арави до Петри і Вади-Умран далі на південь. Жодне не дало решток, які можна було б пов’язати з ізраїльською мандрівкою, і Салмона лишається не більше ніж назвою в переліку."
  es:
    - "Salmona es un campamento de Israel en el camino del monte Hor hacia Moab, conocido solo por la lista de estaciones de Números 33: «Y partidos del monte de Hor, asentaron en Salmona. Y partidos de Salmona, asentaron en Phunón». No se cuenta ninguna historia de él. Como Funón es casi con certeza Feinan, el centro minero de cobre del lado oriental del Arabá, Salmona debería hallarse en algún lugar entre el monte Hor y Feinan, en el Arabá al sur del mar Muerto o junto a él; dónde exactamente depende en parte de dónde se sitúe el propio monte Hor, que también se discute."
    - "Se han sugerido varios lugares por el nombre, que puede significar «sombrío» u «oscuro»: el Wadi es-Salmaneh, donde lo traza el mapa, una ruina llamada Rujm Talat az-Zalma en el lado jordano, Bir Madhkur en el camino del Arabá a Petra, y el Wadi Umran, más al sur. Ninguno ha dado restos que puedan vincularse con el viaje israelita, y Salmona sigue siendo no más que un nombre en el itinerario."
  pt:
    - "Zalmona é um acampamento de Israel no caminho do monte Hor para Moabe, conhecido apenas pela lista de estações de Números 33: “Partiram do monte Hor e acamparam em Salmona. Partiram de Salmona e acamparam em Punom.” Nenhuma história é contada sobre ela. Como Punom é quase certamente Feinan, o centro de mineração de cobre no lado oriental da Arabá, Zalmona deve ficar em algum ponto entre o monte Hor e Feinan, na Arabá ao sul do Mar Morto ou junto a ela; onde exatamente depende em parte de onde se coloca o próprio monte Hor, também discutido."
    - "Vários pontos foram sugeridos com base no nome, que pode significar “sombrio” ou “escuro”: o Wadi es-Salmaneh, onde o mapa a traça, uma ruína chamada Rujm Talat az-Zalma, do lado jordaniano, Bir Madhkur, na estrada da Arabá para Petra, e o Wadi Umran, mais ao sul. Nenhum deu vestígios que possam ser ligados à jornada israelita, e Zalmona continua sendo apenas um nome no itinerário."
  de:
    - "Zalmona ist ein Lager Israels auf dem Weg vom Berg Hor Richtung Moab, nur aus der Stationenliste in Numeri 33 bekannt: „Und von dem Berge Hor zogen sie aus und lagerten sich in Zalmona. Von Zalmona zogen sie aus und lagerten sich in Phunon.“ Keine Geschichte wird davon erzählt. Da Punon fast sicher Feinan ist, das Kupferbergbauzentrum auf der Ostseite der Araba, muss Zalmona irgendwo zwischen dem Berg Hor und Feinan liegen, in oder neben der Araba südlich des Toten Meeres; wo genau, hängt zum Teil davon ab, wo der Berg Hor selbst angesetzt wird, was ebenfalls umstritten ist."
    - "Mehrere Stellen sind auf Grund des Namens vorgeschlagen worden, der „schattig“ oder „dunkel“ bedeuten mag: das Wadi es-Salmaneh, wo die Karte es einzeichnet, eine Ruine namens Rujm Talat az-Zalma auf der jordanischen Seite, Bir Madhkur an der Straße von der Araba nach Petra und das Wadi Umran weiter südlich. Keiner hat Überreste erbracht, die mit der israelitischen Wanderung verbunden werden könnten, und Zalmona bleibt nicht mehr als ein Name in der Stationenliste."
  fr:
    - "Tsalmona est un campement d’Israël sur la route du mont Hor vers Moab, connu seulement par la liste des étapes de Nombres 33 : « Ils partirent de la montagne de Hor, et campèrent à Tsalmona. Ils partirent de Tsalmona, et campèrent à Punon. » Aucun récit n’en est fait. Comme Punon est presque certainement Feinan, le centre minier de cuivre du côté oriental de l’Araba, Tsalmona doit se trouver entre le mont Hor et Feinan, dans l’Araba au sud de la mer Morte ou à côté ; l’endroit exact dépend en partie de la place du mont Hor lui-même, lui aussi discuté."
    - "Plusieurs lieux ont été suggérés d’après le nom, qui peut signifier « ombragé » ou « sombre » : le Wadi es-Salmaneh, où la carte le dessine, une ruine appelée Rujm Talat az-Zalma du côté jordanien, Bir Madhkur sur la route de l’Araba à Pétra, et le Wadi Umran plus au sud. Aucun n’a livré de vestiges qu’on puisse rattacher au voyage israélite, et Tsalmona reste un simple nom dans l’itinéraire."
  pl:
    - "Salmona jest obozem Izraela w drodze z Góry Hor ku Moabowi, znanym tylko z wykazu stacji w Lb 33: „A ruszywszy się z góry Hor, położyli się obozem w Salmona. A ruszywszy się z Salmona, położyli się obozem w Funon.” Nie opowiada się o niej żadnej historii. Ponieważ Punon to prawie na pewno Fejnan, ośrodek wydobycia miedzi po wschodniej stronie Araby, Salmona powinna leżeć gdzieś między Górą Hor a Fejnan, w Arabie lub obok niej na południe od Morza Martwego; gdzie dokładnie, zależy częściowo od tego, gdzie umieszcza się samą Górę Hor, co też jest sporne."
    - "Kilka miejsc zaproponowano na podstawie nazwy, która może znaczyć „cienista” lub „ciemna”: Wadi es-Salmane, gdzie rysuje ją mapa, ruinę zwaną Rujm Talat az-Zalma po stronie jordańskiej, Bir Madkur przy drodze z Araby do Petry i Wadi Umran dalej na południe. Żadne nie dało pozostałości, które można by powiązać z wędrówką Izraelitów, a Salmona pozostaje tylko nazwą w wykazie stacji."
  it:
    - "Salmona è un accampamento d’Israele sulla via dal Monte Or verso Moab, noto solo dall’elenco delle tappe di Numeri 33: «E quelli partirono dal monte Hor e si accamparono a Tsalmona. Partirono da Tsalmona e si accamparono a Punon». Di essa non si racconta alcuna storia. Poiché Punon è quasi certamente Feinan, il centro di estrazione del rame sul lato orientale dell’Araba, Salmona dovrebbe trovarsi fra il Monte Or e Feinan, nell’Araba a sud del Mar Morto o accanto ad essa; dove esattamente dipende in parte da dove si pone il Monte Or stesso, anch’esso discusso."
    - "Parecchi luoghi sono stati suggeriti in base al nome, che può significare «ombroso» o «oscuro»: il Wadi es-Salmaneh, dove la mappa la disegna, una rovina chiamata Rujm Talat az-Zalma sul lato giordano, Bir Madhkur sulla strada dall’Araba a Petra, e il Wadi Umran più a sud. Nessuno ha dato resti collegabili al viaggio degli Israeliti, e Salmona resta niente più che un nome nell’itinerario."
  nl:
    - "Salmona is een kamp van Israël op weg van de berg Hor naar Moab, alleen bekend uit de lijst van stations in Numeri 33: “En zij verreisden van den berg Hor, en legerden zich in Zalmona. En zij verreisden van Zalmona, en legerden zich in Funon.” Er wordt geen verhaal van verteld. Omdat Punon vrijwel zeker Feinan is, het kopermijncentrum aan de oostzijde van de Araba, moet Salmona ergens tussen de berg Hor en Feinan liggen, in of naast de Araba ten zuiden van de Dode Zee; waar precies hangt deels af van waar de berg Hor zelf wordt geplaatst, wat ook wordt betwist."
    - "Op grond van de naam, die “schaduwrijk” of “donker” kan betekenen, zijn verscheidene plekken voorgesteld: Wadi es-Salmaneh, waar de kaart het tekent, een ruïne genaamd Rujm Talat az-Zalma aan Jordaanse zijde, Bir Madhkur aan de weg van de Araba naar Petra, en Wadi Umran verder naar het zuiden. Geen heeft resten opgeleverd die met de Israëlitische tocht in verband kunnen worden gebracht, en Salmona blijft niet meer dan een naam in de reisroute."
  cs:
    - "Calmóna je izraelské tábořiště na cestě od hory Hor k Moábu, známé jen ze seznamu stanic v Numeri 33: „Tedy hnuvše se s hory Hor, položili se v Salmona. A hnuvše se z Salmona, položili se v Funon.“ Nevypráví se o něm žádný příběh. Protože Punon je téměř jistě Fénán, středisko těžby mědi na východní straně Araby, měla by Calmóna ležet někde mezi horou Hor a Fénánem, v Arabě jižně od Mrtvého moře nebo u ní; kde přesně, závisí zčásti na tom, kam je kladena samotná hora Hor, což je také sporné."
    - "Podle jména, které může znamenat „stinný“ nebo „temný“, bylo navrženo několik míst: Wádí es-Salmána, kde je mapa kreslí, zřícenina zvaná Rudžm Talát az-Zalma na jordánské straně, Bír Madhkúr na silnici z Araby do Petry a Wádí Umrán dále na jih. Žádné z nich nepřineslo pozůstatky, které by bylo možno spojit s izraelskou cestou, a Calmóna zůstává pouhým jménem v itineráři."
  sv:
    - "Salmona är ett läger för Israel på vägen från berget Hor mot Moab, känt endast från stationsförteckningen i 4 Mos 33: ”Och de bröto upp från berget Hor och lägrade sig i Salmona. Och de bröto upp från Salmona och lägrade sig i Punon.” Ingen berättelse berättas om det. Eftersom Punon nästan säkert är Feinan, kopparbrytningscentret på östra sidan av Arava, bör Salmona ligga någonstans mellan berget Hor och Feinan, i eller bredvid Arava söder om Döda havet; var exakt beror delvis på var själva berget Hor placeras, vilket också är omstritt."
    - "Flera platser har föreslagits på grundval av namnet, som kan betyda ”skuggig” eller ”mörk”: Wadi es-Salmaneh, där kartan placerar det, en ruin kallad Rujm Talat az-Zalma på den jordanska sidan, Bir Madhkur på vägen från Arava till Petra, och Wadi Umran längre söderut. Ingen har gett lämningar som kan knytas till israeliternas vandring, och Salmona förblir inte mer än ett namn i färdvägen."
  nb:
    - "Salmona er en av Israels leirer på veien fra Hor-fjellet mot Moab, kjent bare fra stasjonslisten i Fjerde Mosebok 33: «Så drog de fra fjellet Hor og leiret sig i Salmona», og «de drog fra Salmona og leiret sig i Punon». Ingen fortelling knytter seg til den. Siden Punon nesten sikkert er Feinan, kobbergruvesenteret på østsiden av Arava, bør Salmona ligge et sted mellom Hor-fjellet og Feinan, i eller ved Arava sør for Dødehavet; nøyaktig hvor, avhenger delvis av hvor selve Hor-fjellet plasseres, noe som også er omstridt."
    - "Flere steder er foreslått ut fra navnet, som kan bety «skyggefull» eller «mørk»: Wadi es-Salmaneh, der kartet tegner den, en ruin kalt Rujm Talat az-Zalma på jordansk side, Bir Madhkur på veien fra Arava til Petra, og Wadi Umran lenger sør. Ingen av dem har gitt levninger som kan knyttes til israelittenes ferd, og Salmona er ikke mer enn et navn i reiseruten."
  tl:
    - "Ang Salmona ay kampamento ng Israel sa daan mula Bundok Hor patungong Moab, na kilala lamang mula sa talaan ng mga himpilan sa Bilang 33: “At sila'y naglakbay mula sa bundok ng Hor, at humantong sa Salmona. At sila'y naglakbay mula sa Salmona, at humantong sa Phunon.” Walang kuwentong isinalaysay tungkol dito. Yamang ang Phunon ay halos tiyak na Feinan, ang sentro ng pagmimina ng tanso sa silangang panig ng Araba, ang Salmona ay dapat nasa pagitan ng Bundok Hor at Feinan, sa o sa tabi ng Araba sa timog ng Dagat na Patay; nakasalalay ang eksaktong lugar sa bahagi sa kinalalagyan ng Bundok Hor mismo, na pinagtatalunan din."
    - "Maraming lugar ang iminungkahi batay sa pangalan, na maaaring mangahulugang “malilim” o “madilim”: ang Wadi es-Salmaneh, kung saan ito iginuhit ng mapa, isang guhong tinatawag na Rujm Talat az-Zalma sa panig ng Jordan, ang Bir Madhkur sa daan mula Araba patungong Petra, at ang Wadi Umran na mas timog. Walang nagbunga ng mga labing maiuugnay sa paglalakbay ng mga Israelita, at ang Salmona ay nananatiling pangalan lamang sa itineraryo."
  da:
    - "Zalmona er en lejr for Israel på vejen fra Hor mod Moab, kendt kun fra stationslisten i 4 Mos 33: »Og de rejste fra det Bjerg Hor, og de lejrede sig i Zalmona. Og de rejste fra Zalmona, og de lejrede sig i Funon.« Ingen historie fortælles om den. Da Punon næsten med sikkerhed er Feinan, kobberudvindingscentret på Arabas østside, må Zalmona ligge et sted mellem Hor og Feinan, i eller ved Araba syd for Dødehavet; præcis hvor afhænger delvis af, hvor selve Hor placeres, hvilket også er omstridt."
    - "Flere steder er foreslået ud fra navnet, som kan betyde »skyggefuld« eller »mørk«: Wadi es-Salmaneh, hvor kortet tegner den, en ruin kaldet Rujm Talat az-Zalma på den jordanske side, Bir Madhkur på vejen fra Araba til Petra og Wadi Umran længere mod syd. Ingen har givet rester, der kan knyttes til israelitternes rejse, og Zalmona forbliver blot et navn i rejselisten."
  sr:
    - "Селмона је логор Израиља на путу од горе Ор према Моаву, познат само из списка станица у Књизи о бројевима 33: „Потом отишавши од горе Ора стадоше у логор у Селмону. А из Селмона отишавши стадоше у логор у Финону.“ О њој се не приповеда ниједна прича. Пошто је Финон готово сигурно Фајнан, средиште рударења бакра на источној страни Араве, Селмона би требало да лежи негде између горе Ор и Фајнана, у Араби или поред ње јужно од Мртвог мора; где тачно, делом зависи од тога где се смешта сама гора Ор, што је такође спорно."
    - "Предложено је неколико места на основу имена, које може значити „сеновит“ или „таман“: Вади ес Салмана, где га карта црта, рушевина зване Рујм Талат ез Залма на јорданској страни, Бир Мадкур на путу од Араве до Петре и Вади Умран даље на југ. Ниједно није дало остатке који би се могли везати за израиљско путовање, а Селмона остаје не више од имена у попису станица."
  hu:
    - "Calmóna Izráel tábora a Hór-hegytől Moáb felé vezető úton, amelyet csak a Számok 33. fejezetének állomáslistájából ismerünk: „elindulának a Hór hegyétől, és tábort ütének Czalmonában. És elindulának Czalmonából, és tábort ütének Púnonban.” Semmilyen történetet nem mesélnek róla. Mivel Púnón szinte biztosan Fenán, a rézbányászat központja az Arábá keleti oldalán, Calmónának valahol a Hór-hegy és Fenán között kell lennie, az Arábában vagy mellette, a Holt-tengertől délre; hogy pontosan hol, részben attól függ, hová helyezik magát a Hór-hegyet, ami szintén vitatott."
    - "Több helyet javasoltak a név alapján, amely „árnyékosat” vagy „sötétet” jelenthet: a Vádi esz-Szalmáne, ahová a térkép teszi, egy Rudzsm Talat az-Zalma nevű rom a jordániai oldalon, a Bír Madhkúr az Arábából Petrába vezető úton, és a Vádi Umrán délebbre. Egyik sem szolgáltatott az izraelita útra köthető maradványokat, és Calmóna nem több, mint név az útleírásban."
  fi:
    - "Salmona on Israelin leiri Horinvuorelta Moabia kohti vievällä matkalla, tunnettu vain Neljännen Mooseksen kirjan 33. luvun asemaluettelosta: ”Ja he lähtivät Hoorin vuorelta ja leiriytyivät Salmonaan. Ja he lähtivät Salmonasta ja leiriytyivät Puunoniin.” Siitä ei kerrota mitään tarinaa. Koska Punon on lähes varmasti Feinan, Araban itäpuolella oleva kuparinlouhintakeskus, Salmonan pitäisi sijaita jossakin Horinvuoren ja Feinanin välillä, Arabassa tai sen vieressä Kuolleenmeren eteläpuolella; missä täsmälleen, riippuu osaksi siitä, mihin Horinvuori itse sijoitetaan, mistä myös kiistellään."
    - "Useita paikkoja on ehdotettu nimen perusteella, joka voi tarkoittaa ”varjoisaa” tai ”pimeää”: Wadi es-Salmaneh, johon kartta sen piirtää, Jordanian puolella oleva raunio nimeltä Rujm Talat az-Zalma, Bir Madhkur Arabasta Petraan johtavalla tiellä ja kauempana etelässä Wadi Umran. Mikään niistä ei ole tuottanut jäänteitä, jotka voitaisiin yhdistää israelilaisten matkaan, ja Salmona on yhä vain nimi reittiluettelossa."
  vi:
    - "Xa-mô-na là một trại của Y-sơ-ra-ên trên đường từ Núi Hô-rơ hướng đến Mô-áp, chỉ được biết qua danh sách các chặng ở Dân Số Ký 33: “Dân Y-sơ-ra-ên đi từ núi Hô-rơ và đóng trại tại Xa-mô-na. Đi từ Xa-mô-na và đóng trại tại Phu-nôn.” Không có câu chuyện nào được kể về nó. Vì Phu-nôn hầu như chắc chắn là Feinan, trung tâm khai mỏ đồng ở phía đông của A-ra-ba, nên Xa-mô-na hẳn nằm đâu đó giữa Núi Hô-rơ và Feinan, trong hoặc cạnh A-ra-ba phía nam Biển Chết; chính xác ở đâu một phần tùy thuộc vào chỗ đặt chính Núi Hô-rơ, cũng đang tranh luận."
    - "Vài chỗ đã được đề nghị dựa vào tên, có thể nghĩa là “râm mát” hay “tối”: Wadi es-Salmaneh, nơi bản đồ vẽ nó, một tàn tích tên Rujm Talat az-Zalma ở phía Jordan, Bir Madhkur trên đường từ A-ra-ba đến Petra, và Wadi Umran xa hơn về phía nam. Không nơi nào cho ra di tích có thể gắn với cuộc hành trình của Y-sơ-ra-ên, và Xa-mô-na vẫn chỉ là một cái tên trong lộ trình."
  ro:
    - "Țalmona este un popas al lui Israel pe drumul de la Muntele Hor spre Moab, cunoscut numai din lista popasurilor din Numeri 33: „Și au purces din muntele Or, și au tăbărît în Selmona. Și au purces din Selmona, și au tăbărît în Fino.” Nu se povestește nimic despre el. Întrucât Punon este aproape sigur Feinan, centrul de extracție a aramei de pe latura estică a Arabei, Țalmona ar trebui să se afle undeva între Muntele Hor și Feinan, în Araba sau lângă ea, la sud de Marea Moartă; unde anume depinde în parte de locul unde este așezat însuși Muntele Hor, care este de asemenea disputat."
    - "Mai multe locuri au fost sugerate pe baza numelui, care poate însemna „umbros” sau „întunecat”: Wadi es-Salmaneh, unde îl desenează harta, o ruină numită Rujm Talat az-Zalma, pe latura iordaniană, Bir Madhkur, pe drumul de la Araba la Petra, și Wadi Umran, mai la sud. Niciunul nu a dat vestigii care să poată fi legate de călătoria israeliților, iar Țalmona rămâne doar un nume în itinerar."
  bg:
    - "Салмон е стан на Израил по пътя от планината Хор към Моав, известен само от списъка на стоянките в Чис. 33: „И като се дигнаха от гората Ор разположиха стан в Салмона.“ Оттам те се преместили в Пинон. За него не се разказва никаква история. Тъй като Пинон почти сигурно е Фейнан — центърът за добив на мед на източната страна на Арава, Салмон трябва да е лежал някъде между планината Хор и Фейнан, в Арава или до нея южно от Мъртво море; къде точно, зависи отчасти от това къде се поставя самата планина Хор, което също е спорно."
    - "Предлагани са няколко места въз основа на името, което може да означава „сенчест“ или „тъмен“: Уади ес-Салмане, където го поставя картата, една развалина, наречена Руджм Талат аз-Залма, от йорданската страна, Бир Мадкур на пътя от Арава за Петра и Уади Умран по-на юг. Нито едно не е дало останки, които да могат да се свържат с пътуването на израилтяните, и Салмон си остава само име в маршрута."
