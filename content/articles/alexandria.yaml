body:
  en:
    - "Alexandria lies on the Mediterranean coast of Egypt, west of the Nile delta, on a strip of land between the sea and Lake Mareotis. Alexander the Great founded it in the winter of 332/331 BC, marking out its market place, its temples and the line of its walls himself. A causeway seven stades long, the Heptastadion, joined the city to the island of Pharos and formed two harbours, and the harbour on the lake, fed by canals from the Nile, was richer still. Under the Ptolemies it became the capital of Egypt and the greatest city of the Greek world, with the lighthouse on Pharos built by Sostratus of Cnidus, the Museum and the royal library."
    - "Rome annexed Egypt in 30 BC, after the death of Cleopatra VII. A large Jewish community lived in the city. According to the Letter of Aristeas, seventy-two elders translated the Law into Greek on Pharos under Ptolemy II; this is the origin story of the Septuagint, and its details are legendary. Philo of Alexandria wrote here in the first century AD and described how, in AD 38, the Jews were driven into one quarter of the city and their synagogues profaned. In the Jewish revolt of 115–117 under Trajan the community was crushed."
    - "In Acts, men of the synagogue called that of the Libertines, and Cyrenians, and Alexandrians, disputed with Stephen in Jerusalem. Apollos, an eloquent man and mighty in the scriptures, was born at Alexandria. On his voyage to Rome Paul sailed in a ship of Alexandria bound for Italy, and after the wreck on Malta in another that had wintered on the island. Eusebius records the tradition that Mark was the first to preach in Egypt and founded the churches of Alexandria."
    - "A Christian school of learning flourished here under Pantaenus, Clement and Origen. Arius was a presbyter of Alexandria, and the city's bishop Athanasius (328–373) became his chief opponent. About 391, by order of Theodosius, Bishop Theophilus destroyed the Serapeum, and in 415 a Christian mob murdered the philosopher Hypatia. After the Council of Chalcedon in 451 most of Alexandria's Christians rejected its creed, and the city remained one of the great cities of the eastern empire until the Arab conquest of 641–642."
  ru:
    - "Александрия лежит на средиземноморском побережье Египта, к западу от дельты Нила, на полосе земли между морем и озером Мареотида. Александр Македонский основал её зимой 332/331 г. до н. э. и сам наметил, где быть площади, храмам и городской стене. Насыпь длиной в семь стадий, Гептастадий, соединила город с островом Фарос и образовала две гавани, а гавань на озере, куда вели каналы от Нила, была ещё богаче. При Птолемеях Александрия стала столицей Египта и величайшим городом греческого мира, с маяком на Фаросе, построенным Состратом Книдским, Мусейоном и царской библиотекой."
    - "В 30 г. до н. э., после смерти Клеопатры VII, Рим присоединил Египет. В городе жила большая иудейская община. По Посланию Аристея, семьдесят два старца перевели Закон на греческий язык на Фаросе при Птолемее II; это рассказ о происхождении Септуагинты, и подробности его легендарны. Филон Александрийский писал здесь в I веке н. э. и рассказал, как в 38 г. н. э. иудеев согнали в один квартал города, а их синагоги осквернили. Во время иудейского восстания 115–117 гг. при Траяне община была уничтожена."
    - "В Деяниях некоторые из так называемой синагоги Либертинцев и Киринейцев и Александрийцев спорили со Стефаном в Иерусалиме. Аполлос, муж красноречивый и сведущий в Писаниях, был родом из Александрии. По пути в Рим Павел плыл на Александрийском корабле, шедшем в Италию, а после кораблекрушения у Мелита — на другом, зимовавшем на том острове. Евсевий передаёт предание, что Марк первым проповедовал в Египте и основал церкви в Александрии."
    - "Здесь процветала христианская школа, связанная с именами Пантена, Климента и Оригена. Арий был пресвитером Александрии, а её епископ Афанасий (328–373) стал главным его противником. Около 391 г. по приказу Феодосия епископ Феофил разрушил Серапеум, а в 415 г. толпа христиан убила женщину-философа Ипатию. После Халкидонского собора 451 г. большинство христиан Александрии отвергло его вероопределение, а сам город оставался одним из великих городов восточной империи до арабского завоевания 641–642 гг."
  uk:
    - "Александрія лежить на середземноморському узбережжі Єгипту, на захід від дельти Нілу, на смузі землі між морем і озером Мареотіс. Александр Великий заснував її взимку 332/331 р. до н. е., сам накресливши її торговище, храми й лінію мурів. Дамба завдовжки сім стадіїв, Гептастадій, з'єднала місто з островом Фарос і утворила дві гавані, а гавань на озері, що живилася каналами з Нілу, була ще багатшою. За Птолемеїв вона стала столицею Єгипту й найбільшим містом грецького світу, з маяком на Фаросі, збудованим Состратом із Кніда, Мусейоном і королівською бібліотекою."
    - "Рим анексував Єгипет у 30 р. до н. е. після смерті Клеопатри VII. У місті мешкала велика юдейська громада. За Листом Арістея, сімдесят два старійшини переклали Закон грецькою на Фаросі за Птолемея II; це легенда про походження Септуагінти, і її подробиці легендарні. Філон Александрійський писав тут у I столітті н. е. і описав, як у 38 р. н. е. юдеїв загнали в один квартал міста, а їхні синагоги осквернили. У юдейському повстанні 115–117 рр. за Траяна громаду було розгромлено."
    - "У Діях деякі з синагоги, званої синагогою лібертинців, і киринейців, і александрійців, сперечалися зі Стефаном в Єрусалимі. Аполлос, красномовний чоловік, сильний у Писаннях, був родом з Александрії. У плавбі до Риму Павло відплив на александрійському кораблі, що плив до Італії, а після аварії на Мальті — на іншому, що зимував на острові. Євсевій записує переказ, що Марк першим проповідував у Єгипті й заснував церкви Александрії."
    - "Тут розквітла християнська школа знання за Пантена, Климента й Орігена. Арій був пресвітером Александрії, а єпископ міста Афанасій (328–373) став його головним супротивником. Близько 391 року за наказом Феодосія єпископ Теофіл зруйнував Серапеум, а в 415 році християнський натовп убив філософиню Іпатію. Після Халкідонського собору 451 року більшість християн Александрії відкинули його символ віри, і місто лишалося одним з великих міст східної імперії до арабського завоювання 641–642 рр."
  es:
    - "Alejandría se encuentra en la costa mediterránea de Egipto, al oeste del delta del Nilo, en una franja de tierra entre el mar y el lago Mareotis. Alejandro Magno la fundó en el invierno de 332/331 a. C., trazando él mismo su plaza de mercado, sus templos y la línea de sus murallas. Una calzada de siete estadios, el Heptastadio, unía la ciudad con la isla de Faros y formaba dos puertos, y el puerto del lago, alimentado por canales del Nilo, era aún más rico. Bajo los Ptolomeos se convirtió en la capital de Egipto y en la mayor ciudad del mundo griego, con el faro de Faros construido por Sóstrato de Gnido, el Museo y la biblioteca real."
    - "Roma anexionó Egipto en 30 a. C., tras la muerte de Cleopatra VII. En la ciudad vivía una numerosa comunidad judía. Según la Carta de Aristeas, setenta y dos ancianos tradujeron la Ley al griego en Faros bajo Ptolomeo II; este es el relato de los orígenes de la Septuaginta, y sus detalles son legendarios. Filón de Alejandría escribió aquí en el siglo I d. C. y describió cómo, en 38 d. C., los judíos fueron confinados en un solo barrio de la ciudad y sus sinagogas profanadas. En la revuelta judía de 115–117, bajo Trajano, la comunidad fue aplastada."
    - "En los Hechos, hombres de la sinagoga que se llama de los Libertinos, y Cireneos, y Alejandrinos, disputaron con Esteban en Jerusalén. Apolos, hombre elocuente y poderoso en las Escrituras, era natural de Alejandría. En su viaje a Roma, Pablo embarcó en una nave alejandrina que navegaba a Italia, y tras el naufragio en Malta, en otra que había invernado en la isla. Eusebio recoge la tradición de que Marcos fue el primero en predicar en Egipto y fundó las iglesias de Alejandría."
    - "Aquí floreció una escuela cristiana de saber bajo Panteno, Clemente y Orígenes. Arrio era presbítero de Alejandría, y el obispo de la ciudad, Atanasio (328–373), se convirtió en su principal adversario. Hacia 391, por orden de Teodosio, el obispo Teófilo destruyó el Serapeo, y en 415 una turba cristiana asesinó a la filósofa Hipatia. Tras el Concilio de Calcedonia, en 451, la mayoría de los cristianos de Alejandría rechazó su credo, y la ciudad siguió siendo una de las grandes ciudades del imperio de Oriente hasta la conquista árabe de 641–642."
  pt:
    - "Alexandria fica na costa mediterrânea do Egito, a oeste do delta do Nilo, numa faixa de terra entre o mar e o lago Mareótis. Alexandre Magno a fundou no inverno de 332/331 a.C., traçando ele mesmo a praça do mercado, os templos e a linha das muralhas. Uma calçada de sete estádios, o Heptastádio, ligava a cidade à ilha de Faros e formava dois portos, e o porto do lago, alimentado por canais do Nilo, era ainda mais rico. Sob os Ptolomeus tornou-se a capital do Egito e a maior cidade do mundo grego, com o farol de Faros, construído por Sóstrato de Cnido, o Museu e a biblioteca real."
    - "Roma anexou o Egito em 30 a.C., depois da morte de Cleópatra VII. Uma grande comunidade judaica vivia na cidade. Segundo a Carta de Aristeias, setenta e dois anciãos traduziram a Lei para o grego em Faros sob Ptolomeu II; é a história de origem da Septuaginta, e seus detalhes são lendários. Fílon de Alexandria escreveu aqui no século I d.C. e descreveu como, em 38 d.C., os judeus foram confinados num só bairro da cidade e suas sinagogas profanadas. Na revolta judaica de 115–117, sob Trajano, a comunidade foi esmagada."
    - "Em Atos, homens da sinagoga chamada dos Libertos, e dos cireneus e dos alexandrinos, discutiram com Estêvão em Jerusalém. Apolo, homem eloquente e poderoso nas Escrituras, era natural de Alexandria. Na viagem a Roma, Paulo embarcou num navio de Alexandria que navegava para a Itália e, depois do naufrágio em Malta, em outro que passara o inverno na ilha. Eusébio registra a tradição de que Marcos foi o primeiro a pregar no Egito e fundou as igrejas de Alexandria."
    - "Uma escola cristã de saber floresceu aqui sob Panteno, Clemente e Orígenes. Ário era presbítero de Alexandria, e o bispo da cidade, Atanásio (328–373), tornou-se seu principal adversário. Por volta de 391, por ordem de Teodósio, o bispo Teófilo destruiu o Serapeu, e em 415 uma multidão cristã assassinou a filósofa Hipátia. Depois do Concílio de Calcedônia, em 451, a maior parte dos cristãos de Alexandria rejeitou o seu credo, e a cidade permaneceu uma das grandes cidades do império oriental até a conquista árabe de 641–642."
  de:
    - "Alexandria liegt an der Mittelmeerküste Ägyptens, westlich des Nildeltas, auf einem Landstreifen zwischen dem Meer und dem Mareotis-See. Alexander der Große gründete es im Winter 332/331 v. Chr. und steckte Marktplatz, Tempel und Mauerverlauf selbst ab. Ein sieben Stadien langer Damm, das Heptastadion, verband die Stadt mit der Insel Pharos und bildete zwei Häfen, und der Hafen am See, von Kanälen aus dem Nil gespeist, war noch reicher. Unter den Ptolemäern wurde sie Hauptstadt Ägyptens und die größte Stadt der griechischen Welt, mit dem Leuchtturm auf Pharos, den Sostratos von Knidos erbaute, dem Museion und der königlichen Bibliothek."
    - "Rom annektierte Ägypten 30 v. Chr. nach dem Tod Kleopatras VII. In der Stadt lebte eine große jüdische Gemeinde. Nach dem Aristeasbrief übersetzten zweiundsiebzig Älteste das Gesetz unter Ptolemaios II. auf Pharos ins Griechische; das ist die Entstehungsgeschichte der Septuaginta, ihre Einzelheiten sind legendär. Philon von Alexandria schrieb hier im 1. Jahrhundert n. Chr. und beschrieb, wie 38 n. Chr. die Juden in ein Stadtviertel getrieben und ihre Synagogen entweiht wurden. Im jüdischen Aufstand von 115–117 unter Trajan wurde die Gemeinde zerschlagen."
    - "In der Apostelgeschichte stritten Männer aus der Synagoge, die die der Libertiner heißt, und der Kyrener und der Alexandriner in Jerusalem mit Stephanus. Apollos, ein beredter Mann und mächtig in der Schrift, stammte aus Alexandria. Auf der Fahrt nach Rom segelte Paulus auf einem alexandrinischen Schiff, das nach Italien bestimmt war, und nach dem Schiffbruch vor Malta auf einem anderen, das auf der Insel überwintert hatte. Eusebius überliefert, Markus habe als Erster in Ägypten gepredigt und die Kirchen von Alexandria gegründet."
    - "Eine christliche Gelehrtenschule blühte hier unter Pantänus, Clemens und Origenes. Arius war Presbyter in Alexandria, und der Bischof der Stadt, Athanasius (328–373), wurde sein Hauptgegner. Um 391 zerstörte Bischof Theophilus auf Befehl des Theodosius das Serapeion, und 415 ermordete ein christlicher Mob die Philosophin Hypatia. Nach dem Konzil von Chalcedon 451 lehnte die Mehrheit der Christen Alexandrias dessen Bekenntnis ab, und die Stadt blieb bis zur arabischen Eroberung 641–642 eine der großen Städte des Ostreichs."
  fr:
    - "Alexandrie s’étend sur la côte méditerranéenne de l’Égypte, à l’ouest du delta du Nil, sur une bande de terre entre la mer et le lac Maréotis. Alexandre le Grand la fonda durant l’hiver 332/331 av. J.-C., en traçant lui-même sa place du marché, ses temples et la ligne de ses murs. Une chaussée longue de sept stades, l’Heptastade, relia la ville à l’île de Pharos et forma deux ports, et le port du lac, alimenté par des canaux du Nil, était plus riche encore. Sous les Ptolémées, elle devint la capitale de l’Égypte et la plus grande ville du monde grec, avec le phare de Pharos bâti par Sostrate de Cnide, le Musée et la bibliothèque royale."
    - "Rome annexa l’Égypte en 30 av. J.-C., après la mort de Cléopâtre VII. Une grande communauté juive vivait dans la ville. Selon la Lettre d’Aristée, soixante-douze anciens traduisirent la Loi en grec à Pharos sous Ptolémée II ; c’est le récit d’origine de la Septante, et ses détails sont légendaires. Philon d’Alexandrie écrivit ici au Ier siècle apr. J.-C. et décrivit comment, en 38 apr. J.-C., les Juifs furent refoulés dans un seul quartier de la ville et leurs synagogues profanées. Dans la révolte juive de 115-117 sous Trajan, la communauté fut écrasée."
    - "Dans les Actes, des hommes de la synagogue dite des Affranchis, et des Cyrénéens, et des Alexandrins, discutèrent avec Étienne à Jérusalem. Apollos, homme éloquent et versé dans les Écritures, était originaire d’Alexandrie. Lors de son voyage vers Rome, Paul monta sur un navire d’Alexandrie qui allait en Italie, puis, après le naufrage à Malte, sur un autre qui avait passé l’hiver dans l’île. Eusèbe rapporte la tradition selon laquelle Marc fut le premier à prêcher en Égypte et fonda les Églises d’Alexandrie."
    - "Une école chrétienne de haut savoir y fleurit sous Pantène, Clément et Origène. Arius était prêtre d’Alexandrie, et l’évêque de la ville, Athanase (328-373), devint son principal adversaire. Vers 391, sur l’ordre de Théodose, l’évêque Théophile détruisit le Sérapéum, et en 415 une foule chrétienne assassina la philosophe Hypatie. Après le concile de Chalcédoine en 451, la plupart des chrétiens d’Alexandrie rejetèrent son credo, et la ville demeura l’une des grandes cités de l’Empire d’Orient jusqu’à la conquête arabe de 641-642."
  it:
    - "Alessandria si trova sulla costa mediterranea dell’Egitto, a ovest del delta del Nilo, su una striscia di terra tra il mare e il lago Mareotide. Alessandro Magno la fondò nell’inverno del 332/331 a.C., tracciando egli stesso la piazza del mercato, i templi e la linea delle mura. Una diga lunga sette stadi, l’Heptastadion, univa la città all’isola di Faro e formava due porti, e il porto sul lago, alimentato da canali dal Nilo, era ancora più ricco. Sotto i Tolomei divenne la capitale dell’Egitto e la più grande città del mondo greco, con il faro sull’isola di Faro costruito da Sostrato di Cnido, il Museo e la biblioteca reale."
    - "Roma annesse l’Egitto nel 30 a.C., dopo la morte di Cleopatra VII. Nella città viveva una numerosa comunità giudaica. Secondo la Lettera di Aristea, settantadue anziani tradussero la Legge in greco a Faro sotto Tolomeo II; è il racconto di origine della Settanta, e i suoi particolari sono leggendari. Filone di Alessandria scrisse qui nel I secolo d.C. e descrisse come, nel 38 d.C., i Giudei furono cacciati in un solo quartiere della città e le loro sinagoghe profanate. Nella rivolta giudaica del 115–117 sotto Traiano la comunità fu schiacciata."
    - "Negli Atti, uomini della sinagoga detta dei Liberti, e dei Cirenei, e degli Alessandrini, discussero con Stefano a Gerusalemme. Apollo, uomo eloquente e potente nelle Scritture, era nato ad Alessandria. Nel suo viaggio verso Roma Paolo si imbarcò su una nave di Alessandria diretta in Italia e, dopo il naufragio a Malta, su un’altra che aveva svernato nell’isola. Eusebio riferisce la tradizione che Marco fu il primo a predicare in Egitto e fondò le chiese di Alessandria."
    - "Qui fiorì una scuola cristiana di studi sotto Panteno, Clemente e Origene. Ario era presbitero di Alessandria, e il vescovo della città Atanasio (328–373) divenne il suo principale avversario. Verso il 391, per ordine di Teodosio, il vescovo Teofilo distrusse il Serapeo, e nel 415 una folla cristiana uccise la filosofa Ipazia. Dopo il concilio di Calcedonia del 451 la maggior parte dei cristiani di Alessandria ne rifiutò il credo, e la città restò una delle grandi città dell’impero orientale fino alla conquista araba del 641–642."
  pl:
    - "Aleksandria leży na śródziemnomorskim wybrzeżu Egiptu, na zachód od delty Nilu, na pasie lądu między morzem a jeziorem Mareotis. Aleksander Wielki założył ją zimą 332/331 r. p.n.e., sam wytyczając jej rynek, świątynie i przebieg murów. Grobla długa na siedem stadiów, Heptastadion, połączyła miasto z wyspą Faros i utworzyła dwa porty, a port na jeziorze, zasilany kanałami z Nilu, był jeszcze zasobniejszy. Za Ptolemeuszy stała się stolicą Egiptu i największym miastem świata greckiego, z latarnią morską na Faros zbudowaną przez Sostratosa z Knidos, Muzeum i biblioteką królewską."
    - "Rzym zaanektował Egipt w 30 r. p.n.e., po śmierci Kleopatry VII. W mieście mieszkała liczna społeczność żydowska. Według Listu Arysteasza siedemdziesięciu dwóch starszych przetłumaczyło Prawo na grecki na Faros za Ptolemeusza II; to opowieść o pochodzeniu Septuaginty, a jej szczegóły są legendarne. Filon z Aleksandrii pisał tu w I wieku n.e. i opisał, jak w 38 r. n.e. Żydów zapędzono do jednej dzielnicy miasta, a ich synagogi zbezczeszczono. W powstaniu żydowskim z lat 115–117 za Trajana społeczność została zmiażdżona."
    - "W Dziejach ludzie z synagogi zwanej synagogą Libertynów i Cyrenejczyków, i Aleksandryjczyków, dysputowali ze Szczepanem w Jerozolimie. Apollos, mąż wymowny i potężny w Pismach, urodził się w Aleksandrii. W podróży do Rzymu Paweł płynął okrętem aleksandryjskim zmierzającym do Italii, a po rozbiciu na Malcie innym, który zimował na wyspie. Euzebiusz zapisuje tradycję, że Marek pierwszy głosił w Egipcie i założył kościoły Aleksandrii."
    - "Chrześcijańska szkoła nauki kwitła tu za Pantenosa, Klemensa i Orygenesa. Ariusz był prezbiterem Aleksandrii, a biskup miasta Atanazy (328–373) został jego głównym przeciwnikiem. Około 391 roku z rozkazu Teodozjusza biskup Teofil zniszczył Serapejon, a w 415 roku chrześcijański tłum zamordował filozofkę Hypatię. Po Soborze Chalcedońskim w 451 roku większość chrześcijan Aleksandrii odrzuciła jego wyznanie, a miasto pozostało jednym z wielkich miast cesarstwa wschodniego do arabskiego podboju z lat 641–642."
  nl:
    - "Alexandrië ligt aan de Middellandse-Zeekust van Egypte, ten westen van de Nijldelta, op een landstrook tussen de zee en het Mareotismeer. Alexander de Grote stichtte de stad in de winter van 332/331 v.Chr. en zette zelf haar marktplein, haar tempels en de lijn van haar muren uit. Een dam van zeven stadiën lang, de Heptastadion, verbond de stad met het eiland Pharos en vormde twee havens, en de haven aan het meer, gevoed door kanalen vanuit de Nijl, was nog rijker. Onder de Ptolemaeën werd zij de hoofdstad van Egypte en de grootste stad van de Griekse wereld, met de vuurtoren op Pharos van Sostratus van Knidus, het Museion en de koninklijke bibliotheek."
    - "Rome annexeerde Egypte in 30 v.Chr., na de dood van Cleopatra VII. In de stad woonde een grote Joodse gemeenschap. Volgens de Brief van Aristeas vertaalden tweeënzeventig oudsten de Wet op Pharos in het Grieks onder Ptolemaeus II; dit is het oorsprongsverhaal van de Septuaginta, en de details ervan zijn legendarisch. Filo van Alexandrië schreef hier in de eerste eeuw n.Chr. en beschreef hoe de Joden in 38 n.Chr. in één wijk van de stad werden opgedreven en hun synagogen werden ontwijd. In de Joodse opstand van 115–117 onder Trajanus werd de gemeenschap verpletterd."
    - "In Handelingen redetwistten mannen van de synagoge, genaamd der Libertijnen, en der Cyreneers, en der Alexandrijnen, met Stefanus in Jeruzalem. Apollos, een welsprekend man en machtig in de Schriften, was in Alexandrië geboren. Op zijn reis naar Rome voer Paulus op een schip van Alexandrië dat naar Italië voer, en na de schipbreuk op Malta op een ander dat op het eiland had overwinterd. Eusebius vermeldt de overlevering dat Marcus als eerste in Egypte predikte en de kerken van Alexandrië stichtte."
    - "Hier bloeide een christelijke school onder Pantaenus, Clemens en Origenes. Arius was presbyter van Alexandrië, en de bisschop van de stad, Athanasius (328–373), werd zijn voornaamste tegenstander. Omstreeks 391 liet bisschop Theofilus op bevel van Theodosius het Serapeum verwoesten, en in 415 vermoordde een christelijke meute de filosofe Hypatia. Na het Concilie van Chalcedon in 451 verwierpen de meeste christenen van Alexandrië de geloofsbelijdenis ervan, en de stad bleef een van de grote steden van het oostelijke rijk tot de Arabische verovering van 641–642."
  cs:
    - "Alexandrie leží na středomořském pobřeží Egypta, západně od delty Nilu, na pásu země mezi mořem a jezerem Mareotis. Alexandr Veliký ji založil v zimě 332/331 př. n. l. a sám vytyčil její tržiště, chrámy a linii hradeb. Hráz dlouhá sedm stadií, Heptastadion, spojila město s ostrovem Faros a vytvořila dva přístavy a přístav na jezeře, zásobený kanály z Nilu, byl ještě bohatší. Za Ptolemaiovců se stala hlavním městem Egypta a největším městem řeckého světa s majákem na Farosu, který postavil Sostratos z Knidu, s Museionem a královskou knihovnou."
    - "Řím připojil Egypt v roce 30 př. n. l. po smrti Kleopatry VII. Ve městě žila velká židovská obec. Podle Aristeova listu dvaasedmdesát starších přeložilo Zákon do řečtiny na Farosu za Ptolemaia II.; je to původní příběh Septuaginty a jeho podrobnosti jsou legendární. Filón Alexandrijský zde psal v 1. století n. l. a popsal, jak byli roku 38 n. l. Židé zahnáni do jedné čtvrti města a jejich synagogy znesvěceny. V židovském povstání v letech 115–117 za Traiana byla obec rozdrcena."
    - "Ve Skutcích se muži ze synagogy zvané Libertinských, a Cyrenenských, a Alexandrinských dohadovali v Jeruzalémě se Štěpánem. Apollos, muž výmluvný a mocný v Písmech, se narodil v Alexandrii. Na cestě do Říma Pavel plul na lodi z Alexandrie mířící do Itálie a po ztroskotání na Maltě na jiné, která na ostrově přezimovala. Eusebios zaznamenává tradici, že Marek kázal v Egyptě jako první a založil církve v Alexandrii."
    - "Křesťanská učená škola zde vzkvétala za Pantaina, Klémenta a Origena. Arius byl alexandrijský presbyter a biskup města Athanasios (328–373) se stal jeho hlavním protivníkem. Kolem roku 391 z příkazu Theodosia biskup Theofilos zničil Serapeum a v roce 415 křesťanský dav zavraždil filozofku Hypatii. Po Chalkedonském koncilu v roce 451 většina alexandrijských křesťanů odmítla jeho vyznání a město zůstalo jedním z velkých měst východní říše až do arabského dobytí v letech 641–642."
  sv:
    - "Alexandria ligger vid Egyptens Medelhavskust, väster om Nildeltat, på en landremsa mellan havet och Mareotissjön. Alexander den store grundade staden vintern 332/331 f.Kr. och utstakade själv dess torg, tempel och murlinje. En vägbank, sju stadier lång, Heptastadion, förband staden med ön Pharos och bildade två hamnar, och hamnen vid sjön, matad av kanaler från Nilen, var ännu rikare. Under Ptolemaierna blev den Egyptens huvudstad och den grekiska världens största stad, med fyren på Pharos byggd av Sostratos från Knidos, Museion och det kungliga biblioteket."
    - "Rom annekterade Egypten år 30 f.Kr., efter Kleopatra VII:s död. En stor judisk gemenskap bodde i staden. Enligt Aristeasbrevet översatte sjuttiotvå äldste Lagen till grekiska på Pharos under Ptolemaios II; detta är Septuagintas ursprungsberättelse, och dess enskildheter är legendariska. Filon av Alexandria skrev här under första århundradet e.Kr. och beskrev hur judarna år 38 e.Kr. drevs in i en stadsdel och deras synagogor vanhelgades. I det judiska upproret 115–117 under Trajanus krossades gemenskapen."
    - "I Apostlagärningarna disputerade män ur den synagoga som kallades ”De frigivnes och cyrenéernas och alexandrinernas synagoga” med Stefanos i Jerusalem. Apollos, en vältalig man och mäktig i skrifterna, var född i Alexandria. På sin resa till Rom seglade Paulus på ett skepp från Alexandria på väg till Italien, och efter skeppsbrottet vid Malta på ett annat som hade övervintrat på ön. Eusebios återger traditionen att Markus var den förste som predikade i Egypten och grundade Alexandrias församlingar."
    - "En kristen lärdomsskola blomstrade här under Pantainos, Clemens och Origenes. Arius var presbyter i Alexandria, och stadens biskop Athanasios (328–373) blev hans främste motståndare. Omkring 391, på Theodosius’ order, förstörde biskop Teofilos Serapeion, och år 415 mördade en kristen folkhop filosofen Hypatia. Efter konciliet i Chalkedon 451 förkastade de flesta av Alexandrias kristna dess trosbekännelse, och staden förblev en av det östra rikets stora städer till den arabiska erövringen 641–642."
