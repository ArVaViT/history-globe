body:
  en:
    - "En-rogel, perhaps “the fuller's spring”, was a spring at the meeting of the Kidron and Hinnom valleys just south of Jerusalem, on the border between Judah and Benjamin. It is generally identified with Bir Ayyub, “Job's Well”, a deep well in the Silwan quarter below the City of David, which overflows as a spring after heavy rains; this is the usual identification, though Clermont-Ganneau and others argued for the Gihon spring. From the sixteenth century the well was also called the Well of Nehemiah, taken for the pit in which the priests had hidden the sacred fire at the exile."
    - "Joshua brings the border of Judah down from En-shemesh so that “the goings out thereof were at En-rogel”, then up “the valley of the son of Hinnom unto the south side of the Jebusite”; Benjamin's border meets it at the same spring. In Absalom's revolt “Jonathan and Ahimaaz stayed by En-rogel; for they might not be seen to come into the city”, and a maidservant carried Hushai's warning out to them for David. When David was old, Adonijah “slew sheep and oxen and fat cattle by the stone of Zoheleth, which is by En-rogel” and feasted his supporters, while Nathan and Zadok had Solomon anointed at Gihon a few hundred metres up the valley; the shout of the city reached the feast and ended Adonijah's bid. The stone of Zoheleth is sometimes sought in the rocky scarp of Silwan called ez-Zahweileh."
    - "Bir Ayyub today lies in Silwan in East Jerusalem, below which the Kidron runs on towards the desert as Wadi en-Nar. The king's garden of Kings and Nehemiah lay near the pool of Siloam, just above it, and the valley floor is still cultivated."
  ru:
    - "Ен-Рогел, возможно «источник белильщика», был источником у слияния долин Кедрон и Енномовой к югу от Иерусалима, на границе Иуды и Вениамина. Его обычно отождествляют с Бир-Айюбом, «колодцем Иова», глубоким колодцем в квартале Сильван под городом Давида, который после сильных дождей переливается через край как источник; это обычное отождествление, хотя Клермон-Ганно и другие доказывали, что Ен-Рогел — источник Гион. С XVI века колодец звали также колодцем Неемии, считая его тем, в котором священники скрыли священный огонь перед пленом."
    - "Книга Иисуса Навина ведёт предел Иуды вниз от Ен-Шемеша так, что он «оканчивается у Ен-Рогела», а затем вверх, «к долине сына Енномова с южной стороны Иевуса»; предел Вениамина встречается с ним у того же источника. Во время мятежа Авессалома «Ионафан и Ахимаас стояли у источника Рогель», ибо «не могли показаться в городе», и служанка вынесла им для Давида предупреждение Хусия. Когда Давид состарился, «заколол Адония овец и волов и тельцов у камня Зохелет, что у источника Рогель» и угощал своих сторонников, а Нафан и Садок в это время помазали Соломона у Гиона, в нескольких сотнях метров выше по долине; шум города долетел до пира и положил конец замыслу Адонии. Камень Зохелет иногда ищут в скалистом обрыве Сильвана, который зовут Эз-Захвейле."
    - "Бир-Айюб сегодня лежит в Сильване, в Восточном Иерусалиме, ниже которого Кедрон уходит к пустыне как Вади-эн-Нар. Царский сад книг Царств и Неемии лежал у Силоамского пруда, чуть выше, и дно долины обрабатывают до сих пор."
  uk:
    - "Ен-Рогел, можливо, «джерело сукновала», було джерелом при зустрічі долин Кедрону й Гінном просто на південь від Єрусалима, на межі між Юдою та Веніяміном. Його зазвичай ототожнюють з Бір-Аюбом, «колодязем Йова», глибоким колодязем у кварталі Сілуан під Містом Давида, який після сильних дощів переповнюється як джерело; це звичайне ототожнення, хоча Клермон-Ганно та інші обстоювали джерело Гіхон. Від XVI ст. колодязь також називали Колодязем Неемії, вважаючи його ямою, в якій священники сховали священний вогонь під час вигнання."
    - "Ісус Навин проводить межу Юди вниз від Ен-Шемеша так, що вона «йде далїй до Рогел криницї», потім угору в «долину сина Енномового на полуднє від нагірньої стїни Евузійської»; межа Веніямина сходиться з нею біля того самого джерела. Під час бунту Авесалома «Йонатан же та Ахимаас стояли над Рогель-криницею … бо їм не можна було появитись у городї», і служниця принесла їм попередження Хусія для Давида. Коли Давид постарів, Адонія «Позаколював раз … вівцї, корови й бички коло Зохелет-Каменя, що над криницею Рогель» і влаштував бенкет своїм прихильникам, тоді як Натан і Садок помазали Соломона в Гіхоні за кілька сотень метрів угору долиною; галас міста долинув до бенкету й покінчив зі спробою Адонії. Камінь Зохелет іноді шукають у скелястому урвищі Сілуану, званому ез-Захвейле."
    - "Бір-Аюб сьогодні лежить у Сілуані у Східному Єрусалимі, нижче якого Кедрон тече далі до пустелі як Вад-ен-Нар. Царський сад Книги Царів і Неемії лежав біля купелі Сілоам, просто над ним, і дно долини досі оброблюють."
  es:
    - "En-rogel, quizá «la fuente del batanero», era una fuente en el encuentro de los valles del Cedrón y del Hinom, justo al sur de Jerusalén, en la frontera entre Judá y Benjamín. Se identifica generalmente con Bir Ayyub, «el Pozo de Job», un pozo profundo en el barrio de Silwan, bajo la Ciudad de David, que rebosa como una fuente tras fuertes lluvias; es la identificación habitual, aunque Clermont-Ganneau y otros defendieron la fuente del Gihón. Desde el siglo XVI el pozo se llamó también Pozo de Nehemías, tomado por el hoyo donde los sacerdotes habían escondido el fuego sagrado en el destierro."
    - "Josué hace bajar la frontera de Judá desde En-semes de modo que «sale á la fuente de Rogel», y luego sube por «el valle del hijo de Hinnom al lado del Jebuseo al mediodía»; la frontera de Benjamín se encuentra con ella en la misma fuente. En la rebelión de Absalón, «Jonathán y Ahimaas estaban junto á la fuente de Rogel, porque no podían ellos mostrarse viniendo á la ciudad», y una criada les llevó el aviso de Husai para David. Cuando David era viejo, Adonías, «matando ovejas y vacas y animales engordados junto á la peña de Zoheleth, que está cerca de la fuente de Rogel», convidó a sus partidarios, mientras Natán y Sadoc hacían ungir a Salomón en el Gihón, a unos cientos de metros valle arriba; el clamor de la ciudad llegó al banquete y puso fin a las pretensiones de Adonías. La peña de Zoheleth se busca a veces en el escarpe rocoso de Silwan llamado ez-Zahweileh."
    - "Bir Ayyub se halla hoy en Silwan, en Jerusalén Oriental, y por debajo de él el Cedrón sigue hacia el desierto como uadi en-Nar. El huerto del rey de que hablan Reyes y Nehemías estaba cerca del estanque de Siloé, justo encima, y el fondo del valle sigue cultivado."
  pt:
    - "En-Rogel, talvez “a fonte do lavandeiro”, era uma fonte no encontro dos vales do Cedrom e de Hinom, logo ao sul de Jerusalém, na fronteira entre Judá e Benjamim. É geralmente identificada com Bir Ayyub, o “Poço de Jó”, um poço profundo no bairro de Silwan, abaixo da Cidade de Davi, que transborda como fonte depois de chuvas fortes; essa é a identificação habitual, embora Clermont-Ganneau e outros tenham defendido a fonte do Giom. Desde o século XVI o poço foi chamado também Poço de Neemias, tomado pela cova em que os sacerdotes esconderam o fogo sagrado no exílio."
    - "Josué faz descer a fronteira de Judá a partir de En-Semes de modo que ela “terminava em En-Rogel”, e depois sobe “pelo vale do filho de Hinom até a encosta dos jebuseus”, ao sul; a fronteira de Benjamim a encontra na mesma fonte. Na revolta de Absalão, “Jônatas e Aimaás estavam esperando em En-Rogel”, pois “eles não podiam arriscar serem vistos entrando na cidade”, e uma serva levava até eles o aviso de Husai para Davi. Quando Davi era velho, Adonias “sacrificou ovelhas, bois e bezerros cevados junto à pedra de Zoelete, que fica perto de En-Rogel” e banqueteou seus partidários, enquanto Natã e Zadoque faziam ungir Salomão no Giom, algumas centenas de metros vale acima; o clamor da cidade chegou ao banquete e pôs fim à tentativa de Adonias. A pedra de Zoelete é por vezes procurada no escarpado rochoso de Silwan chamado ez-Zahweileh."
    - "Bir Ayyub fica hoje em Silwan, em Jerusalém Oriental, abaixo da qual o Cedrom segue em direção ao deserto como uádi en-Nar. O jardim do rei de Reis e de Neemias ficava perto do tanque de Siloé, logo acima dela, e o fundo do vale ainda é cultivado."
  de:
    - "En-Rogel, vielleicht „die Quelle des Walkers“, war eine Quelle am Zusammenfluss von Kidron- und Hinnomtal unmittelbar südlich von Jerusalem, an der Grenze zwischen Juda und Benjamin. Sie wird allgemein mit Bir Ayyub, dem „Hiobsbrunnen“, gleichgesetzt, einem tiefen Brunnen im Stadtteil Silwan unterhalb der Stadt Davids, der nach starken Regenfällen als Quelle überläuft; dies ist die übliche Gleichsetzung, obwohl Clermont-Ganneau und andere für die Gihonquelle eintraten. Ab dem 16. Jahrhundert hieß der Brunnen auch Nehemia-Brunnen, für die Grube gehalten, in der die Priester beim Exil das heilige Feuer verborgen hatten."
    - "Josua führt Judas Grenze von En-Schemesch herab: „darnach geht sie zu dem Wasser En-Semes und kommt hinaus zum Brunnen Rogel“; dann: „darnach geht sie herauf zum Tal des Sohnes Hinnoms an der Mittagseite des Jebusiters“; Benjamins Grenze trifft dort auf sie. In Absaloms Aufstand „standen Jonatan und Ahimaaz bei dem Brunnen Rogel; denn sie durften sich nicht sehen lassen, daß sie in die Stadt kämen“, eine Magd brachte ihnen Huschais Warnung für David. Als David alt war, feierte Adonija mit seinen Anhängern, „da Adonia Schafe und Rinder und gemästetes Vieh opferte bei dem Stein Soheleth, der neben dem Brunnen Rogel liegt“, während Natan und Zadok Salomo wenige hundert Meter talauf am Gihon salben ließen; der Jubel der Stadt erreichte das Fest und beendete Adonijas Griff nach dem Thron. Den Stein Soheleth sucht man manchmal an der Felsböschung ez-Zahweileh in Silwan."
    - "Bir Ayyub liegt heute in Silwan in Ostjerusalem, unterhalb dessen der Kidron als Wadi en-Nar weiter zur Wüste fließt. Der Garten des Königs in den Büchern der Könige und bei Nehemia lag nahe dem Teich Siloah, unmittelbar oberhalb davon, und der Talboden wird noch immer bebaut."
  fr:
    - "En-Roguel, peut-être « la source du foulon », était une source à la jonction des vallées du Cédron et de Hinnom, juste au sud de Jérusalem, à la frontière entre Juda et Benjamin. On l’identifie généralement à Bir Ayyub, le « puits de Job », puits profond du quartier de Silwan, sous la Cité de David, qui déborde comme une source après de fortes pluies ; c’est l’identification habituelle, bien que Clermont-Ganneau et d’autres aient plaidé pour la source du Guihon. Dès le XVIe siècle, le puits fut aussi appelé puits de Néhémie, pris pour la fosse où les prêtres avaient caché le feu sacré lors de l’exil."
    - "Chez Josué, la frontière de Juda « passait près des eaux d’En-Schémesch, et se prolongeait jusqu’à En-Roguel », puis montait « par la vallée de Ben-Hinnom au côté méridional de Jebus » ; la frontière de Benjamin la rejoint à la même source. Lors de la révolte d’Absalom, « Jonathan et Achimaats se tenaient à En-Roguel. Une servante vint leur dire d’aller informer le roi David ; car ils n’osaient pas se montrer et entrer dans la ville » (elle portait l’avis de Huschaï). Quand David fut vieux, « Adonija tua des brebis, des bœufs et des veaux gras, près de la pierre de Zohéleth, qui est à côté d’En-Roguel », et fêta ses partisans, tandis que Nathan et Tsadok faisaient oindre Salomon au Guihon, quelques centaines de mètres en amont ; la clameur de la ville parvint au festin et mit fin à sa tentative. On cherche parfois la pierre de Zohéleth dans l’escarpement de Silwan appelé ez-Zahweileh."
    - "Bir Ayyub se trouve aujourd’hui à Silwan, à Jérusalem-Est ; en dessous, le Cédron poursuit vers le désert sous le nom de Wadi en-Nar. Le jardin du roi des Rois et de Néhémie se trouvait près du bassin de Siloé, juste au-dessus, et le fond de la vallée est encore cultivé."
  it:
    - "En-Roghel, forse «la sorgente del follatore», era una sorgente alla confluenza delle valli del Cedron e dell’Hinnom, subito a sud di Gerusalemme, sul confine fra Giuda e Beniamino. Si identifica in genere con Bir Ayyub, il «Pozzo di Giobbe», un pozzo profondo nel quartiere di Silwan sotto la Città di Davide, che dopo forti piogge trabocca come una sorgente; è l’identificazione abituale, benché Clermont-Ganneau e altri abbiano sostenuto la sorgente del Ghicon. Dal XVI secolo il pozzo fu chiamato anche Pozzo di Neemia, ritenuto la fossa in cui i sacerdoti avevano nascosto il fuoco sacro al tempo dell’esilio."
    - "Giosuè fa scendere il confine di Giuda da En-Semes in modo che «faceva capo a En-Roghel», poi risalire «per la valle di Ben-Hinnom fino al versante meridionale del monte de’ Gebusei»; il confine di Beniamino lo incontra alla stessa sorgente. Nella rivolta di Assalonne «Gionathan e Ahimaats stavano appostati presso En-Roghel … non potevano entrare in città in modo palese», e una serva portò loro fuori l’avviso di Cusai per Davide. Nella vecchiaia di Davide, Adonia «immolò pecore, buoi e vitelli grassi vicino al masso di Zohelet che è accanto alla fontana di Roghel» e banchettò con i suoi sostenitori, mentre Natan e Zadok facevano ungere Salomone al Ghicon, poche centinaia di metri a monte; il clamore della città giunse al banchetto e pose fine alla pretesa di Adonia. La pietra di Zohelet è a volte cercata nella scarpata rocciosa di Silwan detta ez-Zahweileh."
    - "Bir Ayyub si trova oggi a Silwan, a Gerusalemme Est, sotto la quale il Cedron prosegue verso il deserto come Wadi en-Nar. Il giardino del re dei libri dei Re e di Neemia sorgeva presso la piscina di Siloe, appena sopra, e il fondovalle è ancora coltivato."
  pl:
    - "En-Rogel, być może „źródło folusznika”, było źródłem u zbiegu dolin Cedronu i Hinnom tuż na południe od Jerozolimy, na granicy między Judą a Beniaminem. Zwykle utożsamia się je z Bir Ajjub, „Studnią Hioba”, głęboką studnią w dzielnicy Silwan poniżej Miasta Dawida, która po silnych deszczach przelewa się jako źródło; jest to zwykłe utożsamienie, choć Clermont-Ganneau i inni dowodzili źródła Gichon. Od XVI w. studnię nazywano także Studnią Nehemiasza, uważając ją za dół, w którym kapłani ukryli święty ogień w czasie wygnania."
    - "Jozue prowadzi granicę Judy w dół od En-Szemesz tak, że „kończy się u studnicy Rogiel”, a potem w górę „przez dolinę syna Hennomowego po bok Jebuzejczyka od południa”; granica Beniamina spotyka ją przy tym samym źródle. W buncie Absaloma „Jonatan i Achimmas stali u studni Rogiel: … bo się nie śmieli ukazać, ani wnijść do miasta”, a dziewka wyniosła im ostrzeżenie Chuszaja dla Dawida. Gdy Dawid był stary, „nabił Adonijasz owiec, i wołów, i bydła tłustego u kamienia Zohelet, który był nad źródłem Rogiel”, i ucztował ze swymi zwolennikami, podczas gdy Natan i Sadok namaścili Salomona w Gichon kilkaset metrów w górę doliny; okrzyk miasta dotarł do uczty i zakończył zabiegi Adoniasza. Kamienia Zohelet szuka się czasem w skalnym zboczu Silwan zwanym ez-Zahwejle."
    - "Bir Ajjub leży dziś w Silwan we Wschodniej Jerozolimie, poniżej którego Cedron biegnie dalej ku pustyni jako Wadi en-Nar. Królewski ogród z Księgi Królewskiej i Nehemiasza leżał blisko sadzawki Siloe, tuż nad nią, a dno doliny jest wciąż uprawiane."
  nl:
    - "En-Rogel, misschien “de bron van de voller”, was een bron bij de samenkomst van het Kidron- en het Hinnomdal even ten zuiden van Jeruzalem, op de grens tussen Juda en Benjamin. Zij wordt algemeen geïdentificeerd met Bir Ayyub, “Jobsput”, een diepe put in de wijk Silwan onder de Stad van David, die na zware regens als bron overstroomt; dit is de gebruikelijke identificatie, al bepleitten Clermont-Ganneau en anderen de Gihon-bron. Vanaf de zestiende eeuw heette de put ook de Put van Nehemia, gehouden voor de kuil waarin de priesters bij de ballingschap het heilige vuur hadden verborgen."
    - "Jozua laat de grens van Juda van En-Semes afdalen zodat “haar uitgangen zullen wezen te En-rogel”, dan omhoog “door het dal van den zoon van Hinnom, aan de zijde van den Jebusiet van het zuiden”; Benjamins grens ontmoet haar bij dezelfde bron. In Absaloms opstand “Jonathan nu en Ahimaaz stonden bij de fontein Rogel”, “want zij mochten zich niet zien laten, dat zij in de stad kwamen”, en een dienstmaagd bracht Chusai's waarschuwing naar hen voor David. Op Davids oude dag “Adonia slachtte schapen en runderen, en gemest vee bij den steen Zoheleth, die bij de fontein Rogel is” en onthaalde zijn aanhang, terwijl Natan en Sadok Salomo bij de Gihon lieten zalven, enkele honderden meters verderop; het gejuich van de stad drong tot het feest door en beëindigde Adonia's greep naar de macht. De steen Zoheleth wordt soms gezocht in de rotswand van Silwan genaamd ez-Zahweileh."
    - "Bir Ayyub ligt nu in Silwan in Oost-Jeruzalem, waaronder de Kidron verder naar de woestijn loopt als Wadi en-Nar. De koningstuin van Koningen en Nehemia lag bij de vijver van Siloam, er vlak boven, en de dalbodem wordt nog bewerkt."
  cs:
    - "Én-rógel, snad „pramen valchářův“, byl pramen při soutoku údolí Kidronu a Hinnomu hned jižně od Jeruzaléma, na hranici mezi Judou a Benjamínem. Obecně se ztotožňuje s Bir Ayyub, „Jóbovou studnou“, hlubokou studnou ve čtvrti Silwan pod Městem Davidovým, která po silných deštích přetéká jako pramen; je to obvyklé ztotožnění, ač Clermont-Ganneau a jiní hájili pramen Gichón. Od 16. století se studna nazývala také Nehemjášova studna, pokládaná za jámu, v níž kněží při vyhnanství ukryli posvátný oheň."
    - "Jozue vede hranici Judy dolů od Én-šemeše tak, že „skonává se u studnice Rogel“, pak vzhůru „přes údolí synů Hinnom k straně Jebus od poledne“; hranice Benjamínova se s ní u téhož pramene setkává. Při Abšalomově vzpouře „Jonata pak a Achimaas stáli u studnice Rogel“, „nebo nesměli se ukázati aneb vjíti do města“, a děvečka jim donesla Chušajovo varování pro Davida. Když byl David starý, Adonijáš „nabil ovcí a volů a krmného dobytka u kamene Zohelet, kterýž byl u studnice Rogel“ a hodoval se svými příznivci, zatímco Nátan a Sádok nechali Šalomouna pomazat u Gichónu několik set metrů výše v údolí; křik města dolehl k hostině a ukončil Adonijášovu snahu. Kámen Zohelet se někdy hledá ve skalním srázu Silwanu zvaném ez-Zahweileh."
    - "Bir Ayyub leží dnes v Silwanu ve východním Jeruzalémě, pod nímž Kidron běží dál k poušti jako Wadi en-Nar. Královská zahrada z Knih králů a Nehemjáše ležela poblíž rybníka Siloe, těsně nad ním, a dno údolí se dosud obdělává."
  sv:
    - "En-Rogel, kanske ”valkarens källa”, var en källa vid mötet mellan Kidron- och Hinnomdalarna strax söder om Jerusalem, vid gränsen mellan Juda och Benjamin. Den identifieras i allmänhet med Bir Ayyub, ”Jobs brunn”, en djup brunn i stadsdelen Silwan nedanför Davids stad, som flödar över som en källa efter kraftiga regn; detta är den vanliga identifieringen, fastän Clermont-Ganneau och andra argumenterade för Gihonkällan. Från 1500-talet kallades brunnen också Nehemjas brunn, ansedd som gropen där prästerna hade gömt den heliga elden vid exilen."
    - "Josua för Judas gräns ner från En-Shemesh så att den gick ”fram till Semeskällans vatten och så ut till Rogelskällan”, sedan upp i ”Hinnoms sons dal, söder om Jebus’ höjd”; Benjamins gräns möter den vid samma källa. Under Absaloms uppror hade ”Jonatan och Ahimaas sitt tillhåll vid Rogelskällan … Ty de tordes icke gå in i staden och visa sig där”, och en tjänstekvinna bar Hushajs varning ut till dem för Davids räkning. När David var gammal slaktade Adonia ”får och fäkreatur och gödkalvar vid Soheletstenen, som ligger vid Rogelskällan” och gästade sina anhängare, medan Natan och Sadok lät smörja Salomo vid Gihon några hundra meter uppför dalen; stadens jubel nådde festen och gjorde slut på Adonias försök. Soheletstenen söks ibland i Silwans klippbrant som kallas ez-Zahweileh."
    - "Bir Ayyub ligger i dag i Silwan i Östjerusalem, nedanför vilken Kidron fortsätter mot öknen som Wadi en-Nar. Kungens trädgård i Konungaboken och hos Nehemja låg nära Siloadammen, strax ovanför, och dalbottnen odlas fortfarande."
  nb:
    - "En-Rogel, kanskje «fullerens kilde», var en kilde der Kedron- og Hinnom-dalene møtes like sør for Jerusalem, på grensen mellom Juda og Benjamin. Den identifiseres vanligvis med Bir Ayyub, «Jobs brønn», en dyp brønn i Silwan-kvarteret under Davidsbyen, som renner over som en kilde etter kraftig regn; dette er den vanlige identifiseringen, selv om Clermont-Ganneau og andre argumenterte for Gihon-kilden. Fra 1500-tallet ble brønnen også kalt Nehemjas brønn, regnet for gropen der prestene hadde skjult den hellige ilden ved eksilet."
    - "Josva fører Judas grense ned fra En-Sjemesj slik at den «gikk så over til vannet ved En-Semes og frem til En-Rogel», så opp «til Hinnoms sønns dal, til sydsiden av Jebus»; Benjamins grense møter den ved samme kilde. Under Absaloms opprør holdt Jonatan og Akima'as seg «i En-Rogel … for de torde ikke gå inn i byen og la sig se der», og en tjenestepike bar Husjais advarsel ut til dem for David. Da David var gammel, slaktet Adonja «får og okser og gjøkalver ved Sohelet-stenen, som er ved En-Rogel» og holdt fest for sine støttespillere, mens Natan og Sadok lot Salomo salve ved Gihon noen hundre meter opp i dalen; byens jubel nådde festen og gjorde slutt på Adonjas forsøk. Sohelet-stenen søkes noen ganger i fjellskrenten i Silwan som kalles ez-Zahweileh."
    - "Bir Ayyub ligger i dag i Silwan i Øst-Jerusalem, og nedenfor løper Kedron videre mot ørkenen som Wadi en-Nar. Kongens hage i Kongebøkene og hos Nehemja lå nær Siloa-dammen, like ovenfor, og dalbunnen er fremdeles dyrket."
  tl:
    - "Ang En-rogel, marahil “bukal ng tagapagbanlaw”, ay isang bukal sa pagtatagpo ng mga libis ng Cedron at Hinnom sa timog lamang ng Jerusalem, sa hangganan ng Juda at Benjamin. Karaniwan itong kinikilala sa Bir Ayyub, “Balon ni Job”, isang malalim na balon sa purok ng Silwan sa ibaba ng Bayan ni David, na umaapaw bilang bukal pagkatapos ng malalakas na ulan; ito ang karaniwang pagkilala, bagaman nangatwiran sina Clermont-Ganneau at iba para sa bukal ng Gihon. Mula ika-16 na siglo, tinawag ding Balon ni Nehemias ang balon, na itinuring na hukay kung saan itinago ng mga saserdote ang banal na apoy sa pagkatapon."
    - "Ibinababa ni Josue ang hangganan ng Juda mula sa En-semes upang “ang mga labasan niyaon ay sa En-rogel”, saka sa “libis ng anak ni Hinnom hanggang sa dako ng Jebuseo na dakong timugan”; doon din sumasalubong ang hangganan ng Benjamin. Sa paghihimagsik ni Absalom, “si Jonathan at si Ahimaas nga ay nagsitigil sa tabi ng Enrogel”, sapagkat “sila'y hindi makapakitang pumasok sa bayan”, at dinala sa kanila ng isang alila ang babala ni Husai para kay David. Nang matanda na si David, “nagpatay si Adonia ng mga tupa, at mga baka at ng mga pinataba sa siping ng bato ng Zoheleth, na nasa tabi ng Enrogel” para sa kaniyang mga tagasuporta, samantalang ipinahiran nina Nathan at Sadoc si Salomon sa Gihon, ilang daang metro pataas; ang hiyaw ng lungsod ay umabot sa kapistahan at tinapos ang pagtatangka ni Adonia. Kung minsan ay hinahanap ang bato ng Zoheleth sa gilid ng Silwan, ang ez-Zahweileh."
    - "Ang Bir Ayyub ay nasa Silwan sa Silangang Jerusalem ngayon, na sa ibaba nito ay tumatakbo ang Cedron patungong disyerto bilang Wadi en-Nar. Ang hardin ng hari ng Mga Hari at Nehemias ay malapit sa tangke ng Siloe, sa itaas lamang nito, at sinasaka pa rin ang sahig ng libis."
  da:
    - "En-Rogel, måske »valkerens kilde«, var en kilde ved sammenløbet af Kedron- og Hinnom-dalene lige syd for Jerusalem, på grænsen mellem Juda og Benjamin. Den identificeres almindeligvis med Bir Ayyub, »Jobs brønd«, en dyb brønd i Silwan-kvarteret neden for Davidsbyen, som løber over som en kilde efter kraftig regn; dette er den sædvanlige identifikation, selv om Clermont-Ganneau og andre argumenterede for Gihon-kilden. Fra 1500-tallet blev brønden også kaldt Nehemias' brønd, anset for den cisterne, hvor præsterne havde skjult den hellige ild ved eksilet."
    - "Josva fører Judas grænse ned fra En-Sjemesj, så »Udgangen derpaa er En-Rogel«, derefter op ad »Hinnoms Søns Dal, mod den søndre Side af Jebus«; Benjamins grænse møder den ved den samme kilde. Under Absalons oprør hedder det: »Jonathan og Ahimaaz stode ved En-Rogel«, og de »turde ikke lade sig se og komme i Staden«; en tjenestepige bar Husjajs advarsel ud til dem til David. Da David var gammel, »slagtede stort Kvæg og smaat Kvæg og fedt Kvæg ved Soheleths Sten, som ligger ved En-Rogel« Adonija og gæstede sine tilhængere, mens Natan og Zadok lod Salomo salve ved Gihon nogle hundrede meter oppe i dalen; byens råb nåede festen og gjorde ende på Adonijas forsøg. Soheleths sten søges undertiden i Silwans klippeskrænt kaldet ez-Zahweileh."
    - "Bir Ayyub ligger i dag i Silwan i Østjerusalem, neden for hvilken Kedron løber videre mod ørkenen som Wadi en-Nar. Kongens have i Kongebøgerne og hos Nehemias lå nær Siloam-dammen, lige ovenfor, og dalbunden er stadig dyrket."
  sr:
    - "Ен-Рогил, можда „извор перача“, био је извор на састајању долина Кедрон и Хином одмах јужно од Јерусалима, на граници између Јуде и Венијамина. Обично се поистовећује са Бир Ајубом, „Јововим бунаром“, дубоким бунаром у четврти Силван испод Давидовог града, који после јаких киша прелива као извор; то је уобичајено поистовећивање, мада су Клермон-Гано и други заступали извор Гион. Од 16. века бунар се звао и Немијин бунар, сматран јамом у којој су свештеници сакрили свети огањ при изгнанству."
    - "Исус Навин спушта међу Јудину од Ен-Семеса тако да „удара у студенац Рогил“, затим горе „преко долине синова Еномових покрај Јевусеја с југа“; Венијаминова међа сусреће се с њом на истом извору. У Авесаломовој буни „Јонатан и Ахимас стајаху код студенца Рогила … јер се не смеху показати ни ући у град“, а слушкиња им је изнела Хусајево упозорење за Давида. Када је Давид остарио, Адонија, како стоји, „накла Адонија оваца и волова и угојене стоке код камена Зоелета, који је код извора Рогила“ и угостио своје присталице, док су Натан и Садок дали да се Соломун помаза на Гиону неколико стотина метара узводно долином; вика града допрла је до гозбе и окончала Адонијин покушај. Камен Зоелет понекад се тражи у стеновитој литици Силвана која се зове ез Захвејле."
    - "Бир Ајуб данас лежи у Силвану у Источном Јерусалиму, испод кога Кедрон тече даље ка пустињи као Вади ен Нар. Краљев врт из Књиге о царевима и Немије лежао је близу Силоамског базена, одмах изнад њега, а дно долине се и даље обрађује."
