# Overview article (ADR 0007). Mainstream facts only; Bir Ayyub is the generally accepted identification and is given as such.
id: en-rogel
place: af9cfc9
title:
  en: "En-rogel"
  ru: "Ен-Рогел"
  uk: "Ен-Рогел"
  es: "En-rogel"
  pt: "En-Rogel"
  de: "En-Rogel"
  fr: "En-Roguel"
  it: "En-Roghel"
  pl: "En-Rogel"
  nl: "En-Rogel"
