body:
  en:
    - "The Areopagus, “hill of Ares”, is a low outcrop of bare limestone in Athens, just north-west of the Acropolis and above the Agora. Its name passed to the ancient council that met there, the oldest court of Athens; Aeschylus tells how Athena founded it to try Orestes, and Pausanias says the hill was named for Ares, the first to be tried on it. In classical times the council judged homicide; under Rome it regained wide authority over the city's religion and education."
    - "In Athens Paul argued in the synagogue and daily in the market, and some philosophers “took him, and brought him unto Areopagus, saying, May we know what this new doctrine, whereof thou speakest, is?” There “Paul stood in the midst of Mars’ hill”, began from an altar inscribed “TO THE UNKNOWN GOD”, and spoke of the God who made the world and will judge it by the man he raised from the dead. At the resurrection some mocked; “so Paul departed from among them”, but a few believed, among them Dionysius the Areopagite, a member of the council, and a woman named Damaris. Whether Paul spoke on the hill itself or before the council sitting in the Agora, perhaps in the Royal Stoa, is disputed."
    - "Dionysius of Corinth, quoted by Eusebius, calls the Areopagite the first bishop of Athens. Today the hill is a bare rock reached by worn steps, a lookout over the Agora, and a bronze plaque at its foot carries Paul's speech in Greek."
  ru:
    - "Ареопаг, «холм Ареса», — невысокая голая известняковая скала в Афинах, к северо-западу от Акрополя над Агорой. Его имя перешло к древнему совету, заседавшему там, — старейшему суду Афин; Эсхил рассказывает, как Афина учредила его, чтобы судить Ореста, а Павсаний пишет, что холм назван по Аресу, которого первым судили здесь. В классическое время совет разбирал дела об убийстве; при римлянах он вновь получил широкую власть над религией и воспитанием в городе."
    - "В Афинах Павел рассуждал в синагоге и ежедневно на площади, и некоторые философы, «взяв его, привели в ареопаг и говорили: можем ли мы знать, что это за новое учение, проповедуемое тобою?» Там, «став Павел среди ареопага», он начал с жертвенника с надписью «неведомому Богу» и говорил о Боге, Который сотворил мир и будет судить его через Мужа, воскрешённого Им из мёртвых. Услышав о воскресении, одни насмехались; «итак Павел вышел из среды их», но некоторые уверовали, и среди них Дионисий Ареопагит, член совета, и женщина по имени Дамарь. Говорил ли Павел на самом холме или перед советом, заседавшим на Агоре, быть может в Царском портике, — спорно."
    - "Дионисий Коринфский, которого цитирует Евсевий, называет Ареопагита первым епископом Афин. Сегодня холм — голая скала со стёртыми ступенями и смотровая площадка над Агорой, а бронзовая доска у его подножия несёт речь Павла по-гречески."
  uk:
    - "Ареопаг, «пагорб Ареса», — низький виступ голого вапняку в Афінах, трохи на північний захід від Акрополя і над Агорою. Його назва перейшла на давню раду, що там збиралася, найдавніший суд Афін; Есхіл розповідає, як Афіна заснувала його, щоб судити Ореста, а Павсаній каже, що пагорб названо за Ареса, який першим був на ньому судимий. У класичні часи рада судила вбивства; за Рима вона знову здобула широку владу над релігією та освітою міста."
    - "В Афінах Павло сперечався в синагозі й щодня на торжищі, і деякі філософи, «схопивши його, повели в Ареопаг, говорячи: Чи можемо знати, що се ти за нову таку науку проповідуєш?» Там «ставши ж Павел посерединї Ареопага», він почав від жертовника з написом «Невідомому Богу» і говорив про Бога, що створив світ і судитиме його через людину, яку воскресив із мертвих. Над воскресінням дехто сміявся; «і так Павел пійшов з посеред них», але декотрі увірували, серед них Діонісій Ареопагіт, член ради, і жінка на ймення Дамара. Чи Павло говорив на самому пагорбі, чи перед радою, що засідала в Агорі, можливо, в Царській стої, — спірне."
    - "Діонісій Коринфський, цитований Євсевієм, називає Ареопагіта першим єпископом Афін. Нині пагорб — голий камінь, на який ведуть витерті сходи, оглядовий майданчик над Агорою, а бронзова таблиця біля його підніжжя містить промову Павла грецькою."
  es:
    - "El Areópago, «colina de Ares», es un bajo peñasco de caliza desnuda en Atenas, justo al noroeste de la Acrópolis y sobre el Ágora. Su nombre pasó al antiguo consejo que se reunía allí, el tribunal más antiguo de Atenas; Esquilo cuenta cómo Atenea lo fundó para juzgar a Orestes, y Pausanias dice que la colina recibió el nombre de Ares, el primero que fue juzgado en ella. En época clásica el consejo juzgaba los homicidios; bajo Roma recuperó una amplia autoridad sobre la religión y la educación de la ciudad."
    - "En Atenas Pablo discutía en la sinagoga y cada día en el mercado, y algunos filósofos «tomándole, le trajeron al Areópago, diciendo: ¿Podremos saber qué sea esta nueva doctrina que dices?». Allí Pablo estuvo «en medio del Areópago», empezó por un altar con la inscripción «AL DIOS NO CONOCIDO» y habló del Dios que hizo el mundo y lo juzgará por medio del varón que levantó de los muertos. Ante la resurrección algunos se burlaron; «Y así Pablo se salió de en medio de ellos», pero unos pocos creyeron, entre ellos «Dionisio el del Areópago», miembro del consejo, y una mujer llamada Dámaris. Se discute si Pablo habló en la propia colina o ante el consejo reunido en el Ágora, quizá en el Pórtico Real."
    - "Dionisio de Corinto, citado por Eusebio, llama al areopagita el primer obispo de Atenas. Hoy la colina es una roca desnuda a la que se sube por escalones desgastados, un mirador sobre el Ágora, y una placa de bronce a sus pies lleva el discurso de Pablo en griego."
  pt:
    - "O Areópago, “colina de Ares”, é um afloramento baixo de calcário nu em Atenas, logo a noroeste da Acrópole e acima da Ágora. Seu nome passou ao antigo conselho que ali se reunia, o mais velho tribunal de Atenas; Ésquilo conta como Atena o fundou para julgar Orestes, e Pausânias diz que a colina recebeu o nome de Ares, o primeiro a ser julgado nela. Na época clássica o conselho julgava homicídios; sob Roma recuperou ampla autoridade sobre a religião e a educação da cidade."
    - "Em Atenas, Paulo discutia na sinagoga e diariamente no mercado, e alguns filósofos “o agarraram e o levaram ao Areópago, dizendo: ‘Podemos saber que novo ensino é este de que você está falando?’” Ali “Paulo levantou-se no meio do Areópago”, partiu de um altar com a inscrição “A UM DEUS DESCONHECIDO” e falou do Deus que fez o mundo e o julgará pelo homem que ressuscitou dentre os mortos. Ao ouvir da ressurreição, alguns zombaram; “Assim Paulo saiu do meio deles”, mas alguns creram, entre eles Dionísio, o areopagita, membro do conselho, e uma mulher chamada Dâmaris. Se Paulo falou na própria colina ou diante do conselho reunido na Ágora, talvez no Pórtico Real, é discutido."
    - "Dionísio de Corinto, citado por Eusébio, chama o areopagita de primeiro bispo de Atenas. Hoje a colina é uma rocha nua a que se chega por degraus gastos, um mirante sobre a Ágora, e uma placa de bronze ao seu pé traz o discurso de Paulo em grego."
  de:
    - "Der Areopag, „Hügel des Ares“, ist ein niedriger Kalksteinfelsen in Athen, nordwestlich der Akropolis und oberhalb der Agora. Sein Name ging auf den antiken Rat über, der dort tagte, den ältesten Gerichtshof Athens; Aischylos erzählt, wie Athene ihn einsetzte, um Orest zu richten, und Pausanias sagt, der Hügel sei nach Ares benannt, dem ersten, der auf ihm vor Gericht stand. In klassischer Zeit richtete der Rat über Tötungsdelikte; unter Rom gewann er wieder weitreichende Befugnis über Religion und Bildung der Stadt."
    - "In Athen stritt Paulus in der Synagoge und täglich auf dem Markt, und einige Philosophen „nahmen ihn aber und führten ihn auf den Gerichtsplatz und sprachen: Können wir auch erfahren, was das für eine neue Lehre sei, die du lehrst?“ Dort heißt es: „Paulus aber stand mitten auf dem Gerichtsplatz“; er ging von einem Altar mit der Inschrift „Dem unbekannten Gott“ aus und sprach von dem Gott, der die Welt gemacht hat und sie durch den Mann richten wird, den er von den Toten auferweckt hat. Bei der Auferstehung spotteten einige; „also ging Paulus von ihnen“, doch einige glaubten, darunter Dionysius Areopagita, ein Mitglied des Rates, und eine Frau namens Damaris. Ob Paulus auf dem Hügel selbst sprach oder vor dem in der Agora tagenden Rat, vielleicht in der Königshalle, ist umstritten."
    - "Dionysios von Korinth, von Eusebius zitiert, nennt den Areopagiten den ersten Bischof von Athen. Heute ist der Hügel ein kahler Fels, den man über abgetretene Stufen erreicht, ein Aussichtspunkt über der Agora, und eine Bronzetafel an seinem Fuß trägt die Rede des Paulus auf Griechisch."
  fr:
    - "L’Aréopage, « colline d’Arès », est un affleurement bas de calcaire nu à Athènes, juste au nord-ouest de l’Acropole et au-dessus de l’Agora. Son nom passa à l’antique conseil qui y siégeait, le plus ancien tribunal d’Athènes ; Eschyle raconte comment Athéna le fonda pour juger Oreste, et Pausanias dit que la colline fut nommée d’après Arès, le premier jugé sur elle. À l’époque classique, le conseil jugeait les homicides ; sous Rome, il retrouva une large autorité sur la religion et l’éducation de la cité."
    - "À Athènes, Paul discutait dans la synagogue et chaque jour sur la place publique, et des philosophes « le prirent, et le menèrent à l’Aréopage, en disant : Pourrions-nous savoir quelle est cette nouvelle doctrine que tu enseignes ? » Là, « Paul, debout au milieu de l’Aréopage », partit d’un autel portant l’inscription « A UN DIEU INCONNU ! » et parla du Dieu qui a fait le monde et le jugera par l’homme qu’il a ressuscité des morts. À la résurrection, certains se moquèrent ; « Ainsi Paul se retira du milieu d’eux », mais quelques-uns crurent, dont Denys l’Aréopagite, membre du conseil, et une femme nommée Damaris. Que Paul ait parlé sur la colline même ou devant le conseil siégeant dans l’Agora, peut-être au Portique royal, est discuté."
    - "Denys de Corinthe, cité par Eusèbe, appelle l’Aréopagite le premier évêque d’Athènes. Aujourd’hui la colline est un rocher nu auquel mènent des marches usées, un belvédère sur l’Agora, et une plaque de bronze à son pied porte en grec le discours de Paul."
  it:
    - "L’Areòpago, «colle di Ares», è un basso affioramento di nuda pietra calcarea ad Atene, subito a nord-ovest dell’Acropoli e sopra l’Agorà. Il suo nome passò all’antico consiglio che vi si riuniva, il più antico tribunale di Atene; Eschilo racconta come Atena lo fondò per giudicare Oreste, e Pausania dice che il colle prese nome da Ares, il primo a esservi giudicato. In epoca classica il consiglio giudicava l’omicidio; sotto Roma riacquistò ampia autorità sulla religione e sull’istruzione della città."
    - "Ad Atene Paolo discuteva nella sinagoga e ogni giorno sulla piazza, e alcuni filosofi «presolo con sé, lo condussero su nell’Areopàgo, dicendo: Potremmo noi sapere qual sia questa nuova dottrina che tu proponi?» Là «Paolo, stando in piè in mezzo all’Areopàgo», partì da un altare con l’iscrizione «Al dio sconosciuto», e parlò del Dio che ha fatto il mondo e lo giudicherà per mezzo dell’uomo che ha risuscitato dai morti. Alla risurrezione alcuni si fecero beffe; «Così Paolo uscì dal mezzo di loro», ma pochi credettero, fra i quali Dionigi l’Areopagita, membro del consiglio, e una donna chiamata Damaris. Se Paolo parlò sul colle stesso o davanti al consiglio riunito nell’Agorà, forse nella Stoà Reale, è discusso."
    - "Dionigi di Corinto, citato da Eusebio, chiama l’Areopagita il primo vescovo di Atene. Oggi il colle è una roccia nuda raggiunta da gradini consumati, un belvedere sull’Agorà, e una targa di bronzo ai suoi piedi reca il discorso di Paolo in greco."
  pl:
    - "Areopag, „wzgórze Aresa”, to niski występ nagiego wapienia w Atenach, tuż na północny zachód od Akropolu i nad Agorą. Jego nazwa przeszła na starożytną radę, która tam zasiadała, najstarszy sąd Aten; Ajschylos opowiada, jak Atena ustanowiła go, by sądzić Orestesa, a Pauzaniasz mówi, że wzgórze nazwano od Aresa, pierwszego sądzonego na nim. W czasach klasycznych rada sądziła zabójstwa; pod Rzymem odzyskała szeroką władzę nad religią i wychowaniem miasta."
    - "W Atenach Paweł rozprawiał w synagodze i codziennie na rynku, a niektórzy filozofowie „porwawszy go, wiedli do Areopagu, mówiąc: Możemyli wiedzieć, co to jest za nowa nauka, którą ty opowiadasz?” Tam „Paweł stanąwszy w pośrodku Areopagu” zaczął od ołtarza z napisem „NIEZNAJOMEMU BOGU” i mówił o Bogu, który stworzył świat i będzie go sądził przez męża, którego wzbudził z martwych. Na wieść o zmartwychwstaniu niektórzy szydzili; „I tak Paweł wyszedł z pośrodku ich”, lecz nieliczni uwierzyli, wśród nich Dionizy Areopagita, członek rady, i kobieta imieniem Damaris. Czy Paweł mówił na samym wzgórzu, czy przed radą zasiadającą na Agorze, może w Portyku Królewskim, jest sporne."
    - "Dionizy z Koryntu, cytowany przez Euzebiusza, nazywa Areopagitę pierwszym biskupem Aten. Dziś wzgórze to naga skała, na którą prowadzą wytarte stopnie, punkt widokowy na Agorę, a brązowa tablica u jego stóp niesie mowę Pawła po grecku."
  nl:
    - "De Areopagus, “heuvel van Ares”, is een lage uitloper van kaal kalksteen in Athene, net ten noordwesten van de Akropolis en boven de Agora. Zijn naam ging over op de oude raad die er bijeenkwam, het oudste gerecht van Athene; Aeschylus vertelt hoe Athena haar stichtte om Orestes te berechten, en Pausanias zegt dat de heuvel naar Ares was genoemd, de eerste die erop werd berecht. In de klassieke tijd oordeelde de raad over doodslag; onder Rome kreeg hij weer ruime zeggenschap over de godsdienst en het onderwijs van de stad."
    - "In Athene redetwistte Paulus in de synagoge en dagelijks op de markt, en enkele wijsgeren “namen hem, en brachten hem op de plaats, genaamd Areopagus, zeggende: Kunnen wij niet weten, welke deze nieuwe leer zij, daar gij van spreekt?” Daar stond “Paulus, staande in het midden van de plaats, genaamd Areopagus”; hij begon bij een altaar met het opschrift “DEN ONBEKENDEN GOD” en sprak over de God die de wereld maakte en haar zal oordelen door de man die Hij uit de doden opwekte. Bij de opstanding spotten sommigen; “alzo is Paulus uit het midden van hen uitgegaan”, maar enkelen geloofden, onder wie Dionysius de Areopagiet, een lid van de raad, en een vrouw met de naam Damaris. Of Paulus op de heuvel zelf sprak of voor de raad die in de Agora zat, misschien in de Koninklijke Stoa, is omstreden."
    - "Dionysius van Korinthe, aangehaald door Eusebius, noemt de Areopagiet de eerste bisschop van Athene. Tegenwoordig is de heuvel een kale rots die men via versleten treden bereikt, een uitkijkpunt over de Agora, en een bronzen plaquette aan zijn voet draagt Paulus’ rede in het Grieks."
  cs:
    - "Areopag, „pahorek Árův“, je nízký výchoz holého vápence v Aténách, severozápadně od Akropole a nad Agorou. Jeho jméno přešlo na prastarou radu, která se tam scházela, nejstarší soud Atén; Aischylos vypráví, jak jej Athéna založila, aby soudil Oresta, a Pausaniás praví, že pahorek byl pojmenován po Árovi, který byl na něm souzen jako první. V klasické době rada soudila vraždy; pod Římem znovu získala široký vliv nad náboženstvím a vzděláváním města."
    - "V Aténách Pavel rozmlouval v synagoze a denně na tržišti a někteří filozofové ho „popadše jej, vedli ho do Areopágu, a řekli jemu: Můžeme-li věděti, jaké jest to učení nové, kteréž vypravuješ?“ Tam „Pavel, stoje uprostřed Areopágu“, začal od oltáře s nápisem „Neznámému Bohu“ a mluvil o Bohu, který stvořil svět a bude jej soudit skrze muže, kterého vzkřísil z mrtvých. Při vzkříšení se někteří posmívali; „A tak Pavel vyšel z prostředku jejich“, ale někteří uvěřili, mezi nimi „Dionyzius Areopagitský“, člen rady, a žena jménem Damaris. Zda Pavel mluvil na samotném pahorku, nebo před radou zasedající na Agoře, snad v Královské stoe, je sporné."
    - "Dionýsios Korintský, citovaný Eusebiem, nazývá Areopagitu prvním biskupem Atén. Dnes je pahorek holou skálou, na kterou vedou obroušené schody, vyhlídkou nad Agorou, a bronzová deska u jeho paty nese Pavlovu řeč v řečtině."
  sv:
    - "Areopagen, ”Ares kulle”, är en låg utlöpare av bar kalksten i Aten, strax nordväst om Akropolis och ovanför Agoran. Dess namn gick över till det forntida råd som sammanträdde där, Atens äldsta domstol; Aischylos berättar hur Athena grundade det för att döma Orestes, och Pausanias säger att kullen fick sitt namn efter Ares, den förste som dömdes på den. Under klassisk tid dömde rådet i mordmål; under Rom återfick det vidsträckt myndighet över stadens religion och undervisning."
    - "I Aten förde Paulus samtal i synagogan och dagligen på torget, och några filosofer ”grepo honom och förde honom till Areopagen och sade: ’Kunna vi få veta vad det är för en ny lära som du förkunnar?’” Där ”trädde Paulus fram mitt på Areopagen”, utgick från ett altare med inskriften ”Åt en okänd Gud” och talade om Gud som har gjort världen och skall döma den genom den man han uppväckt från de döda. Vid uppståndelsen drev somliga gäck; ”gick Paulus bort ifrån dem”, men några kom till tro, bland dem Dionysios Areopagiten, medlem av rådet, och en kvinna vid namn Damaris. Om Paulus talade på själva kullen eller inför rådet som sammanträdde på Agoran, kanske i Kungliga stoan, är omstritt."
    - "Dionysios av Korinth, citerad av Eusebios, kallar Areopagiten Atens förste biskop. I dag är kullen en bar klippa som nås över slitna trappsteg, en utsiktsplats över Agoran, och en bronsplakett vid dess fot bär Paulus’ tal på grekiska."
  nb:
    - "Areopagos, «Ares' høyde», er et lavt utspring av bar kalkstein i Aten, like nordvest for Akropolis og over Agora. Navnet gikk over til det gamle rådet som møttes der, Atens eldste domstol; Aiskylos forteller hvordan Athene grunnla det for å dømme Orestes, og Pausanias sier at høyden ble oppkalt etter Ares, den første som ble dømt der. I klassisk tid dømte rådet i drapssaker; under Roma fikk det igjen vid myndighet over byens religion og utdanning."
    - "I Aten diskuterte Paulus i synagogen og daglig på torvet, og noen filosofer «tok ham ved hånden og førte ham op på Areopagus, og sa: Kan vi få vite hvad dette er for en ny lære som du forkynner?» Der «stod da Paulus frem midt på Areopagus», tok utgangspunkt i et alter med innskriften «For en ukjent Gud», og talte om Gud som skapte verden og skal dømme den ved mannen han reiste opp fra de døde. Ved oppstandelsen spottet noen; «Dermed gikk da Paulus bort fra dem», men noen få kom til troen, blant dem Dionysios areopagitten, medlem av rådet, og en kvinne ved navn Damaris. Om Paulus talte på selve høyden eller for rådet som satt i Agora, kanskje i Kongestoaen, er omstridt."
    - "Dionysios av Korint, sitert av Eusebius, kaller areopagitten Atens første biskop. I dag er høyden en bar klippe som nås med slitte trinn, et utkikkspunkt over Agora, og en bronseplakett ved foten bærer Paulus' tale på gresk."
  tl:
    - "Ang Areopago, “burol ni Ares”, ay mababang labas na hubad na batong apog sa Atenas, sa hilagang-kanluran lamang ng Acropolis at sa itaas ng Agora. Ang pangalan nito ay napunta sa sinaunang konsehong nagpulong doon, ang pinakamatandang hukuman ng Atenas; isinasalaysay ni Aeschylus kung paanong itinatag ito ni Atenea upang litisin si Orestes, at sinasabi ni Pausanias na ipinangalan ang burol kay Ares, ang unang nilitis doon. Sa panahong klasiko, hinahatulan ng konseho ang pagpatay; sa ilalim ng Roma, nabawi nito ang malawak na kapangyarihan sa relihiyon at edukasyon ng lungsod."
    - "Sa Atenas, nangatwiran si Pablo sa sinagoga at araw-araw sa pamilihan, at ilang pilosopo ang “tinangnan nila, at dinala siya sa Areopago, na sinasabi, Mangyayari bagang maalaman namin kung ano itong bagong aral, na sinasalita mo?” Doon, “tumindig si Pablo sa gitna ng Areopago”, nagsimula sa isang dambanang may sulat na “SA ISANG DIOS NA HINDI KILALA”, at nagsalita tungkol sa Diyos na gumawa ng sanlibutan at hahatol dito sa pamamagitan ng lalaking binuhay niya mula sa mga patay. Sa pagkabuhay na maguli, nanglibak ang ilan; “Sa gayo'y umalis si Pablo sa gitna nila”, ngunit ilan ang sumampalataya, kabilang si Dionisio na Areopagita, kasapi ng konseho, at isang babaeng nagngangalang Damaris. Pinagtatalunan kung nagsalita si Pablo sa mismong burol o sa harap ng konsehong nagpupulong sa Agora, marahil sa Maharlikang Stoa."
    - "Tinatawag ni Dionisio ng Corinto, na sinipi ni Eusebio, ang Areopagita na unang obispo ng Atenas. Ngayon ang burol ay hubad na batong inaakyat sa mga gasgas na hagdan, isang tanawan sa Agora, at may tansong plake sa paanan nito ang pangaral ni Pablo sa Griyego."
  da:
    - "Areopagos, »Ares' høj«, er en lav fremspringende klippe af bar kalksten i Athen, lige nordvest for Akropolis og over Agora. Dens navn gik videre til det gamle råd, der mødtes dér, Athens ældste domstol; Aischylos fortæller, hvordan Athene grundlagde det for at dømme Orestes, og Pausanias siger, at højen blev opkaldt efter Ares, den første, der blev dømt dér. I klassisk tid dømte rådet i drabssager; under Rom fik det igen vid myndighed over byens religion og uddannelse."
    - "I Athen disputerede Paulus i synagogen og daglig på torvet, og nogle filosoffer »toge ham og førte ham op paa Areopagus og sagde: Kunne vi faa at vide, hvad dette er for en ny Lære, som du taler om?« Dér stod Paulus »frem midt paa Areopagus«, begyndte ud fra et alter med indskriften »For en ukendt Gud« og talte om Gud, som skabte verden og vil dømme den ved den mand, han oprejste fra de døde. Ved opstandelsen spottede nogle; »saaledes gik Paulus ud fra dem«, men nogle få troede, blandt dem Dionysios Areopagiten og en kvinde ved navn Damaris. Om Paulus talte på selve højen eller for rådet, der sad i Agora, måske i Kongestoaen, er omstridt."
    - "Dionysios af Korinth, citeret af Eusebius, kalder areopagiten Athens første biskop. I dag er højen en bar klippe, nået ad slidte trin, et udsigtspunkt over Agora, og en bronzeplade ved foden bærer Paulus' tale på græsk."
