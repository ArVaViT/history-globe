# Overview article (ADR 0007). Mainstream facts only; whether Paul spoke on the hill or before the council elsewhere is named as disputed.
id: areopagus
place: a815d89
title:
  en: "Areopagus"
  ru: "Ареопаг"
  uk: "Ареопаг"
