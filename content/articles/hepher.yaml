body:
  en:
    - "Hepher was a Canaanite royal town whose king appears in the list of kings Joshua defeated: “The king of Tappuah, one; the king of Hepher, one”. Under Solomon “all the land of Hepher” belonged to the third of his twelve districts, governed by Ben-hesed in Aruboth together with Socoh. Hepher is also the name of a clan of Manasseh, the father of Zelophehad, whose daughters won the right to inherit, and the town and its land are generally taken to have lain in the territory of that clan, in northern Samaria or the Sharon plain."
    - "Its site is debated. The map follows Adam Zertal's identification with Tell el-Muhaffar, a large mound in the Dothan valley, in the hills west of Jenin, which he studied in his survey of Manasseh; earlier scholars preferred Tel Hefer (Tell Ibshar) on the coastal plain, in the modern Hefer Valley, and Tel Dothan itself has been proposed. The two verses tell nothing else, and the question remains open."
  ru:
    - "Хефер был ханаанским царским городом, чей царь стоит в списке царей, побеждённых Иисусом Навином: «один царь Таппуаха, один царь Хефера». При Соломоне «вся земля Хефер» входила в третий из двенадцати его округов, которым ведал Бен-Хесед в Арюбофе вместе с Соко. Хефер — также имя рода Манассии, отца Салпаада, чьи дочери добились права наследовать, и город с его землёй обычно помещают во владениях этого рода, на севере Самарии или на равнине Сарон."
    - "Его место спорно. Карта следует отождествлению Адама Зерталя с Телль-эль-Мухаффаром, большим холмом в Дофанской долине, к западу от Дженина, который он изучал при обследовании земли Манассии; прежние исследователи предпочитали Тель-Хефер (Телль-Ибшар) на прибрежной равнине, в нынешней долине Хефер, а предлагали и сам Тель-Дофан. Два стиха больше ничего не говорят, и вопрос остаётся открытым."
  uk:
    - "Хефер був ханаанським царським містом, чий цар з’являється в переліку царів, яких розбив Ісус Навин: «Царь Таппуахський, один; царь Хеферський, один». За Соломона «все займище Хеферське» належало до третьої з його дванадцяти округ, якою керував Бен-Хесед в Аруботі разом із Сохо. Хефер — також ім’я роду Манасії, батька Салпаада, чиї дочки здобули право на спадок, і місто та його земля, як загально вважають, лежали на території того роду, на півночі Самарії або на рівнині Шарон."
    - "Його місце спірне. Карта йде за ототожненням Адама Зертала з Телль-ель-Мухаффар, великим городищем у долині Дофан, у пагорбах на захід від Дженіна, яке він вивчав у своєму обстеженні Манасії; раніші дослідники надавали перевагу Тель-Хеферу (Телль-Ібшар) на прибережній рівнині, у нинішній долині Хефер, а також пропонували сам Тель-Дофан. Ці два вірші нічого більше не кажуть, і питання лишається відкритим."
  es:
    - "Hefer era una ciudad real cananea cuyo rey figura en la lista de reyes que derrotó Josué: «El rey de Tappua, otro: el rey de Hepher, otro». Bajo Salomón toda la tierra de Hefer pertenecía al tercero de sus doce distritos, gobernado por Ben-hesed en Arubot junto con Soco. Hefer es también el nombre de un clan de Manasés, padre de Zelofehad, cuyas hijas ganaron el derecho a heredar, y la población y su tierra se tienen generalmente por situadas en el territorio de ese clan, en el norte de Samaria o en la llanura de Sarón."
    - "Su emplazamiento es discutido. El mapa sigue la identificación de Adam Zertal con Tell el-Muhaffar, un gran montículo en el valle de Dotán, en las colinas al oeste de Yenín, que estudió en su prospección de Manasés; estudiosos anteriores preferían Tel Hefer (Tell Ibshar), en la llanura costera, en el actual valle de Hefer, y también se ha propuesto el propio Tel Dotán. Los dos versículos no dicen nada más, y la cuestión sigue abierta."
  pt:
    - "Héfer era uma cidade real cananeia cujo rei aparece na lista dos reis que Josué derrotou: “o rei de Tapua, um; o rei de Héfer, um”. Sob Salomão, “toda a terra de Héfer” pertencia ao terceiro de seus doze distritos, governado por Ben-Hesede em Arubote, juntamente com Socó. Héfer é também o nome de um clã de Manassés, pai de Zelofeade, cujas filhas conquistaram o direito de herdar, e a cidade e sua terra são geralmente tomadas como situadas no território desse clã, no norte de Samaria ou na planície de Sarom."
    - "Seu sítio é debatido. O mapa segue a identificação de Adam Zertal com Tell el-Muhaffar, um grande monte no vale de Dotã, nas colinas a oeste de Jenin, que ele estudou em sua prospecção de Manassés; estudiosos anteriores preferiam Tel Hefer (Tell Ibshar), na planície costeira, no moderno vale de Hefer, e o próprio Tel Dotã também foi proposto. Os dois versículos não dizem mais nada, e a questão permanece em aberto."
  de:
    - "Hefer war eine kanaanitische Königsstadt, deren König in der Liste der von Josua besiegten Könige erscheint: „der König zu Thappuah, der König zu Hepher“. Unter Salomo gehörte „das ganze Land Hepher“ zum dritten seiner zwölf Bezirke, den Ben-Hesed in Arubbot zusammen mit Socho verwaltete. Hefer ist auch der Name einer Sippe Manasses und ihres Stammvaters, des Vaters Zelofhads, dessen Töchter das Erbrecht erstritten, und die Stadt und ihr Land lagen nach allgemeiner Annahme im Gebiet dieser Sippe, im nördlichen Samaria oder in der Scharonebene."
    - "Ihre Lage ist umstritten. Die Karte folgt Adam Zertals Gleichsetzung mit Tell el-Muhaffar, einem großen Hügel im Dotantal, im Bergland westlich von Dschenin, den er in seinem Survey von Manasse untersuchte; frühere Forscher bevorzugten Tel Hefer (Tell Ibschar) an der Küstenebene, im heutigen Hefer-Tal, und auch Tel Dotan selbst ist vorgeschlagen worden. Die beiden Verse sagen sonst nichts, und die Frage bleibt offen."
  fr:
    - "Hépher était une ville royale cananéenne dont le roi figure dans la liste des rois que Josué vainquit : « le roi de Tappuach, un ; le roi de Hépher, un ». Sous Salomon, « tout le pays de Hépher » relevait du troisième de ses douze districts, gouverné par Ben-Hésed à Arubboth avec Soco. Hépher est aussi le nom d’un clan de Manassé, père de Tselophchad, dont les filles obtinrent le droit d’hériter, et l’on admet généralement que la ville et son territoire se trouvaient dans le territoire de ce clan, dans le nord de la Samarie ou la plaine de Saron."
    - "Son site est débattu. La carte suit l’identification d’Adam Zertal avec Tell el-Muhaffar, un grand tertre dans la vallée de Dothan, dans les collines à l’ouest de Jénine, qu’il étudia dans sa prospection de Manassé ; des savants plus anciens préféraient Tel Hefer (Tell Ibshar) sur la plaine côtière, dans la vallée moderne de Hefer, et Tel Dothan lui-même a été proposé. Les deux versets ne disent rien d’autre, et la question reste ouverte."
  pl:
    - "Chefer było kananejskim miastem królewskim, którego król występuje w wykazie królów pokonanych przez Jozuego: „Król Taffua jeden; król Hefer jeden”. Za Salomona trzeci z jego dwunastu okręgów, rządzony przez Ben-Chesed w Arubot, obejmował Soko i „wszystkę ziemię Chefer”. Chefer to także imię rodu Manassesa, ojca Selofchada, którego córki wywalczyły prawo dziedziczenia, a miasto i jego ziemię uważa się powszechnie za leżące na terytorium tego rodu, w północnej Samarii lub na równinie Szaron."
    - "Jego położenie jest sporne. Mapa idzie za utożsamieniem Adama Zertala z Tell el-Muchaffar, dużym pagórkiem w dolinie Dotan, we wzgórzach na zachód od Dżeninu, który badał w swoim przeglądzie Manassesa; wcześniejsi uczeni woleli Tel Chefer (Tell Ibszar) na nizinie nadmorskiej, we współczesnej Dolinie Chefer, a proponowano także samo Tel Dotan. Dwa wersety nie mówią nic więcej, a sprawa pozostaje otwarta."
  it:
    - "Efer era una città regia cananea il cui re compare nell’elenco dei re sconfitti da Giosuè: «il re di Tappuah, il re di Hefer». Sotto Salomone «tutto il paese di Hefer» apparteneva al terzo dei suoi dodici distretti, governato da Ben-Chesed in Arubbot insieme a Soco. Efer è anche il nome di un clan di Manasse, il padre di Selofcad, le cui figlie ottennero il diritto di ereditare, e la città e il suo territorio sono generalmente ritenuti situati nel territorio di quel clan, nella Samaria settentrionale o nella pianura del Saròn."
    - "Il suo sito è discusso. La mappa segue l’identificazione di Adam Zertal con Tell el-Muhaffar, un grande tell nella valle di Dotan, sulle colline a ovest di Jenin, che egli studiò nella sua ricognizione di Manasse; studiosi precedenti preferivano Tel Hefer (Tell Ibshar) sulla pianura costiera, nell’odierna valle di Hefer, ed è stata proposta anche la stessa Tel Dotan. I due versetti non dicono altro, e la questione resta aperta."
  nl:
    - "Chefer was een Kanaänitische koningsstad wier koning voorkomt in de lijst van koningen die Jozua versloeg: “De koning van Tappuah, een; de koning van Hefer, een”. Onder Salomo behoorde “het ganse land Hefer” tot het derde van zijn twaalf districten, bestuurd door Ben-Chesed in Aruboth samen met Socho. Chefer is ook de naam van een geslacht van Manasse, de vader van Zelofchad, wiens dochters het recht tot erven verwierven, en de stad en haar land worden algemeen geacht te hebben gelegen in het gebied van dat geslacht, in noordelijk Samaria of de vlakte van Saron."
    - "De ligging is omstreden. De kaart volgt Adam Zertals identificatie met Tell el-Muhaffar, een grote heuvel in de Dotanvallei, in de heuvels ten westen van Jenin, die hij onderzocht in zijn survey van Manasse; eerdere geleerden gaven de voorkeur aan Tel Hefer (Tell Ibshar) op de kustvlakte, in de moderne Hefervallei, en ook Tel Dotan zelf is voorgesteld. De twee verzen vertellen niets anders, en de kwestie blijft open."
  cs:
    - "Chefer bylo kanaánské královské město, jehož král se objevuje v seznamu králů, které Jozue porazil: „Král Tafua jeden, král Chefer jeden“. Za Šalomouna patřila „i všecka země Chefer“ ke třetímu z jeho dvanácti okresů, spravovanému Ben-chesedem v Arubótu spolu se Sókem. Chefer je též jméno rodu Manasesova, otce Celofchadova, jehož dcery vybojovaly právo dědit, a město a jeho země se obecně pokládají za ležící na území onoho rodu, v severním Samaří nebo na Šaronské pláni."
    - "Jeho poloha je sporná. Mapa následuje ztotožnění Adama Zertala s Tell el-Muhaffar, velkým pahorkem v Dótanském údolí, v horách západně od Džanínu, který studoval ve svém průzkumu Manasesova území; dřívější učenci dávali přednost Tel Hefer (Tell Ibshar) na pobřežní rovině, v moderním údolí Chefer, a navržen byl i samotný Tel Dótan. Oba verše nic dalšího neříkají a otázka zůstává otevřená."
  sv:
    - "Hefer var en kananeisk kungastad vars kung förekommer i förteckningen över de kungar Josua besegrade: ”konungen i Tappua en, konungen i Hefer en”. Under Salomo hörde ”hela Heferlandet” till den tredje av hans tolv distrikt, styrt av Ben-Hesed i Arubbot tillsammans med Soko. Hefer är också namnet på en klan i Manasse, far till Selofchad, vars döttrar vann rätten att ärva, och staden och dess land anses allmänt ha legat i den klanens område, i norra Samaria eller på Saronslätten."
    - "Dess läge är omstritt. Kartan följer Adam Zertals identifiering med Tell el-Muhaffar, en stor kulle i Dotandalen, i bergen väster om Jenin, som han studerade i sin kartläggning av Manasse; tidigare forskare föredrog Tel Hefer (Tell Ibshar) på kustslätten, i dagens Hefer-dal, och Tel Dotan självt har föreslagits. De två verserna berättar inget mer, och frågan förblir öppen."
  nb:
    - "Hefer var en kanaanittisk kongeby hvis konge står i listen over kongene Josva beseiret: «kongen i Tappuah én, kongen i Hefer én». Under Salomo hørte «hele Hefer-bygden» til den tredje av hans tolv distrikter, styrt av Ben-Hesed i Arubbot sammen med Soko. Hefer er også navnet på en klan i Manasse, far til Selofhad, hvis døtre vant retten til å arve, og byen og dens land antas vanligvis å ha ligget i den klanens område, i det nordlige Samaria eller Sjaron-sletten."
    - "Beliggenheten er omdiskutert. Kartet følger Adam Zertals identifikasjon med Tell el-Muhaffar, en stor haug i Dotan-dalen, i åsene vest for Jenin, som han studerte i sin kartlegging av Manasse; tidligere forskere foretrakk Tel Hefer (Tell Ibshar) på kystsletten, i dagens Hefer-dal, og Tel Dotan selv er foreslått. De to versene forteller ikke noe annet, og spørsmålet forblir åpent."
  tl:
    - "Ang Hepher ay isang bayang maharlika ng mga Cananeo na ang hari ay lumilitaw sa talaan ng mga haring tinalo ni Josue: “Ang hari sa Tappua, isa; ang hari sa Hepher, isa”. Sa ilalim ni Salomon “ang buong lupain ng Ephet” (Hepher) ay kabilang sa ikatlo ng kaniyang labindalawang distrito, na pinamahalaan ni Ben-hesed sa Aruboth kasama ang Socho. Ang Hepher din ang pangalan ng isang angkan ni Manases, ang ama ni Salphaad, na ang mga anak na babae ay nagwagi ng karapatang magmana, at ang bayan at lupain nito ay karaniwang itinuturing na nasa teritoryo ng angkang iyon, sa hilagang Samaria o sa kapatagan ng Saron."
    - "Pinagtatalunan ang lugar nito. Sinusunod ng mapa ang pagkakakilanlan ni Adam Zertal sa Tell el-Muhaffar, isang malaking burol sa libis ng Dotan, sa mga burol sa kanluran ng Jenin, na pinag-aralan niya sa kaniyang pagsisiyasat sa Manases; mas pinili ng mga naunang iskolar ang Tel Hefer (Tell Ibshar) sa kapatagan sa baybayin, sa makabagong Libis ng Hefer, at iminungkahi rin ang mismong Tel Dotan. Walang ibang sinasabi ang dalawang talata, at nananatiling bukas ang tanong."
  da:
    - "Hefer var en kana'anæisk kongeby, hvis konge optræder i listen over konger, Josva besejrede: »Kongen af Thappua een; Kongen af Hefer een«. Under Salomo hørte »hele Landet Hefer« til den tredje af hans tolv distrikter, styret af Ben-Hesed i Aruboth sammen med Soko. Hefer er også navnet på en klan i Manasse, far til Zelofhad, hvis døtre vandt retten til at arve, og byen og dens land antages almindeligvis at have ligget i den klans område, i det nordlige Samaria eller på Saron-sletten."
    - "Dens sted er omdiskuteret. Kortet følger Adam Zertals identifikation med Tell el-Muhaffar, en stor høj i Dotan-dalen, i bjergene vest for Jenin, som han undersøgte i sin kortlægning af Manasse; tidligere forskere foretrak Tel Hefer (Tell Ibshar) på kystsletten, i den moderne Hefer-dal, og Tel Dotan selv er blevet foreslået. De to vers fortæller intet andet, og spørgsmålet forbliver åbent."
  sr:
    - "Офер је био ханански краљевски град чији се цар јавља у списку царева које је Исус победио: „цар тифувски један; цар еферски један“. За Соломуна је „сва земља Еферова“ припадала трећем од његових дванаест округа, којим је управљао Вен-Есед у Арувоту заједно са Сохотом. Офер је такође име Манасијиног рода, оца Салпадовог, чије су кћери стекле право на наслеђе, а град и његова земља обично се узимају као да су лежали на подручју тог рода, у северној Самарији или на сароској равници."
    - "Његово место је спорно. Карта следи поистовећење Адама Цертала с Тел ел-Мухафаром, великом хумком у долини Дотаима, у брдима западно од Џенина, коју је проучавао у свом истраживању Манасије; ранији научници су више волели Тел Хефер (Тел Ибшар) на приобалној равници, у савременој долини Хефер, а предложен је и сам Тел Дотаим. Та два стиха не казују ништа друго и питање остаје отворено."
