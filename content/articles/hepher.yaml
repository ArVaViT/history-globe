body:
  en:
    - "Hepher was a Canaanite royal town whose king appears in the list of kings Joshua defeated: “The king of Tappuah, one; the king of Hepher, one”. Under Solomon “all the land of Hepher” belonged to the third of his twelve districts, governed by Ben-hesed in Aruboth together with Socoh. Hepher is also the name of a clan of Manasseh, the father of Zelophehad, whose daughters won the right to inherit, and the town and its land are generally taken to have lain in the territory of that clan, in northern Samaria or the Sharon plain."
    - "Its site is debated. The map follows Adam Zertal's identification with Tell el-Muhaffar, a large mound in the Dothan valley, in the hills west of Jenin, which he studied in his survey of Manasseh; earlier scholars preferred Tel Hefer (Tell Ibshar) on the coastal plain, from which the modern Hefer Valley takes its name, and Tel Dothan itself has been proposed. The two verses tell nothing else, and the question remains open."
  ru:
    - "Хефер был ханаанским царским городом, чей царь стоит в списке царей, побеждённых Иисусом Навином: «один царь Таппуаха, один царь Хефера». При Соломоне «вся земля Хефер» входила в третий из двенадцати его округов, которым ведал Бен-Хесед в Арюбофе вместе с Соко. Хефер — также имя рода Манассии, отца Салпаада, чьи дочери добились права наследовать, и город с его землёй обычно помещают во владениях этого рода, на севере Самарии или на равнине Сарон."
    - "Его место спорно. Карта следует отождествлению Адама Зерталя с Телль-эль-Мухаффаром, большим холмом в Дофанской долине, к западу от Дженина, который он изучал при обследовании земли Манассии; прежние исследователи предпочитали Тель-Хефер (Телль-Ибшар) на прибрежной равнине, по которому названа нынешняя долина Хефер, а предлагали и сам Тель-Дофан. Два стиха больше ничего не говорят, и вопрос остаётся открытым."
  uk:
    - "Хефер був ханаанським царським містом, чий цар з’являється в переліку царів, яких розбив Ісус Навин: «Царь Таппуахський, один; царь Хеферський, один». За Соломона «все займище Хеферське» належало до третьої з його дванадцяти округ, якою керував Бен-Хесед в Аруботі разом із Сохо. Хефер — також ім’я роду Манасії, батька Салпаада, чиї дочки здобули право на спадок, і місто та його земля, як загально вважають, лежали на території того роду, на півночі Самарії або на рівнині Шарон."
    - "Його місце спірне. Карта йде за ототожненням Адама Зертала з Телль-ель-Мухаффар, великим городищем у долині Дофан, у пагорбах на захід від Дженіна, яке він вивчав у своєму обстеженні Манасії; раніші дослідники надавали перевагу Тель-Хеферу (Телль-Ібшар) на прибережній рівнині, від якого нинішня долина Хефер бере назву, а також пропонували сам Тель-Дофан. Ці два вірші нічого більше не кажуть, і питання лишається відкритим."
  es:
    - "Hefer era una ciudad real cananea cuyo rey figura en la lista de reyes que derrotó Josué: «El rey de Tappua, otro: el rey de Hepher, otro». Bajo Salomón toda la tierra de Hefer pertenecía al tercero de sus doce distritos, gobernado por Ben-hesed en Arubot junto con Soco. Hefer es también el nombre de un clan de Manasés, padre de Zelofehad, cuyas hijas ganaron el derecho a heredar, y la población y su tierra se tienen generalmente por situadas en el territorio de ese clan, en el norte de Samaria o en la llanura de Sarón."
    - "Su emplazamiento es discutido. El mapa sigue la identificación de Adam Zertal con Tell el-Muhaffar, un gran montículo en el valle de Dotán, en las colinas al oeste de Yenín, que estudió en su prospección de Manasés; estudiosos anteriores preferían Tel Hefer (Tell Ibshar), en la llanura costera, de la que toma su nombre el actual valle de Hefer, y también se ha propuesto el propio Tel Dotán. Los dos versículos no dicen nada más, y la cuestión sigue abierta."
  pt:
    - "Héfer era uma cidade real cananeia cujo rei aparece na lista dos reis que Josué derrotou: “o rei de Tapua, um; o rei de Héfer, um”. Sob Salomão, “toda a terra de Héfer” pertencia ao terceiro de seus doze distritos, governado por Ben-Hesede em Arubote, juntamente com Socó. Héfer é também o nome de um clã de Manassés, pai de Zelofeade, cujas filhas conquistaram o direito de herdar, e a cidade e sua terra são geralmente tomadas como situadas no território desse clã, no norte de Samaria ou na planície de Sarom."
    - "Seu sítio é debatido. O mapa segue a identificação de Adam Zertal com Tell el-Muhaffar, um grande monte no vale de Dotã, nas colinas a oeste de Jenin, que ele estudou em sua prospecção de Manassés; estudiosos anteriores preferiam Tel Hefer (Tell Ibshar), na planície costeira, de onde o moderno vale de Hefer toma o nome, e o próprio Tel Dotã também foi proposto. Os dois versículos não dizem mais nada, e a questão permanece em aberto."
  de:
    - "Hefer war eine kanaanitische Königsstadt, deren König in der Liste der von Josua besiegten Könige erscheint: „der König zu Thappuah, der König zu Hepher“. Unter Salomo gehörte „das ganze Land Hepher“ zum dritten seiner zwölf Bezirke, den Ben-Hesed in Arubbot zusammen mit Socho verwaltete. Hefer ist auch der Name einer Sippe Manasses und ihres Stammvaters, des Vaters Zelofhads, dessen Töchter das Erbrecht erstritten, und die Stadt und ihr Land lagen nach allgemeiner Annahme im Gebiet dieser Sippe, im nördlichen Samaria oder in der Scharonebene."
    - "Ihre Lage ist umstritten. Die Karte folgt Adam Zertals Gleichsetzung mit Tell el-Muhaffar, einem großen Hügel im Dotantal, im Bergland westlich von Dschenin, den er in seinem Survey von Manasse untersuchte; frühere Forscher bevorzugten Tel Hefer (Tell Ibschar) an der Küstenebene, nach dem das heutige Hefer-Tal benannt ist, und auch Tel Dotan selbst ist vorgeschlagen worden. Die beiden Verse sagen sonst nichts, und die Frage bleibt offen."
  fr:
    - "Hépher était une ville royale cananéenne dont le roi figure dans la liste des rois que Josué vainquit : « le roi de Tappuach, un ; le roi de Hépher, un ». Sous Salomon, « tout le pays de Hépher » relevait du troisième de ses douze districts, gouverné par Ben-Hésed à Arubboth avec Soco. Hépher est aussi le nom d’un clan de Manassé, père de Tselophchad, dont les filles obtinrent le droit d’hériter, et l’on admet généralement que la ville et son territoire se trouvaient dans le territoire de ce clan, dans le nord de la Samarie ou la plaine de Saron."
    - "Son site est débattu. La carte suit l’identification d’Adam Zertal avec Tell el-Muhaffar, un grand tertre dans la vallée de Dothan, dans les collines à l’ouest de Jénine, qu’il étudia dans sa prospection de Manassé ; des savants plus anciens préféraient Tel Hefer (Tell Ibshar) sur la plaine côtière, d’où la vallée moderne de Hefer tire son nom, et Tel Dothan lui-même a été proposé. Les deux versets ne disent rien d’autre, et la question reste ouverte."
