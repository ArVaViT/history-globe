# Overview article (ADR 0007). Mainstream facts only; Hepher's site is disputed (Tell el-Muhaffar, Tel Hefer, Tel Dothan) and no candidate is chosen; the clan of Hepher in Manasseh is noted as a likely link.
id: hepher
place: a2ebe1c
title:
  en: "Hepher"
  ru: "Хефер"
body:
  en:
    - "Hepher was a Canaanite royal town whose king appears in the list of kings Joshua defeated: “The king of Tappuah, one; the king of Hepher, one”. Under Solomon “all the land of Hepher” belonged to the third of his twelve districts, governed by Ben-hesed in Aruboth together with Socoh. Hepher is also the name of a clan of Manasseh, the father of Zelophehad, whose daughters won the right to inherit, and the town and its land are generally taken to have lain in the territory of that clan, in northern Samaria or the Sharon plain."
    - "Its site is debated. The map follows Adam Zertal's identification with Tell el-Muhaffar, a large mound in the Dothan valley, in the hills west of Jenin, which he studied in his survey of Manasseh; earlier scholars preferred Tel Hefer (Tell Ibshar) on the coastal plain, from which the modern Hefer Valley takes its name, and Tel Dothan itself has been proposed. The two verses tell nothing else, and the question remains open."
  ru:
    - "Хефер был ханаанским царским городом, чей царь стоит в списке царей, побеждённых Иисусом Навином: «один царь Таппуаха, один царь Хефера». При Соломоне «вся земля Хефер» входила в третий из двенадцати его округов, которым ведал Бен-Хесед в Арюбофе вместе с Соко. Хефер — также имя рода Манассии, отца Салпаада, чьи дочери добились права наследовать, и город с его землёй обычно помещают во владениях этого рода, на севере Самарии или на равнине Сарон."
    - "Его место спорно. Карта следует отождествлению Адама Зерталя с Телль-эль-Мухаффаром, большим холмом в Дофанской долине, к западу от Дженина, который он изучал при обследовании земли Манассии; прежние исследователи предпочитали Тель-Хефер (Телль-Ибшар) на прибрежной равнине, по которому названа нынешняя долина Хефер, а предлагали и сам Тель-Дофан. Два стиха больше ничего не говорят, и вопрос остаётся открытым."
