body:
  en:
    - "Gath-hepher was a town of Lower Galilee on the border of Zebulun, where the line “passeth on along on the east to Gittah-hepher”, as the King James Version spells it there. It is remembered as the home of the prophet Jonah: Jeroboam II restored the border of Israel “according to the word of the LORD God of Israel, which he spake by the hand of his servant Jonah, the son of Amittai, the prophet, which was of Gath-hepher”. This is the same Jonah son of Amittai to whom the word of the Lord came in the book of Jonah, and it places him in the first half of the eighth century BC."
    - "The site is generally accepted as Tel Gat Hefer (Khirbet ez-Zurra), a mound beside the village of Mashhad about 4.5 km north-east of Nazareth. Jerome wrote that Geth lay two miles from Sepphoris on the road to Tiberias and that Jonah's tomb was shown there, and the mosque of Nabi Yunis in Mashhad still keeps the tradition. Only small salvage excavations have been made on the mound, and little is known of the town beyond these two verses."
  ru:
    - "Гафхефер — город Нижней Галилеи на границе Завулона, где предел «проходит к востоку в Геф-Хефер», как Синодальный перевод называет его там. Его помнят как родину пророка Ионы: Иеровоам II восстановил пределы Израиля «по слову Господа Бога Израилева, которое Он изрек чрез раба Своего Иону, сына Амафиина, пророка из Гафхефера». Это тот же Иона, сын Амафиин, к которому было слово Господне в книге Ионы, и это помещает его в первую половину VIII века до н. э."
    - "Место обычно отождествляют с Тель-Гат-Хефером (Хирбет-эз-Зурра), холмом у селения Машхад примерно в 4,5 км к северо-востоку от Назарета. Иероним писал, что Геф лежит в двух милях от Сепфориса по дороге в Тивериаду и что там показывают гробницу Ионы, и мечеть Наби-Юнис в Машхаде хранит это предание поныне. На холме проводились лишь небольшие спасательные раскопки, и о городе известно немногим больше этих двух стихов."
  uk:
    - "Гат-Хефер був містом Нижньої Галілеї на межі Завулона, де кордон «проходить на схід сонця повернувшись на Гет-Хефер», як тут пишеться в англійському перекладі короля Якова — Гіттах-Хефер. Його пам’ятають як рідне місто пророка Йони: Єровоам II відновив межі Ізраїлю «по слову Господньому, виреченому через слугу свого, пророка Йону Аматієнка з Гатхеферу». Це той самий Йона, син Амафії, до якого надійшло слово Господнє в книзі Йони, і це відносить його до першої половини VIII ст. до н. е."
    - "Місце загальноприйнято ототожнювати з Тель-Гат-Хефер (Хірбет-ез-Зурра) — городищем біля села Машхад, приблизно за 4,5 км на північний схід від Назарета. Ієронім писав, що Гет лежав за дві милі від Сепфориса на дорозі до Тіверіади і що там показували гробницю Йони, а мечеть Набі-Юніс у Машхаді й досі зберігає це передання. На городищі проводилися лише невеликі рятувальні розкопки, і про саме місто, крім цих двох віршів, відомо мало."
  es:
    - "Gat-hefer era una población de la Baja Galilea, en la frontera de Zabulón, donde el límite, «pasando de allí hacia el lado oriental á Gith-hepher», recibe en la versión del rey Jacobo (King James) la forma Gittah-hepher. Se recuerda como la patria del profeta Jonás: Jeroboam II restableció los términos de Israel «conforme á la palabra de Jehová Dios de Israel, la cual había él hablado por su siervo Jonás hijo de Amittai, profeta que fué de Gath-hepher». Es el mismo Jonás hijo de Amitai a quien llegó la palabra del Señor en el libro de Jonás, y esto lo sitúa en la primera mitad del siglo VIII a. C."
    - "El sitio se acepta generalmente como Tel Gat Hefer (Khirbet ez-Zurra), un montículo junto a la aldea de Mashhad, a unos 4,5 km al nordeste de Nazaret. Jerónimo escribió que Geth estaba a dos millas de Séforis, en el camino de Tiberias, y que allí se mostraba el sepulcro de Jonás, y la mezquita de Nabi Yunis, en Mashhad, conserva todavía la tradición. En el montículo solo se han hecho pequeñas excavaciones de salvamento, y de la población se sabe poco más allá de estos dos versículos."
  pt:
    - "Gate-Héfer era uma cidade da Baixa Galileia, na fronteira de Zebulom, onde a linha “passava para o leste a Gate-Hefer”, grafada Gitá-Héfer na Versão King James. É lembrada como a terra do profeta Jonas: Jeroboão II restaurou a fronteira de Israel “de acordo com a palavra do SENHOR, o Deus de Israel, a qual ele falou por meio de seu servo Jonas, filho de Amitai, o profeta, que era de Gate-Hefer”. Este é o mesmo Jonas, filho de Amitai, a quem veio a palavra do Senhor no livro de Jonas, e isso o situa na primeira metade do século VIII a.C."
    - "O sítio é geralmente aceito como Tel Gat Hefer (Khirbet ez-Zurra), um monte junto à aldeia de Mashhad, a cerca de 4,5 km a nordeste de Nazaré. Jerônimo escreveu que Geth ficava a duas milhas de Séforis, no caminho para Tiberíades, e que ali se mostrava o túmulo de Jonas, e a mesquita de Nabi Yunis, em Mashhad, ainda guarda a tradição. No monte só se fizeram pequenas escavações de salvamento, e pouco se sabe da cidade além destes dois versículos."
  de:
    - "Gat-Hefer war eine Stadt Untergaliläas an der Grenze Sebulons, wo die Linie „gegen Aufgang durch Gath-Hepher“ weiterläuft (in der King-James-Bibel dort „Gittah-hepher“ geschrieben). Man erinnert sich daran als der Heimat des Propheten Jona: Jerobeam II. brachte die Grenze Israels wieder herzu „nach dem Wort des HERRN, das er geredet hatte durch seinen Knecht Jona, den Sohn Amitthais, den Propheten, der von Gath-Hepher war“. Es ist derselbe Jona, der Sohn Amittais, zu dem im Buch Jona das Wort des Herrn geschah, und das setzt ihn in die erste Hälfte des 8. Jahrhunderts v. Chr."
    - "Die Stätte wird allgemein mit Tel Gat Hefer (Chirbet ez-Zurra) gleichgesetzt, einem Hügel neben dem Dorf Maschhad, etwa 4,5 km nordöstlich von Nazareth. Hieronymus schrieb, Geth liege zwei Meilen von Sepphoris an der Straße nach Tiberias, und man zeige dort das Grab Jonas; die Moschee von Nabi Yunis in Maschhad bewahrt die Überlieferung bis heute. Auf dem Hügel wurden nur kleine Notgrabungen durchgeführt, und über die Stadt ist über diese beiden Verse hinaus wenig bekannt."
  fr:
    - "Gath-Hépher était une ville de Basse Galilée, sur la frontière de Zabulon, où la limite « passait à l’orient par Guittha-Hépher », selon l’orthographe de la version Louis Segond à cet endroit. On s’en souvient comme du lieu d’origine du prophète Jonas : Jéroboam II rétablit les limites d’Israël « selon la parole que l’Éternel, le Dieu d’Israël, avait prononcée par son serviteur Jonas, le prophète, fils d’Amitthaï, de Gath-Hépher ». C’est le même Jonas, fils d’Amitthaï, à qui la parole de l’Éternel fut adressée dans le livre de Jonas, ce qui le place dans la première moitié du VIIIe siècle av. J.-C."
    - "Le site est généralement identifié à Tel Gat Hefer (Khirbet ez-Zurra), un tertre voisin du village de Mashhad, à environ 4,5 km au nord-est de Nazareth. Jérôme écrivit que Geth se trouvait à deux milles de Sepphoris, sur la route de Tibériade, et qu’on y montrait le tombeau de Jonas ; la mosquée de Nabi Yunis, à Mashhad, en garde encore la tradition. Seules de petites fouilles de sauvetage ont été menées sur le tertre, et l’on sait peu de chose de la ville au-delà de ces deux versets."
  pl:
    - "Gat-Chefer było miastem w Dolnej Galilei na granicy Zabulona, gdzie linia graniczna „bieży na wschód słońca do Gethefer”, jak pisze to w tym miejscu Biblia Króla Jakuba (Gittah-hepher). Pamięta się je jako rodzinne miasto proroka Jonasza: Jeroboam II przywrócił granice Izraela „według słowa Pana, Boga Izraelskiego, które był wyrzekł przez sługę swego Jonasza, syna Amaty, proroka; który był z Gatefer”. To ten sam Jonasz, syn Amittaja, do którego w Księdze Jonasza doszło słowo Pańskie, co umieszcza go w pierwszej połowie VIII w. p.n.e."
    - "Za miejsce miasta uznaje się powszechnie Tel Gat Hefer (Chirbet ez-Zurra), pagórek obok wsi Meszhed, około 4,5 km na północny wschód od Nazaretu. Hieronim pisał, że Geth leżało dwie mile od Sefforis przy drodze do Tyberiady i że pokazywano tam grób Jonasza, a meczet Nabi Junis w Meszhedzie nadal podtrzymuje tę tradycję. Na pagórku prowadzono jedynie niewielkie wykopaliska ratownicze, a o samym mieście, poza tymi dwoma wersetami, wiadomo niewiele."
  it:
    - "Gat-Efer era una città della Bassa Galilea sul confine di Zabulon, dove la linea «passava a oriente per Gath-Hefer», come la scrive la Riveduta, mentre la King James Version vi scrive Gittah-hepher. È ricordata come patria del profeta Giona: Geroboamo II ristabilì i confini d’Israele «secondo la parola che l’Eterno, l’Iddio d’Israele, avea pronunziata per mezzo del suo servitore il profeta Giona, figliuolo di Amittai, che era di Gath-Hefer». È lo stesso Giona figlio di Amittai al quale giunse la parola del Signore nel libro di Giona, e ciò lo colloca nella prima metà dell’VIII secolo a.C."
    - "Il sito è generalmente identificato con Tel Gat Hefer (Khirbet ez-Zurra), un tell presso il villaggio di Mashhad, circa 4,5 km a nord-est di Nazaret. Girolamo scrisse che Geth si trovava a due miglia da Sefforis sulla strada per Tiberiade e che vi si mostrava la tomba di Giona, e la moschea di Nabi Yunis a Mashhad ne conserva ancora la tradizione. Sul tell sono stati condotti solo piccoli scavi di emergenza, e della città si sa poco al di là di questi due versetti."
  nl:
    - "Gat-Chefer was een stad in Neder-Galilea aan de grens van Zebulon, waar de lijn “oostwaarts door naar den opgang, naar Gath-Hefer” loopt (in de King James Version daar “Gittah-hepher” gespeld). Het wordt herinnerd als de woonplaats van de profeet Jona: Jerobeam II herstelde de grens van Israël “naar het woord des HEEREN, des Gods van Israel, dat Hij gesproken had door den dienst van Zijn knecht Jona, den zoon van Amitthai, den profeet, die van Gath-hefer was”. Dit is dezelfde Jona, de zoon van Amittai, tot wie in het boek Jona het woord van de Heer kwam, en het plaatst hem in de eerste helft van de 8e eeuw v.Chr."
    - "De plaats wordt algemeen vereenzelvigd met Tel Gat Hefer (Khirbet ez-Zurra), een heuvel naast het dorp Mashhad, ongeveer 4,5 km ten noordoosten van Nazareth. Hieronymus schreef dat Geth twee mijl van Sefforis lag aan de weg naar Tiberias en dat daar het graf van Jona getoond werd, en de moskee van Nabi Yunis in Mashhad bewaart die overlevering nog steeds. Op de heuvel zijn alleen kleine noodopgravingen verricht, en buiten deze twee verzen is er weinig van de stad bekend."
  cs:
    - "Gat-chefer bylo město Dolní Galileje na hranici Zebulunu, kde hranice „přechází zase k východu, do Gethefer“ (v Bibli krále Jakuba Gittah-hepher). Připomíná se jako domov proroka Jonáše: Jarobeám II. navrátil hranici Izraele „vedlé řeči Hospodina Boha Izraelského, kterouž byl mluvil skrze služebníka svého Jonáše syna Amaty proroka, kterýž byl z Gethefer“. Je to týž Jonáš, syn Amitajův, k němuž v knize Jonáš přišlo slovo Hospodinovo, a klade ho do první poloviny 8. stol. př. n. l."
    - "Místo se obecně ztotožňuje s Tel Gat Hefer (Chirbet ez-Zurra), pahorkem u vesnice Mašhad asi 4,5 km severovýchodně od Nazareta. Jeroným napsal, že Geth leželo dvě míle od Sepforidy na cestě do Tiberiady a že se tam ukazoval Jonášův hrob, a mešita Nabí Júnis v Mašhadu tuto tradici dosud uchovává. Na pahorku proběhly jen malé záchranné vykopávky a o městě mimo tyto dva verše se ví málo."
  sv:
    - "Gat-Hefer var en stad i nedre Galileen vid Sebulons gräns, där det om gränslinjen heter: ”Därifrån gick den fram österut mot solens uppgång till Gat-Hefer” (Gittah-hepher i King James-bibeln, som stavar det så där). Den är ihågkommen som profeten Jonas hem: Jerobeam II återställde Israels gräns ”i enlighet med det ord som HERREN, Israels Gud, hade talat genom sin tjänare profeten Jona, Amittais son, från Gat-Hahefer”. Det är samme Jona, Amittajs son, till vilken Herrens ord kom i Jonaboken, och det placerar honom i första hälften av 700-talet f.Kr."
    - "Platsen anses allmänt vara Tel Gat Hefer (Khirbet ez-Zurra), en kulle bredvid byn Mashhad omkring 4,5 km nordost om Nasaret. Hieronymus skrev att Geth låg två romerska mil från Sepforis på vägen till Tiberias och att Jonas grav visades där, och moskén Nabi Yunis i Mashhad bevarar fortfarande traditionen. Bara små räddningsgrävningar har gjorts på kullen, och föga är känt om staden utöver dessa två verser."
  nb:
    - "Gat-Hefer var en by i nedre Galilea ved grensen til Sebulon, der det om grenselinjen heter at «derfra gikk den mot øst, mot solens opgang, over til Gat-Hefer» (Gittah-hepher i King James-oversettelsen). Den huskes som hjemstedet til profeten Jona: Jeroboam 2. gjenvant Israels grense «efter det ord som Herren, Israels Gud, hadde talt ved sin tjener profeten Jonas, Amittais sønn, fra Gat-Hefer». Det er den samme Jona, Amittais sønn, som Herrens ord kom til i Jonaboken, og det setter ham i første halvdel av 700-tallet f.Kr."
    - "Stedet godtas vanligvis som Tel Gat Hefer (Khirbet ez-Zurra), en haug ved landsbyen Mashhad omtrent 4,5 km nordøst for Nasaret. Hieronymus skrev at Geth lå to romerske mil fra Sepforis på veien til Tiberias og at Jonas grav ble vist der, og moskeen Nabi Yunis i Mashhad bevarer fremdeles tradisjonen. Bare små redningsutgravninger er gjort på haugen, og man vet lite om byen utover disse to versene."
  tl:
    - "Ang Gath-hepher ay isang bayan ng Ibabang Galilea sa hangganan ng Zabulon, kung saan ang guhit ay “patuloy sa dakong silanganan sa Gith-hepher”, ayon sa baybay ng Ang Biblia roon. Naaalaala ito bilang tahanan ng propetang si Jonas: isinauli ni Jeroboam II ang hangganan ng Israel “ayon sa salita ng Panginoon, ng Dios ng Israel, na nagsalita sa pamamagitan ng kaniyang lingkod na si Jonas na anak ni Amittai, na propeta na taga Gath-hepher”. Siya rin ang Jonas na anak ni Amittai na dumating ang salita ng Panginoon sa aklat ni Jonas, at inilalagay siya nito sa unang kalahati ng ika-8 siglo BK."
    - "Karaniwang tinatanggap ang lugar bilang Tel Gat Hefer (Khirbet ez-Zurra), isang burol sa tabi ng nayon ng Mashhad mga 4.5 km sa hilagang-silangan ng Nazaret. Isinulat ni Jerome na ang Geth ay dalawang milya mula sa Sepphoris sa daan patungong Tiberias at doon ipinakikita ang libingan ni Jonas, at pinananatili pa rin ng moske ng Nabi Yunis sa Mashhad ang tradisyon. Maliliit na paghuhukay lamang ng pagsagip ang ginawa sa burol, at kaunti ang nalalaman tungkol sa bayan maliban sa dalawang talatang ito."
  da:
    - "Gat-Hefer var en by i Nedre Galilæa ved grænsen til Zebulon, hvor linjen »gaar derfra over mod Østen, mod Solens Opgang, til Githa-Hefer« (Gittah-hepher i King James-oversættelsen). Den huskes som profeten Jonas' hjemby: Jeroboam II genoprettede Israels grænse »efter Herren Israels Guds Ord, som han talte ved sin Tjener Jona, Amithajs Søn, den Profet, som var fra Gath-Hefer«. Det er den samme Jonas, Amittajs søn, som Herrens ord kom til i Jonas' Bog, og det placerer ham i første halvdel af 700-tallet f.Kr."
    - "Stedet anses almindeligvis for at være Tel Gat Hefer (Khirbet ez-Zurra), en høj ved landsbyen Mashhad omkring 4,5 km nordøst for Nazaret. Hieronymus skrev, at Geth lå to romerske mil fra Sepphoris på vejen til Tiberias, og at Jonas' grav blev vist der, og Nabi Yunis-moskeen i Mashhad bevarer stadig traditionen. Kun små redningsudgravninger er foretaget på højen, og der vides lidt om byen ud over disse to vers."
