body:
  en:
    - "Arumah was a town in the hills of Ephraim not far from Shechem, known only from the story of Abimelech, the son of Gideon who made himself king of Shechem. When Gaal son of Ebed stirred the men of Shechem to revolt, Zebul, the governor of the city, sent word to Abimelech, and after Gaal was beaten in the field “Abimelech dwelt at Arumah: and Zebul thrust out Gaal and his brethren, that they should not dwell in Shechem”. In the earlier verse, where Zebul sends messengers “privily”, the Hebrew word can also be read “in Tormah”, and many take it for a second mention of Arumah."
    - "Little more can be said. The name is usually found in Khirbet el-Urmah, a ruin on a high conical hill some 8 km south-east of Nablus, the ancient Shechem. Pottery on the summit runs from the Bronze Age through the Iron Age, with most from the early Iron Age, but the walls and towers that stand there belong to a fortress of the Hasmonean and Herodian period, and nothing found there names the town. The hill lies today in the West Bank, above the villages south-east of Nablus."
  ru:
    - "Арума — город в горах Ефремовых недалеко от Сихема, известный только по рассказу об Авимелехе, сыне Гедеона, который сделал себя царём Сихема. Когда Гаал, сын Еведов, поднял жителей Сихема на мятеж, Зевул, начальник города, известил Авимелеха, и после того как Гаал был разбит в поле, «остался Авимелех в Аруме, а Гаала и братьев его Зевул выгнал, чтоб они не жили в Сихеме». В более раннем стихе, где Зевул посылает послов «хитрым образом», еврейское слово можно прочесть и как «в Торме», и многие видят в нём второе упоминание Арумы."
    - "Больше сказать почти нечего. Имя обычно находят в Хирбет-Урме, развалинах на высоком конусовидном холме примерно в 8 км к юго-востоку от Наблуса, древнего Сихема. Керамика на вершине относится к бронзовому и железному векам, больше всего — к раннему железному, но стоящие там стены и башни принадлежат крепости хасмонейского и иродова времени, и ничто найденное там не называет города. Холм лежит сегодня на Западном берегу, над сёлами к юго-востоку от Наблуса."
  uk:
    - "Арума було містом у нагір'ї Єфрема неподалік від Сихема, відомим лише з оповіді про Авімелеха, сина Гедеона, який зробив себе царем Сихема. Коли Гаал, син Еведа, підбурив сихемців до бунту, Зевул, намісник міста, послав звістку Авімелехові, і після того як Гаала було розбито в полі, «остався Абимелех ув Арумі, а Зебул уганяв за Гаалом та його товаришами, й не було їм вже притулку в Сихемі». У попередньому вірші, де Зевул посилає посланців «тайком», єврейське слово можна прочитати й як «в Тормі», і багато хто вважає це другою згадкою Арума."
    - "Більше сказати майже нічого. Назву зазвичай знаходять у Хірбет-ель-Урмі, руїні на високому конічному пагорбі приблизно за 8 км на південний схід від Наблуса, давнього Сихема. Кераміка на вершині охоплює бронзову добу та залізну, найбільше раннього залізного віку, але мури й башти, що там стоять, належать до фортеці хасмонейського й іродіанського часу, і ніщо знайдене там не називає міста. Пагорб лежить нині на Західному березі над селами на південний схід від Наблуса."
  es:
    - "Aruma era una ciudad de la región montañosa de Efraín, no lejos de Siquem, conocida solo por la historia de Abimelec, el hijo de Gedeón que se hizo rey de Siquem. Cuando Gaal hijo de Ebed incitó a los hombres de Siquem a la rebelión, Zebul, el gobernador de la ciudad, mandó aviso a Abimelec, y tras ser vencido Gaal en el campo, «Abimelech se quedó en Aruma; y Zebul echó fuera á Gaal y á sus hermanos, para que no morasen en Sichêm». En el versículo anterior, donde Zebul envía mensajeros «sagazmente», la palabra hebrea puede leerse también «en Tormá», y muchos la toman por una segunda mención de Aruma."
    - "Poco más puede decirse. El nombre suele encontrarse en Khirbet el-Urmah, una ruina en una alta colina cónica a unos 8 km al sudeste de Nablus, la antigua Siquem. La cerámica de la cima va desde la Edad del Bronce hasta la edad del Hierro, con la mayor parte de la edad del Hierro antigua, pero las murallas y torres que allí se alzan pertenecen a una fortaleza de época asmonea y herodiana, y nada de lo hallado allí nombra la ciudad. Hoy la colina se encuentra en Cisjordania, sobre las aldeas al sudeste de Nablus."
  pt:
    - "Aruma era uma cidade nas colinas de Efraim, não longe de Siquém, conhecida apenas pela história de Abimeleque, filho de Gideão, que se fez rei de Siquém. Quando Gaal, filho de Ebede, incitou os homens de Siquém à revolta, Zebul, governador da cidade, mandou avisar Abimeleque, e depois que Gaal foi vencido no campo, “Abimeleque fixou residência em Arumá; e Zebul expulsou Gaal e os seus irmãos, para que não habitassem em Siquém”. No versículo anterior, onde Zebul manda mensageiros “astutamente”, a palavra hebraica também pode ser lida “em Tormá”, e muitos a tomam por uma segunda menção de Aruma."
    - "Pouco mais se pode dizer. O nome costuma ser achado em Khirbet el-Urmah, uma ruína numa colina cônica elevada, cerca de 8 km a sudeste de Nablus, a antiga Siquém. A cerâmica no cume vai da Idade do Bronze à do Ferro, com a maior parte do Ferro antigo, mas as muralhas e torres que ali se erguem pertencem a uma fortaleza do período hasmoneu e herodiano, e nada achado ali nomeia a cidade. A colina fica hoje na Cisjordânia, acima das aldeias a sudeste de Nablus."
  de:
    - "Aruma war eine Stadt im Bergland Ephraim nicht weit von Sichem, nur aus der Geschichte Abimelechs bekannt, des Sohnes Gideons, der sich zum König von Sichem machte. Als Gaal, der Sohn Ebeds, die Männer von Sichem zum Aufstand aufwiegelte, sandte Sebul, der Statthalter der Stadt, Botschaft an Abimelech, und nachdem Gaal im Feld geschlagen war: „Und Abimelech blieb zu Aruma. Sebul aber verjagte den Gaal und seine Brüder, die zu Sichem nicht durften bleiben“. Im früheren Vers, wo Sebul „heimlich“ Boten sendet, kann das hebräische Wort auch „in Tormah“ gelesen werden, und viele halten es für eine zweite Erwähnung von Aruma."
    - "Mehr lässt sich kaum sagen. Der Name wird gewöhnlich in Chirbet el-Urma gefunden, einer Ruine auf einem hohen Kegelhügel etwa 8 km südöstlich von Nablus, dem antiken Sichem. Keramik auf dem Gipfel reicht von der Bronzezeit durch die Eisenzeit, das meiste aus der frühen Eisenzeit, doch die dort stehenden Mauern und Türme gehören zu einer Festung der hasmonäischen und herodianischen Zeit, und nichts dort Gefundenes nennt die Stadt. Der Hügel liegt heute im Westjordanland, über den Dörfern südöstlich von Nablus."
  fr:
    - "Aruma était une ville des collines d’Éphraïm non loin de Sichem, connue seulement par l’histoire d’Abimélec, le fils de Gédéon qui se fit roi de Sichem. Quand Gaal, fils d’Ébed, souleva les hommes de Sichem, Zebul, gouverneur de la ville, avertit Abimélec, et après que Gaal eut été battu aux champs, « Abimélec s’arrêta à Aruma. Et Zebul chassa Gaal et ses frères, qui ne purent rester à Sichem ». Dans le verset précédent, où Zebul envoie des messagers « secrètement », le mot hébreu peut aussi se lire « à Tormah », et beaucoup y voient une seconde mention d’Aruma."
    - "On ne peut guère en dire plus. Le nom est d’ordinaire retrouvé à Khirbet el-Urmah, ruine sur une haute colline conique à quelque 8 km au sud-est de Naplouse, l’antique Sichem. La céramique du sommet va de l’âge du Bronze à l’âge du Fer, la plupart du début de l’âge du Fer, mais les murs et tours qui s’y dressent appartiennent à une forteresse de l’époque hasmonéenne et hérodienne, et rien de ce qu’on y a trouvé ne nomme la ville. La colline se trouve aujourd’hui en Cisjordanie, au-dessus des villages du sud-est de Naplouse."
  it:
    - "Aruma era una città sulle colline di Efraim non lontano da Sichem, nota soltanto dalla storia di Abimelech, il figlio di Gedeone che si fece re di Sichem. Quando Gaal figlio di Ebed spinse gli uomini di Sichem alla rivolta, Zebul, il governatore della città, mandò un messaggio ad Abimelech, e dopo che Gaal fu battuto in campo «Abimelec si fermò ad Aruma, e Zebul cacciò Gaal e i suoi fratelli, che non poteron più rimanere a Sichem». Nel versetto precedente, dove Zebul manda messaggeri «segretamente», la parola ebraica può anche essere letta «a Tormah», e molti la ritengono una seconda menzione di Aruma."
    - "Poco altro si può dire. Il nome si ritrova di solito in Khirbet el-Urmah, una rovina su un’alta collina conica a circa 8 km a sud-est di Nablus, l’antica Sichem. La ceramica sulla sommità va dall’età del Bronzo all’età del Ferro, per la maggior parte del primo Ferro, ma le mura e le torri che vi stanno appartengono a una fortezza del periodo asmoneo ed erodiano, e nulla di ciò che vi è stato trovato nomina la città. La collina si trova oggi in Cisgiordania, sopra i villaggi a sud-est di Nablus."
  pl:
    - "Aruma było miastem w górach Efraima niedaleko Sychem, znanym tylko z opowieści o Abimeleku, synu Gedeona, który ogłosił się królem Sychem. Gdy Gaal, syn Ebeda, poderwał mieszkańców Sychem do buntu, Zebul, namiestnik miasta, dał znać Abimelekowi, a gdy Gaala pobito w polu, „został Abimelech w Aruma; a Zebul wygnał Gaala z bracią jego, aby nie mieszkali w Sychem”. We wcześniejszym wersecie, gdzie Zebul wysyła posłańców „potajemnie”, hebrajskie słowo można też czytać „w Tormie”, i wielu uważa to za drugą wzmiankę o Arumie."
    - "Niewiele więcej można powiedzieć. Miejsce utożsamia się zwykle z Chirbet el-Urmah, ruiną na wysokim stożkowatym wzgórzu około 8 km na południowy wschód od Nablusu, dawnego Sychem. Ceramika na szczycie sięga od epoki brązu przez epokę żelaza, w większości z wczesnej epoki żelaza, lecz stojące tam mury i wieże należą do twierdzy z okresu hasmonejskiego i herodiańskiego, a nic tam znalezionego nie podaje nazwy miasta. Wzgórze leży dziś na Zachodnim Brzegu, nad wsiami na południowy wschód od Nablusu."
  nl:
    - "Aruma was een stad in het Efraïmitische bergland niet ver van Sichem, alleen bekend uit het verhaal van Abimelech, de zoon van Gideon die zich tot koning van Sichem maakte. Toen Gaäl, de zoon van Ebed, de mannen van Sichem tot opstand aanzette, liet Zebul, de landvoogd van de stad, Abimelech waarschuwen, en nadat Gaäl in het veld was verslagen: “Abimelech nu bleef te Aruma; en Zebul verdreef Gaal en zijn broederen, dat zij te Sichem niet mochten wonen”. In het eerdere vers, waar Zebul boden “listiglijk” zendt, kan het Hebreeuwse woord ook gelezen worden als “te Tormah”, en velen houden dit voor een tweede vermelding van Aruma."
    - "Veel meer is er niet te zeggen. De naam wordt gewoonlijk gevonden in Khirbet el-Urmah, een ruïne op een hoge kegelvormige heuvel zo’n 8 km ten zuidoosten van Nablus, het oude Sichem. Aardewerk op de top loopt van de bronstijd door de ijzertijd, het meeste uit de vroege ijzertijd, maar de muren en torens die er staan, horen bij een vesting uit de Hasmonese en Herodiaanse tijd, en niets wat er is gevonden, noemt de stad. De heuvel ligt nu op de Westelijke Jordaanoever, boven de dorpen ten zuidoosten van Nablus."
  cs:
    - "Aruma bylo město v efrajimských horách nedaleko Šekemu, známé jen z příběhu o Abimelekovi, synu Gedeonově, který se učinil králem Šekemu. Když Gaal, syn Evedův, pobouřil muže Šekemu k vzpouře, poslal Zebul, správce města, zprávu Abimelekovi, a poté, co byl Gaal v poli poražen, „Zůstal pak Abimelech v Aruma, a Zebul vyhnal Gále i bratří jeho, aby nezůstávali v Sichem“. V dřívějším verši, kde Zebul posílá posly „tajně“, lze hebrejské slovo číst též „v Torma“ a mnozí v tom vidí druhou zmínku o Arumě."
    - "Víc říci nelze. Jméno se obvykle nachází v Chirbet el-Urma, zřícenině na vysokém kuželovitém pahorku asi 8 km jihovýchodně od Nábulusu, starověkého Šekemu. Keramika na vrcholu sahá od doby bronzové po dobu železnou, nejvíce z rané doby železné, ale hradby a věže, které tam stojí, patří k pevnosti z doby hasmoneovské a herodovské a nic tam nalezeného město nejmenuje. Pahorek leží dnes na Západním břehu nad vesnicemi jihovýchodně od Nábulusu."
  sv:
    - "Aruma var en stad i Efraims bergsbygd, inte långt från Shekem, känd bara från berättelsen om Avimelek, Gideons son som gjorde sig själv till kung av Shekem. När Gaal, Eveds son, uppviglade Shekems män till uppror sände Sevul, stadens ståthållare, bud till Avimelek, och sedan Gaal hade blivit slagen på fältet: ”Och Abimelek stannade i Aruma; men Sebul drev bort Gaal och hans bröder och lät dem icke längre stanna i Sikem”. I den tidigare versen, där Sevul sänder bud ”listeligen”, kan det hebreiska ordet också läsas ”i Tormah”, och många tar det för ett andra omnämnande av Aruma."
    - "Mer kan knappast sägas. Namnet återfinns vanligen i Khirbet el-Urmah, en ruin på en hög konisk kulle omkring 8 km sydost om Nablus, det forna Shekem. Keramik på toppen sträcker sig från bronsåldern genom järnåldern, mest från äldre järnåldern, men murarna och tornen som står där hör till en fästning från hasmoneisk och herodiansk tid, och inget som hittats där nämner staden. Kullen ligger i dag på Västbanken, ovanför byarna sydost om Nablus."
  nb:
    - "Aruma var en by i Efraims åser, ikke langt fra Sikem, bare kjent fra fortellingen om Abimelek, Gideons sønn som gjorde seg selv til konge av Sikem. Da Gaal, Ebeds sønn, hisset Sikems menn til opprør, sendte Sebul, byens høvedsmann, beskjed til Abimelek, og etter at Gaal var slått i marken, heter det: «Og Abimelek gav sig til i Aruma, og Sebul drev Ga'al og hans brødre bort, så de ikke blev boende lenger i Sikem». I det tidligere verset, der Sebul sender bud «hemmelig», kan det hebraiske ordet også leses «i Tormah», og mange tar det for en ny omtale av Aruma."
    - "Mer kan knapt sies. Navnet finnes vanligvis igjen i Khirbet el-Urmah, en ruin på en høy kjegleformet høyde omkring 8 km sørøst for Nablus, det gamle Sikem. Keramikk på toppen går fra bronsealderen gjennom jernalderen, mest fra tidlig jernalder, men murene og tårnene som står der, hører til en festning fra hasmoneisk og herodiansk tid, og ingenting funnet der nevner byen. Høyden ligger i dag på Vestbredden, over landsbyene sørøst for Nablus."
  tl:
    - "Ang Aruma ay bayan sa mga burol ng Ephraim na hindi kalayuan sa Sichem, na kilala lamang mula sa salaysay ni Abimelech, ang anak ni Gedeon na nagpahari sa sarili sa Sichem. Nang pasiklabin ni Gaal na anak ni Ebed ang mga lalaki ng Sichem sa paghihimagsik, nagpadala ng balita si Zebul, ang gobernador ng lungsod, kay Abimelech, at matapos matalo si Gaal sa bukid, “si Abimelech ay tumahan sa Aruma: at pinalayas ni Zebul si Gaal at ang kaniyang mga kapatid, upang sila'y huwag tumahan sa Sichem”. Sa naunang talata, kung saan nagsugo si Zebul ng mga sugo nang “lihim”, ang salitang Hebreo ay mababasa ring “sa Tormah”, at itinuturing ito ng marami na ikalawang pagbanggit sa Aruma."
    - "Kaunti na lamang ang masasabi. Ang pangalan ay karaniwang makikita sa Khirbet el-Urmah, isang guho sa mataas na korteng-kono na burol mga 8 km sa timog-silangan ng Nablus, ang sinaunang Sichem. Ang palayok sa tuktok ay mula Panahon ng Tanso hanggang Panahon ng Bakal, at karamihan ay mula sa maagang Panahon ng Bakal, ngunit ang mga pader at moog doon ay kabilang sa kuta ng panahong Hasmoneo at Herodiano, at walang natagpuang nagpapangalan sa bayan. Ang burol ay nasa West Bank ngayon, sa itaas ng mga nayon sa timog-silangan ng Nablus."
  da:
    - "Aruma var en by i Efraims bjerge ikke langt fra Sikem, kendt kun fra fortællingen om Abimelek, Gideons søn, som gjorde sig til konge i Sikem. Da Gaal, Ebeds søn, ophidsede mændene i Sikem til oprør, sendte Zebul, byens guvernør, bud til Abimelek, og efter at Gaal var slået på marken, »Og Abimelek blev i Aruma; men Sebul uddrev Gaal og hans Brødre, saa at de ikke maatte blive i Sikem«. I det tidligere vers, hvor Zebul sender bud »i Smug«, kan det hebraiske ord også læses »i Torma«, og mange tager det for en anden omtale af Aruma."
    - "Meget mere kan ikke siges. Navnet findes sædvanligvis i Khirbet el-Urmah, en ruin på en høj kegleformet bakke omkring 8 km sydøst for Nablus, det gamle Sikem. Keramik på toppen går fra bronzealderen gennem jernalderen, mest fra tidlig jernalder, men murene og tårnene, der står dér, hører til en fæstning fra hasmonæisk og herodiansk tid, og intet fundet dér nævner byen. Bakken ligger i dag på Vestbredden, over landsbyerne sydøst for Nablus."
  sr:
    - "Аруман је био град у јефремским брдима недалеко од Сихема, познат само из приче о Авимелеху, сину Гедеоновом који се поставио за цара Сихема. Када је Гал син Еведов подигао Сихемљане на побуну, Зевул, управитељ града, јавио је Авимелеху, а пошто је Гал побеђен у пољу, „Авимелех оста у Аруми; а Зевул истера Гала и браћу његову, те не могаху седети у Сихему“. У ранијем стиху, где Зевул шаље посланике „тајно“, хебрејска реч се може читати и „у Тормаху“, и многи је узимају за друго помињање Арумана."
    - "Више се мало може рећи. Име се обично налази у Хирбет ел-Урми, рушевини на високом купастом брегу неких 8 км југоисточно од Наблуса, древног Сихема. Керамика на врху иде од бронзаног доба кроз гвоздено, највише из раног гвозденог доба, али зидови и куле који тамо стоје припадају тврђави хасмонејског и иродовског периода, и ништа нађено тамо не именује град. Брег данас лежи на Западној обали, изнад села југоисточно од Наблуса."
  hu:
    - "Aruma Efraim hegyvidékén, Sikem közelében fekvő város volt, amelyet csak Abimélek története ismer, Gedeon fiáé, aki Sikem királyává tette magát. Amikor Gaál, Ébed fia fellázította Sikem férfiait, Zebul, a város kormányzója hírt küldött Abiméleknek, és miután Gaált a mezőn megverték: „Abimélek pedig Arumában maradt, és Zebul elűzte Gaált és atyjafiait, hogy ne lakjanak Sikemben.” A korábbi versben, ahol Zebul követeket küld – a King James-fordítás szerint titokban, a Károli-fordítás szerint „Thormába” –, a héber szó „Tormában”-ként is olvasható, és sokan ezt Aruma második említésének tartják."
    - "Többet nem lehet mondani. A nevet általában a Khirbet el-Urmahban találják meg, egy magas kúp alakú dombon álló romban, a bibliai Sikem, Nábulusz városától mintegy 8 km-re délkeletre. A csúcson a kerámia a bronzkortól a vaskoron át terjed, többsége a korai vaskorból való, de az ott álló falak és tornyak egy hasmoneus és hérodesi kori erődhöz tartoznak, és semmi sem nevezi meg a várost. A domb ma a Nyugati Parton fekszik, a Nábulusztól délkeletre fekvő falvak fölött."
  fi:
    - "Aruma oli kaupunki Efraimin kukkuloilla lähellä Sikemiä, tunnettu vain Abimelekin, Gideonin pojan, joka teki itsensä Sikemin kuninkaaksi, kertomuksesta. Kun Gaal, Ebedin poika, yllytti Sikemin miehet kapinaan, kaupungin käskynhaltija Sebul lähetti viestin Abimelekille, ja kun Gaal oli lyöty kentällä, ”Abimelek jäi Arumaan; mutta Sebul karkoitti Gaalin ja hänen veljensä pois Sikemistä”. Aiemmassa jakeessa, jossa Sebul lähettää sanansaattajia ”salaa”, heprean sana voidaan lukea myös ”Tormahissa”, ja monet pitävät sitä Arumaan toisena mainintana."
    - "Enempää ei voi sanoa. Nimi löydetään yleensä Khirbet el-Urmahista, korkealla kartiomaisella kukkulalla olevasta rauniosta noin 8 km Nablusista, muinaisesta Sikemistä, kaakkoon. Huipulta löytynyt keramiikka ulottuu pronssikaudelta rautakaudelle, ja suurin osa on varhaiselta rautakaudelta, mutta siellä seisovat muurit ja tornit kuuluvat hasmonealais- ja herodeslaisajan linnoitukseen, eikä mikään sieltä löydetty nimeä kaupunkia. Kukkula sijaitsee nykyisin Länsirannalla Nablusista kaakkoon sijaitsevien kylien yläpuolella."
  vi:
    - "A-ru-ma là một thành trong vùng đồi Ép-ra-im không xa Si-chem, chỉ được biết qua câu chuyện về A-bi-mê-léc, con của Ghê-đê-ôn đã tự lập làm vua Si-chem. Khi Ga-anh con trai Ê-bết xúi dân Si-chem nổi dậy, Xê-bun, tổng đốc thành, báo tin cho A-bi-mê-léc, và sau khi Ga-anh bị đánh bại ngoài đồng, “A-bi-mê-léc đi ở tại A-ru-ma. Còn Xê-bun đuổi Ga-anh và anh em người đi, không cho ở tại Si-chem nữa”. Trong câu trước, nơi Xê-bun sai sứ giả “mật”, từ Hê-bơ-rơ cũng có thể đọc là “tại Tormah”, và nhiều người cho đó là lần nhắc thứ hai đến A-ru-ma."
    - "Có thể nói thêm rất ít. Tên thường được tìm thấy trong Khirbet el-Urmah, một tàn tích trên ngọn đồi hình nón cao cách Nablus, tức Si-chem cổ, khoảng 8 km về phía đông nam. Đồ gốm trên đỉnh có từ thời Đồ Đồng qua Đồ Sắt, phần lớn từ đầu thời Đồ Sắt, nhưng các bức tường và tháp còn đứng ở đó thuộc về một pháo đài thời Hasmonaea và Hê-rốt, và không có gì tìm thấy ở đó nêu tên thành. Ngọn đồi ngày nay nằm ở Bờ Tây, phía trên các làng đông nam Nablus."
  ro:
    - "Aruma era o cetate din dealurile lui Efraim, nu departe de Sihem, cunoscută doar din povestea lui Abimelec, fiul lui Ghedeon, care s-a făcut rege al Sihemului. Când Gaal, fiul lui Ebed, i-a stârnit la revoltă pe oamenii din Sihem, Zebul, guvernatorul cetății, i-a trimis vorbă lui Abimelec, iar după ce Gaal a fost învins pe câmp, „Și a șezut Avimeleh în Arima, și Zevul a scos pre Gaal și pre frații lui, ca să nu lăcuiască în Sichem”. În versetul anterior, în care Zebul trimite soli pe ascuns, cuvântul ebraic poate fi citit și „în Tormah”, iar mulți îl socotesc o a doua menționare a Arumei."
    - "Nu se poate spune mult mai mult. Numele este găsit de obicei în Khirbet el-Urmah, o ruină pe un deal înalt conic, la aproximativ 8 km sud-est de Nablus, vechiul Sihem. Ceramica de pe vârf se întinde de la epoca bronzului prin epoca fierului, cea mai mare parte din epoca fierului timpurie, dar zidurile și turnurile care stau acolo aparțin unei fortărețe din perioada hasmoneeană și irodiană, iar nimic găsit acolo nu numește cetatea. Dealul se află astăzi în Cisiordania, deasupra satelor de la sud-est de Nablus."
  bg:
    - "Арума била град в ефремските хълмове недалеч от Сихем, известен само от разказа за Авимелех, сина на Гедеон, който се провъзгласил за цар на Сихем. Когато Гаал, синът на Евед, вдигнал сихемците на бунт, Зевул, управителят на града, пратил вест на Авимелех и след като Гаал бил победен на полето, „И седна Авимелех в Арума; а Зевул изпъди Гаала и братята му да не живеят в Сихем“. В по-ранния стих, където Зевул праща вестители „скришно“, еврейската дума може да се чете и „в Торма“, и мнозина я вземат за второ споменаване на Арума."
    - "Едва ли може да се каже нещо повече. Името обикновено се намира в Хирбет ел-Урма — развалина на висок конусовиден хълм на около 8 км югоизточно от Наблус, древния Сихем. Керамиката на върха върви от бронзовата епоха през желязната, като по-голямата част е от ранната желязна, но стените и кулите, които стоят там, принадлежат на крепост от хасмонейския и иродианския период и нищо намерено там не назовава града. Хълмът лежи днес на Западния бряг, над селата югоизточно от Наблус."
