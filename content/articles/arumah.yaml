# Overview article (ADR 0007). Mainstream facts only; a town known from one chapter of Judges; the reading of 9:31 as a second mention is given as a proposal; the identification with Khirbet el-Urmah rests on the name.
id: arumah
place: af536fb
title:
  en: "Arumah"
  ru: "Арума"
  uk: "Арума"
  es: "Aruma"
  pt: "Aruma"
  de: "Aruma"
  fr: "Aruma"
body:
  en:
    - "Arumah was a town in the hills of Ephraim not far from Shechem, known only from the story of Abimelech, the son of Gideon who made himself king of Shechem. When Gaal son of Ebed stirred the men of Shechem to revolt, Zebul, the governor of the city, sent word to Abimelech, and after Gaal was beaten in the field “Abimelech dwelt at Arumah: and Zebul thrust out Gaal and his brethren, that they should not dwell in Shechem”. In the earlier verse, where Zebul sends messengers “privily”, the Hebrew word can also be read “in Tormah”, and many take it for a second mention of Arumah."
    - "Little more can be said. The name is usually found in Khirbet el-Urmah, a ruin on a high conical hill some 8 km south-east of Nablus, the ancient Shechem. Pottery on the summit runs from the Bronze Age through the Iron Age, with most from the early Iron Age, but the walls and towers that stand there belong to a fortress of the Hasmonean and Herodian period, and nothing found there names the town. The hill lies today in the West Bank, above the villages south-east of Nablus."
  ru:
    - "Арума — город в горах Ефремовых недалеко от Сихема, известный только по рассказу об Авимелехе, сыне Гедеона, который сделал себя царём Сихема. Когда Гаал, сын Еведов, поднял жителей Сихема на мятеж, Зевул, начальник города, известил Авимелеха, и после того как Гаал был разбит в поле, «остался Авимелех в Аруме, а Гаала и братьев его Зевул выгнал, чтоб они не жили в Сихеме». В более раннем стихе, где Зевул посылает послов «хитрым образом», еврейское слово можно прочесть и как «в Торме», и многие видят в нём второе упоминание Арумы."
    - "Больше сказать почти нечего. Имя обычно находят в Хирбет-Урме, развалинах на высоком конусовидном холме примерно в 8 км к юго-востоку от Наблуса, древнего Сихема. Керамика на вершине относится к бронзовому и железному векам, больше всего — к раннему железному, но стоящие там стены и башни принадлежат крепости хасмонейского и иродова времени, и ничто найденное там не называет города. Холм лежит сегодня на Западном берегу, над сёлами к юго-востоку от Наблуса."
  uk:
    - "Арума було містом у нагір'ї Єфрема неподалік від Сихема, відомим лише з оповіді про Авімелеха, сина Гедеона, який зробив себе царем Сихема. Коли Гаал, син Еведа, підбурив сихемців до бунту, Зевул, намісник міста, послав звістку Авімелехові, і після того як Гаала було розбито в полі, «остався Абимелех ув Арумі, а Зебул уганяв за Гаалом та його товаришами, й не було їм вже притулку в Сихемі». У попередньому вірші, де Зевул посилає посланців «тайком», єврейське слово можна прочитати й як «в Тормі», і багато хто вважає це другою згадкою Арума."
    - "Більше сказати майже нічого. Назву зазвичай знаходять у Хірбет-ель-Урмі, руїні на високому конічному пагорбі приблизно за 8 км на південний схід від Наблуса, давнього Сихема. Кераміка на вершині охоплює бронзову добу та залізну, найбільше раннього залізного віку, але мури й башти, що там стоять, належать до фортеці хасмонейського й іродіанського часу, і ніщо знайдене там не називає міста. Пагорб лежить нині на Західному березі над селами на південний схід від Наблуса."
  es:
    - "Aruma era una ciudad de la región montañosa de Efraín, no lejos de Siquem, conocida solo por la historia de Abimelec, el hijo de Gedeón que se hizo rey de Siquem. Cuando Gaal hijo de Ebed incitó a los hombres de Siquem a la rebelión, Zebul, el gobernador de la ciudad, mandó aviso a Abimelec, y tras ser vencido Gaal en el campo, «Abimelech se quedó en Aruma; y Zebul echó fuera á Gaal y á sus hermanos, para que no morasen en Sichêm». En el versículo anterior, donde Zebul envía mensajeros «sagazmente», la palabra hebrea puede leerse también «en Tormá», y muchos la toman por una segunda mención de Aruma."
    - "Poco más puede decirse. El nombre suele encontrarse en Khirbet el-Urmah, una ruina en una alta colina cónica a unos 8 km al sudeste de Nablus, la antigua Siquem. La cerámica de la cima va desde la Edad del Bronce hasta la edad del Hierro, con la mayor parte de la edad del Hierro antigua, pero las murallas y torres que allí se alzan pertenecen a una fortaleza de época asmonea y herodiana, y nada de lo hallado allí nombra la ciudad. Hoy la colina se encuentra en Cisjordania, sobre las aldeas al sudeste de Nablus."
  pt:
    - "Aruma era uma cidade nas colinas de Efraim, não longe de Siquém, conhecida apenas pela história de Abimeleque, filho de Gideão, que se fez rei de Siquém. Quando Gaal, filho de Ebede, incitou os homens de Siquém à revolta, Zebul, governador da cidade, mandou avisar Abimeleque, e depois que Gaal foi vencido no campo, “Abimeleque fixou residência em Arumá; e Zebul expulsou Gaal e os seus irmãos, para que não habitassem em Siquém”. No versículo anterior, onde Zebul manda mensageiros “astutamente”, a palavra hebraica também pode ser lida “em Tormá”, e muitos a tomam por uma segunda menção de Aruma."
    - "Pouco mais se pode dizer. O nome costuma ser achado em Khirbet el-Urmah, uma ruína numa colina cônica elevada, cerca de 8 km a sudeste de Nablus, a antiga Siquém. A cerâmica no cume vai da Idade do Bronze à do Ferro, com a maior parte do Ferro antigo, mas as muralhas e torres que ali se erguem pertencem a uma fortaleza do período hasmoneu e herodiano, e nada achado ali nomeia a cidade. A colina fica hoje na Cisjordânia, acima das aldeias a sudeste de Nablus."
  de:
    - "Aruma war eine Stadt im Bergland Ephraim nicht weit von Sichem, nur aus der Geschichte Abimelechs bekannt, des Sohnes Gideons, der sich zum König von Sichem machte. Als Gaal, der Sohn Ebeds, die Männer von Sichem zum Aufstand aufwiegelte, sandte Sebul, der Statthalter der Stadt, Botschaft an Abimelech, und nachdem Gaal im Feld geschlagen war: „Und Abimelech blieb zu Aruma. Sebul aber verjagte den Gaal und seine Brüder, die zu Sichem nicht durften bleiben“. Im früheren Vers, wo Sebul „heimlich“ Boten sendet, kann das hebräische Wort auch „in Tormah“ gelesen werden, und viele halten es für eine zweite Erwähnung von Aruma."
    - "Mehr lässt sich kaum sagen. Der Name wird gewöhnlich in Chirbet el-Urma gefunden, einer Ruine auf einem hohen Kegelhügel etwa 8 km südöstlich von Nablus, dem antiken Sichem. Keramik auf dem Gipfel reicht von der Bronzezeit durch die Eisenzeit, das meiste aus der frühen Eisenzeit, doch die dort stehenden Mauern und Türme gehören zu einer Festung der hasmonäischen und herodianischen Zeit, und nichts dort Gefundenes nennt die Stadt. Der Hügel liegt heute im Westjordanland, über den Dörfern südöstlich von Nablus."
  fr:
    - "Aruma était une ville des collines d’Éphraïm non loin de Sichem, connue seulement par l’histoire d’Abimélec, le fils de Gédéon qui se fit roi de Sichem. Quand Gaal, fils d’Ébed, souleva les hommes de Sichem, Zebul, gouverneur de la ville, avertit Abimélec, et après que Gaal eut été battu aux champs, « Abimélec s’arrêta à Aruma. Et Zebul chassa Gaal et ses frères, qui ne purent rester à Sichem ». Dans le verset précédent, où Zebul envoie des messagers « secrètement », le mot hébreu peut aussi se lire « à Tormah », et beaucoup y voient une seconde mention d’Aruma."
    - "On ne peut guère en dire plus. Le nom est d’ordinaire retrouvé à Khirbet el-Urmah, ruine sur une haute colline conique à quelque 8 km au sud-est de Naplouse, l’antique Sichem. La céramique du sommet va de l’âge du Bronze à l’âge du Fer, la plupart du début de l’âge du Fer, mais les murs et tours qui s’y dressent appartiennent à une forteresse de l’époque hasmonéenne et hérodienne, et rien de ce qu’on y a trouvé ne nomme la ville. La colline se trouve aujourd’hui en Cisjordanie, au-dessus des villages du sud-est de Naplouse."
