# Overview article (ADR 0007). Mainstream facts only; Ramat Rahel is given as the usual identification, Ein Karem on Jerome's note as the older one; the Qumran and Mishnah mentions are noted.
id: beth-haccherem
place: a30f9a0
title:
  en: "Beth-haccherem"
  ru: "Бефкарем"
body:
  en:
    - "Beth-haccherem, “house of the vineyard”, was a town of Judah near Jerusalem, on a height from which a signal could be seen. Jeremiah, warning of the enemy from the north, cries: “O ye children of Benjamin, gather yourselves to flee out of the midst of Jerusalem, and blow the trumpet in Tekoa, and set up a sign of fire in Beth-haccerem”. Under the Persians it was the seat of a district: among those who rebuilt the wall with Nehemiah was “Malchiah the son of Rechab, the ruler of part of Beth-haccerem”, who repaired the Dung Gate. The Genesis Apocryphon from Qumran places the King's Valley, where Abraham met Melchizedek, in “the valley of Beth-haccherem”, and the Mishnah knows the stones of the altar as taken from its valley and the colour of its earth as a standard for red."
    - "Since Yohanan Aharoni's excavations of 1954 and 1959–1962 most scholars put it at Ramat Rahel, a hill on the southern edge of Jerusalem halfway to Bethlehem. There a palace of the last kings of Judah came to light, with stone capitals, carved window balustrades and hundreds of stamped jar handles, and a Persian-period administrative centre with its own stamps; renewed digging in 2005–2010 uncovered a terraced royal garden with pools and channels. The fit with a district capital and a fire-signal hill is good, but no inscription names the place. Jerome, who could see a village Bethacharma from Bethlehem, led some to the hill of Herodium; an older view, from the name alone, looked to Ein Karem west of the city. Ramat Rahel today is a kibbutz with the excavations laid out as an archaeological park."
  ru:
    - "Бефкарем, «дом виноградника», — город Иуды близ Иерусалима, на высоте, с которой был виден сигнал. Иеремия, предупреждая о враге с севера, восклицает: «Бегите, дети Вениаминовы, из среды Иерусалима, и в Фекое трубите трубою и дайте знать огнем в Бефкареме». При персах он был центром округа: среди восстанавливавших стену с Неемией был «Малхия, сын Рехава, начальник Бефкаремского округа», чинивший Навозные ворота. Кумранский Апокриф Бытия помещает Царскую долину, где Авраам встретил Мелхиседека, в «долину Беф-Керем», а Мишна знает камни жертвенника как взятые из его долины и цвет его земли как мерило красного."
    - "После раскопок Йоханана Ахарони 1954 и 1959–1962 годов большинство учёных помещают его в Рамат-Рахель, на холме у южного края Иерусалима, на полпути к Вифлеему. Там открылся дворец последних царей Иуды с каменными капителями, резными оконными балюстрадами и сотнями клеймёных ручек сосудов, а также административный центр персидского времени со своими клеймами; новые раскопки 2005–2010 годов открыли террасный царский сад с водоёмами и каналами. Это хорошо подходит к центру округа и сигнальному холму, но ни одна надпись места не называет. Иероним, видевший селение Бетахарму из Вифлеема, навёл иных на холм Иродиона; более старый взгляд, по одному имени, искал его в Эйн-Кареме к западу от города. Рамат-Рахель сегодня — кибуц, а раскопки устроены как археологический парк."
scripture:
