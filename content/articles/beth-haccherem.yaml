# Overview article (ADR 0007). Mainstream facts only; Ramat Rahel is given as the usual identification, Ein Karem on Jerome's note as the older one; the Qumran and Mishnah mentions are noted.
id: beth-haccherem
place: a30f9a0
title:
  en: "Beth-haccherem"
  ru: "Бефкарем"
  uk: "Бет-Гакерем"
  es: "Bet-haquerem"
  pt: "Bete-Haquerém"
  de: "Bet-Kerem"
  fr: "Beth-Hakkerem"
body:
  en:
    - "Beth-haccherem, “house of the vineyard”, was a town of Judah near Jerusalem, on a height from which a signal could be seen. Jeremiah, warning of the enemy from the north, cries: “O ye children of Benjamin, gather yourselves to flee out of the midst of Jerusalem, and blow the trumpet in Tekoa, and set up a sign of fire in Beth-haccerem”. Under the Persians it was the seat of a district: among those who rebuilt the wall with Nehemiah was “Malchiah the son of Rechab, the ruler of part of Beth-haccerem”, who repaired the Dung Gate. The Genesis Apocryphon from Qumran places the King's Valley, where Abraham met Melchizedek, in “the valley of Beth-haccherem”, and the Mishnah knows the stones of the altar as taken from its valley and the colour of its earth as a standard for red."
    - "Since Yohanan Aharoni's excavations of 1954 and 1959–1962 most scholars put it at Ramat Rahel, a hill on the southern edge of Jerusalem halfway to Bethlehem. There a palace of the last kings of Judah came to light, with stone capitals, carved window balustrades and hundreds of stamped jar handles, and a Persian-period administrative centre with its own stamps; renewed digging in 2005–2010 uncovered a terraced royal garden with pools and channels. The fit with a district capital and a fire-signal hill is good, but no inscription names the place. Jerome, who could see a village Bethacharma from Bethlehem, led some to the hill of Herodium; an older view, from the name alone, looked to Ein Karem west of the city. Ramat Rahel today is a kibbutz with the excavations laid out as an archaeological park."
  ru:
    - "Бефкарем, «дом виноградника», — город Иуды близ Иерусалима, на высоте, с которой был виден сигнал. Иеремия, предупреждая о враге с севера, восклицает: «Бегите, дети Вениаминовы, из среды Иерусалима, и в Фекое трубите трубою и дайте знать огнем в Бефкареме». При персах он был центром округа: среди восстанавливавших стену с Неемией был «Малхия, сын Рехава, начальник Бефкаремского округа», чинивший Навозные ворота. Кумранский Апокриф Бытия помещает Царскую долину, где Авраам встретил Мелхиседека, в «долину Беф-Керем», а Мишна знает камни жертвенника как взятые из его долины и цвет его земли как мерило красного."
    - "После раскопок Йоханана Ахарони 1954 и 1959–1962 годов большинство учёных помещают его в Рамат-Рахель, на холме у южного края Иерусалима, на полпути к Вифлеему. Там открылся дворец последних царей Иуды с каменными капителями, резными оконными балюстрадами и сотнями клеймёных ручек сосудов, а также административный центр персидского времени со своими клеймами; новые раскопки 2005–2010 годов открыли террасный царский сад с водоёмами и каналами. Это хорошо подходит к центру округа и сигнальному холму, но ни одна надпись места не называет. Иероним, видевший селение Бетахарму из Вифлеема, навёл иных на холм Иродиона; более старый взгляд, по одному имени, искал его в Эйн-Кареме к западу от города. Рамат-Рахель сегодня — кибуц, а раскопки устроены как археологический парк."
  uk:
    - "Бет-Гакерем, «дім виноградника», було містом Юди поблизу Єрусалима, на висоті, з якої було видно сигнал. Єремія, застерігаючи про ворога з півночі, волає: «Втїкайте, Беняминїї, з Ерусалиму, й затрубіте трубою в Текої; дайте знак огнем у Беткаремі». За персів воно було осередком округу: серед тих, хто відбудовував мур із Неемією, був «Малхія, син Рехавів, старшина повіту Беткаремського», який лагодив Гноєві ворота. «Апокриф Буття» з Кумрану розміщує Царську долину, де Авраам зустрів Мелхиседека, у «долині Бет-Гакерема», а Мішна знає каміння жертовника як узяте з її долини й колір її землі як мірило для червоного."
    - "Від розкопок Йоханана Агароні 1954 та 1959–1962 рр. більшість учених ставить його в Рамат-Рахелі, на пагорбі на південному краї Єрусалима на півдорозі до Вифлеєма. Там виявився палац останніх царів Юди з кам'яними капітелями, різьбленими балюстрадами вікон і сотнями штампованих ручок глеків, а також адміністративний центр перського періоду зі власними штампами; відновлені розкопки 2005–2010 рр. виявили терасований царський сад з басейнами й каналами. Відповідність столиці округу та пагорбу вогняних сигналів добра, але жоден напис не називає місця. Єронім, який з Вифлеєма бачив село Бетахарма, підштовхнув деяких до пагорба Іродіон; давніший погляд, лише з назви, дивився на Ейн-Керем на захід від міста. Рамат-Рахель нині — кібуц з розкопками, облаштованими як археологічний парк."
  es:
    - "Bet-haquerem, «casa de la viña», era una ciudad de Judá cerca de Jerusalén, en una altura desde la que podía verse una señal. Jeremías, al advertir del enemigo del norte, clama: «HUID, hijos de Benjamín, de en medio de Jerusalem, y tocad bocina en Tecoa, y alzad por señal humo sobre Beth-hacchêrem». Bajo los persas fue sede de un distrito: entre los que reconstruyeron la muralla con Nehemías estaba «Malchîas hijo de Rechâb, príncipe de la provincia de Beth-haccerem», que reparó la Puerta del Muladar. El Apócrifo del Génesis, de Qumrán, sitúa el Valle del Rey, donde Abraham se encontró con Melquisedec, en «el valle de Bet-haquerem», y la Misná conoce las piedras del altar como tomadas de su valle y el color de su tierra como patrón del rojo."
    - "Desde las excavaciones de Yohanan Aharoni en 1954 y 1959–1962, la mayoría la sitúa en Ramat Rahel, colina al sur de Jerusalén a medio camino de Belén. Allí salió a la luz un palacio de los últimos reyes de Judá, con capiteles de piedra, balaustradas de ventana talladas y centenares de asas de jarra selladas, y un centro administrativo persa con sus sellos; nuevas excavaciones en 2005–2010 descubrieron un jardín real en terrazas con estanques y canales. El encaje con una capital de distrito y una colina de señales de fuego es bueno, pero ninguna inscripción nombra el lugar. Jerónimo, que veía desde Belén una aldea Bethacharma, llevó a algunos a la colina del Herodión; una opinión más antigua, basada solo en el nombre, miraba a Ein Karem, al oeste de la ciudad. Hoy Ramat Rahel es un kibutz con las excavaciones como parque arqueológico."
  pt:
    - "Bete-Haquerém, “casa da vinha”, era uma cidade de Judá perto de Jerusalém, numa altura de onde se podia ver um sinal. Jeremias, advertindo do inimigo do norte, clama: “Fujam para um lugar seguro, filhos de Benjamim, do meio de Jerusalém! Toquem a trombeta em Tecoa e levantem um sinal em Bete-Haquerém”. Sob os persas foi sede de um distrito: entre os que reconstruíram a muralha com Neemias estava “Malquias, filho de Recabe, governante do distrito de Bete-Haquerém”, que reparou a Porta do Esterco. O Gênesis Apócrifo de Qumran situa o vale do Rei, onde Abraão encontrou Melquisedeque, no “vale de Bete-Haquerém”, e a Mishná conhece as pedras do altar como tiradas de seu vale e a cor de sua terra como padrão do vermelho."
    - "Desde as escavações de Yohanan Aharoni em 1954 e 1959–1962, a maioria dos estudiosos a põe em Ramat Rachel, uma colina na borda sul de Jerusalém, a meio caminho de Belém. Ali veio à luz um palácio dos últimos reis de Judá, com capitéis de pedra, balaustradas de janela esculpidas e centenas de alças de jarros carimbadas, e um centro administrativo do período persa com carimbos próprios; escavações renovadas em 2005–2010 descobriram um jardim real em terraços, com tanques e canais. O ajuste com uma capital de distrito e uma colina de sinais de fogo é bom, mas nenhuma inscrição nomeia o lugar. Jerônimo, que via de Belém uma aldeia Bethacharma, levou alguns à colina do Herodium; uma opinião mais antiga, só pelo nome, olhava para Ein Karem, a oeste da cidade. Ramat Rachel é hoje um quibutz, com as escavações dispostas como parque arqueológico."
  de:
    - "Bet-Kerem, „Haus des Weinbergs“, war eine Stadt Judas nahe Jerusalem, auf einer Höhe, von der aus ein Signal zu sehen war. Jeremia ruft, den Feind aus dem Norden ankündigend: „Fliehet, ihr Kinder Benjamin, aus Jerusalem und blaset die Drommete auf der Warte Thekoa und werft auf ein Panier über der Warte Beth-Cherem!“ Unter den Persern war sie Sitz eines Bezirks: Unter denen, die mit Nehemia die Mauer wieder aufbauten, war „Malchia, der Sohn Rechabs, der Oberste des Kreises von Beth-Cherem“, der das Misttor ausbesserte. Das Genesis-Apokryphon aus Qumran setzt das Königstal, wo Abraham Melchisedek begegnete, in „das Tal von Bet-Kerem“, und die Mischna kennt die Steine des Altars als aus seinem Tal genommen und die Farbe seiner Erde als Maßstab für Rot."
    - "Seit Yohanan Aharonis Grabungen 1954 und 1959–1962 setzen die meisten Gelehrten es nach Ramat Rachel, einen Hügel am Südrand Jerusalems auf halbem Weg nach Bethlehem. Dort kam ein Palast der letzten Könige von Juda zutage, mit Steinkapitellen, geschnitzten Fensterbalustraden und Hunderten gestempelter Krughenkel, sowie ein Verwaltungszentrum der Perserzeit mit eigenen Stempeln; erneute Grabungen 2005–2010 legten einen terrassierten königlichen Garten mit Becken und Kanälen frei. Die Passung zu einer Bezirkshauptstadt und einem Feuersignalhügel ist gut, doch keine Inschrift nennt den Ort. Hieronymus, der von Bethlehem aus ein Dorf Bethacharma sehen konnte, führte manche auf den Hügel des Herodeion; eine ältere Ansicht blickte allein nach dem Namen auf Ein Kerem westlich der Stadt. Ramat Rachel ist heute ein Kibbuz mit den Grabungen als archäologischem Park."
  fr:
    - "Beth-Hakkerem, « maison de la vigne », était une ville de Juda près de Jérusalem, sur une hauteur d’où l’on pouvait voir un signal. Jérémie, avertissant de l’ennemi venu du nord, crie : « Fuyez, enfants de Benjamin, du milieu de Jérusalem, sonnez de la trompette à Tekoa, élevez un signal à Beth-Hakkérem ! » Sous les Perses, elle était le siège d’un district : parmi ceux qui rebâtirent le mur avec Néhémie était « Malkija, fils de Récab, chef du district de Beth-Hakkérem », qui répara la porte du fumier. L’Apocryphe de la Genèse de Qumrân place la Vallée du Roi, où Abraham rencontra Melchisédek, dans « la vallée de Beth-Hakkérem », et la Mishna connaît les pierres de l’autel comme tirées de sa vallée et la couleur de sa terre comme étalon du rouge."
    - "Depuis les fouilles de Yohanan Aharoni en 1954 et 1959-1962, la plupart des savants la placent à Ramat Rahel, colline au bord sud de Jérusalem à mi-chemin de Bethléem. On y a mis au jour un palais des derniers rois de Juda, avec chapiteaux, balustrades de fenêtres sculptées et des centaines d’anses de jarres estampillées, et un centre administratif perse avec ses propres estampilles ; des fouilles en 2005-2010 ont dégagé un jardin royal en terrasses avec bassins et canaux. L’accord avec une capitale de district et une colline à signaux de feu est bon, mais aucune inscription ne nomme le lieu. Jérôme, qui voyait de Bethléem un village Bethacharma, en conduisit certains à la colline d’Hérodion ; une opinion plus ancienne, d’après le seul nom, regardait vers Ein Karem à l’ouest. Ramat Rahel est aujourd’hui un kibboutz dont les fouilles forment un parc archéologique."
