body:
  en:
    - "Beth-haccherem, “house of the vineyard”, was a town of Judah near Jerusalem, on a height from which a signal could be seen. Jeremiah, warning of the enemy from the north, cries: “O ye children of Benjamin, gather yourselves to flee out of the midst of Jerusalem, and blow the trumpet in Tekoa, and set up a sign of fire in Beth-haccerem”. Under the Persians it was the seat of a district: among those who rebuilt the wall with Nehemiah was “Malchiah the son of Rechab, the ruler of part of Beth-haccerem”, who repaired the Dung Gate. The Genesis Apocryphon from Qumran places the King's Valley, where Abraham met Melchizedek, in “the valley of Beth-haccherem”, and the Mishnah knows the stones of the altar as taken from its valley and water coloured by the earth of its valley as the measure for one of the shades of blood."
    - "Since Yohanan Aharoni's excavations of 1954 and 1959–1962 most scholars put it at Ramat Rahel, a hill on the southern edge of Jerusalem halfway to Bethlehem. There a palace of the last kings of Judah came to light, with stone capitals, carved window balustrades and hundreds of stamped jar handles, and a Persian-period administrative centre with its own stamps; renewed digging in 2005–2010 uncovered a terraced royal garden with pools and channels. The fit with a district capital and a fire-signal hill is good, but no inscription names the place. Jerome, who could see a village Bethacharma from Bethlehem, led some to the hill of Herodium; an older view, from the name alone, looked to Ein Karem west of the city. Ramat Rahel today is a kibbutz with the excavations laid out as an archaeological park."
  ru:
    - "Бефкарем, «дом виноградника», — город Иуды близ Иерусалима, на высоте, с которой был виден сигнал. Иеремия, предупреждая о враге с севера, восклицает: «Бегите, дети Вениаминовы, из среды Иерусалима, и в Фекое трубите трубою и дайте знать огнем в Бефкареме». При персах он был центром округа: среди восстанавливавших стену с Неемией был «Малхия, сын Рехава, начальник Бефкаремского округа», чинивший Навозные ворота. Кумранский Апокриф Бытия помещает Царскую долину, где Авраам встретил Мелхиседека, в «долину Беф-Керем», а Мишна знает камни жертвенника как взятые из его долины и воду, окрашенную землёй его долины, как мерило одного из оттенков крови."
    - "После раскопок Йоханана Ахарони 1954 и 1959–1962 годов большинство учёных помещают его в Рамат-Рахель, на холме у южного края Иерусалима, на полпути к Вифлеему. Там открылся дворец последних царей Иуды с каменными капителями, резными оконными балюстрадами и сотнями клеймёных ручек сосудов, а также административный центр персидского времени со своими клеймами; новые раскопки 2005–2010 годов открыли террасный царский сад с водоёмами и каналами. Это хорошо подходит к центру округа и сигнальному холму, но ни одна надпись места не называет. Иероним, видевший селение Бетахарму из Вифлеема, навёл иных на холм Иродиона; более старый взгляд, по одному имени, искал его в Эйн-Кареме к западу от города. Рамат-Рахель сегодня — кибуц, а раскопки устроены как археологический парк."
  uk:
    - "Бет-Гакерем, «дім виноградника», було містом Юди поблизу Єрусалима, на висоті, з якої було видно сигнал. Єремія, застерігаючи про ворога з півночі, волає: «Втїкайте, Беняминїї, з Ерусалиму, й затрубіте трубою в Текої; дайте знак огнем у Беткаремі». За персів воно було осередком округу: серед тих, хто відбудовував мур із Неемією, був «Малхія, син Рехавів, старшина повіту Беткаремського», який лагодив Гноєві ворота. «Апокриф Буття» з Кумрану розміщує Царську долину, де Авраам зустрів Мелхиседека, у «долині Бет-Гакерема», а Мішна знає каміння жертовника як узяте з її долини й воду, забарвлену землею її долини, як мірило одного з відтінків крові."
    - "Від розкопок Йоханана Агароні 1954 та 1959–1962 рр. більшість учених ставить його в Рамат-Рахелі, на пагорбі на південному краї Єрусалима на півдорозі до Вифлеєма. Там виявився палац останніх царів Юди з кам'яними капітелями, різьбленими балюстрадами вікон і сотнями штампованих ручок глеків, а також адміністративний центр перського періоду зі власними штампами; відновлені розкопки 2005–2010 рр. виявили терасований царський сад з басейнами й каналами. Відповідність столиці округу та пагорбу вогняних сигналів добра, але жоден напис не називає місця. Єронім, який з Вифлеєма бачив село Бетахарма, підштовхнув деяких до пагорба Іродіон; давніший погляд, лише з назви, дивився на Ейн-Керем на захід від міста. Рамат-Рахель нині — кібуц з розкопками, облаштованими як археологічний парк."
  es:
    - "Bet-haquerem, «casa de la viña», era una ciudad de Judá cerca de Jerusalén, en una altura desde la que podía verse una señal. Jeremías, al advertir del enemigo del norte, clama: «HUID, hijos de Benjamín, de en medio de Jerusalem, y tocad bocina en Tecoa, y alzad por señal humo sobre Beth-hacchêrem». Bajo los persas fue sede de un distrito: entre los que reconstruyeron la muralla con Nehemías estaba «Malchîas hijo de Rechâb, príncipe de la provincia de Beth-haccerem», que reparó la Puerta del Muladar. El Apócrifo del Génesis, de Qumrán, sitúa el Valle del Rey, donde Abraham se encontró con Melquisedec, en «el valle de Bet-haquerem», y la Misná conoce las piedras del altar como tomadas de su valle y el agua teñida por la tierra de su valle como patrón de uno de los tonos de la sangre."
    - "Desde las excavaciones de Yohanan Aharoni en 1954 y 1959–1962, la mayoría la sitúa en Ramat Rahel, colina al sur de Jerusalén a medio camino de Belén. Allí salió a la luz un palacio de los últimos reyes de Judá, con capiteles de piedra, balaustradas de ventana talladas y centenares de asas de jarra selladas, y un centro administrativo persa con sus sellos; nuevas excavaciones en 2005–2010 descubrieron un jardín real en terrazas con estanques y canales. El encaje con una capital de distrito y una colina de señales de fuego es bueno, pero ninguna inscripción nombra el lugar. Jerónimo, que veía desde Belén una aldea Bethacharma, llevó a algunos a la colina del Herodión; una opinión más antigua, basada solo en el nombre, miraba a Ein Karem, al oeste de la ciudad. Hoy Ramat Rahel es un kibutz con las excavaciones como parque arqueológico."
  pt:
    - "Bete-Haquerém, “casa da vinha”, era uma cidade de Judá perto de Jerusalém, numa altura de onde se podia ver um sinal. Jeremias, advertindo do inimigo do norte, clama: “Fujam para um lugar seguro, filhos de Benjamim, do meio de Jerusalém! Toquem a trombeta em Tecoa e levantem um sinal em Bete-Haquerém”. Sob os persas foi sede de um distrito: entre os que reconstruíram a muralha com Neemias estava “Malquias, filho de Recabe, governante do distrito de Bete-Haquerém”, que reparou a Porta do Esterco. O Gênesis Apócrifo de Qumran situa o vale do Rei, onde Abraão encontrou Melquisedeque, no “vale de Bete-Haquerém”, e a Mishná conhece as pedras do altar como tiradas de seu vale e a água tingida pela terra de seu vale como padrão de um dos tons do sangue."
    - "Desde as escavações de Yohanan Aharoni em 1954 e 1959–1962, a maioria dos estudiosos a põe em Ramat Rachel, uma colina na borda sul de Jerusalém, a meio caminho de Belém. Ali veio à luz um palácio dos últimos reis de Judá, com capitéis de pedra, balaustradas de janela esculpidas e centenas de alças de jarros carimbadas, e um centro administrativo do período persa com carimbos próprios; escavações renovadas em 2005–2010 descobriram um jardim real em terraços, com tanques e canais. O ajuste com uma capital de distrito e uma colina de sinais de fogo é bom, mas nenhuma inscrição nomeia o lugar. Jerônimo, que via de Belém uma aldeia Bethacharma, levou alguns à colina do Herodium; uma opinião mais antiga, só pelo nome, olhava para Ein Karem, a oeste da cidade. Ramat Rachel é hoje um quibutz, com as escavações dispostas como parque arqueológico."
  de:
    - "Bet-Kerem, „Haus des Weinbergs“, war eine Stadt Judas nahe Jerusalem, auf einer Höhe, von der aus ein Signal zu sehen war. Jeremia ruft, den Feind aus dem Norden ankündigend: „Fliehet, ihr Kinder Benjamin, aus Jerusalem und blaset die Drommete auf der Warte Thekoa und werft auf ein Panier über der Warte Beth-Cherem!“ Unter den Persern war sie Sitz eines Bezirks: Unter denen, die mit Nehemia die Mauer wieder aufbauten, war „Malchia, der Sohn Rechabs, der Oberste des Kreises von Beth-Cherem“, der das Misttor ausbesserte. Das Genesis-Apokryphon aus Qumran setzt das Königstal, wo Abraham Melchisedek begegnete, in „das Tal von Bet-Kerem“, und die Mischna kennt die Steine des Altars als aus seinem Tal genommen und das von der Erde seines Tals gefärbte Wasser als Maßstab für einen der Farbtöne des Blutes."
    - "Seit Yohanan Aharonis Grabungen 1954 und 1959–1962 setzen die meisten Gelehrten es nach Ramat Rachel, einen Hügel am Südrand Jerusalems auf halbem Weg nach Bethlehem. Dort kam ein Palast der letzten Könige von Juda zutage, mit Steinkapitellen, geschnitzten Fensterbalustraden und Hunderten gestempelter Krughenkel, sowie ein Verwaltungszentrum der Perserzeit mit eigenen Stempeln; erneute Grabungen 2005–2010 legten einen terrassierten königlichen Garten mit Becken und Kanälen frei. Die Passung zu einer Bezirkshauptstadt und einem Feuersignalhügel ist gut, doch keine Inschrift nennt den Ort. Hieronymus, der von Bethlehem aus ein Dorf Bethacharma sehen konnte, führte manche auf den Hügel des Herodeion; eine ältere Ansicht blickte allein nach dem Namen auf Ein Kerem westlich der Stadt. Ramat Rachel ist heute ein Kibbuz mit den Grabungen als archäologischem Park."
  fr:
    - "Beth-Hakkerem, « maison de la vigne », était une ville de Juda près de Jérusalem, sur une hauteur d’où l’on pouvait voir un signal. Jérémie, avertissant de l’ennemi venu du nord, crie : « Fuyez, enfants de Benjamin, du milieu de Jérusalem, sonnez de la trompette à Tekoa, élevez un signal à Beth-Hakkérem ! » Sous les Perses, elle était le siège d’un district : parmi ceux qui rebâtirent le mur avec Néhémie était « Malkija, fils de Récab, chef du district de Beth-Hakkérem », qui répara la porte du fumier. L’Apocryphe de la Genèse de Qumrân place la Vallée du Roi, où Abraham rencontra Melchisédek, dans « la vallée de Beth-Hakkérem », et la Mishna connaît les pierres de l’autel comme tirées de sa vallée et l’eau colorée par la terre de sa vallée comme étalon de l’une des teintes du sang."
    - "Depuis les fouilles de Yohanan Aharoni en 1954 et 1959-1962, la plupart des savants la placent à Ramat Rahel, colline au bord sud de Jérusalem à mi-chemin de Bethléem. On y a mis au jour un palais des derniers rois de Juda, avec chapiteaux, balustrades de fenêtres sculptées et des centaines d’anses de jarres estampillées, et un centre administratif perse avec ses propres estampilles ; des fouilles en 2005-2010 ont dégagé un jardin royal en terrasses avec bassins et canaux. L’accord avec une capitale de district et une colline à signaux de feu est bon, mais aucune inscription ne nomme le lieu. Jérôme, qui voyait de Bethléem un village Bethacharma, en conduisit certains à la colline d’Hérodion ; une opinion plus ancienne, d’après le seul nom, regardait vers Ein Karem à l’ouest. Ramat Rahel est aujourd’hui un kibboutz dont les fouilles forment un parc archéologique."
  it:
    - "Bet-Cherem, «casa della vigna», era una città di Giuda vicino a Gerusalemme, su un’altura da cui si poteva vedere un segnale. Geremia, avvertendo del nemico dal nord, grida: «O figliuoli di Beniamino, cercate un rifugio lungi dal mezzo di Gerusalemme, e sonate la tromba in Tekoa, e innalzate un segnale su Bethkerem!» Sotto i Persiani fu sede di un distretto: fra quanti ricostruirono le mura con Neemia vi fu «Malkia, figliuolo di Recab, capo del distretto di Beth-Hakkerem», che restaurò la Porta del Letame. L’Apocrifo della Genesi di Qumran pone la Valle del Re, dove Abramo incontrò Melchisedek, nella «valle di Bet-Cherem», e la Mishnah conosce le pietre dell’altare come prese dalla sua valle e l’acqua colorata dalla terra della sua valle come misura di una delle tonalità del sangue."
    - "Dopo gli scavi di Yohanan Aharoni del 1954 e 1959–1962 la maggior parte degli studiosi la pone a Ramat Rahel, un’altura sul margine meridionale di Gerusalemme a metà strada verso Betlemme. Lì è venuto alla luce un palazzo degli ultimi re di Giuda, con capitelli di pietra, balaustre di finestre scolpite e centinaia di anse di giara bollate, e un centro amministrativo di epoca persiana con propri bolli; nuovi scavi nel 2005–2010 hanno scoperto un giardino reale a terrazze con vasche e canali. L’accordo con una capitale di distretto e un’altura per segnali di fuoco è buono, ma nessuna iscrizione nomina il luogo. Girolamo, che poteva vedere un villaggio Bethacharma da Betlemme, portò alcuni all’altura dell’Erodion; un’opinione più antica, dal solo nome, guardava a Ein Karem a ovest della città. Ramat Rahel è oggi un kibbutz con gli scavi allestiti come parco archeologico."
  pl:
    - "Bet-Kerem, „dom winnicy”, było miastem Judy koło Jerozolimy, na wzniesieniu, z którego można było dostrzec sygnał. Jeremiasz, ostrzegając przed wrogiem z północy, woła: „Zgromadźcie się, synowie Benjaminowi! z pośrodku Jeruzalemu, a w Tekue trąbcie w trąbę, i nad Betcherem podnieście chorągiew!” Pod Persami było siedzibą okręgu: wśród tych, którzy odbudowywali mur z Nehemiaszem, był „Melchyjasz, syn Rechaby, przełożony nad powiatem Betcherem”, który naprawiał Bramę Gnojną. Apokryf Rodzaju z Qumran umieszcza Dolinę Królewską, gdzie Abraham spotkał Melchizedeka, w „dolinie Bet-Kerem”, a Miszna zna kamienie ołtarza jako wzięte z jej doliny i wodę zabarwioną ziemią jej doliny jako wzorzec jednego z odcieni krwi."
    - "Od wykopalisk Yohanana Aharoniego w 1954 i 1959–1962 większość uczonych umieszcza je w Ramat Rachel, na wzgórzu na południowym skraju Jerozolimy w połowie drogi do Betlejem. Odkryto tam pałac ostatnich królów Judy z kamiennymi kapitelami, rzeźbionymi balustradami okiennymi i setkami pieczętowanych uch dzbanów oraz centrum administracyjne z okresu perskiego z własnymi pieczęciami; ponowne prace w latach 2005–2010 odsłoniły tarasowy ogród królewski ze stawami i kanałami. Dopasowanie do stolicy okręgu i wzgórza sygnałów ogniowych jest dobre, lecz żaden napis nie nazywa miejsca. Hieronim, który z Betlejem widział wieś Bethacharma, skłonił niektórych ku wzgórzu Herodion; starszy pogląd, oparty na samej nazwie, patrzył ku Ein Karem na zachód od miasta. Ramat Rachel jest dziś kibucem z wykopaliskami urządzonymi jako park archeologiczny."
  nl:
    - "Beth-Kerem, “huis van de wijngaard”, was een stad van Juda nabij Jeruzalem, op een hoogte vanwaar een signaal te zien was. Jeremia, waarschuwend voor de vijand uit het noorden, roept: “Vlucht met hopen, gij kinderen van Benjamin! uit het midden van Jeruzalem, en blaast de bazuin te Thekoa, en heft een vuurteken op te Beth-Cherem”. Onder de Perzen was het de zetel van een district: onder hen die met Nehemia de muur herbouwden was “Malchia, de zoon van Rechab, overste van het deel Beth-Cherem”, die de Mestpoort herstelde. De Genesis-Apocrief uit Qumran plaatst het Koningsdal, waar Abraham Melchizedek ontmoette, in “het dal van Beth-Kerem”, en de Misjna kent de stenen van het altaar als uit zijn dal gehaald en het water gekleurd door de aarde van zijn dal als maatstaf voor een van de tinten van bloed."
    - "Sinds Yohanan Aharoni’s opgravingen van 1954 en 1959–1962 plaatsen de meeste geleerden het op Ramat Rahel, een heuvel aan de zuidrand van Jeruzalem halverwege Bethlehem. Daar kwam een paleis van de laatste koningen van Juda aan het licht, met stenen kapitelen, gebeeldhouwde vensterbalustrades en honderden gestempelde kruikhenkels, en een Perzisch bestuurscentrum met eigen stempels; hernieuwd graven in 2005–2010 bracht een terrasvormige koninklijke tuin met vijvers en kanalen aan het licht. De aansluiting bij een districtshoofdstad en een vuursignaalheuvel is goed, maar geen opschrift noemt de plaats. Hieronymus, die vanuit Bethlehem een dorp Bethacharma kon zien, bracht sommigen op de heuvel van Herodion; een oudere opvatting, op grond van de naam alleen, keek naar Ein Karem ten westen van de stad. Ramat Rahel is nu een kibboets met een archeologisch park."
  cs:
    - "Bét-hakerem, „dům vinice“, bylo judské město poblíž Jeruzaléma, na výšině, z níž bylo vidět signál. Jeremjáš, varující před nepřítelem ze severu, volá: „Shromažďte se, synové Beniaminovi, z prostředku Jeruzaléma, a v Tekoa trubte trubou, a nad Betkarem vyzdvihněte korouhev“. Za Peršanů bylo sídlem okresu: mezi těmi, kdo s Nehemjášem stavěli hradbu, byl „Malkiáš syn Rechabův, hejtman kraje Betkarem“, který opravil Hnojnou bránu. Genesis Apocryphon z Kumránu klade Královské údolí, kde se Abraham setkal s Melchisedekem, do „údolí Bét-hakerem“ a Mišna zná kameny oltáře jako brané z jeho údolí a vodu zbarvenou zeminou jeho údolí jako měřítko jednoho z odstínů krve."
    - "Od vykopávek Yohanana Aharoniho z let 1954 a 1959–1962 jej většina badatelů klade do Ramat Rachel, na pahorek na jižním okraji Jeruzaléma na půl cesty k Betlému. Tam vyšel najevo palác posledních judských králů s kamennými hlavicemi, vytesanými okenními balustrádami a stovkami raznicovaných uch džbánů a správní středisko perské doby s vlastními razítky; obnovené kopání v letech 2005–2010 odkrylo terasovitou královskou zahradu s nádržemi a kanály. Shoda s okresním hlavním městem a pahorkem ohňových signálů je dobrá, ale žádný nápis místo nejmenuje. Jeroným, který z Betlému viděl vesnici Bethacharma, přivedl některé k pahorku Herodeion; starší názor, jen podle jména, hledal v Ejn Karem západně od města. Ramat Rachel je dnes kibuc s vykopávkami upravenými jako archeologický park."
