body:
  en:
    - "The well, or spring, of Harod is commonly placed at Ain Jalud, today Ma'ayan Harod, a copious spring that rises in a cave at the north-western foot of Mount Gilboa, on the edge of the valley of Jezreel, about 3 km east of Zerin, the ancient Jezreel; its water flows down the valley past Beth-shean to the Jordan. The International Standard Bible Encyclopedia holds this common view; G. F. Moore, in his commentary on Judges, sought the hill of Moreh and the spring near Shechem instead."
    - "Before his night attack on Midian, Gideon “pitched beside the well of Harod: so that the host of the Midianites were on the north side of them, by the hill of Moreh, in the valley.” At its water the Lord thinned his army, setting apart “every one that lappeth of the water with his tongue, as a dog lappeth”, and with those three hundred Gideon won. Many also take it to be the “fountain which is in Jezreel” by which Saul camped before the battle of Gilboa."
    - "On 3 September 1260 the spring, called by the Arabs Ain Jalut, the spring of Goliath, gave its name to the battle in which the Mamluks of Egypt under Qutuz and Baybars defeated the Mongols, whose commander Kitbuqa was killed; it was the first great check to the Mongol advance in the west. In 1921 Jewish settlers founded nearby the kibbutz Ein Harod, named after the spring. The spring is in northern Israel."
  ru:
    - "Источник Харода обычно помещают у Айн-Джалуда, ныне Маайан-Харод, — обильного источника, который бьёт из пещеры у северо-западного подножия горы Гелвуй, на краю долины Изреельской, примерно в 3 км к востоку от Зерина, древнего Изрееля; его вода стекает по долине мимо Беф-Сана к Иордану. Международная стандартная библейская энциклопедия придерживается этого обычного взгляда; Дж. Ф. Мур в комментарии на Книгу Судей искал холм Море и источник близ Сихема."
    - "Перед ночным нападением на мадианитян Гедеон с народом «расположились станом у источника Харода; Мадиамский же стан был от него к северу у холма Море в долине». У этой воды Господь сократил его войско, велев отделить того, «кто будет лакать воду языком своим, как лакает пес», и с этими тремястами Гедеон победил. Многие считают его также «источником, что в Изрееле», у которого стоял станом Саул перед битвой на Гелвуе."
    - "3 сентября 1260 г. источник, который арабы называли Айн-Джалут, «источник Голиафа», дал имя битве, в которой мамлюки Египта во главе с Кутузом и Бейбарсом разбили монголов, чей военачальник Китбука был убит; это была первая крупная остановка монгольского натиска на западе. В 1921 г. еврейские поселенцы основали неподалёку кибуц Эйн-Харод, названный по источнику. Источник находится на севере Израиля."
  uk:
    - "Колодязь, або джерело Харод, зазвичай розміщують в Айн-Джалуді, нині Маайан-Харод, рясному джерелі, що б'є в печері біля північно-західного підніжжя гори Гілбоа, на краю долини Їзреель, приблизно за 3 км на схід від Зеріна, давнього Їзреелю; його вода тече вздовж долини повз Бет-Шеан до Йордану. International Standard Bible Encyclopedia дотримується цієї поширеної думки; Дж. Ф. Мур у своєму коментарі до Книги Суддів натомість шукав пагорб Море й джерело поблизу Сихема."
    - "Книга Суддів розповідає про Гедеона перед його нічним нападом на Мадіам і про його людей: «отаборились вони коло криницї Гарод. Табір же Мадиянський стояв на північ від його, коло горба Море на поділлї». Біля її води Господь розріджив його військо й велів Гедеонові: «Хто хлептати ме воду язиком, як хлепчуть собаки, того станови окроме»; з тими трьомастами Гедеон переміг. Багато хто вважає її й тією криницею в Їзреелі, біля якої перед битвою на Гілбоа отаборився Саул; Перша книга Самуїла (29:1) каже: «Ізраїль отаборивсь коло криницї під Езреелем»."
    - "3 вересня 1260 р. джерело, яке араби звуть Айн-Джалут, джерело Голіата, дало назву битві, в якій мамлюки Єгипту під проводом Кутуза й Бейбарса розбили монголів, чий полководець Кітбука загинув; це була перша велика перепона для просування монголів на заході. 1921 р. єврейські поселенці заснували поблизу кібуц Ейн-Харод, названий за джерелом. Джерело лежить на півночі Ізраїлю."
  es:
    - "El pozo, o fuente, de Harod suele situarse en Ain Jalud, hoy Ma'ayan Harod, un manantial copioso que brota en una cueva al pie noroccidental del monte Gilboa, en el borde del valle de Jezreel, a unos 3 km al este de Zerin, la antigua Jezreel; su agua baja por el valle, pasa por Bet-seán y llega al Jordán. La International Standard Bible Encyclopedia sostiene esta opinión común; G. F. Moore, en su comentario a Jueces, buscó en cambio el collado de Moré y la fuente cerca de Siquem."
    - "Antes de su ataque nocturno contra Madián, Gedeón acampó «junto á la fuente de Harod: y tenía el campo de los Madianitas al norte, de la otra parte del collado de More, en el valle». En sus aguas el Señor redujo su ejército, apartando a «cualquiera que lamiere las aguas con su lengua como lame el perro», y con aquellos trescientos Gedeón venció. Muchos la toman también por «la fuente que está en Jezreel» junto a la cual acampó Saúl antes de la batalla de Gilboa."
    - "El 3 de septiembre de 1260 la fuente, llamada por los árabes Ain Jalut, la fuente de Goliat, dio nombre a la batalla en que los mamelucos de Egipto, bajo Qutuz y Baybars, derrotaron a los mongoles, cuyo comandante Kitbuqa murió; fue el primer gran freno al avance mongol en el oeste. En 1921 colonos judíos fundaron cerca el kibutz Ein Harod, nombrado por la fuente. La fuente se encuentra en el norte de Israel."
  de:
    - "Der Brunnen oder die Quelle von Harod wird gewöhnlich bei Ain Dschalud angesetzt, heute Ma'ajan Harod, einer ergiebigen Quelle, die in einer Höhle am nordwestlichen Fuß des Gilboa-Gebirges am Rand der Jesreelebene entspringt, etwa 3 km östlich von Serin, dem antiken Jesreel; ihr Wasser fließt durch die Ebene an Bet-Schean vorbei zum Jordan. Die International Standard Bible Encyclopedia vertritt diese gängige Ansicht; G. F. Moore suchte in seinem Kommentar zum Richterbuch stattdessen den Hügel More und die Quelle bei Sichem."
    - "Vor seinem nächtlichen Angriff auf Midian lagerten sich Gideon und sein Volk „an den Brunnen Harod“, das Heer der Midianiter lag nördlich von ihnen beim Hügel More in der Ebene. An seinem Wasser sichtete der HERR sein Heer und sonderte ab: „Wer mit seiner Zunge Wasser leckt, wie ein Hund leckt, den stelle besonders“, und mit jenen dreihundert gewann Gideon. Viele halten es auch für die Quelle in Jesreel (so die King-James-Bibel in 1. Samuel 29,1), an der Saul vor der Schlacht von Gilboa lagerte."
    - "Am 3. September 1260 gab die Quelle, von den Arabern Ain Dschalut genannt, die Goliathsquelle, der Schlacht den Namen, in der die Mamluken Ägyptens unter Qutuz und Baibars die Mongolen besiegten, deren Befehlshaber Kitbuqa fiel; es war der erste große Halt für den mongolischen Vormarsch im Westen. 1921 gründeten jüdische Siedler in der Nähe den Kibbuz Ein Harod, nach der Quelle benannt. Die Quelle liegt im Norden Israels."
  fr:
    - "On place communément la source de Harod à Aïn Jalud, aujourd’hui Ma’ayan Harod, source abondante qui jaillit dans une grotte au pied nord-ouest du mont Gilboa, au bord de la vallée de Jizreel, à environ 3 km à l’est de Zerin, l’ancienne Jizreel ; son eau descend la vallée devant Beth-Schean jusqu’au Jourdain. L’International Standard Bible Encyclopedia soutient cette opinion commune ; G. F. Moore, dans son commentaire des Juges, cherchait plutôt la colline de Moré et la source près de Sichem."
    - "Avant son attaque de nuit contre Madian, Gédéon et le peuple « campèrent près de la source de Harod. Le camp de Madian était au nord de Gédéon, vers la colline de Moré, dans la vallée. » À son eau, l’Éternel réduisit son armée, mettant à part « tous ceux qui laperont l’eau avec la langue comme lape le chien », et c’est avec ces trois cents hommes que Gédéon vainquit. Bien des savants y voient aussi « la source de Jizreel » près de laquelle campa Israël avec Saül avant la bataille de Gilboa."
    - "Le 3 septembre 1260, la source, que les Arabes appellent Aïn Jalut, la source de Goliath, donna son nom à la bataille où les Mamelouks d’Égypte, sous Qutuz et Baybars, vainquirent les Mongols, dont le chef Kitbuqa fut tué ; ce fut le premier grand coup d’arrêt à l’avance mongole vers l’ouest. En 1921, des colons juifs fondèrent à proximité le kibboutz Ein Harod, nommé d’après la source. La source se trouve dans le nord d’Israël."
  pt:
    - "A fonte, ou nascente, de Harode é comumente situada em Ain Jalud, hoje Ma'ayan Harod, uma nascente copiosa que brota numa caverna ao pé noroeste do monte Gilboa, na borda do vale de Jezreel, cerca de 3 km a leste de Zerin, a antiga Jezreel; suas águas descem pelo vale, passando por Bete-Seã, até o Jordão. A International Standard Bible Encyclopedia sustenta essa opinião comum; G. F. Moore, em seu comentário a Juízes, procurou em vez disso a colina de Moré e a fonte perto de Siquém."
    - "Antes de seu ataque noturno a Midiã, Gideão e o povo “acamparam junto à fonte de Harode. O acampamento de Midiã estava ao norte deles, perto da colina de Moré, no vale.” Junto à sua água o SENHOR reduziu o exército de Gideão, mandando separar “todo aquele que lamber a água com a língua, como o cachorro lambe”, e com esses trezentos Gideão venceu. Muitos a tomam também pela “fonte que fica em Jezreel” junto à qual Saul acampou antes da batalha de Gilboa."
    - "Em 3 de setembro de 1260 a nascente, chamada pelos árabes Ain Jalut, a fonte de Golias, deu nome à batalha em que os mamelucos do Egito, sob Qutuz e Baibars, derrotaram os mongóis, cujo comandante Quitbuqa foi morto; foi o primeiro grande freio ao avanço mongol no Ocidente. Em 1921 colonos judeus fundaram ali perto o kibutz Ein Harod, assim chamado por causa da nascente. A nascente fica no norte de Israel."
  it:
    - "La sorgente di Carod si colloca comunemente ad Ain Jalud, oggi Ma‘ayan Harod, una copiosa sorgente che sgorga in una grotta ai piedi nord-occidentali del monte Gilboa, al margine della valle di Izreel, a circa 3 km a est di Zerin, l’antica Izreel; la sua acqua scende lungo la valle oltre Beth-Shean fino al Giordano. La International Standard Bible Encyclopedia sostiene questa opinione comune; G. F. Moore, nel suo commento ai Giudici, cercò invece il Colle di Morè e la sorgente presso Sichem."
    - "Prima del suo attacco notturno contro Madian, Gedeone «si accampò presso la sorgente di Harod. Il campo di Madian era al nord di quello di Gedeone, verso la collina di Moreh, nella valle». Alla sua acqua il Signore assottigliò il suo esercito, mettendo da parte «tutti quelli che lambiranno l’acqua con la lingua, come la lambisce il cane», e con quei trecento Gedeone vinse. Molti la ritengono anche la «sorgente di Izreel» presso la quale Saul si accampò prima della battaglia del Gilboa."
    - "Il 3 settembre 1260 la sorgente, chiamata dagli Arabi Ain Jalut, la sorgente di Golia, diede il nome alla battaglia in cui i Mamelucchi d’Egitto sotto Qutuz e Baybars sconfissero i Mongoli, il cui comandante Kitbuqa fu ucciso; fu il primo grande arresto dell’avanzata mongola in occidente. Nel 1921 coloni ebrei fondarono nelle vicinanze il kibbutz Ein Harod, che prende il nome dalla sorgente. La sorgente si trova nel nord di Israele."
  nl:
    - "De bron, of fontein, van Charod wordt gewoonlijk geplaatst bij Ain Jalud, tegenwoordig Ma'ayan Harod, een overvloedige bron die ontspringt in een grot aan de noordwestelijke voet van de Gilboa, aan de rand van de vallei van Jizreël, ongeveer 3 km ten oosten van Zerin, het antieke Jizreël; haar water stroomt door de vallei langs Beth-Sean naar de Jordaan. De International Standard Bible Encyclopedia houdt deze gangbare opvatting aan; G. F. Moore zocht in zijn commentaar op Richteren daarentegen de heuvel More en de bron bij Sichem."
    - "Voor zijn nachtelijke aanval op Midian legerde Gideon zich met zijn volk “aan de fontein van Harod; dat hij het heirleger der Midianieten had tegen het noorden, achter den heuvel More, in het dal.” Bij haar water dunde de HEER zijn leger uit en zonderde af “al wie met zijn tong uit het water zal lekken, gelijk als een hond zou lekken”, en met die driehonderd won Gideon. Velen houden haar ook voor “de fontein, die bij Jizreël is” waarbij Saul zich legerde vóór de slag bij Gilboa."
    - "Op 3 september 1260 gaf de bron, door de Arabieren Ain Jalut genoemd, de bron van Goliat, haar naam aan de slag waarin de Mamelukken van Egypte onder Qutuz en Baybars de Mongolen versloegen, wier bevelhebber Kitbuqa werd gedood; het was de eerste grote tegenslag voor de Mongoolse opmars in het westen. In 1921 stichtten Joodse kolonisten er vlakbij de kibboets Ein Harod, genoemd naar de bron. De bron ligt in het noorden van Israël."
  pl:
    - "Studnię, czyli źródło, Charod umieszcza się zwykle w Ajn Dżalud, dziś Ma'ayan Harod, obfitym źródle wypływającym z jaskini u północno-zachodniego podnóża góry Gilboa, na skraju doliny Jizreel, około 3 km na wschód od Zerin, starożytnego Jizreel; jego woda spływa doliną obok Bet-Szean do Jordanu. International Standard Bible Encyclopedia podtrzymuje ten powszechny pogląd; G. F. Moore w komentarzu do Księgi Sędziów szukał natomiast wzgórza More i źródła koło Sychem."
    - "Przed nocnym atakiem na Madian Gedeon z ludem, jak czytamy, „położyli się obozem u źródła Harod, a obóz Madyjański był im na północy od pagórka More w dolinie”. Przy jego wodzie Pan przerzedził jego wojsko, każąc oddzielić każdego, „który łeptać będzie językiem swoim wodę, jako pies łepce”, i z tymi trzystu Gedeon zwyciężył. Wielu uważa je także za „źródło, które było w Jezreelu”, nad którym obozował Saul przed bitwą na Gilboa."
    - "3 września 1260 roku źródło, zwane przez Arabów Ajn Dżalut, źródłem Goliata, dało nazwę bitwie, w której mamelucy Egiptu pod wodzą Kutuza i Bajbarsa pokonali Mongołów, a ich dowódca Kitbuka poległ; było to pierwsze wielkie zatrzymanie natarcia mongolskiego na zachodzie. W 1921 roku żydowscy osadnicy założyli w pobliżu kibuc Ein Harod, nazwany od źródła. Źródło leży w północnym Izraelu."
  cs:
    - "Studnice, neboli pramen, Charod se obvykle klade k Ajn Džalúd, dnes Ma'ajan Charod, vydatnému prameni, který vyvěrá v jeskyni na severozápadním úpatí hory Gilboa, na okraji Jizreelského údolí, asi 3 km východně od Zer'inu, starověkého Jizreelu; jeho voda stéká údolím kolem Bét-šeanu k Jordánu. International Standard Bible Encyclopedia zastává tento obvyklý názor; G. F. Moore ve svém komentáři k Soudcům naopak hledal pahorek Móre a pramen poblíž Šekemu."
    - "Před nočním útokem na Midján se Gedeon a lid, který byl s ním, „položili se při studnici Charod, vojska pak Madianských byla jim na půlnoci před vrchem More v údolí“. U její vody Hospodin prořídil jeho vojsko a oddělil „každého, kdož chlemtati bude jazykem svým z vody, jako chlemce pes“, a s těmi třemi sty Gedeon zvítězil. Mnozí v ní vidí také „studnici, kteráž byla v Jezreel“, u níž se Saul utábořil před bitvou na Gilboa."
    - "Dne 3. září 1260 dal pramen, který Arabové nazývají Ajn Džalút, pramen Goliášův, jméno bitvě, v níž egyptští mamlúci pod Kutuzem a Bajbarsem porazili Mongoly, jejichž velitel Kitbuka padl; byla to první velká překážka mongolského postupu na západě. V roce 1921 založili poblíž židovští osadníci kibuc Ejn Charod, pojmenovaný podle pramene. Pramen leží v severním Izraeli."
