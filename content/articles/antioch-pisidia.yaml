body:
  en:
    - "Antioch of Pisidia stood on a hill on the border of Phrygia and Pisidia, about a kilometre north-east of modern Yalvaç in Turkey. It was founded by one of the Seleucid kings, probably in the third century BC, and Strabo says it was settled by colonists from Magnesia on the Maeander. Near it stood a sanctuary of the moon god Men, whose priesthood held temple slaves and sacred places. When Rome, after defeating Antiochus III, handed Asia Minor this side of the Taurus to Eumenes of Pergamum, it declared Antioch free."
    - "Mark Antony gave Galatia and Lycaonia to the Galatian king Amyntas, who also held Antioch. When Amyntas was killed in 25 BC, Augustus made his kingdom the Roman province of Galatia, and Antioch became a Roman colony, Colonia Caesarea, settled with veterans; the priesthood of Men was dissolved. In 1914 William Ramsay found here fragments of a Latin copy of Augustus' own record of his deeds, the Res Gestae."
    - 'Paul and Barnabas came here from Perga on their first journey. On the sabbath Paul spoke in the synagogue, the first of his sermons that Acts gives at length, and on the next sabbath almost the whole city came to hear. When the Jews opposed them, they said: "lo, we turn to the Gentiles." The Jews stirred up the devout and honourable women and the chief men of the city, raised persecution against the apostles and expelled them, and they went on to Iconium; Jews from Antioch later followed Paul to Lystra. The Second Letter to Timothy remembers the persecutions he endured at Antioch. On the way back the apostles strengthened the disciples and ordained elders in every church. Many scholars think Paul''s Letter to the Galatians was written to these churches in the south of the province; others hold that it went to the Galatians of the north.'
    - "Antioch remained the chief Roman city of the region, and in the later empire it became the capital of the province of Pisidia. Its bishop Optimus attended the Council of Constantinople in 381, and his name appears in a mosaic inscription in the city's great basilica."
  ru:
    - "Антиохия Писидийская стояла на холме на границе Фригии и Писидии, примерно в километре к северо-востоку от нынешнего Ялвача в Турции. Её основал один из царей Селевкидов, вероятно, в III веке до н. э., и Страбон пишет, что её заселили выходцы из Магнесии на Меандре. Рядом находилось святилище лунного бога Мена, жречеству которого принадлежали храмовые рабы и священные места. Когда Рим, разбив Антиоха III, передал Пергамскому царю Евмену Малую Азию по эту сторону Тавра, он объявил Антиохию свободной."
    - "Марк Антоний отдал Галатию и Ликаонию галатскому царю Аминте, которому принадлежала и Антиохия. Когда в 25 г. до н. э. Аминта был убит, Август обратил его царство в римскую провинцию Галатию, а Антиохия стала римской колонией — Колонией Цезарея, заселённой ветеранами; жречество Мена было упразднено. В 1914 г. Уильям Рамзай нашёл здесь фрагменты латинской копии собственного отчёта Августа о его деяниях."
    - "Павел и Варнава пришли сюда из Пергии в первом путешествии. В субботу Павел говорил в синагоге — это первая из его проповедей, которую книга Деяний приводит подробно, — а в следующую субботу почти весь город собрался слушать. Когда Иудеи воспротивились, апостолы сказали: «вот, мы обращаемся к язычникам». Иудеи подстрекнули набожных и почетных женщин и первых в городе людей, воздвигли гонение на апостолов и изгнали их, а они пошли дальше в Иконию; позже иудеи из Антиохии пришли за Павлом в Листру. Второе послание к Тимофею вспоминает гонения, которые он перенёс в Антиохии. На обратном пути апостолы утверждали учеников и рукоположили пресвитеров в каждой церкви. Многие учёные считают, что Послание к Галатам написано этим церквам на юге провинции; другие полагают, что оно адресовано галатам севера."
    - "Антиохия оставалась главным римским городом края, а в поздней империи стала столицей провинции Писидии. Её епископ Оптим участвовал в Константинопольском соборе 381 г., и его имя стоит в мозаичной надписи в большой базилике города."
  uk:
    - "Антіохія Пісідійська стояла на пагорбі на межі Фрігії та Пісідії, приблизно за кілометр на північний схід від сучасного Ялвача в Туреччині. Її заснував один із Селевкідських царів, імовірно, у III столітті до н. е., і Страбон каже, що її заселили колоністи з Магнесії на Меандрі. Поблизу стояла святиня бога місяця Мена, чиє жрецтво мало храмових рабів і священні місця. Коли Рим, після розгрому Антіоха III, віддав Малу Азію по цей бік Тавру Евмену Пергамському, він оголосив Антіохію вільною."
    - "Марк Антоній віддав Галатію та Лікаонію галатійському цареві Аміні, який тримав і Антіохію. Коли Аміну вбили в 25 р. до н. е., Август зробив його царство римською провінцією Галатія, а Антіохія стала римською колонією, Colonia Caesarea, заселеною ветеранами; жрецтво Мена було розпущене. У 1914 році Вільям Рамзі знайшов тут уламки латинського примірника власного звіту Августа про його діяння, Res Gestae."
    - "Павло і Варнава прийшли сюди з Перге в першій подорожі. У суботу Павло говорив у синагозі — це перша його проповідь, яку Дії наводять докладно, а в наступну суботу мало не ціле місто прийшло слухати. Коли юдеї противилися, вони сказали: «то ось обертаємось до поган». Юдеї наустили побожних та поважних жінок і перших у місті, підняли гоніння на апостолів і вигнали їх, і ті пішли в Іконію; юдеї з Антіохії згодом пішли за Павлом до Лістри. Друге послання до Тимофія пам'ятає гоніння, які він зазнав в Антіохії. На зворотному шляху апостоли зміцнили учнів і поставили пресвітерів у кожній церкві. Багато вчених вважають, що Послання до галатів було написане цим церквам півдня провінції; інші — що воно адресоване галатам півночі."
    - "Антіохія лишалася головним римським містом краю, а за пізньої імперії стала столицею провінції Пісідія. Її єпископ Оптім був на Константинопольському соборі 381 року, і його ім'я є в мозаїчному написі великої базиліки міста."
  es:
    - "Antioquía de Pisidia se alzaba sobre una colina en la frontera entre Frigia y Pisidia, a cerca de un kilómetro al nordeste de la actual Yalvaç, en Turquía. Fue fundada por uno de los reyes seléucidas, probablemente en el siglo III a. C., y Estrabón dice que fue poblada por colonos de Magnesia del Meandro. Cerca se alzaba un santuario del dios lunar Men, cuyo sacerdocio poseía esclavos del templo y lugares sagrados. Cuando Roma, tras derrotar a Antíoco III, entregó a Eumenes de Pérgamo el Asia Menor de este lado del Tauro, declaró libre a Antioquía."
    - "Marco Antonio dio Galacia y Licaonia al rey gálata Amintas, que también poseía Antioquía. Cuando Amintas murió en 25 a. C., Augusto hizo de su reino la provincia romana de Galacia, y Antioquía se convirtió en colonia romana, Colonia Caesarea, poblada con veteranos; el sacerdocio de Men fue disuelto. En 1914 William Ramsay halló aquí fragmentos de una copia latina del propio relato de Augusto sobre sus hazañas, las Res Gestae."
    - "Pablo y Bernabé llegaron aquí desde Perge en su primer viaje. El sábado Pablo habló en la sinagoga, el primero de sus discursos que los Hechos dan con extensión, y el sábado siguiente casi toda la ciudad acudió a oírlo. Cuando los judíos se les opusieron, dijeron: «he aquí, nos volvemos á los Gentiles». Los judíos instigaron a las mujeres piadosas y honestas y a los principales de la ciudad, levantaron persecución contra los apóstoles y los expulsaron, y ellos siguieron a Iconio; judíos de Antioquía siguieron más tarde a Pablo hasta Listra. La Segunda Carta a Timoteo recuerda las persecuciones que sufrió en Antioquía. A la vuelta, los apóstoles fortalecieron a los discípulos y constituyeron ancianos en cada iglesia. Muchos estudiosos piensan que la Carta a los Gálatas de Pablo fue escrita a estas iglesias del sur de la provincia; otros sostienen que fue dirigida a los gálatas del norte."
    - "Antioquía siguió siendo la principal ciudad romana de la región, y en el Imperio tardío se convirtió en la capital de la provincia de Pisidia. Su obispo Óptimo asistió al Concilio de Constantinopla en 381, y su nombre aparece en una inscripción de mosaico en la gran basílica de la ciudad."
  pt:
    - "Antioquia da Pisídia ficava numa colina na fronteira entre a Frígia e a Pisídia, cerca de um quilômetro a nordeste da atual Yalvaç, na Turquia. Foi fundada por um dos reis selêucidas, provavelmente no século III a.C., e Estrabão diz que foi povoada por colonos de Magnésia do Meandro. Perto dela havia um santuário do deus lunar Men, cujo sacerdócio possuía escravos do templo e lugares sagrados. Quando Roma, depois de vencer Antíoco III, entregou a Êumenes de Pérgamo a Ásia Menor deste lado do Tauro, declarou livre Antioquia."
    - "Marco Antônio deu a Galácia e a Licaônia ao rei gálata Amintas, que também possuía Antioquia. Quando Amintas foi morto em 25 a.C., Augusto fez de seu reino a província romana da Galácia, e Antioquia tornou-se colônia romana, Colonia Caesarea, povoada com veteranos; o sacerdócio de Men foi dissolvido. Em 1914 William Ramsay encontrou aqui fragmentos de uma cópia latina do próprio relato de Augusto sobre seus feitos, as Res Gestae."
    - "Paulo e Barnabé vieram para cá desde Perge na primeira viagem. No sábado Paulo falou na sinagoga, o primeiro de seus sermões que Atos dá por extenso, e no sábado seguinte quase toda a cidade veio ouvir. Quando os judeus se opuseram, disseram: “eis que nos voltamos para os gentios.” Os judeus instigaram as mulheres devotas e de alta posição e os principais homens da cidade, provocaram perseguição contra os apóstolos e os expulsaram, e eles foram para Icônio; judeus de Antioquia seguiram depois Paulo até Listra. A Segunda Carta a Timóteo lembra as perseguições que ele suportou em Antioquia. Na volta, os apóstolos fortaleceram os discípulos e designaram presbíteros em cada igreja. Muitos estudiosos pensam que a Carta aos Gálatas foi escrita a essas igrejas do sul da província; outros sustentam que foi aos gálatas do norte."
    - "Antioquia continuou sendo a principal cidade romana da região, e no Império tardio tornou-se a capital da província da Pisídia. Seu bispo Optimus participou do Concílio de Constantinopla em 381, e seu nome aparece numa inscrição em mosaico na grande basílica da cidade."
  de:
    - "Antiochia in Pisidien lag auf einem Hügel an der Grenze von Phrygien und Pisidien, etwa einen Kilometer nordöstlich des heutigen Yalvaç in der Türkei. Es wurde von einem der seleukidischen Könige gegründet, wohl im 3. Jahrhundert v. Chr., und nach Strabon von Siedlern aus Magnesia am Mäander besiedelt. In der Nähe stand ein Heiligtum des Mondgottes Men, dessen Priesterschaft Tempelsklaven und heilige Stätten besaß. Als Rom nach dem Sieg über Antiochos III. Kleinasien diesseits des Taurus Eumenes von Pergamon übergab, erklärte es Antiochia für frei."
    - "Marcus Antonius gab Galatien und Lykaonien dem galatischen König Amyntas, der auch Antiochia hielt. Als Amyntas 25 v. Chr. getötet wurde, machte Augustus sein Königreich zur römischen Provinz Galatien, und Antiochia wurde römische Kolonie, Colonia Caesarea, mit Veteranen besiedelt; die Priesterschaft des Men wurde aufgelöst. 1914 fand William Ramsay hier Bruchstücke einer lateinischen Abschrift von Augustus' eigenem Tatenbericht, der Res Gestae."
    - "Paulus und Barnabas kamen auf der ersten Reise von Perge hierher. Am Sabbat sprach Paulus in der Synagoge, seine erste Predigt, die die Apostelgeschichte ausführlich wiedergibt, und am nächsten Sabbat kam fast die ganze Stadt zum Hören. Als die Juden widersprachen, sagten Paulus und Barnabas: „siehe, so wenden wir uns zu den Heiden“. Die Juden hetzten die gottesfürchtigen vornehmen Frauen und die Ersten der Stadt auf, erregten eine Verfolgung gegen die Apostel und vertrieben sie, und sie zogen weiter nach Ikonion; Juden aus Antiochia folgten Paulus später nach Lystra. Der Zweite Timotheusbrief erinnert an die Verfolgungen, die er in Antiochia erduldete. Auf dem Rückweg stärkten sie die Jünger und setzten in jeder Gemeinde Älteste ein. Viele Gelehrte meinen, der Galaterbrief sei an diese Gemeinden im Süden der Provinz gerichtet; andere sehen darin einen Brief an die Galater im Norden."
    - "Antiochia blieb die wichtigste römische Stadt der Gegend und wurde im späteren Reich Hauptstadt der Provinz Pisidien. Sein Bischof Optimus nahm am Konzil von Konstantinopel 381 teil, und sein Name steht auf einer Mosaikinschrift in der großen Basilika der Stadt."
  fr:
    - "Antioche de Pisidie s’élevait sur une colline à la frontière de la Phrygie et de la Pisidie, à environ un kilomètre au nord-est de l’actuelle Yalvaç, en Turquie. Elle fut fondée par l’un des rois séleucides, probablement au IIIe siècle av. J.-C., et Strabon dit qu’elle fut peuplée de colons venus de Magnésie du Méandre. Près d’elle se dressait un sanctuaire du dieu lune Men, dont le sacerdoce possédait des esclaves du temple et des lieux sacrés. Quand Rome, après avoir vaincu Antiochos III, remit à Eumène de Pergame l’Asie Mineure en deçà du Taurus, elle déclara Antioche libre."
    - "Marc Antoine donna la Galatie et la Lycaonie au roi galate Amyntas, qui tenait aussi Antioche. Quand Amyntas fut tué en 25 av. J.-C., Auguste fit de son royaume la province romaine de Galatie, et Antioche devint une colonie romaine, Colonia Caesarea, peuplée de vétérans ; le sacerdoce de Men fut dissous. En 1914, William Ramsay y trouva des fragments d’une copie latine du récit des actions d’Auguste rédigé par lui-même, les Res Gestae."
    - "Paul et Barnabas y vinrent de Perge lors de leur premier voyage. Le sabbat, Paul parla dans la synagogue, premier de ses discours que les Actes donnent longuement, et le sabbat suivant presque toute la ville vint l’entendre. Les Juifs s’y opposant, Paul et Barnabas dirent : « voici, nous nous tournons vers les païens ». Les Juifs excitèrent les femmes pieuses de qualité et les principaux de la ville, suscitèrent une persécution contre les apôtres et les chassèrent ; ceux-ci gagnèrent Icone ; des Juifs d’Antioche suivirent plus tard Paul à Lystre. La seconde épître à Timothée rappelle les persécutions qu’il endura à Antioche. Au retour, les apôtres fortifièrent les disciples et établirent des anciens dans chaque Église. Bien des savants pensent que l’épître aux Galates fut écrite à ces Églises du sud de la province ; d’autres, qu’elle alla aux Galates du nord."
    - "Antioche resta la principale ville romaine de la région, et sous le Bas-Empire elle devint la capitale de la province de Pisidie. Son évêque Optimus assista au concile de Constantinople en 381, et son nom figure dans une inscription de mosaïque de la grande basilique de la ville."
  it:
    - "Antiochia di Pisidia sorgeva su una collina al confine tra Frigia e Pisidia, a circa un chilometro a nord-est dell’odierna Yalvaç, in Turchia. Fu fondata da uno dei re seleucidi, probabilmente nel III secolo a.C., e Strabone dice che fu popolata da coloni di Magnesia sul Meandro. Vicino sorgeva un santuario del dio lunare Men, il cui sacerdozio possedeva schiavi del tempio e luoghi sacri. Quando Roma, dopo aver sconfitto Antioco III, consegnò l’Asia Minore al di qua del Tauro a Eumene di Pergamo, dichiarò libera Antiochia."
    - "Marco Antonio diede la Galazia e la Licaonia al re galata Aminta, che teneva anche Antiochia. Quando Aminta fu ucciso nel 25 a.C., Augusto fece del suo regno la provincia romana di Galazia, e Antiochia divenne colonia romana, Colonia Caesarea, popolata di veterani; il sacerdozio di Men fu sciolto. Nel 1914 William Ramsay vi trovò frammenti di una copia latina del resoconto che Augusto stesso fece delle sue imprese, le Res Gestae."
    - "Paolo e Barnaba vi giunsero da Perge nel loro primo viaggio. Di sabato Paolo parlò nella sinagoga, il primo dei suoi discorsi che gli Atti riportano per esteso, e il sabato seguente quasi tutta la città venne ad ascoltare. Quando i Giudei si opposero, dissero: «ecco, noi ci volgiamo ai Gentili». I Giudei istigarono le donne pie e ragguardevoli e i principali uomini della città, suscitarono una persecuzione contro gli apostoli e li scacciarono, ed essi proseguirono per Icònio; Giudei di Antiochia seguirono poi Paolo a Listra. La Seconda lettera a Timoteo ricorda le persecuzioni da lui sopportate ad Antiochia. Al ritorno gli apostoli confermarono i discepoli e istituirono anziani in ogni chiesa. Molti studiosi pensano che la Lettera ai Galati di Paolo fosse scritta a queste chiese del sud della provincia; altri sostengono che andasse ai Galati del nord."
    - "Antiochia rimase la principale città romana della regione, e nel tardo impero divenne capitale della provincia di Pisidia. Il suo vescovo Ottimo partecipò al concilio di Costantinopoli del 381, e il suo nome compare in un’iscrizione musiva nella grande basilica della città."
  pl:
    - "Antiochia Pizydyjska stała na wzgórzu na granicy Frygii i Pizydii, około kilometra na północny wschód od dzisiejszego Yalvaç w Turcji. Założył ją jeden z królów Seleucydów, prawdopodobnie w III wieku p.n.e., a Strabon mówi, że osiedlili ją koloniści z Magnezji nad Meandrem. W pobliżu stało sanktuarium boga księżyca Mena, którego kapłaństwo miało niewolników świątynnych i miejsca święte. Gdy Rzym, pokonawszy Antiocha III, oddał Eumenesowi z Pergamonu Azję Mniejszą po tej stronie Taurusu, ogłosił Antiochię wolną."
    - "Marek Antoniusz dał Galację i Likaonię galackiemu królowi Amyntasowi, który władał także Antiochią. Gdy Amyntas został zabity w 25 r. p.n.e., August uczynił z jego królestwa rzymską prowincję Galację, a Antiochia stała się rzymską kolonią, Colonia Caesarea, zasiedloną weteranami; kapłaństwo Mena rozwiązano. W 1914 roku William Ramsay znalazł tu fragmenty łacińskiej kopii własnego sprawozdania Augusta z jego czynów, Res Gestae."
    - "Paweł i Barnaba przybyli tu z Perge w pierwszej podróży. W szabat Paweł przemawiał w synagodze, pierwsze ze swoich kazań, które Dzieje podają obszernie, a w następny szabat na jego słowa przyszło niemal całe miasto. Gdy Żydzi im się sprzeciwili, powiedzieli: „… oto się obracamy do pogan”. Żydzi podburzyli pobożne i szanowane kobiety oraz możnych miasta, wzbudzili prześladowanie przeciw apostołom i wypędzili ich, a oni poszli do Ikonium; Żydzi z Antiochii podążyli później za Pawłem do Listry. Drugi List do Tymoteusza wspomina prześladowania, jakie znosił w Antiochii. W drodze powrotnej apostołowie umacniali uczniów i ustanawiali starszych w każdym kościele. Wielu uczonych sądzi, że List do Galacjan napisano do tych kościołów na południu prowincji; inni twierdzą, że poszedł do Galatów z północy."
    - "Antiochia pozostała głównym rzymskim miastem regionu, a w późnym cesarstwie została stolicą prowincji Pizydii. Jej biskup Optymus uczestniczył w Soborze Konstantynopolitańskim w 381 roku, a jego imię występuje w mozaikowym napisie w wielkiej bazylice miasta."
  nl:
    - "Antiochië in Pisidië lag op een heuvel op de grens van Frygië en Pisidië, ongeveer een kilometer ten noordoosten van het huidige Yalvaç in Turkije. Het werd gesticht door een van de Seleucidische koningen, waarschijnlijk in de derde eeuw v.Chr., en Strabo zegt dat het werd bevolkt door kolonisten uit Magnesia aan de Maiandros. Nabij stond een heiligdom van de maangod Men, wiens priesterschap tempelslaven en heilige plaatsen bezat. Toen Rome, na de overwinning op Antiochus III, Klein-Azië aan deze kant van de Taurus aan Eumenes van Pergamon gaf, verklaarde het Antiochië vrij."
    - "Marcus Antonius gaf Galatië en Lykaonië aan de Galatische koning Amyntas, die ook Antiochië bezat. Toen Amyntas in 25 v.Chr. werd gedood, maakte Augustus van zijn koninkrijk de Romeinse provincie Galatië, en Antiochië werd een Romeinse kolonie, Colonia Caesarea, bevolkt met veteranen; het priesterschap van Men werd ontbonden. In 1914 vond William Ramsay hier fragmenten van een Latijns exemplaar van Augustus’ eigen relaas van zijn daden, de Res Gestae."
    - "Paulus en Barnabas kwamen hier vanuit Perge op hun eerste reis. Op de sabbat sprak Paulus in de synagoge, de eerste preek van hem die Handelingen uitvoerig geeft, en de volgende sabbat kwam bijna de hele stad luisteren. Toen de Joden zich verzetten, zeiden zij: “ziet, wij keren ons tot de heidenen”. De Joden hitsten de godvrezende en eerbare vrouwen en de voornaamste mannen van de stad op, vervolgden de apostelen en verdreven hen, en zij gingen verder naar Ikonium; Joden uit Antiochië volgden Paulus later naar Lystre. De Tweede Brief aan Timoteüs noemt de vervolgingen die hij te Antiochië onderging. Op de terugweg versterkten de apostelen de discipelen en stelden oudsten aan in elke gemeente. Velen menen dat Paulus’ Brief aan de Galaten aan deze gemeenten in het zuiden van de provincie was gericht; anderen dat zij naar de Galaten van het noorden ging."
    - "Antiochië bleef de voornaamste Romeinse stad van de streek en werd in het latere rijk de hoofdstad van de provincie Pisidië. Zijn bisschop Optimus woonde het Concilie van Constantinopel in 381 bij, en zijn naam staat in een mozaïekopschrift in de grote basiliek van de stad."
  cs:
    - "Antiochie Pisidská stála na pahorku na hranici Frygie a Pisidie, asi kilometr severovýchodně od dnešního Yalvaç v Turecku. Založil ji některý ze seleukovských králů, pravděpodobně ve 3. století př. n. l., a Strabón praví, že ji osídlili kolonisté z Magnésie na Maiandru. Poblíž stála svatyně boha měsíce Ména, jehož kněžstvo mělo chrámové otroky a posvátná místa. Když Řím po porážce Antiocha III. odevzdal Malou Asii na této straně Tauru Eumenovi Pergamskému, prohlásil Antiochii za svobodnou."
    - "Marcus Antonius dal Galacii a Lykaonii galatskému králi Amyntovi, který držel i Antiochii. Když byl Amyntas roku 25 př. n. l. zabit, učinil Augustus z jeho království římskou provincii Galacii a Antiochie se stala římskou kolonií, Colonia Caesarea, osídlenou veterány; kněžstvo Ména bylo rozpuštěno. V roce 1914 zde William Ramsay našel zlomky latinského opisu Augustova vlastního soupisu činů, Res Gestae."
    - "Pavel a Barnabáš sem přišli z Perge na první cestě. V sobotu Pavel promluvil v synagoze, první ze svých kázání, která Skutky podávají obšírně, a další sobotu přišlo poslouchat téměř celé město. Když jim Židé odporovali, řekli: „aj, obracíme se ku pohanům“. Židé pobouřili nábožné a vážené ženy a přední muže města, vzbudili proti apoštolům pronásledování a vyhnali je, a oni šli do Ikonia; Židé z Antiochie později následovali Pavla do Lystry. Druhý list Timoteovi připomíná pronásledování, která tam snášel. Na zpáteční cestě apoštolové utvrzovali učedníky a ustanovili starší v každé církvi. Mnozí badatelé soudí, že Pavlův list Galatským byl napsán těmto církvím na jihu provincie; jiní tvrdí, že šel Galatským na severu."
    - "Antiochie zůstala hlavním římským městem oblasti a v pozdní říši se stala hlavním městem provincie Pisidie. Její biskup Optimus se zúčastnil koncilu v Konstantinopoli roku 381 a jeho jméno se objevuje v mozaikovém nápise ve velké bazilice města."
  sv:
    - "Antiochia i Pisidien låg på en kulle vid gränsen mellan Frygien och Pisidien, omkring en kilometer nordost om nuvarande Yalvaç i Turkiet. Den grundades av en av de seleukidiska kungarna, sannolikt på 200-talet f.Kr., och Strabon säger att den bosattes av kolonister från Magnesia vid Maiandros. Nära den låg en helgedom för månguden Men, vars prästerskap hade tempelslavar och heliga platser. När Rom, efter att ha besegrat Antiochos III, överlämnade Mindre Asien på denna sida av Taurus till Eumenes av Pergamon, förklarade det Antiochia fritt."
    - "Marcus Antonius gav Galatien och Lykaonien till den galatiske kungen Amyntas, som också höll Antiochia. När Amyntas dödades år 25 f.Kr. gjorde Augustus hans rike till den romerska provinsen Galatien, och Antiochia blev en romersk koloni, Colonia Caesarea, bosatt med veteraner; Mens prästerskap upplöstes. År 1914 fann William Ramsay här fragment av en latinsk kopia av Augustus egen redogörelse för sina gärningar, Res Gestae."
    - "Paulus och Barnabas kom hit från Perge på sin första resa. På sabbaten talade Paulus i synagogan, den första av hans predikningar som Apostlagärningarna återger utförligt, och nästa sabbat kom nästan hela staden för att höra. När judarna motsatte sig dem sade de: ”så vända vi oss nu till hedningarna.” Judarna uppeggade de gudfruktiga och ansedda kvinnorna och stadens förnämsta män, väckte förföljelse mot apostlarna och fördrev dem, och de gick vidare till Ikonion; judar från Antiochia följde senare Paulus till Lystra. Andra Timoteusbrevet minns de förföljelser han fick utstå i Antiochia. På hemvägen styrkte apostlarna lärjungarna och utsåg äldste i varje församling. Många forskare anser att Paulus’ brev till galaterna skrevs till dessa församlingar i provinsens södra del; andra menar att det gick till galaterna i norr."
    - "Antiochia förblev regionens främsta romerska stad, och under senare kejsartid blev det huvudstad i provinsen Pisidien. Dess biskop Optimus deltog i konciliet i Konstantinopel år 381, och hans namn förekommer i en mosaikinskrift i stadens stora basilika."
  nb:
    - "Antiokia i Pisidia lå på en høyde på grensen mellom Frygia og Pisidia, omtrent en kilometer nordøst for dagens Yalvaç i Tyrkia. Den ble grunnlagt av en av de seleukidiske kongene, trolig på 200-tallet f.Kr., og Strabon sier at den ble bosatt av kolonister fra Magnesia ved Maiander. Nær den sto en helligdom for måneguden Men, hvis prestedømme hadde tempelslaver og hellige steder. Da Roma, etter å ha beseiret Antiokos III, overlot Lilleasia på denne siden av Taurus til Eumenes av Pergamon, erklærte det Antiokia fri."
    - "Marcus Antonius ga Galatia og Lykaonia til den galatiske kongen Amyntas, som også rådde over Antiokia. Da Amyntas ble drept i 25 f.Kr., gjorde Augustus riket hans til den romerske provinsen Galatia, og Antiokia ble en romersk koloni, Colonia Caesarea, bosatt med veteraner; Men-prestedømmet ble oppløst. I 1914 fant William Ramsay her fragmenter av en latinsk kopi av Augustus' egen beretning om sine gjerninger, Res Gestae."
    - "Paulus og Barnabas kom hit fra Perge på sin første reise. På sabbaten talte Paulus i synagogen, den første av hans prekener som Apostlenes gjerninger gjengir utførlig, og den neste sabbaten kom nesten hele byen for å høre. Da jødene motsatte seg dem, sa de: «så vender vi oss nu til hedningene». Jødene hisset opp de gudfryktige og fornemme kvinnene og byens ledende menn, reiste forfølgelse mot apostlene og drev dem bort, og de dro videre til Ikonium; jøder fra Antiokia fulgte senere Paulus til Lystra. Det andre brevet til Timoteus minnes forfølgelsene han utholdt i Antiokia. På hjemveien styrket apostlene disiplene og innsatte eldste i hver menighet. Mange forskere mener at Paulus' brev til galaterne ble skrevet til disse menighetene i den sørlige delen av provinsen; andre holder det for at det gikk til galaterne i nord."
    - "Antiokia forble den fremste romerske byen i regionen, og i det senere keiserriket ble den hovedstad i provinsen Pisidia. Biskopen Optimus deltok på konsilet i Konstantinopel i 381, og navnet hans står i en mosaikkinnskrift i byens store basilika."
  tl:
    - "Ang Antioquia ng Pisidia ay nakatayo sa isang burol sa hangganan ng Frigia at Pisidia, mga isang kilometro sa hilagang-silangan ng makabagong Yalvaç sa Turkey. Itinatag ito ng isa sa mga haring Seleucida, marahil noong ika-3 siglo BK, at sinasabi ni Strabo na tinirhan ito ng mga kolonista mula sa Magnesia sa Meandro. Malapit dito ang isang santuwaryo ng diyos ng buwan na si Men, na ang pagkasaserdote ay may mga aliping templo at mga sagradong lugar. Nang ibigay ng Roma, matapos talunin si Antioco III, ang Asia Minor sa panig na ito ng Taurus kay Eumenes ng Pergamo, ipinahayag nitong malaya ang Antioquia."
    - "Ibinigay ni Marco Antonio ang Galacia at Licaonia kay Amyntas, haring Galacio, na may hawak din ng Antioquia. Nang mapatay si Amyntas noong 25 BK, ginawa ni Augusto na lalawigang Romano ng Galacia ang kaniyang kaharian, at ang Antioquia ay naging kolonyang Romano, Colonia Caesarea, na tinirhan ng mga beterano; binuwag ang pagkasaserdote ni Men. Noong 1914, natagpuan dito ni William Ramsay ang mga piraso ng kopyang Latin ng sariling talaan ni Augusto ng kaniyang mga gawa, ang Res Gestae."
    - "Dumating dito sina Pablo at Bernabe mula sa Perga sa unang paglalakbay. Sa sabbath ay nagsalita si Pablo sa sinagoga, ang una niyang pangaral na buong inilahad sa Mga Gawa, at sa sumunod na sabbath ay halos ang buong lungsod ang dumating upang makinig. Nang tutulan sila ng mga Judio, sinabi nila: “narito, kami ay pasasa mga Gentil.” Inudyukan ng mga Judio ang mga babaing masisipag sa kabanalan na may mahal na kalagayan at ang mga pangunahing tao ng lungsod, nagbangon ng pag-uusig at pinalayas sila; nagpatuloy sila sa Iconio; sumunod kay Pablo sa Listra ang mga Judio ng Antioquia. Inaalala ng 2 Timoteo ang mga pag-uusig niya sa Antioquia. Pabalik, pinatibay nila ang mga alagad at nagtalaga ng mga matanda sa bawat iglesia. Iniisip ng maraming iskolar na ang Liham sa mga Taga-Galacia ay para sa mga iglesiang ito sa timog ng lalawigan; iginigiit ng iba na para ito sa mga Galacio sa hilaga."
    - "Nanatili ang Antioquia bilang pangunahing lungsod na Romano ng rehiyon, at sa huling imperyo ay naging kabisera ng lalawigan ng Pisidia. Dumalo ang obispo nitong si Optimus sa Konseho ng Constantinopla noong 381, at lumilitaw ang kaniyang pangalan sa isang inskripsiyong mosaiko sa dakilang basilika ng lungsod."
  da:
    - "Antiokia i Pisidien lå på en høj på grænsen mellem Frygien og Pisidien, omkring en kilometer nordøst for nutidens Yalvaç i Tyrkiet. Den blev grundlagt af en af de seleukidiske konger, sandsynligvis i 200-tallet f.Kr., og Strabon siger, at den blev bosat af kolonister fra Magnesia ved Maiander. Nær den lå en helligdom for månegudden Men, hvis præsteskab rådede over tempelslaver og hellige steder. Da Rom, efter at have besejret Antiochos 3., gav Lilleasien på denne side af Taurus til Eumenes af Pergamon, erklærede det Antiokia for fri."
    - "Marcus Antonius gav Galatien og Lykaonien til den galatiske konge Amyntas, der også rådede over Antiokia. Da Amyntas blev dræbt i 25 f.Kr., gjorde Augustus hans rige til den romerske provins Galatien, og Antiokia blev en romersk koloni, Colonia Caesarea, bosat med veteraner; Men-præsteskabet blev opløst. I 1914 fandt William Ramsay her brudstykker af en latinsk kopi af Augustus' egen beretning om sine bedrifter, Res Gestae."
    - "Paulus og Barnabas kom hertil fra Perge på deres første rejse. På sabbatten talte Paulus i synagogen, den første af hans prædikener, som Apostlenes Gerninger gengiver udførligt, og den næste sabbat kom næsten hele byen for at høre. Da jøderne modsatte sig dem, sagde de: »se, saa vende vi os til Hedningerne«. Jøderne ophidsede de gudfrygtige kvinder og byens første mænd, vakte forfølgelse mod apostlene og drev dem bort, og de drog videre til Ikonion; jøder fra Antiokia fulgte senere Paulus til Lystra. Andet Timotheusbrev husker de forfølgelser, han udstod i Antiokia. På hjemvejen styrkede apostlene disciplene og indsatte ældste i hver menighed. Mange forskere mener, at Paulus' brev til galaterne blev skrevet til disse menigheder i provinsens sydlige del; andre mener, at det gik til galaterne i nord."
    - "Antiokia forblev egnens hovedby under romerne, og i det senere kejserrige blev den hovedstad i provinsen Pisidien. Dens biskop Optimus deltog i koncilet i Konstantinopel i 381, og hans navn findes i en mosaikindskrift i byens store basilika."
  sr:
    - "Антиохија Писидијска стајала је на брду на граници Фригије и Писидије, око километар североисточно од савременог Јалвача у Турској. Основао ју је један од селевкидских краљева, вероватно у 3. веку п. н. е., а Страбон каже да су је населили колонисти из Магнезије на Меандру. Близу је стајало светилиште бога месеца Мена, чије је свештенство држало храмске робове и свете просторе. Када је Рим, пошто је победио Антиоха III, предао Малу Азију с ове стране Тавра Евмену Пергамском, прогласио је Антиохију слободном."
    - "Марко Антоније дао је Галатију и Ликаонију галатском краљу Аминти, који је држао и Антиохију. Када је Аминта убијен 25. п. н. е., Август је од његовог краљевства начинио римску провинцију Галатију, а Антиохија је постала римска колонија, Колонија Цезареја, насељена ветеранима; свештенство Мена је укинуто. Године 1914. Вилијам Рамзи нашао је овде делове латинског примерка Августовог властитог записа о његовим делима, Рес гесте."
    - "Павле и Варнава дошли су овамо из Перге на првом путовању. У суботу је Павле говорио у синагоги, у првој од својих проповеди које Дела дају опширно, а следеће суботе скоро цео град дошао је да слуша. Када су им се Јевреји успротивили, рекли су: „ево се обрћемо к незнабошцима“. Јевреји су подговорили побожне и поштене жене и старешине градске, подигли гоњење на апостоле и истерали их, и они су отишли у Икониј; Јевреји из Антиохије касније су пошли за Павлом у Листру. Друга посланица Тимотију сећа се прогона које је претрпео у Антиохији. На повратку су апостоли утврђивали ученике и постављали старешине по свим црквама. Многи научници мисле да је Посланица Галатима писана овим црквама на југу провинције; други држе да је ишла Галатима на северу."
    - "Антиохија је остала главни римски град краја, а у каснијем царству постала је престоница провинције Писидије. Њен епископ Оптим присуствовао је Цариградском сабору 381, а његово име јавља се у мозаичком натпису у великој базилици града."
  hu:
    - "A piszidiai Antiókhia a Frígia és Piszídia határán álló dombon feküdt, a törökországi Yalvaçtól mintegy egy kilométerre északkeletre. A szeleukida királyok egyike alapította, valószínűleg a Kr. e. 3. században, és Sztrabón szerint a Maiandrosz menti Magnésiából érkezett telepesek lakták. Közelében állt Mén holdisten szentélye, amelynek papsága templomi rabszolgákat és szent helyeket birtokolt. Amikor Róma III. Antiochosz legyőzése után a Taurosztól idáig eső Kis-Ázsiát a pergamoni Eumenésznek adta, Antiókhiát szabadnak nyilvánította."
    - "Marcus Antonius Galáciát és Likaóniát Amüntasz galata királynak adta, aki Antiókhiát is birtokolta. Amikor Amüntaszt Kr. e. 25-ben megölték, Augusztus királyságából Galácia római provinciát alkotott, Antiókhia pedig római gyarmat lett, Colonia Caesarea, veteránokkal betelepítve; Mén papságát feloszlatták. 1914-ben William Ramsay itt találta meg Augusztus saját tetteiről szóló feljegyzésének, a Res Gestaenek a latin másolatából származó töredékeket."
    - "Pál és Barnabás Pergéből ide érkezett első útján. Szombaton Pál a zsinagógában beszélt, első olyan beszéde, amelyet az Apostolok cselekedetei hosszan közöl, a következő szombaton pedig szinte az egész város eljött meghallgatni. Amikor a zsidók ellenálltak, ők ezt mondták: „ímé a pogányokhoz fordulunk”. A zsidók felbujtották az istenfélő és tisztességes asszonyokat és a város előkelőit, üldözést támasztottak az apostolok ellen és kiűzték őket, azok pedig Ikóniumba mentek; az antiókhiai zsidók később követték Pált Lisztrába. A Timóteushoz írt második levél emlékezik az Antiókhiában elszenvedett üldöztetésekre. Visszatértükben az apostolok megerősítették a tanítványokat, és véneket rendeltek minden gyülekezetben. Sok kutató úgy véli, hogy a Galatákhoz írt levél a provincia déli gyülekezeteinek szólt; mások szerint az északi galatákhoz ment."
    - "Antiókhia a vidék fő római városa maradt, és a későbbi császárkorban Piszídia provincia fővárosa lett. Püspöke, Optimus részt vett a 381-es konstantinápolyi zsinaton, és neve szerepel a város nagy bazilikájának mozaikfeliratán."
  fi:
    - "Pisidian Antiokia sijaitsi kukkulalla Fryygian ja Pisidian rajalla, noin kilometrin nykyisestä Yalvaçista koilliseen Turkissa. Sen perusti yksi seleukidikuninkaista, luultavasti 200-luvulla eaa., ja Strabon sanoo sinne asettuneen siirtolaisia Maiandroksen Magnesiasta. Sen lähellä oli kuun jumalan Menin pyhäkkö, jonka papistolla oli temppeliorjia ja pyhiä paikkoja. Kun Rooma voitettuaan Antiokhos III:n antoi Taurusvuorten tämänpuoleisen Vähän-Aasian Pergamonin Eumeneelle, se julisti Antiokian vapaaksi."
    - "Marcus Antonius antoi Galatian ja Lykaonian galatialaiselle kuningas Amyntakselle, joka hallitsi myös Antiokiaa. Kun Amyntas kuoli 25 eaa., Augustus teki hänen valtakunnastaan Rooman Galatian provinssin, ja Antiokiasta tuli roomalainen siirtokunta, Colonia Caesarea, johon asutettiin veteraaneja; Menin papisto lakkautettiin. Vuonna 1914 William Ramsay löysi täältä katkelmia Augustuksen omasta teoistaan laatiman kertomuksen, Res Gestaen, latinankielisestä jäljennöksestä."
    - "Paavali ja Barnabas tulivat tänne Pergestä ensimmäisellä matkallaan. Sapattina Paavali puhui synagogassa, ensimmäisessä saarnassaan, jonka Apostolien teot esittää laajasti, ja seuraavana sapattina melkein koko kaupunki tuli kuulemaan. Kun juutalaiset vastustivat heitä, he sanoivat: ”niin katso, me käännymme pakanain puoleen.” Juutalaiset yllyttivät Jumalaa pelkääviä, arvossa pidettyjä naisia ja kaupungin johtomiehiä vainoamaan apostoleja ja karkottivat heidät, ja he jatkoivat Ikonioniin; Antiokian juutalaisia seurasi myöhemmin Paavalia Lystraan. Toinen kirje Timoteukselle muistaa vainot, jotka hän kärsi Antiokiassa. Paluumatkalla apostolit vahvistivat opetuslapsia ja asettivat vanhimmat jokaiseen seurakuntaan. Monet tutkijat pitävät Paavalin kirjettä galatalaisille osoitettuna näille provinssin eteläisille seurakunnille, toiset pohjoisen galatalaisille."
    - "Antiokia pysyi alueen tärkeimpänä roomalaisena kaupunkina, ja myöhäisessä valtakunnassa siitä tuli Pisidian provinssin pääkaupunki. Sen piispa Optimus osallistui Konstantinopolin kirkolliskokoukseen 381, ja hänen nimensä esiintyy kaupungin suuren basilikan mosaiikkikirjoituksessa."
  vi:
    - "An-ti-ốt ở Bi-si-đi đứng trên một ngọn đồi ở biên giới Phi-ri-gi và Bi-si-đi, cách Yalvaç hiện đại ở Thổ Nhĩ Kỳ khoảng một km về phía đông bắc. Thành do một trong các vua Seleucus lập, có lẽ vào thế kỷ 3 TCN, và Strabon nói nó được định cư bởi những người di dân từ Magnesia bên sông Maeander. Gần đó có đền thờ thần mặt trăng Men, mà hàng tư tế nắm giữ nô lệ đền thờ và các nơi thánh. Khi Rô-ma, sau khi đánh bại Antiochus III, giao vùng Tiểu Á bên này dãy Taurus cho Eumenes của Bẹt-găm, họ tuyên bố An-ti-ốt được tự do."
    - "Marcus Antonius trao Ga-la-ti và Ly-cao-ni cho vua Ga-la-ti là Amyntas, người cũng nắm An-ti-ốt. Khi Amyntas bị giết năm 25 TCN, Au-gút-tơ biến vương quốc của ông thành tỉnh La Mã Ga-la-ti, và An-ti-ốt trở thành một thuộc địa La Mã, Colonia Caesarea, do các cựu binh định cư; hàng tư tế của Men bị giải tán. Năm 1914, William Ramsay tìm thấy tại đây các mảnh của một bản sao Latinh bản ghi chép chính Au-gút-tơ về những việc làm của mình, Res Gestae."
    - "Phao-lô và Ba-na-ba đến đây từ Bẹt-giê trong chuyến đi đầu tiên. Vào ngày sa-bát, Phao-lô giảng trong nhà hội, bài giảng đầu tiên của ông mà sách Công Vụ chép dài, và vào ngày sa-bát kế tiếp gần như cả thành đến nghe. Khi người Giu-đa chống đối, họ nói: “chúng ta mới xây qua người ngoại”. Người Giu-đa xúi giục các phụ nữ sùng đạo và có địa vị cùng các người đứng đầu thành, gây cuộc bắt bớ các sứ đồ và đuổi họ ra, và họ đi tiếp đến Y-cô-ni; sau đó người Giu-đa từ An-ti-ốt đuổi theo Phao-lô đến Lít-trơ. Thư thứ hai gửi Ti-mô-thê nhớ lại những cuộc bắt bớ ông chịu tại An-ti-ốt. Trên đường trở về, các sứ đồ làm vững lòng môn đồ và lập các trưởng lão trong mọi hội thánh. Nhiều học giả cho rằng Thư gửi người Ga-la-ti của Phao-lô được viết cho các hội thánh này ở miền nam tỉnh; những người khác cho rằng nó gửi cho người Ga-la-ti ở miền bắc."
    - "An-ti-ốt vẫn là thành La Mã chính của vùng, và trong đế quốc về sau nó trở thành thủ phủ của tỉnh Bi-si-đi. Giám mục Optimus của thành dự Công đồng Constantinopolis năm 381, và tên ông xuất hiện trong một bia ký khảm trong thánh đường lớn của thành."
  ro:
    - "Antiohia Pisidiei se afla pe un deal la hotarul dintre Frigia și Pisidia, la aproximativ un kilometru nord-est de Yalvaç de astăzi, în Turcia. A fost întemeiată de unul dintre regii seleucizi, probabil în secolul al III-lea î.Hr., iar Strabon spune că a fost colonizată de coloniști din Magnesia de pe Meandru. Lângă ea se afla un sanctuar al zeului lunii Men, al cărui sacerdoțiu stăpânea sclavi ai templului și locuri sfinte. Când Roma, după înfrângerea lui Antioh al III-lea, i-a dat lui Eumene din Pergam Asia Mică de dincoace de Taurus, a declarat Antiohia liberă."
    - "Marcu Antoniu a dat Galatia și Licaonia regelui galat Amyntas, care stăpânea și Antiohia. Când Amyntas a fost ucis în 25 î.Hr., Augustus a făcut din regatul lui provincia romană Galatia, iar Antiohia a devenit colonie romană, Colonia Caesarea, populată cu veterani; sacerdoțiul lui Men a fost desființat. În 1914, William Ramsay a găsit aici fragmente ale unei copii latine a însemnărilor lui Augustus despre faptele sale, Res Gestae."
    - "Pavel și Barnaba au venit aici de la Perga în prima lor călătorie. În sabat, Pavel a vorbit în sinagogă, prima dintre predicile lui pe care Faptele Apostolilor o redau pe larg, iar în sabatul următor aproape toată cetatea a venit să-l asculte. Când iudeii li s-au împotrivit, ei au spus: „iată ne întoarcem la neamuri”. Iudeii au tulburat femeile cucernice și de cinste și pe fruntașii cetății, au ridicat prigoană împotriva apostolilor și i-au izgonit, iar ei au mers mai departe la Iconia; iudei din Antiohia l-au urmat mai târziu pe Pavel la Listra. A doua epistolă către Timotei amintește prigonirile pe care le-a îndurat la Antiohia. La întoarcere, apostolii au întărit ucenicii și au rânduit prezbiteri în biserici. Mulți cercetători socotesc că Epistola către Galateni a fost scrisă acestor biserici din sudul provinciei; alții susțin că a fost trimisă galaților din nord."
    - "Antiohia a rămas principala cetate romană a regiunii, iar în imperiul târziu a devenit capitala provinciei Pisidia. Episcopul ei Optimus a participat la Sinodul de la Constantinopol din 381, iar numele lui apare într-o inscripție în mozaic din marea bazilică a cetății."
  bg:
    - "Антиохия Писидийска стояла на хълм на границата на Фригия и Писидия, на около километър североизточно от днешния Ялвач в Турция. Основана е от един от селевкидските царе, вероятно през III в. пр.н.е., а Страбон казва, че е била заселена от колонисти от Магнезия на Меандър. Близо до нея стояло светилище на лунния бог Мен, чието свещеничество разполагало с храмови роби и свещени места. Когато Рим, след победата над Антиох III, предал на Евмен от Пергам Мала Азия по тази страна на Тавър, той обявил Антиохия за свободна."
    - "Марк Антоний дал Галатия и Ликаония на галатския цар Аминта, който държал и Антиохия. Когато Аминта бил убит през 25 г. пр.н.е., Август превърнал царството му в римската провинция Галатия, а Антиохия станала римска колония, Colonia Caesarea, заселена с ветерани; свещеничеството на Мен било разпуснато. През 1914 г. Уилям Рамзи намерил тук фрагменти от латински препис на собствения отчет на Август за делата му, Res Gestae."
    - "Павел и Варнава дошли тук от Перга при първото си пътуване. В събота Павел говорил в синагогата — първата от проповедите му, които Деяния дават подробно, а в следващата събота почти целият град дошъл да слуша. Когато юдеите им се противопоставили, те казали: „ето, обръщаме се към езичниците“. Юдеите подбудили набожните и почтените жени и първите на града, повдигнали гонение срещу апостолите и ги изгонили, и те продължили към Икония; юдеи от Антиохия по-късно последвали Павел в Листра. Второто послание към Тимотей си спомня гоненията, които той понесъл в Антиохия. На връщане апостолите укрепвали учениците и ръкополагали презвитери във всяка църква. Много изследователи смятат, че Посланието на Павел към галатяните е писано до тези църкви в южната част на провинцията; други твърдят, че е било до галатяните на север."
    - "Антиохия останала главният римски град на областта, а в по-късната империя станала столица на провинция Писидия. Нейният епископ Оптим присъствал на Константинополския събор през 381 г. и името му се появява в мозаечен надпис в голямата базилика на града."
