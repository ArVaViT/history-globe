body:
  en:
    - "Hena is known only from the speech of Sennacherib's officer under the walls of Jerusalem in 701 BC and from its echoes. The Rabshakeh asked the people on the wall, “Where are the gods of Hamath, and of Arpad? where are the gods of Sepharvaim, Hena, and Ivah? have they delivered Samaria out of mine hand?”, and the letter Hezekiah spread before the LORD repeated the list: “Where is the king of Hamath, and the king of Arpad, and the king of the city of Sepharvaim, of Hena, and Ivah?” Isaiah gives the same words. Hena, then, was a city with its own king and gods that Assyria had already crushed, cited as a warning. The parallel speech in Isaiah 36 leaves Hena and Ivah out."
    - "Most take Hena for Anah, the ancient Anat or Hanat, a town on an island and the banks of the middle Euphrates in the land of Suhu, where Assyrian armies campaigned from the ninth century BC on, and the inscriptions of its governors in the eighth century show a small state of its own on the river between Assyria and Babylonia. The order of the list, which otherwise moves through Syria, fits less well, and the second candidate on the map is an unknown town in the country around Hamath. Some scholars have held that Hena and Ivah are not places at all but names of gods, or corruptions of other words; the question is open."
    - "Anah stands today in Iraq's Anbar province. Its old town was drowned by the reservoir of the Haditha Dam in the mid-1980s; its old minaret was cut into sections and rebuilt in the new town above the lake; it was blown up in 2006, destroyed again by the Islamic State in 2016 after being rebuilt, and has since been reconstructed."
  ru:
    - "Ена известна только из речи военачальника Сеннахирима под стенами Иерусалима в 701 г. до н. э. и из её отголосков. Рабсак спросил людей на стене: «Где боги Емафа и Арпада? Где боги Сепарваима, Ены и Иввы? Спасли ли они Самарию от руки моей?», а письмо, которое Езекия развернул пред Господом, повторяло этот перечень: «Где царь Емафа, и царь Арпада, и царь города Сепарваима, Ены и Иввы?» Исаия даёт те же слова. Значит, Ена была городом со своим царём и своими богами, который Ассирия уже сокрушила и который приводили в острастку. Параллельная речь в 36-й главе Исаии Ену и Ивву опускает."
    - "Большинство видят в Ене Ану, древний Анат, город на острове и берегах среднего Евфрата в земле Суху, куда ассирийские войска ходили с IX века до н. э., а надписи его правителей VIII века показывают маленькое особое государство на реке между Ассирией и Вавилонией. Порядок перечня, который в остальном идёт по Сирии, подходит хуже, и второй кандидат на карте — неизвестный город в окрестностях Емафа. Некоторые учёные считали, что Ена и Ивва — вовсе не места, а имена богов или испорченные слова; вопрос открыт."
    - "Ана сегодня стоит в иракской провинции Анбар. Её старый город затопило водохранилище плотины Хадита в середине 1980-х годов; старый минарет разрезали на части и собрали заново в новом городе над озером; в 2006 году его взорвали, после восстановления в 2016 году его снова разрушило «Исламское государство», а затем его отстроили вновь."
  uk:
    - "Хена відома лише з промови офіцера Сінаххеріба під мурами Єрусалима 701 р. до н. е. та з її відлуння. Рабсак питав людей на мурі: «Де боги Ематові й Арпадові? де боги Сефарваїмові, Енині й Івині? Чи ж вирятували вони Самарию з руки моєї?», а лист, який Єзекія розклав перед Господом, повторив перелік: «Де царь Ематський й царь Арпадський й царь пад городом Сефарваїмом, Еною й Іввою?» Ісая наводить ті самі слова. Отже, Хена була містом із власним царем і богами, яке Ассирія вже розтрощила, наведеним як застереження. Паралельна промова в Ісаї 36 опускає Хену та Іву."
    - "Більшість уважає Хену за Ану, давній Анат або Ханат, місто на острові й берегах середнього Євфрату в краї Сухи, де ассирійські війська вели походи від IX ст. до н. е., а написи її правителів VIII ст. показують малу окрему державу на річці між Ассирією та Вавилонією. Порядок переліку, який іншими своїми місцями проходить по Сирії, пасує гірше, і другий кандидат на карті — невідоме місто в краї навколо Хамату. Деякі дослідники вважали, що Хена та Іва — це зовсім не місця, а імена богів або спотворення інших слів; питання відкрите."
    - "Ана сьогодні стоїть у провінції Анбар в Іраку. Її старе місто було затоплене водосховищем греблі Хадіта в середині 1980-х років; її старий мінарет розрізали на секції й відбудували в новому місті над озером; його підірвали 2006 року, після відбудови 2016 року знову зруйнувала «Ісламська держава», а відтоді його відновлено."
  es:
    - "Hena se conoce solo por el discurso del oficial de Senaquerib bajo los muros de Jerusalén en el 701 a. C. y por sus ecos. El Rabsaces preguntó a la gente que estaba en el muro: «¿Dónde está el dios de Hamath, y de Arphad? ¿dónde el dios de Sepharvaim, de Hena, y de Hiva? ¿pudieron éstos librar á Samaria de mi mano?», y la carta que Ezequías extendió ante el Señor repitió la lista: «¿Dónde está el rey de Hamath, el rey de Arphad, el rey de la ciudad de Sepharvaim, de Hena, y de Hiva?». Isaías da las mismas palabras. Hena era, pues, una ciudad con su propio rey y sus dioses que Asiria había aplastado ya, citada como advertencia. El discurso paralelo de Isaías 36 omite Hena e Iva."
    - "La mayoría toma Hena por Aná, la antigua Anat o Hanat, una población en una isla y en las orillas del Éufrates medio, en la tierra de Suhu, donde los ejércitos asirios hicieron campañas desde el siglo IX a. C., y las inscripciones de sus gobernadores del siglo VIII muestran un pequeño Estado propio en el río entre Asiria y Babilonia. El orden de la lista, que por lo demás recorre Siria, encaja peor, y el segundo candidato del mapa es una población desconocida en la comarca de Hamat. Algunos estudiosos han sostenido que Hena e Iva no son lugares sino nombres de dioses, o corrupciones de otras palabras; la cuestión está abierta."
    - "Aná se halla hoy en la provincia de Anbar, en Irak. Su casco antiguo quedó anegado por el embalse de la presa de Haditha a mediados de los años ochenta; su antiguo minarete fue cortado en secciones y reconstruido en la nueva ciudad sobre el lago; fue dinamitado en 2006, destruido de nuevo por el Estado Islámico en 2016 tras ser reconstruido, y desde entonces se ha vuelto a levantar."
  pt:
    - "Hena só é conhecida pelo discurso do oficial de Senaqueribe sob os muros de Jerusalém em 701 a.C. e por seus ecos. O Rabsaqué perguntou ao povo sobre a muralha: “Onde estão os deuses de Hamate e de Arpade? Onde estão os deuses de Sefarvaim, de Hena e de Iva? Acaso eles livraram Samaria da minha mão?”, e a carta que Ezequias estendeu diante do SENHOR repetiu a lista: “Onde está o rei de Hamate, o rei de Arpade, e o rei da cidade de Sefarvaim, de Hena e de Iva?” Isaías traz as mesmas palavras. Hena, então, era uma cidade com seu próprio rei e deuses que a Assíria já havia esmagado, citada como advertência. O discurso paralelo em Isaías 36 omite Hena e Iva."
    - "A maioria toma Hena por Ana, a antiga Anat ou Hanat, uma cidade numa ilha e nas margens do médio Eufrates, na terra de Suhu, onde exércitos assírios fizeram campanha a partir do século IX a.C., e as inscrições de seus governadores no século VIII mostram um pequeno Estado próprio no rio, entre a Assíria e a Babilônia. A ordem da lista, que de resto percorre a Síria, combina menos bem, e o segundo candidato do mapa é uma cidade desconhecida na região em torno de Hamate. Alguns estudiosos sustentaram que Hena e Iva não são lugares, mas nomes de deuses, ou corrupções de outras palavras; a questão está aberta."
    - "Ana fica hoje na província de Anbar, no Iraque. Sua cidade antiga foi submersa pelo reservatório da barragem de Haditha em meados da década de 1980; seu velho minarete foi cortado em seções e reconstruído na nova cidade acima do lago; foi dinamitado em 2006, destruído de novo pelo Estado Islâmico em 2016 depois de reconstruído, e desde então foi reerguido."
  de:
    - "Hena ist nur aus der Rede von Sanheribs Offizier unter den Mauern Jerusalems 701 v. Chr. und deren Echos bekannt. Der Rabsake fragte die Leute auf der Mauer: „Wo sind die Götter zu Hamath und Arpad? Wo sind die Götter zu Sepharvaim, Hena und Iwwa? Haben sie auch Samaria errettet von meiner Hand?“, und der Brief, den Hiskia vor dem HERRN ausbreitete, wiederholte die Liste: „Wo ist der König von Hamath, der König zu Arpad und der König der Stadt Sepharvaim, von Hena und Iwwa?“ Jesaja gibt dieselben Worte wieder. Hena war also eine Stadt mit eigenem König und eigenen Göttern, die Assyrien schon niedergeworfen hatte, als Warnung angeführt. Die Parallelrede in Jesaja 36 lässt Hena und Iwwa aus."
    - "Die meisten halten Hena für Ana, das antike Anat oder Hanat, eine Stadt auf einer Insel und an den Ufern des mittleren Euphrat im Land Suchu, wo assyrische Heere seit dem 9. Jahrhundert v. Chr. Feldzüge führten und wo die Inschriften seiner Statthalter im 8. Jahrhundert einen kleinen eigenen Staat am Fluss zwischen Assyrien und Babylonien zeigen. Die Reihenfolge der Liste, die sonst durch Syrien führt, passt weniger gut, und der zweite Kandidat auf der Karte ist eine unbekannte Stadt im Land um Hamat. Manche Forscher haben gemeint, Hena und Iwwa seien gar keine Orte, sondern Götternamen oder Verderbnisse anderer Wörter; die Frage ist offen."
    - "Ana liegt heute in der irakischen Provinz Anbar. Seine Altstadt wurde Mitte der 1980er Jahre vom Stausee des Haditha-Damms überflutet; sein altes Minarett wurde in Teile zerschnitten und in der neuen Stadt über dem See wieder aufgebaut; 2006 wurde es gesprengt, nach dem Wiederaufbau 2016 vom Islamischen Staat erneut zerstört und ist seither wiedererrichtet worden."
  fr:
    - "Héna n’est connue que par le discours de l’officier de Sanchérib sous les murs de Jérusalem en 701 av. J.-C. et par ses échos. Le Rabschaké demanda au peuple sur la muraille : « Où sont les dieux de Hamath et d’Arpad ? Où sont les dieux de Sepharvaïm, d’Héna et d’Ivva ? Ont-ils délivré Samarie de ma main ? », et la lettre qu’Ézéchias déploya devant l’Éternel reprenait la liste : « Où sont le roi de Hamath, le roi d’Arpad, et le roi de la ville de Sepharvaïm, d’Héna et d’Ivva ? » Ésaïe donne les mêmes mots. Héna était donc une ville avec son propre roi et ses propres dieux que l’Assyrie avait déjà écrasée, citée en avertissement. Le discours parallèle d’Ésaïe 36 omet Héna et Ivva."
    - "La plupart tiennent Héna pour Ana, l’ancienne Anat ou Hanat, ville sur une île et sur les rives de l’Euphrate moyen, au pays de Suhu, où les armées assyriennes firent campagne à partir du IXe siècle av. J.-C., et dont les inscriptions des gouverneurs au VIIIe siècle montrent un petit État propre sur le fleuve entre l’Assyrie et la Babylonie. L’ordre de la liste, qui parcourt par ailleurs la Syrie, s’y accorde moins bien, et le second candidat de la carte est une ville inconnue du pays autour de Hamath. Certains spécialistes ont soutenu que Héna et Ivva ne sont pas des lieux mais des noms de dieux, ou des corruptions d’autres mots ; la question est ouverte."
    - "Ana se trouve aujourd’hui dans la province d’Anbar, en Irak. Sa vieille ville fut noyée par le réservoir du barrage de Haditha au milieu des années 1980 ; son ancien minaret fut découpé en sections et reconstruit dans la ville nouvelle au-dessus du lac ; il fut dynamité en 2006, détruit de nouveau par l’État islamique en 2016 après avoir été rebâti, et a depuis été reconstruit."
  pl:
    - "Hena jest znana tylko z mowy oficera Sennacheryba pod murami Jerozolimy w 701 r. p.n.e. i z jej odgłosów. Rabszake pytał ludzi na murze: „Gdzież jest bóg Emat i Arfad? gdzież jest bóg Sefarwaim, Ana i Awa? izali wyrwali Samaryję z rąk moich?”, a list, który Ezechiasz rozpostarł przed Panem, powtarzał wyliczenie: „Gdzież jest król Emat, i król Arfad, i król miasta Sefarwaim, Ana i Awa?”. Izajasz podaje te same słowa. Hena była więc miastem z własnym królem i bogami, które Asyria już zmiażdżyła, przywołanym jako przestroga. Odpowiednia mowa w Izajaszu 36 pomija Henę i Awę."
    - "Większość uważa Henę za Ana, dawne Anat lub Chanat, miasto na wyspie i brzegach środkowego Eufratu w ziemi Suchu, gdzie asyryjskie armie prowadziły kampanie od IX w. p.n.e., a napisy jego namiestników z VIII w. pokazują małe własne państwo nad rzeką między Asyrią a Babilonią. Kolejność wykazu, który skądinąd biegnie przez Syrię, pasuje mniej dobrze, a drugim kandydatem na mapie jest nieznane miasto w okolicy Chamat. Niektórzy uczeni uważali, że Hena i Awa nie są w ogóle miejscami, lecz imionami bogów albo zniekształceniami innych słów; sprawa jest otwarta."
    - "Ana leży dziś w irackiej prowincji Anbar. Jej stare miasto zalał zbiornik zapory Hadita w połowie lat osiemdziesiątych; stary minaret rozcięto na części i odbudowano w nowym mieście nad jeziorem; w 2006 r. wysadzono go w powietrze, po odbudowie w 2016 r. ponownie zniszczyło go Państwo Islamskie, a od tego czasu został odtworzony."
  it:
    - "Ena è nota solo dal discorso dell’ufficiale di Sennacherib sotto le mura di Gerusalemme nel 701 a.C. e dai suoi echi. Il Rabsache chiese al popolo sulle mura: «Dove sono gli dèi di Hamath e d’Arpad? Dove sono gli dèi di Sefarvaim, di Hena e d’Ivva? Hanno essi liberata Samaria dalla mia mano?», e la lettera che Ezechia stese davanti al Signore ripeteva l’elenco: «Dov’è il re di Hamath, il re d’Arpad, e il re della città di Sefarvaim, di Hena e d’Ivva?» Isaia riporta le stesse parole. Ena era dunque una città con un proprio re e propri dèi che l’Assiria aveva già schiacciato, citata come monito. Il discorso parallelo di Isaia 36 omette Ena e Ivva."
    - "I più identificano Ena con Ana, l’antica Anat o Hanat, una città su un’isola e sulle rive del medio Eufrate nel paese di Suhu, dove gli eserciti assiri fecero campagna dal IX secolo a.C. in poi, e le iscrizioni dei suoi governatori nell’VIII secolo mostrano un piccolo Stato proprio sul fiume fra Assiria e Babilonia. L’ordine dell’elenco, che altrimenti si muove attraverso la Siria, si accorda meno bene, e il secondo candidato sulla mappa è una città ignota nella regione attorno a Camat. Alcuni studiosi hanno sostenuto che Ena e Ivva non siano affatto luoghi ma nomi di dèi, o corruzioni di altre parole; la questione è aperta."
    - "Ana si trova oggi nella provincia irachena di Anbar. La sua città vecchia fu sommersa dal bacino della diga di Haditha a metà degli anni Ottanta; il suo antico minareto fu tagliato in sezioni e ricostruito nella nuova città sopra il lago; fu fatto saltare in aria nel 2006, distrutto di nuovo dallo Stato Islamico nel 2016 dopo essere stato ricostruito, e da allora è stato rifatto."
  nl:
    - "Hena is alleen bekend uit de toespraak van Sanheribs officier onder de muren van Jeruzalem in 701 v.Chr. en uit de echo’s ervan. De Rabsake vroeg het volk op de muur: “Waar zijn de goden van Hamath, en van Arpad? Waar zijn de goden van Sefarvaim, Hena en Ivva? Ja, hebben zij Samaria uit mijn hand gered?”, en de brief die Chizkia voor de HEER uitspreidde herhaalde de lijst: “Waar is de koning van Hamath, en de koning van Arpad, en de koning der stad Sefarvaim, Hena en Ivva?” Jesaja geeft dezelfde woorden. Hena was dus een stad met een eigen koning en goden die Assyrië al had verpletterd, aangehaald als waarschuwing. De parallelle toespraak in Jesaja 36 laat Hena en Ivva weg."
    - "De meesten houden Hena voor Ana, het oude Anat of Hanat, een stad op een eiland en aan de oevers van de middelste Eufraat in het land Suhu, waar Assyrische legers vanaf de 9e eeuw v.Chr. veldtochten voerden, en de opschriften van zijn bestuurders uit de 8e eeuw tonen een kleine eigen staat aan de rivier tussen Assyrië en Babylonië. De volgorde van de lijst, die zich verder door Syrië beweegt, past minder goed, en de tweede kandidaat op de kaart is een onbekende stad in het land rond Hamat. Sommige geleerden hebben gemeend dat Hena en Ivva geen plaatsen zijn maar namen van goden, of verbasteringen van andere woorden; de vraag is open."
    - "Ana ligt nu in de Iraakse provincie Anbar. De oude stad werd in het midden van de jaren tachtig overspoeld door het stuwmeer van de Haditha-dam; haar oude minaret werd in stukken gezaagd en herbouwd in de nieuwe stad boven het meer; zij werd in 2006 opgeblazen, na herbouw in 2016 opnieuw verwoest door Islamitische Staat en is sindsdien weer opgebouwd."
  cs:
    - "Hena je známa jen z řeči Senacheribova důstojníka pod hradbami Jeruzaléma roku 701 př. n. l. a z jejích ozvěn. Rab-šake se ptal lidu na hradbě: „Kdež jsou bohové Emat a Arfad? Kde jsou bohové Sefarvaim, Ana a Ava? Zdaliž jsou vysvobodili Samaří z ruky mé?“ a list, který Chizkijáš rozložil před Hospodinem, seznam opakoval: „Kde jest král Emat, a král Arfad, a král města Sefarvaim, Ana i Ava?“ Izajáš podává tatáž slova. Hena tedy byla město s vlastním králem a bohy, které Asýrie již rozdrtila, uváděné jako varování. Paralelní řeč v Izajášovi 36 Henu a Avu vynechává."
    - "Většina pokládá Henu za Aná, starověký Anat nebo Chanat, město na ostrově a březích středního Eufratu v zemi Suchu, kde asyrská vojska tažila od 9. stol. př. n. l., a nápisy jeho správců v 8. století ukazují malý vlastní stát na řece mezi Asýrií a Babylonií. Pořadí seznamu, který jinak prochází Sýrií, odpovídá hůře a druhým kandidátem na mapě je neznámé město v kraji kolem Chamatu. Někteří učenci tvrdili, že Hena a Ava nejsou vůbec místa, nýbrž jména bohů nebo zkomoleniny jiných slov; otázka je otevřená."
    - "Aná stojí dnes v irácké provincii Anbár. Jeho staré město bylo zatopeno nádrží přehrady Hadítha v polovině 80. let 20. století; jeho starý minaret byl rozřezán na části a znovu postaven v novém městě nad jezerem; roku 2006 byl vyhozen do povětří, po obnově jej roku 2016 znovu zničil Islámský stát a od té doby byl opět postaven."
  sv:
    - "Hena är känt bara från tal av Sanheribs ombud under Jerusalems murar år 701 f.Kr. och dess ekon. Rab-Shake frågade folket på muren: ”Var äro Hamats och Arpads gudar? Var äro Sefarvaims, Henas och Ivas gudar? Eller hava de räddat Samaria ur min hand?”, och brevet som Hiskia bredde ut inför HERREN upprepade förteckningen: ”Var är Hamats konung och Arpads konung och konungen över Sefarvaims stad, över Hena och Iva?” Jesaja återger samma ord. Hena var alltså en stad med egen kung och egna gudar som Assyrien redan krossat, anförd som en varning. Parallelltalet i Jesaja 36 utelämnar Hena och Iva."
    - "De flesta tar Hena för Ana, forntidens Anat eller Hanat, en stad på en ö och vid stränderna av mellersta Eufrat i landet Suhu, där assyriska arméer drog fram från 800-talet f.Kr., och dess guvernörers inskrifter på 700-talet visar en liten egen stat vid floden mellan Assyrien och Babylonien. Förteckningens ordning, som i övrigt rör sig genom Syrien, passar sämre, och den andra kandidaten på kartan är en okänd stad i trakten kring Hamat. Några forskare har menat att Hena och Iva inte alls är platser utan namn på gudar, eller förvanskningar av andra ord; frågan är öppen."
    - "Ana ligger i dag i Iraks provins Anbar. Dess gamla stad dränktes av Haditha-dammens reservoar i mitten av 1980-talet; dess gamla minaret sågades i delar och återuppbyggdes i den nya staden ovanför sjön; den sprängdes 2006, förstördes åter av Islamiska staten 2016 efter att ha byggts upp, och har sedan återuppförts."
