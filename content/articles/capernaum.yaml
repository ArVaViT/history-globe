body:
  en:
    - "Capernaum lay on the northern shore of the Sea of Galilee, west of where the Jordan enters the lake, at the site now called Tell Hum. Excavations show that the fishing village was founded in the Hasmonean period, in the second century BC. It stretched along the shore, its houses built of black basalt around shared courtyards, and it lived from fishing, farming and the road that passed nearby. Josephus mentions a village Kepharnokon, usually taken to be Capernaum, and a spring called by its name."
    - "In the Gospels Capernaum is the base of Jesus' ministry in Galilee, called his own city. He taught in its synagogue, healed the mother-in-law of Simon Peter, a paralysed man let down through a roof and the servant of a centurion who, Luke says, had built the synagogue. He called Levi from the tax office there, and later reproached the town for not repenting."
    - "Franciscan excavations led by Virgilio Corbo and Stanislao Loffreda from 1968, and Greek Orthodox excavations under Vassilios Tzaferis on the eastern part of the site, uncovered the village. Beneath the later synagogue lie basalt foundations that may belong to a first-century synagogue. Nearby, one room of a first-century house was plastered and became a meeting place; Christian graffiti were scratched on its walls, and it was long venerated as the house of Peter."
    - "In the fourth century the room lay at the heart of an enclosed house church, and a pilgrim's account of the 380s, preserved by Peter the Deacon and usually ascribed to Egeria, tells of the house of the apostle made into a church and of a synagogue of dressed stone reached by many steps. Epiphanius says that Joseph of Tiberias had leave from Constantine to build churches in Capernaum and other Jewish towns. In the mid-fifth century an octagonal church replaced the house church. The white limestone synagogue nearby is dated by coins beneath its floor to the late fourth or fifth century, though an earlier date has also been argued."
  ru:
    - "Капернаум лежал на северном берегу моря Галилейского, к западу от впадения Иордана в озеро, на месте, которое ныне называется Телль-Хум. Раскопки показывают, что рыбацкое селение возникло в хасмонейский период, во II в. до н. э. Оно тянулось вдоль берега; дома из чёрного базальта стояли вокруг общих дворов, а жили здесь рыбной ловлей, земледелием и проходившей рядом дорогой. Иосиф Флавий упоминает селение Кефарнокон, которое обычно отождествляют с Капернаумом, и источник, называвшийся его именем."
    - "В Евангелиях Капернаум — средоточие служения Иисуса в Галилее, Его город. Он учил в здешней синагоге, исцелил тёщу Симона Петра, расслабленного, которого спустили через кровлю, и слугу сотника, который, по словам Луки, построил синагогу. Там Он призвал Левия от сбора пошлин, а позже укорял город за то, что тот не покаялся."
    - "Раскопки францисканцев под руководством Вирджилио Корбо и Станислао Лоффреды с 1968 г. и греческой православной экспедиции Василиоса Цафериса в восточной части селения открыли древнюю деревню. Под поздней синагогой лежат базальтовые основания, которые, возможно, принадлежат синагоге I века. Рядом одну комнату дома I века оштукатурили и стали в ней собираться; на её стенах процарапаны христианские надписи, и её издавна почитали как дом Петра."
    - "В IV веке эта комната стала средоточием огороженной домовой церкви, а рассказ паломницы 380-х годов, сохранённый Петром Диаконом и обычно приписываемый Эгерии, говорит о доме апостола, обращённом в церковь, и о синагоге из тёсаного камня, к которой вели многие ступени. Епифаний пишет, что Иосиф Тивериадский получил от Константина позволение строить церкви в Капернауме и других иудейских городах. В середине V века на месте домовой церкви построили восьмиугольный храм. Белую известняковую синагогу рядом по монетам под её полом относят к концу IV или к V веку, хотя предлагалась и более ранняя дата."
  uk:
    - "Капернаум лежав на північному березі Галілейського моря, на захід від місця, де Йордан упадає в озеро, на місці, що нині зветься Телль-Хум. Розкопки показують, що рибальське село було засноване в хасмонейський період, у II ст. до н. е. Воно простягалося вздовж берега, його будинки були збудовані з чорного базальту навколо спільних дворів, і жило воно з риболовлі, землеробства та дороги, що пролягала поруч. Йосиф Флавій згадує село Кефарнокон, яке зазвичай вважають Капернаумом, і джерело, назване його ім'ям."
    - "В Євангеліях Капернаум — осередок служіння Ісуса в Галілеї, названий Його власним містом. Він навчав у його синагозі, зцілив тещу Симона Петра, розслабленого, спущеного крізь дах, і слугу сотника, який, за словами Луки, збудував синагогу. Звідти Він покликав Левія з митниці, а згодом докорив місту за те, що воно не покаялося."
    - "Францисканські розкопки під керівництвом Вірджіліо Корбо та Станіслао Лоффреди від 1968 р. і грецькі православні розкопки під керівництвом Василіоса Цаферіса на східній частині місця відкрили село. Під пізнішою синагогою лежать базальтові підвалини, які можуть належати синагозі I ст. Поблизу одну кімнату будинку I ст. було оштукатурено, і вона стала місцем зібрань; на її стінах видряпано християнські графіті, і її довго вшановували як дім Петра."
    - "У IV ст. кімната лежала в серці обгородженої домової церкви, і оповідь прочанки 380-х рр., збережена Петром Дияконом і зазвичай приписувана Егерії, розповідає про дім апостола, обернений на церкву, і про синагогу з тесаного каменя, до якої веде багато сходів. Епіфаній каже, що Йосип Тіверіадський мав дозвіл Константина будувати церкви в Капернаумі та інших юдейських містах. У середині V ст. восьмикутна церква замінила домову церкву. Білу вапнякову синагогу поблизу монети під її підлогою датують кінцем IV або V ст., хоча стверджували й ранішу дату."
  es:
    - "Cafarnaúm se hallaba en la orilla norte del mar de Galilea, al oeste de donde el Jordán entra en el lago, en el sitio llamado hoy Tell Hum. Las excavaciones muestran que la aldea de pescadores fue fundada en el periodo asmoneo, en el siglo II a. C. Se extendía a lo largo de la orilla, con sus casas construidas de basalto negro en torno a patios comunes, y vivía de la pesca, la agricultura y el camino que pasaba cerca. Josefo menciona una aldea Kefarnokon, que suele identificarse con Cafarnaúm, y una fuente que lleva su nombre."
    - "En los Evangelios, Cafarnaúm es la base del ministerio de Jesús en Galilea, llamada su propia ciudad. Enseñó en su sinagoga, sanó a la suegra de Simón Pedro, a un paralítico bajado por un tejado y al siervo de un centurión que, según Lucas, había edificado la sinagoga. Allí llamó a Leví desde el puesto de impuestos, y más tarde reprochó a la ciudad que no se arrepintiera."
    - "Las excavaciones franciscanas dirigidas por Virgilio Corbo y Stanislao Loffreda desde 1968, y las greco-ortodoxas bajo Vassilios Tzaferis en la parte oriental del sitio, sacaron a la luz la aldea. Bajo la sinagoga posterior hay cimientos de basalto que pueden pertenecer a una sinagoga del siglo I. Cerca, una habitación de una casa del siglo I fue enlucida y se convirtió en lugar de reunión; en sus paredes se rasparon grafitos cristianos, y fue venerada largo tiempo como la casa de Pedro."
    - "En el siglo IV la habitación quedó en el centro de una iglesia doméstica cercada, y el relato de un peregrino de la década del 380, conservado por Pedro Diácono y atribuido habitualmente a Egeria, habla de la casa del apóstol convertida en iglesia y de una sinagoga de piedra labrada a la que se llegaba por muchos escalones. Epifanio dice que José de Tiberias obtuvo de Constantino permiso para construir iglesias en Cafarnaúm y otras ciudades judías. A mediados del siglo V una iglesia octogonal sustituyó a la iglesia doméstica. La sinagoga de piedra caliza blanca situada cerca se fecha, por monedas halladas bajo su suelo, a finales del siglo IV o en el V, aunque también se ha defendido una fecha anterior."
  pt:
    - "Cafarnaum ficava na margem norte do Mar da Galileia, a oeste do ponto em que o Jordão entra no lago, no local hoje chamado Tell Hum. As escavações mostram que a aldeia de pescadores foi fundada no período hasmoneu, no século II a.C. Estendia-se ao longo da margem, com casas de basalto negro em torno de pátios comuns, e vivia da pesca, da agricultura e da estrada que passava perto. Josefo menciona uma aldeia Kepharnokon, geralmente tida como Cafarnaum, e uma fonte chamada com o seu nome."
    - "Nos Evangelhos, Cafarnaum é a base do ministério de Jesus na Galileia, chamada a sua própria cidade. Ele ensinou em sua sinagoga e curou a sogra de Simão Pedro, um paralítico descido por um telhado e o servo de um centurião que, diz Lucas, havia construído a sinagoga. Chamou ali Levi da coletoria e depois repreendeu a cidade por não se arrepender."
    - "As escavações franciscanas dirigidas por Virgilio Corbo e Stanislao Loffreda a partir de 1968, e as gregas ortodoxas sob Vassilios Tzaferis na parte leste do local, trouxeram à luz a aldeia. Sob a sinagoga posterior há fundações de basalto que podem pertencer a uma sinagoga do século I. Perto dali, um cômodo de uma casa do século I foi rebocado e tornou-se lugar de reunião; grafites cristãos foram riscados em suas paredes, e ele foi por muito tempo venerado como a casa de Pedro."
    - "No século IV, o cômodo ficava no centro de uma igreja doméstica cercada por muros, e o relato de um peregrino da década de 380, conservado por Pedro Diácono e geralmente atribuído a Egéria, fala da casa do apóstolo transformada em igreja e de uma sinagoga de pedra lavrada a que se chegava por muitos degraus. Epifânio diz que José de Tiberíades teve licença de Constantino para construir igrejas em Cafarnaum e em outras cidades judaicas. Em meados do século V, uma igreja octogonal substituiu a igreja doméstica. A sinagoga de calcário branco ali perto é datada, por moedas sob o piso, do fim do século IV ou do V, embora também se tenha defendido uma data anterior."
  de:
    - "Kapernaum lag am Nordufer des Sees Genezareth, westlich der Stelle, an der der Jordan in den See mündet, an dem Ort, der heute Tell Hum heißt. Ausgrabungen zeigen, dass das Fischerdorf in hasmonäischer Zeit im 2. Jahrhundert v. Chr. gegründet wurde. Es erstreckte sich am Ufer entlang, seine Häuser aus schwarzem Basalt waren um gemeinsame Höfe gebaut, und es lebte vom Fischfang, von der Landwirtschaft und von der Straße, die in der Nähe vorbeiführte. Josephus erwähnt ein Dorf Kepharnokon, das gewöhnlich für Kapernaum gehalten wird, und eine nach ihm benannte Quelle."
    - "In den Evangelien ist Kapernaum der Ausgangspunkt des Wirkens Jesu in Galiläa, seine eigene Stadt genannt. Er lehrte in seiner Synagoge, heilte die Schwiegermutter des Simon Petrus, einen durch ein Dach herabgelassenen Gelähmten und den Knecht eines Hauptmanns, der, wie Lukas sagt, die Synagoge gebaut hatte. Er rief Levi dort vom Zoll und tadelte die Stadt später, weil sie nicht Buße tat."
    - "Franziskanische Ausgrabungen unter Virgilio Corbo und Stanislao Loffreda ab 1968 sowie griechisch-orthodoxe Ausgrabungen unter Vassilios Tzaferis im östlichen Teil des Ortes legten das Dorf frei. Unter der späteren Synagoge liegen Basaltfundamente, die zu einer Synagoge des 1. Jahrhunderts gehören könnten. In der Nähe wurde ein Raum eines Hauses aus dem 1. Jahrhundert verputzt und wurde zu einem Versammlungsort; an seinen Wänden wurden christliche Graffiti eingeritzt, und er wurde lange als das Haus des Petrus verehrt."
    - "Im 4. Jahrhundert lag der Raum im Zentrum einer umschlossenen Hauskirche, und ein Pilgerbericht aus den 380er Jahren, von Petrus Diaconus überliefert und gewöhnlich Egeria zugeschrieben, erzählt von dem zur Kirche gemachten Haus des Apostels und von einer Synagoge aus behauenem Stein, die man über viele Stufen erreichte. Epiphanius sagt, Joseph von Tiberias habe von Konstantin die Erlaubnis gehabt, in Kapernaum und anderen jüdischen Städten Kirchen zu bauen. Mitte des 5. Jahrhunderts ersetzte eine achteckige Kirche die Hauskirche. Die nahe gelegene Synagoge aus weißem Kalkstein wird durch Münzen unter ihrem Boden in das späte 4. oder 5. Jahrhundert datiert, doch wurde auch eine frühere Datierung vertreten."
  fr:
    - "Capernaüm se trouvait sur la rive nord de la Mer de Galilée, à l’ouest de l’endroit où le Jourdain entre dans le lac, sur le site appelé aujourd’hui Tell Hum. Les fouilles montrent que le village de pêcheurs fut fondé à l’époque hasmonéenne, au IIe siècle av. J.-C. Il s’étendait le long du rivage, ses maisons de basalte noir bâties autour de cours communes, et vivait de la pêche, de l’agriculture et de la route qui passait à proximité. Josèphe mentionne un village Képharnokon, généralement tenu pour Capernaüm, et une source portant son nom."
    - "Dans les Évangiles, Capernaüm est la base du ministère de Jésus en Galilée, appelée sa propre ville. Il enseigna dans sa synagogue, guérit la belle-mère de Simon Pierre, un paralytique descendu par un toit et le serviteur d’un centurion qui, dit Luc, avait bâti la synagogue. Il y appela Lévi à son bureau de péage, et reprocha plus tard à la ville de ne pas s’être repentie."
    - "Les fouilles franciscaines dirigées par Virgilio Corbo et Stanislao Loffreda à partir de 1968, et les fouilles grecques orthodoxes de Vassilios Tzaferis sur la partie orientale du site, ont mis au jour le village. Sous la synagogue plus tardive se trouvent des fondations de basalte qui pourraient appartenir à une synagogue du Ier siècle. Tout près, une pièce d’une maison du Ier siècle fut enduite de plâtre et devint un lieu de réunion ; des graffitis chrétiens furent gravés sur ses murs, et elle fut longtemps vénérée comme la maison de Pierre."
    - "Au IVe siècle, la pièce se trouvait au cœur d’une église-maison close, et un récit de pèlerin des années 380, conservé par Pierre Diacre et généralement attribué à Égérie, parle de la maison de l’apôtre transformée en église et d’une synagogue de pierre taillée à laquelle on accédait par de nombreuses marches. Épiphane dit que Joseph de Tibériade avait reçu de Constantin la permission de bâtir des églises à Capernaüm et dans d’autres villes juives. Au milieu du Ve siècle, une église octogonale remplaça l’église-maison. La synagogue de calcaire blanc voisine est datée, par des pièces de monnaie sous son sol, de la fin du IVe ou du Ve siècle, bien qu’une date plus ancienne ait aussi été défendue."
  it:
    - "Cafarnao sorgeva sulla riva settentrionale del Lago di Tiberiade, a ovest del punto in cui il Giordano vi entra, nel sito oggi chiamato Tell Hum. Gli scavi mostrano che il villaggio di pescatori fu fondato in età asmonea, nel II secolo a.C. Si stendeva lungo la riva, con case di basalto nero attorno a cortili comuni, e viveva di pesca, agricoltura e della strada che passava vicino. Giuseppe Flavio menziona un villaggio Kepharnokon, di solito identificato con Cafarnao, e una sorgente che ne porta il nome."
    - "Nei Vangeli Cafarnao è la base del ministero di Gesù in Galilea, detta la sua città. Egli insegnò nella sua sinagoga, guarì la suocera di Simon Pietro, un paralitico calato attraverso un tetto e il servo di un centurione che, dice Luca, aveva edificato la sinagoga. Là chiamò Levi dal banco delle imposte, e più tardi rimproverò la città per non essersi ravveduta."
    - "Gli scavi francescani diretti da Virgilio Corbo e Stanislao Loffreda dal 1968, e quelli greco-ortodossi sotto Vassilios Tzaferis nella parte orientale del sito, hanno portato alla luce il villaggio. Sotto la sinagoga più tarda si trovano fondamenta di basalto che possono appartenere a una sinagoga del I secolo. Nelle vicinanze, una stanza di una casa del I secolo fu intonacata e divenne luogo di riunione; sulle sue pareti furono graffiti segni cristiani, e fu a lungo venerata come la casa di Pietro."
    - "Nel IV secolo la stanza stava al centro di una chiesa domestica recintata, e il resoconto di un pellegrino degli anni 380, conservato da Pietro Diacono e di solito attribuito a Egeria, parla della casa dell’apostolo trasformata in chiesa e di una sinagoga di pietra squadrata cui si accedeva per molti gradini. Epifanio dice che Giuseppe di Tiberiade ebbe da Costantino il permesso di costruire chiese a Cafarnao e in altre città ebraiche. A metà del V secolo una chiesa ottagonale sostituì la chiesa domestica. La vicina sinagoga di calcare bianco è datata dalle monete sotto il pavimento alla fine del IV o al V secolo, benché si sia sostenuta anche una data più antica."
  pl:
    - "Kafarnaum leżało na północnym brzegu Jeziora Galilejskiego, na zachód od miejsca, gdzie Jordan wpada do jeziora, w miejscu zwanym dziś Tell Chum. Wykopaliska pokazują, że wieś rybacka powstała w okresie hasmonejskim, w II w. p.n.e. Ciągnęła się wzdłuż brzegu, jej domy z czarnego bazaltu otaczały wspólne dziedzińce, a żyła z rybołówstwa, rolnictwa i drogi przebiegającej w pobliżu. Józef Flawiusz wspomina wieś Kefarnokon, zwykle utożsamianą z Kafarnaum, oraz źródło noszące jej nazwę."
    - "W Ewangeliach Kafarnaum jest ośrodkiem działalności Jezusa w Galilei, nazwanym jego własnym miastem. Nauczał w jego synagodze, uzdrowił teściową Szymona Piotra, paralityka spuszczonego przez dach i sługę setnika, który, jak mówi Łukasz, wybudował synagogę. Powołał stamtąd Lewiego z komory celnej, a później wyrzucał miastu, że się nie nawróciło."
    - "Wykopaliska franciszkańskie prowadzone od 1968 r. pod kierunkiem Virgilia Corbo i Stanislao Loffredy oraz wykopaliska greckoprawosławne pod kierunkiem Vassiliosa Tzaferisa we wschodniej części stanowiska odsłoniły wieś. Pod późniejszą synagogą leżą bazaltowe fundamenty, które mogą należeć do synagogi z I w. W pobliżu jedno pomieszczenie domu z I w. otynkowano i stało się miejscem spotkań; na jego ścianach wydrapano chrześcijańskie graffiti, a przez długi czas czczono je jako dom Piotra."
    - "W IV w. pomieszczenie leżało w sercu ogrodzonego kościoła domowego, a relacja pielgrzyma z lat osiemdziesiątych IV w., zachowana przez Piotra Diakona i zwykle przypisywana Egerii, opowiada o domu apostoła przekształconym w kościół oraz o synagodze z ciosanego kamienia, do której prowadzi wiele stopni. Epifaniusz mówi, że Józef z Tyberiady miał od Konstantyna pozwolenie na budowę kościołów w Kafarnaum i innych żydowskich miastach. W połowie V w. ośmioboczny kościół zastąpił kościół domowy. Pobliską synagogę z białego wapienia datuje się na podstawie monet pod jej posadzką na późny IV lub V w., choć dowodzono też datowania wcześniejszego."
  nl:
    - "Kafarnaüm lag aan de noordoever van het Meer van Galilea, ten westen van de plaats waar de Jordaan het meer instroomt, op de plek die nu Tell Hum heet. Opgravingen tonen dat het vissersdorp in de Hasmonese tijd werd gesticht, in de 2e eeuw v.Chr. Het strekte zich uit langs de oever, met huizen van zwarte basalt rond gedeelde binnenplaatsen, en leefde van visserij, landbouw en de weg die er vlakbij liep. Flavius Josephus noemt een dorp Kepharnokon, gewoonlijk opgevat als Kafarnaüm, en een bron die naar het dorp is genoemd."
    - "In de evangeliën is Kafarnaüm de uitvalsbasis van Jezus' optreden in Galilea, zijn eigen stad genoemd. Hij onderwees in de synagoge, genas de schoonmoeder van Simon Petrus, een verlamde die door een dak werd neergelaten en de knecht van een hoofdman die, volgens Lukas, de synagoge had gebouwd. Hij riep Levi van het tolhuis aldaar, en verweet de stad later dat zij zich niet bekeerde."
    - "Franciscaanse opgravingen onder leiding van Virgilio Corbo en Stanislao Loffreda vanaf 1968, en Grieks-orthodoxe opgravingen onder Vassilios Tzaferis in het oostelijke deel van de plaats, legden het dorp bloot. Onder de latere synagoge liggen basalten fundamenten die mogelijk bij een synagoge uit de eerste eeuw horen. Vlakbij werd een kamer van een huis uit de eerste eeuw gepleisterd en werd een ontmoetingsplaats; christelijke graffiti werden in de wanden gekrast, en het werd lang vereerd als het huis van Petrus."
    - "In de 4e eeuw lag de kamer in het hart van een ommuurd huiskerkje, en een pelgrimsverslag uit de jaren 380, bewaard door Petrus de Diaken en gewoonlijk toegeschreven aan Egeria, vertelt van het huis van de apostel dat tot kerk was gemaakt en van een synagoge van gehouwen steen waartoe vele trappen leidden. Epiphanius zegt dat Jozef van Tiberias van Constantijn verlof had om kerken te bouwen in Kafarnaüm en andere Joodse steden. Halverwege de vijfde eeuw verving een achthoekige kerk het huiskerkje. De witte kalkstenen synagoge ernaast wordt door munten onder de vloer gedateerd in de late vierde of de vijfde eeuw, al is ook een vroegere datering verdedigd."
  cs:
    - "Kafarnaum leželo na severním břehu Galilejského jezera, západně od místa, kde do jezera vtéká Jordán, na místě dnes zvaném Tell Hum. Vykopávky ukazují, že rybářská vesnice vznikla v hasmonejském období, ve 2. století př. n. l. Táhla se podél břehu, její domy z černého čediče stály kolem společných nádvoří a živila se rybolovem, zemědělstvím a cestou, která vedla poblíž. Josephus zmiňuje vesnici Kepharnokon, kterou lze obvykle ztotožnit s Kafarnaum, a pramen nesoucí její jméno."
    - "V evangeliích je Kafarnaum základnou Ježíšova působení v Galileji, nazvané jeho vlastním městem. Učil v jeho synagoze, uzdravil tchyni Šimona Petra, ochrnutého spuštěného střechou a služebníka setníka, který podle Lukáše synagogu vystavěl. Povolal tam Leviho od celnice a později městu vyčítal, že nečinilo pokání."
    - "Františkánské vykopávky vedené od roku 1968 Virgiliem Corbem a Stanislaem Loffredou a řeckoortodoxní vykopávky pod Vassiliem Tzaferisem na východní části lokality odkryly vesnici. Pod pozdější synagogou leží čedičové základy, které mohou patřit synagoze z 1. století. Poblíž byla jedna místnost domu z 1. století omítnuta a stala se shromaždištěm; do jejích stěn byly vyškrábány křesťanské nápisy a dlouho byla uctívána jako dům Petrův."
    - "Ve 4. století ležela místnost uprostřed ohrazeného domácího kostela a poutnický zápis z 80. let 4. století, zachovaný Petrem Jáhnem a obvykle připisovaný Egerii, vypráví o domě apoštola přeměněném v kostel a o synagoze z tesaného kamene, k níž vede mnoho stupňů. Epifanios uvádí, že Josef z Tiberiady měl od Konstantina svolení stavět kostely v Kafarnaum a dalších židovských městech. V polovině 5. století nahradil domácí kostel osmiboký kostel. Bílá vápencová synagoga poblíž je mincemi pod její podlahou datována do pozdního 4. nebo 5. století, ač byl hájen i dřívější datum."
  sv:
    - "Kafarnaum låg vid Galileiska sjöns norra strand, väster om där Jordan rinner in i sjön, på platsen som nu kallas Tell Hum. Utgrävningar visar att fiskebyn grundades under den hasmoneiska tiden, på 100-talet f.Kr. Den sträckte sig längs stranden, med hus av svart basalt kring gemensamma gårdar, och levde av fiske, jordbruk och vägen som gick förbi i närheten. Josefus nämner en by Kepharnokon, vanligen ansedd som Kafarnaum, och en källa som bär dess namn."
    - "I evangelierna är Kafarnaum basen för Jesu verksamhet i Galileen, kallad hans egen stad. Han undervisade i dess synagoga och botade Simon Petrus svärmor, en lam man som firades ner genom ett tak och tjänaren till en centurion som, säger Lukas, hade byggt synagogan. Han kallade Levi från tullhuset där och förebrådde senare staden att den inte gjorde bättring."
    - "Franciskanska utgrävningar under Virgilio Corbo och Stanislao Loffreda från 1968, och grekisk-ortodoxa utgrävningar under Vassilios Tzaferis på platsens östra del, blottade byn. Under den senare synagogan ligger basaltgrunder som kan tillhöra en synagoga från första århundradet. I närheten putsades ett rum i ett hus från första århundradet och blev en samlingsplats; kristna graffiti ristades in på dess väggar, och det vördades länge som Petrus hus."
    - "På 300-talet låg rummet i hjärtat av en inhägnad huskyrka, och en pilgrims berättelse från 380-talet, bevarad av Petrus Diaconus och vanligen tillskriven Egeria, berättar om apostelns hus som gjorts till kyrka och om en synagoga av huggen sten som nås över många trappsteg. Epifanios säger att Josef av Tiberias hade Konstantins tillstånd att bygga kyrkor i Kafarnaum och andra judiska städer. Vid mitten av 400-talet ersatte en åttkantig kyrka huskyrkan. Den vita kalkstenssynagogan i närheten dateras genom mynt under golvet till slutet av 300-talet eller 400-talet, även om en tidigare datering också har hävdats."
  nb:
    - "Kapernaum lå på nordstranden av Galileasjøen, vest for der Jordan renner inn i sjøen, på stedet som nå kalles Tell Hum. Utgravninger viser at fiskerlandsbyen ble grunnlagt i den hasmoneiske perioden, på 100-tallet f.Kr. Den strakte seg langs stranden, med hus bygd av svart basalt rundt felles gårdsrom, og den levde av fiske, jordbruk og veien som gikk i nærheten. Josefus nevner en landsby Kepharnokon, vanligvis regnet for å være Kapernaum, og en kilde som bærer dens navn."
    - "I evangeliene er Kapernaum basen for Jesu virke i Galilea, kalt hans egen by. Han underviste i synagogen der, helbredet Simon Peters svigermor, en verkbrudden mann som ble firt ned gjennom et tak, og tjeneren til en høvedsmann som, sier Lukas, hadde bygd synagogen. Han kalte Levi fra tollboden der, og refset senere byen for ikke å omvende seg."
    - "Franciskanske utgravninger ledet av Virgilio Corbo og Stanislao Loffreda fra 1968, og gresk-ortodokse utgravninger under Vassilios Tzaferis på den østlige delen av stedet, avdekket landsbyen. Under den senere synagogen ligger basaltfundamenter som kan høre til en synagoge fra det første århundre. I nærheten ble ett rom i et hus fra det første århundre pusset og ble et møtested; kristne graffiti ble risset inn på veggene, og det ble lenge æret som Peters hus."
    - "På 300-tallet lå rommet i hjertet av en innhegnet huskirke, og en pilegrimsberetning fra 380-årene, bevart av Peter Diakonen og vanligvis tilskrevet Egeria, forteller om apostelens hus som ble gjort til kirke og om en synagoge av tilhugget stein som nås med mange trapper. Epifanios sier at Josef av Tiberias hadde tillatelse av Konstantin til å bygge kirker i Kapernaum og andre jødiske byer. Midt på 400-tallet erstattet en åttekantet kirke huskirken. Den hvite kalksteinssynagogen i nærheten dateres av mynter under gulvet til slutten av 300-tallet eller 400-tallet, selv om en tidligere datering også er blitt hevdet."
  tl:
    - "Ang Capernaum ay nasa hilagang baybayin ng Dagat ng Galilea, sa kanluran ng pasukan ng Jordan sa lawa, sa pook na tinatawag ngayong Tell Hum. Ipinakikita ng mga paghuhukay na itinatag ang nayong mangingisda noong panahong Hasmoneo, noong ika-2 siglo BK. Humaba ito sa baybayin, ang mga bahay nito ay yari sa itim na basalto sa palibot ng magkakasamang bakuran, at namuhay ito sa pangingisda, pagsasaka at sa daang dumaraan sa malapit. Binabanggit ni Josefo ang isang nayong Kepharnokon, na karaniwang itinuturing na Capernaum, at isang bukal na tinawag sa pangalan nito."
    - "Sa mga Ebanghelyo, ang Capernaum ang batayan ng ministeryo ni Jesus sa Galilea, na tinawag na kaniyang sariling lungsod. Nagturo siya sa sinagoga nito, nagpagaling ng biyenan ni Simon Pedro, ng isang paralitikong ibinaba sa bubungan, at ng alipin ng isang senturyon na, ayon kay Lucas, ang nagtayo ng sinagoga. Tinawag niya roon si Levi mula sa tanggapan ng buwis, at pinagsabihan niya nang maglaon ang bayan dahil hindi nagsisi."
    - "Ang mga paghuhukay ng mga Pransiskano na pinamunuan nina Virgilio Corbo at Stanislao Loffreda mula 1968, at ng mga Griyegong Ortodokso sa ilalim ni Vassilios Tzaferis sa silangang bahagi ng pook, ay nakatuklas ng nayon. Sa ilalim ng huling sinagoga ay may mga pundasyong basalto na maaaring kabilang sa sinagoga noong ika-1 siglo. Sa malapit, ang isang silid ng bahay noong ika-1 siglo ay pinlasteran at naging pook ng pagtitipon; nakaguhit sa mga pader nito ang mga graffiti ng mga Kristiyano, at matagal itong iginalang bilang bahay ni Pedro."
    - "Noong ika-4 na siglo, ang silid ay nasa gitna ng nakukulong na simbahang-bahay, at isinasalaysay ng salaysay ng isang peregrino noong dekada 380, na iningatan ni Pedro Diakono at karaniwang iniuugnay kay Egeria, ang bahay ng apostol na ginawang simbahan at isang sinagoga ng tinabas na bato na may maraming hagdan. Sinasabi ni Epifanio na pinahintulutan ni Constantino si Jose ng Tiberias na magtayo ng mga simbahan sa Capernaum at iba pang bayang Judio. Noong kalagitnaan ng ika-5 siglo, pinalitan ng walong-panig na simbahan ang simbahang-bahay. Ang puting sinagogang apog sa malapit ay ipinepetsa ng mga baryang nasa ilalim ng sahig nito sa huling ika-4 o ika-5 siglo, bagaman may nangatwiran din ng mas maagang petsa."
  da:
    - "Kapernaum lå på nordkysten af Genesaret Sø, vest for hvor Jordan løber ud i søen, på det sted, der nu hedder Tell Hum. Udgravninger viser, at fiskerlandsbyen blev grundlagt i den hasmonæiske tid, i 100-tallet f.Kr. Den strakte sig langs kysten, med huse bygget af sort basalt omkring fælles gårdspladser, og levede af fiskeri, landbrug og vejen, der løb forbi i nærheden. Josefus nævner en landsby Kepharnokon, sædvanligvis anset for Kapernaum, og en kilde opkaldt efter den."
    - "I evangelierne er Kapernaum basen for Jesu virke i Galilæa, kaldet hans egen by. Han underviste i dens synagoge, helbredte Simon Peters svigermor, en lam mand, der blev firet ned gennem et tag, og tjeneren hos en høvedsmand, som ifølge Lukas havde bygget synagogen. Han kaldte Levi fra toldboden dér og bebrejdede senere byen, at den ikke omvendte sig."
    - "Franciskanske udgravninger under ledelse af Virgilio Corbo og Stanislao Loffreda fra 1968 og græsk-ortodokse udgravninger under Vassilios Tzaferis på stedets østlige del afdækkede landsbyen. Under den senere synagoge ligger basaltfundamenter, der kan høre til en synagoge fra 1. århundrede. I nærheden blev ét rum i et hus fra 1. århundrede pudset og blev et mødested; kristne graffiti blev ridset ind på dets vægge, og det blev længe æret som Peters hus."
    - "I 300-tallet lå rummet i hjertet af en indhegnet huskirke, og en pilgrimsberetning fra 380'erne, bevaret hos Peter Diakonen og sædvanligvis tilskrevet Egeria, fortæller om apostlens hus, der blev gjort til en kirke, og om en synagoge af tilhugget sten, som man nåede ad mange trin. Epifanios siger, at Josef af Tiberias havde tilladelse fra Konstantin til at bygge kirker i Kapernaum og andre jødiske byer. I midten af 400-tallet afløste en ottekantet kirke huskirken. Den hvide kalkstenssynagoge i nærheden dateres af mønter under gulvet til slutningen af 300-tallet eller 400-tallet, selv om en tidligere datering også er blevet hævdet."
