# Overview article (ADR 0007). Mainstream facts only; disputed datings are named as such.
id: capernaum
place: af2161c
title:
  en: "Capernaum"
  ru: "Капернаум"
  uk: "Капернаум"
  es: "Cafarnaúm"
  pt: "Cafarnaum"
  de: "Kapernaum"
  fr: "Capernaüm"
body:
  en:
    - "Capernaum lay on the northern shore of the Sea of Galilee, west of where the Jordan enters the lake, at the site now called Tell Hum. Excavations show that the fishing village was founded in the Hasmonean period, in the second century BC. It stretched along the shore, its houses built of black basalt around shared courtyards, and it lived from fishing, farming and the road that passed nearby. Josephus mentions a village Kepharnokon, usually taken to be Capernaum, and a spring called by its name."
    - "In the Gospels Capernaum is the base of Jesus' ministry in Galilee, called his own city. He taught in its synagogue, healed the mother-in-law of Simon Peter, a paralysed man let down through a roof and the servant of a centurion who, Luke says, had built the synagogue. He called Levi from the tax office there, and later reproached the town for not repenting."
    - "Franciscan excavations led by Virgilio Corbo and Stanislao Loffreda from 1968, and Greek Orthodox excavations under Vassilios Tzaferis on the eastern part of the site, uncovered the village. Beneath the later synagogue lie basalt foundations that may belong to a first-century synagogue. Nearby, one room of a first-century house was plastered and became a meeting place; Christian graffiti were scratched on its walls, and it was long venerated as the house of Peter."
    - "In the fourth century the room lay at the heart of an enclosed house church, and a pilgrim's account of the 380s, preserved by Peter the Deacon and usually ascribed to Egeria, tells of the house of the apostle made into a church and of a synagogue of dressed stone reached by many steps. Epiphanius says that Joseph of Tiberias had leave from Constantine to build churches in Capernaum and other Jewish towns. In the mid-fifth century an octagonal church replaced the house church. The white limestone synagogue nearby is dated by coins beneath its floor to the late fourth or fifth century, though an earlier date has also been argued."
  ru:
    - "Капернаум лежал на северном берегу моря Галилейского, к западу от впадения Иордана в озеро, на месте, которое ныне называется Телль-Хум. Раскопки показывают, что рыбацкое селение возникло в хасмонейский период, во II в. до н. э. Оно тянулось вдоль берега; дома из чёрного базальта стояли вокруг общих дворов, а жили здесь рыбной ловлей, земледелием и проходившей рядом дорогой. Иосиф Флавий упоминает селение Кефарнокон, которое обычно отождествляют с Капернаумом, и источник, называвшийся его именем."
    - "В Евангелиях Капернаум — средоточие служения Иисуса в Галилее, Его город. Он учил в здешней синагоге, исцелил тёщу Симона Петра, расслабленного, которого спустили через кровлю, и слугу сотника, который, по словам Луки, построил синагогу. Там Он призвал Левия от сбора пошлин, а позже укорял город за то, что тот не покаялся."
    - "Раскопки францисканцев под руководством Вирджилио Корбо и Станислао Лоффреды с 1968 г. и греческой православной экспедиции Василиоса Цафериса в восточной части селения открыли древнюю деревню. Под поздней синагогой лежат базальтовые основания, которые, возможно, принадлежат синагоге I века. Рядом одну комнату дома I века оштукатурили и стали в ней собираться; на её стенах процарапаны христианские надписи, и её издавна почитали как дом Петра."
    - "В IV веке эта комната стала средоточием огороженной домовой церкви, а рассказ паломницы 380-х годов, сохранённый Петром Диаконом и обычно приписываемый Эгерии, говорит о доме апостола, обращённом в церковь, и о синагоге из тёсаного камня, к которой вели многие ступени. Епифаний пишет, что Иосиф Тивериадский получил от Константина позволение строить церкви в Капернауме и других иудейских городах. В середине V века на месте домовой церкви построили восьмиугольный храм. Белую известняковую синагогу рядом по монетам под её полом относят к концу IV или к V веку, хотя предлагалась и более ранняя дата."
  uk:
    - "Капернаум лежав на північному березі Галілейського моря, на захід від місця, де Йордан упадає в озеро, на місці, що нині зветься Телль-Хум. Розкопки показують, що рибальське село було засноване в хасмонейський період, у II ст. до н. е. Воно простягалося вздовж берега, його будинки були збудовані з чорного базальту навколо спільних дворів, і жило воно з риболовлі, землеробства та дороги, що пролягала поруч. Йосиф Флавій згадує село Кефарнокон, яке зазвичай вважають Капернаумом, і джерело, назване його ім'ям."
    - "В Євангеліях Капернаум — осередок служіння Ісуса в Галілеї, названий Його власним містом. Він навчав у його синагозі, зцілив тещу Симона Петра, розслабленого, спущеного крізь дах, і слугу сотника, який, за словами Луки, збудував синагогу. Звідти Він покликав Левія з митниці, а згодом докорив місту за те, що воно не покаялося."
    - "Францисканські розкопки під керівництвом Вірджіліо Корбо та Станіслао Лоффреди від 1968 р. і грецькі православні розкопки під керівництвом Василіоса Цаферіса на східній частині місця відкрили село. Під пізнішою синагогою лежать базальтові підвалини, які можуть належати синагозі I ст. Поблизу одну кімнату будинку I ст. було оштукатурено, і вона стала місцем зібрань; на її стінах видряпано християнські графіті, і її довго вшановували як дім Петра."
    - "У IV ст. кімната лежала в серці обгородженої домової церкви, і оповідь прочанки 380-х рр., збережена Петром Дияконом і зазвичай приписувана Егерії, розповідає про дім апостола, обернений на церкву, і про синагогу з тесаного каменя, до якої веде багато сходів. Епіфаній каже, що Йосип Тіверіадський мав дозвіл Константина будувати церкви в Капернаумі та інших юдейських містах. У середині V ст. восьмикутна церква замінила домову церкву. Білу вапнякову синагогу поблизу монети під її підлогою датують кінцем IV або V ст., хоча стверджували й ранішу дату."
  es:
    - "Cafarnaúm se hallaba en la orilla norte del mar de Galilea, al oeste de donde el Jordán entra en el lago, en el sitio llamado hoy Tell Hum. Las excavaciones muestran que la aldea de pescadores fue fundada en el periodo asmoneo, en el siglo II a. C. Se extendía a lo largo de la orilla, con sus casas construidas de basalto negro en torno a patios comunes, y vivía de la pesca, la agricultura y el camino que pasaba cerca. Josefo menciona una aldea Kefarnokon, que suele identificarse con Cafarnaúm, y una fuente que lleva su nombre."
    - "En los Evangelios, Cafarnaúm es la base del ministerio de Jesús en Galilea, llamada su propia ciudad. Enseñó en su sinagoga, sanó a la suegra de Simón Pedro, a un paralítico bajado por un tejado y al siervo de un centurión que, según Lucas, había edificado la sinagoga. Allí llamó a Leví desde el puesto de impuestos, y más tarde reprochó a la ciudad que no se arrepintiera."
    - "Las excavaciones franciscanas dirigidas por Virgilio Corbo y Stanislao Loffreda desde 1968, y las greco-ortodoxas bajo Vassilios Tzaferis en la parte oriental del sitio, sacaron a la luz la aldea. Bajo la sinagoga posterior hay cimientos de basalto que pueden pertenecer a una sinagoga del siglo I. Cerca, una habitación de una casa del siglo I fue enlucida y se convirtió en lugar de reunión; en sus paredes se rasparon grafitos cristianos, y fue venerada largo tiempo como la casa de Pedro."
    - "En el siglo IV la habitación quedó en el centro de una iglesia doméstica cercada, y el relato de un peregrino de la década del 380, conservado por Pedro Diácono y atribuido habitualmente a Egeria, habla de la casa del apóstol convertida en iglesia y de una sinagoga de piedra labrada a la que se llegaba por muchos escalones. Epifanio dice que José de Tiberias obtuvo de Constantino permiso para construir iglesias en Cafarnaúm y otras ciudades judías. A mediados del siglo V una iglesia octogonal sustituyó a la iglesia doméstica. La sinagoga de piedra caliza blanca situada cerca se fecha, por monedas halladas bajo su suelo, a finales del siglo IV o en el V, aunque también se ha defendido una fecha anterior."
  pt:
    - "Cafarnaum ficava na margem norte do Mar da Galileia, a oeste do ponto em que o Jordão entra no lago, no local hoje chamado Tell Hum. As escavações mostram que a aldeia de pescadores foi fundada no período hasmoneu, no século II a.C. Estendia-se ao longo da margem, com casas de basalto negro em torno de pátios comuns, e vivia da pesca, da agricultura e da estrada que passava perto. Josefo menciona uma aldeia Kepharnokon, geralmente tida como Cafarnaum, e uma fonte chamada com o seu nome."
    - "Nos Evangelhos, Cafarnaum é a base do ministério de Jesus na Galileia, chamada a sua própria cidade. Ele ensinou em sua sinagoga e curou a sogra de Simão Pedro, um paralítico descido por um telhado e o servo de um centurião que, diz Lucas, havia construído a sinagoga. Chamou ali Levi da coletoria e depois repreendeu a cidade por não se arrepender."
    - "As escavações franciscanas dirigidas por Virgilio Corbo e Stanislao Loffreda a partir de 1968, e as gregas ortodoxas sob Vassilios Tzaferis na parte leste do local, trouxeram à luz a aldeia. Sob a sinagoga posterior há fundações de basalto que podem pertencer a uma sinagoga do século I. Perto dali, um cômodo de uma casa do século I foi rebocado e tornou-se lugar de reunião; grafites cristãos foram riscados em suas paredes, e ele foi por muito tempo venerado como a casa de Pedro."
    - "No século IV, o cômodo ficava no centro de uma igreja doméstica cercada por muros, e o relato de um peregrino da década de 380, conservado por Pedro Diácono e geralmente atribuído a Egéria, fala da casa do apóstolo transformada em igreja e de uma sinagoga de pedra lavrada a que se chegava por muitos degraus. Epifânio diz que José de Tiberíades teve licença de Constantino para construir igrejas em Cafarnaum e em outras cidades judaicas. Em meados do século V, uma igreja octogonal substituiu a igreja doméstica. A sinagoga de calcário branco ali perto é datada, por moedas sob o piso, do fim do século IV ou do V, embora também se tenha defendido uma data anterior."
  de:
    - "Kapernaum lag am Nordufer des Sees Genezareth, westlich der Stelle, an der der Jordan in den See mündet, an dem Ort, der heute Tell Hum heißt. Ausgrabungen zeigen, dass das Fischerdorf in hasmonäischer Zeit im 2. Jahrhundert v. Chr. gegründet wurde. Es erstreckte sich am Ufer entlang, seine Häuser aus schwarzem Basalt waren um gemeinsame Höfe gebaut, und es lebte vom Fischfang, von der Landwirtschaft und von der Straße, die in der Nähe vorbeiführte. Josephus erwähnt ein Dorf Kepharnokon, das gewöhnlich für Kapernaum gehalten wird, und eine nach ihm benannte Quelle."
    - "In den Evangelien ist Kapernaum der Ausgangspunkt des Wirkens Jesu in Galiläa, seine eigene Stadt genannt. Er lehrte in seiner Synagoge, heilte die Schwiegermutter des Simon Petrus, einen durch ein Dach herabgelassenen Gelähmten und den Knecht eines Hauptmanns, der, wie Lukas sagt, die Synagoge gebaut hatte. Er rief Levi dort vom Zoll und tadelte die Stadt später, weil sie nicht Buße tat."
    - "Franziskanische Ausgrabungen unter Virgilio Corbo und Stanislao Loffreda ab 1968 sowie griechisch-orthodoxe Ausgrabungen unter Vassilios Tzaferis im östlichen Teil des Ortes legten das Dorf frei. Unter der späteren Synagoge liegen Basaltfundamente, die zu einer Synagoge des 1. Jahrhunderts gehören könnten. In der Nähe wurde ein Raum eines Hauses aus dem 1. Jahrhundert verputzt und wurde zu einem Versammlungsort; an seinen Wänden wurden christliche Graffiti eingeritzt, und er wurde lange als das Haus des Petrus verehrt."
    - "Im 4. Jahrhundert lag der Raum im Zentrum einer umschlossenen Hauskirche, und ein Pilgerbericht aus den 380er Jahren, von Petrus Diaconus überliefert und gewöhnlich Egeria zugeschrieben, erzählt von dem zur Kirche gemachten Haus des Apostels und von einer Synagoge aus behauenem Stein, die man über viele Stufen erreichte. Epiphanius sagt, Joseph von Tiberias habe von Konstantin die Erlaubnis gehabt, in Kapernaum und anderen jüdischen Städten Kirchen zu bauen. Mitte des 5. Jahrhunderts ersetzte eine achteckige Kirche die Hauskirche. Die nahe gelegene Synagoge aus weißem Kalkstein wird durch Münzen unter ihrem Boden in das späte 4. oder 5. Jahrhundert datiert, doch wurde auch eine frühere Datierung vertreten."
  fr:
    - "Capernaüm se trouvait sur la rive nord de la Mer de Galilée, à l’ouest de l’endroit où le Jourdain entre dans le lac, sur le site appelé aujourd’hui Tell Hum. Les fouilles montrent que le village de pêcheurs fut fondé à l’époque hasmonéenne, au IIe siècle av. J.-C. Il s’étendait le long du rivage, ses maisons de basalte noir bâties autour de cours communes, et vivait de la pêche, de l’agriculture et de la route qui passait à proximité. Josèphe mentionne un village Képharnokon, généralement tenu pour Capernaüm, et une source portant son nom."
    - "Dans les Évangiles, Capernaüm est la base du ministère de Jésus en Galilée, appelée sa propre ville. Il enseigna dans sa synagogue, guérit la belle-mère de Simon Pierre, un paralytique descendu par un toit et le serviteur d’un centurion qui, dit Luc, avait bâti la synagogue. Il y appela Lévi à son bureau de péage, et reprocha plus tard à la ville de ne pas s’être repentie."
    - "Les fouilles franciscaines dirigées par Virgilio Corbo et Stanislao Loffreda à partir de 1968, et les fouilles grecques orthodoxes de Vassilios Tzaferis sur la partie orientale du site, ont mis au jour le village. Sous la synagogue plus tardive se trouvent des fondations de basalte qui pourraient appartenir à une synagogue du Ier siècle. Tout près, une pièce d’une maison du Ier siècle fut enduite de plâtre et devint un lieu de réunion ; des graffitis chrétiens furent gravés sur ses murs, et elle fut longtemps vénérée comme la maison de Pierre."
    - "Au IVe siècle, la pièce se trouvait au cœur d’une église-maison close, et un récit de pèlerin des années 380, conservé par Pierre Diacre et généralement attribué à Égérie, parle de la maison de l’apôtre transformée en église et d’une synagogue de pierre taillée à laquelle on accédait par de nombreuses marches. Épiphane dit que Joseph de Tibériade avait reçu de Constantin la permission de bâtir des églises à Capernaüm et dans d’autres villes juives. Au milieu du Ve siècle, une église octogonale remplaça l’église-maison. La synagogue de calcaire blanc voisine est datée, par des pièces de monnaie sous son sol, de la fin du IVe ou du Ve siècle, bien qu’une date plus ancienne ait aussi été défendue."
