body:
  en:
    - "Naphoth-dor is the district of Dor, the harbour town on the Carmel coast between Caesarea and Haifa. The Hebrew word naphah, which the King James Bible renders “borders”, “coast” and “region”, is of uncertain meaning, “heights” or perhaps “dunes”; it is used only of Dor. A king from “the borders of Dor on the west” joined Jabin of Hazor against Joshua, and the list of the defeated kings has “The king of Dor in the coast of Dor”. Dor was assigned to Manasseh inside Asher, though Manasseh could not drive out its Canaanites, and under Solomon “all the region of Dor” was the fourth of his twelve provisioning districts, governed by Ben-abinadab, who had Solomon's daughter Taphath to wife."
    - "Dor itself, Tel Dor by the kibbutz of Nahsholim, has been dug since 1980 and shows the coast's whole history. In the eleventh century BC the Egyptian envoy Wenamun, robbed in its harbour, found it ruled by the Tjeker, one of the Sea Peoples, under a prince named Beder. Israel held it in the tenth century; the Assyrians made Du'ru a province after 732 BC; in the Persian period the Sidonian king Eshmunazar boasts on his sarcophagus that the Great King gave him “Dor and Joppa”, and Dor became a Phoenician city with purple-dye works. It was a Hellenistic fortress, a Roman town, and a Byzantine bishopric, and then shrank to the village of Tantura."
    - "Today the mound of Dor, with its harbours and the sea-cut rock, stands on the shore south of Haifa; the finds are in the Mizgaga museum at Nahsholim."
  ru:
    - "Нафаф-Дор — область Дора, портового города на побережье Кармила между Кесарией и Хайфой. Еврейское слово «нафа», которое русская Библия передаёт как Нафаф-Дор и Нафоф-Дор, а в одном месте как «Нафеф», неясно по смыслу: «высоты» или, может быть, «дюны»; оно употребляется только о Доре. Царь из Нафоф-Дора «к западу» примкнул к Иавину Асорскому против Иисуса Навина, а в списке побеждённых царей стоит «один царь Дора при Нафаф-Доре». Дор достался Манассии внутри удела Асира, хотя Манассия не смог изгнать его Хананеев, а при Соломоне Бен-Авинадав, которому «Тафафь, дочь Соломона, была его женою», был поставлен «над всем Нафаф-Дором», четвёртым из двенадцати округов, кормивших царский дом."
    - "Сам Дор, Тель-Дор у кибуца Нахшолим, копают с 1980 года, и он показывает всю историю побережья. В XI веке до н. э. египетский посланник Ун-Амун, ограбленный в его гавани, нашёл город во власти чекеров, одного из народов моря, под началом князя Бедера. В X веке им владел Израиль; после 732 г. до н. э. Ассирия сделала Дуру провинцией; в персидское время сидонский царь Эшмуназар хвалится на своём саркофаге, что Великий царь дал ему Дор и Иоппию, и Дор стал финикийским городом с мастерскими пурпура. Он был эллинистической крепостью, римским городом и византийской епископией, а потом сжался до деревни Тантура."
    - "Сегодня холм Дора с его гаванями и изрезанными морем скалами стоит на берегу к югу от Хайфы; находки хранятся в музее Мизгага в Нахшолиме."
  uk:
    - "Нафот-Дор — це округа Дора, портового міста на узбережжі Кармелу між Кесарією та Хайфою. Єврейське слово нафа, яке Біблія короля Якова передає як «межі», «узбережжя» і «область», має невизначене значення — «висоти» або, можливо, «дюни»; воно вживається лише щодо Дора. Цар «в Нафот-Дорі понад морем» об'єднався з Явіном Гацорським проти Ісуса Навина, а у списку переможених царів значиться «Царь Дорський коло Нафат Дору». Дор було призначено Манасії всередині Асира, хоча Манасія не змогла вигнати його ханаанеїв, а за Соломона «увесь Нафат-Дор» був четвертим із дванадцяти його забезпечувальних округів, яким правив Бен-Авінадав, що мав за жінку Соломонову дочку Тафаф."
    - "Сам Дор, Тель-Дор біля кібуца Нахшолім, розкопують із 1980 року, і він показує всю історію узбережжя. В XI столітті до н. е. єгипетський посол Венамон, якого пограбували в його гавані, застав там володарювати теккерів, одного з народів моря, під проводом князя на ім'я Бедер. Ізраїль володів ним у X столітті; ассирійці зробили Дуру провінцією після 732 р. до н. е.; за персидської доби сидонський цар Ешмуназар на своєму саркофазі хвалиться, що Великий цар дав йому «Дор і Яффу», і Дор став фінікійським містом із виробництвом пурпурової фарби. Він був елліністичною фортецею, римським містом і візантійською єпископською кафедрою, а потім зменшився до села Тантура."
    - "Сьогодні пагорб Дора з його гаванями та вирізаною морем скелею стоїть на березі на південь від Хайфи; знахідки зберігаються в музеї Мізґага в Нахшолімі."
  es:
    - "Nafat-dor es el distrito de Dor, la ciudad portuaria de la costa del Carmelo entre Cesarea y Haifa. La palabra hebrea naphah, que la King James Bible traduce «límites», «costa» y «región», es de significado incierto, «alturas» o quizá «dunas»; solo se usa de Dor. Un rey de «las regiones de Dor al occidente» se unió a Jabín de Hazor contra Josué, y la lista de los reyes vencidos dice: «El rey de Dor, de la provincia de Dor». Dor fue asignada a Manasés dentro de Aser, aunque Manasés no pudo expulsar a sus cananeos, y bajo Salomón «todos los términos de Dor» fueron el cuarto de sus doce distritos de abastecimiento, gobernado por Ben-abinadab, que tenía por mujer a Tafat, hija de Salomón."
    - "La propia Dor, Tel Dor, junto al kibutz de Nahsholim, se excava desde 1980 y muestra toda la historia de la costa. En el siglo XI a. C., el enviado egipcio Wenamón, robado en su puerto, la encontró gobernada por los tjeker, uno de los Pueblos del Mar, bajo un príncipe llamado Beder. Israel la tuvo en el siglo X; los asirios hicieron de Du'ru una provincia después del 732 a. C.; en el período persa el rey sidonio Eshmunazar se jacta en su sarcófago de que el Gran Rey le dio «Dor y Jope», y Dor se convirtió en una ciudad fenicia con tintorerías de púrpura. Fue una fortaleza helenística, una ciudad romana y una sede episcopal bizantina, y luego se redujo a la aldea de Tantura."
    - "Hoy el montículo de Dor, con sus puertos y la roca tallada por el mar, se alza en la costa al sur de Haifa; los hallazgos están en el museo de Mizgaga, en Nahsholim."
  pt:
    - "Nafote-Dor é o distrito de Dor, a cidade portuária da costa do Carmelo, entre Cesareia e Haifa. A palavra hebraica naphah, que a Bíblia King James traduz por “limites”, “costa” e “região”, é de sentido incerto, “alturas” ou talvez “dunas”; só é usada para Dor. Um rei “das colinas de Dor, a oeste” uniu-se a Jabim de Hazor contra Josué, e a lista dos reis vencidos traz “o rei de Dor, nos altos de Dor”. Dor foi atribuída a Manassés dentro de Aser, embora Manassés não pudesse expulsar os seus cananeus, e sob Salomão “todas as alturas de Dor” formaram o quarto dos seus doze distritos de abastecimento, governado por Ben-Abinadabe, que tinha por esposa Tafate, filha de Salomão."
    - "A própria Dor, Tel Dor, junto ao quibutz de Nahsholim, é escavada desde 1980 e mostra toda a história da costa. No século XI a.C., o enviado egípcio Wenamun, roubado em seu porto, encontrou-a governada pelos Tjeker, um dos Povos do Mar, sob um príncipe chamado Beder. Israel a manteve no século X; os assírios fizeram de Du'ru uma província depois de 732 a.C.; no período persa, o rei sidônio Eshmunazar gaba-se em seu sarcófago de que o Grande Rei lhe deu “Dor e Jope”, e Dor tornou-se uma cidade fenícia com tinturarias de púrpura. Foi fortaleza helenística, cidade romana e sede episcopal bizantina, e depois encolheu até a aldeia de Tantura."
    - "Hoje o tell de Dor, com seus portos e a rocha talhada pelo mar, ergue-se na costa ao sul de Haifa; os achados estão no museu Mizgaga, em Nahsholim."
  de:
    - "Nafot-Dor ist der Bezirk von Dor, der Hafenstadt an der Karmelküste zwischen Caesarea und Haifa. Das hebräische Wort naphah, das die King-James-Bibel mit „borders“, „coast“ und „region“ wiedergibt, hat eine unsichere Bedeutung, „Höhen“ oder vielleicht „Dünen“; es wird nur von Dor gebraucht. Ein König aus Nafot-Dor „am Meer“ verbündete sich mit Jabin von Hazor gegen Josua, und die Liste der besiegten Könige nennt „der König zu Naphoth-Dor“. Dor wurde Manasse innerhalb Assers zugeteilt, doch Manasse konnte dessen Kanaaniter nicht vertreiben, und unter Salomo war „die ganze Herrschaft zu Dor“ der vierte seiner zwölf Versorgungsbezirke, den Ben-Abinadab verwaltete, der Salomos Tochter Taphat zur Frau hatte."
    - "Dor selbst, Tel Dor beim Kibbuz Nachscholim, wird seit 1980 ausgegraben und zeigt die ganze Geschichte der Küste. Im 11. Jahrhundert v. Chr. fand der in seinem Hafen beraubte ägyptische Gesandte Wenamun die Stadt unter der Herrschaft der Tjeker, eines der Seevölker, mit einem Fürsten namens Beder. Im 10. Jahrhundert hielt Israel sie; die Assyrer machten Du'ru nach 732 v. Chr. zur Provinz; in persischer Zeit rühmt sich der sidonische König Eschmunazar auf seinem Sarkophag, der Großkönig habe ihm „Dor und Joppe“ gegeben, und Dor wurde eine phönizische Stadt mit Purpurfärbereien. Es war eine hellenistische Festung, eine römische Stadt und ein byzantinischer Bischofssitz und schrumpfte dann zum Dorf Tantura."
    - "Heute steht der Siedlungshügel von Dor mit seinen Häfen und dem vom Meer ausgewaschenen Fels an der Küste südlich von Haifa; die Funde befinden sich im Museum von Mizgaga in Nachscholim."
  fr:
    - "Naphoth-Dor est le district de Dor, ville portuaire de la côte du Carmel entre Césarée et Haïfa. Le mot hébreu naphah, que Louis Segond rend par « hauteurs » et « contrée », est de sens incertain, « hauteurs » ou peut-être « dunes » ; il n’est employé que pour Dor. Un roi des « hauteurs de Dor à l’occident » se joignit à Jabin de Hatsor contre Josué, et la liste des rois vaincus porte « le roi de Dor, sur les hauteurs de Dor ». Dor fut attribuée à Manassé à l’intérieur d’Aser, bien que Manassé n’ait pu en chasser les Cananéens, et sous Salomon « toute la contrée de Dor » formait le quatrième de ses douze districts de ravitaillement, gouverné par le fils d’Abinadab, dont Thaphath, fille de Salomon, était la femme."
    - "Dor elle-même, Tel Dor, près du kibboutz de Nahsholim, est fouillée depuis 1980 et montre toute l’histoire de la côte. Au XIe siècle av. J.-C., l’envoyé égyptien Ounamon, volé dans son port, la trouva gouvernée par les Tjeker, l’un des Peuples de la mer, sous un prince nommé Beder. Israël la tint au Xe siècle ; les Assyriens firent de Du’ru une province après 732 av. J.-C. ; à l’époque perse, le roi sidonien Eshmounazar se vante sur son sarcophage que le Grand Roi lui ait donné « Dor et Joppé », et Dor devint une cité phénicienne dotée d’ateliers de teinture de pourpre. Elle fut forteresse hellénistique, ville romaine et évêché byzantin, puis se réduisit au village de Tantura."
    - "Aujourd’hui, le tertre de Dor, avec ses ports et le roc entaillé par la mer, se dresse sur le rivage au sud de Haïfa ; les trouvailles sont au musée de Mizgaga, à Nahsholim."
