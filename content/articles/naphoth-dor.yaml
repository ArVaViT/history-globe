body:
  en:
    - "Naphoth-dor is the district of Dor, the harbour town on the Carmel coast between Caesarea and Haifa. The Hebrew word naphah, which the King James Bible renders “borders”, “coast” and “region”, is of uncertain meaning, “heights” or perhaps “dunes”; it is used only of Dor. A king from “the borders of Dor on the west” joined Jabin of Hazor against Joshua, and the list of the defeated kings has “The king of Dor in the coast of Dor”. Dor was assigned to Manasseh inside Asher, though Manasseh could not drive out its Canaanites, and under Solomon “all the region of Dor” was the fourth of his twelve provisioning districts, governed by Ben-abinadab, who had Solomon's daughter Taphath to wife."
    - "Dor itself, Tel Dor by the kibbutz of Nahsholim, has been dug since 1980 and shows the coast's whole history. In the eleventh century BC the Egyptian envoy Wenamun, robbed in its harbour, found it ruled by the Tjeker, one of the Sea Peoples, under a prince named Beder. Kings puts it under Solomon, though the excavators date Israelite rule there only to the ninth century; the Assyrians made Du'ru a province after 732 BC; in the Persian period the Sidonian king Eshmunazar boasts on his sarcophagus that the Great King gave him “Dor and Joppa”, and Dor became a Phoenician city with purple-dye works. It was a Hellenistic fortress, a Roman town, and a Byzantine bishopric, and then shrank to the village of Tantura."
    - "Today the mound of Dor, with its harbours and the sea-cut rock, stands on the shore south of Haifa; the finds are in the Mizgaga museum at Nahsholim."
  ru:
    - "Нафаф-Дор — область Дора, портового города на побережье Кармила между Кесарией и Хайфой. Еврейское слово «нафа», которое русская Библия передаёт как Нафаф-Дор и Нафоф-Дор, а в одном месте как «Нафеф», неясно по смыслу: «высоты» или, может быть, «дюны»; оно употребляется только о Доре. Царь из Нафоф-Дора «к западу» примкнул к Иавину Асорскому против Иисуса Навина, а в списке побеждённых царей стоит «один царь Дора при Нафаф-Доре». Дор достался Манассии внутри удела Асира, хотя Манассия не смог изгнать его Хананеев, а при Соломоне Бен-Авинадав, которому «Тафафь, дочь Соломона, была его женою», был поставлен «над всем Нафаф-Дором», четвёртым из двенадцати округов, кормивших царский дом."
    - "Сам Дор, Тель-Дор у кибуца Нахшолим, копают с 1980 года, и он показывает всю историю побережья. В XI веке до н. э. египетский посланник Ун-Амун, ограбленный в его гавани, нашёл город во власти чекеров, одного из народов моря, под началом князя Бедера. Книга Царств относит его к Соломону, хотя раскопщики датируют власть Израиля там лишь IX веком; после 732 г. до н. э. Ассирия сделала Дуру провинцией; в персидское время сидонский царь Эшмуназар хвалится на своём саркофаге, что Великий царь дал ему Дор и Иоппию, и Дор стал финикийским городом с мастерскими пурпура. Он был эллинистической крепостью, римским городом и византийской епископией, а потом сжался до деревни Тантура."
    - "Сегодня холм Дора с его гаванями и изрезанными морем скалами стоит на берегу к югу от Хайфы; находки хранятся в музее Мизгага в Нахшолиме."
  uk:
    - "Нафот-Дор — це округа Дора, портового міста на узбережжі Кармелу між Кесарією та Хайфою. Єврейське слово нафа, яке Біблія короля Якова передає як «межі», «узбережжя» і «область», має невизначене значення — «висоти» або, можливо, «дюни»; воно вживається лише щодо Дора. Цар «в Нафот-Дорі понад морем» об'єднався з Явіном Гацорським проти Ісуса Навина, а у списку переможених царів значиться «Царь Дорський коло Нафат Дору». Дор було призначено Манасії всередині Асира, хоча Манасія не змогла вигнати його ханаанеїв, а за Соломона «увесь Нафат-Дор» був четвертим із дванадцяти його забезпечувальних округів, яким правив Бен-Авінадав, що мав за жінку Соломонову дочку Тафаф."
    - "Сам Дор, Тель-Дор біля кібуца Нахшолім, розкопують із 1980 року, і він показує всю історію узбережжя. В XI столітті до н. е. єгипетський посол Венамон, якого пограбували в його гавані, застав там володарювати теккерів, одного з народів моря, під проводом князя на ім'я Бедер. Книга Царів відносить його до Соломона, хоча розкопувачі датують ізраїльське панування там лише IX століттям; ассирійці зробили Дуру провінцією після 732 р. до н. е.; за персидської доби сидонський цар Ешмуназар на своєму саркофазі хвалиться, що Великий цар дав йому «Дор і Яффу», і Дор став фінікійським містом із виробництвом пурпурової фарби. Він був елліністичною фортецею, римським містом і візантійською єпископською кафедрою, а потім зменшився до села Тантура."
    - "Сьогодні пагорб Дора з його гаванями та вирізаною морем скелею стоїть на березі на південь від Хайфи; знахідки зберігаються в музеї Мізґага в Нахшолімі."
  es:
    - "Nafat-dor es el distrito de Dor, la ciudad portuaria de la costa del Carmelo entre Cesarea y Haifa. La palabra hebrea naphah, que la King James Bible traduce «límites», «costa» y «región», es de significado incierto, «alturas» o quizá «dunas»; solo se usa de Dor. Un rey de «las regiones de Dor al occidente» se unió a Jabín de Hazor contra Josué, y la lista de los reyes vencidos dice: «El rey de Dor, de la provincia de Dor». Dor fue asignada a Manasés dentro de Aser, aunque Manasés no pudo expulsar a sus cananeos, y bajo Salomón «todos los términos de Dor» fueron el cuarto de sus doce distritos de abastecimiento, gobernado por Ben-abinadab, que tenía por mujer a Tafat, hija de Salomón."
    - "La propia Dor, Tel Dor, junto al kibutz de Nahsholim, se excava desde 1980 y muestra toda la historia de la costa. En el siglo XI a. C., el enviado egipcio Wenamón, robado en su puerto, la encontró gobernada por los tjeker, uno de los Pueblos del Mar, bajo un príncipe llamado Beder. Reyes la sitúa bajo Salomón, aunque los excavadores datan el dominio israelita allí solo en el siglo IX; los asirios hicieron de Du'ru una provincia después del 732 a. C.; en el período persa el rey sidonio Eshmunazar se jacta en su sarcófago de que el Gran Rey le dio «Dor y Jope», y Dor se convirtió en una ciudad fenicia con tintorerías de púrpura. Fue una fortaleza helenística, una ciudad romana y una sede episcopal bizantina, y luego se redujo a la aldea de Tantura."
    - "Hoy el montículo de Dor, con sus puertos y la roca tallada por el mar, se alza en la costa al sur de Haifa; los hallazgos están en el museo de Mizgaga, en Nahsholim."
  pt:
    - "Nafote-Dor é o distrito de Dor, a cidade portuária da costa do Carmelo, entre Cesareia e Haifa. A palavra hebraica naphah, que a Bíblia King James traduz por “limites”, “costa” e “região”, é de sentido incerto, “alturas” ou talvez “dunas”; só é usada para Dor. Um rei “das colinas de Dor, a oeste” uniu-se a Jabim de Hazor contra Josué, e a lista dos reis vencidos traz “o rei de Dor, nos altos de Dor”. Dor foi atribuída a Manassés dentro de Aser, embora Manassés não pudesse expulsar os seus cananeus, e sob Salomão “todas as alturas de Dor” formaram o quarto dos seus doze distritos de abastecimento, governado por Ben-Abinadabe, que tinha por esposa Tafate, filha de Salomão."
    - "A própria Dor, Tel Dor, junto ao quibutz de Nahsholim, é escavada desde 1980 e mostra toda a história da costa. No século XI a.C., o enviado egípcio Wenamun, roubado em seu porto, encontrou-a governada pelos Tjeker, um dos Povos do Mar, sob um príncipe chamado Beder. Reis a coloca sob Salomão, embora os escavadores datem o domínio israelita ali só no século IX; os assírios fizeram de Du'ru uma província depois de 732 a.C.; no período persa, o rei sidônio Eshmunazar gaba-se em seu sarcófago de que o Grande Rei lhe deu “Dor e Jope”, e Dor tornou-se uma cidade fenícia com tinturarias de púrpura. Foi fortaleza helenística, cidade romana e sede episcopal bizantina, e depois encolheu até a aldeia de Tantura."
    - "Hoje o tell de Dor, com seus portos e a rocha talhada pelo mar, ergue-se na costa ao sul de Haifa; os achados estão no museu Mizgaga, em Nahsholim."
  de:
    - "Nafot-Dor ist der Bezirk von Dor, der Hafenstadt an der Karmelküste zwischen Caesarea und Haifa. Das hebräische Wort naphah, das die King-James-Bibel mit „borders“, „coast“ und „region“ wiedergibt, hat eine unsichere Bedeutung, „Höhen“ oder vielleicht „Dünen“; es wird nur von Dor gebraucht. Ein König aus Nafot-Dor „am Meer“ verbündete sich mit Jabin von Hazor gegen Josua, und die Liste der besiegten Könige nennt „der König zu Naphoth-Dor“. Dor wurde Manasse innerhalb Assers zugeteilt, doch Manasse konnte dessen Kanaaniter nicht vertreiben, und unter Salomo war „die ganze Herrschaft zu Dor“ der vierte seiner zwölf Versorgungsbezirke, den Ben-Abinadab verwaltete, der Salomos Tochter Taphat zur Frau hatte."
    - "Dor selbst, Tel Dor beim Kibbuz Nachscholim, wird seit 1980 ausgegraben und zeigt die ganze Geschichte der Küste. Im 11. Jahrhundert v. Chr. fand der in seinem Hafen beraubte ägyptische Gesandte Wenamun die Stadt unter der Herrschaft der Tjeker, eines der Seevölker, mit einem Fürsten namens Beder. Die Königsbücher stellen sie unter Salomo, doch die Ausgräber datieren die israelitische Herrschaft dort erst ins 9. Jahrhundert; die Assyrer machten Du'ru nach 732 v. Chr. zur Provinz; in persischer Zeit rühmt sich der sidonische König Eschmunazar auf seinem Sarkophag, der Großkönig habe ihm „Dor und Joppe“ gegeben, und Dor wurde eine phönizische Stadt mit Purpurfärbereien. Es war eine hellenistische Festung, eine römische Stadt und ein byzantinischer Bischofssitz und schrumpfte dann zum Dorf Tantura."
    - "Heute steht der Siedlungshügel von Dor mit seinen Häfen und dem vom Meer ausgewaschenen Fels an der Küste südlich von Haifa; die Funde befinden sich im Museum von Mizgaga in Nachscholim."
  fr:
    - "Naphoth-Dor est le district de Dor, ville portuaire de la côte du Carmel entre Césarée et Haïfa. Le mot hébreu naphah, que Louis Segond rend par « hauteurs » et « contrée », est de sens incertain, « hauteurs » ou peut-être « dunes » ; il n’est employé que pour Dor. Un roi des « hauteurs de Dor à l’occident » se joignit à Jabin de Hatsor contre Josué, et la liste des rois vaincus porte « le roi de Dor, sur les hauteurs de Dor ». Dor fut attribuée à Manassé à l’intérieur d’Aser, bien que Manassé n’ait pu en chasser les Cananéens, et sous Salomon « toute la contrée de Dor » formait le quatrième de ses douze districts de ravitaillement, gouverné par le fils d’Abinadab, dont Thaphath, fille de Salomon, était la femme."
    - "Dor elle-même, Tel Dor, près du kibboutz de Nahsholim, est fouillée depuis 1980 et montre toute l’histoire de la côte. Au XIe siècle av. J.-C., l’envoyé égyptien Ounamon, volé dans son port, la trouva gouvernée par les Tjeker, l’un des Peuples de la mer, sous un prince nommé Beder. les Rois la placent sous Salomon, mais les fouilleurs ne datent la domination israélite qu’au IXe siècle ; les Assyriens firent de Du’ru une province après 732 av. J.-C. ; à l’époque perse, le roi sidonien Eshmounazar se vante sur son sarcophage que le Grand Roi lui ait donné « Dor et Joppé », et Dor devint une cité phénicienne dotée d’ateliers de teinture de pourpre. Elle fut forteresse hellénistique, ville romaine et évêché byzantin, puis se réduisit au village de Tantura."
    - "Aujourd’hui, le tertre de Dor, avec ses ports et le roc entaillé par la mer, se dresse sur le rivage au sud de Haïfa ; les trouvailles sont au musée de Mizgaga, à Nahsholim."
  it:
    - "Nafat-Dor è il distretto di Dor, la città portuale sulla costa del Carmelo tra Cesarea e Haifa. La parola ebraica naphah, che la Bibbia di re Giacomo rende con «confini», «costa» e «regione», ha un significato incerto, «alture» o forse «dune», ed è usata solo per Dor. Un re «sulle alture di Dor a ponente» si unì a Iabin di Asor contro Giosuè, e l’elenco dei re sconfitti ha «il re di Dor, sulle alture di Dor». Dor fu assegnata a Manasse all’interno di Aser, benché Manasse non riuscisse a cacciarne i Cananei, e sotto Salomone «tutta la regione di Dor» fu il quarto dei suoi dodici distretti di approvvigionamento, governato da Ben-Abinadab, che aveva per moglie Tafat, figlia di Salomone."
    - "La stessa Dor, Tel Dor presso il kibbutz di Nahsholim, è scavata dal 1980 e mostra l’intera storia della costa. Nell’XI secolo a.C. l’inviato egiziano Wenamon, derubato nel suo porto, la trovò governata dai Tjeker, uno dei Popoli del Mare, sotto un principe di nome Beder. i Re la pongono sotto Salomone, ma gli scavatori datano il dominio israelita solo al IX secolo; gli Assiri fecero di Du’ru una provincia dopo il 732 a.C.; in epoca persiana il re sidonio Eshmunazar si vanta sul suo sarcofago che il Gran Re gli diede «Dor e Giaffa», e Dor divenne una città fenicia con tintorie di porpora. Fu una fortezza ellenistica, una città romana e una sede vescovile bizantina, poi si ridusse al villaggio di Tantura."
    - "Oggi il tell di Dor, con i suoi porti e la roccia modellata dal mare, sorge sulla riva a sud di Haifa; i reperti sono nel museo Mizgaga a Nahsholim."
  pl:
    - "Nafot-Dor to okręg Dor, portowego miasta na wybrzeżu Karmelu między Cezareą a Hajfą. Hebrajskie słowo nafa, które Biblia Króla Jakuba oddaje jako „borders”, „coast” i „region”, ma niepewne znaczenie, „wzniesienia” albo może „wydmy”; używane jest tylko w odniesieniu do Dor. Król z „krain Dor, ku zachodowi” przyłączył się do Jabina z Chasoru przeciw Jozuemu, a na liście pokonanych królów czytamy: „Król Dor z krainy Dor jeden”. Dor przydzielono Manassesowi w obrębie Aszera, choć Manasses nie zdołał wypędzić stamtąd Kananejczyków, a za Salomona „wszystkie granice Dor” były czwartym z dwunastu okręgów zaopatrzeniowych, rządzonym przez Ben-Abinadaba, który miał za żonę córkę Salomona, Tafat."
    - "Sam Dor, Tel Dor przy kibucu Nahsholim, bada się od 1980 roku i ukazuje on całe dzieje wybrzeża. W XI wieku p.n.e. egipski poseł Wenamon, okradziony w jego porcie, zastał miasto pod władzą Tjekerów, jednego z Ludów Morza, pod rządami księcia Bedera. Księgi Królewskie przypisują je Salomonowi, choć archeolodzy datują panowanie Izraela dopiero na IX wiek p.n.e.; Asyryjczycy uczynili z Du'ru prowincję po 732 roku p.n.e.; w okresie perskim sydoński król Eszmunazar chlubi się na swoim sarkofagu, że Wielki Król dał mu „Dor i Jafę”, a Dor stał się miastem fenickim z warsztatami barwiącymi na purpurę. Był twierdzą hellenistyczną, miastem rzymskim i biskupstwem bizantyńskim, po czym zmalał do wsi Tantura."
    - "Dziś wzgórze Dor, z jego portami i skałą wyżłobioną przez morze, stoi na brzegu na południe od Hajfy; znaleziska są w muzeum Mizgaga w Nahsholim."
  cs:
    - "Nafat-dór je okres Dóru, přístavního města na karmelském pobřeží mezi Cesareou a Haifou. Hebrejské slovo nafa, které anglická Bible krále Jakuba překládá jako „borders“, „coast“ a „region“, má nejistý význam, „výšiny“ či snad „duny“; používá se jen o Dóru. Král z oblasti „v krajinách Dor na západ“ se připojil k Jabínovi z Chacoru proti Jozuovi a ve výčtu poražených králů stojí „Král Dor z krajiny Dor“. Dór byl přidělen Manasesovi uvnitř Ašeru, ač Manases nemohl vyhnat jeho Kananejské, a za Šalomouna byly „všecky končiny Dor“ čtvrtým z jeho dvanácti zásobovacích okresů, jejž spravoval Ben-abinadab, který měl za manželku Šalomounovu dceru Tafat."
    - "Samotný Dór, Tel Dor u kibucu Nachsholim, se kopá od roku 1980 a ukazuje celé dějiny pobřeží. V 11. století př. n. l. jej egyptský posel Wenamun, oloupený v jeho přístavu, shledal ovládaný Tjekery, jedním z Mořských národů, pod knížetem jménem Beder. Knihy královské jej kladou pod Šalomouna, archeologové však datují izraelskou vládu tam až do 9. století; Asyřané z Du'ru po roce 732 př. n. l. učinili provincii; v perské době se sidonský král Ešmunazar na svém sarkofágu chlubí, že mu Velký král dal „Dor a Joppe“, a Dór se stal fénickým městem s barvírnami na purpur. Byl helénistickou pevností, římským městem a byzantským biskupstvím a pak se zmenšil na vesnici Tantura."
    - "Dnes stojí pahorek Dóru se svými přístavy a skálou prosekanou mořem na pobřeží jižně od Haify; nálezy jsou v muzeu Mizgaga v Nachsholimu."
  nl:
    - "Nafat-Dor is het district van Dor, de havenstad aan de Karmelkust tussen Caesarea en Haifa. Het Hebreeuwse woord naphah, dat de King James Bible weergeeft met “borders”, “coast” en “region”, heeft een onzekere betekenis, “hoogten” of misschien “duinen”; het wordt alleen van Dor gebruikt. Een koning uit “Nafoth-Dor, aan de zee” sloot zich aan bij Jabin van Hazor tegen Jozua, en de lijst van verslagen koningen heeft “De koning van Dor, tot Nafath-Dor”. Dor werd aan Manasse toegewezen binnen Aser, hoewel Manasse de Kanaänieten daar niet kon verdrijven, en onder Salomo was “de ganse landstreek van Dor” het vierde van zijn twaalf bevoorradingsdistricten, bestuurd door Ben-Abinadab, die Salomo’s dochter Tafat tot vrouw had."
    - "Dor zelf, Tel Dor bij de kibboets Nahsholim, wordt sinds 1980 opgegraven en toont de hele geschiedenis van de kust. In de 11e eeuw v.Chr. vond de Egyptische gezant Wenamon, die in de haven was bestolen, de stad bestuurd door de Tjeker, een van de Zeevolken, onder een vorst genaamd Beder. Koningen plaatst haar onder Salomo, al dateren de opgravers het Israëlitische gezag daar pas in de 9e eeuw; de Assyriërs maakten van Du’ru na 732 v.Chr. een provincie; in de Perzische tijd beroemt de Sidonische koning Esmunazar zich op zijn sarcofaag dat de Grote Koning hem “Dor en Joppe” gaf, en Dor werd een Fenicische stad met purperververijen. Het was een hellenistische vesting, een Romeinse stad en een Byzantijns bisdom, en kromp daarna tot het dorp Tantura."
    - "Tegenwoordig staat de tel van Dor, met zijn havens en de door de zee uitgeslepen rots, aan de kust ten zuiden van Haifa; de vondsten bevinden zich in het museum van Mizgaga in Nahsholim."
  sv:
    - "Nafot-Dor är distriktet Dor, hamnstaden vid Karmelkusten mellan Caesarea och Haifa. Det hebreiska ordet naphah, som King James-översättningen återger som ”borders”, ”coast” och ”region”, har osäker betydelse, ”höjder” eller kanske ”dyner”; det används bara om Dor. En kung från ”Nafot-Dor, västerut” slöt sig till Javin av Hasor mot Josua, och förteckningen över de besegrade kungarna har ”konungen över Dor i Nafat-Dor”. Dor tilldelades Manasse inom Asher, fastän Manasse inte kunde fördriva dess kananéer, och under Salomo var ”hela Nafat-Dor” det fjärde av hans tolv distrikt för kungens försörjning, styrt av Ben-Avinadav, som fick Salomos dotter Tafat till hustru."
    - "Själva Dor, Tel Dor vid kibbutzen Nahsholim, har grävts ut sedan 1980 och visar kustens hela historia. På 1000-talet f.Kr. fann den egyptiske sändebudet Wenamon, bestulen i dess hamn, att den styrdes av tjekerna, ett av havsfolken, under en furste vid namn Beder. Kungaböckerna för den under Salomo, men utgrävarna daterar israelitiskt välde där först till 800-talet; assyrierna gjorde Du'ru till provins efter 732 f.Kr.; under persertiden skryter den sidoniske kungen Eshmunazar på sin sarkofag med att Storkungen gav honom ”Dor och Joppe”, och Dor blev en fenicisk stad med purpurfärgerier. Den var en hellenistisk fästning, en romersk stad och ett bysantinskt biskopsdöme, och krympte sedan till byn Tantura."
    - "I dag står Dors kulle, med sina hamnar och den havsskurna klippan, vid stranden söder om Haifa; fynden finns på Mizgaga-museet i Nahsholim."
  nb:
    - "Nafot-Dor er distriktet Dor, havnebyen på Karmel-kysten mellom Cæsarea og Haifa. Det hebraiske ordet naphah, som King James-bibelen gjengir som «borders», «coast» og «region», har uviss betydning, «høyder» eller kanskje «sanddyner»; det brukes bare om Dor. En konge fra «Dor-høidene ved havet» sluttet seg til Jabin av Hasor mot Josva, og listen over de beseirede kongene har «kongen i Dor på Dor-høidene». Dor ble tildelt Manasse innenfor Asjer, selv om Manasse ikke klarte å drive ut kanaaneerne der, og under Salomo var «hele Dors høiland» det fjerde av hans tolv forsyningsdistrikter, styrt av Ben-Abinadab, som «hadde Tafat, Salomos datter, til hustru»."
    - "Selve Dor, Tel Dor ved kibbutzen Nahsholim, har vært gravd ut siden 1980 og viser kystens hele historie. På 1000-tallet f.Kr. fant den egyptiske utsendingen Wenamon, som ble utplyndret i havnen, at den ble styrt av tjekerne, et av havfolkene, under en fyrste ved navn Beder. Kongebøkene plasserer den under Salomo, selv om utgraverne daterer israelittisk styre der først til 800-tallet; assyrerne gjorde Du'ru til en provins etter 732 f.Kr.; i persertiden roser den sidonske kongen Esjmunazar seg på sin sarkofag av at Storkongen ga ham «Dor og Jaffa», og Dor ble en fønikisk by med purpurfargerier. Den var en hellenistisk festning, en romersk by og et bysantinsk bispedømme, og skrumpet så inn til landsbyen Tantura."
    - "I dag ligger Dor-haugen, med sine havner og den havskårne klippen, ved kysten sør for Haifa; funnene er i Mizgaga-museet i Nahsholim."
