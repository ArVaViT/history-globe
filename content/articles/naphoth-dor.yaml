# Overview article (ADR 0007). Mainstream facts only; the meaning of the Hebrew word is given as uncertain; Dor's history is told from its excavations and the Egyptian and Phoenician texts.
id: naphoth-dor
place: ad05040
title:
  en: "Naphoth-dor"
  ru: "Нафаф-Дор"
body:
  en:
    - "Naphoth-dor is the district of Dor, the harbour town on the Carmel coast between Caesarea and Haifa. The Hebrew word naphah, which the King James Bible renders “borders”, “coast” and “region”, is of uncertain meaning, “heights” or perhaps “dunes”; it is used only of Dor. A king from “the borders of Dor on the west” joined Jabin of Hazor against Joshua, and the list of the defeated kings has “The king of Dor in the coast of Dor”. Dor was assigned to Manasseh inside Asher, though Manasseh could not drive out its Canaanites, and under Solomon “all the region of Dor” was the fourth of his twelve provisioning districts, governed by Ben-abinadab, who had Solomon's daughter Taphath to wife."
    - "Dor itself, Tel Dor by the kibbutz of Nahsholim, has been dug since 1980 and shows the coast's whole history. In the eleventh century BC the Egyptian envoy Wenamun, robbed in its harbour, found it ruled by the Tjeker, one of the Sea Peoples, under a prince named Beder. Israel held it in the tenth century; the Assyrians made Du'ru a province after 732 BC; in the Persian period the Sidonian king Eshmunazar boasts on his sarcophagus that the Great King gave him “Dor and Joppa”, and Dor became a Phoenician city with purple-dye works. It was a Hellenistic fortress, a Roman town, and a Byzantine bishopric, and then shrank to the village of Tantura."
    - "Today the mound of Dor, with its harbours and the sea-cut rock, stands on the shore south of Haifa; the finds are in the Mizgaga museum at Nahsholim."
  ru:
    - "Нафаф-Дор — область Дора, портового города на побережье Кармила между Кесарией и Хайфой. Еврейское слово «нафа», которое русская Библия передаёт как Нафаф-Дор и Нафоф-Дор, а в одном месте как «Нафеф», неясно по смыслу: «высоты» или, может быть, «дюны»; оно употребляется только о Доре. Царь из Нафоф-Дора «к западу» примкнул к Иавину Асорскому против Иисуса Навина, а в списке побеждённых царей стоит «один царь Дора при Нафаф-Доре». Дор достался Манассии внутри удела Асира, хотя Манассия не смог изгнать его Хананеев, а при Соломоне Бен-Авинадав, которому «Тафафь, дочь Соломона, была его женою», был поставлен «над всем Нафаф-Дором», четвёртым из двенадцати округов, кормивших царский дом."
    - "Сам Дор, Тель-Дор у кибуца Нахшолим, копают с 1980 года, и он показывает всю историю побережья. В XI веке до н. э. египетский посланник Ун-Амун, ограбленный в его гавани, нашёл город во власти чекеров, одного из народов моря, под началом князя Бедера. В X веке им владел Израиль; после 732 г. до н. э. Ассирия сделала Дуру провинцией; в персидское время сидонский царь Эшмуназар хвалится на своём саркофаге, что Великий царь дал ему Дор и Иоппию, и Дор стал финикийским городом с мастерскими пурпура. Он был эллинистической крепостью, римским городом и византийской епископией, а потом сжался до деревни Тантура."
    - "Сегодня холм Дора с его гаванями и изрезанными морем скалами стоит на берегу к югу от Хайфы; находки хранятся в музее Мизгага в Нахшолиме."
