# Overview article (ADR 0007). Mainstream facts only; the identification with Tell Ma'in is undisputed; the “Maonites” of Judges 10:12 are given as probably another people, with the Greek and Synodal readings noted.
id: maon
place: a6845b1
title:
  en: "Maon"
  ru: "Маон"
  uk: "Маон"
  es: "Maón"
  pt: "Maom"
  de: "Maon"
  fr: "Maon"
