body:
  en:
    - "Maon was a town in the hill country of Judah on the edge of the wilderness, about 13 km south of Hebron, listed with Carmel, Ziph and Juttah in the district of the southern hills. It is Tell Ma'in (Horvat Ma'on), a mound beside the Palestinian village of Ma'in that keeps the name; the identification is not disputed. Below it the wilderness of Maon falls away eastward toward the Dead Sea; David was there “in the plain on the south of Jeshimon”, hiding from Saul, and he was saved only when news of a Philistine raid called the king away. Chronicles makes Maon a “son” of Shammai in the line of Caleb, that is, a Calebite settlement."
    - "Here lived Nabal: “And there was a man in Maon, whose possessions were in Carmel; and the man was very great, and he had three thousand sheep, and a thousand goats: and he was shearing his sheep in Carmel.” He answered David's request for provisions at the shearing with insults; David set out to kill every male of his house, and Abigail, Nabal's wife, met him on the way with food and with words that turned him back. Nabal died ten days later, and Abigail became David's wife. The “Maonites” of the Hebrew text, who, with the Sidonians and Amalekites, once oppressed Israel, are probably another people, the Meunites of the Arabian border whom Uzziah fought; the Greek Bible reads Midian there and the Synodal Bible Moab."
    - "Excavations at Horvat Ma'on, directed by Zvi Ilan and David Amit, uncovered a synagogue of the Byzantine period with a niche for the Torah scrolls facing Jerusalem, showing a Jewish village here in the fourth to seventh centuries AD, like Eshtemoa and Susiya nearby; Iron Age pottery on the mound attests the town of Nabal's day. Today the village of Ma'in lies in the Hebron Governorate of the West Bank south-east of Yatta, and the Israeli settlement of Ma'on, founded in 1981, stands near it."
  ru:
    - "Маон был городом в нагорье Иуды на краю пустыни, примерно в 13 км к югу от Хеврона, названным вместе с Кармилом, Зифом и Ютой в округе южных гор. Это Телль-Маин (Хорват-Маон), холм у палестинской деревни Маин, сохранившей имя; отождествление не оспаривается. Ниже к востоку, к Мёртвому морю, спускается пустыня Маон, где Давид был «на равнине, направо от Иесимона», скрываясь от Саула, и спасся лишь потому, что весть о набеге Филистимлян отозвала царя. Паралипоменон делает Маона «сыном» Шаммая из рода Халева, то есть халевитским поселением."
    - "Здесь жил Навал: «Был некто в Маоне, а имение его на Кармиле, человек очень богатый; у него было три тысячи овец и тысяча коз; и был он при стрижке овец своих на Кармиле». На просьбу Давида о припасах во время стрижки он ответил оскорблениями; Давид пошёл истребить всех мужчин его дома, и Авигея, жена Навала, встретила его на пути с едой и со словами, которые заставили его повернуть назад. Через десять дней Навал умер, и Авигея стала женой Давида. Маониты еврейского текста, которые вместе с Сидонянами и Амаликитянами когда-то угнетали Израиль, — скорее всего, другой народ, Меунитяне аравийского пограничья, с которыми воевал Озия; греческая Библия читает в этом месте Мадиам, а Синодальная — Моавитяне."
    - "Раскопки в Хорват-Маоне под руководством Цви Илана и Давида Амита открыли синагогу византийского времени с нишей для свитков Торы, обращённой к Иерусалиму, свидетельство иудейского села здесь в IV–VII веках н. э., как в соседних Ештемо и Сусии; керамика железного века на холме говорит о городе времён Навала. Сегодня деревня Маин лежит в провинции Хеврон на Западном берегу к юго-востоку от Ятты, а рядом стоит израильское поселение Маон, основанное в 1981 году."
  uk:
    - "Маон був містом у гірській країні Юди на краю пустелі, приблизно за 13 км на південь від Хеврона, названим разом з Кармелем, Зіфом і Юттою в окрузі південних пагорбів. Це Телль-Маїн (Горват-Маон), пагорб поруч із палестинським селом Маїн, що зберігає назву; ототожнення не оспорюється. Під ним пустеля Маон спускається на схід до Мертвого моря; Давид був там «у степу, на право від Есимону», ховаючись від Саула, і його врятувала лише вістка про набіг філістимлян, що відкликала царя. Книга Хронік робить Маона «сином» Шаммая в роду Калеба, тобто калебівським поселенням."
    - "Тут жив Навал: «Був же в Маонї чоловік, а майно його було в Кармелї. Чоловік той був вельми багатий; мав три тисячі овець і тисячу кіз; і був він саме на стриговинах овець своїх на Кармелї.» Він відповів образами на прохання Давида про харчі під час стрижки; Давид вирушив убити кожного чоловіка його дому, і Авігея, дружина Навала, зустріла його на дорозі з їжею і зі словами, що завернули його. Навал помер через десять днів, і Авігея стала дружиною Давида. «Маонітяни» староєврейського тексту, які разом із сидонянами й амалекитянами колись гнобили Ізраїль, імовірно, інший народ — меуніти на арабському кордоні, з якими воював Уззія; грецька Біблія читає тут Мідіан, а Синодальний — Моав."
    - "Розкопки в Горват-Маоні під керівництвом Цві Ілана й Давида Аміта відкрили синагогу візантійської доби з нішею для сувоїв Тори, зверненою до Єрусалима, що свідчить про єврейське село тут у IV–VII ст. н. е., як і в сусідніх Ештемоа та Сусії; кераміка залізної доби на пагорбі засвідчує місто часів Навала. Сьогодні село Маїн лежить у мухафазі Хеврон на Західному березі на південний схід від Ятти, а поруч стоїть ізраїльське поселення Маон, засноване 1981 р."
  es:
    - "Maón era una ciudad de la sierra de Judá, al borde del desierto, a unos 13 km al sur de Hebrón, enumerada con Carmel, Zif y Jutá en el distrito de las colinas meridionales. Es Tell Ma'in (Horvat Ma'on), un montículo junto a la aldea palestina de Ma'in que conserva el nombre; la identificación no se discute. Bajo ella el desierto de Maón desciende hacia el este, hacia el mar Muerto; David estuvo allí «en la llanura que está á la diestra del desierto», escondiéndose de Saúl, y se salvó solo cuando la noticia de una incursión filistea llamó al rey a otra parte. Crónicas hace de Maón un «hijo» de Samai en el linaje de Caleb, es decir, un asentamiento calebita."
    - "Aquí vivía Nabal: «Y en Maón había un hombre que tenía su hacienda en el Carmelo, el cual era muy rico, que tenía tres mil ovejas y mil cabras. Y aconteció hallarse esquilando sus ovejas en el Carmelo». Respondió con insultos a la petición de víveres que David le hizo en la esquila; David partió para matar a todo varón de su casa, y Abigail, la mujer de Nabal, le salió al paso con comida y con palabras que lo hicieron volver atrás. Nabal murió diez días después, y Abigail se hizo mujer de David. Los «maonitas» del texto hebreo, que, con los sidonios y los amalecitas, oprimieron en otro tiempo a Israel, son probablemente otro pueblo, los meunitas de la frontera de Arabia a quienes combatió Uzías; la Biblia griega lee allí Madián y la Biblia sinodal Moab."
    - "Las excavaciones en Horvat Ma'on, dirigidas por Zvi Ilan y David Amit, sacaron a la luz una sinagoga del período bizantino con un nicho para los rollos de la Torá orientado hacia Jerusalén, lo que muestra una aldea judía aquí en los siglos IV a VII d. C., como Estemoa y Susiya, cercanas; la cerámica de la Edad del Hierro del montículo atestigua la ciudad de los días de Nabal. Hoy la aldea de Ma'in se halla en la gobernación de Hebrón, en Cisjordania, al sudeste de Yatta, y cerca de ella se alza el asentamiento israelí de Ma'on, fundado en 1981."
  pt:
    - "Maom era uma cidade na região montanhosa de Judá, à beira do deserto, a cerca de 13 km ao sul de Hebrom, listada com Carmelo, Zife e Jutá no distrito das colinas do sul. É Tell Ma'in (Horvat Ma'on), um montículo junto à aldeia palestina de Ma'in, que conserva o nome; a identificação não é contestada. Abaixo dele o deserto de Maom desce para leste rumo ao mar Morto; Davi esteve ali “na Arabá, ao sul do deserto”, escondendo-se de Saul, e só se salvou quando a notícia de uma incursão filisteia chamou o rei para longe. As Crônicas fazem de Maom um “filho” de Samai na linhagem de Calebe, isto é, um povoado calebita."
    - "Aqui vivia Nabal: “Havia um homem em Maom que tinha as suas propriedades no Carmelo; e o homem era muito rico. Ele tinha três mil ovelhas e mil cabras; e estava tosquiando as suas ovelhas no Carmelo.” Ele respondeu com insultos ao pedido de provisões que Davi lhe fez na tosquia; Davi partiu para matar todos os homens de sua casa, e Abigail, mulher de Nabal, encontrou-o no caminho com comida e com palavras que o fizeram voltar. Nabal morreu dez dias depois, e Abigail tornou-se mulher de Davi. Os “maonitas” do texto hebraico, que, com os sidônios e os amalequitas, oprimiram Israel, são provavelmente outro povo, os meunitas da fronteira árabe a quem Uzias combateu; a Bíblia grega lê ali Midiã e a Bíblia Sinodal Moabe."
    - "Escavações em Horvat Ma'on, dirigidas por Zvi Ilan e David Amit, descobriram uma sinagoga do período bizantino com um nicho para os rolos da Torá voltado para Jerusalém, mostrando uma aldeia judaica aqui nos séculos IV a VII d.C., como Estemoa e Susiya nas proximidades; cerâmica da Idade do Ferro no montículo atesta a cidade do tempo de Nabal. Hoje a aldeia de Ma'in fica na província de Hebrom, na Cisjordânia, a sudeste de Yatta, e o assentamento israelense de Ma'on, fundado em 1981, está perto dela."
  de:
    - "Maon war eine Stadt im Bergland Judas am Rand der Wüste, etwa 13 km südlich von Hebron, zusammen mit Karmel, Sif und Juta im Bezirk der südlichen Berge aufgeführt. Es ist Tell Ma'in (Horvat Ma'on), ein Hügel neben dem palästinensischen Dorf Ma'in, das den Namen bewahrt; die Gleichsetzung ist unbestritten. Unterhalb von ihm fällt die Wüste Maon nach Osten zum Toten Meer ab; David war dort „auf dem Gefilde zur Rechten der Wüste“ und versteckte sich vor Saul, und er wurde nur gerettet, als die Nachricht von einem Überfall der Philister den König abrief. Die Chronik macht Maon zum „Sohn“ Schammais in der Linie Kalebs, das heißt zu einer kalebitischen Siedlung."
    - "Hier lebte Nabal: „Und es war ein Mann zu Maon und sein Wesen zu Karmel; und der Mann war sehr großen Vermögens und hatte dreitausend Schafe und tausend Ziegen. Und es begab sich eben, daß er seine Schafe schor zu Karmel.“ Er beantwortete Davids Bitte um Verpflegung bei der Schur mit Beleidigungen; David zog aus, jeden Mann seines Hauses zu töten, und Abigajil, Nabals Frau, begegnete ihm unterwegs mit Speise und mit Worten, die ihn umkehren ließen. Nabal starb zehn Tage später, und Abigajil wurde Davids Frau. Die „Maoniter“ des hebräischen Textes, die mit den Sidoniern und Amalekitern einst Israel bedrängten, sind wohl ein anderes Volk, die Meuniter der arabischen Grenze, gegen die Usija kämpfte; die griechische Bibel liest dort Midian und die Synodalbibel Moab."
    - "Ausgrabungen in Horvat Ma'on unter Zvi Ilan und David Amit legten eine Synagoge der byzantinischen Zeit mit einer Nische für die Torarollen in Richtung Jerusalem frei und zeigten ein jüdisches Dorf hier im 4. bis 7. Jahrhundert n. Chr., wie Eschtemoa und Susiya in der Nähe; eisenzeitliche Keramik auf dem Hügel belegt die Stadt von Nabals Tagen. Heute liegt das Dorf Ma'in im Gouvernement Hebron des Westjordanlands südöstlich von Yatta, und die 1981 gegründete israelische Siedlung Ma'on steht in seiner Nähe."
  fr:
    - "Maon était une ville de la montagne de Juda en bordure du désert, à environ 13 km au sud d’Hébron, citée avec Carmel, Ziph et Jutta dans le district des collines du sud. C’est Tell Ma’in (Horvat Ma’on), un tertre à côté du village palestinien de Ma’in qui garde le nom ; l’identification n’est pas contestée. Au-dessous, le désert de Maon descend vers l’est jusqu’à la mer Morte ; David s’y trouvait « dans la plaine au midi du désert », se cachant de Saül, et il ne fut sauvé que lorsque la nouvelle d’un raid philistin rappela le roi. Les Chroniques font de Maon un « fils » de Schammaï dans la lignée de Caleb, c’est-à-dire une implantation calébite."
    - "C’est là que vivait Nabal : « Il y avait à Maon un homme fort riche, possédant des biens à Carmel ; il avait trois mille brebis et mille chèvres, et il se trouvait à Carmel pour la tonte de ses brebis. » Il répondit par des insultes à la demande de vivres que David lui fit à la tonte ; David partit pour tuer tous les mâles de sa maison, et Abigaïl, femme de Nabal, vint à sa rencontre avec des vivres et des paroles qui le firent revenir. Nabal mourut dix jours plus tard, et Abigaïl devint la femme de David. Les « Maonites » du texte hébreu qui, avec les Sidoniens et les Amalécites, opprimèrent jadis Israël, sont probablement un autre peuple, les Meounites de la frontière arabe que combattit Ozias ; la Bible grecque lit Madian à cet endroit et la Bible synodale Moab."
    - "Les fouilles de Horvat Ma’on, dirigées par Zvi Ilan et David Amit, ont mis au jour une synagogue de l’époque byzantine avec une niche pour les rouleaux de la Torah tournée vers Jérusalem, montrant qu’un village juif s’y trouvait du IVe au VIIe siècle apr. J.-C., comme Eschthemoa et Susiya tout près ; la céramique de l’âge du Fer sur le tertre atteste la ville du temps de Nabal. Aujourd’hui, le village de Ma’in se trouve dans le gouvernorat d’Hébron, en Cisjordanie, au sud-est de Yatta, et la colonie israélienne de Maon, fondée en 1981, s’élève près de lui."
  it:
    - "Maon era una città della regione collinosa di Giuda, al margine del deserto, a circa 13 km a sud di Ebron, elencata con Carmel, Zif e Iutta nel distretto delle colline meridionali. È Tell Ma‘in (Horvat Ma‘on), un tell accanto al villaggio palestinese di Ma‘in che ne conserva il nome; l’identificazione non è contestata. Sotto di essa il deserto di Maon digrada a oriente verso il Mar Morto; Davide era là «nella pianura a mezzogiorno del deserto», nascosto a Saul, e si salvò solo quando la notizia di un’incursione filistea richiamò il re. Le Cronache fanno di Maon un «figliuolo» di Sammai nella linea di Caleb, cioè un insediamento calebita."
    - "Qui viveva Nabal: «Or v’era un uomo a Maon, che aveva i suoi beni a Carmel; era molto ricco, avea tremila pecore e mille capre, e si trovava a Carmel per la tosatura delle sue pecore». Egli rispose con insulti alla richiesta di viveri fatta da Davide per la tosatura; Davide si mise in cammino per uccidere ogni maschio della sua casa, e Abigail, moglie di Nabal, lo incontrò per via con cibo e con parole che lo fecero tornare indietro. Nabal morì dieci giorni dopo, e Abigail divenne moglie di Davide. I «Maoniti» del testo ebraico, che con i Sidoni e gli Amalechiti oppressero un tempo Israele, sono probabilmente un altro popolo, i Meuniti del confine arabico che Ozia combatté; la Bibbia greca legge là Madian e la Bibbia sinodale Moab."
    - "Gli scavi a Horvat Ma‘on, diretti da Zvi Ilan e David Amit, hanno portato alla luce una sinagoga del periodo bizantino con una nicchia per i rotoli della Torah rivolta verso Gerusalemme, che mostra un villaggio ebraico qui nei secoli dal IV al VII d.C., come Estemoa e Susiya nelle vicinanze; la ceramica dell’età del Ferro sul tell attesta la città dei giorni di Nabal. Oggi il villaggio di Ma‘in si trova nel governatorato di Ebron in Cisgiordania a sud-est di Yatta, e presso di esso sorge l’insediamento israeliano di Ma‘on, fondato nel 1981."
  pl:
    - "Maon było miastem w judzkich górach na skraju pustyni, około 13 km na południe od Hebronu, wymienionym z Karmelem, Zifem i Juttą w okręgu południowych wzgórz. To Tell Ma'in (Horvat Ma'on), kopiec obok palestyńskiej wsi Ma'in, która zachowuje nazwę; utożsamienie nie jest kwestionowane. Poniżej niego pustynia Maon opada na wschód ku Morzu Martwemu; Dawid był tam „w polach po prawej stronie Jesymon”, ukrywając się przed Saulem, i został uratowany tylko wtedy, gdy wieść o najeździe Filistynów odwołała króla. Księga Kronik czyni Maon „synem” Szammaja w linii Kaleba, to znaczy osadą kalebicką."
    - "Tu mieszkał Nabal: „A był niektóry mąż w Maon, który miał majętność na Karmelu; a on mąż był możny bardzo, mając owiec trzy tysiące, a tysiąc kóz; i trafiło się, że strzygł owce swoje na Karmelu.” Odpowiedział na prośbę Dawida o zaopatrzenie podczas strzyży obelgami; Dawid wyruszył, by zabić każdego mężczyznę z jego domu, a Abigail, żona Nabala, spotkała go w drodze z jedzeniem i słowami, które go zawróciły. Nabal umarł dziesięć dni później, a Abigail została żoną Dawida. „Maonici” tekstu hebrajskiego, którzy wraz z Sydończykami i Amalekitami uciskali kiedyś Izraela, to prawdopodobnie inny lud, Meunici z arabskiej granicy, z którymi walczył Uzzjasz; grecka Biblia czyta tam Madian, a Biblia synodalna Moab."
    - "Wykopaliska w Horvat Ma'on, prowadzone przez Zvi Ilana i Davida Amita, odsłoniły synagogę z okresu bizantyjskiego z niszą na zwoje Tory zwróconą ku Jerozolimie, co wskazuje na żydowską wieś w IV–VII w. n.e., jak pobliskie Esztemoa i Susiya; ceramika z epoki żelaza na kopcu świadczy o mieście z czasów Nabala. Dziś wieś Ma'in leży w muhafazie Hebron na Zachodnim Brzegu na południowy wschód od Yatty, a niedaleko stoi izraelska osada Ma'on, założona w 1981 r."
  nl:
    - "Maön was een stad in het bergland van Juda aan de rand van de woestijn, zo'n 13 km ten zuiden van Hebron, genoemd met Karmel, Zif en Juta in het district van de zuidelijke heuvels. Het is Tell Ma'in (Horvat Ma'on), een heuvel naast het Palestijnse dorp Ma'in dat de naam bewaart; de identificatie wordt niet betwist. Daaronder loopt de woestijn van Maön naar het oosten af richting de Dode Zee; David was daar “in het vlakke veld, aan de rechterhand der wildernis”, op de vlucht voor Saul, en hij werd alleen gered doordat het nieuws van een Filistijnse inval de koning wegriep. Kronieken maakt Maön tot een “zoon” van Sammai in het geslacht van Kaleb, dat wil zeggen een Kalebitische nederzetting."
    - "Hier woonde Nabal: “En er was een man te Maon, en zijn bedrijf was te Karmel; en die man was zeer groot, en hij had drie duizend schapen, en duizend geiten; en hij was in het scheren zijner schapen te Karmel.” Hij beantwoordde Davids verzoek om voorraden bij het scheerfeest met beledigingen; David trok erop uit om elke man van zijn huis te doden, en Abigaïl, Nabals vrouw, ontmoette hem onderweg met voedsel en met woorden die hem deden terugkeren. Nabal stierf tien dagen later, en Abigaïl werd Davids vrouw. De “Maonieten” van de Hebreeuwse tekst, die samen met de Sidoniërs en Amalekieten Israël eens onderdrukten, zijn waarschijnlijk een ander volk, de Meunieten van de Arabische grens met wie Uzzia streed; de Griekse Bijbel leest daar Midian en de Synodale Bijbel Moab."
    - "Opgravingen bij Horvat Ma'on, onder leiding van Zvi Ilan en David Amit, legden een synagoge uit de Byzantijnse tijd bloot met een nis voor de Torarollen gericht naar Jeruzalem, wat een joods dorp hier laat zien in de vierde tot zevende eeuw n.Chr., net als nabijgelegen Estemoa en Susiya; aardewerk uit de ijzertijd op de heuvel getuigt van de stad uit Nabals tijd. Tegenwoordig ligt het dorp Ma'in in het gouvernement Hebron op de Westoever ten zuidoosten van Yatta, en de Israëlische nederzetting Ma'on, gesticht in 1981, ligt er dicht bij."
  cs:
    - "Maon bylo město v judských horách na okraji pouště, asi 13 km jižně od Hebronu, uvedené s Karmelem, Zífem a Jutou v okrsku jižních hor. Je to Tell Ma'in (Horvat Ma'on), pahorek u palestinské vesnice Ma'in, která jméno zachovává; určení není sporné. Pod ním padá poušť Maon na východ k Mrtvému moři; David tam byl „na rovinách po pravé straně pouště“, ukrývaje se před Saulem, a zachránilo ho jen to, že zpráva o pelištejském vpádu odvolala krále. Kroniky praví: „Syn pak Sammai byl Maon“, tedy kálebovské osídlení."
    - "Tu žil Nábal: „Člověk pak nějaký byl v Maon, kterýž statek svůj měl na Karmeli. A byl člověk ten možný velmi, nebo měl tři tisíce ovec a tisíc koz, a tehdáž rovně střihl ovce své na Karmeli.“ Na Davidovu žádost o zásoby při střižbě odpověděl urážkami; David se vydal zabít každého mužského z jeho domu a Abigajil, Nábalova žena, ho potkala cestou s jídlem a se slovy, která ho obrátila zpět. Nábal zemřel o deset dní později a Abigajil se stala Davidovou ženou. „Maonitští“ hebrejského textu, kteří spolu se Sidonskými a Amalekitskými kdysi sužovali Izraele, jsou nejspíše jiný národ, Meunité na arabské hranici, s nimiž bojoval Uzijáš; řecká Bible zde čte Midján a synodální Bible Moáb."
    - "Vykopávky v Horvat Ma'on, řízené Zvim Ilanem a Davidem Amitem, odkryly synagogu z byzantské doby s výklenkem pro svitky Tóry obráceným k Jeruzalému, což ukazuje židovskou vesnici zde ve 4. až 7. století n. l., stejně jako blízké Eštemoa a Susiya; keramika z doby železné na pahorku dosvědčuje město z Nábalových dnů. Dnes leží vesnice Ma'in v guvernorátu Hebron na Západním břehu jihovýchodně od Yatty a poblíž stojí izraelská osada Ma'on, založená roku 1981."
  sv:
    - "Maon var en stad i Judas bergsbygd vid öknens kant, omkring 13 km söder om Hebron, upptagen med Karmel, Sif och Jutta i distriktet i de södra bergen. Det är Tell Ma'in (Horvat Ma'on), en kulle intill den palestinska byn Ma'in som bevarar namnet; identifieringen är obestridd. Nedanför faller Maons öken av österut mot Döda havet; David var där ”på hedmarken, söder om ödemarken”, gömd för Saul, och räddades först när nyheten om ett filisteiskt plundringståg kallade bort kungen. Krönikeböckerna gör Maon till en ”son” till Shammaj i Kalevs släkt, det vill säga en kalevitisk bosättning."
    - "Här bodde Naval: ”I Maon fanns då en man som hade sin boskapsskötsel i Karmel, och den mannen var mycket rik; han ägde tre tusen får och ett tusen getter. Och han höll just då på att klippa sina får i Karmel.” Han besvarade Davids begäran om förnödenheter vid fåraklippningen med förolämpningar; David gav sig av för att döda varje man i hans hus, och Avigajil, Navals hustru, mötte honom på vägen med mat och med ord som fick honom att vända om. Naval dog tio dagar senare, och Avigajil blev Davids hustru. ”Maoniterna” i den hebreiska texten, som tillsammans med sidonierna och amalekiterna en gång förtryckte Israel, är sannolikt ett annat folk, meuniterna vid den arabiska gränsen som Ussia stred mot; den grekiska Bibeln läser där Midjan och Synodalbibeln Moab."
    - "Utgrävningar vid Horvat Ma'on, ledda av Zvi Ilan och David Amit, fann en synagoga från bysantinsk tid med en nisch för torarullarna vänd mot Jerusalem, vilket visar en judisk by här under 300- till 600-talen e.Kr., liksom Eshtemoa och Susiya i närheten; krukskärvor från järnåldern på kullen vittnar om Navals tids stad. I dag ligger byn Ma'in i Hebrons guvernement på Västbanken sydost om Yatta, och den israeliska bosättningen Ma'on, grundad 1981, ligger nära den."
  nb:
    - "Maon var en by i fjellandet i Juda i utkanten av ørkenen, omkring 13 km sør for Hebron, oppført sammen med Karmel, Sif og Jutta i distriktet i de sørlige åsene. Det er Tell Ma'in (Horvat Ma'on), en haug ved siden av den palestinske landsbyen Ma'in som har beholdt navnet; identifikasjonen er ubestridt. Under den faller Maons ørken av mot øst ned mot Dødehavet; David var der «på den øde mark sønnenfor ørkenen» og skjulte seg for Saul, og han ble berget bare da nyheten om et filistrisk innfall kalte kongen bort. Krønikebøkene gjør Maon til en «sønn» av Sjammai i Kalebs linje, det vil si en kalebittisk bosetning."
    - "Her bodde Nabal: «I Maon var det en mann som hadde sin buskap i Karmel. Det var en meget rik mann; han eide tre tusen får og tusen gjeter. Han holdt just på å klippe sine får i Karmel.» Han svarte på Davids forespørsel om forsyninger ved saueklippingen med fornærmelser; David la ut for å drepe alle av mannkjønn i hans hus, og Abigajil, Nabals hustru, møtte ham på veien med mat og med ord som fikk ham til å snu. Nabal døde ti dager senere, og Abigajil ble Davids hustru. Maonittene i den hebraiske teksten, som sammen med sidonierne og amalekittene en gang undertrykte Israel, er trolig et annet folk, meunittene ved den arabiske grensen som Ussia kjempet mot; den greske Bibelen har Midjan der og synodalbibelen Moab."
    - "Utgravninger ved Horvat Ma'on, ledet av Zvi Ilan og David Amit, avdekket en synagoge fra bysantinsk tid med en nisje for Torarullene vendt mot Jerusalem, som viser en jødisk landsby her på 300- til 600-tallet e.Kr., som Esjtemoa og Susiya i nærheten; keramikk fra jernalderen på haugen bekrefter byen fra Nabals dager. I dag ligger landsbyen Ma'in i Hebron-guvernementet på Vestbredden sørøst for Yatta, og den israelske bosetningen Ma'on, grunnlagt i 1981, ligger i nærheten."
  tl:
    - "Ang Maon ay bayan sa maburol na lupain ng Juda sa gilid ng ilang, mga 13 km sa timog ng Hebron, na nakatala kasama ng Carmel, Ziph at Juta sa distrito ng katimugang mga burol. Ito ang Tell Ma'in (Horvat Ma'on), isang burol sa tabi ng nayong Palestino ng Ma'in na nag-iingat ng pangalan; hindi pinagtatalunan ang pagkakakilanlan. Sa ibaba nito ay bumababa pasilangan ang ilang ng Maon patungo sa Dagat na Patay; naroon si David, kasama ang kaniyang mga tao, “sa Araba sa timugan ng ilang”, nagtatago kay Saul, at nailigtas lamang siya nang tawagin ang hari ng balita tungkol sa pagsalakay ng mga Filisteo. Ginagawa ng Mga Cronica ang Maon na “anak” ni Sammai sa angkan ni Caleb, ibig sabihin, isang pamayanang Calebita."
    - "Dito nanirahan si Nabal: “At may isang lalake sa Maon, na ang mga pag-aari ay nasa Carmelo; at ang lalake ay lubhang dakila, at siya'y mayroong tatlong libong tupa, at isang libong kambing; at kaniyang ginugupitan ng balahibo ang kaniyang tupa sa Carmelo.” Sinagot niya ng mga insulto ang kahilingan ni David ng pagkain sa panahon ng paggugupit; umalis si David upang patayin ang bawat lalaki ng kaniyang sambahayan, at sinalubong siya ni Abigail, asawa ni Nabal, sa daan na may pagkain at mga salitang nagpabalik sa kaniya. Namatay si Nabal makalipas ang sampung araw, at naging asawa ni David si Abigail. Ang “mga Maonita” ng tekstong Hebreo, na kasama ng mga Sidonio at Amalecita ay minsang pumighati sa Israel, ay marahil ibang bayan, ang mga Meunita sa hangganan ng Arabia na nilabanan ni Uzzias; ang Biblia sa Griyego ay bumabasa ng Midian doon at ang Synodal Bible ng Moab."
    - "Ang mga paghuhukay sa Horvat Ma'on, sa direksiyon nina Zvi Ilan at David Amit, ay nakatuklas ng isang sinagoga ng panahong Bizantino na may hukay para sa mga balumbon ng Torah na nakaharap sa Jerusalem, na nagpapakita ng isang nayong Judio rito noong ika-4 hanggang ika-7 siglo AD, tulad ng Estemoa at Susiya sa malapit; ang palayok ng Panahon ng Bakal sa burol ay nagpapatunay sa bayan noong panahon ni Nabal. Ang nayon ng Ma'in ngayon ay nasa Hebron Governorate ng West Bank sa timog-silangan ng Yatta, at ang pamayanang Israeli ng Ma'on, na itinatag noong 1981, ay nakatayo sa malapit."
  da:
    - "Maon var en by i Judas bjergland ved ørkenens rand, omkring 13 km syd for Hebron, opført sammen med Karmel, Zif og Jutta i distriktet i de sydlige højder. Det er Tell Ma'in (Horvat Ma'on), en høj ved siden af den palæstinensiske landsby Ma'in, der bevarer navnet; identifikationen er ikke omstridt. Under den falder Maons ørken af mod øst mod Det Døde Hav; David var dér »i Maons Ørk paa den slette Mark, til højre for Jesimon«, skjult for Saul, og han blev kun reddet, da nyheden om et filisterangreb kaldte kongen bort. Krønikebøgerne gør Maon til en »søn« af Sjammaj i Kalebs slægt, det vil sige en kalebitisk bosættelse."
    - "Her boede Nabal: »der var en Mand i Maon, og han havde sin Bedrift paa Karmel, og samme Mand var meget rig, og han havde tre Tusinde Faar og Tusinde Geder; og han klippede netop sine Faar ved Karmel.« Han besvarede Davids anmodning om forsyninger ved fåreklipningen med fornærmelser; David drog ud for at dræbe alle mænd i hans hus, og Abigajil, Nabals hustru, mødte ham på vejen med mad og med ord, der fik ham til at vende om. Nabal døde ti dage senere, og Abigajil blev Davids hustru. »Maon« i den hebraiske tekst, som sammen med sidonierne og amalekitterne engang undertrykte Israel, er sandsynligvis et andet folk, meunitterne ved den arabiske grænse, som Uzzija bekæmpede; den græske bibel læser dér Midjan og synodalbibelen Moab."
    - "Udgravninger ved Horvat Ma'on, ledet af Zvi Ilan og David Amit, afdækkede en synagoge fra den byzantinske tid med en niche til Toraruller vendt mod Jerusalem, der viser en jødisk landsby her i 300-tallet til 600-tallet e.Kr., ligesom Esjtemoa og Susiya i nærheden; jernalderkeramik på højen vidner om byen i Nabals dage. I dag ligger landsbyen Ma'in i Hebron-guvernementet på Vestbredden sydøst for Yatta, og den israelske bosættelse Ma'on, grundlagt i 1981, ligger nær den."
  sr:
    - "Маон је био град у јудејском горју на ободу пустиње, око 13 км јужно од Хеврона, наведен с Кармилом, Зифом и Јутом у округу јужних брда. То је Тел Маин (Хорват Маон), хумка поред палестинског села Маин које чува име; идентификација није спорна. Испод ње пустиња Маон спушта се на исток према Мртвом мору; Давид је ту био „у равници надесно од Гесимона“, скривајући се од Саула, а спасла га је само вест о филистејском налету која је цара позвала одатле. Дневници чине Маона „сином“ Самајевим у Халевовој лози, то јест халевовским насељем."
    - "Овде је живео Навал: „А беше један човек у Маону, а стока му беше на Кармилу; и беше човек врло богат, јер имаше три хиљаде оваца и хиљаду коза, и тада стрижаше овце своје на Кармилу.“ На Давидову молбу за намирнице о стрижи одговорио је увредама; Давид је кренуо да побије све мушко у његовој кући, а Авигеја, Навалова жена, срела га је на путу с храном и речима које су га вратиле. Навал је умро десет дана касније, а Авигеја је постала Давидова жена. „Маонци“ хебрејског текста, који су са Сидонцима и Амаличанима некада тлачили Израиља, вероватно су други народ, Меунити са арапске границе против којих је ратовао Озија; грчка Библија ту чита Мадијам, а Синодална Моав."
    - "Ископавања у Хорват Маону, под вођством Цвија Илана и Давида Амита, открила су синагогу из византијског раздобља са нишом за свитке Торе окренутом према Јерусалиму, што показује јеврејско село овде у IV–VII веку н. е., као у оближњим Естемоји и Сусији; керамика гвозденог доба на хумци сведочи о граду из Навалових дана. Данас село Маин лежи у Хевронском гувернорату Западне обале југоисточно од Јате, а израелско насеље Маон, основано 1981, стоји близу њега."
  hu:
    - "Maón város volt Júda hegyvidékén, a puszta szélén, Hebrontól mintegy 13 km-re délre, Kármellel, Ziffel és Juttával együtt a déli hegyek kerületében sorolták fel. Ez a Tell Ma'in (Horvat Ma'on), a nevet megőrző palesztin Ma'in falu melletti halom; az azonosítás nem vitatott. Alatta a Maón pusztája kelet felé ereszkedik a Holt-tenger felé; Dávid itt volt „Máon pusztájában … a mezőségen, a mely a sivatagtól jobbkézre van”, Saul elől bujkálva, és csak azért menekült meg, mert egy filiszteus betörés híre elszólította a királyt. A Krónikák Maónt Sammai „fiává” teszi Káleb ágában, vagyis kálebita településnek."
    - "Itt élt Nábál: „És volt egy ember Máonban, a kinek jószága Kármelben vala, és ez igen tehetős ember volt: háromezer juha és ezer kecskéje volt néki. És Kármelben épen juhait nyírta.” A nyíráskor Dávid élelemkérésére sértésekkel felelt; Dávid elindult, hogy házának minden férfiját megölje, és Abigail, Nábál felesége, élelemmel és visszafordító szavakkal találkozott vele az úton. Nábál tíz nappal később meghalt, és Abigail Dávid felesége lett. A héber szövegben szereplő „maóniak”, akik a szidóniakkal és az amálekitákkal egykor sanyargatták Izráelt, valószínűleg más nép, az arab határ meunitjai, akik ellen Uzziás harcolt; a görög Biblia itt Midiánt olvas, a szinodális Moábot."
    - "A Horvat Ma'onnál Zvi Ilan és David Amit vezette ásatások bizánci kori zsinagógát tártak fel Jeruzsálem felé néző fülkével a Tóra-tekercseknek, ami zsidó falut mutat itt a Kr. u. 4–7. században, mint a közeli Estemoa és Szúszija; a halmon talált vaskori kerámia Nábál napjainak városát igazolja. Ma Ma'in falu Ciszjordánia Hebroni kormányzóságában fekszik, Yattától délkeletre, közelében áll az 1981-ben alapított izraeli Ma'on település."
  fi:
    - "Maon oli kaupunki Juudan vuoristossa erämaan reunalla, noin 13 km Hebronista etelään, mainittu Karmelin, Sifin ja Juttan kanssa eteläisten kukkuloiden piirin luettelossa. Se on Tell Ma'in (Horvat Ma'on), kumpu nimen säilyttäneen palestiinalaiskylän Ma'inin vieressä; tunnistuksesta ei kiistellä. Sen alapuolella Maonin erämaa laskeutuu itään kohti Kuollutta merta; Daavid oli siellä ”aromaassa, kallioerämaasta etelään”, piilossa Saulilta, ja hän pelastui vasta, kun uutinen filistealaisten ryöstöretkestä kutsui kuninkaan pois. Aikakirjat tekevät Maonista Sammain ”pojan” Kalebin suvussa, eli kalebilaisen asutuksen."
    - "Täällä asui Nabal: ”Ja Maaonissa oli mies, jolla oli karjataloutensa Karmelissa, ja se mies oli hyvin rikas: hänellä oli kolmetuhatta lammasta ja tuhat vuohta. Ja hän oli keritsemässä lampaitansa Karmelissa.” Hän vastasi Daavidin pyyntöön muonasta keritsemisjuhlan aikaan loukkauksilla; Daavid lähti tappamaan jokaisen hänen talonsa miespuolisen, ja Abigail, Nabalin vaimo, kohtasi hänet matkalla ruoan ja sanojen kanssa, jotka kääntivät hänet takaisin. Nabal kuoli kymmenen päivää myöhemmin, ja Abigailista tuli Daavidin vaimo. Heprealaisen tekstin ”maaonilaiset”, jotka siidonilaisten ja amalekilaisten kanssa kerran sortivat Israelia, ovat luultavasti toinen kansa, Arabian rajan meunilaiset, joita vastaan Ussia taisteli; kreikkalainen Raamattu lukee tässä Midianin ja Synodaalinen Raamattu Moabin."
    - "Zvi Ilanin ja David Amitin johtamat Horvat Ma'onin kaivaukset paljastivat bysanttilaisen ajan synagogan, jossa oli Jerusalemiin päin suunnattu syvennys Toora-kääröille, mikä osoittaa täällä olleen juutalaisen kylän 300–600-luvuilla jaa., kuten läheisissä Estemoassa ja Susiyassa; rautakautinen keramiikka kummulla todistaa Nabalin ajan kaupungista. Nykyään Ma'inin kylä sijaitsee Länsirannan Hebronin kuvernementissa Yattasta kaakkoon, ja vuonna 1981 perustettu Israelin Ma'onin siirtokunta on sen lähellä."
  vi:
    - "Ma-ôn là một thành trong xứ đồi núi Giu-đa ở rìa đồng vắng, cách Hếp-rôn khoảng 13 km về phía nam, được liệt kê cùng Cạt-mên, Xíp và Giu-ta trong khu vực các đồi phía nam. Đó là Tell Ma'in (Horvat Ma'on), một gò bên làng Palestine Ma'in còn giữ tên; việc đồng nhất không bị tranh cãi. Phía dưới, đồng vắng Ma-ôn đổ xuống phía đông hướng về Biển Chết; Đa-vít ở đó “tại A-ra-ba về phía nam Giê-si-môn”, trốn Sau-lơ, và chỉ được cứu khi tin về cuộc đột kích của người Phi-li-tin gọi vua đi. Sách Sử ký coi Ma-ôn là con của Sa-mai trong dòng Ca-lép, tức là một khu định cư của dòng Ca-lép."
    - "Na-banh sống ở đây: “có một người ở Ma-ôn, còn sản nghiệp nó thì ở Cạt-mên. Người rất giàu, có ba ngàn chiên, và một ngàn dê; người đang ở Cạt-mên đặng hớt lông chiên mình”. Ông đáp lời xin lương thực của Đa-vít trong mùa hớt lông bằng những lời sỉ nhục; Đa-vít lên đường giết mọi người nam của nhà ông, và A-bi-ga-in, vợ Na-banh, gặp ông dọc đường với thức ăn và những lời khiến ông quay lại. Na-banh chết mười ngày sau, và A-bi-ga-in trở thành vợ Đa-vít. “Dân Ma-ôn” trong bản Hê-bơ-rơ, cùng với người Si-đôn và A-ma-léc từng hà hiếp Y-sơ-ra-ên, có lẽ là một dân khác, người Meunim ở biên giới Ả Rập mà Ô-xia đã đánh; bản Hy Lạp đọc là Ma-đi-an ở đó và bản Synodal đọc là Mô-áp."
    - "Các cuộc khai quật tại Horvat Ma'on, do Zvi Ilan và David Amit chỉ đạo, phát lộ một nhà hội thời Byzantine với một hốc cho các cuộn Torah hướng về Giê-ru-sa-lem, cho thấy một làng Do Thái ở đây từ thế kỷ 4 đến 7, như Ê-thê-mô-a và Susiya gần đó; đồ gốm thời Đồ Sắt trên gò chứng thực thành của thời Na-banh. Ngày nay làng Ma'in nằm trong tỉnh Hebron của Bờ Tây, phía đông nam Yatta, và khu định cư Israel Ma'on, lập năm 1981, đứng gần đó."
  ro:
    - "Maon era o cetate din regiunea muntoasă a lui Iuda, la marginea pustiei, la circa 13 km sud de Hebron, înscrisă împreună cu Carmel, Zif și Iuta în districtul dealurilor de sud. Este Tell Ma'in (Horvat Ma'on), o movilă lângă satul palestinian Ma'in care păstrează numele; identificarea nu este contestată. Sub ea, pustia Maonului coboară spre est către Marea Moartă; David s-a aflat acolo „spre apus deadreapta Iesemonului”, ascunzându-se de Saul, și a fost salvat doar când vestea unei incursiuni filistene l-a chemat pe rege în altă parte. Cronicile fac din Maon un „fiu” al lui Șamai în linia lui Caleb, adică o așezare calebită."
    - "Aici locuia Nabal: „Și erà un om în Maon, și turmele lui în Karmil, și omul acela erà bogat foarte, și aveà trei mii de oi și o mie de capre, și a fost când tundeà el oile sale în Karmil”. A răspuns cererii lui David de provizii, la tunsul oilor, cu insulte; David a pornit să ucidă toți bărbații casei lui, iar Abigail, soția lui Nabal, l-a întâmpinat pe drum cu mâncare și cu cuvinte care l-au întors. Nabal a murit zece zile mai târziu, iar Abigail a devenit soția lui David. „Maoniții” din textul ebraic, care, împreună cu sidonienii și amaleciții, l-au asuprit cândva pe Israel, sunt probabil un alt popor, meuniții de la granița Arabiei cu care s-a luptat Ozia; Biblia greacă citește acolo Madian, iar Biblia sinodală Moab."
    - "Săpăturile de la Horvat Ma'on, conduse de Zvi Ilan și David Amit, au scos la lumină o sinagogă din perioada bizantină, cu o nișă pentru sulurile Torei orientată spre Ierusalim, ceea ce arată un sat evreiesc aici în secolele IV–VII d.Hr., ca Eștemoa și Susiya din apropiere; ceramica din epoca fierului de pe movilă atestă cetatea din vremea lui Nabal. Astăzi satul Ma'in se află în guvernoratul Hebron din Cisiordania, la sud-est de Yatta, iar așezarea israeliană Ma'on, întemeiată în 1981, se află în apropiere."
  bg:
    - "Маон е бил град в Юдейските планини на края на пустинята, на около 13 км южно от Хеврон, изброен заедно с Кармил, Зиф и Юта в областта на южните възвишения. Това е Тел Маин (Хорват Маон) — хълм до палестинското село Маин, което пази името; отъждествяването не се оспорва. Под него Маонската пустиня се спуска на изток към Мъртво море; Давид беше там, „на полето към юг от Иесимон“, като се криеше от Саул, и беше спасен едва когато вест за филистимски набег отзова царя. Летописи правят Маон „син“ на Шамай от рода на Халев, тоест халевско селище."
    - "Тук живееше Навал: „И имаше един человек в Маон на когото работата беше на Кармил; и този человек беше много голям, и имаше три тисящи овци и тисяща кози; и стрижеше овците си на Кармил.“ На молбата на Давид за провизии по време на стригането той отговори с обиди; Давид тръгна да избие всеки мъж от дома му, а Авигея, жената на Навал, го пресрещна по пътя с храна и с думи, които го върнаха. Навал умря десет дни по-късно и Авигея стана жена на Давид. „Маонците“ от еврейския текст, които заедно със сидонците и амаликитците някога потискали Израил, вероятно са друг народ — меунците от арабската граница, с които воювал Узия; гръцката Библия чете там Мадиам, а Синодалната — Моав."
    - "Разкопките в Хорват Маон, ръководени от Цви Илан и Давид Амит, разкриват синагога от византийския период с ниша за свитъците на Тората, обърната към Йерусалим, което показва юдейско село тук през IV–VII в. н.е., подобно на близките Ештемоа и Сусия; керамиката от желязната епоха на хълма свидетелства за града от времето на Навал. Днес село Маин е в Хевронската губерния на Западния бряг, югоизточно от Ята, а до него се намира израелското селище Маон, основано през 1981 г."
