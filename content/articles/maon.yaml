# Overview article (ADR 0007). Mainstream facts only; the identification with Tell Ma'in is undisputed; the “Maonites” of Judges 10:12 are given as probably another people, with the Greek and Synodal readings noted.
id: maon
place: a6845b1
title:
  en: "Maon"
  ru: "Маон"
  uk: "Маон"
  es: "Maón"
  pt: "Maom"
  de: "Maon"
  fr: "Maon"
body:
  en:
    - "Maon was a town in the hill country of Judah on the edge of the wilderness, about 13 km south of Hebron, listed with Carmel, Ziph and Juttah in the district of the southern hills. It is Tell Ma'in (Horvat Ma'on), a mound beside the Palestinian village of Ma'in that keeps the name; the identification is not disputed. Below it the wilderness of Maon falls away eastward toward the Dead Sea; David was there “in the plain on the south of Jeshimon”, hiding from Saul, and he was saved only when news of a Philistine raid called the king away. Chronicles makes Maon a “son” of Shammai in the line of Caleb, that is, a Calebite settlement."
    - "Here lived Nabal: “And there was a man in Maon, whose possessions were in Carmel; and the man was very great, and he had three thousand sheep, and a thousand goats: and he was shearing his sheep in Carmel.” He answered David's request for provisions at the shearing with insults; David set out to kill every male of his house, and Abigail, Nabal's wife, met him on the way with food and with words that turned him back. Nabal died ten days later, and Abigail became David's wife. The “Maonites” of the Hebrew text, who, with the Sidonians and Amalekites, once oppressed Israel, are probably another people, the Meunites of the Arabian border whom Uzziah fought; the Greek Bible reads Midian there and the Synodal Bible Moab."
    - "Excavations at Horvat Ma'on in 1987–1988, directed by Zvi Ilan and David Amit, uncovered a synagogue of the Byzantine period with a niche for the Torah scrolls facing Jerusalem and a ritual bath beside it, showing a Jewish village here in the fourth to seventh centuries AD, like Eshtemoa and Susiya nearby; Iron Age pottery on the mound attests the town of Nabal's day. Today the village of Ma'in lies in the Hebron Governorate of the West Bank south-east of Yatta, and the Israeli settlement of Ma'on, founded in 1981, stands near it."
  ru:
    - "Маон был городом в нагорье Иуды на краю пустыни, примерно в 13 км к югу от Хеврона, названным вместе с Кармилом, Зифом и Ютой в округе южных гор. Это Телль-Маин (Хорват-Маон), холм у палестинской деревни Маин, сохранившей имя; отождествление не оспаривается. Ниже к востоку, к Мёртвому морю, спускается пустыня Маон, где Давид был «на равнине, направо от Иесимона», скрываясь от Саула, и спасся лишь потому, что весть о набеге Филистимлян отозвала царя. Паралипоменон делает Маона «сыном» Шаммая из рода Халева, то есть халевитским поселением."
    - "Здесь жил Навал: «Был некто в Маоне, а имение его на Кармиле, человек очень богатый; у него было три тысячи овец и тысяча коз; и был он при стрижке овец своих на Кармиле». На просьбу Давида о припасах во время стрижки он ответил оскорблениями; Давид пошёл истребить всех мужчин его дома, и Авигея, жена Навала, встретила его на пути с едой и со словами, которые заставили его повернуть назад. Через десять дней Навал умер, и Авигея стала женой Давида. Маониты еврейского текста, которые вместе с Сидонянами и Амаликитянами когда-то угнетали Израиль, — скорее всего, другой народ, Меунитяне аравийского пограничья, с которыми воевал Озия; греческая Библия читает в этом месте Мадиам, а Синодальная — Моавитяне."
    - "Раскопки в Хорват-Маоне в 1987–1988 годах под руководством Цви Илана и Давида Амита открыли синагогу византийского времени с нишей для свитков Торы, обращённой к Иерусалиму, и миквой рядом, свидетельство иудейского села здесь в IV–VII веках н. э., как в соседних Ештемо и Сусии; керамика железного века на холме говорит о городе времён Навала. Сегодня деревня Маин лежит в провинции Хеврон на Западном берегу к юго-востоку от Ятты, а рядом стоит израильское поселение Маон, основанное в 1981 году."
  uk:
    - "Маон був містом у гірській країні Юди на краю пустелі, приблизно за 13 км на південь від Хеврона, названим разом з Кармелем, Зіфом і Юттою в окрузі південних пагорбів. Це Телль-Маїн (Горват-Маон), пагорб поруч із палестинським селом Маїн, що зберігає назву; ототожнення не оспорюється. Під ним пустеля Маон спускається на схід до Мертвого моря; Давид був там «у степу, на право від Есимону», ховаючись від Саула, і його врятувала лише вістка про набіг філістимлян, що відкликала царя. Книга Хронік робить Маона «сином» Шаммая в роду Калеба, тобто калебівським поселенням."
    - "Тут жив Навал: «Був же в Маонї чоловік, а майно його було в Кармелї. Чоловік той був вельми багатий; мав три тисячі овець і тисячу кіз; і був він саме на стриговинах овець своїх на Кармелї.» Він відповів образами на прохання Давида про харчі під час стрижки; Давид вирушив убити кожного чоловіка його дому, і Авігея, дружина Навала, зустріла його на дорозі з їжею і зі словами, що завернули його. Навал помер через десять днів, і Авігея стала дружиною Давида. «Маонітяни» староєврейського тексту, які разом із сидонянами й амалекитянами колись гнобили Ізраїль, імовірно, інший народ — меуніти на арабському кордоні, з якими воював Уззія; грецька Біблія читає тут Мідіан, а Синодальний — Моав."
    - "Розкопки в Горват-Маоні 1987–1988 рр. під керівництвом Цві Ілана й Давида Аміта відкрили синагогу візантійської доби з нішею для сувоїв Тори, зверненою до Єрусалима, і ритуальною купіллю поруч, що свідчить про єврейське село тут у IV–VII ст. н. е., як і в сусідніх Ештемоа та Сусії; кераміка залізної доби на пагорбі засвідчує місто часів Навала. Сьогодні село Маїн лежить у мухафазі Хеврон на Західному березі на південний схід від Ятти, а поруч стоїть ізраїльське поселення Маон, засноване 1981 р."
  es:
    - "Maón era una ciudad de la sierra de Judá, al borde del desierto, a unos 13 km al sur de Hebrón, enumerada con Carmel, Zif y Jutá en el distrito de las colinas meridionales. Es Tell Ma'in (Horvat Ma'on), un montículo junto a la aldea palestina de Ma'in que conserva el nombre; la identificación no se discute. Bajo ella el desierto de Maón desciende hacia el este, hacia el mar Muerto; David estuvo allí «en la llanura que está á la diestra del desierto», escondiéndose de Saúl, y se salvó solo cuando la noticia de una incursión filistea llamó al rey a otra parte. Crónicas hace de Maón un «hijo» de Samai en el linaje de Caleb, es decir, un asentamiento calebita."
    - "Aquí vivía Nabal: «Y en Maón había un hombre que tenía su hacienda en el Carmelo, el cual era muy rico, que tenía tres mil ovejas y mil cabras. Y aconteció hallarse esquilando sus ovejas en el Carmelo». Respondió con insultos a la petición de víveres que David le hizo en la esquila; David partió para matar a todo varón de su casa, y Abigail, la mujer de Nabal, le salió al paso con comida y con palabras que lo hicieron volver atrás. Nabal murió diez días después, y Abigail se hizo mujer de David. Los «maonitas» del texto hebreo, que, con los sidonios y los amalecitas, oprimieron en otro tiempo a Israel, son probablemente otro pueblo, los meunitas de la frontera de Arabia a quienes combatió Uzías; la Biblia griega lee allí Madián y la Biblia sinodal Moab."
    - "Las excavaciones en Horvat Ma'on en 1987–1988, dirigidas por Zvi Ilan y David Amit, sacaron a la luz una sinagoga del período bizantino con un nicho para los rollos de la Torá orientado hacia Jerusalén y un baño ritual junto a ella, lo que muestra una aldea judía aquí en los siglos IV a VII d. C., como Estemoa y Susiya, cercanas; la cerámica de la Edad del Hierro del montículo atestigua la ciudad de los días de Nabal. Hoy la aldea de Ma'in se halla en la gobernación de Hebrón, en Cisjordania, al sudeste de Yatta, y cerca de ella se alza el asentamiento israelí de Ma'on, fundado en 1981."
  pt:
    - "Maom era uma cidade na região montanhosa de Judá, à beira do deserto, a cerca de 13 km ao sul de Hebrom, listada com Carmelo, Zife e Jutá no distrito das colinas do sul. É Tell Ma'in (Horvat Ma'on), um montículo junto à aldeia palestina de Ma'in, que conserva o nome; a identificação não é contestada. Abaixo dele o deserto de Maom desce para leste rumo ao mar Morto; Davi esteve ali “na Arabá, ao sul do deserto”, escondendo-se de Saul, e só se salvou quando a notícia de uma incursão filisteia chamou o rei para longe. As Crônicas fazem de Maom um “filho” de Samai na linhagem de Calebe, isto é, um povoado calebita."
    - "Aqui vivia Nabal: “Havia um homem em Maom que tinha as suas propriedades no Carmelo; e o homem era muito rico. Ele tinha três mil ovelhas e mil cabras; e estava tosquiando as suas ovelhas no Carmelo.” Ele respondeu com insultos ao pedido de provisões que Davi lhe fez na tosquia; Davi partiu para matar todos os homens de sua casa, e Abigail, mulher de Nabal, encontrou-o no caminho com comida e com palavras que o fizeram voltar. Nabal morreu dez dias depois, e Abigail tornou-se mulher de Davi. Os “maonitas” do texto hebraico, que, com os sidônios e os amalequitas, oprimiram Israel, são provavelmente outro povo, os meunitas da fronteira árabe a quem Uzias combateu; a Bíblia grega lê ali Midiã e a Bíblia Sinodal Moabe."
    - "Escavações em Horvat Ma'on em 1987–1988, dirigidas por Zvi Ilan e David Amit, descobriram uma sinagoga do período bizantino com um nicho para os rolos da Torá voltado para Jerusalém e um banho ritual ao lado, mostrando uma aldeia judaica aqui nos séculos IV a VII d.C., como Estemoa e Susiya nas proximidades; cerâmica da Idade do Ferro no montículo atesta a cidade do tempo de Nabal. Hoje a aldeia de Ma'in fica na província de Hebrom, na Cisjordânia, a sudeste de Yatta, e o assentamento israelense de Ma'on, fundado em 1981, está perto dela."
  de:
    - "Maon war eine Stadt im Bergland Judas am Rand der Wüste, etwa 13 km südlich von Hebron, zusammen mit Karmel, Sif und Juta im Bezirk der südlichen Berge aufgeführt. Es ist Tell Ma'in (Horvat Ma'on), ein Hügel neben dem palästinensischen Dorf Ma'in, das den Namen bewahrt; die Gleichsetzung ist unbestritten. Unterhalb von ihm fällt die Wüste Maon nach Osten zum Toten Meer ab; David war dort „auf dem Gefilde zur Rechten der Wüste“ und versteckte sich vor Saul, und er wurde nur gerettet, als die Nachricht von einem Überfall der Philister den König abrief. Die Chronik macht Maon zum „Sohn“ Schammais in der Linie Kalebs, das heißt zu einer kalebitischen Siedlung."
    - "Hier lebte Nabal: „Und es war ein Mann zu Maon und sein Wesen zu Karmel; und der Mann war sehr großen Vermögens und hatte dreitausend Schafe und tausend Ziegen. Und es begab sich eben, daß er seine Schafe schor zu Karmel.“ Er beantwortete Davids Bitte um Verpflegung bei der Schur mit Beleidigungen; David zog aus, jeden Mann seines Hauses zu töten, und Abigajil, Nabals Frau, begegnete ihm unterwegs mit Speise und mit Worten, die ihn umkehren ließen. Nabal starb zehn Tage später, und Abigajil wurde Davids Frau. Die „Maoniter“ des hebräischen Textes, die mit den Sidoniern und Amalekitern einst Israel bedrängten, sind wohl ein anderes Volk, die Meuniter der arabischen Grenze, gegen die Usija kämpfte; die griechische Bibel liest dort Midian und die Synodalbibel Moab."
    - "Ausgrabungen in Horvat Ma'on 1987–1988 unter Zvi Ilan und David Amit legten eine Synagoge der byzantinischen Zeit mit einer Nische für die Torarollen in Richtung Jerusalem und einem Ritualbad daneben frei und zeigten ein jüdisches Dorf hier im 4. bis 7. Jahrhundert n. Chr., wie Eschtemoa und Susiya in der Nähe; eisenzeitliche Keramik auf dem Hügel belegt die Stadt von Nabals Tagen. Heute liegt das Dorf Ma'in im Gouvernement Hebron des Westjordanlands südöstlich von Yatta, und die 1981 gegründete israelische Siedlung Ma'on steht in seiner Nähe."
  fr:
    - "Maon était une ville de la montagne de Juda en bordure du désert, à environ 13 km au sud d’Hébron, citée avec Carmel, Ziph et Jutta dans le district des collines du sud. C’est Tell Ma’in (Horvat Ma’on), un tertre à côté du village palestinien de Ma’in qui garde le nom ; l’identification n’est pas contestée. Au-dessous, le désert de Maon descend vers l’est jusqu’à la mer Morte ; David s’y trouvait « dans la plaine au midi du désert », se cachant de Saül, et il ne fut sauvé que lorsque la nouvelle d’un raid philistin rappela le roi. Les Chroniques font de Maon un « fils » de Schammaï dans la lignée de Caleb, c’est-à-dire une implantation calébite."
    - "C’est là que vivait Nabal : « Il y avait à Maon un homme fort riche, possédant des biens à Carmel ; il avait trois mille brebis et mille chèvres, et il se trouvait à Carmel pour la tonte de ses brebis. » Il répondit par des insultes à la demande de vivres que David lui fit à la tonte ; David partit pour tuer tous les mâles de sa maison, et Abigaïl, femme de Nabal, vint à sa rencontre avec des vivres et des paroles qui le firent revenir. Nabal mourut dix jours plus tard, et Abigaïl devint la femme de David. Les « Maonites » du texte hébreu qui, avec les Sidoniens et les Amalécites, opprimèrent jadis Israël, sont probablement un autre peuple, les Meounites de la frontière arabe que combattit Ozias ; la Bible grecque lit Madian à cet endroit et la Bible synodale Moab."
    - "Les fouilles de Horvat Ma’on en 1987–1988, dirigées par Zvi Ilan et David Amit, ont mis au jour une synagogue de l’époque byzantine avec une niche pour les rouleaux de la Torah tournée vers Jérusalem et un bain rituel à côté, montrant qu’un village juif s’y trouvait du IVe au VIIe siècle apr. J.-C., comme Eschthemoa et Susiya tout près ; la céramique de l’âge du Fer sur le tertre atteste la ville du temps de Nabal. Aujourd’hui, le village de Ma’in se trouve dans le gouvernorat d’Hébron, en Cisjordanie, au sud-est de Yatta, et la colonie israélienne de Maon, fondée en 1981, s’élève près de lui."
