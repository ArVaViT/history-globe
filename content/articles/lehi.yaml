body:
  en:
    - "Lehi, “jawbone”, is the place in Judah where Samson killed a thousand Philistines. After he had burned their corn, the Philistines came up, camped in Judah and “spread themselves in Lehi”, demanding him; three thousand men of Judah bound him with two new ropes and handed him over. When he came to Lehi “the Spirit of the LORD came mightily upon him”; the ropes fell off like burnt flax, he found “a new jawbone of an ass” and killed a thousand men with it. He called the place Ramath-lehi, the throwing of the jawbone, and when he cried for water God split a hollow and the spring En-hakkore flowed there, “which is in Lehi unto this day”. In the story of David's heroes Shammah held “a piece of ground full of lentiles” against the Philistines; the Hebrew of that verse is obscure, and many read it as another fight at Lehi, as the map does."
    - "The Bible places Lehi only by the story: near Samson's country around Zorah, Timnah and Etam, on the border of Judah and Philistia in the low hills west of Jerusalem. Josephus retells the tale and calls the place Siagon, the Greek for jawbone. No later source locates it, and no ruin bears the name. The candidate sites on the map include Khirbet es-Siyyagh near Beth-shemesh and Bayt Itab farther east; none is confirmed by any find, and the identification remains open."
    - "Today the area is the Judean foothills between Beit Shemesh and the Sorek valley, farmland, forest and new suburbs; the spring that Samson drank from cannot be pointed out."
  ru:
    - "Лехи, «челюсть», — место в Иудее, где Самсон убил тысячу Филистимлян. После того как он сжёг их жатву и перебил им «голени и бедра», Филистимляне пошли, расположились станом в Иудее и «протянулись до Лехи», требуя его выдачи; три тысячи человек из Иудеи связали его двумя новыми верёвками и выдали. Когда он подошёл к Лехе, Филистимляне встретили его криком. «И сошел на него Дух Господень»; верёвки спали, как перегоревший лён, он нашёл «свежую ослиную челюсть» и убил ею тысячу человек. Он назвал место Рамаф-Лехи, «брошенная челюсть», а когда взмолился о воде, Бог разверз ямину, и потёк источник «Источник взывающего», «который в Лехе до сего дня». В рассказе о храбрых Давида Шамма отстоял у Филистимлян «поле, засеянное чечевицею»; еврейский текст этого стиха тёмен, и многие читают его как ещё одну битву при Лехи, как и карта."
    - "Библия помещает Лехи только по рассказу: близ самсоновых мест вокруг Цоры, Фимнафы и Етама, на границе Иудеи и Филистии в низких холмах к западу от Иерусалима. Иосиф Флавий пересказывает историю и зовёт место Сиагон, по-гречески «челюсть». Ни один позднейший источник его не находит, и ни одна развалина не носит этого имени. Среди кандидатов, отмеченных на карте, — Хирбет-эс-Сийяг близ Вефсамиса и Бейт-Итаб восточнее; ни один не подтверждён находками, и отождествление остаётся открытым."
    - "Сегодня это иудейские предгорья между Бейт-Шемешем и долиной Сорек: поля, лес и новые пригороды; источник, из которого пил Самсон, показать нельзя."
  uk:
    - "Лехі, «щелепа», — місце в Юдеї, де Самсон убив тисячу філістимлян. Після того як він спалив їхній хліб, філістимляни прийшли, отаборилися в Юдеї й «розпростерлись аж до Лехи», вимагаючи його; три тисячі чоловіків з Юди зв’язали його двома новими мотузками й віддали. Коли він дійшов до Лехи, «найшов на нього Господень дух»; мотузки спали, мов спалене прядиво, він знайшов «сьвіжу ослячу челюсть» і вбив нею тисячу чоловік. Він назвав те місце Рамат-Лехі, кидання щелепи, а коли він волав про воду, Бог розколов западину, і там потекло джерело Ен-Гаккоре, «тече воно в Леші по сей день». В оповіді про героїв Давида Шамма втримав проти філістимлян «нива, засїяна сочовицею»; староєврейський текст цього вірша темний, і багато хто читає його як ще один бій у Лехі, як і мапа."
    - "Біблія розміщує Лехі лише за оповіддю: поблизу Самсонового краю навколо Цори, Тімни та Етама, на межі Юди й Філістії в низьких пагорбах на захід від Єрусалима. Йосиф Флавій переказує історію й називає місце Сіагон, що грецькою означає щелепа. Жодне пізніше джерело не визначає його, і жодна руїна не носить цієї назви. Серед кандидатів на мапі — Хірбет-ес-Сіяґ поблизу Бет-Шемеша та Байт-Ітаб далі на схід; жодного не підтверджує жодна знахідка, і питання залишається відкритим."
    - "Сьогодні ця місцевість — Юдейське передгір’я між Бейт-Шемешем і долиною Сорек: рілля, ліс і нові передмістя; джерело, з якого пив Самсон, вказати не можна."
  es:
    - "Lehi, «quijada», es el lugar de Judá donde Sansón mató a mil filisteos. Después de que él quemara sus mieses, los filisteos subieron, acamparon en Judá y «tendiéronse por Lehi» reclamándolo; tres mil hombres de Judá lo ataron con dos cuerdas nuevas y se lo entregaron. Cuando llegó a Lehi, «el espíritu de Jehová cayó sobre él»; las cuerdas se soltaron como lino quemado, halló «una quijada de asno fresca» y con ella mató a mil hombres. Llamó al lugar Ramat-lehi, el lanzamiento de la quijada, y cuando clamó por agua, Dios abrió una cavidad y allí brotó la fuente En-hacore, «el cual es en Lehi, hasta hoy». En el relato de los héroes de David, Sama defendió contra los filisteos «una suerte de tierra llena de lentejas»; el hebreo de ese versículo es oscuro, y muchos lo leen como otro combate en Lehi, como hace el mapa."
    - "La Biblia sitúa Lehi solo por el relato: cerca de la región de Sansón, en torno a Zora, Timna y Etam, en la frontera de Judá y Filistea, en las colinas bajas al oeste de Jerusalén. Josefo vuelve a contar la historia y llama al lugar Siagon, que en griego significa quijada. Ninguna fuente posterior lo localiza, y ninguna ruina lleva el nombre. Entre los emplazamientos candidatos del mapa están Khirbet es-Siyyagh, cerca de Bet-semes, y Bayt Itab, más al este; ninguno está confirmado por hallazgo alguno, y la identificación sigue abierta."
    - "Hoy la zona son las estribaciones de Judea entre Beit Shemesh y el valle de Sorek, con tierras de cultivo, bosques y nuevos barrios residenciales; la fuente de la que bebió Sansón no puede señalarse."
  pt:
    - "Leí, “queixada”, é o lugar em Judá onde Sansão matou mil filisteus. Depois de ele queimar o trigo deles, os filisteus subiram, acamparam em Judá e “se espalharam por Leí”, exigindo-o; três mil homens de Judá o amarraram com duas cordas novas e o entregaram. Quando ele chegou a Leí, “o Espírito do SENHOR veio poderosamente sobre ele”; as cordas caíram como linho queimado, ele achou “uma queixada fresca de jumento” e com ela matou mil homens. Chamou o lugar Ramate-Leí, o lançamento da queixada, e, quando clamou por água, Deus fendeu uma cavidade e a fonte En-Haquecore brotou ali, “a qual está em Leí até o dia de hoje”. Na história dos heróis de Davi, Samá defendeu contra os filisteus “um pedaço de terra cheio de lentilhas”; o hebraico desse versículo é obscuro, e muitos o leem como outro combate em Leí, como faz o mapa."
    - "A Bíblia situa Leí apenas pela narrativa: perto da terra de Sansão, em torno de Zorá, Timna e Etã, na fronteira de Judá com a Filístia, nas colinas baixas a oeste de Jerusalém. Josefo reconta o episódio e chama o lugar Siagon, o grego para queixada. Nenhuma fonte posterior o localiza, e nenhuma ruína traz o nome. Entre os sítios candidatos no mapa estão Khirbet es-Siyyagh, perto de Bete-Semes, e Bayt Itab, mais a leste; nenhum é confirmado por qualquer achado, e a identificação permanece em aberto."
    - "Hoje a área são os contrafortes da Judeia entre Bet Shemesh e o vale de Soreque, terras agrícolas, floresta e novos subúrbios; a fonte de que Sansão bebeu não pode ser apontada."
  de:
    - "Lehi, „Kinnbacken“, ist der Ort in Juda, an dem Simson tausend Philister erschlug. Nachdem er ihr Korn verbrannt hatte, zogen die Philister hinauf, lagerten sich in Juda und „ließen sich nieder zu Lehi“ und verlangten ihn; dreitausend Mann aus Juda banden ihn mit zwei neuen Stricken und übergaben ihn. Als er nach Lehi kam, heißt es: „Aber der Geist Gottes geriet über ihn“, die Stricke fielen ab wie versengter Flachs, er fand „einen frischen Eselskinnbacken“ und erschlug damit tausend Mann. Er nannte den Ort Ramat-Lehi, Wurf des Kinnbackens, und als er um Wasser rief, spaltete Gott eine Höhlung, und die Quelle En-Hakkore floss dort, „der in Lehi ist“. Unter Davids Helden hielt Schamma „ein Stück Acker voll Linsen“ gegen die Philister; das Hebräische jenes Verses ist dunkel, und viele lesen es als einen weiteren Kampf bei Lehi, wie es die Karte tut."
    - "Die Bibel verortet Lehi nur durch die Erzählung: nahe Simsons Land um Zora, Timna und Etam, an der Grenze zwischen Juda und Philistäa in den niedrigen Hügeln westlich von Jerusalem. Josephus erzählt die Geschichte nach und nennt den Ort Siagon, das griechische Wort für Kinnbacken. Keine spätere Quelle lokalisiert ihn, und keine Ruine trägt den Namen. Zu den Kandidaten auf der Karte gehören Khirbet es-Siyyagh bei Bet-Schemesch und Bayt Itab weiter östlich; keiner ist durch einen Fund bestätigt, und die Frage bleibt offen."
    - "Heute ist das Gebiet das judäische Hügelvorland zwischen Beit Shemesh und dem Sorektal, Ackerland, Wald und neue Vororte; die Quelle, aus der Simson trank, lässt sich nicht zeigen."
  fr:
    - "Léchi, « mâchoire », est le lieu de Juda où Samson tua mille Philistins. Après qu’il eut brûlé leurs blés, les Philistins montèrent, campèrent en Juda et « s’étendirent jusqu’à Léchi », le réclamant ; trois mille hommes de Juda le lièrent avec deux cordes neuves et le livrèrent. Quand il arriva à Léchi, « l’esprit de l’Éternel le saisit » ; les cordes tombèrent comme du lin brûlé, il trouva « une mâchoire d’âne fraîche » et en tua mille hommes. Il appela le lieu Ramath-Léchi, le jet de la mâchoire, et quand il cria pour avoir de l’eau, Dieu fendit une cavité et la source En-Hakkoré jaillit ; « elle existe encore aujourd’hui à Léchi ». Dans l’histoire des héros de David, Schamma tint contre les Philistins « une pièce de terre remplie de lentilles » ; l’hébreu de ce verset est obscur, et beaucoup y lisent un autre combat à Léchi, comme le fait la carte."
    - "La Bible ne situe Léchi que par le récit : près du pays de Samson autour de Tsorea, Thimna et Étam, à la frontière de Juda et de la Philistie, dans les basses collines à l’ouest de Jérusalem. Flavius Josèphe raconte de nouveau l’histoire et appelle le lieu Siagon, le mot grec pour mâchoire. Aucune source plus tardive ne le situe, et aucune ruine ne porte le nom. Parmi les sites candidats sur la carte figurent Khirbet es-Siyyagh près de Beth-Schémesch et Bayt Itab plus à l’est ; aucun n’est confirmé par une trouvaille, et l’identification reste ouverte."
    - "Aujourd’hui, la région est celle des contreforts de Judée entre Beit Shemesh et la vallée de Sorek, faite de terres cultivées, de forêts et de nouveaux faubourgs ; la source où Samson but ne peut être désignée."
  it:
    - "Lechi, «mascella», è il luogo in Giuda dove Sansone uccise mille Filistei. Dopo che egli ebbe bruciato il loro grano, i Filistei salirono, si accamparono in Giuda e «si distesero fino a Lehi», chiedendo di lui; tremila uomini di Giuda lo legarono con due funi nuove e lo consegnarono. Quando giunse a Lechi «lo spirito dell’Eterno lo investì»; le funi caddero come lino bruciato, egli trovò «una mascella d’asino ancor fresca» e con essa uccise mille uomini. Chiamò il luogo Ramat-Lechi, il lancio della mascella, e quando gridò per avere acqua Dio fendé una cavità e vi sgorgò la sorgente En-Akkore, «che esiste anche al dì d’oggi a Lehi». Nel racconto degli eroi di Davide Samma tenne «un campo pieno di lenticchie» contro i Filistei; l’ebraico di quel versetto è oscuro, e molti vi leggono un altro scontro a Lechi, come fa la mappa."
    - "La Bibbia colloca Lechi solo attraverso il racconto: vicino al paese di Sansone intorno a Zorea, Timna ed Etam, sul confine tra Giuda e la Filistea, nelle basse colline a ovest di Gerusalemme. Giuseppe Flavio racconta di nuovo la storia e chiama il luogo Siagon, il termine greco per mascella. Nessuna fonte più tarda lo localizza, e nessuna rovina porta il nome. Tra i siti candidati sulla mappa vi sono Khirbet es-Siyyagh presso Bet-Semes e Bayt Itab più a est; nessuno è confermato da alcun reperto, e l’identificazione resta aperta."
    - "Oggi la zona è l’avampaese giudeo tra Beit Shemesh e la valle di Sorek, terreno agricolo, bosco e nuovi sobborghi; la sorgente da cui Sansone bevve non può essere indicata."
  pl:
    - "Lechi, „szczęka”, to miejsce w Judzie, gdzie Samson zabił tysiąc Filistynów. Gdy spalił ich zboże, Filistyni wyciągnęli, rozbili obóz w Judzie i „rozciągnęli się aż do Lechy”, żądając go; trzy tysiące mężów Judy związało go dwoma nowymi powrozami i wydało. Gdy przyszedł do Lechi, „Duch Pański przypadł nań”; powrozy opadły jak spalony len, znalazł „czeluść oślą świeżą” i zabił nią tysiąc mężów. Nazwał to miejsce Ramat-Lechi, rzucenie szczęki, a gdy wołał o wodę, Bóg rozszczepił zagłębienie i popłynęło tam źródło En-Hakkore, „które jest w Lechy aż do dnia dzisiejszego”. W opowieści o bohaterach Dawida Szamma bronił przed Filistynami „część pola pełnego soczewicy”; hebrajski tekst tego wersetu jest niejasny i wielu czyta go jako inną walkę pod Lechi, tak jak mapa."
    - "Biblia umieszcza Lechi tylko przez opowieść: w pobliżu kraju Samsona wokół Sory, Timny i Etam, na granicy Judy i Filistei w niskich wzgórzach na zachód od Jerozolimy. Józef Flawiusz opowiada tę historię na nowo i nazywa miejsce Siagon, po grecku szczęka. Żadne późniejsze źródło go nie lokalizuje i żadna ruina nie nosi tej nazwy. Wśród kandydatów na mapie są Khirbet es-Siyyagh koło Bet-Szemesz i Bayt Itab dalej na wschód; żaden nie jest potwierdzony żadnym znaleziskiem, a utożsamienie pozostaje otwarte."
    - "Dziś ten obszar to judzkie podgórze między Bet Szemesz a doliną Sorek, pola, las i nowe przedmieścia; źródła, z którego pił Samson, nie można wskazać."
  nl:
    - "Lechi, “kinnebak”, is de plaats in Juda waar Simson duizend Filistijnen doodde. Nadat hij hun graan had verbrand, trokken de Filistijnen op, legerden zich in Juda en “breidden zich uit in Lechi”; drieduizend man van Juda bonden hem met twee nieuwe touwen en leverden hem uit. Toen hij bij Lechi kwam, gebeurde dit: “de Geest des HEEREN werd vaardig over hem”; de touwen vielen af als verbrand vlas, hij vond “een vochtig ezelskinnebakken” en doodde er duizend man mee. Hij noemde de plaats Ramat-Lechi, het werpen van de kinnebak, en toen hij om water riep, kloofde God een holte en de bron En-Hakkore vloeide daar, “die in Lechi is, tot op dezen dag”. In het verhaal van Davids helden hield Samma stand tegen de Filistijnen op een plek waar “een stuk akkers was vol linzen”; het Hebreeuws van dat vers is duister, en velen lezen er een ander gevecht bij Lechi in, zoals de kaart doet."
    - "De Bijbel plaatst Lechi alleen door het verhaal: nabij Simsons streek rond Zora, Timna en Etam, op de grens van Juda en Filistea in de lage heuvels ten westen van Jeruzalem. Josephus vertelt het verhaal na en noemt de plaats Siagon, het Griekse woord voor kinnebak. Geen latere bron lokaliseert haar, en geen ruïne draagt de naam. Tot de kandidaten op de kaart behoren Khirbet es-Siyyagh bij Beth-Semes en Bayt Itab verder oostelijk; geen ervan wordt door een vondst bevestigd, en de identificatie blijft open."
    - "Tegenwoordig is het gebied de Judese voorheuvels tussen Beit Shemesh en de Sorekvallei, akkerland, bos en nieuwe woonwijken; de bron waaruit Simson dronk, kan niet worden aangewezen."
  cs:
    - "Lechi, „čelist“, je místo v Judsku, kde Samson zabil tisíc Pelištejců. Poté, co spálil jejich obilí, Pelištejci vytáhli, utábořili se v Judsku a „rozložili se až do Lechi“ a požadovali ho; tři tisíce mužů Judových ho svázaly dvěma novými provazy a vydaly. Když přišel do Lechi, „Přišel pak na něj Duch Hospodinův“; provazy spadly jako spálený len, našel „čelist osličí ještě vlhkou“ a pobil jí tisíc mužů. Nazval místo Ramat-lechi, vrh čelisti, a když volal po vodě, Bůh otevřel skálu a vyšel pramen Én-hakkóre, „kteráž jest v Lechi až do dnešního dne“. V příběhu o Davidových hrdinech držel Šama proti Pelištejcům „díl rolí poseté šocovicí“; hebrejština toho verše je nejasná a mnozí čtou další boj u Lechi, jak to dělá mapa."
    - "Bible umisťuje Lechi jen podle příběhu: poblíž Samsonovy země kolem Corey, Timny a Étamu, na hranici Judska a Pelištejské země v nízkých pahorcích západně od Jeruzaléma. Josephus příběh převypráví a nazývá místo Siagon, řecky čelist. Žádný pozdější pramen je neurčuje a žádná zřícenina nenese toto jméno. Mezi kandidáty na mapě patří Khirbet es-Siyyagh u Bét-šemeše a Bayt Itab dále na východ; žádný není potvrzen nálezem a určení zůstává otevřené."
    - "Dnes je oblast podhůřím Judska mezi Bejt Šemešem a údolím Sorek, zemědělskou půdou, lesem a novými předměstími; pramen, z něhož Samson pil, nelze ukázat."
