body:
  en:
    - "Lystra lay in Lycaonia, some 30 km south-south-west of Iconium (Konya), on a mound north of the village of Hatunsaray. Its site was long uncertain. The geographer William Leake guessed it in the early nineteenth century, and in the 1880s the American J. R. S. Sterrett found here a Latin inscription, and bought a coin, showing that Lystra had been a Roman colony; with that, the place was fixed."
    - "Augustus made Lystra a colony, Colonia Iulia Felix Gemina Lustra, one of several veteran colonies in the hills of southern Galatia meant to hold the mountain peoples of Pisidia and Isauria in check. Its coins, from Augustus to the empress Faustina the Younger, show Minerva and the founder ploughing the boundary of the new city. Pliny lists the Lystreni among the peoples of Galatia."
    - 'Fleeing from Iconium, Paul and Barnabas preached at Lystra. Paul healed a man who had been lame from birth, and the crowd cried out in the speech of Lycaonia, "The gods are come down to us in the likeness of men." They called Barnabas Jupiter and Paul Mercurius, and the priest of Jupiter, whose temple stood before the city, brought oxen and garlands to sacrifice; the apostles tore their clothes and pointed them to the living God who made heaven and earth. Then Jews from Antioch and Iconium won the people over, and Paul was stoned and dragged out of the city for dead. He rose and went back in, and the next day left for Derbe; on the way back he strengthened the disciples here.'
    - "On his next journey Paul found at Lystra the disciple Timothy, son of a believing Jewish mother and a Greek father, who was well spoken of by the brethren at Lystra and Iconium, and took him along. The Second Letter to Timothy names his grandmother Lois and mother Eunice and recalls Paul's sufferings at Lystra. The town itself remained small, and as late as 1907 William Ramsay wrote that excavation at Lystra was urgently needed."
  ru:
    - "Листра лежала в Ликаонии, примерно в 30 км к юго-юго-западу от Иконии (Коньи), на холме к северу от деревни Хатунсарай. Её место долго оставалось неизвестным. Географ Уильям Лик предположил его ещё в начале XIX века, а в 1880-х годах американец Дж. Р. С. Стеррет нашёл здесь латинскую надпись и купил монету, показавшие, что Листра была римской колонией; так место было установлено."
    - "Август сделал Листру колонией — Colonia Iulia Felix Gemina Lustra, одной из нескольких колоний ветеранов в горах южной Галатии, которые должны были сдерживать горные племена Писидии и Исаврии. На её монетах, от Августа до императрицы Фаустины Младшей, изображены Минерва и основатель, проводящий плугом границу нового города. Плиний называет листрийцев среди народов Галатии."
    - "Бежав из Иконии, Павел и Варнава проповедовали в Листре. Павел исцелил человека, хромого от рождения, и народ закричал по-ликаонски: «боги в образе человеческом сошли к нам». Варнаву называли Зевсом, а Павла Ермием, и жрец Зевса, храм которого стоял перед городом, привёл волов и принёс венки для жертвоприношения; апостолы разодрали одежды и обратили народ к Богу живому, сотворившему небо и землю. Затем иудеи из Антиохии и Иконии склонили народ на свою сторону, и Павла побили камнями и вытащили за город, почитая умершим. Он встал, вернулся в город, а на другой день ушёл в Дервию; на обратном пути он утверждал здесь учеников."
    - "В следующем путешествии Павел нашёл в Листре ученика Тимофея, сына уверовавшей Иудеянки и отца-Еллина, о котором хорошо свидетельствовали братия в Листре и Иконии, и взял его с собой. Второе послание к Тимофею называет его бабку Лоиду и мать Евнику и вспоминает гонения, перенесённые Павлом в Листрах. Сам город остался небольшим, и ещё в 1907 г. Уильям Рамзай писал, что раскопки в Листре крайне нужны."
  uk:
    - "Лістра лежала в Лікаонії, приблизно за 30 км на південь-південний захід від Іконії (Конья), на пагорбі на північ від села Хатунсарай. Її місце довго було невідоме. Географ Вільям Лік вгадав його на початку XIX ст., а в 1880-х рр. американець Дж. Р. С. Стеррет знайшов тут латинський напис і купив монету, які показали, що Лістра була римською колонією; цим місце було визначено."
    - "Август зробив Лістру колонією — Colonia Iulia Felix Gemina Lustra, однією з кількох ветеранських колоній у горах південної Галатії, призначених тримати в узді гірські народи Пісідії та Ісаврії. Її монети, від Августа до імператриці Фаустини Молодшої, зображають Мінерву й засновника, що оре межу нового міста. Пліній зараховує лістренців до народів Галатії."
    - "Утікаючи з Іконії, Павло й Варнава проповідували в Лістрі. Павло оздоровив чоловіка, кульгавого від народження, і натовп вигукнув по-лікаонськи: «Боги, уподобившись людям, зійшли до нас». Вони назвали Варнаву Юпітером, а Павла Меркурієм, і жрець Юпітера, чий храм стояв перед містом, приніс волів і вінки для жертви; апостоли роздерли одежу й указали їм на Бога живого, що створив небо й землю. Потім юдеї з Антіохії та Іконії схилили народ на свій бік, і Павла побили камінням та виволікли з міста мертвим. Він підвівся й повернувся досередини, а наступного дня вирушив до Дервії; на зворотному шляху він зміцнював тут учнів."
    - "У наступній подорожі Павло знайшов у Лістрі учня Тимофія, сина віруючої юдейки й батька-грека, про якого добре свідчили брати в Лістрі та Іконії, і взяв його з собою. Друге послання до Тимофія називає його бабусю Лоїду й матір Євнику та згадує страждання Павла в Лістрі. Саме місто залишалося невеликим, і ще 1907 р. Вільям Рамзі писав, що розкопки в Лістрі нагально потрібні."
  es:
    - "Listra se hallaba en Licaonia, a unos 30 km al sudsudoeste de Iconio (Konya), en un montículo al norte de la aldea de Hatunsaray. Su emplazamiento fue incierto durante mucho tiempo. El geógrafo William Leake lo conjeturó a comienzos del siglo XIX, y en la década de 1880 el estadounidense J. R. S. Sterrett halló aquí una inscripción latina y compró una moneda, y ambas mostraban que Listra había sido colonia romana; con ello, el lugar quedó fijado."
    - "Augusto hizo de Listra una colonia, Colonia Iulia Felix Gemina Lustra, una de las varias colonias de veteranos en las colinas del sur de Galacia destinadas a contener a los pueblos montañeses de Pisidia e Isauria. Sus monedas, desde Augusto hasta la emperatriz Faustina la Menor, muestran a Minerva y al fundador trazando con el arado el límite de la nueva ciudad. Plinio enumera a los lystrenos entre los pueblos de Galacia."
    - "Huyendo de Iconio, Pablo y Bernabé predicaron en Listra. Pablo sanó a un hombre cojo de nacimiento, y la multitud gritó en lengua licaónica: «Dioses semejantes á hombres han descendido á nosotros». Llamaron a Bernabé Júpiter y a Pablo Mercurio, y el sacerdote de Júpiter, cuyo templo estaba delante de la ciudad, trajo toros y guirnaldas para sacrificar; los apóstoles rasgaron sus ropas y les señalaron al Dios vivo que hizo el cielo y la tierra. Entonces judíos de Antioquía y de Iconio ganaron al pueblo, y Pablo fue apedreado y arrastrado fuera de la ciudad, dado por muerto. Se levantó y volvió a entrar, y al día siguiente salió hacia Derbe; a la vuelta fortaleció aquí a los discípulos."
    - "En su siguiente viaje, Pablo halló en Listra al discípulo Timoteo, hijo de una madre judía creyente y de padre griego, de quien los hermanos de Listra y de Iconio daban buen testimonio, y lo tomó consigo. La Segunda Carta a Timoteo nombra a su abuela Loida y a su madre Eunice y recuerda los sufrimientos de Pablo en Listra. La ciudad siguió siendo pequeña, y todavía en 1907 William Ramsay escribió que era urgente excavar en Listra."
  pt:
    - "Listra ficava na Licaônia, a uns 30 km a sul-sudoeste de Icônio (Konya), num montículo ao norte da aldeia de Hatunsaray. Seu sítio foi por muito tempo incerto. O geógrafo William Leake o conjecturou no início do século XIX, e na década de 1880 o americano J. R. S. Sterrett encontrou aqui uma inscrição latina e comprou uma moeda, mostrando que Listra fora uma colônia romana; com isso, o lugar ficou fixado."
    - "Augusto fez de Listra uma colônia, Colonia Iulia Felix Gemina Lustra, uma das várias colônias de veteranos nas colinas do sul da Galácia destinadas a conter os povos montanheses da Pisídia e da Isáuria. Suas moedas, de Augusto à imperatriz Faustina, a Jovem, mostram Minerva e o fundador traçando com o arado o limite da nova cidade. Plínio lista os listrenses entre os povos da Galácia."
    - "Fugindo de Icônio, Paulo e Barnabé pregaram em Listra. Paulo curou um homem coxo de nascença, e a multidão gritou em língua licaônica: “Os deuses desceram até nós em semelhança de homens!” Chamaram Barnabé de Júpiter e Paulo de Mercúrio, e o sacerdote de Júpiter, cujo templo ficava em frente à cidade, trouxe bois e guirlandas para sacrificar; os apóstolos rasgaram as roupas e os apontaram para o Deus vivo que fez o céu e a terra. Depois, judeus de Antioquia e Icônio conquistaram o povo, e Paulo foi apedrejado e arrastado para fora da cidade como morto. Levantou-se e voltou a entrar, e no dia seguinte partiu para Derbe; na volta, fortaleceu ali os discípulos."
    - "Em sua viagem seguinte, Paulo encontrou em Listra o discípulo Timóteo, filho de mãe judia crente e pai grego, de quem os irmãos de Listra e Icônio davam bom testemunho, e o levou consigo. A Segunda Carta a Timóteo nomeia sua avó Loide e sua mãe Eunice e recorda os sofrimentos de Paulo em Listra. A própria cidade permaneceu pequena, e ainda em 1907 William Ramsay escreveu que a escavação em Listra era urgentemente necessária."
  de:
    - "Lystra lag in Lykaonien, etwa 30 km südsüdwestlich von Ikonion (Konya), auf einem Hügel nördlich des Dorfes Hatunsaray. Seine Lage war lange ungewiss. Der Geograph William Leake vermutete sie Anfang des 19. Jahrhunderts, und in den 1880er Jahren fand der Amerikaner J. R. S. Sterrett hier eine lateinische Inschrift und erwarb eine Münze, die zeigten, dass Lystra eine römische Kolonie gewesen war; damit war der Ort festgelegt."
    - "Augustus machte Lystra zur Kolonie, Colonia Iulia Felix Gemina Lustra, eine von mehreren Veteranenkolonien in den Bergen des südlichen Galatien, die die Bergvölker Pisidiens und Isauriens in Schach halten sollten. Ihre Münzen, von Augustus bis zur Kaiserin Faustina der Jüngeren, zeigen Minerva und den Gründer beim Pflügen der Grenze der neuen Stadt. Plinius führt die Lystreni unter den Völkern Galatiens auf."
    - "Auf der Flucht aus Ikonion predigten Paulus und Barnabas in Lystra. Paulus heilte einen von Geburt an Lahmen, und das Volk rief auf lykaonisch: „Die Götter sind den Menschen gleich geworden und zu uns herniedergekommen.“ Sie nannten Barnabas Jupiter und Paulus Merkurius, und der Priester Jupiters, dessen Tempel vor der Stadt stand, brachte Ochsen und Kränze zum Opfer; die Apostel zerrissen ihre Kleider und verwiesen sie auf den lebendigen Gott, der Himmel und Erde gemacht hat. Dann gewannen Juden aus Antiochia und Ikonion das Volk, und Paulus wurde gesteinigt und für tot aus der Stadt geschleift. Er stand auf und ging wieder hinein und zog am nächsten Tag nach Derbe; auf dem Rückweg stärkte er hier die Jünger."
    - "Auf seiner nächsten Reise fand Paulus in Lystra den Jünger Timotheus, Sohn einer gläubigen jüdischen Mutter und eines griechischen Vaters, der bei den Brüdern in Lystra und Ikonion einen guten Ruf hatte, und nahm ihn mit. Der Zweite Brief an Timotheus nennt seine Großmutter Lois und seine Mutter Eunike und erinnert an die Leiden des Paulus in Lystra. Die Stadt selbst blieb klein, und noch 1907 schrieb William Ramsay, Ausgrabungen in Lystra seien dringend nötig."
  fr:
    - "Lystre se trouvait en Lycaonie, à quelque 30 km au sud-sud-ouest d’Icone (Konya), sur un tertre au nord du village de Hatunsaray. Son site resta longtemps incertain. Le géographe William Leake le devina au début du XIXe siècle, et dans les années 1880 l’Américain J. R. S. Sterrett y trouva une inscription latine, et acheta une monnaie, montrant que Lystre avait été colonie romaine ; le lieu fut ainsi fixé."
    - "Auguste fit de Lystre une colonie, Colonia Iulia Felix Gemina Lustra, l’une des colonies de vétérans des collines du sud de la Galatie destinées à contenir les peuples montagnards de Pisidie et d’Isaurie. Ses monnaies, d’Auguste à l’impératrice Faustine la Jeune, montrent Minerve et le fondateur traçant au labour la limite de la nouvelle ville. Pline range les Lystrènes parmi les peuples de Galatie."
    - "Fuyant Icone, Paul et Barnabas prêchèrent à Lystre. Paul guérit un homme boiteux de naissance, et la foule s’écria en langue lycaonienne : « Les dieux sous une forme humaine sont descendus vers nous. » Ils appelèrent Barnabas Jupiter et Paul Mercure, et le prêtre de Jupiter, dont le temple était à l’entrée de la ville, amena des taureaux et des guirlandes pour sacrifier ; les apôtres déchirèrent leurs vêtements et les renvoyèrent au Dieu vivant qui a fait le ciel et la terre. Puis des Juifs d’Antioche et d’Icone gagnèrent le peuple, et Paul fut lapidé et traîné hors de la ville pour mort. Il se leva et rentra, et le lendemain partit pour Derbe ; au retour, il fortifia ici les disciples."
    - "Lors de son voyage suivant, Paul trouva à Lystre le disciple Timothée, fils d’une mère juive croyante et d’un père grec, à qui les frères de Lystre et d’Icone rendaient un bon témoignage, et l’emmena avec lui. La Deuxième lettre à Timothée nomme sa grand-mère Loïs et sa mère Eunice et rappelle les souffrances de Paul à Lystre. La ville elle-même resta petite, et, en 1907 encore, William Ramsay écrivait qu’une fouille à Lystre était urgemment nécessaire."
  it:
    - "Listra si trovava in Licaonia, a circa 30 km a sud-sud-ovest di Icònio (Konya), su un tell a nord del villaggio di Hatunsaray. Il suo sito fu a lungo incerto. Il geografo William Leake lo ipotizzò all’inizio dell’Ottocento, e negli anni Ottanta dell’Ottocento l’americano J. R. S. Sterrett vi trovò un’iscrizione latina e comprò una moneta, che dimostravano che Listra era stata una colonia romana; con ciò il luogo fu fissato."
    - "Augusto fece di Listra una colonia, Colonia Iulia Felix Gemina Lustra, una delle diverse colonie di veterani nelle colline della Galazia meridionale destinate a tenere a freno i popoli montani della Pisidia e dell’Isauria. Le sue monete, da Augusto all’imperatrice Faustina Minore, mostrano Minerva e il fondatore che traccia con l’aratro il confine della nuova città. Plinio elenca i Listreni tra i popoli della Galazia."
    - "Fuggendo da Icònio, Paolo e Barnaba predicarono a Listra. Paolo guarì un uomo zoppo fin dalla nascita, e la folla gridò in lingua licaonica: «Gli dèi hanno preso forma umana, e sono discesi fino a noi». Chiamarono Barnaba Giove e Paolo Mercurio, e il sacerdote di Giove, il cui tempio sorgeva davanti alla città, portò tori e ghirlande per sacrificare; gli apostoli si stracciarono le vesti e li rimandarono al Dio vivente che ha fatto il cielo e la terra. Poi ebrei di Antiochia e di Icònio conquistarono il popolo, e Paolo fu lapidato e trascinato fuori della città per morto. Si rialzò e vi rientrò, e il giorno dopo partì per Derbe; al ritorno vi rafforzò i discepoli."
    - "Nel viaggio successivo Paolo trovò a Listra il discepolo Timoteo, figlio di una madre giudea credente e di un padre greco, di cui parlavano bene i fratelli di Listra e di Icònio, e lo prese con sé. La Seconda lettera a Timoteo nomina la nonna Loide e la madre Eunice e ricorda le sofferenze di Paolo a Listra. La città rimase piccola, e ancora nel 1907 William Ramsay scriveva che gli scavi a Listra erano urgentemente necessari."
  pl:
    - "Listra leżała w Likaonii, około 30 km na południowy zachód od Ikonium (Konya), na kopcu na północ od wsi Hatunsaray. Jej położenie długo było niepewne. Geograf William Leake zgadywał je na początku XIX w., a w latach osiemdziesiątych XIX w. Amerykanin J. R. S. Sterrett znalazł tu łacińską inskrypcję i kupił monetę, które wykazały, że Listra była rzymską kolonią; wtedy miejsce zostało ustalone."
    - "August uczynił z Listry kolonię, Colonia Iulia Felix Gemina Lustra, jedną z kilku kolonii weteranów na wzgórzach południowej Galacji, mających trzymać w szachu ludy górskie Pizydii i Izaurii. Jej monety, od Augusta po cesarzową Faustynę Młodszą, ukazują Minerwę i założyciela orzącego granicę nowego miasta. Pliniusz wymienia Listreńczyków wśród ludów Galacji."
    - "Uciekając z Ikonium, Paweł i Barnaba głosili w Listrze. Paweł uzdrowił człowieka chromego od urodzenia, a tłum zawołał po likaońsku: „Bogowie stawszy się podobni ludziom, zstąpili do nas.” Barnabę nazwali Jowiszem, a Pawła Merkuriuszem, a kapłan Jowisza, którego świątynia stała przed miastem, przywiódł woły z wieńcami, by złożyć ofiarę; apostołowie rozdarli szaty i wskazali im Boga żywego, który uczynił niebo i ziemię. Wtedy Żydzi z Antiochii i Ikonium zjednali sobie lud, a Paweł został ukamienowany i wywleczony za miasto jako umarły. Wstał i wrócił do miasta, a następnego dnia odszedł do Derby; w drodze powrotnej umacniał tu uczniów."
    - "W następnej podróży Paweł znalazł w Listrze ucznia Tymoteusza, syna wierzącej Żydówki i ojca Greka, o którym dobrze świadczyli bracia w Listrze i Ikonium, i wziął go ze sobą. Drugi List do Tymoteusza wymienia jego babkę Lois i matkę Eunike oraz wspomina cierpienia Pawła w Listrze. Samo miasto pozostało małe, a jeszcze w 1907 r. William Ramsay pisał, że wykopaliska w Listrze są pilnie potrzebne."
  nl:
    - "Lystra lag in Lykaonië, zo'n 30 km zuidzuidwest van Ikonium (Konya), op een heuvel ten noorden van het dorp Hatunsaray. De ligging was lang onzeker. De geograaf William Leake raadde haar aan het begin van de negentiende eeuw, en in de jaren 1880 vond de Amerikaan J. R. S. Sterrett hier een Latijnse inscriptie en kocht een munt, waaruit bleek dat Lystra een Romeinse kolonie was geweest; daarmee was de plaats vastgesteld."
    - "Augustus maakte Lystra tot kolonie, Colonia Iulia Felix Gemina Lustra, een van verscheidene veteranenkolonies in de heuvels van zuidelijk Galatië, bedoeld om de bergvolken van Pisidië en Isaurië in bedwang te houden. Haar munten, van Augustus tot keizerin Faustina de Jongere, tonen Minerva en de stichter die de grens van de nieuwe stad ploegt. Plinius noemt de Lystreni onder de volken van Galatië."
    - "Op de vlucht uit Ikonium predikten Paulus en Barnabas in Lystra. Paulus genas een man die van de moederschoot af kreupel was, en de menigte riep in het Lykaonisch: “De goden zijn den mensen gelijk geworden, en tot ons nedergekomen.” Zij noemden Barnabas Jupiter en Paulus Mercurius, en de priester van Jupiter, wiens tempel voor de stad stond, bracht ossen en kransen om te offeren; de apostelen scheurden hun kleren en wezen hen op de levende God die hemel en aarde gemaakt heeft. Toen wonnen joden uit Antiochië en Ikonium het volk voor zich, en Paulus werd gestenigd en voor dood de stad uit gesleept. Hij stond op en ging terug naar binnen, en de volgende dag vertrok hij naar Derbe; op de terugweg sterkte hij hier de discipelen."
    - "Op zijn volgende reis vond Paulus in Lystra de discipel Timoteüs, zoon van een gelovige joodse moeder en een Griekse vader, van wie de broeders in Lystra en Ikonium goed spraken, en nam hem mee. De Tweede Brief aan Timoteüs noemt zijn grootmoeder Lois en moeder Eunice en herinnert aan Paulus' lijden in Lystra. De stad zelf bleef klein, en nog in 1907 schreef William Ramsay dat opgraving in Lystra dringend nodig was."
  cs:
    - "Lystra ležela v Lykaonii, asi 30 km jihojihozápadně od Ikonia (Konya), na pahorku severně od vesnice Hatunsaray. Její poloha byla dlouho nejistá. Geograf William Leake ji odhadl na počátku 19. století a v 80. letech 19. století našel Američan J. R. S. Sterrett latinský nápis a koupil minci, které ukázaly, že Lystra byla římskou kolonií; tím bylo místo určeno."
    - "Augustus učinil z Lystry kolonii, Colonia Iulia Felix Gemina Lustra, jednu z několika veteránských kolonií v pahorcích jižní Galacie, určených k udržení horských národů Pisidie a Isaurie v šachu. Její mince, od Augusta po císařovnu Faustinu mladší, ukazují Minervu a zakladatele, jak orá hranici nového města. Plinius uvádí Lystreny mezi národy Galacie."
    - "Pavel a Barnabáš, prchající z Ikonia, kázali v Lystře. Pavel uzdravil muže chromého od narození a zástup volal lykaonitsky: „Bohové připodobnivše se lidem, sstoupili k nám.“ Nazvali Barnabáše Jupiterem a Pavla Merkuriem a kněz Jupitera, jehož chrám stál před městem, přivedl býky a věnce, aby obětoval; apoštolové roztrhli roucho a poukázali na Boha živého, který učinil nebe i zemi. Pak získali lid Židé z Antiochie a Ikonia a Pavel byl ukamenován a vyvlečen z města pro mrtvého. Vstal a vrátil se dovnitř a nazítří odešel do Derbe; na zpáteční cestě tu posílil učedníky."
    - "Na další cestě našel Pavel v Lystře učedníka Timotea, syna věřící Židovky a otce Řeka, o němž dobré svědectví vydávali bratří v Lystře a Ikoniu, a vzal ho s sebou. Druhý list Timoteovi jmenuje jeho babičku Lois a matku Eunikou a připomíná Pavlova utrpení v Lystře. Městečko samo zůstalo malé a ještě roku 1907 napsal William Ramsay, že vykopávky v Lystře jsou naléhavě potřebné."
