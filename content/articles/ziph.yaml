body:
  en:
    - "Ziph was a town in the hill country of Judah about 6 km south-east of Hebron, listed with Maon, Carmel and Juttah, on the ridge where the cultivated hills break off into the Judean wilderness; “the wilderness of Ziph” is the bare slope falling east toward the Dead Sea. The mound of Tell Zif keeps the name. Chronicles makes Mesha, Caleb's firstborn, “the father of Ziph”, and a second Ziph in the Negeb of Judah, unidentified, appears in the southern list of Joshua."
    - "David, hunted by Saul, “remained in a mountain in the wilderness of Ziph”, and “in a wood”, where Jonathan came to him in their last recorded meeting. Then “came up the Ziphites to Saul to Gibeah, saying, Doth not David hide himself with us in strong holds in the wood, in the hill of Hachilah”; Saul came down, David slipped away to the wilderness of Maon, and the chase was broken by a Philistine raid. The Ziphites informed a second time, and Saul camped on the hill of Hachilah, where David crept into the camp by night and took his spear and cruse of water. The title of Psalm 54 remembers the betrayal: “when the Ziphims came and said to Saul, Doth not David hide himself with us?”"
    - "Rehoboam fortified Ziph among his fifteen cities of defence. Some two centuries later the jar handles stamped “belonging to the king” that Hezekiah's administration spread through Judah before Sennacherib's invasion carry one of four place names, Hebron, Ziph, Socoh and the unexplained Mmsht; whether these were royal estates, collection centres or something else is debated, but Ziph was clearly a centre of the kingdom's economy. Today Tell Zif stands in the south Hebron hills between Hebron and the wilderness, with Iron Age remains on the mound and Byzantine remains, among them a church, in the village of Zif beside it; the horizon east of it is still the wilderness where David hid."
  ru:
    - "Зиф — город в нагорье Иудеи примерно в 6 км к юго-востоку от Хеврона, названный вместе с Маоном, Кармилом и Ютой, на гребне, где возделанные холмы обрываются в Иудейскую пустыню; «пустыня Зиф» — голый склон, спадающий на восток к Мёртвому морю. Холм Телль-Зиф хранит имя. Паралипоменон делает Мешу, первенца Халева, отцом Зифа, а второй Зиф, в Негеве Иудином, не отождествлённый, стоит в южном списке книги Иисуса Навина."
    - "Давид, преследуемый Саулом, пребывал «на горе в пустыне Зиф» и «в пустыне Зиф в лесу», где Ионафан пришёл к нему на последнюю из описанных их встреч. Затем «пришли Зифеи к Саулу в Гиву, говоря: вот, Давид скрывается у нас в неприступных местах, в лесу, на холме Гахила»; Саул спустился, Давид ускользнул в пустыню Маон, и погоню прервал набег Филистимлян. Зифеи донесли во второй раз, и Саул стал станом на холме Гахила, где Давид ночью прокрался в стан и унёс его копьё и сосуд с водой. Надписание 53-го псалма помнит предательство: «когда пришли Зифеи и сказали Саулу: “не у нас ли скрывается Давид?”»"
    - "Ровоам укрепил Зиф среди своих пятнадцати городов-крепостей. Около двух веков спустя ручки кувшинов с оттиском «принадлежит царю», которые управление Езекии разослало по Иудее перед нашествием Сеннахирима, несут одно из четырёх названий: Хеврон, Зиф, Сохо и необъяснённое Ммшт; были ли это царские имения, сборные пункты или что-то иное — спорно, но Зиф явно был центром хозяйства царства. Сегодня Телль-Зиф стоит в южных Хевронских горах между Хевроном и пустыней, с остатками железного века на холме и византийскими остатками, среди них церковью, в соседней деревне Зиф; горизонт к востоку от него — всё та же пустыня, где скрывался Давид."
  uk:
    - "Зіф був містом у гірській країні Юди приблизно за 6 км на південний схід від Хеврона, названим з Маоном, Кармелем і Юттою, на гряді, де оброблювані пагорби обриваються в Юдейську пустелю; «пустеля Зіф» — голий схил, що спадає на схід до Мертвого моря. Назву зберігає пагорб Телль-Зіф. Хроніки роблять Мешу, первістка Калеба, «батьком Зифиним», а другий Зіф у Негеві Юди, неототожнений, з’являється в південному переліку Ісуса Навина."
    - "Давид, гнаний Саулом, перебував «по горах у пустинї Зиф» і «у лїсї», де Йонатан прийшов до нього на останню з описаних їхніх зустрічей. Потім «Зифяне ж прийшли до Саула в Гиву та й кажуть: Давид ховається в нас по неприступних місцях, в лїсї, на верху гори Гахила, що направо від Есимону»; Саул прийшов, Давид вислизнув у пустелю Маон, і переслідування обірвав филистимський набіг. Зифіяни донесли вдруге, і Саул таборував на пагорбі Гахіла, де Давид уночі прокрався в табір і взяв його спис і посудину з водою. Напис Псалма 54 пам’ятає зраду: «коли прийшли Зифеї і сказали Саулові: Чи Давид не сховався між нами?»"
    - "Ровоам укріпив Зіф серед своїх п’ятнадцяти міст оборони. Приблизно через два століття ручки глеків із печаткою «належить цареві», які адміністрація Єзекії розповсюдила по Юді перед нашестям Сінаххеріба, несуть одну з чотирьох назв місць: Хеврон, Зіф, Сохо та незрозуміле Ммшт; чи були це царські маєтки, збірні пункти чи щось інше, дискутується, але Зіф був, очевидно, осередком економіки царства. Нині Телль-Зіф стоїть у південних пагорбах Хеврона між Хевроном і пустелею, із залишками залізної доби на пагорбі й візантійськими залишками, серед них церквою, у сусідньому селі Зіф; обрій на схід від нього — досі пустеля, де ховався Давид."
  es:
    - "Zif era una ciudad de la región montañosa de Judá, a unos 6 km al sureste de Hebrón, enumerada con Maón, Carmel y Jutá, en la cresta donde las colinas cultivadas se rompen en el desierto de Judea; «el desierto de Ziph» es la ladera desnuda que cae hacia el este, hacia el mar Muerto. El montículo de Tell Zif conserva el nombre. Crónicas hace a Mesa, primogénito de Caleb, «el padre de Ziph», y una segunda Zif en el Néguev de Judá, sin identificar, aparece en la lista meridional de Josué."
    - "David, perseguido por Saúl, «habitaba en un monte en el desierto de Ziph», y «en el bosque», donde Jonatán vino a él en su último encuentro registrado. Luego «subieron los de Ziph á decir á Saúl en Gabaa: ¿No está David escondido en nuestra tierra en las peñas del bosque, en el collado de Hachîla»; Saúl bajó, David se escabulló al desierto de Maón, y la persecución se cortó por una incursión filistea. Los zifeos informaron una segunda vez, y Saúl acampó en la colina de Haquila, donde David se coló en el campamento de noche y tomó su lanza y su botija de agua. El título del Salmo 54 recuerda la traición: «cuando vinieron los Zipheos y dijeron á Saúl: ¿No está David escondido en nuestra tierra?»"
    - "Roboam fortificó Zif entre sus quince ciudades de defensa. Unos dos siglos después, las asas de jarras selladas «perteneciente al rey» que la administración de Ezequías repartió por Judá antes de la invasión de Senaquerib llevan uno de cuatro nombres de lugar, Hebrón, Zif, Soco y la inexplicada Mmsht; se discute si eran fincas reales, centros de recaudación u otra cosa, pero Zif era claramente un centro de la economía del reino. Hoy Tell Zif se alza en las colinas del sur de Hebrón, entre Hebrón y el desierto, con restos de la Edad del Hierro en el montículo y restos bizantinos, entre ellos una iglesia, en la aldea de Zif, a su lado; el horizonte al este de él sigue siendo el desierto donde David se ocultó."
  pt:
    - "Zife era uma cidade na região montanhosa de Judá, a cerca de 6 km a sudeste de Hebrom, listada com Maom, Carmelo e Jutá, na serra onde as colinas cultivadas se quebram no deserto de Judá; “o deserto de Zife” é a encosta nua que desce para leste, rumo ao Mar Morto. O monte de Tell Zif conserva o nome. Crônicas faz de Mesa, primogênito de Calebe, “o pai de Zife”, e uma segunda Zife no Neguebe de Judá, não identificada, aparece na lista meridional de Josué."
    - "Davi, caçado por Saul, “ficou na região montanhosa do deserto de Zife”, e em Horesa, onde Jônatas veio a ele no último encontro registrado entre os dois. Depois “os zifeus subiram até Saul, em Gibeá, e disseram: ‘Por acaso Davi não está escondido entre nós, nas fortalezas de Horesa, na colina de Haquila’”; Saul desceu, Davi escapou para o deserto de Maom, e a perseguição foi interrompida por uma incursão filisteia. Os zifeus denunciaram uma segunda vez, e Saul acampou na colina de Haquilá, onde Davi se esgueirou no acampamento à noite e tomou sua lança e seu jarro de água. O título do Salmo 54 recorda a traição: os zifeus foram dizer a Saul que Davi se escondia entre eles."
    - "Roboão fortificou Zife entre suas quinze cidades de defesa. Cerca de dois séculos depois, as alças de jarros carimbadas “pertencente ao rei” que a administração de Ezequias espalhou por Judá antes da invasão de Senaqueribe levam um de quatro nomes de lugar, Hebrom, Zife, Socó e o inexplicado Mmsht; se eram propriedades reais, centros de coleta ou outra coisa é debatido, mas Zife era claramente um centro da economia do reino. Hoje Tell Zif se ergue nas colinas do sul de Hebrom, entre Hebrom e o deserto, com restos da Idade do Ferro no montículo e restos bizantinos, entre eles uma igreja, na aldeia de Zif, ao lado; o horizonte a leste ainda é o deserto onde Davi se escondeu."
  de:
    - "Sif war eine Stadt im Bergland Judas etwa 6 km südöstlich von Hebron, aufgeführt mit Maon, Karmel und Juta, auf dem Höhenrücken, wo die bebauten Hügel in die Judäische Wüste abbrechen; „die Wüste Sif“ ist der kahle Hang, der nach Osten zum Toten Meer abfällt. Der Hügel Tell Zif bewahrt den Namen. Die Chronik macht Mesa, Kalebs Erstgeborenen, zu dem, der „der Vater Siphs“ ist, und ein zweites Sif im Negev Judas, nicht identifiziert, erscheint in der Südliste des Buches Josua."
    - "David, von Saul gejagt, „blieb auf dem Berge in der Wüste Siph“ und „in der Heide“, wo Jonatan zu ihm kam, ihre letzte überlieferte Begegnung. Dann: „Aber die Siphiter zogen hinauf zu Saul gen Gibea und sprachen: Ist nicht David bei uns verborgen an sicherem Ort in der Heide, auf dem Hügel Hachila, der zur Rechten liegt an der Wüste?“; Saul zog herab, David entkam in die Wüste Maon, und die Jagd wurde durch einen Philistereinfall unterbrochen. Die Sifiter verrieten ein zweites Mal, und Saul lagerte auf dem Hügel Hachila, wo David bei Nacht ins Lager schlich und Spieß und Wasserbecher nahm. Die Überschrift von Psalm 54 erinnert an den Verrat: „da die von Siph kamen und sprachen zu Saul: David hat sich bei uns verborgen“."
    - "Rehabeam befestigte Sif unter seinen fünfzehn Verteidigungsstädten. Etwa zwei Jahrhunderte später tragen die Krughenkel mit dem Stempel „dem König gehörig“, die Hiskias Verwaltung vor Sanheribs Einfall in ganz Juda verbreitete, einen von vier Ortsnamen: Hebron, Sif, Socho und das ungeklärte Mmsht; ob dies königliche Güter, Sammelstellen oder etwas anderes waren, ist umstritten, doch Sif war offenbar ein Zentrum der Wirtschaft des Königreichs. Heute steht Tell Zif in den südlichen Hebroner Bergen zwischen Hebron und der Wüste, mit eisenzeitlichen Resten auf dem Hügel und byzantinischen Resten, darunter einer Kirche, im Dorf Zif daneben; der Horizont östlich davon ist noch immer die Wüste, in der David sich verbarg."
  fr:
    - "Ziph était une ville de la montagne de Juda à environ 6 km au sud-est d’Hébron, citée avec Maon, Carmel et Jutta, sur la crête où les collines cultivées s’interrompent pour laisser place au désert de Judée ; « le désert de Ziph » est la pente nue qui descend vers l’est en direction de la mer Morte. Le tertre de Tell Zif en garde le nom. Les Chroniques font de Mescha, premier-né de Caleb, « père de Ziph », et un second Ziph dans le Négev de Juda, non identifié, figure dans la liste méridionale de Josué."
    - "David, traqué par Saül, « resta sur la montagne du désert de Ziph », et « dans la forêt », où Jonathan vint le voir lors de leur dernière rencontre rapportée. Puis « les Ziphiens montèrent auprès de Saül à Guibea, et dirent : David n’est-il pas caché parmi nous dans des lieux forts, dans la forêt, sur la colline de Hakila » ; Saül descendit, David s’esquiva vers le désert de Maon, et la poursuite fut interrompue par un raid philistin. Les Ziphiens dénoncèrent une seconde fois, et Saül campa sur la colline de Hakila, où David se glissa de nuit dans le camp et prit sa lance et sa cruche d’eau. Le titre du psaume 54 se souvient de la trahison : « Lorsque les Ziphiens vinrent dire à Saül : David n’est-il pas caché parmi nous ? »"
    - "Roboam fortifia Ziph parmi ses quinze villes de défense. Quelque deux siècles plus tard, les anses de jarres estampillées « appartenant au roi » que l’administration d’Ézéchias répandit dans Juda avant l’invasion de Sanchérib portent l’un de quatre noms de lieux, Hébron, Ziph, Soco et l’inexpliqué Mmsht ; que ce fussent des domaines royaux, des centres de collecte ou autre chose est débattu, mais Ziph était clairement un centre de l’économie du royaume. Aujourd’hui, Tell Zif se dresse dans les collines du sud d’Hébron entre Hébron et le désert, avec des vestiges de l’âge du fer sur le tell et des vestiges byzantins, dont une église, dans le village voisin de Zif ; l’horizon à l’est est toujours le désert où David se cacha."
  pl:
    - "Zif było miastem w górach Judy około 6 km na południowy wschód od Hebronu, wymienianym z Maon, Karmelem i Juttą, na grzbiecie, gdzie uprawiane wzgórza urywają się w Pustynię Judzką; „pustynia Zif” to goły stok opadający na wschód ku Morzu Martwemu. Kopiec Tell Zif zachowuje nazwę. Księgi Kronik czynią Mesza, pierworodnego Kaleba, tym, „który był ojcem Zyfejczyków”, a drugie Zif w Negewie Judy, nieutożsamione, pojawia się w południowym wykazie Jozuego."
    - "Dawid, ścigany przez Saula, „został na górze w puszczy Zyf” i „w lesie”, gdzie Jonatan przyszedł do niego na ich ostatnie opisane spotkanie. Potem „Tedy przyszli Zyfejczycy do Saula do Gabaa, powiadając: Azaż Dawid nie kryje się u nas po miejscach obronnych w lesie na pagórku Hachila”; Saul zszedł, Dawid umknął na pustynię Maon, a pościg przerwał najazd filistyński. Zifejczycy donieśli po raz drugi i Saul rozbił obóz na pagórku Chakila, gdzie Dawid wkradł się nocą do obozu i zabrał jego włócznię i dzban wody. Tytuł Psalmu 54 pamięta zdradę: „Gdy przyszli Zyfejczycy, i rzekli do Saula: Dawid się kryje przed tobą u nas.”"
    - "Roboam umocnił Zif wśród swoich piętnastu miast obronnych. Około dwóch stuleci później uchwyty dzbanów z pieczęcią „należące do króla”, które administracja Ezechiasza rozpowszechniła w Judzie przed najazdem Sennacheryba, noszą jedną z czterech nazw miejscowości: Hebron, Zif, Soko i niewyjaśnione Mmszt; czy były to dobra królewskie, ośrodki zbiórki, czy coś innego, jest sporne, ale Zif było wyraźnie ośrodkiem gospodarki królestwa. Dziś Tell Zif stoi w południowych wzgórzach Hebronu między Hebronem a pustynią, z pozostałościami z epoki żelaza na wzgórzu i bizantyjskimi, wśród nich kościołem, w sąsiedniej wsi Zif; horyzont na wschód od niego to nadal pustynia, gdzie ukrywał się Dawid."
  it:
    - "Zif era una città sulle alture di Giuda circa 6 km a sud-est di Ebron, elencata con Maon, Carmelo e Iutta, sul crinale dove le colline coltivate si spezzano nel deserto di Giuda; «il deserto di Zif» è il pendio nudo che scende a est verso il Mar Morto. Il tell di Tell Zif ne conserva il nome. Le Cronache fanno di Mesa, primogenito di Caleb, «padre di Zif», e una seconda Zif nel Negheb di Giuda, non identificata, compare nell’elenco meridionale di Giosuè."
    - "Davide, braccato da Saul, «se ne stette nella contrada montuosa del deserto di Zif» e «nella foresta», dove Gionata venne da lui nel loro ultimo incontro narrato. Poi «gli Zifei salirono da Saul a Ghibea e gli dissero: “Davide non sta egli nascosto fra noi, ne’ luoghi forti della foresta, sul colle di Hakila che è a mezzogiorno del deserto?”»; Saul scese, Davide scivolò via verso il deserto di Maon, e l’inseguimento fu interrotto da un’incursione filistea. Gli Zifei fecero la spia una seconda volta, e Saul si accampò sul colle di Chechilà, dove Davide si introdusse di notte nel campo e prese la sua lancia e la brocca dell’acqua. Il titolo del Salmo 54 ricorda il tradimento: «quando gli Zifei vennero a dire a Saul: Davide non si tiene egli nascosto fra noi?»"
    - "Roboamo fortificò Zif fra le sue quindici città di difesa. Circa due secoli dopo le anse di giara con il bollo «appartenente al re» che l’amministrazione di Ezechia diffuse in Giuda prima dell’invasione di Sennacherib portano uno di quattro nomi di luogo, Ebron, Zif, Soco e l’inspiegato Mmsht; se fossero tenute reali, centri di raccolta o altro è discusso, ma Zif era chiaramente un centro dell’economia del regno. Oggi Tell Zif sorge sulle colline di Ebron meridionali fra Ebron e il deserto, con resti dell’età del Ferro sul tell e resti bizantini, tra cui una chiesa, nel vicino villaggio di Zif; l’orizzonte a est di esso è ancora il deserto dove Davide si nascose."
  nl:
    - "Zif was een stad in het bergland van Juda, ongeveer 6 km ten zuidoosten van Hebron, genoemd met Maön, Karmel en Juta, op de bergrug waar de bebouwde heuvels afbreken in de Judese woestijn; “de woestijn Zif” is de kale helling die naar het oosten naar de Dode Zee afloopt. De heuvel Tell Zif bewaart de naam. Kronieken maakt Mesa, Kalebs eerstgeborene, “de vader van Zif”, en een tweede Zif in de Negev van Juda, niet geïdentificeerd, staat in de zuidelijke lijst van Jozua."
    - "David, door Saul opgejaagd, “bleef op den berg in de woestijn Zif”, en “in een woud”, waar Jonatan tot hem kwam bij hun laatste opgetekende ontmoeting. Daarna “togen de Zifieten op tot Saul naar Gibea, zeggende: Heeft zich niet David bij ons verborgen in de vestingen in het woud, op den heuvel van Hachila”; Saul kwam af, David glipte weg naar de woestijn Maön, en de achtervolging werd afgebroken door een Filistijnse inval. De Zifieten verklikten een tweede maal, en Saul legerde zich op de heuvel Chachila, waar David ’s nachts het kamp insloop en zijn spies en waterfles nam. Het opschrift van Psalm 54 herinnert aan het verraad: “Als de Zifieten gekomen waren, en tot Saul gezegd hadden: Verbergt zich David niet bij ons?”"
    - "Rehabeam versterkte Zif onder zijn vijftien vestingsteden. Zo’n twee eeuwen later dragen de kruikhengsels met de stempel “van de koning” die het bestuur van Chizkia vóór de inval van Sanherib door heel Juda verspreidde, een van vier plaatsnamen: Hebron, Zif, Socho en het onverklaarde Mmsht; of dit koninklijke landgoederen, inzamelcentra of iets anders waren, wordt betwist, maar Zif was duidelijk een centrum van de economie van het koninkrijk. Tegenwoordig staat Tell Zif in de zuidelijke heuvels van Hebron tussen Hebron en de woestijn, met resten uit de IJzertijd op de heuvel en Byzantijnse resten, waaronder een kerk, in het naastgelegen dorp Zif; de horizon ten oosten ervan is nog steeds de woestijn waar David zich verborg."
  cs:
    - "Zíf bylo město v judském pohoří asi 6 km jihovýchodně od Hebronu, uvedené s Maonem, Karmelem a Jutou, na hřebeni, kde obdělávané kopce přecházejí v Judskou poušť; Zífská poušť je holý svah klesající na východ k Mrtvému moři. Pahorek Tell Zíf zachovává jméno. Kroniky praví o Mešovi, Kálebově prvorozeném: „On byl otec Zifejských“, a druhý Zíf v Negevu Judy, neurčený, se objevuje v jižním seznamu Jozuově."
    - "David, pronásledovaný Saulem, „bydlil na hoře, na poušti Zif“ a „v lese“, kde za ním Jonatan přišel při jejich posledním zaznamenaném setkání. Potom „přišli Zifejští k Saulovi do Gabaa, řkouce: Zdaliž David nepokrývá se u nás v horách, v lese, na pahrbku Hachile“; Saul sestoupil, David se vyplížil do Maónské pouště a honičku přerušil pelištejský vpád. Zífští udávali podruhé a Saul se utábořil na pahorku Chachila, kde se David v noci vplížil do tábora a vzal jeho kopí a číši s vodou. Nadpis žalmu 54 připomíná zradu: „Když přišli Zifejští, a řekli Saulovi: Nevíš-liž, že se David pokrývá u nás?“"
    - "Rechabeám opevnil Zíf mezi svými patnácti pevnostními městy. Asi o dvě staletí později nesou ucha džbánů s razítkem „králi patřící“, která Chizkijášova správa rozšířila po Judě před Senacheribovým vpádem, jedno ze čtyř místních jmen: Hebron, Zíf, Sókó a nevysvětlené Mmšt; zda šlo o královská panství, sběrná střediska, nebo něco jiného, je sporné, ale Zíf byl zjevně střediskem hospodářství království. Dnes Tell Zíf stojí v jižních hebronských horách mezi Hebronem a pouští, s pozůstatky z doby železné na pahorku a byzantskými pozůstatky, mezi nimi kostelem, v sousední vesnici Zíf; obzor východně od něj je dosud pouští, kde se David skrýval."
  sv:
    - "Sif var en stad i Judas bergsbygd omkring 6 km sydost om Hebron, upptagen tillsammans med Maon, Karmel och Jutta, på åsen där de odlade bergen bryter av mot Judeens öken; ”öknen Sif” är den kala sluttning som faller österut mot Döda havet. Kullen Tell Zif bevarar namnet. Krönikeboken gör Mesha, Kalevs förstfödde, till ”Sifs fader”, och ett andra Sif i Judas Negev, oidentifierat, förekommer i Josuas södra förteckning."
    - "David, jagad av Saul, ”uppehöll sig bland bergen i öknen Sif”, och ”i Hores”, där Jonatan kom till honom vid deras sista dokumenterade möte. Därefter heter det: ”Men några sifiter drogo upp till Saul i Gibea och sade: ’David håller sig nu gömd hos oss på bergfästena i Hores, på Hakilahöjden’”; Saul kom ner, David smet undan till Maons öken, och jakten bröts av ett filisteiskt plundringståg. Sifiterna angav honom en andra gång, och Saul slog läger på höjden Hakila, där David smög in i lägret om natten och tog hans spjut och vattenkruka. Rubriken till Psalm 54 minns förräderiet: ”när sifiterna kommo och sade till Saul: ’David håller sig nu gömd hos oss.’”"
    - "Rehabeam befäste Sif bland sina femton fästningsstäder. Omkring två sekler senare bär de kärlhandtag stämplade ”tillhörande kungen” som Hiskias förvaltning spred över Juda före Sanheribs infall ett av fyra ortnamn, Hebron, Sif, Soko och det oförklarade Mmsht; om dessa var kungliga gods, uppsamlingscentra eller något annat är omdebatterat, men Sif var uppenbarligen ett centrum för rikets ekonomi. I dag står Tell Zif i södra Hebronbergen mellan Hebron och öknen, med lämningar från järnåldern på kullen och bysantinska lämningar, bland dem en kyrka, i byn Zif bredvid; horisonten öster därom är fortfarande den öken där David gömde sig."
  nb:
    - "Sif var en by i Judas fjellland omkring 6 km sørøst for Hebron, oppført sammen med Maon, Karmel og Jutta, på ryggen der de dyrkede åsene bryter av mot Judeaørkenen; «Sifs ørken» er den bare skråningen som faller østover mot Dødehavet. Haugen Tell Zif bevarer navnet. Krønikebøkene gjør Mesa, Kalebs førstefødte, til «far til Sif», og en annen Sif i Judas Negev, uidentifisert, forekommer i Josvas sørlige liste."
    - "David, jaget av Saul, «holdt til i fjellene i Sifs ørken», og «i skogen», der Jonatan kom til ham i deres siste kjente møte. Så heter det at «nogen sifitter drog op til Saul i Gibea og sa: David holder sig skjult hos oss i fjellborgene i skogen, på Kakilahaugen sønnenfor ørkenen»; Saul kom ned, David slapp unna til Maon-ørkenen, og jakten ble brutt av et filistersk innfall. Sifittene angav en gang til, og Saul slo leir på Hakila-høyden, der David krøp inn i leiren om natten og tok spydet og vannkrukken hans. Overskriften til Salme 54 minnes forræderiet: «da sifittene kom og sa til Saul: David holder sig skjult hos oss»."
    - "Rehabeam befestet Sif blant sine femten festningsbyer. Omkring to århundrer senere bærer krukkehåndtakene stemplet «tilhørende kongen» som Hiskias administrasjon spredte over Juda før Sankeribs invasjon ett av fire stedsnavn, Hebron, Sif, Soko og det uforklarte Mmsht; om dette var kongelige eiendommer, innsamlingssentre eller noe annet, er omdiskutert, men Sif var tydeligvis et senter i rikets økonomi. I dag står Tell Zif i de sørlige Hebron-åsene mellom Hebron og ørkenen, med levninger fra jernalderen på haugen og bysantinske levninger, blant dem en kirke, i landsbyen Zif ved siden av; horisonten øst for den er fortsatt ørkenen der David skjulte seg."
  tl:
    - "Ang Ziph ay bayan sa maburol na lupain ng Juda mga 6 km sa timog-silangan ng Hebron, nakatala kasama ng Maon, Carmel at Juta, sa tagaytay kung saan naghihiwalay ang mga sinasakang burol at ang ilang ng Judea; ang “ilang ng Ziph” ay ang hubad na dalisdis na bumabagsak pasilangan sa Dagat na Patay. Ang burol ng Tell Zif ang nagpapanatili ng pangalan. Ginagawa ng Mga Cronica si Mesa, panganay ni Caleb, na “siyang ama ni Ziph”, at ang ikalawang Ziph sa Negeb ng Juda, hindi natutukoy, ay lumilitaw sa timugang talaan ni Josue."
    - "Si David, na hinahabol ni Saul, ay “nanira sa lupaing maburol sa ilang ng Ziph”, at “sa gubat”, kung saan lumapit sa kaniya si Jonathan sa huli nilang naitalang pagkikita. Pagkatapos ay “inahon ng mga Zipheo si Saul, sa Gabaa, na sinasabi, Hindi ba nagkukubli sa amin si David sa mga katibayan sa gubat, sa burol ng Hachila”; bumaba si Saul, nakatakas si David sa ilang ng Maon, at naputol ang habulan ng pagsalakay ng mga Filisteo. Muling nagsumbong ang mga Zipheo, at nagkampo si Saul sa burol ng Hachila, kung saan pumasok si David nang gabi sa kampamento at kinuha ang sibat at banga ng tubig nito. Inaalala ng pamagat ng Awit 54 ang pagkakanulo, nang pumunta ang mga Zipheo kay Saul at sinabing nagkukubli si David sa kanila."
    - "Pinatibay ni Roboam ang Ziph sa labinlimang lunsod niya ng pananggalang. Halos dalawang siglo pagkaraan, ang mga hawakan ng banga na tinatakan ng “pag-aari ng hari” na ikinalat ng pamamahala ni Ezechias sa buong Juda bago ang pagsalakay ni Sennacherib ay may isa sa apat na pangalan ng lugar, Hebron, Ziph, Socho at ang di-maipaliwanag na Mmsht; pinagtatalunan kung maharlikang lupain, sentro ng koleksiyon o iba ito, ngunit malinaw na sentro ng ekonomiya ng kaharian ang Ziph. Nakatayo ngayon ang Tell Zif sa timugang mga burol ng Hebron sa pagitan ng Hebron at ng ilang, na may mga labi ng Panahong Bakal sa burol at mga labi ng panahong Bizantino, kasama ang simbahan, sa nayon ng Zif sa tabi nito; ang abot-tanaw sa silangan nito ay ang ilang pa rin kung saan nagtago si David."
  da:
    - "Zif var en by i Judas bjerge omkring 6 km sydøst for Hebron, opført sammen med Maon, Karmel og Jutta, på højdedraget, hvor de dyrkede bjerge bryder af mod Judæas ørken; »Zifs ørken« er den nøgne skråning, der falder mod øst mod Dødehavet. Tellen Tell Zif har bevaret navnet. Krønikebøgerne gør Mesja, Kalebs førstefødte, til »Stamfader til Sif«, og et andet Zif i Judas Negev, ikke identificeret, optræder i Josvas sydlige liste."
    - "David, jaget af Saul, »tog Ophold paa Bjerget i Ørken Sif« og var »i Skoven«, hvor Jonatan kom til ham ved deres sidste nedskrevne møde. Derpå: »Men Sifiterne droge op til Saul til Gibea og sagde: Har ikke David skjult sig hos os i Befæstningerne i Skoven paa Hakilas Høj, som ligger til højre for Jesimon?«; Saul kom ned, David slap bort til Maons ørken, og jagten blev brudt af et filistæisk strejftog. Zifitterne angav for anden gang, og Saul slog lejr på Hakilas høj, hvor David krøb ind i lejren om natten og tog hans spyd og vandkrus. Overskriften til Salme 54 husker forræderiet: »der Sifiterne kom og sagde til Saul: Har David ikke skjult sig hos os?«"
    - "Rehabeam befæstede Zif blandt sine femten fæstningsbyer. Omkring to århundreder senere bærer de krukkehanke, stemplet »tilhørende kongen«, som Hizkijas administration spredte over Juda inden Sankeribs indfald, et af fire stednavne: Hebron, Zif, Soko og det uforklarede Mmsht; om disse var kongelige godser, indsamlingssteder eller noget andet, er omdiskuteret, men Zif var tydeligvis et centrum for rigets økonomi. I dag står Tell Zif i de sydlige Hebron-bjerge mellem Hebron og ørkenen, med rester fra jernalderen på tellen og byzantinske rester, blandt dem en kirke, i landsbyen Zif ved siden af; horisonten øst for den er stadig den ørken, hvor David skjulte sig."
  sr:
    - "Зиф је био град у брдском крају Јуде око 6 км југоисточно од Хеврона, наведен с Маоном, Кармилом и Јутом, на гребену где се обрађена брда ломе у Јудејску пустињу; „пустиња Зиф“ је гола падина која пада на исток према Мртвом мору. Хум Тел Зиф чува име. Летописи чине Мису, Халевовог првенца, „отац Зифејима“, а други Зиф у Негеву Јуде, непоистовећен, јавља се у јужном списку Исуса Навина."
    - "Давид, гоњен од Саула, „намести се на једном брду у пустињи Зифу“ и „у шуми“, где му је Јонатан дошао у њиховом последњем забележеном сусрету. Затим „дођоше Зифеји к Саулу у Гавају, и рекоше: Не крије ли се Давид код нас по тврдим местима у шуми на брду Ехели“; Саул је сишао, Давид се измакао у пустињу Маон, а потеру је прекинуо филистејски препад. Зифејци су доставили по други пут, а Саул се улогорио на брду Хавила, где се Давид ноћу ушуњао у логор и узео његово копље и крчаг воде. Наслов Псалма 54 памти издају, када су Зифејци дошли и рекли Саулу: „Не крије ли се Давид код нас?“"
    - "Ровоам је утврдио Зиф међу својих петнаест утврђених градова. Око два века касније дршке посуда утиснуте „припада цару“ које је Језекијина управа раширила по Јуди пре Сенахиримове најезде носе једно од четири имена места, Хеврон, Зиф, Сохот и необјашњено ммшт; да ли су то биле краљевска имања, сабирни центри или нешто друго, спорно је, али је Зиф очигледно био центар краљевске привреде. Данас Тел Зиф стоји у јужним хевронским брдима између Хеврона и пустиње, са остацима гвозденог доба на хуму и византијским остацима, међу њима црквом, у селу Зиф крај њега; видик источно од њега и даље је пустиња у којој се Давид крио."
