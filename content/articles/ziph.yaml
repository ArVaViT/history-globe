# Overview article (ADR 0007). Mainstream facts only; the purpose of the royal jar stamps is named as debated.
id: ziph
place: a9b852f
title:
  en: "Ziph"
  ru: "Зиф"
  uk: "Зіф"
  es: "Zif"
  pt: "Zife"
  de: "Sif"
  fr: "Ziph"
body:
  en:
    - "Ziph was a town in the hill country of Judah about 6 km south-east of Hebron, listed with Maon, Carmel and Juttah, on the ridge where the cultivated hills break off into the Judean wilderness; “the wilderness of Ziph” is the bare slope falling east toward the Dead Sea. The mound of Tell Zif keeps the name. Chronicles makes Mesha, Caleb's firstborn, “the father of Ziph”, and a second Ziph in the Negeb of Judah, unidentified, appears in the southern list of Joshua."
    - "David, hunted by Saul, “remained in a mountain in the wilderness of Ziph”, and “in a wood”, where Jonathan came to him for the last time. Then “came up the Ziphites to Saul to Gibeah, saying, Doth not David hide himself with us in strong holds in the wood, in the hill of Hachilah”; Saul came down, David slipped away to the wilderness of Maon, and the chase was broken by a Philistine raid. The Ziphites informed a second time, and Saul camped on the hill of Hachilah, where David crept into the camp by night and took his spear and cruse of water. The title of Psalm 54 remembers the betrayal: “when the Ziphims came and said to Saul, Doth not David hide himself with us?”"
    - "Rehoboam fortified Ziph among his fifteen cities of defence. Three centuries later the jar handles stamped “belonging to the king” that Hezekiah's administration spread through Judah before Sennacherib's invasion carry one of four place names, Hebron, Ziph, Socoh and the unexplained Mmsht; whether these were royal estates, collection centres or something else is debated, but Ziph was clearly a centre of the kingdom's economy. Today Tell Zif stands in the south Hebron hills between Hebron and the wilderness, with Iron Age and Roman-Byzantine pottery on its surface; it has never been excavated, and the horizon east of it is still the wilderness where David hid."
  ru:
    - "Зиф — город в нагорье Иудеи примерно в 6 км к юго-востоку от Хеврона, названный вместе с Маоном, Кармилом и Ютой, на гребне, где возделанные холмы обрываются в Иудейскую пустыню; «пустыня Зиф» — голый склон, спадающий на восток к Мёртвому морю. Холм Телль-Зиф хранит имя. Паралипоменон делает Мешу, первенца Халева, отцом Зифа, а второй Зиф, в Негеве Иудином, не отождествлённый, стоит в южном списке книги Иисуса Навина."
    - "Давид, преследуемый Саулом, пребывал «на горе в пустыне Зиф» и «в пустыне Зиф в лесу», где Ионафан пришёл к нему в последний раз. Затем «пришли Зифеи к Саулу в Гиву, говоря: вот, Давид скрывается у нас в неприступных местах, в лесу, на холме Гахила»; Саул спустился, Давид ускользнул в пустыню Маон, и погоню прервал набег Филистимлян. Зифеи донесли во второй раз, и Саул стал станом на холме Гахила, где Давид ночью прокрался в стан и унёс его копьё и сосуд с водой. Надписание 53-го псалма помнит предательство: «когда пришли Зифеи и сказали Саулу: “не у нас ли скрывается Давид?”»"
    - "Ровоам укрепил Зиф среди своих пятнадцати городов-крепостей. Три века спустя ручки кувшинов с оттиском «принадлежит царю», которые управление Езекии разослало по Иудее перед нашествием Сеннахирима, несут одно из четырёх названий: Хеврон, Зиф, Сохо и необъяснённое Ммшт; были ли это царские имения, сборные пункты или что-то иное — спорно, но Зиф явно был центром хозяйства царства. Сегодня Телль-Зиф стоит в южных Хевронских горах между Хевроном и пустыней, с керамикой железного века и римско-византийского времени на поверхности; он никогда не раскапывался, а горизонт к востоку от него — всё та же пустыня, где скрывался Давид."
  uk:
    - "Зіф був містом у гірській країні Юди приблизно за 6 км на південний схід від Хеврона, названим з Маоном, Кармелем і Юттою, на гряді, де оброблювані пагорби обриваються в Юдейську пустелю; «пустеля Зіф» — голий схил, що спадає на схід до Мертвого моря. Назву зберігає пагорб Телль-Зіф. Хроніки роблять Мешу, первістка Калеба, «батьком Зифиним», а другий Зіф у Негеві Юди, неототожнений, з’являється в південному переліку Ісуса Навина."
    - "Давид, гнаний Саулом, перебував «по горах у пустинї Зиф» і «у лїсї», де Йонатан прийшов до нього востаннє. Потім «Зифяне ж прийшли до Саула в Гиву та й кажуть: Давид ховається в нас по неприступних місцях, в лїсї, на верху гори Гахила, що направо від Есимону»; Саул прийшов, Давид вислизнув у пустелю Маон, і переслідування обірвав филистимський набіг. Зифіяни донесли вдруге, і Саул таборував на пагорбі Гахіла, де Давид уночі прокрався в табір і взяв його спис і посудину з водою. Напис Псалма 54 пам’ятає зраду: «коли прийшли Зифеї і сказали Саулові: Чи Давид не сховався між нами?»"
    - "Ровоам укріпив Зіф серед своїх п’ятнадцяти міст оборони. Через три століття ручки глеків із печаткою «належить цареві», які адміністрація Єзекії розповсюдила по Юді перед нашестям Сінаххеріба, несуть одну з чотирьох назв місць: Хеврон, Зіф, Сохо та незрозуміле Ммшт; чи були це царські маєтки, збірні пункти чи щось інше, дискутується, але Зіф був, очевидно, осередком економіки царства. Нині Телль-Зіф стоїть у південних пагорбах Хеврона між Хевроном і пустелею, з керамікою залізної та римсько-візантійської доби на поверхні; його ніколи не розкопували, а обрій на схід від нього — досі пустеля, де ховався Давид."
  es:
    - "Zif era una ciudad de la región montañosa de Judá, a unos 6 km al sureste de Hebrón, enumerada con Maón, Carmel y Jutá, en la cresta donde las colinas cultivadas se rompen en el desierto de Judea; «el desierto de Ziph» es la ladera desnuda que cae hacia el este, hacia el mar Muerto. El montículo de Tell Zif conserva el nombre. Crónicas hace a Mesa, primogénito de Caleb, «el padre de Ziph», y una segunda Zif en el Néguev de Judá, sin identificar, aparece en la lista meridional de Josué."
    - "David, perseguido por Saúl, «habitaba en un monte en el desierto de Ziph», y «en el bosque», donde Jonatán vino a él por última vez. Luego «subieron los de Ziph á decir á Saúl en Gabaa: ¿No está David escondido en nuestra tierra en las peñas del bosque, en el collado de Hachîla»; Saúl bajó, David se escabulló al desierto de Maón, y la persecución se cortó por una incursión filistea. Los zifeos informaron una segunda vez, y Saúl acampó en la colina de Haquila, donde David se coló en el campamento de noche y tomó su lanza y su botija de agua. El título del Salmo 54 recuerda la traición: «cuando vinieron los Zipheos y dijeron á Saúl: ¿No está David escondido en nuestra tierra?»"
    - "Roboam fortificó Zif entre sus quince ciudades de defensa. Tres siglos después, las asas de jarras selladas «perteneciente al rey» que la administración de Ezequías repartió por Judá antes de la invasión de Senaquerib llevan uno de cuatro nombres de lugar, Hebrón, Zif, Soco y la inexplicada Mmsht; se discute si eran fincas reales, centros de recaudación u otra cosa, pero Zif era claramente un centro de la economía del reino. Hoy Tell Zif se alza en las colinas del sur de Hebrón, entre Hebrón y el desierto, con cerámica de la Edad del Hierro y romano-bizantina en su superficie; nunca ha sido excavado, y el horizonte al este de él sigue siendo el desierto donde David se ocultó."
  pt:
    - "Zife era uma cidade na região montanhosa de Judá, a cerca de 6 km a sudeste de Hebrom, listada com Maom, Carmelo e Jutá, na serra onde as colinas cultivadas se quebram no deserto de Judá; “o deserto de Zife” é a encosta nua que desce para leste, rumo ao Mar Morto. O monte de Tell Zif conserva o nome. Crônicas faz de Mesa, primogênito de Calebe, “o pai de Zife”, e uma segunda Zife no Neguebe de Judá, não identificada, aparece na lista meridional de Josué."
    - "Davi, caçado por Saul, “ficou na região montanhosa do deserto de Zife”, e em Horesa, onde Jônatas veio a ele pela última vez. Depois “os zifeus subiram até Saul, em Gibeá, e disseram: ‘Por acaso Davi não está escondido entre nós, nas fortalezas de Horesa, na colina de Haquila’”; Saul desceu, Davi escapou para o deserto de Maom, e a perseguição foi interrompida por uma incursão filisteia. Os zifeus denunciaram uma segunda vez, e Saul acampou na colina de Haquilá, onde Davi se esgueirou no acampamento à noite e tomou sua lança e seu jarro de água. O título do Salmo 54 recorda a traição: os zifeus foram dizer a Saul que Davi se escondia entre eles."
    - "Roboão fortificou Zife entre suas quinze cidades de defesa. Três séculos depois, as alças de jarros carimbadas “pertencente ao rei” que a administração de Ezequias espalhou por Judá antes da invasão de Senaqueribe levam um de quatro nomes de lugar, Hebrom, Zife, Socó e o inexplicado Mmsht; se eram propriedades reais, centros de coleta ou outra coisa é debatido, mas Zife era claramente um centro da economia do reino. Hoje Tell Zif se ergue nas colinas do sul de Hebrom, entre Hebrom e o deserto, com cerâmica da Idade do Ferro e romano-bizantina na superfície; nunca foi escavado, e o horizonte a leste ainda é o deserto onde Davi se escondeu."
  de:
    - "Sif war eine Stadt im Bergland Judas etwa 6 km südöstlich von Hebron, aufgeführt mit Maon, Karmel und Juta, auf dem Höhenrücken, wo die bebauten Hügel in die Judäische Wüste abbrechen; „die Wüste Sif“ ist der kahle Hang, der nach Osten zum Toten Meer abfällt. Der Hügel Tell Zif bewahrt den Namen. Die Chronik macht Mesa, Kalebs Erstgeborenen, zu dem, der „der Vater Siphs“ ist, und ein zweites Sif im Negev Judas, nicht identifiziert, erscheint in der Südliste des Buches Josua."
    - "David, von Saul gejagt, „blieb auf dem Berge in der Wüste Siph“ und „in der Heide“, wo Jonatan zum letzten Mal zu ihm kam. Dann: „Aber die Siphiter zogen hinauf zu Saul gen Gibea und sprachen: Ist nicht David bei uns verborgen an sicherem Ort in der Heide, auf dem Hügel Hachila, der zur Rechten liegt an der Wüste?“; Saul zog herab, David entkam in die Wüste Maon, und die Jagd wurde durch einen Philistereinfall unterbrochen. Die Sifiter verrieten ein zweites Mal, und Saul lagerte auf dem Hügel Hachila, wo David bei Nacht ins Lager schlich und Spieß und Wasserbecher nahm. Die Überschrift von Psalm 54 erinnert an den Verrat: „da die von Siph kamen und sprachen zu Saul: David hat sich bei uns verborgen“."
    - "Rehabeam befestigte Sif unter seinen fünfzehn Verteidigungsstädten. Drei Jahrhunderte später tragen die Krughenkel mit dem Stempel „dem König gehörig“, die Hiskias Verwaltung vor Sanheribs Einfall in ganz Juda verbreitete, einen von vier Ortsnamen: Hebron, Sif, Socho und das ungeklärte Mmsht; ob dies königliche Güter, Sammelstellen oder etwas anderes waren, ist umstritten, doch Sif war offenbar ein Zentrum der Wirtschaft des Königreichs. Heute steht Tell Zif in den südlichen Hebroner Bergen zwischen Hebron und der Wüste, mit eisenzeitlicher und römisch-byzantinischer Keramik an der Oberfläche; er wurde nie ausgegraben, und der Horizont östlich davon ist noch immer die Wüste, in der David sich verbarg."
  fr:
    - "Ziph était une ville de la montagne de Juda à environ 6 km au sud-est d’Hébron, citée avec Maon, Carmel et Jutta, sur la crête où les collines cultivées s’interrompent pour laisser place au désert de Judée ; « le désert de Ziph » est la pente nue qui descend vers l’est en direction de la mer Morte. Le tertre de Tell Zif en garde le nom. Les Chroniques font de Mescha, premier-né de Caleb, « père de Ziph », et un second Ziph dans le Négev de Juda, non identifié, figure dans la liste méridionale de Josué."
    - "David, traqué par Saül, « resta sur la montagne du désert de Ziph », et « dans la forêt », où Jonathan vint le voir pour la dernière fois. Puis « les Ziphiens montèrent auprès de Saül à Guibea, et dirent : David n’est-il pas caché parmi nous dans des lieux forts, dans la forêt, sur la colline de Hakila » ; Saül descendit, David s’esquiva vers le désert de Maon, et la poursuite fut interrompue par un raid philistin. Les Ziphiens dénoncèrent une seconde fois, et Saül campa sur la colline de Hakila, où David se glissa de nuit dans le camp et prit sa lance et sa cruche d’eau. Le titre du psaume 54 se souvient de la trahison : « Lorsque les Ziphiens vinrent dire à Saül : David n’est-il pas caché parmi nous ? »"
    - "Roboam fortifia Ziph parmi ses quinze villes de défense. Trois siècles plus tard, les anses de jarres estampillées « appartenant au roi » que l’administration d’Ézéchias répandit dans Juda avant l’invasion de Sanchérib portent l’un de quatre noms de lieux, Hébron, Ziph, Soco et l’inexpliqué Mmsht ; que ce fussent des domaines royaux, des centres de collecte ou autre chose est débattu, mais Ziph était clairement un centre de l’économie du royaume. Aujourd’hui, Tell Zif se dresse dans les collines du sud d’Hébron entre Hébron et le désert, avec de la poterie de l’âge du fer et de l’époque romano-byzantine en surface ; il n’a jamais été fouillé, et l’horizon à l’est est toujours le désert où David se cacha."
