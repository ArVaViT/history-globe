body:
  en:
    - "This Aroer was a town of the Negev of Judah, distinct from the Aroer of Moab on the Arnon and the one near Rabbah of Ammon. Edward Robinson identified it with Tel 'Aroer (Khirbet 'Ar'ara), on the bank of the 'Aroer stream in the southernmost part of the Beersheba–Arad valley, about 22 km south-east of Beersheba. After David recovered the spoil taken by the Amalekites at Ziklag, he sent gifts “to them which were in Aroer, and to them which were in Siphmoth, and to them which were in Eshtemoa”; it is the only mention of this Aroer."
    - "Avraham Biran of the Nelson Glueck School of Biblical Archaeology excavated the mound in 1975 with Rudolf Cohen, and alone in 1976–1978 and 1980–1982; Yifat Thareani published the results. The town of the eighth to early sixth century BC was enclosed by a wall; its finds include Judean, coastal and Edomite pottery, shekel weights, seals and inscriptions in Hebrew, Edomite and South Arabian script, witnesses of the caravan trade, and it was destroyed early in the sixth century BC. In the Early Roman period a fort stood on the site. Tel 'Aroer lies today in southern Israel."
  ru:
    - "Этот Ароер — город Негева Иудейского, отличный от Ароера Моавитского на Арноне и Ароера близ Раввы Аммонитской. Эдвард Робинсон отождествил его с Тель-Ароером (Хирбет-Арара) на берегу потока Ароер, в самой южной части долины Беэр-Шева — Арад, примерно в 22 км к юго-востоку от Беэр-Шевы. Вернув у Секелага добычу, взятую амаликитянами, Давид послал подарки и тем, кто был «в Ароере, и в Аммаде, и в Шифмофе, и в Естемоа»; это единственное упоминание этого Ароера."
    - "Авраам Биран из Библейско-археологической школы Нельсона Глюка раскапывал холм в 1975 г. вместе с Рудольфом Коэном, а в 1976–1978 и 1980–1982 гг. — один; результаты издала Ифат Тареани. Город VIII — начала VI в. до н. э. был обнесён стеной; среди находок — иудейская, приморская и эдомская керамика, гири-шекели, печати и надписи еврейским, эдомским и южноаравийским письмом, свидетельства караванной торговли; в начале VI в. до н. э. город был разрушен. В раннеримское время здесь стояла крепость. Тель-Ароер находится сегодня на юге Израиля."
  uk:
    - "Цей Ароер був містом юдейського Негева, відмінним від Ароера Моаву на Арноні та того, що біля Рабби Аммонської. Едвард Робінсон ототожнив його з Тель-Ароер (Хірбет-Арара), на березі потоку Ароер у найпівденнішій частині долини Беер-Шева–Арад, приблизно за 22 км на південний схід від Беер-Шеви. Коли Давид повернув здобич, захоплену амаликитянами в Ціклазі, він розіслав її частину, у тому числі: «Тим що в Ароїрі, і в Шифмотї, і в Естемоа»; це єдина згадка про цей Ароер."
    - "Авраам Біран зі Школи біблійної археології імені Нельсона Глюка розкопував пагорб 1975 р. разом із Рудольфом Коеном, а сам — у 1976–1978 і 1980–1982 рр.; результати опублікувала Іфат Тареані. Місто VIII — початку VI ст. до н. е. було обнесене муром; серед знахідок — юдейська, прибережна та едомська кераміка, шекельні гирі, печатки й написи єврейським, едомським і південноаравійським письмом, свідки караванної торгівлі; воно було зруйноване на початку VI ст. до н. е. В ранньоримський період на місці стояла фортеця. Тель-Ароер лежить нині на півдні Ізраїлю."
  es:
    - "Este Aroer era una ciudad del Négueb de Judá, distinta del Aroer de Moab, en el Arnón, y del cercano a Rabá de Amón. Edward Robinson la identificó con Tel 'Aroer (Khirbet 'Ar'ara), en la orilla del arroyo 'Aroer, en la parte más meridional del valle de Beerseba–Arad, a unos 22 km al sureste de Beerseba. Después de que David recuperara el botín tomado por los amalecitas en Siclag, envió regalos «á los que estaban en Aroer, y en Siphmoth, y á los que estaban en Esthemoa»; es la única mención de este Aroer."
    - "Avraham Biran, de la Escuela Nelson Glueck de Arqueología Bíblica, excavó el montículo en 1975 con Rudolf Cohen, y solo en 1976–1978 y 1980–1982; Yifat Thareani publicó los resultados. La ciudad de los siglos VIII a comienzos del VI a. C. estaba cercada por un muro; entre sus hallazgos hay cerámica judaíta, costera y edomita, pesas de siclo, sellos e inscripciones en escritura hebrea, edomita y sudarábiga, testigos del comercio caravanero, y fue destruida a comienzos del siglo VI a. C. En el período romano temprano se alzó un fuerte en el lugar. Tel 'Aroer se encuentra hoy en el sur de Israel."
  de:
    - "Dieses Aroër war eine Stadt im Negev von Juda, verschieden vom Aroër Moabs am Arnon und dem bei Rabba der Ammoniter. Edward Robinson setzte es mit Tel Aroër (Chirbet Ar'ara) gleich, am Ufer des Bachs Aroër im südlichsten Teil des Tals Beerscheba–Arad, etwa 22 km südöstlich von Beerscheba. Nachdem David die von den Amalekitern bei Ziklag genommene Beute zurückgeholt hatte, sandte er Geschenke „denen zu Aroer, denen zu Siphamoth, denen zu Esthemoa“; es ist die einzige Erwähnung dieses Aroër."
    - "Avraham Biran von der Nelson Glueck School of Biblical Archaeology grub den Hügel 1975 mit Rudolf Cohen und allein 1976–1978 und 1980–1982 aus; Yifat Thareani veröffentlichte die Ergebnisse. Die Stadt vom achten bis zum frühen sechsten Jahrhundert v. Chr. war von einer Mauer umgeben; zu den Funden gehören judäische, küstenländische und edomitische Keramik, Schekelgewichte, Siegel und Inschriften in hebräischer, edomitischer und südarabischer Schrift, Zeugen des Karawanenhandels, und sie wurde Anfang des sechsten Jahrhunderts v. Chr. zerstört. In der frühen römischen Zeit stand auf der Stätte ein Kastell. Tel Aroër liegt heute im Süden Israels."
  fr:
    - "Cet Aroër était une ville du Néguev de Juda, distincte de l’Aroër de Moab sur l’Arnon et de celle qui se trouve près de Rabba d’Ammon. Edward Robinson l’identifia avec Tel ‘Aroer (Khirbet ‘Ar‘ara), sur la rive du ruisseau ‘Aroer, dans la partie la plus méridionale de la vallée de Beer-Schéba–Arad, à environ 22 km au sud-est de Beer-Schéba. Après que David eut repris le butin enlevé par les Amalécites à Tsiklag, il envoya des présents « à ceux d’Aroër, à ceux de Siphmoth, à ceux d’Eschthemoa » ; c’est la seule mention de cet Aroër."
    - "Avraham Biran, de la Nelson Glueck School of Biblical Archaeology, fouilla la butte en 1975 avec Rudolf Cohen, puis seul en 1976–1978 et 1980–1982 ; Yifat Thareani publia les résultats. La ville du VIIIe au début du VIe siècle av. J.-C. était entourée d’un rempart ; ses trouvailles comprennent de la céramique judéenne, côtière et édomite, des poids de sicle, des sceaux et des inscriptions en écriture hébraïque, édomite et sud-arabique, témoins du commerce caravanier, et elle fut détruite au début du VIe siècle av. J.-C. À l’époque romaine ancienne, un fort se dressait sur le site. Tel ‘Aroer se trouve aujourd’hui dans le sud d’Israël."
  pt:
    - "Esta Aroer era uma cidade do Neguebe de Judá, distinta da Aroer de Moabe, no Arnom, e da que ficava perto de Rabá de Amom. Edward Robinson a identificou com Tel 'Aroer (Khirbet 'Ar'ara), na margem do riacho 'Aroer, na parte mais meridional do vale de Berseba–Arade, cerca de 22 km a sudeste de Berseba. Depois que Davi recuperou o despojo tomado pelos amalequitas em Ziclague, enviou presentes “aos que estavam em Aroer, Sifmote e Estemoa”; é a única menção desta Aroer."
    - "Avraham Biran, da Escola Nelson Glueck de Arqueologia Bíblica, escavou o montículo em 1975 com Rudolf Cohen, e sozinho em 1976–1978 e 1980–1982; Yifat Thareani publicou os resultados. A cidade dos séculos VIII ao início do VI a.C. era cercada por um muro; entre seus achados estão cerâmica judaíta, costeira e edomita, pesos de siclo, selos e inscrições em escrita hebraica, edomita e sul-arábica, testemunhos do comércio de caravanas, e foi destruída no início do século VI a.C. No período romano antigo havia um forte no local. Tel 'Aroer fica hoje no sul de Israel."
  it:
    - "Questa Aroer era una città del Negev di Giuda, distinta dall’Aroer di Moab sull’Arnon e da quella presso Rabba di Ammon. Edward Robinson la identificò con Tel ‘Aroer (Khirbet ‘Ar‘ara), sulla riva del torrente ‘Aroer nella parte più meridionale della valle di Bersabea-Arad, a circa 22 km a sud-est di Bersabea. Dopo che Davide recuperò il bottino preso dagli Amaleciti a Siclag, mandò doni «a quelli d’Aroer, a quelli di Simoth, a quelli d’Eshtemoa»; è l’unica menzione di questa Aroer."
    - "Avraham Biran della Nelson Glueck School of Biblical Archaeology scavò il tell nel 1975 con Rudolf Cohen, e da solo nel 1976–1978 e nel 1980–1982; Yifat Thareani ne ha pubblicato i risultati. La città dell’VIII–inizio VI secolo a.C. era cinta da un muro; tra i suoi reperti vi sono ceramica giudaica, costiera ed edomita, pesi in sicli, sigilli e iscrizioni in scrittura ebraica, edomita e sudarabica, testimoni del commercio carovaniero, e fu distrutta all’inizio del VI secolo a.C. In epoca romana antica sul sito sorgeva un forte. Tel ‘Aroer si trova oggi nel sud di Israele."
  nl:
    - "Dit Aroër was een stad in de Negev van Juda, te onderscheiden van het Aroër van Moab aan de Arnon en dat bij Rabba van Ammon. Edward Robinson vereenzelvigde het met Tel 'Aroer (Khirbet 'Ar'ara), aan de oever van de beek 'Aroer in het zuidelijkste deel van de vallei van Berseba–Arad, ongeveer 22 km ten zuidoosten van Berseba. Nadat David de buit had teruggewonnen die de Amalekieten bij Ziklag hadden genomen, zond hij geschenken “tot die te Aroer, en tot die te Sifmoth, en tot die te Esthemoa”; het is de enige vermelding van dit Aroër."
    - "Avraham Biran van de Nelson Glueck School of Biblical Archaeology groef de heuvel op in 1975 met Rudolf Cohen, en alleen in 1976–1978 en 1980–1982; Yifat Thareani publiceerde de resultaten. De stad uit de achtste tot vroege zesde eeuw v.Chr. was door een muur omgeven; de vondsten omvatten Judees, kustgebonden en Edomitisch aardewerk, sikkelgewichten, zegels en inscripties in Hebreeuws, Edomitisch en Zuid-Arabisch schrift, getuigen van de karavaanhandel, en zij werd vroeg in de zesde eeuw v.Chr. verwoest. In de vroeg-Romeinse tijd stond er een fort op de plaats. Tel 'Aroer ligt tegenwoordig in het zuiden van Israël."
  pl:
    - "Ten Aroer był miastem w Negewie Judy, odrębnym od Aroeru Moabu nad Arnonem i od tego koło Rabby Ammonitów. Edward Robinson utożsamił go z Tel 'Aroer (Chirbet 'Ar'ara), na brzegu potoku 'Aroer w najdalej na południe położonej części doliny Beer-Szeba-Arad, około 22 km na południowy wschód od Beer-Szeby. Gdy Dawid odzyskał łupy zabrane przez Amalekitów w Siklag, wysłał dary do tych, „co byli w Aroer, i co byli w Sefamot, i co byli w Estamo”; jest to jedyna wzmianka o tym Aroerze."
    - "Avraham Biran z Nelson Glueck School of Biblical Archaeology badał wzgórze w 1975 roku z Rudolfem Cohenem, a sam w latach 1976-1978 i 1980-1982; wyniki opublikowała Yifat Thareani. Miasto z VIII do początku VI w. p.n.e. było otoczone murem; wśród znalezisk są ceramika judzka, nadmorska i edomicka, odważniki szekla, pieczęcie i inskrypcje pismem hebrajskim, edomickim i południowoarabskim, świadectwa handlu karawanowego; zniszczono je na początku VI w. p.n.e. We wczesnym okresie rzymskim na stanowisku stał fort. Tel 'Aroer leży dziś w południowym Izraelu."
  cs:
    - "Tento Aroer bylo město v judském Negevu, odlišné od moábského Aroeru na Arnonu a od Aroeru poblíž Rabby Amónské. Edward Robinson jej ztotožnil s Tel 'Aroer (Chirbet 'Ar'ara) na břehu potoka 'Aroer v nejjižnější části údolí Beer-šeba–Arad, asi 22 km jihovýchodně od Beer-šeby. Poté, co David získal zpět kořist, kterou Amalekovci vzali v Siklagu, poslal dary „kteříž v Aroer, a kteříž v Sefama, a kteříž v Estemo“; je to jediná zmínka o tomto Aroeru."
    - "Avraham Biran z Nelson Glueck School of Biblical Archaeology pahorek kopal roku 1975 s Rudolfem Cohenem a sám v letech 1976–1978 a 1980–1982; výsledky publikovala Yifat Thareani. Město z osmého až raného šestého století př. n. l. bylo obehnáno hradbou; mezi nálezy je judská, pobřežní a edómská keramika, závaží šekelů, pečeti a nápisy hebrejským, edómským a jihoarabským písmem, svědkové karavanního obchodu, a město bylo zničeno na počátku šestého století př. n. l. V raně římském období stála na místě pevnůstka. Tel 'Aroer leží dnes v jižním Izraeli."
