# Overview article (ADR 0007). Mainstream facts only; Assyrian Rasappa; the traditional Resafa and the Assyrian province are both given; mainstream facts only.
id: rezeph
place: aefdac1
title:
  en: "Rezeph"
  ru: "Рецеф"
body:
  en:
    - "Rezeph is named in the Assyrian message to Hezekiah during Sennacherib's campaign of 701 BC. To show that no god could save Jerusalem, the king's letter asks: “Have the gods of the nations delivered them which my fathers have destroyed; as Gozan, and Haran, and Rezeph, and the children of Eden which were in Thelasar?” Rezeph is the Rasappa of Assyrian texts, the seat of a province in the steppe west of the Tigris whose governors served as eponyms of the year; one of them, Nergal-eresh, governed it under Adad-nirari III."
    - "Where its capital stood is disputed. Since the 1920s scholars have been divided between Resafa, the walled desert town south of the Euphrates later called Sergiopolis after the martyr Sergius, and a site on the slopes of the Jebel Sinjar far to the east; no excavation has settled it, and the map marks both, with Resafa first. The ruins of Resafa, with its great basilica and Umayyad palace, lie in the Raqqa governorate of Syria."
  ru:
    - "Рецеф назван в ассирийском послании к Езекии во время похода Сеннахирима в 701 г. до н. э. Чтобы показать, что никакой бог не спасёт Иерусалим, письмо царя спрашивает: «Боги народов, которых разорили отцы мои, спасли ли их? Спасли ли Гозан, и Харан, и Рецеф, и сынов Едена, что в Фалассаре?» Рецеф — это Расаппа ассирийских текстов, центр провинции в степи к западу от Тигра, наместники которой давали имя году; один из них, Нергал-эреш, правил ею при Ададнерари III."
    - "Где стоял её главный город, спорят. С 1920-х годов учёные делятся между Ресафой, обнесённым стеной городом в пустыне к югу от Евфрата, позже названным Сергиополем в честь мученика Сергия, и местом на склонах Джебель-Синджара далеко на востоке; раскопки этого не решили, и на карте отмечены оба места, Ресафа первой. Развалины Ресафы с большой базиликой и дворцом Омейядов лежат в мухафазе Ракка в Сирии."
