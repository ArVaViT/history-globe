body:
  en:
    - "Rezeph is named in the Assyrian message to Hezekiah during Sennacherib's campaign of 701 BC. To show that no god could save Jerusalem, the king's letter asks: “Have the gods of the nations delivered them which my fathers have destroyed; as Gozan, and Haran, and Rezeph, and the children of Eden which were in Thelasar?” Rezeph is the Rasappa of Assyrian texts, the seat of a province in the steppe west of the Tigris whose governors served as eponyms of the year; one of them, Nergal-eresh, governed it under Adad-nirari III."
    - "Where its capital stood is disputed. Scholars have been divided between Resafa, the walled desert town south of the Euphrates later called Sergiopolis after the martyr Sergius, and a site on the slopes of the Jebel Sinjar far to the east; no excavation has settled it, and the map marks both, with Resafa first. The ruins of Resafa, with its great basilica and Umayyad palace, lie in the Raqqa governorate of Syria."
  ru:
    - "Рецеф назван в ассирийском послании к Езекии во время похода Сеннахирима в 701 г. до н. э. Чтобы показать, что никакой бог не спасёт Иерусалим, письмо царя спрашивает: «Боги народов, которых разорили отцы мои, спасли ли их? Спасли ли Гозан, и Харан, и Рецеф, и сынов Едена, что в Фалассаре?» Рецеф — это Расаппа ассирийских текстов, центр провинции в степи к западу от Тигра, наместники которой давали имя году; один из них, Нергал-эреш, правил ею при Ададнерари III."
    - "Где стоял её главный город, спорят. Учёные делятся между Ресафой, обнесённым стеной городом в пустыне к югу от Евфрата, позже названным Сергиополем в честь мученика Сергия, и местом на склонах Джебель-Синджара далеко на востоке; раскопки этого не решили, и на карте отмечены оба места, Ресафа первой. Развалины Ресафы с большой базиликой и дворцом Омейядов лежат в мухафазе Ракка в Сирии."
  uk:
    - "Рецеф згадано в ассирійському посланні до Єзекії під час походу Сінаххеріба 701 р. до н. е. Щоб показати, що жоден бог не врятує Єрусалим, лист царя питає: «Хиба ж боги народів, що їх мої предки в нїщо пообертали, вирятували їх, — як Гозан та Харан та Резеф та людей Еденських у Талассарі?» Рецеф — це Расаппа ассирійських текстів, осідок провінції в степу на захід від Тигру, чиї правителі слугували епонімами року; один із них, Нергал-ереш, правив нею за Адад-нірарі III."
    - "Де стояла його столиця, спірно. Учені розділилися між Ресафою — обгородженим стінами пустельним містом на південь від Євфрату, пізніше названим Сергіополем на честь мученика Сергія, — і місцем на схилах Джебель-Сінджар далеко на схід; жодні розкопки цього не вирішили, і карта позначає обидва, Ресафу першою. Руїни Ресафи з її величною базилікою та омейядським палацом лежать у провінції Ракка в Сирії."
  es:
    - "Resef se nombra en el mensaje asirio a Ezequías durante la campaña de Senaquerib de 701 a. C. Para mostrar que ningún dios podía salvar a Jerusalén, la carta del rey pregunta: «¿Libráronlas los dioses de las gentes, que mis padres destruyeron, es á saber, Gozán, y Harán, y Reseph, y los hijos de Edén que estaban en Thalasar?». Resef es la Rasappa de los textos asirios, sede de una provincia en la estepa al oeste del Tigris cuyos gobernadores servían como epónimos del año; uno de ellos, Nergal-ereš, la gobernó bajo Adad-nirari III."
    - "Dónde estaba su capital se discute. Los estudiosos se dividen entre Resafa, la ciudad amurallada del desierto al sur del Éufrates, llamada más tarde Sergiópolis por el mártir Sergio, y un lugar en las laderas del Jebel Sinjar, mucho más al este; ninguna excavación lo ha resuelto, y el mapa señala ambos, con Resafa en primer lugar. Las ruinas de Resafa, con su gran basílica y su palacio omeya, se encuentran en la gobernación siria de Raqqa."
  pt:
    - "Rezefe é citada na mensagem assíria a Ezequias durante a campanha de Senaqueribe em 701 a.C. Para mostrar que nenhum deus poderia salvar Jerusalém, a carta do rei pergunta: “Acaso os deuses das nações as livraram, as quais os meus pais destruíram — Gozã, Harã, Rezefe e os filhos de Éden que estavam em Telassar?” Rezefe é a Rasappa dos textos assírios, sede de uma província na estepe a oeste do Tigre cujos governadores serviam como epônimos do ano; um deles, Nergal-eresh, a governou sob Adad-nirari III."
    - "Onde ficava sua capital é disputado. Os estudiosos se dividem entre Resafa, a cidade murada do deserto ao sul do Eufrates, mais tarde chamada Sergiópolis em honra do mártir Sérgio, e um local nas encostas do Jebel Sinjar, bem a leste; nenhuma escavação resolveu, e o mapa marca os dois, com Resafa em primeiro. As ruínas de Resafa, com sua grande basílica e palácio omíada, ficam na província de Raqqa, na Síria."
  de:
    - "Rezef wird in der assyrischen Botschaft an Hiskia während Sanheribs Feldzug von 701 v. Chr. genannt. Um zu zeigen, dass kein Gott Jerusalem retten könne, fragt der Brief des Königs: „Haben der Heiden Götter auch sie errettet, welche meine Väter haben verderbt: Gosan, Haran, Rezeph und die Kinder Edens, die zu Thelassar waren?“ Rezef ist das Rasappa der assyrischen Texte, Sitz einer Provinz in der Steppe westlich des Tigris, deren Statthalter als Jahreseponyme dienten; einer von ihnen, Nergal-ereš, regierte sie unter Adad-nirari III."
    - "Wo seine Hauptstadt stand, ist umstritten. Die Gelehrten sind sich uneins zwischen Resafa, der ummauerten Wüstenstadt südlich des Euphrat, später nach dem Märtyrer Sergius Sergiopolis genannt, und einer Stätte an den Hängen des Dschebel Sindschar weit im Osten; keine Grabung hat es entschieden, und die Karte markiert beide, Resafa zuerst. Die Ruinen von Resafa mit der großen Basilika und dem omajjadischen Palast liegen im syrischen Gouvernement Raqqa."
  fr:
    - "Retseph est nommée dans le message assyrien à Ézéchias lors de la campagne de Sanchérib en 701 av. J.-C. Pour montrer qu’aucun dieu ne pouvait sauver Jérusalem, la lettre du roi demande : « Les dieux des nations que mes pères ont détruites les ont-ils délivrées, Gozan, Charan, Retseph, et les fils d’Éden qui sont à Telassar ? » Retseph est le Raçappa des textes assyriens, siège d’une province dans la steppe à l’ouest du Tigre dont les gouverneurs servaient d’éponymes de l’année ; l’un d’eux, Nergal-ereš, la gouverna sous Adad-nirari III."
    - "L’emplacement de sa capitale est disputé. Les spécialistes se partagent entre Résafa, la ville désertique fortifiée au sud de l’Euphrate appelée plus tard Sergiopolis d’après le martyr Serge, et un site sur les pentes du Djebel Sinjar, bien plus à l’est ; aucune fouille n’a tranché, et la carte marque les deux, Résafa en premier. Les ruines de Résafa, avec sa grande basilique et son palais omeyyade, se trouvent dans le gouvernorat de Raqqa, en Syrie."
  it:
    - "Resef è nominata nel messaggio assiro a Ezechia durante la campagna di Sennacherib del 701 a.C. Per mostrare che nessun dio poteva salvare Gerusalemme, la lettera del re chiede: «Gli dèi delle nazioni che i miei padri distrussero, gli dèi di Gozan, di Haran, di Retsef, dei figliuoli di Eden ch’erano a Telassar, valsero eglino a liberarle?» Resef è la Rasappa dei testi assiri, la sede di una provincia nella steppa a ovest del Tigri i cui governatori servivano come eponimi dell’anno; uno di essi, Nergal-eresh, la governò sotto Adad-nirari III."
    - "Dove sorgesse la sua capitale è controverso. Gli studiosi sono divisi tra Resafa, la città desertica fortificata a sud dell’Eufrate poi chiamata Sergiopoli dal martire Sergio, e un sito sulle pendici del Gebel Sinjar molto più a est; nessuno scavo ha risolto la questione, e la mappa segna entrambi, con Resafa per prima. Le rovine di Resafa, con la sua grande basilica e il palazzo omayyade, si trovano nel governatorato di Raqqa, in Siria."
  pl:
    - "Resef jest wymienione w asyryjskim poselstwie do Ezechiasza podczas wyprawy Sennacheryba w 701 roku p.n.e. Aby pokazać, że żaden bóg nie może uratować Jerozolimy, list króla pyta: „Izali wybawili bogowie narodów te, które wygubili ojcowie moi, Gozan, i Haran, i Resef, i syny Eden, którzy byli w Telassar?” Resef to Rasappa tekstów asyryjskich, siedziba prowincji na stepie na zachód od Tygrysu, której namiestnicy służyli jako eponimowie roku; jeden z nich, Nergal-ereš, rządził nią za Adad-nirari III."
    - "Gdzie stała jego stolica, jest sporne. Uczeni dzielą się między Resafę, obwarowane pustynne miasto na południe od Eufratu, później zwane Sergiopolis od męczennika Sergiusza, a stanowisko na stokach Dżabal Sindżar daleko na wschodzie; żadne wykopaliska nie rozstrzygnęły sprawy, a mapa zaznacza oba, Resafę jako pierwszą. Ruiny Resafy, z wielką bazyliką i pałacem Umajjadów, leżą w muhafazie ar-Rakka w Syrii."
  cs:
    - "Resef je jmenován v asyrském poselství Chizkijášovi během Senacheribova tažení roku 701 př. n. l. Aby ukázal, že žádný bůh nemůže Jeruzalém zachránit, ptá se králův dopis: „Zdaliž jsou je vysvobodili bohové těch národů, kteréž zahladili otcové moji, totiž Gozana, Charana, Resefa a syny Eden, kteříž byli v Telasar?“ Resef je Rasappa asyrských textů, sídlo provincie ve stepi západně od Tigridu, jejíž guvernéři sloužili jako eponymové roku; jeden z nich, Nergal-ereš, ji spravoval za Adadnerárího III."
    - "Kde stálo jeho hlavní město, je sporné. Učenci se dělí mezi Resafu, hradbami obehnané pouštní město jižně od Eufratu, později zvané Sergiupolis po mučedníku Sergiovi, a místo na svazích Džabal Sindžár daleko na východě; žádné vykopávky věc nerozhodly a mapa vyznačuje obě, s Resafou na prvním místě. Zříceniny Resafy s velkou bazilikou a umajjovským palácem leží v guvernorátu Rakka v Sýrii."
  nl:
    - "Rezef wordt genoemd in de Assyrische boodschap aan Chizkia tijdens Sanheribs veldtocht van 701 v.Chr. Om te laten zien dat geen god Jeruzalem kon redden, vraagt de brief van de koning: “Hebben de goden der volken, die mijn vaders verdorven hebben, dezelve gered, als Gozan, en Haran, en Rezef, en de kinderen van Eden, die in Telasser waren?” Rezef is de Rasappa van Assyrische teksten, de zetel van een provincie in de steppe ten westen van de Tigris wier gouverneurs als jaareponiem dienden; een van hen, Nergal-ereš, bestuurde haar onder Adad-nirari III."
    - "Waar de hoofdstad lag, is omstreden. Geleerden zijn verdeeld tussen Resafa, de ommuurde woestijnstad ten zuiden van de Eufraat die later Sergiopolis heette naar de martelaar Sergius, en een plaats op de hellingen van de Jebel Sinjar ver naar het oosten; geen opgraving heeft het beslecht, en de kaart wijst beide aan, met Resafa eerst. De ruïnes van Resafa, met zijn grote basiliek en Omajjadenpaleis, liggen in het gouvernement Raqqa in Syrië."
  sv:
    - "Resef nämns i det assyriska budskapet till Hiskia under Sanheribs fälttåg 701 f.Kr. För att visa att ingen gud kunde rädda Jerusalem frågar kungens brev: ”Hava väl de folk som mina fäder fördärvade, Gosan, Haran, Resef och Edens barn i Telassar, blivit räddade av sina gudar?” Resef är Rasappa i assyriska texter, sätet för en provins i stäppen väster om Tigris vars guvernörer tjänade som årsnamn; en av dem, Nergal-eresh, styrde den under Adad-nirari III."
    - "Var dess huvudstad låg är omstritt. Forskare har varit delade mellan Resafa, den muromgärdade ökenstaden söder om Eufrat som senare kallades Sergiopolis efter martyren Sergios, och en plats på Jebel Sinjars sluttningar långt österut; ingen utgrävning har avgjort saken, och kartan markerar båda, med Resafa först. Resafas ruiner, med dess stora basilika och umayyadiska palats, ligger i guvernementet Raqqa i Syrien."
