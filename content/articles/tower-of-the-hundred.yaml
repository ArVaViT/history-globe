  - "D. Ussishkin, 'The Borders and De Facto Size of Jerusalem in the Persian Period', in O. Lipschits and M. Oeming (eds.), Judah and the Judeans in the Persian Period (2006)"
  - "L.-H. Vincent and A.-M. Steve, Jérusalem de l'Ancien Testament (1954–1956)"
