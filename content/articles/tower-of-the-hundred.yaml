# Overview article (ADR 0007). Mainstream facts only; the tower of Meah on Nehemiah's north wall; the meaning of the name and the exact line of the wall are given as uncertain.
id: tower-of-the-hundred
place: a50eea4
title:
  en: "Tower of the Hundred"
  ru: "Башня Меа"
  uk: "Вежа Мея"
  es: "Torre de los Cien"
  pt: "Torre dos Cem"
  de: "Turm der Hundert"
  fr: "Tour des Cent"
  pl: "Wieża Setna"
  it: "Torre dei Cento"
  nl: "Toren van de Honderd"
  cs: "Věž Méa"
  sv: "Hundratornet"
  nb: "Mea-tårnet"
  tl: "Moog ng Meah"
body:
  en:
    - "The Tower of the Hundred, Hebrew Meah, stood on the north wall of Jerusalem as Nehemiah rebuilt it in the mid-fifth century BC. The account of the work begins there: Eliashib the high priest and the priests “builded the sheep gate; they sanctified it, and set up the doors of it; even unto the tower of Meah they sanctified it, unto the tower of Hananeel.” At the dedication of the wall the second choir passed over the fish gate, “and the tower of Hananeel, and the tower of Meah, even unto the sheep gate”. Why it was called “the hundred” is not known: a height of a hundred cubits, a hundred steps, or a garrison of a hundred men have all been guessed."
    - "The north side of the city, with no valley before it, was the most exposed, and the towers of Meah and Hananel guarded it near the Temple; a later fortress, the Hasmonaean Baris and then Herod's Antonia, stood in the same area at the north-west corner of the Temple enclosure. The tower itself has not been found, and the course of Nehemiah's wall on this side is debated. The map places it within about 500 m of the Tower of Hananel, in the area north of the Temple Mount in today's Muslim Quarter of the Old City."
  ru:
    - "Башня Меа, «сотня», стояла на северной стене Иерусалима, какой её восстановил Неемия в середине V века до н. э. С неё начинается рассказ о работах: Елияшив, великий священник, и священники «построили Овечьи ворота: они освятили их и вставили двери их, и от башни Меа освятили их до башни Хананела». При освящении стены второй хор шёл мимо ворот Рыбных, «и башни Хананела, и башни Меа, к Овечьим воротам». Почему башню назвали «сотней», неизвестно: предполагали высоту в сто локтей, сто ступеней или гарнизон в сто человек."
    - "Северная сторона города, не прикрытая долиной, была самой уязвимой, и башни Меа и Хананела охраняли её близ храма; позже в той же местности, у северо-западного угла храмовой площади, стояла крепость — хасмонейская Барис, а затем Иродова Антония. Сама башня не найдена, и ход стены Неемии на этой стороне спорен. На карте она стоит в пределах около 500 м от башни Хананела, в местности к северу от Храмовой горы, в нынешнем Мусульманском квартале Старого города."
  uk:
    - "Вежа Мея (Сотні), староєврейською Меа, стояла на північному мурі Єрусалима, яким його відбудував Неемія в середині V ст. до н. е. Розповідь про роботу починається з неї: первосвященик Еліашів і священики «збудували Овечі ворота; вони посьвятили їх і вставили двері їх, і посьвятили їх від башти Меа до башти Хананела». На освяченні муру другий хор пройшов над Рибними воротами, «башту Хананела і башту Меа, до Овечих воріт». Чому вона звалася «сотнею», невідомо: вгадували висоту в сто ліктів, сто сходинок чи гарнізон із ста чоловік."
    - "Північний бік міста, перед яким немає долини, був найвразливішим, і вежі Меа та Хананела охороняли його біля Храму; пізніша фортеця, хасмонейський Баріс, а потім Іродова Антонія, стояла в тій самій місцевості на північно-західному куті огорожі Храму. Саму вежу не знайдено, а перебіг Неемієвого муру з цього боку дискутується. Мапа позначає її в межах близько 500 м від Вежі Хананела, в районі на північ від Храмової гори в нинішньому Мусульманському кварталі Старого міста."
  es:
    - "La Torre de los Cien, en hebreo Meah, se alzaba en la muralla norte de Jerusalén tal como la reconstruyó Nehemías a mediados del siglo V a. C. El relato de la obra comienza allí: el sumo sacerdote Eliasib y los sacerdotes «edificaron la puerta de las Ovejas. Ellos aparejaron y levantaron sus puertas hasta la torre de Meah, aparejáronla hasta la torre de Hananeel». En la dedicación de la muralla el segundo coro pasó por encima de la puerta del Pescado, y de la torre de Hananeel y la torre de Meah «hasta la puerta de las Ovejas». No se sabe por qué se llamaba «de los cien»: se ha conjeturado una altura de cien codos, cien escalones o una guarnición de cien hombres."
    - "El lado norte de la ciudad, sin valle delante, era el más expuesto, y las torres de Meah y de Hananeel lo guardaban cerca del Templo; una fortaleza posterior, la Baris asmonea y luego la Antonia de Herodes, se alzaba en la misma zona, en el ángulo noroeste del recinto del Templo. La torre misma no se ha hallado, y el trazado de la muralla de Nehemías en este lado se debate. El mapa la sitúa a unos 500 m de la Torre de Hananeel, en la zona al norte del Monte del Templo, en el actual Barrio Musulmán de la Ciudad Vieja."
  pt:
    - "A Torre dos Cem, em hebraico Meá, ficava na muralha norte de Jerusalém como Neemias a reconstruiu em meados do século V a.C. O relato da obra começa ali: Eliasibe, o sumo sacerdote, e os sacerdotes “edificaram a Porta das Ovelhas. Eles a consagraram e assentaram as suas portas. Eles a consagraram até a torre de Meá, e até a torre de Hananel”. Na dedicação da muralha, o segundo coro passou pela Porta do Peixe, “pela Torre de Hananeel e pela Torre de Meá, até a Porta das Ovelhas”. Por que se chamava “dos cem” não se sabe: uma altura de cem côvados, cem degraus ou uma guarnição de cem homens já foram conjeturados."
    - "O lado norte da cidade, sem vale à frente, era o mais exposto, e as torres de Meá e Hananeel o guardavam perto do Templo; uma fortaleza posterior, a Baris hasmoneia e depois a Antônia de Herodes, ficava na mesma área, no canto noroeste do recinto do Templo. A torre em si não foi encontrada, e o traçado da muralha de Neemias deste lado é debatido. O mapa a situa a cerca de 500 m da Torre de Hananeel, na área ao norte do Monte do Templo, no atual Bairro Muçulmano da Cidade Velha."
  de:
    - "Der Turm der Hundert, hebräisch Mea, stand an der Nordmauer Jerusalems, wie Nehemia sie Mitte des fünften Jahrhunderts v. Chr. wiederaufbaute. Der Bericht über das Werk beginnt dort: Der Hohepriester Eljaschib und die Priester „bauten das Schaftor. Sie heiligten es und setzten seine Türen ein. Sie heiligten es aber bis an den Turm Mea, bis an den Turm Hananeel“. Bei der Einweihung der Mauer zog der zweite Chor über das Fischtor „und zum Turm Hananeel und zum Turm Mea bis an das Schaftor“. Warum er „die Hundert“ hieß, ist nicht bekannt: eine Höhe von hundert Ellen, hundert Stufen oder eine Besatzung von hundert Mann sind vermutet worden."
    - "Die Nordseite der Stadt, vor der kein Tal liegt, war die am stärksten gefährdete, und die Türme Mea und Hananel bewachten sie nahe dem Tempel; eine spätere Festung, die hasmonäische Baris und dann Herodes' Antonia, stand in derselben Gegend an der Nordwestecke des Tempelbezirks. Der Turm selbst ist nicht gefunden worden, und der Verlauf von Nehemias Mauer auf dieser Seite ist umstritten. Die Karte setzt ihn innerhalb von etwa 500 m um den Turm Hananel an, im Gebiet nördlich des Tempelbergs im heutigen Muslimischen Viertel der Altstadt."
  fr:
    - "La Tour des Cent, en hébreu Méa, se dressait sur le mur nord de Jérusalem tel que Néhémie le rebâtit au milieu du Ve siècle av. J.-C. Le récit des travaux commence là : le souverain sacrificateur Éliaschib et les sacrificateurs « bâtirent la porte des brebis. Ils la consacrèrent et en posèrent les battants ; ils la consacrèrent, depuis la tour de Méa jusqu’à la tour de Hananeel ». À la dédicace du mur, le second chœur passa au-dessus de la porte des poissons, puis « de la tour de Hananeel et de la tour de Méa, jusqu’à la porte des brebis ». On ignore pourquoi on l’appelait « des cent » : une hauteur de cent coudées, cent marches ou une garnison de cent hommes ont tous été supposés."
    - "Le côté nord de la ville, sans vallée devant lui, était le plus exposé, et les tours de Méa et de Hananeel le gardaient près du Temple ; une forteresse plus tardive, la Baris hasmonéenne puis l’Antonia d’Hérode, se dressait dans le même secteur, à l’angle nord-ouest de l’enceinte du Temple. La tour elle-même n’a pas été retrouvée, et le tracé du mur de Néhémie de ce côté est débattu. La carte la place à moins de 500 m de la Tour de Hananeel, dans la zone au nord du mont du Temple, dans l’actuel quartier musulman de la Vieille Ville."
  pl:
    - "Wieża Setna, hebrajska Mea, stała w północnym murze Jerozolimy, odbudowanym przez Nehemiasza w połowie V wieku p.n.e. Opis prac zaczyna się właśnie tam: arcykapłan Eliaszyb i kapłani „budowali bramę owczą. I zbudowali ją, i przyprawili wrota do niej; aż do wieży Mea zbudowali ją, i aż do wieży Chananeel”. Przy poświęceniu muru drugi chór przeszedł nad Bramą Rybną, „i wieży Chananeel, i wieży Mea, aż do bramy owczej”. Dlaczego nazwano ją „setną”, nie wiadomo: zgadywano wysokość stu łokci, sto stopni albo załogę stu ludzi."
    - "Północna strona miasta, bez doliny przed sobą, była najbardziej wystawiona, a wieże Mea i Chananeel strzegły jej blisko Świątyni; późniejsza twierdza, hasmonejski Baris, a potem Antonia Heroda, stała w tym samym rejonie w północno-zachodnim narożniku obrębu Świątyni. Samej wieży nie odnaleziono, a przebieg muru Nehemiasza po tej stronie jest przedmiotem sporu. Mapa umieszcza ją w odległości około 500 m od Wieży Chananeel, na obszarze na północ od Wzgórza Świątynnego w dzisiejszej Dzielnicy Muzułmańskiej Starego Miasta."
  it:
    - "La Torre dei Cento, in ebraico Mea, sorgeva sul muro settentrionale di Gerusalemme come lo ricostruì Neemia a metà del V secolo a.C. Il racconto dei lavori comincia da lì: il sommo sacerdote Eliasib e i sacerdoti «costruirono la porta delle Pecore; la consacrarono e vi misero le sue imposte; continuarono a costruire fino alla torre di Mea, che consacrarono, e fino alla Torre di Hananeel». Alla dedicazione del muro il secondo coro passò sopra la porta dei Pesci, «della torre di Hananeel, della torre di Mea, fino alla porta delle Pecore». Perché si chiamasse «dei cento» non si sa: sono state ipotizzate un’altezza di cento cubiti, cento gradini o una guarnigione di cento uomini."
    - "Il lato nord della città, senza una valle davanti, era il più esposto, e le torri di Mea e di Cananeèl lo difendevano presso il Tempio; una fortezza posteriore, la Baris asmonea e poi l’Antonia di Erode, sorgeva nella stessa zona all’angolo nord-occidentale del recinto del Tempio. La torre stessa non è stata trovata, e il tracciato del muro di Neemia su questo lato è discusso. La mappa la colloca entro circa 500 m dalla Torre di Cananeèl, nell’area a nord del Monte del Tempio, nell’odierno Quartiere Musulmano della Città Vecchia."
  nl:
    - "De Toren van de Honderd, in het Hebreeuws Mea, stond op de noordmuur van Jeruzalem zoals Nehemia die in het midden van de vijfde eeuw v.Chr. herbouwde. Het verslag van het werk begint daar: de hogepriester Eljasib en de priesters “bouwden de Schaapspoort; zij heiligden ze, en richtten haar deuren op; ja, zij heiligden ze tot aan den toren Mea, tot aan den toren Hananeel.” Bij de inwijding van de muur trok het tweede koor over de Vispoort, “en den toren Hananeel, en den toren Mea, tot aan de Schaapspoort”. Waarom hij “de honderd” heette, is niet bekend: een hoogte van honderd el, honderd treden of een bezetting van honderd man zijn allemaal geopperd."
    - "De noordzijde van de stad, zonder vallei ervoor, was het meest blootgesteld, en de torens van Mea en Chananeël bewaakten haar bij de tempel; een latere vesting, de Hasmoneese Baris en daarna Herodes’ Antonia, stond in hetzelfde gebied aan de noordwesthoek van het tempelterrein. De toren zelf is niet gevonden, en het verloop van Nehemia’s muur aan deze kant wordt betwist. De kaart plaatst hem binnen ongeveer 500 m van de Toren van Chananeël, in het gebied ten noorden van de Tempelberg in het huidige Moslimkwartier van de Oude Stad."
  cs:
    - "Věž Sta, hebrejsky Méa, stála na severní hradbě Jeruzaléma, jak ji Nehemjáš obnovil v polovině 5. stol. př. n. l. Zpráva o díle tam začíná: Eljašíb, nejvyšší kněz, a kněží „stavěli bránu bravnou, (tiť jsou ji vystavěli, a zavěsili vrata její, až k věži Mea vystavěli ji), až k věži Chananeel“. Při vysvěcení hradby druhý sbor šel dál „k bráně rybné, a věži Chananeel, a věži Mea, až k bráně bravné“. Proč se jmenovala „sto“, není známo: uvažovalo se o výšce sta loket, o stu schodech či o posádce sta mužů."
    - "Severní strana města, bez údolí před sebou, byla nejvíce vystavena a věže Méa a Chananel ji chránily poblíž chrámu; pozdější pevnost, hasmonejský Baris a pak Herodova Antonia, stála ve stejné oblasti v severozápadním rohu chrámového okrsku. Samotná věž nebyla nalezena a průběh Nehemjášovy hradby na této straně je sporný. Mapa ji klade do vzdálenosti asi 500 m od Chananelovy věže, do oblasti severně od Chrámové hory v dnešní muslimské čtvrti Starého Města."
  sv:
    - "Hundratornet, hebreiska Mea, stod på Jerusalems norra mur så som Nehemja byggde upp den i mitten av 400-talet f.Kr. Berättelsen om arbetet börjar där: översteprästen Eljashiv och prästerna ”byggde Fårporten, vilken de helgade, och i vilken de sedan satte in dörrarna. Vidare byggde de ända fram till Hammeatornet, som de helgade, och vidare fram till Hananeltornet.” Vid invigningen av muren gick den andra kören över Fiskporten och ”genom Hananeltornet, ända fram till Fårporten”. Varför det kallades ”hundra” är inte känt: en höjd av hundra alnar, hundra trappsteg eller en garnison på hundra man har alla gissats."
    - "Stadens norra sida, utan någon dal framför, var den mest utsatta, och tornen Mea och Hananel vaktade den nära templet; en senare fästning, den hasmoneiska Baris och sedan Herodes' Antonia, stod i samma område vid nordvästra hörnet av tempelområdet. Själva tornet har inte hittats, och förloppet av Nehemjas mur på denna sida är omdebatterat. Kartan placerar det inom omkring 500 m från Hananeltornet, i området norr om Tempelberget i dagens muslimska kvarter i Gamla staden."
  nb:
    - "Mea-tårnet, Hundretårnet, hebraisk Meah, sto i nordmuren i Jerusalem slik Nehemja gjenreiste den midt på 400-tallet f.Kr. Beretningen om arbeidet begynner der: ypperstepresten Eljasjib og prestene «gjorde sig rede og bygget Fåreporten; de helliget den og satte inn dørene; så bygget de videre til Mea-tårnet, som de helliget, og videre frem til Hananel-tårnet». Ved innvielsen av muren gikk det andre koret over Fiskeporten, «forbi Hananel-tårnet og Mea-tårnet, helt frem til Fåreporten». Hvorfor det ble kalt «hundre», er ikke kjent: en høyde på hundre alen, hundre trinn eller en garnison på hundre mann er alle blitt gjettet."
    - "Nordsiden av byen, uten noen dal foran, var den mest utsatte, og tårnene Mea og Hananel voktet den nær tempelet; en senere festning, den hasmoneiske Baris og så Herodes' Antonia, sto i samme område i nordvesthjørnet av tempelområdet. Selve tårnet er ikke funnet, og forløpet av Nehemjas mur på denne siden er omdiskutert. Kartet plasserer det innenfor omkring 500 m fra Hananel-tårnet, i området nord for Tempelhøyden i dagens muslimske kvarter i Gamlebyen."
  tl:
    - "Ang Moog ng Meah, Meah sa Hebreo (“ang isandaan”), ay nakatayo sa hilagang pader ng Jerusalem nang itayo itong muli ni Nehemias sa kalagitnaan ng ika-5 siglo BK. Doon nagsisimula ang salaysay ng gawain: si Eliasib na pangulong saserdote at ang mga saserdote “kanilang itinayo ang pintuang-bayan ng mga tupa; kanilang itinalaga, at inilagay ang mga pinto niyaon; hanggang sa moog ng Meah ay kanilang itinalaga, hanggang sa moog ng Hananeel.” Sa pagtatalaga ng pader, dumaan ang ikalawang koro sa Pintuang-bayan ng mga Isda, “sa moog ng Hananel, at sa moog ng Meah, hanggang sa pintuang-bayan ng mga tupa”. Hindi alam kung bakit tinawag itong “isandaan”: hinulaan ang taas na isandaang siko, isandaang baytang, o garison na isandaang tao."
    - "Ang hilagang panig ng lunsod, na walang libis sa harap, ang pinakanakalantad, at binantayan ito ng mga moog ng Meah at Hananeel malapit sa Templo; ang mas huling kuta, ang Baris ng mga Hasmoneo at pagkatapos ay ang Antonia ni Herodes, ay nakatayo sa lugar ding iyon sa hilagang-kanlurang sulok ng bakuran ng Templo. Hindi pa natatagpuan ang moog mismo, at pinagtatalunan ang takbo ng pader ni Nehemias sa panig na ito. Inilalagay ito ng mapa sa loob ng mga 500 m mula sa Moog ng Hananeel, sa lugar sa hilaga ng Bundok ng Templo sa Purok ng mga Muslim ng Lumang Lunsod ngayon."
scripture:
  - Neh.3.1
  - Neh.12.38
  - Neh.12.39
