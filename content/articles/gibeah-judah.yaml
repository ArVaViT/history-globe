body:
  en:
    - "This Gibeah, “hill”, was a town in the hill country of Judah, not the better-known Gibeah of Saul in Benjamin. Joshua lists it in a district south-east of Hebron with Maon, Carmel, Ziph, Juttah, Jezreel and Zanoah: “Cain, Gibeah, and Timnah; ten cities with their villages”. Chronicles names a Gibeah as the home of the mother of King Abijah of Judah: “His mother’s name also was Michaiah the daughter of Uriel of Gibeah.” Which Gibeah is meant there is not said; Kings calls her Maachah the daughter of Abishalom, and the two notices are reconciled in different ways."
    - "Nothing else is known, and the town has not been found. The name, common in a hilly land, gives no help. The map's main candidate is only the region south of Hebron, where the list places it; particular sites proposed include Khirbet el-Qaryatein and Bani Na'im on the edge of the desert, and Jab'a farther north, west of Bethlehem. None has produced the name."
    - "Eusebius, in the fourth century, knew villages called Gabaa and Gabatha in the east of the Daroma. W. Ewing, in the International Standard Bible Encyclopedia, thought this Gibeah might be one of them, as the list points south-east of Hebron, and took it for the Gibeah of Chronicles too. Eusebius also names a Gabatha twelve miles from Eleutheropolis, where the tomb of the prophet Habakkuk was shown. The Survey of Western Palestine linked that notice with Jab'a, a small stone village on a high, narrow ridge about twelve English miles from Beit Jibrin. Its surveyors thought Jab'a possibly Gibeah of Judah, with the ruin of Tibna, two miles to the north-west, as Timnah, the name listed beside it."
  ru:
    - "Эта Гива, «холм», — город в горах Иуды, не путать с более известной Гивой Сауловой в Вениамине. Книга Иисуса Навина называет её в округе к юго-востоку от Хеврона вместе с Маоном, Кармилом, Зифом, Ютой, Изреелем и Заноахом: «Каин, Гива и Фимна: десять городов с их селами». Паралипоменон называет Гиву родиной матери Авии, царя Иудейского: «имя матери его Михаия, дочь Уриилова, из Гивы». Какая Гива имеется в виду, не сказано; книга Царств называет её Маахой, дочерью Авессалома, и эти два известия согласуют по-разному."
    - "Больше ничего не известно, и город не найден. Имя, обычное для гористой страны, не помогает. Главный кандидат на карте — лишь область к югу от Хеврона, где её помещает список; из отдельных мест предлагали Хирбет-эль-Карьятейн и Бани-Наим на краю пустыни и Джабу севернее, к западу от Вифлеема. Ни одно не дало имени."
    - "Евсевий в IV веке знал селения Гаваа и Гавафа на востоке Даромы. У. Юинг в Международной стандартной библейской энциклопедии полагал, что эта Гива может быть одним из них, раз список указывает на край к юго-востоку от Хеврона, и считал её также Гивой Паралипоменона. Ещё Евсевий называет Гавафу в двенадцати милях от Елевферополя, где показывали гробницу пророка Аввакума. «Обзор Западной Палестины» связал это известие с Джабой, небольшим каменным селением на высоком узком хребте примерно в двенадцати английских милях от Бейт-Джибрина. Его исследователи сочли Джабу, возможно, Гивой Иудиной, а развалины Тибна в двух милях к северо-западу — Фимной, названной в списке рядом с ней."
  uk:
    - "Ця Гіва, «пагорб», була містом у гірській країні Юди, а не відомішою Гівою Сауловою у Веніямина. Книга Ісуса Навина перелічує її в окрузі на південний схід від Хеврона з Маоном, Кармелем, Зіфом, Юттою, Їзреелем і Заноахом: «Каин, Гива та Тимна — десять городів з їх селами». Хроніки називають Гіву батьківщиною матері царя Юди Авії: «мати його звалась Михаїя, Уриїлівна, з Гиви». Яку Гіву мають на увазі, не сказано; Книги Царів називають її Мааха, дочка Авесалома, і ці дві згадки узгоджують по-різному."
    - "Більше нічого невідомо, і місто не знайдено. Назва, поширена в гористому краї, не допомагає. Головний кандидат на карті — лише область на південь від Хеврона, куди її поміщає перелік; серед запропонованих окремих місць — Хірбет-ель-Карьятейн і Бані-Наїм на краю пустелі та Джабаа далі на північ, на захід від Вифлеєма. Жодне не дало назви."
    - "Євсевій у IV столітті знав села Габаа і Габата на сході Дароми. В. Юїнг в International Standard Bible Encyclopedia вважав, що ця Гіва може бути одним із них, бо перелік вказує на край на південний схід від Хеврона, і вважав її також Гівою Хронік. Ще Євсевій називає Габату за дванадцять миль від Елевтерополя, де показували гробницю пророка Авакума. «Survey of Western Palestine» пов’язав цю згадку з Джабаа, невеликим кам’яним селом на високому вузькому хребті приблизно за дванадцять англійських миль від Бейт-Джибріна. Його дослідники вважали Джабаа, можливо, Гівою Юдиною, а руїни Тібна за дві милі на північний захід — Тимною, названою в переліку поруч із нею."
  es:
    - "Esta Gabaa, «colina», era una población de la región montañosa de Judá, no la más conocida Gabaa de Saúl, en Benjamín. Josué la enumera en un distrito al sudeste de Hebrón con Maón, Carmel, Zif, Jutá, Jezreel y Zanoa: «Caín, Gibea, y Timna; diez ciudades con sus aldeas». Crónicas nombra una Gabaa como patria de la madre del rey Abías de Judá: «El nombre de su madre fué Michâía hija de Uriel de Gabaa». No se dice de qué Gabaa se trata; Reyes la llama Maaca hija de Abisalom, y las dos noticias se concilian de diversas maneras."
    - "No se sabe nada más, y la población no ha sido hallada. El nombre, común en un país de colinas, no ayuda. El principal candidato del mapa es solo la región al sur de Hebrón, donde la lista la sitúa; entre los sitios concretos propuestos están Khirbet el-Qaryatein y Bani Na'im, en el borde del desierto, y Jab'a, más al norte, al oeste de Belén. Ninguno ha dado el nombre."
    - "Eusebio, en el siglo IV, conocía aldeas llamadas Gabaa y Gabatha en el este del Daroma. W. Ewing, en la International Standard Bible Encyclopedia, pensó que esta Gabaa podía ser una de ellas, pues la lista apunta al sudeste de Hebrón, y la tuvo también por la Gabaa de Crónicas. Eusebio nombra además una Gabatha a doce millas de Eleuterópolis, donde se mostraba la tumba del profeta Habacuc. El Survey of Western Palestine relacionó esa noticia con Jab'a, una pequeña aldea de piedra sobre una loma alta y estrecha, a unas doce millas inglesas de Beit Jibrin. Sus topógrafos consideraron Jab'a posiblemente la Gabaa de Judá, con la ruina de Tibna, dos millas al noroeste, como Timna, el nombre que la lista pone a su lado."
  pt:
    - "Esta Gibeá, “colina”, era uma cidade na região montanhosa de Judá, e não a mais conhecida Gibeá de Saul, em Benjamim. Josué a lista num distrito a sudeste de Hebrom, com Maom, Carmelo, Zife, Jutá, Jezreel e Zanoa: “Caim, Gibeá e Timna; dez cidades com as suas aldeias”. Crônicas nomeia uma Gibeá como terra da mãe do rei Abias de Judá: “O nome de sua mãe era Micaías, filha de Uriel, de Gibeá.” Qual Gibeá se quer dizer ali não é dito; Reis a chama Maaca, filha de Absalão, e as duas notícias são conciliadas de maneiras diferentes."
    - "Nada mais se sabe, e a cidade não foi encontrada. O nome, comum numa terra de colinas, não ajuda. O principal candidato do mapa é apenas a região ao sul de Hebrom, onde a lista a situa; entre os sítios particulares propostos estão Khirbet el-Qaryatein e Bani Na’im, na orla do deserto, e Jab’a, mais ao norte, a oeste de Belém. Nenhum produziu o nome."
    - "Eusébio, no século IV, conhecia aldeias chamadas Gabaa e Gabatha no leste do Daroma. W. Ewing, na International Standard Bible Encyclopedia, pensou que esta Gibeá podia ser uma delas, pois a lista aponta para o sudeste de Hebrom, e a tomou também pela Gibeá de Crônicas. Eusébio nomeia ainda uma Gabatha a doze milhas de Eleuterópolis, onde se mostrava o túmulo do profeta Habacuque. O Survey of Western Palestine ligou essa notícia a Jab’a, uma pequena aldeia de pedra numa crista alta e estreita, a cerca de doze milhas inglesas de Beit Jibrin. Seus pesquisadores julgaram Jab’a possivelmente a Gibeá de Judá, com a ruína de Tibna, duas milhas a noroeste, como Timna, o nome listado ao lado dela."
  de:
    - "Dieses Gibea, „Hügel“, war eine Stadt im Bergland Judas, nicht das bekanntere Gibea Sauls in Benjamin. Josua führt es in einem Bezirk südöstlich von Hebron mit Maon, Karmel, Sif, Juta, Jesreel und Sanoach auf: „Hakain, Gibea, Thimna. Das sind zehn Städte und ihre Dörfer.“ Die Chronik nennt ein Gibea als Heimat der Mutter König Abijas von Juda: „Seine Mutter hieß Michaja, eine Tochter Uriels von Gibea.“ Welches Gibea gemeint ist, wird nicht gesagt; die Königsbücher nennen sie Maacha, die Tochter Abisaloms, und die beiden Angaben werden auf verschiedene Weise in Einklang gebracht."
    - "Sonst ist nichts bekannt, und die Stadt ist nicht gefunden. Der Name, in einem hügeligen Land häufig, hilft nicht weiter. Der Hauptkandidat auf der Karte ist nur das Gebiet südlich von Hebron, wo die Liste sie ansetzt; als einzelne Stätten werden Chirbet el-Qaryatein und Bani Na'im am Wüstenrand und Jab'a weiter nördlich, westlich von Bethlehem, vorgeschlagen. Keine hat den Namen geliefert."
    - "Eusebius kannte im 4. Jahrhundert Dörfer namens Gabaa und Gabatha im Osten des Daroma. W. Ewing hielt es in der International Standard Bible Encyclopedia für möglich, dass dieses Gibea eines von ihnen sei, da die Liste auf das Gebiet südöstlich von Hebron weist, und sah darin auch das Gibea der Chronik. Eusebius nennt außerdem ein Gabatha zwölf Meilen von Eleutheropolis, wo das Grab des Propheten Habakuk gezeigt wurde. Der Survey of Western Palestine verband diese Angabe mit Jab'a, einem kleinen Steindorf auf einem hohen, schmalen Rücken etwa zwölf englische Meilen von Beit Jibrin. Seine Vermesser hielten Jab'a möglicherweise für Gibea in Juda, mit der Ruine Tibna zwei Meilen nordwestlich als Thimna, dem Namen, der in der Liste daneben steht."
  fr:
    - "Cette Guibea, « colline », était une ville de la montagne de Juda, et non la Guibea de Saül, plus connue, en Benjamin. Josué l’inscrit dans un district au sud-est d’Hébron avec Maon, Carmel, Ziph, Jutta, Jizreel et Zanoach : « Kaïn, Guibea, et Thimna ; dix villes, et leurs villages ». Les Chroniques nomment une Guibea comme patrie de la mère du roi Abija de Juda : « Sa mère s’appelait Micaja, fille d’Uriel, de Guibea. » On ne dit pas de quelle Guibea il s’agit ; les Rois l’appellent Maaca, fille d’Abisalom, et les deux notices se concilient de diverses manières."
    - "On ne sait rien d’autre, et la ville n’a pas été retrouvée. Le nom, courant dans un pays de collines, n’aide guère. Le principal candidat de la carte n’est que la région au sud d’Hébron, où la liste la place ; parmi les sites proposés figurent Khirbet el-Qaryatein et Bani Na’im, en bordure du désert, et Jab’a, plus au nord, à l’ouest de Bethléem. Aucun n’a livré le nom."
    - "Eusèbe, au IVe siècle, connaissait des villages nommés Gabaa et Gabatha à l’est du Daroma. W. Ewing, dans l’International Standard Bible Encyclopedia, pensait que cette Guibea pouvait être l’un d’eux, puisque la liste désigne le sud-est d’Hébron, et y voyait aussi la Guibea des Chroniques. Eusèbe nomme encore une Gabatha à douze milles d’Éleuthéropolis, où l’on montrait le tombeau du prophète Habacuc. Le Survey of Western Palestine rapprocha cette notice de Jab’a, petit village de pierre sur une crête haute et étroite, à environ douze milles anglais de Beit Jibrin. Ses topographes tinrent Jab’a pour peut-être la Guibea de Juda, avec la ruine de Tibna, à deux milles au nord-ouest, pour Thimna, le nom inscrit à côté."
  pl:
    - "Ta Gibea, „wzgórze”, była miastem w górach Judy, a nie lepiej znaną Gibeą Saulową w Beniaminie. Jozue wymienia ją w okręgu na południowy wschód od Hebronu z Maonem, Karmelem, Zifem, Juttą, Jizreelem i Zanoach: „Kain, Gabaa, i Tamna, miast dziesięć, i wsi ich”. Księgi Kronik wymieniają Gibeę jako miejsce pochodzenia matki króla Judy Abiasza: „imię matki jego było Michaja, córka Uryjelowa z Gabaa”. Która Gibea jest tam rozumiana, nie powiedziano; Księgi Królewskie nazywają ją Maaką, córką Abiszaloma, a oba zapisy godzi się na różne sposoby."
    - "Nic więcej nie wiadomo, a miasta nie odnaleziono. Nazwa, pospolita w kraju górzystym, niczego nie podpowiada. Głównym kandydatem na mapie jest tylko region na południe od Hebronu, gdzie umieszcza ją wykaz; wśród proponowanych miejsc są Chirbet el-Qaryatein i Bani Naim na skraju pustyni oraz Jab'a dalej na północ, na zachód od Betlejem. Żadne nie dostarczyło tej nazwy."
    - "Euzebiusz w IV wieku znał wsie zwane Gabaa i Gabatha we wschodniej części Daromy. W. Ewing w International Standard Bible Encyclopedia sądził, że ta Gibea może być jedną z nich, skoro wykaz wskazuje na okolice na południowy wschód od Hebronu, i uważał ją także za Gibeę z Ksiąg Kronik. Euzebiusz wymienia ponadto Gabathę dwanaście mil od Eleuteropolis, gdzie pokazywano grób proroka Habakuka. Survey of Western Palestine powiązał tę wzmiankę z Jab'a, małą kamienną wsią na wysokim, wąskim grzbiecie około dwunastu mil angielskich od Beit Jibrin. Jego mierniczowie uznali Jab'a za być może Gibeę judzką, a ruiny Tibna, dwie mile na północny zachód, za Timnę, nazwę wymienioną obok niej."
  it:
    - "Questa Gabaa, «colle», era una città sui monti di Giuda, non la più nota Gabaa di Saul in Beniamino. Giosuè la elenca in un distretto a sud-est di Ebron con Maon, Carmelo, Zif, Iutta, Izreel e Zanoa: «Kain, Ghibea e Timna: dieci città e i loro villaggi». Le Cronache nominano una Gabaa come patria della madre del re Abia di Giuda: «Sua madre si chiamava Micaia, figliuola d’Uriel, da Ghibea». Quale Gabaa sia intesa non è detto; i Re la chiamano Maaca, figlia di Abisalom, e le due notizie vengono conciliate in modi diversi."
    - "Non si sa altro, e la città non è stata trovata. Il nome, comune in una terra collinosa, non è d’aiuto. Il candidato principale sulla mappa è soltanto la regione a sud di Ebron, dove la collocano gli elenchi; i siti particolari proposti comprendono Khirbet el-Qaryatein e Bani Na’im al margine del deserto, e Jab’a più a nord, a ovest di Betlemme. Nessuno ha restituito il nome."
    - "Eusebio, nel IV secolo, conosceva villaggi chiamati Gabaa e Gabatha nell’est del Daroma. W. Ewing, nella International Standard Bible Encyclopedia, pensò che questa Gabaa potesse essere uno di essi, poiché l’elenco indica il sud-est di Ebron, e la ritenne anche la Gabaa delle Cronache. Eusebio nomina inoltre una Gabatha a dodici miglia da Eleuteropoli, dove si mostrava la tomba del profeta Abacuc. Il Survey of Western Palestine collegò quella notizia a Jab’a, piccolo villaggio di pietra su una dorsale alta e stretta, a circa dodici miglia inglesi da Beit Jibrin. I suoi rilevatori ritennero Jab’a forse la Gabaa di Giuda, con la rovina di Tibna, due miglia a nord-ovest, come Timna, il nome elencato accanto."
  nl:
    - "Dit Gibea, “heuvel”, was een stad in het bergland van Juda, niet het bekendere Gibea van Saul in Benjamin. Jozua noemt het in een district ten zuidoosten van Hebron met Maön, Karmel, Zif, Juta, Jizreël en Zanoach: “Kain, Gibea, en Timna; tien steden en haar dorpen”. Kronieken noemt een Gibea als woonplaats van de moeder van koning Abia van Juda: “de naam zijner moeder was Michaja, de dochter van Uriel, van Gibea”. Welk Gibea bedoeld is, wordt niet gezegd; Koningen noemt haar Maächa, de dochter van Abisalom, en de twee berichten worden op verschillende wijzen met elkaar verzoend."
    - "Meer is er niet bekend, en de stad is niet gevonden. De naam, die in een heuvelachtig land veel voorkomt, helpt niet. De belangrijkste kandidaat op de kaart is alleen de streek ten zuiden van Hebron, waar de lijst haar plaatst; voorgestelde plaatsen zijn onder meer Khirbet el-Qaryatein en Bani Na’im aan de woestijnrand, en Jab’a verder naar het noorden, ten westen van Bethlehem. Geen daarvan heeft de naam opgeleverd."
    - "Eusebius kende in de vierde eeuw dorpen met de namen Gabaa en Gabatha in het oosten van de Daroma. W. Ewing meende in de International Standard Bible Encyclopedia dat dit Gibea een van die dorpen kon zijn, omdat de lijst naar het gebied ten zuidoosten van Hebron wijst, en hield het ook voor het Gibea van Kronieken. Eusebius noemt verder een Gabatha twaalf mijl van Eleutheropolis, waar het graf van de profeet Habakuk werd getoond. De Survey of Western Palestine bracht dat bericht in verband met Jab’a, een klein stenen dorp op een hoge, smalle rug, ongeveer twaalf Engelse mijl van Beit Jibrin. De landmeters hielden Jab’a mogelijk voor Gibea in Juda, met de ruïne Tibna, twee mijl naar het noordwesten, als Timna, de naam die in de lijst ernaast staat."
  cs:
    - "Tato Gibea, „pahorek“, bylo město v judské pahorkatině, nikoli známější Gibea Saulova v Benjamínovi. Jozue ji uvádí v okrese jihovýchodně od Hebronu s Maonem, Karmelem, Zífem, Jutou, Jizreelem a Zanoachem: „Kain, Gabaa a Tamna, měst deset i vsi jejich“. Letopisy jmenují Gibeu jako domov matky krále Abiji Judského: „a jméno matky jeho Michaia, dcera Urielova z Gabaa“. Která Gibea se tím míní, není řečeno; Královská ji nazývají Maakou, dcerou Abšalomovou, a obě zprávy se uvádějí do souladu různými způsoby."
    - "Nic jiného není známo a město nebylo nalezeno. Jméno, v pahorkaté zemi časté, nepomáhá. Hlavním kandidátem na mapě je jen oblast jižně od Hebronu, kam ji klade seznam; z navrhovaných míst jsou Chirbet el-Qarjatein a Báni Na'im na okraji pouště a Jab'a dále na severu, západně od Betléma. Žádné z nich jméno nepřineslo."
    - "Eusebios znal ve 4. století vesnice jménem Gabaa a Gabatha na východě Daromy. W. Ewing v International Standard Bible Encyclopedia soudil, že tato Gibea může být jednou z nich, protože seznam ukazuje na kraj jihovýchodně od Hebronu, a pokládal ji také za Gibeu z Letopisů. Eusebios dále jmenuje Gabathu dvanáct mil od Eleutheropole, kde se ukazoval hrob proroka Abakuka. Survey of Western Palestine spojil tuto zprávu s Jab'a, malou kamennou vesnicí na vysokém úzkém hřebeni asi dvanáct anglických mil od Bajt Džibrínu. Jeho zeměměřiči pokládali Jab'a snad za judskou Gibeu a zříceninu Tibna, dvě míle severozápadně, za Tamnu, jméno uvedené v seznamu vedle ní."
  sv:
    - "Denna Giva, ”kulle”, var en stad i Judas bergsbygd, inte den mer kända Sauls Giva i Benjamin. Josua räknar upp den i ett distrikt sydost om Hebron med Maon, Karmel, Sif, Jutta, Jisreel och Sanoach: ”Kain, Gibea och Timna – tio städer med sina byar”. Krönikeboken nämner ett Giva som hemort för modern till Juda kung Avia: ”Hans moder hette Mikaja, Uriels dotter, från Gibea.” Vilken Giva som avses där sägs inte; Kungaboken kallar henne Maaka, Abisaloms dotter, och de två notiserna förenas på olika sätt."
    - "Inget mer är känt, och staden har inte hittats. Namnet, vanligt i ett kuperat land, hjälper inte. Kartans huvudkandidat är bara trakten söder om Hebron, där förteckningen placerar den; särskilda platser som föreslagits är Khirbet el-Qaryatein och Bani Na'im i ökenkanten, och Jab'a längre norrut, väster om Betlehem. Ingen har gett namnet."
    - "Eusebios kände på 300-talet byar som hette Gabaa och Gabatha i östra delen av Daroma. W. Ewing menade i International Standard Bible Encyclopedia att denna Giva kunde vara en av dem, eftersom förteckningen pekar på trakten sydost om Hebron, och höll den också för Krönikebokens Giva. Eusebios nämner dessutom ett Gabatha tolv romerska mil från Eleutheropolis, där profeten Habackuks grav visades. Survey of Western Palestine förband den uppgiften med Jab'a, en liten stenby på en hög, smal ås omkring tolv engelska mil från Beit Jibrin. Dess lantmätare höll Jab'a för möjligen Giva i Juda, med ruinen Tibna, två engelska mil åt nordväst, som Timna, namnet som står bredvid i förteckningen."
  nb:
    - "Denne Gibea, «høyde», var en by i Judas fjellland, ikke den bedre kjente Gibea hos Saul i Benjamin. Josva oppfører den i et distrikt sørøst for Hebron sammen med Maon, Karmel, Sif, Jutta, Jisreel og Sanoah: «Hakka'in, Gibea og Timna - ti byer med tilhørende landsbyer». Krønikebøkene nevner en Gibea som hjemstedet til moren til kong Abia av Juda: «Hans mor hette Mikaja; hun var datter av Uriel og var fra Gibea.» Hvilken Gibea som menes der, sies ikke; Kongebøkene kaller henne Maaka, datter av Abisalom, og de to notisene forenes på ulike måter."
    - "Ellers er ingenting kjent, og byen er ikke funnet. Navnet, vanlig i et kupert land, hjelper ikke. Kartets viktigste kandidat er bare området sør for Hebron, der listen plasserer den; de foreslåtte stedene omfatter Khirbet el-Qaryatein og Bani Na'im i ørkenkanten, og Jab'a lenger nord, vest for Betlehem. Ingen av dem har gitt navnet."
    - "Eusebios kjente på 300-tallet landsbyer som het Gabaa og Gabatha i den østlige delen av Daroma. W. Ewing mente i International Standard Bible Encyclopedia at denne Gibea kunne være en av dem, siden listen peker mot området sørøst for Hebron, og regnet den også for Krønikebøkenes Gibea. Eusebios nevner dessuten et Gabatha tolv romerske mil fra Eleutheropolis, der profeten Habakkuks grav ble vist. Survey of Western Palestine knyttet den opplysningen til Jab'a, en liten steinlandsby på en høy, smal rygg omkring tolv engelske mil fra Beit Jibrin. Landmålerne regnet Jab'a som mulig Gibea i Juda, med ruinen Tibna, to engelske mil mot nordvest, som Timna, navnet som står ved siden av i listen."
  tl:
    - "Ang Gibea na ito, “burol”, ay isang bayan sa maburol na lupain ng Juda, hindi ang mas kilalang Gibea ni Saul sa Benjamin. Inililista ito ni Josue sa isang distrito sa timog-silangan ng Hebron kasama ng Maon, Carmel, Ziph, Juta, Jezreel at Zanoa: “Cain, Gibea, at Timna: sangpung bayan pati ng mga nayon ng mga yaon”. Pinangalanan ng Mga Cronica ang isang Gibea bilang tahanan ng ina ni Haring Abias ng Juda: “ang pangalan ng kaniyang ina ay Michaia na anak ni Uriel na taga Gabaa.” Hindi sinasabi kung aling Gibea ang tinutukoy doon; tinatawag siya ng Mga Hari na Maacha na anak ni Abisalom, at pinagkakasundo sa iba't ibang paraan ang dalawang tala."
    - "Wala nang iba pang nalalaman, at hindi pa natatagpuan ang bayan. Walang naitutulong ang pangalan, na karaniwan sa maburol na lupain. Ang pangunahing kandidato sa mapa ay ang rehiyon lamang sa timog ng Hebron, kung saan inilalagay ito ng listahan; kabilang sa mga partikular na lugar na iminungkahi ang Khirbet el-Qaryatein at Bani Na'im sa gilid ng disyerto, at ang Jab'a na mas hilaga, sa kanluran ng Bethlehem. Wala sa mga ito ang nagbunga ng pangalan."
    - "Kilala ni Eusebio noong ika-4 na siglo ang mga nayong tinatawag na Gabaa at Gabatha sa silangan ng Daroma. Inakala ni W. Ewing sa International Standard Bible Encyclopedia na ang Gibeang ito ay maaaring isa sa mga iyon, yamang itinuturo ng listahan ang timog-silangan ng Hebron, at itinuring din niya itong Gibea ng Mga Cronica. Binabanggit din ni Eusebio ang isang Gabatha na labindalawang milya mula sa Eleutheropolis, kung saan ipinakikita ang libingan ng propetang si Habacuc. Iniugnay ng Survey of Western Palestine ang talang iyon sa Jab'a, isang maliit na nayong bato sa isang mataas at makitid na tagaytay, mga labindalawang milyang Ingles mula sa Beit Jibrin. Inakala ng mga tagasukat nito na ang Jab'a ay maaaring ang Gibea ng Juda, at ang guho ng Tibna, dalawang milya sa hilagang-kanluran, ay ang Timna, ang pangalang katabi nito sa listahan."
  da:
    - "Denne Gibea, »høj«, var en by i Judas bjergland, ikke den bedre kendte Sauls Gibea i Benjamin. Josva opregner den i et distrikt sydøst for Hebron sammen med Maon, Karmel, Zif, Jutta, Jizre'el og Zanoa: »Kain, Gibea og Timna; ti Stæder og deres Landsbyer«. Krønikebøgerne nævner en Gibea som hjemsted for moderen til kong Abija af Juda: »hans Moders Navn var Mikaja, Uriels Datter fra Gibea«. Hvilken Gibea der menes, siges ikke; Kongebøgerne kalder hende Maaka, Abisaloms datter, og de to notitser forliges på forskellig vis."
    - "Intet andet er kendt, og byen er ikke fundet. Navnet, der er almindeligt i et bjergrigt land, giver ingen hjælp. Kortets hovedkandidat er blot egnen syd for Hebron, hvor listen placerer den; konkrete steder, der er foreslået, omfatter Khirbet el-Qaryatein og Bani Na'im i udkanten af ørkenen og Jab'a længere mod nord, vest for Betlehem. Ingen af dem har givet navnet."
    - "Eusebios kendte i 300-tallet landsbyer ved navn Gabaa og Gabatha i den østlige del af Daroma. W. Ewing mente i International Standard Bible Encyclopedia, at denne Gibea kunne være en af dem, da listen peger mod egnen sydøst for Hebron, og regnede den også for Krønikebøgernes Gibea. Eusebios nævner desuden et Gabatha tolv romerske mil fra Eleutheropolis, hvor profeten Habakkuks grav blev vist. Survey of Western Palestine forbandt den oplysning med Jab'a, en lille stenlandsby på en høj, smal ryg omkring tolv engelske mil fra Beit Jibrin. Landmålerne anså Jab'a for muligvis Gibea i Juda, med ruinen Tibna, to engelske mil mod nordvest, som Timna, navnet der står ved siden af i listen."
  sr:
    - "Ова Гаваја, „брдо“, била је град у јудејској гори, а не познатија Гаваја Саулова у Венијаминовом племену. Исус је набраја у крају југоисточно од Хеврона уз Маон, Кармил, Зиф, Јуту, Језраел и Заноју: „Кајин, Гаваја и Тамна; десет градова са селима својим“. Летописи именују једну Гавају као завичај мајке јудејског цара Авије: „Матери му беше име Махаја, кћи Урилова из Гаваје.“ Која је Гаваја ту мишљена, не каже се; Цареви је називају Маха, кћи Авесаломова, а две белешке се на различите начине усаглашавају."
    - "Ништа друго се не зна и град није пронађен. Име, уобичајено у брдовитој земљи, не помаже. Главни кандидат на карти само је област јужно од Хеврона, где га списак смешта; међу предложеним налазиштима су Хирбет ел-Карјатејн и Бани Наим на рубу пустиње и Џаба даље на северу, западно од Витлејема. Ни једно није дало име."
    - "Јевсевије је у 4. веку знао села по имену Гаваа и Гавата на истоку Дароме. В. Јуинг је у International Standard Bible Encyclopedia сматрао да ова Гаваја може бити једно од њих, јер списак упућује на крај југоисточно од Хеврона, и држао ју је и за Гавају из Летописа. Јевсевије још помиње Гавату дванаест миља од Елевтерополиса, где се показивао гроб пророка Авакума. Survey of Western Palestine повезао је ту белешку са Џабом, малим каменим селом на високом, уском гребену око дванаест енглеских миља од Бејт Џибрина. Његови премеравачи сматрали су Џабу можда Гавајом Јудином, а рушевину Тибна, две миље северозападно, Тамном, именом наведеним поред ње у списку."
  hu:
    - "Ez a Gibea, „domb”, Júda hegyvidékének városa volt, nem a jobban ismert Saul Gibeája Benjámin földjén. Józsué a Hebrontól délkeletre eső kerületben sorolja fel Maón, Kármel, Zif, Jutta, Jezréel és Zánóah mellett: „Kajin, Gibea és Timna. Tíz város és ezeknek falui.” A Krónikák egy Gibeát Abija júdai király anyja hazájaként nevez meg: „Az ő anyjának neve Mikája vala, a ki a Gibeából való Uriel leánya.” Hogy melyik Gibeáról van szó, nem mondja; a Királyok Maakának nevezi, Abisálom leányának, és a két feljegyzést különféleképpen egyeztetik."
    - "Másról nem tudunk, és a várost nem találták meg. A név, amely hegyes országban gyakori, nem segít. A térkép fő jelöltje csupán a Hebrontól délre fekvő vidék, ahová a lista helyezi; a javasolt konkrét helyek között szerepel a sivatag szélén Hirbet el-Karjatein és Bani Naim, északabbra pedig Dzsab'a, Betlehemtől nyugatra. Egyik sem szolgáltatta a nevet."
    - "Eusebios a 4. században Gabaa és Gabatha nevű falvakat ismert a Daroma keleti felén. W. Ewing az International Standard Bible Encyclopediában úgy vélte, hogy ez a Gibea lehet az egyikük, mivel a lista a Hebrontól délkeletre eső vidékre mutat, és a Krónikák Gibeájának is tartotta. Eusebios ezenkívül említ egy Gabathát tizenkét mérföldre Eleutheropolisztól, ahol Habakuk próféta sírját mutatták. A Survey of Western Palestine ezt az adatot Dzsab'ával kapcsolta össze, amely kis kőfalu egy magas, keskeny gerincen, mintegy tizenkét angol mérföldre Beit Dzsibrintől. Felmérői Dzsab'át talán Júda Gibeájának tartották, a két mérfölddel északnyugatra levő Tibna romját pedig Timnának, a listán mellette álló névnek."
  fi:
    - "Tämä Gibea, ”kukkula”, oli kaupunki Juudan vuoristossa, ei tunnetumpi Saulin Gibea Benjaminissa. Joosua luettelee sen Hebronin kaakkoispuolisessa piirissä Maonin, Karmelin, Sifin, Juttan, Jisreelin ja Sanoahin kanssa: ”Kain, Gibea, Timna – kymmenen kaupunkia kylineen”. Aikakirjat mainitsevat Gibean Juudan kuninkaan Abian äidin kotipaikkana: ”Hänen äitinsä nimi oli Mikaja, Uurielin tytär, Gibeasta.” Kumpi Gibea tarkoitetaan, ei sanota; Kuninkaiden kirjat kutsuvat häntä Maakaksi, Absalomin tyttäreksi, ja kaksi mainintaa sovitetaan yhteen eri tavoin."
    - "Muuta ei tiedetä, eikä kaupunkia ole löydetty. Nimi, joka on yleinen kukkulaisessa maassa, ei auta. Kartan pääehdokas on vain Hebronin eteläpuolinen alue, johon luettelo sen sijoittaa; erityisiä ehdotettuja paikkoja ovat Khirbet el-Qaryatein ja Bani Na'im aavikon reunalla sekä Jab'a kauempana pohjoisessa, Betlehemistä länteen. Mikään ei ole tuottanut nimeä."
    - "Eusebios tunsi 300-luvulla Gabaa- ja Gabatha-nimiset kylät Daroman itäpuolella. W. Ewing arveli International Standard Bible Encyclopediassa, että tämä Gibea voisi olla yksi niistä, koska luettelo viittaa Hebronin kaakkoispuolelle, ja piti sitä myös Aikakirjojen Gibeana. Eusebios mainitsee lisäksi Gabathan kahdentoista mailin päässä Eleutheropoliksesta, missä näytettiin profeetta Habakukin hautaa. Survey of Western Palestine yhdisti tämän tiedon Jab'aan, pieneen kivikylään korkealla, kapealla harjanteella noin kahdentoista englantilaisen mailin päässä Beit Jibrinistä. Sen kartoittajat pitivät Jab'aa mahdollisesti Juudan Gibeana ja Tibnan raunioita kaksi mailia luoteeseen Timnana, nimenä joka on luettelossa sen vieressä."
  vi:
    - "Ghi-bê-a này, “đồi”, là một thành trong miền núi Giu-đa, không phải Ghi-bê-a của Sau-lơ nổi tiếng hơn ở Bên-gia-min. Giô-suê liệt kê thành trong một vùng phía đông nam Hếp-rôn cùng Ma-ôn, Cạt-mên, Xíp, Giu-ta, Gít-rê-ên và Xa-nô-a: “Ca-in, Ghi-bê-a, và Thim-na: hết thảy mười thành với các làng của nó”. Sách Sử Ký nêu một Ghi-bê-a là quê của mẹ vua A-bi-gia của Giu-đa: “tên mẹ người là Mi-ca-gia, con gái của U-ri-ên ở Ghi-bê-a”. Ở đó không nói Ghi-bê-a nào; sách Các Vua gọi bà là Ma-a-ca con gái của A-bi-sa-lôm, và hai ghi chú được dung hòa theo những cách khác nhau."
    - "Không biết gì khác, và thành chưa được tìm thấy. Tên, phổ biến trong một xứ đồi núi, không giúp được gì. Ứng viên chính trên bản đồ chỉ là vùng phía nam Hếp-rôn, nơi bảng kê đặt thành; các địa điểm cụ thể được đề nghị gồm Khirbet el-Qaryatein và Bani Na'im ở rìa sa mạc, và Jab'a xa hơn về phía bắc, phía tây Bết-lê-hem. Không nơi nào cho thấy tên này."
    - "Eusebius, vào thế kỷ 4, biết các làng tên Gabaa và Gabatha ở phía đông Daroma. W. Ewing, trong International Standard Bible Encyclopedia, nghĩ rằng Ghi-bê-a này có thể là một trong hai làng ấy, vì bảng kê chỉ về miền đông nam Hếp-rôn, và cũng coi nó là Ghi-bê-a của sách Sử Ký. Eusebius còn nêu một Gabatha cách Eleutheropolis mười hai dặm, nơi người ta chỉ mộ của tiên tri Ha-ba-cúc. Survey of Western Palestine nối ghi chú ấy với Jab'a, một làng đá nhỏ trên một sống đồi cao và hẹp, cách Beit Jibrin chừng mười hai dặm Anh. Các nhà đo đạc của nó cho rằng Jab'a có thể là Ghi-bê-a của Giu-đa, còn phế tích Tibna, cách hai dặm về phía tây bắc, là Thim-na, tên đứng cạnh trong bảng kê."
  ro:
    - "Această Ghibea, „deal”, era un oraș din regiunea muntoasă a lui Iuda, nu mai cunoscuta Ghibea a lui Saul din Beniamin. Iosua o enumeră într-un district la sud-est de Hebron, cu Maon, Carmel, Zif, Iuta, Izreel și Zanoah, ca Cain, Ghibea și Timna, zece cetăți cu satele lor. Cronicile numesc o Ghibea drept locul de baștină al mamei regelui Abia al lui Iuda: numele mamei sale era Micaia, fiica lui Uriel din Ghibea. Despre care Ghibea este vorba acolo nu se spune; Regii o numesc Maaca, fiica lui Abișalom, iar cele două însemnări sunt împăcate în feluri diferite."
    - "Nu se mai cunoaște nimic altceva, iar orașul nu a fost găsit. Numele, frecvent într-un ținut deluros, nu ajută. Principalul candidat de pe hartă este doar regiunea de la sud de Hebron, unde îl așază lista; printre locurile propuse se numără Khirbet el-Qaryatein și Bani Na'im, la marginea deșertului, și Jab'a, mai la nord, la vest de Betleem. Niciunul nu a dat numele."
    - "Eusebiu, în secolul al IV-lea, cunoștea sate numite Gabaa și Gabatha în estul Daromei. W. Ewing, în International Standard Bible Encyclopedia, a socotit că această Ghibea ar putea fi unul dintre ele, de vreme ce lista arată spre sud-estul Hebronului, și a luat-o și drept Ghibea din Cronici. Eusebiu mai numește o Gabatha la douăsprezece mile de Eleutheropolis, unde se arăta mormântul profetului Habacuc. Survey of Western Palestine a legat această știre de Jab'a, un mic sat de piatră pe o creastă înaltă și îngustă, la vreo douăsprezece mile englezești de Beit Jibrin. Topografii săi au socotit Jab'a poate Ghibea lui Iuda, iar ruina Tibna, la două mile spre nord-vest, Timna, numele trecut alături în listă."
  bg:
    - "Тази Гива, „хълм“, беше град в Юдейската планинска област, а не по-известната Гива Саулова във Вениамин. Книгата на Иисус Навин я изброява в област югоизточно от Хеврон заедно с Маон, Кармил, Зиф, Юта, Изреел и Заноах: „Акаин, Гаваа, и Тамна, градове десет, и селата им“. Летописи назовава една Гива като дом на майката на юдейския цар Авия: „А името на майка му бе Михаия, дъщеря на Уриила от Гавая.“ Коя Гива се има предвид там, не е казано; Царе я нарича Мааха, дъщеря на Авесалом, и двете сведения се съгласуват по различни начини."
    - "Нищо друго не се знае, а градът не е открит. Името, често срещано в една хълмиста земя, не помага. Главният кандидат на картата е само областта южно от Хеврон, където я поставя списъкът; предлагани конкретни места са Хирбет ел-Карятейн и Бани Наим на края на пустинята и Джаба по на север, западно от Витлеем. Никое не е дало името."
    - "Евсевий през IV в. познавал села на име Габаа и Габата в източната част на Дарома. У. Юинг в „International Standard Bible Encyclopedia“ смятал, че тази Гива може да е едно от тях, понеже списъкът сочи към областта югоизточно от Хеврон, и я приемал и за Гивата от Летописи. Евсевий назовава още една Габата на дванадесет мили от Елевтерополис, където се показвал гробът на пророк Авакум. Survey of Western Palestine свързва това сведение с Джаба, малко каменно село на висок, тесен хребет на около дванадесет английски мили от Бейт Джибрин. Неговите топографи смятали Джаба вероятно за Гива Юдова, а развалината Тибна, на две мили на северозапад, за Тамна, името, посочено до нея в списъка."
scripture:
