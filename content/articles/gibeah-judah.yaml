body:
  en:
    - "This Gibeah, “hill”, was a town in the hill country of Judah, not the better-known Gibeah of Saul in Benjamin. Joshua lists it in a district south-east of Hebron with Maon, Carmel, Ziph, Juttah, Jezreel and Zanoah: “Cain, Gibeah, and Timnah; ten cities with their villages”. Chronicles names a Gibeah as the home of the mother of King Abijah of Judah: “His mother’s name also was Michaiah the daughter of Uriel of Gibeah.” Which Gibeah is meant there is not said; Kings calls her Maachah the daughter of Abishalom, and the two notices are reconciled in different ways."
    - "Nothing else is known, and the town has not been found. The name, common in a hilly land, gives no help. The map's main candidate is only the region south of Hebron, where the list places it; particular sites proposed include Khirbet el-Qaryatein and Bani Na'im on the edge of the desert, and Jab'a farther north, west of Bethlehem. None has produced the name."
  ru:
    - "Эта Гива, «холм», — город в горах Иуды, не путать с более известной Гивой Сауловой в Вениамине. Книга Иисуса Навина называет её в округе к юго-востоку от Хеврона вместе с Маоном, Кармилом, Зифом, Ютой, Изреелем и Заноахом: «Каин, Гива и Фимна: десять городов с их селами». Паралипоменон называет Гиву родиной матери Авии, царя Иудейского: «имя матери его Михаия, дочь Уриилова, из Гивы». Какая Гива имеется в виду, не сказано; книга Царств называет её Маахой, дочерью Авессалома, и эти два известия согласуют по-разному."
    - "Больше ничего не известно, и город не найден. Имя, обычное для гористой страны, не помогает. Главный кандидат на карте — лишь область к югу от Хеврона, где её помещает список; из отдельных мест предлагали Хирбет-эль-Карьятейн и Бани-Наим на краю пустыни и Джабу севернее, к западу от Вифлеема. Ни одно не дало имени."
  uk:
    - "Ця Гіва, «пагорб», була містом у гірській країні Юди, а не відомішою Гівою Сауловою у Веніямина. Книга Ісуса Навина перелічує її в окрузі на південний схід від Хеврона з Маоном, Кармелем, Зіфом, Юттою, Їзреелем і Заноахом: «Каин, Гива та Тимна — десять городів з їх селами». Хроніки називають Гіву батьківщиною матері царя Юди Авії: «мати його звалась Михаїя, Уриїлівна, з Гиви». Яку Гіву мають на увазі, не сказано; Книги Царів називають її Мааха, дочка Авесалома, і ці дві згадки узгоджують по-різному."
    - "Більше нічого невідомо, і місто не знайдено. Назва, поширена в гористому краї, не допомагає. Головний кандидат на карті — лише область на південь від Хеврона, куди її поміщає перелік; серед запропонованих окремих місць — Хірбет-ель-Карьятейн і Бані-Наїм на краю пустелі та Джабаа далі на північ, на захід від Вифлеєма. Жодне не дало назви."
  es:
    - "Esta Gabaa, «colina», era una población de la región montañosa de Judá, no la más conocida Gabaa de Saúl, en Benjamín. Josué la enumera en un distrito al sudeste de Hebrón con Maón, Carmel, Zif, Jutá, Jezreel y Zanoa: «Caín, Gibea, y Timna; diez ciudades con sus aldeas». Crónicas nombra una Gabaa como patria de la madre del rey Abías de Judá: «El nombre de su madre fué Michâía hija de Uriel de Gabaa». No se dice de qué Gabaa se trata; Reyes la llama Maaca hija de Abisalom, y las dos noticias se concilian de diversas maneras."
    - "No se sabe nada más, y la población no ha sido hallada. El nombre, común en un país de colinas, no ayuda. El principal candidato del mapa es solo la región al sur de Hebrón, donde la lista la sitúa; entre los sitios concretos propuestos están Khirbet el-Qaryatein y Bani Na'im, en el borde del desierto, y Jab'a, más al norte, al oeste de Belén. Ninguno ha dado el nombre."
  pt:
    - "Esta Gibeá, “colina”, era uma cidade na região montanhosa de Judá, e não a mais conhecida Gibeá de Saul, em Benjamim. Josué a lista num distrito a sudeste de Hebrom, com Maom, Carmelo, Zife, Jutá, Jezreel e Zanoa: “Caim, Gibeá e Timna; dez cidades com as suas aldeias”. Crônicas nomeia uma Gibeá como terra da mãe do rei Abias de Judá: “O nome de sua mãe era Micaías, filha de Uriel, de Gibeá.” Qual Gibeá se quer dizer ali não é dito; Reis a chama Maaca, filha de Absalão, e as duas notícias são conciliadas de maneiras diferentes."
    - "Nada mais se sabe, e a cidade não foi encontrada. O nome, comum numa terra de colinas, não ajuda. O principal candidato do mapa é apenas a região ao sul de Hebrom, onde a lista a situa; entre os sítios particulares propostos estão Khirbet el-Qaryatein e Bani Na’im, na orla do deserto, e Jab’a, mais ao norte, a oeste de Belém. Nenhum produziu o nome."
  de:
    - "Dieses Gibea, „Hügel“, war eine Stadt im Bergland Judas, nicht das bekanntere Gibea Sauls in Benjamin. Josua führt es in einem Bezirk südöstlich von Hebron mit Maon, Karmel, Sif, Juta, Jesreel und Sanoach auf: „Hakain, Gibea, Thimna. Das sind zehn Städte und ihre Dörfer.“ Die Chronik nennt ein Gibea als Heimat der Mutter König Abijas von Juda: „Seine Mutter hieß Michaja, eine Tochter Uriels von Gibea.“ Welches Gibea gemeint ist, wird nicht gesagt; die Königsbücher nennen sie Maacha, die Tochter Abisaloms, und die beiden Angaben werden auf verschiedene Weise in Einklang gebracht."
    - "Sonst ist nichts bekannt, und die Stadt ist nicht gefunden. Der Name, in einem hügeligen Land häufig, hilft nicht weiter. Der Hauptkandidat auf der Karte ist nur das Gebiet südlich von Hebron, wo die Liste sie ansetzt; als einzelne Stätten werden Chirbet el-Qaryatein und Bani Na'im am Wüstenrand und Jab'a weiter nördlich, westlich von Bethlehem, vorgeschlagen. Keine hat den Namen geliefert."
  fr:
    - "Cette Guibea, « colline », était une ville de la montagne de Juda, et non la Guibea de Saül, plus connue, en Benjamin. Josué l’inscrit dans un district au sud-est d’Hébron avec Maon, Carmel, Ziph, Jutta, Jizreel et Zanoach : « Kaïn, Guibea, et Thimna ; dix villes, et leurs villages ». Les Chroniques nomment une Guibea comme patrie de la mère du roi Abija de Juda : « Sa mère s’appelait Micaja, fille d’Uriel, de Guibea. » On ne dit pas de quelle Guibea il s’agit ; les Rois l’appellent Maaca, fille d’Abisalom, et les deux notices se concilient de diverses manières."
    - "On ne sait rien d’autre, et la ville n’a pas été retrouvée. Le nom, courant dans un pays de collines, n’aide guère. Le principal candidat de la carte n’est que la région au sud d’Hébron, où la liste la place ; parmi les sites proposés figurent Khirbet el-Qaryatein et Bani Na’im, en bordure du désert, et Jab’a, plus au nord, à l’ouest de Bethléem. Aucun n’a livré le nom."
  pl:
    - "Ta Gibea, „wzgórze”, była miastem w górach Judy, a nie lepiej znaną Gibeą Saulową w Beniaminie. Jozue wymienia ją w okręgu na południowy wschód od Hebronu z Maonem, Karmelem, Zifem, Juttą, Jizreelem i Zanoach: „Kain, Gabaa, i Tamna, miast dziesięć, i wsi ich”. Księgi Kronik wymieniają Gibeę jako miejsce pochodzenia matki króla Judy Abiasza: „imię matki jego było Michaja, córka Uryjelowa z Gabaa”. Która Gibea jest tam rozumiana, nie powiedziano; Księgi Królewskie nazywają ją Maaką, córką Abiszaloma, a oba zapisy godzi się na różne sposoby."
    - "Nic więcej nie wiadomo, a miasta nie odnaleziono. Nazwa, pospolita w kraju górzystym, niczego nie podpowiada. Głównym kandydatem na mapie jest tylko region na południe od Hebronu, gdzie umieszcza ją wykaz; wśród proponowanych miejsc są Chirbet el-Qaryatein i Bani Naim na skraju pustyni oraz Jab'a dalej na północ, na zachód od Betlejem. Żadne nie dostarczyło tej nazwy."
  it:
    - "Questa Gabaa, «colle», era una città sui monti di Giuda, non la più nota Gabaa di Saul in Beniamino. Giosuè la elenca in un distretto a sud-est di Ebron con Maon, Carmelo, Zif, Iutta, Izreel e Zanoa: «Kain, Ghibea e Timna: dieci città e i loro villaggi». Le Cronache nominano una Gabaa come patria della madre del re Abia di Giuda: «Sua madre si chiamava Micaia, figliuola d’Uriel, da Ghibea». Quale Gabaa sia intesa non è detto; i Re la chiamano Maaca, figlia di Abisalom, e le due notizie vengono conciliate in modi diversi."
    - "Non si sa altro, e la città non è stata trovata. Il nome, comune in una terra collinosa, non è d’aiuto. Il candidato principale sulla mappa è soltanto la regione a sud di Ebron, dove la collocano gli elenchi; i siti particolari proposti comprendono Khirbet el-Qaryatein e Bani Na’im al margine del deserto, e Jab’a più a nord, a ovest di Betlemme. Nessuno ha restituito il nome."
  nl:
    - "Dit Gibea, “heuvel”, was een stad in het bergland van Juda, niet het bekendere Gibea van Saul in Benjamin. Jozua noemt het in een district ten zuidoosten van Hebron met Maön, Karmel, Zif, Juta, Jizreël en Zanoach: “Kain, Gibea, en Timna; tien steden en haar dorpen”. Kronieken noemt een Gibea als woonplaats van de moeder van koning Abia van Juda: “de naam zijner moeder was Michaja, de dochter van Uriel, van Gibea”. Welk Gibea bedoeld is, wordt niet gezegd; Koningen noemt haar Maächa, de dochter van Abisalom, en de twee berichten worden op verschillende wijzen met elkaar verzoend."
    - "Meer is er niet bekend, en de stad is niet gevonden. De naam, die in een heuvelachtig land veel voorkomt, helpt niet. De belangrijkste kandidaat op de kaart is alleen de streek ten zuiden van Hebron, waar de lijst haar plaatst; voorgestelde plaatsen zijn onder meer Khirbet el-Qaryatein en Bani Na’im aan de woestijnrand, en Jab’a verder naar het noorden, ten westen van Bethlehem. Geen daarvan heeft de naam opgeleverd."
  cs:
    - "Tato Gibea, „pahorek“, bylo město v judské pahorkatině, nikoli známější Gibea Saulova v Benjamínovi. Jozue ji uvádí v okrese jihovýchodně od Hebronu s Maonem, Karmelem, Zífem, Jutou, Jizreelem a Zanoachem: „Kain, Gabaa a Tamna, měst deset i vsi jejich“. Letopisy jmenují Gibeu jako domov matky krále Abiji Judského: „a jméno matky jeho Michaia, dcera Urielova z Gabaa“. Která Gibea se tím míní, není řečeno; Královská ji nazývají Maakou, dcerou Abšalomovou, a obě zprávy se uvádějí do souladu různými způsoby."
    - "Nic jiného není známo a město nebylo nalezeno. Jméno, v pahorkaté zemi časté, nepomáhá. Hlavním kandidátem na mapě je jen oblast jižně od Hebronu, kam ji klade seznam; z navrhovaných míst jsou Chirbet el-Qarjatein a Báni Na'im na okraji pouště a Jab'a dále na severu, západně od Betléma. Žádné z nich jméno nepřineslo."
  sv:
    - "Denna Giva, ”kulle”, var en stad i Judas bergsbygd, inte den mer kända Sauls Giva i Benjamin. Josua räknar upp den i ett distrikt sydost om Hebron med Maon, Karmel, Sif, Jutta, Jisreel och Sanoach: ”Kain, Gibea och Timna – tio städer med sina byar”. Krönikeboken nämner en Gibea som hemort för modern till Juda kung Avia: ”Hans moder hette Mikaja, Uriels dotter, från Gibea.” Vilken Giva som avses där sägs inte; Kungaboken kallar henne Maaka, Abisaloms dotter, och de två notiserna förenas på olika sätt."
    - "Inget mer är känt, och staden har inte hittats. Namnet, vanligt i ett kuperat land, hjälper inte. Kartans huvudkandidat är bara trakten söder om Hebron, där förteckningen placerar den; särskilda platser som föreslagits är Khirbet el-Qaryatein och Bani Na'im i ökenkanten, och Jab'a längre norrut, väster om Betlehem. Ingen har gett namnet."
  nb:
    - "Denne Gibea, «høyde», var en by i Judas fjellland, ikke den bedre kjente Gibea hos Saul i Benjamin. Josva oppfører den i et distrikt sørøst for Hebron sammen med Maon, Karmel, Sif, Jutta, Jisreel og Sanoah: «Hakka'in, Gibea og Timna - ti byer med tilhørende landsbyer». Krønikebøkene nevner en Gibea som hjemstedet til moren til kong Abia av Juda: «Hans mor hette Mikaja; hun var datter av Uriel og var fra Gibea.» Hvilken Gibea som menes der, sies ikke; Kongebøkene kaller henne Maaka, datter av Abisalom, og de to notisene forenes på ulike måter."
    - "Ellers er ingenting kjent, og byen er ikke funnet. Navnet, vanlig i et kupert land, hjelper ikke. Kartets viktigste kandidat er bare området sør for Hebron, der listen plasserer den; de foreslåtte stedene omfatter Khirbet el-Qaryatein og Bani Na'im i ørkenkanten, og Jab'a lenger nord, vest for Betlehem. Ingen av dem har gitt navnet."
  tl:
    - "Ang Gibea na ito, “burol”, ay isang bayan sa maburol na lupain ng Juda, hindi ang mas kilalang Gibea ni Saul sa Benjamin. Inililista ito ni Josue sa isang distrito sa timog-silangan ng Hebron kasama ng Maon, Carmel, Ziph, Juta, Jezreel at Zanoa: “Cain, Gibea, at Timna: sangpung bayan pati ng mga nayon ng mga yaon”. Pinangalanan ng Mga Cronica ang isang Gibea bilang tahanan ng ina ni Haring Abias ng Juda: “ang pangalan ng kaniyang ina ay Michaia na anak ni Uriel na taga Gabaa.” Hindi sinasabi kung aling Gibea ang tinutukoy doon; tinatawag siya ng Mga Hari na Maaca na anak ni Abisalom, at pinagkakasundo sa iba't ibang paraan ang dalawang tala."
    - "Wala nang iba pang nalalaman, at hindi pa natatagpuan ang bayan. Walang naitutulong ang pangalan, na karaniwan sa maburol na lupain. Ang pangunahing kandidato sa mapa ay ang rehiyon lamang sa timog ng Hebron, kung saan inilalagay ito ng listahan; kabilang sa mga partikular na lugar na iminungkahi ang Khirbet el-Qaryatein at Bani Na'im sa gilid ng disyerto, at ang Jab'a na mas hilaga, sa kanluran ng Bethlehem. Wala sa mga ito ang nagbunga ng pangalan."
  da:
    - "Denne Gibea, »høj«, var en by i Judas bjergland, ikke den bedre kendte Sauls Gibea i Benjamin. Josva opregner den i et distrikt sydøst for Hebron sammen med Maon, Karmel, Zif, Jutta, Jizre'el og Zanoa: »Kain, Gibea og Timna; ti Stæder og deres Landsbyer«. Krønikebøgerne nævner en Gibea som hjemsted for moderen til kong Abija af Juda: »hans Moders Navn var Mikaja, Uriels Datter fra Gibea«. Hvilken Gibea der menes, siges ikke; Kongebøgerne kalder hende Maaka, Abisaloms datter, og de to notitser forliges på forskellig vis."
    - "Intet andet er kendt, og byen er ikke fundet. Navnet, der er almindeligt i et bjergrigt land, giver ingen hjælp. Kortets hovedkandidat er blot egnen syd for Hebron, hvor listen placerer den; konkrete steder, der er foreslået, omfatter Khirbet el-Qaryatein og Bani Na'im i udkanten af ørkenen og Jab'a længere mod nord, vest for Betlehem. Ingen af dem har givet navnet."
scripture:
