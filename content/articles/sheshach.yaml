body:
  en:
    - "Sheshach is not a separate city but a name for Babylon, used twice in Jeremiah. At the end of the list of nations who must drink the cup of the LORD's wrath comes “the king of Sheshach”, who “shall drink after them”; and in the oracle against Babylon the parallel lines make the meaning plain: “How is Sheshach taken! and how is the praise of the whole earth surprised! how is Babylon become an astonishment among the nations!” The form is explained as an atbash, a scribal cipher that replaces each letter of the Hebrew alphabet with its mirror from the other end: the consonants of Babel, b-b-l, become sh-sh-k. In the Hebrew of the first verse of that chapter the same device turns Kasdim, the Chaldeans, into Leb-kamai, which the translations render as a phrase."
    - "Why the cipher was used is not known; by the time of the oracle against Babylon there was nothing to hide, and it may be a learned play rather than a disguise. The Greek translation of Jeremiah lacks the phrase about the king of Sheshach in chapter 25, and some take it for a later addition. Since Sheshach is Babylon, the map shows it at Babylon, whose ruins lie on the Euphrates south of Baghdad near Hillah in Iraq."
  ru:
    - "Сесах — не отдельный город, а имя Вавилона, дважды встречающееся у Иеремии. В конце перечня народов, которые должны испить чашу гнева Господня, стоит царь Сесаха: «а царь Сесаха выпьет после них»; а в пророчестве против Вавилона параллельные строки делают смысл ясным: «Как взят Сесах, и завоевана слава всей земли! Как сделался Вавилон ужасом между народами!» Форму объясняют как атбаш — писцовый шифр, заменяющий каждую букву еврейского алфавита её зеркальной парой с другого конца: согласные имени Бавель, б-б-л, становятся ш-ш-к. В еврейском тексте первого стиха той же главы тем же приёмом Касдим, халдеи, превращаются в Лев-Камай, который переводы передают как обычные слова."
    - "Зачем понадобился шифр, неизвестно: ко времени пророчества против Вавилона скрывать было уже нечего, и это может быть учёной игрой, а не тайнописью. В греческом переводе Иеремии слов о царе Сесаха в 25-й главе нет, и некоторые считают их поздней вставкой. Раз Сесах — это Вавилон, на карте он показан на месте Вавилона, чьи развалины лежат на Евфрате к югу от Багдада, близ Хиллы в Ираке."
  uk:
    - "Сесах — не окреме місто, а назва Вавилону, яку двічі вжито в Єремії. Наприкінці переліку народів, що мають випити чашу гніву Господнього, стоїть: «царь Сесахський (Вавилонський) випє послї них»; а в пророцтві проти Вавилону паралельні рядки роблять значення очевидним: «О, як же впаде Сесах (Вавилон), як звоюють пиху всієї землї! О, як же то Вавилон та зробиться страховищем між народами!» Цю форму пояснюють як атбаш — писарський шифр, що замінює кожну літеру єврейського алфавіту її дзеркальним відповідником з іншого кінця: приголосні Бабеля, б-б-л, стають ш-ш-к. В івриті першого вірша того самого розділу цей прийом перетворює Кашдім, халдеїв, на Лев-Камай, що переклади передають фразою."
    - "Чому використано шифр, невідомо; на час пророцтва проти Вавилону нічого було приховувати, і це може бути вченою грою, а не маскуванням. У грецькому перекладі Єремії фрази про царя Сесаху в 25-му розділі немає, і дехто вважає її пізнішим додатком. Оскільки Сесах — це Вавилон, карта показує його у Вавилоні, руїни якого лежать на Євфраті на південь від Багдада поблизу Гілли в Іраку."
  es:
    - "Sesac no es una ciudad aparte, sino un nombre de Babilonia, usado dos veces en Jeremías. Al final de la lista de las naciones que deben beber la copa de la ira del Señor viene «el rey de Sesach», que «beberá después de ellos»; y en el oráculo contra Babilonia las líneas paralelas aclaran el sentido: «¡Cómo fué presa Sesach, y fué tomada la que era alabada por toda la tierra! ¡Cómo fué Babilonia por espanto entre las gentes!». La forma se explica como un atbash, una cifra de escribas que sustituye cada letra del alfabeto hebreo por su reflejo desde el otro extremo: las consonantes de Babel, b-b-l, se convierten en sh-sh-k. En el hebreo del primer versículo de ese capítulo el mismo recurso convierte Kasdim, los caldeos, en Leb-camai, que las traducciones vierten como una frase."
    - "Se ignora por qué se usó la cifra; para cuando llegó el oráculo contra Babilonia no había nada que ocultar, y puede ser un juego erudito más que un disfraz. La traducción griega de Jeremías carece de la frase sobre el rey de Sesac en el capítulo 25, y algunos la toman por una adición posterior. Como Sesac es Babilonia, el mapa la muestra en Babilonia, cuyas ruinas se encuentran en el Éufrates, al sur de Bagdad, cerca de Hilla, en Irak."
  pt:
    - "Sesaque não é uma cidade à parte, mas um nome para a Babilônia, usado duas vezes em Jeremias. No fim da lista das nações que devem beber o cálice da ira do SENHOR vem “o rei de Sesaque”, que “beberá depois deles”; e no oráculo contra a Babilônia as linhas paralelas tornam o sentido claro: “Como Sesaque foi tomada! Como o louvor de toda a terra foi capturado! Como a Babilônia se tornou uma desolação entre as nações!” A forma é explicada como um atbash, uma cifra de escribas que troca cada letra do alfabeto hebraico por seu espelho do outro extremo: as consoantes de Babel, b-b-l, tornam-se sh-sh-k. No hebraico do primeiro versículo desse capítulo o mesmo artifício transforma Kasdim, os caldeus, em Leb-Camai, que as traduções vertem como uma frase."
    - "Por que a cifra foi usada não se sabe; na época do oráculo contra a Babilônia não havia nada a esconder, e pode ser um jogo erudito e não um disfarce. A tradução grega de Jeremias não tem a frase sobre o rei de Sesaque no capítulo 25, e alguns a tomam por acréscimo posterior. Como Sesaque é Babilônia, o mapa a mostra em Babilônia, cujas ruínas ficam no Eufrates, ao sul de Bagdá, perto de Hila, no Iraque."
  de:
    - "Scheschach ist keine eigene Stadt, sondern ein Name für Babylon, bei Jeremia zweimal gebraucht. Am Ende der Liste der Völker, die den Becher des Zornes des HERRN trinken müssen, steht „der König zu Sesach“, der „soll nach diesen trinken“; und im Spruch gegen Babylon macht die Parallelzeile den Sinn klar: „Wie ist Sesach so gewonnen und die Berühmte in aller Welt so eingenommen! Wie ist Babel so zum Wunder geworden unter den Heiden!“ Die Form wird als Atbasch erklärt, eine Schreiberchiffre, die jeden Buchstaben des hebräischen Alphabets durch seinen Spiegel vom anderen Ende ersetzt: Die Konsonanten von Babel, b-b-l, werden zu sch-sch-k. Im Hebräischen des ersten Verses jenes Kapitels macht dasselbe Verfahren aus Kasdim, den Chaldäern, Leb-Kamai, was die Übersetzungen als Wendung wiedergeben."
    - "Warum die Chiffre gebraucht wurde, ist unbekannt; zur Zeit des Spruchs gegen Babylon gab es nichts zu verbergen, und es mag ein gelehrtes Spiel statt einer Verhüllung sein. Die griechische Übersetzung Jeremias lässt in Kapitel 25 die Wendung vom König von Scheschach aus, und manche halten sie für einen späteren Zusatz. Da Scheschach Babylon ist, zeigt die Karte es bei Babylon, dessen Ruinen am Euphrat südlich von Bagdad nahe Hilla im Irak liegen."
  fr:
    - "Schéschac n’est pas une ville distincte mais un nom de Babylone, employé deux fois chez Jérémie. À la fin de la liste des nations qui doivent boire la coupe de la colère de l’Éternel vient « le roi de Schéschac », qui « boira après eux » ; et dans l’oracle contre Babylone les lignes parallèles en rendent le sens clair : « Eh quoi ! Schéschac est prise ! Celle dont la gloire remplissait toute la terre est conquise ! Eh quoi ! Babylone est détruite au milieu des nations ! » La forme s’explique comme un atbash, chiffre de scribe qui remplace chaque lettre de l’alphabet hébreu par son symétrique à l’autre bout : les consonnes de Babel, b-b-l, deviennent sh-sh-k. Dans l’hébreu du premier verset de ce chapitre, le même procédé change Kasdim, les Chaldéens, en Leb-kamaï, que les traductions rendent par une expression."
    - "On ignore pourquoi le chiffre fut employé ; à l’époque de l’oracle contre Babylone, il n’y avait rien à cacher, et ce peut être un jeu savant plutôt qu’un déguisement. La traduction grecque de Jérémie omet la phrase sur le roi de Schéschac au chapitre 25, et certains y voient un ajout tardif. Puisque Schéschac est Babylone, la carte la montre à Babylone, dont les ruines se trouvent sur l’Euphrate, au sud de Bagdad, près de Hillah, en Irak."
  it:
    - "Sesac non è una città distinta ma un nome per Babilonia, usato due volte in Geremia. Alla fine dell’elenco delle nazioni che devono bere la coppa dell’ira del Signore viene «il re di Sceshac», che «ne berrà dopo di loro»; e nell’oracolo contro Babilonia le righe parallele rendono chiaro il senso: «Come mai è stata presa Sceshac, ed è stata conquistata colei ch’era il vanto di tutta la terra? Come mai Babilonia è ella diventata una desolazione fra le nazioni?» La forma è spiegata come un atbash, una cifra degli scribi che sostituisce ogni lettera dell’alfabeto ebraico con la sua speculare dall’altra estremità: le consonanti di Babele, b-b-l, diventano sh-sh-k. Nell’ebraico del primo versetto di quel capitolo lo stesso artificio trasforma Kasdim, i Caldei, in Leb-Kamai, che le traduzioni rendono come una frase."
    - "Perché si usasse la cifra non si sa; al tempo dell’oracolo contro Babilonia non c’era nulla da nascondere, e può essere un gioco dotto piuttosto che un travestimento. La traduzione greca di Geremia manca della frase sul re di Sesac nel capitolo 25, e alcuni la ritengono un’aggiunta posteriore. Poiché Sesac è Babilonia, la mappa la mostra a Babilonia, le cui rovine si trovano sull’Eufrate a sud di Baghdad presso Hillah in Iraq."
  pl:
    - "Szeszak nie jest odrębnym miastem, lecz imieniem Babilonu, użytym dwa razy u Jeremiasza. Na końcu listy narodów, które muszą wypić kielich gniewu Pana, stoi: „a król Sesak będzie pił po nich”; a w wyroczni przeciw Babilonowi równoległe wiersze wyjaśniają znaczenie: „Jakożby dobyty mógł być Sesach? Jakożby wzięta być mogła chwała wszystkiej ziemi? Jakożby mógł przyjść na spustoszenie Babilon między narodami?” Formę tę wyjaśnia się jako atbasz, szyfr pisarski zastępujący każdą literę alfabetu hebrajskiego jej lustrzanym odpowiednikiem z drugiego końca: spółgłoski Babel, b-b-l, stają się sz-sz-k. W hebrajskim pierwszego wersetu tego rozdziału ten sam zabieg zmienia Kasdim, Chaldejczyków, w Leb-Kamaj, co przekłady oddają frazą."
    - "Dlaczego użyto szyfru, nie wiadomo; w czasie wyroczni przeciw Babilonowi nie było nic do ukrywania i może to uczona gra, a nie przebranie. Grecki przekład Jeremiasza nie ma wyrażenia o królu Szeszaku w rozdziale 25 i niektórzy uważają je za późniejszy dodatek. Ponieważ Szeszak to Babilon, mapa pokazuje go w Babilonie, którego ruiny leżą nad Eufratem na południe od Bagdadu koło Hilli w Iraku."
  cs:
    - "Šešak není samostatné město, ale jméno Babylóna, užité dvakrát u Jeremjáše. Na konci seznamu národů, které musí pít kalich Hospodinova hněvu, stojí: „Král pak Sesák píti bude po nich“; a ve věštbě proti Babylónu činí souběžné řádky smysl zřejmým: „Jakž by dobyt býti mohl Sesák? Jakž by vzata býti mohla chvála vší země? Jakž by přijíti mohl na spuštění Babylon mezi národy?“ Tvar se vysvětluje jako atbaš, písařská šifra, která nahrazuje každé písmeno hebrejské abecedy jeho zrcadlovým písmenem z druhého konce: souhlásky Babel, b-b-l, se mění na š-š-k. V hebrejštině prvního verše téže kapitoly tentýž prostředek mění Kasdim, Chaldejce, na Léb-kamaj, což překlady vykládají jako slovní spojení."
    - "Proč byla šifra použita, není známo; v době věštby proti Babylónu nebylo co skrývat a může jít o učenou hru spíše než o zahalení. Řecký překlad Jeremjáše postrádá větu o králi Šešaku v kapitole 25 a někteří ji pokládají za pozdější doplněk. Protože je Šešak Babylón, ukazuje jej mapa v Babylóně, jehož zříceniny leží na Eufratu jižně od Bagdádu poblíž Hilly v Iráku."
  nl:
    - "Sesach is geen aparte stad maar een naam voor Babylon, tweemaal gebruikt bij Jeremia. Aan het einde van de lijst van volken die de beker van de toorn van de HEER moeten drinken, komt “de koning van Sesach”, die “zal na hen drinken”; en in de godsspraak tegen Babylon maken de parallelle regels de betekenis duidelijk: “Hoe is Sesach zo veroverd, en de roem der ganse aarde ingenomen! Hoe is Babel geworden tot een ontzetting onder de heidenen!” De vorm wordt verklaard als een atbasj, een schrijverscijfer dat elke letter van het Hebreeuwse alfabet vervangt door haar spiegelbeeld vanaf het andere einde: de medeklinkers van Babel, b-b-l, worden sj-sj-k. In het Hebreeuws van het eerste vers van dat hoofdstuk maakt hetzelfde middel van Kasdim, de Chaldeeën, Leb-Kamai, wat de vertalingen als een zin weergeven."
    - "Waarom het cijfer werd gebruikt, is niet bekend; ten tijde van de godsspraak tegen Babylon viel er niets te verbergen, en het kan een geleerd spel zijn in plaats van een vermomming. De Griekse vertaling van Jeremia mist de zin over de koning van Sesach in hoofdstuk 25, en sommigen houden hem voor een latere toevoeging. Omdat Sesach Babylon is, toont de kaart het bij Babylon, wier ruïnes aan de Eufraat liggen ten zuiden van Bagdad bij Hillah in Irak."
  sv:
    - "Sheshak är inte en särskild stad utan ett namn på Babylon, som används två gånger hos Jeremia. I slutet av förteckningen över de folk som måste dricka bägaren med HERRENS vrede kommer ”Sesaks konung”, om vilken det heter att han ”skall dricka efter dem”; och i oraklet mot Babylon gör de parallella raderna meningen klar: ”Huru har icke Sesak blivit intaget och hon som var hela jordens berömmelse erövrad! Huru har icke Babel blivit ett föremål för häpnad bland folken!” Formen förklaras som en atbash, ett skrivarchiffer som ersätter varje bokstav i det hebreiska alfabetet med dess spegelbild från andra änden: konsonanterna i Babel, b-b-l, blir sh-sh-k. I hebreiskan i första versen i det kapitlet gör samma knep Kasdim, kaldeerna, till Lev-Kamaj, vilket översättningarna återger som en fras."
    - "Varför chiffret användes är inte känt; när oraklet mot Babylon kom fanns inget att dölja, och det kan vara en lärd lek snarare än en förklädnad. Den grekiska översättningen av Jeremia saknar frasen om Sesaks konung i kapitel 25, och vissa tar den för ett senare tillägg. Eftersom Sheshak är Babylon visar kartan det vid Babylon, vars ruiner ligger vid Eufrat söder om Bagdad nära Hillah i Irak."
  nb:
    - "Sjesjak er ikke en egen by, men et navn på Babylon, brukt to ganger hos Jeremia. På slutten av listen over folkene som må drikke Herrens vredes beger kommer «Sesaks konge», som «skal drikke efter dem»; og i oraklet mot Babylon gjør de parallelle linjene meningen klar: «Sesak er blitt hærtatt, all jordens pris er blitt inntatt! Hvor Babel er blitt til en forferdelse blandt folkene!» Formen forklares som en atbasj, en skriverchiffer som erstatter hver bokstav i det hebraiske alfabetet med dens speilbilde fra den andre enden: konsonantene i Babel, b-b-l, blir sj-sj-k. I den hebraiske teksten til det første verset i det kapitlet gjør samme grep Kasdim, kaldeerne, til Leb-Kamai, som oversettelsene gjengir som en frase."
    - "Hvorfor chifferen ble brukt, er ikke kjent; da oraklet mot Babylon kom, var det ingenting å skjule, og det kan være en lærd lek snarere enn en forkledning. Den greske oversettelsen av Jeremia mangler frasen om kongen av Sjesjak i kapittel 25, og noen tar den for et senere tillegg. Siden Sjesjak er Babylon, viser kartet det ved Babylon, hvis ruiner ligger ved Eufrat sør for Bagdad nær Hillah i Irak."
  tl:
    - "Ang Sesach ay hindi hiwalay na lungsod kundi pangalan para sa Babilonia, ginamit nang dalawang beses sa Jeremias. Sa wakas ng listahan ng mga bansang dapat uminom ng saro ng poot ng Panginoon ay dumarating “ang hari sa Sesach”, na “magsisiinom pagkatapos nila”; at sa orakulo laban sa Babilonia, nililinaw ng magkatapat na mga linya ang kahulugan: “Ano't nasakop ang Sesach! at ang kapurihan ng buong lupa ay nagitla! ano't ang Babilonia ay naging kagibaan sa gitna ng mga bansa!” Ipinaliliwanag ang anyo bilang atbash, isang lihim na sulat ng eskriba na pinapalitan ang bawat titik ng alpabetong Hebreo ng salamin nito mula sa kabilang dulo: ang mga katinig ng Babel, b-b-l, ay nagiging sh-sh-k. Sa Hebreo ng unang talata ng kabanatang iyon, ang parehong paraan ay ginagawang Lebcamai ang Kasdim, ang mga Caldeo, na isinasalin ng mga salin bilang parirala."
    - "Hindi alam kung bakit ginamit ang cipher; sa panahon ng orakulo laban sa Babilonia ay wala nang itatago, at maaaring paglalarong pang-iskolar ito sa halip na pagbabalatkayo. Wala sa saling Griyego ng Jeremias ang pariralang tungkol sa hari ng Sesach sa kabanata 25, at itinuturing ito ng ilan na kalaunang dagdag. Yamang ang Sesach ay Babilonia, ipinapakita ito ng mapa sa Babilonia, na ang mga guho ay nasa Eufrates sa timog ng Baghdad malapit sa Hillah sa Iraq."
  da:
    - "Sjesjak er ikke en særskilt by, men et navn for Babylon, brugt to gange hos Jeremias. Ved slutningen af listen over folkene, der må drikke Herrens vredes bæger, kommer »Kongen af Sesak«, som »skal drikke efter dem«; og i udsagnet mod Babylon gør de parallelle linjer meningen tydelig: »Hvorledes er Sesak indtaget, og den, som var hele Jordens Pris, erobret! hvorledes er Babel bleven til en Forfærdelse iblandt Folkene!« Formen forklares som en atbash, en skriverchiffer, der erstatter hvert bogstav i det hebraiske alfabet med dets spejlbillede fra den anden ende: konsonanterne i Babel, b-b-l, bliver til sj-sj-k. I det hebraiske i første vers af det kapitel gør den samme teknik Kasdim, kaldæerne, til Leb-Kamaj, som oversættelserne gengiver som en sætning."
    - "Hvorfor chifferen blev brugt, vides ikke; ved tiden for udsagnet mod Babylon var der intet at skjule, og det kan være et lærd spil snarere end en forklædning. Den græske oversættelse af Jeremias mangler sætningen om kongen af Sjesjak i kapitel 25, og nogle tager den for et senere tillæg. Da Sjesjak er Babylon, viser kortet det ved Babylon, hvis ruiner ligger ved Eufrat syd for Bagdad nær Hillah i Irak."
  sr:
    - "Сисах није посебан град него име за Вавилон, употребљено двапут код Јеремије. На крају списка народа који морају пити чашу гнева Господњег долази „цар сисашки“, који „пиће после њих“; а у пророштву против Вавилона паралелни редови чине значење јасним: „Како се предоби Сисах и узе се хвала све земље? Како Вавилон поста чудо међу народима?“ Облик се објашњава као атбаш, писарски шифрарник који замењује свако слово хебрејске абецеде његовим огледалним са другог краја: сугласници Вавела, б-б-л, постају ш-ш-к. У хебрејском првог стиха те главе исти поступак претвара Касдим, Халдејце, у Лев-Камај, што преводи дају као израз."
    - "Зашто је шифра употребљена, не зна се; до времена пророштва против Вавилона није било шта да се крије, и можда је то учена игра пре него прикривање. Грчки превод Јеремије нема речи о цару Сисаха у 25. глави, и неки то узимају за каснији додатак. Пошто је Сисах Вавилон, карта га приказује у Вавилону, чије рушевине леже на Еуфрату јужно од Багдада близу Хиле у Ираку."
