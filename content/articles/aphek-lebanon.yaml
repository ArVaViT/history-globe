# Overview article (ADR 0007). Mainstream facts only; the Aphek of Joshua 13:4 on the northern frontier, often taken to be Afqa above Byblos (Ewing: the Aphik of Asher); not the Apheks of the Sharon or the Golan.
id: aphek-lebanon
place: a4cf129
