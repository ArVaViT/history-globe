body:
  en:
    - "This Aphek marks the northern edge of the land still to be taken at the end of Joshua's conquests: “all the land of the Canaanites, and Mearah that is beside the Sidonians, unto Aphek, to the borders of the Amorites”, followed by “the land of the Giblites, and all Lebanon”, that is, the country of Gebal, the Greek Byblos. It is often identified with Afqa, a village high in the Lebanon mountains some 20 km from Byblos, at the great cave from which the Nahr Ibrahim, the ancient river Adonis, springs. W. Ewing, in the International Standard Bible Encyclopedia, takes it to be the Aphik of Asher and allows that it may be Afqa, though Afqa lies farther north than one would expect. It is not the Aphek of the Sharon or that of the Golan."
    - "In Greek and Roman times the place was Aphaca, a sanctuary of Aphrodite. Lucian tells how every year the river Adonis ran red, and the people of Byblos said it was the blood of the wounded Adonis, while one of them told him it was red earth washed down by the winds; he also went up from Byblos into the Lebanon, a day's journey, to see an ancient temple of Aphrodite founded by Cinyras, usually taken to be the shrine at Afqa. Eusebius records that Constantine ordered the temple at Aphaca on the Lebanon pulled down for its licentious rites. Today Afqa is a village of the Byblos district in Lebanon, below the cave and waterfall at the head of the Nahr Ibrahim."
  ru:
    - "Этот Афек отмечает северный край земли, ещё не взятой к концу завоеваний Иисуса Навина: «вся земля Ханаанская от Меары Сидонской до Афека, до пределов Аморрейских», а за ней «земля Гевла и весь Ливан», то есть страна Гевала, греческого Библа. Его часто отождествляют с Афкой, селением высоко в горах Ливана примерно в 20 км от Библа, у большой пещеры, из которой берёт начало Нахр-Ибрахим, древняя река Адонис. У. Юинг в Международной стандартной библейской энциклопедии считает его Афеком в уделе Асира и допускает, что это может быть Афка, хотя Афка лежит севернее, чем следовало бы ожидать. Это не Афек Саронский и не Афек на Голанах."
    - "В греческое и римское время здесь была Афака, святилище Афродиты. Лукиан рассказывает, что каждый год река Адонис краснела, и жители Библа говорили, что это кровь раненого Адониса, а один из них объяснил ему, что это красная земля, которую сносят ветры; он же поднялся из Библа в Ливан, на день пути, чтобы увидеть древний храм Афродиты, основанный Киниром, — обычно это считают святилищем в Афке. Евсевий сообщает, что Константин велел разрушить храм в Афаке на Ливане за его распутные обряды. Сегодня Афка — селение округа Библ в Ливане, под пещерой и водопадом у истока Нахр-Ибрахима."
  uk:
    - "Цей Афек позначає північний край землі, що лишалася ще не здобутою наприкінці завоювань Ісуса Навина: «уся земля Канаанська від Меари Сидонської до Афека, до гряниць Аморійських», а далі — «земля Гевла, а там увесь Ливан», тобто країна Гевала, грецького Біблоса. Його часто ототожнюють з Афкою, селом високо в горах Лівану приблизно за 20 км від Біблоса, біля великої печери, з якої б'є Нагр-Ібрахім, давня річка Адоніс. В. Юїнг у International Standard Bible Encyclopedia вважає його Афіком Асіра й допускає, що це може бути Афка, хоча Афка лежить північніше, ніж можна було б сподіватися. Це не Афек Шарона й не Афек Голану."
    - "За грецьких і римських часів це місце було Афакою, святилищем Афродіти. Лукіан розповідає, як щороку ріка Адоніс червоніла, і мешканці Біблоса казали, що це кров пораненого Адоніса, а один з них сказав йому, що то червона земля, змита вітрами; він також піднявся з Біблоса в Ліван, на день дороги, щоб побачити давній храм Афродіти, заснований Кінірою, який зазвичай вважають святинею в Афці. Євсевій повідомляє, що Костянтин наказав знести храм в Афаці на Лівані за розпусні обряди. Нині Афка — село району Біблос у Лівані, нижче від печери та водоспаду у витоку Нагр-Ібрахім."
  es:
    - "Este Afec marca el límite septentrional de la tierra que aún quedaba por conquistar al final de las conquistas de Josué: «toda la tierra de los Cananeos, y Mehara que es de los Sidonios, hasta Aphec, hasta el término del Amorrheo», seguido de «la tierra de los Gibleos, y todo el Líbano», es decir, el país de Gebal, la Biblos griega. A menudo se identifica con Afqa, una aldea en lo alto de las montañas del Líbano, a unos 20 km de Biblos, junto a la gran cueva de la que brota el Nahr Ibrahim, el antiguo río Adonis. W. Ewing, en la International Standard Bible Encyclopedia, lo toma por el Afec de Aser y admite que pueda ser Afqa, aunque Afqa queda más al norte de lo que cabría esperar. No es el Afec del Sarón ni el del Golán."
    - "En época griega y romana el lugar fue Áfaca, un santuario de Afrodita. Luciano cuenta que cada año el río Adonis corría rojo, y que los de Biblos decían que era la sangre del herido Adonis, mientras uno de ellos le dijo que era tierra roja arrastrada por los vientos; también subió de Biblos al Líbano, a un día de camino, para ver un antiguo templo de Afrodita fundado por Cíniras, que suele tomarse por el santuario de Afqa. Eusebio refiere que Constantino ordenó derribar el templo de Áfaca, en el Líbano, por sus ritos licenciosos. Hoy Afqa es una aldea del distrito de Biblos, en el Líbano, bajo la cueva y la cascada de la cabecera del Nahr Ibrahim."
  pt:
    - "Esta Afeque marca o limite norte da terra ainda por tomar ao fim das conquistas de Josué: “toda a terra dos cananeus, e Meara, que pertence aos sidônios, até Afeque, até a fronteira dos amorreus”, seguida de “a terra dos gebalitas, e todo o Líbano”, isto é, o país de Gebal, a Biblos grega. É muitas vezes identificada com Afqa, uma aldeia no alto das montanhas do Líbano, a cerca de 20 km de Biblos, junto à grande caverna de onde nasce o Nahr Ibrahim, o antigo rio Adônis. W. Ewing, na International Standard Bible Encyclopedia, entende que seja a Afeque de Aser e admite que possa ser Afqa, embora Afqa fique mais ao norte do que se esperaria. Não é a Afeque de Sarom nem a do Golã."
    - "Nos tempos grego e romano o lugar era Afaca, um santuário de Afrodite. Luciano conta como todo ano o rio Adônis corria vermelho, e o povo de Biblos dizia que era o sangue do ferido Adônis, enquanto um deles lhe disse que era terra vermelha arrastada pelos ventos; ele também subiu de Biblos ao Líbano, uma jornada de um dia, para ver um antigo templo de Afrodite fundado por Cíniras, em geral tomado pelo santuário de Afqa. Eusébio registra que Constantino mandou derrubar o templo de Afaca, no Líbano, por seus ritos licenciosos. Hoje Afqa é uma aldeia do distrito de Biblos, no Líbano, abaixo da caverna e da cachoeira na cabeceira do Nahr Ibrahim."
  de:
    - "Dieses Afek bezeichnet den Nordrand des Landes, das am Ende von Josuas Eroberungen noch einzunehmen war: „das ganze Land der Kanaaniter und Meara der Sidonier bis gen Aphek, bis an die Grenze der Amoriter“; darauf folgt „das Land der Gebaliter und der ganze Libanon“, das heißt das Land Gebal, das griechische Byblos. Es wird oft mit Afqa gleichgesetzt, einem Dorf hoch im Libanongebirge etwa 20 km von Byblos, an der großen Höhle, aus der der Nahr Ibrahim, der antike Fluss Adonis, entspringt. W. Ewing hält es in der International Standard Bible Encyclopedia für das Afek Assers und räumt ein, dass es Afqa sein könnte, obwohl Afqa weiter nördlich liegt, als man erwarten würde. Es ist nicht das Afek der Scharonebene oder das des Golan."
    - "In griechischer und römischer Zeit hieß der Ort Aphaka, ein Heiligtum der Aphrodite. Lukian erzählt, wie der Fluss Adonis jedes Jahr rot floss und die Leute von Byblos sagten, es sei das Blut des verwundeten Adonis, während einer von ihnen ihm sagte, es sei rote Erde, die vom Wind hineingeweht werde; er ging auch von Byblos eine Tagesreise hinauf in den Libanon, um einen alten Tempel der Aphrodite zu sehen, von Kinyras gegründet, gewöhnlich für das Heiligtum von Afqa gehalten. Eusebius berichtet, Konstantin habe den Tempel von Aphaka im Libanon wegen seiner ausschweifenden Riten niederreißen lassen. Heute ist Afqa ein Dorf im Bezirk Byblos im Libanon, unterhalb der Höhle und des Wasserfalls am Ursprung des Nahr Ibrahim."
  fr:
    - "Cet Aphek marque la limite nord du pays restant à conquérir à la fin des conquêtes de Josué : « tout le pays des Cananéens, et Meara qui est aux Sidoniens, jusqu’à Aphek, jusqu’à la frontière des Amoréens », puis « le pays des Guibliens, et tout le Liban », c’est-à-dire le pays de Guebal, le Byblos des Grecs. On l’identifie souvent à Afqa, village haut perché dans les montagnes du Liban, à quelque 20 km de Byblos, près de la grande grotte d’où jaillit le Nahr Ibrahim, l’ancien fleuve Adonis. W. Ewing, dans l’International Standard Bible Encyclopedia, y voit l’Aphik d’Aser et admet qu’il puisse s’agir d’Afqa, bien qu’Afqa se trouve plus au nord qu’on ne l’attendrait. Ce n’est ni l’Aphek du Saron, ni celui du Golan."
    - "À l’époque grecque et romaine, le lieu était Aphaca, un sanctuaire d’Aphrodite. Lucien raconte que chaque année le fleuve Adonis rougissait, que les habitants de Byblos disaient que c’était le sang d’Adonis blessé, tandis que l’un d’eux lui assura que c’était de la terre rouge entraînée par les vents ; il monta aussi de Byblos au Liban, à une journée de route, pour voir un temple antique d’Aphrodite fondé par Cinyras, que l’on tient d’ordinaire pour le sanctuaire d’Afqa. Eusèbe rapporte que Constantin ordonna de raser le temple d’Aphaca, sur le Liban, à cause de ses rites licencieux. Aujourd’hui, Afqa est un village du district de Byblos, au Liban, en contrebas de la grotte et de la cascade qui marquent la source du Nahr Ibrahim."
  it:
    - "Questa Afek segna il limite settentrionale del paese ancora da prendere alla fine delle conquiste di Giosuè: «tutto il paese dei Cananei, e Meara che è dei Sidoni, sino ad Afek, sino al confine degli Amorei», seguito da «il paese dei Ghibliti e tutto il Libano», cioè il paese di Ghebal, la Biblo dei Greci. È spesso identificata con Afqa, un villaggio in alto sui monti del Libano a una ventina di chilometri da Biblo, presso la grande grotta da cui sgorga il Nahr Ibrahim, l’antico fiume Adone. W. Ewing, nella International Standard Bible Encyclopedia, la ritiene l’Afik di Aser e ammette che possa essere Afqa, benché Afqa si trovi più a nord di quanto ci si aspetterebbe. Non è l’Afek del Saròn né quella del Golan."
    - "In epoca greca e romana il luogo era Afaca, un santuario di Afrodite. Luciano racconta che ogni anno il fiume Adone si faceva rosso, e la gente di Biblo diceva che era il sangue di Adone ferito, mentre uno di loro gli disse che era terra rossa portata giù dai venti; salì anche da Biblo sul Libano, un giorno di cammino, per vedere un antico tempio di Afrodite fondato da Cinira, di solito ritenuto il santuario di Afqa. Eusebio riferisce che Costantino ordinò di abbattere il tempio di Afaca sul Libano per i suoi riti licenziosi. Oggi Afqa è un villaggio del distretto di Biblo, in Libano, sotto la grotta e la cascata alla sorgente del Nahr Ibrahim."
  nl:
    - "Dit Afek markeert de noordrand van het land dat aan het einde van Jozua's veroveringen nog moest worden ingenomen: “het ganse land der Kanaänieten, en Meara, die van de Sidoniers is, tot Afek toe, tot aan de landpale der Amorieten”, gevolgd door “het land der Giblieten, en de ganse Libanon”, dat wil zeggen het land van Gebal, het Griekse Byblos. Het wordt vaak vereenzelvigd met Afqa, een dorp hoog in het Libanongebergte op ongeveer 20 km van Byblos, bij de grote grot waaruit de Nahr Ibrahim, de antieke rivier Adonis, ontspringt. W. Ewing houdt het in de International Standard Bible Encyclopedia voor het Afik van Aser en acht het mogelijk dat het Afqa is, al ligt Afqa noordelijker dan men zou verwachten. Het is niet het Afek van de Saron of dat van de Golan."
    - "In Griekse en Romeinse tijd was de plaats Aphaca, een heiligdom van Aphrodite. Lucianus vertelt hoe de rivier Adonis elk jaar rood stroomde, en de mensen van Byblos zeiden dat het het bloed van de gewonde Adonis was, terwijl een van hen hem vertelde dat het rode aarde was die door de winden werd meegevoerd; ook ging hij van Byblos de Libanon op, een dagreis, om een oude tempel van Aphrodite te zien die door Cinyras was gesticht, gewoonlijk opgevat als het heiligdom bij Afqa. Eusebius meldt dat Constantijn beval de tempel te Aphaca op de Libanon te slopen vanwege de ontuchtige riten. Tegenwoordig is Afqa een dorp in het district Byblos in Libanon, onder de grot en de waterval aan de oorsprong van de Nahr Ibrahim."
  pl:
    - "Ten Afek wyznacza północny skraj ziemi, którą jeszcze trzeba było zająć pod koniec podbojów Jozuego: „wszystka ziemia Chananejska, i Mara, które jest Sydończyków aż do Afeka, i aż do granicy Amorejczyka”, a następnie „ziemia Giblitów ze wszystkim Libanem”, czyli kraj Gebal, greckiego Byblos. Utożsamia się go często z Afką, wsią wysoko w górach Libanu, około 20 km od Byblos, przy wielkiej jaskini, z której wypływa Nahr Ibrahim, starożytna rzeka Adonis. W. Ewing w International Standard Bible Encyclopedia uważa go za Afik z ziemi Aszera i dopuszcza, że może to być Afka, choć Afka leży dalej na północ, niż można by oczekiwać. To nie jest Afek na równinie Szaron ani ten na Golanie."
    - "W czasach greckich i rzymskich miejsce to nazywało się Afaka i było sanktuarium Afrodyty. Lukian opowiada, że co roku rzeka Adonis czerwieniła się i mieszkańcy Byblos mówili, że to krew rannego Adonisa, podczas gdy jeden z nich powiedział mu, że to czerwona ziemia spłukiwana wiatrami; wspiął się też z Byblos w góry Libanu, o dzień drogi, by zobaczyć starożytną świątynię Afrodyty założoną przez Kinyrasa, zwykle uważaną za sanktuarium w Afce. Euzebiusz zapisuje, że Konstantyn kazał zburzyć świątynię w Aface na Libanie z powodu rozpustnych obrzędów. Dziś Afka jest wsią w dystrykcie Byblos w Libanie, poniżej jaskini i wodospadu u źródeł Nahr Ibrahim."
  cs:
    - "Tento Afek vyznačuje severní okraj země, která měla být ještě dobyta na konci Jozueho výbojů: „všecka země Kananejská a Mára, kteréž jest Sidonských až do Afeka, a až ku pomezí Amorejského“, a dále „země Giblická, a všecken Libán“, to jest země Gebalu, řecky Býblu. Často se ztotožňuje s Afkou, vesnicí vysoko v libanonských horách asi 20 km od Býblu, u velké jeskyně, z níž vyvěrá Nahr Ibrahím, starověká řeka Adónis. W. Ewing v International Standard Bible Encyclopedia ho pokládá za Afek Ašerův a připouští, že jím může být Afka, ačkoli Afka leží dále na sever, než by se očekávalo. Není to Afek v Šaronu ani ten na Golanu."
    - "V řecké a římské době bylo místo Afaka, svatyně Afrodity. Lúkianos vypráví, že řeka Adónis každý rok zčervenala a obyvatelé Býblu říkali, že je to krev raněného Adónida, zatímco jeden z nich mu řekl, že je to červená hlína splavená větry; také vystoupil z Býblu do Libanonu, den cesty, aby uviděl starobylý chrám Afrodity, který založil Kinyras a který se obvykle pokládá za svatyni v Afce. Eusebius zaznamenává, že Konstantin nařídil strhnout chrám v Aface na Libanonu pro necudné obřady. Dnes je Afka vesnicí okresu Býblos v Libanonu, pod jeskyní a vodopádem u pramene Nahr Ibrahím."
  sv:
    - "Detta Afek markerar nordgränsen för det land som ännu återstod att inta vid slutet av Josuas erövringar: ”hela kananéernas land söderut, vidare Meara, som tillhör sidonierna, ända till Afek, ända till amoréernas område”, följt av ”gebaléernas land samt hela Libanonstrakten österut”, det vill säga Gebals land, grekernas Byblos. Det identifieras ofta med Afqa, en by högt uppe i Libanonbergen omkring 20 km från Byblos, vid den stora grotta ur vilken Nahr Ibrahim, den antika floden Adonis, rinner. W. Ewing tar det i International Standard Bible Encyclopedia för Ashers Afik och medger att det kan vara Afqa, fastän Afqa ligger längre norrut än man skulle vänta. Det är inte Afek i Saron eller det på Golan."
    - "Under grekisk och romersk tid var platsen Aphaca, en helgedom för Afrodite. Lukianos berättar hur floden Adonis varje år rann röd, och byblosborna sade att det var den sårade Adonis’ blod, medan en av dem sade honom att det var röd jord som vindarna svepte ned; han gick också upp från Byblos till Libanon, en dagsresa, för att se ett uråldrigt Afroditetempel grundat av Kinyras, vanligen antaget vara helgedomen vid Afqa. Eusebios berättar att Konstantin lät riva templet i Aphaca på Libanon för dess utsvävande riter. I dag är Afqa en by i Byblos distrikt i Libanon, nedanför grottan och vattenfallet vid Nahr Ibrahims källa."
  nb:
    - "Denne Afek markerer nordkanten av landet som ennå gjensto å innta ved slutten av Josvas erobringer: «hele kana'anittenes land, og Meara, som hører sidonierne til, like til Afek, til amorittenes landemerke», fulgt av «giblittenes land og hele Libanon», det vil si landet Gebal, det greske Byblos. Den identifiseres ofte med Afqa, en landsby høyt oppe i Libanon-fjellene omtrent 20 km fra Byblos, ved den store grotten som Nahr Ibrahim, den gamle elven Adonis, springer ut av. W. Ewing i International Standard Bible Encyclopedia mener at den er Afik i Asjer og at den kan være Afqa, selv om Afqa ligger lenger nord enn man skulle vente. Den er ikke Afek i Sjaron eller den på Golan."
    - "I gresk og romersk tid var stedet Afaka, en helligdom for Afrodite. Lukian forteller at elven Adonis hvert år rant rød, og at folket i Byblos sa at det var blodet fra den sårede Adonis, mens en av dem fortalte ham at det var rød jord vasket ned av vindene; han dro også opp fra Byblos til Libanon, en dagsreise, for å se et gammelt tempel for Afrodite grunnlagt av Kinyras, vanligvis regnet som helligdommen ved Afqa. Eusebius forteller at Konstantin lot templet ved Afaka i Libanon rive på grunn av de utsvevende ritualene. I dag er Afqa en landsby i Byblos-distriktet i Libanon, under grotten og fossen ved kilden til Nahr Ibrahim."
  tl:
    - "Ang Aphec na ito ay nagmamarka ng hilagang gilid ng lupaing hindi pa nasasakop sa dulo ng mga pananakop ni Josue: “ang lahat na lupain ng mga Cananeo, at ang Mehara, na nauukol sa mga Sidonio hanggang sa Aphec, na hangganan ng mga Amorrheo”, kasunod ang “lupain ng mga Gebalita at ang buong Libano”, ibig sabihin, ang bansa ng Gebal, ang Byblos ng mga Griyego. Madalas itong itumbas sa Afqa, isang nayon na mataas sa mga bundok ng Libano mga 20 km mula sa Byblos, sa malaking yungib na pinagmumulan ng Nahr Ibrahim, ang sinaunang ilog na Adonis. Itinuturing ito ni W. Ewing, sa International Standard Bible Encyclopedia, na Aphec ng Aser at inaamin na maaaring Afqa ito, bagaman mas hilaga ang Afqa kaysa inaasahan. Hindi ito ang Aphec ng Saron o ng Golan."
    - "Noong panahong Griyego at Romano, ang lugar ay Aphaca, isang santuwaryo ni Afrodita. Isinasalaysay ni Luciano na bawat taon ay namumula ang ilog Adonis, at sinabi ng mga taga-Byblos na dugo ito ng sugatang Adonis, samantalang sinabi ng isa sa kanila na pulang lupa itong hinugasan ng hangin; umakyat din siya mula sa Byblos sa Libano, isang araw na paglalakbay, upang makita ang isang sinaunang templo ni Afrodita na itinatag ni Cinyras, na karaniwang itinuturing na dambana sa Afqa. Itinatala ni Eusebio na iniutos ni Constantino na ibagsak ang templo sa Aphaca sa Libano dahil sa mahalay na mga ritwal. Ang Afqa ngayon ay nayon ng distrito ng Byblos sa Libano, sa ibaba ng yungib at talon sa pinagmumulan ng Nahr Ibrahim."
  da:
    - "Dette Afek markerer nordgrænsen af det land, der stadig skulle indtages ved slutningen af Josvas erobringer: »mod Sønden alt Kananiternes Land og Meara, som hører Zidonierne til, indtil Afek, indtil Amoriternes Landemærke«, efterfulgt af »Gibliternes Land og det hele Libanon«, det vil sige Gebals land, det græske Byblos. Det identificeres ofte med Afqa, en landsby højt oppe i Libanonbjergene omkring 20 km fra Byblos, ved den store hule, hvorfra Nahr Ibrahim, den gamle flod Adonis, udspringer. W. Ewing tager det i International Standard Bible Encyclopedia for at være Afik i Aser og indrømmer, at det kan være Afqa, selv om Afqa ligger længere mod nord, end man skulle vente. Det er ikke Afek i Saron eller Afek på Golan."
    - "I græsk og romersk tid var stedet Afaka, en helligdom for Afrodite. Lukian fortæller, hvordan floden Adonis hvert år løb rød, og byblitterne sagde, at det var den sårede Adonis' blod, mens en af dem fortalte ham, at det var rød jord, vinden skyllede ned; han gik også op fra Byblos ind i Libanon, en dagsrejse, for at se et gammelt tempel for Afrodite grundlagt af Kinyras, sædvanligvis taget for helligdommen i Afqa. Eusebios beretter, at Konstantin lod templet i Afaka på Libanon rive ned på grund af dets utugtige ritualer. I dag er Afqa en landsby i Byblos-distriktet i Libanon, under hulen og vandfaldet ved Nahr Ibrahims udspring."
  sr:
    - "Овај Афек означава северни руб земље која је још остајала да се заузме на крају Исусових освајања: „сва земља хананејска и Меара, што припада Сидонцима до Афека, до међе аморејске“, а затим „земља гивлејска и сав Ливан“, то јест земља Гевала, грчког Библа. Често се поистовећује са Афком, селом високо у ливанским планинама око 20 км од Библа, код велике пећине из које извире Нахр Ибрахим, древна река Адонис. В. Јуинг у International Standard Bible Encyclopedia узима да је то Афик Асиров и допушта да би могла бити Афка, мада Афка лежи северније него што би се очекивало. То није Афек у Сарону ни онај на Голану."
    - "У грчко и римско доба место је било Афака, светилиште Афродите. Лукијан прича како је сваке године река Адонис поцрвенела, а становници Библа говорили су да је то крв рањеног Адониса, док му је један од њих рекао да је то црвена земља коју ветрови спирају; он се такође попео из Библа у Ливан, на дан хода, да види древни храм Афродите који је основао Кинира, обично узет за светилиште у Афки. Јевсевије бележи да је Константин наредио да се руши храм у Афаци на Ливану због разузданих обреда. Данас је Афка село у округу Библ у Ливану, испод пећине и водопада на врелу Нахр Ибрахима."
  hu:
    - "Ez az Áfek Józsué hódításai végén a még birtokba veendő föld északi szélét jelöli: „a Kananeusnak egész földe és Meára, a mely a Sídonbelieké, Afékáig, az Emoreusok határáig”, amelyet „a Gibli földe és az egész Libanon” követ, vagyis Gebal, a görög Büblosz országa. Gyakran azonosítják Afqával, a Libanon-hegység magasában fekvő faluval, Büblosztól mintegy 20 km-re, annál a nagy barlangnál, amelyből a Nahr Ibrahim, az ókori Adónisz folyó ered. W. Ewing az International Standard Bible Encyclopediában Áser Áfikjának tartja, és megengedi, hogy az Afqa lehet, bár Afqa északabbra fekszik, mint várnánk. Nem azonos a Sáron vagy a Gólán Áfekjével."
    - "A görög és római korban a hely Aphaka volt, Aphrodité szentélye. Lukianosz elmondja, hogy az Adónisz folyó évente vörösre színeződött, a büblosziak pedig azt mondták, hogy a megsebzett Adónisz vére; egyikük azonban azt mondta neki, hogy a szelek által lemosott vörös föld; ő maga is felment Büblosztól a Libanonra, egy napi járóföldre, hogy megnézze Aphrodité ősi templomát, amelyet Kinürasz alapított, és amelyet általában az afqai szentéllyel azonosítanak. Euszébiosz feljegyzi, hogy Konstantin parancsot adott a Libanonon álló aphakai templom lebontására erkölcstelen szertartásai miatt. Ma Afqa falu Libanon Büblosz kerületében, a Nahr Ibrahim forrásánál lévő barlang és vízesés alatt."
  fi:
    - "Tämä Afek merkitsee vielä valloittamatta olevan maan pohjoisreunaa Joosuan valloitusten lopussa: ”koko kanaanilaisten maa ja Meara, joka on siidonilaisten, Afekiin saakka, amorilaisten alueeseen saakka”, jota seuraa ”gebalilaisten maa ja koko Libanon”, siis Gebalin, kreikkalaisen Byblosin, maa. Se samaistetaan usein Afqaan, kylään korkealla Libanonin vuorilla noin 20 km Byblosista, suuren luolan luona, josta Nahr Ibrahim, muinainen Adonis-joki, saa alkunsa. W. Ewing pitää International Standard Bible Encyclopediassa sitä Asserin Afikina ja sallii sen voivan olla Afqa, vaikka Afqa sijaitsee pohjoisempana kuin voisi odottaa. Se ei ole Saronin eikä Golanin Afek."
    - "Kreikkalaisella ja roomalaisella ajalla paikka oli Aphaca, Afroditen pyhäkkö. Lukianos kertoo, kuinka Adonis-joki juoksi joka vuosi punaisena, ja Byblosin asukkaat sanoivat sen olevan haavoittuneen Adoniin verta, kun taas yksi heistä sanoi hänelle sen olevan tuulten huuhtomaa punaista multaa; hän nousi myös Byblosista Libanonille, päivämatkan, nähdäkseen Kinyraksen perustaman muinaisen Afroditen temppelin, jota yleensä pidetään Afqan pyhäkkönä. Eusebios kertoo, että Konstantinus määräsi Libanonin Aphacan temppelin revittäväksi sen irstaiden menojen vuoksi. Nykyisin Afqa on kylä Libanonin Byblosin piirikunnassa luolan ja putouksen alapuolella Nahr Ibrahimin latvoilla."
  vi:
    - "A-phéc này đánh dấu rìa phía bắc của vùng đất còn phải chiếm vào cuối các cuộc chinh phục của Giô-suê: “cả xứ Ca-na-an và Mê-a-ra, vốn thuộc về dân Si-đôn, cho đến A-phéc, cho đến giới hạn dân A-mô-rít; còn luôn xứ dân Ghi-bê-lít, và cả Li-ban”, tức là xứ Ghê-banh, Byblos của người Hy Lạp. Nó thường được đồng nhất với Afqa, một làng trên cao trong dãy núi Li-ban cách Byblos khoảng 20 km, tại hang lớn nơi sông Nahr Ibrahim, sông Adonis thời cổ, phun ra. W. Ewing, trong International Standard Bible Encyclopedia, cho nó là Aphik của A-se và cho rằng có thể là Afqa, dù Afqa nằm xa về phía bắc hơn người ta chờ đợi. Nó không phải A-phéc của Sa-rôn hay của Gô-lan."
    - "Vào thời Hy Lạp và La Mã, nơi này là Aphaca, một đền thờ của Aphrodite. Lucian kể rằng mỗi năm sông Adonis chảy đỏ, và người Byblos nói đó là máu của Adonis bị thương, trong khi một người trong số họ bảo ông rằng đó là đất đỏ bị gió cuốn xuống; ông cũng đi từ Byblos lên Li-ban, một ngày đường, để xem một đền thờ cổ của Aphrodite do Cinyras lập, thường được cho là thánh địa ở Afqa. Eusebius ghi lại rằng Constantinus ra lệnh phá đền ở Aphaca trên Li-ban vì các nghi lễ dâm loạn của nó. Ngày nay Afqa là một làng thuộc quận Byblos ở Li-ban, bên dưới hang và thác nước ở đầu nguồn Nahr Ibrahim."
  ro:
    - "Acest Afec marchează marginea de nord a țării care mai rămăsese de cucerit la sfârșitul cuceririlor lui Iosua: „tot pământul Hanaan împreajma Gazei, și Sidonenii până la Afec, până la hotarele Amoreilor”, urmat de țara ghibliților și tot Libanul, adică ținutul Ghebal, Biblosul grecilor. Este identificat adesea cu Afqa, un sat din înaltul munților Libanului, la aproximativ 20 km de Biblos, la marea peșteră din care izvorăște Nahr Ibrahim, vechiul râu Adonis. W. Ewing, în International Standard Bible Encyclopedia, îl socotește Afikul lui Așer și admite că ar putea fi Afqa, deși Afqa se află mai la nord decât ne-am aștepta. Nu este Afecul din Șaron și nici cel din Golan."
    - "În vremea greacă și romană, locul era Aphaca, un sanctuar al Afroditei. Lucian povestește că în fiecare an râul Adonis curgea roșu, iar locuitorii Biblosului spuneau că este sângele rănitului Adonis, în timp ce unul dintre ei i-a spus că este pământ roșu spălat de vânturi; el a urcat de la Biblos în Liban, la o zi de drum, ca să vadă un templu străvechi al Afroditei întemeiat de Cinyras, socotit de obicei sanctuarul de la Afqa. Eusebiu consemnează că Constantin a poruncit să fie dărâmat templul de la Aphaca din Liban pentru riturile lui destrăbălate. Astăzi Afqa este un sat din districtul Biblos, în Liban, sub peștera și cascada de la izvoarele Nahr Ibrahim."
  bg:
    - "Този Афек бележи северния край на земята, която още предстои да бъде превзета в края на завоеванията на Иисус Навин: „всичката земя на Ханаанците, и Меара, която е на Сидонците до Афек, до Аморейските предели“, следвана от „земята на Гевалците, и всичкий Ливан“, тоест страната на Гевал, гръцкия Библ. Често се отъждествява с Афка — село високо в ливанските планини, на около 20 км от Библ, при голямата пещера, от която извира Нахр Ибрахим, древната река Адонис. У. Юинг в „International Standard Bible Encyclopedia“ го смята за Афик на Асир и допуска, че може да е Афка, макар Афка да лежи по-на север, отколкото би се очаквало. Той не е нито Афек от Сарон, нито този от Голан."
    - "В гръцко и римско време мястото било Афака, светилище на Афродита. Лукиан разказва как всяка година реката Адонис течала червена и жителите на Библ казвали, че това е кръвта на ранения Адонис, докато един от тях му казал, че е червена пръст, отмита от ветровете; той също се изкачил от Библ в Ливан, на един ден път, за да види древен храм на Афродита, основан от Кинир, обикновено смятан за светилището в Афка. Евсевий записва, че Константин наредил храмът в Афака на Ливан да бъде съборен заради разпуснатите му обреди. Днес Афка е село в района на Библ в Ливан, под пещерата и водопада в началото на Нахр Ибрахим."
scripture:
  - Josh.13.4
  - Josh.13.5
