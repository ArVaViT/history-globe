body:
  en:
    - "This Aphek marks the northern edge of the land still to be taken at the end of Joshua's conquests: “all the land of the Canaanites, and Mearah that is beside the Sidonians, unto Aphek, to the borders of the Amorites”, followed by “the land of the Giblites, and all Lebanon”, that is, the country of Gebal, the Greek Byblos. It is often identified with Afqa, a village high in the Lebanon mountains some 20 km from Byblos, at the great cave from which the Nahr Ibrahim, the ancient river Adonis, springs. W. Ewing, in the International Standard Bible Encyclopedia, takes it to be the Aphik of Asher instead and finds Afqa farther north than one would expect. It is not the Aphek of the Sharon or that of the Golan."
    - "In Greek and Roman times the place was Aphaca, a sanctuary of Aphrodite. Lucian tells how every year the river Adonis ran red, and the people of Byblos said it was the blood of the wounded Adonis, while one of them told him it was red earth washed down by the winds; he also went up from Byblos into the Lebanon, a day's journey, to see an ancient temple of Aphrodite founded by Cinyras, usually taken to be the shrine at Afqa. Eusebius records that Constantine ordered the temple at Aphaca on the Lebanon pulled down for its licentious rites. Today Afqa is a village of the Byblos district in Lebanon, below the cave and waterfall at the head of the Nahr Ibrahim."
  ru:
    - "Этот Афек отмечает северный край земли, ещё не взятой к концу завоеваний Иисуса Навина: «вся земля Ханаанская от Меары Сидонской до Афека, до пределов Аморрейских», а за ней «земля Гевла и весь Ливан», то есть страна Гевала, греческого Библа. Его часто отождествляют с Афкой, селением высоко в горах Ливана примерно в 20 км от Библа, у большой пещеры, из которой берёт начало Нахр-Ибрахим, древняя река Адонис. У. Юинг в Международной стандартной библейской энциклопедии считает его, напротив, Афеком в уделе Асира, а Афку находит слишком северной. Это не Афек Саронский и не Афек на Голанах."
    - "В греческое и римское время здесь была Афака, святилище Афродиты. Лукиан рассказывает, что каждый год река Адонис краснела, и жители Библа говорили, что это кровь раненого Адониса, а один из них объяснил ему, что это красная земля, которую сносят ветры; он же поднялся из Библа в Ливан, на день пути, чтобы увидеть древний храм Афродиты, основанный Киниром, — обычно это считают святилищем в Афке. Евсевий сообщает, что Константин велел разрушить храм в Афаке на Ливане за его распутные обряды. Сегодня Афка — селение округа Библ в Ливане, под пещерой и водопадом у истока Нахр-Ибрахима."
  uk:
    - "Цей Афек позначає північний край землі, що лишалася ще не здобутою наприкінці завоювань Ісуса Навина: «уся земля Канаанська від Меари Сидонської до Афека, до гряниць Аморійських», а далі — «земля Гевла, а там увесь Ливан», тобто країна Гевала, грецького Біблоса. Його часто ототожнюють з Афкою, селом високо в горах Лівану приблизно за 20 км від Біблоса, біля великої печери, з якої б'є Нагр-Ібрахім, давня річка Адоніс. В. Юїнг у International Standard Bible Encyclopedia натомість вважає його Афіком Асіра й знаходить Афку північнішою, ніж можна було б сподіватися. Це не Афек Шарона й не Афек Голану."
    - "За грецьких і римських часів це місце було Афакою, святилищем Афродіти. Лукіан розповідає, як щороку ріка Адоніс червоніла, і мешканці Біблоса казали, що це кров пораненого Адоніса, а один з них сказав йому, що то червона земля, змита вітрами; він також піднявся з Біблоса в Ліван, на день дороги, щоб побачити давній храм Афродіти, заснований Кінірою, який зазвичай вважають святинею в Афці. Євсевій повідомляє, що Костянтин наказав знести храм в Афаці на Лівані за розпусні обряди. Нині Афка — село району Біблос у Лівані, нижче від печери та водоспаду у витоку Нагр-Ібрахім."
  es:
    - "Este Afec marca el límite septentrional de la tierra que aún quedaba por conquistar al final de las conquistas de Josué: «toda la tierra de los Cananeos, y Mehara que es de los Sidonios, hasta Aphec, hasta el término del Amorrheo», seguido de «la tierra de los Gibleos, y todo el Líbano», es decir, el país de Gebal, la Biblos griega. A menudo se identifica con Afqa, una aldea en lo alto de las montañas del Líbano, a unos 20 km de Biblos, junto a la gran cueva de la que brota el Nahr Ibrahim, el antiguo río Adonis. W. Ewing, en la International Standard Bible Encyclopedia, lo toma en cambio por el Afec de Aser y halla Afqa más al norte de lo que cabría esperar. No es el Afec del Sarón ni el del Golán."
    - "En época griega y romana el lugar fue Áfaca, un santuario de Afrodita. Luciano cuenta que cada año el río Adonis corría rojo, y que los de Biblos decían que era la sangre del herido Adonis, mientras uno de ellos le dijo que era tierra roja arrastrada por los vientos; también subió de Biblos al Líbano, a un día de camino, para ver un antiguo templo de Afrodita fundado por Cíniras, que suele tomarse por el santuario de Afqa. Eusebio refiere que Constantino ordenó derribar el templo de Áfaca, en el Líbano, por sus ritos licenciosos. Hoy Afqa es una aldea del distrito de Biblos, en el Líbano, bajo la cueva y la cascada de la cabecera del Nahr Ibrahim."
  pt:
    - "Esta Afeque marca o limite norte da terra ainda por tomar ao fim das conquistas de Josué: “toda a terra dos cananeus, e Meara, que pertence aos sidônios, até Afeque, até a fronteira dos amorreus”, seguida de “a terra dos gebalitas, e todo o Líbano”, isto é, o país de Gebal, a Biblos grega. É muitas vezes identificada com Afqa, uma aldeia no alto das montanhas do Líbano, a cerca de 20 km de Biblos, junto à grande caverna de onde nasce o Nahr Ibrahim, o antigo rio Adônis. W. Ewing, na International Standard Bible Encyclopedia, entende que seja antes a Afeque de Aser e acha Afqa mais ao norte do que se esperaria. Não é a Afeque de Sarom nem a do Golã."
    - "Nos tempos grego e romano o lugar era Afaca, um santuário de Afrodite. Luciano conta como todo ano o rio Adônis corria vermelho, e o povo de Biblos dizia que era o sangue do ferido Adônis, enquanto um deles lhe disse que era terra vermelha arrastada pelos ventos; ele também subiu de Biblos ao Líbano, uma jornada de um dia, para ver um antigo templo de Afrodite fundado por Cíniras, em geral tomado pelo santuário de Afqa. Eusébio registra que Constantino mandou derrubar o templo de Afaca, no Líbano, por seus ritos licenciosos. Hoje Afqa é uma aldeia do distrito de Biblos, no Líbano, abaixo da caverna e da cachoeira na cabeceira do Nahr Ibrahim."
  de:
    - "Dieses Afek bezeichnet den Nordrand des Landes, das am Ende von Josuas Eroberungen noch einzunehmen war: „das ganze Land der Kanaaniter und Meara der Sidonier bis gen Aphek, bis an die Grenze der Amoriter“; darauf folgt „das Land der Gebaliter und der ganze Libanon“, das heißt das Land Gebal, das griechische Byblos. Es wird oft mit Afqa gleichgesetzt, einem Dorf hoch im Libanongebirge etwa 20 km von Byblos, an der großen Höhle, aus der der Nahr Ibrahim, der antike Fluss Adonis, entspringt. W. Ewing hält es in der International Standard Bible Encyclopedia stattdessen für das Afek Assers und findet Afqa weiter nördlich, als man erwarten würde. Es ist nicht das Afek der Scharonebene oder das des Golan."
    - "In griechischer und römischer Zeit hieß der Ort Aphaka, ein Heiligtum der Aphrodite. Lukian erzählt, wie der Fluss Adonis jedes Jahr rot floss und die Leute von Byblos sagten, es sei das Blut des verwundeten Adonis, während einer von ihnen ihm sagte, es sei rote Erde, die vom Wind hineingeweht werde; er ging auch von Byblos eine Tagesreise hinauf in den Libanon, um einen alten Tempel der Aphrodite zu sehen, von Kinyras gegründet, gewöhnlich für das Heiligtum von Afqa gehalten. Eusebius berichtet, Konstantin habe den Tempel von Aphaka im Libanon wegen seiner ausschweifenden Riten niederreißen lassen. Heute ist Afqa ein Dorf im Bezirk Byblos im Libanon, unterhalb der Höhle und des Wasserfalls am Ursprung des Nahr Ibrahim."
  fr:
    - "Cet Aphek marque la limite nord du pays restant à conquérir à la fin des conquêtes de Josué : « tout le pays des Cananéens, et Meara qui est aux Sidoniens, jusqu’à Aphek, jusqu’à la frontière des Amoréens », puis « le pays des Guibliens, et tout le Liban », c’est-à-dire le pays de Guebal, le Byblos des Grecs. On l’identifie souvent à Afqa, village haut perché dans les montagnes du Liban, à quelque 20 km de Byblos, près de la grande grotte d’où jaillit le Nahr Ibrahim, l’ancien fleuve Adonis. W. Ewing, dans l’International Standard Bible Encyclopedia, y voit plutôt l’Aphik d’Aser et trouve Afqa plus au nord qu’on ne l’attendrait. Ce n’est ni l’Aphek du Saron, ni celui du Golan."
    - "À l’époque grecque et romaine, le lieu était Aphaca, un sanctuaire d’Aphrodite. Lucien raconte que chaque année le fleuve Adonis rougissait, que les habitants de Byblos disaient que c’était le sang d’Adonis blessé, tandis que l’un d’eux lui assura que c’était de la terre rouge entraînée par les vents ; il monta aussi de Byblos au Liban, à une journée de route, pour voir un temple antique d’Aphrodite fondé par Cinyras, que l’on tient d’ordinaire pour le sanctuaire d’Afqa. Eusèbe rapporte que Constantin ordonna de raser le temple d’Aphaca, sur le Liban, à cause de ses rites licencieux. Aujourd’hui, Afqa est un village du district de Byblos, au Liban, en contrebas de la grotte et de la cascade qui marquent la source du Nahr Ibrahim."
  it:
    - "Questa Afek segna il limite settentrionale del paese ancora da prendere alla fine delle conquiste di Giosuè: «tutto il paese dei Cananei, e Meara che è dei Sidoni, sino ad Afek, sino al confine degli Amorei», seguito da «il paese dei Ghibliti e tutto il Libano», cioè il paese di Ghebal, la Biblo dei Greci. È spesso identificata con Afqa, un villaggio in alto sui monti del Libano a una ventina di chilometri da Biblo, presso la grande grotta da cui sgorga il Nahr Ibrahim, l’antico fiume Adone. W. Ewing, nella International Standard Bible Encyclopedia, la ritiene invece l’Afik di Aser e trova Afqa più a nord di quanto ci si aspetterebbe. Non è l’Afek del Saròn né quella del Golan."
    - "In epoca greca e romana il luogo era Afaca, un santuario di Afrodite. Luciano racconta che ogni anno il fiume Adone si faceva rosso, e la gente di Biblo diceva che era il sangue di Adone ferito, mentre uno di loro gli disse che era terra rossa portata giù dai venti; salì anche da Biblo sul Libano, un giorno di cammino, per vedere un antico tempio di Afrodite fondato da Cinira, di solito ritenuto il santuario di Afqa. Eusebio riferisce che Costantino ordinò di abbattere il tempio di Afaca sul Libano per i suoi riti licenziosi. Oggi Afqa è un villaggio del distretto di Biblo, in Libano, sotto la grotta e la cascata alla sorgente del Nahr Ibrahim."
  nl:
    - "Dit Afek markeert de noordrand van het land dat aan het einde van Jozua's veroveringen nog moest worden ingenomen: “het ganse land der Kanaänieten, en Meara, die van de Sidoniers is, tot Afek toe, tot aan de landpale der Amorieten”, gevolgd door “het land der Giblieten, en de ganse Libanon”, dat wil zeggen het land van Gebal, het Griekse Byblos. Het wordt vaak vereenzelvigd met Afqa, een dorp hoog in het Libanongebergte op ongeveer 20 km van Byblos, bij de grote grot waaruit de Nahr Ibrahim, de antieke rivier Adonis, ontspringt. W. Ewing houdt het in de International Standard Bible Encyclopedia in plaats daarvan voor het Afik van Aser en vindt Afqa noordelijker liggen dan men zou verwachten. Het is niet het Afek van de Saron of dat van de Golan."
    - "In Griekse en Romeinse tijd was de plaats Aphaca, een heiligdom van Aphrodite. Lucianus vertelt hoe de rivier Adonis elk jaar rood stroomde, en de mensen van Byblos zeiden dat het het bloed van de gewonde Adonis was, terwijl een van hen hem vertelde dat het rode aarde was die door de winden werd meegevoerd; ook ging hij van Byblos de Libanon op, een dagreis, om een oude tempel van Aphrodite te zien die door Cinyras was gesticht, gewoonlijk opgevat als het heiligdom bij Afqa. Eusebius meldt dat Constantijn beval de tempel te Aphaca op de Libanon te slopen vanwege de ontuchtige riten. Tegenwoordig is Afqa een dorp in het district Byblos in Libanon, onder de grot en de waterval aan de oorsprong van de Nahr Ibrahim."
  pl:
    - "Ten Afek wyznacza północny skraj ziemi, którą jeszcze trzeba było zająć pod koniec podbojów Jozuego: „wszystka ziemia Chananejska, i Mara, które jest Sydończyków aż do Afeka, i aż do granicy Amorejczyka”, a następnie „ziemia Giblitów ze wszystkim Libanem”, czyli kraj Gebal, greckiego Byblos. Utożsamia się go często z Afką, wsią wysoko w górach Libanu, około 20 km od Byblos, przy wielkiej jaskini, z której wypływa Nahr Ibrahim, starożytna rzeka Adonis. W. Ewing w International Standard Bible Encyclopedia uważa go natomiast za Afik z ziemi Aszera i stwierdza, że Afka leży dalej na północ, niż można by oczekiwać. To nie jest Afek na równinie Szaron ani ten na Golanie."
    - "W czasach greckich i rzymskich miejsce to nazywało się Afaka i było sanktuarium Afrodyty. Lukian opowiada, że co roku rzeka Adonis czerwieniła się i mieszkańcy Byblos mówili, że to krew rannego Adonisa, podczas gdy jeden z nich powiedział mu, że to czerwona ziemia spłukiwana wiatrami; wspiął się też z Byblos w góry Libanu, o dzień drogi, by zobaczyć starożytną świątynię Afrodyty założoną przez Kinyrasa, zwykle uważaną za sanktuarium w Afce. Euzebiusz zapisuje, że Konstantyn kazał zburzyć świątynię w Aface na Libanie z powodu rozpustnych obrzędów. Dziś Afka jest wsią w dystrykcie Byblos w Libanie, poniżej jaskini i wodospadu u źródeł Nahr Ibrahim."
  cs:
    - "Tento Afek vyznačuje severní okraj země, která měla být ještě dobyta na konci Jozueho výbojů: „všecka země Kananejská a Mára, kteréž jest Sidonských až do Afeka, a až ku pomezí Amorejského“, a dále „země Giblická, a všecken Libán“, to jest země Gebalu, řecky Býblu. Často se ztotožňuje s Afkou, vesnicí vysoko v libanonských horách asi 20 km od Býblu, u velké jeskyně, z níž vyvěrá Nahr Ibrahím, starověká řeka Adónis. W. Ewing v International Standard Bible Encyclopedia ho naopak pokládá za Afek Ašerův a shledává Afku položenou dále na sever, než by se očekávalo. Není to Afek v Šaronu ani ten na Golanu."
    - "V řecké a římské době bylo místo Afaka, svatyně Afrodity. Lúkianos vypráví, že řeka Adónis každý rok zčervenala a obyvatelé Býblu říkali, že je to krev raněného Adónida, zatímco jeden z nich mu řekl, že je to červená hlína splavená větry; také vystoupil z Býblu do Libanonu, den cesty, aby uviděl starobylý chrám Afrodity, který založil Kinyras a který se obvykle pokládá za svatyni v Afce. Eusebius zaznamenává, že Konstantin nařídil strhnout chrám v Aface na Libanonu pro necudné obřady. Dnes je Afka vesnicí okresu Býblos v Libanonu, pod jeskyní a vodopádem u pramene Nahr Ibrahím."
scripture:
