body:
  en:
    - 'The Euphrates, about 2,800 km long, is the longest river of western Asia. It rises from the Karasu and the Murat in the highlands of eastern Turkey, breaks through the Taurus, crosses the Syrian steppe past Carchemish, Mari and Dura-Europos, and enters the plain of Babylonia, where it flowed past Sippar, Babylon and Ur before joining the Tigris in the Shatt al-Arab above the Persian Gulf. In the Bible it is "the great river, the river Euphrates" or simply "the river", the fourth river of Eden; the Hebrew Perath answers to the Akkadian Purattu.'
    - 'The river bounded the world of the patriarchs and of the promise. Abraham''s fathers "dwelt on the other side of the flood", Jacob crossed it fleeing from Laban, and God promised Abram''s seed the land "from the river of Egypt unto the great river, the river Euphrates", a bound repeated to Moses and Joshua. Solomon is said to have reigned "from the river unto the land of the Philistines", from Tiphsah (Thapsacus), the great crossing, to Gaza. Later the Persian satrapy "beyond the river", Ebir-nari, took its name from the Euphrates, and the letters in Ezra and Nehemiah are addressed to its governors.'
    - 'The Euphrates was the frontier where empires met. Pharaoh Necho marched to it against the Babylonians, and in 605 BC Nebuchadnezzar defeated him at Carchemish "by the river Euphrates", the battle Jeremiah describes, after which the king of Egypt "came not again any more out of his land". Jeremiah hid a girdle "by Euphrates" as a sign against Judah, though some think the Perath meant is the spring of Parah near Anathoth, and his oracle against Babylon was to be sunk in the river with a stone. In Revelation the sixth trumpet looses four angels bound "in the great river Euphrates", and the sixth bowl dries it up for the kings of the east.'
    - "Under Rome the Euphrates divided the empire from Parthia, and Roman garrisons held it at Zeugma and Dura. Today the river is shared by Turkey, Syria and Iraq: the Keban, Karakaya and Atatürk dams in Turkey, the Tabqa dam in Syria and the Haditha dam in Iraq have cut its flow, and the three countries have never agreed together on sharing its water, though some pairs of them have signed accords. The marshes where it meets the Tigris were drained in the 1990s and partly restored after 2003."
  ru:
    - "Евфрат, длиной около 2800 км, — самая длинная река Западной Азии. Он начинается от Карасу и Мурата в нагорьях восточной Турции, прорывается через Тавр, пересекает сирийскую степь мимо Кархемиса, Мари и Дура-Европос и входит в равнину Вавилонии, где протекал мимо Сиппара, Вавилона и Ура, прежде чем слиться с Тигром в Шатт-эль-Араб выше Персидского залива. В Библии земля простирается «до реки великой, реки Евфрата», а часто он просто «река», четвёртая река Едема; еврейское Перат отвечает аккадскому Пуратту."
    - "Река ограничивала мир патриархов и обетования. Отцы Авраама жили «за рекою», Иаков перешёл её, бежав от Лавана, а Бог обещал потомству Аврама землю «от реки Египетской до великой реки, реки Евфрата» — предел, повторённый Моисею и Иисусу Навину. О Соломоне сказано, что он владел всеми царствами «от реки Евфрата до земли Филистимской», от Типсаха (Фапсака), великой переправы, до Газы. Позже персидская сатрапия «за рекою», Эбир-нари, получила имя от Евфрата, и письма в книгах Ездры и Неемии обращены к её областеначальникам."
    - "Евфрат был рубежом, где сходились державы. Фараон Нехао шёл к нему против Вавилонян, а в 605 г. до н. э. Навуходоносор разбил его при Кархемисе, «при реке Евфрате», в битве, которую описывает Иеремия, после чего царь Египетский «не выходил более из земли своей». Иеремия спрятал пояс «у Евфрата» в знамение против Иудеи, хотя некоторые думают, что здесь имеется в виду источник Пара близ Анафофа, а его пророчество о Вавилоне должно было утонуть в реке вместе с камнем. В Откровении шестая труба освобождает четырёх Ангелов, связанных «при великой реке Евфрате», а шестая чаша иссушает её для царей от восхода солнечного."
    - "При Риме Евфрат отделял империю от Парфии, и на нём стояли римские гарнизоны в Зевгме и Дуре. Сегодня реку делят Турция, Сирия и Ирак: плотины Кебан, Каракая и Ататюрк в Турции, плотина Табка в Сирии и плотина Хадита в Ираке сократили её сток, а общего соглашения о разделе воды три страны так и не заключили, хотя попарно некоторые договоры подписаны. Болота, где Евфрат встречается с Тигром, были осушены в 1990-х годах и отчасти восстановлены после 2003 года."
  uk:
    - "Євфрат, завдовжки близько 2800 км, — найдовша ріка західної Азії. Він бере початок з Карасу та Мурату в горах східної Туреччини, проривається крізь Тавр, перетинає сирійський степ повз Каркемиш, Марі та Дура-Європос і входить у рівнину Вавилонії, де протікав повз Сіппар, Вавилон і Ур, перш ніж злитися з Тигром у Шатт-ель-Арабі вище Перської затоки. У Біблії це «велика ріка, ріка Евфрат» або просто «ріка», четверта ріка Едену; єврейське Перат відповідає акадському Пурату."
    - "Ріка обмежувала світ патріархів і обітниці. Батьки Авраама жили «по тім боцї Евфрату», Яків перейшов її, тікаючи від Лавана, а Бог пообіцяв насінню Аврама землю «від ріки Египецької до ріки великої, ріки Евфрата», межа, повторена Мойсею та Ісусу Навину. Про Соломона кажуть, що він царював «од Евфрат-ріки до землї Филистійської», від Тіфсаха (Тапсак), великої переправи, до Гази. Пізніше перська сатрапія «за рікою», Ебір-нарі, дістала назву від Євфрату, і листи в Ездри й Неемії адресовані її намісникам."
    - "Євфрат був кордоном, де зустрічалися імперії. Фараон Нехао дійшов до нього проти вавилонян, і в 605 р. до н. е. Навуходоносор розбив його при Каркемиші «на Евфрат-ріцї в Кархамисї», у битві, яку описує Єремія, після якої цар Єгипту «не рушав більш із землї своєї». Єремія сховав пояс «на Евфратї» як знак проти Юди, хоча дехто думає, що йдеться про Перат — джерело Фара біля Анатоту, а його оракул проти Вавилона мав бути потоплений у ріці з каменем. В Одкровенні шоста труба звільняє чотирьох ангелів, зв'язаних «над великою рікою Євфратом», а шоста чаша висушує її для царів сходу."
    - "За римлян Євфрат поділяв імперію й Парфію, і римські залоги тримали його в Зевгмі та Дурі. Сьогодні ріку ділять Туреччина, Сирія та Ірак: греблі Кебан, Каракая та Ататюрк у Туреччині, Табка в Сирії та Хадіса в Іраку скоротили її стік, і три країни ніколи не домовилися спільно про розподіл її води, хоча деякі пари з них підписали угоди. Болота, де вона зустрічається з Тигром, осушили в 1990-х рр. і частково відновили після 2003 р."
  es:
    - "El Éufrates, de unos 2800 km de longitud, es el río más largo del Asia occidental. Nace del Karasu y del Murat en las tierras altas del este de Turquía, atraviesa el Tauro, cruza la estepa siria pasando por Carquemis, Mari y Dura Europos, y entra en la llanura de Babilonia, donde pasaba junto a Sippar, Babilonia y Ur antes de unirse al Tigris en el Chat al-Arab, sobre el golfo Pérsico. En la Biblia es «el gran río, el río Eufrates» o simplemente «el río», el cuarto río del Edén; el hebreo Perath corresponde al acadio Purattu."
    - "El río marcaba el límite del mundo de los patriarcas y de la promesa. Los padres de Abraham «habitaron antiguamente de esotra parte del río», Jacob lo cruzó huyendo de Labán, y Dios prometió a la descendencia de Abram la tierra «desde el río de Egipto hasta el río grande, el río Eufrates», un límite repetido a Moisés y a Josué. Se dice que Salomón reinó desde el río hasta la tierra de los filisteos, desde Tifsa (Tapsaco), el gran paso, hasta Gaza. Más tarde la satrapía persa «de la otra parte del río», Ebir-nari, tomó su nombre del Éufrates, y las cartas de Esdras y Nehemías se dirigen a sus gobernadores."
    - "El Éufrates era la frontera donde se encontraban los imperios. El faraón Necao marchó hasta él contra los babilonios, y en el 605 a. C. Nabucodonosor lo derrotó en Carquemis, «cerca del río Eufrates», la batalla que describe Jeremías, tras la cual el rey de Egipto «nunca más [...] salió de su tierra». Jeremías escondió un cinto «junto al Eufrates» como señal contra Judá, aunque algunos piensan que el Perath al que se refiere es la fuente de Para, cerca de Anatot, y su oráculo contra Babilonia debía hundirse en el río con una piedra. En el Apocalipsis la sexta trompeta suelta a cuatro ángeles atados «en el gran río Eufrates», y la sexta copa lo seca para los reyes del oriente."
    - "Bajo Roma el Éufrates separaba el Imperio de Partia, y las guarniciones romanas lo guardaban en Zeugma y Dura. Hoy el río es compartido por Turquía, Siria e Irak: las presas de Keban, Karakaya y Atatürk en Turquía, la de Tabqa en Siria y la de Haditha en Irak han reducido su caudal, y los tres países nunca se han puesto de acuerdo conjuntamente sobre el reparto de sus aguas, aunque algunas parejas de ellos han firmado acuerdos. Las marismas donde se une al Tigris fueron desecadas en la década de 1990 y parcialmente restauradas después de 2003."
  pt:
    - "O Eufrates, com cerca de 2.800 km, é o mais longo rio da Ásia ocidental. Nasce do Karasu e do Murat nas terras altas do leste da Turquia, rompe o Touro, atravessa a estepe síria passando por Carquemis, Mari e Dura-Europos, e entra na planície da Babilônia, onde corria por Sipar, Babilônia e Ur antes de juntar-se ao Tigre no Shatt al-Arab, acima do Golfo Pérsico. Na Bíblia é “o grande rio, o rio Eufrates” ou simplesmente “o Rio”, o quarto rio do Éden; o hebraico Perath corresponde ao acádico Purattu."
    - "O rio limitava o mundo dos patriarcas e da promessa. Os antepassados de Abraão “viveram além do Rio”, Jacó o atravessou fugindo de Labã, e Deus prometeu à descendência de Abrão a terra “desde o rio do Egito até o grande rio, o rio Eufrates”, limite repetido a Moisés e Josué. Diz-se que Salomão reinou “desde o Rio até a terra dos filisteus”, de Tifsa (Tapsaco), a grande travessia, até Gaza. Mais tarde a satrapia persa “além do Rio”, Ebir-nari, tomou o nome do Eufrates, e as cartas de Esdras e Neemias são dirigidas a seus governadores."
    - "O Eufrates era a fronteira onde os impérios se encontravam. O faraó Neco marchou até ele contra os babilônios, e em 605 a.C. Nabucodonosor o derrotou em Carquemis “junto ao rio Eufrates”, a batalha que Jeremias descreve, depois da qual “O rei do Egito não saiu mais de sua terra”. Jeremias escondeu um cinto “junto ao Eufrates” como sinal contra Judá, embora alguns pensem que o Perath em questão seja a fonte de Pará, perto de Anatote, e seu oráculo contra a Babilônia devia ser afundado no rio com uma pedra. No Apocalipse, a sexta trombeta solta quatro anjos amarrados “junto ao grande rio Eufrates”, e a sexta taça o seca para os reis do oriente."
    - "Sob Roma, o Eufrates separava o império da Pártia, e guarnições romanas o guardavam em Zeugma e Dura. Hoje o rio é partilhado por Turquia, Síria e Iraque: as barragens de Keban, Karakaya e Atatürk, na Turquia, a de Tabqa, na Síria, e a de Haditha, no Iraque, reduziram seu fluxo, e os três países nunca chegaram a um acordo conjunto sobre a divisão da água, embora alguns pares deles tenham assinado acordos. Os pântanos onde ele encontra o Tigre foram drenados na década de 1990 e em parte restaurados depois de 2003."
  de:
    - "Der Euphrat, etwa 2800 km lang, ist der längste Fluss Westasiens. Er entspringt aus dem Karasu und dem Murat im Hochland der Osttürkei, durchbricht den Taurus, durchquert die syrische Steppe an Karkemisch, Mari und Dura-Europos vorbei und tritt in die Ebene Babyloniens ein, wo er an Sippar, Babylon und Ur vorbeifloss, ehe er sich im Schatt al-Arab oberhalb des Persischen Golfs mit dem Tigris vereinigt. In der Bibel ist er „das große Wasser Euphrat“ oder einfach „der Strom“, der vierte Fluss Edens; das hebräische Perat entspricht dem akkadischen Purattu."
    - "Der Fluss begrenzte die Welt der Erzväter und der Verheißung. Abrahams Väter „wohnten vorzeiten jenseit des Stroms“, Jakob überquerte ihn auf der Flucht vor Laban, und Gott verhieß Abrams Samen das Land „von dem Wasser Ägyptens an bis an das große Wasser Euphrat“, eine Grenze, die Mose und Josua wiederholt wird. Von Salomo heißt es, er habe geherrscht „von dem Strom an bis zu der Philister Lande“, von Tifsach (Tapsakus), der großen Furt, bis Gaza. Später erhielt die persische Satrapie „jenseits des Flusses“, Ebir-nari, ihren Namen vom Euphrat, und die Briefe in Esra und Nehemia sind an ihre Statthalter gerichtet."
    - "Der Euphrat war die Grenze, an der Reiche aufeinandertrafen. Pharao Necho zog gegen die Babylonier zu ihm, und 605 v. Chr. besiegte ihn Nebukadnezar bei Karkemisch „am Wasser Euphrat“, die Schlacht, die Jeremia beschreibt, wonach der König von Ägypten „nicht mehr aus seinem Lande“ zog. Jeremia versteckte einen Gürtel „am Euphrat“ als Zeichen gegen Juda, obwohl manche meinen, das gemeinte Perat sei die Quelle von Para bei Anatot, und sein Orakel gegen Babylon sollte mit einem Stein im Fluss versenkt werden. In der Offenbarung löst die sechste Posaune vier Engel, die gebunden sind „an dem großen Wasserstrom Euphrat“, und die sechste Schale trocknet ihn für die Könige des Ostens aus."
    - "Unter Rom trennte der Euphrat das Reich von Parthien, und römische Garnisonen hielten ihn bei Zeugma und Dura. Heute teilen sich die Türkei, Syrien und der Irak den Fluss: Die Staudämme Keban, Karakaya und Atatürk in der Türkei, der Tabqa-Damm in Syrien und der Haditha-Damm im Irak haben seinen Abfluss verringert, und die drei Länder haben sich nie gemeinsam über die Verteilung seines Wassers geeinigt, obwohl einige Paare von ihnen Abkommen unterzeichnet haben. Die Marschen, wo er auf den Tigris trifft, wurden in den 1990er Jahren trockengelegt und nach 2003 teilweise wiederhergestellt."
  fr:
    - "L’Euphrate, long d’environ 2 800 km, est le plus long fleuve de l’Asie occidentale. Il naît du Karasu et du Murat dans les hautes terres de l’est de la Turquie, perce le Taurus, traverse la steppe syrienne devant Carkemisch, Mari et Doura-Europos, et entre dans la plaine de Babylonie, où il coulait devant Sippar, Babylone et Ur avant de rejoindre le Tigre dans le Chatt al-Arab au-dessus du golfe Persique. Dans la Bible, c’est le « grand fleuve, le fleuve de l’Euphrate » ou simplement « le fleuve », le quatrième fleuve d’Éden ; l’hébreu Perath répond à l’akkadien Purattu."
    - "Le fleuve bornait le monde des patriarches et de la promesse. Les pères d’Abraham « habitaient anciennement de l’autre côté du fleuve », Jacob le traversa en fuyant Laban, et Dieu promit à la postérité d’Abram le pays « depuis le fleuve d’Égypte jusqu’au grand fleuve, au fleuve d’Euphrate », limite répétée à Moïse et à Josué. On dit que Salomon régna « depuis le fleuve jusqu’au pays des Philistins », de Thiphsach (Thapsaque), le grand passage, à Gaza. Plus tard, la satrapie perse « Au-delà du fleuve », Ebir-nari, tira son nom de l’Euphrate, et les lettres d’Esdras et de Néhémie sont adressées à ses gouverneurs."
    - "L’Euphrate était la frontière où se rencontraient les empires. Le Pharaon Néco marcha jusqu’à lui contre les Babyloniens, et en 605 av. J.-C. Nebucadnetsar le vainquit à Carkemisch, « près du fleuve de l’Euphrate », bataille que décrit Jérémie, après laquelle le roi d’Égypte « ne sortit plus de son pays ». Jérémie cacha une ceinture « près de l’Euphrate » comme signe contre Juda, bien que certains pensent que le Perath dont il s’agit soit la source de Para près d’Anathoth, et son oracle contre Babylone devait être coulé dans le fleuve avec une pierre. Dans l’Apocalypse, la sixième trompette libère quatre anges liés « sur le grand fleuve d’Euphrate », et la sixième coupe l’assèche pour les rois de l’Orient."
    - "Sous Rome, l’Euphrate séparait l’Empire de la Parthie, et des garnisons romaines le tenaient à Zeugma et à Doura. Aujourd’hui, le fleuve est partagé entre la Turquie, la Syrie et l’Irak : les barrages de Keban, de Karakaya et d’Atatürk en Turquie, de Tabqa en Syrie et de Haditha en Irak ont réduit son débit, et les trois pays ne se sont jamais mis d’accord ensemble sur le partage de son eau, bien que certains couples d’entre eux aient signé des accords. Les marais où il rencontre le Tigre ont été asséchés dans les années 1990 et partiellement restaurés après 2003."
  it:
    - "L’Eufrate, lungo circa 2800 km, è il fiume più lungo dell’Asia occidentale. Nasce dal Karasu e dal Murat negli altopiani della Turchia orientale, attraversa il Tauro, percorre la steppa siriana oltre Carchemis, Mari e Dura-Europos, ed entra nella pianura della Babilonia, dove scorreva presso Sippar, Babilonia e Ur prima di unirsi al Tigri nello Shatt al-Arab sopra il Golfo Persico. Nella Bibbia è «il gran fiume, il fiume Eufrate» o semplicemente «il fiume», il quarto fiume dell’Eden; l’ebraico Perath corrisponde all’accadico Purattu."
    - "Il fiume segnava il confine del mondo dei patriarchi e della promessa. I padri di Abramo «abitarono anticamente di là dal fiume», Giacobbe lo attraversò fuggendo da Laban, e Dio promise alla progenie di Abramo il paese «dal fiume d’Egitto al gran fiume, il fiume Eufrate», confine ripetuto a Mosè e a Giosuè. Di Salomone si dice che dominò «tutti i regni di qua dal fiume, fino al paese dei Filistei», da Tifsach (Tapsaco), il grande guado, a Gaza. Più tardi la satrapia persiana «d’oltre il fiume», Ebir-nari, prese il nome dall’Eufrate, e le lettere di Esdra e Neemia sono indirizzate ai suoi governatori."
    - "L’Eufrate era la frontiera dove si incontravano gli imperi. Il faraone Neco vi marciò contro i Babilonesi, e nel 605 a.C. Nabucodonosor lo sconfisse a Carchemis «presso al fiume Eufrate», la battaglia descritta da Geremia, dopo la quale il re d’Egitto «non uscì più dal suo paese». Geremia nascose una cintura «presso l’Eufrate» come segno contro Giuda, benché alcuni pensino che il Perath inteso sia la sorgente di Para presso Anatòt, e il suo oracolo contro Babilonia doveva essere affondato nel fiume con una pietra. Nell’Apocalisse la sesta tromba scioglie quattro angeli legati «sul gran fiume Eufrate», e la sesta coppa lo prosciuga per i re dell’oriente."
    - "Sotto Roma l’Eufrate divideva l’impero dalla Partia, e guarnigioni romane lo tenevano a Zeugma e a Dura. Oggi il fiume è condiviso da Turchia, Siria e Iraq: le dighe di Keban, Karakaya e Atatürk in Turchia, la diga di Tabqa in Siria e quella di Haditha in Iraq ne hanno ridotto la portata, e i tre paesi non si sono mai accordati insieme sulla ripartizione delle sue acque, benché alcune coppie di essi abbiano firmato intese. Le paludi dove incontra il Tigri furono prosciugate negli anni 1990 e in parte ripristinate dopo il 2003."
  pl:
    - "Eufrat, długi na około 2800 km, jest najdłuższą rzeką Azji Zachodniej. Wypływa z Karasu i Muratu na wyżynach wschodniej Turcji, przebija się przez Taurus, przecina step syryjski obok Karkemisz, Mari i Dura-Europos i wchodzi na równinę Babilonii, gdzie płynął obok Sippar, Babilonu i Ur, nim połączył się z Tygrysem w Szatt al-Arab nad Zatoką Perską. W Biblii nazywa się go wielką rzeką, rzeką Eufrat, albo po prostu rzeką, czwartą rzeką Edenu; hebrajskie Perat odpowiada akadyjskiemu Purattu."
    - "Rzeka wyznaczała granicę świata patriarchów i obietnicy. Jozue przypomina, że „za rzeką mieszkali ojcowie wasi od dawnych czasów”, Jakub przeszedł ją, uciekając przed Labanem, a Bóg obiecał potomstwu Abrama ziemię „od rzeki Egipskiej, aż do rzeki wielkiej, rzeki Eufrates”, granicę powtórzoną Mojżeszowi i Jozuemu. O Salomonie mówi się, że panował „od rzeki aż do ziemi Filistyńskiej”, od Tifsach (Tapsakus), wielkiej przeprawy, do Gazy. Później perska satrapia Zarzecze, „za rzeką”, Ebir-nari, wzięła nazwę od Eufratu, a listy w Księgach Ezdrasza i Nehemiasza są adresowane do jej namiestników."
    - "Eufrat był granicą, na której spotykały się imperia. Faraon Necho pomaszerował do niego przeciw Babilończykom, a w 605 r. p.n.e. Nabuchodonozor pokonał go pod Karkemisz „nad rzeką Eufrates”, w bitwie opisanej przez Jeremiasza, po której „nie ruszał się więcej król Egipski z ziemi swej”. Jeremiasz ukrył pas „u Eufratesa” jako znak przeciw Judzie, choć niektórzy sądzą, że Perat oznacza tu źródło Para koło Anatot, a jego wyrocznia przeciw Babilonowi miała być zatopiona w rzece z kamieniem. W Apokalipsie szósta trąba rozwiązuje czterech aniołów związanych „u wielkiej rzeki Eufrates”, a szósta czasza osusza ją dla królów ze wschodu."
    - "Pod Rzymem Eufrat dzielił imperium od Partii, a rzymskie garnizony trzymały go w Zeugmie i Dura. Dziś rzekę dzielą Turcja, Syria i Irak: tamy Keban, Karakaya i Atatürk w Turcji, tama Tabka w Syrii i tama Hadita w Iraku zmniejszyły jej przepływ, a trzy kraje nigdy nie uzgodniły wspólnie podziału jej wody, choć niektóre pary podpisały porozumienia. Bagna, gdzie spotyka się z Tygrysem, osuszono w latach dziewięćdziesiątych XX w. i częściowo odtworzono po 2003 r."
  nl:
    - "De Eufraat, zo'n 2800 km lang, is de langste rivier van West-Azië. Zij ontspringt uit de Karasu en de Murat in het hoogland van Oost-Turkije, breekt door de Taurus, doorkruist de Syrische steppe langs Karkemis, Mari en Dura-Europos, en betreedt de vlakte van Babylonië, waar zij langs Sippar, Babylon en Ur stroomde voordat zij zich boven de Perzische Golf in de Shatt al-Arab met de Tigris verenigde. In de Bijbel is zij “die grote rivier, de rivier Frath” of eenvoudig “de rivier”, de vierde rivier van Eden; het Hebreeuwse Perat beantwoordt aan het Akkadische Purattu."
    - "De rivier begrensde de wereld van de aartsvaders en van de belofte. Abrahams vaderen woonden “over gene zijde der rivier”, Jakob stak haar over op de vlucht voor Laban, en God beloofde Abrams nageslacht het land “van de rivier van Egypte af, tot aan die grote rivier, de rivier Frath”, een grens die aan Mozes en Jozua werd herhaald. Van Salomo wordt gezegd dat hij regeerde “van de rivier tot het land der Filistijnen”, van Tifsach (Thapsacus), de grote oversteek, tot Gaza. Later ontleende de Perzische satrapie “aan gene zijde der rivier”, Ebir-nari, haar naam aan de Eufraat, en de brieven in Ezra en Nehemia zijn aan haar gouverneurs gericht."
    - "De Eufraat was de grens waar rijken elkaar ontmoetten. Farao Necho trok ernaartoe tegen de Babyloniërs, en in 605 v.Chr. versloeg Nebukadnessar hem bij Karkemis “aan de rivier Frath”, de slag die Jeremia beschrijft, waarna de koning van Egypte “toog voortaan niet meer uit zijn land”. Jeremia verborg een gordel “bij den Frath” als teken tegen Juda, al menen sommigen dat de bedoelde Perat de bron van Para bij Anatot is, en zijn orakel tegen Babylon moest met een steen in de rivier worden gezonken. In Openbaring ontbindt de zesde bazuin vier engelen die gebonden zijn “bij de grote rivier, den Eufraat”, en de zesde schaal droogt haar op voor de koningen van het oosten."
    - "Onder Rome scheidde de Eufraat het rijk van Parthië, en Romeinse garnizoenen hielden haar bij Zeugma en Dura. Tegenwoordig wordt de rivier gedeeld door Turkije, Syrië en Irak: de dammen van Keban, Karakaya en Atatürk in Turkije, de Tabqa-dam in Syrië en de Haditha-dam in Irak hebben haar debiet verminderd, en de drie landen zijn het nooit samen eens geworden over de verdeling van het water, al hebben enkele paren akkoorden gesloten. De moerassen waar zij de Tigris ontmoet werden in de jaren 1990 drooggelegd en na 2003 gedeeltelijk hersteld."
  cs:
    - "Eufrat, dlouhý asi 2800 km, je nejdelší řekou západní Asie. Pramení z Karasu a Muratu ve vysočině východního Turecka, prorazí Taurus, překračuje syrskou step kolem Karkemíše, Mari a Dúra-Európa a vstupuje do roviny Babylonie, kde protékal kolem Sippar, Babylóna a Uru, než se spojil s Tigridem v Šatt al-Arab nad Perským zálivem. V Bibli se mluví o „řece veliké, řece Eufrates“ nebo prostě o řece, čtvrté řece Edenu; hebrejské Perat odpovídá akkadskému Purattu."
    - "Řeka vymezovala svět patriarchů a zaslíbení. Abrahamovi předkové, o nichž se praví: „Za řekou bydlili otcové vaši“, Jákob ji přešel na útěku před Labanem a Bůh slíbil Abramovu semeni zemi „od řeky Egyptské až do řeky té veliké, řeky Eufraten“, což se opakuje u Mojžíše a Jozua. O Šalomounovi se praví, že panoval „od řeky až k zemi Filistinské“, od Tifsachu (Thapsakos), velkého brodu, ke Gaze. Později perská satrapie „za řekou“, Ebir-nari, vzala jméno od Eufratu a listy v Ezdrášovi a Nehemjášovi jsou adresovány jejím správcům."
    - "Eufrat byl hranicí, kde se setkávaly říše. Faraon Nekó k němu táhl proti Babylóňanům a roku 605 př. n. l. jej Nebukadnesar porazil u Karkemíše „při řece Eufrates“, bitva, kterou líčí Jeremjáš, po níž král Egypta „nikdy více nevytáhl z země své“. Jeremjáš ukryl pás „u Eufrates“ na znamení proti Judsku, ač někteří soudí, že míněné Perat je pramen Para poblíž Anatótu, a jeho věštba proti Babylónu měla být s kamenem potopena do řeky. Ve Zjevení šestá trouba uvolní čtyři anděly spoutané „při veliké řece Eufrates“ a šestá miska ji vysuší pro krále východu."
    - "Za Říma dělil Eufrat říši od Parthie a římské posádky jej držely u Zeugmy a Dúry. Dnes sdílejí řeku Turecko, Sýrie a Irák: přehrady Keban, Karakaya a Atatürk v Turecku, přehrada Tabqa v Sýrii a přehrada Haditha v Iráku omezily její tok a tyto tři země se nikdy společně nedohodly o dělení její vody, ač některé dvojice podepsaly dohody. Močály, kde se setkává s Tigridem, byly vysušeny v 90. letech a po roce 2003 částečně obnoveny."
  sv:
    - "Eufrat, omkring 2 800 km lång, är västra Asiens längsta flod. Den rinner upp ur Karasu och Murat i östra Turkiets högland, bryter igenom Taurus, korsar den syriska stäppen förbi Karkemish, Mari och Dura-Europos och går in i Babyloniens slätt, där den rann förbi Sippar, Babylon och Ur innan den förenades med Tigris i Shatt al-Arab ovanför Persiska viken. I Bibeln är den ”den stora floden, floden Frat” eller helt enkelt ”floden”, den fjärde floden i Eden; hebreiskans Perath motsvarar akkadiskans Purattu."
    - "Floden avgränsade patriarkernas och löftets värld. ”På andra sidan floden bodde edra fäder”, Abrahams fäder, Jakob gick över den när han flydde från Laban, och Gud lovade Abrams säd landet ”från Egyptens flod ända till den stora floden, till floden Frat”, en gräns som upprepas för Mose och Josua. Salomo sägs ha härskat över alla riken ”ifrån floden till filistéernas land”, från Tifsa (Thapsakos), den stora övergången, till Gaza. Senare tog den persiska satrapin ”på andra sidan floden”, Ebir-nari, sitt namn från Eufrat, och breven i Esra och Nehemja är ställda till dess ståthållare."
    - "Eufrat var gränsen där imperier möttes. Farao Necho tågade dit mot babylonierna, och 605 f.Kr. besegrade Nebukadnessar honom vid Karkemish ”invid floden Frat”, striden som Jeremia beskriver, varefter ”drog konungen i Egypten icke vidare ut ur sitt land”. Jeremia gömde en gördel ”vid Frat” som tecken mot Juda, fast några tror att Perath som avses är källan Para nära Anatot, och hans utsaga mot Babylon skulle sänkas i floden med en sten. I Uppenbarelseboken löser den sjätte basunen fyra änglar som hålls bundna ”invid den stora floden Eufrat”, och den sjätte skålen torkar ut den för konungarna från östern."
    - "Under Rom delade Eufrat riket från Parthien, och romerska garnisoner höll den vid Zeugma och Dura. I dag delas floden av Turkiet, Syrien och Irak: dammarna Keban, Karakaya och Atatürk i Turkiet, Tabqadammen i Syrien och Haditha-dammen i Irak har minskat dess flöde, och de tre länderna har aldrig kommit överens tillsammans om fördelningen av dess vatten, fastän några par av dem har undertecknat avtal. Träsken där den möter Tigris dränerades på 1990-talet och återställdes delvis efter 2003."
  nb:
    - "Eufrat, omtrent 2800 km lang, er den lengste elven i Vest-Asia. Den springer ut av Karasu og Murat i høylandet i Øst-Tyrkia, bryter gjennom Taurus, krysser den syriske steppen forbi Karkemisj, Mari og Dura-Europos, og kommer inn på sletten i Babylonia, der den rant forbi Sippar, Babylon og Ur før den slo seg sammen med Tigris i Shatt al-Arab ovenfor Persiabukta. I Bibelen er den «den store elv, elven Frat» eller bare «elven», Edens fjerde elv; det hebraiske Perath svarer til det akkadiske Purattu."
    - "Elven avgrenset patriarkenes og løftets verden. Abrahams fedre bodde «på hinside elven», Jakob krysset den på flukt fra Laban, og Gud lovet Abrams ætt landet «fra Egyptens elv like til den store elv, elven Frat», en grense gjentatt for Moses og Josva. Om Salomo sies det at han rådet «fra elven til filistrenes land», fra Tifsah (Tapsakus), den store overgangen, til Gasa. Senere tok det persiske satrapiet «hinsides elven», Ebir-nari, navn etter Eufrat, og brevene i Esra og Nehemja er stilet til dets stattholdere."
    - "Eufrat var grensen der imperier møttes. Farao Neko marsjerte til den mot babylonerne, og i 605 f.Kr. beseiret Nebukadnesar ham i Karkemisj «ved elven Eufrat», slaget Jeremia beskriver, hvoretter Egypts konge «drog ikke mere ut av sitt land». Jeremia skjulte et belte «ved Eufrat» som et tegn mot Juda, selv om noen mener at Perath som menes, er kilden Para nær Anatot, og hans orakel mot Babylon skulle senkes i elven med en sten. I Åpenbaringen løser den sjette basun fire engler «bundet ved den store elv Eufrat», og den sjette skål tørker den ut for kongene fra Østen."
    - "Under Roma delte Eufrat imperiet fra Parthia, og romerske garnisoner holdt den ved Zeugma og Dura. I dag deles elven av Tyrkia, Syria og Irak: Keban-, Karakaya- og Atatürk-demningene i Tyrkia, Tabqa-demningen i Syria og Haditha-demningen i Irak har redusert dens vannføring, og de tre landene har aldri blitt enige sammen om fordelingen av vannet, selv om noen av dem to og to har undertegnet avtaler. Myrene der den møter Tigris ble drenert på 1990-tallet og delvis gjenopprettet etter 2003."
