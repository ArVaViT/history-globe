body:
  en:
    - 'Magdala, from the Aramaic for "tower", lay on the western shore of the Sea of Galilee about 5 km north of Tiberias, below the cliffs of Mount Arbel, where the village of al-Majdal stood until 1948. It is usually identified with Taricheae, a town named in Greek for its salted fish, though Pliny places Taricheae at the south end of the lake. Excavations show a town founded in the Hellenistic period that reached its height in the early Roman period; it was the chief town of the western shore until Tiberias was built. After Crassus'' defeat in 53 BC, Josephus tells, the Roman commander Cassius took Taricheae and carried about 30,000 Jews into slavery.'
    - "In the Gospels Mary called Magdalene, usually taken as Mary of Magdala, was one of the women healed by Jesus: out of her, Luke says, went seven devils, and she was among those who ministered to him of their substance. She stood by the cross, and the risen Lord appeared first to her. After feeding the four thousand Jesus came, in the King James text, into the coasts of Magdala; other manuscripts read Magadan, and Mark names the place Dalmanutha, which has not been located."
    - "Nero gave Taricheae to King Agrippa II. In the revolt of AD 66 Josephus fortified it, and in 67 Titus rode into it along the lakeshore. Those who fled by boat were destroyed on the lake by Vespasian's ships, and 6,500 died in the town and on the water. Of the prisoners, Vespasian had 1,200 killed, sent 6,000 young men to Nero to dig the canal through the Isthmus of Corinth, and sold 30,400 as slaves."
    - "From 2009 the Israel Antiquities Authority, under Dina Avshalom-Gorni and Arfan Najar, uncovered a synagogue of the first century AD with frescoed walls and a mosaic floor. In it stood a carved stone block bearing a seven-branched menorah, one of the earliest known reliefs of it. The quarter was abandoned at the time of the revolt, and the excavators tie its end to the Roman conquest. Franciscan excavations led by Stefano De Luca from 2007 uncovered more of the Roman town, which went on as a smaller settlement after the revolt."
  ru:
    - "Магдала, от арамейского слова «башня», лежала на западном берегу моря Галилейского, примерно в 5 км к северу от Тивериады, под скалами горы Арбел, где до 1948 г. стояло селение аль-Мадждаль. Её обычно отождествляют с Тарихеей, городом, получившим греческое имя от солёной рыбы, хотя Плиний помещает Тарихею у южного края озера. Раскопки показывают город, основанный в эллинистический период и достигший расцвета в раннеримское время; до постройки Тивериады он был главным городом западного берега. После поражения Красса в 53 г. до н. э., как рассказывает Иосиф Флавий, римский военачальник Кассий взял Тарихею и увёл в рабство около 30 000 иудеев."
    - "В Евангелиях Мария, называемая Магдалиною, которую обычно понимают как Марию из Магдалы, была одной из исцелённых Иисусом женщин: из неё, по словам Луки, вышли семь бесов, и она была среди тех, кто служил Ему имением своим. Она стояла при кресте, и воскресший Господь явился сперва ей. После насыщения четырёх тысяч Иисус прибыл, по Синодальному тексту, в пределы Магдалинские; в других рукописях стоит Магадан, а Марк называет это место Далмануфой, которую не удалось найти."
    - "Нерон отдал Тарихею царю Агриппе II. Во время восстания 66 г. н. э. Иосиф Флавий укрепил её, а в 67 г. Тит ворвался в неё верхом вдоль берега озера. Бежавших на лодках истребили на озере корабли Веспасиана; в городе и на воде погибли 6500 человек. Из пленных Веспасиан велел убить 1200, отправил 6000 юношей к Нерону копать канал через Коринфский перешеек, а 30 400 продал в рабство."
    - "С 2009 г. Управление древностей Израиля под руководством Дины Авшалом-Горни и Арфана Наджара раскопало синагогу I века н. э. с расписными стенами и мозаичным полом. В ней стоял резной каменный блок с семисвечником, одно из самых ранних известных его рельефных изображений. Квартал был оставлен во время восстания, и раскопщики связывают его конец с римским завоеванием. Францисканские раскопки под руководством Стефано Де Луки с 2007 г. открыли и другие части римского города, который после восстания продолжал жить меньшим поселением."
  uk:
    - "Магдала, від арамейського «вежа», лежала на західному березі Галілейського моря приблизно за 5 км на північ від Тіверіади, під скелями гори Арбел, де до 1948 р. стояло село аль-Маджаль. Її зазвичай ототожнюють із Таріхеєю, містом, названим грецькою за солену рибу, хоча Пліній розміщує Таріхею на південному краю озера. Розкопки показують місто, засноване в елліністичну добу, що сягнуло розквіту в ранню римську; це було головне місто західного берега, доки не збудували Тіверіаду. Після поразки Красса 53 р. до н. е., розповідає Йосиф Флавій, римський полководець Кассій узяв Таріхею й повів у рабство близько 30 000 євреїв."
    - "В Євангеліях Марія, названа Магдалиною, що її зазвичай уважають Марією з Магдали, була однією з жінок, оздоровлених Ісусом: з неї, каже Лука, вийшло «сїм бісів», і вона була серед тих, що «послугували Йому з добра свого». Вона стояла біля хреста, і воскреслий Господь явився найперше їй. Нагодувавши чотири тисячі, Ісус прибув, за текстом Біблії короля Якова, у межі Магдали; інші рукописи читають Магадан, а Марко називає місце Далманута, яке не встановлене."
    - "Нерон віддав Таріхею цареві Агриппі II. У повстанні 66 р. н. е. Йосиф Флавій укріпив її, а 67 р. Тит в’їхав до неї вздовж берега озера. Ті, хто втікав на човнах, були знищені на озері кораблями Веспасіана, і 6500 загинуло в місті й на воді. З полонених Веспасіан наказав убити 1200, послав 6000 юнаків до Нерона копати канал крізь Коринфський перешийок, а 30 400 продав у рабство."
    - "З 2009 р. Управління старожитностей Ізраїлю під керівництвом Діни Авшалом-Горні та Арфана Наджара відкрило синагогу I ст. н. е. з розписаними фресками стінами й мозаїчною підлогою. У ній стояв різьблений кам’яний блок із семисвічником — один із найдавніших відомих його рельєфів. Квартал було покинуто в час повстання, і розкопувачі пов’язують його кінець із римським завоюванням. Францисканські розкопки під керівництвом Стефано Де Луки від 2007 р. відкрили більше римського міста, яке після повстання тривало як менше поселення."
  es:
    - "Magdala, del arameo «torre», se hallaba en la orilla occidental del Mar de Galilea, a unos 5 km al norte de Tiberias, bajo los acantilados del monte Arbel, donde se alzó hasta 1948 la aldea de al-Majdal. Suele identificarse con Tariquea, ciudad cuyo nombre griego alude a su pescado salado, aunque Plinio sitúa Tariquea en el extremo sur del lago. Las excavaciones muestran una ciudad fundada en el período helenístico que alcanzó su apogeo a comienzos del período romano; fue la principal ciudad de la orilla occidental hasta que se construyó Tiberias. Tras la derrota de Craso en 53 a. C., cuenta Josefo, el comandante romano Casio tomó Tariquea y llevó a unos 30 000 judíos a la esclavitud."
    - "En los Evangelios, María llamada Magdalena, que suele entenderse como María de Magdala, fue una de las mujeres sanadas por Jesús: de ella, dice Lucas, salieron siete demonios, y estuvo entre las que le servían con sus bienes. Estuvo junto a la cruz, y el Señor resucitado se apareció primero a ella. Tras alimentar a los cuatro mil, Jesús llegó, en el texto de la versión del rey Jacobo, a «los términos de Magdalá»; otros manuscritos leen Magadán, y Marcos nombra el lugar Dalmanuta, que no ha sido localizado."
    - "Nerón dio Tariquea al rey Agripa II. En la rebelión del año 66 d. C. Josefo la fortificó, y en 67 Tito entró en ella cabalgando por la orilla del lago. Quienes huyeron en barcas fueron destruidos en el lago por las naves de Vespasiano, y 6500 murieron en la ciudad y sobre el agua. De los prisioneros, Vespasiano mandó matar a 1200, envió a 6000 jóvenes a Nerón para excavar el canal del istmo de Corinto y vendió como esclavos a 30 400."
    - "Desde 2009, la Autoridad de Antigüedades de Israel, bajo Dina Avshalom-Gorni y Arfan Najar, sacó a la luz una sinagoga del siglo I d. C. con muros pintados al fresco y un suelo de mosaico. En ella se alzaba un bloque de piedra tallado con una menorá de siete brazos, uno de los relieves más antiguos conocidos de ella. El barrio fue abandonado en el momento de la rebelión, y los excavadores vinculan su fin con la conquista romana. Las excavaciones franciscanas dirigidas por Stefano De Luca desde 2007 sacaron a la luz más de la ciudad romana, que continuó como un asentamiento menor tras la rebelión."
  pt:
    - "Magdala, do aramaico para “torre”, ficava na margem ocidental do Mar da Galileia, a cerca de 5 km ao norte de Tiberíades, sob os penhascos do monte Arbel, onde a aldeia de al-Majdal existiu até 1948. É geralmente identificada com Tariqueia, cidade assim chamada em grego por seus peixes salgados, embora Plínio situe Tariqueia no extremo sul do lago. As escavações mostram uma cidade fundada no período helenístico que atingiu seu auge no início do período romano; era a principal cidade da margem ocidental até a construção de Tiberíades. Depois da derrota de Crasso em 53 a.C., conta Josefo, o comandante romano Cássio tomou Tariqueia e levou cerca de 30.000 judeus à escravidão."
    - "Nos Evangelhos, Maria chamada Madalena, geralmente tomada como Maria de Magdala, foi uma das mulheres curadas por Jesus: dela, diz Lucas, haviam saído sete demônios, e ela estava entre as que o serviam com os seus bens. Esteve junto à cruz, e o Senhor ressuscitado apareceu primeiro a ela. Depois de alimentar os quatro mil, Jesus foi, no texto da King James, para a região de Magdala; outros manuscritos leem Magadã, e Marcos chama o lugar Dalmanuta, que não foi localizada."
    - "Nero deu Tariqueia ao rei Agripa II. Na revolta de 66 d.C., Josefo a fortificou, e em 67 Tito entrou nela cavalgando ao longo da margem do lago. Os que fugiram de barco foram destruídos no lago pelos navios de Vespasiano, e 6.500 morreram na cidade e na água. Dos prisioneiros, Vespasiano mandou matar 1.200, enviou 6.000 jovens a Nero para cavar o canal pelo istmo de Corinto e vendeu 30.400 como escravos."
    - "A partir de 2009, a Autoridade de Antiguidades de Israel, sob Dina Avshalom-Gorni e Arfan Najar, descobriu uma sinagoga do século I d.C. com paredes afrescadas e piso de mosaico. Nela havia um bloco de pedra esculpido com uma menorá de sete braços, um dos mais antigos relevos conhecidos dela. O bairro foi abandonado na época da revolta, e os escavadores ligam o seu fim à conquista romana. Escavações franciscanas dirigidas por Stefano De Luca a partir de 2007 descobriram mais da cidade romana, que continuou como povoado menor depois da revolta."
  de:
    - "Magdala, vom Aramäischen für „Turm“, lag am Westufer des Sees Genezareth etwa 5 km nördlich von Tiberias unterhalb der Klippen des Berges Arbel, wo bis 1948 das Dorf al-Majdal stand. Es wird meist mit Tarichea gleichgesetzt, einer Stadt, die griechisch nach ihrem gesalzenen Fisch benannt ist, obwohl Plinius Tarichea am Südende des Sees ansetzt. Die Ausgrabungen zeigen eine in hellenistischer Zeit gegründete Stadt, die in der frühen römischen Zeit ihren Höhepunkt erreichte; bis zum Bau von Tiberias war sie die wichtigste Stadt am Westufer. Nach der Niederlage des Crassus 53 v. Chr. nahm, so Josephus, der römische Befehlshaber Cassius Tarichea ein und führte etwa 30.000 Juden in die Sklaverei."
    - "In den Evangelien war Maria, genannt Magdalena, gewöhnlich als Maria von Magdala verstanden, eine der von Jesus geheilten Frauen: Aus ihr, sagt Lukas, seien sieben Teufel ausgefahren, und sie gehörte zu denen, die ihm von ihrer Habe Handreichung taten. Sie stand beim Kreuz, und der Auferstandene erschien zuerst ihr. Nach der Speisung der Viertausend kam Jesus nach dem Text Luthers in das Gebiet Magdalas; andere Handschriften lesen Magadan, und Markus nennt den Ort Dalmanuta, das nicht lokalisiert wurde."
    - "Nero gab Tarichea König Agrippa II. Im Aufstand von 66 n. Chr. befestigte Josephus es, und 67 ritt Titus am Seeufer entlang hinein. Die auf Booten Geflohenen wurden auf dem See von Vespasians Schiffen vernichtet, und 6.500 starben in der Stadt und auf dem Wasser. Von den Gefangenen ließ Vespasian 1.200 töten, schickte 6.000 junge Männer zu Nero, um den Kanal durch den Isthmus von Korinth zu graben, und verkaufte 30.400 als Sklaven."
    - "Ab 2009 legte die Israelische Altertumsbehörde unter Dina Avshalom-Gorni und Arfan Najar eine Synagoge des 1. Jahrhunderts n. Chr. mit freskengeschmückten Wänden und einem Mosaikboden frei. In ihr stand ein behauener Steinblock mit einer siebenarmigen Menora, eines der frühesten bekannten Reliefs davon. Das Viertel wurde zur Zeit des Aufstands aufgegeben, und die Ausgräber verbinden sein Ende mit der römischen Eroberung. Franziskanische Grabungen unter Stefano De Luca legten ab 2007 mehr von der römischen Stadt frei, die nach dem Aufstand als kleinere Siedlung fortbestand."
  fr:
    - "Magdala, de l’araméen pour « tour », se trouvait sur la rive occidentale de la mer de Galilée, à environ 5 km au nord de Tibériade, au pied des falaises du mont Arbel, là où le village d’al-Majdal subsista jusqu’en 1948. On l’identifie d’ordinaire à Tarichées, ville dont le nom grec vient de ses poissons salés, bien que Pline place Tarichées à l’extrémité sud du lac. Les fouilles montrent une ville fondée à l’époque hellénistique, qui atteignit son apogée au début de l’époque romaine ; elle fut la principale ville de la rive occidentale jusqu’à la construction de Tibériade. Après la défaite de Crassus en 53 av. J.-C., raconte Flavius Josèphe, le commandant romain Cassius prit Tarichées et emmena environ 30 000 Juifs en esclavage."
    - "Dans les Évangiles, Marie dite la Magdaléenne, que l’on prend d’ordinaire pour Marie de Magdala, fut l’une des femmes guéries par Jésus, « de laquelle étaient sortis sept démons », dit Luc, et elle était de celles qui « l’assistaient de leurs biens ». Elle se tint près de la croix, et le Seigneur ressuscité lui apparut d’abord. Après avoir nourri les quatre mille, Jésus vint, dans le texte de la version du roi Jacques, sur le territoire de Magdala ; d’autres manuscrits lisent Magadan, et Marc nomme le lieu Dalmanutha, qui n’a pas été localisé."
    - "Néron donna Tarichées au roi Agrippa II. Lors de la révolte de 66 apr. J.-C., Flavius Josèphe la fortifia, et en 67 Titus y entra à cheval en longeant le rivage. Ceux qui s’enfuirent en barque furent détruits sur le lac par les navires de Vespasien, et 6 500 moururent dans la ville et sur l’eau. Parmi les prisonniers, Vespasien en fit tuer 1 200, envoya 6 000 jeunes hommes à Néron pour creuser le canal à travers l’isthme de Corinthe, et en vendit 30 400 comme esclaves."
    - "À partir de 2009, l’Autorité des antiquités d’Israël, sous la direction de Dina Avshalom-Gorni et d’Arfan Najar, a mis au jour une synagogue du Ier siècle apr. J.-C. aux murs ornés de fresques et au sol de mosaïque. On y trouvait un bloc de pierre sculpté portant une menorah à sept branches, l’un des plus anciens reliefs connus de celle-ci. Le quartier fut abandonné au moment de la révolte, et les fouilleurs rattachent sa fin à la conquête romaine. Des fouilles franciscaines dirigées par Stefano De Luca à partir de 2007 ont mis au jour davantage de la ville romaine, qui continua comme établissement plus petit après la révolte."
  it:
    - "Magdala, dall’aramaico per «torre», sorgeva sulla riva occidentale del Lago di Tiberiade, a circa 5 km a nord di Tiberiade, sotto le scogliere del monte Arbel, dove il villaggio di al-Majdal rimase fino al 1948. È di solito identificata con Tariche, città che in greco prende nome dal pesce salato, benché Plinio collochi Tariche all’estremità meridionale del lago. Gli scavi mostrano una città fondata in età ellenistica che raggiunse l’apogeo nella prima età romana; fu la principale città della riva occidentale fino alla costruzione di Tiberiade. Dopo la sconfitta di Crasso nel 53 a.C., racconta Giuseppe Flavio, il comandante romano Cassio prese Tariche e portò circa 30.000 ebrei in schiavitù."
    - "Nei Vangeli Maria detta Maddalena, di solito ritenuta Maria di Magdala, fu una delle donne guarite da Gesù: da lei, dice Luca, erano usciti sette demoni, ed era tra quelle che lo assistevano con i loro beni. Stette presso la croce, e il Signore risorto apparve prima a lei. Dopo aver sfamato i quattromila Gesù venne, nel testo della King James, nel territorio di Magdala; altri manoscritti leggono Magadan, e Marco chiama il luogo Dalmanuta, che non è stato localizzato."
    - "Nerone diede Tariche al re Agrippa II. Nella rivolta del 66 d.C. Giuseppe Flavio la fortificò, e nel 67 Tito vi entrò a cavallo lungo la riva del lago. Quelli che fuggirono in barca furono distrutti sul lago dalle navi di Vespasiano, e 6500 morirono in città e sull’acqua. Dei prigionieri, Vespasiano ne fece uccidere 1200, mandò 6000 giovani a Nerone per scavare il canale attraverso l’Istmo di Corinto e ne vendette 30.400 come schiavi."
    - "Dal 2009 l’Autorità israeliana per le antichità, sotto Dina Avshalom-Gorni e Arfan Najar, ha portato alla luce una sinagoga del I secolo d.C. con pareti affrescate e pavimento a mosaico. Vi si trovava un blocco di pietra scolpito con una menorah a sette bracci, uno dei più antichi rilievi noti di essa. Il quartiere fu abbandonato al tempo della rivolta, e gli scavatori ne collegano la fine alla conquista romana. Scavi francescani diretti da Stefano De Luca dal 2007 hanno scoperto altre parti della città romana, che proseguì come insediamento più piccolo dopo la rivolta."
  pl:
    - "Magdala, od aramejskiego słowa oznaczającego „wieżę”, leżała na zachodnim brzegu Jeziora Galilejskiego około 5 km na północ od Tyberiady, pod urwiskami góry Arbel, gdzie do 1948 r. stała wieś al-Majdal. Utożsamia się ją zwykle z Tarichea, miastem nazwanym po grecku od solonych ryb, choć Pliniusz umieszcza Tarichea na południowym krańcu jeziora. Wykopaliska ukazują miasto założone w okresie hellenistycznym, które osiągnęło szczyt we wczesnym okresie rzymskim; było głównym miastem zachodniego brzegu, aż zbudowano Tyberiadę. Po klęsce Krassusa w 53 r. p.n.e., opowiada Józef Flawiusz, rzymski dowódca Kasjusz zdobył Tarichea i uprowadził około 30 000 Żydów w niewolę."
    - "W Ewangeliach Maria zwana Magdaleną, zwykle uważana za Marię z Magdali, była jedną z kobiet uzdrowionych przez Jezusa: z niej, jak mówi Łukasz, „było siedm dyjabłów wyszło”, i należała do tych, które mu służyły ze swego mienia. Stała przy krzyżu, a zmartwychwstały Pan ukazał się najpierw jej. Po nakarmieniu czterech tysięcy Jezus przybył, w tekście Biblii Króla Jakuba, na granice Magdali; inne rękopisy czytają Magadan, a Marek nazywa to miejsce Dalmanuta, którego nie zlokalizowano."
    - "Neron oddał Tarichea królowi Agryppie II. W powstaniu w 66 r. n.e. Józef Flawiusz je ufortyfikował, a w 67 r. Tytus wjechał do niego wzdłuż brzegu jeziora. Ci, którzy uciekali łodziami, zostali zniszczeni na jeziorze przez okręty Wespazjana, a 6500 zginęło w mieście i na wodzie. Spośród jeńców Wespazjan kazał zabić 1200, wysłał 6000 młodych mężczyzn do Nerona do kopania kanału przez Przesmyk Koryncki, a 30 400 sprzedał w niewolę."
    - "Od 2009 r. Izraelski Urząd Starożytności, pod kierunkiem Diny Avshalom-Gorni i Arfana Najara, odsłonił synagogę z I w. n.e. z freskowanymi ścianami i mozaikową posadzką. Stał w niej rzeźbiony kamienny blok z siedmioramienną menorą, jeden z najwcześniejszych znanych jej reliefów. Dzielnicę opuszczono w czasie powstania, a odkrywcy wiążą jej koniec z rzymskim podbojem. Franciszkańskie wykopaliska pod kierunkiem Stefano De Luki od 2007 r. odsłoniły więcej rzymskiego miasta, które trwało jako mniejsza osada po powstaniu."
  nl:
    - "Magdala, van het Aramees voor “toren”, lag aan de westoever van het Meer van Galilea, ongeveer 5 km ten noorden van Tiberias, onder de kliffen van de berg Arbel, waar het dorp al-Majdal stond tot 1948. Het wordt gewoonlijk geïdentificeerd met Tarichea, een stad die in het Grieks is genoemd naar haar gezouten vis, hoewel Plinius Tarichea aan het zuidelijke uiteinde van het meer plaatst. Opgravingen tonen een stad die in de hellenistische tijd werd gesticht en haar hoogtepunt bereikte in de vroege Romeinse tijd; tot de bouw van Tiberias was zij de belangrijkste stad aan de westoever. Na de nederlaag van Crassus in 53 v.Chr. nam, zo vertelt Josephus, de Romeinse bevelhebber Cassius Tarichea in en voerde ongeveer 30.000 joden weg in slavernij."
    - "In de evangeliën was Maria, Magdalena genoemd, gewoonlijk opgevat als Maria van Magdala, een van de vrouwen die door Jezus genezen waren: uit haar, zegt Lukas, gingen zeven duivelen uit, en zij behoorde tot hen die Hem uit hun bezit dienden. Zij stond bij het kruis, en de opgestane Heer verscheen het eerst aan haar. Na de spijziging van de vierduizend kwam Jezus, in de tekst van de King James Version, in het gebied van Magdala; andere handschriften lezen Magadan, en Marcus noemt de plaats Dalmanuta, die niet is gelokaliseerd."
    - "Nero gaf Tarichea aan koning Agrippa II. In de opstand van 66 n.Chr. versterkte Josephus de stad, en in 67 reed Titus langs de oever naar binnen. Wie per boot vluchtte, werd op het meer door Vespasianus' schepen vernietigd, en 6.500 stierven in de stad en op het water. Van de gevangenen liet Vespasianus er 1.200 doden, stuurde 6.000 jonge mannen naar Nero om het kanaal door de landengte van Korinthe te graven, en verkocht er 30.400 als slaaf."
    - "Vanaf 2009 legde de Israëlische Oudheidkundige Dienst, onder Dina Avshalom-Gorni en Arfan Najar, een synagoge uit de eerste eeuw n.Chr. bloot met beschilderde muren en een mozaïekvloer. Daarin stond een uitgehouwen steenblok met een zevenarmige menora, een van de vroegst bekende afbeeldingen ervan. De wijk werd verlaten ten tijde van de opstand, en de opgravers verbinden het einde ervan met de Romeinse verovering. Franciscaanse opgravingen onder leiding van Stefano De Luca legden vanaf 2007 meer van de Romeinse stad bloot, die na de opstand als kleinere nederzetting voortbestond."
  cs:
    - "Magdala, z aramejského slova pro „věž“, ležela na západním břehu Galilejského jezera asi 5 km severně od města Tiberias, pod útesy hory Arbel, kde do roku 1948 stála vesnice al-Majdal. Obvykle se ztotožňuje s Taricheai, městem pojmenovaným řecky podle nasolených ryb, ač Plinius klade Taricheai na jižní konec jezera. Vykopávky ukazují město založené v helénistické době, které dosáhlo vrcholu v časné době římské; bylo hlavním městem západního břehu, dokud nebyla postavena Tiberias. Po Crassově porážce roku 53 př. n. l., vypráví Josephus, římský velitel Cassius dobyl Taricheai a odvlekl asi 30 000 Židů do otroctví."
    - "V evangeliích byla Marie zvaná Magdaléna, obvykle chápaná jako Marie z Magdaly, jednou ze žen uzdravených Ježíšem: z ní, praví Lukáš, vyšlo sedm démonů, a byla mezi těmi, které mu posluhovaly ze svých statků. Stála u kříže a vstalý Pán se zjevil nejprve jí. Po nasycení čtyř tisíců přišel Ježíš podle textu anglické Bible krále Jakuba do končin Magdaly; jiné rukopisy čtou Magadan a Marek jmenuje místo Dalmanuta, které nebylo nalezeno."
    - "Nero daroval Taricheai králi Agrippovi II. Ve vzpouře roku 66 n. l. je Josephus opevnil a roku 67 do nich Titus vjel podél břehu jezera. Ti, kdo prchali na lodích, byli na jezeře zničeni Vespasianovými loděmi a 6 500 jich zahynulo ve městě i na vodě. Z vězňů Vespasianus dal 1 200 zabít, 6 000 mladíků poslal Neronovi kopat průplav přes Korintskou šíji a 30 400 prodal do otroctví."
    - "Od roku 2009 odkryl Izraelský úřad pro starožitnosti pod vedením Diny Avshalom-Gorniové a Arfana Najara synagogu z 1. století n. l. s freskami na zdech a mozaikovou podlahou. Stál v ní vytesaný kamenný blok se sedmiramenným svícnem, jedním z nejstarších známých jeho zobrazení. Čtvrť byla opuštěna v době vzpoury a vykopávači spojují její konec s římským dobytím. Františkánské vykopávky vedené Stefanem De Lucou od roku 2007 odkryly další část římského města, které po vzpouře pokračovalo jako menší osada."
  sv:
    - "Magdala, av arameiskans ord för ”torn”, låg på Galileiska sjöns västra strand omkring 5 km norr om Tiberias, nedanför Arbels klippor, där byn al-Majdal stod till 1948. Den identifieras vanligen med Taricheai, en stad vars grekiska namn syftar på saltad fisk, fastän Plinius förlägger Taricheai vid sjöns södra ände. Utgrävningar visar en stad grundad under den hellenistiska perioden som nådde sin höjdpunkt under tidig romersk tid; den var huvudorten vid västra stranden tills Tiberias byggdes. Efter Crassus' nederlag 53 f.Kr., berättar Josefus, intog den romerske befälhavaren Cassius Taricheai och förde bort omkring 30 000 judar som slavar."
    - "I evangelierna var Maria som kallas Magdalena, vanligen tagen för Maria från Magdala, en av de kvinnor Jesus botade: ur henne, säger Lukas, gick sju demoner ut, och hon var bland dem som tjänade honom med sina tillgångar. Hon stod vid korset, och den uppståndne Herren visade sig först för henne. Efter mättandet av de fyra tusen kom Jesus, i King James-texten, till Magdalas bygder; andra handskrifter läser Magadan, och Markus nämner platsen Dalmanuta, som inte har lokaliserats."
    - "Nero gav Taricheai åt kung Agrippa II. Vid upproret år 66 befäste Josefus den, och år 67 red Titus in i den längs strandkanten. De som flydde i båtar förgjordes på sjön av Vespasianus' skepp, och 6 500 dog i staden och på vattnet. Av fångarna lät Vespasianus döda 1 200, sände 6 000 unga män till Nero för att gräva kanalen genom Korinths näs, och sålde 30 400 som slavar."
    - "Från 2009 grävde Israel Antiquities Authority, under Dina Avshalom-Gorni och Arfan Najar, fram en synagoga från första århundradet e.Kr. med freskmålade väggar och ett mosaikgolv. I den stod ett huggen stenblock med en sjuarmad menora, en av de tidigast kända reliefframställningarna av den. Kvarteret övergavs vid upprorets tid, och utgrävarna knyter dess slut till den romerska erövringen. Franciskanska utgrävningar under Stefano De Luca från 2007 grävde fram mer av den romerska staden, som levde vidare som en mindre bosättning efter upproret."
  nb:
    - "Magdala, fra det arameiske ordet for «tårn», lå på vestkysten av Galileasjøen omkring 5 km nord for Tiberias, under klippene på Arbel-fjellet, der landsbyen al-Majdal sto til 1948. Den identifiseres vanligvis med Taricheae, en by som på gresk er oppkalt etter sin saltede fisk, selv om Plinius plasserer Taricheae ved sørenden av sjøen. Utgravninger viser en by grunnlagt i hellenistisk tid som nådde sitt høydepunkt tidlig i romertiden; den var hovedbyen på vestkysten til Tiberias ble bygget. Etter Crassus' nederlag i 53 f.Kr., forteller Josefus, tok den romerske sjefen Cassius Taricheae og førte omkring 30 000 jøder bort som slaver."
    - "I evangeliene var Maria kalt Magdalena, vanligvis forstått som Maria fra Magdala, en av kvinnene Jesus helbredet: Lukas sier at syv onde ånder var faret ut av henne, og hun var blant dem som tjente ham med det de eide. Hun sto ved korset, og den oppstandne Herre viste seg først for henne. Etter at han hadde mettet de fire tusen, kom Jesus, i King James-teksten, til Magdalas kyst; andre håndskrifter har Magadan, og Markus kaller stedet Dalmanuta, som ikke er lokalisert."
    - "Nero ga Taricheae til kong Agrippa II. I opprøret i 66 e.Kr. befestet Josefus den, og i 67 red Titus inn i den langs sjøstranden. De som flyktet i båter, ble ødelagt på sjøen av Vespasians skip, og 6500 døde i byen og på vannet. Av fangene lot Vespasian 1200 drepe, sendte 6000 unge menn til Nero for å grave kanalen gjennom Korint-neset, og solgte 30 400 som slaver."
    - "Fra 2009 avdekket Israels oldtidsmyndighet, under Dina Avshalom-Gorni og Arfan Najar, en synagoge fra det første århundre e.Kr. med freskomalte vegger og mosaikkgulv. I den sto en utskåret steinblokk med en sjuarmet menora, et av de tidligste kjente relieffene av den. Kvarteret ble forlatt under opprøret, og utgraverne knytter dets slutt til den romerske erobringen. Fransiskanske utgravninger ledet av Stefano De Luca fra 2007 avdekket mer av den romerske byen, som fortsatte som en mindre bosetning etter opprøret."
