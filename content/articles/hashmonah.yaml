# Overview article (ADR 0007). Mainstream facts only; Hashmonah is known only from Numbers 33; the candidate sites, including the links with Heshmon and Azmon, are given as proposals.
id: hashmonah
place: aaa8a88
title:
  en: "Hashmonah"
  ru: "Хашмона"
body:
  en:
    - "Hashmonah is a camp of Israel in the wilderness, known only from the list of stations in Numbers 33: “And they went from Mithcah, and pitched in Hashmonah. And they departed from Hashmonah, and encamped at Moseroth.” From Moseroth the route led on to Bene-jaakan and Hor-hagidgad, so Hashmonah must have lain somewhere on the way through the Negeb or the north-eastern Sinai towards the Arabah, but the Bible tells no event there."
    - "Its site is unknown, and the proposals vary widely. The map follows those who link it with Heshmon, a town in the far south of Judah; others think of Azmon on the southern border of the land, or of places such as Qoseimeh and Wadi Umm Hashim near Kadesh or the mouth of Wadi Jirafi towards the Arabah, chosen for their position on the route or for an echo of the name. None has been confirmed, and nothing more is known of the camp."
  ru:
    - "Хашмона — стан Израиля в пустыне, известный только по списку стоянок в книге Чисел: «И отправились из Мифки и расположились станом в Хашмон. И отправились из Хашмоны и расположились станом в Мосерофе». От Мосерофа путь вёл к Бене-Яакану и Хор-Агидгаду, так что Хашмона должна была лежать где-то на пути через Негев или северо-восточный Синай к Араве, но никакого события там Библия не рассказывает."
    - "Где он был, неизвестно, и предположения сильно расходятся. Карта следует тем, кто связывает его с Хешмоном, городом на крайнем юге Иудеи; другие думают об Ацмоне на южной границе земли или о таких местах, как Кусейма и Вади-Умм-Хашим близ Кадеса или устье Вади-Джирафи ближе к Араве, — выбранных по положению на пути или по отзвуку имени. Ни одно из них не подтверждено, и больше о стане ничего не известно."
scripture:
  - Num.33.29-Num.33.32
sources:
  - "B. A. Levine, Numbers 21-36 (Anchor Bible, 2000)"
  - "G. I. Davies, The Way of the Wilderness: A Geographical Study of the Wilderness Itineraries in the Old Testament (1979)"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
