body:
  en:
    - "Hashmonah is a camp of Israel in the wilderness, known only from the list of stations in Numbers 33: “And they went from Mithcah, and pitched in Hashmonah. And they departed from Hashmonah, and encamped at Moseroth.” From Moseroth the route led on to Bene-jaakan and Hor-hagidgad, so Hashmonah must have lain somewhere on the way through the Negeb or the north-eastern Sinai towards the Arabah, but the Bible tells no event there."
    - "Its site is unknown, and the proposals vary widely. The map follows those who link it with Heshmon, a town in the far south of Judah; others think of Azmon on the southern border of the land, or of places such as Qoseimeh and Wadi Umm Hashim near Kadesh or the mouth of Wadi Jirafi towards the Arabah, chosen for their position on the route or for an echo of the name. None has been confirmed, and nothing more is known of the camp."
  ru:
    - "Хашмона — стан Израиля в пустыне, известный только по списку стоянок в 33-й главе книги Чисел: «И отправились из Мифки и расположились станом в Хашмон. И отправились из Хашмоны и расположились станом в Мосерофе». От Мосерофа путь вёл к Бене-Яакану и Хор-Агидгаду, так что Хашмона должна была лежать где-то на пути через Негев или северо-восточный Синай к Араве, но никакого события там Библия не рассказывает."
    - "Где он был, неизвестно, и предположения сильно расходятся. Карта следует тем, кто связывает его с Хешмоном, городом на крайнем юге Иудеи; другие думают об Ацмоне на южной границе земли или о таких местах, как Кусейма и Вади-Умм-Хашим близ Кадеса или устье Вади-Джирафи ближе к Араве, — выбранных по положению на пути или по отзвуку имени. Ни одно из них не подтверждено, и больше о стане ничего не известно."
  uk:
    - "Хашмона — стан Ізраїлю в пустелі, відомий лише з переліку стоянок у Числах 33: «І рушили з Митки та й отаборились у Гашмонї. І рушили з Гашмона та й отаборились у Мозеротї». Від Мосерота шлях вів далі до Бене-Яакана та Гор-Гідгада, тож Хашмона мала лежати десь на шляху через Негев або північно-східний Синай до Арави, але Біблія не розповідає там про жодну подію."
    - "Її місце невідоме, і пропозиції дуже різняться. Карта йде за тими, хто пов’язує її з Хешмоном, містом на крайньому півдні Юди; інші думають про Ацмон на південній межі краю, або про такі місця, як Кусейма й Ваді-Умм-Хашим поблизу Кадеша чи гирло Ваді-Джірафі в напрямку Арави, обрані за їхнім положенням на маршруті або за відлунням назви. Жодне не підтверджене, і нічого більше про цей стан невідомо."
  es:
    - "Hasmona es un campamento de Israel en el desierto, conocido solo por la lista de estaciones de Números 33: «Y partidos de Mithca, asentaron en Hasmona. Y partidos de Hasmona, asentaron en Moseroth». Desde Moserot la ruta seguía hacia Bene-jaacán y Hor-hagidgad, de modo que Hasmona debió de hallarse en algún punto del camino a través del Néguev o del nordeste del Sinaí hacia el Arabá, pero la Biblia no cuenta ningún suceso allí."
    - "Su emplazamiento se ignora, y las propuestas varían mucho. El mapa sigue a quienes la vinculan con Hesmón, una población del extremo sur de Judá; otros piensan en Asmón, en el límite meridional del país, o en lugares como Qoseimeh y el Wadi Umm Hashim, cerca de Cades, o la desembocadura del Wadi Jirafi hacia el Arabá, elegidos por su posición en la ruta o por un eco del nombre. Ninguno se ha confirmado, y no se sabe nada más del campamento."
  pt:
    - "Hasmona é um acampamento de Israel no deserto, conhecido apenas pela lista de estações de Números 33: “Partiram de Mitca e acamparam em Hasmona. Partiram de Hasmona e acamparam em Moserote.” De Moserote a rota seguia para Bene-Jaacã e Hor-Gidgade, de modo que Hasmona deve ter ficado em algum ponto do caminho pelo Neguebe ou pelo nordeste do Sinai em direção à Arabá, mas a Bíblia não conta nenhum acontecimento ali."
    - "Seu sítio é desconhecido, e as propostas variam muito. O mapa segue os que a ligam a Hesmom, uma cidade no extremo sul de Judá; outros pensam em Azmom, na fronteira meridional da terra, ou em lugares como Qoseimeh e o uádi Umm Hashim, perto de Cades, ou a foz do uádi Jirafi, rumo à Arabá, escolhidos por sua posição na rota ou por um eco do nome. Nenhuma foi confirmada, e nada mais se sabe do acampamento."
  de:
    - "Haschmona ist ein Lager Israels in der Wüste, nur aus der Stationenliste in 4. Mose 33 bekannt: „Von Mithka zogen sie aus und lagerten sich in Hasmona. Von Hasmona zogen sie aus und lagerten sich in Moseroth.“ Von Moserot führte die Route weiter nach Bne-Jaakan und Hor-Gidgad, Haschmona muss also irgendwo auf dem Weg durch den Negev oder den nordöstlichen Sinai zur Araba hin gelegen haben, doch die Bibel erzählt dort kein Ereignis."
    - "Seine Lage ist unbekannt, und die Vorschläge gehen weit auseinander. Die Karte folgt denen, die es mit Heschmon verbinden, einer Stadt im äußersten Süden Judas; andere denken an Azmon an der Südgrenze des Landes oder an Orte wie Kuseime und Wadi Umm Haschim bei Kadesch oder die Mündung des Wadi Dschirafi zur Araba hin, gewählt wegen ihrer Lage an der Route oder wegen eines Anklangs des Namens. Keiner ist bestätigt, und mehr ist über das Lager nicht bekannt."
  fr:
    - "Haschmona est un campement d’Israël dans le désert, connu seulement par la liste des étapes de Nombres 33 : « Ils partirent de Mithka, et campèrent à Haschmona. Ils partirent de Haschmona, et campèrent à Moséroth. » De Moséroth, l’itinéraire menait à Bené-Jaakan et à Hor-Guidgad, de sorte que Haschmona devait se trouver quelque part sur le chemin à travers le Négev ou le nord-est du Sinaï vers l’Araba, mais la Bible n’y rapporte aucun événement."
    - "Son site est inconnu, et les propositions varient largement. La carte suit ceux qui la rattachent à Heschmon, ville de l’extrême sud de Juda ; d’autres pensent à Atsmon, sur la frontière méridionale du pays, ou à des lieux tels que Qoseimeh et l’oued Umm Hashim, près de Qadesh, ou l’embouchure de l’oued Jirafi vers l’Araba, choisis pour leur position sur l’itinéraire ou pour un écho du nom. Aucun n’a été confirmé, et l’on ne sait rien de plus du campement."
  pl:
    - "Chaszmona to obóz Izraela na pustyni, znany tylko z wykazu stacji w Księdze Liczb 33: „A ruszywszy się z Metka, położyli się obozem w Hesman. A ruszywszy się z Hesman, położyli się obozem w Moserot”. Z Moserot trasa wiodła dalej do Bene-Jaakan i Chor-ha-Gidgad, więc Chaszmona musiała leżeć gdzieś na drodze przez Negew lub północno-wschodni Synaj ku Arabie, lecz Biblia nie opowiada tam żadnego zdarzenia."
    - "Jej położenie jest nieznane, a propozycje bardzo się różnią. Mapa idzie za tymi, którzy wiążą ją z Cheszmonem, miastem na dalekim południu Judy; inni myślą o Asmonie na południowej granicy kraju albo o miejscach takich jak Kuszejme i Wadi Umm Haszim koło Kadesz lub ujście Wadi Dżirafi ku Arabie, wybranych ze względu na położenie na trasie albo na echo nazwy. Żadnego nie potwierdzono i nic więcej o obozie nie wiadomo."
  it:
    - "Asmona è un accampamento d’Israele nel deserto, noto solo dall’elenco delle tappe in Numeri 33: «Partirono da Mithka e si accamparono a Hashmona. Partirono da Hashmona e si accamparono a Moseroth». Da Moserot il percorso proseguiva verso Bene-Iaakan e Hor-Ghidgad, perciò Asmona doveva trovarsi da qualche parte lungo il cammino attraverso il Negheb o il Sinai nord-orientale verso l’Araba, ma la Bibbia non racconta alcun evento là."
    - "Il suo sito è ignoto, e le proposte variano molto. La mappa segue quanti la collegano a Chesmon, una città dell’estremo sud di Giuda; altri pensano ad Asmon sul confine meridionale del paese, o a luoghi come Qoseimeh e Wadi Umm Hashim presso Kades o la foce del Wadi Jirafi verso l’Araba, scelti per la posizione sul percorso o per un’eco del nome. Nessuno è stato confermato, e nulla di più si sa dell’accampamento."
  nl:
    - "Chasmona is een legerplaats van Israël in de woestijn, alleen bekend uit de lijst van haltes in Numeri 33: “En zij verreisden van Mithka, en legerden zich in Hasmona. En zij verreisden van Hasmona, en legerden zich in Moseroth.” Vanaf Moserot leidde de route verder naar Bene-Jaäkan en Hor-Gidgad, dus Chasmona moet ergens hebben gelegen op de weg door de Negev of het noordoostelijke Sinaï richting de Araba, maar de Bijbel vermeldt er geen gebeurtenis."
    - "De plaats is onbekend, en de voorstellen lopen sterk uiteen. De kaart volgt degenen die haar verbinden met Chesmon, een stad in het uiterste zuiden van Juda; anderen denken aan Azmon op de zuidgrens van het land, of aan plaatsen als Qoseimeh en Wadi Umm Hashim bij Kades of de monding van de Wadi Jirafi richting de Araba, gekozen om hun ligging aan de route of om een echo van de naam. Niets is bevestigd, en verder is niets over de legerplaats bekend."
  cs:
    - "Chašmona je tábor Izraele na poušti, známý jen ze seznamu stanic v Numeri 33: „A hnuvše se z Metka, položili se v Esmona. Z Esmona pak hnuvše se, položili se v Moserot.“ Od Moserótu vedla cesta dále do Bené-jaakan a Chor-hagidgad, takže Chašmona musela ležet někde na cestě Negevem nebo severovýchodním Sinajem k Arabě, ale Bible tam nevypráví žádnou událost."
    - "Její poloha je neznámá a návrhy se široce liší. Mapa následuje ty, kdo ji spojují s Chešmonem, městem v nejzazším jihu Judska; jiní myslí na Acmon na jižní hranici země nebo na místa jako Qoseimeh a Wádí Umm Hashim poblíž Kádeše či ústí Wádí Jirafi směrem k Arabě, zvolená pro svou polohu na trase nebo pro ozvěnu jména. Žádné nebylo potvrzeno a o táboře nic dalšího není známo."
  sv:
    - "Hashmona är ett av Israels läger i öknen, känt bara från stationsförteckningen i Fjärde Moseboken 33: ”Och de bröto upp från Mitka och lägrade sig i Hasmona. Och de bröto upp från Hasmona och lägrade sig i Moserot.” Från Moserot ledde vägen vidare till Bene-Jaakan och Hor-Haggidgad, så Hashmona måste ha legat någonstans på färden genom Negev eller nordöstra Sinai mot Arava, men Bibeln berättar ingen händelse där."
    - "Dess läge är okänt, och förslagen varierar vitt. Kartan följer dem som kopplar det till Heshmon, en stad i yttersta södra Juda; andra tänker på Asmon vid landets södra gräns, eller på platser som Qoseimeh och Wadi Umm Hashim nära Kadesh eller mynningen av Wadi Jirafi mot Arava, valda för sitt läge på färdvägen eller för ett eko av namnet. Ingen har bekräftats, och inget mer är känt om lägret."
  nb:
    - "Hasjmona er en leir for Israel i ørkenen, kjent bare fra listen over stasjoner i Fjerde Mosebok 33: «Og de drog fra Mitka og leiret sig i Hasmona. Og de drog fra Hasmona og leiret sig i Moserot.» Fra Moserot gikk ruten videre til Bene-Jaakan og Hor-Hagidgad, så Hasjmona må ha ligget et sted på veien gjennom Negev eller det nordøstlige Sinai mot Arava, men Bibelen forteller ingen hendelse der."
    - "Stedet er ukjent, og forslagene varierer sterkt. Kartet følger dem som knytter det til Hesjmon, en by lengst sør i Juda; andre tenker på Asmon på landets sørgrense, eller på steder som Qoseimeh og Wadi Umm Hashim nær Kadesj eller munningen av Wadi Jirafi mot Arava, valgt for sin plass på ruten eller for et ekko av navnet. Ingen er bekreftet, og ingenting mer er kjent om leiren."
  tl:
    - "Ang Hasmona ay isang kampo ng Israel sa ilang, na kilala lamang mula sa talaan ng mga hantungan sa Mga Bilang 33: “At sila'y naglakbay mula sa Mithca, at humantong sa Hasmona. At sila'y naglakbay mula sa Hasmona, at humantong sa Moseroth.” Mula sa Moseroth ang ruta ay nagpatuloy sa Bene-jaacan at Hor-hagidgad, kaya't ang Hasmona ay dapat na nasa isang lugar sa daan sa Negeb o hilagang-silangang Sinai patungo sa Araba, ngunit walang isinasalaysay ang Biblia na pangyayari doon."
    - "Hindi alam ang lugar nito, at malawak ang pagkakaiba ng mga mungkahi. Sinusunod ng mapa ang mga nag-uugnay dito sa Hesmon, isang bayan sa dulong timog ng Juda; iniisip ng iba ang Asmon sa timog na hangganan ng lupain, o mga lugar gaya ng Qoseimeh at Wadi Umm Hashim malapit sa Cades o ang bukana ng Wadi Jirafi patungo sa Araba, na pinili dahil sa kanilang posisyon sa ruta o sa alingawngaw ng pangalan. Wala sa mga ito ang nakumpirma, at wala nang higit na nalalaman tungkol sa kampo."
  da:
    - "Hasjmona er en af Israels lejre i ørkenen, kendt kun fra stationslisten i Fjerde Mosebog 33: »Og de rejste fra Mithka, og de lejrede sig i Hasmona. Og de rejste fra Hasmona, og de lejrede sig i Moseroth.« Fra Moserot gik ruten videre til Bene-Ja'akan og Hor-ha-Gidgad, så Hasjmona må have ligget et sted på vejen gennem Negev eller det nordøstlige Sinaj mod Araba, men Bibelen fortæller ingen begivenhed dér."
    - "Dens sted er ukendt, og forslagene varierer vidt. Kortet følger dem, der forbinder det med Hesjmon, en by i det yderste syd af Juda; andre tænker på Asmon på landets sydgrænse eller på steder som Qoseimeh og Wadi Umm Hashim nær Kadesj eller mundingen af Wadi Jirafi mod Araba, valgt for deres placering på ruten eller for et ekko af navnet. Ingen er bekræftet, og mere vides ikke om lejren."
  sr:
    - "Асмона је логор Израиља у пустињи, познат само из списка станица у Бројевима 33: „А из Метека отишавши стадоше у логор у Аселмону. А из Аселмона отишавши стадоше у логор у Мосироту.“ Од Мосирота пут је водио даље до Бене-Јакана и Хор-Хагидгада, па је Асмона морала лежати негде на путу кроз Негев или североисточни Синај према Арави, али Библија не казује ни један догађај тамо."
    - "Његово место је непознато, а предлози се јако разликују. Карта следи оне који га повезују с Есемоном, градом на крајњем југу Јуде; други мисле на Аселмон на јужној граници земље, или на места као Кусејма и Вади Ум Хашим близу Кадиса или ушће Вади Џирафи према Арави, изабрана због положаја на путу или одјека имена. Ништа није потврђено и ништа више се о логору не зна."
scripture:
  - Num.33.29-Num.33.32
  - Num.34.4
