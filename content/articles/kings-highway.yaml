# Overview article (ADR 0007). Mainstream facts only; whether the name meant one fixed road is named as uncertain.
id: kings-highway
place: a057d59
title:
  en: "King’s Highway"
  ru: "Дорога царская"
  uk: "Дорога царська"
  es: "Camino Real"
  pt: "Estrada Real"
  de: "Königsstraße"
  fr: "Route du Roi"
  it: "Strada del Re"
  pl: "Droga Królewska"
