# Overview article (ADR 0007). Mainstream facts only; whether the name meant one fixed road is named as uncertain.
id: kings-highway
place: a057d59
title:
  en: "King’s Highway"
  ru: "Дорога царская"
  uk: "Дорога царська"
  es: "Camino Real"
  pt: "Estrada Real"
  de: "Königsstraße"
  fr: "Route du Roi"
body:
  en:
    - "The King’s Highway is the road by which Moses twice asked leave to cross a neighbour’s land at the end of the wilderness years. From Kadesh he sent to the king of Edom: “we will go by the king’s high way, we will not turn to the right hand nor to the left, until we have passed thy borders”; Edom refused and came out against Israel with a strong force, so Israel turned away. Later he sent the same request to Sihon, king of the Amorites: “we will go along by the king’s high way, until we be past thy borders”; Sihon too refused and was defeated at Jahaz. These two verses are the only places the Bible uses the name, and it is not certain that it was the proper name of one road rather than a term for a main public route."
    - "It is usually taken to be the north–south route along the plateau east of the Jordan and the Arabah, from the Gulf of Aqaba through Edom and Moab to Damascus, the line of springs and towns that caravans followed for millennia. The Romans paved much the same course as the Via Nova Traiana between Bostra and Aila after AD 106. Today Jordan’s Highway 35, which runs through Madaba, Dhiban, Kerak and Tafila towards Petra, is still called the King’s Highway, though how closely it follows the road of Moses’ time is a matter of reconstruction, not of evidence."
  ru:
    - "Дорога царская — путь, по которому Моисей в конце странствий по пустыне дважды просил позволения пройти через землю соседей. Из Кадеса он послал к царю Едомскому: «пойдем дорогою царскою, не своротим ни направо ни налево, доколе не перейдем пределов твоих»; Едом отказал и вышел против Израиля с сильным войском, и Израиль уклонился от него. Позже ту же просьбу услышал Сигон, царь Аморрейский: «пойдем путем царским, доколе не перейдем пределов твоих»; Сигон тоже отказал и был разбит при Иааце. Только в этих двух стихах Библия употребляет это имя, и неясно, было ли оно названием одной определённой дороги или просто обозначало главный общественный путь."
    - "Обычно его понимают как дорогу с юга на север по плато к востоку от Иордана и Аравы — от залива Акаба через Едом и Моав к Дамаску, вдоль цепочки источников и городов, по которой караваны ходили тысячелетиями. Римляне после 106 г. н. э. проложили почти по той же линии мощёную Новую Траянову дорогу между Бострой и Айлой. Сегодня иорданское шоссе № 35, проходящее через Мадабу, Дибан, Керак и Тафилу к Петре, по-прежнему называют Царской дорогой, хотя насколько точно оно повторяет путь времён Моисея — вопрос реконструкции, а не свидетельств."
  uk:
    - "Дорога царська — це шлях, яким Мойсей двічі просив дозволу пройти землею сусіда наприкінці років блукання пустелею. З Кадеша він послав до царя Едому: «по царській дорозї перейдемо, не будемо звертати нї на право, нї на ліво, докіль не перейдемо займища твого»; Едом відмовив і вийшов проти Ізраїлю з великою силою, тож Ізраїль повернув убік. Пізніше він передав те саме прохання Сігонові, цареві аморіїв: «шляхом царським ійти мемо, покіль перейдемо твої займища»; Сігон також відмовив і був розбитий біля Яци. Ці два вірші — єдині місця, де Біблія вживає цю назву, і не певно, чи це була власна назва однієї дороги, а не позначення головного загальнодоступного шляху."
    - "Її зазвичай ототожнюють із шляхом з півночі на південь по плато на схід від Йордану та Арави, від Акабської затоки через Едом і Моав до Дамаска, — лінією джерел і міст, якою ходили каравани тисячоліттями. Римляни після 106 р. н. е. вимостили майже той самий маршрут як Нову Траянову дорогу (Via Nova Traiana) між Босрою й Айлою. Нині йорданська траса № 35, що проходить через Мадабу, Дібан, Керак і Тафілу в напрямку Петри, досі зветься Дорогою царською, хоча наскільки точно вона повторює шлях часів Мойсея — це питання реконструкції, а не свідчень."
  es:
    - "El Camino Real es la ruta por la que Moisés pidió en dos ocasiones permiso para atravesar la tierra de un vecino al final de los años del desierto. Desde Cades envió mensajeros al rey de Edom: «por el camino real iremos, sin apartarnos á la diestra ni á la siniestra, hasta que hayamos pasado tu término»; Edom se negó y salió contra Israel con una fuerza poderosa, de modo que Israel se desvió. Más tarde envió la misma petición a Sehón, rey de los amorreos: «por el camino real iremos, hasta que pasemos tu término»; Sehón también se negó y fue derrotado en Jahaza. Estos dos versículos son los únicos lugares donde la Biblia emplea el nombre, y no es seguro que fuera el nombre propio de un camino concreto y no un término para designar una vía pública principal."
    - "Suele entenderse que es la ruta de norte a sur a lo largo de la meseta al este del Jordán y del Arabá, desde el golfo de Aqaba, a través de Edom y Moab, hasta Damasco, la línea de manantiales y ciudades que las caravanas siguieron durante milenios. Los romanos pavimentaron casi el mismo trazado como Via Nova Traiana entre Bostra y Aila después del año 106 d. C. Hoy la carretera 35 de Jordania, que pasa por Madaba, Dhiban, Kerak y Tafila hacia Petra, se sigue llamando Camino Real, aunque hasta qué punto sigue la ruta de los tiempos de Moisés es una cuestión de reconstrucción, no de pruebas."
  pt:
    - "A Estrada Real é a estrada pela qual Moisés pediu duas vezes licença para atravessar a terra de um vizinho ao fim dos anos no deserto. De Cades enviou mensageiros ao rei de Edom: “Iremos pela estrada do rei. Não nos desviaremos nem para a direita nem para a esquerda, até que tenhamos passado pela sua fronteira”; Edom recusou e saiu contra Israel com grande força, de modo que Israel se desviou. Mais tarde fez o mesmo pedido a Seom, rei dos amorreus: “Iremos pela estrada do rei, até que tenhamos passado pela sua fronteira”; Seom também recusou e foi derrotado em Jaza. Esses dois versículos são os únicos lugares em que a Bíblia usa o nome, e não é certo que fosse o nome próprio de uma única estrada, e não um termo para uma via pública principal."
    - "Costuma-se entendê-la como a rota norte–sul ao longo do planalto a leste do Jordão e do Arabá, do golfo de Aqaba por Edom e Moabe até Damasco, a linha de fontes e cidades que as caravanas seguiram por milênios. Os romanos pavimentaram praticamente o mesmo traçado como a Via Nova Trajana entre Bostra e Aila depois de 106 d.C. Hoje a Rodovia 35 da Jordânia, que passa por Madaba, Dhiban, Kerak e Tafila rumo a Petra, ainda se chama Estrada Real, embora o quanto ela segue a estrada do tempo de Moisés seja questão de reconstrução, e não de evidência."
  de:
    - "Die Königsstraße ist der Weg, auf dem Mose am Ende der Wüstenjahre zweimal um Erlaubnis bat, das Land eines Nachbarn zu durchqueren. Von Kadesch ließ er dem König von Edom sagen: „die Landstraße wollen wir ziehen, weder zur Rechten noch zur Linken weichen, bis wir durch deine Grenze kommen“; Edom weigerte sich und zog Israel mit starkem Volk entgegen, sodass Israel auswich. Später richtete er dieselbe Bitte an Sihon, den König der Amoriter: „die Landstraße wollen wir ziehen, bis wir durch deine Grenze kommen“; auch Sihon verweigerte und wurde bei Jahaz besiegt. Diese beiden Verse sind die einzigen Stellen, an denen die Bibel den Namen verwendet, und es ist nicht sicher, dass es der Eigenname einer bestimmten Straße war und nicht eine Bezeichnung für eine öffentliche Hauptstraße."
    - "Man nimmt meist an, es sei die Nord-Süd-Route auf der Hochebene östlich des Jordan und der Araba, vom Golf von Akaba durch Edom und Moab nach Damaskus, die Linie von Quellen und Städten, der Karawanen jahrtausendelang folgten. Die Römer pflasterten nach 106 n. Chr. ungefähr denselben Verlauf als Via Nova Traiana zwischen Bostra und Aila. Jordaniens Highway 35, der über Madaba, Dhiban, Kerak und Tafila Richtung Petra führt, heißt heute noch Königsstraße, doch wie genau er der Straße zur Zeit des Mose folgt, ist eine Frage der Rekonstruktion, nicht des Belegs."
  fr:
    - "La Route du Roi est la voie par laquelle Moïse demanda deux fois la permission de traverser le pays d’un voisin à la fin des années du désert. De Qadesh, il envoya dire au roi d’Édom : « nous suivrons la route royale, sans nous détourner à droite ou à gauche, jusqu’à ce que nous ayons franchi ton territoire » ; Édom refusa et sortit contre Israël en force, de sorte qu’Israël se détourna. Plus tard, il adressa la même demande à Sihon, roi des Amoréens : « nous suivrons la route royale, jusqu’à ce que nous ayons franchi ton territoire » ; Sihon refusa lui aussi et fut battu à Jahats. Ces deux versets sont les seuls endroits où la Bible emploie le nom, et il n’est pas certain qu’il ait été le nom propre d’une route plutôt qu’un terme désignant une grande voie publique."
    - "On y voit d’ordinaire la route nord-sud qui suit le plateau à l’est du Jourdain et de l’Araba, du golfe d’Aqaba à Damas en passant par Édom et Moab, la ligne de sources et de villes que suivirent les caravanes pendant des millénaires. Les Romains pavèrent à peu près le même tracé comme Via Nova Traiana entre Bostra et Aila après 106 apr. J.-C. Aujourd’hui, la route 35 de Jordanie, qui traverse Madaba, Dhiban, Kerak et Tafila en direction de Pétra, s’appelle encore la Route du Roi, mais dans quelle mesure elle suit la route du temps de Moïse relève de la reconstruction, non de la preuve."
scripture:
  - Num.20.14-Num.20.21
  - Num.21.21-Num.21.24
sources:
