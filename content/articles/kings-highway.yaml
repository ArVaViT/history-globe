body:
  en:
    - "The King’s Highway is the road by which Moses twice asked leave to cross a neighbour’s land at the end of the wilderness years. From Kadesh he sent to the king of Edom: “we will go by the king’s high way, we will not turn to the right hand nor to the left, until we have passed thy borders”; Edom refused and came out against Israel with a strong force, so Israel turned away. Later Israel sent the same request to Sihon, king of the Amorites: “we will go along by the king’s high way, until we be past thy borders”; Sihon too refused and was defeated at Jahaz. These two verses are the only places the Bible uses the name, and it is not certain that it was the proper name of one road rather than a term for a main public route."
    - "It is usually taken to be the north–south route along the plateau east of the Jordan and the Arabah, from the Gulf of Aqaba through Edom and Moab to Damascus, the line of springs and towns that caravans followed for millennia. The Romans paved much the same course as the Via Nova Traiana between Bostra and Aila after AD 106. Today Jordan’s Highway 35, which runs through Madaba, Dhiban, Kerak and Tafila towards Petra, is still called the King’s Highway, though how closely it follows the road of Moses’ time is a matter of reconstruction, not of evidence."
  ru:
    - "Дорога царская — путь, по которому Моисей в конце странствий по пустыне дважды просил позволения пройти через землю соседей. Из Кадеса он послал к царю Едомскому: «пойдем дорогою царскою, не своротим ни направо ни налево, доколе не перейдем пределов твоих»; Едом отказал и вышел против Израиля с сильным войском, и Израиль уклонился от него. Позже Израиль обратился с той же просьбой к Сигону, царь Аморрейский: «пойдем путем царским, доколе не перейдем пределов твоих»; Сигон тоже отказал и был разбит при Иааце. Только в этих двух стихах Библия употребляет это имя, и неясно, было ли оно названием одной определённой дороги или просто обозначало главный общественный путь."
    - "Обычно его понимают как дорогу с юга на север по плато к востоку от Иордана и Аравы — от залива Акаба через Едом и Моав к Дамаску, вдоль цепочки источников и городов, по которой караваны ходили тысячелетиями. Римляне после 106 г. н. э. проложили почти по той же линии мощёную Новую Траянову дорогу между Бострой и Айлой. Сегодня иорданское шоссе № 35, проходящее через Мадабу, Дибан, Керак и Тафилу к Петре, по-прежнему называют Царской дорогой, хотя насколько точно оно повторяет путь времён Моисея — вопрос реконструкции, а не свидетельств."
  uk:
    - "Дорога царська — це шлях, яким Мойсей двічі просив дозволу пройти землею сусіда наприкінці років блукання пустелею. З Кадеша він послав до царя Едому: «по царській дорозї перейдемо, не будемо звертати нї на право, нї на ліво, докіль не перейдемо займища твого»; Едом відмовив і вийшов проти Ізраїлю з великою силою, тож Ізраїль повернув убік. Пізніше Ізраїль передав те саме прохання Сігонові, цареві аморіїв: «шляхом царським ійти мемо, покіль перейдемо твої займища»; Сігон також відмовив і був розбитий біля Яци. Ці два вірші — єдині місця, де Біблія вживає цю назву, і не певно, чи це була власна назва однієї дороги, а не позначення головного загальнодоступного шляху."
    - "Її зазвичай ототожнюють із шляхом з півночі на південь по плато на схід від Йордану та Арави, від Акабської затоки через Едом і Моав до Дамаска, — лінією джерел і міст, якою ходили каравани тисячоліттями. Римляни після 106 р. н. е. вимостили майже той самий маршрут як Нову Траянову дорогу (Via Nova Traiana) між Босрою й Айлою. Нині йорданська траса № 35, що проходить через Мадабу, Дібан, Керак і Тафілу в напрямку Петри, досі зветься Дорогою царською, хоча наскільки точно вона повторює шлях часів Мойсея — це питання реконструкції, а не свідчень."
  es:
    - "El Camino Real es la ruta por la que Moisés pidió en dos ocasiones permiso para atravesar la tierra de un vecino al final de los años del desierto. Desde Cades envió mensajeros al rey de Edom: «por el camino real iremos, sin apartarnos á la diestra ni á la siniestra, hasta que hayamos pasado tu término»; Edom se negó y salió contra Israel con una fuerza poderosa, de modo que Israel se desvió. Más tarde Israel envió la misma petición a Sehón, rey de los amorreos: «por el camino real iremos, hasta que pasemos tu término»; Sehón también se negó y fue derrotado en Jahaza. Estos dos versículos son los únicos lugares donde la Biblia emplea el nombre, y no es seguro que fuera el nombre propio de un camino concreto y no un término para designar una vía pública principal."
    - "Suele entenderse que es la ruta de norte a sur a lo largo de la meseta al este del Jordán y del Arabá, desde el golfo de Aqaba, a través de Edom y Moab, hasta Damasco, la línea de manantiales y ciudades que las caravanas siguieron durante milenios. Los romanos pavimentaron casi el mismo trazado como Via Nova Traiana entre Bostra y Aila después del año 106 d. C. Hoy la carretera 35 de Jordania, que pasa por Madaba, Dhiban, Kerak y Tafila hacia Petra, se sigue llamando Camino Real, aunque hasta qué punto sigue la ruta de los tiempos de Moisés es una cuestión de reconstrucción, no de pruebas."
  pt:
    - "A Estrada Real é a estrada pela qual Moisés pediu duas vezes licença para atravessar a terra de um vizinho ao fim dos anos no deserto. De Cades enviou mensageiros ao rei de Edom: “Iremos pela estrada do rei. Não nos desviaremos nem para a direita nem para a esquerda, até que tenhamos passado pela sua fronteira”; Edom recusou e saiu contra Israel com grande força, de modo que Israel se desviou. Mais tarde Israel fez o mesmo pedido a Seom, rei dos amorreus: “Iremos pela estrada do rei, até que tenhamos passado pela sua fronteira”; Seom também recusou e foi derrotado em Jaza. Esses dois versículos são os únicos lugares em que a Bíblia usa o nome, e não é certo que fosse o nome próprio de uma única estrada, e não um termo para uma via pública principal."
    - "Costuma-se entendê-la como a rota norte–sul ao longo do planalto a leste do Jordão e do Arabá, do golfo de Aqaba por Edom e Moabe até Damasco, a linha de fontes e cidades que as caravanas seguiram por milênios. Os romanos pavimentaram praticamente o mesmo traçado como a Via Nova Trajana entre Bostra e Aila depois de 106 d.C. Hoje a Rodovia 35 da Jordânia, que passa por Madaba, Dhiban, Kerak e Tafila rumo a Petra, ainda se chama Estrada Real, embora o quanto ela segue a estrada do tempo de Moisés seja questão de reconstrução, e não de evidência."
  de:
    - "Die Königsstraße ist der Weg, auf dem Mose am Ende der Wüstenjahre zweimal um Erlaubnis bat, das Land eines Nachbarn zu durchqueren. Von Kadesch ließ er dem König von Edom sagen: „die Landstraße wollen wir ziehen, weder zur Rechten noch zur Linken weichen, bis wir durch deine Grenze kommen“; Edom weigerte sich und zog Israel mit starkem Volk entgegen, sodass Israel auswich. Später richtete Israel dieselbe Bitte an Sihon, den König der Amoriter: „die Landstraße wollen wir ziehen, bis wir durch deine Grenze kommen“; auch Sihon verweigerte und wurde bei Jahaz besiegt. Diese beiden Verse sind die einzigen Stellen, an denen die Bibel den Namen verwendet, und es ist nicht sicher, dass es der Eigenname einer bestimmten Straße war und nicht eine Bezeichnung für eine öffentliche Hauptstraße."
    - "Man nimmt meist an, es sei die Nord-Süd-Route auf der Hochebene östlich des Jordan und der Araba, vom Golf von Akaba durch Edom und Moab nach Damaskus, die Linie von Quellen und Städten, der Karawanen jahrtausendelang folgten. Die Römer pflasterten nach 106 n. Chr. ungefähr denselben Verlauf als Via Nova Traiana zwischen Bostra und Aila. Jordaniens Highway 35, der über Madaba, Dhiban, Kerak und Tafila Richtung Petra führt, heißt heute noch Königsstraße, doch wie genau er der Straße zur Zeit des Mose folgt, ist eine Frage der Rekonstruktion, nicht des Belegs."
  fr:
    - "La Route du Roi est la voie par laquelle Moïse demanda deux fois la permission de traverser le pays d’un voisin à la fin des années du désert. De Qadesh, il envoya dire au roi d’Édom : « nous suivrons la route royale, sans nous détourner à droite ou à gauche, jusqu’à ce que nous ayons franchi ton territoire » ; Édom refusa et sortit contre Israël en force, de sorte qu’Israël se détourna. Plus tard, Israël adressa la même demande à Sihon, roi des Amoréens : « nous suivrons la route royale, jusqu’à ce que nous ayons franchi ton territoire » ; Sihon refusa lui aussi et fut battu à Jahats. Ces deux versets sont les seuls endroits où la Bible emploie le nom, et il n’est pas certain qu’il ait été le nom propre d’une route plutôt qu’un terme désignant une grande voie publique."
    - "On y voit d’ordinaire la route nord-sud qui suit le plateau à l’est du Jourdain et de l’Araba, du golfe d’Aqaba à Damas en passant par Édom et Moab, la ligne de sources et de villes que suivirent les caravanes pendant des millénaires. Les Romains pavèrent à peu près le même tracé comme Via Nova Traiana entre Bostra et Aila après 106 apr. J.-C. Aujourd’hui, la route 35 de Jordanie, qui traverse Madaba, Dhiban, Kerak et Tafila en direction de Pétra, s’appelle encore la Route du Roi, mais dans quelle mesure elle suit la route du temps de Moïse relève de la reconstruction, non de la preuve."
  it:
    - "La Strada del Re è la via per la quale Mosè chiese due volte il permesso di attraversare la terra di un vicino, alla fine degli anni nel deserto. Da Kades mandò a dire al re di Edom: «seguiremo la strada pubblica senza deviare né a destra né a sinistra finché abbiamo oltrepassato i tuoi confini»; Edom rifiutò e uscì contro Israele con molta gente, così Israele si allontanò. In seguito Israele inviò la stessa richiesta a Sicon, re degli Amorei: «seguiremo la strada pubblica finché abbiamo oltrepassato i tuoi confini»; anche Sicon rifiutò e fu sconfitto a Iaaz. Questi due versetti sono i soli luoghi in cui la Bibbia usa il nome (l’ebraico «via del re», che la Riveduta rende «strada pubblica»), e non è certo che fosse il nome proprio di una sola strada anziché un termine per una grande via pubblica."
    - "Di solito la si ritiene la via nord-sud lungo l’altopiano a oriente del Giordano e dell’Araba, dal Golfo di Aqaba attraverso Edom e Moab fino a Damasco, la linea di sorgenti e di città che le carovane seguirono per millenni. I Romani lastricarono più o meno lo stesso tracciato come Via Nova Traiana tra Bostra e Aila dopo il 106 d.C. Oggi la Highway 35 della Giordania, che passa per Màdaba, Dhiban, Kerak e Tafila verso Petra, è ancora chiamata Strada del Re, benché quanto da vicino essa segua la via del tempo di Mosè sia questione di ricostruzione, non di prove."
  pl:
    - "Droga Królewska to droga, którą Mojżesz dwukrotnie prosił o pozwolenie przejścia przez ziemię sąsiada pod koniec lat na pustyni. Z Kadesz posłał do króla Edomu: „gościńcem pójdziemy, nie uchylimy się na prawo ani na lewo, aż przejdziemy granice twoje”; Edom odmówił i wyszedł przeciw Izraelowi z wielkim wojskiem, więc Izrael zawrócił. Później Izrael wysłał tę samą prośbę do Sychona, króla Amorytów: „gościńcem pójdziemy, aż przejdziemy granice twoje”; Sychon również odmówił i został pobity pod Jahaz. Tylko w tych dwóch wersetach hebrajski tekst używa tej nazwy (Biblia Gdańska oddaje ją po prostu słowem „gościńcem”) i nie jest pewne, czy była to właściwa nazwa jednej drogi, a nie określenie głównego szlaku publicznego."
    - "Zwykle uważa się ją za szlak północ–południe wzdłuż płaskowyżu na wschód od Jordanu i Araby, od Zatoki Akaba przez Edom i Moab do Damaszku, czyli linię źródeł i miast, którą karawany podążały przez tysiąclecia. Rzymianie wybrukowali mniej więcej ten sam przebieg jako Via Nova Traiana między Bostrą a Ajlą po 106 r. n.e. Dziś jordańska Droga nr 35, biegnąca przez Madabę, Dhiban, Kerak i Tafilę w stronę Petry, wciąż nazywa się Drogą Królewską, choć to, jak ściśle biegnie ona śladem drogi z czasów Mojżesza, jest sprawą rekonstrukcji, a nie dowodów."
  nl:
    - "De Koningsweg is de weg waarlangs Mozes aan het eind van de woestijnjaren twee keer verlof vroeg om het land van een buurman te doorkruisen. Vanuit Kades zond hij aan de koning van Edom: “wij zullen den koninklijken weg gaan, wij zullen niet afwijken ter rechter- noch ter linkerhand, totdat wij door uw landpalen zullen getrokken zijn”; Edom weigerde en trok Israël met een sterke macht tegemoet, zodat Israël afweek. Later zond Israël hetzelfde verzoek aan Sihon, koning van de Amorieten: “wij zullen op den koninklijken weg gaan, totdat wij uw landpale doorgetogen zijn”; ook Sihon weigerde en werd bij Jahaz verslagen. Deze twee verzen zijn de enige plaatsen waar de Bijbel de naam gebruikt, en het is niet zeker dat het de eigennaam van één weg was en niet een term voor een openbare hoofdroute."
    - "Meestal wordt hij beschouwd als de noord-zuidroute over het plateau ten oosten van de Jordaan en de Araba, van de Golf van Akaba door Edom en Moab naar Damascus, de lijn van bronnen en steden die karavanen millennia hebben gevolgd. De Romeinen plaveiden na 106 n.Chr. vrijwel hetzelfde traject als de Via Nova Traiana tussen Bostra en Aila. De huidige Highway 35 van Jordanië, die via Madaba, Dhiban, Kerak en Tafila richting Petra loopt, heet nog steeds de Koningsweg (King's Highway), al is hoe nauwkeurig hij de weg uit Mozes' tijd volgt een kwestie van reconstructie en niet van bewijs."
  cs:
    - "Královská cesta je silnice, o jejíž přechod přes zemi souseda Mojžíš dvakrát požádal na konci let na poušti. Z Kádeše poslal ke králi Edómu: „cestou královskou půjdeme a neuchýlíme se na pravo ani na levo, dokavadž nepřejdeme mezí tvých“; Edóm odmítl a vytáhl proti Izraeli se silným vojskem, takže se Izrael obrátil jinam. Později poslal Izrael stejnou žádost Sichonovi, králi Amorejských: „cestou královskou půjdeme, dokavadž nepřejdeme pomezí tvého“; také Sichon odmítl a byl poražen u Jahace. Tyto dva verše jsou jediná místa, kde Bible to jméno užívá, a není jisté, zda šlo o vlastní jméno jedné cesty, nebo o označení hlavní veřejné trasy."
    - "Obvykle se pokládá za severojižní trasu po náhorní rovině východně od Jordánu a Araby, od Akabského zálivu přes Edóm a Moáb do Damašku, po linii pramenů a měst, kterou karavany sledovaly po tisíciletí. Římané vydláždili téměř stejný průběh jako Via Nova Traiana mezi Bostrou a Ailou po roce 106 n. l. Dnešní jordánská silnice č. 35, která vede přes Madabu, Dhibán, Kerak a Tafílu k Petře, se dosud nazývá Královská cesta, ačkoli to, jak věrně sleduje cestu z Mojžíšovy doby, je věcí rekonstrukce, ne důkazu."
  sv:
    - "Kungsvägen är den väg på vilken Mose två gånger bad om lov att korsa en grannes land i slutet av ökenvandringens år. Från Kadesh sände han till Edoms konung: ”stora vägen skola vi gå, utan att vika av vare sig till höger eller till vänster, till dess vi hava kommit igenom ditt område”; Edom vägrade och drog ut mot Israel med en stark styrka, så Israel vek av. Senare framförde Israel samma begäran till Sichon, amoréernas konung: ”Stora vägen skola vi gå, till dess vi hava kommit igenom ditt område”; även Sichon vägrade och besegrades vid Jahas. Dessa två verser är de enda ställen där Bibeln använder namnet (Bibeln 1917 har ”stora vägen”), och det är inte säkert att det var det egentliga namnet på en enda väg snarare än en beteckning för en allmän huvudled."
    - "Den antas vanligen vara nord–sydvägen längs platån öster om Jordan och Arava, från Akababukten genom Edom och Moab till Damaskus, den rad av källor och städer som karavaner följde i årtusenden. Romarna stenlade i stort sett samma sträckning som Via Nova Traiana mellan Bostra och Aila efter år 106 e.Kr. I dag kallas Jordaniens väg 35, som går genom Madaba, Dhiban, Kerak och Tafila mot Petra, fortfarande Kungsvägen, men hur nära den följer vägen på Moses tid är en fråga om rekonstruktion, inte om belägg."
  nb:
    - "Kongeveien er veien som Moses to ganger ba om tillatelse til å krysse et naboland ved, mot slutten av ørkenårene. Fra Kadesj sendte han bud til Edoms konge: «efter kongeveien vil vi dra og ikke bøie av hverken til høire eller til venstre, før vi er kommet gjennem ditt land»; Edom nektet og drog ut mot Israel med en sterk styrke, så Israel bøyde av. Senere sendte Israel den samme forespørselen til Sihon, amorittenes konge: «efter kongeveien vil vi dra, til vi er kommet gjennem ditt land»; også Sihon nektet og ble slått ved Jahas. Disse to versene er de eneste stedene Bibelen bruker navnet, og det er ikke sikkert at det var egennavnet på én bestemt vei og ikke en betegnelse på en offentlig hovedvei."
    - "Den regnes vanligvis for å være nord–sør-ruten langs høylandet øst for Jordan og Arava, fra Akababukta gjennom Edom og Moab til Damaskus, rekken av kilder og byer som karavaner fulgte i årtusener. Romerne brolagte omtrent den samme traseen som Via Nova Traiana mellom Bostra og Aila etter 106 e.Kr. I dag kalles Jordans vei 35, som går gjennom Madaba, Dhiban, Kerak og Tafila mot Petra, fortsatt Kongeveien, selv om hvor nøyaktig den følger veien fra Moses' tid, er et spørsmål om rekonstruksjon og ikke om belegg."
  tl:
    - "Ang Daang-hari ay ang daan kung saan dalawang beses humingi si Moises ng pahintulot na tumawid sa lupain ng kapitbahay sa pagtatapos ng mga taon sa ilang. Mula sa Cades ay nagpadala siya sa hari ng Edom: “kami ay manunuwid sa maluwang na lansangan, hindi kami liliko sa dakong kanan ni sa dakong kaliwa man hanggang sa maraanan namin ang iyong hangganan”; tumanggi ang Edom at lumabas laban sa Israel na may malakas na hukbo, kaya lumihis ang Israel. Kalaunan ay ipinadala ng Israel ang gayon ding kahilingan kay Sehon, hari ng mga Amorrheo: “kami ay magdadaan sa maluwang na lansangan, hanggang sa aming maraanan ang iyong hangganan”; tumanggi rin si Sehon at natalo sa Jahaz. Sa dalawang talatang ito lamang lumilitaw ang pangalan (“maluwang na lansangan” sa Ang Biblia), at hindi tiyak kung ito ang wastong pangalan ng isang daan at hindi lamang katawagan sa isang pangunahing pampublikong ruta."
    - "Karaniwang itinuturing itong ruta mula hilaga hanggang timog sa talampas sa silangan ng Jordan at ng Araba, mula sa Golpo ng Aqaba sa Edom at Moab hanggang Damasco, ang hanay ng mga bukal at bayang sinundan ng mga karabana sa loob ng mga milenyo. Halos iyon ding landas ang pinaglatagan ng mga Romano bilang Via Nova Traiana sa pagitan ng Bostra at Aila pagkatapos ng 106 AD. Ngayon, ang Highway 35 ng Jordan, na dumaraan sa Madaba, Dhiban, Kerak at Tafila patungong Petra, ay tinatawag pa ring Daang-hari, bagaman kung gaano ito kalapit sa daan noong panahon ni Moises ay usapin ng muling pagbubuo, hindi ng ebidensiya."
  da:
    - "Kongevejen er den vej, ad hvilken Moses to gange bad om lov til at krydse en nabos land i slutningen af ørkenårene. Fra Kadesj sendte han til kongen af Edom: »vi ville gaa ad Kongevejen, vi ville hverken bøje til den højre eller til den venstre Side, indtil vi ere komne igennem dit Landemærke«; Edom afslog og drog ud mod Israel med en stærk styrke, så Israel vendte af. Senere sendte Israel den samme anmodning til Sihon, amoritternes konge: »vi ville drage ad Kongevejen, indtil vi ere komne igennem dit Landemærke«; også Sihon afslog og blev slået ved Jahas. Disse to vers er de eneste steder, hvor Bibelen bruger navnet, og det er ikke sikkert, at det var det rette navn på én vej snarere end en betegnelse for en offentlig hovedvej."
    - "Den antages sædvanligvis at være nord–syd-ruten langs højsletten øst for Jordan og Araba, fra Akababugten gennem Edom og Moab til Damaskus, rækken af kilder og byer, som karavaner fulgte i årtusinder. Romerne brolagde omtrent samme forløb som Via Nova Traiana mellem Bostra og Aila efter 106 e.Kr. I dag kaldes Jordans landevej 35, der løber gennem Madaba, Dhiban, Kerak og Tafila mod Petra, stadig Kongevejen, selv om hvor nøje den følger Moses' tids vej er et spørgsmål om rekonstruktion, ikke om beviser."
  sr:
    - "Царски пут је пут којим је Мојсије двапут тражио допуштење да пређе земљу суседа на крају година у пустињи. Из Кадиса је послао едомском цару: „ићи ћемо царским путем, нећемо свратити ни на десно ни налево док не пређемо међу твоју“; Едом је одбио и изишао пред Израиља с јаком силом, па је Израиљ скренуо. Касније је Израиљ упутио исту молбу Сиону, цару аморејском: „ићи ћемо царским путем докле не пређемо међу твоју“; Сион је такође одбио и био потучен код Јасе. Та два стиха једина су места на којима Библија употребљава то име, и није сигурно да је оно било властито име једног пута, а не назив за главну јавну саобраћајницу."
    - "Обично се узима да је то правац север–југ дуж висоравни источно од Јордана и Араве, од Акапског залива кроз Едом и Моав до Дамаска, низ извора и градова којим су каравани ишли миленијумима. Римљани су поплочали скоро исти ток као Виа Нова Траиана између Бостре и Аиле после 106. н. е. Данас се јордански Пут 35, који води кроз Мадабу, Дибан, Керак и Тафилу према Петри, и даље зове Царски пут, мада је питање колико тачно прати пут из Мојсијевог доба ствар реконструкције, а не доказа."
  hu:
    - "A Királyi út az az út, amelyen Mózes a pusztai évek végén kétszer kért engedélyt, hogy átkelhessen egy szomszéd földjén. Kádesből követeket küldött Edom királyához: „az országúton megyünk, és nem térünk sem jobbra, sem balra, míg általmegyünk a te határodon”; Edom megtagadta, és nagy erővel kivonult Izráel ellen, így Izráel elfordult tőle. Később Izráel ugyanezt kérte Szihontól, az emoreusok királyától: „az országúton megyünk, míg átmegyünk a te határodon”; Szihon is megtagadta, és Jahacnál vereséget szenvedett. A Biblia a nevet (a Károli-fordítás „országút”-nak adja vissza) csak e két versben használja, és nem biztos, hogy egyetlen út sajátneve volt, nem pedig főbb nyilvános utak megnevezése."
    - "Rendszerint a Jordántól és az Arábától keletre húzódó fennsíkot követő észak–déli útnak tartják, az Akabai-öböltől Edomon és Moábon át Damaszkuszig, a források és városok vonalának, amelyet a karavánok évezredekig követtek. A rómaiak nagyjából ugyanezt a vonalat burkolták ki Via Nova Traiana néven Bostra és Aila között Kr. u. 106 után. Ma Jordánia 35-ös főútját, amely Madabán, Dhibanon, Kerakon és Tafilán át vezet Petra felé, még mindig Királyi útnak nevezik, bár hogy mennyire követi Mózes korának útját, az rekonstrukció kérdése, nem bizonyítéké."
  fi:
    - "Kuninkaantie on tie, jota pitkin Mooses pyysi kahdesti lupaa ylittää naapurin maa erämaavuosien lopulla. Kadeksesta hän lähetti sanansaattajat Edomin kuninkaalle: ”Poikkeamatta oikealle tai vasemmalle me kuljemme valtatietä, kunnes olemme päässeet alueesi läpi”; Edom kieltäytyi ja lähti Israelia vastaan vahvalla sotajoukolla, joten Israel väistyi. Myöhemmin Israel lähetti saman pyynnön Sihonille, amorilaisten kuninkaalle: ”Valtatietä me kuljemme, kunnes olemme päässeet sinun alueesi läpi”; Sihonkin kieltäytyi ja kukistettiin Jahasissa. Nämä kaksi jaetta ovat ainoat paikat, joissa Raamattu käyttää nimeä, eikä ole varmaa, oliko se yhden tien erisnimi vai yleinen nimitys pääreitille."
    - "Sen katsotaan yleensä olleen pohjois-eteläsuuntainen reitti Jordanin ja Araban itäpuolisella ylängöllä, Akabanlahdelta Edomin ja Moabin halki Damaskokseen, lähteiden ja kaupunkien linja, jota karavaanit seurasivat vuosituhansia. Roomalaiset päällystivät suunnilleen saman reitin Via Nova Traiana -tieksi Bostran ja Ailan välillä vuoden 106 jaa. jälkeen. Nykyään Jordanian valtatietä 35, joka kulkee Madaban, Dhibanin, Kerakin ja Tafilan kautta kohti Petraa, kutsutaan yhä Kuninkaantieksi, vaikka se, kuinka tarkasti se seuraa Mooseksen ajan tietä, on rekonstruktion eikä todisteiden asia."
  vi:
    - "Đường Cái Vua là con đường mà Môi-se hai lần xin phép đi qua đất của nước láng giềng vào cuối những năm trong đồng vắng. Từ Ca-đe, ông sai sứ đến vua Ê-đôm: “chúng tôi sẽ đi theo đường cái của vua, không xây qua bên hữu, cũng không xây qua bên tả cho đến chừng nào đã đi ngang khỏi bờ cõi của vua”; Ê-đôm từ chối và đem quân rất đông ra đón Y-sơ-ra-ên, nên Y-sơ-ra-ên quay đi. Về sau Y-sơ-ra-ên gửi lời xin tương tự cho Si-hôn, vua dân A-mô-rít: “cứ đi đường cái của vua cho đến chừng nào qua khỏi bờ cõi vua”; Si-hôn cũng từ chối và bị đánh bại tại Gia-hát. Hai câu này là những chỗ duy nhất Kinh Thánh dùng tên ấy, và không chắc đó là tên riêng của một con đường chứ không phải một thuật ngữ chỉ đường công cộng chính."
    - "Thường người ta coi đó là tuyến bắc–nam dọc cao nguyên phía đông Giô-đanh và A-ra-ba, từ vịnh Aqaba qua Ê-đôm và Mô-áp đến Đa-mách, dãy suối và thành mà các đoàn lữ hành đi theo suốt nhiều thiên niên kỷ. Người La Mã lát gần như cùng lộ trình ấy thành Via Nova Traiana giữa Bostra và Aila sau năm 106. Ngày nay Quốc lộ 35 của Gióc-đa-ni, chạy qua Madaba, Dhiban, Kerak và Tafila hướng về Petra, vẫn được gọi là Đường Cái Vua, dù nó bám sát con đường thời Môi-se đến mức nào là vấn đề của sự dựng lại, không phải của bằng chứng."
  ro:
    - "Drumul Regelui este calea pe care Moise a cerut de două ori îngăduința de a trece prin țara unui vecin, la sfârșitul anilor din pustie. De la Cades a trimis la regele Edomului: „pe drumul mare vom merge, nu ne vom abate la dreapta, nici la stânga, până vom trece hotarele tale”; Edomul a refuzat și a ieșit împotriva lui Israel cu o oaste puternică, așa că Israel s-a întors. Mai târziu, Israel a trimis aceeași cerere lui Sihon, regele amoriților: „pre calea împărătească vom merge, până ce vom trece hotarele tale”; și Sihon a refuzat și a fost învins la Iahaț. Aceste două versete sunt singurele locuri în care Biblia folosește numele, și nu este sigur că era numele propriu al unui drum anume, și nu un termen pentru un drum public principal."
    - "Este socotit de obicei drumul nord–sud de-a lungul podișului de la est de Iordan și de Araba, de la Golful Aqaba prin Edom și Moab până la Damasc, șirul de izvoare și cetăți pe care caravanele l-au urmat milenii. Romanii au pavat aproape același traseu ca Via Nova Traiana între Bostra și Aila după 106 d.Hr. Astăzi drumul 35 al Iordaniei, care trece prin Madaba, Dhiban, Kerak și Tafila spre Petra, se numește tot Drumul Regelui, deși cât de aproape urmează drumul din vremea lui Moise ține de reconstituire, nu de dovezi."
  bg:
    - "Царският път е пътят, по който Мойсей на два пъти поиска позволение да премине през земята на съседи в края на годините в пустинята. От Кадес той изпрати до едомския цар: „ще вървим през царския път: няма да свърнем ни надясно ни наляво доде преминем твоите предели“; Едом отказа и излезе срещу Израил със силна войска, затова Израил се отклони. По-късно Израил отправи същата молба до Сихон, аморейския цар: „през царския път ще вървим доде заминем твоите предели“; Сихон също отказа и бе разбит при Яхац. Тези два стиха са единствените места, където Библията използва името, и не е сигурно дали то е било собствено име на един път, а не обозначение за главен обществен път."
    - "Обикновено се смята, че това е пътят от север на юг по платото на изток от Йордан и Арава, от Акабския залив през Едом и Моав до Дамаск — линията от извори и градове, която керваните следвали хилядолетия. След 106 г. н.е. римляните павирали почти същото трасе като Via Nova Traiana между Бостра и Айла. Днес магистрала 35 в Йордания, която минава през Мадаба, Дибан, Керак и Тафила към Петра, все още се нарича Царският път, макар че доколко тя следва пътя от времето на Мойсей, е въпрос на реконструкция, а не на доказателства."
