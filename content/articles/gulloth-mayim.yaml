# Overview article (ADR 0007). Mainstream facts only; the springs are placed near Debir on the usual identification of Debir with Khirbet Rabud; nothing on the ground is certain. The Russian name is the Synodal phrase “источники вод”, not a proper name.
id: gulloth-mayim
place: aaa3eca
title:
  en: "Gulloth-mayim"
  ru: "Источники вод"
  uk: "Джерела вод"
  es: "Gulot-maim"
  pt: "Gulote-Maim"
  de: "Gulot-Majim"
  fr: "Gulloth-Maïm"
body:
  en:
    - "Gulloth-mayim, “springs of water”, are the springs that Achsah, Caleb's daughter, asked of her father when Othniel took Kiriath-sepher, that is Debir, and won her as his wife. Caleb had given her dry land in the south, and she said: “Give me a blessing; for thou hast given me a south land; give me also springs of water. And he gave her the upper springs, and the nether springs.” The story is told twice, in Joshua and again in Judges. The Hebrew gulloth means “basins” or “springs”; whether it was ever a proper name is uncertain, and the map treats these springs and the Upper Gulloth of the same verse as one place."
    - "That is all the Bible says. The springs must have lain near Debir, now generally identified with Khirbet Rabud, about 13 km south-west of Hebron; its excavator Moshe Kochavi pointed to the two wells of el-'Alaqa, an upper and a lower, about 3 km north of the mound, as the likely upper and nether springs. On the older identification of Debir with Tell Beit Mirsim they would lie elsewhere. Today the area is farmed hill country of the southern Hebron hills, in the West Bank."
  ru:
    - "Источники вод — те самые источники, которые Ахса, дочь Халева, попросила у отца, когда Гофониил взял Кириаф-Сефер, то есть Давир, и получил её в жёны. Халев дал ей сухую землю на юге, и она сказала: «дай мне благословение; ты дал мне землю полуденную, дай мне и источники вод. И дал он ей источники верхние и источники нижние». Рассказ приведён дважды, в книге Иисуса Навина и снова в книге Судей. Еврейское гуллот значит «чаши» или «источники»; было ли оно когда-либо собственным именем, неясно, и карта считает эти источники и Источники верхние того же стиха одним местом."
    - "Это всё, что говорит Библия. Источники должны были лежать близ Давира, который сейчас обычно отождествляют с Хирбет-Рабудом примерно в 13 км к юго-западу от Хеврона; его исследователь Моше Кохави указал на два колодца эль-Алака, верхний и нижний, примерно в 3 км к северу от холма, как на вероятные верхние и нижние источники. При прежнем отождествлении Давира с Телль-Бейт-Мирсимом они лежали бы в другом месте. Сегодня это возделанные холмы южной части Хевронского нагорья на Западном берегу."
  uk:
    - "Джерела вод (Гулот-майім), «джерела води», — це джерела, яких Ахса, дочка Калеба, попросила в батька, коли Отніїл узяв Кір’ят-Сефер, тобто Девір, і здобув її за дружину. Калеб дав їй сушу на півдні, і вона сказала: «Дай менї благословеннє; дав бо єси менї полуденню землю, дай же менї й криничані протоки. І дав їй Калеб криничані протоки верхові й криничані протоки низові». Оповідь розказано двічі, у Книзі Ісуса Навина і знову в Книзі Суддів. Давньоєврейське гулот означає «басейни» або «джерела»; чи це колись було власною назвою, не певно, і карта вважає ці джерела та Верхні джерела з того самого вірша одним місцем."
    - "Це все, що говорить Біблія. Джерела мали лежати поблизу Девіра, якого нині зазвичай ототожнюють із Хірбет-Рабуд, приблизно за 13 км на південний захід від Хеврона; його розкопувач Моше Кохаві вказав на дві криниці ель-Алака, верхню й нижню, приблизно за 3 км на північ від городища, як на ймовірні верхні й нижні джерела. За давнішого ототожнення Девіра з Телль-Бейт-Мірсім вони лежали б деінде. Сьогодні ця місцевість — оброблюваний гористий край південних хевронських пагорбів на Західному березі."
  es:
    - "Gulot-maim, «fuentes de aguas», son los manantiales que Acsa, hija de Caleb, pidió a su padre cuando Otoniel tomó Quiriat-séfer, es decir, Debir, y la ganó por esposa. Caleb le había dado tierra seca en el sur, y ella dijo: «Dame bendición: pues que me has dado tierra de secadal, dame también fuentes de aguas. El entonces le dió las fuentes de arriba, y las de abajo». El relato se cuenta dos veces, en Josué y de nuevo en Jueces. La palabra hebrea gulot significa «cuencas» o «manantiales»; es incierto que alguna vez fuera un nombre propio, y el mapa trata estos manantiales y las Gulot de Arriba del mismo versículo como un solo lugar."
    - "Eso es todo lo que dice la Biblia. Los manantiales debieron de estar cerca de Debir, hoy identificada generalmente con Khirbet Rabud, a unos 13 km al suroeste de Hebrón; su excavador Moshe Kochavi señaló los dos pozos de el-'Alaqa, uno superior y otro inferior, a unos 3 km al norte del montículo, como los probables manantiales de arriba y de abajo. Según la identificación más antigua de Debir con Tell Beit Mirsim, estarían en otra parte. Hoy la zona es una región montañosa cultivada de las colinas del sur de Hebrón, en Cisjordania."
  pt:
    - "Gulote-Maim, “fontes de água”, são as fontes que Acsa, filha de Calebe, pediu a seu pai quando Otniel tomou Quiriate-Sefer, isto é, Debir, e a ganhou por mulher. Calebe lhe dera terra seca no sul, e ela disse: “Dê-me uma bênção. Já que você me estabeleceu na terra do Sul, dê-me também fontes de água.” Então ele lhe deu as fontes superiores e as fontes inferiores. A história é contada duas vezes, em Josué e de novo em Juízes. O hebraico gulloth significa “bacias” ou “fontes”; se alguma vez foi um nome próprio é incerto, e o mapa trata estas fontes e o Gulote de Cima do mesmo versículo como um só lugar."
    - "Isso é tudo o que a Bíblia diz. As fontes devem ter ficado perto de Debir, hoje geralmente identificada com Khirbet Rabud, a cerca de 13 km a sudoeste de Hebrom; seu escavador, Moshe Kochavi, apontou os dois poços de el-’Alaqa, um superior e um inferior, a cerca de 3 km ao norte do monte, como prováveis fontes de cima e de baixo. Pela identificação mais antiga de Debir com Tell Beit Mirsim, ficariam em outro lugar. Hoje a área é região de colinas cultivadas nas colinas de Hebrom do sul, na Cisjordânia."
  de:
    - "Gulot-Majim, „Wasserquellen“, sind die Quellen, die Achsa, Kalebs Tochter, ihren Vater bat, als Otniël Kirjat-Sefer, das ist Debir, einnahm und sie zur Frau gewann. Kaleb hatte ihr trockenes Land im Süden gegeben, und sie sagte: „Gib mir einen Segen! Denn du hast mir ein Mittagsland gegeben; gib mir auch Wasserquellen! Da gab er ihr die Quellen von oben und unten.“ Die Geschichte wird zweimal erzählt, bei Josua und noch einmal im Buch der Richter. Das hebräische gulot bedeutet „Becken“ oder „Quellen“; ob es je ein Eigenname war, ist ungewiss, und die Karte behandelt diese Quellen und die Oberen Quellen desselben Verses als einen Ort."
    - "Das ist alles, was die Bibel sagt. Die Quellen müssen nahe bei Debir gelegen haben, das heute meist mit Chirbet Rabud gleichgesetzt wird, etwa 13 km südwestlich von Hebron; sein Ausgräber Moshe Kochavi verwies auf die beiden Brunnen von el-'Alaqa, einen oberen und einen unteren, etwa 3 km nördlich des Hügels, als die wahrscheinlichen oberen und unteren Quellen. Bei der älteren Gleichsetzung Debirs mit Tell Beit Mirsim lägen sie anderswo. Heute ist die Gegend bewirtschaftetes Bergland der südlichen Hebroner Berge im Westjordanland."
  fr:
    - "Gulloth-Maïm, « sources d’eau », sont les sources qu’Acsa, fille de Caleb, demanda à son père quand Othniel prit Kirjath-Sépher, c’est-à-dire Debir, et l’obtint pour femme. Caleb lui avait donné une terre sèche dans le midi, et elle dit : « Fais-moi un présent, car tu m’as donné une terre du midi ; donne-moi aussi des sources d’eau. Et il lui donna les sources supérieures et les sources inférieures. » L’histoire est racontée deux fois, dans Josué et de nouveau dans les Juges. Le mot hébreu gulloth signifie « bassins » ou « sources » ; qu’il ait jamais été un nom propre est incertain, et la carte traite ces sources et les Gulloth supérieures du même verset comme un seul lieu."
    - "C’est tout ce que dit la Bible. Les sources devaient se trouver près de Debir, aujourd’hui généralement identifiée à Khirbet Rabud, à environ 13 km au sud-ouest d’Hébron ; son fouilleur Moshe Kochavi a désigné les deux puits d’el-’Alaqa, un supérieur et un inférieur, à environ 3 km au nord du tertre, comme les sources supérieures et inférieures probables. Dans l’ancienne identification de Debir avec Tell Beit Mirsim, elles se trouveraient ailleurs. Aujourd’hui, la région est un pays de collines cultivé, dans le sud des collines d’Hébron, en Cisjordanie."
scripture:
  - Josh.15.15-Josh.15.19
  - Judg.1.12-Judg.1.15
