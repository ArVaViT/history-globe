# Overview article (ADR 0007). Mainstream facts only; the springs are placed near Debir on the usual identification of Debir with Khirbet Rabud; nothing on the ground is certain. The Russian name is the Synodal phrase “источники вод”, not a proper name.
id: gulloth-mayim
place: aaa3eca
title:
  en: "Gulloth-mayim"
  ru: "Источники вод"
body:
  en:
    - "Gulloth-mayim, “springs of water”, are the springs that Achsah, Caleb's daughter, asked of her father when Othniel took Kiriath-sepher, that is Debir, and won her as his wife. Caleb had given her dry land in the south, and she said: “Give me a blessing; for thou hast given me a south land; give me also springs of water. And he gave her the upper springs, and the nether springs.” The story is told twice, in Joshua and again in Judges. The Hebrew gulloth means “basins” or “springs”; whether it was ever a proper name is uncertain, and the map treats these springs and the Upper Gulloth of the same verse as one place."
    - "That is all the Bible says. The springs must have lain near Debir, now generally identified with Khirbet Rabud, about 13 km south-west of Hebron; its excavator Moshe Kochavi pointed to the two wells of el-'Alaqa, an upper and a lower, about 3 km north of the mound, as the likely upper and nether springs. On the older identification of Debir with Tell Beit Mirsim they would lie elsewhere. Today the area is farmed hill country of the southern Hebron hills, in the West Bank."
  ru:
    - "Источники вод — те самые источники, которые Ахса, дочь Халева, попросила у отца, когда Гофониил взял Кириаф-Сефер, то есть Давир, и получил её в жёны. Халев дал ей сухую землю на юге, и она сказала: «дай мне благословение; ты дал мне землю полуденную, дай мне и источники вод. И дал он ей источники верхние и источники нижние». Рассказ приведён дважды, в книге Иисуса Навина и снова в книге Судей. Еврейское гуллот значит «чаши» или «источники»; было ли оно когда-либо собственным именем, неясно, и карта считает эти источники и Источники верхние того же стиха одним местом."
    - "Это всё, что говорит Библия. Источники должны были лежать близ Давира, который сейчас обычно отождествляют с Хирбет-Рабудом примерно в 13 км к юго-западу от Хеврона; его исследователь Моше Кохави указал на два колодца эль-Алака, верхний и нижний, примерно в 3 км к северу от холма, как на вероятные верхние и нижние источники. При прежнем отождествлении Давира с Телль-Бейт-Мирсимом они лежали бы в другом месте. Сегодня это возделанные холмы южной части Хевронского нагорья на Западном берегу."
scripture:
