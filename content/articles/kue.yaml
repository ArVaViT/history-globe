# Overview article (ADR 0007). Mainstream facts only; the reading of the Hebrew and the meaning of the paired "Egypt" are named as debated.
id: kue
place: af133c0
title:
  en: "Kue"
  ru: "Кува"
  uk: "Кує"
  es: "Cue"
  pt: "Que"
  de: "Kuë"
  fr: "Kué"
body:
  en:
    - "Kue is the land from which Solomon’s merchants bought horses, in a pair of verses in Kings and Chronicles: “Solomon had horses brought out of Egypt, and linen yarn: the king’s merchants received the linen yarn at a price”. That is how the King James Version understood the obscure Hebrew word; most modern translations, like the Russian Synodal, read it as a place name, Kue, the Que or Qawe of Assyrian records. Que was the fertile plain of Cilicia in south-east Anatolia, the later Cilicia Pedias around Adana, famous for horses: Herodotus says Cilicia paid the Persian king 360 white horses a year. The verses go on to say that chariots came from Egypt for six hundred shekels and horses for a hundred and fifty, and that the merchants sold them on to the kings of the Hittites and of Aram."
    - "Some scholars read the Hebrew “Egypt” in these verses as Musri, a land in Anatolia, which would make the trade wholly northern; others keep Egypt. Beyond this trade the Bible says nothing of Kue. Assyrian kings from Shalmaneser III on campaigned there, and in the eighth century it became an Assyrian province; the Phoenician and Luwian inscriptions of Karatepe tell of a local ruler under the house of Awariku. Today the plain is the Çukurova of southern Turkey, with Adana as its city."
  ru:
    - "Кува — земля, откуда купцы Соломона покупали коней, по двум параллельным стихам из книг Царств и Паралипоменон: «Коней же царю Соломону приводили из Египта и из Кувы; царские купцы покупали их из Кувы за деньги». Так Синодальный перевод, как и большинство современных, читает это тёмное еврейское слово — как имя места, ассирийскую Куэ, или Кауэ; английская Библия короля Якова поняла его как «льняная пряжа». Куэ — плодородная равнина Киликии на юго-востоке Анатолии, позднейшая Равнинная Киликия вокруг Аданы, славившаяся конями: Геродот пишет, что Киликия ежегодно отдавала персидскому царю 360 белых коней. Далее сказано, что колесницу из Египта получали за шестьсот сиклей серебра, а коня за сто пятьдесят, и купцы доставляли их царям Хеттейским и Арамейским."
    - "Некоторые учёные читают в этих стихах еврейское «Египет» как Мусри, землю в Анатолии, и тогда торговля целиком северная; другие оставляют Египет. Кроме этой торговли Библия о Куве ничего не говорит. Ассирийские цари начиная с Салманассара III ходили туда походами, и в VIII веке до н. э. она стала ассирийской провинцией; финикийские и лувийские надписи Каратепе рассказывают о местном правителе под властью дома Аварику. Сегодня эта равнина — Чукурова на юге Турции, с Аданой в качестве главного города."
  uk:
    - "Кує — край, звідки купці Соломона купували коней, у парі віршів у Книзі Царів і Книзі Хронік: «Конї для Соломона приводили з Египту та з Куви; царські купцї з Куви доставляли їх за готові гроші». Так розуміє незрозуміле староєврейське слово більшість сучасних перекладів, як і Синодальний, читаючи його як назву місця — Кує, Куе чи Каве ассирійських записів; Біблія короля Якова розуміла його інакше: що Соломонові приводили коней з Єгипту й лляну пряжу, а царські купці брали пряжу за певну плату. Куе була родючою рівниною Кілікії на південному сході Анатолії, пізнішою Рівнинною Кілікією навколо Адани, славною кіньми: Геродот каже, що Кілікія платила перському цареві 360 білих коней на рік. Далі у віршах сказано, що колесниці йшли з Єгипту по шістсот шеклів, а коні по сто п’ятдесят, і що купці перепродавали їх царям хеттів і арамеїв."
    - "Деякі вчені читають староєврейське «Єгипет» у цих віршах як Мусрі, країну в Анатолії, що зробило б торгівлю цілком північною; інші залишають Єгипет. Поза цією торгівлею Біблія про Кує нічого не каже. Ассирійські царі, починаючи від Салманассара III, ходили туди походами, а у VIII ст. вона стала ассирійською провінцією; фінікійські й лувійські написи з Каратепе розповідають про місцевого правителя з дому Авариків. Сьогодні ця рівнина — Чукурова на півдні Туреччини з містом Адана."
  es:
    - "Cue es la tierra de la que los mercaderes de Salomón compraban caballos, en un par de versículos de Reyes y Crónicas: «Y sacaban caballos y lienzos á Salomón de Egipto: porque la compañía de los mercaderes del rey compraban caballos y lienzos». Así entendieron la oscura palabra hebrea la versión del rey Jacobo y también la Reina-Valera; la mayoría de las traducciones modernas, como la sinodal rusa, la leen como un nombre de lugar, Cue, el Que o Qawe de los registros asirios. Que era la fértil llanura de Cilicia, en el sudeste de Anatolia, la posterior Cilicia Pedias en torno a Adana, famosa por sus caballos: Heródoto dice que Cilicia pagaba al rey persa 360 caballos blancos al año. Los versículos continúan diciendo que los carros llegaban de Egipto por seiscientos siclos y los caballos por ciento cincuenta, y que los mercaderes los revendían a los reyes de los hititas y de Aram."
    - "Algunos estudiosos leen el «Egipto» hebreo de estos versículos como Musri, una tierra de Anatolia, lo que haría este comercio enteramente septentrional; otros mantienen Egipto. Fuera de este comercio, la Biblia no dice nada de Cue. Los reyes asirios, desde Salmanasar III, hicieron campañas allí, y en el siglo VIII se convirtió en provincia asiria; las inscripciones fenicias y luvitas de Karatepe hablan de un gobernante local bajo la casa de Awariku. Hoy la llanura es la Çukurova, en el sur de Turquía, con Adana como su ciudad."
  pt:
    - "Que é a terra de onde os mercadores de Salomão compravam cavalos, num par de versículos em Reis e Crônicas: Salomão mandava trazer cavalos do Egito e fio de linho, e os mercadores do rei recebiam o fio de linho por um preço. Assim a King James Version entendeu a obscura palavra hebraica; a maioria das traduções modernas, como a Sinodal russa, lê-a como nome de lugar, Que, o Que ou Qawe dos registros assírios. Que era a fértil planície da Cilícia, no sudeste da Anatólia, a posterior Cilícia Pedias em torno de Adana, famosa por seus cavalos: Heródoto diz que a Cilícia pagava ao rei persa 360 cavalos brancos por ano. Os versículos prosseguem dizendo que os carros vinham do Egito por seiscentos siclos e os cavalos por cento e cinquenta, e que os mercadores os revendiam aos reis dos hititas e de Arã."
    - "Alguns estudiosos leem o hebraico “Egito” nesses versículos como Musri, uma terra da Anatólia, o que tornaria o comércio inteiramente setentrional; outros mantêm o Egito. Além desse comércio, a Bíblia nada diz de Que. Reis assírios, a partir de Salmaneser III, fizeram campanha ali, e no século VIII ela se tornou província assíria; as inscrições fenícias e luvitas de Karatepe falam de um governante local da casa de Awariku. Hoje a planície é a Çukurova do sul da Turquia, com Adana por cidade."
  de:
    - "Kuë ist das Land, aus dem Salomos Kaufleute Pferde kauften, in zwei Versen in Könige und Chronik: „Und man brachte dem Salomo Pferde aus Ägypten und allerlei Ware; und die Kaufleute des Königs kauften diese Ware“. Das dunkle hebräische Wort verstand die King-James-Version als Leinengarn und Luther als Ware; die meisten modernen Übersetzungen, wie die russische Synodalbibel, lesen es als Ortsnamen, Kuë, das Que oder Qawe der assyrischen Quellen. Que war die fruchtbare Ebene Kilikiens im Südosten Anatoliens, das spätere Cilicia Pedias um Adana, berühmt für Pferde: Herodot sagt, Kilikien habe dem Perserkönig jährlich 360 weiße Pferde gezahlt. Die Verse fahren fort, Wagen seien aus Ägypten für sechshundert Silberlinge gekommen und Pferde für hundertfünfzig, und die Kaufleute hätten sie an die Könige der Hethiter und von Aram weiterverkauft."
    - "Manche Gelehrte lesen das hebräische „Ägypten“ in diesen Versen als Musri, ein Land in Anatolien, was den Handel ganz nach Norden verlegen würde; andere bleiben bei Ägypten. Außer diesem Handel sagt die Bibel nichts von Kuë. Assyrische Könige zogen seit Salmanassar III. dorthin, und im 8. Jahrhundert wurde es assyrische Provinz; die phönizischen und luwischen Inschriften von Karatepe berichten von einem örtlichen Herrscher aus dem Haus Awariku. Heute ist die Ebene die Çukurova der südlichen Türkei, mit Adana als ihrer Stadt."
  fr:
    - "Kué est le pays où les marchands de Salomon achetaient des chevaux, dans deux versets parallèles des Rois et des Chroniques : Salomon faisait venir d’Égypte des chevaux et du fil de lin, que les marchands du roi recevaient à un prix convenu. C’est ainsi que la version du roi Jacques a compris le mot hébreu obscur ; la plupart des traductions modernes, comme la Bible synodale russe, y lisent un nom de lieu, Kué, le Que ou Qawe des textes assyriens. Que était la plaine fertile de Cilicie, dans le sud-est de l’Anatolie, la future Cilicie Pédias autour d’Adana, réputée pour ses chevaux : Hérodote dit que la Cilicie payait au roi de Perse 360 chevaux blancs par an. Les versets poursuivent en disant que des chars venaient d’Égypte pour six cents sicles et des chevaux pour cent cinquante, et que les marchands les revendaient aux rois des Hittites et d’Aram."
    - "Certains savants lisent l’« Égypte » hébraïque de ces versets comme Musri, pays d’Anatolie, ce qui rendrait ce commerce entièrement septentrional ; d’autres gardent l’Égypte. En dehors de ce commerce, la Bible ne dit rien de Kué. Les rois assyriens, à partir de Salmanasar III, y firent campagne, et au VIIIe siècle elle devint une province assyrienne ; les inscriptions phéniciennes et louvites de Karatepe font connaître un souverain local de la maison d’Awariku. Aujourd’hui, la plaine est la Çukurova, dans le sud de la Turquie, avec Adana pour ville."
