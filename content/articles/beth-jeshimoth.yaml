# Overview article (ADR 0007). Mainstream facts only; the identification with Tell el-Azeimeh is the usual one and rests on Eusebius and surveys, not excavation.
id: beth-jeshimoth
place: a30f37b
title:
  en: "Beth-jeshimoth"
  ru: "Беф-Иешимоф"
  uk: "Бет-Єшімот"
  es: "Bet-jesimot"
  pt: "Bete-Jesimote"
  de: "Bet-Jeschimot"
  fr: "Beth-Jeschimoth"
body:
  en:
    - "Beth-jeshimoth, “house of the wastes”, was a town at the south-eastern end of the plains of Moab, where the Jordan valley meets the north shore of the Dead Sea under the hills of Pisgah. The name is from Jeshimon, the desert of the valley floor. It marks the southern end of Israel's last camp before the crossing: “they pitched by Jordan, from Beth-jesimoth even unto Abel-shittim in the plains of Moab”. Joshua uses it to fix the border of Sihon's kingdom, which ran down the Arabah to the Salt Sea “the way to Beth-jeshimoth”, and assigns it to Reuben with Beth-peor and the slopes of Pisgah. By the sixth century it was Moabite again: Ezekiel names “Beth-jeshimoth, Baal-meon, and Kiriathaim”, the frontier towns that were “the glory of the country”, as the side of Moab that God will lay open to the men of the east."
    - "Josephus knew the town as Besimoth, one of the places Vespasian's general Placidus took in AD 68 as he cleared the valley down to the Dead Sea, and Eusebius placed Bethasimuth ten miles south of Jericho beside the Dead Sea. That fits Tell el-Azeimeh, a mound a few kilometres from the north-eastern shore, where Nelson Glueck's survey found Iron Age and later pottery; Khirbet Suweimeh, nearer the shore, has also been proposed. The site has not been excavated."
    - "The ground today is the Jordanian shore at Sweimeh, with the hotels of the Dead Sea, the baptism site at the Jordan a little to the north and the road climbing to Mount Nebo above."
  ru:
    - "Беф-Иешимоф, «дом пустынь», — город на юго-восточном краю равнин Моавитских, где долина Иордана сходится с северным берегом Мёртвого моря под горами Фасги. Имя — от Иешимона, пустыни на дне долины. Он отмечает южный конец последнего стана Израиля перед переходом: «они расположились станом у Иордана от Беф-Иешимофа до Аве-Ситтима на равнинах Моавитских». Иисус Навин определяет им границу царства Сигона, которая спускалась по Араве к Солёному морю «по дороге к Беф-Иешимофу», и отдаёт его Рувиму вместе с Беф-Фегором и склонами Фасги. К VI веку он снова был моавитским: Иезекииль называет Беф-Иешимоф, Ваалмеон и Кириафаим, пограничные города, «красы земли», тем боком Моава, который Бог откроет сынам востока."
    - "Иосиф Флавий знал город как Весимоф, одно из мест, взятых в 68 г. н. э. полководцем Веспасиана Плацидом, когда тот очищал долину до Мёртвого моря, а Евсевий помещал Бефасимуф в десяти милях к югу от Иерихона у Мёртвого моря. Это подходит к Телль-эль-Азейме, холму в нескольких километрах от северо-восточного берега, где разведка Нельсона Глюка нашла керамику железного века и позднейшую; предлагали и Хирбет-Сувейме ближе к берегу. Раскопок на месте не было."
    - "Эта земля сегодня — иорданский берег у Сувейме с гостиницами Мёртвого моря, местом крещения на Иордане чуть к северу и дорогой, поднимающейся к горе Нево."
  uk:
    - "Бет-Єшімот, «дім пусток», було містом на південно-східному краї моавських рівнин, де Йорданська долина зустрічається з північним берегом Мертвого моря під пагорбами Фасги. Назва походить від Єшимону, пустелі дна долини. Воно позначає південний край останнього табору Ізраїлю перед переходом: «отаборились на Йорданї, від Бет-Єзімотя до Абель-Ситтима на рівнинах Моаба». Ісус Навин використовує його, щоб визначити кордон царства Сігона, який тягся вниз Аравою до Солоного моря «навпроти Бет-Ешимоту», і віддає його Рувимові разом із Бет-Пеором та схилами Фасги. До VI століття воно знову було моавським: Єзекіїль називає «Бет-Ешимота, Баалмеона й Киріятаїму», прикордонні міста, що були «від краси землї», як бік Моава, який Бог відкриє для людей сходу."
    - "Йосиф Флавій знав місто як Бесімот, одне з місць, які полководець Веспасіана Плацид узяв у 68 р. н. е., очищаючи долину аж до Мертвого моря, а Євсевій розмістив Бетасімут за десять миль на південь від Єрихону біля Мертвого моря. Це пасує Телль-ель-Азеймеху, пагорбу за кілька кілометрів від північно-східного берега, де розвідка Нельсона Глюка знайшла кераміку залізної доби та пізнішу; пропонували також Хірбет-Сувейме, ближче до берега. Місце не розкопували."
    - "Нині ця місцевість — йорданський берег у Сувейме, з готелями Мертвого моря, місцем хрещення на Йордані трохи на північ і дорогою, що піднімається до гори Нево вгорі."
  es:
    - "Bet-jesimot, «casa de los yermos», era una ciudad en el extremo sudoriental de las llanuras de Moab, donde el valle del Jordán se une a la orilla norte del mar Muerto bajo las colinas de Pisga. El nombre procede de Jesimón, el desierto del fondo del valle. Marca el extremo meridional del último campamento de Israel antes del cruce: «asentaron junto al Jordán, desde Beth-jesimoth hasta Abel-sitim, en los campos de Moab». Josué la usa para fijar la frontera del reino de Sehón, que descendía por el Arabá hasta el mar Salado «por el camino de Beth-jesimoth», y la asigna a Rubén con Bet-peor y las laderas de Pisga. En el siglo VI era de nuevo moabita: Ezequiel nombra «Beth-jesimoth, y Baal-meón, y Chîriathaim», las ciudades fronterizas que eran «las tierras deseables», como el lado de Moab que Dios abrirá a los hombres del oriente."
    - "Josefo conocía la ciudad como Besimot, uno de los lugares que el general de Vespasiano, Plácido, tomó en 68 d. C. al despejar el valle hasta el mar Muerto, y Eusebio situó Bethasimuth a diez millas al sur de Jericó junto al mar Muerto. Eso encaja con Tell el-Azeimeh, un montículo a pocos kilómetros de la orilla nororiental, donde la prospección de Nelson Glueck halló cerámica de la edad del Hierro y posterior; también se ha propuesto Khirbet Suweimeh, más cerca de la orilla. El sitio no ha sido excavado."
    - "El terreno es hoy la orilla jordana en Sweimeh, con los hoteles del mar Muerto, el lugar del bautismo en el Jordán un poco al norte y la carretera que sube al monte Nebo por encima."
  pt:
    - "Bete-Jesimote, “casa dos ermos”, era uma cidade no extremo sudeste das campinas de Moabe, onde o vale do Jordão encontra a margem norte do mar Morto, sob as colinas de Pisga. O nome vem de Jesimom, o deserto do fundo do vale. Marca o extremo sul do último acampamento de Israel antes da travessia: “Acamparam junto ao Jordão, desde Bete-Jesimote até Abel-Sitim, nas campinas de Moabe”. Josué a usa para fixar a fronteira do reino de Seom, que descia pela Arabá até o Mar Salgado “no caminho para Bete-Jesimote”, e a atribui a Rúben com Bete-Peor e as encostas de Pisga. No século VI era de novo moabita: Ezequiel nomeia “Bete-Jesimote, Baal-Meom e Quiriataim”, as cidades de fronteira que eram “a glória do país”, como o flanco de Moabe que Deus abrirá aos homens do oriente."
    - "Josefo conhecia a cidade como Besimoth, um dos lugares que Plácido, general de Vespasiano, tomou em 68 d.C. ao limpar o vale até o mar Morto, e Eusébio situou Bethasimuth a dez milhas ao sul de Jericó, junto ao mar Morto. Isso combina com Tell el-Azeimeh, um montículo a poucos quilômetros da margem nordeste, onde o levantamento de Nelson Glueck achou cerâmica da Idade do Ferro e posterior; Khirbet Suweimeh, mais perto da margem, também foi proposta. O sítio não foi escavado."
    - "O terreno é hoje a margem jordaniana em Sweimeh, com os hotéis do mar Morto, o local de batismo no Jordão um pouco ao norte e a estrada subindo ao monte Nebo, acima."
  de:
    - "Bet-Jeschimot, „Haus der Öden“, war eine Stadt am südöstlichen Ende der Ebenen Moabs, wo das Jordantal auf das Nordufer des Toten Meeres unter den Hügeln von Pisga trifft. Der Name stammt von Jeschimon, der Wüste des Talbodens. Es bezeichnet das Südende von Israels letztem Lager vor dem Übergang: „Sie lagerten sich aber am Jordan von Beth-Jesimoth an bis an Abel-Sittim, im Gefilde der Moabiter.“ Josua legt damit die Grenze von Sihons Königreich fest, die die Araba hinab zum Salzmeer verlief „des Weges gen Beth-Jesimoth“, und weist es Ruben zu mit Bet-Peor und den Hängen von Pisga. Im 6. Jahrhundert war es wieder moabitisch: Hesekiel nennt „das edle Land von Beth-Jesimoth, Baal-Meon und Kirjathaim“, die Grenzstädte, als die Seite Moabs, die Gott den Männern des Ostens öffnen wird."
    - "Josephus kannte die Stadt als Besimoth, einen der Orte, die Vespasians Feldherr Placidus 68 n. Chr. nahm, als er das Tal bis zum Toten Meer säuberte, und Eusebius setzte Bethasimuth zehn Meilen südlich von Jericho am Toten Meer an. Das passt zu Tell el-Azeime, einem Hügel einige Kilometer vom nordöstlichen Ufer, wo Nelson Gluecks Survey Keramik der Eisenzeit und später fand; auch Chirbet Suweime näher am Ufer wurde vorgeschlagen. Die Stätte wurde nicht ausgegraben."
    - "Das Gelände ist heute das jordanische Ufer bei Sweima, mit den Hotels am Toten Meer, der Taufstätte am Jordan ein Stück nördlich und der Straße, die darüber zum Berg Nebo ansteigt."
  fr:
    - "Beth-Jeschimoth, « maison des solitudes », était une ville à l’extrémité sud-est des plaines de Moab, là où la vallée du Jourdain rejoint la rive nord de la mer Morte sous les collines du Pisga. Le nom vient de Jeschimon, le désert du fond de la vallée. Elle marque l’extrémité sud du dernier campement d’Israël avant la traversée : « Ils campèrent près du Jourdain, depuis Beth-Jeschimoth jusqu’à Abel-Sittim, dans les plaines de Moab ». Josué l’emploie pour fixer la frontière du royaume de Sihon, qui descendait l’Araba jusqu’à la mer Salée « vers Beth-Jeschimoth », et l’attribue à Ruben avec Beth-Peor et les pentes du Pisga. Au VIe siècle, elle était de nouveau moabite : Ézéchiel nomme « Beth-Jeschimoth, Baal-Meon et Kirjathaïm », les villes frontières qui étaient « L’ornement du pays », comme le côté de Moab que Dieu ouvrira aux hommes de l’Orient."
    - "Josèphe connaissait la ville sous le nom de Besimoth, l’un des lieux que Placidus, général de Vespasien, prit en 68 apr. J.-C. en nettoyant la vallée jusqu’à la mer Morte, et Eusèbe plaçait Bethasimuth à dix milles au sud de Jéricho près de la mer Morte. Cela convient à Tell el-Azeimeh, tertre à quelques kilomètres de la rive nord-est, où la prospection de Nelson Glueck a trouvé de la céramique de l’âge du Fer et plus tardive ; Khirbet Suweimeh, plus près de la rive, a aussi été proposé. Le site n’a pas été fouillé."
    - "Le terrain est aujourd’hui la rive jordanienne à Sweimeh, avec les hôtels de la mer Morte, le site du baptême sur le Jourdain un peu au nord et la route montant au mont Nebo au-dessus."
