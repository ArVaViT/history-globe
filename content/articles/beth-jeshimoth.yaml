# Overview article (ADR 0007). Mainstream facts only; the identification with Tell el-Azeimeh is the usual one and rests on Eusebius and surveys, not excavation.
id: beth-jeshimoth
place: a30f37b
title:
  en: "Beth-jeshimoth"
  ru: "Беф-Иешимоф"
body:
  en:
    - "Beth-jeshimoth, “house of the wastes”, was a town at the south-eastern end of the plains of Moab, where the Jordan valley meets the north shore of the Dead Sea under the hills of Pisgah. The name is from Jeshimon, the desert of the valley floor. It marks the southern end of Israel's last camp before the crossing: “they pitched by Jordan, from Beth-jesimoth even unto Abel-shittim in the plains of Moab”. Joshua uses it to fix the border of Sihon's kingdom, which ran down the Arabah to the Salt Sea “the way to Beth-jeshimoth”, and assigns it to Reuben with Beth-peor and the slopes of Pisgah. By the sixth century it was Moabite again: Ezekiel names “Beth-jeshimoth, Baal-meon, and Kiriathaim”, the frontier towns that were “the glory of the country”, as the side of Moab that God will lay open to the men of the east."
    - "Josephus knew the town as Besimoth, one of the places Vespasian's general Placidus took in AD 68 as he cleared the valley down to the Dead Sea, and Eusebius placed Bethasimuth ten miles south of Jericho beside the Dead Sea. That fits Tell el-Azeimeh, a mound a few kilometres from the north-eastern shore, where Nelson Glueck's survey found Iron Age and later pottery; Khirbet Suweimeh, nearer the shore, has also been proposed. The site has not been excavated."
    - "The ground today is the Jordanian shore at Sweimeh, with the hotels of the Dead Sea, the baptism site at the Jordan a little to the north and the road climbing to Mount Nebo above."
  ru:
    - "Беф-Иешимоф, «дом пустынь», — город на юго-восточном краю равнин Моавитских, где долина Иордана сходится с северным берегом Мёртвого моря под горами Фасги. Имя — от Иешимона, пустыни на дне долины. Он отмечает южный конец последнего стана Израиля перед переходом: «они расположились станом у Иордана от Беф-Иешимофа до Аве-Ситтима на равнинах Моавитских». Иисус Навин определяет им границу царства Сигона, которая спускалась по Араве к Солёному морю «по дороге к Беф-Иешимофу», и отдаёт его Рувиму вместе с Беф-Фегором и склонами Фасги. К VI веку он снова был моавитским: Иезекииль называет Беф-Иешимоф, Ваалмеон и Кириафаим, пограничные города, «красы земли», тем боком Моава, который Бог откроет сынам востока."
    - "Иосиф Флавий знал город как Весимоф, одно из мест, взятых в 68 г. н. э. полководцем Веспасиана Плацидом, когда тот очищал долину до Мёртвого моря, а Евсевий помещал Бефасимуф в десяти милях к югу от Иерихона у Мёртвого моря. Это подходит к Телль-эль-Азейме, холму в нескольких километрах от северо-восточного берега, где разведка Нельсона Глюка нашла керамику железного века и позднейшую; предлагали и Хирбет-Сувейме ближе к берегу. Раскопок на месте не было."
    - "Эта земля сегодня — иорданский берег у Сувейме с гостиницами Мёртвого моря, местом крещения на Иордане чуть к северу и дорогой, поднимающейся к горе Нево."
