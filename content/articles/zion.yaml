# Overview article (ADR 0007). Mainstream facts only; follows how the name Zion moved between Jerusalem's hills, without restating the Jerusalem article.
id: zion
place: af20c46
title:
  en: "Zion"
  ru: "Сион"
  uk: "Сіон"
  es: "Sion"
  pt: "Sião"
  de: "Zion"
  fr: "Sion"
body:
  en:
    - 'Zion is a name rather than a single hill: in Jerusalem it has been attached in turn to three different heights. The Bible first uses it for "the strong hold of Zion", the fortified town of the Jebusites on the narrow eastern ridge above the Gihon spring, which David took and called the City of David. The meaning of the name is uncertain, and it is probably older than Israel.'
    - 'When Solomon brought the ark up "out of the city of David, which is Zion" into the new Temple, the name went up with it. In the Psalms and the prophets Zion is the holy hill where the Lord dwells, that is, the Temple Mount, and by extension the whole city and its people: "out of Zion shall go forth the law". The exiles in Babylon wept when they remembered Zion. 1 Maccabees still calls the Temple hill mount Sion when Judas Maccabeus cleansed the sanctuary in 164 BC, and in the New Testament mount Sion stands for the heavenly Jerusalem.'
    - "The last move was to the higher western hill. Josephus, writing after AD 70, took the hill of the upper city to be the stronghold of David, though he never calls it Zion. By the fourth century Christians gave the name to this hill. The pilgrim from Bordeaux, in 333, climbed Sion past the house of Caiaphas and was shown the place of David's palace and the one synagogue left of seven. Eusebius' Onomasticon places Golgotha north of Mount Zion."
    - "Here Christian tradition put the upper room. About 350 Cyril of Jerusalem spoke of the Upper Church of the Apostles, where the Spirit came down at Pentecost; Epiphanius, late in the century, tells of a small church on Zion that had survived since Hadrian's day; Egeria, in the 380s, describes the Pentecost services held in Sion. In the fifth century a new wall, which the Piacenza pilgrim credits to the Empress Eudocia, took Zion back inside the city, and by the sixth the church was hailed as holy Sion, mother of all churches. The western hill keeps the name Mount Zion today."
  ru:
    - "Сион — скорее имя, чем один холм: в Иерусалиме оно по очереди закреплялось за тремя разными высотами. Впервые Библия называет так «крепость Сион» — укреплённый город иевусеев на узком восточном гребне над источником Гион, который Давид взял и назвал городом Давидовым. Значение имени неясно, и, вероятно, оно древнее Израиля."
    - "Когда Соломон перенёс ковчег «из города Давидова, то есть Сиона» в новый Храм, имя поднялось вместе с ним. В Псалтири и у пророков Сион — святая гора, где обитает Господь, то есть Храмовая гора, а в расширенном смысле весь город и его народ: «от Сиона выйдет закон». Изгнанники в Вавилоне плакали, вспоминая Сион. Первая книга Маккавейская ещё называет храмовый холм горой Сион, когда Иуда Маккавей очистил святилище в 164 г. до н. э., а в Новом Завете гора Сион означает небесный Иерусалим."
    - "Последний переход был на более высокий западный холм. Иосиф Флавий, писавший после 70 г. н. э., считал холм Верхнего города крепостью Давида, хотя ни разу не называет его Сионом. К IV веку христиане перенесли имя на этот холм. Паломник из Бордо в 333 г. поднялся на Сион мимо дома Каиафы, и ему показали место дворца Давида и одну синагогу, оставшуюся из семи. «Ономастикон» Евсевия помещает Голгофу к северу от горы Сион."
    - "Здесь христианское предание поместило горницу. Около 350 г. Кирилл Иерусалимский говорил о Горней церкви апостолов, где в Пятидесятницу сошёл Дух; Епифаний в конце того же века рассказывает о малой церкви на Сионе, уцелевшей со времён Адриана; Эгерия в 380-х гг. описывает богослужения Пятидесятницы на Сионе. В V веке новая стена, которую паломник из Пьяченцы приписывает императрице Евдокии, вернула Сион в черту города, а к VI веку церковь называли святым Сионом, матерью всех церквей. Западный холм и сегодня носит имя горы Сион."
  uk:
    - "Сіон — радше ім’я, ніж один пагорб: в Єрусалимі воно прикріплювалося почергово до трьох різних висот. Біблія вперше вживає його для «замок Сион», укріпленого міста євусеїв на вузькому східному гребені над джерелом Гіхон, яке Давид узяв і назвав Містом Давида. Значення назви непевне, і вона, ймовірно, давніша за Ізраїль."
    - "Коли Соломон переніс ковчег «з Давидового города, се є з Сиону» в новий Храм, ім’я піднялося разом із ним. У Псалмах і пророків Сіон — свята гора, де живе Господь, тобто Храмова гора, і в розширеному значенні все місто та його народ: «з Сиону вийде закон». Вигнанці у Вавилоні плакали, згадуючи Сіон. Перша книга Макавеїв усе ще називає храмову гору горою Сіон, коли Юда Макавей очистив святиню 164 р. до н. е., а в Новому Заповіті гора Сіон означає небесний Єрусалим."
    - "Останній перехід був на вищий західний пагорб. Йосиф Флавій, пишучи по 70 році н. е., вважав пагорб верхнього міста твердинею Давида, хоч ніколи не називає його Сіоном. До IV століття християни дали цю назву цьому пагорбу. Бордоський пілігрим 333 року піднявся на Сіон повз дім Каяфи, і йому показали місце палацу Давида та єдину синагогу, що лишилася з семи. Ономастикон Євсевія ставить Голгофу на північ від гори Сіон."
    - "Тут християнська традиція поставила горницю. Близько 350 року Кирило Єрусалимський говорив про Верхню церкву апостолів, де на Пʼятидесятницю зійшов Дух; Єпіфаній наприкінці століття розповідає про малу церкву на Сіоні, що збереглася від днів Адріана; Егерія в 380-х роках описує п’ятидесятницькі богослужіння, що відбувалися в Сіоні. У V столітті новий мур, який пілігрим із Плаценції приписує імператриці Євдокії, повернув Сіон усередину міста, а до VI століття церкву величали святим Сіоном, матір’ю всіх церков. Західний пагорб зберігає назву гора Сіон і нині."
  es:
    - "Sion es un nombre más que una sola colina: en Jerusalén se ha aplicado sucesivamente a tres alturas distintas. La Biblia lo usa primero para «la fortaleza de Sión», la ciudad fortificada de los jebuseos en la estrecha cresta oriental sobre la fuente de Gihón, que David tomó y llamó Ciudad de David. El significado del nombre es incierto, y probablemente es más antiguo que Israel."
    - "Cuando Salomón subió el arca «de la ciudad de David, que es Sión» al nuevo Templo, el nombre subió con ella. En los Salmos y los profetas Sion es el monte santo donde habita el Señor, es decir, el Monte del Templo, y por extensión toda la ciudad y su pueblo: «de Sión saldrá la ley». Los desterrados en Babilonia lloraron al acordarse de Sion. 1 Macabeos aún llama monte Sion a la colina del Templo cuando Judas Macabeo purificó el santuario en 164 a. C., y en el Nuevo Testamento el monte Sion representa la Jerusalén celestial."
    - "El último traslado fue a la colina occidental, más alta. Josefo, escribiendo después del 70 d. C., tomó la colina de la ciudad alta por la fortaleza de David, aunque nunca la llama Sion. Hacia el siglo IV los cristianos dieron el nombre a esta colina. El peregrino de Burdeos, en 333, subió a Sion pasando junto a la casa de Caifás y le mostraron el lugar del palacio de David y la única sinagoga que quedaba de siete. El Onomasticon de Eusebio sitúa el Gólgota al norte del monte Sion."
    - "Aquí la tradición cristiana puso el aposento alto. Hacia 350, Cirilo de Jerusalén habló de la Iglesia Superior de los Apóstoles, donde el Espíritu descendió en Pentecostés; Epifanio, a finales del siglo, cuenta de una pequeña iglesia en Sion que había sobrevivido desde los días de Adriano; Egeria, en los años 380, describe los oficios de Pentecostés celebrados en Sion. En el siglo V una nueva muralla, que el peregrino de Piacenza atribuye a la emperatriz Eudocia, volvió a meter a Sion dentro de la ciudad, y en el VI la iglesia era saludada como santa Sion, madre de todas las iglesias. La colina occidental conserva hoy el nombre de Monte Sion."
  pt:
    - "Sião é um nome e não uma única colina: em Jerusalém foi aplicado sucessivamente a três alturas diferentes. A Bíblia o usa primeiro para “a fortaleza de Sião”, a cidade fortificada dos jebuseus na estreita serra oriental acima da fonte de Giom, que Davi tomou e chamou de Cidade de Davi. O sentido do nome é incerto, e provavelmente é mais antigo que Israel."
    - "Quando Salomão trouxe a arca “da cidade de Davi, que é Sião” para o novo Templo, o nome subiu com ela. Nos Salmos e nos profetas, Sião é o monte santo onde o Senhor habita, isto é, o Monte do Templo, e por extensão toda a cidade e seu povo: “a lei sairá de Sião”. Os exilados na Babilônia choraram ao lembrar-se de Sião. 1 Macabeus ainda chama o monte do Templo de monte Sion quando Judas Macabeu purificou o santuário em 164 a.C., e no Novo Testamento o monte Sion representa a Jerusalém celeste."
    - "A última mudança foi para a colina ocidental, mais alta. Josefo, escrevendo depois de 70 d.C., tomou a colina da cidade alta pela fortaleza de Davi, embora nunca a chame de Sião. No século IV, os cristãos deram esse nome a essa colina. O peregrino de Bordeaux, em 333, subiu Sion passando pela casa de Caifás e viu o lugar do palácio de Davi e a única sinagoga que restava de sete. O Onomástico de Eusébio situa o Gólgota ao norte do Monte Sião."
    - "Aqui a tradição cristã pôs o cenáculo. Por volta de 350, Cirilo de Jerusalém falou da Igreja Superior dos Apóstolos, onde o Espírito desceu em Pentecostes; Epifânio, no fim do século, conta de uma pequena igreja em Sião que sobrevivia desde os dias de Adriano; Egéria, na década de 380, descreve os ofícios de Pentecostes celebrados em Sion. No século V, uma nova muralha, que o peregrino de Placência atribui à imperatriz Eudócia, trouxe Sião de volta para dentro da cidade, e no sexto a igreja era saudada como santa Sion, mãe de todas as igrejas. A colina ocidental conserva hoje o nome Monte Sião."
  de:
    - "Zion ist eher ein Name als ein einzelner Hügel: In Jerusalem haftete er nacheinander an drei verschiedenen Höhen. Die Bibel gebraucht ihn zuerst für „die Burg Zion“, die befestigte Stadt der Jebusiter auf dem schmalen Osthöhenzug über der Gihonquelle, die David einnahm und Stadt Davids nannte. Die Bedeutung des Namens ist unsicher, und er ist wohl älter als Israel."
    - "Als Salomo die Lade „aus der Stadt Davids, das ist Zion“ in den neuen Tempel heraufbrachte, ging der Name mit hinauf. In den Psalmen und bei den Propheten ist Zion der heilige Berg, auf dem der Herr wohnt, also der Tempelberg, und im weiteren Sinn die ganze Stadt und ihr Volk: „Denn von Zion wird das Gesetz ausgehen“. Die Verbannten in Babylon weinten, als sie an Zion gedachten. Das Erste Makkabäerbuch nennt den Tempelhügel noch Berg Zion, als Judas Makkabäus 164 v. Chr. das Heiligtum reinigte, und im Neuen Testament steht der Berg Zion für das himmlische Jerusalem."
    - "Der letzte Wechsel führte zum höheren Westhügel. Josephus, der nach 70 n. Chr. schrieb, hielt den Hügel der Oberstadt für die Burg Davids, nannte ihn aber nie Zion. Im vierten Jahrhundert gaben Christen diesen Hügel den Namen. Der Pilger von Bordeaux stieg 333 am Haus des Kaiphas vorbei auf den Zion und bekam den Ort von Davids Palast und die eine von sieben Synagogen gezeigt, die geblieben war. Das Onomastikon des Eusebius setzt Golgatha nördlich des Berges Zion."
    - "Hier setzte die christliche Überlieferung das Obergemach. Um 350 sprach Kyrill von Jerusalem von der Oberen Kirche der Apostel, wo der Geist zu Pfingsten herabkam; Epiphanius erzählt gegen Ende des Jahrhunderts von einer kleinen Kirche auf dem Zion, die seit Hadrians Tagen überdauert habe; Egeria beschreibt in den 380er Jahren die Pfingstgottesdienste in Sion. Im fünften Jahrhundert nahm eine neue Mauer, die der Pilger von Piacenza der Kaiserin Eudokia zuschreibt, den Zion wieder in die Stadt hinein, und im sechsten wurde die Kirche als heiliges Sion, Mutter aller Kirchen, gerühmt. Der Westhügel behält den Namen Berg Zion bis heute."
  fr:
    - "Sion est un nom plutôt qu’une colline unique : à Jérusalem, il s’est attaché tour à tour à trois hauteurs différentes. La Bible l’emploie d’abord pour « la forteresse de Sion », la ville fortifiée des Jébusiens sur l’étroite crête orientale au-dessus de la source de Guihon, que David prit et appela Cité de David. Le sens du nom est incertain, et il est probablement plus ancien qu’Israël."
    - "Quand Salomon fit monter l’arche « de la cité de David, qui est Sion » dans le nouveau Temple, le nom monta avec elle. Dans les Psaumes et les prophètes, Sion est la colline sainte où demeure l’Éternel, c’est-à-dire le mont du Temple, et par extension toute la ville et son peuple : « de Sion sortira la loi ». Les exilés de Babylone pleuraient en se souvenant de Sion. Le premier livre des Maccabées appelle encore la colline du Temple mont Sion quand Judas Maccabée purifia le sanctuaire en 164 av. J.-C., et dans le Nouveau Testament la montagne de Sion désigne la Jérusalem céleste."
    - "Le dernier déplacement fut vers la colline occidentale, plus haute. Josèphe, écrivant après 70 apr. J.-C., prit la colline de la ville haute pour la forteresse de David, sans jamais l’appeler Sion. Au IVe siècle, les chrétiens donnèrent le nom à cette colline. Le pèlerin de Bordeaux, en 333, gravit Sion en passant devant la maison de Caïphe et se vit montrer l’emplacement du palais de David et l’unique synagogue restée des sept. L’Onomasticon d’Eusèbe place le Golgotha au nord du mont Sion."
    - "C’est ici que la tradition chrétienne plaça la chambre haute. Vers 350, Cyrille de Jérusalem parlait de l’Église supérieure des Apôtres, où l’Esprit descendit à la Pentecôte ; Épiphane, à la fin du siècle, raconte qu’une petite église de Sion avait survécu depuis l’époque d’Hadrien ; Égérie, dans les années 380, décrit les offices de la Pentecôte tenus à Sion. Au Ve siècle, un nouveau mur, que le pèlerin de Plaisance attribue à l’impératrice Eudocie, ramena Sion à l’intérieur de la ville, et au VIe l’église était saluée comme la sainte Sion, mère de toutes les églises. La colline occidentale garde aujourd’hui le nom de mont Sion."
