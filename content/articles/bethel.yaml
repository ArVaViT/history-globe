body:
  en:
    - "Bethel stood on the watershed road through the hills, about 18 km north of Jerusalem, near the border between the lands of Benjamin and Ephraim. Most scholars identify it with the village of Beitin, though other sites have been proposed. W. F. Albright and J. L. Kelso excavated there between 1927 and 1960 and found a walled town of the Middle Bronze Age and a burned Late Bronze Age town; the dating of several of its layers has been questioned since."
    - "In Genesis Abraham pitches his tent between Bethel and Ai and builds an altar. Jacob dreams there of a ladder reaching to heaven and calls the place, earlier named Luz, Bethel, the house of God; returning from Haran, he builds an altar there again. In the time of the judges Israel sought the Lord at the house of God (Bethel in Hebrew), where the ark then stood, and Samuel judged the people there on his yearly circuit."
    - "When the kingdom divided, Jeroboam set up a golden calf at Bethel and another at Dan, and Bethel became the royal sanctuary of Israel. Amos prophesied there against the house of Jeroboam II, and the priest Amaziah told him to flee to Judah and prophesy no more at Bethel. After the fall of Samaria an exiled priest was sent back to Bethel to teach the new settlers, and Josiah later tore down its altar. Men of Bethel are counted among those who returned from Babylon."
    - "In the second century BC the Seleucid general Bacchides fortified Bethel against Jonathan Maccabeus. During the war against Rome Vespasian took it in AD 69. In the fourth century Eusebius knew it as a village twelve Roman miles from Jerusalem on the road to Neapolis, and Christian pilgrims came to see the place of Jacob's dream."
  ru:
    - "Вефиль стоял на дороге, идущей по водоразделу через горы, примерно в 18 км к северу от Иерусалима, у границы земель Вениамина и Ефрема. Большинство учёных отождествляют его с деревней Бейтин, хотя предлагались и другие места. У. Ф. Олбрайт и Дж. Л. Келсо вели здесь раскопки с 1927 по 1960 г. и нашли обнесённый стеной город среднего бронзового века и сгоревший город позднего бронзового века; датировки нескольких слоёв с тех пор оспариваются."
    - "В Книге Бытия Авраам ставит шатёр между Вефилем и Гаем и строит жертвенник. Иаков видит здесь во сне лестницу до неба и называет это место, прежде звавшееся Луз, Вефилем, домом Божиим; вернувшись из Харрана, он вновь ставит здесь жертвенник. Во времена судей израильтяне вопрошали Господа в доме Божием (по-еврейски Вефиль), где тогда находился ковчег, а Самуил, обходя каждый год свои города, судил здесь народ."
    - "При разделении царства Иеровоам поставил одного золотого тельца в Вефиле, а другого в Дане, и Вефиль стал царским святилищем Израиля. Здесь пророчествовал Амос против дома Иеровоама II, и священник Амасия велел ему удалиться в землю Иудину и больше не пророчествовать в Вефиле. После падения Самарии одного из уведённых священников вернули в Вефиль учить новых поселенцев, а позднее Иосия разрушил здешний жертвенник. Уроженцы Вефиля упомянуты среди вернувшихся из Вавилона."
    - "Во II веке до н. э. селевкидский полководец Вакхид укрепил Вефиль против Ионафана Маккавея. В войне с Римом город взял Веспасиан в 69 г. н. э. В IV веке Евсевий знал его как селение в двенадцати римских милях от Иерусалима по дороге на Неаполис, и христианские паломники приходили посмотреть на место сна Иакова."
  uk:
    - "Бет-Ел стояв на дорозі вододілом через гори, приблизно за 18 км на північ від Єрусалима, поблизу межі земель Веніямина та Єфрема. Більшість учених ототожнює його із селом Бейтін, хоча пропонували й інші місця. В. Ф. Олбрайт і Дж. Л. Келсо вели тут розкопки з 1927 до 1960 р. і знайшли оточене стіною місто доби середньої бронзи та спалене місто доби пізньої бронзи; датування кількох його шарів відтоді піддають сумніву."
    - "У Книзі Буття Авраам ставить намет між Бет-Елом і Гаєм та будує жертовник. Яків бачить тут уві сні драбину до неба й називає це місце, що раніше звалося Луз, Бет-Елом, домом Божим; повернувшись із Харана, він знову будує тут жертовник. За часів суддів ізраїльтяни питали Господа в домі Божому (єврейською Бет-Ел), де тоді стояв ковчег, а Самуїл, щороку об'їжджаючи свої міста, судив тут народ."
    - "Коли царство розділилося, Єровоам поставив одного золотого бичка в Бет-Елі, а другого в Дані, і Бет-Ел став царським святилищем Ізраїлю. Тут пророкував Амос проти дому Єровоама II, а священник Амассія наказав йому йти до землі Юдиної й більше не пророкувати в Бет-Елі. Після падіння Самарії одного з виведених священників відіслали назад до Бет-Ела навчати нових поселенців, а згодом Йосія зруйнував тутешній жертовник. Бет-Елян згадано серед тих, хто повернувся з Вавилона."
    - "У II ст. до н. е. селевкідський воєначальник Бакхід укріпив Бет-Ел проти Йонатана Макавея. Під час війни з Римом Веспасіан узяв його в 69 р. н. е. У IV ст. Євсевій знав його як селище за дванадцять римських миль від Єрусалима на дорозі до Неаполя, а християнські прочани приходили подивитися на місце Якового сну."
  es:
    - "Betel se alzaba junto al camino de la cordillera, a unos 18 km al norte de Jerusalén, cerca de la frontera entre las tierras de Benjamín y de Efraín. La mayoría de los estudiosos la identifican con la aldea de Beitín, aunque se han propuesto otros emplazamientos. W. F. Albright y J. L. Kelso excavaron allí entre 1927 y 1960 y hallaron una ciudad amurallada de la Edad del Bronce Medio y una ciudad quemada de la Edad del Bronce Tardío; la datación de varios de sus estratos se ha puesto en duda desde entonces."
    - "En el Génesis, Abraham planta su tienda entre Betel y Hai y levanta un altar. Jacob sueña allí con una escala que llega hasta el cielo y llama Betel, casa de Dios, al lugar que antes se llamaba Luz; a su regreso de Harán, edifica allí otro altar. En tiempos de los jueces Israel consultaba al Señor en la casa de Dios (Betel en hebreo), donde estaba entonces el arca, y Samuel juzgaba allí al pueblo en su recorrido anual."
    - "Al dividirse el reino, Jeroboam puso un becerro de oro en Betel y otro en Dan, y Betel se convirtió en el santuario real de Israel. Amós profetizó allí contra la casa de Jeroboam II, y el sacerdote Amasías le dijo que huyese a Judá y no profetizara más en Betel. Tras la caída de Samaria se envió de vuelta a Betel a un sacerdote desterrado para que instruyese a los nuevos colonos, y más tarde Josías derribó su altar. Los varones de Betel figuran entre los que regresaron de Babilonia."
    - "En el siglo II a. C. el general seléucida Báquides fortificó Betel contra Jonatán Macabeo. Durante la guerra contra Roma, Vespasiano la tomó en el año 69 d. C. En el siglo IV, Eusebio la conocía como una aldea situada a doce millas romanas de Jerusalén, en el camino a Neápolis, y los peregrinos cristianos acudían a ver el lugar del sueño de Jacob."
  pt:
    - "Betel ficava na estrada da linha divisória de águas, que corre pelas montanhas, cerca de 18 km ao norte de Jerusalém, perto da fronteira entre as terras de Benjamim e Efraim. A maioria dos estudiosos a identifica com a aldeia de Beitin, embora outros lugares tenham sido propostos. W. F. Albright e J. L. Kelso escavaram ali entre 1927 e 1960 e encontraram uma cidade murada do Bronze Médio e uma cidade incendiada do Bronze Tardio; a datação de várias de suas camadas é questionada desde então."
    - "No Gênesis, Abraão arma sua tenda entre Betel e Ai e edifica um altar. Jacó sonha ali com uma escada que alcança o céu e dá ao lugar, antes chamado Luz, o nome de Betel, a casa de Deus; ao voltar de Harã, edifica ali um altar de novo. No tempo dos juízes, Israel consultou o Senhor na casa de Deus (Betel, em hebraico), onde a arca estava então, e Samuel julgava ali o povo em seu circuito anual."
    - "Quando o reino se dividiu, Jeroboão pôs um bezerro de ouro em Betel e outro em Dã, e Betel tornou-se o santuário real de Israel. Amós profetizou ali contra a casa de Jeroboão II, e o sacerdote Amazias mandou que ele fugisse para Judá e não profetizasse mais em Betel. Depois da queda de Samaria, um sacerdote exilado foi enviado de volta a Betel para ensinar os novos colonos, e Josias mais tarde derrubou o seu altar. Os homens de Betel contam-se entre os que voltaram da Babilônia."
    - "No século II a.C., o general selêucida Báquides fortificou Betel contra Jônatas Macabeu. Durante a guerra contra Roma, Vespasiano a tomou em 69 d.C. No século IV, Eusébio a conhecia como uma aldeia a doze milhas romanas de Jerusalém, na estrada para Neápolis, e peregrinos cristãos vinham ver o lugar do sonho de Jacó."
  de:
    - "Bethel lag an der Höhenstraße durch das Gebirge, etwa 18 km nördlich von Jerusalem, nahe der Grenze zwischen dem Land Benjamin und dem Land Ephraim. Die meisten Forscher setzen es mit dem Dorf Beitin gleich, doch wurden auch andere Orte vorgeschlagen. W. F. Albright und J. L. Kelso gruben dort zwischen 1927 und 1960 und fanden eine ummauerte Stadt der Mittleren Bronzezeit sowie eine verbrannte Stadt der Späten Bronzezeit; die Datierung mehrerer Schichten ist seither in Frage gestellt worden."
    - "In der Genesis schlägt Abraham sein Zelt zwischen Bethel und Ai auf und baut einen Altar. Jakob träumt dort von einer Leiter, die bis zum Himmel reicht, und nennt den Ort, der zuvor Lus hieß, Bethel, „Haus Gottes“; auf der Rückkehr aus Haran baut er dort erneut einen Altar. In der Richterzeit befragte Israel den Herrn im Haus Gottes (hebräisch Bethel), wo damals die Lade stand, und Samuel richtete dort das Volk auf seinem jährlichen Rundgang."
    - "Nach der Teilung des Reiches stellte Jerobeam in Bethel ein goldenes Kalb auf und ein weiteres in Dan, und Bethel wurde das Reichsheiligtum Israels. Amos weissagte dort gegen das Haus Jerobeams II., und der Priester Amazja forderte ihn auf, nach Juda zu fliehen und in Bethel nicht mehr zu weissagen. Nach dem Fall Samarias wurde ein weggeführter Priester nach Bethel zurückgeschickt, um die neuen Siedler zu unterweisen, und Josia riss später seinen Altar nieder. Männer von Bethel werden unter denen gezählt, die aus Babylon heimkehrten."
    - "Im 2. Jahrhundert v. Chr. befestigte der seleukidische Feldherr Bakchides Bethel gegen Jonatan Makkabäus. Im Krieg gegen Rom nahm Vespasian es im Jahr 69 n. Chr. ein. Im 4. Jahrhundert kannte Eusebius es als Dorf zwölf römische Meilen von Jerusalem entfernt an der Straße nach Neapolis, und christliche Pilger kamen, um den Ort von Jakobs Traum zu sehen."
  fr:
    - "Béthel se dressait sur la route de la ligne de partage des eaux, à travers les montagnes, à environ 18 km au nord de Jérusalem, près de la frontière entre les territoires de Benjamin et d’Éphraïm. La plupart des spécialistes l’identifient au village de Beitin, bien que d’autres sites aient été proposés. W. F. Albright et J. L. Kelso y ont fouillé entre 1927 et 1960 et ont mis au jour une ville fortifiée du Bronze moyen et une ville incendiée du Bronze récent ; la datation de plusieurs de ses couches est discutée depuis."
    - "Dans la Genèse, Abraham plante sa tente entre Béthel et Aï et y bâtit un autel. Jacob y rêve d’une échelle qui touche le ciel et donne au lieu, appelé auparavant Luz, le nom de Béthel, la maison de Dieu ; de retour de Haran, il y bâtit de nouveau un autel. Au temps des juges, Israël consulta l’Éternel à la maison de Dieu (Béthel en hébreu), où se trouvait alors l’arche, et Samuel y jugeait le peuple lors de sa tournée annuelle."
    - "À la division du royaume, Jéroboam plaça un veau d’or à Béthel et un autre à Dan, et Béthel devint le sanctuaire royal d’Israël. Amos y prophétisa contre la maison de Jéroboam II, et le prêtre Amatsia lui dit de fuir en Juda et de ne plus prophétiser à Béthel. Après la chute de Samarie, un prêtre déporté fut renvoyé à Béthel pour instruire les nouveaux colons, et Josias renversa plus tard son autel. Des hommes de Béthel figurent parmi ceux qui revinrent de Babylone."
    - "Au IIe siècle av. J.-C., le général séleucide Bacchidès fortifia Béthel contre Jonathan Maccabée. Pendant la guerre contre Rome, Vespasien la prit en 69 apr. J.-C. Au IVe siècle, Eusèbe la connaissait comme un village situé à douze milles romains de Jérusalem sur la route de Néapolis, et des pèlerins chrétiens venaient y voir le lieu du rêve de Jacob."
  it:
    - "Betel sorgeva sulla strada di crinale che attraversa i monti, a circa 18 km a nord di Gerusalemme, vicino al confine tra le terre di Beniamino e di Efraim. La maggior parte degli studiosi la identifica con il villaggio di Beitin, benché siano stati proposti altri siti. W. F. Albright e J. L. Kelso vi scavarono tra il 1927 e il 1960 e trovarono una città murata dell’età del Bronzo Medio e una città incendiata dell’età del Bronzo Tardo; la datazione di vari suoi strati è stata messa in discussione da allora."
    - "Nella Genesi Abramo pianta la tenda tra Betel e Ai e vi costruisce un altare. Giacobbe vi sogna una scala che arriva fino al cielo e chiama il luogo, prima detto Luz, Betel, casa di Dio; al ritorno da Carran vi costruisce di nuovo un altare. Al tempo dei giudici Israele consultò il Signore nella casa di Dio (in ebraico Betel), dove allora si trovava l’arca, e Samuele vi giudicava il popolo nel suo giro annuale."
    - "Quando il regno si divise, Geroboamo collocò un vitello d’oro a Betel e un altro a Dan, e Betel divenne il santuario regio d’Israele. Amos vi profetizzò contro la casa di Geroboamo II, e il sacerdote Amazia gli disse di fuggire in Giuda e di non profetizzare più a Betel. Dopo la caduta di Samaria un sacerdote deportato fu rimandato a Betel per istruire i nuovi coloni, e più tardi Giosia ne abbatté l’altare. Gli uomini di Betel sono contati fra quelli che tornarono da Babilonia."
    - "Nel II secolo a.C. il generale seleucide Bacchide fortificò Betel contro Gionata Maccabeo. Durante la guerra contro Roma Vespasiano la prese nel 69 d.C. Nel IV secolo Eusebio la conosceva come un villaggio a dodici miglia romane da Gerusalemme sulla strada per Neapoli, e i pellegrini cristiani vi giungevano per vedere il luogo del sogno di Giacobbe."
  pl:
    - "Betel leżało przy drodze biegnącej grzbietem wododziału przez góry, około 18 km na północ od Jerozolimy, w pobliżu granicy ziem Beniamina i Efraima. Większość uczonych utożsamia je ze wsią Bajtin (Beitin), choć proponowano też inne miejsca. W. F. Albright i J. L. Kelso prowadzili tam wykopaliska w latach 1927–1960 i odkryli otoczone murem miasto ze środkowej epoki brązu oraz spalone miasto z późnej epoki brązu; datowanie kilku jego warstw jest od tamtej pory kwestionowane."
    - "W Księdze Rodzaju Abraham rozbija namiot między Betel a Aj i buduje ołtarz. Jakub śni tam o drabinie sięgającej nieba i nazywa to miejsce, wcześniej zwane Luz, Betel, czyli domem Bożym; wracając z Charanu, znów buduje tam ołtarz. Za czasów sędziów Izrael szukał Pana w domu Bożym (po hebrajsku Betel), gdzie wtedy stała arka, a Samuel sądził tam lud podczas swego corocznego objazdu."
    - "Gdy królestwo się podzieliło, Jeroboam ustawił w Betel złotego cielca, a drugiego w Dan, i Betel stało się królewskim sanktuarium Izraela. Amos prorokował tam przeciw domowi Jeroboama II, a kapłan Amazjasz kazał mu uciekać do Judy i nie prorokować już w Betel. Po upadku Samarii odesłano do Betel jednego z wygnanych kapłanów, aby uczył nowych osadników, a Jozjasz zburzył później jego ołtarz. Mieszkańcy Betel są wymienieni wśród tych, którzy wrócili z Babilonu."
    - "W II w. p.n.e. seleucydzki wódz Bakchides umocnił Betel przeciw Jonatanowi Machabeuszowi. W czasie wojny z Rzymem Wespazjan zdobył je w 69 r. n.e. W IV w. Euzebiusz znał je jako wieś odległą o dwanaście mil rzymskich od Jerozolimy przy drodze do Neapolis, a chrześcijańscy pielgrzymi przychodzili obejrzeć miejsce snu Jakuba."
  nl:
    - "Bethel lag aan de weg over de waterscheiding door het bergland, ongeveer 18 km ten noorden van Jeruzalem, bij de grens tussen het gebied van Benjamin en dat van Efraïm. De meeste geleerden identificeren het met het dorp Beitin, al zijn ook andere plaatsen voorgesteld. W.F. Albright en J.L. Kelso groeven er tussen 1927 en 1960 en vonden een ommuurde stad uit de Midden-Bronstijd en een verbrande stad uit de Late Bronstijd; de datering van verscheidene lagen is sindsdien betwijfeld."
    - "In Genesis slaat Abraham zijn tent op tussen Bethel en Ai en bouwt hij een altaar. Jakob droomt daar van een ladder die tot in de hemel reikt en noemt de plaats, die eerder Luz heette, Bethel, het huis van God; op de terugweg uit Haran bouwt hij er opnieuw een altaar. In de tijd van de richters ondervroeg Israël de HEER in het huis van God (in het Hebreeuws Bethel), waar toen de ark stond, en Samuël sprak er recht over het volk tijdens zijn jaarlijkse rondgang."
    - "Toen het koninkrijk zich splitste, zette Jerobeam in Bethel een gouden kalf neer en een tweede in Dan, en Bethel werd het koninklijke heiligdom van Israël. Amos profeteerde daar tegen het huis van Jerobeam II, en de priester Amazia zei hem naar Juda te vluchten en in Bethel niet meer te profeteren. Na de val van Samaria werd een weggevoerde priester naar Bethel teruggestuurd om de nieuwe kolonisten te onderwijzen, en Josia brak later het altaar af. Mannen van Bethel worden gerekend tot hen die uit Babylon terugkeerden."
    - "In de 2e eeuw v.Chr. versterkte de Seleucidische veldheer Bacchides Bethel tegen Jonatan de Makkabeeër. Tijdens de oorlog tegen Rome nam Vespasianus de stad in 69 n.Chr. in. In de 4e eeuw kende Eusebius het als een dorp op twaalf Romeinse mijlen van Jeruzalem aan de weg naar Neapolis, en christelijke pelgrims kwamen de plaats van Jakobs droom bezoeken."
  cs:
    - "Bét-el ležel na cestě vedoucí po rozvodí přes hory, asi 18 km severně od Jeruzaléma, poblíž hranice mezi územím Benjamínovým a Efrajimovým. Většina badatelů ho ztotožňuje s vesnicí Bejtín, ačkoli byla navrhována i jiná místa. W. F. Albright a J. L. Kelso tu v letech 1927–1960 vedli vykopávky a nalezli opevněné město ze střední doby bronzové a vypálené město z pozdní doby bronzové; datování několika jeho vrstev je od té doby zpochybňováno."
    - "V Genesi Abraham rozbíjí stan mezi Bét-elem a Aj a staví oltář. Jákob tu sní o žebříku sahajícím do nebe a místo, dříve zvané Lúz, nazývá Bét-el, dům Boží; při návratu z Charanu tu znovu staví oltář. V době soudců se Izraelci dotazovali Hospodina v domě Božím (hebrejsky Bét-el), kde tehdy stála truhla, a Samuel tu při svém každoročním obchůzkovém okruhu soudil lid."
    - "Po rozdělení království postavil Jarobeám zlaté tele v Bét-elu a druhé v Danu a Bét-el se stal královskou svatyní Izraele. Amos tu prorokoval proti domu Jarobeáma II. a kněz Amacjáš mu řekl, aby uprchl do Judska a v Bét-elu už neprorokoval. Po pádu Samaří byl do Bét-elu poslán zpět vyhnaný kněz, aby učil nové osadníky, a Jošijáš později jeho oltář zbořil. Bét-elští se počítají mezi ty, kdo se vrátili z Babylóna."
    - "Ve 2. století př. n. l. opevnil seleukovský vojevůdce Bakchidés Bét-el proti Jonatanovi Makabejskému. Za války proti Římu jej roku 69 n. l. dobyl Vespasianus. Ve 4. století jej Eusebios znal jako vesnici dvanáct římských mil od Jeruzaléma na cestě do Neapole a křesťanští poutníci přicházeli spatřit místo Jákobova snu."
  sv:
    - "Betel låg vid vattendelarvägen genom bergen, omkring 18 km norr om Jerusalem, nära gränsen mellan Benjamins och Efraims land. De flesta forskare identifierar det med byn Beitin, även om andra platser har föreslagits. W. F. Albright och J. L. Kelso grävde där mellan 1927 och 1960 och fann en muromgärdad stad från mellersta bronsåldern och en bränd stad från sen bronsålder; dateringen av flera av dess lager har sedan dess ifrågasatts."
    - "I Första Mosebok slår Abraham upp sitt tält mellan Betel och Ai och bygger ett altare. Jakob drömmer där om en stege som når upp till himlen och kallar platsen, som tidigare hette Lus, Betel, Guds hus; när han återvänder från Harran bygger han där ett altare på nytt. På domarnas tid sökte Israel Herren vid Guds hus (Betel på hebreiska), där arken då stod, och Samuel dömde folket där på sin årliga rundresa."
    - "När riket delades reste Jerobeam en gyllene kalv i Betel och en annan i Dan, och Betel blev Israels kungliga helgedom. Amos profeterade där mot Jerobeam II:s hus, och prästen Amasja sade åt honom att fly till Juda och inte profetera mer i Betel. Efter Samarias fall sändes en bortförd präst tillbaka till Betel för att undervisa de nya bosättarna, och Josia revade senare dess altare. Män från Betel räknas bland dem som återvände från Babylon."
    - "På 100-talet f.Kr. befäste den seleukidiske fältherren Bakchides Betel mot Jonatan Mackabeus. Under kriget mot Rom intog Vespasianus det år 69 e.Kr. På 300-talet kände Eusebios det som en by tolv romerska mil från Jerusalem på vägen mot Neapolis, och kristna pilgrimer kom för att se platsen för Jakobs dröm."
  nb:
    - "Betel lå på vannskilleveien gjennom åsene, omtrent 18 km nord for Jerusalem, nær grensen mellom Benjamins og Efraims land. De fleste forskere identifiserer det med landsbyen Beitin, selv om andre steder er blitt foreslått. W. F. Albright og J. L. Kelso gravde der mellom 1927 og 1960 og fant en befestet by fra mellombronsealderen og en brent by fra senbronsealderen; dateringen av flere av lagene er siden blitt stilt spørsmål ved."
    - "I 1. Mosebok slår Abraham opp sitt telt mellom Betel og Ai og bygger et alter. Jakob drømmer der om en stige som når opp til himmelen og kaller stedet, som tidligere het Lus, Betel, Guds hus; på hjemveien fra Harran bygger han der et alter igjen. På dommernes tid søkte Israel Herren ved Guds hus (Betel på hebraisk), der arken da sto, og Samuel dømte folket der på sin årlige rundreise."
    - "Da riket delte seg, reiste Jeroboam en gullkalv i Betel og en annen i Dan, og Betel ble Israels kongelige helligdom. Amos profeterte der mot Jeroboam IIs hus, og presten Amasja ba ham flykte til Juda og ikke profetere mer i Betel. Etter Samarias fall ble en bortført prest sendt tilbake til Betel for å lære de nye bosetterne, og Josjia rev senere ned alteret. Menn fra Betel regnes blant dem som vendte tilbake fra Babylon."
    - "På 100-tallet f.Kr. befestet den seleukidiske generalen Bakkides Betel mot Jonatan Makkabeus. Under krigen mot Roma inntok Vespasian det i 69 e.Kr. På 300-tallet kjente Eusebius det som en landsby tolv romerske mil fra Jerusalem på veien til Neapolis, og kristne pilegrimer kom for å se stedet for Jakobs drøm."
  tl:
    - "Ang Beth-el ay nakatayo sa daan sa tagaytay sa mga burol, mga 18 km sa hilaga ng Jerusalem, malapit sa hangganan ng mga lupain ng Benjamin at Ephraim. Karamihan sa mga iskolar ay kumikilala rito sa nayon ng Beitin, bagaman may iba pang pook na iminungkahi. Humukay roon sina W. F. Albright at J. L. Kelso sa pagitan ng 1927 at 1960 at nakatagpo ng bayang may pader ng Gitnang Panahon ng Tanso at nasunog na bayan ng Huling Panahon ng Tanso; mula noon ay pinag-alinlanganan ang petsa ng ilan sa mga patong nito."
    - "Sa Genesis, itinayo ni Abraham ang kaniyang tolda sa pagitan ng Beth-el at Ai at nagtayo ng dambana. Doon nanaginip si Jacob ng isang hagdan na umaabot sa langit at tinawag niyang Beth-el, ang bahay ng Dios, ang pook na dating pinangalanang Luz; pagbalik mula sa Haran, nagtayo siyang muli ng dambana roon. Noong panahon ng mga hukom, hinanap ng Israel ang Panginoon sa bahay ng Dios (Beth-el sa Hebreo), kung saan nakatayo noon ang kaban, at doon hinatulan ni Samuel ang bayan sa kaniyang taunang pag-ikot."
    - "Nang mahati ang kaharian, nagtayo si Jeroboam ng gintong guya sa Beth-el at isa pa sa Dan, at ang Beth-el ay naging maharlikang santuwaryo ng Israel. Doon nagpropesiya si Amos laban sa sangbahayan ni Jeroboam II, at sinabihan siya ng saserdoteng si Amasias na tumakas sa Juda at huwag nang magpropesiya sa Beth-el. Pagkatapos ng pagbagsak ng Samaria, isang ipinatapong saserdote ang ibinalik sa Beth-el upang turuan ang mga bagong naninirahan, at winasak ni Josias nang maglaon ang dambana nito. Ang mga lalaki ng Beth-el ay ibinibilang sa mga bumalik mula sa Babilonia."
    - "Noong ika-2 siglo BK, ginawang kuta ng heneral na Seleucida na si Bacchides ang Beth-el laban kay Jonathan Macabeo. Noong digmaan laban sa Roma, sinakop ito ni Vespasiano noong 69 AD. Noong ika-4 na siglo, kilala ito ni Eusebio bilang nayong labindalawang milyang Romano mula sa Jerusalem sa daan patungong Neapolis, at pumunta roon ang mga peregrinong Kristiyano upang makita ang pook ng panaginip ni Jacob."
  da:
    - "Betel lå ved vandskelsvejen gennem bjergene, cirka 18 km nord for Jerusalem, nær grænsen mellem Benjamins og Efraims lande. De fleste forskere identificerer det med landsbyen Beitin, selv om andre steder er blevet foreslået. W. F. Albright og J. L. Kelso udgravede der mellem 1927 og 1960 og fandt en befæstet by fra mellembronzealderen og en nedbrændt by fra senbronzealderen; dateringen af flere af lagene er siden blevet draget i tvivl."
    - "I 1 Mosebog slår Abraham sit telt op mellem Betel og Ai og bygger et alter. Jakob drømmer dér om en stige, der når op til himlen, og kalder stedet, der tidligere hed Luz, Betel, Guds hus; da han vender tilbage fra Karan, bygger han igen et alter dér. I dommertiden søgte Israel Herren ved Guds hus (Betel på hebraisk), hvor arken dengang stod, og Samuel dømte folket dér på sin årlige rundrejse."
    - "Da riget blev delt, opstillede Jeroboam en guldkalv i Betel og en anden i Dan, og Betel blev Israels kongelige helligdom. Amos profeterede dér mod Jeroboam 2.s hus, og præsten Amazja bad ham flygte til Juda og ikke profetere mere i Betel. Efter Samarias fald blev en bortført præst sendt tilbage til Betel for at undervise de nye bosættere, og Josias nedrev senere dets alter. Mænd fra Betel regnes blandt dem, der vendte tilbage fra Babylon."
    - "I 100-tallet f.Kr. befæstede den seleukidiske general Bakkides Betel mod Jonatan Makkabæus. Under krigen mod Rom indtog Vespasian det i 69 e.Kr. I 300-tallet kendte Eusebius det som en landsby tolv romerske mil fra Jerusalem på vejen til Neapolis, og kristne pilgrimme kom for at se stedet for Jakobs drøm."
  sr:
    - "Ветиљ је стајао на путу по развођу кроз брда, око 18 км северно од Јерусалима, близу границе између земаља Венијаминове и Јефремове. Већина научника поистовећује га са селом Бајтин, мада су предлагана и друга налазишта. В. Ф. Олбрајт и Џ. Л. Келсо ископавали су тамо између 1927. и 1960. и нашли град с бедемима из средњег бронзаног доба и спаљени град из касног бронзаног доба; датирање неколико његових слојева од тада је доведено у питање."
    - "У Постању Аврам разапиње шатор између Ветиља и Гаја и гради жртвеник. Јаков ту сања лествице које досежу до неба и место, раније названо Луза, прозива Ветиљ, дом Божји; враћајући се из Харана, опет ту гради жртвеник. У време судија Израиљ је тражио Господа у дому Божјем (на хебрејском Ветиљ), где је тада стајао ковчег, а Самуило је ту судио народу на свом годишњем обиласку."
    - "Када се краљевство поделило, Јеровоам је поставио златно теле у Ветиљу и друго у Дану, а Ветиљ је постао краљевска светиња Израиља. Амос је ту пророковао против дома Јеровоама II, а свештеник Амасија рекао му је да бежи у Јуду и да више не пророкује у Ветиљу. После пада Самарије један прогнани свештеник враћен је у Ветиљ да учи нове насељенике, а Јосија је касније срушио његов жртвеник. Људи из Ветиља убрајају се међу оне који су се вратили из Вавилона."
    - "У 2. веку п. н. е. селевкидски војсковођа Бакхид утврдио је Ветиљ против Јонатана Макавеја. За рата против Рима Веспазијан га је заузео 69. н. е. У 4. веку Јевсевије га је знао као село удаљено дванаест римских миља од Јерусалима на путу за Неапољ, а хришћански ходочасници долазили су да виде место Јаковљевог сна."
