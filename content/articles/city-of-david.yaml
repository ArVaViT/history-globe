body:
  en:
    - "The City of David is the narrow ridge running south from the Temple Mount, between the Kidron valley and the central valley that Josephus calls the Valley of the Cheesemongers. At its eastern foot rises the Gihon, the only spring of ancient Jerusalem, which is why the oldest town stood here. Pottery shows people here from the Chalcolithic and Early Bronze Age. Radiocarbon dates put the first public buildings early in the nineteenth century BC, and a massive tower was built round the spring; its excavators, Ronny Reich and Eli Shukron, date it to the Middle Bronze Age, while later samples allow a date in the late ninth century BC, so its date is disputed."
    - "Charles Warren explored the ridge in 1867 and found the vertical shaft beside the spring that bears his name; it was long taken for the Jebusite water shaft and, on one reading of 2 Samuel 5:8, for the way by which David's men got in. Excavations followed under Parker and Vincent, Weill, Macalister and Duncan, Kathleen Kenyon (1961–1967), Yigal Shiloh (1978–1985) and, from 1995, Reich and Shukron, who showed that the shaft is a natural fissure and that the Bronze Age approach to the spring was a fortified passage. Eilat Mazar's Large Stone Structure, uncovered in 2005, was presented as David's palace of the tenth century BC; others date parts of it much later and doubt that it was one building, and the question is disputed."
    - 'Before the Assyrian threat Hezekiah "stopped the upper watercourse of Gihon, and brought it straight down to the west side of the city of David". The winding tunnel, some 533 m long, carries the spring to the Pool of Siloam. In 1880 an inscription was found in it telling how two teams of hewers, cutting towards each other, heard each other''s voices and met, and how the water then flowed 1,200 cubits to the pool; it is now in the Istanbul Archaeological Museum. Radiometric dating gives an Iron Age date in keeping with the Bible; Reich and Shukron have argued that it was cut earlier, about 800 BC, so the attribution to Hezekiah is disputed.'
    - 'After the exile Nehemiah''s builders repaired the wall down to "the stairs that go down from the city of David". In the Second Temple period the ridge was part of the Lower City, and Jesus sent the blind man to wash in the pool of Siloam. For centuries after AD 70 Siloam lay outside the city wall. In the fifth century a new wall, credited by the Piacenza pilgrim to the Empress Eudocia, brought it back within the city, and by the sixth century a basilica stood over the pool.'
  ru:
    - "Город Давидов — узкий гребень, идущий к югу от Храмовой горы между долиной Кедрон и центральной долиной, которую Иосиф Флавий называет Сыроварной. У его восточного подножия бьёт Гион, единственный источник древнего Иерусалима, поэтому древнейший город стоял здесь. Керамика показывает, что люди жили здесь с энеолита и раннего бронзового века. Радиоуглеродные даты относят первые общественные постройки к началу XIX века до н. э.; вокруг источника была построена мощная башня. Её раскопщики Рони Райх и Эли Шукрон датируют её средним бронзовым веком, а более поздние образцы допускают конец IX века до н. э., так что дата спорна."
    - "Чарльз Уоррен исследовал гребень в 1867 г. и нашёл у источника вертикальную шахту, носящую его имя; её долго считали иевусейской водяной шахтой и, по одному из толкований 2 Цар 5:8, тем ходом, которым проникли в город люди Давида. Затем здесь копали Паркер и Венсан, Вейль, Макалистер и Дункан, Кэтлин Кеньон (1961–1967), Игаль Шилох (1978–1985) и с 1995 г. Райх и Шукрон, показавшие, что шахта — природная трещина, а к источнику в бронзовом веке вёл укреплённый проход. «Большое каменное сооружение» Эйлат Мазар, открытое в 2005 г., было представлено как дворец Давида X века до н. э.; другие датируют его части гораздо позже и сомневаются, что это одно здание, и вопрос остаётся спорным."
    - "Перед ассирийской угрозой Езекия «запер верхний проток вод Геона и провел их вниз к западной стороне города Давидова». Извилистый тоннель длиной около 533 м ведёт воду источника к Силоамской купели. В 1880 г. в нём нашли надпись о том, как две бригады каменотёсов, пробивавшиеся навстречу друг другу, услышали голоса друг друга и встретились, и как вода потекла к водоёму на 1200 локтей; сейчас она в Стамбульском археологическом музее. Радиометрические датировки дают железный век в согласии с Библией; Райх и Шукрон доказывали, что его пробили раньше, около 800 г. до н. э., так что связь с Езекией спорна."
    - "После плена строители Неемии чинили стену до «ступеней, спускающихся из города Давидова». Во времена Второго храма гребень входил в Нижний город, и Иисус послал слепого умыться в купальне Силоам. После 70 г. н. э. Силоам на века оказался за городской стеной. В V веке новая стена, которую паломник из Пьяченцы приписывает императрице Евдокии, вернула его в черту города, а к VI веку над купальней стояла базилика."
  uk:
    - "Місто Давида — це вузький гірський кряж, що тягнеться на південь від Храмової гори, між долиною Кедрону та центральною долиною, яку Йосиф Флавій називає Долиною сироварів. Біля його східного підніжжя б'є Гіхон, єдине джерело давнього Єрусалима, тому найдавніше поселення стояло саме тут. Кераміка свідчить про людей тут уже в халколіті та ранній бронзі. Радіовуглецеві дати відносять перші громадські будівлі до початку XIX ст. до н. е., і навколо джерела збудували масивну вежу; її розкопувачі, Ронні Райх і Елі Шукрон, датують її середньою бронзою, тоді як пізніші зразки допускають дату наприкінці IX ст. до н. е., тож її датування є спірним."
    - "Чарлз Воррен досліджував кряж у 1867 р. і знайшов вертикальну шахту біля джерела, що носить його ім'я; її довго вважали євусейською водяною шахтою і, за одним прочитанням 2 Книги Самуїла 5:8, шляхом, яким увійшли Давидові люди. Далі були розкопки під керівництвом Паркера і Венсана, Вейля, Макалістера і Данкена, Кетлін Кеньйон (1961–1967), Ігаля Шило (1978–1985) і, від 1995 р., Райха та Шукрона, які показали, що шахта — природна розколина, а підхід до джерела в добу бронзи був укріпленим переходом. Велика кам'яна споруда Ейлат Мазар, відкрита в 2005 р., була представлена як палац Давида X ст. до н. е.; інші датують її частини значно пізніше й сумніваються, що це була одна будівля, і питання є спірним."
    - "Перед ассирійською загрозою Єзекія «загатив верхню течію води Геона й провів її на низ до західнього боку міста Давидового». Звивистий тунель завдовжки близько 533 м несе воду з джерела до купелі Сілоам. У 1880 р. в ньому знайшли напис, що розповідає, як дві бригади каменярів, прорубуючи назустріч одна одній, почули голоси одна одної й зустрілися, і як вода потекла 1200 ліктів до купелі; нині він у Археологічному музеї Стамбула. Радіометричне датування дає дату залізної доби, що відповідає Біблії; Райх і Шукрон доводили, що його вирубали раніше, близько 800 р. до н. е., тож приписування Єзекії є спірним."
    - "Після вигнання будівничі Неемії лагодили мур аж до «сходів, що вели вниз із міста Давидового». У період Другого храму кряж був частиною Нижнього міста, і Ісус послав сліпого вмитися в купелі Сілоам. Упродовж століть після 70 р. н. е. Сілоам лежав поза міським муром. У V ст. новий мур, який Піаченцький пілігрим приписує імператриці Євдокії, повернув його всередину міста, а до VI ст. над купіллю стояла базиліка."
  es:
    - "La Ciudad de David es la estrecha loma que corre hacia el sur desde el monte del Templo, entre el valle del Cedrón y el valle central que Josefo llama valle de los Queseros. A su pie oriental brota el Gihón, la única fuente de la antigua Jerusalén, razón por la que la ciudad más antigua se alzó aquí. La cerámica muestra presencia humana desde el Calcolítico y la Edad del Bronce Antiguo. Las dataciones radiocarbónicas sitúan los primeros edificios públicos a comienzos del siglo XIX a. C., y se construyó una torre maciza en torno a la fuente; sus excavadores, Ronny Reich y Eli Shukron, la fechan en el Bronce Medio, mientras que muestras posteriores permiten una fecha a finales del siglo IX a. C., por lo que su datación es objeto de debate."
    - "Charles Warren exploró la loma en 1867 y halló el pozo vertical junto a la fuente que lleva su nombre; durante mucho tiempo se tuvo por el canal de agua jebuseo y, según una lectura de 2 Samuel 5:8, por la vía por la que entraron los hombres de David. Siguieron excavaciones bajo Parker y Vincent, Weill, Macalister y Duncan, Kathleen Kenyon (1961–1967), Yigal Shiloh (1978–1985) y, desde 1995, Reich y Shukron, que mostraron que el pozo es una fisura natural y que el acceso de la Edad del Bronce a la fuente era un pasadizo fortificado. La Gran Estructura de Piedra de Eilat Mazar, descubierta en 2005, se presentó como el palacio de David del siglo X a. C.; otros fechan partes de ella mucho más tarde y dudan de que fuera un solo edificio, y la cuestión se debate."
    - "Ante la amenaza asiria, Ezequías «tapó los manaderos de las aguas de Gihón la de arriba, y encaminólas abajo al occidente de la ciudad de David». El sinuoso túnel, de unos 533 m de largo, lleva la fuente hasta el estanque de Siloé. En 1880 se halló en él una inscripción que cuenta cómo dos equipos de cinceladores, que cavaban uno hacia el otro, oyeron sus voces y se encontraron, y cómo el agua fluyó entonces 1200 codos hasta el estanque; hoy está en el Museo Arqueológico de Estambul. La datación radiométrica da una fecha de la Edad del Hierro acorde con la Biblia; Reich y Shukron han sostenido que fue excavado antes, hacia el 800 a. C., por lo que la atribución a Ezequías es objeto de debate."
    - "Tras el destierro, los constructores de Nehemías repararon el muro hasta «las gradas que descienden de la ciudad de David». En el periodo del Segundo Templo la loma formaba parte de la Ciudad Baja, y Jesús envió al ciego a lavarse en el estanque de Siloé. Durante siglos después del 70 d. C. Siloé quedó fuera de la muralla de la ciudad. En el siglo V una nueva muralla, que el peregrino de Piacenza atribuye a la emperatriz Eudocia, la volvió a incluir dentro de la ciudad, y en el siglo VI se alzaba una basílica sobre el estanque."
  pt:
    - "A Cidade de Davi é a estreita crista que corre para o sul a partir do Monte do Templo, entre o vale do Cedrom e o vale central que Josefo chama de Vale dos Queijeiros. Em seu pé oriental brota o Giom, a única fonte da antiga Jerusalém, e por isso a cidade mais antiga se ergueu aqui. A cerâmica mostra gente aqui desde o Calcolítico e o Bronze Antigo. Datações por radiocarbono põem os primeiros edifícios públicos no início do século XIX a.C., e uma torre maciça foi construída em torno da fonte; seus escavadores, Ronny Reich e Eli Shukron, a datam do Bronze Médio, enquanto amostras posteriores admitem uma data no fim do século IX a.C., de modo que sua data é disputada."
    - "Charles Warren explorou a crista em 1867 e achou o poço vertical junto à fonte que leva o seu nome; ele foi por muito tempo tomado pelo canal de água jebuseu e, numa leitura de 2 Samuel 5:8, pelo caminho por onde os homens de Davi entraram. Seguiram-se escavações sob Parker e Vincent, Weill, Macalister e Duncan, Kathleen Kenyon (1961–1967), Yigal Shiloh (1978–1985) e, a partir de 1995, Reich e Shukron, que mostraram que o poço é uma fissura natural e que o acesso da Idade do Bronze à fonte era uma passagem fortificada. A Grande Estrutura de Pedra de Eilat Mazar, descoberta em 2005, foi apresentada como o palácio de Davi do século X a.C.; outros datam partes dela de muito depois e duvidam que fosse um único edifício, e a questão é disputada."
    - "Diante da ameaça assíria, Ezequias “tapou a fonte superior das águas de Giom, e as trouxe diretamente para o lado oeste da cidade de Davi”. O túnel sinuoso, de uns 533 m, leva a água da fonte ao tanque de Siloé. Em 1880 achou-se nele uma inscrição que conta como duas equipes de escavadores, cortando uma em direção à outra, ouviram as vozes uma da outra e se encontraram, e como a água correu depois 1.200 côvados até o tanque; está agora no Museu Arqueológico de Istambul. A datação radiométrica dá uma data da Idade do Ferro compatível com a Bíblia; Reich e Shukron defenderam que foi aberto antes, por volta de 800 a.C., de modo que a atribuição a Ezequias é disputada."
    - "Depois do exílio, os construtores de Neemias repararam o muro até “os degraus que descem da Cidade de Davi”. No período do Segundo Templo, a crista fazia parte da Cidade Baixa, e Jesus mandou o cego lavar-se no tanque de Siloé. Por séculos depois de 70 d.C., Siloé ficou fora do muro da cidade. No século V, um novo muro, atribuído pelo Peregrino de Piacenza à imperatriz Eudócia, trouxe-o de volta para dentro da cidade, e no século VI uma basílica se erguia sobre o tanque."
  de:
    - "Die Stadt Davids ist der schmale Höhenrücken, der südlich vom Tempelberg verläuft, zwischen dem Kidrontal und dem zentralen Tal, das Josephus das Tal der Käsemacher nennt. An seinem Ostfuß entspringt der Gihon, die einzige Quelle des antiken Jerusalem, weshalb die älteste Siedlung hier stand. Keramik zeigt Menschen hier seit der Kupfersteinzeit und der Frühen Bronzezeit. Radiokarbondaten setzen die ersten öffentlichen Bauten in den Anfang des 19. Jahrhunderts v. Chr., und um die Quelle wurde ein massiver Turm gebaut; seine Ausgräber Ronny Reich und Eli Shukron datieren ihn in die Mittlere Bronzezeit, während spätere Proben eine Datierung ins späte 9. Jahrhundert v. Chr. erlauben, sodass seine Datierung umstritten ist."
    - "Charles Warren erforschte den Höhenrücken 1867 und fand den senkrechten Schacht neben der Quelle, der seinen Namen trägt; er wurde lange für den jebusitischen Wasserschacht gehalten und, nach einer Lesart von 2. Samuel 5,8, für den Weg, auf dem Davids Männer eindrangen. Es folgten Ausgrabungen unter Parker und Vincent, Weill, Macalister und Duncan, Kathleen Kenyon (1961–1967), Yigal Shiloh (1978–1985) und ab 1995 Reich und Shukron, die zeigten, dass der Schacht eine natürliche Spalte ist und dass der bronzezeitliche Zugang zur Quelle ein befestigter Gang war. Eilat Mazars 2005 freigelegte Große Steinstruktur wurde als Davids Palast des 10. Jahrhunderts v. Chr. vorgestellt; andere datieren Teile davon viel später und bezweifeln, dass es ein einziges Gebäude war, und die Frage ist umstritten."
    - "Angesichts der assyrischen Bedrohung war es Hiskia, „der die obere Wasserquelle in Gihon zudeckte und leitete sie hinunter abendwärts von der Stadt Davids“. Der gewundene Tunnel, etwa 533 m lang, führt die Quelle zum Teich Siloah. Im Jahr 1880 wurde in ihm eine Inschrift gefunden, die erzählt, wie zwei Gruppen von Steinhauern, die aufeinander zu hieben, einander die Stimmen hörten und sich trafen und wie das Wasser dann 1200 Ellen zum Teich floss; sie befindet sich heute im Archäologischen Museum Istanbul. Radiometrische Datierung ergibt ein eisenzeitliches Datum, das mit der Bibel übereinstimmt; Reich und Shukron haben vertreten, er sei früher, um 800 v. Chr., gehauen worden, sodass die Zuschreibung an Hiskia umstritten ist."
    - "Nach dem Exil besserten Nehemias Bauleute die Mauer aus bis zu „den Stufen, die von der Stadt Davids herabgehen“. In der Zeit des Zweiten Tempels gehörte der Höhenrücken zur Unterstadt, und Jesus schickte den Blinden, sich im Teich Siloah zu waschen. Jahrhundertelang nach 70 n. Chr. lag Siloah außerhalb der Stadtmauer. Im 5. Jahrhundert brachte eine neue Mauer, die der Pilger von Piacenza der Kaiserin Eudokia zuschreibt, es wieder in die Stadt, und im 6. Jahrhundert stand über dem Teich eine Basilika."
  fr:
    - "La Cité de David est la crête étroite qui descend vers le sud depuis le Mont du Temple, entre la vallée du Cédron et la vallée centrale que Josèphe appelle la vallée des Fromagers. À son pied oriental jaillit le Guihon, seule source de la Jérusalem antique, ce qui explique que la plus ancienne ville se soit trouvée ici. La poterie atteste une présence humaine dès le chalcolithique et le Bronze ancien. Des datations au radiocarbone placent les premiers édifices publics au début du XIXe siècle av. J.-C., et une tour massive fut construite autour de la source ; ses fouilleurs, Ronny Reich et Eli Shukron, la datent du Bronze moyen, tandis que des échantillons plus récents permettent une date à la fin du IXe siècle av. J.-C. ; sa date est donc discutée."
    - "Charles Warren explora la crête en 1867 et trouva le puits vertical près de la source qui porte son nom ; on le prit longtemps pour le puits d’eau jébusite et, selon une lecture de 2 Samuel 5:8, pour le passage par lequel les hommes de David entrèrent. Des fouilles suivirent sous Parker et Vincent, Weill, Macalister et Duncan, Kathleen Kenyon (1961–1967), Yigal Shiloh (1978–1985) et, dès 1995, Reich et Shukron, qui montrèrent que le puits est une fissure naturelle et que l’accès de l’âge du Bronze à la source était un passage fortifié. La Grande Structure en pierre d’Eilat Mazar, mise au jour en 2005, fut présentée comme le palais de David au Xe siècle av. J.-C. ; d’autres en datent des parties bien plus tard et doutent qu’il s’agisse d’un seul bâtiment, et la question est discutée."
    - "Face à la menace assyrienne, Ézéchias « boucha l’issue supérieure des eaux de Guihon, et les conduisit en bas vers l’occident de la cité de David ». Le tunnel sinueux, long d’environ 533 m, amène la source au bassin de Siloé. En 1880, on y trouva une inscription racontant comment deux équipes de tailleurs, creusant l’une vers l’autre, entendirent leurs voix et se rejoignirent, et comment l’eau coula ensuite sur 1 200 coudées jusqu’au bassin ; elle est aujourd’hui au musée archéologique d’Istanbul. La datation radiométrique donne une date de l’âge du Fer conforme à la Bible ; Reich et Shukron ont soutenu qu’il fut creusé plus tôt, vers 800 av. J.-C., si bien que l’attribution à Ézéchias est discutée."
    - "Après l’exil, les bâtisseurs de Néhémie réparèrent la muraille jusqu’aux « degrés qui descendent de la cité de David ». À l’époque du Second Temple, la crête faisait partie de la Ville basse, et Jésus envoya l’aveugle se laver au bassin de Siloé. Pendant des siècles après 70 apr. J.-C., Siloé resta hors de l’enceinte. Au Ve siècle, un nouveau mur, attribué par le Pèlerin de Plaisance à l’impératrice Eudocie, la fit rentrer dans la ville, et dès le VIe siècle une basilique s’élevait au-dessus du bassin."
  it:
    - "La Città di Davide è lo stretto crinale che corre verso sud dal Monte del Tempio, fra la valle del Cedron e la valle centrale che Giuseppe Flavio chiama Valle dei Casari. Ai suoi piedi orientali sgorga il Ghicon, l’unica sorgente dell’antica Gerusalemme, ed è per questo che la città più antica sorse qui. La ceramica mostra presenze umane dal Calcolitico e dal Bronzo Antico. Le datazioni al radiocarbonio collocano i primi edifici pubblici all’inizio del XIX secolo a.C., e intorno alla sorgente fu costruita una massiccia torre; i suoi scavatori, Ronny Reich ed Eli Shukron, la datano al Bronzo Medio, mentre campioni più recenti consentono una data alla fine del IX secolo a.C., sicché la sua datazione è controversa."
    - "Charles Warren esplorò il crinale nel 1867 e trovò il pozzo verticale accanto alla sorgente che porta il suo nome; fu a lungo ritenuto il pozzo d’acqua gebuseo e, secondo una lettura di 2 Samuele 5,8, la via per cui entrarono gli uomini di Davide. Seguirono scavi sotto Parker e Vincent, Weill, Macalister e Duncan, Kathleen Kenyon (1961–1967), Yigal Shiloh (1978–1985) e, dal 1995, Reich e Shukron, che hanno mostrato che il pozzo è una fenditura naturale e che l’accesso dell’età del Bronzo alla sorgente era un passaggio fortificato. La Grande Struttura di Pietra di Eilat Mazar, scoperta nel 2005, fu presentata come il palazzo di Davide del X secolo a.C.; altri datano parti di essa molto più tardi e dubitano che fosse un unico edificio, e la questione è controversa."
    - "Davanti alla minaccia assira Ezechia «turò la sorgente superiore delle acque di Ghihon, che condusse giù direttamente, dal lato occidentale della città di Davide». Il tortuoso tunnel, lungo circa 533 m, porta l’acqua della sorgente alla Piscina di Siloe. Nel 1880 vi fu trovata un’iscrizione che racconta come due squadre di scavatori, scavando l’una verso l’altra, udirono le voci a vicenda e si incontrarono, e come l’acqua scorse poi per 1200 cubiti fino alla piscina; è ora nel Museo Archeologico di Istanbul. La datazione radiometrica dà una data dell’età del Ferro in accordo con la Bibbia; Reich e Shukron hanno sostenuto che fu scavato prima, intorno all’800 a.C., sicché l’attribuzione a Ezechia è controversa."
    - "Dopo l’esilio i costruttori di Neemia restaurarono il muro fino alla «scalinata per cui si scende dalla città di Davide». Nel periodo del Secondo Tempio il crinale faceva parte della Città Bassa, e Gesù mandò il cieco a lavarsi nella piscina di Siloe. Per secoli dopo il 70 d.C. Siloe restò fuori dalle mura. Nel V secolo un nuovo muro, attribuito dal Pellegrino di Piacenza all’imperatrice Eudocia, la riportò dentro la città, e nel VI secolo una basilica sorgeva sopra la piscina."
  pl:
    - "Miasto Dawida to wąski grzbiet biegnący na południe od Wzgórza Świątynnego, między doliną Cedronu a doliną środkową, którą Józef Flawiusz nazywa Doliną Serowarów. U jego wschodniego podnóża wypływa Gichon, jedyne źródło starożytnej Jerozolimy, dlatego najstarsze miasto stanęło właśnie tu. Ceramika świadczy o ludziach mieszkających tu od chalkolitu i wczesnej epoki brązu. Daty radiowęglowe umieszczają pierwsze budowle publiczne na początku XIX w. p.n.e., a wokół źródła wzniesiono masywną wieżę; jej odkrywcy, Ronny Reich i Eli Shukron, datują ją na środkową epokę brązu, podczas gdy późniejsze próbki dopuszczają datę pod koniec IX w. p.n.e., więc jej datowanie jest sporne."
    - "Charles Warren badał grzbiet w 1867 r. i znalazł pionowy szyb obok źródła, który nosi jego nazwisko; długo uważano go za jebusycki szyb wodny i, według jednego odczytania 2 Sm 5,8, za drogę, którą weszli ludzie Dawida. Potem prowadzili wykopaliska Parker i Vincent, Weill, Macalister i Duncan, Kathleen Kenyon (1961–1967), Yigal Shiloh (1978–1985), a od 1995 r. Reich i Shukron, którzy wykazali, że szyb jest naturalną szczeliną, a dostęp do źródła w epoce brązu był ufortyfikowanym przejściem. Wielka Budowla Kamienna Eilat Mazar, odsłonięta w 2005 r., została przedstawiona jako pałac Dawida z X w. p.n.e.; inni datują jej części znacznie później i wątpią, czy był to jeden budynek, i kwestia pozostaje sporna."
    - "Wobec asyryjskiego zagrożenia Ezechiasz „zatkał źródło wód w Gichonie wyższe, a przywiódł je dołem na zachód słońca ku miastu Dawidowemu”. Kręty tunel, długi na około 533 m, prowadzi wodę ze źródła do sadzawki Siloe. W 1880 r. znaleziono w nim napis opowiadający, jak dwie grupy kopaczy, wykuwając ku sobie, usłyszały swoje głosy i spotkały się, a woda popłynęła potem 1200 łokci do sadzawki; znajduje się on teraz w Muzeum Archeologicznym w Stambule. Datowanie radiometryczne daje datę z epoki żelaza zgodną z Biblią; Reich i Shukron dowodzili, że wykuto go wcześniej, około 800 r. p.n.e., więc przypisanie go Ezechiaszowi jest sporne."
    - "Po wygnaniu budowniczowie Nehemiasza naprawili mur aż do „schodu, po którym schodzą z miasta Dawidowego”. W okresie Drugiej Świątyni grzbiet był częścią Dolnego Miasta, a Jezus posłał niewidomego, by obmył się w sadzawce Siloe. Przez stulecia po 70 r. n.e. Siloe leżało poza murem miejskim. W V w. nowy mur, przypisywany przez pielgrzyma z Piacenzy cesarzowej Eudokji, przywrócił je w granice miasta, a w VI w. nad sadzawką stała bazylika."
  nl:
    - "De Stad van David is de smalle bergrug die vanaf de Tempelberg naar het zuiden loopt, tussen het Kidrondal en het centrale dal dat Flavius Josephus het Dal van de Kaasmakers noemt. Aan de oostelijke voet ontspringt de Gihon, de enige bron van het oude Jeruzalem, en daarom stond de oudste stad hier. Aardewerk toont bewoning vanaf het Chalcolithicum en de Vroege Bronstijd. Radiokoolstofdateringen plaatsen de eerste openbare gebouwen vroeg in de negentiende eeuw v.Chr., en rond de bron werd een massieve toren gebouwd; zijn opgravers, Ronny Reich en Eli Shukron, dateren hem in de Midden-Bronstijd, terwijl latere monsters een datering in de late negende eeuw v.Chr. toelaten, zodat de datering omstreden is."
    - "Charles Warren verkende de bergrug in 1867 en vond de verticale schacht naast de bron die zijn naam draagt; die werd lang gehouden voor de Jebusitische waterschacht en, volgens één lezing van 2 Samuël 5:8, voor de weg waarlangs Davids mannen binnendrongen. Opgravingen volgden onder Parker en Vincent, Weill, Macalister en Duncan, Kathleen Kenyon (1961–1967), Yigal Shiloh (1978–1985) en, vanaf 1995, Reich en Shukron, die aantoonden dat de schacht een natuurlijke spleet is en dat de toegang tot de bron in de Bronstijd een versterkte gang was. Eilat Mazars Grote Steenstructuur, in 2005 blootgelegd, werd gepresenteerd als Davids paleis uit de tiende eeuw v.Chr.; anderen dateren delen ervan veel later en betwijfelen dat het één gebouw was, en de kwestie is omstreden."
    - "Vóór de Assyrische dreiging, zegt Kronieken, “Jehizkia stopte ook den opperuitgang der wateren van Gihon, en leidde ze recht af beneden naar het westen der stad Davids”. De kronkelende tunnel, zo'n 533 m lang, voert de bron naar de Vijver van Siloam. In 1880 werd daarin een inscriptie gevonden die vertelt hoe twee ploegen houwers, die naar elkaar toe hakten, elkaars stemmen hoorden en elkaar ontmoetten, en hoe het water daarna 1200 el naar de vijver stroomde; zij bevindt zich nu in het Archeologisch Museum van Istanbul. Radiometrische datering geeft een datering in de IJzertijd die met de Bijbel strookt; Reich en Shukron hebben betoogd dat hij eerder werd uitgehouwen, omstreeks 800 v.Chr., zodat de toeschrijving aan Chizkia omstreden is."
    - "Na de ballingschap herstelden Nehemia's bouwers de muur tot aan “de trappen, die afgaan van Davids stad”. In de tijd van de Tweede Tempel maakte de bergrug deel uit van de Benedenstad, en Jezus stuurde de blinde om zich te wassen in de vijver van Siloam. Eeuwenlang na 70 n.Chr. lag Siloam buiten de stadsmuur. In de vijfde eeuw bracht een nieuwe muur, door de pelgrim van Piacenza toegeschreven aan keizerin Eudocia, het weer binnen de stad, en in de zesde eeuw stond er een basiliek boven de vijver."
  cs:
    - "Město Davidovo je úzký hřbet sbíhající na jih od Chrámové hory mezi údolím Kidronu a středním údolím, které Josephus nazývá Údolím sýrařů. U jeho východního úpatí vyvěrá Gichón, jediný pramen starověkého Jeruzaléma, proto zde stálo nejstarší město. Keramika dokládá lidi na tomto místě od chalkolitu a rané doby bronzové. Radiokarbonová data kladou první veřejné budovy na počátek 19. století př. n. l. a kolem pramene byla vystavěna mohutná věž; její vykopávači, Ronny Reich a Eli Shukron, ji datují do střední doby bronzové, zatímco pozdější vzorky umožňují datum na konci 9. století př. n. l., takže její datování je sporné."
    - "Charles Warren prozkoumal hřbet roku 1867 a nalezl svislou šachtu vedle pramene, která nese jeho jméno; byla dlouho pokládána za jebusejskou vodní šachtu a podle jednoho čtení 2 Sam 5,8 za cestu, kterou se Davidovi muži dostali dovnitř. Následovaly vykopávky pod Parkerem a Vincentem, Weillem, Macalisterem a Duncanem, Kathleen Kenyonovou (1961–1967), Yigalem Shilohem (1978–1985) a od roku 1995 Reichem a Shukronem, kteří ukázali, že šachta je přirozená puklina a že bronzový přístup k prameni byla opevněná chodba. Velká kamenná stavba, kterou odkryla Eilat Mazar roku 2005, byla představena jako Davidův palác z 10. století př. n. l.; jiní datují její části mnohem později a pochybují, že šlo o jednu budovu, a otázka je sporná."
    - "Před asyrskou hrozbou Chizkijáš „zasypal tok vody Gihonu hořejší, a přímo vedl jej dolů k západní straně města Davidova“. Klikatý tunel dlouhý asi 533 m vede pramen k rybníku Siloe. Roku 1880 byl v něm nalezen nápis vyprávějící, jak dva týmy tesačů, razící proti sobě, slyšely navzájem své hlasy a setkaly se a jak voda pak tekla 1200 loket k rybníku; je nyní v Istanbulském archeologickém muzeu. Radiometrické datování dává datum doby železné, které odpovídá Bibli; Reich a Shukron tvrdili, že byl vyhlouben dříve, kolem roku 800 př. n. l., takže přisouzení Chizkijášovi je sporné."
    - "Po vyhnanství opravovali Nehemjášovi stavitelé hradbu „až k stupňům sstoupajícím z města Davidova“. V období druhého chrámu byl hřbet součástí Dolního města a Ježíš poslal slepého, aby se umyl v rybníku Siloe. Po celá staletí po roce 70 n. l. ležel Siloe mimo městskou hradbu. V 5. století ho nová hradba, kterou poutník z Piacenzy připisuje císařovně Eudokii, vrátila do města a v 6. století stála nad rybníkem bazilika."
  sv:
    - "Davids stad är den smala åsen som löper söderut från Tempelberget, mellan Kidrondalen och den centrala dalen som Josefus kallar Ostmakardalen. Vid dess östra fot väller Gihon upp, det forntida Jerusalems enda källa, vilket är skälet till att den äldsta staden låg här. Keramik visar att människor bodde här redan under kalkolitikum och äldre bronsålder. Radiokoldateringar placerar de första offentliga byggnaderna i början av 1800-talet f.Kr., och ett massivt torn byggdes kring källan; dess utgrävare, Ronny Reich och Eli Shukron, daterar det till mellersta bronsåldern, medan senare prover tillåter en datering till slutet av 800-talet f.Kr., så dess datering är omtvistad."
    - "Charles Warren undersökte åsen 1867 och fann det lodräta schaktet vid källan som bär hans namn; det ansågs länge vara det jebusitiska vattenschaktet och, enligt en läsning av 2 Sam 5:8, den väg på vilken Davids män tog sig in. Utgrävningar följde under Parker och Vincent, Weill, Macalister och Duncan, Kathleen Kenyon (1961–1967), Yigal Shiloh (1978–1985) och, från 1995, Reich och Shukron, som visade att schaktet är en naturlig spricka och att bronsålderns tillgång till källan var en befäst gång. Eilat Mazars Stora stenbyggnad, blottad 2005, framställdes som Davids palats från 900-talet f.Kr.; andra daterar delar av den mycket senare och betvivlar att det var en enda byggnad, och frågan är omtvistad."
    - "Inför det assyriska hotet var det Hiskia som ”täppte till Gihonsvattnets övre källa och ledde vattnet nedåt, väster om Davids stad”. Den slingrande tunneln, omkring 533 m lång, för källan till Siloadammen. År 1880 hittades i den en inskription som berättar hur två lag av huggare, som högg mot varandra, hörde varandras röster och möttes, och hur vattnet sedan rann 1 200 alnar till dammen; den finns nu i Istanbuls arkeologiska museum. Radiometrisk datering ger en järnåldersdatering som stämmer med Bibeln; Reich och Shukron har hävdat att den höggs tidigare, omkring 800 f.Kr., så attributionen till Hiskia är omtvistad."
    - "Efter exilen satte Nehemjas byggare muren i stånd ner till ”trapporna som föra ned från Davids stad”. Under andra tempelperioden var åsen en del av Nedre staden, och Jesus sände den blinde att tvätta sig i Siloadammen. I århundraden efter år 70 e.Kr. låg Siloa utanför stadsmuren. På 400-talet förde en ny mur, som Piacenzapilgrimen tillskriver kejsarinnan Eudokia, tillbaka den innanför staden, och på 500-talet stod en basilika över dammen."
  nb:
    - "Davidsbyen er den smale ryggen som går sørover fra Tempelhøyen, mellom Kedron-dalen og den sentrale dalen som Josefus kaller Ostemakernes dal. Ved dens østlige fot stiger Gihon, det eneste kildevannet i det gamle Jerusalem, og det er derfor den eldste byen sto her. Keramikk viser folk her fra kalkolittisk tid og tidlig bronsealder. Radiokarbondateringer setter de første offentlige bygningene tidlig på 1800-tallet f.Kr., og et massivt tårn ble bygd rundt kilden; utgraverne, Ronny Reich og Eli Shukron, daterer det til mellombronsealderen, mens senere prøver tillater en datering til slutten av 800-tallet f.Kr., så dateringen er omstridt."
    - "Charles Warren undersøkte ryggen i 1867 og fant den loddrette sjakten ved kilden som bærer hans navn; den ble lenge regnet for jebusittenes vannsjakt og, etter én lesning av 2. Samuelsbok 5,8, for veien Davids menn kom seg inn. Utgravninger fulgte under Parker og Vincent, Weill, Macalister og Duncan, Kathleen Kenyon (1961–1967), Yigal Shiloh (1978–1985) og, fra 1995, Reich og Shukron, som viste at sjakten er en naturlig sprekk og at bronsealderens adkomst til kilden var en befestet passasje. Eilat Mazars Store steinbygning, avdekket i 2005, ble presentert som Davids palass fra 900-tallet f.Kr.; andre daterer deler av den mye senere og tviler på at den var én bygning, og spørsmålet er omstridt."
    - "Før den assyriske trusselen var det Hiskia som «tilstoppet det øvre utløp av Gihonvannet og ledet det ned vestenfor Davids stad». Den slyngede tunnelen, omtrent 533 m lang, fører kilden til Siloa-dammen. I 1880 ble det funnet en innskrift i den som forteller hvordan to lag hoggere, som hugget mot hverandre, hørte hverandres stemmer og møttes, og hvordan vannet så rant 1200 alen til dammen; den er nå i Istanbuls arkeologiske museum. Radiometrisk datering gir en jernalderdato i samsvar med Bibelen; Reich og Shukron har hevdet at den ble hugget tidligere, omkring 800 f.Kr., så tilskrivningen til Hiskia er omstridt."
    - "Etter eksilet satte Nehemjas byggere muren i stand ned til «de trapper som går ned fra Davids stad». I annen tempels tid var ryggen en del av Underbyen, og Jesus sendte den blinde mannen for å vaske seg i Siloa-dammen. I århundrer etter 70 e.Kr. lå Siloa utenfor bymuren. På 400-tallet brakte en ny mur, som pilegrimen fra Piacenza tilskriver keiserinne Eudokia, den tilbake innenfor byen, og på 500-tallet sto en basilika over dammen."
  tl:
    - "Ang Bayan ni David ay ang makitid na tagaytay na tumatakbo sa timog mula sa Bundok ng Templo, sa pagitan ng libis ng Cedron at ng gitnang libis na tinatawag ni Josefo na Libis ng mga Tagagawa ng Keso. Sa silangang paanan nito ay ang Gihon, ang tanging bukal ng sinaunang Jerusalem, kaya dito ang pinakamatandang bayan. Ipinakikita ng palayok ang mga tao rito mula pa sa Chalcolitiko at Maagang Panahon ng Tanso. Inilalagay ng mga petsang radiocarbon ang mga unang pampublikong gusali sa maagang ika-19 na siglo BK, at isang napakalaking tore ang itinayo sa palibot ng bukal; ipinepetsa ito ng mga tagahukay nitong sina Ronny Reich at Eli Shukron sa Gitnang Panahon ng Tanso, samantalang ang mas huling mga sampol ay nagpapahintulot ng petsa sa huling ika-9 na siglo BK, kaya pinagtatalunan ang petsa nito."
    - "Sinuri ni Charles Warren ang tagaytay noong 1867 at natagpuan ang patayong lagusan sa tabi ng bukal na nagdadala ng pangalan niya; matagal itong inakalang daluyan ng tubig ng mga Jebuseo at, ayon sa isang pagbasa ng 2 Samuel 5:8, ang daan na ginamit ng mga tauhan ni David upang makapasok. Sumunod ang mga paghuhukay nina Parker at Vincent, Weill, Macalister at Duncan, Kathleen Kenyon (1961–1967), Yigal Shiloh (1978–1985) at, mula 1995, nina Reich at Shukron, na nagpakitang likas na biyak ang lagusan at ang daan ng Panahon ng Tanso patungo sa bukal ay nakukutaang daanan. Ang Malaking Estrukturang Bato ni Eilat Mazar, na natuklasan noong 2005, ay iniharap bilang palasyo ni David noong ika-10 siglo BK; ipinepetsa ng iba ang mga bahagi nito nang mas huli at pinagdududahan na iisang gusali ito, kaya pinagtatalunan ang tanong."
    - "Bago ang banta ng Asiria, si Ezechias ang “nagpatigil ng pinakamataas na bukal ng tubig sa Gihon, at ibinabang tuloy sa dakong kalunuran ng bayan ni David”. Ang paliko-likong tunel, mga 533 m ang haba, ay nagdadala ng bukal sa Tangke ng Siloe. Noong 1880 may natagpuang inskripsiyon doon na nagsasalaysay kung paanong dalawang pangkat ng mga tagatabas, na naghuhukay patungo sa isa't isa, ay nagkarinigan ng tinig at nagkita, at kung paanong dumaloy ang tubig nang 1,200 siko patungo sa tangke; ngayon ay nasa Istanbul Archaeological Museum. Ang radiometrikong pagpepetsa ay nagbibigay ng petsa ng Panahon ng Bakal na tugma sa Bibliya; nangatwiran sina Reich at Shukron na mas maaga itong tinabas, mga 800 BK, kaya pinagtatalunan ang pagtukoy kay Ezechias."
    - "Pagkatapos ng pagkatapon, kinumpuni ng mga tagapagtayo ni Nehemias ang pader hanggang sa “mga baytang na paibaba mula sa bayan ni David”. Sa panahon ng Ikalawang Templo, bahagi ng Ibabang Lungsod ang tagaytay, at isinugo ni Jesus ang bulag na maghugas sa tangke ng Siloe. Sa loob ng mga siglo pagkatapos ng 70 AD, ang Siloe ay nasa labas ng pader ng lungsod. Noong ika-5 siglo, isang bagong pader, na iniuugnay ng peregrino ng Piacenza kay Emperatris Eudocia, ang nagbalik dito sa loob ng lungsod, at pagsapit ng ika-6 na siglo ay may basilika sa ibabaw ng tangke."
  da:
    - "Davidsbyen er den smalle højderyg, der løber sydpå fra Tempelbjerget, mellem Kedron-dalen og den centrale dal, som Josefus kalder Ostemagernes Dal. Ved dens østlige fod ligger Gihon, den eneste kilde i det gamle Jerusalem, hvilket er grunden til, at den ældste by lå her. Potteskår viser, at der har boet mennesker her fra kobberalderen og tidlig bronzealder. Radiokulstofdateringer placerer de første offentlige bygninger i begyndelsen af 1800-tallet f.Kr., og et massivt tårn blev bygget rundt om kilden; dets udgravere, Ronny Reich og Eli Shukron, dater det til mellembronzealderen, mens senere prøver tillader en datering til sidst i 800-tallet f.Kr., så dets datering er omstridt."
    - "Charles Warren udforskede højderyggen i 1867 og fandt den lodrette skakt ved siden af kilden, som bærer hans navn; den blev længe anset for den jebusittiske vandskakt og efter én læsning af 2 Sam 5,8 for den vej, hvorved Davids mænd kom ind. Udgravninger fulgte under Parker og Vincent, Weill, Macalister og Duncan, Kathleen Kenyon (1961–1967), Yigal Shiloh (1978–1985) og fra 1995 Reich og Shukron, som viste, at skakten er en naturlig sprække, og at bronzealderens adgang til kilden var en befæstet passage. Eilat Mazars Store Stenbygning, afdækket i 2005, blev præsenteret som Davids palads fra 900-tallet f.Kr.; andre dater dele af den meget senere og betvivler, at den var én bygning, og spørgsmålet er omstridt."
    - "Før den assyriske trussel tilstoppede Hizkija, som det hedder, »ogsaa det øverste Vandløb fra Gihon og ledede det ned, Vest for Davids Stad«. Den bugtede tunnel, cirka 533 m lang, fører kilden til Siloam-dammen. I 1880 blev der i den fundet en indskrift, der fortæller, hvordan to hold stenhuggere, der huggede mod hinanden, hørte hinandens stemmer og mødtes, og hvordan vandet derpå flød 1.200 alen til dammen; den er nu i Istanbuls arkæologiske museum. Radiometrisk datering giver en jernaldersdatering i overensstemmelse med Bibelen; Reich og Shukron har hævdet, at den blev hugget tidligere, omkring 800 f.Kr., så tilskrivningen til Hizkija er omstridt."
    - "Efter eksilet istandsatte Nehemias' bygmestre muren ned til »Trapperne, som gaa ned fra Davids Stad«. I Andet Tempels tid var højderyggen en del af Nedre By, og Jesus sendte den blinde for at vaske sig i Siloam-dammen. I århundreder efter 70 e.Kr. lå Siloam uden for bymuren. I 400-tallet førte en ny mur, som Pilgrimmen fra Piacenza tilskriver kejserinde Eudokia, den tilbage inden for byen, og i 500-tallet stod en basilika over dammen."
  sr:
    - "Давидов град је уски гребен који се протеже јужно од Храмовне горе, између долине Кедрон и средишње долине коју Јосиф Флавије зове Долина сирара. У његовом источном подножју извире Гион, једини извор древног Јерусалима, зато је најстарији град стајао овде. Керамика показује људе овде још из халколитика и раног бронзаног доба. Радиокарбонски датуми смештају прве јавне зграде у почетак 19. века п. н. е., а око извора подигнута је масивна кула; њени ископавачи, Рони Рајх и Или Шукрон, датирају је у средње бронзано доба, док каснији узорци допуштају датум крајем 9. века п. н. е., па је њено датирање спорно."
    - "Чарлс Ворен истраживао је гребен 1867. и нашао вертикални шахт поред извора који носи његово име; дуго се сматрао јевусејским водоводним окном и, по једном читању 2. Самуилова 5,8, путем којим су ушли Давидови људи. Затим су следила ископавања под Паркером и Венсаном, Вејом, Макалистером и Данканом, Кетлин Кењон (1961–1967), Јигалом Шилохом (1978–1985) и, од 1995, Рајхом и Шукроном, који су показали да је шахт природна пукотина и да је бронзанодопски прилаз извору био утврђен пролаз. Ејлат Мазар је 2005. открила Велику камену грађевину, која је представљена као Давидова палата из 10. века п. н. е.; други датирају њене делове много касније и сумњају да је била једна зграда, па је питање спорно."
    - "Пред асирском претњом Језекија је „загради горњи извор воде Гиона, и право је сведе доле на западну страну града Давидовог“. Кривудави тунел, дуг око 533 м, води извор до Силоамског базена. Године 1880. у њему је нађен натпис који приповеда како су две екипе клесара, секући једна ка другој, чуле једна другој гласове и сусреле се, и како је вода затим потекла 1.200 лаката до базена; сада је у Истанбулском археолошком музеју. Радиометријско датирање даје датум из гвозденог доба у складу са Библијом; Рајх и Шукрон тврдили су да је ископан раније, око 800. п. н. е., па је приписивање Језекији спорно."
    - "После изгнанства Немијини градитељи поправљали су зид до „басамака који силазе из града Давидовог“. У доба Другог храма гребен је био део Доњег града, и Исус је слепца послао да се умије у Силоамском базену. Вековима после 70. н. е. Силоам је лежао изван градског зида. У 5. веку нов зид, који ходочасник из Пјаћенце приписује царици Евдокији, вратио га је унутар града, а до 6. века над базеном је стајала базилика."
