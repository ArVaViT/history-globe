# Overview article (ADR 0007). Mainstream facts only; the dates of the Gihon spring tower, the Siloam tunnel and the Large Stone Structure are named as disputed.
id: city-of-david
place: a84f426
title:
  en: "City of David"
  ru: "Город Давидов"
  uk: "Місто Давида"
  es: "Ciudad de David"
  pt: "Cidade de Davi"
  de: "Stadt Davids"
  fr: "Cité de David"
  it: "Città di Davide"
  pl: "Miasto Dawida"
  nl: "Stad van David"
  cs: "Město Davidovo"
