body:
  en:
    - "The Jabbok is the Zarqa, the “blue river” of Jordan, the largest tributary of the Jordan from the east after the Yarmuk. It rises near Amman, the ancient Rabbah of the Ammonites, flows north-east into the desert's edge, then swings north-west and west and cuts a deep gorge through the hills of Gilead to reach the Jordan near Adam, the modern Damiya, some 40 km north of the Dead Sea; it flows all year. The river divided Gilead into a northern and a southern half, and its upper reach was the frontier of Ammon."
    - "On its bank Jacob, returning from Haran, sent his wives and children “over the ford Jabbok” by night and stayed alone; “there wrestled a man with him until the breaking of the day”, who touched his thigh and gave him the name Israel, and Jacob called the place Peniel, “for I have seen God face to face”. Israel later took from Sihon the land “from Arnon unto Jabbok, even unto the children of Ammon”, but did not touch “any place of the river Jabbok” that was Ammonite; Reuben and Gad received the country up to “the river Jabbok, which is the border of the children of Ammon”. Jephthah answered the king of Ammon that Israel held all the Amorite land “from Arnon even unto Jabbok”. Gideon chased the Midianites up the river past Succoth and Penuel."
    - "The twin mounds of Tulul edh-Dhahab in the river's great bend are often taken for Penuel and Mahanaim, and Tell Deir Alla near its mouth for Succoth, though both identifications are disputed; excavations at Deir Alla found a Late Bronze sanctuary and the plaster inscription of Balaam. Today the Zarqa runs past the industrial city of Zarqa and below Jerash, whose stream joins it; the King Talal Dam, built in the 1970s, holds its water for the farms of the Jordan valley, and the river below Amman is badly polluted."
  ru:
    - "Иавок — это Эз-Зарка, «голубая река» Иордании, крупнейший после Ярмука восточный приток Иордана. Она начинается у Аммана, древней Раввы Аммонитской, течёт на северо-восток к краю пустыни, затем поворачивает на северо-запад и запад и прорезает глубокое ущелье в горах Галаада, выходя к Иордану у Адама, нынешней Дамии, примерно в 40 км к северу от Мёртвого моря; вода в нём есть круглый год. Река делила Галаад на северную и южную половины, а её верхнее течение было границей Аммона."
    - "На её берегу Иаков, возвращаясь из Харрана, ночью перевёл жён и детей «через Иавок вброд» и остался один; «боролся Некто с ним до появления зари», коснулся его бедра и дал ему имя Израиль, и Иаков назвал место Пенуэл: «я видел Бога лицем к лицу». Позже Израиль взял у Сигона землю «от Арнона до Иавока, до пределов Аммонитских», но не трогал мест «близ потока Иавока», принадлежавших Аммону; Рувим и Гад получили страну «до потока Иавока, предела сынов Аммоновых». Иеффай отвечал царю Аммонитскому, что Израиль владеет всеми пределами Аморрея «от Арнона до Иавока». Гедеон гнал Мадианитян вверх по реке мимо Сокхофа и Пенуэла."
    - "Двойные холмы Тулуль-эд-Захаб в большой излучине реки часто принимают за Пенуэл и Маханаим, а Телль-Дейр-Алла у её устья — за Сокхоф, хотя оба отождествления спорны; раскопки в Дейр-Алле открыли святилище позднего бронзового века и надпись Валаама на штукатурке. Сегодня Зарка течёт мимо промышленного города Зарка и ниже Джераша, чей ручей в неё впадает; плотина короля Талала, построенная в 1970-х годах, держит её воду для хозяйств Иорданской долины, а река ниже Аммана сильно загрязнена."
  uk:
    - "Яббок — це Зарка, «блакитна річка» Йорданії, найбільша східна притока Йордану після Ярмуку. Вона бере початок поблизу Амману, давньої Равви аммонітян, тече на північний схід до краю пустелі, потім повертає на північний захід і захід та прорізає глибоку ущелину крізь пагорби Гілеаду, щоб досягти Йордану біля Адама, нинішньої Дамії, приблизно за 40 км на північ від Мертвого моря; вона тече цілий рік. Річка ділила Гілеад на північну й південну половини, а її верхня течія була кордоном Аммона."
    - "На її березі Яків, повертаючись із Харану, вночі взяв дружин і дітей і «перейшов бридьма брід Ябок», а сам залишився; «боровсь із ним хтось, аж покіль обутьріло», хто торкнувся його стегна й дав йому ім’я Ізраїль, а Яків назвав місце Пенуел, «бачив бо я Бога лицем до лиця». Пізніше Ізраїль узяв у Сігона землю «від Арнона до Ябока, до синів Аммонових», але не торкався «нї до всього побережжя Ябока», що було аммонітським; Рувим і Гад одержали край аж «до Ябока ріки, гряницї синів Амона». Єфтай відповів цареві Аммона, що Ізраїль тримає всю аморейську землю «від Арнону до Ябоку». Гедеон гнав мадіамлян угору по річці повз Сокхот і Пенуел."
    - "Двійні городища Туллюль-ед-Дегаб у великій луці річки часто вважають Пенуелом і Маханаїмом, а Телль-Дейр-Алла біля її гирла — Сокхотом, хоча обидва ототожнення спірні; розкопки в Дейр-Аллі знайшли святилище пізнього бронзового віку та штукатурений напис Валаама. Сьогодні Зарка тече повз промислове місто Зарка і нижче Джераша, чий потік до неї впадає; гребля короля Талала, збудована в 1970-х роках, тримає її воду для ферм Йорданської долини, а річка нижче Амману сильно забруднена."
  es:
    - "El Jaboc es el Zarqa, el «río azul» de Jordania, el mayor afluente del Jordán por el este después del Yarmuk. Nace cerca de Amán, la antigua Rabá de los amonitas, fluye al nordeste hacia el borde del desierto, luego gira al noroeste y al oeste y abre una profunda garganta en las colinas de Galaad para llegar al Jordán cerca de Adam, la actual Damiya, a unos 40 km al norte del mar Muerto; corre todo el año. El río dividía Galaad en una mitad norte y otra sur, y su tramo alto era la frontera de Amón."
    - "En su orilla, Jacob, de regreso de Harán, hizo pasar de noche a sus mujeres e hijos «el vado de Jaboc» y se quedó solo; «luchó con él un varón hasta que rayaba el alba», que le tocó el muslo y le dio el nombre de Israel, y Jacob llamó al lugar Peniel, «porque vi á Dios cara á cara». Israel tomó más tarde a Sehón la tierra «desde Arnón hasta Jaboc, hasta los hijos de Ammón», pero no tocó «todo lo que está á la orilla del arroyo de Jaboc» que era amonita; Rubén y Gad recibieron el país hasta «el arroyo de Jaboc, término de los hijos de Ammón». Jefté respondió al rey de Amón que Israel poseía toda la tierra amorrea «desde Arnón hasta Jaboc». Gedeón persiguió a los madianitas río arriba, pasando Sucot y Peniel."
    - "Los montículos gemelos de Tulul edh-Dhahab, en el gran meandro del río, se toman a menudo por Peniel y Mahanaim, y Tell Deir Alla, cerca de su desembocadura, por Sucot, aunque ambas identificaciones son discutidas; las excavaciones de Deir Alla hallaron un santuario del Bronce Final y la inscripción en yeso de Balaam. Hoy el Zarqa pasa junto a la ciudad industrial de Zarqa y bajo Jerash, cuyo arroyo se le une; la presa del Rey Talal, construida en los años setenta, retiene su agua para las granjas del valle del Jordán, y el río aguas abajo de Amán está gravemente contaminado."
  pt:
    - "O Jaboque é o Zarqa, o “rio azul” da Jordânia, o maior afluente do Jordão pela margem oriental depois do Yarmuk. Nasce perto de Amã, a antiga Rabá dos amonitas, corre para nordeste até a orla do deserto, depois vira para noroeste e oeste e corta uma profunda garganta nas colinas de Gileade para alcançar o Jordão perto de Adã, a moderna Damiya, cerca de 40 km ao norte do mar Morto; corre o ano todo. O rio dividia Gileade em uma metade norte e uma sul, e seu curso superior era a fronteira de Amom."
    - "Em sua margem, Jacó, voltando de Harã, mandou à noite suas mulheres e filhos “atravessar o vau do Jaboque” e ficou sozinho; “lutou com um homem ali até o raiar do dia”, que lhe tocou a coxa e lhe deu o nome Israel, e Jacó chamou o lugar Peniel, pois disse: “Vi a Deus face a face, e a minha vida foi preservada”. Israel tomou depois de Seom a terra “desde o Arnom até o Jaboque, até os filhos de Amom”, mas não se aproximou “de todas as margens do rio Jaboque” que eram amonitas; Rúben e Gade receberam o país até “o rio Jaboque, que é a fronteira dos filhos de Amom”. Jefté respondeu ao rei de Amom que Israel tomara toda a terra amorreia “desde o Arnom até o Jaboque”. Gideão perseguiu os midianitas rio acima, passando por Sucote e Peniel."
    - "Os montes gêmeos de Tulul edh-Dhahab, na grande curva do rio, são muitas vezes tomados por Peniel e Maanaim, e Tell Deir Alla, perto da foz, por Sucote, embora ambas as identificações sejam discutidas; as escavações em Deir Alla acharam um santuário do Bronze Tardio e a inscrição em gesso de Balaão. Hoje o Zarqa passa pela cidade industrial de Zarqa e abaixo de Jerash, cujo riacho se junta a ele; a Barragem Rei Talal, construída na década de 1970, retém sua água para as fazendas do vale do Jordão, e o rio abaixo de Amã é gravemente poluído."
  de:
    - "Der Jabbok ist der Zarqa, der „blaue Fluss“ Jordaniens, nach dem Jarmuk der größte Nebenfluss des Jordan von Osten. Er entspringt bei Amman, dem antiken Rabba der Ammoniter, fließt nordöstlich an den Wüstenrand, schwenkt dann nach Nordwesten und Westen und schneidet eine tiefe Schlucht durch das Bergland Gilead, um den Jordan bei Adam, dem heutigen Damija, etwa 40 km nördlich des Toten Meeres zu erreichen; er führt das ganze Jahr Wasser. Der Fluss teilte Gilead in eine nördliche und eine südliche Hälfte, und sein Oberlauf war die Grenze Ammons."
    - "An seinem Ufer schickte Jakob, von Haran heimkehrend, nachts seine Frauen und Kinder „an die Furt des Jabbok“ und blieb allein; „da rang ein Mann mit ihm, bis die Morgenröte anbrach“, der seine Hüfte berührte und ihm den Namen Israel gab, und Jakob nannte die Stätte Pniel, „denn ich habe Gott von Angesicht gesehen“. Israel nahm später Sihon das Land „vom Arnon an bis an den Jabbok und bis an die Kinder Ammon“ ab, rührte aber nichts an, „was am Bach Jabbok war“ und ammonitisch war; Ruben und Gad erhielten das Land „bis an den Bach Jabbok, der die Grenze ist der Kinder Ammon“. Jeftah antwortete dem König von Ammon, Israel habe das ganze Amoriterland eingenommen „vom Arnon an bis an den Jabbok“. Gideon jagte die Midianiter den Fluss hinauf an Sukkot und Penuel vorbei."
    - "Die Zwillingshügel von Tulul edh-Dhahab in der großen Flussbiegung gelten oft als Penuel und Mahanajim, und Tell Deir Alla nahe der Mündung als Sukkot, doch sind beide Gleichsetzungen umstritten; die Grabungen in Deir Alla fanden ein spätbronzezeitliches Heiligtum und die Putzinschrift des Bileam. Heute fließt der Zarqa an der Industriestadt Zarqa vorbei und unterhalb von Dscherasch, dessen Bach in ihn mündet; der in den 1970er-Jahren gebaute König-Talal-Damm hält sein Wasser für die Höfe des Jordantals zurück, und der Fluss unterhalb Ammans ist stark verschmutzt."
  fr:
    - "Le Jabbok est le Zarqa, la « rivière bleue » de Jordanie, le plus grand affluent oriental du Jourdain après le Yarmouk. Il naît près d’Amman, l’ancienne Rabba des Ammonites, coule vers le nord-est à la lisière du désert, puis oblique vers le nord-ouest et l’ouest et creuse une gorge profonde à travers les collines de Galaad pour rejoindre le Jourdain près d’Adam, l’actuelle Damiya, à quelque 40 km au nord de la mer Morte ; il coule toute l’année. La rivière divisait Galaad en une moitié nord et une moitié sud, et son cours supérieur était la frontière d’Ammon."
    - "Sur sa rive, Jacob, de retour de Haran, fit passer de nuit « le gué de Jabbok » à ses femmes et à ses enfants et resta seul ; « un homme lutta avec lui jusqu’au lever de l’aurore », lui toucha la hanche et lui donna le nom d’Israël, et Jacob appela le lieu Peniel, « car, dit-il, j’ai vu Dieu face à face ». Israël prit plus tard à Sihon le pays « depuis l’Arnon jusqu’au Jabbok, jusqu’à la frontière des enfants d’Ammon », mais n’approcha pas de « tous les bords du torrent de Jabbok » qui était ammonite ; Ruben et Gad reçurent le pays jusqu’au « torrent de Jabbok, frontière des enfants d’Ammon ». Jephté répondit au roi d’Ammon qu’Israël tenait tout le pays amoréen « depuis l’Arnon jusqu’au Jabbok ». Gédéon poursuivit les Madianites en remontant la rivière, par Succoth et Penuel."
    - "Les tertres jumeaux de Tulul edh-Dhahab, dans la grande boucle de la rivière, sont souvent tenus pour Penuel et Mahanaïm, et Tell Deir Alla, près de son embouchure, pour Succoth, mais les deux identifications sont discutées ; les fouilles de Deir Alla ont trouvé un sanctuaire du Bronze récent et l’inscription sur plâtre de Balaam. Aujourd’hui, le Zarqa passe devant la ville industrielle de Zarqa et au-dessous de Jerash, dont le cours d’eau le rejoint ; le barrage du roi Talal, construit dans les années 1970, retient son eau pour les fermes de la vallée du Jourdain, et la rivière en aval d’Amman est gravement polluée."
  pl:
    - "Jabbok to Zarka, „błękitna rzeka” Jordanii, największy dopływ Jordanu ze wschodu po Jarmuku. Wypływa koło Ammanu, dawnej Rabby Ammonitów, płynie na północny wschód ku skrajowi pustyni, potem skręca na północny zachód i na zachód i przecina głębokim wąwozem wzgórza Gileadu, by dotrzeć do Jordanu koło Adam, dzisiejszej Damiji, około 40 km na północ od Morza Martwego; płynie przez cały rok. Rzeka dzieliła Gilead na północną i południową połowę, a jej górny bieg był granicą Ammonu."
    - "Nad jej brzegiem Jakub, wracając z Charanu, przeprawił nocą żony i dzieci „przez bród Jabok” i został sam; „biedził się z nim mąż aż do wejścia zorzy”, który dotknął jego biodra i dał mu imię Izrael, a Jakub nazwał miejsce Penuel, mówiąc: „Iżem widział Boga twarzą w twarz”. Izrael wziął później od Sychona ziemię „od Arnonu aż do Jaboku, i aż do ziemi synów Ammonowych”, lecz nie dotknął „żadnego miejsca przyległego potokowi Jabok”, które było ammonickie; Ruben i Gad otrzymali kraj aż do „potoku Jabok, granicy synów Ammonowych”. Jefte odpowiedział królowi Ammonu, że Izrael posiadł całą ziemię amorejską „od Arnon aż do Jabok”. Gedeon ścigał Madianitów w górę rzeki obok Sukkot i Penuel."
    - "Bliźniacze pagórki Tulul ed-Dahab w wielkim zakolu rzeki uważa się często za Penuel i Mahanaim, a Tell Dajr Alla koło jej ujścia za Sukkot, choć obie identyfikacje są sporne; wykopaliska w Dajr Alla znalazły sanktuarium z późnej epoki brązu i tynkowy napis Balaama. Dziś Zarka płynie obok przemysłowego miasta Zarka i poniżej Dżerasz, którego strumień do niej wpada; zapora Króla Talala, zbudowana w latach 70. XX w., zatrzymuje jej wodę dla gospodarstw doliny Jordanu, a rzeka poniżej Ammanu jest silnie zanieczyszczona."
  it:
    - "Lo Iabbok è lo Zarqa, il «fiume blu» della Giordania, il maggiore affluente orientale del Giordano dopo lo Yarmuk. Nasce presso Amman, l’antica Rabba degli Ammoniti, scorre a nord-est verso il margine del deserto, poi gira a nord-ovest e a ovest e scava una profonda gola fra le colline di Galaad per raggiungere il Giordano presso Adam, l’odierna Damiya, circa 40 km a nord del Mar Morto; scorre tutto l’anno. Il fiume divideva Galaad in una metà settentrionale e una meridionale, e il suo corso superiore era la frontiera di Ammon."
    - "Sulla sua riva Giacobbe, tornando da Carran, di notte con le mogli e i figli «passò il guado di Iabbok», fece passare il torrente a tutti e rimase solo; «un uomo lottò con lui fino all’apparir dell’alba», gli toccò l’anca e gli diede il nome Israele, e Giacobbe chiamò il luogo Peniel, «perché ho veduto Iddio a faccia a faccia». Israele prese poi a Sicon il paese «dall’Arnon fino al Jabbok, sino ai confini de’ figliuoli di Ammon», ma non si avvicinò al paese ammonita, «ad alcun posto toccato dal torrente di Iabbok»; a Ruben e a Gad fu dato il paese «fino al torrente di Iabbok, frontiera dei figliuoli di Ammon». Iefte rispose al re di Ammon che Israele teneva tutto il territorio amorreo «dall’Arnon allo Jabbok». Gedeone inseguì i Madianiti lungo il fiume oltre Succot e Penuel."
    - "I tell gemelli di Tulul edh-Dhahab nella grande ansa del fiume sono spesso ritenuti Penuel e Maanaim, e Tell Deir Alla presso la foce Succot, benché entrambe le identificazioni siano discusse; gli scavi di Deir Alla trovarono un santuario del Bronzo Tardo e l’iscrizione a intonaco di Balaam. Oggi lo Zarqa scorre accanto alla città industriale di Zarqa e sotto Jerash, il cui torrente vi confluisce; la diga King Talal, costruita negli anni Settanta, ne trattiene l’acqua per le fattorie della valle del Giordano, e il fiume sotto Amman è gravemente inquinato."
  nl:
    - "De Jabbok is de Zarqa, de “blauwe rivier” van Jordanië, na de Yarmuk de grootste zijrivier van de Jordaan vanuit het oosten. Hij ontspringt bij Amman, het oude Rabba van de Ammonieten, stroomt noordoostwaarts naar de woestijnrand, buigt dan af naar het noordwesten en westen en snijdt een diepe kloof door het bergland van Gilead om de Jordaan te bereiken bij Adam, het moderne Damiya, zo’n 40 km ten noorden van de Dode Zee; hij stroomt het hele jaar. De rivier verdeelde Gilead in een noordelijke en een zuidelijke helft, en zijn bovenloop was de grens van Ammon."
    - "Aan zijn oever zond Jakob, terugkerend uit Haran, zijn vrouwen en kinderen ’s nachts “over het veer van de Jabbok” en bleef alleen; “een man worstelde met hem, totdat de dageraad opging”, die zijn heup aanraakte en hem de naam Israël gaf, en Jakob noemde de plaats Pniël, “ik heb God gezien van aangezicht tot aangezicht”. Israël nam later van Sihon het land “van de Arnon af tot de Jabbok toe, tot aan de kinderen Ammons”, maar naderde niet “de ganse streek der beek Jabbok” die Ammonitisch was; Ruben en Gad kregen het land “tot aan de beek Jabbok, de landpale der kinderen Ammons”. Jefta antwoordde de koning van Ammon dat Israël het hele Amorietische land bezat “van de Arnon af tot aan de Jabbok”. Gideon joeg de Midianieten de rivier op langs Sukkot en Peniël."
    - "De tweelingheuvels Tulul edh-Dhahab in de grote bocht van de rivier worden vaak gehouden voor Peniël en Machanaïm, en Tell Deir Alla bij de monding voor Sukkot, al zijn beide identificaties omstreden; opgravingen te Deir Alla vonden een heiligdom uit de Late Bronstijd en het gepleisterde opschrift van Bileam. Nu stroomt de Zarqa langs de industriestad Zarqa en onder Jerash door, waarvan de beek erin uitmondt; de King Talal-dam, gebouwd in de jaren 1970, houdt zijn water vast voor de boerderijen van het Jordaandal, en de rivier onder Amman is ernstig vervuild."
  cs:
    - "Jabok je Zarká, „modrá řeka“ Jordánska, největší východní přítok Jordánu po Jarmuku. Pramení poblíž Ammánu, starověké Rabby Amónců, teče na severovýchod k okraji pouště, pak se stáčí na severozápad a na západ a proráží hlubokou soutěsku pahorky Gileadu, aby dosáhla Jordánu u Adamu, dnešní Damíje, asi 40 km severně od Mrtvého moře; teče po celý rok. Řeka dělila Gilead na severní a jižní polovinu a její horní tok byl hranicí Amónu."
    - "Na jejím břehu Jákob, vracející se z Cháranu, poslal v noci své ženy a děti „přes brod Jabok“ a zůstal sám; „tu zápasil s ním muž až do svitání“, který se dotkl jeho stehna a dal mu jméno Izrael, a Jákob nazval místo Penuel, „nebo jsem prý viděl Boha tváří v tvář“. Izrael později vzal Sichonovi zemi „od Arnon až do Jabok, a až do země synů Ammon“, ale nedotkl se „ani k žádné krajině ležící při potoku Jabok“, která byla amónská; Rúben a Gád dostali zemi až „ku potoku Jabok, kdež jsou hranice synů Ammonitských“. Jiftách odpověděl králi Amónu, že Izrael držel celou amorejskou zemi „od Arnon až k Jaboku“. Gedeon pronásledoval Midjánce proti proudu řeky kolem Sukotu a Penuele."
    - "Dvojitý pahorek Tulul edh-Dhahab ve velkém ohbí řeky se často pokládá za Penuel a Machanajim a Tell Dér Alla poblíž jejího ústí za Sukot, obě ztotožnění jsou však sporná; vykopávky v Dér Alle nalezly svatyni z pozdní doby bronzové a omítkový nápis Bileámův. Dnes Zarká protéká kolem průmyslového města Zarká a pod Džerašem, jehož potok se do ní vlévá; přehrada krále Talála, postavená v 70. letech 20. století, zadržuje její vodu pro farmy Jordánského údolí a řeka pod Ammánem je silně znečištěna."
  sv:
    - "Jabbok är Zarqa, Jordaniens ”blå flod”, den största bifloden till Jordan från öster efter Jarmuk. Den rinner upp nära Amman, ammoniternas forntida Rabba, flyter nordost in mot ökenkanten, svänger sedan nordväst och väst och skär en djup klyfta genom Gileads berg för att nå Jordan nära Adam, dagens Damiya, omkring 40 km norr om Döda havet; den flyter året runt. Floden delade Gilead i en norra och en södra hälft, och dess övre lopp var Ammons gräns."
    - "Vid dess strand sände Jakob, på väg hem från Harran, sina hustrur och barn om natten ”över Jabboks vad” och stannade ensam kvar; ”Då brottades en man med honom, till dess morgonrodnaden gick upp”, som rörde hans höft och gav honom namnet Israel, och Jakob kallade platsen Peniel, ”ty ... jag har sett Gud ansikte mot ansikte”. Israel tog senare av Sichon landet ”från Arnon ända till Jabbok, ända till Ammons barns land”, men rörde inte vid ”landsträckan utefter bäcken Jabbok”, som var ammonitisk; Ruben och Gad fick landet upp till ”bäcken Jabbok, som är Ammons barns gräns”. Jefta svarade Ammons kung att Israel höll hela amoréernas land ”från Arnon ända till Jabbok”. Gideon förföljde midjaniterna upp längs floden förbi Suckot och Penuel."
    - "Tvillingkullarna Tulul edh-Dhahab i flodens stora krök tas ofta för Penuel och Mahanajim, och Tell Deir Alla nära dess mynning för Suckot, fast båda identifieringarna är omstridda; utgrävningarna vid Deir Alla fann en helgedom från senbronsåldern och gipsinskriften om Bileam. I dag rinner Zarqa förbi industristaden Zarqa och under Jerash, vars å förenar sig med den; King Talal-dammen, byggd på 1970-talet, håller dess vatten för jordbruken i Jordandalen, och floden nedanför Amman är illa förorenad."
  nb:
    - "Jabbok er Zarqa, Jordans «blå elv», den største sideelven til Jordan fra øst etter Yarmuk. Den springer ut nær Amman, ammonittenes gamle Rabba, renner nordøst i ørkenkanten, svinger så nordvest og vest og skjærer et dypt juv gjennom åsene i Gilead for å nå Jordan nær Adam, dagens Damiya, omtrent 40 km nord for Dødehavet; den renner hele året. Elven delte Gilead i en nordlig og en sørlig halvdel, og dens øvre løp var Ammons grense."
    - "På dens bredd sendte Jakob, på vei hjem fra Harran, sine hustruer og barn «over Jabboks vadested» om natten og ble alene tilbake; det kom «en mann og kjempet med ham inntil morgenen grydde», som rørte ved hans hofteskål og ga ham navnet Israel, og Jakob kalte stedet Penuel, «jeg har sett Gud åsyn til åsyn». Israel tok senere av Sihon landet «fra Arnon til Jabbok, til Ammons barns land», men rørte ikke «landet langsmed Jabbok-åen» som var ammonittisk; Ruben og Gad fikk landet opp til «Jabbok-åen, Ammons barns grense». Jefta svarte Ammons konge at Israel hadde inntatt hele amorittenes land «like fra Arnon til Jabbok». Gideon jaget midianittene oppover elven forbi Sukkot og Penuel."
    - "Tvillinghaugene Tulul edh-Dhahab i elvens store sving tas ofte for Penuel og Mahanajim, og Tell Deir Alla nær munningen for Sukkot, selv om begge identifikasjonene er omstridt; utgravningene i Deir Alla fant en helligdom fra sen bronsealder og gipsinnskriften om Bileam. I dag renner Zarqa forbi industribyen Zarqa og under Jerash, hvis bekk løper inn i den; King Talal-demningen, bygd på 1970-tallet, holder vannet for gårdene i Jordandalen, og elven nedenfor Amman er sterkt forurenset."
  tl:
    - "Ang Jaboc ay ang Zarqa, ang “bughaw na ilog” ng Jordan, ang pinakamalaking sanga ng Jordan mula sa silangan pagkatapos ng Yarmuk. Bumubukal ito malapit sa Amman, ang sinaunang Rabba ng mga Ammonita, dumadaloy pahilagang-silangan sa gilid ng disyerto, pagkatapos ay lumiliko sa hilagang-kanluran at kanluran at humuhukay ng malalim na bangin sa mga burol ng Gilead hanggang marating ang Jordan malapit sa Adam, ang makabagong Damiya, mga 40 km sa hilaga ng Dagat na Patay; dumadaloy ito sa buong taon. Hinati ng ilog ang Gilead sa hilaga at timog na kalahati, at ang itaas na bahagi nito ang hangganan ng Ammon."
    - "Sa pampang nito, si Jacob, pabalik mula sa Haran, ay kinagabihang isinama ang kaniyang mga asawa at anak at “tumawid sa tawiran ng Jaboc”, at naiwang mag-isa; “nakipagbuno ang isang lalake sa kaniya, hanggang sa magbukang liwayway”, na humipo sa kaniyang hita at nagbigay sa kaniya ng pangalang Israel, at tinawag ni Jacob ang lugar na Peniel, sapagka't “nakita ko ang Dios ng mukhaan”. Kinuha ng Israel kay Sehon ang lupain “mula sa Arnon hanggang Jaboc, hanggang sa mga anak ni Ammon”, ngunit hindi nilapitan ang “buong pangpang ng ilog Jaboc” na Ammonita; tinanggap nina Ruben at Gad ang lupain hanggang sa “ilog Jaboc, na siyang hangganan ng mga anak ni Ammon”. Sinagot ni Jephte ang hari ng Ammon na hawak ng Israel ang buong lupain ng mga Amorrheo “mula sa Arnon hanggang sa Jaboc”. Hinabol ni Gedeon ang mga Midianita sa ilog lampas sa Succoth at Peniel."
    - "Ang kambal na burol ng Tulul edh-Dhahab sa malaking liko ng ilog ay madalas ituring na Peniel at Mahanaim, at ang Tell Deir Alla malapit sa bukana nito na Succoth, bagaman pinagtatalunan ang dalawang pagkakakilanlan; natagpuan ng mga paghuhukay sa Deir Alla ang santuwaryo ng Huling Panahon ng Tanso at ang inskripsiyong plaster ni Balaam. Ang Zarqa ngayon ay dumadaloy sa tabi ng industriyal na lungsod ng Zarqa at sa ibaba ng Jerash, na ang batis ay sumasanib dito; ang Dam ng Haring Talal, itinayo noong dekada 1970, ay nagpapanatili ng tubig nito para sa mga sakahan ng libis ng Jordan, at lubhang marumi ang ilog sa ibaba ng Amman."
  da:
    - "Jabbok er Zarqa, Jordans »blå flod«, den største biflod til Jordan fra øst efter Yarmuk. Den udspringer nær Amman, ammonitternes gamle Rabba, flyder mod nordøst til ørkenens rand, svinger så mod nordvest og vest og skærer en dyb kløft gennem Gileads bjerge for at nå Jordan nær Adam, nutidens Damiya, omkring 40 km nord for Det Døde Hav; den flyder hele året. Floden delte Gilead i en nordlig og en sydlig halvdel, og dens øvre løb var Ammons grænse."
    - "På dens bred sendte Jakob, på hjemvejen fra Karan, sine hustruer og børn om natten »over Vadestedet Jabok« og blev alene; »der brødes en Mand med ham, indtil det dagedes«, som rørte ved hans hofte og gav ham navnet Israel, og Jakob kaldte stedet Penuel: »jeg har set Gud Ansigt til Ansigt«. Israel tog senere fra Sihon landet »fra Arnon indtil Jabok, indtil Ammons Børn«, men rørte ikke »hele den Side ved Bækken Jabok«, der var ammonitisk; Ruben og Gad fik landet op til »Jaboks Bæk, som er Ammons Børns Landemærke«. Jefta svarede Ammons konge, at Israel holdt hele amoritternes land »fra Arnon og indtil Jabok«. Gideon forfulgte midjaniterne op ad floden forbi Sukkot og Penuel."
    - "De tvillingehøje Tulul edh-Dhahab i flodens store bugt tages ofte for Penuel og Mahanajim, og Tell Deir Alla nær dens munding for Sukkot, skønt begge identifikationer er omstridt; udgravninger ved Deir Alla fandt et helligsted fra sen bronzealder og Bileams pudsindskrift. I dag løber Zarqa forbi industribyen Zarqa og under Jerash, hvis å løber ind i den; Kong Talal-dæmningen, bygget i 1970'erne, holder dens vand tilbage til farmene i Jordandalen, og floden under Amman er stærkt forurenet."
  sr:
    - "Јавок је Зарка, „плава река“ Јордана, највећа притока Јордана са истока после Јармука. Извире близу Амана, древне Раве Амонаца, тече североисточно на ивицу пустиње, затим скреће северозападно и западно и пробија дубоку клисуру кроз брда Галада да стигне до Јордана код Адама, данашње Дамије, око 40 км северно од Мртвог мора; тече током целе године. Река је делила Галад на северну и јужну половину, а њен горњи ток био је граница Амона."
    - "На његовој обали Јаков је, враћајући се из Харана, ноћу превео своје жене и децу преко брода Јавока и остао сам; „тада се један човек рваше с њим до зоре“, који га је дотакао по стегну и дао му име Израиљ, а Јаков је назвао место Фануил, јер, „Бога видех лицем к лицу“. Израиљ је касније узео од Сиона земљу „од Арона па до Јавока, до синова Амонових“, али није дирао ниједан крај „на потоку Јавоку“ који је био амонски; Рувим и Гад добили су земљу „до потока Јавока, где је међа синова Амонових“. Јефтај је одговорио цару Амона да Израиљ држи сву аморејску земљу „од Ариона до Јавока“. Гедеон је гонио Мадијанце уз реку поред Сокота и Фануила."
    - "Двоструке хумке Тулул ед-Дахаб у великом завоју реке често се узимају за Фануил и Маханајим, а Тел Деир Ала близу ушћа за Сокот, мада су оба поистовећења спорна; ископавања у Деир Али нашла су светилиште касног бронзаног доба и малтерисани натпис Валама. Данас Зарка тече поред индустријског града Зарке и испод Џераша, чији се поток у њу улива; брана краља Талала, изграђена седамдесетих година 20. века, држи њену воду за фарме долине Јордана, а река испод Амана је јако загађена."
  hu:
    - "A Jabbók a Zarqa, Jordánia „kék folyója”, a Jordán legnagyobb keleti mellékfolyója a Jarmuk után. Ammán, az ammoniták ókori Rabbája közelében ered, északkeletre folyik a sivatag széléig, majd északnyugatra, majd nyugatra fordul, és mély szurdokot vág Gileád dombjain át, hogy Ádám, a mai Damija közelében érje el a Jordánt, a Holt-tengertől mintegy 40 km-re északra; egész évben folyik. A folyó Gileádot északi és déli felére osztotta, felső szakasza pedig Ammon határa volt."
    - "Partján Jákób, Háránból hazatérve, éjjel feleségeit és gyermekeit vette, és „általméne a Jabbók révén”, majd egyedül maradt; „tusakodik vala ő vele egy férfiú, egész a hajnal feljöveteléig”, aki megérintette a csípőjét, és Izráel nevet adta neki, Jákób pedig a helyet Peniélnek nevezte, „mert látám az Istent színről színre”. Izráel később elvette Szihontól a földet „Arnontól Jabbókig, az Ammon fiaiig”, de nem közeledett „a Jabbók patak egész oldalához”, amely ammoni volt; Rúben és Gád megkapta az országot „a Jabbók patakáig, a mely az Ammon fiainak határa”. Jefte azt felelte Ammon királyának, hogy Izráel birtokolta az emóreusok egész földjét „az Arnontól fogva Jabbókig”. Gedeon a midiániakat a folyó mentén üldözte Szukkót és Penuél mellett."
    - "A folyó nagy kanyarulatában lévő Tulúl edh-Dhahab ikerhalmait gyakran Penuélnek és Mahanajimnak tartják, a torkolat közelében lévő Tell Dejr Allát pedig Szukkótnak, bár mindkét azonosítás vitatott; a Dejr Allában végzett ásatások késő bronzkori szentélyt és a Bálám vakolatfeliratát találták. Ma a Zarqa Zarqa ipari városa mellett folyik, és Dzserás alatt, amelynek patakja beléje torkollik; az 1970-es években épült Király Talal-gát a Jordán-völgy gazdaságai számára tartja a vizét, és az Ammán alatti folyó erősen szennyezett."
  fi:
    - "Jabbok on Zarqa, Jordanian ”sininen joki”, Jordanin suurin itäinen sivujoki Jarmukin jälkeen. Se saa alkunsa Ammanin, ammonilaisten muinaisen Rabban, läheltä, virtaa koilliseen aavikon reunalle, kääntyy sitten luoteeseen ja länteen ja uurtaa syvän rotkon Gileadin kukkuloiden halki päästäkseen Jordaniin Adamin, nykyisen Damiyan, lähellä noin 40 km Kuolleestamerestä pohjoiseen; se virtaa ympäri vuoden. Joki jakoi Gileadin pohjois- ja eteläpuoliskoon, ja sen yläjuoksu oli Ammonin raja."
    - "Sen rannalla Jaakob, palatessaan Harranista, lähetti vaimonsa ja lapsensa yöllä ”kahlauspaikasta Jabbokin yli” ja jäi yksin; ”painiskeli hänen kanssaan muuan mies päivän koittoon saakka”, ja tämä kosketti hänen lonkkaansa ja antoi hänelle nimen Israel, ja Jaakob antoi paikan nimeksi Penuel, ”sillä minä olen nähnyt Jumalan kasvoista kasvoihin”. Israel valloitti myöhemmin Sihonilta maan ”Arnonista Jabbokiin, aina ammonilaisten maahan asti”, mutta ei koskenut ammonilaisten ”mihinkään, mikä on Jabbok-joen varrella”; ruubenilaiset ja gaadilaiset saivat maan ”Jabbok-jokeen saakka, joka on ammonilaisten rajana”. Jefta vastasi Ammonin kuninkaalle, että Israel hallitsi koko amorilaisten maata ”Arnonista Jabbokiin”. Gideon ajoi midianilaisia takaa jokea pitkin Sukkotin ja Penuelin ohi."
    - "Tulul edh-Dhahabin kaksoiskummut joen suuressa mutkassa pidetään usein Penuelina ja Mahanaimina ja Tell Deir Alla sen suun lähellä Sukkotina, vaikka kumpikin tunnistus on kiistanalainen; Deir Allan kaivaukset löysivät myöhäispronssikauden pyhäkön ja Bileamin rappauskirjoituksen. Nykyään Zarqa virtaa Zarqan teollisuuskaupungin ohi ja Jerashin alapuolella, jonka puro yhtyy siihen; 1970-luvulla rakennettu Kuningas Talalin pato pidättää sen veden Jordanin laakson tiloille, ja joki Ammanin alapuolella on pahasti saastunut."
  vi:
    - "Gia-bốc là sông Zarqa, “sông Xanh” của Jordan, phụ lưu lớn nhất của sông Giô-đanh từ phía đông sau Yarmuk. Sông bắt nguồn gần Amman, Ráp-ba cổ của người Am-môn, chảy về đông bắc đến rìa sa mạc, rồi quay tây bắc và tây và cắt một hẻm núi sâu qua các đồi Ga-la-át để đến sông Giô-đanh gần A-đam, nay là Damiya, cách Biển Chết khoảng 40 km về phía bắc; sông chảy quanh năm. Sông chia Ga-la-át thành nửa bắc và nửa nam, và đoạn thượng nguồn là biên giới của Am-môn."
    - "Trên bờ sông, Gia-cốp, từ Cha-ran trở về, ban đêm đưa vợ con “đi qua rạch Gia-bốc” và ở lại một mình; “có một người vật lộn với mình đến rạng đông”, người ấy đánh vào hông ông và đặt cho ông tên Y-sơ-ra-ên, và Gia-cốp đặt tên chỗ đó là Phê-ni-ên, vì “Tôi đã thấy Đức Chúa Trời đối mặt cùng tôi”. Y-sơ-ra-ên về sau chiếm từ Si-hôn xứ “từ Ạt-nôn đến Gia-bốc, đến dân Am-môn”, nhưng không đụng đến xứ của người Am-môn “ở dọc khắp mé khe Gia-bốc”; Ru-bên và Gát nhận xứ đến “khe Gia-bốt, là giới hạn của con cháu Am-môn”. Giép-thê đáp vua Am-môn rằng Y-sơ-ra-ên giữ cả xứ A-mô-rít “từ Ạt-nôn cho đến Gia-bốc”. Ghê-đê-ôn đuổi người Ma-đi-an dọc sông qua Su-cốt và Phê-nu-ên."
    - "Hai gò đôi Tulul edh-Dhahab ở khúc quanh lớn của sông thường được coi là Phê-nu-ên và Ma-ha-na-im, và Tell Deir Alla gần cửa sông là Su-cốt, dù cả hai đồng nhất đều còn tranh cãi; các cuộc khai quật ở Deir Alla tìm thấy một đền thờ thời Đồ Đồng Muộn và văn bia trát vữa của Ba-la-am. Ngày nay sông Zarqa chảy qua thành phố công nghiệp Zarqa và bên dưới Jerash, nơi dòng suối của nó nhập vào; đập King Talal, xây thập niên 1970, giữ nước cho các nông trại của thung lũng Giô-đanh, và con sông bên dưới Amman bị ô nhiễm nặng."
  ro:
    - "Iabocul este Zarqa, „râul albastru” al Iordaniei, cel mai mare afluent al Iordanului dinspre est după Yarmuk. Izvorăște lângă Amman, vechea Raba a amoniților, curge spre nord-est la marginea deșertului, apoi cotește spre nord-vest și vest și taie un defileu adânc prin dealurile Galaadului ca să ajungă la Iordan lângă Adam, Damiya de azi, la circa 40 km spre nord de Marea Moartă; curge tot anul. Râul împărțea Galaadul într-o jumătate de nord și una de sud, iar cursul lui superior era frontiera Amonului."
    - "Pe malul lui, Iacov, întorcându-se din Haran, și-a trimis noaptea soțiile și copiii peste vad („a trecut vadul lui Iavoh”) și a rămas singur; „s’a luptat un om cu el până dimineața”, care i-a atins coapsa și i-a dat numele Israel, iar Iacov a numit locul Peniel, „că am văzut pre Dumnezeu față către față”. Israel a luat mai târziu de la Sihon țara „dela Arnon până la Iavoc, până la feciorii lui Amman”, dar nu s-a atins de „toate cele din valea lui Iavoc”, care erau amonite; Ruben și Gad au primit ținutul „și până la Iavoc, rîul este hotarul fiilor lui Aman”. Ieftae i-a răspuns regelui Amonului că Israel stăpânea tot ținutul amorit de la Arnon până la Iaboc. Ghedeon i-a urmărit pe madianiți în susul râului, pe lângă Sucot și Penuel."
    - "Movilele gemene Tulul edh-Dhahab, din marea cotitură a râului, sunt adesea luate drept Penuel și Mahanaim, iar Tell Deir Alla, lângă gura lui, drept Sucot, deși ambele identificări sunt disputate; săpăturile de la Deir Alla au găsit un sanctuar din Bronzul Târziu și inscripția pe tencuială a lui Balaam. Astăzi Zarqa trece pe lângă orașul industrial Zarqa și pe sub Jerash, al cărui pârâu se varsă în el; Barajul Regele Talal, construit în anii 1970, îi reține apa pentru fermele din valea Iordanului, iar râul de sub Amman este grav poluat."
  bg:
    - "Явок е Зарка, „синята река“ на Йордания, най-големият източен приток на Йордан след Ярмук. Той извира близо до Аман, древната Рава на амонците, тече на североизток към края на пустинята, после завива на северозапад и запад и прорязва дълбока клисура през хълмовете на Галаад, за да стигне до Йордан близо до Адам, днешна Дамия, на около 40 км северно от Мъртво море; тече през цялата година. Реката делеше Галаад на северна и южна половина, а горното ѝ течение беше границата на Амон."
    - "На брега ѝ Яков, връщайки се от Харан, преведе през нощта жените и децата си през „брода на Явок“ и остана сам; „бореше се с него един человек до зазоряване“, който се допря до бедрото му и му даде името Израил, а Яков нарече мястото Пенуил, „защото видях Бога лице с лице“. По-късно Израил отне от Сихон земята „от Арнон до Явок, до Амоновите синове“, но не докосна „местата при потока Явок“, които бяха амонски; Рувим и Гад получиха земята до „потока Явок, предела на Амоновите синове“. Йефтай отговори на амонския цар, че Израил държи цялата аморейска земя „от Арнон до Явок“. Гедеон преследва мадиамците нагоре по реката покрай Сокхот и Пенуил."
    - "Двойните могили Тулул ед-Дахаб в големия завой на реката често се смятат за Пенуил и Маханаим, а Тел Дейр Ала близо до устието ѝ — за Сокхот, макар и двете отъждествявания да са спорни; разкопките в Дейр Ала откриха светилище от късната бронзова епоха и надписа на Валаам върху мазилка. Днес Зарка тече покрай индустриалния град Зарка и под Джераш, чийто поток се влива в нея; язовирът „Крал Талал“, построен през 1970-те години, задържа водата ѝ за стопанствата в Йорданската долина, а реката под Аман е силно замърсена."
