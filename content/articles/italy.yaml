body:
  en:
    - "Italy in the New Testament is the Roman heartland, the peninsula from the Alps to the straits of Messina, which by the first century AD was one land of Roman citizens with Rome at its head. Augustus divided it into eleven regions; its ports were Puteoli on the bay of Naples, where the grain fleets of Egypt put in, and Ostia at the Tiber's mouth, and from the bay the roads joined the Appian Way to the capital. Jews had lived in Rome since the second century BC, and by the time of Augustus their community there numbered in the thousands."
    - "Italy enters Acts through people who came from it. At Corinth Paul “found a certain Jew named Aquila, born in Pontus, lately come from Italy, with his wife Priscilla”, because Claudius had commanded all Jews to depart from Rome. Suetonius confirms that Claudius expelled the Jews of Rome, who in his words kept rioting at the instigation of one Chrestus; Orosius dates the edict to AD 49, though the date is debated. Cornelius at Caesarea was a centurion “of the band called the Italian band”, a cohort of Roman citizens from Italy of the kind inscriptions attest in Syria."
    - "Then “when it was determined that we should sail into Italy”, Paul was handed to the centurion Julius, who at Myra “found a ship of Alexandria sailing into Italy”; after the shipwreck on Malta they landed at Puteoli, found brethren there, and so went toward Rome. The letter to the Hebrews ends with “They of Italy salute you”, which tells where the writer or his readers were, though not which."
    - "Roman Italy is today the Italian Republic; Puteoli is Pozzuoli, where the quays of Paul's day lie under the harbour, and the Appian Way can still be walked outside Rome."
  ru:
    - "Италия в Новом Завете — сердце римского мира, полуостров от Альп до Мессинского пролива, который к I веку н. э. был единой землёй римских граждан с Римом во главе. Август разделил её на одиннадцать областей; её гаванями были Путеол в Неаполитанском заливе, куда приходили хлебные флоты Египта, и Остия в устье Тибра, а от залива дороги выводили на Аппиеву дорогу к столице. Иудеи жили в Риме со II века до н. э., и ко времени Августа их община насчитывала тысячи."
    - "В Деяния Италия входит через людей, пришедших оттуда. В Коринфе Павел нашёл «некоторого Иудея, именем Акилу, родом Понтянина, недавно пришедшего из Италии, и Прискиллу, жену его», потому что Клавдий повелел всем Иудеям удалиться из Рима. Светоний подтверждает, что Клавдий изгнал из Рима иудеев, которые, по его словам, постоянно волновались, подстрекаемые неким Хрестом; Орозий относит указ к 49 году н. э., хотя дата оспаривается. Корнилий в Кесарии был «сотник из полка, называемого Италийским» — когорты римских граждан из Италии, какие надписи засвидетельствовали в Сирии."
    - "Затем настал день, о котором Лука говорит: «Когда решено было плыть нам в Италию, то отдали Павла и некоторых других узников сотнику Августова полка, именем Юлию»; в Мирах тот «нашел Александрийский корабль, плывущий в Италию»; после кораблекрушения у Мелита они высадились в Путеоле, нашли там братьев и так пошли в Рим. Послание к Евреям кончается словами «Приветствуют вас Италийские», что говорит, где находился писавший или его читатели, но не говорит, кто именно."
    - "Римская Италия сегодня — Итальянская Республика; Путеол — это Поццуоли, где причалы времён Павла лежат под гаванью, а по Аппиевой дороге под Римом по-прежнему можно пройти."
  uk:
    - "Італія в Новому Заповіті — римське осереддя, півострів від Альп до Мессінської протоки, що до I ст. н. е. був єдиним краєм римських громадян з Римом на чолі. Август поділив її на одинадцять областей; її портами були Путеоли на Неаполітанській затоці, куди заходили хлібні флоти Єгипту, і Остія в гирлі Тибру, а від затоки дороги з’єднувалися з Аппієвою дорогою до столиці. Юдеї жили в Римі від II ст. до н. е., і за Августа їхня громада там налічувала тисячі."
    - "Італія входить у Діяння через людей, які прийшли звідти. У Коринті Павло «знайшовши одного Жидовина, на ймя Авкилу, родом Понтянина, тільки що прибувшого з Італиї, і Прискилу, жінку його», бо Клавдій повелів усім юдеям вийти з Рима. Светоній підтверджує, що Клавдій вигнав юдеїв Рима, які, за його словами, раз у раз бунтували за підбурюванням якогось Хреста; Орозій датує едикт 49 роком н. е., хоча дата оспорюється. Корнилій у Кесарії був сотником «з роти, званої Італийською», когорти римських громадян з Італії, яку засвідчують написи в Сирії."
    - "Далі, «Як же присуджено, щоб плисти нам в Італию», Павла передали сотникові Юлію, і в Мирах Лікійських «знайшовши сотник корабель Александрийський, що плив в Італию»; після корабельної аварії на Мальті вони висадилися в Путеолах, знайшли там братів і так пішли до Рима. Послання до євреїв закінчується словами «Витають вас ті, що з Італиї», що вказує, де були автор або його читачі, хоча не вказує, які саме."
    - "Римська Італія нині — Італійська Республіка; Путеоли — це Поццуолі, де причали часів Павла лежать під гаванню, а Аппієвою дорогою ще можна пройти за межами Рима."
  es:
    - "Italia en el Nuevo Testamento es el corazón romano, la península desde los Alpes hasta el estrecho de Mesina, que en el siglo I d. C. era una sola tierra de ciudadanos romanos con Roma a la cabeza. Augusto la dividió en once regiones; sus puertos eran Puteoli, en la bahía de Nápoles, donde arribaban las flotas de grano de Egipto, y Ostia, en la desembocadura del Tíber, y desde la bahía los caminos enlazaban con la vía Apia hacia la capital. Los judíos vivían en Roma desde el siglo II a. C., y en tiempos de Augusto su comunidad allí contaba por millares."
    - "Italia entra en Hechos por medio de gente que venía de ella. En Corinto, Pablo halló «á un Judío llamado Aquila, natural del Ponto, que hacía poco que había venido de Italia, y á Priscila su mujer», porque Claudio había mandado que todos los judíos saliesen de Roma. Suetonio confirma que Claudio expulsó a los judíos de Roma, que, según sus palabras, provocaban continuos disturbios por instigación de un tal Cresto; Orosio fecha el edicto en el 49 d. C., aunque la fecha se discute. Cornelio, en Cesarea, era un centurión «de la compañía que se llamaba la Italiana», una cohorte de ciudadanos romanos de Italia del tipo que atestiguan inscripciones en Siria."
    - "Luego, «como fué determinado que habíamos de navegar para Italia», Pablo fue entregado al centurión Julio, quien, ya en Mira, encontró «una nave Alejandrina que navegaba á Italia» y los embarcó; tras el naufragio en Malta desembarcaron en Puteoli, hallaron allí hermanos y así fueron hacia Roma. La carta a los Hebreos termina con «Los de Italia os saludan», lo que indica dónde estaban el autor o sus lectores, aunque no cuáles."
    - "La Italia romana es hoy la República Italiana; Puteoli es Pozzuoli, donde los muelles de la época de Pablo yacen bajo el puerto, y la vía Apia aún puede recorrerse a pie fuera de Roma."
  pt:
    - "A Itália no Novo Testamento é o coração romano, a península dos Alpes ao estreito de Messina, que no século I d.C. era uma só terra de cidadãos romanos com Roma à frente. Augusto a dividiu em onze regiões; seus portos eram Putéoli, na baía de Nápoles, onde aportavam as frotas de grãos do Egito, e Óstia, na foz do Tibre, e da baía as estradas se juntavam à Via Ápia rumo à capital. Judeus viviam em Roma desde o século II a.C., e no tempo de Augusto sua comunidade ali contava milhares."
    - "A Itália entra em Atos por pessoas que vieram dela. Em Corinto, Paulo “encontrou um certo judeu chamado Áquila, natural do Ponto, que havia chegado recentemente da Itália com sua esposa Priscila”, porque Cláudio ordenara que todos os judeus partissem de Roma. Suetônio confirma que Cláudio expulsou os judeus de Roma, que, em suas palavras, não cessavam de tumultuar por instigação de um certo Cresto; Orósio data o edito de 49 d.C., embora a data seja debatida. Cornélio, em Cesareia, era um centurião “do chamado Regimento Italiano”, uma coorte de cidadãos romanos da Itália, como as inscrições atestam na Síria."
    - "Depois, “Quando foi decidido que navegaríamos para a Itália”, Paulo foi entregue ao centurião Júlio, que em Mira “encontrou um navio de Alexandria que navegava para a Itália”; depois do naufrágio em Malta, desembarcaram em Putéoli, acharam ali irmãos e assim seguiram para Roma. A carta aos Hebreus termina com “Os italianos os saúdam”, o que diz onde estavam o autor ou seus leitores, embora não qual dos dois."
    - "A Itália romana é hoje a República Italiana; Putéoli é Pozzuoli, onde os cais dos dias de Paulo jazem sob o porto, e a Via Ápia ainda pode ser percorrida a pé fora de Roma."
  de:
    - "Italien ist im Neuen Testament das römische Kernland, die Halbinsel von den Alpen bis zur Straße von Messina, die im 1. Jahrhundert n. Chr. ein Land römischer Bürger mit Rom an der Spitze war. Augustus teilte es in elf Regionen; seine Häfen waren Puteoli an der Bucht von Neapel, wo die Getreideflotten Ägyptens anlegten, und Ostia an der Tibermündung, und von der Bucht aus führten die Straßen auf die Via Appia in die Hauptstadt. Juden lebten seit dem 2. Jahrhundert v. Chr. in Rom, und zur Zeit des Augustus zählte ihre Gemeinde dort Tausende."
    - "Italien tritt in der Apostelgeschichte durch Menschen ein, die von dort kamen. In Korinth fand Paulus „einen Juden mit Namen Aquila, von Geburt aus Pontus, welcher war neulich aus Italien gekommen samt seinem Weibe Priscilla“, weil Klaudius allen Juden geboten hatte, Rom zu verlassen. Sueton bestätigt, dass Klaudius die Juden Roms auswies, die nach seinen Worten auf Betreiben eines gewissen Chrestus ständig Unruhe stifteten; Orosius datiert das Edikt auf 49 n. Chr., doch die Datierung ist umstritten. Kornelius in Caesarea war ein Hauptmann „von der Schar, die da heißt die italische“, einer Kohorte römischer Bürger aus Italien, wie Inschriften sie in Syrien bezeugen."
    - "Dann, „da es aber beschlossen war, daß wir nach Italien schiffen sollten“, wurde Paulus dem Hauptmann Julius übergeben, der in Myra „ein Schiff von Alexandrien“ fand, „das schiffte nach Italien“; nach dem Schiffbruch auf Malta landeten sie in Puteoli, fanden dort Brüder und zogen so nach Rom. Der Hebräerbrief endet mit „Es grüßen euch die Brüder aus Italien“, was verrät, wo der Verfasser oder seine Leser waren, wenn auch nicht, welches von beidem."
    - "Das römische Italien ist heute die Italienische Republik; Puteoli ist Pozzuoli, wo die Kais von Paulus' Zeit unter dem Hafen liegen, und die Via Appia kann man außerhalb Roms noch begehen."
  fr:
    - "L’Italie du Nouveau Testament est le cœur romain, la péninsule des Alpes au détroit de Messine, qui était au Ier siècle apr. J.-C. un seul pays de citoyens romains avec Rome à sa tête. Auguste la divisa en onze régions ; ses ports étaient Pouzzoles, sur la baie de Naples, où abordaient les flottes de blé d’Égypte, et Ostie, à l’embouchure du Tibre, et depuis la baie des routes rejoignaient la voie Appienne vers la capitale. Les Juifs vivaient à Rome depuis le IIe siècle av. J.-C., et du temps d’Auguste leur communauté s’y comptait par milliers."
    - "L’Italie entre dans les Actes par des gens qui en venaient. À Corinthe, Paul trouva « un Juif nommé Aquilas, originaire du Pont, récemment arrivé d’Italie avec sa femme Priscille », parce que Claude avait ordonné à tous les Juifs de sortir de Rome. Suétone confirme que Claude expulsa les Juifs de Rome, qui, dit-il, ne cessaient de s’agiter à l’instigation d’un certain Chrestus ; Orose date l’édit de 49 apr. J.-C., mais la date est débattue. Corneille, à Césarée, était un centenier « dans la cohorte dite italienne », cohorte de citoyens romains d’Italie du genre que des inscriptions attestent en Syrie."
    - "Puis, « lorsqu’il fut décidé que nous nous embarquerions pour l’Italie », Paul fut remis au centenier Julius, qui, à Myra, trouva « un navire d’Alexandrie qui allait en Italie » ; après le naufrage à Malte, ils abordèrent à Pouzzoles, y trouvèrent des frères, et allèrent ainsi vers Rome. L’épître aux Hébreux s’achève par « Ceux d’Italie vous saluent », ce qui indique où se trouvaient l’auteur ou ses lecteurs, sans dire lesquels."
    - "L’Italie romaine est aujourd’hui la République italienne ; Pouzzoles est Pozzuoli, où les quais du temps de Paul reposent sous le port, et la voie Appienne peut encore se parcourir à pied hors de Rome."
  pl:
    - "Italia w Nowym Testamencie to rzymskie serce imperium, półwysep od Alp po cieśninę Mesyńską, który w I w. n.e. był jedną ziemią obywateli rzymskich z Rzymem na czele. August podzielił ją na jedenaście regionów; jej portami były Puteoli w zatoce Neapolitańskiej, gdzie zawijały floty zbożowe z Egiptu, i Ostia u ujścia Tybru, a z zatoki drogi łączyły się z Via Appia do stolicy. Żydzi mieszkali w Rzymie od II w. p.n.e., a za Augusta ich wspólnota liczyła tam tysiące."
    - "Italia wchodzi do Dziejów Apostolskich przez ludzi, którzy z niej przybyli. W Koryncie Paweł „znalazłszy niektórego Żyda, imieniem Akwilas, rodem z Pontu, który był świeżo z Włoch przyszedł z Pryscyllą, żoną swą”, ponieważ Klaudiusz nakazał wszystkim Żydom opuścić Rzym. Swetoniusz potwierdza, że Klaudiusz wypędził Żydów z Rzymu, którzy, jak pisze, wciąż wzniecali rozruchy za sprawą niejakiego Chrestusa; Orozjusz datuje edykt na 49 r. n.e., choć data jest sporna. Korneliusz w Cezarei był setnikiem „z roty, którą zwano Włoską”, kohorty obywateli rzymskich z Italii takiego rodzaju, jaki poświadczają napisy w Syrii."
    - "Potem, „gdy skazano, żebyśmy płynęli do Włoch”, Pawła oddano setnikowi Juliuszowi, który w Mirze „znalazłszy okręt Aleksandryjski, który płynął do Włoch”; po rozbiciu na Malcie wylądowali w Puteoli, znaleźli tam braci i tak ruszyli ku Rzymowi. List do Hebrajczyków kończy się słowami: „Pozdrawiają was bracia z Włoch”, co mówi, gdzie był autor lub jego czytelnicy, choć nie który."
    - "Rzymska Italia to dziś Republika Włoska; Puteoli to Pozzuoli, gdzie nabrzeża z czasów Pawła leżą pod portem, a Via Appia nadal można przejść pieszo poza Rzymem."
  it:
    - "L’Italia nel Nuovo Testamento è il cuore romano, la penisola dalle Alpi allo stretto di Messina, che nel I secolo d.C. era un’unica terra di cittadini romani con Roma a capo. Augusto la divise in undici regioni; i suoi porti erano Pozzuoli sul golfo di Napoli, dove approdavano le flotte del grano d’Egitto, e Ostia alla foce del Tevere, e dal golfo le strade si congiungevano alla Via Appia verso la capitale. Gli ebrei vivevano a Roma dal II secolo a.C., e al tempo di Augusto la loro comunità vi contava migliaia di persone."
    - "L’Italia entra negli Atti attraverso persone che ne provenivano. A Corinto Paolo trovò «un certo Giudeo, per nome Aquila, oriundo del Ponto, venuto di recente dall’Italia insieme con Priscilla sua moglie», perché Claudio aveva comandato che tutti i Giudei se ne andassero da Roma. Svetonio conferma che Claudio espulse i Giudei di Roma, che a suo dire tumultuavano continuamente per istigazione di un certo Cresto; Orosio data l’editto al 49 d.C., benché la data sia discussa. Cornelio a Cesarea era un centurione «della coorte detta l’“Italica”», una coorte di cittadini romani provenienti dall’Italia, del tipo attestato dalle iscrizioni in Siria."
    - "Poi, «quando fu determinato che faremmo vela per l’Italia», Paolo fu consegnato al centurione Giulio, che a Mira, «trovata quivi una nave alessandrina che facea vela per l’Italia», li fece montare su quella; dopo il naufragio a Malta sbarcarono a Pozzuoli, vi trovarono dei fratelli e così andarono verso Roma. La Lettera agli Ebrei termina con «Quei d’Italia vi salutano», il che dice dove si trovavano lo scrittore o i suoi lettori, benché non quale luogo."
    - "L’Italia romana è oggi la Repubblica Italiana; Puteoli è Pozzuoli, dove le banchine dei tempi di Paolo giacciono sotto il porto, e la Via Appia si può ancora percorrere fuori Roma."
  nl:
    - "Italië is in het Nieuwe Testament het Romeinse kerngebied, het schiereiland van de Alpen tot de Straat van Messina, dat in de 1e eeuw n.Chr. één land van Romeinse burgers was met Rome aan het hoofd. Augustus verdeelde het in elf regio’s; zijn havens waren Puteoli aan de baai van Napels, waar de graanvloten van Egypte binnenliepen, en Ostia aan de monding van de Tiber, en vanaf de baai sloten de wegen aan op de Via Appia naar de hoofdstad. Joden woonden sinds de 2e eeuw v.Chr. in Rome, en ten tijde van Augustus telde hun gemeenschap daar duizenden."
    - "Italië komt in Handelingen binnen via mensen die ervandaan kwamen. Te Korinthe “vond” Paulus “een zekeren Jood, met name Aquila, van geboorte uit Pontus, die onlangs van Italië gekomen was, en Priscilla, zijn vrouw”, omdat Claudius had bevolen dat alle Joden uit Rome zouden vertrekken. Suetonius bevestigt dat Claudius de Joden van Rome verdreef, die volgens hem steeds oproer maakten op aanstoken van een zekere Chrestus; Orosius dateert het edict in 49 n.Chr., al wordt de datum betwist. Cornelius te Caesarea was een hoofdman over honderd “uit de bende, genaamd de Italiaanse”, een cohort van Romeinse burgers uit Italië zoals opschriften in Syrië bevestigen."
    - "Toen “het besloten was, dat wij naar Italie zouden afvaren”, werd Paulus overgeleverd aan de hoofdman Julius, die te Myra “een schip gevonden hebbende van Alexandrie, dat naar Italie voer”; na de schipbreuk op Malta landden zij te Puteoli, vonden daar broeders en gingen zo naar Rome. De brief aan de Hebreeën eindigt met “U groeten die van Italie zijn”, wat zegt waar de schrijver of zijn lezers waren, maar niet welke."
    - "Het Romeinse Italië is nu de Italiaanse Republiek; Puteoli is Pozzuoli, waar de kaden van Paulus’ tijd onder de haven liggen, en de Via Appia is buiten Rome nog te belopen."
  cs:
    - "Itálie v Novém zákoně je římské jádro, poloostrov od Alp k Messinskému průlivu, který byl v 1. století n. l. jednou zemí římských občanů s Římem v čele. Augustus ji rozdělil na jedenáct oblastí; jejími přístavy byly Puteoli v Neapolském zálivu, kam připlouvaly obilní flotily z Egypta, a Ostia na ústí Tiberu, a od zálivu se cesty napojovaly na Via Appia do hlavního města. Židé žili v Římě od 2. stol. př. n. l. a za Augusta jejich obec tam čítala tisíce."
    - "Itálie vstupuje do Skutků skrze lidi, kteří z ní přišli. V Korintu Pavel „nalezl jednoho Žida, jménem Akvilu, jenž byl rodem z Pontu, kterýž nedávno byl přišel z Vlach, i s Priscillou manželku svou“, protože Klaudius nařídil všem Židům opustit Řím. Suetonius potvrzuje, že Klaudius vyhnal Židy z Říma, kteří podle jeho slov neustále vyvolávali nepokoje z podnětu jakéhosi Chresta; Orosius klade edikt do roku 49 n. l., ačkoli datování je sporné. Kornelius v Cesareji byl setník „z zástupu, kterýž sloul Vlaský“, kohorty římských občanů z Itálie, jaké doložují nápisy v Sýrii."
    - "Potom, „když bylo již usouzeno, abychom my se plavili do Vlach“, byl Pavel svěřen setníku Juliovi, který v Myře „našed … bárku Alexandrinskou, kteráž měla plouti do Vlach“; po ztroskotání na Maltě přistáli v Puteoli, našli tam bratry a šli tak k Římu. List Židům končí slovy „Pozdravují vás bratři z Vlach“, což říká, kde byl pisatel nebo jeho čtenáři, ne však které."
    - "Římská Itálie je dnes Italská republika; Puteoli je Pozzuoli, kde přístavní mola Pavlovy doby leží pod přístavem, a Via Appia je dosud průchozí mimo Řím."
  sv:
    - "Italien i Nya testamentet är det romerska kärnlandet, halvön från Alperna till Messinasundet, som vid första århundradet e.Kr. var ett land av romerska medborgare med Rom i spetsen. Augustus delade det i elva regioner; dess hamnar var Puteoli vid Neapelbukten, där Egyptens sädesflottor lade till, och Ostia vid Tiberns mynning, och från bukten förenade vägarna sig med Via Appia till huvudstaden. Judar hade bott i Rom sedan 100-talet f.Kr., och på Augustus tid räknades deras samfund där i tusental."
    - "Italien kommer in i Apostlagärningarna genom människor som kom därifrån. I Korinth ”träffade” Paulus ”en jude vid namn Akvila, bördig från Pontus, vilken nyligen hade kommit från Italien med sin hustru Priscilla”, eftersom Claudius hade påbjudit att alla judar skulle lämna Rom. Suetonius bekräftar att Claudius fördrev Roms judar, som enligt honom ständigt bråkade på uppvigling av en viss Chrestus; Orosius daterar påbudet till år 49 e.Kr., fast dateringen är omdebatterad. Cornelius i Caesarea var en hövitsman ”vid den så kallade italiska krigsskaran”, en kohort av romerska medborgare från Italien av det slag som inskrifter belägger i Syrien."
    - "Sedan ”det nu var beslutet att vi skulle avsegla till Italien” överlämnades Paulus åt hövitsmannen Julius, som i Myra ”träffade” på ”ett skepp från Alexandria, som skulle segla till Italien”; efter skeppsbrottet på Malta landade de i Puteoli, träffade bröder där och gick så mot Rom. Hebreerbrevet slutar med ”De italiska bröderna hälsa eder”, vilket visar var skribenten eller hans läsare befann sig, om än inte vilket."
    - "Det romerska Italien är i dag Republiken Italien; Puteoli är Pozzuoli, där Pauli tids kajer ligger under hamnen, och Via Appia kan fortfarande vandras utanför Rom."
  nb:
    - "Italia i Det nye testamente er Romas kjerneland, halvøya fra Alpene til Messina-stredet, som på 1. århundre e.Kr. var ett land av romerske borgere med Roma i spissen. Augustus delte det i elleve regioner; havnene var Puteoli ved Napolibukta, der Egypts kornflåter la til, og Ostia ved Tiberens munning, og fra bukta knyttet veier seg til Via Appia og hovedstaden. Jøder hadde bodd i Roma siden 100-tallet f.Kr., og på Augustus' tid telte deres samfunn der tusenvis."
    - "Italia kommer inn i Apostlenes gjerninger gjennom folk som kom derfra. I Korint «fant han en jøde ved navn Akvilas, født i Pontus, som nylig var kommet fra Italia med sin hustru Priskilla», fordi Klaudius hadde påbudt alle jøder å forlate Roma. Suetonius bekrefter at Klaudius utviste jødene i Roma, som, med hans ord, stadig laget uro etter oppfordring fra en Chrestus; Orosius daterer ediktet til 49 e.Kr., selv om dateringen er omdiskutert. Kornelius i Cæsarea var høvedsmann «ved den hærdeling som kaltes den italiske», en kohort av romerske borgere fra Italia av den typen innskrifter bekrefter i Syria."
    - "Så, «Da det nu var avgjort at vi skulde seile avsted til Italia», ble Paulus overgitt til høvedsmannen Julius; i Myra «fant høvedsmannen et skib fra Aleksandria som skulde til Italia»; etter skipbruddet på Malta gikk de i land i Puteoli, fant brødre der, og dro så mot Roma. Hebreerbrevet slutter med «De fra Italia hilser eder», som forteller hvor forfatteren eller hans lesere var, men ikke hvilket sted."
    - "Romas Italia er i dag Den italienske republikk; Puteoli er Pozzuoli, der kaiene fra Paulus' dager ligger under havnen, og Via Appia kan fortsatt gås utenfor Roma."
