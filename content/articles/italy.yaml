# Overview article (ADR 0007). Mainstream facts only; the date of Claudius' edict follows Orosius and is said to be debated; the Italian cohort is reported from the inscriptions.
id: italy
place: a7184a7
title:
  en: "Italy"
  ru: "Италия"
  uk: "Італія"
  es: "Italia"
  pt: "Itália"
  de: "Italien"
  fr: "Italie"
body:
  en:
    - "Italy in the New Testament is the Roman heartland, the peninsula from the Alps to the straits of Messina, which by the first century AD was one land of Roman citizens with Rome at its head. Augustus divided it into eleven regions; its ports of Puteoli on the bay of Naples and Ostia at the Tiber's mouth received the grain fleets of Egypt, and from the bay the roads joined the Appian Way to the capital. Jews had lived in Rome since the second century BC, and by the time of Augustus their community there numbered in the thousands."
    - "Italy enters Acts through people who came from it. At Corinth Paul “found a certain Jew named Aquila, born in Pontus, lately come from Italy, with his wife Priscilla”, because Claudius had commanded all Jews to depart from Rome. Suetonius confirms that Claudius expelled the Jews of Rome, who in his words kept rioting at the instigation of one Chrestus; Orosius dates the edict to AD 49, though the date is debated. Cornelius at Caesarea was a centurion “of the band called the Italian band”, a cohort of Roman citizens from Italy of the kind inscriptions attest in Syria."
    - "Then “when it was determined that we should sail into Italy”, Paul was handed to the centurion Julius, who at Myra “found a ship of Alexandria sailing into Italy”; after the shipwreck on Malta they landed at Puteoli, found brethren there, and so went toward Rome. The letter to the Hebrews ends with “They of Italy salute you”, which tells where the writer or his readers were, though not which."
    - "Roman Italy is today the Italian Republic; Puteoli is Pozzuoli, where the quays of Paul's day lie under the harbour, and the Appian Way can still be walked outside Rome."
  ru:
    - "Италия в Новом Завете — сердце римского мира, полуостров от Альп до Мессинского пролива, который к I веку н. э. был единой землёй римских граждан с Римом во главе. Август разделил её на одиннадцать областей; её гавани — Путеол в Неаполитанском заливе и Остия в устье Тибра — принимали хлебные флоты Египта, а от залива дороги выводили на Аппиеву дорогу к столице. Иудеи жили в Риме со II века до н. э., и ко времени Августа их община насчитывала тысячи."
    - "В Деяния Италия входит через людей, пришедших оттуда. В Коринфе Павел нашёл «некоторого Иудея, именем Акилу, родом Понтянина, недавно пришедшего из Италии, и Прискиллу, жену его», потому что Клавдий повелел всем Иудеям удалиться из Рима. Светоний подтверждает, что Клавдий изгнал из Рима иудеев, которые, по его словам, постоянно волновались, подстрекаемые неким Хрестом; Орозий относит указ к 49 году н. э., хотя дата оспаривается. Корнилий в Кесарии был «сотник из полка, называемого Италийским» — когорты римских граждан из Италии, какие надписи засвидетельствовали в Сирии."
    - "Затем настал день, о котором Лука говорит: «Когда решено было плыть нам в Италию, то отдали Павла и некоторых других узников сотнику Августова полка, именем Юлию»; в Мирах тот «нашел Александрийский корабль, плывущий в Италию»; после кораблекрушения у Мелита они высадились в Путеоле, нашли там братьев и так пошли в Рим. Послание к Евреям кончается словами «Приветствуют вас Италийские», что говорит, где находился писавший или его читатели, но не говорит, кто именно."
    - "Римская Италия сегодня — Итальянская Республика; Путеол — это Поццуоли, где причалы времён Павла лежат под гаванью, а по Аппиевой дороге под Римом по-прежнему можно пройти."
  uk:
    - "Італія в Новому Заповіті — римське осереддя, півострів від Альп до Мессінської протоки, що до I ст. н. е. був єдиним краєм римських громадян з Римом на чолі. Август поділив її на одинадцять областей; її порти Путеоли на Неаполітанській затоці й Остія в гирлі Тибру приймали хлібні флоти Єгипту, а від затоки дороги з’єднувалися з Аппієвою дорогою до столиці. Юдеї жили в Римі від II ст. до н. е., і за Августа їхня громада там налічувала тисячі."
    - "Італія входить у Діяння через людей, які прийшли звідти. У Коринті Павло «знайшовши одного Жидовина, на ймя Авкилу, родом Понтянина, тільки що прибувшого з Італиї, і Прискилу, жінку його», бо Клавдій повелів усім юдеям вийти з Рима. Светоній підтверджує, що Клавдій вигнав юдеїв Рима, які, за його словами, раз у раз бунтували за підбурюванням якогось Хреста; Орозій датує едикт 49 роком н. е., хоча дата оспорюється. Корнилій у Кесарії був сотником «з роти, званої Італийською», когорти римських громадян з Італії, яку засвідчують написи в Сирії."
    - "Далі, «Як же присуджено, щоб плисти нам в Італию», Павла передали сотникові Юлію, і в Мирах Лікійських «знайшовши сотник корабель Александрийський, що плив в Італию»; після корабельної аварії на Мальті вони висадилися в Путеолах, знайшли там братів і так пішли до Рима. Послання до євреїв закінчується словами «Витають вас ті, що з Італиї», що вказує, де були автор або його читачі, хоча не вказує, які саме."
    - "Римська Італія нині — Італійська Республіка; Путеоли — це Поццуолі, де причали часів Павла лежать під гаванню, а Аппієвою дорогою ще можна пройти за межами Рима."
  es:
    - "Italia en el Nuevo Testamento es el corazón romano, la península desde los Alpes hasta el estrecho de Mesina, que en el siglo I d. C. era una sola tierra de ciudadanos romanos con Roma a la cabeza. Augusto la dividió en once regiones; sus puertos de Puteoli, en la bahía de Nápoles, y Ostia, en la desembocadura del Tíber, recibían las flotas de grano de Egipto, y desde la bahía los caminos enlazaban con la vía Apia hacia la capital. Los judíos vivían en Roma desde el siglo II a. C., y en tiempos de Augusto su comunidad allí contaba por millares."
    - "Italia entra en Hechos por medio de gente que venía de ella. En Corinto, Pablo halló «á un Judío llamado Aquila, natural del Ponto, que hacía poco que había venido de Italia, y á Priscila su mujer», porque Claudio había mandado que todos los judíos saliesen de Roma. Suetonio confirma que Claudio expulsó a los judíos de Roma, que, según sus palabras, provocaban continuos disturbios por instigación de un tal Cresto; Orosio fecha el edicto en el 49 d. C., aunque la fecha se discute. Cornelio, en Cesarea, era un centurión «de la compañía que se llamaba la Italiana», una cohorte de ciudadanos romanos de Italia del tipo que atestiguan inscripciones en Siria."
    - "Luego, «como fué determinado que habíamos de navegar para Italia», Pablo fue entregado al centurión Julio, quien, ya en Mira, encontró «una nave Alejandrina que navegaba á Italia» y los embarcó; tras el naufragio en Malta desembarcaron en Puteoli, hallaron allí hermanos y así fueron hacia Roma. La carta a los Hebreos termina con «Los de Italia os saludan», lo que indica dónde estaban el autor o sus lectores, aunque no cuáles."
    - "La Italia romana es hoy la República Italiana; Puteoli es Pozzuoli, donde los muelles de la época de Pablo yacen bajo el puerto, y la vía Apia aún puede recorrerse a pie fuera de Roma."
  pt:
    - "A Itália no Novo Testamento é o coração romano, a península dos Alpes ao estreito de Messina, que no século I d.C. era uma só terra de cidadãos romanos com Roma à frente. Augusto a dividiu em onze regiões; seus portos de Putéoli, na baía de Nápoles, e Óstia, na foz do Tibre, recebiam as frotas de grãos do Egito, e da baía as estradas se juntavam à Via Ápia rumo à capital. Judeus viviam em Roma desde o século II a.C., e no tempo de Augusto sua comunidade ali contava milhares."
    - "A Itália entra em Atos por pessoas que vieram dela. Em Corinto, Paulo “encontrou um certo judeu chamado Áquila, natural do Ponto, que havia chegado recentemente da Itália com sua esposa Priscila”, porque Cláudio ordenara que todos os judeus partissem de Roma. Suetônio confirma que Cláudio expulsou os judeus de Roma, que, em suas palavras, não cessavam de tumultuar por instigação de um certo Cresto; Orósio data o edito de 49 d.C., embora a data seja debatida. Cornélio, em Cesareia, era um centurião “do chamado Regimento Italiano”, uma coorte de cidadãos romanos da Itália, como as inscrições atestam na Síria."
    - "Depois, “Quando foi decidido que navegaríamos para a Itália”, Paulo foi entregue ao centurião Júlio, que em Mira “encontrou um navio de Alexandria que navegava para a Itália”; depois do naufrágio em Malta, desembarcaram em Putéoli, acharam ali irmãos e assim seguiram para Roma. A carta aos Hebreus termina com “Os italianos os saúdam”, o que diz onde estavam o autor ou seus leitores, embora não qual dos dois."
    - "A Itália romana é hoje a República Italiana; Putéoli é Pozzuoli, onde os cais dos dias de Paulo jazem sob o porto, e a Via Ápia ainda pode ser percorrida a pé fora de Roma."
  de:
    - "Italien ist im Neuen Testament das römische Kernland, die Halbinsel von den Alpen bis zur Straße von Messina, die im 1. Jahrhundert n. Chr. ein Land römischer Bürger mit Rom an der Spitze war. Augustus teilte es in elf Regionen; seine Häfen Puteoli an der Bucht von Neapel und Ostia an der Tibermündung nahmen die Getreideflotten Ägyptens auf, und von der Bucht aus führten die Straßen auf die Via Appia in die Hauptstadt. Juden lebten seit dem 2. Jahrhundert v. Chr. in Rom, und zur Zeit des Augustus zählte ihre Gemeinde dort Tausende."
    - "Italien tritt in der Apostelgeschichte durch Menschen ein, die von dort kamen. In Korinth fand Paulus „einen Juden mit Namen Aquila, von Geburt aus Pontus, welcher war neulich aus Italien gekommen samt seinem Weibe Priscilla“, weil Klaudius allen Juden geboten hatte, Rom zu verlassen. Sueton bestätigt, dass Klaudius die Juden Roms auswies, die nach seinen Worten auf Betreiben eines gewissen Chrestus ständig Unruhe stifteten; Orosius datiert das Edikt auf 49 n. Chr., doch die Datierung ist umstritten. Kornelius in Caesarea war ein Hauptmann „von der Schar, die da heißt die italische“, einer Kohorte römischer Bürger aus Italien, wie Inschriften sie in Syrien bezeugen."
    - "Dann, „da es aber beschlossen war, daß wir nach Italien schiffen sollten“, wurde Paulus dem Hauptmann Julius übergeben, der in Myra „ein Schiff von Alexandrien“ fand, „das schiffte nach Italien“; nach dem Schiffbruch auf Malta landeten sie in Puteoli, fanden dort Brüder und zogen so nach Rom. Der Hebräerbrief endet mit „Es grüßen euch die Brüder aus Italien“, was verrät, wo der Verfasser oder seine Leser waren, wenn auch nicht, welches von beidem."
    - "Das römische Italien ist heute die Italienische Republik; Puteoli ist Pozzuoli, wo die Kais von Paulus' Zeit unter dem Hafen liegen, und die Via Appia kann man außerhalb Roms noch begehen."
  fr:
    - "L’Italie du Nouveau Testament est le cœur romain, la péninsule des Alpes au détroit de Messine, qui était au Ier siècle apr. J.-C. un seul pays de citoyens romains avec Rome à sa tête. Auguste la divisa en onze régions ; ses ports de Pouzzoles, sur la baie de Naples, et d’Ostie, à l’embouchure du Tibre, recevaient les flottes de blé d’Égypte, et depuis la baie des routes rejoignaient la voie Appienne vers la capitale. Les Juifs vivaient à Rome depuis le IIe siècle av. J.-C., et du temps d’Auguste leur communauté s’y comptait par milliers."
    - "L’Italie entre dans les Actes par des gens qui en venaient. À Corinthe, Paul trouva « un Juif nommé Aquilas, originaire du Pont, récemment arrivé d’Italie avec sa femme Priscille », parce que Claude avait ordonné à tous les Juifs de sortir de Rome. Suétone confirme que Claude expulsa les Juifs de Rome, qui, dit-il, ne cessaient de s’agiter à l’instigation d’un certain Chrestus ; Orose date l’édit de 49 apr. J.-C., mais la date est débattue. Corneille, à Césarée, était un centenier « dans la cohorte dite italienne », cohorte de citoyens romains d’Italie du genre que des inscriptions attestent en Syrie."
    - "Puis, « lorsqu’il fut décidé que nous nous embarquerions pour l’Italie », Paul fut remis au centenier Julius, qui, à Myra, trouva « un navire d’Alexandrie qui allait en Italie » ; après le naufrage à Malte, ils abordèrent à Pouzzoles, y trouvèrent des frères, et allèrent ainsi vers Rome. L’épître aux Hébreux s’achève par « Ceux d’Italie vous saluent », ce qui indique où se trouvaient l’auteur ou ses lecteurs, sans dire lesquels."
    - "L’Italie romaine est aujourd’hui la République italienne ; Pouzzoles est Pozzuoli, où les quais du temps de Paul reposent sous le port, et la voie Appienne peut encore se parcourir à pied hors de Rome."
