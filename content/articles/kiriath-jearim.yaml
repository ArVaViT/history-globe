# Overview article (ADR 0007). Mainstream facts only; disputed datings and readings are named as such.
id: kiriath-jearim
place: a9bba61
title:
  en: "Kiriath-jearim"
  ru: "Кириаф-Иарим"
  uk: "Кіріят-Єарим"
  es: "Quiriat-jearim"
  pt: "Quiriate-Jearim"
  de: "Kirjat-Jearim"
  fr: "Kirjath-Jearim"
  it: "Kiriat-Iearim"
  pl: "Kiriat-Jearim"
  nl: "Kirjat-Jearim"
  cs: "Kirjat-jearím"
  sv: "Kirjat-Jearim"
body:
  en:
    - 'Kiriath-jearim, "town of forests", is usually identified with Deir el-Azar, a hill above the village of Abu Ghosh about 12 km west of Jerusalem, on the road that goes down from the hills to the coastal plain. Eusebius placed it nine or ten miles from Jerusalem on the road to Diospolis, that is Lydda. Though it is a large mound, it was hardly dug until Israel Finkelstein of Tel Aviv University, Thomas Römer of the Collège de France and Christophe Nicolle of the CNRS excavated it in 2017 and 2019.'
    - 'Kiriath-jearim was one of the four cities of the Gibeonites who made a league with Joshua. It was also called Baalah and Kirjath-baal, and it marked the border between Judah and Benjamin as a city of Judah. The Danites, going north, camped at Kiriath-jearim, and the place behind the town was called Mahaneh-dan. When the men of Beth-shemesh would not keep the ark, the men of Kiriath-jearim brought it into the house of Abinadab on the hill and sanctified Eleazar his son to keep it, and it stayed there twenty years. Then David and all Israel went up to Kiriath-jearim to bring the ark to Jerusalem. Chronicles calls Shobal "the father of Kirjath-jearim".'
    - "In the days of Jehoiakim the prophet Urijah the son of Shemaiah, of Kiriath-jearim, prophesied against Jerusalem as Jeremiah did; he fled to Egypt, but the king had him brought back and slew him with the sword. After the exile the men of Kiriath-jearim, Chephirah and Beeroth who returned numbered seven hundred and forty-three. On the summit the excavators found a large raised platform; they date it to the first half of the eighth century BC and credit it to the kingdom of Israel, a view not all scholars share."
    - "Josephus, retelling the story of the ark, calls Kirjathjearim a city in the neighbourhood of Bethshemesh. In the fourth century Eusebius still knew it as a village and as the home of the prophet Urijah. On the top of the hill stood a Byzantine church, probably of the fifth century, and in 1924 the church of Our Lady of the Ark of the Covenant was built over its remains."
  ru:
    - "Кириаф-Иарим, «город лесов», обычно отождествляют с Дейр-эль-Азаром — холмом над селением Абу-Гош примерно в 12 км к западу от Иерусалима, на дороге, что спускается с гор к приморской равнине. Евсевий помещал его в девяти или десяти милях от Иерусалима по дороге в Диосполь, то есть Лидду. Холм велик, но его почти не копали, пока в 2017 и 2019 гг. здесь не провели раскопки Исраэль Финкельштейн из Тель-Авивского университета, Томас Рёмер из Коллеж де Франс и Кристоф Николь из Национального центра научных исследований Франции."
    - "Кириаф-Иарим был одним из четырёх городов гаваонитян, заключивших союз с Иисусом Навином. Его называли также Ваалом и Кириаф-Ваалом, и он отмечал границу между Иудой и Вениамином как город сынов Иудиных. Сыны Дановы, идя на север, стали станом в Кириаф-Иариме, и место позади города назвали станом Дановым. Когда жители Вефсамиса не захотели оставить у себя ковчег, жители Кириаф-Иарима принесли его в дом Аминадава, на холм, и посвятили Елеазара, сына его, чтобы он хранил ковчег; там он пробыл лет двадцать. Затем Давид и весь Израиль пошли в Кириаф-Иарим, чтобы перенести ковчег в Иерусалим. Паралипоменон называет Шовала отцом Кириаф-Иарима."
    - "Во дни Иоакима пророк Урия, сын Шемаии, из Кириаф-Иарима, пророчествовал против Иерусалима так же, как Иеремия; он бежал в Египет, но царь велел вернуть его и умертвил его мечом. После плена вернувшихся жителей Кириаф-Иарима, Кефиры и Беерофа было семьсот сорок три. На вершине холма раскопщики нашли большую насыпную платформу; они датируют её первой половиной VIII века до н. э. и приписывают Израильскому царству, но не все учёные с этим согласны."
    - "Иосиф Флавий, пересказывая историю ковчега, называет Кириаф-Иарим городом по соседству с Вефсамисом. В IV веке Евсевий ещё знал его как селение и родину пророка Урии. На вершине холма стояла византийская церковь, вероятно V века, и в 1924 г. на её остатках построили церковь Богоматери Ковчега Завета."
  uk:
    - "Кіріят-Єарим, «місто лісів», зазвичай ототожнюють із Дейр-ель-Азаром, пагорбом над селом Абу-Гош приблизно за 12 км на захід від Єрусалима, на дорозі, що спускається від гір до прибережної рівнини. Євсевій розміщував його за дев’ять чи десять миль від Єрусалима при дорозі на Діосполь, тобто Лідду. Хоча це великий пагорб, його майже не копали, аж поки Ізраїль Фінкельштейн з Тель-Авівського університету, Томас Рьомер з Колеж де Франс і Крістоф Ніколь з CNRS не розкопали його у 2017 і 2019 рр."
    - "Кіріят-Єарим був одним із чотирьох міст гаваонців, які уклали союз з Ісусом Навином. Його також звали Ваала і Кіріят-Ваал, і він позначав межу між Юдою та Веніяміном як місто Юди. Данівці, йдучи на північ, отаборилися в Кіріят-Єаримі, і місце за містом назвали Стан Данів. Коли мешканці Бет-Шемеша не схотіли тримати ковчег, мешканці Кіріят-Єарима внесли його до дому Авінадава на узгір’ї й посвятили Елеазара, його сина, щоб він доглядав його, і він пробув там двадцять років. Потім Давид і весь Ізраїль пішли до Кіріят-Єарима, щоб перенести ковчег до Єрусалима. Книга Хронік називає Шовала так: «Шовал, батько (князь) Киріят-Ярима»."
    - "За днів Йоакима пророк Урія, син Шемаїї, з Кіріят-Єарима пророкував проти Єрусалима, як і Єремія; він утік до Єгипту, але цар звелів привести його назад і вбив його мечем. Після полону мешканців Кіріят-Єарима, Кефіри та Беерота, що повернулися, було сімсот сорок три. На вершині розкопувачі знайшли велику піднесену платформу; вони датують її першою половиною VIII ст. до н. е. й приписують Ізраїльському царству, але не всі вчені поділяють цей погляд."
    - "Йосиф Флавій, переказуючи історію ковчега, називає Кіріят-Єарим містом поблизу Бет-Шемеша. У IV ст. Євсевій ще знав його як село і як батьківщину пророка Урії. На вершині пагорба стояла візантійська церква, ймовірно V ст., і 1924 р. над її рештками збудовано церкву Матері Божої Ковчега Завіту."
  es:
    - "Quiriat-jearim, «ciudad de los bosques», se identifica habitualmente con Deir el-Azar, una colina sobre la aldea de Abu Ghosh, a unos 12 km al oeste de Jerusalén, en el camino que baja de las colinas a la llanura costera. Eusebio la situó a nueve o diez millas de Jerusalén, en el camino de Diospolis, es decir, Lida. Aunque es un gran montículo, apenas se excavó hasta que Israel Finkelstein, de la Universidad de Tel Aviv, Thomas Römer, del Collège de France, y Christophe Nicolle, del CNRS, lo excavaron en 2017 y 2019."
    - "Quiriat-jearim era una de las cuatro ciudades de los gabaonitas, que hicieron alianza con Josué. Se llamaba también Baala y Quiriat-baal, y marcaba como ciudad de Judá la frontera entre Judá y Benjamín. Los danitas, que iban hacia el norte, acamparon en Quiriat-jearim, y el lugar detrás de la ciudad se llamó Mahane-dan. Cuando los hombres de Bet-semes no quisieron conservar el arca, los hombres de Quiriat-jearim la llevaron a la casa de Abinadab, en la colina, y santificaron a Eleazar, su hijo, para que la guardara, y allí permaneció veinte años. Después David e Israel entero subieron a Quiriat-jearim para llevar el arca a Jerusalén. Crónicas llama a Sobal «padre de Chîriath-jearim»."
    - "En tiempos de Joacim, el profeta Urías, hijo de Semaías, de Quiriat-jearim, profetizó contra Jerusalén como lo hacía Jeremías; huyó a Egipto, pero el rey lo hizo traer de vuelta y lo mató a espada. Después del destierro, los hombres de Quiriat-jearim, Cafira y Beerot que regresaron sumaban setecientos cuarenta y tres. En la cima los excavadores hallaron una gran plataforma elevada; la fechan en la primera mitad del siglo VIII a. C. y la atribuyen al reino de Israel, opinión que no todos los estudiosos comparten."
    - "Josefo, al volver a contar la historia del arca, llama a Quiriat-jearim una ciudad en la vecindad de Bet-semes. En el siglo IV, Eusebio todavía la conocía como una aldea y como la patria del profeta Urías. En la cima de la colina se alzaba una iglesia bizantina, probablemente del siglo V, y en 1924 se construyó sobre sus restos la iglesia de Nuestra Señora del Arca de la Alianza."
  pt:
    - "Quiriate-Jearim, “cidade dos bosques”, costuma ser identificada com Deir el-Azar, uma colina acima da aldeia de Abu Ghosh, a cerca de 12 km a oeste de Jerusalém, na estrada que desce das colinas para a planície costeira. Eusébio a situou a nove ou dez milhas de Jerusalém, na estrada de Diospólis, isto é, Lida. Embora seja um grande montículo, mal fora escavado até que Israel Finkelstein, da Universidade de Tel Aviv, Thomas Römer, do Collège de France, e Christophe Nicolle, do CNRS, o escavaram em 2017 e 2019."
    - "Quiriate-Jearim era uma das quatro cidades dos gibeonitas que fizeram aliança com Josué. Chamava-se também Baalá e Quiriate-Baal, e marcava a fronteira entre Judá e Benjamim como cidade de Judá. Os danitas, indo para o norte, acamparam em Quiriate-Jearim, e o lugar atrás da cidade foi chamado Maané-Dã. Quando os homens de Bete-Semes não quiseram guardar a arca, os homens de Quiriate-Jearim a levaram para a casa de Abinadabe, na colina, e consagraram Eleazar, seu filho, para guardá-la, e ela ficou ali vinte anos. Depois Davi e todo o Israel subiram a Quiriate-Jearim para levar a arca a Jerusalém. As Crônicas chamam Sobal de “pai de Quiriate-Jearim”."
    - "Nos dias de Jeoaquim, o profeta Urias, filho de Semaías, de Quiriate-Jearim, profetizou contra Jerusalém como Jeremias; fugiu para o Egito, mas o rei o fez trazer de volta e o matou à espada. Depois do exílio, os homens de Quiriate-Jearim, Quefira e Beerote que voltaram somavam setecentos e quarenta e três. No cume, os escavadores encontraram uma grande plataforma elevada; datam-na da primeira metade do século VIII a.C. e a atribuem ao reino de Israel, opinião que nem todos os estudiosos compartilham."
    - "Josefo, ao recontar a história da arca, chama Quiriate-Jearim de cidade nas vizinhanças de Bete-Semes. No século IV, Eusébio ainda a conhecia como aldeia e como terra do profeta Urias. No alto da colina havia uma igreja bizantina, provavelmente do século V, e em 1924 foi construída sobre seus restos a igreja de Nossa Senhora da Arca da Aliança."
  de:
    - "Kirjat-Jearim, „Stadt der Wälder“, wird meist mit Deir el-Azar gleichgesetzt, einem Hügel oberhalb des Dorfes Abu Ghosh, etwa 12 km westlich von Jerusalem, an der Straße, die aus den Bergen in die Küstenebene hinabführt. Eusebius setzte es neun oder zehn Meilen von Jerusalem an der Straße nach Diospolis an, das ist Lydda. Obwohl es ein großer Hügel ist, wurde er kaum untersucht, bis Israel Finkelstein von der Universität Tel Aviv, Thomas Römer vom Collège de France und Christophe Nicolle vom CNRS ihn 2017 und 2019 ausgruben."
    - "Kirjat-Jearim war eine der vier Städte der Gibeoniter, die mit Josua ein Bündnis schlossen. Es hieß auch Baala und Kirjat-Baal und bezeichnete als Stadt Judas die Grenze zwischen Juda und Benjamin. Die Daniter, die nach Norden zogen, lagerten bei Kirjat-Jearim, und der Ort hinter der Stadt hieß Mahane-Dan. Als die Männer von Bet-Schemesch die Lade nicht behalten wollten, brachten die Männer von Kirjat-Jearim sie ins Haus Abinadabs auf dem Hügel und heiligten seinen Sohn Eleasar, sie zu hüten, und sie blieb dort zwanzig Jahre. Dann zogen David und ganz Israel hinauf nach Kirjat-Jearim, um die Lade nach Jerusalem zu bringen. In der Chronik steht „Sobal, der Vater Kirjath-Jearims“."
    - "In den Tagen Jojakims weissagte der Prophet Uria, der Sohn Schemajas, aus Kirjat-Jearim, wie Jeremia gegen Jerusalem; er floh nach Ägypten, doch der König ließ ihn zurückholen und mit dem Schwert töten. Nach dem Exil waren es siebenhundertdreiundvierzig Männer aus Kirjat-Jearim, Kefira und Beerot, die zurückkehrten. Auf dem Gipfel fanden die Ausgräber eine große erhöhte Plattform; sie datieren sie in die erste Hälfte des 8. Jahrhunderts v. Chr. und schreiben sie dem Königreich Israel zu, eine Ansicht, die nicht alle Gelehrten teilen."
    - "Josephus nennt Kirjat-Jearim bei der Erzählung von der Lade eine Stadt in der Nachbarschaft von Bet-Schemesch. Im 4. Jahrhundert kannte Eusebius es noch als Dorf und als Heimat des Propheten Uria. Auf dem Gipfel des Hügels stand eine byzantinische Kirche, wohl des 5. Jahrhunderts, und 1924 wurde über ihren Resten die Kirche Unserer Lieben Frau von der Bundeslade erbaut."
  fr:
    - "Kirjath-Jearim, « ville des forêts », est d’ordinaire identifiée à Deir el-Azar, colline au-dessus du village d’Abou Gosh, à environ 12 km à l’ouest de Jérusalem, sur la route qui descend des collines vers la plaine côtière. Eusèbe la plaçait à neuf ou dix milles de Jérusalem, sur la route de Diospolis, c’est-à-dire Lydda. Bien qu’elle forme un grand tertre, elle ne fut guère fouillée avant que Israel Finkelstein, de l’Université de Tel-Aviv, Thomas Römer, du Collège de France, et Christophe Nicolle, du CNRS, n’y travaillent en 2017 et 2019."
    - "Kirjath-Jearim était l’une des quatre villes des Gabaonites, qui firent alliance avec Josué. Elle s’appelait aussi Baala et Kirjath-Baal, et, comme ville de Juda, elle marquait la limite entre Juda et Benjamin. Les Danites, montant vers le nord, campèrent à Kirjath-Jearim, et le lieu derrière la ville fut appelé Machané-Dan. Lorsque les gens de Beth-Schémesch ne voulurent pas garder l’arche, les gens de Kirjath-Jearim la conduisirent dans la maison d’Abinadab, sur la colline, et consacrèrent son fils Éléazar pour la garder, et elle y resta vingt ans. Puis David et tout Israël montèrent à Kirjath-Jearim pour amener l’arche à Jérusalem. Les Chroniques appellent Schobal « père de Kirjath-Jearim »."
    - "Du temps de Jojakim, le prophète Urie, fils de Schemaeja, de Kirjath-Jearim, prophétisa contre Jérusalem comme le faisait Jérémie ; il s’enfuit en Égypte, mais le roi le fit ramener et le fit mourir par l’épée. Après l’exil, les gens de Kirjath-Jearim, de Képhira et de Beéroth qui revinrent étaient au nombre de sept cent quarante-trois. Au sommet, les fouilleurs ont trouvé une grande plate-forme surélevée ; ils la datent de la première moitié du VIIIe siècle av. J.-C. et l’attribuent au royaume d’Israël, opinion que tous les savants ne partagent pas."
    - "Flavius Josèphe, racontant l’histoire de l’arche, appelle Kirjath-Jearim une ville du voisinage de Beth-Schémesch. Au IVe siècle, Eusèbe la connaissait encore comme un village et comme la patrie du prophète Urie. Au sommet de la colline se dressait une église byzantine, probablement du Ve siècle, et en 1924 l’église Notre-Dame de l’Arche d’Alliance fut construite sur ses restes."
  it:
    - "Kiriat-Iearim, «città delle foreste», è di solito identificata con Deir el-Azar, una collina sopra il villaggio di Abu Ghosh, a circa 12 km a ovest di Gerusalemme, sulla strada che scende dalle colline alla pianura costiera. Eusebio la poneva a nove o dieci miglia da Gerusalemme sulla strada per Diospoli, cioè Lidda. Benché sia un grande tell, fu appena scavata fino a quando Israel Finkelstein dell’Università di Tel Aviv, Thomas Römer del Collège de France e Christophe Nicolle del CNRS la scavarono nel 2017 e nel 2019."
    - "Kiriat-Iearim era una delle quattro città dei Gabaoniti che fecero lega con Giosuè. Era chiamata anche Baala e Kiriat-Baal, e segnava il confine tra Giuda e Beniamino come città di Giuda. I Daniti, andando verso nord, si accamparono a Kiriat-Iearim, e il luogo dietro la città fu chiamato Macane-Dan. Quando gli uomini di Bet-Semes non vollero tenere l’arca, gli uomini di Kiriat-Iearim la portarono nella casa di Abinadab sulla collina e consacrarono suo figlio Eleazaro perché la custodisse, e vi restò vent’anni. Poi Davide e tutto Israele salirono a Kiriat-Iearim per portare l’arca a Gerusalemme. Le Cronache chiamano Sobal «padre di Kiriath-Jearim»."
    - "Ai giorni di Ioiakim il profeta Uria, figlio di Semaia, di Kiriat-Iearim, profetizzò contro Gerusalemme come faceva Geremia; fuggì in Egitto, ma il re lo fece riportare indietro e lo uccise con la spada. Dopo l’esilio gli uomini di Kiriat-Iearim, di Chefira e di Beeròt che tornarono furono settecentoquarantatré. Sulla sommità gli scavatori hanno trovato una grande piattaforma sopraelevata; la datano alla prima metà dell’VIII secolo a.C. e l’attribuiscono al regno d’Israele, opinione che non tutti gli studiosi condividono."
    - "Giuseppe Flavio, raccontando di nuovo la storia dell’arca, chiama Kiriat-Iearim una città nei pressi di Bet-Semes. Nel IV secolo Eusebio la conosceva ancora come villaggio e come patria del profeta Uria. In cima alla collina sorgeva una chiesa bizantina, probabilmente del V secolo, e nel 1924 sui suoi resti fu costruita la chiesa di Nostra Signora dell’Arca dell’Alleanza."
  pl:
    - "Kiriat-Jearim, „miasto lasów”, utożsamia się zwykle z Deir el-Azar, wzgórzem nad wsią Abu Ghosh, około 12 km na zachód od Jerozolimy, przy drodze schodzącej ze wzgórz na równinę nadmorską. Euzebiusz umieszczał je dziewięć lub dziesięć mil od Jerozolimy przy drodze do Diospolis, czyli Lod. Choć jest to duży kopiec, prawie go nie badano, aż w 2017 i 2019 r. wykopywali go Israel Finkelstein z Uniwersytetu w Tel Awiwie, Thomas Römer z Collège de France i Christophe Nicolle z CNRS."
    - "Kiriat-Jearim było jednym z czterech miast Gibeonitów, którzy zawarli przymierze z Jozuem. Zwano je także Baala i Kiriat-Baal, a jako miasto Judy wyznaczało granicę między Judą a Beniaminem. Danici, idąc na północ, rozbili obóz w Kiriat-Jearim, a miejsce za miastem nazwano Machane-Dan. Gdy mieszkańcy Bet-Szemesz nie chcieli zatrzymać arki, mieszkańcy Kiriat-Jearim przenieśli ją do domu Abinadaba na wzgórzu i poświęcili Eleazara, jego syna, by jej strzegł, i pozostała tam dwadzieścia lat. Potem Dawid i cały Izrael poszli do Kiriat-Jearim, by przenieść arkę do Jerozolimy. Księga Kronik nazywa Szobala: „ojciec Karyjatyjarymczyków”."
    - "W czasach Jojakima prorok Uriasz, syn Szemajasza, z Kiriat-Jearim, prorokował przeciw Jerozolimie tak jak Jeremiasz; uciekł do Egiptu, ale król kazał go sprowadzić z powrotem i zabił mieczem. Po niewoli mężów Kiriat-Jearim, Kefiry i Beerot, którzy wrócili, było siedmiuset czterdziestu trzech. Na szczycie odkrywcy znaleźli dużą podwyższoną platformę; datują ją na pierwszą połowę VIII w. p.n.e. i przypisują królestwu Izraela, co nie wszyscy uczeni podzielają."
    - "Józef Flawiusz, opowiadając na nowo historię arki, nazywa Kiriat-Jearim miastem w sąsiedztwie Bet-Szemesz. W IV w. Euzebiusz wciąż znał je jako wieś i jako rodzinne miejsce proroka Uriasza. Na szczycie wzgórza stał bizantyjski kościół, prawdopodobnie z V w., a w 1924 r. nad jego pozostałościami zbudowano kościół Matki Bożej Arki Przymierza."
  nl:
    - "Kirjat-Jearim, “stad van de wouden”, wordt gewoonlijk geïdentificeerd met Deir el-Azar, een heuvel boven het dorp Abu Ghosh, ongeveer 12 km ten westen van Jeruzalem, aan de weg die van het bergland naar de kustvlakte afdaalt. Eusebius plaatste het op negen of tien mijl van Jeruzalem aan de weg naar Diospolis, dat is Lydda. Hoewel het een grote heuvel is, werd er nauwelijks gegraven tot Israel Finkelstein van de Universiteit van Tel Aviv, Thomas Römer van het Collège de France en Christophe Nicolle van het CNRS hem in 2017 en 2019 opgroeven."
    - "Kirjat-Jearim was een van de vier steden van de Gibeonieten die een verbond met Jozua sloten. Het heette ook Baäla en Kirjat-Baäl, en als stad van Juda markeerde het de grens tussen Juda en Benjamin. De Danieten, op weg naar het noorden, legerden zich bij Kirjat-Jearim, en de plaats achter de stad werd Machane-Dan genoemd. Toen de mannen van Beth-Semes de ark niet wilden houden, brachten de mannen van Kirjat-Jearim haar naar het huis van Abinadab op de heuvel en wijdden Eleazar, zijn zoon, om haar te bewaren, en ze bleef daar twintig jaar. Daarna trokken David en heel Israël op naar Kirjat-Jearim om de ark naar Jeruzalem te brengen. Kronieken noemt Sobal “de vader van Kirjath-Jearim”."
    - "In de dagen van Jojakim profeteerde de profeet Uria, de zoon van Semaja, uit Kirjat-Jearim, tegen Jeruzalem zoals Jeremia deed; hij vluchtte naar Egypte, maar de koning liet hem terughalen en doodde hem met het zwaard. Na de ballingschap waren de mannen van Kirjat-Jearim, Kefira en Beërot die terugkeerden er zevenhonderddrieënveertig. Op de top vonden de opgravers een groot verhoogd platform; zij dateren het in de eerste helft van de achtste eeuw v.Chr. en schrijven het toe aan het koninkrijk Israël, een opvatting die niet alle geleerden delen."
    - "Josephus noemt Kirjat-Jearim, in zijn navertelling van het verhaal van de ark, een stad in de buurt van Beth-Semes. In de vierde eeuw kende Eusebius het nog als dorp en als woonplaats van de profeet Uria. Op de top van de heuvel stond een Byzantijnse kerk, waarschijnlijk uit de vijfde eeuw, en in 1924 werd boven de resten de kerk van Onze-Lieve-Vrouw van de Ark van het Verbond gebouwd."
  cs:
    - "Kirjat-jearím, „město lesů“, se obvykle ztotožňuje s Deir el-Azar, pahorkem nad vsí Abu Ghosh asi 12 km západně od Jeruzaléma, při cestě, která sestupuje z hor do pobřežní roviny. Eusebius je kladl devět nebo deset mil od Jeruzaléma při cestě do Diospole, tedy Lyddy. Ačkoli jde o velký pahorek, sotva byl kopán, dokud jej v letech 2017 a 2019 nevykopali Israel Finkelstein z Telavivské univerzity, Thomas Römer z Collège de France a Christophe Nicolle z CNRS."
    - "Kirjat-jearím byl jedním ze čtyř měst Gabaonských, kteří uzavřeli smlouvu s Jozuem. Říkalo se mu také Báala a Kirjat-baal a jako město Judy označovalo hranici mezi Judou a Benjamínem. Danité, táhnouce na sever, se utábořili u Kirjat-jearímu a místo za městem se nazývalo Machane-dan. Když muži z Bét-šemeše nechtěli truhlu podržet, přenesli ji muži z Kirjat-jearímu do domu Abinadabova na pahorku a Eleazara, jeho syna, posvětili, aby ji střežil, a zůstala tam dvacet let. Pak David a všechen Izrael vytáhli do Kirjat-jearímu, aby truhlu přenesli do Jeruzaléma. Kroniky nazývají Šobala „otcem Kariatjeharimských“."
    - "Za Jójakima prorokoval prorok Urijáš, syn Šemajášův, z Kirjat-jearímu proti Jeruzalému jako Jeremjáš; uprchl do Egypta, ale král ho dal přivést zpět a zabil ho mečem. Po exilu čítali navrátivší se muži z Kirjat-jearímu, Kefíry a Beerótu sedm set čtyřicet tři. Na vrcholu archeologové nalezli velkou vyvýšenou plošinu; datují ji do první poloviny 8. století př. n. l. a připisují království Izraele, což ne všichni badatelé sdílejí."
    - "Josephus, vyprávěje příběh truhly, nazývá Kirjat-jearím městem poblíž Bét-šemeše. Ve 4. století ho Eusebius dosud znal jako vesnici a jako domov proroka Urijáše. Na vrcholu pahorku stál byzantský kostel, nejspíše z 5. století, a roku 1924 byl nad jeho zbytky postaven kostel Naší Paní Archy úmluvy."
  sv:
    - "Kirjat-Jearim, ”skogarnas stad”, identifieras vanligen med Deir el-Azar, en kulle ovanför byn Abu Ghosh omkring 12 km väster om Jerusalem, vid vägen som går ned från bergen till kustslätten. Eusebios förlade den nio eller tio romerska mil från Jerusalem på vägen till Diospolis, det vill säga Lydda. Fastän det är en stor kulle grävdes den knappt ut förrän Israel Finkelstein vid Tel Avivs universitet, Thomas Römer vid Collège de France och Christophe Nicolle vid CNRS grävde där 2017 och 2019."
    - "Kirjat-Jearim var en av gibeoniternas fyra städer som slöt förbund med Josua. Den kallades också Baala och Kirjat-Baal, och den markerade gränsen mellan Juda och Benjamin som en stad i Juda. Daniterna, på väg norrut, slog läger i Kirjat-Jearim, och platsen bakom staden kallades Mahane-Dan. När männen i Bet-Shemesh inte ville behålla arken förde männen i Kirjat-Jearim den in i Avinadavs hus på kullen och helgade hans son Eleasar att vakta den, och där stod den i tjugo år. Därefter gick David och hela Israel upp till Kirjat-Jearim för att föra arken till Jerusalem. Krönikeböckerna kallar Shoval ”Kirjat-Jearims fader”."
    - "På Jojakims tid profeterade profeten Uria, Shemajas son, från Kirjat-Jearim, mot Jerusalem liksom Jeremia gjorde; han flydde till Egypten, men kungen lät hämta honom tillbaka och dräpte honom med svärd. Efter exilen var de män från Kirjat-Jearim, Kefira och Beerot som vände tillbaka sjuhundrafyrtiotre. På toppen fann utgrävarna en stor upphöjd plattform; de daterar den till första hälften av 700-talet f.Kr. och tillskriver den kungariket Israel, en uppfattning som inte alla forskare delar."
    - "Josefus, som återberättar historien om arken, kallar Kirjat-Jearim en stad i närheten av Bet-Shemesh. På 300-talet kände Eusebios den fortfarande som en by och som profeten Urias hemort. På kullens topp stod en bysantinsk kyrka, sannolikt från 400-talet, och 1924 byggdes kyrkan Vår Fru av Förbundsarken över dess lämningar."
