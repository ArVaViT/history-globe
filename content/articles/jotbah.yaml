body:
  en:
    - "Jotbah was the home town of the mother of Amon, king of Judah: “his mother's name was Meshullemeth, the daughter of Haruz of Jotbah.” It is the only mention of the town. Its place is not certain. Negev and Gibson's Archaeological Encyclopedia of the Holy Land suggests that it may be the Jotapata of Josephus, Tel Yodfat (Khirbet Shifat) in Lower Galilee, north of the Beit Netofa valley, and the map follows this; the International Standard Bible Encyclopedia suggests instead that it may be Jotbathah, a station of the Exodus in the south."
    - "Jotapata is best known for its siege in AD 67. Josephus, then commanding the Jewish forces in Galilee, held the town against Vespasian and three legions; on the forty-seventh day the Romans broke in, helped by a deserter, and Josephus, hiding in a cave, gave himself up. The Mishnah counts “old Yodfat” among the towns walled since the days of Joshua son of Nun. Mordechai Aviam excavated the site in six seasons between 1992 and 2000; a moshav of the same name stands nearby in northern Israel."
  ru:
    - "Ятба — родной город матери иудейского царя Аммона: «имя матери его Мешуллемеф, дочь Харуца, из Ятбы». Это единственное упоминание города. Его место не установлено. «Археологическая энциклопедия Святой Земли» Негева и Гибсона допускает, что это Иотапата Иосифа Флавия — Тель-Йодфат (Хирбет-Шифат) в Нижней Галилее, к северу от долины Бейт-Нетофа, и карта следует этому; Международная стандартная библейская энциклопедия предполагает, что это может быть Иотвафа, стан исхода на юге."
    - "Иотапата известна прежде всего осадой 67 г. н. э. Иосиф Флавий, командовавший тогда иудейскими силами в Галилее, удерживал город против Веспасиана и трёх легионов; на сорок седьмой день римляне ворвались в него с помощью перебежчика, а Иосиф, укрывшийся в пещере, сдался. Мишна относит «старый Йодфат» к городам, обнесённым стенами со времён Иисуса Навина. Мордехай Авиам раскапывал городище шесть сезонов в 1992–2000 гг.; рядом стоит одноимённый мошав на севере Израиля."
  uk:
    - "Йотба була рідним містом матері Амона, царя Юдеї: «Матїр його звалась Мешуллемета Харузівна, з Ятби». Це єдина згадка про місто. Його місце непевне. Archaeological Encyclopedia of the Holy Land Негева й Ґібсона припускає, що це може бути Йотапата Йосифа Флавія, Тель-Йодфат (Хірбет-Шифат) у Нижній Галілеї, на північ від долини Бейт-Нетофа, і мапа йде за цим; International Standard Bible Encyclopedia натомість припускає, що це може бути Йотбата, станція виходу на півдні."
    - "Йотапата найвідоміша облогою 67 р. н. е. Йосиф Флавій, тоді командувач єврейськими силами в Галілеї, тримав місто проти Веспасіана й трьох легіонів; на сорок сьомий день римляни прорвалися, допомагаючи собі перебіжчиком, а Йосиф, що ховався в печері, здався. Мишна зараховує «давній Йодфат» до міст, обгороджених муром від днів Ісуса, сина Навина. Мордехай Авіам розкопував місце впродовж шести сезонів між 1992 і 2000 рр.; поблизу стоїть мошав з тією самою назвою на півночі Ізраїлю."
  es:
    - "Jotba era la ciudad natal de la madre de Amón, rey de Judá: «El nombre de su madre fué Mesalemeth hija de Harus de Jotba». Es la única mención de la ciudad. Su emplazamiento no es seguro. La Archaeological Encyclopedia of the Holy Land de Negev y Gibson sugiere que puede ser la Jotapata de Josefo, Tel Yodfat (Khirbet Shifat), en la Baja Galilea, al norte del valle de Beit Netofa, y el mapa lo sigue; la International Standard Bible Encyclopedia sugiere en cambio que puede ser Jotbata, una estación del Éxodo en el sur."
    - "Jotapata es más conocida por su asedio en 67 d. C. Josefo, entonces al mando de las fuerzas judías en Galilea, defendió la ciudad contra Vespasiano y tres legiones; el día cuarenta y siete los romanos irrumpieron, ayudados por un desertor, y Josefo, escondido en una cueva, se entregó. La Misná cuenta la «antigua Yodfat» entre las ciudades amuralladas desde los días de Josué hijo de Nun. Mordechai Aviam excavó el lugar en seis campañas entre 1992 y 2000; un moshav del mismo nombre se halla cerca, en el norte de Israel."
  de:
    - "Jotba war die Heimatstadt der Mutter Amons, des Königs von Juda: „Seine Mutter hieß Mesullemeth, eine Tochter des Haruz von Jotba.“ Es ist die einzige Erwähnung der Stadt. Ihre Lage ist nicht sicher. Negev und Gibsons Archaeological Encyclopedia of the Holy Land vermutet, es könne das Jotapata des Josephus sein, Tel Jodefat (Chirbet Schifat) in Untergaliläa, nördlich des Bet-Netofa-Tals, und die Karte folgt dem; die International Standard Bible Encyclopedia vermutet stattdessen, es könne Jotbata sein, eine Station des Exodus im Süden."
    - "Jotapata ist vor allem durch seine Belagerung im Jahr 67 n. Chr. bekannt. Josephus, damals Befehlshaber der jüdischen Streitkräfte in Galiläa, hielt die Stadt gegen Vespasian und drei Legionen; am siebenundvierzigsten Tag brachen die Römer mit Hilfe eines Überläufers ein, und Josephus, in einer Höhle versteckt, ergab sich. Die Mischna zählt „das alte Jodefat“ zu den Städten, die seit den Tagen Josuas, des Sohnes Nuns, ummauert sind. Mordechai Aviam grub die Stätte in sechs Kampagnen zwischen 1992 und 2000 aus; in der Nähe liegt ein Moschaw gleichen Namens im Norden Israels."
  fr:
    - "Jotba était la ville natale de la mère d’Amon, roi de Juda : « Sa mère s’appelait Meschullémeth, fille de Haruts, de Jotba. » C’est la seule mention de la ville. Son emplacement n’est pas sûr. L’Archaeological Encyclopedia of the Holy Land de Negev et Gibson suggère qu’il pourrait s’agir du Jotapata de Josèphe, Tel Yodfat (Khirbet Shifat) en Basse Galilée, au nord de la vallée de Beit Netofa, et la carte suit cet avis ; l’International Standard Bible Encyclopedia suggère plutôt Jothbatha, une station de l’Exode dans le sud."
    - "Jotapata est surtout connue pour son siège en 67 apr. J.-C. Josèphe, alors chef des forces juives en Galilée, tint la ville contre Vespasien et trois légions ; le quarante-septième jour, les Romains y pénétrèrent, aidés par un transfuge, et Josèphe, caché dans une grotte, se rendit. La Mishna compte « la vieille Yodfat » parmi les villes murées depuis les jours de Josué, fils de Noun. Mordechai Aviam fouilla le site en six campagnes entre 1992 et 2000 ; un moshav du même nom se trouve à proximité, dans le nord d’Israël."
  pt:
    - "Jotbá era a cidade natal da mãe de Amom, rei de Judá: “O nome de sua mãe era Mesulemete, filha de Haruz, de Jotbá.” É a única menção da cidade. Sua localização não é certa. A Archaeological Encyclopedia of the Holy Land, de Negev e Gibson, sugere que pode ser a Jotapata de Josefo, Tel Yodfat (Khirbet Shifat), na Baixa Galileia, ao norte do vale de Beit Netofa, e o mapa segue isso; a International Standard Bible Encyclopedia sugere, em vez disso, que pode ser Jotbatá, uma estação do Êxodo no sul."
    - "Jotapata é mais conhecida por seu cerco em 67 d.C. Josefo, então comandante das forças judaicas na Galileia, defendeu a cidade contra Vespasiano e três legiões; no quadragésimo sétimo dia os romanos irromperam, ajudados por um desertor, e Josefo, escondido numa caverna, entregou-se. A Mishná conta “a antiga Yodfat” entre as cidades muradas desde os dias de Josué, filho de Num. Mordechai Aviam escavou o sítio em seis temporadas entre 1992 e 2000; um moshav de mesmo nome fica perto, no norte de Israel."
  it:
    - "Iotba era la città natale della madre di Amon, re di Giuda: «Sua madre si chiamava Meshullemeth, figliuola di Haruts di Jotba». È l’unica menzione della città. La sua posizione non è certa. La Archaeological Encyclopedia of the Holy Land di Negev e Gibson suggerisce che possa essere la Iotapata di Giuseppe Flavio, Tel Yodfat (Khirbet Shifat) nella Galilea inferiore, a nord della valle di Bet Netofa, e la carta segue questa ipotesi; la International Standard Bible Encyclopedia suggerisce invece che possa essere Iotbata, una stazione dell’Esodo nel sud."
    - "Iotapata è nota soprattutto per il suo assedio del 67 d.C. Giuseppe Flavio, allora comandante delle forze giudaiche in Galilea, difese la città contro Vespasiano e tre legioni; il quarantasettesimo giorno i Romani irruppero, aiutati da un disertore, e Giuseppe, nascosto in una grotta, si arrese. La Mishnah annovera «Iodfat la vecchia» tra le città cinte di mura fin dai giorni di Giosuè figlio di Nun. Mordechai Aviam scavò il sito in sei campagne tra il 1992 e il 2000; un moshav dallo stesso nome sorge nelle vicinanze, nel nord di Israele."
  nl:
    - "Jotba was de woonplaats van de moeder van Amon, koning van Juda: “de naam zijner moeder was Mesullemet, een dochter van Haruz van Jotba.” Het is de enige vermelding van de stad. De ligging is niet zeker. Negev en Gibsons Archaeological Encyclopedia of the Holy Land suggereert dat het het Jotapata van Josephus kan zijn, Tel Yodfat (Khirbet Shifat) in Neder-Galilea, ten noorden van de vallei van Beit Netofa, en de kaart volgt dit; de International Standard Bible Encyclopedia suggereert in plaats daarvan dat het Jotbata kan zijn, een halte van de uittocht in het zuiden."
    - "Jotapata is vooral bekend om zijn beleg in 67 n.Chr. Josephus, toen bevelhebber van de Joodse strijdkrachten in Galilea, hield de stad tegen Vespasianus en drie legioenen; op de zevenenveertigste dag braken de Romeinen binnen, geholpen door een overloper, en Josephus, die zich in een grot verborg, gaf zich over. De Misjna rekent “oud Jodfat” tot de steden die sinds de dagen van Jozua, de zoon van Nun, ommuurd waren. Mordechai Aviam groef de plaats op in zes seizoenen tussen 1992 en 2000; een moshav met dezelfde naam ligt in de buurt in het noorden van Israël."
  pl:
    - "Jotbata była rodzinnym miastem matki Amona, króla Judy: „A imię matki jego było Masallemet, córka Harusa z Jateby”. Jest to jedyna wzmianka o tym mieście. Jego położenie nie jest pewne. Negev and Gibson's Archaeological Encyclopedia of the Holy Land sugeruje, że może to być Jotapata Józefa Flawiusza, Tel Jodfat (Chirbet Szifat) w Dolnej Galilei, na północ od doliny Bet Netofa, i mapa idzie za tym; International Standard Bible Encyclopedia sugeruje natomiast, że może to być inna Jotbata, stacja wędrówki Izraelitów na południu."
    - "Jotapata jest najlepiej znana z oblężenia w 67 r. n.e. Józef Flawiusz, wówczas dowodzący siłami żydowskimi w Galilei, bronił miasta przed Wespazjanem i trzema legionami; w czterdziestym siódmym dniu Rzymianie wdarli się, przy pomocy zdrajcy, a Józef, ukrywając się w jaskini, poddał się. Miszna zalicza „dawny Jodfat” do miast obwarowanych od czasów Jozuego, syna Nuna. Mordechai Aviam badał stanowisko w sześciu sezonach między 1992 a 2000 rokiem; w pobliżu, w północnym Izraelu, leży moszaw o tej samej nazwie."
  cs:
    - "Jotba bylo rodné město matky Amóna, krále judského: „Jméno matky jeho bylo Mesullemet, dcera Charus z Jateba.“ Je to jediná zmínka o městě. Jeho poloha není jistá. Negev and Gibson's Archaeological Encyclopedia of the Holy Land naznačuje, že může jít o Josephovu Jotapatu, Tel Jodfat (Chirbet Šifat) v Dolní Galileji, severně od údolí Bejt Netofa, a mapa tento názor sleduje; International Standard Bible Encyclopedia naopak navrhuje, že to může být Jotbata, stanice exodu na jihu."
    - "Jotapata je nejznámější svým obléháním roku 67 n. l. Josephus Flavius, tehdy velitel židovských sil v Galileji, držel město proti Vespasianovi a třem legiím; sedmačtyřicátého dne Římané pronikli dovnitř za pomoci přeběhlíka a Josephus, skrytý v jeskyni, se vzdal. Mišna počítá „starý Jodfat“ mezi města obehnaná hradbami od dnů Jozueho syna Núnova. Mordechai Aviam místo zkoumal v šesti sezónách mezi lety 1992 a 2000; poblíž stojí v severním Izraeli mošav téhož jména."
  sv:
    - "Jotva var hemstad för modern till Amon, Judas kung: ”Hans moder hette Mesullemet, Harus' dotter, från Jotba.” Det är den enda omnämningen av staden. Dess läge är osäkert. Negev och Gibsons Archaeological Encyclopedia of the Holy Land föreslår att den kan vara Josefus' Jotapata, Tel Yodfat (Khirbet Shifat) i Nedre Galileen, norr om Beit Netofa-dalen, och kartan följer detta; International Standard Bible Encyclopedia föreslår i stället att det kan vara Jotvata, en station under uttåget i söder."
    - "Jotapata är mest känt för belägringen år 67 e.Kr. Josefus, som då förde befälet över de judiska styrkorna i Galileen, höll staden mot Vespasianus och tre legioner; på den fyrtiosjunde dagen bröt sig romarna in, hjälpta av en överlöpare, och Josefus, som gömde sig i en grotta, överlämnade sig. Mishna räknar ”gamla Yodfat” bland de städer som varit muromgärdade sedan Josuas, Nuns sons, dagar. Mordechai Aviam grävde ut platsen under sex säsonger mellan 1992 och 2000; en moshav med samma namn ligger i närheten i norra Israel."
  nb:
    - "Jotba var hjemstedet til moren til Amon, konge av Juda: «hans mor hette Mesullemet; hun var datter av Harus og var fra Jotba.» Det er den eneste omtalen av byen. Dens beliggenhet er ikke sikker. Negev og Gibsons Archaeological Encyclopedia of the Holy Land antyder at den kan være Josefus' Jotapata, Tel Yodfat (Khirbet Shifat) i Nedre Galilea, nord for Beit Netofa-dalen, og kartet følger dette; International Standard Bible Encyclopedia antyder i stedet at den kan være Jotbata, en stasjon på utvandringen i sør."
    - "Jotapata er best kjent for beleiringen i 67 e.Kr. Josefus, som da hadde kommandoen over de jødiske styrkene i Galilea, holdt byen mot Vespasian og tre legioner; på den førtisjuende dagen brøt romerne seg inn, hjulpet av en overløper, og Josefus, som gjemte seg i en hule, overga seg. Mishnah regner «det gamle Yodfat» blant byene som hadde vært befestet siden Josvas, Nuns sønns, dager. Mordechai Aviam gravde ut stedet i seks sesonger mellom 1992 og 2000; en moshav med samme navn ligger i nærheten i Nord-Israel."
  tl:
    - "Ang Jotba ang bayang sinilangan ng ina ni Amon, hari ng Juda: “ang pangalan ng kaniyang ina ay Mesalemeth na anak ni Harus na taga Jotba.” Ito lamang ang pagbanggit sa bayan. Hindi tiyak ang lugar nito. Iminumungkahi ng Archaeological Encyclopedia of the Holy Land nina Negev at Gibson na maaaring ito ang Jotapata ni Josefo, ang Tel Yodfat (Khirbet Shifat) sa Mababang Galilea, sa hilaga ng libis ng Beit Netofa, at ito ang sinusunod ng mapa; iminumungkahi naman ng International Standard Bible Encyclopedia na maaaring ito ang Jotbatha, isang himpilan ng Exodo sa timog."
    - "Pinakakilala ang Jotapata sa pagkubkob dito noong 67 AD. Si Josefo, na noon ay namumuno sa mga puwersang Judio sa Galilea, ay nagtanggol sa bayan laban kay Vespasiano at sa tatlong legyon; sa ika-47 araw ay nakapasok ang mga Romano sa tulong ng isang tumalikod, at si Josefo, na nagtago sa isang yungib, ay sumuko. Ibinibilang ng Mishnah ang “lumang Yodfat” sa mga bayang may pader mula pa noong mga araw ni Josue na anak ni Nun. Hinukay ni Mordechai Aviam ang pook sa anim na panahon sa pagitan ng 1992 at 2000; may isang moshav na may gayon ding pangalan sa malapit, sa hilagang Israel."
scripture:
  - 2Kgs.21.19
