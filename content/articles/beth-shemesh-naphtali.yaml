# Overview article (ADR 0007). Mainstream facts only; this is the northern Beth-shemesh of Naphtali, distinguished from the famous one in Judah and from Issachar's; Tel Rosh is Aharoni's proposal, unexcavated.
id: beth-shemesh-naphtali
place: a85cbab
title:
  en: "Beth-shemesh in Naphtali"
  ru: "Вефсамис в Неффалиме"
  uk: "Бет-Шемеш у Нефталимі"
  es: "Bet-semes en Neftalí"
  pt: "Bete-Semes de Naftali"
  de: "Bet-Schemesch in Naftali"
  fr: "Beth-Schémesch en Nephthali"
body:
  en:
    - "There were three towns called Beth-shemesh, “house of the sun”, after a sanctuary of the sun god. The famous one is in the Shephelah of Judah, where the ark came home from the Philistines; a second lay on the border of Issachar near Tabor. This third one was a fortified city of Naphtali in Upper Galilee, named with Beth-anath at the end of Joshua's list: “Horem, and Beth-anath, and Beth-shemesh; nineteen cities with their villages”. Judges adds that the tribe could not take it: “Neither did Naphtali drive out the inhabitants of Beth-shemesh, nor the inhabitants of Beth-anath; but he dwelt among the Canaanites … nevertheless the inhabitants of Beth-shemesh and of Beth-anath became tributaries unto them”."
    - "Nothing more is known of it. Since the two towns are paired, it is sought near Beth-anath, which is itself unlocated. The usual proposal, going back to Yohanan Aharoni's survey of Upper Galilee, is Tel Rosh (Khirbet Tell er-Ruweisi), a mound beside Fassuta in the hills near the Lebanese border, and that is the map's point; Hariss, a village across the border, has also been suggested, and some have thought Naphtali's town the same as Issachar's. Excavations at Tel Rosh in 2017–2018 found a regional centre of the Iron Age II, and its excavators now propose that it was Rehob of Asher instead, so the question is open."
  ru:
    - "Городов по имени Вефсамис, «дом солнца», по святилищу бога солнца, было три. Знаменитый — в Шефеле Иудиной, куда ковчег вернулся от Филистимлян; второй лежал на границе Иссахара близ Фавора. Этот, третий, был укреплённым городом Неффалима в Верхней Галилее, названным вместе с Беф-Анафом в конце списка книги Иисуса Навина: «Хорем, Беф-Анаф и Вефсамис: девятнадцать городов с их селами». Книга Судей добавляет, что колено не смогло его взять: «И Неффалим не изгнал жителей Вефсамиса и жителей Бефанафа и жил среди Хананеев, жителей земли той; жители же Вефсамиса и Бефанафа были его данниками»."
    - "Больше о нём ничего не известно. Поскольку два города стоят парой, его ищут рядом с Беф-Анафом, который и сам не найден. Обычное предположение, восходящее к обследованию Верхней Галилеи Йохананом Ахарони, — Тель-Рош (Хирбет-Телль-эр-Рувейси), холм у Фассуты в горах у ливанской границы, и это точка на карте; предлагали также Харис, деревню по ту сторону границы, а некоторые считали город Неффалима тем же, что и город Иссахара. Раскопки Тель-Роша в 2017–2018 годах открыли областной центр железного века II, и раскопщики теперь считают его скорее Реховом в уделе Асира, так что вопрос открыт."
  uk:
    - "Було три міста з назвою Бет-Шемеш, «дім сонця», за святилищем бога сонця. Відоме — у Шефелі Юди, куди ковчег повернувся від филистимлян; друге лежало на кордоні Іссахара біля Фавору. Це третє було укріпленим містом Нефталима у Верхній Галілеї, названим із Бет-Анатом наприкінці переліку Ісуса Навина: «Горем, Бет-Аннат і Бетсамис — девятнайцять городів з їх селами». Книга Суддів додає, що плем'я не змогло його взяти: «Нафталїй не повиганяв осадників Бет-Самиських й осадників Бет-Анама, і жив серед Канаанїїв, що державили землею; осадники ж Бет-Самиські зробились крепаками їх»."
    - "Більше про нього нічого не відомо. Оскільки два міста спарені, його шукають біля Бет-Анату, який сам не локалізований. Звичайна пропозиція, що сягає розвідки Йоханана Агароні у Верхній Галілеї, — Тель-Рош (Хірбет-Телль-ер-Руейсі), пагорб біля Фассути в горах поблизу ліванського кордону, і це точка мапи; пропонували також Харіс, село через кордон, а дехто вважав місто Нефталима тим самим, що й Іссахарове. Розкопки в Тель-Рошу 2017–2018 рр. виявили регіональний осередок залізної доби II, і розкопники нині пропонують, що це був Рехов Асіра, тож питання відкрите."
  es:
    - "Hubo tres ciudades llamadas Bet-semes, «casa del sol», por un santuario del dios sol. La famosa está en la Sefelá de Judá, adonde volvió el arca desde los filisteos; una segunda se hallaba en la frontera de Isacar, cerca del Tabor. Esta tercera era una ciudad fortificada de Neftalí en la Alta Galilea, nombrada con Bet-anat al final de la lista de Josué: «Horem, y Beth-anath, y Beth-semes: diez y nueve ciudades con sus aldeas». Jueces añade que la tribu no pudo tomarla: «Tampoco Nephtalí echó á los que habitaban en Beth-semes, y á los que habitaban en Beth-anath, sino que moró entre los Cananeos que habitaban en la tierra ... mas fuéronle tributarios los moradores de Beth-semes, y los moradores de Beth-anath»."
    - "Nada más se sabe de ella. Como las dos ciudades van emparejadas, se busca cerca de Bet-anat, que a su vez no está localizada. La propuesta habitual, que se remonta a la prospección de Yohanan Aharoni en la Alta Galilea, es Tel Rosh (Khirbet Tell er-Ruweisi), un montículo junto a Fassuta, en las colinas cercanas a la frontera libanesa, y ese es el punto del mapa; también se ha sugerido Hariss, una aldea al otro lado de la frontera, y algunos han pensado que la ciudad de Neftalí es la misma que la de Isacar. Las excavaciones en Tel Rosh en 2017–2018 hallaron un centro regional de la edad del Hierro II, y sus excavadores proponen ahora que fue más bien Rehob de Aser, de modo que la cuestión está abierta."
  pt:
    - "Havia três cidades chamadas Bete-Semes, “casa do sol”, por causa de um santuário do deus-sol. A famosa fica na Sefelá de Judá, para onde a arca voltou dos filisteus; uma segunda ficava na fronteira de Issacar, perto do Tabor. Esta terceira era uma cidade fortificada de Naftali, na Alta Galileia, nomeada com Bete-Anate no fim da lista de Josué: “Horém, Bete-Anate e Bete-Semes; dezenove cidades com as suas aldeias”. Juízes acrescenta que a tribo não pôde tomá-la: “Naftali não expulsou os habitantes de Bete-Semes, nem os habitantes de Bete-Anate; mas viveu entre os cananeus … Contudo, os habitantes de Bete-Semes e de Bete-Anate foram sujeitos a trabalhos forçados”."
    - "Nada mais se sabe dela. Como as duas cidades andam juntas, é procurada perto de Bete-Anate, que também não foi localizada. A proposta habitual, que remonta ao levantamento de Yohanan Aharoni na Alta Galileia, é Tel Rosh (Khirbet Tell er-Ruweisi), um montículo junto a Fassuta, nas colinas perto da fronteira libanesa, e esse é o ponto do mapa; Hariss, uma aldeia do outro lado da fronteira, também foi sugerida, e alguns pensaram que a cidade de Naftali é a mesma de Issacar. Escavações em Tel Rosh em 2017–2018 acharam um centro regional da Idade do Ferro II, e seus escavadores propõem agora que fosse Reobe de Aser, de modo que a questão está aberta."
  de:
    - "Es gab drei Städte namens Bet-Schemesch, „Haus der Sonne“, nach einem Heiligtum des Sonnengottes. Die berühmte liegt in der Schefela von Juda, wohin die Lade von den Philistern heimkehrte; eine zweite lag an der Grenze von Issachar nahe dem Tabor. Diese dritte war eine befestigte Stadt Naftalis in Obergaliläa, mit Bet-Anat am Ende von Josuas Liste genannt: „Jereon, Migdal-El, Horem, Beth-Anath, Beth-Semes. Neunzehn Städte und ihre Dörfer.“ Das Richterbuch fügt hinzu, dass der Stamm sie nicht nehmen konnte: „Naphthali vertrieb die Einwohner nicht zu Beth-Semes noch zu Beth-Anath, sondern wohnte unter den Kanaanitern, die im Lande wohnten. Aber die zu Beth-Semes und zu Beth-Anath wurden zinsbar.“"
    - "Mehr ist von ihr nicht bekannt. Da die beiden Städte gepaart sind, sucht man sie nahe Bet-Anat, das selbst nicht lokalisiert ist. Der übliche Vorschlag, auf Yohanan Aharonis Survey von Obergaliläa zurückgehend, ist Tel Rosch (Chirbet Tell er-Ruweisi), ein Hügel bei Fassuta im Bergland nahe der libanesischen Grenze, und das ist der Punkt auf der Karte; Hariss, ein Dorf jenseits der Grenze, wurde auch vorgeschlagen, und einige hielten Naftalis Stadt für dieselbe wie die Issachars. Grabungen in Tel Rosch 2017–2018 fanden ein regionales Zentrum der Eisenzeit II, und die Ausgräber schlagen nun vor, es sei stattdessen Rehob in Asser gewesen, die Frage ist also offen."
  fr:
    - "Il y eut trois villes appelées Beth-Schémesch, « maison du soleil », d’après un sanctuaire du dieu soleil. La célèbre est dans la Shéphéla de Juda, où l’arche revint des Philistins ; une deuxième se trouvait à la frontière d’Issacar près du Thabor. Cette troisième était une ville fortifiée de Nephthali en Haute Galilée, nommée avec Beth-Anath à la fin de la liste de Josué : « Horem, Beth-Anath et Beth-Schémesch. Dix-neuf villes, et leurs villages ». Les Juges ajoutent que la tribu ne put la prendre : « Nephthali ne chassa point les habitants de Beth-Schémesch, ni les habitants de Beth-Anath, et il habita au milieu des Cananéens, habitants du pays, mais les habitants de Beth-Schémesch et de Beth-Anath furent assujettis à un tribut »."
    - "On ne sait rien de plus d’elle. Les deux villes étant appariées, on la cherche près de Beth-Anath, elle-même non localisée. La proposition habituelle, remontant à la prospection de Yohanan Aharoni en Haute Galilée, est Tel Rosh (Khirbet Tell er-Ruweisi), tertre à côté de Fassuta dans les collines près de la frontière libanaise, et c’est le point de la carte ; Hariss, village de l’autre côté de la frontière, a aussi été suggéré, et certains ont pensé que la ville de Nephthali était la même que celle d’Issacar. Les fouilles de Tel Rosh en 2017-2018 ont trouvé un centre régional de l’âge du Fer II, et ses fouilleurs proposent maintenant d’y voir plutôt Rehob d’Aser, si bien que la question est ouverte."
