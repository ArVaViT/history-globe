# Overview article (ADR 0007). Mainstream facts only; this is the northern Beth-shemesh of Naphtali, distinguished from the famous one in Judah and from Issachar's; Tel Rosh is Aharoni's proposal, unexcavated.
id: beth-shemesh-naphtali
place: a85cbab
title:
  en: "Beth-shemesh in Naphtali"
  ru: "Вефсамис в Неффалиме"
  uk: "Бет-Шемеш у Нефталимі"
  es: "Bet-semes en Neftalí"
  pt: "Bete-Semes de Naftali"
  de: "Bet-Schemesch in Naftali"
  fr: "Beth-Schémesch en Nephthali"
  it: "Bet-Semes di Neftali"
  pl: "Bet-Szemesz w Neftalim"
  nl: "Beth-Semes in Naftali"
  cs: "Bét-šemeš v Neftalí"
  sv: "Bet-Shemesh i Naftali"
  nb: "Bet-Sjemesj i Naftali"
  tl: "Beth-semes sa Nephtali"
  da: "Bet-Sjemesj i Naftali"
body:
  en:
    - "In the land of Israel there were three towns called Beth-shemesh, “house of the sun”, probably after a sanctuary of the sun god. The famous one is in the Shephelah of Judah, where the ark came home from the Philistines; a second lay on the border of Issachar near Tabor. This third one was a fortified city of Naphtali in Upper Galilee, named with Beth-anath at the end of Joshua's list: “Horem, and Beth-anath, and Beth-shemesh; nineteen cities with their villages”. Judges adds that the tribe could not take it: “Neither did Naphtali drive out the inhabitants of Beth-shemesh, nor the inhabitants of Beth-anath; but he dwelt among the Canaanites … nevertheless the inhabitants of Beth-shemesh and of Beth-anath became tributaries unto them”."
    - "Nothing more is known of it. Since the two towns are paired, it is sought near Beth-anath, which is itself unlocated. The usual proposal, going back to Yohanan Aharoni's survey of Upper Galilee, is Tel Rosh (Khirbet Tell er-Ruweisi), a mound beside Fassuta in the hills near the Lebanese border, and that is the map's point; Hariss, a village across the border, has also been suggested, and some have thought Naphtali's town the same as Issachar's. Excavations at Tel Rosh in 2017–2018 found a regional centre of the Iron Age II, and its excavators now propose that it was Rehob of Asher instead, so the question is open."
  ru:
    - "В земле Израиля городов по имени Вефсамис, «дом солнца», вероятно, по святилищу бога солнца, было три. Знаменитый — в Шефеле Иудиной, куда ковчег вернулся от Филистимлян; второй лежал на границе Иссахара близ Фавора. Этот, третий, был укреплённым городом Неффалима в Верхней Галилее, названным вместе с Беф-Анафом в конце списка книги Иисуса Навина: «Хорем, Беф-Анаф и Вефсамис: девятнадцать городов с их селами». Книга Судей добавляет, что колено не смогло его взять: «И Неффалим не изгнал жителей Вефсамиса и жителей Бефанафа и жил среди Хананеев, жителей земли той; жители же Вефсамиса и Бефанафа были его данниками»."
    - "Больше о нём ничего не известно. Поскольку два города стоят парой, его ищут рядом с Беф-Анафом, который и сам не найден. Обычное предположение, восходящее к обследованию Верхней Галилеи Йохананом Ахарони, — Тель-Рош (Хирбет-Телль-эр-Рувейси), холм у Фассуты в горах у ливанской границы, и это точка на карте; предлагали также Харис, деревню по ту сторону границы, а некоторые считали город Неффалима тем же, что и город Иссахара. Раскопки Тель-Роша в 2017–2018 годах открыли областной центр железного века II, и раскопщики теперь считают его скорее Реховом в уделе Асира, так что вопрос открыт."
  uk:
    - "У землі Ізраїлю було три міста з назвою Бет-Шемеш, «дім сонця», імовірно, за святилищем бога сонця. Відоме — у Шефелі Юди, куди ковчег повернувся від филистимлян; друге лежало на кордоні Іссахара біля Фавору. Це третє було укріпленим містом Нефталима у Верхній Галілеї, названим із Бет-Анатом наприкінці переліку Ісуса Навина: «Горем, Бет-Аннат і Бетсамис — девятнайцять городів з їх селами». Книга Суддів додає, що плем'я не змогло його взяти: «Нафталїй не повиганяв осадників Бет-Самиських й осадників Бет-Анама, і жив серед Канаанїїв, що державили землею; осадники ж Бет-Самиські зробились крепаками їх»."
    - "Більше про нього нічого не відомо. Оскільки два міста спарені, його шукають біля Бет-Анату, який сам не локалізований. Звичайна пропозиція, що сягає розвідки Йоханана Агароні у Верхній Галілеї, — Тель-Рош (Хірбет-Телль-ер-Руейсі), пагорб біля Фассути в горах поблизу ліванського кордону, і це точка мапи; пропонували також Харіс, село через кордон, а дехто вважав місто Нефталима тим самим, що й Іссахарове. Розкопки в Тель-Рошу 2017–2018 рр. виявили регіональний осередок залізної доби II, і розкопники нині пропонують, що це був Рехов Асіра, тож питання відкрите."
  es:
    - "En la tierra de Israel hubo tres ciudades llamadas Bet-semes, «casa del sol», probablemente por un santuario del dios sol. La famosa está en la Sefelá de Judá, adonde volvió el arca desde los filisteos; una segunda se hallaba en la frontera de Isacar, cerca del Tabor. Esta tercera era una ciudad fortificada de Neftalí en la Alta Galilea, nombrada con Bet-anat al final de la lista de Josué: «Horem, y Beth-anath, y Beth-semes: diez y nueve ciudades con sus aldeas». Jueces añade que la tribu no pudo tomarla: «Tampoco Nephtalí echó á los que habitaban en Beth-semes, y á los que habitaban en Beth-anath, sino que moró entre los Cananeos que habitaban en la tierra ... mas fuéronle tributarios los moradores de Beth-semes, y los moradores de Beth-anath»."
    - "Nada más se sabe de ella. Como las dos ciudades van emparejadas, se busca cerca de Bet-anat, que a su vez no está localizada. La propuesta habitual, que se remonta a la prospección de Yohanan Aharoni en la Alta Galilea, es Tel Rosh (Khirbet Tell er-Ruweisi), un montículo junto a Fassuta, en las colinas cercanas a la frontera libanesa, y ese es el punto del mapa; también se ha sugerido Hariss, una aldea al otro lado de la frontera, y algunos han pensado que la ciudad de Neftalí es la misma que la de Isacar. Las excavaciones en Tel Rosh en 2017–2018 hallaron un centro regional de la edad del Hierro II, y sus excavadores proponen ahora que fue más bien Rehob de Aser, de modo que la cuestión está abierta."
  pt:
    - "Na terra de Israel havia três cidades chamadas Bete-Semes, “casa do sol”, provavelmente por causa de um santuário do deus-sol. A famosa fica na Sefelá de Judá, para onde a arca voltou dos filisteus; uma segunda ficava na fronteira de Issacar, perto do Tabor. Esta terceira era uma cidade fortificada de Naftali, na Alta Galileia, nomeada com Bete-Anate no fim da lista de Josué: “Horém, Bete-Anate e Bete-Semes; dezenove cidades com as suas aldeias”. Juízes acrescenta que a tribo não pôde tomá-la: “Naftali não expulsou os habitantes de Bete-Semes, nem os habitantes de Bete-Anate; mas viveu entre os cananeus … Contudo, os habitantes de Bete-Semes e de Bete-Anate foram sujeitos a trabalhos forçados”."
    - "Nada mais se sabe dela. Como as duas cidades andam juntas, é procurada perto de Bete-Anate, que também não foi localizada. A proposta habitual, que remonta ao levantamento de Yohanan Aharoni na Alta Galileia, é Tel Rosh (Khirbet Tell er-Ruweisi), um montículo junto a Fassuta, nas colinas perto da fronteira libanesa, e esse é o ponto do mapa; Hariss, uma aldeia do outro lado da fronteira, também foi sugerida, e alguns pensaram que a cidade de Naftali é a mesma de Issacar. Escavações em Tel Rosh em 2017–2018 acharam um centro regional da Idade do Ferro II, e seus escavadores propõem agora que fosse Reobe de Aser, de modo que a questão está aberta."
  de:
    - "Im Land Israel gab es drei Städte namens Bet-Schemesch, „Haus der Sonne“, wohl nach einem Heiligtum des Sonnengottes. Die berühmte liegt in der Schefela von Juda, wohin die Lade von den Philistern heimkehrte; eine zweite lag an der Grenze von Issachar nahe dem Tabor. Diese dritte war eine befestigte Stadt Naftalis in Obergaliläa, mit Bet-Anat am Ende von Josuas Liste genannt: „Jereon, Migdal-El, Horem, Beth-Anath, Beth-Semes. Neunzehn Städte und ihre Dörfer.“ Das Richterbuch fügt hinzu, dass der Stamm sie nicht nehmen konnte: „Naphthali vertrieb die Einwohner nicht zu Beth-Semes noch zu Beth-Anath, sondern wohnte unter den Kanaanitern, die im Lande wohnten. Aber die zu Beth-Semes und zu Beth-Anath wurden zinsbar.“"
    - "Mehr ist von ihr nicht bekannt. Da die beiden Städte gepaart sind, sucht man sie nahe Bet-Anat, das selbst nicht lokalisiert ist. Der übliche Vorschlag, auf Yohanan Aharonis Survey von Obergaliläa zurückgehend, ist Tel Rosch (Chirbet Tell er-Ruweisi), ein Hügel bei Fassuta im Bergland nahe der libanesischen Grenze, und das ist der Punkt auf der Karte; Hariss, ein Dorf jenseits der Grenze, wurde auch vorgeschlagen, und einige hielten Naftalis Stadt für dieselbe wie die Issachars. Grabungen in Tel Rosch 2017–2018 fanden ein regionales Zentrum der Eisenzeit II, und die Ausgräber schlagen nun vor, es sei stattdessen Rehob in Asser gewesen, die Frage ist also offen."
  fr:
    - "Dans le pays d’Israël, il y eut trois villes appelées Beth-Schémesch, « maison du soleil », probablement d’après un sanctuaire du dieu soleil. La célèbre est dans la Shéphéla de Juda, où l’arche revint des Philistins ; une deuxième se trouvait à la frontière d’Issacar près du Thabor. Cette troisième était une ville fortifiée de Nephthali en Haute Galilée, nommée avec Beth-Anath à la fin de la liste de Josué : « Horem, Beth-Anath et Beth-Schémesch. Dix-neuf villes, et leurs villages ». Les Juges ajoutent que la tribu ne put la prendre : « Nephthali ne chassa point les habitants de Beth-Schémesch, ni les habitants de Beth-Anath, et il habita au milieu des Cananéens, habitants du pays, mais les habitants de Beth-Schémesch et de Beth-Anath furent assujettis à un tribut »."
    - "On ne sait rien de plus d’elle. Les deux villes étant appariées, on la cherche près de Beth-Anath, elle-même non localisée. La proposition habituelle, remontant à la prospection de Yohanan Aharoni en Haute Galilée, est Tel Rosh (Khirbet Tell er-Ruweisi), tertre à côté de Fassuta dans les collines près de la frontière libanaise, et c’est le point de la carte ; Hariss, village de l’autre côté de la frontière, a aussi été suggéré, et certains ont pensé que la ville de Nephthali était la même que celle d’Issacar. Les fouilles de Tel Rosh en 2017-2018 ont trouvé un centre régional de l’âge du Fer II, et ses fouilleurs proposent maintenant d’y voir plutôt Rehob d’Aser, si bien que la question est ouverte."
  it:
    - "Nella terra d’Israele vi erano tre città chiamate Bet-Semes, «casa del sole», probabilmente da un santuario del dio sole. La famosa è nella Sefela di Giuda, dove l’arca tornò dai Filistei; una seconda sorgeva sul confine di Issacar presso il Tabor. Questa terza era una città fortificata di Neftali nell’Alta Galilea, nominata con Bet-Anat alla fine dell’elenco di Giosuè: «Horem, Beth-Anath e Beth-Scemesh: diciannove città e i loro villaggi». I Giudici aggiungono che la tribù non poté prenderla: «Neftali non cacciò gli abitanti di Beth-Scemesh, né gli abitanti di Beth-Anath, e si stabilì in mezzo ai Cananei che abitavano il paese; ma gli abitanti di Beth-Scemesh e di Beth-Anath furon da loro sottoposti a servitù»."
    - "Nient’altro se ne sa. Poiché le due città sono appaiate, la si cerca vicino a Bet-Anat, che è essa stessa non localizzata. La proposta abituale, che risale alla ricognizione dell’Alta Galilea di Yohanan Aharoni, è Tel Rosh (Khirbet Tell er-Ruweisi), un tell accanto a Fassuta sulle colline presso il confine libanese, e questo è il punto della carta; è stata suggerita anche Hariss, un villaggio oltre il confine, e alcuni hanno pensato che la città di Neftali fosse la stessa di quella di Issacar. Gli scavi a Tel Rosh nel 2017–2018 hanno trovato un centro regionale dell’età del Ferro II, e i suoi scavatori propongono ora che fosse invece Recob di Aser, così la questione è aperta."
  pl:
    - "W ziemi Izraela były trzy miasta zwane Bet-Szemesz, „dom słońca”, prawdopodobnie od sanktuarium boga słońca. Sławne leży w Szefeli Judy, dokąd skrzynia wróciła od Filistynów; drugie leżało na granicy Issachara koło Taboru. To trzecie było obwarowanym miastem Neftalego w Górnej Galilei, wymienionym z Bet-Anat na końcu wykazu Jozuego: „Horem, i Betanat, i Betsemes, miast dziewiętnaście, i wsi ich”. Księga Sędziów dodaje, że pokolenie nie mogło go zdobyć: „Neftalim też nie wypędził obywateli z Betsemes, ani obywateli z Betanat, i mieszkał między Chananejczykami mieszkającymi w onej ziemi; jednak obywatele Betsemes i Betanat byli hołdownikami ich”."
    - "Nic więcej o nim nie wiadomo. Ponieważ oba miasta występują parą, szuka się go blisko Bet-Anat, które samo nie jest zlokalizowane. Zwykła propozycja, sięgająca badania Górnej Galilei przez Yohanana Aharoniego, to Tel Rosz (Chirbet Tell er-Ruweisi), kopiec obok Fassuta we wzgórzach koło granicy libańskiej, i to jest punkt mapy; sugerowano też Hariss, wieś za granicą, a niektórzy sądzili, że miasto Neftalego to to samo co Issachara. Wykopaliska w Tel Rosz w latach 2017–2018 odkryły ośrodek regionalny z epoki żelaza II, a jego wykopujący proponują teraz, że był to raczej Rechob Aszera, więc sprawa jest otwarta."
  nl:
    - "In het land Israël waren er drie steden genaamd Beth-Semes, “huis van de zon”, waarschijnlijk naar een heiligdom van de zonnegod. De beroemde ligt in de Sefela van Juda, waar de ark van de Filistijnen thuiskwam; een tweede lag op de grens van Issachar nabij de Tabor. Deze derde was een versterkte stad van Naftali in Boven-Galilea, genoemd met Beth-Anat aan het eind van Jozua’s lijst: “Horem en Beth-Anath, en Beth-Semes; negentien steden en haar dorpen”. Richteren voegt toe dat de stam haar niet kon innemen: “Nafthali verdreef de inwoners van Beth-Semes niet, noch de inwoners van Beth-Anath, maar woonde in het midden der Kanaanieten, die in het land woonden; doch de inwoners van Beth-Semes en Beth-Anath werden hun cijnsbaar”."
    - "Verder is er niets van bekend. Omdat de twee steden samen worden genoemd, wordt zij gezocht bij Beth-Anat, dat zelf niet is gelokaliseerd. Het gebruikelijke voorstel, teruggaand op Yohanan Aharoni’s verkenning van Boven-Galilea, is Tel Rosh (Khirbet Tell er-Ruweisi), een heuvel naast Fassuta in de heuvels bij de Libanese grens, en dat is het punt op de kaart; Hariss, een dorp over de grens, is ook voorgesteld, en sommigen hebben Naftali’s stad voor dezelfde gehouden als die van Issachar. Opgravingen op Tel Rosh in 2017–2018 vonden een regionaal centrum uit de ijzertijd II, en de opgravers stellen nu voor dat het in plaats daarvan Rechob van Aser was, dus de vraag is open."
  cs:
    - "V izraelské zemi byla tři města zvaná Bét-šemeš, „dům slunce“, pravděpodobně podle svatyně boha slunce. Slavné leží v judské Šefele, kam se truhla vrátila od Pelištejců; druhé leželo na hranici Isacharově u Táboru. Tento třetí byl opevněným městem Neftalího v Horní Galileji, jmenovaným s Bét-anatem na konci Jozuova seznamu: „Horem, Betanat a Betsemes, měst devatenácte i vsi jejich“. Kniha Soudců dodává, že je kmen nemohl dobýt: „Též Neftalím nevyhnal obyvatelů Betsemes, ani obyvatelů Betanat, protož bydlil mezi Kananajeskými přebývajícími v zemi té; a však obyvatelé Betsemes a Betanat dávali jim plat“."
    - "Nic dalšího o něm není známo. Protože jsou obě města spárována, hledá se poblíž Bét-anatu, který sám není lokalizován. Obvyklý návrh, sahající k průzkumu Horní Galileje Yohanana Aharoniho, je Tel Roš (Chirbet Tell er-Ruweisi), pahorek u Fassuty v pahorcích u libanonské hranice, a to je bod mapy; navržen byl též Hariss, vesnice za hranicí, a někteří pokládali město Neftalího za totéž co Isacharovo. Vykopávky na Tel Roš v letech 2017–2018 našly regionální středisko doby železné II a jeho vykopávači nyní navrhují, že šlo místo toho o Rechob Ašerův, takže otázka zůstává otevřená."
  sv:
    - "I Israels land fanns tre städer som hette Bet-Shemesh, ”solens hus”, troligen efter en helgedom åt solguden. Den berömda ligger i Judas Shefela, dit arken kom hem från filistéerna; en andra låg vid Isaskars gräns nära Tabor. Den här tredje var en befäst stad i Naftali i övre Galileen, nämnd tillsammans med Bet-Anat i slutet av Josuas förteckning: ”Horem, Bet-Anat och Bet-Semes – nitton städer med deras byar”. Domarboken tillägger att stammen inte kunde inta den: ”Naftali fördrev icke invånarna i Bet-Semes, ej heller invånarna i Bet-Anat, utan bodde ibland kananéerna, landets gamla inbyggare; men invånarna i Bet-Semes och Bet-Anat blevo arbetspliktiga åt dem”."
    - "Mer är inte känt om den. Eftersom de två städerna nämns i par söker man den nära Bet-Anat, som själv är oidentifierad. Det vanliga förslaget, som går tillbaka på Yohanan Aharonis inventering av övre Galileen, är Tel Rosh (Khirbet Tell er-Ruweisi), en kulle bredvid Fassuta i bergen nära den libanesiska gränsen, och det är kartans punkt; Hariss, en by på andra sidan gränsen, har också föreslagits, och somliga har ansett att Naftalis stad är densamma som Isaskars. Utgrävningar vid Tel Rosh 2017–2018 fann ett regionalt centrum från järnålder II, och utgrävarna föreslår nu att det i stället var Ashers Rehov, så frågan är öppen."
  nb:
    - "I Israels land fantes tre byer som het Bet-Sjemesj, «solens hus», trolig etter en helligdom for solguden. Den berømte ligger i Sjefela i Juda, dit arken kom hjem fra filistrene; en annen lå på grensen til Issakar nær Tabor. Denne tredje var en befestet by i Naftali i Øvre Galilea, nevnt sammen med Bet-Anat mot slutten av Josvas liste: «Horem og Bet-Anat og Bet-Semes, i alt nitten byer med tilhørende landsbyer». Dommerboken legger til at stammen ikke kunne innta den: «Naftali drev ikke bort innbyggerne i Bet-Semes og innbyggerne i Bet-Anat, men bosatte sig midt iblandt kana'anittene som bodde i landet, og innbyggerne i Bet-Semes og Bet-Anat blev arbeidspliktige under dem»."
    - "Mer er ikke kjent om den. Siden de to byene er nevnt som et par, søkes den nær Bet-Anat, som selv ikke er lokalisert. Det vanlige forslaget, som går tilbake til Yohanan Aharonis undersøkelse av Øvre Galilea, er Tel Rosj (Khirbet Tell er-Ruweisi), en tell ved siden av Fassuta i åsene nær den libanesiske grensen, og det er kartets punkt; Hariss, en landsby på den andre siden av grensen, er også blitt foreslått, og noen har ment at Naftalis by er den samme som Issakars. Utgravninger på Tel Rosj i 2017–2018 fant et regionalt senter fra jernalder II, og utgraverne foreslår nå at det i stedet var Rehob i Asjer, så spørsmålet er åpent."
  tl:
    - "Sa lupain ng Israel ay may tatlong bayang tinatawag na Beth-semes, “bahay ng araw”, marahil ayon sa isang santuwaryo ng diyos-araw. Ang bantog ay nasa Sephela ng Juda, kung saan umuwi ang kaban mula sa mga Filisteo; ang ikalawa ay nasa hangganan ng Issachar malapit sa Tabor. Ang ikatlong ito ay isang nakukutaang lungsod ng Nephtali sa Itaas na Galilea, na pinangalanan kasama ng Beth-anath sa wakas ng talaan ni Josue: “Horem, at Beth-anath, at Beth-semes: labing siyam na bayan pati ng mga nayon ng mga yaon”. Idinadagdag ng Mga Hukom na hindi ito nasakop ng lipi: “Hindi pinalayas ng Nephtali ang mga nananahan sa Beth-semes, ni ang mga nananahan sa Beth-anath; kundi siya'y tumahan sa gitna ng mga Cananeo … gayon ma'y ang mga nananahan sa Beth-semes at nananahan sa Beth-anath ay naging mga tagapagpaatag sa kaniya”."
    - "Wala nang higit na nalalaman tungkol dito. Yamang magkapares ang dalawang bayan, hinahanap ito malapit sa Beth-anath, na hindi rin matukoy. Ang karaniwang mungkahi, na nagmula sa survey ni Yohanan Aharoni sa Itaas na Galilea, ay ang Tel Rosh (Khirbet Tell er-Ruweisi), isang tel sa tabi ng Fassuta sa mga burol malapit sa hangganan ng Libano, at iyon ang punto ng mapa; iminungkahi rin ang Hariss, isang nayon sa kabila ng hangganan, at inakala ng ilan na iisa ang bayan ng Nephtali at ang bayan ng Issachar. Ang mga paghuhukay sa Tel Rosh noong 2017–2018 ay nakatagpo ng sentrong panrehiyon ng Panahon ng Bakal II, at iminumungkahi ngayon ng mga tagahukay nito na ito pala ang Rehob ng Aser, kaya bukas pa ang tanong."
  da:
    - "I Israels land fandtes der tre byer kaldet Bet-Sjemesj, »solens hus«, formodentlig efter en helligdom for solguden. Den berømte ligger i Judas Sjefela, hvor arken kom hjem fra filisterne; en anden lå ved Issakars grænse nær Tabor. Denne tredje var en befæstet by i Naftali i Øvre Galilæa, nævnt sammen med Bet-Anat til sidst i Josvas liste: »Horem og Beth-Anath og Beth-Semes; nitten Stæder og deres Landsbyer«. Dommerbogen tilføjer, at stammen ikke kunne indtage den: »Nafthali fordrev ikke Indbyggerne i Beth-Semes eller Indbyggerne i Beth-Anath, men boede midt iblandt Kananiterne … men Indbyggerne i Beth-Semes og Beth-Anath bleve dem skatskyldige«."
    - "Mere vides ikke om den. Da de to byer nævnes parvis, søges den nær Bet-Anat, som selv er uidentificeret. Det sædvanlige forslag, der går tilbage til Yohanan Aharonis undersøgelse af Øvre Galilæa, er Tel Rosh (Khirbet Tell er-Ruweisi), en banke ved siden af Fassuta i bjergene nær den libanesiske grænse, og det er kortets punkt; Hariss, en landsby på den anden side af grænsen, er også blevet foreslået, og nogle har anset Naftalis by for den samme som Issakars. Udgravninger ved Tel Rosh i 2017–2018 fandt et regionalt centrum fra jernalder II, og udgraverne foreslår nu, at det i stedet var Asers Rehob, så spørgsmålet er åbent."
