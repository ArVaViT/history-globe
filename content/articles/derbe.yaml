body:
  en:
    - "Derbe lay in south-eastern Lycaonia, towards Isauria and Cappadocia. Its site is fixed by inscriptions. In 1956 Michael Ballance found at the mound of Kerti Hüyük, about 22 km north-east of Karaman (ancient Laranda), a dedication to the emperor Antoninus Pius set up in 157 by the council and people of Derbe. Because he saw no trace of Byzantine settlement on the mound, Ballance himself later looked for an alternative site close by; Derbe is placed at Kerti Hüyük or in its immediate neighbourhood."
    - "In the first century BC Derbe was the seat of a local ruler, Antipater of Derbe, who also held Laranda; Cicero called him his guest-friend and close friend. Strabo says that Amyntas of Galatia attacked and killed Antipater and took Derbe. After Amyntas' death in 25 BC it became part of the Roman province of Galatia. Probably under Claudius the town took the name Claudio-Derbe, which appears on its coins of the second century."
    - "After Paul was stoned at Lystra, he left the next day with Barnabas for Derbe, the farthest point of their journey. There they preached the gospel and taught many, and then turned back through Lystra, Iconium and Antioch, strengthening the disciples. Acts tells of no persecution at Derbe, and the Second Letter to Timothy, recalling Paul's sufferings, names Antioch, Iconium and Lystra but not Derbe."
    - "Paul came to Derbe and Lystra again on his second journey, and there he found Timothy. One of the men who later went with Paul to Asia was Gaius of Derbe. The town remained small. It had bishops of its own; William Ramsay argued that later records name the see after Possala, a nearby village that outgrew Derbe."
  ru:
    - "Дервия лежала на юго-востоке Ликаонии, в сторону Исаврии и Каппадокии. Её место установлено по надписям. В 1956 г. Майкл Балланс нашёл на холме Керти-Хююк, примерно в 22 км к северо-востоку от Карамана (древней Ларанды), посвящение императору Антонину Пию, поставленное в 157 г. советом и народом Дервии. Не найдя на холме следов византийского поселения, сам Балланс позже искал другое место поблизости; Дервию помещают на Керти-Хююке или в его ближайших окрестностях."
    - "В I веке до н. э. Дервия была резиденцией местного правителя Антипатра Дервийского, владевшего и Ларандой; Цицерон называл его своим гостеприимцем и близким другом. Страбон пишет, что галатский царь Аминта напал на Антипатра, убил его и взял Дервию. После смерти Аминты в 25 г. до н. э. она вошла в римскую провинцию Галатию. Вероятно, при Клавдии город получил имя Клавдио-Дервия, которое стоит на его монетах II века."
    - "После того как Павла побили камнями в Листре, он на другой день ушёл с Варнавою в Дервию — самую дальнюю точку их пути. Здесь они проповедали Евангелие и приобрели довольно учеников, а затем повернули обратно через Листру, Иконию и Антиохию, утверждая учеников. Книга Деяний не говорит о гонениях в Дервии, и Второе послание к Тимофею, вспоминая страдания Павла, называет Антиохию, Иконию и Листру, но не Дервию."
    - "Во втором путешествии Павел снова дошёл до Дервии и Листры и там нашёл Тимофея. Среди тех, кто позже сопровождал Павла в Асию, был Гаий Дервянин. Город остался небольшим. У него были свои епископы; по мнению Уильяма Рамзая, позднейшие записи называют кафедру по Поссале — соседнему селению, которое переросло Дервию."
  uk:
    - "Дервія лежала в південно-східній Лікаонії, в бік Ісаврії та Каппадокії. Її місце встановлено за написами. У 1956 р. Майкл Баллане знайшов на горбі Керті-Гююк, приблизно за 22 км на північний схід від Карамана (давня Ларанда), присвяту імператорові Антоніну Пію, поставлену в 157 р. радою і народом Дервії. Оскільки він не побачив на горбі слідів візантійського поселення, Баллане сам пізніше шукав поблизу альтернативне місце; Дервію розташовують у Керті-Гююку або в його безпосередньому сусідстві."
    - "У I ст. до н. е. Дервія була резиденцією місцевого правителя Антипатра Дервійського, який володів також Ларандою; Цицерон називав його своїм гостем-другом і близьким приятелем. Страбон каже, що Аминта Галатійський напав на Антипатра, вбив його й узяв Дервію. Після смерті Аминти в 25 р. до н. е. вона стала частиною римської провінції Галатія. Імовірно за Клавдія місто взяло назву Клавдіо-Дервія, яка з'являється на його монетах II ст."
    - "Після того як Павла побили камінням у Лістрі, він наступного дня вирушив із Варнавою до Дервії, найдальшої точки їхньої подорожі. Там вони проповідували євангелію й навчили багатьох, а потім повернулися через Лістру, Іконію та Антіохію, зміцнюючи учнів. Діяння не розповідають про жодне гоніння в Дервії, а Друге послання до Тимофія, пригадуючи страждання Павла, називає Антіохію, Іконію й Лістру, але не Дервію."
    - "Павло прийшов до Дервії та Лістри знову під час другої подорожі, і там знайшов Тимофія. Одним із чоловіків, що пізніше пішли з Павлом до Азії, був Гай з Дервії. Місто лишалося малим. Воно мало власних єпископів; Вільям Ремзі доводив, що пізніші записи називають кафедру за Поссалою, сусіднім селом, яке переросло Дервію."
  es:
    - "Derbe se hallaba en el sudeste de Licaonia, hacia Isauria y Capadocia. Su emplazamiento está fijado por inscripciones. En 1956 Michael Ballance halló en el montículo de Kerti Hüyük, a unos 22 km al nordeste de Karaman (la antigua Laranda), una dedicatoria al emperador Antonino Pío erigida en 157 por el consejo y el pueblo de Derbe. Como no vio rastro de población bizantina en el montículo, el propio Ballance buscó más tarde un emplazamiento alternativo cercano; Derbe se sitúa en Kerti Hüyük o en sus inmediaciones."
    - "En el siglo I a. C. Derbe fue sede de un gobernante local, Antípatro de Derbe, que poseía también Laranda; Cicerón lo llamaba su huésped y amigo íntimo. Estrabón dice que Amintas de Galacia atacó y mató a Antípatro y tomó Derbe. Tras la muerte de Amintas en el 25 a. C. pasó a formar parte de la provincia romana de Galacia. Probablemente bajo Claudio la ciudad tomó el nombre de Claudio-Derbe, que aparece en sus monedas del siglo II."
    - "Después de que Pablo fuera apedreado en Listra, salió al día siguiente con Bernabé hacia Derbe, el punto más lejano de su viaje. Allí predicaron el Evangelio y enseñaron a muchos, y luego regresaron por Listra, Iconio y Antioquía, fortaleciendo a los discípulos. Los Hechos no cuentan ninguna persecución en Derbe, y la Segunda carta a Timoteo, al recordar los sufrimientos de Pablo, nombra Antioquía, Iconio y Listra pero no Derbe."
    - "Pablo llegó de nuevo a Derbe y Listra en su segundo viaje, y allí encontró a Timoteo. Uno de los hombres que más tarde fueron con Pablo a Asia fue Gayo de Derbe. La ciudad siguió siendo pequeña. Tuvo obispos propios; William Ramsay sostuvo que registros posteriores nombran la sede por Possala, una aldea cercana que creció más que Derbe."
  pt:
    - "Derbe ficava no sudeste da Licaônia, em direção à Isáuria e à Capadócia. Seu local é fixado por inscrições. Em 1956, Michael Ballance achou no monte de Kerti Hüyük, a cerca de 22 km a nordeste de Karaman (a antiga Laranda), uma dedicatória ao imperador Antonino Pio erigida em 157 pelo conselho e pelo povo de Derbe. Por não ter visto vestígio de ocupação bizantina no monte, o próprio Ballance procurou depois um local alternativo ali perto; Derbe é situada em Kerti Hüyük ou em suas imediações."
    - "No século I a.C., Derbe foi sede de um governante local, Antípatro de Derbe, que também detinha Laranda; Cícero o chamava de seu hóspede e amigo íntimo. Estrabão diz que Amintas da Galácia atacou e matou Antípatro e tomou Derbe. Depois da morte de Amintas, em 25 a.C., ela passou a fazer parte da província romana da Galácia. Provavelmente sob Cláudio, a cidade tomou o nome de Cláudio-Derbe, que aparece em suas moedas do século II."
    - "Depois que Paulo foi apedrejado em Listra, partiu no dia seguinte com Barnabé para Derbe, o ponto mais distante de sua viagem. Ali pregaram o Evangelho e ensinaram a muitos, e depois voltaram por Listra, Icônio e Antioquia, fortalecendo os discípulos. Atos não conta nenhuma perseguição em Derbe, e a Segunda Carta a Timóteo, ao recordar os sofrimentos de Paulo, nomeia Antioquia, Icônio e Listra, mas não Derbe."
    - "Paulo veio a Derbe e Listra de novo em sua segunda viagem, e ali encontrou Timóteo. Um dos homens que mais tarde foram com Paulo à Ásia foi Gaio de Derbe. A cidade continuou pequena. Teve bispos próprios; William Ramsay defendeu que registros posteriores dão à sede o nome de Possala, uma aldeia vizinha que cresceu mais que Derbe."
  de:
    - "Derbe lag im Südosten Lykaoniens, in Richtung Isaurien und Kappadokien. Seine Lage ist durch Inschriften festgelegt. Im Jahr 1956 fand Michael Ballance am Hügel Kerti Hüyük, etwa 22 km nordöstlich von Karaman (dem antiken Laranda), eine Weihung an Kaiser Antoninus Pius, die 157 vom Rat und Volk von Derbe aufgestellt worden war. Weil er auf dem Hügel keine Spur byzantinischer Besiedlung sah, suchte Ballance selbst später nach einem Ort in unmittelbarer Nähe; Derbe wird bei Kerti Hüyük oder in dessen unmittelbarer Umgebung angesetzt."
    - "Im 1. Jahrhundert v. Chr. war Derbe Sitz eines lokalen Herrschers, Antipater von Derbe, der auch Laranda hielt; Cicero nannte ihn seinen Gastfreund und engen Freund. Strabon sagt, Amyntas von Galatien habe Antipater angegriffen und getötet und Derbe genommen. Nach Amyntas’ Tod 25 v. Chr. wurde es Teil der römischen Provinz Galatien. Wahrscheinlich unter Klaudius nahm die Stadt den Namen Claudioderbe an, der auf ihren Münzen des 2. Jahrhunderts erscheint."
    - "Nachdem Paulus in Lystra gesteinigt worden war, brach er am nächsten Tag mit Barnabas nach Derbe auf, dem fernsten Punkt ihrer Reise. Dort predigten sie das Evangelium und unterwiesen viele und kehrten dann über Lystra, Ikonion und Antiochia zurück und stärkten die Jünger. Die Apostelgeschichte erzählt von keiner Verfolgung in Derbe, und der Zweite Brief an Timotheus, der Paulus’ Leiden in Erinnerung ruft, nennt Antiochia, Ikonion und Lystra, aber nicht Derbe."
    - "Paulus kam auf seiner zweiten Reise erneut nach Derbe und Lystra, und dort fand er Timotheus. Einer der Männer, die später mit Paulus nach Asien gingen, war Gaius von Derbe. Die Stadt blieb klein. Sie hatte eigene Bischöfe; William Ramsay vertrat, spätere Quellen benennten den Bischofssitz nach Possala, einem nahen Dorf, das Derbe überflügelte."
  fr:
    - "Derbe se trouvait dans le sud-est de la Lycaonie, vers l’Isaurie et la Cappadoce. Son site est fixé par des inscriptions. En 1956, Michael Ballance trouva sur le tertre de Kerti Hüyük, à environ 22 km au nord-est de Karaman (l’ancienne Laranda), une dédicace à l’empereur Antonin le Pieux érigée en 157 par le conseil et le peuple de Derbe. Faute d’avoir vu sur le tertre trace d’établissement byzantin, Ballance lui-même chercha plus tard un autre site tout proche ; Derbe est placée à Kerti Hüyük ou dans son voisinage immédiat."
    - "Au Ier siècle av. J.-C., Derbe était le siège d’un dynaste local, Antipater de Derbe, qui tenait aussi Laranda ; Cicéron l’appelait son hôte et son intime ami. Strabon dit qu’Amyntas de Galatie attaqua et tua Antipater et prit Derbe. Après la mort d’Amyntas en 25 av. J.-C., elle fit partie de la province romaine de Galatie. Probablement sous Claude, la ville prit le nom de Claudio-Derbe, qui figure sur ses monnaies du IIe siècle."
    - "Après que Paul eut été lapidé à Lystre, il partit le lendemain avec Barnabas pour Derbe, point le plus éloigné de leur voyage. Là, ils prêchèrent l’Évangile et enseignèrent beaucoup de gens, puis repartirent par Lystre, Icone et Antioche, fortifiant les disciples. Les Actes ne mentionnent aucune persécution à Derbe, et la seconde lettre à Timothée, qui rappelle les souffrances de Paul, nomme Antioche, Icone et Lystre mais non Derbe."
    - "Paul revint à Derbe et à Lystre lors de son deuxième voyage, et c’est là qu’il trouva Timothée. L’un des hommes qui accompagnèrent plus tard Paul en Asie fut Gaïus de Derbe. La ville resta petite. Elle eut ses propres évêques ; William Ramsay soutint que des documents plus tardifs nomment le siège d’après Possala, un village voisin qui dépassa Derbe."
  it:
    - "Derbe sorgeva nella Licaonia sud-orientale, verso l’Isauria e la Cappadocia. Il suo sito è fissato da iscrizioni. Nel 1956 Michael Ballance trovò al tell di Kerti Hüyük, a circa 22 km a nord-est di Karaman (l’antica Laranda), una dedica all’imperatore Antonino Pio posta nel 157 dal consiglio e dal popolo di Derbe. Poiché non vide sul tell tracce di insediamento bizantino, Ballance stesso cercò in seguito un sito alternativo vicino; Derbe è collocata a Kerti Hüyük o nelle immediate vicinanze."
    - "Nel I secolo a.C. Derbe fu la sede di un sovrano locale, Antipatro di Derbe, che teneva anche Laranda; Cicerone lo chiamava suo ospite e amico intimo. Strabone dice che Aminta di Galazia attaccò e uccise Antipatro e prese Derbe. Dopo la morte di Aminta nel 25 a.C. entrò a far parte della provincia romana di Galazia. Probabilmente sotto Claudio la città prese il nome di Claudio-Derbe, che compare sulle sue monete del II secolo."
    - "Dopo che Paolo fu lapidato a Listra, il giorno dopo partì con Barnaba per Derbe, il punto più lontano del loro viaggio. Là predicarono il Vangelo e istruirono molti, poi tornarono indietro attraverso Listra, Icònio e Antiochia, confermando i discepoli. Gli Atti non raccontano alcuna persecuzione a Derbe, e la Seconda lettera a Timoteo, ricordando le sofferenze di Paolo, nomina Antiochia, Icònio e Listra ma non Derbe."
    - "Paolo tornò a Derbe e a Listra nel secondo viaggio, e là trovò Timoteo. Uno degli uomini che più tardi andarono con Paolo in Asia fu Gaio di Derbe. La città restò piccola. Ebbe vescovi propri; William Ramsay sostenne che registri più tardi nominano la sede dopo Possala, un villaggio vicino che superò Derbe."
  pl:
    - "Derbe leżało w południowo-wschodniej Likaonii, ku Izaurii i Kapadocji. Jego położenie wyznaczają inskrypcje. W 1956 r. Michael Ballance znalazł na kopcu Kerti Hüyük, około 22 km na północny wschód od Karamanu (starożytnej Laranda), dedykację dla cesarza Antonina Piusa wystawioną w 157 r. przez radę i lud Derbe. Ponieważ nie widział na kopcu śladu osadnictwa bizantyjskiego, sam Ballance szukał później innego miejsca w pobliżu; Derbe umieszcza się w Kerti Hüyük lub w jego bezpośrednim sąsiedztwie."
    - "W I w. p.n.e. Derbe było siedzibą miejscowego władcy, Antypatra z Derbe, który trzymał także Larandę; Cyceron nazywał go swoim gościnnym przyjacielem i bliskim przyjacielem. Strabon mówi, że Amyntas z Galacji napadł na Antypatra, zabił go i zajął Derbe. Po śmierci Amyntasa w 25 r. p.n.e. stało się częścią rzymskiej prowincji Galacji. Prawdopodobnie za Klaudiusza miasto przyjęło nazwę Klaudio-Derbe, która pojawia się na jego monetach z II w."
    - "Gdy Paweł został ukamienowany w Listrze, wyruszył następnego dnia z Barnabą do Derbe, najdalszego punktu ich podróży. Tam głosili ewangelię i nauczali wielu, po czym zawrócili przez Listrę, Ikonium i Antiochię, umacniając uczniów. Dzieje Apostolskie nie opowiadają o żadnym prześladowaniu w Derbe, a Drugi List do Tymoteusza, przypominając cierpienia Pawła, wymienia Antiochię, Ikonium i Listrę, lecz nie Derbe."
    - "Paweł przybył do Derbe i Listry ponownie podczas drugiej podróży i tam znalazł Tymoteusza. Jednym z ludzi, którzy później towarzyszyli Pawłowi do Azji, był Gajusz z Derbe. Miasto pozostało małe. Miało własnych biskupów; William Ramsay dowodził, że późniejsze zapisy nazywają stolicę biskupią od Possali, pobliskiej wsi, która przerosła Derbe."
  nl:
    - "Derbe lag in het zuidoosten van Lykaonië, richting Isaurië en Cappadocië. De plaats wordt door inscripties bepaald. In 1956 vond Michael Ballance bij de heuvel Kerti Hüyük, zo'n 22 km ten noordoosten van Karaman (het antieke Laranda), een opdracht aan keizer Antoninus Pius, in 157 geplaatst door de raad en het volk van Derbe. Omdat hij op de heuvel geen sporen van Byzantijnse bewoning zag, zocht Ballance zelf later een alternatieve plaats dichtbij; Derbe wordt gesitueerd bij Kerti Hüyük of in de directe omgeving."
    - "In de eerste eeuw v.Chr. was Derbe de zetel van een plaatselijke heerser, Antipater van Derbe, die ook Laranda bezat; Cicero noemde hem zijn gastvriend en intieme vriend. Strabo zegt dat Amyntas van Galatië Antipater aanviel, doodde en Derbe nam. Na Amyntas' dood in 25 v.Chr. werd het deel van de Romeinse provincie Galatië. Waarschijnlijk onder Claudius nam de stad de naam Claudio-Derbe aan, die op haar munten uit de tweede eeuw voorkomt."
    - "Nadat Paulus te Lystra was gestenigd, vertrok hij de volgende dag met Barnabas naar Derbe, het verste punt van hun reis. Daar predikten zij het evangelie en maakten velen tot leerling, en keerden toen terug via Lystra, Ikonium en Antiochië om de leerlingen te versterken. Handelingen vertelt van geen vervolging te Derbe, en 2 Timoteüs noemt, Paulus' lijden memorerend, Antiochië, Ikonium en Lystra maar Derbe niet."
    - "Paulus kwam op zijn tweede reis opnieuw te Derbe en Lystra, en daar vond hij Timoteüs. Een van de mannen die later met Paulus naar Asia gingen was Gajus van Derbe. De stad bleef klein. Zij had eigen bisschoppen; William Ramsay betoogde dat latere bronnen de zetel noemen naar Possala, een nabij dorp dat Derbe ontgroeide."
  cs:
    - "Derbe leželo v jihovýchodní Lykaonii, směrem k Isaurii a Kappadokii. Jeho poloha je určena nápisy. Roku 1956 nalezl Michael Ballance na pahorku Kerti Hüyük, asi 22 km severovýchodně od Karamanu (antické Laranda), nápis věnovaný císaři Antoninu Piovi, postavený roku 157 radou a lidem Derbe. Protože na pahorku neviděl žádnou stopu byzantského osídlení, hledal Ballance sám později v blízkosti jiné místo; Derbe se klade na Kerti Hüyük nebo do jeho bezprostředního okolí."
    - "V 1. století př. n. l. bylo Derbe sídlem místního vládce Antipatra z Derbe, který držel i Larandu; Cicero jej nazýval svým hostitelským přítelem a blízkým přítelem. Strabón říká, že Amyntás Galatský Antipatra napadl a zabil a Derbe vzal. Po Amyntově smrti roku 25 př. n. l. se stalo součástí římské provincie Galacie. Pravděpodobně za Klaudia přijalo město jméno Klaudioderbe, které se objevuje na jeho mincích ze 2. století."
    - "Poté co byl Pavel ukamenován v Lystře, odešel druhého dne s Barnabášem do Derbe, nejvzdálenějšího bodu jejich cesty. Tam kázali evangelium a vyučovali mnohé, a pak se vrátili přes Lystru, Ikonium a Antiochii, utvrzujíce učedníky. Skutky neuvádějí v Derbe žádné pronásledování a Druhý list Timoteovi, připomínající Pavlova utrpení, jmenuje Antiochii, Ikonium a Lystru, ale ne Derbe."
    - "Pavel přišel do Derbe a Lystry znovu na své druhé cestě a tam našel Timotea. Jeden z mužů, kteří později šli s Pavlem do Asie, byl Gaius z Derbe. Město zůstalo malé. Mělo vlastní biskupy; William Ramsay tvrdil, že pozdější záznamy pojmenovávají biskupství po Possale, blízké vesnici, která Derbe přerostla."
  sv:
    - "Derbe låg i sydöstra Lykaonien, mot Isaurien och Kappadokien. Dess läge är fastlagt genom inskriptioner. År 1956 fann Michael Ballance vid kullen Kerti Hüyük, omkring 22 km nordost om Karaman (antikens Laranda), en dedikation till kejsar Antoninus Pius, rest år 157 av Derbes råd och folk. Eftersom han inte såg några spår av bysantinsk bebyggelse på kullen sökte Ballance själv senare en alternativ plats i närheten; Derbe förläggs till Kerti Hüyük eller dess närmaste omgivning."
    - "Under första århundradet f.Kr. var Derbe säte för en lokal härskare, Antipater av Derbe, som också höll Laranda; Cicero kallade honom sin gästvän och nära vän. Strabon säger att Amyntas av Galatien angrep och dödade Antipater och tog Derbe. Efter Amyntas död 25 f.Kr. blev det en del av den romerska provinsen Galatien. Troligen under Claudius tog staden namnet Claudio-Derbe, som förekommer på dess mynt från 100-talet."
    - "Sedan Paulus stenats i Lystra lämnade han dagen därpå med Barnabas för Derbe, den yttersta punkten på deras resa. Där förkunnade de evangelium och undervisade många, och vände sedan tillbaka genom Lystra, Ikonion och Antiochia och styrkte lärjungarna. Apostlagärningarna berättar inte om någon förföljelse i Derbe, och Andra Timoteusbrevet, som erinrar om Paulus lidanden, nämner Antiochia, Ikonion och Lystra men inte Derbe."
    - "Paulus kom till Derbe och Lystra igen på sin andra resa, och där fann han Timoteus. En av männen som senare följde Paulus till Asien var Gaius från Derbe. Staden förblev liten. Den hade egna biskopar; William Ramsay hävdade att senare källor uppkallar biskopssätet efter Possala, en närbelägen by som växte ifrån Derbe."
  nb:
    - "Derbe lå i sørøstlige Lykaonia, mot Isauria og Kappadokia. Dets beliggenhet er fastlagt av innskrifter. I 1956 fant Michael Ballance ved haugen Kerti Hüyük, omtrent 22 km nordøst for Karaman (det gamle Laranda), en innvielse til keiser Antoninus Pius reist i 157 av Derbes råd og folk. Fordi han ikke så spor av bysantinsk bosetning på haugen, lette Ballance selv senere etter et alternativt sted i nærheten; Derbe plasseres ved Kerti Hüyük eller i dets umiddelbare nærhet."
    - "I det første århundre f.Kr. var Derbe sete for en lokal hersker, Antipater av Derbe, som også holdt Laranda; Cicero kalte ham sin gjestevenn og nære venn. Strabon sier at Amyntas av Galatia angrep og drepte Antipater og tok Derbe. Etter Amyntas' død i 25 f.Kr. ble det en del av den romerske provinsen Galatia. Trolig under Klaudius tok byen navnet Claudio-Derbe, som forekommer på dens mynter fra 100-tallet."
    - "Etter at Paulus var blitt stenet i Lystra, dro han dagen etter med Barnabas til Derbe, det ytterste punktet på deres reise. Der forkynte de evangeliet og underviste mange, og vendte så tilbake gjennom Lystra, Ikonium og Antiokia og styrket disiplene. Apostlenes gjerninger forteller om ingen forfølgelse i Derbe, og 2. Timoteusbrev, som minner om Paulus' lidelser, nevner Antiokia, Ikonium og Lystra, men ikke Derbe."
    - "Paulus kom til Derbe og Lystra igjen på sin andre reise, og der fant han Timoteus. En av mennene som senere fulgte Paulus til Asia, var Gajus fra Derbe. Byen forble liten. Den hadde egne biskoper; William Ramsay hevdet at senere kilder oppkaller bispesetet etter Possala, en nærliggende landsby som vokste ut av Derbe."
  tl:
    - "Ang Derbe ay nasa timog-silangang Licaonia, patungong Isauria at Capadocia. Natitiyak ng mga inskripsiyon ang pook nito. Noong 1956 natagpuan ni Michael Ballance sa tel ng Kerti Hüyük, mga 22 km sa hilagang-silangan ng Karaman (sinaunang Laranda), ang isang alay sa emperador Antonino Pio na itinayo noong 157 ng sanggunian at bayan ng Derbe. Dahil wala siyang nakitang bakas ng paninirahang Bizantino sa tel, hinanap din ni Ballance nang maglaon ang ibang pook sa malapit; inilalagay ang Derbe sa Kerti Hüyük o sa agarang paligid nito."
    - "Noong ika-1 siglo BK, ang Derbe ay luklukan ng lokal na pinuno, si Antipatro ng Derbe, na may hawak din ng Laranda; tinawag siya ni Ciceron na kaibigang panauhin at matalik na kaibigan. Sinasabi ni Strabo na sinalakay at pinatay ni Amintas ng Galacia si Antipatro at kinuha ang Derbe. Pagkamatay ni Amintas noong 25 BK, ito ay naging bahagi ng lalawigang Romano ng Galacia. Marahil sa ilalim ni Claudio, kinuha ng bayan ang pangalang Claudio-Derbe, na lumilitaw sa mga barya nito noong ika-2 siglo."
    - "Matapos pagbatuhin si Pablo sa Listra, umalis siya kinabukasan kasama si Bernabe patungong Derbe, ang pinakamalayong punto ng kanilang paglalakbay. Doon ay ipinangaral nila ang ebanghelyo at nagturo sa marami, at saka bumalik sa Listra, Iconio at Antioquia, na pinatatatag ang mga alagad. Walang inilalahad na pag-uusig sa Derbe ang Mga Gawa, at ang Ikalawang Liham kay Timoteo, na inaalala ang mga paghihirap ni Pablo, ay nagpapangalan sa Antioquia, Iconio at Listra ngunit hindi sa Derbe."
    - "Dumating muli si Pablo sa Derbe at Listra sa ikalawa niyang paglalakbay, at doon niya nakita si Timoteo. Isa sa mga sumama nang maglaon kay Pablo sa Asia ay si Gayo ng Derbe. Nanatiling maliit ang bayan. Nagkaroon ito ng sariling mga obispo; nangatwiran si William Ramsay na ang mga huling talaan ay nagpapangalan sa luklukan ayon sa Possala, isang kalapit na nayon na lumaki nang higit sa Derbe."
  da:
    - "Derbe lå i det sydøstlige Lykaonien, mod Isaurien og Kappadokien. Dets beliggenhed er fastlagt af indskrifter. I 1956 fandt Michael Ballance ved højen Kerti Hüyük, cirka 22 km nordøst for Karaman (antikkens Laranda), en indvielse til kejser Antoninus Pius, opsat i 157 af Derbes råd og folk. Fordi han ikke så spor af byzantinsk bebyggelse på højen, søgte Ballance selv senere efter et alternativt sted tæt på; Derbe placeres ved Kerti Hüyük eller i dens umiddelbare nærhed."
    - "I 1. århundrede f.Kr. var Derbe sæde for en lokal hersker, Antipater af Derbe, som også holdt Laranda; Cicero kaldte ham sin gæstven og nære ven. Strabon siger, at Amyntas af Galatien angreb og dræbte Antipater og tog Derbe. Efter Amyntas' død i 25 f.Kr. blev den en del af den romerske provins Galatien. Sandsynligvis under Klaudius tog byen navnet Klaudio-Derbe, som optræder på dens mønter fra 100-tallet."
    - "Efter at Paulus var blevet stenet i Lystra, rejste han dagen efter med Barnabas til Derbe, det fjerneste punkt på deres rejse. Dér forkyndte de evangeliet og underviste mange, og vendte derefter tilbage gennem Lystra, Ikonion og Antiokia og styrkede disciplene. Apostlenes Gerninger fortæller ikke om nogen forfølgelse i Derbe, og Andet Timotheusbrev, der erindrer Paulus' lidelser, nævner Antiokia, Ikonion og Lystra, men ikke Derbe."
    - "Paulus kom til Derbe og Lystra igen på sin anden rejse, og dér fandt han Timotheus. En af de mænd, der senere fulgte Paulus til Asien, var Gajus fra Derbe. Byen forblev lille. Den havde sine egne biskopper; William Ramsay argumenterede for, at senere optegnelser opkalder bispesædet efter Possala, en nærliggende landsby, der blev større end Derbe."
  sr:
    - "Дерва је лежала у југоисточној Ликаонији, према Исаурији и Кападокији. Њено место одређују натписи. Мајкл Баланс је 1956. на хумци Керти Хујук, око 22 км североисточно од Карамана (древне Ларанде), нашао посвету цару Антонину Пију коју су 157. поставили веће и народ Дерве. Пошто на хумци није видео трагова византијског насеља, и сам је Баланс касније тражио алтернативно налазиште у близини; Дерва се смешта у Керти Хујук или његову непосредну околину."
    - "У 1. веку п. н. е. Дерва је била седиште локалног владара, Антипатера из Дерве, који је држао и Ларанду; Цицерон га је звао својим гостопримцем и блиским пријатељем. Страбон каже да је Аминта од Галатије напао и убио Антипатера и узео Дерву. После Аминтине смрти 25. п. н. е. постала је део римске провинције Галатије. Вероватно за Клаудија град је добио име Клаудио-Дерва, које се јавља на његовом новцу из 2. века."
    - "Пошто је Павле био каменован у Листри, сутрадан је с Варнавом кренуо у Дерву, најдаљу тачку њиховог путовања. Тамо су проповедали јеванђеље и поучили многе, а затим се вратили кроз Листру, Икониј и Антиохију, утврђујући ученике. Дела не приповедају ни о каквом прогону у Дерви, а Друга посланица Тимотију, сећајући се Павлових страдања, именује Антиохију, Икониј и Листру, али не и Дерву."
    - "Павле је поново дошао у Дерву и Листру на свом другом путовању, и тамо је нашао Тимотија. Један од људи који су касније пошли с Павлом у Азију био је Гај из Дерве. Град је остао мали. Имао је своје епископе; Вилијам Рамзи тврдио је да каснији записи називају седиште по Посали, оближњем селу које је прерасло Дерву."
