body:
  en:
    - "Luhith is known only from one line of lament over Moab that Isaiah and Jeremiah share. Isaiah: “his fugitives shall flee unto Zoar … for by the mounting up of Luhith with weeping shall they go it up; for in the way of Horonaim they shall raise up a cry of destruction.” Jeremiah: “For in the going up of Luhith continual weeping shall go up; for in the going down of Horonaim the enemies have heard a cry of destruction.” So Luhith stood at the top of an ascent, with Horonaim on a road going down, both on the way the refugees of Moab fled towards Zoar at the southern end of the Dead Sea."
    - "Eusebius knew a village Louith between Areopolis (Rabbah) and Zoar, which fits a climb from the shore of the Dead Sea up to the Moabite plateau. The map marks first Kathrabba, a village on the western edge of the plateau above the plain at the south-eastern end of the Dead Sea, and as a second guess Medinet er-Ras; neither has produced an inscription with the name. Kathrabba today is a village of the Karak governorate in Jordan, above the steep descent to the Dead Sea."
  ru:
    - "Лухит известен только по одной строке плача о Моаве, общей у Исаии и Иеремии. У Исаии: «бегут из него к Сигору, до третьей Эглы; восходят на Лухит с плачем; по дороге Хоронаимской поднимают страшный крик». У Иеремии: «На восхождении в Лухит плач за плачем поднимается; и на спуске с Оронаима неприятель слышит вопль о разорении». Значит, Лухит стоял наверху подъёма, а Оронаим — на дороге вниз, и оба лежали на пути, которым беглецы Моава бежали к Сигору у южного конца Мёртвого моря."
    - "Евсевий знал селение Луиф между Ареополем (Раббой) и Сигором, что подходит к подъёму от берега Мёртвого моря на Моавитское плато. На карте первой стоит Катрабба, селение на западном краю плато над равниной у юго-восточного края Мёртвого моря, а второй догадкой — Мединет-эр-Рас; ни там, ни там не найдено надписи с этим именем. Катрабба сегодня — селение в иорданской провинции Эль-Карак, над крутым спуском к Мёртвому морю."
  uk:
    - "Лухіт відомий лише з одного рядка плачу над Моавом, спільного для Ісаї та Єремії. Ісая: «виходять, плачучи, на Лухит; по Хоронаїмській дорозї гірко голосять». Єремія: «Від підходячих у гору в Лухит голосний плач роздається, від спускаючихся в низ із Оронаїму зачуває ворог риданнє по спустошенню.» Отже, Лухіт стояв на вершині підйому, а Хоронаїм — на дорозі, що йшла вниз, обидва на шляху, яким біженці Моаву втікали до Сігору на південному краю Мертвого моря."
    - "Євсевій знав село Луїт між Ареополем (Равва) і Сігором, що пасує до підйому від берега Мертвого моря на моавитське плато. Мапа першим позначає Катраббу, село на західному краю плато над рівниною на південно-східному кінці Мертвого моря, а другою здогадкою — Мединет-ер-Рас; жодне не дало напису з цією назвою. Катрабба сьогодні — село мухафази Карак в Йорданії, над крутим спуском до Мертвого моря."
  es:
    - "Luhit se conoce solo por una línea de lamento sobre Moab que Isaías y Jeremías comparten. Isaías: «sus fugitivos huirán hasta Zoar [...] Por la cuesta de Luhith subirán llorando, y levantarán grito de quebrantamiento por el camino de Horonaim». Jeremías: «Porque á la subida de Luhith con lloro subirá el que llora; porque á la bajada de Horonaim los enemigos oyeron clamor de quebranto». Así, Luhit estaba en lo alto de una subida, y Horonaim en un camino que baja, ambos en la ruta por la que huyeron los refugiados de Moab hacia Zoar, en el extremo sur del mar Muerto."
    - "Eusebio conoció una aldea Louith entre Areópolis (Rabá) y Zoar, lo que concuerda con una subida desde la orilla del mar Muerto hasta la meseta de Moab. El mapa marca en primer lugar Kathrabba, una aldea en el borde occidental de la meseta, sobre la llanura del extremo sudeste del mar Muerto, y como segunda conjetura Medinet er-Ras; ninguna ha dado una inscripción con el nombre. Kathrabba es hoy una aldea de la gobernación de Karak, en Jordania, sobre el escarpado descenso al mar Muerto."
  pt:
    - "Luíte é conhecida apenas por uma linha de lamento sobre Moabe que Isaías e Jeremias compartilham. Isaías: “Seus nobres fogem para Zoar … pois sobem pela subida de Luíte com choro; pois no caminho para Horonaim, eles levantam um clamor de destruição.” Jeremias: “Pois pela subida de Luíte eles sobem com choro contínuo. Pois na descida de Horonaim ouviram a angústia do clamor de destruição.” Assim, Luíte ficava no alto de uma subida, com Horonaim numa estrada que desce, ambas no caminho por onde os refugiados de Moabe fugiram para Zoar, no extremo sul do mar Morto."
    - "Eusébio conhecia uma aldeia Louith entre Areópolis (Rabá) e Zoar, o que combina com uma subida da margem do mar Morto até o planalto moabita. O mapa marca em primeiro lugar Kathrabba, uma aldeia na borda ocidental do planalto, acima da planície no extremo sudeste do mar Morto, e como segundo palpite Medinet er-Ras; nenhuma produziu uma inscrição com o nome. Kathrabba é hoje uma aldeia da província de Karak, na Jordânia, acima da descida íngreme ao mar Morto."
  de:
    - "Luhit ist nur aus einer Klagezeile über Moab bekannt, die Jesaja und Jeremia teilen. Jesaja: „seine Flüchtigen fliehen bis gen Zoar … Denn sie gehen gen Luhith hinan und weinen, und auf dem Wege nach Horonaim zu erhebt sich ein Jammergeschrei.“ Jeremia: „denn sie gehen mit Weinen den Weg hinauf gen Luhith, und die Feinde hören ein Jammergeschrei den Weg von Horonaim herab“. Luhit lag also oben auf einem Anstieg, mit Horonajim an einer Straße, die hinabführte, beide auf dem Weg, auf dem die Flüchtlinge Moabs nach Zoar am Südende des Toten Meeres flohen."
    - "Eusebius kannte ein Dorf Louith zwischen Areopolis (Rabba) und Zoar, was zu einem Aufstieg vom Ufer des Toten Meeres auf die moabitische Hochebene passt. Die Karte zeigt zuerst Kathrabba, ein Dorf am Westrand der Hochebene über der Ebene am südöstlichen Ende des Toten Meeres, und als zweite Vermutung Medinet er-Ras; keiner hat eine Inschrift mit dem Namen geliefert. Kathrabba ist heute ein Dorf im Gouvernement Karak in Jordanien, oberhalb des steilen Abstiegs zum Toten Meer."
  fr:
    - "Luchith n’est connue que par un vers de lamentation sur Moab que partagent Ésaïe et Jérémie. Ésaïe : « dont les fugitifs se sauvent jusqu’à Tsoar … car ils font, en pleurant, la montée de Luchith, et ils jettent des cris de détresse sur le chemin de Choronaïm ». Jérémie : « Car on répand des pleurs à la montée de Luchith, et des cris de détresse retentissent à la descente de Choronaïm. » Luchith se tenait donc au sommet d’une montée, avec Choronaïm sur une route qui descend, toutes deux sur le chemin par lequel les réfugiés de Moab fuyaient vers Tsoar, à l’extrémité sud de la mer Morte."
    - "Eusèbe connaissait un village Louith entre Aréopolis (Rabba) et Tsoar, ce qui convient à une montée depuis la rive de la mer Morte vers le plateau moabite. La carte marque en premier Kathrabba, village au bord occidental du plateau, au-dessus de la plaine à l’extrémité sud-est de la mer Morte, et en second choix Medinet er-Ras ; aucun n’a livré d’inscription portant le nom. Kathrabba est aujourd’hui un village du gouvernorat de Karak, en Jordanie, au-dessus de la descente abrupte vers la mer Morte."
  it:
    - "Luchit è nota solo da un verso di lamento su Moab che Isaia e Geremia condividono. Isaia: «i cui fuggiaschi son già a Tsoar … perché fanno, piangendo, la salita di Luhit e mandan grida d’angoscia sulla via di Horonaim». Geremia: «Poiché su per la salita di Luhith si piange, si sale piangendo perché giù per la discesa di Horonaim s’ode il grido, angoscioso della rotta». Così Luchit stava in cima a una salita, con Coronaim su una strada in discesa, entrambe sulla via per cui i profughi di Moab fuggivano verso Soar, all’estremità meridionale del Mar Morto."
    - "Eusebio conosceva un villaggio Louith tra Areopoli (Rabba) e Soar, il che si accorda con una salita dalla riva del Mar Morto all’altopiano moabita. La mappa segna per prima Kathrabba, un villaggio sul margine occidentale dell’altopiano sopra la pianura all’estremità sud-orientale del Mar Morto, e come seconda ipotesi Medinet er-Ras; nessuna delle due ha restituito un’iscrizione con il nome. Kathrabba è oggi un villaggio del governatorato di Karak in Giordania, sopra la ripida discesa verso il Mar Morto."
  pl:
    - "Luchit jest znane tylko z jednego wersu lamentu nad Moabem, wspólnego Izajaszowi i Jeremiaszowi. Izajasz: „aż słyszeć w Zoar, jako jałowica trzyletnia; bo drogą Luchytską z płaczem pójdzie, a na drodze Choronaim krzyk jako w porażce podniosą”. Jeremiasz: „Przeto, że na drodze Luchytskiej będzie ustawiczny płacz, a którędy zstępują do Choronaim, nieprzyjaciele krzyk zburzenia słyszeć będą”. Luchit stało więc na szczycie wzniesienia, a Choronaim przy drodze prowadzącej w dół, oba na drodze, którą uchodźcy z Moabu uciekali w stronę Soaru na południowym krańcu Morza Martwego."
    - "Euzebiusz znał wieś Louith między Areopolis (Rabbą) a Soarem, co pasuje do wspinaczki z brzegu Morza Martwego na płaskowyż Moabu. Mapa zaznacza jako pierwszy Kathrabba, wieś na zachodnim skraju płaskowyżu nad równiną na południowo-wschodnim końcu Morza Martwego, a jako drugi domysł Medinet er-Ras; żaden nie dostarczył inskrypcji z tą nazwą. Kathrabba jest dziś wsią w muhafazie Karak w Jordanii, nad stromym zejściem do Morza Martwego."
  nl:
    - "Luchit is alleen bekend uit één regel klaagzang over Moab die Jesaja en Jeremia delen. Jesaja: “haar grendelen zijn naar Zoar toe … want hij gaat op met geween naar den opgang van Luhith, want op den weg naar Horonaim verwekken zij een jammergeschrei.” Jeremia: “Want in den opgang van Luhith zal geween bij geween opgaan, want in den afgang van Horonaim hebben Moabs wederpartijders een jammergeschrei gehoord.” Luchit lag dus boven aan een stijging, met Choronaïm aan een weg die afdaalt, beide op de weg waarlangs de vluchtelingen van Moab naar Zoar vluchtten, aan het zuidelijke einde van de Dode Zee."
    - "Eusebius kende een dorp Louith tussen Areopolis (Rabba) en Zoar, wat past bij een klim van de oever van de Dode Zee naar het Moabitische plateau. De kaart toont eerst Kathrabba, een dorp aan de westrand van het plateau boven de vlakte aan het zuidoostelijke uiteinde van de Dode Zee, en als tweede gissing Medinet er-Ras; geen van beide heeft een inscriptie met de naam opgeleverd. Kathrabba is tegenwoordig een dorp in het gouvernement Karak in Jordanië, boven de steile afdaling naar de Dode Zee."
  cs:
    - "Lúchit je znám jen z jednoho řádku nářku nad Moábem, který sdílejí Izajáš a Jeremjáš. Izajáš: „až slyšeti v Ségor … nebo cestou Luchitskou s pláčem půjde, a kudyž se chodí k Choronaim, křik hrozný vydávati budou.“ Jeremjáš: „Proto že na cestě Luchitské ustavičný bude pláč, a že kudyž se chodí k Choronaim, nepřátelé křik hrozný slyšeti budou.“ Lúchit tedy stál na vrcholu stoupání a Choronajim při cestě vedoucí dolů, obojí na cestě, kterou uprchlíci z Moábu utíkali k Soaru na jižním konci Mrtvého moře."
    - "Eusebius znal vesnici Louith mezi Areopolí (Rabbou) a Soarem, což odpovídá stoupání od pobřeží Mrtvého moře na moábskou náhorní rovinu. Mapa uvádí nejprve Kathrabbu, vesnici na západním okraji náhorní roviny nad pláněmi na jihovýchodním konci Mrtvého moře, a jako druhý dohad Medinet er-Ras; ani jeden nevydal nápis s tímto jménem. Kathrabba je dnes vesnice v guvernorátu Karak v Jordánsku, nad příkrým svahem k Mrtvému moři."
  sv:
    - "Luchit är känt endast från en klagorad över Moab som Jesaja och Jeremia delar. Jesaja: ”hans flyktingar fly ända till Soar … uppför Halluhits höjd stiger man under gråt, och på vägen till Horonaim höjas klagorop över förstörelsen.” Jeremia: ”Uppför Halluhots höjd stiger man under gråt, och på vägen ned till Horonaim höras ångestfulla klagorop över förstörelsen.” Alltså stod Luchit vid toppen av en stigning, med Horonajim vid en väg som går ned, båda på den väg som Moabs flyktingar flydde mot Soar i Döda havets södra ände."
    - "Eusebios kände en by Louith mellan Areopolis (Rabba) och Soar, vilket passar en stigning från Döda havets strand upp till den moabitiska högplatån. Kartan markerar först Kathrabba, en by vid högplatåns västra kant ovanför slätten i Döda havets sydöstra ände, och som en andra gissning Medinet er-Ras; ingen av dem har gett någon inskrift med namnet. Kathrabba är i dag en by i Karaks guvernement i Jordanien, ovanför den branta nedstigningen till Döda havet."
  nb:
    - "Luhit er bare kjent fra én linje i klagen over Moab som Jesaja og Jeremia deler. Jesaja: «dets flyktninger kommer like til Soar, den treårige kvige; for de går gråtende opover bakken til Luhit, på veien til Horona'im løfter de klagerop over ødeleggelsen.» Jeremia: «For gråtende går de opover bakken til Luhut; på veien ned til Horona'im høres angstfulle klagerop over ødeleggelsen.» Luhit lå altså på toppen av en stigning, med Horonajim ved en vei som går nedover, begge på veien moabittenes flyktninger flyktet mot Soar i den sørlige enden av Dødehavet."
    - "Eusebius kjente en landsby Louith mellom Areopolis (Rabba) og Soar, noe som passer med en stigning fra Dødehavets strand opp til det moabittiske høylandet. Kartet markerer først Kathrabba, en landsby på den vestlige kanten av høylandet over sletten i den sørøstlige enden av Dødehavet, og som annet gjett Medinet er-Ras; ingen av dem har gitt en innskrift med navnet. Kathrabba er i dag en landsby i Karak-guvernementet i Jordan, over den bratte nedstigningen til Dødehavet."
  tl:
    - "Kilala lamang ang Luhith mula sa isang taludtod ng panaghoy para sa Moab na iisa kina Isaias at Jeremias. Isaias: “ang kaniyang mga mahal na tao ay nagsisitakas sa Zoar … sapagka't sa ahunan sa Luhith ay nagsisiahon silang may iyakan: sapagka't sa daan ng Horonaim ay nagsisihagulhol sila sa kapahamakan.” Jeremias: “Sapagka't sa ahunan sa Luhith ay magsisiahon sila na may laging pagiyak; sapagka't kanilang narinig sa lusungan sa Horonaim ang kapanglawan ng hiyaw ng pagkapahamak.” Kaya ang Luhith ay nasa tuktok ng isang ahunan, at ang Horonaim sa daang pababa, kapwa sa landas na tinakasan ng mga tumakas ng Moab patungong Zoar sa katimugang dulo ng Dagat na Patay."
    - "Kilala ni Eusebio ang isang nayong Louith sa pagitan ng Areopolis (Rabba) at Zoar, na akma sa pag-akyat mula sa baybayin ng Dagat na Patay hanggang sa talampas ng Moab. Unang minamarkahan ng mapa ang Kathrabba, isang nayon sa kanlurang gilid ng talampas sa itaas ng kapatagan sa timog-silangang dulo ng Dagat na Patay, at bilang ikalawang hula ang Medinet er-Ras; wala sa dalawa ang nakapaglabas ng inskripsiyon na may pangalan. Ang Kathrabba ngayon ay nayon ng Karak Governorate sa Jordan, sa itaas ng matarik na pagbaba sa Dagat na Patay."
  da:
    - "Luhit kendes kun fra én linje i en klagesang over Moab, som Esajas og Jeremias deler. Esajas: »hvis Flygtninge ty lige til Zoar … thi man gaar op ad Lukits Opgang med Graad, og paa Vejen til Horonaim opløfter man et Fortvivlelsens Skrig.« Jeremias: »Thi ad Opgangen til Lukit stiger Graad op over Graad; og ved Nedgangen til Horonajm hører man Forstyrrelses Skrig.« Luhit lå altså øverst på en stigning, med Horonajm på en vej, der gik nedad, begge på den vej, Moabs flygtninge flygtede ad mod Soar i den sydlige ende af Det Døde Hav."
    - "Eusebios kendte en landsby Louith mellem Areopolis (Rabba) og Soar, hvilket passer til en stigning fra Det Døde Havs bred op til den moabitiske højslette. Kortet markerer først Kathrabba, en landsby på højslettens vestlige kant over sletten ved Det Døde Havs sydøstlige ende, og som andet gæt Medinet er-Ras; ingen af dem har givet en indskrift med navnet. Kathrabba er i dag en landsby i Karak-guvernementet i Jordan, over den stejle nedstigning til Det Døde Hav."
  sr:
    - "Лухит је познат само из једног реда тужбалице над Моавом који деле Исаија и Јеремија. Исаија: „бегунци његови побегоше дори до Сигора … јер ће се ићи уз брдо луитско плачући, и путем оронајимским разлегаће се јаук“. Јеремија: „Јер ће се путем луитским дизати плач без престанка; и како се силази у Оронајим, непријатељи ће чути страшну вику“. Лухит је дакле стајао на врху успона, а Оронајим на путу који силази, оба на путу којим су моавске избеглице бежале према Сигору на јужном крају Мртвог мора."
    - "Јевсевије је знао село Луит између Ареопоља (Раве) и Сигора, што одговара успону од обале Мртвог мора на моавску висораван. Мапа прво означава Катрабу, село на западном ободу висоравни изнад равнице на југоисточном крају Мртвог мора, а као другу претпоставку Мединет ер-Рас; ниједно није дало натпис с именом. Катраба је данас село у гувернорату Керак у Јордану, изнад стрмог спуста до Мртвог мора."
  hu:
    - "Lúhit csak egyetlen, Moáb fölötti siralomsorból ismert, amely Ézsaiásnál és Jeremiásnál közös. Ézsaiás szerint a menekülők Cóárig futnak, „mert Luhith hágóján sírással mennek fel, és mert Horonaim útján romlásuknak kiáltását hallatják”. Jeremiás: „Mert a Luhit hágóján siralmat siralom ér, mert Horonáim lejtőin az ellenség hallatja vészkiáltását.” Lúhit tehát egy emelkedő tetején állt, Hórónájim pedig egy lefelé vezető úton, mindkettő azon az úton, amelyen Moáb menekülői a Holt-tenger déli végén fekvő Cóár felé futottak."
    - "Eusebius ismert egy Louith falut Areopolis (Rabba) és Cóár között, ami a Holt-tenger partjáról a moábi fennsíkra vezető emelkedőhöz illik. A térkép elsőként a Kathrabbát jelöli, a Holt-tenger délkeleti végén fekvő síkság fölötti fennsík nyugati szélén álló falut, második találgatásként a Medinet er-Rast; egyik sem hozott olyan felíratot, amely a nevet tartalmazná. Kathrabba ma Jordánia Karak kormányzóságának faluja, a Holt-tengerhez vezető meredek lejtő fölött."
  fi:
    - "Luhit tunnetaan vain yhdestä Moabia koskevasta valituksen rivistä, jonka Jesaja ja Jeremia jakavat. Jesaja: ”sen pakolaisia on aina Sooariin … Luuhitin solatietä he nousevat itkien, Hooronaimin tiellä he puhkeavat parkuun hävityksen tähden.” Jeremia: ”Luuhitin solatietä noustaan itkien, Hooronaimin rinteeltä kuuluu tuskan huuto hävityksen tähden.” Luhit sijaitsi siis nousun huipulla ja Horonaim alas johtavalla tiellä, molemmat reitillä, jota Moabin pakolaiset pakenivat kohti Soaria Kuolleenmeren eteläpäässä."
    - "Eusebios tunsi kylän Louith Areopoliksen (Rabban) ja Soarin välillä, mikä sopii nousuun Kuolleenmeren rannalta Moabin ylängölle. Kartta merkitsee ensin Kathrabban, kylän ylängön läntisellä reunalla Kuolleenmeren kaakkoispään tasangon yläpuolella, ja toisena arvauksena Medinet er-Rasin; kumpikaan ei ole tuottanut nimeä kantavaa kirjoitusta. Kathrabba on nykyään Jordanian Karakin kuvernementin kylä jyrkän Kuollutmerelle laskeutumisen yläpuolella."
  vi:
    - "Lu-hít chỉ được biết qua một dòng than thở về Mô-áp mà Ê-sai và Giê-rê-mi cùng có. Ê-sai: “kẻ sang nó trốn chạy đến Xoa … Vì họ vừa trèo lên đèo Lu-hít vừa khóc; vì bại hoại mà kêu van trên con đường Hô-rô-na-im”. Giê-rê-mi: “Chúng nó sẽ lên giốc Lu-hít, khóc lóc, chẳng thôi; xuống giốc Hô-rô-na-im, nghe tiếng hủy hoại thảm sầu”. Vậy Lu-hít nằm ở đỉnh một con dốc, còn Hô-rô-na-im trên con đường xuống, cả hai trên đường những người tị nạn của Mô-áp chạy về Xoa ở đầu nam Biển Chết."
    - "Eusebius biết một làng Louith giữa Areopolis (Ráp-ba) và Xoa, phù hợp với một chặng leo từ bờ Biển Chết lên cao nguyên Mô-áp. Bản đồ đánh dấu trước hết Kathrabba, một làng ở rìa tây cao nguyên phía trên đồng bằng ở đầu đông nam Biển Chết, và như phỏng đoán thứ hai là Medinet er-Ras; không nơi nào cho ra bản khắc có tên. Kathrabba ngày nay là một làng thuộc tỉnh Karak của Gióc-đa-ni, phía trên dốc đứng xuống Biển Chết."
  ro:
    - "Luhit este cunoscut numai dintr-un rând de tânguire asupra Moabului pe care îl au în comun Isaia și Ieremia. Isaia: „Inima Moavului strigă întru sine până la Sigor … La suirea Luitului către tine plângând se vor suì pre calea Aroniimului; strigă zdrobire și cutremur.” Ieremia spune că la urcarea Luhitului se va urca plânset neîncetat, iar la coborârea Horonaimului dușmanii au auzit strigăt de nimicire. Luhit se afla deci în vârful unei urcări, iar Horonaim pe un drum care cobora, amândouă pe calea pe care fugeau refugiații Moabului spre Țoar, la capătul sudic al Mării Moarte."
    - "Eusebiu cunoștea un sat Louith între Areopolis (Raba) și Țoar, ceea ce se potrivește cu o urcare de pe țărmul Mării Moarte pe podișul Moabului. Harta marchează mai întâi Kathrabba, un sat de pe marginea vestică a podișului, deasupra câmpiei de la capătul sud-estic al Mării Moarte, și ca a doua presupunere Medinet er-Ras; niciunul nu a dat o inscripție cu numele. Kathrabba este astăzi un sat din guvernoratul Karak al Iordaniei, deasupra coborârii abrupte spre Marea Moartă."
  bg:
    - "Лухит е известен само от един ред от плача над Моав, общ за Исаия и Йеремия. Исаия: „Бежанците му ще тичат до Сигор… Защото с плач ще възлязат през възхода на Луит; Защото в пътя на Оронаим ще възвишат глас на изтребление“. Йеремия: „Защото във възхода на Луит Ще се възвиси плач върх плач; Понеже в изхода на Оронаим чуха враговете писък на съкрушение.“ Следователно Лухит е стоял на върха на изкачване, а Оронаим — на път, който слиза, и двата по пътя, по който моавските бежанци бягали към Сигор в южния край на Мъртво море."
    - "Евсевий познава село Луит между Ареопол (Рава) и Сигор, което подхожда на изкачване от брега на Мъртво море към Моавското плато. Картата отбелязва на първо място Катраба — село на западния край на платото над равнината в югоизточния край на Мъртво море, а като втора догадка Мединет ер-Рас; нито едното не е дало надпис с името. Катраба днес е село в губернията Керак в Йордания, над стръмния склон към Мъртво море."
