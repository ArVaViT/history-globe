# Overview article (ADR 0007). Mainstream facts only; the site follows Eusebius and the candidates on the map, named as identifications.
id: luhith
place: a91d516
title:
  en: "Luhith"
  ru: "Лухит"
body:
  en:
    - "Luhith is known only from one line of lament over Moab that Isaiah and Jeremiah share. Isaiah: “his fugitives shall flee unto Zoar … for by the mounting up of Luhith with weeping shall they go it up; for in the way of Horonaim they shall raise up a cry of destruction.” Jeremiah: “For in the going up of Luhith continual weeping shall go up; for in the going down of Horonaim the enemies have heard a cry of destruction.” So Luhith stood at the top of an ascent, with Horonaim on a road going down, both on the way the refugees of Moab fled towards Zoar at the southern end of the Dead Sea."
    - "Eusebius knew a village Louith between Areopolis (Rabbah) and Zoar, which fits a climb from the shore of the Dead Sea up to the Moabite plateau. The map marks first Kathrabba, a village on the western edge of the plateau above the plain at the south-eastern end of the Dead Sea, and as a second guess Medinet er-Ras; neither has produced an inscription with the name. Kathrabba today is a village of the Karak governorate in Jordan, above the steep descent to the Dead Sea."
  ru:
    - "Лухит известен только по одной строке плача о Моаве, общей у Исаии и Иеремии. У Исаии: «бегут из него к Сигору, до третьей Эглы; восходят на Лухит с плачем; по дороге Хоронаимской поднимают страшный крик». У Иеремии: «На восхождении в Лухит плач за плачем поднимается; и на спуске с Оронаима неприятель слышит вопль о разорении». Значит, Лухит стоял наверху подъёма, а Оронаим — на дороге вниз, и оба лежали на пути, которым беглецы Моава бежали к Сигору у южного конца Мёртвого моря."
    - "Евсевий знал селение Луиф между Ареополем (Раббой) и Сигором, что подходит к подъёму от берега Мёртвого моря на Моавитское плато. На карте первой стоит Катрабба, селение на западном краю плато над равниной у юго-восточного края Мёртвого моря, а второй догадкой — Мединет-эр-Рас; ни там, ни там не найдено надписи с этим именем. Катрабба сегодня — селение в иорданской провинции Эль-Карак, над крутым спуском к Мёртвому морю."
scripture:
  - Isa.15.5
  - Jer.48.5
sources:
  - "Eusebius, Onomasticon, s.v. Luith"
  - "B. MacDonald, East of the Jordan: Territories and Sites of the Hebrew Scriptures (2000)"
  - "J. M. Miller (ed.), Archaeological Survey of the Kerak Plateau (1991)"
