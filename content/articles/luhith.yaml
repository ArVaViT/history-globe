# Overview article (ADR 0007). Mainstream facts only; the site follows Eusebius and the candidates on the map, named as identifications.
id: luhith
place: a91d516
title:
  en: "Luhith"
  ru: "Лухит"
  uk: "Лухіт"
  es: "Luhit"
  pt: "Luíte"
  de: "Luhit"
  fr: "Luchith"
body:
  en:
    - "Luhith is known only from one line of lament over Moab that Isaiah and Jeremiah share. Isaiah: “his fugitives shall flee unto Zoar … for by the mounting up of Luhith with weeping shall they go it up; for in the way of Horonaim they shall raise up a cry of destruction.” Jeremiah: “For in the going up of Luhith continual weeping shall go up; for in the going down of Horonaim the enemies have heard a cry of destruction.” So Luhith stood at the top of an ascent, with Horonaim on a road going down, both on the way the refugees of Moab fled towards Zoar at the southern end of the Dead Sea."
    - "Eusebius knew a village Louith between Areopolis (Rabbah) and Zoar, which fits a climb from the shore of the Dead Sea up to the Moabite plateau. The map marks first Kathrabba, a village on the western edge of the plateau above the plain at the south-eastern end of the Dead Sea, and as a second guess Medinet er-Ras; neither has produced an inscription with the name. Kathrabba today is a village of the Karak governorate in Jordan, above the steep descent to the Dead Sea."
  ru:
    - "Лухит известен только по одной строке плача о Моаве, общей у Исаии и Иеремии. У Исаии: «бегут из него к Сигору, до третьей Эглы; восходят на Лухит с плачем; по дороге Хоронаимской поднимают страшный крик». У Иеремии: «На восхождении в Лухит плач за плачем поднимается; и на спуске с Оронаима неприятель слышит вопль о разорении». Значит, Лухит стоял наверху подъёма, а Оронаим — на дороге вниз, и оба лежали на пути, которым беглецы Моава бежали к Сигору у южного конца Мёртвого моря."
    - "Евсевий знал селение Луиф между Ареополем (Раббой) и Сигором, что подходит к подъёму от берега Мёртвого моря на Моавитское плато. На карте первой стоит Катрабба, селение на западном краю плато над равниной у юго-восточного края Мёртвого моря, а второй догадкой — Мединет-эр-Рас; ни там, ни там не найдено надписи с этим именем. Катрабба сегодня — селение в иорданской провинции Эль-Карак, над крутым спуском к Мёртвому морю."
  uk:
    - "Лухіт відомий лише з одного рядка плачу над Моавом, спільного для Ісаї та Єремії. Ісая: «виходять, плачучи, на Лухит; по Хоронаїмській дорозї гірко голосять». Єремія: «Від підходячих у гору в Лухит голосний плач роздається, від спускаючихся в низ із Оронаїму зачуває ворог риданнє по спустошенню.» Отже, Лухіт стояв на вершині підйому, а Хоронаїм — на дорозі, що йшла вниз, обидва на шляху, яким біженці Моаву втікали до Сігору на південному краю Мертвого моря."
    - "Євсевій знав село Луїт між Ареополем (Равва) і Сігором, що пасує до підйому від берега Мертвого моря на моавитське плато. Мапа першим позначає Катраббу, село на західному краю плато над рівниною на південно-східному кінці Мертвого моря, а другою здогадкою — Мединет-ер-Рас; жодне не дало напису з цією назвою. Катрабба сьогодні — село мухафази Карак в Йорданії, над крутим спуском до Мертвого моря."
  es:
    - "Luhit se conoce solo por una línea de lamento sobre Moab que Isaías y Jeremías comparten. Isaías: «sus fugitivos huirán hasta Zoar [...] Por la cuesta de Luhith subirán llorando, y levantarán grito de quebrantamiento por el camino de Horonaim». Jeremías: «Porque á la subida de Luhith con lloro subirá el que llora; porque á la bajada de Horonaim los enemigos oyeron clamor de quebranto». Así, Luhit estaba en lo alto de una subida, y Horonaim en un camino que baja, ambos en la ruta por la que huyeron los refugiados de Moab hacia Zoar, en el extremo sur del mar Muerto."
    - "Eusebio conoció una aldea Louith entre Areópolis (Rabá) y Zoar, lo que concuerda con una subida desde la orilla del mar Muerto hasta la meseta de Moab. El mapa marca en primer lugar Kathrabba, una aldea en el borde occidental de la meseta, sobre la llanura del extremo sudeste del mar Muerto, y como segunda conjetura Medinet er-Ras; ninguna ha dado una inscripción con el nombre. Kathrabba es hoy una aldea de la gobernación de Karak, en Jordania, sobre el escarpado descenso al mar Muerto."
  pt:
    - "Luíte é conhecida apenas por uma linha de lamento sobre Moabe que Isaías e Jeremias compartilham. Isaías: “Seus nobres fogem para Zoar … pois sobem pela subida de Luíte com choro; pois no caminho para Horonaim, eles levantam um clamor de destruição.” Jeremias: “Pois pela subida de Luíte eles sobem com choro contínuo. Pois na descida de Horonaim ouviram a angústia do clamor de destruição.” Assim, Luíte ficava no alto de uma subida, com Horonaim numa estrada que desce, ambas no caminho por onde os refugiados de Moabe fugiram para Zoar, no extremo sul do mar Morto."
    - "Eusébio conhecia uma aldeia Louith entre Areópolis (Rabá) e Zoar, o que combina com uma subida da margem do mar Morto até o planalto moabita. O mapa marca em primeiro lugar Kathrabba, uma aldeia na borda ocidental do planalto, acima da planície no extremo sudeste do mar Morto, e como segundo palpite Medinet er-Ras; nenhuma produziu uma inscrição com o nome. Kathrabba é hoje uma aldeia da província de Karak, na Jordânia, acima da descida íngreme ao mar Morto."
  de:
    - "Luhit ist nur aus einer Klagezeile über Moab bekannt, die Jesaja und Jeremia teilen. Jesaja: „seine Flüchtigen fliehen bis gen Zoar … Denn sie gehen gen Luhith hinan und weinen, und auf dem Wege nach Horonaim zu erhebt sich ein Jammergeschrei.“ Jeremia: „denn sie gehen mit Weinen den Weg hinauf gen Luhith, und die Feinde hören ein Jammergeschrei den Weg von Horonaim herab“. Luhit lag also oben auf einem Anstieg, mit Horonajim an einer Straße, die hinabführte, beide auf dem Weg, auf dem die Flüchtlinge Moabs nach Zoar am Südende des Toten Meeres flohen."
    - "Eusebius kannte ein Dorf Louith zwischen Areopolis (Rabba) und Zoar, was zu einem Aufstieg vom Ufer des Toten Meeres auf die moabitische Hochebene passt. Die Karte zeigt zuerst Kathrabba, ein Dorf am Westrand der Hochebene über der Ebene am südöstlichen Ende des Toten Meeres, und als zweite Vermutung Medinet er-Ras; keiner hat eine Inschrift mit dem Namen geliefert. Kathrabba ist heute ein Dorf im Gouvernement Karak in Jordanien, oberhalb des steilen Abstiegs zum Toten Meer."
  fr:
    - "Luchith n’est connue que par un vers de lamentation sur Moab que partagent Ésaïe et Jérémie. Ésaïe : « dont les fugitifs se sauvent jusqu’à Tsoar … car ils font, en pleurant, la montée de Luchith, et ils jettent des cris de détresse sur le chemin de Choronaïm ». Jérémie : « Car on répand des pleurs à la montée de Luchith, et des cris de détresse retentissent à la descente de Choronaïm. » Luchith se tenait donc au sommet d’une montée, avec Choronaïm sur une route qui descend, toutes deux sur le chemin par lequel les réfugiés de Moab fuyaient vers Tsoar, à l’extrémité sud de la mer Morte."
    - "Eusèbe connaissait un village Louith entre Aréopolis (Rabba) et Tsoar, ce qui convient à une montée depuis la rive de la mer Morte vers le plateau moabite. La carte marque en premier Kathrabba, village au bord occidental du plateau, au-dessus de la plaine à l’extrémité sud-est de la mer Morte, et en second choix Medinet er-Ras ; aucun n’a livré d’inscription portant le nom. Kathrabba est aujourd’hui un village du gouvernorat de Karak, en Jordanie, au-dessus de la descente abrupte vers la mer Morte."
scripture:
  - Isa.15.5
  - Jer.48.5
sources:
