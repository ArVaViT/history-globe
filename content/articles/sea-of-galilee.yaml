# Overview article (ADR 0007). Mainstream facts only; the lake's measurements are approximate; the founding date of Tiberias is given as about AD 20.
id: sea-of-galilee
place: a562fcc
title:
  en: "Sea of Galilee"
  ru: "Море Галилейское"
  uk: "Галілейське море"
  es: "Mar de Galilea"
  pt: "Mar da Galileia"
  de: "See Genezareth"
  fr: "Mer de Galilée"
  it: "Lago di Tiberiade"
  pl: "Jezioro Galilejskie"
  cs: "Galilejské jezero"
  nl: "Meer van Galilea"
