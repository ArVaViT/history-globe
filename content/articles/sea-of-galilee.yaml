body:
  en:
    - "The Sea of Galilee is a freshwater lake in the rift valley of the Jordan, about 21 km long and 13 km wide, up to 43 m deep, with its surface some 210 m below sea level, the lowest freshwater lake on earth. The Jordan enters it from the north and leaves it at the south, hot springs rise at Tiberias, and winds off the hills raise sudden storms. The Old Testament calls it the sea of Chinnereth, after a town on its north-western shore, and sets it at the border of the land: “the border shall descend, and shall reach unto the side of the sea of Chinnereth eastward”. The Gospels say sea of Galilee, lake of Gennesaret, and “the sea of Tiberias”, after the city Herod Antipas built about AD 20; Josephus, who measured it at 140 by 40 stadia, praises its sweet, cool water, and in Hebrew it is still the Kinneret."
    - "Jesus, “walking by the sea of Galilee, saw two brethren, Simon called Peter, and Andrew his brother, casting a net into the sea”, and then James and John; he made Capernaum, “upon the sea coast”, his own city and crossed the lake again and again. From a boat he taught the crowds; on it he slept in the storm and, waked, “rebuked the wind, and said unto the sea, Peace, be still”; in the fourth watch of the night he came to the disciples “walking on the sea”. Beyond the lake he fed the five thousand and healed the demoniac of the Gadarenes, and on its shore, after the resurrection, he “shewed himself again to the disciples at the sea of Tiberias” and told them, “Cast the net on the right side of the ship, and ye shall find”."
    - "The lake fed a whole economy. Josephus once gathered the lake's 330 boats at Tarichaeae, usually identified with the Magdala of Mary, and Strabo knew the town for its salted fish; Roman harbours have been traced at Capernaum, Magdala, Kursi and a dozen other points, and in 1986 a drought exposed on the mud at Ginosar a first-century boat, 8.2 m long, now in the kibbutz museum. In Byzantine times churches marked the shore: at Tabgha, with its mosaic of the loaves and fishes, at Capernaum over the house of Peter, and at Kursi."
    - "Today the lake is Israel's chief reservoir: the National Water Carrier has pumped from it since 1964, and its level is reported in the daily news. Tiberias is a resort town, kibbutzim such as Ein Gev and Ginosar farm its shores, pilgrims are baptised at the Jordan outlet, and the Golan Heights, held by Israel since 1967, rise on its eastern side."
  ru:
    - "Море Галилейское — пресное озеро в рифтовой долине Иордана, около 21 км в длину и 13 км в ширину, глубиной до 43 м, с поверхностью примерно на 210 м ниже уровня моря, самое низкое пресное озеро на земле. Иордан входит в него с севера и выходит на юге, у Тивериады бьют горячие источники, а ветры, падающие с гор, поднимают внезапные бури. Ветхий Завет называет его морем Киннереф, по городку на северо-западном берегу, и ставит на границе земли: «пойдет граница и коснется берегов моря Киннереф с восточной стороны». Евангелия говорят о море Галилейском, озере Геннисаретском и «море Тивериадском», по городу, который Ирод Антипа построил около 20 г. н. э.; Иосиф Флавий, намеривший 140 на 40 стадий, хвалит его сладкую и прохладную воду, а по-еврейски оно и сейчас Кинерет."
    - "Иисус «близ моря Галилейского» увидел «двух братьев: Симона, называемого Петром, и Андрея, брата его, закидывающих сети в море», а затем Иакова и Иоанна; Он поселился «в Капернауме приморском», сделав его Своим городом, и снова и снова переправлялся через озеро. Из лодки Он учил народ; в ней спал во время бури и, разбуженный, «запретил ветру и сказал морю: умолкни, перестань»; в четвёртую стражу ночи пришёл к ученикам, «идя по морю». За озером Он накормил пять тысяч и исцелил бесноватого из страны Гадаринской, а на его берегу после воскресения «опять явился ученикам Своим при море Тивериадском» и сказал: «закиньте сети по правую сторону лодки, и поймаете»."
    - "Озеро кормило целое хозяйство. Иосиф Флавий однажды собрал у Тарихеи, которую обычно отождествляют с Магдалой Марии, все лодки озера — 330, а Страбон знал этот город по солёной рыбе; гавани и молы римского времени прослежены у Капернаума, Магдалы, Курси и ещё в дюжине мест, а в 1986 году засуха обнажила на иле у Гиносара лодку I века длиной 8,2 м, ныне в музее кибуца. В византийское время берег отметили церкви: в Табхе с мозаикой хлебов и рыб, в Капернауме над домом Петра и в Курси."
    - "Сегодня озеро — главное водохранилище Израиля: Всеизраильский водовод качает из него с 1964 года, а его уровень сообщают в ежедневных новостях. Тверия — курортный город, кибуцы вроде Эйн-Гева и Гиносара возделывают его берега, паломники крестятся у истока Иордана, а на восточной стороне поднимаются Голанские высоты, удерживаемые Израилем с 1967 года."
  uk:
    - "Галілейське море — прісноводне озеро в рифтовій долині Йордану, завдовжки близько 21 км і завширшки 13 км, завглибшки до 43 м, з поверхнею приблизно на 210 м нижче рівня моря, найнижче прісноводне озеро на землі. Йордан входить до нього з півночі й виходить на півдні, гарячі джерела б'ють у Тіверіаді, а вітри з пагорбів здіймають раптові бурі. Старий Заповіт називає його морем Кіннерет, за містом на його північно-західному березі, і ставить його на межі краю: «спуститься дальше гряниця та й торкнеться о беріг Кінерет озера од сходу». Євангелії кажуть: Галілейське море, озеро Генісарет і Тіверіадське море, за містом, яке Ірод Антипа збудував близько 20 р. н. е.; Йосиф Флавій, що виміряв його у 140 на 40 стадій, хвалить його солодку прохолодну воду, а івритом воно й досі Кінерет."
    - "Ісус, ідучи попри Галілейське море, «побачив двох братів, Симона, званого Петром, та Андрея, брата його, що закидали невід у море», а потім Якова й Івана; Капернаум, що «при морю», він зробив своїм містом і не раз перепливав озеро. З човна він навчав натовпи; у ньому спав під час бурі і, збуджений, «погрозив вітрові, і рече до моря: Мовчи, перестань!»; у четверту сторожу ночі він прийшов до учнів, «ідучи по морю». За озером він нагодував п'ять тисяч і сцілив біснуватого з Гадари, а на його березі, після воскресіння, «явив ся знов Ісус ученикам на морі Тивериядському» й сказав їм: «Закиньте невода з правого боку човна, то й знайдете»."
    - "Озеро годувало цілу економіку. Йосиф Флавій зібрав колись 330 озерних човнів у Тарихеях, які зазвичай ототожнюють із Магдалою Марії, а Страбон знав це місто завдяки солоній рибі; римські гавані простежено в Капернаумі, Магдалі, Курсі та ще в десятку місць, а в 1986 р. посуха оголила на мулі в Гінносарі човен I ст. завдовжки 8,2 м, нині в музеї кібуца. За візантійських часів церкви позначали берег: у Табхі, з мозаїкою про хліби й риби, у Капернаумі над домом Петра і в Курсі."
    - "Нині озеро є головним водосховищем Ізраїля: з 1964 р. з нього качає Національний водогін, а його рівень повідомляють у щоденних новинах. Тіверіада — курортне місто, кібуци на кшталт Ейн-Гева й Гінносара обробляють його береги, паломники хрестяться на виході Йордану, а Голанські висоти, якими Ізраїль володіє з 1967 р., здіймаються на його східному боці."
  es:
    - "El mar de Galilea es un lago de agua dulce en el valle de la falla del Jordán, de unos 21 km de largo y 13 km de ancho, de hasta 43 m de profundidad, con su superficie a unos 210 m bajo el nivel del mar, el lago de agua dulce más bajo de la Tierra. El Jordán entra en él por el norte y sale por el sur, brotan aguas termales en Tiberias, y los vientos de las colinas levantan tormentas repentinas. El Antiguo Testamento lo llama el mar de Cineret, por una ciudad de su orilla noroccidental, y lo sitúa en el límite del país: «descenderá el término, y llegará á la costa de la mar de Cinnereth al oriente». Los Evangelios dicen mar de Galilea, lago de Genesaret y «la mar de Tiberias», por la ciudad que Herodes Antipas construyó hacia el 20 d. C.; Josefo, que lo midió en 140 por 40 estadios, alaba su agua dulce y fresca, y en hebreo sigue siendo el Kinneret."
    - "«Andando Jesús junto á la mar de Galilea, vió á dos hermanos, Simón, que es llamado Pedro, y Andrés su hermano, que echaban la red en la mar», y luego a Jacobo y Juan; hizo de Cafarnaúm, «ciudad marítima», su propia ciudad y cruzó el lago una y otra vez. Desde una barca enseñó a las multitudes; en ella durmió en la tormenta y, despertado, «increpó al viento, y dijo á la mar: Calla, enmudece»; en la cuarta vela de la noche llegó a los discípulos «andando sobre la mar». Al otro lado del lago alimentó a los cinco mil y sanó al endemoniado de los gadarenos, y en su orilla, tras la resurrección, «se manifestó Jesús otra vez á sus discípulos en la mar de Tiberias» y les dijo: «Echad la red á la mano derecha del barco, y hallaréis»."
    - "El lago sostenía toda una economía. Josefo reunió una vez las 330 barcas del lago en Tariquea, que suele identificarse con la Magdala de María, y Estrabón conocía la ciudad por su pescado en salazón; se han hallado puertos romanos en Cafarnaúm, Magdala, Kursi y una docena de puntos más, y en 1986 una sequía dejó al descubierto en el fango de Ginosar una barca del siglo I, de 8,2 m de longitud, hoy en el museo del kibutz. En época bizantina había iglesias que marcaban la orilla: en Tabgha, con su mosaico de los panes y los peces, en Cafarnaúm sobre la casa de Pedro, y en Kursi."
    - "Hoy el lago es el principal embalse de Israel: el Acueducto Nacional bombea de él desde 1964, y su nivel se informa en las noticias diarias. Tiberias es una ciudad turística, kibutzim como Ein Gev y Ginosar cultivan sus orillas, los peregrinos se bautizan en la salida del Jordán, y los Altos del Golán, en poder de Israel desde 1967, se alzan en su lado oriental."
  pt:
    - "O Mar da Galileia é um lago de água doce no vale do rifte do Jordão, com cerca de 21 km de comprimento e 13 km de largura, até 43 m de profundidade e a superfície a cerca de 210 m abaixo do nível do mar, o lago de água doce mais baixo da Terra. O Jordão entra nele pelo norte e sai pelo sul, fontes quentes brotam em Tiberíades, e ventos das colinas levantam tempestades repentinas. O Antigo Testamento o chama mar de Quinerete, por uma cidade em sua margem noroeste, e o põe na fronteira da terra: “A fronteira descerá, e chegará à margem do mar de Quinerete, para o leste”. Os Evangelhos dizem mar da Galileia, lago de Genesaré e “mar de Tiberíades”, pela cidade que Herodes Antipas construiu por volta de 20 d.C.; Josefo, que o mediu em 140 por 40 estádios, louva sua água doce e fresca, e em hebraico ainda é o Kineret."
    - "Jesus, “andando à beira do mar da Galileia, viu dois irmãos: Simão, chamado Pedro, e André, seu irmão, lançando uma rede ao mar”, e depois Tiago e João; fez de Cafarnaum, “que fica à beira-mar”, sua cidade e atravessou o lago repetidas vezes. De um barco ensinou as multidões; nele dormiu na tempestade e, acordado, “repreendeu o vento e disse ao mar: ‘Paz! Aquiete-se!’”; na quarta vigília da noite foi aos discípulos “andando sobre o mar”. Além do lago alimentou os cinco mil e curou o endemoninhado dos gadarenos, e em sua margem, depois da ressurreição, “se manifestou novamente aos discípulos junto ao mar de Tiberíades” e lhes disse: “Lancem a rede do lado direito do barco, e vocês encontrarão”."
    - "O lago sustentava toda uma economia. Josefo reuniu certa vez os 330 barcos do lago em Tariqueia, geralmente identificada com a Magdala de Maria, e Estrabão conhecia a cidade por seus peixes salgados; portos romanos foram identificados em Cafarnaum, Magdala, Kursi e uma dúzia de outros pontos, e em 1986 uma seca expôs na lama de Ginosar um barco do século I, com 8,2 m de comprimento, hoje no museu do kibutz. Na época bizantina igrejas marcaram a margem: em Tabgha, com seu mosaico dos pães e peixes, em Cafarnaum sobre a casa de Pedro, e em Kursi."
    - "Hoje o lago é o principal reservatório de Israel: o Aqueduto Nacional bombeia dele desde 1964, e seu nível é noticiado diariamente. Tiberíades é uma estância turística, kibutzim como Ein Gev e Ginosar cultivam suas margens, peregrinos são batizados na saída do Jordão, e as Colinas de Golã, mantidas por Israel desde 1967, se erguem em seu lado leste."
  de:
    - "Der See Genezareth ist ein Süßwassersee im Grabenbruch des Jordan, etwa 21 km lang und 13 km breit, bis zu 43 m tief, mit einer Oberfläche etwa 210 m unter dem Meeresspiegel, der tiefstgelegene Süßwassersee der Erde. Der Jordan tritt von Norden ein und verlässt ihn im Süden, bei Tiberias steigen heiße Quellen auf, und Winde von den Hügeln erzeugen plötzliche Stürme. Das Alte Testament nennt ihn das Meer Kinneret, nach einer Stadt an seinem Nordwestufer, und setzt ihn an die Grenze des Landes: „darnach gehe sie herab und lenke sich an die Seite des Meers Kinneret gegen Morgen“. Die Evangelien sagen Galiläisches Meer, See Genezareth und Meer von Tiberias, nach der Stadt, die Herodes Antipas um 20 n. Chr. baute; Josephus, der ihn mit 140 mal 40 Stadien maß, preist sein süßes, kühles Wasser, und auf Hebräisch heißt er noch immer der Kinneret."
    - "Als Jesus „an dem Galiläischen Meer ging, sah er zwei Brüder, Simon, der da heißt Petrus, und Andreas, seinen Bruder, die warfen ihre Netze ins Meer“, und dann Jakobus und Johannes; er machte Kapernaum, „das da liegt am Meer“, zu seiner Stadt und überquerte den See immer wieder. Vom Boot lehrte er die Menge; darauf schlief er im Sturm und „bedrohte den Wind und sprach zu dem Meer: Schweig und verstumme!“; in der vierten Nachtwache kam er zu den Jüngern und „ging auf dem Meer“. Jenseits des Sees speiste er die Fünftausend und heilte den Besessenen der Gadarener, und an seinem Ufer offenbarte er sich nach der Auferstehung den Jüngern am Meer bei Tiberias und sagte ihnen: „Werfet das Netz zur Rechten des Schiffs, so werdet ihr finden.“"
    - "Der See ernährte eine ganze Wirtschaft. Josephus versammelte einmal die 330 Boote des Sees in Tarichaeae, das meist mit dem Magdala der Maria gleichgesetzt wird, und Strabon kannte die Stadt für ihre gesalzenen Fische; römische Häfen wurden in Kapernaum, Magdala, Kursi und einem Dutzend anderer Orte nachgewiesen, und 1986 legte eine Dürre bei Ginnosar im Schlamm ein 8,2 m langes Boot des 1. Jahrhunderts frei, heute im Museum des Kibbuz. In byzantinischer Zeit markierten Kirchen das Ufer: in Tabgha mit seinem Mosaik von Broten und Fischen, in Kapernaum über dem Haus des Petrus und in Kursi."
    - "Heute ist der See Israels wichtigstes Reservoir: Der Nationale Wasserträger pumpt seit 1964 daraus, und sein Pegel wird in den Tagesnachrichten gemeldet. Tiberias ist ein Kurort, Kibbuzim wie Ein Gev und Ginnosar bewirtschaften seine Ufer, Pilger werden am Ausfluss des Jordan getauft, und die seit 1967 von Israel gehaltenen Golanhöhen erheben sich an seiner Ostseite."
  fr:
    - "La mer de Galilée est un lac d’eau douce de la vallée du rift du Jourdain, long d’environ 21 km et large de 13 km, profond jusqu’à 43 m, sa surface à quelque 210 m sous le niveau de la mer, le plus bas lac d’eau douce du monde. Le Jourdain y entre par le nord et en sort au sud, des sources chaudes jaillissent à Tibériade, et des vents descendus des collines lèvent de soudaines tempêtes. L’Ancien Testament l’appelle mer de Kinnéreth, d’après une ville de sa rive nord-ouest, et la met à la frontière du pays : « elle descendra, et s’étendra le long de la mer de Kinnéreth, à l’orient ». Les Évangiles disent mer de Galilée, lac de Génésareth et « la mer de Tibériade », d’après la ville qu’Hérode Antipas bâtit vers 20 apr. J.-C. ; Flavius Josèphe, qui la mesura à 140 sur 40 stades, loue son eau douce et fraîche, et en hébreu elle est encore le Kinneret."
    - "Jésus, « comme il marchait le long de la mer de Galilée, vit deux frères, Simon, appelé Pierre, et André, son frère, qui jetaient un filet dans la mer », puis Jacques et Jean ; il fit de Capernaüm, « située près de la mer », sa propre ville et traversa le lac maintes fois. D’une barque il enseigna les foules ; sur l’une d’elles il dormit dans la tempête et, réveillé, « menaça le vent, et dit à la mer : Silence ! Tais-toi ! » ; à la quatrième veille de la nuit, il vint vers les disciples « marchant sur la mer ». Au-delà du lac, il nourrit les cinq mille et guérit le démoniaque des Gadaréniens, et sur son rivage, après la résurrection, il « se montra encore aux disciples, sur les bords de la mer de Tibériade » et leur dit : « Jetez le filet du côté droit de la barque, et vous trouverez »."
    - "Le lac nourrissait toute une économie. Flavius Josèphe rassembla un jour à Tarichées, qu’on identifie d’ordinaire à la Magdala de Marie, les 330 barques du lac, et Strabon connaissait la ville pour son poisson salé ; des ports romains ont été relevés à Capernaüm, Magdala, Kursi et une douzaine d’autres points, et en 1986 une sécheresse a dégagé dans la vase de Ginosar une barque du Ier siècle, longue de 8,2 m, aujourd’hui au musée du kibboutz. À l’époque byzantine, des églises jalonnaient le rivage : à Tabgha, avec sa mosaïque des pains et des poissons, à Capernaüm au-dessus de la maison de Pierre, et à Kursi."
    - "Aujourd’hui, le lac est le principal réservoir d’Israël : la Conduite nationale d’eau y pompe depuis 1964, et son niveau est donné aux informations quotidiennes. Tibériade est une ville de villégiature, des kibboutz comme Ein Gev et Ginosar cultivent ses rives, des pèlerins sont baptisés à la sortie du Jourdain, et le plateau du Golan, tenu par Israël depuis 1967, s’élève sur sa rive orientale."
  it:
    - "Il Lago di Tiberiade è un lago d’acqua dolce nella valle della spaccatura del Giordano, lungo circa 21 km e largo 13 km, profondo fino a 43 m, con la superficie a circa 210 m sotto il livello del mare, il lago d’acqua dolce più basso della terra. Il Giordano vi entra da nord e ne esce a sud, sorgenti calde sgorgano a Tiberiade e i venti dalle colline sollevano tempeste improvvise. L’Antico Testamento lo chiama mare di Chinnerèt, da una città sulla sua riva nord-occidentale, e lo pone al confine del paese: «la frontiera scenderà, e si estenderà lungo il mare di Kinnereth, a oriente». I Vangeli dicono mar di Galilea, lago di Gennesaret e «mar di Tiberiade», dalla città che Erode Antipa costruì verso il 20 d.C.; Giuseppe Flavio, che lo misurò in 140 per 40 stadi, ne loda l’acqua dolce e fresca, e in ebraico è ancora il Kinneret."
    - "Gesù, «passeggiando lungo il mare della Galilea, egli vide due fratelli, Simone detto Pietro, e Andrea suo fratello, i quali gettavano la rete in mare», e poi Giacomo e Giovanni; fece di Cafarnao, «città sul mare», la sua città e attraversò il lago più volte. Da una barca insegnò alle folle; su di essa dormì durante la tempesta e, destato, «sgridò il vento e disse al mare: Taci, calmati!»; alla quarta vigilia della notte andò dai discepoli «camminando sul mare». Oltre il lago sfamò i cinquemila e guarì l’indemoniato dei Gadareni, e sulla sua riva, dopo la risurrezione, «si fece veder di nuovo ai discepoli presso il mar di Tiberiade» e disse loro: «Gettate la rete dal lato destro della barca, e ne troverete»."
    - "Il lago alimentava un’intera economia. Giuseppe Flavio radunò una volta le 330 barche del lago a Tarichee, di solito identificata con la Magdala di Maria, e Strabone conosceva la città per il pesce salato; porti romani sono stati individuati a Cafarnao, Magdala, Kursi e una dozzina di altri punti, e nel 1986 una siccità mise in luce nel fango a Ginosar una barca del I secolo, lunga 8,2 m, ora nel museo del kibbutz. In epoca bizantina chiese segnavano la riva: a Tabgha, con il suo mosaico dei pani e dei pesci, a Cafarnao sopra la casa di Pietro, e a Kursi."
    - "Oggi il lago è il principale serbatoio di Israele: il National Water Carrier vi attinge dal 1964, e il suo livello è riportato nelle notizie quotidiane. Tiberiade è una località di villeggiatura, kibbutz come Ein Gev e Ginosar coltivano le sue rive, i pellegrini si battezzano all’uscita del Giordano, e le alture del Golan, tenute da Israele dal 1967, si ergono sul suo lato orientale."
  pl:
    - "Jezioro Galilejskie to słodkowodne jezioro w rowie tektonicznym Jordanu, długie na około 21 km i szerokie na 13 km, głębokie do 43 m, z powierzchnią około 210 m poniżej poziomu morza, najniżej położone jezioro słodkowodne na ziemi. Jordan wpływa do niego od północy i wypływa na południu, w Tyberiadzie biją gorące źródła, a wiatry ze wzgórz wzbudzają nagłe burze. Stary Testament nazywa je morzem Kinneret, od miasta na jego północno-zachodnim brzegu, i umieszcza na granicy kraju: „uda się ta granica i dojdzie do brzegu morza Cyneret na wschód słońca”. Ewangelie mówią o morzu Galilejskim, jeziorze Genezaret i morzu Tyberiadzkim, od miasta, które Herod Antypas zbudował około 20 roku n.e.; Józef Flawiusz, który zmierzył je na 140 na 40 stadiów, chwali jego słodką, chłodną wodę, a po hebrajsku nadal nazywa się Kineret."
    - "Jezus, gdy „chodził nad morzem Galilejskiem, ujrzał dwóch braci: Szymona, którego zowią Piotrem, i Andrzeja, brata jego, którzy zapuszczali sieć w morze”, a potem Jakuba i Jana; uczynił Kafarnaum, „które jest nad morzem”, swoim miastem i raz po raz przeprawiał się przez jezioro. Z łodzi nauczał tłumy; w niej spał w burzy i obudzony „zgromił wiatr, i rzekł morzu: Umilknij, a uśmierz się”; o czwartej straży nocnej przyszedł do uczniów „chodząc po morzu”. Za jeziorem nakarmił pięć tysięcy i uzdrowił opętanego z kraju Gadareńczyków, a na jego brzegu, po zmartwychwstaniu, „się zaś ukazał Jezus uczniom u morza Tyberyjadzkiego” i powiedział im: „Zapuśćcie sieć po prawej stronie łodzi, a znajdziecie”."
    - "Jezioro karmiło całą gospodarkę. Józef Flawiusz zebrał kiedyś 330 łodzi jeziora w Tarichei, zwykle utożsamianej z Magdalą Marii, a Strabon znał miasto z solonych ryb; rzymskie porty wytropiono w Kafarnaum, Magdali, Kursi i tuzinie innych punktów, a w 1986 roku susza odsłoniła w mule w Ginosar łódź z I wieku, długą na 8,2 m, dziś w muzeum kibucu. W okresie bizantyńskim kościoły wyznaczały brzeg: w Tabdze, z mozaiką chlebów i ryb, w Kafarnaum nad domem Piotra i w Kursi."
    - "Dziś jezioro jest głównym zbiornikiem Izraela: Krajowy Wodociąg pompuje z niego od 1964 roku, a jego poziom podaje się w codziennych wiadomościach. Tyberiada jest miastem wypoczynkowym, kibuce takie jak Ein Gew i Ginosar uprawiają jego brzegi, pielgrzymi przyjmują chrzest przy wypływie Jordanu, a Wzgórza Golan, posiadane przez Izrael od 1967 roku, wznoszą się po jego wschodniej stronie."
  cs:
    - "Galilejské jezero je sladkovodní jezero v riftovém údolí Jordánu, asi 21 km dlouhé a 13 km široké, až 43 m hluboké, s hladinou asi 210 m pod úrovní moře, nejníže položené sladkovodní jezero na zemi. Jordán do něj vtéká ze severa a vytéká na jihu, u Tiberiady vyvěrají horké prameny a větry z pahorků vzbuzují náhlé bouře. Starý zákon je nazývá mořem Kineret podle města na jeho severozápadním břehu a klade je na hranici země: „schýlí se pomezí to, a přijde k straně moře Ceneret k východu“. Evangelia říkají Galilejské moře, Genezaretské jezero a moře „Tiberiadské“, podle města, které Herodes Antipas vystavěl asi roku 20 n. l.; Josephus, který je změřil na 140 na 40 stadií, chválí jeho sladkou, chladnou vodu a hebrejsky je dosud Kineret."
    - "Ježíš, „chodě podle moře Galilejského, uzřel dva bratry, Šimona, kterýž slove Petr, a Ondřeje bratra jeho, ani pouštějí sít do moře“, a pak Jakuba a Jana; učinil svým městem Kafarnaum, o němž se praví, že tam „bydlil v Kafarnaum za mořem“, a opakovaně jezero přeplouval. Z lodi učil zástupy; na ní spal za bouře a probuzen „přimluvil větru a řekl moři: Umlkni a upokoj se“; při čtvrtém bdění nočním přišel k učedníkům „jda po moři“. Za jezerem nasytil pět tisíc a uzdravil posedlého v zemi Gadarských a na jeho břehu se po vzkříšení „opět zjevil ... učedlníkům u moře Tiberiadského“ a řekl jim: „Zavrztež sít na pravou stranu lodí, a naleznete.“"
    - "Jezero živilo celé hospodářství. Josephus kdysi shromáždil 330 lodí jezera v Tarichejích, obvykle ztotožňovaných s Magdalou Marie, a Strabón znal město pro jeho solené ryby; římské přístavy byly vystopovány v Kafarnaum, Magdale, Kursi a tuctu dalších míst a roku 1986 odkrylo sucho v blátě u Ginosaru loď z 1. století, dlouhou 8,2 m, nyní v muzeu kibucu. V byzantské době značily břeh kostely: v Tabze, s mozaikou o chlebech a rybách, v Kafarnaum nad domem Petrovým a v Kursi."
    - "Dnes je jezero hlavní izraelskou nádrží: Národní vodovod z něj čerpá od roku 1964 a jeho hladina je hlášena v denních zprávách. Tiberias je lázeňské město, kibucy jako Ejn Gev a Ginosar obdělávají jeho břehy, poutníci se křtí u výtoku Jordánu a Golanské výšiny, držené Izraelem od roku 1967, se zvedají na jeho východní straně."
  nl:
    - "Het Meer van Galilea is een zoetwatermeer in de slenk van de Jordaan, zo’n 21 km lang en 13 km breed, tot 43 m diep, met zijn oppervlak ongeveer 210 m onder zeeniveau, het laagste zoetwatermeer ter wereld. De Jordaan stroomt het in vanuit het noorden en verlaat het in het zuiden, bij Tiberias komen warme bronnen op, en winden van de heuvels veroorzaken plotselinge stormen. Het Oude Testament noemt het de zee van Kinneret, naar een stad aan de noordwestoever, en plaatst het op de grens van het land: “daarna zal deze landpale afgaan en strekken langs den oever van de zee Cinnereth oostwaarts”. De evangeliën zeggen zee van Galilea, meer van Gennesaret en “de zee van Tiberias”, naar de stad die Herodes Antipas omstreeks 20 n.Chr. bouwde; Josephus, die het op 140 bij 40 stadiën mat, prijst het zoete, koele water, en in het Hebreeuws is het nog steeds de Kinneret."
    - "Jezus, “wandelende aan de zee van Galilea, zag twee broeders, namelijk Simon, gezegd Petrus, en Andreas, zijn broeder, het net in de zee werpende”, en daarna Jakobus en Johannes; hij maakte Kafarnaüm, “gelegen aan de zee”, tot zijn eigen stad en stak het meer telkens weer over. Vanuit een boot onderwees hij de scharen; erop sliep hij in de storm en, “opgewekt zijnde, bestrafte den wind, en zeide tot de zee: Zwijg, wees stil!”; in de vierde nachtwake kwam hij tot de discipelen “wandelende op de zee”. Aan de overkant voedde hij de vijfduizend en genas de bezetene van de Gadarenen, en aan de oever “openbaarde Jezus Zichzelven wederom den discipelen aan de zee van Tiberias” na de opstanding, en hij zei: “Werpt het net aan de rechterzijde van het schip, en gij zult vinden”."
    - "Het meer voedde een hele economie. Josephus verzamelde eens de 330 boten van het meer bij Tarichea, gewoonlijk vereenzelvigd met het Magdala van Maria, en Strabo kende de stad om haar gezouten vis; Romeinse havens zijn gevonden bij Kafarnaüm, Magdala, Kursi en een dozijn andere punten, en in 1986 legde een droogte bij Ginosar in de modder een boot uit de 1e eeuw bloot, 8,2 m lang, nu in het museum van de kibboets. In de Byzantijnse tijd markeerden kerken de oever: te Tabgha, met zijn mozaïek van de broden en vissen, te Kafarnaüm boven het huis van Petrus, en te Kursi."
    - "Tegenwoordig is het meer Israëls voornaamste reservoir: de Nationale Waterleiding pompt er sinds 1964 uit, en zijn peil wordt in het dagelijkse nieuws gemeld. Tiberias is een badplaats, kibboetsen als Ein Gev en Ginosar bewerken zijn oevers, pelgrims worden gedoopt bij de uitstroom van de Jordaan, en de Golanhoogte, sinds 1967 door Israël bezet, rijst aan de oostkant op."
  sv:
    - "Galileiska sjön är en sötvattensjö i Jordans riftdal, omkring 21 km lång och 13 km bred, upp till 43 m djup, med ytan cirka 210 m under havsytan, den lägsta sötvattensjön på jorden. Jordan rinner in i den från norr och ut ur den i söder, varma källor väller upp vid Tiberias, och vindar från bergen väcker plötsliga stormar. Gamla testamentet kallar den Kinneretsjön, efter en stad på dess nordvästra strand, och sätter den vid landets gräns: ”gränsen skall gå vidare ned och intill bergsluttningen vid Kinneretsjön, österut”. Evangelierna säger Galileiska sjön, Gennesarets sjö och ”Tiberias' sjö”, efter staden Herodes Antipas byggde omkring år 20 e.Kr.; Josefus, som mätte den till 140 gånger 40 stadier, prisar dess söta, svala vatten, och på hebreiska heter den ännu Kinneret."
    - "Det heter om Jesus: ”Då han nu vandrade utmed Galileiska sjön, fick han se två bröder, Simon, som kallas Petrus, och Andreas, hans broder, kasta ut nät i sjön”, och sedan Jakob och Johannes; han gjorde Kafarnaum, som ”ligger vid sjön”, till sin egen stad och korsade sjön gång på gång. Från en båt undervisade han folket; på den sov han i stormen och, väckt, ”näpste han vinden och sade till sjön: ’Tig, var stilla.’”; under fjärde nattväkten kom han till lärjungarna ”gående fram över sjön”. Bortom sjön gav han mat åt de fem tusen och botade den besatte hos gadarenerna, och vid dess strand, efter uppståndelsen, ”uppenbarade sig Jesus åter för lärjungarna, vid Tiberias' sjö” och sade till dem: ”Kasten ut nätet på högra sidan om båten, så skolen I få.”"
    - "Sjön födde en hel ekonomi. Josefus samlade en gång sjöns 330 båtar vid Tarichaiai, vanligen identifierat med Marias Magdala, och Strabon kände staden för dess saltade fisk; romerska hamnar har spårats vid Kafarnaum, Magdala, Kursi och ett dussin andra punkter, och 1986 blottade en torka i leran vid Ginosar en båt från första århundradet, 8,2 m lång, nu i kibbutzens museum. Under bysantinsk tid markerade kyrkor stranden: vid Tabgha, med sin mosaik av bröden och fiskarna, vid Kafarnaum över Petrus hus och vid Kursi."
    - "I dag är sjön Israels främsta vattenreservoar: Nationella vattenledningen har pumpat från den sedan 1964, och dess nivå rapporteras i dagens nyheter. Tiberias är en kurort, kibbutzer som Ein Gev och Ginosar brukar dess stränder, pilgrimer döps vid Jordans utlopp, och Golanhöjderna, som Israel hållit sedan 1967, reser sig på dess östra sida."
  nb:
    - "Galileasjøen er en ferskvannsinnsjø i riftdalen til Jordan, omtrent 21 km lang og 13 km bred, opptil 43 m dyp, med overflaten omkring 210 m under havnivå, den laveste ferskvannsinnsjøen på jorden. Jordan kommer inn i den fra nord og går ut i sør, varme kilder stiger ved Tiberias, og vinder fra åsene reiser plutselige stormer. Det gamle testamente kaller den Kinnerets sjø, etter en by på den nordvestlige stranden, og setter den ved landets grense: grensen skal «gå videre ned til den når fjellskråningen østenfor Kinnerets sjø». Evangeliene sier Galileasjøen, Gennesaret-sjøen og «Tiberias-sjøen», etter byen Herodes Antipas bygde omkring 20 e.Kr.; Josefus, som målte den til 140 ganger 40 stadier, priser det søte, kjølige vannet, og på hebraisk heter den fortsatt Kinneret."
    - "Jesus, «da han vandret ved den Galileiske Sjø, så han to brødre, Simon, som kalles Peter, og hans bror Andreas, i ferd med å kaste garn i sjøen», og så Jakob og Johannes; han gjorde Kapernaum, «ved sjøen», til sin egen by og krysset innsjøen igjen og igjen. Fra en båt lærte han folkemengdene; i den sov han i stormen og «truet vinden, og til sjøen sa han: Ti, vær stille!»; i nattens fjerde vakt kom han til disiplene «vandrende på sjøen». Bortenfor innsjøen mettet han de fem tusen og helbredet den besatte fra gadarenernes land, og ved stranden «åpenbarte Jesus sig atter for disiplene ved Tiberias-sjøen» etter oppstandelsen og sa til dem: «Kast garnet på den høire side av båten, så skal I få!»"
    - "Innsjøen næret en hel økonomi. Josefus samlet en gang innsjøens 330 båter ved Tarichaiai, vanligvis identifisert med Marias Magdala, og Strabon kjente byen for saltet fisk; romerske havner er påvist ved Kapernaum, Magdala, Kursi og et dusin andre steder, og i 1986 blottla en tørke i gjørma ved Ginosar en båt fra 1. århundre, 8,2 m lang, nå i kibbutzens museum. I bysantinsk tid markerte kirker stranden: i Tabgha, med mosaikken av brødene og fiskene, i Kapernaum over Peters hus, og ved Kursi."
    - "I dag er innsjøen Israels viktigste reservoar: National Water Carrier har pumpet fra den siden 1964, og vannstanden rapporteres i de daglige nyhetene. Tiberias er en kurby, kibbutzer som Ein Gev og Ginosar dyrker strendene, pilegrimer døpes ved Jordans utløp, og Golanhøydene, holdt av Israel siden 1967, reiser seg på østsiden."
  tl:
    - "Ang Dagat ng Galilea ay lawang tubig-tabang sa libis na lamat ng Jordan, mga 21 km ang haba, 13 km ang lapad, hanggang 43 m ang lalim, ang ibabaw ay mga 210 m sa ibaba ng lebel ng dagat, pinakamababang lawang tubig-tabang sa daigdig. Pumapasok dito ang Jordan mula hilaga at lumalabas sa timog, may mainit na bukal sa Tiberias, at nagdudulot ng biglaang bagyo ang hangin mula sa burol. Tinatawag ito ng Lumang Tipan na dagat ng Cinereth, ayon sa bayan sa hilagang-kanlurang baybayin, at inilalagay sa hangganan: “ang hangganan ay pababa at abot hanggang sa gilid ng dagat ng Cinnereth sa dakong silanganan”. Dagat ng Galilea, lawa ng Genezaret at “dagat ng Tiberias” ang sabi ng mga Ebanghelyo, ayon sa lungsod na itinayo ni Herodes Antipas mga AD 20; pinupuri ni Josefo, na sumukat dito ng 140 sa 40 stadia, ang matamis at malamig nitong tubig, at Kinneret pa rin ito sa Hebreo."
    - "Si Jesus, “sa paglalakad niya sa tabi ng dagat ng Galilea; ay nakita niya ang dalawang magkapatid, si Simon na tinatawag na Pedro, at si Andres na kaniyang kapatid, na inihuhulog ang isang lambat sa dagat”, at pagkatapos ay sina Santiago at Juan; ginawa niyang sarili niyang lungsod ang Capernaum, “na nasa tabi ng dagat”, at paulit-ulit tumawid sa lawa. Nagturo siya sa mga tao mula sa bangka; natulog sa bagyo at, paggising, “sinaway ang hangin, at sinabi sa dagat, Pumayapa, tumahimik ka”; sa ikaapat na pagpupuyat ng gabi ay lumapit sa mga alagad na “lumalakad sa ibabaw ng dagat”. Sa kabila ng lawa ay pinakain niya ang 5,000 at pinagaling ang inaalihan ng demonyo ng mga Gadareno, at sa baybayin nito, pagkabuhay na muli, “napakitang muli ... sa mga alagad sa tabi ng dagat ng Tiberias” at sinabi, “Ihulog ninyo ang lambat sa dakong kanan ng daong, at makakasumpong kayo”."
    - "Pinakain ng lawa ang buong ekonomiya. Minsang tinipon ni Josephus ang 330 bangka ng lawa sa Tarichaeae, na karaniwang kinikilala sa Magdala ni Maria, at kilala ni Strabo ang bayan dahil sa maaalat na isda; natunton ang mga daungang Romano sa Capernaum, Magdala, Kursi at isang dosenang iba pang punto, at noong 1986, isang tagtuyot ang naglantad sa putik sa Ginosar ng bangkang ika-1 siglo, 8.2 m ang haba, na nasa museo ng kibbutz ngayon. Noong panahong Bisantino, minarkahan ng mga simbahan ang baybayin: sa Tabgha, na may mosaiko ng mga tinapay at isda, sa Capernaum sa ibabaw ng bahay ni Pedro, at sa Kursi."
    - "Ngayon ang lawa ang pangunahing imbakan ng Israel: nagbobomba mula rito ang National Water Carrier mula 1964, at iniuulat ang lebel nito sa pang-araw-araw na balita. Ang Tiberias ay bayang pahingahan, sinasaka ng mga kibbutz tulad ng Ein Gev at Ginosar ang mga baybayin nito, binabautismuhan ang mga peregrino sa labasan ng Jordan, at umaangat sa silangang bahagi ang Golan Heights, hawak ng Israel mula 1967."
