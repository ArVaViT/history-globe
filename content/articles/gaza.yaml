body:
  en:
    - "Gaza lay on the southern coastal plain, a little inland from the sea, the last town on the road from Egypt before the Sinai desert; its old mound lies under the modern city, and its harbour was later called Maiuma. In the fifteenth century BC Thutmose III halted at Gaza on his march to Megiddo, and under the New Kingdom it was a chief seat of Egyptian rule in Canaan. In the twelfth century BC the Philistines settled here, and Gaza became one of their five cities."
    - "Genesis names Gaza at the edge of the land of Canaan. Samson carried off the doors of its gate; later the Philistines blinded him and set him to grind in the prison house at Gaza, and he pulled down the house where their lords had gathered. Hezekiah struck the Philistines as far as Gaza, and Amos foretold fire on its walls. In 734 BC Tiglath-pileser III of Assyria took the city, and its king Hanunu fled to Egypt; in 720 BC Sargon II defeated Hanunu at Raphia and took him captive."
    - "In 332 BC Alexander the Great took Gaza by storm after a siege of two months; its defenders fell fighting, and the women and children were sold as slaves. About 96 BC the Hasmonean king Alexander Jannaeus took the city after a year's siege and, according to Josephus, destroyed it. Pompey freed Gaza from Jewish rule in 63 BC, and Gabinius, the Roman governor of Syria, had it rebuilt about 57 BC. Augustus gave it to Herod, but after Herod's death in 4 BC it was attached to the province of Syria as a Greek city."
    - 'In Acts an angel sends Philip to "the way that goeth down from Jerusalem unto Gaza, which is desert", where he baptises an Ethiopian eunuch. The monk Hilarion, a founder of monastic life in Palestine, was born in a village south of Gaza. The city long remained pagan, with a great temple of its god Marnas. In 402, by the usual dating, imperial troops sent at the request of Bishop Porphyry destroyed its temples, and a church was built where the Marneion had stood; the story is told in Mark the Deacon''s Life of Porphyry, a work whose authenticity is debated. Around 500 Gaza was known for its school of rhetoric.'
  ru:
    - "Газа стояла на южной приморской равнине, немного в стороне от моря, — последний город на дороге из Египта перед Синайской пустыней; её древний холм скрыт под современным городом, а гавань позже называлась Маиума. В XV веке до н. э. Тутмос III остановился в Газе по пути к Мегиддо, и при Новом царстве она была одним из главных центров египетской власти в Ханаане. В XII веке до н. э. здесь поселились филистимляне, и Газа стала одним из пяти их городов."
    - "Книга Бытия называет Газу на краю земли Ханаанской. Самсон унёс двери её городских ворот; позже филистимляне выкололи ему глаза и заставили молоть в доме узников в Газе, и он обрушил дом, где собрались их владельцы. Езекия поразил филистимлян до Газы, а Амос предрёк огонь на её стены. В 734 г. до н. э. город взял ассирийский царь Феглафелласар III, а царь Газы Хануну бежал в Египет; в 720 г. до н. э. Саргон II разбил Хануну при Рафии и взял его в плен."
    - "В 332 г. до н. э. Александр Македонский взял Газу приступом после двухмесячной осады; её защитники пали в бою, а женщин и детей продали в рабство. Около 96 г. до н. э. хасмонейский царь Александр Яннай после годичной осады взял город и, по словам Иосифа Флавия, разрушил его. В 63 г. до н. э. Помпей освободил Газу от иудейской власти, а римский наместник Сирии Габиний около 57 г. до н. э. велел её отстроить. Август отдал её Ироду, но после смерти Ирода в 4 г. до н. э. она как греческий город была присоединена к провинции Сирия."
    - "В Деяниях Ангел посылает Филиппа «на дорогу, идущую из Иерусалима в Газу, на ту, которая пуста», где он крестит евнуха-ефиоплянина. Монах Иларион, один из основателей монашеской жизни в Палестине, родился в селении к югу от Газы. Город долго оставался языческим, с большим храмом своего бога Марнаса. В 402 г., по обычной датировке, императорские войска, присланные по просьбе епископа Порфирия, разрушили его храмы, и на месте Марнейона построили церковь; об этом рассказывает Житие Порфирия, написанное Марком Диаконом, но подлинность этого сочинения оспаривается. Около 500 г. Газа славилась своей школой риторики."
  uk:
    - "Газа лежала на південній прибережній рівнині, трохи вглиб від моря, — останнє місто на дорозі з Єгипту перед пустелею Сінай; її давнє городище лежить під сучасним містом, а гавань пізніше називали Майюма. У XV ст. до н. е. Тутмос III зупинявся в Газі на шляху до Мегіддо, а за Нового царства вона була одним із головних осередків єгипетської влади в Ханаані. У XII ст. до н. е. тут оселилися філістимляни, і Газа стала одним із їхніх п’яти міст."
    - "Книга Буття називає Газу на краю ханаанської землі. Самсон забрав двері її брами; пізніше філістимляни осліпили його й змусили молоти зерно в темниці в Газі, а він повалив будинок, де зібралися їхні володарі. Єзекія розбив філістимлян аж до Гази, а Амос провістив вогонь на її мури. 734 р. до н. е. Тіглатпаласар III Ассирійський узяв місто, і його цар Ханун утік до Єгипту; 720 р. до н. е. Саргон II розбив Хануна під Рафією й узяв його в полон."
    - "332 р. до н. е. Александр Македонський узяв Газу штурмом після двомісячної облоги; її оборонці полягли в бою, а жінок і дітей продали в рабство. Близько 96 р. до н. е. хасмонейський цар Александр Яннай узяв місто після річної облоги й, за словами Йосифа Флавія, зруйнував його. Помпей звільнив Газу від юдейської влади 63 р. до н. е., а Габіній, римський намісник Сирії, відбудував її близько 57 р. до н. е. Август віддав її Іродові, але після смерті Ірода 4 р. до н. е. її приєднали до провінції Сирія як грецьке місто."
    - "У Діях ангел посилає Пилипа на «дорогу, що йде з Єрусалиму в Газу; вона пуста», де той охрещує ефіопського євнуха. Чернець Іларіон, один із засновників чернечого життя в Палестині, народився в селі на південь від Гази. Місто довго залишалося поганським, з великим храмом свого бога Марнаса. 402 року, за звичайним датуванням, імператорські війська, надіслані на прохання єпископа Порфирія, зруйнували його храми, а там, де стояв Марнейон, побудували церкву; цю історію розповідає «Житіє Порфирія» Марка Диякона, автентичність якого оспорюють. Близько 500 року Газа славилася своєю школою риторики."
  es:
    - "Gaza se hallaba en la llanura costera meridional, algo tierra adentro desde el mar, la última población del camino de Egipto antes del desierto del Sinaí; su antiguo montículo yace bajo la ciudad moderna, y su puerto se llamó más tarde Maiuma. En el siglo XV a. C. Tutmosis III se detuvo en Gaza en su marcha hacia Meguido, y bajo el Reino Nuevo fue una de las principales sedes del dominio egipcio en Canaán. En el siglo XII a. C. se establecieron aquí los filisteos, y Gaza llegó a ser una de sus cinco ciudades."
    - "El Génesis nombra Gaza en el extremo de la tierra de Canaán. Sansón se llevó las puertas de su portal; más tarde los filisteos lo cegaron y lo pusieron a moler en la cárcel de Gaza, y él derribó la casa donde se habían reunido sus príncipes. Ezequías hirió a los filisteos hasta Gaza, y Amós anunció fuego sobre sus muros. En el 734 a. C. Tiglat-pileser III de Asiria tomó la ciudad, y su rey Hanunu huyó a Egipto; en el 720 a. C. Sargón II derrotó a Hanunu en Rafia y lo llevó cautivo."
    - "En el 332 a. C. Alejandro Magno tomó Gaza al asalto tras un asedio de dos meses; sus defensores cayeron combatiendo, y las mujeres y los niños fueron vendidos como esclavos. Hacia el 96 a. C. el rey asmoneo Alejandro Janeo tomó la ciudad tras un asedio de un año y, según Josefo, la destruyó. Pompeyo libró a Gaza del dominio judío en el 63 a. C., y Gabinio, gobernador romano de Siria, la hizo reconstruir hacia el 57 a. C. Augusto se la dio a Herodes, pero tras la muerte de este, en el 4 a. C., fue anexada a la provincia de Siria como ciudad griega."
    - "En Hechos, un ángel envía a Felipe «al camino que desciende de Jerusalem á Gaza, el cual es desierto», donde bautiza a un eunuco etíope. El monje Hilarión, uno de los fundadores de la vida monástica en Palestina, nació en una aldea al sur de Gaza. La ciudad siguió siendo pagana largo tiempo, con un gran templo de su dios Marnas. En 402, según la datación habitual, tropas imperiales enviadas a petición del obispo Porfirio destruyeron sus templos, y se construyó una iglesia donde había estado el Marneion; la historia se cuenta en la Vida de Porfirio de Marcos el Diácono, obra cuya autenticidad se discute. Hacia 500 Gaza era conocida por su escuela de retórica."
  pt:
    - "Gaza ficava na planície costeira meridional, um pouco para o interior em relação ao mar, a última cidade no caminho do Egito antes do deserto do Sinai; o seu antigo monte jaz sob a cidade moderna, e o seu porto foi mais tarde chamado Maiuma. No século XV a.C., Tutmés III parou em Gaza na marcha para Megido, e sob o Reino Novo ela foi uma das principais sedes do domínio egípcio em Canaã. No século XII a.C., os filisteus se estabeleceram aqui, e Gaza se tornou uma das suas cinco cidades."
    - "Gênesis nomeia Gaza no limite da terra de Canaã. Sansão levou embora as portas do seu portão; depois os filisteus o cegaram e o puseram para moer na prisão de Gaza, e ele derrubou a casa onde os seus senhores se haviam reunido. Ezequias feriu os filisteus até Gaza, e Amós predisse fogo sobre as suas muralhas. Em 734 a.C., Tiglate-Pileser III da Assíria tomou a cidade, e o seu rei Hanunu fugiu para o Egito; em 720 a.C., Sargão II derrotou Hanunu em Ráfia e o levou cativo."
    - "Em 332 a.C., Alexandre, o Grande, tomou Gaza de assalto depois de um cerco de dois meses; os seus defensores caíram combatendo, e as mulheres e crianças foram vendidas como escravas. Por volta de 96 a.C., o rei asmoneu Alexandre Janeu tomou a cidade após um cerco de um ano e, segundo Josefo, a destruiu. Pompeu libertou Gaza do domínio judaico em 63 a.C., e Gabínio, o governador romano da Síria, mandou reconstruí-la por volta de 57 a.C. Augusto a deu a Herodes, mas depois da morte de Herodes, em 4 a.C., ela foi anexada à província da Síria como cidade grega."
    - "Em Atos, um anjo envia Filipe para “o caminho que desce de Jerusalém a Gaza. Este é um deserto”, onde ele batiza um eunuco etíope. O monge Hilarião, um dos fundadores da vida monástica na Palestina, nasceu numa aldeia ao sul de Gaza. A cidade permaneceu pagã por muito tempo, com um grande templo do seu deus Marnas. Em 402, segundo a datação habitual, tropas imperiais enviadas a pedido do bispo Porfírio destruíram os seus templos, e uma igreja foi construída onde estivera o Marneion; a história é contada na Vida de Porfírio, de Marcos, o Diácono, obra cuja autenticidade é debatida. Por volta de 500, Gaza era conhecida por sua escola de retórica."
  de:
    - "Gaza lag auf der südlichen Küstenebene, ein wenig landeinwärts vom Meer, als letzte Stadt an der Straße aus Ägypten vor der Wüste Sinai; sein alter Hügel liegt unter der heutigen Stadt, und sein Hafen hieß später Maiuma. Im 15. Jahrhundert v. Chr. hielt Thutmosis III. auf seinem Marsch nach Megiddo in Gaza inne, und unter dem Neuen Reich war es ein Hauptsitz der ägyptischen Herrschaft in Kanaan. Im 12. Jahrhundert v. Chr. ließen sich hier die Philister nieder, und Gaza wurde eine ihrer fünf Städte."
    - "Das erste Buch Mose nennt Gaza am Rand des Landes Kanaan. Simson trug die Türen seines Tores davon; später blendeten ihn die Philister und ließen ihn im Gefängnis zu Gaza mahlen, und er riss das Haus nieder, in dem sich ihre Fürsten versammelt hatten. Hiskia schlug die Philister bis nach Gaza, und Amos kündigte Feuer über seine Mauern an. 734 v. Chr. nahm Tiglat-Pileser III. von Assyrien die Stadt ein, und ihr König Hanunu floh nach Ägypten; 720 v. Chr. besiegte Sargon II. Hanunu bei Raphia und nahm ihn gefangen."
    - "332 v. Chr. nahm Alexander der Große Gaza nach zweimonatiger Belagerung im Sturm; seine Verteidiger fielen im Kampf, Frauen und Kinder wurden als Sklaven verkauft. Um 96 v. Chr. nahm der hasmonäische König Alexander Jannäus die Stadt nach einjähriger Belagerung ein und zerstörte sie, wie Josephus berichtet. Pompeius befreite Gaza 63 v. Chr. von der jüdischen Herrschaft, und Gabinius, der römische Statthalter von Syrien, ließ es um 57 v. Chr. wieder aufbauen. Augustus gab es Herodes, doch nach dem Tod des Herodes 4 v. Chr. wurde es als griechische Stadt der Provinz Syrien zugeschlagen."
    - "In der Apostelgeschichte schickt ein Engel Philippus auf „die Straße, die von Jerusalem geht hinab gen Gaza, die da wüst ist“, wo er einen äthiopischen Kämmerer tauft. Der Mönch Hilarion, ein Begründer des Mönchtums in Palästina, wurde in einem Dorf südlich von Gaza geboren. Die Stadt blieb lange heidnisch, mit einem großen Tempel ihres Gottes Marnas. Im Jahr 402, nach der üblichen Datierung, zerstörten kaiserliche Truppen, die auf Bitten des Bischofs Porphyrius gesandt worden waren, ihre Tempel, und dort, wo das Marneion gestanden hatte, wurde eine Kirche gebaut; die Geschichte erzählt die Vita des Porphyrius von Markus dem Diakon, ein Werk, dessen Echtheit umstritten ist. Um 500 war Gaza für seine Rhetorikschule bekannt."
  fr:
    - "Gaza se trouvait sur la plaine côtière méridionale, un peu à l’intérieur des terres, dernière ville sur la route d’Égypte avant le désert du Sinaï ; son ancien tertre repose sous la ville moderne, et son port fut appelé plus tard Maïouma. Au XVe siècle av. J.-C., Thoutmosis III fit halte à Gaza lors de sa marche vers Meguiddo, et sous le Nouvel Empire elle fut l’un des principaux sièges du pouvoir égyptien en Canaan. Au XIIe siècle av. J.-C., les Philistins s’y établirent, et Gaza devint l’une de leurs cinq villes."
    - "La Genèse nomme Gaza à la limite du pays de Canaan. Samson emporta les battants de sa porte ; plus tard, les Philistins lui crevèrent les yeux et lui firent tourner la meule dans la prison de Gaza, et il fit tomber la maison où leurs princes s’étaient rassemblés. Ézéchias battit les Philistins jusqu’à Gaza, et Amos annonça le feu sur ses murs. En 734 av. J.-C., Tiglath-Piléser III d’Assyrie prit la ville, et son roi Hanunu s’enfuit en Égypte ; en 720 av. J.-C., Sargon II battit Hanunu à Raphia et le fit prisonnier."
    - "En 332 av. J.-C., Alexandre le Grand prit Gaza d’assaut après un siège de deux mois ; ses défenseurs tombèrent en combattant, et les femmes et les enfants furent vendus comme esclaves. Vers 96 av. J.-C., le roi hasmonéen Alexandre Jannée prit la ville après un an de siège et, selon Josèphe, la détruisit. Pompée libéra Gaza de la domination juive en 63 av. J.-C., et Gabinius, gouverneur romain de Syrie, la fit reconstruire vers 57 av. J.-C. Auguste la donna à Hérode, mais après la mort d’Hérode, en 4 av. J.-C., elle fut rattachée à la province de Syrie comme cité grecque."
    - "Dans les Actes, un ange envoie Philippe sur « le chemin qui descend de Jérusalem à Gaza, celui qui est désert », où il baptise un eunuque éthiopien. Le moine Hilarion, l’un des fondateurs de la vie monastique en Palestine, naquit dans un village au sud de Gaza. La ville resta longtemps païenne, avec un grand temple de son dieu Marnas. En 402, selon la datation habituelle, des troupes impériales envoyées à la demande de l’évêque Porphyre détruisirent ses temples, et une église fut bâtie là où s’était dressé le Marnéion ; l’histoire est racontée dans la Vie de Porphyre de Marc le Diacre, œuvre dont l’authenticité est débattue. Vers 500, Gaza était réputée pour son école de rhétorique."
  pl:
    - "Gaza leżała na południowej nizinie nadmorskiej, nieco w głębi lądu od morza, jako ostatnie miasto na drodze z Egiptu przed pustynią Synaj; jej dawny pagórek znajduje się pod współczesnym miastem, a jej port nazywano później Maiuma. W XV w. p.n.e. Totmes III zatrzymał się w Gazie w marszu na Megiddo, a za Nowego Państwa była ona jedną z głównych siedzib egipskiej władzy w Kanaanie. W XII w. p.n.e. osiedlili się tu Filistyni i Gaza stała się jednym z ich pięciu miast."
    - "Księga Rodzaju wymienia Gazę na skraju ziemi Kanaan. Samson wyniósł wrota jej bramy; później Filistyni oślepili go i kazali mu mleć w domu więźniów w Gazie, a on zburzył dom, w którym zebrali się ich książęta. Ezechiasz poraził Filistynów aż do Gazy, a Amos zapowiedział ogień na jej mury. W 734 r. p.n.e. Tiglat-Pileser III z Asyrii zdobył miasto, a jego król Hanunu uciekł do Egiptu; w 720 r. p.n.e. Sargon II pokonał Hanunu pod Rafią i wziął go do niewoli."
    - "W 332 r. p.n.e. Aleksander Wielki zdobył Gazę szturmem po dwumiesięcznym oblężeniu; jej obrońcy polegli w walce, a kobiety i dzieci sprzedano w niewolę. Około 96 r. p.n.e. hasmonejski król Aleksander Janneusz zdobył miasto po rocznym oblężeniu i, według Józefa Flawiusza, zburzył je. Pompejusz uwolnił Gazę spod władzy żydowskiej w 63 r. p.n.e., a Gabiniusz, rzymski namiestnik Syrii, kazał ją odbudować około 57 r. p.n.e. August oddał ją Herodowi, lecz po śmierci Heroda w 4 r. p.n.e. włączono ją do prowincji Syrii jako miasto greckie."
    - "W Dziejach Apostolskich anioł posyła Filipa „na drogę, która od Jeruzalemu idzie ku Gazie, która jest pusta”, gdzie ochrzcił eunucha etiopskiego. Mnich Hilarion, jeden z założycieli życia monastycznego w Palestynie, urodził się we wsi na południe od Gazy. Miasto długo pozostawało pogańskie, z wielką świątynią swego boga Marnasa. W 402 r., według zwykłego datowania, wojska cesarskie wysłane na prośbę biskupa Porfiriusza zburzyły jego świątynie, a na miejscu Marneionu zbudowano kościół; opowiada o tym Żywot Porfiriusza Marka Diakona, dzieło o spornej autentyczności. Około 500 r. Gaza słynęła ze szkoły retoryki."
  it:
    - "Gaza sorgeva sulla pianura costiera meridionale, un poco nell’entroterra rispetto al mare, ultima città sulla strada dall’Egitto prima del deserto del Sinai; il suo antico tell giace sotto la città moderna, e il suo porto fu poi chiamato Maiuma. Nel XV secolo a.C. Tutmosi III si fermò a Gaza durante la marcia verso Meghiddo, e sotto il Nuovo Regno fu una delle principali sedi del dominio egizio in Canaan. Nel XII secolo a.C. vi si stabilirono i Filistei, e Gaza divenne una delle loro cinque città."
    - "La Genesi nomina Gaza al margine del paese di Canaan. Sansone ne portò via i battenti della porta; più tardi i Filistei gli cavarono gli occhi e lo misero a girare la macina nella prigione di Gaza, ed egli abbatté la casa dove si erano radunati i loro principi. Ezechia batté i Filistei fino a Gaza, e Amos predisse il fuoco sulle sue mura. Nel 734 a.C. Tiglat-Pilèser III d’Assiria prese la città, e il suo re Hanunu fuggì in Egitto; nel 720 a.C. Sargon II sconfisse Hanunu a Rafia e lo fece prigioniero."
    - "Nel 332 a.C. Alessandro Magno prese Gaza d’assalto dopo due mesi d’assedio; i difensori caddero combattendo, e le donne e i bambini furono venduti come schiavi. Verso il 96 a.C. il re asmoneo Alessandro Ianneo prese la città dopo un anno d’assedio e, secondo Giuseppe Flavio, la distrusse. Pompeo liberò Gaza dal dominio giudaico nel 63 a.C., e Gabinio, governatore romano della Siria, la fece ricostruire verso il 57 a.C. Augusto la diede a Erode, ma dopo la morte di Erode, nel 4 a.C., fu unita alla provincia di Siria come città greca."
    - "Negli Atti un angelo manda Filippo «sulla via che scende da Gerusalemme a Gaza. Ella è una via deserta», dove egli battezza un eunuco etiope. Il monaco Ilarione, fondatore della vita monastica in Palestina, nacque in un villaggio a sud di Gaza. La città restò a lungo pagana, con un grande tempio del suo dio Marna. Nel 402, secondo la datazione consueta, truppe imperiali inviate su richiesta del vescovo Porfirio distrussero i suoi templi, e una chiesa fu costruita dove sorgeva il Marneion; la storia è narrata nella Vita di Porfirio di Marco il Diacono, opera la cui autenticità è discussa. Verso il 500 Gaza era nota per la sua scuola di retorica."
  nl:
    - "Gaza lag in de zuidelijke kustvlakte, een stukje landinwaarts van de zee, als laatste stad aan de weg uit Egypte vóór de Sinaïwoestijn; de oude heuvel ligt onder de moderne stad, en de haven werd later Maiuma genoemd. In de 15e eeuw v.Chr. hield Thoetmosis III halt bij Gaza op zijn tocht naar Megiddo, en onder het Nieuwe Rijk was het een hoofdzetel van het Egyptische gezag in Kanaän. In de 12e eeuw v.Chr. vestigden de Filistijnen zich hier, en Gaza werd een van hun vijf steden."
    - "Genesis noemt Gaza aan de rand van het land Kanaän. Simson nam de deuren van de stadspoort mee; later verblindden de Filistijnen hem en lieten hem malen in het gevangenhuis te Gaza, en hij haalde het huis neer waar hun vorsten bijeen waren. Chizkia sloeg de Filistijnen tot aan Gaza, en Amos voorspelde vuur op zijn muren. In 734 v.Chr. nam Tiglat-Pileser III van Assyrië de stad in, en haar koning Hanunu vluchtte naar Egypte; in 720 v.Chr. versloeg Sargon II Hanunu bij Rafia en nam hem gevangen."
    - "In 332 v.Chr. nam Alexander de Grote Gaza met een bestorming in na een beleg van twee maanden; de verdedigers sneuvelden vechtend, en de vrouwen en kinderen werden als slaven verkocht. Omstreeks 96 v.Chr. nam de Hasmoneïsche koning Alexander Jannaeus de stad in na een beleg van een jaar en verwoestte haar volgens Josephus. Pompeius bevrijdde Gaza in 63 v.Chr. van Joodse heerschappij, en Gabinius, de Romeinse stadhouder van Syrië, liet haar omstreeks 57 v.Chr. herbouwen. Augustus gaf haar aan Herodes, maar na de dood van Herodes in 4 v.Chr. werd zij als Griekse stad bij de provincie Syrië gevoegd."
    - "In Handelingen zendt een engel Filippus naar “den weg, die van Jeruzalem afdaalt naar Gaza, welke woest is”, waar hij een Ethiopische kamerling doopt. De monnik Hilarion, een grondlegger van het kloosterleven in Palestina, werd geboren in een dorp ten zuiden van Gaza. De stad bleef lang heidens, met een grote tempel van haar god Marnas. In 402, volgens de gangbare datering, verwoestten keizerlijke troepen, gestuurd op verzoek van bisschop Porfyrius, haar tempels, en op de plaats van het Marneion werd een kerk gebouwd; het verhaal wordt verteld in het Leven van Porfyrius van Marcus de Diaken, een werk waarvan de echtheid omstreden is. Rond 500 stond Gaza bekend om zijn retorenschool."
  cs:
    - "Gaza ležela na jižní pobřežní rovině, kousek od moře ve vnitrozemí, jako poslední město na cestě z Egypta před sinajskou pouští; její staré návrší leží pod moderním městem a její přístav se později nazýval Maiuma. V 15. stol. př. n. l. se Thutmose III. na pochodu k Megidu zastavil u Gazy a za Nové říše byla jedním z hlavních sídel egyptské vlády v Kanaánu. Ve 12. stol. př. n. l. se zde usadili Pelištejci a Gaza se stala jedním z jejich pěti měst."
    - "Genesis jmenuje Gazu na okraji kanaánské země. Samson odnesl dveře její brány; později ho Pelištejci oslepili a dali mu mlít ve vězení v Gaze a on strhl dům, kde se sešli jejich knížata. Chizkijáš udeřil na Pelištejce až k Gaze a Amos předpověděl oheň na její hradby. Roku 734 př. n. l. město dobyl Tiglatpilesar III. Asyrský a jeho král Chanunu uprchl do Egypta; roku 720 př. n. l. Sargon II. porazil Chanunua u Rafie a zajal ho."
    - "Roku 332 př. n. l. dobyl Alexandr Veliký Gazu útokem po dvouměsíčním obléhání; její obránci padli v boji a ženy a děti byly prodány do otroctví. Kolem roku 96 př. n. l. hasmonejský král Alexandr Jannaios město po ročním obléhání dobyl a podle Josepha Flavia zničil. Pompeius osvobodil Gazu od židovské vlády roku 63 př. n. l. a Gabinius, římský správce Sýrie, ji nechal kolem roku 57 př. n. l. znovu postavit. Augustus ji dal Herodovi, ale po Herodově smrti roku 4 př. n. l. byla jako řecké město připojena k provincii Sýrie."
    - "Ve Skutcích posílá anděl Filipa „na cestu, kteráž vede od Jeruzaléma do města Gázy, kteréž jest pusté“, kde pokřtí etiopského dvořana. Mnich Hilarion, jeden ze zakladatelů mnišského života v Palestině, se narodil ve vesnici jižně od Gazy. Město zůstalo dlouho pohanské, s velkým chrámem svého boha Marna. Roku 402, podle obvyklého datování, císařští vojáci vyslaní na žádost biskupa Porfyria zničili jeho chrámy a tam, kde stálo Marneion, byl postaven kostel; příběh vypráví Život Porfyria od jáhna Marka, dílo, jehož pravost je sporná. Kolem roku 500 byla Gaza známá svou školou rétoriky."
  sv:
    - "Gaza låg på den södra kustslätten, en bit inåt landet från havet, den sista staden på vägen från Egypten före Sinaiöknen; dess gamla kulle ligger under den moderna staden, och dess hamn kallades senare Maiuma. På 1400-talet f.Kr. gjorde Tutmosis III halt i Gaza på sitt tåg mot Megiddo, och under Nya riket var det ett av egyptiernas viktigaste säten i Kanaan. På 1100-talet f.Kr. bosatte sig filistéerna här, och Gaza blev en av deras fem städer."
    - "Första Moseboken nämner Gaza vid gränsen av Kanaans land. Simson bar bort dörrarna i dess port; senare blindade filistéerna honom och satte honom att mala i fängelset i Gaza, och han rev ned huset där deras furstar var samlade. Hiskia slog filistéerna ända till Gaza, och Amos förutsade eld mot dess murar. År 734 f.Kr. intog Tiglat-Pileser III av Assyrien staden, och dess kung Hanunu flydde till Egypten; år 720 f.Kr. besegrade Sargon II Hanunu vid Rafia och tog honom till fånga."
    - "År 332 f.Kr. intog Alexander den store Gaza med storm efter en belägring på två månader; dess försvarare stupade i strid, och kvinnorna och barnen såldes som slavar. Omkring 96 f.Kr. intog den hasmoneiske kungen Alexander Jannaios staden efter ett års belägring och förstörde den enligt Josefus. Pompeius befriade Gaza från judiskt välde år 63 f.Kr., och Gabinius, Roms guvernör i Syrien, lät återuppbygga den omkring 57 f.Kr. Augustus gav den åt Herodes, men efter Herodes död år 4 f.Kr. lades den under provinsen Syrien som grekisk stad."
    - "I Apostlagärningarna sänder en ängel Filippus till ”den väg som leder ned från Jerusalem till Gasa; den är tom på folk”, där han döper en etiopisk eunuck. Munken Hilarion, en av grundarna av klosterlivet i Palestina, föddes i en by söder om Gaza. Staden förblev länge hednisk, med ett stort tempel för sin gud Marnas. År 402, enligt den vanliga dateringen, förstörde kejserliga trupper som sänts på biskop Porfyrios begäran dess tempel, och en kyrka byggdes där Marneion hade stått; berättelsen återges i Markus diakons Porfyrios liv, ett verk vars äkthet är omdebatterad. Omkring år 500 var Gaza känt för sin retorikskola."
  nb:
    - "Gasa lå på den sørlige kystsletten, et stykke inne fra havet, den siste byen på veien fra Egypt før Sinai-ørkenen; den gamle haugen ligger under den moderne byen, og havnen ble senere kalt Maiuma. På 1400-tallet f.Kr. gjorde Thutmosis 3. holdt ved Gasa på marsjen til Megiddo, og under Det nye riket var den et viktig sete for egyptisk styre i Kanaan. På 1100-tallet f.Kr. slo filistrene seg ned her, og Gasa ble en av deres fem byer."
    - "Første Mosebok nevner Gasa ved kanten av Kanaans land. Samson bar bort dørene i byporten; senere blindet filistrene ham og satte ham til å male i fengselshuset i Gasa, og han rev ned huset der deres fyrster var samlet. Hiskia slo filistrene like til Gasa, og Amos forutsa ild mot dens murer. I 734 f.Kr. tok Tiglat-Pileser 3. av Assyria byen, og kongen Hanunu flyktet til Egypt; i 720 f.Kr. beseiret Sargon 2. Hanunu ved Rafia og tok ham til fange."
    - "I 332 f.Kr. inntok Aleksander den store Gasa ved storm etter en beleiring på to måneder; forsvarerne falt i kamp, og kvinnene og barna ble solgt som slaver. Omkring 96 f.Kr. inntok den hasmoneiske kongen Aleksander Jannaios byen etter ett års beleiring og ødela den ifølge Josefus. Pompeius fridde Gasa fra jødisk styre i 63 f.Kr., og Gabinius, Syrias romerske guvernør, lot den gjenreise omkring 57 f.Kr. Augustus ga den til Herodes, men etter Herodes' død i 4 f.Kr. ble den lagt til provinsen Syria som en gresk by."
    - "I Apostlenes gjerninger sender en engel Filip til «den vei som går ned fra Jerusalem til Gasa! Denne vei er øde.», der han døper en etiopisk evnukk. Munken Hilarion, en av grunnleggerne av klosterlivet i Palestina, ble født i en landsby sør for Gasa. Byen forble lenge hedensk, med et stort tempel for guden Marnas. I 402, etter den vanlige dateringen, ødela keiserlige tropper, sendt på anmodning fra biskop Porfyrios, templene der, og en kirke ble bygd der Marneion hadde stått; historien fortelles i diakonen Markus' Porfyrios' liv, et verk hvis ekthet er omdiskutert. Omkring 500 var Gasa kjent for sin retorikkskole."
  tl:
    - "Ang Gaza ay nasa timog na kapatagan sa baybayin, bahagyang papasok mula sa dagat, ang huling bayan sa daan mula sa Egipto bago ang ilang ng Sinai; ang matandang burol nito ay nasa ilalim ng makabagong lungsod, at ang daungan nito ay tinawag nang kalaunan na Maiuma. Noong ika-15 siglo BK huminto si Thutmose III sa Gaza sa kaniyang martsa patungong Megiddo, at sa ilalim ng Bagong Kaharian ito ay isa sa pangunahing luklukan ng pamamahalang Egipsiyo sa Canaan. Noong ika-12 siglo BK nanirahan dito ang mga Filisteo, at ang Gaza ay naging isa sa kanilang limang lungsod."
    - "Pinangalanan ng Genesis ang Gaza sa gilid ng lupain ng Canaan. Dinala ni Samson ang mga pinto ng pintuan nito; kalaunan ay binulag siya ng mga Filisteo at pinaggiling sa bilangguan sa Gaza, at ibinagsak niya ang bahay kung saan nagtipon ang kanilang mga panginoon. Sinalakay ni Ezechias ang mga Filisteo hanggang sa Gaza, at humula si Amos ng apoy sa mga pader nito. Noong 734 BK sinakop ni Tiglath-pileser III ng Asiria ang lungsod, at tumakas ang hari nitong si Hanunu patungong Egipto; noong 720 BK tinalo ni Sargon II si Hanunu sa Raphia at dinalang bihag."
    - "Noong 332 BK sinakop ni Alejandro Magno ang Gaza sa pamamagitan ng pagsalakay pagkatapos ng dalawang buwang pagkubkob; nabuwal na lumalaban ang mga tagapagtanggol nito, at ang mga babae at bata ay ipinagbili bilang alipin. Mga 96 BK sinakop ng haring Hasmoneo na si Alejandro Janneo ang lungsod pagkatapos ng isang taong pagkubkob at, ayon kay Josephus, giniba ito. Pinalaya ni Pompey ang Gaza mula sa pamamahalang Judio noong 63 BK, at ipinaayos ito ni Gabinius, ang gobernador Romano ng Siria, mga 57 BK. Ibinigay ito ni Augusto kay Herodes, ngunit pagkamatay ni Herodes noong 4 BK ay isinama ito sa lalawigan ng Siria bilang isang lungsod Griyego."
    - "Sa Mga Gawa, isinugo ng isang anghel si Felipe sa “daang palusong mula sa Jerusalem hanggang sa Gaza: na ito'y ilang”, kung saan binautismuhan niya ang isang bating na Etiope. Ang monghe na si Hilarion, isa sa mga nagtatag ng buhay monastiko sa Palestina, ay ipinanganak sa isang nayon sa timog ng Gaza. Matagal na nanatiling pagano ang lungsod, na may malaking templo ng diyos nitong si Marnas. Noong 402, ayon sa karaniwang pagpepetsa, giniba ng mga sundalong imperyal na ipinadala sa kahilingan ni Obispo Porfirio ang mga templo nito, at isang simbahan ang itinayo kung saan nakatayo ang Marneion; isinasalaysay ang kuwento sa Buhay ni Porfirio ni Marcos na Diakono, isang akdang pinagtatalunan ang pagiging tunay. Mga 500 ay kilala ang Gaza sa paaralan nito ng retorika."
  da:
    - "Gaza lå på den sydlige kystslette, et stykke inde fra havet, den sidste by på vejen fra Egypten før Sinaj-ørkenen; dens gamle høj ligger under den moderne by, og dens havn blev senere kaldt Maiuma. I 1400-tallet f.Kr. holdt Thutmose III ved Gaza på sin march mod Megiddo, og under Det Nye Rige var den et hovedsæde for egyptisk styre i Kana'an. I 1100-tallet f.Kr. bosatte filisterne sig her, og Gaza blev en af deres fem byer."
    - "Første Mosebog nævner Gaza ved kanten af Kana'ans land. Samson bar dens porte bort; senere blindede filisterne ham og satte ham til at male i fangehuset i Gaza, og han rev det hus ned, hvor deres fyrster var samlet. Hizkija slog filisterne helt til Gaza, og Amos forudsagde ild over dens mure. I 734 f.Kr. indtog Tiglat-Pileser III af Assyrien byen, og dens konge Hanunu flygtede til Egypten; i 720 f.Kr. besejrede Sargon II Hanunu ved Rafia og tog ham til fange."
    - "I 332 f.Kr. indtog Alexander den Store Gaza ved stormløb efter en belejring på to måneder; dens forsvarere faldt kæmpende, og kvinder og børn blev solgt som slaver. Omkring 96 f.Kr. indtog den hasmonæiske konge Alexander Jannæus byen efter en belejring på et år og ødelagde den ifølge Josefus. Pompejus frigjorde Gaza fra jødisk styre i 63 f.Kr., og Gabinius, den romerske statholder i Syrien, lod den genopbygge omkring 57 f.Kr. Augustus gav den til Herodes, men efter Herodes' død i 4 f.Kr. blev den lagt til provinsen Syrien som en græsk by."
    - "I Apostlenes Gerninger sender en engel Filip »paa den Vej, som gaar ned fra Jerusalem til Gaza; den er øde«, hvor han døber en etiopisk eunuk. Munken Hilarion, en grundlægger af klostervæsenet i Palæstina, blev født i en landsby syd for Gaza. Byen forblev længe hedensk med et stort tempel for guden Marnas. I 402, efter den sædvanlige datering, ødelagde kejserlige tropper, sendt på biskop Porfyrios' anmodning, dens templer, og en kirke blev bygget, hvor Marneion havde stået; historien fortælles i diakonen Markus' Porfyrios' Liv, et værk, hvis ægthed er omstridt. Omkring 500 var Gaza kendt for sin retorikskole."
  sr:
    - "Газа је лежала на јужној приобалној равници, мало у унутрашњости од мора, последњи град на путу из Египта пре синајске пустиње; њена стара хумка лежи испод савременог града, а њена лука касније је названа Мајума. У петнаестом веку п. н. е. Тутмес III зауставио се у Гази на походу на Мегидо, а у Новом краљевству била је једно од главних седишта египатске власти у Ханану. У дванаестом веку п. н. е. Филистеји су се ту населили и Газа је постала један од њихових пет градова."
    - "Књига Постања именује Газу на рубу ханањске земље. Самсон је однео врата њене капије; касније су га Филистеји ослепели и ставили да меље у тамници у Гази, а он је срушио кућу у којој су се сабрали њихови кнезови. Језекија је поразио Филистеје све до Газе, а Амос је најавио огањ на њене зидове. Године 734. п. н. е. Теглат-Феласар III Асирски заузео је град, а његов цар Ханун побегао је у Египат; 720. п. н. е. Саргон II потукао је Хануна код Рафије и одвео га у ропство."
    - "Године 332. п. н. е. Александар Велики освојио је Газу јуришом после двомесечне опсаде; њени браниоци пали су борећи се, а жене и деца продати су у ропство. Око 96. п. н. е. хасмонејски цар Александар Јаној заузео је град после једногодишње опсаде и, по Јосифу Флавију, разорио га. Помпеј је Газу ослободио јеврејске власти 63. п. н. е., а Габиније, римски намесник Сирије, дао ју је обновити око 57. п. н. е. Август ју је дао Ироду, али је после Иродове смрти 4. п. н. е. придодата провинцији Сирији као грчки град."
    - "У Делима анђео шаље Филипа на „пут који силази од Јерусалима у Газу и пуст је“, где он крштава етиопског евнуха. Монах Иларион, један од оснивача монашког живота у Палестини, рођен је у селу јужно од Газе. Град је дуго остао незнабожачки, с великим храмом свог бога Марнаса. Године 402, по уобичајеном датирању, царске трупе послате на молбу епископа Порфирија срушиле су његове храмове, а тамо где је стајао Марнеј сазидана је црква; прича је испричана у „Животу Порфирија“ ђакона Марка, делу чија је веродостојност спорна. Око 500. Газа је била позната по својој школи реторике."
