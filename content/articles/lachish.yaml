# Overview article (ADR 0007). Mainstream facts only; disputed datings are named as such.
id: lachish
place: a3cc590
title:
  en: "Lachish"
  ru: "Лахис"
body:
  en:
    - "Lachish lies in the Shephelah, the low hills between the Judaean highlands and the coastal plain, about 45 km southwest of Jerusalem, on the mound of Tell ed-Duweir. A large Canaanite city stood here in the Middle and Late Bronze Ages. Among the Amarna letters of the fourteenth century BC are letters to Pharaoh from its rulers Yabni-ilu, Zimredda and Shipti-Baal. The Late Bronze city was burned in the twelfth century BC, and for a long time afterwards the mound was only thinly settled."
    - "Joshua took Lachish, whose king Japhia had joined the league against Gibeon. Rehoboam fortified it, and King Amaziah fled there from a conspiracy in Jerusalem and was killed there. Lachish became the strongest city of Judah after Jerusalem. In 701 BC Sennacherib of Assyria besieged it, and from Lachish he sent his officers to Hezekiah in Jerusalem. At Nineveh he lined a room of his palace with reliefs of the siege, with a caption saying that the booty of Lachish passed before him. Excavators found the city burned at that time and the Assyrian siege ramp, the only one yet found."
    - "When Nebuchadnezzar's army came, Lachish and Azekah were the last fortified cities of Judah left besides Jerusalem. The Lachish letters, ink-written potsherds, most of them found in 1935, come from those days: in one an officer writes that they are watching for the fire signals of Lachish, because they cannot see Azekah. The Babylonians took and burned the city in 587 or 586 BC."
    - "After the exile Jews settled again at Lachish and its fields, as Nehemiah records. In the Persian period a large residence stood on the mound; a small temple there, the so-called Solar Shrine, is dated by some to the Persian and by others to the Hellenistic period. Afterwards the mound was abandoned. In Eusebius' day there was a village of Lachish seven miles from Eleutheropolis toward the Daroma, the south country."
  ru:
    - "Лахис лежит в Шефеле, низких холмах между Иудейскими горами и приморской равниной, примерно в 45 км к юго-западу от Иерусалима, на холме Телль-эд-Дувейр. В среднем и позднем бронзовом веке здесь стоял большой ханаанский город. Среди амарнских писем XIV века до н. э. есть письма фараону от его правителей Иабни-илу, Зимредды и Шипти-Баала. В XII веке до н. э. город позднего бронзового века сгорел, и потом долгое время холм был заселён лишь редко."
    - "Иисус Навин взял Лахис, царь которого Яфий примкнул к союзу против Гаваона. Ровоам укрепил его, а царь Амасия бежал сюда от заговора в Иерусалиме и был здесь умерщвлён. Лахис стал самым сильным городом Иудеи после Иерусалима. В 701 г. до н. э. его осадил ассирийский царь Сеннахирим и из Лахиса послал своих военачальников к Езекии в Иерусалим. В Ниневии он украсил один из залов своего дворца рельефами осады с надписью о том, что добыча Лахиса проходила перед ним. Археологи нашли сожжённый в то время город и ассирийскую осадную насыпь — единственную найденную до сих пор."
    - "Когда пришло войско Навуходоносора, Лахис и Азека были последними укреплёнными городами Иудеи, кроме Иерусалима. Из этих дней — лахисские письма, черепки с надписями чернилами, большей частью найденные в 1935 г.: в одном из них военачальник пишет, что они следят за сигнальными огнями Лахиса, потому что не видят Азеки. Вавилоняне взяли и сожгли город в 587 или 586 г. до н. э."
    - "После плена иудеи снова поселились в Лахисе и на полях его, как сообщает Неемия. В персидское время на холме стояла большая резиденция; небольшое святилище, так называемый Храм Солнца, одни относят к персидскому, другие к эллинистическому времени. Потом холм опустел. Во времена Евсевия селение Лахис находилось в семи милях от Елевферополя по направлению к Дароме, южной земле."
