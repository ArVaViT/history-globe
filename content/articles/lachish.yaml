# Overview article (ADR 0007). Mainstream facts only; disputed datings are named as such.
id: lachish
place: a3cc590
title:
  en: "Lachish"
  ru: "Лахис"
  uk: "Лахіш"
  es: "Laquis"
  pt: "Laquis"
  de: "Lachisch"
  fr: "Lakis"
  it: "Lachis"
  pl: "Lakisz"
  nl: "Lachis"
  cs: "Lachiš"
body:
  en:
    - "Lachish lies in the Shephelah, the low hills between the Judaean highlands and the coastal plain, about 45 km southwest of Jerusalem, on the mound of Tell ed-Duweir. A large Canaanite city stood here in the Middle and Late Bronze Ages. Among the Amarna letters of the fourteenth century BC are letters to Pharaoh from its rulers Yabni-ilu, Zimredda and Shipti-Baal. The Late Bronze city was burned in the twelfth century BC, and for a long time afterwards the mound was only thinly settled."
    - "Joshua took Lachish, whose king Japhia had joined the league against Gibeon. Rehoboam fortified it, and King Amaziah fled there from a conspiracy in Jerusalem and was killed there. Lachish became the strongest city of Judah after Jerusalem. In 701 BC Sennacherib of Assyria besieged it, and from Lachish he sent his officers to Hezekiah in Jerusalem. At Nineveh he lined a room of his palace with reliefs of the siege, with a caption saying that the booty of Lachish passed before him. Excavators found the city burned at that time and the Assyrian siege ramp, the only one yet found."
    - "When Nebuchadnezzar's army came, Lachish and Azekah were the last fortified cities of Judah left besides Jerusalem. The Lachish letters, ink-written potsherds, most of them found in 1935, come from those days: in one an officer writes that they are watching for the fire signals of Lachish, because they cannot see Azekah. The Babylonians took and burned the city in 587 or 586 BC."
    - "After the exile Jews settled again at Lachish and its fields, as Nehemiah records. In the Persian period a large residence stood on the mound; a small temple there, the so-called Solar Shrine, is dated by some to the Persian and by others to the Hellenistic period. Afterwards the mound was abandoned. In Eusebius' day there was a village of Lachish seven miles from Eleutheropolis toward the Daroma, the south country."
  ru:
    - "Лахис лежит в Шефеле, низких холмах между Иудейскими горами и приморской равниной, примерно в 45 км к юго-западу от Иерусалима, на холме Телль-эд-Дувейр. В среднем и позднем бронзовом веке здесь стоял большой ханаанский город. Среди амарнских писем XIV века до н. э. есть письма фараону от его правителей Иабни-илу, Зимредды и Шипти-Баала. В XII веке до н. э. город позднего бронзового века сгорел, и потом долгое время холм был заселён лишь редко."
    - "Иисус Навин взял Лахис, царь которого Яфий примкнул к союзу против Гаваона. Ровоам укрепил его, а царь Амасия бежал сюда от заговора в Иерусалиме и был здесь умерщвлён. Лахис стал самым сильным городом Иудеи после Иерусалима. В 701 г. до н. э. его осадил ассирийский царь Сеннахирим и из Лахиса послал своих военачальников к Езекии в Иерусалим. В Ниневии он украсил один из залов своего дворца рельефами осады с надписью о том, что добыча Лахиса проходила перед ним. Археологи нашли сожжённый в то время город и ассирийскую осадную насыпь — единственную найденную до сих пор."
    - "Когда пришло войско Навуходоносора, Лахис и Азека были последними укреплёнными городами Иудеи, кроме Иерусалима. Из этих дней — лахисские письма, черепки с надписями чернилами, большей частью найденные в 1935 г.: в одном из них военачальник пишет, что они следят за сигнальными огнями Лахиса, потому что не видят Азеки. Вавилоняне взяли и сожгли город в 587 или 586 г. до н. э."
    - "После плена иудеи снова поселились в Лахисе и на полях его, как сообщает Неемия. В персидское время на холме стояла большая резиденция; небольшое святилище, так называемый Храм Солнца, одни относят к персидскому, другие к эллинистическому времени. Потом холм опустел. Во времена Евсевия селение Лахис находилось в семи милях от Елевферополя по направлению к Дароме, южной земле."
  uk:
    - "Лахіш лежить у Шефелі, низьких пагорбах між Юдейським нагір’ям і прибережною рівниною, приблизно за 45 км на південний захід від Єрусалима, на пагорбі Телль-ед-Дувейр. У середню й пізню бронзову добу тут стояло велике ханаанське місто. Серед амарнських листів XIV ст. до н. е. є листи до фараона від його правителів Ябні-ілу, Зімрідди та Шипті-Баала. Місто пізньої бронзової доби було спалене у XII ст. до н. е., і довгий час після цього пагорб був заселений лише слабо."
    - "Ісус Навин узяв Лахіш, чий цар Яфія приєднався до союзу проти Гаваона. Ровоам його укріпив, а цар Амасія втік туди від змови в Єрусалимі й був там убитий. Лахіш став найсильнішим містом Юди після Єрусалима. У 701 р. до н. е. Сінаххеріб Ассирійський облягав його, і з Лахіша він послав своїх урядовців до Єзекії в Єрусалим. У Ніневії він оздобив кімнату свого палацу рельєфами облоги з написом, що здобич Лахіша проходить перед ним. Розкопувачі знайшли місто, спалене в той час, і ассирійський облоговий вал, єдиний, знайдений досі."
    - "Коли прийшло військо Навуходоносора, Лахіш і Азека були останніми укріпленими містами Юди, що залишалися, окрім Єрусалима. З тих днів походять лахішські листи, написані чорнилом на черепках, більшість яких знайдено 1935 р.: в одному з них офіцер пише, що вони стежать за вогняними сигналами Лахіша, бо не можуть побачити Азеки. Вавилоняни взяли й спалили місто в 587 або 586 р. до н. е."
    - "Після полону юдеї знову оселилися в Лахіші та його полях, як записує Неемія. У перську добу на пагорбі стояла велика резиденція; невелика святиня там, так звана Сонячна святиня, датується одними перською, іншими — елліністичною добою. Потім пагорб було покинуто. За Євсевія було село Лахіш за сім миль від Елевтерополя в бік Дароми, південного краю."
  es:
    - "Laquis se encuentra en la Sefelá, las colinas bajas entre la sierra de Judea y la llanura costera, a unos 45 km al sudoeste de Jerusalén, en el montículo de Tell ed-Duweir. Aquí se alzó una gran ciudad cananea en las edades del Bronce Medio y del Bronce Final. Entre las cartas de Amarna del siglo XIV a. C. hay cartas al faraón de sus gobernantes Yabni-ilu, Zimredda y Shipti-Baal. La ciudad del Bronce Final fue incendiada en el siglo XII a. C., y durante mucho tiempo después el montículo estuvo poco poblado."
    - "Josué tomó Laquis, cuyo rey, Jafía, se había unido a la liga contra Gabaón. Roboam la fortificó, y el rey Amasías huyó allí de una conspiración en Jerusalén y fue muerto en ella. Laquis llegó a ser la ciudad más fuerte de Judá después de Jerusalén. En 701 a. C. Senaquerib de Asiria la sitió, y desde Laquis envió a sus oficiales a Ezequías, en Jerusalén. En Nínive revistió una sala de su palacio con relieves del asedio, con un epígrafe que dice que el botín de Laquis desfilaba ante él. Los excavadores hallaron la ciudad incendiada en aquel momento y la rampa de asedio asiria, la única hallada hasta ahora."
    - "Cuando llegó el ejército de Nabucodonosor, Laquis y Azeca eran las últimas ciudades fortificadas de Judá, además de Jerusalén. Las cartas de Laquis, tiestos escritos con tinta, la mayoría hallados en 1935, proceden de esos días: en una, un oficial escribe que vigilan las señales de fuego de Laquis, porque no pueden ver Azeca. Los babilonios tomaron e incendiaron la ciudad en 587 o 586 a. C."
    - "Después del destierro, los judíos se establecieron de nuevo en Laquis y sus campos, como registra Nehemías. En el período persa se alzaba en el montículo una gran residencia; un pequeño templo allí, el llamado Santuario Solar, es fechado por unos en el período persa y por otros en el helenístico. Después el montículo fue abandonado. En tiempos de Eusebio había una aldea de Laquis a siete millas de Eleuterópolis, hacia el Daroma, la región del sur."
  pt:
    - "Laquis fica na Sefelá, as colinas baixas entre as terras altas de Judá e a planície costeira, a cerca de 45 km a sudoeste de Jerusalém, no montículo de Tell ed-Duweir. Uma grande cidade cananeia ergueu-se ali nas Idades do Bronze Médio e Recente. Entre as cartas de Amarna do século XIV a.C. há cartas ao faraó de seus governantes Yabni-ilu, Zimredda e Shipti-Baal. A cidade do Bronze Recente foi queimada no século XII a.C., e por muito tempo depois o montículo foi apenas escassamente habitado."
    - "Josué tomou Laquis, cujo rei Jáfia se unira à liga contra Gibeão. Roboão a fortificou, e o rei Amazias fugiu para lá de uma conspiração em Jerusalém e ali foi morto. Laquis tornou-se a cidade mais forte de Judá depois de Jerusalém. Em 701 a.C. Senaqueribe da Assíria a sitiou, e de Laquis enviou seus oficiais a Ezequias em Jerusalém. Em Nínive revestiu uma sala de seu palácio com relevos do cerco, com uma legenda dizendo que o butim de Laquis desfilava diante dele. Os escavadores encontraram a cidade queimada nessa época e a rampa de cerco assíria, a única já encontrada."
    - "Quando veio o exército de Nabucodonosor, Laquis e Azeca eram as últimas cidades fortificadas de Judá além de Jerusalém. As cartas de Laquis, cacos escritos a tinta, a maioria encontrados em 1935, vêm desses dias: em uma, um oficial escreve que vigiam os sinais de fogo de Laquis, porque não conseguem ver Azeca. Os babilônios tomaram e queimaram a cidade em 587 ou 586 a.C."
    - "Depois do exílio, judeus se estabeleceram de novo em Laquis e seus campos, como registra Neemias. No período persa havia uma grande residência no montículo; um pequeno templo ali, o chamado Santuário Solar, é datado por alguns do período persa e por outros do helenístico. Depois, o montículo foi abandonado. No tempo de Eusébio havia uma aldeia de Laquis a sete milhas de Eleuterópolis rumo ao Daroma, a região do sul."
  de:
    - "Lachisch liegt in der Schefela, dem niedrigen Hügelland zwischen dem judäischen Bergland und der Küstenebene, etwa 45 km südwestlich von Jerusalem, auf dem Hügel Tell ed-Duweir. Eine große kanaanäische Stadt stand hier in der Mittel- und Spätbronzezeit. Unter den Amarna-Briefen des 14. Jahrhunderts v. Chr. sind Briefe an den Pharao von seinen Herrschern Jabni-ilu, Zimredda und Schipti-Baal. Die spätbronzezeitliche Stadt wurde im 12. Jahrhundert v. Chr. niedergebrannt, und lange danach war der Hügel nur dünn besiedelt."
    - "Josua nahm Lachisch ein, dessen König Jafia sich dem Bund gegen Gibeon angeschlossen hatte. Rehabeam befestigte es, und König Amazja floh vor einer Verschwörung in Jerusalem dorthin und wurde dort getötet. Lachisch wurde nach Jerusalem zur stärksten Stadt Judas. 701 v. Chr. belagerte Sanherib von Assyrien es, und von Lachisch schickte er seine Offiziere zu Hiskia nach Jerusalem. In Ninive ließ er einen Saal seines Palastes mit Reliefs der Belagerung auskleiden, mit einer Beischrift, dass die Beute von Lachisch vor ihm vorüberzog. Die Ausgräber fanden die Stadt damals niedergebrannt und die assyrische Belagerungsrampe, die bisher einzige gefundene."
    - "Als das Heer Nebukadnezars kam, waren Lachisch und Aseka die letzten befestigten Städte Judas außer Jerusalem. Aus jenen Tagen stammen die Lachisch-Briefe, mit Tinte beschriebene Tonscherben, die meisten 1935 gefunden: In einem schreibt ein Offizier, man halte Ausschau nach den Feuerzeichen von Lachisch, weil man Aseka nicht sehen könne. Die Babylonier nahmen die Stadt 587 oder 586 v. Chr. ein und brannten sie nieder."
    - "Nach dem Exil siedelten Juden wieder in Lachisch und auf seinem Feld, wie Nehemia berichtet. In der Perserzeit stand auf dem Hügel eine große Residenz; ein kleines Heiligtum dort, das sogenannte Sonnenheiligtum, wird von manchen in die persische, von anderen in die hellenistische Zeit datiert. Danach wurde der Hügel aufgegeben. Zur Zeit des Eusebius gab es ein Dorf Lachisch sieben Meilen von Eleutheropolis in Richtung Daroma, des Südlandes."
  fr:
    - "Lakis se trouve dans la Shéphéla, les basses collines entre les hautes terres de Juda et la plaine côtière, à environ 45 km au sud-ouest de Jérusalem, sur le tertre de Tell ed-Duweir. Une grande ville cananéenne s’y dressait aux âges du Bronze moyen et récent. Parmi les lettres d’Amarna du XIVe siècle av. J.-C. figurent des lettres adressées au pharaon par ses souverains Yabni-ilu, Zimredda et Shipti-Baal. La ville du Bronze récent fut incendiée au XIIe siècle av. J.-C., et longtemps après le tertre ne fut que faiblement peuplé."
    - "Josué prit Lakis, dont le roi Japhia s’était joint à la ligue contre Gabaon. Roboam la fortifia, et le roi Amatsia s’y réfugia devant une conspiration à Jérusalem et y fut tué. Lakis devint la plus forte ville de Juda après Jérusalem. En 701 av. J.-C., Sanchérib d’Assyrie l’assiégea, et c’est de Lakis qu’il envoya ses officiers à Ézéchias, à Jérusalem. À Ninive, il fit couvrir une salle de son palais de reliefs du siège, avec une légende disant que le butin de Lakis défilait devant lui. Les fouilleurs ont trouvé la ville incendiée à cette époque, ainsi que la rampe d’assaut assyrienne, la seule découverte jusqu’ici."
    - "Quand vint l’armée de Nebucadnetsar, Lakis et Azéka étaient les dernières villes fortifiées de Juda restant avec Jérusalem. Les lettres de Lakis, tessons écrits à l’encre, la plupart trouvés en 1935, datent de ces jours : dans l’une, un officier écrit qu’on guette les signaux de feu de Lakis, parce qu’on ne voit plus Azéka. Les Babyloniens prirent et incendièrent la ville en 587 ou 586 av. J.-C."
    - "Après l’exil, des Juifs se réinstallèrent à Lakis et dans ses campagnes, comme le relève Néhémie. À l’époque perse, une grande résidence se dressait sur le tertre ; un petit temple, le prétendu Sanctuaire solaire, est daté par les uns de l’époque perse et par les autres de l’époque hellénistique. Puis le tertre fut abandonné. Du temps d’Eusèbe, il y avait un village de Lakis à sept milles d’Éleuthéropolis, vers le Daroma, le pays du sud."
  it:
    - "Lachis si trova nella Sefela, le basse colline tra l’altopiano della Giudea e la pianura costiera, a circa 45 km a sud-ovest di Gerusalemme, sul tell di Tell ed-Duweir. Una grande città cananea sorgeva qui nel Bronzo Medio e nel Bronzo Tardo. Tra le lettere di Amarna del XIV secolo a.C. vi sono lettere al faraone dei suoi sovrani Yabni-ilu, Zimredda e Shipti-Baal. La città del Bronzo Tardo fu bruciata nel XII secolo a.C., e per molto tempo dopo il tell fu abitato solo scarsamente."
    - "Giosuè prese Lachis, il cui re Iafia si era unito alla lega contro Gabaon. Roboamo la fortificò, e il re Amazia fuggì là da una congiura a Gerusalemme e vi fu ucciso. Lachis divenne la città più forte di Giuda dopo Gerusalemme. Nel 701 a.C. Sennacherib d’Assiria l’assediò, e da Lachis mandò i suoi ufficiali a Ezechia a Gerusalemme. A Ninive rivestì una sala del suo palazzo di rilievi dell’assedio, con una didascalia che dice che il bottino di Lachis sfilava davanti a lui. Gli scavatori hanno trovato la città bruciata in quel tempo e la rampa d’assedio assira, l’unica finora scoperta."
    - "Quando venne l’esercito di Nabucodonosor, Lachis e Azeka erano le ultime città fortificate di Giuda rimaste oltre a Gerusalemme. Le lettere di Lachis, cocci scritti a inchiostro, per lo più trovati nel 1935, risalgono a quei giorni: in una un ufficiale scrive che osservano i segnali di fuoco di Lachis, perché non riescono a vedere Azeka. I Babilonesi presero e bruciarono la città nel 587 o 586 a.C."
    - "Dopo l’esilio gli ebrei si stabilirono di nuovo a Lachis e nei suoi campi, come registra Neemia. In età persiana sul tell sorgeva una grande residenza; un piccolo tempio, il cosiddetto Santuario Solare, è datato da alcuni al periodo persiano e da altri a quello ellenistico. In seguito il tell fu abbandonato. Ai tempi di Eusebio c’era un villaggio di Lachis a sette miglia da Eleuteropoli verso il Daroma, il paese meridionale."
  pl:
    - "Lakisz leży w Szefeli, niskich wzgórzach między Wyżyną Judzką a równiną nadmorską, około 45 km na południowy zachód od Jerozolimy, na kopcu Tell ed-Duweir. Duże kananejskie miasto stało tu w środkowej i późnej epoce brązu. Wśród listów z Amarna z XIV w. p.n.e. są listy do faraona od jego władców Jabni-ilu, Zimredy i Szipti-Baala. Miasto z późnej epoki brązu spłonęło w XII w. p.n.e., a przez długi czas potem kopiec był zaludniony tylko rzadko."
    - "Jozue zdobył Lakisz, którego król Jafia przyłączył się do ligi przeciw Gibeonowi. Roboam je ufortyfikował, a król Amazjasz uciekł tam przed spiskiem w Jerozolimie i został tam zabity. Lakisz stał się najsilniejszym miastem Judy po Jerozolimie. W 701 r. p.n.e. oblegał je Sennacheryb Asyryjski i z Lakisz wysłał swoich dowódców do Ezechiasza w Jerozolimie. W Niniwie wyłożył jedną salę swego pałacu reliefami oblężenia, z podpisem, że łup z Lakisz przechodził przed nim. Archeolodzy znaleźli miasto spalone w tym czasie oraz asyryjską rampę oblężniczą, jedyną dotąd znalezioną."
    - "Gdy nadeszło wojsko Nabuchodonozora, Lakisz i Azeka były ostatnimi warownymi miastami Judy, poza Jerozolimą. Z tamtych dni pochodzą listy z Lakisz, napisane atramentem na skorupach, w większości znalezione w 1935 r.: w jednym oficer pisze, że wypatrują sygnałów ogniowych z Lakisz, bo nie widzą Azeki. Babilończycy zdobyli i spalili miasto w 587 lub 586 r. p.n.e."
    - "Po niewoli Żydzi osiedlili się znów w Lakisz i na jego polach, jak zapisuje Nehemiasz. W okresie perskim na kopcu stała duża rezydencja; mała świątynia tam, tak zwane Sanktuarium Słoneczne, jest datowana przez jednych na okres perski, a przez innych na hellenistyczny. Potem kopiec opuszczono. W czasach Euzebiusza była wieś Lakisz siedem mil od Eleuteropolis w kierunku Daromy, kraju południowego."
  nl:
    - "Lachis ligt in de Sefela, de lage heuvels tussen het Judese bergland en de kustvlakte, ongeveer 45 km ten zuidwesten van Jeruzalem, op de heuvel Tell ed-Duweir. Hier stond in de midden- en late bronstijd een grote Kanaänitische stad. Onder de Amarnabrieven uit de veertiende eeuw v.Chr. bevinden zich brieven aan de farao van haar heersers Yabni-ilu, Zimredda en Shipti-Baal. De stad uit de late bronstijd werd in de twaalfde eeuw v.Chr. verbrand, en lange tijd daarna was de heuvel maar dun bewoond."
    - "Jozua nam Lachis in, waarvan de koning Jafia zich bij het verbond tegen Gibeon had aangesloten. Rehabeam versterkte het, en koning Amazia vluchtte erheen voor een samenzwering in Jeruzalem en werd er gedood. Lachis werd na Jeruzalem de sterkste stad van Juda. In 701 v.Chr. belegerde Sanherib van Assyrië haar, en vanuit Lachis zond hij zijn hoge officieren naar Chizkia in Jeruzalem. In Nineve bekleedde hij een zaal van zijn paleis met reliëfs van het beleg, met een bijschrift dat de buit van Lachis voor hem voorbijtrok. Opgravers vonden de stad toen verbrand en de Assyrische belegeringshelling, de enige die tot nu toe is gevonden."
    - "Toen het leger van Nebukadnessar kwam, waren Lachis en Azeka de laatste versterkte steden van Juda behalve Jeruzalem. De brieven van Lachis, met inkt beschreven potscherven, de meeste gevonden in 1935, komen uit die dagen: in een ervan schrijft een officier dat ze uitkijken naar de vuursignalen van Lachis, omdat ze Azeka niet kunnen zien. De Babyloniërs namen de stad in en verbrandden haar in 587 of 586 v.Chr."
    - "Na de ballingschap vestigden joden zich opnieuw in Lachis en zijn velden, zoals Nehemia vermeldt. In de Perzische tijd stond er een grote residentie op de heuvel; een kleine tempel daar, het zogenoemde Zonneheiligdom, wordt door sommigen in de Perzische en door anderen in de hellenistische tijd gedateerd. Daarna werd de heuvel verlaten. In de tijd van Eusebius was er een dorp Lachis, zeven mijl van Eleutheropolis in de richting van de Daroma, het zuidland."
  cs:
    - "Lachiš leží v Šefele, nízkých pahorcích mezi judskou vysočinou a pobřežní rovinou, asi 45 km jihozápadně od Jeruzaléma, na pahorku Tell ed-Duweir. Ve střední a pozdní době bronzové tu stálo velké kanaánské město. Mezi amarnskými dopisy ze 14. století př. n. l. jsou dopisy faraonovi od jeho vládců Jabni-ilua, Zimreddy a Šipti-Baala. Město z pozdní doby bronzové bylo spáleno ve 12. století př. n. l. a po dlouhou dobu poté byl pahorek osídlen jen řídce."
    - "Jozue dobyl Lachiš, jehož král Jafia se připojil ke spolku proti Gibeonu. Rechabeám jej opevnil a král Amacjáš tam utekl před spiknutím v Jeruzalémě a byl tam zabit. Lachiš se stal nejsilnějším městem Judy po Jeruzalémě. Roku 701 př. n. l. jej oblehl Senacherib Asyrský a z Lachiše poslal své důstojníky k Chizkijášovi do Jeruzaléma. V Ninive vyzdobil jednu síň svého paláce reliéfy obléhání, s nápisem, že kořist z Lachiše procházela před ním. Archeologové našli město tehdy vypálené i asyrský obléhací val, jediný dosud nalezený."
    - "Když přitáhlo Nebukadnesarovo vojsko, byly Lachiš a Azeka posledními opevněnými městy Judy kromě Jeruzaléma. Z oněch dnů pocházejí Lachišské dopisy, inkoustem psané střepy, většinou nalezené roku 1935: v jednom z nich důstojník píše, že hlídají ohňová znamení z Lachiše, protože nevidí Azeku. Babyloňané město dobyli a vypálili roku 587 nebo 586 př. n. l."
    - "Po exilu se Židé v Lachiši a na jeho polích usadili znovu, jak zaznamenává Nehemjáš. V perském období stála na pahorku velká rezidence; malý chrám tam, takzvaná Sluneční svatyně, datují jedni do doby perské a jiní do helénistické. Poté byl pahorek opuštěn. Za Eusebia tam byla vesnice Lachiš sedm mil od Eleutheropole směrem k Daromě, jižní zemi."
