# Overview article (ADR 0007). Mainstream facts only; Tell Abu Zarad is the usual identification and the site is known from surveys alone; the reading Tappuah for Tiphsah in 2 Kings 15:16 is given as a reading, not as fact.
id: tappuah
place: a03be2e
title:
  en: "Tappuah"
  ru: "Таппуах"
