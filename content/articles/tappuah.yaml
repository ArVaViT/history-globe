body:
  en:
    - "Tappuah, “apple” or “apricot”, was a Canaanite royal town on the border between Ephraim and Manasseh in the central hills. It is generally identified with Tell Abu Zarad, a mound beside the village of Yasuf about 13 km south of Shechem; the spring Ain et-Tuffah below it keeps the name and answers to the biblical En-tappuah, “the spring of Tappuah”. The mound is known from surface survey, and its pottery points to a town in the Middle Bronze Age and again in the Iron Age. It is to be kept apart from the Tappuah in the lowland of Judah and from Beth-tappuah near Hebron."
    - "The list of kings whom Joshua defeated west of the Jordan counts “the king of Tappuah, one; the king of Hepher, one”. In the description of the tribal lands the border of Ephraim “went out from Tappuah westward unto the river Kanah”, and Joshua 17 draws the line with care: “Manasseh had the land of Tappuah: but Tappuah on the border of Manasseh belonged to the children of Ephraim”, the town on one side and its fields on the other. Many scholars also read Tappuah, with a Greek text of Kings, in 2 Kings 15:16, where the Hebrew has Tiphsah on the Euphrates: the town that Menahem sacked, starting out from Tirzah, when he seized the throne in Samaria, about 750 BC."
    - "Nothing more is heard of it. Today the mound stands above Yasuf in the West Bank, south of Nablus, among olive groves, and the spring still waters the village below."
  ru:
    - "Таппуах, «яблоко» или «абрикос», был ханаанским царским городом на границе Ефрема и Манассии в центральном нагорье. Его обычно отождествляют с Телль-Абу-Зарадом — холмом у деревни Ясуф примерно в 13 км к югу от Сихема; источник Айн-эт-Туффах под ним хранит имя и отвечает библейскому Ен-Таппуаху, «источнику Таппуаха». Холм известен по обследованию поверхности, и его керамика указывает на город в среднем бронзовом веке и снова в железном. Его нужно отличать от Таппуаха на низменности Иуды и от Беф-Таппуаха близ Хеврона."
    - "Список царей, которых Иисус Навин поразил к западу от Иордана, считает: «один царь Таппуаха, один царь Хефера». В описании уделов «от Таппуаха идет предел к морю, к потоку Кане», а 17-я глава проводит черту со всей точностью: «Земля Таппуах досталась Манассии, а город Таппуах у предела Манассиина — сынам Ефремовым», город по одну сторону, его поля по другую. Многие учёные читают Таппуах, вслед за греческим текстом книги Царств, и в 4 Цар 15:16, где еврейский текст называет Типсах на Евфрате: это город, который Менаим разорил, выступив из Фирцы, когда захватил престол в Самарии, около 750 г. до н. э."
    - "Больше о нём ничего не слышно. Сегодня холм стоит над Ясуфом на Западном берегу, южнее Наблуса, среди оливковых рощ, а источник по-прежнему поит деревню внизу."
  uk:
    - "Таппуах, «яблуко» або «абрикос», був ханаанським царським містом на межі Єфрема й Манасії в центральних пагорбах. Його зазвичай ототожнюють із Телль-Абу-Зарадом, пагорбом біля села Ясуф приблизно за 13 км на південь від Сихема; джерело Айн-ет-Туффах під ним зберігає назву й відповідає біблійному Ен-Таппуаху, «джерелу Таппуаха». Пагорб відомий з поверхневого обстеження, і його кераміка вказує на місто в середню бронзову добу й знову в залізну. Його слід відрізняти від Таппуаха в низовині Юди та від Бет-Таппуаха поблизу Хеврона."
    - "У переліку царів, яких Ісус Навин переміг на захід від Йордану, значиться «Царь Таппуахський, один; царь Хеферський, один». В описі земель колін межа Єфрема «Від Таппуаха йде … на захід сонця до річки Кана», а Ісус Навин 17 проводить лінію ретельно: «Земля ж Таппуах дісталась Манассії, а місто Таппуах на самій гряницї Манассїєвій допавсь Ефраїміям» — місто з одного боку, а його поля з другого. Багато вчених читають Таппуах також, за грецьким текстом Царів, у 2 Цар. 15:16, де староєврейський текст має Тіфсах на Євфраті: місто, яке Менаім спустошив, вирушивши з Тірци, коли захопив трон у Самарії близько 750 р. до н. е."
    - "Більше про нього нічого не чути. Нині пагорб здіймається над Ясуфом на Західному березі, на південь від Наблуса, серед оливкових гаїв, і джерело й досі напуває село внизу."
  es:
    - "Tapúa, «manzana» o «albaricoque», era una ciudad real cananea en la frontera entre Efraín y Manasés, en las colinas centrales. Se identifica generalmente con Tell Abu Zarad, un montículo junto a la aldea de Yasuf, a unos 13 km al sur de Siquem; la fuente Ain et-Tuffah, bajo él, conserva el nombre y corresponde a la bíblica En-tapúa, «la fuente de Tapúa». El montículo se conoce por prospección de superficie, y su cerámica apunta a una ciudad en el Bronce Medio y de nuevo en la Edad del Hierro. Debe distinguirse de la Tapúa de la llanura de Judá y de Bet-tapúa, cerca de Hebrón."
    - "La lista de los reyes que Josué derrotó al oeste del Jordán cuenta «El rey de Tappua, otro: el rey de Hepher, otro». En la descripción de las tierras de las tribus, la frontera de Efraín «de Tappua torna este término hacia la mar al arroyo de Cana», y Josué 17 traza la línea con cuidado: «la tierra de Tappua fué de Manasés; pero Tappua, que está junto al término de Manasés, es de los hijos de Ephraim», la ciudad por un lado y sus campos por el otro. Muchos estudiosos leen también Tapúa, con un texto griego de Reyes, en 2 Reyes 15:16, donde el hebreo tiene Tifsa, junto al Éufrates: la ciudad que Manahem saqueó, partiendo de Tirsa, cuando se apoderó del trono en Samaria, hacia 750 a. C."
    - "No se oye hablar más de ella. Hoy el montículo se alza sobre Yasuf, en Cisjordania, al sur de Nablus, entre olivares, y la fuente aún riega la aldea que hay debajo."
  pt:
    - "Tapua, “maçã” ou “damasco”, era uma cidade real cananeia na fronteira entre Efraim e Manassés, nas colinas centrais. É geralmente identificada com Tell Abu Zarad, um monte junto à aldeia de Yasuf, cerca de 13 km ao sul de Siquém; a fonte Ain et-Tuffah, abaixo dele, conserva o nome e corresponde à En-Tapua bíblica, “a fonte de Tapua”. O monte é conhecido por prospecção de superfície, e sua cerâmica indica uma cidade na Idade do Bronze Médio e de novo na Idade do Ferro. Deve ser distinguida da Tapua na planície de Judá e de Bete-Tapua, perto de Hebrom."
    - "A lista dos reis que Josué derrotou a oeste do Jordão conta “o rei de Tapua, um; o rei de Héfer, um”. Na descrição das terras tribais, lê-se sobre a fronteira de Efraim: “De Tapua a fronteira seguiu para o oeste até o ribeiro de Caná”; e Josué 17 traça a linha com cuidado: “A terra de Tapua pertencia a Manassés; mas Tapua, na fronteira de Manassés, pertencia aos filhos de Efraim”, a cidade de um lado e seus campos do outro. Muitos estudiosos leem também Tapua, com um texto grego de Reis, em 2 Reis 15:16, onde o hebraico tem Tifsa, no Eufrates: a cidade que Menaém saqueou, partindo de Tirza, quando tomou o trono em Samaria, por volta de 750 a.C."
    - "Nada mais se ouve dela. Hoje o monte se ergue sobre Yasuf, na Cisjordânia, ao sul de Nablus, entre olivais, e a fonte ainda rega a aldeia abaixo."
  de:
    - "Tappuach, „Apfel“ oder „Aprikose“, war eine kanaanäische Königsstadt an der Grenze zwischen Ephraim und Manasse im zentralen Bergland. Sie wird meist mit Tell Abu Zarad gleichgesetzt, einem Hügel neben dem Dorf Yasuf etwa 13 km südlich von Sichem; die Quelle Ain et-Tuffah unterhalb davon bewahrt den Namen und entspricht dem biblischen En-Tappuach, „der Quelle von Tappuach“. Der Hügel ist durch Oberflächenerkundung bekannt, und seine Keramik weist auf eine Stadt der Mittelbronzezeit und wieder der Eisenzeit. Zu unterscheiden ist es vom Tappuach in der Tiefebene Judas und von Bet-Tappuach bei Hebron."
    - "Die Liste der Könige, die Josua westlich des Jordans besiegte, zählt „der König zu Thappuah, der König zu Hepher“ auf. In der Beschreibung der Stammesgebiete verlief die Grenze Ephraims: „von Thappuah geht sie abendwärts zum Bach Kana“, und Josua 17 zieht die Linie sorgfältig: „denn das Land Thappuah ward dem Manasse; aber Thappuah an der Grenze Manasses ward den Kindern Ephraim“, die Stadt auf der einen Seite, ihr Land auf der anderen. Viele Forscher lesen mit einem griechischen Text der Könige auch in 2. Könige 15,16 Tappuach, wo der hebräische Text Tifsach am Euphrat hat: die Stadt, die Menahem von Tirza aus plünderte, als er um 750 v. Chr. in Samaria den Thron ergriff."
    - "Weiteres ist von ihm nicht zu hören. Heute steht der Hügel über Yasuf im Westjordanland, südlich von Nablus, zwischen Olivenhainen, und die Quelle bewässert noch das Dorf darunter."
  fr:
    - "Tappuach, « pomme » ou « abricot », était une ville royale cananéenne sur la frontière entre Éphraïm et Manassé, dans les collines du centre. On l’identifie généralement à Tell Abu Zarad, un tertre à côté du village de Yasuf, à environ 13 km au sud de Sichem ; la source Aïn et-Tuffah, en dessous, en garde le nom et correspond à l’En-Tappuach biblique, « la source de Tappuach ». Le tertre est connu par prospection de surface, et sa poterie indique une ville à l’âge du bronze moyen, puis de nouveau à l’âge du fer. Il faut le distinguer de la Tappuach de la plaine de Juda et de Beth-Tappuach près d’Hébron."
    - "La liste des rois vaincus par Josué à l’ouest du Jourdain compte « le roi de Tappuach, un ; le roi de Hépher, un ». Dans la description des territoires tribaux, la frontière d’Éphraïm part de Tappuach : « De Tappuach elle allait vers l’occident au torrent de Kana », et Josué 17 trace la ligne avec soin : « Le pays de Tappuach était aux fils de Manassé, mais Tappuach sur la frontière de Manassé était aux fils d’Éphraïm », la ville d’un côté et ses champs de l’autre. Beaucoup lisent aussi Tappuach, d’après un texte grec des Rois, en 2 Rois 15:16, où l’hébreu a Thiphsach sur l’Euphrate : la ville que Menahem saccagea en partant de Thirtsa, quand il s’empara du trône à Samarie, vers 750 av. J.-C."
    - "On n’en entend plus parler. Aujourd’hui, le tertre domine Yasuf en Cisjordanie, au sud de Naplouse, parmi les oliveraies, et la source arrose toujours le village en contrebas."
  pl:
    - "Tappuach, „jabłko” lub „morela”, było kanaanejskim miastem królewskim na granicy Efraima i Manassesa w centralnych wzgórzach. Utożsamia się je zwykle z Tell Abu Zarad, kopcem obok wsi Jasuf, około 13 km na południe od Sychem; źródło Ajn et-Tuffa poniżej niego zachowuje nazwę i odpowiada biblijnemu En-Tappuach, „źródłu Tappuach”. Kopiec jest znany z badań powierzchniowych, a jego ceramika wskazuje na miasto w średniej epoce brązu i ponownie w epoce żelaza. Należy je odróżniać od Tappuach na nizinie Judy i od Bet-Tappuach koło Hebronu."
    - "Wykaz królów, których Jozue pokonał na zachód od Jordanu, zalicza „Król Taffua jeden; król Hefer jeden”. W opisie ziem plemion granica Efraima „Od Tafua bieży ta granica ku zachodowi do potoku Kana”, a Joz 17 wytycza linię starannie: „Manasesowa była ziemia Tafua; ale Tafua przy granicy Manasesowej była synów Efraimowych”, miasto po jednej stronie, a jego pola po drugiej. Wielu badaczy czyta też Tappuach, za greckim tekstem Ksiąg Królewskich, w 2 Krl 15,16, gdzie hebrajski ma Tifsach nad Eufratem: miasto, które splądrował Menachem, wyruszywszy z Tirsy, gdy zagarniał tron w Samarii, około 750 roku p.n.e."
    - "Nic więcej o nim nie słychać. Dziś kopiec wznosi się nad Jasufem na Zachodnim Brzegu, na południe od Nablusu, wśród gajów oliwnych, a źródło nadal nawadnia wieś poniżej."
  it:
    - "Tappuach, «mela» o «albicocca», era una città reale cananea sul confine fra Efraim e Manasse nelle colline centrali. È generalmente identificata con Tell Abu Zarad, un tell accanto al villaggio di Yasuf, circa 13 km a sud di Sichem; la sorgente Ain et-Tuffah sotto di esso ne conserva il nome e corrisponde alla biblica En-Tappuach, «la sorgente di Tappuach». Il tell è noto da ricognizioni di superficie, e la sua ceramica indica una città nel Bronzo Medio e di nuovo nell’età del Ferro. Va tenuta distinta dalla Tappuach nella pianura di Giuda e da Bet-Tappuach presso Ebron."
    - "L’elenco dei re sconfitti da Giosuè a ovest del Giordano annovera «il re di Tappuah, il re di Hefer». Nella descrizione dei territori tribali il confine di Efraim «da Tappuah … andava verso occidente fino al torrente di Kana», e Giosuè 17 traccia la linea con cura: «Il paese di Tappuah appartenne a Manasse; ma Tappuah sul confine di Manasse appartenne ai figliuoli di Efraim», la città da un lato e i suoi campi dall’altro. Molti studiosi leggono Tappuach, con un testo greco dei Re, anche in 2 Re 15,16, dove l’ebraico ha Tifsach sull’Eufrate: la città che Menachem saccheggiò, partendo da Tirza, quando si impadronì del trono a Samaria, verso il 750 a.C."
    - "Non se ne sente più parlare. Oggi il tell si erge sopra Yasuf, in Cisgiordania, a sud di Nablus, fra uliveti, e la sorgente irriga ancora il villaggio sottostante."
  nl:
    - "Tappuach, “appel” of “abrikoos”, was een Kanaänitische koningsstad op de grens tussen Efraïm en Manasse in de centrale heuvels. Het wordt algemeen vereenzelvigd met Tell Abu Zarad, een heuvel naast het dorp Yasuf, ongeveer 13 km ten zuiden van Sichem; de bron Ain et-Tuffah eronder bewaart de naam en komt overeen met het Bijbelse En-Tappuach, “de bron van Tappuach”. De heuvel is bekend uit oppervlakteonderzoek, en het aardewerk wijst op een stad in de Midden-Bronstijd en opnieuw in de IJzertijd. Het moet worden onderscheiden van het Tappuach in de laagvlakte van Juda en van Beth-Tappuach bij Hebron."
    - "De lijst van koningen die Jozua ten westen van de Jordaan versloeg telt “de koning van Tappuah, een; de koning van Hefer, een”. In de beschrijving van de stamgebieden loopt de grens van Efraïm zo: “Van Tappuah gaat deze landpale westwaarts naar de beek Kana”, en Jozua 17 trekt de lijn nauwkeurig: “Manasse had wel het land van Tappuah, maar Tappuah zelve, aan de landpale van Manasse, hadden de kinderen van Efraim”, de stad aan de ene kant en haar velden aan de andere. Veel geleerden lezen ook Tappuach, met een Griekse tekst van Koningen, in 2 Koningen 15:16, waar het Hebreeuws Tifsach aan de Eufraat heeft: de stad die Menachem plunderde, vertrekkend uit Tirza, toen hij de troon in Samaria greep, omstreeks 750 v.Chr."
    - "Verder wordt er niets van gehoord. Tegenwoordig staat de heuvel boven Yasuf op de Westelijke Jordaanoever, ten zuiden van Nablus, tussen olijfgaarden, en de bron bevloeit nog steeds het dorp beneden."
  cs:
    - "Tapúach, „jablko“ nebo „meruňka“, bylo kanaánské královské město na hranici mezi Efrajimem a Manasesem ve středních kopcích. Obecně je ztotožňováno s Tell Abú Zarad, pahorkem u vesnice Jásúf asi 13 km jižně od Šekemu; pramen Ajn et-Tuffáh pod ním zachovává jméno a odpovídá biblickému Én-tapúach, „pramenu Tapúachu“. Pahorek je znám z povrchového průzkumu a jeho keramika ukazuje na město ve střední době bronzové a znovu v době železné. Je třeba jej odlišit od Tapúachu v nížině Judy a od Bét-tapúachu u Hebronu."
    - "V seznamu králů, které Jozue porazil západně od Jordánu, stojí: „Král Tafua jeden, král Chefer jeden“. V popisu kmenových území se o hranici Efrajimově praví: „Od Tafue meze jde k moři ku potoku Kána“, a Jozue 17 vede hranici pečlivě: „Manassesova zajisté byla země Tafue, ale Tafue podlé pomezí Manassesova jest synů Efraimových“, město na jedné straně a jeho pole na druhé. Mnozí učenci také čtou Tapúach, podle řeckého textu Královských, ve 2. Královské 15,16, kde hebrejština má Tifsach na Eufratu: město, které Menachem vyplenil, když vyšel z Tirsy, když se zmocnil trůnu v Samaří, kolem roku 750 př. n. l."
    - "Nic dalšího se o něm neslyší. Dnes pahorek stojí nad Jásúfem na Západním břehu, jižně od Nábulusu, mezi olivovými háji, a pramen dosud zavlažuje vesnici pod ním."
  sv:
    - "Tappuach, ”äpple” eller ”aprikos”, var en kananeisk kungastad på gränsen mellan Efraim och Manasse i de centrala bergen. Den identifieras allmänt med Tell Abu Zarad, en kulle bredvid byn Yasuf omkring 13 km söder om Shekem; källan Ain et-Tuffah nedanför bevarar namnet och motsvarar den bibliska En-Tappuach, ”Tappuachs källa”. Kullen är känd från ytundersökning, och dess keramik tyder på en stad under mellanbronsåldern och åter under järnåldern. Den ska hållas isär från Tappuach i Judas lågland och från Bet-Tappuach nära Hebron."
    - "Förteckningen över de kungar som Josua besegrade väster om Jordan räknar ”konungen i Tappua en, konungen i Hefer en”. I beskrivningen av stamområdena löper Efraims gräns så här: ”Från Tappua gick gränsen västerut till Kanabäcken”, och Josua 17 drar linjen noggrant: ”Tappuas land tillföll nämligen Manasse, men själva Tappua, inemot Manasse gräns, tillföll Efraims barn”, staden på ena sidan och dess marker på den andra. Många forskare läser också Tappuach, med en grekisk text av Kungaboken, i 2 Kung 15:16, där hebreiskan har Tifsach vid Eufrat: staden som Menachem plundrade, med utgångspunkt i Tirsa, när han grep tronen i Samaria, omkring 750 f.Kr."
    - "Inget mer hörs om den. I dag ligger kullen ovanför Yasuf på Västbanken, söder om Nablus, bland olivlundar, och källan vattnar fortfarande byn nedanför."
  nb:
    - "Tappuah, «eple» eller «aprikos», var en kanaanittisk kongeby på grensen mellom Efraim og Manasse i de sentrale åsene. Den identifiseres vanligvis med Tell Abu Zarad, en haug ved landsbyen Yasuf omkring 13 km sør for Sikem; kilden Ain et-Tuffah under den bevarer navnet og svarer til bibelens En-Tappuah, «Tappuahs kilde». Haugen er kjent fra overflatekartlegging, og keramikken peker mot en by i mellombronsealderen og igjen i jernalderen. Den må holdes atskilt fra Tappuah i Judas lavland og fra Bet-Tappuah nær Hebron."
    - "Listen over kongene Josva slo vest for Jordan regner «kongen i Tappuah én, kongen i Hefer én». I beskrivelsen av stammelandene sies det om Efraim: «Fra Tappuah gikk grensen vestover til Kana-bekken», og Josva 17 trekker linjen nøye: «Manasse fikk Tappuah-landet, men Tappuah selv på grensen av Manasse tilfalt Efra'ims barn», byen på den ene siden og markene på den andre. Mange forskere leser også Tappuah, med en gresk tekst av Kongebøkene, i 2 Kong 15,16, hvor den hebraiske teksten har Tifsah ved Eufrat: byen som Menahem herjet, med utgangspunkt i Tirsa, da han grep tronen i Samaria, omkring 750 f.Kr."
    - "Ingenting mer høres om den. I dag står haugen over Yasuf på Vestbredden, sør for Nablus, blant oliventrær, og kilden vanner fortsatt landsbyen nedenfor."
  tl:
    - "Ang Tappua, “mansanas” o “aprikot”, ay isang maharlikang bayan ng mga Cananeo sa hangganan ng Ephraim at Manases sa gitnang mga burol. Karaniwan itong kinikilala sa Tell Abu Zarad, isang burol sa tabi ng nayon ng Yasuf mga 13 km sa timog ng Sichem; ang bukal na Ain et-Tuffah sa ilalim nito ang nagpapanatili ng pangalan at tumutugon sa En-tappua ng Biblia, “ang bukal ng Tappua”. Kilala ang burol mula sa sarbey sa ibabaw, at ang mga palayok nito ay tumuturo sa isang bayan noong Gitnang Panahong Tanso at muli noong Panahong Bakal. Dapat itong ihiwalay sa Tappua sa mababang lupain ng Juda at sa Beth-tappua malapit sa Hebron."
    - "Binibilang ng talaan ng mga haring tinalo ni Josue sa kanluran ng Jordan ang “hari sa Tappua, isa; ang hari sa Hepher, isa”. Sa paglalarawan ng mga lupain ng mga lipi, ang hangganan ng Ephraim ay “mula sa Tappua ay patuloy ang hangganan sa dakong kalunuran sa batis ng Cana”, at maingat na iginuguhit ng Josue 17 ang guhit: “Ang lupain ng Tappua ay ukol sa Manases: nguni't ang Tappua sa hangganan ng Manases ay ukol sa mga anak ni Ephraim”, ang bayan sa isang panig at ang mga bukid nito sa kabila. Binabasa rin ng maraming iskolar ang Tappua, ayon sa tekstong Griego ng Mga Hari, sa 2 Mga Hari 15:16, kung saan ang Hebreo ay may Tiphsa sa Eufrates: ang bayang nilooban ni Manahem, na umalis mula sa Tirsa, nang agawin niya ang trono sa Samaria, noong mga 750 BK."
    - "Wala nang naririnig tungkol dito. Ngayon ang burol ay nakatayo sa itaas ng Yasuf sa Kanlurang Pampang, sa timog ng Nablus, sa gitna ng mga taniman ng olibo, at dinidiligan pa rin ng bukal ang nayon sa ibaba."
  da:
    - "Tappua, »æble« eller »abrikos«, var en kana'anæisk kongeby på grænsen mellem Efraim og Manasse i de centrale bjerge. Den identificeres almindeligvis med Tell Abu Zarad, en tell ved landsbyen Yasuf omkring 13 km syd for Sikem; kilden Ain et-Tuffah nedenfor den har bevaret navnet og svarer til den bibelske En-Tappua, »Tappuas kilde«. Tellen er kendt fra overfladeundersøgelser, og dens keramik peger på en by i mellembronzealderen og igen i jernalderen. Den skal holdes adskilt fra Tappua i Judas lavland og fra Bet-Tappua nær Hebron."
    - "Listen over de konger, som Josva besejrede vest for Jordan, tæller »Kongen af Thappua een; Kongen af Hefer een«. I beskrivelsen af stammernes land hedder det om Efraims grænse: »Fra Thappua gaar Landemærket i Vester til Bækken Kana«, og Josva 17 trækker linjen omhyggeligt: »Thappua Land hørte Manasse til; men Thappua ved Manasse Landemærke hørte Efraims Børn til«, byen på den ene side og dens marker på den anden. Mange forskere læser også Tappua, med en græsk tekst af Kongebøgerne, i 2 Kong 15,16, hvor den hebraiske tekst har Tifsa ved Eufrat: den by, som Menahem plyndrede, udgående fra Tirsa, da han greb tronen i Samaria omkring 750 f.Kr."
    - "Mere hører man ikke om den. I dag står tellen over Yasuf på Vestbredden, syd for Nablus, mellem oliventræer, og kilden vander stadig landsbyen nedenfor."
