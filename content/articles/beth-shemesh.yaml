body:
  en:
    - 'Beth-shemesh, "house of the sun", is Tel Beth-Shemesh, a low mound in the Sorek valley about 24 km west of Jerusalem, where the hills of Judah come down to the lowland. The nearby ruin of ''Ain Shems kept the old name, and nineteenth-century explorers identified the site from it. The Palestine Exploration Fund dug here from 1911, Elihu Grant of Haverford College from 1928 to 1933, and Shlomo Bunimovitz and Zvi Lederman from 1990. A walled town stood here in the Middle Bronze Age, and in the Late Bronze Age it was a prosperous Canaanite city.'
    - 'In the Book of Joshua Beth-shemesh lies on the border of Judah and is given with its suburbs to the priests, the children of Aaron. When the Philistines sent back the ark of the LORD on a new cart, two milch kine "took the straight way to the way of Beth-shemesh". The people were reaping their wheat harvest in the valley and rejoiced to see it; the cart stopped by a great stone in the field of Joshua the Beth-shemite, the Levites set the ark on the stone, and the kine were offered as a burnt offering. Then the LORD smote the men of Beth-shemesh "because they had looked into the ark" (Josephus counts seventy dead), and they sent to Kiriath-jearim to fetch it away.'
    - "Under Solomon the town belonged to the district of the son of Dekar. At Beth-shemesh Jehoash king of Israel defeated Amaziah king of Judah, took him captive and went on to break down the wall of Jerusalem. The excavators date a destruction of the Judahite town to about 790 BC and tie it to this battle; an archaeomagnetic study of 2022 also placed this destruction early in the eighth century BC. In the days of Ahaz the Philistines took Beth-shemesh. The Iron Age town had a large underground water reservoir. According to the excavators, the town was destroyed in the Assyrian campaign of 701 BC; it was settled again in the seventh century, but it never regained its former importance."
    - "In the early fourth century Eusebius knew Bethsames as a place ten miles from Eleutheropolis on the way to Nicopolis. In the Byzantine period a monastery stood near the mound."
  ru:
    - "Вефсамис, «дом солнца», — это Тель-Бет-Шемеш, невысокий холм в долине Сорек примерно в 24 км к западу от Иерусалима, там, где горы Иудеи спускаются к низменности. Соседние развалины Айн-Шемс сохранили древнее имя, и по нему исследователи XIX века отождествили это место. Палестинский фонд исследований копал здесь с 1911 г., Элиху Грант из Хаверфордского колледжа — с 1928 по 1933 г., а Шломо Бунимовиц и Цви Ледерман — с 1990 г. В среднем бронзовом веке здесь стоял обнесённый стеной город, а в позднем бронзовом веке это был процветающий ханаанский город."
    - "В книге Иисуса Навина Вефсамис стоит на границе Иуды и с предместьями отдан священникам, сынам Аарона. Когда Филистимляне отослали ковчег Господень на новой колеснице, две первородившие коровы «пошли прямо на дорогу к Вефсамису». Жители жали тогда пшеницу в долине и обрадовались, увидев его; колесница остановилась у большого камня на поле Иисуса Вефсамитянина, левиты поставили ковчег на камень, а коров принесли во всесожжение. Тогда Господь поразил жителей Вефсамиса «за то, что они заглядывали в ковчег Господа» (Иосиф Флавий насчитывает семьдесят погибших), и они послали в Кириаф-Иарим, чтобы ковчег забрали."
    - "При Соломоне город входил в округ Бен-Декера. У Вефсамиса Иоас, царь Израильский, разбил Амасию, царя Иудейского, захватил его в плен и затем разрушил стену Иерусалима. Раскопщики датируют разрушение иудейского города около 790 г. до н. э. и связывают его с этой битвой; археомагнитное исследование 2022 г. тоже отнесло это разрушение к началу VIII века до н. э. Во дни Ахаза Филистимляне взяли Вефсамис. В городе железного века был большой подземный водоём. По мнению раскопщиков, город был разрушен в ассирийском походе 701 г. до н. э.; в VII веке здесь снова поселились, но прежнего значения город больше не вернул."
    - "В начале IV века Евсевий знал Вефсамис как место в десяти милях от Елевферополя по дороге в Никополь. В византийское время рядом с холмом стоял монастырь."
  uk:
    - "Бет-Шемеш, «дім сонця», — це Тель-Бет-Шемеш, низький пагорб у долині Сорек приблизно за 24 км на захід від Єрусалима, де пагорби Юди спускаються до низовини. Сусідня руїна Айн-Шемс зберегла давню назву, і дослідники XIX століття ототожнили місце за нею. Фонд дослідження Палестини розкопував тут від 1911 року, Елігу Грант з Гаверфордського коледжу — з 1928 до 1933, а Шломо Буніміц і Цві Ледерман — від 1990. Муроване місто стояло тут у середню бронзову добу, а в пізню бронзову було заможним ханаанським містом."
    - "У книзі Ісуса Навина Бет-Шемеш лежить на кордоні Юди і з передмістями віддається священникам, синам Аарона. Коли филистимляни відіслали ковчег Господній на новому возі, дві дійні корови «побігли просто дорогою на Бетсаміс». Народ жав пшеницю в долині й зрадів, побачивши його; віз зупинився біля великого каменя на полі Ісуса Бет-Шемешанина, левіти поставили ковчег на камінь, а корів принесли на всепалення. Потім Господь убив людей Бет-Шемеша, бо «вони розглядували ковчега Господнього» (Йосиф Флавій нараховує сімдесят убитих), і вони послали до Кіріят-Єаріма забрати його."
    - "За Соломона місто належало до округу сина Декера. У Бет-Шемеші Йоас, цар Ізраїлю, переміг Амассію, царя Юди, узяв його в полон і пішов далі, щоб зруйнувати мур Єрусалима. Розкопники датують руйнування юдейського міста близько 790 р. до н. е. і пов'язують його з цією битвою; археомагнітне дослідження 2022 року теж віднесло це руйнування до початку VIII століття до н. е. За днів Ахаза филистимляни взяли Бет-Шемеш. Місто залізної доби мало велике підземне водосховище. За розкопниками, місто було зруйноване в ассирійському поході 701 р. до н. е.; його знову заселили в VII столітті, але колишнього значення воно вже не здобуло."
    - "На початку IV століття Євсевій знав Бетсамес як місце за десять миль від Елевтеропіля на дорозі до Нікополя. У візантійський період біля пагорба стояв монастир."
  es:
    - "Bet-semes, «casa del sol», es Tel Beth-Shemesh, un bajo montículo en el valle de Sorec a unos 24 km al oeste de Jerusalén, donde las colinas de Judá descienden a la tierra baja. La cercana ruina de 'Ain Shems conservó el antiguo nombre, y los exploradores del siglo XIX identificaron el sitio a partir de él. El Palestine Exploration Fund excavó aquí desde 1911, Elihu Grant, del Haverford College, de 1928 a 1933, y Shlomo Bunimovitz y Zvi Lederman desde 1990. Una ciudad amurallada se alzó aquí en la Edad del Bronce Medio, y en el Bronce Final fue una próspera ciudad cananea."
    - "En el libro de Josué, Bet-semes se halla en la frontera de Judá y es dada con sus ejidos a los sacerdotes, los hijos de Aarón. Cuando los filisteos devolvieron el arca de Jehová en un carro nuevo, dos vacas lecheras «se encaminaron por el camino de Beth-semes». El pueblo segaba su cosecha de trigo en el valle y se alegró al verla; el carro se detuvo junto a una gran piedra en el campo de Josué Beth-semita, los levitas pusieron el arca sobre la piedra, y las vacas fueron ofrecidas en holocausto. Luego Jehová hirió a los hombres de Bet-semes «porque habían mirado en el arca de Jehová» (Josefo cuenta setenta muertos), y enviaron a Quiriat-jearim para que se la llevaran."
    - "Bajo Salomón la ciudad pertenecía al distrito del hijo de Decar. En Bet-semes, Joás, rey de Israel, derrotó a Amasías, rey de Judá, lo hizo prisionero y siguió para derribar la muralla de Jerusalén. Los excavadores fechan una destrucción de la ciudad judaíta hacia 790 a. C. y la vinculan con esta batalla; un estudio arqueomagnético de 2022 situó también esta destrucción a comienzos del siglo VIII a. C. En los días de Acaz los filisteos tomaron Bet-semes. La ciudad de la edad del Hierro tenía un gran depósito de agua subterráneo. Según los excavadores, la ciudad fue destruida en la campaña asiria de 701 a. C.; fue poblada de nuevo en el siglo VII, pero nunca recuperó su antigua importancia."
    - "A principios del siglo IV Eusebio conocía Bethsames como un lugar a diez millas de Eleuterópolis en el camino a Nicópolis. En el período bizantino un monasterio se alzaba cerca del montículo."
  pt:
    - "Bete-Semes, “casa do sol”, é Tel Beth-Shemesh, um montículo baixo no vale de Soreque, cerca de 24 km a oeste de Jerusalém, onde as colinas de Judá descem para a baixada. A ruína vizinha de ʻAin Shems conservou o nome antigo, e exploradores do século XIX identificaram o sítio por ele. O Fundo de Exploração da Palestina escavou aqui a partir de 1911, Elihu Grant, do Haverford College, de 1928 a 1933, e Shlomo Bunimovitz e Zvi Lederman desde 1990. Uma cidade murada existiu aqui no Bronze Médio, e no Bronze Final foi uma próspera cidade cananeia."
    - "No livro de Josué, Bete-Semes fica na fronteira de Judá e é dada com seus arredores aos sacerdotes, filhos de Arão. Quando os filisteus devolveram a arca do SENHOR num carro novo, duas vacas leiteiras “seguiram direto pelo caminho de Bete-Semes”. O povo colhia o trigo no vale e se alegrou ao vê-la; o carro parou junto a uma grande pedra no campo de Josué, de Bete-Semes, os levitas puseram a arca sobre a pedra, e as vacas foram oferecidas em holocausto. Então o SENHOR feriu os homens de Bete-Semes “porque haviam olhado para dentro da arca do SENHOR” (Josefo conta setenta mortos), e eles mandaram a Quiriate-Jearim buscá-la."
    - "Sob Salomão a cidade pertencia ao distrito do filho de Dequer. Em Bete-Semes, Joás, rei de Israel, derrotou Amazias, rei de Judá, tomou-o cativo e foi derrubar a muralha de Jerusalém. Os escavadores datam uma destruição da cidade de Judá por volta de 790 a.C. e a ligam a essa batalha; um estudo arqueomagnético de 2022 também situou essa destruição no início do século VIII a.C. Nos dias de Acaz, os filisteus tomaram Bete-Semes. A cidade da Idade do Ferro tinha um grande reservatório de água subterrâneo. Segundo os escavadores, foi destruída na campanha assíria de 701 a.C.; foi povoada de novo no século VII, mas nunca recuperou a antiga importância."
    - "No início do século IV, Eusébio conhecia Bethsames como um lugar a dez milhas de Eleuterópolis, no caminho de Nicópolis. No período bizantino um mosteiro existiu perto do montículo."
  de:
    - "Bet-Schemesch, „Haus der Sonne“, ist Tel Bet Schemesch, ein niedriger Hügel im Sorek-Tal etwa 24 km westlich von Jerusalem, wo die Berge Judas in die Niederung abfallen. Die nahe Ruine 'Ain Schems bewahrte den alten Namen, und Forscher des 19. Jahrhunderts erkannten die Stätte daran. Der Palestine Exploration Fund grub hier ab 1911, Elihu Grant vom Haverford College von 1928 bis 1933 und Shlomo Bunimovitz und Zvi Lederman ab 1990. Eine ummauerte Stadt stand hier in der Mittelbronzezeit, und in der Spätbronzezeit war sie eine blühende kanaanäische Stadt."
    - "Im Buch Josua liegt Bet-Schemesch an der Grenze Judas und wird mit seinen Vorstädten den Priestern, den Kindern Aarons, gegeben. Als die Philister die Lade des HERRN auf einem neuen Wagen zurückschickten, gingen die beiden Milchkühe „geradewegs auf Beth-Semes zu auf einer Straße“. Die Leute schnitten gerade ihre Weizenernte im Tal und freuten sich, sie zu sehen; der Wagen hielt bei einem großen Stein auf dem Feld Josuas des Beth-Semiters, die Leviten setzten die Lade auf den Stein, und die Kühe wurden als Brandopfer dargebracht. Dann schlug der HERR die Männer von Bet-Schemesch, „darum daß sie die Lade des HERRN angesehen hatten“ (Josephus zählt siebzig Tote), und sie sandten nach Kirjat-Jearim, sie abzuholen."
    - "Unter Salomo gehörte die Stadt zum Bezirk des Sohnes Dekars. Bei Bet-Schemesch besiegte Joas, der König von Israel, Amazja, den König von Juda, nahm ihn gefangen und riss dann die Mauer Jerusalems nieder. Die Ausgräber datieren eine Zerstörung der judäischen Stadt auf etwa 790 v. Chr. und verbinden sie mit dieser Schlacht; eine archäomagnetische Studie von 2022 setzte diese Zerstörung ebenfalls in den Anfang des 8. Jahrhunderts v. Chr. Zur Zeit des Ahas nahmen die Philister Bet-Schemesch. Die eisenzeitliche Stadt hatte ein großes unterirdisches Wasserreservoir. Nach den Ausgräbern wurde die Stadt im assyrischen Feldzug von 701 v. Chr. zerstört; sie wurde im 7. Jahrhundert wieder besiedelt, erlangte aber ihre frühere Bedeutung nie zurück."
    - "Im frühen 4. Jahrhundert kannte Eusebius Bethsames als Ort zehn Meilen von Eleutheropolis an der Straße nach Nikopolis. In byzantinischer Zeit stand ein Kloster nahe dem Hügel."
  fr:
    - "Beth-Schémesch, « maison du soleil », est Tel Beth-Shemesh, un tertre bas dans la vallée de Sorek à environ 24 km à l’ouest de Jérusalem, là où les collines de Juda descendent vers la plaine. La ruine voisine de ’Ain Shems a gardé l’ancien nom, et les explorateurs du XIXe siècle identifièrent le site d’après lui. Le Palestine Exploration Fund y fouilla à partir de 1911, Elihu Grant du Haverford College de 1928 à 1933, et Shlomo Bunimovitz et Zvi Lederman depuis 1990. Une ville fortifiée s’y dressait au Bronze moyen, et au Bronze récent c’était une prospère cité cananéenne."
    - "Dans le livre de Josué, Beth-Schémesch se trouve à la frontière de Juda et est donnée avec sa banlieue aux prêtres, enfants d’Aaron. Quand les Philistins renvoyèrent l’arche de l’Éternel sur un char neuf, deux vaches qui allaitaient « prirent directement le chemin de Beth-Schémesch ». Les habitants moissonnaient leur blé dans la vallée et se réjouirent de la voir ; le char s’arrêta près d’une grande pierre dans le champ de Josué de Beth-Schémesch, les lévites posèrent l’arche sur la pierre, et les vaches furent offertes en holocauste. Puis l’Éternel frappa les gens de Beth-Schémesch « lorsqu’ils regardèrent l’arche de l’Éternel » (Josèphe compte soixante-dix morts), et ils envoyèrent à Kirjath-Jearim pour la faire emporter."
    - "Sous Salomon, la ville appartenait au district du fils de Déker. À Beth-Schémesch, Joas, roi d’Israël, vainquit Amatsia, roi de Juda, le prit captif et alla abattre le mur de Jérusalem. Les fouilleurs datent une destruction de la ville judéenne vers 790 av. J.-C. et la rattachent à cette bataille ; une étude archéomagnétique de 2022 a elle aussi placé cette destruction au début du VIIIe siècle av. J.-C. Du temps d’Achaz, les Philistins prirent Beth-Schémesch. La ville de l’âge du Fer avait un grand réservoir d’eau souterrain. Selon les fouilleurs, elle fut détruite dans la campagne assyrienne de 701 av. J.-C. ; elle fut repeuplée au VIIe siècle, mais ne retrouva jamais son importance."
    - "Au début du IVe siècle, Eusèbe connaissait Bethsames comme un lieu à dix milles d’Éleuthéropolis sur la route de Nicopolis. À l’époque byzantine, un monastère s’élevait près du tertre."
  it:
    - "Bet-Semes, «casa del sole», è Tel Beth-Shemesh, un basso tell nella valle di Sorek a circa 24 km a ovest di Gerusalemme, dove le colline di Giuda scendono verso la pianura. La vicina rovina di ‘Ain Shems ha conservato l’antico nome, e gli esploratori dell’Ottocento identificarono il sito da esso. Il Palestine Exploration Fund vi scavò dal 1911, Elihu Grant dell’Haverford College dal 1928 al 1933, e Shlomo Bunimovitz e Zvi Lederman dal 1990. Una città murata vi sorgeva nel Bronzo Medio, e nel Bronzo Tardo era una prospera città cananea."
    - "Nel libro di Giosuè Bet-Semes si trova sul confine di Giuda ed è data con i suoi contadi ai sacerdoti, figli di Aronne. Quando i Filistei rimandarono l’arca del Signore su un carro nuovo, due vacche che allattavano «presero direttamente la via che mena a Beth-Scemesh». Il popolo mieteva il grano nella valle e si rallegrò vedendola; il carro si fermò presso una gran pietra nel campo di Giosuè, il Beth-scemita, i leviti posero l’arca sulla pietra, e le vacche furono offerte in olocausto. Poi il Signore colpì gli uomini di Bet-Semes «perché aveano portato gli sguardi sull’arca dell’Eterno» (Flavio Giuseppe conta settanta morti), ed essi mandarono a Kiriat-Iearim a farla portare via."
    - "Sotto Salomone la città apparteneva al distretto del figlio di Deker. A Bet-Semes Ioas re d’Israele sconfisse Amazia re di Giuda, lo fece prigioniero e proseguì per abbattere le mura di Gerusalemme. Gli scavatori datano una distruzione della città giudaita al 790 a.C. circa e la legano a questa battaglia; anche uno studio archeomagnetico del 2022 ha collocato questa distruzione all’inizio dell’VIII secolo a.C. Ai giorni di Acaz i Filistei presero Bet-Semes. La città dell’età del Ferro aveva un grande serbatoio d’acqua sotterraneo. Secondo gli scavatori, la città fu distrutta nella campagna assira del 701 a.C.; fu abitata di nuovo nel VII secolo, ma non riacquistò mai la sua importanza precedente."
    - "All’inizio del IV secolo Eusebio conosceva Bethsames come un luogo a dieci miglia da Eleuteropoli sulla via di Nicopoli. In epoca bizantina un monastero sorgeva vicino al tell."
  pl:
    - "Bet-Szemesz, „dom słońca”, to Tel Bet-Szemesz, niski tell w dolinie Sorek około 24 km na zachód od Jerozolimy, gdzie wzgórza Judy schodzą ku nizinie. Pobliska ruina 'Ain Shems zachowała dawną nazwę, a XIX-wieczni badacze utożsamili stanowisko na jej podstawie. Palestine Exploration Fund kopało tu od 1911 roku, Elihu Grant z Haverford College w latach 1928–1933, a Shlomo Bunimovitz i Zvi Lederman od 1990. Obwarowane miasto stało tu w średniej epoce brązu, a w późnej epoce brązu było zamożnym miastem kananejskim."
    - "W Księdze Jozuego Bet-Szemesz leży na granicy Judy i zostaje oddane wraz z przedmieściami kapłanom, synom Aarona. Gdy Filistyni odesłali skrzynię Pańską na nowym wozie, dwie dojne krowy „udały się … drogą, prosto ku Betsemes”. Lud żął pszenicę w dolinie i cieszył się na jej widok; wóz stanął przy wielkim kamieniu na polu Jozuego Betsemity, lewici postawili skrzynię na kamieniu, a krowy złożono na całopalenie. Potem Pan pobił mężów z Betsemes, „przeto iż zaglądali w skrzynię Pańską” (Józef Flawiusz liczy siedemdziesięciu zabitych), i posłali do Kiriat-Jearim, by ją zabrano."
    - "Za Salomona miasto należało do okręgu syna Dekara. W Bet-Szemesz Joasz, król Izraela, pokonał Amazjasza, króla Judy, wziął go do niewoli i poszedł dalej rozbić mur Jerozolimy. Wykopujący datują zniszczenie judzkiego miasta na około 790 r. p.n.e. i wiążą je z tą bitwą; badanie archeomagnetyczne z 2022 roku również umieściło to zniszczenie na początku VIII wieku p.n.e. Za dni Achaza Filistyni zajęli Bet-Szemesz. Miasto z epoki żelaza miało duży podziemny zbiornik wody. Według wykopujących miasto zniszczono w kampanii asyryjskiej z 701 r. p.n.e.; zasiedlono je ponownie w VII wieku, lecz nigdy nie odzyskało dawnego znaczenia."
    - "Na początku IV wieku Euzebiusz znał Bethsames jako miejsce dziesięć mil od Eleuteropolis na drodze do Nikopolis. W okresie bizantyjskim klasztor stał koło tellu."
  nl:
    - "Beth-Semes, “huis van de zon”, is Tel Beth-Shemesh, een lage heuvel in de Sorekvallei zo’n 24 km ten westen van Jeruzalem, waar de heuvels van Juda in het laagland uitlopen. De nabije ruïne ’Ain Shems bewaarde de oude naam, en negentiende-eeuwse onderzoekers identificeerden de plaats daaruit. De Palestine Exploration Fund groef hier vanaf 1911, Elihu Grant van Haverford College van 1928 tot 1933, en Shlomo Bunimovitz en Zvi Lederman vanaf 1990. Hier stond in de middenbronstijd een ommuurde stad, en in de late bronstijd was het een welvarende Kanaänitische stad."
    - "In het boek Jozua ligt Beth-Semes op de grens van Juda en wordt het met zijn voorsteden aan de priesters, de kinderen van Aäron, gegeven. Toen de Filistijnen de ark van de HEER op een nieuwe wagen terugzonden, “gingen” twee zogende koeien “recht in dien weg, op den weg naar Beth-Semes”. Het volk was in het dal de tarweoogst aan het binnenhalen en verheugde zich bij het zien ervan; de wagen stond stil bij een grote steen in het veld van Jozua de Beth-Semiet, de Levieten zetten de ark op de steen, en de koeien werden als brandoffer geofferd. Toen sloeg de HEER de mannen van Beth-Semes “omdat zij in de ark des HEEREN gezien hadden” (Josephus telt zeventig doden), en zij zonden naar Kirjat-Jearim om haar weg te laten halen."
    - "Onder Salomo behoorde de stad tot het district van de zoon van Deker. Bij Beth-Semes versloeg Joas, koning van Israël, Amazia, koning van Juda, nam hem gevangen en brak vervolgens Jeruzalems muur af. De opgravers dateren een verwoesting van de Judese stad omstreeks 790 v.Chr. en verbinden die met deze slag; een archeomagnetisch onderzoek van 2022 plaatste deze verwoesting eveneens vroeg in de achtste eeuw v.Chr. In de dagen van Achaz namen de Filistijnen Beth-Semes in. De ijzertijdstad had een groot ondergronds waterreservoir. Volgens de opgravers werd de stad verwoest in de Assyrische veldtocht van 701 v.Chr.; zij werd in de zevende eeuw weer bewoond, maar herkreeg nooit haar vroegere belang."
    - "Begin vierde eeuw kende Eusebius Bethsames als een plaats tien mijl van Eleutheropolis op de weg naar Nicopolis. In de Byzantijnse tijd stond een klooster bij de heuvel."
  cs:
    - "Bét-šemeš, „dům slunce“, je Tel Bét-šemeš, nízký pahorek v údolí Sóreku asi 24 km západně od Jeruzaléma, kde pahorky Judy klesají do nížiny. Nedaleká zřícenina 'Ain Shems zachovala staré jméno a badatelé 19. století místo podle ní určili. Palestine Exploration Fund zde kopal od roku 1911, Elihu Grant z Haverford College v letech 1928 až 1933 a Shlomo Bunimovitz a Zvi Lederman od roku 1990. Opevněné město tu stálo ve střední době bronzové a v pozdní době bronzové to bylo prosperující kenaanské město."
    - "V knize Jozue leží Bét-šemeš na hranici Judy a je dán s předměstími kněžím, synům Áronovým. Když Pelištejci poslali zpět truhlu Hospodinovu na novém voze, dvě krávy s telaty vyrazily: „šly upřímo krávy cestou, kteráž vede do Betsemes“. „Betsemští pak žali tehdáž pšenici v údolí“ a radovali se, když ji uviděli; vůz se zastavil u velkého kamene na poli Jozua Betšemešského, levité postavili truhlu na kámen a krávy byly obětovány jako zápalná oběť. Potom Hospodin pobil muže Bét-šemeše, „kteříž hleděli do truhly Hospodinovy“ (Josephus Flavius počítá sedmdesát mrtvých), a ti poslali ke Kirjat-jearímu, aby ji odvezli."
    - "Za Šalomouna patřilo město k okresu syna Dekerova. U Bét-šemeše porazil Joaš, král Izraele, Amacjáše, krále Judy, zajal jej a šel dál zbořit hradbu Jeruzaléma. Vykopávači datují zničení judského města kolem roku 790 př. n. l. a spojují je s touto bitvou; archeomagnetická studie z roku 2022 toto zničení rovněž zařadila na počátek 8. století př. n. l. Za dnů Achazových Pelištejci Bét-šemeš dobyli. Město doby železné mělo velkou podzemní vodní nádrž. Podle vykopávačů bylo město zničeno při asyrském tažení roku 701 př. n. l.; v 7. století bylo znovu osídleno, ale nikdy nezískalo dřívější význam."
    - "Na počátku 4. století znal Eusebios Bethsames jako místo deset mil od Eleutheropole na cestě do Nikopole. V byzantském období stál u pahorku klášter."
  sv:
    - "Bet-Shemesh, ”solens hus”, är Tel Beth-Shemesh, en låg kulle i Sorekdalen omkring 24 km väster om Jerusalem, där Judas berg övergår i lågland. Den närbelägna ruinen ’Ain Shems behöll det gamla namnet, och 1800-talets forskare identifierade platsen utifrån det. Palestine Exploration Fund grävde här från 1911, Elihu Grant från Haverford College 1928–1933 och Shlomo Bunimovitz och Zvi Lederman från 1990. En muromgärdad stad låg här under mellersta bronsåldern, och under sen bronsålder var den en välmående kananeisk stad."
    - "I Josuas bok ligger Bet-Shemesh vid Judas gräns och ges med sina utmarker åt prästerna, Arons söner. När filistéerna sände tillbaka HERRENS ark på en ny vagn tog korna ”raka vägen fram åt Bet-Semes till”. Folket höll på med veteskörd i dalen och blev glada när de såg den; vagnen stannade vid en stor sten på betsemesiten Josuas åker, leviterna satte arken på stenen, och korna offrades som brännoffer. Därefter slog HERREN männen i Bet-Shemesh ”därför att de hade sett på HERRENS ark” (Josefus räknar sjuttio döda), och de sände bud till Kirjat-Jearim för att få den hämtad."
    - "Under Salomo hörde staden till Ben-Dekers distrikt. Vid Bet-Shemesh besegrade Joas, Israels kung, Amasja, Juda kung, tog honom till fånga och gick sedan vidare och bröt ner Jerusalems mur. Utgrävarna daterar en förstörelse av den judeiska staden till omkring 790 f.Kr. och knyter den till denna strid; en arkeomagnetisk studie från 2022 placerade också denna förstörelse tidigt på 700-talet f.Kr. På Achas tid intog filistéerna Bet-Shemesh. Järnålderns stad hade en stor underjordisk vattencistern. Enligt utgrävarna förstördes staden under det assyriska fälttåget 701 f.Kr.; den bebyggdes på nytt under 600-talet men fick aldrig tillbaka sin forna betydelse."
    - "I början av 300-talet kände Eusebios Betsames som en plats tio romerska mil från Eleutheropolis på vägen mot Nikopolis. Under bysantinsk tid låg ett kloster nära kullen."
  nb:
    - "Bet-Sjemesj, «solens hus», er Tel Beth-Shemesh, en lav tell i Sorek-dalen omtrent 24 km vest for Jerusalem, der Judas åser går ned mot lavlandet. Ruinen 'Ain Shems i nærheten bevarte det gamle navnet, og oppdagelsesreisende på 1800-tallet identifiserte stedet ut fra det. Palestine Exploration Fund gravde her fra 1911, Elihu Grant ved Haverford College fra 1928 til 1933, og Shlomo Bunimovitz og Zvi Lederman fra 1990. En befestet by sto her i mellombronsealderen, og i senbronsealderen var den en velstående kanaanittisk by."
    - "I Josvas bok ligger Bet-Sjemesj på grensen til Juda og blir gitt med sine jorder til prestene, Arons barn. Da filistrene sendte Herrens ark tilbake på en ny vogn, var det to melkekyr som «gikk rett frem efter veien som førte til Betsemes». Folket høstet hveten i dalen og gledet seg over å se den; vognen stanset ved en stor sten på marken til Josva fra Bet-Sjemesj, levittene satte arken på steinen, og kyrne ble ofret som brennoffer. Så slo Herren mennene i Bet-Sjemesj, «fordi de hadde sett på Herrens ark» (Josefus oppgir sytti døde), og de sendte bud til Kirjat-Jearim for å hente den bort."
    - "Under Salomo hørte byen til distriktet til Dekers sønn. Ved Bet-Sjemesj beseiret Joasj, Israels konge, Amasja, Judas konge, tok ham til fange og fortsatte med å rive ned muren i Jerusalem. Utgraverne daterer en ødeleggelse av den judeiske byen til omkring 790 f.Kr. og knytter den til dette slaget; en arkeomagnetisk studie fra 2022 plasserte også denne ødeleggelsen tidlig på 700-tallet f.Kr. I Ahas' dager inntok filistrene Bet-Sjemesj. Jernalderbyen hadde et stort underjordisk vannreservoar. Ifølge utgraverne ble byen ødelagt under det assyriske felttoget i 701 f.Kr.; den ble bosatt på ny på 600-tallet, men fikk aldri tilbake sin tidligere betydning."
    - "Tidlig på 300-tallet kjente Eusebius Bethsames som et sted ti romerske mil fra Eleutheropolis på veien til Nikopolis. I den bysantinske perioden sto et kloster nær tellen."
  tl:
    - "Ang Beth-semes, “bahay ng araw”, ay ang Tel Beth-Shemesh, isang mababang tel sa libis ng Sorec mga 24 km sa kanluran ng Jerusalem, kung saan bumababa ang mga burol ng Juda patungo sa mababang lupain. Ang kalapit na guho ng 'Ain Shems ay nagpanatili ng lumang pangalan, at kinilala ng mga manggagalugad noong ika-19 na siglo ang pook mula rito. Humukay rito ang Palestine Exploration Fund mula 1911, si Elihu Grant ng Haverford College mula 1928 hanggang 1933, at sina Shlomo Bunimovitz at Zvi Lederman mula 1990. May bayang may pader dito noong Gitnang Panahon ng Tanso, at noong Huling Panahon ng Tanso ay isa itong maunlad na lungsod Cananeo."
    - "Sa Aklat ni Josue, ang Beth-semes ay nasa hangganan ng Juda at ibinibigay kasama ng mga bayan sa palibot nito sa mga saserdote, ang mga anak ni Aaron. Nang ibalik ng mga Filisteo ang kaban ng Panginoon sa isang bagong karo, “tinuwid ng mga baka ang daan sa Beth-semes”, dalawang inahing may gatas. Ang mga tao ay nagaani ng kanilang trigo sa libis at nagalak nang makita ito; huminto ang karo sa tabi ng isang malaking bato sa bukid ni Josue na Beth-semita, inilagay ng mga Levita ang kaban sa bato, at inihandog na susunugin ang mga baka. Pagkatapos ay sinaktan ng Panginoon ang mga lalaki ng Beth-semes “sapagka't kanilang tiningnan ang loob ng kaban ng Panginoon” (pitumpu ang namatay ayon kay Josefo), at nagsugo sila sa Kiriath-jearim upang kunin ito."
    - "Sa ilalim ni Salomon, ang bayan ay kabilang sa distrito ng anak ni Dacer. Sa Beth-semes tinalo ni Joas na hari ng Israel si Amasias na hari ng Juda, binihag siya, at nagpatuloy upang gibain ang pader ng Jerusalem. Ipinetsa ng mga tagahukay ang pagkawasak ng bayang Judahita noong mga 790 BK at iniugnay ito sa labanang ito; inilagay din ng isang pag-aaral na arkeomagnetiko noong 2022 ang pagkawasak na ito sa maagang ika-8 siglo BK. Nang mga araw ni Achaz, sinakop ng mga Filisteo ang Beth-semes. Ang bayan ng Panahon ng Bakal ay may malaking imbakan ng tubig sa ilalim ng lupa. Ayon sa mga tagahukay, nawasak ang bayan sa kampanya ng Asiria noong 701 BK; muli itong tinirhan noong ika-7 siglo, ngunit hindi na nito nabawi ang dating kahalagahan."
    - "Noong maagang ika-4 na siglo, kilala ni Eusebio ang Bethsames bilang pook na sampung milya mula sa Eleutheropolis sa daan patungong Nicopolis. Noong panahong Bizantino, may isang monasteryo sa tabi ng tel."
  da:
    - "Bet-Sjemesj, »solens hus«, er Tel Bet-Sjemesj, en lav banke i Sorek-dalen cirka 24 km vest for Jerusalem, hvor Judas bjerge går ned i lavlandet. Ruinen 'Ain Shems i nærheden bevarede det gamle navn, og opdagelsesrejsende i 1800-tallet identificerede stedet ud fra det. Palestine Exploration Fund gravede her fra 1911, Elihu Grant fra Haverford College fra 1928 til 1933 og Shlomo Bunimovitz og Zvi Lederman fra 1990. En befæstet by lå her i mellembronzealderen, og i senbronzealderen var den en velstående kanaanæisk by."
    - "I Josvas Bog ligger Bet-Sjemesj på Judas grænse og gives med sine græsgange til præsterne, Arons børn. Da filisterne sendte Herrens ark tilbage på en ny vogn, »gik ret frem paa Vejen, ad Vejen til Beth-Semes« to mælkekøer. Folket høstede sin hvede i dalen og glædede sig ved at se den; vognen standsede ved en stor sten på marken tilhørende Josva fra Bet-Sjemesj, leviterne stillede arken på stenen, og køerne blev ofret som brændoffer. Derpå slog Herren mændene i Bet-Sjemesj, »fordi de saa i Herrens Ark« (Josefus tæller halvfjerds døde), og de sendte bud til Kirjat-Jearim for at hente den bort."
    - "Under Salomo hørte byen til Dekers søns distrikt. Ved Bet-Sjemesj besejrede Joas, Israels konge, Amazja, Judas konge, tog ham til fange og fortsatte med at nedbryde Jerusalems mur. Udgraverne dater en ødelæggelse af den judæiske by til omkring 790 f.Kr. og knytter den til dette slag; en arkæomagnetisk undersøgelse fra 2022 placerede også denne ødelæggelse tidligt i 700-tallet f.Kr. I Akaz' dage tog filisterne Bet-Sjemesj. Jernalderbyen havde et stort underjordisk vandreservoir. Ifølge udgraverne blev byen ødelagt under assyrernes felttog i 701 f.Kr.; den blev bosat igen i 600-tallet, men fik aldrig sin tidligere betydning tilbage."
    - "I begyndelsen af 300-tallet kendte Eusebius Bethsames som et sted ti romerske mil fra Eleutheropolis på vejen til Nikopolis. I den byzantinske tid lå et kloster nær banken."
  sr:
    - "Вет-Семес, „дом сунца“, јесте Тел Бет Шемеш, ниска хумка у долини Сорек око 24 км западно од Јерусалима, где се брда Јудина спуштају у низију. Оближња рушевина Ајн Шамс сачувала је старо име, а истраживачи из 19. века по њему су одредили локалитет. Фонд за истраживање Палестине копао је овде од 1911, Елиху Грант с колеџа Хејверфорд од 1928. до 1933, а Шломо Бунимовиц и Цви Ледерман од 1990. Град с бедемима стајао је овде у средњем бронзаном добу, а у касном бронзаном добу био је напредан хананејски град."
    - "У Књизи Исуса Навина Вет-Семес лежи на међи Јудиној и са подграђем се даје свештеницима, синовима Ароновим. Када су Филистеји послали натраг ковчег Господњи на новим колима, са две краве дојилице, „пођоше краве право путем у Вет-Семес“. Народ је у долини жњео пшеницу и обрадовао се када га је видео; кола су стала код великог камена на њиви Исуса Вет-Семешанина, Левити су ковчег ставили на камен, а краве су принесене као жртва паљеница. Потом је Господ ударио људе из Вет-Семеса „који загледаше у ковчег Господњи“ (Јосиф Флавије броји седамдесет мртвих), и они су послали у Киријат-Јарим да га однесу."
    - "За Соломуна је град припадао округу сина Декеровог. У Вет-Семесу је Јоас, цар Израиљев, победио Амасију, цара Јудиног, заробио га и отишао даље да сруши зид Јерусалима. Археолози датирају разарање јудејског града око 790. п. н. е. и повезују га с том битком; археомагнетска студија из 2022. такође је ово разарање сместила у почетак 8. века п. н. е. У време Ахаза Филистеји су заузели Вет-Семес. Град из гвозденог доба имао је велики подземни резервоар воде. Према археолозима, град је уништен у асирском походу 701. п. н. е.; поново је насељен у 7. веку, али никада није повратио некадашњи значај."
    - "Почетком 4. века Јевсевије је знао Бетсамес као место десет миља од Елевтерополиса на путу ка Никопољу. У византијско доба код хумке је стајао манастир."
