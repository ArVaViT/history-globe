body:
  en:
    - "Attalia, today Antalya in southern Turkey, stands on cliffs above a small natural harbour on the Gulf of Antalya, at the western edge of the Pamphylian plain. Strabo says that the city was named after its founder, Attalus II Philadelphus, king of Pergamum (159–138 BC), who also sent colonists to the small neighbouring town of Corycus and enclosed it with a larger wall. Attalia gave the kings of Pergamum a port on the southern coast of Asia Minor."
    - "The last king of Pergamum left his kingdom to Rome in 133 BC, and Attalia later came under Roman rule. In 48 BC, fleeing by sea after his defeat at Pharsalus, Pompey entered Attalia in Pamphylia before any other city; there triremes from Cilicia met him, soldiers were gathered for him, and sixty senators joined him."
    - "At the end of their first journey Paul and Barnabas came back from Pisidia into Pamphylia. When they had preached the word in Perga they went down to Attalia, the nearest port, and sailed from there to Antioch in Syria, where they had first been sent out for the work. This is the only time the city is named in the Bible."
    - "Under the empire Attalia remained a busy harbour town. A marble gate with three arches in its walls honours the emperor Hadrian, who toured the eastern provinces about AD 130, and a round tower of the Roman period, the Hıdırlık Tower, still stands on the cliff above the sea. Attalia outlasted its neighbours: when Perga and the other cities of the plain declined after antiquity, it remained the main port of the coast and kept its name, as Adalia and then Antalya."
  ru:
    - "Атталия, ныне Анталья на юге Турции, стоит на скалах над небольшой естественной гаванью в Анталийском заливе, у западного края Памфилийской равнины. Страбон пишет, что город был назван по имени своего основателя, пергамского царя Аттала II Филадельфа (159–138 гг. до н. э.), который также послал поселенцев в соседний городок Корик и обнёс его более широкой стеной. Атталия дала пергамским царям гавань на южном берегу Малой Азии."
    - "Последний пергамский царь завещал своё царство Риму в 133 г. до н. э., и со временем Атталия перешла под власть Рима. В 48 г. до н. э., спасаясь морем после поражения при Фарсале, Помпей первым из городов вошёл в Атталию в Памфилии; там его встретили триеры из Киликии, для него собрали воинов, и к нему присоединились шестьдесят сенаторов."
    - "В конце первого путешествия Павел и Варнава вернулись из Писидии в Памфилию. Проповедав слово в Пергии, они «сошли в Атталию», ближайшую гавань, и оттуда отплыли в Антиохию Сирийскую, откуда их когда-то отправили на это дело. Это единственное упоминание города в Библии."
    - "В Римской империи Атталия оставалась оживлённым портовым городом. Мраморные ворота с тремя арками в её стенах посвящены императору Адриану, который около 130 г. н. э. объезжал восточные провинции, а на скале над морем до сих пор стоит круглая башня римского времени — башня Хыдырлык. Атталия пережила своих соседей: когда Пергия и другие города равнины после античности пришли в упадок, она осталась главным портом побережья и сохранила своё имя — Адалия, а затем Анталья."
  uk:
    - "Атталія, нині Анталья на півдні Туреччини, стоїть на скелях над невеликою природною гаванню в Анталійській затоці, на західному краю Памфілійської рівнини. Страбон каже, що місто назвали за його засновником Атталом II Філадельфом, царем Пергама (159–138 рр. до н. е.), який також послав колоністів до сусіднього невеликого містечка Корік і оточив його більшим муром. Атталія дала царям Пергама порт на південному узбережжі Малої Азії."
    - "Останній цар Пергама заповів своє царство Римові в 133 р. до н. е., і Атталія згодом потрапила під римську владу. У 48 р. до н. е., тікаючи морем після поразки при Фарсалі, Помпей увійшов до Атталії в Памфілії раніше, ніж до будь-якого іншого міста; там його зустріли кілікійські тріреми, для нього зібрали воїнів, і до нього приєдналися шістдесят сенаторів."
    - "Наприкінці першої подорожі Павло і Варнава повернулися з Пісідії до Памфілії. Проповівши слово в Перге, вони зійшли до Атталії, найближчого порту, і відплили звідти до Антіохії Сирійської, звідки їх спершу послали на цю справу. Це єдиний раз, коли місто названо в Біблії."
    - "За імперії Атталія лишалася жвавим портовим містом. Мармурова брама з трьома арками в її мурах вшановує імператора Адріана, який об'їжджав східні провінції близько 130 р. н. е., а кругла вежа римського часу, вежа Хидирлик, і досі стоїть на скелі над морем. Атталія пережила сусідів: коли Перге та інші міста рівнини занепали після давнини, вона лишилася головним портом узбережжя і зберегла своє ім'я — як Адалья, а потім Анталья."
  es:
    - "Atalia, hoy Antalya, en el sur de Turquía, se alza sobre acantilados por encima de un pequeño puerto natural en el golfo de Antalya, en el borde occidental de la llanura de Panfilia. Estrabón dice que la ciudad recibió el nombre de su fundador, Átalo II Filadelfo, rey de Pérgamo (159–138 a. C.), que envió además colonos a la pequeña ciudad vecina de Coricos y la rodeó con una muralla mayor. Atalia dio a los reyes de Pérgamo un puerto en la costa meridional del Asia Menor."
    - "El último rey de Pérgamo legó su reino a Roma en 133 a. C., y Atalia pasó más tarde al dominio romano. En 48 a. C., huyendo por mar tras su derrota en Farsalia, Pompeyo entró en Atalia, en Panfilia, antes que en ninguna otra ciudad; allí lo recibieron trirremes de Cilicia, se reunieron soldados para él y sesenta senadores se le unieron."
    - "Al final de su primer viaje, Pablo y Bernabé volvieron de Pisidia a Panfilia. Cuando hubieron predicado la palabra en Perge, descendieron a Atalia, el puerto más cercano, y navegaron desde allí a Antioquía de Siria, de donde habían sido enviados primero para la obra. Esta es la única vez que la ciudad se nombra en la Biblia."
    - "Bajo el imperio Atalia siguió siendo una activa ciudad portuaria. Una puerta de mármol con tres arcos en sus murallas honra al emperador Adriano, que recorrió las provincias orientales hacia 130 d. C., y una torre redonda de época romana, la torre Hıdırlık, aún se alza en el acantilado sobre el mar. Atalia sobrevivió a sus vecinas: cuando Perge y las demás ciudades de la llanura decayeron tras la Antigüedad, siguió siendo el principal puerto de la costa y conservó su nombre, como Adalia y luego Antalya."
  pt:
    - "Atália, hoje Antalya, no sul da Turquia, ergue-se sobre penhascos acima de um pequeno porto natural no golfo de Antalya, na borda ocidental da planície da Panfília. Estrabão diz que a cidade recebeu o nome de seu fundador, Átalo II Filadelfo, rei de Pérgamo (159–138 a.C.), que também enviou colonos à pequena cidade vizinha de Corico e a cercou com uma muralha maior. Atália deu aos reis de Pérgamo um porto na costa sul da Ásia Menor."
    - "O último rei de Pérgamo legou seu reino a Roma em 133 a.C., e Atália passou mais tarde ao domínio romano. Em 48 a.C., fugindo por mar depois de sua derrota em Farsália, Pompeu entrou em Atália, na Panfília, antes de qualquer outra cidade; ali trirremes da Cilícia o encontraram, soldados foram reunidos para ele, e sessenta senadores se juntaram a ele."
    - "No fim da primeira viagem, Paulo e Barnabé voltaram da Pisídia à Panfília. Depois de pregar a palavra em Perge, desceram a Atália, o porto mais próximo, e dali navegaram para Antioquia da Síria, de onde tinham sido enviados primeiro para a obra. É a única vez que a cidade é nomeada na Bíblia."
    - "Sob o Império, Atália continuou sendo uma movimentada cidade portuária. Um portal de mármore com três arcos em suas muralhas honra o imperador Adriano, que percorreu as províncias orientais por volta de 130 d.C., e uma torre redonda da época romana, a Torre Hıdırlık, ainda se ergue sobre o penhasco acima do mar. Atália sobreviveu a suas vizinhas: quando Perge e as outras cidades da planície declinaram depois da Antiguidade, continuou sendo o principal porto da costa e conservou o nome, como Adália e depois Antalya."
  de:
    - "Attalia, heute Antalya in der Südtürkei, liegt auf Klippen über einem kleinen natürlichen Hafen am Golf von Antalya, am Westrand der pamphylischen Ebene. Strabon sagt, die Stadt sei nach ihrem Gründer Attalos II. Philadelphos, dem König von Pergamon (159–138 v. Chr.), benannt, der auch Siedler in das kleine benachbarte Städtchen Korykos schickte und es mit einer größeren Mauer umschloss. Attalia gab den Königen von Pergamon einen Hafen an der Südküste Kleinasiens."
    - "Der letzte König von Pergamon vermachte sein Reich 133 v. Chr. Rom, und Attalia kam später unter römische Herrschaft. 48 v. Chr. lief Pompeius auf der Flucht über das Meer nach seiner Niederlage bei Pharsalos vor jeder anderen Stadt Attalia in Pamphylien an; dort trafen ihn Trieren aus Kilikien, Soldaten wurden für ihn gesammelt, und sechzig Senatoren schlossen sich ihm an."
    - "Am Ende ihrer ersten Reise kamen Paulus und Barnabas aus Pisidien nach Pamphylien zurück. Als sie in Perge das Wort gepredigt hatten, gingen sie nach Attalia hinab, dem nächsten Hafen, und segelten von dort nach Antiochia in Syrien, wo sie zuerst für das Werk ausgesandt worden waren. Das ist das einzige Mal, dass die Stadt in der Bibel genannt wird."
    - "Unter dem Kaiserreich blieb Attalia eine rege Hafenstadt. Ein marmornes Tor mit drei Bögen in seinen Mauern ehrt Kaiser Hadrian, der um 130 n. Chr. die östlichen Provinzen bereiste, und ein runder Turm der römischen Zeit, der Hıdırlık-Turm, steht noch auf der Klippe über dem Meer. Attalia überdauerte seine Nachbarn: Als Perge und die anderen Städte der Ebene nach der Antike verfielen, blieb es der Haupthafen der Küste und behielt seinen Namen, als Adalja und dann Antalya."
  fr:
    - "Attalie, aujourd’hui Antalya, dans le sud de la Turquie, se dresse sur des falaises au-dessus d’un petit port naturel du golfe d’Antalya, à la lisière occidentale de la plaine de Pamphylie. Strabon dit que la ville fut nommée d’après son fondateur, Attale II Philadelphe, roi de Pergame (159-138 av. J.-C.), qui envoya aussi des colons dans la petite ville voisine de Korykos et l’enferma dans une plus grande enceinte. Attalie donnait aux rois de Pergame un port sur la côte méridionale de l’Asie Mineure."
    - "Le dernier roi de Pergame légua son royaume à Rome en 133 av. J.-C., et Attalie passa plus tard sous domination romaine. En 48 av. J.-C., fuyant par mer après sa défaite de Pharsale, Pompée entra à Attalie en Pamphylie avant toute autre ville ; là des trières de Cilicie le rejoignirent, des soldats furent rassemblés pour lui, et soixante sénateurs le rejoignirent."
    - "À la fin de leur premier voyage, Paul et Barnabas revinrent de Pisidie en Pamphylie. Quand ils eurent prêché la parole à Perge, ils descendirent à Attalie, le port le plus proche, et s’embarquèrent de là pour Antioche de Syrie, où on les avait d’abord envoyés pour l’œuvre. C’est la seule fois que la ville est nommée dans la Bible."
    - "Sous l’Empire, Attalie resta une ville portuaire active. Une porte de marbre à trois arches dans ses murs honore l’empereur Hadrien, qui parcourut les provinces orientales vers 130 apr. J.-C., et une tour ronde de l’époque romaine, la tour Hıdırlık, se dresse encore sur la falaise au-dessus de la mer. Attalie survécut à ses voisines : quand Perge et les autres villes de la plaine déclinèrent après l’Antiquité, elle resta le principal port de la côte et garda son nom, sous les formes Adalia puis Antalya."
  it:
    - "Attalia, oggi Antalya nella Turchia meridionale, sorge su scogliere sopra un piccolo porto naturale nel golfo di Antalya, al margine occidentale della piana della Panfilia. Strabone dice che la città prese nome dal suo fondatore, Attalo II Filadelfo, re di Pergamo (159–138 a.C.), che mandò anche coloni alla piccola città vicina di Corico e la racchiuse con una cinta più larga. Attalia diede ai re di Pergamo un porto sulla costa meridionale dell’Asia Minore."
    - "L’ultimo re di Pergamo lasciò il suo regno a Roma nel 133 a.C., e Attalia passò poi sotto il dominio romano. Nel 48 a.C., fuggendo per mare dopo la sconfitta di Farsalo, Pompeo entrò ad Attalia in Panfilia prima che in ogni altra città; là lo incontrarono triremi dalla Cilicia, furono raccolti soldati per lui, e sessanta senatori si unirono a lui."
    - "Alla fine del loro primo viaggio Paolo e Barnaba tornarono dalla Pisidia in Panfilia. Dopo aver predicato la parola a Perge scesero ad Attalia, il porto più vicino, e di là navigarono verso Antiochia di Siria, dove erano stati inviati per l’opera. È l’unica volta in cui la città è nominata nella Bibbia."
    - "Sotto l’impero Attalia rimase una città portuale attiva. Una porta di marmo con tre archi nelle sue mura onora l’imperatore Adriano, che visitò le province orientali intorno al 130 d.C., e una torre rotonda di epoca romana, la Torre di Hıdırlık, sorge ancora sulla scogliera sopra il mare. Attalia sopravvisse ai suoi vicini: quando Perge e le altre città della piana decaddero dopo l’antichità, rimase il porto principale della costa e conservò il nome, come Adalia e poi Antalya."
  pl:
    - "Attalia, dziś Antalya w południowej Turcji, stoi na klifach nad małym naturalnym portem w Zatoce Antalya, na zachodnim skraju równiny Pamfilii. Strabon mówi, że miasto nazwano od jego założyciela, Attalosa II Filadelfosa, króla Pergamonu (159–138 p.n.e.), który wysłał też kolonistów do małego sąsiedniego miasteczka Korykos i otoczył je większym murem. Attalia dała królom Pergamonu port na południowym wybrzeżu Azji Mniejszej."
    - "Ostatni król Pergamonu zapisał swe królestwo Rzymowi w 133 r. p.n.e., a Attalia znalazła się później pod władzą rzymską. W 48 r. p.n.e., uciekając morzem po klęsce pod Farsalos, Pompejusz wszedł do Attalii w Pamfilii wcześniej niż do jakiegokolwiek innego miasta; tam spotkały go trójrzędowce z Cylicji, zebrano dla niego żołnierzy, a dołączyło do niego sześćdziesięciu senatorów."
    - "Pod koniec pierwszej podróży Paweł i Barnaba wrócili z Pizydii do Pamfilii. Gdy głosili słowo w Perge, zeszli do Attalii, najbliższego portu, i odpłynęli stąd do Antiochii w Syrii, skąd zostali pierwotnie wysłani do tego dzieła. To jedyny raz, gdy miasto jest wymienione w Biblii."
    - "Za cesarstwa Attalia pozostała ruchliwym miastem portowym. Marmurowa brama z trzema łukami w jej murach upamiętnia cesarza Hadriana, który około 130 r. n.e. objechał wschodnie prowincje, a okrągła wieża z okresu rzymskiego, Wieża Hıdırlık, wciąż stoi na klifie nad morzem. Attalia przetrwała swoich sąsiadów: gdy Perge i inne miasta równiny podupadły po starożytności, pozostała głównym portem wybrzeża i zachowała nazwę, jako Adalia, a potem Antalya."
  nl:
    - "Attalia, tegenwoordig Antalya in Zuid-Turkije, ligt op kliffen boven een kleine natuurlijke haven aan de Golf van Antalya, aan de westrand van de Pamfylische vlakte. Strabo zegt dat de stad werd genoemd naar haar stichter, Attalus II Philadelphus, koning van Pergamon (159–138 v.Chr.), die ook kolonisten stuurde naar het kleine naburige stadje Korykos en het met een grotere muur omsloot. Attalia gaf de koningen van Pergamon een haven aan de zuidkust van Klein-Azië."
    - "De laatste koning van Pergamon liet zijn koninkrijk in 133 v.Chr. aan Rome na, en Attalia kwam later onder Romeins gezag. In 48 v.Chr. vluchtte Pompeius over zee na zijn nederlaag bij Farsalus, en kwam in Pamfylië vóór enige andere stad Attalia binnen; daar ontmoetten triremen uit Cilicië hem, werden soldaten voor hem verzameld, en zestig senatoren voegden zich bij hem."
    - "Aan het eind van hun eerste reis kwamen Paulus en Barnabas uit Pisidië terug in Pamfylië. Toen zij het woord te Perge hadden gepredikt, gingen zij af naar Attalia, de naaste haven, en voeren vandaar naar Antiochië in Syrië, waar zij oorspronkelijk voor het werk waren uitgezonden. Dit is de enige keer dat de stad in de Bijbel wordt genoemd."
    - "Onder het keizerrijk bleef Attalia een drukke havenstad. Een marmeren poort met drie bogen in haar muren eert keizer Hadrianus, die omstreeks 130 n.Chr. de oostelijke provincies bereisde, en een ronde toren uit de Romeinse tijd, de Hıdırlık-toren, staat nog op de klif boven de zee. Attalia overleefde haar buren: toen Perge en de andere steden van de vlakte na de oudheid in verval raakten, bleef het de hoofdhaven van de kust en behield zijn naam, als Adalia en daarna Antalya."
  cs:
    - "Attaleia, dnes Antalya v jižním Turecku, stojí na útesech nad malým přírodním přístavem v Antalijském zálivu, na západním okraji pamfylské pláně. Strabón praví, že město bylo pojmenováno po svém zakladateli Attalovi II. Filadelfovi, králi Pergamonu (159–138 př. n. l.), který také poslal kolonisty do blízkého městečka Korykos a obehnal je větší hradbou. Attaleia dala pergamským králům přístav na jižním pobřeží Malé Asie."
    - "Poslední pergamský král odkázal své království Římu roku 133 př. n. l. a Attaleia později přešla pod římskou vládu. Roku 48 př. n. l., když po porážce u Farsalu prchal po moři, vstoupil Pompeius do Attaleie v Pamfylii dříve než do kteréhokoli jiného města; tam se s ním setkaly triéry z Kilikie, byli pro něj shromážděni vojáci a připojilo se k němu šedesát senátorů."
    - "Na konci své první cesty se Pavel s Barnabášem vrátili z Pisidie do Pamfylie. Když kázali slovo v Perge, sestoupili do Attaleie, nejbližšího přístavu, a odtud odplouli do Antiochie v Sýrii, odkud byli poprvé vysláni k tomuto dílu. Je to jediné místo v Bibli, kde je město jmenováno."
    - "Za říše zůstala Attaleia rušným přístavním městem. Mramorová brána se třemi oblouky v jejích hradbách ctí císaře Hadriana, který kolem roku 130 n. l. objížděl východní provincie, a kulatá věž z římské doby, věž Hıdırlık, stále stojí na útesu nad mořem. Attaleia přežila své sousedy: když Perge a ostatní města pláně po antice upadla, zůstala hlavním přístavem pobřeží a uchovala si jméno, jako Adalja a pak Antalya."
  sv:
    - "Attalia, i dag Antalya i södra Turkiet, ligger på klippor ovanför en liten naturlig hamn i Antalyabukten, vid västra kanten av den pamfyliska slätten. Strabon säger att staden uppkallades efter sin grundare, Attalos II Filadelfos, kung av Pergamon (159–138 f.Kr.), som också sände kolonister till den lilla grannstaden Korykos och omslöt den med en större mur. Attalia gav Pergamons kungar en hamn på Mindre Asiens södra kust."
    - "Pergamons siste kung testamenterade sitt rike till Rom år 133 f.Kr., och Attalia kom senare under romerskt välde. År 48 f.Kr., när Pompejus flydde sjövägen efter nederlaget vid Farsalos, gick han in i Attalia i Pamfylien före någon annan stad; där möttes han av trirem från Kilikien, soldater samlades åt honom, och sextio senatorer anslöt sig till honom."
    - "I slutet av sin första resa kom Paulus och Barnabas tillbaka från Pisidien till Pamfylien. När de hade förkunnat ordet i Perge gick de ned till Attalia, den närmaste hamnen, och seglade därifrån till Antiochia i Syrien, där de först hade blivit utsända till verket. Detta är den enda gången staden nämns i Bibeln."
    - "Under kejsartiden förblev Attalia en livlig hamnstad. En marmorport med tre bågar i dess murar hedrar kejsar Hadrianus, som reste genom de östra provinserna omkring år 130 e.Kr., och ett runt torn från romersk tid, Hıdırlık-tornet, står ännu på klippan ovanför havet. Attalia överlevde sina grannar: när Perge och de andra städerna på slätten förföll efter antiken förblev den kustens huvudhamn och behöll sitt namn, som Adalia och sedan Antalya."
  nb:
    - "Attalia, i dag Antalya i Sør-Tyrkia, ligger på klipper over en liten naturlig havn ved Antalyabukta, i vestkanten av Pamfylia-sletten. Strabon sier at byen ble oppkalt etter grunnleggeren, Attalos II Filadelfos, konge av Pergamon (159–138 f.Kr.), som også sendte kolonister til den lille nabobyen Korykos og omsluttet den med en større mur. Attalia ga kongene av Pergamon en havn på sørkysten av Lilleasia."
    - "Den siste kongen av Pergamon testamenterte riket sitt til Roma i 133 f.Kr., og Attalia kom senere under romersk styre. I 48 f.Kr., på flukt over havet etter nederlaget ved Farsalos, kom Pompeius til Attalia i Pamfylia før noen annen by; der møtte triremer fra Kilikia ham, soldater ble samlet for ham, og seksti senatorer sluttet seg til ham."
    - "På slutten av sin første reise kom Paulus og Barnabas tilbake fra Pisidia til Pamfylia. Da de hadde forkynt ordet i Perge, «drog de ned til Attalia», nærmeste havn, og «seilte derfra til Antiokia» i Syria, det stedet de først var blitt sendt ut fra til gjerningen. Dette er den eneste gangen byen nevnes i Bibelen."
    - "Under keiserdømmet forble Attalia en travel havneby. En marmorport med tre buer i murene hedrer keiser Hadrian, som reiste gjennom de østlige provinsene omkring 130 e.Kr., og et rundt tårn fra romertid, Hıdırlık-tårnet, står ennå på klippen over havet. Attalia overlevde naboene: da Perge og de andre byene på sletten forfalt etter oldtiden, forble den kystens hovedhavn og beholdt navnet, som Adalja og så Antalya."
  tl:
    - "Ang Atalia, ngayo'y Antalya sa timog Turkey, ay nakatayo sa mga talampas sa itaas ng maliit na likas na daungan sa Golpo ng Antalya, sa kanlurang gilid ng kapatagang Pamfilia. Sinasabi ni Strabo na ipinangalan ang lungsod sa tagapagtatag nitong si Attalus II Philadelphus, hari ng Pergamo (159–138 BK), na nagpadala rin ng mga kolonista sa maliit na kalapit na bayan ng Corycus at nagpaligid dito ng mas malaking pader. Binigyan ng Atalia ang mga hari ng Pergamo ng daungan sa timog na baybayin ng Asia Minor."
    - "Iniwan ng huling hari ng Pergamo ang kaniyang kaharian sa Roma noong 133 BK, at kalaunan ay napasailalim ang Atalia sa pamamahalang Romano. Noong 48 BK, tumatakas sa dagat pagkatapos ng pagkatalo sa Pharsalus, pumasok si Pompeyo sa Atalia sa Pamfilia bago ang anumang ibang lungsod; doon siya sinalubong ng mga trireme mula Cilicia, tinipon ang mga sundalo para sa kaniya, at sumama sa kaniya ang animnapung senador."
    - "Sa dulo ng kanilang unang paglalakbay, bumalik sina Pablo at Bernabe mula Pisidia patungong Pamfilia. Nang masalita nila ang salita sa Perga, nagsilusong sila sa Atalia, ang pinakamalapit na daungan, at naglayag mula roon patungong Antioquia sa Siria, kung saan sila unang isinugo para sa gawain. Ito ang tanging pagkakataong pinangalanan ang lungsod sa Biblia."
    - "Sa ilalim ng imperyo, nanatiling abalang bayang daungan ang Atalia. Ang isang pintuang marmol na may tatlong arko sa mga pader nito ay pumaparangal kay Emperador Adriano, na naglibot sa mga lalawigang silangan mga 130 AD, at isang bilog na moog ng panahong Romano, ang Hıdırlık Tower, ay nakatayo pa sa talampas sa itaas ng dagat. Nagtagal ang Atalia nang higit sa mga kapitbahay nito: nang humina ang Perga at iba pang lungsod ng kapatagan pagkatapos ng sinaunang panahon, nanatili itong pangunahing daungan ng baybayin at nagpanatili ng pangalan, bilang Adalia at pagkatapos ay Antalya."
  da:
    - "Attalia, i dag Antalya i det sydlige Tyrkiet, ligger på klipper over en lille naturlig havn ved Antalyabugten, ved den vestlige kant af Pamfyliens slette. Strabon siger, at byen blev opkaldt efter sin grundlægger, Attalos 2. Filadelfos, konge af Pergamon (159–138 f.Kr.), som også sendte kolonister til den lille nabo-by Korykos og omsluttede den med en større mur. Attalia gav Pergamons konger en havn på Lilleasiens sydkyst."
    - "Pergamons sidste konge efterlod sit rige til Rom i 133 f.Kr., og Attalia kom siden under romersk herredømme. I 48 f.Kr., på flugt over havet efter sit nederlag ved Farsalos, gik Pompejus ind i Attalia i Pamfylien før nogen anden by; dér mødte triremerne fra Kilikien ham, soldater blev samlet til ham, og seksti senatorer sluttede sig til ham."
    - "Ved slutningen af deres første rejse kom Paulus og Barnabas tilbage fra Pisidien ind i Pamfylien. Da de havde talt Ordet i Perge, »droge de ned til Attalia«, den nærmeste havn, og sejlede derfra til Antiokia i Syrien, hvor de først var blevet udsendt til gerningen. Det er den eneste gang, byen nævnes i Bibelen."
    - "Under kejserdømmet forblev Attalia en travl havneby. En marmorport med tre buer i dens mure hædrer kejser Hadrian, som rejste rundt i de østlige provinser omkring 130 e.Kr., og et rundt tårn fra romertiden, Hıdırlık-tårnet, står stadig på klippen over havet. Attalia overlevede sine naboer: da Perge og de andre byer på sletten gik i forfald efter oldtiden, forblev den kystens hovedhavn og bevarede sit navn, som Adalja og siden Antalya."
  sr:
    - "Аталија, данас Анталија у јужној Турској, стоји на литицама изнад мале природне луке на Анталијском заливу, на западном рубу памфилијске равнице. Страбон каже да је град назван по свом оснивачу, Аталу II Филаделфу, краљу Пергама (159–138. п. н. е.), који је послао колонисте и у мали суседни град Корик и опасао га већим зидом. Аталија је краљевима Пергама дала луку на јужној обали Мале Азије."
    - "Последњи краљ Пергама оставио је своје краљевство Риму 133. п. н. е., а Аталија је касније дошла под римску власт. Године 48. п. н. е., бежећи морем после пораза код Фарсала, Помпеј је ушао у Аталију у Памфилији пре било ког другог града; тамо су га сусреле тријере из Киликије, за њега су скупљени војници и придружило му се шездесет сенатора."
    - "На крају свог првог путовања Павле и Варнава вратили су се из Писидије у Памфилију. Пошто су проповедали реч у Перги, сишли су у Аталију, најближу луку, и отуда отпловили у Антиохију у Сирији, где су најпре били послани на дело. То је једини пут да се град именује у Библији."
    - "Под царством Аталија је остала жива лучка варош. Мермерна капија са три лука у њеним зидинама одаје почаст цару Хадријану, који је око 130. н. е. обишао источне провинције, а округла кула римског периода, кула Хидирлик, још стоји на литици изнад мора. Аталија је надживела своје суседе: када су Перга и остали градови равнице опали после антике, остала је главна лука обале и сачувала име, као Адалија, а затим Анталија."
  hu:
    - "Attália, a mai Antalya Dél-Törökországban, sziklákon áll egy kis természetes kikötő fölött az Antalyai-öbölben, a pamfíliai síkság nyugati szélén. Sztrabón szerint a várost alapítójáról, II. Attalosz Philadelphoszról, Pergamon királyáról (Kr. e. 159–138) nevezték el, aki telepeseket küldött a szomszédos kis Koryküsz városába is, és nagyobb fallal vette körül. Attália kikötőt adott Pergamon királyainak Kis-Ázsia déli partján."
    - "Pergamon utolsó királya Kr. e. 133-ban Rómára hagyta királyságát, és Attália később római uralom alá került. Kr. e. 48-ban, a pharszálosi vereség után tengeren menekülve, Pompeius más városok előtt Attáliába érkezett Pamfíliában; ott kilikiai triérák találkoztak vele, katonákat gyűjtöttek számára, és hatvan szenátor csatlakozott hozzá."
    - "Első útjuk végén Pál és Barnabás Piszídiából visszatért Pamfíliába. Miután Pergében hirdették az igét, lementek Attáliába, a legközelebbi kikötőbe, és onnan Szíriai Antiókhiába hajóztak, ahonnan először elküldték őket a munkára. A Biblia csak itt nevezi meg a várost."
    - "A császárkorban Attália forgalmas kikötőváros maradt. Falaiban egy háromíves márványkapu Hadrianus császárt tiszteli, aki Kr. u. 130 körül bejárta a keleti provinciákat, a római korból való kerek torony, a Hıdırlık-torony pedig ma is áll a tenger fölötti sziklán. Attália túlélte szomszédait: amikor Perge és a síkság más városai az ókor után hanyatlottak, a part fő kikötője maradt, és megtartotta nevét, Adalja, majd Antalya alakban."
  fi:
    - "Attalia, nykyinen Antalya Etelä-Turkissa, sijaitsee kallioilla pienen luonnonsataman yläpuolella Antalyanlahdella, Pamfylian tasangon länsireunalla. Strabon sanoo, että kaupunki nimettiin perustajansa, Pergamonin kuninkaan Attalos II Filadelfoksen (159–138 eaa.) mukaan, joka lähetti myös siirtolaisia viereiseen pieneen Korykoksen kaupunkiin ja ympäröi sen suuremmalla muurilla. Attalia antoi Pergamonin kuninkaille sataman Vähän-Aasian eteläisellä rannikolla."
    - "Pergamonin viimeinen kuningas jätti valtakuntansa Roomalle 133 eaa., ja Attalia joutui myöhemmin Rooman vallan alle. Vuonna 48 eaa., paetessaan meritse Farsaloksen tappionsa jälkeen, Pompeius saapui Pamfylian Attaliaan ennen mitään muuta kaupunkia; siellä Kilikian triremit kohtasivat hänet, hänelle koottiin sotilaita ja kuusikymmentä senaattoria liittyi häneen."
    - "Ensimmäisen matkansa lopussa Paavali ja Barnabas tulivat takaisin Pisidiasta Pamfyliaan. Saarnattuaan sanaa Pergessä he menivät alas Attaliaan, lähimpään satamaan, ja purjehtivat sieltä Syyrian Antiokiaan, mistä heidät oli ensin lähetetty työhön. Tämä on ainoa kerta, kun kaupunki mainitaan Raamatussa."
    - "Keisarikaudella Attalia pysyi vilkkaana satamakaupunkina. Sen muureissa oleva kolmikaarinen marmoriportti kunnioittaa keisari Hadrianusta, joka kiersi itäisiä provinsseja noin 130 jaa., ja roomalaisajan pyöreä torni, Hıdırlık-torni, seisoo yhä kalliolla meren yläpuolella. Attalia kesti naapureitaan kauemmin: kun Perge ja tasangon muut kaupungit taantuivat antiikin jälkeen, se pysyi rannikon pääsatamana ja säilytti nimensä, Adaljana ja sitten Antalyana."
  vi:
    - "Át-ta-li, nay là Antalya ở miền nam Thổ Nhĩ Kỳ, đứng trên các vách đá phía trên một bến cảng thiên nhiên nhỏ ở vịnh Antalya, tại rìa tây đồng bằng Bam-phi-ly. Strabon nói thành được đặt tên theo người sáng lập là Attalus II Philadelphus, vua Bẹt-găm (159–138 TCN), người cũng gửi dân di cư đến thị trấn nhỏ lân cận Corycus và bao quanh nó bằng một bức tường lớn hơn. Át-ta-li cho các vua Bẹt-găm một cảng trên bờ nam Tiểu Á."
    - "Vị vua cuối cùng của Bẹt-găm để lại vương quốc cho Rô-ma năm 133 TCN, và Át-ta-li về sau nằm dưới quyền La Mã. Năm 48 TCN, chạy trốn bằng đường biển sau thất bại ở Pharsalus, Pompeius vào Át-ta-li ở Bam-phi-ly trước bất kỳ thành nào khác; tại đó các chiến thuyền ba tầng chèo từ Si-li-si gặp ông, binh lính được tập hợp cho ông, và sáu mươi nguyên lão gia nhập ông."
    - "Cuối chuyến đi thứ nhất, Phao-lô và Ba-na-ba từ Bi-si-đi trở lại Bam-phi-ly. Sau khi giảng đạo ở Bẹt-giê, họ đi xuống Át-ta-li, hải cảng gần nhất, và từ đó chạy thuyền đến An-ti-ốt ở Sy-ri, nơi họ đã được sai đi làm công việc lúc đầu. Đây là lần duy nhất thành được nêu trong Kinh Thánh."
    - "Dưới đế quốc, Át-ta-li vẫn là một thị trấn cảng nhộn nhịp. Một cổng đá cẩm thạch ba vòm trong tường thành tôn vinh hoàng đế Hadrianus, người đi thăm các tỉnh phía đông khoảng năm 130, và một tháp tròn thời La Mã, Tháp Hıdırlık, vẫn đứng trên vách đá phía trên biển. Át-ta-li sống lâu hơn các láng giềng: khi Bẹt-giê và các thành khác của đồng bằng suy tàn sau thời cổ đại, nó vẫn là cảng chính của bờ biển và giữ tên, thành Adalia rồi Antalya."
  ro:
    - "Atalia, astăzi Antalya, în sudul Turciei, se află pe stânci deasupra unui mic port natural din Golful Antalya, la marginea de vest a câmpiei Pamfiliei. Strabon spune că orașul a fost numit după întemeietorul său, Attalos al II-lea Filadelf, regele Pergamului (159–138 î.Hr.), care a trimis coloniști și în micul oraș vecin Corycos și l-a înconjurat cu un zid mai mare. Atalia le-a dat regilor Pergamului un port pe coasta de sud a Asiei Mici."
    - "Ultimul rege al Pergamului și-a lăsat regatul Romei în 133 î.Hr., iar Atalia a trecut mai târziu sub stăpânire romană. În 48 î.Hr., fugind pe mare după înfrângerea de la Farsalos, Pompeiu a intrat în Atalia din Pamfilia înaintea oricărei alte cetăți; acolo l-au întâlnit trireme din Cilicia, au fost adunați soldați pentru el și șaizeci de senatori s-au alăturat lui."
    - "La sfârșitul primei lor călătorii, Pavel și Barnaba s-au întors din Pisidia în Pamfilia. După ce au predicat cuvântul la Perga, au coborât la Atalia, cel mai apropiat port, și au navigat de acolo spre Antiohia Siriei, de unde fuseseră trimiși la început pentru această lucrare. Este singura dată când cetatea este numită în Biblie."
    - "Sub imperiu, Atalia a rămas un oraș-port aglomerat. O poartă de marmură cu trei arcade în zidurile ei îl cinstește pe împăratul Hadrian, care a străbătut provinciile de răsărit în jurul anului 130 d.Hr., iar un turn rotund din perioada romană, Turnul Hıdırlık, stă încă pe stânca de deasupra mării. Atalia și-a depășit vecinii: când Perga și celelalte cetăți din câmpie au decăzut după Antichitate, ea a rămas portul principal al coastei și și-a păstrat numele, ca Adalia și apoi Antalya."
  bg:
    - "Аталия, днес Анталия в южна Турция, стои на скали над малко естествено пристанище в Анталийския залив, на западния край на Памфилийската равнина. Страбон казва, че градът бил наречен по основателя си Аттал II Филаделф, цар на Пергам (159–138 г. пр.н.е.), който изпратил колонисти и в малкия съседен град Корикос и го оградил с по-голяма стена. Аталия давала на царете на Пергам пристанище на южния бряг на Мала Азия."
    - "Последният цар на Пергам оставил царството си на Рим през 133 г. пр.н.е. и Аталия по-късно попаднала под римска власт. През 48 г. пр.н.е., бягайки по море след поражението си при Фарсал, Помпей влязъл в Аталия в Памфилия преди всеки друг град; там го посрещнали триреми от Киликия, били събрани войници за него и шестдесет сенатори се присъединили към него."
    - "В края на първото си пътуване Павел и Варнава се върнали от Писидия в Памфилия. След като проповядвали словото в Перга, те слезли в Аталия, най-близкото пристанище, и оттам отплували за Антиохия в Сирия, откъдето за първи път били изпратени за делото. Това е единственият път, когато градът е назован в Библията."
    - "При империята Аталия останала оживен пристанищен град. Мраморна порта с три арки в стените ѝ почита император Адриан, който обиколил източните провинции около 130 г. н.е., а кръгла кула от римския период, Кулата Хъдърлък, още стои на скалата над морето. Аталия надживяла съседите си: когато Перга и другите градове на равнината западнали след античността, тя останала главното пристанище на брега и запазила името си, като Адалия и после Анталия."
scripture:
  - Acts.13.1-Acts.13.3
  - Acts.14.24-Acts.14.26
