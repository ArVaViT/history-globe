# Overview article (ADR 0007). Mainstream facts only; the founding follows Strabo (Attalus II, reigned 159-138 BC).
id: attalia
place: ac744c1
title:
  en: "Attalia"
  ru: "Атталия"
  uk: "Атталія"
  es: "Atalia"
  pt: "Atália"
  de: "Attalia"
  fr: "Attalie"
body:
  en:
    - "Attalia, today Antalya in southern Turkey, stands on cliffs above a small natural harbour on the Gulf of Antalya, at the western edge of the Pamphylian plain. Strabo says that the city was named after its founder, Attalus II Philadelphus, king of Pergamum (159–138 BC), who also sent colonists to the small neighbouring town of Corycus and enclosed it with a larger wall. Attalia gave the kings of Pergamum a port on the southern coast of Asia Minor."
    - "The last king of Pergamum left his kingdom to Rome in 133 BC, and Attalia later came under Roman rule. In 48 BC, fleeing by sea after his defeat at Pharsalus, Pompey entered Attalia in Pamphylia before any other city; there triremes from Cilicia met him, soldiers were gathered for him, and sixty senators joined him."
    - "At the end of their first journey Paul and Barnabas came back from Pisidia into Pamphylia. When they had preached the word in Perga they went down to Attalia, the nearest port, and sailed from there to Antioch in Syria, where they had first been sent out for the work. This is the only time the city is named in the Bible."
    - "Under the empire Attalia remained a busy harbour town. A marble gate with three arches in its walls honours the emperor Hadrian, who toured the eastern provinces about AD 130, and a round tower of the Roman period, the Hıdırlık Tower, still stands on the cliff above the sea. Attalia outlasted its neighbours: when Perga and the other cities of the plain declined after antiquity, it remained the main port of the coast and kept its name, as Adalia and then Antalya."
  ru:
    - "Атталия, ныне Анталья на юге Турции, стоит на скалах над небольшой естественной гаванью в Анталийском заливе, у западного края Памфилийской равнины. Страбон пишет, что город был назван по имени своего основателя, пергамского царя Аттала II Филадельфа (159–138 гг. до н. э.), который также послал поселенцев в соседний городок Корик и обнёс его более широкой стеной. Атталия дала пергамским царям гавань на южном берегу Малой Азии."
    - "Последний пергамский царь завещал своё царство Риму в 133 г. до н. э., и со временем Атталия перешла под власть Рима. В 48 г. до н. э., спасаясь морем после поражения при Фарсале, Помпей первым из городов вошёл в Атталию в Памфилии; там его встретили триеры из Киликии, для него собрали воинов, и к нему присоединились шестьдесят сенаторов."
    - "В конце первого путешествия Павел и Варнава вернулись из Писидии в Памфилию. Проповедав слово в Пергии, они «сошли в Атталию», ближайшую гавань, и оттуда отплыли в Антиохию Сирийскую, откуда их когда-то отправили на это дело. Это единственное упоминание города в Библии."
    - "В Римской империи Атталия оставалась оживлённым портовым городом. Мраморные ворота с тремя арками в её стенах посвящены императору Адриану, который около 130 г. н. э. объезжал восточные провинции, а на скале над морем до сих пор стоит круглая башня римского времени — башня Хыдырлык. Атталия пережила своих соседей: когда Пергия и другие города равнины после античности пришли в упадок, она осталась главным портом побережья и сохранила своё имя — Адалия, а затем Анталья."
  uk:
    - "Атталія, нині Анталья на півдні Туреччини, стоїть на скелях над невеликою природною гаванню в Анталійській затоці, на західному краю Памфілійської рівнини. Страбон каже, що місто назвали за його засновником Атталом II Філадельфом, царем Пергама (159–138 рр. до н. е.), який також послав колоністів до сусіднього невеликого містечка Корік і оточив його більшим муром. Атталія дала царям Пергама порт на південному узбережжі Малої Азії."
    - "Останній цар Пергама заповів своє царство Римові в 133 р. до н. е., і Атталія згодом потрапила під римську владу. У 48 р. до н. е., тікаючи морем після поразки при Фарсалі, Помпей увійшов до Атталії в Памфілії раніше, ніж до будь-якого іншого міста; там його зустріли кілікійські тріреми, для нього зібрали воїнів, і до нього приєдналися шістдесят сенаторів."
    - "Наприкінці першої подорожі Павло і Варнава повернулися з Пісідії до Памфілії. Проповівши слово в Перге, вони зійшли до Атталії, найближчого порту, і відплили звідти до Антіохії Сирійської, звідки їх спершу послали на цю справу. Це єдиний раз, коли місто названо в Біблії."
    - "За імперії Атталія лишалася жвавим портовим містом. Мармурова брама з трьома арками в її мурах вшановує імператора Адріана, який об'їжджав східні провінції близько 130 р. н. е., а кругла вежа римського часу, вежа Хидирлик, і досі стоїть на скелі над морем. Атталія пережила сусідів: коли Перге та інші міста рівнини занепали після давнини, вона лишилася головним портом узбережжя і зберегла своє ім'я — як Адалья, а потім Анталья."
  es:
    - "Atalia, hoy Antalya, en el sur de Turquía, se alza sobre acantilados por encima de un pequeño puerto natural en el golfo de Antalya, en el borde occidental de la llanura de Panfilia. Estrabón dice que la ciudad recibió el nombre de su fundador, Átalo II Filadelfo, rey de Pérgamo (159–138 a. C.), que envió además colonos a la pequeña ciudad vecina de Coricos y la rodeó con una muralla mayor. Atalia dio a los reyes de Pérgamo un puerto en la costa meridional del Asia Menor."
    - "El último rey de Pérgamo legó su reino a Roma en 133 a. C., y Atalia pasó más tarde al dominio romano. En 48 a. C., huyendo por mar tras su derrota en Farsalia, Pompeyo entró en Atalia, en Panfilia, antes que en ninguna otra ciudad; allí lo recibieron trirremes de Cilicia, se reunieron soldados para él y sesenta senadores se le unieron."
    - "Al final de su primer viaje, Pablo y Bernabé volvieron de Pisidia a Panfilia. Cuando hubieron predicado la palabra en Perge, descendieron a Atalia, el puerto más cercano, y navegaron desde allí a Antioquía de Siria, de donde habían sido enviados primero para la obra. Esta es la única vez que la ciudad se nombra en la Biblia."
    - "Bajo el imperio Atalia siguió siendo una activa ciudad portuaria. Una puerta de mármol con tres arcos en sus murallas honra al emperador Adriano, que recorrió las provincias orientales hacia 130 d. C., y una torre redonda de época romana, la torre Hıdırlık, aún se alza en el acantilado sobre el mar. Atalia sobrevivió a sus vecinas: cuando Perge y las demás ciudades de la llanura decayeron tras la Antigüedad, siguió siendo el principal puerto de la costa y conservó su nombre, como Adalia y luego Antalya."
  pt:
    - "Atália, hoje Antalya, no sul da Turquia, ergue-se sobre penhascos acima de um pequeno porto natural no golfo de Antalya, na borda ocidental da planície da Panfília. Estrabão diz que a cidade recebeu o nome de seu fundador, Átalo II Filadelfo, rei de Pérgamo (159–138 a.C.), que também enviou colonos à pequena cidade vizinha de Corico e a cercou com uma muralha maior. Atália deu aos reis de Pérgamo um porto na costa sul da Ásia Menor."
    - "O último rei de Pérgamo legou seu reino a Roma em 133 a.C., e Atália passou mais tarde ao domínio romano. Em 48 a.C., fugindo por mar depois de sua derrota em Farsália, Pompeu entrou em Atália, na Panfília, antes de qualquer outra cidade; ali trirremes da Cilícia o encontraram, soldados foram reunidos para ele, e sessenta senadores se juntaram a ele."
    - "No fim da primeira viagem, Paulo e Barnabé voltaram da Pisídia à Panfília. Depois de pregar a palavra em Perge, desceram a Atália, o porto mais próximo, e dali navegaram para Antioquia da Síria, de onde tinham sido enviados primeiro para a obra. É a única vez que a cidade é nomeada na Bíblia."
    - "Sob o Império, Atália continuou sendo uma movimentada cidade portuária. Um portal de mármore com três arcos em suas muralhas honra o imperador Adriano, que percorreu as províncias orientais por volta de 130 d.C., e uma torre redonda da época romana, a Torre Hıdırlık, ainda se ergue sobre o penhasco acima do mar. Atália sobreviveu a suas vizinhas: quando Perge e as outras cidades da planície declinaram depois da Antiguidade, continuou sendo o principal porto da costa e conservou o nome, como Adália e depois Antalya."
  de:
    - "Attalia, heute Antalya in der Südtürkei, liegt auf Klippen über einem kleinen natürlichen Hafen am Golf von Antalya, am Westrand der pamphylischen Ebene. Strabon sagt, die Stadt sei nach ihrem Gründer Attalos II. Philadelphos, dem König von Pergamon (159–138 v. Chr.), benannt, der auch Siedler in das kleine benachbarte Städtchen Korykos schickte und es mit einer größeren Mauer umschloss. Attalia gab den Königen von Pergamon einen Hafen an der Südküste Kleinasiens."
    - "Der letzte König von Pergamon vermachte sein Reich 133 v. Chr. Rom, und Attalia kam später unter römische Herrschaft. 48 v. Chr. lief Pompeius auf der Flucht über das Meer nach seiner Niederlage bei Pharsalos vor jeder anderen Stadt Attalia in Pamphylien an; dort trafen ihn Trieren aus Kilikien, Soldaten wurden für ihn gesammelt, und sechzig Senatoren schlossen sich ihm an."
    - "Am Ende ihrer ersten Reise kamen Paulus und Barnabas aus Pisidien nach Pamphylien zurück. Als sie in Perge das Wort gepredigt hatten, gingen sie nach Attalia hinab, dem nächsten Hafen, und segelten von dort nach Antiochia in Syrien, wo sie zuerst für das Werk ausgesandt worden waren. Das ist das einzige Mal, dass die Stadt in der Bibel genannt wird."
    - "Unter dem Kaiserreich blieb Attalia eine rege Hafenstadt. Ein marmornes Tor mit drei Bögen in seinen Mauern ehrt Kaiser Hadrian, der um 130 n. Chr. die östlichen Provinzen bereiste, und ein runder Turm der römischen Zeit, der Hıdırlık-Turm, steht noch auf der Klippe über dem Meer. Attalia überdauerte seine Nachbarn: Als Perge und die anderen Städte der Ebene nach der Antike verfielen, blieb es der Haupthafen der Küste und behielt seinen Namen, als Adalja und dann Antalya."
  fr:
    - "Attalie, aujourd’hui Antalya, dans le sud de la Turquie, se dresse sur des falaises au-dessus d’un petit port naturel du golfe d’Antalya, à la lisière occidentale de la plaine de Pamphylie. Strabon dit que la ville fut nommée d’après son fondateur, Attale II Philadelphe, roi de Pergame (159-138 av. J.-C.), qui envoya aussi des colons dans la petite ville voisine de Korykos et l’enferma dans une plus grande enceinte. Attalie donnait aux rois de Pergame un port sur la côte méridionale de l’Asie Mineure."
    - "Le dernier roi de Pergame légua son royaume à Rome en 133 av. J.-C., et Attalie passa plus tard sous domination romaine. En 48 av. J.-C., fuyant par mer après sa défaite de Pharsale, Pompée entra à Attalie en Pamphylie avant toute autre ville ; là des trières de Cilicie le rejoignirent, des soldats furent rassemblés pour lui, et soixante sénateurs le rejoignirent."
    - "À la fin de leur premier voyage, Paul et Barnabas revinrent de Pisidie en Pamphylie. Quand ils eurent prêché la parole à Perge, ils descendirent à Attalie, le port le plus proche, et s’embarquèrent de là pour Antioche de Syrie, où on les avait d’abord envoyés pour l’œuvre. C’est la seule fois que la ville est nommée dans la Bible."
    - "Sous l’Empire, Attalie resta une ville portuaire active. Une porte de marbre à trois arches dans ses murs honore l’empereur Hadrien, qui parcourut les provinces orientales vers 130 apr. J.-C., et une tour ronde de l’époque romaine, la tour Hıdırlık, se dresse encore sur la falaise au-dessus de la mer. Attalie survécut à ses voisines : quand Perge et les autres villes de la plaine déclinèrent après l’Antiquité, elle resta le principal port de la côte et garda son nom, sous les formes Adalia puis Antalya."
