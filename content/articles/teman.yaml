body:
  en:
    - "Teman was a region, or a clan, of Edom. Teman was the first-named son of Eliphaz, Esau's firstborn, and one of the dukes of Edom; Husham, an early king of Edom, came “of the land of Temani”; and Eliphaz, the first of Job's three friends, was “the Temanite”. The name means “south”, and Teman was known for its sages: “Is wisdom no more in Teman?” asks Jeremiah's oracle against Edom. The prophets pair it with the whole land: fire upon Teman “shall devour the palaces of Bozrah”, Edom shall be desolate “from Teman” to Dedan, Teman's mighty men shall be dismayed. Habakkuk's hymn opens with the Lord coming “from Teman, and the Holy One from mount Paran”, the old picture of God marching up from the south."
    - "That southern God has an archaeological echo. At Kuntillet Ajrud, a caravan station in north-eastern Sinai of about 800 BC, inscriptions on storage jars and plaster invoke “Yahweh of Teman and his asherah” beside Yahweh of Samaria. Where Teman lay is disputed, and the map keeps the candidates. Eusebius knew a village Thaiman fifteen miles from Petra with a Roman garrison, and Nelson Glueck identified it with Tawilan above Petra, where Crystal Bennett excavated an Edomite farming village of the late Iron Age. Roland de Vaux argued from the prophets that Teman was northern Edom around Bozrah, the capital; others take it as a name for the whole land or for its south. Carcaria and Gharandal, on the plateau north of Petra, have also been proposed."
    - "Today the candidates lie in southern Jordan: Tawilan is a ruin beside the town of Wadi Musa at the gate of Petra, and Bozrah is Buseirah near Tafila."
  ru:
    - "Феман — область, или род, Едома. Феман был первым из названных сыновей Елифаза, первенца Исава, и одним из старейшин Едома; Хушам, ранний царь Едома, был «из земли Феманитян»; а Елифаз, первый из трёх друзей Иова, — «Феманитянин». Имя значит «юг», и Феман славился мудрецами: «разве нет более мудрости в Фемане?» — спрашивает пророчество Иеремии против Едома. Пророки ставят его рядом со всей страной: огонь на Феман «пожрет чертоги Восора», Едом станет пустынею «от Фемана до Дедана», храбрецы Фемана будут поражены страхом. Песнь Аввакума открывается словами «Бог от Фемана грядет», и Святый «от горы Фаран», — древний образ Бога, выступающего с юга."
    - "У этого южного Бога есть археологическое эхо. В Кунтиллет-Аджруде, караванной станции на северо-востоке Синая около 800 г. до н. э., надписи на кувшинах и штукатурке призывают «Яхве Феманского и его ашеру» рядом с Яхве Самарийским. Где лежал Феман, спорно, и карта хранит кандидатов. Евсевий знал селение Феман в пятнадцати милях от Петры с римским гарнизоном, и Нельсон Глюк отождествил его с Тавиланом над Петрой, где Кристал Беннетт раскопала едомское земледельческое селение позднего железного века. Ролан де Во доказывал по пророкам, что Феман — северный Едом вокруг столицы Восора; другие понимают его как имя всей страны или её юга. Предлагались также Каркария и Гарандаль на плато к северу от Петры."
    - "Сегодня кандидаты лежат на юге Иордании: Тавилан — руины рядом с городком Вади-Муса у ворот Петры, а Восор — Бусейра близ Тафилы."
  uk:
    - "Теман був областю, або родом, Едому. Теман був першим із названих синів Еліфаза, первістка Ісава, і одним із вождів Едому; Хушам, ранній цар Едому, походив «із Теман землї»; а Еліфаз, перший із трьох друзів Йова, був «Елифаз Теманський». Ім’я означає «південь», і Теман славився своїми мудрецями: «Невже ж у Теманї та нема розуму?» — питає пророцтво Єремії проти Едому. Пророки ставлять його в пару з усією країною: вогонь на Теман «нехай пожере в Босрі будівлї», Едом спустіє «Від Теману до Дедану», хоробрі Теману жахнуться. Гімн Авакума починається тим, що Бог іде з півдня: «Колись прийшов був Бог від Теману, Сьвятий — від Паран-гори» — давній образ Бога, що виступає з півдня."
    - "У цього південного Бога є археологічний відгук. У Кунтілет-Аджруді, караванній стоянці на північному сході Синаю близько 800 р. до н. е., написи на комірних глеках і штукатурці прикликають «Яхве Теманського та його ашеру» поряд з Яхве Самарійським. Де лежав Теман, спірно, і мапа зберігає кандидатів. Євсевій знав село Таїман за п’ятнадцять миль від Петри з римським гарнізоном, і Нельсон Глюк ототожнив його з Тавіланом над Петрою, де Крістал Беннет розкопала едомське хліборобське село пізньої залізної доби. Ролан де Во доводив з пророків, що Теман був північним Едомом навколо Боцри, столиці; інші вважають це назвою всієї країни або її півдня. Пропонували також Каркарію та Гарандал на плато на північ від Петри."
    - "Нині кандидати лежать на півдні Йорданії: Тавілан — руїна поряд з містом Вади-Муса біля входу до Петри, а Боцра — це Бусейра поблизу Тафіли."
  es:
    - "Temán era una región, o un clan, de Edom. Temán fue el primer hijo nombrado de Elifaz, primogénito de Esaú, y uno de los duques de Edom; Husam, uno de los primeros reyes de Edom, procedía «de tierra de Temán»; y Elifaz, el primero de los tres amigos de Job, era «Temanita». El nombre significa «sur», y Temán era conocida por sus sabios: «¿No hay más sabiduría en Temán?», pregunta el oráculo de Jeremías contra Edom. Los profetas la emparejan con toda la tierra: el fuego sobre Temán «consumirá los palacios de Bosra», Edom será asolada «desde Temán» hasta Dedán, los valientes de Temán serán quebrantados. El himno de Habacuc se abre con Dios que «vendrá de Temán, y el Santo del monte de Parán», la antigua imagen de Dios que avanza desde el sur."
    - "Ese Dios del sur tiene un eco arqueológico. En Kuntillet Ajrud, una estación de caravanas del noreste del Sinaí de hacia 800 a. C., inscripciones en jarras de almacenaje y en yeso invocan a «Yahvé de Temán y su asherá» junto a Yahvé de Samaria. Se discute dónde estaba Temán, y el mapa conserva los candidatos. Eusebio conocía una aldea Thaiman a quince millas de Petra con guarnición romana, y Nelson Glueck la identificó con Tawilan, sobre Petra, donde Crystal Bennett excavó una aldea agrícola edomita de finales de la Edad del Hierro. Roland de Vaux sostuvo a partir de los profetas que Temán era el norte de Edom en torno a Bosra, la capital; otros la toman como un nombre de toda la tierra o de su sur. También se han propuesto Carcaria y Gharandal, en la meseta al norte de Petra."
    - "Hoy los candidatos se hallan en el sur de Jordania: Tawilan es una ruina junto a la ciudad de Wadi Musa, a la entrada de Petra, y Bosra es Buseirah, cerca de Tafila."
  pt:
    - "Temã era uma região, ou um clã, de Edom. Temã foi o primeiro filho citado de Elifaz, primogênito de Esaú, e um dos chefes de Edom; Husã, um dos primeiros reis de Edom, veio “da terra dos temanitas”; e Elifaz, o primeiro dos três amigos de Jó, era “o temanita”. O nome significa “sul”, e Temã era conhecida por seus sábios: “Já não há sabedoria em Temã?”, pergunta o oráculo de Jeremias contra Edom. Os profetas a associam à terra inteira: o fogo sobre Temã “devorará os palácios de Bozra”, Edom será desolada “a partir de Temã” até Dedã, os valentes de Temã serão desanimados. O hino de Habacuque começa com Deus vindo “de Temã, o Santo, do monte Parã”, a antiga imagem de Deus avançando do sul."
    - "Esse Deus do sul tem um eco arqueológico. Em Kuntillet Ajrud, um posto de caravanas no nordeste do Sinai de cerca de 800 a.C., inscrições em jarros de armazenamento e em reboco invocam “Javé de Temã e sua asherá” ao lado de Javé de Samaria. Onde Temã ficava é discutido, e o mapa conserva os candidatos. Eusébio conhecia uma aldeia Thaiman a quinze milhas de Petra, com guarnição romana, e Nelson Glueck a identificou com Tawilan, acima de Petra, onde Crystal Bennett escavou uma aldeia agrícola edomita do fim da Idade do Ferro. Roland de Vaux argumentou, a partir dos profetas, que Temã era o norte de Edom, em torno de Bosra, a capital; outros a tomam como nome da terra toda ou de seu sul. Carcaria e Gharandal, no planalto ao norte de Petra, também foram propostas."
    - "Hoje os candidatos ficam no sul da Jordânia: Tawilan é uma ruína junto à cidade de Wadi Musa, à entrada de Petra, e Bosra é Buseirah, perto de Tafila."
  de:
    - "Teman war eine Region oder ein Clan Edoms. Teman war der erstgenannte Sohn des Eliphas, des Erstgeborenen Esaus, und einer der Fürsten Edoms; Husam, ein früher König Edoms, kam „aus der Themaniter Lande“; und Eliphas, der erste der drei Freunde Hiobs, war Eliphas von Theman. Der Name bedeutet „Süden“, und Teman war für seine Weisen bekannt: „Ist denn keine Weisheit mehr zu Theman?“ fragt der Spruch Jeremias gegen Edom. Die Propheten verbinden es mit dem ganzen Land: Feuer gegen Teman, „das soll die Paläste zu Bozra verzehren“, Edom soll wüst werden „von Theman bis gen Dedan“, „deine Starken zu Theman sollen zagen“. Habakuks Hymnus beginnt: „Gott kam vom Mittag und der Heilige vom Gebirge Pharan“ (im Hebräischen steht dort Teman), das alte Bild des Gottes, der aus dem Süden heranzieht."
    - "Dieser südliche Gott hat ein archäologisches Echo. In Kuntillet Ajrud, einer Karawanenstation im nordöstlichen Sinai um 800 v. Chr., rufen Inschriften auf Vorratskrügen und Putz „Jahwe von Teman und seine Aschera“ an, neben Jahwe von Samaria. Wo Teman lag, ist umstritten, und die Karte behält die Kandidaten bei. Eusebius kannte ein Dorf Thaiman fünfzehn Meilen von Petra mit römischer Garnison, und Nelson Glueck setzte es mit Tawilan oberhalb von Petra gleich, wo Crystal Bennett ein edomitisches Bauerndorf der späten Eisenzeit ausgrub. Roland de Vaux schloss aus den Propheten, Teman sei das nördliche Edom um die Hauptstadt Bozra; andere halten es für einen Namen des ganzen Landes oder seines Südens. Auch Carcaria und Gharandal auf dem Plateau nördlich von Petra wurden vorgeschlagen."
    - "Heute liegen die Kandidaten in Südjordanien: Tawilan ist eine Ruine neben der Stadt Wadi Musa am Eingang von Petra, und Bozra ist Buseirah bei Tafila."
  fr:
    - "Théman était une région, ou un clan, d’Édom. Théman était le premier nommé des fils d’Éliphaz, premier-né d’Ésaü, et l’un des chefs d’Édom ; Huscham, ancien roi d’Édom, venait « du pays des Thémanites » ; et Éliphaz, le premier des trois amis de Job, était « de Théman ». Le nom signifie « sud », et Théman était connue pour ses sages : « N’y a-t-il plus de sagesse dans Théman ? » demande l’oracle de Jérémie contre Édom. Les prophètes l’associent à tout le pays : le feu sur Théman « dévorera les palais de Botsra », Édom sera désolé « de Théman » à Dedan, les guerriers de Théman seront dans l’épouvante. L’hymne d’Habacuc s’ouvre sur la venue de Dieu : « Dieu vient de Théman, le Saint vient de la montagne de Paran », l’ancienne image de Dieu montant du sud."
    - "Ce Dieu du sud a un écho archéologique. À Kuntillet Ajrud, étape caravanière du nord-est du Sinaï vers 800 av. J.-C., des inscriptions sur des jarres et sur l’enduit invoquent « Yahvé de Théman et son achéra » à côté de Yahvé de Samarie. L’emplacement de Théman est discuté, et la carte garde les candidats. Eusèbe connaissait un village Thaiman à quinze milles de Pétra, avec une garnison romaine, et Nelson Glueck l’identifia à Tawilan, au-dessus de Pétra, où Crystal Bennett fouilla un village agricole édomite de la fin de l’âge du fer. Roland de Vaux soutint, d’après les prophètes, que Théman était le nord d’Édom autour de Botsra, la capitale ; d’autres y voient un nom du pays entier ou de son sud. Carcaria et Gharandal, sur le plateau au nord de Pétra, ont aussi été proposés."
    - "Aujourd’hui, les candidats se trouvent dans le sud de la Jordanie : Tawilan est une ruine à côté de la ville de Wadi Moussa, à la porte de Pétra, et Botsra est Buseirah, près de Tafila."
  pl:
    - "Teman był regionem lub rodem w Edomie. Teman był pierwszym wymienionym synem Elifaza, pierworodnego Ezawa, i jednym z książąt Edomu; Chuszam, wczesny król Edomu, pochodził „z ziemi Temańskiej”, a pierwszy z trzech przyjaciół Hioba to „Elifas Temańczyk”. Nazwa znaczy „południe”, a Teman słynął z mędrców: „Izali niemasz więcej mądrości w Teman?” pyta wyrocznia Jeremiasza przeciw Edomowi. Prorocy łączą go z całym krajem: ogień na Teman „pożre pałace w Bocra”, Edom będzie spustoszony „od Teman aż do Dedan”, mocarze Temanu zlękną się. Hymn Habakuka zaczyna się od przyjścia Pana z Temanu, a Świętego z góry Paran, starego obrazu Boga ciągnącego z południa."
    - "Ten południowy Bóg ma archeologiczne echo. W Kuntillet Adżrud, stacji karawan w północno-wschodnim Synaju z około 800 roku p.n.e., inskrypcje na dzbanach zasobowych i tynku wzywają „Jahwe z Temanu i jego aszerę” obok Jahwe z Samarii. Gdzie leżał Teman, jest sporne, i mapa zachowuje kandydatów. Euzebiusz znał wieś Thaiman o piętnaście mil od Petry z rzymskim garnizonem, a Nelson Glueck utożsamił ją z Tawilan nad Petrą, gdzie Crystal Bennett odkopała edomicką wieś rolniczą z późnej epoki żelaza. Roland de Vaux dowodził na podstawie proroków, że Teman był północnym Edomem wokół Bosry, stolicy; inni biorą to za nazwę całego kraju lub jego południa. Proponowano też Karkarię i Garandal na płaskowyżu na północ od Petry."
    - "Dziś kandydaci leżą w południowej Jordanii: Tawilan to ruina obok miasta Wadi Musa u wrót Petry, a Bosra to Buseira koło Tafili."
  it:
    - "Teman era una regione, o un clan, di Edom. Teman fu il primo nominato dei figli di Elifaz, primogenito di Esaù, e uno dei capi di Edom; Cusam, uno dei primi re di Edom, era «del paese de’ Temaniti»; ed Elifaz, il primo dei tre amici di Giobbe, era «di Teman». Il nome significa «sud», e Teman era nota per i suoi saggi: «Non v’è egli più saviezza in Teman?» chiede l’oracolo di Geremia contro Edom. I profeti l’accostano all’intero paese: il fuoco su Teman «divorerà i palazzi di Botsra», Edom sarà un deserto «fino da Theman» a Dedan, i prodi di Teman saranno costernati. L’inno di Abacuc si apre con Dio che viene «da Teman, e il santo viene dal monte di Paran», l’antica immagine di Dio che avanza dal sud."
    - "Quel Dio del sud ha un’eco archeologica. A Kuntillet Ajrud, una stazione carovaniera nel Sinai nord-orientale dell’800 a.C. circa, iscrizioni su giare e intonaco invocano «Yahweh di Teman e la sua asherah» accanto a Yahweh di Samaria. Dove si trovasse Teman è discusso, e la mappa conserva i candidati. Eusebio conosceva un villaggio Thaiman a quindici miglia da Petra con una guarnigione romana, e Nelson Glueck lo identificò con Tawilan sopra Petra, dove Crystal Bennett scavò un villaggio agricolo edomita della tarda età del Ferro. Roland de Vaux sostenne, in base ai profeti, che Teman fosse l’Edom settentrionale attorno a Bosra, la capitale; altri la ritengono un nome dell’intero paese o del suo sud. Sono stati proposti anche Carcaria e Gharandal, sull’altopiano a nord di Petra."
    - "Oggi i candidati si trovano nella Giordania meridionale: Tawilan è una rovina accanto alla città di Wadi Musa, alla porta di Petra, e Bosra è Buseirah presso Tafila."
  nl:
    - "Teman was een streek, of een clan, van Edom. Teman was de eerstgenoemde zoon van Elifaz, de eerstgeborene van Ezau, en een van de vorsten van Edom; Chusam, een vroege koning van Edom, kwam “uit der Temanieten land”; en Elifaz, de eerste van de drie vrienden van Job, was “de Themaniet”. De naam betekent “zuid”, en Teman stond bekend om zijn wijzen: “Is er dan geen wijsheid meer te Theman?” vraagt het godsspraakwoord van Jeremia tegen Edom. De profeten koppelen het aan het hele land: een vuur in Theman “zal de paleizen van Bozra verteren”, Edom zal woest worden “van Theman af” tot Dedan, en: “Ook zullen uw helden, o Theman! versaagd zijn”. Het lied van Habakuk opent met God die komt: “God kwam van Theman, en de Heilige van den berg Paran”, het oude beeld van God die uit het zuiden optrekt."
    - "Die God uit het zuiden heeft een archeologische weerklank. Bij Kuntillet Ajrud, een karavaanstation in het noordoosten van de Sinaï van omstreeks 800 v.Chr., roepen opschriften op voorraadkruiken en pleisterwerk “Jahweh van Teman en zijn asjera” aan, naast Jahweh van Samaria. Waar Teman lag, wordt betwist, en de kaart houdt de kandidaten aan. Eusebius kende een dorp Thaiman op vijftien mijl van Petra met een Romeins garnizoen, en Nelson Glueck vereenzelvigde het met Tawilan boven Petra, waar Crystal Bennett een Edomitisch boerendorp uit de late IJzertijd opgroef. Roland de Vaux betoogde op grond van de profeten dat Teman het noordelijke Edom rond Bozra, de hoofdstad, was; anderen nemen het als naam voor het hele land of voor het zuiden ervan. Carcaria en Gharandal, op het plateau ten noorden van Petra, zijn ook voorgesteld."
    - "Tegenwoordig liggen de kandidaten in het zuiden van Jordanië: Tawilan is een ruïne naast de stad Wadi Musa bij de ingang van Petra, en Bozra is Buseirah bij Tafila."
  cs:
    - "Témán byl region, nebo klan, Edómu. Témán byl první jmenovaný syn Elifaze, prvorozeného Ezauova, a jedno z edómských knížat; Chušam, raný král Edómu, byl „z země Temanské“ a Elifaz, první ze tří Jobových přátel, byl „Temanský“. Jméno znamená „jih“ a Témán byl proslulý svými mudrci: „Což není více moudrosti v Teman?“ ptá se Jeremjášovo proroctví proti Edómu. Proroci ho spojují s celou zemí: oheň na Témán, „kterýžto zžíře paláce v Bozra“, Edóm bude zpustošen „od Teman“ až po Dedan, Témánovi hrdinové budou zděšeni. Abakukův chvalozpěv začíná příchodem Hospodina z Témánu a Svatého z hory Páran, starým obrazem Boha táhnoucího z jihu."
    - "Tento jižní Bůh má archeologickou ozvěnu. V Kuntillet Adžrúdu, karavanní stanici v severovýchodním Sinaji z doby kolem roku 800 př. n. l., nápisy na zásobních nádobách a na omítce vzývají „Jahveho z Témánu a jeho ašéru“ vedle Jahveho samařského. Kde Témán ležel, je sporné, a mapa ponechává kandidáty. Eusebius znal vesnici Thaiman patnáct mil od Petry s římskou posádkou a Nelson Glueck ji ztotožnil s Tawílánem nad Petrou, kde Crystal Bennettová vykopala edómskou zemědělskou vesnici z pozdní doby železné. Roland de Vaux na základě proroků soudil, že Témán byl severní Edóm kolem Bosry, hlavního města; jiní jej pokládají za jméno celé země nebo jejího jihu. Navrhovány byly také Carcaria a Gharandal na náhorní plošině severně od Petry."
    - "Dnes kandidáti leží v jižním Jordánsku: Tawílán je zřícenina u města Wádí Músa u brány Petry a Bosra je Buseira u Tafíly."
  sv:
    - "Teman var en region, eller en klan, i Edom. Teman var den förstnämnde sonen till Elifas, Esaus förstfödde, och en av Edoms hövdingar; Husham, en tidig kung av Edom, kom ”från temanéernas land”; och Elifas, den förste av Jobs tre vänner, kallas ”Elifas från Teman”. Namnet betyder ”söder”, och Teman var känt för sina vise: ”Finnes då ingen vishet mer i Teman?” frågar Jeremias utsaga mot Edom. Profeterna parar det med hela landet: eld mot Teman ”skall förtära Bosras palatser”, Edom ska bli öde ”ända från Teman” till Dedan, Temans hjältar ska förfäras. Habackuks hymn inleds med att Herren kommer ”från Teman, den helige från berget Paran”, den gamla bilden av Gud som drar fram från söder."
    - "Den sydliga guden har ett arkeologiskt eko. Vid Kuntillet Ajrud, en karavanstation i nordöstra Sinai från omkring 800 f.Kr., åkallar inskrifter på förrådskärl och puts ”Jahve från Teman och hans asherah” vid sidan av Jahve från Samaria. Var Teman låg är omstritt, och kartan behåller kandidaterna. Eusebios kände en by Thaiman femton romerska mil från Petra med en romersk garnison, och Nelson Glueck identifierade den med Tawilan ovanför Petra, där Crystal Bennett grävde ut en edomitisk jordbruksby från sen järnålder. Roland de Vaux hävdade utifrån profeterna att Teman var norra Edom kring Bosra, huvudstaden; andra tar det som ett namn på hela landet eller på dess södra del. Carcaria och Gharandal, på platån norr om Petra, har också föreslagits."
    - "I dag ligger kandidaterna i södra Jordanien: Tawilan är en ruin bredvid staden Wadi Musa vid Petras port, och Bosra är Buseirah nära Tafila."
  nb:
    - "Teman var en region, eller en klan, i Edom. Teman var den første nevnte sønnen til Elifas, Esaus førstefødte, og en av stammefyrstene i Edom; Husjam, en tidlig konge i Edom, kom «fra temanittenes land»; og Elifas, den første av Jobs tre venner, var «fra Teman». Navnet betyr «sør», og Teman var kjent for sine vismenn: «Er det ikke mere nogen visdom i Teman?» spør Jeremias utsagn mot Edom. Profetene setter det i par med hele landet: ild mot Teman, «den skal fortære Bosras palasser», Edom skal bli en ørken «helt fra Teman» til Dedan, Temans kjemper skal bli motløse. Habakkuks salme åpner med at Gud kommer «fra Teman, den Hellige fra Paran-fjellet», det gamle bildet av Gud som marsjerer opp fra sør."
    - "Den sørlige Gud har et arkeologisk ekko. Ved Kuntillet Ajrud, en karavanestasjon i nordøstlige Sinai fra omkring 800 f.Kr., påkaller innskrifter på lagerkrukker og puss «Jahve fra Teman og hans asjera» ved siden av Jahve fra Samaria. Hvor Teman lå, er omstridt, og kartet beholder kandidatene. Eusebius kjente en landsby Thaiman femten romerske mil fra Petra med en romersk garnison, og Nelson Glueck identifiserte den med Tawilan over Petra, hvor Crystal Bennett utgravde en edomittisk jordbrukslandsby fra sen jernalder. Roland de Vaux argumenterte ut fra profetene for at Teman var det nordlige Edom rundt Bosra, hovedstaden; andre tar det som et navn på hele landet eller på dets sørlige del. Carcaria og Gharandal, på platået nord for Petra, er også foreslått."
    - "I dag ligger kandidatene i det sørlige Jordan: Tawilan er en ruin ved byen Wadi Musa ved porten til Petra, og Bosra er Buseirah nær Tafila."
  tl:
    - "Ang Teman ay isang rehiyon, o angkan, ng Edom. Si Teman ang unang pinangalanang anak ni Eliphaz, panganay ni Esau, at isa sa mga pinuno ng Edom; si Husam, isang maagang hari ng Edom, ay galing sa “lupain ng mga Temaneo”; at si Eliphaz, ang una sa tatlong kaibigan ni Job, ay “na Temanita”. Ang pangalan ay nangangahulugang “timog”, at kilala ang Teman sa mga pantas nito: “Wala na baga ang karunungan sa Teman?” tanong ng orakulo ni Jeremias laban sa Edom. Itinatambal ito ng mga propeta sa buong lupain: apoy sa Teman na “susupukin niyaon ang mga palacio sa Bozra”, ang Edom ay magiging sira “mula sa Teman” hanggang Dedan, manghihina ang mga makapangyarihan ng Teman. Ang awit ni Habacuc ay nagsisimula sa Panginoong dumarating “mula sa Tema, At ang Banal ay mula sa bundok ng Paran”, ang lumang larawan ng Diyos na umaakyat mula sa timog."
    - "Ang Diyos na iyon ng timog ay may bakas na arkeolohiko. Sa Kuntillet Ajrud, isang himpilan ng caravan sa hilagang-silangang Sinai noong mga 800 BK, ang mga inskripsiyon sa mga banga at plaster ay tumatawag sa “Yahweh ng Teman at ng kaniyang asherah” kasama ng Yahweh ng Samaria. Pinagtatalunan kung saan ang Teman, at pinananatili ng mapa ang mga kandidato. Kilala ni Eusebio ang nayong Thaiman, labinlimang milya mula sa Petra, na may garison na Romano, at kinilala ito ni Nelson Glueck sa Tawilan sa itaas ng Petra, kung saan hinukay ni Crystal Bennett ang isang nayong bukid na Edomita noong huling Panahong Bakal. Ipinagtanggol ni Roland de Vaux mula sa mga propeta na ang Teman ay hilagang Edom sa paligid ng Bozra, ang kabisera; ang iba ay itinuturing itong pangalan ng buong lupain o ng timog nito. Iminungkahi rin ang Carcaria at Gharandal, sa talampas sa hilaga ng Petra."
    - "Ngayon, ang mga kandidato ay nasa timog ng Jordan: ang Tawilan ay guho sa tabi ng bayan ng Wadi Musa sa pintuan ng Petra, at ang Bozra ay ang Buseirah malapit sa Tafila."
