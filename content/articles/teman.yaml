    - "Den sydlige Gud har et arkæologisk ekko. Ved Kuntillet Ajrud, en karavanestation i det nordøstlige Sinai fra omkring 800 f.Kr., påkalder indskrifter på forrådskar og puds »Jahve fra Teman og hans asjera« ved siden af Jahve fra Samaria. Hvor Teman lå, er omstridt, og kortet beholder kandidaterne. Eusebius kendte en landsby Thaiman femten romerske mil fra Petra med en romersk garnison, og Nelson Glueck identificerede den med Tawilan oven for Petra, hvor Crystal Bennett udgravede en edomitisk landbrugslandsby fra sen jernalder. Roland de Vaux argumenterede ud fra profeterne for, at Teman var det nordlige Edom omkring hovedstaden Bosra; andre tager det som et navn for hele landet eller for dets syd. Carcaria og Gharandal, på højsletten nord for Petra, er også blevet foreslået."
