# Overview article (ADR 0007). Three Taverns (Tres Tabernae) was a station on the Via Appia at or near Cisterna di Latina; Cicero per Att. 2.10/2.12; later history per Catholic Encyclopedia and the 1911 Britannica; excavation per FASTI (Cassieri).
