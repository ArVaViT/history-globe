body:
  en:
    - "Three Taverns (Latin Tres Tabernae) was a post station on the Via Appia, about 50 km from Rome, where a road from Antium met the main road, at or near the modern town of Cisterna di Latina. Cicero wrote a letter to Atticus from there in April 59 BC, at the festival of Ceres, and another from the Forum of Appius, which he says he wrote a little after one sent from Three Taverns."
    - "As Paul came up the Appian Way towards Rome, Christians of the city came out to meet him in two groups: “when the brethren heard of us, they came to meet us as far as Appii forum, and The three taverns: whom when Paul saw, he thanked God, and took courage.” Three Taverns was the nearer of the two meeting places to Rome."
    - "In late antiquity Tres Tabernae became the seat of a bishop, with a cathedral dedicated to Saint Paul; when marshes spread over the area, the people of nearby Ulubrae probably moved there. The place was later deserted, and in 592 Pope Gregory I entrusted its diocese to Bishop John of Velletri, to which it was then united. Excavations by Nicoletta Cassieri of the Lazio archaeological superintendency, where the Via Appia crosses the Via Ninfina at Cisterna, uncovered a complex used from the first to the ninth century AD, with a small bath, a well, a large cistern and mosaic-floored rooms, probably the station itself."
  ru:
    - "Три гостиницы (лат. Tres Tabernae) — почтовая станция на Аппиевой дороге, примерно в 50 км от Рима, там, где к главному пути выходила дорога из Анция, в нынешнем городе Чистерна-ди-Латина или близ него. Цицерон написал отсюда письмо Аттику в апреле 59 г. до н. э., в праздник Цереры, а другое — с Аппиева форума, оговорив, что пишет его вскоре после письма, отправленного от Трёх Таверн."
    - "Когда Павел поднимался по Аппиевой дороге к Риму, христиане города вышли ему навстречу двумя группами: «Тамошние братья, услышав о нас, вышли нам навстречу до Аппиевой площади и трех гостиниц. Увидев их, Павел возблагодарил Бога и ободрился». Три гостиницы были ближайшим к Риму из двух мест встречи."
    - "В поздней античности Три гостиницы стали кафедрой епископа с собором во имя святого Павла; когда местность заболотилась, сюда, вероятно, переселились жители соседних Улубр. Позднее место опустело, и в 592 г. папа Григорий I поручил его епархию епископу Веллетри Иоанну, после чего она была присоединена к Веллетри. Раскопки Николетты Кассиери из археологического управления Лацио у пересечения Аппиевой дороги с дорогой Нинфина в Чистерне открыли комплекс, существовавший с I по IX в. н. э., с небольшой баней, колодцем, большой цистерной и комнатами с мозаичными полами — вероятно, саму станцию."
  uk:
    - "Три гостиниці (латиною Tres Tabernae) були поштовою станцією на Аппієвій дорозі, приблизно за 50 км від Рима, де дорога від Анція сходилася з головною дорогою, на місці або поблизу сучасного міста Чистерна-ді-Латіна. Цицерон написав звідти лист до Аттіка в квітні 59 р. до н. е., на свято Церери, і ще один з Аппієвої площі, який, за його словами, написав трохи після листа, надісланого з Трьох гостиниць."
    - "Коли Павло піднімався Аппієвою дорогою до Рима, християни міста вийшли назустріч йому двома групами: «Звідтіля, почувши брати про нас, повиходили назустріч нам аж до Апиєвого торгу та Трох Гостинниць. Побачивши їх Павел і подякувавши Богу, набрав ся сьмілости». Три гостиниці були ближчим до Рима з двох місць зустрічі."
    - "У пізню античність Tres Tabernae стали осідком єпископа, з собором, присвяченим св. Павлу; коли болота поширилися на цю місцевість, мешканці сусідніх Улюбр, імовірно, перебралися туди. Згодом місце спустіло, і 592 р. папа Григорій I доручив його єпархію єпископові Івану з Веллетрі, до якого її тоді й приєднали. Розкопки Ніколетти Кассьєрі з археологічного управління Лаціо там, де Аппієва дорога перетинає Віа-Німфіна в Чистерні, виявили комплекс, що використовувався від I до IX ст. н. е., з малою лазнею, криницею, великою цистерною та приміщеннями з мозаїчними підлогами, імовірно, саму станцію."
  es:
    - "Tres Tabernas (en latín Tres Tabernae) fue una estación de postas de la Vía Apia, a unos 50 km de Roma, donde un camino procedente de Ancio se unía a la calzada principal, en la actual ciudad de Cisterna di Latina o cerca de ella. Cicerón escribió desde allí una carta a Ático en abril de 59 a. C., en la fiesta de Ceres, y otra desde el Foro de Apio, que dice haber escrito poco después de una enviada desde Tres Tabernas."
    - "Cuando Pablo subía por la Vía Apia hacia Roma, cristianos de la ciudad salieron a su encuentro en dos grupos: «oyendo de nosotros los hermanos, nos salieron á recibir hasta la plaza de Appio, y Las Tres Tabernas: á los cuales como Pablo vió, dió gracias á Dios, y tomó aliento». Tres Tabernas era el más cercano a Roma de los dos lugares de encuentro."
    - "En la Antigüedad tardía Tres Tabernas fue sede de un obispo, con una catedral dedicada a san Pablo; cuando las marismas se extendieron por la zona, la gente de la cercana Úlubras probablemente se trasladó allí. El lugar fue abandonado más tarde, y en 592 el papa Gregorio I confió su diócesis al obispo Juan de Velletri, a la que entonces quedó unida. Las excavaciones de Nicoletta Cassieri, de la superintendencia arqueológica del Lacio, donde la Vía Apia cruza la Vía Ninfina en Cisterna, sacaron a la luz un complejo usado del siglo I al IX d. C., con un pequeño baño, un pozo, una gran cisterna y salas con suelos de mosaico, probablemente la propia estación."
  pt:
    - "As Três Vendas (em latim Tres Tabernae) eram uma estação de posta na Via Ápia, a cerca de 50 km de Roma, onde uma estrada vinda de Âncio encontrava a estrada principal, na atual cidade de Cisterna di Latina ou perto dela. Cícero escreveu dali uma carta a Ático em abril de 59 a.C., na festa de Ceres, e outra do Foro de Ápio, que diz ter escrito pouco depois de uma enviada das Três Vendas."
    - "Quando Paulo subia a Via Ápia em direção a Roma, cristãos da cidade saíram ao seu encontro em dois grupos: “os irmãos, quando ouviram falar de nós, vieram ao nosso encontro até a Praça de Ápio e as Três Vendas. Quando Paulo os viu, deu graças a Deus e sentiu-se encorajado.” As Três Vendas eram o mais próximo de Roma dos dois pontos de encontro."
    - "Na Antiguidade tardia, Tres Tabernae tornou-se sede de um bispo, com uma catedral dedicada a São Paulo; quando os pântanos se espalharam pela região, o povo da vizinha Úlubras provavelmente se mudou para lá. O lugar foi depois abandonado, e em 592 o papa Gregório I confiou sua diocese ao bispo João de Velletri, à qual foi então unida. Escavações de Nicoletta Cassieri, da superintendência arqueológica do Lácio, onde a Via Ápia cruza a Via Ninfina em Cisterna, revelaram um complexo usado do século I ao IX d.C., com um pequeno banho, um poço, uma grande cisterna e salas de piso de mosaico, provavelmente a própria estação."
  de:
    - "Tres Tabernae (lateinisch für Drei Tavernen) war eine Poststation an der Via Appia, etwa 50 km von Rom, wo eine Straße von Antium auf die Hauptstraße traf, bei oder nahe der heutigen Stadt Cisterna di Latina. Cicero schrieb von dort im April 59 v. Chr., zum Fest der Ceres, einen Brief an Atticus und einen weiteren aus dem Forum Appii, den er, wie er sagt, kurz nach einem von Tres Tabernae abgesandten schrieb."
    - "Als Paulus die Via Appia hinauf nach Rom kam, gingen ihm Christen der Stadt in zwei Gruppen entgegen: „Und von dort, da die Brüder von uns hörten, gingen sie aus, uns entgegen, bis gen Appifor und Tretabern. Da die Paulus sah, dankte er Gott und gewann eine Zuversicht.“ Tres Tabernae war der näher an Rom gelegene der beiden Treffpunkte."
    - "In der Spätantike wurde Tres Tabernae Sitz eines Bischofs, mit einer dem heiligen Paulus geweihten Kathedrale; als sich Sümpfe über die Gegend ausbreiteten, zogen wohl die Leute des nahen Ulubrae dorthin. Der Ort wurde später aufgegeben, und 592 vertraute Papst Gregor I. sein Bistum Bischof Johannes von Velletri an, mit dem es damals vereinigt wurde. Grabungen von Nicoletta Cassieri von der archäologischen Soprintendenza Latiums, wo die Via Appia in Cisterna die Via Ninfina kreuzt, legten einen vom ersten bis zum neunten Jahrhundert n. Chr. genutzten Komplex mit einem kleinen Bad, einem Brunnen, einer großen Zisterne und Räumen mit Mosaikböden frei, wahrscheinlich die Station selbst."
  it:
    - "Le Tre Taverne (in latino Tres Tabernae) erano una stazione di posta sulla via Appia, a circa 50 km da Roma, dove una strada da Anzio incontrava la via principale, presso l’odierna Cisterna di Latina o nelle sue vicinanze. Cicerone scrisse da là una lettera ad Attico nell’aprile del 59 a.C., durante la festa di Cerere, e un’altra dal Foro di Appio, che dice di aver scritto poco dopo una inviata dalle Tre Taverne."
    - "Mentre Paolo risaliva la via Appia verso Roma, i cristiani della città gli andarono incontro in due gruppi: «i fratelli, avute nostre notizie, di là ci vennero incontro sino al Foro Appio e alle Tre Taverne; e Paolo, quando li ebbe veduti, rese grazie a Dio e prese animo». Dei due luoghi di incontro, le Tre Taverne erano il più vicino a Roma."
    - "Nella tarda antichità Tres Tabernae divenne sede di un vescovo, con una cattedrale dedicata a san Paolo; quando le paludi si estesero nella zona, gli abitanti della vicina Ulubre vi si trasferirono probabilmente. Il luogo fu poi abbandonato, e nel 592 papa Gregorio I affidò la sua diocesi al vescovo Giovanni di Velletri, a cui fu allora unita. Gli scavi di Nicoletta Cassieri della Soprintendenza archeologica del Lazio, dove la via Appia incrocia la via Ninfina a Cisterna, hanno portato alla luce un complesso usato dal I al IX secolo d.C., con un piccolo bagno, un pozzo, una grande cisterna e ambienti con pavimenti a mosaico, probabilmente la stazione stessa."
  fr:
    - "Trois-Tavernes (en latin Tres Tabernae) était un relais de la via Appia, à environ 50 km de Rome, où une route venue d’Antium rejoignait la route principale, à l’emplacement ou près de l’actuelle Cisterna di Latina. Cicéron y écrivit une lettre à Atticus en avril 59 av. J.-C., à la fête de Cérès, et une autre du Forum d’Appius, qu’il dit avoir écrite un peu après celle de Trois-Tavernes."
    - "Comme Paul montait par la voie Appienne vers Rome, des chrétiens de la ville vinrent à sa rencontre en deux groupes : « De Rome vinrent à notre rencontre, jusqu’au Forum d’Appius et aux Trois Tavernes, les frères qui avaient entendu parler de nous. Paul, en les voyant, rendit grâces à Dieu, et prit courage. » Trois-Tavernes était celui des deux lieux de rencontre le plus proche de Rome."
    - "À la fin de l’Antiquité, Tres Tabernae devint le siège d’un évêque, avec une cathédrale dédiée à saint Paul ; quand les marais gagnèrent la région, les habitants d’Ulubrae, toute proche, s’y installèrent probablement. Le lieu fut ensuite déserté, et en 592 le pape Grégoire Ier confia son diocèse à l’évêque Jean de Velletri, auquel il fut alors uni. Les fouilles de Nicoletta Cassieri, de la surintendance archéologique du Latium, là où la via Appia croise la via Ninfina à Cisterna, ont mis au jour un complexe en usage du Ier au IXe siècle apr. J.-C., avec un petit bain, un puits, une grande citerne et des pièces à sol de mosaïque, probablement le relais lui-même."
  nl:
    - "Drie Tavernen (Latijn Tres Tabernae) was een poststation aan de Via Appia, ongeveer 50 km van Rome, waar een weg uit Antium op de hoofdweg uitkwam, bij of nabij de moderne stad Cisterna di Latina. Cicero schreef er in april 59 v.Chr., ten tijde van het feest van Ceres, een brief aan Atticus vandaan, en een andere vanaf het Appiusforum, waarvan hij zegt dat hij die kort na een uit Drie Tavernen verzonden brief schreef."
    - "Toen Paulus de Via Appia opkwam richting Rome, kwamen christenen van de stad hem in twee groepen tegemoet: “de broeders, van onze zaken gehoord hebbende, ons tegemoet tot Appiusmarkt, en de drie tabernen; welke Paulus ziende, dankte hij God en greep moed.” Drie Tavernen was van de twee ontmoetingsplaatsen de dichtstbijzijnde bij Rome."
    - "In de late oudheid werd Tres Tabernae de zetel van een bisschop, met een aan Sint-Paulus gewijde kathedraal; toen moerassen zich over het gebied uitbreidden, verhuisden de bewoners van het nabije Ulubrae waarschijnlijk daarheen. De plaats werd later verlaten, en in 592 vertrouwde paus Gregorius I haar bisdom toe aan bisschop Johannes van Velletri, waarmee het toen werd verenigd. Opgravingen van Nicoletta Cassieri van de archeologische dienst van Lazio, waar de Via Appia de Via Ninfina kruist bij Cisterna, brachten een complex aan het licht dat van de eerste tot de negende eeuw n.Chr. werd gebruikt, met een klein bad, een put, een grote cisterne en kamers met mozaïekvloeren, waarschijnlijk het station zelf."
  cs:
    - "Tři hostince (latinsky Tres Tabernae) byly poštovní stanice na Via Appia, asi 50 km od Říma, kde se k hlavní silnici připojovala cesta z Antia, na místě nebo poblíž dnešního města Cisterna di Latina. Cicero odtud psal Atticovi dopis v dubnu 59 př. n. l., o svátku Cerery, a jiný z Appiova tržiště, o němž říká, že jej napsal o něco později než dopis odeslaný od Tří hostinců."
    - "Když Pavel stoupal po Appiově cestě k Římu, vyšli mu křesťané z města vstříc ve dvou skupinách: „Odkudž, když o nás uslyšeli bratří, vyšli proti nám až na rynk Appiův a ke Třem krčmám. Kteréžto uzřev Pavel, poděkoval Bohu a počal býti dobré mysli.“ Tři hostince byly z obou míst setkání blíže k Římu."
    - "V pozdní antice se Tres Tabernae staly sídlem biskupa s katedrálou zasvěcenou svatému Pavlovi; když se v okolí rozšířily bažiny, přesídlili sem patrně lidé z nedalekého Ulubrae. Místo bylo později opuštěno a roku 592 svěřil papež Řehoř I. jeho diecézi biskupovi Janovi z Velletri, k němuž pak byla připojena. Vykopávky Nicolety Cassieri z archeologické památkové správy Latia, kde Via Appia kříží Via Ninfina u Cisterny, odkryly komplex užívaný od prvního do devátého století n. l. s malou lázní, studní, velkou cisternou a místnostmi s mozaikovými podlahami, pravděpodobně samotnou stanicí."
  pl:
    - "Trzy Gospody (łac. Tres Tabernae) były stacją pocztową na Via Appia, około 50 km od Rzymu, gdzie droga z Antium łączyła się z drogą główną, w dzisiejszym mieście Cisterna di Latina lub w jego pobliżu. Cyceron napisał stamtąd list do Attyka w kwietniu 59 p.n.e., w czasie święta Cerery, oraz kolejny z Forum Appiusza, który, jak mówi, napisał nieco po liście wysłanym z Trzech Gospód."
    - "Gdy Paweł szedł Via Appia ku Rzymowi, chrześcijanie z miasta wyszli mu naprzeciw w dwóch grupach: „gdy usłyszeli bracia o nas, wyszli przeciwko nam aż do rynku Appijuszowego i do Trzech Karczem; których gdy Paweł ujrzał, podziękowawszy Bogu, wziął śmiałość”. Trzy Gospody były bliższym Rzymowi z dwóch miejsc spotkania."
    - "W późnym antyku Tres Tabernae stały się siedzibą biskupa, z katedrą pod wezwaniem św. Pawła; gdy bagna rozlały się na okolicy, mieszkańcy pobliskiego Ulubrae prawdopodobnie przenieśli się tam. Miejsce opustoszało później, a w 592 roku papież Grzegorz I powierzył jego diecezję biskupowi Janowi z Velletri, z którego diecezją została wówczas połączona. Wykopaliska Nicoletty Cassieri z lacjalskiego urzędu archeologicznego, w miejscu, gdzie Via Appia przecina Via Ninfina w Cisterna, odsłoniły kompleks używany od I do IX w. n.e., z małą łaźnią, studnią, dużą cysterną i pomieszczeniami z posadzkami mozaikowymi, prawdopodobnie samą stacją."
  sv:
    - "Tres Tabernae (Tre Tavernor) var en poststation vid Via Appia, omkring 50 km från Rom, där en väg från Antium mötte huvudvägen, vid eller nära nutidens stad Cisterna di Latina. Cicero skrev ett brev till Atticus därifrån i april 59 f.Kr., under Cerealia, och ett annat från Forum Appii, som han säger att han skrev strax efter ett som sändes från Tres Tabernae."
    - "När Paulus kom uppför Via Appia mot Rom gick stadens kristna honom till mötes i två grupper: ”Så snart bröderna där fingo höra om oss, gingo de oss till mötes ända till Forum Appii och Tres Taberne. När Paulus fick se dem, tackade han Gud och fick nytt mod.” Tres Tabernae var den närmare av de två mötesplatserna till Rom."
    - "Under senantiken blev Tres Tabernae biskopssäte, med en katedral helgad åt Sankt Paulus; när träsk bredde ut sig över området flyttade invånarna i närbelägna Ulubrae sannolikt dit. Platsen övergavs senare, och år 592 anförtrodde påve Gregorius I dess stift åt biskop Johannes av Velletri, som det då förenades med. Utgrävningar av Nicoletta Cassieri vid Lazios arkeologiska superintendentämbete, där Via Appia korsar Via Ninfina vid Cisterna, frilade ett komplex som användes från första till nionde århundradet e.Kr., med ett litet bad, en brunn, en stor cistern och rum med mosaikgolv, sannolikt själva stationen."
  nb:
    - "Tres Tabernae (latin, «de tre vertshus») var en poststasjon på Via Appia, omkring 50 km fra Roma, der en vei fra Antium møtte hovedveien, ved eller nær dagens by Cisterna di Latina. Cicero skrev et brev til Atticus herfra i april 59 f.Kr., under Ceres-festen, og et annet fra Forum Appii, som han sier at han skrev litt etter det som ble sendt fra Tres Tabernae."
    - "Da Paulus kom opp Via Appia mot Roma, kom kristne fra byen ham i møte i to grupper: «Og da brødrene der fikk høre om oss, gikk de oss i møte derfra til Forum Appii og Tres Tabernæ; da Paulus så dem, takket han Gud og fattet mot.» Tres Tabernae var det nærmeste av de to møtestedene til Roma."
    - "I sen antikk ble Tres Tabernae sete for en biskop, med en katedral viet til Sankt Paulus; da sumper bredte seg over området, flyttet innbyggerne i nærliggende Ulubrae trolig dit. Stedet ble senere forlatt, og i 592 overlot pave Gregor I bispedømmet til biskop Johannes av Velletri, som det da ble forent med. Utgravninger ledet av Nicoletta Cassieri fra den arkeologiske tilsynsmyndigheten i Lazio, der Via Appia krysser Via Ninfina ved Cisterna, avdekket et kompleks i bruk fra 1. til 9. århundre e.Kr., med et lite bad, en brønn, en stor sisterne og rom med mosaikkgulv, trolig selve stasjonen."
  tl:
    - "Ang Tatlong Bahay-Tuluyan (Latin Tres Tabernae) ay isang himpilan ng koreo sa Via Appia, mga 50 km mula sa Roma, kung saan ang daan mula Antium ay sumasalubong sa pangunahing daan, sa o malapit sa makabagong bayan ng Cisterna di Latina. Sumulat si Cicero ng liham kay Atticus mula roon noong Abril 59 BK, sa kapistahan ni Ceres, at isa pa mula sa Pamilihan ng Appio, na sabi niya ay isinulat niya nang kaunti pagkatapos ng isang ipinadala mula sa Tatlong Bahay-Tuluyan."
    - "Habang umaakyat si Pablo sa Daang Appia patungong Roma, sumalubong sa kaniya ang mga Kristiyano ng lunsod sa dalawang pangkat: “pagkabalita ng mga kapatid, ay sinalubong kami sa Pamilihan ng Appio at sa Tatlong Bahay-Tuluyan; na nang sila'y makita ni Pablo, ay nagpasalamat sa Dios, at lumakas ang loob.” Ang Tatlong Bahay-Tuluyan ang mas malapit sa Roma sa dalawang dakong pagtatagpo."
    - "Sa huling panahon ng antigüedad, ang Tres Tabernae ay naging luklukan ng obispo, na may katedral na nakatalaga kay San Pablo; nang lumaganap ang mga latian sa lugar, marahil lumipat doon ang mga tao ng kalapit na Ulubrae. Pagkaraan ay inabandona ang lugar, at noong 592, ipinagkatiwala ni Papa Gregorio I ang diyosesis nito kay Obispo Juan ng Velletri, na pinagsama rito. Ang mga paghuhukay ni Nicoletta Cassieri ng superintendensiyang arkeolohiko ng Lazio, kung saan tumatawid ang Via Appia sa Via Ninfina sa Cisterna, ay naglantad ng isang kompleks na ginamit mula una hanggang ikasiyam na siglo AD, na may maliit na paliguan, balon, malaking imbakan ng tubig at mga silid na may sahig na mosaiko, marahil ang himpilan mismo."
  da:
    - "Tres Tabernæ (latin Tres Tabernae) var en poststation på Via Appia, omkring 50 km fra Rom, hvor en vej fra Antium mødte hovedvejen, ved eller nær den moderne by Cisterna di Latina. Cicero skrev et brev til Atticus derfra i april 59 f.Kr., ved Ceres' fest, og et andet fra Forum Appii, som han siger, at han skrev kort efter et, der blev sendt fra Tres Tabernæ."
    - "Da Paulus kom op ad Via Appia mod Rom, kom kristne fra byen ham i møde i to grupper: »Brødrene derfra, som havde hørt om os, kom os i Møde til Appius's Forum og Tres-Tabernæ. Og da Paulus saa dem, takkede han Gud og fattede Mod.« Tres Tabernæ var det nærmeste af de to mødesteder ved Rom."
    - "I senantikken blev Tres Tabernae sæde for en biskop med en katedral viet til Sankt Paulus; da moser bredte sig over området, flyttede folket fra nærliggende Ulubrae sandsynligvis dertil. Stedet blev senere forladt, og i 592 betroede pave Gregor 1. dets bispedømme til biskop Johannes af Velletri, som det da blev forenet med. Udgravninger ved Nicoletta Cassieri fra Lazios arkæologiske tilsynsmyndighed, hvor Via Appia krydser Via Ninfina ved Cisterna, blottede et kompleks i brug fra 1. til 9. århundrede e.Kr., med et lille bad, en brønd, en stor cisterne og rum med mosaikgulve, sandsynligvis selve stationen."
  sr:
    - "Три гостионице (латински Трес Табернае) биле су поштанска станица на Апијевом путу, око 50 км од Рима, где се пут из Антијума спајао с главним путем, у савременом граду Чистерна ди Латина или близу њега. Цицерон је оданде писао Атику писмо у априлу 59. п. н. е., на празник Церере, и друго са Апијевог трга, за које каже да га је написао мало после оног послатог из Три гостионице."
    - "Док се Павле Апијевим путем приближавао Риму, хришћани из града изашли су му у сусрет у две групе: „оданде чувши браћа за нас изиђоше нам на сусрет све до Апијева пазара и три крчме. И кад их виде Павле, даде хвалу Богу, и ослободи се.“ Три гостионице биле су ближе од два места састанка Риму."
    - "У касној антици Трес Табернае постале су седиште епископа, са катедралом посвећеном светом Павлу; када су се мочваре прошириле по подручју, становници оближњих Улубра вероватно су се преселили онде. Место је касније напуштено, а 592. папа Григорије I поверио је његову епархију епископу Јовану из Велетрија, са којом је тада била уједињена. Ископавања Николете Касијери из Археолошке управе Лација, где Апијев пут прелази Нинфински пут код Чистерне, открила су комплекс коришћен од 1. до 9. века н. е., с малим купатилом, бунаром, великом цистерном и просторијама с мозаичким подовима, вероватно саму станицу."
  hu:
    - "Három Fogadó (latinul Tres Tabernae) a Via Appia postaállomása volt Rómától mintegy 50 km-re, ahol egy Antiumból érkező út találkozott a főúttal, a mai Cisterna di Latina városánál vagy annak közelében. Cicero Kr. e. 59 áprilisában, Ceres ünnepén levelet írt innen Atticusnak, egy másikat pedig Appius Fórumából, amelyről azt mondja, hogy kevéssel a Három Fogadóból küldött után írta."
    - "Amikor Pál a Via Appián Róma felé haladt, a város keresztényei két csoportban jöttek eléje: „az atyafiak, mikor a mi dolgainkat meghallották, nékünk előnkbe jövének Appii Forumig és Tres Tabernaeig. És mikor Pál meglátta őket, hálákat adván az Istennek, bátorságot vőn.” Három Fogadó a két találkozóhely közül a Rómához közelebbi volt."
    - "A késő ókorban Tres Tabernae püspöki székhely lett, Szent Pál tiszteletére szentelt székesegyházzal; amikor mocsarak terjedtek el a vidéken, a közeli Ulubrae lakói valószínűleg ide költöztek. A helyet később elhagyták, és 592-ben I. Gergely pápa püspökségét Velletri János püspökére bízta, amellyel ezután egyesült. A Lazio régészeti felügyelőségének munkatársa, Nicoletta Cassieri ásatásai, ahol a Via Appia Cisternánál keresztezi a Via Ninfinát, Kr. u. az 1. századtól a 9. századig használt épületegyüttest tártak fel kis fürdővel, kúttal, nagy ciszternával és mozaikpadlós helyiségekkel, valószínűleg magával az állomással."
  fi:
    - "Kolme majataloa (latinaksi Tres Tabernae) oli postiasema Via Appialla noin 50 km Roomasta, missä Antiumista tuleva tie liittyi valtatiehen, nykyisen Cisterna di Latinan kaupungin kohdalla tai lähellä. Cicero kirjoitti Atticukselle kirjeen sieltä huhtikuussa 59 eaa., Cereksen juhlan aikaan, ja toisen Appiuksen torilta; jälkimmäisen hän sanoo kirjoittaneensa vähän sen kirjeen jälkeen, joka lähetettiin Kolmesta majatalosta."
    - "Paavalin tullessa Via Appiaa pitkin kohti Roomaa kaupungin kristityt tulivat häntä vastaan kahdessa ryhmässä: ”Ja kun veljet siellä saivat kuulla meistä, tulivat he meitä vastaan Appii Forumiin ja Tres Tabernaen kohdalle saakka; ja heidät nähdessään Paavali kiitti Jumalaa ja sai rohkeutta.” Kolme majataloa oli kahdesta tapaamispaikasta lähempänä Roomaa."
    - "Myöhäisantiikissa Tres Tabernae tuli piispan istuimeksi, jonka katedraali oli omistettu Pyhälle Paavalille; kun suot levisivät alueelle, läheisen Ulubraen asukkaat muuttivat sinne luultavasti. Paikka autioitui myöhemmin, ja vuonna 592 paavi Gregorius I uskoi sen hiippakunnan Velletrin piispa Johannekselle, johon se silloin yhdistettiin. Lazion arkeologisen valvontaviraston Nicoletta Cassierin kaivauksissa, missä Via Appia ylittää Via Ninfinan Cisternassa, paljastui 1.–9. vuosisadalla jaa. käytetty kompleksi, jossa on pieni kylpylä, kaivo, suuri vesisäiliö ja mosaiikkilattiaiset huoneet, luultavasti itse asema."
  vi:
    - "Ba Quán (tiếng Latinh Tres Tabernae) là một trạm dịch trên Via Appia, cách Rô-ma khoảng 50 km, nơi một con đường từ Antium gặp đại lộ, tại hoặc gần thị trấn Cisterna di Latina ngày nay. Cicero viết một bức thư cho Atticus từ đó vào tháng 4 năm 59 TCN, vào lễ hội Ceres, và một thư khác từ Chợ Áp-bi-út, mà ông nói đã viết ít lâu sau thư gửi từ Ba Quán."
    - "Khi Phao-lô đi lên Đường Appia hướng về Rô-ma, các Cơ Đốc nhân trong thành ra đón ông thành hai nhóm: “Anh em trong thành nầy nghe nói về chúng ta, bèn ra đến Phô-rum Áp-bi-u và chỗ Ba Quán mà đón rước chúng ta. Phao-lô thấy anh em, thì cảm tạ Đức Chúa Trời và vững chí.” Ba Quán là nơi gặp gần Rô-ma hơn trong hai chỗ."
    - "Vào hậu kỳ cổ đại, Tres Tabernae trở thành tòa giám mục, với một nhà thờ chính tòa dâng cho Thánh Phao-lô; khi đầm lầy lan ra vùng này, dân Ulubrae gần đó có lẽ đã dời đến đó. Nơi này về sau bị bỏ hoang, và năm 592 Giáo hoàng Gregory I giao giáo phận của nó cho giám mục Giăng ở Velletri, nơi nó khi ấy được sáp nhập. Các cuộc khai quật của Nicoletta Cassieri thuộc ban khảo cổ vùng Lazio, tại chỗ Via Appia cắt Via Ninfina ở Cisterna, đã phát lộ một quần thể được dùng từ thế kỷ 1 đến thế kỷ 9, với một nhà tắm nhỏ, một giếng, một bể chứa lớn và những phòng lát khảm, có lẽ là chính trạm dịch."
  ro:
    - "Trei Taverne (în latină Tres Tabernae) era o stație de poștă pe Via Appia, la circa 50 km de Roma, unde un drum dinspre Antium se întâlnea cu drumul principal, la sau lângă actualul oraș Cisterna di Latina. Cicero a scris de acolo o scrisoare către Atticus în aprilie 59 î.Hr., la sărbătoarea Cererei, și alta din Târgul lui Apiu, pe care o spune scrisă puțin după una trimisă din Trei Taverne."
    - "Pe când Pavel urca pe Via Appia spre Roma, creștini din oraș au ieșit în întâmpinarea lui în două grupuri: „Și de acolo frații auzind cele pentru noi, au ieșit întru întâmpinarea noastră până la forul lui Apie și la Tritaverne; pre cari văzându’i Pavel, și mulțumind lui Dumnezeu, a luat îndrăsneală.” Trei Taverne era cel mai apropiat de Roma dintre cele două locuri de întâlnire."
    - "În antichitatea târzie, Tres Tabernae a devenit scaun episcopal, cu o catedrală închinată Sfântului Pavel; când mlaștinile s-au întins peste zonă, locuitorii din apropiata Ulubrae s-au mutat probabil acolo. Locul a fost părăsit mai târziu, iar în 592 Papa Grigore I a încredințat dieceza lui episcopului Ioan din Velletri, cu care a fost apoi unită. Săpăturile conduse de Nicoletta Cassieri, de la superintendența arheologică din Lazio, unde Via Appia traversează Via Ninfina la Cisterna, au scos la iveală un complex folosit din secolul I până în secolul al IX-lea d.Hr., cu o mică baie, o fântână, o cisternă mare și încăperi cu pardoseli de mozaic, probabil stația însăși."
  bg:
    - "Трите гостилници (лат. Tres Tabernae) били пощенска станция на Виа Апия, на около 50 км от Рим, където пътят от Анциум се съединявал с главния път, при или близо до днешния град Чистерна ди Латина. Цицерон писал оттам писмо до Атик през април 59 г. пр.н.е., по време на празника на Церера, и друго — от Апиевия пазар, за което казва, че го написал малко след едно, изпратено от Трите гостилници."
    - "Когато Павел се изкачвал по Апиевия път към Рим, християни от града излезли да го посрещнат на две групи: „братята като чуха за нас излезоха до Апиевото Тържище и до Трите Кръчми да ни посрещнат; и Павел като виде тия братя благодари Богу и ободри се.“ Трите гостилници били по-близкото до Рим от двете места на срещата."
    - "В късната античност Трес Таберне станали седалище на епископ, с катедрала, посветена на свети Павел; когато блатата се разпрострели в областта, жителите на близката Улубре вероятно се преселили там. По-късно мястото запустяло и през 592 г. папа Григорий I поверил епархията му на епископ Йоан от Велетри, към чиято епархия тя тогава била присъединена. Разкопки на Николета Касиери от археологическото управление на Лацио, там където Виа Апия пресича Виа Нинфина при Чистерна, разкрили комплекс, използван от I до IX в. н.е., с малка баня, кладенец, голяма цистерна и помещения с мозаечни подове — вероятно самата станция."
