body:
  en:
    - "Gaash is a hill in the hill country of Ephraim known only as a landmark for Joshua's grave. Joshua was buried “in the border of his inheritance in Timnath-serah, which is in mount Ephraim, on the north side of the hill of Gaash”, and the book of Judges repeats the note, calling the town Timnath-heres. The “brooks of Gaash”, the ravines below the hill, were the home of one of David's thirty heroes, Hiddai, whom Chronicles calls Hurai. That is all the Bible says of it; Eusebius adds only that Joshua's monument was still shown near the village of Thamna."
    - "The hill cannot be found without Timnath-serah, and that town is itself debated. Most scholars place it at Khirbet Tibnah, on the western slopes of the Samarian hills about 30 km north-west of Jerusalem, where rock-cut tombs lie beside the ruin, one of which Victor Guérin in the nineteenth century took for Joshua's; Jewish and Samaritan tradition points instead to Kifl Haris near Salfit, further north. If Tibnah is right, Gaash is one of the ridges south of it, and the brooks of Gaash the wadis that drain west from there toward the coastal plain. No excavation has settled the question."
    - "The area today is the Salfit and Ramallah governorates of the West Bank, hill country of olive terraces and deep wadis, with Khirbet Tibnah an unoccupied ruin between the villages of Deir Nidham and Nabi Salih."
  ru:
    - "Гааш — гора в горах Ефремовых, известная лишь как ориентир для могилы Иисуса Навина. Иисуса похоронили «в пределе его удела в Фамнаф-Сараи, что на горе Ефремовой, на север от горы Гааша», и книга Судей повторяет это замечание. «Нахле-Гааш», то есть потоки Гааша, ущелья под горой, были родиной одного из тридцати храбрых Давида — Иддая, которого Паралипоменон зовёт Хураем. Это всё, что говорит о ней Библия; Евсевий добавляет лишь, что памятник Иисуса Навина ещё показывали близ селения Фамна."
    - "Гору нельзя найти без Фамнаф-Сараи, а этот город сам служит предметом спора. Большинство учёных помещает его в Хирбет-Тибна на западных склонах Самарийских гор, примерно в 30 км к северо-западу от Иерусалима, где рядом с руинами лежат высеченные в скале гробницы, одну из которых Виктор Герен в XIX веке принял за гробницу Иисуса Навина; иудейское и самаритянское предание указывает вместо того на Кифль-Харис близ Сальфита, севернее. Если Тибна — верное место, то Гааш — один из хребтов к югу от него, а потоки Гааша — вади, стекающие оттуда на запад к приморской равнине. Раскопки этого вопроса не решили."
    - "Сегодня это мухафазы Сальфит и Рамалла на Западном берегу, горный край оливковых террас и глубоких вади, а Хирбет-Тибна — необитаемые руины между деревнями Дейр-Низам и Наби-Салих."
  uk:
    - "Гааш — пагорб у гірській країні Єфрема, відомий лише як орієнтир для гробу Ісуса Навина. Ісуса Навина було поховано «в займищі наслїдньої держави його в Тамнат-Сараа на Ефраїмовій горі, на північ від Гаас гори», і Книга Суддів повторює нотатку, називаючи місто Тімнат-Хереса. «Потоки Гааша», яри під пагорбом, були домівкою одного з Давидових тридцяти героїв, Іддая, якого Хроніки називають Хураєм: «Іддай з Нахле-Гаашу». Це все, що Біблія каже про нього; Євсевій додає лише, що пам'ятник Ісуса Навина ще показували поблизу села Тамна."
    - "Пагорба не знайти без Тімнат-Сераха, а це місто саме є спірним. Більшість учених розташовує його в Хірбет-Тібні, на західних схилах Самарійських гір приблизно за 30 км на північний захід від Єрусалима, де поряд з руїнами лежать висічені в скелі гробниці, одну з яких Віктор Герен у XIX ст. вважав гробницею Ісуса Навина; юдейська й самаритянська традиція вказує натомість на Кіфль-Харіс поблизу Сальфіта, далі на північ. Якщо Тібна правильна, Гааш — один з хребтів на південь від неї, а потоки Гааша — ваді, що стікають звідти на захід до прибережної рівнини. Жодні розкопки питання не розв’язали."
    - "Область сьогодні — провінції Сальфіт і Рамалла Західного берега, гірська країна оливкових терас і глибоких ваді, з Хірбет-Тібною, незаселеними руїнами між селами Дейр-Нідам і Набі-Саліх."
  es:
    - "Gaas es una colina de la región montañosa de Efraín conocida solo como punto de referencia de la tumba de Josué. Josué fue sepultado «en el término de su posesión en Timnath-sera, que está en el monte de Ephraim, al norte del monte de Gaas», y el libro de Jueces repite la nota, llamando a la ciudad Timnat-heres. El «arroyo de Gaas», las quebradas bajo la colina, era la patria de uno de los treinta héroes de David, Hidai, a quien Crónicas llama Hurai. Eso es todo lo que la Biblia dice de ella; Eusebio añade solo que el monumento de Josué se mostraba todavía cerca de la aldea de Tamna."
    - "La colina no puede hallarse sin Timnat-sera, y esa ciudad es en sí misma objeto de debate. La mayoría de los estudiosos la sitúan en Khirbet Tibnah, en las laderas occidentales de las colinas de Samaria, a unos 30 km al noroeste de Jerusalén, donde tumbas excavadas en la roca se hallan junto a la ruina, una de las cuales Victor Guérin tomó en el siglo XIX por la de Josué; la tradición judía y samaritana señala en cambio Kifl Haris, cerca de Salfit, más al norte. Si Tibnah está en lo cierto, Gaas es una de las lomas al sur de ella, y el arroyo de Gaas los uadis que desaguan hacia el oeste desde allí hacia la llanura costera. Ninguna excavación ha resuelto la cuestión."
    - "La zona es hoy las gobernaciones de Salfit y Ramala, en Cisjordania, región montañosa de terrazas de olivos y hondos uadis, con Khirbet Tibnah como ruina deshabitada entre las aldeas de Deir Nidham y Nabi Salih."
  pt:
    - "Gaás é uma colina nas montanhas de Efraim conhecida apenas como ponto de referência para o túmulo de Josué. Josué foi sepultado “no território da sua herança em Timnate-Sera, que fica na região montanhosa de Efraim, ao norte do monte Gaás”, e o livro de Juízes repete a nota, chamando a cidade Timnate-Heres. Os “ribeiros de Gaás”, as ravinas abaixo da colina, eram a terra de um dos trinta heróis de Davi, Hidai, a quem as Crônicas chamam Hurai. Isso é tudo o que a Bíblia diz dela; Eusébio acrescenta apenas que o monumento de Josué ainda era mostrado perto da aldeia de Thamna."
    - "A colina não pode ser achada sem Timnate-Sera, e essa cidade é ela própria debatida. A maioria dos estudiosos a situa em Khirbet Tibnah, nas encostas ocidentais das colinas de Samaria, cerca de 30 km a noroeste de Jerusalém, onde túmulos escavados na rocha ficam junto à ruína, um dos quais Victor Guérin, no século XIX, tomou pelo de Josué; a tradição judaica e samaritana aponta antes Kifl Haris, perto de Salfit, mais ao norte. Se Tibnah está certa, Gaás é uma das cristas ao sul dela, e os ribeiros de Gaás os uádis que drenam dali para oeste em direção à planície costeira. Nenhuma escavação resolveu a questão."
    - "A área é hoje as províncias de Salfit e Ramallah, na Cisjordânia, região montanhosa de terraços de oliveiras e uádis profundos, com Khirbet Tibnah uma ruína desabitada entre as aldeias de Deir Nidham e Nabi Salih."
  de:
    - "Gaasch ist ein Hügel im Bergland Ephraim, nur als Orientierungspunkt für Josuas Grab bekannt. Josua wurde begraben „in der Grenze seines Erbteils zu Thimnath-Serah, das auf dem Gebirge Ephraim liegt mitternachtwärts vom Berge Gaas“, und das Buch der Richter wiederholt die Notiz und nennt die Stadt Timnat-Heres. Die „Bäche des Gaasch“, die Schluchten unterhalb des Hügels, waren die Heimat eines von Davids dreißig Helden, Hiddai, den die Chronik Hurai nennt. Das ist alles, was die Bibel von ihm sagt; Eusebius fügt nur hinzu, Josuas Denkmal sei noch nahe dem Dorf Thamna gezeigt worden."
    - "Der Hügel ist ohne Timnat-Serach nicht zu finden, und diese Stadt ist selbst umstritten. Die meisten Gelehrten setzen sie bei Khirbet Tibnah an, an den Westhängen der samarischen Berge etwa 30 km nordwestlich von Jerusalem, wo Felsgräber neben der Ruine liegen, von denen Victor Guérin im 19. Jahrhundert eines für das Josuas hielt; die jüdische und samaritanische Überlieferung weist stattdessen auf Kifl Haris bei Salfit, weiter nördlich. Wenn Tibnah richtig ist, ist Gaasch einer der Höhenzüge südlich davon und sind die Bäche des Gaasch die Wadis, die von dort nach Westen zur Küstenebene entwässern. Keine Ausgrabung hat die Frage entschieden."
    - "Das Gebiet sind heute die Gouvernements Salfit und Ramallah im Westjordanland, Bergland mit Oliventerrassen und tiefen Wadis, mit Khirbet Tibnah als unbewohnter Ruine zwischen den Dörfern Deir Nidham und Nabi Salih."
  fr:
    - "Gaasch est une colline des montagnes d’Éphraïm connue seulement comme repère de la tombe de Josué. Josué fut enseveli « dans le territoire qu’il avait eu en partage, à Thimnath-Sérach, dans la montagne d’Éphraïm, au nord de la montagne de Gaasch », et le livre des Juges répète la note en appelant la ville Thimnath-Hérès. L’un des trente vaillants de David, « Hiddaï, de Nachalé-Gaasch », venait des ravins sous la colline ; les Chroniques l’appellent Huraï. C’est tout ce que la Bible en dit ; Eusèbe ajoute seulement que le monument de Josué se montrait encore près du village de Thamna."
    - "La colline ne peut être trouvée sans Thimnath-Sérach, et cette ville est elle-même débattue. La plupart des spécialistes la placent à Khirbet Tibnah, sur les pentes occidentales des collines de Samarie à environ 30 km au nord-ouest de Jérusalem, où des tombes taillées dans le roc jouxtent la ruine, dont l’une fut prise par Victor Guérin, au XIXe siècle, pour celle de Josué ; la tradition juive et samaritaine désigne plutôt Kifl Haris, près de Salfit, plus au nord. Si Tibnah est juste, Gaasch est l’une des crêtes au sud, et les ravins de Gaasch les oueds qui s’en écoulent vers l’ouest en direction de la plaine côtière. Aucune fouille n’a tranché la question."
    - "La région est aujourd’hui celle des gouvernorats de Salfit et de Ramallah, en Cisjordanie, pays de collines à terrasses d’oliviers et d’oueds profonds, avec Khirbet Tibnah, ruine inhabitée entre les villages de Deir Nidham et de Nabi Salih."
  it:
    - "Gaas è una collina nella regione collinare di Efraim nota solo come punto di riferimento per la tomba di Giosuè. Giosuè fu sepolto «nel territorio di sua proprietà a Timnat-Serah, che è nella contrada montuosa di Efraim, al nord della montagna di Gaash», e il libro dei Giudici ripete la nota, chiamando la città Timnat-Cheres. I torrenti di Gaas, i burroni sotto la collina, erano la patria di uno dei trenta prodi di Davide, Iddai, che le Cronache chiamano Curai. È tutto ciò che la Bibbia ne dice; Eusebio aggiunge solo che il monumento di Giosuè si mostrava ancora presso il villaggio di Thamna."
    - "La collina non si può trovare senza Timnat-Serah, e quella città è a sua volta dibattuta. La maggior parte degli studiosi la pone a Khirbet Tibnah, sui pendii occidentali delle alture della Samaria a circa 30 km a nord-ovest di Gerusalemme, dove tombe scavate nella roccia stanno accanto alla rovina, una delle quali Victor Guérin nell’Ottocento ritenne quella di Giosuè; la tradizione ebraica e samaritana indica invece Kifl Haris presso Salfit, più a nord. Se Tibnah è nel giusto, Gaas è una delle dorsali a sud di essa, e i torrenti di Gaas gli uadi che di là drenano a ovest verso la pianura costiera. Nessuno scavo ha risolto la questione."
    - "L’area è oggi quella dei governatorati di Salfit e Ramallah in Cisgiordania, regione collinare di terrazze di ulivi e profondi uadi, con Khirbet Tibnah, rovina disabitata, fra i villaggi di Deir Nidham e Nabi Salih."
  pl:
    - "Gaasz to wzgórze w górskim kraju Efraima, znane tylko jako punkt orientacyjny przy grobie Jozuego. Jozue został pochowany „na granicy dziedzictwa jego w Tamnat Sare, które jest na górze Efraim, ku północy góry Gaas”, a Księga Sędziów powtarza tę notatkę, nazywając miasto Timnat-Heres. Jeden z trzydziestu bohaterów Dawida, Hiddaj, pochodził „od potoku Gaas”, z wąwozów poniżej wzgórza; Księga Kronik nazywa go Churaj. To wszystko, co Biblia o nim mówi; Euzebiusz dodaje tylko, że pomnik Jozuego wciąż pokazywano koło wsi Thamna."
    - "Wzgórza nie można znaleźć bez Timnat-Serach, a to miasto jest samo dyskutowane. Większość uczonych umieszcza je w Chirbet Tibna, na zachodnich stokach wzgórz Samarii około 30 km na północny zachód od Jerozolimy, gdzie obok ruiny leżą grobowce wykute w skale, z których jeden Victor Guérin w XIX w. uznał za grób Jozuego; tradycja żydowska i samarytańska wskazuje natomiast Kifl Haris koło Salfit, dalej na północ. Jeśli rację ma Tibna, Gaasz jest jednym z grzbietów na południe od niej, a potoki Gaasz to wadi odwadniające stamtąd na zachód ku równinie nadmorskiej. Żadne wykopaliska nie rozstrzygnęły tej kwestii."
    - "Okolica to dziś muhafazy Salfit i Ramallah na Zachodnim Brzegu, górski kraj tarasów oliwnych i głębokich wadi, z Chirbet Tibna jako niezamieszkaną ruiną między wsiami Dajr Nidham i Nabi Salih."
  nl:
    - "Gaäs is een heuvel in het bergland van Efraïm die alleen bekend is als oriëntatiepunt bij Jozua's graf. Jozua werd begraven “in de landpale zijns erfdeels, te Timnath-Serah, welke is op een berg van Efraïm, aan het noorden van den berg Gaas”, en het boek Richteren herhaalt de aantekening, de stad Timnat-Heres noemend. De “beken van Gaas”, de ravijnen onder de heuvel, waren de woonplaats van een van Davids dertig helden, Hiddai, die Kronieken Hurai noemt. Dat is alles wat de Bijbel erover zegt; Eusebius voegt er alleen aan toe dat Jozua's gedenkteken nog bij het dorp Thamna werd getoond."
    - "De heuvel is niet te vinden zonder Timnat-Serah, en die stad is zelf omstreden. De meeste geleerden plaatsen haar bij Khirbet Tibnah, op de westelijke hellingen van de heuvels van Samaria zo'n 30 km ten noordwesten van Jeruzalem, waar rotsgraven naast de ruïne liggen, waarvan Victor Guérin er in de negentiende eeuw een voor Jozua's graf hield; de Joodse en Samaritaanse overlevering wijst in plaats daarvan naar Kifl Haris bij Salfit, verder noordelijk. Als Tibnah gelijk heeft, is Gaäs een van de bergruggen ten zuiden ervan, en zijn de beken van Gaas de wadi's die vandaar westwaarts naar de kustvlakte afwateren. Geen opgraving heeft de kwestie beslist."
    - "De streek is nu de gouvernementen Salfit en Ramallah van de Westelijke Jordaanoever, bergland met olijfterrassen en diepe wadi's, met Khirbet Tibnah als onbewoonde ruïne tussen de dorpen Deir Nidham en Nabi Salih."
  cs:
    - "Gaaš je pahorek v efrajimských horách známý jen jako orientační bod pro hrob Jozuův. Jozue byl pohřben, jak se praví, „v krajině dědictví jeho, v Tamnatsáre, kteréž jest na hoře Efraim k straně půlnoční hory Gás“, a Kniha soudců poznámku opakuje, nazývajíc město Timnat-cheres. „Potoky Gaaše“, strže pod pahorkem, byly domovem jednoho z Davidových třiceti hrdinů, „Haddai od potoka Gás“, kterého Letopisy nazývají „Churai od potoku Gás“. To je vše, co Bible o něm říká; Eusebios dodává jen, že Jozuův pomník se ještě ukazoval poblíž vesnice Thamna."
    - "Pahorek nelze najít bez Timnat-serachu a to město je samo sporné. Většina badatelů je klade do Khirbet Tibnah, na západních svazích samařských hor asi 30 km severozápadně od Jeruzaléma, kde skalní hrobky leží vedle zříceniny, z nichž jednu Victor Guérin v 19. století pokládal za Jozuovu; židovská a samaritánská tradice ukazuje místo toho na Kifl Haris u Salfitu, dále na sever. Je-li Tibnah správná, je Gaaš jedním z hřbetů jižně od ní a potoky Gaaše jsou vádí, která odtud odvodňují na západ k pobřežní rovině. Žádné vykopávky otázku nerozhodly."
    - "Oblast je dnes guvernoráty Salfit a Ramalláh na Západním břehu, pahorkatina olivových teras a hlubokých vádí, s Khirbet Tibnah neobydlenou zříceninou mezi vesnicemi Deir Nidham a Nabi Salih."
  sv:
    - "Gaash är en kulle i Efraims bergsbygd som bara är känd som riktmärke för Josuas grav. Josua begrovs ”på hans arvedels område, i Timnat-Sera i Efraims bergsbygd, norr om berget Gaas”, och Domarboken upprepar uppgiften och kallar staden Timnat-Heres. ”Gaas' dalar”, ravinerna nedanför kullen, var hemvist för en av Davids trettio hjältar, Hiddaj, som Krönikeboken kallar Hurai. Det är allt Bibeln säger om den; Eusebios tillägger bara att Josuas minnesmärke ännu visades nära byn Thamna."
    - "Kullen kan inte hittas utan Timnat-Sera, och den staden är i sig omstridd. De flesta forskare placerar den vid Khirbet Tibnah, på västsluttningarna av Samariens berg omkring 30 km nordväst om Jerusalem, där klippgravar ligger bredvid ruinen, av vilka Victor Guérin på 1800-talet tog en för Josuas; judisk och samaritansk tradition pekar i stället på Kifl Haris nära Salfit, längre norrut. Om Tibnah är rätt är Gaash en av åsarna söder om den, och Gaas' dalar de wadier som rinner västerut därifrån mot kustslätten. Ingen utgrävning har avgjort frågan."
    - "Området hör i dag till guvernementen Salfit och Ramallah på Västbanken, en bergsbygd med olivterrasser och djupa wadier, där Khirbet Tibnah är en obebodd ruin mellan byarna Deir Nidham och Nabi Salih."
  nb:
    - "Gaasj er en høyde i Efraims fjellland som bare er kjent som et landemerke for Josvas grav. Josva ble gravlagt «på hans arvelodds grunn i Timnat-Serah, som ligger i Efra'im-fjellene, nordenfor Ga'as-fjellet», og Dommerboken gjentar notisen og kaller byen Timnat-Heres. «Ga'as-dalene», raviner nedenfor høyden, var hjemstedet til Hiddai, en av Davids tretti helter, som Krønikebøkene kaller Hurai. Det er alt Bibelen sier om den; Eusebius tilføyer bare at Josvas minnesmerke ennå ble vist nær landsbyen Thamna."
    - "Høyden kan ikke finnes uten Timnat-Serah, og den byen er selv omdiskutert. De fleste forskere plasserer den ved Khirbet Tibnah, på de vestlige skråningene av Samarias åser omtrent 30 km nordvest for Jerusalem, der uthuggede graver ligger ved siden av ruinen, og en av dem tok Victor Guérin på 1800-tallet for å være Josvas; jødisk og samaritansk tradisjon peker i stedet på Kifl Haris ved Salfit, lenger nord. Hvis Tibnah er riktig, er Gaasj en av ryggene sør for den, og Ga'as-dalene de wadiene som drenerer mot vest herfra mot kystsletten. Ingen utgravning har avgjort spørsmålet."
    - "Området er i dag guvernementene Salfit og Ramallah på Vestbredden, et fjellland med oliventerrasser og dype wadier, der Khirbet Tibnah er en ubebodd ruin mellom landsbyene Deir Nidham og Nabi Salih."
  tl:
    - "Ang Gaas ay isang burol sa lupaing maburol ng Ephraim na kilala lamang bilang palatandaan sa libingan ni Josue. Inilibing si Josue “sa hangganan ng kaniyang mana sa Timnath-sera, na nasa lupaing maburol ng Ephraim sa hilagaan ng bundok ng Gaas”, at inuulit ng aklat ng Mga Hukom ang tala, na tinatawag ang bayang Timnath-heres. Ang “mga batis ng Gaas”, ang mga bangin sa ibaba ng burol, ang tahanan ng isa sa tatlumpung bayani ni David, si Hiddai, na tinatawag ng Mga Cronica na Hurai. Iyan lamang ang sinasabi ng Biblia tungkol dito; idinadagdag lamang ni Eusebio na ang bantayog ni Josue ay ipinakikita pa rin malapit sa nayon ng Thamna."
    - "Hindi matatagpuan ang burol kung wala ang Timnath-sera, at ang bayang iyon mismo ay pinagtatalunan. Karamihan sa mga iskolar ay naglalagay nito sa Khirbet Tibnah, sa kanlurang dalisdis ng mga burol ng Samaria mga 30 km sa hilagang-kanluran ng Jerusalem, kung saan ang mga libingang tinabas sa bato ay nasa tabi ng guho, na isa roon ay inakala ni Victor Guérin noong ika-19 na siglo na kay Josue; ang tradisyong Judio at Samaritano ay tumuturo sa halip sa Kifl Haris malapit sa Salfit, sa mas hilaga. Kung tama ang Tibnah, ang Gaas ay isa sa mga tagaytay sa timog nito, at ang mga batis ng Gaas ang mga wadi na umaagos pakanluran mula roon patungo sa kapatagan sa baybayin. Walang paghuhukay na nakalutas sa tanong."
    - "Ang lugar ay ngayon ang mga gobernadorado ng Salfit at Ramallah sa West Bank, lupaing maburol ng mga taras ng olibo at malalalim na wadi, at ang Khirbet Tibnah ay isang hindi tinitirahang guho sa pagitan ng mga nayon ng Deir Nidham at Nabi Salih."
scripture:
  - Josh.24.30
  - Judg.2.9
  - 2Sam.23.30
