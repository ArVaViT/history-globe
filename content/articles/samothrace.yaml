body:
  en:
    - "Samothrace is a high, rocky island in the north-eastern Aegean, off the coast of Thrace; its mountain rises some 1,600 m from the sea, and in the Iliad Poseidon sits on “the topmost peak of wooded Samothrace” to watch the battle at Troy. The island was known above all for the Sanctuary of the Great Gods, on the slopes beside its ancient city on the north coast, where Greeks and later Romans were initiated into mysteries. Plutarch says that Philip II of Macedon fell in love with Olympias when both were initiated there; Perseus, the last king of Macedon, fled to the sanctuary after his defeat at Pydna in 168 BC and was taken there by the Romans."
    - "On his second journey, after the vision of the man of Macedonia, Paul sailed from Troas: “we came with a straight course to Samothracia, and the next day to Neapolis”, the port of Philippi. The island, with its mountain visible far out to sea, was the night's halt on the way across the northern Aegean. The run took two days; the crossing in the opposite direction, from Philippi to Troas, later took Paul five."
    - "In 1863 the French consul Charles Champoiseau found the marble Winged Victory of Samothrace in the sanctuary; it is now in the Louvre. Austrian excavations under Alexander Conze followed in the 1870s, and since 1938 the Institute of Fine Arts of New York University, first under Karl Lehmann, has excavated the sanctuary. Today Samothrace is a Greek island of the Evros regional unit; the ruins and their museum lie at Palaiopoli on the north coast."
  ru:
    - "Самофракия — высокий скалистый остров на северо-востоке Эгейского моря, у берегов Фракии; его гора поднимается над морем примерно на 1600 м, и в «Илиаде» Посейдон сидит на вершине лесистой Самофракии, глядя на битву под Троей. Остров был знаменит прежде всего святилищем Великих богов на склонах у древнего города на северном берегу, где эллины, а позже римляне посвящались в мистерии. Плутарх пишет, что Филипп II Македонский полюбил Олимпиаду, когда оба проходили там посвящение; Персей, последний царь Македонии, после поражения при Пидне в 168 г. до н. э. бежал в это святилище и был там схвачен римлянами."
    - "Во втором путешествии, после видения мужа-македонянина, Павел отплыл из Троады: «мы прямо прибыли в Самофракию, а на другой день в Неаполь», гавань Филипп. Остров, чья гора видна далеко с моря, был ночной стоянкой на пути через север Эгейского моря. Плавание заняло два дня; обратный путь, из Филипп в Троаду, позднее занял у Павла пять."
    - "В 1863 г. французский консул Шарль Шампуазо нашёл в святилище мраморную Нику Самофракийскую; сейчас она в Лувре. В 1870-х гг. за ним последовали австрийские раскопки Александра Конце, а с 1938 г. святилище раскапывает Институт изящных искусств Нью-Йоркского университета, сначала под руководством Карла Леманна. Сегодня Самофракия — греческий остров в периферийной единице Эврос; руины и музей находятся у Палеополи на северном берегу."
  uk:
    - "Самотракія — високий скелястий острів у північно-східному Егеї, біля узбережжя Фракії; її гора здіймається з моря приблизно на 1600 м, і в «Іліаді» Посейдон сидить на «найвищій вершині лісистої Самотракії», щоб стежити за битвою під Троєю. Острів був відомий передусім Святилищем Великих богів на схилах біля його давнього міста на північному березі, де греки, а згодом римляни посвячувалися в містерії. Плутарх каже, що македонський цар Пилип II закохався в Олімпіаду, коли обоє посвячувалися там; Персей, останній цар Македонії, після поразки під Піднею 168 р. до н. е. втік до святилища, і римляни взяли його звідти."
    - "Під час другої подорожі, після видіння македонця, Павло відплив із Троади: «приспіли ми в Самотракию, другого ж дня в Неаполь», порт Філіппів. Острів, гору якого видно далеко в морі, був нічним пристанищем дорогою через північний Егеїд. Плавання тривало два дні; перехід у зворотному напрямку, з Філіппів до Троади, пізніше забрав у Павла п'ять."
    - "1863 р. французький консул Шарль Шампуазо знайшов у святилищі мармурову Крилату Перемогу Самотракійську; тепер вона в Луврі. У 1870-х рр. послідували австрійські розкопки під керівництвом Александера Конце, а від 1938 р. святилище розкопує Інститут образотворчих мистецтв Нью-Йоркського університету, спершу під керівництвом Карла Леманна. Нині Самотракія — грецький острів регіональної одиниці Еврос; руїни та їхній музей лежать у Палеополі на північному березі."
  es:
    - "Samotracia es una isla alta y rocosa del Egeo nororiental, frente a la costa de Tracia; su montaña se eleva unos 1600 m desde el mar, y en la Ilíada Poseidón se sienta en «la cima más alta de la boscosa Samotracia» para contemplar la batalla de Troya. La isla era conocida sobre todo por el Santuario de los Grandes Dioses, en las laderas junto a su ciudad antigua de la costa norte, donde griegos y más tarde romanos eran iniciados en misterios. Plutarco dice que Filipo II de Macedonia se enamoró de Olimpia cuando ambos fueron iniciados allí; Perseo, el último rey de Macedonia, huyó al santuario tras su derrota en Pidna en 168 a. C. y los romanos lo capturaron allí."
    - "En su segundo viaje, tras la visión del varón macedonio, Pablo zarpó de Troas: «vinimos camino derecho á Samotracia, y el día siguiente á Neápolis», el puerto de Filipos. La isla, con su montaña visible desde muy lejos en el mar, fue la parada de la noche en la travesía del Egeo septentrional. El trayecto duró dos días; la travesía en sentido contrario, de Filipos a Troas, llevó después a Pablo cinco."
    - "En 1863 el cónsul francés Charles Champoiseau halló en el santuario la Victoria alada de Samotracia, de mármol, hoy en el Louvre. Siguieron en la década de 1870 las excavaciones austríacas bajo Alexander Conze, y desde 1938 el Instituto de Bellas Artes de la Universidad de Nueva York, primero bajo Karl Lehmann, excava el santuario. Hoy Samotracia es una isla griega de la unidad regional de Evros; las ruinas y su museo se hallan en Palaiopoli, en la costa norte."
  pt:
    - "Samotrácia é uma ilha alta e rochosa no nordeste do Egeu, ao largo da costa da Trácia; sua montanha se ergue cerca de 1.600 m acima do mar, e na Ilíada Posêidon se senta no “cume mais alto da arborizada Samotrácia” para observar a batalha de Troia. A ilha era conhecida sobretudo pelo Santuário dos Grandes Deuses, nas encostas junto à sua cidade antiga, na costa norte, onde gregos e depois romanos eram iniciados em mistérios. Plutarco diz que Filipe II da Macedônia se apaixonou por Olímpia quando ambos foram iniciados ali; Perseu, o último rei da Macedônia, refugiou-se no santuário depois de sua derrota em Pidna, em 168 a.C., e dali foi levado pelos romanos."
    - "Em sua segunda viagem, depois da visão do homem da Macedônia, Paulo navegou de Trôade: “fizemos uma rota direta para Samotrácia, e no dia seguinte para Neápolis”, o porto de Filipos. A ilha, com sua montanha visível de muito longe no mar, foi a parada da noite na travessia do norte do Egeu. A viagem levou dois dias; a travessia em sentido contrário, de Filipos a Trôade, levou mais tarde cinco a Paulo."
    - "Em 1863 o cônsul francês Charles Champoiseau encontrou no santuário a Vitória Alada de Samotrácia, de mármore, hoje no Louvre. Escavações austríacas sob Alexander Conze se seguiram na década de 1870, e desde 1938 o Instituto de Belas-Artes da Universidade de Nova York, primeiro sob Karl Lehmann, escava o santuário. Hoje Samotrácia é uma ilha grega da unidade regional de Évros; as ruínas e seu museu ficam em Palaiópoli, na costa norte."
  de:
    - "Samothrake ist eine hohe, felsige Insel in der nordöstlichen Ägäis, vor der Küste Thrakiens; ihr Berg erhebt sich etwa 1600 m aus dem Meer, und in der Ilias sitzt Poseidon „auf dem höchsten Gipfel des waldigen Samothrake“ und sieht der Schlacht um Troja zu. Die Insel war vor allem durch das Heiligtum der Großen Götter bekannt, an den Hängen neben ihrer antiken Stadt an der Nordküste, wo Griechen und später Römer in Mysterien eingeweiht wurden. Plutarch sagt, Philipp II. von Makedonien habe sich in Olympias verliebt, als beide dort eingeweiht wurden; Perseus, der letzte König von Makedonien, floh nach seiner Niederlage bei Pydna 168 v. Chr. in das Heiligtum und wurde dort von den Römern ergriffen."
    - "Auf seiner zweiten Reise fuhr Paulus nach der Vision des Mannes aus Mazedonien von Troas ab: „geradewegs kamen wir gen Samothrazien, des andern Tages gen Neapolis“, den Hafen von Philippi. Die Insel, deren Berg weit auf See sichtbar ist, war der Nachtstopp auf dem Weg über die nördliche Ägäis. Die Fahrt dauerte zwei Tage; die Überfahrt in der Gegenrichtung, von Philippi nach Troas, dauerte für Paulus später fünf Tage."
    - "1863 fand der französische Konsul Charles Champoiseau im Heiligtum die marmorne Nike von Samothrake; sie steht heute im Louvre. Österreichische Grabungen unter Alexander Conze folgten in den 1870er Jahren, und seit 1938 gräbt das Institute of Fine Arts der New York University, zuerst unter Karl Lehmann, im Heiligtum. Heute ist Samothrake eine griechische Insel im Regionalbezirk Evros; die Ruinen und ihr Museum liegen bei Palaiopoli an der Nordküste."
  fr:
    - "Samothrace est une île haute et rocheuse du nord-est de l’Égée, au large de la côte de Thrace ; sa montagne s’élève à quelque 1 600 m au-dessus de la mer, et dans l’Iliade Poséidon siège sur « la plus haute cime de la boisée Samothrace » pour observer la bataille de Troie. L’île était surtout connue pour le sanctuaire des Grands Dieux, sur les pentes proches de sa cité antique, sur la côte nord, où Grecs et, plus tard, Romains se faisaient initier à des mystères. Plutarque rapporte que Philippe II de Macédoine tomba amoureux d’Olympias alors que tous deux y étaient initiés ; Persée, dernier roi de Macédoine, se réfugia au sanctuaire après sa défaite de Pydna, en 168 av. J.-C., et c’est là que les Romains s’emparèrent de lui."
    - "Lors de son deuxième voyage, après la vision de l’homme de Macédoine, Paul s’embarqua à Troas : « nous fîmes voile directement vers la Samothrace, et le lendemain nous débarquâmes à Néapolis », le port de Philippes. L’île, dont la montagne se voit de très loin en mer, fut l’étape de la nuit sur la traversée du nord de l’Égée. La traversée dura deux jours ; en sens inverse, de Philippes à Troas, elle prit plus tard cinq jours à Paul."
    - "En 1863, le consul de France Charles Champoiseau découvrit dans le sanctuaire la Victoire de Samothrace, en marbre, aujourd’hui au Louvre. Des fouilles autrichiennes dirigées par Alexander Conze suivirent dans les années 1870, et depuis 1938 l’Institute of Fine Arts de l’université de New York, d’abord sous la direction de Karl Lehmann, fouille le sanctuaire. Aujourd’hui, Samothrace est une île grecque du district régional d’Évros ; les ruines et leur musée se trouvent à Paleópoli, sur la côte nord."
  it:
    - "Samotracia è un’isola alta e rocciosa nell’Egeo nord-orientale, al largo della costa della Tracia; la sua montagna si leva per circa 1600 m dal mare, e nell’Iliade Poseidone siede «sulla più alta vetta della boscosa Samotracia» per osservare la battaglia di Troia. L’isola era nota soprattutto per il Santuario dei Grandi Dèi, sulle pendici accanto alla sua antica città sulla costa settentrionale, dove Greci e poi Romani venivano iniziati ai misteri. Plutarco dice che Filippo II di Macedonia si innamorò di Olimpiade quando entrambi vi furono iniziati; Perseo, l’ultimo re di Macedonia, si rifugiò nel santuario dopo la sconfitta di Pidna nel 168 a.C. e vi fu catturato dai Romani."
    - "Nel secondo viaggio, dopo la visione dell’uomo macedone, Paolo salpò da Troade: «salpando da Troas, tirammo diritto, verso Samotracia, e il giorno seguente verso Neapoli», il porto di Filippi. L’isola, con la sua montagna visibile da lontano in mare, fu la tappa notturna lungo la traversata dell’Egeo settentrionale. Il tragitto richiese due giorni; la traversata in senso opposto, da Filippi a Troade, ne richiese poi a Paolo cinque."
    - "Nel 1863 il console francese Charles Champoiseau trovò nel santuario la Nike di Samotracia in marmo, ora al Louvre. Negli anni Settanta dell’Ottocento seguirono gli scavi austriaci sotto Alexander Conze; dal 1938 il santuario è scavato dall’Institute of Fine Arts della New York University, dapprima sotto Karl Lehmann. Oggi Samotracia è un’isola greca dell’unità regionale dell’Evros; le rovine e il loro museo si trovano a Palaiopoli, sulla costa settentrionale."
  nl:
    - "Samothrake is een hoog, rotsachtig eiland in de noordoostelijke Egeïsche Zee, voor de kust van Thracië; de berg rijst ongeveer 1600 m uit zee, en in de Ilias zit Poseidon op “de hoogste top van het beboste Samothrake” om de strijd bij Troje te bekijken. Het eiland stond vooral bekend om het Heiligdom van de Grote Goden, op de hellingen naast de antieke stad aan de noordkust, waar Grieken en later Romeinen in mysteriën werden ingewijd. Plutarchus zegt dat Filips II van Macedonië verliefd werd op Olympias toen beiden daar werden ingewijd; Perseus, de laatste koning van Macedonië, vluchtte na zijn nederlaag bij Pydna in 168 v.Chr. naar het heiligdom en werd daar door de Romeinen meegenomen."
    - "Op zijn tweede reis voer Paulus, na het visioen van de Macedonische man, van Troas: “liepen wij recht naar Samothrace, en den volgende dag naar Neapolis”, de haven van Filippi. Het eiland, met zijn berg ver over zee zichtbaar, was de nachtelijke halte op de overtocht over de noordelijke Egeïsche Zee. De tocht duurde twee dagen; de overtocht in tegengestelde richting, van Filippi naar Troas, nam Paulus later vijf dagen."
    - "In 1863 vond de Franse consul Charles Champoiseau de marmeren Nike van Samothrake in het heiligdom; zij staat nu in het Louvre. Oostenrijkse opgravingen onder Alexander Conze volgden in de jaren 1870, en sinds 1938 graaft het Institute of Fine Arts van New York University, eerst onder Karl Lehmann, in het heiligdom. Tegenwoordig is Samothrake een Grieks eiland in de regionale eenheid Evros; de ruïnes en hun museum liggen bij Palaiopoli aan de noordkust."
  pl:
    - "Samotraka to wysoka, skalista wyspa w północno-wschodniej części Morza Egejskiego, u wybrzeży Tracji; jej góra wznosi się około 1600 m nad morze, a w Iliadzie Posejdon zasiada na „najwyższym szczycie zalesionej Samotraki”, by patrzeć na bitwę pod Troją. Wyspa słynęła przede wszystkim z Sanktuarium Wielkich Bogów na stokach obok starożytnego miasta na północnym wybrzeżu, gdzie Grecy, a później Rzymianie, byli wtajemniczani w misteria. Plutarch pisze, że Filip II Macedoński zakochał się w Olimpias, gdy oboje byli tam wtajemniczani; Perseusz, ostatni król Macedonii, uciekł do sanktuarium po klęsce pod Pydną w 168 p.n.e. i został stamtąd zabrany przez Rzymian."
    - "W drugiej podróży, po widzeniu męża macedońskiego, Paweł wypłynął z Troady: „prostośmy bieżeli do Samotracyi, a nazajutrz do Neapolu”, portu Filippi. Wyspa, której góra jest widoczna daleko na morzu, była nocnym postojem w drodze przez północne Morze Egejskie. Rejs trwał dwa dni; przeprawa w przeciwnym kierunku, z Filippi do Troady, zajęła później Pawłowi pięć."
    - "W 1863 roku francuski konsul Charles Champoiseau znalazł w sanktuarium marmurową Nike z Samotraki; znajduje się ona dziś w Luwrze. W latach siedemdziesiątych XIX wieku nastąpiły austriackie wykopaliska pod kierunkiem Alexandra Conzego, a od 1938 roku sanktuarium bada Institute of Fine Arts Uniwersytetu Nowojorskiego, najpierw pod kierunkiem Karla Lehmanna. Dziś Samotraka jest grecką wyspą jednostki regionalnej Ewros; ruiny i ich muzeum leżą w Paleopolis na północnym wybrzeżu."
  cs:
    - "Samothráké je vysoký skalnatý ostrov v severovýchodním Egeidu, u pobřeží Thrákie; jeho hora se zvedá z moře asi do 1 600 m a v Iliadě sedí Poseidón na „nejvyšším vrcholu zalesněné Samothráky“, aby sledoval bitvu u Tróje. Ostrov byl znám především Svatyní velkých bohů na svazích vedle starověkého města na severním pobřeží, kde se Řekové a později Římané zasvěcovali do mystérií. Plútarchos říká, že Filip II. Makedonský se zamiloval do Olympiady, když byli oba tamtéž zasvěceni; Perseus, poslední makedonský král, uprchl po své porážce u Pydny roku 168 př. n. l. do svatyně a Římané si ho odtud odvedli."
    - "Na své druhé cestě se Pavel po vidění muže z Makedonie vydal z Troady po moři: „přímým během připlavili jsme se do Samotracie a nazejtří do Neapolis“, přístavu Filip. Ostrov, jehož horu je daleko na moři vidět, byl nocležištěm na cestě přes severní Egeis. Plavba trvala dva dny; přeplutí opačným směrem, z Filip do Troady, trvalo Pavlovi později pět."
    - "V roce 1863 nalezl francouzský konzul Charles Champoiseau ve svatyni mramorovou Níké Samothráckou, která je dnes v Louvru. Rakouské vykopávky pod vedením Alexandra Conzeho následovaly v 70. letech 19. století a od roku 1938 svatyni zkoumá Institute of Fine Arts při New York University, nejprve pod vedením Karla Lehmanna. Dnes je Samothráké řeckým ostrovem regionální jednotky Evros; zříceniny a jejich muzeum leží v Palaiopoli na severním pobřeží."
  sv:
    - "Samothrake är en hög, klippig ö i nordöstra Egeiska havet, utanför Thrakiens kust; dess berg reser sig omkring 1 600 m ur havet, och i Iliaden sitter Poseidon på ”den högsta toppen av skogklädda Samothrake” för att se striden vid Troja. Ön var känd framför allt för De stora gudarnas helgedom, på sluttningarna bredvid dess antika stad på norra kusten, där greker och senare romare invigdes i mysterier. Plutarchos säger att Filip II av Makedonien förälskade sig i Olympias när båda invigdes där; Perseus, Makedoniens siste kung, flydde till helgedomen efter sitt nederlag vid Pydna 168 f.Kr. och togs därifrån av romarna."
    - "På sin andra resa, efter synen av mannen från Makedonien, seglade Paulus från Troas: de ”foro raka vägen till Samotrace och dagen därefter till Neapolis”, Filippis hamn. Ön, med sitt berg synligt långt ut till havs, var nattens uppehåll på färden över norra Egeiska havet. Färden tog två dagar; överfarten i motsatt riktning, från Filippi till Troas, tog senare fem för Paulus."
    - "År 1863 fann den franske konsuln Charles Champoiseau Segergudinnan från Samothrake i marmor i helgedomen; den finns nu i Louvren. Österrikiska utgrävningar under Alexander Conze följde på 1870-talet, och sedan 1938 har Institute of Fine Arts vid New York University, först under Karl Lehmann, grävt ut helgedomen. I dag är Samothrake en grekisk ö i regionala enheten Evros; ruinerna och deras museum ligger vid Palaiopoli på norra kusten."
  nb:
    - "Samotrake er en høy, steinete øy i det nordøstlige Egeerhavet, utenfor kysten av Thrakia; fjellet stiger omkring 1600 m fra havet, og i Iliaden sitter Poseidon på «den øverste toppen av skogkledde Samotrake» for å se slaget ved Troja. Øya var kjent fremfor alt for De store guders helligdom, i skråningene ved siden av den gamle byen på nordkysten, der grekere og senere romere ble innviet i mysterier. Plutark sier at Filip II av Makedonia ble forelsket i Olympias da begge ble innviet der; Perseus, Makedonias siste konge, flyktet til helligdommen etter nederlaget ved Pydna i 168 f.Kr. og ble tatt der av romerne."
    - "På sin andre reise, etter synet av mannen fra Makedonia, seilte Paulus fra Troas: «styrte [vi] rett frem til Samotrake, og den næste dag til Neapolis», havnen for Filippi. Øya, med fjellet synlig langt ute på havet, var nattens stopp på veien over det nordlige Egeerhavet. Turen tok to dager; overfarten i motsatt retning, fra Filippi til Troas, tok senere Paulus fem."
    - "I 1863 fant den franske konsulen Charles Champoiseau marmorstatuen Den bevingede seier fra Samotrake i helligdommen; den står nå i Louvre. Østerrikske utgravninger under Alexander Conze fulgte på 1870-tallet, og siden 1938 har Institute of Fine Arts ved New York University, først under Karl Lehmann, gravd ut helligdommen. I dag er Samotrake en gresk øy i den regionale enheten Evros; ruinene og museet ligger ved Palaiopoli på nordkysten."
  tl:
    - "Ang Samotracia ay isang mataas at mabatong pulo sa hilagang-silangang Egeo, sa labas ng baybayin ng Tracia; ang bundok nito ay umaangat nang mga 1,600 m mula sa dagat, at sa Iliad ay nakaupo si Poseidon sa “pinakamataas na tuktok ng makahoy na Samotracia” upang panoorin ang labanan sa Troya. Kilala ang pulo higit sa lahat para sa Santuwaryo ng mga Dakilang Diyos, sa mga dalisdis sa tabi ng sinaunang lungsod nito sa hilagang baybayin, kung saan ang mga Griyego at kalaunan ang mga Romano ay ipinasok sa mga hiwaga. Sinasabi ni Plutarco na umibig si Felipe II ng Macedonia kay Olympias nang kapwa sila ipinasok doon; si Perseus, ang huling hari ng Macedonia, ay tumakas sa santuwaryo pagkatapos ng kaniyang pagkatalo sa Pydna noong 168 BK at kinuha roon ng mga Romano."
    - "Sa kaniyang ikalawang paglalakbay, pagkatapos ng pangitain ng lalaking taga-Macedonia, naglayag si Pablo mula sa Troas: “Pagtulak nga sa Troas, ay pinunta namin ang Samotracia, at nang kinabukasa'y ang Neapolis”, ang daungan ng Filipos. Ang pulo, na ang bundok ay tanaw mula sa malayo sa dagat, ang tigil sa gabi sa pagtawid sa hilagang Egeo. Dalawang araw ang biyahe; ang pagtawid sa kabilang direksiyon, mula sa Filipos hanggang sa Troas, ay inabot nang limang araw kay Pablo kalaunan."
    - "Noong 1863, natagpuan ng konsul na Pranses na si Charles Champoiseau ang marmol na may-pakpak na Tagumpay (Nike) ng Samotracia sa santuwaryo; nasa Louvre na ito ngayon. Sumunod ang mga paghuhukay ng mga Austriano sa ilalim ni Alexander Conze noong dekada 1870, at mula 1938, hinukay ng Institute of Fine Arts ng New York University, una sa ilalim ni Karl Lehmann, ang santuwaryo. Ang Samotracia ngayon ay pulong Griyego ng yunit-rehiyonal ng Evros; ang mga guho at ang museo nito ay nasa Palaiopoli sa hilagang baybayin."
  da:
    - "Samothrake er en høj, klippefuld ø i det nordøstlige Ægæerhav, ud for Thrakiens kyst; dens bjerg rejser sig omkring 1600 m fra havet, og i Iliaden sidder Poseidon på »den øverste top af det skovklædte Samothrake« for at betragte kampen ved Troja. Øen var kendt frem for alt for De Store Guders Helligdom, på skråningerne ved siden af dens gamle by på nordkysten, hvor grækere og senere romere blev indviet i mysterier. Plutarch siger, at Filip 2. af Makedonien forelskede sig i Olympias, da de begge blev indviet dér; Perseus, Makedoniens sidste konge, flygtede til helligdommen efter sit nederlag ved Pydna i 168 f.Kr. og blev taget dér af romerne."
    - "På sin anden rejse, efter synet af manden fra Makedonien, sejlede Paulus fra Troas: de »styrede lige til Samothrake og den næste Dag til Neapolis«, Filippis havn. Øen, med sit bjerg synligt langt ude på havet, var nattens holdested på vejen over det nordlige Ægæerhav. Turen tog to dage; overfarten i modsat retning, fra Filippi til Troas, tog senere Paulus fem."
    - "I 1863 fandt den franske konsul Charles Champoiseau marmorstatuen Den Bevingede Sejr fra Samothrake i helligdommen; den er nu i Louvre. Østrigske udgravninger under Alexander Conze fulgte i 1870'erne, og siden 1938 har New York Universitys Institute of Fine Arts, først under Karl Lehmann, udgravet helligdommen. I dag er Samothrake en græsk ø i den regionale enhed Evros; ruinerne og deres museum ligger ved Palaiopoli på nordkysten."
  sr:
    - "Самотрака је високо, стеновито острво у североисточном Егеју, поред обале Тракије; њена планина се издиже око 1600 м из мора, а у Илијади Посејдон седи на „највишем врху шумовите Самотраке“ да посматра битку код Троје. Острво је било познато пре свега по Светилишту Великих богова, на падинама поред древног града на северној обали, где су Грци и касније Римљани били посвећивани у мистерије. Плутарх каже да се Филип II Македонски заљубио у Олимпију кад су обоје ту били посвећени; Персеј, последњи македонски краљ, побегао је у светилиште после пораза код Пидне 168. п. н. е. и ту су га Римљани ухватили."
    - "На другом путовању, после виђења човека из Македоније, Павле је пловио из Троаде: „дођосмо у Самотрак, и сутрадан у Неапољ“, лука Филипа. Острво, чија се планина види далеко на мору, било је ноћно уточиште на путу преко северног Егеја. Пловидба је трајала два дана; прелаз у супротном смеру, из Филипа у Троаду, касније је Павлу одузео пет дана."
    - "Француски конзул Шарл Шампоазо је 1863. нашао у светилишту мермерну Крилату победу са Самотраке; она је сада у Лувру. Аустријска ископавања под Александром Концеом уследила су 1870-их, а од 1938. Институт ликовних уметности Универзитета у Њујорку, најпре под Карлом Леманом, ископава светилиште. Данас је Самотрака грчко острво регионалне јединице Еврос; рушевине и њихов музеј леже у Палеопољу на северној обали."
