# Overview article (ADR 0007). Mainstream facts only; Bronze Age dates are approximate.
# The identification is disputed: et-Tell (most scholars) or Khirbet el-Maqatir (B. Wood).
id: ai
place: a7e13e1
title:
  en: "Ai"
  ru: "Гай"
  uk: "Гай"
  es: "Hai"
  pt: "Ai"
  de: "Ai"
  fr: "Aï"
body:
  en:
    - "Ai is usually identified with et-Tell, a large mound beside the village of Deir Dibwan, about 3 km east of Beitin, ancient Bethel, on a plateau overlooking the Jordan Valley. Both the Hebrew name, ha-Ai, and the Arabic et-Tell mean a heap of ruins. Excavations by Judith Marquet-Krause in 1933–1935 and by Joseph Callaway from 1964 uncovered a walled city of the Early Bronze Age, built about 3100 BC, with a temple-palace on its acropolis. It was destroyed more than once and finally about 2400 BC."
    - 'The mound then lay empty for more than a thousand years. About 1200 BC a small unwalled village of farmers and herders, with cisterns cut in the rock, was built on part of it; it was abandoned about 1050 BC without destruction. In Genesis Abram pitches his tent between Bethel and Ai and builds an altar there. In the Book of Joshua Israel''s first attack on Ai fails because Achan has taken from the spoil of Jericho; then an ambush laid between Bethel and Ai takes the city, and Joshua "burnt Ai, and made it an heap for ever".'
    - "As et-Tell had no town in the Late Bronze Age, how the story relates to the site is disputed. Many scholars read it as an explanation of an ancient ruin; W. F. Albright suggested that a memory of the capture of nearby Bethel was transferred to Ai; others look for Joshua's Ai elsewhere. In 1995–2000 and 2009–2016 the Associates for Biblical Research dug at Khirbet el-Maqatir, about 1 km west of et-Tell, where Bryant Wood identifies a small fortress burned in the fifteenth century BC as Ai. Most scholars still place Ai at et-Tell."
    - "Men of Bethel and Ai are listed among the exiles who returned from Babylon. Josephus calls Ai a city above Jericho. In the early fourth century Eusebius placed Ai near Bethel and wrote that it was then deserted. At Khirbet el-Maqatir a church was built in the fourth century, enlarged into a basilica with three apses about 400 and joined by a monastery in the later fifth century."
  ru:
    - "Гай обычно отождествляют с эт-Теллем — большим холмом у деревни Дейр-Дибван, примерно в 3 км к востоку от Бейтина, древнего Вефиля, на плато над Иорданской долиной. И еврейское имя ха-Ай, и арабское эт-Телль значат «груда развалин». Раскопки Жюдит Марке-Краузе в 1933–1935 гг. и Джозефа Каллауэя с 1964 г. открыли обнесённый стеной город раннего бронзового века, построенный около 3100 г. до н. э., с храмом-дворцом на акрополе. Он не раз разрушался и окончательно погиб около 2400 г. до н. э."
    - "Затем холм больше тысячи лет пустовал. Около 1200 г. до н. э. на части его выросло небольшое неукреплённое селение земледельцев и пастухов с высеченными в скале водоёмами; около 1050 г. до н. э. его оставили без разрушения. В книге Бытия Аврам ставит шатёр между Вефилем и Гаем и строит там жертвенник. В книге Иисуса Навина первый приступ Израиля к Гаю не удаётся, потому что Ахан взял из заклятой добычи Иерихона; затем засада между Вефилем и Гаем берёт город, и Иисус сжёг Гай и «обратил его в вечные развалины»."
    - "Поскольку в позднем бронзовом веке города на эт-Телле не было, связь рассказа с этим местом спорна. Многие учёные видят в нём объяснение древних развалин; Уильям Олбрайт предполагал, что память о взятии соседнего Вефиля перенесли на Гай; другие ищут Гай Иисуса Навина в ином месте. В 1995–2000 и 2009–2016 гг. Ассоциация библейских исследований вела раскопки на Хирбет эль-Макатире, примерно в 1 км к западу от эт-Телля, где Брайант Вуд считает Гаем небольшую крепость, сгоревшую в XV веке до н. э. Большинство учёных по-прежнему помещают Гай на эт-Телле."
    - "Жители Вефиля и Гая названы среди вернувшихся из вавилонского плена. Иосиф Флавий называет Гай городом выше Иерихона. В начале IV века Евсевий помещал Гай близ Вефиля и писал, что он тогда был пуст. На Хирбет эль-Макатире в IV веке построили церковь, которую около 400 г. расширили в трёхапсидную базилику, а во второй половине V века к ней пристроили монастырь."
  uk:
    - "Гай зазвичай ототожнюють з ет-Теллем, великим пагорбом біля села Дейр-Дібван, приблизно за 3 км на схід від Бейтіна, давнього Бет-Елу, на плато над Йорданською долиною. І єврейська назва, га-Гай, і арабська ет-Телль означають купу руїн. Розкопки Юдіт Марке-Краузе в 1933–1935 рр. і Джозефа Каллавея від 1964 року виявили муроване місто ранньої бронзової доби, збудоване близько 3100 р. до н. е., з храмом-палацом на акрополі. Його не раз руйнували, а остаточно знищили близько 2400 р. до н. е."
    - "Відтоді пагорб лежав порожній понад тисячу років. Близько 1200 р. до н. е. на його частині збудували невелике немуроване селище землеробів і скотарів з вирубаними в скелі цистернами; його покинули близько 1050 р. до н. е. без руйнування. У книзі Буття Аврам розбиває намет між Бет-Елом і Гаєм і будує там жертовник. У книзі Ісуса Навина перший напад Ізраїлю на Гай зазнає невдачі, бо Ахан узяв із здобичі Єрихону; потім засідка між Бет-Елом і Гаєм здобуває місто, і Ісус Навин «пустив Гай на пожежу і зробив з нього могилу на вічні часи, пустку по сей день»."
    - "Оскільки на ет-Теллі не було міста в пізню бронзову добу, питання, як розповідь співвідноситься з цим місцем, спірне. Багато вчених читають її як пояснення давньої руїни; В. Ф. Олбрайт припустив, що пам'ять про здобуття сусіднього Бет-Елу перенесли на Гай; інші шукають Гай Ісуса Навина деінде. У 1995–2000 і 2009–2016 рр. «Асоціація біблійних досліджень» вела розкопки в Хірбет-ель-Мактирі, приблизно за 1 км на захід від ет-Телля, де Браєнт Вуд ототожнює з Гаєм невелику фортецю, спалену в XV столітті до н. е. Більшість учених і досі розміщують Гай на ет-Теллі."
    - "Мужів Бет-Елу і Гаю названо серед вигнанців, що повернулися з Вавилона. Йосиф Флавій називає Гай містом над Єрихоном. На початку IV століття Євсевій розмістив Гай поблизу Бет-Елу й написав, що тоді він був безлюдний. У Хірбет-ель-Мактирі в IV столітті збудували церкву, близько 400 року розширили її до базиліки з трьома апсидами, а в пізнішому V столітті до неї додали монастир."
  es:
    - "Hai se identifica por lo común con et-Tell, un gran montículo junto a la aldea de Deir Dibwan, a unos 3 km al este de Beitin, la antigua Betel, en una meseta que domina el valle del Jordán. Tanto el nombre hebreo, ha-Ai, como el árabe et-Tell significan un montón de ruinas. Las excavaciones de Judith Marquet-Krause en 1933–1935 y de Joseph Callaway desde 1964 sacaron a la luz una ciudad amurallada de la Edad del Bronce Antiguo, construida hacia 3100 a. C., con un templo-palacio en su acrópolis. Fue destruida más de una vez y finalmente hacia 2400 a. C."
    - "El montículo quedó entonces vacío durante más de mil años. Hacia 1200 a. C. se construyó sobre una parte una pequeña aldea sin muralla de agricultores y pastores, con cisternas excavadas en la roca; fue abandonada hacia 1050 a. C. sin destrucción. En el Génesis, Abram planta su tienda entre Betel y Hai y levanta allí un altar. En el libro de Josué, el primer ataque de Israel contra Hai fracasa porque Acán ha tomado del botín de Jericó; luego una emboscada tendida entre Betel y Hai toma la ciudad, y Josué «quemó á Hai y redújola á un montón perpetuo»."
    - "Como et-Tell no tenía ciudad en la Edad del Bronce Final, se discute cómo se relaciona el relato con el sitio. Muchos estudiosos lo leen como una explicación de una antigua ruina; W. F. Albright sugirió que el recuerdo de la captura de la cercana Betel se trasladó a Hai; otros buscan la Hai de Josué en otro lugar. En 1995–2000 y 2009–2016 los Associates for Biblical Research excavaron en Khirbet el-Maqatir, a cerca de 1 km al oeste de et-Tell, donde Bryant Wood identifica con Hai una pequeña fortaleza incendiada en el siglo XV a. C. La mayoría de los estudiosos sigue situando Hai en et-Tell."
    - "Hombres de Betel y de Hai figuran entre los exiliados que regresaron de Babilonia. Josefo llama a Hai una ciudad situada sobre Jericó. A principios del siglo IV, Eusebio situó Hai cerca de Betel y escribió que entonces estaba desierta. En Khirbet el-Maqatir se construyó una iglesia en el siglo IV, ampliada hasta formar una basílica con tres ábsides hacia 400 y unida a un monasterio a finales del siglo V."
  pt:
    - "Ai é geralmente identificada com et-Tell, um grande montículo ao lado da aldeia de Deir Dibwan, cerca de 3 km a leste de Beitin, a antiga Betel, num planalto que domina o vale do Jordão. Tanto o nome hebraico, ha-Ai, quanto o árabe et-Tell significam um monte de ruínas. Escavações de Judith Marquet-Krause em 1933–1935 e de Joseph Callaway a partir de 1964 trouxeram à luz uma cidade murada da Idade do Bronze Antigo, construída por volta de 3100 a.C., com um templo-palácio na acrópole. Foi destruída mais de uma vez e por fim por volta de 2400 a.C."
    - "O montículo ficou então vazio por mais de mil anos. Por volta de 1200 a.C., uma pequena aldeia sem muralhas, de lavradores e pastores, com cisternas escavadas na rocha, foi construída sobre parte dele; foi abandonada por volta de 1050 a.C. sem destruição. Em Gênesis, Abrão arma a sua tenda entre Betel e Ai e ali edifica um altar. No livro de Josué, o primeiro ataque de Israel a Ai fracassa porque Acã tomou do despojo de Jericó; depois uma emboscada armada entre Betel e Ai toma a cidade, e Josué “incendiou Ai e fez dela um monte de ruínas para sempre”."
    - "Como et-Tell não teve cidade no Bronze Final, discute-se como a narrativa se relaciona com o sítio. Muitos estudiosos a leem como explicação de uma ruína antiga; W. F. Albright sugeriu que a lembrança da conquista da vizinha Betel foi transferida para Ai; outros procuram a Ai de Josué em outro lugar. Em 1995–2000 e 2009–2016, a Associates for Biblical Research escavou em Khirbet el-Maqatir, cerca de 1 km a oeste de et-Tell, onde Bryant Wood identifica como Ai uma pequena fortaleza incendiada no século XV a.C. A maioria dos estudiosos ainda situa Ai em et-Tell."
    - "Homens de Betel e de Ai figuram entre os exilados que voltaram da Babilônia. Josefo chama Ai de cidade acima de Jericó. No início do século IV, Eusébio a situou perto de Betel e escreveu que então estava deserta. Em Khirbet el-Maqatir foi construída uma igreja no século IV, ampliada numa basílica de três absides por volta de 400 e unida a um mosteiro no fim do século V."
  de:
    - "Ai wird gewöhnlich mit et-Tell gleichgesetzt, einem großen Hügel neben dem Dorf Deir Dibwan, etwa 3 km östlich von Beitin, dem antiken Bethel, auf einem Plateau über dem Jordantal. Sowohl der hebräische Name, ha-Ai, als auch das arabische et-Tell bedeuten Trümmerhaufen. Ausgrabungen von Judith Marquet-Krause 1933–1935 und von Joseph Callaway ab 1964 legten eine ummauerte Stadt der Frühbronzezeit frei, um 3100 v. Chr. erbaut, mit einem Tempelpalast auf ihrer Akropolis. Sie wurde mehr als einmal zerstört und endgültig um 2400 v. Chr."
    - "Danach lag der Hügel mehr als tausend Jahre leer. Um 1200 v. Chr. entstand auf einem Teil von ihm ein kleines unbefestigtes Dorf von Bauern und Hirten mit in den Fels geschlagenen Zisternen; es wurde um 1050 v. Chr. ohne Zerstörung aufgegeben. Im ersten Buch Mose schlägt Abram sein Zelt zwischen Bethel und Ai auf und baut dort einen Altar. Im Buch Josua scheitert Israels erster Angriff auf Ai, weil Achan von der Beute Jerichos genommen hat; dann nimmt ein Hinterhalt zwischen Bethel und Ai die Stadt ein, und Josua „brannte Ai aus und machte einen Haufen daraus ewiglich“."
    - "Da et-Tell in der Spätbronzezeit keine Stadt trug, ist umstritten, wie sich die Erzählung zu dem Ort verhält. Viele Gelehrte lesen sie als Erklärung einer alten Ruine; W. F. Albright vermutete, die Erinnerung an die Eroberung des nahen Bethel sei auf Ai übertragen worden; andere suchen Josuas Ai anderswo. In den Jahren 1995–2000 und 2009–2016 grub die Associates for Biblical Research in Chirbet el-Maqatir, etwa 1 km westlich von et-Tell, wo Bryant Wood eine kleine, im 15. Jahrhundert v. Chr. verbrannte Festung für Ai hält. Die meisten Gelehrten setzen Ai weiterhin bei et-Tell an."
    - "Männer von Bethel und Ai werden unter den aus Babylon zurückgekehrten Verbannten aufgeführt. Josephus nennt Ai eine Stadt oberhalb von Jericho. Im frühen 4. Jahrhundert setzte Eusebius Ai in die Nähe von Bethel und schrieb, es sei damals verödet. In Chirbet el-Maqatir wurde im 4. Jahrhundert eine Kirche gebaut, um 400 zu einer Basilika mit drei Apsiden erweitert und im späteren 5. Jahrhundert durch ein Kloster ergänzt."
  fr:
    - "Aï est d’ordinaire identifiée à et-Tell, grand tertre près du village de Deir Dibwan, à environ 3 km à l’est de Beitin, l’ancienne Béthel, sur un plateau dominant la vallée du Jourdain. Le nom hébreu, ha-Aï, comme l’arabe et-Tell, signifie un tas de ruines. Les fouilles de Judith Marquet-Krause en 1933-1935 et de Joseph Callaway à partir de 1964 ont mis au jour une ville fortifiée du Bronze ancien, bâtie vers 3100 av. J.-C., avec un temple-palais sur son acropole. Elle fut détruite plus d’une fois et définitivement vers 2400 av. J.-C."
    - "Le tertre resta ensuite vide pendant plus de mille ans. Vers 1200 av. J.-C., un petit village non fortifié d’agriculteurs et d’éleveurs, avec des citernes taillées dans le roc, fut bâti sur une partie du site ; il fut abandonné vers 1050 av. J.-C. sans destruction. Dans la Genèse, Abram dresse sa tente entre Béthel et Aï et y bâtit un autel. Dans le livre de Josué, la première attaque d’Israël contre Aï échoue parce qu’Acan a pris du butin de Jéricho ; puis une embuscade tendue entre Béthel et Aï prend la ville, et Josué « brûla Aï, et en fit à jamais un monceau de ruines »."
    - "Comme et-Tell n’avait pas de ville au Bronze récent, le rapport du récit avec le site est discuté. Beaucoup y lisent l’explication d’une ancienne ruine ; W. F. Albright a suggéré que le souvenir de la prise de Béthel, toute proche, avait été reporté sur Aï ; d’autres cherchent ailleurs l’Aï de Josué. En 1995-2000 et 2009-2016, les Associates for Biblical Research ont fouillé Khirbet el-Maqatir, à environ 1 km à l’ouest d’et-Tell, où Bryant Wood identifie comme Aï une petite forteresse incendiée au XVe siècle av. J.-C. La plupart des savants placent toujours Aï à et-Tell."
    - "Des hommes de Béthel et d’Aï figurent parmi les exilés revenus de Babylone. Josèphe appelle Aï une ville au-dessus de Jéricho. Au début du IVe siècle, Eusèbe la plaçait près de Béthel et écrivait qu’elle était alors déserte. À Khirbet el-Maqatir, une église fut bâtie au IVe siècle, agrandie vers 400 en une basilique à trois absides, et jointe à un monastère à la fin du Ve siècle."
