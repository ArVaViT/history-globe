# Overview article (ADR 0007). Mainstream facts only; Mesopotamian dates follow the middle chronology.
id: babylon
place: a217d18
title:
  en: "Babylon"
  ru: "Вавилон"
  uk: "Вавилон"
  es: "Babilonia"
  pt: "Babilônia"
  de: "Babylon"
  fr: "Babylone"
  it: "Babilonia"
  pl: "Babilon"
  nl: "Babylon"
  cs: "Babylón"
body:
  en:
    - "Babylon lay on the Euphrates in southern Mesopotamia, about 85 km south of modern Baghdad, beside today's Hillah. It first appears as a small town on a tablet of the Akkadian king Shar-kali-sharri in the twenty-third century BC. Its rise came with the First Dynasty of Babylon: Hammurabi (1792–1750 BC in the middle chronology) united southern Mesopotamia and made the city its capital. In 1595 BC the Hittite king Mursili I sacked it, and Kassite kings then ruled Babylonia for about four centuries."
    - "In Genesis, Babel is among the first cities of Nimrod's kingdom and the place of the tower whose builders were scattered. Under Assyrian rule Babylon often rebelled; its king Merodach-baladan sent envoys to Hezekiah, and in 689 BC Sennacherib destroyed the city. Nabopolassar, who became king there in 626 BC, founded the Neo-Babylonian kingdom, and his son Nebuchadnezzar (605–562 BC) rebuilt Babylon with double walls, palaces, the Ishtar Gate and the ziggurat Etemenanki. Exiles from Judah were brought here in 597 and in 587 or 586 BC; tablets from the royal palace list rations for Jehoiachin, king of Judah, whom the Bible also places at the Babylonian court."
    - "In 539 BC Cyrus of Persia took Babylon, as the Nabonidus Chronicle and the Cyrus Cylinder record, and the Book of Ezra opens with his decree letting the exiles return. The Book of Daniel sets the feast of Belshazzar in the city. Babylon remained a royal residence of the Persian kings. Alexander the Great entered it in 331 BC and died in Nebuchadnezzar's palace in 323 BC."
    - "After Seleucus founded Seleucia on the Tigris about 305 BC, people and trade drained away from Babylon, though its temple scholars went on writing astronomical texts in cuneiform into the first century AD. When Trajan came in AD 116, he found mostly mounds and ruins. In Revelation, Babylon became the name of the proud world power that falls. By late antiquity the once great city was a minor place."
  ru:
    - "Вавилон стоял на Евфрате в южной Месопотамии, примерно в 85 км к югу от нынешнего Багдада, рядом с современной Хиллой. Впервые он упоминается как небольшой город на табличке аккадского царя Шар-кали-шарри в XXIII веке до н. э. Возвышение пришло с I Вавилонской династией: Хаммурапи (1792–1750 гг. до н. э. по средней хронологии) объединил юг Месопотамии и сделал город своей столицей. В 1595 г. до н. э. его разграбил хеттский царь Мурсили I, а затем около четырёх веков Вавилонией правили касситские цари."
    - "В книге Бытия Вавилон — один из первых городов царства Нимрода и место башни, строители которой были рассеяны. Под властью Ассирии Вавилон не раз восставал; его царь Беродах Баладан отправил послов к Езекии, а в 689 г. до н. э. Сеннахирим разрушил город. Набопаласар, воцарившийся здесь в 626 г. до н. э., основал Нововавилонское царство, а его сын Навуходоносор (605–562 гг. до н. э.) отстроил Вавилон заново: двойные стены, дворцы, ворота Иштар и зиккурат Этеменанки. Изгнанников из Иудеи привели сюда в 597 и в 587 или 586 г. до н. э.; таблички из царского дворца перечисляют пайки Иехонии, царя Иудейского, которого и Библия помещает при вавилонском дворе."
    - "В 539 г. до н. э. Вавилон взял персидский царь Кир, о чём сообщают Хроника Набонида и Цилиндр Кира, а книга Ездры начинается с его указа, позволившего изгнанникам вернуться. Книга Даниила помещает в этот город пир Валтасара. Вавилон оставался одной из резиденций персидских царей. Александр Македонский вступил в него в 331 г. до н. э. и умер во дворце Навуходоносора в 323 г. до н. э."
    - "После того как Селевк около 305 г. до н. э. основал Селевкию на Тигре, люди и торговля стали уходить из Вавилона, хотя храмовые учёные продолжали писать клинописью астрономические тексты до I века н. э. Траян, придя сюда в 116 г. н. э., застал в основном холмы и развалины. В Откровении Вавилон стал именем гордой мировой державы, которая падает. К поздней античности некогда великий город превратился в малозначимое место."
  uk:
    - "Вавилон лежав на Євфраті в південній Месопотамії, приблизно за 85 км на південь від сучасного Багдада, біля нинішньої Хілли. Вперше він з'являється як невелике місто на табличці аккадського царя Шар-калі-шаррі у XXIII столітті до н. е. Його піднесення прийшло з Першою династією Вавилона: Хаммурапі (1792–1750 рр. до н. е. за середньою хронологією) об'єднав південну Месопотамію і зробив місто столицею. У 1595 р. до н. е. хетський цар Мурсілі I пограбував його, а каситські царі потім правили Вавилонією близько чотирьох століть."
    - "У книзі Буття Бабель — одне з перших міст царства Німрода і місце вежі, чиїх будівничих розсіяли. Під ассирійською владою Вавилон часто бунтував; його цар Меродах-Баладан посилав послів до Єзекії, а в 689 р. до н. е. Сінаххеріб зруйнував місто. Набополасар, що став там царем у 626 р. до н. е., заснував Нововавилонське царство, а його син Навуходоносор (605–562 рр. до н. е.) відбудував Вавилон з подвійними мурами, палацами, брамою Іштар і зікуратом Етеменанкі. Вигнанців з Юди привели сюди в 597 і в 587 або 586 р. до н. е.; таблички з царського палацу перелічують пайки Єхонії, царя Юди, якого Біблія також поміщає при вавилонському дворі."
    - "У 539 р. до н. е. Кір Перський узяв Вавилон, як записують Хроніка Набоніда та циліндр Кіра, і книга Ездри починається з його наказу, що дозволяє вигнанцям повернутися. Книга Даниїла розміщує бенкет Валтасара в місті. Вавилон лишався царською резиденцією перських царів. Александр Великий увійшов до нього в 331 р. до н. е. і помер у палаці Навуходоносора в 323 р. до н. е."
    - "Після того як Селевк заснував Селевкію на Тигрі близько 305 р. до н. е., люди й торгівля потекли з Вавилона, хоча його храмові вчені й далі писали клинописом астрономічні тексти до І століття н. е. Коли Траян прийшов у 116 р. н. е., він побачив здебільшого пагорби й руїни. В Об'явленні Вавилон став ім'ям гордої світової сили, що падає. До пізньої давнини колись велике місто було незначним місцем."
  es:
    - "Babilonia se alzaba sobre el Éufrates, en el sur de Mesopotamia, a unos 85 km al sur de la actual Bagdad, junto a la actual Hilla. Aparece por primera vez como una pequeña ciudad en una tablilla del rey acadio Shar-kali-sharri en el siglo XXIII a. C. Su ascenso llegó con la Primera Dinastía de Babilonia: Hammurabi (1792–1750 a. C. en la cronología media) unió el sur de Mesopotamia e hizo de la ciudad su capital. En 1595 a. C. el rey hitita Mursili I la saqueó, y reyes casitas gobernaron entonces Babilonia durante unos cuatro siglos."
    - "En el Génesis, Babel está entre las primeras ciudades del reino de Nimrod y es el lugar de la torre cuyos constructores fueron esparcidos. Bajo el dominio asirio Babilonia se rebeló a menudo; su rey Merodac-baladán envió enviados a Ezequías, y en 689 a. C. Senaquerib destruyó la ciudad. Nabopolasar, que se hizo rey allí en 626 a. C., fundó el reino neobabilónico, y su hijo Nabucodonosor (605–562 a. C.) reconstruyó Babilonia con dobles murallas, palacios, la Puerta de Ishtar y el zigurat Etemenanki. Exiliados de Judá fueron traídos aquí en 597 y en 587 o 586 a. C.; tablillas del palacio real enumeran raciones para Joaquín, rey de Judá, a quien la Biblia sitúa también en la corte babilonia."
    - "En 539 a. C. Ciro de Persia tomó Babilonia, como registran la Crónica de Nabónido y el Cilindro de Ciro, y el libro de Esdras se abre con su decreto que permite el regreso de los exiliados. El libro de Daniel sitúa en la ciudad el banquete de Belsasar. Babilonia siguió siendo residencia real de los reyes persas. Alejandro Magno entró en ella en 331 a. C. y murió en el palacio de Nabucodonosor en 323 a. C."
    - "Después de que Seleuco fundara Seleucia del Tigris hacia 305 a. C., la gente y el comercio se alejaron de Babilonia, aunque sus eruditos del templo siguieron escribiendo textos astronómicos en cuneiforme hasta el siglo I d. C. Cuando Trajano llegó en 116 d. C., halló sobre todo montículos y ruinas. En el Apocalipsis, Babilonia se convirtió en el nombre del soberbio poder mundial que cae. En la Antigüedad tardía la antigua gran ciudad era un lugar menor."
  pt:
    - "Babilônia ficava no Eufrates, no sul da Mesopotâmia, cerca de 85 km ao sul da atual Bagdá, junto à atual Hillah. Aparece primeiro como uma pequena cidade numa tabuinha do rei acádio Shar-kali-sharri, no século XXIII a.C. Sua ascensão veio com a Primeira Dinastia da Babilônia: Hamurábi (1792–1750 a.C. na cronologia média) uniu o sul da Mesopotâmia e fez da cidade a sua capital. Em 1595 a.C. o rei hitita Mursili I a saqueou, e reis cassitas governaram então a Babilônia por cerca de quatro séculos."
    - "Em Gênesis, Babel está entre as primeiras cidades do reino de Ninrode e é o lugar da torre cujos construtores foram dispersos. Sob domínio assírio, a Babilônia se rebelou muitas vezes; seu rei Merodaque-Baladã enviou emissários a Ezequias, e em 689 a.C. Senaqueribe destruiu a cidade. Nabopolassar, que se tornou rei ali em 626 a.C., fundou o reino neobabilônico, e seu filho Nabucodonosor (605–562 a.C.) reconstruiu Babilônia com muralhas duplas, palácios, o Portão de Ishtar e o zigurate Etemenanki. Exilados de Judá foram trazidos para cá em 597 e em 587 ou 586 a.C.; tabuinhas do palácio real listam rações para Joaquim, rei de Judá, a quem a Bíblia também situa na corte babilônica."
    - "Em 539 a.C. Ciro da Pérsia tomou Babilônia, como registram a Crônica de Nabonido e o Cilindro de Ciro, e o livro de Esdras abre com seu decreto permitindo o retorno dos exilados. O livro de Daniel situa na cidade o banquete de Belsazar. Babilônia continuou sendo residência real dos reis persas. Alexandre Magno entrou nela em 331 a.C. e morreu no palácio de Nabucodonosor em 323 a.C."
    - "Depois que Seleuco fundou Selêucia no Tigre por volta de 305 a.C., gente e comércio se escoaram de Babilônia, embora seus escribas do templo continuassem a escrever textos astronômicos em cuneiforme até o século I d.C. Quando Trajano veio, em 116 d.C., achou sobretudo montículos e ruínas. No Apocalipse, Babilônia tornou-se o nome do orgulhoso poder mundial que cai. Na Antiguidade tardia, a outrora grande cidade era um lugar menor."
  de:
    - "Babylon lag am Euphrat in Südmesopotamien, etwa 85 km südlich des heutigen Bagdad, neben dem heutigen Hilla. Es erscheint zuerst als kleine Stadt auf einer Tafel des akkadischen Königs Scharkalischarri im 23. Jahrhundert v. Chr. Sein Aufstieg kam mit der Ersten Dynastie von Babylon: Hammurabi (1792–1750 v. Chr. nach der mittleren Chronologie) einte Südmesopotamien und machte die Stadt zur Hauptstadt. 1595 v. Chr. plünderte der hethitische König Mursili I. sie, und kassitische Könige herrschten danach etwa vier Jahrhunderte über Babylonien."
    - "In der Genesis gehört Babel zu den ersten Städten von Nimrods Reich und ist der Ort des Turms, dessen Erbauer zerstreut wurden. Unter assyrischer Herrschaft rebellierte Babylon oft; sein König Merodach-Baladan sandte Gesandte zu Hiskia, und 689 v. Chr. zerstörte Sanherib die Stadt. Nabopolassar, der dort 626 v. Chr. König wurde, gründete das neubabylonische Reich, und sein Sohn Nebukadnezar (605–562 v. Chr.) baute Babylon mit Doppelmauern, Palästen, dem Ischtar-Tor und der Zikkurat Etemenanki neu. Verbannte aus Juda wurden 597 und 587 oder 586 v. Chr. hierher gebracht; Tafeln aus dem Königspalast führen Rationen für Jojachin auf, den König von Juda, den auch die Bibel am babylonischen Hof verortet."
    - "539 v. Chr. nahm Kyrus von Persien Babylon ein, wie die Nabonid-Chronik und der Kyrus-Zylinder berichten, und das Buch Esra beginnt mit seinem Erlass, der den Verbannten die Rückkehr erlaubte. Das Buch Daniel verlegt das Fest Belsazars in die Stadt. Babylon blieb Residenz der persischen Könige. Alexander der Große zog 331 v. Chr. ein und starb 323 v. Chr. in Nebukadnezars Palast."
    - "Nachdem Seleukos um 305 v. Chr. Seleukia am Tigris gegründet hatte, flossen Menschen und Handel aus Babylon ab, obwohl seine Tempelgelehrten bis ins 1. Jahrhundert n. Chr. astronomische Texte in Keilschrift weiterschrieben. Als Trajan 116 n. Chr. kam, fand er überwiegend Hügel und Ruinen. In der Offenbarung wurde Babylon zum Namen der stolzen Weltmacht, die fällt. In der Spätantike war die einst große Stadt ein unbedeutender Ort."
  fr:
    - "Babylone se trouvait sur l’Euphrate, dans le sud de la Mésopotamie, à environ 85 km au sud de l’actuelle Bagdad, à côté de l’actuelle Hillah. Elle paraît d’abord comme une petite ville sur une tablette du roi akkadien Shar-kali-sharri au XXIIIe siècle av. J.-C. Son essor vint avec la première dynastie de Babylone : Hammurabi (1792-1750 av. J.-C. en chronologie moyenne) unifia le sud de la Mésopotamie et en fit sa capitale. En 1595 av. J.-C., le roi hittite Mursili Ier la mit à sac, et des rois kassites régnèrent ensuite sur la Babylonie pendant environ quatre siècles."
    - "Dans la Genèse, Babel est parmi les premières villes du royaume de Nimrod et le lieu de la tour dont les bâtisseurs furent dispersés. Sous la domination assyrienne, Babylone se révolta souvent ; son roi Berodac-Baladan envoya des messagers à Ézéchias, et en 689 av. J.-C. Sanchérib détruisit la ville. Nabopolassar, devenu roi en 626 av. J.-C., fonda le royaume néo-babylonien, et son fils Nebucadnetsar (605-562 av. J.-C.) rebâtit Babylone avec des murs doubles, des palais, la porte d’Ishtar et la ziggourat Étemenanki. Des exilés de Juda y furent amenés en 597 et en 587 ou 586 av. J.-C. ; des tablettes du palais royal énumèrent les rations de Jojakin, roi de Juda, que la Bible place aussi à la cour babylonienne."
    - "En 539 av. J.-C., Cyrus de Perse prit Babylone, comme le consignent la Chronique de Nabonide et le cylindre de Cyrus, et le livre d’Esdras s’ouvre sur son décret laissant les exilés revenir. Le livre de Daniel situe dans la ville le festin de Belschatsar. Babylone resta une résidence royale des rois perses. Alexandre le Grand y entra en 331 av. J.-C. et mourut dans le palais de Nebucadnetsar en 323 av. J.-C."
    - "Après que Séleucos eut fondé Séleucie sur le Tigre vers 305 av. J.-C., hommes et commerce quittèrent Babylone, bien que ses savants des temples aient continué d’écrire des textes astronomiques en cunéiforme jusqu’au Ier siècle apr. J.-C. Quand Trajan vint en 116 apr. J.-C., il trouva surtout des tertres et des ruines. Dans l’Apocalypse, Babylone devint le nom de la puissance mondiale orgueilleuse qui tombe. À l’Antiquité tardive, la cité jadis grande était un lieu mineur."
  it:
    - "Babilonia sorgeva sull’Eufrate nella Mesopotamia meridionale, a circa 85 km a sud dell’odierna Baghdad, accanto all’odierna Hillah. Compare per la prima volta come piccola città su una tavoletta del re accadico Shar-kali-sharri nel XXIII secolo a.C. La sua ascesa venne con la Prima dinastia di Babilonia: Hammurabi (1792–1750 a.C. secondo la cronologia media) unì la Mesopotamia meridionale e ne fece la propria capitale. Nel 1595 a.C. il re ittita Mursili I la saccheggiò, e re cassiti governarono poi la Babilonia per circa quattro secoli."
    - "Nella Genesi, Babel è fra le prime città del regno di Nimrod e il luogo della torre i cui costruttori furono dispersi. Sotto il dominio assiro Babilonia si ribellò spesso; il suo re Merodac-Baladan mandò ambasciatori a Ezechia, e nel 689 a.C. Sennacherib distrusse la città. Nabopolassar, che vi divenne re nel 626 a.C., fondò il regno neobabilonese, e suo figlio Nabucodonosor (605–562 a.C.) ricostruì Babilonia con doppie mura, palazzi, la Porta di Ishtar e la ziggurat Etemenanki. Esuli di Giuda vi furono condotti nel 597 e nel 587 o 586 a.C.; tavolette del palazzo reale elencano razioni per Ioiachin, re di Giuda, che anche la Bibbia colloca alla corte babilonese."
    - "Nel 539 a.C. Ciro di Persia prese Babilonia, come registrano la Cronaca di Nabonedo e il Cilindro di Ciro, e il libro di Esdra si apre con il suo decreto che lascia tornare gli esuli. Il libro di Daniele colloca in città il banchetto di Baldassarre. Babilonia rimase residenza reale dei re persiani. Alessandro Magno vi entrò nel 331 a.C. e morì nel palazzo di Nabucodonosor nel 323 a.C."
    - "Dopo che Seleuco fondò Seleucia sul Tigri intorno al 305 a.C., gente e commerci abbandonarono Babilonia, benché i suoi studiosi di tempio continuassero a scrivere testi astronomici in cuneiforme fino al I secolo d.C. Quando Traiano vi giunse nel 116 d.C., trovò per lo più tell e rovine. Nell’Apocalisse, Babilonia divenne il nome della superba potenza mondiale che cade. Nella tarda antichità la città un tempo grande era un luogo minore."
  pl:
    - "Babilon leżał nad Eufratem w południowej Mezopotamii, około 85 km na południe od dzisiejszego Bagdadu, obok dzisiejszej Hilli. Po raz pierwszy pojawia się jako małe miasto na tabliczce akadyjskiego króla Szar-kali-szarri w XXIII wieku p.n.e. Jego wzrost nastał wraz z pierwszą dynastią Babilonu: Hammurabi (1792–1750 p.n.e. w chronologii średniej) zjednoczył południową Mezopotamię i uczynił miasto jej stolicą. W 1595 r. p.n.e. hetycki król Murszili I złupił je, a królowie kasyccy rządzili następnie Babilonią przez około cztery stulecia."
    - "W Księdze Rodzaju Babel jest jednym z pierwszych miast królestwa Nimroda i miejscem wieży, której budowniczowie zostali rozproszeni. Pod panowaniem asyryjskim Babilon często się buntował; jego król Merodak-Baladan wysłał posłów do Ezechiasza, a w 689 r. p.n.e. Sennacheryb zniszczył miasto. Nabopolassar, który został tam królem w 626 r. p.n.e., założył królestwo nowobabilońskie, a jego syn Nabuchodonozor (605–562 p.n.e.) odbudował Babilon z podwójnymi murami, pałacami, Bramą Isztar i zigguratem Etemenanki. Wygnańcy z Judy zostali tu sprowadzeni w 597 i w 587 lub 586 r. p.n.e.; tabliczki z pałacu królewskiego wymieniają racje dla Jojakina, króla Judy, którego Biblia także umieszcza na dworze babilońskim."
    - "W 539 r. p.n.e. Cyrus perski zdobył Babilon, jak zapisują Kronika Nabonida i Cylinder Cyrusa, a Księga Ezdrasza otwiera się jego edyktem pozwalającym wygnańcom wrócić. Księga Daniela umieszcza w tym mieście ucztę Belszassara. Babilon pozostał rezydencją królów perskich. Aleksander Wielki wkroczył do niego w 331 r. p.n.e. i zmarł w pałacu Nabuchodonozora w 323 r. p.n.e."
    - "Po tym jak Seleukos założył Seleucję nad Tygrysem około 305 r. p.n.e., ludzie i handel odpływali z Babilonu, choć jego uczeni świątynni pisali dalej pismem klinowym teksty astronomiczne do I wieku n.e. Gdy w 116 r. n.e. przybył Trajan, zastał głównie kopce i ruiny. W Apokalipsie Babilon stał się nazwą dumnej potęgi świata, która upada. W późnej starożytności niegdyś wielkie miasto było miejscem drugorzędnym."
  nl:
    - "Babylon lag aan de Eufraat in Zuid-Mesopotamië, zo’n 85 km ten zuiden van het huidige Bagdad, naast het huidige Hillah. Het verschijnt voor het eerst als een klein stadje op een tablet van de Akkadische koning Sjar-kali-sjarri in de drieëntwintigste eeuw v.Chr. Zijn opkomst kwam met de Eerste Dynastie van Babylon: Hammurabi (1792–1750 v.Chr. in de middenchronologie) verenigde Zuid-Mesopotamië en maakte de stad zijn hoofdstad. In 1595 v.Chr. plunderde de Hettitische koning Mursili I haar, en Kassitische koningen regeerden daarna ongeveer vier eeuwen over Babylonië."
    - "In Genesis behoort Babel tot de eerste steden van Nimrods rijk en is het de plaats van de toren waarvan de bouwers werden verstrooid. Onder Assyrisch gezag kwam Babylon vaak in opstand; zijn koning Merodach-Baladan zond gezanten naar Chizkia, en in 689 v.Chr. verwoestte Sanherib de stad. Nabopolassar, die er in 626 v.Chr. koning werd, stichtte het Neo-Babylonische koninkrijk, en zijn zoon Nebukadnessar (605–562 v.Chr.) herbouwde Babylon met dubbele muren, paleizen, de Ishtarpoort en de ziggoerat Etemenanki. Ballingen uit Juda werden hierheen gebracht in 597 en in 587 of 586 v.Chr.; tabletten uit het koninklijk paleis vermelden rantsoenen voor Jojachin, koning van Juda, die de Bijbel ook aan het Babylonische hof plaatst."
    - "In 539 v.Chr. nam Cyrus van Perzië Babylon in, zoals de Nabonidus-kroniek en de Cyruscilinder vermelden, en het boek Ezra opent met zijn decreet dat de ballingen mochten terugkeren. Het boek Daniël plaatst het feest van Belsazar in de stad. Babylon bleef een koninklijke residentie van de Perzische koningen. Alexander de Grote trok er in 331 v.Chr. binnen en stierf in 323 v.Chr. in Nebukadnessars paleis."
    - "Nadat Seleucus omstreeks 305 v.Chr. Seleucië aan de Tigris had gesticht, trokken mensen en handel weg uit Babylon, al bleven zijn tempelgeleerden tot in de eerste eeuw n.Chr. astronomische teksten in spijkerschrift schrijven. Toen Trajanus in 116 n.Chr. kwam, vond hij vooral heuvels en ruïnes. In Openbaring werd Babylon de naam van de trotse wereldmacht die valt. In de late oudheid was de eens zo grote stad een onbetekenende plaats."
  cs:
    - "Babylón ležel na Eufratu v jižní Mezopotámii, asi 85 km jižně od dnešního Bagdádu, vedle dnešní Hilly. Poprvé se objevuje jako malé město na tabulce akkadského krále Šar-kali-šarrího ve 23. století př. n. l. Jeho vzestup přišel s První babylonskou dynastií: Chammurapi (1792–1750 př. n. l. podle střední chronologie) sjednotil jižní Mezopotámii a učinil z města její hlavní město. V roce 1595 př. n. l. je vyplenil chetitský král Muršili I. a kassitští králové poté vládli Babylonii asi čtyři století."
    - "V Genesis je Babel mezi prvními městy Nimrodova království a místem věže, jejíž stavitelé byli rozptýleni. Pod asyrskou vládou Babylón často povstával; jeho král Merodach-baladan poslal posly k Chizkijášovi a roku 689 př. n. l. Senacherib město zničil. Nabopolassar, který se tam stal králem roku 626 př. n. l., založil novobabylonské království a jeho syn Nebukadnesar (605–562 př. n. l.) přestavěl Babylón s dvojitými hradbami, paláci, Ištařinou bránou a zikkuratem Etemenanki. Vyhnanci z Judy sem byli přivedeni roku 597 a roku 587 nebo 586 př. n. l.; tabulky z královského paláce uvádějí příděly pro Jójakína, krále Judy, kterého Bible také umísťuje na babylonský dvůr."
    - "V roce 539 př. n. l. Kýros Perský dobyl Babylón, jak zaznamenávají Nabonidova kronika a Kýrův válec, a Kniha Ezdrášova začíná jeho výnosem, který dovoluje vyhnancům návrat. Kniha Danielova klade Belšasarovu hostinu do města. Babylón zůstal královským sídlem perských králů. Alexandr Veliký do něj vstoupil roku 331 př. n. l. a zemřel v Nebukadnesarově paláci roku 323 př. n. l."
    - "Poté, co Seleukos kolem roku 305 př. n. l. založil Seleukeiu na Tigridu, lidé a obchod z Babylónu odtékali, ač jeho chrámoví učenci psali klínopisné astronomické texty ještě do 1. století n. l. Když roku 116 n. l. přišel Traianus, nalezl převážně pahorky a zříceniny. Ve Zjevení se Babylón stal jménem pyšné světové mocnosti, která padne. V pozdní antice bylo kdysi veliké město nevýznamným místem."
