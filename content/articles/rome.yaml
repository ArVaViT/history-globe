body:
  en:
    - "Rome lies on the Tiber, about 25 km from the sea, where low hills overlook a crossing of the river. Huts stood on the Palatine from the tenth and ninth centuries BC; Roman tradition put the founding by Romulus in 753 BC, a conventional year. Kings ruled until, traditionally, 509 BC, when the Romans drove out Tarquin and set up a republic. Early in the fourth century BC the Gauls sacked the city."
    - "The republic united Italy and then, in wars with Carthage and the Hellenistic kings, the Mediterranean; in 146 BC it destroyed both Carthage and Corinth. Pompey took Jerusalem in 63 BC; Jews brought to Italy as captives and later freed made up much of Rome's Jewish community. After the civil wars Augustus became the first emperor in 27 BC and rebuilt the city in marble. Rome now held hundreds of thousands of people, perhaps a million; the figure is disputed."
    - "Visitors from Rome heard Peter at Pentecost. About AD 49 Claudius expelled the Jews from Rome, and Aquila and Priscilla came to Corinth. Paul wrote to the Romans, a church he had not yet seen, and arrived as a prisoner about AD 60; he lived two whole years in his own hired house, preaching. After the fire of AD 64 Nero blamed the Christians and put many to death, as Tacitus records. Early tradition holds that Peter and Paul were martyred in Rome under Nero, and their tombs were shown on the Vatican hill and the road to Ostia."
    - "After centuries of intermittent persecution Constantine defeated Maxentius at the Milvian Bridge in 312 and founded the Lateran basilica and St Peter's. In 330 he made Constantinople the new capital. About 382 Bishop Damasus asked Jerome to revise the Latin Gospels. Alaric's Visigoths sacked Rome in 410 and the Vandals in 455; Pope Leo I led the church from 440 to 461. In 476 Odoacer deposed Romulus Augustulus, the last emperor in the West."
  ru:
    - "Рим стоит на Тибре, примерно в 25 км от моря, там, где невысокие холмы поднимаются над речной переправой. Хижины на Палатине появились в X–IX веках до н. э.; римское предание относило основание города Ромулом к 753 г. до н. э., и этот год условный. Цари правили до 509 г. до н. э., когда, по преданию, римляне изгнали Тарквиния и установили республику. В начале IV века до н. э. город разграбили галлы."
    - "Республика объединила Италию, а затем в войнах с Карфагеном и эллинистическими царями подчинила Средиземноморье; в 146 г. до н. э. она разрушила и Карфаген, и Коринф. Помпей взял Иерусалим в 63 г. до н. э.; иудеи, приведённые в Италию пленниками и позже отпущенные на волю, составили большую часть римской иудейской общины. После гражданских войн Август в 27 г. до н. э. стал первым императором и перестроил город в мраморе. В Риме жили сотни тысяч людей, возможно миллион; эта цифра спорна."
    - "Пришельцы из Рима слышали Петра в день Пятидесятницы. Около 49 г. н. э. Клавдий изгнал иудеев из Рима, и Акила и Прискилла пришли в Коринф. Павел написал Послание к Римлянам церкви, которой ещё не видел, а около 60 г. н. э. прибыл туда узником и целых два года жил на своём иждивении, проповедуя. После пожара 64 г. н. э. Нерон обвинил христиан и многих казнил, как пишет Тацит. Раннее предание говорит, что Пётр и Павел приняли мученическую смерть в Риме при Нероне; их гробницы показывали на Ватиканском холме и на Остийской дороге."
    - "После веков то затихавших, то вспыхивавших гонений Константин в 312 г. разбил Максенция у Мульвиева моста и заложил Латеранскую базилику и храм святого Петра. В 330 г. он сделал новой столицей Константинополь. Около 382 г. епископ Дамас поручил Иерониму исправить латинский текст Евангелий. В 410 г. Рим разграбили вестготы Алариха, в 455 г. вандалы; с 440 по 461 г. церковь возглавлял папа Лев I. В 476 г. Одоакр низложил Ромула Августула, последнего императора Запада."
  uk:
    - "Рим лежить на Тибрі, приблизно за 25 км від моря, там, де невисокі пагорби нависають над переправою через річку. Хатини на Палатині стояли з X–IX ст. до н. е.; римська традиція відносила заснування міста Ромулом до 753 р. до н. е., умовного року. Царі правили, за переказом, до 509 р. до н. е., коли римляни вигнали Тарквінія й заснували республіку. На початку IV ст. до н. е. місто сплюндрували галли."
    - "Республіка об'єднала Італію, а потім у війнах із Карфагеном та елліністичними царями — Середземномор'я; у 146 р. до н. е. вона зруйнувала і Карфаген, і Коринт. Помпей узяв Єрусалим у 63 р. до н. е.; євреї, приведені до Італії бранцями й згодом звільнені, склали значну частину єврейської громади Рима. Після громадянських воєн Август став першим імператором у 27 р. до н. е. і перебудував місто в мармурі. Тепер у Римі жили сотні тисяч людей, можливо, мільйон; цифра є спірною."
    - "Прибульці з Рима чули Петра на П'ятдесятницю. Близько 49 р. н. е. Клавдій вигнав євреїв із Рима, і Акила з Прискиллою прийшли до Коринта. Павло написав римлянам, церкві, якої ще не бачив, і прибув до Рима в’язнем близько 60 р. н. е.; він прожив там цілих два роки у власному найнятому домі, проповідуючи. Після пожежі 64 р. н. е. Нерон звинуватив у ній християн і стратив багатьох, як повідомляє Тацит. Давнє передання стверджує, що Петро й Павло прийняли мученицьку смерть у Римі за Нерона, а їхні гробниці показували на Ватиканському пагорбі й при дорозі на Остію."
    - "Після століть уривчастих переслідувань Костянтин переміг Максенція біля Мільвійського мосту в 312 р., заснував Латеранську базиліку та собор Святого Петра. У 330 р. він зробив Константинополь новою столицею. Близько 382 р. єпископ Дамас попросив Ієроніма переглянути латинський переклад Євангелій. Вестготи Аларіха пограбували Рим у 410 р., а вандали — у 455 р.; папа Лев I очолював церкву з 440 до 461 р. У 476 р. Одоакр скинув Ромула Августула, останнього імператора на Заході."
  es:
    - "Roma se alza junto al Tíber, a unos 25 km del mar, donde unas colinas bajas dominan un vado del río. Había cabañas en el Palatino desde los siglos X y IX a. C.; la tradición romana puso la fundación por Rómulo en 753 a. C., una fecha convencional. Reinaron reyes hasta que, según la tradición, en 509 a. C. los romanos expulsaron a Tarquinio e instauraron una república. A principios del siglo IV a. C. los galos saquearon la ciudad."
    - "La república unió Italia y luego, en guerras con Cartago y los reyes helenísticos, el Mediterráneo; en 146 a. C. destruyó tanto Cartago como Corinto. Pompeyo tomó Jerusalén en 63 a. C.; los judíos llevados a Italia como cautivos y liberados más tarde formaron gran parte de la comunidad judía de Roma. Tras las guerras civiles Augusto se convirtió en el primer emperador en 27 a. C. y reconstruyó la ciudad en mármol. Roma albergaba ahora cientos de miles de personas, quizá un millón; la cifra se discute."
    - "Visitantes de Roma oyeron a Pedro en Pentecostés. Hacia el 49 d. C. Claudio expulsó a los judíos de Roma, y Aquila y Priscila llegaron a Corinto. Pablo escribió a los romanos, una iglesia que aún no había visto, y llegó como prisionero hacia el 60 d. C.; vivió dos años enteros en su casa de alquiler, predicando. Tras el incendio del 64 d. C. Nerón culpó a los cristianos y mató a muchos, como registra Tácito. La tradición antigua sostiene que Pedro y Pablo fueron martirizados en Roma bajo Nerón, y sus tumbas se mostraban en la colina Vaticana y en el camino de Ostia."
    - "Tras siglos de persecución intermitente, Constantino derrotó a Majencio en el puente Milvio en 312 y fundó la basílica de Letrán y San Pedro. En 330 hizo de Constantinopla la nueva capital. Hacia 382 el obispo Dámaso pidió a Jerónimo que revisara los Evangelios latinos. Los visigodos de Alarico saquearon Roma en 410 y los vándalos en 455; el papa León I dirigió la Iglesia de 440 a 461. En 476 Odoacro depuso a Rómulo Augústulo, el último emperador de Occidente."
  pt:
    - "Roma fica no Tibre, a cerca de 25 km do mar, onde colinas baixas dominam uma passagem do rio. Havia cabanas no Palatino desde os séculos X e IX a.C.; a tradição romana pôs a fundação por Rômulo em 753 a.C., ano convencional. Reis governaram até, segundo a tradição, 509 a.C., quando os romanos expulsaram Tarquínio e instituíram uma república. No início do século IV a.C. os gauleses saquearam a cidade."
    - "A república uniu a Itália e depois, em guerras com Cartago e os reis helenísticos, o Mediterrâneo; em 146 a.C. destruiu Cartago e Corinto. Pompeu tomou Jerusalém em 63 a.C.; judeus levados à Itália como cativos e depois libertados formaram grande parte da comunidade judaica de Roma. Depois das guerras civis, Augusto tornou-se o primeiro imperador em 27 a.C. e reconstruiu a cidade em mármore. Roma tinha então centenas de milhares de habitantes, talvez um milhão; o número é discutido."
    - "Visitantes de Roma ouviram Pedro no Pentecostes. Por volta de 49 d.C., Cláudio expulsou os judeus de Roma, e Áquila e Priscila vieram a Corinto. Paulo escreveu aos romanos, uma igreja que ainda não vira, e chegou como prisioneiro por volta de 60 d.C.; viveu dois anos inteiros em sua própria casa alugada, pregando. Depois do incêndio de 64 d.C., Nero culpou os cristãos e matou muitos, como registra Tácito. A tradição antiga sustenta que Pedro e Paulo foram martirizados em Roma sob Nero, e seus túmulos eram mostrados na colina do Vaticano e na estrada de Óstia."
    - "Depois de séculos de perseguição intermitente, Constantino derrotou Maxêncio na Ponte Mílvio em 312 e fundou a basílica de Latrão e São Pedro. Em 330 fez de Constantinopla a nova capital. Por volta de 382, o bispo Dâmaso pediu a Jerônimo que revisasse os Evangelhos latinos. Os visigodos de Alarico saquearam Roma em 410 e os vândalos em 455; o papa Leão I dirigiu a igreja de 440 a 461. Em 476 Odoacro depôs Rômulo Augústulo, o último imperador do Ocidente."
  de:
    - "Rom liegt am Tiber, etwa 25 km vom Meer, wo niedrige Hügel eine Flussüberquerung überblicken. Seit dem 10. und 9. Jahrhundert v. Chr. standen Hütten auf dem Palatin; die römische Überlieferung setzte die Gründung durch Romulus auf 753 v. Chr., ein konventionelles Jahr. Könige herrschten bis, der Überlieferung nach, 509 v. Chr., als die Römer Tarquinius vertrieben und eine Republik errichteten. Im frühen 4. Jahrhundert v. Chr. plünderten die Gallier die Stadt."
    - "Die Republik einte Italien und dann in Kriegen mit Karthago und den hellenistischen Königen das Mittelmeer; 146 v. Chr. zerstörte sie Karthago und Korinth. Pompeius nahm 63 v. Chr. Jerusalem; als Gefangene nach Italien gebrachte und später freigelassene Juden bildeten einen großen Teil der jüdischen Gemeinde Roms. Nach den Bürgerkriegen wurde Augustus 27 v. Chr. der erste Kaiser und baute die Stadt in Marmor neu. Rom zählte nun Hunderttausende, vielleicht eine Million Menschen; die Zahl ist umstritten."
    - "Besucher aus Rom hörten Petrus zu Pfingsten. Um 49 n. Chr. wies Klaudius die Juden aus Rom aus, und Aquila und Priscilla kamen nach Korinth. Paulus schrieb an die Römer, eine Gemeinde, die er noch nicht gesehen hatte, und kam um 60 n. Chr. als Gefangener an; er lebte zwei volle Jahre in einer eigenen gemieteten Wohnung und predigte. Nach dem Brand von 64 n. Chr. machte Nero die Christen verantwortlich und ließ viele hinrichten, wie Tacitus berichtet. Die frühe Überlieferung hält Petrus und Paulus für unter Nero in Rom als Märtyrer gestorben, und ihre Gräber wurden auf dem vatikanischen Hügel und an der Straße nach Ostia gezeigt."
    - "Nach Jahrhunderten zeitweiliger Verfolgung besiegte Konstantin 312 Maxentius an der Milvischen Brücke und gründete die Lateranbasilika und die Peterskirche. Im Jahr 330 machte er Konstantinopel zur neuen Hauptstadt. Um 382 bat Bischof Damasus Hieronymus, die lateinischen Evangelien zu überarbeiten. Alarichs Westgoten plünderten Rom 410 und die Vandalen 455; Papst Leo I. leitete die Kirche von 440 bis 461. Im Jahr 476 setzte Odoaker Romulus Augustulus ab, den letzten Kaiser im Westen."
  fr:
    - "Rome se trouve sur le Tibre, à environ 25 km de la mer, là où des collines basses dominent un passage du fleuve. Des cabanes s’élevaient sur le Palatin dès les Xe et IXe siècles av. J.-C. ; la tradition romaine plaçait la fondation par Romulus en 753 av. J.-C., année conventionnelle. Des rois régnèrent jusqu’en 509 av. J.-C., selon la tradition, quand les Romains chassèrent Tarquin et instaurèrent la république. Au début du IVe siècle av. J.-C., les Gaulois mirent la ville à sac."
    - "La république unifia l’Italie puis, dans des guerres contre Carthage et les rois hellénistiques, la Méditerranée ; en 146 av. J.-C., elle détruisit Carthage et Corinthe. Pompée prit Jérusalem en 63 av. J.-C. ; des Juifs amenés en Italie comme captifs puis libérés formèrent une grande part de la communauté juive de Rome. Après les guerres civiles, Auguste devint le premier empereur en 27 av. J.-C. et rebâtit la ville en marbre. Rome comptait alors des centaines de milliers d’habitants, peut-être un million ; le chiffre est disputé."
    - "Des visiteurs de Rome entendirent Pierre à la Pentecôte. Vers 49 apr. J.-C., Claude expulsa les Juifs de Rome, et Aquilas et Priscille vinrent à Corinthe. Paul écrivit aux Romains, une Église qu’il n’avait pas encore vue, et y arriva prisonnier vers 60 apr. J.-C. ; il y « demeura deux ans entiers dans une maison qu’il avait louée », en prêchant. Après l’incendie de 64 apr. J.-C., Néron rejeta la faute sur les chrétiens et en fit mourir beaucoup, comme le consigne Tacite. La tradition ancienne tient que Pierre et Paul furent martyrisés à Rome sous Néron, et leurs tombes étaient montrées sur la colline du Vatican et sur la route d’Ostie."
    - "Après des siècles de persécution intermittente, Constantin vainquit Maxence au pont Milvius en 312 et fonda la basilique du Latran et Saint-Pierre. En 330, il fit de Constantinople la nouvelle capitale. Vers 382, l’évêque Damase demanda à Jérôme de réviser les Évangiles latins. Les Wisigoths d’Alaric mirent Rome à sac en 410 et les Vandales en 455 ; le pape Léon Ier dirigea l’Église de 440 à 461. En 476, Odoacre déposa Romulus Augustule, dernier empereur d’Occident."
  it:
    - "Roma sorge sul Tevere, a circa 25 km dal mare, dove colli bassi dominano un guado del fiume. Capanne sorgevano sul Palatino dal X e IX secolo a.C.; la tradizione romana poneva la fondazione per opera di Romolo nel 753 a.C., un anno convenzionale. Regnarono re fino, secondo la tradizione, al 509 a.C., quando i Romani cacciarono Tarquinio e istituirono una repubblica. All’inizio del IV secolo a.C. i Galli saccheggiarono la città."
    - "La repubblica unì l’Italia e poi, nelle guerre con Cartagine e con i re ellenistici, il Mediterraneo; nel 146 a.C. distrusse sia Cartagine sia Corinto. Pompeo prese Gerusalemme nel 63 a.C.; Ebrei portati in Italia come prigionieri e poi liberati costituirono gran parte della comunità ebraica di Roma. Dopo le guerre civili Augusto divenne il primo imperatore nel 27 a.C. e ricostruì la città in marmo. Roma contava ora centinaia di migliaia di abitanti, forse un milione; la cifra è controversa."
    - "Visitatori da Roma ascoltarono Pietro alla Pentecoste. Verso il 49 d.C. Claudio espulse gli Ebrei da Roma, e Aquila e Priscilla giunsero a Corinto. Paolo scrisse ai Romani, una chiesa che non aveva ancora visto, e vi giunse come prigioniero verso il 60 d.C.; visse due anni interi in una casa presa a fitto, predicando. Dopo l’incendio del 64 d.C. Nerone incolpò i cristiani e ne mise a morte molti, come riferisce Tacito. L’antica tradizione sostiene che Pietro e Paolo furono martirizzati a Roma sotto Nerone, e le loro tombe erano mostrate sul colle Vaticano e sulla via Ostiense."
    - "Dopo secoli di persecuzioni intermittenti Costantino sconfisse Massenzio a Ponte Milvio nel 312 e fondò la basilica del Laterano e San Pietro. Nel 330 fece di Costantinopoli la nuova capitale. Verso il 382 il vescovo Damaso chiese a Girolamo di rivedere i Vangeli latini. I Visigoti di Alarico saccheggiarono Roma nel 410 e i Vandali nel 455; papa Leone I guidò la chiesa dal 440 al 461. Nel 476 Odoacre depose Romolo Augustolo, l’ultimo imperatore d’Occidente."
  pl:
    - "Rzym leży nad Tybrem, około 25 km od morza, gdzie niskie wzgórza górują nad brodem rzeki. Chaty stały na Palatynie od X i IX wieku p.n.e.; tradycja rzymska umieszczała założenie przez Romulusa w 753 roku p.n.e., roku umownym. Rządzili królowie aż do, według tradycji, 509 roku p.n.e., gdy Rzymianie wypędzili Tarkwiniusza i ustanowili republikę. Na początku IV wieku p.n.e. Galowie złupili miasto."
    - "Republika zjednoczyła Italię, a potem, w wojnach z Kartaginą i królami hellenistycznymi, basen Morza Śródziemnego; w 146 roku p.n.e. zniszczyła zarówno Kartaginę, jak Korynt. Pompejusz zdobył Jerozolimę w 63 roku p.n.e.; Żydzi sprowadzeni do Italii jako jeńcy i później uwolnieni stanowili znaczną część rzymskiej społeczności żydowskiej. Po wojnach domowych August został pierwszym cesarzem w 27 roku p.n.e. i przebudował miasto w marmurze. Rzym liczył teraz setki tysięcy ludzi, może milion; liczba ta jest sporna."
    - "Przybysze z Rzymu słyszeli Piotra w Pięćdziesiątnicę. Około 49 roku n.e. Klaudiusz wypędził Żydów z Rzymu, a Akwila i Pryscylla przybyli do Koryntu. Paweł napisał do Rzymian, kościoła, którego jeszcze nie widział, i przybył jako więzień około 60 roku n.e.; mieszkał dwa pełne lata we własnym wynajętym domu, głosząc naukę. Po pożarze w 64 roku n.e. Neron obwinił chrześcijan i wielu stracił, jak zapisał Tacyt. Wczesna tradycja głosi, że Piotr i Paweł ponieśli w Rzymie śmierć męczeńską za Nerona, a ich groby pokazywano na wzgórzu watykańskim i przy drodze do Ostii."
    - "Po wiekach przerywanych prześladowań Konstantyn pokonał Maksencjusza przy Moście Mulwijskim w 312 roku i ufundował bazylikę laterańską oraz bazylikę św. Piotra. W 330 roku uczynił Konstantynopol nową stolicą. Około 382 roku biskup Damazy poprosił Hieronima o rewizję łacińskich Ewangelii. Wizygoci Alaryka złupili Rzym w 410 roku, a Wandalowie w 455; papież Leon I kierował Kościołem w latach 440–461. W 476 roku Odoaker zdetronizował Romulusa Augustulusa, ostatniego cesarza na Zachodzie."
  cs:
    - "Řím leží na Tiberu, asi 25 km od moře, kde nízké pahorky shlížejí na brod přes řeku. Chýše stály na Palatinu od 10. a 9. století př. n. l.; římská tradice kladla založení Romulem do roku 753 př. n. l., což je konvenční rok. Králové vládli podle tradice do roku 509 př. n. l., kdy Římané vyhnali Tarquinia a zřídili republiku. Počátkem 4. století př. n. l. město vyplenili Galové."
    - "Republika sjednotila Itálii a pak, ve válkách s Kartágem a helénistickými králi, Středomoří; roku 146 př. n. l. zničila Kartágo i Korint. Pompeius dobyl Jeruzalém roku 63 př. n. l.; Židé přivedení do Itálie jako zajatci a později propuštění tvořili velkou část židovské obce v Římě. Po občanských válkách se Augustus roku 27 př. n. l. stal prvním císařem a přestavěl město v mramoru. Řím nyní čítal statisíce lidí, snad milion; číslo je sporné."
    - "Návštěvníci z Říma slyšeli Petra o Letnicích. Asi roku 49 n. l. vyhnal Klaudius Židy z Říma a Akvila a Priscilla přišli do Korintu. Pavel napsal Římanům, církvi, kterou ještě neviděl, a přišel jako vězeň asi roku 60 n. l.; žil celé dva roky ve vlastním najatém domě a kázal. Po požáru roku 64 n. l. obvinil Nero křesťany a mnohé dal popravit, jak zaznamenává Tacitus. Raná tradice praví, že Petr a Pavel byli umučeni v Římě za Nerona a jejich hroby se ukazovaly na vatikánském pahorku a na cestě do Ostie."
    - "Po staletích občasného pronásledování porazil Konstantin Maxentia u Milvijského mostu roku 312 a založil Lateránskou baziliku a baziliku svatého Petra. Roku 330 učinil Konstantinopol novým hlavním městem. Asi roku 382 požádal biskup Damasus Jeronýma o revizi latinských evangelií. Alarichovi Vizigóti vyplenili Řím roku 410 a Vandalové roku 455; papež Lev I. vedl církev od roku 440 do 461. Roku 476 sesadil Odoaker Romula Augustula, posledního císaře na Západě."
  nl:
    - "Rome ligt aan de Tiber, zo’n 25 km van de zee, waar lage heuvels uitzien over een oversteekplaats van de rivier. Op de Palatijn stonden hutten vanaf de 10e en 9e eeuw v.Chr.; de Romeinse overlevering plaatste de stichting door Romulus in 753 v.Chr., een conventioneel jaar. Koningen regeerden tot, volgens de overlevering, 509 v.Chr., toen de Romeinen Tarquinius verdreven en een republiek instelden. Begin 4e eeuw v.Chr. plunderden de Galliërs de stad."
    - "De republiek verenigde Italië en daarna, in oorlogen met Carthago en de hellenistische koningen, het Middellandse Zeegebied; in 146 v.Chr. verwoestte ze zowel Carthago als Korinthe. Pompeius nam Jeruzalem in 63 v.Chr.; Joden die als krijgsgevangenen naar Italië waren gebracht en later vrijgelaten vormden een groot deel van Romes Joodse gemeenschap. Na de burgeroorlogen werd Augustus in 27 v.Chr. de eerste keizer en herbouwde de stad in marmer. Rome telde nu honderdduizenden inwoners, misschien een miljoen; het getal is omstreden."
    - "Bezoekers uit Rome hoorden Petrus met Pinksteren. Omstreeks 49 n.Chr. verdreef Claudius de Joden uit Rome, en Aquila en Priscilla kwamen naar Korinthe. Paulus schreef aan de Romeinen, een gemeente die hij nog niet had gezien, en kwam er omstreeks 60 n.Chr. als gevangene aan; hij woonde twee hele jaren in zijn eigen gehuurde huis en predikte. Na de brand van 64 n.Chr. gaf Nero de christenen de schuld en liet velen doden, zoals Tacitus vermeldt. De vroege overlevering houdt dat Petrus en Paulus onder Nero in Rome als martelaar stierven, en hun graven werden getoond op de Vaticaanse heuvel en aan de weg naar Ostia."
    - "Na eeuwen van onderbroken vervolging versloeg Constantijn Maxentius bij de Milvische Brug in 312 en stichtte de Lateraanse basiliek en de Sint-Pieter. In 330 maakte hij Constantinopel tot de nieuwe hoofdstad. Omstreeks 382 vroeg bisschop Damasus Hieronymus de Latijnse evangeliën te herzien. Alarics Visigoten plunderden Rome in 410 en de Vandalen in 455; paus Leo I leidde de kerk van 440 tot 461. In 476 zette Odoaker Romulus Augustulus af, de laatste keizer in het Westen."
