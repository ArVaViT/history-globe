body:
  en:
    - "Javan is the Hebrew name for the Greeks, taken from the Ionians, the Greeks of the Aegean coast of Asia Minor whom the peoples of the Levant met first; the table of nations makes Javan a son of Japheth. The map places it in Ionia, on the coast of western Anatolia. Two passages name it as a distant land: Ezekiel's lament over Tyre lists among her trading partners “Javan, Tubal, and Meshech, they were thy merchants: they traded the persons of men and vessels of brass in thy market”, and at the end of Isaiah the Lord will send survivors to the nations, “to Tubal, and Javan, to the isles afar off, that have not heard my fame”. The Synodal Bible writes the name Иаван in Ezekiel and Яван in Isaiah."
    - "Other ancient Near Eastern texts use the same name. Assyrian inscriptions of the eighth century BC speak of the Yamnaya, Ionians who came by sea, and the Persian kings list the Yauna among their subject peoples. In Daniel the same Hebrew word becomes the kingdom of Greece; that wider story is told under Greece."
  ru:
    - "Иаван — еврейское имя греков, взятое от ионийцев, греков эгейского побережья Малой Азии, с которыми народы Леванта встретились раньше других; таблица народов делает Иавана сыном Иафета. Карта помещает его в Ионии, на побережье западной Анатолии. Два места называют его как далёкую землю: плач Иезекииля о Тире называет среди его торговцев: «Иаван, Фувал и Мешех торговали с тобою, выменивая товары твои на души человеческие и медную посуду», а в конце книги Исаии Господь пошлёт спасённых к народам, «к Тубалу и Явану, на дальние острова, которые не слышали обо Мне». Синодальный перевод пишет имя как Иаван у Иезекииля и как Яван у Исаии."
    - "Другие древние тексты Ближнего Востока знают то же имя. Ассирийские надписи VIII века до н. э. говорят о ямнайя, ионийцах, приходивших с моря, а персидские цари называют яуна среди подвластных им народов. У Даниила то же еврейское слово становится царством Греческим; эта более широкая история рассказана в статье о Греции."
  uk:
    - "Яван — давньоєврейська назва греків, узята від іонійців, греків егейського узбережжя Малої Азії, з якими першими зустрілися народи Леванту; перелік народів робить Явана сином Яфета. Карта розміщує його в Іонії, на узбережжі західної Анатолії. Два уривки називають його далеким краєм: плач Єзекіїля над Тіром перелічує серед її торговельних партнерів: «Яван, Тубал й Мешех, — се торговцї твої; вони міняли товари твої за душі людські (раби) й мідяний посуд», а наприкінці Ісаї Господь пошле врятованих до народів, «у Тубалу, Евану, й по далеких островах, що слави моєї не вбачали». Синодальна Біблія пише цю назву «Иаван» в Єзекіїля та «Яван» в Ісаї."
    - "Інші близькосхідні тексти давнини вживають ту саму назву. Ассирійські написи VIII ст. до н. е. говорять про ямнаїв, іонійців, що приходили морем, а перські царі зараховують Яуна до своїх підвладних народів. У Даниїла те саме давньоєврейське слово стає царством Еллади; ця ширша історія розказана під Елладою."
  es:
    - "Javán es el nombre hebreo de los griegos, tomado de los jonios, los griegos de la costa egea de Asia Menor a quienes los pueblos del Levante conocieron primero; la tabla de las naciones hace de Javán un hijo de Jafet. El mapa lo sitúa en Jonia, en la costa de la Anatolia occidental. Dos pasajes lo nombran como una tierra lejana: la lamentación de Ezequiel sobre Tiro enumera entre sus socios comerciales «Grecia [Javán], Tubal, y Mesec, tus mercaderes, con hombres y con vasos de metal, dieron en tus ferias», y al final de Isaías el Señor enviará supervivientes a las naciones, «á Tubal y á Javán, á las islas apartadas que no oyeron de mí». La Biblia sinodal escribe el nombre Иаван en Ezequiel y Яван en Isaías."
    - "Otros textos del Antiguo Oriente Próximo usan el mismo nombre. Inscripciones asirias del siglo VIII a. C. hablan de los Yamnaya, jonios que llegaban por mar, y los reyes persas enumeran a los Yauna entre sus pueblos sometidos. En Daniel la misma palabra hebrea se convierte en el reino de Grecia; esa historia más amplia se cuenta en el artículo de Grecia."
  pt:
    - "Javã é o nome hebraico dos gregos, tomado dos jônios, os gregos da costa egeia da Ásia Menor que os povos do Levante encontraram primeiro; a tabela das nações faz de Javã um filho de Jafé. O mapa a põe na Jônia, na costa da Anatólia ocidental. Duas passagens a nomeiam como terra distante: o lamento de Ezequiel sobre Tiro lista entre seus parceiros comerciais “Javã, Tubal e Meseque eram os seus comerciantes. Eles trocavam vidas humanas e utensílios de bronze pelas suas mercadorias”, e no fim de Isaías o Senhor enviará sobreviventes às nações, “a Tubal e Javã, às ilhas distantes, que não ouviram da minha fama”. A Bíblia Sinodal escreve o nome Иаван em Ezequiel e Яван em Isaías."
    - "Outros textos do antigo Oriente Próximo usam o mesmo nome. Inscrições assírias do século VIII a.C. falam dos Yamnaya, jônios que vinham pelo mar, e os reis persas listam os Yauna entre seus povos súditos. Em Daniel, a mesma palavra hebraica torna-se o reino da Grécia; essa história mais ampla é contada sob Grécia."
  de:
    - "Jawan ist der hebräische Name für die Griechen, von den Ioniern genommen, den Griechen der ägäischen Küste Kleinasiens, denen die Völker der Levante zuerst begegneten; die Völkertafel macht Jawan zu einem Sohn Jafets. Die Karte setzt es nach Ionien an der Küste Westanatoliens. Zwei Stellen nennen es als fernes Land: Hesekiels Klage über Tyrus führt unter ihren Handelspartnern auf: „Javan, Thubal und Mesech haben mit dir gehandelt und haben dir leibeigene Leute und Geräte von Erz auf deine Märkte gebracht“, und am Ende des Jesaja sendet der Herr Gerettete zu den Völkern, „gen Thubal und Javan und in die Ferne zu den Inseln, da man nichts von mir gehört hat“. Die Synodalübersetzung schreibt den Namen Иаван bei Hesekiel und Яван bei Jesaja."
    - "Andere altorientalische Texte gebrauchen denselben Namen. Assyrische Inschriften des 8. Jahrhunderts v. Chr. sprechen von den Yamnaya, Ioniern, die über das Meer kamen, und die persischen Könige führen die Jauna unter ihren unterworfenen Völkern auf. Bei Daniel wird dasselbe hebräische Wort zum Königreich Griechenland; diese weitere Geschichte wird unter Griechenland erzählt."
  fr:
    - "Javan est le nom hébreu des Grecs, tiré des Ioniens, les Grecs de la côte égéenne de l’Asie Mineure que les peuples du Levant rencontrèrent les premiers ; la table des nations fait de Javan un fils de Japhet. La carte le place en Ionie, sur la côte de l’Anatolie occidentale. Deux passages le nomment comme un pays lointain : la lamentation d’Ézéchiel sur Tyr énumère parmi ses partenaires commerciaux : « Javan, Tubal et Méschec trafiquaient avec toi ; ils donnaient des esclaves et des ustensiles d’airain en échange de tes marchandises », et à la fin d’Ésaïe l’Éternel enverra des réchappés vers les nations, « à Tubal et à Javan, aux îles lointaines, qui jamais n’ont entendu parler de moi, et qui n’ont pas vu ma gloire ». La Bible synodale écrit le nom Иаван chez Ézéchiel et Яван chez Ésaïe."
    - "D’autres textes du Proche-Orient ancien emploient le même nom. Des inscriptions assyriennes du VIIIe siècle av. J.-C. parlent des Yamnaya, Ioniens venus par mer, et les rois perses énumèrent les Yauna parmi leurs peuples sujets. Chez Daniel, le même mot hébreu devient le royaume de Grèce ; cette histoire plus large est racontée sous Grèce."
  pl:
    - "Jawan to hebrajska nazwa Greków, wzięta od Jończyków, Greków z egejskiego wybrzeża Azji Mniejszej, których ludy Lewantu spotkały najpierw; tablica narodów czyni Jawana synem Jafeta. Mapa umieszcza go w Jonii, na wybrzeżu zachodniej Anatolii. Dwa fragmenty wymieniają go jako daleki kraj: w lamencie Ezechiela nad Tyrem wśród jej partnerów handlowych jest „Jawan, Tubal, i Mesech, kupcy twoi, ludzi i naczynie miedziane dawali na zamianę tobie”, a na końcu Izajasza Pan pośle ocalałych do narodów, „do Tubala, i do Jawanu, na wyspy dalekie, które nic o mnie nie słyszały”. Biblia synodalna pisze nazwę Иаван u Ezechiela i Яван u Izajasza."
    - "Inne starożytne teksty Bliskiego Wschodu używają tej samej nazwy. Asyryjskie napisy z VIII w. p.n.e. mówią o Jamnaja, Jończykach przybywających morzem, a królowie perscy wymieniają Jauna wśród swoich poddanych ludów. U Daniela to samo hebrajskie słowo staje się królestwem Grecji; ta szersza historia jest opowiedziana pod hasłem Grecja."
  it:
    - "Iavan è il nome ebraico dei Greci, tratto dagli Ioni, i Greci della costa egea dell’Asia Minore che i popoli del Levante incontrarono per primi; la tavola delle nazioni fa di Iavan un figlio di Iafet. La mappa lo pone in Ionia, sulla costa dell’Anatolia occidentale. Due passi lo nominano come terra lontana: il lamento di Ezechiele su Tiro elenca fra i suoi partner commerciali «Javan, Tubal e Mescec anch’essi traffican teco; dànno anime umane e utensili di rame in scambio delle tue mercanzie», e alla fine di Isaia il Signore manderà scampati alle nazioni, «a Tubal e a Javan, alle isole lontane che non han mai udito la mia fama». La Bibbia sinodale scrive il nome Иаван in Ezechiele e Яван in Isaia."
    - "Altri testi del Vicino Oriente antico usano lo stesso nome. Le iscrizioni assire dell’VIII secolo a.C. parlano degli Yamnaya, Ioni giunti per mare, e i re persiani elencano gli Yauna fra i loro popoli sottomessi. In Daniele la stessa parola ebraica diventa il regno di Grecia; quella storia più ampia è narrata alla voce Grecia."
  nl:
    - "Javan is de Hebreeuwse naam voor de Grieken, ontleend aan de Ioniërs, de Grieken van de Egeïsche kust van Klein-Azië die de volken van de Levant het eerst ontmoetten; de volkerentafel maakt Javan een zoon van Jafet. De kaart plaatst het in Ionië, aan de kust van West-Anatolië. Twee passages noemen het als een ver land: Ezechiëls klaaglied over Tyrus noemt onder haar handelspartners “Javan, Tubal en Mesech waren uw kooplieden; met mensenzielen en koperen vaten dreven zij onderlingen handel met u”, en aan het eind van Jesaja zendt de Heer overlevenden naar de volken, “naar Tubal en Javan, tot de ver gelegen eilanden, die Mijn gerucht niet gehoord” hebben. De Synodale Bijbel schrijft de naam Иаван in Ezechiël en Яван in Jesaja."
    - "Andere teksten uit het Oude Nabije Oosten gebruiken dezelfde naam. Assyrische opschriften uit de 8e eeuw v.Chr. spreken van de Yamnaya, Ioniërs die over zee kwamen, en de Perzische koningen noemen de Yauna onder hun onderworpen volken. In Daniël wordt hetzelfde Hebreeuwse woord het koninkrijk Griekenland; dat bredere verhaal wordt verteld onder Griekenland."
  cs:
    - "Javan je hebrejské jméno pro Řeky, převzaté od Ionů, Řeků egejského pobřeží Malé Asie, s nimiž se národy Levanty setkaly nejdříve; tabulka národů činí z Javana syna Jafetova. Mapa jej klade do Ionie, na pobřeží západní Anatolie. Dvě místa jej jmenují jako vzdálenou zemi: Ezechielův nářek nad Týrem uvádí mezi jejími obchodními partnery „Javan, Tubal a Mešech, kupci tvoji, lidi a nádobí měděné dávali za směnu tobě“ a na konci Izajáše pošle Hospodin zachráněné k národům, „do Tubal a Javan, na ostrovy daleké, kteříž neslýchali pověsti o mně“. Synodální Bible píše jméno Иаван u Ezechiela a Яван u Izajáše."
    - "Jiné starověké blízkovýchodní texty užívají téhož jména. Asyrské nápisy z 8. stol. př. n. l. mluví o Yamnaya, Iónech, kteří přicházeli po moři, a perští králové uvádějí Yauna mezi svými poddanými národy. U Daniele se totéž hebrejské slovo stává královstvím Řecka; tento širší příběh je vyprávěn pod heslem Řecko."
  sv:
    - "Javan är det hebreiska namnet på grekerna, hämtat från jonerna, grekerna på Mindre Asiens kust vid Egeiska havet som Levantens folk mötte först; folkens tavla gör Javan till en son till Jafet. Kartan placerar det i Ionien, på västra Anatoliens kust. Två ställen nämner det som ett fjärran land: Hesekiels klagosång över Tyros räknar bland hennes handelspartner ”Javan, Tubal och Mesek, de drevo köpenskap med dig; trälar och kopparkärl gåvo de dig i utbyte”, och i slutet av Jesaja ska Herren sända de räddade till folken, ”till Tubal och Javan, till havsländerna i fjärran, som icke hava hört något om mig”. Den ryska synodalbibeln skriver namnet Иаван hos Hesekiel och Яван hos Jesaja."
    - "Andra forntida texter från Främre Orienten använder samma namn. Assyriska inskrifter från 700-talet f.Kr. talar om Yamnaya, joner som kom sjövägen, och de persiska kungarna upptar Yauna bland sina undersåtliga folk. Hos Daniel blir samma hebreiska ord Greklands rike; den vidare historien berättas under Grekland."
  nb:
    - "Javan er det hebraiske navnet på grekerne, hentet fra ionerne, grekerne på Egeerhavskysten av Lilleasia som folkene i Levanten møtte først; folkeslagstabellen gjør Javan til en sønn av Jafet. Kartet plasserer det i Ionia, på kysten av vestlige Anatolia. To tekster nevner det som et fjernt land: Esekiels klagesang over Tyros oppfører blant hennes handelspartnere: «Javan, Tubal og Mesek var dine kremmere; med mennesker og kobberkar betalte de dine varer», og mot slutten av Jesaja vil Herren sende de overlevende til folkene, «til Tubal og Javan, til de fjerne kyster som ikke har hørt tidenden om mig». Den synodale bibelen skriver navnet Иаван hos Esekiel og Яван hos Jesaja."
    - "Andre tekster fra det gamle Midtøsten bruker det samme navnet. Assyriske innskrifter fra 700-tallet f.Kr. taler om Yamnaya, ioner som kom sjøveien, og de persiske kongene oppfører Yauna blant sine undersåtter. Hos Daniel blir det samme hebraiske ordet riket Hellas; den videre historien fortelles under Hellas."
  tl:
    - "Ang Javan ang pangalang Hebreo para sa mga Griyego, kinuha mula sa mga Ionio, ang mga Griyego ng baybayin ng Aegean ng Asia Minor na unang nakilala ng mga bayan ng Levant; ginagawa ng talaan ng mga bansa si Javan na anak ni Japhet. Inilalagay ito ng mapa sa Ionia, sa baybayin ng kanlurang Anatolia. Dalawang talata ang nagpapangalan dito bilang malayong lupain: sa panaghoy ni Ezekiel sa Tiro ay itinatala sa kaniyang mga katuwang sa kalakalan ang “Javan, ang Tubal, at ang Mesec, mga mangangalakal mo: kanilang kinakalakal ang mga tao at ang mga sisidlang tanso na ipinapalit nila sa iyong mga kalakal”, at sa katapusan ng Isaias susuguin ng Panginoon ang mga nakatanan sa mga bansa, “sa Tubal at Javan, sa mga pulong malayo na hindi nangakarinig ng aking kabantugan”. Binabaybay ng Bibliyang Synodal ang pangalan na Иаван sa Ezekiel at Яван sa Isaias."
    - "Ginagamit ng ibang sinaunang teksto ng Malapit na Silangan ang parehong pangalan. Ang mga inskripsiyong Asirio noong ika-8 siglo BK ay nagsasalita tungkol sa mga Yamnaya, mga Ionio na dumating sa dagat, at itinatala ng mga haring Persiano ang mga Yauna sa kanilang mga nasasakupang bayan. Sa Daniel ang parehong salitang Hebreo ay nagiging kaharian ng Grecia; ang mas malawak na kuwentong iyon ay isinasalaysay sa ilalim ng Grecia."
