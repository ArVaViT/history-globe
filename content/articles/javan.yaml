# Overview article (ADR 0007). Mainstream facts only; Javan is the Hebrew name for the Ionian Greeks; the wider story of Greece is left to the Greece article; the Synodal Bible spells the name two ways.
id: javan
place: a116c5c
title:
  en: "Javan"
  ru: "Иаван"
  uk: "Яван"
  es: "Javán"
  pt: "Javã"
  de: "Jawan"
  fr: "Javan"
body:
  en:
    - "Javan is the Hebrew name for the Greeks, taken from the Ionians, the Greeks of the Aegean coast of Asia Minor whom the peoples of the Levant met first; the table of nations makes Javan a son of Japheth. The map places it in Ionia, on the coast of western Anatolia. Two passages name it as a distant land: Ezekiel's lament over Tyre lists among her trading partners “Javan, Tubal, and Meshech, they were thy merchants: they traded the persons of men and vessels of brass in thy market”, and at the end of Isaiah the Lord will send survivors to the nations, “to Tubal, and Javan, to the isles afar off, that have not heard my fame”. The Synodal Bible writes the name Иаван in Ezekiel and Яван in Isaiah."
    - "Other ancient Near Eastern texts use the same name. Assyrian inscriptions of the eighth century BC speak of the Yamnaya, Ionians who came by sea, and the Persian kings list the Yauna among their subject peoples. In Daniel the same Hebrew word becomes the kingdom of Greece; that wider story is told under Greece."
  ru:
    - "Иаван — еврейское имя греков, взятое от ионийцев, греков эгейского побережья Малой Азии, с которыми народы Леванта встретились раньше других; таблица народов делает Иавана сыном Иафета. Карта помещает его в Ионии, на побережье западной Анатолии. Два места называют его как далёкую землю: плач Иезекииля о Тире называет среди его торговцев: «Иаван, Фувал и Мешех торговали с тобою, выменивая товары твои на души человеческие и медную посуду», а в конце книги Исаии Господь пошлёт спасённых к народам, «к Тубалу и Явану, на дальние острова, которые не слышали обо Мне». Синодальный перевод пишет имя как Иаван у Иезекииля и как Яван у Исаии."
    - "Другие древние тексты Ближнего Востока знают то же имя. Ассирийские надписи VIII века до н. э. говорят о ямнайя, ионийцах, приходивших с моря, а персидские цари называют яуна среди подвластных им народов. У Даниила то же еврейское слово становится царством Греческим; эта более широкая история рассказана в статье о Греции."
  uk:
    - "Яван — давньоєврейська назва греків, узята від іонійців, греків егейського узбережжя Малої Азії, з якими першими зустрілися народи Леванту; перелік народів робить Явана сином Яфета. Карта розміщує його в Іонії, на узбережжі західної Анатолії. Два уривки називають його далеким краєм: плач Єзекіїля над Тіром перелічує серед її торговельних партнерів: «Яван, Тубал й Мешех, — се торговцї твої; вони міняли товари твої за душі людські (раби) й мідяний посуд», а наприкінці Ісаї Господь пошле врятованих до народів, «у Тубалу, Евану, й по далеких островах, що слави моєї не вбачали». Синодальна Біблія пише цю назву «Иаван» в Єзекіїля та «Яван» в Ісаї."
    - "Інші близькосхідні тексти давнини вживають ту саму назву. Ассирійські написи VIII ст. до н. е. говорять про ямнаїв, іонійців, що приходили морем, а перські царі зараховують Яуна до своїх підвладних народів. У Даниїла те саме давньоєврейське слово стає царством Еллади; ця ширша історія розказана під Елладою."
  es:
    - "Javán es el nombre hebreo de los griegos, tomado de los jonios, los griegos de la costa egea de Asia Menor a quienes los pueblos del Levante conocieron primero; la tabla de las naciones hace de Javán un hijo de Jafet. El mapa lo sitúa en Jonia, en la costa de la Anatolia occidental. Dos pasajes lo nombran como una tierra lejana: la lamentación de Ezequiel sobre Tiro enumera entre sus socios comerciales «Grecia [Javán], Tubal, y Mesec, tus mercaderes, con hombres y con vasos de metal, dieron en tus ferias», y al final de Isaías el Señor enviará supervivientes a las naciones, «á Tubal y á Javán, á las islas apartadas que no oyeron de mí». La Biblia sinodal escribe el nombre Иаван en Ezequiel y Яван en Isaías."
    - "Otros textos del Antiguo Oriente Próximo usan el mismo nombre. Inscripciones asirias del siglo VIII a. C. hablan de los Yamnaya, jonios que llegaban por mar, y los reyes persas enumeran a los Yauna entre sus pueblos sometidos. En Daniel la misma palabra hebrea se convierte en el reino de Grecia; esa historia más amplia se cuenta en el artículo de Grecia."
  pt:
    - "Javã é o nome hebraico dos gregos, tomado dos jônios, os gregos da costa egeia da Ásia Menor que os povos do Levante encontraram primeiro; a tabela das nações faz de Javã um filho de Jafé. O mapa a põe na Jônia, na costa da Anatólia ocidental. Duas passagens a nomeiam como terra distante: o lamento de Ezequiel sobre Tiro lista entre seus parceiros comerciais “Javã, Tubal e Meseque eram os seus comerciantes. Eles trocavam vidas humanas e utensílios de bronze pelas suas mercadorias”, e no fim de Isaías o Senhor enviará sobreviventes às nações, “a Tubal e Javã, às ilhas distantes, que não ouviram da minha fama”. A Bíblia Sinodal escreve o nome Иаван em Ezequiel e Яван em Isaías."
    - "Outros textos do antigo Oriente Próximo usam o mesmo nome. Inscrições assírias do século VIII a.C. falam dos Yamnaya, jônios que vinham pelo mar, e os reis persas listam os Yauna entre seus povos súditos. Em Daniel, a mesma palavra hebraica torna-se o reino da Grécia; essa história mais ampla é contada sob Grécia."
  de:
    - "Jawan ist der hebräische Name für die Griechen, von den Ioniern genommen, den Griechen der ägäischen Küste Kleinasiens, denen die Völker der Levante zuerst begegneten; die Völkertafel macht Jawan zu einem Sohn Jafets. Die Karte setzt es nach Ionien an der Küste Westanatoliens. Zwei Stellen nennen es als fernes Land: Hesekiels Klage über Tyrus führt unter ihren Handelspartnern auf: „Javan, Thubal und Mesech haben mit dir gehandelt und haben dir leibeigene Leute und Geräte von Erz auf deine Märkte gebracht“, und am Ende des Jesaja sendet der Herr Gerettete zu den Völkern, „gen Thubal und Javan und in die Ferne zu den Inseln, da man nichts von mir gehört hat“. Die Synodalübersetzung schreibt den Namen Иаван bei Hesekiel und Яван bei Jesaja."
    - "Andere altorientalische Texte gebrauchen denselben Namen. Assyrische Inschriften des 8. Jahrhunderts v. Chr. sprechen von den Yamnaya, Ioniern, die über das Meer kamen, und die persischen Könige führen die Jauna unter ihren unterworfenen Völkern auf. Bei Daniel wird dasselbe hebräische Wort zum Königreich Griechenland; diese weitere Geschichte wird unter Griechenland erzählt."
  fr:
    - "Javan est le nom hébreu des Grecs, tiré des Ioniens, les Grecs de la côte égéenne de l’Asie Mineure que les peuples du Levant rencontrèrent les premiers ; la table des nations fait de Javan un fils de Japhet. La carte le place en Ionie, sur la côte de l’Anatolie occidentale. Deux passages le nomment comme un pays lointain : la lamentation d’Ézéchiel sur Tyr énumère parmi ses partenaires commerciaux : « Javan, Tubal et Méschec trafiquaient avec toi ; ils donnaient des esclaves et des ustensiles d’airain en échange de tes marchandises », et à la fin d’Ésaïe l’Éternel enverra des réchappés vers les nations, « à Tubal et à Javan, aux îles lointaines, qui jamais n’ont entendu parler de moi, et qui n’ont pas vu ma gloire ». La Bible synodale écrit le nom Иаван chez Ézéchiel et Яван chez Ésaïe."
    - "D’autres textes du Proche-Orient ancien emploient le même nom. Des inscriptions assyriennes du VIIIe siècle av. J.-C. parlent des Yamnaya, Ioniens venus par mer, et les rois perses énumèrent les Yauna parmi leurs peuples sujets. Chez Daniel, le même mot hébreu devient le royaume de Grèce ; cette histoire plus large est racontée sous Grèce."
