body:
  en:
    - "Jokneam was a Canaanite city at the foot of Mount Carmel, on the south-western edge of the valley of Jezreel, where the pass of the Wadi Milh leads through the Carmel ridge to the coast. The site is Tel Yokneam, a steep mound beside the modern town, whose Arabic name Tell Qeimun is thought to derive from the old one, and the lists of Thutmose III at Karnak already record it in the fifteenth century BC. Joshua counts “the king of Jokneam of Carmel” among the thirty-one kings beaten west of the Jordan; the border of Zebulun ran to “the river that is before Jokneam”, the brook that drains the valley toward the Kishon; and the town was given to the Levites of Merari out of Zebulun. The parallel list of Chronicles does not name it, giving Rimmon and Tabor for Zebulun. The Jokmeam of Solomon's districts, spelt Jokneam in the King James Version, is a different town, in the Jordan valley."
    - "Amnon Ben-Tor's excavations for the Hebrew University in 1977–1988 traced the city from the Middle Bronze Age, when a wall and glacis defended it, through a Late Bronze town destroyed about 1200 BC, an Iron Age town with a double wall of the ninth century, and Persian, Hellenistic, Roman and Byzantine occupation, to a Crusader fortress, Caymont, and Mamluk and Ottoman remains: more than twenty strata, one of the longest sequences in the country."
    - "Today Yokneam Illit, a town known for its technology companies, stands beside the mound, and Tel Yokneam is a landscaped site at the mouth of the pass, with Highway 70 running through the pass below it."
  ru:
    - "Иокнеам — ханаанский город у подножия Кармила, на юго-западном краю долины Изреельской, где проход Вади-Мильх ведёт через Кармильский хребет к побережью. Это Тель-Йокнеам, крутой холм рядом с нынешним городом, арабское имя которого, Телль-Кеймун, как полагают, происходит от древнего, и списки Тутмоса III в Карнаке уже называют его в XV веке до н. э. Иисус Навин считает царя «Иокнеама при Кармиле» среди тридцати одного царя, разбитого к западу от Иордана; предел Завулона доходил до потока, «который пред Иокнеамом», ручья, стекающего по долине к Киссону; и город был отдан левитам из рода Мерари от колена Завулонова. Параллельный список Паралипоменона его не называет, давая от Завулона Риммон и Фавор. Иокмеам из округов Соломона — другой город, в долине Иордана."
    - "Раскопки Амнона Бен-Тора для Еврейского университета в 1977–1988 годах проследили город от средней бронзы, когда его защищали стена и гласис, через город поздней бронзы, разрушенный около 1200 года до н. э., город железного века с двойной стеной IX века, персидское, эллинистическое, римское и византийское заселение до крестоносной крепости Каймон и остатков мамлюкского и османского времени: более двадцати слоёв, одна из самых длинных последовательностей в стране."
    - "Сегодня рядом с холмом стоит Йокнеам-Илит, город, известный своими технологическими компаниями, а Тель-Йокнеам — благоустроенный памятник у входа в проход, через который под ним идёт шоссе 70."
  uk:
    - "Йокнеам був ханаанським містом біля підніжжя гори Кармель, на південно-західному краю долини Їзреель, де прохід Ваді-Мілх веде крізь хребет Кармелю до узбережжя. Місце — Тель-Йокнеам, стрімке городище біля сучасного міста, чия арабська назва Телль-Кеймун, як вважають, походить від давньої, і переліки Тутмоса III у Карнаку вже записують його в XV ст. до н. е. У переліку тридцяти одного царя, розбитих на захід від Йордану, Книга Ісуса Навина має «царь Йокнеамський коло Кармиля, один»; межа Завулона впиралася в «річку, що перед Йокнеамом», потоку, що відводить воду долини до Кішону; а місто дали левітам Мерарі з Завулона. Паралельний перелік Хронік його не називає, даючи для Завулона Риммон і Фавор. Йокмеам з округ Соломона, у перекладі короля Якова пишеться Йокнеам, — інше місто, в Йорданській долині."
    - "Розкопки Амнона Бен-Тора для Єврейського університету в 1977–1988 роках простежили місто від середнього бронзового віку, коли його захищали мур і гласис, через місто пізнього бронзового віку, зруйноване близько 1200 р. до н. е., місто залізного віку з подвійним муром IX ст., та перське, елліністичне, римське й візантійське заселення, до хрестоносної фортеці Кеймон, мамлюцьких і османських решток: понад двадцять шарів, одна з найдовших послідовностей у краї."
    - "Сьогодні Йокнеам-Ілліт, місто, відоме технологічними компаніями, стоїть біля городища, а Тель-Йокнеам — упорядкована пам’ятка при вході в прохід, з шосе 70, що йде проходом під ним."
  es:
    - "Jocneam era una ciudad cananea al pie del monte Carmelo, en el borde suroccidental del valle de Jezreel, donde el paso del Wadi Milh cruza la cordillera del Carmelo hacia la costa. El sitio es Tel Yokneam, montículo empinado junto a la ciudad moderna, cuyo nombre árabe Tell Qeimun se cree derivado del antiguo, y las listas de Tutmosis III en Karnak ya la registran en el siglo XV a. C. Josué cuenta a «el rey de Jocneam de Carmel» entre los treinta y un reyes vencidos al oeste del Jordán; la frontera de Zabulón llegaba «al arroyo que está delante de Jocneam», que drena el valle hacia el Cisón; y fue dada a los levitas de Merari, de la tribu de Zabulón. La lista paralela de Crónicas no la nombra, y da Rimón y Tabor para Zabulón. El Jocmeam de los distritos de Salomón, escrito Jokneam en la versión del rey Jacobo (King James), es otra población, en el valle del Jordán."
    - "Las excavaciones de Amnon Ben-Tor para la Universidad Hebrea en 1977–1988 trazaron la ciudad desde la Edad del Bronce Medio, cuando la defendían un muro y un glacis, pasando por una población del Bronce Final destruida hacia el 1200 a. C., una población de la Edad del Hierro con un muro doble del siglo IX, y la ocupación persa, helenística, romana y bizantina, hasta una fortaleza cruzada, Caymont, y restos mamelucos y otomanos: más de veinte estratos, una de las secuencias más largas del país."
    - "Hoy Yokneam Illit, ciudad conocida por sus empresas tecnológicas, se alza junto al montículo, y Tel Yokneam es un sitio ajardinado a la entrada del paso, con la carretera 70 corriendo por el paso, bajo él."
  pt:
    - "Jocneão era uma cidade cananeia ao pé do monte Carmelo, na borda sudoeste do vale de Jezreel, onde a passagem do uádi Milh leva através da crista do Carmelo à costa. O sítio é Tel Yokneam, um monte íngreme junto à cidade moderna, cujo nome árabe Tell Qeimun se julga derivar do antigo, e as listas de Tutmés III em Karnak já a registram no século XV a.C. Josué conta “o rei de Jocneão, no Carmelo” entre os trinta e um reis derrotados a oeste do Jordão; a fronteira de Zebulom corria até “ao ribeiro que está em frente a Jocneão”, o riacho que drena o vale em direção ao Quisom; e a cidade foi dada aos levitas de Merari, da parte de Zebulom. A lista paralela de Crônicas não a nomeia, dando Rimom e Tabor para Zebulom. O Jocmeão dos distritos de Salomão, grafado Jocneão na Versão King James, é outra cidade, no vale do Jordão."
    - "As escavações de Amnon Ben-Tor para a Universidade Hebraica em 1977–1988 traçaram a cidade desde o Bronze Médio, quando uma muralha e um glacis a defendiam, passando por uma cidade do Bronze Tardio destruída por volta de 1200 a.C., uma cidade da Idade do Ferro com muralha dupla do século IX e ocupação persa, helenística, romana e bizantina, até uma fortaleza cruzada, Caymont, e restos mamelucos e otomanos: mais de vinte estratos, uma das mais longas sequências do país."
    - "Hoje Yokneam Illit, cidade conhecida por suas empresas de tecnologia, fica junto ao monte, e Tel Yokneam é um sítio paisagístico na boca da passagem, com a Rodovia 70 correndo pela passagem abaixo dele."
  de:
    - "Jokneam war eine kanaanitische Stadt am Fuß des Karmel, am südwestlichen Rand des Jesreeltals, wo der Pass des Wadi Milh durch den Karmelrücken zur Küste führt. Die Stätte ist Tel Jokneam, ein steiler Hügel neben der modernen Stadt, dessen arabischer Name Tell Qeimun vermutlich vom alten abgeleitet ist; die Listen Thutmosis' III. in Karnak verzeichnen sie schon im 15. Jahrhundert v. Chr. Josua zählt „der König zu Jokneam am Karmel“ zu den einunddreißig westlich des Jordan besiegten Königen; die Grenze Sebulons reichte bis an „den Bach, der vor Jokneam fließt“, der das Tal zum Kischon entwässert; und die Stadt wurde den Leviten von Merari aus Sebulon gegeben. Die Parallelliste der Chronik nennt sie nicht, sondern gibt Rimmon und Tabor für Sebulon. Das Jokmeam von Salomos Bezirken, in der King-James-Bibel Jokneam geschrieben, ist eine andere Stadt im Jordantal."
    - "Amnon Ben-Tors Grabungen für die Hebräische Universität 1977–1988 verfolgten die Stadt von der Mittelbronzezeit, als Mauer und Glacis sie schützten, über eine um 1200 v. Chr. zerstörte spätbronzezeitliche Stadt, eine eisenzeitliche Stadt mit Doppelmauer des 9. Jahrhunderts und persische, hellenistische, römische und byzantinische Besiedlung bis zu einer Kreuzfahrerfestung, Caymont, und mamlukischen und osmanischen Resten: mehr als zwanzig Schichten, eine der längsten Abfolgen des Landes."
    - "Heute steht Jokneam Illit, eine für seine Technologiefirmen bekannte Stadt, neben dem Hügel, und Tel Jokneam ist ein gestalteter Ort an der Mündung des Passes, mit der Straße 70, die unterhalb davon durch den Pass führt."
  fr:
    - "Jokneam était une ville cananéenne au pied du Carmel, au sud-ouest de la vallée de Jizreel, où le défilé de l’oued Milh traverse la crête du Carmel vers la côte. Le site est Tel Yokneam, tertre abrupt près de la ville moderne, dont le nom arabe Tell Qeimun dériverait, pense-t-on, de l’ancien ; les listes de Thoutmosis III à Karnak la citent déjà au XVe siècle av. J.-C. Josué compte « le roi de Jokneam, au Carmel » parmi les trente et un rois battus à l’ouest du Jourdain ; la frontière de Zabulon allait au « torrent qui coule devant Jokneam », qui draine la vallée vers le Kison ; la ville fut donnée aux Lévites de Merari. La liste parallèle des Chroniques l’omet, donnant Rimmono et Thabor. Le Jokméam des districts de Salomon, écrit Jokneam dans la version King James, est une autre ville, dans la vallée du Jourdain."
    - "Les fouilles d’Amnon Ben-Tor pour l’Université hébraïque en 1977–1988 ont suivi la ville depuis le Bronze moyen, quand un mur et un glacis la défendaient, par une ville du Bronze récent détruite vers 1200 av. J.-C., une ville de l’âge du Fer à double mur du IXe siècle, et l’occupation perse, hellénistique, romaine et byzantine, jusqu’à une forteresse croisée, Caymont, et des vestiges mamelouks et ottomans : plus de vingt strates, l’une des plus longues séquences du pays."
    - "Aujourd’hui, Yokneam Illit, ville connue pour ses entreprises technologiques, se dresse à côté du tertre, et Tel Yokneam est un site aménagé à l’entrée du défilé, la route 70 passant dans le défilé en contrebas."
  pl:
    - "Jokneam było kananejskim miastem u stóp Karmelu, na południowo-zachodnim skraju doliny Jizreel, gdzie przełęcz Wadi Milh prowadzi przez grzbiet Karmelu do wybrzeża. Miejscem jest Tel Jokneam, stromy pagórek obok współczesnego miasta, którego arabska nazwa Tell Kajmun wywodzi się, jak się sądzi, od dawnej, a wykazy Totmesa III w Karnaku już je zapisują w XV w. p.n.e. Jozue zalicza króla Jokneam z Karmelu do trzydziestu jeden królów pokonanych na zachód od Jordanu; granica Zabulona biegła do „potoku, który jest przeciw Jeknoam”, strumienia odwadniającego dolinę ku Kiszonowi; a miasto oddano lewitom z rodu Merariego z Zabulona. Odpowiedni wykaz w Księgach Kronik go nie wymienia, podając dla Zabulona Rimmon i Tabor. Jokmeam z okręgów Salomona, w Biblii Króla Jakuba pisane Jokneam, to inne miasto, w dolinie Jordanu."
    - "Wykopaliska Amnona Ben-Tora dla Uniwersytetu Hebrajskiego w latach 1977–1988 prześledziły miasto od środkowej epoki brązu, gdy broniły go mur i glacis, przez miasto z późnej epoki brązu zniszczone około 1200 r. p.n.e., miasto z epoki żelaza z podwójnym murem z IX w., osadnictwo perskie, hellenistyczne, rzymskie i bizantyńskie, aż po krzyżowcką twierdzę Caymont oraz pozostałości mameluckie i osmańskie: ponad dwadzieścia warstw, jedna z najdłuższych sekwencji w kraju."
    - "Dziś obok pagórka stoi Jokneam Illit, miasto znane z firm technologicznych, a Tel Jokneam jest uporządkowanym stanowiskiem u wylotu przełęczy, z drogą nr 70 biegnącą przez przełęcz poniżej."
  it:
    - "Iokneam era una città cananea ai piedi del Monte Carmelo, al margine sud-occidentale della valle di Izreel, dove il passo del Wadi Milh attraversa la dorsale del Carmelo verso la costa. Il sito è Tel Yokneam, un ripido tell accanto alla città moderna, il cui nome arabo Tell Qeimun si ritiene derivi da quello antico, e gli elenchi di Tutmosi III a Karnak già la registrano nel XV secolo a.C. Giosuè annovera «il re di Iokneam al Carmelo» fra i trentuno re battuti a ovest del Giordano; il confine di Zabulon giungeva «al torrente che scorre di faccia a Iokneam», il ruscello che drena la valle verso il Kison; e la città fu data ai Leviti di Merari da Zabulon. L’elenco parallelo delle Cronache non la nomina, dando Rimmon e Tabor per Zabulon. L’Iokmeam dei distretti di Salomone, scritta Jokneam nella King James Version, è una città diversa, nella valle del Giordano."
    - "Gli scavi di Amnon Ben-Tor per l’Università Ebraica nel 1977–1988 hanno tracciato la storia della città dal Bronzo Medio, quando la difendevano un muro e un terrapieno inclinato, attraverso una città del Bronzo Tardo distrutta verso il 1200 a.C., una città dell’età del Ferro con un doppio muro del IX secolo, e l’occupazione persiana, ellenistica, romana e bizantina, fino a una fortezza crociata, Caymont, e a resti mamelucchi e ottomani: più di venti strati, una delle sequenze più lunghe del paese."
    - "Oggi Yokneam Illit, città nota per le sue aziende tecnologiche, sorge accanto al tell, e Tel Yokneam è un sito sistemato a verde all’imbocco del passo, con la Strada 70 che corre nel passo sotto di esso."
  nl:
    - "Jokneam was een Kanaänitische stad aan de voet van de Karmel, aan de zuidwestelijke rand van de vallei van Jizreël, waar de pas van de Wadi Milh door de Karmelrug naar de kust loopt. De plaats is Tel Yokneam, een steile heuvel naast de moderne stad, wier Arabische naam Tell Qeimun vermoedelijk van de oude is afgeleid, en de lijsten van Thoetmosis III te Karnak vermelden haar al in de 15e eeuw v.Chr. Jozua telt “de koning van Jokneam, aan den Karmel” onder de 31 verslagen koningen ten westen van de Jordaan; de grens van Zebulon liep tot “de beek, die voor aan Jokneam is”, de beek die naar de Kison afwatert; en de stad werd uit Zebulon aan de Levieten van Merari gegeven. De parallelle lijst van Kronieken noemt haar niet en geeft Rimmono en Thabor voor Zebulon. Het Jokmeam uit Salomo’s districten, in de King James Version Jokneam gespeld, is een andere stad, in het Jordaandal."
    - "De opgravingen van Amnon Ben-Tor voor de Hebreeuwse Universiteit in 1977–1988 volgden de stad vanaf de Midden-Bronstijd, toen een muur en glacis haar verdedigden, via een stad uit de Late Bronstijd die omstreeks 1200 v.Chr. werd verwoest, een IJzertijdstad met een dubbele muur uit de 9e eeuw, en Perzische, hellenistische, Romeinse en Byzantijnse bewoning, tot een kruisvaardersvesting, Caymont, en Mamlukse en Ottomaanse resten: meer dan twintig lagen, een van de langste reeksen van het land."
    - "Nu staat Yokneam Illit, een stad bekend om zijn technologiebedrijven, naast de heuvel, en Tel Yokneam is een aangelegd terrein aan de mond van de pas, met Highway 70 die eronder door de pas loopt."
  cs:
    - "Jokneam bylo kanaánské město na úpatí Karmelu, na jihozápadním okraji Jizreelského údolí, kde průsmyk Wádí Milh vede hřebenem Karmelu k pobřeží. Místem je Tel Jokneam, strmý pahorek vedle moderního města, jehož arabské jméno Tell Qejmún se pokládá za odvozené od starého, a seznamy Thutmose III. v Karnaku je zaznamenávají již v 15. stol. př. n. l. Jozue počítá „král Jekonam z Karmelu jeden“ mezi jednatřicet králů poražených západně od Jordánu; hranice Zebulunu vedla k „potoku, kterýž jest proti Jekonam“, potoku odvádějícímu údolí ke Kíšonu; a město bylo dáno levitům z Merari z území Zebulunu. Paralelní seznam v Letopisech je nejmenuje a uvádí pro Zebulun Rimmon a Tábor. Jokmeam z Šalomounových okresů, v Bibli krále Jakuba psaný Jokneam, je jiné město, v Jordánském údolí."
    - "Vykopávky Amnóna Ben-Tora pro Hebrejskou univerzitu v letech 1977–1988 vystopovaly město od střední doby bronzové, kdy je bránila hradba a glacis, přes město z pozdní doby bronzové zničené kolem roku 1200 př. n. l., město doby železné s dvojitou hradbou z 9. století, a perské, helénistické, římské a byzantské osídlení až ke křižácké pevnosti Caymont a mamlúckým a osmanským zbytkům: více než dvacet vrstev, jedna z nejdelších posloupností v zemi."
    - "Dnes vedle pahorku stojí Jokneam Ilit, město známé technologickými firmami, a Tel Jokneam je upravené místo u ústí průsmyku, s dálnicí č. 70 vedoucí pod ním průsmykem."
  sv:
    - "Jokneam var en kanaaneisk stad vid foten av Karmel, i sydvästra utkanten av Jisreeldalen, där passet i Wadi Milh leder genom Karmelåsen ut mot kusten. Platsen är Tel Yokneam, en brant kulle intill den moderna staden, vars arabiska namn Tell Qeimun anses härröra från det gamla, och Thutmosis III:s listor i Karnak upptar den redan på 1400-talet f.Kr. Josua räknar ”konungen i Jokneam vid Karmel” bland de trettioen konungar som besegrades väster om Jordan; Sebulons gräns gick till ”dalen som ligger gent emot Jokneam”, den bäck som avvattnar dalen mot Kishon; och staden gavs ur Sebulon åt Meraris leviter. Krönikeböckernas parallella förteckning nämner den inte utan anger Rimmon och Tabor för Sebulon. Jokmeam bland Salomos distrikt, som stavas Jokneam i King James Version, är en annan stad, i Jordandalen."
    - "Amnon Ben-Tors utgrävningar för Hebreiska universitetet 1977–1988 följde staden från mellersta bronsåldern, då en mur och en glacis försvarade den, över en stad från yngre bronsåldern som förstördes omkring 1200 f.Kr., en järnåldersstad med dubbel mur från 800-talet f.Kr. samt persisk, hellenistisk, romersk och bysantinsk bebyggelse, till en korsfararfästning, Caymont, och mamlukiska och osmanska lämningar: mer än tjugo kulturlager, en av de längsta lagerföljderna i landet."
    - "I dag ligger Yokneam Illit, en stad känd för sina teknikföretag, intill kullen, och Tel Yokneam är en iordningställd plats vid passets mynning, med väg 70 som går genom passet nedanför."
  nb:
    - "Jokneam var en kanaanittisk by ved foten av Karmel, på den sørvestlige kanten av Jisreel-dalen, der passet ved Wadi Milh fører gjennom Karmel-ryggen ned til kysten. Stedet er Tel Yokneam, en bratt haug ved siden av dagens by, hvis arabiske navn Tell Qeimun antas å stamme fra det gamle, og listene til Thutmosis III i Karnak oppfører den allerede på 1400-tallet f.Kr. Josva regner «kongen i Jokneam ved Karmel» blant de en og tretti kongene som ble slått vest for Jordan; Sebulons grense gikk til «den bekk som løper østenfor Jokneam», bekken som leder vannet fra dalen mot Kisjon; og byen ble gitt til Meraris levitter av Sebulons stamme. Den parallelle listen i Krønikebøkene nevner den ikke, men oppgir Rimmon og Tabor for Sebulon. Jokmeam i Salomos distrikter, som i King James-oversettelsen skrives Jokneam, er en annen by, i Jordandalen."
    - "Amnon Ben-Tors utgravninger for Det hebraiske universitet i 1977–1988 fulgte byen fra mellombronsealderen, da en mur og et glasis forsvarte den, gjennom en by fra sen bronsealder som ble ødelagt omkring 1200 f.Kr., en jernalderby med dobbeltmur fra 800-tallet f.Kr., og persisk, hellenistisk, romersk og bysantinsk bosetning, til en korsfarerfestning, Caymont, og mamelukkiske og osmanske levninger: mer enn tjue lag, en av de lengste lagrekkene i landet."
    - "I dag ligger Yokneam Illit, en by kjent for sine teknologiselskaper, ved siden av haugen, og Tel Yokneam er et opparbeidet område ved munningen av passet, med vei 70 som går gjennom passet nedenfor."
  tl:
    - "Jocneam: lungsod ng mga Cananeo sa paanan ng Bundok Carmelo, sa timog-kanlurang gilid ng libis ng Jezreel, kung saan tumatagos ang daanan ng Wadi Milh sa tagaytay ng Carmelo tungo sa baybayin. Ito ang Tel Yokneam, matarik na burol sa tabi ng makabagong bayan, na ang pangalang Arabe, Tell Qeimun, ay pinaniniwalaang hango sa luma; nakatala na ito sa mga talaan ni Thutmose III sa Karnak noong ika-15 siglo BK. Ibinibilang ni Josue ang “hari sa Jocneam sa Carmel” sa 31 haring nagapi sa kanluran ng Jordan; ang hangganan ng Zabulon ay umabot sa “batis na nasa harap ng Jocneam”, ang sapang umaagos mula sa libis patungong Cison; at ibinigay ito sa mga Levita ni Merari mula sa Zabulon. Wala ito sa kahawig na talaan sa Mga Cronica, na may Rimmon at Thabor para sa Zabulon. Ibang bayan, sa libis ng Jordan, ang Jocmeam sa mga distrito ni Salomon, na Jokneam sa King James Version."
    - "Ang mga paghuhukay ni Amnon Ben-Tor para sa Hebrew University noong 1977–1988 ay nagsubaybay sa lungsod mula sa Gitnang Panahon ng Tanso, nang ipagtanggol ito ng pader at glacis, sa pamamagitan ng bayan ng Huling Panahon ng Tanso na winasak noong mga 1200 BK, bayan ng Panahon ng Bakal na may dobleng pader noong ika-9 na siglo, at ng pananahan ng mga Persiano, Helenistiko, Romano at Bizantino, hanggang sa isang kutang Krusado, ang Caymont, at mga labi ng mga Mameluko at Otomano: mahigit dalawampung patong, isa sa pinakamahabang sunud-sunod sa bansa."
    - "Sa ngayon, ang Yokneam Illit, bayang kilala sa mga kompanya nito sa teknolohiya, ay nakatayo sa tabi ng burol, at ang Tel Yokneam ay isang pook na may landscaping sa bunganga ng daanan, kung saan ang Highway 70 ay dumaraan sa ilalim nito."
  da:
    - "Jokneam var en kanaanæisk by ved foden af Karmel, i den sydvestlige udkant af Jizre'el-dalen, hvor passet i Wadi Milh fører gennem Karmelkæden ned til kysten. Stedet er Tel Yokneam, en stejl banke ved siden af den nuværende by, hvis arabiske navn Tell Qeimun menes at stamme fra det gamle, og Thutmosis III's lister i Karnak nævner den allerede i 1400-tallet f.Kr. Josva regner »Kongen af Jokneam ved Karmel« blandt de enogtredive konger, der blev slået vest for Jordan; Zebulons grænse gik til »Bækken, som er lige for Jokneam«, åen, der afvander dalen mod Kisjon; og byen blev givet til Meraris leviter af Zebulon. Krønikebøgernes parallelle liste nævner den ikke, men giver Rimmon og Tabor for Zebulon. Jokme'am i Salomons distrikter, der staves Jokneam i King James-oversættelsen, er en anden by, i Jordandalen."
    - "Amnon Ben-Tors udgravninger for Det Hebraiske Universitet i 1977–1988 fulgte byen fra mellembronzealderen, da en mur og et glacis forsvarede den, gennem en by fra senbronzealderen, ødelagt omkring 1200 f.Kr., og en jernalderby med dobbelt mur fra 800-tallet f.Kr., til persisk, hellenistisk, romersk og byzantinsk bosættelse, en korsfarerborg, Caymont, og mamelukkiske og osmanniske levn: mere end tyve lag, en af de længste lagfølger i landet."
    - "I dag ligger Yokneam Illit, en by kendt for sine teknologivirksomheder, ved siden af banken, og Tel Yokneam er et anlagt område ved passets munding, hvor landevej 70 løber gennem passet nedenfor."
  sr:
    - "Јокнеам је био ханаански град у подножју Кармила, на југозападном ободу Језраелске долине, где кроз кармилски гребен ка обали води кланац Вадија Милх. Налазиште је Тел Јокнеам, стрмо узвишење поред савременог града, чије се арапско име Тел Кајмун сматра изведеним од старог, а спискови Тутмоса III у Карнаку већ га бележе у XV веку п. н. е. Исус Навин убраја „цара јокнеамског код Кармела“ међу тридесет и једног цара побеђеног западно од Јордана; међа Завулонова ишла је „на поток који је према Јокнеаму“, водоток који одводи долину ка Кисону; а град је дат левитима из породице Мерарије од племена Завулоновог. Паралелни списак у Дневницима га не помиње, већ за Завулона наводи Римон и Тавор. Јокмеам из Соломунових округа, у Библији краља Џејмса писан као Јокнеам, други је град, у долини Јордана."
    - "Ископавања Амнона Бен-Тора за Хебрејски универзитет 1977–1988. пратила су град од средњег бронзаног доба, када су га бранили зид и гласис, преко града касног бронзаног доба, уништеног око 1200. п. н. е., и града гвозденог доба с двоструким бедемом из IX века, те персијског, хеленистичког, римског и византијског насељавања, до крсташке тврђаве Кајмон и мамелучких и османских остатака: више од двадесет слојева, један од најдужих низова у земљи."
    - "Данас поред узвишења стоји Јокнеам Илит, град познат по технолошким компанијама, а Тел Јокнеам је уређено налазиште на излазу из кланца, испод ког пролази магистрални пут 70."
