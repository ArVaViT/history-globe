# Overview article (ADR 0007). Mainstream facts only; the Chronicles verse that names Rimmon and Tabor is reported with the Greek reading; the Jokmeam of 1 Kings 4 is kept apart.
id: jokneam
place: a5c92e1
title:
  en: "Jokneam"
  ru: "Иокнеам"
body:
  en:
    - "Jokneam was a Canaanite city at the foot of Mount Carmel, on the south-western edge of the valley of Jezreel, where the pass of the Wadi Milh leads through the Carmel ridge to the coast. The site is Tel Yokneam, a steep mound beside the modern town, whose Arabic name Tell Qeimun kept the old one, and the lists of Thutmose III at Karnak already record it in the fifteenth century BC. Joshua counts “the king of Jokneam of Carmel” among the thirty-one kings beaten west of the Jordan; the border of Zebulun ran to “the river that is before Jokneam”, the brook that drains the valley toward the Kishon; and the town was given to the Levites of Merari out of Zebulun. The parallel list of Chronicles does not name it, giving Rimmon and Tabor for Zebulun. The Jokmeam of Solomon's districts, spelt Jokneam in the King James Version, is a different town, in the Jordan valley."
    - "Amnon Ben-Tor's excavations for the Hebrew University in 1977–1988 traced the city from the Middle Bronze Age, when a wall and glacis defended it, through a Late Bronze town destroyed about 1200 BC, an Iron Age town with a double wall of the ninth century, and Persian, Hellenistic, Roman and Byzantine occupation, to a Crusader fortress, Caymont, and Mamluk and Ottoman remains: more than twenty strata, one of the longest sequences in the country."
    - "Today Yokneam Illit, a town known for its technology companies, stands beside the mound, and Tel Yokneam is a landscaped site at the mouth of the pass, with Highway 70 running through the pass below it."
  ru:
    - "Иокнеам — ханаанский город у подножия Кармила, на юго-западном краю долины Изреельской, где проход Вади-Мильх ведёт через Кармильский хребет к побережью. Это Тель-Йокнеам, крутой холм рядом с нынешним городом, арабское имя которого, Телль-Кеймун, сохранило древнее, и списки Тутмоса III в Карнаке уже называют его в XV веке до н. э. Иисус Навин считает царя «Иокнеама при Кармиле» среди тридцати одного царя, разбитого к западу от Иордана; предел Завулона доходил до потока, «который пред Иокнеамом», ручья, стекающего по долине к Киссону; и город был отдан левитам из рода Мерари от колена Завулонова. Параллельный список Паралипоменона его не называет, давая от Завулона Риммон и Фавор. Иокмеам из округов Соломона — другой город, в долине Иордана."
    - "Раскопки Амнона Бен-Тора для Еврейского университета в 1977–1988 годах проследили город от средней бронзы, когда его защищали стена и гласис, через город поздней бронзы, разрушенный около 1200 года до н. э., город железного века с двойной стеной IX века, персидское, эллинистическое, римское и византийское заселение до крестоносной крепости Каймон и остатков мамлюкского и османского времени: более двадцати слоёв, одна из самых длинных последовательностей в стране."
    - "Сегодня рядом с холмом стоит Йокнеам-Илит, город, известный своими технологическими компаниями, а Тель-Йокнеам — благоустроенный памятник у входа в проход, через который под ним идёт шоссе 70."
