# Overview article (ADR 0007). Mainstream facts only; the Chronicles verse that names Rimmon and Tabor is reported with the Greek reading; the Jokmeam of 1 Kings 4 is kept apart.
id: jokneam
place: a5c92e1
title:
  en: "Jokneam"
  ru: "Иокнеам"
  uk: "Йокнеам"
  es: "Jocneam"
  pt: "Jocneão"
  de: "Jokneam"
  fr: "Jokneam"
body:
  en:
    - "Jokneam was a Canaanite city at the foot of Mount Carmel, on the south-western edge of the valley of Jezreel, where the pass of the Wadi Milh leads through the Carmel ridge to the coast. The site is Tel Yokneam, a steep mound beside the modern town, whose Arabic name Tell Qeimun kept the old one, and the lists of Thutmose III at Karnak already record it in the fifteenth century BC. Joshua counts “the king of Jokneam of Carmel” among the thirty-one kings beaten west of the Jordan; the border of Zebulun ran to “the river that is before Jokneam”, the brook that drains the valley toward the Kishon; and the town was given to the Levites of Merari out of Zebulun. The parallel list of Chronicles does not name it, giving Rimmon and Tabor for Zebulun. The Jokmeam of Solomon's districts, spelt Jokneam in the King James Version, is a different town, in the Jordan valley."
    - "Amnon Ben-Tor's excavations for the Hebrew University in 1977–1988 traced the city from the Middle Bronze Age, when a wall and glacis defended it, through a Late Bronze town destroyed about 1200 BC, an Iron Age town with a double wall of the ninth century, and Persian, Hellenistic, Roman and Byzantine occupation, to a Crusader fortress, Caymont, and Mamluk and Ottoman remains: more than twenty strata, one of the longest sequences in the country."
    - "Today Yokneam Illit, a town known for its technology companies, stands beside the mound, and Tel Yokneam is a landscaped site at the mouth of the pass, with Highway 70 running through the pass below it."
  ru:
    - "Иокнеам — ханаанский город у подножия Кармила, на юго-западном краю долины Изреельской, где проход Вади-Мильх ведёт через Кармильский хребет к побережью. Это Тель-Йокнеам, крутой холм рядом с нынешним городом, арабское имя которого, Телль-Кеймун, сохранило древнее, и списки Тутмоса III в Карнаке уже называют его в XV веке до н. э. Иисус Навин считает царя «Иокнеама при Кармиле» среди тридцати одного царя, разбитого к западу от Иордана; предел Завулона доходил до потока, «который пред Иокнеамом», ручья, стекающего по долине к Киссону; и город был отдан левитам из рода Мерари от колена Завулонова. Параллельный список Паралипоменона его не называет, давая от Завулона Риммон и Фавор. Иокмеам из округов Соломона — другой город, в долине Иордана."
    - "Раскопки Амнона Бен-Тора для Еврейского университета в 1977–1988 годах проследили город от средней бронзы, когда его защищали стена и гласис, через город поздней бронзы, разрушенный около 1200 года до н. э., город железного века с двойной стеной IX века, персидское, эллинистическое, римское и византийское заселение до крестоносной крепости Каймон и остатков мамлюкского и османского времени: более двадцати слоёв, одна из самых длинных последовательностей в стране."
    - "Сегодня рядом с холмом стоит Йокнеам-Илит, город, известный своими технологическими компаниями, а Тель-Йокнеам — благоустроенный памятник у входа в проход, через который под ним идёт шоссе 70."
  uk:
    - "Йокнеам був ханаанським містом біля підніжжя гори Кармель, на південно-західному краю долини Їзреель, де прохід Ваді-Мілх веде крізь хребет Кармелю до узбережжя. Місце — Тель-Йокнеам, стрімке городище біля сучасного міста, чия арабська назва Телль-Кеймун зберегла давню, і переліки Тутмоса III у Карнаку вже записують його в XV ст. до н. е. У переліку тридцяти одного царя, розбитих на захід від Йордану, Книга Ісуса Навина має «царь Йокнеамський коло Кармиля, один»; межа Завулона впиралася в «річку, що перед Йокнеамом», потоку, що відводить воду долини до Кішону; а місто дали левітам Мерарі з Завулона. Паралельний перелік Хронік його не називає, даючи для Завулона Риммон і Фавор. Йокмеам з округ Соломона, у перекладі короля Якова пишеться Йокнеам, — інше місто, в Йорданській долині."
    - "Розкопки Амнона Бен-Тора для Єврейського університету в 1977–1988 роках простежили місто від середнього бронзового віку, коли його захищали мур і гласис, через місто пізнього бронзового віку, зруйноване близько 1200 р. до н. е., місто залізного віку з подвійним муром IX ст., та перське, елліністичне, римське й візантійське заселення, до хрестоносної фортеці Кеймон, мамлюцьких і османських решток: понад двадцять шарів, одна з найдовших послідовностей у краї."
    - "Сьогодні Йокнеам-Ілліт, місто, відоме технологічними компаніями, стоїть біля городища, а Тель-Йокнеам — упорядкована пам’ятка при вході в прохід, з шосе 70, що йде проходом під ним."
  es:
    - "Jocneam era una ciudad cananea al pie del monte Carmelo, en el borde suroccidental del valle de Jezreel, donde el paso del Wadi Milh cruza la cordillera del Carmelo hacia la costa. El sitio es Tel Yokneam, montículo empinado junto a la ciudad moderna, cuyo nombre árabe Tell Qeimun conservó el antiguo, y las listas de Tutmosis III en Karnak ya la registran en el siglo XV a. C. Josué cuenta a «el rey de Jocneam de Carmel» entre los treinta y un reyes vencidos al oeste del Jordán; la frontera de Zabulón llegaba «al arroyo que está delante de Jocneam», que drena el valle hacia el Cisón; y fue dada a los levitas de Merari, de la tribu de Zabulón. La lista paralela de Crónicas no la nombra, y da Rimón y Tabor para Zabulón. El Jocmeam de los distritos de Salomón, escrito Jokneam en la versión del rey Jacobo (King James), es otra población, en el valle del Jordán."
    - "Las excavaciones de Amnon Ben-Tor para la Universidad Hebrea en 1977–1988 trazaron la ciudad desde la Edad del Bronce Medio, cuando la defendían un muro y un glacis, pasando por una población del Bronce Final destruida hacia el 1200 a. C., una población de la Edad del Hierro con un muro doble del siglo IX, y la ocupación persa, helenística, romana y bizantina, hasta una fortaleza cruzada, Caymont, y restos mamelucos y otomanos: más de veinte estratos, una de las secuencias más largas del país."
    - "Hoy Yokneam Illit, ciudad conocida por sus empresas tecnológicas, se alza junto al montículo, y Tel Yokneam es un sitio ajardinado a la entrada del paso, con la carretera 70 corriendo por el paso, bajo él."
  pt:
    - "Jocneão era uma cidade cananeia ao pé do monte Carmelo, na borda sudoeste do vale de Jezreel, onde a passagem do uádi Milh leva através da crista do Carmelo à costa. O sítio é Tel Yokneam, um monte íngreme junto à cidade moderna, cujo nome árabe Tell Qeimun guardou o antigo, e as listas de Tutmés III em Karnak já a registram no século XV a.C. Josué conta “o rei de Jocneão, no Carmelo” entre os trinta e um reis derrotados a oeste do Jordão; a fronteira de Zebulom corria até “ao ribeiro que está em frente a Jocneão”, o riacho que drena o vale em direção ao Quisom; e a cidade foi dada aos levitas de Merari, da parte de Zebulom. A lista paralela de Crônicas não a nomeia, dando Rimom e Tabor para Zebulom. O Jocmeão dos distritos de Salomão, grafado Jocneão na Versão King James, é outra cidade, no vale do Jordão."
    - "As escavações de Amnon Ben-Tor para a Universidade Hebraica em 1977–1988 traçaram a cidade desde o Bronze Médio, quando uma muralha e um glacis a defendiam, passando por uma cidade do Bronze Tardio destruída por volta de 1200 a.C., uma cidade da Idade do Ferro com muralha dupla do século IX e ocupação persa, helenística, romana e bizantina, até uma fortaleza cruzada, Caymont, e restos mamelucos e otomanos: mais de vinte estratos, uma das mais longas sequências do país."
    - "Hoje Yokneam Illit, cidade conhecida por suas empresas de tecnologia, fica junto ao monte, e Tel Yokneam é um sítio paisagístico na boca da passagem, com a Rodovia 70 correndo pela passagem abaixo dele."
  de:
    - "Jokneam war eine kanaanitische Stadt am Fuß des Karmel, am südwestlichen Rand des Jesreeltals, wo der Pass des Wadi Milh durch den Karmelrücken zur Küste führt. Die Stätte ist Tel Jokneam, ein steiler Hügel neben der modernen Stadt, dessen arabischer Name Tell Qeimun den alten bewahrte; die Listen Thutmosis' III. in Karnak verzeichnen sie schon im 15. Jahrhundert v. Chr. Josua zählt „der König zu Jokneam am Karmel“ zu den einunddreißig westlich des Jordan besiegten Königen; die Grenze Sebulons reichte bis an „den Bach, der vor Jokneam fließt“, der das Tal zum Kischon entwässert; und die Stadt wurde den Leviten von Merari aus Sebulon gegeben. Die Parallelliste der Chronik nennt sie nicht, sondern gibt Rimmon und Tabor für Sebulon. Das Jokmeam von Salomos Bezirken, in der King-James-Bibel Jokneam geschrieben, ist eine andere Stadt im Jordantal."
    - "Amnon Ben-Tors Grabungen für die Hebräische Universität 1977–1988 verfolgten die Stadt von der Mittelbronzezeit, als Mauer und Glacis sie schützten, über eine um 1200 v. Chr. zerstörte spätbronzezeitliche Stadt, eine eisenzeitliche Stadt mit Doppelmauer des 9. Jahrhunderts und persische, hellenistische, römische und byzantinische Besiedlung bis zu einer Kreuzfahrerfestung, Caymont, und mamlukischen und osmanischen Resten: mehr als zwanzig Schichten, eine der längsten Abfolgen des Landes."
    - "Heute steht Jokneam Illit, eine für seine Technologiefirmen bekannte Stadt, neben dem Hügel, und Tel Jokneam ist ein gestalteter Ort an der Mündung des Passes, mit der Straße 70, die unterhalb davon durch den Pass führt."
  fr:
    - "Jokneam était une ville cananéenne au pied du Carmel, au sud-ouest de la vallée de Jizreel, où le défilé de l’oued Milh traverse la crête du Carmel vers la côte. Le site est Tel Yokneam, tertre abrupt près de la ville moderne, dont le nom arabe Tell Qeimun garde l’ancien ; les listes de Thoutmosis III à Karnak la citent déjà au XVe siècle av. J.-C. Josué compte « le roi de Jokneam, au Carmel » parmi les trente et un rois battus à l’ouest du Jourdain ; la frontière de Zabulon allait au « torrent qui coule devant Jokneam », qui draine la vallée vers le Kison ; la ville fut donnée aux Lévites de Merari. La liste parallèle des Chroniques l’omet, donnant Rimmono et Thabor. Le Jokméam des districts de Salomon, écrit Jokneam dans la version King James, est une autre ville, dans la vallée du Jourdain."
    - "Les fouilles d’Amnon Ben-Tor pour l’Université hébraïque en 1977–1988 ont suivi la ville depuis le Bronze moyen, quand un mur et un glacis la défendaient, par une ville du Bronze récent détruite vers 1200 av. J.-C., une ville de l’âge du Fer à double mur du IXe siècle, et l’occupation perse, hellénistique, romaine et byzantine, jusqu’à une forteresse croisée, Caymont, et des vestiges mamelouks et ottomans : plus de vingt strates, l’une des plus longues séquences du pays."
    - "Aujourd’hui, Yokneam Illit, ville connue pour ses entreprises technologiques, se dresse à côté du tertre, et Tel Yokneam est un site aménagé à l’entrée du défilé, la route 70 passant dans le défilé en contrebas."
