body:
  en:
    - "Anab was a town in the hill country of Judah south-west of Hebron, one of the strongholds of the Anakim, the giants of the land: “at that time came Joshua, and cut off the Anakims from the mountains, from Hebron, from Debir, from Anab, and from all the mountains of Judah”. Judah's list of towns sets it in the southern district with its neighbours, “Anab, and Eshtemoh, and Anim”. The name survives at Khirbet Anab, two ruins some 19 km south-west of Hebron, Anab es-Seghireh, “the small”, and Anab el-Kabir, “the great”. The smaller, with pottery of the Iron Age, is usually taken for the biblical town; others prefer the larger; neither has been dug as a biblical site. Eusebius placed Anab in the district of Eleutheropolis."
    - "The Bible says nothing more of it, and no event is set there. The ruins lie today in the Hebron governorate of the West Bank, in the dry hills near the town of adh-Dhahiriya."
  ru:
    - "Анаф — город в нагорье Иудеи к юго-западу от Хеврона, одна из твердынь Енакимов, исполинов этой земли: «В то же время пришел Иисус и поразил всех Енакимов на горе, в Хевроне, в Давире, в Анаве, на всей горе Иудиной». Список городов Иуды ставит его в южный округ с соседями: «Анаф, Ештемо и Аним». Имя сохранилось в Хирбет-Анабе, двух развалинах примерно в 19 км к юго-западу от Хеврона: Анаб-эс-Сегире, «малом», и Анаб-эль-Кабире, «большом». Меньший, с керамикой железного века, обычно считают библейским городом; другие предпочитают больший; ни один не раскапывался как библейское место. Евсевий относил Анаф к округу Елевферополя."
    - "Больше Библия о нём ничего не говорит, и никакое событие там не происходит. Развалины лежат сегодня в мухафазе Хеврон на Западном берегу, в сухих холмах близ города Эд-Дахрия."
  uk:
    - "Анав був містом у нагір'ї Юди на південний захід від Хеврону, одним із твердинь енакімів, велетнів краю: «Того ж часу двинув Ісус та й повибивав Енакіїв по горах у Гебронї, Давирі, в Анаві, по всїх горах Юдиних». Перелік міст Юди ставить його в південному окрузі поряд із сусідами: «Анат, Ештемо й Аним». Назва зберігається у Хірбет-Анаб, двох руїнах приблизно за 19 км на південний захід від Хеврону, Анаб-ес-Сегіре, «малому», і Анаб-ель-Кебір, «великому». Менший, з керамікою залізної доби, зазвичай вважають біблійним містом; інші віддають перевагу більшому; жоден не розкопували як біблійне місце. Євсевій розмістив Анав в окрузі Елевтеропіля."
    - "Біблія більше нічого про нього не каже, і жодна подія з ним не пов'язана. Руїни лежать нині в Хевронському губернаторстві Західного берега, в сухих пагорбах поблизу міста Едх-Захірія."
  es:
    - "Anab era una ciudad de la región montañosa de Judá, al sudoeste de Hebrón, una de las fortalezas de los anaceos, los gigantes de la tierra: «vino Josué y destruyó los Anaceos de los montes, de Hebrón, de Debir, y de Anab, y de todos los montes de Judá». La lista de ciudades de Judá la sitúa en el distrito meridional con sus vecinas, «Anab, y Estemo, y Anim». El nombre sobrevive en Khirbet Anab, dos ruinas a unos 19 km al sudoeste de Hebrón, Anab es-Seghireh, «la pequeña», y Anab el-Kabir, «la grande». La más pequeña, con cerámica de la edad del Hierro, suele tomarse por la ciudad bíblica; otros prefieren la mayor; ninguna ha sido excavada como sitio bíblico. Eusebio situó Anab en el distrito de Eleuterópolis."
    - "La Biblia no dice nada más de ella, y ningún suceso se sitúa allí. Hoy las ruinas se encuentran en la gobernación de Hebrón, en Cisjordania, en las colinas secas cercanas a la ciudad de adh-Dhahiriya."
  pt:
    - "Anabe era uma cidade na região montanhosa de Judá, a sudoeste de Hebrom, uma das fortalezas dos anaquins, os gigantes da terra: “Josué veio naquele tempo, e eliminou os anaquins da região montanhosa, de Hebrom, de Debir, de Anabe, e de toda a região montanhosa de Judá”. A lista das cidades de Judá a situa no distrito meridional com as vizinhas, “Anabe, Estemoa, Anim”. O nome sobrevive em Khirbet Anab, duas ruínas a cerca de 19 km a sudoeste de Hebrom, Anab es-Seghireh, “a pequena”, e Anab el-Kabir, “a grande”. A menor, com cerâmica da Idade do Ferro, é geralmente tomada pela cidade bíblica; outros preferem a maior; nenhuma foi escavada como sítio bíblico. Eusébio situou Anabe no distrito de Eleuterópolis."
    - "A Bíblia nada mais diz dela, e nenhum acontecimento se situa ali. As ruínas ficam hoje na província de Hebrom, na Cisjordânia, nas colinas áridas perto da cidade de adh-Dhahiriya."
  de:
    - "Anab war eine Stadt im Bergland Judas südwestlich von Hebron, eine der Festen der Enakiter, der Riesen des Landes: „Zu der Zeit kam Josua und rottete aus die Enakiter von dem Gebirge, von Hebron, von Debir, von Anab und von allem Gebirge Juda“. Judas Städteliste ordnet es im südlichen Bezirk neben seinen Nachbarn ein: „Anab, Esthemo, Anim“. Der Name lebt in Chirbet Anab fort, zwei Ruinen etwa 19 km südwestlich von Hebron, Anab es-Seghire, „das kleine“, und Anab el-Kebir, „das große“. Das kleinere, mit Keramik der Eisenzeit, hält man gewöhnlich für die biblische Stadt; andere bevorzugen das größere; keines wurde als biblische Stätte ausgegraben. Eusebius setzte Anab in den Bezirk von Eleutheropolis."
    - "Die Bibel sagt nichts weiter von ihm, und kein Ereignis wird dort verortet. Die Ruinen liegen heute im Gouvernement Hebron im Westjordanland, in den trockenen Bergen bei der Stadt ad-Dhahiriya."
  fr:
    - "Anab était une ville de la montagne de Juda, au sud-ouest d’Hébron, l’un des bastions des Anakim, les géants du pays : « Josué se mit en marche, et il extermina les Anakim de la montagne d’Hébron, de Debir, d’Anab, de toute la montagne de Juda ». La liste des villes de Juda la place dans le district du sud avec ses voisines, « Anab, Eschthemo, Anim ». Le nom survit à Khirbet Anab, deux ruines à quelque 19 km au sud-ouest d’Hébron, Anab es-Seghireh, « la petite », et Anab el-Kabir, « la grande ». La plus petite, avec de la céramique de l’âge du Fer, est d’ordinaire tenue pour la ville biblique ; d’autres préfèrent la grande ; aucune n’a été fouillée comme site biblique. Eusèbe plaçait Anab dans le district d’Éleuthéropolis."
    - "La Bible n’en dit rien de plus, et aucun événement n’y est situé. Les ruines se trouvent aujourd’hui dans le gouvernorat d’Hébron, en Cisjordanie, dans les collines sèches près de la ville d’adh-Dhahiriya."
  it:
    - "Anab era una città della regione collinosa di Giuda a sud-ovest di Ebron, una delle roccaforti degli Anakiti, i giganti del paese: «In quel medesimo tempo, Giosuè si mise in marcia e sterminò gli Anakiti della contrada montuosa, di Hebron, di Debir, di Anab, di tutta la contrada montuosa di Giuda». L’elenco delle città di Giuda la pone nel distretto meridionale con le sue vicine, «Anab, Esthemo, Anim». Il nome sopravvive a Khirbet Anab, due rovine a circa 19 km a sud-ovest di Ebron, Anab es-Seghireh, «la piccola», e Anab el-Kabir, «la grande». La più piccola, con ceramica dell’età del Ferro, è di solito ritenuta la città biblica; altri preferiscono la più grande; nessuna delle due è stata scavata come sito biblico. Eusebio collocò Anab nel distretto di Eleuteropoli."
    - "La Bibbia non ne dice altro, e nessun avvenimento vi è collocato. Le rovine si trovano oggi nel governatorato di Ebron in Cisgiordania, nelle colline aride presso la città di adh-Dhahiriya."
  pl:
    - "Anab było miastem w górach Judy na południowy zachód od Hebronu, jedną z twierdz Anakitów, olbrzymów tej ziemi: „I ciągnął Jozue onegoż czasu, i wybił syny Enakowe z gór, z Hebronu, z Dabiru, z Anab, i ze wszystkich gór Judzkich”. Wykaz miast Judy umieszcza je w okręgu południowym wśród sąsiadów: „I Anab, i Istemo, i Anim”. Nazwa przetrwała w Chirbet Anab, dwóch ruinach około 19 km na południowy zachód od Hebronu, Anab es-Seghireh, „małym”, i Anab el-Kabir, „wielkim”. Mniejszy, z ceramiką epoki żelaza, uważa się zwykle za miasto biblijne; inni wolą większy; żaden nie był badany jako stanowisko biblijne. Euzebiusz umieszczał Anab w okręgu Eleuteropolis."
    - "Biblia nic więcej o nim nie mówi i żadne wydarzenie się tam nie rozgrywa. Ruiny leżą dziś w muhafazie Hebron na Zachodnim Brzegu, na suchych wzgórzach koło miasta adh-Dhahiriya."
  nl:
    - "Anab was een stad in het bergland van Juda ten zuidwesten van Hebron, een van de burchten van de Enakieten, de reuzen van het land: “Te dier tijde nu kwam Jozua, en roeide de Enakieten uit, van het gebergte, van Hebron, van Debir, van Anab, en van het ganse gebergte van Juda”. Jozua’s stedenlijst voor Juda plaatst haar in het zuidelijke district met haar buren, “Anab, en Estemo, en Anim”. De naam leeft voort in Khirbet Anab, twee ruïnes zo’n 19 km ten zuidwesten van Hebron, Anab es-Seghireh, “de kleine”, en Anab el-Kabir, “de grote”. De kleinere, met aardewerk uit de ijzertijd, wordt gewoonlijk voor de bijbelse stad gehouden; anderen verkiezen de grotere; geen van beide is als bijbelse plaats opgegraven. Eusebius plaatste Anab in het district van Eleutheropolis."
    - "De Bijbel zegt er verder niets over, en er wordt geen gebeurtenis gesitueerd. De ruïnes liggen nu in het gouvernement Hebron van de Westelijke Jordaanoever, in de droge heuvels bij de stad adh-Dhahiriya."
  cs:
    - "Anab bylo město v judském pohoří jihozápadně od Hebronu, jedna z pevností Anakovců, obrů té země: „Toho pak času přitáhl Jozue a vyplénil Enaky z těch hor, totiž z Hebronu, z Dabir a z Anab, i ze všeliké hory Judské“. Seznam judských měst jej klade do jižního okrsku s jeho sousedy, „Anab, Estemo a Anim“. Jméno přežívá v Chirbet Anab, dvou zříceninách asi 19 km jihozápadně od Hebronu, Anab es-Seghireh, „malý“, a Anab el-Kabir, „velký“. Menší, s keramikou doby železné, se obvykle pokládá za biblické město; jiní dávají přednost většímu; ani jedno nebylo kopáno jako biblické místo. Eusebios umístil Anab do okrsku Eleutheropole."
    - "Bible o něm už nic neříká a žádná událost se tam neodehrála. Zříceniny leží dnes v hebronském guvernorátu Západního břehu, v suchých pahorcích poblíž města adh-Dhahiriya."
  sv:
    - "Anav var en stad i Judas bergsland sydväst om Hebron, ett av fästena för anakiterna, landets jättar: ”Under denna tid drog Josua åstad och utrotade anakiterna i Bergsbygden, i Hebron, Debir och Anab, i hela Juda bergsbygd”. Förteckningen över Judas städer placerar den i det södra distriktet med dess grannar, ”Anab, Estemo, Anim”. Namnet lever kvar i Khirbet Anab, två ruiner omkring 19 km sydväst om Hebron, Anab es-Seghireh, ”den lilla”, och Anab el-Kabir, ”den stora”. Den mindre, med keramik från järnåldern, antas vanligen vara den bibliska staden; andra föredrar den större; ingen av dem har grävts ut som bibelsk plats. Eusebios förlade Anav i Eleutheropolis distrikt."
    - "Bibeln säger ingenting mer om den, och ingen händelse förläggs dit. Ruinerna ligger i dag i Hebrons guvernement på Västbanken, i de torra bergen nära staden adh-Dhahiriya."
  nb:
    - "Anab var en by i Judas fjellbygder sørvest for Hebron, en av festningene til anakittene, landets kjemper: «På samme tid kom Josva og utryddet anakittene i fjellbygdene, i Hebron, i Debir, i Anab og i alle fjellbygdene …». Judas byliste plasserer den i det sørlige distriktet sammen med naboene: «Anab og Estemo og Anim». Navnet lever videre ved Khirbet Anab, to ruiner omtrent 19 km sørvest for Hebron, Anab es-Seghireh, «den lille», og Anab el-Kabir, «den store». Den minste, med keramikk fra jernalderen, regnes vanligvis for den bibelske byen; andre foretrekker den største; ingen av dem er gravd ut som bibelsk sted. Eusebius plasserte Anab i distriktet Eleutheropolis."
    - "Bibelen sier ikke mer om den, og ingen hendelse er knyttet til stedet. Ruinene ligger i dag i Hebron-guvernementet på Vestbredden, i de tørre åsene nær byen adh-Dhahiriya."
  tl:
    - "Ang Anab ay isang bayan sa maburol na lupain ng Juda sa timog-kanluran ng Hebron, isa sa mga kuta ng mga Anaceo, ang mga higante ng lupain: “At naparoon si Josue nang panahong yaon at nilipol ang mga Anaceo mula sa lupaing maburol, sa Hebron, sa Debir, sa Anab, at sa buong lupaing maburol ng Juda”. Inilalagay ito ng talaan ng mga bayan ng Juda sa katimugang distrito kasama ng mga kapitbahay nito, “Anab, at Estemo, at Anim”. Nananatili ang pangalan sa Khirbet Anab, dalawang guho na mga 19 km sa timog-kanluran ng Hebron, ang Anab es-Seghireh, “ang maliit”, at Anab el-Kabir, “ang dakila”. Ang mas maliit, na may mga palayok ng Panahon ng Bakal, ang karaniwang itinuturing na bayang biblikal; mas gusto ng iba ang mas malaki; wala sa dalawa ang hinukay bilang lugar na biblikal. Inilagay ni Eusebio ang Anab sa distrito ng Eleutheropolis."
    - "Wala nang sinasabi ang Biblia tungkol dito, at walang pangyayaring itinatakda roon. Ang mga guho ay nasa Gobernoradong Hebron ng West Bank ngayon, sa tuyong mga burol malapit sa bayan ng adh-Dhahiriya."
  da:
    - "Anab var en by i Judas bjergland sydvest for Hebron, en af anakiternes fæstninger, landets kæmper: »Og Josva kom paa den samme Tid og udryddede Anakiterne af Bjerget, af Hebron, af Debir, af Anab og af alle Judas Bjerge«. Judas byliste placerer den i det sydlige distrikt sammen med dens naboer, »Anab og Esthemo og Anim«. Navnet lever ved Khirbet Anab, to ruiner omkring 19 km sydvest for Hebron, Anab es-Seghireh, »den lille«, og Anab el-Kabir, »den store«. Den mindre, med keramik fra jernalderen, regnes sædvanligvis for den bibelske by; andre foretrækker den større; ingen af dem er udgravet som bibelsk sted. Eusebius placerede Anab i Eleutheropolis' distrikt."
    - "Bibelen siger intet mere om den, og ingen begivenhed er knyttet til stedet. Ruinerne ligger i dag i Hebron-guvernementet på Vestbredden, i de tørre bjerge nær byen adh-Dhahiriya."
scripture:
