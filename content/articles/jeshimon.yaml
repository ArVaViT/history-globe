body:
  en:
    - "Jeshimon is a Hebrew word for wasteland, used in the Bible both as a common noun and as the name of a district, and the Authorised Version keeps it as a name in six verses. On the map the point stands in the wilderness of Judah, east of Ziph and Maon, where the hill country breaks down in bare chalk ridges to the Dead Sea. Here the Ziphites told Saul that David was hiding “in the hill of Hachilah, which is on the south of Jeshimon”, David and his men were “in the wilderness of Maon, in the plain on the south of Jeshimon”, and Saul camped “in the hill of Hachilah, which is before Jeshimon, by the way” on the night David crept into his camp and took his spear."
    - "The two verses in Numbers belong to another waste. Israel's road came to the top of Pisgah, “which looketh toward Jeshimon”, and Balak brought Balaam to the top of Peor, “that looketh toward Jeshimon”: the desert floor of the Jordan valley at the north end of the Dead Sea, where Beth-jeshimoth, “house of the wastes”, lay at the foot of the Moabite hills. The Synodal Bible accordingly translates the word as “wilderness” in Numbers and keeps Jeshimon as a name only in Samuel. The word appears again in Moses' song, “the waste howling wilderness”, and in the Psalms and Isaiah for the desert."
    - "The Judean Jeshimon is today the Judean Desert, the strip of ravines between the hills of Hebron and the Dead Sea: Ein Gedi with its spring, the caves of Nahal Hever, the Dead Sea Scrolls caves further north, Masada and the monastery of Mar Saba on its edges, and Bedouin camps and shepherds in between. The hill of Hachilah has not been identified."
  ru:
    - "Иесимон — еврейское слово, означающее пустошь; в Библии оно употребляется и как нарицательное, и как имя местности, и в шести стихах английские переводчики сохранили его как название. На карте точка стоит в пустыне Иудейской, к востоку от Зифа и Маона, где нагорье обрывается голыми меловыми грядами к Мёртвому морю. Здесь Зифеи донесли Саулу, что Давид скрывается «на холме Гахила, что направо от Иесимона», Давид с людьми был «в пустыне Маон, на равнине, направо от Иесимона», а Саул стал «на холме Гахила, что направо от Иесимона, при дороге» в ту ночь, когда Давид прокрался в его стан и унёс копьё."
    - "Два стиха в книге Чисел относятся к другой пустоши. Путь Израиля дошёл до вершины Фасги, «обращенной лицем к пустыне», а Валак взял Валаама на верх Фегора, «обращенного к пустыне»: это Иесимон — пустынное дно долины Иордана у северного конца Мёртвого моря, где у подножия Моавитских гор лежал Беф-Иешимоф, «дом пустошей». Синодальный перевод соответственно передаёт это слово в Числах как «пустыня» и сохраняет Иесимон как имя только в книгах Царств. Слово встречается и в песни Моисея — «в степи печальной и дикой», — и в Псалмах и у Исаии о пустыне."
    - "Иудейский Иесимон сегодня — Иудейская пустыня, полоса ущелий между Хевронскими горами и Мёртвым морем: Эйн-Геди с его источником, пещеры Нахаль-Хевер, пещеры свитков Мёртвого моря дальше к северу, Масада и монастырь Мар-Саба по краям, а между ними бедуинские стоянки и пастухи. Холм Гахила не отождествлён."
  uk:
    - "Єшимон — давньоєврейське слово для пустиря, вжите в Біблії і як загальна назва, і як назва округи, а Авторизована версія зберігає його як назву в шести віршах. На карті точка стоїть у Юдейській пустелі, на схід від Зіфа й Маона, де гірський край спадає голими крейдяними хребтами до Мертвого моря. Тут зифеї сказали Саулові, що Давид ховається «на верху гори Гахила, що направо від Есимону», Давид і його люди були «в Маон-пустинї, у степу, на право від Есимону», а Саул отаборився «на горі Гахилї, що лежить перед пустинею при дорозї» тієї ночі, коли Давид прокрався в його табір і взяв його спис."
    - "Два вірші в Книзі Чисел належать іншому пустирю. Шлях Ізраїля дійшов до верховин Фасги, «що стремить над дикою полониною», а Валак узяв Валаама на верх Пеора, «що стремить на рівнинї пустинї»: це Єшимон, пустельне дно Йорданської долини на північному краю Мертвого моря, де біля підніжжя моавських пагорбів лежав Бет-Єшімот, «дім пустель». Тому Синодальна Біблія в Числах перекладає це слово як «пустеля», а Єшимон зберігає як назву лише в Самуїлі. Слово знову з’являється в пісні Мойсея, «в степу безлюдному і дикому», та в Псалмах і Ісаї для пустелі."
    - "Юдейський Єшимон сьогодні — Юдейська пустеля, смуга ущелин між хевронськими пагорбами й Мертвим морем: Ейн-Геді з джерелом, печери Нахаль-Хевер, печери сувоїв Мертвого моря далі на північ, Масада й монастир Мар-Саба на її краях, а між ними бедуїнські табори й пастухи. Пагорб Гахіла не ототожнений."
  es:
    - "Jesimón es una palabra hebrea para páramo, usada en la Biblia tanto como nombre común como nombre de un distrito, y la versión autorizada (King James) la conserva como nombre en seis versículos. En el mapa el punto está en el desierto de Judá, al este de Zif y Maón, donde la región montañosa se quiebra en áridas crestas de creta hasta el mar Muerto. Aquí los zifeos dijeron a Saúl que David se escondía «en el collado de Hachîla que está á la mano derecha del desierto», David y sus hombres estaban «en el desierto de Maón, en la llanura que está á la diestra del desierto», y Saúl acampó «en el collado de Hachîla, que está delante del desierto junto al camino» la noche en que David se coló en su campamento y se llevó su lanza."
    - "Los dos versículos de Números pertenecen a otro páramo. El camino de Israel llegó a la cumbre de Pisga, «que mira á Jesimón», y Balac llevó a Balaam a la cumbre de Peor, «que mira hacia Jesimón»: el suelo desértico del valle del Jordán en el extremo norte del mar Muerto, donde se hallaba Bet-jesimot, «casa de los páramos», al pie de las colinas moabitas. En consecuencia, la Biblia sinodal traduce la palabra como «desierto» en Números y la conserva como nombre solo en Samuel. La palabra aparece de nuevo en el cántico de Moisés, «desierto horrible y yermo», y en los Salmos e Isaías para el desierto."
    - "El Jesimón de Judea es hoy el desierto de Judea, la franja de barrancos entre las colinas de Hebrón y el mar Muerto: Ein Gedi con su manantial, las cuevas del Nahal Hever, las cuevas de los rollos del mar Muerto más al norte, Masada y el monasterio de Mar Saba en sus bordes, y campamentos beduinos y pastores entre medias. La colina de Haquila no ha sido identificada."
  pt:
    - "Jesimom é uma palavra hebraica para terra desolada, usada na Bíblia tanto como substantivo comum quanto como nome de um distrito, e a Versão Autorizada a mantém como nome em seis versículos. No mapa o ponto fica no deserto de Judá, a leste de Zife e Maom, onde a região montanhosa desce em nuas cristas de giz até o mar Morto. Aqui os zifeus disseram a Saul que Davi se escondia “na colina de Haquila, que fica ao sul do deserto”, Davi e seus homens estavam “no deserto de Maom, na Arabá, ao sul do deserto”, e Saul acampou “na colina de Haquila, que fica em frente ao deserto, junto à estrada” na noite em que Davi entrou furtivamente no seu acampamento e tomou a sua lança."
    - "Os dois versículos em Números pertencem a outro ermo. O caminho de Israel chegou ao topo de Pisga, “que olha para o deserto”, e Balaque levou Balaão ao topo de Peor, “que tem vista para o deserto”: o Jesimom, o chão desértico do vale do Jordão no extremo norte do mar Morto, onde Bete-Jesimote, “casa dos ermos”, ficava ao pé das colinas moabitas. A Bíblia Sinodal traduz, por isso, a palavra como “deserto” em Números e mantém Jesimom como nome só em Samuel. A palavra aparece de novo no cântico de Moisés, “no deserto desolado e uivante”, e nos Salmos e em Isaías para o deserto."
    - "O Jesimom da Judeia é hoje o deserto da Judeia, a faixa de ravinas entre as colinas de Hebrom e o mar Morto: Ein Gedi com sua fonte, as cavernas de Nahal Hever, as cavernas dos Manuscritos do Mar Morto mais ao norte, Massada e o mosteiro de Mar Saba em suas bordas, e acampamentos beduínos e pastores no meio. A colina de Haquila não foi identificada."
  de:
    - "Jeschimon ist ein hebräisches Wort für Einöde, in der Bibel sowohl als Gattungsname wie als Name eines Bezirks gebraucht, und die King-James-Bibel behält es in sechs Versen als Namen bei. Auf der Karte steht der Punkt in der Wüste Juda, östlich von Sif und Maon, wo das Bergland in kahlen Kreiderücken zum Toten Meer abbricht. Hier sagten die Sifiter Saul, David verberge sich „auf dem Hügel Hachila, der zur Rechten liegt an der Wüste“, David und seine Männer waren „in der Wüste Maon, auf dem Gefilde zur Rechten der Wüste“, und Saul lagerte „auf dem Hügel Hachila, der vor der Wüste liegt am Wege“, in der Nacht, als David in sein Lager schlich und seinen Speer nahm."
    - "Die beiden Verse im vierten Buch Mose gehören zu einer anderen Einöde. Israels Weg führte auf den hohen Berg Pisgas, „der gegen die Wüste sieht“, und Balak führte Bileam auf die Höhe des Berges Peor, „welcher gegen die Wüste sieht“: die Jeschimon, der Wüstenboden des Jordantals am Nordende des Toten Meeres, wo Bet-Jeschimot, „Haus der Wüsteneien“, am Fuß der moabitischen Berge lag. Die Synodalübersetzung gibt das Wort deshalb im vierten Buch Mose als „Wüste“ wieder und behält Jeschimon nur bei Samuel als Namen bei. Das Wort erscheint noch einmal in Moses Lied, „in der dürren Einöde, da es heult“, und in den Psalmen und bei Jesaja für die Wüste."
    - "Die judäische Jeschimon ist heute die Judäische Wüste, der Streifen von Schluchten zwischen den Bergen von Hebron und dem Toten Meer: En Gedi mit seiner Quelle, die Höhlen des Nachal Chever, weiter nördlich die Höhlen der Schriftrollen vom Toten Meer, an den Rändern Masada und das Kloster Mar Saba und dazwischen Beduinenlager und Hirten. Der Hügel Hachila ist nicht identifiziert."
  fr:
    - "Jeschimon est un mot hébreu pour désolation, employé dans la Bible à la fois comme nom commun et comme nom d’un district, et la version autorisée le garde comme nom dans six versets. Sur la carte, le point se tient dans le désert de Juda, à l’est de Ziph et de Maon, là où le pays de collines s’effondre en crêtes de craie nue vers la mer Morte. C’est ici que les Ziphiens dirent à Saül que David se cachait « sur la colline de Hakila, qui est au midi du désert », que David et ses hommes étaient « au désert de Maon, dans la plaine au midi du désert », et que Saül « campa sur la colline de Hakila, en face du désert, près du chemin » la nuit où David se glissa dans son camp et prit sa lance."
    - "Les deux versets des Nombres relèvent d’une autre désolation. La route d’Israël parvint au sommet du Pisga, « en regard du désert », et Balak mena Balaam sur le sommet du Peor, « en regard du désert » : le Jeschimon, le fond désertique de la vallée du Jourdain à l’extrémité nord de la mer Morte, où Beth-Jeschimoth, « maison des solitudes », se trouvait au pied des collines moabites. La Bible synodale traduit donc le mot par « désert » dans les Nombres et ne garde Jeschimon comme nom que dans Samuel. Le mot reparaît dans le cantique de Moïse, « une solitude aux effroyables hurlements », et dans les Psaumes et chez Ésaïe pour le désert."
    - "Le Jeschimon de Judée est aujourd’hui le désert de Judée, la bande de ravins entre les collines d’Hébron et la mer Morte : Ein Gedi avec sa source, les grottes du Nahal Hever, les grottes des manuscrits de la mer Morte plus au nord, Massada et le monastère de Mar Saba sur ses bords, et entre eux des campements bédouins et des bergers. La colline de Hakila n’a pas été identifiée."
  pl:
    - "Jeszimon to hebrajskie słowo na pustkowie, używane w Biblii zarówno jako rzeczownik pospolity, jak i jako nazwa okręgu, a Biblia Króla Jakuba zachowuje je jako nazwę w sześciu wersetach. Na mapie punkt stoi na pustyni Judzkiej, na wschód od Zif i Maon, gdzie kraj górski opada nagimi grzbietami z kredy ku Morzu Martwemu. Tu Zifejczycy powiedzieli Saulowi, że Dawid ukrywa się „na pagórku Hachila, który jest po prawej stronie Jesymona”, Dawid i jego ludzie byli „na puszczy Maon, w polach po prawej stronie Jesymon”, a Saul obozował „na pagórku Hachila, które jest przeciw Jesymon podle drogi” tej nocy, gdy Dawid zakradł się do jego obozu i zabrał jego włócznię."
    - "Dwa wersety w Księdze Liczb dotyczą innego pustkowia. Droga Izraela doszła na szczyt Pisgi, „który leży ku puszczy”, a Balak wiódł Balaama na górę Peor, „która patrzy ku puszczy”: to Jeszimon, pustynne dno doliny Jordanu na północnym krańcu Morza Martwego, gdzie u stóp wzgórz Moabu leżało Bet-Jeszimot, „dom pustkowi”. Biblia synodalna tłumaczy więc to słowo jako „pustynia” w Księdze Liczb i zachowuje Jeszimon jako nazwę tylko w Księgach Samuela. Słowo pojawia się ponownie w pieśni Mojżesza, „w ziemi pustej, i na puszczy wielkiej i strasznej”, oraz w Psalmach i u Izajasza na oznaczenie pustyni."
    - "Judzki Jeszimon to dziś Pustynia Judzka, pas wąwozów między wzgórzami Hebronu a Morzem Martwym: En-Gedi ze swoim źródłem, jaskinie Nachal Chewer, jaskinie ze zwojami znad Morza Martwego dalej na północ, Masada i klasztor Mar Saba na jej skrajach, a pomiędzy nimi obozy Beduinów i pasterze. Wzgórza Chakila nie zidentyfikowano."
  it:
    - "Iesimon è una parola ebraica per terra desolata, usata nella Bibbia sia come nome comune sia come nome di un distretto, e l’Authorised Version la conserva come nome in sei versetti. Sulla mappa il punto si trova nel deserto di Giuda, a est di Zif e di Maon, dove i monti precipitano in nude dorsali di gesso verso il Mar Morto. Qui gli Zifei dissero a Saul che Davide si nascondeva «sul colle di Hakila che è a mezzogiorno del deserto», Davide e i suoi uomini erano «nel deserto di Maon, nella pianura a mezzogiorno del deserto», e Saul si accampò «sulla collina di Hakila ch’è dirimpetto al deserto, presso la strada» la notte in cui Davide si insinuò nel suo campo e prese la sua lancia."
    - "I due versetti dei Numeri appartengono a un’altra landa. La via d’Israele giunse all’altura del Pisga «che domina il deserto», e Balak condusse Balaam in cima al Peor «che domina il deserto»: l’Iesimon, il fondovalle desertico del Giordano all’estremità settentrionale del Mar Morto, dove Bet-Iesimòt, «casa delle desolazioni», sorgeva ai piedi dei colli moabiti. La Bibbia sinodale traduce di conseguenza la parola come «deserto» nei Numeri e conserva Iesimon come nome solo in Samuele. La parola ricorre ancora nel canto di Mosè, «una solitudine piena d’urli e di desolazione», e nei Salmi e in Isaia per il deserto."
    - "L’Iesimon di Giuda è oggi il deserto di Giuda, la fascia di burroni fra i colli di Ebron e il Mar Morto: Ein Gedi con la sua sorgente, le grotte di Nahal Hever, le grotte dei Rotoli del Mar Morto più a nord, Masada e il monastero di Mar Saba ai suoi margini, e fra l’uno e l’altro accampamenti beduini e pastori. La collina di Chechilà non è stata identificata."
  nl:
    - "Jesimon is een Hebreeuws woord voor woestenij, in de Bijbel gebruikt zowel als soortnaam als als naam van een streek, en de Authorised Version behoudt het als naam in zes verzen. Op de kaart staat het punt in de woestijn van Juda, ten oosten van Zif en Maön, waar het bergland in kale kalkruggen afdaalt naar de Dode Zee. Hier vertelden de Zifieten Saul dat David zich verborg “op den heuvel van Hachila, die aan de rechterhand der wildernis is”, waren David en zijn mannen “in de woestijn van Maon, in het vlakke veld, aan de rechterhand der wildernis”, en legerde Saul zich “op den heuvel van Hachila, die voor aan de wildernis is aan den weg” in de nacht dat David zijn kamp binnensloop en zijn speer nam."
    - "De twee verzen in Numeri horen bij een andere woestenij. De weg van Israël kwam aan de hoogte van Pisga, “dat tegen de wildernis ziet”, en Balak nam Bileam mee tot de hoogte van Peor, “die tegen de woestijn ziet”: de Jesimon, de woestijnbodem van het Jordaandal aan het noordeinde van de Dode Zee, waar Beth-Jesimot, “huis van de woestenijen”, aan de voet van de Moabitische heuvels lag. De Synodale Bijbel vertaalt het woord daarom als “wildernis” in Numeri en behoudt Jesimon als naam alleen in Samuël. Het woord komt nog voor in Mozes’ lied, “in een woeste huilende wildernis”, en in de Psalmen en Jesaja voor de woestijn."
    - "De Judese Jesimon is nu de Judese Woestijn, de strook ravijnen tussen de heuvels van Hebron en de Dode Zee: Ein Gedi met zijn bron, de grotten van Nahal Hever, de grotten van de Dode-Zeerollen verder noordelijk, Masada en het klooster Mar Saba aan de randen, en daartussen bedoeïenenkampen en herders. De heuvel van Chachila is niet geïdentificeerd."
  cs:
    - "Ješimon je hebrejské slovo pro pustinu, užívané v Bibli jako obecné podstatné jméno i jako jméno okresu, a Autorizovaná verze je zachovává jako jméno v šesti verších. Na mapě bod stojí v judské poušti, východně od Zífu a Maonu, kde se pahorkatina láme v holé křídové hřebeny k Mrtvému moři. Zde Zifejští řekli Saulovi, že se David skrývá „na pahrbku Hachile, kterýž jest na pravé straně pouště“, David a jeho muži byli „na poušti Maon, na rovinách po pravé straně pouště“ a Saul se utábořil „na pahrbku Hachila, kterýž jest proti Jesimon při cestě“ v noci, kdy se David vplížil do jeho tábora a vzal jeho kopí."
    - "Dva verše v Numeri patří k jiné pustině. Cesta Izraele vedla k vrchu Pisgy, hory, „kteráž leží na proti poušti“, a Balak uvedl Bileáma na vrch Peóru, hory, „kteráž leží naproti poušti“: to je Ješimon, pouštní dno Jordánského údolí na severním konci Mrtvého moře, kde u úpatí moábských hor ležel Bét-ješimót, „dům pustin“. Synodální Bible proto slovo v Numeri překládá jako „pustina“ a zachovává Ješimon jako jméno jen v Samuelovi. Slovo se objevuje znovu v Mojžíšově písni, „v zemi pusté, a na poušti veliké a hrozné“, a v Žalmech a Izajášovi pro poušť."
    - "Judský Ješimon je dnes Judská poušť, pás roklí mezi hebronskými horami a Mrtvým mořem: Én-gedi s pramenem, jeskyně Nachal Chever, jeskyně se svitky od Mrtvého moře dále na severu, Masada a klášter Mar Saba na jejích okrajích a mezi nimi beduínské tábory a pastýři. Pahorek Chachila nebyl ztotožněn."
  sv:
    - "Jeshimon är ett hebreiskt ord för ödemark, använt i Bibeln både som vanligt substantiv och som namn på ett distrikt, och Authorised Version behåller det som namn i sex verser. På kartan ligger punkten i Judas öken, öster om Sif och Maon, där bergsbygden bryts ned i kala kritåsar mot Döda havet. Här sade sifiterna till Saul att David gömde sig ”på Hakilahöjden, som ligger söder om ödemarken”, David och hans män var ”i öknen Maon, på hedmarken, söder om ödemarken”, och Saul slog läger ”på Hakilahöjden, som ligger gent emot ödemarken, vid vägen” den natt David smög in i hans läger och tog hans spjut."
    - "De två verserna i Fjärde Moseboken hör till en annan ödemark. Israels väg kom till toppen av Pisga, ”uppe på Pisga, där man kan se ut över ödemarken”, och Balak förde Bileam till toppen av Peor, ”på toppen av Peor, där man kan se ut över ödemarken”: ökenslätten i Jordandalen vid Döda havets norra ände, där Bet-Hajshimot, ”ödemarkernas hus”, låg vid foten av Moabs berg. Den ryska synodalbibeln översätter därför ordet som ”öken” i Fjärde Moseboken och behåller Jeshimon som namn bara i Samuelsböckerna. Ordet förekommer åter i Moses sång, ”i ödsligheten, där ökendjuren tjöto”, och i Psaltaren och hos Jesaja om öknen."
    - "Det judeiska Jeshimon är i dag Judeiska öknen, remsan av raviner mellan Hebronbergen och Döda havet: En-Gedi med sin källa, grottorna i Nahal Hever, Dödahavsrullarnas grottor längre norrut, Masada och klostret Mar Saba i dess kanter, och beduinläger och herdar däremellan. Hakilahöjden har inte identifierats."
  nb:
    - "Jesjimon er et hebraisk ord for ødemark, brukt i Bibelen både som fellesnavn og som navn på et distrikt, og Authorised Version beholder det som navn i seks vers. På kartet står punktet i Judas ørken, øst for Sif og Maon, der fjellandet brytes ned i bare kalkrygger mot Dødehavet. Her sa sifittene til Saul at David skjulte seg «på Kakilahaugen sønnenfor ørkenen», David og hans menn var «i Maons ørken, på den øde mark sønnenfor ørkenen», og Saul slo leir «på Kakilahaugen, midt imot ørkenen, ved veien» natten David krøp inn i hans leir og tok hans spyd."
    - "De to versene i Fjerde Mosebok hører til en annen ødemark. Israels vei kom til toppen av Pisga, «hvor en skuer ut over ørkenen», og Balak førte Bileam til toppen av Peor, «hvorfra en skuer ut over ørkenen»: ørkenbunnen i Jordandalen i nordenden av Dødehavet, der Bet-Jesjimot, «ødemarkenes hus», lå ved foten av de moabittiske åsene. Den synodale bibelen oversetter derfor ordet som «ørken» i Fjerde Mosebok og beholder Jesjimon som navn bare i Samuelsbøkene. Ordet forekommer igjen i Moses' sang, «i et øde land, i villmarken, blandt ørkenens hyl», og i Salmene og hos Jesaja for ørkenen."
    - "Judas Jesjimon er i dag den judeiske ørkenen, stripen av juv mellom Hebron-åsene og Dødehavet: Ein Gedi med sin kilde, grottene i Nahal Hever, Dødehavsrullenes grotter lenger nord, Masada og klosteret Mar Saba i kantene, og beduinleirer og gjetere imellom. Hakila-høyden er ikke identifisert."
  tl:
    - "Ang Jesimon ay salitang Hebreo para sa ilang, na ginagamit sa Biblia kapwa bilang karaniwang pangngalan at pangalan ng distrito, at pinananatili ito ng Authorised Version bilang pangalan sa anim na talata. Sa mapa ang punto ay nasa ilang ng Juda, sa silangan ng Ziph at Maon, kung saan bumabagsak ang lupaing maburol sa hubad na mga tagaytay ng tisa patungo sa Dagat na Patay. Dito sinabi ng mga Zipheo kay Saul na nagtatago si David “sa burol ng Hachila, na nasa timugan ng ilang”, si David at ang kaniyang mga tao ay “nasa ilang ng Maon sa Araba sa timugan ng ilang”, at nagkampo si Saul “sa burol ng Hachila na nasa tapat ng ilang sa tabi ng daan” nang gabing lumusot si David sa kaniyang kampo at kinuha ang kaniyang sibat."
    - "Ang dalawang talata sa Mga Bilang ay kabilang sa ibang ilang. Ang daan ng Israel ay dumating sa taluktok ng Pisga, “na patungo sa ilang”, at dinala ni Balac si Balaam sa taluktok ng Peor, “na nakatungo sa ilang”: ang sahig ng disyerto ng libis ng Jordan sa hilagang dulo ng Dagat na Patay, kung saan ang Beth-jesimoth, “bahay ng mga ilang”, ay nasa paanan ng mga burol ng Moab. Kaya't isinasalin ng Bibliyang Synodal ang salita na “ilang” sa Mga Bilang at pinananatili ang Jesimon bilang pangalan sa Samuel lamang. Lumilitaw muli ang salita sa awit ni Moises, “isang umuungal na ilang”, at sa Mga Awit at Isaias para sa disyerto."
    - "Ang Jesimon ng Judea ay ngayon ang Disyerto ng Judea, ang piraso ng mga bangin sa pagitan ng mga burol ng Hebron at ng Dagat na Patay: ang Ein Gedi na may bukal, ang mga yungib ng Nahal Hever, ang mga yungib ng Mga Balumbon ng Dagat na Patay sa mas hilaga, ang Masada at monasteryo ng Mar Saba sa mga gilid, at mga kampo ng Bedouin at mga pastol sa pagitan. Hindi pa natutukoy ang burol ng Hachila."
  da:
    - "Jesjimon er et hebraisk ord for ødemark, brugt i Bibelen både som fællesnavn og som navn på et distrikt, og Authorised Version bevarer det som navn i seks vers. På kortet står punktet i Judas ørken, øst for Zif og Maon, hvor bjerglandet brydes ned i nøgne kridtryg mod Det Døde Hav. Her sagde zifitterne til Saul, at David skjulte sig »paa Hakilas Høj, som ligger til højre for Jesimon«, David og hans mænd var »i Maons Ørk paa den slette Mark, til højre for Jesimon«, og Saul slog lejr ved »Hakilas Høj, som ligger lige for Ørken ved Vejen« den nat, da David listede ind i hans lejr og tog hans spyd."
    - "De to vers i Fjerde Mosebog hører til en anden ødemark. Israels vej nåede toppen af Pisga, »der skuer ud over Ørken«, og Balak førte Bileam til toppen af Peor, »som skuer ud over Ørken«: ørkenbunden i Jordandalen ved Det Døde Havs nordende, hvor Bet-Jesjimot, »ødemarkernes hus«, lå ved foden af Moabs bjerge. Den russiske synodalbibel oversætter derfor ordet som »ørken« i Fjerde Mosebog og bevarer Jesjimon som navn kun i Samuelsbøgerne. Ordet optræder igen i Moses' sang, »i et øde Land og paa tomme Steder, blandt Ørkens Hyl«, og i Salmerne og hos Esajas for ørkenen."
    - "Det judæiske Jesjimon er i dag Judæa-ørkenen, striben af kløfter mellem Hebron-bjergene og Det Døde Hav: Ein Gedi med sin kilde, hulerne i Nahal Hever, Dødehavsrullernes huler længere mod nord, Masada og klostret Mar Saba i kanterne, og beduinlejre og hyrder imellem. Hakilas høj er ikke identificeret."
  sr:
    - "Гесимон је хебрејска реч за пустош, употребљена у Библији и као општа именица и као име области, а Ауторизовани превод је задржава као име у шест стихова. На карти тачка стоји у јудејској пустињи, источно од Зифа и Маона, где се брдовита земља у голим кречњачким гребенима спушта ка Мртвом мору. Овде су Зифеји рекли Саулу да се Давид крије „на брду Ехели надесно од Гесимона“, Давид и његови људи били су „у пустињи Маону у равници надесно од Гесимона“, а Саул је логоровао „на брду Ехели према Гесимону крај пута“ оне ноћи кад се Давид ушуњао у његов логор и узео му копље."
    - "Два стиха у Бројевима припадају другој пустоши. Израиљев пут дошао је на врх Фазге, „код горе Фазге и гледа у пустињу“, а Валак је довео Валама на врх Фегора, „који гледа у пустињу“: пустињски под долине Јордана на северном крају Мртвог мора, где је Вет-Јесимот, „кућа пустоши“, лежао у подножју моавских брда. Руски синодски превод зато реч преводи као „пустиња“ у Бројевима, а Гесимон задржава као име само у Самуилу. Реч се јавља поново у Мојсијевој песми, „на месту страшном где бучи пустош“, и у Псалмима и Исаији за пустињу."
    - "Јудејски Гесимон је данас Јудејска пустиња, појас јаруга између хевронских брда и Мртвог мора: Ен Геди са својим извором, пећине Нахал Хевера, пећине мртвоморских свитака даље на север, Масада и манастир Мар Саба на њеним ободима, и бедуински логори и пастири између. Брдо Хавила није утврђено."
  hu:
    - "A Jesimón egy héber szó a pusztaságra, amelyet a Biblia köznévként és kerület nevéül is használ, és az Authorised Version hat versben tartja meg névként. A térképen a pont a júdeai sivatagban áll, Ziftől és Maóntól keletre, ahol a hegyvidék kopár krétagerincekben ereszkedik a Holt-tengerhez. Itt mondták a zifeusok Saulnak, hogy Dávid „Hakila halmán, mely a sivatagtól jobbkézre van” rejtőzik, Dávid és emberei „Máon pusztájában valának a mezőségen, a mely a sivatagtól jobbkézre van”, azon az éjszakán pedig, amikor Dávid belopózott Saul táborába, és elvette lándzsáját, „tábort jára Saul a Hakila halmán, mely a puszta átellenében van, az úton”."
    - "A Számok könyvének két verse másik pusztaságra vonatkozik. Izráel útja a Piszga tetejére ért, „a mely a sivatagra néz”, és Bálák Bálámot a Peór tetejére vitte, „a mely a puszta felé néz”: a Jordán-völgy sivatagi síkja a Holt-tenger északi végén, ahol Bét-Jesimót, a „puszták háza” feküdt a moábi dombok lábánál. A szinodális Biblia ennek megfelelően „pusztának” fordítja a szót a Számokban, és névként csak a Sámuelnél tartja meg Jesimónt. A szó ismét feltűnik Mózes énekében, „zordon, sivatag vadonban”, valamint a zsoltárokban és Ézsaiásnál a sivatagra."
    - "A júdeai Jesimón ma a Júdeai-sivatag, a hebroni hegyek és a Holt-tenger közötti szurdokok sávja: Én-Gedi forrásával, a Nahal Hever barlangjai, északabbra a Holt-tengeri tekercsek barlangjai, Masada és a Mar Szaba-kolostor a peremén, és köztük beduin táborok és pásztorok. Hakila dombját nem azonosították."
  fi:
    - "Jesimon on heprean sana autiomaalle, jota Raamattu käyttää sekä yleisnimenä että alueen nimenä, ja Authorised Version säilyttää sen nimenä kuudessa jakeessa. Kartalla piste on Juudan erämaassa, Sifistä ja Maonista itään, missä vuoristo murtuu paljaisiin liitumäkiin kohti Kuollutta merta. Täällä siifiläiset kertoivat Saulille Daavidin piileskelevän ”Gibeat-Hakilassa, joka on kallioerämaasta etelään”, Daavid miehineen oli ”Maaonin erämaassa, aromaassa, kallioerämaasta etelään”, ja Saul leiriytyi ”Gibeat-Hakilaan, joka on kallioerämaan puolella tien varrella” yönä, jolloin Daavid hiipi hänen leiriinsä ja otti hänen peitsensä."
    - "Kaksi jaetta Mooseksen neljännessä kirjassa kuuluvat toiseen autiomaahan. Israelin tie tuli Pisgan huipulle, ”joka kohoaa yli erämaan”, ja Balak vei Bileamin Peorin huipulle, ”joka kohoaa yli erämaan”: Jordanin laakson autiomaan lattia Kuolleenmeren pohjoispäässä, missä Bet-Jesimot, ”autioiden talo”, sijaitsi Moabin kukkuloiden juurella. Synodaalinen Raamattu kääntää sanan siksi ”erämaaksi” Mooseksen neljännessä kirjassa ja säilyttää Jesimonin nimenä vain Samuelin kirjassa. Sana esiintyy vielä Mooseksen laulussa, ”autiosta, ulvovasta korvesta”, sekä Psalmeissa ja Jesajassa autiomaasta."
    - "Juudean Jesimon on nykyään Juudean autiomaa, rotkojen kaistale Hebronin kukkuloiden ja Kuolleenmeren välissä: En-Gedi lähteineen, Nahal Heverin luolat, Kuolleenmeren kirjakääröjen luolat kauempana pohjoisessa, Masada ja Mar Saban luostari sen reunoilla sekä beduiinileirit ja paimenet siinä välissä. Hakilan kukkulaa ei ole tunnistettu."
  vi:
    - "Giê-si-môn là một từ Hê-bơ-rơ chỉ vùng hoang địa, được Kinh Thánh dùng cả như danh từ chung lẫn tên một vùng, và bản Authorised Version giữ nó là tên trong sáu câu. Trên bản đồ điểm này đứng trong đồng vắng Giu-đa, phía đông Xíp và Ma-ôn, nơi miền núi vỡ ra thành những sống đồi đá phấn trơ trụi xuống Biển Chết. Tại đây người Xíp nói với Sau-lơ rằng Đa-vít ẩn “trên gò Ha-ki-la, ở về phía nam của đồng vắng”, Đa-vít và quân của ông ở “nơi đồng vắng Ma-ôn, tại A-ra-ba về phía nam Giê-si-môn”, và Sau-lơ “đóng trại trên gò Ha-ki-la, đối ngang đồng vắng, tại nơi đầu đường” vào đêm Đa-vít lẻn vào trại và lấy ngọn giáo của ông."
    - "Hai câu trong Dân Số Ký thuộc một vùng hoang khác. Con đường của Y-sơ-ra-ên đến “chót núi Phích-ga, là nơi người ta nhìn thấy đồng bằng của sa mạc”, và Ba-lác dẫn Ba-la-am đến “chót núi Phê-ô, đối ngang đồng vắng”: nền sa mạc của thung lũng Giô-đanh ở đầu bắc Biển Chết, nơi Bết-Giê-si-mốt, “nhà của các nơi hoang vu”, nằm ở chân các đồi Mô-áp. Vì vậy bản Synodal dịch từ này là “đồng vắng” trong Dân Số Ký và chỉ giữ Giê-si-môn làm tên trong Sa-mu-ên. Từ này lại xuất hiện trong bài ca của Môi-se, “giữa những tiếng hét la của đồng vắng”, và trong Thi Thiên và Ê-sai chỉ sa mạc."
    - "Giê-si-môn của Giu-đê ngày nay là sa mạc Giu-đê, dải khe vực giữa các đồi Hếp-rôn và Biển Chết: Ên-ghê-đi với con suối, các hang của Nahal Hever, các hang Cuộn Biển Chết xa hơn về phía bắc, Masada và tu viện Mar Saba ở rìa, và các trại Bedouin cùng người chăn chiên ở giữa. Gò Ha-ki-la chưa được xác định."
  ro:
    - "Ieșimon este un cuvânt ebraic pentru pustietate, folosit în Biblie atât ca substantiv comun, cât și ca nume al unui district, iar Versiunea Autorizată îl păstrează ca nume în șase versete. Pe hartă, punctul stă în pustia lui Iuda, la est de Zif și Maon, unde regiunea muntoasă se prăbușește în creste goale de cretă spre Marea Moartă. Aici zifeii i-au spus lui Saul că David se ascunde „în dealul lui Ehela deadreapta Iesemonului”, David și oamenii lui erau „în pustia Maonului spre apus deadreapta Iesemonului”, iar Saul a tăbărât „în dealul Ehelat în fața Iesemului lângă cale” în noaptea în care David s-a strecurat în tabăra lui și i-a luat sulița."
    - "Cele două versete din Numeri țin de o altă pustietate. Drumul lui Israel a ajuns în vârful Pisgăi, „care caută spre fața pustiei”, iar Balac l-a dus pe Balaam în vârful Peorului, „care se întinde spre pustie”: fundul deșertic al văii Iordanului, la capătul de nord al Mării Moarte, unde se afla Bet-Ieșimot, „casa pustietăților”, la poalele dealurilor Moabului. Biblia sinodală traduce deci cuvântul prin „pustie” în Numeri și păstrează Ieșimon ca nume doar în Samuel. Cuvântul apare din nou în cântarea lui Moise, pentru pustia urlătoare și pustiită, și în Psalmi și Isaia pentru deșert."
    - "Ieșimonul iudeean este astăzi Deșertul Iudeii, fâșia de râpe dintre dealurile Hebronului și Marea Moartă: Ein Gedi cu izvorul său, peșterile din Nahal Hever, peșterile Manuscriselor de la Marea Moartă mai la nord, Masada și mănăstirea Mar Saba la marginile lui, și tabere de beduini și păstori între ele. Dealul Hachila nu a fost identificat."
  bg:
    - "Йесимон е еврейска дума за пустош, употребена в Библията и като нарицателно, и като име на област, а Authorised Version я запазва като име в шест стиха. На картата точката стои в Юдейската пустиня, на изток от Зиф и Маон, където планинската област се разпада на голи варовикови хребети към Мъртво море. Тук зифците казаха на Саул, че Давид се крие „на хълма Ехела, който е към юг от Иесимон“, Давид и мъжете му бяха „в пустинята Наон, на полето към юг от Иесимон“, а Саул разположи стан „на хълма Ехела който е срещу Иесимон, при пътя“ в нощта, когато Давид се промъкна в стана му и взе копието му."
    - "Двата стиха в Числа се отнасят до друга пустош. Пътят на Израил стигна до върха на Фасга, „която гледа към Иесимон“, а Валак заведе Валаам на върха на Фегор, „който гледа към Иесимон“: пустинното дъно на Йорданската долина в северния край на Мъртво море, където Бет-Йешимот, „дом на пустошите“, лежеше в подножието на Моавските хълмове. Затова Синодалната Библия превежда думата като „пустиня“ в Числа и запазва Йесимон като име само в Самуил. Думата се появява отново в песента на Мойсей, „в пустиня на дивост и рикание“, и в Псалмите и Исаия за пустинята."
    - "Юдейският Йесимон днес е Юдейската пустиня — ивицата урви между Хевронските хълмове и Мъртво море: Ен-Гади с извора си, пещерите на Нахал Хевер, пещерите на Кумранските ръкописи по на север, Масада и манастирът Мар Саба по краищата ѝ, а между тях — бедуински станове и овчари. Хълмът Хахила не е идентифициран."
