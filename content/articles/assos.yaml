body:
  en:
    - "Assos was a Greek city on the southern coast of the Troad in north-western Asia Minor, built in terraces on a volcanic hill above a small harbour and facing the island of Lesbos across the strait. On its summit stood a Doric temple of Athena of the sixth century BC; in the fourth century Aristotle lived there for some years at the court of the ruler Hermias. Paul came there at the end of his third journey. His companions sailed ahead from Troas round the cape, while he chose the road overland: “we went before to ship, and sailed unto Assos, there intending to take in Paul: for so had he appointed, minding himself to go afoot. And when he met with us at Assos, we took him in, and came to Mitylene.” Why he walked the day's journey alone Luke does not say."
    - "Nothing more is told of Assos in the Bible. The city was excavated by an American expedition in 1881 to 1883 and by Turkish teams since 1981, which have uncovered the city walls, among the best preserved in the Greek world, the agora, theatre, gymnasium and a long street of tombs. Today the site lies above the village of Behramkale in the province of Çanakkale in Turkey, with the restored columns of the temple of Athena on the hilltop."
  ru:
    - "Асс — греческий город на южном берегу Троады на северо-западе Малой Азии, поднимавшийся террасами по вулканическому холму над небольшой гаванью напротив острова Лесбос. На вершине стоял дорический храм Афины VI века до н. э.; в IV веке несколько лет здесь жил Аристотель при дворе правителя Гермия. Павел пришёл сюда в конце третьего путешествия. Его спутники отплыли из Троады вокруг мыса, а он выбрал сухой путь: «Мы пошли вперед на корабль и поплыли в Асс, чтобы взять оттуда Павла; ибо он так приказал нам, намереваясь сам идти пешком. Когда же он сошелся с нами в Ассе, то, взяв его, мы прибыли в Митилину». Почему он прошёл этот дневной путь один, Лука не говорит."
    - "Больше Библия об Ассе ничего не сообщает. Город раскапывала американская экспедиция в 1881–1883 годах и турецкие учёные с 1981 года; открыты городские стены, одни из лучше всего сохранившихся в греческом мире, агора, театр, гимнасий и длинная улица гробниц. Сегодня развалины лежат над деревней Бехрамкале в провинции Чанаккале в Турции, и на вершине холма стоят восстановленные колонны храма Афины."
  uk:
    - "Ассос був грецьким містом на південному узбережжі Троади в північно-західній Малій Азії, збудованим терасами на вулканічному пагорбі над невеликою гаванню і зверненим до острова Лесбос через протоку. На його вершині стояв доричний храм Афіни VI століття до н. е.; у IV столітті там кілька років жив Арістотель при дворі правителя Гермія. Павло прийшов туди наприкінці своєї третьої подорожі. Його супутники попливли вперед із Троади навколо мису, а він обрав дорогу суходолом: «Ми ж, прийшовши до корабля, поплили в Асон, хотївши звідтіля взяти Павла, так бо звелїв, хотївши сам ійти пішки. Як же зійшов ся з нами в Асонї, узявши його, прибули ми в Митилену.» Чому він ішов день дороги сам, Лука не каже."
    - "Більше про Ассос Біблія не розповідає. Місто розкопувала американська експедиція у 1881–1883 рр. і турецькі групи від 1981 року, які виявили міські мури, одні з найкраще збережених у грецькому світі, агору, театр, гімнасій і довгу вулицю гробниць. Нині це місце лежить над селом Бехрамкале в провінції Чанаккале в Туреччині, з відновленими колонами храму Афіни на вершині пагорба."
  es:
    - "Asón era una ciudad griega en la costa meridional de la Tróade, en el noroeste del Asia Menor, construida en terrazas sobre una colina volcánica por encima de un pequeño puerto y frente a la isla de Lesbos al otro lado del estrecho. En su cumbre se alzaba un templo dórico de Atenea del siglo VI a. C.; en el siglo IV Aristóteles vivió allí algunos años en la corte del gobernante Hermias. Pablo llegó allí al final de su tercer viaje. Sus compañeros navegaron por delante desde Troas, rodeando el cabo, mientras él eligió el camino por tierra: «Y nosotros subiendo en el navío, navegamos á Assón, para recibir de allí á Pablo; pues así había determinado que debía él ir por tierra. Y como se juntó con nosotros en Assón, tomándole vinimos á Mitilene.» Por qué recorrió solo la jornada a pie, Lucas no lo dice."
    - "Nada más se cuenta de Asón en la Biblia. La ciudad fue excavada por una expedición estadounidense de 1881 a 1883 y por equipos turcos desde 1981, que han sacado a la luz las murallas de la ciudad, entre las mejor conservadas del mundo griego, el ágora, el teatro, el gimnasio y una larga calle de tumbas. Hoy el sitio se encuentra sobre la aldea de Behramkale, en la provincia de Çanakkale, en Turquía, con las columnas restauradas del templo de Atenea en la cima de la colina."
  pt:
    - "Assôs era uma cidade grega na costa sul da Tróade, no noroeste da Ásia Menor, construída em terraços numa colina vulcânica acima de um pequeno porto e voltada para a ilha de Lesbos, do outro lado do estreito. No cume erguia-se um templo dórico de Atena do século VI a.C.; no século IV, Aristóteles viveu ali alguns anos na corte do governante Hermias. Paulo chegou lá no fim da terceira viagem. Seus companheiros navegaram à frente desde Trôade, contornando o cabo, enquanto ele escolheu o caminho por terra: “indo na frente para o navio, navegamos para Assôs, com a intenção de receber Paulo a bordo ali; ele havia decidido seguir até lá por terra. Quando ele nos encontrou em Assôs, nós o recebemos a bordo e fomos para Mitilene”. Por que ele fez sozinho a jornada de um dia a pé, Lucas não diz."
    - "Nada mais se conta de Assôs na Bíblia. A cidade foi escavada por uma expedição americana em 1881–1883 e por equipes turcas desde 1981, que trouxeram à luz as muralhas da cidade, entre as mais bem conservadas do mundo grego, a ágora, o teatro, o ginásio e uma longa rua de túmulos. Hoje o sítio fica acima da aldeia de Behramkale, na província de Çanakkale, na Turquia, com as colunas restauradas do templo de Atena no alto da colina."
  de:
    - "Assos war eine griechische Stadt an der Südküste der Troas im Nordwesten Kleinasiens, in Terrassen auf einem Vulkanhügel über einem kleinen Hafen erbaut und der Insel Lesbos jenseits der Meerenge zugewandt. Auf ihrem Gipfel stand ein dorischer Athenatempel des 6. Jahrhunderts v. Chr.; im 4. Jahrhundert lebte Aristoteles einige Jahre dort am Hof des Herrschers Hermias. Paulus kam am Ende seiner dritten Reise dorthin. Seine Gefährten segelten von Troas voraus um das Kap, während er den Landweg wählte: „Wir aber zogen voran auf dem Schiff und fuhren gen Assos und wollten daselbst Paulus zu uns nehmen; denn er hatte es also befohlen, und er wollte zu Fuße gehen. Als er nun zu uns traf zu Assos, nahmen wir ihn zu uns und kamen gen Mitylene.“ Warum er die Tagesreise allein zu Fuß ging, sagt Lukas nicht."
    - "Mehr wird von Assos in der Bibel nicht erzählt. Die Stadt wurde 1881 bis 1883 von einer amerikanischen Expedition und seit 1981 von türkischen Teams ausgegraben, die die Stadtmauern freilegten, unter den am besten erhaltenen der griechischen Welt, dazu Agora, Theater, Gymnasion und eine lange Gräberstraße. Heute liegt die Stätte über dem Dorf Behramkale in der Provinz Çanakkale in der Türkei, mit den wiederaufgerichteten Säulen des Athenatempels auf dem Hügel."
  fr:
    - "Assos était une cité grecque sur la côte sud de la Troade, au nord-ouest de l’Asie Mineure, bâtie en terrasses sur une colline volcanique au-dessus d’un petit port et faisant face à l’île de Lesbos de l’autre côté du détroit. À son sommet se dressait un temple dorique d’Athéna du VIe siècle av. J.-C. ; au IVe siècle, Aristote y vécut quelques années à la cour du souverain Hermias. Paul y vint à la fin de son troisième voyage. Ses compagnons firent voile devant lui depuis Troas autour du cap, tandis qu’il choisissait la route par terre : « Pour nous, nous précédâmes Paul sur le navire, et nous fîmes voile pour Assos, où nous étions convenus de le reprendre, parce qu’il devait faire la route à pied. Lorsqu’il nous eut rejoints à Assos, nous le prîmes à bord, et nous allâmes à Mytilène. » Pourquoi il fit seul la journée à pied, Luc ne le dit pas."
    - "La Bible ne dit rien d’autre d’Assos. La ville fut fouillée par une expédition américaine en 1881-1883 et par des équipes turques depuis 1981, qui ont dégagé les remparts, parmi les mieux conservés du monde grec, l’agora, le théâtre, le gymnase et une longue rue de tombes. Aujourd’hui le site se trouve au-dessus du village de Behramkale, dans la province de Çanakkale, en Turquie, avec les colonnes restaurées du temple d’Athéna au sommet de la colline."
  it:
    - "Asso era una città greca sulla costa meridionale della Troade, nell’Asia Minore nord-occidentale, costruita a terrazze su una collina vulcanica sopra un piccolo porto e di fronte all’isola di Lesbo oltre lo stretto. Sulla sua sommità sorgeva un tempio dorico di Atena del VI secolo a.C.; nel IV secolo Aristotele vi visse per alcuni anni alla corte del sovrano Ermia. Paolo vi giunse alla fine del suo terzo viaggio. I suoi compagni salparono avanti da Troade doppiando il capo, mentre egli scelse la strada per terra: «Quanto a noi, andati innanzi a bordo, navigammo verso Asso, con intenzione di prender quivi Paolo con noi; poiché egli avea fissato così, volendo fare quel tragitto per terra. E avendoci incontrati ad Asso, lo prendemmo con noi, e venimmo a Mitilene». Perché percorse da solo la giornata di cammino Luca non lo dice."
    - "Nulla più si dice di Asso nella Bibbia. La città fu scavata da una spedizione americana nel 1881–1883 e da squadre turche dal 1981, che hanno portato alla luce le mura cittadine, fra le meglio conservate del mondo greco, l’agorà, il teatro, il ginnasio e una lunga via di tombe. Oggi il sito si trova sopra il villaggio di Behramkale nella provincia di Çanakkale in Turchia, con le colonne restaurate del tempio di Atena sulla cima della collina."
  pl:
    - "Assos było greckim miastem na południowym wybrzeżu Troady w północno-zachodniej Azji Mniejszej, zbudowanym tarasami na wulkanicznym wzgórzu nad małym portem, naprzeciw wyspy Lesbos po drugiej stronie cieśniny. Na jego szczycie stała dorycka świątynia Ateny z VI wieku p.n.e.; w IV wieku Arystoteles mieszkał tam przez kilka lat na dworze władcy Hermiasza. Paweł przybył tam pod koniec trzeciej podróży. Jego towarzysze popłynęli naprzód z Troady wokół przylądka, a on wybrał drogę lądową: „A my przyszedłszy wprzód do okrętu, puściliśmy się do Assonu, abyśmy stamtąd wzięli Pawła; albowiem tak był postanowił, mając sam pieszo iść. A gdy się z nami zszedł w Assonie, wziąwszy go, przyjechaliśmy do Mityleny”. Dlaczego szedł samotnie dzień drogi, Łukasz nie mówi."
    - "Biblia nie mówi o Assos nic więcej. Miasto badała amerykańska wyprawa w latach 1881–1883 i zespoły tureckie od 1981 roku, które odsłoniły mury miejskie, jedne z najlepiej zachowanych w świecie greckim, agorę, teatr, gimnazjon i długą ulicę grobów. Dziś stanowisko leży nad wsią Behramkale w prowincji Çanakkale w Turcji, z odrestaurowanymi kolumnami świątyni Ateny na szczycie wzgórza."
  nl:
    - "Assos was een Griekse stad aan de zuidkust van de Troas in het noordwesten van Klein-Azië, in terrassen gebouwd op een vulkanische heuvel boven een kleine haven, met uitzicht op het eiland Lesbos aan de overkant van de zeestraat. Op haar top stond een Dorische tempel van Athena uit de zesde eeuw v.Chr.; in de vierde eeuw woonde Aristoteles er enkele jaren aan het hof van de heerser Hermias. Paulus kwam er aan het eind van zijn derde reis. Zijn metgezellen voeren van Troas vooruit om de kaap, terwijl hij de landweg koos: “Maar wij, vooruit naar het schip gegaan zijnde, voeren af naar Assus, waar wij Paulus zouden innemen; want hij had het alzo bevolen, en hij zelf zou te voet gaan. En als hij zich te Assus bij ons gevoegd had, namen wij hem in, en kwamen te Mitylene.” Waarom hij de dagreis alleen liep, zegt Lukas niet."
    - "Verder wordt er in de Bijbel niets over Assos verteld. De stad werd opgegraven door een Amerikaanse expeditie in 1881 tot 1883 en sinds 1981 door Turkse teams, die de stadsmuren, onder de best bewaarde van de Griekse wereld, de agora, het theater, het gymnasion en een lange straat van graven blootlegden. Tegenwoordig ligt de plaats boven het dorp Behramkale in de provincie Çanakkale in Turkije, met de herstelde zuilen van de tempel van Athena op de heuveltop."
  cs:
    - "Assos bylo řecké město na jižním pobřeží Troady v severozápadní Malé Asii, vystavěné na terasách na sopečném pahorku nad malým přístavem a obrácené přes úžinu k ostrovu Lesbos. Na jeho vrcholu stál dórský chrám Athény z 6. století př. n. l.; ve 4. století tam Aristotelés několik let žil na dvoře vládce Hermia. Pavel sem přišel na konci své třetí cesty. Jeho společníci vyplouvali z Troady napřed kolem mysu, zatímco on zvolil cestu po souši: „My pak vstoupivše na lodí, plavili jsme se do Asson, odtud majíce k sobě vzíti Pavla; neb jest byl tak poručil, maje sám jíti po zemi. A když se k nám připojil v Asson, vzavše jej, přijeli jsme do Mitylénu.“ Proč šel tu denní cestu sám, Lukáš neříká."
    - "Bible o Assu už nic neříká. Město vykopávala americká expedice v letech 1881 až 1883 a od roku 1981 turecké týmy, které odkryly městské hradby, patřící k nejlépe dochovaným v řeckém světě, agoru, divadlo, gymnasion a dlouhou ulici hrobek. Dnes místo leží nad vesnicí Behramkale v provincii Çanakkale v Turecku, s obnovenými sloupy chrámu Athény na vrcholu pahorku."
  sv:
    - "Assos var en grekisk stad på södra kusten av Troas i nordvästra Mindre Asien, byggd i terrasser på en vulkanisk kulle ovanför en liten hamn och vänd mot ön Lesbos över sundet. På dess topp stod ett doriskt tempel för Athena från 500-talet f.Kr.; på 300-talet bodde Aristoteles där några år vid härskaren Hermias’ hov. Paulus kom dit vid slutet av sin tredje resa. Hans följeslagare seglade i förväg från Troas runt uddan, medan han själv valde landvägen: ”Men vi andra gingo i förväg ombord på skeppet och avseglade till Assos, där vi tänkte taga Paulus ombord; ty så hade han förordnat, eftersom han själv tänkte fara land vägen. Och när han sammanträffade med oss i Assos, togo vi honom ombord och kommo sedan till Mitylene.” Varför han gick dagens färd ensam säger inte Lukas."
    - "Ingenting mer berättas om Assos i Bibeln. Staden grävdes ut av en amerikansk expedition 1881–1883 och av turkiska team sedan 1981, som har blottlagt stadsmurarna, bland de bäst bevarade i den grekiska världen, agoran, teatern, gymnasiet och en lång gravgata. I dag ligger platsen ovanför byn Behramkale i provinsen Çanakkale i Turkiet, med Athenatemplets restaurerade pelare på kullens topp."
  nb:
    - "Assos var en gresk by på sørkysten av Troas i nordvestlige Lilleasia, bygd i terrasser på en vulkansk høyde over en liten havn og vendt mot øya Lesbos over sundet. På toppen sto et dorisk tempel for Athene fra 500-tallet f.Kr.; på 300-tallet bodde Aristoteles der noen år ved hoffet til herskeren Hermias. Paulus kom dit på slutten av sin tredje reise. Følgesvennene hans seilte i forveien fra Troas rundt neset, mens han valgte veien over land: «Vi hadde imens gått ombord i skibet og seilte til Assus, hvor vi skulde ta Paulus ombord; for det hadde han pålagt oss; selv vilde han gå til fots. Da han nu møtte oss i Assus, tok vi ham ombord, og kom til Mitylene». Hvorfor han gikk dagsreisen alene, sier ikke Lukas."
    - "Mer fortelles ikke om Assos i Bibelen. Byen ble gravd ut av en amerikansk ekspedisjon i 1881 til 1883 og av tyrkiske lag siden 1981, som har avdekket bymurene, blant de best bevarte i den greske verden, agoraen, teateret, gymnasiet og en lang gate av graver. I dag ligger stedet over landsbyen Behramkale i provinsen Çanakkale i Tyrkia, med de restaurerte søylene fra Athene-tempelet på toppen."
  tl:
    - "Ang Ason ay lungsod na Griyego sa katimugang baybayin ng Troas sa hilagang-kanlurang Asia Minor, itinayo sa mga patag sa isang burol na bulkaniko sa itaas ng maliit na daungan at nakaharap sa pulo ng Lesbos sa kabila ng kipot. Sa tuktok nito ay nakatayo ang templong Doric ni Atenea noong ika-6 na siglo BK; noong ika-4 na siglo, tumira roon si Aristoteles nang ilang taon sa korte ng pinunong si Hermias. Dumating dito si Pablo sa dulo ng ikatlong paglalakbay. Naglayag ang kaniyang mga kasama mula Troas paikot sa kapa, habang pinili niya ang daan sa lupa: “kami, na nangauna sa daong, ay nagsilayag na patungong Ason, na doon namin inaakalang ilulan si Pablo: sapagka't gayon ang kaniyang ipinasiya, na ninanasa niyang maglakad. At nang salubungin niya kami sa Ason, siya'y inilulan namin, at nagsiparoon kami sa Mitilene.” Hindi sinasabi ni Lucas kung bakit mag-isa siyang naglakad."
    - "Wala nang isinasalaysay tungkol sa Ason ang Biblia. Hinukay ang lungsod ng isang ekspedisyong Amerikano noong 1881 hanggang 1883 at ng mga pangkat na Turko mula 1981, na nakatuklas ng mga pader ng lungsod, kabilang sa pinakamahusay na napanatili sa daigdig na Griyego, ang agora, teatro, gymnasium at mahabang kalye ng mga libingan. Ang lugar ay nasa itaas ng nayon ng Behramkale sa lalawigan ng Çanakkale sa Turkey ngayon, na may naibalik na mga haligi ng templo ni Atenea sa tuktok ng burol."
  da:
    - "Assos var en græsk by på Troas' sydkyst i det nordvestlige Lilleasien, bygget i terrasser på en vulkansk bakke over en lille havn og vendt mod øen Lesbos over strædet. På dens top stod et dorisk Athene-tempel fra 500-tallet f.Kr.; i 300-tallet boede Aristoteles dér nogle år ved herskeren Hermias' hof. Paulus kom hertil ved slutningen af sin tredje rejse. Hans ledsagere sejlede forud fra Troas rundt om forbjerget, mens han valgte landevejen: »Men vi gik forud til Skibet og sejlede til Assus og skulde derfra tage Paulus med; thi saaledes havde han bestemt det, da han selv vilde gaa til Fods. Da han nu stødte til os i Assus, toge vi ham om Bord og kom til Mitylene.« Hvorfor han gik dagens rejse alene, siger Lukas ikke."
    - "Mere fortælles der ikke om Assos i Bibelen. Byen blev udgravet af en amerikansk ekspedition 1881–1883 og af tyrkiske hold siden 1981, som har afdækket bymurene, blandt de bedst bevarede i den græske verden, agoraen, teatret, gymnasiet og en lang gade af grave. I dag ligger stedet over landsbyen Behramkale i Çanakkale-provinsen i Tyrkiet, med Athene-templets restaurerede søjler på bakketoppen."
scripture:
  - Acts.20.13-Acts.20.14
sources:
  - "Strabo, Geography 13.1.57"
  - "J. T. Clarke, F. H. Bacon and R. Koldewey, Investigations at Assos: Drawings and Photographs of the Buildings and Objects Discovered during the Excavations of 1881–1882–1883 (1902–1921)"
  - "C. J. Hemer, The Book of Acts in the Setting of Hellenistic History (1989)"
