body:
  en:
    - "En-dor was a town at the eastern end of the valley of Jezreel, on the north side of the hill of Moreh between Mount Tabor and Mount Gilboa. Joshua lists it with Beth-shean, Ibleam, Dor, Taanach and Megiddo among the Canaanite towns inside Issachar and Asher that fell to Manasseh. Its fame comes from the night before Gilboa. With the Philistines camped at Shunem across the valley, “Then said Saul unto his servants, Seek me a woman that hath a familiar spirit, that I may go to her, and enquire of her. And his servants said to him, Behold, there is a woman that hath a familiar spirit at Endor”. Saul went to her by night in disguise, and the spirit of Samuel told him that he and his sons would die the next day. Psalm 83 (82 in the Synodal numbering) recalls the defeat of Sisera and Jabin at the Kishon, “Which perished at Endor: they became as dung for the earth”."
    - "Eusebius places Aendor four miles south of Tabor, and the name survived in Indur, an Arab village on the northern slope of the hill of Moreh about 6 km south of Tabor, abandoned in 1948. The ancient town is sought at Khirbet es-Safsafa just above it, where Iron Age pottery has been collected, the first candidate on the map; Tell el-Ajjul and Indur itself are also listed. Because Joshua lists En-dor with Taanach and Megiddo, and the psalm ties it to the battle that Judges sets “in Taanach by the waters of Megiddo”, some have looked instead toward the valley's western end, at Tell Abu Qedeis or Khirbet Jadurah near Taanach. No excavation has settled the matter."
    - "Today the ruins lie beside the Israeli kibbutz Ein Dor, founded in 1948 and named after the town, which keeps a small archaeological museum of finds from the district."
  ru:
    - "Ен-Дор — город на восточном краю долины Изреель, на северной стороне холма Море между горами Фавор и Гелвуй. Книга Иисуса Навина числит его с Беф-Саном, Ивлеамом, Дором, Фаанахом и Мегиддоном среди ханаанских городов внутри Иссахара и Асира, доставшихся Манассии. Слава его — от ночи перед Гелвуем. Когда Филистимляне стояли станом в Сонаме по ту сторону долины, «Тогда Саул сказал слугам своим: сыщите мне женщину волшебницу, и я пойду к ней и спрошу ее. И отвечали ему слуги его: здесь в Аэндоре есть женщина волшебница». Саул пошёл к ней ночью, переодетый, и дух Самуила сказал ему, что завтра он и сыновья его умрут. Псалом 82 (83 по еврейскому счёту) вспоминает поражение Сисары и Иавина у Киссона: «которые истреблены в Аендоре, сделались навозом для земли»."
    - "Евсевий помещает Аендор в четырёх милях к югу от Фавора, и имя сохранилось в Индуре, арабской деревне на северном склоне холма Море примерно в 6 км к югу от Фавора, покинутой в 1948 году. Древний город ищут в Хирбет-эс-Сафсафе прямо над ней, где собрана керамика железного века, — первый кандидат на карте; Телль-эль-Аджуль и сам Индур тоже названы. Поскольку Иисус Навин числит Ен-Дор с Фаанахом и Мегиддоном, а псалом связывает его с битвой, которую книга Судей помещает «в Фанаахе у вод Мегиддонских», некоторые смотрели к западному краю долины, на Телль-Абу-Кедейс или Хирбет-Джадуру близ Фаанаха. Раскопки вопроса не решили."
    - "Сегодня развалины лежат рядом с израильским кибуцем Эйн-Дор, основанным в 1948 году и названным по городу; в нём есть небольшой археологический музей находок из округи."
  uk:
    - "Ен-Дор було містом на східному краї долини Їзреель, на північному боці пагорба Море між горою Фавор і горою Гільбоа. Ісус Навин перелічує його разом із Бет-Шеаном, Івлеамом, Дором, Таанахом і Мегіддо серед ханаанських міст усередині Іссахара й Асіра, що дісталися Манасії. Його слава походить від ночі перед Гільбоа. Коли филистимляни отаборилися в Сунемі за долиною, «І дав Саул прибічникам своїм наказ: Ізнайдїте менї жінку-чарівницю; пійду до неї та спитаю. І відказали йому прибічники його: В Аендорі є така женщина, що віщує (за підмогою визваного з того сьвіту духа)». Саул пішов до неї вночі, переодягнений, і дух Самуїла сказав йому, що він і його сини помруть наступного дня. Псалом 83 (82 за синодальною нумерацією) згадує поразку Сісари та Явіна біля Кішону: «Котрі, знищені коло Ендора, гноєм для землї стали»."
    - "Євсевій розміщує Аендор за чотири милі на південь від Фавору, і назва збереглася в Індурі, арабському селі на північному схилі пагорба Море приблизно за 6 км на південь від Фавору, покинутому в 1948 р. Давнє місто шукають у Хірбет-ес-Сафсафі просто над ним, де зібрано кераміку залізної доби, — перший кандидат на мапі; Телль-ель-Аджжуль та сам Індур також перелічені. Оскільки Ісус Навин перелічує Ен-Дор з Таанахом і Мегіддо, а псалом пов'язує його з битвою, яку Книга Суддів ставить «в Танаах у вод Мегидонських», дехто шукав його натомість у західному кінці долини, у Телль-Абу-Кудейсі або Хірбет-Джадурі поблизу Таанаха. Жодні розкопки не вирішили питання."
    - "Сьогодні руїни лежать поряд із ізраїльським кібуцом Ейн-Дор, заснованим у 1948 р. і названим на честь міста, який тримає невеликий археологічний музей знахідок з округи."
  es:
    - "Endor era una ciudad en el extremo oriental del valle de Jezreel, al norte del collado de Moré, entre el Tabor y el Gilboa. Josué la enumera con Betsán, Ibleam, Dor, Taanac y Meguido entre las ciudades cananeas en Isacar y Aser que tocaron a Manasés. Su fama viene de la noche antes de Gilboa. Con los filisteos en Sunem, al otro lado, «Entonces Saúl dijo á sus criados: Buscadme una mujer que tenga espíritu de pythón, para que yo vaya á ella, y por medio de ella pregunte. Y sus criados le respondieron: He aquí hay una mujer en Endor que tiene espíritu de pythón». Saúl fue a verla de noche, disfrazado; el espíritu de Samuel le dijo que él y sus hijos morirían al día siguiente. El Salmo 83 (82 en la numeración sinodal) recuerda la derrota de Sísara y Jabín en el Cisón, «Que perecieron en Endor, fueron hechos muladar de la tierra»."
    - "Eusebio sitúa Aendor a cuatro millas al sur del Tabor, y el nombre sobrevivió en Indur, una aldea árabe en la ladera norte del collado de Moré, a unos 6 km al sur del Tabor, abandonada en 1948. La ciudad antigua se busca en Khirbet es-Safsafa, justo encima de ella, donde se ha recogido cerámica de la Edad del Hierro, el primer candidato del mapa; también figuran Tell el-Ajjul y la propia Indur. Como Josué enumera Endor con Taanac y Meguido, y el salmo la vincula con la batalla que Jueces sitúa «en Taanac, junto á las aguas de Megiddo», algunos han mirado en cambio hacia el extremo occidental del valle, a Tell Abu Qedeis o Khirbet Jadurah, cerca de Taanac. Ninguna excavación ha zanjado la cuestión."
    - "Hoy las ruinas se hallan junto al kibutz israelí Ein Dor, fundado en 1948 y llamado así por la ciudad, que conserva un pequeño museo arqueológico con hallazgos de la región."
  pt:
    - "En-Dor era uma cidade no extremo leste do vale de Jezreel, no lado norte da colina de Moré, entre o Monte Tabor e o Monte Gilboa. Josué a lista com Bete-Seã, Ibleão, Dor, Taanaque e Megido entre as cidades cananeias dentro de Issacar e Aser que couberam a Manassés. Sua fama vem da noite anterior a Gilboa. Com os filisteus acampados em Suném, do outro lado do vale, “Então Saul disse aos seus servos: ‘Procurem para mim uma mulher que consulte espíritos, para que eu vá até ela e a consulte.’ Seus servos responderam: ‘Há uma mulher que consulta espíritos em En-Dor.’” Saul foi ter com ela de noite, disfarçado, e o espírito de Samuel lhe disse que ele e seus filhos morreriam no dia seguinte. O Salmo 83 (82 na numeração sinodal) recorda a derrota de Sísera e Jabim no Quisom, “que pereceram em Endor, que se tornaram como esterco para a terra”."
    - "Eusébio situa Aendor a quatro milhas ao sul do Tabor, e o nome sobreviveu em Indur, uma aldeia árabe na encosta norte da colina de Moré, cerca de 6 km ao sul do Tabor, abandonada em 1948. A antiga cidade é procurada em Khirbet es-Safsafa, logo acima dela, onde se recolheu cerâmica da Idade do Ferro, o primeiro candidato no mapa; Tell el-Ajjul e a própria Indur também estão listados. Como Josué lista En-Dor com Taanaque e Megido, e o salmo a liga à batalha que Juízes situa “em Taanaque, junto às águas de Megido”, alguns procuraram antes o extremo ocidental do vale, em Tell Abu Qedeis ou Khirbet Jadurah, perto de Taanaque. Nenhuma escavação resolveu a questão."
    - "Hoje as ruínas ficam junto ao kibutz israelense Ein Dor, fundado em 1948 e nomeado em honra da cidade, que mantém um pequeno museu arqueológico com achados do distrito."
  de:
    - "En-Dor war eine Stadt am Ostende der Ebene Jesreel, an der Nordseite des Hügels More zwischen dem Berg Tabor und dem Gilboa. Josua führt sie mit Bet-Schean, Jibleam, Dor, Taanach und Megiddo unter den kanaanäischen Städten in Issachar und Asser auf, die Manasse zufielen. Ihr Ruhm stammt aus der Nacht vor dem Gilboa. Die Philister lagerten bei Schunem jenseits der Ebene: „Da sprach Saul zu seinen Knechten: Sucht mir ein Weib, die einen Wahrsagergeist hat, daß ich zu ihr gehe und sie frage. Seine Knechte sprachen zu ihm: Siehe, zu Endor ist ein Weib, die hat einen Wahrsagergeist.“ Saul ging verkleidet bei Nacht zu ihr, und der Geist Samuels sagte ihm, er und seine Söhne würden tags darauf sterben. Psalm 83 (synodal 82) erinnert an Siseras und Jabins Niederlage am Kischon, „die vertilgt wurden bei Endor und wurden zu Kot auf der Erde“."
    - "Eusebius setzt Aendor vier Meilen südlich des Tabor an, und der Name lebte fort in Indur, einem arabischen Dorf am Nordhang des Hügels More etwa 6 km südlich des Tabor, das 1948 verlassen wurde. Die antike Stadt wird in Khirbet es-Safsafa unmittelbar oberhalb davon gesucht, wo eisenzeitliche Keramik gesammelt wurde, der erste Kandidat auf der Karte; Tell el-Ajjul und Indur selbst werden ebenfalls aufgeführt. Weil Josua En-Dor mit Taanach und Megiddo aufführt und der Psalm es mit der Schlacht verbindet, die das Richterbuch „zu Thaanach am Wasser Megiddos“ ansetzt, haben manche stattdessen zum Westende der Ebene geblickt, nach Tell Abu Qedeis oder Khirbet Jadurah bei Taanach. Keine Ausgrabung hat die Frage entschieden."
    - "Heute liegen die Ruinen neben dem israelischen Kibbuz Ein Dor, 1948 gegründet und nach der Stadt benannt, der ein kleines archäologisches Museum mit Funden aus der Gegend unterhält."
  fr:
    - "En-Dor était une ville à l’est de la vallée de Jizreel, sur le versant nord de la colline de Moré, entre le Mont Thabor et le Mont Guilboa. Josué la range avec Beth-Schean, Jibleam, Dor, Thaanac et Meguiddo parmi les villes cananéennes d’Issacar et d’Aser tombées à Manassé. Sa célébrité vient de la nuit avant Guilboa. Les Philistins campant à Sunem, en face, « Saül dit à ses serviteurs : Cherchez-moi une femme qui évoque les morts, et j’irai la consulter. Ses serviteurs lui dirent : Voici, à En-Dor il y a une femme qui évoque les morts ». Saül alla la voir de nuit, déguisé, et l’esprit de Samuel lui annonça sa mort et celle de ses fils le lendemain. Le psaume 83 (82 en numérotation synodale) rappelle la défaite de Sisera et de Jabin au Kison : « Ils ont été détruits à En-Dor, ils sont devenus du fumier pour la terre »."
    - "Eusèbe place Aendor à quatre milles au sud du Thabor, et le nom survécut dans Indur, village arabe sur le versant nord de la colline de Moré à environ 6 km au sud du Thabor, abandonné en 1948. La ville antique est cherchée à Khirbet es-Safsafa, juste au-dessus, où de la poterie de l’âge du Fer a été recueillie, premier candidat de la carte ; Tell el-Ajjul et Indur même sont aussi mentionnés. Comme Josué cite En-Dor avec Thaanac et Meguiddo, et que le psaume la rattache à la bataille que les Juges placent « à Thaanac, aux eaux de Meguiddo », certains ont regardé plutôt vers l’extrémité ouest de la vallée, à Tell Abu Qedeis ou Khirbet Jadurah près de Thaanac. Aucune fouille n’a tranché."
    - "Aujourd’hui, les ruines se trouvent à côté du kibboutz israélien Ein Dor, fondé en 1948 et nommé d’après la ville, qui conserve un petit musée archéologique des trouvailles du district."
  it:
    - "Endor era una città all’estremità orientale della valle di Izreel, sul lato nord del Colle di Morè fra il Monte Tabor e il Monte Gelboe. Giosuè la elenca con Beth-Scean, Ibleam, Dor, Taanach e Meghiddo fra le città cananee in Issacar e Aser toccate a Manasse. La sua fama viene dalla notte prima di Gelboe. Con i Filistei accampati a Sunem, di là dalla valle, «Allora Saul disse ai suoi servi: Cercatemi una donna che sappia evocar gli spiriti ed io andrò da lei a consultarla. I servi gli dissero: Ecco, a En-Dor v’è una donna che evoca gli spiriti». Saul andò da lei di notte, travestito, e lo spirito di Samuele gli disse che lui e i suoi figli sarebbero morti il giorno dopo. Il Salmo 83 (82 nella numerazione sinodale) ricorda la sconfitta di Sisara e di Iabin al Kison, «i quali furon distrutti a Endor, e serviron di letame alla terra»."
    - "Eusebio colloca Aendor a quattro miglia a sud del Tabor, e il nome sopravvisse in Indur, un villaggio arabo sul versante settentrionale del Colle di Morè a circa 6 km a sud del Tabor, abbandonato nel 1948. L’antica città si cerca a Khirbet es-Safsafa, appena sopra di esso, dove è stata raccolta ceramica dell’età del Ferro, il primo candidato sulla mappa; sono elencati anche Tell el-Ajjul e la stessa Indur. Poiché Giosuè elenca Endor con Taanach e Meghiddo, e il salmo la lega alla battaglia che i Giudici collocano «a Taanac, presso le acque di Meghiddo», alcuni hanno guardato invece all’estremità occidentale della valle, a Tell Abu Qedeis o a Khirbet Jadurah presso Taanach. Nessuno scavo ha risolto la questione."
    - "Oggi le rovine si trovano accanto al kibbutz israeliano di Ein Dor, fondato nel 1948 e così chiamato dalla città, che conserva un piccolo museo archeologico con reperti del distretto."
  pl:
    - "En-Dor było miastem na wschodnim krańcu doliny Jizreel, po północnej stronie wzgórza More między górą Tabor a górą Gilboa. Jozue wymienia je z Bet-Szean, Jibleam, Dor, Taanak i Megiddo wśród kananejskich miast w obrębie Issachara i Aszera, które przypadły Manassesowi. Jego sława pochodzi z nocy przed Gilboa. Gdy Filistyni obozowali w Szunem po drugiej stronie doliny, „Przetoż rzekł Saul do sług swoich: Szukajcie mi niewiasty, któraby miała ducha wieszczego, a pójdę do niej, i wywiem się przez nię. I rzekli słudzy jego do niego: Oto, niewiasta w Endor, mająca ducha wieszczego”. Saul poszedł do niej nocą w przebraniu, a duch Samuela powiedział mu, że on i jego synowie umrą następnego dnia. Psalm 83 (82 w numeracji synodalnej) wspomina klęskę Sisery i Jabina u Kiszonu: „Którzy są wygładzeni w Endor; stali się jako gnój na ziemi”."
    - "Euzebiusz umieszcza Aendor cztery mile na południe od Taboru, a nazwa przetrwała w Indur, arabskiej wsi na północnym stoku wzgórza More około 6 km na południe od Taboru, opuszczonej w 1948 r. Dawnego miasta szuka się w Chirbet es-Safsafa tuż nad nią, gdzie zebrano ceramikę z epoki żelaza, pierwszym kandydacie na mapie; wymienia się też Tell el-Adżul i sam Indur. Ponieważ Jozue wymienia En-Dor z Taanak i Megiddo, a psalm wiąże je z bitwą, którą Księga Sędziów umieszcza „w Tanach u wód Magieddo”, niektórzy szukali go raczej ku zachodniemu końcowi doliny, w Tell Abu Kedejs lub Chirbet Dżadura koło Taanak. Żadne wykopaliska nie rozstrzygnęły sprawy."
    - "Dziś ruiny leżą obok izraelskiego kibucu Ejn Dor, założonego w 1948 r. i nazwanego od miasta, który prowadzi małe muzeum archeologiczne ze znaleziskami z okolicy."
  nl:
    - "En-Dor was een stad aan het oostelijke einde van de vallei van Jizreël, aan de noordkant van de heuvel More tussen de Tabor en de Gilboa. Jozua noemt haar met Beth-Sean, Jibleam, Dor, Taänach en Megiddo onder de Kanaänitische steden in Issachar en Aser die Manasse toekwamen. Haar faam: de nacht voor Gilboa. Met de Filistijnen te Sunem aan de overzijde, “zeide Saul tot zijn knechten: Zoekt mij een vrouw, die een waarzeggenden geest heeft, dat ik tot haar ga, en door haar onderzoeke. Zijn knechten nu zeiden tot hem: Zie, te Endor is een vrouw, die een waarzeggenden geest heeft”. Saul ging bij nacht vermomd naar haar, en Samuëls geest zei hem dat hij en zijn zonen de volgende dag zouden sterven. Psalm 83 (82 in de Synodale nummering) herinnert aan de nederlaag van Sisera en Jabin bij de Kison: “Die verdelgd zijn te Endor; zij zijn geworden tot drek der aarde”."
    - "Eusebius plaatst Aendor vier mijl ten zuiden van de Tabor, en de naam leefde voort in Indur, een Arabisch dorp op de noordelijke helling van de heuvel More zo'n 6 km ten zuiden van de Tabor, in 1948 verlaten. De oude stad wordt gezocht bij Khirbet es-Safsafa net erboven, waar IJzertijdaardewerk is verzameld, de eerste kandidaat op de kaart; Tell el-Ajjul en Indur zelf staan ook vermeld. Omdat Jozua En-Dor noemt met Taänach en Megiddo, en de psalm haar verbindt met de slag die Richteren plaatst “te Thaanach aan de wateren van Megiddo”, hebben sommigen in plaats daarvan naar het westeinde van de vallei gekeken, naar Tell Abu Qedeis of Khirbet Jadurah bij Taänach. Geen opgraving heeft de zaak beslecht."
    - "Tegenwoordig liggen de ruïnes naast de Israëlische kibboets Ein Dor, in 1948 gesticht en naar de stad genoemd, die een klein archeologisch museum met vondsten uit de streek bewaart."
  cs:
    - "Én-dór bylo město na východním konci Jizreelského údolí, na severní straně pahorku Móre mezi horou Tábor a horou Gilboa. Jozue je uvádí s Bét-šanem, Jibleamem, Dórem, Taanachem a Megidem mezi kanaánskými městy uvnitř Isachara a Ašera, která připadla Manasesovi. Jeho proslulost pochází z noci před Gilboou. Když Pelištejci tábořili u Šúnemu naproti přes údolí, „Protož řekl Saul služebníkům svým: Pohledejte mi ženy mající ducha věštího, i půjdu k ní a poradím se skrze ni. Jemuž odpověděli služebníci jeho: Aj, žena mající ducha věštího v Endor“. Saul šel k ní v noci v přestrojení, a duch Samuelův mu řekl, že on a jeho synové příštího dne zemřou. Žalm 83 (v synodálním číslování 82) připomíná porážku Sisery a Jabína u Kíšonu, „Kteříž jsou do konce vyhlazeni v Endor, a učiněni hnůj země“."
    - "Eusebios klade Aendor čtyři míle jižně od Táboru a jméno se zachovalo v Indur, arabské vesnici na severním svahu pahorku Móre asi 6 km jižně od Táboru, opuštěné roku 1948. Antické město se hledá v Khirbet es-Safsafa těsně nad ní, kde byla sebrána keramika z doby železné, což je první kandidát na mapě; uvedeny jsou také Tell el-Ajjul a sama Indur. Protože Jozue uvádí Én-dór s Taanachem a Megidem a žalm jej váže k bitvě, kterou Kniha soudců klade „v Tanach při vodách Mageddo“, hledali někteří místo toho směrem k západnímu konci údolí, v Tell Abu Qedeis nebo Khirbet Jadurah u Taanachu. Žádná vykopávka věc nerozhodla."
    - "Dnes leží zříceniny vedle izraelského kibucu Ein Dor, založeného roku 1948 a pojmenovaného po městě, který uchovává malé archeologické muzeum nálezů z okolí."
  sv:
    - "En-Dor var en stad vid östra änden av Jisreeldalen, på norra sidan av höjden More mellan berget Tabor och berget Gilboa. Josua förtecknar den tillsammans med Bet-Shean, Jivleam, Dor, Taanak och Megiddo bland de kananeiska städer inom Isaskar och Asher som tillföll Manasse. Dess berömmelse kommer från natten före Gilboa. När filisteerna låg i läger vid Shunem tvärs över dalen sade Saul: ”Söken upp åt mig någon andebesvärjerska, så vill jag gå till henne och fråga henne.” Hans tjänare svarade honom: ”I En-Dor finnes en andebesvärjerska.” Saul gick till henne om natten förklädd, och Samuels ande sade honom att han och hans söner skulle dö nästa dag. Psalm 83 (82 i den synodala numreringen) erinrar om nederlaget för Sisera och Javin vid Kishon, ”dem som förgjordes vid En-Dor och blevo till gödning åt marken”."
    - "Eusebios placerar Aendor fyra romerska mil söder om Tabor, och namnet levde kvar i Indur, en arabisk by på norra sluttningen av höjden More omkring 6 km söder om Tabor, övergiven 1948. Den antika staden söks vid Khirbet es-Safsafa strax ovanför, där järnåldersskärvor har samlats in, kartans första kandidat; Tell el-Ajjul och Indur självt förtecknas också. Eftersom Josua förtecknar En-Dor med Taanak och Megiddo, och psalmen knyter den till striden som Domarboken förlägger ”vid Taanak, invid Megiddos vatten”, har några i stället sökt mot dalens västra ände, vid Tell Abu Qedeis eller Khirbet Jadurah nära Taanak. Ingen utgrävning har avgjort saken."
    - "I dag ligger ruinerna intill den israeliska kibbutzen Ein Dor, grundad 1948 och uppkallad efter staden, som har ett litet arkeologiskt museum med fynd från distriktet."
  nb:
    - "En-Dor var en by i østenden av Jisreel-dalen, på nordsiden av høyden More mellom Tabor og Gilboa. Josva fører den opp sammen med Bet-Sjean, Jibleam, Dor, Taanak og Megiddo blant de kanaanittiske byene innenfor Issakar og Asjer som falt til Manasse. Dens berømmelse stammer fra natten før Gilboa. Filistrene lå leiret ved Sjunem på den andre siden av dalen. «Da sa Saul til sine tjenere: Finn mig en kvinne som kan mane frem døde, så vil jeg gå til henne og spørre henne! Hans tjenere svarte: I En-Dor er det en kvinne som kan mane.» Saul gikk til henne om natten i forkledning, og Samuels ånd fortalte ham at han og hans sønner skulle dø neste dag. Salme 83 (82 i den synodale nummereringen) minner om nederlaget til Sisera og Jabin ved Kisjon: «De blev ødelagt ved En-Dor, de blev til gjødsel for jorden.»"
    - "Eusebius plasserer Aendor fire romerske mil sør for Tabor, og navnet overlevde i Indur, en arabisk landsby på nordskråningen av høyden More omtrent 6 km sør for Tabor, forlatt i 1948. Den gamle byen søkes ved Khirbet es-Safsafa like ovenfor, der jernalderkeramikk er samlet, den første kandidaten på kartet; Tell el-Ajjul og Indur selv er også oppført. Fordi Josva fører opp En-Dor sammen med Taanak og Megiddo, og salmen knytter den til slaget som Dommerboken legger «ved Ta'anak, ved Megiddos vann», har noen i stedet sett mot dalens vestende, ved Tell Abu Qedeis eller Khirbet Jadurah nær Taanak. Ingen utgravning har avgjort saken."
    - "I dag ligger ruinene ved siden av den israelske kibbutzen Ein Dor, grunnlagt i 1948 og oppkalt etter byen, som har et lite arkeologisk museum med funn fra distriktet."
  tl:
    - "Ang En-dor ay isang bayan sa silangang dulo ng libis ng Jezreel, sa hilagang panig ng burol ng Moreh sa pagitan ng Bundok Tabor at Gilboa. Inililista ito ni Josue kasama ang Beth-san, Ibleam, Dor, Taanach at Megiddo sa mga bayang Cananeo sa Issachar at Aser na napunta sa Manases. Bantog ito dahil sa gabi bago ang Gilboa. Nang nakakampo ang mga Filisteo sa Sunem sa kabila ng libis, “sinabi ni Saul sa kaniyang mga lingkod, Ihanap ninyo ako ng isang babae na nakikipagsanggunian sa masamang espiritu, upang ako'y pumaroon sa kaniya … Narito, may isang babae na nakikipagsanggunian sa masamang espiritu sa Endor”. Nagbalatkayo si Saul at pumunta sa kaniya nang gabi, at sinabi ng espiritu ni Samuel na mamamatay siya at ang kaniyang mga anak kinabukasan. Inaalala ng Awit 83 (82 sa Sinodal) ang pagkatalo nina Sisara at Jabin sa Cison, “Na nangamatay sa Endor; sila'y naging parang dumi sa lupa”."
    - "Inilalagay ni Eusebio ang Aendor apat na milya sa timog ng Tabor, at ang pangalan ay nanatili sa Indur, isang nayong Arabe sa hilagang dalisdis ng burol ng Moreh mga 6 km sa timog ng Tabor, na iniwan noong 1948. Hinahanap ang sinaunang bayan sa Khirbet es-Safsafa sa itaas lamang nito, kung saan nakolekta ang palayok ng Panahon ng Bakal, ang unang kandidato sa mapa; nakalista rin ang Tell el-Ajjul at ang Indur mismo. Dahil inililista ni Josue ang En-dor kasama ang Taanach at Megiddo, at iniuugnay ito ng awit sa labanang inilalagay ng Mga Hukom na “Sa Taanach na nasa tabi ng tubig sa Megiddo”, hinanap ito ng ilan sa kanlurang dulo ng libis, sa Tell Abu Qedeis o Khirbet Jadurah malapit sa Taanach. Walang paghuhukay ang nakapagpasya."
    - "Ngayon, ang mga guho ay nasa tabi ng kibbutz na Ein Dor ng Israel, na itinatag noong 1948 at ipinangalan sa bayan, na may maliit na museong arkeolohikal ng mga natagpuan sa distrito."
  da:
    - "En-Dor var en by i den østlige ende af Jizre'el-dalen, på nordsiden af More-højen mellem Tabor og Gilboa. Josva opregner den sammen med Bet-Sjan, Jible'am, Dor, Ta'anak og Megiddo blandt de kanaanæiske byer inden for Issakar og Aser, som tilfaldt Manasse. Dens berømmelse stammer fra natten før Gilboa. Da filisterne lå lejret ved Sjunem på den anden side af dalen, hedder det: »Da sagde Saul til sine Tjenere: Opleder mig en Kvinde, som har en Spaadoms Aand, at jeg kan gaa til hende og adspørge hende; og hans Tjenere sagde til ham: Se, der er en Kvinde, som har Spaadoms Aand, i Endor«. Saul gik til hende om natten forklædt, og Samuels ånd fortalte ham, at han og hans sønner ville dø næste dag. Salme 83 (82 i den synodale nummerering) erindrer nederlaget for Sisera og Jabin ved Kisjon, »hvilke bleve ødelagte ved Endor, bleve til Gødning for Marken«."
    - "Eusebius placerer Aendor fire romerske mil syd for Tabor, og navnet overlevede i Indur, en arabisk landsby på den nordlige skråning af More-højen cirka 6 km syd for Tabor, forladt i 1948. Den antikke by søges ved Khirbet es-Safsafa lige over den, hvor jernalderkeramik er blevet indsamlet, den første kandidat på kortet; Tell el-Ajjul og Indur selv er også opført. Fordi Josva opregner En-Dor sammen med Ta'anak og Megiddo, og salmen knytter den til det slag, som Dommerbogen sætter »udi Thaanak ved Megiddo Vand«, har nogle i stedet set mod dalens vestlige ende, ved Tell Abu Qedeis eller Khirbet Jadurah nær Ta'anak. Ingen udgravning har afgjort sagen."
    - "I dag ligger ruinerne ved siden af den israelske kibbutz Ein Dor, grundlagt i 1948 og opkaldt efter byen, som har et lille arkæologisk museum med fund fra distriktet."
  sr:
    - "Ендор је био град на источном крају долине Језраел, на северној страни брда Море између Тавора и Гелвује. Исус Навин га наводи с Вет-Саном, Ивлеамом, Дором, Танахом и Мегидом међу хананејским градовима унутар Исахара и Асира који су припали Манасији. Његова слава потиче из ноћи пре Гелвује. Док су Филистеји били улогорени код Сунама преко долине, „И Саул рече слугама својим: Тражите ми жену с духом врачарским, да отидем к њој и упитам је. А слуге му рекоше: Ево у Ендору има жена у којој је дух врачарски“. Саул је отишао к њој ноћу, прерушен, а дух Самуилов рекао му је да ће он и његови синови умрети следећег дана. Псалам 83 (82 у синодалној нумерацији) подсећа на пораз Сисаре и Јавина на Кисону: „Који су истребљени у Аендору, нагнојише собом земљу“."
    - "Јевсевије смешта Аендор четири миље јужно од Тавора, а име је сачувано у Индуру, арапском селу на северној падини брда Море око 6 км јужно од Тавора, напуштеном 1948. Стари град тражи се у Хирбет ес Сафсафи одмах изнад њега, где је сакупљена керамика из гвозденог доба, први кандидат на карти; Тел ел Аџул и сам Индур такође су наведени. Пошто Исус Навин наводи Ендор уз Танах и Мегидо, а псалам га везује за битку коју Књига о Судијама смешта „у Танаху на води мегидској“, неки су уместо тога гледали ка западном крају долине, у Тел Абу Кедеис или Хирбет Џадуру близу Танаха. Ниједно ископавање није решило питање."
    - "Данас рушевине леже поред израелског кибуца Ејн Дор, основаног 1948. и названог по граду, који чува мали археолошки музеј с налазима из краја."
