body:
  en:
    - "The wilderness of Maon is the stretch of desert below Maon, the town of Judah at Khirbet Ma'in about 13 km south of Hebron, where the farmed hills give way to bare slopes running down to the Dead Sea. It is named only in the story of David's flight from Saul. After the men of Ziph betrayed his hiding places, “David and his men were in the wilderness of Maon, in the plain on the south of Jeshimon”; he “came down into a rock, and abode in the wilderness of Maon. And when Saul heard that, he pursued after David in the wilderness of Maon.” Saul went along one side of a mountain and David along the other, and Saul's men were closing round him when word came of a Philistine raid. Saul turned back, and the place was called Sela-hammahlekoth, “the rock of divisions”."
    - "That is all the Bible says of the wilderness itself, though the nearby town is also the home of Nabal and Abigail two chapters later. The rock and the mountain of the chase have not been identified, and no remains in the wilderness are tied to the story. Today it is the eastern edge of the south Hebron hills in the West Bank, dry grazing land with scattered herders' villages and caves."
  ru:
    - "Пустыня Маон — полоса пустыни ниже Маона, иудейского города на месте Хирбет-Маина примерно в 13 км к югу от Хеврона, где возделанные холмы сменяются голыми склонами, спускающимися к Мёртвому морю. Она названа только в рассказе о бегстве Давида от Саула. После того как зифеи выдали его убежища, «Давид же и люди его были в пустыне Маон, на равнине, направо от Иесимона»; он «перешел к скале и оставался в пустыне Маон. И услышал Саул, и погнался за Давидом в пустыню Маон». Саул шёл по одной стороне горы, Давид по другой, и люди Саула уже окружали его, когда пришла весть о набеге филистимлян. Саул повернул назад, и место назвали Села-Гаммахлекоф, «скала разделения»."
    - "Это всё, что Библия говорит о самой пустыне, хотя в соседнем городе двумя главами ниже живут Навал и Авигея. Скала и гора, где шла погоня, не найдены, и никакие остатки в пустыне не связаны с этим рассказом. Сегодня это восточная кромка южных Хевронских гор на Западном берегу — сухие пастбища с редкими деревнями пастухов и пещерами."
  uk:
    - "Пустеля Маон — смуга пустелі під Маоном, містом Юди в Хірбет-Маїні приблизно за 13 км на південь від Хеврона, де оброблювані пагорби поступаються голим схилам, що збігають до Мертвого моря. Вона названа лише в розповіді про втечу Давида від Саула. Після того як зифіяни зрадили його сховки, «Давид же був як раз тодї з людьми своїми в Маон-пустинї, у степу, на право від Есимону»; він «перейшов до тієї скелї, що в пустинї Маон. І довідавсь Саул про се, та й погнавсь у Маон-пустиню за Давидом». Саул ішов одним боком гори, а Давид іншим, і люди Саула вже зімкнули коло нього, коли прийшла вістка про филистимський набіг. Саул завернув, і місце назвали Села-Гамахлекот, «Скеля роздїлення»."
    - "Це все, що Біблія каже про саму пустелю, хоч сусіднє місто також є домівкою Навала й Авігеї двома розділами пізніше. Скеля і гора переслідування не ототожнені, і жодні рештки в пустелі не пов’язані з розповіддю. Нині це східний край південних пагорбів Хеврона на Західному березі, сухі пасовиська з розсіяними селами пастухів і печерами."
  es:
    - "El desierto de Maón es el tramo de desierto bajo Maón, la ciudad de Judá en Khirbet Ma'in, a unos 13 km al sur de Hebrón, donde las colinas cultivadas dan paso a laderas desnudas que bajan al mar Muerto. Se nombra solo en el relato de la huida de David ante Saúl. Después de que los hombres de Zif traicionaron sus escondites, «David y su gente estaban en el desierto de Maón, en la llanura que está á la diestra del desierto»; «descendió á la peña, y quedóse en el desierto de Maón. Lo cual como Saúl oyó, siguió á David al desierto de Maón». Saúl iba por un lado de un monte y David por el otro, y los hombres de Saúl estaban cercando a David cuando llegó la noticia de una incursión filistea. Saúl dio la vuelta, y el lugar fue llamado Sela-hammah-lecoth, «la peña de las divisiones»."
    - "Eso es todo lo que la Biblia dice del propio desierto, aunque la ciudad cercana es también la patria de Nabal y Abigail dos capítulos más adelante. La peña y el monte de la persecución no han sido identificados, y ningún resto en el desierto se vincula con el relato. Hoy es el borde oriental de las colinas del sur de Hebrón, en Cisjordania, tierra de pastoreo seca con aldeas de pastores y cuevas dispersas."
  pt:
    - "O deserto de Maom é o trecho de deserto abaixo de Maom, a cidade de Judá em Khirbet Ma'in, uns 13 km ao sul de Hebrom, onde as colinas cultivadas dão lugar a encostas nuas que descem ao Mar Morto. É nomeado apenas na história da fuga de Davi de Saul. Depois que os homens de Zife traíram seus esconderijos, “Davi e os seus homens estavam no deserto de Maom, na Arabá, ao sul do deserto”; ele “desceu à rocha e permaneceu no deserto de Maom. Quando Saul ouviu isso, perseguiu Davi no deserto de Maom”. Saul foi por um lado de um monte e Davi pelo outro, e os homens de Saul já o cercavam quando chegou a notícia de uma incursão filisteia. Saul voltou, e o lugar foi chamado Sela-Hamalecote, “a rocha das divisões”."
    - "É tudo o que a Bíblia diz do próprio deserto, embora a cidade vizinha seja também a terra de Nabal e Abigail, dois capítulos depois. A rocha e o monte da perseguição não foram identificados, e nenhum vestígio no deserto está ligado à história. Hoje é a orla oriental das colinas do sul de Hebrom, na Cisjordânia, terra seca de pastagem com aldeias de pastores dispersas e cavernas."
  de:
    - "Die Wüste Maon ist der Wüstenstreifen unterhalb von Maon, der Stadt Judas bei Khirbet Ma'in etwa 13 km südlich von Hebron, wo das bewirtschaftete Bergland in kahle Hänge übergeht, die zum Toten Meer abfallen. Sie wird nur in der Geschichte von Davids Flucht vor Saul genannt. Nachdem die Männer von Sif seine Verstecke verraten hatten, waren „David aber und seine Männer in der Wüste Maon, auf dem Gefilde zur Rechten der Wüste“; er „machte sich den Fels hinab und blieb in der Wüste Maon. Da das Saul hörte, jagte er David nach in die Wüste Maon.“ Saul ging an der einen Seite eines Berges, David an der anderen, und Sauls Männer schlossen ihn schon ein, als die Nachricht von einem Philistereinfall kam. Saul wandte sich ab, und der Ort hieß Sela-Mahlekoth, „Scheidefels“."
    - "Mehr sagt die Bibel über die Wüste selbst nicht, obwohl die nahe Stadt zwei Kapitel später auch die Heimat Nabals und Abigajils ist. Der Fels und der Berg der Jagd sind nicht identifiziert, und keine Überreste in der Wüste sind mit der Geschichte verbunden. Heute ist sie der Ostrand der südlichen Hebroner Berge im Westjordanland, trockenes Weideland mit verstreuten Hirtendörfern und Höhlen."
  fr:
    - "Le désert de Maon est l’étendue désertique au-dessous de Maon, ville de Juda à Khirbet Ma’in, à environ 13 km au sud d’Hébron, là où les collines cultivées cèdent la place à des pentes nues qui descendent vers la mer Morte. Il n’est nommé que dans le récit de la fuite de David devant Saül. Après que les gens de Ziph eurent trahi ses cachettes, « David et ses gens étaient au désert de Maon, dans la plaine au midi du désert » ; il « descendit le rocher et resta dans le désert de Maon. Saül, l’ayant appris, poursuivit David au désert de Maon ». Saül marchait d’un côté de la montagne et David de l’autre, et les hommes de Saül se refermaient sur lui quand arriva la nouvelle d’un raid philistin. Saül rebroussa chemin, et le lieu fut appelé Séla-Hammachlekoth, « le rocher des divisions »."
    - "C’est tout ce que la Bible dit du désert lui-même, bien que la ville voisine soit aussi la patrie de Nabal et d’Abigaïl deux chapitres plus loin. Le rocher et la montagne de la poursuite n’ont pas été identifiés, et aucun vestige du désert n’est rattaché au récit. C’est aujourd’hui le bord oriental des collines du sud d’Hébron, en Cisjordanie, pâturages arides parsemés de villages de bergers et de grottes."
  pl:
    - "Pustynia Maon to pas pustyni poniżej Maon, miasta Judy w Chirbet Main około 13 km na południe od Hebronu, gdzie uprawiane wzgórza ustępują nagim stokom opadającym ku Morzu Martwemu. Jest wymieniona tylko w opowieści o ucieczce Dawida przed Saulem. Gdy ludzie z Zif zdradzili jego kryjówki, „Dawid i mężowie jego byli na puszczy Maon, w polach po prawej stronie Jesymon”; „zstąpił z skały, i mieszkał na puszczy Maon. Co usłyszawszy Saul, gonił Dawida aż na puszczę Maon.” Saul szedł po jednej stronie góry, a Dawid po drugiej, i ludzie Saula zaciskali wokół niego krąg, gdy przyszła wieść o najeździe filistyńskim. Saul zawrócił, a miejsce nazwano Sela-Hammachlekot, „skała podziałów”."
    - "To wszystko, co Biblia mówi o samej pustyni, choć pobliskie miasto jest też domem Nabala i Abigail dwa rozdziały później. Skała i góra pościgu nie zostały utożsamione, a żadne pozostałości na pustyni nie są powiązane z opowieścią. Dziś jest to wschodni skraj południowych wzgórz Hebronu na Zachodnim Brzegu, suche pastwiska z rozproszonymi wioskami pasterzy i jaskiniami."
  it:
    - "Il deserto di Maon è il tratto di deserto sotto Maon, la città di Giuda a Khirbet Ma’in, circa 13 km a sud di Ebron, dove le colline coltivate cedono a pendii nudi che scendono al Mar Morto. È nominato solo nella storia della fuga di Davide da Saul. Dopo che gli uomini di Zif ebbero tradito i suoi nascondigli, «Davide e i suoi erano nel deserto di Maon, nella pianura a mezzogiorno del deserto»; egli «scese dalla roccia e rimase nel deserto di Maon. E quando Saul lo seppe, andò in traccia di Davide nel deserto di Maon». Saul camminava da un lato di un monte e Davide dall’altro, e gli uomini di Saul stavano per circondarlo quando giunse notizia di un’incursione filistea. Saul tornò indietro, e il luogo fu chiamato Sela-Hammahlekoth, «la roccia delle divisioni»."
    - "È tutto ciò che la Bibbia dice del deserto stesso, benché la città vicina sia anche la patria di Nabal e Abigail due capitoli dopo. La roccia e il monte dell’inseguimento non sono stati identificati, e nessun resto nel deserto è collegato al racconto. Oggi è il margine orientale delle colline di Ebron meridionali in Cisgiordania, terra da pascolo asciutta con sparsi villaggi di pastori e grotte."
  nl:
    - "De woestijn Maön is de woestijnstrook onder Maön, de stad van Juda bij Khirbet Ma’in, ongeveer 13 km ten zuiden van Hebron, waar de bebouwde heuvels overgaan in kale hellingen die naar de Dode Zee aflopen. Ze wordt alleen genoemd in het verhaal van Davids vlucht voor Saul. Nadat de mannen van Zif zijn schuilplaatsen hadden verraden, “David nu en zijn mannen waren in de woestijn van Maon, in het vlakke veld, aan de rechterhand der wildernis”; hij daalde af naar een rots en “bleef in de woestijn van Maon. Toen Saul dat hoorde, jaagde hij David na in de woestijn van Maon.” Saul ging aan de ene zijde van een berg en David aan de andere, en Sauls mannen sloten hem bijna in toen bericht kwam van een Filistijnse inval. Saul keerde terug, en de plaats werd Sela-Hammachlekot genoemd, “de rots van de scheidingen”."
    - "Dat is alles wat de Bijbel over de woestijn zelf zegt, hoewel de nabijgelegen stad ook de woonplaats is van Nabal en Abigaïl twee hoofdstukken later. De rots en de berg van de achtervolging zijn niet geïdentificeerd, en geen resten in de woestijn zijn aan het verhaal gekoppeld. Tegenwoordig is het de oostrand van de zuidelijke heuvels van Hebron op de Westelijke Jordaanoever, droog weideland met verspreide herdersdorpen en grotten."
  cs:
    - "Maónská poušť je úsek pouště pod Maonem, městem Judy v Chirbet Ma'ín asi 13 km jižně od Hebronu, kde obdělávané kopce přecházejí v holé svahy sbíhající k Mrtvému moři. Je jmenována jen v příběhu o Davidově útěku před Saulem. Poté, co muži ze Zífu prozradili jeho úkryty, „David pak a muži jeho byli na poušti Maon, na rovinách po pravé straně pouště“; David „sstoupil s skály a bydlil na poušti Maon. O čemž Saul uslyšav, honil Davida po poušti Maon“. Saul šel po jedné straně hory a David po druhé a Saulovi muži se kolem něj uzavírali, když přišla zpráva o pelištejském vpádu. Saul se vrátil a místo bylo nazváno Sela-hammachlekot, „Skála rozdělující“."
    - "To je vše, co Bible o poušti samotné říká, ačkoli nedaleké město je o dvě kapitoly později také domovem Nábala a Abigajil. Skála a hora honičky nebyly určeny a žádné zbytky v poušti nejsou s příběhem spojeny. Dnes je to východní okraj jižních hebronských hor na Západním břehu, suchá pastvina s roztroušenými pastýřskými vesnicemi a jeskyněmi."
