body:
  en:
    - "Ziklag was a town in the Negev, the dry south of Judah, and its site is disputed. The point on the map marks Tell esh-Sharia (Tel Sera'), a mound on the north bank of Nahal Gerar about 20 km north-west of Beersheba, which many scholars take for Ziklag; Eliezer Oren of Ben-Gurion University excavated it in 1972–1979. Tel Halif (Tell Khuweilifeh), north-east of Beersheba, was proposed earlier. In 2019 Yosef Garfinkel and Saar Ganor, who excavate Khirbet a-Ra'i near Lachish, proposed their site; Aren Maeir and Israel Finkelstein objected, Finkelstein noting that the Bible places Ziklag in the Negev, not in the Shephelah."
    - "Tell esh-Sharia has remains from the Chalcolithic period to Byzantine times. In its early Iron Age level Philistine pottery appears, but no destruction there has been tied to the Amalekite raid. At Khirbet a-Ra'i the excavators found massive buildings of the twelfth and eleventh centuries BC with Philistine pottery and, above them, a village of the early tenth century BC whose rooms were suddenly destroyed. They see in this sequence the Philistine town that was given to David, but the identification has not been generally accepted."
    - 'The Book of Joshua lists Ziklag among the southern towns of Judah and again among those of Simeon. Fleeing from Saul, David asked Achish, king of Gath, for "a place in some town in the country", and Achish gave him Ziklag, "wherefore Ziklag pertaineth unto the kings of Judah unto this day". David lived in the country of the Philistines a full year and four months and from Ziklag raided the Amalekites and other peoples of the south. While he was away with the Philistine army, the Amalekites burned the town and carried off the women and children; David pursued them, recovered everything and sent part of the spoil to the elders of Judah. At Ziklag he heard of the death of Saul, and from there he went up to Hebron. Men of Benjamin and of Manasseh came over to him at Ziklag.'
    - "After the exile, Nehemiah lists Ziklag among the places where the people of Judah lived. In the early fourth century AD Eusebius recalls that Achish gave Sikelag to David and assigns it to Judah or Simeon in the Daroma, the southern district of Palestine, but he names no village of his own day on the spot."
  ru:
    - "Секелаг — город в Негеве, засушливом юге Иудеи; где он стоял, спорят. Точка на карте отмечает холм Телль-эш-Шариа (Тель-Сера) на северном берегу ручья Нахаль-Герар, примерно в 20 км к северо-западу от Вирсавии; многие исследователи считают его Секелагом; в 1972–1979 гг. его раскапывал Элиэзер Орен из Университета имени Бен-Гуриона. Раньше предлагали Тель-Халиф (Телль-эль-Хувейлифе) к северо-востоку от Вирсавии. В 2019 г. Йосеф Гарфинкель и Саар Ганор, ведущие раскопки на Хирбет-ар-Раи близ Лахиса, предложили свой холм; Арен Маир и Исраэль Финкельштейн возразили, и Финкельштейн указал, что Библия помещает Секелаг в Негеве, а не в Шефеле."
    - "На холме Телль-эш-Шариа есть остатки от энеолита до византийского времени. В слое раннего железного века там появляется филистимская керамика, но никакое разрушение на этом холме не связано с набегом Амаликитян. На Хирбет-ар-Раи раскопщики нашли массивные постройки XII–XI веков до н. э. с филистимской керамикой, а над ними — селение начала X века до н. э., комнаты которого были внезапно разрушены. В этой последовательности они видят филистимский город, отданный Давиду, но их отождествление не получило общего признания."
    - "Книга Иисуса Навина называет этот город, в форме «Циклаг», среди южных городов Иуды и ещё раз — среди городов Симеона. Спасаясь от Саула, Давид попросил у Анхуса, царя Гефского, «место в одном из малых городов», и Анхус дал ему Секелаг, «посему Секелаг и остался за царями Иудейскими доныне». Давид прожил в стране Филистимской год и четыре месяца и из Секелага нападал на Амаликитян и другие народы юга. Пока он был в походе с филистимским войском, Амаликитяне сожгли город и увели в плен женщин и детей; Давид догнал их, отнял всё и послал часть добычи старейшинам Иудиным. В Секелаге он узнал о смерти Саула, а оттуда пошёл в Хеврон. В Секелаг к нему перешли люди из колен Вениамина и Манассии."
    - "После плена Неемия называет Секелаг среди мест, где жили сыновья Иуды. В начале IV века н. э. Евсевий напоминает, что Анхус отдал Секелаг Давиду, и относит его к Иуде или Симеону в Дароме — южной области Палестины, но не называет на этом месте никакого селения своего времени."
  uk:
    - "Ціклаг був містом у Негеві, сухому півдні Юди, і його місце оспорюється. Точка на мапі позначає Телль-еш-Шарію (Тель-Сера), пагорб на північному березі Нахаль-Герар приблизно за 20 км на північний захід від Беер-Шеви, який багато вчених вважають Ціклагом; Еліезер Орен з Університету Бен-Гуріона розкопував його в 1972–1979 роках. Тель-Халіф (Телль-Хувейліфе), на північний схід від Беер-Шеви, пропонувався раніше. У 2019 році Йосеф Гарфінкель і Саар Ганор, які розкопують Хірбет-а-Раї біля Лахіша, запропонували своє місце; Арен Маїр та Ізраель Фінкельштейн заперечили, Фінкельштейн зауважив, що Біблія ставить Ціклаг у Негеві, а не в Шефелі."
    - "Телль-еш-Шарія має рештки від халколіту до візантійських часів. У його ранньозалізному шарі з’являється філістимська кераміка, але жодне руйнування там не пов’язане з амалекітським нападом. У Хірбет-а-Раї розкопувачі знайшли масивні споруди XII–XI ст. до н. е. з філістимською керамікою, а над ними — село початку X ст. до н. е., чиї кімнати були раптово зруйновані. Вони бачать у цій послідовності філістимське місто, яке було віддане Давидові, але ототожнення не здобуло загального прийняття."
    - "Книга Ісуса Навина перелічує Ціклаг серед південних міст Юди й знову серед міст Симеона. Втікаючи від Саула, Давид попросив Анхуса, царя Гата, про «місце на пробуваннє в которому з малих міст твоїх», і Анхус дав йому Ціклаг, «тим остався Секелаг при царях Юдиних і по сей день». Давид жив у краї филистимлян повний рік і чотири місяці і з Ціклага нападав на амалекітян та інші народи півдня. Поки він був з филистимським військом, амалекітяни спалили місто й забрали жінок і дітей; Давид погнався за ними, повернув усе і послав частину здобичі старійшинам Юди. У Ціклазі він почув про смерть Саула, і звідти пішов у Хеврон. Люди Веніяміна й Манасії приєдналися до нього в Ціклазі."
    - "Після вигнання Неемія перелічує Ціклаг серед місць, де жили люди Юди. На початку IV століття н. е. Євсевій пригадує, що Анхус дав Сікелаг Давидові, і відносить його до Юди чи Симеона в Дарома, південному окрузі Палестини, але не називає жодного села свого часу на цьому місці."
  es:
    - "Siclag era una ciudad del Néguev, el sur seco de Judá, y su emplazamiento se discute. El punto del mapa marca Tell esh-Sharia (Tel Sera'), un montículo en la orilla norte del Nahal Gerar, a unos 20 km al noroeste de Beerseba, que muchos estudiosos toman por Siclag; Eliezer Oren, de la Universidad Ben-Gurión, lo excavó en 1972–1979. Tel Halif (Tell Khuweilifeh), al noreste de Beerseba, fue propuesto antes. En 2019 Yosef Garfinkel y Saar Ganor, que excavan Khirbet a-Ra'i, cerca de Laquis, propusieron su sitio; Aren Maeir e Israel Finkelstein objetaron, y Finkelstein señaló que la Biblia sitúa Siclag en el Néguev, no en la Sefelá."
    - "Tell esh-Sharia tiene restos desde el período Calcolítico hasta la época bizantina. En su nivel de comienzos de la Edad del Hierro aparece cerámica filistea, pero ninguna destrucción allí se ha vinculado con la incursión amalecita. En Khirbet a-Ra'i los excavadores hallaron edificios macizos de los siglos XII y XI a. C. con cerámica filistea y, sobre ellos, una aldea de comienzos del siglo X a. C. cuyas habitaciones fueron destruidas de repente. Ven en esta secuencia la ciudad filistea que fue dada a David, pero la identificación no ha sido generalmente aceptada."
    - "El libro de Josué enumera Siclag entre las ciudades meridionales de Judá y de nuevo entre las de Simeón. Huyendo de Saúl, David pidió a Aquis, rey de Gat, «séame dado lugar en algunas de las ciudades de la tierra», y Aquis le dio Siclag, «De aquí fué Siclag de los reyes de Judá hasta hoy». David vivió en el país de los filisteos un año y cuatro meses completos y desde Siclag asaltó a los amalecitas y otros pueblos del sur. Mientras estaba ausente con el ejército filisteo, los amalecitas incendiaron la ciudad y se llevaron a las mujeres y los niños; David los persiguió, recuperó todo y envió parte del botín a los ancianos de Judá. En Siclag supo de la muerte de Saúl, y de allí subió a Hebrón. Hombres de Benjamín y de Manasés se pasaron a él en Siclag."
    - "Después del exilio, Nehemías enumera Siclag entre los lugares donde vivió el pueblo de Judá. A comienzos del siglo IV d. C., Eusebio recuerda que Aquis dio Sikelag a David y la asigna a Judá o Simeón en el Daroma, el distrito meridional de Palestina, pero no nombra ninguna aldea de su tiempo en el lugar."
  pt:
    - "Ziclague era uma cidade no Neguebe, o sul seco de Judá, e seu sítio é discutido. O ponto no mapa marca Tell esh-Sharia (Tel Sera'), um monte na margem norte do Nahal Gerar, a cerca de 20 km a noroeste de Berseba, que muitos estudiosos tomam por Ziclague; Eliezer Oren, da Universidade Ben-Gurion, o escavou em 1972–1979. Tel Halif (Tell Khuweilifeh), a nordeste de Berseba, foi proposto antes. Em 2019, Yosef Garfinkel e Saar Ganor, que escavam Khirbet a-Ra'i, perto de Laquis, propuseram seu sítio; Aren Maeir e Israel Finkelstein objetaram, notando Finkelstein que a Bíblia situa Ziclague no Neguebe, não na Sefelá."
    - "Tell esh-Sharia tem vestígios do Calcolítico até os tempos bizantinos. Em seu nível do início da Idade do Ferro aparece cerâmica filisteia, mas nenhuma destruição ali foi ligada à incursão amalequita. Em Khirbet a-Ra'i, os escavadores encontraram edifícios maciços dos séculos XII e XI a.C. com cerâmica filisteia e, acima deles, uma aldeia do início do século X a.C. cujos cômodos foram destruídos de repente. Veem nessa sequência a cidade filisteia que foi dada a Davi, mas a identificação não foi geralmente aceita."
    - "O livro de Josué lista Ziclague entre as cidades do sul de Judá e de novo entre as de Simeão. Fugindo de Saul, Davi pediu a Aquis, rei de Gate, “um lugar numa das cidades do interior”, e Aquis lhe deu Ziclague, “Por isso Ziclague pertence aos reis de Judá até o dia de hoje”. Davi viveu na terra dos filisteus um ano e quatro meses inteiros e de Ziclague atacou os amalequitas e outros povos do sul. Enquanto estava fora com o exército filisteu, os amalequitas queimaram a cidade e levaram as mulheres e crianças; Davi os perseguiu, recuperou tudo e enviou parte do despojo aos anciãos de Judá. Em Ziclague soube da morte de Saul, e dali subiu a Hebrom. Homens de Benjamim e de Manassés passaram para ele em Ziclague."
    - "Depois do exílio, Neemias lista Ziclague entre os lugares onde o povo de Judá vivia. No início do século IV d.C., Eusébio recorda que Aquis deu Sikelag a Davi e a atribui a Judá ou Simeão, na Daroma, o distrito sul da Palestina, mas não nomeia nenhuma aldeia de seu tempo no local."
  de:
    - "Ziklag war eine Stadt im Negev, dem trockenen Süden Judas, und seine Lage ist umstritten. Der Punkt auf der Karte markiert Tell esh-Sharia (Tel Sera'), einen Hügel am Nordufer des Nahal Gerar etwa 20 km nordwestlich von Beerscheba, den viele Forscher für Ziklag halten; Eliezer Oren von der Ben-Gurion-Universität grub ihn 1972–1979 aus. Tel Halif (Tell Khuweilifeh) nordöstlich von Beerscheba wurde früher vorgeschlagen. 2019 schlugen Yosef Garfinkel und Saar Ganor, die Khirbet a-Ra'i bei Lachisch ausgraben, ihre Stätte vor; Aren Maeir und Israel Finkelstein widersprachen, wobei Finkelstein darauf hinwies, dass die Bibel Ziklag in den Negev setzt, nicht in die Schefela."
    - "Tell esh-Sharia hat Überreste vom Chalkolithikum bis in byzantinische Zeit. In seiner früheisenzeitlichen Schicht erscheint philistäische Keramik, doch keine Zerstörung dort wurde mit dem Amalekiterüberfall verbunden. In Khirbet a-Ra'i fanden die Ausgräber massive Gebäude des zwölften und elften Jahrhunderts v. Chr. mit philistäischer Keramik und darüber ein Dorf des frühen zehnten Jahrhunderts v. Chr., dessen Räume plötzlich zerstört wurden. Sie sehen in dieser Abfolge die Philisterstadt, die David gegeben wurde, doch die Gleichsetzung ist nicht allgemein akzeptiert."
    - "Das Buch Josua führt Ziklag unter den südlichen Städten Judas und nochmals unter denen Simeons auf. Auf der Flucht vor Saul bat David Achis, den König von Gat, um „einen Raum in der Städte einer auf dem Lande“, und Achis gab ihm Ziklag, „daher gehört Ziklag zu den Königen Juda's bis auf diesen Tag“. David wohnte ein Jahr und vier Monate im Land der Philister und überfiel von Ziklag aus die Amalekiter und andere Völker des Südens. Während er mit dem Philisterheer fort war, brannten die Amalekiter die Stadt nieder und führten Frauen und Kinder weg; David verfolgte sie, gewann alles zurück und sandte einen Teil der Beute an die Ältesten Judas. In Ziklag hörte er vom Tod Sauls, und von dort zog er nach Hebron hinauf. Männer aus Benjamin und Manasse liefen in Ziklag zu ihm über."
    - "Nach dem Exil führt Nehemia Ziklag unter den Orten auf, wo das Volk Juda wohnte. Anfang des vierten Jahrhunderts n. Chr. erinnert Eusebius daran, dass Achis David Sikelag gab, und ordnet es Juda oder Simeon in der Daroma zu, dem südlichen Bezirk Palästinas, nennt aber an der Stelle kein Dorf seiner eigenen Zeit."
  fr:
    - "Tsiklag était une ville du Néguev, le sud aride de Juda, et son site est discuté. Le point de la carte marque Tell esh-Sharia (Tel Sera’), tertre sur la rive nord du Nahal Gerar à environ 20 km au nord-ouest de Beer-Schéba, que beaucoup de spécialistes prennent pour Tsiklag ; Eliezer Oren, de l’université Ben-Gourion, le fouilla en 1972-1979. Tel Halif (Tell Khuweilifeh), au nord-est de Beer-Schéba, avait été proposé plus tôt. En 2019, Yosef Garfinkel et Saar Ganor, qui fouillent Khirbet a-Ra’i près de Lakis, proposèrent leur site ; Aren Maeir et Israel Finkelstein objectèrent, Finkelstein notant que la Bible place Tsiklag dans le Néguev, non dans la Shéphéla."
    - "Tell esh-Sharia a des vestiges du chalcolithique à l’époque byzantine. Dans son niveau du début de l’âge du fer apparaît de la poterie philistine, mais aucune destruction n’y a été rattachée au raid amalécite. À Khirbet a-Ra’i, les fouilleurs ont trouvé des bâtiments massifs des XIIe et XIe siècles av. J.-C. avec de la poterie philistine et, au-dessus, un village du début du Xe siècle av. J.-C. dont les pièces furent soudain détruites. Ils y voient la ville philistine donnée à David, mais l’identification n’est pas généralement acceptée."
    - "Le livre de Josué range Tsiklag parmi les villes du sud de Juda et de nouveau parmi celles de Siméon. Fuyant Saül, David demanda à Akisch, roi de Gath, « dans l’une des villes du pays un lieu où je puisse demeurer », et Akisch lui donna Tsiklag : « C’est pourquoi Tsiklag a appartenu aux rois de Juda jusqu’à ce jour. » David vécut dans le pays des Philistins « un an et quatre mois » et, depuis Tsiklag, razzia les Amalécites et d’autres peuples du sud. Pendant qu’il était parti avec l’armée philistine, les Amalécites incendièrent la ville et emmenèrent les femmes et les enfants ; David les poursuivit, récupéra tout et envoya une partie du butin aux anciens de Juda. À Tsiklag, il apprit la mort de Saül, et de là il monta à Hébron. Des hommes de Benjamin et de Manassé vinrent à lui à Tsiklag."
    - "Après l’exil, Néhémie range Tsiklag parmi les lieux où habitait le peuple de Juda. Au début du IVe siècle apr. J.-C., Eusèbe rappelle qu’Akisch donna Sikelag à David et l’attribue à Juda ou à Siméon dans la Daroma, le district sud de la Palestine, mais il ne nomme aucun village de son temps sur place."
  pl:
    - "Siklag było miastem w Negewie, suchym południu Judy, a jego położenie jest sporne. Punkt na mapie wskazuje Tell asz-Szari'a (Tel Sera), kopiec na północnym brzegu Nachal Gerar około 20 km na północny zachód od Beer-Szeby, który wielu badaczy bierze za Siklag; Eliezer Oren z Uniwersytetu Ben-Guriona prowadził tam wykopaliska w latach 1972–1979. Tel Chalif (Tell Churejlife), na północny wschód od Beer-Szeby, był proponowany wcześniej. W 2019 roku Josef Garfinkel i Saar Ganor, którzy badają Chirbet a-Rai koło Lakisz, zaproponowali swoje stanowisko; Aren Maeir i Israel Finkelstein zgłosili sprzeciw, Finkelstein zauważył, że Biblia umieszcza Siklag w Negewie, a nie w Szefeli."
    - "Tell asz-Szari'a ma pozostałości od chalkolitu do czasów bizantyjskich. W jego warstwie z wczesnej epoki żelaza pojawia się ceramika filistyńska, ale żadne zniszczenie tam nie zostało powiązane z najazdem Amalekitów. W Chirbet a-Rai odkrywcy znaleźli masywne budynki z XII i XI wieku p.n.e. z ceramiką filistyńską, a nad nimi wieś z początku X wieku p.n.e., której izby zostały nagle zniszczone. Widzą w tym ciągu filistyńskie miasto, które dano Dawidowi, ale utożsamienie nie zostało powszechnie przyjęte."
    - "Księga Jozuego wymienia Siklag wśród południowych miast Judy i ponownie wśród miast Symeona. Uciekając przed Saulem, Dawid poprosił Achisza, króla Gat, o „miejsce w jednem z miast tego kraju”, a Achisz dał mu Siklag, „dla tego Syceleg było królów Judzkich aż do dnia tego”. Dawid mieszkał w kraju Filistynów pełny rok i cztery miesiące i z Siklag napadał na Amalekitów i inne ludy południa. Gdy był z armią filistyńską, Amalekici spalili miasto i uprowadzili kobiety i dzieci; Dawid ich ścigał, odzyskał wszystko i część łupu posłał starszym Judy. W Siklag usłyszał o śmierci Saula i stamtąd poszedł do Hebronu. Ludzie z Beniamina i Manassesa przeszli do niego w Siklag."
    - "Po wygnaniu Nehemiasz wymienia Siklag wśród miejsc, gdzie mieszkał lud Judy. Na początku IV wieku n.e. Euzebiusz przypomina, że Achisz dał Dawidowi Sikelag, i przypisuje je do Judy lub Symeona w Daromie, południowym okręgu Palestyny, ale nie wymienia na tym miejscu żadnej wsi swoich czasów."
  it:
    - "Siclag era una città del Negheb, il sud arido di Giuda, e il suo sito è discusso. Il punto sulla mappa segna Tell esh-Sharia (Tel Sera’), un tell sulla riva nord del Nahal Gerar, circa 20 km a nord-ovest di Bersabea, che molti studiosi ritengono Siclag; Eliezer Oren dell’Università Ben-Gurion lo scavò nel 1972–1979. Tel Halif (Tell Khuweilifeh), a nord-est di Bersabea, era stato proposto in precedenza. Nel 2019 Yosef Garfinkel e Saar Ganor, che scavano Khirbet a-Ra’i presso Lachis, proposero il loro sito; Aren Maeir e Israel Finkelstein obiettarono, Finkelstein notando che la Bibbia pone Siclag nel Negheb, non nella Sefela."
    - "Tell esh-Sharia ha resti dal Calcolitico all’epoca bizantina. Nel suo livello del primo Ferro compare ceramica filistea, ma nessuna distruzione lì è stata legata all’incursione amalecita. A Khirbet a-Ra’i gli scavatori trovarono massicci edifici del XII e XI secolo a.C. con ceramica filistea e, sopra di essi, un villaggio dell’inizio del X secolo a.C. i cui vani furono distrutti improvvisamente. Vi vedono la città filistea che fu data a Davide, ma l’identificazione non è stata generalmente accettata."
    - "Il libro di Giosuè elenca Siclag fra le città meridionali di Giuda e di nuovo fra quelle di Simeone. In fuga da Saul, Davide chiese ad Achis, re di Gat, «in una delle città della campagna un luogo dove io possa stabilirmi», e Achis gli diede Siclag, «perciò Tsiklag ha appartenuto ai re di Giuda fino al dì d’oggi». Davide visse nel paese dei Filistei un anno e quattro mesi e da Siclag fece scorrerie contro gli Amalekiti e altri popoli del sud. Mentre era lontano con l’esercito filisteo, gli Amalekiti bruciarono la città e portarono via le donne e i bambini; Davide li inseguì, ricuperò tutto e mandò parte del bottino agli anziani di Giuda. A Siclag seppe della morte di Saul, e di lì salì a Ebron. Uomini di Beniamino e di Manasse passarono a lui a Siclag."
    - "Dopo l’esilio Neemia elenca Siclag fra i luoghi dove abitò la gente di Giuda. All’inizio del IV secolo d.C. Eusebio ricorda che Achis diede Sikelag a Davide e la assegna a Giuda o a Simeone nel Daroma, il distretto meridionale della Palestina, ma non nomina alcun villaggio dei suoi giorni sul posto."
  nl:
    - "Ziklag was een stad in de Negev, het droge zuiden van Juda, en de ligging wordt betwist. Het punt op de kaart markeert Tell esh-Sharia (Tel Sera’), een heuvel aan de noordoever van Nahal Gerar ongeveer 20 km ten noordwesten van Berseba, die veel geleerden voor Ziklag houden; Eliëzer Oren van de Ben-Goerion-universiteit groef hem op in 1972–1979. Tel Halif (Tell Khuweilifeh), ten noordoosten van Berseba, werd eerder voorgesteld. In 2019 stelden Yosef Garfinkel en Saar Ganor, die Khirbet a-Ra’i bij Lachis opgraven, hun eigen plek voor; Aren Maeir en Israel Finkelstein maakten bezwaar, waarbij Finkelstein opmerkte dat de Bijbel Ziklag in de Negev plaatst, niet in de Sefela."
    - "Tell esh-Sharia heeft resten van het Chalcolithicum tot de Byzantijnse tijd. In zijn laag uit de vroege IJzertijd verschijnt Filistijns aardewerk, maar geen verwoesting daar is aan de Amalekitische plundering gekoppeld. Bij Khirbet a-Ra’i vonden de opgravers massieve gebouwen uit de twaalfde en elfde eeuw v.Chr. met Filistijns aardewerk en daarboven een dorp uit het begin van de tiende eeuw v.Chr. waarvan de vertrekken plotseling werden verwoest. Zij zien in deze opeenvolging de Filistijnse stad die aan David werd gegeven, maar de gelijkstelling is niet algemeen aanvaard."
    - "Het boek Jozua noemt Ziklag onder de zuidelijke steden van Juda en opnieuw onder die van Simeon. Op de vlucht voor Saul vroeg David aan Achis, koning van Gat, “een plaats in een van de steden des lands”, en Achis gaf hem Ziklag, “daarom is Ziklag van de koningen van Juda geweest tot op dezen dag”. David woonde een vol jaar en vier maanden in het land van de Filistijnen en overviel vanuit Ziklag de Amalekieten en andere volken van het zuiden. Terwijl hij met het Filistijnse leger weg was, verbrandden de Amalekieten de stad en voerden de vrouwen en kinderen weg; David achtervolgde hen, redde alles en zond een deel van de buit aan de oudsten van Juda. In Ziklag hoorde hij van de dood van Saul, en vandaar trok hij op naar Hebron. Mannen van Benjamin en van Manasse liepen bij hem over in Ziklag."
    - "Na de ballingschap noemt Nehemia Ziklag onder de plaatsen waar het volk van Juda woonde. In het begin van de vierde eeuw n.Chr. herinnert Eusebius eraan dat Achis Sikelag aan David gaf en wijst hij het toe aan Juda of Simeon in de Daroma, het zuidelijke district van Palestina, maar hij noemt geen dorp van zijn eigen tijd op die plek."
  cs:
    - "Siklag bylo město v Negevu, suché jižní části Judy, a jeho poloha je sporná. Bod na mapě označuje Tell aš-Šarí'a (Tel Sera'), pahorek na severním břehu Nachal Gerar asi 20 km severozápadně od Beer-šeby, který mnozí učenci pokládají za Siklag; Eliezer Óren z Univerzity Ben Guriona jej vykopával v letech 1972–1979. Tel Chalif (Tell Chuwejlife), severovýchodně od Beer-šeby, byl navržen dříve. V roce 2019 navrhli Josef Garfinkel a Sa'ar Ganor, kteří vykopávají Chirbet a-Ra'i u Lachiše, svou lokalitu; Aren Maeir a Israel Finkelstein namítali, přičemž Finkelstein poznamenal, že Bible klade Siklag do Negevu, ne do Šefely."
    - "Tell aš-Šarí'a má pozůstatky od chalkolitu do byzantských dob. V jeho vrstvě rané doby železné se objevuje pelištejská keramika, ale žádné tamní zničení nebylo spojeno s amalekitským nájezdem. V Chirbet a-Ra'i našli vykopávači mohutné budovy z 12. a 11. stol. př. n. l. s pelištejskou keramikou a nad nimi vesnici z počátku 10. stol. př. n. l., jejíž místnosti byly náhle zničeny. V této posloupnosti vidí pelištejské město, které bylo dáno Davidovi, ale ztotožnění nebylo všeobecně přijato."
    - "Kniha Jozue uvádí Siklag mezi jižními městy Judy a znovu mezi městy Simeonovými. Na útěku před Saulem David požádal Achiše, krále Gatu, o „místo v některém městě krajiny této“ a Achiš mu dal Siklag, „odkudž Sicelech bylo králů Judských až do dne tohoto“. David žil v zemi Pelištejců plný rok a čtyři měsíce a ze Siklagu přepadal Amalekity a jiné národy jihu. Zatímco byl pryč s pelištejským vojskem, Amalekové město vypálili a odvedli ženy a děti; David je pronásledoval, vše získal zpět a poslal část kořisti judským starším. V Siklagu uslyšel o Saulově smrti a odtud šel do Hebronu. Muži z Benjamína a z Manasesa k němu v Siklagu přešli."
    - "Po exilu Nehemjáš uvádí Siklag mezi místy, kde žil lid Judy. Na počátku 4. století n. l. Eusebius připomíná, že Achiš dal Sikelag Davidovi, a přiřazuje jej k Judě nebo Simeonovi v Daromě, jižním okrese Palestiny, ale nejmenuje na místě žádnou vesnici své doby."
  sv:
    - "Siklag var en stad i Negev, Judas torra söder, och dess läge är omstritt. Punkten på kartan markerar Tell esh-Sharia (Tel Sera'), en kulle på norra stranden av Nahal Gerar omkring 20 km nordväst om Beer Sheva, som många forskare tar för Siklag; Eliezer Oren vid Ben-Gurion-universitetet grävde ut den 1972–1979. Tel Halif (Tell Khuweilifeh), nordost om Beer Sheva, föreslogs tidigare. År 2019 föreslog Yosef Garfinkel och Saar Ganor, som gräver ut Khirbet a-Ra'i nära Lakish, sin plats; Aren Maeir och Israel Finkelstein invände, Finkelstein med att påpeka att Bibeln placerar Siklag i Negev, inte i Shefela."
    - "Tell esh-Sharia har lämningar från kalkolitikum till bysantinsk tid. I dess tidiga järnåldersskikt förekommer filisteisk keramik, men ingen förstörelse där har knutits till amalekiternas räd. Vid Khirbet a-Ra'i fann utgrävarna massiva byggnader från 1100- och 1000-talen f.Kr. med filisteisk keramik och, ovanför dem, en by från tidigt 900-tal f.Kr. vars rum plötsligt förstördes. De ser i denna följd den filisteiska staden som gavs åt David, men identifieringen har inte allmänt godtagits."
    - "Josuas bok räknar upp Siklag bland Judas södra städer och åter bland Simeons. På flykt undan Saul bad David Akish, kung av Gat, om en bostad ”i någon av landsortsstäderna”, och Akish gav honom Siklag: ”Därför hör Siklag ännu i dag under Juda konungar”. David bodde i filisteernas land ett helt år och fyra månader och gjorde från Siklag räder mot amalekiterna och andra folk i söder. Medan han var borta med den filisteiska hären brände amalekiterna staden och förde bort kvinnorna och barnen; David förföljde dem, återtog allt och sände en del av bytet till Judas äldste. I Siklag fick han höra om Sauls död, och därifrån drog han upp till Hebron. Män från Benjamin och Manasse gick över till honom i Siklag."
    - "Efter exilen räknar Nehemja upp Siklag bland platserna där Judas folk bodde. Tidigt på 300-talet e.Kr. erinrar Eusebios om att Akish gav Sikelag åt David och hänför det till Juda eller Simeon i Daroma, Palestinas södra distrikt, men han nämner ingen by från sin egen tid på platsen."
  nb:
    - "Siklag var en by i Negev, det tørre sør i Juda, og beliggenheten er omstridt. Punktet på kartet markerer Tell esh-Sharia (Tel Sera'), en haug på nordbredden av Nahal Gerar omkring 20 km nordvest for Beer-Sjeba, som mange forskere tar for Siklag; Eliezer Oren fra Ben-Gurion-universitetet utgravde den i 1972–1979. Tel Halif (Tell Khuweilifeh), nordøst for Beer-Sjeba, ble foreslått tidligere. I 2019 foreslo Yosef Garfinkel og Saar Ganor, som utgraver Khirbet a-Ra'i nær Lakisj, sitt sted; Aren Maeir og Israel Finkelstein protesterte, og Finkelstein bemerket at Bibelen plasserer Siklag i Negev, ikke i Sjefela."
    - "Tell esh-Sharia har levninger fra kobberalderen til bysantinsk tid. I laget fra tidlig jernalder dukker filistersk keramikk opp, men ingen ødeleggelse der er blitt knyttet til amalekittenes plyndringstokt. Ved Khirbet a-Ra'i fant utgraverne massive bygninger fra 1100- og 1000-tallet f.Kr. med filistersk keramikk og, over dem, en landsby fra tidlig på 900-tallet f.Kr. hvis rom plutselig ble ødelagt. De ser i denne rekkefølgen den filisterske byen som ble gitt til David, men identifikasjonen er ikke allment godtatt."
    - "Josvas bok oppfører Siklag blant Judas sørlige byer og igjen blant Simeons. På flukt fra Saul ba David Akisj, kongen i Gat, om «et sted å bo på i en av landsbyene», og Akisj ga ham Siklag, «derfor har Siklag hørt Judas konger til helt til denne dag». David bodde i filistrenes land i ett år og fire måneder og herjet fra Siklag amalekittene og andre folk i sør. Mens han var borte med den filisterske hæren, brente amalekittene byen og førte bort kvinner og barn; David forfulgte dem, vant alt tilbake og sendte en del av byttet til Judas eldste. I Siklag hørte han om Sauls død, og derfra dro han opp til Hebron. Menn fra Benjamin og fra Manasse gikk over til ham i Siklag."
    - "Etter eksilet oppfører Nehemja Siklag blant stedene der Judas folk bodde. Tidlig på 300-tallet e.Kr. minner Eusebius om at Akisj ga Sikelag til David og henfører den til Juda eller Simeon i Daroma, det sørlige distriktet i Palestina, men han nevner ingen landsby fra sin egen tid på stedet."
  tl:
    - "Ang Siclag ay bayan sa Negev, ang tuyong timog ng Juda, at pinagtatalunan ang pook nito. Minamarkahan ng tuldok sa mapa ang Tell esh-Sharia (Tel Sera'), burol sa hilagang pampang ng Nahal Gerar mga 20 km sa hilagang-kanluran ng Beer-seba, na itinuturing ng maraming iskolar na Siclag; hinukay ito ni Eliezer Oren ng Pamantasang Ben-Gurion noong 1972–1979. Mas maaga nang iminungkahi ang Tel Halif (Tell Khuweilifeh), hilagang-silangan ng Beer-seba. Noong 2019, iminungkahi nina Yosef Garfinkel at Saar Ganor, na naghuhukay sa Khirbet a-Ra'i malapit sa Lachis, ang kanilang pook; tumutol sina Aren Maeir at Israel Finkelstein; sinabi ni Finkelstein na inilalagay ng Biblia ang Siclag sa Negev, hindi sa Sephela."
    - "May mga labi ang Tell esh-Sharia mula sa panahong Chalcolithic hanggang Bizantino. Sa antas nito ng maagang Panahong Bakal, lumilitaw ang palayok na Filisteo, ngunit walang pagkawasak doon na naiugnay sa pagsalakay ng mga Amalecita. Sa Khirbet a-Ra'i, natagpuan ng mga naghukay ang malalaking gusali ng ika-12 at ika-11 siglo BK na may palayok na Filisteo at, sa itaas nito, nayon ng maagang ika-10 siglo BK na ang mga silid ay biglang winasak. Nakikita nila rito ang bayang Filisteo na ibinigay kay David, ngunit hindi pangkalahatang tinanggap ang pagkakakilanlan."
    - "Itinatala ng Aklat ni Josue ang Siclag sa mga bayang timog ng Juda at muli sa Simeon. Sa pagtakas kay Saul, humingi si David kay Achis, hari ng Gath, ng “isang matatahanan sa isa sa mga bayan sa lupain”, at ibinigay ni Achis ang Siclag, “kaya't ang Siclag ay nauukol sa mga hari sa Juda hanggang sa araw na ito”. Nanirahan si David sa lupain ng mga Filisteo nang isang taon at apat na buwan at mula sa Siclag ay sinalakay ang mga Amalecita at iba pang bayan ng timog. Habang wala siya kasama ng hukbong Filisteo, sinunog ng mga Amalecita ang bayan at dinala ang mga babae at bata; hinabol sila ni David, nabawi ang lahat at nagpadala ng bahagi ng samsam sa mga matanda ng Juda. Sa Siclag niya narinig ang pagkamatay ni Saul, at mula roon ay umahon siya sa Hebron. Lumapit sa kaniya sa Siclag ang mga lalaki ng Benjamin at Manases."
    - "Pagkatapos ng pagkatapon, itinatala ni Nehemias ang Siclag sa mga lugar na tinirhan ng bayan ng Juda. Noong simula ng ika-4 na siglo AD, naaalala ni Eusebio na ibinigay ni Achis ang Sikelag kay David at inilalagay ito sa Juda o Simeon sa Daroma, ang timugang distrito ng Palestina, ngunit hindi siya nagpapangalan ng nayon ng kaniyang panahon sa lugar."
  da:
    - "Siklag var en by i Negev, Judas tørre syd, og dens sted er omstridt. Punktet på kortet markerer Tell esh-Sharia (Tel Sera'), en tell på nordbredden af Nahal Gerar omkring 20 km nordvest for Beersheba, som mange forskere tager for Siklag; Eliezer Oren fra Ben-Gurion-universitetet udgravede den i 1972–1979. Tel Halif (Tell Khuweilifeh), nordøst for Beersheba, blev foreslået tidligere. I 2019 foreslog Yosef Garfinkel og Saar Ganor, der udgraver Khirbet a-Ra'i nær Lakisj, deres sted; Aren Maeir og Israel Finkelstein gjorde indsigelse, idet Finkelstein bemærkede, at Bibelen placerer Siklag i Negev, ikke i Sjefela."
    - "Tell esh-Sharia har rester fra kobberstenalderen til byzantinsk tid. I dens tidlige jernaldersniveau optræder filistæisk keramik, men ingen ødelæggelse dér er blevet knyttet til amalekitternes strejftog. Ved Khirbet a-Ra'i fandt udgraverne massive bygninger fra 1100- og 1000-tallet f.Kr. med filistæisk keramik og, over dem, en landsby fra det tidlige 900-tallet f.Kr., hvis rum pludselig blev ødelagt. De ser i denne rækkefølge den filistæiske by, som blev givet til David, men identifikationen er ikke almindeligt accepteret."
    - "Josvas Bog opregner Siklag blandt Judas sydlige byer og igen blandt Simeons. På flugt fra Saul bad David Akisj, konge af Gat, om »et Sted i een af Byerne i Landet«, og Akisj gav ham Siklag, »derfor er Ziklag Judas Kongers indtil denne Dag«. David boede i filistrenes land i et helt år og fire måneder og plyndrede fra Siklag amalekitterne og andre folk i syd. Mens han var borte med den filistæiske hær, brændte amalekitterne byen og førte kvinderne og børnene bort; David forfulgte dem, hentede alt tilbage og sendte en del af byttet til Judas ældste. I Siklag hørte han om Sauls død, og derfra drog han op til Hebron. Mænd af Benjamin og af Manasse gik over til ham i Siklag."
    - "Efter eksilet opregner Nehemias Siklag blandt de steder, hvor Judas folk boede. I begyndelsen af 300-tallet e.Kr. husker Eusebius, at Akisj gav Sikelag til David, og henfører det til Juda eller Simeon i Daroma, Palæstinas sydlige distrikt, men han nævner ingen landsby fra sin egen tid på stedet."
