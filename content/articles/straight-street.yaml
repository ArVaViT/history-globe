body:
  en:
    - "After Saul of Tarsus was blinded on the road to Damascus, the Lord sent the disciple Ananias to him: “Arise, and go into the street which is called Straight, and enquire in the house of Judas for one called Saul, of Tarsus: for, behold, he prayeth.” Ananias laid his hands on him, Saul's sight returned, and he was baptised. The street is named only here."
    - "The street called Straight is the main east–west street of the old city of Damascus, the decumanus maximus of the Roman city, which crossed the walled town for about 1,500 metres from the eastern gate, Bab Sharqi, towards the west. A Roman arch still stands along it. The street keeps its line today: its western half is Midhat Pasha Street with the covered Midhat Pasha souq, and its eastern half is Bab Sharqi Street; near its eastern end, by the gate, the Chapel of Saint Ananias is shown."
  ru:
    - "Когда Савл из Тарса ослеп на пути в Дамаск, Господь послал к нему ученика Ананию: «встань и пойди на улицу, так называемую Прямую, и спроси в Иудином доме Тарсянина, по имени Савла; он теперь молится». Анания возложил на него руки, Савл прозрел и крестился. Улица названа только здесь."
    - "Улица Прямая — главная улица старого Дамаска, идущая с востока на запад, decumanus maximus римского города, пересекавшая обнесённый стеной город примерно на 1500 м от восточных ворот Баб-Шарки к западу. Вдоль неё до сих пор стоит римская арка. Улица сохраняет свою линию и сегодня: её западная половина — улица Мидхат-паши с крытым рынком Мидхат-паши, а восточная — улица Баб-Шарки; у её восточного конца, близ ворот, показывают часовню святого Анании."
  uk:
    - "Після того як Савла з Тарса було осліплено на дорозі до Дамаска, Господь послав до нього учня Ананію: «Уставши, йди на улицю, що зветь ся Простою, та й пошукай у Юдиній хатї Тарсянина, на ймя Савла; ось бо він молить ся». Ананія поклав на нього руки, зір Савла повернувся, і він охрестився. Вулицю названо лише тут."
    - "Вулиця, що зветься Прямою, — головна вулиця старого Дамаска зі сходу на захід, decumanus maximus римського міста, що перетинала обнесене мурами місто приблизно на 1500 метрів від східної брами, Баб-Шарки, у бік заходу. Уздовж неї досі стоїть римська арка. Вулиця зберігає свою лінію й нині: її західна половина — вулиця Мідхат-паші з критим ринком Мідхат-паші, а східна — вулиця Баб-Шарки; поблизу її східного кінця, біля брами, показують каплицю св. Ананії."
  es:
    - "Después de que Saulo de Tarso quedara ciego en el camino de Damasco, el Señor envió a Ananías, un discípulo, a su encuentro: «Levántate, y ve á la calle que se llama la Derecha, y busca en casa de Judas á uno llamado Saulo, de Tarso: porque he aquí, él ora». Ananías le impuso las manos, la vista de Saulo volvió y fue bautizado. La calle solo se nombra aquí."
    - "La calle llamada Derecha es la calle principal de este a oeste de la ciudad vieja de Damasco, el decumanus maximus de la ciudad romana, que cruzaba la ciudad amurallada a lo largo de unos 1500 metros desde la puerta oriental, Bab Sharqi, hacia el oeste. Un arco romano sigue en pie a lo largo de ella. La calle conserva hoy su trazado: su mitad occidental es la calle Midhat Pasha, con el zoco cubierto de Midhat Pasha, y su mitad oriental es la calle Bab Sharqi; cerca de su extremo oriental, junto a la puerta, se muestra la capilla de San Ananías."
  pt:
    - "Depois que Saulo de Tarso foi cegado no caminho de Damasco, o Senhor enviou-lhe o discípulo Ananias: “Levante-se e vá à rua chamada Direita, e pergunte na casa de Judá por um homem chamado Saulo, de Tarso. Pois ele está orando.” Ananias impôs-lhe as mãos, a visão de Saulo voltou, e ele foi batizado. A rua é nomeada somente aqui."
    - "A rua chamada Direita é a principal rua leste–oeste da cidade velha de Damasco, o decumanus maximus da cidade romana, que atravessava a cidade murada por cerca de 1.500 metros a partir da porta oriental, Bab Sharqi, em direção ao oeste. Um arco romano ainda se ergue ao longo dela. A rua conserva hoje o seu traçado: sua metade ocidental é a rua Midhat Paxá, com o souk coberto de Midhat Paxá, e sua metade oriental é a rua Bab Sharqi; perto de sua extremidade oriental, junto à porta, mostra-se a Capela de Santo Ananias."
  de:
    - "Nachdem Saul von Tarsus auf dem Weg nach Damaskus erblindet war, sandte der Herr den Jünger Hananias zu ihm: „Stehe auf und gehe in die Gasse, die da heißt ‚die gerade‘, und frage im Hause des Judas nach einem namens Saul von Tarsus; denn siehe, er betet“. Hananias legte ihm die Hände auf, Sauls Augenlicht kehrte zurück, und er wurde getauft. Die Straße wird nur hier genannt."
    - "Die Gerade Straße ist die ost-westliche Hauptstraße der Altstadt von Damaskus, der Decumanus maximus der römischen Stadt, der die ummauerte Stadt auf etwa 1500 Metern vom Osttor, Bab Scharqi, nach Westen durchquerte. Ein römischer Bogen steht noch an ihr. Die Straße behält heute ihre Linie: Ihre westliche Hälfte ist die Midhat-Pascha-Straße mit dem überdachten Midhat-Pascha-Suk, ihre östliche die Bab-Scharqi-Straße; nahe ihrem Ostende am Tor wird die Kapelle des heiligen Hananias gezeigt."
  it:
    - "Dopo che Saulo di Tarso fu reso cieco sulla via di Damasco, il Signore mandò da lui il discepolo Anania: «Lèvati, vattene nella strada detta Diritta, e cerca, in casa di Giuda, un uomo chiamato Saulo, da Tarso; poiché ecco, egli è in preghiera». Anania gli impose le mani, Saulo recuperò la vista e fu battezzato. La via è nominata solo qui."
    - "La via chiamata Diritta è la strada principale est-ovest della città vecchia di Damasco, il decumanus maximus della città romana, che attraversava la città murata per circa 1500 metri dalla porta orientale, Bab Sharqi, verso ovest. Un arco romano sorge ancora lungo di essa. La via conserva oggi il suo tracciato: la sua metà occidentale è via Midhat Pascià con il souq coperto di Midhat Pascià, e la sua metà orientale è via Bab Sharqi; verso la sua estremità orientale, presso la porta, si mostra la cappella di sant’Anania."
  fr:
    - "Après que Saul de Tarse eut été aveuglé sur la route de Damas, le Seigneur envoya vers lui le disciple Ananias : « Lève-toi, va dans la rue qu’on appelle la droite, et cherche, dans la maison de Judas, un nommé Saul de Tarse » ; car, ajoute le Seigneur, il prie. Ananias lui imposa les mains, Saul recouvra la vue et fut baptisé. La rue n’est nommée qu’ici."
    - "La rue dite Droite est la grande rue est-ouest de la vieille ville de Damas, le decumanus maximus de la cité romaine, qui traversait la ville fortifiée sur environ 1 500 mètres depuis la porte orientale, Bab Sharqi, vers l’ouest. Un arc romain s’y dresse encore. La rue garde aujourd’hui son tracé : sa moitié occidentale est la rue Midhat Pacha avec le souk couvert de Midhat Pacha, et sa moitié orientale la rue Bab Sharqi ; près de son extrémité orientale, à la porte, on montre la chapelle Saint-Ananie."
  nl:
    - "Nadat Saulus van Tarsus op de weg naar Damascus blind was geworden, zond de Heer de discipel Ananias naar hem: “Sta op, en ga in de straat, genaamd de Rechte, en vraag in het huis van Judas naar een, met name Saulus, van Tarsen; want zie, hij bidt.” Ananias legde hem de handen op, Saulus' gezicht keerde terug, en hij werd gedoopt. De straat wordt alleen hier genoemd."
    - "De straat die de Rechte heet, is de belangrijkste oost-weststraat van de oude stad van Damascus, de decumanus maximus van de Romeinse stad, die de ommuurde stad over ongeveer 1500 meter doorkruiste vanaf de oostelijke poort, Bab Sharqi, richting het westen. Een Romeinse boog staat er nog langs. De straat houdt tegenwoordig haar lijn: de westelijke helft is de Midhat Pasha-straat met de overdekte Midhat Pasha-souk, en de oostelijke helft is de Bab Sharqi-straat; bij het oostelijke einde, bij de poort, wordt de kapel van Sint-Ananias getoond."
  cs:
    - "Poté, co byl Saul z Tarsu oslepen na cestě do Damašku, poslal k němu Pán učedníka Ananiáše: „Vstaň a jdi do ulice, kteráž slove Přímá, a hledej v domě Judově Saule, jménem Tarsenského. Nebo aj, modlí se.“ Ananiáš na něj vložil ruce, Saulův zrak se vrátil a byl pokřtěn. Ulice je jmenována jen zde."
    - "Ulice zvaná Přímá je hlavní východozápadní ulice starého Damašku, decumanus maximus římského města, který přetínal hradbami obehnané město na délce asi 1 500 metrů od východní brány Báb Šarkí směrem na západ. Podél ní dosud stojí římský oblouk. Ulice si dodnes zachovává svůj průběh: její západní polovina je ulice Midhat paši s krytým súkem Midhat paši a východní polovina je ulice Báb Šarkí; poblíž jejího východního konce, u brány, se ukazuje kaple svatého Ananiáše."
  pl:
    - "Gdy Saul z Tarsu oślepł w drodze do Damaszku, Pan posłał do niego ucznia Ananiasza: „Wstań, a idź na ulicę, którą zowią prostą, a szukaj w domu Judowym Saula imieniem Tarseńczyka; albowiem oto się modli”. Ananiasz położył na niego ręce, wzrok Saula wrócił i został ochrzczony. Ulica jest wymieniona tylko tu."
    - "Ulica zwana Prostą to główna ulica wschodnio-zachodnia starego miasta Damaszku, decumanus maximus miasta rzymskiego, która przecinała otoczone murem miasto na długości około 1500 metrów od wschodniej bramy, Bab Szarki, ku zachodowi. Wzdłuż niej stoi do dziś rzymski łuk. Ulica zachowuje swój bieg: jej zachodnia połowa to ulica Midhat Paszy z krytym suk Midhat Paszy, a wschodnia to ulica Bab Szarki; blisko jej wschodniego końca, przy bramie, pokazuje się kaplicę św. Ananiasza."
