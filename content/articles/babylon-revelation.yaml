# Overview article (ADR 0007). Mainstream facts only; the Babylon of Revelation is a symbol, and the readings (Rome, Jerusalem, a literal Babylon) are given without choosing.
id: babylon-revelation
place: a3f0756
title:
  en: "Babylon of Revelation"
  ru: "Вавилон Откровения"
  uk: "Вавилон Об'явлення"
  es: "Babilonia del Apocalipsis"
  pt: "Babilônia do Apocalipse"
  de: "Babylon der Offenbarung"
  fr: "Babylone de l’Apocalypse"
  it: "Babilonia dell’Apocalisse"
  pl: "Babilon z Apokalipsy"
  nl: "Babylon in Openbaring"
  cs: "Babylón Zjevení"
  sv: "Uppenbarelsebokens Babylon"
  nb: "Babylon i Johannes' åpenbaring"
  tl: "Babilonia sa Apocalipsis"
  da: "Babylon i Johannes' Åbenbaring"
  sr: "Вавилон из Откривења"
body:
  en:
    - "The Babylon of Revelation is not the city on the Euphrates but a name John gives to a power of his own day. “Babylon the great” is a woman seated on a scarlet beast and on “seven mountains”, drunk with the blood of the saints, who is also “that great city, which reigneth over the kings of the earth”. Angels cry “Babylon is fallen, is fallen, that great city”; the kings, merchants and shipmasters who grew rich by her mourn, and the kings cry, “Alas, alas, that great city Babylon, that mighty city! for in one hour is thy judgment come”, and an angel casts a millstone into the sea to show how she “shall be found no more at all”. The language is borrowed from the prophets against the old Babylon and Tyre: Isaiah's “Babylon is fallen, is fallen”, Jeremiah's scroll sunk in the Euphrates with a stone, Ezekiel's lament of the merchants."
    - "From early on readers took the name for Rome, the city on seven hills that had burned Jerusalem in AD 70 as Babylon had in 587 BC. Jewish writers after 70, the Sibylline Oracles, 4 Ezra and 2 Baruch, call Rome Babylon; Tertullian says that in John Babylon is “a figure of the city of Rome”; and the greeting of 1 Peter from “the church that is at Babylon” was taken, as Eusebius reports from Clement and Papias, to come from Rome. Most scholars still read it so, with Rome standing for the empire and its cult of the emperor. Some have argued instead for Jerusalem, the harlot city of the prophets that killed the prophets and the Lord; readers of a futurist kind expect a Babylon rebuilt on the Euphrates; and the Reformers saw in her the papal Rome of their time. The map, following the common view, places this Babylon at Rome and shows Babylon and Jerusalem as alternatives."
    - "Revelation is usually dated to the end of Domitian's reign, about AD 95, on the word of Irenaeus, though some put it in the troubled years after Nero's death in 68. Either way its Babylon has no ruins of its own: it is wherever the city it names once stood, and the reading of its fall has been renewed in every age that found a Babylon of its own."
  ru:
    - "Вавилон Откровения — не город на Евфрате, а имя, которое Иоанн даёт державе своего времени. «Вавилон великий» — жена, сидящая на багряном звере, упоённая кровью святых; «семь голов суть семь гор, на которых сидит жена», и она же «великий город, царствующий над земными царями». Ангелы восклицают: «пал, пал Вавилон, город великий»; цари, купцы и кормчие, разбогатевшие от него, рыдают, и цари говорят: «горе, горе тебе, великий город Вавилон, город крепкий! Ибо в один час пришел суд твой», а Ангел бросает жернов в море в знак того, что «уже не будет его». Язык заимствован у пророков, говоривших против старого Вавилона и Тира: «пал, пал Вавилон» Исаии, свиток Иеремии, утопленный в Евфрате с камнем, плач купцов у Иезекииля."
    - "С ранних времён читатели понимали это имя как Рим, город на семи холмах, сжёгший Иерусалим в 70 г. н. э., как Вавилон в 587 г. до н. э. Иудейские писатели после 70 г. — Сивиллины книги, Третья книга Ездры и Апокалипсис Варуха — зовут Рим Вавилоном; Тертуллиан пишет, что у Иоанна Вавилон — образ города Рима; а приветствие Первого послания Петра, где «церковь в Вавилоне» шлёт привет, по словам Евсевия, со ссылкой на Климента и Папия, относили к Риму. Большинство учёных и сейчас читают так: Рим означает империю и её культ императора. Иные доказывали, что это Иерусалим, город-блудница пророков, убивший пророков и Господа; читатели футуристического толка ждут Вавилона, заново отстроенного на Евфрате; а реформаторы видели в нём папский Рим своего времени. Карта, следуя общему мнению, помещает этот Вавилон в Риме и показывает Вавилон и Иерусалим как варианты."
    - "Откровение обычно датируют концом правления Домициана, около 95 г. н. э., по свидетельству Иринея, хотя некоторые относят его к смутным годам после смерти Нерона в 68 г. В любом случае у этого Вавилона нет собственных развалин: он там, где стоял названный им город, а чтение его падения обновлялось в каждую эпоху, находившую свой Вавилон."
  uk:
    - "Вавилон Об'явлення — не місто на Євфраті, а ім'я, яке Іван дає силі свого часу. «Вавилон великий» — жінка, що сидить на кармазиновому звірі й на «сїм гір», «пяна від крові сьвятих», яка також є «город великий, що має царство над царями земними». Ангели волають: «Упав, упав Вавилон, великий город»; царі, купці й корабельники, що розбагатіли від неї, плачуть, і царі кажуть: «Горе, горе (тобі,) великий городе, Вавилоне, городе кріпкий, одної бо години настиг суд твій!», а ангел кидає жорно в море, щоб показати, що її «вже більш не знайдуть». Мова запозичена в пророків проти давнього Вавилона і Тіра: Ісаїне «Впав, упав Вавилон», Єремієвий сувій, потоплений в Євфраті з каменем, плач купців у Єзекіїля."
    - "Від давнини читачі розуміли ім'я як Рим, місто на семи пагорбах, що спалило Єрусалим у 70 р. н. е., як Вавилон у 587 р. до н. е. Юдейські автори після 70 року, Сивілині оракули, 4-а книга Ездри й 2-а книга Варуха називають Рим Вавилоном; Тертуліан каже, що в Івана Вавилон — «образ міста Рима»; а привітання 1-го послання Петра від «вибрана з вами (церков) в Вавилонї» зрозуміли, як повідомляє Євсевій зі слів Климента і Папія, як таке, що надходить з Рима. Більшість учених і далі так читають, з Римом як уособленням імперії та її культу імператора. Дехто натомість обстоював Єрусалим, місто-блудницю пророків, що вбивало пророків і Господа; читачі-футуристи чекають Вавилона, відбудованого на Євфраті; а реформатори бачили в ньому папський Рим свого часу. Мапа, дотримуючись поширеного погляду, розміщує цей Вавилон у Римі й показує Вавилон та Єрусалим як альтернативи."
    - "Об'явлення зазвичай датують кінцем правління Доміціана, близько 95 р. н. е., за словом Іринея, хоча дехто відносить його до неспокійних років після смерті Нерона в 68-му. Так чи так, його Вавилон не має власних руїн: він там, де колись стояло місто, яке він називає, і читання його падіння оновлювалося в кожну добу, що знаходила свій власний Вавилон."
  es:
    - "La Babilonia del Apocalipsis no es la ciudad del Éufrates sino un nombre que Juan da a un poder de su tiempo. «BABILONIA LA GRANDE» es una mujer sentada sobre una bestia escarlata y sobre «siete montes», embriagada de la sangre de los santos y también «la grande ciudad que tiene reino sobre los reyes de la tierra». Ángeles claman: «Ha caído, ha caído Babilonia, aquella grande ciudad»; los reyes, mercaderes y marinos enriquecidos con ella la lloran, y claman: «¡Ay, ay, de aquella gran ciudad de Babilonia, aquella fuerte ciudad; porque en una hora vino tu juicio!», y un ángel arroja una piedra de molino al mar para mostrar que «nunca jamás será hallada». El lenguaje viene de los profetas contra la antigua Babilonia y Tiro: el «Cayó, cayó Babilonia» de Isaías, el rollo de Jeremías hundido con una piedra en el Éufrates, el lamento de los mercaderes de Ezequiel."
    - "Pronto se tomó el nombre por Roma, la ciudad de las siete colinas que incendió Jerusalén en 70 d. C. como Babilonia en 587 a. C. Escritores judíos posteriores al 70, los Oráculos Sibilinos, 4 Esdras y 2 Baruc, llaman Babilonia a Roma; Tertuliano dice que en Juan Babilonia es «figura de la ciudad de Roma»; y el saludo de 1 Pedro desde «La iglesia que está en Babilonia» se tomó, según Eusebio por Clemente y Papías, como procedente de Roma. La mayoría de los estudiosos sigue leyéndolo así, con Roma por el imperio y su culto al emperador. Algunos defienden Jerusalén, la ciudad ramera de los profetas que mató a los profetas y al Señor; los futuristas esperan una Babilonia reconstruida en el Éufrates; y los Reformadores vieron en ella la Roma papal de su tiempo. El mapa, según la opinión común, sitúa esta Babilonia en Roma y muestra Babilonia y Jerusalén como alternativas."
    - "El Apocalipsis se fecha por lo común a finales del reinado de Domiciano, hacia 95 d. C., según la palabra de Ireneo, aunque algunos lo sitúan en los años turbulentos posteriores a la muerte de Nerón en 68. En cualquier caso su Babilonia no tiene ruinas propias: está dondequiera que estuvo la ciudad que nombra, y la lectura de su caída se ha renovado en cada época que halló una Babilonia propia."
  pt:
    - "A Babilônia do Apocalipse não é a cidade do Eufrates, mas um nome que João dá a um poder de seu tempo. “A grande Babilônia” é uma mulher sentada numa besta escarlate e sobre “sete montanhas”, embriagada com o sangue dos santos, e é também “a grande cidade que reina sobre os reis da terra”. Anjos clamam “Caiu, caiu a grande Babilônia”; os reis, mercadores e capitães que enriqueceram por ela choram, e os reis dizem: “Ai, ai da grande cidade, Babilônia, a cidade forte! Pois em uma só hora chegou o seu julgamento”, e um anjo lança uma pedra de moinho ao mar para mostrar que ela “jamais será encontrada”. A linguagem vem dos profetas contra a antiga Babilônia e Tiro: o “Caiu, caiu a Babilônia” de Isaías, o rolo de Jeremias afundado no Eufrates com uma pedra, o lamento dos mercadores em Ezequiel."
    - "Desde cedo os leitores tomaram o nome por Roma, a cidade das sete colinas que incendiou Jerusalém em 70 d.C. como a Babilônia o fizera em 587 a.C. Escritores judeus depois de 70, os Oráculos Sibilinos, 4 Esdras e 2 Baruque, chamam Roma de Babilônia; Tertuliano diz que em João a Babilônia é “uma figura da cidade de Roma”; e a saudação de 1 Pedro de “Aquela que está na Babilônia” foi entendida, como Eusébio relata a partir de Clemente e Papias, como vinda de Roma. A maioria ainda a lê assim, com Roma representando o império e o culto ao imperador. Alguns defenderam Jerusalém, a cidade prostituta dos profetas, que matou os profetas e o Senhor; futuristas esperam uma Babilônia reconstruída no Eufrates; e os reformadores viram nela a Roma papal de seu tempo. O mapa, seguindo a opinião comum, põe esta Babilônia em Roma e mostra Babilônia e Jerusalém como alternativas."
    - "O Apocalipse costuma ser datado do fim do reinado de Domiciano, por volta de 95 d.C., pela palavra de Ireneu, embora alguns o situem nos anos conturbados depois da morte de Nero, em 68. De um modo ou de outro, sua Babilônia não tem ruínas próprias: está onde quer que tenha estado a cidade que nomeia, e a leitura de sua queda foi renovada em cada época que achou uma Babilônia própria."
  de:
    - "Das Babylon der Offenbarung ist nicht die Stadt am Euphrat, sondern ein Name, den Johannes einer Macht seiner eigenen Zeit gibt. „Die große Babylon“ ist ein Weib, das auf einem scharlachroten Tier und auf „sieben Bergen“ sitzt, trunken vom Blut der Heiligen, und zugleich „die große Stadt, die das Reich hat über die Könige auf Erden“. Engel rufen: „Sie ist gefallen, sie ist gefallen, Babylon, die große Stadt“; die Könige, Kaufleute und Schiffer, die durch sie reich wurden, klagen: „Weh, weh, die große Stadt Babylon, die starke Stadt! In einer Stunde ist ihr Gericht gekommen“, und ein Engel wirft einen Mühlstein ins Meer, zum Zeichen, dass sie „nicht mehr gefunden werden“ wird. Die Sprache entlehnt den Propheten gegen Babylon und Tyrus: Jesajas „Babel ist gefallen, sie ist gefallen“, Jeremias mit einem Stein im Euphrat versenkte Rolle, Hesekiels Klage der Kaufleute."
    - "Früh hielten Leser den Namen für Rom, die Stadt auf sieben Hügeln, die 70 n. Chr. Jerusalem verbrannte wie Babylon 587 v. Chr. Jüdische Autoren nach 70, die Sibyllinischen Orakel, 4. Esra und 2. Baruch, nennen Rom Babylon; Tertullian: bei Johannes sei Babylon „ein Bild der Stadt Rom“; und den Gruß des 1. Petrusbriefs von denen, „die samt euch auserwählt sind zu Babylon“, verstand man, wie Eusebius nach Clemens und Papias berichtet, als Gruß aus Rom. Die meisten Gelehrten lesen es so, Rom als Sinnbild des Reiches und seines Kaiserkults. Manche plädierten für Jerusalem, die Hurenstadt der Propheten, die Propheten und den Herrn tötete; futuristische Leser erwarten ein am Euphrat wiederaufgebautes Babylon; die Reformatoren sahen das päpstliche Rom. Die Karte folgt der verbreiteten Ansicht und setzt dieses Babylon nach Rom; Babylon und Jerusalem zeigt sie als Alternativen."
    - "Die Offenbarung wird gewöhnlich auf das Ende der Regierung Domitians um 95 n. Chr. datiert, nach dem Wort des Irenäus, doch setzen manche sie in die unruhigen Jahre nach Neros Tod 68. So oder so hat ihr Babylon keine eigenen Ruinen: Es ist dort, wo die Stadt, die es nennt, einst stand, und die Deutung seines Falls wurde in jedem Zeitalter erneuert, das ein eigenes Babylon fand."
  fr:
    - "La Babylone de l’Apocalypse n’est pas la ville de l’Euphrate mais le nom que Jean donne à une puissance de son temps. « Babylone la grande » est une femme assise sur une bête écarlate et sur « sept montagnes », « ivre du sang des saints », qui est « la grande ville qui a la royauté sur les rois de la terre ». Des anges crient : « Elle est tombée, elle est tombée, Babylone la grande » ; les rois, marchands et pilotes enrichis par elle se lamentent, les rois criant : « Malheur ! Malheur ! La grande ville, Babylone, la ville puissante ! En une seule heure est venu ton jugement ! » ; un ange jette une meule à la mer : « elle ne sera plus trouvée ». Le langage vient des prophètes contre l’ancienne Babylone et Tyr : « Elle est tombée, elle est tombée, Babylone » d’Ésaïe, le rouleau de Jérémie coulé dans l’Euphrate avec une pierre, la plainte des marchands d’Ézéchiel."
    - "Dès l’origine, on prit le nom pour Rome, la ville aux sept collines qui avait brûlé Jérusalem en 70 apr. J.-C. comme Babylone en 587 av. J.-C. Des écrivains juifs après 70 (Oracles sibyllins, 4 Esdras, 2 Baruc) appellent Rome Babylone ; Tertullien dit que chez Jean Babylone est « une figure de la ville de Rome » ; et la salutation de 1 Pierre, envoyée par « l’Église des élus qui est à Babylone », fut comprise, selon Eusèbe d’après Clément et Papias, comme venant de Rome. La plupart des savants le lisent encore ainsi, Rome figurant l’Empire et le culte impérial. Certains plaident pour Jérusalem, ville prostituée des prophètes qui tua les prophètes et le Seigneur ; les futuristes attendent une Babylone rebâtie sur l’Euphrate ; les Réformateurs y virent la Rome papale. La carte, suivant l’opinion commune, place cette Babylone à Rome et montre Babylone et Jérusalem comme variantes."
    - "L’Apocalypse est d’ordinaire datée de la fin du règne de Domitien, vers 95 apr. J.-C., sur la parole d’Irénée, bien que certains la placent dans les années troublées après la mort de Néron en 68. Dans les deux cas, sa Babylone n’a pas de ruines propres : elle est partout où se tint la ville qu’elle nomme, et la lecture de sa chute s’est renouvelée à chaque époque qui trouva sa Babylone."
  it:
    - "La Babilonia dell’Apocalisse non è la città sull’Eufrate ma un nome che Giovanni dà a una potenza dei suoi giorni. «Babilonia la grande» è una donna seduta su una bestia scarlatta e su «sette monti», ebbra del sangue dei santi, che è anche «la gran città che impera sui re della terra». Angeli gridano «Caduta, caduta è Babilonia la grande»; i re, i mercanti e i capitani di nave che si arricchirono per mezzo di lei si lamentano, e i re gridano: «Ahi! ahi! Babilonia, la gran città, la potente città! il tuo giudicio è venuto in un momento!», e un angelo getta una macina in mare per mostrare come «non sarà più ritrovata». Il linguaggio è preso dai profeti contro la vecchia Babilonia e Tiro: il «Caduta, caduta è Babilonia!» di Isaia, il rotolo di Geremia affondato nell’Eufrate con una pietra, il lamento dei mercanti di Ezechiele."
    - "Fin da subito i lettori lessero il nome come Roma, la città dai sette colli che aveva bruciato Gerusalemme nel 70 d.C. come Babilonia nel 587 a.C. Scrittori giudei dopo il 70, gli Oracoli sibillini, 4 Esdra e 2 Baruc, chiamano Roma Babilonia; Tertulliano dice che in Giovanni Babilonia è «una figura della città di Roma»; e il saluto di 1 Pietro da «La chiesa che è in Babilonia» fu inteso, come riferisce Eusebio da Clemente e Papia, come proveniente da Roma. La maggior parte degli studiosi la legge così, Roma per l’impero e il culto imperiale. Altri sostengono Gerusalemme, la città meretrice dei profeti che uccise i profeti e il Signore; i futuristi attendono una Babilonia ricostruita sull’Eufrate; e i Riformatori vi videro la Roma papale del loro tempo. La carta, secondo l’opinione comune, pone questa Babilonia a Roma, con Babilonia e Gerusalemme come alternative."
    - "L’Apocalisse è di solito datata alla fine del regno di Domiziano, intorno al 95 d.C., sulla parola di Ireneo, benché alcuni la pongano negli anni turbolenti dopo la morte di Nerone nel 68. In ogni caso la sua Babilonia non ha rovine proprie: è dovunque sorgesse la città che nomina, e la lettura della sua caduta è stata rinnovata in ogni età che trovò una Babilonia propria."
  pl:
    - "Babilon z Apokalipsy to nie miasto nad Eufratem, lecz nazwa, jaką Jan nadaje potędze swoich czasów. „Babilon wielki” to kobieta siedząca na szkarłatnej bestii i na „siedm gór”, pijana krwią świętych, która jest też „miasto ono wielkie, które ma królestwo nad królami ziemi”. Aniołowie wołają: „Upadł Babilon, ono miasto wielkie!”; królowie, kupcy i żeglarze, którzy się przez nią wzbogacili, lamentują, a królowie wołają: „Biada, biada, miasto ono wielkie Babilon, miasto ono mocne, iż w jednę godzinę przyszedł sąd twój!”, i anioł wrzuca kamień młyński w morze, by pokazać, że „już więcej nie będzie znaleziony”. Język jest zapożyczony od proroków przeciw dawnemu Babilonowi i Tyrowi: „Upadł, upadł Babilon” Izajasza, zwój Jeremiasza zatopiony w Eufracie z kamieniem, lament kupców u Ezechiela."
    - "Od początku czytelnicy brali tę nazwę za Rzym, miasto na siedmiu wzgórzach, które w 70 r. n.e. spaliło Jerozolimę, tak jak Babilon w 587 r. p.n.e. Żydowscy pisarze po roku 70, Wyrocznie Sybilli, 4 Ezdrasza i 2 Baruch nazywają Rzym Babilonem; Tertulian mówi, że w Janie Babilon jest „figurą miasta Rzymu”; a pozdrowienie 1 Listu Piotra „Pozdrawia was spółwybrany zbór, ten, który jest w Babilonie” uważano, jak donosi Euzebiusz za Klemensem i Papiaszem, za pochodzące z Rzymu. Większość uczonych nadal czyta je tak, a Rzym oznacza imperium i kult cesarza. Inni wskazywali Jerozolimę, miasto-nierządnicę proroków, które zabijało proroków i Pana; futuryści oczekują Babilonu odbudowanego nad Eufratem; reformatorzy widzieli w niej papieski Rzym swoich czasów. Mapa, idąc za powszechnym poglądem, umieszcza ten Babilon w Rzymie i pokazuje Babilon i Jerozolimę jako alternatywy."
    - "Apokalipsę datuje się zwykle na koniec panowania Domicjana, około 95 r. n.e., według słowa Ireneusza, choć niektórzy umieszczają ją w niespokojnych latach po śmierci Nerona w 68. Tak czy owak jej Babilon nie ma własnych ruin: jest wszędzie tam, gdzie stało miasto, które nazywa, a odczytanie jego upadku odnawiano w każdym wieku, który znalazł własny Babilon."
  nl:
    - "Het Babylon van Openbaring is niet de stad aan de Eufraat maar een naam die Johannes aan een macht van zijn tijd geeft. “Het grote Babylon” is een vrouw, gezeten op een scharlaken beest en op “zeven bergen”, dronken van het bloed der heiligen, die tevens “de grote stad, die het koninkrijk heeft over de koningen der aarde” is. Een engel roept: “Zij is gevallen, zij is gevallen, Babylon, die grote stad”; koningen, kooplieden en schippers die aan haar rijk werden, treuren; de koningen roepen: “Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in een ure gekomen”, en een engel werpt een molensteen in zee om te tonen dat zij “niet meer gevonden” zal worden. De taal komt van de profeten tegen het oude Babylon en Tyrus: Jesaja’s “Babel is gevallen, zij is gevallen!”, Jeremia’s met een steen in de Eufraat gezonken boekrol, Ezechiëls klaagzang der kooplieden."
    - "Al vroeg zagen lezers in de naam Rome, de stad op zeven heuvels die Jeruzalem in 70 n.Chr. had verbrand zoals Babylon in 587 v.Chr. Joodse schrijvers na 70 (Sibyllijnse Orakels, 4 Ezra, 2 Baruch) noemen Rome Babylon; Tertullianus zegt dat Babylon bij Johannes “een beeld van de stad Rome” is; en de groet van 1 Petrus van “de medeuitverkorene Gemeente, die in Babylon is” werd, zoals Eusebius naar Clemens en Papias meldt, geacht uit Rome te komen. De meesten lezen het nog zo, Rome als sinnebeeld van het rijk en zijn keizerscultus. Sommigen bepleitten Jeruzalem, de hoerenstad der profeten, die de profeten en de Heer doodde; futuristen verwachten een herbouwd Babylon aan de Eufraat; en de Hervormers zagen in haar het pauselijke Rome. De kaart plaatst dit Babylon volgens de gangbare opvatting te Rome en toont Babylon en Jeruzalem als alternatieven."
    - "Openbaring wordt gewoonlijk gedateerd op het einde van Domitianus’ regering, omstreeks 95 n.Chr., op het woord van Irenaeus, al plaatsen sommigen het in de roerige jaren na Nero’s dood in 68. In elk geval heeft zijn Babylon geen eigen ruïnes: het is waar de stad stond die het noemt, en de lezing van zijn val is vernieuwd in elk tijdperk dat een eigen Babylon vond."
  cs:
    - "Babylón Zjevení není město na Eufratu, ale jméno, které Jan dává mocnosti své doby. „Babylon veliký“ je žena, kterou Jan viděl „sedící na šelmě brunátné“ a na „sedm hor“, „opilou krví svatých“, a která je také „město to veliké, kteréž má království nad králi země“. Andělé volají „Padl, padl Babylon, město to veliké“; králové, obchodníci a kapitáni lodí, kteří z ní zbohatli, naříkají a králové volají: „Běda, běda, veliké město Babylon, to město silné, že jest jedné hodiny přišel odsudek tvůj“, a anděl hodí žernov do moře, aby ukázal, jak „již více nebude nalezeno“. Jazyk je vypůjčen z proroků proti starému Babylónu a Týru: Izajášovo „Padl, padl Babylon“, Jeremjášův svitek potopený v Eufratu s kamenem, Ezechielův nářek obchodníků."
    - "Od počátku čtenáři brali jméno za Řím, město na sedmi pahorcích, které roku 70 n. l. spálilo Jeruzalém, jako Babylón v roce 587 př. n. l. Židovští spisovatelé po roce 70, Sibyllina proroctví, 4 Ezdráš a 2 Baruch, nazývají Řím Babylonem; Tertullianus praví, že u Jana je Babylon „obrazem města Říma“; a pozdrav 1. listu Petrova od „církve, kteráž jest v Babyloně“ byl chápán, jak podává Eusebios podle Klementa a Papia, jako pocházející z Říma. Většina badatelů to tak čte dosud, přičemž Řím stojí za říši a její kult císaře. Někteří naopak hájili Jeruzalém, město nevěstku z proroků, které zabíjelo proroky i Pána; čtenáři futuristického ražení očekávají Babylón znovu vybudovaný na Eufratu; a reformátoři v ní viděli papežský Řím své doby. Mapa podle běžného názoru klade tento Babylón do Říma a Babylón a Jeruzalém ukazuje jako alternativy."
    - "Zjevení se obvykle datuje do konce Domitianovy vlády, kolem roku 95 n. l., podle slova Irenejova, ač je někteří kladou do bouřlivých let po Neronově smrti roku 68. Tak či onak jeho Babylón nemá vlastní zříceniny: je všude tam, kde stálo město, které jmenuje, a čtení jeho pádu se obnovovalo v každém věku, který nalezl svůj vlastní Babylón."
  sv:
    - "Uppenbarelsebokens Babylon är inte staden vid Eufrat utan ett namn Johannes ger en makt i sin egen tid. ”Det stora Babylon” är en kvinna som sitter på ett scharlakansrött vilddjur och på ”sju berg”, drucken av de heligas blod, som också är ”den stora staden, som har konungsligt välde över jordens konungar”. Änglar ropar ”Fallet, fallet är det stora Babylon”; kungarna, köpmännen och skeppare som blivit rika genom henne sörjer, och kungarna ropar: ”Ve, ve dig, Babylon, du stora stad, du starka stad! Plötsligt har nu din dom kommit.” En ängel kastar en kvarnsten i havet för att visa hur hon ska ”med fart störtas ned och aldrig mer bliva funnen”. Språket är lånat från profeterna mot det gamla Babylon och Tyros: Jesajas ”Fallet, fallet är Babel”, Jeremias bokrulle sänkt i Eufrat med en sten, Hesekiels klagan över köpmännen."
    - "Tidigt tog läsare namnet för Rom, staden på sju kullar som hade bränt Jerusalem år 70 e.Kr. liksom Babylon hade gjort år 587 f.Kr. Judiska författare efter år 70, de Sibyllinska oraklen, Fjärde Esra och Andra Baruk, kallar Rom Babylon; Tertullianus säger att Babylon hos Johannes är ”en bild av staden Rom”; och hälsningen i Första Petrusbrevet från ”Församlingen i Babylon” togs, som Eusebios berättar efter Clemens och Papias, att komma från Rom. De flesta forskare läser det ännu så, med Rom som imperiets och kejsarkultens sinnebild. Några har i stället hävdat Jerusalem, profeternas skökostad som dödade profeterna och Herren; futuristiska läsare väntar ett Babylon återuppbyggt vid Eufrat; och reformatorerna såg i henne sin tids påvliga Rom. Kartan, efter den vanliga uppfattningen, placerar detta Babylon i Rom och visar Babylon och Jerusalem som alternativ."
    - "Uppenbarelseboken dateras vanligen till slutet av Domitianus’ regering, omkring år 95 e.Kr., på Irenaeus’ ord, fastän några placerar den i de oroliga åren efter Neros död år 68. Hur som helst har dess Babylon inga egna ruiner: det finns där staden det nämner en gång stod, och läsningen av dess fall har förnyats i varje tid som fann ett eget Babylon."
  nb:
    - "Babylon i Johannes' åpenbaring er ikke byen ved Eufrat, men et navn Johannes gir en makt i sin egen tid. «Babylon, den store» er en kvinne som sitter på et skarlagenrødt dyr og på «syv fjell», «drukken av de helliges blod», og som også er «den store by som har kongedømme over kongene på jorden». Engler roper «Falt, falt er Babylon, den store»; kongene, kjøpmennene og skipsførerne som ble rike ved henne, sørger, og kongene roper: «Ve, ve, du store by Babylon, du sterke by, at din dom er kommet i en time!», og en engel kaster en kvernstein i havet for å vise at hun skal «ikke finnes mere». Språket er lånt fra profetene mot det gamle Babylon og Tyros: Jesajas «Falt, falt er Babel», Jeremias bokrull senket i Eufrat med en stein, Esekiels klagesang fra kjøpmennene."
    - "Fra tidlig av tok lesere navnet for Roma, byen på de sju haugene som hadde brent Jerusalem i 70 e.Kr. slik Babylon hadde gjort i 587 f.Kr. Jødiske forfattere etter 70, de sibyllinske orakler, 4. Esra og 2. Baruk, kaller Roma Babylon; Tertullian sier at Babylon hos Johannes er «et bilde på byen Roma»; og hilsenen i 1. Peter fra «den medutvalgte menighet i Babylon» ble tatt, slik Eusebius refererer fra Klemens og Papias, for å komme fra Roma. De fleste leser det fortsatt slik, med Roma som stedfortreder for riket og keiserkulten. Noen har i stedet argumentert for Jerusalem, profetenes skjøgeby som drepte profetene og Herren; futuristiske lesere venter et gjenreist Babylon ved Eufrat; og reformatorene så i henne det pavelige Roma i sin egen tid. Kartet plasserer dette Babylon i Roma, i tråd med den vanlige oppfatningen, og viser Babylon og Jerusalem som alternativer."
    - "Åpenbaringen dateres vanligvis til slutten av Domitians regjering, omkring 95 e.Kr., etter Irenaeus' ord, selv om noen setter den til de urolige årene etter Neros død i 68. Uansett har dens Babylon ingen egne ruiner: det er der byen den nevner en gang sto, og lesningen av dens fall er blitt fornyet i hver tid som fant et Babylon av sitt eget."
  tl:
    - "Hindi ang lungsod sa Eufrates ang Babilonia ng Apocalipsis kundi pangalang ibinigay ni Juan sa kapangyarihan ng panahon niya. Ang “dakilang Babilonia” ay babaeng nakaupo sa iskarlatang hayop at sa “pitong bundok”, lasing sa dugo ng mga banal, na siya ring “dakilang bayan, na naghahari sa mga hari sa lupa”. Sigaw ng mga anghel, “Naguho, naguho ang dakilang Babilonia”; tumatangis ang mga hari, mangangalakal at kapitan ng barko na yumaman dito, “Sa aba, sa aba ng dakilang bayang Babilonia, ng bayang matibay! sapagka't sa isang oras ay dumating ang hatol sa iyo”, at naghagis ang anghel ng gilingang bato sa dagat, tanda ng “hindi na masusumpungan pa”. Hiram ang wika sa mga propeta laban sa lumang Babilonia at Tiro: ang “Babilonia ay nabagsak, nabagsak” ni Isaias, ang balumbong inilubog ni Jeremias sa Eufrates na may bato, ang panaghoy ng mangangalakal ni Ezekiel."
    - "Itinuring na Roma ang pangalan mula sa simula, ang lungsod ng pitong burol na sumunog sa Jerusalem noong 70 AD gaya ng Babilonia noong 587 BK. Tinatawag na Babilonia ang Roma ng manunulat na Judio pagkatapos ng 70 (Mga Orakulo ng Sibila, 4 Ezra, 2 Baruch); sabi ni Tertuliano, sa Juan ay “larawan ng lungsod ng Roma” ang Babilonia; at ang pagbati ng 1 Pedro mula sa “nasa Babilonia, na kasamang hinirang” ay mula sa Roma, ayon kay Eusebio mula kina Clemente at Papias. Ganito pa rin ang basa ng karamihan: Roma bilang sagisag ng imperyo at kulto ng emperador. Ipinagtanggol ng ilan ang Jerusalem, ang lungsod na pumatay sa mga propeta at sa Panginoon; inaasahan ng futurista ang Babilonia sa Eufrates na itinayong muli; nakita ng Repormador ang Roma ng papa. Ayon sa karaniwang pananaw, nasa Roma ang Babilonia ng mapa, at alternatibo ang Babilonia at Jerusalem."
    - "Karaniwang ipinepetsa ang Apocalipsis sa katapusan ng paghahari ni Domiciano, mga 95 AD, ayon sa salita ni Ireneo, bagaman inilalagay ito ng ilan sa magulong taon pagkamatay ni Nero noong 68. Sa alinmang paraan, walang sariling guho ang Babilonia nito: nasaan man tumayo noon ang lungsod na pinangalanan nito, at ang pagbasa sa pagbagsak nito ay napanibago sa bawat panahong nakahanap ng sariling Babilonia."
  da:
    - "Åbenbaringens Babylon er ikke byen ved Eufrat, men et navn, Johannes giver en magt i sin egen tid. »Babylon den store« er en kvinde, der sidder på et skarlagenrødt dyr og på »syv Bjerge«, drukken af »de helliges Blod«, og som også er »den store Stad, som har Herredømme over Jordens Konger«. Engle råber: »Falden, falden er Babylon, den store«; kongerne, købmændene og skibsførerne, som blev rige ved hende, sørger, og kongerne råber: »Ve! ve! du store Stad, Babylon, du stærke Stad, thi paa een Time er din Dom kommen«, og en engel kaster en møllesten i havet for at vise, hvordan hun »ikke findes mere«. Sproget er lånt fra profeterne mod det gamle Babylon og Tyrus: Esajas' »Babel er falden, den er falden«, Jeremias' bog sænket i Eufrat med en sten, Ezekiels klagesang over købmændene."
    - "Tidligt tog læserne navnet for Rom, byen på de syv høje, der havde brændt Jerusalem i 70 e.Kr., som Babylon havde gjort i 587 f.Kr. Jødiske forfattere efter år 70, de sibyllinske orakler, 4 Ezra og 2 Baruk, kalder Rom Babylon; Tertullian siger, at Babylon hos Johannes er et billede på byen Rom; og 1 Peters hilsen fra »Den medudvalgte i Babylon« blev, som Eusebius beretter efter Klemens og Papias, taget for at komme fra Rom. De fleste forskere læser det stadig sådan, med Rom som billede på riget og dets kejserkult. Nogle har i stedet argumenteret for Jerusalem, profeternes skøgeby, der dræbte profeterne og Herren; læsere af futuristisk slags venter et Babylon genopbygget ved Eufrat; og reformatorerne så i hende deres tids pavelige Rom. Kortet placerer efter den almindelige opfattelse dette Babylon i Rom og viser Babylon og Jerusalem som alternativer."
    - "Åbenbaringen dateres sædvanligvis til slutningen af Domitians regeringstid, omkring 95 e.Kr., efter Ireneus' ord, skønt nogle henlægger den til de urolige år efter Neros død i 68. Under alle omstændigheder har dens Babylon ingen egne ruiner: det er, hvor den by, det nævner, engang stod, og læsningen af dets fald er blevet fornyet i hver tidsalder, som fandt sit eget Babylon."
  sr:
    - "Вавилон из Откривења није град на Еуфрату него име које Јован даје сили свог доба. „Вавилон велики“ је жена која седи на скерлетној звери и на „седам гора“, пијана од крви светих, која је уједно „град велики, који има царство над царствима земаљским“. Анђели узвикују „Паде, паде Вавилон град велики“; цареви, трговци и бродовласници који су се њоме обогатили жале, а цареви кличу: „Јаох! Јаох! Граде велики Вавилоне, граде тврди, јер у један час дође суд твој!“, а анђео баца воденични камен у море да покаже како „неће се више наћи“. Језик је позајмљен од пророка против старог Вавилона и Тира: Исаијино „Паде, паде Вавилон“, Јеремијин свитак потопљен у Еуфрату с каменом, Језекиљево нарицање трговаца."
    - "Од раног доба читаоци су то име узимали за Рим, град на седам брегова који је спалио Јерусалим 70. н. е. као Вавилон 587. п. н. е. Јеврејски писци после 70, Сибилска пророчанства, 4. Јездрина и 2. Варухова, зову Рим Вавилоном; Тертулијан каже да је у Јовану Вавилон „слика града Рима“; а поздрав из 1. Петрове од „црква с вама избрана у Вавилону“ схваћен је, како Јевсевије преноси од Климента и Папије, као да долази из Рима. Већина научника и данас то тако чита, са Римом као ознаком за царство и његов култ цара. Неки су уместо тога заступали Јерусалим, градску блудницу пророка која је убијала пророке и Господа; читаоци футуристичког склопа очекују Вавилон обновљен на Еуфрату; а реформатори су у њој видели папски Рим свог времена. Карта, следећи уобичајено гледиште, ставља овај Вавилон у Рим и приказује Вавилон и Јерусалим као алтернативе."
    - "Откривење се обично датира на крај Домицијанове владавине, око 95. н. е., по речи Иренеја, мада га неки стављају у немирне године после Неронове смрти 68. У оба случаја његов Вавилон нема властитих рушевина: он је тамо где је некад стајао град који именује, а читање његовог пада обнављало се у сваком добу које је нашло свој Вавилон."
