# Overview article (ADR 0007). Mainstream facts only; Kartah is an unlocated Levitical town of Zebulun; the candidates are given without choosing; the Hebrew, KJV and Synodal text of 1 Chronicles 6:77 does not name it.
id: kartah
place: ac0f6e7
