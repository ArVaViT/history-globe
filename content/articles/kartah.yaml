body:
  en:
    - "Kartah, “town”, was one of the four towns of Zebulun given with their pasture lands to the Levites of the family of Merari: “unto the families of the children of Merari, the rest of the Levites, out of the tribe of Zebulun, Jokneam with her suburbs, and Kartah with her suburbs”, followed by Dimnah and Nahalal. In the parallel list in Chronicles the Hebrew text, the King James Version and the Synodal Bible give the Merarites of Zebulun only Rimmon and Tabor, and some modern translations add Jokneam and Kartah there to match Joshua. The map links that verse to Kartah too."
    - "The Greek translators read the verse differently. The Septuagint of Joshua gives the Merarites of Zebulun Maan and Kades with their pasture lands, not Jokneam and Kartah. Eusebius, in the fourth century, has an entry Kartha in his Onomasticon, but says only that it was a city of Zebulun set apart for the Levites; he gives none of the distances from known towns that he gives for many other places. The International Standard Bible Encyclopedia calls Kartah unidentified and suggests that the name may be another form of Kattath, one of the towns of Zebulun in Joshua 19, or of Kartan."
    - "Nothing else is known, and the site is uncertain. Its neighbour Jokneam lay where the Jezreel valley meets Mount Carmel, so Kartah is sought in western Zebulun. The map follows those who equate it with Kartan, the Levitical town of Naphtali; others have thought of Chisloth-tabor, or of Atlit on the coast south of Haifa. Each proposal rests on a reading of the lists rather than on any find of the name."
  ru:
    - "Карфа, «город», была одним из четырёх городов Завулона, отданных с предместьями левитам из рода Мерари: «Племенам сынов Мерариных, остальным левитам, дали: от колена Завулонова Иокнеам и предместья его, Карфу и предместья ее», а затем Димну и Нагалал. В параллельном списке Паралипоменон еврейский текст, перевод короля Якова и Синодальный перевод дают Мераритам от Завулона только Риммон и Фавор, а некоторые современные переводы добавляют туда Иокнеам и Карфу, согласуя с книгой Иисуса Навина. Карта связывает с Карфой и этот стих."
    - "Греческие переводчики прочли этот стих иначе. Септуагинта в книге Иисуса Навина даёт Мераритам от Завулона Маан и Кадес с их предместьями, а не Иокнеам и Карфу. Евсевий в IV веке упоминает Карфу в своём «Ономастиконе», но говорит лишь, что это город Завулона, отделённый левитам; расстояния от известных городов, которые он указывает для многих других мест, здесь нет. Международная стандартная библейская энциклопедия называет Карфу неотождествлённой и допускает, что это другая форма имени Каттаф, одного из городов Завулона в 19-й главе книги Иисуса Навина, или Карфана."
    - "Больше ничего не известно, и место не установлено. Её сосед Иокнеам лежал там, где Изреельская долина сходится с Кармилом, поэтому Карфу ищут на западе удела Завулона. Карта следует тем, кто отождествляет её с Карфаном, левитским городом Неффалима; другие думали о Кислоф-Фаворе или об Атлите на побережье к югу от Хайфы. Каждое предположение опирается на толкование списков, а не на найденное имя."
  uk:
    - "Карта, «місто», було одним із чотирьох міст Завулона, даних із пасовищами левітам роду Мерарі: «Родини ж потомків Мерарієвих, ще останнїх левитів, осягли від поколїння Зебулонового: Йокнеам укупі з пасовищами його, Карту з пасовищами її», а далі йдуть Димна й Нагалал. У паралельному переліку Хронік давньоєврейський текст, переклад короля Якова й Синодальна Біблія дають мерарітам Завулона лише Риммон і Фавор, а деякі сучасні переклади додають там Йокнеам і Карту, щоб збігалося з Книгою Ісуса Навина. Мапа пов’язує цей вірш і з Картою."
    - "Грецькі перекладачі прочитали цей вірш інакше. Септуагінта в Книзі Ісуса Навина дає мерарітам Завулона Маан і Кадес з їхніми пасовищами, а не Йокнеам і Карту. Євсевій у IV столітті має в своєму Ономастиконі статтю про Карту, але каже лише, що це місто Завулона, відділене левітам; відстаней від відомих міст, які він подає для багатьох інших місць, тут немає. International Standard Bible Encyclopedia називає Карту неототожненою й припускає, що назва може бути іншою формою Каттата, одного з міст Завулона в 19-му розділі Книги Ісуса Навина, або Картана."
    - "Більше нічого не відомо, і місце непевне. Її сусід Йокнеам лежав там, де долина Їзреель зустрічається з горою Кармель, тож Карту шукають у західному Завулоні. Мапа йде за тими, хто ототожнює її з Картаном, левітським містом Нефталима; інші думали про Кіслот-Фавор або про Атліт на узбережжі на південь від Хайфи. Кожна пропозиція спирається на прочитання переліків, а не на знахідку назви."
  es:
    - "Carta, «ciudad», era una de las cuatro ciudades de Zabulón dadas con sus ejidos a los levitas de la familia de Merari: «á las familias de los hijos de Merari, Levitas que quedaban, dióseles de la tribu de Zabulón, á Jocneam con sus ejidos, Cartha con sus ejidos», seguidas de Dimna y Nahalal. En la lista paralela de Crónicas el texto hebreo, la versión del rey Jacobo (King James) y la Biblia sinodal dan a los meraritas de Zabulón solo Rimón y Tabor, y algunas traducciones modernas añaden allí Jocneam y Carta para igualar a Josué. El mapa vincula también ese versículo con Carta."
    - "Los traductores griegos leyeron el versículo de otro modo. La Septuaginta de Josué da a los meraritas de Zabulón Maan y Cades con sus ejidos, no Jocneam y Carta. Eusebio, en el siglo IV, tiene una entrada Kartha en su Onomasticon, pero solo dice que era una ciudad de Zabulón apartada para los levitas; no da ninguna de las distancias desde ciudades conocidas que da para muchos otros lugares. La International Standard Bible Encyclopedia llama a Carta no identificada y sugiere que el nombre puede ser otra forma de Catat, una de las ciudades de Zabulón en Josué 19, o de Cartán."
    - "No se sabe nada más y el sitio es incierto. Su vecina Jocneam estaba donde el valle de Jezreel se encuentra con el monte Carmelo, de modo que Carta se busca en el Zabulón occidental. El mapa sigue a quienes la equiparan con Cartán, la ciudad levítica de Neftalí; otros han pensado en Quislot-tabor, o en Atlit, en la costa al sur de Haifa. Cada propuesta se apoya en una lectura de las listas más que en ningún hallazgo del nombre."
  pt:
    - "Cartá, “cidade”, era uma das quatro cidades de Zebulom dadas com suas pastagens aos levitas da família de Merari: “Às famílias dos filhos de Merari, o restante dos levitas, deram da tribo de Zebulom: Jocneão com suas pastagens, Cartá com suas pastagens”, seguidas de Dimna e Naalal. Na lista paralela de Crônicas, o texto hebraico, a Versão King James e a Bíblia Sinodal dão aos meraritas de Zebulom apenas Rimom e Tabor, e algumas traduções modernas acrescentam ali Jocneão e Cartá para igualar a Josué. O mapa liga esse versículo também a Cartá."
    - "Os tradutores gregos leram o versículo de outro modo. A Septuaginta de Josué dá aos meraritas de Zebulom Maan e Cades com suas pastagens, e não Jocneão e Cartá. Eusébio, no século IV, tem um verbete Kartha no seu Onomasticon, mas diz apenas que era uma cidade de Zebulom separada para os levitas; não dá nenhuma das distâncias a partir de cidades conhecidas que dá para muitos outros lugares. A International Standard Bible Encyclopedia chama Cartá de não identificada e sugere que o nome pode ser outra forma de Catate, uma das cidades de Zebulom em Josué 19, ou de Cartã."
    - "Nada mais se sabe, e o sítio é incerto. Sua vizinha Jocneão ficava onde o vale de Jezreel encontra o monte Carmelo, de modo que Cartá é procurada no oeste de Zebulom. O mapa segue os que a igualam a Cartã, a cidade levítica de Naftali; outros pensaram em Quislote-Tabor, ou em Atlit, na costa ao sul de Haifa. Cada proposta repousa numa leitura das listas e não em algum achado do nome."
  de:
    - "Kartah, „Stadt“, war eine der vier Städte Sebulons, die mit ihrem Weideland den Leviten der Familie Merari gegeben wurden: „Den Geschlechtern aber der Kinder Merari, den andern Leviten, wurden gegeben von dem Stamm Sebulon vier Städte: Jokneam und seine Vorstädte, Kartha und seine Vorstädte“, gefolgt von Dimna und Nahalal. In der Parallelliste der Chronik geben der hebräische Text, die King-James-Bibel und die Synodalübersetzung den Merariten von Sebulon nur Rimmono und Tabor, und manche modernen Übersetzungen ergänzen dort Jokneam und Kartah, um sie mit Josua in Einklang zu bringen. Die Karte verknüpft auch diesen Vers mit Kartah."
    - "Die griechischen Übersetzer lasen den Vers anders. Die Septuaginta des Buches Josua gibt den Merariten von Sebulon Maan und Kades mit ihrem Weideland, nicht Jokneam und Kartah. Eusebius hat im 4. Jahrhundert in seinem Onomastikon einen Eintrag Kartha, sagt aber nur, es sei eine Stadt Sebulons, die den Leviten ausgesondert wurde; keine der Entfernungen von bekannten Städten, die er für viele andere Orte angibt, findet sich hier. Die International Standard Bible Encyclopedia nennt Kartah nicht identifiziert und vermutet, der Name könne eine andere Form von Kattat sein, einer der Städte Sebulons in Josua 19, oder von Kartan."
    - "Sonst ist nichts bekannt, und die Lage ist ungewiss. Sein Nachbar Jokneam lag dort, wo das Jesreeltal auf den Karmel trifft, daher wird Kartah im westlichen Sebulon gesucht. Die Karte folgt denen, die es mit Kartan, der Levitenstadt Naftalis, gleichsetzen; andere haben an Kislot-Tabor oder an Atlit an der Küste südlich von Haifa gedacht. Jeder Vorschlag beruht auf einer Lesung der Listen und nicht auf einem Fund des Namens."
  fr:
    - "Kartha, « ville », fut l’une des quatre villes de Zabulon données avec leurs pâturages aux Lévites de la famille de Merari : « On donna au reste des Lévites, qui appartenaient aux familles des fils de Merari : de la tribu de Zabulon, Jokneam et sa banlieue, Kartha et sa banlieue », suivies de Dimna et de Nahalal. Dans la liste parallèle des Chroniques, le texte hébreu, la version King James et la Bible synodale ne donnent aux Mérarites de Zabulon que Rimmono et Thabor, et certaines traductions modernes y ajoutent Jokneam et Kartha pour s’accorder avec Josué. La carte rattache aussi ce verset à Kartha."
    - "Les traducteurs grecs ont lu le verset autrement. La Septante de Josué donne aux Mérarites de Zabulon Maan et Kadès avec leurs pâturages, et non Jokneam et Kartha. Eusèbe, au IVe siècle, consacre à Kartha une notice de son Onomasticon, mais dit seulement que c’était une ville de Zabulon réservée aux Lévites ; il n’y donne aucune des distances à partir de villes connues qu’il indique pour beaucoup d’autres lieux. L’International Standard Bible Encyclopedia dit Kartha non identifiée et suggère que le nom pourrait être une autre forme de Katthath, l’une des villes de Zabulon en Josué 19, ou de Karthan."
    - "On ne sait rien d’autre, et le site est incertain. Sa voisine Jokneam se trouvait là où la vallée de Jizreel rejoint le mont Carmel, aussi cherche-t-on Kartha dans l’ouest de Zabulon. La carte suit ceux qui l’identifient à Karthan, la ville lévitique de Nephthali ; d’autres ont songé à Kisloth-Thabor, ou à Atlit sur la côte au sud de Haïfa. Chaque proposition repose sur une lecture des listes et non sur une trouvaille du nom."
  pl:
    - "Karta, „miasto”, było jednym z czterech miast Zabulona oddanych wraz z pastwiskami lewitom z rodu Merariego: „Potem domom synów Merarego Lewitom ostatnim, z pokolenia Zabulonowego dano Jeknam i przedmieścia jego; Karta i przedmieścia jego”, a po nich Dimna i Nahalal. W odpowiednim wykazie w Księgach Kronik tekst hebrajski, Biblia Króla Jakuba i Biblia synodalna dają Merarytom z Zabulona tylko Rimmon i Tabor, a niektóre nowoczesne przekłady dodają tam Jokneam i Kartę zgodnie z Księgą Jozuego. Mapa wiąże ten werset także z Kartą."
    - "Tłumacze greccy odczytali ten werset inaczej. Septuaginta w Księdze Jozuego daje Merarytom z Zabulona Maan i Kades z ich pastwiskami, a nie Jokneam i Kartę. Euzebiusz w IV wieku ma w swoim Onomastikonie hasło Kartha, ale mówi tylko, że było to miasto Zabulona oddane lewitom; nie podaje żadnej z odległości od znanych miast, jakie podaje dla wielu innych miejsc. International Standard Bible Encyclopedia nazywa Kartę niezidentyfikowaną i przypuszcza, że nazwa może być inną formą Kattat, jednego z miast Zabulona w 19. rozdziale Księgi Jozuego, albo Kartan."
    - "Nic więcej nie wiadomo, a miejsce jest niepewne. Sąsiadujące Jokneam leżało tam, gdzie dolina Jizreel styka się z Karmelem, więc Kartę szuka się w zachodnim Zabulonie. Mapa idzie za tymi, którzy utożsamiają ją z Kartan, lewickim miastem Neftalego; inni myśleli o Kislot-Tabor albo o Atlit na wybrzeżu na południe od Hajfy. Każda propozycja opiera się na odczytaniu wykazów, a nie na żadnym znalezisku nazwy."
  it:
    - "Cartà, «città», era una delle quattro città di Zabulon date con i loro pascoli ai Leviti della famiglia di Merari: «E alle famiglie de’ figliuoli di Merari, cioè al rimanente de’ Leviti, furon date: della tribù di Zabulon, Iokneam e il suo contado, Karta e il suo contado», seguite da Dimna e Naalal. Nell’elenco parallelo delle Cronache il testo ebraico, la King James Version e la Bibbia sinodale danno ai Merariti di Zabulon solo Rimmon e Tabor, e alcune traduzioni moderne vi aggiungono Iokneam e Cartà per accordarsi con Giosuè. La mappa collega anche quel versetto a Cartà."
    - "I traduttori greci lessero il versetto in altro modo. La Settanta di Giosuè dà ai Merariti di Zabulon Maan e Cades con i loro pascoli, non Iokneam e Cartà. Eusebio, nel IV secolo, ha una voce Kartha nel suo Onomasticon, ma dice soltanto che era una città di Zabulon assegnata ai Leviti; non vi dà nessuna delle distanze da città note che indica per molti altri luoghi. La International Standard Bible Encyclopedia definisce Cartà non identificata e suggerisce che il nome possa essere un’altra forma di Kattat, una delle città di Zabulon in Giosuè 19, o di Cartan."
    - "Nulla d’altro si sa, e il sito è incerto. La sua vicina Iokneam sorgeva dove la valle di Izreel incontra il Monte Carmelo, perciò Cartà si cerca nella Zabulon occidentale. La mappa segue quanti la equiparano a Cartan, la città levitica di Neftali; altri hanno pensato a Chislot-Tabor, o ad Atlit sulla costa a sud di Haifa. Ogni proposta poggia su una lettura degli elenchi piuttosto che sul ritrovamento del nome."
  nl:
    - "Karta, “stad”, was een van de vier steden van Zebulon die met hun weidegronden werden gegeven aan de Levieten van het geslacht van Merari: “Aan de huisgezinnen nu van de kinderen van Merari, van de overige Levieten, werd gegeven van den stam van Zebulon, Jokneam en haar voorsteden, Kartha en haar voorsteden”, gevolgd door Dimna en Nahalal. In de parallelle lijst in Kronieken geven de Hebreeuwse tekst, de King James Version en de Synodale Bijbel de Merarieten van Zebulon alleen Rimmon en Tabor, en sommige moderne vertalingen voegen daar Jokneam en Karta toe om met Jozua overeen te komen. De kaart verbindt dat vers ook met Karta."
    - "De Griekse vertalers lazen het vers anders. De Septuaginta van Jozua geeft de Merarieten van Zebulon Maan en Kades met hun weidegronden, niet Jokneam en Karta. Eusebius heeft in de vierde eeuw in zijn Onomasticon een lemma Kartha, maar zegt alleen dat het een stad van Zebulon was die voor de Levieten was afgezonderd; hij geeft geen van de afstanden tot bekende steden die hij voor veel andere plaatsen geeft. De International Standard Bible Encyclopedia noemt Karta niet geïdentificeerd en oppert dat de naam een andere vorm kan zijn van Kattat, een van de steden van Zebulon in Jozua 19, of van Kartan."
    - "Verder is niets bekend, en de plaats is onzeker. Haar buur Jokneam lag waar de vallei van Jizreël de Karmel ontmoet, dus Karta wordt gezocht in westelijk Zebulon. De kaart volgt degenen die haar gelijkstellen met Kartan, de Levietenstad van Naftali; anderen hebben gedacht aan Kislot-Tabor, of aan Atlit aan de kust ten zuiden van Haifa. Elk voorstel berust op een lezing van de lijsten en niet op een vondst van de naam."
  cs:
    - "Karta, „město“, bylo jedním ze čtyř měst Zebulunových daných s pastvinami levitům z rodu Merari: „Čeledem pak synů Merari, Levítům ostatním, dali z pokolení Zabulonova Jekonam a předměstí jeho, Karta a předměstí jeho“, po nichž následuje Dimna a Nahalal. V paralelním seznamu v Letopisech dávají hebrejský text, Bible krále Jakuba a synodální Bible Merarovcům ze Zebulunu jen Rimmon a Tábor a některé moderní překlady tam přidávají Jokneam a Kartu, aby odpovídaly Jozue. Mapa spojuje s Kartou i tento verš."
    - "Řečtí překladatelé četli tento verš jinak. Septuaginta v knize Jozue dává Merarovcům ze Zebulunu Maan a Kades s jejich pastvinami, nikoli Jokneam a Kartu. Eusebios má ve 4. století ve svém Onomastikonu heslo Kartha, ale říká jen, že to bylo město Zebulunovo oddělené levitům; neuvádí žádnou ze vzdáleností od známých měst, jaké uvádí u mnoha jiných míst. International Standard Bible Encyclopedia označuje Kartu za neztotožněnou a navrhuje, že jméno může být jinou podobou jména Kattat, jednoho z měst Zebulunových v 19. kapitole knihy Jozue, nebo Kartan."
    - "Nic dalšího není známo a poloha je nejistá. Její soused Jokneam ležel tam, kde se Jizreelské údolí setkává s Karmelem, takže Karta se hledá v západním Zebulunu. Mapa následuje ty, kdo ji ztotožňují s Kartanem, levitským městem Neftalího; jiní myslili na Kislót-tábor nebo na Atlit na pobřeží jižně od Haify. Každý návrh se opírá o čtení seznamů, nikoli o nález jména."
  sv:
    - "Karta, ”stad”, var en av de fyra städer i Sebulon som med sina betesmarker gavs åt leviterna av Meraris släkt: ”de övriga leviterna, Meraris barns släkter, fingo ur Sebulons stam Jokneam med dess utmarker, Karta med dess utmarker”, följt av Dimna och Nahalal. I den parallella förteckningen i Krönikeböckerna ger den hebreiska texten, King James Version och Synodalbibeln Sebulons merariter bara Rimmon och Tabor, och vissa moderna översättningar lägger där till Jokneam och Karta för att stämma med Josua. Kartan länkar även den versen till Karta."
    - "De grekiska översättarna läste versen annorlunda. Septuaginta i Josuaboken ger Sebulons merariter Maan och Kades med deras betesmarker, inte Jokneam och Karta. Eusebios har på 300-talet ett uppslagsord Kartha i sitt Onomastikon, men säger bara att det var en stad i Sebulon som avskildes åt leviterna; han anger ingen av de avstånd från kända städer som han anger för många andra platser. International Standard Bible Encyclopedia kallar Karta oidentifierad och föreslår att namnet kan vara en annan form av Kattat, en av Sebulons städer i Josua 19, eller av Kartan."
    - "Inget annat är känt, och platsen är osäker. Dess granne Jokneam låg där Jisreeldalen möter Karmel, så Karta söks i västra Sebulon. På kartan har den satts lika med Kartan, den levitiska staden i Naftali; andra har tänkt på Kislot-Tabor eller på Atlit vid kusten söder om Haifa. Varje förslag vilar på en läsning av förteckningarna snarare än på något fynd av namnet."
  nb:
    - "Karta, «by», var en av de fire byene i Sebulon som sammen med beitemarkene ble gitt til levittene av Merari-ætten: «Og Meraris barns ætter, resten av levittene, fikk av Sebulons stamme: Jokneam med jorder, Karta med jorder», fulgt av Dimna og Nahalal. I den parallelle listen i Krønikebøkene gir den hebraiske teksten, King James-oversettelsen og den russiske synodalbibelen merarittene i Sebulon bare Rimmon og Tabor, og noen moderne oversettelser føyer Jokneam og Karta til der for å svare til Josva. Kartet knytter også dette verset til Karta."
    - "De greske oversetterne leste verset annerledes. Septuaginta i Josvas bok gir merarittene i Sebulon Maan og Kades med beitemarker, ikke Jokneam og Karta. Eusebios har på 300-tallet et oppslagsord Kartha i sitt Onomastikon, men sier bare at det var en by i Sebulon som ble utskilt for levittene; han oppgir ingen av de avstandene fra kjente byer som han oppgir for mange andre steder. International Standard Bible Encyclopedia kaller Karta uidentifisert og foreslår at navnet kan være en annen form av Kattat, en av Sebulons byer i Josva 19, eller av Kartan."
    - "Ellers er ingenting kjent, og stedet er usikkert. Naboen Jokneam lå der Jisreel-dalen møter Karmel, så Karta søkes i det vestlige Sebulon. Kartet følger dem som setter den lik Kartan, levittbyen i Naftali; andre har tenkt på Kislot-Tabor, eller på Atlit på kysten sør for Haifa. Hvert forslag hviler på en lesning av listene og ikke på noe funn av navnet."
  tl:
    - "Ang Kartha, “bayan”, ay isa sa apat na bayan ng Zabulon na ibinigay kasama ng mga pastulan nito sa mga Levita ng angkan ni Merari: “sa mga angkan ng mga anak ni Merari, na nalabi sa mga Levita, sa lipi ni Zabulon, ang Jocneam pati ng mga nayon niyaon, at ang Kartha pati ng mga nayon niyaon”, kasunod ang Dimna at Naalal. Sa kahawig na talaan sa Mga Cronica, ang tekstong Hebreo, ang King James Version at ang Synodal Bible ay nagbibigay lamang ng Rimmon at Thabor sa mga Merarita ng Zabulon, at idinaragdag doon ng ilang makabagong salin ang Jocneam at Kartha upang tumugma kay Josue. Iniuugnay din ng mapa ang talatang iyon sa Kartha."
    - "Iba ang pagbasa ng mga tagasaling Griego sa talata. Ibinibigay ng Septuaginta ng Josue sa mga Merarita ng Zabulon ang Maan at Cades kasama ng mga pastulan nito, hindi ang Jocneam at Kartha. May lahok na Kartha si Eusebio sa kaniyang Onomasticon noong ika-4 na siglo, ngunit sinasabi lamang niya na ito ay isang bayan ng Zabulon na ibinukod para sa mga Levita; wala rito ang alinman sa mga layo mula sa mga kilalang bayan na ibinibigay niya para sa maraming ibang lugar. Tinatawag ng International Standard Bible Encyclopedia na hindi pa nakikilala ang Kartha at iminumungkahi na ang pangalan ay maaaring ibang anyo ng Catah, isa sa mga bayan ng Zabulon sa Josue 19, o ng Cartan."
    - "Wala nang iba pang nalalaman, at hindi tiyak ang pook. Ang kapitbahay nitong Jocneam ay nasa kung saan nagtatagpo ang libis ng Jezreel at ang Bundok Carmelo, kaya hinahanap ang Kartha sa kanlurang Zabulon. Sinusunod ng mapa ang mga nagtutumbas dito sa Cartan, ang bayang Levitico ng Nephtali; inisip ng iba ang Chisiloth-tabor, o ang Atlit sa baybayin sa timog ng Haifa. Ang bawat mungkahi ay nakasalig sa pagbasa ng mga talaan at hindi sa anumang pagkatagpo ng pangalan."
  da:
    - "Karta, »by«, var en af de fire byer i Zebulon, som med deres græsgange blev givet til leviterne af Meraris slægt: »Men til Merari Børns Slægter, som vare de øvrige af Leviterne, gave de af Sebulons Stamme: Jokneam og dens Marker, Kartha og dens Marker«, efterfulgt af Dimna og Nahalal. I den parallelle liste i Krønikebøgerne giver den hebraiske tekst, King James-oversættelsen og synodalbibelen meraritterne i Zebulon kun Rimmon og Tabor, og nogle moderne oversættelser tilføjer dér Jokneam og Karta for at svare til Josva. Kortet knytter også dette vers til Karta."
    - "De græske oversættere læste verset anderledes. Septuaginta i Josvabogen giver meraritterne i Zebulon Maan og Kades med deres græsgange, ikke Jokneam og Karta. Eusebios har i 300-tallet et opslag Kartha i sit Onomastikon, men siger kun, at det var en by i Zebulon, som blev udskilt til leviterne; han angiver ingen af de afstande fra kendte byer, som han angiver for mange andre steder. International Standard Bible Encyclopedia kalder Karta uidentificeret og foreslår, at navnet kan være en anden form af Kattat, en af Zebulons byer i Josva 19, eller af Kartan."
    - "Intet andet er kendt, og stedet er usikkert. Dets nabo Jokneam lå, hvor Jizre'el-dalen møder Karmel, så Karta søges i det vestlige Zebulon. Kortet følger dem, der sidestiller den med Kartan, Naftalis levitiske by; andre har tænkt på Kislot-Tabor eller på Atlit ved kysten syd for Haifa. Hvert forslag hviler på en læsning af listerne snarere end på noget fund af navnet."
  sr:
    - "Карта, „град“, била је један од четири града Завулона дата са својим пашњацима левитима из породице Мерарије: „А породицама синова Мераријевих, осталим Левитима, даше од племена Завулоновог Јокнеам с подграђем, Карту с подграђем“, а затим Димну и Наалал. У паралелном списку у Летописима хебрејски текст, Библија краља Џејмса и Синодални превод дају Мерарићанима из Завулона само Римон и Тавор, а неки савремени преводи ту додају Јокнеам и Карту да би се ускладили с Исусом Навином. Мапа тај стих повезује и с Картом."
    - "Грчки преводиоци прочитали су овај стих другачије. Септуагинта у Књизи Исуса Навина даје Мерарићанима из Завулона Маан и Кадис с њиховим пашњацима, а не Јокнеам и Карту. Јевсевије у 4. веку има у свом Ономастикону одредницу о Карти, али каже само да је то био град Завулона одвојен левитима; не даје ниједно од растојања од познатих градова која даје за многа друга места. International Standard Bible Encyclopedia назива Карту неидентификованом и претпоставља да име може бити други облик имена Катат, једног од градова Завулона у 19. глави Књиге Исуса Навина, или Картан."
    - "Ништа друго се не зна, а налазиште је неизвесно. Њен сусед Јокнеам лежао је где се Језраелска долина састаје с Кармилом, па се Карта тражи у западном Завулону. Мапа следи оне који је изједначавају с Картаном, левитским градом Нефталима; други су помишљали на Хеслот-Тавор или на Атлит на обали јужно од Хаифе. Сваки предлог почива на читању списака, а не на било каквом налазу имена."
  hu:
    - "Kartá, „város”, Zebulon négy városának egyike volt, amelyet legelőivel együtt a Merári családjából való léviták kaptak: „A Mérári fiai családjainak pedig, e még hátralevő Lévitáknak, adák a Zebulon nemzetségéből: Jokneámot és annak legelőjét, Karthát és annak legelőjét”, majd Dimna és Nahalal következik. A Krónikák párhuzamos jegyzékében a héber szöveg, a King James-fordítás és a szinodális Biblia a Zebulonból való Merári-fiaknak csak Rimmónt és Tábort adja, és egyes modern fordítások ide is beteszik Jokneámot és Kartát, hogy egyezzen Józsuéval. A térkép ezt a verset is Kartához köti."
    - "A görög fordítók másképp olvasták a verset. A Szeptuaginta Józsué könyvében a Zebulonból való Merári-fiaknak Maant és Kadest adja legelőikkel, nem Jokneámot és Kartát. Eusebios a 4. században Onomasztikonjában külön szócikket szentel Karthának, de csak annyit mond, hogy Zebulon városa volt, amelyet a lévitáknak különítettek el; az ismert városoktól mért távolságok közül, amelyeket sok más helynél megad, itt egyet sem közöl. Az International Standard Bible Encyclopedia azonosítatlannak mondja Kartát, és felveti, hogy a név Kattát, Zebulon egyik városa Józsué 19. fejezetében, vagy Kartán más alakja lehet."
    - "Mást nem tudunk, és a hely bizonytalan. Szomszédja, Jokneám ott feküdt, ahol a Jezréel-völgy a Kármel-hegyhez ér, ezért Kartát Zebulon nyugati részén keresik. A térkép azokat követi, akik azonosítják Kartánnal, Naftáli lévita városával; mások Kiszlót-Tábort vagy a Haifától délre, a parton fekvő Atlitot gondolták. Mindegyik javaslat a jegyzékek olvasatán alapul, nem pedig azon, hogy a nevet megtalálták volna."
  fi:
    - "Karta, ”kaupunki”, oli yksi neljästä Sebulonin kaupungista, jotka annettiin laidunmaineen Merarin suvun leeviläisille: ”Muut leeviläisiin kuuluvat merarilaisten suvut saivat Sebulonin sukukunnalta Jokneamin laidunmaineen, Kartan laidunmaineen”, minkä jälkeen mainitaan Dimna ja Nahalal. Aikakirjojen rinnakkaisluettelossa heprealainen teksti, King James -käännös ja Synodaalinen Raamattu antavat Sebulonin merarilaisille vain Rimmonin ja Taborin, ja jotkut nykyiset käännökset lisäävät sinne Jokneamin ja Kartan Joosuan kirjan mukaisesti. Kartta yhdistää tämän jakeen myös Kartaan."
    - "Kreikkalaiset kääntäjät lukivat jakeen toisin. Joosuan kirjan Septuaginta antaa Sebulonin merarilaisille Maanin ja Kadesin laidunmaineen, ei Jokneamia ja Kartaa. Eusebioksella on 300-luvulla Onomastikonissaan hakusana Kartha, mutta hän sanoo vain, että se oli leeviläisille erotettu Sebulonin kaupunki; hän ei anna yhtäkään niistä etäisyyksistä tunnetuista kaupungeista, joita hän antaa monille muille paikoille. International Standard Bible Encyclopedia sanoo Kartaa tunnistamattomaksi ja arvelee, että nimi voi olla toinen muoto Kattatista, yhdestä Sebulonin kaupungeista Joosuan kirjan 19. luvussa, tai Kartanista."
    - "Muuta ei tiedetä, ja paikka on epävarma. Sen naapuri Jokneam sijaitsi siellä, missä Jisreelin laakso kohtaa Karmelvuoren, joten Kartaa etsitään läntisestä Sebulonista. Kartta seuraa niitä, jotka rinnastavat sen Kartaniin, Naftalin leeviläiskaupunkiin; toiset ovat ajatelleet Kislot-Taboria tai Atlitia rannikolla Haifasta etelään. Jokainen ehdotus perustuu luettelojen tulkintaan eikä nimen löytymiseen."
  vi:
    - "Cạt-ta, nghĩa là “thị trấn”, là một trong bốn thành của Sa-bu-lôn được cấp cùng đồng cỏ cho người Lê-vi thuộc gia tộc Mê-ra-ri: “cấp cho những họ hàng con cháu Mê-ra-ri, tức là những người Lê-vi sau chót, thành Giốc-nê-am và đất chung quanh thành, Cạt-ta và đất chung quanh thành”, tiếp theo là Đim-na và Na-ha-la. Trong danh sách song song ở sách Sử ký, bản Hê-bơ-rơ, bản King James và bản Kinh Thánh Synodal chỉ cho người Mê-ra-ri của Sa-bu-lôn Rim-môn và Tha-bô, và một số bản dịch hiện đại thêm Giốc-nê-am và Cạt-ta vào đó cho khớp với sách Giô-suê. Bản đồ cũng nối câu ấy với Cạt-ta."
    - "Các dịch giả Hy Lạp đọc câu ấy khác đi. Bản Bảy Mươi của sách Giô-suê cho người Mê-ra-ri của Sa-bu-lôn thành Maan và Cades cùng đồng cỏ, chứ không phải Giốc-nê-am và Cạt-ta. Eusebius, vào thế kỷ 4, có một mục Kartha trong Onomasticon của ông, nhưng chỉ nói đó là một thành của Sa-bu-lôn được để riêng cho người Lê-vi; ông không cho khoảng cách nào từ các thành đã biết như ông cho đối với nhiều nơi khác. International Standard Bible Encyclopedia gọi Cạt-ta là chưa được xác định và gợi ý rằng tên này có thể là một dạng khác của Cát-tát, một trong các thành của Sa-bu-lôn trong Giô-suê 19, hoặc của Cạt-than."
    - "Không biết gì thêm, và địa điểm không chắc chắn. Giốc-nê-am, thành láng giềng, nằm nơi thung lũng Gít-rê-ên gặp núi Cạt-mên, nên người ta tìm Cạt-ta ở miền tây Sa-bu-lôn. Bản đồ theo những người đồng nhất nó với Cạt-than, thành của người Lê-vi thuộc Nép-ta-li; những người khác nghĩ đến Kít-lốt-Tha-bô, hoặc Atlit trên bờ biển phía nam Haifa. Mỗi đề nghị đều dựa trên một cách đọc các danh sách chứ không dựa trên việc tìm thấy tên ấy."
  ro:
    - "Carta, „cetate”, era una dintre cele patru cetăți ale lui Zabulon date, cu pășunile lor, leviților din familia lui Merari: familiilor fiilor lui Merari, celorlalți leviți, din seminția lui Zabulon, li s-au dat Iocneam cu împrejurimile ei și Carta cu împrejurimile ei, urmate de Dimna și Nahalal. În lista paralelă din Cronici, textul ebraic, King James Version și Biblia sinodală dau merariților din Zabulon numai Rimon și Tabor, iar unele traduceri moderne adaugă acolo Iocneam și Carta, ca să se potrivească cu Iosua. Harta leagă acel verset și de Carta."
    - "Traducătorii greci au citit versetul altfel. Septuaginta cărții lui Iosua dă merariților din Zabulon Maan și Cades cu pășunile lor, nu Iocneam și Carta. Eusebiu, în secolul al IV-lea, are în Onomasticonul său o intrare Kartha, dar spune doar că era o cetate a lui Zabulon pusă deoparte pentru leviți; nu dă niciuna dintre distanțele față de orașe cunoscute pe care le dă pentru multe alte locuri. International Standard Bible Encyclopedia numește Carta neidentificată și sugerează că numele ar putea fi o altă formă a lui Catat, una dintre cetățile lui Zabulon din Iosua 19, sau a lui Cartan."
    - "Nu se mai știe nimic altceva, iar locul este nesigur. Vecina ei Iocneam se afla unde Valea Izreel întâlnește Muntele Carmel, așa că Carta este căutată în vestul lui Zabulon. Harta urmează pe cei care o identifică cu Cartan, cetatea leviților din Neftali; alții s-au gândit la Chislot-Tabor sau la Atlit, pe coasta de la sud de Haifa. Fiecare propunere se sprijină pe o interpretare a listelor, nu pe vreo descoperire a numelui."
  bg:
    - "Карта, „град“, е бил един от четирите града на Завулон, дадени заедно с пасищата им на левитите от рода на Мерари: „на родовете на Мерариевите синове, останалите от Левитите, дадоха от Завулоновото племе Йокнеам и предградията му, и Карта и предградията ѝ“, следвани от Димна и Нахалал. В успоредния списък в Летописи еврейският текст, King James Version и Синодалната Библия дават на мераритите от Завулон само Римон и Тавор, а някои съвременни преводи добавят там Йокнеам и Карта, за да съответстват на Иисус Навин. Картата свързва и този стих с Карта."
    - "Гръцките преводачи прочели стиха иначе. Септуагинта в Книгата на Иисус Навин дава на мераритите от Завулон Маан и Кадис с пасищата им, а не Йокнеам и Карта. Евсевий през IV в. има в своя Ономастикон статия за Карта, но казва само, че тя е град на Завулон, отделен за левитите; не дава нито едно от разстоянията от известни градове, които дава за много други места. „International Standard Bible Encyclopedia“ нарича Карта неидентифицирана и допуска, че името може да е друга форма на Катат, един от градовете на Завулон в 19-а глава на Книгата на Иисус Навин, или на Картан."
    - "Нищо друго не е известно и мястото е несигурно. Съседът му Йокнеам е лежал там, където Изреелската долина се среща с Кармил, затова Карта се търси в западната част на Завулон. Картата следва онези, които го приравняват с Картан, левитския град на Нефталим; други мислят за Кислот-Тавор или за Атлит на брега южно от Хайфа. Всяко предложение се основава на тълкуване на списъците, а не на някаква находка на името."
