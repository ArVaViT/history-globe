body:
  en:
    - "Kartah, “town”, was one of the four towns of Zebulun given with their pasture lands to the Levites of the family of Merari: “unto the families of the children of Merari, the rest of the Levites, out of the tribe of Zebulun, Jokneam with her suburbs, and Kartah with her suburbs”, followed by Dimnah and Nahalal. In the parallel list in Chronicles the Hebrew text, the King James Version and the Synodal Bible give the Merarites of Zebulun only Rimmon and Tabor, and some modern translations add Jokneam and Kartah there to match Joshua. The map links that verse to Kartah too."
    - "Nothing else is known, and the site is uncertain. Its neighbour Jokneam lay where the Jezreel valley meets Mount Carmel, so Kartah is sought in western Zebulun. The map follows those who equate it with Kartan, the Levitical town of Naphtali; others have thought of Chisloth-tabor, or of Atlit on the coast south of Haifa. Each proposal rests on a reading of the lists rather than on any find of the name."
  ru:
    - "Карфа, «город», была одним из четырёх городов Завулона, отданных с предместьями левитам из рода Мерари: «Племенам сынов Мерариных, остальным левитам, дали: от колена Завулонова Иокнеам и предместья его, Карфу и предместья ее», а затем Димну и Нагалал. В параллельном списке Паралипоменон еврейский текст, перевод короля Якова и Синодальный перевод дают Мераритам от Завулона только Риммон и Фавор, а некоторые современные переводы добавляют туда Иокнеам и Карфу, согласуя с книгой Иисуса Навина. Карта связывает с Карфой и этот стих."
    - "Больше ничего не известно, и место не установлено. Её сосед Иокнеам лежал там, где Изреельская долина сходится с Кармилом, поэтому Карфу ищут на западе удела Завулона. Карта следует тем, кто отождествляет её с Карфаном, левитским городом Неффалима; другие думали о Кислоф-Фаворе или об Атлите на побережье к югу от Хайфы. Каждое предположение опирается на толкование списков, а не на найденное имя."
  uk:
    - "Карта, «місто», було одним із чотирьох міст Завулона, даних із пасовищами левітам роду Мерарі: «Родини ж потомків Мерарієвих, ще останнїх левитів, осягли від поколїння Зебулонового: Йокнеам укупі з пасовищами його, Карту з пасовищами її», а далі йдуть Димна й Нагалал. У паралельному переліку Хронік давньоєврейський текст, переклад короля Якова й Синодальна Біблія дають мерарітам Завулона лише Риммон і Фавор, а деякі сучасні переклади додають там Йокнеам і Карту, щоб збігалося з Книгою Ісуса Навина. Мапа пов’язує цей вірш і з Картою."
    - "Більше нічого не відомо, і місце непевне. Її сусід Йокнеам лежав там, де долина Їзреель зустрічається з горою Кармель, тож Карту шукають у західному Завулоні. Мапа йде за тими, хто ототожнює її з Картаном, левітським містом Нефталима; інші думали про Кіслот-Фавор або про Атліт на узбережжі на південь від Хайфи. Кожна пропозиція спирається на прочитання переліків, а не на знахідку назви."
  es:
    - "Carta, «ciudad», era una de las cuatro ciudades de Zabulón dadas con sus ejidos a los levitas de la familia de Merari: «á las familias de los hijos de Merari, Levitas que quedaban, dióseles de la tribu de Zabulón, á Jocneam con sus ejidos, Cartha con sus ejidos», seguidas de Dimna y Nahalal. En la lista paralela de Crónicas el texto hebreo, la versión del rey Jacobo (King James) y la Biblia sinodal dan a los meraritas de Zabulón solo Rimón y Tabor, y algunas traducciones modernas añaden allí Jocneam y Carta para igualar a Josué. El mapa vincula también ese versículo con Carta."
    - "No se sabe nada más y el sitio es incierto. Su vecina Jocneam estaba donde el valle de Jezreel se encuentra con el monte Carmelo, de modo que Carta se busca en el Zabulón occidental. El mapa sigue a quienes la equiparan con Cartán, la ciudad levítica de Neftalí; otros han pensado en Quislot-tabor, o en Atlit, en la costa al sur de Haifa. Cada propuesta se apoya en una lectura de las listas más que en ningún hallazgo del nombre."
  pt:
    - "Cartá, “cidade”, era uma das quatro cidades de Zebulom dadas com suas pastagens aos levitas da família de Merari: “Às famílias dos filhos de Merari, o restante dos levitas, deram da tribo de Zebulom: Jocneão com suas pastagens, Cartá com suas pastagens”, seguidas de Dimna e Naalal. Na lista paralela de Crônicas, o texto hebraico, a Versão King James e a Bíblia Sinodal dão aos meraritas de Zebulom apenas Rimom e Tabor, e algumas traduções modernas acrescentam ali Jocneão e Cartá para igualar a Josué. O mapa liga esse versículo também a Cartá."
    - "Nada mais se sabe, e o sítio é incerto. Sua vizinha Jocneão ficava onde o vale de Jezreel encontra o monte Carmelo, de modo que Cartá é procurada no oeste de Zebulom. O mapa segue os que a igualam a Cartã, a cidade levítica de Naftali; outros pensaram em Quislote-Tabor, ou em Atlit, na costa ao sul de Haifa. Cada proposta repousa numa leitura das listas e não em algum achado do nome."
  de:
    - "Kartah, „Stadt“, war eine der vier Städte Sebulons, die mit ihrem Weideland den Leviten der Familie Merari gegeben wurden: „Den Geschlechtern aber der Kinder Merari, den andern Leviten, wurden gegeben von dem Stamm Sebulon vier Städte: Jokneam und seine Vorstädte, Kartha und seine Vorstädte“, gefolgt von Dimna und Nahalal. In der Parallelliste der Chronik geben der hebräische Text, die King-James-Bibel und die Synodalübersetzung den Merariten von Sebulon nur Rimmono und Tabor, und manche modernen Übersetzungen ergänzen dort Jokneam und Kartah, um sie mit Josua in Einklang zu bringen. Die Karte verknüpft auch diesen Vers mit Kartah."
    - "Sonst ist nichts bekannt, und die Lage ist ungewiss. Sein Nachbar Jokneam lag dort, wo das Jesreeltal auf den Karmel trifft, daher wird Kartah im westlichen Sebulon gesucht. Die Karte folgt denen, die es mit Kartan, der Levitenstadt Naftalis, gleichsetzen; andere haben an Kislot-Tabor oder an Atlit an der Küste südlich von Haifa gedacht. Jeder Vorschlag beruht auf einer Lesung der Listen und nicht auf einem Fund des Namens."
  fr:
    - "Kartha, « ville », fut l’une des quatre villes de Zabulon données avec leurs pâturages aux Lévites de la famille de Merari : « On donna au reste des Lévites, qui appartenaient aux familles des fils de Merari : de la tribu de Zabulon, Jokneam et sa banlieue, Kartha et sa banlieue », suivies de Dimna et de Nahalal. Dans la liste parallèle des Chroniques, le texte hébreu, la version King James et la Bible synodale ne donnent aux Mérarites de Zabulon que Rimmono et Thabor, et certaines traductions modernes y ajoutent Jokneam et Kartha pour s’accorder avec Josué. La carte rattache aussi ce verset à Kartha."
    - "On ne sait rien d’autre, et le site est incertain. Sa voisine Jokneam se trouvait là où la vallée de Jizreel rejoint le mont Carmel, aussi cherche-t-on Kartha dans l’ouest de Zabulon. La carte suit ceux qui l’identifient à Karthan, la ville lévitique de Nephthali ; d’autres ont songé à Kisloth-Thabor, ou à Atlit sur la côte au sud de Haïfa. Chaque proposition repose sur une lecture des listes et non sur une trouvaille du nom."
  pl:
    - "Karta, „miasto”, było jednym z czterech miast Zabulona oddanych wraz z pastwiskami lewitom z rodu Merariego: „Potem domom synów Merarego Lewitom ostatnim, z pokolenia Zabulonowego dano Jeknam i przedmieścia jego; Karta i przedmieścia jego”, a po nich Dimna i Nahalal. W odpowiednim wykazie w Księgach Kronik tekst hebrajski, Biblia Króla Jakuba i Biblia synodalna dają Merarytom z Zabulona tylko Rimmon i Tabor, a niektóre nowoczesne przekłady dodają tam Jokneam i Kartę zgodnie z Księgą Jozuego. Mapa wiąże ten werset także z Kartą."
    - "Nic więcej nie wiadomo, a miejsce jest niepewne. Sąsiadujące Jokneam leżało tam, gdzie dolina Jizreel styka się z Karmelem, więc Kartę szuka się w zachodnim Zabulonie. Mapa idzie za tymi, którzy utożsamiają ją z Kartan, lewickim miastem Neftalego; inni myśleli o Kislot-Tabor albo o Atlit na wybrzeżu na południe od Hajfy. Każda propozycja opiera się na odczytaniu wykazów, a nie na żadnym znalezisku nazwy."
  it:
    - "Cartà, «città», era una delle quattro città di Zabulon date con i loro pascoli ai Leviti della famiglia di Merari: «E alle famiglie de’ figliuoli di Merari, cioè al rimanente de’ Leviti, furon date: della tribù di Zabulon, Iokneam e il suo contado, Karta e il suo contado», seguite da Dimna e Naalal. Nell’elenco parallelo delle Cronache il testo ebraico, la King James Version e la Bibbia sinodale danno ai Merariti di Zabulon solo Rimmon e Tabor, e alcune traduzioni moderne vi aggiungono Iokneam e Cartà per accordarsi con Giosuè. La mappa collega anche quel versetto a Cartà."
    - "Nulla d’altro si sa, e il sito è incerto. La sua vicina Iokneam sorgeva dove la valle di Izreel incontra il Monte Carmelo, perciò Cartà si cerca nella Zabulon occidentale. La mappa segue quanti la equiparano a Cartan, la città levitica di Neftali; altri hanno pensato a Chislot-Tabor, o ad Atlit sulla costa a sud di Haifa. Ogni proposta poggia su una lettura degli elenchi piuttosto che sul ritrovamento del nome."
  nl:
    - "Karta, “stad”, was een van de vier steden van Zebulon die met hun weidegronden werden gegeven aan de Levieten van het geslacht van Merari: “Aan de huisgezinnen nu van de kinderen van Merari, van de overige Levieten, werd gegeven van den stam van Zebulon, Jokneam en haar voorsteden, Kartha en haar voorsteden”, gevolgd door Dimna en Nahalal. In de parallelle lijst in Kronieken geven de Hebreeuwse tekst, de King James Version en de Synodale Bijbel de Merarieten van Zebulon alleen Rimmon en Tabor, en sommige moderne vertalingen voegen daar Jokneam en Karta toe om met Jozua overeen te komen. De kaart verbindt dat vers ook met Karta."
    - "Verder is niets bekend, en de plaats is onzeker. Haar buur Jokneam lag waar de vallei van Jizreël de Karmel ontmoet, dus Karta wordt gezocht in westelijk Zebulon. De kaart volgt degenen die haar gelijkstellen met Kartan, de Levietenstad van Naftali; anderen hebben gedacht aan Kislot-Tabor, of aan Atlit aan de kust ten zuiden van Haifa. Elk voorstel berust op een lezing van de lijsten en niet op een vondst van de naam."
  cs:
    - "Karta, „město“, bylo jedním ze čtyř měst Zebulunových daných s pastvinami levitům z rodu Merari: „Čeledem pak synů Merari, Levítům ostatním, dali z pokolení Zabulonova Jekonam a předměstí jeho, Karta a předměstí jeho“, po nichž následuje Dimna a Nahalal. V paralelním seznamu v Letopisech dávají hebrejský text, Bible krále Jakuba a synodální Bible Merarovcům ze Zebulunu jen Rimmon a Tábor a některé moderní překlady tam přidávají Jokneam a Kartu, aby odpovídaly Jozue. Mapa spojuje s Kartou i tento verš."
    - "Nic dalšího není známo a poloha je nejistá. Její soused Jokneam ležel tam, kde se Jizreelské údolí setkává s Karmelem, takže Karta se hledá v západním Zebulunu. Mapa následuje ty, kdo ji ztotožňují s Kartanem, levitským městem Neftalího; jiní myslili na Kislót-tábor nebo na Atlit na pobřeží jižně od Haify. Každý návrh se opírá o čtení seznamů, nikoli o nález jména."
  sv:
    - "Karta, ”stad”, var en av de fyra städer i Sebulon som med sina betesmarker gavs åt leviterna av Meraris släkt: ”de övriga leviterna, Meraris barns släkter, fingo ur Sebulons stam Jokneam med dess utmarker, Karta med dess utmarker”, följt av Dimna och Nahalal. I den parallella förteckningen i Krönikeböckerna ger den hebreiska texten, King James Version och Synodalbibeln Sebulons merariter bara Rimmon och Tabor, och vissa moderna översättningar lägger där till Jokneam och Karta för att stämma med Josua. Kartan länkar även den versen till Karta."
    - "Inget annat är känt, och platsen är osäker. Dess granne Jokneam låg där Jisreeldalen möter Karmel, så Karta söks i västra Sebulon. På kartan har den satts lika med Kartan, den levitiska staden i Naftali; andra har tänkt på Kislot-Tabor eller på Atlit vid kusten söder om Haifa. Varje förslag vilar på en läsning av förteckningarna snarare än på något fynd av namnet."
  nb:
    - "Karta, «by», var en av de fire byene i Sebulon som sammen med beitemarkene ble gitt til levittene av Merari-ætten: «Og Meraris barns ætter, resten av levittene, fikk av Sebulons stamme: Jokneam med jorder, Karta med jorder», fulgt av Dimna og Nahalal. I den parallelle listen i Krønikebøkene gir den hebraiske teksten, King James-oversettelsen og den russiske synodalbibelen merarittene i Sebulon bare Rimmon og Tabor, og noen moderne oversettelser føyer Jokneam og Karta til der for å svare til Josva. Kartet knytter også dette verset til Karta."
    - "Ellers er ingenting kjent, og stedet er usikkert. Naboen Jokneam lå der Jisreel-dalen møter Karmel, så Karta søkes i det vestlige Sebulon. Kartet følger dem som setter den lik Kartan, levittbyen i Naftali; andre har tenkt på Kislot-Tabor, eller på Atlit på kysten sør for Haifa. Hvert forslag hviler på en lesning av listene og ikke på noe funn av navnet."
  tl:
    - "Ang Kartha, “bayan”, ay isa sa apat na bayan ng Zabulon na ibinigay kasama ng mga pastulan nito sa mga Levita ng angkan ni Merari: “sa mga angkan ng mga anak ni Merari, na nalabi sa mga Levita, sa lipi ni Zabulon, ang Jocneam pati ng mga nayon niyaon, at ang Kartha pati ng mga nayon niyaon”, kasunod ang Dimna at Naalal. Sa kahawig na talaan sa Mga Cronica, ang tekstong Hebreo, ang King James Version at ang Synodal Bible ay nagbibigay lamang ng Rimmon at Thabor sa mga Merarita ng Zabulon, at idinaragdag doon ng ilang makabagong salin ang Jocneam at Kartha upang tumugma kay Josue. Iniuugnay din ng mapa ang talatang iyon sa Kartha."
    - "Wala nang iba pang nalalaman, at hindi tiyak ang pook. Ang kapitbahay nitong Jocneam ay nasa kung saan nagtatagpo ang libis ng Jezreel at ang Bundok Carmelo, kaya hinahanap ang Kartha sa kanlurang Zabulon. Sinusunod ng mapa ang mga nagtutumbas dito sa Cartan, ang bayang Levitico ng Nephtali; inisip ng iba ang Chisiloth-tabor, o ang Atlit sa baybayin sa timog ng Haifa. Ang bawat mungkahi ay nakasalig sa pagbasa ng mga talaan at hindi sa anumang pagkatagpo ng pangalan."
  da:
    - "Karta, »by«, var en af de fire byer i Zebulon, som med deres græsgange blev givet til leviterne af Meraris slægt: »Men til Merari Børns Slægter, som vare de øvrige af Leviterne, gave de af Sebulons Stamme: Jokneam og dens Marker, Kartha og dens Marker«, efterfulgt af Dimna og Nahalal. I den parallelle liste i Krønikebøgerne giver den hebraiske tekst, King James-oversættelsen og synodalbibelen meraritterne i Zebulon kun Rimmon og Tabor, og nogle moderne oversættelser tilføjer dér Jokneam og Karta for at svare til Josva. Kortet knytter også dette vers til Karta."
    - "Intet andet er kendt, og stedet er usikkert. Dets nabo Jokneam lå, hvor Jizre'el-dalen møder Karmel, så Karta søges i det vestlige Zebulon. Kortet følger dem, der sidestiller den med Kartan, Naftalis levitiske by; andre har tænkt på Kislot-Tabor eller på Atlit ved kysten syd for Haifa. Hvert forslag hviler på en læsning af listerne snarere end på noget fund af navnet."
  sr:
    - "Карта, „град“, била је један од четири града Завулона дата са својим пашњацима левитима из породице Мерарије: „А породицама синова Мераријевих, осталим Левитима, даше од племена Завулоновог Јокнеам с подграђем, Карту с подграђем“, а затим Димну и Наалал. У паралелном списку у Дневницима хебрејски текст, Библија краља Џејмса и Синодални превод дају Мерарићанима из Завулона само Римон и Тавор, а неки савремени преводи ту додају Јокнеам и Карту да би се ускладили с Исусом Навином. Мапа тај стих повезује и с Картом."
    - "Ништа друго се не зна, а налазиште је неизвесно. Њен сусед Јокнеам лежао је где се Језраелска долина састаје с Кармилом, па се Карта тражи у западном Завулону. Мапа следи оне који је изједначавају с Картаном, левитским градом Нефталима; други су помишљали на Хеслот-Тавор или на Атлит на обали јужно од Хаифе. Сваки предлог почива на читању списака, а не на било каквом налазу имена."
scripture:
  - Josh.21.32
  - Josh.21.34-Josh.21.35
  - 1Chr.6.77
sources:
