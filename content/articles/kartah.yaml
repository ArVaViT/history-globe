# Overview article (ADR 0007). Mainstream facts only; Kartah is an unlocated Levitical town of Zebulun; the candidates are given without choosing; the Hebrew, KJV and Synodal text of 1 Chronicles 6:77 does not name it.
id: kartah
place: ac0f6e7
title:
  en: "Kartah"
  ru: "Карфа"
body:
  en:
    - "Kartah, “town”, was one of the four towns of Zebulun given with their pasture lands to the Levites of the family of Merari: “unto the families of the children of Merari, the rest of the Levites, out of the tribe of Zebulun, Jokneam with her suburbs, and Kartah with her suburbs”, followed by Dimnah and Nahalal. In the parallel list in Chronicles the Hebrew text, the King James Version and the Synodal Bible give the Merarites of Zebulun only Rimmon and Tabor, and some modern translations add Jokneam and Kartah there to match Joshua. The map links that verse to Kartah too."
    - "Nothing else is known, and the site is uncertain. Its neighbour Jokneam lay where the Jezreel valley meets Mount Carmel, so Kartah is sought in western Zebulun. The map follows those who equate it with Kartan, the Levitical town of Naphtali; others have thought of Chisloth-tabor, or of Atlit on the coast south of Haifa. Each proposal rests on a reading of the lists rather than on any find of the name."
  ru:
    - "Карфа, «город», была одним из четырёх городов Завулона, отданных с предместьями левитам из рода Мерари: «Племенам сынов Мерариных, остальным левитам, дали: от колена Завулонова Иокнеам и предместья его, Карфу и предместья ее», а затем Димну и Нагалал. В параллельном списке Паралипоменон еврейский текст, перевод короля Якова и Синодальный перевод дают Мераритам от Завулона только Риммон и Фавор, а некоторые современные переводы добавляют туда Иокнеам и Карфу, согласуя с книгой Иисуса Навина. Карта связывает с Карфой и этот стих."
    - "Больше ничего не известно, и место не установлено. Её сосед Иокнеам лежал там, где Изреельская долина сходится с Кармилом, поэтому Карфу ищут на западе удела Завулона. Карта следует тем, кто отождествляет её с Карфаном, левитским городом Неффалима; другие думали о Кислоф-Фаворе или об Атлите на побережье к югу от Хайфы. Каждое предположение опирается на толкование списков, а не на найденное имя."
scripture:
  - Josh.21.34-Josh.21.35
  - 1Chr.6.77
sources:
