# Overview article (ADR 0007). Mainstream facts only; the reading of the name as a town (Lebo) rather than a pass is the view of most scholars and is given as such.
id: lebo-hamath
place: a5eb047
title:
  en: "Lebo-hamath"
  ru: "Вход в Емаф"
  uk: "Вхід у Хамат"
  es: "Entrada de Hamat"
  pt: "Lebo-Hamate"
  de: "Lebo-Hamat"
  fr: "Lebo-Hamath"
  it: "Lebo-Camat"
  pl: "Lebo-Chamat"
  nl: "Lebo-Hamat"
  cs: "Lebo-chamat"
  sv: "Lebo-Hamat"
body:
  en:
    - "Lebo-hamath marks the northern limit of the land of Israel in the Bible. The King James Version, like the Synodal Bible and most passages of the Septuagint, translates the name as a phrase, “the entering in of Hamath”, as if it were the pass leading into the kingdom of Hamath on the Orontes; most scholars now read Lebo as a town, “Lebo of Hamath”, and identify it with Labweh in the northern Bekaa valley of Lebanon, beside the springs of the Orontes, about 25 km north-east of Baalbek. The name appears as Lab'u in Egyptian texts of Amenhotep II and Ramesses II, and an inscription of Tiglath-pileser III names it next to the towns of Hamath; Roman itineraries still knew a station Libo between Baalbek and Kadesh on the Orontes."
    - "The spies sent by Moses searched the land “from the wilderness of Zin unto Rehob, as men come to Hamath”; Numbers draws the northern border “from mount Hor... unto the entrance of Hamath”, and Joshua lists the land still unconquered “from Baal-gad under mount Hermon unto the entering into Hamath”. The measure of the whole land became “from the entering in of Hamath unto the river of Egypt”: so all Israel gathered when Solomon dedicated the Temple, and so Jeroboam II “restored the coast of Israel from the entering of Hamath unto the sea of the plain”. Amos turns the phrase into a threat, a nation that will afflict Israel “from the entering in of Hemath unto the river of the wilderness”; Ezekiel's ideal land again reaches north to Hamath and the border of Damascus."
    - "Labweh today is a village of the Baalbek district on the road from Baalbek to Hermel, with tells beside its springs; Diana Kirkbride's excavations there in 1969 reached levels of the Pre-Pottery Neolithic. The springs are among the sources of the Orontes (al-Asi), the river that flows north past Riblah, Hamath and Antioch to the sea."
  ru:
    - "Вход в Емаф — северный предел земли Израиля в Библии. Синодальный перевод, как и Септуагинта в большинстве мест, передаёт имя описательно, «вход в Емаф», будто речь о проходе, ведущем в царство Емаф на Оронте; большинство учёных теперь читают Лево как название города, «Лево-Хамат», и отождествляют его с Лабве в северной части долины Бекаа в Ливане, у истоков Оронта, примерно в 25 км к северо-востоку от Баальбека. Имя встречается как Лабу в египетских текстах Аменхотепа II и Рамсеса II, а надпись Феглаффелласара III называет его рядом с городами Емафа; римские дорожники ещё знали станцию Либо между Баальбеком и Кадешем на Оронте."
    - "Соглядатаи, посланные Моисеем, высмотрели землю «от пустыни Син даже до Рехова, близ Емафа»; книга Чисел ведёт северную границу «от горы Ор... к Емафу», а книга Иисуса Навина перечисляет ещё не завоёванную землю «от Ваал-Гада, что подле горы Ермона, до входа в Емаф». Мерой всей земли стало «от входа в Емаф до реки Египетской»: так собрался весь Израиль, когда Соломон освящал храм, и так Иеровоам II «восстановил пределы Израиля, от входа в Емаф до моря пустыни». У Амоса та же формула обращается в угрозу — народ, который будет теснить Израиль «от входа в Емаф до потока в пустыне»; у Иезекииля земля будущего снова доходит на севере до Емафа и границы Дамаска."
    - "Лабве сегодня — селение в округе Баальбек на дороге из Баальбека в Хермель, с теллями у источников; раскопки Дианы Киркбрайд в 1969 году дошли там до слоёв докерамического неолита. Источники — одни из истоков Оронта (Эль-Аси), реки, которая течёт на север мимо Ривлы, Емафа и Антиохии к морю."
  uk:
    - "Вхід у Хамат позначає в Біблії північну межу землі Ізраїлю. Біблія короля Якова, як і Синодальний переклад та більшість місць Септуагінти, перекладає назву як словосполучення — «ввіходу в Емат», наче це прохід, що веде до царства Хамат на Оронті; більшість учених нині читають Лево як місто, «Лево Хамату», і ототожнюють його з Лабве в північній долині Бекаа в Лівані, біля джерел Оронта, приблизно за 25 км на північний схід від Баальбека. Назва з’являється як Лабу в єгипетських текстах Аменхотепа II і Рамсеса II, а напис Тіглатпаласара III називає її поряд із містами Хамату; римські дорожники ще знали станцію Лібо між Баальбеком і Кадешем на Оронті."
    - "Розвідники, яких послав Мойсей, оглядали землю «від Зин степу до Регобу, як ійти до Гамату»; Книга Чисел веде північну межу «від Гор гори проведете її як раз до Гамата», а Ісус Навин перелічує землю, ще не завойовану, «від Баал-Гаду під Ермон-горами аж поти, де вона йде на Емат». Мірою всієї землі стало «від гряницї Емату до ріки Египецької»: так збирався весь Ізраїль, коли Соломон освячував храм, і так Єровоам II «привернув гряницї Ізраїля від уходу в Емат аж до Степового моря». Амос обертає цей вираз на загрозу — народ, що тіснитиме Ізраїль «од ввіходу в Емат та й до ріки в пустинї»; ідеальна земля Єзекіїля знову сягає на північ до Хамату й кордону Дамаска."
    - "Лабве сьогодні — село округу Баальбек на дорозі від Баальбека до Гермеля, з теллями біля його джерел; розкопки Діани Кіркбрайд там у 1969 р. дійшли до шарів докерамічного неоліту. Джерела — одні з витоків Оронта (аль-Асі), ріки, що тече на північ повз Рівлу, Хамат й Антіохію до моря."
  es:
    - "La Entrada de Hamat marca en la Biblia el límite septentrional de la tierra de Israel. La versión del rey Jacobo, como la Biblia sinodal y la Septuaginta en la mayoría de los pasajes, traduce el nombre como una frase, «la entrada de Hamath», como si se tratara del paso que lleva al reino de Hamat, en el Orontes; la mayoría de los estudiosos leen hoy Lebo como una ciudad, «Lebo de Hamat», y la identifican con Labweh, en el norte del valle de la Bekaa, en el Líbano, junto a las fuentes del Orontes, a unos 25 km al nordeste de Baalbek. El nombre aparece como Lab'u en textos egipcios de Amenhotep II y Ramsés II, y una inscripción de Tiglat-pileser III lo nombra junto a las ciudades de Hamat; los itinerarios romanos aún conocían una estación Libo entre Baalbek y Cades del Orontes."
    - "Los espías enviados por Moisés recorrieron la tierra «desde el desierto de Zin hasta Rehob, entrando en Emath»; Números traza la frontera norte «Del monte de Hor [...] á la entrada de Hamath», y Josué enumera la tierra aún sin conquistar «desde Baal-gad á las raíces del monte Hermón, hasta entrar en Hamath». La medida de toda la tierra llegó a ser «desde la entrada de Hamath hasta el arroyo de Egipto»: así se reunió todo Israel cuando Salomón dedicó el Templo, y así Jeroboam II «restituyó los términos de Israel desde la entrada de Amath hasta la mar de la llanura». Amós convierte la frase en una amenaza, una nación que oprimirá a Israel «desde la entrada de Hamath hasta el arroyo del desierto»; la tierra ideal de Ezequiel vuelve a llegar al norte hasta Hamat y la frontera de Damasco."
    - "Labweh es hoy una aldea del distrito de Baalbek, en el camino de Baalbek a Hermel, con tells junto a sus fuentes; las excavaciones de Diana Kirkbride allí en 1969 alcanzaron niveles del Neolítico Precerámico. Las fuentes figuran entre los nacimientos del Orontes (al-Asi), el río que fluye hacia el norte pasando por Ribla, Hamat y Antioquía hasta el mar."
  pt:
    - "Lebo-Hamate marca na Bíblia o limite norte da terra de Israel. A King James Version, como a Bíblia Sinodal e a maioria das passagens da Septuaginta, traduz o nome como uma expressão, “a entrada de Hamate”, como se fosse a passagem que leva ao reino de Hamate, no Orontes; a maioria dos estudiosos hoje lê Lebo como uma cidade, “Lebo de Hamate”, e a identifica com Labweh, no norte do vale da Bekaa, no Líbano, junto às nascentes do Orontes, a cerca de 25 km a nordeste de Baalbek. O nome aparece como Lab'u em textos egípcios de Amenhotep II e Ramsés II, e uma inscrição de Tiglate-Pileser III a nomeia ao lado das cidades de Hamate; itinerários romanos ainda conheciam uma estação Libo entre Baalbek e Cades, no Orontes."
    - "Os espias enviados por Moisés exploraram a terra “desde o deserto de Zim até Reobe, à entrada de Hamate”; Números traça a fronteira norte: “Do monte Hor vocês marcarão até a entrada de Hamate”, e Josué enumera a terra ainda por conquistar “desde Baal-Gade, ao pé do monte Hermom, até a entrada de Hamate”. A medida de toda a terra tornou-se “desde a entrada de Hamate até o ribeiro do Egito”: assim se reuniu todo o Israel quando Salomão dedicou o Templo, e assim Jeroboão II “restaurou a fronteira de Israel, desde a entrada de Hamate até o mar da Arabá”. Amós converte a expressão em ameaça, uma nação que afligirá Israel: “eles os afligirão desde a entrada de Hamate até o ribeiro da Arabá”; a terra ideal de Ezequiel de novo alcança o norte até Hamate e a fronteira de Damasco."
    - "Labweh é hoje uma aldeia do distrito de Baalbek, na estrada de Baalbek a Hermel, com tells junto às suas nascentes; as escavações de Diana Kirkbride ali, em 1969, alcançaram níveis do Neolítico Pré-Cerâmico. As nascentes estão entre as fontes do Orontes (al-Asi), o rio que corre para o norte passando por Ribla, Hamate e Antioquia até o mar."
  de:
    - "Lebo-Hamat bezeichnet in der Bibel die Nordgrenze des Landes Israel. Die King-James-Version übersetzt den Namen wie die Synodalbibel und die meisten Stellen der Septuaginta als Wendung, als Eingang nach Hamat, als sei es der Pass in das Königreich Hamat am Orontes; die meisten Gelehrten lesen Lebo heute als Stadt, Lebo Hamats, und setzen es mit Labweh im nördlichen Bekaa-Tal im Libanon gleich, bei den Quellen des Orontes, etwa 25 km nordöstlich von Baalbek. Der Name erscheint als Lab'u in ägyptischen Texten Amenophis' II. und Ramses' II., und eine Inschrift Tiglat-Pilesers III. nennt ihn neben den Städten Hamats; römische Itinerare kannten noch eine Station Libo zwischen Baalbek und Kadesch am Orontes."
    - "Die von Mose ausgesandten Kundschafter erkundeten das Land „von der Wüste Zin bis gen Rehob, da man gen Hamath geht“; 4. Mose zieht die Nordgrenze „von dem Berg Hor messen, bis man kommt gen Hamath“, und Josua verzeichnet das noch nicht eroberte Land „von Baal-Gad an unter dem Berge Hermon, bis man kommt gen Hamath“. Das Maß des ganzen Landes wurde „von der Grenze Hamaths an bis an den Bach Ägyptens“: So versammelte sich ganz Israel, als Salomo den Tempel weihte, und so brachte Jerobeam II. „wieder herzu das Gebiet Israels von Hamath an bis an das Meer, das im blachen Felde liegt“. Amos macht die Wendung zur Drohung, ein Volk werde Israel ängsten „von dem Ort an, da man gen Hamath geht, bis an den Bach in der Wüste“; Hesekiels Idealland reicht wieder im Norden bis Hamat und zur Grenze von Damaskus."
    - "Labweh ist heute ein Dorf im Bezirk Baalbek an der Straße von Baalbek nach Hermel, mit Tells bei seinen Quellen; Diana Kirkbrides Grabungen dort 1969 erreichten Schichten des präkeramischen Neolithikums. Die Quellen gehören zu den Ursprüngen des Orontes (al-Asi), des Flusses, der nach Norden an Ribla, Hamat und Antiochia vorbei zum Meer fließt."
  fr:
    - "Lebo-Hamath marque la limite nord du pays d’Israël dans la Bible. La version du roi Jacques, comme la Bible synodale et la plupart des passages de la Septante, traduit le nom comme une expression, « l’entrée de Hamath », comme s’il s’agissait du passage menant au royaume de Hamath sur l’Oronte ; la plupart des savants lisent aujourd’hui Lebo comme une ville, « Lebo de Hamath », et l’identifient à Labweh, dans le nord de la vallée de la Bekaa, au Liban, près des sources de l’Oronte, à environ 25 km au nord-est de Baalbek. Le nom apparaît sous la forme Lab’u dans des textes égyptiens d’Aménophis II et de Ramsès II, et une inscription de Tiglath-Piléser III le nomme à côté de villes de Hamath ; les itinéraires romains connaissaient encore une station Libo entre Baalbek et Qadesh sur l’Oronte."
    - "Les espions envoyés par Moïse explorèrent le pays « depuis le désert de Tsin jusqu’à Rehob, sur le chemin de Hamath » ; les Nombres tracent la limite nord de la montagne de Hor jusqu’à l’entrée de Hamath, et Josué dresse la liste du pays encore à conquérir « depuis Baal-Gad au pied de la montagne d’Hermon jusqu’à l’entrée de Hamath ». La mesure du pays entier devint « depuis les environs de Hamath jusqu’au torrent d’Égypte » : ainsi tout Israël s’assembla quand Salomon dédia le Temple, et ainsi Jéroboam II « rétablit les limites d’Israël depuis l’entrée de Hamath jusqu’à la mer de la plaine ». Amos fait de l’expression une menace, celle d’une nation qui opprimera Israël « depuis l’entrée de Hamath jusqu’au torrent du désert » ; le pays idéal d’Ézéchiel remonte lui aussi au nord jusqu’à Hamath et à la frontière de Damas."
    - "Labweh est aujourd’hui un village du district de Baalbek, sur la route de Baalbek à Hermel, avec des tells près de ses sources ; les fouilles de Diana Kirkbride en 1969 y ont atteint des niveaux du néolithique précéramique. Les sources sont parmi celles de l’Oronte (al-Asi), le fleuve qui coule vers le nord devant Ribla, Hamath et Antioche jusqu’à la mer."
  it:
    - "Lebo-Camat segna nella Bibbia il limite settentrionale della terra d’Israele. La King James Version, come la Bibbia sinodale e la maggior parte dei passi della Settanta, traduce il nome come una locuzione, «l’ingresso di Hamath», come se fosse il passo che conduce nel regno di Camat sull’Oronte; la maggior parte degli studiosi oggi legge Lebo come una città, «Lebo di Camat», e la identifica con Labweh nella Beqa‘ settentrionale, in Libano, presso le sorgenti dell’Oronte, a circa 25 km a nord-est di Baalbek. Il nome compare come Lab’u nei testi egiziani di Amenhotep II e di Ramesse II, e un’iscrizione di Tiglat-Pilèser III lo nomina accanto alle città di Camat; gli itinerari romani conoscevano ancora una stazione Libo tra Baalbek e Kades sull’Oronte."
    - "Gli esploratori mandati da Mosè perlustrarono il paese «dal deserto di Tsin fino a Rehob, sulla via di Hamath»; Numeri traccia il confine settentrionale «dal monte Hor … fin là dove s’entra in Hamath», e Giosuè elenca la terra ancora da conquistare «da Baal-Gad, appiè del monte Hermon, sino all’ingresso di Hamath». La misura dell’intera terra divenne dall’ingresso di Camat al torrente d’Egitto: così si radunò tutto Israele quando Salomone dedicò il Tempio, e così Geroboamo II «ristabilì i confini d’Israele dall’ingresso di Hamath al mare della pianura». Amos volge la frase in minaccia, una nazione che opprimerà Israele «dall’ingresso di Hamath fino al torrente del deserto»; la terra ideale di Ezechiele giunge di nuovo a nord fino a Camat e al confine di Damasco."
    - "Labweh è oggi un villaggio del distretto di Baalbek sulla strada da Baalbek a Hermel, con tell accanto alle sue sorgenti; gli scavi di Diana Kirkbride là nel 1969 raggiunsero livelli del Neolitico preceramico. Le sorgenti sono tra le fonti dell’Oronte (al-Asi), il fiume che scorre a nord oltre Ribla, Camat e Antiochia fino al mare."
  pl:
    - "Lebo-Chamat wyznacza w Biblii północną granicę ziemi Izraela. Biblia Króla Jakuba, podobnie jak Biblia synodalna i większość miejsc Septuaginty, tłumaczy nazwę jako wyrażenie oznaczające wejście do Chamatu, jakby chodziło o przełęcz prowadzącą do królestwa Chamatu nad Orontesem; większość uczonych czyta dziś Lebo jako miasto, „Lebo z Chamatu”, i utożsamia je z Labweh w północnej dolinie Bika w Libanie, obok źródeł Orontesu, około 25 km na północny wschód od Baalbeku. Nazwa pojawia się jako Lab'u w tekstach egipskich Amenhotepa II i Ramzesa II, a inskrypcja Tiglat-Pilesera III wymienia ją obok miast Chamatu; rzymskie itineraria znały jeszcze stację Libo między Baalbekiem a Kadesz nad Orontesem."
    - "Zwiadowcy wysłani przez Mojżesza przeszukali ziemię „od puszczy Syn aż do Rochob, którędy chodzą do Emat”; Księga Liczb wyznacza północną granicę: „od góry Hor wymierzycie granice, aż gdzie wchodzą do Hemat”, a Jozue wylicza ziemię jeszcze niepodbitą „od Baalgad pod górę Hermon, aż gdzie chodzą do Emat”. Miarą całej ziemi stało się „od wejścia do Emat aż do rzeki Egipskiej”: tak zgromadził się cały Izrael, gdy Salomon poświęcał świątynię, i tak Jeroboam II „przywrócił granice Izraelskie od wejścia do Emat aż do morza pustego”. Amos zamienia to wyrażenie w groźbę, naród, który uciśnie Izraela „od wejścia do Emat aż do strumienia pustyni”; idealna ziemia Ezechiela znów sięga na północ do Chamatu i granicy Damaszku."
    - "Labweh jest dziś wsią w okręgu Baalbek przy drodze z Baalbeku do Hermelu, z tellami obok źródeł; wykopaliska Diany Kirkbride w 1969 r. dotarły do warstw przedceramicznego neolitu. Źródła należą do źródeł Orontesu (al-Asi), rzeki, która płynie na północ obok Ribli, Chamatu i Antiochii do morza."
  nl:
    - "Lebo-Hamat is in de Bijbel de noordgrens van het land Israël. De King James Version vertaalt de naam, zoals de Synodale Bijbel en de meeste passages van de Septuaginta, als een uitdrukking, “den ingang van Hamath”, alsof het de pas was die naar het koninkrijk Hamat aan de Orontes leidde; de meeste geleerden lezen Lebo nu als een stad, “Lebo van Hamat”, en identificeren het met Labweh in het noordelijke Bekaadal van Libanon, bij de bronnen van de Orontes, zo'n 25 km ten noordoosten van Baalbek. De naam komt voor als Lab'u in Egyptische teksten van Amenhotep II en Ramses II, en een inscriptie van Tiglat-Pileser III noemt hem naast de steden van Hamat; Romeinse routebeschrijvingen kenden nog een halteplaats Libo tussen Baalbek en Kades aan de Orontes."
    - "De verspieders die Mozes zond, doorzochten het land “van de woestijn Zin af tot Rechob toe, waar men gaat naar Hamath”; Numeri trekt de noordgrens: “Van den berg Hor zult gij aftekenen tot daar men komt te Hamath”, en Jozua noemt het nog niet veroverde land “van Baal-Gad, onder aan den berg Hermon, tot aan den ingang van Hamath”. De maat van het hele land werd “van den ingang af van Hamath tot de rivier van Egypte”: zo kwam heel Israël samen toen Salomo de tempel inwijdde, en zo wordt ook van Jerobeam II gezegd: “Hij bracht ook weder de landpale van Israël van den ingang van Hamath, tot aan de zee van het vlakke veld”. Amos maakt van de uitdrukking een dreigement, een volk dat Israël zal drukken “van daar men komt te Hamath, tot aan de beek der wildernis”; Ezechiëls ideale land reikt opnieuw naar het noorden tot Hamat en de grens van Damascus."
    - "Labweh is tegenwoordig een dorp in het district Baalbek aan de weg van Baalbek naar Hermel, met tells bij zijn bronnen; de opgravingen van Diana Kirkbride daar in 1969 bereikten lagen uit het aceramisch neolithicum. De bronnen behoren tot de bronnen van de Orontes (al-Asi), de rivier die naar het noorden langs Ribla, Hamat en Antiochië naar de zee stroomt."
  cs:
    - "Lebo-chamat označuje v Bibli severní hranici země Izraele. Anglická Bible krále Jakuba, stejně jako synodální Bible a většina míst Septuaginty, překládá jméno jako slovní spojení, vchod do Chamatu, jako by šlo o průsmyk vedoucí do království Chamat na Orontu; většina badatelů dnes čte Lebo jako město, „Lebo Chamatu“, a ztotožňuje je s Labwehem v severní Bekáe v Libanonu, u pramenů Orontu, asi 25 km severovýchodně od Baalbeku. Jméno se objevuje jako Lab'u v egyptských textech Amenhotepa II. a Ramesse II. a nápis Tiglatpilesara III. je jmenuje vedle měst Chamatu; římské itineráře znaly ještě stanici Libo mezi Baalbekem a Kádešem na Orontu."
    - "Zvědové vyslaní Mojžíšem prohlíželi zemi „od pouště Tsin až do Rohob, kudy se jde do Emat“; Numeri vedou severní hranici takto: „Od hory Hor vyměříte sobě, až kde se vchází do Emat“ a Jozue uvádí zemi dosud nedobytou „od Balgad pod horou Hermon, až kde se vchází do Emat“. Míra celé země se stala „odtud, kudyž se chodí do Emat, až ku potoku Egyptskému“: tak se shromáždil všechen Izrael, když Šalomoun světil chrám, a tak Jarobeám II. „dobyl končin Izraelských od toho místa, kudy se jde do Emat, až k moři pustému“. Amos obrací to rčení v hrozbu, v národ, který bude sužovat Izraele „odtud, kudy se jde do Emat, až do potoka roviny“; Ezechielova ideální země opět sahá na sever k Chamatu a k hranici Damašku."
    - "Labweh je dnes vesnice v okrese Baalbek při silnici z Baalbeku do Hermelu s tely u pramenů; vykopávky Diany Kirkbrideové tam roku 1969 dosáhly vrstev předkeramického neolitu. Prameny patří ke zdrojům Orontu (al-Asi), řeky, která teče na sever kolem Riblahu, Chamatu a Antiochie k moři."
  sv:
    - "Lebo-Hamat markerar gränsen i norr för Israels land i Bibeln. King James Version, liksom Synodalbibeln och de flesta ställen i Septuaginta, översätter namnet som en fras – ”the entering in of Hamath”, i Bibeln 1917 ”det ställe där vägen går till Hamat” – som om det vore passet som leder in i riket Hamat vid Orontes; de flesta forskare läser nu Lebo som en stad, ”Lebo i Hamat”, och identifierar den med Labweh i norra Bekaadalen i Libanon, vid Orontes källor, omkring 25 km nordost om Baalbek. Namnet förekommer som Lab'u i egyptiska texter från Amenhotep II och Ramses II, och en inskrift av Tiglat-Pileser III nämner den bredvid Hamats städer; romerska itinerarier kände ännu en station Libo mellan Baalbek och Kadesh vid Orontes."
    - "De spejare Mose sände bespejade landet ”från öknen Sin ända till Rehob, där vägen går till Hamat”; Fjärde Mosebok drar den norra gränsen ”Från berget Hor … dit där vägen går till Hamat”, och Josua förtecknar det land som ännu inte erövrats ”från Baal-Gad, nedanför berget Hermon, ända dit där vägen går till Hamat”. Måttet på hela landet blev ”ifrån det ställe där vägen går till Hamat ända till Egyptens bäck”: så samlades hela Israel när Salomo invigde templet, och så ”återvann” Jerobeam II ”Israels område, från det ställe där vägen går till Hamat ända till Hedmarkshavet”. Amos vänder frasen till ett hot, ett folk som skall förtrycka Israel ”från det ställe där vägen går till Hamat ända till Hedmarksbäcken”; Hesekiels idealland når åter norrut till Hamat och Damaskus gräns."
    - "Labweh är i dag en by i Baalbeks distrikt vid vägen från Baalbek till Hermel, med tell vid sina källor; Diana Kirkbrides utgrävningar där 1969 nådde lager från den förkeramiska neolitiska tiden. Källorna hör till Orontes (al-Asi) upphov, floden som rinner norrut förbi Rivla, Hamat och Antiochia till havet."
