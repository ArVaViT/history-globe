body:
  en:
    - "Helam is the place where David defeated the Arameans in the war that began with the Ammonites' insult to his envoys. After a first defeat “Hadarezer sent, and brought out the Syrians that were beyond the river: and they came to Helam; and Shobach the captain of the host of Hadarezer went before them”. David “gathered all Israel together, and passed over Jordan, and came to Helam”; the Arameans fled, Shobach was struck down and died there, and the kings who served Hadarezer made peace with Israel. The parallel account in Chronicles tells the same battle without naming Helam. The Synodal Bible, following the Greek, reads “beyond the river Halamak”, and so the name stands there twice."
    - "The site is unknown. Because David crossed the Jordan to reach it, most look east of the river, and the map follows the proposal of Alma in the Hauran of southern Syria; others think of a place between Damascus and Hamath, of Aleppo, or of Alamatha, a town that Ptolemy places near the Euphrates. None has been confirmed, and no other ancient text names Helam as a place; Josephus turns it into a king, “Chalaman, the king of the Syrians, beyond Euphrates”."
  ru:
    - "Елам — место, где Давид разбил Сирийцев в войне, начавшейся с оскорбления, нанесённого его послам Аммонитянами. После первого поражения «послал Адраазар и призвал Сирийцев, которые за рекою Халамаком, и пришли они к Еламу; а Совак, военачальник Адраазаров, предводительствовал ими». Давид «собрал всех Израильтян, и перешел Иордан и пришел к Еламу»; Сирийцы побежали, Совак был поражён и там умер, а цари, служившие Адраазару, заключили мир с Израилем. Параллельный рассказ Паралипоменон описывает ту же битву, не называя Елама. Синодальный перевод вслед за греческим читает «за рекою Халамаком», так что имя стоит там дважды."
    - "Место неизвестно. Поскольку Давид перешёл Иордан, чтобы прийти туда, большинство ищет его к востоку от реки, и карта следует предположению об Альме в Хауране на юге Сирии; другие думают о месте между Дамаском и Емафом, об Алеппо или об Аламафе, городе, который Птолемей помещает близ Евфрата. Ни одно предположение не подтверждено, и ни в одном другом древнем тексте Елам не назван как место; Иосиф Флавий превращает его в царя — «Халамана, царя сирийцев за Евфратом»."
  uk:
    - "Елам — місце, де Давид розбив арамеїв у війні, що почалася з образи аммонітян, завданої його посланцям. Після першої поразки «послав Адраазер по Сирийцїв по тім боцї ріки, й прийшли вони до Еламу, а Собах, гетьман Адраазерів, проводив їм». Давида сповістили, і «скликав він усього Ізраїля, перейшов Йордань, і прийшов до Еламу»; арамеї втекли, Совака було вражено, і він там помер, а царі, що служили Адраазару, уклали мир з Ізраїлем. Паралельна оповідь Хронік розповідає про ту саму битву, не називаючи Елам. Синодальна Біблія, слідуючи грецькому тексту, читає «за рікою Халамак», і тому назва стоїть там двічі."
    - "Місце невідоме. Оскільки Давид перейшов Йордан, щоб дістатися до нього, більшість шукає на схід від ріки, і карта йде за пропозицією Альми в Хаврані в південній Сирії; інші думають про місце між Дамаском і Хаматом, про Алеппо або про Аламату, місто, яке Птолемей розміщує поблизу Євфрату. Жодне не підтверджене, і жоден інший давній текст не називає Елам місцем; Йосиф Флавій робить із нього царя — «Халамана, царя сирійців за Євфратом»."
  es:
    - "Helam es el lugar donde David derrotó a los arameos en la guerra que empezó con el insulto de los amonitas a sus enviados. Tras una primera derrota, «envió Hadad-ezer, y sacó los Siros que estaban de la otra parte del río, los cuales vinieron á Helam, llevando por jefe á Sobach general del ejército de Hadad-ezer». David «juntó á todo Israel, y pasando el Jordán vino á Helam»; los arameos huyeron, Sobac fue herido y murió allí, y los reyes que servían a Hadad-ezer hicieron paz con Israel. El relato paralelo de Crónicas cuenta la misma batalla sin nombrar Helam. La Biblia sinodal, siguiendo el griego, lee «más allá del río Halamak», y así el nombre aparece allí dos veces."
    - "El sitio se ignora. Como David cruzó el Jordán para llegar a él, la mayoría lo busca al este del río, y el mapa sigue la propuesta de Alma, en el Haurán, en el sur de Siria; otros piensan en un lugar entre Damasco y Hamat, en Alepo o en Alamatha, una ciudad que Ptolomeo sitúa cerca del Éufrates. Ninguno se ha confirmado, y ningún otro texto antiguo nombra Helam como lugar; Josefo lo convierte en un rey, «Calamán, rey de los sirios de más allá del Éufrates»."
  pt:
    - "Helã é o lugar onde Davi derrotou os arameus na guerra que começou com a ofensa dos amonitas aos seus enviados. Depois de uma primeira derrota, “Hadadezer mandou trazer os sírios que estavam do outro lado do Rio; e eles vieram a Helã, tendo à frente Sobaque, o comandante do exército de Hadadezer”. Davi “reuniu todo o Israel, atravessou o Jordão e foi a Helã”; os arameus fugiram, Sobaque foi ferido e morreu ali, e os reis que serviam a Hadadezer fizeram paz com Israel. O relato paralelo de Crônicas conta a mesma batalha sem nomear Helã. A Bíblia Sinodal, seguindo o grego, lê “do outro lado do rio Halamak”, e assim o nome aparece ali duas vezes."
    - "O sítio é desconhecido. Como Davi atravessou o Jordão para chegar a ele, a maioria olha a leste do rio, e o mapa segue a proposta de Alma, no Haurã do sul da Síria; outros pensam num lugar entre Damasco e Hamate, em Alepo, ou em Alamatha, cidade que Ptolomeu situa perto do Eufrates. Nenhuma foi confirmada, e nenhum outro texto antigo nomeia Helã como lugar; Josefo o transforma num rei, “Calamã, rei dos sírios além do Eufrates”."
  de:
    - "Helam ist der Ort, an dem David die Aramäer in dem Krieg besiegte, der mit der Beleidigung seiner Gesandten durch die Ammoniter begann. Nach einer ersten Niederlage „sandte“ Hadadeser „hin und brachte heraus die Syrer jenseit des Stromes und führte herein ihre Macht; und Sobach, der Feldhauptmann Hadadesers, zog vor ihnen her“. Als David davon erfuhr, „sammelte er zuhauf das ganze Israel und zog über den Jordan und kam gen Helam“; die Aramäer flohen, Schobach wurde niedergestreckt und starb dort, und die Könige, die Hadadeser dienten, machten Frieden mit Israel. Der Parallelbericht der Chronik erzählt dieselbe Schlacht ohne Helam zu nennen. Die Synodalübersetzung liest nach dem Griechischen jenseits des Flusses Chalamak, sodass der Name dort zweimal steht."
    - "Die Stätte ist unbekannt. Weil David den Jordan überquerte, um sie zu erreichen, suchen die meisten östlich des Flusses, und die Karte folgt dem Vorschlag Alma im Hauran Südsyriens; andere denken an einen Ort zwischen Damaskus und Hamat, an Aleppo oder an Alamatha, eine Stadt, die Ptolemäus nahe dem Euphrat ansetzt. Keiner ist bestätigt, und kein anderer antiker Text nennt Helam als Ort; Josephus macht daraus einen König, „Chalaman, den König der Syrer jenseits des Euphrat“."
  fr:
    - "Hélam est le lieu où David battit les Araméens dans la guerre déclenchée par l’insulte des Ammonites à ses envoyés. Après une première défaite, Hadadézer « envoya chercher les Syriens qui étaient de l’autre côté du fleuve ; et ils arrivèrent à Hélam, ayant à leur tête Schobac », chef de l’armée d’Hadadézer. David, qui assembla « tout Israël, passa le Jourdain, et vint à Hélam » ; les Araméens s’enfuirent, Schobac fut frappé et mourut sur place, et les rois soumis à Hadadézer firent la paix avec Israël. Le récit parallèle des Chroniques raconte la même bataille sans nommer Hélam. La Bible synodale, suivant le grec, lit « au-delà du fleuve Halamak », de sorte que le nom y figure deux fois."
    - "Le site est inconnu. Comme David traversa le Jourdain pour l’atteindre, la plupart cherchent à l’est du fleuve, et la carte suit la proposition d’Alma dans le Havran du sud de la Syrie ; d’autres pensent à un lieu entre Damas et Hamath, à Alep, ou à Alamatha, une ville que Ptolémée place près de l’Euphrate. Aucun n’a été confirmé, et aucun autre texte antique ne nomme Hélam comme lieu ; Josèphe en fait un roi, « Chalaman, roi des Syriens d’au-delà de l’Euphrate »."
  pl:
    - "Chelam to miejsce, gdzie Dawid pokonał Aramejczyków w wojnie, która zaczęła się od zniewagi Ammonitów wobec jego posłów. Po pierwszej klęsce: „I posłał Hadadezer, a wywiódł Syryjczyki, którzy byli za rzeką, i przyciągnęli do Helam, a Sobach, hetman wojska Hadadezerowego prowadził je”. Dawid, „zebrawszy wszystkiego Izraela, przeprawił się przez Jordan, i przyszedł do Helam”; Aramejczycy uciekli, Szobak został powalony i tam zmarł, a królowie służący Hadadezerowi zawarli pokój z Izraelem. Odpowiednik w Księgach Kronik opowiada tę samą bitwę, nie wymieniając Chelam. Biblia synodalna, idąc za greckim, czyta „za rzeką Chalamak”, tak że nazwa występuje tam dwukrotnie."
    - "Miejsce jest nieznane. Ponieważ Dawid przeprawił się przez Jordan, by do niego dotrzeć, większość szuka go na wschód od rzeki, a mapa idzie za propozycją Alma w Hauranie południowej Syrii; inni myślą o miejscu między Damaszkiem a Chamat, o Aleppo lub o Alamatha, mieście, które Ptolemeusz umieszcza koło Eufratu. Żadnego nie potwierdzono, a żaden inny tekst starożytny nie wymienia Chelam jako miejsca; Józef Flawiusz czyni z niego króla, „Chalamana, króla Syryjczyków zza Eufratu”."
  it:
    - "Elam è il luogo dove Davide sconfisse gli Aramei nella guerra iniziata con l’insulto degli Ammoniti ai suoi inviati. Dopo una prima sconfitta «Hadadezer mandò a far venire i Siri che abitavano di là dal fiume, e quelli giunsero a Helam, con alla testa Shobac, capo dell’esercito di Hadadezer». Davide «radunò tutto Israele, passò il Giordano, e giunse ad Helam»; gli Aramei fuggirono, Sobac fu colpito e vi morì, e i re che servivano Hadadezer fecero pace con Israele. Il racconto parallelo delle Cronache narra la stessa battaglia senza nominare Elam. La Bibbia sinodale, seguendo il greco, legge «oltre il fiume Halamak», e così il nome vi compare due volte."
    - "Il sito è ignoto. Poiché Davide attraversò il Giordano per raggiungerlo, i più guardano a est del fiume, e la mappa segue la proposta di Alma nell’Auran della Siria meridionale; altri pensano a un luogo fra Damasco e Camat, ad Aleppo o ad Alamatha, una città che Tolomeo pone presso l’Eufrate. Nessuna è stata confermata, e nessun altro testo antico nomina Elam come luogo; Giuseppe Flavio ne fa un re, «Calaman, re dei Siri di là dall’Eufrate»."
  nl:
    - "Chelam is de plaats waar David de Arameeërs versloeg in de oorlog die begon met de belediging van zijn gezanten door de Ammonieten. Na een eerste nederlaag “Hadad-ezer zond heen, en deed de Syriers uitkomen, die op gene zijde der rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-ezers krijgsoverste, toog voor hun aangezicht heen”. Toen David het hoorde, “verzamelde hij gans Israel, en toog over de Jordaan, en kwam te Helam”; de Arameeërs vluchtten, Sobach werd neergeslagen en stierf daar, en de koningen die Hadadezer dienden, sloten vrede met Israël. De parallelle tekst in Kronieken vertelt dezelfde slag zonder Chelam te noemen. De Synodale Bijbel, het Grieks volgend, leest “aan gene zijde van de rivier Chalamak”, en zo staat de naam daar tweemaal."
    - "De plaats is onbekend. Omdat David de Jordaan overstak om er te komen, zoeken de meesten ten oosten van de rivier, en de kaart volgt het voorstel Alma in de Hauran van zuidelijk Syrië; anderen denken aan een plaats tussen Damascus en Hamat, aan Aleppo, of aan Alamatha, een stad die Ptolemaeus bij de Eufraat plaatst. Niets is bevestigd, en geen andere oude tekst noemt Chelam als plaats; Josephus maakt er een koning van, “Chalaman, de koning van de Syriërs aan de overkant van de Eufraat”."
  cs:
    - "Chelam je místo, kde David porazil Aramejce ve válce, která začala urážkou Davidových poslů od Amónců. Po první porážce „Poslal také Hadarezer a vyvedl Syrské, kteříž bydlejí za řekou, a přišli k Helam; Sobach pak, hejtman vojska Hadarezerova, vedl je“. David „shromáždiv všecken lid Izraelský, přepravil se přes Jordán, a přitáhli k Helam“; Aramejci utekli, Šobak byl poražen a zemřel tam a králové sloužící Hadadezerovi uzavřeli s Izraelem mír. Paralelní vyprávění v Letopisech líčí tutéž bitvu, aniž Chelam jmenuje. Synodální Bible podle řečtiny čte „za řekou Chalamak“, takže se jméno vyskytuje dvakrát."
    - "Místo je neznámé. Protože David překročil Jordán, aby se k němu dostal, většina hledá východně od řeky a mapa následuje návrh Alma v Havranu v jižní Sýrii; jiní myslí na místo mezi Damaškem a Chamatem, na Aleppo nebo na Alamathu, město, které Ptolemaios klade poblíž Eufratu. Žádné nebylo potvrzeno a žádný jiný starověký text nejmenuje Chelam jako místo; Josephus z něj dělá krále, „Chalamana, krále Syřanů za Eufratem“."
  sv:
    - "Helam är platsen där David besegrade araméerna i kriget som började med ammoniternas förolämpning av hans sändebud. Efter ett första nederlag heter det: ”Och Hadadeser sände bud att de araméer som bodde på andra sidan floden skulle rycka ut; dessa kommo då till Helam, anförda av Sobak, Hadadesers härhövitsman”. När det blev berättat för David, ”församlade han hela Israel och gick över Jordan och kom till Helam”; araméerna flydde, Shovak slogs ned och dog där, och kungarna som tjänade Hadadeser slöt fred med Israel. Parallellberättelsen i Krönikeboken återger samma slag utan att nämna Helam. Den ryska synodalbibeln, som följer grekiskan, läser ”bortom floden Halamak”, så namnet står där två gånger."
    - "Platsen är okänd. Eftersom David gick över Jordan för att nå den söker de flesta öster om floden, och kartan följer förslaget Alma i Hauran i södra Syrien; andra tänker på en plats mellan Damaskus och Hamat, på Aleppo eller på Alamatha, en stad som Ptolemaios placerar nära Eufrat. Ingen har bekräftats, och ingen annan antik text nämner Helam som plats; Josefus gör det till en kung, ”Chalaman, syrernas kung, bortom Eufrat”."
  nb:
    - "Helam er stedet der David beseiret araméerne i krigen som begynte med ammonittenes fornærmelse av hans sendebud. Etter et første nederlag sendte Hadadeser «bud at de syrere som bodde på hin side av elven, skulde rykke ut; de kom til Helam, og Sobak, høvdingen over Hadadesers hær, førte dem». David samlet «hele Israel og gikk over Jordan og kom til Helam»; araméerne flyktet, Sjobak ble slått ned og døde der, og kongene som tjente Hadadeser sluttet fred med Israel. Parallellberetningen i Krønikebøkene forteller om samme slag uten å nevne Helam. Den synodale bibelen, som følger den greske teksten, har «hinsides elven Halamak», og slik står navnet der to ganger."
    - "Stedet er ukjent. Fordi David krysset Jordan for å nå det, ser de fleste øst for elven, og kartet følger forslaget om Alma i Havran i det sørlige Syria; andre tenker på et sted mellom Damaskus og Hamat, på Aleppo, eller på Alamatha, en by Ptolemaios plasserer nær Eufrat. Ingen er bekreftet, og ingen annen antikk tekst nevner Helam som et sted; Josefus gjør det til en konge, «Khalaman, kongen av syrerne hinsides Eufrat»."
  tl:
    - "Ang Helam ay ang lugar kung saan tinalo ni David ang mga Arameo sa digmaang nagsimula sa pang-iinsulto ng mga Ammonita sa kaniyang mga sugo. Pagkatapos ng unang pagkatalo, “nagsugo si Hadadezer at dinala ang mga taga Siria na nangaroon sa dako pa roon ng Ilog; at sila'y nagsiparoon sa Helam, na kasama ni Sobach na puno ng hukbo ni Hadadezer sa kanilang unahan”. Pinisan ni David “ang buong Israel, at tumawid sa Jordan, at naparoon sa Helam”; tumakas ang mga Arameo, napabuwal si Sobach at namatay doon, at nakipagpayapaan sa Israel ang mga haring naglilingkod kay Hadadezer. Isinasalaysay ng katapat na salaysay sa Mga Cronica ang parehong labanan nang hindi pinangangalanan ang Helam. Ang Bibliyang Synodal, na sumusunod sa Griyego, ay nagbabasa ng “sa kabila ng ilog Halamak”, kaya't dalawang beses lumilitaw doon ang pangalan."
    - "Hindi alam ang lugar. Dahil tumawid si David sa Jordan upang marating ito, karamihan ay tumitingin sa silangan ng ilog, at sinusunod ng mapa ang mungkahi ng Alma sa Hauran ng timog Siria; iniisip ng iba ang isang lugar sa pagitan ng Damasco at Hamath, ang Aleppo, o ang Alamatha, isang bayang inilalagay ni Ptolemy malapit sa Eufrates. Wala sa mga ito ang nakumpirma, at walang ibang sinaunang teksto ang nagpapangalan sa Helam bilang lugar; ginagawa itong hari ni Josephus, “Chalaman, ang hari ng mga Siryano, sa kabila ng Eufrates”."
  da:
    - "Helam er stedet, hvor David besejrede aramæerne i krigen, der begyndte med ammonitternes fornærmelse af hans udsendinge. Efter et første nederlag: »Hadad-Eser sendte hen og førte Syrerne, som vare paa hin Side Floden, frem, og de kom til Helam; og Sobak, som var Hadad-Esers Stridshøvedsmand, var i Spidsen for dem«. Da det blev David tilkendegivet, »samlede han al Israel og drog over Jordanen og kom til Helam«; aramæerne flygtede, Sjobak blev slået og døde dér, og de konger, der tjente Hadadezer, sluttede fred med Israel. Parallelberetningen i Krønikebøgerne fortæller det samme slag uden at nævne Helam. Den russiske synodalbibel, der følger det græske, læser »hinsides floden Halamak«, og navnet står dér derfor to gange."
    - "Stedet er ukendt. Fordi David krydsede Jordan for at nå det, søger de fleste øst for floden, og kortet følger forslaget Alma i Hauran i det sydlige Syrien; andre tænker på et sted mellem Damaskus og Hamat, på Aleppo eller på Alamatha, en by, som Ptolemaios placerer nær Eufrat. Ingen er bekræftet, og ingen anden oldtidstekst nævner Helam som sted; Josefus gør det til en konge, »Chalaman, syrernes konge hinsides Eufrat«."
  sr:
    - "Елам је место где је Давид победио Арамејце у рату који је започео увредом Амонаца његовим посланицима. После првог пораза „Адад-Езер посла, те доведе Сирце испреко реке, који дођоше у Елам; а Совак, војвода Адад-Езеров иђаше пред њима“. Давид „скупи све Израиљце, и пређе преко Јордана и дође у Елам“; Арамејци су побегли, Совак је оборен и ту погинуо, а цареви који су служили Адад-Езеру склопили су мир с Израиљем. Паралелни извештај у Летописима приповеда исту битку не именујући Елам. Руски синодски превод, следећи грчки, чита „преко реке Халамак“, па се име ту јавља двапут."
    - "Место је непознато. Пошто је Давид прешао Јордан да би до њега дошао, већина га тражи источно од реке, а карта следи предлог Алме у Аврану у јужној Сирији; други мисле на место између Дамаска и Емата, на Алеп, или на Аламату, град који Птолемеј ставља близу Еуфрата. Ништа није потврђено и ни један други древни текст не именује Елам као место; Јосиф Флавије га претвара у цара, „Халамана, цара Сираца, с оне стране Еуфрата“."
  hu:
    - "Hélám az a hely, ahol Dávid legyőzte az arámokat abban a háborúban, amely az ammoniták küldötteinek megsértésével kezdődött. Az első vereség után: „elkülde Hadadézer, és elhozatá a Siriabelieket, a kik a vizen túl valának, és jövének Helámba; és Sobák, Hadadézernek fővezére volt élükön”. Dávid „egybegyűjté egész Izráelt, és általméne a Jordánon, és juta Hélámhoz”; az arámok megfutamodtak, Sobákot megölték, ott halt meg, és a Hadadézernek szolgáló királyok békét kötöttek Izráellel. A Krónikák párhuzamos beszámolója ugyanezt a csatát mondja el Hélám megnevezése nélkül. A szinodális Biblia, a görögöt követve, a Halamak folyón túli arámokat említi, így a név ott kétszer áll."
    - "A helyet nem ismerjük. Mivel Dávid átkelt a Jordánon, hogy elérje, a legtöbben a folyótól keletre keresik, és a térkép az Alma javaslatát követi a dél-szíriai Hauranban; mások a Damaszkusz és Hamát közötti helyre gondolnak, Aleppóra, vagy Alamathára, amelyet Ptolemaiosz az Eufrátesz közelébe helyez. Egyiket sem erősítették meg, és más ókori szöveg nem nevezi meg Hélámot helyként; Josephus királlyá változtatja: „Khalamán, a szírek királya az Eufrátesszen túl”."
  fi:
    - "Helam on paikka, jossa Daavid voitti aramealaiset sodassa, joka alkoi ammonilaisten loukattua hänen lähettiläitään. Ensimmäisen tappion jälkeen ”Hadareser lähetti nostattamaan niitä aramilaisia, jotka asuivat tuolla puolella Eufrat-virran; ja he tulivat Heelamiin, ja Soobak, Hadareserin sotapäällikkö, johti heitä”. Daavid ”kokosi kaiken Israelin ja meni Jordanin yli ja tuli Heelamiin”; aramealaiset pakenivat, Sobak lyötiin ja kuoli siellä, ja kuninkaat, jotka palvelivat Hadadeseria, tekivät rauhan Israelin kanssa. Aikakirjojen rinnakkaiskertomus kertoo saman taistelun mainitsematta Helamia. Synodaalinen Raamattu, kreikkalaista seuraten, lukee ”Halamak-joen tuolla puolen”, ja niin nimi esiintyy siellä kahdesti."
    - "Paikka on tuntematon. Koska Daavid ylitti Jordanin päästäkseen sinne, useimmat etsivät sitä joen itäpuolelta, ja kartta seuraa ehdotusta Almasta Etelä-Syyrian Hauranissa; toiset ajattelevat paikkaa Damaskoksen ja Hamatin välillä, Aleppoa tai Alamathaa, kaupunkia, jonka Ptolemaios sijoittaa Eufratin lähelle. Mitään ei ole vahvistettu, eikä mikään muu muinainen teksti nimeä Helamia paikaksi; Josephus tekee siitä kuninkaan, ”Chalamanin, Eufratin tuolla puolen olevien syyrialaisten kuninkaan”."
  vi:
    - "Hê-lam là nơi Đa-vít đánh bại người A-ram trong cuộc chiến bắt đầu từ việc người Am-môn sỉ nhục sứ giả của ông. Sau thất bại đầu tiên, “Ha-đa-rê-xe sai chiêu dân Sy-ri ở bên kia sông; chúng nó đến Hê-lam, có Sô-bác làm tổng binh của Ha-đa-rê-xe, quản suất”. Đa-vít “hiệp lại hết thảy Y-sơ-ra-ên, đi ngang qua Giô-đanh, kéo đến Hê-lam”; người A-ram chạy, Sô-bác bị đánh gục và chết ở đó, và các vua phục vụ Ha-đa-đê-xe lập hòa với Y-sơ-ra-ên. Bản song song trong sách Sử Ký kể cùng trận đánh mà không nêu Hê-lam. Bản Synodal, theo bản Hy Lạp, đọc “bên kia sông Halamak”, và vì thế tên xuất hiện hai lần ở đó."
    - "Địa điểm không được biết. Vì Đa-vít qua sông Giô-đanh để đến đó, phần lớn tìm ở phía đông sông, và bản đồ theo đề nghị Alma ở Ha-vơ-ran thuộc nam Sy-ri; những người khác nghĩ đến một nơi giữa Đa-mách và Ha-mát, Aleppo, hoặc Alamatha, một thành mà Ptolemy đặt gần sông Ơ-phơ-rát. Chưa đề nghị nào được xác nhận, và không văn bản cổ nào khác nêu Hê-lam như một địa danh; Josephus biến nó thành một vị vua, “Chalaman, vua người Sy-ri, bên kia sông Ơ-phơ-rát”."
  ro:
    - "Helam este locul unde David i-a învins pe arameeni în războiul care a început cu insulta amoniților față de solii lui. După o primă înfrângere, „Adraazar a strâns pre Sirienii cei de dincolo de rîul Halamac, și a venit în Elam și Sovac mai marele oastii lui Adraazar înaintea lor”. David „a adunat pre tot Israilul, și trecând Iordanul a venit în Elam”; arameenii au fugit, Șobac a fost doborât și a murit acolo, iar regii care îl slujeau pe Hadadezer au făcut pace cu Israel. Relatarea paralelă din Cronici povestește aceeași bătălie fără să numească Helam. Biblia sinodală rusă, urmând greaca, citește „dincolo de rîul Halamac”, astfel încât numele apare acolo de două ori."
    - "Locul este necunoscut. Fiindcă David a trecut Iordanul ca să ajungă la el, cei mai mulți caută la est de râu, iar harta urmează propunerea Alma din Hauran, în sudul Siriei; alții se gândesc la un loc între Damasc și Hamat, la Alep sau la Alamatha, un oraș pe care Ptolemeu îl așază lângă Eufrat. Niciunul nu a fost confirmat, și niciun alt text antic nu numește Helam ca loc; Iosif Flaviu îl transformă într-un rege, „Chalaman, regele sirienilor de dincolo de Eufrat”."
  bg:
    - "Елам е мястото, където Давид разби арамейците във войната, започнала с оскърблението на амонците към пратениците му. След първото поражение „прати Ададезер та изведе Сирийците оттатък реката; и дойдоха в Елам; и Совак, войводата на Ададезера, вървеше пред тях“. Давид „събра всичкия Израил, и премина Йордан та дойде в Елам“; арамейците побягнаха, Совак беше поразен и умря там, а царете, които служеха на Ададезер, сключиха мир с Израил. Успоредният разказ в Летописи описва същата битка, без да назовава Елам. Синодалната Библия, следвайки гръцкия текст, чете „оттатък реката Халамак“ и така името стои там два пъти."
    - "Мястото не е известно. Понеже Давид премина Йордан, за да стигне до него, повечето го търсят на изток от реката и картата следва предложението за Алма в Хауран в Южна Сирия; други мислят за място между Дамаск и Емат, за Алепо или за Аламата — град, който Птолемей поставя близо до Ефрат. Нищо не е потвърдено и никой друг древен текст не назовава Елам като място; Йосиф Флавий го превръща в цар: „Халаман, царят на сирийците отвъд Ефрат“."
