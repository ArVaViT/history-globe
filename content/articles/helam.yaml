# Overview article (ADR 0007). Mainstream facts only; Helam is unlocated; the candidates (Alma in the Hauran, a place between Damascus and Hamath, Aleppo, Ptolemy's Alamatha) are given without choosing; the Synodal reading follows the Greek and is noted.
id: helam
place: aeb09c0
title:
  en: "Helam"
  ru: "Елам"
  uk: "Елам"
  es: "Helam"
  pt: "Helã"
  de: "Helam"
  fr: "Hélam"
body:
  en:
    - "Helam is the place where David defeated the Arameans in the war that began with the Ammonites' insult to his envoys. After a first defeat “Hadarezer sent, and brought out the Syrians that were beyond the river: and they came to Helam; and Shobach the captain of the host of Hadarezer went before them”. David “gathered all Israel together, and passed over Jordan, and came to Helam”; the Arameans fled, Shobach was struck down and died there, and the kings who served Hadarezer made peace with Israel. The parallel account in Chronicles tells the same battle without naming Helam. The Synodal Bible, following the Greek, reads “beyond the river Halamak”, and so the name stands there twice."
    - "The site is unknown. Because David crossed the Jordan to reach it, most look east of the river, and the map follows the proposal of Alma in the Hauran of southern Syria; others think of a place between Damascus and Hamath, of Aleppo, or of Alamatha, a town that Ptolemy places near the Euphrates. None has been confirmed, and Helam appears in no other ancient text."
  ru:
    - "Елам — место, где Давид разбил Сирийцев в войне, начавшейся с оскорбления, нанесённого его послам Аммонитянами. После первого поражения «послал Адраазар и призвал Сирийцев, которые за рекою Халамаком, и пришли они к Еламу; а Совак, военачальник Адраазаров, предводительствовал ими». Давид «собрал всех Израильтян, и перешел Иордан и пришел к Еламу»; Сирийцы побежали, Совак был поражён и там умер, а цари, служившие Адраазару, заключили мир с Израилем. Параллельный рассказ Паралипоменон описывает ту же битву, не называя Елама. Синодальный перевод вслед за греческим читает «за рекою Халамаком», так что имя стоит там дважды."
    - "Место неизвестно. Поскольку Давид перешёл Иордан, чтобы прийти туда, большинство ищет его к востоку от реки, и карта следует предположению об Альме в Хауране на юге Сирии; другие думают о месте между Дамаском и Емафом, об Алеппо или об Аламафе, городе, который Птолемей помещает близ Евфрата. Ни одно предположение не подтверждено, и ни в одном другом древнем тексте Елам не встречается."
  uk:
    - "Елам — місце, де Давид розбив арамеїв у війні, що почалася з образи аммонітян, завданої його посланцям. Після першої поразки «послав Адраазер по Сирийцїв по тім боцї ріки, й прийшли вони до Еламу, а Собах, гетьман Адраазерів, проводив їм». Давида сповістили, і «скликав він усього Ізраїля, перейшов Йордань, і прийшов до Еламу»; арамеї втекли, Совака було вражено, і він там помер, а царі, що служили Адраазару, уклали мир з Ізраїлем. Паралельна оповідь Хронік розповідає про ту саму битву, не називаючи Елам. Синодальна Біблія, слідуючи грецькому тексту, читає «за рікою Халамак», і тому назва стоїть там двічі."
    - "Місце невідоме. Оскільки Давид перейшов Йордан, щоб дістатися до нього, більшість шукає на схід від ріки, і карта йде за пропозицією Альми в Хаврані в південній Сирії; інші думають про місце між Дамаском і Хаматом, про Алеппо або про Аламату, місто, яке Птолемей розміщує поблизу Євфрату. Жодне не підтверджене, і Елам не з’являється в жодному іншому давньому тексті."
  es:
    - "Helam es el lugar donde David derrotó a los arameos en la guerra que empezó con el insulto de los amonitas a sus enviados. Tras una primera derrota, «envió Hadad-ezer, y sacó los Siros que estaban de la otra parte del río, los cuales vinieron á Helam, llevando por jefe á Sobach general del ejército de Hadad-ezer». David «juntó á todo Israel, y pasando el Jordán vino á Helam»; los arameos huyeron, Sobac fue herido y murió allí, y los reyes que servían a Hadad-ezer hicieron paz con Israel. El relato paralelo de Crónicas cuenta la misma batalla sin nombrar Helam. La Biblia sinodal, siguiendo el griego, lee «más allá del río Halamak», y así el nombre aparece allí dos veces."
    - "El sitio se ignora. Como David cruzó el Jordán para llegar a él, la mayoría lo busca al este del río, y el mapa sigue la propuesta de Alma, en el Haurán, en el sur de Siria; otros piensan en un lugar entre Damasco y Hamat, en Alepo o en Alamatha, una ciudad que Ptolomeo sitúa cerca del Éufrates. Ninguno se ha confirmado, y Helam no aparece en ningún otro texto antiguo."
  pt:
    - "Helã é o lugar onde Davi derrotou os arameus na guerra que começou com a ofensa dos amonitas aos seus enviados. Depois de uma primeira derrota, “Hadadezer mandou trazer os sírios que estavam do outro lado do Rio; e eles vieram a Helã, tendo à frente Sobaque, o comandante do exército de Hadadezer”. Davi “reuniu todo o Israel, atravessou o Jordão e foi a Helã”; os arameus fugiram, Sobaque foi ferido e morreu ali, e os reis que serviam a Hadadezer fizeram paz com Israel. O relato paralelo de Crônicas conta a mesma batalha sem nomear Helã. A Bíblia Sinodal, seguindo o grego, lê “do outro lado do rio Halamak”, e assim o nome aparece ali duas vezes."
    - "O sítio é desconhecido. Como Davi atravessou o Jordão para chegar a ele, a maioria olha a leste do rio, e o mapa segue a proposta de Alma, no Haurã do sul da Síria; outros pensam num lugar entre Damasco e Hamate, em Alepo, ou em Alamatha, cidade que Ptolomeu situa perto do Eufrates. Nenhuma foi confirmada, e Helã não aparece em nenhum outro texto antigo."
  de:
    - "Helam ist der Ort, an dem David die Aramäer in dem Krieg besiegte, der mit der Beleidigung seiner Gesandten durch die Ammoniter begann. Nach einer ersten Niederlage „sandte“ Hadadeser „hin und brachte heraus die Syrer jenseit des Stromes und führte herein ihre Macht; und Sobach, der Feldhauptmann Hadadesers, zog vor ihnen her“. Als David davon erfuhr, „sammelte er zuhauf das ganze Israel und zog über den Jordan und kam gen Helam“; die Aramäer flohen, Schobach wurde niedergestreckt und starb dort, und die Könige, die Hadadeser dienten, machten Frieden mit Israel. Der Parallelbericht der Chronik erzählt dieselbe Schlacht ohne Helam zu nennen. Die Synodalübersetzung liest nach dem Griechischen jenseits des Flusses Chalamak, sodass der Name dort zweimal steht."
    - "Die Stätte ist unbekannt. Weil David den Jordan überquerte, um sie zu erreichen, suchen die meisten östlich des Flusses, und die Karte folgt dem Vorschlag Alma im Hauran Südsyriens; andere denken an einen Ort zwischen Damaskus und Hamat, an Aleppo oder an Alamatha, eine Stadt, die Ptolemäus nahe dem Euphrat ansetzt. Keiner ist bestätigt, und Helam erscheint in keinem anderen antiken Text."
  fr:
    - "Hélam est le lieu où David battit les Araméens dans la guerre déclenchée par l’insulte des Ammonites à ses envoyés. Après une première défaite, Hadadézer « envoya chercher les Syriens qui étaient de l’autre côté du fleuve ; et ils arrivèrent à Hélam, ayant à leur tête Schobac », chef de l’armée d’Hadadézer. David, qui assembla « tout Israël, passa le Jourdain, et vint à Hélam » ; les Araméens s’enfuirent, Schobac fut frappé et mourut sur place, et les rois soumis à Hadadézer firent la paix avec Israël. Le récit parallèle des Chroniques raconte la même bataille sans nommer Hélam. La Bible synodale, suivant le grec, lit « au-delà du fleuve Halamak », de sorte que le nom y figure deux fois."
    - "Le site est inconnu. Comme David traversa le Jourdain pour l’atteindre, la plupart cherchent à l’est du fleuve, et la carte suit la proposition d’Alma dans le Havran du sud de la Syrie ; d’autres pensent à un lieu entre Damas et Hamath, à Alep, ou à Alamatha, une ville que Ptolémée place près de l’Euphrate. Aucun n’a été confirmé, et Hélam n’apparaît dans aucun autre texte antique."
