# Overview article (ADR 0007). Mainstream facts only; the meaning and place of Hamath-zobah are disputed and the candidates are given without choosing; the Kings parallel does not mention the campaign.
id: hamath-zobah
place: ab6a417
title:
  en: "Hamath-zobah"
  ru: "Емаф-Сува"
  uk: "Хамат-Цова"
  es: "Hamat-soba"
  pt: "Hamate-Zobá"
  de: "Hamat-Zoba"
  fr: "Hamath-Tsoba"
  pl: "Chamat-Soba"
  it: "Camat-Zoba"
  nl: "Hamat-Soba"
  cs: "Chamat-sóba"
  sv: "Hamat-Sova"
