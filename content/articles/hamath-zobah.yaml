body:
  en:
    - "Hamath-zobah appears once by that name: in Chronicles' account of Solomon's reign, “Solomon went to Hamath-zobah, and prevailed against it. And he built Tadmor in the wilderness, and all the store cities, which he built in Hamath.” It is Solomon's only recorded war, and the parallel account in Kings does not mention it. The name joins Hamath, the kingdom on the Orontes, with Zobah, the Aramean kingdom whose king Hadadezer David had defeated, which Chronicles describes as fought “unto Hamath”. The map links that verse to the place as well."
    - "What the compound means is uncertain. Some take it as Hamath itself, the city of Hama in Syria, perhaps described as once belonging to Zobah; others as a different Hamath inside the territory of Zobah, in or near the Beqaa valley of Lebanon, and Baalbek has been suggested. Some scholars doubt that Solomon fought there at all and read the verse as the Chronicler's way of extending his realm to the bounds of David's. No inscription or excavation names Hamath-zobah, and nothing more is known."
  ru:
    - "Емаф-Сува под этим именем встречается один раз — в рассказе Паралипоменон о царствовании Соломона: «И пошел Соломон на Емаф-Сува и взял его. И построил он Фадмор в пустыне, и все города для запасов, какие основал в Емафе». Это единственная война Соломона, о которой сказано в Библии, и параллельный рассказ книги Царств о ней молчит. Имя соединяет Емаф, царство на Оронте, и Суву, арамейское царство, царя которого Адраазара победил Давид; эту победу Паралипоменон помещает «в Емафе». Карта связывает с этим местом и тот стих."
    - "Что значит двойное имя, неясно. Одни понимают его как сам Емаф, город Хаму в Сирии, названный, быть может, по прежней принадлежности Суве; другие — как иной Емаф внутри владений Сувы, в долине Бекаа в Ливане или около неё, и предлагали даже Баальбек. Некоторые исследователи сомневаются, что Соломон вообще там воевал, и видят в стихе способ летописца распространить его царство до пределов державы Давида. Ни одна надпись и ни одни раскопки не называют Емаф-Сува, и больше ничего не известно."
  uk:
    - "Хамат-Цова з’являється одного разу під цією назвою: в оповіді Хронік про царювання Соломона, «І пійшов Соломон на Емат-Сува й взяв його. І збудував він Тадмор в пустинї, і всї міста про запаси, які позакладав в Ематї». Це єдина записана війна Соломона, а паралельний виклад у Книгах Царів її не згадує. Назва поєднує Хамат, царство на Оронті, із Сувою, арамейським царством, чийого царя Адраазара Давид розбив, і про яку Хроніки кажуть, що її побито «в Ематї». Карта пов’язує цей вірш також із цим місцем."
    - "Що означає ця складена назва, не певно. Дехто розуміє її як сам Хамат, місто Хама в Сирії, можливо, описане як таке, що колись належало Суві; інші — як інший Хамат у межах території Суви, у долині Бекаа в Лівані або поблизу неї, і пропонували Баальбек. Деякі дослідники сумніваються, що Соломон узагалі там воював, і читають вірш як спосіб літописця поширити його царство до меж Давидового. Жоден напис чи розкопки не називають Хамат-Цову, і більше нічого невідомо."
  es:
    - "Hamat-soba aparece una sola vez con ese nombre: en el relato de Crónicas sobre el reinado de Salomón, «Después vino Salomón á Amath de Soba, y la tomó. Y edificó á Tadmor en el desierto, y todas las ciudades de municiones que edificó en Hamath». Es la única guerra registrada de Salomón, y el relato paralelo de Reyes no la menciona. El nombre une Hamat, el reino del Orontes, con Soba, el reino arameo cuyo rey Hadad-ezer había derrotado David, reino que Crónicas describe combatido «en Hamath». El mapa vincula también ese versículo con el lugar."
    - "Qué significa el compuesto es incierto. Algunos lo toman por la propia Hamat, la ciudad de Hama en Siria, quizá descrita como perteneciente en otro tiempo a Soba; otros, por una Hamat distinta dentro del territorio de Soba, en el valle de la Becá, en el Líbano, y se ha sugerido Baalbek. Algunos estudiosos dudan de que Salomón combatiera allí y leen el versículo como la manera del Cronista de extender su reino hasta los límites del de David. Ninguna inscripción ni excavación nombra Hamat-soba, y no se sabe nada más."
  pt:
    - "Hamate-Zobá aparece uma vez com esse nome: no relato de Crônicas sobre o reinado de Salomão, “Salomão foi a Hamate-Zobá e prevaleceu contra ela. Ele edificou Tadmor no deserto, e todas as cidades-armazém, que ele edificou em Hamate”. É a única guerra registrada de Salomão, e o relato paralelo de Reis não a menciona. O nome junta Hamate, o reino no Orontes, com Zobá, o reino arameu cujo rei Hadadezer Davi derrotara, e que Crônicas descreve como combatido “na direção de Hamate”. O mapa liga esse versículo também ao lugar."
    - "O que o composto significa é incerto. Alguns o tomam como a própria Hamate, a cidade de Hama, na Síria, talvez descrita como tendo pertencido outrora a Zobá; outros, como uma Hamate diferente dentro do território de Zobá, no vale de Beca, no Líbano, ou perto dele, e Baalbek foi sugerida. Alguns estudiosos duvidam de que Salomão tenha lutado ali e leem o versículo como a maneira de o cronista estender o seu reino até os limites do de Davi. Nenhuma inscrição ou escavação nomeia Hamate-Zobá, e nada mais se sabe."
  de:
    - "Hamat-Zoba erscheint nur einmal unter diesem Namen: im Bericht der Chronik über Salomos Herrschaft, „Und Salomo zog gen Hamath-Zoba und ward desselben mächtig und baute Thadmor in der Wüste und alle Kornstädte, die er baute in Hamath“. Es ist Salomos einziger überlieferter Krieg, und der Parallelbericht der Königsbücher erwähnt ihn nicht. Der Name verbindet Hamat, das Königreich am Orontes, mit Zoba, dem aramäischen Königreich, dessen König Hadadeser David besiegt hatte, den die Chronik „den König zu Zoba und Hamath“ nennt. Die Karte verknüpft auch diesen Vers mit dem Ort."
    - "Was die Zusammensetzung bedeutet, ist ungewiss. Manche halten es für Hamat selbst, die Stadt Hama in Syrien, vielleicht als einst zu Zoba gehörig beschrieben; andere für ein anderes Hamat im Gebiet von Zoba, in oder nahe der Bekaa-Ebene im Libanon, und Baalbek ist vorgeschlagen worden. Manche Forscher bezweifeln, dass Salomo dort überhaupt kämpfte, und lesen den Vers als Weise des Chronisten, sein Reich bis an die Grenzen von Davids Reich auszudehnen. Keine Inschrift und keine Grabung nennt Hamat-Zoba, und mehr ist nicht bekannt."
  fr:
    - "Hamath-Tsoba apparaît une fois sous ce nom : dans le récit du règne de Salomon des Chroniques, « Salomon marcha contre Hamath, vers Tsoba, et s’en empara. Il bâtit Thadmor au désert, et toutes les villes servant de magasins en Hamath. » C’est la seule guerre connue de Salomon, et le récit parallèle des Rois ne la mentionne pas. Le nom joint Hamath, le royaume de l’Oronte, à Tsoba, le royaume araméen dont le roi Hadadézer fut battu par David, que les Chroniques décrivent comme combattu « vers Hamath ». La carte rattache aussi ce verset au lieu."
    - "Ce que signifie le composé est incertain. Certains y voient Hamath même, la ville de Hama en Syrie, peut-être décrite comme ayant appartenu un jour à Tsoba ; d’autres une autre Hamath dans le territoire de Tsoba, dans la vallée de la Bekaa au Liban ou près d’elle, et Baalbek a été suggérée. Certains spécialistes doutent que Salomon ait combattu là et lisent le verset comme la manière du Chroniqueur d’étendre son royaume jusqu’aux bornes de celui de David. Aucune inscription ni fouille ne nomme Hamath-Tsoba, et l’on n’en sait pas davantage."
  pl:
    - "Chamat-Soba pojawia się raz pod tą nazwą: w opisie panowania Salomona w Księgach Kronik, „Potem ciągnął Salomon do Emat Soby, i wziął ją. Pobudował też Tadmor na puszczy, i wszystkie miasta, w których miał składy, pobudował w Emat”. To jedyna odnotowana wojna Salomona, a odpowiednik w Księgach Królewskich o niej nie wspomina. Nazwa łączy Chamat, królestwo nad Orontesem, z Sobą, aramejskim królestwem, którego króla Hadadezera pokonał Dawid, co Kroniki opisują słowami: „Poraził też Dawid Hadarezera, króla Soby w Emat”. Mapa wiąże ten werset również z tym miejscem."
    - "Co oznacza ta złożona nazwa, nie jest pewne. Jedni biorą ją za samo Chamat, miasto Hama w Syrii, może opisane jako dawniej należące do Soby; inni za inne Chamat w obrębie ziemi Soby, w dolinie Bekaa w Libanie lub jej pobliżu, a sugerowano Baalbek. Niektórzy uczeni wątpią, by Salomon w ogóle tam walczył, i czytają werset jako sposób Kronikarza na rozciągnięcie jego państwa do granic państwa Dawida. Żaden napis ani wykopalisko nie wymienia Chamat-Soba i nic więcej nie wiadomo."
  it:
    - "Camat-Zoba compare una sola volta con questo nome: nel racconto del regno di Salomone nelle Cronache, «Salomone marciò contro Hamath-Tsoba e se ne impadronì. E ricostruì Tadmor nella parte deserta del paese, e tutte le città di rifornimento in Hamath». È l’unica guerra registrata di Salomone, e il racconto parallelo dei Re non la menziona. Il nome unisce Camat, il regno sull’Oronte, con Zoba, il regno aramaico il cui re Adadezer Davide aveva sconfitto, e che le Cronache descrivono come battuto «verso Hamath». La mappa collega al luogo anche quel versetto."
    - "Che cosa significhi il composto è incerto. Alcuni lo intendono come la stessa Camat, la città di Hama in Siria, forse descritta come già appartenuta a Zoba; altri come una diversa Camat nel territorio di Zoba, nella valle della Beqa in Libano, e si è suggerita Baalbek. Alcuni studiosi dubitano che Salomone abbia combattuto lì e leggono il versetto come il modo del Cronista di estendere il suo regno ai confini di quello di Davide. Nessuna iscrizione o scavo nomina Camat-Zoba, e nulla di più si sa."
  nl:
    - "Hamat-Soba komt eenmaal onder die naam voor: in het verslag van Kronieken over Salomo’s regering, “Daarna toog Salomo naar Hamath-Zoba, en hij overweldigde het. Hij bouwde ook Thadmor in de woestijn, en al de schatsteden, die hij bouwde in Hamath.” Het is Salomo’s enige overgeleverde oorlog, en de parallelle tekst in Koningen vermeldt hem niet. De naam verbindt Hamat, het koninkrijk aan de Orontes, met Soba, het Aramese koninkrijk waarvan de koning Hadadezer door David was verslagen, wat Kronieken beschrijft als gevochten “naar Hamath toe”. De kaart verbindt ook dat vers met de plaats."
    - "Wat de samenstelling betekent, is onzeker. Sommigen houden haar voor Hamat zelf, de stad Hama in Syrië, misschien beschreven als eens tot Soba behorend; anderen voor een ander Hamat binnen het gebied van Soba, in of bij de Bekaavallei in Libanon, en Baalbek is voorgesteld. Sommige geleerden betwijfelen dat Salomo daar ooit streed en lezen het vers als de manier van de kroniekschrijver om zijn rijk uit te breiden tot de grenzen van Davids rijk. Geen opschrift of opgraving noemt Hamat-Soba, en verder is niets bekend."
  cs:
    - "Chamat-sóba se pod tímto jménem objevuje jednou: ve vyprávění Letopisů o Šalomounově vládě, „Zatím táhl Šalomoun do Emat Soby, a zmocnil se jí. I ustavěl Tadmor na poušti, a všecka města skladů vystavěl v Emat.“ Je to Šalomounova jediná zaznamenaná válka a paralelní vyprávění v Královských ji nezmiňuje. Jméno spojuje Chamat, království na Orontu, se Sóbou, aramejským královstvím, jehož krále Hadadezera David porazil a které Letopisy líčí jako poražené „v Emat“. Mapa spojuje s místem i tento verš."
    - "Co složenina znamená, je nejisté. Někteří ji pokládají za samotný Chamat, syrské město Hamá, snad popsané jako kdysi patřící k Sóbě; jiní za jiný Chamat na území Sóby, v údolí Bikáa v Libanonu nebo poblíž něj, a navrhován byl Baalbek. Někteří učenci pochybují, že tam Šalomoun vůbec bojoval, a čtou verš jako kronikářův způsob, jak rozšířit jeho říši k hranicím Davidovým. Žádný nápis ani vykopávky Chamat-sóbu nejmenují a nic dalšího není známo."
  sv:
    - "Hamat-Sova förekommer en gång under det namnet: i Krönikebokens berättelse om Salomos regering, ”Och Salomo drog till Hamat-Soba och bemäktigade sig det. Och han byggde upp Tadmor i öknen och alla de förrådsstäder som i Hamat äro byggda av honom.” Det är Salomos enda omtalade krig, och parallellberättelsen i Kungaboken nämner det inte. Namnet förenar Hamat, kungariket vid Orontes, med Sova, det arameiska kungariket vars kung Hadadeser David hade besegrat, i en strid som Krönikeboken beskriver som utkämpad ”vid Hamat”. Kartan kopplar även den versen till platsen."
    - "Vad sammansättningen betyder är osäkert. Några tar den för Hamat självt, staden Hama i Syrien, kanske beskriven som en gång tillhörande Sova; andra för ett annat Hamat inom Sovas område, i eller nära Bekaadalen i Libanon, och Baalbek har föreslagits. Vissa forskare betvivlar att Salomo över huvud taget stred där och läser versen som krönikeskrivarens sätt att utsträcka hans rike till Davids gränser. Ingen inskrift eller utgrävning nämner Hamat-Sova, och mer är inte känt."
  nb:
    - "Hamat-Soba forekommer én gang med det navnet: i Krønikebøkenes beretning om Salomos regjeringstid: «Derefter drog Salomo til Hamat-Soba og la det under sig. Han bygget også op Tadmor i ørkenen og alle de oplagsbyer han har bygget i Hamat.» Det er Salomos eneste overleverte krig, og parallellberetningen i Kongebøkene nevner den ikke. Navnet forener Hamat, kongedømmet ved Orontes, med Soba, det arameiske kongedømmet hvis konge Hadadeser David hadde beseiret, et slag Krønikebøkene plasserer «ved Hamat». Kartet knytter også dette verset til stedet."
    - "Hva sammensetningen betyr, er usikkert. Noen tar det som Hamat selv, byen Hama i Syria, kanskje beskrevet som en gang tilhørende Soba; andre som en annen Hamat innenfor Sobas område, i eller nær Bekaa-dalen i Libanon, og Baalbek er blitt foreslått. Noen forskere tviler på at Salomo kjempet der i det hele tatt og leser verset som kronikerens måte å utvide hans rike til Davids grenser. Ingen innskrift eller utgravning nevner Hamat-Soba, og ingenting mer er kjent."
  tl:
    - "Isang beses lamang lumilitaw ang Hamath-soba sa ilalim ng pangalang iyon: sa salaysay ng Mga Cronica tungkol sa paghahari ni Salomon, “si Salomon ay naparoon sa Hamath-soba, at nanaig laban doon. At kaniyang itinayo ang Tadmor sa ilang, at lahat na bayan na imbakan na kaniyang itinayo sa Hamath.” Ito ang tanging naitalang digmaan ni Salomon, at hindi ito binabanggit ng kahambing na salaysay sa Mga Hari. Pinag-uugnay ng pangalan ang Hamath, ang kaharian sa Orontes, at ang Soba, ang kahariang Arameo na ang haring si Hadadezer ay tinalo ni David, na inilalarawan ng Mga Cronica na nilabanan “sa Hamath”. Iniuugnay din ng mapa ang talatang iyon sa lugar."
    - "Hindi tiyak ang kahulugan ng tambalang pangalan. Itinuturing ito ng ilan na ang Hamath mismo, ang lungsod ng Hama sa Siria, na marahil ay inilarawan bilang dating bahagi ng Soba; ng iba, bilang ibang Hamath sa loob ng teritoryo ng Soba, sa o malapit sa libis ng Beqaa sa Libano, at iminungkahi ang Baalbek. Pinagdududahan ng ilang iskolar na lumaban doon si Salomon at binabasa ang talata bilang paraan ng may-akda ng Mga Cronica na palawakin ang kaniyang kaharian hanggang sa mga hangganan ng kay David. Walang inskripsiyon o paghuhukay na pumapangalan sa Hamath-soba, at wala nang higit na nalalaman."
  da:
    - "Hamat-Soba optræder én gang under dette navn: i Krønikebøgernes beretning om Salomos regering, »drog Salomo til Hamath-Zoba og fik Overhaand over den. Han byggede og Thadmor i Ørken og alle de Forraadsstæder, som han byggede i Hamath«. Det er Salomos eneste optegnede krig, og parallelberetningen i Kongebøgerne nævner den ikke. Navnet forbinder Hamat, kongeriget ved Orontes, med Soba, det aramæiske kongerige, hvis konge Hadadezer David havde besejret, og som Krønikebøgerne beskriver som bekæmpet »ved Hamat«. Kortet knytter også det vers til stedet."
    - "Hvad sammensætningen betyder, er usikkert. Nogle tager den for Hamat selv, byen Hama i Syrien, måske beskrevet som engang tilhørende Soba; andre for en anden Hamat inden for Sobas område, i eller nær Beqaa-dalen i Libanon, og Baalbek er blevet foreslået. Nogle forskere tvivler på, at Salomo overhovedet kæmpede dér, og læser verset som Krønikeskriverens måde at udvide hans rige til Davids grænser. Ingen indskrift eller udgravning nævner Hamat-Soba, og mere vides ikke."
scripture:
  - 1Kgs.9.17-1Kgs.9.19
  - 1Chr.18.3
  - 2Chr.8.3-2Chr.8.4
