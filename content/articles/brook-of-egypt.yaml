body:
  en:
    - "The Brook of Egypt (Hebrew nahal Mitsrayim) was the south-western border of the promised land, the wadi where Canaan ended and the desert road to Egypt began; its counterpart in the north was Lebo-hamath. It is distinct from “the river of Egypt” of the covenant with Abram, where a different word is used and the Nile is probably meant. Most identify it with Wadi el-Arish, the great dry river of northern Sinai that gathers the rains of the peninsula and reaches the Mediterranean at el-Arish, some 75 km south-west of Gaza. Nadav Na'aman argued that the Assyrian “Brook of Egypt” was rather Nahal Besor, the wadi south of Gaza, and a few have placed it at the Shihor, the easternmost branch of the Nile."
    - "Numbers draws the southern border from Kadesh-barnea past Azmon “unto the river of Egypt, and the goings out of it shall be at the sea”, and Joshua repeats the line for Judah, whose Philistine coast reaches “unto the river of Egypt, and the great sea”. Solomon's assembly came “from the entering in of Hamath unto the river of Egypt”. After Carchemish, Kings notes, “the king of Babylon had taken from the river of Egypt unto the river Euphrates all that pertained to the king of Egypt”. Isaiah foresees Israel gathered “from the channel of the river unto the stream of Egypt”, and Ezekiel's new land runs in the south “from Tamar even to the waters of strife in Kadesh, the river to the great sea”."
    - "The Assyrians knew the same frontier. Tiglath-pileser III set up his royal stele at the Brook of Egypt in 734 BC; Sargon II settled deportees on the border of “the city of the Brook of Egypt” and opened the sealed trading post (kāru) of Egypt to trade. The Greeks called the town at the wadi's mouth Rhinocolura; Diodorus tells that Actisanes, an Ethiopian king who had conquered Egypt, settled convicts with their noses cut off there, whence the name. Today el-Arish is the capital of Egypt's North Sinai governorate, and Wadi el-Arish still floods after the rare winter rains."
  ru:
    - "Поток Египетский (евр. нахал Мицраим) — юго-западная граница обетованной земли, вади, где кончался Ханаан и начиналась пустынная дорога в Египет; на севере ему отвечал вход в Емаф. Его следует отличать от «реки Египетской» из завета с Аврамом: там стоит другое слово и, вероятно, имеется в виду Нил. Большинство отождествляют поток с Вади-эль-Ариш, большой сухой рекой северного Синая, которая собирает дожди полуострова и выходит к Средиземному морю у Эль-Ариша, примерно в 75 км к юго-западу от Газы. Надав Нааман доказывал, что ассирийский «Поток Египетский» — скорее Нахаль-Бесор, вади к югу от Газы, а иные помещали его на Сихор, самый восточный рукав Нила."
    - "Книга Чисел ведёт южную границу от Кадес-Варни через Ацмон «к потоку Египетскому, и будут выступы ее к морю», а книга Иисуса Навина повторяет ту же линию для Иуды, чей филистимский берег доходит «до самого потока Египетского и великого моря». Собрание Соломона сошлось «от входа в Емаф до реки Египетской». После Кархемиса, замечает книга Царств, царь Вавилонский взял всё, «от потока Египетского до реки Евфрата, что принадлежало царю Египетскому». Исаия предвидит, что Израиль будет собран «от великой реки до потока Египетского», а у Иезекииля южный край новой земли идёт «от Тамары до вод пререкания при Кадисе, и по течению потока до великого моря»."
    - "Ассирийцы знали ту же границу. Феглаффелласар III поставил свою царскую стелу у Потока Египетского в 734 г. до н. э.; Саргон II поселил переселенцев на границе «города Потока Египетского» и открыл для торговли запечатанную пристань (кару) Египта. Греки называли город в устье вади Ринокорура; Диодор рассказывает, что Актисан, эфиопский царь, завоевавший Египет, поселил там преступников с отрезанными носами, откуда и имя. Сегодня Эль-Ариш — столица египетской провинции Северный Синай, а Вади-эль-Ариш по-прежнему наполняется после редких зимних дождей."
  uk:
    - "Потік Єгипетський (єврейською нахаль Міцраїм) був південно-західною межею обітованої землі, ваді, де закінчувався Ханаан і починалася пустельна дорога до Єгипту; його відповідником на півночі був Вхід у Хамат. Його слід відрізняти від «ріки Египецької» із заповіту з Аврамом, де вжито інше слово і, ймовірно, мається на увазі Ніл. Більшість ототожнює його з ваді ель-Аріш, великою сухою рікою північного Синаю, що збирає дощі півострова й досягає Середземного моря в ель-Арішу, приблизно за 75 км на південний захід від Гази. Надав Нааман доводив, що ассирійський «Потік Єгипетський» був радше Нахал-Бесором, ваді на південь від Гази, а деякі розміщували його на Сихорі, найсхіднішому рукаві Нілу."
    - "Книга Чисел проводить південну межу від Кадеса-Барни повз Ацмон «до бурчака Египецького, і будуть кіньцї її проти моря», а Ісус Навин повторює цю лінію для Юди, чиє філістимське узбережжя сягає «до річки Египецької … велике море». Збір Соломона прийшов «від гряницї Емату до ріки Египецької». Після Каркемиша, зазначає Книга Царів, «царь Вавилонський забрав усе від Египецького потока та й до Евфрат-ріки, що було царя Египецького». Ісая бачить Ізраїля зібраним «від великої ріки аж по потік Египецький», а нова земля Єзекіїля тягнеться на півдні «від Тамару до вод переріку коло Кадесу, й попри потік до великого моря»."
    - "Ассирійці знали той самий кордон. Тіглатпаласар III поставив свою царську стелу на Потоці Єгипетському в 734 р. до н. е.; Саргон II поселив переселенців на межі «міста Потоку Єгипетського» і відкрив для торгівлі запечатаний торговий пункт (кару) Єгипту. Греки називали місто в гирлі ваді Рінокорура; Діодор розповідає, що Актісан, ефіопський цар, який підкорив Єгипет, поселив там злочинців із відрізаними носами, звідки й назва. Сьогодні ель-Аріш — столиця єгипетської мухафази Північний Синай, а ваді ель-Аріш і досі розливається після рідкісних зимових дощів."
  es:
    - "El Torrente de Egipto (en hebreo nahal Mitsrayim) era la frontera suroccidental de la tierra prometida, el uadi donde terminaba Canaán y comenzaba el camino del desierto hacia Egipto; su correspondiente en el norte era la Entrada de Hamat. Se distingue del «río de Egipto» del pacto con Abram, donde se usa una palabra distinta y probablemente se alude al Nilo. La mayoría lo identifica con el Uadi el-Arish, el gran río seco del norte del Sinaí que recoge las lluvias de la península y desemboca en el Mediterráneo en el-Arish, a unos 75 km al suroeste de Gaza. Nadav Na'aman sostuvo que el «Torrente de Egipto» asirio era más bien el Nahal Besor, el uadi al sur de Gaza, y unos pocos lo han situado en el Sihor, el brazo más oriental del Nilo."
    - "Números traza la frontera sur desde Cades-barnea, pasando por Asmón, «hasta el torrente de Egipto, y sus remates serán al occidente», y Josué repite la línea para Judá, cuya costa filistea llega «hasta el río de Egipto, y la gran mar». La asamblea de Salomón vino «desde como entran en Hamath hasta el río de Egipto». Tras Carquemis, anota Reyes, «el rey de Babilonia le tomó todo lo que era suyo, desde el río de Egipto hasta el río de Eufrates». Isaías prevé a Israel reunido «desde el álveo del río hasta el torrente de Egipto», y la nueva tierra de Ezequiel corre por el sur «desde Tamar hasta las aguas de las rencillas; desde Cades y el arroyo hasta la gran mar»."
    - "Los asirios conocían la misma frontera. Tiglat-pileser III erigió su estela real en el Torrente de Egipto en el 734 a. C.; Sargón II asentó deportados en la frontera de «la ciudad del Torrente de Egipto» y abrió al comercio el puesto comercial sellado (kāru) de Egipto. Los griegos llamaron Rinocolura a la ciudad de la desembocadura del uadi; Diodoro cuenta que Actisanes, un rey etíope que había conquistado Egipto, asentó allí a condenados con la nariz cortada, de donde viene el nombre. Hoy el-Arish es la capital de la gobernación egipcia del Norte del Sinaí, y el Uadi el-Arish todavía se desborda tras las raras lluvias invernales."
  pt:
    - "O Ribeiro do Egito (em hebraico nahal Mitsrayim) era a fronteira sudoeste da terra prometida, o uádi onde terminava Canaã e começava a estrada do deserto para o Egito; seu equivalente ao norte era Lebo-Hamate. Distingue-se do “rio do Egito” da aliança com Abrão, onde se usa outra palavra e provavelmente se tem em vista o Nilo. A maioria o identifica com o uádi el-Arish, o grande rio seco do norte do Sinai, que recolhe as chuvas da península e chega ao Mediterrâneo em el-Arish, uns 75 km a sudoeste de Gaza. Nadav Na'aman sustentou que o “Ribeiro do Egito” assírio era antes o Nahal Besor, o uádi ao sul de Gaza, e alguns o situaram no Sior, o braço mais oriental do Nilo."
    - "Números traça a fronteira sul de Cades-Barneia, passando por Azmom, “até o ribeiro do Egito, e terminará no mar”, e Josué repete o traçado para Judá, cuja costa filisteia chega “até o ribeiro do Egito e o mar Grande”. A assembleia de Salomão veio “desde a entrada de Hamate até o ribeiro do Egito”. Depois de Carquemis, observa o livro dos Reis, “o rei da Babilônia havia tomado, desde o ribeiro do Egito até o rio Eufrates, tudo o que pertencia ao rei do Egito”. Isaías prevê Israel reunido “desde a correnteza do Eufrates até o ribeiro do Egito”, e a nova terra de Ezequiel vai, ao sul, “desde Tamar até as águas de Meribá-Cades, até o ribeiro, até o Mar Grande”."
    - "Os assírios conheciam a mesma fronteira. Tiglate-Pileser III ergueu sua estela real no Ribeiro do Egito em 734 a.C.; Sargão II instalou deportados na fronteira da “cidade do Ribeiro do Egito” e abriu ao comércio o entreposto selado (kāru) do Egito. Os gregos chamavam Rinocolura a cidade na foz do uádi; Diodoro conta que Actisanes, rei etíope que havia conquistado o Egito, estabeleceu ali condenados de nariz cortado, donde o nome. Hoje el-Arish é a capital da província egípcia do Norte do Sinai, e o uádi el-Arish ainda inunda depois das raras chuvas de inverno."
  de:
    - "Der Bach Ägyptens (hebräisch nahal Mizrajim) war die südwestliche Grenze des verheißenen Landes, das Wadi, wo Kanaan endete und die Wüstenstraße nach Ägypten begann; sein Gegenstück im Norden war Lebo-Hamat. Er ist zu unterscheiden vom „Wasser Ägyptens“ im Bund mit Abram, wo ein anderes Wort steht und wahrscheinlich der Nil gemeint ist. Die meisten setzen ihn mit dem Wadi el-Arisch gleich, dem großen trockenen Fluss des nördlichen Sinai, der die Regen der Halbinsel sammelt und bei el-Arisch, etwa 75 km südwestlich von Gaza, das Mittelmeer erreicht. Nadav Na’aman vertrat die Ansicht, der assyrische „Bach Ägyptens“ sei vielmehr der Nahal Besor, das Wadi südlich von Gaza, und einige haben ihn am Schihor angesetzt, dem östlichsten Arm des Nils."
    - "Das Buch Numeri zieht die Südgrenze von Kadesch-Barnea an Azmon vorbei: „und lenke sich von Azmon an den Bach Ägyptens, und ihr Ende sei an dem Meer“, und Josua wiederholt die Linie für Juda, dessen philistäische Küste reicht „bis an das Wasser Ägyptens; und das große Meer ist seine Grenze“. Salomos Versammlung kam „von der Grenze Hamaths an bis an den Bach Ägyptens“. Nach Karkemisch, vermerkt das Buch der Könige: „… der König zu Babel hatte ihm genommen alles, was dem König zu Ägypten gehörte vom Bach Ägyptens an bis an das Wasser Euphrat“. Jesaja sieht Israel versammelt „von dem Ufer des Stromes bis an den Bach Ägyptens“, und Hesekiels neues Land verläuft im Süden „von Thamar bis ans Haderwasser zu Kades und den Bach hinab bis an das große Meer“."
    - "Die Assyrer kannten dieselbe Grenze. Tiglat-Pileser III. errichtete 734 v. Chr. seine königliche Stele am Bach Ägyptens; Sargon II. siedelte Deportierte an der Grenze „der Stadt am Bach Ägyptens“ an und öffnete den versiegelten Handelsplatz (kāru) Ägyptens für den Handel. Die Griechen nannten die Stadt an der Mündung des Wadis Rhinokolura; Diodor erzählt, Aktisanes, ein äthiopischer König, der Ägypten erobert hatte, habe dort Verurteilte mit abgeschnittenen Nasen angesiedelt, daher der Name. Heute ist el-Arisch die Hauptstadt des ägyptischen Gouvernements Nordsinai, und das Wadi el-Arisch führt nach den seltenen Winterregen noch immer Hochwasser."
  fr:
    - "Le Torrent d’Égypte (en hébreu nahal Mitsrayim) formait la frontière sud-ouest de la terre promise, l’oued où s’arrêtait Canaan et où commençait la route du désert vers l’Égypte ; son pendant au nord était l’Entrée de Hamath. Il se distingue du « fleuve d’Égypte » de l’alliance avec Abram, où un autre mot est employé et où l’on entend probablement le Nil. La plupart l’identifient au Wadi el-Arish, le grand cours d’eau à sec du nord du Sinaï, qui recueille les pluies de la péninsule et atteint la Méditerranée à el-Arish, à quelque 75 km au sud-ouest de Gaza. Nadav Na’aman a soutenu que le « Torrent d’Égypte » assyrien était plutôt le Nahal Besor, l’oued au sud de Gaza, et quelques-uns l’ont placé au Schichor, la branche la plus orientale du Nil."
    - "Les Nombres tracent la frontière sud de Kadès-Barnéa en passant par Atsmon « jusqu’au torrent d’Égypte, pour aboutir à la mer », et Josué reprend le tracé pour Juda, dont la côte philistine va « jusqu’au torrent d’Égypte, et à la grande mer ». L’assemblée de Salomon vint « depuis les environs de Hamath jusqu’au torrent d’Égypte ». Après Carkemisch, notent les Rois, « le roi de Babylone avait pris tout ce qui était au roi d’Égypte depuis le torrent d’Égypte jusqu’au fleuve de l’Euphrate ». Ésaïe voit Israël rassemblé « depuis le cours du fleuve jusqu’au torrent d’Égypte », et le nouveau pays d’Ézéchiel court au sud « depuis Thamar jusqu’aux eaux de Meriba à Kadès, jusqu’au torrent vers la grande mer »."
    - "Les Assyriens connaissaient la même frontière. Tiglath-Piléser III érigea sa stèle royale au Torrent d’Égypte en 734 av. J.-C. ; Sargon II établit des déportés à la frontière de « la ville du Torrent d’Égypte » et ouvrit au commerce le comptoir scellé (kāru) d’Égypte. Les Grecs appelaient Rhinocolura la ville de l’embouchure de l’oued ; Diodore raconte qu’Actisanès, roi éthiopien qui avait conquis l’Égypte, y établit des condamnés au nez coupé, d’où le nom. Aujourd’hui, el-Arish est le chef-lieu du gouvernorat du Nord-Sinaï, en Égypte, et le Wadi el-Arish déborde encore après les rares pluies d’hiver."
  it:
    - "Il Torrente d’Egitto (in ebraico nahal Mitsrayim) era il confine sud-occidentale della terra promessa, il uadi dove finiva Canaan e cominciava la strada del deserto verso l’Egitto; il suo corrispettivo a nord era Entrata di Camat. Va distinto dal «fiume d’Egitto» dell’alleanza con Abramo, dove si usa una parola diversa e si intende probabilmente il Nilo. I più lo identificano con il Wadi el-Arish, il grande fiume asciutto del Sinai settentrionale che raccoglie le piogge della penisola e sfocia nel Mediterraneo a el-Arish, a circa 75 km a sud-ovest di Gaza. Nadav Na’aman ha sostenuto che il «Torrente d’Egitto» assiro fosse piuttosto il Nahal Besor, il uadi a sud di Gaza, e pochi lo hanno posto presso il Sicor, il ramo più orientale del Nilo."
    - "Numeri traccia il confine meridionale da Kades-Barnea oltre Asmon «fino al torrente d’Egitto, e finirà al mare», e Giosuè ripete la linea per Giuda, la cui costa filistea arriva «fino al torrente d’Egitto e al mar grande». L’assemblea di Salomone venne «dai dintorni di Hamath fino al torrente d’Egitto». Dopo Carchemis, nota il libro dei Re, «il re di Babilonia avea preso tutto quello che era stato del re d’Egitto, dal torrente d’Egitto al fiume Eufrate». Isaia prevede Israele raccolto «dal corso del fiume al torrente d’Egitto», e il nuovo paese di Ezechiele corre a sud «da Tamar fino alle acque di Meriboth di Kades, fino al torrente che va nel mar Grande»."
    - "Gli Assiri conoscevano la stessa frontiera. Tiglat-Pilèser III eresse la sua stele reale al Torrente d’Egitto nel 734 a.C.; Sargon II insediò deportati al confine della «città del Torrente d’Egitto» e aprì al commercio l’emporio sigillato (kāru) dell’Egitto. I Greci chiamavano Rinocorura la città alla foce del uadi; Diodoro racconta che Attisane, un re etiope che aveva conquistato l’Egitto, vi stabilì dei condannati col naso mozzato, da cui il nome. Oggi el-Arish è il capoluogo del governatorato egiziano del Nord Sinai, e il Wadi el-Arish continua a straripare dopo le rare piogge invernali."
  pl:
    - "Potok Egipski (hebr. nachal Micrajim) był południowo-zachodnią granicą ziemi obiecanej, wadi, gdzie kończył się Kanaan, a zaczynała pustynna droga do Egiptu; jego odpowiednikiem na północy było Lebo-Chamat. Różni się od „rzeki Egipskiej” z przymierza z Abramem, gdzie użyto innego słowa i prawdopodobnie ma się na myśli Nil. Większość utożsamia go z Wadi el-Arisz, wielką suchą rzeką północnego Synaju, która zbiera deszcze półwyspu i uchodzi do Morza Śródziemnego w el-Arisz, około 75 km na południowy zachód od Gazy. Nadav Na'aman dowodził, że asyryjski „Potok Egipski” był raczej Potokiem Besor, wadi na południe od Gazy, a nieliczni umieszczali go na Szichor, najbardziej wschodniej odnodze Nilu."
    - "Księga Liczb prowadzi granicę południową od Kadesz-Barnea obok Asmon „aż do rzeki Egipskiej, a skończy się na zachód”, a Jozue powtarza tę linię dla Judy, której wybrzeże filistyńskie sięga „aż do potoku Egipskiego, i morze wielkie za granicą jego”. Zgromadzenie Salomona przybyło „od wejścia do Emat aż do rzeki Egipskiej”. Po Karkemisz Księga Królewska zapisuje: „wziął król Babiloński wszystko od rzeki Egipskiej aż do rzeki Eufrates, co przynależało królowi Egipskiemu”. Izajasz widzi Izraela zebranego „od łożyska rzeki aż do potoku Egipskiego”, a nowa ziemia Ezechiela biegnie na południu „od Tamar aż do wód poswarków w Kades, od potoku aż do morza wielkiego”."
    - "Asyryjczycy znali tę samą granicę. Tiglat-Pileser III postawił swoją królewską stelę nad Potokiem Egipskim w 734 r. p.n.e.; Sargon II osiedlił deportowanych na pograniczu „miasta Potoku Egipskiego” i otworzył dla handlu zapieczętowaną faktorię handlową (kāru) Egiptu. Grecy nazywali miasto u ujścia wadi Rinokolura; Diodor opowiada, że Aktisanes, król etiopski, który podbił Egipt, osiedlił tam skazańców z obciętymi nosami, stąd nazwa. Dziś el-Arisz jest stolicą egipskiej muhafazy Synaj Północny, a Wadi el-Arisz nadal wylewa po rzadkich zimowych deszczach."
  nl:
    - "De Beek van Egypte (Hebreeuws nachal Mitsrajim) was de zuidwestelijke grens van het beloofde land, de wadi waar Kanaän eindigde en de woestijnweg naar Egypte begon; het tegenstuk in het noorden was Lebo-Hamat. Zij is te onderscheiden van “de rivier van Egypte” uit het verbond met Abram, waar een ander woord wordt gebruikt en waarschijnlijk de Nijl bedoeld is. De meesten identificeren haar met de Wadi el-Arish, de grote droge rivier van het noorden van de Sinaï die het regenwater van het schiereiland verzamelt en bij el-Arish, zo'n 75 km ten zuidwesten van Gaza, de Middellandse Zee bereikt. Nadav Na'aman betoogde dat de Assyrische “Beek van Egypte” eerder de Nachal Besor was, de wadi ten zuiden van Gaza, en enkelen hebben haar bij de Sichor geplaatst, de oostelijkste tak van de Nijl."
    - "Numeri trekt de zuidgrens van Kades-Barnea langs Azmon “naar de rivier van Egypte, en haar uitgangen zullen zijn naar de zee”, en Jozua herhaalt de lijn voor Juda, wiens Filistijnse kust reikt “tot aan de rivier van Egypte; en de grote zee”. Salomo's samenkomst kwam “van den ingang af van Hamath tot de rivier van Egypte”. Na Karkemis, merkt Koningen op, “want de koning van Babel had, van de rivier van Egypte af tot aan de rivier Frath, ingenomen al wat van den koning van Egypte was”. Jesaja ziet Israël verzameld “van den stroom der rivier af tot aan de rivier van Egypte”, en Ezechiëls nieuwe land loopt in het zuiden “van Thamar af, tot aan het twistwater van Kades, voorts naar de beek henen, tot aan de grote zee”."
    - "De Assyriërs kenden dezelfde grens. Tiglat-Pileser III richtte in 734 v.Chr. zijn koninklijke stèle op bij de Beek van Egypte; Sargon II vestigde ontheemden op de grens van “de stad van de Beek van Egypte” en opende de verzegelde handelspost (kāru) van Egypte voor de handel. De Grieken noemden de stad aan de monding van de wadi Rhinocolura; Diodorus vertelt dat Actisanes, een Ethiopische koning die Egypte had veroverd, daar misdadigers met afgesneden neuzen vestigde, vandaar de naam. Tegenwoordig is el-Arish de hoofdstad van het Egyptische gouvernement Noord-Sinaï, en de Wadi el-Arish overstroomt nog steeds na de zeldzame winterregens."
  cs:
    - "Egyptský potok (hebrejsky nachal Micrajim) byl jihozápadní hranicí zaslíbené země, vádí, kde končil Kanaán a začínala pouštní cesta do Egypta; jeho protějškem na severu bylo Lebo-chamat. Je odlišný od „řeky Egyptské“ ze smlouvy s Abramem, kde je užito jiného slova a míněn je pravděpodobně Nil. Většina jej ztotožňuje s Wadi el-Arish, velkou vyschlou řekou severního Sinaje, která sbírá deště celého poloostrova a dosahuje Středozemního moře v el-Arish, asi 75 km jihozápadně od Gazy. Nadav Na'aman tvrdil, že asyrským „Egyptským potokem“ byl spíše Nachal Besor, vádí jižně od Gazy, a někteří jej kladli k Šichoru, nejvýchodnějšímu rameni Nilu."
    - "Numeri vedou jižní hranici od Kádeš-barnea kolem Acmonu „až ku potoku Egyptskému, a tu se skonávati bude k západu“ a Jozue totéž vymezení opakuje pro Judu, jejíž pelištejské pobřeží sahá „až ku potoku Egyptskému, i moře veliké s pomezím svým“. Šalomounovo shromáždění přišlo, „kudyž se chodí do Emat, až ku potoku Egyptskému“. Po Karkemíši poznamenává Druhá kniha Královská, že „král Babylonský pobral od řeky Egyptské až k řece Eufraten všecko, cožkoli měl král Egyptský“. Izajáš předvídá Izrael sebraný „od toku řeky až do potoka Egyptského“ a Ezechielova nová země sahá na jihu „od Támar až k vodám sváru v Kádes, od potoka až k moři velikému“."
    - "Asyřané znali tutéž hranici. Tiglatpilesar III. postavil roku 734 př. n. l. u Egyptského potoka svou královskou stélu; Sargon II. usadil vyhnance na hranici „města Egyptského potoka“ a otevřel obchodu zapečetěnou obchodní stanici (kāru) Egypta. Řekové nazývali město při ústí vádí Rhinokolura; Diodóros vypráví, že Aktisanés, etiopský král, který dobyl Egypt, tam usadil trestance s uříznutými nosy, odkud jméno. Dnes je el-Arish hlavním městem egyptského guvernorátu Severní Sinaj a Wadi el-Arish se po vzácných zimních deštích dosud rozvodňuje."
  sv:
    - "Egyptens bäck (hebreiska nahal Mitsrayim) var det utlovade landets sydvästra gräns, wadin där Kanaan slutade och ökenvägen till Egypten tog sin början; dess motsvarighet i norr var Lebo-Hamat. Den skiljer sig från ”Egyptens flod” i förbundet med Abram, där ett annat ord används och Nilen sannolikt avses. De flesta identifierar den med Wadi el-Arish, Norra Sinais stora torra flod, som samlar halvöns regn och når Medelhavet vid el-Arish, omkring 75 km sydväst om Gaza. Nadav Na’aman har hävdat att den assyriska ”Egyptens bäck” snarare var Nahal Besor, wadin söder om Gaza, och några har placerat den vid Shihor, Nilens östligaste gren."
    - "Fjärde Mosebok drar södra gränsen från Kadesh-Barnea förbi Asmon ”mot Egyptens bäck och gå ut vid havet”, och Josua upprepar linjen för Juda, vars filisteiska kust når ”ända till Egyptens bäck och fram till Stora havet”. Salomos församling kom ”allt ifrån det ställe där vägen går till Hamat ända till Egyptens bäck”. Efter Karkemish noterar Konungaboken att ”konungen i Babel hade intagit allt som tillhörde konungen i Egypten, från Egyptens bäck ända till floden Frat”. Jesaja ser Israel samlat ”från den strida floden intill Egyptens bäck”, och Hesekiels nya land löper i söder ”från Tamar till Meribots vatten vid Kades, till bäcken, fram till Stora havet”."
    - "Assyrierna kände samma gräns. Tiglat-Pileser III lät resa sin kungliga stele vid Egyptens bäck 734 f.Kr.; Sargon II bosatte deporterade på gränsen till ”Egyptens bäcks stad” och öppnade Egyptens förseglade handelsplats (kāru) för handel. Grekerna kallade staden vid wadins mynning Rhinokolura; Diodoros berättar att Aktisanes, en etiopisk kung som hade erövrat Egypten, bosatte dit brottslingar med avskurna näsor, varav namnet. I dag är el-Arish huvudstad i Egyptens guvernement Norra Sinai, och Wadi el-Arish svämmar fortfarande över efter de sällsynta vinterregnen."
  nb:
    - "Egypts bekk (hebraisk nahal Mitsrayim) var det lovede landets sørvestlige grense, wadien der Kanaan sluttet og ørkenveien til Egypt begynte; dens motstykke i nord var Lebo-Hamat. Den er forskjellig fra «Egyptens elv» i pakten med Abram, der et annet ord brukes og Nilen trolig er ment. De fleste identifiserer den med Wadi el-Arish, den store tørre elven i Nord-Sinai som samler regnet fra halvøya og når Middelhavet ved el-Arish, omtrent 75 km sørvest for Gasa. Nadav Na'aman har hevdet at den assyriske «Egypts bekk» snarere var Nahal Besor, wadien sør for Gasa, og noen få har plassert den ved Sjihor, den østligste grenen av Nilen."
    - "4. Mosebok trekker sørgrensen fra Kadesj-Barnea forbi Asmon, der den skal «svinge bort til Egyptens bekk og så gå ut i havet», og Josva gjentar linjen for Juda, hvis filisterkyst når «inntil Egyptens bekk og det store hav». Salomos forsamling kom «like fra Hamat-veien og til Egyptens bekk». Etter Karkemisj bemerker Kongebøkene at «kongen i Babel hadde tatt alt det som hadde tilhørt kongen i Egypten, fra Egyptens bekk til Frat-elven». Jesaja ser Israel samlet «fra Storelven til Egyptens bekk», og Esekiels nye land går i sør «fra Tamar til Meribots vann ved Kades»."
    - "Assyrerne kjente den samme grensen. Tiglat-Pileser III reiste sin kongelige stele ved Egypts bekk i 734 f.Kr.; Sargon II bosatte deporterte ved grensen til «byen Egypts bekk» og åpnet Egypts forseglede handelsstasjon (kāru) for handel. Grekerne kalte byen ved wadiens munning Rhinokolura; Diodor forteller at Aktisanes, en etiopisk konge som hadde erobret Egypt, bosatte forbrytere med avskårne neser der, derav navnet. I dag er el-Arish hovedstaden i Egypts guvernement Nord-Sinai, og Wadi el-Arish flommer fremdeles etter de sjeldne vinterregnene."
  tl:
    - "Ang Batis ng Egipto (Hebreo nahal Mitsrayim) ang timog-kanlurang hangganan ng lupang pangako, ang wadi kung saan natapos ang Canaan at nagsimula ang daan ng disyerto patungong Egipto; ang katapat nito sa hilaga ay ang Pasukan sa Hamath. Iba ito sa “ilog ng Egipto” ng tipan kay Abram, kung saan ibang salita ang ginamit at marahil ang Nilo ang tinutukoy. Karamihan ay kumikilala rito sa Wadi el-Arish, ang dakilang tuyong ilog ng hilagang Sinai na nag-iipon ng ulan ng tangway at umaabot sa Dagat Mediteraneo sa el-Arish, mga 75 km sa timog-kanluran ng Gaza. Nangatwiran si Nadav Na'aman na ang “Batis ng Egipto” ng Asiria ay sa halip ang Nahal Besor, ang wadi sa timog ng Gaza, at iilan ang naglagay nito sa Sihor, ang pinakasilangang sanga ng Nilo."
    - "Iginuguhit ng Mga Bilang ang timog na hangganan mula sa Cades-barnea sa Asmon “hanggang sa batis ng Egipto, at ang magiging mga labasan niyaon ay sa dagat”, at inuulit ni Josue ang guhit para sa Juda, na ang baybaying Filisteo ay umaabot “hanggang sa batis ng Egipto, at ang malaking dagat”. Ang kapulungan ni Salomon ay nagmula “sa pasukan sa Hamath hanggang sa batis ng Egipto”. Pagkatapos ng Carchemis, itinala ng Mga Hari na “sinakop ng hari ng Babilonia, mula sa batis ng Egipto hanggang sa ilog Eufrates, lahat na nauukol sa hari sa Egipto”. Inaasahan ni Isaias ang Israel na titipunin “mula sa agos ng ilog hanggang sa batis ng Egipto”, at ang bagong lupain ni Ezekiel ay umaabot sa timog “mula sa Tamar hanggang sa tubig ng Meribot-cades, sa batis ng Egipto, hanggang sa malaking dagat”."
    - "Kilala rin ng mga Asiryo ang gayunding hangganan. Itinayo ni Tiglath-pileser III ang kaniyang maharlikang estela sa Batis ng Egipto noong 734 BK; nagpatira si Sargon II ng mga ipinatapon sa hangganan ng “lungsod ng Batis ng Egipto” at binuksan sa kalakalan ang selyadong himpilang pangkalakal (kāru) ng Egipto. Tinawag ng mga Griyego na Rhinocolura ang bayan sa bunganga ng wadi; isinasalaysay ni Diodoro na si Actisanes, isang haring Etiope na sumakop sa Egipto, ay nagpatira roon ng mga bilanggong pinutulan ng ilong, kaya ang pangalan. Ngayon, ang el-Arish ang kabisera ng gobernadurya ng Hilagang Sinai ng Egipto, at bumabaha pa rin ang Wadi el-Arish pagkatapos ng bihirang ulan ng taglamig."
  da:
    - "Egyptens Bæk (hebraisk nahal Mitsrayim) var det forjættede lands sydvestlige grænse, det udtørrede flodleje (wadi), hvor Kana'an sluttede og ørkenvejen til Egypten begyndte; dens modstykke i nord var Lebo-Hamat. Den er forskellig fra »Ægyptens Flod« i pagten med Abram, hvor der bruges et andet ord, og hvor Nilen sandsynligvis er ment. De fleste identificerer den med Wadi el-Arish, Nordsinais store tørre flod, der samler halvøens regn og når Middelhavet ved el-Arish, cirka 75 km sydvest for Gaza. Nadav Na'aman har hævdet, at den assyriske »Egyptens Bæk« snarere var Nahal Besor, wadien syd for Gaza, og nogle få har placeret den ved Sjihor, den østligste gren af Nilen."
    - "4 Mosebog trækker den sydlige grænse fra Kadesj-Barnea forbi Asmon »til Ægyptens Bæk, og Udgangen derpaa skal være til Havet«, og Josva gentager linjen for Juda, hvis filistæiske kyst når »indtil Ægyptens Bæk og det store Hav«. Salomos forsamling kom »fra Strækningen mellem Hamath og Ægyptens Bæk«. Efter Karkemisj bemærker Kongebøgerne, at »Kongen af Babel havde taget fra Ægyptens Bæk indtil Floden Frat alt det, som var Kongen af Ægyptens«. Esajas ser Israel samlet »fra Flodens Strøm indtil Ægyptens Bæk«, og Ezekiels nye land løber i syd »fra Tamar til Kivevandet ved Kades, til Bækken ud imod det store Hav«."
    - "Assyrerne kendte den samme grænse. Tiglat-Pileser 3. rejste sin kongestele ved Egyptens Bæk i 734 f.Kr.; Sargon 2. bosatte deporterede på grænsen af »byen ved Egyptens Bæk« og åbnede Egyptens forseglede handelsstation (kāru) for handel. Grækerne kaldte byen ved wadiens munding Rhinokolura; Diodor fortæller, at Aktisanes, en etiopisk konge, der havde erobret Egypten, bosatte forbrydere med afskårne næser dér, deraf navnet. I dag er el-Arish hovedstad i Egyptens guvernement Nordsinai, og Wadi el-Arish oversvømmes stadig efter de sjældne vinterregn."
  sr:
    - "Поток египатски (хебр. нахал Мицрајим) био је југозападна међа обећане земље, вади где је Ханан завршавао и где је почињао пустињски пут у Египат; његова парњакиња на северу био је Улаз у Емат. Разликује се од „воде мисирске“ из завета с Аврамом, где се употребљава друга реч и вероватно се мисли на Нил. Већина га поистовећује с Вади ел Аришом, великом сувом реком северног Синаја која скупља кише полуострва и стиже до Средоземног мора код ел Ариша, неких 75 км југозападно од Газе. Надав Нааман је тврдио да је асирски „Поток египатски“ пре био Нахал Бесор, вади јужно од Газе, а неколицина га је сместила на Сихор, најисточнији крак Нила."
    - "Књига Бројева повлачи јужну међу од Кадис-Варније поред Аселмона „до потока мисирског и иде до мора“, а Исус Навин понавља линију за Јуду, чија филистејска обала допире „до потока мисирског и до великог мора“. Соломунов сабор дошао је „од уласка у Емат до потока мисирског“. После Хархемиса, бележе Књиге о царевима, „цар вавилонски узе од реке мисирске до реке Ефрата све што беше цара мисирског“. Исаија предвиђа Израиља сабраног „од обале реке до потока мисирског“, а Језекиљева нова земља на југу иде „од Тамара до воде Мериве у Кадису, дуж потока до великог мора“."
    - "Асирци су познавали исту границу. Теглат-Феласар III подигао је своју краљевску стелу на Потоку египатском 734. п. н. е.; Саргон II населио је депортоване на међи „града Потока египатског“ и отворио за трговину запечаћену трговачку станицу (кару) Египта. Грци су град на ушћу вадија звали Ринокорура; Диодор приповеда да је Актисан, етиопски краљ који је освојио Египат, ту населио осуђенике са одсеченим носевима, одакле име. Данас је ел Ариш главни град египатског гувернората Северни Синај, а Вади ел Ариш се и даље излива после ретких зимских киша."
  hu:
    - "Egyiptom patakja (héberül nahal micrajim) az ígéret földjének délnyugati határa volt, az a wadi, ahol Kánaán véget ért és az Egyiptomba vezető sivatagi út kezdődött; északi megfelelője Lebó-Hamát volt. Különbözik az Ábrámmal kötött szövetség „Égyiptomnak folyóvizétől” kifejezésétől, ahol más szó áll, és valószínűleg a Nílusra gondol. A legtöbben a Wadi el-Arishsal azonosítják, az északi Sínai-félsziget nagy kiszáradt folyójával, amely összegyűjti a félsziget esőit, és a Földközi-tengerbe el-Arishnál torkollik, Gázától mintegy 75 km-re délnyugatra. Nadav Na'aman amellett érvelt, hogy az asszír „Egyiptom patakja” inkább a Nahal Besor, a Gázától délre fekvő wadi volt, néhányan pedig a Sihórnál, a Nílus legkeletibb ágánál helyezték el."
    - "Mózes negyedik könyve a déli határt Kádes-Barneától Acmonon át húzza „Égyiptom patakáig, a vége pedig a tengernél legyen”, Józsué pedig megismétli a vonalat Júdára, amelynek filiszteus tengerpartja „Égyiptom patakjáig, és a nagy tenger és melléke” ér. Salamon gyülekezete „Hámáttól fogva az Égyiptom patakáig” jött össze. Karkemis után, jegyzi meg a Királyok könyve, „Babilónia királya mindent elvett, a mi csak az égyiptomi királyé volt, Égyiptom folyóvizétől az Eufrátes folyóvizéig”. Ézsaiás Izráelt összegyűjtve látja „az Eufrátes folyóvizétől Égyiptom patakjáig”, Ezékiel új földje pedig délen „Támártól a versengések vizéig Kádesben, azután a folyó felé a nagy-tengerig” húzódik."
    - "Az asszírok ugyanezt a határt ismerték. III. Tiglat-Pileszer Kr. e. 734-ben királyi sztéléjét Egyiptom patakjánál állíttatta fel; II. Szargon deportáltakat telepített „Egyiptom patakja városának” határára, és megnyitotta a kereskedelem előtt Egyiptom lepecsételt kereskedőtelepét (kāru). A görögök a wadi torkolatánál lévő várost Rhinokolourának nevezték; Diodórosz szerint Aktiszanész, egy Egyiptomot meghódító etióp király orr nélküli elítélteket telepített ide, innen a név. Ma el-Arish Egyiptom Észak-Sínai kormányzóságának székhelye, és a Wadi el-Arish a ritka téli esők után még ma is elönt."
  fi:
    - "Egyptin puro (hepreaksi nahal Mitsrayim) oli luvatun maan lounaisraja, wadi, jossa Kanaan päättyi ja erämaatie Egyptiin alkoi; sen vastine pohjoisessa oli Lebo-Hamat. Se on eri kuin Abramin liiton ”Egyptin virta”, jossa käytetään eri sanaa ja jolla tarkoitetaan luultavasti Niiliä. Useimmat tunnistavat sen Wadi el-Arishiksi, Pohjois-Siinain suureksi kuivaksi joeksi, joka kokoaa niemimaan sateet ja saavuttaa Välimeren el-Arishissa, noin 75 km Gazasta lounaaseen. Nadav Na'aman esitti, että assyrialaisten ”Egyptin puro” oli pikemminkin Nahal Besor, Gazan eteläpuolinen wadi, ja muutamat ovat sijoittaneet sen Sihoriin, Niilin itäisimpään haaraan."
    - "Neljäs Mooseksen kirja vetää eteläisen rajan Kades-Barneasta Asmonin ohi: ”kääntyköön Asmonista Egyptin purolle ja päättyköön mereen”, ja Joosua toistaa rajan Juudalle, jonka filistealainen rannikko ulottuu ”Egyptin puroon asti. Ja Suuri meri on rajana”. Salomon kokous tuli koolle ”aina sieltä, mistä mennään Hamatiin, ja aina Egyptin purolta asti”. Karkemisin jälkeen, Kuninkaiden kirja toteaa, ”Baabelin kuningas oli vallannut kaiken, mikä oli Egyptin kuninkaan omaa, Egyptin purosta aina Eufrat-virtaan saakka”. Jesaja näkee Israelin koottavan ”Eufrat-virrasta aina Egyptin puroon asti”, ja Hesekielin uusi maa ulottuu etelässä ”Taamarista Meriban veteen, joka on Kaadeksessa, Puroon ja Suureen mereen”."
    - "Assyrialaiset tunsivat saman rajan. Tiglat-Pileser III pystytti kuninkaallisen steelansa Egyptin purolle vuonna 734 eaa.; Sargon II asutti karkotettuja ”Egyptin puron kaupungin” rajalle ja avasi Egyptin suljetun kauppa-aseman (kāru) kaupalle. Kreikkalaiset kutsuivat wadin suulla ollutta kaupunkia nimellä Rhinokolura; Diodoros kertoo, että Aktisanes, Egyptin valloittanut etiopialainen kuningas, asutti sinne nenättömiksi leikattuja rikollisia, mistä nimi. Nykyisin el-Arish on Egyptin Pohjois-Siinain kuvernementin pääkaupunki, ja Wadi el-Arish tulvii yhä harvinaisten talvisateiden jälkeen."
  vi:
    - "Khe Ê-díp-tô (tiếng Hê-bơ-rơ nahal Mitsrayim) là biên giới tây nam của đất hứa, con wadi nơi Ca-na-an chấm dứt và con đường sa mạc đến Ê-díp-tô bắt đầu; đối ứng của nó ở phía bắc là Cửa vào Ha-mát. Nó khác với “sông Ê-díp-tô” trong giao ước với Áp-ram, nơi dùng một từ khác và có lẽ chỉ Sông Ni-lơ. Phần lớn đồng nhất nó với Wadi el-Arish, con sông khô lớn của bắc Sinai thu nước mưa của bán đảo và đổ ra Địa Trung Hải tại el-Arish, cách Ga-xa khoảng 75 km về phía tây nam. Nadav Na'aman lập luận rằng “Khe Ê-díp-tô” của người A-si-ri đúng hơn là Nahal Besor, con wadi phía nam Ga-xa, và một vài người đặt nó ở Si-ho, nhánh cực đông của sông Ni-lơ."
    - "Sách Dân số Ký vẽ biên giới phía nam từ Ca-đe-Ba-nê-a qua Át-môn, “về lối suối Ê-díp-tô và giáp biển”, và Giô-suê lặp lại đường ấy cho Giu-đa, có bờ biển Phi-li-tin chạy “cho đến khe Ê-díp-tô, và biển lớn dùng làm giới hạn”. Hội chúng của Sa-lô-môn đến “từ miền Ha-mát cho đến khe Ê-díp-tô”. Sau Cạt-kê-mít, sách Các Vua ghi rằng “vua Ba-by-lôn đã chiếm lấy xứ thuộc về vua Ê-díp-tô, từ khe Ê-díp-tô cho đến sông Ơ-phơ-rát”. Ê-sai thấy trước Y-sơ-ra-ên được nhóm lại “từ lòng Sông cái cho đến khe Ê-díp-tô”, và đất mới của Ê-xê-chi-ên chạy ở phía nam “từ Tha-ma cho đến sông Mê-ri-ba, tại Ca-đe, đến khe Ê-díp-tô, cho đến biển lớn”."
    - "Người A-si-ri biết cùng một biên giới ấy. Tiếc-la-Phi-lê-se III dựng bia hoàng gia của mình tại Khe Ê-díp-tô năm 734 TCN; Sargon II đưa những người bị đày đến định cư ở biên giới “thành của Khe Ê-díp-tô” và mở trạm buôn có niêm phong (kāru) của Ê-díp-tô cho thương mại. Người Hy Lạp gọi thị trấn ở cửa wadi là Rhinocolura; Diodorus kể rằng Actisanes, một vua người Ê-thi-ô-bi đã chinh phục Ê-díp-tô, đã đưa các tù nhân bị cắt mũi đến định cư ở đó, nên có tên ấy. Ngày nay el-Arish là thủ phủ của tỉnh Bắc Sinai của Ai Cập, và Wadi el-Arish vẫn còn ngập nước sau những cơn mưa mùa đông hiếm hoi."
  ro:
    - "Pârâul Egiptului (în ebraică nahal Mitsrayim) era hotarul de sud-vest al țării făgăduite, valea unde se sfârșea Canaanul și începea drumul prin deșert spre Egipt; omologul său din nord era Intrarea Hamatului. El este deosebit de „rîul Eghipetului” din legământul cu Avram, unde se folosește un alt cuvânt și unde probabil se are în vedere Nilul. Cei mai mulți îl identifică cu Wadi el-Arish, marele râu secat din nordul Sinaiului, care adună ploile peninsulei și ajunge la Mediterană la el-Arish, la vreo 75 km sud-vest de Gaza. Nadav Na'aman a susținut că „Pârâul Egiptului” asirian era mai degrabă Nahal Besor, wadiul de la sud de Gaza, iar câțiva l-au așezat la Șihor, brațul cel mai estic al Nilului."
    - "Cartea Numerelor trasează hotarul de sud de la Cades-Barnea, pe lângă Ațmon, până la „valea Eghipetului, și va fi sfârșitul lor Marea cea mare”, iar Iosua repetă linia pentru Iuda, al cărui țărm filistean ajunge până la râul Egiptului și Marea cea Mare. Adunarea lui Solomon a venit „dela intrarea Imatului și până la pârîul Eghipetului”. După Carchemiș, notează Regii, împăratul Vavilonului luase „dela rîul Eghipetului până la rîul Efratului toate câte erau ale împăratului Eghipetului”. Isaia vede pe fiii lui Israel adunați „dela ezerul rîului până la Rinocuron”, iar noua țară a lui Ezechiel merge în sud de la Tamar până la apele certei de la Cades, până la râu, spre Marea cea Mare."
    - "Asirienii cunoșteau aceeași graniță. Tiglat-Pileser al III-lea și-a ridicat stela regală la Pârâul Egiptului în 734 î.Hr.; Sargon al II-lea a așezat deportați la hotarul „cetății Pârâului Egiptului” și a deschis comerțului debarcaderul comercial sigilat (kāru) al Egiptului. Grecii numeau Rinocolura cetatea de la gura wadiului; Diodor povestește că Actisanes, un rege etiopian care cucerise Egiptul, a așezat acolo osândiți cu nasul tăiat, de unde numele. Astăzi el-Arish este capitala guvernoratului Sinai de Nord al Egiptului, iar Wadi el-Arish încă se revarsă după rarele ploi de iarnă."
  bg:
    - "Египетският поток (на иврит нахал Мицраим) бил югозападната граница на обетованата земя, уадито, където свършвал Ханаан и започвал пустинният път към Египет; негово съответствие на север бил Входът на Емат. Той е различен от „Египетската река“ от завета с Аврам, където е употребена друга дума и вероятно се има предвид Нил. Повечето го отъждествяват с Уади ел-Ариш, голямата суха река на Северен Синай, която събира дъждовете на полуострова и стига до Средиземно море при ел-Ариш, на около 75 км югозападно от Газа. Надав Нааман твърди, че асирийският „Египетски поток“ е по-скоро потокът Восор (Нахал Бесор), уадито южно от Газа, а неколцина го поставят при Сихор, най-източния ръкав на Нил."
    - "Числа прокарва южната граница от Кадес-Варни покрай Ацмон „до Египетския поток, и ще стига до морето“, а книгата Иисус Навин повтаря линията за Юда, чийто филистимски бряг стига „до Египетския поток и голямото море“. Съборът на Соломон дошъл „от входа Емат дори до Египетския поток“. След Кархемис, отбелязва книгата Царе, „Вавилонский цар взе, от Египетската река до реката Евфрат, всичко което беше под властта на Египетския цар“. Исаия предвижда Израил събран „от стремителната река до потока на Египет“, а новата земя на Йезекиил върви на юг „от Тамар до водата на Мерива Кадис, и през потока до голямото море“."
    - "Асирийците познавали същата граница. Теглатфеласар III поставил царската си стела при Египетския поток през 734 г. пр.н.е.; Саргон II заселил депортирани на границата на „града на Египетския поток“ и отворил запечатаното търговско пристанище (кару) на Египет за търговия. Гърците наричали града при устието на уадито Ринокорура; Диодор разказва, че Актизан, етиопски цар, завладял Египет, заселил там престъпници с отрязани носове, откъдето и името. Днес ел-Ариш е столица на египетската губерния Северен Синай, а Уади ел-Ариш все още се пълни с вода след редките зимни дъждове."
