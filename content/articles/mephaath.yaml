body:
  en:
    - "Mephaath was a town on the Moabite plateau east of the Dead Sea, the Mishor, given to the tribe of Reuben with Jahaz and Kedemoth and then set aside, with its pasture lands, for the Levites of the family of Merari: “Kedemoth with her suburbs, and Mephaath with her suburbs”. By the time of Jeremiah it was Moabite again, and the prophet names it among the cities of the plain on which “judgment is come”, between Jahaz and Dibon. The Russian Bible there writes the name as Mofaf."
    - "In the fourth century Eusebius knew Mephaath as a place where a Roman garrison watched the edge of the desert, and the late Roman army list, the Notitia Dignitatum, stations a cavalry unit at Mefa under the duke of Arabia. That fort is Umm er-Rasas, some 27 km south-east of Madaba: a walled camp of about 160 by 140 m with a town beside it, sixteen churches, and mosaic floors whose inscriptions call the place Kastron Mefaa. The mosaic of the church of St Stephen, laid in the eighth century, shows the cities of Palestine and Jordan; a tall tower outside the walls is usually taken for a stylite's pillar. UNESCO inscribed the site in 2004. Whether the Iron Age town of the Bible stood on the same spot is less certain; older scholars placed Mephaath at Tell Jawah or Khirbet Nefa'ah south of Amman on the strength of the name, but most now accept Umm er-Rasas."
    - "Today Umm er-Rasas lies in central Jordan, a World Heritage Site on the open steppe, its churches roofed to protect the mosaics and its tower still standing."
  ru:
    - "Мефааф — город на Моавитском плато к востоку от Мёртвого моря, на равнине Мисор, отданный колену Рувимову вместе с Иаацей и Кедемофом, а затем выделенный с предместьями левитам из рода Мерари: «Кедемоф и предместья его, Мефааф и предместья его». Ко времени Иеремии он снова был моавитским, и пророк называет его среди городов равнины, на которые «суд пришел», между Иаацей и Дивоном. Русская Библия пишет там имя как Мофаф."
    - "В IV веке Евсевий знал Мефааф как место, где римский гарнизон стерёг край пустыни, а позднеримский список войск, Notitia Dignitatum, ставит конный отряд в Мефе под началом дукса Аравии. Эта крепость — Умм-эр-Расас примерно в 27 км к юго-востоку от Мадабы: обнесённый стеной лагерь примерно 160 на 140 м с посёлком рядом, шестнадцать церквей и мозаичные полы, надписи на которых зовут место Кастрон Мефаа. Мозаика церкви святого Стефана, выложенная в VIII веке, показывает карту городов Палестины и Иордании; высокую башню за стенами обычно считают столпом столпника. ЮНЕСКО внесла памятник в список в 2004 году. Стоял ли на том же месте библейский город железного века, менее ясно; прежние учёные по созвучию имени помещали Мефааф в Телль-Джава или Хирбет-Нефаа к югу от Аммана; большинство теперь принимает Умм-эр-Расас."
    - "Сегодня Умм-эр-Расас лежит в центральной Иордании — объект Всемирного наследия в открытой степи; церкви накрыты кровлей ради мозаик, а башня всё ещё стоит."
  uk:
    - "Мефаат був містом на моавитському плато на схід від Мертвого моря, у Мішорі, даним племені Рувима разом з Яцею та Кедемотом, а потім відокремленим з його пасовищами для левітів з роду Мерарі: «Кадемот з пасовищами його, та Мефаат укупі з пасовищами його». За часів Єремії він знову був моавитським, і пророк називає його серед міст рівнини, на які «прийшов суд на рівнини», між Яцею й Дівоном. Синодальний переклад пише там назву як Мофаф."
    - "У IV ст. Євсевій знав Мефаат як місце, де римський гарнізон стеріг край пустелі, а пізньоримський військовий перелік, Notitia Dignitatum, розміщує кінний загін у Мефі під командою дукса Аравії. Цей форт — Умм-ер-Расас, приблизно за 27 км на південний схід від Мадаби: мурований табір приблизно 160 на 140 м з містом поруч, шістнадцять церков і мозаїчні підлоги, чиї написи називають це місце Кастрон Мефаа. Мозаїка церкви святого Стефана, викладена у VIII ст., показує міста Палестини й Йорданії; висока вежа поза стінами зазвичай вважається за стовп стовпника. ЮНЕСКО внесло місце до списку 2004 р. Чи стояло на тому самому місці біблійне місто залізної доби, менш певно; давніші вчені розміщували Мефаат у Телль-Джаві або Хірбет-Нефаа на південь від Амана на підставі назви, але більшість нині приймає Умм-ер-Расас."
    - "Сьогодні Умм-ер-Расас лежить у центральній Йорданії — об’єкт Всесвітньої спадщини на відкритому степу, його церкви перекриті дахами, щоб захистити мозаїки, а вежа й досі стоїть."
  es:
    - "Mefaat era una ciudad de la meseta de Moab, al este del mar Muerto, el Mishor, dada a la tribu de Rubén con Jahaza y Cedemot y luego apartada, con sus ejidos, para los levitas de la familia de Merari: «A Cedemoth con sus ejidos, y Mephaat con sus ejidos». En tiempos de Jeremías volvía a ser moabita, y el profeta la nombra entre las ciudades de la llanura sobre las que «vino juicio sobre la tierra de la campiña», entre Jahaza y Dibón. La Biblia rusa escribe allí el nombre como Mofaf."
    - "En el siglo IV, Eusebio conoció Mefaat como lugar donde una guarnición romana vigilaba el borde del desierto, y la lista del ejército romano tardío, la Notitia Dignitatum, sitúa una unidad de caballería en Mefa bajo el dux de Arabia. Ese fuerte es Umm er-Rasas, a unos 27 km al sudeste de Madaba: un campamento amurallado de unos 160 por 140 m con ciudad contigua, dieciséis iglesias y mosaicos cuyas inscripciones llaman al lugar Kastron Mefaa. El mosaico de la iglesia de San Esteban, del siglo VIII, muestra las ciudades de Palestina y Jordania; una torre alta fuera de las murallas suele tomarse por columna de estilita. La UNESCO lo inscribió en 2004. Que la ciudad bíblica de la Edad del Hierro se alzara allí es menos seguro; estudiosos antiguos situaron Mefaat en Tell Jawah o Khirbet Nefa'ah, al sur de Amán, por el nombre, pero hoy la mayoría acepta Umm er-Rasas."
    - "Hoy Umm er-Rasas se halla en el centro de Jordania, un sitio del Patrimonio Mundial en la estepa abierta, con sus iglesias techadas para proteger los mosaicos y su torre aún en pie."
  pt:
    - "Mefaate era uma cidade do planalto moabita a leste do mar Morto, o Mishor, dada à tribo de Rúben com Jaza e Quedemote e depois separada, com suas pastagens, para os levitas da família de Merari: “Quedemote com suas pastagens e Mefaate com suas pastagens”. No tempo de Jeremias era moabita de novo, e o profeta a nomeia entre as cidades da planície sobre as quais “o juízo veio”, entre Jaza e Dibom. A Bíblia russa ali grafa o nome como Mofaf."
    - "No século IV, Eusébio conhecia Mefaate como um lugar onde uma guarnição romana vigiava a borda do deserto, e a lista do exército romano tardio, a Notitia Dignitatum, põe uma unidade de cavalaria em Mefa sob o duque da Arábia. Esse forte é Umm er-Rasas, a uns 27 km a sudeste de Madaba: um acampamento murado de cerca de 160 por 140 m com uma cidade ao lado, dezesseis igrejas e pisos de mosaico cujas inscrições chamam o lugar Kastron Mefaa. O mosaico da igreja de Santo Estêvão, assentado no século VIII, mostra as cidades da Palestina e da Jordânia; uma torre alta fora das muralhas costuma ser tomada por coluna de um estilita. A UNESCO o inscreveu em 2004. Que a cidade bíblica da Idade do Ferro ficasse no mesmo ponto é menos certo; estudiosos mais antigos situaram Mefaate em Tell Jawah ou Khirbet Nefa'ah, ao sul de Amã, pelo nome, mas hoje se aceita Umm er-Rasas."
    - "Hoje Umm er-Rasas fica no centro da Jordânia, Patrimônio Mundial na estepe aberta, com suas igrejas cobertas para proteger os mosaicos e a torre ainda de pé."
  de:
    - "Mefaat war eine Stadt auf der moabitischen Hochebene östlich des Toten Meeres, dem Mischor, Ruben mit Jahaz und Kedemot zugeteilt und dann mit ihrem Weideland für die Leviten aus der Familie Merari bestimmt: „Kedemoth und seine Vorstädte, Mephaath und seine Vorstädte“. Zur Zeit Jeremias war sie wieder moabitisch, und der Prophet nennt sie unter den Städten der Ebene, von denen es heißt: „Die Strafe ist über das ebene Land gegangen, nämlich über Holon, Jahza, Mephaath“, zwischen Jahaz und Dibon. Die russische Bibel schreibt den Namen dort Mofaf."
    - "Im 4. Jahrhundert kannte Eusebius Mefaat als Standort einer römischen Garnison am Wüstenrand, und die spätrömische Heeresliste, die Notitia Dignitatum, führt eine Reitereinheit in Mefa unter dem Herzog von Arabien. Dieses Kastell ist Umm er-Rasas, 27 km südöstlich von Madaba: ein ummauertes Lager von 160 mal 140 m mit einer Stadt daneben, sechzehn Kirchen und Mosaikböden, deren Inschriften den Ort Kastron Mefaa nennen. Das Mosaik der Stephanskirche, im 8. Jahrhundert verlegt, zeigt die Städte Palästinas und Jordaniens; ein hoher Turm vor den Mauern gilt meist als Säulenheiligenturm. Die UNESCO nahm den Ort 2004 in die Liste auf. Ob die eisenzeitliche Stadt der Bibel hier stand, ist weniger sicher; ältere Gelehrte suchten es wegen des Namens in Tell Jawah oder Khirbet Nefa'ah südlich von Amman, doch die meisten akzeptieren heute Umm er-Rasas."
    - "Heute liegt Umm er-Rasas im mittleren Jordanien, eine Welterbestätte in der offenen Steppe, ihre Kirchen überdacht, um die Mosaiken zu schützen, und ihr Turm steht noch."
  fr:
    - "Méphaath était une ville du plateau moabite à l’est de la mer Morte, le Mishor, donnée à la tribu de Ruben avec Jahats et Kedémoth, puis mise à part, avec ses pâturages, pour les lévites de la famille de Merari : « Kedémoth et sa banlieue, et Méphaath et sa banlieue ». À l’époque de Jérémie, elle était de nouveau moabite, et le prophète la nomme parmi les villes de la plaine sur lesquelles « le châtiment est venu », entre Jahats et Dibon. La Bible russe y écrit le nom Mofaf."
    - "Au IVe siècle, Eusèbe connaissait Méphaath comme un lieu où une garnison romaine surveillait la lisière du désert, et la liste militaire du Bas-Empire, la Notitia Dignitatum, poste une unité de cavalerie à Mefa sous le duc d’Arabie. Ce fort est Umm er-Rasas, à 27 km au sud-est de Madaba : un camp fortifié d’environ 160 sur 140 m avec une ville à côté, seize églises et des sols de mosaïque dont les inscriptions nomment le lieu Kastron Mefaa. La mosaïque de l’église Saint-Étienne, posée au VIIIe siècle, montre les villes de Palestine et de Jordanie ; une haute tour hors des murs passe pour une colonne de stylite. L’UNESCO a inscrit le site en 2004. Que la ville biblique de l’âge du Fer s’y soit trouvée est moins certain ; les anciens savants la plaçaient à Tell Jawah ou Khirbet Nefa’ah, au sud d’Amman, sur la foi du nom, mais la plupart admettent Umm er-Rasas."
    - "Aujourd’hui, Umm er-Rasas se trouve au centre de la Jordanie, site du patrimoine mondial sur la steppe ouverte, ses églises couvertes d’un toit pour protéger les mosaïques et sa tour toujours debout."
  it:
    - "Mefaat era una città dell’altopiano moabita a est del Mar Morto, il Mishor, data alla tribù di Ruben con Iaaz e Chedemot e poi assegnata, con i suoi pascoli, ai leviti della famiglia di Merari: «Kedemoth e il suo contado e Mefaath e il suo contado». Al tempo di Geremia era di nuovo moabita, e il profeta la nomina tra le città della pianura su cui «Un castigo è venuto», tra Iaaz e Dibon. La Bibbia russa scrive là il nome come Mofaf."
    - "Nel IV secolo Eusebio conosceva Mefaat come presidio romano sul margine del deserto, e la Notitia Dignitatum, l’elenco tardo-romano dell’esercito, stanzia a Mefa un reparto di cavalleria sotto il duca d’Arabia. Quel forte è Umm er-Rasas, a circa 27 km a sud-est di Màdaba: un accampamento murato di circa 160 per 140 m con una città accanto, sedici chiese e mosaici le cui iscrizioni chiamano il luogo Kastron Mefaa. Il mosaico di Santo Stefano, dell’VIII secolo, mostra le città della Palestina e della Giordania; un’alta torre fuori le mura è ritenuta di solito la colonna di uno stilita. Il sito è patrimonio UNESCO dal 2004. Che la città biblica dell’età del Ferro sorgesse nello stesso punto è meno certo; studiosi più antichi, in base al nome, collocarono Mefaat a Tell Jawah o a Khirbet Nefa‘ah a sud di Amman, ma oggi i più accettano Umm er-Rasas."
    - "Oggi Umm er-Rasas si trova nella Giordania centrale, un sito del Patrimonio mondiale sulla steppa aperta, con le chiese coperte per proteggere i mosaici e la torre ancora in piedi."
  pl:
    - "Mefaat było miastem na płaskowyżu Moabu na wschód od Morza Martwego, Mishor, przydzielonym pokoleniu Rubena z Jahaz i Kedemot, a następnie wydzielonym wraz z pastwiskami dla Lewitów z rodu Merariego: „Kedemot i przedmieścia jego; i Mefaat i przedmieścia jego”. Za czasów Jeremiasza było znów moabickie, a prorok wymienia je wśród miast równiny, na które „sąd przyszedł”, między Jahaz a Dibon. Biblia rosyjska zapisuje tam nazwę jako Mofaf."
    - "W IV w. Euzebiusz znał Mefaat jako miejsce, gdzie rzymski garnizon strzegł skraju pustyni, a późnorzymski wykaz wojska, Notitia Dignitatum, umieszcza jednostkę jazdy w Mefa pod dowództwem księcia Arabii. Ten fort to Umm er-Rasas, około 27 km na południowy wschód od Madaby: obozowisko z murami o wymiarach około 160 na 140 m z miastem obok, szesnaście kościołów i mozaikowe posadzki, których inskrypcje nazywają to miejsce Kastron Mefaa. Mozaika kościoła św. Szczepana, ułożona w VIII w., ukazuje miasta Palestyny i Jordanii; wysoka wieża poza murami jest zwykle brana za słup stylity. UNESCO wpisało stanowisko w 2004 r. Czy biblijne miasto z epoki żelaza stało w tym samym miejscu, jest mniej pewne; dawniejsi uczeni umieszczali Mefaat w Tell Jawah lub Khirbet Nefa'ah na południe od Ammanu na podstawie nazwy, ale większość przyjmuje dziś Umm er-Rasas."
    - "Dziś Umm er-Rasas leży w środkowej Jordanii, obiekt światowego dziedzictwa na otwartym stepie, z kościołami przykrytymi dachem dla ochrony mozaik i wciąż stojącą wieżą."
  nl:
    - "Mefaät was een stad op het Moabitische plateau ten oosten van de Dode Zee, de Mishor, toegewezen aan de stam Ruben met Jahaz en Kedemot en daarna met haar weidegronden afgezonderd voor de Levieten van het geslacht Merari: “Kedemoth en haar voorsteden, en Mefaath en haar voorsteden”. Ten tijde van Jeremia was het weer Moabitisch, en de profeet noemt het onder de steden van de vlakte over welke “het oordeel is gekomen”, tussen Jahaz en Dibon. De Russische Bijbel schrijft de naam daar als Mofaf."
    - "Eusebius kende in de vierde eeuw Mefaät als plaats waar een Romeins garnizoen de woestijnrand bewaakte, en de laat-Romeinse legerlijst Notitia Dignitatum legert een ruiterij in Mefa onder de dux van Arabië. Dat fort is Umm er-Rasas, zo'n 27 km ten zuidoosten van Madaba: een ommuurd kamp van ongeveer 160 bij 140 m met een stad ernaast, zestien kerken en mozaïeken waarvan de inscripties de plaats Kastron Mefaa noemen. Het achtste-eeuwse mozaïek van de Sint-Stefanuskerk toont de steden van Palestina en Jordanië; een hoge toren buiten de muren geldt gewoonlijk als zuilheiligenpilaar. UNESCO plaatste haar in 2004 op de werelderfgoedlijst. Of de bijbelse ijzertijdstad op dezelfde plek stond, is minder zeker; oudere geleerden plaatsten Mefaät op grond van de naam bij Tell Jawah of Khirbet Nefa'ah ten zuiden van Amman, maar de meesten volgen nu Umm er-Rasas."
    - "Tegenwoordig ligt Umm er-Rasas in Midden-Jordanië, een werelderfgoedlocatie op de open steppe, met kerken die overdekt zijn om de mozaïeken te beschermen en een toren die nog staat."
  cs:
    - "Mefaat bylo město na moábské náhorní rovině východně od Mrtvého moře, Mišoru, dané pokolení Rúbenovu s Jahacem a Kedemótem a poté vyčleněné s pastvinami pro levity z rodu Merari: „Kedemot a předměstí jeho, a Mefat s podměstím jeho“. V době Jeremjášově bylo opět moábské a prorok je jmenuje mezi městy roviny, na něž „soud přišel“, mezi Jahacem a Dibonem. Ruská Bible tam píše jméno jako Mofaf."
    - "Ve 4. století znal Eusebius Mefaat jako místo, kde římská posádka střežila okraj pouště, a pozdní římský seznam vojska, Notitia Dignitatum, umisťuje u Mefy jezdeckou jednotku pod vévodou Arábie. Tou pevností je Umm er-Rasas, asi 27 km jihovýchodně od Madaby: opevněný tábor asi 160 × 140 m s městem vedle, šestnáct kostelů a mozaikové podlahy, jejichž nápisy nazývají místo Kastron Mefaa. Mozaika kostela svatého Štěpána z 8. století ukazuje města Palestiny a Jordánska; vysoká věž za hradbami se obvykle pokládá za sloup stylity. UNESCO místo zapsalo roku 2004. Zda tamtéž stálo biblické město z doby železné, je méně jisté; starší badatelé kladli Mefaat do Tell Jawah nebo Khirbet Nefa'ah jižně od Ammánu podle jména, většina však nyní přijímá Umm er-Rasas."
    - "Dnes leží Umm er-Rasas ve středním Jordánsku, místo světového dědictví na otevřené stepi, s kostely zastřešenými na ochranu mozaik a s dosud stojící věží."
  sv:
    - "Mefaat var en stad på den moabitiska platån öster om Döda havet, Mishor, given åt Rubens stam med Jahas och Kedemot och sedan avsatt, med sina betesmarker, åt leviterna av Meraris släkt: ”Kedemot med dess utmarker och Mefaat med dess utmarker”. På Jeremias tid var den åter moabitisk, och profeten nämner den bland slättlandets städer över vilka ”domen har kommit”, mellan Jahas och Dibon. Den ryska Bibeln skriver där namnet Mofaf."
    - "På 300-talet kände Eusebios Mefaat som en plats där en romersk garnison bevakade ökenkanten, och den sena romerska arméförteckningen Notitia Dignitatum förlägger en ryttarenhet till Mefa under hertigen av Arabien. Det fortet är Umm er-Rasas, omkring 27 km sydost om Madaba: ett muromgärdat läger på omkring 160 gånger 140 m med en stad intill, sexton kyrkor och mosaikgolv vars inskrifter kallar platsen Kastron Mefaa. Mosaiken i Sankt Stefanos' kyrka, lagd på 700-talet, visar städerna i Palestina och Jordanien; ett högt torn utanför murarna anses vanligen vara en stylitpelare. Unesco skrev in platsen 2004. Huruvida bibelns järnåldersstad låg på samma plats är mindre säkert; äldre forskare förlade Mefaat till Tell Jawah eller Khirbet Nefa'ah söder om Amman på grund av namnet, men de flesta godtar nu Umm er-Rasas."
    - "I dag ligger Umm er-Rasas i centrala Jordanien, ett världsarv på den öppna stäppen, med kyrkorna försedda med tak för att skydda mosaikerna och tornet fortfarande stående."
