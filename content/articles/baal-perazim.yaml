# Overview article (ADR 0007). Mainstream facts only; the place of one battle of David; the candidate sites near the valley of Rephaim are given without choosing one.
id: baal-perazim
place: a6bf059
title:
  en: "Baal-perazim"
  ru: "Ваал-Перацим"
  uk: "Ваал-Перацім"
  es: "Baal-perazim"
  pt: "Baal-Perazim"
  de: "Baal-Perazim"
  fr: "Baal-Peratsim"
  it: "Baal-Perazim"
  pl: "Baal-Perasim"
  nl: "Baäl-Perazim"
  cs: "Báal-perasim"
body:
  en:
    - "Baal-perazim, “the lord of breaking through”, is the place where David first defeated the Philistines after he became king over all Israel. The Philistines “came and spread themselves in the valley of Rephaim”, south-west of Jerusalem, and David, having asked the LORD, attacked them: “David came to Baal-perazim, and David smote them there, and said, The LORD hath broken forth upon mine enemies before me, as the breach of waters. Therefore he called the name of that place Baal-perazim.” The Philistines left their idols behind, and David's men carried them off and burned them. Chronicles tells the same story, and Isaiah recalls it as a sign of God's sudden judgement: “the LORD shall rise up as in mount Perazim”."
    - "The site is not known. It must have overlooked the valley of Rephaim, and the proposals are heights on the south-western edge of Jerusalem, such as Ez-Zuhur, the ridge of Abu Tor, the hill of Gilo, and Mar Elias on the road to Bethlehem; none has produced anything that names it. The ground is today covered by the southern neighbourhoods of Jerusalem."
  ru:
    - "Ваал-Перацим, «господин прорыва», — место, где Давид впервые разбил Филистимлян после того, как стал царём над всем Израилем. Филистимляне «пришли и расположились в долине Рефаим» к юго-западу от Иерусалима, и Давид, вопросив Господа, ударил на них: «И пошел Давид в Ваал-Перацим и поразил их там, и сказал Давид: Господь разнес врагов моих предо мною, как разносит вода. Посему и месту тому дано имя Ваал-Перацим». Филистимляне оставили там своих истуканов, а Давид велел сжечь их. Паралипоменон рассказывает то же, а Исаия вспоминает это как знак внезапного суда Божия: «Ибо восстанет Господь, как на горе Перациме»."
    - "Место не найдено. Оно должно было возвышаться над долиной Рефаим, и предлагают высоты на юго-западной окраине Иерусалима: Эз-Зухур, гребень Абу-Тора, холм Гило и Мар-Элиас на дороге в Вифлеем; ни одна не дала ничего, что называло бы это место. Эта земля сегодня застроена южными кварталами Иерусалима."
  uk:
    - "Ваал-Перацім, «володар прориву», — місце, де Давид уперше розбив филистимлян, ставши царем над усім Ізраїлем. Филистимляни «розложились по Рефаїм-долинї» на південний захід від Єрусалима, і Давид, запитавши Господа, напав на них: «двинув Давид під Баал-Перазим, а побивши їх там, сказав: Господь порозносив моїх ворогів передо мною, як розтїкаєся вода! Тим і прозвано те місце Баал-Перазим». Филистимляни залишили там своїх ідолів, а люди Давида позбирали їх і спалили. Хроніки розповідають ту саму історію, а Ісая згадує її як знак раптового Божого суду: «встане Господь так, як на горі Перазимі»."
    - "Місце невідоме. Воно мало б оглядати долину Рефаїм, і пропозиції — висоти на південно-західному краї Єрусалима, як-от Ез-Зухур, хребет Абу-Тор, пагорб Гіло і Мар-Ільяс на дорозі до Вифлеєма; жодне не дало нічого, що називає його. Нині ця місцевість забудована південними районами Єрусалима."
  es:
    - "Baal-perazim, «el señor de las brechas», es el lugar donde David derrotó por primera vez a los filisteos después de ser rey sobre todo Israel. «Y vinieron los Filisteos, y extendiéronse por el valle de Raphaim», al sudoeste de Jerusalén, y David, tras consultar a Jehová, los atacó: «Y vino David á Baal-perasim, y allí los venció David, y dijo: Rompió Jehová mis enemigos delante de mí, como quien rompe aguas. Y por esto llamó el nombre de aquel lugar Baal-perasim.» Los filisteos dejaron allí sus ídolos, y los hombres de David se los llevaron y los quemaron. Las Crónicas cuentan la misma historia, e Isaías la recuerda como señal del súbito juicio de Dios: «Jehová se levantará como en el monte Perasim»."
    - "No se conoce el sitio. Debía de dominar el valle de Refaim, y las propuestas son alturas del borde sudoccidental de Jerusalén, como Ez-Zuhur, la cresta de Abu Tor, la colina de Gilo y Mar Elias, en el camino de Belén; ninguna ha dado nada que lo nombre. El terreno está hoy cubierto por los barrios meridionales de Jerusalén."
  pt:
    - "Baal-Perazim, “o senhor das brechas”, é o lugar onde Davi derrotou pela primeira vez os filisteus depois de se tornar rei de todo o Israel. Os filisteus “haviam chegado e se espalhado no vale de Refaim”, a sudoeste de Jerusalém, e Davi, tendo consultado o SENHOR, os atacou: “Davi foi a Baal-Perazim, e Davi os derrotou ali. Então ele disse: ‘O SENHOR rompeu os meus inimigos diante de mim, como o rompimento de águas.’ Por isso ele chamou o nome daquele lugar de Baal-Perazim.” Os filisteus deixaram ali as suas imagens, e os homens de Davi as levaram e as queimaram. Crônicas conta a mesma história, e Isaías a recorda como sinal do juízo súbito de Deus: “o SENHOR se levantará como no monte Perazim”."
    - "O sítio não é conhecido. Devia dominar o vale de Refaim, e as propostas são alturas na borda sudoeste de Jerusalém, como Ez-Zuhur, a crista de Abu Tor, a colina de Gilo e Mar Elias, na estrada de Belém; nenhuma rendeu algo que o nomeie. O terreno está hoje coberto pelos bairros do sul de Jerusalém."
  de:
    - "Baal-Perazim, „der Herr des Durchbruchs“, ist der Ort, wo David die Philister zum ersten Mal besiegte, nachdem er König über ganz Israel geworden war. Die Philister „kamen und ließen sich nieder im Grunde Rephaim“, südwestlich von Jerusalem, und David griff sie an, nachdem er den HERRN gefragt hatte: „Und David kam gen Baal-Perazim und schlug sie daselbst und sprach: Der HERR hat meine Feinde vor mir voneinander gerissen, wie die Wasser reißen. Daher hieß man den Ort Baal-Perazim.“ Die Philister ließen ihre Götzenbilder zurück, und Davids Männer trugen sie fort und verbrannten sie. Die Chronik erzählt dieselbe Geschichte, und Jesaja erinnert daran als Zeichen des plötzlichen Gerichts Gottes: „Denn der HERR wird sich aufmachen wie auf dem Berge Perazim“."
    - "Die Stätte ist nicht bekannt. Sie muss das Tal Refaim überblickt haben, und vorgeschlagen werden Höhen am Südwestrand Jerusalems, wie Ez-Zuhur, der Höhenzug von Abu Tor, der Hügel von Gilo und Mar Elias an der Straße nach Bethlehem; keine hat etwas ergeben, das den Namen nennt. Heute ist das Gelände von den südlichen Vierteln Jerusalems bedeckt."
  fr:
    - "Baal-Peratsim, « le maître des brèches », est le lieu où David battit pour la première fois les Philistins après être devenu roi de tout Israël. Les Philistins « arrivèrent, et se répandirent dans la vallée des Rephaïm », au sud-ouest de Jérusalem, et David, après avoir consulté l’Éternel, les attaqua : « David vint à Baal-Peratsim, où il les battit. Puis il dit : L’Éternel a dispersé mes ennemis devant moi, comme des eaux qui s’écoulent. C’est pourquoi l’on a donné à ce lieu le nom de Baal-Peratsim. » Les Philistins abandonnèrent leurs idoles, que les hommes de David emportèrent et brûlèrent. Les Chroniques racontent la même histoire, et Ésaïe la rappelle comme signe du jugement soudain de Dieu : « l’Éternel se lèvera comme à la montagne de Peratsim »."
    - "Le site est inconnu. Il devait dominer la vallée des Rephaïm, et les propositions sont des hauteurs du bord sud-ouest de Jérusalem, comme Ez-Zuhur, la crête d’Abu Tor, la colline de Guilo et Mar Elias sur la route de Bethléem ; aucune n’a livré rien qui la nomme. Le terrain est aujourd’hui couvert par les quartiers sud de Jérusalem."
  it:
    - "Baal-Perazim, «il signore dell’irruzione», è il luogo dove Davide sconfisse per la prima volta i Filistei dopo essere diventato re su tutto Israele. I Filistei «giunsero e si sparsero nella valle dei Refaim», a sud-ovest di Gerusalemme, e Davide, avendo consultato il Signore, li attaccò: «Davide dunque si portò a Baal-Peratsim, dove li sconfisse, e disse: L’Eterno ha disperso i miei nemici dinanzi a me come si disperge l’acqua. Perciò pose nome a quel luogo: Baal-Peratsim». I Filistei lasciarono lì i loro idoli, e gli uomini di Davide li portarono via e li bruciarono. Le Cronache raccontano la stessa storia, e Isaia la ricorda come segno del giudizio improvviso di Dio: «l’Eterno si leverà come al monte Peratsim»."
    - "Il sito non è noto. Doveva dominare la valle dei Refaim, e le proposte sono alture sul margine sud-occidentale di Gerusalemme, come Ez-Zuhur, la cresta di Abu Tor, la collina di Gilo e Mar Elias sulla strada di Betlemme; nessuna ha prodotto nulla che la nomini. Il terreno è oggi coperto dai quartieri meridionali di Gerusalemme."
  pl:
    - "Baal-Perasim, „pan przełomu”, to miejsce, gdzie Dawid po raz pierwszy pokonał Filistynów po tym, jak został królem całego Izraela. Filistynowie „przyciągnąwszy, rozpostarli się w dolinie Refaim”, na południowy zachód od Jerozolimy, a Dawid, zapytawszy Pana, zaatakował ich: „A tak przyciągnął Dawid do Baal Perazym, i poraził je tam Dawid i rzekł: Rozerwał Pan nieprzyjacioły moje przedemną, jako się rozrywają wody. Przetoż nazwał imię miejsca onego Baal Perazym”. Filistynowie zostawili swe bożki, a ludzie Dawida zabrali je i spalili. Księga Kronik opowiada tę samą historię, a Izajasz przywołuje ją jako znak nagłego sądu Bożego: „Pan powstanie jako na górze Perazym”."
    - "Miejsce nie jest znane. Musiało wznosić się nad doliną Refaim, a propozycje to wzniesienia na południowo-zachodnim skraju Jerozolimy, takie jak Ez-Zuhur, grzbiet Abu Tor, wzgórze Gilo i Mar Elias na drodze do Betlejem; żadne nie dało nic, co nazywałoby je po imieniu. Teren pokrywają dziś południowe dzielnice Jerozolimy."
  nl:
    - "Baäl-Perazim, “de heer van de doorbraak”, is de plaats waar David voor het eerst de Filistijnen versloeg nadat hij koning over heel Israël was geworden. De Filistijnen “kwamen en verspreidden zich in het dal Refaim”, ten zuidwesten van Jeruzalem, en David, na de HEER te hebben gevraagd, viel hen aan: “Toen kwam David te Baal-Perazim; en David sloeg hen aldaar, en zeide: De HEERE heeft mijn vijanden voor mijn aangezicht gescheurd, als een scheur der wateren; daarom noemde hij den naam derzelve plaats, Baal-Perazim.” De Filistijnen lieten hun afgodsbeelden achter, en Davids mannen namen ze mee en verbrandden ze. Kronieken vertelt hetzelfde verhaal, en Jesaja herinnert eraan als teken van Gods plotselinge oordeel: “de HEERE zal Zich opmaken, gelijk op den berg Perazim”."
    - "De plaats is niet bekend. Zij moet het dal van Refaim hebben overzien, en de voorstellen zijn hoogten aan de zuidwestrand van Jeruzalem, zoals Ez-Zuhur, de bergrug van Abu Tor, de heuvel van Gilo en Mar Elias aan de weg naar Bethlehem; geen heeft iets opgeleverd dat haar noemt. Het terrein is nu bedekt door de zuidelijke wijken van Jeruzalem."
  cs:
    - "Báal-perasim, „pán prolomení“, je místo, kde David poprvé porazil Pelištejce poté, co se stal králem nad celým Izraelem. Pelištejci „přitáhše, položili se v údolí Refaim“, jihozápadně od Jeruzaléma, a David, když se otázal Hospodina, zaútočil na ně: „I přitáhl David do Balperazim, a porazil je tam, a řekl: Protrhlť jest Hospodin nepřátely mé přede mnou, jako vody protrhují břehy. Protož nazval jméno místa toho Balperazim.“ Pelištejci tam zanechali své modly a Davidovi muži je odnesli a spálili. Letopisy vyprávějí týž příběh a Izajáš jej připomíná jako znamení Božího náhlého soudu: „jako na hoře Perazim povstane Hospodin“."
    - "Místo není známo. Muselo mít výhled na údolí Refaim a navržené jsou výšiny na jihozápadním okraji Jeruzaléma, jako Ez-Zuhur, hřeben Abu Tor, pahorek Gilo a Mar Elias na silnici do Betléma; žádná z nich nevydala nic, co by ji jmenovalo. Země je dnes pokryta jižními čtvrtěmi Jeruzaléma."
