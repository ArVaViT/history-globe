# Overview article (ADR 0007). Mainstream facts only; a wilderness station known only by name: the app's guesses are named as guesses.
id: libnah-wilderness
place: a3e94bd
title:
  en: "Libnah (wilderness station)"
  ru: "Ливна (стан в пустыне)"
  uk: "Лівна (стоянка в пустелі)"
  es: "Libna (estación del desierto)"
  pt: "Libna (estação no deserto)"
  de: "Libna (Station in der Wüste)"
  fr: "Libna (étape du désert)"
  it: "Libna (tappa nel deserto)"
  pl: "Libna (stacja na pustyni)"
  nl: "Libna (pleisterplaats in de woestijn)"
  cs: "Libna (stanice na poušti)"
  sv: "Livna (station i öknen)"
body:
  en:
    - "This Libnah is one of the camps of Israel in the wilderness, named only in the list of stations in Numbers 33: “And they departed from Rimmon-parez, and pitched in Libnah. And they removed from Libnah, and pitched at Rissah.” It belongs to a run of seventeen stations between Hazeroth and Ezion-gaber, most of which appear nowhere else, and the text tells nothing that happened there. The name means “white”, perhaps from the colour of the ground or from white poplars. It has nothing to do with Libnah the city of the Shephelah, which Joshua took and which later revolted against Judah."
    - "Nothing fixes its place, and even the order of the route through these stations is a matter of reconstruction. The map gives two guesses: a point along Wadi el-Beidha, “the white wadi”, in the eastern Sinai, chosen for the echo of the meaning; and the Laban of Deuteronomy 1:1, one of the places named at the opening of Moses’ speeches, which some take to be the same station under another form of the name. Neither can be tested: a camp of tents left nothing to dig."
  ru:
    - "Эта Ливна — один из станов Израиля в пустыне, известный только по перечню в 33-й главе Чисел: «И отправились из Римнон-Фареца и расположились станом в Ливне. И отправились из Ливны и расположились станом в Риссе». Она входит в ряд из семнадцати станов между Асирофом и Ецион-Гавером, большая часть которых больше нигде не встречается, и текст не сообщает ничего, что случилось там. Имя значит «белая» — может быть, по цвету земли или по белым тополям. Она не имеет отношения к Ливне, городу Шефелы, который взял Иисус Навин и который позже отложился от Иудеи."
    - "Ничто не указывает её места, и даже порядок пути через эти станы восстанавливается лишь предположительно. На карте даны две догадки: точка вдоль Вади-эль-Бейда, «белой долины», на востоке Синая, выбранная из-за созвучия смысла, и Лаван из начала Второзакония, одно из мест, где Моисей говорил свои речи, — некоторые считают его тем же станом под иной формой имени. Проверить ни ту, ни другую нельзя: стан из шатров не оставил ничего для раскопок."
  uk:
    - "Ця Лівна — один із таборів Ізраїлю в пустелі, названий лише в переліку стоянок у Книзі Чисел, розділ 33: «І рушили з Риммон-Переза та й отаборились у Либнї. І рушили з Либни та отаборились у Риссї.» Вона належить до низки із сімнадцяти стоянок між Хацеротом і Ецйон-Гевером, більшість яких більше ніде не з’являється, а текст не розповідає про жодну подію там. Назва означає «біла», можливо, від кольору ґрунту чи від білих тополь. Вона не має нічого спільного з Лівною, містом Шефели, яке взяв Ісус Навин і яке пізніше повстало проти Юди."
    - "Ніщо не визначає її місця, і навіть порядок маршруту через ці стоянки — справа реконструкції. Мапа дає два припущення: точку вздовж ваді ель-Бейда, «білої ваді», на сході Синаю, обрану за відлуння значення; і Лавана з Повторення Закону 1:1, одного з місць, названих на початку промов Мойсея, який дехто вважає тією самою стоянкою в іншій формі назви. Жодне з них не можна перевірити: табір із наметів не залишив нічого для розкопок."
  es:
    - "Esta Libna es uno de los campamentos de Israel en el desierto, nombrado solo en la lista de estaciones de Números 33: «Y partidos de Rimmón-peres, asentaron en Libna. Y partidos de Libna, asentaron en Rissa». Pertenece a una serie de diecisiete estaciones entre Haserot y Ezión-geber, la mayoría de las cuales no aparecen en ningún otro lugar, y el texto no cuenta nada de lo ocurrido allí. El nombre significa «blanco», quizá por el color del suelo o por los álamos blancos. No tiene nada que ver con Libna, la ciudad de la Sefelá, que tomó Josué y que más tarde se rebeló contra Judá."
    - "Nada fija su lugar, y hasta el orden de la ruta a través de estas estaciones es cuestión de reconstrucción. El mapa da dos conjeturas: un punto a lo largo del Wadi el-Beidha, «el uadi blanco», en el Sinaí oriental, elegido por el eco del significado; y el Labán de Deuteronomio 1:1, uno de los lugares nombrados al comienzo de los discursos de Moisés, que algunos toman por la misma estación bajo otra forma del nombre. Ninguna puede comprobarse: un campamento de tiendas no dejó nada que excavar."
  pt:
    - "Esta Libna é um dos acampamentos de Israel no deserto, citado apenas na lista de etapas de Números 33: “Partiram de Rimom-Perez e acamparam em Libna. Partiram de Libna e acamparam em Rissa.” Pertence a uma sequência de dezessete etapas entre Hazerote e Eziom-Geber, a maioria das quais não aparece em nenhum outro lugar, e o texto nada conta do que ali aconteceu. O nome significa “branca”, talvez pela cor do solo ou pelos choupos brancos. Nada tem a ver com Libna, a cidade da Sefelá, que Josué tomou e que mais tarde se revoltou contra Judá."
    - "Nada fixa o seu lugar, e até a ordem do percurso por essas etapas é questão de reconstrução. O mapa dá dois palpites: um ponto ao longo do Wadi el-Beidha, “o uádi branco”, no leste do Sinai, escolhido pelo eco do significado; e o Labã de Deuteronômio 1:1, um dos lugares nomeados na abertura dos discursos de Moisés, que alguns tomam pela mesma etapa sob outra forma do nome. Nenhum dos dois pode ser testado: um acampamento de tendas nada deixou para escavar."
  de:
    - "Dieses Libna ist eines der Lager Israels in der Wüste, nur in der Stationenliste von 4. Mose 33 genannt: „Von Rimmon-Perez zogen sie aus und lagerten sich in Libna. Von Libna zogen sie aus und lagerten sich in Rissa.“ Es gehört zu einer Reihe von siebzehn Stationen zwischen Hazerot und Ezjon-Geber, von denen die meisten sonst nirgends vorkommen, und der Text erzählt nichts von dem, was dort geschah. Der Name bedeutet „weiß“, vielleicht von der Farbe des Bodens oder von Weißpappeln. Mit Libna, der Stadt der Schefela, die Josua einnahm und die später von Juda abfiel, hat er nichts zu tun."
    - "Nichts legt seinen Ort fest, und selbst die Reihenfolge der Route durch diese Stationen ist eine Frage der Rekonstruktion. Die Karte gibt zwei Vermutungen an: einen Punkt am Wadi el-Beidha, „dem weißen Wadi“, im östlichen Sinai, gewählt wegen des Anklangs an die Bedeutung; und das Laban von 5. Mose 1,1, einen der Orte, die am Beginn der Reden des Mose genannt werden und die manche für dieselbe Station unter anderer Namensform halten. Keines von beiden lässt sich prüfen: Ein Zeltlager hinterließ nichts zum Ausgraben."
  fr:
    - "Cette Libna est l’un des campements d’Israël dans le désert, nommé seulement dans la liste des étapes de Nombres 33 : « Ils partirent de Rimmon-Pérets, et campèrent à Libna. Ils partirent de Libna, et campèrent à Rissa. » Elle appartient à une série de dix-sept étapes entre Hatséroth et Étsjon-Guéber, dont la plupart n’apparaissent nulle part ailleurs, et le texte ne dit rien de ce qui s’y passa. Le nom signifie « blanc », peut-être à cause de la couleur du sol ou de peupliers blancs. Elle n’a rien à voir avec Libna, la ville de la Shéphéla, que Josué prit et qui se révolta plus tard contre Juda."
    - "Rien ne fixe sa place, et même l’ordre de l’itinéraire à travers ces étapes relève de la reconstruction. La carte donne deux hypothèses : un point le long de l’oued el-Beidha, « l’oued blanc », dans l’est du Sinaï, choisi pour l’écho du sens ; et le Laban de Deutéronome 1:1, l’un des lieux nommés à l’ouverture des discours de Moïse, que certains tiennent pour la même étape sous une autre forme du nom. Aucune ne peut être vérifiée : un camp de tentes n’a rien laissé à fouiller."
  it:
    - "Questa Libna è uno degli accampamenti d’Israele nel deserto, nominato solo nell’elenco delle tappe di Numeri 33: «Partirono da Rimmon-Perets e si accamparono a Libna. Partirono da Libna e si accamparono a Rissa». Appartiene a una serie di diciassette tappe tra Cazerot ed Ezion-Gheber, la maggior parte delle quali non compare altrove, e il testo non dice nulla di ciò che vi accadde. Il nome significa «bianco», forse dal colore del suolo o dai pioppi bianchi. Non ha nulla a che vedere con Libna, la città della Sefela, che Giosuè prese e che più tardi si ribellò a Giuda."
    - "Nulla ne fissa il luogo, e persino l’ordine del percorso attraverso queste tappe è una questione di ricostruzione. La mappa propone due ipotesi: un punto lungo il Wadi el-Beidha, «il wadi bianco», nel Sinai orientale, scelto per l’eco del significato; e il Laban di Deuteronomio 1,1, uno dei luoghi nominati all’inizio dei discorsi di Mosè, che alcuni ritengono la stessa tappa sotto un’altra forma del nome. Nessuna delle due può essere verificata: un accampamento di tende non lasciò nulla da scavare."
  pl:
    - "Ta Libna to jeden z obozów Izraela na pustyni, wymieniony tylko na liście stacji w Lb 33: „A ruszywszy się z Remmon Fares, położyli się obozem w Lebna. A ruszywszy się z Lebna, położyli się obozem w Ressa.” Należy do ciągu siedemnastu stacji między Chasserot a Esjon-Geber, z których większość nie pojawia się nigdzie indziej, a tekst nie mówi nic o tym, co się tam wydarzyło. Nazwa znaczy „biała”, być może od koloru ziemi albo od białych topól. Nie ma nic wspólnego z Libną, miastem Szefeli, które zdobył Jozue i które później zbuntowało się przeciw Judzie."
    - "Nic nie wskazuje jej miejsca, a nawet kolejność szlaku przez te stacje jest sprawą rekonstrukcji. Mapa podaje dwa domysły: punkt wzdłuż Wadi el-Beidha, „białego wadi”, we wschodnim Synaju, wybrany ze względu na echo znaczenia; i Laban z Pwt 1,1, jedno z miejsc wymienionych na początku przemów Mojżesza, które niektórzy uważają za tę samą stację pod inną formą nazwy. Żadnego z nich nie można sprawdzić: obóz namiotów nie zostawił nic do wykopania."
  nl:
    - "Deze Libna is een van de legerplaatsen van Israël in de woestijn, alleen genoemd in de lijst van pleisterplaatsen in Numeri 33: “En zij verreisden van Rimmon-Perez, en legerden zich in Libna. En zij verreisden van Libna, en legerden zich in Rissa.” Het behoort tot een reeks van zeventien pleisterplaatsen tussen Hazerot en Ezeon-Geber, waarvan de meeste nergens anders voorkomen, en de tekst vertelt niets van wat er gebeurde. De naam betekent “wit”, misschien naar de kleur van de grond of naar witte populieren. Het heeft niets te maken met Libna, de stad in de Sefela, die Jozua innam en die later tegen Juda in opstand kwam."
    - "Niets legt de ligging vast, en zelfs de volgorde van de route langs deze pleisterplaatsen is een kwestie van reconstructie. De kaart geeft twee gissingen: een punt langs de Wadi el-Beidha, “de witte wadi”, in het oostelijke Sinaï, gekozen vanwege de echo van de betekenis; en het Laban van Deuteronomium 1:1, een van de plaatsen genoemd aan het begin van Mozes' toespraken, dat sommigen voor dezelfde pleisterplaats onder een andere vorm van de naam houden. Geen van beide laat zich toetsen: een tentenkamp liet niets na om op te graven."
  cs:
    - "Tato Libna je jedním z táborů Izraele na poušti, jmenovaným jen v seznamu stanic v Numeri 33: „A hnuvše se z Remmon Fáres, položili se v Lebna. A hnuvše se z Lebna, položili se v Ressa.“ Patří k řadě sedmnácti stanic mezi Chacerótem a Ecjon-geberem, z nichž většina se nikde jinde neobjevuje, a text nic neříká o tom, co se tam stalo. Jméno znamená „bílá“, snad podle barvy půdy nebo podle bílých topolů. S Libnou, městem Šefely, které Jozue dobyl a které se později vzbouřilo proti Judovi, nemá nic společného."
    - "Nic neurčuje její místo a dokonce i pořadí cesty těmito stanicemi je věcí rekonstrukce. Mapa uvádí dva dohady: bod na Wadi el-Beidha, „bílém wádí“, ve východním Sinaji, zvolený pro ozvěnu významu; a Laban z Deuteronomia 1,1, jedno z míst jmenovaných na začátku Mojžíšových řečí, které někteří pokládají za touž stanici v jiném tvaru jména. Ani jeden nelze ověřit: tábor ze stanů nezanechal nic k vykopání."
  sv:
    - "Detta Livna är ett av Israels läger i öknen, nämnt endast i förteckningen över stationer i Fjärde Mosebok 33: ”Och de bröto upp från Rimmon-Peres och lägrade sig i Libna. Och de bröto upp från Libna och lägrade sig i Rissa.” Det hör till en följd av sjutton stationer mellan Haserot och Esjon-Geber, av vilka de flesta inte förekommer någon annanstans, och texten berättar inget som hände där. Namnet betyder ”vit”, kanske efter markens färg eller efter vita popplar. Det har inget att göra med Livna, staden i Shefela, som Josua intog och som senare gjorde uppror mot Juda."
    - "Ingenting fastställer dess läge, och till och med ordningen på färdvägen genom dessa stationer är en fråga om rekonstruktion. Kartan ger två gissningar: en punkt längs Wadi el-Beidha, ”den vita wadin”, i östra Sinai, vald för ekot av betydelsen; och Laban i Femte Mosebok 1:1, en av de platser som nämns i inledningen till Moses tal, som vissa håller för samma station under en annan namnform. Ingen av dem kan prövas: ett tältläger lämnade inget att gräva fram."
