# Overview article (ADR 0007). Mainstream facts only; a wilderness station known only by name: the app's guesses are named as guesses.
id: libnah-wilderness
place: a3e94bd
title:
  en: "Libnah (wilderness station)"
  ru: "Ливна (стан в пустыне)"
  uk: "Лівна (стоянка в пустелі)"
  es: "Libna (estación del desierto)"
  pt: "Libna (estação no deserto)"
