body:
  en:
    - "This Libnah is one of the camps of Israel in the wilderness, named only in the list of stations in Numbers 33: “And they departed from Rimmon-parez, and pitched in Libnah. And they removed from Libnah, and pitched at Rissah.” It belongs to a run of seventeen stations between Hazeroth and Ezion-gaber, most of which appear nowhere else, and the text tells nothing that happened there. The name means “white”, perhaps from the colour of the ground or from white poplars. It has nothing to do with Libnah the city of the Shephelah, which Joshua took and which later revolted against Judah."
    - "Nothing fixes its place, and even the order of the route through these stations is a matter of reconstruction. The map gives two guesses: a point along Wadi el-Beidha, “the white wadi”, in the eastern Sinai, chosen for the echo of the meaning; and the Laban of Deuteronomy 1:1, one of the places named at the opening of Moses’ speeches, which some take to be the same station under another form of the name. Neither can be tested: a camp of tents left nothing to dig."
    - "The early Christian lists add little. Eusebius' Onomasticon, in two entries missing from its Greek manuscript and supplied from Jerome's Latin, calls Lebona simply a station of the children of Israel in the desert and gives Lobon, the place beyond the Jordan where Moses read Deuteronomy, an entry of its own; it places neither. About AD 400 Jerome came back to the station in his letter to Fabiola on the forty-two stations of Israel, where Libnah is the seventeenth. He took the name as “bricks”, saying that those who rendered it “whiteness” were wrong, and read it as a picture of falling back, on the journey of this life, to the brick-making of Egypt."
    - "A rabbinic saying, which Rashi gives in the name of Rabbi Johanan, notes that no place called Tophel or Laban is found anywhere else in Scripture. It heard in Laban a hint at the manna, which was white, and at the people's complaint against it."
  ru:
    - "Эта Ливна — один из станов Израиля в пустыне, известный только по перечню в 33-й главе Чисел: «И отправились из Римнон-Фареца и расположились станом в Ливне. И отправились из Ливны и расположились станом в Риссе». Она входит в ряд из семнадцати станов между Асирофом и Ецион-Гавером, большая часть которых больше нигде не встречается, и текст не сообщает ничего, что случилось там. Имя значит «белая» — может быть, по цвету земли или по белым тополям. Она не имеет отношения к Ливне, городу Шефелы, который взял Иисус Навин и который позже отложился от Иудеи."
    - "Ничто не указывает её места, и даже порядок пути через эти станы восстанавливается лишь предположительно. На карте даны две догадки: точка вдоль Вади-эль-Бейда, «белой долины», на востоке Синая, выбранная из-за созвучия смысла, и Лаван из Второзакония 1:1, одно из мест, где Моисей говорил свои речи, — некоторые считают его тем же станом под иной формой имени. Проверить ни ту, ни другую нельзя: стан из шатров не оставил ничего для раскопок."
    - "Ранние христианские перечни добавляют немного. «Ономастикон» Евсевия в двух статьях, которых нет в греческой рукописи и которые восполнены из латинского перевода Иеронима, называет Левону просто станом сынов Израилевых в пустыне, а Лобону, месту за Иорданом, где Моисей читал Второзаконие, отводит отдельную статью; местоположения ни того, ни другого он не указывает. Около 400 года Иероним вернулся к этому стану в письме к Фабиоле о сорока двух станах Израиля, где Ливна — семнадцатый. Он понимал имя как «кирпичи», говоря, что те, кто переводил его как «белизна», ошибались, и видел в нём образ того, как на пути этой жизни мы снова скатываемся к кирпичной работе Египта."
    - "Раввинское изречение, которое Раши приводит от имени рабби Иоханана, отмечает, что места под названием Тофел или Лаван больше нигде в Писании нет. В имени Лаван слышали намёк на манну, которая была белой, и на ропот народа на неё."
  uk:
    - "Ця Лівна — один із таборів Ізраїлю в пустелі, названий лише в переліку стоянок у Книзі Чисел, розділ 33: «І рушили з Риммон-Переза та й отаборились у Либнї. І рушили з Либни та отаборились у Риссї.» Вона належить до низки із сімнадцяти стоянок між Хацеротом і Ецйон-Гевером, більшість яких більше ніде не з’являється, а текст не розповідає про жодну подію там. Назва означає «біла», можливо, від кольору ґрунту чи від білих тополь. Вона не має нічого спільного з Лівною, містом Шефели, яке взяв Ісус Навин і яке пізніше повстало проти Юди."
    - "Ніщо не визначає її місця, і навіть порядок маршруту через ці стоянки — справа реконструкції. Мапа дає два припущення: точку вздовж ваді ель-Бейда, «білої ваді», на сході Синаю, обрану за відлуння значення; і Лавана з Повторення Закону 1:1, одного з місць, названих на початку промов Мойсея, який дехто вважає тією самою стоянкою в іншій формі назви. Жодне з них не можна перевірити: табір із наметів не залишив нічого для розкопок."
    - "Ранні християнські переліки додають небагато. «Ономастикон» Євсевія у двох статтях, яких немає в грецькому рукописі і які доповнено з латинського перекладу Ієроніма, називає Левону просто стоянкою синів Ізраїлевих у пустелі, а місцю Лобон за Йорданом, де Мойсей читав Повторення Закону, присвячує окрему статтю; місця жодного з них він не вказує. Близько 400 року Ієронім повернувся до цієї стоянки в листі до Фабіоли про сорок дві стоянки Ізраїлю, де Лівна — сімнадцята. Він розумів назву як «цеглини», кажучи, що ті, хто перекладав її як «білизна», помилялися, і бачив у ній образ того, як на шляху цього життя ми знову скочуємося до цегляної праці Єгипту."
    - "Рабинський вислів, який Раші наводить від імені рабі Йоханана, зазначає, що місця з назвою Тофель чи Лаван більше ніде в Писанні немає. В імені Лаван чули натяк на манну, яка була білою, і на нарікання народу на неї."
  es:
    - "Esta Libna es uno de los campamentos de Israel en el desierto, nombrado solo en la lista de estaciones de Números 33: «Y partidos de Rimmón-peres, asentaron en Libna. Y partidos de Libna, asentaron en Rissa». Pertenece a una serie de diecisiete estaciones entre Haserot y Ezión-geber, la mayoría de las cuales no aparecen en ningún otro lugar, y el texto no cuenta nada de lo ocurrido allí. El nombre significa «blanco», quizá por el color del suelo o por los álamos blancos. No tiene nada que ver con Libna, la ciudad de la Sefelá, que tomó Josué y que más tarde se rebeló contra Judá."
    - "Nada fija su lugar, y hasta el orden de la ruta a través de estas estaciones es cuestión de reconstrucción. El mapa da dos conjeturas: un punto a lo largo del Wadi el-Beidha, «el uadi blanco», en el Sinaí oriental, elegido por el eco del significado; y el Labán de Deuteronomio 1:1, uno de los lugares nombrados al comienzo de los discursos de Moisés, que algunos toman por la misma estación bajo otra forma del nombre. Ninguna puede comprobarse: un campamento de tiendas no dejó nada que excavar."
    - "Las primeras listas cristianas añaden poco. El Onomasticon de Eusebio, en dos entradas que faltan en su manuscrito griego y se suplen con el latín de Jerónimo, llama a Lebona simplemente estación de los hijos de Israel en el desierto y da a Lobon, el lugar al otro lado del Jordán donde Moisés leyó el Deuteronomio, una entrada propia; no sitúa ninguno de los dos. Hacia el año 400 Jerónimo volvió a la estación en su carta a Fabiola sobre las cuarenta y dos estaciones de Israel, donde Libna es la decimoséptima. Entendió el nombre como «ladrillos», diciendo que se equivocaban quienes lo traducían «blancura», y lo leyó como imagen de cómo, en el camino de esta vida, recaemos en la obra de ladrillos de Egipto."
    - "Un dicho rabínico, que Rashi transmite en nombre de rabí Johanán, observa que ningún lugar llamado Thopel o Labán aparece en ninguna otra parte de la Escritura. Oía en Labán una alusión al maná, que era blanco, y a la queja del pueblo contra él."
  pt:
    - "Esta Libna é um dos acampamentos de Israel no deserto, citado apenas na lista de etapas de Números 33: “Partiram de Rimom-Perez e acamparam em Libna. Partiram de Libna e acamparam em Rissa.” Pertence a uma sequência de dezessete etapas entre Hazerote e Eziom-Geber, a maioria das quais não aparece em nenhum outro lugar, e o texto nada conta do que ali aconteceu. O nome significa “branca”, talvez pela cor do solo ou pelos choupos brancos. Nada tem a ver com Libna, a cidade da Sefelá, que Josué tomou e que mais tarde se revoltou contra Judá."
    - "Nada fixa o seu lugar, e até a ordem do percurso por essas etapas é questão de reconstrução. O mapa dá dois palpites: um ponto ao longo do Wadi el-Beidha, “o uádi branco”, no leste do Sinai, escolhido pelo eco do significado; e o Labã de Deuteronômio 1:1, um dos lugares nomeados na abertura dos discursos de Moisés, que alguns tomam pela mesma etapa sob outra forma do nome. Nenhum dos dois pode ser testado: um acampamento de tendas nada deixou para escavar."
    - "As primeiras listas cristãs pouco acrescentam. O Onomasticon de Eusébio, em duas entradas que faltam no seu manuscrito grego e são supridas pelo latim de Jerônimo, chama Lebona simplesmente de etapa dos filhos de Israel no deserto e dá a Lobon, o lugar além do Jordão onde Moisés leu o Deuteronômio, uma entrada própria; não localiza nenhum dos dois. Por volta do ano 400, Jerônimo voltou à etapa na sua carta a Fabíola sobre as quarenta e duas etapas de Israel, onde Libna é a décima sétima. Entendeu o nome como “tijolos”, dizendo que erravam os que o traduziam por “brancura”, e leu-o como imagem de como, no caminho desta vida, recaímos no trabalho dos tijolos do Egito."
    - "Um dito rabínico, que Rashi transmite em nome do rabino Johanan, observa que nenhum lugar chamado Tofel ou Labã aparece em nenhuma outra parte da Escritura. Ouvia em Labã uma alusão ao maná, que era branco, e à queixa do povo contra ele."
  de:
    - "Dieses Libna ist eines der Lager Israels in der Wüste, nur in der Stationenliste von 4. Mose 33 genannt: „Von Rimmon-Perez zogen sie aus und lagerten sich in Libna. Von Libna zogen sie aus und lagerten sich in Rissa.“ Es gehört zu einer Reihe von siebzehn Stationen zwischen Hazerot und Ezjon-Geber, von denen die meisten sonst nirgends vorkommen, und der Text erzählt nichts von dem, was dort geschah. Der Name bedeutet „weiß“, vielleicht von der Farbe des Bodens oder von Weißpappeln. Mit Libna, der Stadt der Schefela, die Josua einnahm und die später von Juda abfiel, hat er nichts zu tun."
    - "Nichts legt seinen Ort fest, und selbst die Reihenfolge der Route durch diese Stationen ist eine Frage der Rekonstruktion. Die Karte gibt zwei Vermutungen an: einen Punkt am Wadi el-Beidha, „dem weißen Wadi“, im östlichen Sinai, gewählt wegen des Anklangs an die Bedeutung; und das Laban von 5. Mose 1,1, einen der Orte, die am Beginn der Reden des Mose genannt werden und die manche für dieselbe Station unter anderer Namensform halten. Keines von beiden lässt sich prüfen: Ein Zeltlager hinterließ nichts zum Ausgraben."
    - "Die frühen christlichen Ortslisten fügen wenig hinzu. Das Onomastikon des Eusebius nennt in zwei Einträgen, die in seiner griechischen Handschrift fehlen und aus dem Latein des Hieronymus ergänzt sind, Lebona schlicht eine Station der Kinder Israel in der Wüste und gibt Lobon, dem Ort jenseits des Jordans, wo Mose das Deuteronomium las, einen eigenen Eintrag; keinen von beiden verortet es. Um 400 kam Hieronymus in seinem Brief an Fabiola über die zweiundvierzig Stationen Israels auf die Station zurück; dort ist Libna die siebzehnte. Er verstand den Namen als „Ziegel“, sagte, wer ihn mit „Weiße“ übersetze, irre, und las ihn als Bild dafür, wie wir auf dem Weg dieses Lebens zur Ziegelarbeit Ägyptens zurückfallen."
    - "Ein rabbinischer Ausspruch, den Raschi im Namen Rabbi Jochanans anführt, stellt fest, dass ein Ort namens Tophel oder Laban sonst nirgends in der Schrift vorkommt. Er hörte in Laban eine Anspielung auf das Manna, das weiß war, und auf das Murren des Volkes darüber."
  fr:
    - "Cette Libna est l’un des campements d’Israël dans le désert, nommé seulement dans la liste des étapes de Nombres 33 : « Ils partirent de Rimmon-Pérets, et campèrent à Libna. Ils partirent de Libna, et campèrent à Rissa. » Elle appartient à une série de dix-sept étapes entre Hatséroth et Étsjon-Guéber, dont la plupart n’apparaissent nulle part ailleurs, et le texte ne dit rien de ce qui s’y passa. Le nom signifie « blanc », peut-être à cause de la couleur du sol ou de peupliers blancs. Elle n’a rien à voir avec Libna, la ville de la Shéphéla, que Josué prit et qui se révolta plus tard contre Juda."
    - "Rien ne fixe sa place, et même l’ordre de l’itinéraire à travers ces étapes relève de la reconstruction. La carte donne deux hypothèses : un point le long de l’oued el-Beidha, « l’oued blanc », dans l’est du Sinaï, choisi pour l’écho du sens ; et le Laban de Deutéronome 1:1, l’un des lieux nommés à l’ouverture des discours de Moïse, que certains tiennent pour la même étape sous une autre forme du nom. Aucune ne peut être vérifiée : un camp de tentes n’a rien laissé à fouiller."
    - "Les premières listes chrétiennes ajoutent peu. L’Onomasticon d’Eusèbe, dans deux notices absentes de son manuscrit grec et suppléées par le latin de Jérôme, appelle Lebona simplement une étape des enfants d’Israël dans le désert et donne à Lobon, le lieu au-delà du Jourdain où Moïse lut le Deutéronome, une notice propre ; il ne situe ni l’un ni l’autre. Vers 400, Jérôme revint à l’étape dans sa lettre à Fabiola sur les quarante-deux étapes d’Israël, où Libna est la dix-septième. Il comprenait le nom comme « briques », disant que ceux qui le rendaient par « blancheur » se trompaient, et y lisait l’image de nos rechutes, sur le chemin de cette vie, dans le travail des briques de l’Égypte."
    - "Un dit rabbinique, que Rachi rapporte au nom de rabbi Yohanan, relève qu’aucun lieu appelé Tophel ou Laban ne se trouve ailleurs dans l’Écriture. Il entendait dans Laban une allusion à la manne, qui était blanche, et à la plainte du peuple contre elle."
  it:
    - "Questa Libna è uno degli accampamenti d’Israele nel deserto, nominato solo nell’elenco delle tappe di Numeri 33: «Partirono da Rimmon-Perets e si accamparono a Libna. Partirono da Libna e si accamparono a Rissa». Appartiene a una serie di diciassette tappe tra Cazerot ed Ezion-Gheber, la maggior parte delle quali non compare altrove, e il testo non dice nulla di ciò che vi accadde. Il nome significa «bianco», forse dal colore del suolo o dai pioppi bianchi. Non ha nulla a che vedere con Libna, la città della Sefela, che Giosuè prese e che più tardi si ribellò a Giuda."
    - "Nulla ne fissa il luogo, e persino l’ordine del percorso attraverso queste tappe è una questione di ricostruzione. La mappa propone due ipotesi: un punto lungo il Wadi el-Beidha, «il wadi bianco», nel Sinai orientale, scelto per l’eco del significato; e il Laban di Deuteronomio 1,1, uno dei luoghi nominati all’inizio dei discorsi di Mosè, che alcuni ritengono la stessa tappa sotto un’altra forma del nome. Nessuna delle due può essere verificata: un accampamento di tende non lasciò nulla da scavare."
    - "I primi elenchi cristiani aggiungono poco. L’Onomasticon di Eusebio, in due voci che mancano nel suo manoscritto greco e sono supplite dal latino di Girolamo, chiama Lebona semplicemente una tappa dei figli d’Israele nel deserto e dà a Lobon, il luogo oltre il Giordano dove Mosè lesse il Deuteronomio, una voce propria; non colloca né l’una né l’altro. Verso il 400 Girolamo tornò sulla tappa nella sua lettera a Fabiola sulle quarantadue tappe d’Israele, dove Libna è la diciassettesima. Intese il nome come «mattoni», dicendo che sbagliava chi lo rendeva con «candore», e vi lesse l’immagine di come, nel cammino di questa vita, ricadiamo nel lavoro dei mattoni d’Egitto."
    - "Un detto rabbinico, che Rashi riporta a nome di rabbi Yochanan, nota che nessun luogo chiamato Tofel o Laban si trova altrove nella Scrittura. Udiva in Laban un’allusione alla manna, che era bianca, e alla mormorazione del popolo contro di essa."
  pl:
    - "Ta Libna to jeden z obozów Izraela na pustyni, wymieniony tylko na liście stacji w Lb 33: „A ruszywszy się z Remmon Fares, położyli się obozem w Lebna. A ruszywszy się z Lebna, położyli się obozem w Ressa.” Należy do ciągu siedemnastu stacji między Chasserot a Esjon-Geber, z których większość nie pojawia się nigdzie indziej, a tekst nie mówi nic o tym, co się tam wydarzyło. Nazwa znaczy „biała”, być może od koloru ziemi albo od białych topól. Nie ma nic wspólnego z Libną, miastem Szefeli, które zdobył Jozue i które później zbuntowało się przeciw Judzie."
    - "Nic nie wskazuje jej miejsca, a nawet kolejność szlaku przez te stacje jest sprawą rekonstrukcji. Mapa podaje dwa domysły: punkt wzdłuż Wadi el-Beidha, „białego wadi”, we wschodnim Synaju, wybrany ze względu na echo znaczenia; i Laban z Pwt 1,1, jedno z miejsc wymienionych na początku przemów Mojżesza, które niektórzy uważają za tę samą stację pod inną formą nazwy. Żadnego z nich nie można sprawdzić: obóz namiotów nie zostawił nic do wykopania."
    - "Wczesne chrześcijańskie wykazy dodają niewiele. Onomastykon Euzebiusza w dwóch hasłach, których brak w jego greckim rękopisie i które uzupełniono z łacińskiego przekładu Hieronima, nazywa Lebonę po prostu stacją synów Izraela na pustyni, a Lobonowi, miejscu za Jordanem, gdzie Mojżesz czytał Księgę Powtórzonego Prawa, daje osobne hasło; żadnego z nich nie umiejscawia. Około 400 roku Hieronim wrócił do tej stacji w liście do Fabioli o czterdziestu dwóch stacjach Izraela, gdzie Libna jest siedemnasta. Rozumiał nazwę jako „cegły”, mówiąc, że mylili się ci, którzy oddawali ją jako „biel”, i czytał ją jako obraz tego, jak na drodze tego życia wracamy do wyrabiania cegieł w Egipcie."
    - "Rabiniczne powiedzenie, które Raszi przytacza w imieniu rabbiego Jochanana, zauważa, że miejsce zwane Tofel czy Laban nie występuje nigdzie indziej w Piśmie. Słyszało w Labanie aluzję do manny, która była biała, i do szemrania ludu przeciw niej."
  nl:
    - "Deze Libna is een van de legerplaatsen van Israël in de woestijn, alleen genoemd in de lijst van pleisterplaatsen in Numeri 33: “En zij verreisden van Rimmon-Perez, en legerden zich in Libna. En zij verreisden van Libna, en legerden zich in Rissa.” Het behoort tot een reeks van zeventien pleisterplaatsen tussen Hazerot en Ezeon-Geber, waarvan de meeste nergens anders voorkomen, en de tekst vertelt niets van wat er gebeurde. De naam betekent “wit”, misschien naar de kleur van de grond of naar witte populieren. Het heeft niets te maken met Libna, de stad in de Sefela, die Jozua innam en die later tegen Juda in opstand kwam."
    - "Niets legt de ligging vast, en zelfs de volgorde van de route langs deze pleisterplaatsen is een kwestie van reconstructie. De kaart geeft twee gissingen: een punt langs de Wadi el-Beidha, “de witte wadi”, in het oostelijke Sinaï, gekozen vanwege de echo van de betekenis; en het Laban van Deuteronomium 1:1, een van de plaatsen genoemd aan het begin van Mozes' toespraken, dat sommigen voor dezelfde pleisterplaats onder een andere vorm van de naam houden. Geen van beide laat zich toetsen: een tentenkamp liet niets na om op te graven."
    - "De vroege christelijke lijsten voegen weinig toe. Het Onomasticon van Eusebius noemt, in twee lemma's die in zijn Griekse handschrift ontbreken en uit het Latijn van Hiëronymus zijn aangevuld, Lebona eenvoudig een pleisterplaats van de kinderen Israëls in de woestijn en geeft Lobon, de plaats over de Jordaan waar Mozes Deuteronomium voorlas, een eigen lemma; geen van beide wordt gesitueerd. Rond 400 kwam Hiëronymus op de pleisterplaats terug in zijn brief aan Fabiola over de tweeënveertig pleisterplaatsen van Israël, waar Libna de zeventiende is. Hij vatte de naam op als “bakstenen”, zei dat wie hem met “witheid” vertaalde zich vergiste, en las hem als beeld van hoe wij op de weg van dit leven terugvallen in het tichelwerk van Egypte."
    - "Een rabbijnse uitspraak, die Rasji in de naam van rabbi Jochanan doorgeeft, merkt op dat een plaats Tofel of Laban nergens anders in de Schrift voorkomt. Zij hoorde in Laban een toespeling op het manna, dat wit was, en op de klacht van het volk ertegen."
  cs:
    - "Tato Libna je jedním z táborů Izraele na poušti, jmenovaným jen v seznamu stanic v Numeri 33: „A hnuvše se z Remmon Fáres, položili se v Lebna. A hnuvše se z Lebna, položili se v Ressa.“ Patří k řadě sedmnácti stanic mezi Chacerótem a Ecjon-geberem, z nichž většina se nikde jinde neobjevuje, a text nic neříká o tom, co se tam stalo. Jméno znamená „bílá“, snad podle barvy půdy nebo podle bílých topolů. S Libnou, městem Šefely, které Jozue dobyl a které se později vzbouřilo proti Judovi, nemá nic společného."
    - "Nic neurčuje její místo a dokonce i pořadí cesty těmito stanicemi je věcí rekonstrukce. Mapa uvádí dva dohady: bod na Wadi el-Beidha, „bílém wádí“, ve východním Sinaji, zvolený pro ozvěnu významu; a Laban z Deuteronomia 1,1, jedno z míst jmenovaných na začátku Mojžíšových řečí, které někteří pokládají za touž stanici v jiném tvaru jména. Ani jeden nelze ověřit: tábor ze stanů nezanechal nic k vykopání."
    - "Rané křesťanské seznamy přidávají málo. Eusebiovo Onomastikon ve dvou heslech, která v jeho řeckém rukopisu chybějí a jsou doplněna z Jeronýmovy latiny, nazývá Lebonu prostě stanicí synů Izraele na poušti a Lobonu, místu za Jordánem, kde Mojžíš četl Deuteronomium, dává heslo zvlášť; ani jedno nelokalizuje. Kolem roku 400 se Jeroným ke stanici vrátil v listu Fabiole o dvaačtyřiceti stanicích Izraele, kde je Libna sedmnáctá. Jméno chápal jako „cihly“, s tím, že ti, kdo je překládali jako „bělost“, se mýlili, a četl je jako obraz toho, jak na cestě tohoto života klesáme zpět k cihlářské práci Egypta."
    - "Rabínský výrok, který Raši uvádí jménem rabiho Jochanana, poznamenává, že místo zvané Tofel nebo Laban se nikde jinde v Písmu nevyskytuje. Slyšel ve jménu Laban narážku na manu, která byla bílá, a na reptání lidu proti ní."
  sv:
    - "Detta Livna är ett av Israels läger i öknen, nämnt endast i förteckningen över stationer i Fjärde Mosebok 33: ”Och de bröto upp från Rimmon-Peres och lägrade sig i Libna. Och de bröto upp från Libna och lägrade sig i Rissa.” Det hör till en följd av sjutton stationer mellan Haserot och Esjon-Geber, av vilka de flesta inte förekommer någon annanstans, och texten berättar inget som hände där. Namnet betyder ”vit”, kanske efter markens färg eller efter vita popplar. Det har inget att göra med Livna, staden i Shefela, som Josua intog och som senare gjorde uppror mot Juda."
    - "Ingenting fastställer dess läge, och till och med ordningen på färdvägen genom dessa stationer är en fråga om rekonstruktion. Kartan ger två gissningar: en punkt längs Wadi el-Beidha, ”den vita wadin”, i östra Sinai, vald för ekot av betydelsen; och Laban i Femte Mosebok 1:1, en av de platser som nämns i inledningen till Moses tal, som vissa håller för samma station under en annan namnform. Ingen av dem kan prövas: ett tältläger lämnade inget att gräva fram."
    - "De tidiga kristna ortförteckningarna tillför lite. Eusebios Onomastikon kallar, i två artiklar som saknas i dess grekiska handskrift och fyllts i från Hieronymus latin, Lebona helt enkelt en station för Israels barn i öknen och ger Lobon, platsen bortom Jordan där Mose läste upp Femte Mosebok, en egen artikel; ingen av dem placeras. Omkring år 400 återkom Hieronymus till stationen i sitt brev till Fabiola om Israels fyrtiotvå stationer, där Livna är den sjuttonde. Han förstod namnet som ”tegelstenar”, sade att de som återgav det med ”vithet” tog fel, och läste det som en bild av hur vi på detta livs väg faller tillbaka till Egyptens tegelarbete."
    - "Ett rabbinskt yttrande, som Rashi återger i rabbi Johanans namn, påpekar att ingen plats som heter Tofel eller Laban finns någon annanstans i Skriften. Det hörde i Laban en anspelning på mannat, som var vitt, och på folkets klagan över det."
  nb:
    - "Denne Libna er en av Israels leire i ørkenen, nevnt bare i listen over stasjoner i 4 Mos 33: «Og de drog fra Rimmon-Peres og leiret sig i Libna. Og de drog fra Libna og leiret sig i Rissa.» Den hører til en rekke på sytten stasjoner mellom Haserot og Esjon-Geber, de fleste av dem nevnt ingen andre steder, og teksten forteller ikke noe som hendte der. Navnet betyr «hvit», kanskje etter jordens farge eller etter hvite popler. Den har ingenting med Libna, byen i Sjefela, å gjøre, som Josva tok og som senere gjorde opprør mot Juda."
    - "Ingenting fastslår dens beliggenhet, og selv rekkefølgen på ruten gjennom disse stasjonene er et spørsmål om rekonstruksjon. Kartet gir to gjetninger: et punkt langs Wadi el-Beidha, «den hvite wadien», i det østlige Sinai, valgt på grunn av gjenklangen av betydningen; og Laban i 5 Mos 1,1, ett av stedene som nevnes i åpningen av Moses' taler, som noen regner for den samme stasjonen under en annen navneform. Ingen av dem kan prøves: en teltleir etterlot ingenting å grave i."
    - "De tidlige kristne stedslistene tilfører lite. Eusebius' Onomastikon kaller, i to artikler som mangler i det greske håndskriftet og er supplert fra Hieronymus' latin, Lebona ganske enkelt en stasjon for Israels barn i ørkenen og gir Lobon, stedet på den andre siden av Jordan der Moses leste opp Femte Mosebok, en egen artikkel; ingen av dem stedfestes. Omkring år 400 kom Hieronymus tilbake til stasjonen i sitt brev til Fabiola om Israels førtito stasjoner, der Libna er den syttende. Han forsto navnet som «teglsteiner», sa at de som gjenga det med «hvithet», tok feil, og leste det som et bilde på hvordan vi på dette livets vei faller tilbake til Egypts teglarbeid."
    - "Et rabbinsk utsagn, som Rashi gjengir i rabbi Johanans navn, påpeker at et sted ved navn Tofel eller Laban ikke nevnes noe annet sted i Skriften. Det hørte i Laban en hentydning til mannaen, som var hvit, og til folkets klage over den."
  tl:
    - "Ang Libna na ito ay isa sa mga kampo ng Israel sa ilang, na pinangalanan lamang sa talaan ng mga himpilan sa Mga Bilang 33: “At sila'y naglakbay mula sa Rimmon-peres, at humantong sa Libna. At sila'y naglakbay mula sa Libna, at humantong sa Rissa.” Bahagi ito ng hanay ng labimpitong himpilan sa pagitan ng Haseroth at Esion-geber, na karamihan ay hindi lumilitaw saanman, at walang sinasabi ang teksto tungkol sa nangyari roon. Ang pangalan ay nangangahulugang “puti”, marahil mula sa kulay ng lupa o sa mga puting popla. Wala itong kaugnayan sa Libna na lungsod ng Sephela, na sinakop ni Josue at kalaunan ay naghimagsik laban sa Juda."
    - "Walang nagtatakda ng lugar nito, at maging ang pagkakasunud-sunod ng ruta sa mga himpilang ito ay usapin ng muling pagbubuo. Nagbibigay ang mapa ng dalawang hula: isang punto sa Wadi el-Beidha, “ang puting wadi”, sa silangang Sinai, na pinili dahil sa alingawngaw ng kahulugan; at ang Laban ng Deuteronomio 1:1, isa sa mga lugar na pinangalanan sa pagbubukas ng mga pananalita ni Moises, na itinuturing ng ilan na iisang himpilan sa ibang anyo ng pangalan. Wala sa dalawa ang masusubok: walang iniwan ang kampo ng mga tolda na maaaring hukayin."
    - "Kaunti lamang ang idinaragdag ng mga sinaunang talaang Kristiyano. Sa dalawang lahok na wala sa manuskritong Griego nito at pinunan mula sa Latin ni Jeronimo, tinatawag ng Onomasticon ni Eusebio ang Lebona na isa lamang himpilan ng mga anak ni Israel sa ilang, at binibigyan ng sariling lahok ang Lobon, ang lugar sa kabila ng Jordan kung saan binasa ni Moises ang Deuteronomio; hindi nito tinutukoy ang kinaroroonan ng alinman. Noong mga taong 400, binalikan ni Jeronimo ang himpilan sa kanyang liham kay Fabiola tungkol sa apatnapu't dalawang himpilan ng Israel, kung saan ang Libna ang ikalabimpito. Inunawa niya ang pangalan bilang “mga laryo”, sinabing mali ang mga nagsalin dito bilang “kaputian”, at binasa ito bilang larawan ng pagbabalik natin, sa paglalakbay ng buhay na ito, sa paggawa ng laryo sa Ehipto."
    - "Isang kasabihang rabiniko, na ibinibigay ni Rashi sa pangalan ni Rabbi Johanan, ang pumapansin na walang lugar na tinatawag na Thopel o Laban na matatagpuan saanman pa sa Kasulatan. Narinig nito sa Laban ang pahiwatig sa mana, na puti, at sa reklamo ng bayan laban dito."
  da:
    - "Denne Libna er en af Israels lejre i ørkenen, kun nævnt i listen over stationer i Fjerde Mosebog 33: »Og de rejste fra Rimmon-Perez, og de lejrede sig i Libna. Og de rejste fra Libna, og de lejrede sig i Rissa.« Den hører til en række på sytten stationer mellem Haserot og Esjon-Geber, de fleste nævnt ingen andre steder, og teksten fortæller intet om, hvad der skete dér. Navnet betyder »hvid«, måske efter jordens farve eller efter hvide popler. Den har intet at gøre med Libna, byen i Sjefela, som Josva indtog, og som senere gjorde oprør mod Juda."
    - "Intet fastlægger dens sted, og selv rækkefølgen af ruten gennem disse stationer er et spørgsmål om rekonstruktion. Kortet giver to gæt: et punkt langs Wadi el-Beidha, »det hvide wadi«, i det østlige Sinai, valgt for betydningens efterklang; og Laban i Femte Mosebog 1,1, et af de steder, der er nævnt ved indledningen til Moses' taler, som nogle tager for den samme station under en anden form af navnet. Ingen af delene kan afprøves: en teltlejr efterlod intet at grave i."
    - "De tidlige kristne stedlister tilføjer kun lidt. Eusebios' Onomastikon kalder, i to artikler, der mangler i dets græske håndskrift og er suppleret fra Hieronymus' latin, Lebona blot en station for Israels børn i ørkenen og giver Lobon, stedet hinsides Jordan, hvor Moses læste Femte Mosebog op, en egen artikel; ingen af dem stedfæstes. Omkring år 400 vendte Hieronymus tilbage til stationen i sit brev til Fabiola om Israels toogfyrre stationer, hvor Libna er den syttende. Han forstod navnet som »teglsten«, sagde, at de, der gengav det med »hvidhed«, tog fejl, og læste det som et billede på, hvordan vi på dette livs vej falder tilbage til Egyptens teglarbejde."
    - "Et rabbinsk udsagn, som Rashi gengiver i rabbi Johanans navn, påpeger, at et sted ved navn Tofel eller Laban ikke nævnes andre steder i Skriften. Det hørte i Laban en hentydning til mannaen, som var hvid, og til folkets klage over den."
  sr:
    - "Ова Ливна је један од логора Израиља у пустињи, наведен само у списку станица у Књизи Бројева 33: „А из Ремнон-Фареса отишавши стадоше у логор у Лемвону. А из Лемвона отишавши стадоше у логор у Ресану.“ Припада низу од седамнаест станица између Асирота и Есион-Гавера, од којих се већина не јавља нигде другде, а текст не казује ништа што се тамо догодило. Име значи „бела“, можда по боји тла или по белим тополама. Нема везе са Ливном, градом у Сефели, који је узео Исус Навин и који се касније одметнуо од Јуде."
    - "Ништа не одређује њено место, па је чак и редослед пута кроз ове станице ствар реконструкције. Мапа даје две претпоставке: тачку дуж Вади ел-Беиде, „белог вадија“, у источном Синају, изабрану због одјека значења; и Лаван из Поновљеног закона 1,1, једно од места наведених на почетку Мојсијевих говора, који неки узимају за исту станицу под другим обликом имена. Ниједно се не може проверити: логор од шатора није оставио ништа за копање."
    - "Рани хришћански спискови додају мало. Јевсевијев Ономастикон, у две одреднице којих нема у његовом грчком рукопису и које су допуњене из Јеронимовог латинског превода, назива Левону просто станицом синова Израиљевих у пустињи, а Лобону, месту преко Јордана где је Мојсије читао Поновљени закон, даје засебну одредницу; ни једно ни друго не смешта. Око 400. године Јероним се вратио тој станици у писму Фабиоли о четрдесет две станице Израиља, где је Ливна седамнаеста. Име је схватао као „цигле“, говорећи да греше они који га преводе као „белина“, и читао га као слику тога како на путу овог живота поново падамо у прављење цигала у Египту."
    - "Рабинска изрека, коју Раши наводи у име рабина Јоханана, примећује да се место по имену Тофол или Лаван не помиње нигде другде у Писму. У имену Лаван чула је наговештај мане, која је била бела, и роптања народа против ње."
  hu:
    - "Ez a Libna Izráel egyik pusztai tábora, amelyet csak a Számok könyve 33. fejezetének állomásjegyzéke nevez meg: „És elindulának Rimmon-Péreczből, és tábort ütének Libnában. És elindulának Libnából, és tábort ütének Risszában.” A Hacérót és Ecjón-Géber közti tizenhét állomás sorába tartozik, amelyek többsége sehol másutt nem fordul elő, és a szöveg semmit sem mond arról, mi történt ott. A név „fehéret” jelent, talán a talaj színétől vagy a fehér nyárfáktól. Semmi köze a Sefélá városához, Libnához, amelyet Józsué elfoglalt, és amely később elpártolt Júdától."
    - "Helyét semmi sem rögzíti, és még az állomásokon át vezető útvonal sorrendje is rekonstrukció kérdése. A térkép két találgatást ad: egy pontot a keleti Sínai-félszigeten a Wadi el-Beidha, „a fehér vádi” mentén, a jelentés visszhangja miatt; és Mózes ötödik könyve 1,1 Lábánját, a beszédek kezdetén megnevezett helyek egyikét, amelyet egyesek ugyanazon állomásnak tartanak a név másik alakjában. Egyik sem ellenőrizhető: a sátortábor nem hagyott semmit, amit ki lehetne ásni."
    - "A korai keresztény helyjegyzékek keveset tesznek hozzá. Eusebius Onomasztikonja két szócikkben, amelyek görög kéziratából hiányoznak, és Hieronymus latinjából pótolták őket, Lebonát egyszerűen Izráel fiai pusztai állomásának nevezi, Lobonnak pedig, a Jordánon túli helynek, ahol Mózes az ötödik könyvét felolvasta, külön szócikket ad; egyiket sem helyezi el. 400 körül Hieronymus Fabiolához írt levelében Izráel negyvenkét állomásáról visszatért erre az állomásra; Libna ott a tizenhetedik. A nevet „téglák” értelemben vette, mondván, hogy tévednek, akik „fehérségnek” fordították, és képet látott benne arról, hogyan esünk vissza ennek az életnek az útján Egyiptom téglavetéséhez."
    - "Egy rabbinikus mondás, amelyet Rási Johanan rabbi nevében idéz, megjegyzi, hogy Tófel vagy Lábán nevű hely sehol másutt nem fordul elő az Írásban. A Lábán névben célzást hallott a mannára, amely fehér volt, és a nép zúgolódására ellene."
  fi:
    - "Tämä Libna on yksi Israelin erämaan leiripaikoista, mainittu vain 4. Moos. 33:n asemaluettelossa: ”Ja he lähtivät Rimmon-Pereksestä ja leiriytyivät Libnaan. Ja he lähtivät Libnasta ja leiriytyivät Rissaan.” Se kuuluu seitsemäntoista aseman jaksoon Haserotin ja Esjon-Geberin välillä, joista useimmat eivät esiinny missään muualla, eikä teksti kerro, mitä siellä tapahtui. Nimi merkitsee ”valkoista”, ehkä maan värin tai valkopoppelien mukaan. Sillä ei ole mitään tekemistä Sefelan Libna-kaupungin kanssa, jonka Joosua valloitti ja joka myöhemmin kapinoi Juudaa vastaan."
    - "Mikään ei määritä sen paikkaa, ja jopa reitin järjestys näiden asemien kautta on rekonstruktion asia. Kartta antaa kaksi arvausta: kohdan Wadi el-Beidhan, ”valkoisen wadin”, varrella Itä-Siinailla, joka on valittu merkityksen kaiun vuoksi; ja 5. Moos. 1:1:n Laban, yksi Mooseksen puheiden alussa nimetyistä paikoista, jonka jotkut katsovat samaksi asemaksi nimen toisessa muodossa. Kumpaakaan ei voi testata: telttaleiri ei jättänyt mitään kaivettavaa."
    - "Varhaiset kristilliset paikkaluettelot lisäävät vähän. Eusebioksen Onomastikon kutsuu kahdessa hakusanassa, jotka puuttuvat sen kreikkalaisesta käsikirjoituksesta ja on täydennetty Hieronymuksen latinasta, Lebonaa yksinkertaisesti Israelin lasten asemaksi erämaassa ja antaa Lobonille, Jordanin takaiselle paikalle, jossa Mooses luki Viidennen Mooseksen kirjan, oman hakusanan; kumpaakaan se ei sijoita. Noin vuonna 400 Hieronymus palasi asemaan Fabiolalle kirjoittamassaan kirjeessä Israelin neljästäkymmenestäkahdesta asemasta, joissa Libna on seitsemästoista. Hän ymmärsi nimen tarkoittavan ”tiiliä”, sanoi niiden erehtyvän, jotka käänsivät sen ”valkeudeksi”, ja luki sen kuvaksi siitä, miten tämän elämän tiellä lankeamme takaisin Egyptin tiilentekoon."
    - "Rabbiininen sanonta, jonka Rashi esittää rabbi Johananin nimissä, huomauttaa, ettei Toofel- tai Laban-nimistä paikkaa mainita missään muualla Raamatussa. Nimessä Laban kuultiin viittaus mannaan, joka oli valkoista, ja kansan nurinaan sitä vastaan."
  vi:
    - "Líp-na này là một nơi đóng trại của Y-sơ-ra-ên trong đồng vắng, chỉ được nêu trong danh sách các chặng ở Dân số ký 33: “Đi từ Ri-môn-Phê-rết và đóng trại tại Líp-na. Đi từ Líp-na và đóng trại tại Ri-sa”. Nó thuộc một dãy mười bảy chặng giữa Hát-sê-rốt và Ê-xi-ôn-Ghê-be, phần lớn không xuất hiện ở đâu khác, và văn bản không nói điều gì đã xảy ra ở đó. Tên có nghĩa “trắng”, có lẽ từ màu đất hoặc từ cây dương trắng. Nó không liên quan gì đến Líp-na, thành của Sê-phê-la, mà Giô-suê đã chiếm và về sau nổi dậy chống Giu-đa."
    - "Không gì xác định vị trí, và ngay cả thứ tự lộ trình qua các chặng này cũng là vấn đề của sự dựng lại. Bản đồ đưa ra hai phỏng đoán: một điểm dọc Wadi el-Beidha, “wadi trắng”, ở đông Si-na-i, được chọn vì âm vang của nghĩa; và La-ban ở Phục truyền 1:1, một trong những nơi được nêu ở phần mở đầu các bài giảng của Môi-se, mà một số người cho là cùng một chặng dưới dạng tên khác. Không điều nào kiểm chứng được: một trại lều không để lại gì để đào."
    - "Các danh sách Kitô giáo thời đầu thêm được ít. Onomasticon của Eusebius, trong hai mục bị thiếu trong bản chép tay tiếng Hy Lạp và được bổ sung từ bản Latinh của Jerome, gọi Lebona đơn giản là một chặng của con cái Y-sơ-ra-ên trong đồng vắng và dành cho Lobon, nơi bên kia sông Giô-đanh mà Môi-se đã đọc sách Phục truyền, một mục riêng; sách không định vị nơi nào. Khoảng năm 400, Jerome trở lại chặng này trong thư gửi Fabiola về bốn mươi hai chặng của Y-sơ-ra-ên, nơi Líp-na là chặng thứ mười bảy. Ông hiểu tên ấy là “gạch”, nói rằng những ai dịch là “sự trắng” đã sai, và đọc nó như hình ảnh về việc trên đường đời này chúng ta lại sa về công việc làm gạch ở Ai Cập."
    - "Một câu nói của các ra-bi, được Rashi thuật lại nhân danh ra-bi Johanan, ghi nhận rằng không nơi nào khác trong Kinh Thánh có địa danh tên là Tô-phên hay La-ban. Câu ấy nghe trong tên La-ban một ám chỉ về ma-na, vốn có màu trắng, và về lời phàn nàn của dân chống lại nó."
  ro:
    - "Această Libna este una dintre taberele lui Israel din pustie, numită doar în lista popasurilor din Numeri 33: „Și au purces din Remmon Fares, și au tăbărît în Levonà. Și au purces din Levonà, și au tăbărît în Resan.” Face parte dintr-un șir de șaptesprezece popasuri între Hațerot și Ețion-Gheber, dintre care cele mai multe nu apar nicăieri altundeva, iar textul nu spune nimic despre ce s-a întâmplat acolo. Numele înseamnă „alb”, poate de la culoarea pământului sau de la plopii albi. Nu are nimic de-a face cu Libna, cetatea din Șefela, pe care a luat-o Iosua și care s-a răzvrătit mai târziu împotriva lui Iuda."
    - "Nimic nu-i fixează locul, iar chiar ordinea traseului prin aceste popasuri ține de reconstituire. Harta dă două presupuneri: un punct de-a lungul Wadi el-Beidha, „wadiul alb”, în estul Sinaiului, ales pentru ecoul sensului; și Laban din Deuteronom 1:1, unul dintre locurile numite la începutul cuvântărilor lui Moise, pe care unii îl socot același popas sub altă formă a numelui. Niciuna nu poate fi verificată: o tabără de corturi nu a lăsat nimic de săpat."
    - "Primele liste creștine adaugă puțin. Onomasticonul lui Eusebiu, în două articole care lipsesc din manuscrisul său grecesc și sunt completate din latina lui Ieronim, numește Lebona pur și simplu un popas al fiilor lui Israel în pustie și îi dă lui Lobon, locul de dincolo de Iordan unde Moise a citit Deuteronomul, un articol propriu; nu-l localizează pe niciunul. Pe la anul 400, Ieronim a revenit la acest popas în scrisoarea către Fabiola despre cele patruzeci și două de popasuri ale lui Israel, unde Libna este al șaptesprezecelea. El a înțeles numele ca „cărămizi”, spunând că greșesc cei care îl redau prin „albeață”, și l-a citit ca imagine a felului în care, pe drumul acestei vieți, recădem în lucrul cărămizilor din Egipt."
    - "O zicală rabinică, pe care Rashi o redă în numele rabinului Iohanan, observă că un loc numit Tofol sau Laban nu apare nicăieri altundeva în Scriptură. Auzea în Laban o aluzie la mană, care era albă, și la cârteala poporului împotriva ei."
  bg:
    - "Тази Ливна е един от становете на Израил в пустинята, назован само в списъка на стоянките в Числа 33: „И като се дигнаха от Римон-фарес разположиха стан в Ливна. И като се дигнаха от Ливна разположиха стан в Риса.“ Тя е част от поредица от седемнадесет стоянки между Асирот и Ецион-Гавер, повечето от които не се появяват никъде другаде, и текстът не разказва нищо, което да се е случило там. Името означава „бяла“, може би заради цвета на почвата или заради белите тополи. То няма нищо общо с Ливна, града в Шефела, който Иисус Навин превзе и който по-късно въстана срещу Юда."
    - "Нищо не установява мястото ѝ и дори редът на маршрута през тези стоянки е въпрос на реконструкция. Картата дава две догадки: точка по Уади ел-Бейда, „бялото уади“, в източен Синай, избрана заради отзвука на значението; и Лаван от Второзаконие 1:1, едно от местата, назовани в началото на речите на Мойсей, което някои смятат за същата стоянка под друга форма на името. Нито едната не може да бъде проверена: стан от шатри не е оставил нищо за разкопаване."
    - "Ранните християнски списъци добавят малко. „Ономастикон“ на Евсевий в две статии, които липсват в гръцкия му ръкопис и са допълнени от латинския превод на Йероним, нарича Левона просто стоянка на синовете Израилеви в пустинята, а на Лобон, мястото отвъд Йордан, където Мойсей прочел Второзаконие, дава отделна статия; не посочва мястото на нито едно от двете. Около 400 г. Йероним се връща към тази стоянка в писмото си до Фабиола за четиридесет и двете стоянки на Израил, където Ливна е седемнадесетата. Той разбира името като „тухли“, казва, че грешат онези, които го превеждат като „белота“, и го чете като образ на това как по пътя на този живот отново изпадаме в правенето на тухли в Египет."
    - "Едно равинско изречение, което Раши предава от името на равин Йоханан, отбелязва, че място на име Тофол или Лаван не се среща никъде другаде в Писанието. В името Лаван то чува намек за манната, която била бяла, и за роптането на народа срещу нея."
