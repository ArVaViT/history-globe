# Overview article (ADR 0007). Mainstream facts only; the site of Mount Sinai, and so of the wilderness, is given as disputed; the traditional identification is named as tradition.
id: wilderness-of-sinai
place: ae50cf1
title:
  en: "Wilderness of Sinai"
  ru: "Пустыня Синайская"
  uk: "Пустеля Синайська"
  es: "Desierto de Sinaí"
  pt: "Deserto do Sinai"
  de: "Wüste Sinai"
  fr: "Désert du Sinaï"
body:
  en:
    - "The Wilderness of Sinai is the desert about the mount of the Law, where Israel “camped before the mount”. Exodus dates the arrival to the third month after leaving Egypt, and Numbers the departure to the twentieth day of the second month of the second year: nearly a year in one camp. Where it lay depends on where Mount Sinai was. Since the fourth century tradition has placed the mountain at Jebel Musa in the granite south of the Sinai peninsula, with the plain of er-Raha at its foot large enough for a great camp; others have argued for Jebel Serbal above the oasis of Feiran, for hills in the north of the peninsula, or for Jebel al-Lawz in north-western Arabia. None of these is proved, and the question is open."
    - "Here the Lord came down “in fire”, so that the mountain smoked “as the smoke of a furnace”, and spoke the ten commandments; here Israel made the golden calf, and here the tabernacle was built and raised. Leviticus closes its laws of offerings with the note that the Lord gave them “in the wilderness of Sinai”, where Nadab and Abihu died “when they offered strange fire”. In the wilderness of Sinai Moses took the first census of the people, numbered the Levites and kept the second Passover, “on the fourteenth day of the first month at even”. Then the cloud lifted, Israel “took their journeys out of the wilderness of Sinai; and the cloud rested in the wilderness of Paran”; of all those numbered here only Caleb and Joshua lived to enter the land."
    - "Elijah fled to Horeb, and Paul speaks of “mount Sinai in Arabia”. Pilgrims came to Jebel Musa by the fourth century: Egeria, about 383, climbed the mountain and was shown the places of the story by the monks living there, and the emperor Justinian built the fortified monastery at its foot, which later took the name of St Catherine; Tischendorf found the Codex Sinaiticus in its library in 1844 and 1859."
    - "The wilderness is the South Sinai governorate of Egypt. The monastery, its area a UNESCO site since 2002, is served by the Jebeliya Bedouin and the town of Saint Catherine; pilgrims climb Jebel Musa, 2,285 m, by night to see the sunrise; and the resort of Sharm el-Sheikh lies on the coast to the south."
  ru:
    - "Пустыня Синайская — пустыня вокруг горы Закона, где «расположился там Израиль станом против горы». Исход относит приход сюда к третьему месяцу по выходе из Египта, а книга Чисел — уход к двадцатому дню второго месяца второго года: почти год на одной стоянке. Где она лежала, зависит от того, где была гора Синай. С IV века предание помещает гору на Джебель-Муса в гранитном юге Синайского полуострова, с равниной эр-Раха у подножия, достаточной для большого стана; другие доказывали, что это Джебель-Сербал над оазисом Фейран, холмы на севере полуострова или Джебель-эль-Лауз на северо-западе Аравии. Ни одно из этих мест не доказано, и вопрос открыт."
    - "Здесь Господь сошёл на гору «в огне», так что от неё восходил дым, «как дым из печи», и изрёк десять заповедей; здесь Израиль сделал золотого тельца, здесь была построена и поставлена скиния. Книга Левит заключает законы о жертвах заметкой, что Господь дал их «в пустыне Синайской», где умерли Надав и Авиуд, «когда они принесли огонь чуждый». В пустыне Синайской Моисей провёл первое исчисление народа, исчислил левитов и совершил вторую Пасху, «в первый месяц, в четырнадцатый день месяца вечером». Затем облако поднялось, сыны Израилевы отправились «из пустыни Синайской, и остановилось облако в пустыне Фаран»; из всех исчисленных здесь дожили до входа в землю только Халев и Иисус Навин."
    - "Илия бежал к Хориву, а Павел пишет, что Агарь «означает гору Синай в Аравии». Паломники приходили к Джебель-Муса уже в IV веке: Эгерия около 383 года поднялась на гору, и жившие там монахи показали ей места рассказа, а император Юстиниан построил у подножия укреплённый монастырь, позже получивший имя святой Екатерины; в его библиотеке Тишендорф нашёл Синайский кодекс в 1844 и 1859 годах."
    - "Пустыня эта — провинция Южный Синай в Египте. Монастырь, окрестности которого с 2002 года в списке ЮНЕСКО, обслуживают бедуины джебелия и городок Святой Екатерины; паломники поднимаются на Джебель-Муса, 2285 м, ночью, чтобы встретить восход; а курорт Шарм-эш-Шейх лежит на побережье южнее."
  uk:
    - "Пустеля Синайська — пустеля навколо гори Закону, де Ізраїль отаборився перед горою. Книга Виходу датує прихід третім місяцем після виходу з Єгипту, а Числа — відхід двадцятим днем другого місяця другого року: майже рік в одному таборі. Де вона лежала, залежить від того, де була гора Синай. Від IV століття традиція ставить гору в Джебель-Мусі в гранітному півдні Синайського півострова, з рівниною ер-Раха при її підніжжі, досить великою для великого табору; інші відстоювали Джебель-Сербаль над оазою Фейран, пагорби на півночі півострова або Джебель-ель-Лавз на північному заході Аравії. Жодне з цих місць не доведене, і питання відкрите."
    - "Тут Господь зійшов «в поломнї», так що гора димувала «як дим із горна», і промовив десять заповідей; тут Ізраїль зробив золотого тельця, і тут збудували й поставили скинію. Левит закінчує закони про жертви приміткою, що Господь дав їх «в степу Синай», де Надав і Авіуд померли, «як приносили чужий огонь перед Господом в Синайському степу». У Синайській пустелі Мойсей провів перший перепис народу, перелічив левитів і справив другу Пасху «на чотирнайцятий день первого місяця, між двома вечорами». Потім хмара піднялася, Ізраїль вирушив: «сини Ізрайлеві рушили чергою у Синайському степу; і спустилась хмара в Паран-степу»; з усіх тут перелічених лише Калеб та Ісус Навин дожили до входу в землю."
    - "Ілля втік на Хорив, а Павло говорить про «Синай, гора в Аравиї». Прочани приходили до Джебель-Муси вже в IV столітті: Егерія близько 383 року піднялася на гору, і ченці, що там жили, показали їй місця розповіді, а імператор Юстиніан збудував біля її підніжжя укріплений монастир, що згодом дістав назву св. Катерини; Тішендорф знайшов у його бібліотеці Синайський кодекс 1844 і 1859 років."
    - "Пустеля — це єгипетська провінція Південний Синай. Монастир, територія якого з 2002 року є об’єктом ЮНЕСКО, обслуговують бедуїни джебелія й містечко Сент-Кетрін; прочани піднімаються на Джебель-Мусу, 2285 м, уночі, щоб зустріти схід сонця; а курорт Шарм-еш-Шейх лежить на узбережжі на півдні."
  es:
    - "El Desierto de Sinaí es el desierto en torno al monte de la Ley, donde Israel «acampó allí … delante del monte». Éxodo fecha la llegada en el mes tercero tras salir de Egipto, y Números la partida el día veinte del segundo mes del segundo año: casi un año en un mismo campamento. Dónde estaba depende de dónde estuviera el monte Sinaí. Desde el siglo IV la tradición ha situado la montaña en el Jebel Musa, en el granito del sur de la península del Sinaí, con la llanura de er-Raha a su pie, lo bastante grande para un gran campamento; otros han defendido el Jebel Serbal, sobre el oasis de Feiran, colinas del norte de la península, o el Jebel al-Lawz, en el noroeste de Arabia. Ninguno está demostrado, y la cuestión está abierta."
    - "Aquí el Señor descendió «en fuego», de modo que el monte humeaba, y «el humo de él subía como el humo de un horno», y pronunció los diez mandamientos; aquí Israel hizo el becerro de oro, y aquí se construyó y se levantó el tabernáculo. Levítico cierra sus leyes de ofrendas con la nota de que el Señor las intimó cuando mandó que ofrecieran sus ofrendas «en el desierto de Sinaí», donde Nadab y Abiú murieron «cuando ofrecieron fuego extraño». En el desierto de Sinaí Moisés hizo el primer censo del pueblo, contó a los levitas y celebró la segunda Pascua, «á los catorce días del mes, entre las dos tardes». Luego se alzó la nube, y los hijos de Israel «movieron … por sus partidas del desierto de Sinaí; y paró la nube en el desierto de Parán»; de todos los aquí contados solo Caleb y Josué vivieron para entrar en la tierra."
    - "Elías huyó a Horeb, y Pablo habla del Sinaí como «un monte de Arabia». Los peregrinos llegaban al Jebel Musa en el siglo IV: Egeria, hacia 383, subió a la montaña y los monjes que vivían allí le mostraron los lugares del relato, y el emperador Justiniano construyó a su pie el monasterio fortificado que más tarde tomó el nombre de Santa Catalina; Tischendorf halló el Códice Sinaítico en su biblioteca en 1844 y 1859."
    - "El desierto es la gobernación del Sinaí Meridional, en Egipto. Al monasterio, cuya zona es sitio de la UNESCO desde 2002, lo atienden los beduinos jebeliya y la ciudad de Santa Catalina; los peregrinos suben de noche al Jebel Musa, de 2285 m, para ver el amanecer; y el centro turístico de Sharm el-Sheikh se encuentra en la costa, al sur."
  pt:
    - "O Deserto do Sinai é o deserto em torno do monte da Lei, onde Israel “acampou diante do monte”. Êxodo data a chegada ao terceiro mês depois da saída do Egito, e Números a partida ao vigésimo dia do segundo mês do segundo ano: quase um ano num só acampamento. Onde ficava depende de onde estava o monte Sinai. Desde o século IV a tradição o situa no Jebel Musa, no granito do sul da península do Sinai, com a planície de er-Raha ao pé, grande o bastante para um grande acampamento; outros defenderam o Jebel Serbal, acima do oásis de Feiran, colinas no norte da península ou o Jebel al-Lawz, no noroeste da Arábia. Nenhum está provado, e a questão está aberta."
    - "Aqui o Senhor desceu “em fogo”, de modo que o monte fumegava “como a fumaça de uma fornalha”, e falou os dez mandamentos; aqui Israel fez o bezerro de ouro, e aqui o tabernáculo foi construído e erguido. Levítico fecha suas leis de ofertas com a nota de que o Senhor as deu “no deserto de Sinai”, onde Nadabe e Abiú morreram “quando ofereceram fogo estranho”. No deserto do Sinai, Moisés fez o primeiro recenseamento do povo, contou os levitas e celebrou a segunda Páscoa, “no primeiro mês, no décimo quarto dia do mês, ao entardecer”. Então a nuvem se ergueu, e Israel “partiu em suas jornadas saindo do deserto do Sinai; e a nuvem pousou no deserto de Parã”; de todos os ali contados, só Calebe e Josué viveram para entrar na terra."
    - "Elias fugiu para o Horebe, e Paulo fala do “monte Sinai, na Arábia”. Peregrinos chegavam ao Jebel Musa já no século IV: Egéria, por volta de 383, subiu o monte e os monges que viviam ali lhe mostraram os lugares da história, e o imperador Justiniano construiu o mosteiro fortificado ao seu pé, que depois tomou o nome de Santa Catarina; Tischendorf achou o Códice Sinaítico em sua biblioteca em 1844 e 1859."
    - "O deserto é a província do Sinai do Sul, no Egito. O mosteiro, cuja área é sítio da UNESCO desde 2002, é servido pelos beduínos jebeliya e pela cidade de Santa Catarina; os peregrinos sobem o Jebel Musa, de 2.285 m, de noite, para ver o nascer do sol; e o balneário de Sharm el-Sheikh fica na costa, ao sul."
  de:
    - "Die Wüste Sinai ist die Wüste um den Berg des Gesetzes, wo Israel sich „gegenüber dem Berge“ lagerte. Das Buch Exodus datiert die Ankunft in den dritten Monat nach dem Auszug aus Ägypten, das Buch Numeri den Aufbruch auf den zwanzigsten Tag des zweiten Monats des zweiten Jahres: fast ein Jahr in einem Lager. Wo sie lag, hängt davon ab, wo der Berg Sinai war. Seit dem vierten Jahrhundert verortet die Überlieferung den Berg am Jebel Musa im Granit des Südens der Sinai-Halbinsel, mit der Ebene er-Raha an seinem Fuß, groß genug für ein großes Lager; andere haben für den Jebel Serbal über der Oase Feiran, für Hügel im Norden der Halbinsel oder für den Jebel al-Lawz im Nordwesten Arabiens argumentiert. Nichts davon ist bewiesen, und die Frage ist offen."
    - "Hier „fuhr“ der HERR herab auf den Berg „mit Feuer“, sodass der Berg rauchte, „und sein Rauch ging auf wie ein Rauch vom Ofen“, und sprach die zehn Gebote; hier machte Israel das goldene Kalb, und hier wurde die Stiftshütte gebaut und aufgerichtet. Das Buch Levitikus schließt seine Opfergesetze mit dem Vermerk, der Herr habe sie gegeben, „zu opfern ihre Opfer dem HERRN in der Wüste Sinai“, wo Nadab und Abihu starben, „da sie fremdes Feuer opferten vor dem HERRN in der Wüste Sinai“. In der Wüste Sinai hielt Mose die erste Zählung des Volkes, zählte die Leviten und feierte das zweite Passah „am vierzehnten Tage des ersten Monats gegen Abend“. Dann hob sich die Wolke, und Israel „brachen auf und zogen aus der Wüste Sinai, und die Wolke blieb in der Wüste Pharan“; von allen hier Gezählten erlebten nur Kaleb und Josua den Einzug ins Land."
    - "Elia floh zum Horeb, und Paulus schreibt: „Hagar heißt in Arabien der Berg Sinai“. Schon im vierten Jahrhundert kamen Pilger zum Jebel Musa: Egeria bestieg den Berg um 383 und bekam von den dort lebenden Mönchen die Orte der Geschichte gezeigt, und Kaiser Justinian baute das befestigte Kloster an seinem Fuß, das später den Namen Katharinenkloster erhielt; Tischendorf fand in seiner Bibliothek 1844 und 1859 den Codex Sinaiticus."
    - "Die Wüste ist das ägyptische Gouvernement Süd-Sinai. Das Kloster, seit 2002 UNESCO-Stätte, wird von den Jebeliya-Beduinen und der Stadt Sankt Katharina versorgt; Pilger besteigen den Jebel Musa, 2285 m, nachts, um den Sonnenaufgang zu sehen; und der Badeort Scharm el-Scheich liegt an der Küste im Süden."
  fr:
    - "Le Désert du Sinaï est le désert autour de la montagne de la Loi, où Israël « campa là, vis-à-vis de la montagne ». L’Exode date l’arrivée du troisième mois après la sortie d’Égypte, et les Nombres le départ du vingtième jour du deuxième mois de la deuxième année : presque un an dans un seul camp. Son emplacement dépend de celui du mont Sinaï. Depuis le IVe siècle, la tradition place la montagne au Jebel Musa, dans le granite du sud de la péninsule du Sinaï, avec à son pied la plaine d’er-Raha assez vaste pour un grand camp ; d’autres ont plaidé pour le Jebel Serbal au-dessus de l’oasis de Feiran, pour des collines du nord de la péninsule, ou pour le Jebel al-Lawz dans le nord-ouest de l’Arabie. Aucun n’est prouvé, et la question reste ouverte."
    - "Ici l’Éternel descendit « au milieu du feu », si bien que la montagne fumait « comme la fumée d’une fournaise », et prononça les dix commandements ; ici Israël fit le veau d’or, et ici le tabernacle fut construit et dressé. Le Lévitique clôt ses lois sur les offrandes en notant que l’Éternel les donna « dans le désert du Sinaï », où Nadab et Abihu moururent « lorsqu’ils apportèrent devant l’Éternel du feu étranger ». Dans le désert de Sinaï, Moïse fit le premier dénombrement du peuple, compta les lévites et célébra la seconde Pâque, « le quatorzième jour du premier mois, entre les deux soirs ». Puis la nuée s’éleva, les enfants d’Israël « partirent du désert de Sinaï, selon l’ordre fixé pour leur marche. La nuée s’arrêta dans le désert de Paran » ; de tous ceux qui furent dénombrés ici, seuls Caleb et Josué vécurent pour entrer dans le pays."
    - "Élie s’enfuit à Horeb, et Paul parle du « mont Sinaï en Arabie ». Des pèlerins vinrent au Jebel Musa dès le IVe siècle : Égérie, vers 383, gravit la montagne et se fit montrer les lieux du récit par les moines qui y vivaient, et l’empereur Justinien bâtit à son pied le monastère fortifié qui prit plus tard le nom de Sainte-Catherine ; Tischendorf trouva dans sa bibliothèque le Codex Sinaiticus en 1844 et en 1859."
    - "Le désert est le gouvernorat du Sinaï du Sud, en Égypte. Le monastère, dont la zone est un site de l’UNESCO depuis 2002, est desservi par les Bédouins Jebeliya et la ville de Sainte-Catherine ; les pèlerins gravissent de nuit le Jebel Musa, 2 285 m, pour voir le lever du soleil ; et la station balnéaire de Charm el-Cheikh se trouve sur la côte au sud."
