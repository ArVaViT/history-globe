body:
  en:
    - "The Wilderness of Sinai is the desert about the mount of the Law, where Israel “camped before the mount”. Exodus dates the arrival to the third month after leaving Egypt, and Numbers the departure to the twentieth day of the second month of the second year: nearly a year in one camp. Where it lay depends on where Mount Sinai was. Since the fourth century tradition has placed the mountain at Jebel Musa in the granite south of the Sinai peninsula, with the plain of er-Raha at its foot large enough for a great camp; others have argued for Jebel Serbal above the oasis of Feiran, for hills in the north of the peninsula, or for Jebel al-Lawz in north-western Arabia. None of these is proved, and the question is open."
    - "Here the Lord came down “in fire”, so that the mountain smoked “as the smoke of a furnace”, and spoke the ten commandments; here Israel made the golden calf, and here the tabernacle was built and raised. Leviticus closes its laws of offerings with the note that the Lord gave them “in the wilderness of Sinai”, where Nadab and Abihu died “when they offered strange fire”. In the wilderness of Sinai Moses took the first census of the people, numbered the Levites and kept the second Passover, “on the fourteenth day of the first month at even”. Then the cloud lifted, Israel “took their journeys out of the wilderness of Sinai; and the cloud rested in the wilderness of Paran”; of all those numbered here only Caleb and Joshua lived to enter the land."
    - "Elijah fled to Horeb, and Paul speaks of “mount Sinai in Arabia”. Pilgrims came to Jebel Musa by the fourth century: Egeria, about 383, climbed the mountain and was shown the places of the story by the monks living there, and the emperor Justinian built the fortified monastery at its foot, which later took the name of St Catherine; Tischendorf found the Codex Sinaiticus in its library in 1844 and 1859."
    - "The traditional wilderness lies in the South Sinai governorate of Egypt. The monastery, its area a UNESCO site since 2002, is served by the Jebeliya Bedouin and the town of Saint Catherine; pilgrims climb Jebel Musa, 2,285 m, by night to see the sunrise; and the resort of Sharm el-Sheikh lies on the coast to the south."
  ru:
    - "Пустыня Синайская — пустыня вокруг горы Закона, где «расположился там Израиль станом против горы». Исход относит приход сюда к третьему месяцу по выходе из Египта, а книга Чисел — уход к двадцатому дню второго месяца второго года: почти год на одной стоянке. Где она лежала, зависит от того, где была гора Синай. С IV века предание помещает гору на Джебель-Муса в гранитном юге Синайского полуострова, с равниной эр-Раха у подножия, достаточной для большого стана; другие доказывали, что это Джебель-Сербал над оазисом Фейран, холмы на севере полуострова или Джебель-эль-Лауз на северо-западе Аравии. Ни одно из этих мест не доказано, и вопрос открыт."
    - "Здесь Господь сошёл на гору «в огне», так что от неё восходил дым, «как дым из печи», и изрёк десять заповедей; здесь Израиль сделал золотого тельца, здесь была построена и поставлена скиния. Книга Левит заключает законы о жертвах заметкой, что Господь дал их «в пустыне Синайской», где умерли Надав и Авиуд, «когда они принесли огонь чуждый». В пустыне Синайской Моисей провёл первое исчисление народа, исчислил левитов и совершил вторую Пасху, «в первый месяц, в четырнадцатый день месяца вечером». Затем облако поднялось, сыны Израилевы отправились «из пустыни Синайской, и остановилось облако в пустыне Фаран»; из всех исчисленных здесь дожили до входа в землю только Халев и Иисус Навин."
    - "Илия бежал к Хориву, а Павел пишет, что Агарь «означает гору Синай в Аравии». Паломники приходили к Джебель-Муса уже в IV веке: Эгерия около 383 года поднялась на гору, и жившие там монахи показали ей места рассказа, а император Юстиниан построил у подножия укреплённый монастырь, позже получивший имя святой Екатерины; в его библиотеке Тишендорф нашёл Синайский кодекс в 1844 и 1859 годах."
    - "Пустыня, как её традиционно понимают, лежит в провинции Южный Синай в Египте. Монастырь, окрестности которого с 2002 года в списке ЮНЕСКО, обслуживают бедуины джебелия и городок Святой Екатерины; паломники поднимаются на Джебель-Муса, 2285 м, ночью, чтобы встретить восход; а курорт Шарм-эш-Шейх лежит на побережье южнее."
  uk:
    - "Пустеля Синайська — пустеля навколо гори Закону, де Ізраїль отаборився перед горою. Книга Виходу датує прихід третім місяцем після виходу з Єгипту, а Числа — відхід двадцятим днем другого місяця другого року: майже рік в одному таборі. Де вона лежала, залежить від того, де була гора Синай. Від IV століття традиція ставить гору в Джебель-Мусі в гранітному півдні Синайського півострова, з рівниною ер-Раха при її підніжжі, досить великою для великого табору; інші відстоювали Джебель-Сербаль над оазою Фейран, пагорби на півночі півострова або Джебель-ель-Лавз на північному заході Аравії. Жодне з цих місць не доведене, і питання відкрите."
    - "Тут Господь зійшов «в поломнї», так що гора димувала «як дим із горна», і промовив десять заповідей; тут Ізраїль зробив золотого тельця, і тут збудували й поставили скинію. Левит закінчує закони про жертви приміткою, що Господь дав їх «в степу Синай», де Надав і Авіуд померли, «як приносили чужий огонь перед Господом в Синайському степу». У Синайській пустелі Мойсей провів перший перепис народу, перелічив левитів і справив другу Пасху «на чотирнайцятий день первого місяця, між двома вечорами». Потім хмара піднялася, Ізраїль вирушив: «сини Ізрайлеві рушили чергою у Синайському степу; і спустилась хмара в Паран-степу»; з усіх тут перелічених лише Калеб та Ісус Навин дожили до входу в землю."
    - "Ілля втік на Хорив, а Павло говорить про «Синай, гора в Аравиї». Прочани приходили до Джебель-Муси вже в IV столітті: Егерія близько 383 року піднялася на гору, і ченці, що там жили, показали їй місця розповіді, а імператор Юстиніан збудував біля її підніжжя укріплений монастир, що згодом дістав назву св. Катерини; Тішендорф знайшов у його бібліотеці Синайський кодекс 1844 і 1859 років."
    - "Пустеля, як її традиційно визначають, лежить у єгипетській провінції Південний Синай. Монастир, територія якого з 2002 року є об’єктом ЮНЕСКО, обслуговують бедуїни джебелія й містечко Сент-Кетрін; прочани піднімаються на Джебель-Мусу, 2285 м, уночі, щоб зустріти схід сонця; а курорт Шарм-еш-Шейх лежить на узбережжі на півдні."
  es:
    - "El Desierto de Sinaí es el desierto en torno al monte de la Ley, donde Israel «acampó allí … delante del monte». Éxodo fecha la llegada en el mes tercero tras salir de Egipto, y Números la partida el día veinte del segundo mes del segundo año: casi un año en un mismo campamento. Dónde estaba depende de dónde estuviera el monte Sinaí. Desde el siglo IV la tradición ha situado la montaña en el Jebel Musa, en el granito del sur de la península del Sinaí, con la llanura de er-Raha a su pie, lo bastante grande para un gran campamento; otros han defendido el Jebel Serbal, sobre el oasis de Feiran, colinas del norte de la península, o el Jebel al-Lawz, en el noroeste de Arabia. Ninguno está demostrado, y la cuestión está abierta."
    - "Aquí el Señor descendió «en fuego», de modo que el monte humeaba, y «el humo de él subía como el humo de un horno», y pronunció los diez mandamientos; aquí Israel hizo el becerro de oro, y aquí se construyó y se levantó el tabernáculo. Levítico cierra sus leyes de ofrendas con la nota de que el Señor las intimó cuando mandó que ofrecieran sus ofrendas «en el desierto de Sinaí», donde Nadab y Abiú murieron «cuando ofrecieron fuego extraño». En el desierto de Sinaí Moisés hizo el primer censo del pueblo, contó a los levitas y celebró la segunda Pascua, «á los catorce días del mes, entre las dos tardes». Luego se alzó la nube, y los hijos de Israel «movieron … por sus partidas del desierto de Sinaí; y paró la nube en el desierto de Parán»; de todos los aquí contados solo Caleb y Josué vivieron para entrar en la tierra."
    - "Elías huyó a Horeb, y Pablo habla del Sinaí como «un monte de Arabia». Los peregrinos llegaban al Jebel Musa en el siglo IV: Egeria, hacia 383, subió a la montaña y los monjes que vivían allí le mostraron los lugares del relato, y el emperador Justiniano construyó a su pie el monasterio fortificado que más tarde tomó el nombre de Santa Catalina; Tischendorf halló el Códice Sinaítico en su biblioteca en 1844 y 1859."
    - "El desierto tradicional se halla en la gobernación del Sinaí Meridional, en Egipto. Al monasterio, cuya zona es sitio de la UNESCO desde 2002, lo atienden los beduinos jebeliya y la ciudad de Santa Catalina; los peregrinos suben de noche al Jebel Musa, de 2285 m, para ver el amanecer; y el centro turístico de Sharm el-Sheikh se encuentra en la costa, al sur."
  pt:
    - "O Deserto do Sinai é o deserto em torno do monte da Lei, onde Israel “acampou diante do monte”. Êxodo data a chegada ao terceiro mês depois da saída do Egito, e Números a partida ao vigésimo dia do segundo mês do segundo ano: quase um ano num só acampamento. Onde ficava depende de onde estava o monte Sinai. Desde o século IV a tradição o situa no Jebel Musa, no granito do sul da península do Sinai, com a planície de er-Raha ao pé, grande o bastante para um grande acampamento; outros defenderam o Jebel Serbal, acima do oásis de Feiran, colinas no norte da península ou o Jebel al-Lawz, no noroeste da Arábia. Nenhum está provado, e a questão está aberta."
    - "Aqui o Senhor desceu “em fogo”, de modo que o monte fumegava “como a fumaça de uma fornalha”, e falou os dez mandamentos; aqui Israel fez o bezerro de ouro, e aqui o tabernáculo foi construído e erguido. Levítico fecha suas leis de ofertas com a nota de que o Senhor as deu “no deserto de Sinai”, onde Nadabe e Abiú morreram “quando ofereceram fogo estranho”. No deserto do Sinai, Moisés fez o primeiro recenseamento do povo, contou os levitas e celebrou a segunda Páscoa, “no primeiro mês, no décimo quarto dia do mês, ao entardecer”. Então a nuvem se ergueu, e Israel “partiu em suas jornadas saindo do deserto do Sinai; e a nuvem pousou no deserto de Parã”; de todos os ali contados, só Calebe e Josué viveram para entrar na terra."
    - "Elias fugiu para o Horebe, e Paulo fala do “monte Sinai, na Arábia”. Peregrinos chegavam ao Jebel Musa já no século IV: Egéria, por volta de 383, subiu o monte e os monges que viviam ali lhe mostraram os lugares da história, e o imperador Justiniano construiu o mosteiro fortificado ao seu pé, que depois tomou o nome de Santa Catarina; Tischendorf achou o Códice Sinaítico em sua biblioteca em 1844 e 1859."
    - "O deserto tradicional fica na província do Sinai do Sul, no Egito. O mosteiro, cuja área é sítio da UNESCO desde 2002, é servido pelos beduínos jebeliya e pela cidade de Santa Catarina; os peregrinos sobem o Jebel Musa, de 2.285 m, de noite, para ver o nascer do sol; e o balneário de Sharm el-Sheikh fica na costa, ao sul."
  de:
    - "Die Wüste Sinai ist die Wüste um den Berg des Gesetzes, wo Israel sich „gegenüber dem Berge“ lagerte. Das Buch Exodus datiert die Ankunft in den dritten Monat nach dem Auszug aus Ägypten, das Buch Numeri den Aufbruch auf den zwanzigsten Tag des zweiten Monats des zweiten Jahres: fast ein Jahr in einem Lager. Wo sie lag, hängt davon ab, wo der Berg Sinai war. Seit dem vierten Jahrhundert verortet die Überlieferung den Berg am Jebel Musa im Granit des Südens der Sinai-Halbinsel, mit der Ebene er-Raha an seinem Fuß, groß genug für ein großes Lager; andere haben für den Jebel Serbal über der Oase Feiran, für Hügel im Norden der Halbinsel oder für den Jebel al-Lawz im Nordwesten Arabiens argumentiert. Nichts davon ist bewiesen, und die Frage ist offen."
    - "Hier „fuhr“ der HERR herab auf den Berg „mit Feuer“, sodass der Berg rauchte, „und sein Rauch ging auf wie ein Rauch vom Ofen“, und sprach die zehn Gebote; hier machte Israel das goldene Kalb, und hier wurde die Stiftshütte gebaut und aufgerichtet. Das Buch Levitikus schließt seine Opfergesetze mit dem Vermerk, der Herr habe sie gegeben, „zu opfern ihre Opfer dem HERRN in der Wüste Sinai“, wo Nadab und Abihu starben, „da sie fremdes Feuer opferten vor dem HERRN in der Wüste Sinai“. In der Wüste Sinai hielt Mose die erste Zählung des Volkes, zählte die Leviten und feierte das zweite Passah „am vierzehnten Tage des ersten Monats gegen Abend“. Dann hob sich die Wolke, und Israel „brachen auf und zogen aus der Wüste Sinai, und die Wolke blieb in der Wüste Pharan“; von allen hier Gezählten erlebten nur Kaleb und Josua den Einzug ins Land."
    - "Elia floh zum Horeb, und Paulus schreibt: „Hagar heißt in Arabien der Berg Sinai“. Schon im vierten Jahrhundert kamen Pilger zum Jebel Musa: Egeria bestieg den Berg um 383 und bekam von den dort lebenden Mönchen die Orte der Geschichte gezeigt, und Kaiser Justinian baute das befestigte Kloster an seinem Fuß, das später den Namen Katharinenkloster erhielt; Tischendorf fand in seiner Bibliothek 1844 und 1859 den Codex Sinaiticus."
    - "Die Wüste der Überlieferung liegt im ägyptischen Gouvernement Süd-Sinai. Das Kloster, seit 2002 UNESCO-Stätte, wird von den Jebeliya-Beduinen und der Stadt Sankt Katharina versorgt; Pilger besteigen den Jebel Musa, 2285 m, nachts, um den Sonnenaufgang zu sehen; und der Badeort Scharm el-Scheich liegt an der Küste im Süden."
  fr:
    - "Le Désert du Sinaï est le désert autour de la montagne de la Loi, où Israël « campa là, vis-à-vis de la montagne ». L’Exode date l’arrivée du troisième mois après la sortie d’Égypte, et les Nombres le départ du vingtième jour du deuxième mois de la deuxième année : presque un an dans un seul camp. Son emplacement dépend de celui du mont Sinaï. Depuis le IVe siècle, la tradition place la montagne au Jebel Musa, dans le granite du sud de la péninsule du Sinaï, avec à son pied la plaine d’er-Raha assez vaste pour un grand camp ; d’autres ont plaidé pour le Jebel Serbal au-dessus de l’oasis de Feiran, pour des collines du nord de la péninsule, ou pour le Jebel al-Lawz dans le nord-ouest de l’Arabie. Aucun n’est prouvé, et la question reste ouverte."
    - "Ici l’Éternel descendit « au milieu du feu », si bien que la montagne fumait « comme la fumée d’une fournaise », et prononça les dix commandements ; ici Israël fit le veau d’or, et ici le tabernacle fut construit et dressé. Le Lévitique clôt ses lois sur les offrandes en notant que l’Éternel les donna « dans le désert du Sinaï », où Nadab et Abihu moururent « lorsqu’ils apportèrent devant l’Éternel du feu étranger ». Dans le désert de Sinaï, Moïse fit le premier dénombrement du peuple, compta les lévites et célébra la seconde Pâque, « le quatorzième jour du premier mois, entre les deux soirs ». Puis la nuée s’éleva, les enfants d’Israël « partirent du désert de Sinaï, selon l’ordre fixé pour leur marche. La nuée s’arrêta dans le désert de Paran » ; de tous ceux qui furent dénombrés ici, seuls Caleb et Josué vécurent pour entrer dans le pays."
    - "Élie s’enfuit à Horeb, et Paul parle du « mont Sinaï en Arabie ». Des pèlerins vinrent au Jebel Musa dès le IVe siècle : Égérie, vers 383, gravit la montagne et se fit montrer les lieux du récit par les moines qui y vivaient, et l’empereur Justinien bâtit à son pied le monastère fortifié qui prit plus tard le nom de Sainte-Catherine ; Tischendorf trouva dans sa bibliothèque le Codex Sinaiticus en 1844 et en 1859."
    - "Le désert traditionnel se trouve dans le gouvernorat du Sinaï du Sud, en Égypte. Le monastère, dont la zone est un site de l’UNESCO depuis 2002, est desservi par les Bédouins Jebeliya et la ville de Sainte-Catherine ; les pèlerins gravissent de nuit le Jebel Musa, 2 285 m, pour voir le lever du soleil ; et la station balnéaire de Charm el-Cheikh se trouve sur la côte au sud."
  pl:
    - "Pustynia Synaj to pustynia wokół góry Prawa, gdzie „rozbił tam Izrael namioty przeciw górze”. Księga Wyjścia datuje przybycie na trzeci miesiąc po opuszczeniu Egiptu, a Księga Liczb odejście na dwudziesty dzień drugiego miesiąca drugiego roku: prawie rok w jednym obozie. Gdzie leżała, zależy od tego, gdzie była Góra Synaj. Od IV wieku tradycja umieszcza górę w Dżabal Musa w granitowym południu półwyspu Synaj, z równiną er-Raha u jej stóp, dość dużą na wielki obóz; inni optowali za Dżabal Serbal nad oazą Faran, za wzgórzami na północy półwyspu albo za Dżabal al-Lauz w północno-zachodniej Arabii. Żadne z nich nie jest udowodnione, a sprawa jest otwarta."
    - "Tu Pan zstąpił „w ogniu”, tak że góra dymiła „jako dym z pieca”, i wypowiedział dziesięć przykazań; tu Izrael uczynił złotego cielca i tu zbudowano i wzniesiono przybytek. Księga Kapłańska zamyka swoje prawa o ofiarach uwagą, że Pan dał je „na puszczy Synaj”, gdzie Nadab i Abihu zginęli, „gdy ofiarowali ogień obcy przed Panem”. Na pustyni Synaj Mojżesz przeprowadził pierwszy spis ludu, policzył Lewitów i obchodził drugą Paschę, „pierwszego miesiąca, czternastego dnia, między dwoma wieczorami”. Potem obłok się podniósł i „ruszyli się synowie Izraelscy z hufcami swymi z puszczy Synaj, a stanął obłok na puszczy Faran”; z wszystkich tu policzonych do kraju weszli tylko Kaleb i Jozue."
    - "Eliasz uciekł na Horeb, a Paweł wspomina „górę Synaj w Arabii”. Pielgrzymi przybywali do Dżabal Musa już w IV wieku: Egeria około 383 roku weszła na górę i mnisi tam mieszkający pokazali jej miejsca opowieści, a cesarz Justynian zbudował u jej stóp warowny klasztor, który później przyjął imię św. Katarzyny; Tischendorf znalazł w jego bibliotece Kodeks synajski w 1844 i 1859 roku."
    - "Tradycyjnie wskazywana pustynia leży w egipskiej prowincji Synaj Południowy. Klasztor, którego obszar jest od 2002 roku miejscem UNESCO, obsługują Beduini Dżabalijja i miasto Święta Katarzyna; pielgrzymi wspinają się na Dżabal Musa, 2285 m, nocą, by zobaczyć wschód słońca; a kurort Szarm el-Szejk leży na wybrzeżu na południu."
  it:
    - "Il Deserto del Sinai è il deserto attorno al monte della Legge, dove «quivi si accampò Israele, dirimpetto al monte». L’Esodo data l’arrivo al terzo mese dopo l’uscita dall’Egitto, e i Numeri la partenza al ventesimo giorno del secondo mese del secondo anno: quasi un anno in un solo accampamento. Dove fosse dipende da dove si trovava il monte Sinai. Dal IV secolo la tradizione pone il monte a Jebel Musa nel granito del sud della penisola del Sinai, con la piana di er-Raha ai suoi piedi abbastanza grande per un grande accampamento; altri hanno sostenuto Jebel Serbal sopra l’oasi di Feiran, colline nel nord della penisola o Jebel al-Lawz nell’Arabia nord-occidentale. Nessuna è provata, e la questione è aperta."
    - "Qui il Signore scese «in mezzo al fuoco», così che il monte fumava «come il fumo d’una fornace», e pronunciò i dieci comandamenti; qui Israele fece il vitello d’oro, e qui il tabernacolo fu costruito ed eretto. Il Levitico chiude le leggi delle offerte con la nota che il Signore le diede «nel deserto di Sinai», dove Nadab e Abiu morirono «quand’offrirono fuoco straniero». Nel deserto del Sinai Mosè fece il primo censimento del popolo, contò i Leviti e celebrò la seconda Pasqua, «il quattordicesimo giorno del primo mese, sull’imbrunire». Poi la nuvola si alzò, e «i figliuoli d’Israele partirono dal deserto di Sinai, secondo l’ordine fissato per le loro marce; e la nuvola si fermò nel deserto di Paran»; di tutti i censiti qui, solo Caleb e Giosuè vissero per entrare nel paese."
    - "Elia fuggì all’Oreb, e Paolo parla del «monte Sinai in Arabia». I pellegrini giunsero a Jebel Musa nel IV secolo: Egeria, verso il 383, salì il monte e i monaci che vi vivevano le mostrarono i luoghi del racconto, e l’imperatore Giustiniano costruì ai suoi piedi il monastero fortificato che prese poi il nome di Santa Caterina; Tischendorf trovò nella sua biblioteca il Codex Sinaiticus nel 1844 e nel 1859."
    - "Il deserto tradizionale si trova nel governatorato egiziano del Sinai meridionale. Il monastero, la cui area è sito UNESCO dal 2002, è servito dai beduini Jebeliya e dalla città di Santa Caterina; i pellegrini salgono di notte sul Jebel Musa, 2.285 m, per vedere l’alba; e la località di Sharm el-Sheikh sorge sulla costa a sud."
  nl:
    - "De woestijn Sinaï is de woestijn rond de berg van de Wet, waar Israël zich “aldaar tegenover dien berg” legerde. Exodus dateert de aankomst in de derde maand na het verlaten van Egypte, en Numeri het vertrek op de twintigste dag van de tweede maand van het tweede jaar: bijna een jaar in één kamp. Waar het lag, hangt ervan af waar de berg Sinaï lag. Sinds de vierde eeuw plaatst de overlevering de berg bij Jebel Musa in het graniet van het zuiden van het Sinaïschiereiland, met aan zijn voet de vlakte van er-Raha, groot genoeg voor een groot kamp; anderen hebben gepleit voor Jebel Serbal boven de oase Feiran, voor heuvels in het noorden van het schiereiland, of voor Jebel al-Lawz in het noordwesten van Arabië. Geen daarvan is bewezen, en de vraag is open."
    - "Hier daalde de HEER neer “in vuur”, zodat de berg rookte “als de rook van een oven”, en sprak de tien geboden; hier maakte Israël het gouden kalf, en hier werd de tabernakel gebouwd en opgericht. Leviticus sluit zijn offerwetten af met de aantekening dat de HEER ze gaf “in de woestijn van Sinai”, waar Nadab en Abihu stierven “als zij vreemd vuur voor het aangezicht des HEEREN … brachten”. In de woestijn Sinaï hield Mozes de eerste volkstelling, telde de Levieten en hield het tweede pascha, “op den veertienden dag der eerste maand, tussen de twee avonden”. Toen werd de wolk opgeheven, en “de kinderen Israels togen op, naar hun tochten, uit de woestijn Sinai; en de wolk bleef in de woestijn Paran”; van allen die hier werden geteld, leefden alleen Kaleb en Jozua nog om het land binnen te gaan."
    - "Elia vluchtte naar Horeb, en Paulus spreekt van “Sina, een berg in Arabië”. Pelgrims kwamen al in de vierde eeuw naar Jebel Musa: Egeria beklom de berg omstreeks 383 en kreeg van de monniken die er woonden de plaatsen van het verhaal getoond, en keizer Justinianus bouwde het versterkte klooster aan zijn voet, dat later de naam Sint-Catharina kreeg; Tischendorf vond in 1844 en 1859 de Codex Sinaiticus in de bibliotheek ervan."
    - "De traditionele woestijn ligt in het gouvernement Zuid-Sinaï van Egypte. Het klooster, sinds 2002 een UNESCO-werelderfgoedlocatie, wordt bediend door de Jebeliya-bedoeïenen en de stad Sint-Catharina; pelgrims beklimmen Jebel Musa, 2285 m, ’s nachts om de zonsopgang te zien; en het badplaatsje Sharm el-Sheikh ligt aan de kust in het zuiden."
  cs:
    - "Sinajská poušť je poušť kolem hory Zákona, kde, jak se praví, „rozbili Izraelští stany naproti hoře“. Exodus datuje příchod do třetího měsíce po odchodu z Egypta a Numeri odchod do dvacátého dne druhého měsíce druhého roku: téměř rok v jednom táboře. Kde ležela, závisí na tom, kde byla hora Sinaj. Od 4. století klade tradice horu na Džebel Músa v žule na jihu Sinajského poloostrova, s rovinou er-Ráha při jejím úpatí dost velkou pro velký tábor; jiní hájili Džebel Serbál nad oázou Fárán, pahorky na severu poloostrova nebo Džebel al-Lawz v severozápadní Arábii. Nic z toho není prokázáno a otázka je otevřená."
    - "Zde Hospodin sestoupil „v ohni“, takže se hora kouřila a dým vystupoval „jako dým z vápenice“, a vyslovil deset přikázání; zde Izrael udělal zlaté tele a zde byl postaven a vztyčen stánek. Leviticus uzavírá své zákony o obětech poznámkou, že Hospodin je dal „na poušti Sinai“, kde zemřeli Nádab a Abihú, „když obětovali cizí oheň před Hospodinem“. Na Sinajské poušti provedl Mojžíš první sčítání lidu, sečetl levity a slavil druhý pesach, „v měsíci prvním, čtrnáctého dne u večer“. Pak se oblak zvedl a „táhli synové Izraelští po svých taženích z pouště Sinai; a zastavil se oblak na poušti Fáran“; ze všech zde sečtených vstoupili do země jen Káleb a Jozue."
    - "Elijáš uprchl na Oréb a Pavel mluví o hoře Sinai v Arabii. Poutníci přicházeli na Džebel Músa už ve 4. století: Egerie kolem roku 383 horu vystoupila a mniši tam žijící jí ukázali místa příběhu a císař Justinián postavil u jejího úpatí opevněný klášter, který později přijal jméno svaté Kateřiny; Tischendorf našel v jeho knihovně Codex Sinaiticus v letech 1844 a 1859."
    - "Tradičně určovaná poušť leží v egyptském guvernorátu Jižní Sinaj. Klášter, jehož okolí je od roku 2002 památkou UNESCO, obsluhují beduíni Džebelíja a město Svatá Kateřina; poutníci vystupují na Džebel Músa, 2285 m, v noci, aby viděli východ slunce; a letovisko Šarm aš-Šajch leží na pobřeží na jihu."
  sv:
    - "Sinaiöknen är öknen kring lagens berg, där Israel ”lägrade sig där mitt emot berget”. Andra Mosebok daterar ankomsten till tredje månaden efter uttåget ur Egypten, och Fjärde Mosebok avfärden till tjugonde dagen i andra månaden av andra året: nästan ett år i ett läger. Var den låg beror på var Sinaiberget låg. Sedan 300-talet har traditionen placerat berget vid Jebel Musa i graniten i södra Sinaihalvön, med slätten er-Raha vid dess fot stor nog för ett stort läger; andra har argumenterat för Jebel Serbal ovanför oasen Feiran, för kullar i norra halvön, eller för Jebel al-Lawz i nordvästra Arabien. Inget av detta är bevisat, och frågan är öppen."
    - "Här kom Herren ner ”i eld”, så att berget rykte ”lik röken från en smältugn”, och talade de tio budorden; här gjorde Israel guldkalven, och här byggdes och restes tabernaklet. Tredje Mosebok avslutar sina offerlagar med anmärkningen att Herren gav dem ”i Sinais öken”, där Nadav och Avihu dog ”när de framburo främmande eld inför HERRENS ansikte”. I Sinaiöknen höll Mose den första folkräkningen, räknade leviterna och firade den andra påsken, ”i först månaden, på fjortonde dagen i månaden, vid aftontiden”. Därefter lyfte molnet, ”bröto Israels barn upp från Sinais öken och tågade från lägerplats till lägerplats; och molnskyn stannade i öknen Paran”; av alla dem som räknades här levde bara Kalev och Josua att komma in i landet."
    - "Elia flydde till Horeb, och Paulus skriver: ”Berget Sina kallas nämligen i Arabien för Agar”. Pilgrimer kom till Jebel Musa på 300-talet: Egeria besteg omkring 383 berget och fick av munkarna som bodde där visa platserna i berättelsen, och kejsar Justinianus byggde det befästa klostret vid dess fot, som senare tog namnet Sankt Katarina; Tischendorf fann Codex Sinaiticus i dess bibliotek 1844 och 1859."
    - "Den traditionella öknen ligger i Egyptens guvernement Södra Sinai. Klostret, vars område är ett Unesco-världsarv sedan 2002, betjänas av jebeliya-beduinerna och staden Sankt Katarina; pilgrimer bestiger Jebel Musa, 2 285 m, om natten för att se soluppgången; och semesterorten Sharm el-Sheikh ligger på kusten i söder."
  nb:
    - "Sinai-ørkenen er ørkenen rundt lovens fjell, der Israel «leiret sig der midt imot fjellet». Andre Mosebok daterer ankomsten til den tredje måneden etter utgangen fra Egypt, og Fjerde Mosebok avreisen til den tyvende dagen i den andre måneden i det andre året: nesten et år i én leir. Hvor den lå, avhenger av hvor Sinai-fjellet lå. Siden 300-tallet har tradisjonen plassert fjellet ved Jebel Musa i granitten sør på Sinai-halvøya, med sletten er-Raha ved foten, stor nok for en stor leir; andre har argumentert for Jebel Serbal over oasen Feiran, for åser i nord på halvøya, eller for Jebel al-Lawz i nordvestlige Arabia. Ingen av disse er bevist, og spørsmålet er åpent."
    - "Her kom Herren ned «i ild», slik at fjellet røk «som røken av en ovn», og talte de ti bud; her laget Israel gullkalven, og her ble tabernaklet bygd og reist. Tredje Mosebok avslutter lovene om ofrene med noten om at Herren ga dem «i Sinai ørken», der Nadab og Abihu døde «dengang de bar fremmed ild inn for Herrens åsyn». I Sinai-ørkenen holdt Moses den første folketellingen, mønstret levittene og holdt den andre påsken, «på den fjortende dag i måneden, mellem de to aftenstunder». Så løftet skyen seg, og Israels barn «brøt op og drog i dagsreiser fra Sinai ørken, og skyen lot sig ned i ørkenen Paran»; av alle de som ble mønstret her, levde bare Kaleb og Josva til å komme inn i landet."
    - "Elia flyktet til Horeb, og Paulus taler om «berget Sinai i Arabia». Pilegrimer kom til Jebel Musa på 300-tallet: Egeria besteg fjellet omkring 383 og ble vist stedene i fortellingen av munkene som bodde der, og keiser Justinian bygde det befestede klosteret ved foten, som senere tok navnet Sankt Katarina; Tischendorf fant Codex Sinaiticus i biblioteket der i 1844 og 1859."
    - "Den tradisjonelle ørkenen ligger i Egypts guvernement Sør-Sinai. Klosteret, med omgivelser et UNESCO-sted siden 2002, betjenes av jebeliya-beduinene og byen Saint Catherine; pilegrimer klatrer opp Jebel Musa, 2285 m, om natten for å se soloppgangen; og feriestedet Sharm el-Sheikh ligger på kysten i sør."
  tl:
    - "Ang Ilang ng Sinai ay ang disyerto sa paligid ng bundok ng Kautusan, kung saan “humantong ang Israel sa harap ng bundok”. Itinatakda ng Exodo ang pagdating sa ikatlong buwan pagkaalis sa Egipto, at ng Bilang ang pag-alis sa ikadalawampung araw ng ikalawang buwan ng ikalawang taon: halos isang taon sa isang kampamento. Nakasalalay ang kinalalagyan nito sa kinaroroonan ng Bundok Sinai. Mula noong ika-4 na siglo, inilagay ng tradisyon ang bundok sa Jebel Musa sa granitong timog ng tangway ng Sinai, na ang kapatagan ng er-Raha sa paanan nito ay sapat na malaki para sa dakilang kampamento; ipinagtanggol ng iba ang Jebel Serbal sa itaas ng oasis ng Feiran, mga burol sa hilaga ng tangway, o ang Jebel al-Lawz sa hilagang-kanluran ng Arabia. Walang napatunayan, at bukás ang tanong."
    - "Dito bumaba ang Panginoon na “nasa apoy”, kaya umusok ang bundok na “parang usok ng isang hurno”, at sinalita ang sampung utos; dito ginawa ng Israel ang gintong guya, at dito itinayo at itinindig ang tabernakulo. Tinatapos ng Levitico ang mga batas ng handog sa tala na ibinigay ang mga ito “sa ilang ng Sinai”, kung saan namatay sina Nadab at Abiu “nang sila'y maghandog ng ibang apoy sa harap ng Panginoon”. Sa ilang ng Sinai, isinagawa ni Moises ang unang sensus ng bayan, binilang ang mga Levita at ipinagdiwang ang ikalawang Paskua, “nang unang buwan, sa ikalabing apat na araw ng buwan, sa paglubog ng araw”. Pagkatapos ay umangat ang ulap, at ang Israel ay “nagsisulong, ayon sa kanilang mga paglalakbay mula sa ilang ng Sinai; at ang ulap ay tumahan sa ilang ng Paran”; sa lahat ng binilang dito, sina Caleb at Josue lamang ang nabuhay upang pumasok sa lupain."
    - "Tumakas si Elias sa Horeb, at binabanggit ni Pablo ang “bundok ng Sinai sa Arabia”. Dumating ang mga peregrino sa Jebel Musa pagsapit ng ika-4 na siglo: si Egeria, noong mga 383, ay umakyat sa bundok at ipinakita ng mga monghe roon ang mga lugar ng kuwento, at itinayo ni Emperador Justiniano ang monasteryong may kuta sa paanan nito, na kalaunang tinawag na Santa Catalina; natagpuan ni Tischendorf ang Codex Sinaiticus sa aklatan nito noong 1844 at 1859."
    - "Ang tradisyonal na ilang ay nasa lalawigan ng Timog Sinai ng Egipto. Ang monasteryo, na pook ng UNESCO ang lugar mula 2002, ay pinaglilingkuran ng mga Beduinong Jebeliya at ng bayan ng Santa Catalina; umaakyat ang mga peregrino sa Jebel Musa, 2,285 m, nang gabi upang makita ang pagsikat ng araw; at ang resort ng Sharm el-Sheikh ay nasa baybayin sa timog."
  da:
    - "Sinajs ørken er ørkenen omkring lovens bjerg: »der lejrede Israel sig lige for Bjerget«. Anden Mosebog dater ankomsten til tredje måned efter udvandringen fra Egypten, og Numeri afrejsen til anden måneds tyvende dag i andet år: næsten et år i én lejr. Hvor den lå, afhænger af, hvor Sinaj-bjerget lå. Siden 300-tallet har traditionen placeret bjerget ved Jebel Musa i granitområdet i den sydlige del af Sinai-halvøen, med sletten er-Raha ved dets fod stor nok til en stor lejr; andre har argumenteret for Jebel Serbal over oasen Feiran, for bjerge i den nordlige del af halvøen eller for Jebel al-Lawz i det nordvestlige Arabien. Intet af dette er bevist, og spørgsmålet er åbent."
    - "Her kom Herren ned »i Ilden«, så bjerget røg »som Røg af en Ovn«, og talte de ti bud; her lavede Israel guldkalven, og her blev tabernaklet bygget og rejst. Tredje Mosebog slutter sine lovbestemmelser om ofre med bemærkningen, at Herren gav dem »i Sinai Ørk«, hvor Nadab og Abihu døde, »der de førte fremmed Ild frem for Herrens Ansigt«. I Sinajs ørken foretog Moses den første folketælling, talte leviterne og holdt den anden påske »i den første Maaned, paa den fjortende Dag i Maaneden, imellem de tvende Aftener«. Så løftede skyen sig, Israels børn »brøde op paa deres Vandringer fra Sinai Ørk; og Skyen blev i den Ørk Paran«; af alle dem, der blev talt her, levede kun Kaleb og Josva til at komme ind i landet."
    - "Elija flygtede til Horeb, og Paulus taler om »Sinai Bjerg i Arabien«. Pilgrimme kom til Jebel Musa i 300-tallet: Egeria besteg omkring 383 bjerget og blev vist historiens steder af munkene, der boede der, og kejser Justinian byggede det befæstede kloster ved dets fod, der senere tog navnet Sankt Katharina; Tischendorf fandt Codex Sinaiticus i dets bibliotek i 1844 og 1859."
    - "Den traditionelle ørken ligger i Egyptens guvernement Sydsinai. Klosteret, hvis område har været UNESCO-sted siden 2002, betjenes af jebeliya-beduinerne og byen Saint Catherine; pilgrimme bestiger Jebel Musa, 2.285 m, om natten for at se solopgangen; og feriestedet Sharm el-Sheikh ligger ved kysten mod syd."
  sr:
    - "Синајска пустиња је пустиња око горе Закона, где је Израиљ утаборен: „логор начинише Израиљци онде под гором“. Излазак датира долазак у трећи месец после изласка из Египта, а Књига о бројевима полазак у двадесети дан другог месеца друге године: скоро годину дана у једном логору. Где је лежала, зависи од тога где је била гора Синај. Од 4. века предање смешта гору на Џебел Мусу у граниту на југу Синајског полуострва, с равницом ер Раха у подножју довољно великом за велики логор; други су заговарали Џебел Србал изнад оазе Фајран, брда на северу полуострва или Џебел ел Лоз у северозападној Арабији. Ништа од тога није доказано, а питање је отворено."
    - "Овде је Господ сишао „у огњу“, тако да се гора димила „као дим из пећи“, и изговорио десет заповести; овде је Израиљ направио златно теле, и овде је шатор био саграђен и подигнут. Левитски законик затвара своје законе о жртвама напоменом да их је Господ дао „у пустињи синајској“, где су Надав и Авијуд погинули „кад принесоше огањ туђ пред Господом“. У Синајској пустињи Мојсије је извршио први попис народа, пребројао левите и славио другу пасху, „првог месеца четрнаестог дана увече“. Затим се облак подигао, Израиљ је кренуо: „пођоше синови Израиљеви својим редом из пустиње синајске, и устави се облак у пустињи фаранској“; од свих онде пописаних, само су Халев и Исус дочекали улазак у земљу."
    - "Илија је побегао на Хорив, а Павле говори о „Синај гора у арапској“. Ходочасници су долазили на Џебел Мусу већ у 4. веку: Егерија се око 383. попела на гору и монаси који су онде живели показали су јој места из приче, а цар Јустинијан подигао је утврђени манастир у њеном подножју, који је касније добио име свете Катарине; Тишендорф је нашао Синајски кодекс у његовој библиотеци 1844. и 1859."
    - "Традиционална пустиња лежи у египатском гувернорату Јужни Синај. Манастир, чије је подручје на УНЕСКО-вој листи од 2002, опслужују бедуини Џебелије и град Света Катарина; ходочасници се пењу на Џебел Мусу, 2.285 м, ноћу да виде излазак сунца; а одмаралиште Шарм ел Шеик лежи на обали на југу."
