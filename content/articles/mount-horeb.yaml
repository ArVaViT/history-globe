# Overview article (ADR 0007). Mainstream facts only; Horeb is treated as the Bible's other name for Sinai, and the views that separate the two are named; the site itself is covered in the Mount Sinai article.
id: mount-horeb
place: a9bb03e
title:
  en: "Mount Horeb"
  ru: "Гора Хорив"
  uk: "Гора Хорив"
  es: "Monte Horeb"
  pt: "Monte Horebe"
  de: "Horeb"
  fr: "Mont Horeb"
  it: "Monte Oreb"
  pl: "Góra Horeb"
  nl: "Horeb"
  cs: "Choreb"
  sv: "Horeb"
