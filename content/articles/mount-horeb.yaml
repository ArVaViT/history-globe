body:
  en:
    - "Horeb is the other name of the mountain of God, the one Deuteronomy uses almost throughout, where Exodus from chapter 19 onward, Leviticus and Numbers say Sinai. Exodus itself uses both: Moses came with Jethro's flock “to the mountain of God, even to Horeb”, and the people stripped off their ornaments “by the mount Horeb” after the golden calf. The name is usually taken to mean “dry” or “desolate”. Most readers of the Bible have taken Horeb and Sinai as one mountain; some suggest that Horeb was the wider massif or region and Sinai the peak, and critics of the Pentateuch assign the two names to different strands of the text. The mountain has been sought at Jebel Musa in the south of the Sinai peninsula since the fourth century, though other sites are proposed."
    - "Under this name the Bible tells of the burning bush, where God promised Moses, “ye shall serve God upon this mountain”; of the rock in Horeb that Moses struck at Rephidim so that water came out; and, in Deuteronomy, of “the day that thou stoodest before the LORD thy God in Horeb”, when Israel heard a voice out of the fire but “saw no manner of similitude”, asked not to hear it again, and received the covenant: “The LORD our God made a covenant with us in Horeb.” Deuteronomy counts eleven days from Horeb to Kadesh-barnea by way of Mount Seir, and sets the covenant made in Moab beside the one at Horeb. Solomon's priests found in the ark only “the two tables of stone, which Moses put there at Horeb”."
    - "Elijah came to Horeb last. Fleeing Jezebel, he walked “forty days and forty nights unto Horeb the mount of God”, lodged in a cave, and found the LORD not in the wind, the earthquake or the fire but in “a still small voice”. Psalm 106 remembers the calf made “in Horeb”, and Malachi closes the prophets with “the law of Moses my servant, which I commanded unto him in Horeb”. The New Testament uses only the name Sinai."
    - "Christian pilgrims kept the two names apart on the one massif. Egeria, about 383, after climbing the summit of Sinai, came down to the church on Horeb, where Elijah was said to have hidden in the cave, and a chapel of Elijah still stands on the saddle below the peak of Jebel Musa. Eusebius' Onomasticon places Horeb, the mountain of God, beside Mount Sinai, and Jerome, translating it, added that the same mountain seemed to him to be called by the two names."
  ru:
    - "Хорив — второе имя горы Божией; им почти всюду пользуется Второзаконие, тогда как Исход с 19-й главы, Левит и Числа говорят «Синай». Сама книга Исход употребляет оба: Моисей пришёл со стадом Иофора «к горе Божией, Хориву», а народ после золотого тельца снял украшения «у горы Хорива». Имя обычно толкуют как «сухая» или «пустынная». Большинство читателей Библии считали Хорив и Синай одной горой; некоторые предполагают, что Хорив — весь массив или местность, а Синай — вершина, а критики Пятикнижия относят два имени к разным пластам текста. С IV века гору ищут на Джебель-Муса на юге Синайского полуострова, хотя предлагались и другие места."
    - "Под этим именем Библия рассказывает о горящем кусте, где Бог обещал Моисею: «вы совершите служение Богу на этой горе»; о скале в Хориве, которую Моисей ударил в Рефидиме, так что из неё пошла вода; и, во Второзаконии, о том дне, «когда ты стоял пред Господом, Богом твоим, при Хориве», когда Израиль слышал голос из огня, но не видел «никакого образа», просил не слышать его больше и получил завет: «Господь, Бог наш, поставил с нами завет на Хориве». Второзаконие считает одиннадцать дней пути от Хорива до Кадес-Варни по дороге от горы Сеир и ставит завет, заключённый в Моаве, рядом с заветом на Хориве. В ковчеге при Соломоне не было ничего, «кроме двух каменных скрижалей, которые положил туда Моисей на Хориве»."
    - "Последним к Хориву пришёл Илия. Спасаясь от Иезавели, он шёл «сорок дней и сорок ночей до горы Божией Хорива», ночевал в пещере и встретил Господа не в ветре, не в землетрясении и не в огне: «после огня веяние тихого ветра, и там Господь». 105-й псалом вспоминает тельца, сделанного «у Хорива», а Малахия завершает пророков словами о законе Моисея, «который Я заповедал ему на Хориве». Новый Завет знает только имя Синай."
    - "Христианские паломники разводили два имени по одному массиву. Эгерия около 383 г., поднявшись на вершину Синая, спустилась к церкви на Хориве, где, как говорили, скрывался в пещере Илия, и часовня Илии до сих пор стоит на седловине под вершиной Джебель-Муса. «Ономастикон» Евсевия помещает Хорив, гору Божию, рядом с горой Синай, а Иероним, переводя его, добавил, что, по его мнению, одна и та же гора носит два имени."
  uk:
    - "Хорив — друге ім’я гори Божої, те, яке Повторення Закону вживає майже скрізь, де Книга Виходу від розділу 19, Левіт і Числа говорять Синай. Сама Книга Виходу вживає обидва: Мойсей прийшов із отарою Єтра «до Божої Гореб гори», і народ зірвав свої прикраси «почавши від Гореб гори» після золотого теляти. Ім’я зазвичай розуміють як «суха» або «пустельна». Більшість читачів Біблії брала Хорив і Синай за одну гору; дехто припускає, що Хорив був ширшим масивом чи краєм, а Синай — вершиною, а критики П’ятикнижжя приписують дві назви різним пластам тексту. Гору шукають на Джебель-Мусі на півдні Синайського півострова від IV ст., хоча пропонують і інші місця."
    - "Під цим ім’ям Біблія розповідає про палаючий кущ, де Бог обіцяв Мойсею: «помолитесь ви Богу під горою сією»; про скелю в Хориві, яку Мойсей ударив у Рефідімі, щоб потекла вода; і, в Повторенні Закону, про «день, як стояв єси перед Господом, Богом твоїм, під Горебом», коли Ізраїль почув голос з вогню, але «нїякої постатї не бачили», просив не чути його знову й прийняв завіт: «Господь, Бог наш, зробив завіт з нами на Гореб горі». Повторення Закону лічить одинадцять днів від Хориву до Кадеш-Барнеа через гору Сеїр і ставить завіт, укладений у Моаві, поряд з тим у Хориві. Священики Соломона знайшли в ковчегу лише «двох камяних таблиць, що зложив там Мойсей на Горебі»."
    - "Ілля прийшов до Хориву останнім. Тікаючи від Єзавелі, він мандрував «сорок день і сорок ночей аж до Божої гори Гореба», ночував у печері й знайшов Господа не у вітрі, землетрусі чи вогні, а в «тихе віяннє». Псалом 106 згадує теля, зроблене «коло Гореба-гори», а Малахія закриває пророків словами «закон слуги мого Мойсея, що я завітував йому на Горебі». Новий Завіт вживає лише ім’я Синай."
    - "Християнські прочани тримали дві назви окремо на одному масиві. Егерія близько 383 р., зійшовши на вершину Синаю, спустилася до церкви на Хориві, де, як казали, Ілля ховався в печері, а каплиця Іллі й досі стоїть на сідловині під вершиною Джебель-Муси. Ономастикон Євсевія розміщує Хорив, гору Божу, поруч із горою Синай, а Ієронім, перекладаючи його, додав, що та сама гора, як йому здавалося, зветься двома іменами."
  es:
    - "Horeb es el otro nombre del monte de Dios, el que Deuteronomio usa casi siempre, donde Éxodo desde el capítulo 19 en adelante, Levítico y Números dicen Sinaí. El propio Éxodo emplea los dos: Moisés llegó con el rebaño de Jetro «á Horeb, monte de Dios», y el pueblo se despojó de sus atavíos «desde el monte Horeb» después del becerro de oro. El nombre suele entenderse como «seco» o «desolado». La mayoría de los lectores de la Biblia han tomado Horeb y Sinaí por una sola montaña; algunos sugieren que Horeb era el macizo o la región más amplia y Sinaí la cima, y los críticos del Pentateuco asignan los dos nombres a distintas hebras del texto. La montaña se ha buscado en el Yebel Musa, en el sur de la península del Sinaí, desde el siglo IV, aunque se proponen otros sitios."
    - "Bajo este nombre la Biblia cuenta la zarza ardiente, donde Dios prometió a Moisés: «serviréis á Dios sobre este monte»; la roca en Horeb que Moisés golpeó en Refidim para que saliera agua; y, en Deuteronomio, «El día que estuviste delante de Jehová tu Dios en Horeb», cuando Israel oyó una voz de en medio del fuego pero «ninguna figura visteis», pidió no oírla de nuevo y recibió el pacto: «Jehová nuestro Dios hizo pacto con nosotros en Horeb». Deuteronomio cuenta once jornadas desde Horeb hasta Cades-barnea por el camino del monte Seir, y pone el pacto hecho en Moab junto al de Horeb. Los sacerdotes de Salomón hallaron en el arca solo «las dos tablas de piedra que había allí puesto Moisés en Horeb»."
    - "Elías llegó a Horeb el último. Huyendo de Jezabel, caminó «cuarenta días y cuarenta noches, hasta el monte de Dios, Horeb», se alojó en una cueva y halló a Jehová no en el viento, el terremoto ni el fuego sino en «un silbo apacible y delicado». El Salmo 106 recuerda el becerro hecho «en Horeb», y Malaquías cierra los profetas con «la ley de Moisés mi siervo, al cual encargué en Horeb». El Nuevo Testamento emplea solo el nombre de Sinaí."
    - "Los peregrinos cristianos mantuvieron los dos nombres separados en un solo macizo. Egeria, hacia 383, tras subir a la cumbre del Sinaí, bajó a la iglesia de Horeb, donde se decía que Elías se había ocultado en la cueva, y una capilla de Elías sigue en pie en la hondonada bajo el pico del Yebel Musa. El Onomasticón de Eusebio sitúa Horeb, el monte de Dios, junto al monte Sinaí, y Jerónimo, al traducirlo, añadió que la misma montaña le parecía llamarse con los dos nombres."
  pt:
    - "Horebe é o outro nome do monte de Deus, o que Deuteronômio usa quase sempre, onde Êxodo do capítulo 19 em diante, Levítico e Números dizem Sinai. O próprio Êxodo usa os dois: Moisés chegou com o rebanho de Jetro “ao monte de Deus, a Horebe”, e o povo despojou-se de suas joias “do monte Horebe em diante” depois do bezerro de ouro. O nome costuma ser tomado como “seco” ou “desolado”. A maioria dos leitores da Bíblia tomou Horebe e Sinai por uma só montanha; alguns sugerem que Horebe era o maciço ou região mais ampla e Sinai o pico, e críticos do Pentateuco atribuem os dois nomes a fios diferentes do texto. A montanha é procurada no Jebel Musa, no sul da península do Sinai, desde o século IV, embora outros sítios sejam propostos."
    - "Sob esse nome a Bíblia conta da sarça ardente, onde Deus prometeu a Moisés: “vocês servirão a Deus neste monte”; da rocha em Horebe que Moisés feriu em Refidim para que saísse água; e, em Deuteronômio, “o dia em que vocês estiveram diante do SENHOR, seu Deus, em Horebe”, quando Israel ouviu uma voz do meio do fogo mas “não viram nenhum tipo de forma”, pediu para não ouvi-la de novo e recebeu a aliança: “O SENHOR, nosso Deus, fez uma aliança conosco em Horebe.” Deuteronômio conta onze dias de Horebe a Cades-Barneia pelo caminho do monte Seir, e põe a aliança feita em Moabe ao lado da de Horebe. Os sacerdotes de Salomão acharam na arca apenas “as duas tábuas de pedra que Moisés colocou lá em Horebe”."
    - "Elias foi a Horebe por último. Fugindo de Jezabel, caminhou “quarenta dias e quarenta noites até Horebe, o Monte de Deus”, abrigou-se numa caverna e achou o SENHOR não no vento, no terremoto ou no fogo, mas em “uma voz mansa e delicada”. O Salmo 106 recorda o bezerro feito “em Horebe”, e Malaquias encerra os profetas com “a lei de Moisés, meu servo, que lhe ordenei em Horebe”. O Novo Testamento usa apenas o nome Sinai."
    - "Os peregrinos cristãos mantiveram os dois nomes distintos no mesmo maciço. Egéria, por volta de 383, depois de subir ao cume do Sinai, desceu à igreja em Horebe, onde se dizia que Elias se escondera na caverna, e uma capela de Elias ainda se ergue na sela abaixo do pico do Jebel Musa. O Onomástico de Eusébio põe Horebe, o monte de Deus, junto ao monte Sinai, e Jerônimo, ao traduzi-lo, acrescentou que a mesma montanha lhe parecia ser chamada pelos dois nomes."
  de:
    - "Horeb ist der andere Name des Berges Gottes, den das 5. Buch Mose fast durchgängig verwendet, wo 2. Mose ab Kapitel 19, 3. Mose und 4. Mose Sinai sagen. 2. Mose selbst gebraucht beide: Mose kam mit Jitros Herde „an den Berg Gottes, Horeb“, und das Volk legte nach dem goldenen Kalb den Schmuck ab „vor dem Berge Horeb“. Der Name bedeutet gewöhnlich „trocken“ oder „öde“. Die meisten Leser der Bibel haben Horeb und Sinai für einen Berg gehalten; manche meinen, Horeb sei das weitere Massiv oder die Region und Sinai der Gipfel, und Kritiker des Pentateuch ordnen die beiden Namen verschiedenen Textsträngen zu. Der Berg wird seit dem 4. Jahrhundert am Jebel Musa im Süden der Sinai-Halbinsel gesucht, obwohl andere Orte vorgeschlagen werden."
    - "Unter diesem Namen erzählt die Bibel vom brennenden Dornbusch, wo Gott Mose verhieß: „werdet ihr Gott opfern auf diesem Berge“; vom Fels am Horeb, den Mose bei Refidim schlug, sodass Wasser herauskam; und im 5. Buch Mose von dem Tag, „da du vor dem HERRN, deinem Gott, standest am Berge Horeb“, als Israel eine Stimme aus dem Feuer hörte, aber „keine Gestalt saht ihr“, bat, sie nicht noch einmal zu hören, und den Bund empfing: „Der HERR, unser Gott, hat einen Bund mit uns gemacht am Horeb.“ Das 5. Buch Mose zählt elf Tagereisen vom Horeb nach Kadesch-Barnea über das Gebirge Seir und stellt den in Moab geschlossenen Bund neben den am Horeb. Salomos Priester fanden in der Lade nur „die zwei steinernen Tafeln Mose's, die er hineingelegt hatte am Horeb“."
    - "Elia kam zuletzt zum Horeb. Auf der Flucht vor Isebel ging er „vierzig Tage und vierzig Nächte bis an den Berg Gottes Horeb“, übernachtete in einer Höhle und fand den HERRN nicht im Wind, im Erdbeben oder im Feuer, sondern erst, als nach dem Feuer „ein stilles, sanftes Sausen“ kam. Psalm 106 erinnert an das Kalb: „Sie machten ein Kalb am Horeb“, und Maleachi schließt die Propheten mit „Gedenkt des Gesetzes Mose's, meines Knechtes, das ich ihm befohlen habe auf dem Berge Horeb“. Das Neue Testament verwendet nur den Namen Sinai."
    - "Christliche Pilger hielten die beiden Namen auf dem einen Massiv getrennt. Egeria kam um 383, nachdem sie den Gipfel des Sinai bestiegen hatte, zur Kirche am Horeb hinunter, wo Elia sich in der Höhle verborgen haben sollte, und eine Elia-Kapelle steht noch auf dem Sattel unterhalb des Gipfels des Jebel Musa. Eusebius' Onomastikon setzt den Horeb, den Berg Gottes, neben den Berg Sinai, und Hieronymus fügte bei der Übersetzung hinzu, derselbe Berg scheine ihm mit den beiden Namen benannt zu werden."
  fr:
    - "Horeb est l’autre nom de la montagne de Dieu, celui que le Deutéronome emploie presque partout, là où l’Exode à partir du chapitre 19, le Lévitique et les Nombres disent Sinaï. L’Exode lui-même emploie les deux : Moïse vint avec le troupeau de Jéthro « à la montagne de Dieu, à Horeb », et le peuple se dépouilla de ses ornements « en s’éloignant du mont Horeb » après le veau d’or. Le nom est d’ordinaire pris pour « sec » ou « désolé ». La plupart des lecteurs de la Bible ont tenu Horeb et Sinaï pour une seule montagne ; certains suggèrent que l’Horeb était le massif ou la région plus large et le Sinaï le sommet, et les critiques du Pentateuque attribuent les deux noms à des courants différents du texte. La montagne est cherchée au djebel Moussa, dans le sud de la péninsule du Sinaï, depuis le IVe siècle, bien que d’autres sites soient proposés."
    - "Sous ce nom, la Bible raconte le buisson ardent, où Dieu promit à Moïse : « vous servirez Dieu sur cette montagne » ; le rocher d’Horeb que Moïse frappa à Rephidim pour en faire sortir l’eau ; et, dans le Deutéronome, « le jour où tu te présentas devant l’Éternel, ton Dieu, à Horeb », quand Israël entendit une voix du milieu du feu mais, selon le texte, « vous ne vîtes point de figure », demanda à ne plus l’entendre, et reçut l’alliance : « L’Éternel, notre Dieu, a traité avec nous une alliance à Horeb. » Le Deutéronome compte onze journées d’Horeb à Kadès-Barnéa par le chemin du mont Séir, et place l’alliance conclue en Moab à côté de celle d’Horeb. Les sacrificateurs de Salomon ne trouvèrent dans l’arche que « les deux tables de pierre, que Moïse y déposa en Horeb »."
    - "Élie vint à Horeb en dernier. Fuyant Jézabel, il marcha « quarante jours et quarante nuits jusqu’à la montagne de Dieu, à Horeb », logea dans une caverne, et trouva l’Éternel non dans le vent, le tremblement de terre ou le feu mais dans « un murmure doux et léger ». Le Psaume 106 rappelle le veau fait « en Horeb », et Malachie clôt les prophètes par « la loi de Moïse, mon serviteur, auquel j’ai prescrit en Horeb ». Le Nouveau Testament n’emploie que le nom de Sinaï."
    - "Les pèlerins chrétiens gardèrent les deux noms distincts sur le seul massif. Égérie, vers 383, après avoir gravi le sommet du Sinaï, redescendit à l’église d’Horeb, où Élie passait pour s’être caché dans la caverne, et une chapelle d’Élie se dresse encore sur la selle sous le pic du djebel Moussa. L’Onomasticon d’Eusèbe place Horeb, la montagne de Dieu, à côté du mont Sinaï, et Jérôme, le traduisant, ajouta que la même montagne lui semblait porter les deux noms."
  it:
    - "Oreb è l’altro nome del monte di Dio, quello che il Deuteronomio usa quasi sempre, dove l’Esodo dal capitolo 19 in poi, il Levitico e i Numeri dicono Sinai. L’Esodo stesso usa entrambi: Mosè giunse con il gregge di Ietro «alla montagna di Dio, a Horeb», e il popolo si spogliò degli ornamenti «dalla partenza dal monte Horeb in poi» dopo il vitello d’oro. Il nome è di solito inteso «arido» o «desolato». La maggior parte dei lettori della Bibbia ha considerato Oreb e Sinai un solo monte; alcuni suggeriscono che l’Oreb fosse il massiccio o la regione più ampia e il Sinai la cima, e i critici del Pentateuco assegnano i due nomi a filoni diversi del testo. Il monte è cercato al Jebel Musa, nel sud della penisola del Sinai, dal IV secolo, benché si propongano altri siti."
    - "Con questo nome la Bibbia narra del roveto ardente, dove Dio promise a Mosè: «voi servirete Iddio su questo monte»; della roccia in Oreb che Mosè percosse a Refidim perché ne uscisse acqua; e, nel Deuteronomio, del «giorno che comparisti davanti all’Eterno, all’Iddio tuo, in Horeb», quando Israele udì una voce di mezzo al fuoco ma «non vedeste alcuna figura», chiese di non udirla più e ricevette l’alleanza: «L’Eterno, l’Iddio nostro, fermò con noi un patto in Horeb». Il Deuteronomio conta undici giornate dall’Oreb a Kades-Barnea per la via del Monte Seir, e pone l’alleanza fatta in Moab accanto a quella dell’Oreb. I sacerdoti di Salomone trovarono nell’arca solo «le due tavole di pietra che Mosè vi avea deposte sullo Horeb»."
    - "Elia giunse per ultimo all’Oreb. Fuggendo Gezabele, camminò «quaranta giorni e quaranta notti fino a Horeb, il monte di Dio», alloggiò in una caverna e trovò l’Eterno non nel vento, nel terremoto o nel fuoco ma in «un suono dolce e sommesso». Il Salmo 106 ricorda il vitello fatto «in Horeb», e Malachia chiude i profeti con «la legge di Mosè, mio servo, al quale io diedi in Horeb». Il Nuovo Testamento usa solo il nome Sinai."
    - "I pellegrini cristiani tennero distinti i due nomi sullo stesso massiccio. Egeria, verso il 383, dopo aver salito la cima del Sinai, scese alla chiesa sull’Oreb, dove si diceva che Elia si fosse nascosto nella caverna, e una cappella di Elia sorge ancora sulla sella sotto la vetta del Jebel Musa. L’Onomasticon di Eusebio pone l’Oreb, il monte di Dio, accanto al Monte Sinai, e Girolamo, traducendolo, aggiunse che gli pareva che lo stesso monte fosse chiamato con i due nomi."
  pl:
    - "Horeb to inna nazwa góry Bożej, której Księga Powtórzonego Prawa używa niemal przez cały czas, tam gdzie Księga Wyjścia od rozdziału 19, Księga Kapłańska i Księga Liczb mówią Synaj. Sama Księga Wyjścia używa obu: Mojżesz przyszedł z trzodą Jetra „do góry Bożej, do Horeb”, a lud zdjął ozdoby „przy górze Horeb” po złotym cielcu. Nazwę rozumie się zwykle jako „sucha” albo „pustkowie”. Większość czytelników Biblii uważała Horeb i Synaj za jedną górę; niektórzy sugerują, że Horeb było szerszym masywem lub krainą, a Synaj szczytem, a krytycy Pięcioksięgu przypisują obie nazwy różnym warstwom tekstu. Góry szuka się w Dżabal Musa na południu półwyspu Synaj od IV w., choć proponowane są inne miejsca."
    - "Pod tą nazwą Biblia opowiada o płonącym krzewie, gdzie Bóg obiecał Mojżeszowi: „będziecie służyć Bogu na tej górze”; o skale w Horeb, którą Mojżesz uderzył w Refidim, tak że wyszła woda; i, w Księdze Powtórzonego Prawa, o dniu, o którym mowa: „żeś onego dnia stał przed oblicznością Pana, Boga twego, na Horeb”, gdy Izrael usłyszał głos z ognia, ale „podobieństwa żadnego nie widzieli”, prosił, by nie słyszeć go więcej, i otrzymał przymierze: „Pan, Bóg nasz, uczynił z nami przymierze na górze Horeb.” Księga Powtórzonego Prawa liczy jedenaście dni od Horebu do Kadesz-Barnea przez górę Seir i stawia przymierze zawarte w Moabie obok tego z Horebu. Kapłani Salomona znaleźli w arce tylko „dwie tablice kamienne, które tam był schował Mojżesz na Horebie”."
    - "Eliasz przyszedł do Horeb jako ostatni. Uciekając przed Izebel, szedł „czterdzieści dni i czterdzieści nocy, aż do góry Bożej Horeb”, zanocował w jaskini i znalazł Pana nie w wichrze, trzęsieniu ziemi ani ogniu: za ogniem był „głos cichy i wolny”. Psalm 106 wspomina cielca uczynionego „na Horebie”, a Malachiasz zamyka proroków słowami: „zakon Mojżesza, sługi mego, któremum rozkazał na Horebie”. Nowy Testament używa tylko nazwy Synaj."
    - "Pielgrzymi chrześcijańscy rozróżniali oba imiona na jednym masywie. Egeria, około 383 r., po wejściu na szczyt Synaju zeszła do kościoła na Horebie, gdzie miał się ukryć w jaskini Eliasz, a kaplica Eliasza wciąż stoi na siodle poniżej szczytu Dżabal Musa. Onomastykon Euzebiusza umieszcza Horeb, górę Bożą, obok góry Synaj, a Hieronim, tłumacząc go, dodał, że ta sama góra zdaje mu się nazywana tymi dwoma imionami."
  nl:
    - "Horeb is de andere naam van de berg Gods, die Deuteronomium bijna overal gebruikt, waar Exodus vanaf hoofdstuk 19, Leviticus en Numeri Sinaï zeggen. Exodus zelf gebruikt beide: Mozes kwam met Jethro's kudde “aan den berg Gods, aan Horeb”, en het volk legde na het gouden kalf zijn sieraden af, “verre van den berg Horeb”. De naam wordt gewoonlijk opgevat als “droog” of “verlaten”. De meeste lezers van de Bijbel hebben Horeb en Sinaï voor één berg gehouden; sommigen stellen dat Horeb het bredere massief of de streek was en Sinaï de piek, en critici van de Pentateuch wijzen de twee namen toe aan verschillende lagen van de tekst. De berg wordt sinds de vierde eeuw gezocht bij de Jebel Musa in het zuiden van het schiereiland Sinaï, hoewel andere plaatsen worden voorgesteld."
    - "Onder deze naam vertelt de Bijbel van de brandende braambos, waar God Mozes beloofde: “zult gijlieden God dienen op dezen berg”; van de rots in Horeb die Mozes bij Refidim sloeg zodat er water uitkwam; en, in Deuteronomium, van “Ten dage, als gij voor het aangezicht des HEEREN, uws Gods, aan Horeb stondt”, toen Israël een stem uit het vuur hoorde, maar: “gij hebt geen gelijkenis gezien”; het vroeg haar niet opnieuw te horen en ontving het verbond: “De HEERE, onze God, heeft een verbond met ons gemaakt aan Horeb.” Deuteronomium telt elf dagen van Horeb naar Kades-Barnea over de berg Seïr, en zet het verbond in Moab naast dat bij Horeb. Salomo's priesters vonden in de ark alleen “de twee stenen tafelen, die Mozes bij Horeb daarin gelegd had”."
    - "Elia kwam het laatst bij de Horeb. Op de vlucht voor Izebel liep hij “veertig dagen en veertig nachten, tot aan den berg Gods, Horeb”, overnachtte in een grot, en vond de HEER niet in de wind, de aardbeving of het vuur maar in “het suizen van een zachte stilte”. Psalm 106 gedenkt het kalf gemaakt “bij Horeb”, en Maleachi sluit de profeten af met “der wet van Mozes, Mijn knecht, die Ik hem bevolen heb op Horeb”. Het Nieuwe Testament gebruikt alleen de naam Sinaï."
    - "Christelijke pelgrims hielden de twee namen uiteen op hetzelfde massief. Egeria, omstreeks 383, daalde na de beklimming van de top van de Sinaï af naar de kerk op de Horeb, waar Elia zich in de grot zou hebben verborgen, en een kapel van Elia staat nog op het zadel onder de piek van de Jebel Musa. Eusebius' Onomasticon plaatst de Horeb, de berg Gods, naast de berg Sinaï, en Hiëronymus voegde bij het vertalen toe dat dezelfde berg hem onder de twee namen bekend leek."
  cs:
    - "Choreb je druhé jméno hory Boží, jež Deuteronomium užívá téměř soustavně, kde Exodus od kapitoly 19, Leviticus a Numeri říkají Sinaj. Exodus sám užívá obou: Mojžíš přišel se stádem Jitrovým „k hoře Boží Oréb“ a lid po zlatém telati svlékl ozdoby „u hory Oréb“. Jméno se obvykle vykládá jako „suchý“ nebo „pustý“. Většina čtenářů Bible pokládala Choreb a Sinaj za jednu horu; někteří soudí, že Choreb byl širší masiv či kraj a Sinaj vrchol, a kritikové Pentateuchu přisuzují obě jména různým vrstvám textu. Hora se od 4. století hledá na Jebel Musa na jihu Sinajského poloostrova, ačkoli se navrhují i jiná místa."
    - "Pod tímto jménem vypráví Bible o hořícím keři, kde Bůh Mojžíšovi slíbil: „sloužiti budete Bohu na hoře této“; o skále na Orébě, do níž Mojžíš v Refídimu udeřil, aby vyšla voda; a v Deuteronomiu o Izraeli, o němž Mojžíš praví: „onoho dne stál před Hospodinem Bohem svým na Orébě“; slyšel hlas z ohně, ale podle Mojžíše „neviděli jste žádného obrazu“, prosil, aby ho už neslyšel, a přijal smlouvu: „Hospodin Bůh náš učinil s námi smlouvu na Orébě.“ Deuteronomium počítá jedenáct dní od Orébu do Kádeš-barney přes pohoří Seír a staví smlouvu uzavřenou v Moábu vedle té na Orébě. Šalomounovi kněží nenašli v truhle nic kromě „dvou tabulí kamenných, kteréž tam složil Mojžíš na Orébě“."
    - "Elijáš přišel na Choreb naposled. Prchaje před Jezábel, šel „čtyřidceti dní a čtyřidceti nocí, až na horu Boží Oréb“, přenocoval v jeskyni a nalezl Hospodina ne ve větru, zemětřesení ani ohni; za ohněm byl „hlas tichý a temný“. Žalm 106 připomíná tele udělané „na Orébě“ a Malachiáš uzavírá proroky slovy: „zákon Mojžíše služebníka mého, jemuž jsem přikázal na Orébě“. Nový zákon užívá jen jména Sinaj."
    - "Křesťanští poutníci rozlišovali obě jména na jednom masivu. Egerie, kolem roku 383, po výstupu na vrchol Sinaje sestoupila ke kostelu na Chorebu, kde se prý Elijáš ukryl v jeskyni, a kaple Elijášova dosud stojí na sedle pod vrcholem Jebel Musa. Eusebiův Onomastikon klade Choreb, horu Boží, vedle hory Sinaj a Jeroným, překládaje jej, dodal, že se mu zdá, že touž horu nazývají oběma jmény."
  sv:
    - "Horeb är det andra namnet på Guds berg, det som Femte Mosebok använder nästan genomgående, där Andra Moseboken från kapitel 19 och framåt, Tredje och Fjärde Mosebok säger Sinai. Andra Moseboken använder själv båda: Mose kom med Jetros hjord ”till Guds berg Horeb”, och folket tog av sig sina smycken ”vid Horebs berg” efter guldkalven. Namnet anses vanligen betyda ”torr” eller ”öde”. De flesta läsare av Bibeln har tagit Horeb och Sinai för ett och samma berg; vissa föreslår att Horeb var det vidare bergsmassivet eller området och Sinai toppen, och Pentateukkritiker tilldelar de två namnen olika trådar i texten. Berget har sökts vid Jebel Musa i södra Sinaihalvön sedan 300-talet, fastän andra platser föreslås."
    - "Under detta namn berättas om den brinnande busken, där Gud lovade Mose: ”skolen I hålla gudstjänst på detta berg”; om klippan på Horeb som Mose slog i Refidim så att vatten kom ut; och, i Femte Mosebok, om ”den dag då du stod inför HERREN, din Gud, vid Horeb”, då Israel hörde en röst ur elden men ”icke sågen någon gestalt”, bad att inte få höra den igen och fick förbundet: ”HERREN, vår Gud, slöt ett förbund med oss på Horeb.” Femte Mosebok räknar elva dagar från Horeb till Kadesh-Barnea via Seirs berg och ställer förbundet som slöts i Moab bredvid det vid Horeb. Salomos präster fann i arken endast ”de två stentavlor som Mose hade lagt ned däri vid Horeb”."
    - "Elia kom sist till Horeb. På flykt undan Isebel gick han ”i fyrtio dagar och fyrtio nätter, ända till Guds berg Horeb”, tog in i en grotta, och fann HERREN inte i vinden, jordbävningen eller elden utan i ”ljudet av en sakta susning”. Psalm 106 minns kalven som gjordes ”vid Horeb”, och Malaki avslutar profeterna med ”Moses lag, min tjänares, åt vilken jag på Horeb gav stadgar och rätter för hela Israel”. Nya testamentet använder bara namnet Sinai."
    - "Kristna pilgrimer höll de två namnen isär på samma massiv. Egeria, omkring 383, kom efter att ha bestigit Sinais topp ned till kyrkan på Horeb, där Elia sades ha gömt sig i grottan, och ett Eliakapell står fortfarande på sadeln under toppen av Jebel Musa. Eusebios' Onomastikon placerar Horeb, Guds berg, bredvid berget Sinai, och Hieronymus, som översatte det, tillade att samma berg föreföll honom kallas vid de två namnen."
  nb:
    - "Horeb er det andre navnet på Guds fjell, det Femte Mosebok bruker nesten gjennomgående, der Andre Mosebok fra kapittel 19 og utover, Tredje og Fjerde Mosebok sier Sinai. Andre Mosebok bruker selv begge: Moses kom med Jetros flokk «til Guds berg, til Horeb», og folket tok av seg smykkene «fra fjellet Horeb» etter gullkalven. Navnet regnes vanligvis for å bety «tørr» eller «øde». De fleste av Bibelens lesere har tatt Horeb og Sinai for ett fjell; noen antyder at Horeb var det videre fjellmassivet eller området og Sinai toppen, og Pentateukkritikere fordeler de to navnene på forskjellige tråder i teksten. Fjellet har vært søkt ved Jebel Musa i sør på Sinai-halvøya siden 300-tallet, selv om andre steder foreslås."
    - "Under dette navnet forteller Bibelen om den brennende tornebusken, der Gud lovte Moses: «da skal I holde gudstjeneste på dette fjell»; om klippen ved Horeb som Moses slo ved Refidim så vann kom ut; og, i Femte Mosebok, om «den dag du stod for Herrens, din Guds åsyn ved Horeb», da Israel hørte en røst midt ut av ilden, men «I så ingen skikkelse», ba om ikke å høre den igjen og mottok pakten: «Herren vår Gud gjorde en pakt med oss på Horeb.» Femte Mosebok regner elleve dagsreiser fra Horeb til Kadesj-Barnea via Seirfjellet, og setter pakten sluttet i Moab ved siden av den ved Horeb. Salomos prester fant i arken bare «de to stentavler som Moses hadde lagt ned der ved Horeb»."
    - "Elia kom til Horeb sist. På flukt fra Jesabel «gikk han firti dager og firti netter, til han kom til Guds berg, Horeb», overnattet i en hule og fant Herren ikke i vinden, jordskjelvet eller ilden, men i «lyden av en stille susen». Salme 106 minner om kalven laget «ved Horeb», og Malaki avslutter profetene med «Mose, min tjeners lov, som jeg gav ham på Horeb for hele Israel». Det nye testamente bruker bare navnet Sinai."
    - "Kristne pilegrimer holdt de to navnene fra hverandre på det ene massivet. Egeria, omkring 383, kom etter å ha besteget toppen av Sinai ned til kirken på Horeb, der Elia skulle ha skjult seg i hulen, og et Elia-kapell står fortsatt på sadelen under toppen av Jebel Musa. Eusebius' Onomasticon plasserer Horeb, Guds fjell, ved siden av Sinai, og Hieronymus la, da han oversatte det, til at det samme fjellet syntes ham å bli kalt ved de to navnene."
