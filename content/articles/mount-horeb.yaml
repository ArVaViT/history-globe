# Overview article (ADR 0007). Mainstream facts only; Horeb is treated as the Bible's other name for Sinai, and the views that separate the two are named; the site itself is covered in the Mount Sinai article.
id: mount-horeb
place: a9bb03e
title:
  en: "Mount Horeb"
  ru: "Гора Хорив"
body:
  en:
    - "Horeb is the other name of the mountain of God, the one Deuteronomy uses almost throughout, where Exodus from chapter 19 onward, Leviticus and Numbers say Sinai. Exodus itself uses both: Moses came with Jethro's flock “to the mountain of God, even to Horeb”, and the people stripped off their ornaments “by the mount Horeb” after the golden calf. The name is usually taken to mean “dry” or “desolate”. Most readers of the Bible have taken Horeb and Sinai as one mountain; some suggest that Horeb was the wider massif or region and Sinai the peak, and critics of the Pentateuch assign the two names to different strands of the text. The mountain has been sought at Jebel Musa in the south of the Sinai peninsula since the fourth century, though other sites are proposed."
    - "Under this name the Bible tells of the burning bush, where God promised Moses, “ye shall serve God upon this mountain”; of the rock in Horeb that Moses struck at Rephidim so that water came out; and, in Deuteronomy, of “the day that thou stoodest before the LORD thy God in Horeb”, when Israel heard a voice out of the fire but “saw no manner of similitude”, asked not to hear it again, and received the covenant: “The LORD our God made a covenant with us in Horeb.” Deuteronomy counts eleven days from Horeb to Kadesh-barnea by way of Mount Seir, and sets the covenant made in Moab beside the one at Horeb. Solomon's priests found in the ark only “the two tables of stone, which Moses put there at Horeb”."
    - "Elijah came to Horeb last. Fleeing Jezebel, he walked “forty days and forty nights unto Horeb the mount of God”, lodged in a cave, and found the LORD not in the wind, the earthquake or the fire but in “a still small voice”. Psalm 106 remembers the calf made “in Horeb”, and Malachi closes the prophets with “the law of Moses my servant, which I commanded unto him in Horeb”. The New Testament uses only the name Sinai."
    - "Christian pilgrims kept the two names apart on the one massif. Egeria, about 383, after climbing the summit of Sinai, came down to the church on Horeb, where Elijah was said to have hidden in the cave, and a chapel of Elijah still stands on the saddle below the peak of Jebel Musa. Eusebius' Onomasticon places Horeb, the mountain of God, beside Mount Sinai, and Jerome, translating it, added that the same mountain seemed to him to be called by the two names."
  ru:
    - "Хорив — второе имя горы Божией; им почти всюду пользуется Второзаконие, тогда как Исход с 19-й главы, Левит и Числа говорят «Синай». Сама книга Исход употребляет оба: Моисей пришёл со стадом Иофора «к горе Божией, Хориву», а народ после золотого тельца снял украшения «у горы Хорива». Имя обычно толкуют как «сухая» или «пустынная». Большинство читателей Библии считали Хорив и Синай одной горой; некоторые предполагают, что Хорив — весь массив или местность, а Синай — вершина, а критики Пятикнижия относят два имени к разным пластам текста. С IV века гору ищут на Джебель-Муса на юге Синайского полуострова, хотя предлагались и другие места."
    - "Под этим именем Библия рассказывает о горящем кусте, где Бог обещал Моисею: «вы совершите служение Богу на этой горе»; о скале в Хориве, которую Моисей ударил в Рефидиме, так что из неё пошла вода; и, во Второзаконии, о том дне, «когда ты стоял пред Господом, Богом твоим, при Хориве», когда Израиль слышал голос из огня, но не видел «никакого образа», просил не слышать его больше и получил завет: «Господь, Бог наш, поставил с нами завет на Хориве». Второзаконие считает одиннадцать дней пути от Хорива до Кадес-Варни по дороге от горы Сеир и ставит завет, заключённый в Моаве, рядом с заветом на Хориве. В ковчеге при Соломоне не было ничего, «кроме двух каменных скрижалей, которые положил туда Моисей на Хориве»."
    - "Последним к Хориву пришёл Илия. Спасаясь от Иезавели, он шёл «сорок дней и сорок ночей до горы Божией Хорива», ночевал в пещере и встретил Господа не в ветре, не в землетрясении и не в огне: «после огня веяние тихого ветра, и там Господь». 105-й псалом вспоминает тельца, сделанного «у Хорива», а Малахия завершает пророков словами о законе Моисея, «который Я заповедал ему на Хориве». Новый Завет знает только имя Синай."
    - "Христианские паломники разводили два имени по одному массиву. Эгерия около 383 г., поднявшись на вершину Синая, спустилась к церкви на Хориве, где, как говорили, скрывался в пещере Илия, и часовня Илии до сих пор стоит на седловине под вершиной Джебель-Муса. «Ономастикон» Евсевия помещает Хорив, гору Божию, рядом с горой Синай, а Иероним, переводя его, добавил, что, по его мнению, одна и та же гора носит два имени."
