body:
  en:
    - "Hannathon was a town of Lower Galilee on the northern border of Zebulun: “the border compasseth it on the north side to Hannathon: and the outgoings thereof are in the valley of Jiphthah-el”. Albrecht Alt identified it with Tel Hanaton (Tell el-Badawiya), among the largest archaeological sites of northern Israel, on the western edge of the Beit Netofa valley, by the old road that linked the Hauran with the plain of Acco. It is named only here in the Bible."
    - "As Hinnatuna it appears in the Amarna letters of the fourteenth century BC. Burna-Buriash of Babylon complained to the pharaoh that his merchants had been killed and robbed at Hinnatuna in Canaan by Šum-Adda and Šutatna of Acco, and in a letter of Biridiya of Megiddo (EA 245) Hinnatuna is where the captured Labaya was let go to his home. The town appears later in the annals of Tiglath-pileser III among the places of Galilee he took in the eighth century BC. The Tell el-Badawiya/Hannathon Archaeological Project of Ben-Gurion University, the Israel Antiquities Authority and Leipzig University, led by Assaf Kleiman with Angelika Berlejung, is now excavating the mound."
  ru:
    - "Ханнафон — город Нижней Галилеи на северной границе Завулона: «поворачивает предел от севера к Ханнафону и оканчивается долиною Ифтах-Ел». Альбрехт Альт отождествил его с Тель-Ханатоном (Телль-эль-Бадавия), одним из крупнейших археологических памятников севера Израиля, на западном краю долины Бейт-Нетофа, у старой дороги, соединявшей Хауран с равниной Акко. В Библии он назван только здесь."
    - "Под именем Хиннатуна он встречается в амарнских письмах XIV в. до н. э. Бурна-Буриаш Вавилонский жаловался фараону, что его купцов перебили и ограбили при Хиннатуне в Ханаане Шум-Адда и Шутатна из Акко, а в письме Бирийди из Мегиддо (EA 245) именно из Хиннатуны пленённого Лабайю отпустили домой. Позже город упомянут в анналах Тиглатпаласара III среди мест Галилеи, взятых им в VIII в. до н. э. Сейчас холм раскапывает совместный проект Университета имени Бен-Гуриона, Управления древностей Израиля и Лейпцигского университета под руководством Асафа Кляймана и Ангелики Берлеюнг."
  de:
    - "Hannaton war eine Stadt in Untergaliläa an der Nordgrenze Sebulons: „und lenkt sich herum mitternachtwärts gen Hannathon und endet im Tal Jephthah-El“. Albrecht Alt setzte es mit Tel Hanaton (Tell el-Badawije) gleich, einer der größten archäologischen Stätten Nordisraels, am Westrand des Bet-Netofa-Tals, an der alten Straße, die den Hauran mit der Ebene von Akko verband. Es wird in der Bibel nur hier genannt."
    - "Als Hinnatuna erscheint es in den Amarna-Briefen des vierzehnten Jahrhunderts v. Chr. Burna-Burijasch von Babylon beklagte sich beim Pharao, seine Kaufleute seien in Hinnatuna in Kanaan von Schum-Adda und Schutatna von Akko getötet und beraubt worden, und in einem Brief des Biridija von Megiddo (EA 245) ist Hinnatuna der Ort, wo der gefangene Labaja nach Hause entlassen wurde. Später erscheint die Stadt in den Annalen Tiglat-Pilesers III. unter den galiläischen Orten, die er im achten Jahrhundert v. Chr. nahm. Das Tell el-Badawije/Hannaton Archaeological Project der Ben-Gurion-Universität, der israelischen Altertümerbehörde und der Universität Leipzig, geleitet von Assaf Kleiman mit Angelika Berlejung, gräbt jetzt den Hügel aus."
  fr:
    - "Hannathon était une ville de Basse Galilée sur la frontière nord de Zabulon : « Elle tournait ensuite du côté du nord vers Hannathon, et aboutissait à la vallée de Jiphthach-El. » Albrecht Alt l’identifia avec Tel Hanaton (Tell el-Badawiya), l’un des plus grands sites archéologiques du nord d’Israël, au bord ouest de la vallée de Beit Netofa, près de l’ancienne route qui reliait le Havran à la plaine d’Acco. Elle n’est nommée qu’ici dans la Bible."
    - "Sous la forme Hinnatuna, elle apparaît dans les lettres d’Amarna du XIVe siècle av. J.-C. Burna-Buriash de Babylone se plaignit au pharaon que ses marchands avaient été tués et dépouillés à Hinnatuna, en Canaan, par Shum-Adda et Shutatna d’Acco, et dans une lettre de Biridiya de Meguiddo (EA 245), Hinnatuna est le lieu où le captif Labaya fut relâché pour rentrer chez lui. La ville paraît plus tard dans les annales de Tiglath-Piléser III parmi les places de Galilée qu’il prit au VIIIe siècle av. J.-C. Le Tell el-Badawiya/Hannathon Archaeological Project de l’université Ben-Gourion, de l’Autorité des antiquités d’Israël et de l’université de Leipzig, dirigé par Assaf Kleiman avec Angelika Berlejung, fouille aujourd’hui la butte."
  pt:
    - "Hanatom era uma cidade da Baixa Galileia, na fronteira norte de Zebulom: “A fronteira contornava pelo norte até Hanatom; e terminava no vale de Iftá-El”. Albrecht Alt a identificou com Tel Hanaton (Tell el-Badawiya), entre os maiores sítios arqueológicos do norte de Israel, na borda ocidental do vale de Beit Netofa, junto à antiga estrada que ligava o Haurã à planície de Aco. É nomeada somente aqui na Bíblia."
    - "Como Hinnatuna, aparece nas cartas de Amarna do século XIV a.C. Burna-Buriash da Babilônia queixou-se ao faraó de que seus mercadores haviam sido mortos e roubados em Hinnatuna, em Canaã, por Shum-Adda e por Shutatna de Aco, e numa carta de Biridiya de Megido (EA 245) Hinnatuna é o lugar onde o capturado Labaia foi solto para voltar para casa. A cidade aparece mais tarde nos anais de Tiglate-Pileser III entre os lugares da Galileia que ele tomou no século VIII a.C. O Tell el-Badawiya/Hannathon Archaeological Project da Universidade Ben-Gurion, da Autoridade de Antiguidades de Israel e da Universidade de Leipzig, liderado por Assaf Kleiman com Angelika Berlejung, escava agora o montículo."
  it:
    - "Cannaton era una città della Galilea inferiore sul confine settentrionale di Zabulon: «il confine girava dal lato di settentrione verso Hannathon, e facea capo alla valle d’Iftah-El». Albrecht Alt la identificò con Tel Hanaton (Tell el-Badawiya), tra i maggiori siti archeologici del nord di Israele, sul margine occidentale della valle di Bet Netofa, lungo l’antica strada che univa l’Auran alla piana di Acco. È nominata solo qui nella Bibbia."
    - "Come Hinnatuna compare nelle lettere di Amarna del XIV secolo a.C. Burnaburiash di Babilonia si lamentò con il faraone che i suoi mercanti erano stati uccisi e derubati a Hinnatuna, in Canaan, da Šum-Adda e Šutatna di Acco, e in una lettera di Biridiya di Meghiddo (EA 245) Hinnatuna è il luogo dove il prigioniero Labaya fu lasciato andare a casa sua. La città compare più tardi negli annali di Tiglat-Pileser III tra i luoghi della Galilea da lui presi nell’VIII secolo a.C. Il Tell el-Badawiya/Hannathon Archaeological Project della Ben-Gurion University, dell’Israel Antiquities Authority e della Leipzig University, diretto da Assaf Kleiman con Angelika Berlejung, scava ora il tell."
  nl:
    - "Channaton was een stad in Neder-Galilea op de noordgrens van Zebulon: “deze landpale keert zich om tegen het noorden naar Hannathon, en haar uitgangen zijn het dal van Jiftah-El”. Albrecht Alt vereenzelvigde het met Tel Hanaton (Tell el-Badawiya), een van de grootste archeologische plaatsen van het noorden van Israël, aan de westrand van de vallei van Beit Netofa, bij de oude weg die de Hauran met de vlakte van Akko verbond. Het wordt in de Bijbel alleen hier genoemd."
    - "Als Hinnatuna komt het voor in de Amarnabrieven uit de veertiende eeuw v.Chr. Burna-Buriash van Babylon klaagde bij de farao dat zijn kooplieden bij Hinnatuna in Kanaän waren gedood en beroofd door Šum-Adda en Šutatna van Akko, en in een brief van Biridiya van Megiddo (EA 245) is Hinnatuna de plaats waar de gevangen Labaya werd vrijgelaten om naar huis te gaan. De stad komt later voor in de annalen van Tiglat-Pileser III onder de plaatsen in Galilea die hij in de achtste eeuw v.Chr. innam. Het Tell el-Badawiya/Hannathon Archaeological Project van de Ben-Goerion-universiteit, de Israel Antiquities Authority en de Universiteit Leipzig, geleid door Assaf Kleiman met Angelika Berlejung, graaft thans op de heuvel."
  pl:
    - "Channaton było miastem Dolnej Galilei na północnej granicy Zabulona: „Idzie także kołem taż granica od północy ku Hannaton, a kończy się u doliny Jeftael”. Albrecht Alt utożsamił je z Tel Hanaton (Tell el-Badawija), jednym z największych stanowisk archeologicznych północnego Izraela, na zachodnim skraju doliny Bet Netofa, przy starej drodze łączącej Hauran z równiną Akko. Jest wymienione w Biblii tylko tu."
    - "Jako Hinnatuna pojawia się w listach z Amarna z XIV w. p.n.e. Burnaburiasz z Babilonu skarżył się faraonowi, że jego kupców zabito i obrabowano w Hinnatuna w Kanaanie, a uczynili to Šum-Adda i Šutatna z Akko, a w liście Biridiji z Megiddo (EA 245) Hinnatuna to miejsce, gdzie schwytanego Labaję puszczono do domu. Miasto pojawia się później w annałach Tiglat-Pilesera III wśród miejscowości Galilei zdobytych w VIII w. p.n.e. Tell el-Badawiya/Hannathon Archaeological Project Uniwersytetu Ben Guriona, Izraelskiej Służby Starożytności i Uniwersytetu w Lipsku, kierowany przez Assafa Kleimana wraz z Angeliką Berlejung, bada obecnie to wzgórze."
  uk:
    - "Ханнатон був містом Нижньої Галілеї на північній межі Завулона: «Тодї повертає від півночі на Ханнатон, а кінчається в Іфтах-Ел долинї». Альбрехт Альт ототожнив його з Тель-Ханатоном (Телль-ель-Бадавія), одним з найбільших археологічних місць півночі Ізраїлю, на західному краю долини Бейт-Нетофа, біля старої дороги, що пов'язувала Хавран із рівниною Акко. У Біблії він названий лише тут."
    - "Як Хіннатуна він з'являється в амарнських листах XIV ст. до н. е. Бурна-Буріаш Вавилонський скаржився фараонові, що його купців убили й пограбували в Хіннатуні в Ханаані Шум-Адда та Шутатна з Акко, а в листі Бірідії з Мегіддо (EA 245) Хіннатуна — те місце, де полоненого Лабаю відпустили додому. Місто з'являється пізніше в аналах Тіглатпаласара III серед галілейських місць, які він узяв у VIII ст. до н. е. Археологічний проєкт Телль-ель-Бадавія/Ханнатон Університету імені Бен-Гуріона, Управління старожитностей Ізраїлю та Лейпцизького університету, очолюваний Ассафом Клейманом разом з Ангелікою Берляйнг, нині розкопує пагорб."
  cs:
    - "Chananon bylo město Dolní Galileje na severní hranici Zebulunu: „Točí se také táž meze od půlnoci do Anaton, a dochází až k údolí Jeftael“. Albrecht Alt je ztotožnil s Tel Chanaton (Tell el-Badawíja), jedním z největších archeologických nalezišť severního Izraele, na západním okraji údolí Bejt Netofa, u staré cesty, která spojovala Havran s rovinou Akko. V Bibli je jmenováno jen zde."
    - "Jako Hinnatuna se objevuje v amarnských listech ze čtrnáctého století př. n. l. Burna-Buriaš Babylonský si stěžoval faraonovi, že jeho kupci byli v Hinnatuně v Kanaánu zabiti a oloupeni Šum-Addou a Šutatnou z Akka, a v listu Biridije z Megida (EA 245) je Hinnatuna místem, kde byl zajatý Labaja propuštěn domů. Město se později objevuje v análech Tiglatpilesara III. mezi galilejskými místy, která dobyl v osmém století př. n. l. Pahorek nyní kopá projekt Tell el-Badawíja/Chananon Univerzity Ben Guriona, Izraelského úřadu pro starožitnosti a Lipské univerzity, vedený Assafem Kleimanem s Angelikou Berlejung."
  es:
    - "Hanatón era una ciudad de la Baja Galilea en la frontera septentrional de Zabulón: «torna este término al norte á Hanatón, viniendo á salir al valle de Iphtael». Albrecht Alt la identificó con Tel Hanaton (Tell el-Badawiya), uno de los mayores yacimientos arqueológicos del norte de Israel, en el borde occidental del valle de Beit Netofa, junto al antiguo camino que unía el Haurán con la llanura de Aco. Solo se nombra aquí en la Biblia."
    - "Como Hinnatuna aparece en las cartas de Amarna del siglo XIV a. C. Burna-Buriash de Babilonia se quejó al faraón de que sus mercaderes habían sido muertos y robados en Hinnatuna, en Canaán, por Shum-Adda y Shutatna de Aco, y en una carta de Biridiya de Meguido (EA 245) Hinnatuna es el lugar donde fue dejado marchar a su casa el capturado Labaya. La ciudad aparece más tarde en los anales de Tiglat-pileser III entre los lugares de Galilea que tomó en el siglo VIII a. C. El Tell el-Badawiya/Hannathon Archaeological Project de la Universidad Ben Gurión, la Autoridad de Antigüedades de Israel y la Universidad de Leipzig, dirigido por Assaf Kleiman con Angelika Berlejung, excava ahora el montículo."
  sv:
    - "Hannaton var en stad i nedre Galileen vid Sebulons norra gräns: ”böjde sig gränsen i norr till Hannaton och gick så ut vid Jifta-Els dal”. Albrecht Alt identifierade den med Tel Hanaton (Tell el-Badawiya), en av de största arkeologiska platserna i norra Israel, i västra kanten av Beit Netofa-dalen, vid den gamla vägen som förband Hauran med Ackoslätten. Den nämns bara här i Bibeln."
    - "Som Hinnatuna förekommer den i Amarnabreven från 1300-talet f.Kr. Burna-Buriash av Babylon klagade hos farao över att hans köpmän hade dödats och rånats i Hinnatuna i Kanaan av Šum-Adda och Šutatna av Acko, och i ett brev från Biridiya av Megiddo (EA 245) är Hinnatuna platsen där den fångne Labaya släpptes hem. Staden förekommer senare i Tiglat-Pileser III:s annaler bland de galileiska platser han intog på 700-talet f.Kr. Tell el-Badawiya/Hannathon Archaeological Project, som drivs av Ben-Gurion-universitetet, Israels fornminnesmyndighet och Leipzigs universitet under ledning av Assaf Kleiman och Angelika Berlejung, gräver nu ut kullen."
  nb:
    - "Hannaton var en by i nedre Galilea på Sebulons nordgrense: «svinget grensen omkring dette sted nordover til Hannaton og endte i Jiftah-El-dalen». Albrecht Alt identifiserte den med Tel Hanaton (Tell el-Badawiya), blant de største arkeologiske stedene i det nordlige Israel, i vestkanten av Bet Netofa-dalen, ved den gamle veien som forbandt Havran med Akko-sletten. Den nevnes bare her i Bibelen."
    - "Som Hinnatuna forekommer den i Amarna-brevene fra 1300-tallet f.Kr. Burna-Buriasj av Babylon klaget til farao over at hans kjøpmenn var blitt drept og ranet i Hinnatuna i Kanaan av Sjum-Adda og Sjutatna av Akko, og i et brev fra Biridiya av Megiddo (EA 245) er Hinnatuna stedet hvor den fangede Labaja ble sluppet løs til sitt hjem. Byen dukker senere opp i annalene til Tiglat-Pileser 3. blant stedene i Galilea han tok på 700-tallet f.Kr. Tell el-Badawiya/Hannathon Archaeological Project ved Ben-Gurion-universitetet, Israels oldsaksmyndighet og Universitetet i Leipzig, ledet av Assaf Kleiman sammen med Angelika Berlejung, gjør nå utgravninger på haugen."
  tl:
    - "Ang Hanaton ay bayan ng Mababang Galilea sa hilagang hangganan ng Zabulon: “ang hangganan ay paliko sa hilagaan na patungo sa Hanaton: at ang labasan niyaon ay sa libis ng Iphta-el”. Kinilala ito ni Albrecht Alt sa Tel Hanaton (Tell el-Badawiya), isa sa pinakamalalaking pook-arkeolohiko ng hilagang Israel, sa kanlurang gilid ng libis ng Beit Netofa, sa tabi ng lumang daang nag-ugnay sa Hauran at sa kapatagan ng Acho. Dito lamang ito pinangalanan sa Biblia."
    - "Bilang Hinnatuna ay lumilitaw ito sa mga liham ng Amarna noong ika-14 na siglo BK. Nagreklamo si Burna-Buriash ng Babilonia sa Faraon na ang kaniyang mga mangangalakal ay pinatay at ninakawan sa Hinnatuna sa Canaan nina Šum-Adda at Šutatna ng Acho, at sa isang liham ni Biridiya ng Megiddo (EA 245) ang Hinnatuna ang pinagpalayaan sa nabihag na si Labaya pauwi. Lumilitaw ang bayan kalaunan sa mga annal ni Tiglath-pileser III kasama ng mga lugar ng Galilea na kinuha niya noong ika-8 siglo BK. Ang Tell el-Badawiya/Hannathon Archaeological Project ng Pamantasang Ben-Gurion, ng Israel Antiquities Authority at ng Pamantasan ng Leipzig, na pinamumunuan ni Assaf Kleiman kasama si Angelika Berlejung, ang naghuhukay ngayon sa burol."
  da:
    - "Hannaton var en by i Nedre Galilæa på Zebulons nordgrænse: »Og Landemærket gaar omkring den mod Nord til Hannathon; og dets Udgang er i Jiftha-Els Dal«. Albrecht Alt identificerede den med Tel Hanaton (Tell el-Badawiya), blandt de største arkæologiske steder i det nordlige Israel, ved den vestlige kant af Beit Netofa-dalen, ved den gamle vej, der forbandt Hauran med Akko-sletten. Den nævnes kun her i Bibelen."
    - "Som Hinnatuna optræder den i Amarna-brevene fra 1300-tallet f.Kr. Burna-Buriash af Babylon klagede til faraoen over, at hans købmænd var blevet dræbt og plyndret ved Hinnatuna i Kana'an af Šum-Adda og Šutatna af Akko, og i et brev fra Biridiya af Megiddo (EA 245) er Hinnatuna det sted, hvor den tilfangetagne Labaya blev sluppet hjem. Byen optræder senere i Tiglat-Pileser III's annaler blandt de steder i Galilæa, han tog i 700-tallet f.Kr. Tell el-Badawiya/Hannathon Archaeological Project fra Ben-Gurion Universitetet, Israels Oldsagsmyndighed og Leipzig Universitet, ledet af Assaf Kleiman sammen med Angelika Berlejung, udgraver nu højen."
scripture:
  - Josh.19.14
