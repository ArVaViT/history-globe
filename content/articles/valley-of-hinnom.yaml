# Overview article (ADR 0007). Mainstream facts only; the rubbish-dump story of Gehenna is named as a medieval tradition without ancient evidence.
id: valley-of-hinnom
place: a37c8e6
title:
  en: "Valley of Hinnom"
  ru: "Долина Еннома"
  uk: "Долина Гінном"
  es: "Valle de Hinnom"
  pt: "Vale de Hinom"
  de: "Hinnomtal"
  fr: "Vallée de Hinnom"
  pl: "Dolina Hinnom"
  it: "Valle di Innom"
  nl: "Dal van Hinnom"
  cs: "Hinómovo údolí"
  sv: "Hinnoms dal"
  nb: "Hinnom-dalen"
  tl: "Libis ng Hinnom"
  da: "Hinnoms Dal"
  sr: "Долина Еномова"
  hu: "Hinnom-völgy"
