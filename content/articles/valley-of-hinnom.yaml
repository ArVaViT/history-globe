# Overview article (ADR 0007). Mainstream facts only; the rubbish-dump story of Gehenna is named as a medieval tradition without ancient evidence.
id: valley-of-hinnom
place: a37c8e6
title:
  en: "Valley of Hinnom"
  ru: "Долина Еннома"
  uk: "Долина Гінном"
  es: "Valle de Hinnom"
  pt: "Vale de Hinom"
  de: "Hinnomtal"
  fr: "Vallée de Hinnom"
  pl: "Dolina Hinnom"
  it: "Valle di Innom"
  nl: "Dal van Hinnom"
  cs: "Hinómovo údolí"
  sv: "Hinnoms dal"
  nb: "Hinnom-dalen"
body:
  en:
    - "The Valley of Hinnom, in Hebrew Ge Ben-Hinnom, “the valley of the son of Hinnom”, curves round the west and south of Jerusalem's Old City, from below the Jaffa Gate to its meeting with the Kidron beneath Siloam; its Arabic name is Wadi er-Rababi. Joshua runs the border of Judah and Benjamin along it, so that the Jebusite city lay just inside Benjamin. In the last centuries of the kingdom its slopes held tombs: at Ketef Hinnom, on the shoulder above the valley, Gabriel Barkay found in 1979 two tiny silver scrolls of about 600 BC inscribed with the priestly blessing of Numbers, the oldest known text of Scripture."
    - "Here was Tophet, where children were burnt. Ahaz “burnt his children in the fire” in the valley, and Manasseh did the same; Jeremiah accuses Judah of building “the high places of Tophet, which is in the valley of the son of Hinnom, to burn their sons and their daughters in the fire; which I commanded them not”, and of high places of Baal there for Molech. He broke a potter's jar at its gate and foretold that it would be called “the valley of slaughter”, where men would bury “till there be no place”. Josiah “defiled Topheth ... that no man might make his son or his daughter to pass through the fire to Molech”. After the exile the people of Judah lived “from Beer-sheba unto the valley of Hinnom”."
    - "From the Aramaic Ge-hinnam came the Greek Geenna, Gehenna, by Jesus' day the name of the place of fiery punishment after death. “whosoever shall say, Thou fool, shall be in danger of hell fire”; fear him “which is able to destroy both soul and body in hell”; better to enter life maimed than “to go into hell, into the fire that never shall be quenched”. The familiar notion that the valley was the city's ever-burning rubbish dump comes from a medieval commentator, David Kimhi, and has no ancient support. Christian tradition set Aceldama, the field bought with Judas' silver, on its southern slope, where the monastery of St Onuphrius stands among old tombs."
    - "Today the valley, Gei Ben Hinnom, is a green park below Mount Zion and the quarter of Abu Tor, with the Ottoman Sultan's Pool at its head, now a concert ground, and the Ketef Hinnom tombs beside the Menachem Begin Heritage Center."
  ru:
    - "Долина Еннома, по-еврейски Ге Бен-Хинном, долина сына Еннома, огибает Старый город Иерусалима с запада и юга, от подножия Яффских ворот до слияния с Кедроном ниже Силоама; её арабское имя — Вади-эр-Рабаби. Книга Иисуса Навина ведёт по ней границу Иуды и Вениамина, так что город Иевусеев оказывался в самом краю Вениамина. В последние века царства на её склонах были гробницы: в Кетеф-Хинном, на плече над долиной, Габриэль Баркай нашёл в 1979 году два крошечных серебряных свитка около 600 г. до н. э. со священническим благословением из книги Чисел — древнейший известный текст Писания."
    - "Здесь был Тофет, где сжигали детей. Ахаз «проводил сыновей своих через огонь» в долине, и то же делал Манассия; Иеремия обличает Иудею в том, что она устроила «высоты Тофета в долине сыновей Енномовых, чтобы сожигать сыновей своих и дочерей своих в огне, чего Я не повелевал», и капища Ваалу там же в честь Молоха. Он разбил кувшин горшечника у её ворот и предрёк, что её назовут «долиною убийства», где будут хоронить «по недостатку места». Иосия осквернил Тофет, «чтобы никто не проводил сына своего и дочери своей чрез огонь Молоху». После плена иудеи расположились «от Вирсавии и до долины Енномовой»."
    - "Из арамейского Ге-хиннам вышло греческое Геенна — ко времени Иисуса имя места огненного наказания после смерти. «кто скажет: “безумный”, подлежит геенне огненной»; бойтесь того, «кто может и душу и тело погубить в геенне»; лучше войти в жизнь увечному, «нежели с двумя руками идти в геенну, в огонь неугасимый». Привычное представление, будто долина была вечно горящей городской свалкой, идёт от средневекового комментатора Давида Кимхи и не имеет древних подтверждений. Христианское предание поместило Акелдаму, поле, купленное на серебро Иуды, на её южном склоне, где среди старых гробниц стоит монастырь святого Онуфрия."
    - "Сегодня долина, Гей-Бен-Хинном, — зелёный парк под горой Сион и кварталом Абу-Тор, с османским Султанским прудом в верховье, ныне концертной площадкой, и гробницами Кетеф-Хинном рядом с Центром наследия Менахема Бегина."
  uk:
    - "Долина Гінном, староєврейською Ге-Бен-Хіном, «долина сина Гінном», огинає Старе місто Єрусалима із заходу й півдня, від Яффських воріт до злиття з Кедроном під Сілоамом; її арабська назва — Вади-ер-Рабабі. Ісус Навин веде вздовж неї межу Юди й Веніяміна, тож євусейське місто лежало одразу в межах Веніяміна. В останні століття царства її схили слугували за гробниці: у Кетеф-Хіномі, на плечі над долиною, Габріель Баркай 1979 року знайшов два крихітні срібні сувої близько 600 р. до н. е., списані священицьким благословенням з Книги Чисел, найдавніший відомий текст Писання."
    - "Тут був Тофет, де палили дітей. Ахаз у долині «переводив синів своїх через огонь», і Манасія робив те саме; Єремія звинувачує Юду в спорудженні «висоти Тофет в долинї потомків Енномових, щоб там палити синів своїх і дочки свої, чого я не заповідував», і висот Ваала там для Молоха. Він розбив гончарний глек при її брамі й передрік, що її назвуть «долиною душогубною», де ховатимуть, «бо не буде місця». Йосія «Посквернив і Тофет, що на долинї синів Еннома, щоб нїхто не проводив сина свого чи дочку свою через огонь Молохові». Після вигнання народ Юди жив «від Бирсабії до долини Енномової»."
    - "З арамейського Ге-хінам постала грецька Геєнна, геєна, до Ісусових днів назва місця вогненної кари по смерті. «хто ж скаже: дурню, на того буде огонь пекольний»; бійтеся того, «хто зможе погубити і душу й тїло в пеклї»; краще ввійти в життя калікою, ніж «пійти в пекло, в огонь невгасаючий». Звична уява, що долина була вічно палаючим сміттєзвалищем міста, походить від середньовічного коментатора Давида Кімхі й не має давньої підтримки. Християнська традиція поставила Акелдаму, поле, куплене за срібло Юди, на її південному схилі, де серед давніх гробниць стоїть монастир св. Онуфрія."
    - "Нині долина, Гей-Бен-Хіном, — зелений парк під горою Сіон і кварталом Абу-Тор, з османським Басейном Султана в її верхів’ї, тепер концертним майданчиком, і гробницями Кетеф-Хіном поряд із Центром спадщини Менахема Бегіна."
  es:
    - "El Valle de Hinnom, en hebreo Ge Ben-Hinnom, «el valle del hijo de Hinnom», rodea el oeste y el sur de la Ciudad Vieja de Jerusalén, desde debajo de la Puerta de Jaffa hasta su encuentro con el Cedrón bajo Siloé; su nombre árabe es Wadi er-Rababi. Josué traza por él la frontera de Judá y Benjamín, de modo que la ciudad jebusea quedaba justo dentro de Benjamín. En los últimos siglos del reino sus laderas albergaban tumbas: en Ketef Hinnom, en el hombro sobre el valle, Gabriel Barkay halló en 1979 dos diminutos rollos de plata de hacia 600 a. C. con la bendición sacerdotal de Números, el texto más antiguo conocido de la Escritura."
    - "Aquí estaba Tofet, donde se quemaba a los niños. Acaz «quemó sus hijos por fuego» en el valle, y Manasés hizo lo mismo; Jeremías acusa a Judá de edificar «los altos de Topheth, que es en el valle del hijo de Hinnom, para quemar al fuego sus hijos y sus hijas, cosa que yo no les mandé», y de altos de Baal allí para Moloch. Rompió una vasija de alfarero en su puerta y anunció que se llamaría «Valle de la Matanza», donde se enterraría a los hombres «por no haber lugar». Josías «profanó á Topheth … porque ninguno pasase su hijo ó su hija por fuego á Moloch». Tras el exilio, el pueblo de Judá habitó «desde Beer-seba hasta el valle de Hinnom»."
    - "Del arameo Ge-hinnam vino el griego Geenna, Gehena, que en tiempos de Jesús era el nombre del lugar de castigo de fuego tras la muerte: «cualquiera que dijere, Fatuo, será culpado del infierno del fuego»; hay que temer a «aquel que puede destruir el alma y el cuerpo en el infierno»; mejor es entrar en la vida manco que «ir á la Gehenna, al fuego que no puede ser apagado». La noción familiar de que el valle era el basurero siempre ardiente de la ciudad procede de un comentarista medieval, David Kimhi, y no tiene apoyo antiguo. La tradición cristiana situó Aceldama, el campo comprado con la plata de Judas, en su ladera meridional, donde se alza el monasterio de San Onufrio entre antiguas tumbas."
    - "Hoy el valle, Gei Ben Hinnom, es un parque verde bajo el Monte Sion y el barrio de Abu Tor, con el Estanque del Sultán otomano en su cabecera, convertido ahora en recinto de conciertos, y las tumbas de Ketef Hinnom junto al Centro del Patrimonio Menachem Begin."
  pt:
    - "O Vale de Hinom, em hebraico Ge Ben-Hinom, “o vale do filho de Hinom”, contorna o oeste e o sul da Cidade Velha de Jerusalém, de baixo da Porta de Jafa até seu encontro com o Cedrom, sob Siloé; seu nome árabe é Wadi er-Rababi. Josué traça a fronteira de Judá e Benjamim ao longo dele, de modo que a cidade jebusita ficava logo dentro de Benjamim. Nos últimos séculos do reino, suas encostas abrigavam túmulos: em Ketef Hinom, no flanco acima do vale, Gabriel Barkay achou em 1979 dois minúsculos rolos de prata de cerca de 600 a.C. com a bênção sacerdotal de Números, o texto mais antigo conhecido da Escritura."
    - "Aqui ficava Tofete, onde crianças eram queimadas. Acaz “queimou seus filhos no fogo” no vale, e Manassés fez o mesmo; Jeremias acusa Judá de construir “os altos de Tofete, que está no vale do filho de Hinom, para queimarem os seus filhos e as suas filhas no fogo, o que eu não ordenei”, e de altos de Baal ali para Moloque. Quebrou um vaso de oleiro em sua porta e predisse que se chamaria “O vale da Matança”, onde se sepultaria “até que não haja mais lugar para enterrar”. Josias “profanou Tofete … para que ninguém fizesse seu filho ou sua filha passar pelo fogo a Moloque”. Depois do exílio, o povo de Judá vivia “desde Berseba até o vale de Hinom”."
    - "Do aramaico Ge-hinam veio o grego Geenna, Geena, no tempo de Jesus o nome do lugar de castigo de fogo depois da morte. “Quem disser: ‘Seu tolo!’ estará sujeito ao fogo da Geena”; deve-se temer aquele que “pode destruir tanto a alma quanto o corpo na Geena”; melhor entrar na vida mutilado do que “ir para a Geena, para o fogo inextinguível”. A noção corrente de que o vale era o depósito de lixo sempre em chamas da cidade vem de um comentarista medieval, David Kimhi, e não tem apoio antigo. A tradição cristã pôs Aceldama, o campo comprado com a prata de Judas, em sua encosta sul, onde se ergue o mosteiro de São Onofre entre antigos túmulos."
    - "Hoje o vale, Gei Ben Hinom, é um parque verde abaixo do Monte Sião e do bairro de Abu Tor, com o Tanque do Sultão otomano em sua cabeceira, agora palco de concertos, e os túmulos de Ketef Hinom junto ao Centro do Patrimônio Menachem Begin."
  de:
    - "Das Hinnomtal, hebräisch Ge Ben-Hinnom, „das Tal des Sohnes Hinnoms“, zieht sich im Westen und Süden um die Altstadt Jerusalems, von unterhalb des Jaffa-Tors bis zu seinem Zusammentreffen mit dem Kidron unterhalb von Siloah; sein arabischer Name ist Wadi er-Rababi. Josua führt die Grenze zwischen Juda und Benjamin daran entlang, sodass die jebusitische Stadt knapp innerhalb Benjamins lag. In den letzten Jahrhunderten des Königreichs trugen seine Hänge Gräber: In Ketef Hinnom, auf der Schulter über dem Tal, fand Gabriel Barkay 1979 zwei winzige Silberrollen von etwa 600 v. Chr. mit dem Priestersegen aus Numeri, dem ältesten bekannten Text der Schrift."
    - "Hier lag Tofet, wo Kinder verbrannt wurden. Ahas „verbrannte seine Söhne mit Feuer“ im Tal, und Manasse tat dasselbe; Jeremia wirft Juda vor, sie „bauen die Altäre des Thopheth im Tal Ben-Hinnom, daß sie ihre Söhne und Töchter verbrennen, was ich nie geboten“, und Höhen des Baal dort für den Moloch. Er zerbrach an seinem Tor einen Tonkrug und sagte voraus, es werde „Würgetal“ heißen, wo man begraben werde, „weil sonst kein Raum mehr sein wird“. Josia „verunreinigte auch das Topheth im Tal der Kinder Hinnom, daß niemand seinen Sohn oder seine Tochter dem Moloch durchs Feuer ließ gehen“. Nach dem Exil wohnte das Volk Juda „von Beer-Seba an bis an das Tal Hinnom“."
    - "Aus dem aramäischen Ge-hinnam kam das griechische Geenna, Gehenna, zur Zeit Jesu der Name des Ortes feuriger Strafe nach dem Tod. „Wer aber sagt: Du Narr! der ist des höllischen Feuers schuldig“; man solle den fürchten, „der Leib und Seele verderben kann in der Hölle“; besser, als Krüppel zum Leben einzugehen, „denn daß du zwei Hände habest und fahrest in die Hölle, in das ewige Feuer“. Die geläufige Vorstellung, das Tal sei die ewig brennende Müllkippe der Stadt gewesen, stammt von einem mittelalterlichen Kommentator, David Kimchi, und hat keinen antiken Beleg. Die christliche Überlieferung setzte Hakeldama, den mit Judas' Silber gekauften Acker, an seinen Südhang, wo das Kloster St. Onuphrius zwischen alten Gräbern steht."
    - "Heute ist das Tal, Gei Ben Hinnom, ein grüner Park unterhalb des Bergs Zion und des Viertels Abu Tor, mit dem osmanischen Sultansteich an seinem Kopf, heute ein Konzertgelände, und den Gräbern von Ketef Hinnom neben dem Menachem Begin Heritage Center."
  fr:
    - "La vallée de Hinnom, en hébreu Ge Ben-Hinnom, « la vallée du fils de Hinnom », contourne l’ouest et le sud de la Vieille Ville de Jérusalem, de sous la porte de Jaffa à sa rencontre avec le Cédron sous Siloé ; son nom arabe est Wadi er-Rababi. Josué y fait courir la frontière de Juda et de Benjamin, si bien que la ville jébusite se trouvait juste à l’intérieur de Benjamin. Dans les derniers siècles du royaume, ses pentes abritaient des tombes : à Ketef Hinnom, sur l’épaule au-dessus de la vallée, Gabriel Barkay trouva en 1979 deux minuscules rouleaux d’argent d’environ 600 av. J.-C. inscrits de la bénédiction sacerdotale des Nombres, le plus ancien texte connu de l’Écriture."
    - "Ici était Topheth, où l’on brûlait des enfants. Achaz « fit passer ses fils par le feu » dans la vallée, et Manassé fit de même ; Jérémie accuse Juda d’avoir bâti « des hauts lieux à Topheth dans la vallée de Ben-Hinnom, pour brûler au feu leurs fils et leurs filles : ce que je n’avais point ordonné », et des hauts lieux de Baal pour Moloc. Il brisa une cruche de potier à sa porte et annonça qu’elle s’appellerait « vallée du carnage », où l’on enterrerait « par défaut de place ». Josias « souilla Topheth … afin que personne ne fît plus passer son fils ou sa fille par le feu en l’honneur de Moloc ». Après l’exil, le peuple de Juda habita « depuis Beer-Schéba jusqu’à la vallée de Hinnom »."
    - "De l’araméen Ge-hinnam vint le grec Geenna, la Géhenne, qui était au temps de Jésus le nom du lieu du châtiment par le feu après la mort. « Celui qui lui dira : Insensé ! mérite d’être puni par le feu de la géhenne » ; craindre celui « qui peut faire périr l’âme et le corps dans la géhenne » ; mieux vaut entrer dans la vie manchot que « d’aller dans la géhenne, dans le feu qui ne s’éteint point ». L’idée courante que la vallée était la décharge toujours brûlante de la ville vient d’un commentateur médiéval, David Kimhi, et n’a aucun appui antique. La tradition chrétienne plaça Hakeldama, le champ acheté avec l’argent de Judas, sur sa pente sud, où se dresse le monastère Saint-Onuphre parmi d’anciennes tombes."
    - "Aujourd’hui, la vallée, Gei Ben Hinnom, est un parc verdoyant sous le mont Sion et le quartier d’Abu Tor, avec à sa tête le Bassin du Sultan ottoman, devenu salle de concerts, et les tombes de Ketef Hinnom à côté du Centre du patrimoine Menachem Begin."
  pl:
    - "Dolina Hinnom, po hebrajsku Ge Ben-Hinnom, „dolina syna Hinnoma”, okrąża od zachodu i południa Stare Miasto Jerozolimy, od miejsca pod Bramą Jafską aż do zbiegu z Cedronem pod Siloe; jej arabska nazwa to Wadi er-Rababi. Jozue prowadzi wzdłuż niej granicę Judy i Beniamina, tak że miasto jebusyckie leżało tuż po stronie Beniamina. W ostatnich wiekach królestwa na jej stokach były groby: w Ketef Hinnom, na ramieniu nad doliną, Gabriel Barkaj znalazł w 1979 roku dwa maleńkie srebrne zwoje z około 600 roku p.n.e. z wyrytym błogosławieństwem kapłańskim z Księgi Liczb, najstarszy znany tekst Pisma."
    - "Tu było Tofet, gdzie palono dzieci. Achaz w dolinie „palił synów swych ogniem”, a Manasses czynił to samo; Jeremiasz oskarża Judę o budowę „wyżyny Tofet, które jest w dolinie syna Hennomowego, aby palili synów swych i córki swe ogniem, czegom nie rozkazał”, oraz o wyżyny Baala tam dla Molocha. Stłukł gliniany dzban u jej bramy i zapowiedział, że będzie nazwana „doliną mordu”, gdzie będą grzebać, „bo indziej miejsca nie będzie”. Jozjasz „Splugawił też i Tofet … aby więcej nikt nie przewodził syna swego, ani córki swojej przez ogień ku czci Molochowi”. Po wygnaniu lud Judy, jak czytamy, „mieszkali od Beerseby aż do Giehennom”."
    - "Z aramejskiego Ge-hinnam wzięła się grecka Geenna, Gehenna, za czasów Jezusa nazwa miejsca ognistej kary po śmierci. „ktokolwiek rzecze: Błaźnie! będzie winien ognia piekielnego”; bać się tego, „który może i duszę i ciało zatracić w piekielnym ogniu”; lepiej wejść do życia ułomnym, niż „iść do piekła w on ogień nieugaszony”. Znane przekonanie, że dolina była wiecznie płonącym wysypiskiem śmieci miasta, pochodzi od średniowiecznego komentatora Dawida Kimchiego i nie ma starożytnego poparcia. Tradycja chrześcijańska umieściła Hakeldamę, pole kupione za srebro Judasza, na jej południowym stoku, gdzie wśród dawnych grobów stoi klasztor św. Onufrego."
    - "Dziś dolina, Gej Ben Hinnom, jest zielonym parkiem pod Górą Syjon i dzielnicą Abu Tor, z osmańską Sadzawką Sułtana u jej początku, obecnie terenem koncertów, i grobowcami Ketef Hinnom obok Centrum Dziedzictwa Menachema Begina."
  it:
    - "La Valle di Innom, in ebraico Ge Ben-Hinnom, «la valle del figlio di Innom», gira attorno all’ovest e al sud della Città Vecchia di Gerusalemme, da sotto la Porta di Giaffa fino all’incontro con il Cedron sotto Siloe; il suo nome arabo è Wadi er-Rababi. Giosuè vi fa correre il confine fra Giuda e Beniamino, per cui la città gebusea giaceva appena dentro Beniamino. Negli ultimi secoli del regno i suoi pendii ospitavano tombe: a Ketef Hinnom, sul fianco sopra la valle, Gabriel Barkay trovò nel 1979 due minuscoli rotoli d’argento del 600 a.C. circa con la benedizione sacerdotale dei Numeri, il più antico testo noto della Scrittura."
    - "Qui era Tofet, dove si bruciavano bambini. Acaz «arse i suoi figliuoli nel fuoco» nella valle, e lo stesso fece Manasse; Geremia accusa Giuda di aver edificato «gli alti luoghi di Tofet, nella valle del figliuolo di Hinnom, per bruciarvi nel fuoco i loro figliuoli e le loro figliuole: cosa che io non avevo comandata», e di alti luoghi di Baal per Moloc. Alla sua porta Geremia spezzò una brocca di vasaio e predisse che si sarebbe chiamata «la valle del Massacro», dove si sarebbe seppellito «per mancanza di luogo per seppellire». Giosia «contaminò Tofeth … affinché nessuno facesse più passare per il fuoco il suo figliuolo o la sua figliuola in onore di Molec». Dopo l’esilio la gente di Giuda abitò «da Beer-Sceba fino alla valle di Hinnom»."
    - "Dall’aramaico Ge-hinnam venne il greco Geenna, ai tempi di Gesù il nome del luogo di punizione di fuoco dopo la morte. «Chi gli avrà detto “pazzo”, sarà condannato alla geenna del fuoco»; si deve temere colui «che può far perire e l’anima e il corpo nella geenna»; meglio entrare nella vita monchi che «andartene nella geenna, nel fuoco inestinguibile». L’idea corrente che la valle fosse la discarica sempre ardente della città viene da un commentatore medievale, Davide Kimchi, e non ha sostegno antico. La tradizione cristiana pose Acheldamà, il campo comprato con l’argento di Giuda, sul suo pendio meridionale, dove sorge il monastero di Sant’Onofrio fra antiche tombe."
    - "Oggi la valle, Gei Ben Hinnom, è un parco verde sotto il Monte Sion e il quartiere di Abu Tor, con la Piscina del Sultano ottomana al suo inizio, ora luogo di concerti, e le tombe di Ketef Hinnom accanto al Menachem Begin Heritage Center."
  nl:
    - "Het Dal van Hinnom, in het Hebreeuws Ge Ben-Hinnom, “het dal van de zoon van Hinnom”, buigt om het westen en zuiden van de Oude Stad van Jeruzalem, van onder de Jaffapoort tot zijn samenloop met het Kidron onder Siloam; de Arabische naam is Wadi er-Rababi. Jozua laat de grens van Juda en Benjamin erlangs lopen, zodat de Jebusitische stad net binnen Benjamin lag. In de laatste eeuwen van het koninkrijk droegen de hellingen graven: bij Ketef Hinnom, op de schouder boven het dal, vond Gabriel Barkay in 1979 twee kleine zilveren rolletjes van omstreeks 600 v.Chr. met de priesterlijke zegen uit Numeri, de oudst bekende tekst van de Schrift."
    - "Hier was Tofet, waar kinderen werden verbrand. Achaz “brandde zijn zonen in het vuur” in het dal, en Manasse deed hetzelfde; Jeremia beschuldigt Juda ervan “de hoogten van Tofeth, dat in het dal des zoons van Hinnom is, om hun zonen en hun dochteren met vuur te verbranden; hetwelk Ik niet heb geboden” te hebben gebouwd, en van hoogten van Baäl daar voor Molech. Hij brak bij de poort een pottenbakkerskruik en voorspelde dat het “moorddal” zou heten, waar men zou begraven “omdat er geen plaats zal zijn”. Josia “verontreinigde ook Thofeth … opdat niemand zijn zoon of zijn dochter voor den Molech door het vuur deed gaan”. Na de ballingschap woonde het volk van Juda “van Ber-seba af tot aan het dal Hinnom”."
    - "Uit het Aramese Ge-hinnam kwam het Griekse Geenna, Gehenna, in de tijd van Jezus de naam van de plaats van vurige straf na de dood. “Wie zegt: Gij dwaas! die zal strafbaar zijn door het helse vuur”; vrees Hem “Die beide ziel en lichaam kan verderven in de hel”; beter verminkt het leven in te gaan dan “heen te gaan in de hel, in het onuitblusselijk vuur”. Het bekende idee dat het dal de altijd brandende vuilnisbelt van de stad was, komt van een middeleeuwse uitlegger, David Kimchi, en heeft geen antieke steun. De christelijke overlevering plaatste Akeldama, het veld gekocht met het zilver van Judas, op zijn zuidelijke helling, waar het klooster van Sint-Onufrius tussen oude graven staat."
    - "Tegenwoordig is het dal, Gei Ben Hinnom, een groen park onder de berg Sion en de wijk Abu Tor, met aan het bovenste uiteinde de Ottomaanse Sultansvijver, nu een concertterrein, en de graven van Ketef Hinnom naast het Menachem Begin Heritage Center."
  cs:
    - "Hinómovo údolí, hebrejsky Ge Ben-Hinnom, „údolí syna Hinnomova“, se ohýbá kolem západu a jihu Starého Města Jeruzaléma, od úpatí Jaffské brány po soutok s Kidronem pod Siloe; jeho arabské jméno je Wádí er-Rabábí. Jozue vede podél něj hranici Judy a Benjamína, takže jebúsejské město leželo těsně uvnitř Benjamína. V posledních stoletích království jeho svahy nesly hrobky: v Ketef Hinnom, na úbočí nad údolím, našel Gabriel Barkay roku 1979 dva drobné stříbrné svitky z doby kolem roku 600 př. n. l. s vyrytým kněžským požehnáním z Numeri, nejstarší známý text Písma."
    - "Zde bylo Tofet, kde se pálily děti. Achaz „pálil syny své ohněm“ v údolí a totéž činil Manases; Jeremjáš obviňuje Judu, že vzdělala „výsosti Tofet, kteréž jest v údolí syna Hinnom, aby pálili syny své i dcery své ohněm, čehož jsem nepřikázal“, a výsosti Baalovy tam pro Molocha. U jeho brány rozbil hrnčířskou nádobu a předpověděl, že se bude nazývat „údolí mordu“, kde se bude pohřbívat, „nebo nebude dostávati místa“. Jošijáš „poškvrnil … Tofet … aby více žádný nevodil syna svého aneb dcery své skrze oheň Molochovi“. Po exilu lid Judy bydlil „od Bersabé až do Gehinnom“."
    - "Z aramejského Ge-hinnam vzniklo řecké Geenna, Gehenna, za Ježíšových dnů jméno místa ohnivého trestu po smrti. „Kdož by řekl: Blázne, povinen bude pekelný oheň trpěti“; bát se toho, „kterýž může i duši i tělo zatratiti v pekelném ohni“; lépe vejít do života zmrzačen než „jíti do pekla, v oheň neuhasitelný“. Známá představa, že údolí bylo ustavičně hořící městskou skládkou, pochází od středověkého komentátora Davida Kimchiho a nemá žádnou starověkou oporu. Křesťanská tradice kladla Akeldamu, pole koupené za Jidášovo stříbro, na jeho jižní svah, kde stojí klášter svatého Onufria mezi starými hrobkami."
    - "Dnes je údolí, Gej Ben Hinnom, zeleným parkem pod horou Sijón a čtvrtí Abú Tór, s osmanským Sultánovým rybníkem na horním konci, nyní koncertním prostorem, a hrobkami Ketef Hinnom vedle Centra dědictví Menachema Begina."
  sv:
    - "Hinnoms dal, på hebreiska Ge Ben-Hinnom, ”Hinnoms sons dal”, kröker sig runt väster och söder om Jerusalems Gamla stad, från nedanför Jaffaporten till dess möte med Kidron under Siloa; dess arabiska namn är Wadi er-Rababi. Josua drar gränsen mellan Juda och Benjamin längs den, så att den jebusitiska staden låg strax innanför Benjamin. Under rikets sista århundraden fanns gravar på dess sluttningar: vid Ketef Hinnom, på skuldran ovanför dalen, fann Gabriel Barkay 1979 två små silverrullar från omkring 600 f.Kr. med den prästerliga välsignelsen i 4 Mos ingraverad, den äldsta kända texten ur Skriften."
    - "Här låg Tofet, där barn brändes. Achas ”brände upp sina barn i eld” i dalen, och Manasse gjorde detsamma; Jeremia anklagar Juda för att ha byggt ”Tofethöjderna i Hinnoms sons dal … för att där uppbränna sina söner och döttrar i eld, fastän jag aldrig har bjudit”, och för Baalshöjder där åt Molok. Han krossade en krukmakarkruka vid dess port och förutsade att den skulle kallas ”Dråpdalen”, där man skulle begrava ”därför att ingen annan plats finnes”. Josia ”orenade ock Tofet … för att ingen skulle låta sin son eller dotter gå genom eld, till offer åt Molok”. Efter exilen bodde Juda folk ”från Beer-Seba ända till Hinnoms dal”."
    - "Av det arameiska Ge-hinnam kom grekiskans Geenna, Gehenna, vid Jesu tid namnet på straffets eldplats efter döden. ”den som säger: ’Du dåre’, han är hemfallen åt det brinnande Gehenna”; frukta honom ”som har makt att förgöra både själ och kropp i Gehenna”; bättre att ingå i livet lytt än att ”komma till Gehenna, till den eld som icke utsläckes”. Den invanda föreställningen att dalen var stadens ständigt brinnande sophög kommer från en medeltida kommentator, David Kimhi, och saknar stöd i antiken. Kristen tradition förlade Akeldama, åkern som köptes för Judas' silver, på dess södra sluttning, där Sankt Onofrios' kloster står bland gamla gravar."
    - "I dag är dalen, Gei Ben Hinnom, en grön park nedanför Sions berg och kvarteret Abu Tor, med den ottomanska Sultansdammen vid dess övre ände, numera en konsertplats, och gravarna vid Ketef Hinnom bredvid Menachem Begin Heritage Center."
  nb:
    - "Hinnom-dalen, på hebraisk Ge Ben-Hinnom, «Hinnoms sønns dal», buer rundt vest og sør for Jerusalems gamleby, fra under Jaffaporten til sammenløpet med Kedron under Siloa; det arabiske navnet er Wadi er-Rababi. Josva lar grensen mellom Juda og Benjamin løpe langs den, slik at jebusittenes by lå like innenfor Benjamin. I kongerikets siste århundrer rommet skråningene graver: ved Ketef Hinnom, på skulderen over dalen, fant Gabriel Barkay i 1979 to bitte små sølvruller fra omkring 600 f.Kr. innskrevet med den prestelige velsignelsen fra Fjerde Mosebok, den eldste kjente teksten fra Skriften."
    - "Her lå Tofet, der barn ble brent. Ahas «lot sine sønner gå igjennem ilden» i dalen, og Manasse gjorde det samme; Jeremia anklager Juda for å ha bygget «Tofet-haugene i Hinnoms sønns dal for å opbrenne sine sønner og sine døtre med ild, noget som jeg ikke har pålagt dem», og for offerhauger for Ba'al der til Molok. Han knuste en pottemakerkrukke ved porten og forutsa at stedet skulle kalles «Drapsdalen», der man skulle begrave folk «fordi det ellers ikke er plass». Josjia «gjorde også Tofet i Hinnoms barns dal urent, så ikke nogen skulde la sin sønn eller datter gå gjennem ilden for Molok». Etter eksilet bodde Judas folk «fra Be'erseba til Hinnoms dal»."
    - "Av arameisk Ge-hinnam kom gresk Geenna, Gehenna, på Jesu tid navnet på stedet for ildens straff etter døden. «Den som sier: Du dåre! skal være skyldig til helvedes ild»; frykt ham «som kan ødelegge både sjel og legeme i helvede»; bedre å gå inn til livet vanfør enn at man har to hender «og kommer i helvede i den uslukkelige ild». Forestillingen om at dalen var byens stadig brennende søppelplass stammer fra en middelalderkommentator, David Kimhi, og har ingen støtte i antikken. Kristen tradisjon plasserte Hakeldama, marken kjøpt for Judas' sølv, på dens sørlige skråning, der Sankt Onufrios-klosteret står blant gamle graver."
    - "I dag er dalen, Gei Ben Hinnom, en grønn park under Sionfjellet og bydelen Abu Tor, med den osmanske Sultanens dam ved begynnelsen, nå en konsertplass, og gravene på Ketef Hinnom ved siden av Menachem Begin-senteret for arv."
