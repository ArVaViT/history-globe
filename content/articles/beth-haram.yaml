body:
  en:
    - "Beth-haram, spelt Beth-haran in Numbers and Beth-aram in Joshua, was a town of Gad in the Jordan valley opposite Jericho. When Reuben and Gad asked for the land east of the river, the Gadites fortified it: “Beth-nimrah, and Beth-haran, fenced cities: and folds for sheep”. Joshua lists it among Gad's towns “in the valley, Beth-aram, and Beth-nimrah, and Succoth, and Zaphon, the rest of the kingdom of Sihon king of Heshbon”. The Bible does not mention it again."
    - "Its later history is better known than its biblical one. Under the name Betharamphtha Herod Antipas walled it and named it after the wife of Augustus: Josephus calls it Julias, other writers Livias; Josephus says the palace there was burnt in the troubles after Herod the Great's death. Eusebius says the Syrians called the town Bethramphtha and that it was now Livias, and the pilgrim Egeria passed through Livias on her way to Mount Nebo. The name lives on at Tall er-Rama, a mound by the village of er-Rama in the Jordan valley of Jordan, which most take for the Roman city and perhaps the biblical one; the larger Tall Iktanu, about 3 km to the east, excavated by Kay Prag in 1987–1990 and occupied in the Early and Intermediate Bronze Ages and again in the first millennium BC, is the other candidate for Beth-haram itself. Neither has yielded an inscription."
  ru:
    - "Беф-Гарам, в книге Чисел Беф-Гаран, — город Гада в долине Иордана напротив Иерихона. Когда Рувим и Гад попросили землю за рекой, Гадитяне укрепили его: «и Беф-Нимру и Беф-Гаран, города укрепленные и дворы для овец». Книга Иисуса Навина числит его среди городов Гада «на долине Беф-Гарам и Беф-Нимра и Сокхоф и Цафон, остаток царства Сигона, царя Есевонского». Больше Библия его не упоминает."
    - "Его поздняя история известна лучше библейской. Под именем Бетарамфта Ирод Антипа обнёс его стеной и назвал в честь жены Августа: Иосиф Флавий зовёт его Юлиадой, другие авторы — Ливиадой; Иосиф Флавий говорит, что тамошний дворец сожгли в смуте после смерти Ирода Великого. Евсевий пишет, что сирийцы звали город Бетрамфтой, а теперь это Ливиада, а паломница Эгерия проходила через Ливиаду по пути на гору Нево. Имя живёт в Телль-эр-Раме, холме у селения Эр-Рама в иорданской долине Иордана, в котором большинство видят римский город и, возможно, библейский; более крупный Телль-Иктану примерно в 3 км к востоку, раскопанный Кей Прэг в 1987–1990 годах и обитаемый в раннем и промежуточном бронзовом веке и вновь в I тысячелетии до н. э., — второй кандидат на сам Беф-Гарам. Надписей не дал ни один."
  uk:
    - "Бет-Гарам, у Числах — Бет-Гаран, у книзі Ісуса Навина — Бет-Арам, було містом Гада в Йорданській долині навпроти Єрихону. Коли Рувим і Гад попросили землі на схід від річки, гадіти його укріпили: «Бет-Нимра і Бет-Гаран, утверджені міста і кошарі для дрібної скотини». Ісус Навин зараховує його до міст Гада «на поділлї Бет-Гарам і Бет-Нимра і Сихот і Зафон, останок царства Сигонового, царя Езбонського». Біблія більше його не згадує."
    - "Його пізніша історія відоміша за біблійну. Під назвою Бетарамфта Ірод Антипа обніс його мурами й назвав на честь дружини Августа: Йосиф Флавій називає його Юліадою, інші автори — Лівіадою; Йосиф Флавій каже, що палац там було спалено в заколотах після смерті Ірода Великого. Євсевій каже, що сирійці називали місто Бетрамфта і що тепер це Лівіада, а прочанка Егерія проходила через Лівіаду дорогою до гори Нево. Назва живе в Талль-ер-Рамі, пагорбі біля села ер-Рама в Йорданській долині Йорданії, який більшість вважає римським містом і, можливо, біблійним; більший Талль-Іктану, приблизно за 3 км на схід, розкопаний Кей Праг у 1987–1990 рр. і заселений у ранню й проміжну бронзові доби та знову в I тисячолітті до н. е., — інший кандидат на сам Бет-Гарам. Жоден не дав напису."
  es:
    - "Bet-haram, escrita Betharán en Números y Beth-aram en Josué, era una ciudad de Gad en el valle del Jordán frente a Jericó. Cuando Rubén y Gad pidieron la tierra al este del río, los gaditas la fortificaron: «Beth-nimra, y Betharán: ciudades fuertes, y también majadas para ovejas». Josué la enumera entre las ciudades de Gad «la campiña de Beth-aram, y Beth-nimra, y Sucoth, y Saphón, resto del reino de Sehón, rey en Hesbón». La Biblia no la menciona de nuevo."
    - "Su historia posterior es mejor conocida que la bíblica. Con el nombre de Betharamphtha, Herodes Antipas la amuralló y le dio el nombre de la esposa de Augusto: Josefo la llama Julias, otros autores Livias; Josefo dice que el palacio de allí fue incendiado en los disturbios posteriores a la muerte de Herodes el Grande. Eusebio dice que los sirios llamaban a la ciudad Bethramphtha y que ahora era Livias, y la peregrina Egeria pasó por Livias camino del monte Nebo. El nombre pervive en Tall er-Rama, un montículo junto a la aldea de er-Rama, en el valle del Jordán de Jordania, que la mayoría toma por la ciudad romana y quizá por la bíblica; el mayor Tall Iktanu, a unos 3 km al este, excavado por Kay Prag en 1987–1990 y ocupado en el Bronce Antiguo y el Intermedio y de nuevo en el I milenio a. C., es el otro candidato para la propia Bet-haram. Ninguno ha dado una inscripción."
  pt:
    - "Bete-Harã, grafada Bete-Arã em Josué, era uma cidade de Gade no vale do Jordão, defronte de Jericó. Quando Rúben e Gade pediram a terra a leste do rio, os gaditas a fortificaram: “Bete-Ninra e Bete-Harã: cidades fortificadas e currais para ovelhas”. Josué a lista entre as cidades de Gade “e no vale, Bete-Arã, Bete-Ninra, Sucote e Zafom, o resto do reino de Seom, rei de Hesbom”. A Bíblia não a menciona mais."
    - "Sua história posterior é mais conhecida que a bíblica. Com o nome de Betharamphtha, Herodes Antipas a cercou de muralhas e lhe deu o nome da mulher de Augusto: Josefo a chama Júlias, outros autores Lívias; Josefo diz que o palácio ali foi queimado nos distúrbios após a morte de Herodes, o Grande. Eusébio diz que os sírios chamavam a cidade Bethramphtha e que agora era Lívias, e a peregrina Egéria passou por Lívias a caminho do monte Nebo. O nome sobrevive em Tall er-Rama, um montículo junto à aldeia de er-Rama, no vale do Jordão jordaniano, que a maioria toma pela cidade romana e talvez pela bíblica; o maior Tall Iktanu, cerca de 3 km a leste, escavado por Kay Prag em 1987–1990 e ocupado no Bronze Antigo e no Intermediário e de novo no I milênio a.C., é o outro candidato à própria Bete-Harã. Nenhum rendeu inscrição."
  de:
    - "Bet-Haram, in 4. Mose Bet-Haran und bei Josua in der King-James-Bibel Beth-aram geschrieben (Luther hat dort Beth-Haran), war eine Stadt Gads im Jordantal gegenüber von Jericho. Als Ruben und Gad das Land östlich des Flusses erbaten, befestigten die Gaditer es: „Beth-Nimra und Beth-Haran, verschlossene Städte und Schafhürden“. Josua führt es unter Gads Städten auf, „im Tal aber Beth-Haran, Beth-Nimra, Sukkoth und Zaphon, was übrig war von dem Reich Sihons, des Königs zu Hesbon“. Die Bibel erwähnt es nicht wieder."
    - "Seine spätere Geschichte ist besser bekannt als seine biblische. Unter dem Namen Betharamphtha ummauerte Herodes Antipas es und benannte es nach der Frau des Augustus: Josephus nennt es Julias, andere Autoren Livias; Josephus sagt, der dortige Palast sei in den Unruhen nach dem Tod Herodes' des Großen verbrannt worden. Eusebius sagt, die Syrer hätten die Stadt Bethramphtha genannt und sie sei nun Livias, und die Pilgerin Egeria kam auf ihrem Weg zum Berg Nebo durch Livias. Der Name lebt in Tall er-Rama fort, einem Hügel beim Dorf er-Rama im jordanischen Jordantal, den die meisten für die römische Stadt und vielleicht die biblische halten; das größere Tall Iktanu, etwa 3 km östlich, 1987–1990 von Kay Prag ausgegraben und in der Früh- und Zwischenbronzezeit und wieder im 1. Jahrtausend v. Chr. besiedelt, ist der andere Kandidat für Bet-Haram selbst. Keines hat eine Inschrift ergeben."
  fr:
    - "Beth-Haram, écrit Beth-Haran dans les Nombres et Beth-Aram dans Josué, était une ville de Gad dans la vallée du Jourdain en face de Jéricho. Quand Ruben et Gad demandèrent le pays à l’est du fleuve, les Gadites la fortifièrent : « Beth-Nimra et Beth-Haran, villes fortes, et ils firent des parcs pour les troupeaux ». Josué la range parmi les villes de Gad « dans la vallée, Beth-Haram, Beth-Nimra, Succoth et Tsaphon, reste du royaume de Sihon, roi de Hesbon ». La Bible ne la mentionne plus."
    - "Son histoire ultérieure est mieux connue que son histoire biblique. Sous le nom de Betharamphtha, Hérode Antipas la ceignit de murs et lui donna le nom de l’épouse d’Auguste : Josèphe l’appelle Julias, d’autres auteurs Livias ; Josèphe dit que le palais y fut brûlé dans les troubles après la mort d’Hérode le Grand. Eusèbe dit que les Syriens appelaient la ville Bethramphtha et qu’elle était maintenant Livias, et la pèlerine Égérie passa par Livias en allant au mont Nebo. Le nom survit à Tall er-Rama, tertre près du village d’er-Rama dans la vallée du Jourdain en Jordanie, que la plupart tiennent pour la ville romaine et peut-être la biblique ; le plus grand Tall Iktanu, à environ 3 km à l’est, fouillé par Kay Prag en 1987-1990 et occupé au Bronze ancien et intermédiaire, puis de nouveau au Ier millénaire av. J.-C., est l’autre candidat pour Beth-Haram même. Aucun n’a livré d’inscription."
  it:
    - "Bet-Aram, scritta Bet-Aran nei Numeri e Bet-Aram in Giosuè, era una città di Gad nella valle del Giordano di fronte a Gerico. Quando Ruben e Gad chiesero la terra a est del fiume, i Gaditi la fortificarono: «Beth-Nimra e Beth-Haran, città fortificate, e fecero de’ recinti per i greggi». Giosuè la elenca fra le città di Gad «nella valle, Beth-Haram, Beth-Nimra, Succoth e Tsafon, residuo del regno di Sihon re di Heshbon». La Bibbia non la menziona più."
    - "La sua storia posteriore è meglio nota di quella biblica. Con il nome di Betharamphtha Erode Antipa la cinse di mura e le diede il nome della moglie di Augusto: Flavio Giuseppe la chiama Giulia, altri autori Livias; Flavio Giuseppe dice che il palazzo di lì fu bruciato nei disordini dopo la morte di Erode il Grande. Eusebio dice che i Siri chiamavano la città Bethramphtha e che ora era Livias, e la pellegrina Egeria passò per Livias in cammino verso il monte Nebo. Il nome vive a Tall er-Rama, un tell presso il villaggio di er-Rama nella valle del Giordano in Giordania, che i più ritengono la città romana e forse la biblica; il più grande Tall Iktanu, a circa 3 km a est, scavato da Kay Prag nel 1987–1990 e occupato nell’età del Bronzo antica e intermedia e di nuovo nel I millennio a.C., è l’altro candidato per la stessa Bet-Aram. Nessuno dei due ha restituito un’iscrizione."
  pl:
    - "Bet-Haram, zapisane jako Bet-Haran w Księdze Liczb i Bet-Aram u Jozuego, było miastem Gada w Dolinie Jordanu naprzeciw Jerycha. Gdy Ruben i Gad poprosili o ziemię na wschód od rzeki, Gadyci je umocnili: „Betnimera, i Betaran, miasta obronne, i obory dla bydła”. Jozue wylicza je wśród miast Gada: „W dolinie też Beram, i Betnimra, i Sochot, i Safon, ostatek królestwa Sehona, króla Hesebońskiego”. Biblia więcej o nim nie wspomina."
    - "Jego późniejsze dzieje są lepiej znane niż biblijne. Pod nazwą Betharamphtha Herod Antypas otoczył je murem i nazwał od żony Augusta: Józef Flawiusz nazywa je Julias, inni autorzy Livias; Józef Flawiusz mówi, że tamtejszy pałac spalono w niepokojach po śmierci Heroda Wielkiego. Euzebiusz mówi, że Syryjczycy nazywali miasto Bethramphtha i że teraz było to Livias, a pątniczka Egeria przeszła przez Livias w drodze na górę Nebo. Nazwa żyje w Tall er-Rama, kopcu koło wsi er-Rama w Dolinie Jordanu w Jordanii, który większość uważa za miasto rzymskie, a może i biblijne; większy Tall Iktanu, około 3 km na wschód, wykopywany przez Kay Prag w latach 1987–1990 i zamieszkany we wczesnej i pośredniej epoce brązu oraz ponownie w I tysiącleciu p.n.e., jest drugim kandydatem na samo Bet-Haram. Żaden nie dał napisu."
  nl:
    - "Beth-Haram, gespeld Beth-Haran in Numeri en Beth-Aram in Jozua, was een stad van Gad in de Jordaanvallei tegenover Jericho. Toen Ruben en Gad om het land ten oosten van de rivier vroegen, versterkten de Gadieten haar: “Beth-Nimra, en Beth-Haran, vaste steden en schaapskooien”. Jozua noemt haar onder Gads steden “in het dal, Beth-haram, en Beth-nimra, en Sukkoth, en Zefon, wat over was van het koninkrijk van Sihon, den koning te Hesbon”. De Bijbel noemt haar verder niet."
    - "Haar latere geschiedenis is beter bekend dan haar bijbelse. Onder de naam Betharamphtha ommuurde Herodes Antipas haar en vernoemde haar naar de vrouw van Augustus: Josephus noemt haar Julias, andere schrijvers Livias; Josephus zegt dat het paleis daar werd verbrand in de onrust na de dood van Herodes de Grote. Eusebius zegt dat de Syriërs de stad Bethramphtha noemden en dat zij nu Livias was, en de pelgrim Egeria kwam door Livias op weg naar de berg Nebo. De naam leeft voort in Tall er-Rama, een heuvel bij het dorp er-Rama in de Jordaanvallei in Jordanië, die de meesten voor de Romeinse stad houden en misschien de bijbelse; de grotere Tall Iktanu, zo’n 3 km oostelijk, door Kay Prag in 1987–1990 opgegraven en bewoond in de vroege en de intermediaire bronstijd en opnieuw in het eerste millennium v.Chr., is de andere kandidaat voor Beth-Haram zelf. Geen van beide leverde een opschrift op."
  cs:
    - "Bét-haram, psané Betharan v Numeri a Bét-aram v Jozue, bylo město Gádovo v Jordánském údolí naproti Jerichu. Když Rúben a Gád žádali o zemi východně od řeky, Gádovci je opevnili: „Betnemra a Betaran, města hrazená, a stáje pro dobytky“. Jozue je uvádí mezi městy Gádovými „V údolí také Betaram a Betnemra, a Sochot, a Sefon, ostatek království Seona, krále Ezebon“. Bible se o něm už nezmiňuje."
    - "Jeho pozdější dějiny jsou známější než biblické. Pod jménem Betharamphtha je Herodes Antipas obehnal hradbou a pojmenoval podle manželky Augustovy: Josephus Flavius je nazývá Julias, jiní autoři Livias; Josephus Flavius praví, že tamní palác byl spálen v nepokojích po smrti Heroda Velikého. Eusebios praví, že Syřané nazývali město Bethramphtha a že je nyní Livias, a poutnice Egerie prošla Livias na cestě k hoře Nebo. Jméno žije v Tall er-Rama, pahorku u vesnice er-Rama v Jordánském údolí Jordánska, který většina pokládá za římské město a snad i biblické; větší Tall Iktanu, asi 3 km na východ, vykopávaný Kay Pragovou v letech 1987–1990 a osídlený v rané a přechodné době bronzové a znovu v 1. tisíciletí př. n. l., je druhým kandidátem na samotný Bét-haram. Žádný nevydal nápis."
  sv:
    - "Bet-Haram, som i Fjärde Mosebok stavas Bet-Haran och i Josua Beth-aram i den engelska King James-översättningen, var en stad i Gad i Jordandalen mitt emot Jeriko. När Ruben och Gad bad om landet öster om floden befäste gaditerna den: ”Bet-Nimra och Bet-Haran, befästa städer och boskapsgårdar”. Josua upptar den bland Gads städer ”samt i dalen: Bet-Haram, Bet-Nimra, Suckot och Safon, det övriga av Sihons rike, konungens i Hesbon”. Bibeln nämner den inte mer."
    - "Dess senare historia är bättre känd än den bibliska. Under namnet Betharamphtha ringmurade Herodes Antipas den och uppkallade den efter Augustus’ hustru: Josefus kallar den Julias, andra författare Livias; Josefus säger att palatset där brändes i oroligheterna efter Herodes den stores död. Eusebios säger att syrierna kallade staden Bethramphtha och att den nu var Livias, och pilgrimen Egeria passerade genom Livias på väg till Nebo. Namnet lever kvar vid Tall er-Rama, en kulle vid byn er-Rama i Jordandalen i Jordanien, som de flesta tar för den romerska staden och kanske den bibliska; den större Tall Iktanu, omkring 3 km österut, utgrävd av Kay Prag 1987–1990 och bebodd under äldre bronsåldern och mellanbronsåldern och åter under det första årtusendet f.Kr., är den andra kandidaten för själva Bet-Haram. Ingen av dem har givit någon inskrift."
  nb:
    - "Bet-Haram, skrevet Bet-Haran i 4. Mosebok og Bet-Aram i Josva, var en by i Gad i Jordandalen midt imot Jeriko. Da Ruben og Gad ba om landet øst for elven, befestet gadittene den: «Bet-Nimra og Bet-Haran, faste byer og hegn for feet». Josva oppfører den blant Gads byer: «og i dalen fikk de Bet-Haram og Bet-Nimra og Sukkot og Safon, resten av det rike som hadde tilhørt Sihon, kongen i Hesbon». Bibelen nevner den ikke mer."
    - "Dens senere historie er bedre kjent enn den bibelske. Under navnet Betharamphtha murte Herodes Antipas den inn og oppkalte den etter Augustus' hustru: Josefus kaller den Julias, andre forfattere Livias; Josefus sier at palasset der ble brent i uroen etter Herodes den stores død. Eusebius sier at syrerne kalte byen Bethramphtha og at den nå var Livias, og pilegrimen Egeria drog gjennom Livias på vei til Nebo. Navnet lever videre ved Tall er-Rama, en tell ved landsbyen er-Rama i Jordandalen i Jordan, som de fleste tar for den romerske byen og kanskje den bibelske; den større Tall Iktanu, omtrent 3 km mot øst, gravd ut av Kay Prag i 1987–1990 og bebodd i eldre og mellomliggende bronsealder og igjen i det første årtusen f.Kr., er den andre kandidaten for selve Bet-Haram. Ingen har gitt en innskrift."
  tl:
    - "Ang Beth-aram, na Beth-haran ang baybay sa Mga Bilang at Beth-aram sa Josue, ay bayan ni Gad sa libis ng Jordan katapat ng Jerico. Nang humiling ng lupain sa silangan ng ilog sina Ruben at Gad, pinatibay ito ng mga Gadita: “ang Beth-nimra at ang Bet-haran: na mga bayang nakukutaan, at kulungan din naman ng mga tupa”. Inililista ito ni Josue sa mga bayan ni Gad “At sa libis, ang Beth-aram, at ang Beth-nimra, at ang Sucoth, at ang Saphon, na labis ng kaharian ni Sehon na hari sa Hesbon”. Hindi na binabanggit ng Biblia ito pagkatapos."
    - "Mas kilala ang kalaunang kasaysayan nito kaysa sa biblikal. Bilang Betharamphtha, pinaderan ito ni Herodes Antipas at ipinangalan sa asawa ni Augusto: Julias kay Josefo, Livias sa ibang manunulat; ayon kay Josefo, sinunog ang palasyo roon sa kaguluhan pagkamatay ni Herodes na Dakila. Ayon kay Eusebio, tinawag ng mga Siryano ang bayan na Bethramphtha at Livias na ito ngayon, at dumaan si Egeria sa Livias patungong Bundok Nebo. Nabubuhay ang pangalan sa Tall er-Rama, burol sa tabi ng nayon ng er-Rama sa libis ng Jordan sa Jordan, lungsod na Romano at marahil biblikal ayon sa karamihan; ang mas malaking Tall Iktanu, 3 km sa silangan, na hinukay ni Kay Prag noong 1987–1990 at tinirhan sa Maaga at Pagitang Panahon ng Tanso at muli sa unang milenyo BK, ang kandidato para sa Beth-aram mismo. Wala sa dalawa ang nagbigay ng inskripsiyon."
scripture:
  - Num.32.36
  - Josh.13.27
sources:
  - "Josephus, Antiquities 18.27 (Betharamphtha renamed Julias); Jewish War 2.59 (the palace at Betharamatha burnt)"
  - "Eusebius, Onomasticon, s.v. Betharam"
  - "Egeria, Itinerarium 10 (Livias on the way to Nebo)"
  - "K. Prag, 'Preliminary Report on the Excavations at Tell Iktanu, Jordan, 1987', Levant 21 (1989)"
  - "A. F. Rainey and R. S. Notley, The Sacred Bridge: Carta's Atlas of the Biblical World (2006)"
status: checked
