# Overview article (ADR 0007). Mainstream facts only; the two spellings are noted; the later Livias is from Josephus and Eusebius; Tall er-Rama and Tall Iktanu are given as the candidates.
id: beth-haram
place: a4590cd
title:
  en: "Beth-haram"
  ru: "Беф-Гарам"
  uk: "Бет-Гарам"
  es: "Bet-haram"
  pt: "Bete-Harã"
  de: "Bet-Haram"
  fr: "Beth-Haram"
body:
  en:
    - "Beth-haram, spelt Beth-haran in Numbers and Beth-aram in Joshua, was a town of Gad in the Jordan valley opposite Jericho. When Reuben and Gad asked for the land east of the river, the Gadites fortified it: “Beth-nimrah, and Beth-haran, fenced cities: and folds for sheep”. Joshua lists it among Gad's towns “in the valley, Beth-aram, and Beth-nimrah, and Succoth, and Zaphon, the rest of the kingdom of Sihon king of Heshbon”. The Bible does not mention it again."
    - "Its later history is better known than its biblical one. Under the name Betharamphtha Herod Antipas walled it and renamed it Livias, then Julias, after the wife of Augustus; Josephus says the palace there was burnt in the troubles after Herod the Great's death. Eusebius says the Syrians called the town Bethramphtha and that it was now Livias, and the pilgrim Egeria passed through Livias on her way to Mount Nebo. The name lives on at Tall er-Rama, a mound by the village of er-Rama in the Jordan valley of Jordan, which most take for the Roman city and perhaps the biblical one; the larger Tall Iktanu, about 3 km to the east, excavated by Kay Prag in 1987–1990 and occupied in the Early Bronze and Iron Ages, is the other candidate for Beth-haram itself. Neither has yielded an inscription."
  ru:
    - "Беф-Гарам, в книге Чисел Беф-Гаран, — город Гада в долине Иордана напротив Иерихона. Когда Рувим и Гад попросили землю за рекой, Гадитяне укрепили его: «и Беф-Нимру и Беф-Гаран, города укрепленные и дворы для овец». Книга Иисуса Навина числит его среди городов Гада «на долине Беф-Гарам и Беф-Нимра и Сокхоф и Цафон, остаток царства Сигона, царя Есевонского». Больше Библия его не упоминает."
    - "Его поздняя история известна лучше библейской. Под именем Бетарамфта Ирод Антипа обнёс его стеной и переименовал в Ливиаду, затем в Юлиаду, в честь жены Августа; Иосиф Флавий говорит, что тамошний дворец сожгли в смуте после смерти Ирода Великого. Евсевий пишет, что сирийцы звали город Бетрамфтой, а теперь это Ливиада, а паломница Эгерия проходила через Ливиаду по пути на гору Нево. Имя живёт в Телль-эр-Раме, холме у селения Эр-Рама в иорданской долине Иордана, в котором большинство видят римский город и, возможно, библейский; более крупный Телль-Иктану примерно в 3 км к востоку, раскопанный Кей Прэг в 1987–1990 годах и обитаемый в раннем бронзовом и железном веках, — второй кандидат на сам Беф-Гарам. Надписей не дал ни один."
  uk:
    - "Бет-Гарам, у Числах — Бет-Гаран, у книзі Ісуса Навина — Бет-Арам, було містом Гада в Йорданській долині навпроти Єрихону. Коли Рувим і Гад попросили землі на схід від річки, гадіти його укріпили: «Бет-Нимра і Бет-Гаран, утверджені міста і кошарі для дрібної скотини». Ісус Навин зараховує його до міст Гада «на поділлї Бет-Гарам і Бет-Нимра і Сихот і Зафон, останок царства Сигонового, царя Езбонського». Біблія більше його не згадує."
    - "Його пізніша історія відоміша за біблійну. Під назвою Бетарамфта Ірод Антипа обніс його мурами й перейменував на Лівіаду, потім Юліаду, на честь дружини Августа; Йосиф Флавій каже, що палац там було спалено в заколотах після смерті Ірода Великого. Євсевій каже, що сирійці називали місто Бетрамфта і що тепер це Лівіада, а прочанка Егерія проходила через Лівіаду дорогою до гори Нево. Назва живе в Талль-ер-Рамі, пагорбі біля села ер-Рама в Йорданській долині Йорданії, який більшість вважає римським містом і, можливо, біблійним; більший Талль-Іктану, приблизно за 3 км на схід, розкопаний Кей Праг у 1987–1990 рр. і заселений у ранню бронзову й залізну доби, — інший кандидат на сам Бет-Гарам. Жоден не дав напису."
  es:
    - "Bet-haram, escrita Betharán en Números y Beth-aram en Josué, era una ciudad de Gad en el valle del Jordán frente a Jericó. Cuando Rubén y Gad pidieron la tierra al este del río, los gaditas la fortificaron: «Beth-nimra, y Betharán: ciudades fuertes, y también majadas para ovejas». Josué la enumera entre las ciudades de Gad «la campiña de Beth-aram, y Beth-nimra, y Sucoth, y Saphón, resto del reino de Sehón, rey en Hesbón». La Biblia no la menciona de nuevo."
    - "Su historia posterior es mejor conocida que la bíblica. Con el nombre de Betharamphtha, Herodes Antipas la amuralló y la llamó Livias, luego Julias, por la esposa de Augusto; Josefo dice que el palacio de allí fue incendiado en los disturbios posteriores a la muerte de Herodes el Grande. Eusebio dice que los sirios llamaban a la ciudad Bethramphtha y que ahora era Livias, y la peregrina Egeria pasó por Livias camino del monte Nebo. El nombre pervive en Tall er-Rama, un montículo junto a la aldea de er-Rama, en el valle del Jordán de Jordania, que la mayoría toma por la ciudad romana y quizá por la bíblica; el mayor Tall Iktanu, a unos 3 km al este, excavado por Kay Prag en 1987–1990 y ocupado en las edades del Bronce Antiguo y del Hierro, es el otro candidato para la propia Bet-haram. Ninguno ha dado una inscripción."
  pt:
    - "Bete-Harã, grafada Bete-Arã em Josué, era uma cidade de Gade no vale do Jordão, defronte de Jericó. Quando Rúben e Gade pediram a terra a leste do rio, os gaditas a fortificaram: “Bete-Ninra e Bete-Harã: cidades fortificadas e currais para ovelhas”. Josué a lista entre as cidades de Gade “e no vale, Bete-Arã, Bete-Ninra, Sucote e Zafom, o resto do reino de Seom, rei de Hesbom”. A Bíblia não a menciona mais."
    - "Sua história posterior é mais conhecida que a bíblica. Com o nome de Betharamphtha, Herodes Antipas a cercou de muralhas e a rebatizou Lívias, depois Júlias, em honra da mulher de Augusto; Josefo diz que o palácio ali foi queimado nos distúrbios após a morte de Herodes, o Grande. Eusébio diz que os sírios chamavam a cidade Bethramphtha e que agora era Lívias, e a peregrina Egéria passou por Lívias a caminho do monte Nebo. O nome sobrevive em Tall er-Rama, um montículo junto à aldeia de er-Rama, no vale do Jordão jordaniano, que a maioria toma pela cidade romana e talvez pela bíblica; o maior Tall Iktanu, cerca de 3 km a leste, escavado por Kay Prag em 1987–1990 e ocupado nas Idades do Bronze Antigo e do Ferro, é o outro candidato à própria Bete-Harã. Nenhum rendeu inscrição."
  de:
    - "Bet-Haram, in 4. Mose Bet-Haran und bei Josua in der King-James-Bibel Beth-aram geschrieben (Luther hat dort Beth-Haran), war eine Stadt Gads im Jordantal gegenüber von Jericho. Als Ruben und Gad das Land östlich des Flusses erbaten, befestigten die Gaditer es: „Beth-Nimra und Beth-Haran, verschlossene Städte und Schafhürden“. Josua führt es unter Gads Städten auf, „im Tal aber Beth-Haran, Beth-Nimra, Sukkoth und Zaphon, was übrig war von dem Reich Sihons, des Königs zu Hesbon“. Die Bibel erwähnt es nicht wieder."
    - "Seine spätere Geschichte ist besser bekannt als seine biblische. Unter dem Namen Betharamphtha ummauerte Herodes Antipas es und nannte es Livias, dann Julias, nach der Frau des Augustus; Josephus sagt, der dortige Palast sei in den Unruhen nach dem Tod Herodes' des Großen verbrannt worden. Eusebius sagt, die Syrer hätten die Stadt Bethramphtha genannt und sie sei nun Livias, und die Pilgerin Egeria kam auf ihrem Weg zum Berg Nebo durch Livias. Der Name lebt in Tall er-Rama fort, einem Hügel beim Dorf er-Rama im jordanischen Jordantal, den die meisten für die römische Stadt und vielleicht die biblische halten; das größere Tall Iktanu, etwa 3 km östlich, 1987–1990 von Kay Prag ausgegraben und in der Früh- und Eisenzeit besiedelt, ist der andere Kandidat für Bet-Haram selbst. Keines hat eine Inschrift ergeben."
  fr:
    - "Beth-Haram, écrit Beth-Haran dans les Nombres et Beth-Aram dans Josué, était une ville de Gad dans la vallée du Jourdain en face de Jéricho. Quand Ruben et Gad demandèrent le pays à l’est du fleuve, les Gadites la fortifièrent : « Beth-Nimra et Beth-Haran, villes fortes, et ils firent des parcs pour les troupeaux ». Josué la range parmi les villes de Gad « dans la vallée, Beth-Haram, Beth-Nimra, Succoth et Tsaphon, reste du royaume de Sihon, roi de Hesbon ». La Bible ne la mentionne plus."
    - "Son histoire ultérieure est mieux connue que son histoire biblique. Sous le nom de Betharamphtha, Hérode Antipas la ceignit de murs et la rebaptisa Livias, puis Julias, d’après l’épouse d’Auguste ; Josèphe dit que le palais y fut brûlé dans les troubles après la mort d’Hérode le Grand. Eusèbe dit que les Syriens appelaient la ville Bethramphtha et qu’elle était maintenant Livias, et la pèlerine Égérie passa par Livias en allant au mont Nebo. Le nom survit à Tall er-Rama, tertre près du village d’er-Rama dans la vallée du Jourdain en Jordanie, que la plupart tiennent pour la ville romaine et peut-être la biblique ; le plus grand Tall Iktanu, à environ 3 km à l’est, fouillé par Kay Prag en 1987-1990 et occupé aux âges du Bronze ancien et du Fer, est l’autre candidat pour Beth-Haram même. Aucun n’a livré d’inscription."
scripture:
  - Num.32.36
  - Josh.13.27
