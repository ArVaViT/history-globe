# Overview article (ADR 0007). Mainstream facts only; a station of the itinerary with no known site; the app's point is called a guess.
id: alush
place: a32397f
title:
  en: "Alush"
  ru: "Алуш"
  uk: "Алуш"
  es: "Alús"
  pt: "Alus"
  de: "Alusch"
  fr: "Alusch"
body:
  en:
    - "Alush is a station of the exodus known only from the itinerary of Numbers 33, between Dophkah and Rephidim: “they departed from Dophkah, and encamped in Alush. And they removed from Alush, and encamped at Rephidim, where was no water for the people to drink”. The narrative of Exodus, telling the same stretch, passes straight from the wilderness of Sin to Rephidim, so Dophkah and Alush are two camps the story itself does not name, and nothing happened at either that the Bible records."
    - "Where it lay depends on where one puts Mount Sinai. On the traditional route down the west of the Sinai peninsula towards Jebel Musa it is sought in the wadis between the coast and the granite mountains; one proposal, Wadi el-Esh, rests only on the sound of the name, and no other evidence exists. The region is today the South Sinai governorate of Egypt."
  ru:
    - "Алуш — стан исхода, известный только по перечню в 33-й главе книги Чисел, между Дофкой и Рефидимом: «И отправились из Дофки и расположились станом в Алуше. И отправились из Алуша и расположились станом в Рефидиме, и не было там воды, чтобы пить народу». Повествование книги Исход на том же отрезке переходит прямо из пустыни Син в Рефидим, так что Дофка и Алуш — два стана, которых сам рассказ не называет, и ни в одном из них не произошло ничего, что записала бы Библия."
    - "Где он лежал, зависит от того, куда поместить гору Синай. На традиционном пути вдоль запада Синайского полуострова к Джебель-Мусе его ищут в вади между берегом и гранитными горами; одно из предположений, Вади-эль-Эш, держится лишь на созвучии имени, других свидетельств нет. Край этот сегодня — мухафаза Южный Синай в Египте."
  uk:
    - "Алуш — стоянка виходу, відома лише з переліку станів у Числах 33, між Дофкою і Рефідімом: «рушили з Дофки, та й отаборились в Алушу. І рушили з Алуша та й отаборились у Рефидимі; і не мали там люди води до пиття». Оповідь Виходу, розповідаючи про той самий відтинок, переходить просто від Сінської пустелі до Рефідіма, тож Дофка й Алуш — два табори, яких сама розповідь не називає, і нічого, що записала б Біблія, не сталося в жодному з них."
    - "Де він лежав, залежить від того, де розмістити гору Синай. На традиційному маршруті вздовж заходу Синайського півострова до Джебель-Муси його шукають у вадіях між узбережжям і гранітними горами; одна пропозиція, Вадій-ель-Еш, спирається лише на співзвучність назви, і інших доказів немає. Нині цей край — губернаторство Південний Синай Єгипту."
  es:
    - "Alús es una estación del éxodo conocida solo por el itinerario de Números 33, entre Dofca y Refidim: «partidos de Dophca, asentaron en Alús. Y partidos de Alús, asentaron en Rephidim, donde el pueblo no tuvo aguas para beber». La narración del Éxodo, que cuenta el mismo tramo, pasa directamente del desierto de Sin a Refidim, de modo que Dofca y Alús son dos campamentos que el propio relato no nombra, y en ninguno de ellos ocurrió nada que la Biblia registre."
    - "Dónde estuvo depende de dónde se sitúe el monte Sinaí. En la ruta tradicional que baja por el oeste de la península del Sinaí hacia el Jebel Musa, se busca en los uadis entre la costa y las montañas de granito; una propuesta, el uadi el-Esh, descansa solo en el sonido del nombre, y no existe ninguna otra prueba. La región es hoy la gobernación de Sinaí del Sur, en Egipto."
  pt:
    - "Alus é uma estação do êxodo conhecida apenas pelo itinerário de Números 33, entre Dofca e Refidim: “Partiram de Dofca e acamparam em Alus. Partiram de Alus e acamparam em Refidim, onde não havia água para o povo beber”. A narrativa de Êxodo, ao contar o mesmo trecho, passa direto do deserto de Sim a Refidim; assim, Dofca e Alus são dois acampamentos que a própria narrativa não nomeia, e nada aconteceu em nenhum deles que a Bíblia registre."
    - "Onde ficava depende de onde se põe o monte Sinai. No trajeto tradicional descendo pelo oeste da península do Sinai rumo ao Jebel Musa, procura-se nos uádis entre a costa e as montanhas de granito; uma proposta, o uádi el-Esh, apoia-se apenas na sonoridade do nome, e não há outra evidência. A região é hoje a província do Sinai do Sul, no Egito."
  de:
    - "Alusch ist eine Station des Auszugs, nur aus dem Wegverzeichnis von 4. Mose 33 bekannt, zwischen Dofka und Refidim: „Von Dophka zogen sie aus und lagerten sich in Alus. Von Alus zogen sie aus und lagerten sich in Raphidim, daselbst hatte das Volk kein Wasser zu trinken.“ Die Erzählung des zweiten Buches Mose, die dieselbe Strecke berichtet, geht von der Wüste Sin unmittelbar zu Refidim über, Dofka und Alusch sind also zwei Lager, die die Erzählung selbst nicht nennt, und an keinem geschah etwas, was die Bibel berichtet."
    - "Wo es lag, hängt davon ab, wo man den Sinai ansetzt. Auf der traditionellen Route die Westseite der Sinai-Halbinsel hinab zum Dschebel Musa sucht man es in den Wadis zwischen der Küste und den Granitbergen; ein Vorschlag, Wadi el-Esch, beruht allein auf dem Klang des Namens, und es gibt keinen anderen Beleg. Die Gegend ist heute das Gouvernement Süd-Sinai in Ägypten."
  fr:
    - "Alusch est une étape de l’exode connue seulement par l’itinéraire de Nombres 33, entre Dophka et Rephidim : « Ils partirent de Dophka, et campèrent à Alusch. Ils partirent d’Alusch, et campèrent à Rephidim, où le peuple ne trouva point d’eau à boire ». Le récit de l’Exode, qui relate le même tronçon, passe directement du désert de Sin à Rephidim ; Dophka et Alusch sont donc deux campements que le récit ne nomme pas, et rien ne s’y produisit que la Bible rapporte."
    - "Son emplacement dépend de celui du mont Sinaï. Sur l’itinéraire traditionnel qui descend l’ouest de la péninsule du Sinaï vers le Jebel Musa, on la cherche dans les ouadis entre la côte et les montagnes de granit ; une proposition, Wadi el-Esh, ne repose que sur la sonorité du nom, et il n’existe aucune autre preuve. La région est aujourd’hui le gouvernorat du Sinaï du Sud, en Égypte."
scripture:
  - Exod.17.1
  - Num.33.13-Num.33.14
sources:
