body:
  en:
    - "Alush is a station of the exodus known only from the itinerary of Numbers 33, between Dophkah and Rephidim: “they departed from Dophkah, and encamped in Alush. And they removed from Alush, and encamped at Rephidim, where was no water for the people to drink”. The narrative of Exodus, telling the same stretch, passes straight from the wilderness of Sin to Rephidim, so Dophkah and Alush are two camps the story itself does not name, and nothing happened at either that the Bible records."
    - "Where it lay depends on where one puts Mount Sinai. On the traditional route down the west of the Sinai peninsula towards Jebel Musa it is sought in the wadis between the coast and the granite mountains; one proposal, Wadi el-Esh, rests only on the sound of the name, and no other evidence exists. The region is today the South Sinai governorate of Egypt."
  ru:
    - "Алуш — стан исхода, известный только по перечню в 33-й главе книги Чисел, между Дофкой и Рефидимом: «И отправились из Дофки и расположились станом в Алуше. И отправились из Алуша и расположились станом в Рефидиме, и не было там воды, чтобы пить народу». Повествование книги Исход на том же отрезке переходит прямо из пустыни Син в Рефидим, так что Дофка и Алуш — два стана, которых сам рассказ не называет, и ни в одном из них не произошло ничего, что записала бы Библия."
    - "Где он лежал, зависит от того, куда поместить гору Синай. На традиционном пути вдоль запада Синайского полуострова к Джебель-Мусе его ищут в вади между берегом и гранитными горами; одно из предположений, Вади-эль-Эш, держится лишь на созвучии имени, других свидетельств нет. Край этот сегодня — мухафаза Южный Синай в Египте."
  uk:
    - "Алуш — стоянка виходу, відома лише з переліку станів у Числах 33, між Дофкою і Рефідімом: «рушили з Дофки, та й отаборились в Алушу. І рушили з Алуша та й отаборились у Рефидимі; і не мали там люди води до пиття». Оповідь Виходу, розповідаючи про той самий відтинок, переходить просто від Сінської пустелі до Рефідіма, тож Дофка й Алуш — два табори, яких сама розповідь не називає, і нічого, що записала б Біблія, не сталося в жодному з них."
    - "Де він лежав, залежить від того, де розмістити гору Синай. На традиційному маршруті вздовж заходу Синайського півострова до Джебель-Муси його шукають у вадіях між узбережжям і гранітними горами; одна пропозиція, Вадій-ель-Еш, спирається лише на співзвучність назви, і інших доказів немає. Нині цей край — губернаторство Південний Синай Єгипту."
  es:
    - "Alús es una estación del éxodo conocida solo por el itinerario de Números 33, entre Dofca y Refidim: «partidos de Dophca, asentaron en Alús. Y partidos de Alús, asentaron en Rephidim, donde el pueblo no tuvo aguas para beber». La narración del Éxodo, que cuenta el mismo tramo, pasa directamente del desierto de Sin a Refidim, de modo que Dofca y Alús son dos campamentos que el propio relato no nombra, y en ninguno de ellos ocurrió nada que la Biblia registre."
    - "Dónde estuvo depende de dónde se sitúe el monte Sinaí. En la ruta tradicional que baja por el oeste de la península del Sinaí hacia el Jebel Musa, se busca en los uadis entre la costa y las montañas de granito; una propuesta, el uadi el-Esh, descansa solo en el sonido del nombre, y no existe ninguna otra prueba. La región es hoy la gobernación de Sinaí del Sur, en Egipto."
  pt:
    - "Alus é uma estação do êxodo conhecida apenas pelo itinerário de Números 33, entre Dofca e Refidim: “Partiram de Dofca e acamparam em Alus. Partiram de Alus e acamparam em Refidim, onde não havia água para o povo beber”. A narrativa de Êxodo, ao contar o mesmo trecho, passa direto do deserto de Sim a Refidim; assim, Dofca e Alus são dois acampamentos que a própria narrativa não nomeia, e nada aconteceu em nenhum deles que a Bíblia registre."
    - "Onde ficava depende de onde se põe o monte Sinai. No trajeto tradicional descendo pelo oeste da península do Sinai rumo ao Jebel Musa, procura-se nos uádis entre a costa e as montanhas de granito; uma proposta, o uádi el-Esh, apoia-se apenas na sonoridade do nome, e não há outra evidência. A região é hoje a província do Sinai do Sul, no Egito."
  de:
    - "Alusch ist eine Station des Auszugs, nur aus dem Wegverzeichnis von 4. Mose 33 bekannt, zwischen Dofka und Refidim: „Von Dophka zogen sie aus und lagerten sich in Alus. Von Alus zogen sie aus und lagerten sich in Raphidim, daselbst hatte das Volk kein Wasser zu trinken.“ Die Erzählung des zweiten Buches Mose, die dieselbe Strecke berichtet, geht von der Wüste Sin unmittelbar zu Refidim über, Dofka und Alusch sind also zwei Lager, die die Erzählung selbst nicht nennt, und an keinem geschah etwas, was die Bibel berichtet."
    - "Wo es lag, hängt davon ab, wo man den Sinai ansetzt. Auf der traditionellen Route die Westseite der Sinai-Halbinsel hinab zum Dschebel Musa sucht man es in den Wadis zwischen der Küste und den Granitbergen; ein Vorschlag, Wadi el-Esch, beruht allein auf dem Klang des Namens, und es gibt keinen anderen Beleg. Die Gegend ist heute das Gouvernement Süd-Sinai in Ägypten."
  fr:
    - "Alusch est une étape de l’exode connue seulement par l’itinéraire de Nombres 33, entre Dophka et Rephidim : « Ils partirent de Dophka, et campèrent à Alusch. Ils partirent d’Alusch, et campèrent à Rephidim, où le peuple ne trouva point d’eau à boire ». Le récit de l’Exode, qui relate le même tronçon, passe directement du désert de Sin à Rephidim ; Dophka et Alusch sont donc deux campements que le récit ne nomme pas, et rien ne s’y produisit que la Bible rapporte."
    - "Son emplacement dépend de celui du mont Sinaï. Sur l’itinéraire traditionnel qui descend l’ouest de la péninsule du Sinaï vers le Jebel Musa, on la cherche dans les ouadis entre la côte et les montagnes de granit ; une proposition, Wadi el-Esh, ne repose que sur la sonorité du nom, et il n’existe aucune autre preuve. La région est aujourd’hui le gouvernorat du Sinaï du Sud, en Égypte."
  it:
    - "Alus è una tappa dell’esodo nota soltanto dall’itinerario di Numeri 33, tra Dofka e Refidim: «Partirono da Dofka e si accamparono ad Alush. Partirono da Alush e si accamparono a Refidim dove non c’era acqua da bere per il popolo». Il racconto dell’Esodo, che narra lo stesso tratto, passa direttamente dal deserto di Sin a Refidim, così Dofka e Alus sono due accampamenti che la storia stessa non nomina, e in nessuno dei due accadde nulla che la Bibbia registri."
    - "Dove sorgesse dipende da dove si pone il monte Sinai. Sul percorso tradizionale giù lungo l’ovest della penisola del Sinai verso il Jebel Musa la si cerca negli wadi tra la costa e le montagne di granito; una proposta, Wadi el-Esh, poggia soltanto sul suono del nome, e non esiste altra prova. La regione è oggi il governatorato del Sinai meridionale d’Egitto."
  pl:
    - "Alusz to stacja wyjścia z Egiptu znana tylko z wykazu w Lb 33, między Dofką a Refidim: „A ruszywszy się z Dafka, położyli się obozem w Alus. A ruszywszy się z Alus, położyli się obozem w Rafidym, gdzie nie miał lud wód dla napoju”. Opowieść Księgi Wyjścia, opisująca ten sam odcinek, przechodzi wprost z pustyni Sin do Refidim, więc Dofka i Alusz to dwa obozowiska, których sama opowieść nie wymienia, i nic się w żadnym z nich nie wydarzyło, co Biblia by zapisała."
    - "Gdzie leżało, zależy od tego, gdzie umieści się górę Synaj. Na tradycyjnej trasie w dół zachodnią częścią Półwyspu Synaj ku Dżabal Musa szuka się go w wadi między wybrzeżem a granitowymi górami; jedna propozycja, Wadi el-Esh, opiera się tylko na brzmieniu nazwy i nie ma żadnego innego dowodu. Region ten to dziś muhafaza Synaj Południowy w Egipcie."
  nl:
    - "Alus is een standplaats van de uittocht die alleen bekend is uit het reisverslag van Numeri 33, tussen Dofka en Refidim: “En zij verreisden van Dofka, en legerden zich in Aluz. En zij verreisden van Aluz, en legerden zich in Rafidim; doch daar was geen water voor het volk, om te drinken.” Het verhaal van Exodus, dat hetzelfde traject vertelt, gaat rechtstreeks van de woestijn Sin naar Refidim, dus Dofka en Alus zijn twee kampen die het verhaal zelf niet noemt, en bij geen van beide gebeurde iets wat de Bijbel vermeldt."
    - "Waar het lag, hangt af van waar men de berg Sinaï plaatst. Op de traditionele route langs de westkant van het Sinaïschiereiland naar de Jebel Musa wordt het gezocht in de wadi’s tussen de kust en de granietbergen; een voorstel, Wadi el-Esh, berust alleen op de klank van de naam, en ander bewijs bestaat er niet. De streek is tegenwoordig het gouvernement Zuid-Sinaï van Egypte."
  cs:
    - "Alúš je stanice exodu známá jen z itineráře v Numeri 33, mezi Dofkou a Refídimem: „A hnuvše se z Dafka, položili se v Halus. Hnuvše se pak z Halus, rozbili stany v Rafidim, kdežto lid neměl vody ku pití.“ Vyprávění Exodu, které popisuje tentýž úsek, přechází rovnou z pouště Sín do Refídimu, takže Dofka a Alúš jsou dva tábory, které příběh sám nejmenuje, a na žádném z nich se nestalo nic, co by Bible zaznamenala."
    - "Kde ležel, závisí na tom, kam kdo klade horu Sinaj. Na tradiční trase dolů po západní straně Sinajského poloostrova k Jebel Musa se hledá ve vádí mezi pobřežím a žulovými horami; jeden návrh, Wadi el-Esh, se opírá jen o znění jména a žádný jiný doklad neexistuje. Oblast je dnes egyptským guvernorátem Jižní Sinaj."
  sv:
    - "Alush är en station på uttåget som bara är känd från vandringsförteckningen i Fjärde Mosebok 33, mellan Dofka och Refidim: ”bröto upp från Dofka och lägrade sig i Alus. Och de bröto upp från Alus och lägrade sig i Refidim, och där fanns intet vatten åt folket att dricka”. Berättelsen i Andra Mosebok, som skildrar samma sträcka, går direkt från öknen Sin till Refidim, så Dofka och Alush är två läger som berättelsen själv inte nämner, och ingenting hände vid något av dem som Bibeln återger."
    - "Var det låg beror på var man förlägger Sinaiberget. På den traditionella vägen nedför Sinaihalvöns västra del mot Jebel Musa söks det i wadierna mellan kusten och granitbergen; ett förslag, Wadi el-Esh, vilar enbart på namnets ljud, och inget annat belägg finns. Trakten är i dag guvernementet Sydsinai i Egypten."
  nb:
    - "Alusj er en stasjon på utgangen fra Egypt, bare kjent fra reiseruten i 4. Mosebok 33, mellom Dofka og Refidim: «Og de drog fra Dofka og leiret sig i Alus. Og de drog fra Alus og leiret sig i Refidim; der hadde folket ikke vann å drikke». Fortellingen i 2. Mosebok, som beretter om den samme strekningen, går rett fra Sin-ørkenen til Refidim, så Dofka og Alusj er to leirer som fortellingen selv ikke nevner, og ingenting skjedde ved noen av dem som Bibelen forteller."
    - "Hvor den lå, avhenger av hvor man plasserer Sinai-fjellet. På den tradisjonelle ruten ned langs vestsiden av Sinaihalvøya mot Jebel Musa søkes den i wadiene mellom kysten og granittfjellene; ett forslag, Wadi el-Esh, hviler bare på navnets lyd, og noe annet bevis finnes ikke. Området er i dag guvernementet Sør-Sinai i Egypt."
  tl:
    - "Ang Alus ay isang himpilan ng exodo na kilala lamang mula sa talaan ng paglalakbay sa Mga Bilang 33, sa pagitan ng Dophca at Rephidim: “At sila'y naglakbay mula sa Dophca, at humantong sa Alus. At sila'y naglakbay mula sa Alus, at humantong sa Rephidim, na doon, nga walang tubig na mainom ang bayan.” Ang salaysay ng Exodo, na naglalahad ng parehong bahagi, ay tuwirang lumilipat mula sa ilang ng Sin patungong Rephidim, kaya ang Dophca at Alus ay dalawang kampong hindi pinangalanan ng salaysay mismo, at walang nangyaring itinatala ng Biblia sa alinman sa dalawa."
    - "Nakasalalay ang lugar nito sa kung saan inilalagay ang Bundok Sinai. Sa tradisyonal na ruta pababa sa kanluran ng tangway ng Sinai patungong Jebel Musa, hinahanap ito sa mga wadi sa pagitan ng baybayin at ng mga bundok na granito; isang mungkahi, ang Wadi el-Esh, ay nakasalig lamang sa tunog ng pangalan, at wala nang ibang katibayan. Ang rehiyon ay ang Gobernoradong Timog Sinai ng Egipto ngayon."
  da:
    - "Alusj er en station på udvandringen, kendt alene fra rejseberetningen i 4 Mosebog 33, mellem Dofka og Refidim: »de rejste fra Dofka, og de lejrede sig i Alus. Og de rejste fra Alus, og de lejrede sig i Refidim; og der havde Folket ikke Vand at drikke«. Beretningen i 2 Mosebog, der fortæller om det samme stykke, går direkte fra Sins ørken til Refidim, så Dofka og Alusj er to lejre, som fortællingen selv ikke nævner, og intet skete ved nogen af dem, som Bibelen beretter."
    - "Hvor det lå, afhænger af, hvor man placerer Sinaj. På den traditionelle rute ned langs Sinaihalvøens vestside mod Jebel Musa søges det i wadierne mellem kysten og granitbjergene; ét forslag, Wadi el-Esh, hviler alene på navnets lyd, og andet belæg findes ikke. Egnen er i dag Egyptens guvernement Sydsinai."
