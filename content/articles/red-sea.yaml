# Overview article (ADR 0007). Mainstream facts only; the place of the crossing is given as disputed, with the app's candidates named; the "sea of reeds" reading is given as the usual one.
id: red-sea
place: a3d18b2
title:
  en: "Red Sea"
  ru: "Чермное море"
  uk: "Червоне море"
  es: "Mar Rojo"
  pt: "Mar Vermelho"
  de: "Rotes Meer"
  fr: "Mer Rouge"
  it: "Mar Rosso"
  pl: "Morze Czerwone"
  cs: "Rudé moře"
  nl: "Rode Zee"
  sv: "Sävhavet"
  nb: "Rødehavet"
  tl: "Dagat na Pula"
  da: "Det Røde Hav"
body:
  en:
    - "The Red Sea of the English Bible is the Hebrew yam suph, “sea of reeds”: suph is the word for the “flags” in which the infant Moses was hidden, and it seems borrowed from the Egyptian name of the papyrus marsh. The Greek translators rendered it Red Sea, the Greek name for the seas south of Egypt and Arabia, the gulf between Africa and Arabia included, and the Latin, English and Russian Bibles followed them. In the Bible the name covers more than one stretch of water: Solomon's ships were built at Ezion-geber “on the shore of the Red sea, in the land of Edom”, that is on the Gulf of Aqaba, and Israel went round Edom “by the way of the Red sea”."
    - "The sea of the exodus is the one Israel crossed. Led “through the way of the wilderness of the Red sea”, the people saw the Egyptian chariots behind them; Moses stretched out his hand, “the LORD caused the sea to go back by a strong east wind all that night”, and Israel went “into the midst of the sea upon the dry ground”, while Pharaoh's host was drowned. The Song of the Sea sings that his chosen captains “are drowned in the Red sea”. From there Moses led the people into the wilderness of Shur; the list of stations has them camp “by the Red sea” again after Elim."
    - "Where the crossing took place is disputed. The candidates run from the northern end of the Gulf of Suez through the Bitter Lakes, Lake Timsah and the Ballah Lakes, the chain of lakes along today's Suez Canal, to the Pelusiac branch of the Nile and the lagoons of the Mediterranean shore; a few place it at the Gulf of Aqaba. Egyptian texts of the New Kingdom know a papyrus marsh near the city of Rameses, and many scholars look for the yam suph among the lakes east of the Delta, holding that the name was later stretched to the Red Sea proper. Josephus already compared the crossing with Alexander's passage along the Pamphylian shore."
    - "The crossing became Israel's great memory of deliverance. Rahab had heard how “the LORD dried up the water of the Red sea”; the Psalms praise him “which divided the Red sea into parts” and “overthrew Pharaoh and his host in the Red sea”; Stephen names the wonders “in the Red sea”, and Hebrews says that by faith “they passed through the Red sea as by dry land”. The Red Sea today, some 2,250 km long, is joined to the Mediterranean by the Suez Canal, opened in 1869 through those same lakes, and its coral reefs draw divers to Sinai, Eilat and Aqaba."
  ru:
    - "Чермное море Библии — еврейское ям-суф, «море тростника»: словом суф назван тростник, в котором спрятали младенца Моисея, и, по-видимому, оно заимствовано из египетского названия папирусных болот. Греческие переводчики передали его как Красное море, греческое имя морей к югу от Египта и Аравии, включая залив между Африкой и Аравией, и латинская, английская и русская Библии последовали за ними; славянское «чермное» и значит «красное». В Библии это имя покрывает не одну полосу воды: корабли Соломона строились в Ецион-Гавере «на берегу Чермного моря, в земле Идумейской», то есть на заливе Акаба, а Израиль обходил Едом «путем Чермного моря»."
    - "Море исхода — то, которое Израиль перешёл. «И обвел Бог народ дорогою пустынною к Чермному морю», и народ увидел за собой египетские колесницы; Моисей простёр руку, «и гнал Господь море сильным восточным ветром всю ночь», и Израиль пошёл «среди моря по суше», а войско фараона потонуло. Песнь у моря поёт, что его избранные военачальники «потонули в Чермном море». Оттуда Моисей повёл народ в пустыню Сур; в перечне станов они ещё раз стоят «у Чермного моря» после Елима."
    - "Где произошёл переход, спорно. Кандидаты тянутся от северной оконечности Суэцкого залива через Горькие озёра, озеро Тимсах и озёра Баллах — цепь озёр вдоль нынешнего Суэцкого канала — до Пелусийского рукава Нила и лагун средиземноморского берега; немногие помещают его у залива Акаба. Египетские тексты Нового царства знают папирусное болото близ города Раамсеса, и многие учёные ищут ям-суф среди озёр к востоку от Дельты, полагая, что имя позже распространили на собственно Красное море. Иосиф Флавий уже сравнивал переход с проходом Александра вдоль памфилийского берега."
    - "Переход стал главной памятью Израиля об избавлении. Раав слышала, «как Господь Бог иссушил пред вами воду Чермного моря»; псалмы славят Того, Кто «разделил Чермное море» и «низверг фараона и войско его в море Чермное»; Стефан называет чудеса «в Чермном море», а Послание к Евреям говорит: «Верою перешли они Чермное море, как по суше». Красное море сегодня, длиной около 2250 км между Африкой и Аравией, соединено со Средиземным Суэцким каналом, открытым в 1869 году через те же озёра, а его коралловые рифы привлекают ныряльщиков на Синай, в Эйлат и Акабу."
  uk:
    - "Червоне море англійської Біблії — це давньоєврейське ям-суф, «море очерету»: слово суф — це назва очерету, в якому було сховане немовля Мойсей, і, схоже, воно запозичене з єгипетської назви папірусних боліт. Грецькі перекладачі передали його як Червоне море — грецьку назву морів на південь від Єгипту та Аравії, включно із затокою між Африкою та Аравією, і латинська, англійська та російська Біблії пішли за ними. У Біблії ця назва охоплює не одну смугу води: кораблі Соломона будувалися в Еціон-Гевері «на березї Червоного моря в Едом-землї», тобто на затоці Акаба, а Ізраїль обходив Едом «шляхом до Червоного моря»."
    - "Море Виходу — це те, яке перейшов Ізраїль. Ведений «по дорозї до степу Червономорського», народ побачив єгипетські колісниці позаду; Мойсей простягнув руку, «одганяв Господь море геть потужним восточнім вітром у сю ніч», і Ізраїль ввійшов «в середину моря по сусї», тоді як військо фараона потонуло. Пісня моря співає: «вибране отаманнє потонуло в морі; … згинули в Червонім». Звідти Мойсей повів народ у пустиню Сур; у переліку стоянок після Елім вони знову «отаборились над Червоним морем»."
    - "Де відбувся перехід, спірно. Кандидати тягнуться від північного краю Суецької затоки через Гіркі озера, озеро Тімсах і озера Балла, ланцюг озер уздовж сучасного Суецького каналу, до Пелусійського рукава Нілу та лагун середземноморського узбережжя; декотрі поміщають його на затоці Акаба. Єгипетські тексти Нового царства знають папірусні болота біля міста Раамсес, і багато вчених шукають ям-суф серед озер на схід від Дельти, вважаючи, що назву пізніше поширили на власне Червоне море. Йосиф Флавій уже порівнював перехід із проходом Александра вздовж памфілійського узбережжя."
    - "Перехід став великою пам’яттю Ізраїлю про визволення. Рахав чула, як «Господь висушив воду в Червоному морі»; псалми славлять того, хто «розполовив Червоне море» і «Фараона і військо його кинув у Червоне море»; Стефан називає чудеса «на Червоному морі», а Послання до євреїв каже, що вірою «перейшли вони Червоне море, як по суходолу». Сьогодні Червоне море, завдовжки близько 2250 км між Африкою та Аравією, з’єднане із Середземним морем Суецьким каналом, відкритим 1869 року через ті самі озера, а його коралові рифи приваблюють аквалангістів до Синаю, Ейлата й Акаби."
  es:
    - "El mar Rojo de la Biblia es el hebreo yam suph, «mar de juncos»: suph es la palabra para el «carrizal» en que fue escondido el niño Moisés, y parece tomada del nombre egipcio del pantano de papiros. Los traductores griegos lo vertieron como mar Rojo, el nombre griego de los mares al sur de Egipto y Arabia, incluido el golfo entre África y Arabia, y las Biblias latina, inglesa y rusa los siguieron. En la Biblia el nombre abarca más de una extensión de agua: las naves de Salomón se construyeron en Ezión-geber «en la ribera del mar Bermejo, en la tierra de Edom», es decir, en el golfo de Aqaba, e Israel rodeó Edom «camino del mar Bermejo»."
    - "El mar del éxodo es el que Israel cruzó. Conducido «por el camino del desierto del mar Bermejo», el pueblo vio los carros egipcios detrás de sí; Moisés extendió su mano, «hizo Jehová que la mar se retirase por recio viento oriental toda aquella noche», e Israel entró «por medio de la mar en seco», mientras la hueste del faraón se ahogaba. El Cántico del Mar canta que sus escogidos príncipes «fueron hundidos en el mar Bermejo». Desde allí Moisés condujo al pueblo al desierto de Shur; la lista de estaciones los hace acampar de nuevo «junto al mar Bermejo» después de Elim."
    - "Dónde tuvo lugar el cruce se discute. Los candidatos van desde el extremo norte del golfo de Suez a través de los Lagos Amargos, el lago Timsah y los lagos Ballah, la cadena de lagos a lo largo del actual canal de Suez, hasta el brazo pelusíaco del Nilo y las lagunas de la costa mediterránea; unos pocos lo sitúan en el golfo de Aqaba. Los textos egipcios del Reino Nuevo conocen un pantano de papiros cerca de la ciudad de Ramesés, y muchos estudiosos buscan el yam suph entre los lagos al este del Delta, sosteniendo que el nombre se extendió más tarde al mar Rojo propiamente dicho. Josefo ya comparaba el cruce con el paso de Alejandro por la costa de Panfilia."
    - "El cruce se convirtió en el gran recuerdo de liberación de Israel. Rahab había oído cómo «Jehová hizo secar las aguas del mar Bermejo»; los Salmos alaban al «que dividió el mar Bermejo en partes» y «arrojó á Faraón y á su ejército en el mar Bermejo»; Esteban nombra los prodigios «en el mar Bermejo», y Hebreos dice que por fe «pasaron el mar Bermejo como por tierra seca». El mar Rojo actual, de unos 2250 km de longitud entre África y Arabia, se une al Mediterráneo por el canal de Suez, abierto en 1869 a través de esos mismos lagos, y sus arrecifes de coral atraen a buceadores al Sinaí, Eilat y Aqaba."
  pt:
    - "O Mar Vermelho da Bíblia inglesa é o hebraico yam suph, “mar de juncos”: suph é a palavra para os “juncos” em que o menino Moisés foi escondido, e parece tomada do nome egípcio do pântano de papiros. Os tradutores gregos a verteram por Mar Vermelho, o nome grego dos mares ao sul do Egito e da Arábia, incluído o golfo entre a África e a Arábia, e as Bíblias latina, inglesa e russa os seguiram. Na Bíblia o nome abrange mais de um trecho de água: os navios de Salomão foram construídos em Eziom-Geber “na margem do mar Vermelho, na terra de Edom”, isto é, no golfo de Aqaba, e Israel contornou Edom “pelo caminho do Mar Vermelho”."
    - "O mar do êxodo é o que Israel atravessou. Conduzido “pelo caminho do deserto, perto do Mar Vermelho”, o povo viu os carros egípcios atrás de si; Moisés estendeu a mão, “o SENHOR fez o mar recuar por um forte vento oriental durante toda a noite”, e Israel entrou “pelo meio do mar em terra seca”, enquanto a hoste do Faraó se afogava. O Cântico do Mar canta que seus capitães escolhidos “afundaram no Mar Vermelho”. Dali Moisés conduziu o povo ao deserto de Sur; a lista das estações os faz acampar de novo “junto ao Mar Vermelho” depois de Elim."
    - "Onde se deu a travessia é disputado. Os candidatos vão da ponta norte do golfo de Suez, passando pelos Lagos Amargos, pelo Lago Timsah e pelos lagos Ballah, a cadeia de lagos ao longo do atual Canal de Suez, até o braço pelusíaco do Nilo e as lagunas da costa do Mediterrâneo; alguns a situam no golfo de Aqaba. Textos egípcios do Novo Reino conhecem um pântano de papiros perto da cidade de Ramessés, e muitos estudiosos procuram o yam suph entre os lagos a leste do Delta, sustentando que o nome foi depois estendido ao Mar Vermelho propriamente dito. Josefo já comparava a travessia com a passagem de Alexandre ao longo da costa da Panfília."
    - "A travessia tornou-se a grande memória de libertação de Israel. Raabe tinha ouvido como “o SENHOR secou a água do Mar Vermelho”; os Salmos louvam aquele “que dividiu o Mar Vermelho em duas partes” e “derrubou o faraó e o seu exército no Mar Vermelho”; Estêvão nomeia as maravilhas “no mar Vermelho”, e Hebreus diz que, pela fé, “passaram pelo Mar Vermelho como em terra seca”. O Mar Vermelho de hoje, com cerca de 2.250 km de comprimento entre a África e a Arábia, está ligado ao Mediterrâneo pelo Canal de Suez, aberto em 1869 pelos mesmos lagos, e seus recifes de coral atraem mergulhadores ao Sinai, a Eilat e a Aqaba."
  de:
    - "Das Rote Meer der englischen Bibel ist das hebräische yam suph, „Schilfmeer“: suph ist das Wort für das „Schilf“, in dem der kleine Mose verborgen wurde, und scheint dem ägyptischen Namen des Papyrussumpfes entlehnt. Die griechischen Übersetzer gaben es als Rotes Meer wieder, den griechischen Namen für die Meere südlich von Ägypten und Arabien, den Golf zwischen Afrika und Arabien eingeschlossen, und die lateinische, englische und russische Bibel folgten ihnen. In der Bibel umfasst der Name mehr als einen Gewässerabschnitt: Salomos Schiffe wurden in Ezjon-Geber „am Ufer des Schilfmeers im Lande der Edomiter“ gebaut, also am Golf von Akaba, und Israel zog um Edom „auf dem Wege zum Schilfmeer“."
    - "Das Meer des Exodus ist das, das Israel durchquerte. Geführt „durch die Wüste am Schilfmeer“, sah das Volk die ägyptischen Wagen hinter sich; Mose reckte seine Hand, „ließ es der HERR hinwegfahren durch einen starken Ostwind die ganze Nacht“, und Israel ging „mitten ins Meer auf dem Trockenen“, während Pharaos Heer ertrank. Das Lied am Meer singt: „seine auserwählten Hauptleute versanken im Schilfmeer“. Von dort führte Mose das Volk in die Wüste Schur; die Stationenliste lässt es nach Elim wieder „an das Schilfmeer“ lagern."
    - "Wo die Durchquerung stattfand, ist umstritten. Die Kandidaten reichen vom Nordende des Golfs von Sues über die Bitterseen, den Timsah-See und die Ballah-Seen, die Seenkette am heutigen Sueskanal, bis zum pelusischen Nilarm und den Lagunen der Mittelmeerküste; einige setzen sie an den Golf von Akaba. Ägyptische Texte des Neuen Reiches kennen einen Papyrussumpf nahe der Stadt Ramses, und viele Gelehrte suchen das yam suph unter den Seen östlich des Deltas und meinen, der Name sei später auf das eigentliche Rote Meer ausgedehnt worden. Josephus verglich die Durchquerung schon mit Alexanders Zug entlang der pamphylischen Küste."
    - "Die Durchquerung wurde Israels große Erinnerung an die Rettung. Rahab hatte gehört, „wie der HERR hat das Wasser im Schilfmeer ausgetrocknet vor euch her“; die Psalmen preisen ihn, „der das Schilfmeer teilte in zwei Teile“ und „der Pharao und sein Heer ins Schilfmeer stieß“; Stephanus nennt die Wunder „im Roten Meer“, und der Hebräerbrief sagt, im Glauben „gingen sie durchs Rote Meer wie durch trockenes Land“. Das heutige Rote Meer, etwa 2250 km lang zwischen Afrika und Arabien, ist durch den 1869 durch eben diese Seen eröffneten Sueskanal mit dem Mittelmeer verbunden, und seine Korallenriffe ziehen Taucher an den Sinai, nach Elat und Akaba."
  fr:
    - "La mer Rouge de la Bible anglaise est l’hébreu yam suph, « mer des Roseaux » : suph est le mot pour les « roseaux » où fut caché l’enfant Moïse, et il semble emprunté au nom égyptien du marais à papyrus. Les traducteurs grecs l’ont rendu par mer Rouge, nom grec des mers au sud de l’Égypte et de l’Arabie, golfe entre l’Afrique et l’Arabie compris, et les Bibles latine, anglaise, russe et française les ont suivis. Dans la Bible, le nom recouvre plus d’une étendue d’eau : les navires de Salomon furent construits à Étsjon-Guéber « sur les bords de la mer Rouge, dans le pays d’Édom », c’est-à-dire sur le golfe d’Aqaba, et Israël contourna Édom « par le chemin de la mer Rouge »."
    - "La mer de l’exode est celle qu’Israël traversa. Conduit « par le chemin du désert, vers la mer Rouge », le peuple vit les chars égyptiens derrière lui ; Moïse étendit sa main, « l’Éternel refoula la mer par un vent d’orient, qui souffla avec impétuosité toute la nuit », et Israël entra « au milieu de la mer à sec », tandis que l’armée de Pharaon était engloutie. Le Cantique de la mer chante que ses combattants d’élite « ont été engloutis dans la mer Rouge ». De là Moïse mena le peuple au désert de Schur ; la liste des étapes les fait camper de nouveau « près de la mer Rouge » après Élim."
    - "Où eut lieu la traversée est disputé. Les candidats vont de l’extrémité nord du golfe de Suez, par les lacs Amers, le lac Timsah et les lacs Ballah, la chaîne de lacs le long de l’actuel canal de Suez, à la branche pélusiaque du Nil et aux lagunes du rivage méditerranéen ; quelques-uns la placent au golfe d’Aqaba. Des textes égyptiens du Nouvel Empire connaissent un marais à papyrus près de la ville de Ramsès, et bien des spécialistes cherchent le yam suph parmi les lacs à l’est du Delta, tenant que le nom fut plus tard étendu à la mer Rouge proprement dite. Flavius Josèphe comparait déjà la traversée au passage d’Alexandre le long du rivage de Pamphylie."
    - "La traversée devint le grand souvenir de délivrance d’Israël. Rahab avait appris comment « l’Éternel a mis à sec devant vous les eaux de la mer Rouge » ; les Psaumes louent celui « qui coupa en deux la mer Rouge » et « précipita Pharaon et son armée dans la mer Rouge » ; Étienne nomme les prodiges « au sein de la mer Rouge », et l’épître aux Hébreux dit que par la foi « ils traversèrent la mer Rouge comme un lieu sec ». La mer Rouge actuelle, longue de quelque 2 250 km entre l’Afrique et l’Arabie, est reliée à la Méditerranée par le canal de Suez, ouvert en 1869 à travers ces mêmes lacs, et ses récifs coralliens attirent les plongeurs au Sinaï, à Eilat et à Aqaba."
  it:
    - "Il Mar Rosso della Bibbia inglese è l’ebraico yam suph, «mare di canne»: suph è la parola per le canne in cui fu nascosto il piccolo Mosè, e sembra presa in prestito dal nome egizio della palude di papiro. I traduttori greci lo resero con Mar Rosso, il nome greco dei mari a sud dell’Egitto e dell’Arabia, compreso il golfo tra l’Africa e l’Arabia, e le Bibbie latina, inglese e russa li seguirono. Nella Bibbia il nome copre più di un tratto d’acqua: le navi di Salomone furono costruite a Ezion-Gheber «sul lido del mar Rosso, nel paese di Edom», cioè sul Golfo di Aqaba, e Israele girò attorno a Edom «movendo verso il mar Rosso»."
    - "Il mare dell’esodo è quello che Israele attraversò. Condotto «per la via del deserto, verso il mar Rosso», il popolo vide i carri egiziani alle sue spalle; Mosè stese la mano, «l’Eterno fece ritirare il mare mediante un gagliardo vento orientale durato tutta la notte», e Israele entrò «in mezzo al mare sull’asciutto», mentre l’esercito del Faraone fu sommerso. Il Cantico del mare canta che «i migliori suoi condottieri sono stati sommersi nel mar Rosso». Di là Mosè condusse il popolo nel deserto di Sur; l’elenco delle tappe li fa accampare di nuovo «presso il mar Rosso» dopo Elim."
    - "Dove avvenne l’attraversamento è controverso. I candidati vanno dall’estremità settentrionale del Golfo di Suez, attraverso i Laghi Amari, il Lago Timsah e i Laghi Ballah, la catena di laghi lungo l’odierno Canale di Suez, fino al ramo pelusiaco del Nilo e alle lagune della riva mediterranea; alcuni lo collocano al Golfo di Aqaba. Testi egizi del Nuovo Regno conoscono una palude di papiro presso la città di Ramses, e molti studiosi cercano lo yam suph tra i laghi a est del Delta, ritenendo che il nome sia stato poi esteso al Mar Rosso propriamente detto. Già Giuseppe Flavio paragonava l’attraversamento al passaggio di Alessandro lungo la costa della Panfilia."
    - "L’attraversamento divenne il grande ricordo della liberazione di Israele. Raab aveva udito come «l’Eterno asciugò le acque del mar Rosso»; i Salmi lodano colui «che divise il Mar rosso in due» e «travolse Faraone e il suo esercito nel Mar Rosso»; Stefano nomina i prodigi «nel mar Rosso», e l’Epistola agli Ebrei dice che per fede «passarono il Mar Rosso come per l’asciutto». Il Mar Rosso di oggi, lungo circa 2.250 km tra l’Africa e l’Arabia, è congiunto al Mediterraneo dal Canale di Suez, aperto nel 1869 attraverso quegli stessi laghi, e le sue barriere coralline attirano sub nel Sinai, a Eilat e ad Aqaba."
  pl:
    - "Morze Czerwone Biblii angielskiej to hebrajskie jam suf, „morze trzcin”: suf to słowo na rośliny, wśród których — „między rogóż na brzegu rzeki” — ukryto niemowlę Mojżesza, i zdaje się pożyczone z egipskiej nazwy papirusowych bagien. Greccy tłumacze oddali je jako Morze Czerwone, grecką nazwę mórz na południe od Egiptu i Arabii, łącznie z zatoką między Afryką a Arabią, a biblie łacińskie, angielskie i rosyjskie poszły za nimi. W Biblii nazwa obejmuje więcej niż jeden akwen: okręty Salomona zbudowano w Esjon-Geber „nad brzegiem morza czerwonego, w ziemi Edomskiej”, czyli nad Zatoką Akaba, a Izrael obchodził Edom „drogą ku morzu czerwonemu”."
    - "Morze Wyjścia to to, które przekroczył Izrael. Prowadzony „drogą pustyni nad morzem czerwonem”, lud ujrzał za sobą egipskie rydwany; Mojżesz wyciągnął rękę, „Pan rozpędził morze wiatrem wschodnim gwałtownie wiejącym przez całą noc”, a Izrael szedł „środkiem morza po suszy”, podczas gdy wojsko faraona utonęło. Pieśń nad Morzem śpiewa, że jego wybrani wodzowie „potopieni są w morzu czerwonem”. Stamtąd Mojżesz wprowadził lud na pustynię Szur; lista stacji każe im obozować „nad morzem czerwonem” ponownie po Elim."
    - "Gdzie nastąpiło przejście, jest sporne. Kandydaci sięgają od północnego krańca Zatoki Sueskiej przez Jeziora Gorzkie, jezioro Timsah i Jeziora Ballah, łańcuch jezior wzdłuż dzisiejszego Kanału Sueskiego, po peluzyjskie ramię Nilu i laguny wybrzeża śródziemnomorskiego; nieliczni umieszczają je w Zatoce Akaba. Teksty egipskie Nowego Państwa znają papirusowe bagno koło miasta Ramses i wielu uczonych szuka jam suf wśród jezior na wschód od Delty, uważając, że nazwę rozciągnięto później na właściwe Morze Czerwone. Józef Flawiusz porównywał już przejście z przejściem Aleksandra wzdłuż brzegu pamfilijskiego."
    - "Przejście stało się wielką pamięcią Izraela o wybawieniu. Rachab mówiła o tym, co słyszeli: „wysuszył Pan wody morza czerwonego przed wami”; Psalmy chwalą Tego, „Który rozdzielił morze Czerwone na rozdziały”, i „I wrzucił Faraona z wojskiem jego w morze Czerwone”; Szczepan wymienia cuda „na morzu Czerwonem”, a List do Hebrajczyków mówi, że wiarą „przeszli przez morze Czerwone, jako po suszy”. Dzisiejsze Morze Czerwone, długie na około 2250 km między Afryką a Arabią, jest połączone z Morzem Śródziemnym Kanałem Sueskim, otwartym w 1869 roku przez te same jeziora, a jego rafy koralowe przyciągają nurków do Synaju, Ejlatu i Akaby."
  cs:
    - "Rudé moře anglické Bible je hebrejské jam sūf, „moře rákosové“: sūf je slovo pro „rákosí“, do něhož bylo ukryto nemluvně Mojžíš, a zdá se být přejato z egyptského jména papyrového močálu. Řečtí překladatelé je přeložili jako Rudé moře, řecké jméno moří jižně od Egypta a Arábie, včetně zálivu mezi Afrikou a Arábií, a latinské, anglické i ruské Bible je následovaly. V Bibli jméno zahrnuje víc než jeden vodní úsek: Šalomounovy lodě byly postaveny v Ecjon-geberu „na břehu moře Rudého v zemi Idumejské“, tedy na Akabském zálivu, a Izrael obcházel Edóm „cestou k moři Rudému“."
    - "Moře exodu je to, jímž Izrael přešel. Veden „cestou přes poušť, kteráž jest při moři Rudém“, viděl lid za sebou egyptské vozy; Mojžíš vztáhl ruku a „Hospodin rozdělil moře větrem východním prudce vějícím přes celou noc“ a Izrael šel „prostředkem moře po suše“, zatímco Faraonovo vojsko se utopilo. Píseň o moři zpívá, že jeho vybraní velitelé „ztopeni jsou v moři Rudém“. Odtud Mojžíš vedl lid do pouště Šur; seznam stanovišť je nechává utábořit „u moře Rudého“ znovu po Élimu."
    - "Kde přechod proběhl, je sporné. Kandidáti sahají od severního konce Suezského zálivu přes Hořká jezera, jezero Timsáh a jezera Balláh, řetěz jezer podél dnešního Suezského průplavu, k pelúsijskému rameni Nilu a lagunám na středomořském břehu; několik jich jej klade na Akabský záliv. Egyptské texty Nové říše znají papyrový močál u města Ramesse a mnozí učenci hledají jam sūf mezi jezery východně od Delty, přičemž soudí, že se jméno později rozšířilo na Rudé moře v pravém smyslu. Josephus už přirovnával přechod k Alexandrovu průchodu podél pamfylského břehu."
    - "Přechod se stal velkou vzpomínkou Izraele na vysvobození. Rachab slyšela, jak „vysušil Hospodin vody moře Rudého před tváří vaší“; žalmy chválí toho, „Kterýž rozdělil moře Rudé na díly“ a „uvrhl Faraona s vojskem jeho do moře Rudého“; Štěpán jmenuje divy „na moři Červeném“ a List Židům praví, že věrou „přešli moře červené jako po suchu“. Dnešní Rudé moře, dlouhé asi 2 250 km mezi Afrikou a Arábií, je se Středozemním mořem spojeno Suezským průplavem, otevřeným roku 1869 skrz tatáž jezera, a jeho korálové útesy lákají potápěče k Sinaji, Ejlatu a Akabě."
  nl:
    - "De Rode Zee van de Engelse Bijbel is het Hebreeuwse yam suph, “rietzee”: suph is het woord voor de “biezen” waarin het kindje Mozes verborgen werd, en lijkt ontleend aan de Egyptische naam van het papyrusmoeras. De Griekse vertalers gaven het weer als Rode Zee, de Griekse naam voor de zeeën ten zuiden van Egypte en Arabië, de golf tussen Afrika en Arabië inbegrepen, en de Latijnse, Engelse en Russische bijbels volgden hen. In de Bijbel dekt de naam meer dan één waterstuk: Salomo’s schepen werden gebouwd te Ezeon-Geber “aan den oever der Schelfzee, in het land van Edom”, dat is aan de Golf van Akaba, en Israël trok om Edom heen “op den weg der Schelfzee”."
    - "De zee van de uittocht is die welke Israël doorstak. Geleid “langs den weg van de woestijn der Schelfzee” zag het volk de Egyptische wagens achter zich; Mozes strekte zijn hand uit, “zo deed de HEERE de zee weggaan, door een sterken oostenwind, dien gansen nacht”, en Israël ging “in het midden van de zee, op het droge”, terwijl Farao’s leger verdronk. Het Lied van de Zee zingt dat zijn uitgelezen aanvoerders “zijn verdronken in de Schelfzee”. Van daar leidde Mozes het volk de woestijn Sur in; de lijst van verblijfplaatsen laat hen na Elim opnieuw “aan de Schelfzee” kamperen."
    - "Waar de doortocht plaatsvond, is omstreden. De kandidaten lopen van het noordeinde van de Golf van Suez via de Bittermeren, het Timsahmeer en de Ballahmeren, de reeks meren langs het huidige Suezkanaal, tot de Pelusische arm van de Nijl en de lagunes van de Middellandse Zeekust; enkelen plaatsen haar bij de Golf van Akaba. Egyptische teksten van het Nieuwe Rijk kennen een papyrusmoeras bij de stad Raämses, en veel geleerden zoeken de yam suph tussen de meren ten oosten van de Delta, in de opvatting dat de naam later werd uitgebreid tot de eigenlijke Rode Zee. Josephus vergeleek de doortocht al met Alexanders tocht langs de Pamfylische kust."
    - "De doortocht werd Israëls grote herinnering aan de bevrijding. Rachab had gehoord hoe “de HEERE de wateren der Schelfzee uitgedroogd heeft”; de Psalmen prijzen hem “Die de Schelfzee in delen deelde” en zeggen: “Hij heeft Farao met zijn heir gestort in de Schelfzee”; Stefanus noemt de wonderen “in de Rode zee”, en Hebreeën zegt dat door het geloof “zij de Rode zee doorgegaan” zijn, “als door het droge”. De Rode Zee is nu zo’n 2250 km lang tussen Afrika en Arabië en is door het Suezkanaal, in 1869 door diezelfde meren geopend, met de Middellandse Zee verbonden, en haar koraalriffen trekken duikers naar de Sinaï, Eilat en Akaba."
  sv:
    - "Det Röda havet i den engelska Bibeln är hebreiska yam suph, ”sävhavet”: suph är ordet för ”vassen” där spädbarnet Mose göms, och det tycks vara lånat från egyptiska namnet på papyrusträsket. De grekiska översättarna återgav det som Röda havet, det grekiska namnet på haven söder om Egypten och Arabien, inklusive viken mellan Afrika och Arabien, och den latinska, engelska och ryska bibeln följde dem. I Bibeln täcker namnet mer än en vattensträcka: Salomos skepp byggdes i Esjon-Geber ”på stranden av Röda havet, i Edoms land”, det vill säga vid Akababukten, och Israel, som gick runt Edom, ”togo vägen åt Röda havet till”."
    - "Uttågets hav är det Israel korsade. Ledda på ”en omväg genom öknen åt Röda havet till” såg folket de egyptiska vagnarna bakom sig; Mose räckte ut sin hand, ”drev HERREN undan havet genom en stark östanvind som blåste hela natten”, och Israel gick ”mitt igenom havet på torr mark”, medan Faraos här drunknade. Havssången sjunger att hans utvalda kämpar ”dränktes i Röda havet”. Därifrån förde Mose folket in i öknen Shur; stationsförteckningen låter dem slå läger igen: ”lägrade sig vid Röda havet” efter Elim."
    - "Var övergången ägde rum är omstritt. Kandidaterna sträcker sig från norra änden av Suezbukten genom Bittersjöarna, Timsahsjön och Ballah-sjöarna, sjökedjan längs dagens Suezkanal, till Nilens pelusiska gren och lagunerna vid Medelhavskusten; några placerar den vid Akababukten. Egyptiska texter från Nya riket känner ett papyrusträsk nära staden Rameses, och många forskare söker yam suph bland sjöarna öster om deltat, i tron att namnet senare utvidgades till det egentliga Röda havet. Josefus jämförde redan övergången med Alexanders färd längs Pamfyliens strand."
    - "Övergången blev Israels stora minne av befrielse. Rachav hade hört hur ”HERREN lät vattnet i Röda havet torka ut framför eder”; Psaltaren prisar honom ”som delade Röda havet itu” och ”kringströdde Farao och hans här i Röda havet”; Stefanos nämner undren ”i Röda havet”, och Hebreerbrevet säger att i tro ”drogo de fram genom Röda havet likasom på torra landet”. Röda havet i dag, omkring 2 250 km långt, förenas med Medelhavet av Suezkanalen, öppnad 1869 genom just dessa sjöar, och dess korallrev lockar dykare till Sinai, Eilat och Aqaba."
  nb:
    - "Rødehavet i den engelske bibelen er det hebraiske yam suph, «sivhavet»: suph er ordet for «sivet» som den lille Moses ble skjult i, og det synes å være lånt fra det egyptiske navnet på papyrusmyren. De greske oversetterne gjengav det som Rødehavet, det greske navnet på havene sør for Egypt og Arabia, bukten mellom Afrika og Arabia medregnet, og den latinske, engelske og russiske bibelen fulgte dem. I Bibelen dekker navnet mer enn én vannstrekning: Salomos skip ble bygd i Esjon-Geber «på bredden av det Røde Hav i Edoms land», det vil si ved Aqababukta, og Israel dro rundt Edom «på veien til det Røde Hav»."
    - "Utferdens hav er det Israel krysset. Ført «omveien gjennem ørkenen mot det Røde Hav», så folket de egyptiske vognene bak seg; Moses rakte ut hånden, «Herren drev havet bort med en sterk østenvind, som blåste hele natten», og Israel gikk «midt igjennem havet på det tørre», mens Faraos hær druknet. Havsangen synger at hans utvalgte vognkjempere «druknet i det Røde Hav». Derfra ledet Moses folket inn i Sjurs ørken; stasjonslisten lar dem slå leir «ved det Røde Hav» igjen etter Elim."
    - "Hvor overgangen skjedde, er omstridt. Kandidatene går fra den nordlige enden av Suezbukta gjennom Bittersjøene, Timsah-sjøen og Ballah-sjøene, sjøkjeden langs dagens Suezkanal, til den pelusiske armen av Nilen og lagunene ved Middelhavskysten; noen få plasserer den ved Aqababukta. Egyptiske tekster fra Det nye riket kjenner en papyrusmyr nær byen Ramses, og mange forskere søker yam suph blant sjøene øst for Deltaet, og mener at navnet senere ble utvidet til det egentlige Rødehavet. Josefus sammenlignet allerede overgangen med Aleksanders passasje langs den pamfyliske kysten."
    - "Overgangen ble Israels store minne om frelse. Rahab hadde hørt hvordan «Herren tørket ut vannet i det Røde Hav»; Salmene priser ham «som skar det Røde Hav i stykker» og «kastet Farao og hans hær i det Røde Hav»; Stefanus nevner undergjerningene «i det Røde Hav», og Hebreerbrevet sier at ved tro «gikk de gjennem det Røde Hav som over tørt land». Rødehavet i dag, omtrent 2250 km langt, er forbundet med Middelhavet av Suezkanalen, åpnet i 1869 gjennom de samme sjøene, og korallrevene trekker dykkere til Sinai, Eilat og Aqaba."
  tl:
    - "Ang Dagat na Pula ng Bibliyang Ingles ay ang Hebreong yam suph, “dagat ng mga tambo”: ang suph ang salita para sa “katalahiban” kung saan itinago ang sanggol na si Moises, at tila hiram ito sa pangalang Egipcio ng latian ng papiro. Isinalin ito ng mga tagasalin na Griyego bilang Dagat na Pula, ang pangalang Griyego para sa mga dagat sa timog ng Egipto at Arabia, kasama ang golpo sa pagitan ng Africa at Arabia, at sinundan sila ng mga Bibliyang Latin, Ingles at Ruso. Sa Bibliya, ang pangalan ay sumasaklaw sa higit sa isang bahagi ng tubig: itinayo ang mga barko ni Salomon sa Esion-geber “sa baybayin ng Dagat na Mapula, sa lupain ng Edom”, ibig sabihin sa Golpo ng Aqaba, at umikot ang Israel sa Edom sa “daang patungo sa Dagat na Mapula”."
    - "Ang dagat ng exodo ang tinawid ng Israel. Pinangunahan “sa daang patungo sa ilang sa tabi ng Dagat na Mapula”, nakita ng bayan ang mga karong Egipcio sa likuran nila; iniunat ni Moises ang kaniyang kamay, “pinaghiwalay ng Panginoon ang dagat sa pamamagitan ng isang malakas na hanging silanganan ng buong magdamag”, at ang Israel ay “pumasok sa gitna ng dagat sa ibabaw ng tuyong lupa”, habang nalunod ang hukbo ni Faraon. Inaawit ng Awit ng Dagat na ang kaniyang mga piling kapitan ay “ipinaglulubog sa Dagat na Mapula”. Mula roon ay pinangunahan ni Moises ang bayan sa ilang ng Shur; sa listahan ng mga himpilan, muli silang nagkampo pagkatapos ng Elim, “humantong sa tabi ng Dagat na Mapula”."
    - "Pinagtatalunan kung saan naganap ang pagtawid. Ang mga kandidato ay mula sa hilagang dulo ng Golpo ng Suez sa pamamagitan ng Mapait na mga Lawa, Lawa ng Timsah at mga Lawa ng Ballah, ang hanay ng mga lawa sa tabi ng Suez Canal ngayon, hanggang sa sangang Pelusiaco ng Nilo at mga lagoon sa baybayin ng Mediteraneo; iilan ang naglalagay nito sa Golpo ng Aqaba. Kilala ng mga tekstong Egipcio ng Bagong Kaharian ang isang latian ng papiro malapit sa lungsod ng Rameses, at maraming iskolar ang naghahanap sa yam suph sa mga lawa sa silangan ng Delta, na naniniwalang kalaunan lamang pinalawak ang pangalan sa mismong Dagat na Pula. Inihambing na ni Josephus ang pagtawid sa pagdaan ni Alejandro sa baybayin ng Pamfilia."
    - "Naging dakilang alaala ng pagliligtas ng Israel ang pagtawid. Narinig ni Rahab kung paano “tinuyo ng Panginoon ang tubig sa Dagat na Mapula”; pinupuri siya ng mga Awit na “humawi ng Dagat na Mapula” at “tinabunan si Faraon at ang kaniyang hukbo sa Dagat na Mapula”; pinangalanan ni Esteban ang mga kababalaghan “sa dagat na Pula”, at sinasabi ng Mga Hebreo na sa pananampalataya “nagsipagdaan sila sa gitna ng Dagat na Mapula na gaya ng sa lupang tuyo”. Ang Dagat na Pula ngayon, mga 2,250 km ang haba, ay nakakabit sa Mediteraneo ng Suez Canal, na binuksan noong 1869 sa mga lawang iyon din, at ang mga bahura ng korales nito ay umaakit ng mga maninisid sa Sinai, Eilat at Aqaba."
  da:
    - "Den engelske bibels Red Sea er det hebraiske yam suph, »sivhavet«: suph er ordet for sivet, hvori den lille Moses blev skjult, og det synes lånt fra det egyptiske navn for papyrusmosen. De græske oversættere gengav det som Det Røde Hav, det græske navn for havene syd for Egypten og Arabien, bugten mellem Afrika og Arabien medregnet, og den latinske, engelske og russiske bibel fulgte dem. I Bibelen dækker navnet mere end én strækning vand: Salomos skibe blev bygget i Esjon-Geber »ved det røde Havs Bred, i Edoms Land«, det vil sige ved Aqababugten, og Israel drog uden om Edom »paa Vejen til det røde Hav«."
    - "Udtogshavet er det, Israel krydsede. Ført »ad Vejen igennem Ørkenen mod det røde Hav« så folket de egyptiske vogne bag sig; Moses udstrakte sin hånd, »Herren lod Havet fare bort ved et stærkt Østenvejr den ganske Nat«, og Israel gik »midt igennem Havet paa det tørre«, mens Faraos hær druknede. Havets sang synger, at hans »udvalgte Høvedsmænd bleve druknede i det røde Hav«. Derfra førte Moses folket ind i Sjurs ørken; stationslisten lader dem lejre »ved det røde Hav« igen efter Elim."
    - "Hvor overgangen skete, er omstridt. Kandidaterne løber fra den nordlige ende af Suezbugten gennem De Bitre Søer, Timsah-søen og Ballah-søerne, rækken af søer langs den nuværende Suezkanal, til den pelusiske flodarm af Nilen og lagunerne ved Middelhavskysten; nogle få placerer den ved Aqababugten. Egyptiske tekster fra Det Nye Rige kender en papyrusmose nær byen Ramses, og mange forskere søger yam suph blandt søerne øst for Deltaet og mener, at navnet senere blev udvidet til selve Det Røde Hav. Josefus sammenlignede allerede overgangen med Alexanders færd langs den pamfyliske kyst."
    - "Overgangen blev Israels store erindring om befrielse. Rahab havde hørt, hvordan »Herren udtørrede Vandet i det røde Hav«; Salmerne priser ham, »som kløvede det røde Hav igennem«, og som »udstødte Farao og hans Hær« i det røde Hav; Stefanus nævner undrene »i det røde Hav«, og Hebræerbrevet siger, at ved tro »gik de igennem det røde Hav som over tørt Land«. Det Røde Hav i dag, omkring 2250 km langt, er forbundet med Middelhavet ved Suezkanalen, åbnet i 1869 gennem de samme søer, og dets koralrev trækker dykkere til Sinai, Eilat og Aqaba."
