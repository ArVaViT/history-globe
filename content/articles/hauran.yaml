body:
  en:
    - "The Hauran is the broad volcanic plateau of southern Syria, east of the Golan and north of the Yarmuk, with the dark basalt massif of Jebel al-Arab (Jebel Druze) on its eastern side. Its rich red-brown soil made it a granary in antiquity, the heart of the land the Bible calls Bashan. The Bible names the Hauran only in Ezekiel's vision of the borders of the restored land: the northern border runs to “Hazar-hatticon, which is by the coast of Hauran”, and “the east side ye shall measure from Hauran, and from Damascus, and from Gilead, and from the land of Israel by Jordan”, so that the Hauran lies just outside the eastern line."
    - "The name is old. Shalmaneser III of Assyria, after defeating Hazael of Damascus in 841 BC, says he marched to the mountains of Hauran, and after Tiglath-pileser III took Damascus in 732 BC the region seems to have formed an Assyrian province named after it. The Greeks called it Auranitis; Augustus gave it to Herod the Great, and after Herod it went with Trachonitis to his son Philip the tetrarch; it later came under direct Roman rule. Basalt towns such as Bosra and Canatha flourished there in Roman and Byzantine times."
    - "Today the Hauran lies mostly in the Daraa and Suwayda governorates of Syria and reaches into northern Jordan; its basalt villages still preserve Roman and Byzantine houses, churches and theatres, the best known at Bosra."
  ru:
    - "Авран, Хауран, — широкое вулканическое плато на юге Сирии, к востоку от Голана и к северу от Ярмука, с тёмным базальтовым массивом Джебель-эль-Араб (Джебель-Друз) на востоке. Его плодородная красно-бурая почва сделала его в древности житницей; это сердце земли, которую Библия зовёт Васаном. Библия называет Авран только в видении Иезекииля о границах восстановленной земли: северная граница доходит до «Гацар-Тихон, который на границе Аврана», а о восточном крае сказано: «Черту восточного края ведите между Авраном и Дамаском, между Галаадом и землею Израильскою», так что Авран остаётся сразу за восточной чертой."
    - "Имя древнее. Ассирийский царь Салманасар III, разбив Азаила Дамасского в 841 г. до н. э., говорит, что ходил к горам Хаурана, а после того как Феглаффелласар III в 732 г. до н. э. взял Дамаск, область, по-видимому, стала ассирийской провинцией, названной по ней. Греки звали её Авранитидой; Август отдал её Ироду Великому, а после Ирода она вместе с Трахонитидой перешла к его сыну Филиппу четвертовластнику, а позднее оказалась под прямой властью Рима. В римское и византийское время там процветали базальтовые города, такие как Бостра и Канафа."
    - "Сегодня Хауран лежит большей частью в мухафазах Дараа и Сувейда в Сирии и заходит в северную Иорданию; его базальтовые селения до сих пор хранят римские и византийские дома, церкви и театры, самые известные — в Бостре."
  uk:
    - "Хавран — широке вулканічне плато південної Сирії, на схід від Голану й на північ від Ярмуку, з темним базальтовим масивом Джебель-ель-Араб (Джебель-Друз) на його східному боці. Його багатий червонувато-бурий ґрунт робив його у давнину житницею, серцем краю, який Біблія називає Башаном. Біблія називає Хавран лише у видінні Єзекіїля про межі відновленого краю: північна межа йде до «Газар-Тихон, що на гряницї Аврана», а східну «ведїть гряницю проміж Авраном і Дамаском, між Галаадом і землею Ізраїлською попри Йордань», так що Хавран лежить якраз за східною лінією."
    - "Назва давня. Салманассар III Ассирійський, розбивши Азаїла Дамаського 841 р. до н. е., каже, що рушив до гір Хавран, а після того як Тіглатпаласар III узяв Дамаск 732 р. до н. е., область, схоже, склала ассирійську провінцію, названу за нею. Греки називали її Авранітидою; Август віддав її Іродові Великому, а після Ірода вона з Трахонітською областю дісталася його синові, тетрархові Пилипу; пізніше вона перейшла під пряме римське правління. Базальтові міста, як-от Босра й Канафа, процвітали там за римських і візантійських часів."
    - "Сьогодні Хавран лежить переважно в губернаторствах Дераа й Ес-Сувейда в Сирії і сягає північної Йорданії; його базальтові села досі зберігають римські й візантійські будинки, церкви й театри, найвідоміші в Босрі."
  es:
    - "El Haurán es la amplia meseta volcánica del sur de Siria, al este del Golán y al norte del Yarmuk, con el oscuro macizo de basalto del Jebel al-Arab (Jebel Druze) en su lado oriental. Su rico suelo pardo rojizo lo convirtió en granero en la Antigüedad, el corazón de la tierra que la Biblia llama Basán. La Biblia nombra el Haurán solo en la visión de Ezequiel sobre los límites de la tierra restaurada: la frontera norte llega a «Haser-hatticon, que es el término de Hauran», y «Al lado del oriente, por medio de Hauran y de Damasco, y de Galaad, y de la tierra de Israel, al Jordán», de modo que el Haurán queda justo fuera de la línea oriental."
    - "El nombre es antiguo. Salmanasar III de Asiria, tras derrotar a Hazael de Damasco en el 841 a. C., dice que marchó a las montañas del Haurán, y después de que Tiglat-pileser III tomara Damasco en el 732 a. C. la región parece haber formado una provincia asiria que llevaba su nombre. Los griegos la llamaron Auranítide; Augusto la dio a Herodes el Grande, y tras Herodes pasó con Traconite a su hijo Felipe el tetrarca; más tarde quedó bajo dominio romano directo. Ciudades de basalto como Bosra y Canatá florecieron allí en tiempos romanos y bizantinos."
    - "Hoy el Haurán se halla sobre todo en las gobernaciones de Daraa y Suwayda, en Siria, y llega hasta el norte de Jordania; sus aldeas de basalto conservan aún casas, iglesias y teatros romanos y bizantinos, el más conocido de ellos en Bosra."
  pt:
    - "O Haurã é o amplo planalto vulcânico do sul da Síria, a leste do Golã e ao norte do Yarmuk, com o escuro maciço basáltico de Jebel al-Arab (Jebel Druso) no seu lado oriental. Seu rico solo vermelho-acastanhado fez dele um celeiro na Antiguidade, o coração da terra que a Bíblia chama Basã. A Bíblia nomeia o Haurã apenas na visão de Ezequiel sobre as fronteiras da terra restaurada: a fronteira norte vai até “Hazer-Haticom, que fica junto à fronteira de Haurã”, e “O lado leste, entre Haurã, Damasco, Gileade e a terra de Israel, será o Jordão”, de modo que o Haurã fica um pouco fora da linha oriental."
    - "O nome é antigo. Salmaneser III da Assíria, depois de derrotar Hazael de Damasco em 841 a.C., diz que marchou até os montes do Haurã, e depois que Tiglate-Pileser III tomou Damasco em 732 a.C. a região parece ter formado uma província assíria com o seu nome. Os gregos a chamavam Auranítide; Augusto a deu a Herodes, o Grande, e depois de Herodes ela passou, com a Traconites, a seu filho Filipe, o tetrarca; mais tarde ficou sob domínio romano direto. Cidades de basalto como Bosra e Canata floresceram ali em tempos romanos e bizantinos."
    - "Hoje o Haurã fica sobretudo nas províncias de Daraa e Suwayda, na Síria, e alcança o norte da Jordânia; suas aldeias de basalto ainda conservam casas, igrejas e teatros romanos e bizantinos, o mais conhecido em Bosra."
  de:
    - "Der Hauran ist die weite vulkanische Hochebene Südsyriens, östlich des Golan und nördlich des Jarmuk, mit dem dunklen Basaltmassiv des Dschebel al-Arab (Drusenberg) auf der Ostseite. Sein reicher rotbrauner Boden machte ihn in der Antike zur Kornkammer, zum Kern des Landes, das die Bibel Baschan nennt. Die Bibel nennt den Hauran nur in Hesekiels Vision der Grenzen des wiederhergestellten Landes: Die Nordgrenze verläuft bis „Hazar-Thichon, das an Hauran grenzt“, und „die Grenze gegen Morgen sollt ihr messen zwischen Hauran und Damaskus und zwischen Gilead und dem Lande Israel, am Jordan hinab“, sodass der Hauran knapp außerhalb der Ostlinie liegt."
    - "Der Name ist alt. Salmanassar III. von Assyrien sagt, nachdem er 841 v. Chr. Hasaël von Damaskus besiegt hatte, er sei in die Berge des Hauran gezogen, und nachdem Tiglat-Pileser III. 732 v. Chr. Damaskus genommen hatte, scheint die Gegend eine nach ihr benannte assyrische Provinz gebildet zu haben. Die Griechen nannten sie Auranitis; Augustus gab sie Herodes dem Großen, und nach Herodes ging sie mit Trachonitis an seinen Sohn, den Tetrarchen Philippus; später kam sie unter unmittelbare römische Herrschaft. Basaltstädte wie Bosra und Kanatha blühten dort in römischer und byzantinischer Zeit."
    - "Heute liegt der Hauran größtenteils in den syrischen Gouvernements Daraa und Suwaida und reicht bis ins nördliche Jordanien; seine Basaltdörfer bewahren noch römische und byzantinische Häuser, Kirchen und Theater, die bekanntesten in Bosra."
  fr:
    - "Le Havran est le vaste plateau volcanique du sud de la Syrie, à l’est du Golan et au nord du Yarmouk, avec le sombre massif basaltique du Jebel al-Arab (Jebel Druze) sur son côté oriental. Sa riche terre brun-rouge en fit un grenier dans l’Antiquité, au cœur du pays que la Bible appelle Basan. La Bible ne nomme le Havran que dans la vision d’Ézéchiel sur les frontières du pays restauré : la limite nord va à « Hatzer-Hatthicon, vers la frontière de Havran », et « le côté oriental sera le Jourdain, entre Havran, Damas et Galaad, et le pays d’Israël », de sorte que le Havran se trouve juste en dehors de la ligne orientale."
    - "Le nom est ancien. Salmanasar III d’Assyrie, après avoir battu Hazaël de Damas en 841 av. J.-C., dit avoir marché vers les montagnes du Havran, et après la prise de Damas par Tiglath-Piléser III en 732 av. J.-C., la région semble avoir formé une province assyrienne qui en portait le nom. Les Grecs l’appelaient Auranitide ; Auguste la donna à Hérode le Grand, et après Hérode elle passa avec la Trachonite à son fils Philippe le tétrarque ; elle passa plus tard sous administration romaine directe. Des villes de basalte telles que Bosra et Canatha y prospérèrent aux époques romaine et byzantine."
    - "Aujourd’hui, le Havran se trouve surtout dans les gouvernorats de Deraa et de Soueïda, en Syrie, et s’étend jusqu’au nord de la Jordanie ; ses villages de basalte conservent encore des maisons, des églises et des théâtres romains et byzantins, le plus connu à Bosra."
  pl:
    - "Hauran to szeroki wulkaniczny płaskowyż południowej Syrii, na wschód od Golanu i na północ od Jarmuku, z ciemnym bazaltowym masywem Dżebel al-Arab (Dżebel Druz) po wschodniej stronie. Jego bogata czerwonobrunatna gleba uczyniła go w starożytności spichlerzem, sercem krainy, którą Biblia nazywa Baszan. Biblia wymienia Hauran tylko w widzeniu Ezechiela o granicach odnowionej ziemi: granica północna biegnie do Chasar-Tikon, czyli „wsi pośrednie, które są przy granicy Hawran”, a „strona wschodnia między Hawran i między Damaszkiem i między Galaad i między ziemią Izraelską przy Jordanie”, tak że Hauran leży tuż poza linią wschodnią."
    - "Nazwa jest stara. Salmanasar III z Asyrii, po pokonaniu Chazaela z Damaszku w 841 r. p.n.e., mówi, że poszedł w góry Hauranu, a po zajęciu Damaszku przez Tiglat-Pilesera III w 732 r. p.n.e. region zdaje się tworzyć asyryjską prowincję nazwaną od niego. Grecy nazywali go Auranitis; August dał go Herodowi Wielkiemu, a po Herodzie przypadł wraz z Trachonitidą jego synowi Filipowi tetrarsze; później przeszedł pod bezpośrednie rządy rzymskie. Bazaltowe miasta, jak Bosra i Kanata, kwitły tam w czasach rzymskich i bizantyńskich."
    - "Dziś Hauran leży głównie w muhafazach Dara i Suwajda w Syrii i sięga do północnej Jordanii; jego bazaltowe wsie nadal zachowują rzymskie i bizantyńskie domy, kościoły i teatry, najlepiej znane w Bosrze."
  it:
    - "L’Auran è il vasto altopiano vulcanico della Siria meridionale, a est del Golan e a nord dello Yarmuk, con il massiccio basaltico scuro del Jebel al-Arab (Gebel Druso) sul lato orientale. Il suo ricco suolo rosso-bruno ne fece nell’antichità un granaio, il cuore del paese che la Bibbia chiama Basan. La Bibbia nomina l’Auran solo nella visione di Ezechiele sui confini del paese restaurato: il confine settentrionale giunge a «Hatser-hattikon, che è sulla frontiera dell’Hauran», e «Dalla parte d’oriente: partendo di fra l’Hauran e Damasco, poi di fra Galaad e il paese d’Israele, verso il Giordano, misurerete», cosicché l’Auran si trova appena fuori della linea orientale."
    - "Il nome è antico. Salmanàssar III d’Assiria, dopo aver sconfitto Cazaèl di Damasco nell’841 a.C., dice di aver marciato sui monti dell’Auran, e dopo che Tiglat-Pilèser III prese Damasco nel 732 a.C. la regione sembra aver formato una provincia assira che ne portava il nome. I Greci la chiamavano Auranitide; Augusto la diede a Erode il Grande, e dopo Erode passò con la Traconitide a suo figlio Filippo il tetrarca; in seguito venne sotto il diretto dominio romano. Città basaltiche come Bosra e Canata vi fiorirono in età romana e bizantina."
    - "Oggi l’Auran si trova per lo più nei governatorati siriani di Daraa e Suwayda e si estende nella Giordania settentrionale; i suoi villaggi basaltici conservano ancora case, chiese e teatri romani e bizantini, il più noto a Bosra."
  nl:
    - "De Hauran is het brede vulkanische plateau van zuidelijk Syrië, ten oosten van de Golan en ten noorden van de Yarmuk, met aan de oostkant het donkere basaltmassief van de Jebel al-Arab (Jebel Druze). De rijke roodbruine grond maakte hem in de oudheid tot een graanschuur, het hart van het land dat de Bijbel Basan noemt. De Bijbel noemt de Hauran alleen in Ezechiëls visioen van de grenzen van het herstelde land: de noordgrens loopt tot “Hazar Hattichon, dat aan de landpale van Havran is”, en “Den oosterhoek nu zult gijlieden meten van tussen Havran, en van tussen Damaskus, en van tussen Gilead, en van tussen het land Israels aan den Jordaan”, zodat de Hauran net buiten de oostelijke lijn ligt."
    - "De naam is oud. Salmaneser III van Assyrië zegt, na de overwinning op Hazaël van Damascus in 841 v.Chr., dat hij optrok naar de bergen van de Hauran, en nadat Tiglat-Pileser III in 732 v.Chr. Damascus innam, lijkt de streek een naar haar genoemde Assyrische provincie te hebben gevormd. De Grieken noemden haar Auranitis; Augustus gaf haar aan Herodes de Grote, en na Herodes ging zij met Trachonitis naar zijn zoon Filippus de tetrarch; later kwam zij onder direct Romeins bestuur. Basaltsteden als Bosra en Kanata bloeiden er in Romeinse en Byzantijnse tijd."
    - "Nu ligt de Hauran grotendeels in de Syrische gouvernementen Daraa en Suwayda en reikt tot in Noord-Jordanië; zijn basaltdorpen bewaren nog Romeinse en Byzantijnse huizen, kerken en theaters, het best bekend te Bosra."
  cs:
    - "Havran je rozlehlá sopečná náhorní plošina jižní Sýrie, východně od Golánu a severně od Jarmuku, s tmavým čedičovým masivem Džebel al-Arab (Džebel Drúz) na východní straně. Jeho bohatá červenohnědá půda z něj ve starověku činila obilnici, srdce země, kterou Bible nazývá Bášan. Bible jmenuje Havran jen v Ezechielově vidění hranic obnovené země: severní hranice vede k „vsi prostřední, kteréž jsou při pomezí Chavrón“ a „Strana pak východní mezi Chavrón a mezi Damaškem, a mezi Galád, a mezi zemí Izraelskou při Jordánu“, takže Havran leží těsně vně východní čáry."
    - "Jméno je staré. Salmanasar III. Asyrský, po porážce Chazaela z Damašku roku 841 př. n. l., praví, že táhl k pohořím Havranu, a po dobytí Damašku Tiglatpilesarem III. roku 732 př. n. l. se zdá, že oblast tvořila asyrskou provincii pojmenovanou po něm. Řekové ji nazývali Auranitida; Augustus ji dal Herodovi Velikému a po Herodovi připadla s Trachonitidou jeho synu, tetrarchovi Filipovi; později přešla pod přímou římskou vládu. Čedičová města jako Bosra a Kanatha tam vzkvétala v římské a byzantské době."
    - "Dnes Havran leží většinou v syrských guberniích Daraa a Suvajdá a zasahuje do severního Jordánska; jeho čedičové vesnice dosud uchovávají římské a byzantské domy, kostely a divadla, nejznámější v Bosře."
scripture:
  - Ezek.47.16-Ezek.47.18
