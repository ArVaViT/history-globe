# Overview article (ADR 0007). Mainstream facts only; whether the three verses mean the mountain or merely "north" is given as a question of reading, not settled.
id: zaphon
place: a78e845
title:
  en: "Mount Zaphon"
  ru: "Гора Цафон"
  uk: "Гора Цафон"
  es: "Monte Zafón"
  pt: "Monte Zafom"
  de: "Berg Zafon"
  fr: "Mont Tsaphon"
body:
  en:
    - "Mount Zaphon is Jebel al-Aqra, a bald limestone peak some 1,700 m high that rises straight out of the sea just north of the mouth of the Orontes, on the border of Turkey and Syria. In the tablets of Ugarit, some 40 km to the south, of the fourteenth and thirteenth centuries BC, it is Sapunu, the mountain of Baal, on which the craftsman god built him a palace of silver and gold and from which he thundered; the Hittites called it Hazzi and set it among the gods who witnessed their treaties. To the Greeks and Romans it was Mount Casius, seat of Zeus Kasios, and Hadrian climbed it by night to see the sunrise and as he sacrificed, lightning struck the victim and the attendant. Because it stood to the north of Canaan, its name became the ordinary Hebrew word for “north”, tsafon."
    - "That is why the Hebrew Bible can be read in two ways where it uses the word with the old mountain in mind. Psalm 48 praises Zion as “the joy of the whole earth”, “on the sides of the north, the city of the great King”, naming Zion's height with the word that at Ugarit named Baal's seat: many take it to say that Zion, not Zaphon, is the true mountain of God. The king of Babylon in Isaiah boasts, “I will sit also upon the mount of the congregation, in the sides of the north”, that is, on the mountain where the gods assemble. Job says of God, “He stretcheth out the north over the empty place, and hangeth the earth upon nothing”, where “the north” may be the mountain, or the northern sky. The Russian Synodal text, like most translations, gives simply “north” in all three and has no name Zaphon at all."
    - "The mountain, Kel Dağı in Turkish, stands today in the province of Hatay, its summit a military zone; the ruins of Ugarit, Ras Shamra, lie across the Syrian border some 40 km south, and the sunrise from the top is still a famous sight."
  ru:
    - "Гора Цафон — это Джебель-эль-Акра, голая известняковая вершина высотой около 1700 м, встающая прямо из моря чуть севернее устья Оронта, на границе Турции и Сирии. В табличках Угарита, лежащего километрах в 40 южнее, XIV–XIII веков до н. э. она зовётся Цапуну — гора Ваала, на которой бог-ремесленник построил ему дворец из серебра и золота и с которой он гремел громом; хетты звали её Хацци и ставили среди богов, свидетельствовавших их договоры. Для греков и римлян это была гора Касий, престол Зевса Касия, и Адриан поднялся на неё ночью, чтобы увидеть восход, и во время жертвоприношения молния поразила жертву и прислужника. Оттого что она стояла к северу от Ханаана, её имя стало обычным еврейским словом «север» — цафон."
    - "Поэтому еврейскую Библию можно читать двояко там, где она употребляет это слово, помня о древней горе. 47-й псалом славит Сион как «радость всей земли», «на северной стороне ее город великого Царя» — тем самым словом, которым в Угарите назывался престол Ваала: многие понимают это так, что истинная гора Божия — Сион, а не Цафон. Царь Вавилонский у Исаии хвалится: «сяду на горе в сонме богов, на краю севера», то есть на горе собрания богов. Иов говорит о Боге: «Он распростер север над пустотою, повесил землю ни на чем», где «север» может быть и горой, и северным небом. Синодальный перевод, как и большинство переводов, во всех трёх местах даёт просто «север» и имени Цафон не знает вовсе."
    - "Гора, по-турецки Кель-Дагы, стоит сегодня в провинции Хатай, её вершина — военная зона; развалины Угарита, Рас-Шамра, лежат за сирийской границей километрах в 40 южнее, а восход с вершины по-прежнему знаменитое зрелище."
  uk:
    - "Гора Цафон — це Джебель-ель-Акра, лиса вапнякова вершина заввишки близько 1700 м, що здіймається прямо з моря на північ від гирла Оронта, на кордоні Туреччини й Сирії. У табличках Угарита, приблизно за 40 км на південь, XIV–XIII ст. до н. е., вона — Сапуну, гора Ваала, на якій бог-ремісник збудував йому палац зі срібла й золота і з якої він грозив громами; хетти називали її Хаззі і ставили серед богів, що були свідками їхніх договорів. Для греків і римлян це була гора Касій, оселя Зевса Касія, і Адріан піднявся на неї вночі, щоб побачити схід сонця, і коли він приносив жертву, блискавка вразила жертву й служителя. Оскільки вона стояла на північ від Ханаану, її назва стала звичайним староєврейським словом для «півночі», цафон."
    - "Тому староєврейську Біблію можна читати двояко там, де вона вживає це слово з огляду на стару гору. Псалом 48 прославляє Сіон як «радість землї цїлої», «на самій півночі город царя великого», називаючи висоту Сіону словом, що в Угариті називало оселю Ваала: багато хто бачить у цьому твердження, що Сіон, а не Цафон, — справжня гора Бога. Цар Вавилона в Ісаї хвалиться: «засяду на горі між богами, на краю півночі», тобто на горі, де збираються боги. Йов каже про Бога: «Північний вітер розпускає він в порожню (воздушну), повісив землю нї на чім», де «північ» може бути горою або північним небом. Російський Синодальний текст, як і більшість перекладів, дає у всіх трьох просто «північ» і не має назви Цафон узагалі."
    - "Гора, турецькою Кель-Даги, стоїть нині в провінції Хатай, її вершина — військова зона; руїни Угарита, Рас-Шамра, лежать через сирійський кордон приблизно за 40 км на південь, і схід сонця з вершини й досі славний краєвид."
  es:
    - "El monte Zafón es el Jebel al-Aqra, un pico calizo pelado de unos 1700 m de altura que se alza directamente del mar justo al norte de la desembocadura del Orontes, en la frontera entre Turquía y Siria. En las tablillas de Ugarit, a unos 40 km al sur, de los siglos XIV y XIII a. C., es Sapunu, el monte de Baal, en el cual el dios artesano le construyó un palacio de plata y oro y desde el cual tronaba; los hititas lo llamaban Hazzi y lo situaban entre los dioses que atestiguaban sus tratados. Para griegos y romanos era el monte Casio, sede de Zeus Casio, y Adriano lo escaló de noche para ver el amanecer y, mientras sacrificaba, un rayo hirió a la víctima y al asistente. Por estar al norte de Canaán, su nombre pasó a ser la palabra hebrea corriente para «norte», tsafon."
    - "Por eso la Biblia hebrea puede leerse de dos maneras donde usa la palabra con el antiguo monte en mente. El Salmo 48 alaba a Sion como «el gozo de toda la tierra», «á los lados del aquilón, la ciudad del gran Rey», nombrando la altura de Sion con la palabra que en Ugarit nombraba la sede de Baal: muchos entienden que dice que Sion, y no Zafón, es el verdadero monte de Dios. El rey de Babilonia en Isaías se jacta: «en el monte del testimonio me sentaré, á los lados del aquilón», es decir, en el monte donde se reúnen los dioses. Job dice de Dios: «Extiende el aquilón sobre vacío, cuelga la tierra sobre nada», donde «el aquilón» puede ser el monte o el cielo del norte. El texto sinodal ruso, como la mayoría de las traducciones, da simplemente «norte» en los tres y no tiene ningún nombre Zafón."
    - "El monte, Kel Dağı en turco, se alza hoy en la provincia de Hatay, con su cima como zona militar; las ruinas de Ugarit, Ras Shamra, se encuentran al otro lado de la frontera siria, a unos 40 km al sur, y el amanecer desde la cima sigue siendo un espectáculo famoso."
  pt:
    - "O Monte Zafom é o Jebel al-Aqra, um pico calcário pelado de uns 1.700 m que se ergue direto do mar logo ao norte da foz do Orontes, na fronteira entre a Turquia e a Síria. Nas tabuinhas de Ugarit, uns 40 km ao sul, dos séculos XIV e XIII a.C., é Sapunu, o monte de Baal, onde o deus artífice lhe construiu um palácio de prata e ouro e de onde ele trovejava; os hititas o chamavam Hazzi e o punham entre os deuses que testemunhavam seus tratados. Para gregos e romanos era o Monte Cásio, sede de Zeus Cásio, e Adriano o subiu de noite para ver o nascer do sol e, quando sacrificava, um raio atingiu a vítima e o assistente. Por ficar ao norte de Canaã, seu nome tornou-se a palavra hebraica comum para “norte”, tsafon."
    - "É por isso que a Bíblia hebraica pode ser lida de dois modos onde usa a palavra com o antigo monte em mente. O Salmo 48 louva Sião como “a alegria de toda a terra”, “nos lados do norte, a cidade do grande Rei”, nomeando a altura de Sião com a palavra que em Ugarit nomeava a sede de Baal: muitos entendem que diz que Sião, e não Zafom, é o verdadeiro monte de Deus. O rei da Babilônia em Isaías se vangloria: “Eu me assentarei no monte da congregação, no extremo norte!”, isto é, no monte onde os deuses se reúnem. Jó diz de Deus: “Ele estende o norte sobre o espaço vazio, e suspende a terra sobre o nada”, onde “o norte” pode ser o monte ou o céu setentrional. O texto sinodal russo, como a maioria das traduções, dá simplesmente “norte” nos três e não tem o nome Zafom."
    - "O monte, Kel Dağı em turco, ergue-se hoje na província de Hatay, com o cume zona militar; as ruínas de Ugarit, Ras Shamra, ficam do outro lado da fronteira síria, uns 40 km ao sul, e o nascer do sol do alto continua uma vista famosa."
  de:
    - "Der Berg Zafon ist der Dschebel al-Aqra, ein kahler Kalksteingipfel von etwa 1700 m Höhe, der unmittelbar nördlich der Mündung des Orontes direkt aus dem Meer aufsteigt, an der Grenze zwischen der Türkei und Syrien. In den Tafeln von Ugarit, etwa 40 km südlich, aus dem vierzehnten und dreizehnten Jahrhundert v. Chr., ist er Sapunu, der Berg Baals, auf dem der Handwerkergott ihm einen Palast aus Silber und Gold baute und von dem er donnerte; die Hethiter nannten ihn Hazzi und stellten ihn unter die Götter, die ihre Verträge bezeugten. Den Griechen und Römern war er der Mons Casius, Sitz des Zeus Kasios, und Hadrian bestieg ihn nachts, um den Sonnenaufgang zu sehen, und als er opferte, schlug der Blitz in das Opfertier und den Diener. Weil er nördlich von Kanaan stand, wurde sein Name zum gewöhnlichen hebräischen Wort für „Norden“, tsafon."
    - "Deshalb lässt sich die hebräische Bibel dort, wo das Wort den alten Berg im Sinn hat, auf zwei Weisen lesen. Psalm 48 preist den Zion: „Schön ragt empor der Berg Zion, des sich das ganze Land tröstet; an der Seite gegen Mitternacht liegt die Stadt des großen Königs“, und nennt die Höhe des Zion mit dem Wort, das in Ugarit den Sitz Baals bezeichnete: Viele verstehen es so, dass Zion, nicht Zafon, der wahre Gottesberg ist. Der König von Babel bei Jesaja prahlt: „ich will mich setzen auf den Berg der Versammlung in der fernsten Mitternacht“, also den Berg der Götterversammlung. Hiob sagt von Gott: „Er breitet aus die Mitternacht über das Leere und hängt die Erde an nichts“, wo „die Mitternacht“ der Berg oder der nördliche Himmel sein kann. Der russische Synodaltext gibt wie die meisten Übersetzungen überall schlicht „Norden“ und kennt den Namen Zafon nicht."
    - "Der Berg, türkisch Kel Dağı, steht heute in der Provinz Hatay, sein Gipfel ist Militärgebiet; die Ruinen von Ugarit, Ras Schamra, liegen jenseits der syrischen Grenze etwa 40 km südlich, und der Sonnenaufgang vom Gipfel ist noch immer ein berühmter Anblick."
  fr:
    - "Le mont Tsaphon est le Jebel al-Aqra, pic calcaire chauve de quelque 1 700 m qui s’élève tout droit de la mer juste au nord de l’embouchure de l’Oronte, à la frontière de la Turquie et de la Syrie. Dans les tablettes d’Ougarit, à quelque 40 km au sud, des XIVe et XIIIe siècles av. J.-C., c’est Sapounou, la montagne de Baal, sur laquelle le dieu artisan lui bâtit un palais d’argent et d’or et d’où il tonnait ; les Hittites l’appelaient Hazzi et le rangeaient parmi les dieux témoins de leurs traités. Pour les Grecs et les Romains, c’était le mont Casius, siège de Zeus Kasios, et Hadrien l’escalada de nuit pour voir le lever du soleil et, comme il sacrifiait, la foudre frappa la victime et le servant. Parce qu’il se dressait au nord de Canaan, son nom devint le mot hébreu ordinaire pour « nord », tsafon."
    - "C’est pourquoi la Bible hébraïque peut se lire de deux façons là où elle emploie le mot en pensant à l’ancienne montagne. Le psaume 48 loue Sion comme « joie de toute la terre, la montagne de Sion ; le côté septentrional, c’est la ville du grand roi », nommant la hauteur de Sion du mot qui à Ougarit nommait le siège de Baal : beaucoup y voient l’affirmation que Sion, et non Tsaphon, est la vraie montagne de Dieu. Le roi de Babylone chez Ésaïe se vante : « Je m’assiérai sur la montagne de l’assemblée, à l’extrémité du septentrion », c’est-à-dire sur la montagne où s’assemblent les dieux. Job dit de Dieu : « Il étend le septentrion sur le vide, il suspend la terre sur le néant », où « le septentrion » peut être la montagne ou le ciel du nord. Le texte synodal russe, comme la plupart des traductions, donne simplement « nord » dans les trois cas et n’a aucun nom Tsaphon."
    - "La montagne, Kel Dağı en turc, se dresse aujourd’hui dans la province de Hatay, son sommet étant une zone militaire ; les ruines d’Ougarit, Ras Shamra, se trouvent de l’autre côté de la frontière syrienne à quelque 40 km au sud, et le lever du soleil depuis le sommet reste un spectacle célèbre."
