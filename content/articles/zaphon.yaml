body:
  en:
    - "Mount Zaphon is Jebel al-Aqra, a bald limestone peak some 1,700 m high that rises straight out of the sea just south of the mouth of the Orontes, on the border of Turkey and Syria. In the tablets of Ugarit, some 40 km to the south, of the fourteenth and thirteenth centuries BC, it is Sapunu, the mountain of Baal, on which the craftsman god built him a palace of silver and gold and from which he thundered; the Hittites called it Hazzi and set it among the gods who witnessed their treaties. To the Greeks and Romans it was Mount Casius, seat of Zeus Kasios, and Hadrian climbed it by night to see the sunrise and as he sacrificed, lightning struck the victim and the attendant. Because it stood to the north of Canaan, its name became the ordinary Hebrew word for “north”, tsafon."
    - "That is why the Hebrew Bible can be read in two ways where it uses the word with the old mountain in mind. Psalm 48 praises Zion as “the joy of the whole earth”, “on the sides of the north, the city of the great King”, naming Zion's height with the word that at Ugarit named Baal's seat: many take it to say that Zion, not Zaphon, is the true mountain of God. The king of Babylon in Isaiah boasts, “I will sit also upon the mount of the congregation, in the sides of the north”, that is, on the mountain where the gods assemble. Job says of God, “He stretcheth out the north over the empty place, and hangeth the earth upon nothing”, where “the north” may be the mountain, or the northern sky. The Russian Synodal text, like most translations, gives simply “north” in all three and never names the mountain Zaphon."
    - "The mountain, Kel Dağı in Turkish, stands today in the province of Hatay, its summit a military zone; the ruins of Ugarit, Ras Shamra, lie across the Syrian border some 40 km south, and the sunrise from the top is still a famous sight."
  ru:
    - "Гора Цафон — это Джебель-эль-Акра, голая известняковая вершина высотой около 1700 м, встающая прямо из моря чуть южнее устья Оронта, на границе Турции и Сирии. В табличках Угарита, лежащего километрах в 40 южнее, XIV–XIII веков до н. э. она зовётся Цапуну — гора Ваала, на которой бог-ремесленник построил ему дворец из серебра и золота и с которой он гремел громом; хетты звали её Хацци и ставили среди богов, свидетельствовавших их договоры. Для греков и римлян это была гора Касий, престол Зевса Касия, и Адриан поднялся на неё ночью, чтобы увидеть восход, и во время жертвоприношения молния поразила жертву и прислужника. Оттого что она стояла к северу от Ханаана, её имя стало обычным еврейским словом «север» — цафон."
    - "Поэтому еврейскую Библию можно читать двояко там, где она употребляет это слово, помня о древней горе. 47-й псалом славит Сион как «радость всей земли», «на северной стороне ее город великого Царя» — тем самым словом, которым в Угарите назывался престол Ваала: многие понимают это так, что истинная гора Божия — Сион, а не Цафон. Царь Вавилонский у Исаии хвалится: «сяду на горе в сонме богов, на краю севера», то есть на горе собрания богов. Иов говорит о Боге: «Он распростер север над пустотою, повесил землю ни на чем», где «север» может быть и горой, и северным небом. Синодальный перевод, как и большинство переводов, во всех трёх местах даёт просто «север» и нигде не называет гору Цафоном."
    - "Гора, по-турецки Кель-Дагы, стоит сегодня в провинции Хатай, её вершина — военная зона; развалины Угарита, Рас-Шамра, лежат за сирийской границей километрах в 40 южнее, а восход с вершины по-прежнему знаменитое зрелище."
  uk:
    - "Гора Цафон — це Джебель-ель-Акра, лиса вапнякова вершина заввишки близько 1700 м, що здіймається прямо з моря на південь від гирла Оронта, на кордоні Туреччини й Сирії. У табличках Угарита, приблизно за 40 км на південь, XIV–XIII ст. до н. е., вона — Сапуну, гора Ваала, на якій бог-ремісник збудував йому палац зі срібла й золота і з якої він грозив громами; хетти називали її Хаззі і ставили серед богів, що були свідками їхніх договорів. Для греків і римлян це була гора Касій, оселя Зевса Касія, і Адріан піднявся на неї вночі, щоб побачити схід сонця, і коли він приносив жертву, блискавка вразила жертву й служителя. Оскільки вона стояла на північ від Ханаану, її назва стала звичайним староєврейським словом для «півночі», цафон."
    - "Тому староєврейську Біблію можна читати двояко там, де вона вживає це слово з огляду на стару гору. Псалом 48 прославляє Сіон як «радість землї цїлої», «на самій півночі город царя великого», називаючи висоту Сіону словом, що в Угариті називало оселю Ваала: багато хто бачить у цьому твердження, що Сіон, а не Цафон, — справжня гора Бога. Цар Вавилона в Ісаї хвалиться: «засяду на горі між богами, на краю півночі», тобто на горі, де збираються боги. Йов каже про Бога: «Північний вітер розпускає він в порожню (воздушну), повісив землю нї на чім», де «північ» може бути горою або північним небом. Російський Синодальний текст, як і більшість перекладів, дає у всіх трьох просто «північ» і ніде не називає гору Цафоном."
    - "Гора, турецькою Кель-Даги, стоїть нині в провінції Хатай, її вершина — військова зона; руїни Угарита, Рас-Шамра, лежать через сирійський кордон приблизно за 40 км на південь, і схід сонця з вершини й досі славний краєвид."
  es:
    - "El monte Zafón es el Jebel al-Aqra, un pico calizo pelado de unos 1700 m de altura que se alza directamente del mar justo al sur de la desembocadura del Orontes, en la frontera entre Turquía y Siria. En las tablillas de Ugarit, a unos 40 km al sur, de los siglos XIV y XIII a. C., es Sapunu, el monte de Baal, en el cual el dios artesano le construyó un palacio de plata y oro y desde el cual tronaba; los hititas lo llamaban Hazzi y lo situaban entre los dioses que atestiguaban sus tratados. Para griegos y romanos era el monte Casio, sede de Zeus Casio, y Adriano lo escaló de noche para ver el amanecer y, mientras sacrificaba, un rayo hirió a la víctima y al asistente. Por estar al norte de Canaán, su nombre pasó a ser la palabra hebrea corriente para «norte», tsafon."
    - "Por eso la Biblia hebrea puede leerse de dos maneras donde usa la palabra con el antiguo monte en mente. El Salmo 48 alaba a Sion como «el gozo de toda la tierra», «á los lados del aquilón, la ciudad del gran Rey», nombrando la altura de Sion con la palabra que en Ugarit nombraba la sede de Baal: muchos entienden que dice que Sion, y no Zafón, es el verdadero monte de Dios. El rey de Babilonia en Isaías se jacta: «en el monte del testimonio me sentaré, á los lados del aquilón», es decir, en el monte donde se reúnen los dioses. Job dice de Dios: «Extiende el aquilón sobre vacío, cuelga la tierra sobre nada», donde «el aquilón» puede ser el monte o el cielo del norte. El texto sinodal ruso, como la mayoría de las traducciones, da simplemente «norte» en los tres y nunca llama Zafón al monte."
    - "El monte, Kel Dağı en turco, se alza hoy en la provincia de Hatay, con su cima como zona militar; las ruinas de Ugarit, Ras Shamra, se encuentran al otro lado de la frontera siria, a unos 40 km al sur, y el amanecer desde la cima sigue siendo un espectáculo famoso."
  pt:
    - "O Monte Zafom é o Jebel al-Aqra, um pico calcário pelado de uns 1.700 m que se ergue direto do mar logo ao sul da foz do Orontes, na fronteira entre a Turquia e a Síria. Nas tabuinhas de Ugarit, uns 40 km ao sul, dos séculos XIV e XIII a.C., é Sapunu, o monte de Baal, onde o deus artífice lhe construiu um palácio de prata e ouro e de onde ele trovejava; os hititas o chamavam Hazzi e o punham entre os deuses que testemunhavam seus tratados. Para gregos e romanos era o Monte Cásio, sede de Zeus Cásio, e Adriano o subiu de noite para ver o nascer do sol e, quando sacrificava, um raio atingiu a vítima e o assistente. Por ficar ao norte de Canaã, seu nome tornou-se a palavra hebraica comum para “norte”, tsafon."
    - "É por isso que a Bíblia hebraica pode ser lida de dois modos onde usa a palavra com o antigo monte em mente. O Salmo 48 louva Sião como “a alegria de toda a terra”, “nos lados do norte, a cidade do grande Rei”, nomeando a altura de Sião com a palavra que em Ugarit nomeava a sede de Baal: muitos entendem que diz que Sião, e não Zafom, é o verdadeiro monte de Deus. O rei da Babilônia em Isaías se vangloria: “Eu me assentarei no monte da congregação, no extremo norte!”, isto é, no monte onde os deuses se reúnem. Jó diz de Deus: “Ele estende o norte sobre o espaço vazio, e suspende a terra sobre o nada”, onde “o norte” pode ser o monte ou o céu setentrional. O texto sinodal russo, como a maioria das traduções, dá simplesmente “norte” nos três e nunca chama o monte de Zafom."
    - "O monte, Kel Dağı em turco, ergue-se hoje na província de Hatay, com o cume zona militar; as ruínas de Ugarit, Ras Shamra, ficam do outro lado da fronteira síria, uns 40 km ao sul, e o nascer do sol do alto continua uma vista famosa."
  de:
    - "Der Berg Zafon ist der Dschebel al-Aqra, ein kahler Kalksteingipfel von etwa 1700 m Höhe, der unmittelbar südlich der Mündung des Orontes direkt aus dem Meer aufsteigt, an der Grenze zwischen der Türkei und Syrien. In den Tafeln von Ugarit, etwa 40 km südlich, aus dem vierzehnten und dreizehnten Jahrhundert v. Chr., ist er Sapunu, der Berg Baals, auf dem der Handwerkergott ihm einen Palast aus Silber und Gold baute und von dem er donnerte; die Hethiter nannten ihn Hazzi und stellten ihn unter die Götter, die ihre Verträge bezeugten. Den Griechen und Römern war er der Mons Casius, Sitz des Zeus Kasios, und Hadrian bestieg ihn nachts, um den Sonnenaufgang zu sehen, und als er opferte, schlug der Blitz in das Opfertier und den Diener. Weil er nördlich von Kanaan stand, wurde sein Name zum gewöhnlichen hebräischen Wort für „Norden“, tsafon."
    - "Deshalb lässt sich die hebräische Bibel dort, wo das Wort den alten Berg im Sinn hat, auf zwei Weisen lesen. Psalm 48 preist den Zion: „Schön ragt empor der Berg Zion, des sich das ganze Land tröstet; an der Seite gegen Mitternacht liegt die Stadt des großen Königs“, und nennt die Höhe des Zion mit dem Wort, das in Ugarit den Sitz Baals bezeichnete: Viele verstehen es so, dass Zion, nicht Zafon, der wahre Gottesberg ist. Der König von Babel bei Jesaja prahlt: „ich will mich setzen auf den Berg der Versammlung in der fernsten Mitternacht“, also den Berg der Götterversammlung. Hiob sagt von Gott: „Er breitet aus die Mitternacht über das Leere und hängt die Erde an nichts“, wo „die Mitternacht“ der Berg oder der nördliche Himmel sein kann. Der russische Synodaltext gibt wie die meisten Übersetzungen überall schlicht „Norden“ und nennt den Berg nirgends Zafon."
    - "Der Berg, türkisch Kel Dağı, steht heute in der Provinz Hatay, sein Gipfel ist Militärgebiet; die Ruinen von Ugarit, Ras Schamra, liegen jenseits der syrischen Grenze etwa 40 km südlich, und der Sonnenaufgang vom Gipfel ist noch immer ein berühmter Anblick."
  fr:
    - "Le mont Tsaphon est le Jebel al-Aqra, pic calcaire chauve de quelque 1 700 m qui s’élève tout droit de la mer juste au sud de l’embouchure de l’Oronte, à la frontière de la Turquie et de la Syrie. Dans les tablettes d’Ougarit, à quelque 40 km au sud, des XIVe et XIIIe siècles av. J.-C., c’est Sapounou, la montagne de Baal, sur laquelle le dieu artisan lui bâtit un palais d’argent et d’or et d’où il tonnait ; les Hittites l’appelaient Hazzi et le rangeaient parmi les dieux témoins de leurs traités. Pour les Grecs et les Romains, c’était le mont Casius, siège de Zeus Kasios, et Hadrien l’escalada de nuit pour voir le lever du soleil et, comme il sacrifiait, la foudre frappa la victime et le servant. Parce qu’il se dressait au nord de Canaan, son nom devint le mot hébreu ordinaire pour « nord », tsafon."
    - "C’est pourquoi la Bible hébraïque peut se lire de deux façons là où elle emploie le mot en pensant à l’ancienne montagne. Le psaume 48 loue Sion comme « joie de toute la terre, la montagne de Sion ; le côté septentrional, c’est la ville du grand roi », nommant la hauteur de Sion du mot qui à Ougarit nommait le siège de Baal : beaucoup y voient l’affirmation que Sion, et non Tsaphon, est la vraie montagne de Dieu. Le roi de Babylone chez Ésaïe se vante : « Je m’assiérai sur la montagne de l’assemblée, à l’extrémité du septentrion », c’est-à-dire sur la montagne où s’assemblent les dieux. Job dit de Dieu : « Il étend le septentrion sur le vide, il suspend la terre sur le néant », où « le septentrion » peut être la montagne ou le ciel du nord. Le texte synodal russe, comme la plupart des traductions, donne simplement « nord » dans les trois cas et ne nomme jamais la montagne Tsaphon."
    - "La montagne, Kel Dağı en turc, se dresse aujourd’hui dans la province de Hatay, son sommet étant une zone militaire ; les ruines d’Ougarit, Ras Shamra, se trouvent de l’autre côté de la frontière syrienne à quelque 40 km au sud, et le lever du soleil depuis le sommet reste un spectacle célèbre."
  pl:
    - "Góra Safon to Dżabal al-Akra, łysy wapienny szczyt o wysokości około 1700 m, wznoszący się prosto z morza tuż na południe od ujścia Orontesu, na granicy Turcji i Syrii. W tabliczkach z Ugarit, około 40 km na południe, z XIV i XIII wieku p.n.e., jest to Sapunu, góra Baala, na której bóg rzemieślnik zbudował mu pałac ze srebra i złota i z której grzmiał; Hetyci nazywali ją Chazzi i zaliczali do bogów będących świadkami ich traktatów. Dla Greków i Rzymian była to Góra Kasjos, siedziba Zeusa Kasiosa, a Hadrian wspiął się na nią nocą, by zobaczyć wschód słońca, i gdy składał ofiarę, piorun uderzył w ofiarę i sługę. Ponieważ stała na północ od Kanaanu, jej nazwa stała się zwykłym hebrajskim słowem na „północ”, tsafon."
    - "Dlatego Biblię hebrajską można czytać na dwa sposoby tam, gdzie używa tego słowa z myślą o dawnej górze. Psalm 48 chwali Syjon: „uciechą wszystkiej ziemi jest góra Syon w stronach północnych, miasto króla wielkiego”, nazywając wysokość Syjonu słowem, które w Ugarit nazywało siedzibę Baala: wielu bierze to za stwierdzenie, że Syjon, a nie Safon, jest prawdziwą górą Boga. Król Babilonu u Izajasza chełpi się: „a usiądę na górze zgromadzenia, na stronach północnych”, to znaczy na górze, gdzie zbierają się bogowie. Hiob mówi o Bogu: „Rozciągnął północy nad miejscem próżnem, a ziemię zawiesił na niczem”, gdzie „północ” może być górą albo północnym niebem. Rosyjski tekst synodalny, jak większość przekładów, daje we wszystkich trzech po prostu „północ” i nigdzie nie nazywa góry Safonem."
    - "Góra, po turecku Kel Dağı, stoi dziś w prowincji Hatay, a jej szczyt jest strefą wojskową; ruiny Ugarit, Ras Szamra, leżą za granicą syryjską około 40 km na południe, a wschód słońca ze szczytu jest nadal słynnym widokiem."
  it:
    - "Il Monte Zafon è il Jebel al-Aqra, una nuda vetta calcarea alta circa 1.700 m che si leva direttamente dal mare appena a sud della foce dell’Oronte, sul confine fra Turchia e Siria. Nelle tavolette di Ugarit, circa 40 km a sud, dei secoli XIV e XIII a.C., è Sapunu, il monte di Baal, sul quale il dio artigiano gli costruì un palazzo d’argento e d’oro e da cui egli tuonava; gli Ittiti lo chiamavano Hazzi e lo ponevano fra gli dèi testimoni dei loro trattati. Per i Greci e i Romani era il Monte Casio, sede di Zeus Kasios, e Adriano lo salì di notte per vedere l’alba e, mentre sacrificava, un fulmine colpì la vittima e l’inserviente. Poiché stava a nord di Canaan, il suo nome divenne la parola ebraica ordinaria per «nord», tsafon."
    - "Per questo la Bibbia ebraica può essere letta in due modi dove usa la parola avendo in mente l’antico monte. Il Salmo 48 loda Sion come «gioia di tutta la terra», «dalle parti del settentrione, bella è la città del gran re», nominando l’altura di Sion con la parola che a Ugarit nominava la sede di Baal: molti lo intendono come dire che Sion, non Zafon, è il vero monte di Dio. Il re di Babilonia in Isaia si vanta: «io m’assiderò sul monte dell’assemblea, nella parte estrema del settentrione», cioè sul monte dove gli dèi si radunano. Giobbe dice di Dio: «Egli distende il settentrione sul vuoto, sospende la terra sul nulla», dove «il settentrione» può essere il monte, o il cielo del nord. Il testo sinodale russo, come la maggior parte delle traduzioni, dà semplicemente «nord» in tutti e tre i passi e non chiama mai il monte Zafon."
    - "Il monte, Kel Dağı in turco, sorge oggi nella provincia di Hatay, con la vetta zona militare; le rovine di Ugarit, Ras Shamra, giacciono oltre il confine siriano circa 40 km a sud, e l’alba dalla cima è ancora uno spettacolo famoso."
  nl:
    - "De berg Zafon is Jebel al-Aqra, een kale kalksteenpiek van zo’n 1700 m hoog die recht uit de zee oprijst, even ten zuiden van de monding van de Orontes, op de grens van Turkije en Syrië. In de tabletten van Oegarit, zo’n 40 km naar het zuiden, uit de veertiende en dertiende eeuw v.Chr., is hij Sapunu, de berg van Baäl, waarop de ambachtsgod hem een paleis van zilver en goud bouwde en vanwaar hij donderde; de Hettieten noemden hem Hazzi en rekenden hem onder de goden die hun verdragen bezegelden. Voor Grieken en Romeinen was hij de berg Casius, zetel van Zeus Kasios, en Hadrianus beklom hem ’s nachts om de zonsopgang te zien en toen hij offerde, trof de bliksem het offerdier en de dienaar. Omdat hij ten noorden van Kanaän stond, werd zijn naam het gewone Hebreeuwse woord voor “noord”, tsafon."
    - "Daarom kan de Hebreeuwse Bijbel op twee manieren worden gelezen waar hij het woord gebruikt met de oude berg voor ogen. Psalm 48 prijst Sion als “een vreugde der ganse aarde”, “aan de zijden van het noorden; de stad des groten Konings”, waarbij Sions hoogte wordt genoemd met het woord dat in Oegarit de zetel van Baäl noemde: velen nemen het zo dat Sion, en niet Zafon, de ware berg van God is. De koning van Babylon in Jesaja snoeft: “ik zal mij zetten op den berg der samenkomst aan de zijden van het noorden”, dat wil zeggen op de berg waar de goden vergaderen. Job zegt van God: “Hij breidt het noorden uit over het woeste; Hij hangt de aarde aan een niet”, waar “het noorden” de berg kan zijn, of de noordelijke hemel. De Russische Synodale tekst geeft, net als de meeste vertalingen, in alle drie eenvoudig “noord” en noemt de berg nergens Zafon."
    - "De berg, in het Turks Kel Dağı, staat tegenwoordig in de provincie Hatay, zijn top een militair gebied; de ruïnes van Oegarit, Ras Shamra, liggen aan de overkant van de Syrische grens zo’n 40 km naar het zuiden, en de zonsopgang vanaf de top is nog steeds een beroemd gezicht."
  cs:
    - "Hora Cafon je Džebel al-Akra, holý vápencový vrchol vysoký asi 1700 m, který se zvedá přímo z moře těsně jižně od ústí Orontu, na hranici Turecka a Sýrie. V tabulkách z Ugaritu, asi 40 km na jih, ze 14. a 13. stol. př. n. l., je to Sapunu, hora Baalova, na které mu řemeslnický bůh postavil palác ze stříbra a zlata a z níž hřměl; Chetité ji nazývali Hazzi a řadili ji mezi bohy, kteří svědčili jejich smlouvám. Pro Řeky a Římany to byla hora Kasios, sídlo Dia Kasia, a Hadrianus na ni vystoupil v noci, aby viděl východ slunce, a když obětoval, zasáhl blesk oběť i sluhu. Protože stála na sever od Kanaánu, stalo se její jméno obvyklým hebrejským slovem pro „sever“, cafon."
    - "Proto lze hebrejskou Bibli číst dvojím způsobem tam, kde užívá slova s ohledem na starou horu. Žalm 48 chválí Sijón jako „útěcha vší země“, „k straně půlnoční, město krále velikého“, a výšinu Sijónu označuje slovem, které v Ugaritu označovalo Baalovo sídlo: mnozí z toho vyčítají, že Sijón, a ne Cafon, je pravou horou Boží. Babylónský král u Izajáše se chlubí: „posadím se na hoře shromáždění k straně půlnoční“, tedy na hoře, kde se shromažďují bohové. Job praví o Bohu: „Ontě roztáhl půlnoční stranu nad prázdnem, zavěsil zemi na ničemž“, kde „půlnoční strana“ může být hora, nebo severní nebe. Ruský synodální text, jako většina překladů, má ve všech třech případech prostě „sever“ a horu nikde nenazývá Cafon."
    - "Hora, tureckým jménem Kel Dağı, stojí dnes v provincii Hatay, její vrchol je vojenskou zónou; zříceniny Ugaritu, Rás Šamra, leží za syrskou hranicí asi 40 km jižně a východ slunce z vrcholu je dosud slavným pohledem."
  sv:
    - "Berget Safon är Jebel al-Aqra, en kal kalkstenstopp omkring 1 700 m hög som reser sig rakt ur havet strax söder om Orontes' mynning, på gränsen mellan Turkiet och Syrien. I tavlorna från Ugarit, omkring 40 km söderut, från 1300- och 1200-talen f.Kr., är det Sapunu, Baals berg, där hantverksguden byggde ett palats av silver och guld åt honom och varifrån han åskade; hettiterna kallade det Hazzi och räknade det bland gudarna som bevittnade deras fördrag. För greker och romare var det berget Kasios, säte för Zeus Kasios, och Hadrianus besteg det om natten för att se soluppgången och när han offrade slog blixten ner i offerdjuret och tjänaren. Eftersom det stod norr om Kanaan blev dess namn det vanliga hebreiska ordet för ”norr”, tsafon."
    - "Det är skälet till att den hebreiska Bibeln kan läsas på två sätt där den använder ordet med det gamla berget i tankarna. Psalm 48 prisar Sion som ”hela jordens fröjd”, ”berget Sion längst uppe i norr, den store konungens stad”, och benämner Sions höjd med det ord som i Ugarit benämnde Baals säte: många tar det som att det är Sion, inte Safon, som är det sanna gudaberget. Babylons kung hos Jesaja skryter: ”jag vill sätta mig på gudaförsamlingens berg längst uppe i norr”, det vill säga på berget där gudarna samlas. Job säger om Gud: ”Han spänner ut nordanrymden över det tomma och hänger upp jorden på intet”, där ”nordanrymden” kan vara berget eller den norra himlen. Den ryska synodala texten, liksom de flesta översättningar, ger helt enkelt ”norr” på alla tre ställena och nämner aldrig berget Safon."
    - "Berget, på turkiska Kel Dağı, står i dag i provinsen Hatay, dess topp en militär zon; ruinerna av Ugarit, Ras Shamra, ligger över den syriska gränsen omkring 40 km söderut, och soluppgången från toppen är fortfarande en berömd syn."
  nb:
    - "Safon-fjellet er Jebel al-Aqra, en snau kalksteinstopp på omkring 1700 m som reiser seg rett opp av havet like sør for munningen av Orontes, på grensen mellom Tyrkia og Syria. I tavlene fra Ugarit, omkring 40 km mot sør, fra 1300- og 1200-tallet f.Kr., er det Sapunu, Baals fjell, hvor håndverksguden bygde ham et palass av sølv og gull og hvorfra han tordnet; hettittene kalte det Hazzi og satte det blant gudene som var vitner til traktatene deres. For grekerne og romerne var det Kasios-fjellet, sete for Zevs Kasios, og Hadrian besteg det om natten for å se soloppgangen, og mens han ofret, slo lynet ned i offerdyret og tjeneren. Fordi det sto nord for Kanaan, ble navnet det alminnelige hebraiske ordet for «nord», tsafon."
    - "Derfor kan den hebraiske Bibelen leses på to måter der den bruker ordet med det gamle fjellet i tankene. Salme 48 priser Sion som «en glede for all jorden», «det ytterste Norden, den store konges stad», og kaller Sions høyde med ordet som i Ugarit ga navn til Baals sete: mange tar det som at Sion, ikke Safon, er det sanne Guds fjell. Babylons konge hos Jesaja skryter: «jeg vil ta sete på gudenes tingfjell i det ytterste nord», det vil si på fjellet der gudene samles. Job sier om Gud: «Han breder Norden ut over det øde rum, han henger jorden på intet», der «Norden» kan være fjellet eller den nordlige himmelen. Den russiske synodalteksten, som de fleste oversettelser, har rett og slett «nord» i alle tre og nevner aldri fjellet Safon."
    - "Fjellet, Kel Dağı på tyrkisk, står i dag i provinsen Hatay, med toppen som militærsone; ruinene av Ugarit, Ras Shamra, ligger over den syriske grensen omkring 40 km sør, og soloppgangen fra toppen er fortsatt et berømt syn."
  tl:
    - "Ang Bundok Saphon ay ang Jebel al-Aqra, kalbong tuktok na apog na mga 1,700 m ang taas na umaangat nang tuwid mula sa dagat sa timog lamang ng bukana ng Orontes, sa hangganan ng Turkey at Siria. Sa mga tableta ng Ugarit, mga 40 km sa timog, noong ika-14 at ika-13 siglo BK, ito ay Sapunu, ang bundok ni Baal, kung saan nagtayo para sa kaniya ang diyos-manggagawa ng palasyong pilak at ginto at mula roon siya kumukulog; tinawag ito ng mga Heteo na Hazzi at inilagay sa mga diyos na saksi ng kanilang mga tipan. Sa mga Griego at Romano, ito ang Bundok Casius, luklukan ni Zeus Kasios, at inakyat ito ni Hadriano nang gabi upang makita ang pagsikat ng araw at habang naghahandog, tinamaan ng kidlat ang hayop at ang katulong. Dahil nasa hilaga ito ng Canaan, ang pangalan nito ay naging karaniwang salitang Hebreo para sa “hilaga”, tsafon."
    - "Kaya maaaring basahin sa dalawang paraan ang Hebreo kung saan may lumang bundok sa isip. Pinupuri ng Awit 48 ang Sion bilang “ang kagalakan ng buong lupa”, “sa mga dako ng hilagaan, na bayan ng dakilang Hari”, pinangangalanan ang kataasan ng Sion sa salitang nagpangalan sa luklukan ni Baal sa Ugarit: iniisip ng marami na ang Sion, hindi ang Saphon, ang tunay na bundok ng Diyos. Ipinagyayabang ng hari ng Babilonia sa Isaias, “ako'y uupo sa bundok ng kapisanan, sa mga kaduluduluhang bahagi ng hilagaan”, bundok ng pagtitipon ng mga diyos. Sinasabi ni Job tungkol sa Diyos, “Kaniyang iniuunat ang hilagaan sa pagitang walang laman, at ibinibitin ang lupa sa wala”, na ang “hilagaan” ay maaaring ang bundok, o ang hilagang langit. Ang tekstong Synodal na Ruso, gaya ng karamihan ng salin, ay “hilaga” lamang ang inilalagay sa tatlo, at hindi kailanman pinangalanang Saphon ang bundok."
    - "Ang bundok, Kel Dağı sa Turko, ay nasa lalawigan ng Hatay ngayon, na ang tuktok ay sonang militar; ang mga guho ng Ugarit, Ras Shamra, ay nasa kabila ng hangganang Siriano mga 40 km sa timog, at kilalang tanawin pa rin ang pagsikat ng araw mula sa tuktok."
  da:
    - "Safon-bjerget er Jebel al-Aqra, en nøgen kalkstenstop på omkring 1.700 m, der rejser sig lige op af havet lige syd for Orontes' munding, på grænsen mellem Tyrkiet og Syrien. I Ugarits tavler, omkring 40 km mod syd, fra 1300- og 1200-tallet f.Kr., er det Sapunu, Ba'als bjerg, hvor håndværkerguden byggede ham et palads af sølv og guld, og hvorfra han tordnede; hittitterne kaldte det Hazzi og anbragte det blandt de guder, der var vidner til deres traktater. For grækerne og romerne var det Kasios-bjerget, sæde for Zeus Kasios, og Hadrian besteg det om natten for at se solopgangen, og da han ofrede, slog lynet ned i offerdyret og tjeneren. Fordi det stod nord for Kana'an, blev dets navn det almindelige hebraiske ord for »nord«, tsafon."
    - "Derfor kan den hebraiske Bibel læses på to måder, hvor den bruger ordet med det gamle bjerg i tankerne. Salme 48 priser Zion som »det ganske Lands Glæde«, »yderst imod Nord, den store Konges Stad«, idet Zions højde nævnes med det ord, der i Ugarit nævnte Ba'als sæde: mange tager det som et udsagn om, at Zion, ikke Safon, er det sande Guds bjerg. Babylons konge hos Esajas praler: »jeg vil sidde paa Forsamlingsbjerget, yderst imod Norden«, det vil sige på bjerget, hvor guderne samles. Job siger om Gud: »Han udbreder Norden over det øde, han hænger Jorden paa intet«, hvor »Norden« kan være bjerget eller den nordlige himmel. Den russiske Synodaltekst giver, som de fleste oversættelser, blot »nord« i alle tre og nævner aldrig bjerget Safon."
    - "Bjerget, på tyrkisk Kel Dağı, står i dag i provinsen Hatay, med toppen som militært område; ruinerne af Ugarit, Ras Shamra, ligger over den syriske grænse omkring 40 km mod syd, og solopgangen fra toppen er stadig et berømt syn."
  sr:
    - "Гора Сафон је Џебел ел Акра, голи кречњачки врх висок око 1.700 м који се диже право из мора одмах јужно од ушћа Оронта, на граници Турске и Сирије. У плочицама из Угарита, око 40 км јужно, из 14. и 13. века п. н. е., то је Сапуну, гора Валова, на којој му је бог занатлија подигао палату од сребра и злата и са које је грмео; Хетити су је звали Хаци и сврстали међу богове сведоке својих уговора. За Грке и Римљане била је гора Касије, седиште Зевса Касија, и Хадријан се попео на њу ноћу да види излазак сунца, а док је приносио жртву, муња је ударила жртву и послужитеља. Пошто је стајала северно од Ханана, њено име постало је обична хебрејска реч за „север“, цафон."
    - "Зато се хебрејска Библија може читати на два начина тамо где употребљава реч имајући на уму стару гору. Псалам 48 хвали гору Сион речима „утеха свој земљи“, „на северној страни њеној град цара великог“, именујући Сионову висину речју која је у Угариту именовала Валово седиште: многи сматрају да то каже да је Сион, а не Сафон, права гора Божја. Цар Вавилона код Исаије се хвали: „сешћу на гори зборној на страни северној“, то јест на гори где се богови окупљају. Јов каже о Богу: „Он је разастро и север над празнином, и земљу обесио ни о чем“, где „север“ може бити гора или северно небо. Руски синодски текст, као и већина превода, у сва три случаја даје просто „север“ и никад не именује гору Сафон."
    - "Гора, на турском Кел Даги, данас стоји у провинцији Хатај, њен врх је војна зона; рушевине Угарита, Рас Шамра, леже преко сиријске границе око 40 км јужно, а излазак сунца са врха и даље је чувен призор."
  hu:
    - "A Cáfón-hegy a Dzsebel el-Akra, a mintegy 1700 m magas kopár mészkőcsúcs, amely közvetlenül a tengerből emelkedik ki az Orontész torkolatától délre, Törökország és Szíria határán. Az Ugaritnál, mintegy 40 km-re délre, talált Kr. e. 14. és 13. századi táblákon ő Sapunu, Baál hegye, amelyen a mesteristen palotát épített neki ezüstből és aranyból, és ahonnan mennydörgött; a hettiták Hazzinak nevezték, és a szerződéseik tanúi istenek közé sorolták. A görögök és rómaiak számára Kasziosz-hegy volt, Zeusz Kasziosz székhelye, és Hadrianus éjjel megmászta, hogy lássa a napfelkeltét, és amikor áldozott, villám sújtotta az áldozati állatot és a szolgát. Mivel Kánaántól északra állt, neve lett a héber „észak” szó szokásos alakja, cáfón."
    - "Ezért olvasható a héber Biblia kétféleképpen ott, ahol a szót a régi hegyre gondolva használja. A 48. zsoltár így dicséri Siont: „az egész föld öröme, a Sion hegye, a szélső észak felé, a nagy királynak városa”, magaslatát azzal a szóval nevezve meg, amely Ugaritnál Baál székhelyét jelölte; sokan úgy értik, hogy Sion, nem Cáfón az igazi Isten-hegy. Babilon királya Ézsaiásnál azzal dicsekszik, hogy „lakom a gyülekezet hegyén messze északon”, vagyis azon a hegyen, ahol az istenek összegyűlnek. Jób Istenről mondja: „Ő terjeszti ki északot az üresség fölé és függeszti föl a földet a semmiség fölé”, ahol az „észak” lehet a hegy vagy az északi égbolt. Az orosz szinodális szöveg, mint a legtöbb fordítás, mindhárom helyen egyszerűen „északot” ad, és soha nem nevezi a hegyet Cáfónnak."
    - "A hegy, törökül Kel Dağı, ma Hatay tartományban áll, csúcsa katonai övezet; Ugarit romjai, Rasz Samra, a szíriai határon túl, mintegy 40 km-re délre fekszenek, és a csúcsról a napfelkelte ma is híres látvány."
  fi:
    - "Safon-vuori on Jebel al-Aqra, paljas kalkkikivihuippu, noin 1 700 m korkea, joka kohoaa suoraan merestä aivan Oronteen suun eteläpuolella Turkin ja Syyrian rajalla. Ugaritin tauluissa, noin 40 km etelässä, 1300- ja 1200-luvulta eaa., se on Sapunu, Baalin vuori, jolle käsityöläisjumala rakensi hänelle hopeasta ja kullasta palatsin ja josta hän jyrisi; heettiläiset kutsuivat sitä Hazziksi ja lukivat sen sopimustensa todistajajumalten joukkoon. Kreikkalaisille ja roomalaisille se oli Kasios-vuori, Zeus Kasioksen istuin, ja Hadrianus nousi sille yöllä nähdäkseen auringonnousun, ja hänen uhratessaan salama iski uhrieläimeen ja palvelijaan. Koska se seisoi Kanaanin pohjoispuolella, sen nimestä tuli tavallinen heprean sana ”pohjoinen”, tsafon."
    - "Siksi heprealainen Raamattu voidaan lukea kahdella tavalla siellä, missä se käyttää sanaa tuo vanha vuori mielessä. Psalmi 48 ylistää Siionia: ”kaiken maan ilona, pohjan puolella Siionin vuori, suuren kuninkaan kaupunki”, nimeten Siionin korkeuden sanalla, joka Ugaritissa nimesi Baalin istuimen: monet katsovat sen sanovan, että Siion, ei Safon, on Jumalan todellinen vuori. Babylonin kuningas kerskuu Jesajassa: ”istun ilmestysvuorelle, pohjimmaiseen Pohjolaan”, eli vuorelle, jolle jumalat kokoontuvat. Job sanoo Jumalasta: ”Pohjoisen hän kaarruttaa autiuden ylle, ripustaa maan tyhjyyden päälle”, missä ”pohjoinen” voi olla vuori tai pohjoinen taivas. Venäjän synodaalinen teksti, kuten useimmat käännökset, sanoo kaikissa kolmessa pelkästään ”pohjoinen” eikä nimeä vuorta koskaan Safoniksi."
    - "Vuori, turkiksi Kel Dağı, seisoo nykyisin Hatayn maakunnassa, sen huippu sotilasalueena; Ugaritin rauniot, Ras Shamra, ovat Syyrian rajan toisella puolella noin 40 km etelässä, ja auringonnousu huipulta on yhä kuuluisa näky."
  vi:
    - "Núi Xa-phôn là Jebel al-Aqra, một đỉnh đá vôi trọc cao khoảng 1.700 m mọc thẳng từ biển ngay phía nam cửa sông Orontes, trên biên giới Thổ Nhĩ Kỳ và Sy-ri. Trong các bảng đất sét của Ugarit, cách khoảng 40 km về phía nam, thế kỷ 14 và 13 TCN, nó là Sapunu, núi của Ba-anh, nơi vị thần thợ khéo xây cho thần một cung điện bằng bạc và vàng và từ đó thần gầm vang; người Hittite gọi nó là Hazzi và đặt nó trong số các thần làm chứng cho các hiệp ước của họ. Với người Hy Lạp và La Mã, nó là Núi Casius, nơi ngự của Zeus Kasios, và Hadrian leo nó ban đêm để xem mặt trời mọc và khi ông dâng tế, sét đánh vào con vật tế và người hầu. Vì nó đứng ở phía bắc Ca-na-an, tên của nó trở thành từ Hê-bơ-rơ thông thường cho “phương bắc”, tsafon."
    - "Vì vậy Kinh Thánh Hê-bơ-rơ có thể được đọc theo hai cách ở những chỗ dùng từ này với ngọn núi xưa trong tâm trí. Thi thiên 48 ca ngợi Si-ôn là “sự vui vẻ của cả thế gian”, “nổi lên về phía bắc, là kinh đô của Vua cao cả”, gọi đỉnh Si-ôn bằng từ mà ở Ugarit gọi nơi ngự của Ba-anh: nhiều người coi đó là nói rằng Si-ôn, không phải Xa-phôn, là núi thật của Đức Chúa Trời. Vua Ba-by-lôn trong Ê-sai khoe: “Ta sẽ ngồi trên núi hội về cuối cùng phương bắc”, tức trên ngọn núi nơi các thần nhóm. Gióp nói về Đức Chúa Trời: “Chúa trải bắc cực ra trên vùng trống, treo trái đất trong khoảng không không”, nơi “phương bắc” có thể là ngọn núi, hay bầu trời phía bắc. Bản Synodal Nga, như hầu hết các bản dịch, chỉ ghi “phương bắc” ở cả ba chỗ và không bao giờ gọi tên núi là Xa-phôn."
    - "Ngọn núi, Kel Dağı trong tiếng Thổ Nhĩ Kỳ, ngày nay đứng trong tỉnh Hatay, đỉnh là khu quân sự; tàn tích Ugarit, Ras Shamra, nằm bên kia biên giới Sy-ri khoảng 40 km về phía nam, và cảnh mặt trời mọc từ đỉnh vẫn nổi tiếng."
  ro:
    - "Muntele Țafon este Jebel al-Aqra, un vârf gol de calcar înalt de circa 1700 m care se ridică drept din mare chiar la sud de gura Orontului, la granița dintre Turcia și Siria. În tăblițele de la Ugarit, la circa 40 km spre sud, din secolele al XIV-lea și al XIII-lea î.Hr., el este Sapunu, muntele lui Baal, pe care zeul meșteșugar i-a zidit un palat de argint și aur și de pe care el a tunat; hitiții îl numeau Hazzi și l-au pus printre zeii martori ai tratatelor lor. Pentru greci și romani era Muntele Casius, scaunul lui Zeus Kasios, iar Hadrian l-a urcat noaptea ca să vadă răsăritul și, în timp ce aducea jertfă, fulgerul a lovit victima și pe însoțitor. Fiindcă se afla la nord de Canaan, numele lui a devenit cuvântul ebraic obișnuit pentru „nord”, tsafon."
    - "De aceea Biblia ebraică poate fi citită în două feluri acolo unde folosește cuvântul având în minte vechiul munte. Psalmul 48 laudă Sionul ca bucurie a întregului pământ, în coastele nordului, cetatea Marelui Rege, numind înălțimea Sionului cu cuvântul care la Ugarit numea scaunul lui Baal: mulți o iau ca spunând că Sionul, nu Țafon, este adevăratul munte al lui Dumnezeu. Regele Babilonului din Isaia se laudă: „ședeà-voiu pre muntele cel înalt, preste munții cei înalți, cari sunt spre miazănoapte”, adică pe muntele unde se adună zeii. Iov spune despre Dumnezeu: „Cel ce întinde miazănoaptea pre nimic, și spânzură pământul pre nimic”, unde „miazănoaptea” poate fi muntele sau cerul nordic. Textul sinodal rus, ca majoritatea traducerilor, dă în cele trei locuri pur și simplu „nord” și nu numește niciodată muntele Țafon."
    - "Muntele, Kel Dağı în turcă, se află astăzi în provincia Hatay, cu vârful zonă militară; ruinele Ugaritului, Ras Shamra, se află dincolo de granița siriană, la circa 40 km spre sud, iar răsăritul de pe vârf rămâne o priveliște faimoasă."
  bg:
    - "Планината Цафон е Джебел ал-Акра — гол варовиков връх, висок около 1700 м, който се издига направо от морето малко южно от устието на Оронт, на границата между Турция и Сирия. В плочките от Угарит, на около 40 км на юг, от XIV и XIII в. пр.н.е. тя е Сапуну, планината на Ваал, на която богът занаятчия му построил дворец от сребро и злато и от която той гърмял; хетите я наричали Хаци и я поставяли сред боговете, свидетели на техните договори. За гърците и римляните тя била планината Касий, седалище на Зевс Касий; Адриан се изкачил на нея нощем, за да види изгрева, и когато принасял жертва, мълния ударила жертвеното животно и прислужника. Тъй като стояла на север от Ханаан, името ѝ станало обикновената еврейска дума за „север“ — цафон."
    - "Затова еврейската Библия може да се чете по два начина там, където употребява думата с мисъл за старата планина. Пс. 48 възхвалява Сион като „радост на всичката земя“, „на северните страни Градът на великия Цар“, назовавайки височината на Сион с думата, която в Угарит назовавала седалището на Ваал: мнозина разбират това като твърдение, че Сион, а не Цафон, е истинската Божия планина. Вавилонският цар у Исаия се хвали: „И ще седна на гората на събранието, към страните на север“, тоест на планината, където се събират боговете. Йов казва за Бог: „Простира севера върху пустота: Окача земята на нищо“, където „севера“ може да е планината или северното небе. Руският Синодален текст, както повечето преводи, дава просто „север“ и в трите места и никъде не назовава планината Цафон."
    - "Планината, на турски Кел Даъ, днес се намира в провинция Хатай, а върхът ѝ е военна зона; руините на Угарит, Рас Шамра, лежат отвъд сирийската граница на около 40 км на юг, а изгревът от върха и днес е прочута гледка."
