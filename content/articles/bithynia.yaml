body:
  en:
    - "Bithynia is the north-western corner of Asia Minor, the green, wooded land along the Black Sea and the Sea of Marmara, facing Byzantium across the Bosporus. A Thracian people gave it its name, and in the third century BC its rulers made it a Hellenistic kingdom: Nicomedes I founded Nicomedia as his capital about 264 BC, and Prusias I, who gave Hannibal his last refuge, built Prusa under Mount Olympus. Nicomedes IV left the kingdom to Rome in 74 BC, and after the wars with Mithridates it was joined with the western part of Pontus as the province of Bithynia and Pontus. Its cities, Nicomedia, Nicaea, Prusa and Chalcedon, were rich and quarrelsome."
    - "The New Testament names it twice. On the second journey Paul and his companions, kept from preaching in Asia, came to Mysia and “assayed to go into Bithynia: but the Spirit suffered them not”, and went down to Troas instead, whence they crossed to Macedonia. Yet the gospel reached it all the same: the first letter of Peter is addressed “to the strangers scattered throughout Pontus, Galatia, Cappadocia, Asia, and Bithynia”. About AD 112 Pliny the Younger, sent by Trajan to govern the province, wrote to the emperor that the Christians there were many, in towns and villages, of every age and rank, that they met before dawn to sing a hymn to Christ as to a god, and that the temples had been almost deserted; he asked how to try them, and Trajan's reply set the pattern for decades: they were not to be sought out, nor anonymous accusations heard."
    - "Later Bithynia stood at the centre of the empire. Diocletian ruled from Nicomedia, where the Great Persecution began in 303; Constantine summoned the first general council to Nicaea in 325, and the fourth met at Chalcedon in 451. Today the region is north-western Turkey: Nicomedia is İzmit, Nicaea is the lakeside town of İznik with its Roman walls, Prusa is Bursa, and Chalcedon is Kadıköy, a district of Istanbul."
  ru:
    - "Вифиния — северо-западный угол Малой Азии, зелёная лесистая земля вдоль Чёрного и Мраморного морей, обращённая к Византию через Босфор. Имя ей дал фракийский народ, а в III веке до н. э. её правители сделали её эллинистическим царством: Никомед I около 264 г. до н. э. основал свою столицу Никомидию, а Прусий I, давший Ганнибалу последнее убежище, построил Прусу у подножия горы Олимп. Никомед IV завещал царство Риму в 74 г. до н. э., и после войн с Митридатом его соединили с западной частью Понта в провинцию Вифиния и Понт. Её города — Никомидия, Никея, Пруса и Халкидон — были богаты и вечно спорили между собой."
    - "Новый Завет называет её дважды. Во втором путешествии Павел и его спутники, не допущенные проповедовать в Асии, «дойдя до Мисии, предпринимали идти в Вифинию; но Дух не допустил их», и они сошли в Троаду, откуда переправились в Македонию. И всё же Евангелие дошло и туда: первое послание Петра обращено к «пришельцам, рассеянным в Понте, Галатии, Каппадокии, Асии и Вифинии». Около 112 г. н. э. Плиний Младший, посланный Траяном управлять провинцией, писал императору, что христиан там много, в городах и сёлах, всякого возраста и звания, что они собираются до рассвета петь гимн Христу как Богу и что храмы почти опустели; он спрашивал, как их судить, и ответ Траяна на десятилетия стал правилом: не разыскивать их и не принимать безымянных доносов."
    - "Позже Вифиния оказалась в средоточии империи. Диоклетиан правил из Никомидии, где в 303 году началось Великое гонение; Константин созвал первый Вселенский собор в Никею в 325 году, а четвёртый собрался в Халкидоне в 451 году. Сегодня это северо-запад Турции: Никомидия — Измит, Никея — городок Изник на берегу озера с римскими стенами, Пруса — Бурса, а Халкидон — Кадыкёй, район Стамбула."
  uk:
    - "Віфінія — північно-західний куток Малої Азії, зелена лісиста земля вздовж Чорного моря та Мармурового моря, що дивиться на Візантій через Боспор. Назву їй дав фракійський народ, а в III ст. до н. е. її правителі зробили її елліністичним царством: Нікомед I заснував Нікомедію як свою столицю близько 264 р. до н. е., а Прусій I, який дав Ганнібалові останній притулок, збудував Прусу під горою Олімп. Нікомед IV залишив царство Риму в 74 р. до н. е., і після воєн із Мітрідатом його поєднали із західною частиною Понту в провінцію Віфінія і Понт. Її міста — Нікомедія, Нікея, Пруса й Халкедон — були багаті й сварливі."
    - "Новий Заповіт згадує її двічі. Під час другої подорожі Павло з товаришами, яким завадили проповідувати в Азії, дійшли до Місії та «поривались ійти в Витинию, і не пустив їх Дух», і зійшли натомість до Троади, звідки перепливли до Македонії. Проте євангелія все одно дійшло до неї: перший лист Петра адресований «вибраним захожанам розсїяння по Понту, Галатиї, Кападокиї, Азиї і Витиниї». Близько 112 р. н. е. Пліній Молодший, посланий Траяном управляти провінцією, писав імператорові, що християн там багато, у містах і селах, будь-якого віку й стану, що вони збираються до світанку, щоб співати гімн Христові як богові, і що храми майже опустіли; він питав, як їх судити, і відповідь Траяна на десятиліття задала зразок: їх не слід розшукувати, а анонімних доносів не слід вислуховувати."
    - "Пізніше Віфінія опинилася в центрі імперії. Діоклетіан правив із Нікомедії, де в 303 р. почалося Велике гоніння; Константин скликав перший вселенський собор до Нікеї в 325 р., а четвертий відбувся в Халкедоні в 451 р. Сьогодні цей регіон — північно-західна Туреччина: Нікомедія — це Ізміт, Нікея — озерне містечко Ізнік із римськими мурами, Пруса — Бурса, а Халкедон — Кадикьой, район Стамбула."
  es:
    - "Bitinia es el rincón noroccidental de Asia Menor, la tierra verde y boscosa que se extiende a lo largo del mar Negro y del mar de Mármara, frente a Bizancio al otro lado del Bósforo. Un pueblo tracio le dio su nombre, y en el siglo III a. C. sus gobernantes la convirtieron en un reino helenístico: Nicomedes I fundó Nicomedia como su capital hacia el 264 a. C., y Prusias I, que dio a Aníbal su último refugio, construyó Prusa al pie del monte Olimpo. Nicomedes IV legó el reino a Roma en el 74 a. C., y tras las guerras con Mitrídates quedó unido a la parte occidental del Ponto como provincia de Bitinia y Ponto. Sus ciudades, Nicomedia, Nicea, Prusa y Calcedonia, eran ricas y pendencieras."
    - "El Nuevo Testamento la nombra dos veces. En el segundo viaje, Pablo y sus compañeros, impedidos de predicar en Asia, llegaron a Misia y «tentaron de ir á Bithynia; mas el Espíritu no les dejó», y descendieron a Troas, desde donde pasaron a Macedonia. Con todo, el Evangelio llegó: la primera carta de Pedro está dirigida «á los extranjeros esparcidos en Ponto, en Galacia, en Capadocia, en Asia, y en Bithinia». Hacia el 112 d. C. Plinio el Joven, enviado por Trajano a gobernar la provincia, escribió al emperador que los cristianos de allí eran numerosos, en ciudades y aldeas, de toda edad y condición, que se reunían antes del amanecer para cantar un himno a Cristo como a un dios, y que los templos habían quedado casi desiertos; preguntó cómo juzgarlos, y la respuesta de Trajano marcó la pauta durante décadas: no buscarlos ni admitir acusaciones anónimas."
    - "Más tarde Bitinia estuvo en el centro del Imperio. Diocleciano gobernó desde Nicomedia, donde comenzó la Gran Persecución en el 303; Constantino convocó el primer concilio general en Nicea en el 325, y el cuarto se reunió en Calcedonia en el 451. Hoy la región es el noroeste de Turquía: Nicomedia es İzmit, Nicea es la ciudad lacustre de İznik con sus murallas romanas, Prusa es Bursa, y Calcedonia es Kadıköy, un distrito de Estambul."
  pt:
    - "A Bitínia é o canto noroeste da Ásia Menor, terra verde e arborizada ao longo do Mar Negro e do Mar de Mármara, defronte de Bizâncio, do outro lado do Bósforo. Um povo trácio lhe deu o nome, e no século III a.C. seus governantes fizeram dela um reino helenístico: Nicomedes I fundou Nicomédia como capital por volta de 264 a.C., e Prúsias I, que deu a Aníbal seu último refúgio, construiu Prusa ao pé do monte Olimpo. Nicomedes IV legou o reino a Roma em 74 a.C., e depois das guerras contra Mitrídates ele foi unido à parte ocidental do Ponto como a província da Bitínia e Ponto. Suas cidades, Nicomédia, Niceia, Prusa e Calcedônia, eram ricas e briguentas."
    - "O Novo Testamento a nomeia duas vezes. Na segunda viagem, Paulo e seus companheiros, impedidos de pregar na Ásia, chegaram à Mísia e “tentaram ir para a Bitínia, mas o Espírito não lhes permitiu”, e desceram a Trôade; dali passaram à Macedônia. Mesmo assim o Evangelho chegou lá: a primeira carta de Pedro é dirigida “aos eleitos que vivem como estrangeiros na Dispersão no Ponto, Galácia, Capadócia, Ásia e Bitínia”. Por volta de 112 d.C., Plínio, o Jovem, enviado por Trajano para governar a província, escreveu ao imperador que os cristãos ali eram muitos, em cidades e aldeias, de todas as idades e condições, que se reuniam antes do amanhecer para cantar um hino a Cristo como a um deus, e que os templos estavam quase desertos; perguntou como julgá-los, e a resposta de Trajano fixou a norma por décadas: não deviam ser procurados, nem se deviam aceitar acusações anônimas."
    - "Mais tarde a Bitínia esteve no centro do império. Diocleciano governou de Nicomédia, onde a Grande Perseguição começou em 303; Constantino convocou a Niceia o primeiro concílio geral em 325, e o quarto reuniu-se em Calcedônia em 451. Hoje a região é o noroeste da Turquia: Nicomédia é İzmit, Niceia é a cidade lacustre de İznik, com suas muralhas romanas, Prusa é Bursa, e Calcedônia é Kadıköy, um distrito de Istambul."
  de:
    - "Bithynien ist die nordwestliche Ecke Kleinasiens, das grüne, bewaldete Land am Schwarzen Meer und am Marmarameer, das Byzanz über den Bosporus hinweg gegenüberliegt. Ein thrakisches Volk gab ihm seinen Namen, und im 3. Jahrhundert v. Chr. machten seine Herrscher es zu einem hellenistischen Königreich: Nikomedes I. gründete um 264 v. Chr. Nikomedia als seine Hauptstadt, und Prusias I., der Hannibal seine letzte Zuflucht gewährte, erbaute Prusa am Fuß des Olymp. Nikomedes IV. vermachte das Königreich 74 v. Chr. Rom, und nach den Kriegen gegen Mithridates wurde es mit dem westlichen Teil von Pontus zur Provinz Bithynien und Pontus vereinigt. Seine Städte, Nikomedia, Nizäa, Prusa und Chalkedon, waren reich und streitsüchtig."
    - "Das Neue Testament nennt es zweimal. Auf der zweiten Reise kamen Paulus und seine Gefährten, in Asien am Predigen gehindert, nach Mysien und „versuchten sie, durch Bithynien zu reisen; und der Geist ließ es ihnen nicht zu“; sie zogen nach Troas und von dort nach Mazedonien. Dennoch erreichte es das Evangelium: Der erste Petrusbrief ist gerichtet „den erwählten Fremdlingen hin und her in Pontus, Galatien, Kappadozien, Asien und Bithynien“. Um 112 n. Chr. schrieb Plinius der Jüngere, von Trajan als Statthalter entsandt, die Christen seien dort zahlreich, in Stadt und Land, jeden Alters und Standes, sie versammelten sich vor Tagesanbruch, um Christus wie einem Gott einen Hymnus zu singen, und die Tempel seien fast verödet; er fragte nach dem Verfahren, und Trajans Antwort setzte für Jahrzehnte den Maßstab: Man solle sie nicht aufspüren und anonyme Anzeigen nicht annehmen."
    - "Später stand Bithynien im Zentrum des Reiches. Diokletian regierte von Nikomedia aus, wo 303 die Große Verfolgung begann; Konstantin berief 325 das erste allgemeine Konzil nach Nizäa, und das vierte tagte 451 in Chalkedon. Heute ist die Region der Nordwesten der Türkei: Nikomedia ist İzmit, Nizäa die Stadt İznik am See mit ihren römischen Mauern, Prusa ist Bursa, und Chalkedon ist Kadıköy, ein Stadtteil von Istanbul."
  fr:
    - "La Bithynie est le coin nord-ouest de l’Asie Mineure, pays vert et boisé le long de la mer Noire et de la mer de Marmara, face à Byzance de l’autre côté du Bosphore. Un peuple thrace lui donna son nom, et au IIIe siècle av. J.-C. ses souverains en firent un royaume hellénistique : Nicomède Ier fonda Nicomédie comme capitale vers 264 av. J.-C., et Prusias Ier, qui offrit à Hannibal son dernier refuge, bâtit Pruse au pied du mont Olympe. Nicomède IV légua le royaume à Rome en 74 av. J.-C., et après les guerres contre Mithridate il fut réuni à la partie occidentale du Pont pour former la province de Bithynie et Pont. Ses villes, Nicomédie, Nicée, Pruse et Chalcédoine, étaient riches et querelleuses."
    - "Le Nouveau Testament la nomme deux fois. Au second voyage, Paul et ses compagnons, empêchés de prêcher en Asie, arrivèrent près de la Mysie et « se disposaient à entrer en Bithynie ; mais l’Esprit de Jésus ne le leur permit pas », puis passèrent de Troas en Macédoine. L’Évangile y parvint pourtant : la première lettre de Pierre s’adresse « à ceux qui sont étrangers et dispersés dans le Pont, la Galatie, la Cappadoce, l’Asie et la Bithynie ». Vers 112 apr. J.-C., Pline le Jeune, gouverneur nommé par Trajan, lui écrivit que les chrétiens y abondaient en ville et au village, de tout âge et rang, qu’ils s’assemblaient avant l’aube pour chanter un hymne au Christ comme à un dieu, et que les temples étaient presque déserts ; il demanda comment les juger, et Trajan répondit en fixant la règle pour des décennies : ne pas les rechercher, ignorer les dénonciations anonymes."
    - "Plus tard, la Bithynie se trouva au centre de l’Empire. Dioclétien régna depuis Nicomédie, où commença la Grande Persécution en 303 ; Constantin convoqua à Nicée le premier concile général en 325, et le quatrième se réunit à Chalcédoine en 451. Aujourd’hui, la région est le nord-ouest de la Turquie : Nicomédie est İzmit, Nicée est la ville lacustre d’İznik avec ses murailles romaines, Pruse est Bursa, et Chalcédoine est Kadıköy, un quartier d’Istanbul."
  it:
    - "La Bitinia è l’angolo nord-occidentale dell’Asia Minore, la terra verde e boscosa lungo il Mar Nero e il Mar di Marmara, di fronte a Bisanzio al di là del Bosforo. Un popolo trace le diede il nome, e nel III secolo a.C. i suoi sovrani ne fecero un regno ellenistico: Nicomede I fondò Nicomedia come capitale intorno al 264 a.C., e Prusia I, che offrì ad Annibale l’ultimo rifugio, costruì Prusa ai piedi del Monte Olimpo. Nicomede IV lasciò il regno a Roma nel 74 a.C., e dopo le guerre contro Mitridate fu unito alla parte occidentale del Ponto come provincia di Bitinia e Ponto. Le sue città, Nicomedia, Nicea, Prusa e Calcedonia, erano ricche e litigiose."
    - "Il Nuovo Testamento la nomina due volte. Nel secondo viaggio Paolo e i compagni, impediti di predicare in Asia, giunsero in Misia e «tentavano d’andare in Bitinia; ma lo Spirito di Gesù non lo permise loro», e scesero a Troade, da dove passarono in Macedonia. Il Vangelo vi giunse comunque: la prima lettera di Pietro è indirizzata «agli eletti che vivono come forestieri nella dispersione del Ponto, della Galazia, della Cappadocia, dell’Asia e della Bitinia». Verso il 112 d.C. Plinio il Giovane, governatore inviato da Traiano, scrisse all’imperatore che i cristiani erano molti, in città e villaggi, di ogni età e condizione, che si riunivano prima dell’alba per cantare un inno a Cristo come a un dio, e che i templi erano rimasti quasi deserti; chiese come giudicarli, e la risposta di Traiano fissò la prassi per decenni: non cercarli, né ascoltare accuse anonime."
    - "Più tardi la Bitinia si trovò al centro dell’impero. Diocleziano governava da Nicomedia, dove nel 303 ebbe inizio la Grande Persecuzione; Costantino convocò a Nicea nel 325 il primo concilio generale, e il quarto si riunì a Calcedonia nel 451. Oggi la regione è la Turchia nord-occidentale: Nicomedia è İzmit, Nicea è la cittadina lacustre di İznik con le sue mura romane, Prusa è Bursa e Calcedonia è Kadıköy, un quartiere di Istanbul."
  pl:
    - "Bitynia to północno-zachodni kraniec Azji Mniejszej, zielona, zalesiona kraina wzdłuż Morza Czarnego i Morza Marmara, leżąca naprzeciw Bizancjum po drugiej stronie Bosforu. Nazwę nadał jej lud trakijski, a w III w. p.n.e. jej władcy uczynili z niej królestwo hellenistyczne: Nikomedes I założył Nikomedię jako stolicę około 264 r. p.n.e., a Prusjasz I, który dał Hannibalowi ostatnie schronienie, zbudował Prusę pod górą Olimp. Nikomedes IV zapisał królestwo Rzymowi w 74 r. p.n.e., a po wojnach z Mitrydatesem połączono je z zachodnią częścią Pontu w prowincję Bitynia i Pont. Jej miasta, Nikomedia, Nicea, Prusa i Chalcedon, były bogate i kłótliwe."
    - "Nowy Testament wymienia ją dwukrotnie. Podczas drugiej podróży Paweł i jego towarzysze, powstrzymani od głoszenia w Azji, przyszli do Myzji i „kusili się iść do Bitynii, ale im Duch Jezusowy nie dopuścił”, i zeszli zamiast tego do Troady, skąd przeprawili się do Macedonii. A jednak ewangelia dotarła tam mimo to: pierwszy list Piotra jest zaadresowany „przychodniom rozproszonym w Poncie, w Galacyi, w Kapadocyi, w Azji i w Bitynii”. Około 112 r. n.e. Pliniusz Młodszy, wysłany przez Trajana do zarządzania prowincją, pisał do cesarza, że chrześcijan jest tam wielu, w miastach i wsiach, w każdym wieku i stanie, że schodzą się przed świtem, by śpiewać hymn do Chrystusa jak do boga, i że świątynie niemal opustoszały; pytał, jak ich sądzić, a odpowiedź Trajana wyznaczyła wzór na dziesięciolecia: nie należało ich tropić ani wysłuchiwać anonimowych oskarżeń."
    - "Później Bitynia znalazła się w centrum cesarstwa. Dioklecjan rządził z Nikomedii, gdzie w 303 r. rozpoczęło się Wielkie Prześladowanie; Konstantyn zwołał pierwszy sobór powszechny do Nicei w 325 r., a czwarty obradował w Chalcedonie w 451 r. Dziś region ten to północno-zachodnia Turcja: Nikomedia to İzmit, Nicea to położone nad jeziorem miasto İznik z rzymskimi murami, Prusa to Bursa, a Chalcedon to Kadıköy, dzielnica Stambułu."
  nl:
    - "Bithynië is de noordwestelijke hoek van Klein-Azië, het groene, beboste land langs de Zwarte Zee en de Zee van Marmara, tegenover Byzantium aan de overkant van de Bosporus. Een Thracisch volk gaf het zijn naam, en in de 3e eeuw v.Chr. maakten zijn heersers er een hellenistisch koninkrijk van: Nicomedes I stichtte omstreeks 264 v.Chr. Nicomedia als hoofdstad, en Prusias I, die Hannibal zijn laatste toevlucht bood, bouwde Prusa aan de voet van de Olympus. Nicomedes IV liet het koninkrijk in 74 v.Chr. na aan Rome, en na de oorlogen met Mithridates werd het met het westelijke deel van Pontus verenigd tot de provincie Bithynië en Pontus. De steden ervan, Nicomedia, Nicea, Prusa en Chalcedon, waren rijk en twistziek."
    - "Het Nieuwe Testament noemt het tweemaal. Op de tweede reis kwamen Paulus en zijn gezellen, in Asia verhinderd te prediken, in Mysië en “poogden zij naar Bithynie te reizen; en de Geest liet het hun niet toe”; zij gingen af naar Troas en staken over naar Macedonië. Toch bereikte het evangelie het land: 1 Petrus is gericht “aan de vreemdelingen, verstrooid in Pontus, Galatie, Kappadocie, Azie en Bithynie”. Omstreeks 112 n.Chr. schreef Plinius de Jongere, door Trajanus als bestuurder gezonden, de keizer dat de christenen daar talrijk waren, in steden en dorpen, van elke leeftijd en stand, dat zij voor zonsopgang een lied voor Christus als voor een god zongen en dat de tempels bijna leeg stonden; hij vroeg hoe te oordelen, en Trajanus' antwoord bepaalde decennialang de norm: niet opsporen, anonieme aanklachten niet horen."
    - "Later stond Bithynië in het middelpunt van het rijk. Diocletianus regeerde vanuit Nicomedia, waar de Grote Vervolging in 303 begon; Constantijn riep het eerste algemene concilie bijeen te Nicea in 325, en het vierde kwam in 451 bijeen te Chalcedon. Tegenwoordig is het gebied het noordwesten van Turkije: Nicomedia is İzmit, Nicea is de stad İznik aan het meer met haar Romeinse muren, Prusa is Bursa, en Chalcedon is Kadıköy, een wijk van Istanbul."
  cs:
    - "Bithýnie je severozápadní cíp Malé Asie, zelená zalesněná země podél Černého moře a Marmarského moře, protilehlá Byzanci přes Bospor. Jméno jí dal thrácký národ a ve 3. století př. n. l. z ní její vládci učinili helénistické království: Nikomédés I. založil kolem roku 264 př. n. l. jako své hlavní město Nikomédii a Prusiás I., který poskytl Hannibalovi poslední útočiště, vystavěl Prusu pod Olympem. Nikomédés IV. odkázal království roku 74 př. n. l. Římu a po válkách s Mithridatem bylo spojeno se západní částí Pontu v provincii Bithýnie a Pontus. Její města Nikomédie, Níkaia, Prusa a Chalkédón byla bohatá a hašteřivá."
    - "Nový zákon ji jmenuje dvakrát. Na druhé cestě Pavel a jeho společníci, kterým bylo zabráněno kázat v Asii, přišli do Mýsie a „pokoušeli se jíti do Bitynie. Ale nedal jim Duch Ježíšův“, a sestoupili místo toho do Troady, odkud se přeplavili do Makedonie. Evangelium se však k ní přesto dostalo: první list Petrův je adresován „příchozím rozptýleným v Pontu, Galacii, Kappadocii, v Azii a v Bitynii“. Kolem roku 112 n. l. Plinius Mladší, vyslaný Traianem, aby provincii spravoval, napsal císaři, že křesťanů je tam mnoho, ve městech i na vesnicích, každého věku a stavu, že se scházejí před svítáním, aby zpívali Kristu hymnus jako bohu, a že chrámy byly téměř opuštěné; ptal se, jak je soudit, a Traianova odpověď určila vzor na desetiletí: nemají být vyhledáváni a anonymní udání nemají být vyslechnuta."
    - "Později stála Bithýnie ve středu říše. Diocletianus vládl z Nikomédie, kde roku 303 začalo Velké pronásledování; Konstantin svolal první všeobecný koncil do Níkaie roku 325 a čtvrtý zasedl v Chalkédónu roku 451. Dnes je oblast severozápadním Tureckem: Nikomédie je İzmit, Níkaia je jezerní městečko İznik s římskými hradbami, Prusa je Bursa a Chalkédón je Kadıköy, čtvrť Istanbulu."
  sv:
    - "Bitynien är nordvästra hörnet av Mindre Asien, det gröna, skogiga landet längs Svarta havet och Marmarasjön, mittemot Bysantion tvärs över Bosporen. Ett thrakiskt folk gav det dess namn, och på 200-talet f.Kr. gjorde dess härskare det till ett hellenistiskt kungarike: Nikomedes I grundade Nikomedeia som sin huvudstad omkring 264 f.Kr., och Prusias I, som gav Hannibal hans sista tillflykt, byggde Prusa vid berget Olympen. Nikomedes IV testamenterade riket till Rom 74 f.Kr., och efter krigen mot Mithridates förenades det med västra Pontos som provinsen Bithynia et Pontus. Dess städer, Nikomedeia, Nikaia, Prusa och Chalkedon, var rika och stridslystna."
    - "Nya testamentet nämner det två gånger. På andra resan kom Paulus och hans följeslagare, hindrade från att predika i Asien, fram till Mysien och ”försökte … att fara in i Bitynien, men Jesu Ande tillstadde dem det icke”, och gick i stället ner till Troas, varifrån de for över till Makedonien. Ändå nådde evangeliet dit: Första Petrusbrevet är ställt till ”de utvalda främlingar som bo kringspridda i Pontus, Galatien, Kappadocien, provinsen Asien och Bitynien”. Omkring 112 e.Kr. skrev Plinius den yngre, Trajanus ståthållare där, till kejsaren att de kristna där var många, i städer och byar, i alla åldrar och stånd, att de före gryningen samlades och sjöng en hymn till Kristus som till en gud, och att templen nästan stod tomma; han frågade hur de skulle dömas, och Trajanus svar blev norm i decennier: de skulle inte efterforskas, och anonyma angivelser skulle inte tas emot."
    - "Senare stod Bitynien i rikets mitt. Diocletianus regerade från Nikomedeia, där den stora förföljelsen inleddes 303; Konstantin sammankallade det första ekumeniska konciliet till Nicaea 325, och det fjärde hölls i Chalkedon 451. I dag är området nordvästra Turkiet: Nikomedeia är İzmit, Nicaea är sjöstaden İznik med sina romerska murar, Prusa är Bursa, och Chalkedon är Kadıköy, en stadsdel i Istanbul."
  nb:
    - "Bitynia er det nordvestlige hjørnet av Lilleasia, det grønne, skogkledde landet langs Svartehavet og Marmarahavet, med Bysants på den andre siden av Bosporos. Et thrakisk folk gav det navnet, og på 200-tallet f.Kr. gjorde herskerne det til et hellenistisk kongerike: Nikomedes I grunnla Nikomedia som hovedstad omkring 264 f.Kr., og Prusias I, som gav Hannibal hans siste tilflukt, bygde Prusa under Olympos. Nikomedes IV testamenterte riket til Roma i 74 f.Kr., og etter krigene mot Mithridates ble det slått sammen med den vestlige delen av Pontos som provinsen Bitynia og Pontos. Byene, Nikomedia, Nikea, Prusa og Kalkedon, var rike og trettekjære."
    - "Det nye testamente nevner det to ganger. På den andre reisen kom Paulus og hans følge, som var hindret fra å tale i Asia, til Mysia og prøvde «på å fare til Bitynia, men Jesu Ånd gav dem ikke lov», og drog i stedet ned til Troas, hvorfra de krysset til Makedonia. Likevel nådde evangeliet det: Peters første brev er stilet «til de utlendinger som er spredt omkring i Pontus, Galatia, Kappadokia, Asia og Bitynia». Omkring 112 e.Kr. skrev Plinius den yngre, sendt av Trajan for å styre provinsen, til keiseren at de kristne der var mange, i byer og landsbyer, av alle aldre og stand, at de møttes før daggry for å synge en hymne til Kristus som til en gud, og at tempelene nesten var forlatt; han spurte hvordan han skulle dømme dem, og Trajans svar satte mønsteret for flere tiår: de skulle ikke oppsøkes, og anonyme anklager skulle ikke høres."
    - "Senere sto Bitynia i imperiets sentrum. Diokletian regjerte fra Nikomedia, der den store forfølgelsen begynte i 303; Konstantin kalte det første allmenne kirkemøtet sammen i Nikea i 325, og det fjerde ble holdt i Kalkedon i 451. I dag er regionen nordvestlige Tyrkia: Nikomedia er İzmit, Nikea er byen İznik ved sjøen med sine romerske murer, Prusa er Bursa, og Kalkedon er Kadıköy, en bydel i Istanbul."
  tl:
    - "Ang Bitinia ay ang hilagang-kanlurang sulok ng Asia Menor, ang luntian at makahoy na lupain sa tabi ng Dagat Itim at ng Dagat ng Marmara, nakaharap sa Bizancio sa kabila ng Bosforo. Ang isang bayang Tracio ang nagbigay ng pangalan nito, at noong ika-3 siglo BK ginawa ito ng mga pinuno nito na kahariang Helenistiko: itinatag ni Nicomedes I ang Nicomedia bilang kabisera noong mga 264 BK, at itinayo ni Prusias I, na nagbigay kay Hannibal ng huli niyang kanlungan, ang Prusa sa ilalim ng Bundok Olimpo. Iniwan ni Nicomedes IV ang kaharian sa Roma noong 74 BK, at pagkatapos ng mga digmaan kay Mitridates ay pinagsama ito sa kanlurang bahagi ng Ponto bilang lalawigang Bitinia at Ponto. Mayaman at palaaway ang mga lungsod nito: Nicomedia, Nicaea, Prusa at Calcedonia."
    - "Dalawang ulit itong nasa Bagong Tipan. Sa ikalawang paglalakbay, sina Pablo, na pinigilang mangaral sa Asia, ay dumating sa Misia at “pinagsikapan nilang magsipasok sa Bitinia; at hindi sila tinulutan ng Espiritu ni Jesus”, at bumaba sa Troas, patungong Macedonia. Naabot din ito ng ebanghelyo: ang unang liham ni Pedro ay para “sa mga hinirang na nangingibang bayan na nasa Pangangalat sa Ponto, Galacia, Capadocia, Asia at Bitinia”. Noong mga 112 AD, isinulat ni Plinio na Nakababata, na isinugo ni Trajano, na marami roon ang mga Kristiyano, sa bayan at nayon, sa lahat ng edad at antas, na nagtitipon bago mag-umaga upang umawit kay Kristo na parang sa diyos, at halos walang tao sa mga templo; itinanong niya kung paano sila lilitisin, at ang sagot ni Trajano ang naging patakaran sa loob ng mga dekada: hindi sila hahanapin ni pakikinggan ang di-pirmadong paratang."
    - "Nang maglaon ang Bitinia ay nasa gitna ng imperyo. Namahala si Diocleciano mula sa Nicomedia, kung saan nagsimula ang Dakilang Pag-uusig noong 303; tinawag ni Constantino ang unang pangkalahatang konsilyo sa Nicaea noong 325, at ang ikaapat ay nagpulong sa Calcedonia noong 451. Ngayon ang rehiyon ay hilagang-kanlurang Turkey: ang Nicomedia ay İzmit, ang Nicaea ay ang bayang nasa tabi ng lawa na İznik na may mga pader nitong Romano, ang Prusa ay Bursa, at ang Calcedonia ay Kadıköy, isang distrito ng Istanbul."
  da:
    - "Bithynien er det nordvestlige hjørne af Lilleasien, det grønne, skovrige land langs Sortehavet og Marmarahavet, over for Byzans på den anden side af Bosporus. Et thrakisk folk gav det navn, og i 200-tallet f.Kr. gjorde dets herskere det til et hellenistisk kongedømme: Nikomedes 1. grundlagde Nikomedia som sin hovedstad omkring 264 f.Kr., og Prusias 1., der gav Hannibal hans sidste tilflugt, byggede Prusa under bjerget Olympos. Nikomedes 4. efterlod kongeriget til Rom i 74 f.Kr., og efter krigene med Mithridates blev det sammen med den vestlige del af Pontus forenet som provinsen Bithynien og Pontus. Dets byer, Nikomedia, Nikæa, Prusa og Chalkedon, var rige og stridslystne."
    - "Det Nye Testamente nævner det to gange. På den anden rejse kom Paulus og hans ledsagere, hindret i at prædike i Asia, til Mysien og forsøgte »at drage til Bithynien; og Jesu Aand tilstedte dem det ikke«, og de drog i stedet ned til Troas, hvorfra de satte over til Makedonien. Alligevel nåede evangeliet dertil: Første Petersbrev er stilet »til Udlændingene i Adspredelse i Pontus, Galatien, Kappadokien, Asien og Bithynien«. Omkring 112 e.Kr. skrev Plinius den Yngre, sendt af Trajan for at styre provinsen, til kejseren, at de kristne dér var mange, i byer og landsbyer, i alle aldre og af alle stande, at de mødtes før daggry for at synge en hymne til Kristus som til en gud, og at templerne næsten var forladte; han spurgte, hvordan han skulle dømme dem, og Trajans svar satte mønsteret i årtier: De skulle ikke opspores, og anonyme anklager skulle ikke høres."
    - "Senere stod Bithynien i rigets centrum. Diokletian herskede fra Nikomedia, hvor den store forfølgelse begyndte i 303; Konstantin sammenkaldte det første almindelige koncil til Nikæa i 325, og det fjerde mødtes i Chalkedon i 451. I dag er egnen det nordvestlige Tyrkiet: Nikomedia er İzmit, Nikæa er søbyen İznik med sine romerske mure, Prusa er Bursa, og Chalkedon er Kadıköy, en bydel i Istanbul."
  sr:
    - "Витинија је северозападни угао Мале Азије, зелена, шумовита земља уз Црно море и Мраморно море, насупрот Византиону преко Босфора. Име јој је дао један трачки народ, а у 3. веку п. н. е. њени владари начинили су од ње хеленистичко краљевство: Никомед I основао је Никомедију као своју престоницу око 264. п. н. е., а Прузија I, који је Ханибалу дао последње уточиште, саградио је Прусу под планином Олимп. Никомед IV оставио је краљевство Риму 74. п. н. е., а после ратова с Митридатом спојено је са западним делом Понта у провинцију Витинију и Понт. Њени градови, Никомедија, Никеја, Пруса и Халкидон, били су богати и свадљиви."
    - "Нови завет је помиње двапут. На другом путовању Павле и његови сапутници, спречени да проповедају у Азији, дошли су у Мисију и „хтеше да иду у Витинију, и Дух не даде“, па су уместо тога сишли у Троаду, одакле су прешли у Македонију. Па ипак је јеванђеље и до ње стигло: прва Петрова посланица упућена је „избраним дошљацима, расејаним по Понту, Галатији, Кападокији, Азији и Витанији“. Око 112. н. е. Плиније Млађи, кога је Трајан послао да управља провинцијом, писао је цару да је тамо хришћана много, у градовима и селима, сваког узраста и положаја, да се састају пред зору да Христу певају химну као богу и да су храмови готово опустели; питао је како да им суди, а Трајанов одговор одредио је узор за деценије: не треба их тражити, нити саслушавати анонимне оптужбе."
    - "Касније је Витинија стајала у средишту царства. Диоклецијан је владао из Никомедије, где је 303. почело Велико гоњење; Константин је први општи сабор сазвао у Никеју 325, а четврти је заседао у Халкидону 451. Данас је та област северозападна Турска: Никомедија је Измит, Никеја је градић Изник на језеру са својим римским зидинама, Пруса је Бурса, а Халкидон је Кадикеј, четврт Истанбула."
  hu:
    - "Bithünia Kis-Ázsia északnyugati sarka, a Fekete-tenger és a Márvány-tenger menti zöld, erdős vidék, amely a Boszporusz túlpartján Bizánccal néz szembe. Egy trák nép adta a nevét, és a Kr. e. 3. században uralkodói hellénisztikus királysággá tették: I. Nikomédész Kr. e. 264 körül megalapította fővárosát, Nikomédeiát, I. Prúszijasz pedig, aki Hannibálnak adott utolsó menedéket, felépítette Pruszát az Olümposz-hegy alatt. IV. Nikomédész Kr. e. 74-ben Rómára hagyta a királyságot, és a Mithridatész elleni háborúk után Pontus nyugati részével egyesítették Bithünia és Pontus tartományként. Városai, Nikomédeia, Nikaia, Prusza és Khalkédón gazdagok és perlekedők voltak."
    - "Az Újszövetség kétszer nevezi meg. A második úton Pál és társai, miután eltiltattak, hogy Ázsiában hirdessék az igét, Müsiába jutottak, és „igyekeznek vala Bithiniába jutni; de nem ereszté őket a Lélek”, ezért lementek Troászba, ahonnan átkeltek Macedóniába. Az evangélium mégis eljutott: Péter első levelét „a Pontusban, Galátziában, Kappadóciában, Ázsiában és Bithiniában elszéledt jövevényeknek” címzik. Kr. u. 112 körül ifjabb Plinius, akit Traianus küldött a tartomány kormányzására, azt írta a császárnak, hogy ott sok a keresztény, városokban és falvakban, minden korból és rangból, hogy hajnal előtt összegyűlnek, és Krisztusnak mint istennek himnuszt énekelnek, és hogy a templomok majdnem elnéptelenedtek; megkérdezte, hogyan ítélje meg őket, és Traianus válasza évtizedekre megszabta a mintát: nem kell őket felkutatni, és névtelen vádaskodást nem szabad meghallgatni."
    - "Később Bithünia a birodalom középpontjában állt. Diocletianus Nikomédeiából uralkodott, ahol Kr. u. 303-ban megkezdődött a nagy keresztényüldözés; Nagy Konstantin 325-ben Nikaiába hívta össze az első egyetemes zsinatot, a negyedik pedig 451-ben Khalkédónban ülésezett. A vidék ma Törökország északnyugati része: Nikomédeia İzmit, Nikaia a tóparti İznik városa római falaival, Prusza Bursa, Khalkédón pedig Kadıköy, Isztambul egyik kerülete."
  fi:
    - "Bitynia on Vähän-Aasian luoteiskulma, vihreä metsäinen maa Mustanmeren ja Marmaranmeren rannalla, Bosporinsalmen toisella puolella Bysanttia vastapäätä. Traakialainen kansa antoi sille nimen, ja 200-luvulla eaa. sen hallitsijat tekivät siitä hellenistisen kuningaskunnan: Nikomedes I perusti Nikomedian pääkaupungikseen noin vuonna 264 eaa., ja Prusias I, joka antoi Hannibalille tämän viimeisen turvapaikan, rakensi Prusan Olympos-vuoren juurelle. Nikomedes IV jätti kuningaskunnan Roomalle vuonna 74 eaa., ja Mithridateen sotien jälkeen se liitettiin Pontoksen läntiseen osaan Bityniaksi ja Pontokseksi kutsutuksi maakunnaksi. Sen kaupungit, Nikomedia, Nikaia, Prusa ja Kalkedon, olivat rikkaita ja riidanhaluisia."
    - "Uusi testamentti mainitsee sen kahdesti. Toisella matkallaan Paavali seuralaisineen, joiden oli estetty saarnaamasta Aasiassa, tulivat Mysiaan ja ”yrittivät lähteä Bityniaan, mutta Jeesuksen Henki ei sallinut heidän sitä tehdä”, ja jatkoivat Troasin kautta Makedoniaan. Silti evankeliumi tavoitti sen: Pietarin 1. kirje on osoitettu ”valituille muukalaisille, jotka asuvat hajallaan Pontossa, Galatiassa, Kappadokiassa, Aasiassa ja Bityniassa”. Noin 112 jaa. Plinius nuorempi, Trajanuksen lähettämä maaherra, kirjoitti keisarille, että kristittyjä oli paljon kaupungeissa ja kylissä, kaikenikäisiä ja -säätyisiä, että he kokoontuivat ennen aamua laulamaan virren Kristukselle kuin jumalalle ja että temppelit olivat lähes autioituneet; hän kysyi, miten heitä tuomitaan, ja Trajanuksen vastaus loi mallin vuosikymmeniksi: heitä ei pidä etsiä eikä nimettömiä syytöksiä kuulla."
    - "Myöhemmin Bitynia oli valtakunnan keskuksessa. Diocletianus hallitsi Nikomediasta, jossa suuri vaino alkoi vuonna 303; Konstantinus kutsui ensimmäisen yleisen kirkolliskokouksen koolle Nikaiaan vuonna 325, ja neljäs pidettiin Kalkedonissa vuonna 451. Nykyisin alue on Luoteis-Turkkia: Nikomedia on İzmit, Nikaia on järvenrantakaupunki İznik roomalaisine muureineen, Prusa on Bursa ja Kalkedon on Kadıköy, Istanbulin kaupunginosa."
  vi:
    - "Bi-thi-ni là góc tây bắc của Tiểu Á, vùng đất xanh tươi nhiều rừng dọc Biển Đen và Biển Marmara, đối diện Byzantium qua eo Bosporus. Một dân tộc Thrace đã đặt tên cho nó, và vào thế kỷ 3 TCN các vua của nó biến nó thành một vương quốc Hy Lạp hóa: Nicomedes I lập Nicomedia làm kinh đô khoảng năm 264 TCN, và Prusias I, người cho Hannibal nơi ẩn náu cuối cùng, xây Prusa dưới chân núi Olympus. Nicomedes IV để lại vương quốc cho Rô-ma năm 74 TCN, và sau các cuộc chiến với Mithridates, nó được nhập với phần phía tây của Bông thành tỉnh Bi-thi-ni và Bông. Các thành của nó, Nicomedia, Nicaea, Prusa và Chalcedon, giàu có và hay cãi vã."
    - "Tân Ước nêu tên nó hai lần. Trong chuyến hành trình thứ hai, Phao-lô và các bạn đồng hành, bị ngăn không được truyền đạo ở A-si, đến My-si và “sắm sửa vào xứ Bi-thi-ni; nhưng Thánh Linh của Đức Chúa Jêsus không cho phép”, nên đi xuống Trô-ách, rồi từ đó sang Ma-xê-đoan. Dẫu vậy, Phúc Âm vẫn đến được nơi đó: thư thứ nhất của Phi-e-rơ được gửi “cho những người kiều ngụ rải rác trong xứ Bông, Ga-la-ti, Cáp-ba-đốc, A-si và Bi-thi-ni”. Khoảng năm 112, Plinius Trẻ, được Trajanus sai đến cai trị tỉnh, viết cho hoàng đế rằng người Cơ Đốc ở đó rất đông, ở thành thị lẫn làng mạc, đủ mọi tuổi và địa vị, họ họp trước bình minh để hát một bài thánh ca cho Đấng Christ như cho một vị thần, và các đền thờ gần như vắng người; ông hỏi cách xét xử họ, và hồi đáp của Trajanus định khuôn mẫu nhiều thập niên: không truy lùng họ, không nghe tố cáo nặc danh."
    - "Về sau Bi-thi-ni nằm ở trung tâm của đế quốc. Diocletianus cai trị từ Nicomedia, nơi cuộc Đại Bách hại bắt đầu năm 303; Constantinus triệu tập công đồng chung đầu tiên đến Nicaea năm 325, và công đồng thứ tư họp tại Chalcedon năm 451. Ngày nay vùng này là tây bắc Thổ Nhĩ Kỳ: Nicomedia là İzmit, Nicaea là thị trấn bên hồ İznik với các tường thành La Mã, Prusa là Bursa, và Chalcedon là Kadıköy, một quận của Istanbul."
  ro:
    - "Bitinia este colțul de nord-vest al Asiei Mici, ținutul verde și împădurit de-a lungul Mării Negre și al Mării Marmara, față în față cu Bizanțul, de cealaltă parte a Bosforului. Un popor tracic i-a dat numele, iar în secolul al III-lea î.Hr. conducătorii ei au făcut din ea un regat elenistic: Nicomede I a întemeiat Nicomedia ca reședință pe la 264 î.Hr., iar Prusias I, care i-a dat lui Hannibal ultimul adăpost, a zidit Prusa la poalele Muntelui Olimp. Nicomede al IV-lea a lăsat regatul Romei în 74 î.Hr., iar după războaiele cu Mitridate a fost unită cu partea de vest a Pontului ca provincia Bitinia și Pont. Cetățile ei, Nicomedia, Nicaea, Prusa și Calcedon, erau bogate și certărețe."
    - "Noul Testament o numește de două ori. În a doua călătorie, Pavel și tovarășii săi, opriți să predice în Asia, au ajuns în Misia și „se ispitiau a merge spre Vitinia; și nu i-a lăsat pre ei Duhul”, și au coborât în schimb la Troa, de unde au trecut în Macedonia. Totuși Evanghelia a ajuns și acolo: prima epistolă a lui Petru este adresată „nemernicilor celor aleși ai risipirei Pontului, Galatiei, Capadochiei, Asiei și Vitiniei”. Pe la 112 d.Hr., Pliniu cel Tânăr, trimis de Traian să guverneze provincia, i-a scris împăratului că acolo creștinii erau mulți, în orașe și în sate, de orice vârstă și rang, că se adunau înainte de ivirea zorilor ca să cânte un imn lui Hristos ca unui zeu și că templele rămăseseră aproape pustii; el a întrebat cum să-i judece, iar răspunsul lui Traian a stabilit modelul pentru decenii: nu trebuiau căutați și nu se primeau învinuiri anonime."
    - "Mai târziu, Bitinia s-a aflat în centrul imperiului. Dioclețian a domnit de la Nicomedia, unde Marea Persecuție a început în 303; Constantin a convocat primul sinod general la Nicaea, în 325, iar al patrulea s-a ținut la Calcedon, în 451. Astăzi regiunea este nord-vestul Turciei: Nicomedia este İzmit, Nicaea este orașul de pe malul lacului İznik, cu zidurile lui romane, Prusa este Bursa, iar Calcedon este Kadıköy, un cartier al Istanbulului."
  bg:
    - "Витиния е северозападният ъгъл на Мала Азия, зелената, гориста земя покрай Черно и Мраморно море, срещу Византион отвъд Босфора. Тракийски народ ѝ дал името, а през III в. пр.н.е. владетелите ѝ я превърнали в елинистическо царство: Никомед I основал Никомедия като своя столица около 264 г. пр.н.е., а Прусий I, който дал на Ханибал последното му убежище, съградил Пруса под планината Олимп. Никомед IV завещал царството на Рим през 74 г. пр.н.е., а след войните с Митридат то било съединено със западната част на Понт в провинция Витиния и Понт. Нейните градове, Никомедия, Никея, Пруса и Халкидон, били богати и свадливи."
    - "Новият завет я назовава два пъти. При второто пътуване Павел и спътниците му, възпрени да проповядват в Азия, стигнали до Мизия и „предприемаха да идат във Витиния; но Духът не им допусти“, и слезли в Троада, откъдето преминали в Македония. И все пак благовестието стигнало и там: Първото послание на Петър е до „преселниците които са пръснати по Понт, по Галатия, по Кападокия, по Азия и по Витиния“. Около 112 г. н.е. Плиний Млади, пратен от Траян да управлява провинцията, писал на императора, че християните там са много, в градове и села, от всяка възраст и звание, че се събират преди зазоряване да пеят химн на Христос като на бог и че храмовете почти запустели; той питал как да ги съди, а отговорът на Траян станал образец за десетилетия: да не бъдат издирвани, нито да се приемат анонимни обвинения."
    - "По-късно Витиния се оказала в средището на империята. Диоклетиан управлявал от Никомедия, където през 303 г. започнало Голямото гонение; Константин свикал първия Вселенски събор в Никея през 325 г., а четвъртият се събрал в Халкидон през 451 г. Днес областта е северозападна Турция: Никомедия е Измит, Никея е крайезерното градче Изник с римските му стени, Пруса е Бурса, а Халкидон е Кадъкьой, район на Истанбул."
