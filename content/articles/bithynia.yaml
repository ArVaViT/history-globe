# Overview article (ADR 0007). Mainstream facts only; a Roman province named twice in the New Testament; Pliny's letter on the Christians is the main outside witness.
id: bithynia
place: a5c0cb0
title:
  en: "Bithynia"
  ru: "Вифиния"
  uk: "Віфінія"
  es: "Bitinia"
  pt: "Bitínia"
  de: "Bithynien"
  fr: "Bithynie"
body:
  en:
    - "Bithynia is the north-western corner of Asia Minor, the green, wooded land along the Black Sea and the Sea of Marmara, facing Byzantium across the Bosporus. A Thracian people gave it its name, and in the third century BC its rulers made it a Hellenistic kingdom: Nicomedes I founded Nicomedia as his capital about 264 BC, and Prusias I, who gave Hannibal his last refuge, built Prusa under Mount Olympus. Nicomedes IV left the kingdom to Rome in 74 BC, and after the wars with Mithridates it was joined with the western part of Pontus as the province of Bithynia and Pontus. Its cities, Nicomedia, Nicaea, Prusa and Chalcedon, were rich and quarrelsome."
    - "The New Testament names it twice. On the second journey Paul and his companions, kept from preaching in Asia, came to Mysia and “assayed to go into Bithynia: but the Spirit suffered them not”, and went down to Troas instead, whence they crossed to Macedonia. Yet the gospel reached it all the same: the first letter of Peter is addressed “to the strangers scattered throughout Pontus, Galatia, Cappadocia, Asia, and Bithynia”. About AD 112 Pliny the Younger, sent by Trajan to govern the province, wrote to the emperor that the Christians there were many, in towns and villages, of every age and rank, that they met before dawn to sing a hymn to Christ as to a god, and that the temples had been almost deserted; he asked how to try them, and Trajan's reply set the pattern for decades: they were not to be sought out, nor anonymous accusations heard."
    - "Later Bithynia stood at the centre of the empire. Diocletian ruled from Nicomedia, where the Great Persecution began in 303; Constantine summoned the first general council to Nicaea in 325, and the fourth met at Chalcedon in 451. Today the region is north-western Turkey: Nicomedia is İzmit, Nicaea is the lakeside town of İznik with its Roman walls, Prusa is Bursa, and Chalcedon is Kadıköy, a district of Istanbul."
  ru:
    - "Вифиния — северо-западный угол Малой Азии, зелёная лесистая земля вдоль Чёрного и Мраморного морей, обращённая к Византию через Босфор. Имя ей дал фракийский народ, а в III веке до н. э. её правители сделали её эллинистическим царством: Никомед I около 264 г. до н. э. основал свою столицу Никомидию, а Прусий I, давший Ганнибалу последнее убежище, построил Прусу у подножия горы Олимп. Никомед IV завещал царство Риму в 74 г. до н. э., и после войн с Митридатом его соединили с западной частью Понта в провинцию Вифиния и Понт. Её города — Никомидия, Никея, Пруса и Халкидон — были богаты и вечно спорили между собой."
    - "Новый Завет называет её дважды. Во втором путешествии Павел и его спутники, не допущенные проповедовать в Асии, «дойдя до Мисии, предпринимали идти в Вифинию; но Дух не допустил их», и они сошли в Троаду, откуда переправились в Македонию. И всё же Евангелие дошло и туда: первое послание Петра обращено к «пришельцам, рассеянным в Понте, Галатии, Каппадокии, Асии и Вифинии». Около 112 г. н. э. Плиний Младший, посланный Траяном управлять провинцией, писал императору, что христиан там много, в городах и сёлах, всякого возраста и звания, что они собираются до рассвета петь гимн Христу как Богу и что храмы почти опустели; он спрашивал, как их судить, и ответ Траяна на десятилетия стал правилом: не разыскивать их и не принимать безымянных доносов."
    - "Позже Вифиния оказалась в средоточии империи. Диоклетиан правил из Никомидии, где в 303 году началось Великое гонение; Константин созвал первый Вселенский собор в Никею в 325 году, а четвёртый собрался в Халкидоне в 451 году. Сегодня это северо-запад Турции: Никомидия — Измит, Никея — городок Изник на берегу озера с римскими стенами, Пруса — Бурса, а Халкидон — Кадыкёй, район Стамбула."
  uk:
    - "Віфінія — північно-західний куток Малої Азії, зелена лісиста земля вздовж Чорного моря та Мармурового моря, що дивиться на Візантій через Боспор. Назву їй дав фракійський народ, а в III ст. до н. е. її правителі зробили її елліністичним царством: Нікомед I заснував Нікомедію як свою столицю близько 264 р. до н. е., а Прусій I, який дав Ганнібалові останній притулок, збудував Прусу під горою Олімп. Нікомед IV залишив царство Риму в 74 р. до н. е., і після воєн із Мітрідатом його поєднали із західною частиною Понту в провінцію Віфінія і Понт. Її міста — Нікомедія, Нікея, Пруса й Халкедон — були багаті й сварливі."
    - "Новий Заповіт згадує її двічі. Під час другої подорожі Павло з товаришами, яким завадили проповідувати в Азії, дійшли до Місії та «поривались ійти в Витинию, і не пустив їх Дух», і зійшли натомість до Троади, звідки перепливли до Македонії. Проте євангелія все одно дійшло до неї: перший лист Петра адресований «вибраним захожанам розсїяння по Понту, Галатиї, Кападокиї, Азиї і Витиниї». Близько 112 р. н. е. Пліній Молодший, посланий Траяном управляти провінцією, писав імператорові, що християн там багато, у містах і селах, будь-якого віку й стану, що вони збираються до світанку, щоб співати гімн Христові як богові, і що храми майже опустіли; він питав, як їх судити, і відповідь Траяна на десятиліття задала зразок: їх не слід розшукувати, а анонімних доносів не слід вислуховувати."
    - "Пізніше Віфінія опинилася в центрі імперії. Діоклетіан правив із Нікомедії, де в 303 р. почалося Велике гоніння; Константин скликав перший вселенський собор до Нікеї в 325 р., а четвертий відбувся в Халкедоні в 451 р. Сьогодні цей регіон — північно-західна Туреччина: Нікомедія — це Ізміт, Нікея — озерне містечко Ізнік із римськими мурами, Пруса — Бурса, а Халкедон — Кадикьой, район Стамбула."
  es:
    - "Bitinia es el rincón noroccidental de Asia Menor, la tierra verde y boscosa que se extiende a lo largo del mar Negro y del mar de Mármara, frente a Bizancio al otro lado del Bósforo. Un pueblo tracio le dio su nombre, y en el siglo III a. C. sus gobernantes la convirtieron en un reino helenístico: Nicomedes I fundó Nicomedia como su capital hacia el 264 a. C., y Prusias I, que dio a Aníbal su último refugio, construyó Prusa al pie del monte Olimpo. Nicomedes IV legó el reino a Roma en el 74 a. C., y tras las guerras con Mitrídates quedó unido a la parte occidental del Ponto como provincia de Bitinia y Ponto. Sus ciudades, Nicomedia, Nicea, Prusa y Calcedonia, eran ricas y pendencieras."
    - "El Nuevo Testamento la nombra dos veces. En el segundo viaje, Pablo y sus compañeros, impedidos de predicar en Asia, llegaron a Misia y «tentaron de ir á Bithynia; mas el Espíritu no les dejó», y descendieron a Troas, desde donde pasaron a Macedonia. Con todo, el Evangelio llegó: la primera carta de Pedro está dirigida «á los extranjeros esparcidos en Ponto, en Galacia, en Capadocia, en Asia, y en Bithinia». Hacia el 112 d. C. Plinio el Joven, enviado por Trajano a gobernar la provincia, escribió al emperador que los cristianos de allí eran numerosos, en ciudades y aldeas, de toda edad y condición, que se reunían antes del amanecer para cantar un himno a Cristo como a un dios, y que los templos habían quedado casi desiertos; preguntó cómo juzgarlos, y la respuesta de Trajano marcó la pauta durante décadas: no buscarlos ni admitir acusaciones anónimas."
    - "Más tarde Bitinia estuvo en el centro del Imperio. Diocleciano gobernó desde Nicomedia, donde comenzó la Gran Persecución en el 303; Constantino convocó el primer concilio general en Nicea en el 325, y el cuarto se reunió en Calcedonia en el 451. Hoy la región es el noroeste de Turquía: Nicomedia es İzmit, Nicea es la ciudad lacustre de İznik con sus murallas romanas, Prusa es Bursa, y Calcedonia es Kadıköy, un distrito de Estambul."
  pt:
    - "A Bitínia é o canto noroeste da Ásia Menor, terra verde e arborizada ao longo do Mar Negro e do Mar de Mármara, defronte de Bizâncio, do outro lado do Bósforo. Um povo trácio lhe deu o nome, e no século III a.C. seus governantes fizeram dela um reino helenístico: Nicomedes I fundou Nicomédia como capital por volta de 264 a.C., e Prúsias I, que deu a Aníbal seu último refúgio, construiu Prusa ao pé do monte Olimpo. Nicomedes IV legou o reino a Roma em 74 a.C., e depois das guerras contra Mitrídates ele foi unido à parte ocidental do Ponto como a província da Bitínia e Ponto. Suas cidades, Nicomédia, Niceia, Prusa e Calcedônia, eram ricas e briguentas."
    - "O Novo Testamento a nomeia duas vezes. Na segunda viagem, Paulo e seus companheiros, impedidos de pregar na Ásia, chegaram à Mísia e “tentaram ir para a Bitínia, mas o Espírito não lhes permitiu”, e desceram a Trôade; dali passaram à Macedônia. Mesmo assim o Evangelho chegou lá: a primeira carta de Pedro é dirigida “aos eleitos que vivem como estrangeiros na Dispersão no Ponto, Galácia, Capadócia, Ásia e Bitínia”. Por volta de 112 d.C., Plínio, o Jovem, enviado por Trajano para governar a província, escreveu ao imperador que os cristãos ali eram muitos, em cidades e aldeias, de todas as idades e condições, que se reuniam antes do amanhecer para cantar um hino a Cristo como a um deus, e que os templos estavam quase desertos; perguntou como julgá-los, e a resposta de Trajano fixou a norma por décadas: não deviam ser procurados, nem se deviam aceitar acusações anônimas."
    - "Mais tarde a Bitínia esteve no centro do império. Diocleciano governou de Nicomédia, onde a Grande Perseguição começou em 303; Constantino convocou a Niceia o primeiro concílio geral em 325, e o quarto reuniu-se em Calcedônia em 451. Hoje a região é o noroeste da Turquia: Nicomédia é İzmit, Niceia é a cidade lacustre de İznik, com suas muralhas romanas, Prusa é Bursa, e Calcedônia é Kadıköy, um distrito de Istambul."
  de:
    - "Bithynien ist die nordwestliche Ecke Kleinasiens, das grüne, bewaldete Land am Schwarzen Meer und am Marmarameer, das Byzanz über den Bosporus hinweg gegenüberliegt. Ein thrakisches Volk gab ihm seinen Namen, und im 3. Jahrhundert v. Chr. machten seine Herrscher es zu einem hellenistischen Königreich: Nikomedes I. gründete um 264 v. Chr. Nikomedia als seine Hauptstadt, und Prusias I., der Hannibal seine letzte Zuflucht gewährte, erbaute Prusa am Fuß des Olymp. Nikomedes IV. vermachte das Königreich 74 v. Chr. Rom, und nach den Kriegen gegen Mithridates wurde es mit dem westlichen Teil von Pontus zur Provinz Bithynien und Pontus vereinigt. Seine Städte, Nikomedia, Nizäa, Prusa und Chalkedon, waren reich und streitsüchtig."
    - "Das Neue Testament nennt es zweimal. Auf der zweiten Reise kamen Paulus und seine Gefährten, in Asien am Predigen gehindert, nach Mysien und „versuchten sie, durch Bithynien zu reisen; und der Geist ließ es ihnen nicht zu“; sie zogen nach Troas und von dort nach Mazedonien. Dennoch erreichte es das Evangelium: Der erste Petrusbrief ist gerichtet „den erwählten Fremdlingen hin und her in Pontus, Galatien, Kappadozien, Asien und Bithynien“. Um 112 n. Chr. schrieb Plinius der Jüngere, von Trajan als Statthalter entsandt, die Christen seien dort zahlreich, in Stadt und Land, jeden Alters und Standes, sie versammelten sich vor Tagesanbruch, um Christus wie einem Gott einen Hymnus zu singen, und die Tempel seien fast verödet; er fragte nach dem Verfahren, und Trajans Antwort setzte für Jahrzehnte den Maßstab: Man solle sie nicht aufspüren und anonyme Anzeigen nicht annehmen."
    - "Später stand Bithynien im Zentrum des Reiches. Diokletian regierte von Nikomedia aus, wo 303 die Große Verfolgung begann; Konstantin berief 325 das erste allgemeine Konzil nach Nizäa, und das vierte tagte 451 in Chalkedon. Heute ist die Region der Nordwesten der Türkei: Nikomedia ist İzmit, Nizäa die Stadt İznik am See mit ihren römischen Mauern, Prusa ist Bursa, und Chalkedon ist Kadıköy, ein Stadtteil von Istanbul."
  fr:
    - "La Bithynie est le coin nord-ouest de l’Asie Mineure, pays vert et boisé le long de la mer Noire et de la mer de Marmara, face à Byzance de l’autre côté du Bosphore. Un peuple thrace lui donna son nom, et au IIIe siècle av. J.-C. ses souverains en firent un royaume hellénistique : Nicomède Ier fonda Nicomédie comme capitale vers 264 av. J.-C., et Prusias Ier, qui offrit à Hannibal son dernier refuge, bâtit Pruse au pied du mont Olympe. Nicomède IV légua le royaume à Rome en 74 av. J.-C., et après les guerres contre Mithridate il fut réuni à la partie occidentale du Pont pour former la province de Bithynie et Pont. Ses villes, Nicomédie, Nicée, Pruse et Chalcédoine, étaient riches et querelleuses."
    - "Le Nouveau Testament la nomme deux fois. Au second voyage, Paul et ses compagnons, empêchés de prêcher en Asie, arrivèrent près de la Mysie et « se disposaient à entrer en Bithynie ; mais l’Esprit de Jésus ne le leur permit pas », puis passèrent de Troas en Macédoine. L’Évangile y parvint pourtant : la première lettre de Pierre s’adresse « à ceux qui sont étrangers et dispersés dans le Pont, la Galatie, la Cappadoce, l’Asie et la Bithynie ». Vers 112 apr. J.-C., Pline le Jeune, gouverneur nommé par Trajan, lui écrivit que les chrétiens y abondaient en ville et au village, de tout âge et rang, qu’ils s’assemblaient avant l’aube pour chanter un hymne au Christ comme à un dieu, et que les temples étaient presque déserts ; il demanda comment les juger, et Trajan répondit en fixant la règle pour des décennies : ne pas les rechercher, ignorer les dénonciations anonymes."
    - "Plus tard, la Bithynie se trouva au centre de l’Empire. Dioclétien régna depuis Nicomédie, où commença la Grande Persécution en 303 ; Constantin convoqua à Nicée le premier concile général en 325, et le quatrième se réunit à Chalcédoine en 451. Aujourd’hui, la région est le nord-ouest de la Turquie : Nicomédie est İzmit, Nicée est la ville lacustre d’İznik avec ses murailles romaines, Pruse est Bursa, et Chalcédoine est Kadıköy, un quartier d’Istanbul."
