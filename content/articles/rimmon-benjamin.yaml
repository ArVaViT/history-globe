# Overview article (ADR 0007). Mainstream facts only; the reading of Isaiah 10:27 is given as an emendation, not as the text; the site is disputed between Rammun and the cave.
id: rimmon-benjamin
place: a45acc3
title:
  en: "The Rock of Rimmon"
  ru: "Риммон"
  uk: "Скеля Риммон"
  es: "La peña de Rimón"
  pt: "A Rocha de Rimom"
  de: "Der Fels Rimmon"
  fr: "Le rocher de Rimmon"
  it: "Il masso di Rimmon"
  pl: "Skała Rimmon"
  cs: "Rimmonská skála"
  nl: "De rots van Rimmon"
