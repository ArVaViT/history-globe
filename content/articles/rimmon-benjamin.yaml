# Overview article (ADR 0007). Mainstream facts only; the reading of Isaiah 10:27 is given as an emendation, not as the text; the site is disputed between Rammun and the cave.
id: rimmon-benjamin
place: a45acc3
title:
  en: "The Rock of Rimmon"
  ru: "Риммон"
body:
  en:
    - "The rock of Rimmon is the crag in the wilderness of Benjamin where the last of that tribe hid after the civil war. When Israel, avenging the crime at Gibeah, had destroyed the Benjamites in the field and burned their towns, the survivors “fled toward the wilderness unto the rock of Rimmon”, and six hundred men “abode in the rock Rimmon four months”. Then Israel, grieved that a tribe should be lost, sent to call peaceably to them and gave them wives from Jabesh-gilead and from the dancers at Shiloh. The name means “pomegranate”. The map also lists Isaiah 10:27: the Hebrew there, which the King James reads “because of the anointing”, is emended by many scholars to “he has gone up from Rimmon”, the first step of the Assyrian march on Jerusalem that goes on to Aiath and Michmash; the Revised Standard Version prints it so, but the Hebrew text and the Russian Bible do not have the name."
    - "The rock is usually found at Rammun, a village on a cone of rock some 5 km east of Bethel above the steep descent to the Jordan valley, which keeps the name; Eusebius knew a village Remmon fifteen miles north of Jerusalem. The first candidate on the map is instead the great cave of el-Jai in the gorge of the Wadi Suweinit below Michmash, which could hide six hundred men as the open village could not; a wadi and a plateau near Rammun have also been suggested. The story needs only a stronghold on the desert edge, and either fits."
    - "Today Rammun is a Palestinian village in the Ramallah governorate, and the gorge of the Suweinit with its caves runs between the villages of Jaba and Mukhmas."
  ru:
    - "Скала Риммон — утёс в пустыне Вениаминовой, где укрылись последние из этого колена после междоусобной войны. Когда Израиль, мстя за преступление в Гиве, разбил Вениамитян в поле и сжёг их города, уцелевшие «оборотились и побежали к пустыне, к скале Риммону», и шестьсот человек «оставались там в каменной горе Риммоне четыре месяца». Потом Израиль, скорбя, что колено может исчезнуть, послал к ним, «и объявило им мир», и дал им жён из Иависа Галаадского и из девиц, плясавших в Силоме. Имя значит «гранат». На карте здесь указана и Исаия 10:27: еврейский текст там, который русская Библия читает «распадется ярмо от тука», многие учёные исправляют на «он поднялся от Риммона», первый шаг ассирийского похода на Иерусалим, идущего дальше на Аиаф и Михмас; так печатает английская Пересмотренная стандартная версия, но в еврейском тексте и в русской Библии имени нет."
    - "Скалу обычно находят в Раммуне, деревне на скалистом конусе примерно в 5 км к востоку от Вефиля над крутым спуском к долине Иордана, которая хранит имя; Евсевий знал селение Реммон в пятнадцати милях к северу от Иерусалима. Первый кандидат на карте — не она, а большая пещера Эль-Джай в ущелье Вади-Сувейнит под Михмасом, где шестьсот человек могли укрыться, как не могли бы в открытой деревне; предлагали также вади и плато у Раммуна. Рассказу нужно лишь убежище на краю пустыни, и подходит и то и другое."
    - "Сегодня Раммун — палестинская деревня в мухафазе Рамалла, а ущелье Сувейнит с его пещерами пролегает между деревнями Джаба и Мухмас."
