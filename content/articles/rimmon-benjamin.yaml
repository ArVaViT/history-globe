# Overview article (ADR 0007). Mainstream facts only; the reading of Isaiah 10:27 is given as an emendation, not as the text; the site is disputed between Rammun and the cave.
id: rimmon-benjamin
place: a45acc3
title:
  en: "The Rock of Rimmon"
  ru: "Риммон"
  uk: "Скеля Риммон"
  es: "La peña de Rimón"
  pt: "A Rocha de Rimom"
  de: "Der Fels Rimmon"
  fr: "Le rocher de Rimmon"
body:
  en:
    - "The rock of Rimmon is the crag in the wilderness of Benjamin where the last of that tribe hid after the civil war. When Israel, avenging the crime at Gibeah, had destroyed the Benjamites in the field and burned their towns, the survivors “fled toward the wilderness unto the rock of Rimmon”, and six hundred men “abode in the rock Rimmon four months”. Then Israel, grieved that a tribe should be lost, sent to call peaceably to them and gave them wives from Jabesh-gilead and from the dancers at Shiloh. The name means “pomegranate”. The map also lists Isaiah 10:27: the Hebrew there, which the King James reads “because of the anointing”, is emended by many scholars to “he has gone up from Rimmon”, the first step of the Assyrian march on Jerusalem that goes on to Aiath and Michmash; the Revised Standard Version prints it so, but the Hebrew text and the Russian Bible do not have the name."
    - "The rock is usually found at Rammun, a village on a cone of rock some 5 km east of Bethel above the steep descent to the Jordan valley, which keeps the name; Eusebius knew a village Remmon fifteen miles north of Jerusalem. The first candidate on the map is instead the great cave of el-Jai in the gorge of the Wadi Suweinit below Michmash, which could hide six hundred men as the open village could not; a wadi and a plateau near Rammun have also been suggested. The story needs only a stronghold on the desert edge, and either fits."
    - "Today Rammun is a Palestinian village in the Ramallah governorate, and the gorge of the Suweinit with its caves runs between the villages of Jaba and Mukhmas."
  ru:
    - "Скала Риммон — утёс в пустыне Вениаминовой, где укрылись последние из этого колена после междоусобной войны. Когда Израиль, мстя за преступление в Гиве, разбил Вениамитян в поле и сжёг их города, уцелевшие «оборотились и побежали к пустыне, к скале Риммону», и шестьсот человек «оставались там в каменной горе Риммоне четыре месяца». Потом Израиль, скорбя, что колено может исчезнуть, послал к ним, «и объявило им мир», и дал им жён из Иависа Галаадского и из девиц, плясавших в Силоме. Имя значит «гранат». На карте здесь указана и Исаия 10:27: еврейский текст там, который русская Библия читает «распадется ярмо от тука», многие учёные исправляют на «он поднялся от Риммона», первый шаг ассирийского похода на Иерусалим, идущего дальше на Аиаф и Михмас; так печатает английская Пересмотренная стандартная версия, но в еврейском тексте и в русской Библии имени нет."
    - "Скалу обычно находят в Раммуне, деревне на скалистом конусе примерно в 5 км к востоку от Вефиля над крутым спуском к долине Иордана, которая хранит имя; Евсевий знал селение Реммон в пятнадцати милях к северу от Иерусалима. Первый кандидат на карте — не она, а большая пещера Эль-Джай в ущелье Вади-Сувейнит под Михмасом, где шестьсот человек могли укрыться, как не могли бы в открытой деревне; предлагали также вади и плато у Раммуна. Рассказу нужно лишь убежище на краю пустыни, и подходит и то и другое."
    - "Сегодня Раммун — палестинская деревня в мухафазе Рамалла, а ущелье Сувейнит с его пещерами пролегает между деревнями Джаба и Мухмас."
  uk:
    - "Скеля Риммон — це скеля в пустині Веніяміна, де сховалися останні з того коліна після громадянської війни. Коли Ізраїль, мстячи за злочин у Гіві, знищив веніямінців у полі й спалив їхні міста, «метнулись останки з них втеком у степ проти скелї Риммон, шістьсот чоловіка, та й пробували чотири місяцї під скелею Риммон». Тоді Ізраїль, засмучений тим, що коліно може загинути, послав мирно покликати їх і дав їм дружин із Явіса Гілеадського та з-поміж танцівниць у Шіло. Назва означає «гранат». Карта містить також Ісаї 10:27: єврейський текст, який переклад короля Якова читає як «через помазання», багато вчених виправляють на «він піднявся з Риммону» — перший крок ассирійського походу на Єрусалим, що йде далі до Аїата й Міхмаса; Revised Standard Version друкує так, але єврейський текст і російська Біблія цієї назви не мають."
    - "Скелю зазвичай шукають у Раммуні, селі на скельному конусі приблизно за 5 км на схід від Бет-Ела над крутим спуском до Йорданської долини, яке зберігає назву; Євсевій знав село Реммон за п’ятнадцять миль на північ від Єрусалима. Натомість першим кандидатом на карті є велика печера ель-Джай в ущелині Ваді-Суейніт нижче Міхмаса, яка могла сховати шістсот чоловіків, чого не могло б відкрите село; запропоновано також ваді й плато поблизу Раммуна. Оповіді потрібна лише твердиня на краю пустелі, і підходить будь-який варіант."
    - "Сьогодні Раммун — палестинське село в губернаторстві Рамалла, а ущелина Суейніт з її печерами пролягає між селами Джаба й Мухмас."
  es:
    - "La peña de Rimón es el risco en el desierto de Benjamín donde se ocultaron los últimos de esa tribu tras la guerra civil. Cuando Israel, vengando el crimen de Gabaa, destruyó a los benjaminitas en el campo y quemó sus ciudades, los supervivientes «huyeron hacia el desierto, á la peña de Rimmón», y seiscientos hombres «estuvieron en la peña de Rimmón cuatro meses». Entonces Israel, apenado de perder una tribu, envió a llamarlos en paz y les dio mujeres de Jabes de Galaad y de las bailarinas de Silo. El nombre significa «granada». El mapa recoge también Isaías 10:27: el hebreo, que la King James lee «por causa de la unción», es enmendado por muchos estudiosos como «ha subido desde Rimón», el primer paso de la marcha asiria sobre Jerusalén que sigue por Ayat y Micmas; la Revised Standard Version lo imprime, pero el texto hebreo y la Biblia rusa no tienen el nombre."
    - "La peña se encuentra por lo común en Rammun, una aldea sobre un cono de roca a unos 5 km al este de Betel, sobre el empinado descenso al valle del Jordán, que conserva el nombre; Eusebio conocía una aldea Remmon a quince millas al norte de Jerusalén. El primer candidato del mapa es en cambio la gran cueva de el-Jai, en la garganta del Wadi Suweinit bajo Micmas, que podía ocultar a seiscientos hombres como no podía la aldea abierta; también se han sugerido un uadi y una meseta cerca de Rammun. El relato solo necesita una plaza fuerte en el borde del desierto, y cualquiera de ellos sirve."
    - "Hoy Rammun es una aldea palestina en la gobernación de Ramala, y la garganta del Suweinit con sus cuevas corre entre las aldeas de Jaba y Mukhmas."
  pt:
    - "A rocha de Rimom é o penhasco no deserto de Benjamim onde se esconderam os últimos daquela tribo depois da guerra civil. Quando Israel, vingando o crime de Gibeá, destruiu os benjamitas em campo e queimou suas cidades, os sobreviventes “fugiram em direção ao deserto, para a rocha de Rimom”, e seiscentos homens “ficaram na rocha de Rimom por quatro meses”. Então Israel, aflito por perder uma tribo, mandou chamá-los em paz e lhes deu mulheres de Jabes-Gileade e das dançarinas de Siló. O nome significa “romã”. O mapa lista também Isaías 10:27: o hebraico ali, que a King James lê “por causa da unção”, é emendado por muitos estudiosos para “ele subiu de Rimom”, primeiro passo da marcha assíria sobre Jerusalém, que segue a Aiate e Micmás; a Versão Padrão Revisada o imprime assim, mas o texto hebraico e a Bíblia russa não têm o nome."
    - "A rocha costuma ser achada em Rammun, aldeia num cone de rocha a cerca de 5 km a leste de Betel, acima da descida íngreme ao vale do Jordão, que conserva o nome; Eusébio conhecia uma aldeia Remom a quinze milhas ao norte de Jerusalém. O primeiro candidato do mapa é, em vez disso, a grande caverna de el-Jai, na garganta do Wadi Suweinit, abaixo de Micmás, que podia esconder seiscentos homens como a aldeia aberta não podia; um uádi e um planalto perto de Rammun também foram sugeridos. A história só exige uma fortaleza na orla do deserto, e qualquer um serve."
    - "Hoje Rammun é uma aldeia palestina na província de Ramallah, e a garganta do Suweinit, com suas cavernas, corre entre as aldeias de Jaba e Mukhmas."
  de:
    - "Der Fels Rimmon ist die Klippe in der Wüste Benjamins, wo sich die Reste des Stammes nach dem Bürgerkrieg verbargen. Nachdem Israel in Rache für Gibea die Benjaminiter im Feld vernichtet und ihre Städte verbrannt hatte, blieben nur sechshundert: „Nur sechshundert Mann wandten sich und flohen zur Wüste, zum Fels Rimmon, und blieben im Fels Rimmon, vier Monate“. Dann ließ das betrübte Israel ihnen Frieden zusagen und gab ihnen Frauen aus Jabesch in Gilead und von den Tänzerinnen in Silo. Der Name bedeutet „Granatapfel“. Die Karte führt auch Jesaja 10,27 auf: Der dortige hebräische Text (in der King-James-Bibel „wegen der Salbung“) wird von vielen zu „er ist von Rimmon heraufgezogen“ verbessert, erster Schritt des assyrischen Marsches auf Jerusalem über Ajat und Michmas; die Revised Standard Version druckt es so, doch der hebräische Text und die russische Bibel haben den Namen nicht."
    - "Der Fels wird meist in Rammun gefunden, einem Dorf auf einem Felskegel etwa 5 km östlich von Bethel über dem steilen Abstieg zum Jordantal, das den Namen bewahrt; Eusebius kannte ein Dorf Remmon fünfzehn Meilen nördlich von Jerusalem. Der erste Kandidat auf der Karte ist dagegen die große Höhle von el-Dschai in der Schlucht des Wadi Suweinit unterhalb von Michmas, die sechshundert Mann verbergen konnte, was das offene Dorf nicht vermochte; auch ein Wadi und eine Hochfläche nahe Rammun wurden vorgeschlagen. Die Geschichte braucht nur einen Zufluchtsort am Wüstenrand, und beides passt."
    - "Heute ist Rammun ein palästinensisches Dorf im Gouvernement Ramallah, und die Schlucht des Suweinit mit ihren Höhlen verläuft zwischen den Dörfern Dschaba und Muchmas."
  fr:
    - "Le rocher de Rimmon est l’escarpement du désert de Benjamin où se cachèrent les derniers Benjamites après la guerre civile. Quand Israël, vengeant le crime de Guibea, eut détruit les Benjamites au combat et brûlé leurs villes, les survivants durent « s’enfuir vers le désert au rocher de Rimmon », six cents hommes « demeurèrent là pendant quatre mois ». Puis Israël, affligé de la perte d’une tribu, leur fit offrir la paix et leur donna des femmes de Jabès en Galaad et des danseuses de Silo. Le nom signifie « grenade ». La carte cite aussi Ésaïe 10:27 : l’hébreu, que la King James lit « because of the anointing » et Louis Segond « la graisse », est corrigé par beaucoup en « il est monté de Rimmon », première étape de la marche assyrienne sur Jérusalem, par Aïath et Micmasch ; la Revised Standard Version l’imprime, mais le texte hébreu et la Bible russe n’ont pas le nom."
    - "On trouve d’ordinaire le rocher à Rammun, village sur un cône de roc à quelque 5 km à l’est de Béthel, au-dessus de la descente abrupte vers la vallée du Jourdain, qui garde le nom ; Eusèbe connaissait un village Remmon à quinze milles au nord de Jérusalem. Le premier candidat de la carte est plutôt la grande grotte d’el-Jai dans la gorge du Wadi Suweinit sous Micmasch, qui pouvait cacher six cents hommes comme ne le pouvait le village ouvert ; un oued et un plateau près de Rammun ont aussi été suggérés. Le récit n’exige qu’une place forte au bord du désert, et l’un ou l’autre convient."
    - "Aujourd’hui, Rammun est un village palestinien du gouvernorat de Ramallah, et la gorge du Suweinit avec ses grottes court entre les villages de Jaba et de Mukhmas."
