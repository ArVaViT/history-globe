body:
  en:
    - "The Chebar was not a natural river but one of the great canals of Babylonia, in the plain of Nippur south-east of Babylon. The Hebrew nehar Kebar answers to the Akkadian nar Kabari, “the great canal”, which business tablets of the Murashu firm from Nippur name in the fifth century BC; since Hilprecht it is usually taken to be the Shatt en-Nil, the dry bed that runs through the ruins of Nippur and once carried Euphrates water across the plain. The older identification with the Habor (Khabur) in northern Mesopotamia, where the Assyrians had settled the exiles of Samaria, is now generally given up, since Ezekiel places the Chebar “in the land of the Chaldeans”."
    - "The exiles deported with Jehoiachin in 597 BC were settled along it. Ezekiel, a priest among them, saw the heavens opened “as I was among the captives by the river of Chebar”, in the fifth year of the captivity, 593 BC: the storm wind out of the north, the four living creatures, the wheels and the throne. He went “to them of the captivity at Tel-abib, that dwelt by the river of Chebar, and I sat where they sat”. When the glory of the LORD appeared to him again on the plain, in the Temple, and at last returning to the new Temple, he each time likened it to what he had seen by the river Chebar. Cuneiform tablets from a “town of Judah” and other villages of Judean settlers, probably in the same region, dated 572–477 BC, show the kind of community Ezekiel addressed."
    - "The canal silted up long ago. Nippur was dug by the University of Pennsylvania in 1889–1900 and by Chicago from 1948, and its mounds, with the ziggurat of Enlil, rise beside the old bed near the town of Afak in Iraq's Qadisiyah governorate."
  ru:
    - "Ховар был не природной рекой, а одним из больших каналов Вавилонии, на равнине Ниппура к юго-востоку от Вавилона. Еврейское нехар Кевар отвечает аккадскому нар Кабари, «большой канал», который называют деловые таблички дома Мурашу из Ниппура в V веке до н. э.; со времён Хильпрехта его обычно считают Шатт-эн-Нилем, сухим руслом, которое проходит через развалины Ниппура и когда-то несло воду Евфрата через равнину. Прежнее отождествление с Хавором (Хабуром) в северной Месопотамии, куда ассирийцы переселили изгнанников Самарии, теперь обычно оставлено, так как Иезекииль помещает Ховар «в земле Халдейской»."
    - "Вдоль него поселили переселенцев, уведённых с Иехонией в 597 г. до н. э. Иезекииль, священник среди них, увидел, как отверзлись небеса, «когда я находился среди переселенцев при реке Ховаре», в пятый год плена, в 593 г. до н. э.: бурный ветер с севера, четырёх животных, колёса и престол. Он пришёл «к переселенным в Тел-Авив, живущим при реке Ховаре, и остановился там, где они жили». Когда слава Господня снова являлась ему в поле, в храме и, наконец, возвращаясь в новый храм, он каждый раз уподоблял её тому, что видел при реке Ховаре. Клинописные таблички из «города Иудеев» и других селений иудейских поселенцев, вероятно в тех же местах, датированные 572–477 гг. до н. э., показывают, к какой общине обращался Иезекииль."
    - "Канал давно заилился. Ниппур раскапывал Пенсильванский университет в 1889–1900 годах и Чикагский с 1948 года, и его холмы с зиккуратом Энлиля поднимаются у старого русла близ города Афак в иракской провинции Кадисия."
  uk:
    - "Хебар був не природною річкою, а одним із великих каналів Вавилонії, на рівнині Ніппура на південний схід від Вавилона. Єврейське нехар Кевар відповідає акадському нар Кабарі, «великий канал», який згадують ділові таблички фірми Мурашу з Ніппура V ст. до н. е.; від Гільпрехта його зазвичай вважають Шатт-ен-Нілом, сухим руслом, що проходить крізь руїни Ніппура й колись несло воду Євфрату через рівнину. Давніше ототожнення з Хавором (Хабуром) у північній Месопотамії, де ассирійці оселили вигнанців Самарії, нині загалом залишене, бо Єзекіїль розміщує Хебар «в Халдейській землї»."
    - "Вигнанців, виведених з Єхонією в 597 р. до н. е., було поселено вздовж нього. Єзекіїль, священник серед них, побачив небеса відкритими, «як був я між полонянами над Ховар-річкою», на п'ятий рік полону, 593 р. до н. е.: бурю з півночі, чотирьох живих істот, колеса й престол. Він пішов «до переселенцїв у Тель-Абиб, і осїв там, де вони жили». Коли слава Господня знову з'явилася йому на рівнині, в храмі й, нарешті, повертаючись до нового храму, він щоразу уподібнював її тому, що бачив над річкою Ховар. Клинописні таблички з «міста Юди» та інших сіл юдейських поселенців, імовірно в тому самому краї, датовані 572–477 рр. до н. е., показують, яку громаду Єзекіїль мав перед собою."
    - "Канал давно замулився. Ніппур копав Пенсильванський університет у 1889–1900 рр. і Чиказький від 1948 р., і його пагорби з зіккуратом Енліля здіймаються поряд зі старим руслом біля міста Афак у провінції Кадісія в Іраку."
  es:
    - "El Quebar no era un río natural sino uno de los grandes canales de Babilonia, en la llanura de Nippur, al sudeste de Babilonia. El hebreo nehar Kebar corresponde al acadio nar Kabari, «el gran canal», que las tablillas comerciales de la casa Murashu de Nippur nombran en el siglo V a. C.; desde Hilprecht se suele identificar con el Shatt en-Nil, el cauce seco que atraviesa las ruinas de Nippur y que en otro tiempo llevaba agua del Éufrates a través de la llanura. La identificación más antigua con el Habor (Jabur) del norte de Mesopotamia, donde los asirios habían asentado a los desterrados de Samaria, se ha abandonado en general, pues Ezequiel sitúa el Quebar «en la tierra de los Caldeos»."
    - "Los desterrados deportados con Joaquín en el 597 a. C. fueron asentados a lo largo de él. Ezequiel, sacerdote entre ellos, vio abrirse los cielos «estando yo en medio de los trasportados junto al río de Chebar», en el quinto año del cautiverio, 593 a. C.: el viento de tempestad del norte, los cuatro seres vivientes, las ruedas y el trono. Fue «á los trasportados en Telabib, que moraban junto al río de Chebar, y asenté donde ellos estaban asentados». Cuando la gloria del Señor se le apareció de nuevo en la llanura, en el Templo y, por fin, al regresar al nuevo Templo, cada vez la comparó con lo que había visto junto al río de Chebar. Las tablillas cuneiformes de una «ciudad de Judá» y de otras aldeas de colonos judíos, probablemente en la misma región, fechadas entre el 572 y el 477 a. C., muestran la clase de comunidad a la que se dirigió Ezequiel."
    - "El canal se cegó hace mucho. Nippur fue excavada por la Universidad de Pensilvania en 1889–1900 y por la de Chicago desde 1948, y sus montículos, con el zigurat de Enlil, se alzan junto al viejo cauce cerca de la ciudad de Afak, en la gobernación iraquí de Qadisiya."
  pt:
    - "O Quebar não era um rio natural, mas um dos grandes canais da Babilônia, na planície de Nipur, a sudeste da Babilônia. O hebraico nehar Kebar corresponde ao acádico nar Kabari, “o grande canal”, que tabuinhas comerciais da firma Murashu, de Nipur, nomeiam no século V a.C.; desde Hilprecht, costuma-se tomá-lo pelo Shatt en-Nil, o leito seco que atravessa as ruínas de Nipur e que outrora levava água do Eufrates pela planície. A identificação mais antiga com o Habor (Khabur), no norte da Mesopotâmia, onde os assírios haviam fixado os exilados de Samaria, é hoje em geral abandonada, pois Ezequiel situa o Quebar “na terra dos caldeus”."
    - "Os exilados deportados com Joaquim em 597 a.C. foram fixados ao longo dele. Ezequiel, sacerdote entre eles, viu os céus se abrirem “estando eu entre os cativos junto ao rio Quebar”, no quinto ano do cativeiro, 593 a.C.: o vento de tempestade vindo do norte, os quatro seres viventes, as rodas e o trono. Foi “aos do cativeiro em Tel-Abibe, que moravam junto ao rio Quebar, e aonde eles moravam”, e ali se sentou entre eles. Quando a glória do SENHOR lhe apareceu de novo, na planície, no Templo e, por fim, ao voltar ao novo Templo, ele a comparou sempre ao que tinha visto junto ao rio Quebar. Tabuinhas cuneiformes de uma “cidade de Judá” e de outras aldeias de colonos judeus, provavelmente na mesma região, datadas de 572–477 a.C., mostram o tipo de comunidade a que Ezequiel falava."
    - "O canal assoreou-se há muito tempo. Nipur foi escavada pela Universidade da Pensilvânia em 1889–1900 e por Chicago a partir de 1948, e seus montes, com o zigurate de Enlil, erguem-se junto ao antigo leito, perto da cidade de Afak, na província iraquiana de Qadisiyah."
  de:
    - "Der Kebar war kein natürlicher Fluss, sondern einer der großen Kanäle Babyloniens, in der Ebene von Nippur südöstlich von Babylon. Das hebräische nehar Kebar entspricht dem akkadischen nar Kabari, „der große Kanal“, den die Geschäftstafeln der Firma Murašû aus Nippur im 5. Jahrhundert v. Chr. nennen; seit Hilprecht hält man ihn gewöhnlich für den Schatt en-Nil, das trockene Bett, das durch die Ruinen von Nippur verläuft und einst Euphratwasser durch die Ebene führte. Die ältere Gleichsetzung mit dem Habor (Chabur) in Nordmesopotamien, wo die Assyrer die Exilierten Samarias angesiedelt hatten, ist heute allgemein aufgegeben, da Hesekiel den Kebar „im Lande der Chaldäer“ ansetzt."
    - "Die mit Jojachin 597 v. Chr. Deportierten wurden an ihm angesiedelt. Hesekiel, ein Priester unter ihnen, sah den Himmel geöffnet, „da ich war unter den Gefangenen am Wasser Chebar“, im fünften Jahr der Gefangenschaft, 593 v. Chr.: den Sturmwind aus dem Norden, die vier lebenden Wesen, die Räder und den Thron. Er kam „zu den Gefangenen, die am Wasser Chebar wohnten, gen Thel-Abib, und setzte mich zu ihnen, die da saßen“. Als ihm die Herrlichkeit des HERRN wieder in der Ebene erschien, im Tempel und schließlich bei der Rückkehr in den neuen Tempel, verglich er sie jedes Mal mit dem, was er am Wasser Chebar gesehen hatte. Keilschrifttafeln aus einer „Stadt Judas“ und anderen Dörfern judäischer Siedler, wahrscheinlich in derselben Region, aus den Jahren 572–477 v. Chr. zeigen die Art von Gemeinde, an die sich Hesekiel wandte."
    - "Der Kanal ist längst versandet. Nippur wurde 1889–1900 von der Universität von Pennsylvania und ab 1948 von Chicago ausgegraben, und seine Hügel mit dem Ziggurat des Enlil erheben sich neben dem alten Bett bei der Stadt Afak im irakischen Gouvernement Qadisijja."
  fr:
    - "Le Kebar n’était pas un fleuve naturel mais l’un des grands canaux de Babylonie, dans la plaine de Nippur, au sud-est de Babylone. L’hébreu nehar Kebar correspond à l’akkadien nar Kabari, « le grand canal », que les tablettes commerciales de la maison Murashu de Nippur nomment au Ve siècle av. J.-C. ; depuis Hilprecht, on y voit d’ordinaire le Shatt en-Nil, le lit asséché qui traverse les ruines de Nippur et portait jadis l’eau de l’Euphrate à travers la plaine. L’ancienne identification avec le Chabor (Khabur) dans le nord de la Mésopotamie, où les Assyriens avaient établi les exilés de Samarie, est aujourd’hui généralement abandonnée, car Ézéchiel place le Kebar « dans le pays des Chaldéens »."
    - "Les exilés déportés avec Jojakin en 597 av. J.-C. furent établis le long de ce canal. Ézéchiel, prêtre parmi eux, vit les cieux s’ouvrir « comme j’étais parmi les captifs du fleuve du Kebar », la cinquième année de la captivité, en 593 av. J.-C. : le vent de tempête venu du nord, les quatre êtres vivants, les roues et le trône. Il alla « à Thel-Abib, vers les exilés qui demeuraient près du fleuve du Kebar, et dans le lieu où ils se trouvaient ». Quand la gloire de l’Éternel lui apparut de nouveau dans la plaine, dans le Temple, puis enfin à son retour dans le nouveau Temple, il la compara chaque fois à ce qu’il avait vu près du fleuve du Kebar. Des tablettes cunéiformes d’une « ville de Juda » et d’autres villages de colons judéens, probablement dans la même région, datées de 572–477 av. J.-C., montrent le genre de communauté à laquelle s’adressait Ézéchiel."
    - "Le canal s’est comblé depuis longtemps. Nippur a été fouillée par l’Université de Pennsylvanie en 1889–1900 et par Chicago à partir de 1948, et ses tertres, avec la ziggourat d’Enlil, s’élèvent à côté de l’ancien lit près de la ville d’Afak, dans le gouvernorat irakien de Qadisiyah."
  it:
    - "Il Chebar non era un fiume naturale ma uno dei grandi canali della Babilonia, nella piana di Nippur a sud-est di Babilonia. L’ebraico nehar Kebar corrisponde all’accadico nar Kabari, «il grande canale», che le tavolette commerciali della ditta Murashu di Nippur nominano nel V secolo a.C.; dopo Hilprecht lo si identifica di solito con lo Shatt en-Nil, l’alveo asciutto che attraversa le rovine di Nippur e un tempo portava l’acqua dell’Eufrate attraverso la piana. La più antica identificazione con il Cabor (Khabur) nella Mesopotamia settentrionale, dove gli Assiri avevano stanziato gli esiliati di Samaria, è oggi generalmente abbandonata, poiché Ezechiele pone il Chebar «nel paese dei Caldei»."
    - "Gli esiliati deportati con Ioiachin nel 597 a.C. vi furono stanziati lungo le rive. Ezechiele, sacerdote fra loro, vide aprirsi i cieli «essendo presso al fiume Kebar, fra quelli ch’erano stati menati in cattività», nel quinto anno della cattività, il 593 a.C.: il vento di tempesta da nord, i quattro esseri viventi, le ruote e il trono. Andò «da quelli ch’erano in cattività a Tel-abib presso al fiume Kebar, e mi fermai dov’essi dimoravano». Quando la gloria del Signore gli apparve di nuovo nella pianura, nel Tempio, e infine tornando nel nuovo Tempio, ogni volta la paragonò a ciò che aveva visto presso il fiume Kebar. Tavolette cuneiformi di una «città di Giuda» e di altri villaggi di coloni giudei, probabilmente nella stessa regione, datate 572–477 a.C., mostrano il tipo di comunità cui Ezechiele si rivolgeva."
    - "Il canale si è insabbiato da molto tempo. Nippur fu scavata dall’Università della Pennsylvania nel 1889–1900 e da quella di Chicago dal 1948, e i suoi tell, con la ziggurat di Enlil, si levano accanto all’antico alveo presso la città di Afak, nel governatorato iracheno di Qadisiyya."
  pl:
    - "Kebar nie była rzeką naturalną, lecz jednym z wielkich kanałów Babilonii, na równinie Nippur na południowy wschód od Babilonu. Hebrajskie nehar Kebar odpowiada akadyjskiemu nar Kabari, „wielki kanał”, który tabliczki handlowe domu Murasziu z Nippur wymieniają w V w. p.n.e.; od czasów Hilprechta uważa się go zwykle za Szatt en-Nil, suche koryto biegnące przez ruiny Nippur, które niegdyś niosło wody Eufratu przez równinę. Starsze utożsamienie z Chaburem (Chabur) w północnej Mezopotamii, gdzie Asyryjczycy osiedlili wygnańców z Samarii, jest dziś na ogół porzucone, ponieważ Ezechiel umieszcza Kebar „w ziemi Chaldejskiej”."
    - "Wygnańcy uprowadzeni z Jojakinem w 597 r. p.n.e. zostali osiedleni wzdłuż niego. Ezechiel, kapłan wśród nich, ujrzał otwarte niebiosa, „gdym był w pośrodku pojmanych u rzeki Chebar”, w piątym roku niewoli, 593 r. p.n.e.: wicher burzowy z północy, cztery istoty żywe, koła i tron. Przyszedł „do pojmanych do Telabib, którzy mieszkali przy rzece Chebar, i siadłem gdzie oni mieszkali”. Gdy chwała Pańska ukazała mu się znowu na równinie, potem w świątyni i w końcu wracając do nowej świątyni, zawsze porównywał ją z tym, co widział u rzeki Chebar. Tabliczki klinowe z „miasta Judy” i innych wsi judzkich osadników, prawdopodobnie w tej samej okolicy, z lat 572–477 p.n.e., ukazują rodzaj społeczności, do której mówił Ezechiel."
    - "Kanał dawno już zamulił się. Nippur badał University of Pennsylvania w latach 1889–1900 i Uniwersytet Chicagowski od 1948 r., a jego kopce wraz z zigguratem Enlila wznoszą się obok starego koryta koło miasta Afak w irackiej muhafazie Al-Kadisijja."
  nl:
    - "De Kebar was geen natuurlijke rivier maar een van de grote kanalen van Babylonië, in de vlakte van Nippur, ten zuidoosten van Babylon. Het Hebreeuwse nehar Kebar beantwoordt aan het Akkadische nar Kabari, “het grote kanaal”, dat zakelijke tabletten van de firma Murashu uit Nippur in de vijfde eeuw v.Chr. noemen; sinds Hilprecht wordt het gewoonlijk gelijkgesteld met de Shatt en-Nil, het droge bed dat door de ruïnes van Nippur loopt en ooit Eufraatwater over de vlakte voerde. De oudere identificatie met de Chabor (Khabur) in Noord-Mesopotamië, waar de Assyriërs de ballingen van Samaria hadden gevestigd, is nu algemeen opgegeven, aangezien Ezechiël de Kebar plaatst “in het land der Chaldeën”."
    - "De ballingen die in 597 v.Chr. met Jojachin waren weggevoerd, werden langs het kanaal gevestigd. Ezechiël, een priester onder hen, zag de hemelen geopend “als ik in het midden der weggevoerden was bij de rivier Chebar”, in het vijfde jaar van de ballingschap, 593 v.Chr.: de stormwind uit het noorden, de vier levende wezens, de raderen en de troon. Hij ging “tot de weggevoerden te Tel-Abib, die aan de rivier Chebar woonden, en ik bleef daar zij woonden”. Toen de heerlijkheid van de HEER hem opnieuw verscheen, in de vallei, in de tempel, en ten slotte bij de terugkeer naar de nieuwe tempel, vergeleek hij haar telkens met wat hij bij de rivier Chebar had gezien. Spijkerschrifttabletten uit een “stad van Juda” en andere dorpen van Judese kolonisten, waarschijnlijk in dezelfde streek, uit 572–477 v.Chr., tonen het soort gemeenschap tot wie Ezechiël sprak."
    - "Het kanaal slibde lang geleden dicht. Nippur werd opgegraven door de Universiteit van Pennsylvania in 1889–1900 en door Chicago vanaf 1948, en de heuvels ervan, met de ziggoerat van Enlil, verheffen zich naast het oude bed bij de stad Afak in het Iraakse gouvernement Al-Qadisiyya."
  cs:
    - "Kebar nebyl přirozenou řekou, ale jedním z velkých kanálů Babylonie, na nippurské pláni jihovýchodně od Babylóna. Hebrejské nehar Kebar odpovídá akkadskému nār Kabari, „velkému kanálu“, který jmenují obchodní tabulky firmy Murašû z Nippuru z 5. století př. n. l.; od Hilprechta se obvykle pokládá za Šatt en-Nil, vyschlé koryto procházející zříceninami Nippuru, které kdysi vedlo vodu z Eufratu přes pláň. Starší ztotožnění s Chabórem (Chabúr) v severní Mezopotámii, kam Asyřané usadili vyhnance ze Samaří, se dnes obecně opouští, neboť Ezechiel klade Kebar „v zemi Kaldejské“."
    - "Vyhnanci odvedení s Jójakínem roku 597 př. n. l. byli usazeni podél něj. Ezechiel, kněz mezi nimi, viděl otevřená nebesa, „když jsem byl mezi zajatými u řeky Chebar“, v pátém roce zajetí, 593 př. n. l.: bouřlivý vítr od severu, čtyři živé bytosti, kola a trůn. Šel „k zajatým do Telabib, bydlícím při řece Chebar, a seděl jsem, kdež oni bydlili“. Když se mu sláva Hospodinova zjevila znovu, na pláni, v chrámu a nakonec při návratu do nového chrámu, pokaždé ji přirovnal k tomu, co viděl u řeky Chebar. Klínopisné tabulky z „města Juda“ a dalších vesnic judských osadníků, pravděpodobně ve stejné oblasti, datované 572–477 př. n. l., ukazují druh obce, ke které Ezechiel mluvil."
    - "Kanál se dávno zanesl. Nippur vykopávala Pensylvánská univerzita v letech 1889–1900 a Chicagská od roku 1948 a jeho pahorky se zikkuratem Enlilovým se tyčí vedle starého koryta u města Afak v iráckém guvernorátu Kádisíja."
  sv:
    - "Kebar var ingen naturlig flod utan en av Babyloniens stora kanaler, på Nippurslätten sydost om Babylon. Det hebreiska nehar Kebar motsvarar akkadiskans nar Kabari, ”den stora kanalen”, som affärstavlor från Murashu-firman i Nippur nämner på 400-talet f.Kr.; sedan Hilprecht anses den vanligen vara Shatt en-Nil, den torra flodbädden som löper genom Nippurs ruiner och en gång förde Eufratvatten över slätten. Den äldre identifieringen med Habor (Khabur) i norra Mesopotamien, dit assyrierna hade fört Samarias bortförda, har nu i allmänhet övergivits, eftersom Hesekiel förlägger Kebar ”i kaldéernas land”."
    - "De bortförda som fördes bort med Jojakin 597 f.Kr. bosattes längs den. Hesekiel, en präst bland dem, såg himlen öppnas ”när jag var bland de fångna vid strömmen Kebar”, i fångenskapens femte år, 593 f.Kr.: stormvinden från norr, de fyra levande varelserna, hjulen och tronen. Han kom till ”de fångna i Tel-Abib, till dem som bodde vid strömmen Kebar, till den plats där de bodde; och jag satt där ibland dem”. När HERRENS härlighet visade sig för honom igen på slätten, i templet och till sist när den återvände till det nya templet, liknade han den varje gång vid vad han hade sett vid strömmen Kebar. Kilskriftstavlor från en ”Judas stad” och andra byar med judiska bosättare, troligen i samma trakt, daterade 572–477 f.Kr., visar den sorts gemenskap Hesekiel talade till."
    - "Kanalen har sedan länge slammat igen. Nippur grävdes av University of Pennsylvania 1889–1900 och av Chicago från 1948, och dess kullar, med Enlils ziggurat, reser sig intill den gamla bädden nära staden Afak i Iraks provins Qadisiyah."
  nb:
    - "Kebar var ikke en naturlig elv, men en av Babylonias store kanaler, på Nippur-sletten sørøst for Babylon. Det hebraiske nehar Kebar svarer til det akkadiske nar Kabari, «den store kanalen», som forretningstavler fra firmaet Murashu i Nippur nevner på 400-tallet f.Kr.; siden Hilprecht regnes den vanligvis for å være Shatt en-Nil, det tørre elveleiet som går gjennom ruinene av Nippur og en gang førte Eufrat-vann over sletten. Den eldre identifiseringen med Habor (Khabur) i Nord-Mesopotamia, der assyrerne hadde bosatt de eksilerte fra Samaria, er nå stort sett oppgitt, siden Esekiel plasserer Kebar «i kaldeernes land»."
    - "De som ble deportert sammen med Jojakin i 597 f.Kr., ble bosatt langs den. Esekiel, en prest blant dem, så himmelen åpnet «mens jeg var blandt de bortførte ved elven Kebar», i det femte året av bortførelsen, 593 f.Kr.: stormvinden fra nord, de fire livsvesenene, hjulene og tronen. Han kom «til de bortførte i Tel-Abib, de som bodde ved elven Kebar, og hvor de ellers bodde, og jeg satt der i syv dager iblandt dem». Da Herrens herlighet viste seg for ham igjen, på sletten, i tempelet og til slutt da den vendte tilbake til det nye tempelet, sammenlignet han den hver gang med det han hadde sett ved elven Kebar. Kileskrifttavler fra en «Judas by» og andre landsbyer med judeiske bosettere, trolig i samme region, datert 572–477 f.Kr., viser hva slags samfunn Esekiel talte til."
    - "Kanalen har for lengst gjort seg igjen. Nippur ble gravd ut av University of Pennsylvania i 1889–1900 og av Chicago fra 1948, og haugene med Enlils ziggurat reiser seg ved det gamle leiet nær byen Afak i Iraks Qadisiyah-guvernement."
  tl:
    - "Ang Chebar ay hindi likas na ilog kundi isa sa mga dakilang kanal ng Babilonia, sa kapatagan ng Nippur sa timog-silangan ng lungsod ng Babilonia. Ang Hebreong nehar Kebar ay katumbas ng Akkadianong nar Kabari, “ang dakilang kanal”, na pinangalanan ng mga tabletang pangnegosyo ng kompanyang Murashu mula sa Nippur noong ika-5 siglo BK; mula kay Hilprecht, karaniwan itong itinuturing na Shatt en-Nil, ang tuyong sapa na dumaraan sa mga guho ng Nippur at dating nagdala ng tubig ng Eufrates sa kapatagan. Ang mas lumang pagkilala sa Habor (Khabur) sa hilagang Mesopotamia, kung saan inilagay ng mga Asiryo ang mga destiyero ng Samaria, ay karaniwang itinatakwil na ngayon, yamang inilalagay ni Ezekiel ang Chebar “sa lupain ng mga Caldeo”."
    - "Doon inilagay ang mga destiyerong dinala kasama ni Joachin noong 597 BK. Si Ezekiel, saserdoteng kasama nila, ay nakakita ng mga langit na nabuksan “samantalang ako'y kasama ng mga bihag sa pangpang ng ilog Chebar”, sa ikalimang taon ng pagkabihag, 593 BK: ang hanging unos mula sa hilaga, ang apat na buhay na nilalang, ang mga gulong at ang trono. Pumaroon siya “sa mga bihag sa Tel-abib, na nagsisitahan sa pangpang ng ilog Chebar”, at umupo sa gitna nila. Sa bawat muling pagpapakita sa kaniya ng kaluwalhatian ng Panginoon, sa kapatagan, sa Templo, at sa pagbabalik sa bagong Templo, inihambing niya ito sa nakita niya sa tabi ng ilog Chebar. Ipinakikita ng mga tabletang cuneiform (572–477 BK) mula sa isang “bayan ng Juda” at iba pang nayon ng mga Judio, marahil sa gayunding rehiyon, ang uri ng pamayanang kinausap ni Ezekiel."
    - "Matagal nang natabunan ng banlik ang kanal. Hinukay ng Pamantasan ng Pennsylvania ang Nippur noong 1889–1900 at ng Chicago mula 1948, at ang mga tel nito, kasama ang ziggurat ni Enlil, ay nakatayo sa tabi ng lumang sapa malapit sa bayan ng Afak sa gobernadurya ng Qadisiyah ng Iraq."
  da:
    - "Kebar var ikke en naturlig flod, men en af Babyloniens store kanaler, i Nippur-sletten sydøst for Babylon. Det hebraiske nehar Kebar svarer til akkadisk nar Kabari, »den store kanal«, som forretningstavler fra Murasju-firmaet i Nippur nævner i 400-tallet f.Kr.; siden Hilprecht antages den sædvanligvis at være Shatt en-Nil, det udtørrede leje, der løber gennem Nippurs ruiner og engang førte Eufratvand hen over sletten. Den ældre identifikation med Habor (Khabur) i det nordlige Mesopotamien, hvor assyrerne havde bosat Samarias eksilanter, er nu almindeligvis opgivet, da Ezekiel placerer Kebar »i Kaldæernes Land«."
    - "De bortførte, som blev deporteret med Jojakin i 597 f.Kr., blev bosat langs den. Ezekiel, en præst blandt dem, så himlene åbnes, »da jeg var midt iblandt de bortførte ved Floden Kebar«, i fangenskabets femte år, 593 f.Kr.: stormvinden fra nord, de fire levende væsener, hjulene og tronen. Han kom »til de bortførte til Tel-Abib, til dem, som boede ved Floden Kebar, og der, hvor de boede, blev jeg siddende«. Da Herrens herlighed viste sig for ham igen på sletten, i templet og til sidst ved sin tilbagekomst til det nye tempel, sammenlignede han den hver gang med det, han havde set ved floden Kebar. Kileskrifttavler fra en »Judas by« og andre landsbyer med judæiske bosættere, sandsynligvis i samme område, dateret 572–477 f.Kr., viser den slags fællesskab, Ezekiel talte til."
    - "Kanalen er for længst siltet til. Nippur blev udgravet af University of Pennsylvania i 1889–1900 og af Chicago fra 1948, og dens høje med Enlils ziggurat rejser sig ved det gamle leje nær byen Afak i Iraks Qadisiyya-guvernement."
