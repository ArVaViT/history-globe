# Overview article (ADR 0007). Elishah: Alashiya/Cyprus (the map's point, "often" in the literature after Granerød), the Aeolians (Josephus), Magna Graecia and Sicily (Jewish Encyclopedia), Hellas and Carthage are shown without choosing.
