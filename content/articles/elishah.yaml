body:
  en:
    - "Elishah is a people and a coastland of the Mediterranean. In the table of nations Elishah is the first son of Javan, the Greeks: “And the sons of Javan; Elishah, and Tarshish, Kittim, and Dodanim.” In Ezekiel's lament over Tyre, pictured as a splendid ship, its awning came from there: “blue and purple from the isles of Elishah was that which covered thee.”"
    - "Where it lay is uncertain. In modern scholarship it is often identified with Alashiya, the Late Bronze Age name of Cyprus or a kingdom on it, whose king wrote to the pharaoh in the Amarna letters; the map follows this. Josephus made Elishah the ancestor of the Aeolians, one branch of the Greeks; the Jewish Encyclopedia placed it in southern Italy and Sicily; and other traditions connect it with Hellas or with Carthage, whose founder Dido was also called Elissa."
    - "The case for Alashiya rests on Late Bronze Age texts. In one of the Amarna letters the king of Alashiya sends the king of Egypt 500 units of copper, traditionally read as talents, though the unit is disputed, and apologises for the amount. In 2003 Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein and Nadav Na'aman analysed the clay of the Alashiya letters found at Amarna and Ugarit and traced the Amarna letters to the margin of the Troodos Mountains in Cyprus, pointing to Kalavasos-Ayios Dhimitrios or Alassa as the place where they were written. They noted that the political shape of Late Bronze Age Alashiya remains unclear. The Aramaic Targum on Ezekiel, by contrast, renders Elishah as the province of Italy."
  ru:
    - "Елиса — народ и прибрежная земля Средиземноморья. В родословии народов Елиса — первый сын Иавана, то есть греков: «Сыны Иавана: Елиса, Фарсис, Киттим и Доданим». В плаче Иезекииля о Тире, изображённом как великолепный корабль, оттуда было его покрывало: «голубого и пурпурового цвета ткани с островов Елисы были покрывалом твоим»."
    - "Где лежала Елиса, неизвестно. В современной науке её часто отождествляют с Аласией, позднебронзовым названием Кипра или царства на нём, царь которой переписывался с фараоном в амарнских письмах; карта следует этому. Иосиф Флавий считал Елису родоначальником эолийцев, одной из ветвей греков; «Еврейская энциклопедия» помещала её в Южную Италию и Сицилию, а другие предания связывают её с Элладой или с Карфагеном, основательницу которого Дидону звали также Элиссой."
    - "Довод в пользу Аласии опирается на тексты позднего бронзового века. В одном из амарнских писем царь Аласии посылает царю Египта 500 единиц меди, которые по традиции понимают как таланты, хотя мера спорна, и извиняется за то, сколько прислал. В 2003 г. Ювал Горен, Шломо Бунимовиц, Исраэль Финкельштейн и Надав Нааман исследовали глину писем из Аласии, найденных в Амарне и Угарите, и проследили амарнские письма к окраине гор Троодос на Кипре, указав как место их написания Калавасос-Айос-Димитриос или Аласу. Они отметили, что политическое устройство Аласии позднего бронзового века остаётся неясным. Арамейский Таргум на книгу Иезекииля, напротив, передаёт Елису как область Италии."
  de:
    - "Elischa ist ein Volk und ein Küstenland des Mittelmeers. In der Völkertafel ist Elischa der erste Sohn Jawans, der Griechen: „Die Kinder von Javan sind diese: Elisa, Tharsis, die Chittiter und die Dodaniter.“ In Hesekiels Klage über Tyrus, das als prächtiges Schiff geschildert wird, kam sein Sonnensegel von dort: „deine Decken von blauem und rotem Purpur aus den Inseln Elisa“."
    - "Wo es lag, ist ungewiss. In der modernen Forschung wird es oft mit Alaschija gleichgesetzt, dem spätbronzezeitlichen Namen Zyperns oder eines Königreichs darauf, dessen König in den Amarna-Briefen an den Pharao schrieb; die Karte folgt dem. Josephus machte Elischa zum Ahnherrn der Äolier, eines Zweiges der Griechen; die Jewish Encyclopedia setzte es nach Süditalien und Sizilien; und andere Überlieferungen verbinden es mit Hellas oder mit Karthago, dessen Gründerin Dido auch Elissa hieß."
    - "Für Alaschija sprechen Texte der Spätbronzezeit. In einem der Amarna-Briefe schickt der König von Alaschija dem König von Ägypten 500 Einheiten Kupfer, traditionell als Talente gelesen, wobei die Maßeinheit umstritten ist, und entschuldigt sich für die Menge. 2003 untersuchten Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein und Nadav Na'aman den Ton der in Amarna und Ugarit gefundenen Briefe aus Alaschija und führten die Amarna-Briefe auf den Rand des Troodos-Gebirges auf Zypern zurück, mit Kalavasos-Ayios Dhimitrios oder Alassa als Ort der Niederschrift. Sie hielten fest, dass die politische Gestalt Alaschijas in der Spätbronzezeit unklar bleibt. Der aramäische Targum zu Hesekiel dagegen gibt Elischa als die Provinz Italien wieder."
  fr:
    - "Élischa est un peuple et une côte de la Méditerranée. Dans la table des nations, Élischa est le premier fils de Javan, les Grecs : « Les fils de Javan : Élischa, Tarsis, Kittim et Dodanim. » Dans la lamentation d’Ézéchiel sur Tyr, figurée en un navire magnifique, ses tentures venaient de là : « Des étoffes teintes en bleu et en pourpre des îles d’Élischa formaient tes tentures. »"
    - "On ignore où il se trouvait. Dans la recherche moderne, on l’identifie souvent avec Alashiya, nom de Chypre ou d’un royaume de l’île à l’âge du Bronze récent, dont le roi écrivit au pharaon dans les lettres d’Amarna ; la carte suit cet avis. Josèphe fit d’Élischa l’ancêtre des Éoliens, une branche des Grecs ; la Jewish Encyclopedia le plaça dans le sud de l’Italie et en Sicile ; et d’autres traditions le rattachent à l’Hellade ou à Carthage, dont la fondatrice Didon s’appelait aussi Élissa."
    - "L’identification avec Alashiya repose sur des textes du Bronze récent. Dans l’une des lettres d’Amarna, le roi d’Alashiya envoie au roi d’Égypte 500 unités de cuivre, traditionnellement lues comme des talents, bien que l’unité soit discutée, et s’excuse de la quantité. En 2003, Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein et Nadav Na’aman analysèrent l’argile des lettres d’Alashiya trouvées à Amarna et à Ugarit et rattachèrent les lettres d’Amarna à la bordure du massif du Troodos à Chypre, désignant Kalavasos-Ayios Dhimitrios ou Alassa comme lieu de rédaction. Ils notèrent que la configuration politique d’Alashiya au Bronze récent reste obscure. Le Targum araméen sur Ézéchiel, en revanche, rend Élischa par la province d’Italie."
  pt:
    - "Elisá é um povo e uma costa do Mediterrâneo. Na tabela das nações, Elisá é o primeiro filho de Javã, os gregos: “Os filhos de Javã foram: Elisá, Társis, Quitim e Dodanim.” No lamento de Ezequiel sobre Tiro, representada como um esplêndido navio, seu toldo vinha dali: “Azul e púrpura das ilhas de Elisá formavam o seu toldo.”"
    - "Onde ficava é incerto. Na erudição moderna é muitas vezes identificada com Alashiya, o nome da Idade do Bronze Final de Chipre ou de um reino ali situado, cujo rei escreveu ao faraó nas cartas de Amarna; o mapa segue isso. Josefo fez de Elisá o ancestral dos eólios, um ramo dos gregos; a Jewish Encyclopedia a situou no sul da Itália e na Sicília; e outras tradições a ligam à Hélade ou a Cartago, cuja fundadora Dido também se chamava Elissa."
    - "A identificação com Alashiya se apoia em textos da Idade do Bronze Final. Numa das cartas de Amarna, o rei de Alashiya envia ao rei do Egito 500 unidades de cobre, tradicionalmente lidas como talentos, embora a unidade seja discutida, e se desculpa pela quantidade. Em 2003, Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein e Nadav Na'aman analisaram a argila das cartas de Alashiya encontradas em Amarna e Ugarit e ligaram as cartas de Amarna à orla dos montes Troodos, em Chipre, apontando Kalavasos-Ayios Dhimitrios ou Alassa como local de redação. Observaram que a configuração política de Alashiya na Idade do Bronze Final continua obscura. O Targum aramaico de Ezequiel, por sua vez, traduz Elisá como a província da Itália."
  it:
    - "Elisa è un popolo e una costa del Mediterraneo. Nella tavola dei popoli Elisa è il primo figlio di Iavan, i Greci: «I figliuoli di Javan: Elisha, Tarsis, Kittim e Dodanim». Nel lamento di Ezechiele su Tiro, raffigurata come una nave splendida, il suo baldacchino veniva da là: «la porpora e lo scarlatto delle isole d’Elisha formano i tuoi padiglioni»."
    - "Dove si trovasse è incerto. Negli studi moderni è spesso identificata con Alashiya, il nome nella tarda età del Bronzo di Cipro o di un regno su di essa, il cui re scrisse al faraone nelle lettere di Amarna; la carta segue questa ipotesi. Giuseppe Flavio fece di Elisa il capostipite degli Eoli, un ramo dei Greci; la Jewish Encyclopedia la collocò nell’Italia meridionale e in Sicilia; e altre tradizioni la collegano all’Ellade o a Cartagine, la cui fondatrice Didone era detta anche Elissa."
    - "L’identificazione con Alashiya poggia su testi della tarda età del Bronzo. In una delle lettere di Amarna il re di Alashiya manda al re d’Egitto 500 unità di rame, tradizionalmente intese come talenti, benché l’unità sia discussa, e si scusa per la quantità. Nel 2003 Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein e Nadav Na’aman analizzarono l’argilla delle lettere di Alashiya trovate ad Amarna e a Ugarit e ricondussero le lettere di Amarna al margine dei monti Troodos a Cipro, indicando Kalavasos-Ayios Dhimitrios o Alassa come luogo di stesura. Osservarono che l’assetto politico di Alashiya nella tarda età del Bronzo resta incerto. Il Targum aramaico su Ezechiele, invece, rende Elisa con la provincia d’Italia."
  nl:
    - "Elisa is een volk en een kustland van de Middellandse Zee. In de volkerentafel is Elisa de eerste zoon van Javan, de Grieken: “De zonen van Javan zijn: Elisa, en Tarsis; de Chittieten en Dodanieten.” In Ezechiëls klaagzang over Tyrus, afgebeeld als een prachtig schip, kwam het zonnescherm van daar: “hemelsblauw en purper, uit de eilanden van Elisa, was uw deksel.”"
    - "Waar het lag, is onzeker. In de moderne wetenschap wordt het vaak vereenzelvigd met Alashiya, de naam uit de late bronstijd van Cyprus of een koninkrijk daarop, wier koning in de Amarnabrieven aan de farao schreef; de kaart volgt dit. Josephus maakte Elisa tot stamvader van de Aeoliërs, een tak van de Grieken; de Jewish Encyclopedia plaatste het in Zuid-Italië en Sicilië; en andere overleveringen verbinden het met Hellas of met Carthago, wier stichteres Dido ook Elissa werd genoemd."
    - "De identificatie met Alashiya steunt op teksten uit de late bronstijd. In een van de Amarnabrieven stuurt de koning van Alashiya de koning van Egypte 500 eenheden koper, traditioneel gelezen als talenten, al is de eenheid omstreden, en verontschuldigt hij zich voor de hoeveelheid. In 2003 onderzochten Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein en Nadav Na'aman de klei van de brieven uit Alashiya die in Amarna en Ugarit zijn gevonden, en herleidden zij de Amarnabrieven tot de rand van het Troodosgebergte op Cyprus, met Kalavasos-Ayios Dhimitrios of Alassa als plaats van schrijven. Zij merkten op dat de politieke gestalte van Alashiya in de late bronstijd onduidelijk blijft. De Aramese Targum op Ezechiël geeft Elisa daarentegen weer als de provincie Italië."
  pl:
    - "Elisa to lud i wybrzeże Morza Śródziemnego. W tablicy narodów Elisa jest pierwszym synem Jawana, Greków: „A synowie Jawanowi: Elisa, i Tarsis, Cytym, i Dodanim”. W lamencie Ezechiela nad Tyrem, przedstawionym jako wspaniały okręt, jego osłona pochodziła stamtąd: „hijacynt i szarłat z wysep Elisa był nakryciem twojem”."
    - "Gdzie leżała, nie jest pewne. We współczesnej nauce często utożsamia się ją z Alaszija, późnobrązową nazwą Cypru lub królestwa na nim, którego król pisał do faraona w listach z Amarna; mapa idzie za tym. Józef Flawiusz uczynił Elisę przodkiem Eolów, jednej z gałęzi Greków; Jewish Encyclopedia umieściła ją w południowych Włoszech i na Sycylii; inne tradycje wiążą ją z Helladą lub z Kartaginą, której założycielka Dydona nazywana była także Elissą."
    - "Za Alaszija przemawiają teksty z późnej epoki brązu. W jednym z listów z Amarna król Alaszija posyła królowi Egiptu 500 jednostek miedzi, tradycyjnie odczytywanych jako talenty, choć jednostka jest sporna, i przeprasza za ich ilość. W 2003 roku Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein i Nadav Na'aman zbadali glinę listów z Alaszija znalezionych w Amarna i Ugarit i powiązali listy z Amarna z obrzeżem gór Troodos na Cyprze, wskazując jako miejsce ich spisania Kalavasos-Ayios Dhimitrios lub Alassę. Zauważyli, że polityczny kształt Alaszija w późnej epoce brązu pozostaje niejasny. Aramejski Targum do Księgi Ezechiela oddaje natomiast Elisę jako prowincję Italii."
  uk:
    - "Еліса — народ і узбережжя Середземномор'я. У таблиці народів Еліса — перший син Явана, тобто греків: «А сини Яванові: Елиса, да Тарсис, Киттим та Доданим». В оплакуванні Тіра в Єзекіїля, де місто змальовано як розкішний корабель, його покривало було звідти: «блакитні пурпурові тканини з островів Елиських були покривалом у тебе»."
    - "Де вона лежала, невідомо. У сучасній науці її часто ототожнюють з Аласією, назвою Кіпру або царства на ньому в пізню бронзову добу, цар якої писав фараонові в амарнських листах; мапа йде за цим. Йосиф Флавій зробив Елісу предком еолійців, однієї з гілок греків; Jewish Encyclopedia розмістила її на півдні Італії та в Сицилії; а інші традиції пов'язують її з Елладою або з Карфагеном, засновницю якого Дідону називали також Елісса."
    - "Аргумент на користь Аласії спирається на тексти пізньої бронзової доби. В одному з амарнських листів цар Аласії посилає цареві Єгипту 500 одиниць міді, які за традицією розуміють як таланти, хоча міра спірна, і перепрошує за те, скільки надіслав. 2003 р. Юваль Горен, Шломо Бунімовіц, Ісраель Фінкельштейн і Надав Нааман дослідили глину листів з Аласії, знайдених в Амарні та Угариті, і простежили амарнські листи до околиць гір Троодос на Кіпрі, назвавши місцем їх написання Калавасос-Айос-Дімітріос або Аласу. Вони зазначили, що політичний устрій Аласії пізньої бронзової доби лишається неясним. Арамейський Таргум на книгу Єзекіїля, натомість, передає Елісу як провінцію Італії."
  cs:
    - "Eliša je lid a pobřeží Středomoří. V tabulce národů je Eliša prvním synem Javanovým, Řeků: „Synové pak Javanovi: Elisa a Tarsis, Cetim a Dodanim.“ V Ezechielově žalozpěvu nad Týrem, vylíčeným jako nádherná loď, odtud pocházel její přístřešek: „modrý postavec a šarlat z ostrovů Elisa přikrýval tě.“"
    - "Kde ležela, je nejisté. V moderní vědě se často ztotožňuje s Alašijou, pozdně bronzovým jménem Kypru nebo království na něm, jehož král psal faraonovi v amarnských listech; mapa tento názor sleduje. Josephus Flavius učinil z Eliše předka Aiolů, jedné větve Řeků; Jewish Encyclopedia ji klade do jižní Itálie a na Sicílii; a jiné tradice ji spojují s Hellas nebo s Kartágem, jehož zakladatelka Dídó se také nazývala Elissa."
    - "Pro Alašiju svědčí texty z pozdní doby bronzové. V jednom z amarnských listů posílá král Alašije egyptskému králi 500 jednotek mědi, tradičně čtených jako talenty, ačkoli jednotka je sporná, a omlouvá se za jejich množství. Roku 2003 Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein a Nadav Na'aman zkoumali hlínu listů z Alašije nalezených v Amarně a Ugaritu a vystopovali amarnské listy k okraji pohoří Troodos na Kypru, přičemž jako místo jejich sepsání označili Kalavasos-Ayios Dhimitrios nebo Alassu. Poznamenali, že politické uspořádání Alašije v pozdní době bronzové zůstává nejasné. Aramejský targum k Ezechielovi naproti tomu překládá Elišu jako provincii Itálii."
  es:
    - "Elisa es un pueblo y una costa del Mediterráneo. En la tabla de las naciones, Elisa es el primer hijo de Javán, los griegos: «Y los hijos de Javán: Elisa, y Tarsis, Kittim, y Dodanim». En la lamentación de Ezequiel sobre Tiro, representada como una espléndida nave, su toldo venía de allí: «de cárdeno y grana de las islas de Elisah fué tu pabellón»."
    - "Dónde estaba es incierto. En la erudición moderna se identifica a menudo con Alashiya, el nombre de Chipre o de un reino en ella en la edad del Bronce Final, cuyo rey escribió al faraón en las cartas de Amarna; el mapa lo sigue. Josefo hizo de Elisa el antepasado de los eolios, una rama de los griegos; la Jewish Encyclopedia la situó en el sur de Italia y Sicilia; y otras tradiciones la relacionan con Hélade o con Cartago, cuya fundadora Dido se llamaba también Elisa."
    - "La identificación con Alashiya se apoya en textos del Bronce Final. En una de las cartas de Amarna el rey de Alashiya envía al rey de Egipto 500 unidades de cobre, tradicionalmente leídas como talentos, aunque la unidad es discutida, y se disculpa por la cantidad. En 2003 Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein y Nadav Na'aman analizaron la arcilla de las cartas de Alashiya halladas en Amarna y Ugarit y remontaron las cartas de Amarna al borde de los montes Troodos, en Chipre, señalando Kalavasos-Ayios Dhimitrios o Alassa como lugar de redacción. Observaron que la configuración política de Alashiya en el Bronce Final sigue sin estar clara. El Targum arameo de Ezequiel, en cambio, vierte Elisa como la provincia de Italia."
  sv:
    - "Elisha är ett folk och ett kustland vid Medelhavet. I folkens tavla står Elisha först bland sönerna till Javan, det vill säga grekerna: ”Javans söner voro Elisa och Tarsis, kittéerna och dodanéerna.” I Hesekiels klagosång över Tyros, framställt som ett praktfullt skepp, kom dess soltält därifrån: ”Mörkblått och purpurrött tyg från Elisas öländer hade du till soltält.”"
    - "Var det låg är osäkert. I modern forskning identifieras det ofta med Alashiya, sen bronsålders namn på Cypern eller ett kungarike där, vars kung skrev till farao i Amarnabreven; kartan följer detta. Josefus gjorde Elisha till stamfader för aiolerna, en gren av grekerna; Jewish Encyclopedia placerade det i södra Italien och på Sicilien; och andra traditioner knyter det till Hellas eller till Kartago, vars grundare Dido också kallades Elissa."
    - "Kopplingen till Alashiya vilar på texter från sen bronsålder. I ett av Amarnabreven sänder kungen av Alashiya Egyptens kung 500 enheter koppar, traditionellt lästa som talenter, fast enheten är omstridd, och ber om ursäkt för mängden. År 2003 undersökte Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein och Nadav Na'aman leran i breven från Alashiya som hittats i Amarna och Ugarit och spårade Amarnabreven till kanten av Troodosbergen på Cypern, med Kalavasos-Ayios Dhimitrios eller Alassa som platsen där de skrevs. De påpekade att Alashiyas politiska form under sen bronsålder förblir oklar. Den arameiska targumen till Hesekiel återger däremot Elisha som provinsen Italien."
  nb:
    - "Elisja er et folk og et kystland ved Middelhavet. I folketavlen er Elisja den første sønnen av Javan, grekerne: «Og Javans sønner var Elisa og Tarsis, Kittim og Dodanim.» I Esekiels klagesang over Tyros, fremstilt som et praktfullt skip, kom dets soltelt derfra: «blått og purpurrødt tøi fra Elisa-øene var ditt soltelt.»"
    - "Hvor det lå, er usikkert. I moderne forskning identifiseres det ofte med Alashiya, senbronsealderens navn på Kypros eller et rike der, hvis konge skrev til farao i Amarna-brevene; kartet følger dette. Josefus gjorde Elisja til stamfar til aiolerne, en gren av grekerne; Jewish Encyclopedia plasserte det i Sør-Italia og på Sicilia; og andre tradisjoner knytter det til Hellas eller til Kartago, hvis grunnlegger Dido også ble kalt Elissa."
    - "Koblingen til Alashiya hviler på tekster fra senbronsealderen. I ett av Amarna-brevene sender kongen av Alashiya kongen av Egypt 500 enheter kobber, tradisjonelt lest som talenter, selv om enheten er omstridt, og ber om unnskyldning for mengden. I 2003 undersøkte Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein og Nadav Na'aman leiren i brevene fra Alashiya som ble funnet i Amarna og Ugarit, og sporet Amarna-brevene til kanten av Troodos-fjellene på Kypros, med Kalavasos-Ayios Dhimitrios eller Alassa som stedet der de ble skrevet. De påpekte at Alashiyas politiske form i senbronsealderen fortsatt er uklar. Den arameiske targumen til Esekiel gjengir derimot Elisja som provinsen Italia."
  tl:
    - "Ang Elisah ay isang bayan at baybayin ng Mediteraneo. Sa Talaan ng mga Bansa, si Elisah ang unang anak ni Javan, ang mga Griyego: “At ang mga anak ni Javan; si Elisa, at si Tarsis, si Cittim, at si Dodanim.” Sa panaghoy ni Ezekiel tungkol sa Tiro, na inilalarawang magandang barko, mula roon ang kulandong nito: “kulay asul at morado na mula sa mga pulo ng Elisah ang iyong kulandong.”"
    - "Hindi tiyak kung nasaan ito. Sa makabagong pag-aaral, madalas itong kilalanin sa Alashiya, ang pangalan noong Huling Panahon ng Tanso ng Chipre o isang kaharian doon, na ang hari ay sumulat sa faraon sa mga liham sa Amarna; sinusunod ito ng mapa. Ginawa ni Josefo si Elisah na ninuno ng mga Aeolio, isang sangay ng mga Griyego; inilagay ito ng Jewish Encyclopedia sa timog Italia at Sicilia; at iniuugnay ito ng ibang tradisyon sa Hellas o sa Cartago, na ang tagapagtatag na si Dido ay tinatawag ding Elissa."
    - "Nakasalig sa mga teksto ng Huling Panahon ng Tanso ang pagkilala sa Alashiya. Sa isa sa mga liham sa Amarna, nagpadala ang hari ng Alashiya sa hari ng Egipto ng 500 yunit ng tanso, na tradisyonal na binabasang talento, bagaman pinagtatalunan ang yunit, at humingi ng paumanhin sa dami nito. Noong 2003, sinuri nina Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein at Nadav Na'aman ang luwad ng mga liham mula sa Alashiya na natagpuan sa Amarna at Ugarit, at natunton nila ang mga liham sa Amarna sa gilid ng Kabundukang Troodos sa Chipre, na itinuturo ang Kalavasos-Ayios Dhimitrios o Alassa bilang pook na pinagsulatan ng mga ito. Sinabi nilang nananatiling malabo ang pampulitikang anyo ng Alashiya noong Huling Panahon ng Tanso. Sa kabilang dako, isinasalin ng Aramaikong Targum sa Ezekiel ang Elisah bilang lalawigan ng Italia."
  da:
    - "Elisja er et folk og et kystland ved Middelhavet. I folkeslagstavlen er Elisja den første søn af Javan, grækerne: »Og Javans Sønner: Elisa og Tharsis, Kithim og Dodanim.« I Ezekiels klagesang over Tyrus, afbildet som et prægtigt skib, kom dets solsejl derfra: »af blaat Purpur og rødt Purpur fra Elisas Øer var dit Solsejl.«"
    - "Hvor det lå, er usikkert. I moderne forskning identificeres det ofte med Alashiya, senbronzealderens navn for Cypern eller et kongedømme dér, hvis konge skrev til faraoen i Amarna-brevene; kortet følger dette. Josefus gjorde Elisja til forfader til æolerne, en gren af grækerne; Jewish Encyclopedia placerede det i Syditalien og på Sicilien; og andre traditioner knytter det til Hellas eller til Karthago, hvis grundlægger Dido også kaldtes Elissa."
    - "Forbindelsen til Alashiya hviler på tekster fra senbronzealderen. I et af Amarna-brevene sender kongen af Alashiya Egyptens konge 500 enheder kobber, traditionelt læst som talenter, selv om enheden er omstridt, og undskylder mængden. I 2003 undersøgte Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein og Nadav Na'aman leret i brevene fra Alashiya, der er fundet i Amarna og Ugarit, og sporede Amarna-brevene til randen af Troodosbjergene på Cypern, med Kalavasos-Ayios Dhimitrios eller Alassa som det sted, hvor de blev skrevet. De bemærkede, at Alashiyas politiske form i senbronzealderen fortsat er uklar. Den aramæiske targum til Ezekiel gengiver derimod Elisja som provinsen Italien."
  sr:
    - "Елиса је народ и приобални крај Средоземља. У списку народа Елиса је први син Јаванов, Грка: „А синови Јаванови: Елиса и Тарсис, Китим и Доданим“. У Језекиљевом јадиковању над Тиром, приказаним као раскошан брод, његова сенила потицала су оданде: „порфиром и скерлетом с острва елиских покривао си се“."
    - "Где је лежала, неизвесно је. У савременој науци често се поистовећује са Алашијом, именом Кипра у касном бронзаном добу или краљевства на њему, чији је краљ писао фараону у амарнским писмима; карта то следи. Јосиф Флавије је од Елисе начинио претка Еолаца, једне гране Грка; Јеврејска енциклопедија ју је сместила у јужну Италију и Сицилију; а друга предања је повезују с Хеладом или с Картагином, чија се оснивачица Дидона звала и Елиса."
    - "Довод у корист Алашије почива на текстовима из касног бронзаног доба. У једном од амарнских писама краљ Алашије шаље египатском краљу 500 јединица бакра, које се по предању читају као таланти, иако је мера спорна, и извињава се због количине. Јувал Горен, Шломо Бунимовиц, Израел Финкелштајн и Надав Нааман испитали су 2003. глину писама из Алашије нађених у Амарни и Угариту и довели амарнска писма у везу с рубом планине Троодос на Кипру, означивши као место њиховог писања Калавасос-Ајос Димитриос или Аласу. Приметили су да политичко уређење Алашије у касном бронзаном добу остаје нејасно. Арамејски Таргум на Језекиља, насупрот томе, преноси Елису као провинцију Италију."
  hu:
    - "Elisa a Földközi-tenger egy népe és tengerpartja. A népek táblázatában Elisa Jáván, a görögök első fia: „Jávánnak pedig fiai: Elisah, Thársis, Kitthim és Dodánim.” Ezékiel Tírusz fölötti siralmában, amelyben a város pompás hajóként jelenik meg, sátra onnan való volt: „Elisának szigeteiről való kék és piros bíbor volt sátrad borítékja.”"
    - "Hogy hol feküdt, bizonytalan. A modern kutatásban gyakran Alasijával azonosítják, Ciprus vagy egy ottani királyság késő bronzkori nevével, amelynek királya írt a fáraónak az amarnai levelekben; a térkép ezt követi. Josephus Elisát az aiolisok, a görögök egyik ága ősének tette; a Jewish Encyclopedia Dél-Itáliába és Szicíliába helyezte; más hagyományok Hellaszhoz vagy Karthágóhoz kapcsolják, amelynek alapítóját, Didót Elissának is hívták."
    - "Az Alasija melletti érvek késő bronzkori szövegeken alapulnak. Az egyik amarnai levélben Alasija királya 500 egységnyi rezet küld Egyiptom királyának, amelyet hagyományosan talentumnak olvasnak, bár a mértékegység vitatott, és mentegetőzik a mennyiség miatt. 2003-ban Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein és Nadav Na'aman megvizsgálta az Amarnában és Ugaritban talált alasijai levelek agyagját, és az amarnai leveleket a ciprusi Troodos-hegység peremére vezette vissza, írásuk helyeként Kalavasos-Ayios Dhimitriost vagy Alassát jelölve meg. Megjegyezték, hogy a késő bronzkori Alasija politikai felépítése továbbra is tisztázatlan. Az arámi Targum Ezékiel könyvéhez ezzel szemben Elisát Itália tartományaként adja vissza."
  fi:
    - "Elisa on kansa ja Välimeren rannikkomaa. Kansainluettelossa Elisa on Javanin, kreikkalaisten, esikoispoika: ”Ja Jaavanin pojat olivat Elisa, Tarsis, kittiläiset ja doodanilaiset”. Hesekielin valituslaulussa Tyroksesta, joka on kuvattu upeaksi laivaksi, sen katos tuli sieltä: ”Katoksesi oli punasinistä ja purppuranpunaista Elisa-saarten kangasta.”"
    - "Missä se sijaitsi, on epävarmaa. Nykytutkimuksessa se tunnistetaan usein Alashiyaksi, Kyproksen tai sillä sijainneen kuningaskunnan myöhäispronssikauden nimeksi, jonka kuningas kirjoitti faraolle Amarna-kirjeissä; kartta seuraa tätä. Josefus teki Elisasta aiolilaisten, yhden kreikkalaisten haaran, kantaisän; Jewish Encyclopedia sijoitti sen Etelä-Italiaan ja Sisiliaan; ja muut perinteet yhdistävät sen Hellakseen tai Karthagoon, jonka perustajaa Didoa kutsuttiin myös Elissaksi."
    - "Alashiya-tunnistus nojaa myöhäispronssikauden teksteihin. Yhdessä Amarna-kirjeistä Alashiyan kuningas lähettää Egyptin kuninkaalle 500 yksikköä kuparia, jotka on perinteisesti luettu talenteiksi, vaikka yksikkö on kiistanalainen, ja pyytää anteeksi määrää. Vuonna 2003 Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein ja Nadav Na'aman tutkivat Amarnasta ja Ugaritista löydettyjen Alashiyan kirjeiden saven ja jäljittivät Amarna-kirjeet Kyproksen Troodos-vuoriston reunalle, kirjoituspaikkana Kalavasos-Ayios Dhimitrios tai Alassa. He totesivat, että myöhäispronssikauden Alashiyan poliittinen muoto on yhä epäselvä. Hesekielin kirjan aramealainen targum sen sijaan kääntää Elisan Italian maakunnaksi."
  vi:
    - "Ê-li-sa là một dân tộc và một vùng ven biển của Địa Trung Hải. Trong bảng các dân tộc, Ê-li-sa là con trai đầu của Gia-van, tức người Hy Lạp: “Con trai của Gia-van là Ê-li-sa và Ta-rê-si, Kít-tim và Đô-đa-nim.” Trong bài ai ca của Ê-xê-chi-ên về Ty-rơ, được hình dung như một con tàu lộng lẫy, tấm che của nó đến từ đó: “vải sắc tía sắc xanh của các cù lao Ê-li-sa dùng làm màn cháng.”"
    - "Nó nằm ở đâu thì không chắc chắn. Trong học thuật hiện đại, nó thường được đồng nhất với Alashiya, tên cuối thời đồ đồng của Chíp-rơ hoặc một vương quốc trên đó, mà vua viết cho pharaoh trong các thư Amarna; bản đồ theo cách này. Josephus cho Ê-li-sa là tổ tiên của người Aeolia, một nhánh của người Hy Lạp; Jewish Encyclopedia đặt nó ở nam Y-ta-li và Sicily; và các truyền thống khác nối nó với Hellas hoặc với Carthage, nơi người sáng lập Dido cũng được gọi là Elissa."
    - "Lập luận về Alashiya dựa trên các văn bản cuối thời đồ đồng. Trong một bức thư Amarna, vua Alashiya gửi vua Ê-díp-tô 500 đơn vị đồng, theo truyền thống được hiểu là ta-lâng, dù đơn vị này còn bị tranh cãi, và xin lỗi về số lượng ấy. Năm 2003, Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein và Nadav Na'aman phân tích đất sét của các thư từ Alashiya tìm thấy ở Amarna và Ugarit, và truy nguồn các thư Amarna đến rìa dãy núi Troodos ở Chíp-rơ, chỉ ra Kalavasos-Ayios Dhimitrios hoặc Alassa là nơi viết thư. Họ ghi nhận rằng cấu trúc chính trị của Alashiya cuối thời đồ đồng vẫn chưa rõ. Ngược lại, bản Targum tiếng A-ram về sách Ê-xê-chi-ên dịch Ê-li-sa là tỉnh Y-ta-li."
  ro:
    - "Elișa este un popor și un țărm al Mediteranei. În tabelul popoarelor, Elișa este primul fiu al lui Iavan, al grecilor: „Și feciorii lui Iovan: Elisà și Tarsis și Kitii și Rodenii.” În plângerea lui Ezechiel asupra Tirului, înfățișat ca o corabie măreață, acoperământul ei venea de acolo: „să te acopere cu vânăt și cu mohorît, din ostroavele Elise s’au făcut veșmintele tale”."
    - "Unde se afla este nesigur. În cercetarea modernă este adesea identificată cu Alashiya, numele din epoca bronzului târziu al Ciprului sau al unui regat de pe el, al cărui rege i-a scris faraonului în scrisorile de la Amarna; harta urmează această părere. Iosif Flaviu a făcut din Elișa strămoșul eolienilor, o ramură a grecilor; Jewish Encyclopedia a așezat-o în sudul Italiei și în Sicilia; iar alte tradiții o leagă de Hellas sau de Cartagina, a cărei întemeietoare, Dido, se mai numea și Elissa."
    - "Argumentul pentru Alashiya se sprijină pe texte din epoca bronzului târziu. Într-una dintre scrisorile de la Amarna, regele din Alashiya îi trimite regelui Egiptului 500 de unități de cupru, citite în mod tradițional ca talanți, deși unitatea este disputată, și se scuză pentru cantitate. În 2003, Yuval Goren, Shlomo Bunimovitz, Israel Finkelstein și Nadav Na'aman au analizat argila scrisorilor din Alashiya găsite la Amarna și Ugarit și au legat scrisorile de la Amarna de marginea munților Troodos din Cipru, indicând Kalavasos-Ayios Dhimitrios sau Alassa drept loc al redactării. Ei au observat că alcătuirea politică a Alashiyei din epoca bronzului târziu rămâne neclară. Targumul aramaic la Ezechiel, în schimb, redă Elișa drept provincia Italiei."
  bg:
    - "Елиса е народ и крайбрежна земя на Средиземноморието. В родословието на народите Елиса е първият син на Яван, гърците: „А синовете Яванови: Елиса, и Тарсис, Китим, и Доданим.“ В плача на Йезекиил за Тир, представен като великолепен кораб, оттам идвал навесът му: „синьо и багрено от островите на Елиса бе покровът ти“."
    - "Къде е лежала, е несигурно. В съвременната наука тя често се отъждествява с Алашия, името от късната бронзова епоха на Кипър или на царство на него, чийто цар писал на фараона в писмата от Амарна; картата следва това. Йосиф Флавий прави Елиса родоначалник на еолийците, един от клоновете на гърците; „Еврейската енциклопедия“ я поставя в Южна Италия и Сицилия, а други традиции я свързват с Елада или с Картаген, чиято основателка Дидона била наричана и Елиса."
    - "Доводът в полза на Алашия се опира на текстове от късната бронзова епоха. В едно от писмата от Амарна царят на Алашия изпраща на египетския цар 500 единици мед, които традиционно се четат като таланти, макар мярката да е спорна, и се извинява за количеството. През 2003 г. Ювал Горен, Шломо Бунимовиц, Израел Финкелщайн и Надав Нааман изследвали глината на писмата от Алашия, намерени в Амарна и Угарит, и проследили писмата от Амарна до края на планината Троодос в Кипър, като посочили за място на написването им Калавасос-Айос Димитриос или Аласа. Те отбелязали, че политическото устройство на Алашия през късната бронзова епоха остава неясно. Арамейският Таргум към Йезекиил, напротив, предава Елиса като провинция Италия."
scripture:
  - Gen.10.4
  - Ezek.27.7
