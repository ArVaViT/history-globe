body:
  en:
    - "Elishah is a people and a coastland of the Mediterranean. In the table of nations Elishah is the first son of Javan, the Greeks: “And the sons of Javan; Elishah, and Tarshish, Kittim, and Dodanim.” In Ezekiel's lament over Tyre, pictured as a splendid ship, its awning came from there: “blue and purple from the isles of Elishah was that which covered thee.”"
    - "Where it lay is uncertain. In modern scholarship it is often identified with Alashiya, the Late Bronze Age name of Cyprus or a kingdom on it, whose king wrote to the pharaoh in the Amarna letters; the map follows this. Josephus made Elishah the ancestor of the Aeolians, one branch of the Greeks; the Jewish Encyclopedia placed it in southern Italy and Sicily; and other traditions connect it with Hellas or with Carthage, whose founder Dido was also called Elissa."
  ru:
    - "Елиса — народ и прибрежная земля Средиземноморья. В родословии народов Елиса — первый сын Иавана, то есть греков: «Сыны Иавана: Елиса, Фарсис, Киттим и Доданим». В плаче Иезекииля о Тире, изображённом как великолепный корабль, оттуда было его покрывало: «голубого и пурпурового цвета ткани с островов Елисы были покрывалом твоим»."
    - "Где лежала Елиса, неизвестно. В современной науке её часто отождествляют с Аласией, позднебронзовым названием Кипра или царства на нём, царь которой переписывался с фараоном в амарнских письмах; карта следует этому. Иосиф Флавий считал Елису родоначальником эолийцев, одной из ветвей греков; «Еврейская энциклопедия» помещала её в Южную Италию и Сицилию, а другие предания связывают её с Элладой или с Карфагеном, основательницу которого Дидону звали также Элиссой."
  de:
    - "Elischa ist ein Volk und ein Küstenland des Mittelmeers. In der Völkertafel ist Elischa der erste Sohn Jawans, der Griechen: „Die Kinder von Javan sind diese: Elisa, Tharsis, die Chittiter und die Dodaniter.“ In Hesekiels Klage über Tyrus, das als prächtiges Schiff geschildert wird, kam sein Sonnensegel von dort: „deine Decken von blauem und rotem Purpur aus den Inseln Elisa“."
    - "Wo es lag, ist ungewiss. In der modernen Forschung wird es oft mit Alaschija gleichgesetzt, dem spätbronzezeitlichen Namen Zyperns oder eines Königreichs darauf, dessen König in den Amarna-Briefen an den Pharao schrieb; die Karte folgt dem. Josephus machte Elischa zum Ahnherrn der Äolier, eines Zweiges der Griechen; die Jewish Encyclopedia setzte es nach Süditalien und Sizilien; und andere Überlieferungen verbinden es mit Hellas oder mit Karthago, dessen Gründerin Dido auch Elissa hieß."
  fr:
    - "Élischa est un peuple et une côte de la Méditerranée. Dans la table des nations, Élischa est le premier fils de Javan, les Grecs : « Les fils de Javan : Élischa, Tarsis, Kittim et Dodanim. » Dans la lamentation d’Ézéchiel sur Tyr, figurée en un navire magnifique, ses tentures venaient de là : « Des étoffes teintes en bleu et en pourpre des îles d’Élischa formaient tes tentures. »"
    - "On ignore où il se trouvait. Dans la recherche moderne, on l’identifie souvent avec Alashiya, nom de Chypre ou d’un royaume de l’île à l’âge du Bronze récent, dont le roi écrivit au pharaon dans les lettres d’Amarna ; la carte suit cet avis. Josèphe fit d’Élischa l’ancêtre des Éoliens, une branche des Grecs ; la Jewish Encyclopedia le plaça dans le sud de l’Italie et en Sicile ; et d’autres traditions le rattachent à l’Hellade ou à Carthage, dont la fondatrice Didon s’appelait aussi Élissa."
  pt:
    - "Elisá é um povo e uma costa do Mediterrâneo. Na tabela das nações, Elisá é o primeiro filho de Javã, os gregos: “Os filhos de Javã foram: Elisá, Társis, Quitim e Dodanim.” No lamento de Ezequiel sobre Tiro, representada como um esplêndido navio, seu toldo vinha dali: “Azul e púrpura das ilhas de Elisá formavam o seu toldo.”"
    - "Onde ficava é incerto. Na erudição moderna é muitas vezes identificada com Alashiya, o nome da Idade do Bronze Final de Chipre ou de um reino ali situado, cujo rei escreveu ao faraó nas cartas de Amarna; o mapa segue isso. Josefo fez de Elisá o ancestral dos eólios, um ramo dos gregos; a Jewish Encyclopedia a situou no sul da Itália e na Sicília; e outras tradições a ligam à Hélade ou a Cartago, cuja fundadora Dido também se chamava Elissa."
  it:
    - "Elisa è un popolo e una costa del Mediterraneo. Nella tavola dei popoli Elisa è il primo figlio di Iavan, i Greci: «I figliuoli di Javan: Elisha, Tarsis, Kittim e Dodanim». Nel lamento di Ezechiele su Tiro, raffigurata come una nave splendida, il suo baldacchino veniva da là: «la porpora e lo scarlatto delle isole d’Elisha formano i tuoi padiglioni»."
    - "Dove si trovasse è incerto. Negli studi moderni è spesso identificata con Alashiya, il nome nella tarda età del Bronzo di Cipro o di un regno su di essa, il cui re scrisse al faraone nelle lettere di Amarna; la carta segue questa ipotesi. Giuseppe Flavio fece di Elisa il capostipite degli Eoli, un ramo dei Greci; la Jewish Encyclopedia la collocò nell’Italia meridionale e in Sicilia; e altre tradizioni la collegano all’Ellade o a Cartagine, la cui fondatrice Didone era detta anche Elissa."
  nl:
    - "Elisa is een volk en een kustland van de Middellandse Zee. In de volkerentafel is Elisa de eerste zoon van Javan, de Grieken: “De zonen van Javan zijn: Elisa, en Tarsis; de Chittieten en Dodanieten.” In Ezechiëls klaagzang over Tyrus, afgebeeld als een prachtig schip, kwam het zonnescherm van daar: “hemelsblauw en purper, uit de eilanden van Elisa, was uw deksel.”"
    - "Waar het lag, is onzeker. In de moderne wetenschap wordt het vaak vereenzelvigd met Alashiya, de naam uit de late bronstijd van Cyprus of een koninkrijk daarop, wier koning in de Amarnabrieven aan de farao schreef; de kaart volgt dit. Josephus maakte Elisa tot stamvader van de Aeoliërs, een tak van de Grieken; de Jewish Encyclopedia plaatste het in Zuid-Italië en Sicilië; en andere overleveringen verbinden het met Hellas of met Carthago, wier stichteres Dido ook Elissa werd genoemd."
  pl:
    - "Elisa to lud i wybrzeże Morza Śródziemnego. W tablicy narodów Elisa jest pierwszym synem Jawana, Greków: „A synowie Jawanowi: Elisa, i Tarsis, Cytym, i Dodanim”. W lamencie Ezechiela nad Tyrem, przedstawionym jako wspaniały okręt, jego osłona pochodziła stamtąd: „hijacynt i szarłat z wysep Elisa był nakryciem twojem”."
    - "Gdzie leżała, nie jest pewne. We współczesnej nauce często utożsamia się ją z Alaszija, późnobrązową nazwą Cypru lub królestwa na nim, którego król pisał do faraona w listach z Amarna; mapa idzie za tym. Józef Flawiusz uczynił Elisę przodkiem Eolów, jednej z gałęzi Greków; Jewish Encyclopedia umieściła ją w południowych Włoszech i na Sycylii; inne tradycje wiążą ją z Helladą lub z Kartaginą, której założycielka Dydona nazywana była także Elissą."
  uk:
    - "Еліса — народ і узбережжя Середземномор'я. У таблиці народів Еліса — перший син Явана, тобто греків: «А сини Яванові: Елиса, да Тарсис, Киттим та Доданим». В оплакуванні Тіра в Єзекіїля, де місто змальовано як розкішний корабель, його покривало було звідти: «блакитні пурпурові тканини з островів Елиських були покривалом у тебе»."
    - "Де вона лежала, невідомо. У сучасній науці її часто ототожнюють з Аласією, назвою Кіпру або царства на ньому в пізню бронзову добу, цар якої писав фараонові в амарнських листах; мапа йде за цим. Йосиф Флавій зробив Елісу предком еолійців, однієї з гілок греків; Jewish Encyclopedia розмістила її на півдні Італії та в Сицилії; а інші традиції пов'язують її з Елладою або з Карфагеном, засновницю якого Дідону називали також Елісса."
  cs:
    - "Eliša je lid a pobřeží Středomoří. V tabulce národů je Eliša prvním synem Javanovým, Řeků: „Synové pak Javanovi: Elisa a Tarsis, Cetim a Dodanim.“ V Ezechielově žalozpěvu nad Týrem, vylíčeným jako nádherná loď, odtud pocházel její přístřešek: „modrý postavec a šarlat z ostrovů Elisa přikrýval tě.“"
    - "Kde ležela, je nejisté. V moderní vědě se často ztotožňuje s Alašijou, pozdně bronzovým jménem Kypru nebo království na něm, jehož král psal faraonovi v amarnských listech; mapa tento názor sleduje. Josephus Flavius učinil z Eliše předka Aiolů, jedné větve Řeků; Jewish Encyclopedia ji klade do jižní Itálie a na Sicílii; a jiné tradice ji spojují s Hellas nebo s Kartágem, jehož zakladatelka Dídó se také nazývala Elissa."
  es:
    - "Elisa es un pueblo y una costa del Mediterráneo. En la tabla de las naciones, Elisa es el primer hijo de Javán, los griegos: «Y los hijos de Javán: Elisa, y Tarsis, Kittim, y Dodanim». En la lamentación de Ezequiel sobre Tiro, representada como una espléndida nave, su toldo venía de allí: «de cárdeno y grana de las islas de Elisah fué tu pabellón»."
    - "Dónde estaba es incierto. En la erudición moderna se identifica a menudo con Alashiya, el nombre de Chipre o de un reino en ella en la edad del Bronce Final, cuyo rey escribió al faraón en las cartas de Amarna; el mapa lo sigue. Josefo hizo de Elisa el antepasado de los eolios, una rama de los griegos; la Jewish Encyclopedia la situó en el sur de Italia y Sicilia; y otras tradiciones la relacionan con Hélade o con Cartago, cuya fundadora Dido se llamaba también Elisa."
