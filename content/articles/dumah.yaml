# Overview article (ADR 0007). Mainstream facts only; the Dumah of Isaiah 21:11 is read either as the Arabian oasis Dumat al-Jandal (Assyrian Adummatu) or as a name for Edom; both are given without choosing. Not the Dumah of Judah (Joshua 15:52).
id: dumah
