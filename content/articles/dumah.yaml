body:
  en:
    - "Dumah is the name of a short oracle in Isaiah. Two readings are current. Dumah was a son of Ishmael, and his name survives in Dumat al-Jandal, an oasis of northern Arabia at the south-eastern end of the Wadi Sirhan; the oracle that follows in Isaiah, “the burden upon Arabia”, with its caravans of Dedan, fits this reading. But the voice comes “out of Seir”, the mountain of Edom, and the Greek Septuagint renders Dumah as Idumaea, so others, Franz Delitzsch among them, take Dumah, “silence”, as a play on the name Edom. It is not the Dumah in the hill country of Judah."
    - "The oracle is a dialogue of a few lines: “The burden of Dumah. He calleth to me out of Seir, Watchman, what of the night? Watchman, what of the night?” and the answer, “The morning cometh, and also the night: if ye will enquire, enquire ye: return, come.”"
    - "The oasis was the Assyrians' Adumutu. Esarhaddon wrote that his father Sennacherib had conquered “the city Adumutu, the fortress of the Arabs”, and carried its gods to Assyria together with the queen of the Arabs; when Hazael, king of the Arabs, came to Nineveh with gifts, Esarhaddon gave the gods back and set the princess Tabua over the Arabs. Today Dumat al-Jandal is a town of the Al-Jouf province of Saudi Arabia, near Sakaka, with the Marid castle and the Umar mosque in its old quarter; a Saudi, Italian and French mission excavated the oasis from 2009."
  ru:
    - "Дума — название короткого пророчества у Исаии. В ходу два прочтения. Дума был сыном Измаила, и его имя сохранилось в Думат-эль-Джандале, оазисе северной Аравии у юго-восточного конца Вади-Сирхан; следующее у Исаии пророчество — «Пророчество об Аравии» с караванами Деданскими — подходит к этому прочтению. Но голос звучит «с Сеира», горы Едома, а греческая Септуагинта передаёт Думу как Идумею, и потому другие, в их числе Франц Делич, видят в имени Дума, «молчание», игру на имени Едом. Это не Дума в горной Иудее."
    - "Пророчество — диалог в несколько строк: «Пророчество о Думе. — Кричат мне с Сеира: сторож! сколько ночи? сторож! сколько ночи?» — и ответ: «Сторож отвечает: приближается утро, но еще ночь. Если вы настоятельно спрашиваете, то обратитесь и приходите»."
    - "Оазис — это ассирийский Адумуту. Асархаддон писал, что его отец Синаххериб завоевал «город Адумуту, крепость арабов» и увёл его богов в Ассирию вместе с царицей арабов; когда Хазаил, царь арабов, пришёл в Ниневию с дарами, Асархаддон вернул ему богов и поставил над арабами царевну Табуа. Сегодня Думат-эль-Джандаль — город провинции Эль-Джауф в Саудовской Аравии, близ Сакаки, с замком Марид и мечетью Умара в старом квартале; с 2009 г. оазис раскапывала саудовско-итало-французская экспедиция."
  uk:
    - "Дума — назва короткого пророцтва в Ісаї. Побутують два прочитання. Дума був сином Ізмаїла, і його ім'я збереглося в Думат-ель-Джандалі, оазі північної Аравії на південно-східному кінці вади Сірхан; пророцтво, що йде далі в Ісаї, «слово пророче про Арабію», з караванами Дедана, пасує до цього прочитання. Але голос лунає «з Сеїру», гори Едому, а грецька Септуагінта передає Думу як Ідумею, тож інші, серед них Франц Деліч, вважають, що Дума, «мовчання», — гра слів на назві Едом. Це не Дума в юдейських горах."
    - "Пророцтво — діалог у кілька рядків: «Пророцтво про Думу: Покликають до мене з Сеїру: Стороже! яка пора ночі? стороже! яка пора ночі?» і відповідь: «Надходить поранок, та ще ніч. Коли так пильно допитуєтесь, то обернїться й приходїть»."
    - "Оаза була ассирійською Адумуту. Асархаддон писав, що його батько Сінаххеріб підкорив «місто Адумуту, фортецю арабів», і вивіз його богів до Ассирії разом з царицею арабів; коли Азаїл, цар арабів, прийшов до Ніневії з дарами, Асархаддон повернув богів і поставив над арабами царівну Табуа. Нині Думат-ель-Джандаль — місто провінції Ель-Джауф у Саудівській Аравії, поблизу Сакаки, зі замком Марід і мечеттю Умара в старому кварталі; саудівсько-італійсько-французька місія розкопувала оазу від 2009 р."
  es:
    - "Duma es el nombre de un breve oráculo de Isaías. Corren dos lecturas. Duma fue un hijo de Ismael, y su nombre pervive en Dumat al-Jandal, un oasis del norte de Arabia en el extremo sureste del Wadi Sirhan; el oráculo que sigue en Isaías, «Carga sobre Arabia», con sus caravanas de Dedán, encaja con esta lectura. Pero la voz viene «de Seir», el monte de Edom, y la Septuaginta griega traduce Duma por Idumea, de modo que otros, entre ellos Franz Delitzsch, toman Duma, «silencio», como un juego con el nombre de Edom. No es la Duma de la región montañosa de Judá."
    - "El oráculo es un diálogo de pocas líneas: «Carga de Duma. Danme voces de Seir: Guarda, ¿qué de la noche? Guarda, ¿qué de la noche?», y la respuesta: «La mañana viene, y después la noche: si preguntareis, preguntad; volved, venid»."
    - "El oasis era la Adumutu de los asirios. Esar-hadón escribió que su padre Senaquerib había conquistado «la ciudad de Adumutu, la fortaleza de los árabes», y llevado sus dioses a Asiria junto con la reina de los árabes; cuando Hazael, rey de los árabes, llegó a Nínive con regalos, Esar-hadón devolvió los dioses y puso a la princesa Tabua al frente de los árabes. Hoy Dumat al-Jandal es una población de la provincia de Al-Jouf, en Arabia Saudí, cerca de Sakaka, con el castillo de Marid y la mezquita de Umar en su barrio antiguo; una misión saudí, italiana y francesa excavó el oasis a partir de 2009."
  pt:
    - "Dumá é o nome de um breve oráculo em Isaías. Duas leituras são correntes. Dumá foi um filho de Ismael, e seu nome sobrevive em Dumat al-Jandal, um oásis do norte da Arábia, na extremidade sudeste do uádi Sirhan; o oráculo que se segue em Isaías, “o peso sobre a Arábia”, com suas caravanas de Dedã, combina com essa leitura. Mas a voz vem “de Seir”, o monte de Edom, e a Septuaginta grega traduz Dumá por Iduméia, de modo que outros, Franz Delitzsch entre eles, tomam Dumá, “silêncio”, como um jogo com o nome Edom. Não é a Dumá da região montanhosa de Judá."
    - "O oráculo é um diálogo de poucas linhas: “O peso de Dumá. Alguém clama a mim de Seir: ‘Vigia, como está a noite? Vigia, como está a noite?’” e a resposta: “‘A manhã vem, e também a noite. Se vocês querem perguntar, perguntem. Voltem novamente.’”"
    - "O oásis era a Adumutu dos assírios. Esar-Hadom escreveu que seu pai Senaqueribe conquistara “a cidade de Adumutu, a fortaleza dos árabes”, e levara seus deuses para a Assíria junto com a rainha dos árabes; quando Hazael, rei dos árabes, veio a Nínive com presentes, Esar-Hadom devolveu os deuses e pôs a princesa Tabua sobre os árabes. Hoje Dumat al-Jandal é uma cidade da província de Al-Jouf, na Arábia Saudita, perto de Sakaka, com o castelo de Marid e a mesquita de Omar em seu bairro antigo; uma missão saudita, italiana e francesa escavou o oásis a partir de 2009."
  de:
    - "Duma ist der Name eines kurzen Spruches bei Jesaja. Zwei Deutungen sind im Umlauf. Duma war ein Sohn Ismaels, und sein Name lebt in Dumat al-Dschandal fort, einer Oase Nordarabiens am Südostende des Wadi Sirhan; der Spruch, der bei Jesaja folgt, „die Last über Arabien“, mit seinen Karawanen der Dedaniter, passt zu dieser Deutung. Doch die Stimme kommt „aus Seir“, dem Gebirge Edoms, und die griechische Septuaginta gibt Duma mit Idumäa wieder, sodass andere, darunter Franz Delitzsch, Duma, „Schweigen“, als Wortspiel mit dem Namen Edom verstehen. Es ist nicht das Duma im Bergland von Juda."
    - "Der Spruch ist ein Zwiegespräch von wenigen Zeilen: „Dies ist die Last über Duma: Man ruft zu mir aus Seir: Hüter, ist die Nacht schier hin? Hüter ist die Nacht schier hin?“ und die Antwort: „Wenn der Morgen schon kommt, so wird es doch Nacht sein. Wenn ihr schon fragt, so werdet ihr doch wieder kommen und wieder fragen.“"
    - "Die Oase war das Adumutu der Assyrer. Asarhaddon schrieb, sein Vater Sanherib habe „die Stadt Adumutu, die Festung der Araber“, erobert und ihre Götter zusammen mit der Königin der Araber nach Assyrien gebracht; als Hasael, der König der Araber, mit Geschenken nach Ninive kam, gab Asarhaddon die Götter zurück und setzte die Prinzessin Tabua über die Araber. Heute ist Dumat al-Dschandal eine Stadt der Provinz al-Dschauf in Saudi-Arabien, nahe Sakaka, mit der Marid-Burg und der Omar-Moschee in ihrem alten Viertel; eine saudisch-italienisch-französische Mission grub ab 2009 in der Oase."
  fr:
    - "Duma est le nom d’un bref oracle d’Ésaïe. Deux lectures ont cours. Duma fut un fils d’Ismaël, et son nom survit dans Dumat al-Jandal, oasis du nord de l’Arabie, à l’extrémité sud-est de l’ouadi Sirhan ; l’oracle qui suit dans Ésaïe, « Oracle sur l’Arabie », avec ses caravanes de Dedan, s’accorde avec cette lecture. Mais la voix vient « de Séir », la montagne d’Édom, et la Septante grecque rend Duma par Idumée ; aussi d’autres, dont Franz Delitzsch, voient dans Duma, « silence », un jeu de mots sur le nom d’Édom. Ce n’est pas la Duma de la montagne de Juda."
    - "L’oracle est un dialogue de quelques lignes : « Oracle sur Duma. On me crie de Séir : Sentinelle, que dis-tu de la nuit ? Sentinelle, que dis-tu de la nuit ? » et la réponse : « Le matin vient, et la nuit aussi. Si vous voulez interroger, interrogez ; convertissez-vous, et revenez. »"
    - "L’oasis était l’Adumutu des Assyriens. Esar-Haddon écrivit que son père Sanchérib avait conquis « la ville d’Adumutu, forteresse des Arabes », et emporté ses dieux en Assyrie avec la reine des Arabes ; quand Hazaël, roi des Arabes, vint à Ninive avec des présents, Esar-Haddon rendit les dieux et plaça la princesse Tabua à la tête des Arabes. Aujourd’hui, Dumat al-Jandal est une ville de la province d’Al-Jouf, en Arabie saoudite, près de Sakaka, avec le château de Marid et la mosquée d’Omar dans son vieux quartier ; une mission saoudo-italo-française a fouillé l’oasis à partir de 2009."
  it:
    - "Duma è il nome di un breve oracolo di Isaia. Sono correnti due letture. Duma fu un figlio di Ismaele, e il suo nome sopravvive in Dumat al-Jandal, un’oasi dell’Arabia settentrionale all’estremità sud-orientale del Wadi Sirhan; l’oracolo che segue in Isaia, «Oracolo contro l’Arabia», con le sue carovane dei Dedaniti, si accorda con questa lettura. Ma la voce viene «da Seir», il monte di Edom, e la Settanta greca rende Duma come Idumea, così altri, tra cui Franz Delitzsch, intendono Duma, «silenzio», come un gioco di parole sul nome Edom. Non è la Duma delle montagne di Giuda."
    - "L’oracolo è un dialogo di poche righe: «Oracolo contro Duma. Mi si grida da Seir: “Sentinella, a che punto è la notte? Sentinella, a che punto è la notte?”» e la risposta: «Vien la mattina, e vien anche la notte. Se volete interrogare, interrogate pure; tornate un’altra volta»."
    - "L’oasi era l’Adumutu degli Assiri. Assaraddon scrisse che suo padre Sennacherib aveva conquistato «la città di Adumutu, la fortezza degli Arabi», e ne aveva portato gli dèi in Assiria insieme alla regina degli Arabi; quando Cazaèl, re degli Arabi, venne a Ninive con doni, Assaraddon restituì gli dèi e pose la principessa Tabua a capo degli Arabi. Oggi Dumat al-Jandal è una città della provincia di Al-Jouf, in Arabia Saudita, presso Sakaka, con il castello di Marid e la moschea di Umar nel suo quartiere vecchio; una missione saudita, italiana e francese ha scavato l’oasi a partire dal 2009."
  nl:
    - "Duma is de naam van een korte godsspraak in Jesaja. Er zijn twee lezingen gangbaar. Duma was een zoon van Ismaël, en zijn naam leeft voort in Dumat al-Jandal, een oase in het noorden van Arabië aan het zuidoostelijke uiteinde van de Wadi Sirhan; de godsspraak die in Jesaja volgt, “de last tegen Arabië”, met haar karavanen van Dedan, past bij deze lezing. Maar de stem komt “uit Seir”, het gebergte van Edom, en de Griekse Septuaginta geeft Duma weer als Idumea, zodat anderen, onder wie Franz Delitzsch, Duma, ‘stilte’, opvatten als een woordspeling op de naam Edom. Het is niet het Duma in het bergland van Juda."
    - "De godsspraak is een dialoog van enkele regels: “De last van Duma. Men roept tot mij uit Seir: Wachter! wat is er van den nacht? Wachter! wat is er van den nacht?” en het antwoord: “De morgenstond is gekomen, en het is nog nacht; wilt gijlieden vragen, vraagt; keert weder, komt.”"
    - "De oase was het Adumutu van de Assyriërs. Esarhaddon schreef dat zijn vader Sanherib “de stad Adumutu, de vesting van de Arabieren” had veroverd en haar goden samen met de koningin van de Arabieren naar Assyrië had weggevoerd; toen Hazaël, koning van de Arabieren, met geschenken naar Nineve kwam, gaf Esarhaddon de goden terug en stelde de prinses Tabua over de Arabieren aan. Tegenwoordig is Dumat al-Jandal een stad in de provincie Al-Jouf van Saoedi-Arabië, bij Sakaka, met het kasteel Marid en de Umar-moskee in haar oude wijk; een Saoedisch-Italiaans-Franse missie groef vanaf 2009 in de oase."
  pl:
    - "Duma to nazwa krótkiej wyroczni u Izajasza. Przyjmuje się dwa odczytania. Duma był synem Izmaela, a jego imię przetrwało w Dumat al-Dżandal, oazie północnej Arabii na południowo-wschodnim krańcu Wadi Sirhan; wyrocznia, która następuje u Izajasza, „Brzemię na Arabiję”, z karawanami Dedanu, pasuje do tego odczytania. Lecz głos dochodzi „z Seiru”, góry Edomu, a grecka Septuaginta oddaje Dumę jako Idumeę, więc inni, między nimi Franz Delitzsch, uważają Dumę, „milczenie”, za grę słów z nazwą Edom. To nie jest Duma w górach judzkich."
    - "Wyrocznia jest dialogiem kilku wersów: „Brzemię Dumy. Woła na mię ktoś z Seiru: Hej, stróżu! co się stało w nocy? Stróżu! co się stało w nocy?” i odpowiedź: „Przyszedł poranek, także i noc. Chcecieli szukać, szukajcie, nawróćcie się a przyjdźcie”."
    - "Oaza była asyryjskim Adumutu. Asarhaddon napisał, że jego ojciec Sennacheryb zdobył „miasto Adumutu, twierdzę Arabów”, i uprowadził jego bogów do Asyrii wraz z królową Arabów; gdy Chazael, król Arabów, przybył do Niniwy z darami, Asarhaddon oddał bogów i ustanowił nad Arabami księżniczkę Tabuę. Dziś Dumat al-Dżandal jest miastem prowincji Al-Dżauf w Arabii Saudyjskiej, koło Sakaki, z zamkiem Marid i meczetem Umara w starej dzielnicy; saudyjsko-włosko-francuska misja prowadziła wykopaliska w oazie od 2009 roku."
  cs:
    - "Dúma je jméno krátkého proroctví u Izajáše. Kolují dva výklady. Dúma byl synem Jišmaelovým a jeho jméno se zachovalo v Dúmat al-Džandal, oáze v severní Arábii na jihovýchodním konci Wádí Sirhán; proroctví, které následuje u Izajáše, „břímě na Arabii“ s karavanami Dedanských, tomuto výkladu odpovídá. Hlas však přichází „z Seir“, hory Edómu, a řecká Septuaginta překládá Dúmu jako Idumea, takže jiní, mezi nimi Franz Delitzsch, pokládají Dúmu, „ticho“, za slovní hříčku na jméno Edóm. Není to Dúma v judském pohoří."
    - "Proroctví je dialog o několika řádcích: „Břímě Dumy. Slyším hlas z Seir: Strážný, co bylo v noci? Strážný, co se stalo v noci?“ a odpověď: „Přišlo jitro, a tolikéž noc; chcete-li hledati, hledejte. Navraťte se, přiďte.“"
    - "Oáza byla u Asyřanů Adumutu. Asarhadón napsal, že jeho otec Senacherib dobyl „město Adumutu, pevnost Arabů“, a odvedl jeho bohy do Asýrie spolu s královnou Arabů; když Chazael, král Arabů, přišel do Ninive s dary, Asarhadón bohy vrátil a nad Araby ustanovil princeznu Tabúu. Dnes je Dúmat al-Džandal městem provincie Džauf v Saúdské Arábii, poblíž Sakáky, s pevností Márid a mešitou Umara ve starém městě; saúdsko-italsko-francouzská mise oázu zkoumala od roku 2009."
