body:
  en:
    - "Cuth, or Cuthah, was a city of Babylonia some 30 km north-east of Babylon, the seat of Nergal, god of the underworld, whose temple there was called E-meslam. It is identified with Tell Ibrahim, a crescent of mounds between Babylon and Baghdad named after a local shrine of Abraham: in 1845 Henry Rawlinson saw there a brick of Nebuchadnezzar II naming the city, and Hormuzd Rassam dug briefly in 1881. Cuthah appears in Mesopotamian records from the third millennium BC to the Persian period, but the mound has never been properly excavated, and little is known of the town itself."
    - "The Bible names it twice in one chapter. After the fall of Samaria in 722 BC “the king of Assyria brought men from Babylon, and from Cuthah, and from Ava, and from Hamath, and from Sepharvaim, and placed them in the cities of Samaria instead of the children of Israel”; Sargon II's own inscriptions record his settling of deportees in Samaria. Each group kept its gods, and “the men of Cuth made Nergal”, which fits what is known of the city. From these settlers the later Samaritans were called Cuthaeans: Josephus uses the name, and it is the usual one for them in rabbinic literature."
    - "Today Tell Ibrahim lies in the Babil governorate of Iraq; the temple of Nergal has never been found."
  ru:
    - "Кута — город Вавилонии примерно в 30 км к северо-востоку от Вавилона, обитель Нергала, бога подземного мира, чей храм там носил имя Э-Меслам. Её отождествляют с Телль-Ибрахимом, полукругом холмов между Вавилоном и Багдадом, названным по местной святыне Авраама: в 1845 году Генри Роулинсон увидел там кирпич Навуходоносора II с именем города, а в 1881 году Ормузд Рассам недолго копал. Кута упоминается в месопотамских источниках с третьего тысячелетия до н. э. до персидского времени, но холм так и не был раскопан по-настоящему, и о самом городе известно немного."
    - "Библия называет её дважды в одной главе. После падения Самарии в 722 г. до н. э. «перевел царь Ассирийский людей из Вавилона, и из Куты, и из Аввы, и из Емафа, и из Сепарваима, и поселил их в городах Самарийских вместо сынов Израилевых»; собственные надписи Саргона II говорят о расселении переселенцев в Самарии. Каждая группа сохранила своих богов, и «Кутийцы сделали Нергала», что сходится с тем, что известно о городе. По этим переселенцам позднейших самарян звали кутийцами: это имя употребляет Иосиф Флавий, и оно обычно для них в раввинистической литературе."
    - "Сегодня Телль-Ибрахим лежит в провинции Бабиль в Ираке; храм Нергала так и не найден."
  uk:
    - "Кута, або Кутха, було містом Вавилонії приблизно за 30 км на північний схід від Вавилона, осередком Нергала, бога підземного світу, чий храм там звався Е-мешлам. Його ототожнюють із Телль-Ібрагімом, півмісяцем пагорбів між Вавилоном і Багдадом, названим на честь місцевого святилища Авраама: у 1845 р. Генрі Роулінсон побачив там цеглину Навуходоносора II з назвою міста, а Гормузд Рассам коротко копав у 1881 р. Кутха з'являється в месопотамських записах від III тис. до н. е. до персидського періоду, але пагорб ніколи не був як слід розкопаний, і про саме місто відомо мало."
    - "Біблія називає його двічі в одному розділі. Після падіння Самарії в 722 р. до н. е. «попереводив царь Ассирийський людей з Вавилону, з Кути, з Ави, з Емату й Сефарваїму та й оселив намість синів Ізрайлевих по городах Самарийських»; власні написи Саргона II засвідчують його поселення переселенців у Самарії. Кожна група зберегла своїх богів, і «Кутяне зробили Нергала», що збігається з відомим про це місто. Від цих поселенців пізніших самарян називали кутеями: Йосиф Флавій вживає це ім'я, і воно є звичайним для них у рабинській літературі."
    - "Сьогодні Телль-Ібрагім лежить у провінції Бабіль в Іраку; храм Нергала так і не знайдено."
  es:
    - "Cuta, o Cutá, era una ciudad de Babilonia a unos 30 km al nordeste de Babilonia, sede de Nergal, dios del inframundo, cuyo templo allí se llamaba E-meslam. Se identifica con Tell Ibrahim, una media luna de montículos entre Babilonia y Bagdad que lleva el nombre de un santuario local de Abraham: en 1845 Henry Rawlinson vio allí un ladrillo de Nabucodonosor II que nombraba la ciudad, y Hormuzd Rassam excavó brevemente en 1881. Cuta aparece en los registros mesopotámicos desde el tercer milenio a. C. hasta el periodo persa, pero el montículo nunca ha sido excavado como es debido, y poco se sabe de la ciudad misma."
    - "La Biblia la nombra dos veces en un mismo capítulo. Tras la caída de Samaria en el 722 a. C., «trajo el rey de Asiria gente de Babilonia, y de Cutha, y de Ava, y de Hamath, y de Sepharvaim, y púsolos en las ciudades de Samaria, en lugar de los hijos de Israel»; las propias inscripciones de Sargón II registran su asentamiento de deportados en Samaria. Cada grupo conservó sus dioses, y «los de Cutha hicieron á Nergal», lo que concuerda con lo que se sabe de la ciudad. De estos colonos los samaritanos posteriores fueron llamados cuteos: Josefo usa el nombre, y es el habitual para ellos en la literatura rabínica."
    - "Hoy Tell Ibrahim se halla en la gobernación iraquí de Babil; el templo de Nergal no ha sido hallado nunca."
  pt:
    - "Cuta, ou Cutá, era uma cidade da Babilônia a uns 30 km a nordeste da Babilônia, sede de Nergal, deus do mundo dos mortos, cujo templo ali se chamava E-meslam. É identificada com Tell Ibrahim, um crescente de montes entre a Babilônia e Bagdá, assim chamado por um santuário local de Abraão: em 1845, Henry Rawlinson viu ali um tijolo de Nabucodonosor II que nomeava a cidade, e Hormuzd Rassam escavou brevemente em 1881. Cuta aparece nos registros mesopotâmicos desde o terceiro milênio a.C. até o período persa, mas o monte nunca foi devidamente escavado, e pouco se sabe da própria cidade."
    - "A Bíblia a nomeia duas vezes num mesmo capítulo. Depois da queda de Samaria em 722 a.C., “O rei da Assíria trouxe pessoas da Babilônia, de Cuta, de Ava, de Hamate e de Sefarvaim, e as colocou nas cidades de Samaria em lugar dos filhos de Israel”; as próprias inscrições de Sargão II registram que ele fixou deportados em Samaria. Cada grupo conservou seus deuses, e “os homens de Cuta fizeram Nergal”, o que concorda com o que se sabe da cidade. Desses colonos os samaritanos posteriores foram chamados cuteus: Josefo usa o nome, e ele é o habitual para eles na literatura rabínica."
    - "Hoje Tell Ibrahim fica na província de Babil, no Iraque; o templo de Nergal nunca foi encontrado."
  de:
    - "Kuta, oder Kutha, war eine Stadt in Babylonien, etwa 30 km nordöstlich von Babylon, Sitz des Nergal, des Gottes der Unterwelt, dessen Tempel dort E-meslam hieß. Sie wird mit Tell Ibrahim gleichgesetzt, einem Halbmond aus Hügeln zwischen Babylon und Bagdad, der nach einem örtlichen Abrahamsheiligtum benannt ist: 1845 sah Henry Rawlinson dort einen Ziegel Nebukadnezars II., der die Stadt nennt, und Hormuzd Rassam grub 1881 kurz. Kutha erscheint in mesopotamischen Quellen vom 3. Jahrtausend v. Chr. bis zur Perserzeit, doch der Hügel ist nie ordentlich ausgegraben worden, und über die Stadt selbst ist wenig bekannt."
    - "Die Bibel nennt sie zweimal in einem Kapitel. Nach dem Fall Samarias 722 v. Chr. heißt es: „Der König aber von Assyrien ließ kommen Leute von Babel, von Kutha, von Avva, von Hamath und Sepharvaim und setzte sie in die Städte in Samaria anstatt der Kinder Israel“; Sargons II. eigene Inschriften berichten von seiner Ansiedlung Deportierter in Samaria. Jede Gruppe behielt ihre Götter, und „die von Chut machten Nergal“, was zu dem passt, was von der Stadt bekannt ist. Nach diesen Siedlern wurden die späteren Samaritaner Kuthäer genannt: Josephus gebraucht den Namen, und in der rabbinischen Literatur ist er die übliche Bezeichnung für sie."
    - "Heute liegt Tell Ibrahim im irakischen Gouvernement Babil; der Tempel des Nergal ist nie gefunden worden."
  fr:
    - "Cuth, ou Cutha, était une ville de Babylonie à quelque 30 km au nord-est de Babylone, siège de Nergal, dieu des enfers, dont le temple s’appelait E-meslam. On l’identifie à Tell Ibrahim, un croissant de tertres entre Babylone et Bagdad qui porte le nom d’un sanctuaire local d’Abraham : en 1845, Henry Rawlinson y vit une brique de Nebucadnetsar II nommant la ville, et Hormuzd Rassam y fouilla brièvement en 1881. Cutha apparaît dans les sources mésopotamiennes du IIIe millénaire av. J.-C. à l’époque perse, mais le tertre n’a jamais été fouillé correctement, et l’on sait peu de chose de la ville elle-même."
    - "La Bible la nomme deux fois dans un même chapitre. Après la chute de Samarie en 722 av. J.-C., « le roi d’Assyrie fit venir des gens de Babylone, de Cutha, d’Avva, de Hamath et de Sepharvaïm, et les établit dans les villes de Samarie à la place des enfants d’Israël » ; les inscriptions de Sargon II lui-même rapportent l’installation de déportés à Samarie. Chaque groupe garda ses dieux, et « les gens de Cuth firent Nergal », ce qui s’accorde avec ce que l’on sait de la ville. De ces colons, les Samaritains ultérieurs furent appelés Cuthéens : Josèphe emploie le nom, et c’est le nom habituel dans la littérature rabbinique."
    - "Aujourd’hui, Tell Ibrahim se trouve dans le gouvernorat de Babil, en Irak ; le temple de Nergal n’a jamais été retrouvé."
  it:
    - "Cuta, o Cutha, era una città della Babilonia a circa 30 km a nord-est di Babilonia, sede di Nergal, dio degli inferi, il cui tempio là si chiamava E-meslam. Si identifica con Tell Ibrahim, una mezzaluna di tell fra Babilonia e Baghdad, così detta da un santuario locale di Abramo: nel 1845 Henry Rawlinson vi vide un mattone di Nabucodonosor II che nominava la città, e Hormuzd Rassam vi scavò brevemente nel 1881. Cutha compare nelle fonti mesopotamiche dal III millennio a.C. al periodo persiano, ma il tell non è mai stato scavato come si deve, e della città si sa poco."
    - "La Bibbia la nomina due volte nello stesso capitolo. Dopo la caduta di Samaria nel 722 a.C. «il re d’Assiria fece venir genti da Babilonia, da Cutha, da Avva, da Hamath e da Sefarvaim, e le stabilì nelle città della Samaria in luogo dei figliuoli d’Israele»; le stesse iscrizioni di Sargon II ricordano il suo insediamento di deportati a Samaria. Ciascun gruppo conservò i propri dèi, e «quelli di Cuth fecero Nergal», il che concorda con ciò che si sa della città. Da questi coloni i Samaritani posteriori furono chiamati Cutei: Giuseppe Flavio usa il nome, ed è quello abituale per loro nella letteratura rabbinica."
    - "Oggi Tell Ibrahim si trova nel governatorato iracheno di Babil; il tempio di Nergal non è mai stato trovato."
  pl:
    - "Kuta, czyli Kutha, było miastem w Babilonii około 30 km na północny wschód od Babilonu, siedzibą Nergala, boga podziemi, którego świątynia nazywała się tam E-meslam. Utożsamia się je z Tell Ibrahim, sierpem kopców między Babilonem a Bagdadem, nazwanym od miejscowego sanktuarium Abrahama: w 1845 r. Henry Rawlinson zobaczył tam cegłę Nabuchodonozora II wymieniającą miasto, a Hormuzd Rassam krótko prowadził tam wykopaliska w 1881 r. Kutha pojawia się w źródłach mezopotamskich od III tysiąclecia p.n.e. po okres perski, lecz kopca nigdy porządnie nie zbadano wykopaliskami i o samym mieście wiadomo niewiele."
    - "Biblia wymienia je dwukrotnie w jednym rozdziale. Po upadku Samarii w 722 r. p.n.e. „przyprowadził król Assyryjski lud z Babilonu, i z Kuta, i z Awa, i z Emat, i z Sefarwaim, a osadził je w miastach Samaryi miasto synów Izraelskich”; własne inskrypcje Sargona II zapisują jego osiedlanie deportowanych w Samarii. Każda grupa zachowała swoich bogów, a „mężowie Kutscy uczynili Nergiel”, co zgadza się z tym, co wiadomo o mieście. Od tych osadników późniejszych Samarytan nazywano Kutejczykami: używa tej nazwy Józef Flawiusz i jest ona zwykłą dla nich w literaturze rabinicznej."
    - "Dziś Tell Ibrahim leży w muhafazie Babil w Iraku; świątyni Nergala nigdy nie odnaleziono."
  nl:
    - "Cuta, of Cutha, was een stad in Babylonië, zo'n 30 km ten noordoosten van Babylon, de zetel van Nergal, god van de onderwereld, wiens tempel daar E-meslam heette. Zij wordt geïdentificeerd met Tell Ibrahim, een halvemaan van heuvels tussen Babylon en Bagdad, genoemd naar een plaatselijk heiligdom van Abraham: in 1845 zag Henry Rawlinson daar een baksteen van Nebukadnessar II met de naam van de stad, en Hormuzd Rassam groef er kort in 1881. Cutha komt voor in Mesopotamische bronnen van het derde millennium v.Chr. tot de Perzische tijd, maar de heuvel is nooit behoorlijk opgegraven, en over de stad zelf is weinig bekend."
    - "De Bijbel noemt haar tweemaal in één hoofdstuk. Na de val van Samaria in 722 v.Chr. staat er: “De koning nu van Assyrië bracht volk van Babel, en van Chuta, en van Avva, en van Hamath, en Sefarvaim, en deed hen wonen in de steden van Samaria, in de plaats der kinderen Israëls”; Sargon II's eigen inscripties vermelden zijn vestiging van gedeporteerden in Samaria. Elke groep behield haar goden, en “de lieden van Chut maakten Nergal”, wat past bij wat van de stad bekend is. Naar deze kolonisten werden de latere Samaritanen Cutheeërs genoemd: Flavius Josephus gebruikt de naam, en in de rabbijnse literatuur is het de gebruikelijke."
    - "Tegenwoordig ligt Tell Ibrahim in het Iraakse gouvernement Babil; de tempel van Nergal is nooit gevonden."
  cs:
    - "Kúta, též Kúthá, bylo město v Babylonii asi 30 km severovýchodně od Babylóna, sídlo Nergala, boha podsvětí, jehož chrám tam se nazýval E-meslam. Ztotožňuje se s Tell Ibrahim, půlměsícem pahorků mezi Babylónem a Bagdádem pojmenovaným po místní svatyni Abrahamově: roku 1845 tam Henry Rawlinson viděl cihlu Nebukadnesara II. jmenující město a Hormuzd Rassam tam roku 1881 krátce kopal. Kúta se objevuje v mezopotámských záznamech od 3. tisíciletí př. n. l. do perského období, ale pahorek nebyl nikdy řádně vykopán a o samém městě se ví málo."
    - "Bible jej jmenuje dvakrát v jedné kapitole. Po pádu Samaří roku 722 př. n. l. „král Assyrský přivedl lidi z Babylona, a z Kut a z Ava, a z Emat a z Sefarvaim, a osadil je v městech Samařských místo synů Izraelských“; vlastní nápisy Sargona II. zaznamenávají jeho usazování vyhnanců v Samaří. Každá skupina si zachovala své bohy a „muži pak Kutští udělali Nergale“, což odpovídá tomu, co se o městě ví. Podle těchto osadníků byli pozdější Samaritáni nazýváni Kutejci: Josephus toho jména užívá a je to obvyklé pojmenování pro ně v rabínské literatuře."
    - "Dnes leží Tell Ibrahim v guvernorátu Babil v Iráku; chrám Nergalův nebyl nikdy nalezen."
  sv:
    - "Kuta, eller Kuthah, var en stad i Babylonien omkring 30 km nordost om Babylon, säte för Nergal, underjordens gud, vars tempel där hette E-meslam. Den identifieras med Tell Ibrahim, en halvmåneformad kullrad mellan Babylon och Bagdad, uppkallad efter en lokal Abrahamshelgedom: 1845 såg Henry Rawlinson där en tegelsten av Nebukadnessar II som nämner staden, och Hormuzd Rassam grävde kort 1881. Kuta förekommer i mesopotamiska källor från tredje årtusendet f.Kr. till persisk tid, men kullen har aldrig grävts ut ordentligt, och litet är känt om själva staden."
    - "Bibeln nämner den två gånger i ett kapitel. Efter Samarias fall 722 f.Kr. berättas det att ”konungen i Assyrien lät folk komma från Babel, Kuta, Ava, Hamat och Sefarvaim och bosätta sig i Samariens städer, i Israels barns ställe”; Sargon II:s egna inskriptioner berättar om hans bosättande av deporterade i Samarien. Varje grupp behöll sina gudar, och ”folket ifrån Kut gjorde sig en Nergal”, vilket stämmer med vad man vet om staden. Efter dessa nybyggare kallades de senare samariterna kutéer: Josefus använder namnet, och det är det vanliga för dem i rabbinsk litteratur."
    - "I dag ligger Tell Ibrahim i Iraks provins Babil; Nergals tempel har aldrig hittats."
  nb:
    - "Kuta, eller Kutha, var en by i Babylonia omkring 30 km nordøst for Babylon, sete for Nergal, underverdenens gud, hvis tempel der het E-meslam. Den identifiseres med Tell Ibrahim, en halvmåne av hauger mellom Babylon og Bagdad oppkalt etter en lokal Abraham-helligdom: i 1845 så Henry Rawlinson der en murstein av Nebukadnesar II som nevnte byen, og Hormuzd Rassam gravde kort i 1881. Kutha forekommer i mesopotamiske kilder fra det tredje årtusen f.Kr. til persertiden, men haugen er aldri skikkelig gravd ut, og lite er kjent om selve byen."
    - "Bibelen nevner den to ganger i ett kapittel. Etter Samarias fall i 722 f.Kr. «lot kongen i Assyria det komme folk fra Babel og Kuta og Avva og Hamat og Sefarva'im og lot dem bo i Samarias byer istedenfor Israels barn»; Sargon II selv opplyser i sine innskrifter at han bosatte deporterte i Samaria. Hver gruppe beholdt sine guder, og mennene fra Kut gjorde «et billede av Nergal», noe som stemmer med det man vet om byen. Av disse bosetterne ble de senere samaritanerne kalt kutittene: Josefus bruker navnet, og det er det vanlige om dem i rabbinsk litteratur."
    - "I dag ligger Tell Ibrahim i Babil-guvernementet i Irak; Nergals tempel er aldri funnet."
  tl:
    - "Ang Cutha, o Cuthah, ay isang lungsod ng Babilonia mga 30 km sa hilagang-silangan ng lungsod ng Babilonia, luklukan ni Nergal, diyos ng daigdig ng mga patay, na ang templo roon ay tinawag na E-meslam. Kinikilala ito sa Tell Ibrahim, isang gasuklay ng mga tel sa pagitan ng Babilonia at Baghdad na ipinangalan sa isang lokal na dambana ni Abraham: noong 1845 nakita roon ni Henry Rawlinson ang isang laryo ni Nabucodonosor II na may pangalan ng lungsod, at humukay nang sandali si Hormuzd Rassam noong 1881. Lumilitaw ang Cutha sa mga talaan ng Mesopotamia mula sa ika-3 milenyo BK hanggang sa panahong Persiano, ngunit hindi pa wastong nahukay ang tel, at kaunti lamang ang alam tungkol sa bayan mismo."
    - "Dalawang ulit itong pinangalanan ng Bibliya sa iisang kabanata. Pagkatapos ng pagbagsak ng Samaria noong 722 BK, “ang hari sa Asiria ay nagdala ng mga tao na mula sa Babilonia, at sa Cutha, at sa Ava, at sa Hamath at sa Sepharvaim, at inilagay sila sa mga bayan ng Samaria na kahalili ng mga anak ni Israel”; itinatala mismo ng mga inskripsiyon ni Sargon II ang pagpapatira niya ng mga ipinatapon sa Samaria. Pinanatili ng bawat pangkat ang kanilang mga diyos, at “itinayo ng mga lalake sa Cutha ang Nergal”, na tugma sa nalalaman tungkol sa lungsod. Mula sa mga naninirahang ito, tinawag na mga Cuteo ang mga Samaritano nang maglaon: ginagamit ni Josefo ang pangalan, at ito ang karaniwang tawag sa kanila sa panitikang rabiniko."
    - "Ang Tell Ibrahim ay nasa gobernadurya ng Babil ng Iraq ngayon; hindi pa natagpuan ang templo ni Nergal."
  da:
    - "Kuta, eller Kutha, var en by i Babylonien cirka 30 km nordøst for Babylon, sæde for Nergal, underverdenens gud, hvis tempel dér hed E-meslam. Den identificeres med Tell Ibrahim, en halvmåne af høje mellem Babylon og Bagdad, opkaldt efter en lokal Abrahams-helligdom: I 1845 så Henry Rawlinson dér en mursten af Nebukadnezar 2., der nævner byen, og Hormuzd Rassam gravede kortvarigt i 1881. Kutha optræder i mesopotamiske optegnelser fra 3. årtusinde f.Kr. til den persiske tid, men højen er aldrig blevet ordentligt udgravet, og der vides lidt om selve byen."
    - "Bibelen nævner den to gange i ét kapitel. Efter Samarias fald i 722 f.Kr. hedder det: »Kongen af Assyrien lod komme Folk af Babel og af Kut og af Ava og af Hamath og Sefarvajm og lod dem bo i Samarias Stæder, i Israels Børns Sted«; Sargon 2.s egne indskrifter beretter om hans bosættelse af deporterede i Samaria. Hver gruppe beholdt sine guder, og »de Mænd af Kut havde gjort Nergal«, hvilket passer med, hvad man ved om byen. Fra disse bosættere fik de senere samaritanere navnet kutæere: Josefus bruger navnet, og det er det sædvanlige for dem i rabbinsk litteratur."
    - "I dag ligger Tell Ibrahim i Iraks Babil-guvernement; Nergals tempel er aldrig fundet."
  sr:
    - "Хута, или Хутах, био је град у Вавилонији око 30 км североисточно од Вавилона, седиште Нергала, бога подземља, чији се тамошњи храм звао Е-меслам. Поистовећује се с Тел Ибрахимом, полумесецом хумки између Вавилона и Багдада названим по месном светилишту Аврама: 1845. Хенри Ролинсон је тамо видео циглу Навуходоносора II с именом града, а Хормузд Расам копао је накратко 1881. Хутах се појављује у месопотамским записима од 3. миленијума п. н. е. до персијског периода, али хумка никада није како треба ископана, и о самом граду зна се мало."
    - "Библија га именује двапут у једном поглављу. После пада Самарије 722. п. н. е. „Потом доведе цар асирски људе из Вавилона и из Хуте и из Аве и из Емата и из Сефарвима, и насели их у градовима самаријским место Израиљаца“; сами натписи Саргона II бележе његово насељавање депортованих у Самарију. Свака група сачувала је своје богове, и „Хућани начинише Нергала“, што се слаже с оним што се зна о граду. По тим досељеницима каснији Самаријани звани су Хућани: Јосиф Флавије употребљава то име, и оно је уобичајено за њих у рабинској књижевности."
    - "Данас Тел Ибрахим лежи у ирачком гувернорату Бабил; Нергалов храм никада није нађен."
