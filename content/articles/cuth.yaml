# Overview article (ADR 0007). Mainstream facts only; a minor place: the identification with Tell Ibrahim rests on inscribed bricks and is generally accepted; the mound is unexcavated.
id: cuth
place: a538831
title:
  en: "Cuth"
  ru: "Кута"
body:
  en:
    - "Cuth, or Cuthah, was a city of Babylonia some 30 km north-east of Babylon, the seat of Nergal, god of the underworld, whose temple there was called E-meslam. It is identified with Tell Ibrahim, a crescent of mounds between Babylon and Baghdad named after a local shrine of Abraham: in 1845 Henry Rawlinson saw there a brick of Nebuchadnezzar II naming the city, and Hormuzd Rassam dug briefly in 1881. Cuthah appears in Mesopotamian records from the third millennium BC to the Persian period, but the mound has never been properly excavated, and little is known of the town itself."
    - "The Bible names it twice in one chapter. After the fall of Samaria in 722 BC “the king of Assyria brought men from Babylon, and from Cuthah, and from Ava, and from Hamath, and from Sepharvaim, and placed them in the cities of Samaria instead of the children of Israel”; Sargon II's own inscriptions record his settling of deportees in Samaria. Each group kept its gods, and “the men of Cuth made Nergal”, which fits what is known of the city. From these settlers the later Samaritans were called Cuthaeans: Josephus uses the name, and it is the usual one for them in rabbinic literature."
    - "Today Tell Ibrahim lies in the Babil governorate of Iraq; the temple of Nergal has never been found."
  ru:
    - "Кута — город Вавилонии примерно в 30 км к северо-востоку от Вавилона, обитель Нергала, бога подземного мира, чей храм там носил имя Э-Меслам. Её отождествляют с Телль-Ибрахимом, полукругом холмов между Вавилоном и Багдадом, названным по местной святыне Авраама: в 1845 году Генри Роулинсон увидел там кирпич Навуходоносора II с именем города, а в 1881 году Ормузд Рассам недолго копал. Кута упоминается в месопотамских источниках с третьего тысячелетия до н. э. до персидского времени, но холм так и не был раскопан по-настоящему, и о самом городе известно немного."
    - "Библия называет её дважды в одной главе. После падения Самарии в 722 г. до н. э. «перевел царь Ассирийский людей из Вавилона, и из Куты, и из Аввы, и из Емафа, и из Сепарваима, и поселил их в городах Самарийских вместо сынов Израилевых»; собственные надписи Саргона II говорят о расселении переселенцев в Самарии. Каждая группа сохранила своих богов, и «Кутийцы сделали Нергала», что сходится с тем, что известно о городе. По этим переселенцам позднейших самарян звали кутийцами: это имя употребляет Иосиф Флавий, и оно обычно для них в раввинистической литературе."
    - "Сегодня Телль-Ибрахим лежит в провинции Бабиль в Ираке; храм Нергала так и не найден."
