# Overview article (ADR 0007). Mainstream facts only; the location is disputed and the map's candidates are given without choosing one.
id: arimathea
place: af3d9fc
title:
  en: "Arimathea"
  ru: "Аримафея"
  uk: "Аримафея"
  es: "Arimatea"
  pt: "Arimateia"
  de: "Arimathäa"
  fr: "Arimathée"
body:
  en:
    - "Arimathea is known only as the home town of Joseph, the member of the Sanhedrin who buried Jesus. Luke calls it “a city of the Jews”, which suggests a town in or near the Jewish hill country rather than in Galilee or a Greek city. All four Gospels name it. Matthew tells of “a rich man of Arimathæa, named Joseph, who also himself was Jesus' disciple”, who begged the body from Pilate, wrapped it in clean linen and “laid it in his own new tomb, which he had hewn out in the rock”; Mark calls him “an honourable counsellor, which also waited for the kingdom of God”, who “went in boldly unto Pilate”; Luke adds that he “had not consented to the counsel and deed of them”; John, that he was a disciple “secretly for fear of the Jews”, and that Nicodemus came with him."
    - "Where it stood is disputed, and the map keeps the candidates. The Greek name looks like Ramathaim, the home of Samuel, and Eusebius wrote that Armathem Sophim, Samuel's city, lay near Diospolis (Lydda) and was the Arimathea of the Gospels. That fits 1 Maccabees, which says the district of Ramathaim was transferred from Samaria to Judea in 145 BC, and points to Rantis (Rentis), a village about 15 km north-east of Lod on the edge of the hills, the choice most scholars make today. Others place Arimathea at Samuel's Ramah itself, which they put at al-Ram or al-Bira north of Jerusalem, or at Beit Rima near Rantis. Crusader pilgrims honoured Ramla, a town founded only in the eighth century, as Arimathea; that has no ancient claim."
    - "Nothing has been excavated as Arimathea. Rantis is a Palestinian village in the Ramallah governorate, close to the Green Line; Joseph himself is honoured as a saint in the eastern and western churches, and medieval legend carried him as far as Glastonbury."
  ru:
    - "Аримафея известна только как родной город Иосифа, члена синедриона, похоронившего Иисуса. Лука называет её так: «из Аримафеи, города Иудейского», что указывает на городок в иудейском нагорье или рядом с ним, а не в Галилее и не на греческий город. Её называют все четыре Евангелия. Матфей рассказывает, что «пришел богатый человек из Аримафеи, именем Иосиф, который также учился у Иисуса»: он просил у Пилата тело, обвил его чистой плащаницей и «положил его в новом своем гробе, который высек он в скале»; Марк зовёт его «знаменитый член совета, который и сам ожидал Царствия Божия» и говорит, что он «осмелился войти к Пилату»; Лука добавляет, что он был «не участвовавший в совете и в деле их»; Иоанн — что он был «ученик Иисуса, но тайный, из страха от Иудеев» и что с ним пришёл Никодим."
    - "Где она стояла, спорно, и карта хранит кандидатов. Греческое имя похоже на Рамафаим, родину Самуила, и Евсевий писал, что Армафем Софим, город Самуила, лежит близ Диосполя (Лидды) и есть евангельская Аримафея. Это согласуется с Первой книгой Маккавейской, по которой округ Рамафаим был передан из Самарии Иудее в 145 г. до н. э., и указывает на Рантис (Рентис), селение примерно в 15 км к северо-востоку от Лода на краю гор, — выбор большинства нынешних учёных. Другие помещают Аримафею в самой Раме Самуила, которую ищут в Эр-Раме или Эль-Бире к северу от Иерусалима, или в Бейт-Риме рядом с Рантисом. Паломники времён крестоносцев чтили как Аримафею Рамлу — город, основанный только в VIII веке; древнего основания у этого нет."
    - "Ничто не раскопано как Аримафея. Рантис — палестинское селение в мухафазе Рамалла, у самой «зелёной линии»; сам Иосиф почитается как святой в восточной и западной церквах, а средневековая легенда увела его даже в Гластонбери."
  uk:
    - "Аримафея відома лише як рідне місто Йосипа, члена Синедріону, який поховав Ісуса. Лука називає її «города Жидівського», що наводить на думку про місто в юдейському нагір'ї або поблизу нього, а не в Галілеї чи грецьке місто. Усі чотири Євангелії її називають. Матвій розповідає про «чоловік заможний з Ариматеї, на ймя Йосиф, що й сам учив ся в Ісуса», який випросив тіло в Пилата, обгорнув його чистою плащаницею й «положив його у новім своїм гробі, що висїк у скелї»; Марко називає його «поважний радник, що також сподївавсь царства Божого», який, «зосьмілившись, увійшов до Пилата»; Лука додає, що «сей не пристав до ради й дїла їх»; Іван — що він був учнем «потайним же задля страху Жидівського» і що з ним прийшов Никодим."
    - "Де вона стояла, спірне, і мапа зберігає кандидатів. Грецька назва схожа на Раматаїм, батьківщину Самуїла, і Євсевій писав, що Арматем-Софім, місто Самуїла, лежало поблизу Діосполя (Лідди) і було Аримафеєю Євангелій. Це відповідає Першій книзі Маккавеїв, яка каже, що округ Раматаїм передали від Самарії до Юдеї в 145 р. до н. е., і вказує на Рантіс (Рентіс), село приблизно за 15 км на північний схід від Лоду на краю пагорбів — вибір, який роблять більшість учених нині. Інші розміщують Аримафею в самій Рамі Самуїла, яку шукають в аль-Рамі чи аль-Бірі на північ від Єрусалима, або в Бейт-Рімі поряд із Рантісом. Хрестоносні прочани шанували Рамлу, місто, засноване лише у VIII столітті, як Аримафею; на це немає жодних давніх підстав."
    - "Ніщо не розкопано як Аримафею. Рантіс — палестинське село в мухафазі Рамалла, поблизу Зеленої лінії; сам Йосип шанується як святий у східних і західних церквах, а середньовічна легенда доправила його аж до Гластонбері."
  es:
    - "Arimatea es conocida solo como la ciudad natal de José, el miembro del Sanedrín que sepultó a Jesús. Lucas la llama «ciudad de la Judea», lo que sugiere una ciudad en la región montañosa judía o cerca de ella, más que en Galilea o una ciudad griega. Los cuatro Evangelios la nombran. Mateo cuenta de «un hombre rico de Arimatea, llamado José, el cual también había sido discípulo de Jesús», que pidió el cuerpo a Pilato, lo envolvió en lino limpio y «lo puso en su sepulcro nuevo, que había labrado en la peña»; Marcos lo llama «senador noble, que también esperaba el reino de Dios», que «osadamente entró á Pilato»; Lucas añade que «no había consentido en el consejo ni en los hechos de ellos»; Juan, que era discípulo «mas secreto por miedo de los Judíos», y que Nicodemo vino con él."
    - "Se discute dónde estaba, y el mapa conserva los candidatos. El nombre griego se parece a Ramataim, la patria de Samuel, y Eusebio escribió que Armathem Sophim, la ciudad de Samuel, estaba cerca de Dióspolis (Lida) y era la Arimatea de los Evangelios. Eso encaja con 1 Macabeos, que dice que el distrito de Ramataim fue transferido de Samaria a Judea en 145 a. C., y apunta a Rantis (Rentis), una aldea a unos 15 km al nordeste de Lida, en el borde de las colinas, la elección que hacen hoy la mayoría de los estudiosos. Otros sitúan Arimatea en la propia Ramá de Samuel, que ponen en al-Ram o al-Bira, al norte de Jerusalén, o en Beit Rima, cerca de Rantis. Los peregrinos cruzados honraron a Ramla, ciudad fundada solo en el siglo VIII, como Arimatea; eso no tiene ningún fundamento antiguo."
    - "Nada ha sido excavado como Arimatea. Rantis es una aldea palestina en la gobernación de Ramala, cerca de la Línea Verde; el propio José es honrado como santo en las iglesias oriental y occidental, y la leyenda medieval lo llevó hasta Glastonbury."
  pt:
    - "Arimateia só é conhecida como a cidade natal de José, o membro do Sinédrio que sepultou Jesus. Lucas a chama de “uma cidade dos judeus”, o que sugere uma cidade na região montanhosa judaica ou perto dela, e não na Galileia nem uma cidade grega. Os quatro Evangelhos a nomeiam. Mateus fala de “um homem rico de Arimateia, chamado José, que também era discípulo de Jesus”, que pediu o corpo a Pilatos, envolveu-o em lençol de linho limpo e “o colocou em seu próprio túmulo novo, que ele havia escavado na rocha”; Marcos o chama “um membro proeminente do conselho, que também esperava o Reino de Deus”, que “teve coragem de entrar na presença de Pilatos”; Lucas acrescenta que “não havia consentido com a decisão e a ação deles”; João, que era discípulo “em segredo por medo dos judeus”, e que Nicodemos veio com ele."
    - "Onde ficava é discutido, e o mapa guarda os candidatos. O nome grego se parece com Ramataim, terra de Samuel, e Eusébio escreveu que Armathem Sophim, a cidade de Samuel, ficava perto de Diópolis (Lida) e era a Arimateia dos Evangelhos. Isso combina com 1 Macabeus, que diz que o distrito de Ramataim foi transferido de Samaria para a Judeia em 145 a.C., e aponta para Rantis (Rentis), aldeia cerca de 15 km a nordeste de Lida, na borda das colinas, a escolha da maioria dos estudiosos hoje. Outros situam Arimateia na própria Ramá de Samuel, que põem em al-Ram ou al-Bira, ao norte de Jerusalém, ou em Beit Rima, perto de Rantis. Peregrinos cruzados honraram Ramla, cidade fundada só no século VIII, como Arimateia; isso não tem pretensão antiga."
    - "Nada foi escavado como Arimateia. Rantis é uma aldeia palestina na província de Ramallah, perto da Linha Verde; o próprio José é honrado como santo nas igrejas orientais e ocidentais, e a lenda medieval o levou até Glastonbury."
  de:
    - "Arimathäa ist nur als Heimatstadt Josefs bekannt, des Mitglieds des Hohen Rates, der Jesus begrub. Lukas sagt, er sei „von Arimathia, der Stadt der Juden“, was auf eine Stadt im oder nahe dem jüdischen Bergland statt in Galiläa oder auf eine griechische Stadt deutet. Alle vier Evangelien nennen es. Matthäus erzählt von „einem reichen Mann von Arimathia, der hieß Joseph, welcher auch ein Jünger Jesu war“, der den Leib von Pilatus erbat, in reines Leinen wickelte und „legte ihn in sein eigenes Grab, welches er hatte lassen in einen Fels hauen“; Markus nennt ihn „einen ehrbaren Ratsherrn, welcher auch auf das Reich Gottes wartete“, der „es wagte und ging hinein zu Pilatus“; Lukas fügt hinzu, er „hatte nicht gewilligt in ihren Rat und Handel“; Johannes, er sei ein Jünger gewesen, „doch heimlich aus Furcht vor den Juden“, und Nikodemus sei mit ihm gekommen."
    - "Wo es lag, ist umstritten, und die Karte hält die Kandidaten fest. Der griechische Name gleicht Ramatajim, der Heimat Samuels, und Eusebius schrieb, Armathem Sophim, Samuels Stadt, liege nahe Diospolis (Lydda) und sei das Arimathäa der Evangelien. Das passt zum ersten Makkabäerbuch, nach dem der Bezirk Ramatajim 145 v. Chr. von Samaria zu Judäa kam, und weist auf Rantis (Rentis), ein Dorf etwa 15 km nordöstlich von Lydda am Rand des Berglands, die Wahl der meisten Gelehrten heute. Andere setzen Arimathäa in Samuels Rama selbst, das sie in al-Ram oder al-Bira nördlich von Jerusalem suchen, oder in Beit Rima bei Rantis. Kreuzfahrerpilger verehrten Ramla, eine erst im 8. Jahrhundert gegründete Stadt, als Arimathäa; das hat keinen antiken Anspruch."
    - "Nichts wurde als Arimathäa ausgegraben. Rantis ist ein palästinensisches Dorf im Gouvernement Ramallah nahe der Grünen Linie; Josef selbst wird in den östlichen und westlichen Kirchen als Heiliger verehrt, und die mittelalterliche Legende trug ihn bis nach Glastonbury."
  fr:
    - "Arimathée n’est connue que comme la ville natale de Joseph, le membre du sanhédrin qui ensevelit Jésus. Luc l’appelle « ville des Juifs », ce qui suggère une ville dans la montagne juive ou près d’elle plutôt qu’en Galilée ou une cité grecque. Les quatre Évangiles la nomment. Matthieu parle d’« un homme riche d’Arimathée, nommé Joseph, lequel était aussi disciple de Jésus », qui demanda le corps à Pilate, l’enveloppa d’un linceul propre et « le déposa dans un sépulcre neuf, qu’il s’était fait tailler dans le roc » ; Marc l’appelle « conseiller de distinction, qui lui-même attendait aussi le royaume de Dieu », qui « osa se rendre vers Pilate » ; Luc ajoute qu’il « n’avait point participé à la décision et aux actes des autres » ; Jean, qu’il était disciple « en secret par crainte des Juifs », et que Nicodème vint avec lui."
    - "Son emplacement est discuté, et la carte garde les candidats. Le nom grec ressemble à Ramathaïm, patrie de Samuel, et Eusèbe écrivit qu’Armathem Sophim, ville de Samuel, se trouvait près de Diospolis (Lydde) et était l’Arimathée des Évangiles. Cela s’accorde avec 1 Maccabées, qui dit que le district de Ramathaïm fut transféré de la Samarie à la Judée en 145 av. J.-C., et mène à Rantis (Rentis), village à environ 15 km au nord-est de Lydde, en bordure des collines, choix de la plupart des savants aujourd’hui. D’autres placent Arimathée à la Rama de Samuel elle-même, qu’ils situent à al-Ram ou à al-Bira, au nord de Jérusalem, ou à Beit Rima près de Rantis. Les pèlerins croisés honoraient Ramla, ville fondée seulement au VIIIe siècle, comme Arimathée ; elle n’a aucun titre antique."
    - "Rien n’a été fouillé comme Arimathée. Rantis est un village palestinien du gouvernorat de Ramallah, près de la Ligne verte ; Joseph lui-même est honoré comme saint dans les Églises d’Orient et d’Occident, et la légende médiévale l’a porté jusqu’à Glastonbury."
