body:
  en:
    - "Arimathea is known only as the home town of Joseph, the member of the Sanhedrin who buried Jesus. Luke calls it “a city of the Jews”, which suggests a town in or near the Jewish hill country rather than in Galilee or a Greek city. All four Gospels name it. Matthew tells of “a rich man of Arimathæa, named Joseph, who also himself was Jesus' disciple”, who begged the body from Pilate, wrapped it in clean linen and “laid it in his own new tomb, which he had hewn out in the rock”; Mark calls him “an honourable counsellor, which also waited for the kingdom of God”, who “went in boldly unto Pilate”; Luke adds that he “had not consented to the counsel and deed of them”; John, that he was a disciple “secretly for fear of the Jews”, and that Nicodemus came with him."
    - "Where it stood is disputed, and the map keeps the candidates. The Greek name looks like Ramathaim, the home of Samuel, and Eusebius wrote that Armathem Sophim, Samuel's city, lay near Diospolis (Lydda) and was the Arimathea of the Gospels. That fits 1 Maccabees, which says the district of Ramathaim was transferred from Samaria to Judea in 145 BC, and points to Rantis (Rentis), a village about 15 km north-east of Lod on the edge of the hills, the choice most scholars make today. Others place Arimathea at Samuel's Ramah itself, which they put at al-Ram or al-Bira north of Jerusalem, or at Beit Rima near Rantis. Crusader pilgrims honoured Ramla, a town founded only in the eighth century, as Arimathea; that has no ancient claim."
    - "Nothing has been excavated as Arimathea. Rantis is a Palestinian village in the Ramallah governorate, close to the Green Line; Joseph himself is honoured as a saint in the eastern and western churches, and medieval legend carried him as far as Glastonbury."
  ru:
    - "Аримафея известна только как родной город Иосифа, члена синедриона, похоронившего Иисуса. Лука называет её так: «из Аримафеи, города Иудейского», что указывает на городок в иудейском нагорье или рядом с ним, а не в Галилее и не на греческий город. Её называют все четыре Евангелия. Матфей рассказывает, что «пришел богатый человек из Аримафеи, именем Иосиф, который также учился у Иисуса»: он просил у Пилата тело, обвил его чистой плащаницей и «положил его в новом своем гробе, который высек он в скале»; Марк зовёт его «знаменитый член совета, который и сам ожидал Царствия Божия» и говорит, что он «осмелился войти к Пилату»; Лука добавляет, что он был «не участвовавший в совете и в деле их»; Иоанн — что он был «ученик Иисуса, но тайный, из страха от Иудеев» и что с ним пришёл Никодим."
    - "Где она стояла, спорно, и карта хранит кандидатов. Греческое имя похоже на Рамафаим, родину Самуила, и Евсевий писал, что Армафем Софим, город Самуила, лежит близ Диосполя (Лидды) и есть евангельская Аримафея. Это согласуется с Первой книгой Маккавейской, по которой округ Рамафаим был передан из Самарии Иудее в 145 г. до н. э., и указывает на Рантис (Рентис), селение примерно в 15 км к северо-востоку от Лода на краю гор, — выбор большинства нынешних учёных. Другие помещают Аримафею в самой Раме Самуила, которую ищут в Эр-Раме или Эль-Бире к северу от Иерусалима, или в Бейт-Риме рядом с Рантисом. Паломники времён крестоносцев чтили как Аримафею Рамлу — город, основанный только в VIII веке; древнего основания у этого нет."
    - "Ничто не раскопано как Аримафея. Рантис — палестинское селение в мухафазе Рамалла, у самой «зелёной линии»; сам Иосиф почитается как святой в восточной и западной церквах, а средневековая легенда увела его даже в Гластонбери."
  uk:
    - "Аримафея відома лише як рідне місто Йосипа, члена Синедріону, який поховав Ісуса. Лука називає її «города Жидівського», що наводить на думку про місто в юдейському нагір'ї або поблизу нього, а не в Галілеї чи грецьке місто. Усі чотири Євангелії її називають. Матвій розповідає про «чоловік заможний з Ариматеї, на ймя Йосиф, що й сам учив ся в Ісуса», який випросив тіло в Пилата, обгорнув його чистою плащаницею й «положив його у новім своїм гробі, що висїк у скелї»; Марко називає його «поважний радник, що також сподївавсь царства Божого», який, «зосьмілившись, увійшов до Пилата»; Лука додає, що «сей не пристав до ради й дїла їх»; Іван — що він був учнем «потайним же задля страху Жидівського» і що з ним прийшов Никодим."
    - "Де вона стояла, спірне, і мапа зберігає кандидатів. Грецька назва схожа на Раматаїм, батьківщину Самуїла, і Євсевій писав, що Арматем-Софім, місто Самуїла, лежало поблизу Діосполя (Лідди) і було Аримафеєю Євангелій. Це відповідає Першій книзі Маккавеїв, яка каже, що округ Раматаїм передали від Самарії до Юдеї в 145 р. до н. е., і вказує на Рантіс (Рентіс), село приблизно за 15 км на північний схід від Лоду на краю пагорбів — вибір, який роблять більшість учених нині. Інші розміщують Аримафею в самій Рамі Самуїла, яку шукають в аль-Рамі чи аль-Бірі на північ від Єрусалима, або в Бейт-Рімі поряд із Рантісом. Хрестоносні прочани шанували Рамлу, місто, засноване лише у VIII столітті, як Аримафею; на це немає жодних давніх підстав."
    - "Ніщо не розкопано як Аримафею. Рантіс — палестинське село в мухафазі Рамалла, поблизу Зеленої лінії; сам Йосип шанується як святий у східних і західних церквах, а середньовічна легенда доправила його аж до Гластонбері."
  es:
    - "Arimatea es conocida solo como la ciudad natal de José, el miembro del Sanedrín que sepultó a Jesús. Lucas la llama «ciudad de la Judea», lo que sugiere una ciudad en la región montañosa judía o cerca de ella, más que en Galilea o una ciudad griega. Los cuatro Evangelios la nombran. Mateo cuenta de «un hombre rico de Arimatea, llamado José, el cual también había sido discípulo de Jesús», que pidió el cuerpo a Pilato, lo envolvió en lino limpio y «lo puso en su sepulcro nuevo, que había labrado en la peña»; Marcos lo llama «senador noble, que también esperaba el reino de Dios», que «osadamente entró á Pilato»; Lucas añade que «no había consentido en el consejo ni en los hechos de ellos»; Juan, que era discípulo «mas secreto por miedo de los Judíos», y que Nicodemo vino con él."
    - "Se discute dónde estaba, y el mapa conserva los candidatos. El nombre griego se parece a Ramataim, la patria de Samuel, y Eusebio escribió que Armathem Sophim, la ciudad de Samuel, estaba cerca de Dióspolis (Lida) y era la Arimatea de los Evangelios. Eso encaja con 1 Macabeos, que dice que el distrito de Ramataim fue transferido de Samaria a Judea en 145 a. C., y apunta a Rantis (Rentis), una aldea a unos 15 km al nordeste de Lida, en el borde de las colinas, la elección que hacen hoy la mayoría de los estudiosos. Otros sitúan Arimatea en la propia Ramá de Samuel, que ponen en al-Ram o al-Bira, al norte de Jerusalén, o en Beit Rima, cerca de Rantis. Los peregrinos cruzados honraron a Ramla, ciudad fundada solo en el siglo VIII, como Arimatea; eso no tiene ningún fundamento antiguo."
    - "Nada ha sido excavado como Arimatea. Rantis es una aldea palestina en la gobernación de Ramala, cerca de la Línea Verde; el propio José es honrado como santo en las iglesias oriental y occidental, y la leyenda medieval lo llevó hasta Glastonbury."
  pt:
    - "Arimateia só é conhecida como a cidade natal de José, o membro do Sinédrio que sepultou Jesus. Lucas a chama de “uma cidade dos judeus”, o que sugere uma cidade na região montanhosa judaica ou perto dela, e não na Galileia nem uma cidade grega. Os quatro Evangelhos a nomeiam. Mateus fala de “um homem rico de Arimateia, chamado José, que também era discípulo de Jesus”, que pediu o corpo a Pilatos, envolveu-o em lençol de linho limpo e “o colocou em seu próprio túmulo novo, que ele havia escavado na rocha”; Marcos o chama “um membro proeminente do conselho, que também esperava o Reino de Deus”, que “teve coragem de entrar na presença de Pilatos”; Lucas acrescenta que “não havia consentido com a decisão e a ação deles”; João, que era discípulo “em segredo por medo dos judeus”, e que Nicodemos veio com ele."
    - "Onde ficava é discutido, e o mapa guarda os candidatos. O nome grego se parece com Ramataim, terra de Samuel, e Eusébio escreveu que Armathem Sophim, a cidade de Samuel, ficava perto de Diópolis (Lida) e era a Arimateia dos Evangelhos. Isso combina com 1 Macabeus, que diz que o distrito de Ramataim foi transferido de Samaria para a Judeia em 145 a.C., e aponta para Rantis (Rentis), aldeia cerca de 15 km a nordeste de Lida, na borda das colinas, a escolha da maioria dos estudiosos hoje. Outros situam Arimateia na própria Ramá de Samuel, que põem em al-Ram ou al-Bira, ao norte de Jerusalém, ou em Beit Rima, perto de Rantis. Peregrinos cruzados honraram Ramla, cidade fundada só no século VIII, como Arimateia; isso não tem pretensão antiga."
    - "Nada foi escavado como Arimateia. Rantis é uma aldeia palestina na província de Ramallah, perto da Linha Verde; o próprio José é honrado como santo nas igrejas orientais e ocidentais, e a lenda medieval o levou até Glastonbury."
  de:
    - "Arimathäa ist nur als Heimatstadt Josefs bekannt, des Mitglieds des Hohen Rates, der Jesus begrub. Lukas sagt, er sei „von Arimathia, der Stadt der Juden“, was auf eine Stadt im oder nahe dem jüdischen Bergland statt in Galiläa oder auf eine griechische Stadt deutet. Alle vier Evangelien nennen es. Matthäus erzählt von „einem reichen Mann von Arimathia, der hieß Joseph, welcher auch ein Jünger Jesu war“, der den Leib von Pilatus erbat, in reines Leinen wickelte und „legte ihn in sein eigenes Grab, welches er hatte lassen in einen Fels hauen“; Markus nennt ihn „einen ehrbaren Ratsherrn, welcher auch auf das Reich Gottes wartete“, der „es wagte und ging hinein zu Pilatus“; Lukas fügt hinzu, er „hatte nicht gewilligt in ihren Rat und Handel“; Johannes, er sei ein Jünger gewesen, „doch heimlich aus Furcht vor den Juden“, und Nikodemus sei mit ihm gekommen."
    - "Wo es lag, ist umstritten, und die Karte hält die Kandidaten fest. Der griechische Name gleicht Ramatajim, der Heimat Samuels, und Eusebius schrieb, Armathem Sophim, Samuels Stadt, liege nahe Diospolis (Lydda) und sei das Arimathäa der Evangelien. Das passt zum ersten Makkabäerbuch, nach dem der Bezirk Ramatajim 145 v. Chr. von Samaria zu Judäa kam, und weist auf Rantis (Rentis), ein Dorf etwa 15 km nordöstlich von Lydda am Rand des Berglands, die Wahl der meisten Gelehrten heute. Andere setzen Arimathäa in Samuels Rama selbst, das sie in al-Ram oder al-Bira nördlich von Jerusalem suchen, oder in Beit Rima bei Rantis. Kreuzfahrerpilger verehrten Ramla, eine erst im 8. Jahrhundert gegründete Stadt, als Arimathäa; das hat keinen antiken Anspruch."
    - "Nichts wurde als Arimathäa ausgegraben. Rantis ist ein palästinensisches Dorf im Gouvernement Ramallah nahe der Grünen Linie; Josef selbst wird in den östlichen und westlichen Kirchen als Heiliger verehrt, und die mittelalterliche Legende trug ihn bis nach Glastonbury."
  fr:
    - "Arimathée n’est connue que comme la ville natale de Joseph, le membre du sanhédrin qui ensevelit Jésus. Luc l’appelle « ville des Juifs », ce qui suggère une ville dans la montagne juive ou près d’elle plutôt qu’en Galilée ou une cité grecque. Les quatre Évangiles la nomment. Matthieu parle d’« un homme riche d’Arimathée, nommé Joseph, lequel était aussi disciple de Jésus », qui demanda le corps à Pilate, l’enveloppa d’un linceul propre et « le déposa dans un sépulcre neuf, qu’il s’était fait tailler dans le roc » ; Marc l’appelle « conseiller de distinction, qui lui-même attendait aussi le royaume de Dieu », qui « osa se rendre vers Pilate » ; Luc ajoute qu’il « n’avait point participé à la décision et aux actes des autres » ; Jean, qu’il était disciple « en secret par crainte des Juifs », et que Nicodème vint avec lui."
    - "Son emplacement est discuté, et la carte garde les candidats. Le nom grec ressemble à Ramathaïm, patrie de Samuel, et Eusèbe écrivit qu’Armathem Sophim, ville de Samuel, se trouvait près de Diospolis (Lydde) et était l’Arimathée des Évangiles. Cela s’accorde avec 1 Maccabées, qui dit que le district de Ramathaïm fut transféré de la Samarie à la Judée en 145 av. J.-C., et mène à Rantis (Rentis), village à environ 15 km au nord-est de Lydde, en bordure des collines, choix de la plupart des savants aujourd’hui. D’autres placent Arimathée à la Rama de Samuel elle-même, qu’ils situent à al-Ram ou à al-Bira, au nord de Jérusalem, ou à Beit Rima près de Rantis. Les pèlerins croisés honoraient Ramla, ville fondée seulement au VIIIe siècle, comme Arimathée ; elle n’a aucun titre antique."
    - "Rien n’a été fouillé comme Arimathée. Rantis est un village palestinien du gouvernorat de Ramallah, près de la Ligne verte ; Joseph lui-même est honoré comme saint dans les Églises d’Orient et d’Occident, et la légende médiévale l’a porté jusqu’à Glastonbury."
  it:
    - "Arimatea è nota soltanto come città natale di Giuseppe, il membro del Sinedrio che seppellì Gesù. Luca la chiama «città de’ Giudei», il che suggerisce una città nella regione collinosa giudaica o vicino a essa piuttosto che in Galilea o una città greca. Tutti e quattro i Vangeli la nominano. Matteo racconta di «un uomo ricco di Arimatea, chiamato Giuseppe, il quale era divenuto anche egli discepolo di Gesù», che chiese il corpo a Pilato, lo avvolse in un panno di lino netto e «lo pose nella propria tomba nuova, che aveva fatta scavare nella roccia»; Marco lo chiama «consigliere onorato, il quale aspettava anch’egli il Regno di Dio», che «preso ardire, si presentò a Pilato»; Luca aggiunge che «non avea consentito alla deliberazione e all’operato degli altri»; Giovanni, che era discepolo «ma occulto per timore de’ Giudei», e che Nicodemo venne con lui."
    - "Dove sorgesse è discusso, e la carta conserva i candidati. Il nome greco somiglia a Ramataim, patria di Samuele, ed Eusebio scrisse che Armathem Sophim, città di Samuele, si trovava presso Diospoli (Lidda) ed era l’Arimatea dei Vangeli. Ciò si accorda con 1 Maccabei, che dice che il distretto di Ramataim fu trasferito da Samaria alla Giudea nel 145 a.C., e indica Rantis (Rentis), un villaggio a circa 15 km a nord-est di Lidda sul margine delle colline, la scelta della maggior parte degli studiosi oggi. Altri pongono Arimatea alla Rama stessa di Samuele, che collocano ad al-Ram o ad al-Bira a nord di Gerusalemme, o a Beit Rima presso Rantis. I pellegrini crociati onorarono come Arimatea Ramla, una città fondata solo nell’VIII secolo; essa non ha alcun titolo antico."
    - "Nulla è stato scavato come Arimatea. Rantis è un villaggio palestinese nel governatorato di Ramallah, vicino alla Linea Verde; Giuseppe stesso è venerato come santo nelle chiese orientali e occidentali, e la leggenda medievale lo portò fino a Glastonbury."
  pl:
    - "Arymatea jest znana tylko jako rodzinne miasto Józefa, członka Sanhedrynu, który pochował Jezusa. Łukasz mówi o niej: „z Arymatyi, miasta Judzkiego”, co sugeruje miasto w judzkiej krainie górskiej lub w jej pobliżu, a nie w Galilei czy w mieście greckim. Wymieniają ją wszystkie cztery Ewangelie. Mateusz mówi o „człowiek bogaty z Arymatyi, imieniem Józef, który też był uczniem Jezusowym”, który wyprosił ciało u Piłata, owinął je w czyste płótno i „położył je w nowym grobie swoim, który był w opoce wykował”; Marek nazywa go „poczesny radny pan, który też sam oczekiwał królestwa Bożego”, który „śmiele wszedł do Piłata”; Łukasz dodaje, że „nie zezwolił na radę i na uczynek ich”; Jan, że był uczniem „tajemnym dla bojaźni żydowskiej” i że razem z nim przyszedł Nikodem."
    - "Gdzie leżała, jest sporne, a mapa zachowuje kandydatów. Greckie imię przypomina Ramataim, rodzinne miasto Samuela, a Euzebiusz pisał, że Armathem Sophim, miasto Samuela, leżało blisko Diospolis (Lydda) i było Arymateą Ewangelii. Pasuje to do 1 Księgi Machabejskiej, która mówi, że okręg Ramataim przeniesiono z Samarii do Judei w 145 r. p.n.e., i wskazuje na Rantis (Rentis), wieś około 15 km na północny wschód od Lod na skraju wzgórz, wybór większości dzisiejszych uczonych. Inni umieszczają Arymateę w samej Ramie Samuela, którą lokalizują w al-Ram lub al-Bira na północ od Jerozolimy, albo w Beit Rima koło Rantis. Pielgrzymi krzyżowców czcili jako Arymateę Ramlę, miasto założone dopiero w VIII wieku; nie ma ono starożytnych praw."
    - "Nic nie wykopano jako Arymatei. Rantis jest palestyńską wsią w muhafazie Ramallah, blisko Zielonej Linii; sam Józef jest czczony jako święty w kościołach wschodnich i zachodnich, a średniowieczna legenda zaniosła go aż do Glastonbury."
  nl:
    - "Arimatea is alleen bekend als de woonplaats van Jozef, het lid van het Sanhedrin dat Jezus begroef. Lukas noemt haar “een stad der Joden”, wat wijst op een stad in of nabij het Judese bergland eerder dan in Galilea of een Griekse stad. Alle vier de evangeliën noemen haar. Mattheüs vertelt van “een rijk man van Arimathea, met name Jozef, die ook zelf een discipel van Jezus was”, die het lichaam van Pilatus vroeg, in rein linnen wikkelde en “legde dat in zijn nieuw graf, hetwelk hij in een steenrots uitgehouwen had”; Marcus noemt hem “een eerlijk raadsheer, die ook zelf het Koninkrijk Gods was verwachtende”, moedig geworden “ging hij in tot Pilatus”; Lukas voegt toe dat hij “niet mede bewilligd” had “in hun raad en handel”; Johannes, dat hij een discipel was, “maar bedekt om de vreze der Joden”, en dat Nikodemus met hem meekwam."
    - "Waar zij lag, is omstreden, en de kaart bewaart de kandidaten. De Griekse naam lijkt op Ramathaim, de woonplaats van Samuël, en Eusebius schreef dat Armathem Sophim, Samuëls stad, bij Diospolis (Lydda) lag en de Arimatea van de evangeliën was. Dat past bij 1 Makkabeeën, dat zegt dat het district Ramathaim in 145 v.Chr. van Samaria aan Judea werd overgedragen, en wijst naar Rantis (Rentis), een dorp zo’n 15 km ten noordoosten van Lydda aan de rand van de heuvels, de keuze van de meeste geleerden tegenwoordig. Anderen plaatsen Arimatea op Samuëls Rama zelf, dat zij leggen bij al-Ram of al-Bira ten noorden van Jeruzalem, of op Beit Rima nabij Rantis. Kruisvaarderspelgrims eerden Ramla, een stad pas in de achtste eeuw gesticht, als Arimatea; dat heeft geen oude aanspraak."
    - "Nergens is iets als Arimatea opgegraven. Rantis is een Palestijns dorp in het gouvernement Ramallah, vlak bij de Groene Lijn; Jozef zelf wordt in de oosterse en westerse kerken als heilige vereerd, en middeleeuwse legende voerde hem tot Glastonbury."
  cs:
    - "Arimatea je známa jen jako rodné město Josefa, člena sanhedrinu, který pohřbil Ježíše. Lukáš ji nazývá „města Judského“, což naznačuje město v židovské pahorkatině nebo v její blízkosti, spíše než v Galileji nebo řecké město. Jmenují ji všechna čtyři evangelia. Matouš vypráví, že „přišel jeden člověk bohatý od Arimatie, jménem Jozef, kterýž také byl učedlník Ježíšův“, vyprosil si od Piláta tělo, „obvinul je v plátno čisté, a vložil do svého nového hrobu, kterýž byl vytesal v skále“; Marek ho nazývá „počestná osoba úřadná, kterýž také očekával království Božího“, která „směle všel ku Pilátovi“; Lukáš dodává, že „byl nepovolil radě a skutku jejich“; Jan, že byl učedníkem „ale tajný, pro strach Židovský“ a že s ním přišel Nikodém."
    - "Kde stála, je sporné a mapa uchovává kandidáty. Řecké jméno vypadá jako Ramataim, domov Samuelův, a Eusebios napsal, že Armathem Sophim, Samuelovo město, leželo poblíž Diospole (Lyddy) a bylo Arimateou evangelií. To odpovídá První knize Makabejské, podle níž byl okres Ramataim roku 145 př. n. l. převeden ze Samaří do Judska, a ukazuje na Rantis (Rentis), vesnici asi 15 km severovýchodně od Lodu na okraji pahorků, což je volba většiny dnešních badatelů. Jiní kladou Arimateu do samotné Samuelovy Rámy, kterou umísťují do al-Ram nebo al-Bira severně od Jeruzaléma, nebo do Beit Rima u Rantisu. Křižáčtí poutníci ctili jako Arimateu Ramlu, město založené teprve v 8. století; to nemá žádný starověký nárok."
    - "Nic nebylo vykopáno jako Arimatea. Rantis je palestinská vesnice v guvernorátu Rámalláh, blízko Zelené linie; sám Josef je uctíván jako svatý ve východních i západních církvích a středověká legenda jej zanesla až do Glastonbury."
  sv:
    - "Arimataia är bara känt som hemstad för Josef, medlemmen av Stora rådet som begravde Jesus. Lukas kallar den ”en stad i Judeen”, vilket antyder en stad i eller nära det judiska bergslandet snarare än i Galileen eller en grekisk stad. Alla fyra evangelierna nämner den. Matteus berättar om ”en rik man från Arimatea, vid namn Josef, som ock hade blivit en Jesu lärjunge”, som utbad sig kroppen av Pilatus, svepte den i ren linneduk och ”lade den i den nya grav som han hade låtit hugga ut åt sig i klippan”; Markus kallar honom ”en ansedd rådsherre och en av dem som väntade på Guds rike”, som ”tog därför nu mod till sig och gick in till Pilatus”; Lukas tillägger att han ”icke hade samtyckt till deras rådslag och gärning”; Johannes att han var lärjunge ”i hemlighet, av fruktan för judarna”, och att Nikodemos kom med honom."
    - "Var det låg är omstritt, och kartan behåller kandidaterna. Det grekiska namnet liknar Ramataim, Samuels hemort, och Eusebios skrev att Armathem Sophim, Samuels stad, låg nära Diospolis (Lydda) och var evangeliernas Arimataia. Det passar Första Mackabeerboken, som säger att distriktet Ramataim fördes från Samaria till Judeen år 145 f.Kr., och pekar på Rantis (Rentis), en by omkring 15 km nordost om Lod vid bergens kant, det val de flesta forskare gör i dag. Andra förlägger Arimataia till Samuels Rama självt, som de placerar vid al-Ram eller al-Bira norr om Jerusalem, eller vid Beit Rima nära Rantis. Korsfararpilgrimer hedrade Ramla, en stad grundad först på 700-talet, som Arimataia; det har inget antikt anspråk."
    - "Ingenting har grävts ut som Arimataia. Rantis är en palestinsk by i guvernementet Ramallah, nära Gröna linjen; Josef själv hedras som helgon i de östliga och västliga kyrkorna, och medeltida legender förde honom ända till Glastonbury."
  nb:
    - "Arimatea er bare kjent som hjemstedet til Josef, medlemmet av Rådet som gravla Jesus. Lukas kaller den «den jødiske by Arimatea», noe som antyder en by i eller nær det jødiske fjellandet snarere enn i Galilea eller en gresk by. Alle fire evangeliene nevner den. Matteus forteller om «en rik mann fra Arimatea ved navn Josef, som også var blitt en Jesu disippel», som ba Pilatus om legemet, svøpte det i et rent, fint linklæde og «la det i sin nye grav, som han hadde latt hugge i klippen»; Markus kaller ham «en høit aktet rådsherre, som også ventet på Guds rike», som «vågde sig til å gå inn til Pilatus»; Lukas føyer til at han «hadde ikke samtykket i deres råd og gjerning»; Johannes at han var disippel «dog lønnlig, av frykt for jødene», og at Nikodemus kom sammen med ham."
    - "Hvor den lå, er omstridt, og kartet beholder kandidatene. Det greske navnet ligner Ramataim, Samuels hjemsted, og Eusebius skrev at Armathem Sophim, Samuels by, lå nær Diospolis (Lydda) og var evangeliets Arimatea. Det passer med 1. Makkabeerbok, som sier at distriktet Ramataim ble overført fra Samaria til Judea i 145 f.Kr., og peker mot Rantis (Rentis), en landsby omtrent 15 km nordøst for Lod i kanten av åsene, valget de fleste forskere gjør i dag. Andre plasserer Arimatea ved Samuels Rama selv, som de legger til al-Ram eller al-Bira nord for Jerusalem, eller til Beit Rima nær Rantis. Korsfarerpilegrimer æret Ramla, en by grunnlagt først på 700-tallet, som Arimatea; det har ikke noe gammelt krav."
    - "Ingenting er gravd ut som Arimatea. Rantis er en palestinsk landsby i Ramallah-guvernementet, tett ved Den grønne linjen; Josef selv æres som helgen i de østlige og vestlige kirkene, og middelalderlegenden førte ham helt til Glastonbury."
  tl:
    - "Ang Arimatea ay kilala lamang bilang bayan ni Jose, ang kasapi ng Sanedrin na naglibing kay Jesus. Tinatawag ito ni Lucas na “bayan ng mga Judio”, na nagmumungkahing nasa o malapit sa maburol na lupain ng mga Judio, hindi sa Galilea o lungsod na Griyego. Pinangalanan ito ng apat na Ebanghelyo. Sabi ni Mateo, “isang mayamang mula sa Arimatea, na nagngangalang Jose, na ito'y naging alagad din naman ni Jesus”, na humingi kay Pilato ng bangkay, nagbalot ng lino at “inilagay sa kaniyang sariling bagong libingan, na kaniyang hinukay sa bato”; tinatawag siya ni Marcos na “isang kasangguni na may marangal na kalagayan, na naghihintay rin naman ng kaharian ng Dios”, na “pinangahasan niyang pinasok si Pilato”; dagdag ni Lucas, “Siya'y hindi umayon sa kanilang payo at gawa”; sabi ni Juan, alagad siya “lihim dahil sa katakutan sa mga Judio”, at kasama niya si Nicodemo."
    - "Pinagtatalunan kung saan ito nakatayo, at iniingatan ng mapa ang mga kandidato. Kahawig ng Ramathaim, ang tahanan ni Samuel, ang pangalang Griyego, at isinulat ni Eusebio na ang Armathem Sophim, ang lungsod ni Samuel, ay malapit sa Diospolis (Lydda) at ang Arimatea ng mga Ebanghelyo. Tugma ito sa 1 Macabeo, na nagsasabing inilipat ang distrito ng Ramathaim mula Samaria patungong Judea noong 145 BK, at tumuturo sa Rantis (Rentis), nayon mga 15 km sa hilagang-silangan ng Lod sa gilid ng mga burol, ang pinipili ng karamihan ng iskolar ngayon. Inilalagay ng iba ang Arimatea sa mismong Rama ni Samuel, na itinatakda nila sa al-Ram o al-Bira sa hilaga ng Jerusalem, o sa Beit Rima malapit sa Rantis. Pinarangalan ng mga peregrinong Krusado ang Ramla, bayang itinatag lamang noong ika-8 siglo, bilang Arimatea; wala itong sinaunang batayan."
    - "Walang nahukay bilang Arimatea. Ang Rantis ay nayong Palestino sa Gobernorado ng Ramallah, malapit sa Berdeng Linya; pinararangalan si Jose bilang santo sa mga iglesiang silangan at kanluran, at dinala siya ng alamat noong Gitnang Panahon hanggang Glastonbury."
  da:
    - "Arimatæa er kun kendt som hjemby for Josef, rådsmedlemmet, der begravede Jesus. Lukas kalder den »en jødisk By«, hvilket antyder en by i eller nær det jødiske bjergland snarere end i Galilæa eller en græsk by. Alle fire evangelier nævner den. Mattæus fortæller om »en rig Mand fra Arimathæa, ved Navn Josef, som ogsaa selv var bleven Jesu Discipel«, der bad Pilatus om legemet, svøbte det i rent linned og »lagde det i sin nye Grav, som han havde ladet hugge i Klippen«; Markus kalder ham »en anset Raadsherre, som ogsaa selv forventede Guds Rige«, der »tog Mod til sig og gik ind til Pilatus«; Lukas tilføjer: »han havde ikke samtykket i deres Raad og Gerning«; Johannes, at han var discipel »lønligt, af Frygt for Jøderne«, og at Nikodemus kom med ham."
    - "Hvor den lå, er omstridt, og kortet beholder kandidaterne. Det græske navn ligner Ramatajim, Samuels hjemby, og Eusebius skrev, at Armathem Sophim, Samuels by, lå nær Diospolis (Lydda) og var evangeliernes Arimatæa. Det passer til 1 Makkabæerbog, der siger, at Ramatajims distrikt blev overført fra Samaria til Judæa i 145 f.Kr., og peger på Rantis (Rentis), en landsby omkring 15 km nordøst for Lydda ved bjergenes rand, det valg de fleste forskere træffer i dag. Andre placerer Arimatæa ved selve Samuels Rama, som de sætter til al-Ram eller al-Bira nord for Jerusalem, eller ved Beit Rima nær Rantis. Korsfarerpilgrimme ærede Ramla, en by grundlagt først i 700-tallet, som Arimatæa; det har ingen antik hjemmel."
    - "Intet er udgravet som Arimatæa. Rantis er en palæstinensisk landsby i Ramallah-guvernementet, tæt ved Den Grønne Linje; Josef selv æres som helgen i de østlige og vestlige kirker, og middelalderlig legende førte ham helt til Glastonbury."
  sr:
    - "Ариматеја је позната само као родни град Јосифа, члана синедриона који је сахранио Исуса. Лука је описује речима „из Ариматеје града јудејског“, што наговештава град у јудејском горју или близу њега, пре него у Галилеји или грчки град. Сва четири јеванђеља је именују. Матеј каже да је дошао „човек богат из Ариматеје, по имену Јосиф, који је такође био ученик Исусов“, и да је измолио тело од Пилата, умотао га у чисто платно и „метну Га у нови свој гроб што је био исекао у камену“; Марко га назива „поштен саветник, који и сам царство Божје чекаше“, који „усуди се те уђе к Пилату“; Лука додаје да „он не беше пристао на њихов савет и на посао“; Јован да је био ученик „али крадом од страха јеврејског“ и да је с њим дошао Никодим."
    - "Где је стајала, спорно је, а карта чува кандидате. Грчко име личи на Раматаим, завичај Самуилов, а Јевсевије је писао да је Арматем Софим, Самуилов град, лежао близу Диосполиса (Лиде) и да је то Ариматеја из јеванђеља. То одговара 1. Макавејској, која каже да је округ Раматаим 145. п. н. е. пренет из Самарије у Јудеју, и упућује на Рантис (Рентис), село око 15 км североисточно од Лиде на ивици брда, избор који већина научника данас прави. Други смештају Ариматеју у сам Самуилов Раму, који стављају у ал-Рам или ел-Биру северно од Јерусалима, или у Бејт Риму близу Рантиса. Крсташки ходочасници су поштовали Рамлу, град основан тек у 8. веку, као Ариматеју; за то нема античког основа."
    - "Ништа није ископано као Ариматеја. Рантис је палестинско село у гувернорату Рамала, близу Зелене линије; сам Јосиф се поштује као светац у источној и западној цркви, а средњовековна легенда однела га је све до Гластонберија."
