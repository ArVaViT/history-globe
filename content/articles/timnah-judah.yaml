# Overview article (ADR 0007). Mainstream facts only; the Timnah of Genesis 38 is unlocated and the three candidates are given without a choice; the Timnah of Samson has its own article.
id: timnah-judah
place: a17c178
title:
  en: "Timnah"
  ru: "Фамна"
  uk: "Тімна"
  es: "Timna"
  pt: "Timna"
  de: "Timna"
  fr: "Thimna"
body:
  en:
    - "The Timnah of Genesis 38 is the place to which Judah went up to shear his sheep, and the story is all that is known of it. Three sites are proposed. One is the Timnah of the hill country of Judah, listed with Maon, Carmel and Ziph south of Hebron, itself unlocated. Another is Tel Batash in the Sorek valley, Samson's Timnah on the northern border of Judah. The third is Khirbet et-Tibbaneh, a ridge-top ruin with an Iron Age fort, about 7 km south-east of Beit Nettif above the valley of Elah, where the Arabic name keeps the old one; it has been surveyed but not excavated. The last suits the story best: Judah lived among the people of Adullam, a few kilometres away, and “went up” to Timnah, and Enaim, where Tamar sat, is often taken for the Enam named with Jarmuth and Adullam among the towns of the lowland. The Jerusalem Talmud records the view that his Timnah and Samson's are two places."
    - "“And in process of time the daughter of Shuah Judah's wife died; and Judah was comforted, and went up unto his sheepshearers to Timnath, he and his friend Hirah the Adullamite.” Sheepshearing was a feast with wine. Tamar, twice widowed and still denied Judah's third son, was told that “thy father in law goeth up to Timnath to shear his sheep”; she laid off her widow's clothes, veiled herself and “sat in an open place, which is by the way to Timnath”, the gate of Enaim. Judah took her for a prostitute and left his seal, cord and staff as a pledge. Her twins were Perez and Zerah, and from Perez the Book of Ruth and the gospels trace the line of David and of Jesus."
    - "If Khirbet et-Tibbaneh is the place, it lies today in the Sansan nature reserve in the Judean hills of Israel, west of Jerusalem; nothing there has been tied to the patriarchs."
  ru:
    - "Фамна из 38-й главы Бытия — место, куда Иуда ходил стричь овец, и этот рассказ — всё, что о ней известно. Предложены три места. Первое — Фимна в нагорье Иуды, названная вместе с Маоном, Кармилом и Зифом южнее Хеврона, сама не найденная. Второе — Тель-Баташ в долине Сорек, Фимнафа Самсона на северном пределе Иуды. Третье — Хирбет-эт-Тиббане, развалины на гребне с крепостью железного века примерно в 7 км к юго-востоку от Бейт-Неттифа, над долиной дуба, где арабское имя хранит древнее; место обследовано, но не раскопано. Последнее лучше всего подходит к рассказу: Иуда жил среди одолламитян, в нескольких километрах оттуда, и «пошел» в Фамну (в еврейском тексте — «поднялся»), а Енаим, где сидела Фамарь, часто отождествляют с Гаенамом, названным вместе с Иармуфом и Одолламом среди городов низменности. Иерусалимский Талмуд уже приводит мнение, что Фамна Иуды и Фамна Самсона — не одно и то же."
    - "«Прошло много времени, и умерла дочь Шуи, жена Иудина. Иуда, утешившись, пошел в Фамну к стригущим скот его, сам и Хира, друг его, Одолламитянин». Стрижка овец была праздником с вином. Фамари, дважды овдовевшей и так и не отданной третьему сыну Иуды, сообщили: «вот, свекор твой идет в Фамну стричь скот свой»; она сняла одежду вдовства, закрылась покрывалом и «села у ворот Енаима, что на дороге в Фамну». Иуда принял её за блудницу и оставил в залог печать, перевязь и трость. Её близнецы — Фарес и Зара, и от Фареса книга Руфь и Евангелия ведут род Давида и Иисуса."
    - "Если место — Хирбет-эт-Тиббане, то сегодня оно лежит в заповеднике Сансан в Иудейских горах Израиля, к западу от Иерусалима; ничего найденного там с патриархами не связано."
  uk:
    - "Тімна з Буття 38 — це місце, куди Юда пішов стригти овець, і ця розповідь — усе, що про неї відомо. Пропонують три місця. Одне — Тімна в гірській країні Юди, названа разом з Маоном, Кармелем і Зіфом на південь від Хеврона, сама нелокалізована. Друге — Тель-Баташ у долині Сорек, Тімна Самсона на північній межі Юди. Третє — Хірбет-ет-Тібане, руїна на вершині гряди із залізнодобним фортом, приблизно за 7 км на південний схід від Бейт-Неттіфа над долиною Дуба, де арабська назва зберігає давню; його обстежено, але не розкопано. Останнє найкраще пасує розповіді: Юда жив серед людей Одолама, за кілька кілометрів, і «пішов» до Тімни, а Енаїм, де сиділа Тамар, часто ототожнюють з Гаєнамом, названим з Ярмутом і Одоламом серед міст низовини. Єрусалимський Талмуд зберігає думку, що його Тімна й Самсонова — два різні місця."
    - "«Як уплило ж доволї часу, померла Шуанова дочка, жінка Юдина. Віджурившись після того Юда, пійшов до овечих стригачів своїх, сам і приятель його Гіра Адуламець, у Тімну». Стрижка овець була святом із вином. Тамар, двічі вдова, якій досі відмовляли в третьому синові Юди, сповістили: «Он свекір твій ійде в Тімну стригти вівцї свої»; вона скинула вдовину одіж, закуталася наміткою і «сїла в Енаїмській царинї, що при дорозї в Тімну», біля воріт Енаїму. Юда прийняв її за блудницю й залишив у заставу печатку, шнур і палицю. Її близнюками були Фарес і Зерах, і від Фареса Книга Рут та євангелія виводять рід Давида та Ісуса."
    - "Якщо це Хірбет-ет-Тібане, то він нині лежить у заповіднику Сансан у юдейських пагорбах Ізраїлю, на захід від Єрусалима; нічого там не пов’язано з патріархами."
  es:
    - "La Timna de Génesis 38 es el lugar adonde Judá subió a trasquilar sus ovejas, y el relato es todo lo que se sabe. Se proponen tres sitios. Uno es la Timna de la sierra de Judá, enumerada con Maón, Carmel y Zif al sur de Hebrón, también sin localizar. Otro es Tel Batash, en el valle de Sorec, la Timna de Sansón, en la frontera norte de Judá. El tercero es Khirbet et-Tibbaneh, ruina en una cresta con un fuerte de la Edad del Hierro, a unos 7 km al sureste de Beit Nettif, sobre el valle de Ela, donde el nombre árabe conserva el antiguo; prospectado, no excavado. Este encaja mejor con el relato: Judá vivía entre la gente de Adulam, a pocos kilómetros, y «subía» a Timna, y Enaim, donde se sentó Tamar, se toma a menudo por la Enam nombrada con Jarmut y Adulam entre las ciudades de la llanura. El Talmud de Jerusalén recoge la opinión de que su Timna y la de Sansón son dos lugares."
    - "«Y pasaron muchos días, y murió la hija de Súa, mujer de Judá; y Judá se consoló, y subía á los trasquiladores de sus ovejas á Timnath, él y su amigo Hira el Adullamita». El trasquileo era una fiesta con vino. A Tamar, dos veces viuda y a quien aún se negaba el tercer hijo de Judá, le avisaron: «tu suegro sube á Timnath á trasquilar sus ovejas»; se quitó los vestidos de viuda, se cubrió con un velo y «se puso á la puerta de las aguas que están junto al camino de Timnath», la puerta de Enaim. Judá la tomó por una prostituta y le dejó en prenda su sello, su cordón y su báculo. Sus gemelos fueron Fares y Zera, y de Fares el libro de Rut y los evangelios trazan el linaje de David y de Jesús."
    - "Si Khirbet et-Tibbaneh es el lugar, se halla hoy en la reserva natural de Sansán, en las colinas de Judea, en Israel, al oeste de Jerusalén; nada allí se ha vinculado con los patriarcas."
  pt:
    - "A Timna de Gênesis 38 é o lugar a que Judá subiu para tosquiar as suas ovelhas, e a história é tudo o que se sabe dela. Propõem-se três sítios. Um é a Timna da região montanhosa de Judá, listada com Maom, Carmelo e Zife ao sul de Hebrom, não localizada. Outro é Tel Batash, no vale de Soreque, a Timna de Sansão, na fronteira norte de Judá. O terceiro é Khirbet et-Tibbaneh, ruína no alto de uma serra, com um forte da Idade do Ferro, a uns 7 km a sudeste de Beit Nettif, acima do vale de Elá, onde o nome árabe guarda o antigo; prospectado, mas não escavado. Este se ajusta melhor à história: Judá vivia entre o povo de Adulão, a poucos quilômetros, e “subiu” a Timna, e Enaim, onde Tamar se assentou, costuma ser tomada por Enã, citada com Jarmute e Adulão entre as cidades da planície. O Talmude de Jerusalém registra a opinião de que são dois lugares."
    - "“Depois de muitos dias, a filha de Sua, esposa de Judá, morreu. Judá foi consolado, e subiu aos tosquiadores de suas ovelhas em Timna, ele e seu amigo Hira, o adulamita.” A tosquia era uma festa com vinho. A Tamar, duas vezes viúva e ainda negada ao terceiro filho de Judá, disseram: “Eis que o seu sogro está subindo a Timna para tosquiar as suas ovelhas”; ela tirou as roupas de viúva, cobriu-se com um véu e “assentou-se à porta de Enaim, que está no caminho para Timna”. Judá a tomou por prostituta e deixou como penhor seu selo, seu cordão e seu cajado. Seus gêmeos foram Perez e Zera, e de Perez o livro de Rute e os evangelhos traçam a linhagem de Davi e de Jesus."
    - "Se Khirbet et-Tibbaneh é o lugar, fica hoje na reserva natural de Sansan, nas colinas da Judeia, em Israel, a oeste de Jerusalém; nada ali foi ligado aos patriarcas."
  de:
    - "Das Timna von Genesis 38 ist der Ort, zu dem Juda seine Schafe scheren ging; die Erzählung ist alles, was man von ihm weiß. Drei Stätten werden vorgeschlagen. Eine ist das Timna im Bergland Judas, aufgeführt mit Maon, Karmel und Sif südlich von Hebron, selbst nicht lokalisiert. Eine andere ist Tel Batash im Sorektal, Simsons Timna an der Nordgrenze Judas. Die dritte ist Khirbet et-Tibbaneh, eine Ruine auf einem Höhenrücken mit eisenzeitlichem Fort, etwa 7 km südöstlich von Beit Nettif oberhalb des Elatals, wo der arabische Name den alten bewahrt; sie wurde vermessen, aber nicht ausgegraben. Sie passt am besten: Juda lebte bei Adullam, wenige Kilometer entfernt, und ging nach Timna hinauf, und Enajim, wo Tamar saß, gilt oft als das Enam, das mit Jarmut und Adullam zu den Städten der Tiefebene zählt. Nach dem Jerusalemer Talmud sind seines und Simsons Timna zwei Orte."
    - "„Da nun viele Tage verlaufen waren, starb des Sua Tochter, Juda's Weib. Und nachdem Juda ausgetrauert hatte, ging er hinauf seine Schafe zu scheren, gen Thimnath mit seinem Freunde Hira von Adullam.“ Die Schafschur war ein Fest mit Wein. Tamar, zweimal verwitwet und Judas drittem Sohn weiter vorenthalten, wurde gesagt: „dein Schwiegervater geht hinauf gen Thimnath, seine Schafe zu scheren“; sie legte die Witwenkleider ab, verhüllte sich und setzte sich „vor das Tor von Enaim an dem Wege gen Thimnath“. Juda hielt sie für eine Dirne und ließ Siegel, Schnur und Stab als Pfand zurück. Ihre Zwillinge waren Perez und Serach, und von Perez führen das Buch Rut und die Evangelien die Linie Davids und Jesu zurück."
    - "Wenn Khirbet et-Tibbaneh der Ort ist, liegt er heute im Naturreservat Sansan in den judäischen Hügeln Israels, westlich von Jerusalem; nichts dort ist mit den Erzvätern in Verbindung gebracht worden."
  fr:
    - "La Thimna de Genèse 38, où Juda monta tondre ses brebis, n’est connue que par ce récit. Trois sites sont proposés. L’un est la Thimna de la montagne de Juda, citée avec Maon, Carmel et Ziph au sud d’Hébron, elle-même non localisée. Un autre est Tel Batash, dans la vallée de Sorek, la Thimna de Samson à la frontière nord de Juda. Le troisième est Khirbet et-Tibbaneh, ruine de crête avec un fort de l’âge du fer, à environ 7 km au sud-est de Beit Nettif au-dessus de la vallée d’Éla, où le nom arabe garde l’ancien ; il a été prospecté mais non fouillé. Ce dernier convient le mieux : Juda vivait parmi les gens d’Adullam, à quelques kilomètres, et « monta » à Thimna, et Énaïm, où Tamar s’assit, est souvent assimilée à l’Énam cité avec Jarmuth et Adullam parmi les villes de la plaine. Selon le Talmud de Jérusalem, sa Thimna et celle de Samson sont deux lieux."
    - "« Les jours s’écoulèrent, et la fille de Schua, femme de Juda, mourut. Lorsque Juda fut consolé, il monta à Thimna, vers ceux qui tondaient ses brebis, lui et son ami Hira, l’Adullamite. » La tonte était une fête avec du vin. Tamar, deux fois veuve et toujours privée du troisième fils de Juda, apprit : « Voici ton beau-père qui monte à Thimna, pour tondre ses brebis » ; elle ôta ses habits de veuve, se voila et « s’assit à l’entrée d’Énaïm, sur le chemin de Thimna ». Juda la prit pour une prostituée et laissa son sceau, son cordon et son bâton en gage. Elle eut les jumeaux Pérets et Zérach, et de Pérets le livre de Ruth et les évangiles font descendre la lignée de David et de Jésus."
    - "Si Khirbet et-Tibbaneh est le lieu, elle se trouve aujourd’hui dans la réserve naturelle de Sansan, dans les collines de Judée en Israël, à l’ouest de Jérusalem ; rien n’y a été rattaché aux patriarches."
scripture:
  - Gen.38.12-Gen.38.14
  - Josh.15.34-Josh.15.35
  - Josh.15.57
