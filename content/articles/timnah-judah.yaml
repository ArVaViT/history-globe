body:
  en:
    - "The Timnah of Genesis 38 is the place to which Judah went up to shear his sheep, and the story is all that is known of it. Three sites are proposed. One is the Timnah of the hill country of Judah, listed with Maon, Carmel and Ziph south of Hebron, itself unlocated. Another is Tel Batash in the Sorek valley, Samson's Timnah on the northern border of Judah. The third is Khirbet et-Tibbaneh, a ridge-top ruin with an Iron Age fort, about 5 km east of Beit Nettif above the valley of Elah, where the Arabic name keeps the old one; it has been surveyed but not excavated. The last suits the story best: Judah lived among the people of Adullam, a few kilometres away, and “went up” to Timnah, and Enaim, where Tamar sat, is often taken for the Enam named with Jarmuth and Adullam among the towns of the lowland. The Jerusalem Talmud records the view that his Timnah and Samson's are two places."
    - "“And in process of time the daughter of Shuah Judah's wife died; and Judah was comforted, and went up unto his sheepshearers to Timnath, he and his friend Hirah the Adullamite.” Sheepshearing was a feast with wine. Tamar, twice widowed and still denied Judah's third son, was told that “thy father in law goeth up to Timnath to shear his sheep”; she laid off her widow's clothes, veiled herself and “sat in an open place, which is by the way to Timnath”, the gate of Enaim. Judah took her for a prostitute and left his seal, cord and staff as a pledge. Her twins were Perez and Zerah, and from Perez the Book of Ruth and the gospels trace the line of David and of Jesus."
    - "If Khirbet et-Tibbaneh is the place, it lies today in the Sansan nature reserve in the Judean hills of Israel, west of Jerusalem; nothing there has been tied to the patriarchs."
  ru:
    - "Фамна из 38-й главы Бытия — место, куда Иуда ходил стричь овец, и этот рассказ — всё, что о ней известно. Предложены три места. Первое — Фимна в нагорье Иуды, названная вместе с Маоном, Кармилом и Зифом южнее Хеврона, сама не найденная. Второе — Тель-Баташ в долине Сорек, Фимнафа Самсона на северном пределе Иуды. Третье — Хирбет-эт-Тиббане, развалины на гребне с крепостью железного века примерно в 5 км к востоку от Бейт-Неттифа, над долиной дуба, где арабское имя хранит древнее; место обследовано, но не раскопано. Последнее лучше всего подходит к рассказу: Иуда жил среди одолламитян, в нескольких километрах оттуда, и «пошел» в Фамну (в еврейском тексте — «поднялся»), а Енаим, где сидела Фамарь, часто отождествляют с Гаенамом, названным вместе с Иармуфом и Одолламом среди городов низменности. Иерусалимский Талмуд уже приводит мнение, что Фамна Иуды и Фамна Самсона — не одно и то же."
    - "«Прошло много времени, и умерла дочь Шуи, жена Иудина. Иуда, утешившись, пошел в Фамну к стригущим скот его, сам и Хира, друг его, Одолламитянин». Стрижка овец была праздником с вином. Фамари, дважды овдовевшей и так и не отданной третьему сыну Иуды, сообщили: «вот, свекор твой идет в Фамну стричь скот свой»; она сняла одежду вдовства, закрылась покрывалом и «села у ворот Енаима, что на дороге в Фамну». Иуда принял её за блудницу и оставил в залог печать, перевязь и трость. Её близнецы — Фарес и Зара, и от Фареса книга Руфь и Евангелия ведут род Давида и Иисуса."
    - "Если место — Хирбет-эт-Тиббане, то сегодня оно лежит в заповеднике Сансан в Иудейских горах Израиля, к западу от Иерусалима; ничего найденного там с патриархами не связано."
  uk:
    - "Тімна з Буття 38 — це місце, куди Юда пішов стригти овець, і ця розповідь — усе, що про неї відомо. Пропонують три місця. Одне — Тімна в гірській країні Юди, названа разом з Маоном, Кармелем і Зіфом на південь від Хеврона, сама нелокалізована. Друге — Тель-Баташ у долині Сорек, Тімна Самсона на північній межі Юди. Третє — Хірбет-ет-Тібане, руїна на вершині гряди із залізнодобним фортом, приблизно за 5 км на схід від Бейт-Неттіфа над долиною Дуба, де арабська назва зберігає давню; його обстежено, але не розкопано. Останнє найкраще пасує розповіді: Юда жив серед людей Одолама, за кілька кілометрів, і «пішов» до Тімни, а Енаїм, де сиділа Тамар, часто ототожнюють з Гаєнамом, названим з Ярмутом і Одоламом серед міст низовини. Єрусалимський Талмуд зберігає думку, що його Тімна й Самсонова — два різні місця."
    - "«Як уплило ж доволї часу, померла Шуанова дочка, жінка Юдина. Віджурившись після того Юда, пійшов до овечих стригачів своїх, сам і приятель його Гіра Адуламець, у Тімну». Стрижка овець була святом із вином. Тамар, двічі вдова, якій досі відмовляли в третьому синові Юди, сповістили: «Он свекір твій ійде в Тімну стригти вівцї свої»; вона скинула вдовину одіж, закуталася наміткою і «сїла в Енаїмській царинї, що при дорозї в Тімну», біля воріт Енаїму. Юда прийняв її за блудницю й залишив у заставу печатку, шнур і палицю. Її близнюками були Фарес і Зерах, і від Фареса Книга Рут та євангелія виводять рід Давида та Ісуса."
    - "Якщо це Хірбет-ет-Тібане, то він нині лежить у заповіднику Сансан у юдейських пагорбах Ізраїлю, на захід від Єрусалима; нічого там не пов’язано з патріархами."
  es:
    - "La Timna de Génesis 38 es el lugar adonde Judá subió a trasquilar sus ovejas, y el relato es todo lo que se sabe. Se proponen tres sitios. Uno es la Timna de la sierra de Judá, enumerada con Maón, Carmel y Zif al sur de Hebrón, también sin localizar. Otro es Tel Batash, en el valle de Sorec, la Timna de Sansón, en la frontera norte de Judá. El tercero es Khirbet et-Tibbaneh, ruina en una cresta con un fuerte de la Edad del Hierro, a unos 5 km al este de Beit Nettif, sobre el valle de Ela, donde el nombre árabe conserva el antiguo; prospectado, no excavado. Este encaja mejor con el relato: Judá vivía entre la gente de Adulam, a pocos kilómetros, y «subía» a Timna, y Enaim, donde se sentó Tamar, se toma a menudo por la Enam nombrada con Jarmut y Adulam entre las ciudades de la llanura. El Talmud de Jerusalén recoge la opinión de que su Timna y la de Sansón son dos lugares."
    - "«Y pasaron muchos días, y murió la hija de Súa, mujer de Judá; y Judá se consoló, y subía á los trasquiladores de sus ovejas á Timnath, él y su amigo Hira el Adullamita». El trasquileo era una fiesta con vino. A Tamar, dos veces viuda y a quien aún se negaba el tercer hijo de Judá, le avisaron: «tu suegro sube á Timnath á trasquilar sus ovejas»; se quitó los vestidos de viuda, se cubrió con un velo y «se puso á la puerta de las aguas que están junto al camino de Timnath», la puerta de Enaim. Judá la tomó por una prostituta y le dejó en prenda su sello, su cordón y su báculo. Sus gemelos fueron Fares y Zera, y de Fares el libro de Rut y los evangelios trazan el linaje de David y de Jesús."
    - "Si Khirbet et-Tibbaneh es el lugar, se halla hoy en la reserva natural de Sansán, en las colinas de Judea, en Israel, al oeste de Jerusalén; nada allí se ha vinculado con los patriarcas."
  pt:
    - "A Timna de Gênesis 38 é o lugar a que Judá subiu para tosquiar as suas ovelhas, e a história é tudo o que se sabe dela. Propõem-se três sítios. Um é a Timna da região montanhosa de Judá, listada com Maom, Carmelo e Zife ao sul de Hebrom, não localizada. Outro é Tel Batash, no vale de Soreque, a Timna de Sansão, na fronteira norte de Judá. O terceiro é Khirbet et-Tibbaneh, ruína no alto de uma serra, com um forte da Idade do Ferro, a uns 5 km a leste de Beit Nettif, acima do vale de Elá, onde o nome árabe guarda o antigo; prospectado, mas não escavado. Este se ajusta melhor à história: Judá vivia entre o povo de Adulão, a poucos quilômetros, e “subiu” a Timna, e Enaim, onde Tamar se assentou, costuma ser tomada por Enã, citada com Jarmute e Adulão entre as cidades da planície. O Talmude de Jerusalém registra a opinião de que são dois lugares."
    - "“Depois de muitos dias, a filha de Sua, esposa de Judá, morreu. Judá foi consolado, e subiu aos tosquiadores de suas ovelhas em Timna, ele e seu amigo Hira, o adulamita.” A tosquia era uma festa com vinho. A Tamar, duas vezes viúva e ainda negada ao terceiro filho de Judá, disseram: “Eis que o seu sogro está subindo a Timna para tosquiar as suas ovelhas”; ela tirou as roupas de viúva, cobriu-se com um véu e “assentou-se à porta de Enaim, que está no caminho para Timna”. Judá a tomou por prostituta e deixou como penhor seu selo, seu cordão e seu cajado. Seus gêmeos foram Perez e Zera, e de Perez o livro de Rute e os evangelhos traçam a linhagem de Davi e de Jesus."
    - "Se Khirbet et-Tibbaneh é o lugar, fica hoje na reserva natural de Sansan, nas colinas da Judeia, em Israel, a oeste de Jerusalém; nada ali foi ligado aos patriarcas."
  de:
    - "Das Timna von Genesis 38 ist der Ort, zu dem Juda seine Schafe scheren ging; die Erzählung ist alles, was man von ihm weiß. Drei Stätten werden vorgeschlagen. Eine ist das Timna im Bergland Judas, aufgeführt mit Maon, Karmel und Sif südlich von Hebron, selbst nicht lokalisiert. Eine andere ist Tel Batash im Sorektal, Simsons Timna an der Nordgrenze Judas. Die dritte ist Khirbet et-Tibbaneh, eine Ruine auf einem Höhenrücken mit eisenzeitlichem Fort, etwa 5 km östlich von Beit Nettif oberhalb des Elatals, wo der arabische Name den alten bewahrt; sie wurde vermessen, aber nicht ausgegraben. Sie passt am besten: Juda lebte bei Adullam, wenige Kilometer entfernt, und ging nach Timna hinauf, und Enajim, wo Tamar saß, gilt oft als das Enam, das mit Jarmut und Adullam zu den Städten der Tiefebene zählt. Nach dem Jerusalemer Talmud sind seines und Simsons Timna zwei Orte."
    - "„Da nun viele Tage verlaufen waren, starb des Sua Tochter, Juda's Weib. Und nachdem Juda ausgetrauert hatte, ging er hinauf seine Schafe zu scheren, gen Thimnath mit seinem Freunde Hira von Adullam.“ Die Schafschur war ein Fest mit Wein. Tamar, zweimal verwitwet und Judas drittem Sohn weiter vorenthalten, wurde gesagt: „dein Schwiegervater geht hinauf gen Thimnath, seine Schafe zu scheren“; sie legte die Witwenkleider ab, verhüllte sich und setzte sich „vor das Tor von Enaim an dem Wege gen Thimnath“. Juda hielt sie für eine Dirne und ließ Siegel, Schnur und Stab als Pfand zurück. Ihre Zwillinge waren Perez und Serach, und von Perez führen das Buch Rut und die Evangelien die Linie Davids und Jesu zurück."
    - "Wenn Khirbet et-Tibbaneh der Ort ist, liegt er heute im Naturreservat Sansan in den judäischen Hügeln Israels, westlich von Jerusalem; nichts dort ist mit den Erzvätern in Verbindung gebracht worden."
  fr:
    - "La Thimna de Genèse 38, où Juda monta tondre ses brebis, n’est connue que par ce récit. Trois sites sont proposés. L’un est la Thimna de la montagne de Juda, citée avec Maon, Carmel et Ziph au sud d’Hébron, elle-même non localisée. Un autre est Tel Batash, dans la vallée de Sorek, la Thimna de Samson à la frontière nord de Juda. Le troisième est Khirbet et-Tibbaneh, ruine de crête avec un fort de l’âge du fer, à environ 5 km à l’est de Beit Nettif au-dessus de la vallée d’Éla, où le nom arabe garde l’ancien ; il a été prospecté mais non fouillé. Ce dernier convient le mieux : Juda vivait parmi les gens d’Adullam, à quelques kilomètres, et « monta » à Thimna, et Énaïm, où Tamar s’assit, est souvent assimilée à l’Énam cité avec Jarmuth et Adullam parmi les villes de la plaine. Selon le Talmud de Jérusalem, sa Thimna et celle de Samson sont deux lieux."
    - "« Les jours s’écoulèrent, et la fille de Schua, femme de Juda, mourut. Lorsque Juda fut consolé, il monta à Thimna, vers ceux qui tondaient ses brebis, lui et son ami Hira, l’Adullamite. » La tonte était une fête avec du vin. Tamar, deux fois veuve et toujours privée du troisième fils de Juda, apprit : « Voici ton beau-père qui monte à Thimna, pour tondre ses brebis » ; elle ôta ses habits de veuve, se voila et « s’assit à l’entrée d’Énaïm, sur le chemin de Thimna ». Juda la prit pour une prostituée et laissa son sceau, son cordon et son bâton en gage. Elle eut les jumeaux Pérets et Zérach, et de Pérets le livre de Ruth et les évangiles font descendre la lignée de David et de Jésus."
    - "Si Khirbet et-Tibbaneh est le lieu, elle se trouve aujourd’hui dans la réserve naturelle de Sansan, dans les collines de Judée en Israël, à l’ouest de Jérusalem ; rien n’y a été rattaché aux patriarches."
  pl:
    - "Timna z Rdz 38 to miejsce, do którego Juda szedł strzyc owce, a opowieść jest wszystkim, co o nim wiadomo. Proponuje się trzy miejsca. Pierwsze to Timna w górach Judy, wymieniana z Maon, Karmelem i Zifem na południe od Hebronu, sama nieumiejscowiona. Drugie to Tel Batasz w dolinie Sorek, Timna Samsona na północnej granicy Judy. Trzecie to Chirbet et-Tibbane, ruina na szczycie grzbietu z fortem z epoki żelaza, około 5 km na wschód od Bajt Nattif nad doliną Ela, gdzie arabska nazwa zachowuje starą; badano je powierzchniowo, nie wykopaliskowo. Ostatnie najlepiej pasuje do opowieści: Juda mieszkał wśród ludzi z Adullam, kilka kilometrów dalej, i szedł do Timny, a Enajim, gdzie siedziała Tamar, bierze się często za Enam wymienione z Jarmutem i Adullam wśród miast nizin. Talmud jerozolimski zapisuje pogląd, że jego Timna i Timna Samsona to dwa miejsca."
    - "„A gdy minęło wiele dni, umarła córka Suego, żona Judasowa; i pocieszywszy się Judas, szedł do tych, co strzygli owce jego, sam i Chyra, towarzysz jego, Odolamita, do Timnat.” Strzyża owiec była świętem z winem. Tamar, dwukrotnie owdowiała i nadal nieoddana trzeciemu synowi Judy, usłyszała: „Oto, świeker twój idzie do Timnat, aby strzygł owce swoje”; złożyła szaty wdowie, zakryła się welonem i „usiadła na rozstaniu drogi, która wiedzie do Timnat”, w bramie Enajim. Juda wziął ją za nierządnicę i zostawił jako zastaw pieczęć, sznur i laskę. Jej bliźniętami byli Peres i Zerach, a od Peresa Księga Rut i ewangelie wiodą ród Dawida i Jezusa."
    - "Jeśli miejscem tym jest Chirbet et-Tibbane, leży ono dziś w rezerwacie przyrody Sansan we wzgórzach judzkich w Izraelu, na zachód od Jerozolimy; nic tam nie zostało powiązane z patriarchami."
  it:
    - "La Timna di Genesi 38, dove Giuda salì a tosare le sue pecore, è nota solo da quel racconto. Si propongono tre siti. Uno è la Timna delle montagne di Giuda, elencata con Maon, Carmelo e Zif a sud di Ebron, non localizzata. Un altro è Tel Batash nella valle del Sorek, la Timna di Sansone sul confine settentrionale di Giuda. Il terzo è Khirbet et-Tibbaneh, una rovina in cima a un crinale con un forte del Ferro, a circa 5 km a est di Beit Nettif sopra la valle di Ela, dove il nome arabo conserva l’antico; è stato esplorato ma non scavato. Quest’ultimo si accorda meglio col racconto: Giuda viveva fra la gente di Adullam, a pochi chilometri, e «salì» a Timna, ed Enaim, dove sedette Tamar, è spesso identificata con l’Enam nominata con Iarmut e Adullam fra le città della pianura. Il Talmud di Gerusalemme riporta l’opinione che la sua Timna e quella di Sansone siano due luoghi."
    - "«Passaron molti giorni, e morì la figliuola di Shua, moglie di Giuda; e dopo che Giuda si fu consolato, salì da quelli che tosavan le sue pecore a Timna; egli col suo amico Hira, l’Adullamita». La tosatura era una festa con vino. A Tamar, due volte vedova e ancora privata del terzo figlio di Giuda, fu detto: «Ecco, il tuo suocero sale a Timna a tosare le sue pecore»; ella depose le vesti da vedova, si coprì d’un velo e «si pose a sedere alla porta di Enaim, ch’è sulla via di Timna». Giuda la prese per una prostituta e lasciò in pegno il suo sigillo, il cordone e il bastone. I suoi gemelli furono Peres e Zerach, e da Peres il libro di Rut e i vangeli fanno discendere la linea di Davide e di Gesù."
    - "Se il luogo è Khirbet et-Tibbaneh, oggi si trova nella riserva naturale di Sansan, sulle colline della Giudea in Israele, a ovest di Gerusalemme; nulla vi è stato collegato ai patriarchi."
  nl:
    - "Het Timna van Genesis 38 is waar Juda heen ging om zijn schapen te scheren; het verhaal is alles wat ervan bekend is. Drie plaatsen zijn voorgesteld: het Timna in het bergland van Juda, met Maön, Karmel en Zif ten zuiden van Hebron genoemd, zelf ongelokaliseerd; Tel Batash in de Sorekvallei, het Timna van Simson aan de noordgrens van Juda; en Khirbet et-Tibbaneh, een ruïne op een bergkam met een IJzertijdfort, zo’n 5 km ten oosten van Beit Nettif boven de Elavallei, waar de Arabische naam de oude bewaart; onderzocht, niet opgegraven. Die past het best: Juda woonde onder de mensen van Adullam, enkele kilometers verderop, en “ging op” naar Timna, en Enaïm, waar Tamar zat, wordt vaak gelijkgesteld met het Haënam dat met Jarmut en Adullam onder de steden van de laagvlakte staat. Volgens de Jeruzalemse Talmoed zijn zijn Timna en dat van Simson twee plaatsen."
    - "“Als nu vele dagen verlopen waren, stierf de dochter van Sua, de huisvrouw van Juda; daarna troostte zich Juda, en ging op tot zijn schaapscheerders naar Timna toe, hij en Hira, zijn vriend, de Adullamiet.” Het scheren van de schapen was een feest met wijn. Tamar, tweemaal weduwe en nog steeds de derde zoon van Juda onthouden, kreeg te horen: “uw schoonvader gaat op naar Timna, om zijn schapen te scheren”; zij legde haar weduwkleren af, bedekte zich met een sluier en zette zich “aan den ingang der twee fonteinen, die op den weg naar Timna is”, de poort van Enaïm. Juda hield haar voor een hoer en liet zijn zegel, snoer en staf als onderpand achter. Haar tweeling was Perez en Zerach, en van Perez voert het boek Ruth en de evangeliën de lijn naar David en Jezus."
    - "Als Khirbet et-Tibbaneh de plaats is, ligt die tegenwoordig in het natuurreservaat Sansan in de Judese heuvels van Israël, ten westen van Jeruzalem; niets daar is met de aartsvaders in verband gebracht."
  cs:
    - "Timna z Genesis 38 je místo, kam Juda vystoupil ostříhat své ovce, a příběh je vše, co se o něm ví. Navrhují se tři lokality. Jednou je Timna z judského pohoří, uvedená s Maonem, Karmelem a Zífem jižně od Hebronu, sama nelokalizovaná. Další je Tel Batáš v údolí Sorek, Timna Samsonova na severní hranici Judy. Třetí je Chirbet et-Tibbána, zřícenina na vrcholu hřebene s pevností z doby železné, asi 5 km východně od Bejt Nettif nad údolím Éla, kde arabské jméno uchovává staré; byla prozkoumána povrchovým průzkumem, ale ne vykopána. Poslední nejlépe vyhovuje příběhu: Juda žil mezi lidmi z Adulamu, několik kilometrů daleko, a vystoupil do Timny, a Enajim, kde seděla Tamar, se často pokládá za Enam jmenovaný s Jarmutem a Adulamem mezi městy nížiny. Jeruzalémský talmud zaznamenává názor, že jeho Timna a Samsonova jsou dvě místa."
    - "„A po mnohých dnech umřela dcera Suova, manželka Judova. Kterýžto potěšiv se zas, šel do Tamnas k těm, kteříž střihli ovce jeho, a s ním Híra Odolamitský, přítel jeho.“ Střižení ovcí byla slavnost s vínem. Tamaře, dvakrát ovdovělé a stále odpírané Judovu třetímu synovi, bylo řečeno, že „tchán tvůj vstupuje do Tamnas, aby střihl ovce své“; složila vdovské šaty, zahalila se a „seděla na rozcestí, kudy se jde do Tamnas“, u brány Enajim. Juda ji pokládal za nevěstku a nechal jí jako zástavu svou pečeť, šňůru a hůl. Její dvojčata byla Peres a Zerach a od Perese vede Kniha Rut a evangelia linii Davidovu a Ježíšovu."
    - "Je-li to Chirbet et-Tibbána, leží dnes v přírodní rezervaci Sansan v judských kopcích v Izraeli, západně od Jeruzaléma; nic tam nebylo spojeno s patriarchy."
  sv:
    - "Timna i Första Moseboken 38 är platsen dit Juda gick upp för att klippa sina får, och berättelsen är allt som är känt om den. Tre platser föreslås. Den ena är Timna i Judas bergsbygd, upptaget tillsammans med Maon, Karmel och Sif söder om Hebron, självt olokaliserat. Den andra är Tel Batash i Sorekdalen, Simsons Timna vid Judas norra gräns. Den tredje är Khirbet et-Tibbaneh, en ruin på en bergsrygg med ett järnåldersfort, omkring 5 km öster om Beit Nettif ovanför Terebintdalen, där det arabiska namnet bevarar det gamla; den har undersökts men inte grävts ut. Den sista passar berättelsen bäst: Juda bodde bland folket i Adullam, några kilometer bort, och ”gick … upp till Timna”, och Enajim, där Tamar satt, anses ofta vara det Enam som nämns med Jarmut och Adullam bland låglandets städer. Jerusalemtalmud återger uppfattningen att hans Timna och Simsons är två platser."
    - "”En lång tid därefter dog Suas dotter, Judas hustru. Och efter sorgetidens slut gick Juda med sin vän adullamiten Hira upp till Timna, för att se efter dem som klippte hans får.” Fårklippningen var en fest med vin. Tamar, två gånger änka och fortfarande nekad Judas tredje son, fick höra att ”hennes svärfader gick upp till Timna för att klippa sina får”; hon lade av sina änkekläder, betäckte sig med en slöja och ”satte sig vid porten till Enaim på vägen till Timna”. Juda tog henne för en prostituerad och lämnade sitt signet, sin snodd och sin stav som pant. Hennes tvillingar var Peres och Serach, och från Peres för Ruts bok och evangelierna Davids och Jesu släktlinje."
    - "Om Khirbet et-Tibbaneh är platsen ligger den i dag i naturreservatet Sansan i Judeens berg i Israel, väster om Jerusalem; ingenting där har knutits till patriarkerna."
  nb:
    - "Timna i Første Mosebok 38 er stedet Juda gikk opp til for å klippe sauene sine, og fortellingen er alt som er kjent om det. Tre steder er foreslått. Ett er Timna i Judas fjellland, oppført sammen med Maon, Karmel og Sif sør for Hebron, selv ikke lokalisert. Et annet er Tel Batash i Sorek-dalen, Samsons Timna på Judas nordgrense. Det tredje er Khirbet et-Tibbaneh, en ruin på en åstopp med en festning fra jernalderen, omkring 5 km øst for Beit Nettif over Ela-dalen, der det arabiske navnet bevarer det gamle; det er kartlagt, men ikke utgravd. Det siste passer fortellingen best: Juda bodde blant folket i Adullam, noen få kilometer unna, og «gikk op» til Timna, og Enajim, der Tamar satt, regnes ofte for å være Enam, nevnt sammen med Jarmut og Adullam blant byene i lavlandet. Jerusalem-talmud gjengir den oppfatningen at hans Timna og Samsons er to steder."
    - "«Da nu en lengere tid var gått, døde Suas datter, Judas hustru, og da sørgetiden var over, gikk Juda op til Timna, til dem som klippet hans får, og hans venn Hira fra Adullam var med ham.» Saueklipping var en fest med vin. Tamar, to ganger enke og fortsatt nektet Judas tredje sønn, fikk høre at «hennes svigerfar var på vei op til Timna for å klippe sine får»; hun tok enkeklærne av, tilhyllet seg med et slør og «satte sig ved inngangen til Ena'im, på veien til Timna». Juda tok henne for en skjøge og lot signetet, snoren og staven sin være igjen som pant. Tvillingene hennes var Peres og Serah, og fra Peres sporer Rut bok og evangeliene linjen til David og til Jesus."
    - "Hvis Khirbet et-Tibbaneh er stedet, ligger det i dag i Sansan naturreservat i Judeas åser i Israel, vest for Jerusalem; ingenting der er blitt knyttet til patriarkene."
  tl:
    - "Ang Timna ng Genesis 38 ay pinuntahan ni Juda upang gupitan ang tupa niya, at ang kuwento lang ang alam tungkol dito. Tatlong pook ang iminumungkahi: ang Timna ng maburol na lupain ng Juda, na nakatala kasama ng Maon, Carmel at Ziph sa timog ng Hebron, na di rin matukoy; ang Tel Batash sa libis ng Sorek, ang Timna ni Samson sa hilagang hangganan ng Juda; at ang Khirbet et-Tibbaneh, guho sa tuktok ng tagaytay na may kuta ng Panahong Bakal, mga 5 km sa silangan ng Beit Nettif sa itaas ng libis ng Ela, na nag-iingat ng lumang pangalan sa Arabe; nasarbey, hindi nahukay. Pinakaakma ang huli: nanirahan si Juda sa mga taga-Adullam, ilang km ang layo, at “umahon” sa Timna, at ang Enaim, kung saan naupo si Thamar, ay madalas ituring na En-am na nakatala kasama ng Jarmuth at Adullam sa mababang lupain. Ayon sa Talmud ng Jerusalem, magkaibang lugar ang Timna niya at ni Samson."
    - "“At nagdaan ang maraming araw; at namatay ang anak na babae ni Sua, na asawa ni Juda; at nagaliw si Juda, at umahon sa Timnath sa mga manggugupit sa kaniyang mga tupa, siya at ang kaniyang kaibigang si Hira na Adullamita.” Ang paggugupit ng tupa ay kapistahang may alak. Si Thamar, dalawang beses nabalo at hindi pa rin ibinibigay sa kaniya ang ikatlong anak ni Juda, ay sinabihang “ang iyong biyanang lalake ay umaahon sa Timnath upang pagupitan ang kaniyang mga tupa”; hinubad niya ang damit ng pagkabalo, nagtakip ng lambong at “naupo sa pasukan ng Enaim, na nasa daan ng Timnath”. Napagkamalan siya ni Juda na patutot at iniwan ang kaniyang selyo, panali at tungkod bilang sangla. Ang kaniyang kambal ay sina Phares at Zara, at mula kay Phares ay isinusunod ng Aklat ni Ruth at ng mga ebanghelyo ang lahi ni David at ni Jesus."
    - "Kung ang Khirbet et-Tibbaneh ang lugar, ito ay nasa Liwasang Likas ng Sansan sa mga burol ng Judea ng Israel ngayon, sa kanluran ng Jerusalem; walang natagpuan doon na iniuugnay sa mga patriyarka."
  da:
    - "Timna i 1 Mos 38 er stedet, hvor Juda drog op for at klippe sine får, og historien er alt, hvad der vides om det. Tre steder foreslås. Det ene er Timna i Judas bjerge, opført sammen med Maon, Karmel og Zif syd for Hebron, selv ikke lokaliseret. Et andet er Tel Batash i Sorek-dalen, Samsons Timna på Judas nordgrænse. Det tredje er Khirbet et-Tibbaneh, en ruin på en højderyg med et fort fra jernalderen, omkring 5 km øst for Beit Nettif oven for Terebintedalen, hvor det arabiske navn bevarer det gamle; det er undersøgt, men ikke udgravet. Det sidste passer bedst til historien: Juda boede blandt folket i Adullam, nogle få kilometer væk, og han gik »op til Thimnat«, og Enajim, hvor Tamar sad, regnes ofte for den Enam, der nævnes sammen med Jarmut og Adullam blandt byerne i lavlandet. Jerusalemtalmud gengiver den opfattelse, at hans Timna og Samsons er to steder."
    - "»Der mange Dage vare forløbne, da døde Suas Datter, Judas Hustru, og efter at Juda var trøstet, gik han op til Thimnat til dem, som klippede hans Hjord, han og Hira, hans Ven, den Adullamiter.« Fåreklipning var en fest med vin. Tamar, to gange enke og stadig nægtet Judas tredje søn, fik at vide: »din Svigerfader gaar op til Thimnat at klippe sin Hjord«; hun lagde sine enkeklæder af, skjulte sig med et slør og »satte sig ved Indgangen til Enaim, som er paa Vejen til Thimnat«, ved Enajims port. Juda tog hende for en prostitueret og efterlod sit segl, sin snor og sin stav som pant. Hendes tvillinger var Peres og Zerah, og fra Peres følger Ruths Bog og evangelierne linjen til David og Jesus."
    - "Hvis Khirbet et-Tibbaneh er stedet, ligger det i dag i Sansan-naturreservatet i Judæas bjerge i Israel, vest for Jerusalem; intet dér er blevet knyttet til patriarkerne."
  sr:
    - "Тамна из Постања 38 јесте место у које је Јуда отишао да стриже овце, а прича је све што се о њему зна. Предлажу се три налазишта. Једно је Тамна у горју Јудином, наведена с Маоном, Кармилом и Зифом јужно од Хеврона, и сама непозната. Друго је Тел Баташ у долини Сорек, Самсонова Тамна на северној међи Јуде. Треће је Хирбет ет Тибане, рушевина на врху гребена с тврђавом из гвозденог доба, око 5 км источно од Бејт Нетифа изнад долине Ила, где арапско име чува старо; истраживано је површински, али не и ископавано. Последње најбоље одговара причи: Јуда је живео међу људима из Одолама, неколико километара даље, и „пође у Тамну“, а Енајим, где је Тамара седела, често се узима за Енам наведен с Јармотом и Одоламом међу градовима низије. Јерусалимски талмуд бележи гледиште да су његова Тамна и Самсонова два места."
    - "„А кад прође много времена, умре кћи Савина, жена Јудина. И кад се Јуда утеши, пође у Тамну к људима што му стрижаху овце, сам с Ирасом пријатељем својим Одоламејцем.“ Стрижа оваца била је гозба с вином. Тамари, двапут удовици којој је још ускраћиван Јудин трећи син, јављено је: „Ето свекар твој иде у Тамну да стриже овце своје“; она је скинула удовичко рухо, покрила лице и „седе на раскршће на путу који иде у Тамну“, на капији Енајима. Јуда ју је узео за блудницу и оставио јој печат, врпцу и штап као залог. Њени близанци били су Фарес и Зара, а од Фареса Књига о Рути и јеванђеља воде лозу Давидову и Исусову."
    - "Ако је то Хирбет ет Тибане, данас лежи у природном резервату Сансан у јудејским брдима Израела, западно од Јерусалима; ништа онде није повезано с праоцима."
  hu:
    - "A Teremtés könyve 38. fejezetének Timnája az a hely, ahová Júda felment juhait nyírni, és a történeten kívül semmit sem tudunk róla. Három helyet javasolnak. Az egyik a júdai hegyvidék Timnája, amelyet Maónnal, Kármellel és Ziffel együtt sorolnak fel Hebrontól délre, és amely maga is lokalizálatlan. Másik a Tel Batas a Sórek-völgyben, Sámson Timnája Júda északi határán. A harmadik a Khirbet et-Tibbáne, gerincen álló rom vaskori erőddel, Bét Nétiftől mintegy 5 km-re keletre az Éla-völgy fölött, ahol az arab név megőrzi a régit; felmérték, de nem ásták ki. Ez illik legjobban a történethez: Júda a néhány kilométerre lévő Adullám népe között élt, és Timnába ment fel, Énájim pedig, ahol Támár ült, gyakran azonos Énámmal, amelyet Jarmúttal és Adullámmal együtt említenek az alföld városai között. A jeruzsálemi Talmud szerint az ő Timnája és Sámsoné két külön hely."
    - "„Sok idő múlva meghala Súa leánya, a Júda felesége. Júda pedig megvígasztalódék és elméne az ő juhainak nyírőihez, barátjával az Adullámbeli Khirával, Thimnába.” A juhnyírás borral járó ünnep volt. Támárnak, a kétszer megözvegyült asszonynak, akit Júda harmadik fiától még mindig elzártak, azt mondták: „Ím a te ipad Thimnába megy juhainak nyírésére”; levetette özvegyi ruháját, elfátyolozta magát, és „leűle Enajim kapujába, mely a Thimnába vezető úton van”. Júda parázna nőnek nézte, és pecsétjét, zsinórját és botját hagyta zálogul. Ikrei Pérec és Zerah voltak, és Pérectől vezeti le Rúth könyve és az evangéliumok Dávid és Jézus családfáját."
    - "Ha a Khirbet et-Tibbáne a hely, ma Izrael júdeai dombvidékén, Jeruzsálemtől nyugatra a Szánszán természetvédelmi területen fekszik; semmit sem hoztak kapcsolatba ott az ősatyákkal."
  fi:
    - "Ensimmäisen Mooseksen kirjan 38. luvun Timna on paikka, jonne Juuda nousi keritsemään lampaitaan, eikä siitä tiedetä muuta. Ehdokkaita on kolme. Yksi on Juudan vuoristoseudun Timna, mainittu Maonin, Karmelin ja Sifin kanssa Hebronista etelään ja sekin paikantamaton. Toinen on Tel Batash Sorekin laaksossa, Simsonin Timna Juudan pohjoisrajalla. Kolmas on Khirbet et-Tibbaneh, harjanteen raunio rautakautisine linnakkeineen noin 5 km Beit Nettifistä itään Elan laakson yläpuolella; arabialainen nimi säilyttää vanhan; paikka on kartoitettu, ei kaivettu. Viimeinen sopii kertomukseen parhaiten: Juuda asui adullamilaisten keskuudessa muutaman kilometrin päässä ja nousi Timnaan, ja Enaimin, jossa Tamar istui, katsotaan usein olevan alankomaan kaupunkien joukossa Jarmutin ja Adullamin kanssa mainittu Enam. Jerusalemin talmudin mukaan hänen Timnansa ja Simsonin ovat eri paikkoja."
    - "”Pitkän aikaa sen jälkeen Suuan tytär, Juudan vaimo, kuoli. Suruajan mentyä Juuda lähti ystävänsä adullamilaisen Hiiran kanssa Timnaan lammastensa keritsiäisiin.” Lampaiden keritseminen oli viinillä vietetty juhla. Tamarille, joka oli kahdesti leskeksi jäänyt ja jolle Juudan kolmatta poikaa ei yhä annettu, ilmoitettiin: ”Katso, appesi menee Timnaan keritsemään lampaitaan”; hän riisui leskenvaatteensa, verhoutui huntuun ja ”istui Eenaimin portille, Timnaan vievän tien varteen”. Juuda piti häntä porttona ja jätti pantiksi sinettinsä, nauhansa ja sauvansa. Hänen kaksosensa olivat Peres ja Serah, ja Peresistä Ruutin kirja ja evankeliumit johtavat Daavidin ja Jeesuksen suvun."
    - "Jos paikka on Khirbet et-Tibbaneh, se sijaitsee nykyisin Sansanin luonnonpuistossa Israelin Juudean kukkuloilla Jerusalemista länteen; mikään siellä ei ole liitetty patriarkkoihin."
  vi:
    - "Thim-na trong Sáng Thế Ký 38 là nơi Giu-đa lên để hớt lông chiên, và câu chuyện là tất cả những gì biết về nó. Có ba địa điểm được đề nghị. Một là Thim-na ở miền núi Giu-đa, được kể cùng Ma-ôn, Cạt-mên và Xíp phía nam Hếp-rôn, tự nó chưa xác định. Hai là Tel Batash trong trũng Sô-rếch, Thim-na của Sam-sôn trên biên giới bắc của Giu-đa. Ba là Khirbet et-Tibbaneh, một tàn tích trên đỉnh đồi với pháo đài thời đồ sắt, cách Beit Nettif khoảng 5 km về phía đông, phía trên thung lũng Ê-la, nơi tên Ả Rập giữ tên cũ; nó đã được khảo sát nhưng chưa khai quật. Nơi cuối hợp với câu chuyện nhất: Giu-đa sống giữa dân A-đu-lam, cách vài km, và “lên” Thim-na, còn Ê-na-im, nơi Ta-ma ngồi, thường được coi là Ê-nam được nêu cùng Giạt-mút và A-đu-lam trong các thành ở đồng bằng. Talmud Giê-ru-sa-lem ghi quan điểm rằng Thim-na của ông và của Sam-sôn là hai nơi."
    - "“Ngày qua tháng lại, con gái của Su-a, vợ Giu-đa, qua đời. Khi đã nguôi lòng, thì Giu-đa đi cùng bạn là Hi-ra, người A-đu-lam, lên đến nơi mấy thợ hớt lông chiên mình, tại Thim-na.” Hớt lông chiên là một lễ hội có rượu. Ta-ma, hai lần góa và vẫn bị từ chối người con trai thứ ba của Giu-đa, được báo rằng “ông gia ngươi đi lên Thim-na đặng hớt lông chiên”; nàng cởi áo góa bụa, lấy lúp che mặt và “ngồi trước cửa thành Ê-na-im, bên con đường đi về Thim-na”. Giu-đa tưởng nàng là gái điếm và để lại ấn, dây và gậy làm của tin. Hai con sinh đôi của nàng là Phê-rết và Xê-rách, và từ Phê-rết sách Ru-tơ và các sách Tin Lành truy dòng dõi Đa-vít và Giê-su."
    - "Nếu Khirbet et-Tibbaneh là nơi ấy, thì ngày nay nó nằm trong khu bảo tồn thiên nhiên Sansan ở các đồi Giu-đê của Israel, phía tây Giê-ru-sa-lem; không có gì ở đó được gắn với các tổ phụ."
  ro:
    - "Timna din Geneza 38 este locul unde Iuda s-a suit să-și tundă oile; povestea este tot ce se știe despre el. Sunt propuse trei locuri: Timna din ținutul muntos al lui Iuda, enumerată cu Maon, Carmel și Zif la sud de Hebron, nelocalizată; Tel Batash, în valea Sorek, Timna lui Samson, la hotarul nordic al lui Iuda; și Khirbet et-Tibbaneh, o ruină de creastă cu fortăreață din epoca fierului, la circa 5 km est de Beit Nettif, deasupra Văii Elah, unde numele arab îl păstrează pe cel vechi; cercetat prin prospecțiuni, nu săpat. Ultimul se potrivește cel mai bine povestirii: Iuda locuia printre oamenii din Adulam, la câțiva kilometri, și „s’a suit” la Timna, iar Enaim, unde a șezut Tamar, este adesea socotit același cu Enam, numit cu Iarmut și Adulam printre cetățile din șes. Talmudul din Ierusalim consemnează părerea că Timna lui Iuda și cea a lui Samson sunt două locuri."
    - "„Și au trecut zile multe, și a murit Sava femeea lui Iuda, și mângâindu-se Iuda, s’a suit la cei ce tundeau oile lui, el și Iras păstorul lui Odolomiteanul în Tamna.” Tunsul oilor era o sărbătoare cu vin. Tamar, de două ori văduvă și încă lipsită de al treilea fiu al lui Iuda, a aflat că „socrul tău se sue în Tamna să tunză oile sale”; și-a lepădat hainele de văduvă, s-a învăluit cu un văl și „a șezut la porțile Enanului, care este în calea Tamnei”. Iuda a luat-o drept o femeie desfrânată și a lăsat drept zălog sigiliul, cordonul și toiagul. Gemenii ei au fost Pereț și Zerah, iar de la Pereț Cartea Rut și evangheliile urmăresc spița lui David și a lui Isus."
    - "Dacă locul este Khirbet et-Tibbaneh, el se află astăzi în rezervația naturală Sansan din dealurile Iudeii din Israel, la vest de Ierusalim; nimic de acolo nu a fost legat de patriarhi."
  bg:
    - "Тимна от Бит. 38 е мястото, където Юда отишъл да стриже овцете си, и тази история е всичко, което се знае за нея. Предлагани са три места. Едното е Тимна в Юдовата планинска област, изброена с Маон, Кармил и Зиф южно от Хеврон, която също не е локализирана. Другото е Тел Баташ в долината Сорек — Тимна на Самсон на северната граница на Юда. Третото е Хирбет ет-Тибане, развалина на било с крепост от желязната епоха, на около 5 км източно от Бейт Нетиф над долината Ела, където арабското име пази старото; тя е проучвана, но не разкопавана. Последното най-добре отговаря на разказа: Юда живеел сред хората на Одолам, на няколко километра оттам, и „възлезе“ към Тимна, а Енаим, където седяла Тамар, често се смята за Енам, изброен с Ярмут и Одолам сред градовете на низината. Йерусалимският Талмуд записва мнението, че неговата Тимна и тази на Самсон са две места."
    - "„И след много дни умря Юдината жена, дъщерята на Суя, и като се утеши Юда възлезе при стригачите на овците си в Тамна, той и приятелят му Ира Одоламянинът.“ Стригането на овцете било празник с вино. На Тамар, два пъти овдовяла и все още лишена от третия син на Юда, съобщили: „Ето, свекър ти възлиза на Тамна за да остриже овците си“; тя съблякла вдовишките си дрехи, забулила се и „седна при прехода на Енаим, който е при пътя на Тамна“. Юда я взел за блудница и оставил като залог печата, шнура и тоягата си. Нейните близнаци били Фарес и Зерах, а от Фарес книгата Рут и евангелията извеждат родословието на Давид и на Исус."
    - "Ако мястото е Хирбет ет-Тибане, днес то лежи в природния резерват Сансан в Юдейските хълмове в Израел, западно от Йерусалим; нищо там не е свързано с патриарсите."
