body:
  en:
    - "Dedan is the oasis of al-Ula in the Hejaz of north-western Arabia, about 125 km south-west of Tayma and 20 km south of Hegra; the ancient town is the ruin field of al-Khuraybah at the north end of the oasis, where the incense road from Yemen to Syria and Egypt passed between red sandstone cliffs. The Bible's genealogies tie Dedan to both ends of that road: in the table of nations Dedan and Sheba are sons of Raamah, son of Cush, and in the list of Abraham's sons by Keturah they are sons of Jokshan. Jeremiah's cup of wrath is passed to “Dedan, and Tema, and Buz”, the oases of the north."
    - "Isaiah tells “ye travelling companies of Dedanim” to lodge in the thickets of Arabia, caravans driven from the road by war. In Ezekiel's lament over Tyre, “The men of Dedan were thy merchants”, bringing ivory and ebony, and “Dedan was thy merchant in precious clothes for chariots”; with Sheba and the merchants of Tarshish, Dedan asks Gog, “Art thou come to take a spoil?”. Dedan lay at the southern end of Edom's trade: the oracle on Edom runs “from Teman; and they of Dedan shall fall by the sword”, and Jeremiah warns, “dwell deep, O inhabitants of Dedan”."
    - "Nabonidus of Babylon, who lived ten years at Tayma from about 553 BC, lists Dadanu among the oasis towns he marched to. A kingdom of Dedan, and after it the kingdom of Lihyan, ruled the oasis through much of the first millennium BC (the dates of both are disputed), leaving the Dadanitic inscriptions and the colossal sandstone statues of the sanctuary at al-Khuraybah; traders from the Minaean kingdom of Yemen kept a colony there, and tombs with lions carved over their doors look down on the ruins. By the first century BC the Nabataeans had taken over, and their city of Hegra rose to the north."
    - "Today al-Ula is a governorate of Saudi Arabia. Hegra became the kingdom's first UNESCO site in 2008, the Royal Commission for AlUla, founded in 2017, has opened Dadan to visitors, and French and Saudi teams are excavating the sanctuary and the town."
  ru:
    - "Дедан — оазис Эль-Ула в Хиджазе на северо-западе Аравии, примерно в 125 км к юго-западу от Теймы и в 20 км к югу от Хегры; древний город — руины Эль-Хурайбы на северном краю оазиса, где дорога благовоний из Йемена в Сирию и Египет проходила между скалами красного песчаника. Библейские родословия связывают Дедан с обоими концами этой дороги: в таблице народов Дедан и Шева — сыны Раамы, сына Хуша, а в списке сыновей Авраама от Хеттуры — сыны Иокшана. Чаша гнева Иеремии передаётся «Дедана, и Фему, и Буза» — оазисам севера."
    - "Исаия велит: «ночуйте, караваны Деданские!» — в лесу Аравийском, караванам, согнанным с дороги войной. В плаче Иезекииля о Тире «Сыны Дедана торговали с тобою», доставляя слоновую кость и чёрное дерево, и «Дедан торговал с тобою драгоценными попонами для верховой езды»; вместе с Савой и купцами Фарсисскими Дедан спрашивает Гога: «ты пришел, чтобы произвести грабеж?». Дедан лежал на южном конце торговли Едома: пророчество о Едоме гласит «от Фемана до Дедана все падут от меча», а Иеремия предупреждает: «скрывайтесь в пещерах, жители Дедана»."
    - "Набонид Вавилонский, живший десять лет в Тейме примерно с 553 г. до н. э., называет Дадану среди оазисных городов, к которым ходил походом. Царство Дедан, а за ним царство Лихьян правили оазисом на протяжении большей части I тысячелетия до н. э. (даты обоих спорны), оставив даданские надписи и колоссальные песчаниковые статуи святилища в Эль-Хурайбе; торговцы минейского царства из Йемена держали там колонию, а гробницы со львами, высеченными над входом, смотрят на развалины. К I веку до н. э. оазис перешёл к Набатеям, и к северу поднялся их город Хегра."
    - "Сегодня Эль-Ула — округ Саудовской Аравии. Хегра в 2008 году стала первым в королевстве объектом ЮНЕСКО, Королевская комиссия по Эль-Уле, созданная в 2017 году, открыла Дадан для посетителей, а французские и саудовские экспедиции раскапывают святилище и город."
  uk:
    - "Дедан — оазис аль-Ула в Хіджазі північно-західної Аравії, приблизно за 125 км на південний захід від Тайми та за 20 км на південь від Хегри; давнє місто — це поле руїн аль-Хурайба на північному краю оазису, де кадильна дорога з Ємену до Сирії та Єгипту проходила між скелями з червоного пісковика. Біблійні родоводи прив'язують Дедан до обох кінців цієї дороги: у таблиці народів Дедан і Шева — сини Раами, сина Куша, а в списку синів Авраама від Хетури вони сини Йокшана. Чаша гніву в Єремії передається «Деданї, Темі й Бузї», оазисам півночі."
    - "Ісая каже «подорожні Деданські» ночувати в лісі Аравії — каравани, прогнані з дороги війною. У плачі Єзекіїля над Тиром «Деданїї торгували з тобою», приносячи слонову кістку та чорне дерево, і «Дедан торгував із тобою сїдельними коверцями до їзди верхової»; із Шевою та купцями Тарсису Дедан питає Гога: «Чи се ж прийшов єси, щоб рабувати». Дедан лежав на південному кінці едомської торгівлі: оракул про Едом каже «Від Теману до Дедану поляжуть вони од меча», а Єремія застерігає: «ховайтесь глибоко в печерах, осадники Деданські»."
    - "Набонід Вавилонський, який прожив десять років у Таймі від близько 553 р. до н. е., перелічує Дадану серед оазисних міст, до яких він ходив. Царство Дедан, а після нього царство Ліх'ян правили оазисом упродовж більшої частини I тис. до н. е. (дати обох спірні), залишивши даданітські написи й колосальні пісковикові статуї святилища в аль-Хурайбі; купці з Мінейського царства Ємену мали там колонію, а гробниці з левами, вирізьбленими над дверима, дивляться на руїни. До I ст. до н. е. набатеї перейняли цей край, і їхнє місто Хегра постало на півночі."
    - "Сьогодні аль-Ула — провінція Саудівської Аравії. Хегра стала першим об'єктом ЮНЕСКО в королівстві у 2008 р., Королівська комісія з АльУла, заснована в 2017 р., відкрила Дадан для відвідувачів, а французькі й саудівські групи розкопують святилище й місто."
  es:
    - "Dedán es el oasis de al-Ula, en el Hiyaz del noroeste de Arabia, a unos 125 km al sudoeste de Tayma y a 20 km al sur de Hegra; la ciudad antigua es el campo de ruinas de al-Khuraybah, en el extremo norte del oasis, por donde la ruta del incienso de Yemen a Siria y Egipto pasaba entre acantilados de arenisca roja. Las genealogías de la Biblia vinculan Dedán con ambos extremos de esa ruta: en la tabla de las naciones, Dedán y Seba son hijos de Raama, hijo de Cus, y en la lista de los hijos de Abraham con Cetura son hijos de Jocsán. La copa de la ira de Jeremías se pasa a «Dedán, y Tema, y Buz», los oasis del norte."
    - "Isaías dice a los «caminantes de Dedanim» que pasen la noche en el monte de Arabia, caravanas expulsadas del camino por la guerra. En el lamento de Ezequiel por Tiro, «Los hijos de Dedán eran tus negociantes», que traían marfil y ébano, y «Dedán fué tu mercadera con paños preciosos para carros»; con Seba y los mercaderes de Tarsis, Dedán pregunta a Gog: «¿Has venido á arrebatar despojos?». Dedán se hallaba en el extremo sur del comercio de Edom: el oráculo sobre Edom dice «desde Temán y Dedán caerán á cuchillo», y Jeremías advierte: «escondeos en simas para estar, oh moradores de Dedán»."
    - "Nabónido de Babilonia, que vivió diez años en Tayma desde alrededor del 553 a. C., enumera Dadanu entre los oasis a los que marchó. Un reino de Dedán, y después de él el reino de Lihyán, gobernó el oasis durante buena parte del primer milenio a. C. (las fechas de ambos son discutidas), y dejó las inscripciones dadaníticas y las estatuas colosales de arenisca del santuario de al-Khuraybah; comerciantes del reino minaico de Yemen mantuvieron allí una colonia, y tumbas con leones tallados sobre sus puertas miran desde lo alto las ruinas. En el siglo I a. C. los nabateos se habían hecho con el control, y su ciudad de Hegra se alzó al norte."
    - "Hoy al-Ula es una gobernación de Arabia Saudí. Hegra se convirtió en 2008 en el primer sitio de la UNESCO del reino, la Comisión Real para AlUla, fundada en 2017, ha abierto Dadán a los visitantes, y equipos franceses y saudíes excavan el santuario y la ciudad."
  pt:
    - "Dedã é o oásis de al-Ula, no Hejaz, no noroeste da Arábia, cerca de 125 km a sudoeste de Tayma e 20 km ao sul de Hégra; a cidade antiga é o campo de ruínas de al-Khuraybah, no extremo norte do oásis, por onde a rota do incenso do Iêmen para a Síria e o Egito passava entre penhascos de arenito vermelho. As genealogias da Bíblia ligam Dedã às duas pontas dessa rota: na tábua das nações, Dedã e Sabá são filhos de Raamá, filho de Cuxe, e na lista dos filhos de Abraão com Quetura eles são filhos de Jocsã. O cálice de ira de Jeremias é passado a “Dedã, Tema, Buz”, os oásis do norte."
    - "Isaías diz às “caravanas de dedanitas” que pernoitem nos matagais da Arábia, caravanas expulsas da estrada pela guerra. No lamento de Ezequiel sobre Tiro, “Os homens de Dedã negociavam com você”, trazendo marfim e ébano, e “Dedã era a sua mercadora de mantas preciosas de sela para montaria”; com Sabá e os mercadores de Társis, Dedã pergunta a Gogue: “Você veio para tomar o despojo?” Dedã ficava no extremo sul do comércio de Edom: o oráculo sobre Edom diz “a partir de Temã. Eles cairão à espada até Dedã”, e Jeremias adverte: “Refugiem-se nas profundezas, habitantes de Dedã”."
    - "Nabonido da Babilônia, que viveu dez anos em Tayma a partir de cerca de 553 a.C., lista Dadanu entre as cidades-oásis a que marchou. Um reino de Dedã, e depois dele o reino de Lihyan, governou o oásis durante boa parte do primeiro milênio a.C. (as datas de ambos são discutidas), deixando as inscrições dadaníticas e as estátuas colossais de arenito do santuário de al-Khuraybah; comerciantes do reino minaico do Iêmen mantinham ali uma colônia, e túmulos com leões esculpidos sobre as portas olham do alto as ruínas. No século I a.C., os nabateus haviam assumido o controle, e sua cidade de Hégra surgiu ao norte."
    - "Hoje al-Ula é uma província da Arábia Saudita. Hégra tornou-se em 2008 o primeiro sítio da UNESCO do reino, a Comissão Real para AlUla, fundada em 2017, abriu Dadan aos visitantes, e equipes francesas e sauditas escavam o santuário e a cidade."
  de:
    - "Dedan ist die Oase al-Ula im Hidschas im Nordwesten Arabiens, etwa 125 km südwestlich von Tayma und 20 km südlich von Hegra; die antike Stadt ist das Ruinenfeld von al-Khuraybah am Nordende der Oase, wo die Weihrauchstraße vom Jemen nach Syrien und Ägypten zwischen roten Sandsteinfelsen hindurchführte. Die Genealogien der Bibel verbinden Dedan mit beiden Enden dieser Straße: In der Völkertafel sind Dedan und Scheba Söhne Ragmas, des Sohnes Kuschs, und in der Liste der Söhne Abrahams von Ketura sind sie Söhne Jokschans. Jeremias Becher des Zorns wird weitergereicht an „denen von Dedan, denen von Thema, denen von Bus“, die Oasen des Nordens."
    - "Jesaja kündigt an: „ihr werdet im Walde in Arabien herbergen, ihr Reisezüge der Dedaniter“, Karawanen, die der Krieg von der Straße vertrieb. In Hesekiels Klage über Tyrus: „Die von Dedan sind deine Händler gewesen“, die Elfenbein und Ebenholz brachten, und „Dedan hat mit dir gehandelt mit Decken zum Reiten“; zusammen mit Scheba und den Kaufleuten von Tarsis sagt Dedan zu Gog: „Ich meine ja, du seist recht gekommen, zu rauben“. Dedan lag am Südende von Edoms Handel: Das Orakel über Edom lautet „von Theman bis gen Dedan und durchs Schwert fällen“, und Jeremia warnt: „verkriecht euch tief, ihr Bürger zu Dedan!“"
    - "Nabonid von Babylon, der ab etwa 553 v. Chr. zehn Jahre in Tayma lebte, führt Dadanu unter den Oasenstädten auf, zu denen er zog. Ein Königreich Dedan und danach das Königreich Lihyan herrschten während eines Großteils des 1. Jahrtausends v. Chr. über die Oase (die Datierung beider ist umstritten) und hinterließen die dadanitischen Inschriften und die kolossalen Sandsteinstatuen des Heiligtums in al-Khuraybah; Händler des minäischen Königreichs im Jemen unterhielten dort eine Kolonie, und Gräber mit über den Türen eingemeißelten Löwen blicken auf die Ruinen herab. Im 1. Jahrhundert v. Chr. hatten die Nabatäer übernommen, und ihre Stadt Hegra erhob sich im Norden."
    - "Heute ist al-Ula ein Gouvernement Saudi-Arabiens. Hegra wurde 2008 die erste UNESCO-Stätte des Königreichs, die 2017 gegründete Royal Commission for AlUla hat Dadan für Besucher geöffnet, und französische und saudische Teams graben das Heiligtum und die Stadt aus."
  fr:
    - "Dedan est l’oasis d’al-Ula dans le Hedjaz, au nord-ouest de l’Arabie, à environ 125 km au sud-ouest de Tayma et à 20 km au sud de Hégra ; la ville antique est le champ de ruines d’al-Khuraybah, à l’extrémité nord de l’oasis, où la route de l’encens du Yémen vers la Syrie et l’Égypte passait entre des falaises de grès rouge. Les généalogies de la Bible rattachent Dedan aux deux extrémités de cette route : dans la table des peuples, Dedan et Schéba sont fils de Raema, fils de Cusch, et dans la liste des fils d’Abraham et de Ketura ils sont fils de Jokschan. La coupe de colère de Jérémie est passée à « Dedan, à Théma, à Buz », oasis du nord."
    - "Ésaïe dit aux « caravanes de Dedan » de passer la nuit dans les broussailles de l’Arabie, caravanes chassées de la route par la guerre. Dans la lamentation d’Ézéchiel sur Tyr, « les enfants de Dedan trafiquaient avec toi », apportant ivoire et ébène, et « Dedan trafiquait avec toi en couvertures pour s’asseoir à cheval » ; avec Schéba et les marchands de Tarsis, Dedan demande à Gog : « Viens-tu pour faire du butin ? » Dedan se trouvait à l’extrémité sud du commerce d’Édom : l’oracle sur Édom va « de Théman à Dedan ; ils tomberont par l’épée », et Jérémie avertit : « retirez-vous dans les cavernes, habitants de Dedan »."
    - "Nabonide de Babylone, qui vécut dix ans à Tayma à partir de 553 av. J.-C. environ, énumère Dadanu parmi les villes d’oasis où il marcha. Un royaume de Dedan, puis le royaume de Lihyân, gouverna l’oasis pendant une grande partie du Ier millénaire av. J.-C. (les dates de l’un et de l’autre sont discutées), laissant les inscriptions dadanitiques et les statues colossales de grès du sanctuaire d’al-Khuraybah ; des marchands du royaume minéen du Yémen y entretenaient une colonie, et des tombes aux lions sculptés au-dessus de leurs portes dominent les ruines. Au Ier siècle av. J.-C., les Nabatéens avaient pris le relais, et leur ville de Hégra s’éleva plus au nord."
    - "Aujourd’hui, al-Ula est un gouvernorat d’Arabie saoudite. Hégra est devenue en 2008 le premier site de l’UNESCO du royaume, la Commission royale pour AlUla, fondée en 2017, a ouvert Dadan aux visiteurs, et des équipes françaises et saoudiennes fouillent le sanctuaire et la ville."
  it:
    - "Dedan è l’oasi di al-Ula nell’Hegiaz dell’Arabia nord-occidentale, a circa 125 km a sud-ovest di Tayma e a 20 km a sud di Hegra; l’antica città è il campo di rovine di al-Khuraybah all’estremità settentrionale dell’oasi, dove la via dell’incenso dallo Yemen alla Siria e all’Egitto passava fra rupi di arenaria rossa. Le genealogie bibliche legano Dedan a entrambe le estremità di quella via: nella tavola dei popoli Dedan e Saba sono figli di Raama, figlio di Cus, e nell’elenco dei figli di Abramo e Chetura sono figli di Iocsan. La coppa dell’ira di Geremia passa «a Dedan, a Tema, a Buz», le oasi del nord."
    - "Isaia ordina alle «carovane dei Dedaniti» di passare la notte nelle foreste d’Arabia, carovane cacciate dalla via dalla guerra. Nel lamento di Ezechiele su Tiro, «i figliuoli di Dedan trafficano teco», portando avorio ed ebano, e «Dedan traffica teco in coperte da cavalcatura»; con Saba e i mercanti di Tarsis, Dedan chiede a Gog: «Vieni tu per far bottino?» Dedan stava all’estremità meridionale del commercio di Edom: l’oracolo contro Edom dice «fino da Theman, e fino a Dedan cadranno per la spada», e Geremia avverte: «nascondetevi profondamente, o abitanti di Dedan»."
    - "Nabonedo di Babilonia, che visse dieci anni a Tayma dal 553 a.C. circa, elenca Dadanu fra le città-oasi verso cui marciò. Un regno di Dedan, e dopo di esso il regno di Lihyan, governò l’oasi per buona parte del I millennio a.C. (le date di entrambi sono discusse), lasciando le iscrizioni dadanitiche e le statue colossali di arenaria del santuario di al-Khuraybah; mercanti del regno minèo dello Yemen vi mantenevano una colonia, e tombe con leoni scolpiti sopra le porte guardano dall’alto le rovine. Nel I secolo a.C. i Nabatei avevano preso il controllo, e la loro città di Hegra sorse a nord."
    - "Oggi al-Ula è un governatorato dell’Arabia Saudita. Hegra divenne nel 2008 il primo sito UNESCO del regno, la Commissione reale per AlUla, fondata nel 2017, ha aperto Dadan ai visitatori, e squadre francesi e saudite scavano il santuario e la città."
  pl:
    - "Dedan to oaza Al-Ula w Hidżazie w północno-zachodniej Arabii, około 125 km na południowy zachód od Tajmy i 20 km na południe od Hegry; starożytne miasto to pole ruin Al-Churajba na północnym krańcu oazy, gdzie szlak kadzidlany z Jemenu do Syrii i Egiptu przechodził między czerwonymi klifami z piaskowca. Genealogie biblijne wiążą Dedan z oboma końcami tego szlaku: w tablicy ludów Dedan i Szeba są synami Raamy, syna Kusza, a na liście synów Abrahama z Keturą są synami Jokszana. Jeremiasz każe napoić pucharem gniewu „Dedana i Temę, i Buzę”, oazy północy."
    - "Izajasz mówi „o podróżni Dedańscy!”, aby nocowali w lasach Arabii, karawany zepchnięte ze szlaku przez wojnę. W lamencie Ezechiela nad Tyrem „Synowie Dedanowi, kupcy twoi” dostarczali kości słoniowej i hebanu, a „Dedan kupczył w tobie suknami kosztownemi na wozy”; razem z Szebą i kupcami z Tarszisz Dedan pyta Goga: „Izali ty na branie łupów idziesz?” Dedan leżał na południowym krańcu handlu Edomu: wyrocznia o Edomie głosi „od Teman aż do Dedan od miecza polegną”, a Jeremiasz ostrzega: „zstąpcie w głębokość na mieszkanie, obywatele Dedan!”"
    - "Nabonid z Babilonu, który mieszkał dziesięć lat w Tajmie od około 553 r. p.n.e., wymienia Dadanu wśród miast-oaz, do których wyruszył. Królestwo Dedan, a po nim królestwo Lihjan, rządziło oazą przez znaczną część I tysiąclecia p.n.e. (daty obu są sporne), zostawiając inskrypcje dadanickie i kolosalne piaskowcowe posągi sanktuarium w Al-Churajba; kupcy z minejskiego królestwa Jemenu mieli tu kolonię, a grobowce z lwami wyrzeźbionymi nad drzwiami patrzą z góry na ruiny. W I w. p.n.e. przejęli władzę Nabatejczycy, a ich miasto Hegra wyrosło na północy."
    - "Dziś Al-Ula jest muhafazą Arabii Saudyjskiej. Hegra stała się pierwszym obiektem królestwa na liście UNESCO w 2008 r., Królewska Komisja ds. AlUla, założona w 2017 r., udostępniła Dadan zwiedzającym, a zespoły francuskie i saudyjskie prowadzą wykopaliska sanktuarium i miasta."
  nl:
    - "Dedan is de oase al-Ula in de Hidzjaz van Noordwest-Arabië, zo'n 125 km ten zuidwesten van Tayma en 20 km ten zuiden van Hegra; de oude stad is het ruïneveld al-Khuraybah aan het noordeinde van de oase, waar de wierookroute van Jemen naar Syrië en Egypte tussen rode zandsteenrotsen liep. De genealogieën van de Bijbel verbinden Dedan met beide einden van die route: in het volkerenregister zijn Dedan en Seba zonen van Raäma, zoon van Kus, en in de lijst van Abrahams zonen bij Ketura zijn zij zonen van Joksan. Jeremia's beker van de toorn gaat naar “Dedan, en Thema, en Buz”, de oasen van het noorden."
    - "Jesaja zegt: “In het woud van Arabië zult gijlieden vernachten, o gij reizende gezelschappen van Dedanieten”, karavanen die door oorlog van de weg zijn gedreven. In Ezechiëls klaagzang over Tyrus: “De kinderen van Dedan waren uw kooplieden”, die ivoor en ebbenhout brachten, en “Dedan handelde met u met kostelijk gewand tot wagens”; met Seba en de kooplieden van Tarsis vraagt Dedan Gog: “Komt gij, om buit te buiten?” Dedan lag aan het zuideinde van Edoms handel: het orakel over Edom luidt “van Theman af; en zij zullen tot Dedan toe door het zwaard vallen”, en Jeremia waarschuwt: “woont in diepe plaatsen, gij inwoners van Dedan”."
    - "Nabonidus van Babylon, die vanaf omstreeks 553 v.Chr. tien jaar in Tayma woonde, noemt Dadanu onder de oasesteden waarheen hij optrok. Een koninkrijk Dedan en daarna het koninkrijk Lihyan beheersten de oase gedurende een groot deel van het eerste millennium v.Chr. (de dateringen van beide zijn omstreden), met als nalatenschap de Dadanitische inscripties en de kolossale zandstenen beelden van het heiligdom te al-Khuraybah; kooplieden uit het Minese koninkrijk van Jemen hadden er een kolonie, en graven met boven de deuren uitgehouwen leeuwen kijken neer op de ruïnes. In de eerste eeuw v.Chr. hadden de Nabateeërs het overgenomen, en hun stad Hegra verrees in het noorden."
    - "Tegenwoordig is al-Ula een gouvernement van Saoedi-Arabië. Hegra werd in 2008 de eerste UNESCO-plaats van het land, de in 2017 opgerichte Koninklijke Commissie voor AlUla heeft Dadan voor bezoekers geopend, en Franse en Saoedische teams graven het heiligdom en de stad op."
  cs:
    - "Dedan je oáza al-Ula v Hidžázu v severozápadní Arábii, asi 125 km jihozápadně od Tayma a 20 km jižně od Hegry; antické město je pole zřícenin al-Khuraybah na severním konci oázy, kudy kadidlová stezka z Jemenu do Sýrie a Egypta procházela mezi červenými pískovcovými útesy. Biblické rodokmeny vážou Dedana k oběma koncům té cesty: v tabulce národů jsou Dedan a Šeba synové Raemovi, syna Kúšova, a v seznamu Abrahamových synů s Keturou jsou synové Jokšanovi. Jeremjášův kalich hněvu míří na „Dedana a Temu, a Buzu“, oázy severu."
    - "Izajáš říká karavanám: „Po lesích v Arabii nocleh mívati budete, ó pocestní Dedanských“, karavanám vyhnaným z cesty válkou. V Ezechielově nářku nad Týrem byli „Synové Dedanovi kupci tvoji“, přinášející slonovinu a ebenové dřevo, a „Dedan kupčíval v tobě v suknech drahých k vozům“; se Šebou a kupci z Taršíše se Dedan ptá Goga: „K rozebrání-liž kořistí ty se béřeš?“ Dedan ležel na jižním konci edómského obchodu: věštba o Edómu zní „od Teman až do Dedan mečem padati budou“ a Jeremjáš varuje: „hluboko se schovejte, obyvatelé Dedan“."
    - "Nabonid Babylónský, který žil deset let v Tayma od roku asi 553 př. n. l., uvádí Dadanu mezi oázními městy, k nimž táhl. Království Dedan a po něm království Lihyan vládlo oáze po většinu 1. tisíciletí př. n. l. (datace obou je sporná) a zanechalo dadanitské nápisy a kolosální pískovcové sochy ze svatyně v al-Khuraybah; obchodníci z minejského království v Jemenu tam udržovali kolonii a hrobky s lvy vytesanými nad dveřmi shlížejí na zříceniny. V 1. století př. n. l. už převzali vládu Nabatejci a jejich město Hegra vzniklo na severu."
    - "Dnes je al-Ula guvernorát Saúdské Arábie. Hegra se stala prvním místem království na seznamu UNESCO roku 2008, Královská komise pro AlUla, založená roku 2017, zpřístupnila Dadan návštěvníkům a francouzské a saúdské týmy vykopávají svatyni i město."
  sv:
    - "Dedan är oasen al-Ula i Hijaz i nordvästra Arabien, omkring 125 km sydväst om Tayma och 20 km söder om Hegra; den antika staden är ruinfältet al-Khuraybah i oasens norra ända, där rökelsevägen från Jemen till Syrien och Egypten gick mellan röda sandstensklippor. Bibelns släktregister knyter Dedan till båda ändar av den vägen: i folkens tavla är Dedan och Saba söner till Raama, son till Kush, och i förteckningen över Abrahams söner med Ketura är de söner till Jokshan. Jeremias vredesbägare räcker till ”Dedan, Tema, Bus”, oaserna i norr."
    - "Jesaja säger åt ”I karavaner från Dedan” att ”tagen natthärbärge i Arabiens vildmark”, karavaner som drivits från vägen av krig. I Hesekiels klagosång över Tyros heter det att ”Dedans söner drevo köpenskap med dig”, med ”elfenben och ebenholts” som ”hyllningsgåvor”, och ”Dedan drev köpenskap hos dig med sadeltäcken att rida på”; med Saba och Tarshishs köpmän frågar Dedan Gog: ”Har du kommit för att taga rov?”. Dedan låg vid södra änden av Edoms handel: domen över Edom lyder ”ända från Teman, och ända borta i Dedan skola de falla för svärd”, och Jeremia varnar: ”gömmen eder djupt nere, I Dedans inbyggare”."
    - "Nabonid av Babylon, som bodde tio år i Tayma från omkring 553 f.Kr., förtecknar Dadanu bland oasstäderna han tågade till. Ett kungarike Dedan, och efter det kungariket Lihyan, styrde oasen under stora delar av första årtusendet f.Kr. (dateringen av båda är omstridd) och lämnade efter sig de dadanitiska inskrifterna och de kolossala sandstensstatyerna från helgedomen i al-Khuraybah; handelsmän från det minéiska riket i Jemen höll en koloni där, och gravar med lejon ristade över dörrarna blickar ner över ruinerna. Vid första århundradet f.Kr. hade nabatéerna tagit över, och deras stad Hegra reste sig i norr."
    - "I dag är al-Ula ett guvernement i Saudiarabien. Hegra blev kungarikets första Unesco-plats 2008, Kungliga kommissionen för AlUla, grundad 2017, har öppnat Dadan för besökare, och franska och saudiska team gräver ut helgedomen och staden."
  nb:
    - "Dedan er oasen al-Ula i Hijaz i nordvestlige Arabia, omtrent 125 km sørvest for Tayma og 20 km sør for Hegra; den gamle byen er ruinfeltet al-Khuraybah i nordenden av oasen, der røkelsesveien fra Jemen til Syria og Egypt gikk mellom røde sandsteinsklipper. Bibelens slektsregistre knytter Dedan til begge ender av denne veien: i folketavlen er Dedan og Sjeba sønner av Raema, sønn av Kusj, og i listen over Abrahams sønner med Ketura er de sønner av Joksjan. Jeremias vredesbeger rekkes til «Dedan og Tema og Bus», oasene i nord."
    - "Jesaja sier til «I karavaner av dedanitter!» at de skal overnatte i «skogen i Arabia», karavaner drevet bort fra veien av krig. I Esekiels klagesang over Tyros: «Dedans sønner var dine kremmere», som gav «elfenben og ibenholt» til betaling, og «Dedan handlet med dig med dekkener til å ride på»; sammen med Sjeba og kjøpmennene fra Tarsis spør Dedan Gog: «Kommer du for å rane og røve?» Dedan lå i sørenden av Edoms handel: orakelet mot Edom lyder «helt fra Teman, og like til Dedan skal de falle for sverdet», og Jeremia advarer: «skjul eder dypt nede, I Dedans innbyggere!»"
    - "Nabonid av Babylon, som bodde ti år i Tayma fra omkring 553 f.Kr., fører opp Dadanu blant oasebyene han marsjerte til. Et kongedømme Dedan, og etter det kongedømmet Lihyan, styrte oasen gjennom store deler av det første årtusen f.Kr. (dateringene av begge er omdiskutert), og etterlot dadanittiske innskrifter og de kolossale sandsteinsstatuene fra helligdommen i al-Khuraybah; handelsmenn fra det minaiske kongedømmet i Jemen hadde en koloni der, og graver med løver utskåret over dørene ser ned på ruinene. I det første århundre f.Kr. hadde nabateerne overtatt, og deres by Hegra reiste seg i nord."
    - "I dag er al-Ula et guvernement i Saudi-Arabia. Hegra ble kongedømmets første UNESCO-sted i 2008, Den kongelige kommisjonen for AlUla, grunnlagt i 2017, har åpnet Dadan for besøkende, og franske og saudiske team graver ut helligdommen og byen."
  tl:
    - "Ang Dedan ay ang oasis ng al-Ula sa Hejaz ng hilagang-kanlurang Arabia, mga 125 km sa timog-kanluran ng Tayma at 20 km sa timog ng Hegra; ang sinaunang bayan ay ang kalatagan ng guho ng al-Khuraybah sa hilagang dulo ng oasis, kung saan dumaan ang daan ng kamangyan mula Yemen patungong Siria at Egipto sa pagitan ng mga pulang talampas na batong-buhangin. Iniuugnay ng mga talaan ng lahi ng Bibliya ang Dedan sa magkabilang dulo ng daang iyon: sa Talaan ng mga Bansa, sina Dedan at Seba ay mga anak ni Raama, anak ni Cush, at sa talaan ng mga anak ni Abraham kay Cetura ay mga anak sila ni Joksan. Ang saro ng poot ni Jeremias ay ipinapasa sa “Ang Dedan, at ang Tema, at ang Buz”, mga oasis sa hilaga."
    - "Sinabi ni Isaias sa “kayong nangaglalakbay na pulupulutong na mga Dedaneo” na magsitigil sa gubat ng Arabia, mga karabanang itinaboy sa daan ng digmaan. Sa panaghoy ni Ezekiel tungkol sa Tiro, “Ang mga tao sa Dedan ay iyong mangangalakal”, na nagdadala ng garing at ebano, at “Naging iyong mangangalakal ang Dedan sa mga mahalagang kayo na ukol sa pangangabayo”; kasama ang Seba at ang mga mangangalakal ng Tharsis, itinatanong ng Dedan kay Gog, “Naparito ka baga upang kumuha ng samsam?”. Nasa katimugang dulo ng kalakalan ng Edom ang Dedan: ang orakulo tungkol sa Edom ay “mula sa Teman; hanggang sa Dedan nga ay mabubuwal sila sa pamamagitan ng tabak”, at nagbababala si Jeremias, “magsitahan sa kalaliman, Oh mga nananahan sa Dedan”."
    - "Si Nabonido ng Babilonia, na nanirahan nang sampung taon sa Tayma mula mga 553 BK, ay naglilista ng Dadanu sa mga bayang-oasis na pinuntahan niya. Ang isang kaharian ng Dedan, at pagkatapos nito ang kaharian ng Lihyan, ang namuno sa oasis sa malaking bahagi ng unang milenyo BK (pinagtatalunan ang mga petsa ng dalawa), na nag-iwan ng mga inskripsiyong Dadanitiko at ng malalaking estatwang batong-buhangin ng santuwaryo sa al-Khuraybah; ang mga mangangalakal mula sa kahariang Minaean ng Yemen ay may kolonya roon, at ang mga libingang may inukit na leon sa ibabaw ng kanilang pinto ay nakatanaw sa mga guho. Pagsapit ng ika-1 siglo BK, kinuha na ito ng mga Nabateo, at ang kanilang lungsod ng Hegra ay umusbong sa hilaga."
    - "Ang al-Ula ay gobernadurya ng Saudi Arabia ngayon. Naging unang pook ng UNESCO ng kaharian ang Hegra noong 2008, binuksan ng Royal Commission for AlUla, na itinatag noong 2017, ang Dadan sa mga bisita, at hinuhukay ng mga pangkat na Pranses at Saudi ang santuwaryo at ang bayan."
