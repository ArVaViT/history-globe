# Overview article (ADR 0007). Mainstream facts only; the identification with al-Khuraybah at al-Ula is the accepted one; the dates of the Dedanite and Lihyanite kingdoms are given as approximate.
id: dedan
place: a3a2a75
title:
  en: "Dedan"
  ru: "Дедан"
  uk: "Дедан"
  es: "Dedán"
  pt: "Dedã"
  de: "Dedan"
  fr: "Dedan"
body:
  en:
    - "Dedan is the oasis of al-Ula in the Hejaz of north-western Arabia, about 125 km south-west of Tayma and 20 km south of Hegra; the ancient town is the ruin field of al-Khuraybah at the north end of the oasis, where the incense road from Yemen to Syria and Egypt passed between red sandstone cliffs. The Bible's genealogies tie Dedan to both ends of that road: in the table of nations Dedan and Sheba are sons of Raamah, son of Cush, and in the list of Abraham's sons by Keturah they are sons of Jokshan. Jeremiah's cup of wrath is passed to “Dedan, and Tema, and Buz”, the oases of the north."
    - "Isaiah tells “ye travelling companies of Dedanim” to lodge in the thickets of Arabia, caravans driven from the road by war. In Ezekiel's lament over Tyre, “The men of Dedan were thy merchants”, bringing ivory and ebony, and “Dedan was thy merchant in precious clothes for chariots”; with Sheba and the merchants of Tarshish, Dedan asks Gog, “Art thou come to take a spoil?”. Dedan lay at the southern end of Edom's trade: the oracle on Edom runs “from Teman; and they of Dedan shall fall by the sword”, and Jeremiah warns, “dwell deep, O inhabitants of Dedan”."
    - "Nabonidus of Babylon, who lived ten years at Tayma from about 553 BC, lists Dadanu among the oasis towns he marched to. A kingdom of Dedan, and after it the kingdom of Lihyan, ruled the oasis from about the sixth to the first century BC, leaving the Dadanitic inscriptions and the colossal sandstone statues of the sanctuary at al-Khuraybah; traders from the Minaean kingdom of Yemen kept a colony there, and tombs with lions carved over their doors look down on the ruins. By the first century BC the Nabataeans had taken over, and their city of Hegra rose to the north."
    - "Today al-Ula is a governorate of Saudi Arabia. Hegra became the kingdom's first UNESCO site in 2008, the Royal Commission for AlUla, founded in 2017, has opened Dadan to visitors, and French and Saudi teams are excavating the sanctuary and the town."
  ru:
    - "Дедан — оазис Эль-Ула в Хиджазе на северо-западе Аравии, примерно в 125 км к юго-западу от Теймы и в 20 км к югу от Хегры; древний город — руины Эль-Хурайбы на северном краю оазиса, где дорога благовоний из Йемена в Сирию и Египет проходила между скалами красного песчаника. Библейские родословия связывают Дедан с обоими концами этой дороги: в таблице народов Дедан и Шева — сыны Раамы, сына Хуша, а в списке сыновей Авраама от Хеттуры — сыны Иокшана. Чаша гнева Иеремии передаётся «Дедана, и Фему, и Буза» — оазисам севера."
    - "Исаия велит: «ночуйте, караваны Деданские!» — в лесу Аравийском, караванам, согнанным с дороги войной. В плаче Иезекииля о Тире «Сыны Дедана торговали с тобою», доставляя слоновую кость и чёрное дерево, и «Дедан торговал с тобою драгоценными попонами для верховой езды»; вместе с Савой и купцами Фарсисскими Дедан спрашивает Гога: «ты пришел, чтобы произвести грабеж?». Дедан лежал на южном конце торговли Едома: пророчество о Едоме гласит «от Фемана до Дедана все падут от меча», а Иеремия предупреждает: «скрывайтесь в пещерах, жители Дедана»."
    - "Набонид Вавилонский, живший десять лет в Тейме примерно с 553 г. до н. э., называет Дадану среди оазисных городов, к которым ходил походом. Царство Дедан, а за ним царство Лихьян правили оазисом примерно с VI по I век до н. э., оставив даданские надписи и колоссальные песчаниковые статуи святилища в Эль-Хурайбе; торговцы минейского царства из Йемена держали там колонию, а гробницы со львами, высеченными над входом, смотрят на развалины. К I веку до н. э. оазис перешёл к Набатеям, и к северу поднялся их город Хегра."
    - "Сегодня Эль-Ула — округ Саудовской Аравии. Хегра в 2008 году стала первым в королевстве объектом ЮНЕСКО, Королевская комиссия по Эль-Уле, созданная в 2017 году, открыла Дадан для посетителей, а французские и саудовские экспедиции раскапывают святилище и город."
  uk:
    - "Дедан — оазис аль-Ула в Хіджазі північно-західної Аравії, приблизно за 125 км на південний захід від Тайми та за 20 км на південь від Хегри; давнє місто — це поле руїн аль-Хурайба на північному краю оазису, де кадильна дорога з Ємену до Сирії та Єгипту проходила між скелями з червоного пісковика. Біблійні родоводи прив'язують Дедан до обох кінців цієї дороги: у таблиці народів Дедан і Шева — сини Раами, сина Куша, а в списку синів Авраама від Хетури вони сини Йокшана. Чаша гніву в Єремії передається «Деданї, Темі й Бузї», оазисам півночі."
    - "Ісая каже «подорожні Деданські» ночувати в лісі Аравії — каравани, прогнані з дороги війною. У плачі Єзекіїля над Тиром «Деданїї торгували з тобою», приносячи слонову кістку та чорне дерево, і «Дедан торгував із тобою сїдельними коверцями до їзди верхової»; із Шевою та купцями Тарсису Дедан питає Гога: «Чи се ж прийшов єси, щоб рабувати». Дедан лежав на південному кінці едомської торгівлі: оракул про Едом каже «Від Теману до Дедану поляжуть вони од меча», а Єремія застерігає: «ховайтесь глибоко в печерах, осадники Деданські»."
    - "Набонід Вавилонський, який прожив десять років у Таймі від близько 553 р. до н. е., перелічує Дадану серед оазисних міст, до яких він ходив. Царство Дедан, а після нього царство Ліх'ян правили оазисом приблизно з VI до I ст. до н. е., залишивши даданітські написи й колосальні пісковикові статуї святилища в аль-Хурайбі; купці з Мінейського царства Ємену мали там колонію, а гробниці з левами, вирізьбленими над дверима, дивляться на руїни. До I ст. до н. е. набатеї перейняли цей край, і їхнє місто Хегра постало на півночі."
    - "Сьогодні аль-Ула — провінція Саудівської Аравії. Хегра стала першим об'єктом ЮНЕСКО в королівстві у 2008 р., Королівська комісія з АльУла, заснована в 2017 р., відкрила Дадан для відвідувачів, а французькі й саудівські групи розкопують святилище й місто."
  es:
    - "Dedán es el oasis de al-Ula, en el Hiyaz del noroeste de Arabia, a unos 125 km al sudoeste de Tayma y a 20 km al sur de Hegra; la ciudad antigua es el campo de ruinas de al-Khuraybah, en el extremo norte del oasis, por donde la ruta del incienso de Yemen a Siria y Egipto pasaba entre acantilados de arenisca roja. Las genealogías de la Biblia vinculan Dedán con ambos extremos de esa ruta: en la tabla de las naciones, Dedán y Seba son hijos de Raama, hijo de Cus, y en la lista de los hijos de Abraham con Cetura son hijos de Jocsán. La copa de la ira de Jeremías se pasa a «Dedán, y Tema, y Buz», los oasis del norte."
    - "Isaías dice a los «caminantes de Dedanim» que pasen la noche en el monte de Arabia, caravanas expulsadas del camino por la guerra. En el lamento de Ezequiel por Tiro, «Los hijos de Dedán eran tus negociantes», que traían marfil y ébano, y «Dedán fué tu mercadera con paños preciosos para carros»; con Seba y los mercaderes de Tarsis, Dedán pregunta a Gog: «¿Has venido á arrebatar despojos?». Dedán se hallaba en el extremo sur del comercio de Edom: el oráculo sobre Edom dice «desde Temán y Dedán caerán á cuchillo», y Jeremías advierte: «escondeos en simas para estar, oh moradores de Dedán»."
    - "Nabónido de Babilonia, que vivió diez años en Tayma desde alrededor del 553 a. C., enumera Dadanu entre los oasis a los que marchó. Un reino de Dedán, y después de él el reino de Lihyán, gobernó el oasis desde el siglo VI hasta el I a. C. aproximadamente, y dejó las inscripciones dadaníticas y las estatuas colosales de arenisca del santuario de al-Khuraybah; comerciantes del reino minaico de Yemen mantuvieron allí una colonia, y tumbas con leones tallados sobre sus puertas miran desde lo alto las ruinas. En el siglo I a. C. los nabateos se habían hecho con el control, y su ciudad de Hegra se alzó al norte."
    - "Hoy al-Ula es una gobernación de Arabia Saudí. Hegra se convirtió en 2008 en el primer sitio de la UNESCO del reino, la Comisión Real para AlUla, fundada en 2017, ha abierto Dadán a los visitantes, y equipos franceses y saudíes excavan el santuario y la ciudad."
  pt:
    - "Dedã é o oásis de al-Ula, no Hejaz, no noroeste da Arábia, cerca de 125 km a sudoeste de Tayma e 20 km ao sul de Hégra; a cidade antiga é o campo de ruínas de al-Khuraybah, no extremo norte do oásis, por onde a rota do incenso do Iêmen para a Síria e o Egito passava entre penhascos de arenito vermelho. As genealogias da Bíblia ligam Dedã às duas pontas dessa rota: na tábua das nações, Dedã e Sabá são filhos de Raamá, filho de Cuxe, e na lista dos filhos de Abraão com Quetura eles são filhos de Jocsã. O cálice de ira de Jeremias é passado a “Dedã, Tema, Buz”, os oásis do norte."
    - "Isaías diz às “caravanas de dedanitas” que pernoitem nos matagais da Arábia, caravanas expulsas da estrada pela guerra. No lamento de Ezequiel sobre Tiro, “Os homens de Dedã negociavam com você”, trazendo marfim e ébano, e “Dedã era a sua mercadora de mantas preciosas de sela para montaria”; com Sabá e os mercadores de Társis, Dedã pergunta a Gogue: “Você veio para tomar o despojo?” Dedã ficava no extremo sul do comércio de Edom: o oráculo sobre Edom diz “a partir de Temã. Eles cairão à espada até Dedã”, e Jeremias adverte: “Refugiem-se nas profundezas, habitantes de Dedã”."
    - "Nabonido da Babilônia, que viveu dez anos em Tayma a partir de cerca de 553 a.C., lista Dadanu entre as cidades-oásis a que marchou. Um reino de Dedã, e depois dele o reino de Lihyan, governou o oásis do século VI ao I a.C., deixando as inscrições dadaníticas e as estátuas colossais de arenito do santuário de al-Khuraybah; comerciantes do reino minaico do Iêmen mantinham ali uma colônia, e túmulos com leões esculpidos sobre as portas olham do alto as ruínas. No século I a.C., os nabateus haviam assumido o controle, e sua cidade de Hégra surgiu ao norte."
    - "Hoje al-Ula é uma província da Arábia Saudita. Hégra tornou-se em 2008 o primeiro sítio da UNESCO do reino, a Comissão Real para AlUla, fundada em 2017, abriu Dadan aos visitantes, e equipes francesas e sauditas escavam o santuário e a cidade."
  de:
    - "Dedan ist die Oase al-Ula im Hidschas im Nordwesten Arabiens, etwa 125 km südwestlich von Tayma und 20 km südlich von Hegra; die antike Stadt ist das Ruinenfeld von al-Khuraybah am Nordende der Oase, wo die Weihrauchstraße vom Jemen nach Syrien und Ägypten zwischen roten Sandsteinfelsen hindurchführte. Die Genealogien der Bibel verbinden Dedan mit beiden Enden dieser Straße: In der Völkertafel sind Dedan und Scheba Söhne Ragmas, des Sohnes Kuschs, und in der Liste der Söhne Abrahams von Ketura sind sie Söhne Jokschans. Jeremias Becher des Zorns wird weitergereicht an „denen von Dedan, denen von Thema, denen von Bus“, die Oasen des Nordens."
    - "Jesaja kündigt an: „ihr werdet im Walde in Arabien herbergen, ihr Reisezüge der Dedaniter“, Karawanen, die der Krieg von der Straße vertrieb. In Hesekiels Klage über Tyrus: „Die von Dedan sind deine Händler gewesen“, die Elfenbein und Ebenholz brachten, und „Dedan hat mit dir gehandelt mit Decken zum Reiten“; zusammen mit Scheba und den Kaufleuten von Tarsis sagt Dedan zu Gog: „Ich meine ja, du seist recht gekommen, zu rauben“. Dedan lag am Südende von Edoms Handel: Das Orakel über Edom lautet „von Theman bis gen Dedan und durchs Schwert fällen“, und Jeremia warnt: „verkriecht euch tief, ihr Bürger zu Dedan!“"
    - "Nabonid von Babylon, der ab etwa 553 v. Chr. zehn Jahre in Tayma lebte, führt Dadanu unter den Oasenstädten auf, zu denen er zog. Ein Königreich Dedan und danach das Königreich Lihyan herrschten etwa vom 6. bis zum 1. Jahrhundert v. Chr. über die Oase und hinterließen die dadanitischen Inschriften und die kolossalen Sandsteinstatuen des Heiligtums in al-Khuraybah; Händler des minäischen Königreichs im Jemen unterhielten dort eine Kolonie, und Gräber mit über den Türen eingemeißelten Löwen blicken auf die Ruinen herab. Im 1. Jahrhundert v. Chr. hatten die Nabatäer übernommen, und ihre Stadt Hegra erhob sich im Norden."
    - "Heute ist al-Ula ein Gouvernement Saudi-Arabiens. Hegra wurde 2008 die erste UNESCO-Stätte des Königreichs, die 2017 gegründete Royal Commission for AlUla hat Dadan für Besucher geöffnet, und französische und saudische Teams graben das Heiligtum und die Stadt aus."
  fr:
    - "Dedan est l’oasis d’al-Ula dans le Hedjaz, au nord-ouest de l’Arabie, à environ 125 km au sud-ouest de Tayma et à 20 km au sud de Hégra ; la ville antique est le champ de ruines d’al-Khuraybah, à l’extrémité nord de l’oasis, où la route de l’encens du Yémen vers la Syrie et l’Égypte passait entre des falaises de grès rouge. Les généalogies de la Bible rattachent Dedan aux deux extrémités de cette route : dans la table des peuples, Dedan et Schéba sont fils de Raema, fils de Cusch, et dans la liste des fils d’Abraham et de Ketura ils sont fils de Jokschan. La coupe de colère de Jérémie est passée à « Dedan, à Théma, à Buz », oasis du nord."
    - "Ésaïe dit aux « caravanes de Dedan » de passer la nuit dans les broussailles de l’Arabie, caravanes chassées de la route par la guerre. Dans la lamentation d’Ézéchiel sur Tyr, « les enfants de Dedan trafiquaient avec toi », apportant ivoire et ébène, et « Dedan trafiquait avec toi en couvertures pour s’asseoir à cheval » ; avec Schéba et les marchands de Tarsis, Dedan demande à Gog : « Viens-tu pour faire du butin ? » Dedan se trouvait à l’extrémité sud du commerce d’Édom : l’oracle sur Édom va « de Théman à Dedan ; ils tomberont par l’épée », et Jérémie avertit : « retirez-vous dans les cavernes, habitants de Dedan »."
    - "Nabonide de Babylone, qui vécut dix ans à Tayma à partir de 553 av. J.-C. environ, énumère Dadanu parmi les villes d’oasis où il marcha. Un royaume de Dedan, puis le royaume de Lihyân, gouverna l’oasis du VIe au Ier siècle av. J.-C. environ, laissant les inscriptions dadanitiques et les statues colossales de grès du sanctuaire d’al-Khuraybah ; des marchands du royaume minéen du Yémen y entretenaient une colonie, et des tombes aux lions sculptés au-dessus de leurs portes dominent les ruines. Au Ier siècle av. J.-C., les Nabatéens avaient pris le relais, et leur ville de Hégra s’éleva plus au nord."
    - "Aujourd’hui, al-Ula est un gouvernorat d’Arabie saoudite. Hégra est devenue en 2008 le premier site de l’UNESCO du royaume, la Commission royale pour AlUla, fondée en 2017, a ouvert Dadan aux visiteurs, et des équipes françaises et saoudiennes fouillent le sanctuaire et la ville."
