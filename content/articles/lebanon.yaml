body:
  en:
    - 'Lebanon is the mountain range that runs some 160 km along the coast north of Israel, from the Litani to the Eleutherus (Nahr el-Kebir), rising to 3,088 m at Qurnat as-Sawda; the name, from a Semitic root meaning "white", refers to its snows. Behind it lies the Bekaa, "the valley of Lebanon" of Joshua, and beyond that the Anti-Lebanon with Mount Hermon, which "the Sidonians call Sirion; and the Amorites call it Shenir". In the Bible Lebanon marks the northern limit of the land promised to Israel, "From the wilderness and this Lebanon even unto the great river", though the Israelites never held it; the Sidonians and the Hivites that dwelt in mount Lebanon were among the peoples left to prove Israel.'
    - "Lebanon was the timber land of the ancient Near East. Egypt was importing cedar through Byblos by the Old Kingdom, and the Palermo Stone records forty ships of cedar under Sneferu; the tale of Wenamun, about 1075 BC, tells of an Egyptian sent to Byblos for timber for the barque of Amun. Assyrian and Babylonian kings cut cedar for their palaces and left inscriptions at the Nahr el-Kalb and at Wadi Brisa, and Hadrian had the imperial forest marked by boundary inscriptions that still stand on the mountain."
    - 'Solomon asked Hiram of Tyre to "hew me cedar trees out of Lebanon", since "there is not among us any that can skill to hew timber like unto the Sidonians", and sent a levy of thirty thousand men to the mountain in courses; the timber went down to the sea in floats. The temple and "the house of the forest of Lebanon" were built of it, and after the exile cedar came again from Lebanon to Joppa by the grant of Cyrus. The prophets and poets return to Lebanon constantly: the voice of the LORD "breaketh the cedars of Lebanon", the righteous "shall grow like a cedar in Lebanon", Assyria "was a cedar in Lebanon", the glory of Lebanon shall come to Zion, and the bride is called "from Lebanon".'
    - "The cedars were cut for millennia, and only groves remain, the most famous at Bsharri in the Qadisha valley, inscribed by UNESCO in 1998. The Republic of Lebanon, independent since 1943, bears a cedar on its flag; its capital is Beirut, and Byblos, Sidon and Tyre still stand on its coast."
  ru:
    - "Ливан — горный хребет, тянущийся около 160 км вдоль побережья к северу от Израиля, от Литани до Элевтера (Нахр-эль-Кебира), и поднимающийся до 3088 м у Курнат-эс-Сауды; имя, от семитского корня со значением «белый», говорит о его снегах. За ним лежит Бекаа — «в долине Ливанской», как говорит книга Иисуса Навина, — а дальше — Антиливан с горой Ермон, о которой сказано: «Сидоняне Ермон называют Сирионом, а Аморреи называют его Сениром». В Библии Ливан — северный предел земли, обещанной Израилю, «от пустыни и Ливана сего до реки великой», хотя Израильтяне никогда им не владели; Сидоняне и Евеи, жившие на горе Ливане, были среди народов, оставленных для испытания Израиля."
    - "Ливан был лесным краем древнего Ближнего Востока. Египет ввозил кедр через Библ уже при Древнем царстве, и Палермский камень сообщает о сорока кораблях с кедром при Снофру; повесть об Унамуне, около 1075 г. до н. э., рассказывает о египтянине, посланном в Библ за лесом для ладьи Амона. Ассирийские и вавилонские цари рубили кедр для своих дворцов и оставили надписи у Нахр-эль-Кальба и в Вади-Бриса, а Адриан велел обозначить императорский лес межевыми надписями, которые до сих пор стоят на горе."
    - "Соломон просил Хирама Тирского: «прикажи нарубить для меня кедров с Ливана», ибо «у нас нет людей, которые умели бы рубить дерева так, как Сидоняне», и посылал на Ливан попеременно тридцать тысяч работников; лес сплавляли к морю плотами. Из него были построены храм и «дом из дерева Ливанского», а после плена кедр снова везли с Ливана в Яфу с дозволения Кира. Пророки и поэты постоянно возвращаются к Ливану: Господь «сокрушает кедры Ливанские», праведник «возвышается подобно кедру на Ливане», Ассур «был кедр на Ливане», слава Ливана придёт к Сиону, а невесту зовут «с Ливана»."
    - "Кедры рубили тысячелетиями, и остались лишь рощи; самая известная — у Бшарри в долине Кадиша, внесённая в список ЮНЕСКО в 1998 году. Ливанская Республика, независимая с 1943 года, несёт кедр на своём флаге; её столица — Бейрут, а на её берегу по-прежнему стоят Библ, Сидон и Тир."
  uk:
    - "Ліван — гірський хребет, що тягнеться приблизно на 160 км уздовж узбережжя на північ від Ізраїлю, від Літані до Елевтера (Нахр-ель-Кебір), сягаючи 3088 м на Курнат-ес-Сауда; назва, від семітського кореня зі значенням «білий», вказує на його сніги. За ним лежить Бекаа, Ливанська долина Ісуса Навина («в Ливанській долинї»), а далі Антиліван з горою Гермон, яку «Зидонїї звуть Гермона Сирйон, Аморії ж звуть його Сенір». У Біблії Ліван позначає північну межу землі, обіцяної Ізраїлеві, «Від степу і Ливану та й до великої ріки, ріки Евфрата», хоча ізраїльтяни ніколи не володіли ним; сидоняни й хіввеї, «що жили на Ливан-горах», були серед народів, залишених, щоб випробувати Ізраїль."
    - "Ліван був краєм деревини давнього Близького Сходу. Єгипет ввозив кедр через Бібл уже за Давнього царства, а Палермський камінь записує сорок кораблів кедра за Снофру; оповідь про Венамона, близько 1075 р. до н. е., розповідає про єгиптянина, посланого до Бібла по деревину для барки Амона. Ассирійські й вавилонські царі рубали кедр для своїх палаців і залишили написи на Нахр-ель-Кальбі та у Ваді-Брісі, а Адріан звелів позначити імператорський ліс межовими написами, що й досі стоять на горі."
    - "Соломон попросив Хірама Тирського, щоб «нарубали менї на Ливанї кедрини», бо «у нас нема людей, що вміли б так дерево рубати, як Сидонїї», і послав на гору повинність у тридцять тисяч чоловіків змінами; деревина йшла до моря плотами. З неї збудовано храм і дім Ливанського лісу, а після полону кедр знову прийшов з Лівану до Яффи за дозволом Кіра. Пророки й поети постійно повертаються до Лівану: голос Господній «трощить кедри Ливанські», праведний «як кедр Ливанський рости ме вгору», Ассур «був, мов кедр на Ливанї», слава Лівану прийде до Сіону, а наречену кличуть «з Ливану»."
    - "Кедри рубали тисячоліттями, і залишилися лише гаї, найвідоміший у Бшаррі в долині Кадіша, внесений ЮНЕСКО до списку 1998 р. Республіка Ліван, незалежна з 1943 р., має кедр на прапорі; її столиця — Бейрут, а Бібл, Сідон і Тір і досі стоять на її узбережжі."
  es:
    - "El Líbano es la cordillera que se extiende unos 160 km a lo largo de la costa al norte de Israel, desde el Litani hasta el Eleutero (Nahr el-Kebir), y se eleva hasta los 3088 m en Qurnat as-Sawda; el nombre, de una raíz semítica que significa «blanco», alude a sus nieves. Tras ella se halla la Bekaa, la «llanura del Líbano» de Josué, y más allá el Antilíbano con el monte Hermón, a quien «los Sidonios llaman á Hermón Sirión; y los Amorrheos, Senir». En la Biblia el Líbano marca el límite septentrional de la tierra prometida a Israel, «Desde el desierto y este Líbano hasta el gran río», aunque los israelitas nunca lo poseyeron; entre los pueblos dejados para probar a Israel estaban «los Sidonios, y los Heveos que habitaban en el monte Líbano»."
    - "El Líbano fue la tierra de la madera del antiguo Próximo Oriente. Egipto importaba cedro por Biblos ya en el Reino Antiguo, y la Piedra de Palermo registra cuarenta naves de cedro bajo Esnofru; el relato de Wenamón, de hacia 1075 a. C., cuenta cómo un egipcio fue enviado a Biblos por madera para la barca de Amón. Los reyes asirios y babilonios cortaron cedro para sus palacios y dejaron inscripciones en el Nahr el-Kalb y en el Wadi Brisa, y Adriano hizo marcar el bosque imperial con inscripciones de deslinde que aún se conservan en la montaña."
    - "Salomón pidió a Hiram de Tiro «que me corten cedros del Líbano», pues «ninguno hay entre nosotros que sepa labrar la madera como los Sidonios», y envió a la montaña una leva de treinta mil hombres por turnos; la madera bajaba al mar en balsas. Con ella se construyeron el templo y «la casa del bosque del Líbano», y después del destierro el cedro volvió a llegar del Líbano a Jope por concesión de Ciro. Los profetas y poetas vuelven constantemente al Líbano: la voz de Jehová «que quebranta los cedros; y quebrantó Jehová los cedros del Líbano», el justo «crecerá como cedro en el Líbano», de Asiria se dice: «era el Asirio cedro en el Líbano», la gloria del Líbano vendrá a Sion, y a la esposa se la llama «del Líbano»."
    - "Los cedros fueron talados durante milenios y solo quedan bosquetes, el más famoso en Bsharri, en el valle de Qadisha, inscrito por la UNESCO en 1998. La República del Líbano, independiente desde 1943, lleva un cedro en su bandera; su capital es Beirut, y Biblos, Sidón y Tiro siguen en pie en su costa."
  pt:
    - "O Líbano é a cadeia de montanhas que se estende por uns 160 km ao longo da costa ao norte de Israel, do Litani ao Eleutero (Nahr el-Kebir), alcançando 3.088 m em Qurnat as-Sawda; o nome, de uma raiz semítica que significa “branco”, refere-se às suas neves. Atrás dele fica a Bekaa, “o vale do Líbano” de Josué, e além dela o Anti-Líbano com o monte Hermom, que “Os sidônios chamam Hermom de Siriom, e os amorreus o chamam de Senir”. Na Bíblia o Líbano marca o limite norte da terra prometida a Israel, “Desde o deserto e este Líbano até o grande rio”, embora os israelitas nunca o tenham possuído; os sidônios e os heveus “que habitavam no monte Líbano” estavam entre os povos deixados para pôr Israel à prova."
    - "O Líbano era a terra da madeira do antigo Oriente Próximo. O Egito importava cedro por Biblos já no Antigo Império, e a Pedra de Palermo registra quarenta navios de cedro sob Snefru; o relato de Wenamun, por volta de 1075 a.C., conta de um egípcio enviado a Biblos para buscar madeira para a barca de Amon. Reis assírios e babilônios cortaram cedro para seus palácios e deixaram inscrições no Nahr el-Kalb e no Wadi Brisa, e Adriano mandou marcar a floresta imperial com inscrições de limites que ainda se erguem na montanha."
    - "Salomão pediu a Hirão de Tiro que “ordene que cortem para mim cedros do Líbano”, pois “não há ninguém entre nós que saiba cortar madeira como os sidônios”, e enviou ao monte uma leva de trinta mil homens em turnos; a madeira descia ao mar em jangadas. Com ela foram construídos o templo e “a Casa do Bosque do Líbano”, e depois do exílio o cedro veio de novo do Líbano a Jope por concessão de Ciro. Profetas e poetas voltam constantemente ao Líbano: a voz do SENHOR “despedaça os cedros do Líbano”, o justo “crescerá como um cedro no Líbano”, a Assíria “era um cedro no Líbano”, a glória do Líbano virá a Sião, e a noiva é chamada “do Líbano”."
    - "Os cedros foram cortados por milênios, e restam apenas bosques, o mais famoso em Bsharri, no vale de Qadisha, inscrito pela UNESCO em 1998. A República do Líbano, independente desde 1943, traz um cedro na bandeira; sua capital é Beirute, e Biblos, Sidom e Tiro ainda se erguem em sua costa."
  de:
    - "Der Libanon ist das Gebirge, das sich etwa 160 km an der Küste nördlich Israels entlangzieht, vom Litani bis zum Eleutheros (Nahr el-Kebir), und bei Qurnat as-Sawda 3088 m erreicht; der Name, von einer semitischen Wurzel für „weiß“, bezieht sich auf seinen Schnee. Dahinter liegt die Bekaa, bei Josua „die Ebene beim Berge Libanon“, und jenseits davon der Antilibanon mit dem Hermon, „welchen die Sidoniter Sirjon heißen, aber die Amoriter heißen ihn Senir“. In der Bibel bezeichnet der Libanon die Nordgrenze des Israel verheißenen Landes, „Von der Wüste an und diesem Libanon bis an das große Wasser Euphrat“, obwohl die Israeliten ihn nie besaßen; unter den Völkern, die übrig blieben, um Israel zu prüfen, waren „Sidonier und Heviter, die am Berg Libanon wohnten“."
    - "Der Libanon war das Holzland des Alten Orients. Ägypten führte schon im Alten Reich Zedern über Byblos ein, und der Stein von Palermo verzeichnet unter Snofru vierzig Zedernschiffe; die Erzählung des Wenamun, um 1075 v. Chr., berichtet von einem Ägypter, der nach Byblos geschickt wurde, um Holz für die Barke des Amun zu holen. Assyrische und babylonische Könige schlugen Zedern für ihre Paläste und hinterließen Inschriften am Nahr el-Kalb und im Wadi Brisa, und Hadrian ließ den kaiserlichen Wald durch Grenzinschriften kennzeichnen, die noch auf dem Gebirge stehen."
    - "Salomo bat Hiram von Tyrus, „daß man mir Zedern aus dem Libanon haue“, da „bei uns niemand ist, der Holz zu hauen wisse wie die Sidonier“, und sandte dreißigtausend Fronarbeiter in Schichten auf das Gebirge; das Holz ging auf Flößen zum Meer hinab. Der Tempel und „das Haus vom Wald Libanon“ wurden daraus gebaut, und nach dem Exil kam durch Gewährung des Kyrus wieder Zedernholz vom Libanon nach Joppe. Propheten und Dichter kehren stets zum Libanon zurück: „der HERR zerbricht die Zedern im Libanon“, der Gerechte „wird wachsen wie eine Zeder auf dem Libanon“, „Assur war wie ein Zedernbaum auf dem Libanon“, „Die Herrlichkeit des Libanon soll an dich kommen“, nach Zion, und die Braut wird gerufen: „Komm mit mir, meine Braut, vom Libanon“."
    - "Die Zedern wurden jahrtausendelang gefällt, und nur Haine blieben, der berühmteste bei Bscharri im Kadischa-Tal, 1998 von der UNESCO eingetragen. Die seit 1943 unabhängige Republik Libanon trägt eine Zeder in der Flagge; ihre Hauptstadt ist Beirut, und Byblos, Sidon und Tyrus stehen noch an ihrer Küste."
  fr:
    - "Le Liban est la chaîne de montagnes qui s’étend sur quelque 160 km le long de la côte au nord d’Israël, du Litani à l’Éleuthère (Nahr el-Kébir), et culmine à 3 088 m à la Qurnat as-Sawda ; son nom, issu d’une racine sémitique signifiant « blanc », renvoie à ses neiges. Derrière lui s’étend la Bekaa, « la vallée du Liban » de Josué, et au-delà l’Anti-Liban avec le mont Hermon : « les Sidoniens donnent à l’Hermon le nom de Sirion, et les Amoréens celui de Senir ». Dans la Bible, le Liban marque la limite nord du pays promis à Israël, « depuis le désert et le Liban jusqu’au grand fleuve », bien que les Israélites ne l’aient jamais tenu ; « les Sidoniens, et les Héviens qui habitaient la montagne du Liban » comptaient parmi les peuples laissés pour éprouver Israël."
    - "Le Liban était le pays du bois du Proche-Orient ancien. L’Égypte importait du cèdre par Byblos dès l’Ancien Empire, et la pierre de Palerme enregistre quarante navires de cèdre sous Snéfrou ; le récit d’Ounamon, vers 1075 av. J.-C., raconte qu’un Égyptien fut envoyé à Byblos chercher du bois pour la barque d’Amon. Les rois assyriens et babyloniens coupèrent du cèdre pour leurs palais et laissèrent des inscriptions au Nahr el-Kalb et à l’Ouadi Brissa, et Hadrien fit marquer la forêt impériale par des inscriptions de bornage qui se dressent encore sur la montagne."
    - "Salomon demanda à Hiram de Tyr d’ordonner « que l’on coupe pour moi des cèdres du Liban », car « il n’y a personne parmi nous qui s’entende à couper les bois comme les Sidoniens », et envoya à la montagne une corvée de trente mille hommes par roulement ; le bois descendait à la mer en radeaux. Le temple et « la maison de la forêt du Liban » en furent construits, et après l’exil le cèdre revint du Liban à Joppé par l’autorisation de Cyrus. Les prophètes et les poètes reviennent sans cesse au Liban : la voix de l’Éternel « brise les cèdres du Liban », les justes « s’élèvent comme le cèdre du Liban », l’Assyrie « était un cèdre du Liban », la gloire du Liban viendra à Sion, et la fiancée est appelée « du Liban »."
    - "Les cèdres furent coupés pendant des millénaires et il n’en reste que des bosquets, dont le plus célèbre se trouve à Bécharré, dans la vallée de la Qadisha, inscrite par l’UNESCO en 1998. La République libanaise, indépendante depuis 1943, porte un cèdre sur son drapeau ; sa capitale est Beyrouth, et Byblos, Sidon et Tyr se dressent encore sur sa côte."
  it:
    - "Il Libano è la catena montuosa che corre per circa 160 km lungo la costa a nord d’Israele, dal Litani all’Eleutero (Nahr el-Kebir), e raggiunge i 3088 m a Qurnat as-Sawda; il nome, da una radice semitica che significa «bianco», si riferisce alle sue nevi. Dietro di essa si stende la Beqa‘, «la valle del Libano» di Giosuè, e oltre l’Antilibano con il Monte Ermon, che «i Sidonii chiamano Sirion, e gli Amorei Senir». Nella Bibbia il Libano segna il limite settentrionale della terra promessa a Israele, «dal deserto, e dal Libano che vedi là, sino al gran fiume», benché gli Israeliti non l’abbiano mai tenuto; i Sidoni e gli Evei che abitavano la montagna del Libano furono tra i popoli lasciati per mettere alla prova Israele."
    - "Il Libano era la terra del legname del Vicino Oriente antico. L’Egitto importava cedro attraverso Biblo già nell’Antico Regno, e la Pietra di Palermo registra quaranta navi di cedro sotto Snefru; il racconto di Wenamon, verso il 1075 a.C., narra di un egiziano mandato a Biblo per il legname della barca di Amon. I re assiri e babilonesi tagliarono cedro per i loro palazzi e lasciarono iscrizioni al Nahr el-Kalb e a Wadi Brisa, e Adriano fece segnare la foresta imperiale con iscrizioni di confine che ancora si trovano sulla montagna."
    - "Salomone chiese a Chiram di Tiro: «dà ordine che mi si taglino dei cedri del Libano», poiché «non v’è alcuno fra noi che sappia tagliare il legname, come quei di Sidone», e mandò sulla montagna una comandata di trentamila uomini a turno; il legname scendeva al mare su zattere. Il tempio e «la casa della “Foresta del Libano”» furono costruiti con esso, e dopo l’esilio il cedro giunse di nuovo dal Libano a Giaffa per concessione di Ciro. I profeti e i poeti tornano di continuo al Libano: la voce dell’Eterno «rompe i cedri; l’Eterno spezza i cedri del Libano», il giusto «crescerà come il cedro sul Libano», l’Assiria «era un cedro del Libano», la gloria del Libano verrà a Sion, e la sposa è chiamata «dal Libano»."
    - "I cedri furono tagliati per millenni e ne restano solo boschetti, il più famoso a Bsharri nella valle di Qadisha, iscritta dall’UNESCO nel 1998. La Repubblica del Libano, indipendente dal 1943, porta un cedro sulla bandiera; la sua capitale è Beirut, e Biblo, Sidone e Tiro sorgono ancora sulla sua costa."
  pl:
    - "Liban to pasmo górskie ciągnące się około 160 km wzdłuż wybrzeża na północ od Izraela, od Litani do Eleuterosu (Nahr el-Kebir), wznoszące się do 3088 m w Qurnat as-Sawda; nazwa, od semickiego rdzenia oznaczającego „biały”, odnosi się do jego śniegów. Za nim leży Bika, o której Jozue mówi: „w równinie Libańskiej pod górą Hermon”, a dalej Antyliban z górą Hermon: „Sydończycy zowią Hermon Szyryjon, a Amorejczycy zowią go Sanir”. W Biblii Liban wyznacza północną granicę ziemi obiecanej Izraelowi: „Od puszczy i od Libanu tego, i aż do rzeki wielkiej”, choć Izraelici nigdy go nie posiedli; Sydończycy i Hewejczycy mieszkający na górze Liban należeli do ludów pozostawionych, by wypróbować Izraela."
    - "Liban był krajem drewna starożytnego Bliskiego Wschodu. Egipt sprowadzał cedr przez Byblos już w Starym Państwie, a Kamień z Palermo notuje czterdzieści statków cedrowych za Snofru; opowieść o Wenamunie, z około 1075 r. p.n.e., mówi o Egipcjaninie posłanym do Byblos po drewno na barkę Amona. Królowie asyryjscy i babilońscy ścinali cedr na swoje pałace i zostawili inskrypcje nad Nahr el-Kalb i w Wadi Brisa, a Hadrian kazał oznaczyć cesarski las napisami granicznymi, które wciąż stoją na górze."
    - "Salomon prosił Hirama z Tyru: „rozkaż, aby mi narąbano ceder na Libanie”, ponieważ „niemasz między nami męża, któryby umiał tak rąbać drzewo, jako Sydończycy”, i wysłał na górę pobór trzydziestu tysięcy mężów na zmiany; drewno spływało do morza na tratwach. Zbudowano z niego świątynię i „dom lasu Libanowego”, a po niewoli cedr znów płynął z Libanu do Jafy na mocy zezwolenia Cyrusa. Prorocy i poeci wracają do Libanu bezustannie: „Głos Pański cedry łamie; kruszy Pan cedry Libańskie”, „Sprawiedliwy jako palma zakwitnie, jako cedra na Libanie rozmnoży się”, „Assur był jako cedr na Libanie”, chwała Libanu przyjdzie do Syjonu, a oblubienica jest wołana „z Libanu”."
    - "Cedry ścinano przez tysiąclecia i zostały tylko gaje, najsłynniejszy w Bsharri w dolinie Kadisza, wpisany przez UNESCO w 1998 r. Republika Libańska, niepodległa od 1943 r., ma cedr na fladze; jej stolicą jest Bejrut, a Byblos, Sydon i Tyr wciąż stoją na jej wybrzeżu."
  nl:
    - "De Libanon is de bergketen die zo'n 160 km langs de kust ten noorden van Israël loopt, van de Litani tot de Eleutherus (Nahr el-Kebir), en tot 3.088 m stijgt bij Qurnat as-Sawda; de naam, van een Semitische wortel die “wit” betekent, verwijst naar zijn sneeuw. Erachter ligt de Bekaa, “het dal van den Libanon” van Jozua, en daarachter de Antilibanon met de berg Hermon, waarvan het heet: “De Zidoniers noemen Hermon Sirjon; maar de Amorieten noemen hem Senir”. In de Bijbel markeert de Libanon de noordgrens van het aan Israël beloofde land, “Van de woestijn en dezen Libanon af tot aan de grote rivier”, hoewel de Israëlieten hem nooit bezaten; de Sidoniërs en de Hevieten die in het gebergte van de Libanon woonden, behoorden tot de volken die werden overgelaten om Israël op de proef te stellen."
    - "De Libanon was het houtland van het oude Nabije Oosten. Egypte voerde al in het Oude Rijk ceder in via Byblos, en de Steen van Palermo vermeldt veertig schepen vol ceder onder Snofroe; het verhaal van Wenamon, omstreeks 1075 v.Chr., vertelt van een Egyptenaar die naar Byblos werd gestuurd om hout voor de bark van Amon. Assyrische en Babylonische koningen kapten ceder voor hun paleizen en lieten inscripties achter bij de Nahr el-Kalb en in de Wadi Brisa, en Hadrianus liet het keizerlijke woud afbakenen met grensinscripties die nog op het gebergte staan."
    - "Salomo vroeg Hiram van Tyrus: “Zo gebied nu, dat men mij cederen uit den Libanon houwe”, want “gij weet, dat onder ons niemand is, die weet hout te houwen, gelijk de Sidoniers”, en hij zond een heffing van dertigduizend man bij toerbeurt naar het gebergte; het hout ging op vlotten naar de zee. De tempel en “het huis des wouds van Libanon” werden ervan gebouwd, en na de ballingschap kwam er opnieuw ceder van de Libanon naar Joppe met toestemming van Cyrus. De profeten en dichters keren steeds terug naar de Libanon: de stem van de HEER, “ja, de HEERE verbreekt de cederen van Libanon”, de rechtvaardige: “hij zal wassen als een cederboom op Libanon”, Assyrië “was een ceder op den Libanon”, de heerlijkheid van de Libanon zal naar Sion komen, en de bruid wordt geroepen “van den Libanon af”."
    - "De cederen werden millennia lang gekapt, en alleen bosjes blijven over, de beroemdste bij Bsharri in de Qadisha-vallei, in 1998 door UNESCO op de werelderfgoedlijst geplaatst. De Republiek Libanon, onafhankelijk sinds 1943, voert een ceder in haar vlag; haar hoofdstad is Beiroet, en Byblos, Sidon en Tyrus staan nog aan haar kust."
  cs:
    - "Libanon je pohoří, které se táhne asi 160 km podél pobřeží severně od Izraele, od Litani k Eleutheru (Nahr el-Kebir) a vystupuje do 3088 m v Qurnat as-Sawda; jméno, od semitského kořene s významem „bílý“, odkazuje na jeho sníh. Za ním leží Bekáa, „rovina Libánská“ z Knihy Jozue, a za ní Antilibanon s horou Hermon: „Sidonští říkají Hermonu Sarion, a Amorejští říkají jemu Sanir“. V Bibli Libanon označuje severní hranici země slíbené Izraeli, „Od pouště a Libánu toho až k řece veliké“, ač ji Izraelité nikdy neovládli; „Sidonští a Hevejští bydlící na hoře Libánské“ byli mezi národy, které zůstaly, aby Izraele zkoušely."
    - "Libanon byl zemí dřeva starověkého Předního východu. Egypt dovážel cedr přes Byblos už za Staré říše a Palermský kámen zaznamenává čtyřicet lodí cedru za Snofrua; příběh Wenamunův, asi z roku 1075 př. n. l., vypráví o Egypťanu poslaném do Býblu pro dřevo na bárku Amonovu. Asyrští a babylonští králové káceli cedr pro své paláce a zanechali nápisy u Nahr el-Kalb a ve Wádí Brisa a Hadrianus dal císařský les vyznačit hraničními nápisy, které dosud stojí na hoře."
    - "Šalomoun vzkázal Chírámovi z Týru: „ať mi nasekají cedrů na Libánu“, neboť „mezi námi není žádného, kdož by uměl sekati dříví, jako jsou Sidonští“, a poslal na horu třicet tisíc mužů po směnách; dříví se k moři dopravovalo na vorech. Chrám a „dům z lesu Libánského“ byly z něj postaveny a po exilu přišel cedr z Libanonu znovu do Joppe z povolení Kýrova. Proroci a básníci se k Libanonu stále vracejí: hlas Hospodinův „láme cedry“, spravedlivý „jako cedr na Libánu rozloží se“, Assur „byl jako cedr na Libánu“, sláva Libánská přijde k Sijónu a nevěsta je volána „z Libánu“."
    - "Cedry se kácely po tisíciletí a zůstaly jen háje, nejslavnější v Bsharri v údolí Qadisha, zapsané UNESCO roku 1998. Libanonská republika, nezávislá od roku 1943, nese cedr ve vlajce; jejím hlavním městem je Bejrút a Býblos, Sidón a Týr dosud stojí na jejím pobřeží."
  sv:
    - "Libanon är bergskedjan som löper omkring 160 km längs kusten norr om Israel, från Litani till Eleutheros (Nahr el-Kebir), och når 3 088 m vid Qurnat as-Sawda; namnet, av en semitisk rot som betyder ”vit”, syftar på dess snö. Bakom den ligger Bekaa, Josuas ”Libanonsdalen”, och bortom den Antilibanon med berget Hermon, som ”av sidonierna kallas för Sirjon, men av amoréerna kallas för Senir”. I Bibeln markerar Libanon gränsen i norr för det land som utlovades Israel, ”Från öknen till Libanon däruppe och ända till den stora floden”, fastän israeliterna aldrig behärskade det; sidonierna och hiveerna som bodde i Libanons bergsbygd var bland de folk som lämnades kvar för att pröva Israel."
    - "Libanon var det forntida Främre Orientens virkesland. Egypten importerade ceder via Byblos redan under Gamla riket, och Palermostenen upptecknar fyrtio skepp med ceder under Snofru; berättelsen om Wenamun, omkring 1075 f.Kr., berättar om en egyptier som sändes till Byblos efter virke till Amuns bark. Assyriska och babyloniska kungar högg ceder till sina palats och lämnade inskrifter vid Nahr el-Kalb och vid Wadi Brisa, och Hadrianus lät märka ut den kejserliga skogen med gränsinskrifter som ännu står på berget."
    - "Salomo sände bud till Hiram av Tyros: ”Så bjud nu att man hugger åt mig cedrar på Libanon”, ty ”bland oss icke finnes någon som är så skicklig att hugga virke som sidonierna”, och sände en utskrivning av trettio tusen man till berget i skift; virket fördes ned till havet på flottar. Templet och ”Libanonskogshuset” byggdes av det, och efter exilen kom åter ceder från Libanon till Joppe genom Kyros' tillstånd. Profeterna och skalderna återvänder ständigt till Libanon: ”HERREN bräcker Libanons cedrar”, den rättfärdige ”såsom en ceder på Libanon växer han till”, Assyrien var ”en ceder på Libanon”, Libanons härlighet skall komma till Sion, och bruden kallas ”från Libanon”."
    - "Cedrarna högg man i årtusenden, och endast lundar återstår, den mest berömda vid Bsharri i Qadishadalen, som skrevs in på Unescos världsarvslista 1998. Republiken Libanon, självständig sedan 1943, har en ceder i sin flagga; huvudstad är Beirut, och Byblos, Sidon och Tyros finns ännu kvar vid kusten."
