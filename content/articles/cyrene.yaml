# Overview article (ADR 0007). Mainstream facts only; the ossuary of Alexander son of Simon is given as a find, not as proof.
id: cyrene
place: a81cdb5
title:
  en: "Cyrene"
  ru: "Киринея"
  uk: "Кирена"
  es: "Cirene"
  pt: "Cirene"
  de: "Kyrene"
  fr: "Cyrène"
  it: "Cirene"
  pl: "Cyrena"
  nl: "Cyrene"
  cs: "Kyréna"
body:
  en:
    - "Cyrene was the chief Greek city of Libya, on a terrace of the green Jebel Akhdar some 600 m above the sea and about 15 km from its port Apollonia. Herodotus tells how settlers from the island of Thera, led by Battus, founded it about 631 BC on the advice of Delphi. Under the Battiad kings and then as a republic it grew rich on grain, horses and silphium, a plant valued as medicine and spice; Pindar sang of its king Arcesilas, and the mathematician Eratosthenes and the philosopher Aristippus were born there. From 322 BC it belonged to the Ptolemies, who settled Jews in it; the last ruler left it to Rome in 96 BC, and it was later joined with Crete in one province. Josephus quotes Strabo that Cyrene had four classes of people, citizens, farmers, foreigners and Jews, and Jason of Cyrene wrote the history abridged in 2 Maccabees."
    - "A Jew of this city carried the cross: the soldiers “found a man of Cyrene, Simon by name: him they compelled to bear his cross”. Mark adds that he was “coming out of the country, the father of Alexander and Rufus”, as if his sons were known to his readers; a Rufus is greeted in the letter to the Romans. In 1941 a tomb, probably of Cyrenaican Jews, in the Kidron valley at Jerusalem yielded an ossuary inscribed “Alexander son of Simon”, though whether it is the same family cannot be proved. Jews from “the parts of Libya about Cyrene” heard the apostles at Pentecost; Cyrenians belonged to the synagogue that disputed with Stephen; “men of Cyprus and Cyrene” were the first to preach to Greeks at Antioch, and “Lucius of Cyrene” was among the prophets and teachers there."
    - "In 115-117 the Jews of Cyrene rose against Rome under a leader called Lukuas or Andreas; Cassius Dio says they massacred Romans and Greeks, and Hadrian had to rebuild the city. An earthquake in 365 ruined it; Synesius, a native of Cyrene and bishop of Ptolemais about 410, saw it in decline, and after the Arab conquest of the 640s it was abandoned. The ruins near Shahhat in eastern Libya, with the sanctuary of Apollo, the temple of Zeus and the great necropolis, were inscribed by UNESCO in 1982 and have been on the List in Danger since 2016."
  ru:
    - "Киринея (Кирена) — главный греческий город Ливии, на террасе зелёного Джебель-Ахдара, примерно в 600 м над морем и в 15 км от своей гавани Аполлонии. Геродот рассказывает, как переселенцы с острова Фера во главе с Баттом основали её около 631 г. до н. э. по совету Дельф. При царях из рода Батта, а затем как республика она богатела хлебом, конями и сильфием, растением, ценившимся как лекарство и приправа; Пиндар воспел её царя Аркесилая, здесь родились математик Эратосфен и философ Аристипп. С 322 г. до н. э. она принадлежала Птолемеям, которые поселили в ней Иудеев; последний правитель завещал её Риму в 96 г. до н. э., и позже её соединили с Критом в одну провинцию. Иосиф Флавий приводит слова Страбона, что в Киринее было четыре разряда жителей: граждане, земледельцы, чужеземцы и Иудеи; а Иасон Киринеянин написал историю, сокращённую во Второй книге Маккавейской."
    - "Иудей из этого города нёс крест: воины «встретили одного Киринеянина, по имени Симона; сего заставили нести крест Его». Марк добавляет, что он шёл с поля и был отцом Александра и Руфа, как будто его сыновья были известны читателям; Руфа приветствует Послание к Римлянам. В 1941 г. в гробнице, вероятно, киринейских Иудеев, в Кедронской долине в Иерусалиме нашли оссуарий с надписью «Александр, сын Симона», хотя доказать, что это та же семья, нельзя. Иудеи из «частей Ливии, прилежащих к Киринее», слышали апостолов в Пятидесятницу; Киринейцы входили в синагогу, спорившую со Стефаном; «Кипряне и Киринейцы» первыми благовествовали Еллинам в Антиохии, а «Луций Киринеянин» был среди тамошних пророков и учителей."
    - "В 115–117 гг. Иудеи Киринеи восстали против Рима под началом вождя по имени Лукуас, или Андрей; Дион Кассий пишет, что они перебили римлян и греков, и Адриану пришлось отстраивать город. Землетрясение 365 г. разрушило его; Синесий, уроженец Киринеи и около 410 г. епископ Птолемаиды, застал её в упадке, а после арабского завоевания 640-х гг. город был покинут. Развалины близ Шаххата на востоке Ливии, со святилищем Аполлона, храмом Зевса и огромным некрополем, внесены в список ЮНЕСКО в 1982 г., а с 2016 г. числятся в списке наследия под угрозой."
  uk:
    - "Кирена була головним грецьким містом Лівії, на терасі зеленого Джебель-Ахдару приблизно за 600 м над морем і за 15 км від її порту Аполлонії. Геродот розповідає, як переселенці з острова Тера під проводом Батта заснували її близько 631 р. до н. е. за порадою Дельфів. Під царями Баттіадами, а потім як республіка вона розбагатіла на зерні, конях і сільфії, рослині, цінованій як ліки та пряність; Піндар оспівував її царя Аркесілая, а математик Ератосфен і філософ Арістіпп народилися там. Від 322 р. до н. е. вона належала Птолемеям, які оселили в ній юдеїв; останній правитель заповів її Риму в 96 р. до н. е., і згодом її з'єднали з Критом в одну провінцію. Йосиф Флавій цитує Страбона, що в Кирені було чотири стани людей — громадяни, землероби, чужинці й юдеї, а Ясон Киринейський написав історію, скорочену у 2 Книзі Макавеїв."
    - "Юдей цього міста ніс хрест: воїни «знайшли чоловіка Киринейського, на ймя Симона; сього заставили нести хрест Його». Марк додає, що він «ідучого з поля, батька Александра та Руфа», ніби його сини були відомі читачам; Руфа вітають у посланні до римлян. У 1941 р. гробниця, імовірно киренських юдеїв, у долині Кедрону в Єрусалимі дала оссуарій із написом «Александр, син Симона», хоча чи це та сама родина, довести не можна. Юдеї «в сторонах Ливийських, що коло Киринеї» чули апостолів на П'ятдесятницю; киринейці належали до синагоги, що сперечалася зі Стефаном; «люде з Кипру і Киринеї» першими проповідували елліністам в Антіохії, а «Лукий Киринейський» був серед тамтешніх пророків і вчителів."
    - "У 115–117 рр. юдеї Кирени повстали проти Риму під проводом на ім'я Лукуа або Андрій; Кассій Діон каже, що вони вирізали римлян і греків, і Адріану довелося відбудовувати місто. Землетрус 365 р. зруйнував його; Синесій, киренець за походженням і єпископ Птолемаїди близько 410 р., бачив його в занепаді, а після арабського завоювання 640-х рр. його покинули. Руїни поблизу Шаххата на сході Лівії зі святилищем Аполлона, храмом Зевса та великим некрополем було внесено ЮНЕСКО до списку у 1982 р. і від 2016 р. вони перебувають у Списку під загрозою."
  es:
    - "Cirene fue la principal ciudad griega de Libia, en una terraza del verde Yebel Ajdar a unos 600 m sobre el mar y a unos 15 km de su puerto, Apolonia. Heródoto cuenta cómo colonos de la isla de Tera, dirigidos por Bato, la fundaron hacia el 631 a. C. por consejo de Delfos. Bajo los reyes Bátidas y luego como república se enriqueció con el grano, los caballos y el silfio, una planta apreciada como medicina y especia; Píndaro cantó a su rey Arcesilao, y allí nacieron el matemático Eratóstenes y el filósofo Aristipo. Desde el 322 a. C. perteneció a los Ptolomeos, que asentaron en ella a judíos; el último gobernante la legó a Roma en el 96 a. C., y más tarde fue unida a Creta en una sola provincia. Josefo cita a Estrabón en el sentido de que Cirene tenía cuatro clases de gentes: ciudadanos, labradores, extranjeros y judíos, y Jasón de Cirene escribió la historia que resume 2 Macabeos."
    - "Un judío de esta ciudad llevó la cruz: los soldados «hallaron á un Cireneo, que se llamaba Simón: á éste cargaron para que llevase su cruz». Marcos añade que era «padre de Alejandro y de Rufo, que venía del campo», como si sus hijos fueran conocidos de sus lectores; un Rufo recibe saludos en la carta a los Romanos. En 1941 una tumba, probablemente de judíos cirenaicos, en el valle del Cedrón, en Jerusalén, dio un osario con la inscripción «Alejandro hijo de Simón», aunque no puede probarse que sea la misma familia. Judíos de «las partes de Africa que está de la otra parte de Cirene» oyeron a los apóstoles en Pentecostés; los cireneos pertenecían a la sinagoga que disputó con Esteban; «varones Ciprios y Cirenenses» fueron los primeros en predicar a los griegos en Antioquía, y «Lucio Cireneo» estaba entre los profetas y maestros de allí."
    - "En 115–117 los judíos de Cirene se alzaron contra Roma bajo un jefe llamado Lukuas o Andreas; Dion Casio dice que masacraron a romanos y griegos, y Adriano tuvo que reconstruir la ciudad. Un terremoto en 365 la arruinó; Sinesio, natural de Cirene y obispo de Tolemaida hacia el 410, la vio en decadencia, y tras la conquista árabe de la década del 640 fue abandonada. Las ruinas cerca de Shahhat, en el este de Libia, con el santuario de Apolo, el templo de Zeus y la gran necrópolis, fueron inscritas por la UNESCO en 1982 y figuran en la Lista del Patrimonio Mundial en Peligro desde 2016."
  pt:
    - "Cirene era a principal cidade grega da Líbia, num terraço do verde Jebel Akhdar, uns 600 m acima do mar e a cerca de 15 km de seu porto, Apolônia. Heródoto conta como colonos da ilha de Tera, liderados por Bato, a fundaram por volta de 631 a.C. por conselho de Delfos. Sob os reis Batíadas e depois como república, enriqueceu com cereais, cavalos e sílfio, planta valorizada como remédio e tempero; Píndaro cantou seu rei Arcesilau, e o matemático Eratóstenes e o filósofo Aristipo nasceram ali. Desde 322 a.C. pertenceu aos Ptolomeus, que nela fixaram judeus; o último governante a legou a Roma em 96 a.C., e depois foi unida a Creta numa só província. Josefo cita Estrabão, segundo quem Cirene tinha quatro classes de gente, cidadãos, lavradores, estrangeiros e judeus, e Jasão de Cirene escreveu a história resumida em 2 Macabeus."
    - "Um judeu desta cidade carregou a cruz: os soldados “encontraram um homem de Cirene, chamado Simão, e o obrigaram a ir com eles, para que carregasse a sua cruz”. Marcos acrescenta: “vindo do campo, Simão de Cirene, pai de Alexandre e de Rufo”, como se seus filhos fossem conhecidos dos leitores; um Rufo é saudado na carta aos Romanos. Em 1941, um túmulo, provavelmente de judeus cirenaicos, no vale do Cedrom, em Jerusalém, rendeu um ossuário inscrito “Alexandre, filho de Simão”, embora não se possa provar que seja a mesma família. Judeus das “partes da Líbia próximas a Cirene” ouviram os apóstolos em Pentecostes; cireneus pertenciam à sinagoga que discutiu com Estêvão; “homens de Chipre e de Cirene” foram os primeiros a pregar aos gregos em Antioquia, e “Lúcio de Cirene” estava entre os profetas e mestres ali."
    - "Em 115-117, os judeus de Cirene se levantaram contra Roma sob um chefe chamado Lukuas ou Andreas; Díon Cássio diz que massacraram romanos e gregos, e Adriano teve de reconstruir a cidade. Um terremoto em 365 a arruinou; Sinésio, natural de Cirene e bispo de Ptolemaida por volta de 410, viu-a em declínio, e depois da conquista árabe da década de 640 ela foi abandonada. As ruínas perto de Shahhat, no leste da Líbia, com o santuário de Apolo, o templo de Zeus e a grande necrópole, foram inscritas pela UNESCO em 1982 e estão na Lista em Perigo desde 2016."
  de:
    - "Kyrene war die wichtigste griechische Stadt Libyens, auf einer Terrasse des grünen Dschebel Achdar etwa 600 m über dem Meer, rund 15 km von ihrem Hafen Apollonia. Herodot erzählt, wie Siedler von der Insel Thera unter Battos es um 631 v. Chr. auf Delphis Rat gründeten. Unter Battiadenkönigen, dann als Republik, wurde es reich durch Getreide, Pferde und Silphion, eine als Arznei und Gewürz geschätzte Pflanze; Pindar besang seinen König Arkesilas, und der Mathematiker Eratosthenes und der Philosoph Aristippos wurden dort geboren. Ab 322 v. Chr. gehörte es den Ptolemäern, die Juden dort ansiedelten; der letzte Herrscher vermachte es 96 v. Chr. Rom, später mit Kreta zu einer Provinz vereinigt. Josephus zitiert Strabon, Kyrene habe vier Klassen gehabt: Bürger, Bauern, Fremde und Juden; Jason von Kyrene schrieb die im 2. Makkabäerbuch zusammengefasste Geschichte."
    - "Ein Jude dieser Stadt trug das Kreuz: Die Soldaten fanden „einen Menschen von Kyrene mit Namen Simon; den zwangen sie, daß er ihm sein Kreuz trug“. Markus fügt hinzu, er sei einer gewesen, „der vom Felde kam (der ein Vater war des Alexander und Rufus)“, als wären seine Söhne den Lesern bekannt; ein Rufus wird im Römerbrief gegrüßt. Im Jahr 1941 ergab ein Grab, wahrscheinlich kyrenäischer Juden, im Kidrontal bei Jerusalem ein Ossuar mit der Inschrift „Alexander, Sohn des Simon“, doch ob es dieselbe Familie ist, lässt sich nicht beweisen. Juden „an den Enden von Lybien bei Kyrene“ hörten die Apostel an Pfingsten; Kyrenäer gehörten zu der Synagoge, die mit Stephanus stritt; „Männer von Zypern und Kyrene“ waren die Ersten, die in Antiochia Griechen predigten, und „Luzius von Kyrene“ gehörte zu den Propheten und Lehrern dort."
    - "In den Jahren 115–117 erhoben sich die Juden von Kyrene unter einem Anführer namens Lukuas oder Andreas gegen Rom; Cassius Dio sagt, sie hätten Römer und Griechen niedergemetzelt, und Hadrian musste die Stadt wiederaufbauen. Ein Erdbeben im Jahr 365 ruinierte sie; Synesios, ein gebürtiger Kyrenäer und um 410 Bischof von Ptolemais, sah sie im Niedergang, und nach der arabischen Eroberung der 640er Jahre wurde sie aufgegeben. Die Ruinen bei Schahhat im Osten Libyens mit dem Apollonheiligtum, dem Zeustempel und der großen Nekropole wurden 1982 von der UNESCO eingetragen und stehen seit 2016 auf der Liste des gefährdeten Welterbes."
  fr:
    - "Cyrène était la principale cité grecque de Libye, sur une terrasse du vert Jebel Akhdar à quelque 600 m au-dessus de la mer et à environ 15 km de son port Apollonie. Hérodote raconte que des colons de l’île de Théra, conduits par Battos, la fondèrent vers 631 av. J.-C. sur le conseil de Delphes. Sous les rois Battiades puis en république, elle s’enrichit de blé, de chevaux et de silphium, plante estimée comme remède et épice ; Pindare chanta son roi Arcésilas, et le mathématicien Ératosthène et le philosophe Aristippe y naquirent. Dès 322 av. J.-C. elle appartint aux Ptolémées, qui y installèrent des Juifs ; le dernier souverain la légua à Rome en 96 av. J.-C., plus tard unie à la Crète en une province. Josèphe cite Strabon : Cyrène avait quatre classes, citoyens, paysans, étrangers et Juifs, et Jason de Cyrène écrivit l’histoire abrégée dans 2 Maccabées."
    - "Un Juif de cette ville porta la croix : les soldats « rencontrèrent un homme de Cyrène, appelé Simon, et ils le forcèrent à porter la croix de Jésus ». Marc ajoute que c’était un passant « qui revenait des champs », « père d’Alexandre et de Rufus », comme si ses fils étaient connus de ses lecteurs ; un Rufus est salué dans la lettre aux Romains. En 1941, une tombe, probablement de Juifs de Cyrénaïque, dans la vallée du Cédron à Jérusalem, livra un ossuaire portant « Alexandre fils de Simon », sans preuve qu’il s’agisse de la même famille. Des Juifs « du territoire de la Libye voisine de Cyrène » entendirent les apôtres à la Pentecôte ; des Cyrénéens appartenaient à la synagogue qui disputa avec Étienne ; « des hommes de Chypre et de Cyrène » furent les premiers à prêcher aux Grecs à Antioche, et « Lucius de Cyrène » comptait parmi les prophètes et docteurs d’Antioche."
    - "En 115-117, les Juifs de Cyrène se soulevèrent contre Rome sous un chef appelé Lukuas ou Andréas ; Dion Cassius dit qu’ils massacrèrent Romains et Grecs, et Hadrien dut reconstruire la ville. Un séisme la ruina en 365 ; Synésios, natif de Cyrène et évêque de Ptolémaïs vers 410, la vit en déclin, et après la conquête arabe des années 640 elle fut abandonnée. Les ruines près de Shahhat, dans l’est de la Libye, avec le sanctuaire d’Apollon, le temple de Zeus et la grande nécropole, furent inscrites par l’UNESCO en 1982 et figurent sur la Liste du patrimoine mondial en péril depuis 2016."
  it:
    - "Cirene era la principale città greca della Libia, su una terrazza del verde Jebel Akhdar a circa 600 m sul mare e a circa 15 km dal suo porto Apollonia. Erodoto racconta come coloni dell’isola di Tera, guidati da Batto, la fondarono intorno al 631 a.C. su consiglio di Delfi. Sotto i re Batiadi e poi come repubblica si arricchì di grano, cavalli e silfio, una pianta apprezzata come medicina e come spezia; Pindaro cantò il suo re Arcesilao, e vi nacquero il matematico Eratostene e il filosofo Aristippo. Dal 322 a.C. appartenne ai Tolomei, che vi stanziarono Ebrei; l’ultimo sovrano la lasciò a Roma nel 96 a.C., e più tardi fu unita a Creta in un’unica provincia. Giuseppe Flavio cita Strabone secondo cui Cirene aveva quattro classi di persone, cittadini, contadini, stranieri ed Ebrei, e Giasone di Cirene scrisse la storia compendiata in 2 Maccabei."
    - "Un Ebreo di questa città portò la croce: i soldati «trovarono un Cireneo chiamato Simone, e lo costrinsero a portar la croce di Gesù». Marco aggiunge che era «il padre di Alessandro e di Rufo, il quale passava di là, tornando dai campi», come se i suoi figli fossero noti ai lettori; un Rufo è salutato nella lettera ai Romani. Nel 1941 una tomba, probabilmente di Ebrei cirenaici, nella valle del Cedron a Gerusalemme ha restituito un ossuario con l’iscrizione «Alessandro figlio di Simone», benché non si possa provare che sia la stessa famiglia. Ebrei «delle parti della Libia Cirenaica» udirono gli apostoli a Pentecoste; i Cirenei appartenevano alla sinagoga che disputò con Stefano; «Ciprioti e Cirenei» furono i primi a predicare ai Greci ad Antiochia, e «Lucio di Cirene» era fra i profeti e i dottori di là."
    - "Nel 115–117 gli Ebrei di Cirene si sollevarono contro Roma sotto un capo detto Lukuas o Andreas; Cassio Dione dice che massacrarono Romani e Greci, e Adriano dovette ricostruire la città. Un terremoto nel 365 la rovinò; Sinesio, nativo di Cirene e vescovo di Tolemaide verso il 410, la vide in declino, e dopo la conquista araba degli anni 640 fu abbandonata. Le rovine presso Shahhat, nella Libia orientale, con il santuario di Apollo, il tempio di Zeus e la grande necropoli, furono iscritte dall’UNESCO nel 1982 e dal 2016 sono nella Lista del patrimonio in pericolo."
  pl:
    - "Cyrena była głównym greckim miastem Libii, na tarasie zielonego Dżabal al-Achdar, około 600 m nad morzem i około 15 km od swego portu Apollonia. Herodot opowiada, jak osadnicy z wyspy Thera pod wodzą Battosa założyli ją około 631 r. p.n.e. za radą Delf. Pod królami Battiadami, a potem jako republika bogaciła się na zbożu, koniach i sylfium, roślinie cenionej jako lek i przyprawa; Pindar opiewał jej króla Arkesilaosa, a matematyk Eratostenes i filozof Arystyp urodzili się tam. Od 322 r. p.n.e. należała do Ptolemeuszy, którzy osiedlili w niej Żydów; ostatni władca zapisał ją Rzymowi w 96 r. p.n.e., a później połączono ją z Kretą w jedną prowincję. Józef Flawiusz cytuje Strabona, że Cyrena miała cztery klasy ludzi: obywateli, rolników, cudzoziemców i Żydów, a Jazon z Cyreny napisał dzieje, które skrócono w 2 Księdze Machabejskiej."
    - "Żyd z tego miasta niósł krzyż: żołnierze „znaleźli człowieka Cyrenejczyka, imieniem Szymon; tego przymusili, aby niósł krzyż jego”. Marek dodaje o nim: „który szedł z pola, ojca Aleksandrowego i Rufowego”, jakby jego synowie byli znani czytelnikom; Rufus jest pozdrowiony w liście do Rzymian. W 1941 r. grobowiec, prawdopodobnie Żydów cyrenejskich, w dolinie Cedronu w Jerozolimie dał osuarium z napisem „Aleksander, syn Szymona”, choć nie można udowodnić, czy chodzi o tę samą rodzinę. Wśród słuchających apostołów w Pięćdziesiątnicę byli Żydzi „w stronach Libii, która jest podle Cyreny”; Cyrenejczycy należeli do synagogi, która spierała się ze Szczepanem; „mężowie z Cypru i z Cyreny” jako pierwsi głosili Grekom w Antiochii, a „Lucyjus Cyrenejczyk” był wśród tamtejszych proroków i nauczycieli."
    - "W latach 115–117 Żydzi Cyreny powstali przeciw Rzymowi pod wodzą człowieka zwanego Lukuas lub Andreas; Kasjusz Dion mówi, że wymordowali Rzymian i Greków, a Hadrian musiał odbudować miasto. Trzęsienie ziemi w 365 r. zrujnowało je; Synezjusz, rodem z Cyreny i biskup Ptolemaidy około 410 r., widział je w upadku, a po arabskim podboju w latach czterdziestych VII w. zostało opuszczone. Ruiny koło Szahhat we wschodniej Libii, z sanktuarium Apolla, świątynią Zeusa i wielką nekropolią, wpisało UNESCO na listę w 1982 r., a od 2016 r. figurują na Liście Dziedzictwa Zagrożonego."
  nl:
    - "Cyrene was de voornaamste Griekse stad van Libië, op een terras van het groene Jebel Akhdar zo'n 600 m boven de zee en zo'n 15 km van haar haven Apollonia. Herodotus vertelt hoe kolonisten van het eiland Thera onder Battus haar omstreeks 631 v.Chr. stichtten op raad van Delphi. Onder de Battiaden en daarna als republiek werd zij rijk door graan, paarden en silfium, een plant gewaardeerd als geneesmiddel en specerij; Pindarus bezong haar koning Arkesilaos, en de wiskundige Eratosthenes en de filosoof Aristippus werden er geboren. Vanaf 322 v.Chr. behoorde zij aan de Ptolemaeën, die er Joden vestigden; de laatste heerser liet haar in 96 v.Chr. aan Rome na, en later kwam zij met Kreta in één provincie. Josephus citeert Strabo dat Cyrene vier klassen had: burgers, landbouwers, vreemdelingen en Joden; Jason van Cyrene schreef de geschiedenis die 2 Makkabeeën samenvat."
    - "Een Jood uit deze stad droeg het kruis: toen de soldaten uitgingen, “vonden zij een man van Cyrene, met name Simon; dezen dwongen zij, dat hij Zijn kruis droeg”. Marcus voegt toe dat hij “komende van den akker” was, “den vader van Alexander en Rufus”, alsof zijn zonen bij de lezers bekend waren; een Rufus wordt gegroet in de brief aan de Romeinen. In 1941 leverde een graf, waarschijnlijk van Joden uit Cyrenaica, in het Kidrondal bij Jeruzalem een ossuarium op met het opschrift “Alexander, zoon van Simon”, al kan niet worden bewezen dat het dezelfde familie is. Joden uit “de delen van Libye, hetwelk bij Cyrene ligt” hoorden de apostelen met Pinksteren; Cyreners behoorden tot de synagoge die met Stefanus redetwistte; “Cyprische en Cyreneische mannen” waren de eersten die in Antiochië tot Grieken predikten, en “Lucius van Cyrene” was een van de profeten en leraars aldaar."
    - "In 115–117 kwamen de Joden van Cyrene in opstand tegen Rome onder een leider genaamd Lukuas of Andreas; Cassius Dio zegt dat zij Romeinen en Grieken afslachtten, en Hadrianus moest de stad herbouwen. Een aardbeving ruïneerde haar in 365; Synesius, geboren Cyreneër en omstreeks 410 bisschop van Ptolemaïs, zag haar in verval, en na de Arabische verovering in de jaren 640 werd zij verlaten. De ruïnes bij Shahhat in Oost-Libië, met het heiligdom van Apollo, de tempel van Zeus en de grote necropolis, werden in 1982 door UNESCO ingeschreven en staan sinds 2016 op de Lijst van Werelderfgoed in Gevaar."
  cs:
    - "Kyréna bylo přední řecké město Libye, na terase zelené Džebel Achdar asi 600 m nad mořem a asi 15 km od svého přístavu Apollonie. Hérodotos vypráví, jak osadníci z ostrova Théra pod vedením Batta je kolem roku 631 př. n. l. založili na radu Delf. Za králů Battovců a pak jako republika bohatla z obilí, koní a silfia, rostliny cenné jako lék i koření; Pindaros opěval jejího krále Arkesilaa a narodili se tu matematik Eratosthenés a filosof Aristippos. Od roku 322 př. n. l. patřila Ptolemaiovcům, kteří v ní usadili Židy; poslední vládce ji roku 96 př. n. l. odkázal Římu a později byla spojena s Krétou v jednu provincii. Josephus cituje Strabóna, že Kyréna měla čtyři třídy lidí: občany, rolníky, cizince a Židy, a Jasón z Kyrény napsal dějiny zkrácené ve 2. knize Makabejské."
    - "Žid z tohoto města nesl kříž: vojáci „nalezli člověka Cyrenenského, jménem Šimona. Toho přinutili, aby nesl kříž jeho“. Marek dodává, že šel „z pole, otce Alexandrova a Rufova“, jako by jeho synové byli čtenářům známi; Rufos je pozdraven v listu Římanům. Roku 1941 vydala hrobka, pravděpodobně kyrenajských Židů, v údolí Kidronu v Jeruzalémě osarium s nápisem „Alexandr syn Šimonův“, ač zda jde o tutéž rodinu, nelze dokázat. Mezi posluchači apoštolů o Letnicích byli Židé „v krajinách Libye, kteráž jest vedle Cyrénu“; Kyrenští patřili k synagoze, která se hádala se Štěpánem; „muži z Cypru a někteří Cyrenenští“ byli první, kdo kázali Řekům v Antiochii, a „Lucius Cyrenenský“ patřil mezi tamní proroky a učitele."
    - "V letech 115–117 se Židé z Kyrény vzbouřili proti Římu pod vůdcem zvaným Lukuas nebo Andreas; Cassius Dio praví, že vyvraždili Římany a Řeky, a Hadrianus musel město přestavět. Zemětřesení roku 365 je zničilo; Synesios, rodák z Kyrény a biskup Ptolemais kolem roku 410, je viděl v úpadku a po arabském dobytí ve 40. letech 7. století bylo opuštěno. Zříceniny poblíž Šahhátu ve východní Libyi se svatyní Apollónovou, chrámem Diovým a velkou nekropolí byly zapsány UNESCO roku 1982 a od roku 2016 jsou na Seznamu ohrožených."
