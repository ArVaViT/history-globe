body:
  en:
    - "Rephidim was the last camp of Israel before Mount Sinai. The itinerary of Numbers puts it after Alush and before the wilderness of Sinai, and Exodus says that the people came from the wilderness of Sin “and pitched in Rephidim: and there was no water for the people to drink”. They quarrelled with Moses, and at the LORD's word he struck the rock in Horeb: “thou shalt smite the rock, and there shall come water out of it, that the people may drink”. He named the place Massah and Meribah, Testing and Strife, because they had asked, “Is the LORD among us, or not?”"
    - "“Then came Amalek, and fought with Israel in Rephidim.” Joshua led the fight while Moses stood on the hill with the rod of God; when his hands grew heavy, “Aaron and Hur stayed up his hands”, one on each side, until sunset, and Amalek was defeated. Moses built an altar and called it “Jehovah-nissi”, the LORD my banner, and Amalek was marked for perpetual war. From Rephidim Israel went on into the wilderness of Sinai, and “there Israel camped before the mount”; Deuteronomy and the psalms look back to Massah and Meribah as the place where Israel tempted God."
    - "Where Rephidim lay depends on where Sinai is put. With the traditional Jebel Musa, the usual choice is the oasis of Wadi Feiran, the largest in the south of the peninsula, with its palms and perennial water; Byzantine Pharan stood there with its bishop, and a pilgrim of about 570 saw there an oratory whose altar stood on the stones placed under Moses as he prayed. Others, finding Feiran too far from the mountain, prefer Wadi Refayid or the pass of el-Watiya in Wadi esh-Sheikh, closer to Jebel Musa; those who seek Sinai elsewhere, in the north of the peninsula or in Arabia, move Rephidim with it. None of these has been confirmed by finds. The southern candidates lie in the South Sinai governorate of Egypt, the Feiran oasis on the road from the coast to the monastery of St Catherine."
  ru:
    - "Рефидим был последним станом Израиля перед горой Синай. Перечень станов в книге Чисел ставит его после Алуша и перед пустыней Синайской, а Исход говорит, что всё общество вышло из пустыни Син и «расположилось станом в Рефидиме, и не было воды пить народу». Народ укорял Моисея, и по слову Господню тот ударил в скалу в Хориве: «ты ударишь в скалу, и пойдет из нее вода, и будет пить народ». Он назвал место Масса и Мерива, Искушение и Укорение, потому что народ спрашивал: «есть ли Господь среди нас, или нет?»"
    - "«И пришли Амаликитяне и воевали с Израильтянами в Рефидиме». Иисус Навин вёл бой, а Моисей стоял на холме с жезлом Божиим; когда руки его отяжелели, «Аарон же и Ор поддерживали руки его», один с одной, другой с другой стороны, до захода солнца, и Амалик был побеждён. Моисей устроил жертвенник и нарёк ему имя «Иегова Нисси», Господь — знамя моё, и Амалику была объявлена вечная война. Из Рефидима Израиль двинулся в пустыню Синайскую и «расположился там Израиль станом против горы»; Второзаконие и псалмы вспоминают Массу и Мериву как место, где Израиль искушал Бога."
    - "Где лежал Рефидим, зависит от того, где искать Синай. При традиционном Джебель-Муса обычно выбирают оазис Вади-Фейран, крупнейший на юге полуострова, с пальмами и постоянной водой; там стоял византийский Фаран со своим епископом, и паломник около 570 года видел там часовню, престол которой стоял на камнях, подложенных под Моисея, когда он молился. Другие, считая Фейран слишком далёким от горы, предпочитают Вади-Рефайид или проход эль-Ватия в Вади-эш-Шейх, ближе к Джебель-Муса; те, кто ищет Синай в другом месте, на севере полуострова или в Аравии, переносят вместе с ним и Рефидим. Ни одно из этих мест не подтверждено находками. Южные кандидаты лежат в египетской провинции Южный Синай, оазис Фейран — на дороге от побережья к монастырю Святой Екатерины."
  uk:
    - "Рефідім був останнім табором Ізраїлю перед горою Синай. Маршрут Книги Чисел ставить його після Алуша й перед Синайською пустинею, а Книга Виходу каже, що народ прийшов з пустині Син і «втаборились у Рефидимі; і не було води пити людям». Вони сварилися з Мойсеєм, і за словом Господа він вдарив скелю в Горебі: «вдариш ти по скелї, і рине з її вода, щоб напились люде». Він назвав те місце Масса й Мерива, Випробування та Сварка, бо вони запитали: «Чи Господь є між нами, чи нема?»"
    - "«І прийшов Амалек, і бив на Ізраїля в Рефидимі.» Ісус Навин вів бій, поки Мойсей стояв на пагорбі з жезлом Божим; коли його руки обважніли, «Арон же та Гур стали піддержувати руцї його», один з одного боку, другий з другого, аж до заходу сонця, і Амалек був переможений. Мойсей збудував жертовник і назвав його «Егова-Нїссі», тобто Господь — мій прапор, а Амалек був приречений на вічну війну. Від Рефідіма Ізраїль рушив далі в Синайську пустиню, і там Ізраїль отаборився перед горою; Книга Повторення Закону й псалми озираються на Массу й Мериву як на місце, де Ізраїль випробовував Бога."
    - "Де лежав Рефідім, залежить від того, куди поміщено Синай. Для традиційного Джебель-Муси зазвичай обирають оазис Ваді-Фейран, найбільший на півдні півострова, із пальмами та вічною водою; там стояв візантійський Фаран зі своїм єпископом, і прочанин близько 570 р. бачив там каплицю, вівтар якої стояв на каменях, підкладених під Мойсея, коли він молився. Інші, вважаючи Фейран надто далеким від гори, віддають перевагу Ваді-Рефаїд або проходу ель-Ватія у Ваді-еш-Шейх, ближчому до Джебель-Муси; ті ж, хто шукає Синай деінде, на півночі півострова чи в Аравії, переносять разом із ним і Рефідім. Жодне з цих місць не підтверджене знахідками. Південні кандидати лежать у провінції Південний Синай в Єгипті, оазис Фейран — на дорозі від узбережжя до монастиря святої Катерини."
  es:
    - "Refidim fue el último campamento de Israel antes del monte Sinaí. El itinerario de Números lo pone después de Alús y antes del desierto de Sinaí, y el Éxodo dice que el pueblo salió del desierto de Sin y «asentaron el campo en Rephidim: y no había agua para que el pueblo bebiese». Disputaron con Moisés, y por palabra del Señor él golpeó la peña en Horeb: «herirás la peña, y saldrán de ella aguas, y beberá el pueblo». Llamó al lugar Masá y Meriba, Prueba y Contienda, porque habían preguntado: «¿Está, pues, Jehová entre nosotros, ó no?»."
    - "«Y vino Amalec, y peleó con Israel en Rephidim». Josué dirigió el combate mientras Moisés estaba en el collado con la vara de Dios; cuando sus manos se cansaron, «Aarón y Hur sustentaban sus manos», una a cada lado, hasta la puesta del sol, y Amalec fue derrotado. Moisés edificó un altar y lo llamó «Jehová-nissi», el Señor mi bandera, y Amalec quedó señalado para una guerra perpetua. Desde Refidim Israel siguió al desierto de Sinaí, y «acampó allí Israel delante del monte»; el Deuteronomio y los salmos miran atrás a Masá y Meriba como el lugar donde Israel tentó a Dios."
    - "Dónde estaba Refidim depende de dónde se sitúe el Sinaí. Con el tradicional Jebel Musa, la elección habitual es el oasis de Wadi Feiran, el mayor del sur de la península, con sus palmeras y agua perenne; allí estuvo la Farán bizantina con su obispo, y un peregrino de hacia 570 vio allí un oratorio cuyo altar se alzaba sobre las piedras puestas bajo Moisés mientras oraba. Otros, al hallar Feiran demasiado lejos de la montaña, prefieren Wadi Refayid o el paso de el-Watiya en Wadi esh-Sheikh, más cerca del Jebel Musa; quienes buscan el Sinaí en otra parte, en el norte de la península o en Arabia, mueven Refidim con él. Ninguno de estos lugares ha sido confirmado por hallazgos. Los candidatos meridionales se encuentran en la gobernación egipcia del Sinaí Sur, el oasis de Feiran en el camino de la costa al monasterio de Santa Catalina."
  pt:
    - "Refidim foi o último acampamento de Israel antes do Monte Sinai. O itinerário de Números a põe depois de Alus e antes do deserto do Sinai, e o Êxodo diz que o povo veio do deserto de Sim e “acampou em Refidim; mas não havia água para o povo beber”. Contenderam com Moisés e, por ordem do SENHOR, ele feriu a rocha em Horebe: “Você ferirá a rocha, e dela sairá água, para que o povo possa beber”. Ele chamou o lugar Massá e Meribá, Prova e Contenda, porque haviam perguntado: “O SENHOR está entre nós, ou não?”"
    - "“Então Amaleque veio e lutou contra Israel em Refidim.” Josué conduziu a luta enquanto Moisés estava na colina com a vara de Deus; quando suas mãos ficaram pesadas, “Arão e Hur seguraram as suas mãos”, um de cada lado, até o pôr do sol, e Amaleque foi derrotado. Moisés construiu um altar e o chamou “O SENHOR é a nossa Bandeira”, e Amaleque ficou marcado para guerra perpétua. De Refidim Israel seguiu para o deserto do Sinai, e “ali Israel acampou diante do monte”; o Deuteronômio e os salmos olham para Massá e Meribá como o lugar onde Israel tentou a Deus."
    - "Onde ficava Refidim depende de onde se põe o Sinai. Com o tradicional Jebel Musa, a escolha habitual é o oásis de Wadi Feiran, o maior do sul da península, com suas palmeiras e água perene; a Farã bizantina ali tinha seu bispo, e um peregrino de cerca de 570 viu ali um oratório cujo altar estava sobre as pedras postas sob Moisés enquanto orava. Outros, achando Feiran longe demais do monte, preferem o Wadi Refayid ou a passagem de el-Watiya no Wadi esh-Sheikh, mais perto do Jebel Musa; os que buscam o Sinai em outro lugar, no norte da península ou na Arábia, movem Refidim com ele. Nenhum desses foi confirmado por achados. Os candidatos meridionais ficam na província do Sinai do Sul, no Egito, o oásis de Feiran na estrada da costa ao mosteiro de Santa Catarina."
  de:
    - "Refidim war Israels letztes Lager vor dem Berg Sinai. Die Stationenliste der Numeri setzt es nach Alusch und vor die Wüste Sinai, und das Exodusbuch sagt, das Volk sei aus der Wüste Sin gezogen „und sie lagerten sich in Raphidim. Da hatte das Volk kein Wasser zu trinken“. Sie haderten mit Mose, und auf das Wort des HERRN schlug er den Fels am Horeb: „da sollst du den Fels schlagen, so wird Wasser herauslaufen, daß das Volk trinke“. Er nannte den Ort Massa und Meriba, Versuchung und Zank, weil sie gefragt hatten: „Ist der HERR unter uns oder nicht?“"
    - "„Da kam Amalek und stritt wider Israel in Raphidim.“ Josua führte den Kampf, während Mose mit dem Stab Gottes auf dem Hügel stand; als seine Hände schwer wurden, „Aaron aber und Hur stützten ihm seine Hände, auf jeglicher Seite einer“, bis die Sonne unterging, und Amalek wurde geschlagen. Mose baute einen Altar und nannte ihn „Der HERR ist mein Panier“, und Amalek wurde zum ewigen Krieg bestimmt. Von Refidim zog Israel weiter in die Wüste Sinai, und sie „lagerten sich in der Wüste daselbst gegenüber dem Berge“; das Deuteronomium und die Psalmen blicken auf Massa und Meriba als den Ort zurück, wo Israel Gott versuchte."
    - "Wo Refidim lag, hängt davon ab, wo man den Sinai ansetzt. Beim traditionellen Dschebel Musa ist die übliche Wahl die Oase Wadi Feiran, die größte im Süden der Halbinsel, mit Palmen und ständigem Wasser; das byzantinische Pharan stand dort mit seinem Bischof, und ein Pilger um 570 sah dort ein Oratorium, dessen Altar auf den Steinen stand, die man Mose beim Beten untergelegt hatte. Andere, denen Feiran zu weit vom Berg liegt, ziehen das Wadi Refayid oder den Pass von el-Watiya im Wadi esch-Scheich vor, näher am Dschebel Musa; wer den Sinai anderswo sucht, im Norden der Halbinsel oder in Arabien, verlegt Refidim mit ihm. Keines davon ist durch Funde bestätigt. Die südlichen Kandidaten liegen im ägyptischen Gouvernement Südsinai, die Oase Feiran an der Straße von der Küste zum Katharinenkloster."
  fr:
    - "Rephidim fut le dernier campement d’Israël avant le mont Sinaï. L’itinéraire des Nombres la place après Alusch et avant le désert du Sinaï, et l’Exode dit que le peuple vint du désert de Sin et « campa à Rephidim, où le peuple ne trouva point d’eau à boire ». Ils cherchèrent querelle à Moïse, et sur la parole de l’Éternel il frappa le rocher d’Horeb : « tu frapperas le rocher, et il en sortira de l’eau, et le peuple boira ». Il nomma le lieu Massa et Meriba, Épreuve et Querelle, parce qu’ils avaient demandé : « L’Éternel est-il au milieu de nous, ou n’y est-il pas ? »"
    - "« Amalek vint combattre Israël à Rephidim. » Josué mena le combat tandis que Moïse se tenait sur la colline avec la verge de Dieu ; quand ses mains devinrent lourdes, « Aaron et Hur soutenaient ses mains », l’un d’un côté, l’autre de l’autre, jusqu’au coucher du soleil, et Amalek fut vaincu. Moïse bâtit un autel et le nomma « l’Éternel ma bannière », et Amalek fut voué à une guerre perpétuelle. De Rephidim, Israël alla dans le désert du Sinaï, et « Israël campa là, vis-à-vis de la montagne » ; le Deutéronome et les psaumes rappellent Massa et Meriba comme le lieu où Israël tenta Dieu."
    - "L’emplacement de Rephidim dépend de celui qu’on donne au Sinaï. Avec le traditionnel Djebel Musa, le choix habituel est l’oasis de Wadi Feiran, la plus grande du sud de la péninsule, avec ses palmiers et son eau pérenne ; la Pharan byzantine s’y dressait avec son évêque, et un pèlerin vers 570 y vit un oratoire dont l’autel reposait sur les pierres placées sous Moïse pendant qu’il priait. D’autres, trouvant Feiran trop loin de la montagne, préfèrent Wadi Refayid ou le défilé d’el-Watiya dans le Wadi esh-Sheikh, plus près du Djebel Musa ; ceux qui cherchent le Sinaï ailleurs, dans le nord de la péninsule ou en Arabie, déplacent Rephidim avec lui. Aucun n’est confirmé par des trouvailles. Les candidats du sud se trouvent dans le gouvernorat du Sinaï-Sud, en Égypte, l’oasis de Feiran sur la route de la côte au monastère Sainte-Catherine."
  it:
    - "Refidim fu l’ultimo accampamento di Israele prima del Monte Sinai. L’itinerario dei Numeri la pone dopo Alus e prima del deserto del Sinai, e l’Esodo dice che il popolo venne dal deserto di Sin «e si accampò a Refidim; e non c’era acqua da bere per il popolo». Contesero con Mosè, e per parola del Signore egli percosse la roccia in Horeb: «tu percoterai la roccia, e ne scaturirà dell’acqua, ed il popolo berrà». Chiamò il luogo Massa e Meriba, Prova e Contesa, perché avevano chiesto: «L’Eterno è egli in mezzo a noi, si o no?»"
    - "«Allora venne Amalek a dar battaglia a Israele a Refidim.» Giosuè guidò il combattimento mentre Mosè stava sul colle con il bastone di Dio; quando le sue mani si fecero pesanti, «Aaronne e Hur gli sostenevano le mani», una da ciascun lato, fino al tramonto, e Amalek fu sconfitto. Mosè edificò un altare e lo chiamò Jehovah-nissi, «L’Eterno è la mia bandiera», e Amalek fu segnato per una guerra perpetua. Da Refidim Israele proseguì nel deserto del Sinai, e «quivi si accampò Israele, dirimpetto al monte»; il Deuteronomio e i salmi guardano indietro a Massa e a Meriba come al luogo in cui Israele tentò Dio."
    - "Dove si trovasse Refidim dipende da dove si pone il Sinai. Con il tradizionale Jebel Musa, la scelta abituale è l’oasi di Wadi Feiran, la più grande del sud della penisola, con le sue palme e l’acqua perenne; la Pharan bizantina sorgeva lì con il suo vescovo, e un pellegrino verso il 570 vi vide un oratorio il cui altare poggiava sulle pietre poste sotto Mosè mentre pregava. Altri, trovando Feiran troppo lontana dal monte, preferiscono Wadi Refayid o il passo di el-Watiya nel Wadi esh-Sheikh, più vicino al Jebel Musa; chi cerca il Sinai altrove, nel nord della penisola o in Arabia, sposta con esso Refidim. Nessuna di queste ipotesi è stata confermata da ritrovamenti. I candidati meridionali si trovano nel governatorato egiziano del Sinai meridionale, l’oasi di Feiran sulla strada dalla costa al monastero di Santa Caterina."
  pl:
    - "Refidim było ostatnim obozem Izraela przed Górą Synaj. Itinerarium z Księgi Liczb umieszcza je po Alusz i przed pustynią Synaj, a Księga Wyjścia mówi, że lud przyszedł z pustyni Sin „i położyli się obozem w Rafidym, gdzie wody nie było, aby pił lud”. Kłócili się z Mojżeszem, a na słowo Pana, który rzekł: „uderzysz w skałę, a wynijdą z niej wody, które będzie pił lud”, uderzył on w skałę w Horeb. Nazwał to miejsce Massa i Meriba, Próba i Spór, ponieważ pytali: „I jestże Pan między nami czyli nie?”"
    - "„Tedy przyciągnął Amalek, aby walczył z Izraelem w Rafidym”. Walkę prowadził Jozue, podczas gdy Mojżesz stał na pagórku z laską Bożą; gdy jego ręce ociężały, „Aaron, i Chur podpierali ręce jego”, jeden z jednej, drugi z drugiej strony, aż do zachodu słońca, i Amalek został pokonany. Mojżesz zbudował ołtarz i nazwał go Jahwe-Nissi, „Pan chorągiew moja”, a Amalek został naznaczony wieczną wojną. Z Refidim Izrael poszedł dalej na pustynię Synaj, i „rozbił tam Izrael namioty przeciw górze”; Księga Powtórzonego Prawa i psalmy wspominają Massa i Meriba jako miejsce, gdzie Izrael kusił Boga."
    - "Gdzie leżało Refidim, zależy od tego, gdzie umieści się Synaj. Przy tradycyjnym Dżabal Musa zwykłym wyborem jest oaza Wadi Feiran, największa na południu półwyspu, z palmami i stałą wodą; stał tam bizantyński Faran ze swoim biskupem, a pielgrzym około 570 r. widział tam oratorium, którego ołtarz stał na kamieniach podłożonych pod Mojżesza, gdy się modlił. Inni, uznając, że Feiran leży zbyt daleko od góry, wolą Wadi Refajid albo przełęcz el-Watija w Wadi asz-Szajch, bliżej Dżabal Musa; ci, którzy szukają Synaju gdzie indziej, na północy półwyspu lub w Arabii, przesuwają razem z nim Refidim. Żadne z tych miejsc nie zostało potwierdzone znaleziskami. Południowi kandydaci leżą w egipskiej muhafazie Synaj Południowy, oaza Feiran przy drodze od wybrzeża do klasztoru św. Katarzyny."
  cs:
    - "Refídim byl poslední tábor Izraele před horou Sinaj. Itinerář Numeri jej klade po Alúš a před poušť Sinaj a Exodus praví, že lid přišel z pouště Sín a „položili se v Rafidim, kdež nebylo vod, kteréž by lid píti mohl“. Svářili se s Mojžíšem a na Hospodinovo slovo udeřil do skály v Orébu: „i udeříš v skálu, a vyjdou z ní vody, kteréž bude píti lid“. Místo nazval Masa a Meriba, Zkouška a Svár, protože se ptali: „Jest-li Hospodin u prostřed nás, či není?“"
    - "„Přitáhl pak Amalech, a bojoval s Izraelem v Rafidim.“ Jozue vedl boj, zatímco Mojžíš stál na pahorku s holí Boží; když jeho ruce ztěžkly, „Aron pak a Hur podpírali ruce jeho“, každý z jedné strany, až do západu slunce, a Amalek byl poražen. Mojžíš vzdělal oltář a nazval jej „Hospodin korouhev má“ a Amalek byl poznamenán věčnou válkou. Z Refídimu šel Izrael dál na poušť Sinaj a „tu rozbili Izraelští stany naproti hoře“; Deuteronomium a žalmy vzpomínají na Masu a Meribu jako na místo, kde Izrael pokoušel Boha."
    - "Kde Refídim ležel, závisí na tom, kam se klade Sinaj. S tradičním Džabal Músá je obvyklou volbou oáza Vádí Fejrán, největší na jihu poloostrova, s palmami a trvalou vodou; stál tam byzantský Faran se svým biskupem a poutník kolem roku 570 tam viděl oratoř, jejíž oltář stál na kamenech podložených pod Mojžíše, když se modlil. Jiní, kteří shledávají Fejrán příliš vzdálený od hory, dávají přednost Vádí Refajid nebo průsmyku el-Vátija ve Vádí aš-Šajch, blíže k Džabal Músá; ti, kdo hledají Sinaj jinde, na severu poloostrova nebo v Arábii, přesouvají Refídim s ním. Nic z toho nebylo potvrzeno nálezy. Jižní kandidáti leží v egyptském guvernorátu Jižní Sinaj, oáza Fejrán na cestě od pobřeží ke klášteru svaté Kateřiny."
  nl:
    - "Refidim was het laatste kamp van Israël vóór de berg Sinaï. De reisroute van Numeri plaatst het na Alus en vóór de woestijn van Sinaï, en Exodus zegt dat het volk uit de woestijn Sin kwam “en zij legerden zich te Rafidim. Daar nu was geen water voor het volk om te drinken”. Zij twistten met Mozes, en op het woord van de HEER sloeg hij de rots in Horeb: “gij zult op den rotssteen slaan, zo zal er water uitgaan, dat het volk drinke”. Hij noemde de plaats Massa en Meriba, Beproeving en Twist, omdat zij gevraagd hadden: “Is de HEERE in het midden van ons, of niet?”"
    - "“Toen kwam Amalek en streed tegen Israel in Rafidim.” Jozua voerde de strijd terwijl Mozes op de heuvel stond met de staf van God; toen zijn handen zwaar werden, “Aaron en Hur onderstutten zijn handen”, een aan elke kant, tot zonsondergang, en Amalek werd verslagen. Mozes bouwde een altaar en gaf het de naam “De HEERE is mijn Banier!”, en Amalek werd getekend voor eeuwige oorlog. Van Refidim trok Israël verder de woestijn van Sinaï in, en “Israel nu legerde zich aldaar tegenover dien berg”; Deuteronomium en de psalmen zien terug op Massa en Meriba als de plaats waar Israël God verzocht."
    - "Waar Refidim lag, hangt af van waar men de Sinaï plaatst. Bij de traditionele Jebel Musa is de gebruikelijke keuze de oase van Wadi Feiran, de grootste in het zuiden van het schiereiland, met palmen en bestendig water; het Byzantijnse Pharan lag er met zijn bisschop, en een pelgrim van omstreeks 570 zag er een bidkapel waarvan het altaar stond op de stenen die onder Mozes waren gelegd toen hij bad. Anderen, die Feiran te ver van de berg vinden, geven de voorkeur aan Wadi Refayid of de pas van el-Watiya in Wadi esh-Sheikh, dichter bij Jebel Musa; wie de Sinaï elders zoekt, in het noorden van het schiereiland of in Arabië, verplaatst Refidim mee. Geen daarvan is door vondsten bevestigd. De zuidelijke kandidaten liggen in het gouvernement Zuid-Sinaï van Egypte, de oase Feiran aan de weg van de kust naar het klooster van Sint-Catharina."
  sv:
    - "Refidim var Israels sista läger före Sinaiberget. Vandringsförteckningen i Fjärde Mosebok placerar det efter Alush och före Sinais öken, och Andra Mosebok säger att folket kom från öknen Sin och ”lägrade sig i Refidim; där hade folket intet vatten att dricka”. De tvistade med Mose, och på HERRENS ord slog han på klippan i Horeb: ”du skall slå på klippan, och vatten skall då komma ut ur den, så att folket får dricka”. Han gav platsen namnet Massa och Meriva, Frestelse och Tvist, eftersom de hade frågat: ”Är HERREN ibland oss eller icke?”"
    - "”Därefter kom Amalek och gav sig i strid med Israel i Refidim.” Josua ledde striden medan Mose stod på höjden med Guds stav; när hans händer blev tunga, ”stödde Aron och Hur hans händer”, en på vardera sidan, till solnedgången, och Amalek besegrades. Mose byggde ett altare och kallade det ”HERREN mitt baner”, och Amalek utpekades för ständigt krig. Från Refidim gick Israel vidare in i Sinais öken, och ”Israel lägrade sig där mitt emot berget”; Femte Mosebok och psalmerna ser tillbaka på Massa och Meriva som platsen där Israel frestade Gud."
    - "Var Refidim låg beror på var Sinai placeras. Med det traditionella Jebel Musa är det vanliga valet oasen Wadi Feiran, den största i halvöns södra del, med sina palmer och ständigt rinnande vatten; bysantinska Pharan låg där med sin biskop, och en pilgrim omkring 570 såg där ett oratorium vars altare stod på stenarna som lades under Mose när han bad. Andra, som finner Feiran för långt från berget, föredrar Wadi Refayid eller passet el-Watiya i Wadi esh-Sheikh, närmare Jebel Musa; de som söker Sinai på annat håll, i halvöns norr eller i Arabien, flyttar Refidim med det. Inget av detta har bekräftats av fynd. De södra kandidaterna ligger i guvernementet Sydsinai i Egypten, Feiranoasen vid vägen från kusten till Sankta Katarinas kloster."
  nb:
    - "Refidim var Israels siste leir før Sinai. Ferdaberetningen i 4. Mosebok setter den etter Alusj og før Sinai ørken, og 2. Mosebok sier at folket kom fra ørkenen Sin, «slo leir i Refidim, og folket hadde ikke vann å drikke». De kivet med Moses, og etter Herrens ord slo han på klippen i Horeb: «du skal slå på klippen, og det skal flyte vann ut av den, så folket får drikke». Han kalte stedet Massa og Meriba, Prøvelse og Strid, fordi de hadde spurt: «Er Herren iblandt oss eller ikke?»"
    - "«Så kom Amalek og stred med Israel i Refidim.» Josva ledet kampen mens Moses sto på haugen med Guds stav; da hendene hans ble tunge, «Aron og Hur støttet hans hender», én på hver side, til solnedgang, og Amalek ble slått. Moses bygde et alter og kalte det «Herren er mitt banner», Jehova-Nissi, og Amalek ble merket for evig krig. Fra Refidim dro Israel videre inn i Sinai ørken, og «Israel leiret sig der midt imot fjellet»; 5. Mosebok og salmene ser tilbake på Massa og Meriba som stedet der Israel frista Gud."
    - "Hvor Refidim lå, avhenger av hvor Sinai plasseres. Med det tradisjonelle Jebel Musa er det vanlige valget oasen Wadi Feiran, den største i sørlige del av halvøya, med sine palmer og evigflytende vann; bysantinske Pharan lå der med sin biskop, og en pilegrim omkring 570 så der et oratorium hvis alter sto på steinene som ble lagt under Moses mens han ba. Andre, som finner Feiran for langt fra fjellet, foretrekker Wadi Refayid eller passet el-Watiya i Wadi esh-Sheikh, nærmere Jebel Musa; de som søker Sinai andre steder, i nord på halvøya eller i Arabia, flytter Refidim med det. Ingen av dem er bekreftet av funn. De sørlige kandidatene ligger i det egyptiske guvernementet Sør-Sinai, Feiran-oasen ved veien fra kysten til Sankt Katarina-klosteret."
  tl:
    - "Ang Rephidim ang huling kampo ng Israel bago ang Bundok Sinai. Inilalagay ito ng itineraryo ng Mga Bilang pagkatapos ng Alus at bago ang ilang ng Sinai, at sinasabi ng Exodo na ang bayan ay galing sa ilang ng Sin at “humantong sa Rephidim: at walang tubig na mainom ang bayan”. Nakipagtalo sila kay Moises, at sa salita ng Panginoon ay pinalo niya ang bato sa Horeb: “iyong papaluin ang bato, at lalabasan ng tubig, upang ang bayan ay makainom”. Pinangalanan niya ang lugar na Massah at Meribah, Pagsubok at Pakikipagtalo, sapagkat nagtanong sila, “Ang Panginoon ba'y nasa gitna natin o wala?”"
    - "“Nang magkagayo'y dumating si Amalec, at nakipaglaban sa Israel sa Rephidim.” Pinangunahan ni Josue ang labanan habang nakatayo si Moises sa burol na hawak ang tungkod ng Dios; nang mangalay ang kaniyang mga kamay, “inalalayan ni Aaron at ni Hur ang kaniyang mga kamay”, isa sa bawat panig, hanggang paglubog ng araw, at natalo si Amalec. Nagtayo si Moises ng dambana at tinawag itong “Jehovanissi”, ang Panginoon ang aking watawat, at itinakda si Amalec para sa walang hanggang digmaan. Mula sa Rephidim ay nagpatuloy ang Israel sa ilang ng Sinai, at “doo'y humantong ang Israel sa harap ng bundok”; ang Deuteronomio at ang mga awit ay tumitingin pabalik sa Massah at Meribah bilang lugar kung saan tinukso ng Israel ang Dios."
    - "Nakasalalay ang lugar ng Rephidim sa kung saan inilalagay ang Sinai. Sa tradisyonal na Jebel Musa, karaniwang pinipili ang oasis ng Wadi Feiran, ang pinakamalaki sa timog ng tangway, na may mga palma at tubig na hindi natutuyo; nakatayo roon ang Pharan na Bisantino na may obispo, at nakakita roon ang isang peregrino noong mga 570 ng oratoryong ang dambana ay nasa mga batong inilagay sa ilalim ni Moises habang nananalangin. Ang iba, na nakikitang napakalayo ng Feiran sa bundok, ay mas gusto ang Wadi Refayid o ang daanan ng el-Watiya sa Wadi esh-Sheikh, mas malapit sa Jebel Musa; inililipat ng mga naghahanap sa Sinai sa hilaga ng tangway o sa Arabia ang Rephidim kasama nito. Walang nakumpirma ng mga natagpuan. Nasa gobernorato ng Timog Sinai ng Egipto ang mga katimugang kandidato, ang oasis ng Feiran sa daan mula baybayin patungo sa monasteryo ni Santa Catalina."
  da:
    - "Refidim var Israels sidste lejr før Sinajbjerget. Rejseberetningen i 4. Mosebog sætter den efter Alusj og før Sinajs ørken, og 2. Mosebog siger, at folket kom fra Sins ørken og »lejrede sig i Refidim, og Folket havde intet Vand at drikke«. De kivedes med Moses, og efter Herrens ord slog han på klippen i Horeb: »du skal slaa paa Klippen, saa skal der flyde Vand ud af den, at Folket maa drikke«. Han kaldte stedet Massa og Meriba, Prøvelse og Kiv, fordi de havde spurgt: »Monne Herren være iblandt os eller ej?«"
    - "»Og Amalek kom og stred imod Israel i Refidim.« Josva ledede kampen, mens Moses stod på højen med Guds stav; da hans hænder blev tunge, »Aron og Hur holdt hans Hænder oppe«, én på hver side, indtil solnedgang, og Amalek blev slået. Moses byggede et alter og kaldte det Jehova-Nissi, »Herren er mit Banner«, og Amalek blev udpeget til evig krig. Fra Refidim drog Israel videre ind i Sinajs ørken, og »der lejrede Israel sig lige for Bjerget«; 5. Mosebog og salmerne ser tilbage på Massa og Meriba som stedet, hvor Israel fristede Gud."
    - "Hvor Refidim lå, afhænger af, hvor Sinaj placeres. Med det traditionelle Jebel Musa er det sædvanlige valg oasen Wadi Feiran, den største i halvøens sydlige del, med sine palmer og vand hele året; byzantinske Pharan lå dér med sin biskop, og en pilgrim omkring 570 så dér et oratorium, hvis alter stod på stenene, der blev lagt under Moses, mens han bad. Andre, som finder Feiran for langt fra bjerget, foretrækker Wadi Refayid eller passet el-Watiya i Wadi esh-Sheikh, tættere på Jebel Musa; de, der søger Sinaj andetsteds, i halvøens nordlige del eller i Arabien, flytter Refidim med det. Ingen af disse er bekræftet ved fund. De sydlige kandidater ligger i Sydsinai-guvernementet i Egypten, Feiran-oasen på vejen fra kysten til Sankt Katarinas kloster."
  sr:
    - "Рафидин је био последњи израиљски логор пред гором Синај. Попис из Књиге бројева ставља га после Елуса а пре пустиње синајске, а Књига изласка каже да је народ дошао из пустиње Сина: „стадоше у логор у Рафидину; а онде не беше воде да народ пије“. Свађали су се с Мојсијем, и по Господњој речи он је ударио стену на Хориву: „ти удари у стену, и потећи ће из ње вода да пије народ“. Место је назвао Маса и Мерива, Кушање и Свађа, јер су питали: „Је ли Господ међу нама или није?“"
    - "„Али дође Амалик да се бије с Израиљем у Рафидину.“ Исус Навин је водио борбу док је Мојсије стајао на брду са штапом Божјим; кад су му руке отежале, „Арон и Ор држаху му руке један с једне стране а други с друге“ до заласка сунца, и Амалик је био побеђен. Мојсије је начинио олтар и назвао га „Господ, застава моја“, а Амалик је био означен за вечити рат. Из Рафидина је Израиљ отишао у пустињу синајску, и „логор начинише Израиљци онде под гором“; Поновљени закон и псалми гледају уназад на Масу и Мериву као на место где је Израиљ кушао Бога."
    - "Где је Рафидин лежао, зависи од тога где се стави Синај. Уз традиционални Џебел Мусу, уобичајени избор је оаза Вади Фејран, највећа на југу полуострва, са палмама и сталном водом; ту је стајао византијски Фаран са својим епископом, а ходочасник из око 570. видео је тамо молитвеницу чији је олтар стајао на камењу подметнутом под Мојсија док се молио. Други, налазећи да је Фејран предалеко од планине, више воле Вади Рефајид или превој ел-Ватија у Вади еш-Шејху, ближе Џебел Муси; они који траже Синај другде, на северу полуострва или у Арабији, померају Рафидин с њим. Ништа од тога није потврђено налазима. Јужни кандидати леже у гувернорату Јужни Синај у Египту, оаза Фејран на путу од обале до манастира Свете Катарине."
  hu:
    - "Refidim Izráel utolsó tábora volt a Sínai-hegy előtt. A Számok könyvének útleírása Alús után és a Sínai pusztája előtt helyezi, a Kivonulás könyve pedig azt mondja, hogy a nép a Szín pusztájából érkezett, és „tábort ütének Refidimben. De a népnek nem vala inni való vize”. Összevesztek Mózessel, és az Úr szavára a Hóreben lévő sziklára ütött: „te sujts a sziklára, és víz jő ki abból, hogy igyék a nép”. A helyet Masszának és Meribának nevezte, Megkísértésnek és Viszálynak, mert megkérdezték: „Vajjon köztünk van-é az Úr vagy nincsen?”"
    - "„Eljöve pedig Amálek és hadakozék Izráel ellen Refidimben.” Józsué vezette a harcot, míg Mózes a dombon állt Isten botjával; amikor kezei elnehezedtek, „Áron pedig és Húr tartják vala az ő kezeit”, egyik az egyik, másik a másik oldalon, napnyugtáig, és Amálek vereséget szenvedett. Mózes oltárt épített, és „Jehova-Niszszi” néven nevezte el, az Úr az én zászlóm, Amálek pedig örökös háborúra lett kijelölve. Refidimből Izráel a Sínai pusztájába ment tovább, és „a hegygyel átellenben szálla pedig ott táborba az Izráel”; az 5Móz és a zsoltárok Massza és Meriba felé tekintenek vissza, mint arra a helyre, ahol Izráel megkísértette Istent."
    - "Hogy hol feküdt Refidim, az attól függ, hová helyezik a Sínait. A hagyományos Jebel Musával a szokásos választás a Wadi Feiran oázisa, a félsziget déli részének legnagyobb oázisa, pálmáival és állandó vizével; a bizánci Pharan ott állt püspökével, és egy 570 körüli zarándok látott ott egy imaházat, amelynek oltára azokon a köveken állt, amelyeket Mózes alá helyeztek, miközben imádkozott. Mások, mivel Feirant túl messzinek találják a hegytől, a Wadi Refayidot vagy a Wadi esh-Sheikh el-Watiya hágóját részesítik előnyben, közelebb a Jebel Musához; akik a Sínait máshol keresik, a félsziget északi részén vagy Arábiában, Refidimet is vele együtt viszik. Egyiket sem erősítették meg leletek. A déli jelöltek Egyiptom Dél-Sínai kormányzóságában fekszenek, a Feiran-oázis a parttól a Szent Katalin-kolostorhoz vezető úton."
  fi:
    - "Refidim oli Israelin viimeinen leiripaikka ennen Siinainvuorta. 4. Mooseksen kirjan reittiluettelo asettaa sen Alusin jälkeen ja ennen Siinain erämaata, ja 2. Mooseksen kirja sanoo kansan tulleen Sinin erämaasta ja ”leiriytyneen Refidimiin; siellä ei ollut vettä kansan juoda”. He riitelivät Mooseksen kanssa, ja Herran sanasta hän löi kallioon Horebissa: ”lyö kallioon, ja siitä on vuotava vettä, niin että kansa saa juoda”. Hän nimesi paikan Massaksi ja Meribaksi, Koetteluksi ja Riidaksi, koska he olivat kysyneet: ”Onko Herra meidän keskellämme vai ei?”"
    - "”Sitten tulivat amalekilaiset ja taistelivat Israelia vastaan Refidimissä.” Joosua johti taistelua, kun Mooses seisoi kukkulalla Jumalan sauva kädessään; kun hänen kätensä väsyivät, ”Aaron ja Huur kannattivat hänen käsiänsä”, kumpikin puolelta, auringonlaskuun asti, ja Amalek voitettiin. Mooses rakensi alttarin ja nimesi sen Jehova-nissiksi, ”Herra on minun lippuni”, ja Amalek leimattiin ikuisen sodan kohteeksi. Refidimistä Israel jatkoi Siinain erämaahan, ja ”Israel oli siellä leirissä vuoren kohdalla”; 5. Mooseksen kirja ja psalmit katsovat taaksepäin Massaan ja Meribaan paikkana, jossa Israel kiusasi Jumalaa."
    - "Missä Refidim sijaitsi, riippuu siitä, minne Siinai sijoitetaan. Perinteisen Jebel Musan kanssa tavallinen valinta on Wadi Feiranin keidas, niemimaan etelän suurin, palmuineen ja ympärivuotisine vesineen; bysanttilainen Pharan oli siellä piispoineen, ja noin 570 pyhiinvaeltaja näki siellä rukoushuoneen, jonka alttari oli Mooseksen alle rukoillessa asetettujen kivien päällä. Toiset, jotka pitävät Feiranin liian kaukana vuoresta, suosivat Wadi Refayidia tai Wadi esh-Sheikhin el-Watiyan solaa, lähempänä Jebel Musaa; ne, jotka etsivät Siinaita muualta, niemimaan pohjoisosasta tai Arabiasta, siirtävät Refidimin sen mukana. Mikään näistä ei ole vahvistunut löydöillä. Eteläiset ehdokkaat sijaitsevat Egyptin Etelä-Siinain kuvernementissa, Feiranin keidas rannikolta Pyhän Katariinan luostarille johtavan tien varrella."
  vi:
    - "Rê-phi-đim là nơi đóng trại cuối cùng của Y-sơ-ra-ên trước núi Si-na-i. Bản hành trình trong sách Dân Số Ký đặt nó sau A-lúc và trước đồng vắng Si-na-i, và sách Xuất Ê-díp-tô Ký nói rằng dân đi từ đồng vắng Sin, “đóng trại tại Rê-phi-đim; ở đó chẳng có nước cho dân sự uống”. Họ cãi lộn với Môi-se, và theo lời Đức Giê-hô-va, ông đập hòn đá tại Hô-rếp: “ngươi hãy đập hòn đá, thì nước từ đó chảy ra, dân sự sẽ uống lấy”. Ông đặt tên nơi này là Ma-sa và Mê-ri-ba, Thử Thách và Tranh Cãi, vì họ đã hỏi: “Có Đức Giê-hô-va ở giữa chúng ta hay chăng?”"
    - "“Dân A-ma-léc đến khêu chiến cùng Y-sơ-ra-ên tại Rê-phi-đim.” Giô-suê dẫn đầu trận chiến trong khi Môi-se đứng trên đồi với gậy của Đức Chúa Trời; khi tay ông mỏi, A-rôn và Hu-rơ “ở hai bên đỡ tay người lên” cho đến khi mặt trời lặn, và A-ma-léc bị đánh bại. Môi-se lập một bàn thờ và đặt tên là “Giê-hô-va cờ xí của tôi”, Jehovah-nissi, và A-ma-léc bị đánh dấu cho cuộc chiến đời đời. Từ Rê-phi-đim, Y-sơ-ra-ên đi tiếp vào đồng vắng Si-na-i và “đóng trại tại đó, đối diện cùng núi”; sách Phục Truyền và Thi Thiên nhìn lại Ma-sa và Mê-ri-ba như nơi Y-sơ-ra-ên thử Đức Chúa Trời."
    - "Rê-phi-đim nằm đâu phụ thuộc vào việc đặt Si-na-i ở đâu. Với Jebel Musa truyền thống, lựa chọn thông thường là ốc đảo Wadi Feiran, lớn nhất ở phía nam bán đảo, với cọ và nước quanh năm; Pharan thời Byzantine đứng ở đó với giám mục của nó, và một người hành hương khoảng năm 570 thấy ở đó một nhà nguyện có bàn thờ đặt trên những viên đá kê dưới Môi-se khi ông cầu nguyện. Những người khác, thấy Feiran quá xa núi, ưa Wadi Refayid hay đèo el-Watiya ở Wadi esh-Sheikh, gần Jebel Musa hơn; những ai tìm Si-na-i ở nơi khác, ở phía bắc bán đảo hay ở A-ra-bi, thì dời Rê-phi-đim theo. Chưa nơi nào được xác nhận bằng hiện vật. Các ứng viên phía nam nằm trong tỉnh Nam Sinai của Ai Cập, ốc đảo Feiran trên con đường từ bờ biển đến tu viện Thánh Catherine."
  ro:
    - "Refidim a fost ultima tabără a lui Israel înainte de Muntele Sinai. Itinerarul din Numeri îl așază după Aluș și înainte de pustia Sinai, iar Exodul spune că poporul a venit din pustia Sin și „au tăbărît în Rafidin; și poporul nu aveà apă să beà”. S-au certat cu Moise, iar la cuvântul Domnului el a lovit stânca din Horeb: „vei lovì piatra, și va ieșì dintr’însa apă și va beà poporul”. A numit locul Masa și Meriba, Ispitirea și Cearta, pentru că întrebaseră: „de este Domnul întru noi, au ba?”"
    - "„Și a venit Amalic și băteà pre Israil în Rafidin.” Iosua a condus lupta, în timp ce Moise stătea pe deal cu toiagul lui Dumnezeu; când mâinile i s-au îngreuiat, „Aaron și Or rezemau mâinile lui”, unul de o parte, altul de alta, până la apusul soarelui, iar Amalec a fost înfrânt. Moise a zidit un altar și l-a numit Iahve-Nisi, Domnul, steagul meu, iar Amalec a fost destinat unui război fără sfârșit. De la Refidim, Israel a mers mai departe în pustia Sinai, și „a tăbărît acolo Israil împreajma muntelui”; Deuteronomul și psalmii privesc înapoi la Masa și Meriba ca la locul unde Israel L-a ispitit pe Dumnezeu."
    - "Unde se afla Refidim depinde de unde se pune Sinaiul. Cu tradiționalul Jebel Musa, alegerea obișnuită este oaza Wadi Feiran, cea mai mare din sudul peninsulei, cu palmierii și apa ei permanentă; Pharanul bizantin se afla acolo, cu episcopul lui, iar un pelerin din jurul anului 570 a văzut acolo un oratoriu al cărui altar stătea pe pietrele puse sub Moise în timp ce se ruga. Alții, găsind Feiranul prea departe de munte, preferă Wadi Refayid sau trecătoarea el-Watiya din Wadi esh-Sheikh, mai aproape de Jebel Musa; cei care caută Sinaiul în altă parte, în nordul peninsulei sau în Arabia, mută odată cu el și Refidimul. Niciunul dintre aceștia nu a fost confirmat de descoperiri. Candidații sudici se află în guvernoratul Sinai de Sud al Egiptului, oaza Feiran pe drumul de la coastă spre mănăstirea Sfânta Ecaterina."
  bg:
    - "Рефидим бил последният стан на Израил преди планината Синай. Маршрутът от Числа го поставя след Алуш и преди Синайската пустиня, а Изход казва, че народът дошъл от пустинята Син и „разположиха стан в Рафидим, дето нямаше вода да пият людете“. Те се карали с Мойсей и по Господнето слово той ударил канарата в Хорив: „ще удариш канарата, и ще излезе вода из нея да пият людете“. Той нарекъл мястото Маса и Мерива — Изпитание и Препирня, защото питали: „Да ли е между нас Господ, или не?“"
    - "„Тогаз дойде Амалик и направи бой с Израиля в Рафидим.“ Иисус Навин водел боя, докато Мойсей стоял на хълма с Божия жезъл; когато ръцете му натежали, „Аарон и Ор, един от едната страна и друг от другата, подпираха ръцете му“ до залез слънце и Амалик бил победен. Мойсей издигнал олтар и го нарекъл „Йеова Нисий“ — Господ е моето знаме, а Амалик бил обречен на вечна война. От Рефидим Израил продължил към Синайската пустиня и „там постави шатрите си Израил срещу гората“; Второзаконие и псалмите си спомнят за Маса и Мерива като мястото, където Израил изкушил Бога."
    - "Къде е бил Рефидим, зависи от това къде се поставя Синай. При традиционния Джебел Муса обичайният избор е оазисът Уади Фейран, най-големият в южната част на полуострова, с палмите и постоянната си вода; там стоял византийският Фаран със своя епископ, а един поклонник около 570 г. видял там молитвен дом, чийто олтар стоял върху камъните, подложени под Мойсей, докато се молел. Други, които намират Фейран твърде далеч от планината, предпочитат Уади Рефайид или прохода ел-Уатия в Уади еш-Шейх, по-близо до Джебел Муса; онези, които търсят Синай другаде, в северната част на полуострова или в Арабия, преместват и Рефидим. Нито едно от тях не е потвърдено от находки. Южните кандидати се намират в египетското губернаторство Южен Синай, а оазисът Фейран — по пътя от брега към манастира „Света Екатерина“."
