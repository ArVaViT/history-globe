# Overview article (ADR 0007). Mainstream facts only; this record is the Bezek of Judges 1; Saul's Bezek at Khirbet Ibziq is the leading candidate and the doubt about one or two Bezeks is stated; Eusebius' two villages are noted.
id: bezek
place: af48fdd
