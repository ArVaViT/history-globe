body:
  en:
    - "Bezek is the scene of the first battle in the book of Judges. After Joshua's death Judah, with Simeon, went up against the Canaanites, “and they slew of them in Bezek ten thousand men. And they found Adoni-bezek in Bezek: and they fought against him, and they slew the Canaanites and the Perizzites”. Adoni-bezek, “lord of Bezek”, fled and was caught, and his thumbs and great toes were cut off; he confessed that seventy kings so maimed had gathered scraps under his table, “as I have done, so God hath requited me”, and he was brought to Jerusalem and died there. A Bezek appears once more, where Saul numbered Israel before marching to relieve Jabesh-gilead."
    - "Saul's Bezek is Khirbet Ibziq, a ruin on the road from Shechem down to Beth-shean, about 20 km north-east of Nablus, a natural muster point opposite Jabesh; Eusebius knew two villages called Bezek there, seventeen Roman miles from Neapolis. Whether Judah's battle was fought at the same place is the question. The site is far north for a campaign of the southern tribes, and some have therefore looked for another Bezek in Judah's own country, at Tell Bezqa (Khirbet Bezqa) near Gezer, or have thought the name a corruption; others accept Ibziq and read the story as a wider sweep. The texts do not decide it. Khirbet Ibziq lies in the northern West Bank, above the Jordan valley."
  ru:
    - "Везек — место первой битвы в книге Судей. После смерти Иисуса Навина Иуда с Симеоном пошёл на Хананеев, «и побили они из них в Везеке десять тысяч человек. В Везеке встретились они с Адони-Везеком, сразились с ним и разбили Хананеев и Ферезеев». Адони-Везек, «господин Везека», бежал и был пойман, и ему отсекли большие пальцы рук и ног; он признал, что семьдесят царей, так же изувеченных, собирали крохи под его столом: «как делал я, так и мне воздал Бог», и его привели в Иерусалим, где он умер. Везек встречается ещё раз, там, где Саул осмотрел Израиль перед походом на выручку Иависа Галаадского."
    - "Везек Саула — Хирбет-Ибзик, руина на дороге из Сихема вниз к Беф-Сану, примерно в 20 км к северо-востоку от Наблуса, естественное место сбора напротив Иависа; Евсевий знал там два селения по имени Везек, в семнадцати римских милях от Неаполя. Вопрос в том, была ли битва Иуды там же. Для похода южных колен место лежит далеко на севере, и потому одни искали другой Везек в собственной земле Иуды, в Телль-Безке (Хирбет-Безка) близ Газера, или считали имя испорченным; другие принимают Ибзик и читают рассказ как более широкий поход. Тексты этого не решают. Хирбет-Ибзик лежит на севере Западного берега, над долиной Иордана."
  uk:
    - "Безек — місце першої битви в Книзі Суддів. Після смерті Ісуса Навина Юда з Симеоном виступив проти ханаанців, «вони побили їх під Безеком, десять тисяч чоловіка. І зіткнулись вони з Адонибезеком під Безеком, бились із ним та й побили Канаанїїв і Ферезіїв». Адоні-Везек, «господар Безека», втік і був схоплений, і йому відтяли великі пальці на руках і на ногах; він визнав, що сімдесят таких скалічених царів збирали крихти під його столом: «Як робив я, так і менї воздав Господь», — і його привели до Єрусалима, де він і помер. Ще раз Безек з'являється там, де Саул перелічив Ізраїль перед походом на допомогу Явісові Гілеадському."
    - "Саулів Безек — це Хірбет-Ібзік, руїни на дорозі, що спускається від Сихема до Бет-Шеана, приблизно за 20 км на північний схід від Наблуса, природний збірний пункт навпроти Явіса; Євсевій знав там два села під назвою Безек, за сімнадцять римських миль від Неаполя. Питання в тому, чи бій Юди відбувся на тому самому місці. Це місце далеко на півночі для походу південних племен, тому дехто шукав іншого Безека в самій землі Юди, у Тель-Безка (Хірбет-Безка) біля Гезера, або вважав назву спотвореною; інші приймають Ібзік і читають розповідь як ширший розмах походу. Тексти цього не вирішують. Хірбет-Ібзік лежить на півночі Західного берега, над долиною Йордану."
  es:
    - "Bezec es el escenario de la primera batalla del libro de los Jueces. Tras la muerte de Josué, Judá, con Simeón, subió contra los cananeos, y «de ellos hirieron en Bezec diez mil hombres. Y hallaron á Adoni-bezec en Bezec, y pelearon contra él: é hirieron al Cananeo y al Pherezeo». Adoni-bezec, «señor de Bezec», huyó y fue apresado, y le cortaron los pulgares de manos y pies; confesó que setenta reyes así mutilados habían recogido migajas bajo su mesa: «como yo hice, así me ha pagado Dios», y fue llevado a Jerusalén, donde murió. Vuelve a aparecer un Bezec cuando Saúl pasó revista a Israel antes de marchar a socorrer a Jabes de Galaad."
    - "El Bezec de Saúl es Khirbet Ibziq, una ruina en el camino que baja de Siquem a Betsán, a unos 20 km al nordeste de Nablus, un punto natural de concentración frente a Jabes; Eusebio conocía allí dos aldeas llamadas Bezec, a diecisiete millas romanas de Neápolis. La cuestión es si la batalla de Judá se libró en el mismo lugar. El sitio queda muy al norte para una campaña de las tribus meridionales, y por eso algunos han buscado otro Bezec en el propio territorio de Judá, en Tell Bezqa (Khirbet Bezqa), cerca de Gezer, o han pensado que el nombre es una corrupción; otros aceptan Ibziq y leen el relato como una campaña de mayor alcance. Los textos no lo deciden. Khirbet Ibziq se halla en el norte de Cisjordania, sobre el valle del Jordán."
  pt:
    - "Bezeque é o cenário da primeira batalha do livro de Juízes. Depois da morte de Josué, Judá, com Simeão, subiu contra os cananeus: “Eles feriram dez mil homens em Bezeque. Encontraram Adoni-Bezeque em Bezeque, e lutaram contra ele. Eles feriram os cananeus e os ferezeus”. Adoni-Bezeque, “senhor de Bezeque”, fugiu e foi capturado, e cortaram-lhe os polegares das mãos e dos pés; ele confessou que setenta reis assim mutilados haviam recolhido migalhas debaixo de sua mesa: “Assim como eu fiz, Deus me retribuiu”, e foi levado a Jerusalém e morreu ali. Uma Bezeque aparece mais uma vez, onde Saul contou Israel antes de marchar para socorrer Jabes-Gileade."
    - "A Bezeque de Saul é Khirbet Ibziq, uma ruína na estrada que desce de Siquém a Bete-Seã, cerca de 20 km a nordeste de Nablus, ponto natural de reunião diante de Jabes; Eusébio conhecia ali duas aldeias chamadas Bezeque, a dezessete milhas romanas de Neápolis. A questão é se a batalha de Judá foi travada no mesmo lugar. O local fica muito ao norte para uma campanha das tribos do sul, e por isso alguns procuraram outra Bezeque no próprio território de Judá, em Tell Bezqa (Khirbet Bezqa), perto de Gezer, ou pensaram que o nome fosse uma corrupção; outros aceitam Ibziq e leem a narrativa como uma varredura mais ampla. Os textos não decidem. Khirbet Ibziq fica no norte da Cisjordânia, acima do vale do Jordão."
  de:
    - "Besek ist der Schauplatz der ersten Schlacht im Buch der Richter. Nach dem Tod Josuas zog Juda mit Simeon gegen die Kanaaniter hinauf, „und sie schlugen zu Besek zehntausend Mann. Und fanden den Adoni-Besek zu Besek und stritten wider ihn und schlugen die Kanaaniter und Pheresiter“. Adoni-Besek, „Herr von Besek“, floh und wurde ergriffen, und man hieb ihm die Daumen und die großen Zehen ab; er bekannte, dass siebzig auf diese Weise verstümmelte Könige unter seinem Tisch Brocken aufgelesen hatten: „Wie ich nun getan habe, so hat mir Gott wieder vergolten“, und man brachte ihn nach Jerusalem, wo er starb. Ein Besek erscheint noch einmal, wo Saul Israel musterte, ehe er zum Entsatz von Jabesch in Gilead zog."
    - "Sauls Besek ist Khirbet Ibziq, eine Ruine an der Straße von Sichem hinab nach Bet-Schean, etwa 20 km nordöstlich von Nablus, ein natürlicher Sammelplatz gegenüber von Jabesch; Eusebius kannte dort zwei Dörfer namens Besek, siebzehn römische Meilen von Neapolis entfernt. Ob Judas Schlacht am selben Ort geschlagen wurde, ist die Frage. Der Ort liegt weit im Norden für einen Feldzug der südlichen Stämme, und manche haben deshalb ein anderes Besek in Judas eigenem Gebiet gesucht, bei Tell Bezqa (Khirbet Bezqa) nahe Geser, oder den Namen für eine Verderbnis gehalten; andere akzeptieren Ibziq und verstehen die Erzählung als weiter ausgreifenden Vorstoß. Die Texte entscheiden es nicht. Khirbet Ibziq liegt im nördlichen Westjordanland oberhalb des Jordantals."
  fr:
    - "Bézek est le théâtre de la première bataille du livre des Juges. Après la mort de Josué, Juda, avec Siméon, monta contre les Cananéens : « ils battirent dix mille hommes à Bézek. Ils trouvèrent Adoni-Bézek à Bézek ; ils l’attaquèrent, et ils battirent les Cananéens et les Phéréziens ». Adoni-Bézek, « seigneur de Bézek », prit la fuite et fut capturé, et on lui coupa les pouces des mains et des pieds ; il avoua que soixante-dix rois ainsi mutilés avaient ramassé des miettes sous sa table : « Dieu me rend ce que j’ai fait » ; il fut emmené à Jérusalem, où il mourut. Un Bézek apparaît encore une fois, là où Saül dénombra Israël avant de marcher au secours de Jabès en Galaad."
    - "Le Bézek de Saül est Khirbet Ibziq, une ruine sur la route qui descend de Sichem à Beth-Schean, à environ 20 km au nord-est de Naplouse, point de rassemblement naturel face à Jabès ; Eusèbe y connaissait deux villages nommés Bézek, à dix-sept milles romains de Néapolis. La question est de savoir si la bataille de Juda eut lieu au même endroit. Le site est très au nord pour une campagne des tribus du sud, et certains ont donc cherché un autre Bézek dans le pays même de Juda, à Tell Bezqa (Khirbet Bezqa) près de Guézer, ou ont pensé que le nom était corrompu ; d’autres acceptent Ibziq et lisent le récit comme une vaste incursion. Les textes ne tranchent pas. Khirbet Ibziq se trouve dans le nord de la Cisjordanie, au-dessus de la vallée du Jourdain."
  it:
    - "Bezec è la scena della prima battaglia del libro dei Giudici. Dopo la morte di Giosuè Giuda, con Simeone, salì contro i Cananei, «e sconfissero a Bezek diecimila uomini. E, trovato Adoni-Bezek a Bezek, l’attaccarono, e sconfissero i Cananei e i Ferezei». Adoni-Bezek, «signore di Bezek», fuggì e fu catturato, e gli furono tagliati i pollici delle mani e dei piedi; confessò che settanta re così mutilati avevano raccolto gli avanzi sotto la sua mensa: «Quello che ho fatto io, Iddio me lo rende»; fu condotto a Gerusalemme e vi morì. Un Bezec compare ancora una volta, dove Saul passò in rassegna Israele prima di marciare in soccorso di Iabes di Galaad."
    - "Il Bezec di Saul è Khirbet Ibziq, una rovina sulla strada che da Sichem scende a Beth-Shean, a circa 20 km a nord-est di Nablus, un naturale punto di raccolta di fronte a Iabes; Eusebio conosceva lì due villaggi chiamati Bezec, a diciassette miglia romane da Neapoli. Se la battaglia di Giuda sia stata combattuta nello stesso luogo è la questione. Il sito è molto a nord per una campagna delle tribù meridionali, e perciò alcuni hanno cercato un altro Bezec nel territorio stesso di Giuda, a Tell Bezqa (Khirbet Bezqa) presso Ghezer, o hanno pensato che il nome sia una corruzione; altri accettano Ibziq e leggono il racconto come un’avanzata più ampia. I testi non decidono. Khirbet Ibziq si trova nella Cisgiordania settentrionale, sopra la valle del Giordano."
  pl:
    - "Bezek jest sceną pierwszej bitwy w Księdze Sędziów. Po śmierci Jozuego Juda wraz z Symeonem wyruszył przeciw Kananejczykom, „a porazili z nich w Bezeku dziesięć tysięcy mężów. Bo naleźli Adonibezeka w Bezeku, i walczyli przeciwko niemu, a porazili Chananejczyka i Ferezejczyka”. Adoni-Bezek, „pan Bezeku”, uciekł i został pojmany, i obcięto mu kciuki u rąk i u nóg; wyznał, że siedemdziesięciu tak okaleczonych królów zbierało odrobiny pod jego stołem, „jakom czynił, tak mi oddał Bóg”, i został przyprowadzony do Jerozolimy, i tam umarł. Raz jeszcze pojawia się jakiś Bezek, gdzie Saul przeliczył Izraela, nim wyruszył na odsiecz Jabesz-Gilead."
    - "Bezek Saula to Chirbet Ibzik, ruina przy drodze z Sychem w dół do Bet-Szean, około 20 km na północny wschód od Nablusu, naturalne miejsce zbiórki naprzeciw Jabesz; Euzebiusz znał tam dwie wsie zwane Bezek, w odległości siedemnastu mil rzymskich od Neapolis. Pytanie brzmi, czy bitwa Judy rozegrała się w tym samym miejscu. Miejsce leży daleko na północy jak na wyprawę pokoleń południowych, toteż niektórzy szukali innego Bezeku w kraju samej Judy, w Tell Bezka (Chirbet Bezka) koło Gezer, albo uważali nazwę za zniekształconą; inni przyjmują Ibzik i odczytują opowieść jako szersze natarcie. Teksty tego nie rozstrzygają. Chirbet Ibzik leży w północnej części Zachodniego Brzegu, nad Doliną Jordanu."
  nl:
    - "Bezek is het toneel van de eerste veldslag in het boek Richteren. Na de dood van Jozua trok Juda, met Simeon, op tegen de Kanaänieten, “en zij sloegen hen bij Bezek, tien duizend man. En zij vonden Adoni-Bezek te Bezek, en streden tegen hem; en zij sloegen de Kanaänieten en de Ferezieten”. Adoni-Bezek, “heer van Bezek”, vluchtte en werd gevangen, en zijn duimen en grote tenen werden afgehouwen; hij bekende dat zeventig koningen die zo verminkt waren, kruimels hadden opgeraapt onder zijn tafel, “gelijk als ik gedaan heb, alzo heeft mij God vergolden”, en hij werd naar Jeruzalem gebracht en stierf daar. Nog eenmaal komt een Bezek voor, waar Saul Israël telde voordat hij optrok om Jabes in Gilead te ontzetten."
    - "Sauls Bezek is Khirbet Ibziq, een ruïne aan de weg van Sichem naar Beth-Sean, ongeveer 20 km ten noordoosten van Nablus, een natuurlijk verzamelpunt tegenover Jabes; Eusebius kende daar twee dorpen met de naam Bezek, op zeventien Romeinse mijlen van Neapolis. Of de slag van Juda op dezelfde plaats werd geleverd, is de vraag. De plaats ligt ver naar het noorden voor een veldtocht van de zuidelijke stammen, en sommigen hebben daarom elders in het eigen gebied van Juda naar een ander Bezek gezocht, bij Tell Bezqa (Khirbet Bezqa) nabij Gezer, of hebben de naam voor een verbastering gehouden; anderen aanvaarden Ibziq en lezen het verhaal als een bredere veldtocht. De teksten beslissen het niet. Khirbet Ibziq ligt in het noorden van de Westelijke Jordaanoever, boven de Jordaanvallei."
  cs:
    - "Bezek je dějištěm první bitvy v Knize soudců. Po Jozuově smrti vytáhl Juda se Simeonem proti Kananejcům, „a porazili z nich v Bezeku deset tisíc mužů. Nebo nalezše Adonibezeka v Bezeku, bojovali proti němu, a porazili Kananejského i Ferezejského“. Adonibezek, „pán Bezeku“, uprchl a byl chycen a byly mu uťaty palce na rukou i nohou; přiznal, že sedmdesát králů takto zmrzačených sbíralo drobty pod jeho stolem, „jakž jsem činil, tak odplatil mi Bůh“, a byl přiveden do Jeruzaléma a tam zemřel. Bezek se objevuje ještě jednou, kde Saul sčítal Izrael před tažením na pomoc Jábeši gileadskému."
    - "Saulův Bezek je Khirbet Ibziq, zřícenina na cestě ze Šekemu dolů do Bét-šanu, asi 20 km severovýchodně od Nábulusu, přirozené shromaždiště naproti Jábešu; Eusebios tam znal dvě vsi zvané Bezek, sedmnáct římských mil od Neapole. Otázkou je, zda byla Judova bitva svedena na témže místě. Místo leží příliš daleko na severu pro tažení jižních kmenů, a proto někteří hledali jiný Bezek v Judově vlastní zemi, v Tell Bezqa (Khirbet Bezqa) u Gezeru, nebo pokládali jméno za zkomolené; jiní přijímají Ibziq a čtou příběh jako širší tažení. Texty to nerozhodují. Khirbet Ibziq leží v severní části Západního břehu nad Jordánským údolím."
  sv:
    - "Besek är skådeplatsen för den första striden i Domarboken. Efter Josuas död drog Juda upp mot kananéerna tillsammans med Simeon, ”så att de slogo dem vid Besek, tio tusen man. Ty vid Besek träffade de på Adoni-Besek och stridde mot honom och slogo så kananéerna och perisséerna”. Adoni-Besek, ”Beseks herre”, flydde men greps, och hans tummar och stortår höggs av; han erkände att sjuttio konungar med avhuggna tummar och stortår hade hämtat smulor under hans bord: ”efter mina gärningar har Gud nu vedergällt mig”. Han fördes till Jerusalem och dog där. Ett Besek förekommer en gång till, där Saul mönstrade Israel innan han tågade för att undsätta Javesh i Gilead."
    - "Sauls Besek är Khirbet Ibziq, en ruin vid vägen från Shekem ner till Bet-Shean, omkring 20 km nordost om Nablus, en naturlig samlingsplats mitt emot Javesh; Eusebios kände två byar som hette Besek där, sjutton romerska mil från Neapolis. Frågan är om Judas strid stod på samma plats. Platsen ligger långt norrut för ett fälttåg av de södra stammarna, och därför har somliga sökt ett annat Besek i Judas eget land, vid Tell Bezqa (Khirbet Bezqa) nära Geser, eller ansett namnet vara en förvanskning; andra godtar Ibziq och läser berättelsen som en vidare framryckning. Texterna avgör det inte. Khirbet Ibziq ligger i norra Västbanken, ovanför Jordandalen."
  nb:
    - "Besek er skueplassen for det første slaget i Dommerboken. Etter Josvas død dro Juda sammen med Simeon opp mot kanaanittene, «de slo dem i Besek, ti tusen mann. I Besek traff de på Adoni-Besek og stred mot ham; de slo kana'anittene og ferisittene». Adoni-Besek, «Beseks herre», flyktet og ble grepet, og hans tommelfingrer og tommeltær ble hugget av; han bekjente at sytti konger som var lemlestet slik, hadde sanket smuler under hans bord, «som jeg gjorde, har Gud gjort mot mig igjen», og han ble ført til Jerusalem og døde der. En Besek dukker opp én gang til, der Saul mønstret Israel før han drog for å komme Jabesj-Gilead til unnsetning."
    - "Sauls Besek er Khirbet Ibziq, en ruin ved veien fra Sikem ned til Bet-Sjean, omtrent 20 km nordøst for Nablus, et naturlig samlingspunkt midt imot Jabesj; Eusebius kjente to landsbyer som het Besek der, sytten romerske mil fra Neapolis. Om Judas slag ble utkjempet på samme sted, er spørsmålet. Stedet ligger langt mot nord for et felttog av de sørlige stammene, og noen har derfor lett etter en annen Besek i Judas eget land, ved Tell Bezqa (Khirbet Bezqa) nær Geser, eller har ment at navnet er en forvanskning; andre godtar Ibziq og leser fortellingen som et videre streifetog. Tekstene avgjør det ikke. Khirbet Ibziq ligger på den nordlige Vestbredden, ovenfor Jordandalen."
  tl:
    - "Ang Bezec ang tagpuan ng unang labanan sa Aklat ng Mga Hukom. Pagkamatay ni Josue, sumampa ang Juda, kasama ang Simeon, laban sa mga Cananeo, at “sinaktan nila sa kanila sa Bezec ay sangpung libong lalake. … kanilang nasumpungan si Adoni-bezec sa Bezec: at siya'y nilabanan nila, at kanilang sinaktan ang mga Cananeo at ang mga Pherezeo”. Si Adoni-bezec, “panginoon ng Bezec”, ay tumakas at nahuli, at pinutol ang kaniyang mga hinlalaki sa kamay at paa; ipinahayag niyang pitumpung haring pinutulan ng gayon ang namulot ng mumo sa ilalim ng kaniyang hapag, “kung paano ang aking ginawa ay gayon ako pinaghigantihan ng Dios”, at dinala siya sa Jerusalem at doon namatay. Isang Bezec ang lumilitaw muli, kung saan binilang ni Saul ang Israel bago magmartsa upang iligtas ang Jabes-galaad."
    - "Ang Bezec ni Saul ay ang Khirbet Ibziq, isang guho sa daan mula Sichem pababa sa Beth-san, mga 20 km sa hilagang-silangan ng Nablus, natural na pook ng pagtitipon sa tapat ng Jabes; kilala ni Eusebio roon ang dalawang nayong tinatawag na Bezec, labimpitong milyang Romano mula sa Neapolis. Ang tanong ay kung doon din ipinaglaban ang labanan ng Juda. Malayo sa hilaga ang pook para sa kampanya ng mga liping timog, kaya naghanap ang ilan ng ibang Bezec sa sariling lupain ng Juda, sa Tell Bezqa (Khirbet Bezqa) malapit sa Gezer, o inakalang sira ang pangalan; tinatanggap naman ng iba ang Ibziq at binabasa ang kuwento bilang mas malawak na paglusob. Hindi ito napagpapasyahan ng mga teksto. Ang Khirbet Ibziq ay nasa hilagang West Bank, sa itaas ng libis ng Jordan."
  da:
    - "Bezek er skuepladsen for den første kamp i Dommerbogen. Efter Josvas død drog Juda sammen med Simeon op mod kananæerne, »og de sloge dem i Besek, ti Tusinde Mand. Og de fandt Adoni-Besek i Besek og strede imod ham, og de sloge Kananiterne og Feresiterne«. Adoni-Bezek, »Bezeks herre«, flygtede og blev grebet, og hans tommelfingre og storetæer blev hugget af; han tilstod, at halvfjerds konger, lemlæstet på samme måde, havde sanket smuler under hans bord, »som jeg har gjort, saa har Gud betalt mig«, og han blev ført til Jerusalem og døde dér. Et Bezek optræder endnu en gang, hvor Saul mønstrede Israel, før han drog for at undsætte Jabesj i Gilead."
    - "Sauls Bezek er Khirbet Ibziq, en ruin på vejen fra Sikem ned til Bet-Sjan, cirka 20 km nordøst for Nablus, et naturligt samlingssted over for Jabesj; Eusebios kendte to landsbyer ved navn Bezek dér, sytten romerske mil fra Neapolis. Om Judas kamp blev udkæmpet på samme sted, er spørgsmålet. Stedet ligger langt mod nord for et felttog fra de sydlige stammer, og nogle har derfor søgt et andet Bezek i Judas eget land, ved Tell Bezqa (Khirbet Bezqa) nær Gezer, eller har anset navnet for en fordrejning; andre accepterer Ibziq og læser fortællingen som et videre fremstød. Teksterne afgør det ikke. Khirbet Ibziq ligger i den nordlige del af Vestbredden, over Jordandalen."
  sr:
    - "Везек је поприште прве битке у Књизи о Судијама. После смрти Исуса Навина Јуда је са Симеуном кренуо на Хананеје, „и побише их у Везеку десет хиљада људи. Јер нађоше Адони-Везека у Везеку, и ударише на њ, и побише Хананеје и Ферезеје“. Адони-Везек, „господар Везека“, побегао је и био ухваћен, па су му одсекли палце на рукама и ногама; признао је да је седамдесет тако осакаћених царева купило остатке испод његовог стола и рекао: „како сам чинио, тако ми плати Бог“; одведен је у Јерусалим, где је и умро. Везек се појављује још једном, где је Саул пребројао Израиља пре него што је кренуо да ослободи Јавис Галадски."
    - "Саулов Везек је Хирбет Ибзик, рушевина на путу од Сихема надоле до Вет-Сана, око 20 км североисточно од Наблуса, природно сабиралиште насупрот Јависа; Јевсевије је тамо знао два села по имену Везек, седамнаест римских миља од Неапоља. Питање је да ли је Јудина битка вођена на истом месту. Налазиште је далеко на северу за поход јужних племена, па су неки зато тражили други Везек у самој Јудиној земљи, у Тел Безки (Хирбет Безка) код Гезера, или су име сматрали искварењем; други прихватају Ибзик и причу читају као шири замах. Текстови то не одлучују. Хирбет Ибзик лежи у северном делу Западне обале, изнад долине Јордана."
  hu:
    - "Bézek a Bírák könyvének első csatájának színhelye. Józsué halála után Júda Simeonnal együtt felvonult a kánaániak ellen, „és levágtak közülök Bézekben tízezer embert. És találák Adonibézeket Bézekben, és hadakozának ő ellene, és megverék a Kananeust és a Perizeust”. Adoni-Bézek („Bézek ura”) elfutott, de elfogták, és levágták a hüvelykujjait kezén és lábán; bevallotta, hogy hetven király, akit így megcsonkított, szedegetett az asztala alatt, „a mint én cselekedtem, úgy fizetett nékem az Isten”, majd Jeruzsálembe vitték, és ott meghalt. Bézek még egyszer előfordul, ott, ahol Saul megszámlálta Izráelt, mielőtt Jábés-Gileád felmentésére indult."
    - "Saul Bézekje Khirbet Ibziq, a Sikemből Bét-Seánba levezető út melletti rom, Nablusztól mintegy 20 km-re északkeletre, természetes gyülekezőhely Jábéssel szemben; Eusebius két Bézek nevű falut ismert ott, Neapolisztól tizenhét római mérföldre. A kérdés az, hogy Júda csatája ugyanott zajlott-e. A hely a déli törzsek hadjáratához túl messze van északon, ezért néhányan Júda saját földjén kerestek egy másik Bézeket, a Gézer közelében fekvő Tell Bezqán (Khirbet Bezqa), vagy a nevet torzulásnak vélték; mások elfogadják Ibziqot, és szélesebb körútként olvassák a történetet. A szövegek nem döntik el. Khirbet Ibziq Ciszjordánia északi részén fekszik, a Jordán-völgy fölött."
  fi:
    - "Besek on Tuomarien kirjan ensimmäisen taistelun näyttämö. Joosuan kuoleman jälkeen Juuda yhdessä Simeonin kanssa nousi kanaanilaisia vastaan, ”ja he voittivat heidät Besekissä — kymmenentuhatta miestä. Ja he kohtasivat Adoni-Besekin Besekissä ja taistelivat häntä vastaan ja voittivat kanaanilaiset ja perissiläiset”. Adoni-Besek, ”Besekin herra”, pakeni ja jäi kiinni, ja hänen peukalonsa ja isovarpaansa hakattiin pois; hän tunnusti, että seitsemänkymmentä niin silvottua kuningasta oli kerännyt muruja hänen pöytänsä alta: ”niinkuin minä olen tehnyt, niin on Jumala minulle maksanut”, ja hänet vietiin Jerusalemiin, ja hän kuoli siellä. Besek mainitaan vielä kerran, kun Saul luki Israelin ennen lähtöään vapauttamaan Jabes-Gileadia."
    - "Saulin Besek on Khirbet Ibziq, rauniokohde Sikemistä Bet-Seaniin laskevan tien varrella, noin 20 km Nablusista koilliseen, luonnollinen kokoontumispaikka Jabesia vastapäätä; Eusebios tunsi siellä kaksi Bezek-nimistä kylää, seitsemäntoista roomalaista mailia Neapolisista. Kysymys on, käytiinkö Juudan taistelu samassa paikassa. Paikka on kaukana pohjoisessa eteläisten heimojen sotaretkelle, ja siksi jotkut ovat etsineet toista Besekiä Juudan omasta maasta, Tell Bezqasta (Khirbet Bezqa) Geserin lähellä, tai pitäneet nimeä turmeltuneena; toiset hyväksyvät Ibziqin ja lukevat kertomuksen laajempana etenemisenä. Tekstit eivät ratkaise asiaa. Khirbet Ibziq sijaitsee Länsirannan pohjoisosassa, Jordanin laakson yläpuolella."
  vi:
    - "Bê-xéc là nơi diễn ra trận đánh đầu tiên trong sách Các Quan Xét. Sau khi Giô-suê qua đời, Giu-đa cùng với Si-mê-ôn đi lên đánh người Ca-na-an, “tại Bê-xéc họ đánh giết một vạn người. … Bê-xéc cũng có gặp A-đô-ni-Bê-xéc, bèn xông vào người, đánh bại dân Ca-na-an và dân Phê-rê-sít”. A-đô-ni-Bê-xéc, “chúa của Bê-xéc”, chạy trốn và bị bắt, bị chặt ngón cái của tay và chân; ông thú nhận rằng bảy mươi vua bị cắt như vậy đã lượm vụn dưới bàn ông, “Điều ta đã làm, Đức Chúa Trời lại báo ứng ta”, và ông bị dẫn đến Giê-ru-sa-lem và chết ở đó. Một Bê-xéc xuất hiện thêm một lần nữa, nơi Sau-lơ kiểm điểm Y-sơ-ra-ên trước khi tiến quân cứu Gia-be Ga-la-át."
    - "Bê-xéc của Sau-lơ là Khirbet Ibziq, một phế tích trên đường từ Si-chem xuống Bết-San, cách Nablus khoảng 20 km về phía đông bắc, một điểm tập kết tự nhiên đối diện Gia-be; Eusebius biết có hai làng tên Bezek ở đó, cách Nê-a-bô-li mười bảy dặm La Mã. Vấn đề là trận đánh của Giu-đa có diễn ra ở cùng nơi ấy không. Địa điểm này nằm quá xa về phía bắc đối với một chiến dịch của các chi phái phía nam, và vì thế có người đã tìm một Bê-xéc khác trong chính xứ của Giu-đa, tại Tell Bezqa (Khirbet Bezqa) gần Ghê-xe, hoặc cho rằng tên đã bị chép sai; những người khác chấp nhận Ibziq và đọc câu chuyện như một cuộc tiến quân rộng hơn. Các bản văn không quyết định được. Khirbet Ibziq nằm ở bắc Bờ Tây, phía trên thung lũng Giô-đanh."
  ro:
    - "Bezec este scena primei bătălii din cartea Judecătorilor. După moartea lui Iosua, Iuda, împreună cu Simeon, a urcat împotriva canaaniților, iar ei au ucis la Bezec zece mii de oameni. L-au găsit la Bezec pe Adoni-Bezec, s-au luptat cu el și i-au ucis pe canaaniți și pe periziți. Adoni-Bezec, „stăpânul Bezecului”, a fugit și a fost prins, și i s-au tăiat degetele mari de la mâini și de la picioare; el a mărturisit că șaptezeci de regi astfel schilodiți strânseseră firimituri sub masa lui, că Dumnezeu i-a răsplătit așa cum făcuse el, și a fost adus la Ierusalim și a murit acolo. Un Bezec apare încă o dată, unde Saul a numărat pe Israel înainte de a porni să izbăvească Iabeșul din Galaad."
    - "Bezecul lui Saul este Khirbet Ibziq, o ruină pe drumul care coboară de la Sihem spre Bet-Șan, la circa 20 km nord-est de Nablus, un loc firesc de adunare în fața Iabeșului; Eusebiu cunoștea acolo două sate numite Bezec, la șaptesprezece mile romane de Neapolis. Dacă bătălia lui Iuda a avut loc în același loc, aceasta este întrebarea. Locul este foarte la nord pentru o campanie a triburilor din sud, și de aceea unii au căutat un alt Bezec în ținutul lui Iuda însuși, la Tell Bezqa (Khirbet Bezqa) lângă Ghezer, sau au socotit numele o stricăciune; alții primesc Ibziq și citesc povestea ca pe o înaintare mai largă. Textele nu hotărăsc. Khirbet Ibziq se află în nordul Cisiordaniei, deasupra văii Iordanului."
  bg:
    - "Безек е мястото на първата битка в книга Съдии. След смъртта на Иисус Навин Юда заедно със Симеон излязъл срещу ханаанците „и поразиха от тях в Везек десет тисящи мъже. И намериха Адонивезека в Везек, и ратуваха против него, и поразиха Ханаанците и Ферезейците“. Адони-Везек, „господар на Безек“, побягнал и бил заловен и му отсекли палците на ръцете и на краката; той признал, че седемдесет така осакатени царе събирали трохи под трапезата му — „както аз направих така ми въздаде Бог“ — и бил отведен в Йерусалим и умрял там. Безек се появява още веднъж, където Саул преброил Израил, преди да тръгне да избави Явис Галаадски."
    - "Безек на Саул е Хирбет Ибзик, руина на пътя от Сихем надолу към Бет-Сан, на около 20 км североизточно от Наблус, естествено място за събиране срещу Явис; Евсевий познавал там две села на име Безек, на седемнадесет римски мили от Неапол. Въпросът е дали битката на Юда е била на същото място. То е далеч на север за поход на южните племена и затова някои търсят друг Безек в собствената земя на Юда, в Тел Безка (Хирбет Безка) близо до Гезер, или смятат името за повредено; други приемат Ибзик и четат разказа като по-широк поход. Текстовете не решават въпроса. Хирбет Ибзик лежи в северната част на Западния бряг, над долината на Йордан."
scripture:
