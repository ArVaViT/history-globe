# Overview article (ADR 0007). Mainstream facts only; this record is the Bezek of Judges 1; Saul's Bezek at Khirbet Ibziq is the leading candidate and the doubt about one or two Bezeks is stated; Eusebius' two villages are noted.
id: bezek
place: af48fdd
title:
  en: "Bezek"
  ru: "Везек"
body:
  en:
    - "Bezek is the scene of the first battle in the book of Judges. After Joshua's death Judah, with Simeon, went up against the Canaanites, “and they slew of them in Bezek ten thousand men. And they found Adoni-bezek in Bezek: and they fought against him, and they slew the Canaanites and the Perizzites”. Adoni-bezek, “lord of Bezek”, fled and was caught, and his thumbs and great toes were cut off; he confessed that seventy kings so maimed had gathered scraps under his table, “as I have done, so God hath requited me”, and he was brought to Jerusalem and died there. A Bezek appears once more, where Saul numbered Israel before marching to relieve Jabesh-gilead."
    - "Saul's Bezek is Khirbet Ibziq, a ruin on the road from Shechem down to Beth-shean, about 20 km north-east of Nablus, a natural muster point opposite Jabesh; Eusebius knew two villages called Bezek there, seventeen Roman miles from Neapolis. Whether Judah's battle was fought at the same place is the question. The site is far north for a campaign of the southern tribes, and some have therefore looked for another Bezek in Judah's own country, at Tell Bezqa (Khirbet Bezqa) near Gezer, or have thought the name a corruption; others accept Ibziq and read the story as a wider sweep. The texts do not decide it, and neither site has been excavated. Khirbet Ibziq lies in the northern West Bank, above the Jordan valley."
  ru:
    - "Везек — место первой битвы в книге Судей. После смерти Иисуса Навина Иуда с Симеоном пошёл на Хананеев, «и побили они из них в Везеке десять тысяч человек. В Везеке встретились они с Адони-Везеком, сразились с ним и разбили Хананеев и Ферезеев». Адони-Везек, «господин Везека», бежал и был пойман, и ему отсекли большие пальцы рук и ног; он признал, что семьдесят царей, так же изувеченных, собирали крохи под его столом: «как делал я, так и мне воздал Бог», и его привели в Иерусалим, где он умер. Везек встречается ещё раз, там, где Саул осмотрел Израиль перед походом на выручку Иависа Галаадского."
    - "Везек Саула — Хирбет-Ибзик, руина на дороге из Сихема вниз к Беф-Сану, примерно в 20 км к северо-востоку от Наблуса, естественное место сбора напротив Иависа; Евсевий знал там два селения по имени Везек, в семнадцати римских милях от Неаполя. Вопрос в том, была ли битва Иуды там же. Для похода южных колен место лежит далеко на севере, и потому одни искали другой Везек в собственной земле Иуды, в Телль-Безке (Хирбет-Безка) близ Газера, или считали имя испорченным; другие принимают Ибзик и читают рассказ как более широкий поход. Тексты этого не решают, и ни одно из мест не раскопано. Хирбет-Ибзик лежит на севере Западного берега, над долиной Иордана."
