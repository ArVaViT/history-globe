# Overview article (ADR 0007). Mainstream facts only; the gate is unlocated and its north-eastern position is given as the usual inference from Nehemiah and from the pools of Bethesda.
id: sheep-gate
place: aa3d425
title:
  en: "Sheep Gate"
  ru: "Овечьи ворота"
  uk: "Овечі ворота"
  es: "Puerta de las Ovejas"
  pt: "Porta das Ovelhas"
  de: "Schaftor"
  fr: "Porte des Brebis"
  it: "Porta delle Pecore"
  pl: "Brama Owcza"
  cs: "Ovčí brána"
  nl: "Schaapspoort"
body:
  en:
    - "The Sheep Gate was a gate in the north-eastern wall of Jerusalem beside the Temple, named, it is usually thought, for the sheep brought through it to the altar. Nothing of it has been found, and its place is inferred from Nehemiah's account of the walls: the priests built it, the circuit of repairs begins and ends at it, and it stood between the tower of Hananel and the tower of Meah on one side and the Temple's own gates and guards on the other. Most scholars therefore put it near the north-east corner of the Temple enclosure, roughly where the Lions' Gate (St Stephen's Gate) opens today, though the bounds of the city in the Persian period are themselves only partly known."
    - "“Then Eliashib the high priest rose up with his brethren the priests, and they builded the sheep gate; they sanctified it, and set up the doors of it; even unto the tower of Meah they sanctified it, unto the tower of Hananeel.” It is the only gate whose builders are the priests and the only one that is said to be sanctified. The list of repairs goes round the city and comes back: “between the going up of the corner unto the sheep gate repaired the goldsmiths and the merchants”. At the dedication of the wall the second choir walked past the gate of Ephraim, the old gate, the fish gate and the two towers “even unto the sheep gate: and they stood still in the prison gate”, that is, at the Temple."
    - "John places the pool of Bethesda “by the sheep market”; the Greek says only “by the sheep”, and most take it to mean the gate, as the Synodal Bible reads it. There Jesus healed on a sabbath the man who had been ill thirty-eight years. The pools were found from 1888 beside the church of St Anne, just inside the Lions' Gate: two large rock-cut reservoirs divided by a partition, which with their porticoes explain the “five porches”, and beside them a later healing shrine and a Byzantine church. Their position fixes the Sheep Gate of the first century near the same corner. The Lions' Gate itself is Ottoman, of the 1530s; the Via Dolorosa begins inside it."
  ru:
    - "Овечьи ворота — ворота в северо-восточной стене Иерусалима, рядом с Храмом; названы, как обычно считают, по овцам, которых вели через них к жертвеннику. От них ничего не найдено, и место их выводят из рассказа Неемии о стенах: их строили священники, обход починки с них начинается и ими кончается, и стояли они между башнями Хананела и Меа с одной стороны и воротами и стражей самого Храма с другой. Поэтому большинство учёных помещают их у северо-восточного угла храмовой ограды, примерно там, где сегодня открываются Львиные ворота (ворота святого Стефана), хотя границы города персидского времени сами известны лишь отчасти."
    - "«И встал Елияшив, великий священник, и братья его священники и построили Овечьи ворота: они освятили их и вставили двери их, и от башни Меа освятили их до башни Хананела». Это единственные ворота, которые строят священники, и единственные, о которых сказано, что их освятили. Список починок обходит город и возвращается: «между угольным жильем до ворот Овечьих чинили серебряники и торговцы». При освящении стены второй хор прошёл мимо ворот Ефремовых, Старых, Рыбных и двух башен «к Овечьим воротам, и остановились у ворот Темничных», то есть у Храма."
    - "Иоанн помещает купальню Вифезда «у Овечьих ворот»: в греческом сказано лишь «у овечьих», и Синодальный перевод, как и большинство толкователей, понимает это как ворота. Там Иисус в субботу исцелил человека, болевшего тридцать восемь лет. Купальни нашли с 1888 года рядом с церковью святой Анны, сразу за Львиными воротами: два больших высеченных в скале водоёма, разделённых перемычкой, которые вместе с портиками объясняют «пять крытых ходов», а подле них — позднейшее святилище исцелений и византийская церковь. Их положение закрепляет Овечьи ворота I века у того же угла. Сами Львиные ворота — османские, 1530-х годов; за ними начинается Виа Долороза."
  uk:
    - "Овечі ворота були брамою в північно-східному мурі Єрусалима біля Храму; їхню назву, як зазвичай вважають, дали вівці, яких проводили крізь них до жертовника. Від них нічого не знайдено, і їхнє місце виводять із розповіді Неемії про мури: збудували їх священики, коло лагодження починається й закінчується ними, а стояли вони між вежею Хананела та вежею Меа з одного боку й власними брамами та сторожами Храму з другого. Тому більшість учених ставить їх біля північно-східного рогу огорожі Храму, приблизно там, де сьогодні відкриваються Левові ворота (ворота святого Стефана), хоча межі міста в перський період самі відомі лише частково."
    - "«І встав Елїяшив первосьвященник, і брати його сьвященники, і збудували Овечі ворота; вони посьвятили їх і вставили двері їх, і посьвятили їх від башти Меа до башти Хананела.» Це єдині ворота, чиїми будівничими були священики, і єдині, про які сказано, що їх посвятили. Перелік лагодження обходить місто й повертається: «між наріжним будинком до Овечих воріт лагодили золотарі та крамарі». Під час освячення муру другий хор пройшов повз Ефраїмові ворота, старі ворота, Рибні ворота та дві башти «до Овечих воріт, і спинились коло воріт Темничних», тобто біля Храму."
    - "Іван розташовує купіль Віфезда біля овечої (так у грецькому тексті), і більшість розуміє це як ворота, як і читає Кулішів переклад: «коло Овечих воріт». Там Ісус у суботу зцілив чоловіка, який хворів тридцять вісім років. Купелі виявили 1888 року поруч із церквою святої Анни, одразу всередині Левових воріт: два великі вирубані в скелі водойми, розділені перегородкою, які разом із портиками пояснюють п'ять ходників з Івана, а поряд — пізніша цілюща святиня й візантійська церква. Їхнє положення визначає Овечі ворота I ст. біля того самого рогу. Самі Левові ворота османські, 1530-х років; Хресна дорога починається за ними."
  es:
    - "La Puerta de las Ovejas era una puerta en la muralla nororiental de Jerusalén junto al templo, llamada, según se piensa por lo común, por las ovejas que se llevaban por ella al altar. No se ha hallado nada de ella, y su lugar se infiere del relato de Nehemías sobre las murallas: la construyeron los sacerdotes, el circuito de reparaciones comienza y termina en ella, y se alzaba entre la torre de Hananel y la torre de Meá por un lado y las propias puertas y guardias del templo por el otro. La mayoría de los estudiosos la sitúa por tanto cerca de la esquina nororiental del recinto del templo, aproximadamente donde se abre hoy la Puerta de los Leones (Puerta de San Esteban), aunque los límites de la ciudad en el período persa son solo en parte conocidos."
    - "«Y levantóse Eliasib el gran sacerdote con sus hermanos los sacerdotes, y edificaron la puerta de las Ovejas. Ellos aparejaron y levantaron sus puertas hasta la torre de Meah, aparejáronla hasta la torre de Hananeel». Es la única puerta cuyos constructores son los sacerdotes y la única de la que se dice que fue consagrada. La lista de reparaciones da la vuelta a la ciudad y regresa: «Y entre la sala de la esquina hasta la puerta de las Ovejas, restauraron los plateros y los tratantes». En la dedicación del muro el segundo coro pasó junto a la puerta de Efraín, la puerta vieja, la puerta del Pescado y las dos torres «hasta la puerta de las Ovejas: y pararon en la puerta de la Cárcel», es decir, en el templo."
    - "Juan sitúa el estanque de Betesda «á la puerta del ganado»; el griego dice solo «junto a las ovejas», y la mayoría entiende que se trata de la puerta, como la lee la Biblia sinodal. Allí Jesús sanó en sábado al hombre que llevaba treinta y ocho años enfermo. Los estanques se hallaron desde 1888 junto a la iglesia de Santa Ana, justo dentro de la Puerta de los Leones: dos grandes depósitos excavados en la roca divididos por un tabique, que con sus pórticos explican los «cinco portales», y junto a ellos un santuario de curación posterior y una iglesia bizantina. Su posición sitúa la Puerta de las Ovejas del siglo I cerca de la misma esquina. La propia Puerta de los Leones es otomana, de la década de 1530; la Vía Dolorosa comienza dentro de ella."
  pt:
    - "A Porta das Ovelhas era uma porta na muralha nordeste de Jerusalém, junto ao Templo, assim chamada, ao que se pensa, pelas ovelhas que passavam por ela rumo ao altar. Nada dela foi encontrado, e seu lugar se infere do relato de Neemias sobre as muralhas: os sacerdotes a construíram, o circuito dos reparos começa e termina nela, e ficava entre a torre de Hananel e a torre de Meá de um lado e as portas e guardas do próprio Templo do outro. A maioria dos estudiosos a põe por isso perto do canto nordeste do recinto do Templo, mais ou menos onde hoje se abre a Porta dos Leões (Porta de Santo Estêvão), embora os limites da cidade no período persa sejam eles mesmos só em parte conhecidos."
    - "“Então Eliasibe, o sumo sacerdote, levantou-se com os seus irmãos, os sacerdotes, e edificaram a Porta das Ovelhas. Eles a consagraram e assentaram as suas portas. Eles a consagraram até a torre de Meá, e até a torre de Hananel.” É a única porta cujos construtores são os sacerdotes e a única dita consagrada. A lista dos reparos dá a volta na cidade e retorna: “Entre a subida do canto e a Porta das Ovelhas, os ourives e os mercadores fizeram reparos”. Na dedicação do muro, o segundo coro passou pela Porta de Efraim, a Porta Velha, a Porta dos Peixes e as duas torres “até a Porta das Ovelhas; e eles pararam na Porta da Guarda”, isto é, no Templo."
    - "João situa o tanque de Betesda “junto ao mercado de ovelhas”, como lê a King James; o grego diz apenas “junto às ovelhas”, e a maioria entende que se trata da porta, como lê a Bíblia Sinodal. Ali Jesus curou num sábado o homem que estava doente havia trinta e oito anos. Os tanques foram descobertos a partir de 1888 ao lado da igreja de Santa Ana, logo dentro da Porta dos Leões: dois grandes reservatórios escavados na rocha, divididos por uma divisória, que com seus pórticos explicam os “cinco pórticos”, e ao lado deles um santuário de cura posterior e uma igreja bizantina. Sua posição fixa a Porta das Ovelhas do século I perto do mesmo canto. A própria Porta dos Leões é otomana, da década de 1530; a Via Dolorosa começa dentro dela."
  de:
    - "Das Schaftor war ein Tor in der nordöstlichen Mauer Jerusalems neben dem Tempel, vermutlich nach den Schafen benannt, die durch es zum Altar gebracht wurden. Nichts davon wurde gefunden, und seine Lage wird aus Nehemias Bericht über die Mauern erschlossen: Die Priester bauten es, der Umlauf der Ausbesserungen beginnt und endet bei ihm, und es lag zwischen dem Turm Hananeel und dem Turm Mea auf der einen Seite und den eigenen Toren und Wachen des Tempels auf der anderen. Die meisten Gelehrten setzen es daher nahe der Nordostecke des Tempelbezirks an, ungefähr dort, wo sich heute das Löwentor (Stephanstor) öffnet, obwohl die Grenzen der Stadt in persischer Zeit selbst nur teilweise bekannt sind."
    - "„Und Eljasib, der Hohepriester, machte sich auf mit seinen Brüdern, den Priestern und bauten das Schaftor. Sie heiligten es und setzten seine Türen ein. Sie heiligten es aber bis an den Turm Mea, bis an den Turm Hananeel.“ Es ist das einzige Tor, dessen Erbauer die Priester sind, und das einzige, von dem es heißt, es sei geheiligt worden. Die Liste der Ausbesserungen geht um die Stadt und kehrt zurück: „Und zwischen dem Söller und dem Schaftor bauten die Goldschmiede und die Krämer.“ Bei der Einweihung der Mauer ging der zweite Chor am Tor Ephraim, am alten Tor, am Fischtor und an den beiden Türmen vorbei „bis an das Schaftor, und blieben stehen im Kerkertor“, das heißt am Tempel."
    - "Johannes setzt den Teich Betesda „bei dem Schaftor“; das Griechische sagt nur „bei den Schafen“, die meisten verstehen darunter das Tor, wie es die Synodalübersetzung liest. Dort heilte Jesus an einem Sabbat den Mann, der achtunddreißig Jahre krank gewesen war. Die Teiche wurden ab 1888 neben der Sankt-Anna-Kirche gefunden, gleich innerhalb des Löwentors: zwei große, in den Fels gehauene Becken, durch eine Trennwand geteilt, die mit ihren Säulenhallen die „fünf Hallen“ erklären, und daneben ein späteres Heilheiligtum und eine byzantinische Kirche. Ihre Lage legt das Schaftor des 1. Jahrhunderts nahe derselben Ecke fest. Das Löwentor selbst ist osmanisch, aus den 1530er Jahren; die Via Dolorosa beginnt innerhalb davon."
  fr:
    - "La porte des Brebis était une porte du mur nord-est de Jérusalem, à côté du Temple, ainsi nommée, pense-t-on d’ordinaire, d’après les brebis qui la franchissaient pour l’autel. Rien n’en a été trouvé, et son emplacement se déduit du récit des murs chez Néhémie : les prêtres la bâtirent, le circuit des réparations commence et finit par elle, et elle se trouvait entre la tour de Hananeel et la tour de Méa d’un côté et les propres portes et gardes du Temple de l’autre. La plupart des spécialistes la placent donc près de l’angle nord-est de l’enceinte du Temple, à peu près où s’ouvre aujourd’hui la porte des Lions (porte Saint-Étienne), bien que les limites de la ville à l’époque perse ne soient elles-mêmes que partiellement connues."
    - "« Éliaschib, le souverain sacrificateur, se leva avec ses frères, les sacrificateurs, et ils bâtirent la porte des brebis. Ils la consacrèrent et en posèrent les battants ; ils la consacrèrent, depuis la tour de Méa jusqu’à la tour de Hananeel. » C’est la seule porte dont les bâtisseurs sont les prêtres et la seule dite consacrée. La liste des réparations fait le tour de la ville et revient : « Les orfèvres et les marchands travaillèrent entre la chambre haute du coin et la porte des brebis ». À la dédicace du mur, le second chœur passa devant la porte d’Éphraïm, la vieille porte, la porte des poissons et les deux tours « jusqu’à la porte des brebis. Et l’on s’arrêta à la porte de la prison », c’est-à-dire au Temple."
    - "Jean place la piscine de Béthesda « près de la porte des brebis » ; le grec dit seulement « près des brebis », et la plupart y voient la porte, comme le lisent la Bible synodale russe et Louis Segond. Là Jésus guérit un jour de sabbat l’homme malade depuis trente-huit ans. Les bassins furent découverts dès 1888 à côté de l’église Sainte-Anne, juste à l’intérieur de la porte des Lions : deux grands réservoirs taillés dans le roc, divisés par une cloison, qui avec leurs portiques expliquent les « cinq portiques », et à côté un sanctuaire de guérison postérieur et une église byzantine. Leur position fixe la porte des Brebis du Ier siècle près du même angle. La porte des Lions elle-même est ottomane, des années 1530 ; la Via Dolorosa commence à l’intérieur."
  it:
    - "La Porta delle Pecore era una porta nelle mura nord-orientali di Gerusalemme accanto al Tempio, chiamata, si pensa di solito, dalle pecore che vi passavano per l’altare. Nulla di essa è stato trovato, e il suo posto è dedotto dal racconto di Neemia sulle mura: la costruirono i sacerdoti, il giro delle riparazioni comincia e finisce con essa, e si trovava tra la torre di Hananeel e la torre di Mea da un lato e le porte e le guardie proprie del Tempio dall’altro. La maggior parte degli studiosi la pone perciò vicino all’angolo nord-orientale del recinto del Tempio, all’incirca dove si apre oggi la Porta dei Leoni (Porta di Santo Stefano), benché i confini della città in epoca persiana siano essi stessi noti solo in parte."
    - "«Eliascib, sommo sacerdote, si levò coi suoi fratelli sacerdoti e costruirono la porta delle Pecore; la consacrarono e vi misero le sue imposte; continuarono a costruire fino alla torre di Mea, che consacrarono, e fino alla Torre di Hananeel.» È l’unica porta i cui costruttori sono i sacerdoti e l’unica di cui si dice che fu consacrata. L’elenco delle riparazioni gira attorno alla città e ritorna: «E gli orefici e i mercanti lavorarono alle riparazioni fra la salita dell’angolo e la porta delle Pecore». Alla dedicazione delle mura il secondo coro passò accanto alla porta d’Efraim, alla porta Vecchia, alla porta dei Pesci e alle due torri «fino alla porta delle Pecore; e il coro si fermò alla porta della Prigione», cioè al Tempio."
    - "Giovanni colloca la vasca di Betesda «presso la porta delle Pecore»; il greco dice solo «presso le pecore», e i più vi intendono la porta, come legge la Bibbia sinodale. Là Gesù guarì in giorno di sabato l’uomo che era infermo da trentotto anni. Le vasche furono trovate dal 1888 accanto alla chiesa di Sant’Anna, appena all’interno della Porta dei Leoni: due grandi cisterne scavate nella roccia divise da un tramezzo, che con i loro portici spiegano i «cinque portici», e accanto ad esse un successivo santuario di guarigione e una chiesa bizantina. La loro posizione fissa la Porta delle Pecore del I secolo vicino allo stesso angolo. La stessa Porta dei Leoni è ottomana, degli anni 1530; la Via Dolorosa comincia al suo interno."
  pl:
    - "Brama Owcza była bramą w północno-wschodnim murze Jerozolimy obok Świątyni, nazwaną, jak zwykle sądzi się, od owiec prowadzonych przez nią do ołtarza. Nic z niej nie odnaleziono, a jej miejsce wnioskuje się z relacji Nehemiasza o murach: zbudowali ją kapłani, obchód napraw zaczyna się i kończy przy niej, a stała między wieżą Chananeel i wieżą Mea po jednej stronie a własnymi bramami i strażami Świątyni po drugiej. Większość uczonych umieszcza ją więc blisko północno-wschodniego narożnika obrębu świątynnego, mniej więcej tam, gdzie dziś otwiera się Brama Lwów (Brama św. Szczepana), choć granice miasta w okresie perskim są same tylko częściowo znane."
    - "„Potem powstał Elijasyb, kapłan najwyższy, i bracia jego kapłani, i budowali bramę owczą. I zbudowali ją, i przyprawili wrota do niej; aż do wieży Mea zbudowali ją, i aż do wieży Chananeel.” Jest to jedyna brama, której budowniczymi są kapłani, i jedyna, o której hebrajski tekst mówi, że została poświęcona (Biblia Gdańska ma tu „zbudowali ją”). Lista napraw obchodzi miasto i wraca: „A między salą narożną aż do bramy owczej poprawiali złotnicy i kupcy”. Przy poświęceniu muru drugi chór szedł obok bramy Efraima, starej bramy, bramy rybnej i dwóch wież „aż do bramy owczej. I stanął u bramy straży”, to znaczy przy Świątyni."
    - "Jan umieszcza sadzawkę Betesda tak: „A była w Jeruzalemie przy owczej bramie sadzawka, którą zowią po żydowsku Betesda, mająca pięć ganków”; grecki tekst mówi tylko „przy owcach”, a większość rozumie przez to bramę, jak czyta Biblia synodalna. Tam Jezus uzdrowił w szabat człowieka chorego od trzydziestu ośmiu lat. Sadzawki odnaleziono od 1888 roku obok kościoła św. Anny, tuż za Bramą Lwów: dwa duże wykute w skale zbiorniki rozdzielone przegrodą, które wraz z portykami wyjaśniają „pięć ganków”, a obok nich późniejsze sanktuarium uzdrowień i kościół bizantyński. Ich położenie wskazuje Bramę Owczą z I wieku w pobliżu tego samego narożnika. Sama Brama Lwów jest osmańska, z lat 1530.; Via Dolorosa zaczyna się za nią."
  cs:
    - "Ovčí brána byla brána v severovýchodní hradbě Jeruzaléma vedle Chrámu, pojmenovaná, jak se obvykle soudí, po ovcích přiváděných jí k oltáři. Nic z ní nebylo nalezeno a její místo se odvozuje z Nehemjášova líčení hradeb: stavěli ji kněží, okruh oprav u ní začíná a končí a stála mezi věží Chananeel a věží Mea na jedné straně a vlastními chrámovými branami a stráží na druhé. Většina učenců ji proto klade k severovýchodnímu rohu chrámového okrsku, zhruba tam, kde se dnes otevírá Lví brána (brána svatého Štěpána), ač hranice města v perské době jsou známy jen částečně."
    - "„Tedy povstal Eliasib, kněz nejvyšší, a příbuzní jeho kněží, a stavěli bránu bravnou, (tiť jsou ji vystavěli, a zavěsili vrata její, až k věži Mea vystavěli ji), až k věži Chananeel.“ Je to jediná brána, jejímiž staviteli jsou kněží, a jediná, o níž se praví, že byla posvěcena. Seznam oprav obchází město a vrací se: „mezi palácem úhlovým až do brány bravné opravovali zlatníci a kupci“. Při vysvěcení hradby šel druhý sbor kolem brány Efraim, staré brány, rybné brány a obou věží „až k bráně bravné. I zastavili se v bráně stráže“, tedy u Chrámu."
    - "Jan klade rybník Bethesda „u brány bravné“; v King James Version stojí „by the sheep market“, řecky jen „u ovčí“, a většina v tom vidí bránu, jak čte synodální Bible. Tam Ježíš v sobotu uzdravil muže nemocného třicet osm let. Rybníky byly nalezeny od roku 1888 vedle kostela svaté Anny, těsně uvnitř Lví brány: dvě velké skalní nádrže oddělené příčkou, které se svými podloubími vysvětlují „patero přístřeší“, a vedle nich pozdější léčebná svatyně a byzantský kostel. Jejich poloha určuje Ovčí bránu 1. století poblíž téhož rohu. Samotná Lví brána je osmanská, z 30. let 16. století; Via Dolorosa začíná uvnitř ní."
  nl:
    - "De Schaapspoort was een poort in de noordoostelijke muur van Jeruzalem naast de tempel, genoemd, naar men meestal denkt, naar de schapen die erdoor naar het altaar werden gebracht. Er is niets van gevonden, en haar plaats wordt afgeleid uit Nehemia’s verslag van de muren: de priesters bouwden haar, de reeks herstellingen begint en eindigt erbij, en ze stond tussen de toren van Hananeel en de toren van Mea aan de ene kant en de eigen poorten en wachtposten van de tempel aan de andere. De meeste geleerden plaatsen haar daarom bij de noordoosthoek van het tempelterrein, ongeveer waar nu de Leeuwenpoort (Stefanuspoort) opent, al zijn de grenzen van de stad in de Perzische tijd zelf maar gedeeltelijk bekend."
    - "“En Eljasib, de hogepriester, maakte zich op met zijn broederen, de priesteren, en zij bouwden de Schaapspoort; zij heiligden ze, en richtten haar deuren op; ja, zij heiligden ze tot aan den toren Mea, tot aan den toren Hananeel.” Het is de enige poort waarvan de bouwers priesters zijn en de enige die gewijd heet. De lijst van herstellingen gaat rond de stad en komt terug: “En tussen de opperzaal van het punt tot de Schaapspoort toe, verbeterden de goudsmeden en de kruideniers”. Bij de inwijding van de muur liep het tweede koor langs de poort van Efraïm, de oude poort, de vispoort en de twee torens “tot aan de Schaapspoort, en zij bleven staan in de Gevangenpoort”, dat is bij de tempel."
    - "Johannes plaatst het bad van Bethesda “aan de Schaapspoort” (de King James Version heeft “by the sheep market”); het Grieks zegt alleen “bij de schapen”, en de meesten verstaan er de poort onder, zoals ook de Synodale Bijbel het leest. Daar genas Jezus op een sabbat de man die achtendertig jaar ziek was. De baden werden vanaf 1888 gevonden naast de Sint-Annakerk, vlak binnen de Leeuwenpoort: twee grote uit de rots gehouwen reservoirs, gescheiden door een tussenmuur, die met hun zuilengangen de “vijf zalen” verklaren, en ernaast een latere genezingsplaats en een Byzantijnse kerk. Hun ligging plaatst de Schaapspoort van de 1e eeuw bij dezelfde hoek. De Leeuwenpoort zelf is Ottomaans, uit de jaren 1530; de Via Dolorosa begint erbinnen."
