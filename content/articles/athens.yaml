body:
  en:
    - "Athens lies in the plain of Attica around the rock of the Acropolis, about 8 km from its harbour at Piraeus. The Acropolis was lived on from the Neolithic, and in the thirteenth century BC it was a Mycenaean stronghold. Solon reformed the laws in 594 BC, and the reforms of Cleisthenes in 508–507 BC laid the foundation of the Athenian democracy."
    - "Athens helped defeat Persia at Marathon in 490 BC; ten years later the Persians burned the Acropolis, and the Greek fleet won at Salamis. Under Pericles the Parthenon was built between 447 and 432 BC. Athens lost the Peloponnesian War to Sparta in 404 BC, and in 399 BC it put Socrates to death. Plato's Academy, Aristotle's Lyceum and the schools of the Stoics and Epicureans made it the home of philosophy. Sulla stormed the city in 86 BC, yet under Rome it remained a centre of learning, and Hadrian completed the temple of Olympian Zeus."
    - "Paul came to Athens from Beroea and waited there for Silas and Timothy. Stirred by the city full of idols, he argued in the synagogue and daily in the agora. Epicurean and Stoic philosophers brought him to the Areopagus, where he spoke of an altar to an unknown god. A few believed, among them Dionysius the Areopagite and a woman named Damaris; a later bishop of Corinth names Dionysius the first bishop of Athens. Eusebius writes that Quadratus and Aristides, whom Jerome calls an Athenian philosopher, addressed defences of the Christian faith to Hadrian."
    - "In AD 267 the Heruli sacked the city, and a smaller wall was then built around its centre. In the fourth century Basil the Great and Gregory of Nazianzus studied there, as did the future emperor Julian. Alaric's Goths overran Greece in 395–396; what befell Athens is told differently by ancient writers. Through the fifth century a Neoplatonist school still taught there, led by Proclus until his death in 485."
  ru:
    - "Афины лежат на Аттической равнине вокруг скалы Акрополя, примерно в 8 км от своей гавани Пирея. На Акрополе жили уже в эпоху неолита, а в XIII веке до н. э. здесь стояла микенская крепость. Солон преобразовал законы в 594 г. до н. э., а реформы Клисфена 508–507 гг. до н. э. положили начало афинской демократии."
    - "Афины помогли разбить персов при Марафоне в 490 г. до н. э.; через десять лет персы сожгли Акрополь, а греческий флот победил при Саламине. При Перикле в 447–432 гг. до н. э. был построен Парфенон. В 404 г. до н. э. Афины проиграли Спарте Пелопоннесскую войну, а в 399 г. до н. э. казнили Сократа. Академия Платона, Ликей Аристотеля, школы стоиков и эпикурейцев сделали город родиной философии. В 86 г. до н. э. Афины взял штурмом Сулла, но и под властью Рима они остались средоточием учёности, а Адриан достроил храм Зевса Олимпийского."
    - "Павел пришёл в Афины из Верии и ждал здесь Силу и Тимофея. Возмущённый тем, что город полон идолов, он рассуждал в синагоге и каждый день на площади. Эпикурейские и стоические философы привели его в Ареопаг, где он говорил о жертвеннике неведомому Богу. Уверовали немногие, и среди них Дионисий Ареопагит и женщина, именем Дамарь; позднейший епископ Коринфа называет Дионисия первым епископом Афин. Евсевий пишет, что Кодрат и Аристид, которого Иероним называет афинским философом, обратились к Адриану с апологиями христианской веры."
    - "В 267 г. н. э. город разграбили герулы, и после этого центр обнесли меньшей стеной. В IV веке здесь учились Василий Великий и Григорий Богослов, а также будущий император Юлиан. В 395–396 гг. готы Алариха прошли по Греции; о том, что постигло Афины, древние писатели рассказывают по-разному. Весь V век здесь ещё учила неоплатоническая школа, которую до своей смерти в 485 г. возглавлял Прокл."
  uk:
    - "Афіни лежать на рівнині Аттики навколо скелі Акрополя, приблизно за 8 км від порту Пірей. Акрополь був заселений ще з неоліту, а в XIII столітті до н. е. був мікенською твердинею. Солон реформував закони в 594 р. до н. е., а реформи Клісфена в 508–507 рр. до н. е. заклали основу афінської демократії."
    - "Афіни допомогли розбити Персію при Марафоні в 490 р. до н. е.; десять років потому перси спалили Акрополь, а грецький флот переміг при Саламіні. За Перікла між 447 і 432 рр. до н. е. збудували Парфенон. Афіни програли Пелопоннеську війну Спарті у 404 р. до н. е., а в 399 р. до н. е. стратили Сократа. Академія Платона, Лікей Арістотеля та школи стоїків і епікурейців зробили їх домівкою філософії. Сулла взяв місто штурмом у 86 р. до н. е., проте за Рима воно лишалося осередком науки, і Адріан завершив храм Зевса Олімпійського."
    - "Павло прийшов до Афін із Верії і чекав там на Силу й Тимофія. Обурений містом, повним ідолів, він сперечався в синагозі й щодня на агорі. Філософи-епікурейці та стоїки привели його на Ареопаг, де він говорив про жертовник невідомому богові. Декотрі увірували, серед них Діонісій Ареопагіт і жінка на ймення Дамара; пізніший єпископ Коринта називає Діонісія першим єпископом Афін. Євсевій пише, що Кодрат і Арістід, якого Єронім називає афінським філософом, адресували Адріанові захисні твори на користь християнської віри."
    - "У 267 р. н. е. герули пограбували місто, і навколо його центру збудували менший мур. У IV столітті там навчалися Василій Великий і Григорій Богослов, як і майбутній імператор Юліан. Готи Аларіха перебігли Елладу в 395–396 рр.; що сталося з Афінами, давні автори розповідають по-різному. Протягом V століття там ще викладала неоплатонічна школа, яку до своєї смерті в 485 році очолював Прокл."
  es:
    - "Atenas se halla en la llanura del Ática en torno a la roca de la Acrópolis, a unos 8 km de su puerto en El Pireo. La Acrópolis estuvo habitada desde el Neolítico, y en el siglo XIII a. C. fue una fortaleza micénica. Solón reformó las leyes en 594 a. C., y las reformas de Clístenes en 508–507 a. C. sentaron la base de la democracia ateniense."
    - "Atenas ayudó a derrotar a Persia en Maratón en 490 a. C.; diez años después los persas quemaron la Acrópolis, y la flota griega venció en Salamina. Bajo Pericles se construyó el Partenón entre 447 y 432 a. C. Atenas perdió la guerra del Peloponeso ante Esparta en 404 a. C., y en 399 a. C. dio muerte a Sócrates. La Academia de Platón, el Liceo de Aristóteles y las escuelas de los estoicos y epicúreos hicieron de ella la patria de la filosofía. Sila tomó la ciudad al asalto en 86 a. C., y sin embargo bajo Roma siguió siendo un centro de saber, y Adriano completó el templo de Zeus Olímpico."
    - "Pablo llegó a Atenas desde Berea y esperó allí a Silas y a Timoteo. Movido por la ciudad llena de ídolos, discutía en la sinagoga y cada día en el ágora. Filósofos epicúreos y estoicos lo llevaron al Areópago, donde habló de un altar a un dios desconocido. Unos pocos creyeron, entre ellos Dionisio el Areopagita y una mujer llamada Dámaris; un obispo posterior de Corinto nombra a Dionisio el primer obispo de Atenas. Eusebio escribe que Cuadrato y Arístides, a quien Jerónimo llama filósofo ateniense, dirigieron a Adriano defensas de la fe cristiana."
    - "En 267 d. C. los hérulos saquearon la ciudad, y se construyó entonces una muralla más pequeña en torno a su centro. En el siglo IV estudiaron allí Basilio Magno y Gregorio Nacianceno, así como el futuro emperador Juliano. Los godos de Alarico invadieron Grecia en 395–396; lo que ocurrió a Atenas lo cuentan de manera distinta los escritores antiguos. Durante el siglo V una escuela neoplatónica seguía enseñando allí, dirigida por Proclo hasta su muerte en 485."
  pt:
    - "Atenas fica na planície da Ática, em torno da rocha da Acrópole, a cerca de 8 km de seu porto, o Pireu. A Acrópole foi habitada desde o Neolítico e, no século XIII a.C., era uma fortaleza micênica. Sólon reformou as leis em 594 a.C., e as reformas de Clístenes em 508–507 a.C. lançaram o fundamento da democracia ateniense."
    - "Atenas ajudou a derrotar a Pérsia em Maratona em 490 a.C.; dez anos depois os persas queimaram a Acrópole, e a frota grega venceu em Salamina. Sob Péricles o Partenon foi construído entre 447 e 432 a.C. Atenas perdeu a Guerra do Peloponeso para Esparta em 404 a.C., e em 399 a.C. condenou Sócrates à morte. A Academia de Platão, o Liceu de Aristóteles e as escolas dos estoicos e epicureus fizeram dela a casa da filosofia. Sila tomou a cidade de assalto em 86 a.C., mas sob Roma continuou sendo um centro de saber, e Adriano concluiu o templo de Zeus Olímpico."
    - "Paulo veio a Atenas desde Bereia e ali esperou por Silas e Timóteo. Movido pela cidade cheia de ídolos, discutiu na sinagoga e diariamente na ágora. Filósofos epicureus e estoicos o levaram ao Areópago, onde falou de um altar a um deus desconhecido. Alguns creram, entre eles Dionísio, o areopagita, e uma mulher chamada Dâmaris; um bispo posterior de Corinto nomeia Dionísio primeiro bispo de Atenas. Eusébio escreve que Quadrato e Aristides, a quem Jerônimo chama filósofo ateniense, dirigiram a Adriano defesas da fé cristã."
    - "Em 267 d.C. os hérulos saquearam a cidade, e uma muralha menor foi então construída em torno de seu centro. No século IV, Basílio, o Grande, e Gregório de Nazianzo estudaram ali, bem como o futuro imperador Juliano. Os godos de Alarico invadiram a Grécia em 395–396; o que sucedeu a Atenas é contado de modos diferentes pelos escritores antigos. Durante o século V uma escola neoplatônica ainda ensinava ali, dirigida por Proclo até a sua morte em 485."
  de:
    - "Athen liegt in der Ebene Attikas um den Felsen der Akropolis, etwa 8 km von seinem Hafen Piräus entfernt. Die Akropolis war seit der Jungsteinzeit bewohnt und im 13. Jahrhundert v. Chr. eine mykenische Burg. Solon reformierte 594 v. Chr. die Gesetze, und die Reformen des Kleisthenes 508–507 v. Chr. legten den Grund der athenischen Demokratie."
    - "Athen half 490 v. Chr. bei Marathon, Persien zu besiegen; zehn Jahre später verbrannten die Perser die Akropolis, und die griechische Flotte siegte bei Salamis. Unter Perikles wurde der Parthenon zwischen 447 und 432 v. Chr. gebaut. Athen verlor 404 v. Chr. den Peloponnesischen Krieg gegen Sparta und richtete 399 v. Chr. Sokrates hin. Platons Akademie, des Aristoteles Lykeion und die Schulen der Stoiker und Epikureer machten es zur Heimat der Philosophie. Sulla stürmte die Stadt 86 v. Chr., doch unter Rom blieb sie ein Zentrum der Gelehrsamkeit, und Hadrian vollendete den Tempel des Olympischen Zeus."
    - "Paulus kam von Beröa nach Athen und wartete dort auf Silas und Timotheus. Von der götzenreichen Stadt aufgewühlt, stritt er in der Synagoge und täglich auf der Agora. Epikureische und stoische Philosophen führten ihn auf den Areopag, wo er von einem Altar eines unbekannten Gottes sprach. Einige glaubten, unter ihnen Dionysius Areopagita und eine Frau namens Damaris; ein späterer Bischof von Korinth nennt Dionysius den ersten Bischof von Athen. Eusebius schreibt, Quadratus und Aristides, den Hieronymus einen athenischen Philosophen nennt, hätten Verteidigungsschriften des christlichen Glaubens an Hadrian gerichtet."
    - "267 n. Chr. plünderten die Heruler die Stadt, und danach wurde eine kleinere Mauer um ihr Zentrum gebaut. Im 4. Jahrhundert studierten dort Basilius der Große und Gregor von Nazianz, ebenso der spätere Kaiser Julian. Alarichs Goten überrannten Griechenland 395–396; was Athen widerfuhr, erzählen die antiken Autoren unterschiedlich. Im 5. Jahrhundert lehrte dort noch eine neuplatonische Schule, bis zu seinem Tod 485 von Proklos geleitet."
  fr:
    - "Athènes s’étend dans la plaine de l’Attique autour du rocher de l’Acropole, à environ 8 km de son port du Pirée. L’Acropole fut habitée dès le néolithique, et au XIIIe siècle av. J.-C. elle était une place forte mycénienne. Solon réforma les lois en 594 av. J.-C., et les réformes de Clisthène en 508-507 av. J.-C. posèrent le fondement de la démocratie athénienne."
    - "Athènes aida à vaincre la Perse à Marathon en 490 av. J.-C. ; dix ans plus tard, les Perses brûlèrent l’Acropole, et la flotte grecque l’emporta à Salamine. Sous Périclès, le Parthénon fut bâti entre 447 et 432 av. J.-C. Athènes perdit la guerre du Péloponnèse contre Sparte en 404 av. J.-C., et en 399 av. J.-C. elle fit mourir Socrate. L’Académie de Platon, le Lycée d’Aristote et les écoles des stoïciens et des épicuriens en firent la patrie de la philosophie. Sylla prit la ville d’assaut en 86 av. J.-C., mais sous Rome elle resta un centre du savoir, et Hadrien acheva le temple de Zeus Olympien."
    - "Paul vint à Athènes depuis Bérée et y attendit Silas et Timothée. Ému par la ville pleine d’idoles, il discuta dans la synagogue et chaque jour sur l’agora. Des philosophes épicuriens et stoïciens l’amenèrent à l’Aréopage, où il parla d’un autel à un dieu inconnu. Quelques-uns crurent, dont Denys l’Aréopagite et une femme nommée Damaris ; un évêque de Corinthe plus tardif nomme Denys premier évêque d’Athènes. Eusèbe écrit que Quadratus et Aristide, que Jérôme appelle philosophe athénien, adressèrent à Hadrien des apologies de la foi chrétienne."
    - "En 267 apr. J.-C., les Hérules saccagèrent la ville, et un mur plus petit fut alors bâti autour de son centre. Au IVe siècle, Basile le Grand et Grégoire de Nazianze y étudièrent, comme le futur empereur Julien. Les Goths d’Alaric envahirent la Grèce en 395-396 ; ce qui advint d’Athènes est raconté diversement par les auteurs anciens. Durant le Ve siècle, une école néoplatonicienne y enseignait encore, dirigée par Proclos jusqu’à sa mort en 485."
  it:
    - "Atene si trova nella pianura dell’Attica intorno alla roccia dell’Acropoli, a circa 8 km dal suo porto del Pireo. L’Acropoli fu abitata dal Neolitico, e nel XIII secolo a.C. era una roccaforte micenea. Solone riformò le leggi nel 594 a.C., e le riforme di Clistene nel 508–507 a.C. posero le basi della democrazia ateniese."
    - "Atene contribuì a sconfiggere la Persia a Maratona nel 490 a.C.; dieci anni dopo i Persiani bruciarono l’Acropoli, e la flotta greca vinse a Salamina. Sotto Pericle il Partenone fu costruito tra il 447 e il 432 a.C. Atene perse la guerra del Peloponneso contro Sparta nel 404 a.C., e nel 399 a.C. mise a morte Socrate. L’Accademia di Platone, il Liceo di Aristotele e le scuole degli stoici e degli epicurei ne fecero la patria della filosofia. Silla prese d’assalto la città nell’86 a.C., eppure sotto Roma rimase un centro di cultura, e Adriano completò il tempio di Zeus Olimpio."
    - "Paolo giunse ad Atene da Berea e vi attese Sila e Timoteo. Turbato dalla città piena di idoli, discusse nella sinagoga e ogni giorno nell’agorà. Filosofi epicurei e stoici lo condussero all’Areòpago, dove parlò di un altare a un dio sconosciuto. Pochi credettero, fra i quali Dionigi l’Areopagita e una donna di nome Damaris; un vescovo posteriore di Corinto nomina Dionigi come primo vescovo di Atene. Eusebio scrive che Quadrato e Aristide, che Girolamo chiama un filosofo ateniese, indirizzarono ad Adriano apologie della fede cristiana."
    - "Nel 267 d.C. gli Eruli saccheggiarono la città, e fu allora costruita una cinta più piccola intorno al suo centro. Nel IV secolo vi studiarono Basilio Magno e Gregorio di Nazianzo, come anche il futuro imperatore Giuliano. I Goti di Alarico invasero la Grecia nel 395–396; ciò che toccò ad Atene è raccontato in modo diverso dagli scrittori antichi. Per tutto il V secolo vi insegnò ancora una scuola neoplatonica, guidata da Proclo fino alla sua morte nel 485."
  pl:
    - "Ateny leżą na równinie Attyki wokół skały Akropolu, około 8 km od portu w Pireusie. Akropol był zamieszkany od neolitu, a w XIII wieku p.n.e. był mykeńską twierdzą. Solon zreformował prawa w 594 r. p.n.e., a reformy Klejstenesa z lat 508–507 p.n.e. położyły podwaliny pod demokrację ateńską."
    - "Ateny pomogły pokonać Persję pod Maratonem w 490 r. p.n.e.; dziesięć lat później Persowie spalili Akropol, a flota grecka zwyciężyła pod Salaminą. Za Peryklesa zbudowano Partenon w latach 447–432 p.n.e. Ateny przegrały wojnę peloponeską ze Spartą w 404 r. p.n.e., a w 399 r. p.n.e. skazały na śmierć Sokratesa. Akademia Platona, Likejon Arystotelesa i szkoły stoików i epikurejczyków uczyniły z nich ojczyznę filozofii. Sulla zdobył miasto szturmem w 86 r. p.n.e., a jednak pod Rzymem pozostało ośrodkiem nauki, a Hadrian dokończył świątynię Zeusa Olimpijskiego."
    - "Paweł przybył do Aten z Berei i czekał tam na Sylasa i Tymoteusza. Poruszony miastem pełnym bożków, rozprawiał w synagodze i codziennie na agorze. Filozofowie epikurejscy i stoiccy zaprowadzili go na Areopag, gdzie mówił o ołtarzu nieznanego boga. Nieliczni uwierzyli, wśród nich Dionizy Areopagita i kobieta imieniem Damaris; późniejszy biskup Koryntu nazywa Dionizego pierwszym biskupem Aten. Euzebiusz pisze, że Kwadratus i Arystydes, którego Hieronim nazywa ateńskim filozofem, skierowali do Hadriana obrony wiary chrześcijańskiej."
    - "W 267 r. n.e. Herulowie złupili miasto, a wokół jego centrum zbudowano wtedy mniejszy mur. W IV wieku studiowali tu Bazyli Wielki i Grzegorz z Nazjanzu, a także przyszły cesarz Julian. Goci Alaryka przeszli przez Grecję w latach 395–396; co spotkało Ateny, starożytni autorzy opowiadają różnie. Przez cały V wiek uczyła tu jeszcze szkoła neoplatońska, kierowana przez Proklosa aż do jego śmierci w 485 roku."
  nl:
    - "Athene ligt in de vlakte van Attika rond de rots van de Akropolis, zo’n 8 km van zijn haven Piraeus. De Akropolis werd al sinds het neolithicum bewoond en was in de dertiende eeuw v.Chr. een Myceense burcht. Solon hervormde de wetten in 594 v.Chr., en de hervormingen van Kleisthenes in 508–507 v.Chr. legden de grondslag van de Atheense democratie."
    - "Athene hielp Perzië te verslaan bij Marathon in 490 v.Chr.; tien jaar later verbrandden de Perzen de Akropolis, en de Griekse vloot won bij Salamis. Onder Perikles werd tussen 447 en 432 v.Chr. het Parthenon gebouwd. Athene verloor in 404 v.Chr. de Peloponnesische Oorlog van Sparta, en in 399 v.Chr. liet het Socrates doden. Plato’s Academie, Aristoteles’ Lyceum en de scholen van de stoïcijnen en epicureeërs maakten het tot de thuisplaats van de filosofie. Sulla nam de stad in 86 v.Chr. bij storm, maar onder Rome bleef zij een centrum van geleerdheid, en Hadrianus voltooide de tempel van Olympische Zeus."
    - "Paulus kwam uit Beroea naar Athene en wachtte daar op Silas en Timoteüs. Geraakt door de stad vol afgodsbeelden redetwistte hij in de synagoge en dagelijks op de agora. Epicurische en stoïsche wijsgeren brachten hem naar de Areopagus, waar hij sprak over een altaar voor een onbekende god. Enkelen geloofden, onder wie Dionysius de Areopagiet en een vrouw met de naam Damaris; een latere bisschop van Korinthe noemt Dionysius de eerste bisschop van Athene. Eusebius schrijft dat Quadratus en Aristides, die Hieronymus een Atheens wijsgeer noemt, verdedigingen van het christelijk geloof aan Hadrianus richtten."
    - "In 267 n.Chr. plunderden de Heruliërs de stad, en daarna werd een kleinere muur rond haar centrum gebouwd. In de vierde eeuw studeerden Basilius de Grote en Gregorius van Nazianze er, evenals de latere keizer Julianus. Alarics Goten overspoelden Griekenland in 395–396; wat Athene overkwam, wordt door antieke schrijvers verschillend verteld. Tot in de vijfde eeuw onderwees er nog een neoplatonische school, geleid door Proclus tot zijn dood in 485."
  cs:
    - "Atény leží v attické pláni kolem skály Akropole, asi 8 km od svého přístavu v Pireu. Akropole byla obývána od neolitu a ve 13. století př. n. l. byla mykénskou pevností. Solón reformoval zákony roku 594 př. n. l. a reformy Kleisthenovy v letech 508–507 př. n. l. položily základ athénské demokracie."
    - "Atény pomohly porazit Persii u Marathónu roku 490 př. n. l.; o deset let později Peršané spálili Akropoli a řecká flotila zvítězila u Salamíny. Za Perikla byl v letech 447 až 432 př. n. l. postaven Parthenón. Atény prohrály peloponéskou válku se Spartou roku 404 př. n. l. a roku 399 př. n. l. popravily Sókrata. Platónova Akademie, Aristotelův Lykeion a školy stoiků a epikurejců z nich učinily domov filozofie. Sulla město dobyl bouří roku 86 př. n. l., přesto zůstalo pod Římem střediskem vzdělanosti a Hadrianus dokončil chrám Dia Olympského."
    - "Pavel přišel do Atén z Beroie a čekal tam na Silase a Timotea. Rozhořčen městem plným model, rozmlouval v synagoze a denně na agoře. Epikurejští a stoičtí filozofové ho přivedli na Areopag, kde mluvil o oltáři neznámého boha. Několik jich uvěřilo, mezi nimi Dionýsios Areopagita a žena jménem Damaris; pozdější korintský biskup jmenuje Dionýsia prvním biskupem Atén. Eusebios píše, že Quadratus a Aristeidés, kterého Jeroným nazývá athénským filozofem, adresovali Hadrianovi obrany křesťanské víry."
    - "V roce 267 n. l. město vyplenili Herulové a kolem jeho středu byla poté postavena menší hradba. Ve 4. století tam studovali Basileios Veliký a Řehoř Naziánský, stejně jako budoucí císař Julianus. Alarichovi Gótové zaplavili Řecko v letech 395–396; co se stalo s Aténami, vyprávějí starověcí spisovatelé různě. Po celé 5. století tam stále vyučovala novoplatónská škola, vedená Proklem až do jeho smrti roku 485."
  sv:
    - "Aten ligger på Attikas slätt kring Akropolis’ klippa, omkring 8 km från sin hamn i Pireus. Akropolis var bebodd sedan neolitikum, och på 1200-talet f.Kr. var den en mykensk fästning. Solon reformerade lagarna år 594 f.Kr., och Kleisthenes’ reformer 508–507 f.Kr. lade grunden till den atenska demokratin."
    - "Aten hjälpte till att besegra Persien vid Marathon år 490 f.Kr.; tio år senare brände perserna Akropolis, och den grekiska flottan segrade vid Salamis. Under Perikles byggdes Parthenon mellan 447 och 432 f.Kr. Aten förlorade Peloponnesiska kriget mot Sparta år 404 f.Kr., och år 399 f.Kr. lät det avrätta Sokrates. Platons Akademi, Aristoteles’ Lykeion och stoikernas och epikuréernas skolor gjorde det till filosofins hem. Sulla stormade staden år 86 f.Kr., men under Rom förblev den ett lärdomscentrum, och Hadrianus fullbordade templet för Olympiske Zeus."
    - "Paulus kom till Aten från Beroia och väntade där på Silas och Timoteus. Upprörd av staden full av avgudabilder förde han samtal i synagogan och dagligen på agoran. Epikuréiska och stoiska filosofer förde honom till Areopagen, där han talade om ett altare åt en okänd gud. Några kom till tro, bland dem Dionysios Areopagiten och en kvinna vid namn Damaris; en senare biskop av Korinth nämner Dionysios som Atens förste biskop. Eusebios skriver att Quadratus och Aristides, som Hieronymus kallar en atensk filosof, riktade försvarsskrifter för den kristna tron till Hadrianus."
    - "År 267 e.Kr. plundrade herulerna staden, och en mindre mur byggdes därefter kring dess centrum. På 300-talet studerade Basileios den store och Gregorios av Nazianzos där, liksom den blivande kejsaren Julianus. Alarics goter härjade Grekland 395–396; vad som hände Aten berättas olika av antika författare. Genom hela 400-talet undervisade en nyplatonsk skola ännu där, ledd av Proklos till hans död år 485."
  nb:
    - "Aten ligger på Attikas slette rundt Akropolis-klippen, omtrent 8 km fra havnen i Piraeus. Akropolis var bebodd fra yngre steinalder, og på 1200-tallet f.Kr. var den en mykensk festning. Solon reformerte lovene i 594 f.Kr., og Kleisthenes' reformer i 508–507 f.Kr. la grunnlaget for det athenske demokratiet."
    - "Aten hjalp til med å beseire Persia ved Marathon i 490 f.Kr.; ti år senere brente perserne Akropolis, og den greske flåten seiret ved Salamis. Under Perikles ble Parthenon bygd mellom 447 og 432 f.Kr. Aten tapte Peloponneskrigen mot Sparta i 404 f.Kr., og i 399 f.Kr. henrettet byen Sokrates. Platons akademi, Aristoteles' lykeion og stoikernes og epikuréernes skoler gjorde den til filosofiens hjem. Sulla stormet byen i 86 f.Kr., men under Roma forble den et lærdomssenter, og Hadrian fullførte tempelet for Zevs Olympios."
    - "Paulus kom til Aten fra Berøa og ventet der på Silas og Timoteus. Opprørt over byen full av avgudsbilder diskuterte han i synagogen og daglig på agoraen. Epikureiske og stoiske filosofer førte ham til Areopagos, der han talte om et alter for en ukjent gud. Noen få kom til troen, blant dem Dionysios areopagitten og en kvinne ved navn Damaris; en senere biskop av Korint kaller Dionysios Atens første biskop. Eusebius skriver at Quadratus og Aristides, som Hieronymus kaller en athensk filosof, rettet forsvarsskrifter for den kristne tro til Hadrian."
    - "I 267 e.Kr. plyndret herulerne byen, og en mindre mur ble så bygd rundt sentrum. På 300-tallet studerte Basileios den store og Gregor av Nazianzos der, det samme gjorde den senere keiseren Julian. Alariks goter overskred Hellas i 395–396; hva som hendte Aten, fortelles ulikt av antikke forfattere. Gjennom hele 400-tallet underviste en nyplatonsk skole der, ledet av Proklos til hans død i 485."
  tl:
    - "Ang Atenas ay nasa kapatagan ng Atica sa palibot ng bato ng Acropolis, mga 8 km mula sa daungan nito sa Piraeus. Tinirhan ang Acropolis mula pa sa Neolitiko, at noong ika-13 siglo BK ay kutang Miceno. Binago ni Solon ang mga batas noong 594 BK, at ang mga reporma ni Cleisthenes noong 508–507 BK ang naglatag ng saligan ng demokrasyang Ateniense."
    - "Tumulong ang Atenas na talunin ang Persia sa Marathon noong 490 BK; makalipas ang sampung taon, sinunog ng mga Persiano ang Acropolis, at nanalo ang hukbong-dagat ng Grecia sa Salamina. Sa ilalim ni Pericles, itinayo ang Parthenon sa pagitan ng 447 at 432 BK. Natalo ang Atenas sa Digmaang Peloponeso sa Sparta noong 404 BK, at noong 399 BK ay ipinapatay nito si Sócrates. Ang Akademya ni Platón, Lyceum ni Aristoteles at mga paaralan ng mga Estoico at Epicureo ang gumawa rito na tahanan ng pilosopiya. Sinalakay ni Sulla ang lungsod noong 86 BK, ngunit sa ilalim ng Roma ay nanatili itong sentro ng karunungan, at tinapos ni Adriano ang templo ni Zeus Olimpiko."
    - "Dumating si Pablo sa Atenas mula Berea at naghintay roon kina Silas at Timoteo. Nabagabag ng lungsod na puno ng diosdiosan, nangatwiran siya sa sinagoga at araw-araw sa agora. Dinala siya ng mga pilosopong Epicureo at Estoico sa Areopago, kung saan nagsalita siya tungkol sa dambana ng isang di-kilalang diyos. Ilan ang sumampalataya, kabilang si Dionisio na Areopagita at isang babaeng nagngangalang Damaris; pinangalanan ng isang kalaunang obispo ng Corinto si Dionisio bilang unang obispo ng Atenas. Isinulat ni Eusebio na sina Quadratus at Aristides, na tinatawag ni Jeronimo na pilosopong Ateniense, ay nagpadala kay Adriano ng mga pagtatanggol sa pananampalatayang Kristiyano."
    - "Noong 267 AD, sinalakay ng mga Heruli ang lungsod, at pagkatapos ay nagtayo ng mas maliit na pader sa palibot ng gitna nito. Noong ika-4 na siglo, nag-aral doon sina Basilio na Dakila at Gregorio ng Nazianzo, gayon din ang magiging emperador na si Juliano. Sinalakay ng mga Goth ni Alarico ang Grecia noong 395–396; magkaiba ang salaysay ng mga sinaunang manunulat sa sinapit ng Atenas. Hanggang ika-5 siglo, may paaralang Neoplatonista pa ring nagtuturo roon, na pinamunuan ni Proclo hanggang mamatay siya noong 485."
  da:
    - "Athen ligger i Attikas slette omkring Akropolis-klippen, omkring 8 km fra sin havn Piræus. Akropolis var beboet fra stenalderen, og i 1200-tallet f.Kr. var den en mykensk fæstning. Solon reformerede lovene i 594 f.Kr., og Kleisthenes' reformer i 508–507 f.Kr. lagde grundlaget for det athenske demokrati."
    - "Athen var med til at besejre Persien ved Marathon i 490 f.Kr.; ti år senere brændte perserne Akropolis, og den græske flåde sejrede ved Salamis. Under Perikles blev Parthenon bygget mellem 447 og 432 f.Kr. Athen tabte den peloponnesiske krig til Sparta i 404 f.Kr., og i 399 f.Kr. henrettede det Sokrates. Platons Akademi, Aristoteles' Lykeion og stoikernes og epikuræernes skoler gjorde det til filosofiens hjem. Sulla stormede byen i 86 f.Kr., men under Rom forblev den et lærdomscentrum, og Hadrian fuldførte templet for Olympisk Zeus."
    - "Paulus kom til Athen fra Berøa og ventede dér på Silas og Timotheus. Oprørt over byen, fuld af afgudsbilleder, disputerede han i synagogen og dagligt på agoraen. Epikuræiske og stoiske filosoffer førte ham til Areopagos, hvor han talte om et alter for en ukendt gud. Nogle få troede, blandt dem Dionysios Areopagiten og en kvinde ved navn Damaris; en senere biskop af Korinth nævner Dionysios som Athens første biskop. Eusebius skriver, at Quadratus og Aristides, som Hieronymus kalder en athensk filosof, stilede forsvarsskrifter for den kristne tro til Hadrian."
    - "I 267 e.Kr. plyndrede herulerne byen, og en mindre mur blev så bygget omkring dens centrum. I 300-tallet studerede Basil den Store og Gregor af Nazianz dér, ligesom den senere kejser Julian. Alariks goter oversvømmede Grækenland i 395–396; hvad der hændte Athen, fortælles forskelligt af antikke forfattere. Gennem 400-tallet underviste en nyplatonisk skole stadig dér, ledet af Proklos til hans død i 485."
