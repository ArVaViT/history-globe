body:
  en:
    - "Zaphon was a town of Gad in the Jordan valley, east of the river. Joshua lists it with Beth-aram, Beth-nimrah and Succoth as “the rest of the kingdom of Sihon king of Heshbon, Jordan and his border, even unto the edge of the sea of Chinnereth”. The second mention is less certain. When the men of Ephraim came to quarrel with Jephthah after his victory over Ammon, the King James Bible says they “went northward”; the Hebrew word, tsaphonah, can also mean “to Zaphon”, and many modern translations read it so, as does the Synodal text with its own form of the name: «перешли в Севину». If so, Zaphon was where Ephraim crossed the Jordan to confront Jephthah, before the slaughter at the fords that followed the test of “Shibboleth”."
    - "The name means “north”, and nothing else is known of the town's history. The Jerusalem Talmud equates it with Amathus, but most scholars look for it in the central Jordan valley north of Succoth. The map's chief candidate is Tell es-Sa'idiyeh, a large mound excavated by J. B. Pritchard and later by J. N. Tubb, although its excavators preferred to identify it with Zarethan; Tell el-Qos, Tell el-Mazar and Khirbet Buweib nearby have also been proposed. The question remains open."
  ru:
    - "Цафон — город Гада в Иорданской долине, к востоку от реки. Книга Иисуса Навина называет его вместе с Беф-Гарамом, Беф-Нимрой и Сокхофом как «остаток царства Сигона, царя Есевонского; пределом его был Иордан до моря Хиннерефского». Второе упоминание менее надёжно. Когда ефремляне пришли ссориться с Иеффаем после его победы над Аммоном, английская Библия короля Якова говорит, что они пошли на север; еврейское слово цафона значит и «к Цафону», и так читают многие современные переводы, а Синодальный передаёт имя по-своему: «перешли в Севину». Если так, то у Цафона ефремляне перешли Иордан против Иеффая, перед резнёй у бродов, которой кончилась проба словом «шибболет»."
    - "Имя значит «север», и больше об истории города ничего не известно. Иерусалимский Талмуд отождествляет его с Амафом, но большинство учёных ищут его в средней части Иорданской долины к северу от Сокхофа. Главный кандидат на карте — Телль-эс-Саидийе, большой холм, раскопанный Дж. Притчардом, а позже Дж. Таббом, хотя сами раскопщики считали его Цартаном; предлагали и соседние Телль-эль-Кос, Телль-эль-Мазар и Хирбет-Бувейб. Вопрос остаётся открытым."
  uk:
    - "Цафон був містом Гада в долині Йордану, на схід від річки. Ісус Навин перелічує його з Бет-Гарамом, Бет-Німрою та Сокхотом як «останок царства Сигонового, царя Езбонського, з Йорданню яко гряницею аж до полуденнього конця Киннеретського моря». Друга згадка менш певна. Коли люди Єфрема прийшли сваритися з Єфтаєм після його перемоги над Аммоном, Біблія короля Якова каже, що вони пішли на північ; староєврейське слово цафона може означати й «до Цафону», і багато сучасних перекладів читають його так, як і Синодальний текст зі своєю формою назви: «перешли в Севину». Якщо так, Цафон був там, де Єфрем переходив Йордан, щоб зустрітися з Єфтаєм, перед різаниною на бродах, що настала після випробування «Шибболетом»."
    - "Назва означає «північ», і про історію міста більше нічого не відомо. Єрусалимський Талмуд ототожнює його з Аматусом, але більшість учених шукають його в центральній долині Йордану на північ від Сокхоту. Головний кандидат мапи — Телль-ес-Саїдія, великий пагорб, розкопаний Дж. Б. Прітчардом, а пізніше Дж. Н. Таббом, хоч його розкопувачі воліли ототожнювати його з Цартаном; пропонували також Телль-ель-Кос, Телль-ель-Мазар і Хірбет-Бувейб поблизу. Питання лишається відкритим."
  es:
    - "Zafón era una ciudad de Gad en el valle del Jordán, al este del río. Josué la enumera con Bet-aram, Bet-nimra y Sucot como «resto del reino de Sehón, rey en Hesbón: el Jordán y su término hasta el cabo de la mar de Cinnereth». La segunda mención es menos segura. Cuando los hombres de Efraín fueron a disputar con Jefté tras su victoria sobre Amón, la Reina-Valera dice que «pasaron hacia el aquilón»; la palabra hebrea, tsaphonah, puede significar también «a Zafón», y muchas traducciones modernas lo leen así, como el texto sinodal con su propia forma del nombre: «перешли в Севину». Si es así, Zafón fue donde Efraín cruzó el Jordán para enfrentarse a Jefté, antes de la matanza en los vados que siguió a la prueba del «Shiboleth»."
    - "El nombre significa «norte», y nada más se sabe de la historia de la ciudad. El Talmud de Jerusalén la equipara con Amatus, pero la mayoría de los estudiosos la buscan en el valle central del Jordán, al norte de Sucot. El principal candidato del mapa es Tell es-Sa'idiyeh, un gran montículo excavado por J. B. Pritchard y más tarde por J. N. Tubb, aunque sus excavadores prefirieron identificarlo con Saretán; también se han propuesto los cercanos Tell el-Qos, Tell el-Mazar y Khirbet Buweib. La cuestión sigue abierta."
  pt:
    - "Zafom era uma cidade de Gade no vale do Jordão, a leste do rio. Josué a lista com Bete-Arã, Bete-Ninra e Sucote como “o resto do reino de Seom, rei de Hesbom, a margem do Jordão, até a extremidade do mar de Quinerete”. A segunda menção é menos certa. Quando os homens de Efraim foram brigar com Jefté depois de sua vitória sobre Amom, a Bíblia King James diz que “marcharam para o norte”; a palavra hebraica, tsaphonah, pode também significar “para Zafom”, e muitas traduções modernas a leem assim, como o texto sinodal com sua própria forma do nome: “перешли в Севину”. Se for assim, Zafom foi onde Efraim atravessou o Jordão para enfrentar Jefté, antes da matança nos vaus que se seguiu à prova do “Chibolete”."
    - "O nome significa “norte”, e nada mais se sabe da história da cidade. O Talmude de Jerusalém a equipara a Amatos, mas a maioria dos estudiosos a procura no vale central do Jordão, ao norte de Sucote. O principal candidato do mapa é Tell es-Sa'idiyeh, um grande monte escavado por J. B. Pritchard e depois por J. N. Tubb, embora seus escavadores preferissem identificá-lo com Zaretã; Tell el-Qos, Tell el-Mazar e Khirbet Buweib, nas proximidades, também foram propostos. A questão permanece aberta."
  de:
    - "Zafon war eine Stadt Gads im Jordantal, östlich des Flusses. Josua führt sie mit Bet-Aram, Bet-Nimra und Sukkot auf als „was übrig war von dem Reich Sihons, des Königs zu Hesbon, daß der Jordan die Grenze war bis ans Ende des Meeres Kinnereth“. Die zweite Erwähnung ist unsicherer. Als die Männer Ephraims nach Jeftahs Sieg über Ammon kamen, um mit ihm zu streiten, „gingen“ sie nach der Lutherbibel „mitternachtwärts“; das hebräische Wort tsaphonah kann auch „nach Zafon“ bedeuten, und viele moderne Übersetzungen lesen so, ebenso der Synodaltext mit seiner eigenen Namensform: «перешли в Севину». Wenn ja, war Zafon der Ort, wo Ephraim den Jordan überquerte, um Jeftah zu stellen, vor dem Gemetzel an den Furten, das auf die Probe mit „Schiboleth“ folgte."
    - "Der Name bedeutet „Norden“, und sonst ist über die Geschichte der Stadt nichts bekannt. Der Jerusalemer Talmud setzt sie mit Amathus gleich, doch die meisten Forscher suchen sie im mittleren Jordantal nördlich von Sukkot. Der Hauptkandidat der Karte ist Tell es-Sa'idiyeh, ein großer Hügel, von J. B. Pritchard und später J. N. Tubb ausgegraben, obwohl seine Ausgräber ihn lieber mit Zaretan gleichsetzten; Tell el-Qos, Tell el-Mazar und Khirbet Buweib in der Nähe wurden ebenfalls vorgeschlagen. Die Frage bleibt offen."
  fr:
    - "Tsaphon était une ville de Gad dans la vallée du Jourdain, à l’est du fleuve. Josué la range avec Beth-Haram, Beth-Nimra et Succoth comme « reste du royaume de Sihon, roi de Hesbon, ayant le Jourdain pour limite jusqu’à l’extrémité de la mer de Kinnéreth ». La seconde mention est moins sûre. Quand les hommes d’Éphraïm vinrent quereller Jephté après sa victoire sur Ammon, la Louis Segond dit qu’ils « partirent pour le nord » ; le mot hébreu tsaphonah peut aussi signifier « à Tsaphon », et beaucoup de traductions modernes le lisent ainsi, comme le texte synodal, avec sa propre forme du nom : « перешли в Севину ». Si c’est le cas, Tsaphon était l’endroit où Éphraïm franchit le Jourdain pour affronter Jephté, avant le massacre aux gués qui suivit l’épreuve du « Schibboleth »."
    - "Le nom signifie « nord », et l’on ne sait rien d’autre de l’histoire de la ville. Le Talmud de Jérusalem l’identifie à Amathous, mais la plupart des spécialistes la cherchent dans la vallée centrale du Jourdain au nord de Succoth. Le principal candidat de la carte est Tell es-Sa’idiyeh, grand tertre fouillé par J. B. Pritchard puis par J. N. Tubb, bien que ses fouilleurs aient préféré l’identifier à Tsarthan ; Tell el-Qos, Tell el-Mazar et Khirbet Buweib, tout près, ont aussi été proposés. La question reste ouverte."
  pl:
    - "Safon było miastem Gada w dolinie Jordanu, na wschód od rzeki. Jozue wymienia je z Bet-Haram, Bet-Nimra i Sukkot jako „ostatek królestwa Sehona, króla Hesebońskiego, Jordan i pogranicze jego aż do końca morza Cynneret”. Drugie wspomnienie jest mniej pewne. Gdy mężowie Efraima przyszli spierać się z Jeftem po jego zwycięstwie nad Ammonem, Biblia Króla Jakuba ma, że poszli na północ; hebrajskie słowo tsaphonah może też znaczyć „do Safon”, i wiele nowoczesnych przekładów czyta je tak, podobnie jak tekst synodalny z własną formą nazwy: „przeszli do Sewiny”. Jeśli tak, Safon było miejscem, gdzie Efraim przeprawił się przez Jordan, by stawić czoło Jeftemu, przed rzezią na brodach, która nastąpiła po próbie „Szybolet”."
    - "Nazwa znaczy „północ” i nic więcej nie wiadomo o historii miasta. Talmud jerozolimski utożsamia je z Amathus, ale większość badaczy szuka go w środkowej dolinie Jordanu na północ od Sukkot. Głównym kandydatem na mapie jest Tell es-Saidijja, duży kopiec badany przez J. B. Pritcharda, a później J. N. Tubba, choć jego odkrywcy woleli utożsamiać go z Sartanem; proponowano też pobliskie Tell el-Kos, Tell el-Mazar i Chirbet Buwejb. Sprawa pozostaje otwarta."
  it:
    - "Zafon era una città di Gad nella valle del Giordano, a est del fiume. Giosuè la elenca con Bet-Aram, Bet-Nimra e Succot come «residuo del regno di Sihon re di Heshbon, avendo il Giordano per confine sino all’estremità del mare di Kinnereth». La seconda menzione è meno certa. Quando gli uomini di Efraim vennero a litigare con Iefte dopo la sua vittoria su Ammon, la King James Bible dice che «went northward»; la parola ebraica, tsaphonah, può significare anche «a Zafon», e molte traduzioni moderne la leggono così, come il testo sinodale con la sua forma del nome: «перешли в Севину». Se è così, Zafon era dove Efraim attraversò il Giordano per affrontare Iefte, prima del massacro ai guadi che seguì la prova di «Scibboleth»."
    - "Il nome significa «nord», e nient’altro si sa della storia della città. Il Talmud di Gerusalemme la equipara ad Amatunte, ma la maggior parte degli studiosi la cerca nella valle centrale del Giordano a nord di Succot. Il candidato principale della mappa è Tell es-Sa’idiyeh, un grande tell scavato da J. B. Pritchard e poi da J. N. Tubb, benché i suoi scavatori preferissero identificarlo con Sartan; sono stati proposti anche i vicini Tell el-Qos, Tell el-Mazar e Khirbet Buweib. La questione resta aperta."
  nl:
    - "Zafon was een stad van Gad in de Jordaanvallei, ten oosten van de rivier. Jozua noemt het met Beth-Haram, Beth-Nimra en Sukkot als “wat over was van het koninkrijk van Sihon, den koning te Hesbon, de Jordaan en haar landpale, tot aan het einde der zee van Cinnereth”. De tweede vermelding is minder zeker. Toen de mannen van Efraïm bij Jefta kwamen twisten na zijn overwinning op Ammon, zegt de King James Bible dat zij “went northward”; het Hebreeuwse woord, tsaphonah, kan ook “naar Zafon” betekenen, en vele moderne vertalingen lezen het zo, evenals de Synodale tekst met zijn eigen vorm van de naam: «перешли в Севину». Zo ja, dan was Zafon de plaats waar Efraïm de Jordaan overstak om Jefta te confronteren, vóór het bloedbad bij de veren dat volgde op de proef van “Schibboleth”."
    - "De naam betekent “noord”, en verder is niets van de geschiedenis van de stad bekend. De Jeruzalemse Talmoed stelt het gelijk aan Amathus, maar de meeste geleerden zoeken het in de centrale Jordaanvallei ten noorden van Sukkot. De voornaamste kandidaat op de kaart is Tell es-Sa’idiyeh, een grote heuvel opgegraven door J.B. Pritchard en later door J.N. Tubb, hoewel de opgravers de voorkeur gaven aan de gelijkstelling met Zaretan; Tell el-Qos, Tell el-Mazar en Khirbet Buweib in de buurt zijn ook voorgesteld. De vraag blijft open."
  cs:
    - "Cafon bylo město Gádovo v Jordánském údolí, východně od řeky. Jozue je uvádí s Bét-haramem, Bét-nimrou a Sukotem jako „ostatek království Seona, krále Ezebon, i Jordán s pomezím svým až k kraji moře Ceneret“. Druhá zmínka je méně jistá. Když muži Efrajimovi přišli přít se s Jiftáchem po jeho vítězství nad Amónem, říká King James Bible, že „went northward“ (šli na sever); hebrejské slovo cafona může znamenat i „do Cafonu“ a mnohé moderní překlady je tak čtou, stejně jako synodální text s vlastní podobou jména: «перешли в Севину». Pokud ano, byl Cafon tam, kde Efrajim překročil Jordán, aby se postavil Jiftáchovi, před vraždou na brodech, která následovala po zkoušce „Šibolet“."
    - "Jméno znamená „sever“ a nic jiného není známo o dějinách města. Jeruzalémský talmud je ztotožňuje s Amathúsem, ale většina učenců je hledá ve středním Jordánském údolí severně od Sukotu. Hlavním kandidátem mapy je Tell es-Sa'ídíja, velký pahorek vykopávaný J. B. Pritchardem a později J. N. Tubbem, ačkoli jeho vykopávači dávali přednost jeho ztotožnění s Caretanem; navrženy byly také Tell el-Kos, Tell el-Mazar a Chirbet Buwejb poblíž. Otázka zůstává otevřená."
  sv:
    - "Safon var en stad i Gad i Jordandalen, öster om floden. Josua räknar upp den med Bet-Haram, Bet-Nimra och Suckot som ”det övriga av Sihons rike, konungens i Hesbon, intill Jordan, som utgjorde gränsen, upp till ändan av Kinneretsjön”. Den andra omnämningen är mindre säker. När Efraims män kom för att gräla med Jefta efter hans seger över Ammon säger King James-översättningen att de ”went northward”; det hebreiska ordet, tsafona, kan också betyda ”till Safon”, och många moderna översättningar läser så, liksom den synodala texten med sin egen form av namnet: «перешли в Севину». I så fall var Safon platsen där Efraim gick över Jordan för att möta Jefta, före slaktningen vid vadställena som följde på prövningen med ”schibbolet”."
    - "Namnet betyder ”norr”, och inget annat är känt om stadens historia. Jerusalemtalmud likställer den med Amathus, men de flesta forskare söker den i centrala Jordandalen norr om Suckot. Kartans främsta kandidat är Tell es-Sa'idiyeh, en stor kulle utgrävd av J. B. Pritchard och senare av J. N. Tubb, fast utgrävarna föredrog att identifiera den med Saretan; Tell el-Qos, Tell el-Mazar och Khirbet Buweib i närheten har också föreslagits. Frågan förblir öppen."
  nb:
    - "Safon var en by i Gad i Jordandalen, øst for elven. Josva oppfører den sammen med Bet-Haram, Bet-Nimra og Sukkot som «resten av det rike som hadde tilhørt Sihon, kongen i Hesbon, med Jordan og landet langsmed den inntil enden av Kinneret-sjøen». Den andre omtalen er mindre sikker. Da mennene fra Efraim kom for å trette med Jefta etter seieren hans over Ammon, sier King James-oversettelsen at de «went northward» (drog nordover); det hebraiske ordet, tsaphonah, kan også bety «til Safon», og mange moderne oversettelser leser det slik, det samme gjør synodalteksten med sin egen form av navnet: «перешли в Севину». Hvis så er, var Safon der Efraim krysset Jordan for å konfrontere Jefta, før slaktingen ved vadestedene som fulgte etter prøven med «sjibbolet»."
    - "Navnet betyr «nord», og ingenting annet er kjent om byens historie. Jerusalem-talmud setter den lik Amatus, men de fleste forskere søker den i den sentrale Jordandalen nord for Sukkot. Kartets viktigste kandidat er Tell es-Sa'idiyeh, en stor haug utgravd av J. B. Pritchard og senere av J. N. Tubb, selv om utgraverne foretrakk å identifisere den med Saretan; Tell el-Qos, Tell el-Mazar og Khirbet Buweib i nærheten er også foreslått. Spørsmålet er fortsatt åpent."
  tl:
    - "Ang Saphon ay bayan ng Gad sa libis ng Jordan, silangan ng ilog. Itinatala ito ni Josue kasama ng Beth-aram, Beth-nimra at Succoth bilang “labis ng kaharian ni Sehon na hari sa Hesbon, ang Jordan at ang hangganan niyaon, hanggang sa kaduluduluhang bahagi ng dagat ng Cinnereth”. Hindi gaanong tiyak ang ikalawang banggit. Nang pumunta ang mga lalake ng Ephraim upang makipag-away kay Jephte pagkatapos ng kaniyang tagumpay laban sa Ammon, sinasabi ng King James Bible na sila'y “went northward”; ang salitang Hebreong tsaphonah ay maaari ring mangahulugang “sa Saphon”, at ganoon ang pagbasa ng maraming makabagong salin, gayundin ng tekstong Synodal sa sarili nitong anyo ng pangalan: «перешли в Севину». Kung gayon, ang Saphon ang pinagtawiran ng Ephraim sa Jordan upang harapin si Jephte, bago ang pagpatay sa mga tawiran na sumunod sa pagsubok na “Shiboleth”."
    - "Ang pangalan ay nangangahulugang “hilaga”, at wala nang iba pang nalalaman sa kasaysayan ng bayan. Itinutumbas ito ng Talmud ng Jerusalem sa Amathus, ngunit hinahanap ito ng karamihan ng iskolar sa gitnang libis ng Jordan hilaga ng Succoth. Ang pangunahing kandidato ng mapa ay ang Tell es-Sa'idiyeh, malaking burol na hinukay ni J. B. Pritchard at kalaunan ni J. N. Tubb, bagaman mas gusto ng mga naghukay na kilalanin ito sa Sarethan; iminungkahi rin ang kalapit na Tell el-Qos, Tell el-Mazar at Khirbet Buweib. Bukás pa ang tanong."
  da:
    - "Safon var en by i Gad i Jordandalen, øst for floden. Josva opregner den sammen med Bet-Haram, Bet-Nimra og Sukkot som det, »som var bleven tilovers af Sihons, Hesbons Konges, Rige, Jordanen og Landemærket derhos, indtil Enden af Kinnereths Hav«. Det andet omtalte sted er mindre sikkert. Da mændene af Efraim kom for at skændes med Jefta efter hans sejr over Ammon, siger King James-oversættelsen, at de gik nordpå; det hebraiske ord, tsaphonah, kan også betyde »til Safon«, og mange moderne oversættelser læser det sådan, ligesom Synodalteksten med sin egen form af navnet: »перешли в Севину«. Hvis det er rigtigt, var Safon stedet, hvor Efraim krydsede Jordan for at konfrontere Jefta, før slagtningen ved vadestederne, der fulgte efter prøven med »Sjibboleth«."
    - "Navnet betyder »nord«, og intet andet vides om byens historie. Jerusalemtalmud sidestiller den med Amathus, men de fleste forskere søger den i den centrale Jordandal nord for Sukkot. Kortets hovedkandidat er Tell es-Sa'idiyeh, en stor tell udgravet af J. B. Pritchard og senere af J. N. Tubb, selv om dens udgravere foretrak at identificere den med Saretan; Tell el-Qos, Tell el-Mazar og Khirbet Buweib i nærheden er også blevet foreslået. Spørgsmålet er åbent."
  sr:
    - "Сафон је био град Гадов у долини Јордана, источно од реке. Исус га набраја са Вет-Араном, Вет-Нимром и Сокотом као „остатак царства Сиона цара есевонског, Јордан и међа његова до краја мора хинеротског“. Друго помињање је мање извесно. Када су Јефремовци дошли да се свађају с Јефтајем после његове победе над Амоном, Верзија краља Јакова каже да су отишли „на север“; хебрејска реч, цафона, може значити и „у Сафон“, и многи савремени преводи је тако читају, као и синодски текст са својим обликом имена: «перешли в Севину». Ако је тако, Сафон је био место где је Јефрем прешао Јордан да се суочи с Јефтајем, пре покоља на газовима који је уследио после пробе речи „Шиболет“."
    - "Име значи „север“, а о историји града ништа друго није познато. Јерусалимски талмуд га изједначује с Аматом, али већина научника тражи га у средишњој долини Јордана северно од Сокота. Главни кандидат на карти је Тел ес Саидија, велики хум који су ископавали Џ. Б. Причард и касније Џ. Н. Таб, мада су његови ископавачи радије хтели да га поистовете са Сартаном; предлагани су и оближњи Тел ел Кос, Тел ел Мазар и Хирбет Бувејб. Питање остаје отворено."
  hu:
    - "Cáfón Gád városa volt a Jordán-völgyben, a folyótól keletre. Józsué Bét-Hárammal, Bét-Nimrával és Szukkóttal együtt sorolja fel mint „Szíhonnak, Hesbon királyának maradék országa, a Jordán és melléke, a Kinnereth tenger széléig”. A második említés kevésbé biztos. Amikor Efraim férfiai Jefte győzelme után Ammon felett perlekedni jöttek Jeftével, a King James-fordítás szerint „went northward”; a héber szó, cáfónáh, azt is jelentheti „Cáfónba”, és sok modern fordítás így olvassa, ahogy a szinodális szöveg is a név saját alakjával: «перешли в Севину». Ha így van, Cáfón ott volt, ahol Efraim átkelt a Jordánon, hogy szembeszálljon Jeftével, a gázlóknál történt mészárlás előtt, amely a „Sibbólet” próbáját követte."
    - "A név „északot” jelent, és a város történetéről semmi mást nem tudunk. A jeruzsálemi Talmud Amathusszal azonosítja, de a legtöbb tudós a középső Jordán-völgyben keresi, Szukkóttól északra. A térkép fő jelöltje a Tell esz-Szaídije, J. B. Pritchard, majd J. N. Tubb által ásatott nagy halom, bár ásatói inkább Cáretánnal azonosították; a közeli Tell el-Kosz, Tell el-Mazar és Khirbet Buvejb is szóba került. A kérdés nyitott."
  fi:
    - "Safon oli Gadin kaupunki Jordanin laaksossa joen itäpuolella. Joosua luettelee sen Bet-Aramin, Bet-Nimran ja Sukkotin kanssa ”loput Siihonin, Hesbonin kuninkaan, valtakunnasta, rajana Jordan Kinneretin järven päähän saakka”. Toinen maininta on epävarmempi. Kun Efraimin miehet tulivat riitelemään Jeftan kanssa tämän Ammonin voiton jälkeen, Raamattu (1938) kertoo: ”he lähtivät pohjoiseen päin”; heprean sana tsafona voi tarkoittaa myös ”Safoniin”, ja monet nykykäännökset lukevat sen niin, samoin synodaalinen teksti omalla nimimuodollaan: «перешли в Севину». Jos näin on, Safon oli siellä, missä Efraim ylitti Jordanin kohdatakseen Jeftan, ennen verilöylyä kahlauspaikoilla, joka seurasi shibbolet-koetta."
    - "Nimi merkitsee ”pohjoista”, eikä kaupungin historiasta tiedetä muuta. Jerusalemin talmud rinnastaa sen Amathukseen, mutta useimmat tutkijat etsivät sitä Keski-Jordanin laaksosta Sukkotista pohjoiseen. Kartan pääehdokas on Tell es-Sa'idiyeh, laaja kumpare, jota kaivoivat J. B. Pritchard ja myöhemmin J. N. Tubb, vaikka kaivajat mieluummin tunnistivat sen Saretaniksi; myös läheisiä Tell el-Qosia, Tell el-Mazaria ja Khirbet Buweibia on ehdotettu. Kysymys on yhä avoin."
  vi:
    - "Xa-phôn là một thị trấn của Gát trong thung lũng Giô-đanh, phía đông sông. Giô-suê kể nó cùng Bết-Ha-ram, Bết-Nim-ra và Su-cốt như “phần còn lại của nước Si-hôn, vua Hết-bôn; luôn sông Giô-đanh và miền Giô-đanh cho đến cuối biển Ki-nê-rết tại bên kia sông Giô-đanh về phía đông”. Lần nêu thứ hai kém chắc chắn hơn. Khi người Ép-ra-im đến cãi với Giép-thê sau chiến thắng của ông trước Am-môn, bản King James nói họ đi lên phía bắc; từ Hê-bơ-rơ, tsaphonah, cũng có thể nghĩa là “đến Xa-phôn”, và nhiều bản dịch hiện đại đọc như vậy, cũng như bản Synodal với dạng tên riêng của nó: «перешли в Севину». Nếu thế, Xa-phôn là nơi Ép-ra-im qua Giô-đanh để đối đầu Giép-thê, trước cuộc tàn sát tại các chỗ cạn theo sau phép thử “Si-bô-lết”."
    - "Tên nghĩa là “phương bắc”, và không biết gì khác về lịch sử thị trấn. Talmud Giê-ru-sa-lem đồng nhất nó với Amathus, nhưng hầu hết học giả tìm nó ở trung thung lũng Giô-đanh phía bắc Su-cốt. Ứng viên chính của bản đồ là Tell es-Sa'idiyeh, một gò lớn do J. B. Pritchard và về sau J. N. Tubb khai quật, dù những người khai quật ưa đồng nhất nó với Xa-rê-than; Tell el-Qos, Tell el-Mazar và Khirbet Buweib gần đó cũng đã được đề nghị. Câu hỏi vẫn bỏ ngỏ."
  ro:
    - "Țafon era o cetate a lui Gad în valea Iordanului, la est de râu. Iosua o enumeră împreună cu Bet-Aram, Bet-Nimra și Sucot ca „cealaltă împărăție a lui Sion împăratul Esevonului, și Iordanul va fi hotar la partea mării Heneret dincolo de Iordan spre răsărit”. A doua mențiune este mai puțin sigură. Când oamenii lui Efraim au venit să se certe cu Ieftae după victoria lui asupra Amonului, Biblia King James spune că ei „au mers spre nord”; cuvântul ebraic tsaphonah poate însemna și „la Țafon”, iar multe traduceri moderne îl citesc așa, la fel ca textul sinodal rus, cu forma sa proprie a numelui: „au trecut în Sevina”. Dacă e așa, Țafon era locul unde Efraim a trecut Iordanul ca să-l înfrunte pe Ieftae, înainte de măcelul de la vaduri care a urmat probei cu „Shivolet”."
    - "Numele înseamnă „nord”, și nimic altceva nu se știe despre istoria cetății. Talmudul din Ierusalim o identifică cu Amatus, dar cei mai mulți cercetători o caută în valea centrală a Iordanului, la nord de Sucot. Principalul candidat al hărții este Tell es-Sa'idiyeh, o movilă mare săpată de J. B. Pritchard și mai târziu de J. N. Tubb, deși cei care au săpat-o preferau s-o identifice cu Țartan; au mai fost propuse Tell el-Qos, Tell el-Mazar și Khirbet Buweib din apropiere. Întrebarea rămâne deschisă."
  bg:
    - "Цафон бил град на Гад в Йорданската долина, източно от реката. Книгата Иисус Навин го изброява заедно с Бет-Арам, Бет-Нимра и Сокхот като „остатъкът от царството на Сиона Есевонския цар, и пределът Иордан до края на морето Хинерот“. Второто споменаване е по-несигурно. Когато ефремовите мъже дошли да се карат с Йефтай след победата му над Амон, King James Bible казва, че те „преминаха към север“; еврейската дума цафона може да означава и „към Цафон“, и много съвременни преводи я четат така, както и руският Синодален текст със собствената си форма на името: «перешли в Севину». Ако е така, Цафон е мястото, където Ефрем преминал Йордан, за да се изправи срещу Йефтай, преди клането при бродовете, последвало изпитанието с „Шиболет“."
    - "Името означава „север“ и нищо друго не се знае за историята на града. Йерусалимският Талмуд го отъждествява с Аматус, но повечето учени го търсят в централната Йорданска долина северно от Сокхот. Главният кандидат на картата е Тел ес-Саидие — голяма могила, разкопавана от Дж. Б. Притчард и по-късно от Дж. Н. Тъб, макар разкопвачите ѝ да предпочитали да я отъждествят с Цартан; предлагани са и близките Тел ел-Кос, Тел ел-Мазар и Хирбет Бувейб. Въпросът остава открит."
