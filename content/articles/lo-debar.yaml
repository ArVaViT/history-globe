# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the candidates are given without choosing; the reading of Amos 6:13 and Joshua 13:26 as the same name is noted as a reading.
id: lo-debar
place: a376eed
title:
  en: "Lo-debar"
  ru: "Лодевар"
  uk: "Лодебар"
  es: "Lo-debar"
  pt: "Lo-Debar"
  de: "Lo-Dabar"
  fr: "Lo-Debar"
body:
  en:
    - "Lo-debar was a town of Gilead, east of the Jordan, known for the house of Machir the son of Ammiel. There Mephibosheth, the lame son of Jonathan, was living in obscurity when David asked whether any of Saul's house was left: “Behold, he is in the house of Machir, the son of Ammiel, in Lo-debar”, said Ziba, and the king sent and fetched him to eat at his table. Years later, when David fled from Absalom to Mahanaim, the same Machir, with Shobi of Rabbah and Barzillai of Rogelim, brought beds, wheat, barley, beans and honey for the hungry army. The name may also hide in Joshua's list of Gad, where the border runs “from Mahanaim unto the border of Debir”, a form that many read as Lidebir, the same town."
    - "Amos plays on the name. Mocking the pride of Israel under Jeroboam II, who had won back land east of the Jordan, he calls them “Ye which rejoice in a thing of nought”, in Hebrew lo dabar, and asks, “Have we not taken to us horns”, Karnaim. The Russian Bible keeps the sense and loses the pun. The two names seem to be two towns the king had taken, so Lo-debar lay in the north of Gilead, in the country where Israel and Damascus fought."
    - "Where exactly is not settled. The town must be near Mahanaim and the Jordan valley, and the candidates on the map lie between the Yarmuk and the Jabbok: Tel Dover at the mouth of the Yarmuk, Umm ed-Debar south of it, whose name resembles the biblical one, Tell el-Hamme in the valley, and Ibdar, Khirbet Hamid and Tell el-Mughanniya on the hills. None is confirmed by an inscription. Today this is the north-west of Jordan, between Irbid and the Jordan river, and the Israeli side of the Yarmuk below the Golan."
  ru:
    - "Лодевар — город Галаада к востоку от Иордана, известный домом Махира, сына Аммиила. Там в безвестности жил Мемфивосфей, хромой сын Ионафана, когда Давид спросил, не остался ли кто из дома Саулова: «вот, он в доме Махира, сына Аммиэлова, в Лодеваре», сказал Сива, и царь послал и взял его к своему столу. Годы спустя, когда Давид бежал от Авессалома в Маханаим, тот же Махир вместе с Сови из Раввы и Верзеллием из Роглима принёс постели, пшеницу, ячмень, бобы и мёд для голодного войска. Имя, возможно, скрыто и в списке Гада у Иисуса Навина, где предел идёт «от Маханаима до пределов Давира»: многие читают это как Лидевир, тот же город."
    - "Амос играет этим именем. Насмехаясь над гордостью Израиля при Иеровоаме II, который отвоевал земли за Иорданом, он зовёт их «вы, которые восхищаетесь ничтожными вещами», по-еврейски «ло давар», и спрашивает, не своей ли силой они добыли себе рога — по-еврейски «карнаим», как зовётся второй город. Русская Библия сохраняет смысл и теряет игру слов. Два имени, по-видимому, два города, взятые царём, так что Лодевар лежал на севере Галаада, в краю, за который воевали Израиль и Дамаск."
    - "Где именно — не решено. Город должен быть близ Маханаима и долины Иордана, и кандидаты на карте лежат между Ярмуком и Иавоком: Тель-Довер в устье Ярмука, Умм-эд-Дебар южнее, чьё имя похоже на библейское, Телль-эль-Хамме в долине и Ибдар, Хирбет-Хамид и Телль-эль-Муганния на холмах. Ни один не подтверждён надписью. Сегодня это северо-запад Иордании между Ирбидом и рекой Иордан и израильский берег Ярмука под Голанами."
  uk:
    - "Лодебар був містом Гілеаду, на схід від Йордану, відомим домом Махіра, сина Амміїла. Там жив у безвісті Мефівошет, кульгавий син Йонатана, коли Давид запитав, чи не залишився ще хтось з дому Саула: «Пробуває в домі Махировому Аммієленковому, в Лодебарі», — сказав Сіва, і цар послав і забрав його їсти за своїм столом. Через роки, коли Давид утікав від Авесалома до Маханаїма, той самий Махір, разом із Сові з Рабби й Верзеллієм з Рогеліма, приніс ліжка, пшеницю, ячмінь, боби та мед для голодного війська. Назва, можливо, ховається й в переліку Гада в Ісуса Навина, де межа йде «від Маганаїму до займища Дебирського», у формі, яку багато хто читає як Лідебір, те саме місто."
    - "Амос грає на цій назві. Глузуючи з гордині Ізраїлю за Єровоама II, який повернув землі на схід від Йордану, він називає їх «Ви, що втїшаєтесь марнотою», староєврейською ло-дабар, і питає: «Хиба ми не нашою силою здобували свою могутність?» — у староєврейському тексті тут чи не здобули ми собі роги, тобто Карнаїм. Текст Куліша зберігає зміст і втрачає гру слів. Дві назви, схоже, позначають два міста, які взяв цар, тож Лодебар лежав на півночі Гілеаду, в краї, де билися Ізраїль і Дамаск."
    - "Де саме — не встановлено. Місто має бути поблизу Маханаїма й долини Йордану, і кандидати на мапі лежать між Ярмуком і Яббоком: Тель-Довер при гирлі Ярмуку, Умм-ед-Дебар на південь від нього, чия назва схожа на біблійну, Телль-ель-Хамме в долині, а також Ібдар, Хірбет-Хамід і Телль-ель-Муганнія на пагорбах. Жодне не підтверджене написом. Сьогодні це північний захід Йорданії, між Ірбідом і річкою Йордан, та ізраїльський бік Ярмуку під Голанами."
  es:
    - "Lo-debar era una ciudad de Galaad, al este del Jordán, conocida por la casa de Maquir, hijo de Amiel. Allí vivía en la oscuridad Mefi-boset, el hijo cojo de Jonatán, cuando David preguntó si quedaba alguien de la casa de Saúl: «He aquí, está en casa de Machîr hijo de Amiel, en Lodebar», dijo Siba, y el rey mandó a buscarlo para que comiera a su mesa. Años después, cuando David huyó de Absalón a Mahanaim, el mismo Maquir, con Sobi de Rabá y Barzilai de Rogelim, trajo camas, trigo, cebada, habas y miel para el ejército hambriento. El nombre puede esconderse también en la lista de Gad de Josué, donde la frontera va «desde Mahanaim hasta el término de Debir», forma que muchos leen como Lidebir, la misma ciudad."
    - "Amós juega con el nombre. Burlándose del orgullo de Israel bajo Jeroboam II, que había recuperado tierras al este del Jordán, les dice «Vosotros que os alegráis en nada», en hebreo lo dabar, y pregunta si no han tomado para sí cuernos, Carnaim. La Biblia rusa conserva el sentido y pierde el juego de palabras. Los dos nombres parecen ser dos ciudades que el rey había tomado, de modo que Lo-debar estaba en el norte de Galaad, en la región donde combatían Israel y Damasco."
    - "No está resuelto el lugar exacto. La ciudad debe de estar cerca de Mahanaim y del valle del Jordán, y los candidatos del mapa se hallan entre el Yarmuk y el Jaboc: Tel Dover, en la desembocadura del Yarmuk, Umm ed-Debar, al sur, cuyo nombre se parece al bíblico, Tell el-Hamme, en el valle, e Ibdar, Khirbet Hamid y Tell el-Mughanniya, en las colinas. Ninguno está confirmado por una inscripción. Hoy es el noroeste de Jordania, entre Irbid y el río Jordán, y el lado israelí del Yarmuk bajo el Golán."
  pt:
    - "Lo-Debar era uma cidade de Gileade, a leste do Jordão, conhecida pela casa de Maquir, filho de Amiel. Ali vivia obscuramente Mefibosete, o filho coxo de Jônatas, quando Davi perguntou se restava alguém da casa de Saul: “Eis que ele está na casa de Maquir, filho de Amiel, em Lo-Debar”, disse Ziba, e o rei mandou buscá-lo para comer à sua mesa. Anos depois, quando Davi fugiu de Absalão para Maanaim, o mesmo Maquir, com Sobi de Rabá e Barzilai de Rogelim, trouxe camas, trigo, cevada, feijão e mel para o exército faminto. O nome talvez também se esconda na lista de Gade em Josué, em que a fronteira corre “desde Maanaim até a fronteira de Debir”, forma que muitos leem como Lidebir, a mesma cidade."
    - "Amós joga com o nome. Zombando do orgulho de Israel sob Jeroboão II, que recuperara terras a leste do Jordão, chama-os “vocês que se alegram com uma coisa de nada”, em hebraico lo dabar, e pergunta: “Não tomamos para nós chifres”, Carnaim. A Bíblia russa conserva o sentido e perde o jogo de palavras. Os dois nomes parecem ser duas cidades que o rei tomara, de modo que Lo-Debar ficava no norte de Gileade, na região onde Israel e Damasco combatiam."
    - "Onde exatamente não está resolvido. A cidade deve estar perto de Maanaim e do vale do Jordão, e os candidatos no mapa situam-se entre o Yarmuk e o Jaboque: Tel Dover, na foz do Yarmuk, Umm ed-Debar, ao sul dele, cujo nome se assemelha ao bíblico, Tell el-Hamme, no vale, e Ibdar, Khirbet Hamid e Tell el-Mughanniya, nas colinas. Nenhum é confirmado por uma inscrição. Hoje trata-se do noroeste da Jordânia, entre Irbid e o rio Jordão, e do lado israelense do Yarmuk, abaixo do Golã."
  de:
    - "Lo-Dabar war eine Stadt in Gilead östlich des Jordan, bekannt durch das Haus Machirs, des Sohnes Ammiëls. Dort lebte Mefi-Boschet, der lahme Sohn Jonatans, unbeachtet, als David fragte, ob noch jemand vom Haus Sauls übrig sei: „Siehe, er ist zu Lo-Dabar im Hause Machirs, des Sohnes Ammiels“, sagte Ziba, und der König ließ ihn holen, damit er an seinem Tisch äße. Jahre später, als David vor Absalom nach Mahanajim floh, brachte derselbe Machir mit Schobi von Rabba und Barsillai von Roglim Betten, Weizen, Gerste, Bohnen und Honig für das hungrige Heer. Der Name steckt vielleicht auch in der Liste Gads bei Josua, wo die Grenze „von Mahanaim bis an die Grenze Debirs“ verläuft, eine Form, die viele als Lidebir, dieselbe Stadt, lesen."
    - "Amos spielt mit dem Namen. Er verspottet den Stolz Israels unter Jerobeam II., der Land östlich des Jordan zurückgewonnen hatte, und nennt sie Leute, die sich „des, das so gar nichts ist“ trösten, hebräisch lo dabar, und fragt: „Sind wir denn nicht stark genug mit unsern Hörnern?“, Karnajim. Luther behält den Sinn und verliert das Wortspiel. Die beiden Namen scheinen zwei Städte zu sein, die der König genommen hatte, sodass Lo-Dabar im Norden Gileads lag, in dem Land, wo Israel und Damaskus kämpften."
    - "Wo genau, ist nicht geklärt. Die Stadt muss nahe Mahanajim und dem Jordantal liegen, und die Kandidaten auf der Karte liegen zwischen Jarmuk und Jabbok: Tel Dover an der Mündung des Jarmuk, Umm ed-Debar südlich davon, dessen Name dem biblischen ähnelt, Tell el-Hamme im Tal und Ibdar, Khirbet Hamid und Tell el-Mughanniya auf den Hügeln. Keiner ist durch eine Inschrift bestätigt. Heute ist dies der Nordwesten Jordaniens zwischen Irbid und dem Jordan sowie die israelische Seite des Jarmuk unterhalb der Golanhöhen."
  fr:
    - "Lo-Debar était une ville de Galaad, à l’est du Jourdain, connue pour la maison de Makir, fils d’Ammiel. C’est là que Mephiboscheth, le fils boiteux de Jonathan, vivait obscurément quand David demanda s’il restait quelqu’un de la maison de Saül : « Il est dans la maison de Makir, fils d’Ammiel, à Lodebar », dit Tsiba, et le roi l’envoya chercher pour qu’il mange à sa table. Des années plus tard, quand David, fuyant Absalom, arriva à Mahanaïm, le même Makir, avec Schobi de Rabba et Barzillaï de Roguelim, apporta des lits, du froment, de l’orge, des fèves et du miel pour l’armée affamée. Le nom se cache peut-être aussi dans la liste de Gad chez Josué, où la limite va « depuis Mahanaïm jusqu’à la frontière de Debir », forme que beaucoup lisent Lidebir, la même ville."
    - "Amos joue sur le nom. Se moquant de l’orgueil d’Israël sous Jéroboam II, qui avait reconquis des terres à l’est du Jourdain, il leur dit : « Vous vous réjouissez de ce qui n’est que néant », en hébreu lo dabar, puis leur fait demander s’ils ne se sont pas pris des cornes, Karnaïm. La Bible russe garde le sens et perd le jeu de mots. Les deux noms semblent être deux villes que le roi avait prises, de sorte que Lo-Debar se trouvait dans le nord de Galaad, dans le pays où Israël et Damas se battaient."
    - "L’emplacement exact n’est pas établi. La ville doit se trouver près de Mahanaïm et de la vallée du Jourdain, et les candidats de la carte se situent entre le Yarmouk et le Jabbok : Tel Dover à l’embouchure du Yarmouk, Umm ed-Debar au sud, dont le nom ressemble au nom biblique, Tell el-Hamme dans la vallée, et Ibdar, Khirbet Hamid et Tell el-Mughanniya sur les collines. Aucun n’est confirmé par une inscription. Aujourd’hui, c’est le nord-ouest de la Jordanie, entre Irbid et le Jourdain, et le côté israélien du Yarmouk au-dessous du Golan."
