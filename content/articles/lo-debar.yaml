body:
  en:
    - "Lo-debar was a town of Gilead, east of the Jordan, known for the house of Machir the son of Ammiel. There Mephibosheth, the lame son of Jonathan, was living in obscurity when David asked whether any of Saul's house was left: “Behold, he is in the house of Machir, the son of Ammiel, in Lo-debar”, said Ziba, and the king sent and fetched him to eat at his table. Years later, when David fled from Absalom to Mahanaim, the same Machir, with Shobi of Rabbah and Barzillai of Rogelim, brought beds, wheat, barley, beans and honey for the hungry army. The name may also hide in Joshua's list of Gad, where the border runs “from Mahanaim unto the border of Debir”, a form that many read as Lidebir, the same town."
    - "Amos plays on the name. Mocking the pride of Israel under Jeroboam II, who had won back land east of the Jordan, he calls them “Ye which rejoice in a thing of nought”, in Hebrew lo dabar, and asks, “Have we not taken to us horns”, Karnaim. The Russian Bible keeps the sense and loses the pun. The two names seem to be two towns the king had taken, so Lo-debar lay in the north of Gilead, in the country where Israel and Damascus fought."
    - "Where exactly is not settled. The town must be near Mahanaim and the Jordan valley, and the candidates on the map lie along the Yarmuk and south of it toward the Jabbok: Tel Dover at the mouth of the Yarmuk, Umm ed-Debar south of it, whose name resembles the biblical one, Tell el-Hamme in the valley, and Ibdar, Khirbet Hamid and Tell el-Mughanniya on the hills. None is confirmed by an inscription. Today this is the north-west of Jordan, between Irbid and the Jordan river, and the Israeli side of the Yarmuk below the Golan."
  ru:
    - "Лодевар — город Галаада к востоку от Иордана, известный домом Махира, сына Аммиила. Там в безвестности жил Мемфивосфей, хромой сын Ионафана, когда Давид спросил, не остался ли кто из дома Саулова: «вот, он в доме Махира, сына Аммиэлова, в Лодеваре», сказал Сива, и царь послал и взял его к своему столу. Годы спустя, когда Давид бежал от Авессалома в Маханаим, тот же Махир вместе с Сови из Раввы и Верзеллием из Роглима принёс постели, пшеницу, ячмень, бобы и мёд для голодного войска. Имя, возможно, скрыто и в списке Гада у Иисуса Навина, где предел идёт «от Маханаима до пределов Давира»: многие читают это как Лидевир, тот же город."
    - "Амос играет этим именем. Насмехаясь над гордостью Израиля при Иеровоаме II, который отвоевал земли за Иорданом, он зовёт их «вы, которые восхищаетесь ничтожными вещами», по-еврейски «ло давар», и спрашивает, не своей ли силой они добыли себе рога — по-еврейски «карнаим», как зовётся второй город. Русская Библия сохраняет смысл и теряет игру слов. Два имени, по-видимому, два города, взятые царём, так что Лодевар лежал на севере Галаада, в краю, за который воевали Израиль и Дамаск."
    - "Где именно — не решено. Город должен быть близ Маханаима и долины Иордана, и кандидаты на карте лежат вдоль Ярмука и южнее, в сторону Иавока: Тель-Довер в устье Ярмука, Умм-эд-Дебар южнее, чьё имя похоже на библейское, Телль-эль-Хамме в долине и Ибдар, Хирбет-Хамид и Телль-эль-Муганния на холмах. Ни один не подтверждён надписью. Сегодня это северо-запад Иордании между Ирбидом и рекой Иордан и израильский берег Ярмука под Голанами."
  uk:
    - "Лодебар був містом Гілеаду, на схід від Йордану, відомим домом Махіра, сина Амміїла. Там жив у безвісті Мефівошет, кульгавий син Йонатана, коли Давид запитав, чи не залишився ще хтось з дому Саула: «Пробуває в домі Махировому Аммієленковому, в Лодебарі», — сказав Сіва, і цар послав і забрав його їсти за своїм столом. Через роки, коли Давид утікав від Авесалома до Маханаїма, той самий Махір, разом із Сові з Рабби й Верзеллієм з Рогеліма, приніс ліжка, пшеницю, ячмінь, боби та мед для голодного війська. Назва, можливо, ховається й в переліку Гада в Ісуса Навина, де межа йде «від Маганаїму до займища Дебирського», у формі, яку багато хто читає як Лідебір, те саме місто."
    - "Амос грає на цій назві. Глузуючи з гордині Ізраїлю за Єровоама II, який повернув землі на схід від Йордану, він називає їх «Ви, що втїшаєтесь марнотою», староєврейською ло-дабар, і питає: «Хиба ми не нашою силою здобували свою могутність?» — у староєврейському тексті тут чи не здобули ми собі роги, тобто Карнаїм. Текст Куліша зберігає зміст і втрачає гру слів. Дві назви, схоже, позначають два міста, які взяв цар, тож Лодебар лежав на півночі Гілеаду, в краї, де билися Ізраїль і Дамаск."
    - "Де саме — не встановлено. Місто має бути поблизу Маханаїма й долини Йордану, і кандидати на мапі лежать уздовж Ярмуку й на південь від нього в бік Яббоку: Тель-Довер при гирлі Ярмуку, Умм-ед-Дебар на південь від нього, чия назва схожа на біблійну, Телль-ель-Хамме в долині, а також Ібдар, Хірбет-Хамід і Телль-ель-Муганнія на пагорбах. Жодне не підтверджене написом. Сьогодні це північний захід Йорданії, між Ірбідом і річкою Йордан, та ізраїльський бік Ярмуку під Голанами."
  es:
    - "Lo-debar era una ciudad de Galaad, al este del Jordán, conocida por la casa de Maquir, hijo de Amiel. Allí vivía en la oscuridad Mefi-boset, el hijo cojo de Jonatán, cuando David preguntó si quedaba alguien de la casa de Saúl: «He aquí, está en casa de Machîr hijo de Amiel, en Lodebar», dijo Siba, y el rey mandó a buscarlo para que comiera a su mesa. Años después, cuando David huyó de Absalón a Mahanaim, el mismo Maquir, con Sobi de Rabá y Barzilai de Rogelim, trajo camas, trigo, cebada, habas y miel para el ejército hambriento. El nombre puede esconderse también en la lista de Gad de Josué, donde la frontera va «desde Mahanaim hasta el término de Debir», forma que muchos leen como Lidebir, la misma ciudad."
    - "Amós juega con el nombre. Burlándose del orgullo de Israel bajo Jeroboam II, que había recuperado tierras al este del Jordán, les dice «Vosotros que os alegráis en nada», en hebreo lo dabar, y pregunta si no han tomado para sí cuernos, Carnaim. La Biblia rusa conserva el sentido y pierde el juego de palabras. Los dos nombres parecen ser dos ciudades que el rey había tomado, de modo que Lo-debar estaba en el norte de Galaad, en la región donde combatían Israel y Damasco."
    - "No está resuelto el lugar exacto. La ciudad debe de estar cerca de Mahanaim y del valle del Jordán, y los candidatos del mapa se hallan a lo largo del Yarmuk y al sur de él, hacia el Jaboc: Tel Dover, en la desembocadura del Yarmuk, Umm ed-Debar, al sur, cuyo nombre se parece al bíblico, Tell el-Hamme, en el valle, e Ibdar, Khirbet Hamid y Tell el-Mughanniya, en las colinas. Ninguno está confirmado por una inscripción. Hoy es el noroeste de Jordania, entre Irbid y el río Jordán, y el lado israelí del Yarmuk bajo el Golán."
  pt:
    - "Lo-Debar era uma cidade de Gileade, a leste do Jordão, conhecida pela casa de Maquir, filho de Amiel. Ali vivia obscuramente Mefibosete, o filho coxo de Jônatas, quando Davi perguntou se restava alguém da casa de Saul: “Eis que ele está na casa de Maquir, filho de Amiel, em Lo-Debar”, disse Ziba, e o rei mandou buscá-lo para comer à sua mesa. Anos depois, quando Davi fugiu de Absalão para Maanaim, o mesmo Maquir, com Sobi de Rabá e Barzilai de Rogelim, trouxe camas, trigo, cevada, feijão e mel para o exército faminto. O nome talvez também se esconda na lista de Gade em Josué, em que a fronteira corre “desde Maanaim até a fronteira de Debir”, forma que muitos leem como Lidebir, a mesma cidade."
    - "Amós joga com o nome. Zombando do orgulho de Israel sob Jeroboão II, que recuperara terras a leste do Jordão, chama-os “vocês que se alegram com uma coisa de nada”, em hebraico lo dabar, e pergunta: “Não tomamos para nós chifres”, Carnaim. A Bíblia russa conserva o sentido e perde o jogo de palavras. Os dois nomes parecem ser duas cidades que o rei tomara, de modo que Lo-Debar ficava no norte de Gileade, na região onde Israel e Damasco combatiam."
    - "Onde exatamente não está resolvido. A cidade deve estar perto de Maanaim e do vale do Jordão, e os candidatos no mapa situam-se ao longo do Yarmuk e ao sul dele, rumo ao Jaboque: Tel Dover, na foz do Yarmuk, Umm ed-Debar, ao sul dele, cujo nome se assemelha ao bíblico, Tell el-Hamme, no vale, e Ibdar, Khirbet Hamid e Tell el-Mughanniya, nas colinas. Nenhum é confirmado por uma inscrição. Hoje trata-se do noroeste da Jordânia, entre Irbid e o rio Jordão, e do lado israelense do Yarmuk, abaixo do Golã."
  de:
    - "Lo-Dabar war eine Stadt in Gilead östlich des Jordan, bekannt durch das Haus Machirs, des Sohnes Ammiëls. Dort lebte Mefi-Boschet, der lahme Sohn Jonatans, unbeachtet, als David fragte, ob noch jemand vom Haus Sauls übrig sei: „Siehe, er ist zu Lo-Dabar im Hause Machirs, des Sohnes Ammiels“, sagte Ziba, und der König ließ ihn holen, damit er an seinem Tisch äße. Jahre später, als David vor Absalom nach Mahanajim floh, brachte derselbe Machir mit Schobi von Rabba und Barsillai von Roglim Betten, Weizen, Gerste, Bohnen und Honig für das hungrige Heer. Der Name steckt vielleicht auch in der Liste Gads bei Josua, wo die Grenze „von Mahanaim bis an die Grenze Debirs“ verläuft, eine Form, die viele als Lidebir, dieselbe Stadt, lesen."
    - "Amos spielt mit dem Namen. Er verspottet den Stolz Israels unter Jerobeam II., der Land östlich des Jordan zurückgewonnen hatte, und nennt sie Leute, die sich „des, das so gar nichts ist“ trösten, hebräisch lo dabar, und fragt: „Sind wir denn nicht stark genug mit unsern Hörnern?“, Karnajim. Luther behält den Sinn und verliert das Wortspiel. Die beiden Namen scheinen zwei Städte zu sein, die der König genommen hatte, sodass Lo-Dabar im Norden Gileads lag, in dem Land, wo Israel und Damaskus kämpften."
    - "Wo genau, ist nicht geklärt. Die Stadt muss nahe Mahanajim und dem Jordantal liegen, und die Kandidaten auf der Karte liegen am Jarmuk und südlich davon in Richtung Jabbok: Tel Dover an der Mündung des Jarmuk, Umm ed-Debar südlich davon, dessen Name dem biblischen ähnelt, Tell el-Hamme im Tal und Ibdar, Khirbet Hamid und Tell el-Mughanniya auf den Hügeln. Keiner ist durch eine Inschrift bestätigt. Heute ist dies der Nordwesten Jordaniens zwischen Irbid und dem Jordan sowie die israelische Seite des Jarmuk unterhalb der Golanhöhen."
  fr:
    - "Lo-Debar était une ville de Galaad, à l’est du Jourdain, connue pour la maison de Makir, fils d’Ammiel. C’est là que Mephiboscheth, le fils boiteux de Jonathan, vivait obscurément quand David demanda s’il restait quelqu’un de la maison de Saül : « Il est dans la maison de Makir, fils d’Ammiel, à Lodebar », dit Tsiba, et le roi l’envoya chercher pour qu’il mange à sa table. Des années plus tard, quand David, fuyant Absalom, arriva à Mahanaïm, le même Makir, avec Schobi de Rabba et Barzillaï de Roguelim, apporta des lits, du froment, de l’orge, des fèves et du miel pour l’armée affamée. Le nom se cache peut-être aussi dans la liste de Gad chez Josué, où la limite va « depuis Mahanaïm jusqu’à la frontière de Debir », forme que beaucoup lisent Lidebir, la même ville."
    - "Amos joue sur le nom. Se moquant de l’orgueil d’Israël sous Jéroboam II, qui avait reconquis des terres à l’est du Jourdain, il leur dit : « Vous vous réjouissez de ce qui n’est que néant », en hébreu lo dabar, puis leur fait demander s’ils ne se sont pas pris des cornes, Karnaïm. La Bible russe garde le sens et perd le jeu de mots. Les deux noms semblent être deux villes que le roi avait prises, de sorte que Lo-Debar se trouvait dans le nord de Galaad, dans le pays où Israël et Damas se battaient."
    - "L’emplacement exact n’est pas établi. La ville doit se trouver près de Mahanaïm et de la vallée du Jourdain, et les candidats de la carte se situent le long du Yarmouk et au sud de celui-ci, vers le Jabbok : Tel Dover à l’embouchure du Yarmouk, Umm ed-Debar au sud, dont le nom ressemble au nom biblique, Tell el-Hamme dans la vallée, et Ibdar, Khirbet Hamid et Tell el-Mughanniya sur les collines. Aucun n’est confirmé par une inscription. Aujourd’hui, c’est le nord-ouest de la Jordanie, entre Irbid et le Jourdain, et le côté israélien du Yarmouk au-dessous du Golan."
  it:
    - "Lo-Debar era una città di Galaad, a est del Giordano, nota per la casa di Machir figlio di Ammiel. Là viveva nell’oscurità Mefiboset, il figlio zoppo di Gionata, quando Davide chiese se fosse rimasto qualcuno della casa di Saul: «E’ in casa di Makir, figliuolo di Ammiel, a Lodebar», disse Siba, e il re lo mandò a prendere perché mangiasse alla sua tavola. Anni dopo, quando Davide fuggì da Assalonne a Maanaim, lo stesso Machir, con Sobi di Rabba e Barzillai di Roghelim, portò letti, grano, orzo, fave e miele per l’esercito affamato. Il nome può nascondersi anche nell’elenco di Gad in Giosuè, dove il confine corre «da Mahanaim sino al confine di Debir», forma che molti leggono come Lidebir, la stessa città."
    - "Amos gioca sul nome. Deridendo l’orgoglio d’Israele sotto Geroboamo II, che aveva riconquistato terra a oriente del Giordano, li chiama «Voi, che vi rallegrate di cose da nulla», in ebraico lo dabar, e chiede se non abbiano preso per sé delle corna, Karnaim. La Bibbia russa conserva il senso e perde il gioco di parole. I due nomi sembrano essere due città che il re aveva preso, così Lo-Debar si trovava nel nord di Galaad, nel paese dove Israele e Damasco combattevano."
    - "Dove esattamente non è stabilito. La città deve essere vicina a Maanaim e alla valle del Giordano, e i candidati sulla mappa giacciono lungo lo Yarmuk e a sud di esso verso lo Iabbok: Tel Dover alla foce dello Yarmuk, Umm ed-Debar a sud di essa, il cui nome somiglia a quello biblico, Tell el-Hamme nella valle, e Ibdar, Khirbet Hamid e Tell el-Mughanniya sulle colline. Nessuno è confermato da un’iscrizione. Oggi questa è la Giordania nord-occidentale, tra Irbid e il fiume Giordano, e il lato israeliano dello Yarmuk sotto il Golan."
  pl:
    - "Lo-Debar było miastem w Gileadzie, na wschód od Jordanu, znanym z domu Makira, syna Ammiela. Mieszkał tam w ukryciu Mefiboszet, kulawy syn Jonatana, gdy Dawid zapytał, czy ktoś pozostał z domu Saula: „Oto, jest w domu Machira, syna Ammijelowego, w Lodebarze”, powiedział Syba, i król posłał i sprowadził go, by jadł przy jego stole. Lata później, gdy Dawid uciekał przed Absalomem do Mahanaim, ten sam Makir, wraz z Szobim z Rabby i Barzillajem z Rogelim, przyniósł łóżka, pszenicę, jęczmień, bób i miód dla głodnego wojska. Nazwa może też kryć się na liście Gada u Jozuego, gdzie granica biegnie „od Mahanaim aż do granicy Dabir”, formy, którą wielu czyta jako Lidebir, to samo miasto."
    - "Amos gra tą nazwą. Szydząc z dumy Izraela za Jeroboama II, który odzyskał ziemię na wschód od Jordanu, woła do nich: „którzy się weselicie, a niemasz z czego”, po hebrajsku lo dabar, i pyta: „Izaliśmy sobie nie naszą mocą wzięli rogi?”, czyli Karnaim. Biblia rosyjska zachowuje sens i traci grę słów. Te dwie nazwy zdają się oznaczać dwa miasta zdobyte przez króla, więc Lo-Debar leżało w północnym Gileadzie, w kraju, w którym walczyli Izrael i Damaszek."
    - "Gdzie dokładnie, nie jest ustalone. Miasto musi leżeć blisko Mahanaim i doliny Jordanu, a kandydaci na mapie leżą wzdłuż Jarmuku i na południe od niego, ku Jabbokowi: Tel Dover przy ujściu Jarmuku, Umm ed-Debar na południe od niego, której nazwa przypomina biblijną, Tell el-Hamme w dolinie oraz Ibdar, Khirbet Hamid i Tell el-Mughanniya na wzgórzach. Żaden nie jest potwierdzony inskrypcją. Dziś jest to północny zachód Jordanii, między Irbidem a rzeką Jordan, oraz izraelska strona Jarmuku poniżej Golanu."
  nl:
    - "Lo-Debar was een stad in Gilead, ten oosten van de Jordaan, bekend om het huis van Machir, de zoon van Ammiël. Daar leefde Mefiboset, de kreupele zoon van Jonatan, in de vergetelheid toen David vroeg of er nog iemand van Sauls huis over was: “Zie, hij is in het huis van Machir, den zoon van Ammiel, te Lodebar”, zei Ziba, en de koning liet hem halen om aan zijn tafel te eten. Jaren later, toen David voor Absalom naar Machanaïm vluchtte, brachten dezelfde Machir, met Sobi van Rabba en Barzillai van Rogelim, bedden, tarwe, gerst, bonen en honing voor het hongerige leger. De naam kan ook verborgen zitten in Jozua's lijst van Gad, waar de grens loopt “van Mahanaim tot aan de landpale van Debir”, een vorm die velen lezen als Lidebir, dezelfde stad."
    - "Amos speelt met de naam. Hij bespot de trots van Israël onder Jerobeam II, die land ten oosten van de Jordaan had teruggewonnen, en noemt hen “Gij, die blijde zijt over een nietig ding”, in het Hebreeuws lo dabar, en vraagt: “Hebben wij ons niet door onze sterkte hoornen verkregen?”, Karnaïm. De Russische Bijbel behoudt de zin en verliest de woordspeling. De twee namen lijken twee steden die de koning had ingenomen, zodat Lo-Debar in het noorden van Gilead lag, in het land waar Israël en Damascus streden."
    - "Waar precies is niet vastgesteld. De stad moet bij Machanaïm en het Jordaandal liggen, en de kandidaten op de kaart liggen langs de Jarmoek en ten zuiden daarvan richting de Jabbok: Tel Dover aan de monding van de Jarmoek, Umm ed-Debar ten zuiden daarvan, waarvan de naam op de bijbelse lijkt, Tell el-Hamme in het dal, en Ibdar, Khirbet Hamid en Tell el-Mughanniya op de heuvels. Geen ervan wordt door een inscriptie bevestigd. Tegenwoordig is dit het noordwesten van Jordanië, tussen Irbid en de Jordaan, en de Israëlische kant van de Jarmoek onder de Golan."
  cs:
    - "Lo-debar bylo město Gileadu východně od Jordánu, známé domem Machíra, syna Amielova. Tam žil v neznámu Mefibóšet, chromý syn Jonatanův, když se David tázal, zda z Saulova domu někdo zbyl: „Tam jest v domě Machiry, syna Amielova v Lodebar“, řekl Cíba, a král poslal a přivedl ho, aby jedl u jeho stolu. O léta později, když David prchal před Abšalomem do Machanajimu, přinesli týž Machír spolu se Šobim z Rabby a Barzilajem z Rógelimu lůžka, pšenici, ječmen, boby a med pro hladové vojsko. Jméno se možná ukrývá i v Jozuově seznamu Gádu, kde hranice vede „od Mahanaim až ku pomezí Dabir“, tvar, který mnozí čtou jako Lidebir, totéž město."
    - "Amos si s jménem hraje. Když se vysmívá pýše Izraele za Jarobeáma II., který dobyl zpět zemi východně od Jordánu, nazývá je „Vy, kteříž se veselíte, ano není z čeho“, hebrejsky lo dabar, a ptá se: „Zdaliž jsme svou silou nevzali sobě rohů?“, tedy Karnajim. Ruská Bible zachovává smysl a hru slov ztrácí. Obě jména jsou zřejmě dvě města, která král dobyl, takže Lo-debar leželo na severu Gileadu, v zemi, kde Izrael a Damašek bojovaly."
    - "Kde přesně, není rozhodnuto. Město muselo být blízko Machanajimu a Jordánského údolí a kandidáti na mapě leží podél Jarmuku a jižně od něj směrem k Jaboku: Tel Dover u ústí Jarmuku, Umm ed-Debar jižně od něj, jehož jméno se podobá biblickému, Tell el-Hamme v údolí a Ibdar, Khirbet Hamid a Tell el-Mughanniya na pahorcích. Žádný není potvrzen nápisem. Dnes je to severozápad Jordánska, mezi Irbidem a řekou Jordán, a izraelská strana Jarmuku pod Golánem."
  sv:
    - "Lo-Devar var en stad i Gilead, öster om Jordan, känd för Makirs, Ammiels sons, hus. Där levde Mefivoshet, Jonatans lame son, i skymundan när David frågade om något fanns kvar av Sauls hus: ”Han är nu i Makirs, Ammiels sons, hus i Lo-Debar”, sade Siva, och kungen sände och hämtade honom att äta vid sitt bord. Åratal senare, när David flydde från Absalom till Mahanajim, kom samme Makir, med Shovi från Rabba och Barsillaj från Rogelim, med sängar, vete, korn, bönor och honung åt den hungriga hären. Namnet kan också dölja sig i Josuas förteckning över Gad, där gränsen går ”från Mahanaim ända till Lidebirs område”, en form som många läser som Lidebir, samma stad."
    - "Amos leker med namnet. När han hånar stoltheten hos Israel under Jerobeam II, som hade vunnit tillbaka land öster om Jordan, kallar han dem ”I som glädjen eder över det som är intet värt”, på hebreiska lo dabar, och låter dem säga: ”Genom vår egen styrka hava vi ju berett oss horn”, Karnajim. Den ryska Bibeln bevarar meningen men förlorar ordspelet. De två namnen tycks vara två städer som kungen hade intagit, så Lo-Devar låg i norra Gilead, i det land där Israel och Damaskus stred."
    - "Exakt var är inte avgjort. Staden måste ligga nära Mahanajim och Jordandalen, och kandidaterna på kartan ligger längs Yarmuk och söder därom mot Jabbok: Tel Dover vid Yarmuks mynning, Umm ed-Debar söder om den, vars namn liknar det bibliska, Tell el-Hamme i dalen, samt Ibdar, Khirbet Hamid och Tell el-Mughanniya på höjderna. Ingen bekräftas av en inskrift. I dag är detta nordvästra Jordanien, mellan Irbid och Jordanfloden, och den israeliska sidan av Yarmuk nedanför Golan."
  nb:
    - "Lo-Debar var en by i Gilead, øst for Jordan, kjent for huset til Makir, Ammiels sønn. Der levde Mefibosjet, Jonatans lamme sønn, i det skjulte da David spurte om det var noen igjen av Sauls hus: «Han er i huset hos Makir, sønn av Ammiel, i Lo-Debar», sa Siba, og kongen sendte bud og hentet ham til å ete ved sitt bord. År senere, da David flyktet fra Absalom til Mahanajim, kom den samme Makir, sammen med Sjobi fra Rabba og Barsillai fra Rogelim, med senger, hvete, bygg, bønner og honning til den sultne hæren. Navnet kan også skjule seg i Josvas liste over Gad, der grensen går «fra Mahana'im til Debirs landemerke», en form som mange leser som Lidebir, den samme byen."
    - "Amos leker med navnet. I spott over Israels stolthet under Jeroboam II, som hadde vunnet tilbake land øst for Jordan, kaller han dem «I som gleder eder over det som intet er», på hebraisk lo dabar, og spør om de ikke har tatt seg horn, Karnajim. Den russiske bibelen beholder meningen og mister ordspillet. De to navnene synes å være to byer kongen hadde tatt, så Lo-Debar lå i det nordlige Gilead, i landet der Israel og Damaskus kjempet."
    - "Hvor nøyaktig, er ikke avgjort. Byen må ligge nær Mahanajim og Jordan-dalen, og kandidatene på kartet ligger langs Yarmuk og sør for den mot Jabbok: Tel Dover ved munningen av Yarmuk, Umm ed-Debar sør for den, hvis navn ligner det bibelske, Tell el-Hamme i dalen, og Ibdar, Khirbet Hamid og Tell el-Mughanniya i åsene. Ingen er bekreftet av en innskrift. I dag er dette nordvest i Jordan, mellom Irbid og elven Jordan, og den israelske siden av Yarmuk nedenfor Golan."
  tl:
    - "Ang Lo-debar ay bayan ng Gilead, sa silangan ng Jordan, na kilala dahil sa bahay ni Machir na anak ni Amiel. Doon namumuhay nang di-kilala si Mephiboseth, ang pilay na anak ni Jonathan, nang magtanong si David kung may natira pa sa sambahayan ni Saul: “Narito, siya'y nasa bahay ni Machir na anak ni Amiel, sa Lo-debar”, sabi ni Siba, at ipinasundo siya ng hari upang kumain sa kaniyang hapag. Makalipas ang mga taon, nang tumakas si David kay Absalom patungong Mahanaim, ang gayon ding Machir, kasama si Sobi ng Rabba at si Barzillai ng Rogelim, ay nagdala ng mga higaan, trigo, sebada, habas at pulot para sa gutom na hukbo. Maaaring nakatago rin ang pangalan sa talaan ni Josue sa Gad, kung saan ang hangganan ay tumatakbo “mula sa Mahanaim hanggang sa hangganan ng Debir”, anyong binabasa ng marami bilang Lidebir, ang gayon ding bayan."
    - "Naglalaro sa pangalan si Amos. Sa pagtuya sa pagmamataas ng Israel sa ilalim ni Jeroboam II, na nakabawi ng lupain sa silangan ng Jordan, tinatawag niya silang “Kayong nangagagalak sa isang bagay na walang kabuluhan”, sa Hebreo ay lo dabar, at nagtatanong, “Di baga kami ay nagtaglay para sa amin ng mga sungay”, ang Carnaim. Pinananatili ng Biblia sa Ruso ang kahulugan at nawawala ang laro ng salita. Ang dalawang pangalan ay waring dalawang bayan na nakuha ng hari, kaya ang Lo-debar ay nasa hilaga ng Gilead, sa lupaing pinaglabanan ng Israel at Damasco."
    - "Hindi pa tiyak kung saan eksakto. Ang bayan ay dapat nasa malapit sa Mahanaim at sa libis ng Jordan, at ang mga kandidato sa mapa ay nasa tabi ng Yarmuk at sa timog nito patungo sa Jaboc: ang Tel Dover sa bunganga ng Yarmuk, ang Umm ed-Debar sa timog nito, na ang pangalan ay kahawig ng sa Biblia, ang Tell el-Hamme sa libis, at ang Ibdar, Khirbet Hamid at Tell el-Mughanniya sa mga burol. Walang kinukumpirma ng inskripsiyon. Ngayon ito ang hilagang-kanluran ng Jordan, sa pagitan ng Irbid at ng ilog Jordan, at ang panig na Israeli ng Yarmuk sa ibaba ng Golan."
  da:
    - "Lodebar var en by i Gilead, øst for Jordan, kendt for huset tilhørende Makir, Ammiels søn. Dér levede Mefibosjet, Jonatans lamme søn, i det skjulte, da David spurgte, om nogen af Sauls hus var tilbage: »Se, han er i Makirs, Ammiels Søns, Hus, i Lodebar«, sagde Ziba, og kongen sendte bud og lod ham hente for at spise ved sit bord. År senere, da David flygtede fra Absalon til Mahanajim, bragte den samme Makir, sammen med Sjobi fra Rabba og Barzillaj fra Rogelim, senge, hvede, byg, bønner og honning til den sultne hær. Navnet kan også skjule sig i Josvas liste over Gad, hvor grænsen løber »fra Mahanaim indtil Debirs Landemærke«, en form, som mange læser som Lidebir, den samme by."
    - "Amos spiller på navnet. Idet han håner stoltheden hos Israel under Jeroboam 2., som havde vundet land øst for Jordan tilbage, kalder han dem »I som glædes ved det, som intet er«, på hebraisk lo dabar, og spørger: »Have vi ikke ved vor Styrke taget os Horn?«, Karnajim. Den russiske bibel bevarer meningen og mister ordspillet. De to navne synes at være to byer, kongen havde taget, så Lodebar lå i det nordlige Gilead, i landet, hvor Israel og Damaskus kæmpede."
    - "Hvor præcis er ikke afgjort. Byen må ligge nær Mahanajim og Jordandalen, og kandidaterne på kortet ligger langs Yarmuk og syd for den mod Jabbok: Tel Dover ved Yarmuks munding, Umm ed-Debar syd for den, hvis navn ligner det bibelske, Tell el-Hamme i dalen og Ibdar, Khirbet Hamid og Tell el-Mughanniya på højderne. Ingen er bekræftet af en indskrift. I dag er dette det nordvestlige Jordan, mellem Irbid og Jordanfloden, og den israelske side af Yarmuk nedenfor Golan."
  sr:
    - "Лодевар је био град у Галаду, источно од Јордана, познат по дому Махира, сина Амиловог. Ту је Мефивостеј, хроми Јонатанов син, живео у безвесности када је Давид питао је ли остао ико из Сауловог дома: „Ено га у дому Махира сина Амиловог у Лодевару“, рекао је Сива, и цар је послао да га доведу да једе за његовим столом. Годинама касније, када је Давид бежао од Авесалома у Маханајим, исти Махир, са Совијем из Раве и Варзелајем из Рогелима, донео је постеље, пшеницу, јечам, боб и мед за гладну војску. Име се можда крије и у списку Гадових градова код Исуса Навина, где међа иде „од Маханаима до међе давирске“, облик који многи читају као Лидебир, исти град."
    - "Амос се игра именом. Ругајући се поносу Израиља под Јеровоамом II, који је повратио земљу источно од Јордана, каже им: „Ви се радујете ономе што није ништа“, на хебрејском ло дабар, и пита: „Нисмо ли својом снагом добили рогове?“, то јест Карнајим. Руска Библија чува смисао, а губи игру речи. Чини се да су та два имена два града која је цар заузео, па је Лодевар лежао на северу Галада, у земљи где су се Израиљ и Дамаск борили."
    - "Где тачно, није решено. Град мора бити близу Маханајима и јорданске долине, а кандидати на мапи леже дуж Јармука и јужно од њега према Јавоку: Тел Довер на ушћу Јармука, Умм ед-Дебар јужно од њега, чије име подсећа на библијско, Тел ел-Хамме у долини, и Ибдар, Хирбет Хамид и Тел ел-Муганија на брдима. Ниједан није потврђен натписом. Данас је то северозапад Јордана, између Ирбида и реке Јордан, и израелска страна Јармука испод Голана."
  hu:
    - "Lo-Debár város volt Gileádban, a Jordántól keletre, Mákírnak, Ammiel fiának házáról ismert. Ott élt homályban Mefibóset, Jonatán sánta fia, amikor Dávid megkérdezte, maradt-e valaki Saul házából: „Ímé az Ammiel fiának, Mákirnak házában van Ló-Debárban”, mondta Cíba, és a király elküldött érte, hogy az asztalánál étkezzék. Évekkel később, amikor Dávid Absolon elől Mahanajimba menekült, ugyanez a Mákír, Sóbival Rabbából és Barzillaival Rógelimből, ágyakat, búzát, árpát, babot és mézet hozott az éhező seregnek. A név talán Gád jegyzékében is rejtőzik, ahol a határ „Mahanáimtól Debir határáig” fut, amely alakot sokan Lidebirnek olvasnak, ugyanazon városnak."
    - "Ámós szójátékot csinál a névvel. Gúnyolva Izráel büszkeségét Jeroboám alatt, aki visszahódította a Jordántól keletre fekvő földet, így nevezi őket: „A kik örültök a hiábavaló dolognak”, héberül lo dabar, és kérdi: „Nem a magunk erejével szereztünk-é magunknak a szarvakat?”, vagyis Karnajimot. Az orosz Biblia megtartja az értelmet, de a szójátékot elveszíti. A két név úgy tűnik, két város, amelyet a király elfoglalt, így Lo-Debár Gileád északi részén feküdt, azon a vidéken, ahol Izráel és Damaszkusz harcolt."
    - "Hogy pontosan hol, nem tisztázott. A városnak Mahanajim és a Jordán-völgy közelében kell lennie, és a térkép jelöltjei a Jarmuk mentén és attól délre, a Jabbók felé fekszenek: a Tel Dover a Jarmuk torkolatánál, az Umm ed-Debar tőle délre, amelynek neve hasonlít a bibliaihoz, a völgyben a Tell el-Hamme, a dombokon pedig az Ibdar, a Khirbet Hamid és a Tell el-Mughanniya. Egyiket sem erősíti meg felirat. Ma ez Jordánia északnyugati része Irbid és a Jordán folyó között, valamint a Jarmuk izraeli oldala a Gólán alatt."
  fi:
    - "Lo-Debar oli kaupunki Gileadissa, Jordanin itäpuolella, tunnettu Makirin, Ammielin pojan, talosta. Siellä Mefiboset, Jonatanin rampa poika, eli tuntemattomana, kun Daavid kysyi, oliko Saulin suvusta ketään jäljellä: ”Hän on Maakirin, Ammielin pojan, talossa Loodebarissa”, sanoi Siba, ja kuningas lähetti noutamaan hänet aterioimaan pöytäänsä. Vuosia myöhemmin, kun Daavid pakeni Absalomia Mahanaimiin, sama Makir, Rabban Sobin ja Rogelimin Barsillain kanssa, toi vuoteita, vehnää, ohraa, papuja ja hunajaa nälkäiselle armeijalle. Nimi voi myös kätkeytyä Joosuan kirjan Gadin luetteloon, jossa raja kulkee ”Mahanaimista Lidebirin alueeseen saakka”; monet pitävät muotoa Lidebir samana kaupunkina."
    - "Aamos leikittelee nimellä. Pilkatessaan Israelin ylpeyttä Jerobeam II:n aikana, joka oli voittanut takaisin maata Jordanin itäpuolelta, hän sanoo heitä: ”te, jotka iloitsette Loodabarista”, heprean lo dabar (”ei mitään”), ja kysyy: ”Emmekö omalla voimallamme valloittaneet Karnaimia?”, Karnaim, ”sarvet”. Venäläinen Raamattu säilyttää merkityksen mutta menettää sanaleikin. Nämä kaksi nimeä näyttävät olevan kaksi kuninkaan valloittamaa kaupunkia, joten Lo-Debar sijaitsi Gileadin pohjoisosassa, maassa, jossa Israel ja Damaskos taistelivat."
    - "Tarkka sijainti on ratkaisematta. Kaupungin täytyy olla lähellä Mahanaimia ja Jordanin laaksoa, ja kartan ehdokkaat sijaitsevat Jarmukin varrella ja sen eteläpuolella Jabbokia kohti: Tel Dover Jarmukin suulla, Umm ed-Debar sen eteläpuolella, jonka nimi muistuttaa raamatullista, Tell el-Hamme laaksossa sekä Ibdar, Khirbet Hamid ja Tell el-Mughanniya kukkuloilla. Mitään ei ole vahvistanut kirjoitus. Nykyään tämä on Jordanian luoteisosaa Irbidin ja Jordan-joen välillä sekä Jarmukin Israelin puoli Golanin alapuolella."
  vi:
    - "Lô-Đê-ba là một thành của Ga-la-át, phía đông sông Giô-đanh, nổi tiếng vì nhà Ma-ki con A-mi-ên. Tại đó Mê-phi-bô-sết, con trai què của Giô-na-than, sống trong lặng lẽ khi Đa-vít hỏi còn ai của nhà Sau-lơ không: “Người ở trong nhà Ma-ki, con trai A-mi-ên, tại Lô-đê-ba”, Xíp-ba thưa, và vua sai người đòi ông đến ăn tại bàn mình. Nhiều năm sau, khi Đa-vít chạy trốn Áp-sa-lôm đến Ma-ha-na-im, chính Ma-ki ấy, cùng Sô-bi ở Ráp-ba và Bát-xi-lai ở Rô-ghê-lim, đem giường, lúa mì, lúa mạch, đậu và mật ong cho đạo quân đói. Tên này có lẽ cũng ẩn trong danh sách của Gát ở sách Giô-suê, nơi biên giới chạy “từ Ma-ha-na-im cho đến bờ cõi Đê-bia”, một dạng mà nhiều người đọc là Lidebir, cùng một thành."
    - "A-mốt chơi chữ với tên này. Chế nhạo sự kiêu ngạo của Y-sơ-ra-ên dưới thời Giê-rô-bô-am II, người đã giành lại đất phía đông sông Giô-đanh, ông gọi họ là “Các ngươi ưa thích sự hư không”, trong tiếng Hê-bơ-rơ lo dabar, và hỏi: “Há chẳng phải nhờ sức mạnh chúng ta mà chúng ta đã được sừng sao?”, tức Cạt-na-im. Bản Kinh Thánh tiếng Nga giữ nghĩa nhưng mất chơi chữ. Hai tên dường như là hai thành nhà vua đã chiếm, nên Lô-Đê-ba nằm ở bắc Ga-la-át, trong xứ nơi Y-sơ-ra-ên và Đa-mách giao chiến."
    - "Chính xác ở đâu chưa ngã ngũ. Thành phải gần Ma-ha-na-im và thung lũng Giô-đanh, và các ứng viên trên bản đồ nằm dọc sông Yarmuk và phía nam nó hướng về Gia-bốc: Tel Dover ở cửa sông Yarmuk, Umm ed-Debar phía nam, có tên giống tên trong Kinh Thánh, Tell el-Hamme trong thung lũng, và Ibdar, Khirbet Hamid và Tell el-Mughanniya trên các đồi. Không nơi nào được xác nhận bằng bản khắc. Ngày nay đây là tây bắc Gióc-đa-ni, giữa Irbid và sông Giô-đanh, và phía Israel của sông Yarmuk dưới Gô-lan."
  ro:
    - "Lo-Debar era o cetate din Galaad, la est de Iordan, cunoscută pentru casa lui Machir, fiul lui Amiel. Acolo trăia în obscuritate Mefiboșet, fiul șchiop al lui Ionatan, când David a întrebat dacă a mai rămas cineva din casa lui Saul: „iată este în casa lui Mahir feciorul lui Amiil din Lodavar”, a spus Țiba, iar regele a trimis să-l aducă la masa lui. Ani mai târziu, când David a fugit de Absalom la Mahanaim, același Machir, cu Șobi din Raba și Barzilai din Roghelim, a adus paturi, grâu, orz, bob și miere pentru oastea flămândă. Numele poate fi ascuns și în lista lui Iosua pentru Gad, unde textul spune „Maan până la hotarele Davirului”, formă pe care mulți o citesc Lidebir, aceeași cetate."
    - "Amos joacă cu numele. Batjocorind mândria lui Israel sub Ieroboam al II-lea, care recâștigase pământ la est de Iordan, îi numește „Cei ce se veselesc prin nici un cuvânt bun”, în ebraică lo dabar, și întreabă: „au nu cu tăriea noastră avem putere?”, în ebraică „cornuri”, Carnaim. Biblia rusă păstrează sensul și pierde jocul de cuvinte. Cele două nume par două cetăți pe care regele le luase, deci Lo-Debar se afla în nordul Galaadului, în ținutul unde se băteau Israel și Damascul."
    - "Locul exact nu este stabilit. Cetatea trebuie să fie aproape de Mahanaim și de valea Iordanului, iar candidații de pe hartă se află de-a lungul Yarmukului și la sud de el, spre Iaboc: Tel Dover la gura Yarmukului, Umm ed-Debar la sud de el, al cărui nume seamănă cu cel biblic, Tell el-Hamme din vale, și Ibdar, Khirbet Hamid și Tell el-Mughanniya pe dealuri. Niciunul nu este confirmat de o inscripție. Astăzi aceasta este partea de nord-vest a Iordaniei, între Irbid și râul Iordan, și partea israeliană a Yarmukului, sub Golan."
  bg:
    - "Лодевар е бил град в Галаад, на изток от Йордан, известен с дома на Махир, сина на Амиил. Там Мемфивостей, куцият син на Йонатан, живеел в неизвестност, когато Давид попита дали е останал някой от Сауловия дом: „Ето го в дома на Махира Амииловия син, в Ло-давар“, каза Сива, и царят изпрати да го доведат, за да яде на трапезата му. Години по-късно, когато Давид бягаше от Авесалом в Маханаим, същият Махир, заедно със Сови от Рава и Верзелий от Рогелим, донесе постели, пшеница, ечемик, бакла и мед за гладната войска. Името може да се крие и в списъка на Гад у Иисус Навин, където границата върви „от Маханаим до пределите на Девир“ — форма, която мнозина четат като Лидевир, същия град."
    - "Амос играе с името. Като осмива гордостта на Израил при Йеровоам II, който си бил върнал земя на изток от Йордан, той ги нарича: „Вие които се радвате за нищо и никакво“, на иврит ло давар, и пита: „Не придобихме ли си със силата си могущество?“ — на иврит „рога“, карнаим. Руската Библия запазва смисъла и губи играта на думи. Двете имена изглежда са два града, които царят бил превзел, така че Лодевар е лежал в северната част на Галаад, в земята, където Израил и Дамаск воювали."
    - "Къде точно, не е установено. Градът трябва да е близо до Маханаим и Йорданската долина, а кандидатите на картата лежат по Ярмук и на юг от него към Явок: Тел Довер при устието на Ярмук, Ум ед-Дебар на юг от него, чието име напомня библейското, Тел ел-Хаме в долината и Ибдар, Хирбет Хамид и Тел ел-Муганийя по хълмовете. Нито един не е потвърден с надпис. Днес това е северозападът на Йордания, между Ирбид и река Йордан, и израелската страна на Ярмук под Голан."
