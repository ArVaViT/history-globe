# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the candidates are given without choosing; the reading of Amos 6:13 and Joshua 13:26 as the same name is noted as a reading.
id: lo-debar
place: a376eed
title:
  en: "Lo-debar"
  ru: "Лодевар"
body:
  en:
    - "Lo-debar was a town of Gilead, east of the Jordan, known for the house of Machir the son of Ammiel. There Mephibosheth, the lame son of Jonathan, was living in obscurity when David asked whether any of Saul's house was left: “Behold, he is in the house of Machir, the son of Ammiel, in Lo-debar”, said Ziba, and the king sent and fetched him to eat at his table. Years later, when David fled from Absalom to Mahanaim, the same Machir, with Shobi of Rabbah and Barzillai of Rogelim, brought beds, wheat, barley, beans and honey for the hungry army. The name may also hide in Joshua's list of Gad, where the border runs “from Mahanaim unto the border of Debir”, a form that many read as Lidebir, the same town."
    - "Amos plays on the name. Mocking the pride of Israel under Jeroboam II, who had won back land east of the Jordan, he calls them “Ye which rejoice in a thing of nought”, in Hebrew lo dabar, and asks, “Have we not taken to us horns”, Karnaim. The Russian Bible keeps the sense and loses the pun. The two names seem to be two towns the king had taken, so Lo-debar lay in the north of Gilead, in the country where Israel and Damascus fought."
    - "Where exactly is not settled. The town must be near Mahanaim and the Jordan valley, and the candidates on the map lie between the Yarmuk and the Jabbok: Tel Dover at the mouth of the Yarmuk, Umm ed-Debar south of it, whose name resembles the biblical one, Tell el-Hamme in the valley, and Ibdar, Khirbet Hamid and Tell el-Mughanniya on the hills. None is confirmed by an inscription. Today this is the north-west of Jordan, between Irbid and the Jordan river, and the Israeli side of the Yarmuk below the Golan."
  ru:
    - "Лодевар — город Галаада к востоку от Иордана, известный домом Махира, сына Аммиила. Там в безвестности жил Мемфивосфей, хромой сын Ионафана, когда Давид спросил, не остался ли кто из дома Саулова: «вот, он в доме Махира, сына Аммиэлова, в Лодеваре», сказал Сива, и царь послал и взял его к своему столу. Годы спустя, когда Давид бежал от Авессалома в Маханаим, тот же Махир вместе с Сови из Раввы и Верзеллием из Роглима принёс постели, пшеницу, ячмень, бобы и мёд для голодного войска. Имя, возможно, скрыто и в списке Гада у Иисуса Навина, где предел идёт «от Маханаима до пределов Давира»: многие читают это как Лидевир, тот же город."
    - "Амос играет этим именем. Насмехаясь над гордостью Израиля при Иеровоаме II, который отвоевал земли за Иорданом, он зовёт их «вы, которые восхищаетесь ничтожными вещами», по-еврейски «ло давар», и спрашивает, не своей ли силой они добыли себе рога — по-еврейски «карнаим», как зовётся второй город. Русская Библия сохраняет смысл и теряет игру слов. Два имени, по-видимому, два города, взятые царём, так что Лодевар лежал на севере Галаада, в краю, за который воевали Израиль и Дамаск."
    - "Где именно — не решено. Город должен быть близ Маханаима и долины Иордана, и кандидаты на карте лежат между Ярмуком и Иавоком: Тель-Довер в устье Ярмука, Умм-эд-Дебар южнее, чьё имя похоже на библейское, Телль-эль-Хамме в долине и Ибдар, Хирбет-Хамид и Телль-эль-Муганния на холмах. Ни один не подтверждён надписью. Сегодня это северо-запад Иордании между Ирбидом и рекой Иордан и израильский берег Ярмука под Голанами."
