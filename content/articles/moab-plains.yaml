# Overview article (ADR 0007). Mainstream facts only; this record is the plains of Moab (all its verses say "plains of Moab"), not the Moabite plateau (moab.yaml); no mound is identified with Abel-shittim or Beth-jeshimoth as fact.
id: moab-plains
place: aca767b
title:
  en: "Plains of Moab"
  ru: "Равнины Моавитские"
  uk: "Рівнини Моавитські"
  es: "Llanuras de Moab"
  pt: "Planícies de Moabe"
  de: "Steppen Moabs"
  fr: "Plaines de Moab"
  it: "Pianure di Moab"
  pl: "Równiny Moabu"
  nl: "Vlakten van Moab"
  cs: "Moábské pláně"
body:
  en:
    - "The plains of Moab, in Hebrew arboth Moab, are not the Moabite plateau but the lowland at the north-eastern corner of the Dead Sea, where the Jordan valley widens before the river enters the sea, “on this side Jordan by Jericho”. The camp stretched “from Beth-jesimoth even unto Abel-shittim”, several kilometres along the foot of the hills north of the lake shore, watered by the streams coming down from the Moabite heights. The plateau above had been Moab's and then Sihon's; Israel took it from the Amorites, which is why the plain bears Moab's name though it was not Moabite land when Israel came."
    - "Here the wanderings ended. While Israel camped on these plains, Balak king of Moab sent for Balaam; here, at Shittim, “the people began to commit whoredom with the daughters of Moab” and the plague followed; here Moses and Eleazar took the second census, the war against Midian brought its captives “unto the camp at the plains of Moab”, and the laws of the cities of refuge and of Zelophehad's daughters were given, “the commandments and the judgments, which the LORD commanded by the hand of Moses unto the children of Israel in the plains of Moab”. Deuteronomy is Moses' farewell spoken “in the land of Moab”, and its covenant is set “beside the covenant which he made with them in Horeb”. Moses went up from the plains to Nebo and died, and “the children of Israel wept for Moses in the plains of Moab thirty days”. Joshua's spies left from Shittim, and from here the people crossed the Jordan."
    - "Josephus places Moses' last assembly at Abila, a place full of palm trees, sixty furlongs from the Jordan; Eusebius still knew a village Isimouth opposite Jericho, ten miles to the south by the Dead Sea, and put Shittim near Mount Peor. The plain is dotted with mounds of the Bronze and Iron Ages: Tall el-Hammam, the largest, Tell Iktanu, Tall Nimrin and Tall el-Kafrayn, several of them proposed for Abel-shittim or Beth-jeshimoth, none proven. Today it is the Jordan Valley district around South Shuna and Sweimeh in Jordan, irrigated farmland and Dead Sea hotels, with Mount Nebo looking down on it from the east and Jericho across the river."
  ru:
    - "Равнины Моавитские, по-еврейски арвот Моав, — не Моавитское плоскогорье, а низина у северо-восточного угла Мёртвого моря, где долина Иордана расширяется перед впадением реки в море, «при Иордане, против Иерихона». Стан тянулся «от Беф-Иешимофа до Аве-Ситтима», на несколько километров вдоль подножия гор к северу от берега озера, и орошался потоками, сбегающими с Моавитских высот. Плоскогорье над ним принадлежало сначала Моаву, потом Сигону; Израиль отнял его у Аморреев, поэтому равнина носит имя Моава, хотя землёй Моавитян ко времени прихода Израиля не была."
    - "Здесь закончились странствия. Пока Израиль стоял станом на этих равнинах, Валак, царь Моавитский, послал за Валаамом, чтобы проклясть его; здесь, в Ситтиме, «начал народ блудодействовать с дочерями Моава», и за этим последовала язва; здесь Моисей и Елеазар провели второе исчисление, война с Мадианитянами привела пленных «к стану, на равнины Моавитские», и были даны законы о городах убежища и о дочерях Салпаада — «заповеди и постановления, которые дал Господь сынам Израилевым чрез Моисея на равнинах Моавитских». Второзаконие — прощальные речи Моисея «в земле Моавитской», и завет в нём поставлен «кроме завета, который Господь поставил с ними на Хориве». Моисей взошёл с равнин на Нево и умер, и «оплакивали Моисея сыны Израилевы на равнинах Моавитских у Иордана близ Иерихона тридцать дней». Из Ситтима ушли соглядатаи Иисуса Навина, и отсюда народ перешёл Иордан."
    - "Иосиф Флавий помещает последнее собрание Моисея в Авиле, месте, полном пальм, в шестидесяти стадиях от Иордана; Евсевий ещё знал селение Исимуф против Иерихона, в десяти милях к югу у Мёртвого моря, а Ситтим помещал близ горы Фегор. Равнина усеяна холмами бронзового и железного веков: Талль-эль-Хаммам, самый большой, Телль-Иктану, Талль-Нимрин и Талль-эль-Кафрейн; несколько из них предлагали на роль Аве-Ситтима или Беф-Иешимофа, ни одно не доказано. Сегодня это округ Иорданской долины вокруг Южной Шуны и Свеймы в Иордании, орошаемые поля и отели Мёртвого моря; с востока на равнину смотрит гора Нево, а за рекой лежит Иерихон."
  uk:
    - "Рівнини Моавитські, староєврейською арбот Моав, — це не Моавитське плато, а низовина на північно-східному куті Мертвого моря, де долина Йордану розширюється перед тим, як ріка впадає в море, «по другім боцї Йордана навпроти Єрихону». Табір простягався «від Бет-Єзімотя до Абель-Ситтима», на кілька кілометрів уздовж підніжжя пагорбів на північ від берега озера, зрошуваний потоками, що спускаються з моавитських висот. Плато вгорі було спершу Моавовим, а потім Сігоновим; Ізраїль узяв його в аморіїв, тому рівнина носить ім’я Моаву, хоча коли прийшов Ізраїль, вона не була моавитською землею."
    - "Тут закінчилося блукання. Поки Ізраїль стояв табором на цих рівнинах, Валак, цар Моаву, послав по Валаама; тут, у Ситтімі, «став блудувати люд із дочками Моабовими», і послідувала пошесть; тут Мойсей і Елеазар провели другий перепис, війна проти Мадіама привела бранців «у табір, на поділлє Моабське», і були дані закони про міста-сховища і про дочок Салпаада, «Се заповідї і присуди, що заповідав Господь, через Мойсея синам Ізраїля на Моабових рівнинах». Повторення Закону — прощальне слово Мойсея, виголошене «в Моаб землї», а його угода викладена на додаток до угоди, яку він уклав з ними в Хориві. Мойсей зійшов з рівнин на Нево й помер, і «плакали по Мойсейові сини Ізраїля трийцять день на поділлї Моаба». Розвідники Ісуса Навина вийшли з Ситтіма, і звідси народ перейшов Йордан."
    - "Йосиф Флавій розміщує останнє зібрання Мойсея в Абілі, місці, повному пальм, за шістдесят стадій від Йордану; Євсевій ще знав село Ісімут навпроти Єрихону, за десять миль на південь біля Мертвого моря, і розміщував Ситтім поблизу гори Пеор. Рівнина всіяна пагорбами бронзової й залізної доби: Телль-ель-Хаммам, найбільший, Телль-Іктану, Телль-Німрін і Телль-ель-Кафрейн, кілька з яких пропонували для Аве-Ситтіма чи Бет-Єшімота, жоден не доведений. Сьогодні це округ Йорданської долини навколо Південної Шуни та Сувейме в Йорданії, зрошувана рілля й готелі Мертвого моря, з горою Нево, що дивиться на неї зі сходу, і Єрихоном через ріку."
  es:
    - "Las llanuras de Moab, en hebreo arboth Moab, no son la meseta moabita sino la tierra baja en el ángulo nordeste del mar Muerto, donde el valle del Jordán se ensancha antes de que el río entre en el mar, «de esta parte del Jordán de Jericó». El campamento se extendía «desde Beth-jesimoth hasta Abel-sitim», varios kilómetros al pie de las colinas al norte de la orilla del lago, regado por los arroyos que bajan de las alturas de Moab. La meseta de arriba había sido de Moab y luego de Sehón; Israel la tomó a los amorreos, por lo que la llanura lleva el nombre de Moab aunque no era tierra moabita cuando Israel llegó."
    - "Aquí terminaron las peregrinaciones. Mientras Israel acampaba en estas llanuras, Balac, rey de Moab, mandó llamar a Balaam; aquí, en Sitim, «el pueblo empezó á fornicar con las hijas de Moab» y siguió la plaga; aquí Moisés y Eleazar hicieron el segundo censo, la guerra contra Madián trajo sus cautivos «al campo en los llanos de Moab», y se dieron las leyes de las ciudades de refugio y de las hijas de Zelofehad, «los mandamientos y los estatutos que mandó Jehová por mano de Moisés á los hijos de Israel en los campos de Moab». Deuteronomio es la despedida de Moisés pronunciada «en la tierra de Moab», y su pacto se establece «además del pacto que concertó con ellos en Horeb». Moisés subió desde las llanuras al Nebo y murió, y «lloraron los hijos de Israel á Moisés en los campos de Moab treinta días». Los espías de Josué partieron de Sitim, y desde aquí el pueblo cruzó el Jordán."
    - "Josefo sitúa la última asamblea de Moisés en Abila, un lugar lleno de palmeras, a sesenta estadios del Jordán; Eusebio aún conoció una aldea Isimouth frente a Jericó, a diez millas al sur, junto al mar Muerto, y puso Sitim cerca del monte Peor. La llanura está salpicada de montículos de las edades del Bronce y del Hierro: Tall el-Hammam, el mayor, Tell Iktanu, Tall Nimrin y Tall el-Kafrayn, varios de ellos propuestos para Abel-sitim o Bet-jesimot, ninguno probado. Hoy es el distrito del valle del Jordán en torno a Shuna del Sur y Sweimeh, en Jordania, con tierras de regadío y hoteles del mar Muerto, con el monte Nebo mirándola desde el este y Jericó al otro lado del río."
  pt:
    - "As planícies de Moabe, em hebraico arboth Moab, não são o planalto moabita, mas a planície baixa no canto nordeste do mar Morto, onde o vale do Jordão se alarga antes de o rio entrar no mar, “junto ao Jordão, na altura de Jericó”. O acampamento estendia-se “desde Bete-Jesimote até Abel-Sitim”, por vários quilômetros ao pé das colinas ao norte da margem do lago, regado pelos córregos que descem das alturas moabitas. O planalto acima fora de Moabe e depois de Seom; Israel o tomou dos amorreus, razão por que a planície leva o nome de Moabe embora não fosse terra moabita quando Israel chegou."
    - "Aqui terminaram as peregrinações. Enquanto Israel acampava nestas planícies, Balaque, rei de Moabe, mandou chamar Balaão; aqui, em Sitim, “o povo começou a se prostituir com as filhas de Moabe” e seguiu-se a praga; aqui Moisés e Eleazar fizeram o segundo recenseamento, a guerra contra Midiã trouxe seus cativos “ao acampamento nas planícies de Moabe”, e foram dadas as leis das cidades de refúgio e das filhas de Zelofeade, “os mandamentos e as ordenanças que o SENHOR ordenou por meio de Moisés aos filhos de Israel nas planícies de Moabe”. Deuteronômio é a despedida de Moisés dita “na terra de Moabe”, e sua aliança é posta “além da aliança que fez com eles em Horebe”. Moisés subiu das planícies ao Nebo e morreu, e “Os filhos de Israel choraram por Moisés nas campinas de Moabe por trinta dias”. Os espias de Josué partiram de Sitim, e daqui o povo atravessou o Jordão."
    - "Josefo situa a última assembleia de Moisés em Abila, lugar cheio de palmeiras, a sessenta estádios do Jordão; Eusébio ainda conhecia uma aldeia Isimouth defronte de Jericó, a dez milhas ao sul, junto ao mar Morto, e pôs Sitim perto do monte Peor. A planície é salpicada de montículos das Idades do Bronze e do Ferro: Tall el-Hammam, o maior, Tell Iktanu, Tall Nimrin e Tall el-Kafrayn, vários deles propostos para Abel-Sitim ou Bete-Jesimote, nenhum provado. Hoje é o distrito do Vale do Jordão em torno de Shuna do Sul e Sweimeh, na Jordânia, terras agrícolas irrigadas e hotéis do mar Morto, com o monte Nebo olhando-a do leste e Jericó do outro lado do rio."
  de:
    - "Die Steppen Moabs, hebräisch arboth Moab, sind nicht die moabitische Hochebene, sondern das Tiefland an der Nordostecke des Toten Meeres, wo sich das Jordantal weitet, bevor der Fluss ins Meer mündet, „jenseit des Jordans, gegenüber Jericho“. Das Lager erstreckte sich „von Beth-Jesimoth an bis an Abel-Sittim“, mehrere Kilometer am Fuß der Hügel nördlich des Seeufers, bewässert von den Bächen, die von den moabitischen Höhen herabkommen. Die Hochebene darüber war Moabs und dann Sihons gewesen; Israel nahm sie den Amoritern ab, weshalb die Ebene Moabs Namen trägt, obwohl sie bei Israels Ankunft nicht moabitisches Land war."
    - "Hier endeten die Wanderungen. Als Israel hier lagerte, ließ Balak, der König von Moab, Bileam holen; hier, in Schittim, heißt es: „Und das Volk hob an zu huren mit der Moabiter Töchtern“, und die Plage folgte; hier hielten Mose und Eleasar die zweite Zählung, der Krieg gegen Midian brachte seine Gefangenen ins Lager, und die Gesetze über die Zufluchtsstädte und über Zelofhads Töchter wurden gegeben, „die Gebote und Rechte, die der HERR gebot durch Mose den Kindern Israel“. Das 5. Buch Mose ist Moses Abschied, gesprochen „im Lande der Moabiter“, und sein Bund wird geschlossen „zum andernmal, nachdem er denselben mit ihnen gemacht hatte am Horeb“. Mose stieg von den Steppen auf den Nebo und starb, und „die Kinder Israel beweinten Mose im Gefilde der Moabiter dreißig Tage“. Josuas Kundschafter brachen von Schittim auf, und von hier überquerte das Volk den Jordan."
    - "Josephus verlegt Moses letzte Versammlung nach Abila, einen palmenreichen Ort sechzig Stadien vom Jordan; Eusebius kannte noch ein Dorf Isimuth gegenüber Jericho, zehn Meilen südlich am Toten Meer, und setzte Schittim nahe dem Berg Peor an. Die Ebene ist übersät mit Hügeln der Bronze- und Eisenzeit: Tall el-Hammam, der größte, Tell Iktanu, Tall Nimrin und Tall el-Kafrayn, mehrere von ihnen für Abel-Schittim oder Bet-Jeschimot vorgeschlagen, keiner bewiesen. Heute ist es der Bezirk Jordantal um Süd-Schuna und Sweimeh in Jordanien, bewässertes Ackerland und Hotels am Toten Meer, mit dem Berg Nebo, der von Osten herabblickt, und Jericho jenseits des Flusses."
  fr:
    - "Les plaines de Moab, en hébreu arboth Moab, ne sont pas le plateau moabite mais la plaine basse au coin nord-est de la mer Morte, où la vallée du Jourdain s’élargit avant que le fleuve entre dans la mer, « près du Jourdain, vis-à-vis de Jéricho ». Le camp s’étendait « depuis Beth-Jeschimoth jusqu’à Abel-Sittim », sur plusieurs kilomètres au pied des collines au nord de la rive du lac, arrosé par les ruisseaux descendant des hauteurs moabites. Le plateau au-dessus avait appartenu à Moab puis à Sihon ; Israël le prit aux Amoréens, ce qui explique que la plaine porte le nom de Moab bien qu’elle n’ait pas été terre moabite à l’arrivée d’Israël."
    - "Ici finirent les errances. Israël campant là, Balak, roi de Moab, fit appeler Balaam ; à Sittim, « le peuple commença à se livrer à la débauche avec les filles de Moab » et la plaie suivit ; ici Moïse et Éléazar firent le second dénombrement, la guerre contre Madian ramena ses captifs à Moïse et aux Israélites « campés dans les plaines de Moab », et furent données les lois des villes de refuge et des filles de Tselophchad, « les commandements et les lois que l’Éternel donna par Moïse aux enfants d’Israël, dans les plaines de Moab ». Le Deutéronome, adieu de Moïse prononcé « au pays de Moab », pose son alliance « outre l’alliance qu’il avait traitée avec eux à Horeb ». Moïse monta au Nebo et mourut, et « les enfants d’Israël pleurèrent Moïse pendant trente jours, dans les plaines de Moab ». De Sittim partirent les espions de Josué, puis le peuple traversa le Jourdain."
    - "Flavius Josèphe place la dernière assemblée de Moïse à Abila, lieu plein de palmiers, à soixante stades du Jourdain ; Eusèbe connaissait encore un village Isimouth en face de Jéricho, à dix milles au sud près de la mer Morte, et plaçait Sittim près du mont Peor. La plaine est parsemée de tertres des âges du Bronze et du Fer : Tall el-Hammam, le plus grand, Tell Iktanu, Tall Nimrin et Tall el-Kafrayn, plusieurs proposés pour Abel-Sittim ou Beth-Jeschimoth, aucun prouvé. Aujourd’hui, c’est le district de la vallée du Jourdain autour de Shouna du Sud et de Souweimeh, en Jordanie, terres irriguées et hôtels de la mer Morte, avec le mont Nebo qui la domine à l’est et Jéricho de l’autre côté du fleuve."
  it:
    - "Le pianure di Moab, in ebraico arboth Moab, non sono l’altopiano moabita ma la bassura all’angolo nord-orientale del Mar Morto, dove la valle del Giordano si allarga prima che il fiume entri nel mare, «oltre il Giordano di Gerico». L’accampamento si estendeva «da Beth-Jescimoth fino ad Abel-Sittim», per chilometri ai piedi delle colline a nord della riva del lago, irrigato dai torrenti delle alture moabite. L’altopiano sopra era stato di Moab e poi di Sicon; Israele lo prese agli Amorei, ed è per questo che la pianura porta il nome di Moab benché non fosse moabita all’arrivo d’Israele."
    - "Qui finirono le peregrinazioni. Mentre Israele era qui accampato, Balak re di Moab mandò a chiamare Balaam; qui, a Sittim, «il popolo cominciò a darsi alla impurità con le figliuole di Moab» e seguì il flagello; qui Mosè ed Eleazaro fecero il secondo censimento; la guerra contro Madian portò i prigionieri a Mosè e alla raunanza, «accampati nelle pianure di Moab», furono date le leggi sulle città di rifugio e sulle figlie di Selofcad, «i comandamenti e le leggi che l’Eterno dette ai figliuoli d’Israele per mezzo di Mosè, nelle pianure di Moab». Il Deuteronomio è l’addio di Mosè «nel paese di Moab», e la sua alleanza è posta «oltre il patto che avea stabilito con essi a Horeb». Mosè salì al Nebo dalle pianure e morì, e «i figliuoli d’Israele lo piansero nelle pianure di Moab per trenta giorni». Da Sittim partirono le spie di Giosuè, e di qui il popolo passò il Giordano."
    - "Giuseppe Flavio colloca l’ultima assemblea di Mosè ad Abila, luogo pieno di palme, a sessanta stadi dal Giordano; Eusebio conosceva ancora un villaggio Isimouth di fronte a Gerico, dieci miglia a sud presso il Mar Morto, e poneva Sittim vicino al Monte Peor. La pianura è punteggiata di tell dell’età del Bronzo e del Ferro: Tall el-Hammam, il più grande, Tell Iktanu, Tall Nimrin e Tall el-Kafrayn, vari dei quali proposti per Abel-Sittim o Bet-Iesimòt, nessuno dimostrato. Oggi è il distretto della Valle del Giordano intorno a Shuna meridionale e Sweimeh in Giordania, terreno agricolo irrigato e alberghi sul Mar Morto, con il Monte Nebo che la sovrasta da oriente e Gerico al di là del fiume."
  pl:
    - "Równiny Moabu, po hebrajsku arboth Moab, to nie płaskowyż Moabu, lecz nizina w północno-wschodnim narożniku Morza Martwego, gdzie dolina Jordanu rozszerza się, zanim rzeka wpadnie do morza, „z tej strony Jordanu przeciw Jerychowi”. Obóz ciągnął się „od Betiesymot aż do Abelsytym”, kilka kilometrów u stóp wzgórz na północ od brzegu jeziora, nawadniany strumieniami spływającymi z moabickich wyżyn. Płaskowyż powyżej należał do Moabu, a potem do Sychona; Izrael zabrał go Amorytom, dlatego równina nosi nazwę Moabu, choć nie była ziemią moabicką, gdy Izrael przybył."
    - "Tu skończyły się wędrówki. Gdy Izrael obozował na tych równinach, Balak, król Moabu, posłał po Balaama; tu, w Szittim, „począł lud cudzołożyć z córkami Moabskiemi” i nastąpiła plaga; tu Mojżesz i Eleazar przeprowadzili drugi spis, wojna z Madianem przyniosła jeńców „do obozu na pola Moabskie”, i dano prawa o miastach schronienia oraz o córkach Selofchada, „przykazania i prawa, które rozkazał Pan przez Mojżesza synom Izraelskim na polach Moabskich”. Księga Powtórzonego Prawa to pożegnanie Mojżesza wygłoszone „w ziemi Moabskiej”, a jej przymierze zostało zawarte „nad ono przymierze, które postanowił z nimi na Horeb”. Mojżesz wstąpił z równin na Nebo i umarł, a „płakali synowie Izraelscy Mojżesza na polach Moabskich przez trzydzieści dni”. Szpiedzy Jozuego wyszli z Szittim i stąd lud przeszedł Jordan."
    - "Józef Flawiusz umieszcza ostatnie zgromadzenie Mojżesza w Abili, miejscu pełnym palm, sześćdziesiąt stadiów od Jordanu; Euzebiusz wciąż znał wieś Isimouth naprzeciw Jerycha, dziesięć mil na południe nad Morzem Martwym, i umieszczał Szittim koło góry Peor. Równinę znaczą kopce z epoki brązu i żelaza: Tall el-Hammam, największy, Tell Iktanu, Tall Nimrin i Tall el-Kafrayn, kilka z nich proponowano dla Abel-Szittim albo Bet-Jeszimot, żaden nie jest udowodniony. Dziś jest to okręg Doliny Jordanu wokół Szuny Południowej i Sweimeh w Jordanii, nawadniane pola uprawne i hotele nad Morzem Martwym, z górą Nebo spoglądającą z góry ze wschodu i Jerychem po drugiej stronie rzeki."
  nl:
    - "De Vlakten van Moab, in het Hebreeuws arboth Moab, zijn niet het Moabitische plateau maar het laagland aan de noordoosthoek van de Dode Zee, waar de Jordaanvallei zich verbreedt voordat de rivier de zee instroomt, “aan deze zijde van de Jordaan van Jericho”. Het kamp strekte zich uit “van Beth-Jesimoth, tot aan Abel-Sittim”, enkele kilometers langs de voet van de heuvels ten noorden van de oever van het meer, bewaterd door de beken die van de Moabitische hoogten komen. Het plateau erboven was van Moab geweest en daarna van Sihon; Israël nam het de Amorieten af, daarom draagt de vlakte Moabs naam hoewel het geen Moabitisch land was toen Israël kwam."
    - "Hier eindigde de zwerftocht. Terwijl Israël hier kampeerde, ontbood Balak van Moab Bileam; te Sittim gebeurde dit: “het volk begon te hoereren met de dochteren der Moabieten”, dan de plaag; hier hielden Mozes en Eleazar de tweede volkstelling, bracht de Midianitische oorlog zijn gevangenen “in het leger, in de vlakke velden van Moab”, en volgden de wetten over de vrijsteden en Zelofchads dochters, “de geboden en de rechten, die de HEERE door de dienst van Mozes aan de kinderen Israëls geboden heeft, in de vlakke velden der Moabieten”. Deuteronomium is Mozes' afscheid, gesproken “in het land van Moab”, met een verbond “boven het verbond, dat Hij met hen gemaakt had aan Horeb”. Mozes ging omhoog naar Nebo en stierf; en “de kinderen Israëls beweenden Mozes, in de vlakke velden van Moab, dertig dagen”. Jozua's verspieders vertrokken uit Sittim, en van hier stak het volk over."
    - "Josephus plaatst Mozes' laatste vergadering bij Abila, een plaats vol palmbomen, zestig stadiën van de Jordaan; Eusebius kende nog een dorp Isimouth tegenover Jericho, tien mijl naar het zuiden bij de Dode Zee, en plaatste Sittim bij de berg Peor. De vlakte is bezaaid met heuvels uit de brons- en ijzertijd: Tall el-Hammam, de grootste, Tell Iktanu, Tall Nimrin en Tall el-Kafrayn, enkele ervan voorgesteld voor Abel-Sittim of Beth-Jesimot, geen ervan bewezen. Tegenwoordig is het het district Jordaanvallei rond Zuid-Shuna en Sweimeh in Jordanië, geïrrigeerd landbouwland en hotels aan de Dode Zee, met de berg Nebo die er van het oosten op neerkijkt en Jericho aan de overkant van de rivier."
  cs:
    - "Moábské pláně, hebrejsky arboth Moab, nejsou moábská náhorní rovina, nýbrž nížina v severovýchodním rohu Mrtvého moře, kde se Jordánské údolí rozšiřuje, než řeka vstoupí do moře, „nedocházeje k Jordánu, naproti Jerichu“. Tábor se táhl „od Betsimot až do Abelsetim“, několik kilometrů podél úpatí pahorků severně od břehu jezera, zavlažovaný potoky stékajícími z moábských výšin. Náhorní rovina nad tím patřila nejprve Moábu a pak Sichonovi; Izrael ji vzal Amorejcům, a proto pláň nese jméno Moábu, ačkoli nebyla moábskou zemí, když Izrael přišel."
    - "Tady skončilo putování. Zatímco Izrael tábořil na těchto pláních, poslal Balak, král Moábu, pro Bileáma; tady, v Šitimu, „počal lid smilniti s dcerami Moábskými“ a následoval mor; tady Mojžíš a Eleazar sečetli lid podruhé, válka proti Midjánu přivedla zajatce „k vojsku na roviny Moábské“ a byly dány zákony o útočištných městech a o dcerách Celofchadových: „Tato jsou přikázaní a soudové, kteréž přikázal Hospodin skrze Mojžíše synům Izraelským, na rovinách Moábských“. Deuteronomium je Mojžíšova rozloučená řeč pronesená „v zemi Moábské“ a jeho smlouva je ustavena „mimo onu smlouvu, kterouž učinil s nimi na Orébě“. Mojžíš vystoupil z pláně na Nebo a zemřel a „plakali synové Izraelští Mojžíše na rovinách Moábských třidceti dní“. Jozuovi zvědové vyšli ze Šitimu a odtud lid přešel Jordán."
    - "Josephus klade Mojžíšovo poslední shromáždění do Abily, místa plného palem, šedesát stadií od Jordánu; Eusebius ještě znal vesnici Isimouth naproti Jerichu, deset mil na jih u Mrtvého moře, a Šitim kladl poblíž hory Peór. Pláň je poseta pahorky z doby bronzové a železné: Tall el-Hammam, největší, Tell Iktanu, Tall Nimrin a Tall el-Kafrayn, několik z nich navržených pro Ábel-šitim nebo Bét-ješimót, žádný neprokázán. Dnes je to okres Jordánského údolí kolem Jižní Šuny a Sweimeh v Jordánsku, zavlažovaná pole a hotely u Mrtvého moře, s horou Nebo shlížející na ni od východu a Jerichem za řekou."
