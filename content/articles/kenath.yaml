# Overview article (ADR 0007). Mainstream facts only; Kenath is identified with Qanawat (Canatha) as is usual; the later history is kept short.
id: kenath
place: a4f650b
title:
  en: "Kenath"
  ru: "Кенаф"
  uk: "Кенат"
  es: "Kenat"
  pt: "Quenate"
  de: "Kenat"
  fr: "Kenath"
body:
  en:
    - "Kenath was a town in the far north-east of the land east of the Jordan, on the western slopes of the Jebel al-Arab in the Hauran. In the conquest of Gilead and Bashan by the clans of Manasseh, “Nobah went and took Kenath, and the villages thereof, and called it Nobah, after his own name”. The new name did not last. Chronicles, in the genealogy of Judah's descendant Jair, speaks of “the towns of Jair, from them, with Kenath, and the towns thereof, even threescore cities”: most modern translations read that Geshur and Aram took them from Israel, while the King James Version makes Jair the one who took Geshur and Aram. That is all the Bible says of it."
    - "Kenath is generally identified with Qanawat, about 7 km north-east of Suwayda in southern Syria, the Canatha of Greek and Roman times. Pliny counts Canatha among the cities of the Decapolis, and Josephus tells how Herod's army was defeated by the Nabataean Arabs near Canatha in 32 BC. The town flourished under Rome: its ruins include a temple of Helios, a small theatre and a basilica later turned into a church, all built of the local black basalt, among the houses of the modern village."
  ru:
    - "Кенаф был городом на крайнем северо-востоке Заиорданья, на западных склонах Джебель-эль-Араба в Хауране. При завоевании Галаада и Васана родами Манассии «Новах пошел и взял Кенаф и зависящие от него города, и назвал его своим именем: Новах». Новое имя не удержалось. Паралипоменон в родословии Иаира отмечает потерю края: «Гессуряне и Сирияне взяли у них селения Иаира, Кенаф и зависящие от него города, — шестьдесят городов»; в переводе короля Якова, напротив, сам Иаир берёт Гессур и Арам. Это всё, что говорит о нём Библия."
    - "Кенаф обычно отождествляют с Канаватом, примерно в 7 км к северо-востоку от Сувейды на юге Сирии, — Канафой греческого и римского времени. Плиний числит Канафу среди городов Десятиградия, а Иосиф Флавий рассказывает, как войско Ирода было разбито набатейскими арабами под Канафой в 32 г. до н. э. При Риме город процветал: среди домов нынешнего селения стоят развалины храма Гелиоса, небольшого театра и базилики, позднее обращённой в церковь, — всё из местного чёрного базальта."
  uk:
    - "Кенат — місто на крайній північному сході землі за Йорданом, на західних схилах Джебель-аль-Араба в Хаврані. Під час завоювання Гілеаду й Башану родами Манасії «Нобах двинув і заняв Кенат і займища його та й назвав його своїм імям Нобах». Нова назва не втрималася. Хроніки, в родоводі нащадка Юди Яїра, говорять про те, що «забрали в їх селитьби Яірові, Кенат і залежні від його міста, — шістьдесять міст»: більшість сучасних перекладів читають, що Гешур і Арам відібрали їх в Ізраїлю, тоді як Біблія короля Якова робить Яїра тим, хто забрав Гешур і Арам. Це все, що Біблія каже про нього."
    - "Кенат загалом ототожнюють з Канаватом, приблизно за 7 км на північний схід від Сувейди в південній Сирії, — Канатою грецьких і римських часів. Пліній зараховує Канату до міст Десятимістя, а Йосиф Флавій розповідає, як військо Ірода було розбите набатейськими арабами поблизу Канати в 32 р. до н. е. Місто процвітало за Риму: серед його руїн храм Геліоса, невеликий театр і базиліка, пізніше перетворена на церкву, — усе збудоване з місцевого чорного базальту, поміж будинками сучасного села."
  es:
    - "Kenat era una ciudad del extremo nordeste de la tierra al este del Jordán, en las laderas occidentales del Yebel al-Arab, en el Haurán. En la conquista de Galaad y Basán por los clanes de Manasés, «Noba fué y tomó á Kenath y sus aldeas, y llamóle Noba, conforme á su nombre». El nuevo nombre no perduró. Crónicas, en la genealogía de Jair, descendiente de Judá, habla de «las ciudades de Jair [...] y á Cenath con sus aldeas, sesenta lugares»: la mayoría de las traducciones modernas leen que Gesur y Aram se las arrebataron a Israel, mientras que la versión del rey Jacobo hace de Jair quien tomó Gesur y Aram. Eso es todo lo que la Biblia dice de ella."
    - "Kenat se identifica generalmente con Qanawat, a unos 7 km al nordeste de Suwayda, en el sur de Siria, la Canata de época griega y romana. Plinio cuenta a Canata entre las ciudades de la Decápolis, y Josefo relata cómo el ejército de Herodes fue derrotado por los árabes nabateos cerca de Canata en 32 a. C. La ciudad floreció bajo Roma: entre sus ruinas hay un templo de Helios, un pequeño teatro y una basílica convertida más tarde en iglesia, todos construidos con el basalto negro de la región, entre las casas del pueblo actual."
  pt:
    - "Quenate era uma cidade no extremo nordeste da terra a leste do Jordão, nas encostas ocidentais do Jebel al-Arab, no Haurã. Na conquista de Gileade e Basã pelos clãs de Manassés, “Noba foi e tomou Quenate e os seus povoados, e a chamou de Noba, segundo o seu próprio nome”. O novo nome não durou. As Crônicas, na genealogia de Jair, descendente de Judá, falam de “as cidades de Jair, com Quenate e seus povoados, sessenta cidades ao todo”: a maioria das traduções modernas entende que Gesur e Arã as tomaram de Israel, ao passo que a versão King James faz de Jair quem tomou Gesur e Arã. É tudo o que a Bíblia diz a seu respeito."
    - "Quenate costuma ser identificada com Qanawat, a cerca de 7 km a nordeste de Suwayda, no sul da Síria, a Canata dos tempos grego e romano. Plínio conta Canata entre as cidades da Decápolis, e Josefo relata como o exército de Herodes foi derrotado pelos árabes nabateus perto de Canata em 32 a.C. A cidade floresceu sob Roma: suas ruínas incluem um templo de Hélio, um pequeno teatro e uma basílica depois transformada em igreja, todos construídos com o basalto negro local, entre as casas da aldeia moderna."
  de:
    - "Kenat war eine Stadt im äußersten Nordosten des Landes östlich des Jordan, an den Westhängen des Jebel al-Arab im Hauran. Bei der Eroberung Gileads und Baschans durch die Sippen Manasses heißt es: „Nobah ging hin und gewann Knath mit seinen Ortschaften und hieß sie Nobah nach seinem Namen.“ Der neue Name hielt sich nicht. Die Chronik sagt in der Genealogie von Judas Nachkommen Jaïr: „Aber die Gessuriter und Syrer nahmen ihnen die Flecken Jairs, dazu Kenath mit seinen Ortschaften, sechzig Städte“; die meisten modernen Übersetzungen lesen, dass Geschur und Aram sie Israel abnahmen, während die King-James-Version Jaïr zu dem macht, der Geschur und Aram eroberte. Mehr sagt die Bibel darüber nicht."
    - "Kenat wird allgemein mit Qanawat gleichgesetzt, etwa 7 km nordöstlich von Suwayda in Südsyrien, dem Kanatha der griechischen und römischen Zeit. Plinius zählt Kanatha zu den Städten der Dekapolis, und Josephus erzählt, wie das Heer des Herodes 32 v. Chr. bei Kanatha von den nabatäischen Arabern geschlagen wurde. Unter Rom blühte die Stadt: Zu ihren Ruinen gehören ein Tempel des Helios, ein kleines Theater und eine später in eine Kirche verwandelte Basilika, alle aus dem örtlichen schwarzen Basalt erbaut, zwischen den Häusern des heutigen Dorfes."
  fr:
    - "Kenath était une ville de l’extrême nord-est du pays à l’est du Jourdain, sur les pentes occidentales du djebel al-Arab, dans le Havran. Lors de la conquête de Galaad et de Basan par les clans de Manassé, « Nobach se mit en marche, prit Kenath avec les villes de son ressort, et l’appela Nobach, d’après son nom ». Le nouveau nom ne dura pas. Les Chroniques, dans la généalogie de Jaïr, descendant de Juda, parlent des « bourgs de Jaïr avec Kenath et les villes de son ressort, soixante villes » : la plupart des traductions modernes lisent que Gueschur et Aram les prirent à Israël, tandis que la version du roi Jacques fait de Jaïr celui qui prit Gueschur et Aram. C’est tout ce que dit la Bible à son sujet."
    - "Kenath est généralement identifiée à Qanawat, à environ 7 km au nord-est de Soueïda, dans le sud de la Syrie, la Canatha des époques grecque et romaine. Pline compte Canatha parmi les villes de la Décapole, et Flavius Josèphe raconte comment l’armée d’Hérode fut battue par les Arabes nabatéens près de Canatha en 32 av. J.-C. La ville prospéra sous Rome : ses ruines comprennent un temple d’Hélios, un petit théâtre et une basilique transformée plus tard en église, le tout bâti en basalte noir local, parmi les maisons du village moderne."
