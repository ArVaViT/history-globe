body:
  en:
    - "Kenath was a town in the far north-east of the land east of the Jordan, on the western slopes of the Jebel al-Arab in the Hauran. In the conquest of Gilead and Bashan by the clans of Manasseh, “Nobah went and took Kenath, and the villages thereof, and called it Nobah, after his own name”. The new name did not last. Chronicles, in the genealogy of Judah's descendant Jair, speaks of “the towns of Jair, from them, with Kenath, and the towns thereof, even threescore cities”: most modern translations read that Geshur and Aram took them from Israel, while the King James Version makes Jair the one who took Geshur and Aram. That is all the Bible says of it."
    - "Kenath is generally identified with Qanawat, about 7 km north-east of Suwayda in southern Syria, the Canatha of Greek and Roman times. Pliny counts Canatha among the cities of the Decapolis, and Josephus tells how Herod's army was defeated by the Nabataean Arabs near Canatha in 32 BC. The town flourished under Rome: its ruins include a temple long ascribed to Helios, a small theatre and a temple later turned into a church, all built of the local black basalt, among the houses of the modern village."
  ru:
    - "Кенаф был городом на крайнем северо-востоке Заиорданья, на западных склонах Джебель-эль-Араба в Хауране. При завоевании Галаада и Васана родами Манассии «Новах пошел и взял Кенаф и зависящие от него города, и назвал его своим именем: Новах». Новое имя не удержалось. Паралипоменон в родословии Иаира отмечает потерю края: «Гессуряне и Сирияне взяли у них селения Иаира, Кенаф и зависящие от него города, — шестьдесят городов»; в переводе короля Якова, напротив, сам Иаир берёт Гессур и Арам. Это всё, что говорит о нём Библия."
    - "Кенаф обычно отождествляют с Канаватом, примерно в 7 км к северо-востоку от Сувейды на юге Сирии, — Канафой греческого и римского времени. Плиний числит Канафу среди городов Десятиградия, а Иосиф Флавий рассказывает, как войско Ирода было разбито набатейскими арабами под Канафой в 32 г. до н. э. При Риме город процветал: среди домов нынешнего селения стоят развалины храма, долго приписывавшегося Гелиосу, небольшого театра и храма, позднее обращённого в церковь, — всё из местного чёрного базальта."
  uk:
    - "Кенат — місто на крайній північному сході землі за Йорданом, на західних схилах Джебель-аль-Араба в Хаврані. Під час завоювання Гілеаду й Башану родами Манасії «Нобах двинув і заняв Кенат і займища його та й назвав його своїм імям Нобах». Нова назва не втрималася. Хроніки, в родоводі нащадка Юди Яїра, говорять про те, що «забрали в їх селитьби Яірові, Кенат і залежні від його міста, — шістьдесять міст»: більшість сучасних перекладів читають, що Гешур і Арам відібрали їх в Ізраїлю, тоді як Біблія короля Якова робить Яїра тим, хто забрав Гешур і Арам. Це все, що Біблія каже про нього."
    - "Кенат загалом ототожнюють з Канаватом, приблизно за 7 км на північний схід від Сувейди в південній Сирії, — Канатою грецьких і римських часів. Пліній зараховує Канату до міст Десятимістя, а Йосиф Флавій розповідає, як військо Ірода було розбите набатейськими арабами поблизу Канати в 32 р. до н. е. Місто процвітало за Риму: серед його руїн храм, який довго приписували Геліосу, невеликий театр і храм, пізніше перетворений на церкву, — усе збудоване з місцевого чорного базальту, поміж будинками сучасного села."
  es:
    - "Kenat era una ciudad del extremo nordeste de la tierra al este del Jordán, en las laderas occidentales del Yebel al-Arab, en el Haurán. En la conquista de Galaad y Basán por los clanes de Manasés, «Noba fué y tomó á Kenath y sus aldeas, y llamóle Noba, conforme á su nombre». El nuevo nombre no perduró. Crónicas, en la genealogía de Jair, descendiente de Judá, habla de «las ciudades de Jair [...] y á Cenath con sus aldeas, sesenta lugares»: la mayoría de las traducciones modernas leen que Gesur y Aram se las arrebataron a Israel, mientras que la versión del rey Jacobo hace de Jair quien tomó Gesur y Aram. Eso es todo lo que la Biblia dice de ella."
    - "Kenat se identifica generalmente con Qanawat, a unos 7 km al nordeste de Suwayda, en el sur de Siria, la Canata de época griega y romana. Plinio cuenta a Canata entre las ciudades de la Decápolis, y Josefo relata cómo el ejército de Herodes fue derrotado por los árabes nabateos cerca de Canata en 32 a. C. La ciudad floreció bajo Roma: entre sus ruinas hay un templo atribuido durante mucho tiempo a Helios, un pequeño teatro y un templo convertido más tarde en iglesia, todos construidos con el basalto negro de la región, entre las casas del pueblo actual."
  pt:
    - "Quenate era uma cidade no extremo nordeste da terra a leste do Jordão, nas encostas ocidentais do Jebel al-Arab, no Haurã. Na conquista de Gileade e Basã pelos clãs de Manassés, “Noba foi e tomou Quenate e os seus povoados, e a chamou de Noba, segundo o seu próprio nome”. O novo nome não durou. As Crônicas, na genealogia de Jair, descendente de Judá, falam de “as cidades de Jair, com Quenate e seus povoados, sessenta cidades ao todo”: a maioria das traduções modernas entende que Gesur e Arã as tomaram de Israel, ao passo que a versão King James faz de Jair quem tomou Gesur e Arã. É tudo o que a Bíblia diz a seu respeito."
    - "Quenate costuma ser identificada com Qanawat, a cerca de 7 km a nordeste de Suwayda, no sul da Síria, a Canata dos tempos grego e romano. Plínio conta Canata entre as cidades da Decápolis, e Josefo relata como o exército de Herodes foi derrotado pelos árabes nabateus perto de Canata em 32 a.C. A cidade floresceu sob Roma: suas ruínas incluem um templo por muito tempo atribuído a Hélio, um pequeno teatro e um templo depois transformado em igreja, todos construídos com o basalto negro local, entre as casas da aldeia moderna."
  de:
    - "Kenat war eine Stadt im äußersten Nordosten des Landes östlich des Jordan, an den Westhängen des Jebel al-Arab im Hauran. Bei der Eroberung Gileads und Baschans durch die Sippen Manasses heißt es: „Nobah ging hin und gewann Knath mit seinen Ortschaften und hieß sie Nobah nach seinem Namen.“ Der neue Name hielt sich nicht. Die Chronik sagt in der Genealogie von Judas Nachkommen Jaïr: „Aber die Gessuriter und Syrer nahmen ihnen die Flecken Jairs, dazu Kenath mit seinen Ortschaften, sechzig Städte“; die meisten modernen Übersetzungen lesen, dass Geschur und Aram sie Israel abnahmen, während die King-James-Version Jaïr zu dem macht, der Geschur und Aram eroberte. Mehr sagt die Bibel darüber nicht."
    - "Kenat wird allgemein mit Qanawat gleichgesetzt, etwa 7 km nordöstlich von Suwayda in Südsyrien, dem Kanatha der griechischen und römischen Zeit. Plinius zählt Kanatha zu den Städten der Dekapolis, und Josephus erzählt, wie das Heer des Herodes 32 v. Chr. bei Kanatha von den nabatäischen Arabern geschlagen wurde. Unter Rom blühte die Stadt: Zu ihren Ruinen gehören ein lange dem Helios zugeschriebener Tempel, ein kleines Theater und ein später in eine Kirche verwandelter Tempel, alle aus dem örtlichen schwarzen Basalt erbaut, zwischen den Häusern des heutigen Dorfes."
  fr:
    - "Kenath était une ville de l’extrême nord-est du pays à l’est du Jourdain, sur les pentes occidentales du djebel al-Arab, dans le Havran. Lors de la conquête de Galaad et de Basan par les clans de Manassé, « Nobach se mit en marche, prit Kenath avec les villes de son ressort, et l’appela Nobach, d’après son nom ». Le nouveau nom ne dura pas. Les Chroniques, dans la généalogie de Jaïr, descendant de Juda, parlent des « bourgs de Jaïr avec Kenath et les villes de son ressort, soixante villes » : la plupart des traductions modernes lisent que Gueschur et Aram les prirent à Israël, tandis que la version du roi Jacques fait de Jaïr celui qui prit Gueschur et Aram. C’est tout ce que dit la Bible à son sujet."
    - "Kenath est généralement identifiée à Qanawat, à environ 7 km au nord-est de Soueïda, dans le sud de la Syrie, la Canatha des époques grecque et romaine. Pline compte Canatha parmi les villes de la Décapole, et Flavius Josèphe raconte comment l’armée d’Hérode fut battue par les Arabes nabatéens près de Canatha en 32 av. J.-C. La ville prospéra sous Rome : ses ruines comprennent un temple longtemps attribué à Hélios, un petit théâtre et un temple transformé plus tard en église, le tout bâti en basalte noir local, parmi les maisons du village moderne."
  it:
    - "Kenat era una città dell’estremo nord-est della terra a oriente del Giordano, sui pendii occidentali del Jebel al-Arab, nell’Auran. Nella conquista di Galaad e di Basan da parte dei clan di Manasse, «Nobah andò e prese Kenath co’ suoi villaggi, e le diede il suo nome di Nobah». Il nuovo nome non durò. Le Cronache, nella genealogia di Iair, discendente di Giuda, dicono che «I Gheshuriti e i Siri presero loro le borgate di Jair, Kenath e i villaggi che ne dipendevano, sessanta città»: la maggior parte delle traduzioni moderne legge che Ghesur e Aram le tolsero a Israele, mentre la King James Version fa di Iair colui che prese Ghesur e Aram. Questo è tutto ciò che la Bibbia ne dice."
    - "Kenat è generalmente identificata con Qanawat, circa 7 km a nord-est di Suwayda nella Siria meridionale, la Canata dell’età greca e romana. Plinio annovera Canata tra le città della Decapoli, e Giuseppe Flavio racconta come l’esercito di Erode fu sconfitto dagli Arabi nabatei presso Canata nel 32 a.C. La città fiorì sotto Roma: le sue rovine comprendono un tempio a lungo attribuito a Helios, un piccolo teatro e un tempio trasformato poi in chiesa, tutti costruiti con il basalto nero locale, tra le case del villaggio moderno."
  pl:
    - "Kenat było miastem w najdalszej północno-wschodniej części ziemi na wschód od Jordanu, na zachodnich stokach Dżabal al-Arab w Hauranie. Podczas podboju Gileadu i Baszanu przez klany Manassesa „Nobe wtargnął, i wziął Kanat z jego wsiami, i nazwał je Nobe od imienia swego”. Nowa nazwa się nie utrzymała. Kroniki, w rodowodzie Jaira, potomka Judy, mówią o „wsi Jairowe, i Kanat z miasteczkami jego, sześćdziesiąt miast”: większość nowoczesnych przekładów czyta, że zabrali je Izraelowi Geszur i Aram, podczas gdy Biblia Króla Jakuba czyni Jaira tym, który zabrał Geszur i Aram. Tyle Biblia mówi o tym mieście."
    - "Kenat utożsamia się zazwyczaj z Qanawat, około 7 km na północny wschód od As-Suwajda w południowej Syrii, z Kanatą czasów greckich i rzymskich. Pliniusz zalicza Kanatę do miast Dekapolu, a Józef Flawiusz opowiada, jak wojsko Heroda zostało pobite przez arabskich Nabatejczyków pod Kanatą w 32 r. p.n.e. Miasto rozkwitało pod rządami Rzymu: wśród jego ruin są świątynia długo przypisywana Heliosowi, mały teatr i świątynia przekształcona później w kościół, wszystkie zbudowane z miejscowego czarnego bazaltu, wśród domów dzisiejszej wsi."
  nl:
    - "Kenat was een stad in het uiterste noordoosten van het land ten oosten van de Jordaan, op de westhellingen van de Jebel al-Arab in de Hauran. Bij de verovering van Gilead en Basan door de geslachten van Manasse gebeurde dit: “Nobah ging heen, en nam Kenath in, met haar onderhorige plaatsen, en noemde ze Nobah naar zijn naam”. De nieuwe naam bleef niet bestaan. Kronieken spreekt in de stamboom van Jaïr, een afstammeling van Juda, van “de vlekken van Jaïr, van dezelve, met Kenath en haar onderhorige plaatsen, zestig steden”: de meeste moderne vertalingen lezen dat Gesur en Aram ze Israël ontnamen, terwijl de King James Version Jaïr degene maakt die Gesur en Aram innam. Meer zegt de Bijbel er niet over."
    - "Kenat wordt algemeen geïdentificeerd met Qanawat, ongeveer 7 km ten noordoosten van Suwayda in Zuid-Syrië, het Canatha uit de Griekse en Romeinse tijd. Plinius rekent Canatha tot de steden van de Dekapolis, en Josephus vertelt hoe het leger van Herodes in 32 v.Chr. bij Canatha door de Nabatese Arabieren werd verslagen. De stad bloeide onder Rome: haar ruïnes omvatten een tempel die lang aan Helios werd toegeschreven, een klein theater en een tempel die later in een kerk werd veranderd, alle gebouwd van het plaatselijke zwarte basalt, tussen de huizen van het moderne dorp."
  cs:
    - "Kenat bylo město na dalekém severovýchodě země východně od Jordánu, na západních svazích Jebel al-Arab v Havranu. Při dobývání Gileadu a Bášanu rody Manasesovými „Nobe také táhl, a vzal Kanat a městečka jeho, a nazval je Nobe od jména svého“. Nové jméno se neujalo. Kroniky v rodopise Jaíra, potomka Judova, mluví o „vsi Jairovy, i Kanat s městečky jeho, šedesáte měst“: většina moderních překladů čte, že je Izraeli vzaly Gešur a Aram, kdežto anglická Bible krále Jakuba činí z Jaíra toho, kdo dobyl Gešur a Aram. Víc o něm Bible neříká."
    - "Kenat se obecně ztotožňuje s Qanawatem, asi 7 km severovýchodně od Suwayda v jižní Sýrii, řeckou a římskou Kanathou. Plinius počítá Kanathu mezi města Dekapole a Josephus vypráví, jak byla Herodova armáda roku 32 př. n. l. poražena nabatejskými Araby u Kanathy. Za Říma město vzkvétalo: mezi jeho zříceninami je chrám dlouho připisovaný Héliovi, malé divadlo a chrám později přestavěný na kostel, vše z místního černého čediče, mezi domy dnešní vesnice."
  sv:
    - "Kenat var en stad längst i nordost av landet öster om Jordan, på Jebel al-Arabs västra sluttningar i Hauran. Vid Manasses släkters erövring av Gilead och Bashan heter det: ”Noba gick åstad och intog Kenat, med underlydande orter, och kallade det Noba, efter sitt eget namn”. Det nya namnet höll sig inte. Krönikeböckerna talar i släktregistret över Judas ättling Jair om ”Jairs byar jämte Kenat med underlydande orter, sextio städer”: de flesta moderna översättningar läser att Geshur och Aram tog dem från Israel, medan King James Version gör Jair till den som tog Geshur och Aram. Det är allt Bibeln säger om den."
    - "Kenat identifieras vanligen med Qanawat, omkring 7 km nordost om Suwayda i södra Syrien, grekisk-romersk tids Kanatha. Plinius räknar Kanatha bland Dekapolis städer, och Josefus berättar hur Herodes' här besegrades av de nabateiska araberna nära Kanatha år 32 f.Kr. Staden blomstrade under Rom: dess ruiner omfattar ett tempel som länge tillskrivits Helios, en liten teater och ett tempel som senare gjordes om till kyrka, alla byggda av den lokala svarta basalten, bland den moderna byns hus."
