# Overview article (ADR 0007). Mainstream facts only; the site is disputed (Khirbet Qana or Kafr Kanna) and is named as such.
id: cana
place: a031bda
title:
  en: "Cana of Galilee"
  ru: "Кана Галилейская"
  uk: "Кана Галілейська"
  es: "Caná de Galilea"
  pt: "Caná da Galileia"
  de: "Kana in Galiläa"
  fr: "Cana de Galilée"
  it: "Cana di Galilea"
  pl: "Kana Galilejska"
  nl: "Kana in Galilea"
  cs: "Kána Galilejská"
  sv: "Kana i Galileen"
body:
  en:
    - "Cana of Galilee was a village in the hills of Lower Galilee, and its site is disputed. Two places have the strongest claims. Khirbet Qana is a ruined hill on the northern edge of the Beit Netofa Valley, about 13 km north of Nazareth. Kafr Kanna is a town about 7 km north-east of Nazareth on the road to Tiberias, where the churches of the wedding stand today. A third claimant, Qana in southern Lebanon, follows an early tradition that placed Cana near Sidon."
    - "Both sites have been excavated. At Khirbet Qana, Douglas Edwards and C. Thomas McCollough uncovered a Jewish village that grew from the Hellenistic period into the Byzantine, with ritual baths and a public building that may have been a synagogue. At Karm er-Ras, on the western edge of Kafr Kanna, Yardenna Alexandre excavated from 1999 to 2011 a Jewish village of the early Roman period that later declined."
    - "Cana is named only in the Gospel of John. At a marriage there, where the mother of Jesus was and to which Jesus and his disciples were called, he turned water into wine, and John calls it the beginning of his miracles. When he came to Cana again, a nobleman whose son lay sick at Capernaum begged him to come down; Jesus told him that his son lived, and the boy recovered at that hour. Nathanael, one of the disciples, was of Cana."
    - "In the war of AD 66-67 Josephus, then commanding in Galilee, lodged in a village of Galilee named Cana and from there marched all night to Tiberias. Christian writers disagreed about where Cana was. Eusebius, in the early fourth century, identified it with the Kanah of Joshua in the lot of Asher near Sidon. In 386 Paula and Eustochium wrote from Bethlehem that from Nazareth Cana could be seen not far off, and Jerome tells that Paula passed through Cana on her journey through Galilee. At Khirbet Qana the excavators found a cave complex later adapted for Christian veneration; which site the pilgrims of late antiquity saw remains a matter of debate."
  ru:
    - "Кана Галилейская была селением в горах Нижней Галилеи, и её место спорно. Сильнее всего притязания двух мест. Хирбет-Кана — холм с развалинами на северном краю долины Бейт-Нетофа, примерно в 13 км к северу от Назарета. Кафр-Канна — городок примерно в 7 км к северо-востоку от Назарета на дороге в Тивериаду, где сегодня стоят церкви в память брака. Третий претендент, Кана на юге Ливана, следует раннему преданию, помещавшему Кану близ Сидона."
    - "Оба места раскопаны. На Хирбет-Кане Дуглас Эдвардс и К. Томас Маккалоу открыли иудейское селение, существовавшее с эллинистического периода до византийского, с миквами и общественным зданием, которое, возможно, было синагогой. В Карм-эр-Расе, на западной окраине Кафр-Канны, Ярдена Александр в 1999–2011 гг. раскопала иудейское селение раннеримского времени, позже пришедшее в упадок."
    - "Кана названа только в Евангелии от Иоанна. На браке там, где была Матерь Иисуса и куда были званы Иисус и Его ученики, Он претворил воду в вино, и Иоанн называет это началом чудес. Когда Он снова пришёл в Кану, царедворец, у которого сын лежал больным в Капернауме, просил Его прийти; Иисус сказал ему, что сын его здоров, и мальчику стало легче в тот самый час. Из Каны был и Нафанаил, один из учеников."
    - "Во время войны 66–67 гг. н. э. Иосиф Флавий, тогда начальствовавший в Галилее, жил в галилейском селении, называемом Кана, и оттуда всю ночь шёл в Тивериаду. Христианские писатели расходились в том, где была Кана. Евсевий в начале IV века отождествлял её с Каной из книги Иисуса Навина, в уделе колена Асирова близ Сидона. В 386 г. Павла и Евстохия писали из Вифлеема, что от Назарета неподалёку видна Кана, а Иероним рассказывает, что Павла прошла через Кану в своём странствии по Галилее. На Хирбет-Кане раскопщики нашли пещерный комплекс, позже приспособленный для христианского почитания; какое из мест видели паломники поздней античности, остаётся предметом спора."
  uk:
    - "Кана Галілейська була селом у горах Нижньої Галілеї, і її місце є спірним. Найсильніші претензії мають два місця. Хірбет-Кана — руїнний пагорб на північному краї долини Бейт-Нетофа, приблизно за 13 км на північ від Назарета. Кафр-Канна — містечко приблизно за 7 км на північний схід від Назарета на дорозі до Тіверіади, де сьогодні стоять церкви весілля. Третій претендент, Кана в південному Лівані, йде за ранньою традицією, яка розміщувала Кану поблизу Сідона."
    - "Обидва місця розкопано. У Хірбет-Кані Дуглас Едвардс і К. Томас Маккалоу відкрили юдейське село, що росло від елліністичного періоду до візантійського, з ритуальними купальнями та громадською будівлею, яка могла бути синагогою. У Карм-ер-Расі, на західному краї Кафр-Канни, Ярденна Александр розкопувала з 1999 до 2011 р. юдейське село раннього римського періоду, яке згодом занепало."
    - "Кана названа лише в Євангелії від Івана. На весіллі там, де була мати Ісуса й куди було запрошено Ісуса з Його учнями, Він перетворив воду на вино, і Іван називає це початком Його чудес. Коли Він знову прийшов до Кани, вельможа, чий син лежав хворий у Капернаумі, благав Його зійти; Ісус сказав йому, що син його живий, і хлопець видужав тієї самої години. Натанаїл, один з учнів, був з Кани."
    - "Під час війни 66–67 рр. н. е. Йосиф Флавій, тоді начальник у Галілеї, зупинився в галілейському селі на ім'я Кана й звідти цілу ніч ішов до Тіверіади. Християнські автори розходилися щодо того, де була Кана. Євсевій на початку IV ст. ототожнив її з Каною Ісуса Навина в уділі Асіра поблизу Сідона. У 386 р. Павла та Євстохія писали з Вифлеєму, що з Назарета Кану було видно неподалік, а Ієронім розповідає, що Павла проходила через Кану під час своєї подорожі Галілеєю. У Хірбет-Кані розкопувачі знайшли печерний комплекс, пізніше пристосований для християнського вшанування; яке місце бачили прочани пізньої античності, лишається предметом суперечки."
  es:
    - "Caná de Galilea era una aldea en las colinas de la Baja Galilea, y su emplazamiento es objeto de debate. Dos lugares tienen las pretensiones más fuertes. Khirbet Qana es una colina en ruinas en el borde septentrional del valle de Beit Netofa, a unos 13 km al norte de Nazaret. Kafr Kanna es una ciudad a unos 7 km al nordeste de Nazaret, en el camino a Tiberias, donde se alzan hoy las iglesias de la boda. Un tercer aspirante, Qana, en el sur del Líbano, sigue una tradición antigua que situaba Caná cerca de Sidón."
    - "Ambos sitios han sido excavados. En Khirbet Qana, Douglas Edwards y C. Thomas McCollough sacaron a la luz una aldea judía que creció desde el periodo helenístico hasta el bizantino, con baños rituales y un edificio público que pudo ser una sinagoga. En Karm er-Ras, en el borde occidental de Kafr Kanna, Yardenna Alexandre excavó de 1999 a 2011 una aldea judía de comienzos de la época romana que más tarde decayó."
    - "Caná se nombra solo en el Evangelio de Juan. En una boda celebrada allí, a la que asistía la madre de Jesús y a la que fueron invitados Jesús y sus discípulos, convirtió el agua en vino, y Juan lo llama el principio de sus milagros. Cuando volvió a Caná, un noble cuyo hijo yacía enfermo en Cafarnaúm le rogó que bajara; Jesús le dijo que su hijo vivía, y el muchacho se recuperó en aquella hora. Natanael, uno de los discípulos, era de Caná."
    - "En la guerra del 66-67 d. C., Josefo, que entonces mandaba en Galilea, se alojó en una aldea de Galilea llamada Caná y de allí marchó toda la noche hasta Tiberias. Los escritores cristianos discrepaban sobre dónde estaba Caná. Eusebio, a principios del siglo IV, la identificó con la Caná de Josué, en la suerte de Aser, cerca de Sidón. En el 386 Paula y Eustoquio escribieron desde Belén que desde Nazaret se veía Caná no lejos, y Jerónimo cuenta que Paula pasó por Caná en su viaje por Galilea. En Khirbet Qana los excavadores hallaron un complejo de cuevas adaptado más tarde para la veneración cristiana; cuál de los dos sitios vieron los peregrinos de la Antigüedad tardía sigue siendo materia de debate."
  pt:
    - "Caná da Galileia era uma aldeia nas montanhas da Baixa Galileia, e seu local é disputado. Dois lugares têm as reivindicações mais fortes. Khirbet Qana é uma colina em ruínas no limite norte do Vale de Beit Netofa, cerca de 13 km ao norte de Nazaré. Kafr Kanna é uma cidade a cerca de 7 km a nordeste de Nazaré, na estrada para Tiberíades, onde hoje se erguem as igrejas do casamento. Um terceiro candidato, Qana, no sul do Líbano, segue uma tradição antiga que situava Caná perto de Sidom."
    - "Ambos os locais foram escavados. Em Khirbet Qana, Douglas Edwards e C. Thomas McCollough descobriram uma aldeia judaica que cresceu do período helenístico ao bizantino, com banhos rituais e um edifício público que pode ter sido uma sinagoga. Em Karm er-Ras, na extremidade ocidental de Kafr Kanna, Yardenna Alexandre escavou, de 1999 a 2011, uma aldeia judaica do início do período romano que depois declinou."
    - "Caná é nomeada somente no Evangelho de João. Num casamento ali, em que estava a mãe de Jesus e para o qual Jesus e seus discípulos foram convidados, ele transformou água em vinho, e João o chama de o princípio de seus sinais. Quando ele voltou a Caná, um nobre cujo filho jazia doente em Cafarnaum lhe suplicou que descesse; Jesus lhe disse que seu filho vivia, e o menino se recuperou naquela hora. Natanael, um dos discípulos, era de Caná."
    - "Na guerra de 66-67 d.C., Josefo, então comandante na Galileia, hospedou-se numa aldeia da Galileia chamada Caná e dali marchou a noite toda até Tiberíades. Os escritores cristãos divergiam sobre onde ficava Caná. Eusébio, no início do século IV, a identificou com a Caná de Josué, no lote de Aser, perto de Sidom. Em 386, Paula e Eustóquia escreveram de Belém que de Nazaré se podia ver Caná, não muito longe, e Jerônimo conta que Paula passou por Caná em sua viagem pela Galileia. Em Khirbet Qana, os escavadores acharam um complexo de cavernas depois adaptado à veneração cristã; qual local os peregrinos da Antiguidade tardia viram continua em debate."
  de:
    - "Kana in Galiläa war ein Dorf im Bergland von Untergaliläa, und seine Lage ist umstritten. Zwei Orte haben die stärksten Ansprüche. Khirbet Qana ist ein Ruinenhügel am Nordrand des Beit-Netofa-Tals, etwa 13 km nördlich von Nazareth. Kafr Kanna ist eine Stadt etwa 7 km nordöstlich von Nazareth an der Straße nach Tiberias, wo heute die Hochzeitskirchen stehen. Ein dritter Anwärter, Qana im Südlibanon, folgt einer frühen Überlieferung, die Kana bei Sidon verortete."
    - "Beide Orte sind ausgegraben worden. In Khirbet Qana legten Douglas Edwards und C. Thomas McCollough ein jüdisches Dorf frei, das von hellenistischer Zeit bis in die byzantinische Zeit wuchs, mit rituellen Bädern und einem öffentlichen Gebäude, das eine Synagoge gewesen sein könnte. In Karm er-Ras am Westrand von Kafr Kanna grub Yardenna Alexandre von 1999 bis 2011 ein jüdisches Dorf der frühen römischen Zeit, das später verfiel."
    - "Kana wird nur im Johannesevangelium genannt. Bei einer Hochzeit dort, bei der die Mutter Jesu war und zu der Jesus und seine Jünger geladen waren, verwandelte er Wasser in Wein, und Johannes bezeichnet das als den Anfang seiner Zeichen. Als er wieder nach Kana kam, bat ihn ein königlicher Beamter, dessen Sohn in Kapernaum krank lag, herabzukommen; Jesus sagte ihm, sein Sohn lebe, und der Knabe wurde in jener Stunde gesund. Nathanael, einer der Jünger, stammte aus Kana."
    - "Im Krieg der Jahre 66–67 n. Chr. nahm Josephus, damals Befehlshaber in Galiläa, Quartier in einem Dorf in Galiläa namens Kana und marschierte von dort die ganze Nacht nach Tiberias. Christliche Schriftsteller waren uneins, wo Kana lag. Eusebius setzte es Anfang des 4. Jahrhunderts mit dem Kana Josuas im Los Assers nahe Sidon gleich. Im Jahr 386 schrieben Paula und Eustochium aus Bethlehem, dass man von Nazareth aus Kana nicht weit entfernt sehen könne, und Hieronymus erzählt, Paula sei auf ihrer Reise durch Galiläa durch Kana gekommen. In Khirbet Qana fanden die Ausgräber einen Höhlenkomplex, der später für die christliche Verehrung hergerichtet wurde; welchen Ort die Pilger der Spätantike sahen, bleibt umstritten."
  fr:
    - "Cana de Galilée était un village des collines de Basse Galilée, et son emplacement est discuté. Deux lieux ont les titres les plus solides. Khirbet Qana est une colline en ruine au bord nord de la vallée de Beit Netofa, à environ 13 km au nord de Nazareth. Kafr Kanna est une ville à environ 7 km au nord-est de Nazareth, sur la route de Tibériade, où se dressent aujourd’hui les églises des noces. Un troisième prétendant, Qana, dans le sud du Liban, suit une tradition ancienne qui plaçait Cana près de Sidon."
    - "Les deux sites ont été fouillés. À Khirbet Qana, Douglas Edwards et C. Thomas McCollough ont mis au jour un village juif qui se développa de l’époque hellénistique à l’époque byzantine, avec des bains rituels et un édifice public qui a pu être une synagogue. À Karm er-Ras, en bordure ouest de Kafr Kanna, Yardenna Alexandre a fouillé de 1999 à 2011 un village juif du début de l’époque romaine, qui déclina ensuite."
    - "Cana n’est nommée que dans l’Évangile de Jean. Lors d’une noce, où se trouvait la mère de Jésus et à laquelle Jésus et ses disciples furent invités, il changea l’eau en vin, et Jean en fait le commencement de ses miracles. Quand il revint à Cana, un notable dont le fils était malade à Capernaüm le supplia de descendre ; Jésus lui dit que son fils vivait, et l’enfant guérit à cette heure. Nathanaël, l’un des disciples, était de Cana."
    - "Pendant la guerre de 66-67 apr. J.-C., Josèphe, alors chef en Galilée, logea dans un village de Galilée nommé Cana et marcha de là toute la nuit jusqu’à Tibériade. Les auteurs chrétiens n’étaient pas d’accord sur l’emplacement de Cana. Eusèbe, au début du IVe siècle, l’identifiait à la Kana de Josué dans le lot d’Aser, près de Sidon. En 386, Paula et Eustochium écrivirent de Bethléem que, depuis Nazareth, on pouvait voir Cana non loin, et Jérôme raconte que Paula passa par Cana dans son voyage à travers la Galilée. À Khirbet Qana, les fouilleurs ont trouvé un ensemble de grottes adapté plus tard à la vénération chrétienne ; quel site virent les pèlerins de l’Antiquité tardive reste débattu."
  it:
    - "Cana di Galilea era un villaggio sulle colline della Bassa Galilea, e il suo sito è controverso. Due luoghi hanno le pretese più forti. Khirbet Qana è un’altura in rovina sul margine settentrionale della Valle di Beit Netofa, a circa 13 km a nord di Nazaret. Kafr Kanna è una cittadina a circa 7 km a nord-est di Nazaret, sulla strada per Tiberiade, dove oggi sorgono le chiese delle nozze. Un terzo candidato, Qana nel Libano meridionale, segue un’antica tradizione che poneva Cana presso Sidone."
    - "Entrambi i siti sono stati scavati. A Khirbet Qana, Douglas Edwards e C. Thomas McCollough hanno portato alla luce un villaggio ebraico cresciuto dall’età ellenistica a quella bizantina, con bagni rituali e un edificio pubblico che potrebbe essere stato una sinagoga. A Karm er-Ras, al margine occidentale di Kafr Kanna, Yardenna Alexandre ha scavato dal 1999 al 2011 un villaggio ebraico della prima età romana che poi declinò."
    - "Cana è nominata solo nel Vangelo di Giovanni. A nozze celebrate là, dove si trovava la madre di Gesù e a cui furono invitati Gesù e i suoi discepoli, egli mutò l’acqua in vino, e Giovanni lo chiama l’inizio dei suoi miracoli. Quando tornò a Cana, un funzionario regio il cui figlio giaceva malato a Cafarnao lo pregò di scendere; Gesù gli disse che suo figlio viveva, e il ragazzo guarì in quell’ora. Natanaele, uno dei discepoli, era di Cana."
    - "Nella guerra del 66-67 d.C. Giuseppe Flavio, allora al comando in Galilea, alloggiò in un villaggio di Galilea chiamato Cana e di là marciò tutta la notte verso Tiberiade. Gli scrittori cristiani non erano d’accordo su dove fosse Cana. Eusebio, all’inizio del IV secolo, la identificò con la Cana di Giosuè nella sorte di Aser, presso Sidone. Nel 386 Paola ed Eustochio scrissero da Betlemme che da Nazaret si vedeva Cana non lontano, e Girolamo racconta che Paola passò per Cana nel suo viaggio attraverso la Galilea. A Khirbet Qana gli scavatori hanno trovato un complesso di grotte adattato in seguito alla venerazione cristiana; quale sito vedessero i pellegrini della tarda antichità resta oggetto di dibattito."
  pl:
    - "Kana Galilejska była wsią w górach Dolnej Galilei, a jej położenie jest sporne. Dwa miejsca mają najmocniejsze roszczenia. Chirbet Kana to zrujnowane wzgórze na północnym skraju doliny Bet Netofa, około 13 km na północ od Nazaretu. Kafr Kanna to miasto około 7 km na północny wschód od Nazaretu przy drodze do Tyberiady, gdzie stoją dziś kościoły wesela. Trzeci pretendent, Kana w południowym Libanie, idzie za wczesną tradycją, która umieszczała Kanę koło Sydonu."
    - "Oba miejsca zostały zbadane wykopaliskami. W Chirbet Kana Douglas Edwards i C. Thomas McCollough odsłonili żydowską wieś, która rozwijała się od okresu hellenistycznego do bizantyjskiego, z łaźniami rytualnymi i budynkiem publicznym, który mógł być synagogą. W Karm er-Ras, na zachodnim skraju Kafr Kanna, Yardenna Alexandre prowadziła w latach 1999–2011 wykopaliska żydowskiej wsi z wczesnego okresu rzymskiego, która później podupadła."
    - "Kana jest wymieniona tylko w Ewangelii Jana. Na weselu tam, gdzie była matka Jezusa i na które zaproszono Jezusa i jego uczniów, zamienił on wodę w wino, a Jan nazywa to początkiem jego cudów. Gdy przyszedł do Kany ponownie, dworzanin, którego syn leżał chory w Kafarnaum, błagał go, by przyszedł; Jezus powiedział mu, że jego syn żyje, i chłopiec wyzdrowiał w tej godzinie. Natanael, jeden z uczniów, pochodził z Kany."
    - "W wojnie 66–67 r. n.e. Józef Flawiusz, wówczas dowodzący w Galilei, zatrzymał się w galilejskiej wsi zwanej Kana i stamtąd całą noc maszerował do Tyberiady. Pisarze chrześcijańscy różnili się co do położenia Kany. Euzebiusz na początku IV w. utożsamił ją z Kaną z Księgi Jozuego w losie Aszera koło Sydonu. W 386 r. Paula i Eustochium pisały z Betlejem, że z Nazaretu widać niedaleko Kanę, a Hieronim opowiada, że Paula przeszła przez Kanę w swojej podróży po Galilei. W Chirbet Kana badacze znaleźli zespół jaskiń, później przystosowany do czci chrześcijańskiej; które miejsce widzieli pielgrzymi późnego antyku, pozostaje przedmiotem dyskusji."
  nl:
    - "Kana in Galilea was een dorp in het heuvelland van Neder-Galilea, en de ligging ervan is omstreden. Twee plaatsen hebben de sterkste aanspraken. Khirbet Qana is een verwoeste heuvel aan de noordrand van de vallei van Beth-Netofa, ongeveer 13 km ten noorden van Nazareth. Kafr Kanna is een stad op zo'n 7 km ten noordoosten van Nazareth aan de weg naar Tiberias, waar tegenwoordig de kerken van de bruiloft staan. Een derde pretendent, Qana in Zuid-Libanon, volgt een vroege overlevering die Kana bij Sidon plaatste."
    - "Beide plaatsen zijn opgegraven. Bij Khirbet Qana legden Douglas Edwards en C. Thomas McCollough een Joods dorp bloot dat van de hellenistische tijd tot in de Byzantijnse tijd groeide, met rituele baden en een openbaar gebouw dat een synagoge kan zijn geweest. Bij Karm er-Ras, aan de westrand van Kafr Kanna, groef Yardenna Alexandre van 1999 tot 2011 een Joods dorp uit de vroege Romeinse tijd dat later in verval raakte."
    - "Kana wordt alleen in het evangelie van Johannes genoemd. Op een bruiloft daar, waar de moeder van Jezus was en waartoe Jezus en zijn leerlingen waren uitgenodigd, veranderde hij water in wijn, en Johannes noemt dat het begin van zijn tekenen. Toen hij weer in Kana kwam, smeekte een hoveling wiens zoon ziek lag in Kafarnaüm hem af te komen; Jezus zei hem dat zijn zoon leefde, en de jongen herstelde op dat uur. Natanaël, een van de leerlingen, was uit Kana."
    - "In de oorlog van 66-67 n.Chr. overnachtte Flavius Josephus, toen bevelhebber in Galilea, in een dorp in Galilea met de naam Kana en trok vandaar de hele nacht door naar Tiberias. Christelijke schrijvers verschilden van mening over de ligging van Kana. Eusebius identificeerde het in het begin van de 4e eeuw met het Kana van Jozua in het lot van Aser bij Sidon. In 386 schreven Paula en Eustochium uit Bethlehem dat Kana vanuit Nazareth niet ver weg te zien was, en Hieronymus vertelt dat Paula op haar reis door Galilea door Kana kwam. Bij Khirbet Qana vonden de opgravers een grottencomplex dat later voor christelijke verering werd ingericht; welke plaats de pelgrims uit de late oudheid zagen, blijft een punt van discussie."
  cs:
    - "Kána Galilejská byla vesnice v kopcích Dolní Galileje a její poloha je sporná. Největší nároky mají dvě místa. Khirbet Qana je zřícený pahorek na severním okraji údolí Bét Netofa, asi 13 km severně od Nazareta. Kafr Kanna je městečko asi 7 km severovýchodně od Nazareta na cestě do Tiberiady, kde dnes stojí kostely svatby. Třetí uchazeč, Qana v jižním Libanonu, sleduje starou tradici, která kladla Kánu poblíž Sidónu."
    - "Obě místa byla vykopávána. V Khirbet Qana odkryli Douglas Edwards a C. Thomas McCollough židovskou vesnici, která rostla od helénistického období do byzantského, s rituálními lázněmi a veřejnou budovou, která mohla být synagogou. V Karm er-Ras na západním okraji Kafr Kanny vykopávala v letech 1999–2011 Yardenna Alexandre židovskou vesnici z raného římského období, která později upadla."
    - "Kána je jmenována pouze v Janově evangeliu. Na svatbě tam, kde byla matka Ježíšova a kam byli pozváni Ježíš a jeho učedníci, proměnil vodu ve víno a Jan to nazývá počátkem jeho zázraků. Když přišel do Kány znovu, prosil ho šlechtic, jehož syn ležel nemocen v Kafarnaum, aby sestoupil; Ježíš mu řekl, že jeho syn žije, a chlapec se v tu hodinu uzdravil. Natanael, jeden z učedníků, byl z Kány."
    - "Ve válce let 66–67 n. l. se Josephus, tehdy velící v Galileji, ubytoval ve vesnici v Galileji zvané Kána a odtud pochodoval celou noc do Tiberiady. Křesťanští autoři se o poloze Kány rozcházeli. Eusebios na počátku 4. století ji ztotožnil s Kánou z knihy Jozue v losu Ašer poblíž Sidónu. Roku 386 napsaly Paula a Eustochium z Betléma, že z Nazareta je Kána vidět nedaleko, a Jeroným vypráví, že Paula procházela Kánou na své cestě po Galileji. V Khirbet Qana vykopávači našli jeskynní komplex později upravený pro křesťanskou úctu; které místo viděli poutníci pozdní antiky, zůstává předmětem debaty."
  sv:
    - "Kana i Galileen var en by i nedre Galileens berg, och dess läge är omtvistat. Två platser har de starkaste anspråken. Khirbet Qana är en ruinkulle vid norra kanten av Beit Netofa-dalen, omkring 13 km norr om Nasaret. Kafr Kanna är en stad omkring 7 km nordost om Nasaret på vägen till Tiberias, där bröllopskyrkorna ligger i dag. En tredje kandidat, Qana i södra Libanon, följer en tidig tradition som placerade Kana nära Sidon."
    - "Båda platserna har grävts ut. Vid Khirbet Qana blottade Douglas Edwards och C. Thomas McCollough en judisk by som växte från hellenistisk tid in i bysantinsk, med ritualbad och en offentlig byggnad som kan ha varit en synagoga. Vid Karm er-Ras, i västra utkanten av Kafr Kanna, grävde Yardenna Alexandre 1999–2011 ut en judisk by från äldre romersk tid som sedan förföll."
    - "Kana nämns bara i Johannesevangeliet. Vid ett bröllop där, dit Jesu mor kom och Jesus och hans lärjungar var inbjudna, förvandlade han vatten till vin, och Johannes kallar det början på hans tecken. När han kom till Kana igen bad en kunglig tjänsteman vars son låg sjuk i Kafarnaum honom att komma ner; Jesus sade att hans son levde, och pojken blev frisk i samma stund. Natanael, en av lärjungarna, var från Kana."
    - "I kriget år 66–67 e.Kr. tog Josefus, som då hade befälet i Galileen, in i en by i Galileen som hette Kana och marscherade därifrån hela natten till Tiberias. Kristna författare var oense om var Kana låg. Eusebios identifierade det i början av 300-talet med Josuas Kana i Ashers lott nära Sidon. År 386 skrev Paula och Eustochium från Betlehem att man från Nasaret kunde se Kana inte långt borta, och Hieronymus berättar att Paula passerade Kana på sin resa genom Galileen. Vid Khirbet Qana fann utgrävarna ett grottkomplex som senare gjordes om för kristen vördnad; vilken plats senantikens pilgrimer såg är fortfarande omdebatterat."
