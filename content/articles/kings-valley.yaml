# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the candidates on the map are given without choosing one.
id: kings-valley
place: ac9f98d
title:
  en: "King’s Valley"
  ru: "Долина царская"
  uk: "Долина Царська"
  es: "Valle del Rey"
  pt: "Vale do Rei"
  de: "Königstal"
  fr: "Vallée du Roi"
body:
  en:
    - "The King’s Valley, or King’s Dale, appears twice. When Abram came back from defeating Chedorlaomer, “the king of Sodom went out to meet him … at the valley of Shaveh, which is the king’s dale”, and there Melchizedek, king of Salem, brought out bread and wine and blessed him. Centuries later Absalom, having no son, “had taken and reared up for himself a pillar, which is in the king’s dale … and it is called unto this day, Absalom’s place”. Josephus says the pillar was of marble and stood two stadia from Jerusalem; the Genesis Apocryphon from Qumran calls the valley of Shaveh the valley of Beth-haccherem."
    - "So the valley was presumably near Jerusalem, if Salem is Jerusalem, but nothing fixes it. The candidates on the map are the meeting of the Kidron and Hinnom valleys south of the City of David, which is marked first, the Kidron itself, the Hinnom valley, Wadi al-Joz north of the Old City, and the area of Ramat Rahel, which some take for Beth-haccherem. The monument in the Kidron now called Absalom’s Tomb (Yad Avshalom) is a tomb of the late Second Temple period, a thousand years after Absalom, and its name is a later tradition, not evidence for the site."
  ru:
    - "Долина царская упоминается дважды. Когда Аврам возвращался после поражения Кедорлаомера, «царь Содомский вышел ему навстречу в долину Шаве, что ныне долина царская», и там Мелхиседек, царь Салимский, вынес ему хлеб и вино и благословил его. Спустя века Авессалом, не имея сына, «еще при жизни своей взял и поставил себе памятник в царской долине», назвал его своим именем, и книга говорит, что имя «памятник Авессалома» держалось «до сего дня». Иосиф Флавий говорит, что памятник был мраморный и стоял в двух стадиях от Иерусалима; кумранский Апокриф Бытия называет долину Шаве долиной Бефкарема."
    - "Значит, долина, по-видимому, была близ Иерусалима, если Салим — это Иерусалим, но ничто не указывает места точно. Кандидаты на карте — слияние Кедронской долины и долины Еннома к югу от Города Давида, которое стоит первым, сам Кедрон, долина Еннома, Вади-эль-Джоз к северу от Старого города и окрестности Рамат-Рахеля, который некоторые считают Бефкаремом. Памятник в Кедроне, ныне называемый гробницей Авессалома (Яд-Авшалом), — гробница позднего периода Второго храма, на тысячу лет моложе Авессалома, и его имя — позднее предание, а не довод в пользу места."
  uk:
    - "Долина Царська, або Царський дол, з’являється двічі. Коли Аврам повертався після перемоги над Кедорлаомером, «Вийшов же царь Содомський на зустріч йому … на Саве-долину, се долина Царська», і там Мелхиседек, цар Салімський, виніс хліб і вино й благословив його. Через століття Авесалом, не маючи сина, «взяв та й поставив собі памятник в царській долинї … І зветься він по сей день „Рука Абессаломова‟». Йосиф Флавій каже, що стовп був мармуровий і стояв за два стадії від Єрусалима; Апокриф Книги Буття з Кумрана називає долину Шаве долиною Бет-Гакерема."
    - "Отже, долина, мабуть, була поблизу Єрусалима, якщо Салім — це Єрусалим, але нічого не вказує на неї напевно. Кандидати на мапі — місце зустрічі долин Кедрон і Гінном на південь від Міста Давида, позначене першим, сам Кедрон, долина Гінном, ваді аль-Джоз на північ від Старого міста та район Рамат-Рахелі, який дехто вважає за Бет-Гакерем. Пам’ятка в Кедроні, яку тепер називають Гробницею Авесалома (Яд-Авшалом), — це гробниця пізньої доби Другого храму, на тисячу років пізніша за Авесалома, і її назва — пізніша традиція, а не доказ щодо місця."
  es:
    - "El Valle del Rey aparece dos veces. Cuando Abram volvía de derrotar a Quedorlaomer, «salió el rey de Sodoma á recibirlo [...] al valle de Shave, que es el valle del Rey», y allí Melquisedec, rey de Salem, sacó pan y vino y lo bendijo. Siglos después, Absalón, que no tenía hijo, «había [...] tomado y levantádose una columna, la cual está en el valle del rey [...] y así se llamó el Lugar de Absalom, hasta hoy». Josefo dice que la columna era de mármol y estaba a dos estadios de Jerusalén; el Apócrifo del Génesis, de Qumrán, llama al valle de Shave el valle de Bet-haquerem."
    - "Así pues, el valle estaba presumiblemente cerca de Jerusalén, si Salem es Jerusalén, pero nada lo fija. Los candidatos en el mapa son la confluencia de los valles del Cedrón y de Hinnom, al sur de la Ciudad de David, que aparece marcada en primer lugar, el propio Cedrón, el valle de Hinnom, el Wadi al-Joz, al norte de la Ciudad Vieja, y la zona de Ramat Rajel, que algunos toman por Bet-haquerem. El monumento del Cedrón que hoy se llama Tumba de Absalón (Yad Avshalom) es una tumba de finales del período del Segundo Templo, mil años posterior a Absalón, y su nombre es una tradición tardía, no una prueba del lugar."
  pt:
    - "O Vale do Rei aparece duas vezes. Quando Abrão voltou de derrotar Quedorlaomer, “O rei de Sodoma saiu ao seu encontro … no vale de Savé (que é o Vale do Rei)”, e ali Melquisedeque, rei de Salém, trouxe pão e vinho e o abençoou. Séculos depois, Absalão, sem filho, “havia tomado e erguido para si a coluna que está no vale do rei … Ela é chamada de Monumento de Absalão, até o dia de hoje”. Josefo diz que a coluna era de mármore e ficava a dois estádios de Jerusalém; o Gênesis Apócrifo de Qumran chama o vale de Savé de vale de Bete-Haquerém."
    - "Assim, o vale ficava presumivelmente perto de Jerusalém, se Salém é Jerusalém, mas nada o fixa. Os candidatos no mapa são o encontro dos vales do Cedrom e do Hinom ao sul da Cidade de Davi, que é marcado em primeiro lugar, o próprio Cedrom, o vale do Hinom, o uádi al-Joz ao norte da Cidade Velha e a área de Ramat Rachel, que alguns tomam por Bete-Haquerém. O monumento no Cedrom hoje chamado Túmulo de Absalão (Yad Avshalom) é um túmulo do final do período do Segundo Templo, mil anos depois de Absalão, e seu nome é tradição posterior, e não prova a favor do sítio."
  de:
    - "Das Königstal, auch Königsgrund, kommt zweimal vor. Als Abram vom Sieg über Kedorlaomer zurückkehrte, „ging ihm entgegen der König von Sodom in das Feld, das Königstal heißt“, im Tal Schawe, und dort brachte Melchisedek, der König von Salem, Brot und Wein hervor und segnete ihn. Jahrhunderte später hatte sich Absalom, der keinen Sohn hatte, „eine Säule aufgerichtet, da er noch lebte; die steht im Königsgrunde“, und „sie heißt auch bis auf diesen Tag Absaloms Mal“. Josephus sagt, die Säule sei aus Marmor gewesen und habe zwei Stadien von Jerusalem entfernt gestanden; das Genesis-Apokryphon aus Qumran nennt das Tal Schawe das Tal von Bet-Kerem."
    - "Das Tal lag also vermutlich nahe Jerusalem, wenn Salem Jerusalem ist, doch nichts legt es fest. Die Kandidaten auf der Karte sind der Zusammenfluss von Kidron- und Hinnomtal südlich der Stadt Davids, der zuerst eingetragen ist, das Kidrontal selbst, das Hinnomtal, das Wadi al-Joz nördlich der Altstadt und das Gebiet von Ramat Rahel, das manche für Bet-Kerem halten. Das heute Grab Absaloms (Yad Avshalom) genannte Monument im Kidron ist ein Grab aus der späten Zeit des Zweiten Tempels, tausend Jahre nach Absalom, und sein Name ist eine spätere Überlieferung, kein Beleg für den Ort."
  fr:
    - "La vallée du Roi, ou vallée royale, apparaît deux fois. Lorsqu’Abram revint après avoir vaincu Kedorlaomer, « le roi de Sodome sortit à sa rencontre dans la vallée de Schavé, qui est la vallée du roi », et là Melchisédek, roi de Salem, fit apporter du pain et du vin et le bénit. Des siècles plus tard, Absalom, n’ayant pas de fils, « s’était fait ériger un monument dans la vallée du roi … qu’on appelle encore aujourd’hui monument d’Absalom ». Flavius Josèphe dit que le monument était de marbre et se dressait à deux stades de Jérusalem ; l’Apocryphe de la Genèse de Qumrân appelle la vallée de Schavé la vallée de Beth-Hakkerem."
    - "La vallée se trouvait donc vraisemblablement près de Jérusalem, si Salem est Jérusalem, mais rien ne la fixe. Les candidats sur la carte sont le confluent des vallées du Cédron et de Hinnom au sud de la Cité de David, marqué en premier, le Cédron lui-même, la vallée de Hinnom, l’oued al-Joz au nord de la Vieille Ville, et la région de Ramat Rahel, que certains prennent pour Beth-Hakkerem. Le monument du Cédron appelé aujourd’hui tombeau d’Absalom (Yad Avshalom) est une tombe de la fin de l’époque du Second Temple, mille ans après Absalom, et son nom relève d’une tradition tardive, non d’une preuve pour le site."
scripture:
  - Gen.14.17-Gen.14.20
  - 2Sam.18.18
sources:
  - "Josephus, Antiquities 7.243"
  - "Genesis Apocryphon (1QapGen) 22.13-14"
  - "N. Avigad, Ancient Monuments in the Kidron Valley (1954)"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
