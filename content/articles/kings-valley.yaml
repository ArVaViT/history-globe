# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the candidates on the map are given without choosing one.
id: kings-valley
place: ac9f98d
title:
  en: "King’s Valley"
  ru: "Долина царская"
  uk: "Долина Царська"
  es: "Valle del Rey"
  pt: "Vale do Rei"
  de: "Königstal"
  fr: "Vallée du Roi"
  it: "Valle del Re"
  pl: "Dolina Królewska"
  nl: "Koningsdal"
  cs: "Královské údolí"
  sv: "Kungadalen"
  nb: "Kongedalen"
  tl: "Libis ng Hari"
  da: "Kongedalen"
  sr: "Долина царска"
  hu: "Király-völgy"
