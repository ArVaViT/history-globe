# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the candidates on the map are given without choosing one.
id: kings-valley
place: ac9f98d
title:
  en: "King’s Valley"
  ru: "Долина царская"
body:
  en:
    - "The King’s Valley, or King’s Dale, appears twice. When Abram came back from defeating Chedorlaomer, “the king of Sodom went out to meet him … at the valley of Shaveh, which is the king’s dale”, and there Melchizedek, king of Salem, brought out bread and wine and blessed him. Centuries later Absalom, having no son, “had taken and reared up for himself a pillar, which is in the king’s dale … and it is called unto this day, Absalom’s place”. Josephus says the pillar was of marble and stood two stadia from Jerusalem; the Genesis Apocryphon from Qumran calls the valley of Shaveh the valley of Beth-haccherem."
    - "So the valley was presumably near Jerusalem, if Salem is Jerusalem, but nothing fixes it. The candidates on the map are the meeting of the Kidron and Hinnom valleys south of the City of David, which is marked first, the Kidron itself, the Hinnom valley, Wadi al-Joz north of the Old City, and the area of Ramat Rahel, which some take for Beth-haccherem. The monument in the Kidron now called Absalom’s Tomb (Yad Avshalom) is a tomb of the late Second Temple period, a thousand years after Absalom, and its name is a later tradition, not evidence for the site."
  ru:
    - "Долина царская упоминается дважды. Когда Аврам возвращался после поражения Кедорлаомера, «царь Содомский вышел ему навстречу в долину Шаве, что ныне долина царская», и там Мелхиседек, царь Салимский, вынес ему хлеб и вино и благословил его. Спустя века Авессалом, не имея сына, «еще при жизни своей взял и поставил себе памятник в царской долине», назвал его своим именем, и книга говорит, что имя «памятник Авессалома» держалось «до сего дня». Иосиф Флавий говорит, что памятник был мраморный и стоял в двух стадиях от Иерусалима; кумранский Апокриф Бытия называет долину Шаве долиной Бефкарема."
    - "Значит, долина, по-видимому, была близ Иерусалима, если Салим — это Иерусалим, но ничто не указывает места точно. Кандидаты на карте — слияние Кедронской долины и долины Еннома к югу от Города Давида, которое стоит первым, сам Кедрон, долина Еннома, Вади-эль-Джоз к северу от Старого города и окрестности Рамат-Рахеля, который некоторые считают Бефкаремом. Памятник в Кедроне, ныне называемый гробницей Авессалома (Яд-Авшалом), — гробница позднего периода Второго храма, на тысячу лет моложе Авессалома, и его имя — позднее предание, а не довод в пользу места."
scripture:
  - Gen.14.17-Gen.14.20
  - 2Sam.18.18
sources:
