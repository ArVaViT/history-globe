body:
  en:
    - "The King’s Valley, or King’s Dale, appears twice. When Abram came back from defeating Chedorlaomer, “the king of Sodom went out to meet him … at the valley of Shaveh, which is the king’s dale”, and there Melchizedek, king of Salem, brought out bread and wine and blessed him. Centuries later Absalom, having no son, “had taken and reared up for himself a pillar, which is in the king’s dale … and it is called unto this day, Absalom’s place”. Josephus says the pillar was of marble and stood two stadia from Jerusalem; the Genesis Apocryphon from Qumran calls the valley of Shaveh the valley of Beth-haccherem."
    - "So the valley was presumably near Jerusalem, if Salem is Jerusalem, but nothing fixes it. The candidates on the map are the meeting of the Kidron and Hinnom valleys south of the City of David, which is marked first, the Kidron itself, the Hinnom valley, Wadi al-Joz north of the Old City, and the area of Ramat Rahel, which some take for Beth-haccherem. The monument in the Kidron now called Absalom’s Tomb (Yad Avshalom) is a tomb of the late Second Temple period, a thousand years after Absalom, and its name is a later tradition, not evidence for the site."
  ru:
    - "Долина царская упоминается дважды. Когда Аврам возвращался после поражения Кедорлаомера, «царь Содомский вышел ему навстречу в долину Шаве, что ныне долина царская», и там Мелхиседек, царь Салимский, вынес ему хлеб и вино и благословил его. Спустя века Авессалом, не имея сына, «еще при жизни своей взял и поставил себе памятник в царской долине», назвал его своим именем, и книга говорит, что имя «памятник Авессалома» держалось «до сего дня». Иосиф Флавий говорит, что памятник был мраморный и стоял в двух стадиях от Иерусалима; кумранский Апокриф Бытия называет долину Шаве долиной Бефкарема."
    - "Значит, долина, по-видимому, была близ Иерусалима, если Салим — это Иерусалим, но ничто не указывает места точно. Кандидаты на карте — слияние Кедронской долины и долины Еннома к югу от Города Давида, которое стоит первым, сам Кедрон, долина Еннома, Вади-эль-Джоз к северу от Старого города и окрестности Рамат-Рахеля, который некоторые считают Бефкаремом. Памятник в Кедроне, ныне называемый гробницей Авессалома (Яд-Авшалом), — гробница позднего периода Второго храма, на тысячу лет моложе Авессалома, и его имя — позднее предание, а не довод в пользу места."
  uk:
    - "Долина Царська, або Царський дол, з’являється двічі. Коли Аврам повертався після перемоги над Кедорлаомером, «Вийшов же царь Содомський на зустріч йому … на Саве-долину, се долина Царська», і там Мелхиседек, цар Салімський, виніс хліб і вино й благословив його. Через століття Авесалом, не маючи сина, «взяв та й поставив собі памятник в царській долинї … І зветься він по сей день „Рука Абессаломова‟». Йосиф Флавій каже, що стовп був мармуровий і стояв за два стадії від Єрусалима; Апокриф Книги Буття з Кумрана називає долину Шаве долиною Бет-Гакерема."
    - "Отже, долина, мабуть, була поблизу Єрусалима, якщо Салім — це Єрусалим, але нічого не вказує на неї напевно. Кандидати на мапі — місце зустрічі долин Кедрон і Гінном на південь від Міста Давида, позначене першим, сам Кедрон, долина Гінном, ваді аль-Джоз на північ від Старого міста та район Рамат-Рахелі, який дехто вважає за Бет-Гакерем. Пам’ятка в Кедроні, яку тепер називають Гробницею Авесалома (Яд-Авшалом), — це гробниця пізньої доби Другого храму, на тисячу років пізніша за Авесалома, і її назва — пізніша традиція, а не доказ щодо місця."
  es:
    - "El Valle del Rey aparece dos veces. Cuando Abram volvía de derrotar a Quedorlaomer, «salió el rey de Sodoma á recibirlo [...] al valle de Shave, que es el valle del Rey», y allí Melquisedec, rey de Salem, sacó pan y vino y lo bendijo. Siglos después, Absalón, que no tenía hijo, «había [...] tomado y levantádose una columna, la cual está en el valle del rey [...] y así se llamó el Lugar de Absalom, hasta hoy». Josefo dice que la columna era de mármol y estaba a dos estadios de Jerusalén; el Apócrifo del Génesis, de Qumrán, llama al valle de Shave el valle de Bet-haquerem."
    - "Así pues, el valle estaba presumiblemente cerca de Jerusalén, si Salem es Jerusalén, pero nada lo fija. Los candidatos en el mapa son la confluencia de los valles del Cedrón y de Hinnom, al sur de la Ciudad de David, que aparece marcada en primer lugar, el propio Cedrón, el valle de Hinnom, el Wadi al-Joz, al norte de la Ciudad Vieja, y la zona de Ramat Rajel, que algunos toman por Bet-haquerem. El monumento del Cedrón que hoy se llama Tumba de Absalón (Yad Avshalom) es una tumba de finales del período del Segundo Templo, mil años posterior a Absalón, y su nombre es una tradición tardía, no una prueba del lugar."
  pt:
    - "O Vale do Rei aparece duas vezes. Quando Abrão voltou de derrotar Quedorlaomer, “O rei de Sodoma saiu ao seu encontro … no vale de Savé (que é o Vale do Rei)”, e ali Melquisedeque, rei de Salém, trouxe pão e vinho e o abençoou. Séculos depois, Absalão, sem filho, “havia tomado e erguido para si a coluna que está no vale do rei … Ela é chamada de Monumento de Absalão, até o dia de hoje”. Josefo diz que a coluna era de mármore e ficava a dois estádios de Jerusalém; o Gênesis Apócrifo de Qumran chama o vale de Savé de vale de Bete-Haquerém."
    - "Assim, o vale ficava presumivelmente perto de Jerusalém, se Salém é Jerusalém, mas nada o fixa. Os candidatos no mapa são o encontro dos vales do Cedrom e do Hinom ao sul da Cidade de Davi, que é marcado em primeiro lugar, o próprio Cedrom, o vale do Hinom, o uádi al-Joz ao norte da Cidade Velha e a área de Ramat Rachel, que alguns tomam por Bete-Haquerém. O monumento no Cedrom hoje chamado Túmulo de Absalão (Yad Avshalom) é um túmulo do final do período do Segundo Templo, mil anos depois de Absalão, e seu nome é tradição posterior, e não prova a favor do sítio."
  de:
    - "Das Königstal, auch Königsgrund, kommt zweimal vor. Als Abram vom Sieg über Kedorlaomer zurückkehrte, „ging ihm entgegen der König von Sodom in das Feld, das Königstal heißt“, im Tal Schawe, und dort brachte Melchisedek, der König von Salem, Brot und Wein hervor und segnete ihn. Jahrhunderte später hatte sich Absalom, der keinen Sohn hatte, „eine Säule aufgerichtet, da er noch lebte; die steht im Königsgrunde“, und „sie heißt auch bis auf diesen Tag Absaloms Mal“. Josephus sagt, die Säule sei aus Marmor gewesen und habe zwei Stadien von Jerusalem entfernt gestanden; das Genesis-Apokryphon aus Qumran nennt das Tal Schawe das Tal von Bet-Kerem."
    - "Das Tal lag also vermutlich nahe Jerusalem, wenn Salem Jerusalem ist, doch nichts legt es fest. Die Kandidaten auf der Karte sind der Zusammenfluss von Kidron- und Hinnomtal südlich der Stadt Davids, der zuerst eingetragen ist, das Kidrontal selbst, das Hinnomtal, das Wadi al-Joz nördlich der Altstadt und das Gebiet von Ramat Rahel, das manche für Bet-Kerem halten. Das heute Grab Absaloms (Yad Avshalom) genannte Monument im Kidron ist ein Grab aus der späten Zeit des Zweiten Tempels, tausend Jahre nach Absalom, und sein Name ist eine spätere Überlieferung, kein Beleg für den Ort."
  fr:
    - "La vallée du Roi, ou vallée royale, apparaît deux fois. Lorsqu’Abram revint après avoir vaincu Kedorlaomer, « le roi de Sodome sortit à sa rencontre dans la vallée de Schavé, qui est la vallée du roi », et là Melchisédek, roi de Salem, fit apporter du pain et du vin et le bénit. Des siècles plus tard, Absalom, n’ayant pas de fils, « s’était fait ériger un monument dans la vallée du roi … qu’on appelle encore aujourd’hui monument d’Absalom ». Flavius Josèphe dit que le monument était de marbre et se dressait à deux stades de Jérusalem ; l’Apocryphe de la Genèse de Qumrân appelle la vallée de Schavé la vallée de Beth-Hakkerem."
    - "La vallée se trouvait donc vraisemblablement près de Jérusalem, si Salem est Jérusalem, mais rien ne la fixe. Les candidats sur la carte sont le confluent des vallées du Cédron et de Hinnom au sud de la Cité de David, marqué en premier, le Cédron lui-même, la vallée de Hinnom, l’oued al-Joz au nord de la Vieille Ville, et la région de Ramat Rahel, que certains prennent pour Beth-Hakkerem. Le monument du Cédron appelé aujourd’hui tombeau d’Absalom (Yad Avshalom) est une tombe de la fin de l’époque du Second Temple, mille ans après Absalom, et son nom relève d’une tradition tardive, non d’une preuve pour le site."
  it:
    - "La Valle del Re compare due volte. Quando Abramo tornò dalla sconfitta di Chedorlaomer, «il re di Sodoma gli andò incontro nella valle di Shaveh, che è la Valle del re», e là Melchisedek, re di Salem, portò pane e vino e lo benedisse. Secoli dopo Assalonne, non avendo figli, «si era eretto il monumento ch’è nella Valle del re … che anche oggi si chiama “monumento di Absalom”». Giuseppe Flavio dice che il monumento era di marmo e sorgeva a due stadi da Gerusalemme; l’Apocrifo della Genesi di Qumran chiama la valle di Shaveh la valle di Bet-Cherem."
    - "La valle era dunque presumibilmente vicina a Gerusalemme, se Salem è Gerusalemme, ma nulla la fissa. I candidati sulla mappa sono la confluenza delle valli del Cedron e di Innom a sud della Città di Davide, indicata per prima, lo stesso Cedron, la valle di Innom, il Wadi al-Joz a nord della Città Vecchia e la zona di Ramat Rachel, che alcuni ritengono Bet-Cherem. Il monumento nel Cedron oggi chiamato Tomba di Assalonne (Yad Avshalom) è una tomba della tarda età del Secondo Tempio, mille anni dopo Assalonne, e il suo nome è una tradizione posteriore, non una prova per il sito."
  pl:
    - "Dolina Królewska pojawia się dwukrotnie. Gdy Abram wracał po pokonaniu Kedorlaomera, „wyszedł król Sodomski przeciw niemu … na dolinie Sawe, która jest doliną królewską”, i tam Melchizedek, król Salemu, wyniósł chleb i wino i błogosławił go. Wieki później Absalom, nie mając syna, „wziął był, i wystawił sobie za żywota swego słup, który jest w dolinie królewskiej … który zowią miejsce Absalomowe aż do dzisiejszego dnia”. Józef Flawiusz mówi, że słup był z marmuru i stał dwa stadia od Jerozolimy; Apokryf Księgi Rodzaju z Qumran nazywa dolinę Szawe doliną Bet-Kerem."
    - "Dolina leżała więc zapewne w pobliżu Jerozolimy, jeśli Salem to Jerozolima, ale nic tego nie przesądza. Kandydaci na mapie to spotkanie dolin Cedronu i Hinnom na południe od Miasta Dawida, zaznaczone jako pierwsze, sam Cedron, dolina Hinnom, Wadi al-Joz na północ od Starego Miasta oraz okolica Ramat Rachel, które niektórzy uważają za Bet-Kerem. Pomnik w Cedronie, zwany dziś Grobowcem Absaloma (Jad Awszalom), to grobowiec z późnego okresu Drugiej Świątyni, o tysiąc lat późniejszy od Absaloma, a jego nazwa jest późniejszą tradycją, a nie dowodem dla tego miejsca."
  nl:
    - "Het Koningsdal, ook “het dal des konings”, komt twee keer voor. Toen Abram terugkwam van zijn overwinning op Kedorlaomer, kwam de koning van Sodom hem tegemoet “tot het dal Schave, dat is, het dal des konings”, en daar bracht Melchizedek, koning van Salem, brood en wijn voort en zegende hem. Eeuwen later had Absalom, die geen zoon had, “genomen, en in zijn leven voor zich opgericht een pilaar, die in het koningsdal is … daarom wordt hij tot op dezen dag genoemd: Absaloms hand”. Josephus zegt dat de pilaar van marmer was en twee stadiën van Jeruzalem stond; het Genesis Apocryphon uit Qumran noemt het dal van Schave het dal van Beth-Kerem."
    - "Het dal lag dus vermoedelijk bij Jeruzalem, als Salem Jeruzalem is, maar niets legt het vast. De kandidaten op de kaart zijn de samenkomst van het Kidron- en het Hinnomdal ten zuiden van de Stad van David, die als eerste is aangegeven, de Kidron zelf, het Dal van Hinnom, de Wadi al-Joz ten noorden van de Oude Stad, en het gebied van Ramat Rachel, dat sommigen voor Beth-Kerem houden. Het monument in de Kidron dat nu het Graf van Absalom heet (Yad Avshalom) is een graf uit de late tijd van de Tweede Tempel, duizend jaar na Absalom, en zijn naam is een latere overlevering en geen bewijs voor de plaats."
  cs:
    - "Královské údolí neboli Údolí králů se objevuje dvakrát. Když se Abram vracel z porážky Kedorlaomera, „vyšel král Sodomský proti němu … k údolí Sáveh, kteréž jest údolí královské“, a tam Melchisedek, král Šalému, vynesl chléb a víno a požehnal mu. O staletí později Abšalom, který neměl syna, „vzal byl a vyzdvihl sobě za života svého sloup v údolí královském … kterýž slove místo Absolonovo až do dnešního dne“. Josephus praví, že sloup byl z mramoru a stál dvě stadia od Jeruzaléma; Genesis Apokryfon z Kumránu nazývá údolí Šáve údolím Bét-hakerem."
    - "Údolí tedy bylo zřejmě blízko Jeruzaléma, je-li Šalém Jeruzalém, ale nic je nepotvrzuje. Kandidáti na mapě jsou soutok údolí Kidron a Hinómova údolí jižně od Města Davidova, který je označen jako první, samotný Kidron, Hinómovo údolí, Wádí al-Joz severně od Starého Města a oblast Ramat Rachel, kterou někteří pokládají za Bét-hakerem. Památka v Kidronu zvaná dnes Abšalomův hrob (Yad Avshalom) je hrob z pozdní doby Druhého chrámu, tisíc let po Abšalomovi, a její jméno je pozdější tradice, ne důkaz místa."
  sv:
    - "Kungadalen, eller Konungsdalen, förekommer två gånger. När Abram vände åter efter att ha besegrat Kedorlaomer, ”gick konungen i Sodom honom till mötes i Savedalen, det är Konungsdalen”, och där bar Melkisedek, konung av Salem, fram bröd och vin och välsignade honom. Århundraden senare hade Absalom, som saknade son, ”låtit resa åt sig en stod som står i Konungsdalen … och den heter ännu i dag Absaloms minnesvård”. Josefus säger att pelaren var av marmor och stod två stadier från Jerusalem; Genesis Apokryfon från Qumran kallar Shavedalen för Bet-Hackerems dal."
    - "Dalen låg alltså förmodligen nära Jerusalem, om Salem är Jerusalem, men ingenting fastställer det. Kandidaterna på kartan är mötet mellan Kidron- och Hinnomdalarna söder om Davids stad, som är markerat först, själva Kidron, Hinnoms dal, Wadi al-Joz norr om Gamla staden och området kring Ramat Rahel, som vissa håller för Bet-Hackerem. Monumentet i Kidron som nu kallas Absaloms grav (Yad Avshalom) är en grav från sen andratempelperiod, tusen år efter Absalom, och dess namn är en senare tradition, inte något belägg för platsen."
  nb:
    - "Kongedalen forekommer to ganger. Da Abram vendte tilbake etter å ha slått Kedorlaomer, gikk «kongen i Sodoma ham i møte til Sjave-dalen, det er Kongedalen», og der kom Melkisedek, kongen i Salem, ut med brød og vin og velsignet ham. Århundrer senere hadde Absalom, som ikke hadde noen sønn, «tatt og reist sig den støtte som står i Kongedalen … og den er blitt kalt Absaloms minnesmerke inntil denne dag». Josefus sier at støtten var av marmor og sto to stadier fra Jerusalem; Genesis Apocryphon fra Qumran kaller Sjave-dalen Bet-Hakkerem-dalen."
    - "Dalen lå altså antakelig nær Jerusalem, hvis Salem er Jerusalem, men ingenting fastslår det. Kandidatene på kartet er sammenløpet av Kedron- og Hinnom-dalen sør for Davidsbyen, som er markert først, Kedron selv, Hinnom-dalen, Wadi al-Joz nord for Gamlebyen, og området ved Ramat Rahel, som noen regner for Bet-Hakkerem. Monumentet i Kedron som nå kalles Absaloms grav (Yad Avshalom), er en grav fra sen tid i andre tempelperiode, tusen år etter Absalom, og navnet er en senere tradisjon og ikke belegg for stedet."
  tl:
    - "Ang Libis ng Hari ay lumilitaw nang dalawang beses. Nang bumalik si Abram mula sa pagtalo kay Chedorlaomer, “nilabas na sinalubong siya ng hari sa Sodoma … sa libis ng Shave (na siyang libis ng hari)”, at doon dinala ni Melquisedec, hari ng Salem, ang tinapay at alak at pinagpala siya. Makalipas ang mga siglo, si Absalom, na walang anak na lalaki, ay “nagpasiya at nagtayo sa ganang kaniya ng haligi, na pinaka alaala, na nasa libis ng hari … at tinawag na monumento ni Absalom, hanggang sa araw na ito”. Sinasabi ni Josefo na marmol ang haligi at nakatayo dalawang stadia mula sa Jerusalem; tinatawag ng Genesis Apocryphon mula sa Qumran ang libis ng Shave na libis ng Beth-haccerem."
    - "Kaya ang libis ay marahil malapit sa Jerusalem, kung ang Salem ay Jerusalem, ngunit walang nagtatakda rito. Ang mga kandidato sa mapa ay ang pagtatagpo ng mga libis ng Cedron at Hinnom sa timog ng Bayan ni David, na unang minarkahan, ang Cedron mismo, ang libis ng Hinnom, ang Wadi al-Joz sa hilaga ng Lumang Lungsod, at ang lugar ng Ramat Rahel, na itinuturing ng ilan na Beth-haccerem. Ang monumento sa Cedron na tinatawag ngayong Libingan ni Absalom (Yad Avshalom) ay libingan ng huling panahon ng Ikalawang Templo, isang libong taon pagkatapos ni Absalom, at ang pangalan nito ay tradisyon ng kalaunan at hindi patunay ng pook."
  da:
    - "Kongedalen eller Kongens Dal optræder to gange. Da Abram kom tilbage fra sejren over Kedorlaomer, fortælles der: »Kongen af Sodoma gik ud imod ham … til Schave-Dal, som kaldes Kongens Dal«, og dér bragte Melkisedek, Salems konge, brød og vin frem og velsignede ham. Århundreder senere havde Absalon, der ingen søn havde, »i levende Live taget og oprejst sig en Støtte, som staar i Kongens Dal … og den kaldes Absaloms Mindesmærke indtil denne Dag«. Josefus siger, at støtten var af marmor og stod to stadier fra Jerusalem; Genesis-apokryfen fra Qumran kalder Sjave-dalen Bet-Kerem-dalen."
    - "Dalen lå altså formentlig nær Jerusalem, hvis Salem er Jerusalem, men intet fastlægger den. Kandidaterne på kortet er mødet mellem Kedron- og Hinnomdalen syd for Davidsbyen, som er markeret først, Kedron selv, Hinnoms Dal, Wadi al-Joz nord for Den Gamle By og området ved Ramat Rahel, som nogle tager for Bet-Kerem. Monumentet i Kedron, der nu kaldes Absalons grav (Yad Avshalom), er en grav fra den sene tid for det andet tempel, tusind år efter Absalon, og dets navn er en senere tradition, ikke bevis for stedet."
  sr:
    - "Долина царска, или Долина царева, јавља се двапут. Када се Аврам вратио после победе над Ходологомором, „цар содомски изиђе му на сусрет … у долину Савину, које је сада долина царева“, и тамо је Мелхиседек, цар салимски, изнео хлеб и вино и благословио га. Столећима касније Авесалом, не имајући сина, „беше подигао себи споменик за живота у долини царској“, који се „зове место Авесаломово до данашњег дана“. Јосиф Флавије каже да је стуб био од мермера и да је стајао два стадија од Јерусалима; Апокриф Постања из Кумрана назива долину Савину долином Вет-Харема."
    - "Дакле, долина је вероватно била близу Јерусалима, ако је Салим Јерусалим, али ништа је не утврђује. Кандидати на мапи су састајалиште долина Кедрона и Еномове јужно од Давидовог града, које је означено прво, сам Кедрон, Долина Еномова, Вади ел-Џоз северно од Старог града и подручје Рамат Рахела, који неки узимају за Вет-Харем. Споменик у Кедрону који се сада зове Авесаломова гробница (Јад Авшалом) гробница је из позног раздобља Другог храма, хиљаду година после Авесалома, а његово име је каснија традиција, а не доказ за налазиште."
  hu:
    - "A Király-völgy kétszer fordul elő. Amikor Ábrám megtért Kedorlaomer legyőzéséből, „kiméne ő elébe Sodomának királya a Sáve völgyébe, azaz a király völgyébe”, és ott Melkizedek, Sálem királya kenyeret és bort hozott neki, és megáldotta. Évszázadokkal később Absolon, mivel nem volt fia, „vett és még életében emelt magának emlékoszlopot, a mely a király völgyében van … és az Absolon oszlopának hívattatik mind e mai napig”. Josephus szerint az oszlop márványból volt, és két stadionra állt Jeruzsálemtől; a qumráni Genezis-apokrifon a Sáve völgyét a Bét-Hakkerem völgyének nevezi."
    - "A völgy tehát feltehetően Jeruzsálem közelében volt, ha Sálem Jeruzsálem, de semmi sem rögzíti. A térkép jelöltjei: a Kidron és a Hinnom völgyének találkozása Dávid városától délre, amelyet elsőként jelöl, maga a Kidron, a Hinnom-völgy, az Óvárostól északra a Wadi al-Joz, és Ramat Rahel környéke, amelyet egyesek Bét-Hakkeremnek tartanak. A Kidronban álló emlékmű, amelyet ma Absolon sírjának hívnak (Yad Avshalom), a második templom kora végének síremléke, ezer évvel Absolon után, a neve pedig későbbi hagyomány, nem bizonyíték a helyre."
  fi:
    - "Kuninkaanlaakso eli Kuninkaan laakso mainitaan kahdesti. Kun Abram palasi voitettuaan Kedorlaomerin, ”meni Sodoman kuningas häntä vastaan Saaven laaksoon, jota sanotaan ’Kuninkaan laaksoksi’”, ja siellä Melkisedek, Saalemin kuningas, toi leipää ja viiniä ja siunasi hänet. Vuosisatoja myöhemmin Absalom, jolla ei ollut poikaa, ”oli eläessään hankkinut ja pystyttänyt itsellensä patsaan, joka on Kuninkaanlaaksossa”. Josephus sanoo patsaan olleen marmoria ja seisoneen kahden stadionin päässä Jerusalemista; Qumranin Genesis-apokryfi kutsuu Saaven laaksoa Bet-Hakkeremin laaksoksi."
    - "Laakso oli siis luultavasti lähellä Jerusalemia, jos Saalem on Jerusalem, mutta mikään ei sitä varmista. Kartan ehdokkaat ovat Kidronin ja Hinnomin laaksojen yhtymäkohta Daavidin kaupungin eteläpuolella, joka on merkitty ensimmäisenä, Kidron itse, Hinnomin laakso, Wadi al-Joz Vanhankaupungin pohjoispuolella sekä Ramat Rahelin alue, jonka jotkut katsovat Bet-Hakkeremiksi. Kidronin laaksossa oleva monumentti, jota nykyään kutsutaan Absalomin haudaksi (Yad Avshalom), on toisen temppelin ajan loppupuolen hauta, tuhat vuotta Absalomin jälkeen, ja sen nimi on myöhäinen perimätieto, ei todiste paikasta."
  vi:
    - "Trũng Vua xuất hiện hai lần. Khi Áp-ram đánh bại Kết-rô-Lao-me trở về, “vua Sô-đôm ra đón rước người tại trũng Sa-ve, tức là trũng Vua”, và tại đó Mên-chi-xê-đéc, vua Sa-lem, đem bánh và rượu ra và chúc phước cho ông. Nhiều thế kỷ sau, Áp-sa-lôm, không có con trai, “có sai dựng một cái bia ở trong trũng vua”, và “người ta hãy còn gọi là bia Áp-sa-lôm” cho đến ngày nay. Josephus nói cái bia bằng đá cẩm thạch và đứng cách Giê-ru-sa-lem hai stadia; Genesis Apocryphon ở Qumran gọi trũng Sa-ve là trũng Bết-Hác-kê-rem."
    - "Vậy trũng có lẽ ở gần Giê-ru-sa-lem, nếu Sa-lem là Giê-ru-sa-lem, nhưng không có gì xác định. Các ứng viên trên bản đồ là chỗ gặp nhau của hai thung lũng Xết-rôn và Hi-nôm ở phía nam Thành Đa-vít, được đánh dấu trước, rồi chính thung lũng Xết-rôn, thung lũng Hi-nôm, Wadi al-Joz ở phía bắc Thành Cổ, và vùng Ramat Rahel mà một số người cho là Bết-Hác-kê-rem. Công trình trong thung lũng Xết-rôn nay gọi là Mộ Áp-sa-lôm (Yad Avshalom) là một ngôi mộ cuối thời Đền Thờ Thứ Hai, một nghìn năm sau Áp-sa-lôm, và tên của nó là truyền thống về sau, không phải bằng chứng cho địa điểm."
  ro:
    - "Valea Regelui, sau Câmpul Regelui, apare de două ori. Când Avram s-a întors după înfrângerea lui Chedorlaomer, „a ieșit împăratul Sodomei întru întâmpinarea lui … în valea lui Savì: acesta erà câmpul împăraților”, și acolo Melhisedec, regele Salemului, a scos pâine și vin și l-a binecuvântat. Veacuri mai târziu, Absalom, neavând fiu, „ș’a făcut luiș stâlp, pe care l-a pus în valea împăratului … și se chiamă el mâna lui Avesalom până în ziua aceasta”. Iosif Flaviu spune că stâlpul era de marmură și stătea la două stadii de Ierusalim; Apocriful la Facere de la Qumran numește valea Șave valea Bet-Hacherem."
    - "Valea a fost deci probabil aproape de Ierusalim, dacă Salemul este Ierusalimul, dar nimic nu o fixează. Candidații de pe hartă sunt întâlnirea văilor Chedron și Hinom la sud de Cetatea lui David, marcată prima, Chedronul însuși, valea Hinom, Wadi al-Joz la nord de Orașul Vechi și zona Ramat Rahel, pe care unii o socotesc Bet-Hacherem. Monumentul din Chedron numit acum Mormântul lui Absalom (Yad Avshalom) este un mormânt din perioada târzie a celui de-al Doilea Templu, la o mie de ani după Absalom, iar numele lui este o tradiție ulterioară, nu o dovadă pentru loc."
  bg:
    - "Царската долина, или Царският дол, се появява два пъти. Когато Аврам се върна след победата над Кедорлаомер, „излезе Содомският цар да го посрещне… в дола Сави, който е дол царски“, и там Мелхиседек, цар на Салим, изнесе хляб и вино и го благослови. Векове по-късно Авесалом, който нямаше син, „взе та постави за себе си стълп, който е в царевия дол… и нарича се до този ден Авесаломов Стълп“. Йосиф Флавий казва, че стълпът бил от мрамор и стоял на два стадия от Йерусалим; Апокрифът на Битие от Кумран нарича долината Сави долината на Бет-Акерем."
    - "Следователно долината вероятно е била близо до Йерусалим, ако Салим е Йерусалим, но нищо не я установява точно. Кандидатите на картата са сливането на долините Кедрон и Еном южно от Давидовия град, отбелязано на първо място, самият Кедрон, Долината Еном, Уади ал-Джоз на север от Стария град и районът на Рамат Рахел, който някои смятат за Бет-Акерем. Паметникът в Кедрон, наричан днес Гробницата на Авесалом (Яд Авшалом), е гробница от късния период на Втория храм, хиляда години след Авесалом, и името му е по-късна традиция, а не доказателство за мястото."
