# Overview article (ADR 0007). Mainstream facts only; Egyptian dates follow I. Shaw (ed.), The Oxford History of Ancient Egypt.
# The identification with Pi-Ramesses is the usual one and is named as such; the date of the Exodus is disputed and is not given.
id: rameses
place: a079b21
title:
  en: "Rameses"
  ru: "Раамсес"
  uk: "Раамсес"
  es: "Ramesés"
  pt: "Ramessés"
  de: "Ramses"
  fr: "Ramsès"
  it: "Ramses"
  pl: "Ramses"
  cs: "Ramesse"
  nl: "Raämses"
body:
  en:
    - "Pi-Ramesses, the House of Ramesses, lay at Qantir in the north-eastern Nile delta, on the Pelusiac branch of the river, about 30 km south of Tanis. It grew beside the ruins of Avaris at Tell el-Dab'a, the capital of the Hyksos, the foreign kings of northern Egypt, whom Ahmose I drove out in the mid-sixteenth century BC; the soldier Ahmose son of Ebana tells in his tomb at Elkab how he fought at the siege and capture of Avaris."
    - "Seti I seems to have had a palace here, and his son Ramesses II (1279–1213 BC) made Pi-Ramesses his chief residence, close to the roads leading to Egypt's provinces in Asia. When the Pelusiac branch silted up, the kings of the Twenty-first Dynasty moved to Tanis and carried many of its monuments there, so that Tanis was long taken for Pi-Ramesses. Labib Habachi placed the city at Qantir in 1954, and from the 1960s Manfred Bietak, mapping the old branches of the Nile, confirmed it; excavations at Tell el-Dab'a and at Qantir have since uncovered both cities."
    - "Joseph settled his father and his brethren in the land of Rameses, in the best of the land. The oppressed Israelites built for Pharaoh treasure cities, Pithom and Raamses, and on the fifteenth day of the first month, on the morrow after the passover, they journeyed from Rameses to Succoth. Biblical Rameses is usually identified with Pi-Ramesses, while the date of the Exodus remains disputed."
    - "In the 380s, by the usual dating, the pilgrim Egeria passed through a place shown to her as Rameses, four miles from the town of Arabia. She found it a bare field without a single dwelling, though its fallen ruins were endless; only one huge Theban stone stood there, carved with two great statues said to be Moses and Aaron, and an old sycamore said to have been planted by the patriarchs."
  ru:
    - "Пи-Рамсес, «Дом Рамсеса», лежал у Кантира на северо-востоке дельты Нила, на Пелусийском рукаве реки, примерно в 30 км к югу от Таниса. Он вырос рядом с развалинами Авариса у Телль-эд-Дабы — столицы гиксосов, чужеземных царей Северного Египта, которых в середине XVI века до н. э. изгнал Яхмос I; воин Яхмос, сын Абаны, рассказывает в своей гробнице в Эль-Кабе, как сражался при осаде и взятии Авариса."
    - "У Сети I здесь, по-видимому, был дворец, а его сын Рамсес II (1279–1213 гг. до н. э.) сделал Пи-Рамсес своей главной резиденцией, поближе к дорогам в азиатские владения Египта. Когда Пелусийский рукав занесло илом, цари XXI династии перебрались в Танис и перевезли туда многие его памятники, так что Танис долго принимали за Пи-Рамсес. Лабиб Хабаши в 1954 г. поместил город у Кантира, а с 1960-х годов Манфред Битак, нанеся на карту древние русла Нила, подтвердил это; раскопки в Телль-эд-Дабе и в Кантире с тех пор открыли оба города."
    - "Иосиф поселил отца своего и братьев своих в земле Раамсес, в лучшей части земли. Угнетённые израильтяне построили фараону Пифом и Раамсес, города для запасов, а в пятнадцатый день первого месяца, на другой день Пасхи, отправились из Раамсеса в Сокхоф. Библейский Раамсес обычно отождествляют с Пи-Рамсесом, а дата Исхода остаётся спорной."
    - "В 380-х годах, по обычной датировке, паломница Эгерия проходила через место, которое ей показали как Раамсес, в четырёх милях от города Аравия. Она нашла там голое поле без единого жилья, хотя обрушенным развалинам не было конца; стоял лишь один огромный фиванский камень с двумя высеченными большими статуями, которые называли Моисеем и Аароном, да старая сикомора, посаженная, как говорили, патриархами."
  uk:
    - "Пі-Рамсес, Дім Рамсеса, лежав у Кантірі на північному сході дельти Нілу, на Пелусійському рукаві річки, приблизно за 30 км на південь від Таніса. Він виріс поруч із руїнами Аваріса в Телль-ед-Дабі, столиці гіксосів, чужоземних царів Північного Єгипту, яких Яхмос I вигнав у середині XVI ст. до н. е.; воїн Яхмос, син Ебани, розповідає у своїй гробниці в Ель-Кааб, як він брав участь в облозі й здобутті Аваріса."
    - "Сеті I, схоже, мав тут палац, а його син Рамсес II (1279–1213 рр. до н. е.) зробив Пі-Рамсес своєю головною резиденцією, поблизу доріг, що вели до азійських провінцій Єгипту. Коли Пелусійський рукав замулився, царі XXI династії перебралися до Таніса й перевезли туди багато його пам’ятників, тож Таніс довго вважали за Пі-Рамсес. Лабіб Хабахі розмістив місто в Кантірі 1954 року, а з 1960-х років Манфред Бітак, наносячи на карту давні рукави Нілу, підтвердив це; розкопки в Телль-ед-Дабі й у Кантірі відтоді відкрили обидва міста."
    - "Йосиф оселив свого батька й своїх братів у землі Раамсес, на найкращій землі. Пригнічені ізраїльтяни будували для фараона міста-скарбниці, Пітом і Раамсес, а п’ятнадцятого дня першого місяця, наступного дня після пасхи, вони вирушили з Раамсеса до Сокхоту. Біблійний Раамсес зазвичай ототожнюють із Пі-Рамсесом, тоді як дата Виходу лишається спірною."
    - "У 380-х роках, за звичним датуванням, прочанка Егерія проходила через місце, яке їй показали як Раамсес, за чотири милі від міста Арабія. Вона побачила голе поле без жодної оселі, хоча його поваленим руїнам не було кінця; там стояв лише один величезний фіванський камінь, вирізьблений двома великими статуями, що, як казали, зображали Мойсея й Аарона, і стара смоківниця-сикомора, яка, за переказом, була посаджена патріархами."
  es:
    - "Pi-Ramsés, la Casa de Ramsés, estaba en Qantir, en el noreste del delta del Nilo, sobre el brazo pelusíaco del río, a unos 30 km al sur de Tanis. Creció junto a las ruinas de Avaris, en Tell el-Dab'a, la capital de los hicsos, los reyes extranjeros del norte de Egipto, a quienes Ahmosis I expulsó a mediados del siglo XVI a. C.; el soldado Ahmose hijo de Ebana cuenta en su tumba de Elkab cómo combatió en el asedio y la toma de Avaris."
    - "Seti I parece haber tenido allí un palacio, y su hijo Ramsés II (1279–1213 a. C.) hizo de Pi-Ramsés su residencia principal, cerca de los caminos que llevaban a las provincias egipcias de Asia. Cuando el brazo pelusíaco se cegó con el limo, los reyes de la dinastía XXI se trasladaron a Tanis y llevaron allí muchos de sus monumentos, de modo que Tanis fue tomada durante mucho tiempo por Pi-Ramsés. Labib Habachi situó la ciudad en Qantir en 1954, y desde la década de 1960 Manfred Bietak, cartografiando los antiguos brazos del Nilo, lo confirmó; las excavaciones en Tell el-Dab'a y en Qantir han sacado a la luz desde entonces ambas ciudades."
    - "José estableció a su padre y a sus hermanos en la tierra de Ramesés, en lo mejor de la tierra. Los israelitas oprimidos edificaron para el faraón las ciudades de los bastimentos, Pitón y Raamsés, y el día quince del mes primero, al día siguiente de la pascua, partieron de Ramesés a Sucot. La Ramesés bíblica suele identificarse con Pi-Ramsés, mientras que la fecha del Éxodo sigue discutida."
    - "En la década de 380, según la datación habitual, la peregrina Egeria pasó por un lugar que le mostraron como Ramesés, a cuatro millas de la ciudad de Arabia. Lo encontró como un campo desnudo sin una sola vivienda, aunque sus ruinas caídas eran interminables; solo se alzaba allí una enorme piedra tebana, tallada con dos grandes estatuas que se decía eran Moisés y Aarón, y un viejo sicómoro que se decía plantado por los patriarcas."
  pt:
    - "Pi-Ramessés, a Casa de Ramessés, ficava em Qantir, no nordeste do delta do Nilo, no braço pelusíaco do rio, a cerca de 30 km ao sul de Tânis. Cresceu ao lado das ruínas de Avaris, em Tell el-Dab'a, a capital dos hicsos, os reis estrangeiros do norte do Egito, que Amósis I expulsou em meados do século XVI a.C.; o soldado Amósis, filho de Ebana, conta em seu túmulo em El-Kab como lutou no cerco e na captura de Avaris."
    - "Seti I parece ter tido um palácio aqui, e seu filho Ramessés II (1279–1213 a.C.) fez de Pi-Ramessés sua principal residência, perto das estradas que levavam às províncias do Egito na Ásia. Quando o braço pelusíaco assoreou, os reis da XXI dinastia se mudaram para Tânis e levaram para lá muitos de seus monumentos, de modo que Tânis foi por muito tempo tomada por Pi-Ramessés. Labib Habachi situou a cidade em Qantir em 1954, e a partir da década de 1960 Manfred Bietak, mapeando os antigos braços do Nilo, o confirmou; escavações em Tell el-Dab'a e em Qantir trouxeram desde então à luz as duas cidades."
    - "José instalou seu pai e seus irmãos “no melhor da terra, na terra de Ramessés”. Os israelitas oprimidos construíram para o Faraó cidades-armazéns, Pitom e Ramsés, e no décimo quinto dia do primeiro mês, no dia seguinte à Páscoa, viajaram de Ramessés a Sucote. A Ramessés bíblica é geralmente identificada com Pi-Ramessés, enquanto a data do Êxodo continua disputada."
    - "Nos anos 380, pela datação habitual, a peregrina Egéria passou por um lugar que lhe mostraram como Ramessés, a quatro milhas da cidade de Arábia. Achou-o um campo nu sem uma só habitação, embora suas ruínas caídas fossem intermináveis; só uma enorme pedra de Tebas ali se erguia, esculpida com duas grandes estátuas que diziam ser Moisés e Arão, e um velho sicômoro que diziam plantado pelos patriarcas."
  de:
    - "Pi-Ramesse, das Haus des Ramses, lag bei Qantir im nordöstlichen Nildelta, am pelusischen Nilarm, etwa 30 km südlich von Tanis. Es wuchs neben den Ruinen von Awaris bei Tell el-Daba, der Hauptstadt der Hyksos, der fremden Könige Nordägyptens, die Ahmose I. Mitte des 16. Jahrhunderts v. Chr. vertrieb; der Soldat Ahmose, Sohn des Ebana, erzählt in seinem Grab in Elkab, wie er bei der Belagerung und Einnahme von Awaris kämpfte."
    - "Sethos I. scheint hier einen Palast gehabt zu haben, und sein Sohn Ramses II. (1279–1213 v. Chr.) machte Pi-Ramesse zu seiner Hauptresidenz, nahe den Straßen zu Ägyptens Provinzen in Asien. Als der pelusische Arm verlandete, zogen die Könige der 21. Dynastie nach Tanis und brachten viele Denkmäler dorthin, sodass Tanis lange für Pi-Ramesse gehalten wurde. Labib Habachi setzte die Stadt 1954 nach Qantir, und ab den 1960er Jahren bestätigte Manfred Bietak dies durch die Kartierung der alten Nilarme; Grabungen in Tell el-Daba und Qantir haben seither beide Städte freigelegt."
    - "Josef ließ seinen Vater und seine Brüder im Lande Ramses wohnen, am besten Ort des Landes. Die unterdrückten Israeliten bauten dem Pharao Vorratsstädte, Pitom und Ramses, und am fünfzehnten Tag des ersten Monats, am Tag nach dem Passa, zogen sie von Ramses nach Sukkot. Das biblische Ramses wird meist mit Pi-Ramesse gleichgesetzt, während die Datierung des Exodus umstritten bleibt."
    - "In den 380er Jahren, nach der üblichen Datierung, kam die Pilgerin Egeria durch einen Ort, der ihr als Ramses gezeigt wurde, vier Meilen von der Stadt Arabia. Sie fand ein kahles Feld ohne eine einzige Wohnung, obwohl seine zerfallenen Ruinen endlos waren; nur ein riesiger thebanischer Stein stand dort, mit zwei großen Standbildern, die Mose und Aaron sein sollten, und ein alter Maulbeerfeigenbaum, den die Erzväter gepflanzt haben sollten."
  fr:
    - "Pi-Ramsès, la Maison de Ramsès, se trouvait à Qantir, dans le nord-est du delta du Nil, sur la branche pélusiaque du fleuve, à environ 30 km au sud de Tanis. Elle grandit à côté des ruines d’Avaris à Tell el-Dab‘a, la capitale des Hyksôs, les rois étrangers du nord de l’Égypte, que chassa Ahmôsis Ier au milieu du XVIe siècle av. J.-C. ; le soldat Ahmès, fils d’Abana, raconte dans sa tombe d’El-Kab comment il combattit au siège et à la prise d’Avaris."
    - "Sethi Ier semble y avoir eu un palais, et son fils Ramsès II (1279–1213 av. J.-C.) fit de Pi-Ramsès sa principale résidence, près des routes menant aux provinces d’Asie de l’Égypte. Quand la branche pélusiaque s’envasa, les rois de la XXIe dynastie s’installèrent à Tanis et y emportèrent bien de ses monuments, si bien que Tanis fut longtemps prise pour Pi-Ramsès. Labib Habachi situa la ville à Qantir en 1954, et dès les années 1960 Manfred Bietak, en cartographiant les anciennes branches du Nil, le confirma ; les fouilles de Tell el-Dab‘a et de Qantir ont depuis mis au jour les deux villes."
    - "Joseph établit son père et ses frères « dans la meilleure partie du pays, dans la contrée de Ramsès ». Les Israélites opprimés bâtirent pour Pharaon des villes-magasins, Pithom et Ramsès, et le quinzième jour du premier mois, le lendemain de la Pâque, ils partirent de Ramsès pour Succoth. Le Ramsès biblique est d’ordinaire identifié à Pi-Ramsès, tandis que la date de l’Exode reste disputée."
    - "Dans les années 380, selon la datation habituelle, la pèlerine Égérie passa par un lieu qu’on lui montra comme Ramsès, à quatre milles de la ville d’Arabie. Elle le trouva réduit à un champ nu, sans une seule habitation, bien que ses ruines éboulées fussent sans fin ; il n’y restait qu’une énorme pierre thébaine sculptée de deux grandes statues dites de Moïse et d’Aaron, et un vieux sycomore qu’auraient planté les patriarches."
  it:
    - "Pi-Ramses, la Casa di Ramses, sorgeva a Qantir nel delta nord-orientale del Nilo, sul ramo pelusiaco del fiume, circa 30 km a sud di Tanis. Crebbe accanto alle rovine di Avaris a Tell el-Dab’a, la capitale degli Hyksos, i re stranieri dell’Egitto settentrionale, che Ahmose I cacciò a metà del XVI secolo a.C.; il soldato Ahmose figlio di Ebana racconta nella sua tomba a Elkab come combatté all’assedio e alla presa di Avaris."
    - "Sethi I sembra avervi avuto un palazzo, e suo figlio Ramses II (1279–1213 a.C.) fece di Pi-Ramses la sua residenza principale, vicino alle strade che portavano alle province egizie in Asia. Quando il ramo pelusiaco si insabbiò, i re della XXI dinastia si trasferirono a Tanis e vi portarono molti dei suoi monumenti, così che Tanis fu a lungo ritenuta Pi-Ramses. Labib Habachi collocò la città a Qantir nel 1954, e dagli anni 1960 Manfred Bietak, tracciando la mappa degli antichi rami del Nilo, lo confermò; gli scavi a Tell el-Dab’a e a Qantir hanno da allora portato alla luce entrambe le città."
    - "Giuseppe stabilì suo padre e i suoi fratelli nella contrada di Ramses, nella parte migliore del paese. Gli Israeliti oppressi edificarono per il Faraone le città di approvvigionamento, Pitom e Raamses, e il quindicesimo giorno del primo mese, il giorno dopo la Pasqua, partirono da Ramses per Succot. La Ramses biblica è di solito identificata con Pi-Ramses, mentre la data dell’Esodo resta controversa."
    - "Negli anni 380, secondo la datazione abituale, la pellegrina Egeria passò per un luogo che le fu mostrato come Ramses, a quattro miglia dalla città di Arabia. Lo trovò un campo spoglio senza una sola abitazione, benché le sue rovine crollate fossero senza fine; vi era solo un’enorme pietra tebana, scolpita con due grandi statue che si diceva fossero Mosè e Aronne, e un vecchio sicomoro che si diceva piantato dai patriarchi."
  pl:
    - "Pi-Ramses, Dom Ramzesa, leżało w Kantir w północno-wschodniej delcie Nilu, nad peluzyjskim ramieniem rzeki, około 30 km na południe od Tanis. Wyrosło obok ruin Awaris w Tell el-Dab'a, stolicy Hyksosów, obcych królów północnego Egiptu, których Amosis I wypędził w połowie XVI wieku p.n.e.; żołnierz Ahmose, syn Ebany, opowiada w swym grobowcu w El-Kab, jak walczył przy oblężeniu i zdobyciu Awaris."
    - "Seti I zdaje się mieć tu pałac, a jego syn Ramzes II (1279–1213 p.n.e.) uczynił Pi-Ramses główną rezydencją, blisko dróg prowadzących do azjatyckich prowincji Egiptu. Gdy peluzyjskie ramię zamuliło się, królowie XXI dynastii przenieśli się do Tanis i zabrali tam wiele jego pomników, tak że Tanis długo uważano za Pi-Ramses. Labib Habaszi umieścił miasto w Kantir w 1954 roku, a od lat sześćdziesiątych Manfred Bietak, odwzorowując dawne ramiona Nilu, to potwierdził; wykopaliska w Tell el-Dab'a i w Kantir odsłoniły od tego czasu oba miasta."
    - "Józef osiedlił swego ojca i braci w ziemi Ramses, w najlepszej części kraju. Uciskani Izraelici budowali dla faraona miasta składowe, Pitom i Ramses, a piętnastego dnia pierwszego miesiąca, nazajutrz po święcie przejścia, wyruszyli z Ramses do Sukkot. Biblijne Ramses utożsamia się zwykle z Pi-Ramses, podczas gdy data Wyjścia pozostaje sporna."
    - "W latach 380., według zwykłego datowania, pątniczka Egeria przeszła przez miejsce, które jej pokazano jako Ramses, cztery mile od miasta Arabia. Zastała je jako nagie pole bez ani jednego domu, choć jego zwalone ruiny były niezliczone; stał tam tylko jeden ogromny tebański kamień, wyrzeźbiony w dwa wielkie posągi, o których mówiono, że przedstawiają Mojżesza i Aarona, i stary sykomor, który mieli zasadzić patriarchowie."
  cs:
    - "Pi-Ramesse, Dům Ramessův, ležela v Kantíru v severovýchodní nilské deltě, na pelúsijském rameni řeky, asi 30 km jižně od Tanidy. Vyrostla vedle zřícenin Avaridy v Tell el-Dab'a, hlavního města Hyksósů, cizích králů severního Egypta, které Ahmose I. vyhnal v polovině 16. století př. n. l.; voják Ahmose syn Ebany vypráví ve své hrobce v El-Kabu, jak bojoval při obléhání a dobytí Avaridy."
    - "Sethos I. tu zřejmě měl palác a jeho syn Ramesse II. (1279–1213 př. n. l.) učinil z Pi-Ramesse své hlavní sídlo, blízko cest vedoucích do egyptských provincií v Asii. Když se pelúsijské rameno zanášelo, králové 21. dynastie se přesunuli do Tanidy a odvezli tam mnoho jejích památek, takže Tanis byl dlouho pokládán za Pi-Ramesse. Labib Habachi umístil město roku 1954 do Kantíru a od 60. let to Manfred Bietak, mapující stará ramena Nilu, potvrdil; vykopávky v Tell el-Dab'a a v Kantíru od té doby odkryly obě města."
    - "Josef usadil svého otce a své bratry v zemi Ramesse, v nejlepší části země. Utlačovaní Izraelci stavěli faraonovi pokladní města Pitom a Raamses a patnáctého dne prvního měsíce, nazítří po velikonoční slavnosti, se vydali z Ramesse do Sukot. Biblické Ramesse se obvykle ztotožňuje s Pi-Ramesse, zatímco datování Exodu zůstává sporné."
    - "V 80. letech 4. století, podle obvyklého datování, prošla poutnice Egerie místem, které jí ukázali jako Ramesse, čtyři míle od města Arábie. Shledala je holým polem bez jediného příbytku, ač jeho padlé zříceniny byly nekonečné; stál tam jen jeden obrovský thébský kámen, vytesaný dvěma velkými sochami, o nichž se říkalo, že jsou Mojžíš a Áron, a starý sykomor, o němž se říkalo, že jej zasadili patriarchové."
  nl:
    - "Pi-Ramses, het Huis van Ramses, lag bij Qantir in het noordoosten van de Nijldelta, aan de Pelusische arm van de rivier, zo’n 30 km ten zuiden van Tanis. Het groeide naast de ruïnes van Avaris bij Tell el-Dab’a, de hoofdstad van de Hyksos, de vreemde koningen van Noord-Egypte, die Ahmose I in het midden van de 16e eeuw v.Chr. verdreef; de soldaat Ahmose, zoon van Ebana, vertelt in zijn graf te Elkab hoe hij streed bij het beleg en de verovering van Avaris."
    - "Seti I lijkt hier een paleis te hebben gehad, en zijn zoon Ramses II (1279–1213 v.Chr.) maakte Pi-Ramses tot zijn voornaamste residentie, dicht bij de wegen naar Egyptes provincies in Azië. Toen de Pelusische arm verzandde, verplaatsten de koningen van de 21e dynastie zich naar Tanis en voerden veel van de monumenten mee, zodat Tanis lang voor Pi-Ramses werd gehouden. Labib Habachi plaatste de stad in 1954 bij Qantir, en vanaf de jaren 1960 bevestigde Manfred Bietak dit, door de oude Nijlarmen in kaart te brengen; opgravingen te Tell el-Dab’a en Qantir hebben sindsdien beide steden blootgelegd."
    - "Jozef vestigde zijn vader en zijn broeders in het land Raämses, in het beste van het land. De onderdrukte Israëlieten bouwden voor Farao voorraadsteden, Pitom en Raämses, en op de vijftiende dag van de eerste maand, de dag na het pascha, trokken zij van Raämses naar Sukkot. Het bijbelse Raämses wordt meestal gelijkgesteld met Pi-Ramses, terwijl de datering van de Uittocht omstreden blijft."
    - "In de jaren 380, volgens de gangbare datering, kwam de pelgrim Egeria door een plaats die haar als Raämses werd aangewezen, vier mijl van de stad Arabia. Zij vond er een kaal veld zonder één woning, hoewel de gevallen ruïnes eindeloos waren; alleen één enorme Thebaanse steen stond er, bewerkt met twee grote standbeelden die Mozes en Aäron zouden zijn, en een oude sycomoor die door de aartsvaders zou zijn geplant."
