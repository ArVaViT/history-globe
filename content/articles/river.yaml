# Overview article (ADR 0007). Mainstream facts only; "River" is the river of "Rehoboth by the river", not a name; the Euphrates reading and the Edomite wadis are given as the two lines of opinion, neither as fact.
id: river
place: a3bb384
title:
  en: "River"
  ru: "Река"
  uk: "Ріка"
  es: "El río"
  pt: "Rio"
  de: "Strom"
  fr: "Fleuve"
  it: "Il Fiume"
  pl: "Rzeka"
  cs: "Řeka"
  nl: "Rivier"
  sv: "Floden"
  nb: "Elven"
  tl: "Ilog"
body:
  en:
    - "“River” here is not a name of its own: it is the river in the phrase “Rehoboth by the river”, the home of Saul (Shaul), one of the eight kings who, Genesis says, reigned in the land of Edom before Israel had a king. Genesis and Chronicles give the line of the list and say nothing more. In the Old Testament “the river” without a name is usually the Euphrates, and so the city was long sought far from Edom, at Rahaba on the middle Euphrates below the mouth of the Khabur; an Edomite king from so distant a town is hard to explain, unless he came to the throne from outside. Others keep Rehoboth in or near Edom and look for its river among the wadis of the plateau: the Zered (Wadi Hasa), Wadi Ghuwayr near Feinan, Wadi Rihab, or the Brook of Egypt on the western side. The map shows these candidates; none is proved."
    - "Nothing is known of the city beyond the king's name, and nothing of the river beyond the word. The Edomite king list of Genesis 36 is itself undated: its kings do not succeed father to son and most are linked to a different town or land, which suggests an early elective kingship, but no inscription names any of them. Today the Zered is the deep gorge of Wadi Hasa between the Karak and Tafila governorates of Jordan; Rahaba (ar-Rahba) is a ruined mediaeval castle above the Euphrates near Mayadin in Syria."
  ru:
    - "«Река» здесь не собственное имя: это река из слов о Сауле «из Реховофа, что при реке» — Реховоф был родиной Саула, одного из восьми царей, которые, по книге Бытия, царствовали в земле Едома прежде, чем у Израиля появился царь. Бытие и Паралипоменон приводят строку списка и больше ничего не говорят. В Ветхом Завете «река» без имени обычно означает Евфрат, и потому город долго искали далеко от Едома — в Рахабе на среднем Евфрате ниже устья Хавора; едомского царя из столь далёкого города трудно объяснить, разве что он пришёл к престолу извне. Другие оставляют Реховоф в Едоме или рядом с ним и ищут его реку среди вади плоскогорья: Заред (Вади-Хаса), Вади-Гувейр близ Файнана, Вади-Рихаб или Поток Египетский на западной стороне. На карте показаны эти варианты; ни один не доказан."
    - "О городе не известно ничего, кроме имени царя, а о реке — ничего, кроме самого слова. Список едомских царей в 36-й главе Бытия сам не датирован: цари в нём не наследуют отцу, и большинство связаны с другим городом или землёй, что говорит о ранней выборной власти, но ни одна надпись не называет никого из них. Сегодня Заред — глубокое ущелье Вади-Хаса между провинциями Эль-Карак и Эт-Тафила в Иордании; Рахаба (Эр-Рахба) — разрушенный средневековый замок над Евфратом близ Маядина в Сирии."
  uk:
    - "«Ріка» тут — не окрема назва: це ріка у вислові «Реховот над рікою», батьківщина Саула (Шауля), одного з восьми царів, які, за Книгою Буття, царювали в краї Едом, перш ніж Ізраїль мав царя. Книги Буття й Хронік подають лише рядок переліку й більше нічого не кажуть. У Старому Заповіті «ріка» без назви зазвичай означає Євфрат, тож місто довго шукали далеко від Едому, в Рахабі на середньому Євфраті нижче гирла Хабура; едомського царя з такого далекого міста важко пояснити, хіба що він прийшов на престол ззовні. Інші тримають Реховот в Едомі чи поблизу нього й шукають його ріку серед ваді плато: Заред (Ваді-Хаса), Ваді-Ґувайр поблизу Фейнана, Ваді-Ріхаб або Єгипетський потік із західного боку. Карта показує цих кандидатів; жоден не доведений."
    - "Про місто, крім імені царя, нічого не відомо, а про ріку — нічого, крім слова. Едомський перелік царів у Буття 36 сам не датований: його царі не наслідують один одному від батька до сина, і більшість пов’язані з іншим містом чи краєм, що вказує на ранню виборну царську владу, але жоден напис не називає жодного з них. Сьогодні Заред — це глибока ущелина Ваді-Хаса між губернаторствами Карак і Тафіла в Йорданії; Рахаба (ар-Рахба) — зруйнований середньовічний замок над Євфратом поблизу Маядіна в Сирії."
  es:
    - "«El río» no es aquí un nombre propio: es el río de la expresión «Rehoboth del Río», la patria de Saúl (Shaúl), uno de los ocho reyes que, según el Génesis, reinaron en la tierra de Edom antes de que Israel tuviera rey. El Génesis y Crónicas dan la línea de la lista y no dicen nada más. En el Antiguo Testamento «el río» sin nombre es por lo común el Éufrates, y por eso la ciudad se buscó durante mucho tiempo lejos de Edom, en Rahaba, en el Éufrates medio, bajo la desembocadura del Jabur; un rey edomita de una ciudad tan lejana es difícil de explicar, a menos que llegara al trono desde fuera. Otros mantienen Rehobot en Edom o cerca de él y buscan su río entre los uadis de la meseta: el Zered (Wadi Hasa), Wadi Ghuwayr cerca de Feinan, Wadi Rihab, o el Torrente de Egipto en el lado occidental. El mapa muestra estos candidatos; ninguno está probado."
    - "No se sabe nada de la ciudad más allá del nombre del rey, ni nada del río más allá de la palabra. La lista de reyes edomitas de Génesis 36 carece en sí misma de fecha: sus reyes no se suceden de padre a hijo y la mayoría están ligados a una ciudad o tierra distinta, lo que sugiere una realeza electiva antigua, pero ninguna inscripción nombra a ninguno de ellos. Hoy el Zered es la profunda garganta del Wadi Hasa entre las gobernaciones jordanas de Karak y Tafila; Rahaba (ar-Rahba) es un castillo medieval en ruinas sobre el Éufrates, cerca de Mayadin, en Siria."
  pt:
    - "“Rio” aqui não é um nome próprio: é o rio da expressão “Reobote, junto ao rio”, a terra de Saul (Shaul), um dos oito reis que, segundo o Gênesis, reinaram na terra de Edom antes que Israel tivesse rei. O Gênesis e Crônicas dão a linha da lista e nada mais dizem. No Antigo Testamento “o rio” sem nome é geralmente o Eufrates, e por isso a cidade foi por muito tempo procurada longe de Edom, em Rahaba, no médio Eufrates, abaixo da foz do Cabur; um rei edomita de cidade tão distante é difícil de explicar, a não ser que tenha chegado ao trono de fora. Outros mantêm Reobote em Edom ou perto dele e procuram seu rio entre os uádis do planalto: o Zerede (Wadi Hasa), o Wadi Ghuwayr perto de Feinan, o Wadi Rihab, ou o Ribeiro do Egito, no lado oeste. O mapa mostra esses candidatos; nenhum está provado."
    - "Nada se sabe da cidade além do nome do rei, e nada do rio além da palavra. A lista dos reis edomitas do Gênesis 36 é em si mesma sem datas: seus reis não se sucedem de pai para filho e a maioria está ligada a uma cidade ou terra diferente, o que sugere uma realeza eletiva antiga, mas nenhuma inscrição nomeia nenhum deles. Hoje o Zerede é a profunda garganta do Wadi Hasa entre as províncias jordanianas de Karak e Tafila; Rahaba (ar-Rahba) é um castelo medieval em ruínas acima do Eufrates, perto de Mayadin, na Síria."
  de:
    - "„Strom“ ist hier kein eigener Name: Es ist der Strom in der Wendung „Rehobot am Strom“, der Heimat Sauls (Schauls), eines der acht Könige, die nach der Genesis im Land Edom regierten, ehe Israel einen König hatte. Die Genesis und die Chronik geben die Zeile der Liste und sagen sonst nichts. Im Alten Testament ist „der Strom“ ohne Namen meist der Euphrat, und so suchte man die Stadt lange weit von Edom entfernt, bei Rahaba am mittleren Euphrat unterhalb der Mündung des Chabur; ein edomitischer König aus einer so fernen Stadt ist schwer zu erklären, es sei denn, er kam von außen auf den Thron. Andere halten Rehobot in oder bei Edom und suchen seinen Strom unter den Wadis der Hochfläche: dem Sered (Wadi Hasa), dem Wadi Ghuwair bei Fainan, dem Wadi Rihab oder dem Bach Ägyptens auf der Westseite. Die Karte zeigt diese Kandidaten; keiner ist bewiesen."
    - "Von der Stadt ist nichts bekannt außer dem Namen des Königs, vom Strom nichts außer dem Wort. Die edomitische Königsliste von Genesis 36 ist selbst undatiert: Ihre Könige folgen nicht von Vater auf Sohn, und die meisten sind mit einer anderen Stadt oder einem anderen Land verbunden, was auf ein frühes Wahlkönigtum deutet, doch keine Inschrift nennt einen von ihnen. Heute ist der Sered die tiefe Schlucht des Wadi Hasa zwischen den jordanischen Gouvernements Karak und Tafila; Rahaba (ar-Rahba) ist eine mittelalterliche Burgruine über dem Euphrat bei Mayadin in Syrien."
  fr:
    - "« Fleuve » n’est pas ici un nom propre : c’est le fleuve de l’expression « Rehoboth sur le fleuve », patrie de Saül (Shaül), l’un des huit rois qui, dit la Genèse, régnèrent dans le pays d’Édom avant qu’Israël eût un roi. La Genèse et les Chroniques donnent la ligne de la liste et ne disent rien de plus. Dans l’Ancien Testament, « le fleuve » sans nom est d’ordinaire l’Euphrate, et l’on a donc longtemps cherché la ville loin d’Édom, à Rahaba sur le moyen Euphrate, sous l’embouchure du Khabour ; un roi édomite venu d’une ville si lointaine s’explique mal, à moins qu’il n’ait accédé au trône de l’extérieur. D’autres gardent Rehoboth en Édom ou près de lui et cherchent son fleuve parmi les oueds du plateau : le Zéred (Wadi Hasa), le Wadi Ghuwayr près de Feinan, le Wadi Rihab, ou le torrent d’Égypte du côté occidental. La carte montre ces candidats ; aucun n’est prouvé."
    - "On ne sait rien de la ville hors du nom du roi, ni du fleuve hors du mot. La liste des rois édomites de Genèse 36 est elle-même sans date : ses rois ne se succèdent pas de père en fils et la plupart sont liés à une ville ou à une terre différente, ce qui suggère une royauté élective ancienne, mais aucune inscription n’en nomme un seul. Aujourd’hui, le Zéred est la gorge profonde du Wadi Hasa entre les gouvernorats de Karak et de Tafila, en Jordanie ; Rahaba (ar-Rahba) est un château médiéval en ruine au-dessus de l’Euphrate près de Mayadine, en Syrie."
  it:
    - "«Fiume» qui non è un nome a sé: è il fiume dell’espressione «Rehoboth sul Fiume», patria di Saul (Shaul), uno degli otto re che, dice la Genesi, regnarono nel paese di Edom prima che Israele avesse un re. La Genesi e le Cronache danno il posto nell’elenco e non dicono altro. Nell’Antico Testamento «il fiume» senza nome è di solito l’Eufrate, e così la città fu a lungo cercata lontano da Edom, a Rahaba sul medio Eufrate sotto la foce del Khabur; un re edomita proveniente da una città così lontana è difficile da spiegare, a meno che non salisse al trono dall’esterno. Altri tengono Recobot in Edom o vicino e cercano il suo fiume tra gli uadi dell’altopiano: lo Zered (Wadi Hasa), il Wadi Ghuwayr presso Feinan, il Wadi Rihab, o il Torrente d’Egitto sul lato occidentale. La mappa mostra questi candidati; nessuno è provato."
    - "Della città non si sa nulla oltre al nome del re, e del fiume nulla oltre alla parola. L’elenco dei re edomiti di Genesi 36 è esso stesso senza data: i suoi re non si succedono di padre in figlio e i più sono legati a una città o a una terra diversa, il che suggerisce una regalità elettiva antica, ma nessuna iscrizione ne nomina alcuno. Oggi lo Zered è la profonda gola del Wadi Hasa tra i governatorati giordani di Karak e di Tafila; Rahaba (ar-Rahba) è un castello medievale in rovina sopra l’Eufrate presso Mayadin in Siria."
  pl:
    - "„Rzeka” nie jest tu odrębną nazwą: to rzeka z wyrażenia „Rechobot u rzeki”, domu Saula (Szaula), jednego z ośmiu królów, którzy, jak mówi Księga Rodzaju, panowali w ziemi Edomu, zanim Izrael miał króla. Księga Rodzaju i Kroniki podają wiersz listy i nic więcej nie mówią. W Starym Testamencie „rzeka” bez nazwy to zwykle Eufrat i dlatego miasta długo szukano daleko od Edomu, w Rahabie nad środkowym Eufratem poniżej ujścia Chaburu; edomickiego króla z tak odległego miasta trudno wyjaśnić, chyba że wstąpił na tron z zewnątrz. Inni trzymają Rechobot w Edomie lub blisko niego i szukają jego rzeki wśród wadi płaskowyżu: Zared (Wadi Hasa), Wadi Ghuwajr koło Fajnan, Wadi Rihab albo Potok Egipski po stronie zachodniej. Mapa pokazuje tych kandydatów; żaden nie jest udowodniony."
    - "O mieście nie wiadomo nic poza imieniem króla, a o rzece nic poza słowem. Lista królów Edomu z Rdz 36 jest sama bez daty: jej królowie nie następują po sobie od ojca do syna i większość wiąże się z innym miastem lub krainą, co sugeruje wczesną monarchię elekcyjną, lecz żaden napis nie wymienia żadnego z nich. Dziś Zared to głęboki wąwóz Wadi Hasa między muhafazami Karak i Tafila w Jordanii; Rahaba (ar-Rahba) to ruiny średniowiecznego zamku nad Eufratem koło Majadin w Syrii."
  cs:
    - "„Řeka“ zde není samostatné jméno: je to řeka ve spojení „Rohobot od řeky“, domov Saula (Šaula), jednoho z osmi králů, kteří podle Genesis kralovali v zemi Edóm, než měl Izrael krále. Genesis a Kroniky podávají řádek seznamu a nic víc. Ve Starém zákoně je „řeka“ bez jména obvykle Eufrat, a proto se město dlouho hledalo daleko od Edómu, v Rahabě na středním Eufratu pod ústím Chábúru; edomského krále z tak vzdáleného města je těžké vysvětlit, ledaže na trůn přišel zvenčí. Jiní ponechávají Rechobót v Edómu či poblíž a hledají jeho řeku mezi vádí plošiny: Zered (Vádí Hasá), Vádí Ghuvajr u Fejnánu, Vádí Rihab nebo Egyptský potok na západní straně. Mapa tyto kandidáty ukazuje; žádný není prokázán."
    - "O městě není kromě královského jména nic známo a o řece nic kromě slova. Edomský královský seznam Genesis 36 je sám nedatovaný: jeho králové nenásledují z otce na syna a většina je spojena s jiným městem či zemí, což naznačuje raně volitelné království, ale žádný nápis žádného z nich nejmenuje. Zered je dnes hluboká soutěska Vádí Hasá mezi guvernoráty Karak a Tafíla v Jordánsku; Rahaba (ar-Rahba) je zřícený středověký hrad nad Eufratem poblíž Majádínu v Sýrii."
  nl:
    - "“Rivier” is hier geen eigen naam: het is de rivier in de uitdrukking “Rehoboth aan de rivier”, de woonplaats van Saul (Sjaul), een van de acht koningen die volgens Genesis in het land Edom regeerden voordat Israël een koning had. Genesis en Kronieken geven de regel van de lijst en zeggen niets meer. In het Oude Testament is “de rivier” zonder naam meestal de Eufraat, en daarom werd de stad lang ver van Edom gezocht, bij Rahaba aan de middenloop van de Eufraat onder de monding van de Chabur; een Edomitische koning uit zo’n verre stad is moeilijk te verklaren, tenzij hij van buiten tot de troon kwam. Anderen houden Rehobot in of bij Edom en zoeken de rivier onder de wadi’s van het plateau: de Zered (Wadi Hasa), Wadi Ghuwayr bij Feinan, Wadi Rihab, of de Beek van Egypte aan de westkant. De kaart toont deze kandidaten; geen is bewezen."
    - "Van de stad is niets bekend buiten de naam van de koning, en van de rivier niets buiten het woord. De Edomitische koningslijst van Genesis 36 is zelf ongedateerd: haar koningen volgen elkaar niet van vader op zoon op en de meesten zijn verbonden met een andere stad of een ander land, wat wijst op een vroeg gekozen koningschap, maar geen opschrift noemt een van hen. Tegenwoordig is de Zered de diepe kloof van Wadi Hasa tussen de gouvernementen Karak en Tafila in Jordanië; Rahaba (ar-Rahba) is een verwoest middeleeuws kasteel boven de Eufraat bij Mayadin in Syrië."
  sv:
    - "”Floden” är här inte ett eget namn: det är floden i uttrycket ”Rehobot vid floden”, hemorten för Saul (Shaul), en av de åtta kungar som, säger Första Mosebok, regerade i Edoms land innan Israel hade en kung. Första Mosebok och Krönikeböckerna ger raden i förteckningen och säger inget mer. I Gamla testamentet är ”floden” utan namn vanligen Eufrat, och därför söktes staden länge långt från Edom, vid Rahaba på mellersta Eufrat nedanför Khaburs mynning; en edomitisk kung från en så avlägsen stad är svår att förklara, om han inte kom till tronen utifrån. Andra håller Rehovot i eller nära Edom och söker dess flod bland platåns wadier: Sered (Wadi Hasa), Wadi Ghuwayr nära Feinan, Wadi Rihab eller Egyptens bäck på västra sidan. Kartan visar dessa kandidater; ingen är bevisad."
    - "Ingenting är känt om staden utöver kungens namn, och ingenting om floden utöver ordet. Edoms kungalista i 1 Mos 36 är i sig odaterad: dess kungar efterträder inte far till son och de flesta är knutna till en annan stad eller ett annat land, vilket tyder på ett tidigt valkungadöme, men ingen inskription nämner någon av dem. I dag är Sered den djupa klyftan Wadi Hasa mellan guvernementen Karak och Tafila i Jordanien; Rahaba (ar-Rahba) är en ruinerad medeltida borg ovanför Eufrat nära Mayadin i Syrien."
  nb:
    - "«Elven» er her ikke et eget navn: det er elven i uttrykket «Rehobot ved elven», hjemstedet til Sjaul (Saul), en av de åtte kongene som ifølge 1. Mosebok regjerte i Edoms land før Israel hadde en konge. 1. Mosebok og Krønikebøkene gir linjen i listen og sier ikke mer. I Det gamle testamente er «elven» uten navn vanligvis Eufrat, og derfor ble byen lenge søkt langt fra Edom, ved Rahaba på midtre Eufrat nedenfor Khaburs munning; en edomittisk konge fra en så fjern by er vanskelig å forklare, med mindre han kom til tronen utenfra. Andre holder Rehobot i eller nær Edom og søker elven blant wadiene på platået: Sered (Wadi Hasa), Wadi Ghuwayr ved Feinan, Wadi Rihab, eller Egypts bekk på vestsiden. Kartet viser disse kandidatene; ingen er bevist."
    - "Ingenting er kjent om byen utover kongens navn, og ingenting om elven utover ordet. Den edomittiske kongelisten i 1. Mosebok 36 er selv udatert: kongene følger ikke far etter sønn og de fleste er knyttet til en annen by eller et annet land, noe som tyder på et tidlig valgkongedømme, men ingen inskripsjon nevner noen av dem. I dag er Sered den dype kløften Wadi Hasa mellom guvernementene Karak og Tafila i Jordan; Rahaba (ar-Rahba) er en forfalt middelalderborg over Eufrat nær Mayadin i Syria."
  tl:
    - "Ang “Ilog” dito ay hindi sariling pangalan: ito ang ilog sa pariralang “Rehoboth sa tabi ng Ilog”, tahanan ni Saul (Shaul), isa sa walong haring, ayon sa Genesis, naghari sa Edom bago magkaroon ng hari ang Israel. Linya lamang ng listahan ang ibinibigay ng Genesis at Mga Cronica. Sa Lumang Tipan, ang “ilog” na walang pangalan ay karaniwang ang Eufrates, kaya matagal hinanap ang lungsod malayo sa Edom, sa Rahaba sa gitnang Eufrates sa ibaba ng bunganga ng Khabur; mahirap ipaliwanag ang haring Edomita mula sa gayong kalayong bayan, maliban kung nagmula siya sa labas patungo sa trono. Pinananatili ng iba ang Rehoboth sa loob o malapit sa Edom at hinahanap ang ilog nito sa mga wadi ng talampas: ang Zered (Wadi Hasa), Wadi Ghuwayr malapit sa Feinan, Wadi Rihab, o ang Batis ng Egipto sa kanluran. Ipinapakita ng mapa ang mga kandidatong ito; walang napatunayan."
    - "Walang nalalaman tungkol sa lungsod maliban sa pangalan ng hari, at wala tungkol sa ilog maliban sa salita. Ang listahan ng mga haring Edomita sa Genesis 36 ay walang petsa: hindi nagpapalitan ang mga hari mula ama sa anak at karamihan ay may kaugnayan sa ibang bayan o lupain, na nagmumungkahi ng maagang halalang pagkahari, ngunit walang inskripsiyong nagngangalan sa sinuman sa kanila. Ang Zered ay ang malalim na bangin ng Wadi Hasa ngayon sa pagitan ng mga gobernorato ng Karak at Tafila ng Jordan; ang Rahaba (ar-Rahba) ay wasak na kastilyong medyebal sa itaas ng Eufrates malapit sa Mayadin sa Siria."
scripture:
  - Gen.36.31
  - Gen.36.32-Gen.36.39
  - 1Chr.1.48
sources:
