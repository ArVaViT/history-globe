# Overview article (ADR 0007). Mainstream facts only; "River" is the river of "Rehoboth by the river", not a name; the Euphrates reading and the Edomite wadis are given as the two lines of opinion, neither as fact.
id: river
place: a3bb384
title:
  en: "River"
  ru: "Река"
  uk: "Ріка"
  es: "El río"
  pt: "Rio"
  de: "Strom"
  fr: "Fleuve"
body:
  en:
    - "“River” here is not a name of its own: it is the river in the phrase “Rehoboth by the river”, the home of Saul (Shaul), one of the eight kings who, Genesis says, reigned in the land of Edom before Israel had a king. Genesis and Chronicles give the line of the list and say nothing more. In the Old Testament “the river” without a name is usually the Euphrates, and so the city was long sought far from Edom, at Rahaba on the middle Euphrates below the mouth of the Khabur; an Edomite king from so distant a town is hard to explain, unless he came to the throne from outside. Others keep Rehoboth in or near Edom and look for its river among the wadis of the plateau: the Zered (Wadi Hasa), Wadi Ghuwayr near Feinan, Wadi Rihab, or the Brook of Egypt on the western side. The map shows these candidates; none is proved."
    - "Nothing is known of the city beyond the king's name, and nothing of the river beyond the word. The Edomite king list of Genesis 36 is itself undated: its kings do not succeed father to son and each comes from a different town, which suggests an early elective kingship, but no inscription names any of them. Today the Zered is the deep gorge of Wadi Hasa between the Karak and Tafila governorates of Jordan; Rahaba (ar-Rahba) is a ruined mediaeval castle above the Euphrates near Mayadin in Syria."
  ru:
    - "«Река» здесь не собственное имя: это река из слов о Сауле «из Реховофа, что при реке» — Реховоф был родиной Саула, одного из восьми царей, которые, по книге Бытия, царствовали в земле Едома прежде, чем у Израиля появился царь. Бытие и Паралипоменон приводят строку списка и больше ничего не говорят. В Ветхом Завете «река» без имени обычно означает Евфрат, и потому город долго искали далеко от Едома — в Рахабе на среднем Евфрате ниже устья Хавора; едомского царя из столь далёкого города трудно объяснить, разве что он пришёл к престолу извне. Другие оставляют Реховоф в Едоме или рядом с ним и ищут его реку среди вади плоскогорья: Заред (Вади-Хаса), Вади-Гувейр близ Файнана, Вади-Рихаб или Поток Египетский на западной стороне. На карте показаны эти варианты; ни один не доказан."
    - "О городе не известно ничего, кроме имени царя, а о реке — ничего, кроме самого слова. Список едомских царей в 36-й главе Бытия сам не датирован: цари в нём не наследуют отцу, и каждый происходит из другого города, что говорит о ранней выборной власти, но ни одна надпись не называет никого из них. Сегодня Заред — глубокое ущелье Вади-Хаса между провинциями Эль-Карак и Эт-Тафила в Иордании; Рахаба (Эр-Рахба) — разрушенный средневековый замок над Евфратом близ Маядина в Сирии."
  uk:
    - "«Ріка» тут — не окрема назва: це ріка у вислові «Реховот над рікою», батьківщина Саула (Шауля), одного з восьми царів, які, за Книгою Буття, царювали в краї Едом, перш ніж Ізраїль мав царя. Книги Буття й Хронік подають лише рядок переліку й більше нічого не кажуть. У Старому Заповіті «ріка» без назви зазвичай означає Євфрат, тож місто довго шукали далеко від Едому, в Рахабі на середньому Євфраті нижче гирла Хабура; едомського царя з такого далекого міста важко пояснити, хіба що він прийшов на престол ззовні. Інші тримають Реховот в Едомі чи поблизу нього й шукають його ріку серед ваді плато: Заред (Ваді-Хаса), Ваді-Ґувайр поблизу Фейнана, Ваді-Ріхаб або Єгипетський потік із західного боку. Карта показує цих кандидатів; жоден не доведений."
    - "Про місто, крім імені царя, нічого не відомо, а про ріку — нічого, крім слова. Едомський перелік царів у Буття 36 сам не датований: його царі не наслідують один одному від батька до сина, і кожен походить з іншого міста, що вказує на ранню виборну царську владу, але жоден напис не називає жодного з них. Сьогодні Заред — це глибока ущелина Ваді-Хаса між губернаторствами Карак і Тафіла в Йорданії; Рахаба (ар-Рахба) — зруйнований середньовічний замок над Євфратом поблизу Маядіна в Сирії."
  es:
    - "«El río» no es aquí un nombre propio: es el río de la expresión «Rehoboth del Río», la patria de Saúl (Shaúl), uno de los ocho reyes que, según el Génesis, reinaron en la tierra de Edom antes de que Israel tuviera rey. El Génesis y Crónicas dan la línea de la lista y no dicen nada más. En el Antiguo Testamento «el río» sin nombre es por lo común el Éufrates, y por eso la ciudad se buscó durante mucho tiempo lejos de Edom, en Rahaba, en el Éufrates medio, bajo la desembocadura del Jabur; un rey edomita de una ciudad tan lejana es difícil de explicar, a menos que llegara al trono desde fuera. Otros mantienen Rehobot en Edom o cerca de él y buscan su río entre los uadis de la meseta: el Zered (Wadi Hasa), Wadi Ghuwayr cerca de Feinan, Wadi Rihab, o el Torrente de Egipto en el lado occidental. El mapa muestra estos candidatos; ninguno está probado."
    - "No se sabe nada de la ciudad más allá del nombre del rey, ni nada del río más allá de la palabra. La lista de reyes edomitas de Génesis 36 carece en sí misma de fecha: sus reyes no se suceden de padre a hijo y cada uno procede de una ciudad distinta, lo que sugiere una realeza electiva antigua, pero ninguna inscripción nombra a ninguno de ellos. Hoy el Zered es la profunda garganta del Wadi Hasa entre las gobernaciones jordanas de Karak y Tafila; Rahaba (ar-Rahba) es un castillo medieval en ruinas sobre el Éufrates, cerca de Mayadin, en Siria."
  pt:
    - "“Rio” aqui não é um nome próprio: é o rio da expressão “Reobote, junto ao rio”, a terra de Saul (Shaul), um dos oito reis que, segundo o Gênesis, reinaram na terra de Edom antes que Israel tivesse rei. O Gênesis e Crônicas dão a linha da lista e nada mais dizem. No Antigo Testamento “o rio” sem nome é geralmente o Eufrates, e por isso a cidade foi por muito tempo procurada longe de Edom, em Rahaba, no médio Eufrates, abaixo da foz do Cabur; um rei edomita de cidade tão distante é difícil de explicar, a não ser que tenha chegado ao trono de fora. Outros mantêm Reobote em Edom ou perto dele e procuram seu rio entre os uádis do planalto: o Zerede (Wadi Hasa), o Wadi Ghuwayr perto de Feinan, o Wadi Rihab, ou o Ribeiro do Egito, no lado oeste. O mapa mostra esses candidatos; nenhum está provado."
    - "Nada se sabe da cidade além do nome do rei, e nada do rio além da palavra. A lista dos reis edomitas do Gênesis 36 é em si mesma sem datas: seus reis não se sucedem de pai para filho e cada um vem de uma cidade diferente, o que sugere uma realeza eletiva antiga, mas nenhuma inscrição nomeia nenhum deles. Hoje o Zerede é a profunda garganta do Wadi Hasa entre as províncias jordanianas de Karak e Tafila; Rahaba (ar-Rahba) é um castelo medieval em ruínas acima do Eufrates, perto de Mayadin, na Síria."
  de:
    - "„Strom“ ist hier kein eigener Name: Es ist der Strom in der Wendung „Rehobot am Strom“, der Heimat Sauls (Schauls), eines der acht Könige, die nach der Genesis im Land Edom regierten, ehe Israel einen König hatte. Die Genesis und die Chronik geben die Zeile der Liste und sagen sonst nichts. Im Alten Testament ist „der Strom“ ohne Namen meist der Euphrat, und so suchte man die Stadt lange weit von Edom entfernt, bei Rahaba am mittleren Euphrat unterhalb der Mündung des Chabur; ein edomitischer König aus einer so fernen Stadt ist schwer zu erklären, es sei denn, er kam von außen auf den Thron. Andere halten Rehobot in oder bei Edom und suchen seinen Strom unter den Wadis der Hochfläche: dem Sered (Wadi Hasa), dem Wadi Ghuwair bei Fainan, dem Wadi Rihab oder dem Bach Ägyptens auf der Westseite. Die Karte zeigt diese Kandidaten; keiner ist bewiesen."
    - "Von der Stadt ist nichts bekannt außer dem Namen des Königs, vom Strom nichts außer dem Wort. Die edomitische Königsliste von Genesis 36 ist selbst undatiert: Ihre Könige folgen nicht von Vater auf Sohn, und jeder stammt aus einer anderen Stadt, was auf ein frühes Wahlkönigtum deutet, doch keine Inschrift nennt einen von ihnen. Heute ist der Sered die tiefe Schlucht des Wadi Hasa zwischen den jordanischen Gouvernements Karak und Tafila; Rahaba (ar-Rahba) ist eine mittelalterliche Burgruine über dem Euphrat bei Mayadin in Syrien."
  fr:
    - "« Fleuve » n’est pas ici un nom propre : c’est le fleuve de l’expression « Rehoboth sur le fleuve », patrie de Saül (Shaül), l’un des huit rois qui, dit la Genèse, régnèrent dans le pays d’Édom avant qu’Israël eût un roi. La Genèse et les Chroniques donnent la ligne de la liste et ne disent rien de plus. Dans l’Ancien Testament, « le fleuve » sans nom est d’ordinaire l’Euphrate, et l’on a donc longtemps cherché la ville loin d’Édom, à Rahaba sur le moyen Euphrate, sous l’embouchure du Khabour ; un roi édomite venu d’une ville si lointaine s’explique mal, à moins qu’il n’ait accédé au trône de l’extérieur. D’autres gardent Rehoboth en Édom ou près de lui et cherchent son fleuve parmi les oueds du plateau : le Zéred (Wadi Hasa), le Wadi Ghuwayr près de Feinan, le Wadi Rihab, ou le torrent d’Égypte du côté occidental. La carte montre ces candidats ; aucun n’est prouvé."
    - "On ne sait rien de la ville hors du nom du roi, ni du fleuve hors du mot. La liste des rois édomites de Genèse 36 est elle-même sans date : ses rois ne se succèdent pas de père en fils et chacun vient d’une ville différente, ce qui suggère une royauté élective ancienne, mais aucune inscription n’en nomme un seul. Aujourd’hui, le Zéred est la gorge profonde du Wadi Hasa entre les gouvernorats de Karak et de Tafila, en Jordanie ; Rahaba (ar-Rahba) est un château médiéval en ruine au-dessus de l’Euphrate près de Mayadine, en Syrie."
