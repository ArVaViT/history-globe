body:
  en:
    - "Kedemoth was a town on the Moabite plateau north of the Arnon, in the land that Israel took from Sihon and gave to Reuben. Moses remembers that “I sent messengers out of the wilderness of Kedemoth unto Sihon king of Heshbon with words of peace”, asking passage along the highway; Sihon refused and was beaten at Jahaz. The wilderness of Kedemoth was therefore the steppe on the desert side of the plateau, east of Dibon, where Israel stood after crossing the Arnon. Joshua lists Kedemoth with Jahaz and Mephaath among Reuben's towns, and it was one of the four cities given out of Reuben to the Levites of Merari; the Chronicler's list repeats it. The name, from the word for east, fits a place on the eastern margin of the settled land."
    - "No site has been fixed. Mephaath, its neighbour in every list, is almost certainly Umm er-Rasas, whose Byzantine mosaics name the place Kastron Mefaa, so Kedemoth is sought in the same tableland between Dibon and the desert: surveys have proposed Aleiyan, er-Remeil, es-Saliyeh and Qasr ez-Zaferan, ruins scattered over some twenty kilometres of the plateau, and some have placed it at Umm er-Rasas itself. None has been excavated in a way that could decide the question, and the town has no history beyond the lists."
    - "The ground is today in central Jordan, the open wheat and sheep country east of Dhiban toward the desert highway, with Umm ar-Rasas, a World Heritage site, at its edge."
  ru:
    - "Кедемоф — город на Моавитском плато к северу от Арнона, в земле, которую Израиль отнял у Сигона и отдал Рувиму. Моисей вспоминает: «И послал я послов из пустыни Кедемоф к Сигону, царю Есевонскому, с словами мирными», прося пропустить по дороге; Сигон отказал и был разбит при Иааце. Пустыня Кедемоф, стало быть, — степь на пустынной стороне плато, к востоку от Дивона, где Израиль стоял, перейдя Арнон. Иисус Навин перечисляет Кедемоф с Иаацей и Мефаафом среди городов Рувима, и он был одним из четырёх городов, отданных от Рувима левитам из рода Мерари; список Паралипоменона повторяет его. Имя, от слова «восток», подходит месту на восточной окраине обжитой земли."
    - "Место не установлено. Мефааф, его сосед во всех списках, почти наверняка Умм-эр-Расас, чьи византийские мозаики называют место Кастрон-Мефаа, поэтому Кедемоф ищут на том же плоскогорье между Дивоном и пустыней: обследования предлагали Алейян, Эр-Ремейль, Эс-Салийе и Каср-эз-Заферан — развалины, разбросанные километров на двадцать по плоскогорью, а некоторые помещали его в самом Умм-эр-Расасе. Ни одна из них не раскопана так, чтобы решить вопрос, и у города нет истории сверх списков."
    - "Сегодня это центральная Иордания, открытый край хлебных полей и овечьих пастбищ к востоку от Дибана в сторону пустынного шоссе, с Умм-эр-Расасом, памятником Всемирного наследия, на его краю."
  uk:
    - "Кедемот — місто на моавитському плато на північ від Арнону, у землі, яку Ізраїль відібрав у Сігона й віддав Рувимові. Мойсей згадує: «І послав я посли з Кадемот-степу до Сигона, царя Гезбонського, з мирними словами», просячи дозволу пройти дорогою; Сігон відмовив і був розбитий біля Яци. Пустеля Кедемот, отже, — це степ з пустельного боку плато, на схід від Дівона, де Ізраїль стояв, перейшовши Арнон. Ісус Навин називає Кедемот разом з Яцею та Мефаатом серед міст Рувима, і це було одне з чотирьох міст, виділених із Рувимового уділу левітам з роду Мерарі; перелік у Книзі Хронік повторює його. Назва, утворена від слова «схід», пасує місцю на східному краю заселеної землі."
    - "Місце не встановлено. Мефаат, його сусід у кожному переліку, майже напевно відповідає Умм-ер-Расасу, чиї візантійські мозаїки називають це місце Кастрон Мефаа, тому Кедемот шукають на тому самому плоскогір’ї між Дівоном і пустелею: обстеження пропонували Алейян, ер-Ремейль, ес-Саліє та Каср-ез-Зафаран — руїни, розкидані кілометрів на двадцять по плоскогір’ю, а дехто розміщував його в самому Умм-ер-Расасі. Жодне з цих місць не розкопане так, щоб розв’язати питання, і в міста немає історії поза переліками."
    - "Сьогодні ця земля лежить у центральній Йорданії: відкритий край пшеничних ланів і вівчих пасовищ на схід від Дібана в напрямку пустельної траси, а на його краю — Умм-ер-Расас, об’єкт Всесвітньої спадщини."
  es:
    - "Cedemot era una ciudad de la meseta de Moab, al norte del Arnón, en la tierra que Israel tomó a Sehón y entregó a Rubén. Moisés recuerda: «Y envié mensajeros desde el desierto de Cademoth á Sehón rey de Hesbón, con palabras de paz», para pedir paso por el camino; Sehón se negó y fue derrotado en Jahaza. El desierto de Cedemot era, por tanto, la estepa del lado desértico de la meseta, al este de Dibón, donde Israel se detuvo tras cruzar el Arnón. Josué enumera Cedemot junto con Jahaza y Mefaat entre las ciudades de Rubén, y fue una de las cuatro ciudades que Rubén cedió a los levitas de Merari; la lista del Cronista la repite. El nombre, derivado de la palabra que significa «este», conviene a un lugar situado en el margen oriental de la tierra habitada."
    - "No se ha fijado ningún emplazamiento. Mefaat, su vecina en todas las listas, es casi con certeza Umm er-Rasas, cuyos mosaicos bizantinos llaman al lugar Kastron Mefaa; por eso Cedemot se busca en la misma meseta, entre Dibón y el desierto: las prospecciones han propuesto Aleiyan, er-Remeil, es-Saliyeh y Qasr ez-Zaferan, ruinas dispersas por unos veinte kilómetros de la meseta, y algunos la han situado en la propia Umm er-Rasas. Ninguna ha sido excavada de un modo que permita decidir la cuestión, y la ciudad no tiene más historia que la de las listas."
    - "Hoy el terreno se encuentra en el centro de Jordania, un país abierto de trigales y rebaños de ovejas al este de Dhiban, hacia la carretera del desierto, con Umm ar-Rasas, sitio del Patrimonio Mundial, en su borde."
  pt:
    - "Quedemote era uma cidade do planalto de Moabe, ao norte do Arnom, na terra que Israel tomou de Seom e deu a Rúben. Moisés recorda: “Enviei mensageiros do deserto de Quedemote a Seom, rei de Hesbom, com palavras de paz”, pedindo passagem pela estrada; Seom recusou e foi derrotado em Jaza. O deserto de Quedemote era, portanto, a estepe do lado desértico do planalto, a leste de Dibom, onde Israel parou depois de atravessar o Arnom. Josué menciona Quedemote com Jaza e Mefaate entre as cidades de Rúben, e ela foi uma das quatro cidades cedidas por Rúben aos levitas de Merari; a lista do Cronista a repete. O nome, derivado da palavra para “leste”, convém a um lugar na margem oriental da terra habitada."
    - "Nenhum sítio foi fixado. Mefaate, sua vizinha em todas as listas, é quase certamente Umm er-Rasas, cujos mosaicos bizantinos chamam o lugar de Kastron Mefaa; por isso Quedemote é procurada no mesmo planalto, entre Dibom e o deserto: as prospecções propuseram Aleiyan, er-Remeil, es-Saliyeh e Qasr ez-Zaferan, ruínas espalhadas por uns vinte quilômetros do planalto, e alguns a situaram na própria Umm er-Rasas. Nenhuma foi escavada de modo a decidir a questão, e a cidade não tem história além das listas."
    - "O terreno situa-se hoje no centro da Jordânia, campo aberto de trigais e rebanhos de ovelhas a leste de Dhiban, rumo à estrada do deserto, com Umm ar-Rasas, sítio do Patrimônio Mundial, em sua orla."
  de:
    - "Kedemot war eine Stadt auf der moabitischen Hochebene nördlich des Arnon, in dem Land, das Israel Sihon abnahm und Ruben gab. Mose erinnert sich: „Da sandte ich Boten aus der Wüste von Kedemoth zu Sihon, dem König zu Hesbon, mit friedlichen Worten“ und bat um Durchzug auf der Straße; Sihon verweigerte ihn und wurde bei Jahaz geschlagen. Die Wüste Kedemot war also die Steppe auf der Wüstenseite der Hochebene, östlich von Dibon, wo Israel nach der Überschreitung des Arnon stand. Josua nennt Kedemot mit Jahaz und Mefaat unter den Städten Rubens, und es war eine der vier Städte, die Ruben den Leviten aus Merari abgab; die Liste des Chronisten wiederholt es. Der Name, abgeleitet vom Wort für Osten, passt zu einem Ort am östlichen Rand des besiedelten Landes."
    - "Der Ort ist nicht festgelegt. Mefaat, sein Nachbar in jeder Liste, ist mit ziemlicher Sicherheit Umm er-Rasas, dessen byzantinische Mosaiken den Ort Kastron Mefaa nennen; deshalb sucht man Kedemot auf derselben Hochebene zwischen Dibon und der Wüste: Geländebegehungen haben Aleiyan, er-Remeil, es-Saliyeh und Qasr ez-Zaferan vorgeschlagen, Ruinen, über etwa zwanzig Kilometer der Hochebene verstreut, und manche haben es in Umm er-Rasas selbst angesetzt. Keine davon wurde so ausgegraben, dass die Frage entschieden werden könnte, und die Stadt hat keine Geschichte jenseits der Listen."
    - "Das Gelände liegt heute im mittleren Jordanien, ein offenes Land aus Weizenfeldern und Schafweiden östlich von Dhiban zur Wüstenstraße hin, an seinem Rand Umm ar-Rasas, eine Welterbestätte."
  fr:
    - "Kedémoth était une ville du plateau moabite, au nord de l’Arnon, dans le pays qu’Israël prit à Sihon et donna à Ruben. Moïse rappelle : « J’envoyai, du désert de Kedémoth, des messagers à Sihon, roi de Hesbon, avec des paroles de paix », pour demander le passage par la grande route ; Sihon refusa et fut battu à Jahats. Le désert de Kedémoth était donc la steppe du côté désertique du plateau, à l’est de Dibon, où Israël se tint après avoir franchi l’Arnon. Josué range Kedémoth avec Jahats et Méphaath parmi les villes de Ruben, et elle fut l’une des quatre villes prises sur Ruben pour les lévites de Merari ; la liste du Chroniqueur la répète. Le nom, tiré du mot qui signifie l’orient, convient à un lieu situé à la marge orientale du pays habité."
    - "Aucun site n’a été fixé. Méphaath, sa voisine dans toutes les listes, est presque certainement Umm er-Rasas, dont les mosaïques byzantines nomment le lieu Kastron Mefaa ; Kedémoth se cherche donc dans le même plateau, entre Dibon et le désert : les prospections ont proposé Aleiyan, er-Remeil, es-Saliyeh et Qasr ez-Zaferan, ruines dispersées sur une vingtaine de kilomètres du plateau, et certains l’ont placée à Umm er-Rasas même. Aucune n’a été fouillée de manière à trancher la question, et la ville n’a pas d’histoire en dehors des listes."
    - "Le terrain se trouve aujourd’hui au centre de la Jordanie, pays ouvert de blé et de moutons à l’est de Dhiban, vers la route du désert, avec Umm ar-Rasas, site du patrimoine mondial, sur sa lisière."
  it:
    - "Chedemot era una città dell’altopiano moabita a nord dell’Arnon, nella terra che Israele tolse a Sicon e diede a Ruben. Mosè ricorda: «mandai ambasciatori dal deserto di Kedemoth a Sihon, re di Heshbon, con parole di pace», chiedendo il passaggio lungo la strada maestra; Sicon rifiutò e fu sconfitto a Iaaz. Il deserto di Chedemot era dunque la steppa sul lato desertico dell’altopiano, a est di Dibon, dove Israele si fermò dopo aver attraversato l’Arnon. Giosuè elenca Chedemot con Iaaz e Mefaat tra le città di Ruben, ed essa fu una delle quattro città cedute da Ruben ai leviti di Merari; l’elenco del Cronista la ripete. Il nome, dalla parola che significa «oriente», si addice a un luogo sul margine orientale della terra abitata."
    - "Il sito non è stato fissato. Mefaat, la sua vicina in ogni elenco, è quasi certamente Umm er-Rasas, i cui mosaici bizantini chiamano il luogo Kastron Mefaa; perciò Chedemot si cerca nello stesso tavolato tra Dibon e il deserto: le ricognizioni hanno proposto Aleiyan, er-Remeil, es-Saliyeh e Qasr ez-Zaferan, rovine sparse su una ventina di chilometri del tavolato, e alcuni l’hanno collocata nella stessa Umm er-Rasas. Nessuno di questi siti è stato scavato in modo da risolvere la questione, e la città non ha storia al di fuori degli elenchi."
    - "Il luogo si trova oggi nella Giordania centrale, un paese aperto di campi di grano e di greggi di pecore a est di Dhiban, verso la strada del deserto, con Umm ar-Rasas, sito del Patrimonio mondiale, ai suoi margini."
  pl:
    - "Kedemot było miastem na płaskowyżu Moabu, na północ od Arnonu, w ziemi, którą Izrael zabrał Sychonowi i oddał Rubenowi. Mojżesz wspomina: „Tedym posłał posły z puszczy Kademot do Sehona, króla Hesebońskiego, z poselstwem spokojnem”, prosząc o przejście główną drogą; Sychon odmówił i został pobity pod Jahaz. Puszcza Kedemot była więc stepem po pustynnej stronie płaskowyżu, na wschód od Dibonu, gdzie Izrael stanął po przejściu Arnonu. Jozue wymienia Kedemot razem z Jahaz i Mefaat wśród miast Rubena, a było ono jednym z czterech miast oddanych z dziedzictwa Rubena Lewitom z rodu Merariego; lista Kronikarza powtarza je. Nazwa, pochodząca od słowa oznaczającego wschód, pasuje do miejsca na wschodnim skraju zasiedlonej ziemi."
    - "Miejsce nie zostało ustalone. Sąsiadujący z nim na każdej liście Mefaat to niemal na pewno Umm er-Rasas, którego bizantyjskie mozaiki nazywają to miejsce Kastron Mefaa, dlatego Kedemot szuka się na tym samym płaskowyżu między Dibonem a pustynią: badania powierzchniowe wskazywały Aleiyan, er-Remeil, es-Saliyeh i Qasr ez-Zaferan – ruiny rozrzucone na przestrzeni około dwudziestu kilometrów płaskowyżu, a niektórzy umieszczali je w samym Umm er-Rasas. Żadne z tych miejsc nie zostało wykopane w stopniu pozwalającym rozstrzygnąć sprawę, a miasto nie ma historii poza listami."
    - "Teren leży dziś w środkowej Jordanii: to otwarty kraj pól pszenicy i owiec na wschód od Dhiban, w stronę pustynnej szosy, a na jego skraju leży Umm ar-Rasas, miejsce światowego dziedzictwa."
  nl:
    - "Kedemot was een stad op het Moabitische plateau ten noorden van de Arnon, in het land dat Israël Sihon afnam en aan Ruben gaf. Mozes herinnert zich: “Toen zond ik boden uit de woestijn Kedemot tot Sihon, den koning van Hesbon, met woorden van vrede”, met het verzoek om doortocht langs de hoofdweg; Sihon weigerde en werd bij Jahaz verslagen. De woestijn van Kedemot was dus de steppe aan de woestijnkant van het plateau, ten oosten van Dibon, waar Israël stond na de oversteek van de Arnon. Jozua noemt Kedemot samen met Jahaz en Mefaät onder de steden van Ruben, en het was een van de vier steden die van Ruben aan de Levieten van Merari werden gegeven; ook de lijst van de Kroniekschrijver noemt het. De naam, afgeleid van het woord voor oost, past bij een plaats aan de oostrand van het bewoonde land."
    - "De plaats is niet vastgesteld. Mefaät, in elke lijst de buur van Kedemot, is vrijwel zeker Umm er-Rasas, waarvan de Byzantijnse mozaïeken de plaats Kastron Mefaa noemen; daarom zoekt men Kedemot op hetzelfde hoogland tussen Dibon en de woestijn. Opmetingen hebben Aleiyan, er-Remeil, es-Saliyeh en Qasr ez-Zaferan voorgesteld, ruïnes verspreid over zo'n twintig kilometer van het hoogland, en sommigen plaatsten het in Umm er-Rasas zelf. Geen ervan is zo opgegraven dat de vraag beslist kan worden, en de stad heeft geen geschiedenis buiten de lijsten."
    - "Het terrein ligt tegenwoordig in Midden-Jordanië, het open graan- en schapenland ten oosten van Dhiban richting de woestijnweg, met aan de rand Umm ar-Rasas, een werelderfgoedlocatie."
  cs:
    - "Kedemót bylo město na moábské planině severně od Arnonu, v zemi, kterou Izrael vzal Sichonovi a dal Rúbenovi. Mojžíš si připomíná: „I poslal jsem posly z pouště Kedemot k Seonovi, králi Ezebon, s slovy pokojnými“, když žádal o průchod po hlavní cestě; Sichon odmítl a byl poražen u Jahace. Poušť Kedemót byla tedy step na pouštní straně planiny, východně od Dibonu, kde Izrael stanul po přechodu Arnonu. Jozue uvádí Kedemót s Jahacem a Mefaatem mezi městy Rúbenovými a bylo jedním ze čtyř měst, která z Rúbena připadla levitům z Merari; Kronikářův seznam je opakuje. Jméno, odvozené od slova pro východ, se hodí k místu na východním okraji osídlené země."
    - "Poloha není určena. Mefaat, sousední město Kedemótu ve všech seznamech, je téměř jistě Umm er-Rasas, jehož byzantské mozaiky nazývají místo Kastron Mefaa, a proto se Kedemót hledá na téže náhorní rovině mezi Dibonem a pouští: průzkumy navrhly Aleiyan, er-Remeil, es-Saliyeh a Qasr ez-Zaferan, zříceniny roztroušené na nějakých dvaceti kilometrech náhorní roviny, a někteří je kladli přímo do Umm er-Rasasu. Žádné z těch míst nebylo vykopáno tak, aby se otázka dala rozhodnout, a město nemá jinou historii než ze seznamů."
    - "Tato půda leží dnes ve středním Jordánsku, v otevřené krajině pšeničných polí a ovčích pastvin východně od Dhibánu směrem k pouštní silnici, s Umm ar-Rasasem, památkou světového dědictví, na jejím okraji."
  sv:
    - "Kedemot var en stad på moabitiska högplatån norr om Arnon, i det land som Israel tog från Sichon och gav åt Ruben. Mose minns att ”jag skickade sändebud från Kedemots öken till Sihon, konungen i Hesbon, med fridsam hälsning”, och bad om genomfärd längs vägen; Sichon vägrade och besegrades vid Jahas. Kedemots öken var alltså stäppen på öknens sida av högplatån, öster om Dibon, där Israel stod efter att ha gått över Arnon. Josua räknar upp Kedemot med Jahas och Mefaat bland Rubens städer, och den var en av de fyra städer som gavs ur Ruben åt Meraris leviter; krönikeförfattarens förteckning upprepar den. Namnet, av ordet för öster, passar en plats vid det bebyggda landets östra kant."
    - "Ingen plats har fastställts. Mefaat, dess granne i varje förteckning, är nästan säkert Umm er-Rasas, vars bysantinska mosaiker kallar platsen Kastron Mefaa, så Kedemot söks på samma högslätt mellan Dibon och öknen: undersökningar har föreslagit Aleiyan, er-Remeil, es-Saliyeh och Qasr ez-Zaferan, ruiner utspridda över omkring tjugo kilometer av högplatån, och vissa har placerat den i själva Umm er-Rasas. Ingen har grävts ut på ett sätt som kunde avgöra frågan, och staden har ingen historia utöver förteckningarna."
    - "Marken ligger i dag i centrala Jordanien, det öppna vete- och fårlandet öster om Dhiban mot ökenvägen, med Umm ar-Rasas, ett världsarv, vid kanten."
scripture:
  - Deut.2.26-Deut.2.27
  - Deut.2.30-Deut.2.32
