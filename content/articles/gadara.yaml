body:
  en:
    - "Gadara, today's Umm Qais in the far north of Jordan, stood on a ridge above the gorge of the Yarmuk, about 10 km southeast of the Sea of Galilee, with a wide view over the lake and the Golan. The hot springs of Hammat Gader in the valley below lay in its territory. It was a Hellenistic town by the third century BC. In 218 BC the Seleucid king Antiochus III besieged it, the strongest town of the district in Polybius' words, and it soon surrendered. Alexander Jannaeus took it after a siege of ten months, early in the first century BC."
    - "Gadara was known for its men of letters: Strabo names among its natives Philodemus the Epicurean, the poet Meleager and Menippus the satirist. After the Roman conquest of 63 BC Pompey rebuilt the city, which the Jews had destroyed, to please his freedman Demetrius of Gadara, and it became one of the cities of the Decapolis; Pliny places it on the river Hieromix, the Yarmuk. In 30 BC Augustus gave Gadara to Herod the Great. Its citizens later accused Herod before Augustus in vain, and after Herod's death Augustus separated Gadara, Gaza and Hippos as Greek cities from his kingdom and added them to Syria. In the revolt of AD 66 Jewish bands attacked Gadara, and the Gadarenes killed the boldest of their Jews."
    - "Matthew tells how Jesus, crossing the lake, met two men possessed with devils, who came out of the tombs; the devils went into a herd of swine, and the whole herd ran down a steep place into the sea. The manuscripts name the place differently. The KJV and the Synodal text read Gergesenes in Matthew and Gadarenes in Mark and Luke, while many modern editions read Gadarenes in Matthew and Gerasenes in Mark and Luke. Origen objected that Gadara had no lake or steep bank by it and preferred Gergesa, a village on the shore."
    - "Under Rome Gadara grew into a city with two theatres, colonnaded streets and baths. In the fourth century Eusebius described it as a city beyond the Jordan, opposite Scythopolis and Tiberias, with hot baths at the foot of its hills, and Eunapius called the warm baths of Gadara second only to those of Baiae in Italy. In the fifth century the empress Eudocia praised the baths of Hammat Gader in a poem inscribed there."
  ru:
    - "Гадара, нынешний Умм-Кайс на крайнем севере Иордании, стояла на хребте над ущельем Ярмука, примерно в 10 км к юго-востоку от Моря Галилейского, откуда широко видны озеро и Голаны. Ей принадлежали горячие источники Хамат-Гадера в долине внизу. Эллинистическим городом она была уже в III веке до н. э. В 218 г. до н. э. её осадил селевкидский царь Антиох III; по словам Полибия, это был сильнейший город в округе, и вскоре он сдался. Александр Яннай взял Гадару после десятимесячной осады в начале I века до н. э."
    - "Гадара славилась учёными людьми: Страбон называет её уроженцами эпикурейца Филодема, поэта Мелеагра и сатирика Мениппа. После римского завоевания 63 г. до н. э. Помпей отстроил разрушенный иудеями город в угоду своему вольноотпущеннику Деметрию Гадарскому, и он стал одним из городов Десятиградия; Плиний помещает его на реке Гиеромикс, то есть Ярмуке. В 30 г. до н. э. Август отдал Гадару Ироду Великому. Позже её жители напрасно обвиняли Ирода перед Августом, а после смерти Ирода Август отделил Гадару, Газу и Иппос как греческие города от его царства и присоединил их к Сирии. Во время восстания 66 г. н. э. иудейские отряды напали на Гадару, а гадаряне убили самых смелых из своих иудеев."
    - "Матфей рассказывает, как Иисус, переправившись через озеро, встретил двух бесноватых, вышедших из гробов; бесы вошли в стадо свиней, и всё стадо бросилось с крутизны в море. В рукописях место названо по-разному. Синодальный перевод, как и KJV, читает у Матфея «в страну Гергесинскую», у Марка и Луки — «в страну Гадаринскую», а многие современные издания читают у Матфея «Гадаринская», у Марка и Луки — «Герасинская». Ориген возражал, что у Гадары нет ни озера, ни крутого берега, и предпочитал Гергесу, селение на берегу."
    - "Под властью Рима Гадара выросла в город с двумя театрами, улицами с колоннадами и банями. В IV веке Евсевий описывал её как город за Иорданом напротив Скифополя и Тивериады, у подножия гор которого есть горячие бани, а Евнапий называл тёплые бани Гадары вторыми после Байев в Италии. В V веке императрица Евдокия воспела бани Хамат-Гадера в стихотворении, высеченном там же."
  uk:
    - "Гадара, сьогоднішній Умм-Кайс на крайній півночі Йорданії, стояла на хребті над ущелиною Ярмуку, приблизно за 10 км на південний схід від Галілейського моря, з широким видом на озеро і Голан. Гарячі джерела Хаммат-Гадера в долині внизу лежали на її території. Вона була елліністичним містом уже в III ст. до н. е. У 218 р. до н. е. селевкідський цар Антіох III облягав її, найміцніше місто округи, за словами Полібія, і вона невдовзі здалася. Александр Яннай узяв її після десятимісячної облоги, на початку I ст. до н. е."
    - "Гадара була відома своїми літераторами: Страбон називає серед її уродженців епікурейця Філодема, поета Мелеагра і сатирика Меніппа. Після римського завоювання 63 р. до н. е. Помпей відбудував місто, зруйноване юдеями, щоб догодити своєму вільновідпущенику Димитрієві з Гадари, і воно стало одним із міст Десятимістя; Пліній розташовує його на річці Ієроміс, Ярмуку. У 30 р. до н. е. Август віддав Гадару Іродові Великому. Її мешканці пізніше марно скаржилися на Ірода перед Августом, а по смерті Ірода Август відокремив Гадару, Газу та Гіппос як грецькі міста від його царства й додав їх до Сирії. Під час повстання 66 р. н. е. юдейські загони напали на Гадару, а гадаринці вбили найвідважніших із своїх юдеїв."
    - "Матвій розповідає, як Ісус, переправляючись через озеро, зустрів двох одержимих бісами, які вийшли з гробниць; біси увійшли в стадо свиней, і все стадо кинулося з кручі в море. Рукописи називають місце по-різному. Переклад короля Якова і Синодальний текст читають гергесинців у Матвія й гадаринців у Марка й Луки, тоді як багато сучасних видань читають гадаринців у Матвія й герасинців у Марка й Луки. Оріген заперечував, що біля Гадари немає ні озера, ні крутого берега, і віддавав перевагу Гергесі, селу на березі."
    - "За Рима Гадара виросла в місто з двома театрами, колонадними вулицями й лазнями. У IV ст. Євсевій описав її як місто за Йорданом, навпроти Скіфополя й Тіверіади, з гарячими лазнями біля підніжжя її пагорбів, а Евнапій називав теплі лазні Гадари другими лише після Байй в Італії. У V ст. імператриця Євдокія вихваляла лазні Хаммат-Гадера у вірші, написаному там."
  es:
    - "Gadara, la actual Umm Qais, en el extremo norte de Jordania, se alzaba en una loma sobre la garganta del Yarmuk, a unos 10 km al sudeste del mar de Galilea, con una amplia vista sobre el lago y el Golán. Las aguas termales de Hammat Gader, en el valle de abajo, estaban en su territorio. Era una ciudad helenística ya en el siglo III a. C. En el 218 a. C. el rey seléucida Antíoco III la sitió, la ciudad más fuerte del distrito en palabras de Polibio, y pronto se rindió. Alejandro Janeo la tomó tras un asedio de diez meses, a comienzos del siglo I a. C."
    - "Gadara era conocida por sus hombres de letras: Estrabón nombra entre sus naturales al epicúreo Filodemo, al poeta Meleagro y al satírico Menipo. Tras la conquista romana del 63 a. C., Pompeyo reconstruyó la ciudad, que los judíos habían destruido, para complacer a su liberto Demetrio de Gadara, y pasó a ser una de las ciudades de la Decápolis; Plinio la sitúa en el río Hieromix, el Yarmuk. En el 30 a. C. Augusto dio Gadara a Herodes el Grande. Sus ciudadanos acusaron más tarde a Herodes ante Augusto sin éxito, y tras la muerte de Herodes Augusto separó Gadara, Gaza e Hipos, como ciudades griegas, de su reino y las añadió a Siria. En la revuelta del 66 d. C. bandas judías atacaron Gadara, y los gadarenos mataron a los más osados de sus judíos."
    - "Mateo cuenta cómo Jesús, al cruzar el lago, encontró a dos hombres poseídos por demonios, que salían de los sepulcros; los demonios entraron en una piara de cerdos, y toda la piara se precipitó por un despeñadero al mar. Los manuscritos nombran el lugar de modo distinto. La versión King James y el texto sinodal leen gergesenos en Mateo y gadarenos en Marcos y Lucas, mientras que muchas ediciones modernas leen gadarenos en Mateo y gerasenos en Marcos y Lucas. Orígenes objetó que Gadara no tenía lago ni ribera escarpada junto a ella y prefirió Gergesa, una aldea de la orilla."
    - "Bajo Roma Gadara creció hasta ser una ciudad con dos teatros, calles con columnatas y baños. En el siglo IV Eusebio la describió como una ciudad al otro lado del Jordán, frente a Escitópolis y Tiberias, con baños termales al pie de sus colinas, y Eunapio llamó a los baños templados de Gadara los segundos tras los de Bayas, en Italia. En el siglo V la emperatriz Eudocia elogió los baños de Hammat Gader en un poema inscrito allí."
  pt:
    - "Gadara, a atual Umm Qais, no extremo norte da Jordânia, ficava numa crista acima da garganta do Yarmuk, cerca de 10 km a sudeste do Mar da Galileia, com ampla vista sobre o lago e Golã. As fontes quentes de Hammat Gader, no vale abaixo, ficavam em seu território. Era uma cidade helenística já no século III a.C. Em 218 a.C., o rei selêucida Antíoco III a sitiou, a mais forte do distrito nas palavras de Políbio, e ela logo se rendeu. Alexandre Janeu a tomou depois de um cerco de dez meses, no início do século I a.C."
    - "Gadara era conhecida por seus homens de letras: Estrabão nomeia entre seus naturais Filodemo, o epicurista, o poeta Meleagro e Menipo, o satirista. Depois da conquista romana de 63 a.C., Pompeu reconstruiu a cidade, que os judeus haviam destruído, para agradar seu liberto Demétrio de Gadara, e ela se tornou uma das cidades da Decápolis; Plínio a situa no rio Hieromix, o Yarmuk. Em 30 a.C., Augusto deu Gadara a Herodes, o Grande. Seus cidadãos acusaram depois Herodes diante de Augusto, em vão, e após a morte de Herodes Augusto separou de seu reino Gadara, Gaza e Hipos, como cidades gregas, e as acrescentou à Síria. Na revolta de 66 d.C., bandos judeus atacaram Gadara, e os gadarenos mataram os mais audazes de seus judeus."
    - "Mateus conta como Jesus, ao atravessar o lago, encontrou dois homens possessos de demônios, que saíam dos túmulos; os demônios entraram numa manada de porcos, e toda a manada se precipitou por um declive íngreme no mar. Os manuscritos nomeiam o lugar de modo diferente. A KJV e o texto sinodal leem gergesenos em Mateus e gadarenos em Marcos e Lucas, enquanto muitas edições modernas leem gadarenos em Mateus e gerasenos em Marcos e Lucas. Orígenes objetou que Gadara não tinha lago nem barranco ao lado e preferiu Gergesa, uma aldeia na margem."
    - "Sob Roma, Gadara cresceu até ser uma cidade com dois teatros, ruas colunadas e termas. No século IV, Eusébio a descreveu como uma cidade além do Jordão, defronte de Citópolis e Tiberíades, com banhos quentes ao pé de suas colinas, e Êunapio chamou os banhos mornos de Gadara os segundos depois dos de Baias, na Itália. No século V, a imperatriz Eudócia louvou os banhos de Hammat Gader num poema ali inscrito."
  de:
    - "Gadara, das heutige Umm Qais im äußersten Norden Jordaniens, stand auf einem Höhenrücken über der Schlucht des Jarmuk, etwa 10 km südöstlich des Sees Genezareth, mit weitem Blick über den See und die Golanhöhen. Die heißen Quellen von Hammat Gader im Tal darunter lagen auf seinem Gebiet. Es war im 3. Jahrhundert v. Chr. eine hellenistische Stadt. Im Jahr 218 v. Chr. belagerte der seleukidische König Antiochos III. sie, in Polybios’ Worten die stärkste Stadt der Gegend, und sie ergab sich bald. Alexander Jannäus nahm sie nach einer Belagerung von zehn Monaten Anfang des 1. Jahrhunderts v. Chr."
    - "Gadara war für seine Männer der Feder bekannt: Strabon nennt unter seinen Söhnen Philodemos den Epikureer, den Dichter Meleager und den Satiriker Menippos. Nach der römischen Eroberung von 63 v. Chr. baute Pompeius die Stadt, die die Juden zerstört hatten, seinem Freigelassenen Demetrius von Gadara zuliebe wieder auf, und sie wurde eine der Städte der Dekapolis; Plinius setzt sie an den Fluss Hieromyces, den Jarmuk. Im Jahr 30 v. Chr. gab Augustus Gadara Herodes dem Großen. Seine Bürger verklagten Herodes später vergeblich vor Augustus, und nach Herodes’ Tod trennte Augustus Gadara, Gaza und Hippos als griechische Städte von seinem Königreich und fügte sie Syrien hinzu. Im Aufstand von 66 n. Chr. griffen jüdische Banden Gadara an, und die Gadarener töteten die Kühnsten ihrer Juden."
    - "Matthäus erzählt, wie Jesus bei der Überfahrt über den See zwei besessenen Männern begegnete, die aus den Gräbern kamen; die Teufel fuhren in eine Schweineherde, und die ganze Herde stürzte sich einen Abhang hinab ins Meer. Die Handschriften nennen den Ort verschieden. Die King-James-Bibel und der synodale Text lesen bei Matthäus Gergesener und bei Markus und Lukas Gadarener, während viele moderne Ausgaben bei Matthäus Gadarener und bei Markus und Lukas Gerasener lesen. Origenes wandte ein, Gadara habe keinen See und kein steiles Ufer bei sich, und zog Gergesa vor, ein Dorf am Ufer."
    - "Unter Rom wuchs Gadara zu einer Stadt mit zwei Theatern, Säulenstraßen und Bädern heran. Im 4. Jahrhundert beschrieb Eusebius sie als Stadt jenseits des Jordan, gegenüber von Skythopolis und Tiberias, mit heißen Bädern am Fuß ihrer Hügel, und Eunapios nannte die warmen Bäder von Gadara gleich nach denen von Baiae in Italien. Im 5. Jahrhundert lobte die Kaiserin Eudokia die Bäder von Hammat Gader in einem dort eingemeißelten Gedicht."
  fr:
    - "Gadara, aujourd’hui Umm Qais, dans l’extrême nord de la Jordanie, se dressait sur une crête au-dessus de la gorge du Yarmouk, à environ 10 km au sud-est de la Mer de Galilée, avec une vaste vue sur le lac et le Golan. Les sources chaudes de Hammat Gader, dans la vallée en contrebas, se trouvaient sur son territoire. C’était une ville hellénistique dès le IIIe siècle av. J.-C. En 218 av. J.-C., le roi séleucide Antiochus III l’assiégea, la plus forte ville du district selon Polybe, et elle se rendit bientôt. Alexandre Jannée la prit après un siège de dix mois, au début du Ier siècle av. J.-C."
    - "Gadara était réputée pour ses hommes de lettres : Strabon nomme parmi ses natifs Philodème l’épicurien, le poète Méléagre et Ménippe le satiriste. Après la conquête romaine de 63 av. J.-C., Pompée rebâtit la ville, que les Juifs avaient détruite, pour complaire à son affranchi Démétrius de Gadara, et elle devint l’une des villes de la Décapole ; Pline la place sur le fleuve Hiéromix, le Yarmouk. En 30 av. J.-C., Auguste donna Gadara à Hérode le Grand. Ses citoyens accusèrent plus tard Hérode devant Auguste, en vain, et après la mort d’Hérode Auguste détacha Gadara, Gaza et Hippos, villes grecques, de son royaume et les ajouta à la Syrie. Lors de la révolte de 66 apr. J.-C., des bandes juives attaquèrent Gadara, et les Gadaréniens tuèrent les plus hardis de leurs Juifs."
    - "Matthieu raconte que Jésus, traversant le lac, rencontra deux hommes possédés de démons, sortis des tombeaux ; les démons entrèrent dans un troupeau de porcs, et tout le troupeau se précipita du haut d’un escarpement dans la mer. Les manuscrits nomment le lieu différemment. La version du roi Jacques et le texte synodal lisent Gergéséniens chez Matthieu et Gadaréniens chez Marc et Luc, tandis que de nombreuses éditions modernes lisent Gadaréniens chez Matthieu et Géraséniens chez Marc et Luc. Origène objectait que Gadara n’avait ni lac ni rive escarpée à proximité et préférait Gergesa, village sur le rivage."
    - "Sous Rome, Gadara devint une ville dotée de deux théâtres, de rues à colonnades et de bains. Au IVe siècle, Eusèbe la décrivait comme une ville au-delà du Jourdain, en face de Scythopolis et de Tibériade, avec des bains chauds au pied de ses collines, et Eunape disait les bains chauds de Gadara seconds seulement à ceux de Baïes en Italie. Au Ve siècle, l’impératrice Eudocie loua les bains de Hammat Gader dans un poème qui y fut gravé."
  it:
    - "Gadara, l’odierna Umm Qais all’estremo nord della Giordania, sorgeva su un crinale sopra la gola dello Yarmuk, a circa 10 km a sud-est del Lago di Tiberiade, con ampia vista sul lago e sul Golan. Le sorgenti calde di Hammat Gader nella valle sottostante si trovavano nel suo territorio. Era una città ellenistica nel III secolo a.C. Nel 218 a.C. il re seleucide Antioco III la assediò, la più forte città del distretto secondo Polibio, ed essa si arrese presto. Alessandro Ianneo la prese dopo un assedio di dieci mesi, all’inizio del I secolo a.C."
    - "Gadara era nota per i suoi letterati: Strabone nomina fra i suoi nativi Filodemo l’Epicureo, il poeta Meleagro e il satirico Menippo. Dopo la conquista romana del 63 a.C. Pompeo ricostruì la città, che gli Ebrei avevano distrutto, per compiacere il suo liberto Demetrio di Gadara, ed essa divenne una delle città della Decapoli; Plinio la pone sul fiume Hieromix, lo Yarmuk. Nel 30 a.C. Augusto diede Gadara a Erode il Grande. I suoi cittadini accusarono poi Erode davanti ad Augusto invano, e dopo la morte di Erode Augusto separò Gadara, Gaza e Ippo come città greche dal suo regno e le aggiunse alla Siria. Nella rivolta del 66 d.C. bande ebraiche attaccarono Gadara, e i Gadareni uccisero i più audaci dei loro Ebrei."
    - "Matteo racconta come Gesù, attraversando il lago, incontrò due uomini posseduti da demoni, usciti dai sepolcri; i demoni entrarono in un branco di porci, e tutto il branco corse giù per un precipizio nel mare. I manoscritti nominano il luogo in modo diverso. La King James Version e il testo sinodale leggono Gergeseni in Matteo e Gadareni in Marco e Luca, mentre molte edizioni moderne leggono Gadareni in Matteo e Geraseni in Marco e Luca. Origene obiettò che Gadara non aveva presso di sé né lago né sponda scoscesa e preferì Gergesa, un villaggio sulla riva."
    - "Sotto Roma Gadara divenne una città con due teatri, strade colonnate e terme. Nel IV secolo Eusebio la descrisse come una città oltre il Giordano, di fronte a Scitopoli e Tiberiade, con bagni caldi ai piedi delle sue colline, ed Eunapio disse che i bagni caldi di Gadara erano secondi solo a quelli di Baia in Italia. Nel V secolo l’imperatrice Eudocia lodò i bagni di Hammat Gader in un poema ivi inciso."
  pl:
    - "Gadara, dzisiejszy Umm Kajs na dalekiej północy Jordanii, stała na grzbiecie nad wąwozem Jarmuku, około 10 km na południowy wschód od Jeziora Galilejskiego, z szerokim widokiem na jezioro i Golan. Gorące źródła Chammat Gader w dolinie poniżej leżały na jej terytorium. Było to miasto hellenistyczne już w III w. p.n.e. W 218 r. p.n.e. seleucydzki król Antioch III oblegał je, najsilniejsze miasto okręgu według słów Polibiusza, i wkrótce się poddało. Aleksander Janneusz zdobył je po dziesięciomiesięcznym oblężeniu na początku I w. p.n.e."
    - "Gadara słynęła z ludzi pióra: Strabon wymienia wśród jej rodaków epikurejczyka Filodemosa, poetę Meleagra i satyryka Menipposa. Po rzymskim podboju w 63 r. p.n.e. Pompejusz odbudował miasto, które Żydzi zburzyli, by sprawić przyjemność swemu wyzwoleńcowi Demetriuszowi z Gadary, i stało się jednym z miast Dekapolu; Pliniusz umieszcza je nad rzeką Hieromiks, Jarmukiem. W 30 r. p.n.e. August oddał Gadarę Herodowi Wielkiemu. Jej obywatele oskarżyli później Heroda przed Augustem na próżno, a po śmierci Heroda August wyłączył Gadarę, Gazę i Hippos jako miasta greckie z jego królestwa i dołączył do Syrii. W powstaniu 66 r. n.e. żydowskie bandy napadły na Gadarę, a Gadareńczycy zabili najśmielszych swych Żydów."
    - "Mateusz opowiada, jak Jezus, przeprawiając się przez jezioro, spotkał dwóch opętanych przez demony, którzy wyszli z grobów; demony weszły w stado świń i całe stado zbiegło po urwisku do morza. Rękopisy nazywają miejsce różnie. Biblia Króla Jakuba i tekst synodalny mają Gergezeńczyków u Mateusza i Gadareńczyków u Marka i Łukasza, podczas gdy wiele nowoczesnych wydań ma Gadareńczyków u Mateusza i Gerazeńczyków u Marka i Łukasza. Orygenes zarzucał, że Gadara nie ma przy sobie jeziora ani stromego brzegu, i wolał Gergesę, wieś na brzegu."
    - "Pod Rzymem Gadara rozrosła się w miasto z dwoma teatrami, ulicami kolumnowymi i łaźniami. W IV w. Euzebiusz opisał ją jako miasto za Jordanem, naprzeciw Scytopolis i Tyberiady, z gorącymi łaźniami u podnóża jej wzgórz, a Eunapiusz nazywał ciepłe łaźnie Gadary ustępującymi tylko łaźniom w Baje w Italii. W V w. cesarzowa Eudokia wychwalała łaźnie Chammat Gader w wierszu wyrytym tamże."
  nl:
    - "Gadara, het huidige Umm Qais in het uiterste noorden van Jordanië, stond op een bergrug boven de kloof van de Jarmoek, zo'n 10 km ten zuidoosten van het Meer van Galilea, met een wijds uitzicht over het meer en de Golan. De warme bronnen van Hammat Gader in het dal eronder lagen op zijn grondgebied. Het was in de derde eeuw v.Chr. een hellenistische stad. In 218 v.Chr. belegerde de Seleucidische koning Antiochus III haar, in Polybius' woorden de sterkste stad van het district, en zij gaf zich snel over. Alexander Jannaeus nam haar na een beleg van tien maanden, vroeg in de eerste eeuw v.Chr."
    - "Gadara stond bekend om zijn letterkundigen: Strabo noemt onder zijn inwoners Philodemus de epicurist, de dichter Meleagros en de satiricus Menippus. Na de Romeinse verovering van 63 v.Chr. herbouwde Pompeius de stad, die de Joden hadden verwoest, om zijn vrijgelatene Demetrius van Gadara te behagen, en zij werd een van de steden van de Dekapolis; Plinius plaatst haar aan de rivier Hieromix, de Jarmoek. In 30 v.Chr. gaf Augustus Gadara aan Herodes de Grote. Haar burgers beschuldigden Herodes later tevergeefs bij Augustus, en na Herodes' dood scheidde Augustus Gadara, Gaza en Hippos als Griekse steden van zijn koninkrijk en voegde ze bij Syrië. In de opstand van 66 n.Chr. vielen Joodse benden Gadara aan, en de Gadarenen doodden de stoutste van hun Joden."
    - "Mattheüs vertelt hoe Jezus bij het oversteken van het meer twee door duivels bezetenen ontmoette, die uit de graven kwamen; de duivels voeren in een kudde zwijnen, en de hele kudde stormde van een steile helling in de zee. De handschriften noemen de plaats verschillend. De KJV en de Synodale tekst lezen Gergesenen bij Mattheüs en Gadarenen bij Marcus en Lukas, terwijl vele moderne uitgaven Gadarenen bij Mattheüs en Geraseners bij Marcus en Lukas lezen. Origenes wierp tegen dat Gadara geen meer of steile oever bij zich had en gaf de voorkeur aan Gergesa, een dorp aan de oever."
    - "Onder Rome groeide Gadara uit tot een stad met twee theaters, zuilenstraten en baden. In de vierde eeuw beschreef Eusebius haar als een stad voorbij de Jordaan, tegenover Scythopolis en Tiberias, met warme baden aan de voet van haar heuvels, en Eunapius noemde de warme baden van Gadara de tweede na die van Baiae in Italië. In de vijfde eeuw prees keizerin Eudocia de baden van Hammat Gader in een daar ingekerfd gedicht."
  cs:
    - "Gadara, dnešní Umm Qais na dalekém severu Jordánska, stála na hřbetu nad soutěskou Jarmúku, asi 10 km jihovýchodně od Galilejského jezera, s širokým výhledem na jezero i Golán. V jejím území ležely horké prameny Hammat Gader v údolí pod ní. Byla helénistickým městem již ve 3. století př. n. l. Roku 218 př. n. l. ji obléhal seleukovský král Antiochos III., nejsilnější město okresu podle Polybia, a brzy se vzdala. Alexandr Jannaios ji dobyl po desetiměsíčním obléhání na počátku 1. století př. n. l."
    - "Gadara byla známa svými literáty: Strabón jmenuje mezi jejími rodáky Filodéma epikurejce, básníka Meleagra a satirika Menippa. Po římském dobytí roku 63 př. n. l. Pompeius přestavěl město, které Židé zničili, aby potěšil svého propuštěnce Démétria z Gadary, a stalo se jedním z měst Dekapolis; Plinius je klade na řeku Hieromax, Jarmúk. Roku 30 př. n. l. dal Augustus Gadaru Herodovi Velikému. Její občané později žalovali Heroda před Augustem marně a po Herodově smrti Augustus Gadaru, Gazu a Hippos jako řecká města od jeho království oddělil a připojil k Sýrii. Při povstání roku 66 n. l. napadly Gadaru židovské oddíly a Gadarští zabili nejodvážnější z jejich Židů."
    - "Matouš vypráví, jak Ježíš, přeplouvaje jezero, potkal dva muže posedlé démony, kteří vyšli z hrobů; démoni vešli do stáda vepřů a celé stádo se řítilo po příkrém svahu do moře. Rukopisy jmenují místo různě. Bible krále Jakuba a synodální text čtou u Matouše Gergesenské a u Marka a Lukáše Gadarenské, zatímco mnohá moderní vydání čtou u Matouše Gadarenské a u Marka a Lukáše Gerasenské. Órigenés namítal, že Gadara u sebe nemá jezero ani příkrý břeh, a dával přednost Gergese, vesnici na břehu."
    - "Za Říma Gadara vyrostla v město se dvěma divadly, sloupovými ulicemi a lázněmi. Ve 4. století ji Eusebios popsal jako město za Jordánem, naproti Skythopoli a Tiberiadě, s horkými lázněmi na úpatí jejích pahorků, a Eunapios nazval teplé lázně Gadary druhými hned po lázních v Baiae v Itálii. V 5. století velebila císařovna Eudokia lázně Hammat Gader v básni tam vytesané."
  sv:
    - "Gadara, i dag Umm Qais i yttersta norra Jordanien, låg på en ås ovanför Jarmuks klyfta, omkring 10 km sydost om Galileiska sjön, med vid utsikt över sjön och Golan. De varma källorna i Hammat Gader i dalen nedanför låg på dess område. Det var en hellenistisk stad redan på 200-talet f.Kr. År 218 f.Kr. belägrade den seleukidiske kungen Antiochos III den, enligt Polybios distriktets starkaste stad, och den gav sig snart. Alexander Jannaios intog den efter en belägring på tio månader, i början av första århundradet f.Kr."
    - "Gadara var känt för sina lärda män: Strabon nämner bland dess söner epikuréen Filodemos, skalden Meleagros och satirikern Menippos. Efter den romerska erövringen år 63 f.Kr. återuppbyggde Pompeius staden, som judarna hade förstört, för att behaga sin frigivne Demetrios från Gadara, och den blev en av städerna i Dekapolis; Plinius förlägger den till floden Hieromix, Jarmuk. År 30 f.Kr. gav Augustus Gadara åt Herodes den store. Stadens invånare anklagade senare förgäves Herodes inför Augustus, och efter Herodes död skilde Augustus Gadara, Gaza och Hippos som grekiska städer från hans rike och lade dem under Syrien. Vid upproret år 66 e.Kr. anföll judiska band Gadara, och gadarenerna dödade de djärvaste av sina judar."
    - "Matteus berättar hur Jesus på väg över sjön möttes av två besatta, som kom ut från gravarna; de onda andarna for in i en svinhjord, och hela hjorden störtade utför en brant ned i sjön. Handskrifterna anger platsen olika. King James-bibeln och den synodala texten har gergesener hos Matteus och gadarener hos Markus och Lukas, medan många moderna utgåvor har gadarener hos Matteus och gerasener hos Markus och Lukas. Origenes invände att Gadara inte hade någon sjö eller brant strand intill sig och föredrog Gergesa, en by vid stranden."
    - "Under romarna växte Gadara till en stad med två teatrar, kolonnadgator och bad. På 300-talet beskrev Eusebios den som en stad bortom Jordan, mitt emot Skytopolis och Tiberias, med varma bad vid foten av dess höjder, och Eunapios kallade Gadaras varma bad näst efter Baiaes i Italien. På 400-talet prisade kejsarinnan Eudokia baden i Hammat Gader i en dikt som ristades där."
  nb:
    - "Gadara, dagens Umm Qais i det ytterste nord av Jordan, lå på en rygg over Yarmuk-juvet, omtrent 10 km sørøst for Galileasjøen, med vid utsikt over innsjøen og Golan. De varme kildene i Hammat Gader i dalen nedenfor lå på dens område. Det var en hellenistisk by allerede på 200-tallet f.Kr. I 218 f.Kr. beleiret den seleukidiske kongen Antiokos 3. den, som med Polybios' ord var distriktets sterkeste by, og den overga seg snart. Aleksander Jannaios inntok den etter en beleiring på ti måneder, tidlig på det første århundre f.Kr."
    - "Gadara var kjent for sine lærde menn: Strabon nevner blant dens sønner epikureeren Filodemos, dikteren Meleagros og satirikeren Menippos. Etter den romerske erobringen i 63 f.Kr. gjenreiste Pompeius byen, som jødene hadde ødelagt, for å gjøre sin frigitte slave Demetrios fra Gadara til lags, og den ble en av byene i Dekapolis; Plinius plasserer den ved elven Hieromix, Yarmuk. I 30 f.Kr. ga Augustus Gadara til Herodes den store. Innbyggerne anklaget senere Herodes for Augustus, forgjeves, og etter Herodes' død skilte Augustus Gadara, Gasa og Hippos som greske byer fra hans rike og la dem til Syria. Under opprøret i 66 e.Kr. angrep jødiske bander Gadara, og gadarenerne drepte de dristigste av sine jøder."
    - "Matteus forteller hvordan Jesus, på vei over innsjøen, møtte to besatte som kom ut av gravene; de onde åndene fór i en svinehjord, og hele hjorden styrtet ned en bratt skråning og ut i sjøen. Håndskriftene nevner stedet ulikt. KJV og den synodale teksten har gergesenerne hos Matteus og gadarenerne hos Markus og Lukas, mens mange moderne utgaver har gadarenerne hos Matteus og gerasenerne hos Markus og Lukas. Origenes innvendte at Gadara ikke hadde noen innsjø eller bratt strand ved seg, og foretrakk Gergesa, en landsby ved bredden."
    - "Under Roma vokste Gadara til en by med to teatre, søylegater og bad. På 300-tallet beskrev Eusebius den som en by hinsides Jordan, rett overfor Skytopolis og Tiberias, med varme bad ved foten av åsene, og Eunapios kalte de varme badene i Gadara nest best etter dem i Baiae i Italia. På 400-tallet priste keiserinne Eudokia badene i Hammat Gader i et dikt som er innskrevet der."
  tl:
    - "Ang Gadara, ang Umm Qais ngayon sa dulong hilaga ng Jordan, ay nakatayo sa isang tagaytay sa ibabaw ng bangin ng Yarmuk, mga 10 km sa timog-silangan ng Dagat ng Galilea, na may malawak na tanaw sa lawa at sa Golan. Ang mga mainit na bukal ng Hammat Gader sa libis sa ibaba ay nasa teritoryo nito. Isa na itong bayang Helenistiko noong ika-3 siglo BK. Noong 218 BK ay kinubkob ito ng haring Seleucid na si Antiochus III, ang pinakamatibay na bayan ng distrito ayon kay Polybius, at agad itong sumuko. Sinakop ito ni Alejandro Janneo pagkatapos ng sampung buwang pagkubkob, sa simula ng ika-1 siglo BK."
    - "Kilala ang Gadara sa mga lalaking marurunong: pinangangalanan ni Strabo sa mga katutubo nito si Philodemus na Epicureo, ang makatang si Meleager at si Menippus na satirista. Pagkatapos ng pananakop ng Roma noong 63 BK, muling itinayo ni Pompey ang lungsod, na giniba ng mga Judio, upang bigyang-lugod ang pinalaya niyang alipin na si Demetrio ng Gadara, at naging isa ito sa Decapolis; inilalagay ito ni Plinio sa ilog Hieromix, ang Yarmuk. Noong 30 BK, ibinigay ito ni Augusto kay Herodes na Dakila. Isinumbong ng mga mamamayan nito si Herodes kay Augusto nang walang saysay, at pagkamatay ni Herodes, inihiwalay ni Augusto ang Gadara, Gaza at Hippos bilang lungsod Griyego sa kaharian niya at idinagdag sa Siria. Sa paghihimagsik noong 66 AD, sinalakay ng mga pangkat Judio ang Gadara, at pinatay ng mga Gadareno ang pinakamatapang sa kanilang mga Judio."
    - "Isinasalaysay ni Mateo kung paanong si Jesus, sa pagtawid sa lawa, ay sinalubong ng dalawang lalaking inaalihan ng mga demonyo, na lumabas sa mga libingan; pumasok ang mga demonyo sa isang kawan ng baboy, at ang buong kawan ay tumakbong pababa sa isang matarik na dako sa dagat. Magkakaiba ang pangalan ng lugar sa mga manuskrito. Ang KJV at ang tekstong Synodal ay may Gergeseno sa Mateo at Gadareno sa Marcos at Lucas, samantalang maraming makabagong edisyon ay may Gadareno sa Mateo at Geraseno sa Marcos at Lucas. Tumutol si Origen na ang Gadara ay walang lawa o matarik na pampang sa tabi nito at pinili ang Gergesa, isang nayon sa baybayin."
    - "Sa ilalim ng Roma ang Gadara ay lumago bilang isang lungsod na may dalawang teatro, mga kalyeng may kolonada at mga paliguan. Noong ika-4 na siglo inilarawan ito ni Eusebio bilang isang lungsod sa kabila ng Jordan, katapat ng Scythopolis at Tiberias, na may mga maiinit na paliguan sa paanan ng mga burol nito, at tinawag ni Eunapius na pangalawa lamang sa mga paliguan ng Baiae sa Italia ang mga maiinit na paliguan ng Gadara. Noong ika-5 siglo ay pinuri ng emperatris na si Eudocia ang mga paliguan ng Hammat Gader sa isang tulang nakaukit doon."
scripture:
