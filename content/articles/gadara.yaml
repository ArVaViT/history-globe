# Overview article (ADR 0007). Mainstream facts only; the Gadarenes/Gergesenes/Gerasenes readings of the Gospels are named without choosing between them.
id: gadara
place: afed46a # Gadara record at Umm Qais (lon/lat checked); carries Matt 8:28 (KJV "Gergesenes", Synodal "Гергесинская"); no Russian card name yet
