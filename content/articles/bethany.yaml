# Overview article (ADR 0007). Mainstream facts only; Bethany near Jerusalem, at al-Eizariya, not Bethany beyond Jordan.
id: bethany
place: a4f35bc
title:
  en: "Bethany"
  ru: "Вифания"
  uk: "Віфанія"
  es: "Betania"
  pt: "Betânia"
  de: "Bethanien"
  fr: "Béthanie"
  it: "Betania"
  pl: "Betania"
  nl: "Bethanië"
  cs: "Betanie"
  sv: "Betania"
