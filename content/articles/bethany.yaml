body:
  en:
    - "Bethany was a village on the eastern slope of the Mount of Olives; John puts it about fifteen furlongs, some 3 km, from the city. It is the town now called al-Eizariya, a name that comes from Lazarus. Little is known of the village before the Gospels. Some scholars have identified it with Ananiah, a town of Benjamin resettled after the exile, while others place Ananiah at Beit Hanina, north of Jerusalem."
    - "In the Gospels Bethany is the town of Lazarus and his sisters Mary and Martha. After Lazarus died, Jesus came when he had already lain in the grave four days, and raised him. Six days before the Passover he supped there, and Mary anointed his feet; Matthew and Mark tell of an anointing in the house of Simon the leper in Bethany. During his last week in Jerusalem Jesus lodged in Bethany, and he came to the city from Bethphage and Bethany at the Mount of Olives. After the resurrection, Luke says, he led the disciples out as far as to Bethany, blessed them and was parted from them."
    - "In the early fourth century Eusebius describes Bethany as a village two miles from Jerusalem, where the place of Lazarus was still shown; Jerome's Latin version of about 390 adds that a church had been built there. In the 380s the pilgrim Egeria calls it the Lazarium and tells how, on the Saturday before Palm Sunday, the people of Jerusalem went out to it, stopping at a church on the road where Mary had met the Lord, until the crowds filled the fields around. Jerome writes that Paula visited the tomb of Lazarus and the house of Mary and Martha."
    - "Franciscan excavations led by Sylvester Saller in 1949–1953 uncovered remains of the village and of successive churches beside the tomb. The first, a basilica of the late fourth century, was later destroyed and replaced by a larger church, and the cave venerated as the tomb of Lazarus has remained a place of pilgrimage. The Arabic name of the town keeps the memory of the Lazarium."
  ru:
    - "Вифания была селением на восточном склоне горы Елеонской; Иоанн говорит, что она была стадиях в пятнадцати, около 3 км, от города. Это городок, который ныне называется Эль-Эйзария, по имени Лазаря. О селении до евангельских времён известно мало. Некоторые учёные отождествляли его с Ананией, городом колена Вениаминова, заселённым вновь после плена, тогда как другие помещают Ананию в Бейт-Ханине к северу от Иерусалима."
    - "В Евангелиях Вифания — селение Лазаря и его сестёр Марии и Марфы. После смерти Лазаря Иисус пришёл, когда тот уже четыре дня был во гробе, и воскресил его. За шесть дней до Пасхи Ему приготовили там вечерю, и Мария помазала Ему ноги; Матфей и Марк рассказывают о помазании в доме Симона прокаженного в Вифании. В последнюю неделю в Иерусалиме Иисус ночевал в Вифании и шёл в город от Виффагии и Вифании, у горы Елеонской. После воскресения, по словам Луки, Он вывел учеников до Вифании, благословил их и стал отдаляться от них."
    - "В начале IV века Евсевий описывает Вифанию как селение в двух милях от Иерусалима, где ещё показывали место Лазаря; латинский перевод Иеронима около 390 г. добавляет, что там построена церковь. В 380-х годах паломница Эгерия называет это место Лазарием и рассказывает, как в субботу перед Вербным воскресеньем жители Иерусалима выходили туда, останавливаясь у церкви на дороге, там, где Мария встретила Господа, и как толпа заполняла все поля вокруг. Иероним пишет, что Павла посетила гроб Лазаря и дом Марии и Марфы."
    - "Францисканские раскопки Сильвестра Саллера в 1949–1953 гг. открыли остатки селения и нескольких сменявших друг друга церквей рядом с гробницей. Первая, базилика конца IV века, позже была разрушена, и на её месте построили более просторную церковь, а пещера, почитаемая как гроб Лазаря, осталась местом паломничества. Арабское имя городка хранит память о Лазарии."
  uk:
    - "Віфанія була селом на східному схилі Оливкової гори; Іван ставить її приблизно за п'ятнадцять стадіїв, близько 3 км, від міста. Це місто, нині зване ель-Азарія, назва якого походить від Лазаря. Про село до Євангелій відомо мало. Деякі вчені ототожнювали його з Ананією, містом Веніяміна, заселеним після вигнання, інші ж розміщують Ананію в Бейт-Ханіні на північ від Єрусалима."
    - "В Євангеліях Віфанія — місто Лазаря та його сестер Марії й Марфи. Після смерті Лазаря Ісус прийшов, коли той уже чотири дні лежав у гробі, і воскресив його. За шість днів до Пасхи він вечеряв там, і Марія намастила його ноги; Матвій і Марко розповідають про помазання в домі Симона прокаженого у Віфанії. Протягом останнього тижня в Єрусалимі Ісус ночував у Віфанії, а до міста приходив з Віфагії та Віфанії біля Оливкової гори. Після воскресіння, каже Лука, він вивів учнів аж до Віфанії, благословив їх і відійшов від них."
    - "На початку IV століття Євсевій описує Віфанію як село за дві милі від Єрусалима, де ще показували місце Лазаря; латинський переклад Єроніма близько 390 року додає, що там збудували церкву. У 380-х роках прочанка Егерія називає її Лазарієм і розповідає, як у суботу перед Вербною неділею жителі Єрусалима виходили до неї, зупиняючись біля церкви на дорозі, де Марія зустріла Господа, аж доки натовпи не заповнювали поля довкола. Єронім пише, що Павла відвідала гріб Лазаря і дім Марії та Марфи."
    - "Францисканські розкопки під керівництвом Сильвестра Саллера в 1949–1953 рр. виявили рештки села та послідовних церков біля гробниці. Перша, базиліка кінця IV століття, була пізніше зруйнована й замінена більшою церквою, а печера, яку шанують як гріб Лазаря, лишається місцем паломництва. Арабська назва міста зберігає пам'ять про Лазарій."
  es:
    - "Betania era una aldea en la ladera oriental del monte de los Olivos; Juan la pone a unos quince estadios, unos 3 km, de la ciudad. Es la población hoy llamada al-Eizariya, nombre que procede de Lázaro. Poco se sabe de la aldea antes de los Evangelios. Algunos estudiosos la han identificado con Ananías, una ciudad de Benjamín repoblada tras el exilio, mientras que otros sitúan Ananías en Beit Hanina, al norte de Jerusalén."
    - "En los Evangelios Betania es la ciudad de Lázaro y de sus hermanas María y Marta. Después de morir Lázaro, Jesús vino cuando ya llevaba cuatro días en el sepulcro, y lo resucitó. Seis días antes de la Pascua cenó allí, y María ungió sus pies; Mateo y Marcos cuentan una unción en casa de Simón el leproso en Betania. Durante su última semana en Jerusalén Jesús se alojó en Betania, y llegó a la ciudad desde Betfagé y Betania, en el monte de los Olivos. Después de la resurrección, dice Lucas, condujo a los discípulos hasta Betania, los bendijo y se separó de ellos."
    - "A principios del siglo IV Eusebio describe Betania como una aldea a dos millas de Jerusalén, donde aún se mostraba el lugar de Lázaro; la versión latina de Jerónimo, de hacia 390, añade que allí se había construido una iglesia. En los años 380 la peregrina Egeria la llama el Lazarión y cuenta cómo, el sábado antes del Domingo de Ramos, la gente de Jerusalén salía hacia ella, deteniéndose en una iglesia del camino donde María había salido al encuentro del Señor, hasta que las multitudes llenaban los campos de alrededor. Jerónimo escribe que Paula visitó el sepulcro de Lázaro y la casa de María y Marta."
    - "Las excavaciones franciscanas dirigidas por Sylvester Saller en 1949–1953 sacaron a la luz restos de la aldea y de sucesivas iglesias junto a la tumba. La primera, una basílica de finales del siglo IV, fue destruida más tarde y sustituida por una iglesia mayor, y la cueva venerada como tumba de Lázaro ha seguido siendo lugar de peregrinación. El nombre árabe de la ciudad guarda el recuerdo del Lazarión."
  pt:
    - "Betânia era uma aldeia na encosta oriental do monte das Oliveiras; João a põe a cerca de quinze estádios, uns 3 km, da cidade. É a cidade hoje chamada al-Eizariya, nome que vem de Lázaro. Pouco se sabe da aldeia antes dos Evangelhos. Alguns estudiosos a identificaram com Ananias, uma cidade de Benjamim repovoada depois do exílio, enquanto outros põem Ananias em Beit Hanina, ao norte de Jerusalém."
    - "Nos Evangelhos, Betânia é a cidade de Lázaro e de suas irmãs Maria e Marta. Depois que Lázaro morreu, Jesus veio quando ele já jazia no túmulo havia quatro dias, e o ressuscitou. Seis dias antes da Páscoa ceou ali, e Maria ungiu-lhe os pés; Mateus e Marcos contam de uma unção na casa de Simão, o leproso, em Betânia. Durante a última semana em Jerusalém, Jesus se hospedou em Betânia, e veio à cidade desde Betfagé e Betânia, no monte das Oliveiras. Depois da ressurreição, diz Lucas, levou os discípulos para fora até perto de Betânia, abençoou-os e foi separado deles."
    - "No início do século IV, Eusébio descreve Betânia como uma aldeia a duas milhas de Jerusalém, onde ainda se mostrava o lugar de Lázaro; a versão latina de Jerônimo, de cerca de 390, acrescenta que ali se construíra uma igreja. Nos anos 380, a peregrina Egéria a chama o Lazarium e conta como, no sábado antes do Domingo de Ramos, o povo de Jerusalém saía até lá, parando numa igreja na estrada onde Maria encontrara o Senhor, até que as multidões enchiam os campos em redor. Jerônimo escreve que Paula visitou o túmulo de Lázaro e a casa de Maria e Marta."
    - "Escavações franciscanas dirigidas por Sylvester Saller em 1949–1953 descobriram restos da aldeia e de sucessivas igrejas junto ao túmulo. A primeira, uma basílica do fim do século IV, foi depois destruída e substituída por uma igreja maior, e a caverna venerada como túmulo de Lázaro continua sendo lugar de peregrinação. O nome árabe da cidade guarda a memória do Lazarium."
  de:
    - "Bethanien war ein Dorf am Osthang des Ölbergs; Johannes setzt es etwa fünfzehn Stadien, rund 3 km, von der Stadt an. Es ist die Stadt, die heute al-Eizariya heißt, ein Name, der von Lazarus kommt. Vom Dorf vor den Evangelien ist wenig bekannt. Manche Gelehrte haben es mit Ananja gleichgesetzt, einer nach dem Exil wiederbesiedelten Stadt Benjamins, während andere Ananja in Beit Hanina nördlich von Jerusalem ansetzen."
    - "In den Evangelien ist Bethanien die Stadt von Lazarus und seinen Schwestern Maria und Marta. Nachdem Lazarus gestorben war, kam Jesus, als er schon vier Tage im Grab lag, und erweckte ihn. Sechs Tage vor dem Passa speiste er dort, und Maria salbte seine Füße; Matthäus und Markus erzählen von einer Salbung im Haus Simons des Aussätzigen in Bethanien. In seiner letzten Woche in Jerusalem übernachtete Jesus in Bethanien, und er kam von Betphage und Bethanien am Ölberg zur Stadt. Nach der Auferstehung, sagt Lukas, führte er die Jünger hinaus bis nach Bethanien, segnete sie und schied von ihnen."
    - "Im frühen 4. Jahrhundert beschreibt Eusebius Bethanien als Dorf zwei Meilen von Jerusalem, wo man noch die Stätte des Lazarus zeigte; Hieronymus' lateinische Fassung von etwa 390 fügt hinzu, dort sei eine Kirche gebaut worden. In den 380er Jahren nennt die Pilgerin Egeria es das Lazarium und erzählt, wie die Leute von Jerusalem am Samstag vor Palmsonntag dorthin hinauszogen und an einer Kirche an der Straße haltmachten, wo Maria dem Herrn begegnet war, bis die Menge die Felder ringsum füllte. Hieronymus schreibt, Paula habe das Grab des Lazarus und das Haus von Maria und Marta besucht."
    - "Franziskanische Grabungen unter Sylvester Saller 1949–1953 legten Reste des Dorfes und aufeinanderfolgender Kirchen neben dem Grab frei. Die erste, eine Basilika des späten 4. Jahrhunderts, wurde später zerstört und durch eine größere Kirche ersetzt, und die als Grab des Lazarus verehrte Höhle blieb ein Wallfahrtsort. Der arabische Name der Stadt bewahrt die Erinnerung an das Lazarium."
  fr:
    - "Béthanie était un village du versant oriental du mont des Oliviers ; Jean la place à environ quinze stades, quelque 3 km, de la ville. C’est la ville appelée aujourd’hui al-Eizariya, nom qui vient de Lazare. On sait peu de choses du village avant les Évangiles. Certains savants l’ont identifiée à Hanania, ville de Benjamin repeuplée après l’exil, tandis que d’autres placent Hanania à Beit Hanina, au nord de Jérusalem."
    - "Dans les Évangiles, Béthanie est la ville de Lazare et de ses sœurs Marie et Marthe. Après la mort de Lazare, Jésus vint alors qu’il gisait au tombeau depuis quatre jours, et le ressuscita. Six jours avant la Pâque, il y soupa, et Marie oignit ses pieds ; Matthieu et Marc racontent une onction dans la maison de Simon le lépreux à Béthanie. Durant sa dernière semaine à Jérusalem, Jésus logea à Béthanie, et il vint à la ville depuis Bethphagé et Béthanie, au mont des Oliviers. Après la résurrection, dit Luc, il conduisit les disciples jusqu’à Béthanie, les bénit et fut séparé d’eux."
    - "Au début du IVe siècle, Eusèbe décrit Béthanie comme un village à deux milles de Jérusalem, où l’on montrait encore le lieu de Lazare ; la version latine de Jérôme vers 390 ajoute qu’une église y avait été bâtie. Dans les années 380, la pèlerine Égérie l’appelle le Lazarium et raconte comment, le samedi avant le dimanche des Rameaux, le peuple de Jérusalem s’y rendait, s’arrêtant à une église sur la route où Marie avait rencontré le Seigneur, jusqu’à ce que les foules remplissent les champs alentour. Jérôme écrit que Paula visita le tombeau de Lazare et la maison de Marie et de Marthe."
    - "Des fouilles franciscaines dirigées par Sylvester Saller en 1949-1953 ont mis au jour des vestiges du village et d’églises successives à côté du tombeau. La première, basilique de la fin du IVe siècle, fut plus tard détruite et remplacée par une église plus grande, et la grotte vénérée comme le tombeau de Lazare est restée un lieu de pèlerinage. Le nom arabe de la ville garde le souvenir du Lazarium."
  it:
    - "Betania era un villaggio sul pendio orientale del Monte degli Ulivi; Giovanni lo pone a circa quindici stadi, circa 3 km, dalla città. È la città oggi chiamata al-Eizariya, nome che viene da Lazzaro. Poco si sa del villaggio prima dei Vangeli. Alcuni studiosi l’hanno identificata con Anania, una città di Beniamino ripopolata dopo l’esilio, mentre altri pongono Anania a Beit Hanina, a nord di Gerusalemme."
    - "Nei Vangeli Betania è la città di Lazzaro e delle sue sorelle Maria e Marta. Dopo la morte di Lazzaro, Gesù giunse quando egli era già da quattro giorni nel sepolcro, e lo risuscitò. Sei giorni prima della Pasqua vi cenò, e Maria unse i suoi piedi; Matteo e Marco raccontano di un’unzione in casa di Simone il lebbroso a Betania. Durante l’ultima settimana a Gerusalemme Gesù albergò a Betania, e venne alla città da Betfage e Betania presso il Monte degli Ulivi. Dopo la risurrezione, dice Luca, condusse i discepoli fuori fino presso Betania, li benedisse e si dipartì da loro."
    - "All’inizio del IV secolo Eusebio descrive Betania come un villaggio a due miglia da Gerusalemme, dove si mostrava ancora il luogo di Lazzaro; la versione latina di Girolamo del 390 circa aggiunge che vi era stata costruita una chiesa. Negli anni 380 la pellegrina Egeria la chiama il Lazzarium e racconta come, il sabato prima della domenica delle Palme, la gente di Gerusalemme vi andasse, fermandosi a una chiesa sulla strada dove Maria aveva incontrato il Signore, finché le folle riempivano i campi intorno. Girolamo scrive che Paola visitò la tomba di Lazzaro e la casa di Maria e Marta."
    - "Gli scavi francescani guidati da Sylvester Saller nel 1949–1953 hanno portato alla luce resti del villaggio e di chiese successive accanto alla tomba. La prima, una basilica della fine del IV secolo, fu poi distrutta e sostituita da una chiesa più grande, e la grotta venerata come tomba di Lazzaro è rimasta luogo di pellegrinaggio. Il nome arabo della città conserva il ricordo del Lazzarium."
  pl:
    - "Betania była wsią na wschodnim stoku Góry Oliwnej; Jan umieszcza ją w odległości około piętnastu stadiów, jakieś 3 km, od miasta. Jest to miejscowość zwana dziś al-Eizariya, nazwa pochodząca od Łazarza. Niewiele wiadomo o wsi przed Ewangeliami. Niektórzy uczeni utożsamiali ją z Ananiaszem, miastem Beniamina zasiedlonym ponownie po wygnaniu, inni umieszczają Ananiasza w Beit Hanina, na północ od Jerozolimy."
    - "W Ewangeliach Betania jest miastem Łazarza i jego sióstr Marii i Marty. Po śmierci Łazarza Jezus przyszedł, gdy leżał już w grobie cztery dni, i wskrzesił go. Sześć dni przed Paschą ucztował tam, a Maria namaściła mu stopy; Mateusz i Marek opowiadają o namaszczeniu w domu Szymona Trędowatego w Betanii. W ostatnim tygodniu w Jerozolimie Jezus nocował w Betanii, a do miasta przychodził od Betfage i Betanii przy Górze Oliwnej. Po zmartwychwstaniu, mówi Łukasz, wyprowadził uczniów aż do Betanii, pobłogosławił ich i oddalił się od nich."
    - "Na początku IV wieku Euzebiusz opisuje Betanię jako wieś dwie mile od Jerozolimy, gdzie wciąż pokazywano miejsce Łazarza; łacińska wersja Hieronima z około 390 roku dodaje, że wzniesiono tam kościół. W latach 380. pątniczka Egeria nazywa ją Lazarium i opowiada, jak w sobotę przed Niedzielą Palmową mieszkańcy Jerozolimy wychodzili do niej, zatrzymując się przy kościele przy drodze, gdzie Maria spotkała Pana, aż tłumy wypełniły okoliczne pola. Hieronim pisze, że Paula odwiedziła grób Łazarza i dom Marii i Marty."
    - "Franciszkańskie wykopaliska pod kierunkiem Sylwestra Sallera w latach 1949–1953 odsłoniły pozostałości wsi i kolejnych kościołów obok grobu. Pierwszy, bazylika z końca IV wieku, został później zniszczony i zastąpiony większym kościołem, a jaskinia czczona jako grób Łazarza pozostaje miejscem pielgrzymek. Arabska nazwa miasta zachowuje pamięć o Lazarium."
  nl:
    - "Bethanië was een dorp op de oosthelling van de Olijfberg; Johannes plaatst het ongeveer vijftien stadiën, zo’n 3 km, van de stad. Het is de plaats die nu al-Eizariya heet, een naam die van Lazarus komt. Van het dorp vóór de evangeliën is weinig bekend. Sommige geleerden hebben het geïdentificeerd met Ananja, een stad van Benjamin die na de ballingschap werd herbewoond, terwijl anderen Ananja bij Beit Hanina ten noorden van Jeruzalem plaatsen."
    - "In de evangeliën is Bethanië de stad van Lazarus en zijn zusters Maria en Marta. Nadat Lazarus was gestorven, kwam Jezus toen hij al vier dagen in het graf lag, en wekte hem op. Zes dagen vóór het Pascha at hij er, en Maria zalfde zijn voeten; Mattheüs en Marcus vertellen van een zalving in het huis van Simon de melaatse te Bethanië. Tijdens zijn laatste week in Jeruzalem logeerde Jezus in Bethanië, en hij kwam naar de stad vanuit Bethfage en Bethanië bij de Olijfberg. Na de opstanding, zegt Lukas, leidde hij de discipelen naar buiten tot Bethanië, zegende hen en werd van hen weggenomen."
    - "Begin vierde eeuw beschrijft Eusebius Bethanië als een dorp twee mijl van Jeruzalem, waar de plaats van Lazarus nog werd getoond; Hieronymus’ Latijnse bewerking van omstreeks 390 voegt toe dat er een kerk was gebouwd. In de jaren 380 noemt de pelgrim Egeria het het Lazarium en vertelt hoe de mensen van Jeruzalem op de zaterdag vóór Palmzondag erheen gingen, stilhoudend bij een kerk aan de weg waar Maria de Heer had ontmoet, tot de menigten de velden eromheen vulden. Hieronymus schrijft dat Paula het graf van Lazarus en het huis van Maria en Marta bezocht."
    - "Franciscaanse opgravingen onder leiding van Sylvester Saller in 1949–1953 legden resten van het dorp en van opeenvolgende kerken naast het graf bloot. De eerste, een basiliek uit de late vierde eeuw, werd later verwoest en vervangen door een grotere kerk, en de grot die als graf van Lazarus wordt vereerd, is een bedevaartsplaats gebleven. De Arabische naam van de stad bewaart de herinnering aan het Lazarium."
  cs:
    - "Betanie byla vesnice na východním svahu Olivové hory; Jan ji klade asi patnáct stadií, zhruba 3 km, od města. Je to město dnes zvané al-Eizariya, jméno pocházející od Lazara. O vesnici před evangelii je málo známo. Někteří badatelé ji ztotožnili s Ananjášem, městem Benjamínovým znovu osídleným po vyhnanství, zatímco jiní kladou Ananjáše do Beit Hanina, severně od Jeruzaléma."
    - "V evangeliích je Betanie městem Lazara a jeho sester Marie a Marty. Po Lazarově smrti přišel Ježíš, když už ležel v hrobě čtyři dny, a vzkřísil ho. Šest dní před Pesachem tam večeřel a Marie pomazala jeho nohy; Matouš a Marek vyprávějí o pomazání v domě Šimona malomocného v Betanii. Během svého posledního týdne v Jeruzalémě Ježíš bydlel v Betanii a do města přicházel z Betfage a Betanie u Olivové hory. Po vzkříšení, praví Lukáš, vyvedl učedníky až k Betanii, požehnal jim a byl od nich vzat."
    - "Na počátku 4. století Eusebios popisuje Betanii jako vesnici dvě míle od Jeruzaléma, kde se stále ukazovalo Lazarovo místo; Jeronýmova latinská verze z asi roku 390 dodává, že tam byl postaven kostel. V 80. letech 4. století poutnice Egerie nazývá místo Lazarium a vypráví, jak v sobotu před Květnou nedělí tam jeruzalémský lid vycházel a zastavoval se u kostela na cestě, kde Marie potkala Pána, dokud zástupy nezaplnily okolní pole. Jeroným píše, že Paula navštívila Lazarův hrob a dům Marie a Marty."
    - "Františkánské vykopávky vedené Sylvesterem Sallerem v letech 1949–1953 odkryly pozůstatky vesnice a postupných kostelů u hrobu. První, bazilika z konce 4. století, byla později zničena a nahrazena větším kostelem a jeskyně uctívaná jako Lazarův hrob zůstala poutním místem. Arabské jméno města uchovává památku Lazaria."
  sv:
    - "Betania var en by på Olivbergets östsluttning; Johannes anger att den låg omkring femton stadier, ungefär 3 km, från staden. Det är den ort som i dag heter al-Eizariya, ett namn som kommer av Lasaros. Om byn före evangelierna vet man litet. Somliga forskare har identifierat den med Ananja, en benjaminitisk stad som befolkades på nytt efter exilen, medan andra förlägger Ananja till Beit Hanina norr om Jerusalem."
    - "I evangelierna är Betania staden där Lasaros och hans systrar Maria och Marta bodde. Sedan Lasaros dött kom Jesus när han redan legat fyra dagar i graven och uppväckte honom. Sex dagar före påsken åt han måltid där, och Maria smorde hans fötter; Matteus och Markus berättar om en smörjelse i Simon den spetälskes hus i Betania. Under sin sista vecka i Jerusalem övernattade Jesus i Betania, och han kom till staden från Betfage och Betania vid Olivberget. Efter uppståndelsen, säger Lukas, förde han lärjungarna ut ända till Betania, välsignade dem och skildes från dem."
    - "I början av 300-talet beskriver Eusebios Betania som en by två romerska mil från Jerusalem, där Lasaros plats ännu visades; Hieronymus latinska version från omkring 390 tillägger att en kyrka hade byggts där. På 380-talet kallar pilgrimen Egeria platsen Lazarium och berättar hur Jerusalems folk på lördagen före palmsöndagen gick ut dit och stannade vid en kyrka vid vägen där Maria hade mött Herren, tills folkskarorna fyllde fälten runt omkring. Hieronymus skriver att Paula besökte Lasaros grav och Marias och Martas hus."
    - "Franciskanska utgrävningar under Sylvester Saller 1949–1953 blottade lämningar av byn och av en rad kyrkor intill graven. Den första, en basilika från slutet av 300-talet, förstördes senare och ersattes av en större kyrka, och grottan som vördas som Lasaros grav har förblivit en pilgrimsplats. Ortens arabiska namn bevarar minnet av Lazarium."
  nb:
    - "Betania var en landsby på østskråningen av Oljeberget; Johannes plasserer den omtrent femten stadier, ca. 3 km, fra byen. Det er byen som nå kalles al-Eizariya, et navn som kommer fra Lasarus. Lite er kjent om landsbyen før evangeliene. Noen forskere har identifisert den med Ananja, en by i Benjamin som ble gjenbosatt etter eksilet, mens andre plasserer Ananja ved Beit Hanina, nord for Jerusalem."
    - "I evangeliene er Betania byen til Lasarus og hans søstre Maria og Marta. Etter at Lasarus var død, kom Jesus da han allerede hadde ligget fire dager i graven, og reiste ham opp. Seks dager før påske spiste han der, og Maria salvet hans føtter; Matteus og Markus forteller om en salving i Simon den spedalskes hus i Betania. I sin siste uke i Jerusalem overnattet Jesus i Betania, og han kom til byen fra Betfage og Betania ved Oljeberget. Etter oppstandelsen førte han disiplene, sier Lukas, ut mot Betania, velsignet dem og skiltes fra dem."
    - "Tidlig på 300-tallet beskriver Eusebius Betania som en landsby to romerske mil fra Jerusalem, der Lasarus' sted fremdeles ble vist; Hieronymus' latinske versjon fra omkring 390 legger til at en kirke var bygd der. På 380-tallet kaller pilegrimen Egeria den Lazarium og forteller hvordan folket i Jerusalem på lørdagen før palmesøndag gikk ut dit og stanset ved en kirke på veien der Maria hadde møtt Herren, til folkemengdene fylte markene omkring. Hieronymus skriver at Paula besøkte Lasarus' grav og Marias og Martas hus."
    - "Franciskanske utgravninger ledet av Sylvester Saller i 1949–1953 avdekket rester av landsbyen og av fortløpende kirker ved graven. Den første, en basilika fra slutten av 300-tallet, ble senere ødelagt og erstattet av en større kirke, og hulen som æres som Lasarus' grav, har vedvart som et pilegrimsmål. Byens arabiske navn bevarer minnet om Lazarium."
