# Overview article (ADR 0007). Mainstream facts only; the camp lay between Socoh and Azekah, and the app's three candidates are given without choosing.
id: ephes-dammim
place: aafd7c4
title:
  en: "Ephes-dammim"
  ru: "Ефес-Даммим"
  uk: "Ефес-Даммім"
  es: "Efes-damim"
  pt: "Efes-Damim"
  de: "Efes-Dammim"
  fr: "Éphès-Dammim"
