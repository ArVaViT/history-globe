body:
  en:
    - "Ephes-dammim, “end of bloodshed” or “boundary of blood”, was the camp of the Philistines in the Valley of Elah when Goliath came out against Israel. “The Philistines gathered together their armies to battle, and were gathered together at Shochoh, which belongeth to Judah, and pitched between Shochoh and Azekah, in Ephes-dammim. And Saul and the men of Israel were gathered together, and pitched by the valley of Elah”. The armies faced each other for forty days until David killed the champion. Under the name Pas-dammim the Chronicler sets there a later fight of David's mighty men: Eleazar the son of Dodo “was with David at Pas-dammim, and there the Philistines were gathered together to battle, where was a parcel of ground full of barley; and the people fled from before the Philistines”, but Eleazar stood his ground and won; the parallel in Samuel tells the deed without naming the place."
    - "Socoh (Khirbet Shuweikeh) and Azekah (Tell Zakariya) are known, a few kilometres apart above the valley, and Ephes-dammim must have lain between or beside them, but no site has been fixed. Two ruins have been proposed because their names seem to echo the old one: Khirbet Damun, east of Socoh, the first candidate on the map, and Khirbet Beit Fasal, just south-east of Socoh, the second; and a few have proposed Khirbet Qeiyafa, the fortified town of about 1000 BC on the valley's north side excavated in 2007–2013, though its excavators call it Shaaraim."
    - "Today the Valley of Elah is farmland crossed by the road from Beit Shemesh toward Hebron, with the mounds of Azekah, Socoh and Khirbet Qeiyafa on its sides; terebinths, which gave the valley its name, still grow there."
  ru:
    - "Ефес-Даммим, «конец кровопролития» или «предел крови», — стан Филистимлян в долине Дуба, когда Голиаф вышел против Израиля. «Филистимляне собрали войска свои для войны и собрались в Сокхофе, что в Иудее, и расположились станом между Сокхофом и Азеком в Ефес-Даммиме. А Саул и Израильтяне собрались и расположились станом в долине дуба». Войска стояли друг против друга через долину сорок дней, пока Давид не убил единоборца. Под именем Фасдамим Паралипоменон помещает туда более позднюю схватку храбрых Давида: Елеазар, сын Додо, «был с Давидом в Фасдамиме, куда Филистимляне собрались на войну. Там часть поля была засеяна ячменем, и народ побежал от Филистимлян», но Елеазар устоял и победил; параллель в книге Царств рассказывает о подвиге, не называя места."
    - "Сокхоф (Хирбет-Шувейке) и Азек (Телль-Закария) известны, в нескольких километрах друг от друга над долиной, и Ефес-Даммим должен был лежать между ними или рядом, но место не установлено. Два места предлагали потому, что их имена как будто отзываются древнему: Хирбет-Дамун к востоку от Сокхофа, первый кандидат на карте, и Хирбет-Бейт-Фасаль чуть к юго-востоку от Сокхофа, второй; а немногие предлагали Хирбет-Кейафу, укреплённый город около 1000 г. до н. э. на северной стороне долины, раскопанный в 2007–2013 годах, хотя его раскопщики зовут его Шаараимом."
    - "Сегодня долина Дуба — поля, которые пересекает дорога из Бейт-Шемеша к Хеврону, с холмами Азека, Сокхофа и Хирбет-Кейафы по сторонам; терпентинные деревья, давшие долине имя, растут там и теперь."
  uk:
    - "Ефес-Даммім, «кінець кровопролиття» або «межа крові», був табором филистимлян в долині Іла, коли Голіят вийшов проти Ізраїлю. «Филистії зібрали своє військо до бою, та й зійшлись в Сохотї, що в Юдеї, та й отаборились під Ефес-Даммимом між Сохотом і Азеком. Саул же й Ізраїльське військо скупились й отаборились в долинї Теребінта». Війська стояли одне проти одного сорок днів, доки Давид не вбив поединника. Під назвою Пас-Даммім літописець ставить там пізніший бій Давидових силачів: Елеазар, син Додо, як сказано, «був із Давидом в Фасдамимі, куди Филистії зібрались були на війну. Там частка поля була засїяна ячменем, а народ втїкав від Филистіїв», але Елеазар встояв і переміг; паралельне місце в Самуїла розповідає про подвиг, не називаючи місця."
    - "Сохо (Хірбет-Шувейке) та Азека (Телль-Закарія) відомі, за кілька кілометрів одна від одної над долиною, і Ефес-Даммім мав лежати між ними або поряд, але місце не встановлено. Дві руїни запропоновано тому, що їхні назви ніби перегукуються зі старою: Хірбет-Дамун, на схід від Сохо, перший кандидат на мапі, і Хірбет-Бейт-Фасаль, просто на південний схід від Сохо, другий; а дехто запропонував Хірбет-Кейяфу, укріплене місто близько 1000 р. до н. е. на північному боці долини, розкопане в 2007–2013 рр., хоча його розкопувачі називають його Шаараїм."
    - "Сьогодні Долина дуба — це рілля, перетята дорогою від Бейт-Шемеша в бік Хеврона, з горбами Азеки, Сохо й Хірбет-Кейяфи на її боках; теревінти, які дали долині назву, і досі там ростуть."
  es:
    - "Efes-damim, «fin de la sangre» o «límite de sangre», era el campamento de los filisteos en el valle de Ela cuando Goliat salió contra Israel. «Y los Filisteos juntaron sus ejércitos para la guerra, y congregáronse en Sochô, que es de Judá, y asentaron el campo entre Sochô y Azeca, en Ephes-dammim. Y también Saúl y los hombres de Israel se juntaron, y asentaron el campo en el valle del Alcornoque». Los ejércitos se enfrentaron durante cuarenta días hasta que David mató al campeón. Con el nombre de Pas-damim, el cronista sitúa allí un combate posterior de los valientes de David: Eleazar hijo de Dodo «estuvo con David en Pasdammin, estando allí juntos en batalla los Filisteos: y había allí una suerte de tierra llena de cebada, y huyendo el pueblo delante de los Filisteos», pero Eleazar se mantuvo firme y venció; el pasaje paralelo de Samuel cuenta la hazaña sin nombrar el lugar."
    - "Soco (Khirbet Shuweikeh) y Azeca (Tell Zakariya) son conocidas, a pocos kilómetros una de otra sobre el valle, y Efes-damim debió de hallarse entre ellas o junto a ellas, pero no se ha fijado ningún sitio. Se han propuesto dos ruinas porque sus nombres parecen hacer eco del antiguo: Khirbet Damun, al este de Soco, el primer candidato del mapa, y Khirbet Beit Fasal, justo al sudeste de Soco, el segundo; y unos pocos han propuesto Khirbet Qeiyafa, la ciudad fortificada de hacia el 1000 a. C. en el lado norte del valle, excavada en 2007–2013, aunque sus excavadores la llaman Saaraim."
    - "Hoy el valle de Ela son tierras de labor cruzadas por la carretera de Bet-semes hacia Hebrón, con los montículos de Azeca, Soco y Khirbet Qeiyafa a sus lados; los terebintos, que dieron nombre al valle, siguen creciendo allí."
  pt:
    - "Efes-Damim, “fim do derramamento de sangue” ou “fronteira de sangue”, era o acampamento dos filisteus no Vale de Elá quando Golias saiu contra Israel: “os filisteus reuniram os seus exércitos para a guerra; juntaram-se em Socó, que pertence a Judá, e acamparam entre Socó e Azeca, em Efes-Damim. Saul e os homens de Israel se reuniram, acamparam no vale de Elá”. Os exércitos se defrontaram por quarenta dias, até que Davi matou o campeão. Sob o nome Pas-Damim, o cronista situa ali um combate posterior dos valentes de Davi: Eleazar, filho de Dodo, “estava com Davi em Pas-Damim, e lá os filisteus estavam reunidos para a batalha, onde havia um pedaço de terra cheio de cevada; e o povo fugiu de diante dos filisteus”, mas Eleazar manteve sua posição e venceu; o paralelo em Samuel conta o feito sem nomear o lugar."
    - "Socó (Khirbet Shuweikeh) e Azeca (Tell Zakariya) são conhecidas, a poucos quilômetros uma da outra acima do vale, e Efes-Damim deve ter ficado entre elas ou ao lado delas, mas nenhum local foi fixado. Duas ruínas foram propostas porque seus nomes parecem ecoar o antigo: Khirbet Damun, a leste de Socó, o primeiro candidato do mapa, e Khirbet Beit Fasal, logo a sudeste de Socó, o segundo; e alguns propuseram Khirbet Qeiyafa, a cidade fortificada de cerca de 1000 a.C. no lado norte do vale, escavada em 2007–2013, embora seus escavadores a chamem Saaraim."
    - "Hoje o Vale de Elá é terra de lavoura atravessada pela estrada de Bete-Semes em direção a Hebrom, com os montes de Azeca, Socó e Khirbet Qeiyafa em seus lados; os terebintos, que deram o nome ao vale, ainda crescem ali."
  de:
    - "Efes-Dammim, „Ende des Blutvergießens“ oder „Grenze des Blutes“, war das Lager der Philister im Elatal, als Goliat gegen Israel hervortrat. „Die Philister sammelten ihre Heere zum Streit und kamen zusammen zu Socho in Juda und lagerten sich zwischen Socho und Aseka bei Ephes-Dammim. Aber Saul und die Männer Israels kamen zusammen und lagerten sich im Eichgrunde“. Die Heere standen einander vierzig Tage gegenüber, bis David den Kämpfer tötete. Unter dem Namen Pas-Dammim verlegt der Chronist dorthin einen späteren Kampf von Davids Helden: Eleasar, der Sohn Dodos, „war mit David zu Pas-Dammim, da die Philister sich daselbst versammelt hatten zu Streit. Und es war da ein Stück Acker voll Gerste. Und das Volk floh vor den Philistern“, doch Eleasar hielt stand und siegte; die Parallele bei Samuel erzählt die Tat, ohne den Ort zu nennen."
    - "Socho (Khirbet Shuweikeh) und Aseka (Tell Zakariya) sind bekannt, wenige Kilometer voneinander entfernt oberhalb des Tals, und Efes-Dammim muss zwischen oder neben ihnen gelegen haben, doch ist kein Ort festgelegt. Zwei Ruinen wurden vorgeschlagen, weil ihre Namen an den alten anzuklingen scheinen: Khirbet Damun, östlich von Socho, der erste Kandidat auf der Karte, und Khirbet Beit Fasal, unmittelbar südöstlich von Socho, der zweite; und einige haben Khirbet Qeiyafa vorgeschlagen, die befestigte Stadt um 1000 v. Chr. auf der Nordseite des Tals, 2007–2013 ausgegraben, obwohl ihre Ausgräber sie Schaaraim nennen."
    - "Heute ist das Elatal Ackerland, durchzogen von der Straße von Bet Schemesch Richtung Hebron, mit den Hügeln von Aseka, Socho und Khirbet Qeiyafa an seinen Seiten; Terebinthen, die dem Tal seinen Namen gaben, wachsen dort noch."
  fr:
    - "Éphès-Dammim, « fin du sang versé » ou « limite du sang », était le camp philistin dans la Vallée d’Éla quand Goliath sortit contre Israël. « Les Philistins réunirent leurs armées pour faire la guerre, et ils se rassemblèrent à Soco, qui appartient à Juda ; ils campèrent entre Soco et Azéka, à Éphès-Dammim. Saül et les hommes d’Israël se rassemblèrent aussi ; ils campèrent dans la vallée des térébinthes ». Les armées se firent face quarante jours, jusqu’à ce que David tue le champion. Sous le nom de Pas-Dammim, le Chroniqueur y situe un combat des vaillants de David : Éléazar, fils de Dodo, « était avec David à Pas-Dammim, où les Philistins s’étaient rassemblés pour combattre. Il y avait là une pièce de terre remplie d’orge ; et le peuple fuyait devant les Philistins », mais Éléazar tint bon et vainquit ; le parallèle de Samuel raconte l’exploit sans nommer le lieu."
    - "Soco (Khirbet Shuweikeh) et Azéka (Tell Zakariya) sont connues, à quelques kilomètres l’une de l’autre au-dessus de la vallée, et Éphès-Dammim doit s’être trouvée entre elles ou à côté, mais aucun site n’a été fixé. Deux ruines ont été proposées parce que leurs noms semblent faire écho à l’ancien : Khirbet Damun, à l’est de Soco, premier candidat de la carte, et Khirbet Beit Fasal, juste au sud-est de Soco, deuxième ; et quelques-uns ont proposé Khirbet Qeiyafa, la ville fortifiée d’environ 1000 av. J.-C. sur le côté nord de la vallée, fouillée en 2007–2013, bien que ses fouilleurs l’appellent Schaaraïm."
    - "Aujourd’hui, la Vallée d’Éla est une terre agricole traversée par la route de Beit Shemesh vers Hébron, avec les tertres d’Azéka, de Soco et de Khirbet Qeiyafa sur ses flancs ; les térébinthes, qui ont donné son nom à la vallée, y poussent encore."
  it:
    - "Efes-Dammim, «fine dello spargimento di sangue» o «confine del sangue», era il campo dei Filistei nella Valle del Terebinto quando Golia uscì contro Israele. «Or i Filistei misero insieme i loro eserciti per combattere, si radunarono a Soco, che appartiene a Giuda, e si accamparono fra Soco e Azeka, a Efes-Dammim. Saul e gli uomini d’Israele si radunarono anch’essi, si accamparono nella valle dei terebinti». Gli eserciti si fronteggiarono per quaranta giorni finché Davide uccise il campione. Con il nome di Pas-Dammim il Cronista vi colloca un successivo scontro dei prodi di Davide: Eleazaro figlio di Dodo «era con Davide a Pas-Dammin, dove i Filistei s’erano raunati per combattere. V’era quivi un campo pieno d’orzo; e il popolo fuggiva dinanzi ai Filistei», ma Eleazaro tenne il campo e vinse; il passo parallelo di Samuele racconta l’impresa senza nominare il luogo."
    - "Soco (Khirbet Shuweikeh) e Azeka (Tell Zakariya) sono note, a pochi chilometri l’una dall’altra sopra la valle, ed Efes-Dammim deve essere stata fra loro o accanto, ma nessun sito è stato fissato. Due rovine sono state proposte perché i loro nomi sembrano riecheggiare l’antico: Khirbet Damun, a est di Soco, il primo candidato sulla mappa, e Khirbet Beit Fasal, subito a sud-est di Soco, il secondo; e alcuni hanno proposto Khirbet Qeiyafa, la città fortificata del 1000 a.C. circa sul lato nord della valle scavata nel 2007–2013, benché i suoi scavatori la chiamino Saaraim."
    - "Oggi la Valle del Terebinto è campagna coltivata attraversata dalla strada da Beit Shemesh verso Ebron, con i tell di Azeka, Soco e Khirbet Qeiyafa sui suoi fianchi; i terebinti, che diedero il nome alla valle, vi crescono ancora."
  pl:
    - "Efes-Dammim, „kres rozlewu krwi” albo „granica krwi”, było obozem Filistynów w Dolinie Ela, gdy Goliat wyszedł przeciw Izraelowi. „Tedy zebrali Filistynowie wojska swe, aby walczyli, a zeszli się u Sochot, które jest w Judzie, i położyli się obozem między Sochotem i między Asekiem na granicach Domim. A Saul i mężowie Izraelscy zebrali się, i położyli się obozem w dolinie Ela”. Wojska stały naprzeciw siebie czterdzieści dni, aż Dawid zabił wojownika. Pod nazwą Pas-Dammim Kronikarz umieszcza tam późniejszą walkę mocarzy Dawida: Eleazar, syn Dodo: „Ten był z Dawidem w Pasdamim, gdzie się zebrali byli Filistynowie ku bitwie; a była ona część pola pełna jęczmienia, a lud był uciekł przed Filistynami”, lecz Eleazar się nie cofnął i zwyciężył; paralelny tekst w Księdze Samuela opowiada ten czyn bez nazwy miejsca."
    - "Soko (Chirbet Szuwejka) i Azeka (Tell Zakarija) są znane, kilka kilometrów od siebie nad doliną, a Efes-Dammim musiało leżeć między nimi lub obok, lecz żadne miejsce nie zostało ustalone. Zaproponowano dwie ruiny, bo ich nazwy zdają się odbijać dawną: Chirbet Damun, na wschód od Soko, pierwszy kandydat na mapie, i Chirbet Bajt Fasal, tuż na południowy wschód od Soko, drugi; a nieliczni wskazywali Chirbet Kejafa, ufortyfikowane miasto z około 1000 r. p.n.e. po północnej stronie doliny, badane w latach 2007–2013, choć jego odkrywcy nazywają je Szaaraim."
    - "Dziś Dolina Ela to pola uprawne przecięte drogą z Bet Szemesz ku Hebronowi, z kopcami Azeka, Soko i Chirbet Kejafa po jej bokach; terebinty, od których dolina wzięła nazwę, wciąż tam rosną."
  nl:
    - "Efes-Dammim, “einde van bloedvergieten” of “grens van bloed”, was het kamp van de Filistijnen in het Ela-dal toen Goliat tegen Israël uitkwam. “De Filistijnen verzamelden hun heir ten strijde, en verzamelden zich te Socho, dat in Juda is; en zij legerden zich tussen Socho en tussen Azeka, aan het einde van Dammim. Doch Saul en de mannen van Israël verzamelden zich, en legerden zich in het eikendal”. De legers stonden veertig dagen tegenover elkaar tot David de kampioen doodde. Onder de naam Pas-Dammim plaatst de Kroniekschrijver daar een latere strijd van Davids helden: Eleazar, zoon van Dodo, “was met David te Pas-Dammim, als de Filistijnen daar ten strijde vergaderd waren, en het stuk des akkers vol gerst was, en het volk voor het aangezicht der Filistijnen vlood”, maar Eleazar hield stand en won; de parallel in Samuël vertelt de daad zonder de plaats te noemen."
    - "Socho (Khirbet Shuweikeh) en Azeka (Tell Zakariya) zijn bekend, een paar kilometer van elkaar boven het dal, en Efes-Dammim moet ertussen of ernaast hebben gelegen, maar geen plaats is vastgesteld. Twee ruïnes zijn voorgesteld omdat hun namen de oude lijken te echoën: Khirbet Damun, ten oosten van Socho, de eerste kandidaat op de kaart, en Khirbet Beit Fasal, even ten zuidoosten van Socho, de tweede; en enkelen hebben Khirbet Qeiyafa voorgesteld, de versterkte stad van omstreeks 1000 v.Chr. aan de noordkant van het dal, in 2007–2013 opgegraven, al noemen de opgravers haar Saäraïm."
    - "Tegenwoordig is het Ela-dal akkerland, doorsneden door de weg van Beit Shemesh naar Hebron, met de heuvels van Azeka, Socho en Khirbet Qeiyafa aan de zijden; terebinten, die het dal zijn naam gaven, groeien er nog."
  cs:
    - "Efes-damím, „konec krveprolití“ neboli „hranice krve“, byl tábor Pelištejců v Élském údolí, když proti Izraeli vyšel Goliáš. „I sebrali Filistinští vojska svá k boji, a shromáždili se u Socho, kteréž jest Judovo, a položili se mezi Socho a Azeka na pomezí Dammim. Ale Saul a muži Izraelští sebravše se, položili se v údolí Elah“. Vojska stála proti sobě čtyřicet dní, dokud David nezabil bojovníka. Pod jménem Pas-damím klade Letopisec na totéž místo pozdější boj Davidových hrdinů: Eleazar, syn Dodův, „byl s Davidem v Pasdammim, když se Filistinští sebrali k boji. A byl tu díl rolí poseté ječmenem, a lid byl utekl před Filistinskými“, ale Eleazar obstál a zvítězil; paralela v Samuelových knihách vypráví čin bez jmenování místa."
    - "Sókó (Khirbet Shuweikeh) a Azeka (Tell Zakariya) jsou známy, několik kilometrů od sebe nad údolím, a Efes-damím musel ležet mezi nimi nebo vedle nich, ale žádné místo nebylo určeno. Dvě zříceniny byly navrženy, protože jejich jména zřejmě ozvěnou připomínají staré: Khirbet Damun, východně od Sókó, první kandidát na mapě, a Khirbet Beit Fasal, hned jihovýchodně od Sókó, druhý; a někteří navrhli Khirbet Qeiyafa, opevněné město z doby kolem 1000 př. n. l. na severní straně údolí vykopávané v letech 2007–2013, ač je jeho vykopávači nazývají Šaarajim."
    - "Dnes je Élské údolí zemědělskou půdou, kterou prochází silnice z Beit Shemesh k Hebronu, s pahorky Azeky, Sókó a Khirbet Qeiyafa po jeho stranách; terebinty, které údolí daly jméno, tam dosud rostou."
scripture:
