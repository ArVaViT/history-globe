# Overview article (ADR 0007). Mainstream facts only; written for the pool and its quarter, the tunnel and its inscription being in the City of David article; the Byzantine and the Second Temple pools are kept apart.
id: siloam
place: a294859
title:
  en: "Siloam"
  ru: "Силоам"
body:
  en:
    - "Siloam is the pool at the southern end of the City of David in Jerusalem, where the water of the Gihon spring comes out after its passage through Hezekiah's tunnel, and the quarter around it; the village of Silwan across the Kidron keeps the name. The Hebrew Shiloah means “sent” or “conduit”, and John's Gospel notes the meaning: “which is by interpretation, Sent”. Before the tunnel an open channel led the spring along the slope to the south, and Isaiah's “waters of Shiloah that go softly”, which Judah refused for the rivers of Assyria and Damascus, are usually taken for that channel. Hezekiah “made a pool, and a conduit, and brought water into the city” before Sennacherib's invasion of 701 BC, and in 1880 the inscription telling how the tunnel's hewers met was found near its lower end."
    - "Nehemiah rode by night past “the gate of the fountain, and to the king's pool”, and his builders repaired “the wall of the pool of Siloah by the king's garden”. In the Second Temple period water was drawn here in a golden vessel for the libation at the feast of Tabernacles, the Mishnah says. Jesus named “those eighteen, upon whom the tower in Siloam fell, and slew them” as a warning that calamity is no measure of guilt, and sent the man born blind to “wash in the pool of Siloam”; “he went his way therefore, and washed, and came seeing”. Josephus calls Siloam a sweet and abundant spring at the mouth of the Tyropoeon valley, and in AD 70 the Romans burned the lower city as far as Siloam."
    - "Pilgrims from the fourth century describe a pool with porticoes, and the pilgrim of Piacenza about 570 a basilica over it; Frederick Bliss and Archibald Dickie uncovered the Byzantine church and the colonnaded pool at the tunnel's outlet in 1894–1897. That small pool, long shown as the pool of Siloam, is the Byzantine one. In 2004 repairs to a sewer a little to the south-east led Ronny Reich and Eli Shukron to the pool of Jesus' day: a great stepped reservoir some 70 m along its northern side, plastered in the Hasmonean period, with coins of Alexander Jannaeus in the plaster, and used until the war against Rome, from which a paved and stepped street climbs to the Temple Mount. Part of it lay under an orchard; full excavation was announced at the end of 2022, and the site is visited within the City of David park."
  ru:
    - "Силоам — водоём на южном конце города Давидова в Иерусалиме, где вода источника Гион выходит после прохода через тоннель Езекии, и квартал вокруг него; деревня Сильван через Кедрон хранит имя. Еврейское Шилоах значит «посланный» или «проток», и Евангелие от Иоанна отмечает значение: «что значит посланный». До тоннеля открытый канал вёл воду источника по склону на юг, и слова Исаии о народе, который «пренебрегает водами Силоама, текущими тихо» и восхищается Рецином, обычно относят к этому каналу. Езекия «сделал пруд и водопровод и провел воду в город» перед нашествием Сеннахирима в 701 г. до н. э., а в 1880 г. близ нижнего конца тоннеля нашли надпись о том, как встретились его каменотёсы."
    - "Неемия ночью подъехал «к воротам Источника и к царскому водоему», а его строители чинили «стену у водоема Селах против царского сада». Во времена Второго храма отсюда черпали воду золотым сосудом для возлияния в праздник Кущей, говорит Мишна. Иисус назвал «те восемнадцать человек, на которых упала башня Силоамская и побила их» в предостережение, что беда — не мера вины, и послал слепорождённого: «пойди, умойся в купальне Силоам»; «Он пошел, и умылся, и пришел зрячим». Иосиф Флавий называет Силоам сладким и обильным источником в устье Тиропеона, и в 70 г. н. э. римляне сожгли нижний город до самого Силоама."
    - "Паломники с IV века описывают водоём с портиками, а паломник из Пьяченцы около 570 г. — базилику над ним; Фредерик Блисс и Арчибальд Дики в 1894–1897 гг. открыли византийскую церковь и водоём с колоннадой у выхода тоннеля. Этот малый водоём, который долго показывали как Силоамскую купель, и есть византийский. В 2004 г. ремонт канализации чуть юго-восточнее привёл Рони Райха и Эли Шукрона к купели времён Иисуса: большому ступенчатому водоёму около 70 м по северной стороне, оштукатуренному в хасмонейское время, с монетами Александра Янная в штукатурке, и служившему до войны с Римом; от него мощёная ступенчатая улица поднимается к Храмовой горе. Часть его лежала под садом; в конце 2022 г. объявили о полных раскопках, и место открыто для посещения в парке «Город Давида»."
