# Overview article (ADR 0007). Mainstream facts only; written for the pool and its quarter, the tunnel and its inscription being in the City of David article; the Byzantine and the Second Temple pools are kept apart.
id: siloam
place: a294859
title:
  en: "Siloam"
  ru: "Силоам"
  uk: "Сілоам"
  es: "Siloé"
  pt: "Siloé"
  de: "Siloah"
  fr: "Siloé"
body:
  en:
    - "Siloam is the pool at the southern end of the City of David in Jerusalem, where the water of the Gihon spring comes out after its passage through Hezekiah's tunnel, and the quarter around it; the village of Silwan across the Kidron keeps the name. The Hebrew Shiloah means “sent” or “conduit”, and John's Gospel notes the meaning: “which is by interpretation, Sent”. Before the tunnel an open channel led the spring along the slope to the south, and Isaiah's “waters of Shiloah that go softly”, which Judah refused for the rivers of Assyria and Damascus, are usually taken for that channel. Hezekiah “made a pool, and a conduit, and brought water into the city” before Sennacherib's invasion of 701 BC, and in 1880 the inscription telling how the tunnel's hewers met was found near its lower end."
    - "Nehemiah rode by night past “the gate of the fountain, and to the king's pool”, and his builders repaired “the wall of the pool of Siloah by the king's garden”. In the Second Temple period water was drawn here in a golden vessel for the libation at the feast of Tabernacles, the Mishnah says. Jesus named “those eighteen, upon whom the tower in Siloam fell, and slew them” as a warning that calamity is no measure of guilt, and sent the man born blind to “wash in the pool of Siloam”; “he went his way therefore, and washed, and came seeing”. Josephus calls Siloam a sweet and abundant spring at the mouth of the Tyropoeon valley, and in AD 70 the Romans burned the lower city as far as Siloam."
    - "Pilgrims from the fourth century describe a pool with porticoes, and the pilgrim of Piacenza about 570 a basilica over it; Frederick Bliss and Archibald Dickie uncovered the Byzantine church and the colonnaded pool at the tunnel's outlet in 1894–1897. That small pool, long shown as the pool of Siloam, is the Byzantine one. In 2004 repairs to a sewer a little to the south-east led Ronny Reich and Eli Shukron to the pool of Jesus' day: a great stepped reservoir some 70 m along its northern side, plastered in the Hasmonean period, with coins of Alexander Jannaeus in the plaster, and used until the war against Rome, from which a paved and stepped street climbs to the Temple Mount. Part of it lay under an orchard; full excavation was announced at the end of 2022, and the site is visited within the City of David park."
  ru:
    - "Силоам — водоём на южном конце города Давидова в Иерусалиме, где вода источника Гион выходит после прохода через тоннель Езекии, и квартал вокруг него; деревня Сильван через Кедрон хранит имя. Еврейское Шилоах значит «посланный» или «проток», и Евангелие от Иоанна отмечает значение: «что значит посланный». До тоннеля открытый канал вёл воду источника по склону на юг, и слова Исаии о народе, который «пренебрегает водами Силоама, текущими тихо» и восхищается Рецином, обычно относят к этому каналу. Езекия «сделал пруд и водопровод и провел воду в город» перед нашествием Сеннахирима в 701 г. до н. э., а в 1880 г. близ нижнего конца тоннеля нашли надпись о том, как встретились его каменотёсы."
    - "Неемия ночью подъехал «к воротам Источника и к царскому водоему», а его строители чинили «стену у водоема Селах против царского сада». Во времена Второго храма отсюда черпали воду золотым сосудом для возлияния в праздник Кущей, говорит Мишна. Иисус назвал «те восемнадцать человек, на которых упала башня Силоамская и побила их» в предостережение, что беда — не мера вины, и послал слепорождённого: «пойди, умойся в купальне Силоам»; «Он пошел, и умылся, и пришел зрячим». Иосиф Флавий называет Силоам сладким и обильным источником в устье Тиропеона, и в 70 г. н. э. римляне сожгли нижний город до самого Силоама."
    - "Паломники с IV века описывают водоём с портиками, а паломник из Пьяченцы около 570 г. — базилику над ним; Фредерик Блисс и Арчибальд Дики в 1894–1897 гг. открыли византийскую церковь и водоём с колоннадой у выхода тоннеля. Этот малый водоём, который долго показывали как Силоамскую купель, и есть византийский. В 2004 г. ремонт канализации чуть юго-восточнее привёл Рони Райха и Эли Шукрона к купели времён Иисуса: большому ступенчатому водоёму около 70 м по северной стороне, оштукатуренному в хасмонейское время, с монетами Александра Янная в штукатурке, и служившему до войны с Римом; от него мощёная ступенчатая улица поднимается к Храмовой горе. Часть его лежала под садом; в конце 2022 г. объявили о полных раскопках, и место открыто для посещения в парке «Город Давида»."
  uk:
    - "Сілоам — це купіль на південному краю Міста Давида в Єрусалимі, де виходить вода джерела Гіхон після проходу тунелем Єзекії, а також квартал навколо неї; назву зберігає село Сільван по той бік Кедрону. Староєврейське Шилоах означає «посланий» або «водогін», а Євангеліє від Івана зазначає це значення: «що перекладом: Посланий». До тунелю відкритий канал вів воду джерела схилом на південь, і «тихі води Силоамські» Ісаї, які Юда відкинув заради рік Ассирії та Дамаска, зазвичай вважають цим каналом. Перед нашестям Сінаххеріба 701 р. до н. е. Єзекія «зробив став і водопровід, і провів у город воду», а в 1880 році поблизу нижнього кінця тунелю знайшли напис про те, як зустрілися прохідники."
    - "Неемія їхав уночі до «воріт Криничаних і до царського водопроводу», а його будівничі лагодили «мур коло ставка Селаха, проти царського садка». За часів Другого храму тут у золотій посудині набирали воду для узливання на свято Кущів, як розповідає Мішна. Ісус згадав «ті вісїмнайцять, що впала на них башта в Силоамі та й побила їх», як застереження, що лихо не є мірою провини, і послав сліпонародженого «вмий ся в купелї Силоамській»; «пійшов же і вмивсь, та й прийшов видющий». Йосиф Флавій називає Сілоам солодким і щедрим джерелом при гирлі долини Тиропеон, а в 70 р. н. е. римляни спалили Нижнє місто аж до Сілоаму."
    - "Прочани з IV століття описують купіль з портиками, а прочанин із Плаценції близько 570 року — над нею базиліку; Фредерік Бліс і Арчибальд Дікі відкрили візантійську церкву та купіль з колонадою біля виходу тунелю в 1894–1897 роках. Ця невелика купіль, яку довго показували як купіль Сілоаму, — візантійська. У 2004 році ремонт каналізації трохи на південний схід привів Ронні Райха та Елі Шукрона до купелі за днів Ісуса: великого сходинчастого водойму завдовжки близько 70 м по північній стороні, заштукатуреного в хасмонейську добу, з монетами Александра Яннея в штукатурці, що діяв до війни з Римом; від нього піднімається на Храмову гору вимощена сходинчаста вулиця. Частина його лежала під садом; повні розкопки оголосили наприкінці 2022 року, а місце можна відвідати в межах парку Міста Давида."
  es:
    - "Siloé es el estanque del extremo sur de la Ciudad de David, en Jerusalén, donde sale el agua de la fuente de Gihón tras su paso por el túnel de Ezequías, y también el barrio de alrededor; la aldea de Silwan, al otro lado del Cedrón, conserva el nombre. El hebreo Shiloaj significa «enviado» o «conducto», y el Evangelio de Juan anota el sentido: «que significa, si lo interpretares, Enviado». Antes del túnel, un canal abierto conducía el agua de la fuente por la ladera hacia el sur, y se suele identificar con ese canal las «aguas de Siloé, que corren mansamente» de Isaías, que Judá rechazó por los ríos de Asiria y de Damasco. Ezequías «hizo el estanque, y el conducto, y metió las aguas en la ciudad» antes de la invasión de Senaquerib en 701 a. C., y en 1880 se encontró, cerca de su extremo inferior, la inscripción que cuenta cómo se encontraron los picapedreros del túnel."
    - "Nehemías pasó de noche por «la puerta de la Fuente, y al estanque del Rey», y sus constructores repararon «el muro del estanque de Selah hacia la huerta del rey». En la época del Segundo Templo se sacaba aquí agua en un vaso de oro para la libación de la fiesta de los Tabernáculos, según dice la Misná. Jesús citó «aquellos dieciocho, sobre los cuales cayó la torre en Siloé, y los mató» como advertencia de que la desgracia no mide la culpa, y envió al ciego de nacimiento: «lávate en el estanque de Siloé»; «Y fué entonces, y lavóse, y volvió viendo». Josefo llama a Siloé una fuente dulce y abundante en la desembocadura del valle del Tiropeón, y en el año 70 d. C. los romanos incendiaron la ciudad baja hasta Siloé."
    - "Los peregrinos desde el siglo IV describen un estanque con pórticos, y el peregrino de Piacenza, hacia 570, una basílica sobre él; Frederick Bliss y Archibald Dickie sacaron a la luz en 1894–1897 la iglesia bizantina y el estanque con columnata en la salida del túnel. Ese pequeño estanque, mostrado durante mucho tiempo como el estanque de Siloé, es el bizantino. En 2004, unas reparaciones en una cloaca algo más al sureste llevaron a Ronny Reich y Eli Shukron al estanque de los días de Jesús: un gran depósito escalonado de unos 70 m en su lado norte, enlucido en el período asmoneo, con monedas de Alejandro Janeo en el enlucido, y usado hasta la guerra contra Roma; de él sube hacia el Monte del Templo una calle pavimentada y con escalones. Parte quedaba bajo un huerto; a finales de 2022 se anunció su excavación completa, y el sitio se visita dentro del parque de la Ciudad de David."
  pt:
    - "Siloé é o tanque na extremidade sul da Cidade de Davi, em Jerusalém, onde a água da fonte de Giom sai depois de percorrer o túnel de Ezequias, e também o bairro em torno dele; a aldeia de Silwan, do outro lado do Cedrom, conserva o nome. O hebraico Shiloah significa “enviado” ou “canal”, e o Evangelho de João registra o sentido: “que significa ‘Enviado’”. Antes do túnel, um canal aberto conduzia a água da fonte pela encosta, para o sul, e as “águas de Siloé, que fluem mansamente”, de Isaías, que Judá rejeitou pelos rios da Assíria e de Damasco, costumam ser identificadas com esse canal. Ezequias “fez o tanque e o aqueduto, e trouxe água para a cidade” antes da invasão de Senaqueribe, em 701 a.C., e em 1880 foi encontrada, perto da extremidade inferior do túnel, a inscrição que conta como os escavadores se encontraram."
    - "Neemias seguiu de noite “para a Porta da Fonte e para o Tanque do Rei”, e seus construtores repararam “a muralha do tanque de Selá, junto ao jardim do rei”. No período do Segundo Templo, segundo a Mixná, tirava-se água aqui, num vaso de ouro, para a libação da festa dos Tabernáculos. Jesus citou “aqueles dezoito sobre os quais caiu a torre de Siloé e os matou” como advertência de que a desgraça não mede a culpa, e mandou o homem cego de nascença “lavar-se no tanque de Siloé”; “então ele foi, lavou-se e voltou vendo”. Josefo chama Siloé de fonte doce e abundante na foz do vale do Tiropeão, e em 70 d.C. os romanos queimaram a cidade baixa até Siloé."
    - "Peregrinos desde o século IV descrevem um tanque com pórticos, e o peregrino de Placência, por volta de 570, uma basílica sobre ele; Frederick Bliss e Archibald Dickie descobriram, em 1894–1897, a igreja bizantina e o tanque com colunatas na saída do túnel. Esse pequeno tanque, mostrado por muito tempo como o tanque de Siloé, é o bizantino. Em 2004, reparos num esgoto um pouco a sudeste levaram Ronny Reich e Eli Shukron ao tanque do tempo de Jesus: um grande reservatório com degraus, de uns 70 m ao longo do lado norte, rebocado no período hasmoneu, com moedas de Alexandre Janeu no reboco, e usado até a guerra contra Roma; dele sobe, para o Monte do Templo, uma rua pavimentada e com degraus. Parte dele ficava sob um pomar; a escavação completa foi anunciada no fim de 2022, e o local é visitado dentro do parque da Cidade de Davi."
  de:
    - "Siloah ist der Teich am Südende der Davidsstadt in Jerusalem, wo das Wasser der Gihonquelle nach dem Lauf durch den Hiskia-Tunnel austritt, sowie das Viertel ringsum; das Dorf Silwan jenseits des Kidron bewahrt den Namen. Das hebräische Schiloach bedeutet „gesandt“ oder „Leitung“, und das Johannesevangelium vermerkt die Bedeutung: „das ist verdolmetscht: gesandt“. Vor dem Tunnel führte ein offener Kanal die Quelle am Hang nach Süden; mit dem „Wasser zu Siloah, das stille geht“, das Juda zugunsten der Ströme Assyriens und Damaskus' verschmähte, ist meist dieser Kanal gemeint. Hiskia legte „den Teich und die Wasserleitung“ an, „durch die er Wasser in die Stadt geleitet hat“, vor Sanheribs Einfall 701 v. Chr.; 1880 fand man nahe dem unteren Ende die Inschrift, die erzählt, wie sich die Tunnelhauer trafen."
    - "Nehemia ritt bei Nacht „zu dem Brunnentor und zu des Königs Teich“, und seine Bauleute besserten „die Mauer am Teich Siloah bei dem Garten des Königs“ aus. In der Zeit des Zweiten Tempels wurde hier, so die Mischna, Wasser in einem goldenen Gefäß für das Trankopfer am Laubhüttenfest geschöpft. Jesus nannte „die achtzehn, auf die der Turm von Siloah fiel und erschlug sie“ als Mahnung, dass ein Unglück kein Maß der Schuld ist, und schickte den Blindgeborenen mit den Worten: „Gehe hin zu dem Teich Siloah und wasche dich!“; „Da ging er hin und wusch sich und kam sehend.“ Josephus nennt Siloah eine süße, ergiebige Quelle an der Mündung des Tyropoiontals, und im Jahr 70 n. Chr. brannten die Römer die Unterstadt bis Siloah nieder."
    - "Pilger ab dem vierten Jahrhundert beschreiben einen Teich mit Säulenhallen, der Pilger von Piacenza um 570 eine Basilika darüber; Frederick Bliss und Archibald Dickie legten 1894–1897 die byzantinische Kirche und den Säulenteich am Tunnelausgang frei. Dieser kleine Teich, lange als Teich von Siloah gezeigt, ist der byzantinische. 2004 führten Reparaturen an einem Abwasserkanal etwas südöstlich Ronny Reich und Eli Shukron zum Teich der Zeit Jesu: ein großes Stufenbecken von rund 70 m Länge an der Nordseite, in hasmonäischer Zeit verputzt, mit Münzen Alexander Jannäus' im Putz, und bis zum Krieg gegen Rom genutzt; von ihm steigt eine gepflasterte Stufenstraße zum Tempelberg an. Ein Teil lag unter einem Obstgarten; die vollständige Ausgrabung wurde Ende 2022 angekündigt, und die Stätte wird im Park der Davidsstadt besucht."
  fr:
    - "Siloé est le bassin situé à l’extrémité sud de la Cité de David, à Jérusalem, où l’eau de la source de Guihon ressort après avoir traversé le tunnel d’Ézéchias, ainsi que le quartier qui l’entoure ; le village de Silwan, de l’autre côté du Cédron, en garde le nom. L’hébreu Shiloah signifie « envoyé » ou « conduite », et l’Évangile de Jean en note le sens : « nom qui signifie envoyé ». Avant le tunnel, un canal à ciel ouvert menait la source le long de la pente vers le sud, et les « eaux de Siloé qui coulent doucement » d’Ésaïe, que Juda méprisa au profit des fleuves d’Assyrie et de Damas, sont d’ordinaire identifiées à ce canal. Ézéchias « fit l’étang et l’aqueduc, et amena les eaux dans la ville » avant l’invasion de Sanchérib en 701 av. J.-C. ; en 1880, l’inscription racontant la rencontre des tailleurs du tunnel fut découverte près de son extrémité basse."
    - "Néhémie passa de nuit près de « la porte de la source et de l’étang du roi », et ses bâtisseurs réparèrent « le mur de l’étang de Siloé, près du jardin du roi ». À l’époque du Second Temple, on y puisait l’eau dans un vase d’or pour la libation de la fête des Tabernacles, selon la Mishna. Jésus cita « ces dix-huit personnes sur qui est tombée la tour de Siloé et qu’elle a tuées » en avertissement que le malheur ne mesure pas la faute, et envoya l’aveugle de naissance en lui disant : « lave-toi au réservoir de Siloé » ; « Il y alla, se lava, et s’en retourna voyant clair. » Josèphe appelle Siloé une source douce et abondante à l’embouchure de la vallée du Tyropéon, et en 70 apr. J.-C. les Romains incendièrent la ville basse jusqu’à Siloé."
    - "Des pèlerins dès le IVe siècle décrivent un bassin à portiques, et le pèlerin de Plaisance, vers 570, une basilique au-dessus ; Frederick Bliss et Archibald Dickie dégagèrent en 1894-1897 l’église byzantine et le bassin à colonnade à la sortie du tunnel. Ce petit bassin, longtemps montré comme celui de Siloé, est le bassin byzantin. En 2004, des réparations d’égout un peu au sud-est menèrent Ronny Reich et Eli Shukron au bassin de l’époque de Jésus : un grand réservoir à gradins, long d’environ 70 m sur son côté nord, enduit à l’époque hasmonéenne (des monnaies d’Alexandre Jannée sont dans l’enduit), utilisé jusqu’à la guerre contre Rome ; de là, une rue pavée à degrés monte vers le mont du Temple. Une partie se trouvait sous un verger ; la fouille complète fut annoncée fin 2022, et le site se visite dans le parc de la Cité de David."
