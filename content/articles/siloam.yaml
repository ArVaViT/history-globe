body:
  en:
    - "Siloam is the pool at the southern end of the City of David in Jerusalem, where the water of the Gihon spring comes out after its passage through Hezekiah's tunnel, and the quarter around it; the village of Silwan across the Kidron keeps the name. The Hebrew Shiloah means “sent” or “conduit”, and John's Gospel notes the meaning: “which is by interpretation, Sent”. Before the tunnel an open channel led the spring along the slope to the south, and Isaiah's “waters of Shiloah that go softly”, which “this people” refused, rejoicing in Rezin of Damascus and Remaliah's son, are usually taken for that channel. Hezekiah “made a pool, and a conduit, and brought water into the city” before Sennacherib's invasion of 701 BC, and in 1880 the inscription telling how the tunnel's hewers met was found near its lower end."
    - "Nehemiah rode by night past “the gate of the fountain, and to the king's pool”, and his builders repaired “the wall of the pool of Siloah by the king's garden”. In the Second Temple period water was drawn here in a golden vessel for the libation at the feast of Tabernacles, the Mishnah says. Jesus named “those eighteen, upon whom the tower in Siloam fell, and slew them” as a warning that calamity is no measure of guilt, and sent the man born blind to “wash in the pool of Siloam”; “he went his way therefore, and washed, and came seeing”. Josephus calls Siloam a sweet and abundant spring at the mouth of the Tyropoeon valley, and in AD 70 the Romans burned the lower city as far as Siloam."
    - "Pilgrims from the fourth century describe a pool with porticoes, and the pilgrim of Piacenza about 570 a basilica over it; Frederick Bliss and Archibald Dickie uncovered the Byzantine church and the colonnaded pool at the tunnel's outlet in 1894–1897. That small pool, long shown as the pool of Siloam, is the Byzantine one. In 2004 repairs to a sewer a little to the south-east led Ronny Reich and Eli Shukron to the pool of Jesus' day: a great stepped reservoir some 70 m along its northern side, plastered in the Hasmonean period, with coins of Alexander Jannaeus in the plaster, and used until the war against Rome, from which a paved and stepped street climbs to the Temple Mount. Part of it lay under an orchard; full excavation was announced at the end of 2022, and the site is visited within the City of David park."
  ru:
    - "Силоам — водоём на южном конце города Давидова в Иерусалиме, где вода источника Гион выходит после прохода через тоннель Езекии, и квартал вокруг него; деревня Сильван через Кедрон хранит имя. Еврейское Шилоах значит «посланный» или «проток», и Евангелие от Иоанна отмечает значение: «что значит посланный». До тоннеля открытый канал вёл воду источника по склону на юг, и слова Исаии о народе, который «пренебрегает водами Силоама, текущими тихо» и восхищается Рецином из Дамаска и сыном Ремалииным, обычно относят к этому каналу. Езекия «сделал пруд и водопровод и провел воду в город» перед нашествием Сеннахирима в 701 г. до н. э., а в 1880 г. близ нижнего конца тоннеля нашли надпись о том, как встретились его каменотёсы."
    - "Неемия ночью подъехал «к воротам Источника и к царскому водоему», а его строители чинили «стену у водоема Селах против царского сада». Во времена Второго храма отсюда черпали воду золотым сосудом для возлияния в праздник Кущей, говорит Мишна. Иисус назвал «те восемнадцать человек, на которых упала башня Силоамская и побила их» в предостережение, что беда — не мера вины, и послал слепорождённого: «пойди, умойся в купальне Силоам»; «Он пошел, и умылся, и пришел зрячим». Иосиф Флавий называет Силоам сладким и обильным источником в устье Тиропеона, и в 70 г. н. э. римляне сожгли нижний город до самого Силоама."
    - "Паломники с IV века описывают водоём с портиками, а паломник из Пьяченцы около 570 г. — базилику над ним; Фредерик Блисс и Арчибальд Дики в 1894–1897 гг. открыли византийскую церковь и водоём с колоннадой у выхода тоннеля. Этот малый водоём, который долго показывали как Силоамскую купель, и есть византийский. В 2004 г. ремонт канализации чуть юго-восточнее привёл Рони Райха и Эли Шукрона к купели времён Иисуса: большому ступенчатому водоёму около 70 м по северной стороне, оштукатуренному в хасмонейское время, с монетами Александра Янная в штукатурке, и служившему до войны с Римом; от него мощёная ступенчатая улица поднимается к Храмовой горе. Часть его лежала под садом; в конце 2022 г. объявили о полных раскопках, и место открыто для посещения в парке «Город Давида»."
  uk:
    - "Сілоам — це купіль на південному краю Міста Давида в Єрусалимі, де виходить вода джерела Гіхон після проходу тунелем Єзекії, а також квартал навколо неї; назву зберігає село Сільван по той бік Кедрону. Староєврейське Шилоах означає «посланий» або «водогін», а Євангеліє від Івана зазначає це значення: «що перекладом: Посланий». До тунелю відкритий канал вів воду джерела схилом на південь, і «тихі води Силоамські» Ісаї, які «сей люд» знехтував, уподобавши собі Резина з Дамаска й сина Ремалії, зазвичай вважають цим каналом. Перед нашестям Сінаххеріба 701 р. до н. е. Єзекія «зробив став і водопровід, і провів у город воду», а в 1880 році поблизу нижнього кінця тунелю знайшли напис про те, як зустрілися прохідники."
    - "Неемія їхав уночі до «воріт Криничаних і до царського водопроводу», а його будівничі лагодили «мур коло ставка Селаха, проти царського садка». За часів Другого храму тут у золотій посудині набирали воду для узливання на свято Кущів, як розповідає Мішна. Ісус згадав «ті вісїмнайцять, що впала на них башта в Силоамі та й побила їх», як застереження, що лихо не є мірою провини, і послав сліпонародженого «вмий ся в купелї Силоамській»; «пійшов же і вмивсь, та й прийшов видющий». Йосиф Флавій називає Сілоам солодким і щедрим джерелом при гирлі долини Тиропеон, а в 70 р. н. е. римляни спалили Нижнє місто аж до Сілоаму."
    - "Прочани з IV століття описують купіль з портиками, а прочанин із Плаценції близько 570 року — над нею базиліку; Фредерік Бліс і Арчибальд Дікі відкрили візантійську церкву та купіль з колонадою біля виходу тунелю в 1894–1897 роках. Ця невелика купіль, яку довго показували як купіль Сілоаму, — візантійська. У 2004 році ремонт каналізації трохи на південний схід привів Ронні Райха та Елі Шукрона до купелі за днів Ісуса: великого сходинчастого водойму завдовжки близько 70 м по північній стороні, заштукатуреного в хасмонейську добу, з монетами Александра Яннея в штукатурці, що діяв до війни з Римом; від нього піднімається на Храмову гору вимощена сходинчаста вулиця. Частина його лежала під садом; повні розкопки оголосили наприкінці 2022 року, а місце можна відвідати в межах парку Міста Давида."
  es:
    - "Siloé es el estanque del extremo sur de la Ciudad de David, en Jerusalén, donde sale el agua de la fuente de Gihón tras su paso por el túnel de Ezequías, y el barrio de alrededor; la aldea de Silwan, al otro lado del Cedrón, conserva el nombre. El hebreo Shiloaj significa «enviado» o «conducto», y el Evangelio de Juan anota el sentido: «que significa, si lo interpretares, Enviado». Antes del túnel, un canal abierto llevaba el agua de la fuente por la ladera hacia el sur, y se suele identificar con ese canal las «aguas de Siloé, que corren mansamente» de Isaías, que «este pueblo» desechó, holgándose con Rezín de Damasco y el hijo de Remalías. Ezequías «hizo el estanque, y el conducto, y metió las aguas en la ciudad» antes de la invasión de Senaquerib en 701 a. C., y en 1880 se halló, cerca de su extremo inferior, la inscripción que cuenta cómo se encontraron los picapedreros del túnel."
    - "Nehemías pasó de noche por «la puerta de la Fuente, y al estanque del Rey», y sus constructores repararon «el muro del estanque de Selah hacia la huerta del rey». En la época del Segundo Templo se sacaba aquí agua en un vaso de oro para la libación de la fiesta de los Tabernáculos, según dice la Misná. Jesús citó «aquellos dieciocho, sobre los cuales cayó la torre en Siloé, y los mató» como advertencia de que la desgracia no mide la culpa, y envió al ciego de nacimiento: «lávate en el estanque de Siloé»; «Y fué entonces, y lavóse, y volvió viendo». Josefo llama a Siloé una fuente dulce y abundante en la desembocadura del valle del Tiropeón, y en el año 70 d. C. los romanos incendiaron la ciudad baja hasta Siloé."
    - "Los peregrinos desde el siglo IV describen un estanque con pórticos, y el peregrino de Piacenza, hacia 570, una basílica sobre él; Frederick Bliss y Archibald Dickie sacaron a la luz en 1894–1897 la iglesia bizantina y el estanque con columnata en la salida del túnel. Ese pequeño estanque, mostrado durante mucho tiempo como el estanque de Siloé, es el bizantino. En 2004, unas reparaciones en una cloaca algo más al sureste llevaron a Ronny Reich y Eli Shukron al estanque de los días de Jesús: un gran depósito escalonado de unos 70 m en su lado norte, enlucido en el período asmoneo, con monedas de Alejandro Janeo en el enlucido, y usado hasta la guerra contra Roma; de él sube hacia el Monte del Templo una calle pavimentada y con escalones. Parte quedaba bajo un huerto; a finales de 2022 se anunció su excavación completa, y el sitio se visita dentro del parque de la Ciudad de David."
  pt:
    - "Siloé é o tanque na extremidade sul da Cidade de Davi, em Jerusalém, onde a água da fonte de Giom sai depois de percorrer o túnel de Ezequias, e também o bairro em torno dele; a aldeia de Silwan, do outro lado do Cedrom, conserva o nome. O hebraico Shiloah significa “enviado” ou “canal”, e o Evangelho de João registra o sentido: “que significa ‘Enviado’”. Antes do túnel, um canal aberto conduzia a água da fonte pela encosta, para o sul, e as “águas de Siloé, que fluem mansamente”, de Isaías, que “este povo” rejeitou, alegrando-se em Rezim de Damasco e no filho de Remalias, costumam ser identificadas com esse canal. Ezequias “fez o tanque e o aqueduto, e trouxe água para a cidade” antes da invasão de Senaqueribe, em 701 a.C., e em 1880 foi encontrada, perto da extremidade inferior do túnel, a inscrição que conta como os escavadores se encontraram."
    - "Neemias seguiu de noite “para a Porta da Fonte e para o Tanque do Rei”, e seus construtores repararam “a muralha do tanque de Selá, junto ao jardim do rei”. No período do Segundo Templo, segundo a Mixná, tirava-se água aqui, num vaso de ouro, para a libação da festa dos Tabernáculos. Jesus citou “aqueles dezoito sobre os quais caiu a torre de Siloé e os matou” como advertência de que a desgraça não mede a culpa, e mandou o homem cego de nascença “lavar-se no tanque de Siloé”; “então ele foi, lavou-se e voltou vendo”. Josefo chama Siloé de fonte doce e abundante na foz do vale do Tiropeão, e em 70 d.C. os romanos queimaram a cidade baixa até Siloé."
    - "Peregrinos desde o século IV descrevem um tanque com pórticos, e o peregrino de Placência, por volta de 570, uma basílica sobre ele; Frederick Bliss e Archibald Dickie descobriram, em 1894–1897, a igreja bizantina e o tanque com colunatas na saída do túnel. Esse pequeno tanque, mostrado por muito tempo como o tanque de Siloé, é o bizantino. Em 2004, reparos num esgoto um pouco a sudeste levaram Ronny Reich e Eli Shukron ao tanque do tempo de Jesus: um grande reservatório com degraus, de uns 70 m ao longo do lado norte, rebocado no período hasmoneu, com moedas de Alexandre Janeu no reboco, e usado até a guerra contra Roma; dele sobe, para o Monte do Templo, uma rua pavimentada e com degraus. Parte dele ficava sob um pomar; a escavação completa foi anunciada no fim de 2022, e o local é visitado dentro do parque da Cidade de Davi."
  de:
    - "Siloah ist der Teich am Südende der Davidsstadt in Jerusalem, wo das Wasser der Gihonquelle nach dem Lauf durch den Hiskia-Tunnel austritt, sowie das Viertel ringsum; das Dorf Silwan jenseits des Kidron bewahrt den Namen. Das hebräische Schiloach bedeutet „gesandt“ oder „Leitung“, und das Johannesevangelium vermerkt die Bedeutung: „das ist verdolmetscht: gesandt“. Vor dem Tunnel führte ein offener Kanal die Quelle am Hang nach Süden; mit dem „Wasser zu Siloah, das stille geht“, das „dieses Volk“ verachtete, während es sich des Rezin von Damaskus und des Sohnes Remaljas tröstete, ist meist dieser Kanal gemeint. Hiskia legte „den Teich und die Wasserleitung“ an, „durch die er Wasser in die Stadt geleitet hat“, vor Sanheribs Einfall 701 v. Chr.; 1880 fand man nahe dem unteren Ende die Inschrift, die erzählt, wie sich die Tunnelhauer trafen."
    - "Nehemia ritt bei Nacht „zu dem Brunnentor und zu des Königs Teich“, und seine Bauleute besserten „die Mauer am Teich Siloah bei dem Garten des Königs“ aus. In der Zeit des Zweiten Tempels wurde hier, so die Mischna, Wasser in einem goldenen Gefäß für das Trankopfer am Laubhüttenfest geschöpft. Jesus nannte „die achtzehn, auf die der Turm von Siloah fiel und erschlug sie“ als Mahnung, dass ein Unglück kein Maß der Schuld ist, und schickte den Blindgeborenen mit den Worten: „Gehe hin zu dem Teich Siloah und wasche dich!“; „Da ging er hin und wusch sich und kam sehend.“ Josephus nennt Siloah eine süße, ergiebige Quelle an der Mündung des Tyropoiontals, und im Jahr 70 n. Chr. brannten die Römer die Unterstadt bis Siloah nieder."
    - "Pilger ab dem vierten Jahrhundert beschreiben einen Teich mit Säulenhallen, der Pilger von Piacenza um 570 eine Basilika darüber; Frederick Bliss und Archibald Dickie legten 1894–1897 die byzantinische Kirche und den Säulenteich am Tunnelausgang frei. Dieser kleine Teich, lange als Teich von Siloah gezeigt, ist der byzantinische. 2004 führten Reparaturen an einem Abwasserkanal etwas südöstlich Ronny Reich und Eli Shukron zum Teich der Zeit Jesu: ein großes Stufenbecken von rund 70 m Länge an der Nordseite, in hasmonäischer Zeit verputzt, mit Münzen Alexander Jannäus' im Putz, und bis zum Krieg gegen Rom genutzt; von ihm steigt eine gepflasterte Stufenstraße zum Tempelberg an. Ein Teil lag unter einem Obstgarten; die vollständige Ausgrabung wurde Ende 2022 angekündigt, und die Stätte wird im Park der Davidsstadt besucht."
  fr:
    - "Siloé est le bassin à l’extrémité sud de la Cité de David, à Jérusalem, où l’eau de la source de Guihon ressort après avoir traversé le tunnel d’Ézéchias, ainsi que le quartier qui l’entoure ; le village de Silwan, de l’autre côté du Cédron, en garde le nom. L’hébreu Shiloah signifie « envoyé » ou « conduite », et l’Évangile de Jean en note le sens : « nom qui signifie envoyé ». Avant le tunnel, un canal à ciel ouvert menait la source le long de la pente vers le sud, et les « eaux de Siloé qui coulent doucement » d’Ésaïe, que « ce peuple » méprisa, se réjouissant au sujet de Retsin de Damas et du fils de Remalia, sont d’ordinaire identifiées à ce canal. Ézéchias « fit l’étang et l’aqueduc, et amena les eaux dans la ville » avant l’invasion de Sanchérib en 701 av. J.-C. ; en 1880, l’inscription racontant la rencontre des tailleurs du tunnel fut découverte près de son extrémité basse."
    - "Néhémie passa de nuit près de « la porte de la source et de l’étang du roi », et ses bâtisseurs réparèrent « le mur de l’étang de Siloé, près du jardin du roi ». À l’époque du Second Temple, on y puisait l’eau dans un vase d’or pour la libation de la fête des Tabernacles, selon la Mishna. Jésus cita « ces dix-huit personnes sur qui est tombée la tour de Siloé et qu’elle a tuées » en avertissement que le malheur ne mesure pas la faute, et envoya l’aveugle de naissance en lui disant : « lave-toi au réservoir de Siloé » ; « Il y alla, se lava, et s’en retourna voyant clair. » Josèphe appelle Siloé une source douce et abondante à l’embouchure de la vallée du Tyropéon, et en 70 apr. J.-C. les Romains incendièrent la ville basse jusqu’à Siloé."
    - "Des pèlerins dès le IVe siècle décrivent un bassin à portiques, et le pèlerin de Plaisance, vers 570, une basilique au-dessus ; Frederick Bliss et Archibald Dickie dégagèrent en 1894-1897 l’église byzantine et le bassin à colonnade à la sortie du tunnel. Ce petit bassin, longtemps montré comme celui de Siloé, est le bassin byzantin. En 2004, des réparations d’égout un peu au sud-est menèrent Ronny Reich et Eli Shukron au bassin de l’époque de Jésus : un grand réservoir à gradins, long d’environ 70 m sur son côté nord, enduit à l’époque hasmonéenne (des monnaies d’Alexandre Jannée sont dans l’enduit), utilisé jusqu’à la guerre contre Rome ; de là, une rue pavée à degrés monte vers le mont du Temple. Une partie se trouvait sous un verger ; la fouille complète fut annoncée fin 2022, et le site se visite dans le parc de la Cité de David."
  pl:
    - "Siloe to sadzawka na południowym krańcu Miasta Dawida w Jerozolimie, gdzie woda ze źródła Gichon wypływa po przejściu tunelem Ezechiasza, oraz dzielnica wokół niej; nazwę zachowuje wieś Silwan po drugiej stronie Cedronu. Hebrajskie Sziloach znaczy „posłany” albo „rynna”, a Ewangelia Jana odnotowuje to znaczenie: „co się wykłada posłany”. Przed tunelem otwarty kanał prowadził wodę ze źródła stokiem na południe, i zwykle uważa się go za „wody Syloe, które cicho płyną”, u Izajasza, wzgardzone przez „lud ten”, który weselił się z Rasyna z Damaszku i syna Romelijaszowego. Ezechiasz „uczynił sadzawkę, i rury, którymi przywiódł wodę do miasta” przed najazdem Sennacheryba w 701 roku p.n.e., a w 1880 roku blisko dolnego końca tunelu znaleziono inskrypcję opowiadającą, jak spotkali się drążący go robotnicy."
    - "Nehemiasz jechał nocą obok „ku bramie żródła, i ku sadzawce królewskiej”, a jego budowniczowie naprawiali „mur nad stawem Selach ku ogrodowi królewskiemu”. W okresie Drugiej Świątyni, jak podaje Miszna, czerpano tu wodę do złotego naczynia na libację podczas święta Namiotów. Jezus wspomniał „ośmnaście onych, na które upadła wieża w Syloe i pobiła je” jako przestrogę, że nieszczęście nie jest miarą winy, i posłał niewidomego od urodzenia słowami „Idź, umyj się w sadzawce Syloe”; „poszedł tedy i umył się, i przyszedł widząc”. Józef Flawiusz nazywa Siloe słodkim i obfitym źródłem u ujścia doliny Tyropeonu, a w 70 roku n.e. Rzymianie spalili dolne miasto aż po Siloe."
    - "Pielgrzymi od IV wieku opisują sadzawkę z portykami, a pielgrzym z Piacenzy około 570 roku bazylikę nad nią; Frederick Bliss i Archibald Dickie odsłonili w latach 1894–1897 bizantyjski kościół i sadzawkę z kolumnadą przy wylocie tunelu. Ta mała sadzawka, od dawna pokazywana jako sadzawka Siloe, jest bizantyjska. W 2004 roku naprawa kanału nieco na południowy wschód doprowadziła Ronny'ego Reicha i Eliego Szukrona do sadzawki z czasów Jezusa: wielkiego schodkowego zbiornika o północnym boku długim na ok. 70 m, tynkowanego w okresie hasmonejskim, z monetami Aleksandra Janneusza w tynku, używanego aż do wojny z Rzymem; od niego wspina się ku Wzgórzu Świątynnemu brukowana, schodkowa ulica. Część zbiornika leżała pod sadem; pełne wykopaliska ogłoszono pod koniec 2022 roku, a stanowisko można zwiedzać w parku Miasta Dawida."
  it:
    - "Siloe è la vasca all’estremità meridionale della Città di Davide a Gerusalemme, dove l’acqua della sorgente di Ghicon esce dopo il passaggio nel tunnel di Ezechia, e il quartiere che la circonda; il villaggio di Silwan, oltre il Cedron, ne conserva il nome. L’ebraico Shiloah significa «mandato» o «canale», e il Vangelo di Giovanni ne ricorda il senso: «che significa: mandato». Prima del tunnel un canale aperto conduceva la sorgente lungo il pendio verso sud, e «le acque di Siloe che corrono placidamente» di Isaia, sprezzate da «questo popolo», che si rallegrava di Retsin di Damasco e del figliuolo di Remalia, sono di solito identificate con quel canale. Ezechia «fece il serbatoio e l’acquedotto e condusse le acque nella città» prima dell’invasione di Sennacherib del 701 a.C., e nel 1880 presso l’imbocco inferiore fu trovata l’iscrizione che narra l’incontro degli scavatori del tunnel."
    - "Neemia passò di notte presso «la porta della Sorgente e il serbatoio del Re», e i suoi costruttori restaurarono «il muro del serbatoio di Scelah, presso il giardino del re». In epoca del Secondo Tempio qui si attingeva acqua con un vaso d’oro per la libazione della festa delle Capanne, dice la Mishnà. Gesù ricordò «quei diciotto sui quali cadde la torre in Siloe e li uccise» come monito che la sventura non misura la colpa, e mandò il cieco nato: «Va’, làvati nella vasca di Siloe»; «egli dunque andò e si lavò, e tornò che ci vedeva». Giuseppe Flavio descrive Siloe come una sorgente dolce e abbondante allo sbocco della valle del Tiropeo, e nel 70 d.C. i Romani incendiarono la città bassa fino a Siloe."
    - "I pellegrini dal IV secolo descrivono una vasca con portici, e il pellegrino di Piacenza verso il 570 una basilica sopra di essa; Frederick Bliss e Archibald Dickie portarono alla luce, nel 1894–1897, la chiesa bizantina e la vasca colonnata allo sbocco del tunnel. Quella piccola vasca, a lungo indicata come la vasca di Siloe, è quella bizantina. Nel 2004 lavori a una fognatura poco a sud-est condussero Ronny Reich ed Eli Shukron alla vasca dei tempi di Gesù: un grande bacino a gradini, lungo circa 70 m sul lato nord, intonacato in epoca asmonea, con monete di Alessandro Ianneo nell’intonaco, e usato fino alla guerra contro Roma; da esso sale al Monte del Tempio una strada lastricata e a gradini. Una parte giaceva sotto un frutteto; lo scavo completo fu annunciato alla fine del 2022, e il sito si visita all’interno del parco della Città di Davide."
  nl:
    - "Siloam is de vijver aan het zuidelijke einde van de Stad van David in Jeruzalem, waar het water van de Gihon uitkomt na de tunnel van Chizkia, en de wijk eromheen; het dorp Silwan aan de overkant van het Kidron bewaart de naam. Het Hebreeuwse Siloach betekent “gezonden” of “waterleiding”, en Johannes vermeldt de betekenis: “hetwelk overgezet wordt: uitgezonden”. Vóór de tunnel voerde een open kanaal het water langs de helling zuidwaarts, en Jesaja’s “wateren van Siloa, die zachtjes gaan”, door “dit volk” veracht, dat vreugde had bij Rezin van Damascus en den zoon van Remalia, worden gewoonlijk met dat kanaal vereenzelvigd. Van Chizkia wordt gezegd dat hij “den vijver en den watergang gemaakt heeft, en water in de stad gebracht heeft”, vóór Sanheribs inval in 701 v.Chr., en in 1880 werd bij het onderste uiteinde van de tunnel het opschrift gevonden over de ontmoeting van de uithakkers."
    - "Nehemia reed ’s nachts langs “de Fonteinpoort, en naar des konings vijver”, en zijn bouwers herstelden “den muur des vijvers Schelah bij des konings hof”. In de tijd van de Tweede Tempel werd hier water geschept in een gouden vat voor het plengoffer op het Loofhuttenfeest, volgens de Misjna. Jezus noemde “die achttien, op welke de toren in Siloam viel, en doodde ze” als waarschuwing dat een ramp geen maat voor schuld is, en stuurde de blindgeborene om zich te wassen “in het badwater Siloam”; “Hij dan ging heen en wies zich, en kwam ziende”. Flavius Josephus noemt Siloam een zoete en overvloedige bron aan de mond van het Tyropoeondal, en in 70 n.Chr. verbrandden de Romeinen de benedenstad tot aan Siloam."
    - "Pelgrims uit de vierde eeuw beschrijven een vijver met zuilengangen, en de pelgrim van Piacenza rond 570 een basiliek erboven; Frederick Bliss en Archibald Dickie legden in 1894–1897 de Byzantijnse kerk en de vijver met zuilengang bij de uitgang van de tunnel bloot. Die kleine, lang als Siloam getoonde vijver is de Byzantijnse. In 2004 brachten rioolwerkzaamheden iets ten zuidoosten ervan Ronny Reich en Eli Shukron bij de vijver uit de tijd van Jezus: een groot trapsgewijs bassin van zo’n 70 m langs de noordzijde, in de Hasmonese tijd gepleisterd, met munten van Alexander Jannaeus in het pleisterwerk, en in gebruik tot de oorlog tegen Rome; vanaf het bassin loopt een bestrate straat met trappen omhoog naar de Tempelberg. Deels lag het onder een boomgaard; eind 2022 werd een volledige opgraving aangekondigd, en de plek is te bezoeken in het park van de Stad van David."
  cs:
    - "Siloe je rybník na jižním konci Města Davidova v Jeruzalémě, kde vytéká voda pramene Gichónu po průchodu Chizkijášovým tunelem, i čtvrť kolem něj; jméno si zachovává vesnice Silwán na druhé straně Kidronu. Hebrejské Šiloach znamená „poslaný“ nebo „vodovod“ a Janovo evangelium uvádí význam: „jenž se vykládá: Poslaný“. Před tunelem vedl otevřený kanál pramen po svahu na jih. Izajáš říká, že „lid ten“ pohrdl „vodami Siloe tiše tekoucími“ a radoval se z Rezina z Damašku a syna Romeliášova; obvykle se za ně považuje právě tento kanál. Chizkijáš „udělal rybník, a vodu po trubách uvedl do města“ před Senacheribovým vpádem roku 701 př. n. l. a v roce 1880 byl poblíž dolního konce tunelu nalezen nápis vyprávějící, jak se jeho kopáči setkali."
    - "Nehemjáš jel v noci „k bráně studničné, a k rybníku královskému“ a jeho stavitelé opravovali „zed rybníka Selach, od zahrady královské“. V době druhého chrámu se zde podle Mišny nabírala voda do zlaté nádoby k úlitbě o svátku stánků. Ježíš připomněl „oněch osmnácte, na kteréžto upadla věže v Siloe, a zbila je“ jako výstrahu, že pohroma není měřítkem viny, a slepému od narození řekl: „Jdi, umej se v rybníku Siloe“; ten „šel a umyl se, i přišel, vida“. Josephus Flavius nazývá Siloe sladkým a vydatným pramenem u ústí údolí Tyropoion a v roce 70 n. l. Římané vypálili dolní město až po Siloe."
    - "Poutníci od 4. století popisují rybník se sloupovými podsíněmi a poutník z Piacenzy kolem roku 570 baziliku nad ním; Frederick Bliss a Archibald Dickie odkryli v letech 1894–1897 byzantský kostel a rybník se sloupořadím u ústí tunelu. Tento malý rybník, dlouho ukazovaný jako rybník Siloe, je byzantský. V roce 2004 opravy stoky kousek na jihovýchod přivedly Ronnyho Reicha a Eliho Šukrona k rybníku z Ježíšovy doby: velké stupňovité nádrži dlouhé na severní straně asi 70 m, omítnuté v době hasmonejské, s mincemi Alexandra Jannaia v omítce, užívané až do války proti Římu; od ní stoupá dlážděná ulice se schody k Chrámové hoře. Část ležela pod sadem; plné vykopávky byly oznámeny koncem roku 2022 a lokalita je přístupná v rámci parku Města Davidova."
