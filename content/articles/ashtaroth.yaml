# Overview article (ADR 0007). Mainstream facts only; Ashteroth-karnaim is left as either the same place or a neighbour; the Tiglath-pileser relief is the British Museum's.
id: ashtaroth
place: a6fea11
title:
  en: "Ashtaroth"
  ru: "Астароф"
  uk: "Аштарот"
  es: "Astarot"
  pt: "Astarote"
  de: "Astarot"
  fr: "Aschtaroth"
