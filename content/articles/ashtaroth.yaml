body:
  en:
    - "Ashtaroth was the capital of Og, king of Bashan, “which dwelt at Astaroth in Edrei”, in the fertile basalt plain of the Hauran east of the Sea of Galilee. The name is that of the goddess Astarte in the plural, and the city is far older than Israel: it appears as Ashtartu in the lists of Thutmose III and in the Amarna letters of the fourteenth century BC, where a ruler named Ayyab, held to be its king, writes to pharaoh. Ashteroth-karnaim, where Chedorlaomer smote the Rephaim, is either the same place or its neighbour; Og himself was “of the remnant of the giants”, the Rephaim."
    - "After Og's defeat the city went to the half-tribe of Manasseh, to “the children of Machir”, and was given with its pasture lands to the Levites of Gershon, under the name Beeshterah in Joshua and Ashtaroth in Chronicles. Uzzia the Ashterathite was one of David's mighty men. Tiglath-pileser III took the city, probably in his campaigns of 733–732 BC, and a relief from his palace at Nimrud, now in the British Museum, shows Ashtartu on its mound with captives being led away."
    - "The site is Tell Ashtara near the village of al-Sheikh Saad in the Daraa governorate of Syria, about 35 km east of the lake, where Syrian excavations in 1966 and 1967 found Bronze and Iron Age remains. Eusebius knew two villages called Astaroth Karnaim nine miles apart between Adraa and Abila. Karnaim, Ashtaroth's successor as the district capital, is usually placed at Sheikh Saad itself, about 4 km away. The plain is wheat country, and the district has suffered heavily in the Syrian war since 2011."
  ru:
    - "Астароф был столицей Ога, царя Васанского, «который жил в Аштерофе в Едреи», на плодородной базальтовой равнине Хаурана к востоку от Галилейского моря. Имя — имя богини Астарты во множественном числе, и город много старше Израиля: он появляется как Аштарту в списках Тутмоса III и в Амарнских письмах XIV века до н. э., где пишет фараону правитель по имени Айяб, которого считают его царём. Аштероф-Карнаим, где Кедорлаомер поразил Рефаимов, — либо то же место, либо его сосед; сам Ог был «последний из Рефаимов»."
    - "После поражения Ога город отошёл полуколену Манассии, «сынам Махира», и был отдан с предместьями левитам из рода Гирсона — под именем Беештера у Иисуса Навина и Аштароф в Паралипоменон. Уззия Аштерофянин был одним из храбрых Давида. Город взял Феглаффелласар III, вероятно в походах 733–732 гг. до н. э., и рельеф из его дворца в Калахе, ныне в Британском музее, показывает Аштарту на холме и уводимых пленников."
    - "Место — Телль-Аштара близ селения Эш-Шейх-Саад в сирийской провинции Даръа, километрах в 35 к востоку от озера, где сирийские раскопки 1966 и 1967 годов нашли остатки бронзового и железного веков. Евсевий знал два селения с именем Астароф-Карнаим в девяти милях друг от друга между Адраа и Авилой. Карнаим, преемник Астарофа как центра округа, обычно помещают в самом Шейх-Сааде, примерно в 4 км оттуда. Равнина — хлебный край, и с 2011 года этот район тяжело пострадал в сирийской войне."
  uk:
    - "Аштарот був столицею Ога, царя Башану, «що жив в Астаротї і в Єдреї», у родючій базальтовій рівнині Хавран на схід від Галілейського моря. Назва — це богиня Астарта у множині, і місто набагато давніше за Ізраїль: воно з'являється як Аштарту в переліках Тутмоса III і в листах з Амарни XIV століття до н. е., де правитель на ім'я Аййаб, якого вважають його царем, пише фараонові. Аштерот-Карнаїм, де Кедорлаомер розбив рефаїмів, — або те саме місце, або його сусід; сам Ог був «від останнїх Рефаїв-велетнїв»."
    - "Після поразки Ога місто дісталося половині племені Манасії, «синам Махировим», і було дане з пасовищами левітам Гершома під назвою Беештера в книзі Ісуса Навина та Аштарот у Хроніках. Уззія Аштеротянин був одним з могутніх Давида. Тіглатпаласар III узяв місто, імовірно, у походах 733–732 рр. до н. е., і рельєф з його палацу в Німруді, нині в Британському музеї, показує Аштарту на пагорбі з полоненими, яких виводять."
    - "Це місце — Телль-Аштара біля села аш-Шейх-Саад у мухафазі Дераа в Сирії, приблизно за 35 км на схід від озера, де сирійські розкопки 1966 і 1967 років знайшли рештки бронзової та залізної доби. Євсевій знав два села з назвою Астарот-Карнаїм на відстані дев'яти миль між Адрою та Абілою. Карнаїм, наступник Аштарота як столиця округу, зазвичай розміщують у самому Шейх-Саді, приблизно за 4 км. Рівнина — пшеничний край, і округ тяжко постраждав у сирійській війні від 2011 року."
  es:
    - "Astarot fue la capital de Og, rey de Basán, «que habitaba en Astarot en Edrei», en la fértil llanura basáltica del Haurán, al este del mar de Galilea. El nombre es el de la diosa Astarté en plural, y la ciudad es mucho más antigua que Israel: aparece como Ashtartu en las listas de Tutmosis III y en las cartas de Amarna del siglo XIV a. C., donde un gobernante llamado Ayyab, tenido por su rey, escribe al faraón. Astarot-carnaim, donde Quedorlaomer derrotó a los refaítas, es el mismo lugar o su vecino; el propio Og era «del residuo de los Rapheos», los refaítas."
    - "Tras la derrota de Og, la ciudad correspondió a la media tribu de Manasés, a «los hijos de Machîr», y fue dada con sus pastos a los levitas de Gersón, con el nombre de Beestera en Josué y de Astarot en las Crónicas. Uzías el astarotita fue uno de los valientes de David. Tiglat-pileser III tomó la ciudad, probablemente en sus campañas de 733–732 a. C., y un relieve de su palacio de Nimrud, hoy en el Museo Británico, muestra Ashtartu sobre su montículo con cautivos que son llevados lejos."
    - "El sitio es Tell Ashtara, cerca de la aldea de al-Sheikh Saad, en la gobernación de Daraa, en Siria, a unos 35 km al este del lago, donde excavaciones sirias en 1966 y 1967 hallaron restos de las edades del Bronce y del Hierro. Eusebio conocía dos aldeas llamadas Astaroth Karnaim a nueve millas una de otra entre Adraa y Abila. Carnaim, sucesora de Astarot como capital del distrito, suele situarse en la propia Sheikh Saad, a unos 4 km de distancia. La llanura es tierra de trigo, y el distrito ha sufrido mucho en la guerra de Siria desde 2011."
  pt:
    - "Astarote era a capital de Ogue, rei de Basã, “que habitava em Astarote, em Edrei”, na fértil planície basáltica do Haurã, a leste do mar da Galileia. O nome é o da deusa Astarte no plural, e a cidade é muito mais velha que Israel: aparece como Ashtartu nas listas de Tutmés III e nas cartas de Amarna do século XIV a.C., em que um governante chamado Ayyab, tido por seu rei, escreve ao faraó. Astarote-Carnaim, onde Quedorlaomer derrotou os refains, é o mesmo lugar ou seu vizinho; o próprio Ogue era “do remanescente dos refains”."
    - "Depois da derrota de Ogue, a cidade coube à meia tribo de Manassés, “aos filhos de Maquir”, e foi dada com suas pastagens aos levitas de Gérson, com o nome de Beesterá em Josué e Astarote em Crônicas. Uzias, o asteratita, foi um dos valentes de Davi. Tiglate-Pileser III tomou a cidade, provavelmente em suas campanhas de 733–732 a.C., e um relevo de seu palácio em Nimrud, hoje no Museu Britânico, mostra Ashtartu em seu montículo, com cativos sendo levados."
    - "O sítio é Tell Ashtara, perto da aldeia de al-Sheikh Saad, na província de Daraa, na Síria, cerca de 35 km a leste do lago, onde escavações sírias em 1966 e 1967 acharam restos das Idades do Bronze e do Ferro. Eusébio conhecia duas aldeias chamadas Astaroth Karnaim, a nove milhas uma da outra, entre Adraa e Abila. Carnaim, sucessora de Astarote como capital do distrito, costuma ser situada na própria Sheikh Saad, a cerca de 4 km. A planície é terra de trigo, e o distrito sofreu muito na guerra síria desde 2011."
  de:
    - "Astarot war die Hauptstadt Ogs, des Königs von Baschan, „der zu Astharoth und zu Edrei wohnte“, in der fruchtbaren Basaltebene des Hauran östlich des Sees Genezareth. Der Name ist der der Göttin Astarte im Plural, und die Stadt ist weit älter als Israel: Sie erscheint als Ashtartu in den Listen Thutmosis' III. und in den Amarna-Briefen des 14. Jahrhunderts v. Chr., wo ein Herrscher namens Ayyab, für ihren König gehalten, an den Pharao schreibt. Aschtarot-Karnajim, wo Kedorlaomer die Refaiter schlug, ist entweder derselbe Ort oder sein Nachbar; Og selbst war „noch von den Riesen übrig“, den Refaitern."
    - "Nach Ogs Niederlage fiel die Stadt an den halben Stamm Manasse, an „die Kinder Machirs“, und wurde mit ihren Weiden den Leviten Gerschons gegeben, unter dem Namen Beeschtera bei Josua und Astarot in der Chronik. Usija, der Astarotiter, war einer von Davids Helden. Tiglat-Pileser III. nahm die Stadt, wohl auf seinen Feldzügen 733–732 v. Chr., und ein Relief aus seinem Palast in Nimrud, heute im Britischen Museum, zeigt Ashtartu auf seinem Hügel, während Gefangene weggeführt werden."
    - "Die Stätte ist Tell Aschtara beim Dorf al-Scheich Saad im Gouvernement Daraa in Syrien, etwa 35 km östlich des Sees, wo syrische Grabungen 1966 und 1967 Reste der Bronze- und Eisenzeit fanden. Eusebius kannte zwei Dörfer namens Astaroth Karnaim, neun Meilen voneinander entfernt, zwischen Adraa und Abila. Karnajim, Astarots Nachfolger als Bezirkshauptstadt, wird gewöhnlich in Scheich Saad selbst angesetzt, etwa 4 km entfernt. Die Ebene ist Weizenland, und der Bezirk hat seit 2011 im syrischen Krieg schwer gelitten."
  fr:
    - "Aschtaroth était la capitale d’Og, roi de Basan, « qui habitait à Aschtaroth et à Édréï », dans la fertile plaine basaltique du Havran à l’est de la mer de Galilée. Le nom est celui de la déesse Astarté au pluriel, et la ville est bien plus ancienne qu’Israël : elle paraît sous le nom d’Ashtartu dans les listes de Thoutmosis III et dans les lettres d’Amarna du XIVe siècle av. J.-C., où un souverain nommé Ayyab, tenu pour son roi, écrit au pharaon. Aschtéroth-Karnaïm, où Kedorlaomer battit les Rephaïm, est le même lieu ou son voisin ; Og lui-même était le « seul reste des Rephaïm »."
    - "Après la défaite d’Og, la ville revint à la demi-tribu de Manassé, aux « fils de Makir », et fut donnée avec ses pâturages aux lévites de Guerschon, sous le nom de Beeschthera dans Josué et d’Aschtaroth dans les Chroniques. Uzzia l’Aschtérathite fut l’un des vaillants hommes de David. Tiglath-Piléser III prit la ville, probablement dans ses campagnes de 733-732 av. J.-C., et un relief de son palais de Nimroud, aujourd’hui au British Museum, montre Ashtartu sur son tertre avec des captifs emmenés."
    - "Le site est Tell Ashtara, près du village d’al-Sheikh Saad, dans le gouvernorat de Deraa, en Syrie, à environ 35 km à l’est du lac, où des fouilles syriennes en 1966 et 1967 ont trouvé des vestiges des âges du Bronze et du Fer. Eusèbe connaissait deux villages appelés Astaroth Karnaim, distants de neuf milles, entre Adraa et Abila. Karnaïm, successeur d’Aschtaroth comme capitale du district, est d’ordinaire placée à Sheikh Saad même, à environ 4 km. La plaine est un pays de blé, et le district a lourdement souffert de la guerre de Syrie depuis 2011."
  it:
    - "Astarot era la capitale di Og, re di Basan, «che abitava in Astaroth e in Edrei», nella fertile pianura basaltica dell’Auran a est del Lago di Tiberiade. Il nome è quello della dea Astarte al plurale, e la città è molto più antica di Israele: compare come Ashtartu negli elenchi di Tutmosi III e nelle lettere di Amarna del XIV secolo a.C., dove un sovrano di nome Ayyab, ritenuto il suo re, scrive al faraone. Astarot-Karnaim, dove Chedorlaomer sconfisse i Refaim, è lo stesso luogo o il suo vicino; Og stesso era «uno dei superstiti dei Refaim»."
    - "Dopo la sconfitta di Og la città andò alla mezza tribù di Manasse, «ai figliuoli di Makir», e fu data con i suoi pascoli ai leviti di Gherson, con il nome Beesterà in Giosuè e Astarot nelle Cronache. Uzzia l’Astarotita fu uno dei prodi di Davide. Tiglat-Pilèser III prese la città, probabilmente nelle sue campagne del 733–732 a.C., e un rilievo dal suo palazzo di Nimrud, ora al British Museum, mostra Ashtartu sul suo tell con prigionieri condotti via."
    - "Il sito è Tell Ashtara presso il villaggio di al-Sheikh Saad nel governatorato di Daraa in Siria, a circa 35 km a est del lago, dove scavi siriani nel 1966 e 1967 hanno trovato resti dell’età del Bronzo e del Ferro. Eusebio conosceva due villaggi chiamati Astaroth Karnaim a nove miglia l’uno dall’altro fra Adraa e Abila. Karnaim, successore di Astarot come capitale del distretto, è di solito collocata a Sheikh Saad stessa, a circa 4 km di distanza. La pianura è terra di grano, e il distretto ha sofferto duramente nella guerra siriana dal 2011."
  pl:
    - "Asztarot było stolicą Oga, króla Baszanu, „który mieszkał w Astarot w Edrej”, na żyznej bazaltowej równinie Hauranu na wschód od Jeziora Galilejskiego. Nazwa jest liczbą mnogą imienia bogini Astarte, a miasto jest dużo starsze niż Izrael: występuje jako Asztartu w wykazach Totmesa III i w listach z Amarna z XIV wieku p.n.e., gdzie władca imieniem Ayyab, uważany za jego króla, pisze do faraona. Asztarot-Karnaim, gdzie Kedorlaomer pobił Refaitów, to albo to samo miejsce, albo jego sąsiad; sam Og „był pozostał z Refaimów”, olbrzymów."
    - "Po klęsce Oga miasto przypadło połowie pokolenia Manassesa, „synom Machyra, syna Manasesowego”, i zostało oddane wraz z pastwiskami lewitom z rodu Gerszona, pod nazwą Beeszterah u Jozuego i Asztarot w Księdze Kronik. Uzzjasz Asztarotyta był jednym z bohaterów Dawida. Tiglat-Pileser III zdobył miasto, prawdopodobnie w kampaniach z lat 733–732 p.n.e., a relief z jego pałacu w Nimrud, dziś w British Museum, ukazuje Asztartu na tellu z prowadzonymi jeńcami."
    - "Miejscem jest Tell Asztara koło wsi al-Sheikh Saad w muhafazie Daraa w Syrii, około 35 km na wschód od jeziora, gdzie syryjskie wykopaliska z 1966 i 1967 roku odsłoniły pozostałości z epoki brązu i żelaza. Euzebiusz znał dwie wsie zwane Astaroth Karnaim, oddalone o dziewięć mil, między Adraa a Abilą. Karnaim, następca Asztarot jako stolica okręgu, umieszcza się zwykle w samym Sheikh Saad, około 4 km dalej. Równina jest krajem pszenicy, a okręg ciężko ucierpiał w wojnie syryjskiej od 2011 roku."
  nl:
    - "Astarot was de hoofdstad van Og, koning van Basan, “welke woonde in Astharoth, te Edrei”, in de vruchtbare basaltvlakte van de Hauran ten oosten van het Meer van Galilea. De naam is die van de godin Astarte in het meervoud, en de stad is veel ouder dan Israël: zij verschijnt als Ashtartu in de lijsten van Thoetmosis III en in de Amarnabrieven van de veertiende eeuw v.Chr., waarin een heerser met de naam Ayyab, gehouden voor haar koning, aan de farao schrijft. Astarot-Karnaïm, waar Kedorlaomer de Rafaïeten versloeg, is dezelfde plaats of haar buur; Og zelf was “van het overblijfsel der reuzen”, de Rafaïeten."
    - "Na Ogs nederlaag ging de stad naar de halve stam Manasse, naar “de kinderen van Machir”, en werd met haar weiden gegeven aan de Levieten van Gerson, onder de naam Beësthera in Jozua en Astarot in Kronieken. Uzzia de Asteratiet was een van Davids helden. Tiglat-Pileser III nam de stad in, waarschijnlijk tijdens zijn veldtochten van 733–732 v.Chr., en een reliëf uit zijn paleis te Nimrud, nu in het British Museum, toont Ashtartu op zijn heuvel terwijl gevangenen worden weggevoerd."
    - "De plaats is Tell Ashtara bij het dorp al-Sheikh Saad in het gouvernement Daraa in Syrië, zo’n 35 km ten oosten van het meer, waar Syrische opgravingen in 1966 en 1967 resten uit de bronstijd en ijzertijd vonden. Eusebius kende twee dorpen genaamd Astaroth Karnaim, negen mijl uit elkaar tussen Adraa en Abila. Karnaïm, Astarots opvolger als districtshoofdstad, wordt gewoonlijk op Sheikh Saad zelf geplaatst, zo’n 4 km verderop. De vlakte is tarweland, en het district heeft sinds 2011 zwaar geleden in de Syrische oorlog."
  cs:
    - "Aštarót byl hlavním městem Oga, krále Bášanu, „kterýž bydlil v Astarot a v Edrei“, v úrodné čedičové pláni Havranu východně od Galilejského jezera. Jméno je jménem bohyně Astarty v množném čísle a město je mnohem starší než Izrael: objevuje se jako Ashtartu v seznamech Thutmosise III. a v Amarnských listech ze 14. století př. n. l., kde faraonovi píše vládce jménem Ayyab, pokládaný za jeho krále. Aštarót-karnajim, kde Kedorlaomer pobil Refaimské, je buď totéž místo, nebo jeho soused; Og sám byl „z ostatků Refaimských“, tedy z obrů."
    - "Po Ogově porážce připadlo město polovičnímu pokolení Manasesovu, „synům Machirovým“, a bylo dáno s pastvinami levitům z Geršona pod jménem Beešterá v Jozue a Aštarót v Letopisech. Uzijáš Aštarotský byl jedním z Davidových udatných. Tiglatpilesar III. město dobyl, pravděpodobně při tažení v letech 733–732 př. n. l., a reliéf z jeho paláce v Nimrudu, nyní v Britském muzeu, ukazuje Ashtartu na pahorku, jak jsou odváděni zajatci."
    - "Místem je Tell Ashtara u vesnice al-Sheikh Saad v guvernorátu Dará v Sýrii, asi 35 km východně od jezera, kde syrské vykopávky v letech 1966 a 1967 našly pozůstatky doby bronzové a železné. Eusebios znal dvě vesnice zvané Astaroth Karnaim, vzdálené od sebe devět mil, mezi Adraou a Abilou. Karnajim, nástupce Aštarótu jako hlavního města okresu, se obvykle klade do samotného Sheikh Saad, asi 4 km daleko. Pláň je pšeničným krajem a okres těžce trpí od roku 2011 syrskou válkou."
