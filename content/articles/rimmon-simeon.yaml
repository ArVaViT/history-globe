body:
  en:
    - "Rimmon, “pomegranate”, was a town of the Negeb, the dry south of Judah, in Joshua and Chronicles named with Ain, “spring”, beside it. Joshua lists “Ain, and Rimmon” last among the towns of Judah's south, then gives both to Simeon, “Ain, Remmon, and Ether, and Ashan; four cities”; Chronicles repeats them among Simeon's villages, and after the exile the men of Judah lived “at En-rimmon”, which looks like the two names grown into one, Ain-rimmon. Zechariah uses it to mark the southern end of the land: in the day of the LORD “All the land shall be turned as a plain from Geba to Rimmon south of Jerusalem”, from the northern border of Judah to its last town, while Jerusalem alone stands high."
    - "The name lives on at Khirbet Umm er-Rammamin, now Horvat Rimmon, a ruin with a synagogue used from the third to the seventh century, excavated in the late 1970s and early 1980s; Eusebius knew a village Eremmon in the south, sixteen miles from Eleutheropolis, which fits. Next to it rises Tel Halif, a mound with a walled town of the Bronze and Iron Ages, dug since the 1970s, where the Iron Age Rimmon is usually placed, though others have given Tel Halif to Ziklag or Hormah; the map shows both sites."
    - "Today both lie in the Lahav forest in Israel, between Beersheba and Kiryat Gat, by Kibbutz Lahav and the Bedouin town of Lakiya."
  ru:
    - "Риммон, «гранат», — город Негева, сухого юга Иудеи, в книгах Иисуса Навина и Паралипоменон называемый вместе с Аином, «источником», рядом с ним. Иисус Навин перечисляет «Аин и Риммон» последними среди городов юга Иуды, затем отдаёт оба Симеону: «Аин, Риммон, Ефер и Ашан: четыре города»; Паралипоменон повторяет их среди сёл Симеона, а после плена сыны Иуды жили «в Ен-Риммоне», что похоже на два имени, сросшиеся в одно, Аин-Риммон. Захария отмечает им южный край земли: в день Господень «Вся эта земля будет, как равнина, от Гаваона до Реммона, на юг от Иерусалима», от северной границы Иудеи до её последнего города, и один Иерусалим будет стоять высоко."
    - "Имя живёт в Хирбет-Умм-эр-Раммамин, нынешней Хорват-Риммон, развалине с синагогой, служившей с III по VII век и раскопанной в конце 1970-х и начале 1980-х годов; Евсевий знал на юге селение Эреммон в шестнадцати милях от Елевферополя, что подходит. Рядом поднимается Тель-Халиф, холм с обнесённым стеной городом бронзового и железного веков, который копают с 1970-х годов и где обычно помещают Риммон железного века, хотя другие отдавали Тель-Халиф Секелагу или Хорме; на карте отмечены оба места."
    - "Сегодня оба лежат в лесу Лахав в Израиле, между Беэр-Шевой и Кирьят-Гатом, у кибуца Лахав и бедуинского города Лакия."
  uk:
    - "Риммон, «гранат», було містом Негева, сухого півдня Юди, і в книгах Ісуса Навина та Хронік згадується разом з Аїном, «джерелом», поруч. Ісус Навин перелічує «Аин і Риммон» останніми серед міст півдня Юди, потім віддає обидва Симеонові: «Анн, Риммон, Етер та Ашан — чотири міста з їх селами»; Хроніки повторюють їх серед сіл Симеона, а після вигнання люди Юди жили «в Ен-Риммонї», що виглядає як дві назви, зрослі в одну, Аїн-Риммон. Захарія вживає його, щоб позначити південний кінець краю: у день Господній уся земля стане рівниною від Геби до Риммону на південь від Єрусалима — від північного кордону Юди до її останнього міста, тоді як лише Єрусалим стоїть високо."
    - "Назва живе в Хірбет-Умм-ер-Раммамін, нині Хорват-Риммон, руїні із синагогою, якою користувалися з III до VII ст., розкопаній наприкінці 1970-х і на початку 1980-х років; Євсевій знав село Еремон на півдні, за шістнадцять миль від Елевтерополя, що збігається. Поряд здіймається Тель-Галіф, курган з обгородженим містом бронзової та залізної доби, який розкопують з 1970-х років і де зазвичай поміщають залізнодобовий Риммон, хоча інші віддавали Тель-Галіф Ціклагові чи Хормі; карта показує обидва місця."
    - "Сьогодні обидва лежать у лісі Лахав в Ізраїлі, між Беер-Шевою та Кір’ят-Ґатом, біля кібуца Лахав і бедуїнського міста Лакія."
  es:
    - "Rimón, «granada», era una ciudad del Néguev, el sur árido de Judá, nombrada en Josué y Crónicas con Ain, «manantial», a su lado. Josué enumera «Aín, y Rimmón» en último lugar entre las ciudades del sur de Judá, y luego da ambas a Simeón, «Aín, Rimmón, Eter, y Asán; cuatro ciudades»; Crónicas las repite entre las aldeas de Simeón, y tras el exilio los hombres de Judá vivían «en En-rimmón», que parece los dos nombres fundidos en uno, Ain-rimón. Zacarías la usa para marcar el extremo sur del país: en el día del Señor «toda la tierra se tornará como llanura desde Gabaa hasta Rimmón al mediodía de Jerusalem», desde la frontera norte de Judá hasta su última ciudad, mientras que solo Jerusalén se alza en lo alto."
    - "El nombre pervive en Khirbet Umm er-Rammamin, hoy Horvat Rimmon, unas ruinas con una sinagoga usada del siglo III al VII, excavada a fines de la década de 1970 y principios de la de 1980; Eusebio conocía una aldea Eremmon en el sur, a dieciséis millas de Eleuterópolis, lo que concuerda. Junto a ella se alza Tel Halif, un montículo con una ciudad amurallada de las Edades del Bronce y del Hierro, excavado desde la década de 1970, donde suele situarse el Rimón de la Edad del Hierro, aunque otros han asignado Tel Halif a Siclag o a Horma; el mapa muestra ambos lugares."
    - "Hoy ambos se encuentran en el bosque de Lahav, en Israel, entre Beerseba y Kiryat Gat, junto al kibutz Lahav y la ciudad beduina de Lakiya."
  pt:
    - "Rimom, “romã”, era uma cidade do Neguebe, o sul árido de Judá, citada em Josué e Crônicas com Aim, “fonte”, ao lado. Josué lista “Aim e Rimom” por último entre as cidades do sul de Judá, depois dá ambas a Simeão, “Aim, Rimom, Eter e Asã; quatro cidades”; Crônicas as repete entre as aldeias de Simeão, e depois do exílio os homens de Judá moraram “em En-Rimom”, que parece os dois nomes fundidos em um, Aim-Rimom. Zacarias a usa para marcar o extremo sul da terra: no dia do SENHOR “Toda a terra se tornará como a Arabá, desde Geba até Rimom, ao sul de Jerusalém”, da fronteira norte de Judá até sua última cidade, enquanto só Jerusalém se ergue alta."
    - "O nome sobrevive em Khirbet Umm er-Rammamin, hoje Horvat Rimmon, uma ruína com uma sinagoga usada do século III ao VII, escavada no fim da década de 1970 e início da de 1980; Eusébio conhecia uma aldeia Eremom no sul, a dezesseis milhas de Eleuterópolis, o que combina. Ao lado se ergue Tel Halif, um monte com cidade murada das Idades do Bronze e do Ferro, escavado desde a década de 1970, onde costuma ser situada a Rimom da Idade do Ferro, embora outros tenham dado Tel Halif a Ziclague ou Hormá; o mapa mostra os dois locais."
    - "Hoje ambos ficam na floresta de Lahav, em Israel, entre Berseba e Kiryat Gat, junto ao Kibutz Lahav e à cidade beduína de Lakiya."
  de:
    - "Rimmon, „Granatapfel“, war eine Stadt des Negev, des trockenen Südens Judas, bei Josua und in der Chronik mit Ajin, „Quelle“, daneben genannt. Josua führt „Ain, Rimmon“ als letzte unter den Städten des Südens Judas auf und gibt dann beide Simeon, „Ain, Rimmon, Ehter, Asan. Das sind vier Städte und ihre Dörfer“; die Chronik wiederholt sie unter Simeons Dörfern, und nach dem Exil wohnten die Männer Judas „zu En-Rimmon“, was wie die beiden zusammengewachsenen Namen aussieht, Ajin-Rimmon. Sacharja gebraucht es, um das Südende des Landes zu bezeichnen: Am Tag des HERRN heißt es: „Und man wird gehen im ganzen Lande umher wie auf einem Gefilde, von Geba nach Rimmon zu, gegen Mittag von Jerusalem“, von der Nordgrenze Judas bis zu seiner letzten Stadt, während Jerusalem allein erhaben steht."
    - "Der Name lebt in Chirbet Umm er-Rammamin fort, heute Horvat Rimmon, einer Ruine mit einer Synagoge, die vom 3. bis 7. Jahrhundert benutzt wurde und in den späten 1970er und frühen 1980er Jahren ausgegraben wurde; Eusebius kannte ein Dorf Eremmon im Süden, sechzehn Meilen von Eleutheropolis, was passt. Daneben erhebt sich Tel Halif, ein Hügel mit einer ummauerten Stadt der Bronze- und Eisenzeit, seit den 1970er Jahren ausgegraben, wo das eisenzeitliche Rimmon meist angesetzt wird, obwohl andere Tel Halif Ziklag oder Horma zugewiesen haben; die Karte zeigt beide Stätten."
    - "Heute liegen beide im Lahav-Wald in Israel, zwischen Beerscheba und Kirjat Gat, beim Kibbuz Lahav und der Beduinenstadt Lakija."
  fr:
    - "Rimmon, « grenade », était une ville du Négev, le sud aride de Juda, nommée dans Josué et les Chroniques avec Aïn, « source », à côté. Josué cite « Aïn, et Rimmon » en dernier parmi les villes du sud de Juda, puis les donne toutes deux à Siméon, « Aïn, Rimmon, Éther, et Aschan, quatre villes » ; les Chroniques les répètent parmi les villages de Siméon, et après l’exil les hommes de Juda habitèrent « à En-Rimmon », qui semble les deux noms soudés en un, Aïn-Rimmon. Zacharie s’en sert pour marquer l’extrémité sud du pays : au jour de l’Éternel, « tout le pays deviendra comme la plaine, de Guéba à Rimmon, au midi de Jérusalem », de la frontière nord de Juda à sa dernière ville, tandis que Jérusalem seule reste élevée."
    - "Le nom survit à Khirbet Umm er-Rammamin, aujourd’hui Horvat Rimmon, ruine avec une synagogue utilisée du IIIe au VIIe siècle, fouillée à la fin des années 1970 et au début des années 1980 ; Eusèbe connaissait un village Eremmon dans le sud, à seize milles d’Éleuthéropolis, ce qui convient. À côté s’élève Tel Halif, tertre avec une ville fortifiée des âges du Bronze et du Fer, fouillé depuis les années 1970, où l’on place d’ordinaire le Rimmon de l’âge du Fer, bien que d’autres aient donné Tel Halif à Tsiklag ou à Horma ; la carte montre les deux sites."
    - "Aujourd’hui, les deux se trouvent dans la forêt de Lahav, en Israël, entre Beer-Schéba et Kiryat Gat, près du kibboutz Lahav et de la ville bédouine de Lakiya."
  it:
    - "Rimmon, «melograno», era una città del Negheb, il sud arido di Giuda, nominata in Giosuè e nelle Cronache con Ain, «sorgente», accanto. Giosuè elenca «Ain, Rimmon» per ultime tra le città del sud di Giuda, poi le assegna entrambe a Simeone, «Ain, Rimmon, Ether e Ashan: quattro città»; le Cronache le ripetono tra i villaggi di Simeone, e dopo l’esilio gli uomini di Giuda abitarono «in En-Rimmon», che sembra i due nomi fusi in uno, Ain-Rimmon. Zaccaria la usa per segnare l’estremità meridionale del paese: nel giorno del Signore «Tutto il paese sarà mutato in pianura da Gheba a Rimmon a mezzogiorno di Gerusalemme», dal confine settentrionale di Giuda alla sua ultima città, mentre solo Gerusalemme resterà alta."
    - "Il nome sopravvive a Khirbet Umm er-Rammamin, oggi Horvat Rimmon, una rovina con una sinagoga usata dal III al VII secolo, scavata alla fine degli anni 1970 e all’inizio degli anni 1980; Eusebio conosceva un villaggio Eremmon nel sud, a sedici miglia da Eleuteropoli, il che si accorda. Accanto sorge Tel Halif, un tell con una città fortificata dell’età del Bronzo e del Ferro, scavato dagli anni 1970, dove di solito si colloca il Rimmon dell’età del Ferro, benché altri abbiano attribuito Tel Halif a Siclag o a Corma; la mappa mostra entrambi i siti."
    - "Oggi entrambi si trovano nella foresta di Lahav in Israele, tra Bersabea e Kiryat Gat, presso il kibbutz Lahav e la città beduina di Lakiya."
  pl:
    - "Rimmon, „granat”, było miastem Negewu, suchego południa Judy, w Księdze Jozuego i Kronikach wymienianym razem z Ain, „źródło”, obok niego. Jozue wylicza „Ain, i Remmon” jako ostatnie wśród miast południa Judy, potem daje oba Symeonowi, „Ain, Remmon, i Atar, i Asan, miasta cztery”; Kroniki powtarzają je wśród wsi Symeona, a po wygnaniu mężowie Judy mieszkali „w Enrymmon”, co wygląda na dwie nazwy zrośnięte w jedną, Ain-Rimmon. Zachariasz używa go dla oznaczenia południowego krańca kraju: w dniu Pana „uczyniona będzie ta wszystka ziemia, jako równina od Gabaa aż do Remmon na południe ku Jeruzalemowi”, od północnej granicy Judy do jej ostatniego miasta, podczas gdy sama Jerozolima stoi wysoko."
    - "Nazwa żyje w Chirbet Umm er-Rammamin, dziś Chorwat Rimmon, ruinie z synagogą używaną od III do VII wieku, wykopaną w końcu lat siedemdziesiątych i na początku osiemdziesiątych XX wieku; Euzebiusz znał wieś Eremmon na południu, szesnaście mil od Eleuteropolis, co pasuje. Obok wznosi się Tel Chalif, kopiec z obwarowanym miastem z epoki brązu i żelaza, badany od lat siedemdziesiątych, gdzie zwykle umieszcza się Rimmon z epoki żelaza, choć inni przypisali Tel Chalif Siklag lub Hormie; mapa pokazuje oba stanowiska."
    - "Dziś oba leżą w lesie Lachaw w Izraelu, między Beer-Szebą a Kirjat Gat, koło kibucu Lachaw i beduińskiego miasta Lakija."
  cs:
    - "Rimmon, „granátové jablko“, bylo město v Negevu, suchém jihu Judska, v Jozuovi a Kronikách jmenované s Ajinem, „pramenem“, vedle něj. Jozue uvádí „Ain a Remmon“ jako poslední mezi městy judského jihu a pak obě dává Simeonovi, „Ain, Remmon, též Eter a Asan, města čtyři i vsi jejich“; Kroniky je opakují mezi Simeonovými vesnicemi a po exilu muži Judovi bydleli „V Enremmon“, což vypadá jako obě jména srostlá v jedno, Ajin-rimmon. Zacharjáš jím označuje jižní konec země: v den Hospodinův „učiněna bude všecka tato země jako rovina od Gaba k Remmon na polední straně Jeruzalému“, od severní hranice Judy k jejímu poslednímu městu, zatímco samotný Jeruzalém stojí vysoko."
    - "Jméno žije dál v Chirbet Umm er-Rammamín, dnes Chorvat Rimmon, ruině se synagogou užívanou od 3. do 7. století, vykopané na přelomu 70. a 80. let 20. století; Eusebius znal vesnici Eremmon na jihu, šestnáct mil od Eleutheropole, což odpovídá. Vedle se zvedá Tel Chalif, pahorek s opevněným městem doby bronzové a železné, kopaný od 70. let, kde se obvykle klade Rimmon doby železné, ač jiní dali Tel Chalif Siklagu či Chormě; mapa ukazuje obě místa."
    - "Dnes obě leží v lese Lachav v Izraeli, mezi Beer-šebou a Kirjat Gat, u kibucu Lachav a beduínského města Lakíja."
  nl:
    - "Rimmon, “granaatappel”, was een stad van de Negev, het droge zuiden van Juda, in Jozua en Kronieken genoemd met Ain, “bron”, ernaast. Jozua noemt “Ain, en Rimmon” als laatste onder de steden van Juda’s zuiden en geeft beide dan aan Simeon, “Ain, Rimmon, en Ether, en Asan; vier steden en haar dorpen”; Kronieken herhaalt ze onder Simeons dorpen, en na de ballingschap woonden de mannen van Juda “te En-Rimmon”, dat de twee namen tot één gegroeid lijkt, Ain-Rimmon. Zacharia gebruikt het om het zuidelijke eind van het land aan te geven: op de dag van de HEER: “Dit ganse land zal rondom als een vlak veld gemaakt worden, van Geba tot Rimmon toe, zuidwaarts van Jeruzalem”, van de noordgrens van Juda tot zijn laatste stad, terwijl Jeruzalem alleen hoog staat."
    - "De naam leeft voort bij Khirbet Umm er-Rammamin, nu Horvat Rimmon, een ruïne met een synagoge die van de 3e tot de 7e eeuw werd gebruikt, opgegraven in de late jaren 1970 en vroege jaren 1980; Eusebius kende een dorp Eremmon in het zuiden, zestien mijl van Eleutheropolis, wat past. Ernaast rijst Tel Halif, een heuvel met een ommuurde stad uit de brons- en ijzertijd, sinds de jaren 1970 opgegraven, waar het Rimmon uit de ijzertijd meestal wordt geplaatst, al hebben anderen Tel Halif aan Siklag of Chorma gegeven; de kaart toont beide plaatsen."
    - "Tegenwoordig liggen beide in het Lachav-bos in Israël, tussen Berseba en Kiryat Gat, bij kibboets Lachav en de bedoeïenenstad Lakiya."
