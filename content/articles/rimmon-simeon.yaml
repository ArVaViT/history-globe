body:
  en:
    - "Rimmon, “pomegranate”, was a town of the Negeb, the dry south of Judah, always named with Ain, “spring”, beside it. Joshua lists “Ain, and Rimmon” last among the towns of Judah's south, then gives both to Simeon, “Ain, Remmon, and Ether, and Ashan; four cities”; Chronicles repeats them among Simeon's villages, and after the exile the men of Judah lived “at En-rimmon”, which looks like the two names grown into one, Ain-rimmon. Zechariah uses it to mark the southern end of the land: in the day of the LORD “All the land shall be turned as a plain from Geba to Rimmon south of Jerusalem”, from the northern border of Judah to its last town, while Jerusalem alone stands high."
    - "The name lives on at Khirbet Umm er-Rammamin, now Horvat Rimmon, a ruin with a synagogue used from the third to the seventh century, excavated in the late 1970s and early 1980s; Eusebius knew a village Eremmon in the south, sixteen miles from Eleutheropolis, which fits. Next to it rises Tel Halif, a mound with a walled town of the Bronze and Iron Ages, dug since the 1970s, where the Iron Age Rimmon is usually placed, though others have given Tel Halif to Ziklag or Hormah; the map shows both sites."
    - "Today both lie in the Lahav forest in Israel, between Beersheba and Kiryat Gat, by Kibbutz Lahav and the Bedouin town of Lakiya."
  ru:
    - "Риммон, «гранат», — город Негева, сухого юга Иудеи, всегда называемый вместе с Аином, «источником», рядом с ним. Иисус Навин перечисляет «Аин и Риммон» последними среди городов юга Иуды, затем отдаёт оба Симеону: «Аин, Риммон, Ефер и Ашан: четыре города»; Паралипоменон повторяет их среди сёл Симеона, а после плена сыны Иуды жили «в Ен-Риммоне», что похоже на два имени, сросшиеся в одно, Аин-Риммон. Захария отмечает им южный край земли: в день Господень «Вся эта земля будет, как равнина, от Гаваона до Реммона, на юг от Иерусалима», от северной границы Иудеи до её последнего города, и один Иерусалим будет стоять высоко."
    - "Имя живёт в Хирбет-Умм-эр-Раммамин, нынешней Хорват-Риммон, развалине с синагогой, служившей с III по VII век и раскопанной в конце 1970-х и начале 1980-х годов; Евсевий знал на юге селение Эреммон в шестнадцати милях от Елевферополя, что подходит. Рядом поднимается Тель-Халиф, холм с обнесённым стеной городом бронзового и железного веков, который копают с 1970-х годов и где обычно помещают Риммон железного века, хотя другие отдавали Тель-Халиф Секелагу или Хорме; на карте отмечены оба места."
    - "Сегодня оба лежат в лесу Лахав в Израиле, между Беэр-Шевой и Кирьят-Гатом, у кибуца Лахав и бедуинского города Лакия."
  uk:
    - "Риммон, «гранат», було містом Негева, сухого півдня Юди, і завжди згадується разом з Аїном, «джерелом», поруч. Ісус Навин перелічує «Аин і Риммон» останніми серед міст півдня Юди, потім віддає обидва Симеонові: «Анн, Риммон, Етер та Ашан — чотири міста з їх селами»; Хроніки повторюють їх серед сіл Симеона, а після вигнання люди Юди жили «в Ен-Риммонї», що виглядає як дві назви, зрослі в одну, Аїн-Риммон. Захарія вживає його, щоб позначити південний кінець краю: у день Господній уся земля стане рівниною від Геби до Риммону на південь від Єрусалима — від північного кордону Юди до її останнього міста, тоді як лише Єрусалим стоїть високо."
    - "Назва живе в Хірбет-Умм-ер-Раммамін, нині Хорват-Риммон, руїні із синагогою, якою користувалися з III до VII ст., розкопаній наприкінці 1970-х і на початку 1980-х років; Євсевій знав село Еремон на півдні, за шістнадцять миль від Елевтерополя, що збігається. Поряд здіймається Тель-Галіф, курган з обгородженим містом бронзової та залізної доби, який розкопують з 1970-х років і де зазвичай поміщають залізнодобовий Риммон, хоча інші віддавали Тель-Галіф Ціклагові чи Хормі; карта показує обидва місця."
    - "Сьогодні обидва лежать у лісі Лахав в Ізраїлі, між Беер-Шевою та Кір’ят-Ґатом, біля кібуца Лахав і бедуїнського міста Лакія."
  es:
    - "Rimón, «granada», era una ciudad del Néguev, el sur árido de Judá, nombrada siempre con Ain, «manantial», a su lado. Josué enumera «Aín, y Rimmón» en último lugar entre las ciudades del sur de Judá, y luego da ambas a Simeón, «Aín, Rimmón, Eter, y Asán; cuatro ciudades»; Crónicas las repite entre las aldeas de Simeón, y tras el exilio los hombres de Judá vivían «en En-rimmón», que parece los dos nombres fundidos en uno, Ain-rimón. Zacarías la usa para marcar el extremo sur del país: en el día del Señor «toda la tierra se tornará como llanura desde Gabaa hasta Rimmón al mediodía de Jerusalem», desde la frontera norte de Judá hasta su última ciudad, mientras que solo Jerusalén se alza en lo alto."
    - "El nombre pervive en Khirbet Umm er-Rammamin, hoy Horvat Rimmon, unas ruinas con una sinagoga usada del siglo III al VII, excavada a fines de la década de 1970 y principios de la de 1980; Eusebio conocía una aldea Eremmon en el sur, a dieciséis millas de Eleuterópolis, lo que concuerda. Junto a ella se alza Tel Halif, un montículo con una ciudad amurallada de las Edades del Bronce y del Hierro, excavado desde la década de 1970, donde suele situarse el Rimón de la Edad del Hierro, aunque otros han asignado Tel Halif a Siclag o a Horma; el mapa muestra ambos lugares."
    - "Hoy ambos se encuentran en el bosque de Lahav, en Israel, entre Beerseba y Kiryat Gat, junto al kibutz Lahav y la ciudad beduina de Lakiya."
  pt:
    - "Rimom, “romã”, era uma cidade do Neguebe, o sul árido de Judá, sempre citada com Aim, “fonte”, ao lado. Josué lista “Aim e Rimom” por último entre as cidades do sul de Judá, depois dá ambas a Simeão, “Aim, Rimom, Eter e Asã; quatro cidades”; Crônicas as repete entre as aldeias de Simeão, e depois do exílio os homens de Judá moraram “em En-Rimom”, que parece os dois nomes fundidos em um, Aim-Rimom. Zacarias a usa para marcar o extremo sul da terra: no dia do SENHOR “Toda a terra se tornará como a Arabá, desde Geba até Rimom, ao sul de Jerusalém”, da fronteira norte de Judá até sua última cidade, enquanto só Jerusalém se ergue alta."
    - "O nome sobrevive em Khirbet Umm er-Rammamin, hoje Horvat Rimmon, uma ruína com uma sinagoga usada do século III ao VII, escavada no fim da década de 1970 e início da de 1980; Eusébio conhecia uma aldeia Eremom no sul, a dezesseis milhas de Eleuterópolis, o que combina. Ao lado se ergue Tel Halif, um monte com cidade murada das Idades do Bronze e do Ferro, escavado desde a década de 1970, onde costuma ser situada a Rimom da Idade do Ferro, embora outros tenham dado Tel Halif a Ziclague ou Hormá; o mapa mostra os dois locais."
    - "Hoje ambos ficam na floresta de Lahav, em Israel, entre Berseba e Kiryat Gat, junto ao Kibutz Lahav e à cidade beduína de Lakiya."
  de:
    - "Rimmon, „Granatapfel“, war eine Stadt des Negev, des trockenen Südens Judas, stets mit Ajin, „Quelle“, daneben genannt. Josua führt „Ain, Rimmon“ als letzte unter den Städten des Südens Judas auf und gibt dann beide Simeon, „Ain, Rimmon, Ehter, Asan. Das sind vier Städte und ihre Dörfer“; die Chronik wiederholt sie unter Simeons Dörfern, und nach dem Exil wohnten die Männer Judas „zu En-Rimmon“, was wie die beiden zusammengewachsenen Namen aussieht, Ajin-Rimmon. Sacharja gebraucht es, um das Südende des Landes zu bezeichnen: Am Tag des HERRN heißt es: „Und man wird gehen im ganzen Lande umher wie auf einem Gefilde, von Geba nach Rimmon zu, gegen Mittag von Jerusalem“, von der Nordgrenze Judas bis zu seiner letzten Stadt, während Jerusalem allein erhaben steht."
    - "Der Name lebt in Chirbet Umm er-Rammamin fort, heute Horvat Rimmon, einer Ruine mit einer Synagoge, die vom 3. bis 7. Jahrhundert benutzt wurde und in den späten 1970er und frühen 1980er Jahren ausgegraben wurde; Eusebius kannte ein Dorf Eremmon im Süden, sechzehn Meilen von Eleutheropolis, was passt. Daneben erhebt sich Tel Halif, ein Hügel mit einer ummauerten Stadt der Bronze- und Eisenzeit, seit den 1970er Jahren ausgegraben, wo das eisenzeitliche Rimmon meist angesetzt wird, obwohl andere Tel Halif Ziklag oder Horma zugewiesen haben; die Karte zeigt beide Stätten."
    - "Heute liegen beide im Lahav-Wald in Israel, zwischen Beerscheba und Kirjat Gat, beim Kibbuz Lahav und der Beduinenstadt Lakija."
  fr:
    - "Rimmon, « grenade », était une ville du Négev, le sud aride de Juda, toujours nommée avec Aïn, « source », à côté. Josué cite « Aïn, et Rimmon » en dernier parmi les villes du sud de Juda, puis les donne toutes deux à Siméon, « Aïn, Rimmon, Éther, et Aschan, quatre villes » ; les Chroniques les répètent parmi les villages de Siméon, et après l’exil les hommes de Juda habitèrent « à En-Rimmon », qui semble les deux noms soudés en un, Aïn-Rimmon. Zacharie s’en sert pour marquer l’extrémité sud du pays : au jour de l’Éternel, « tout le pays deviendra comme la plaine, de Guéba à Rimmon, au midi de Jérusalem », de la frontière nord de Juda à sa dernière ville, tandis que Jérusalem seule reste élevée."
    - "Le nom survit à Khirbet Umm er-Rammamin, aujourd’hui Horvat Rimmon, ruine avec une synagogue utilisée du IIIe au VIIe siècle, fouillée à la fin des années 1970 et au début des années 1980 ; Eusèbe connaissait un village Eremmon dans le sud, à seize milles d’Éleuthéropolis, ce qui convient. À côté s’élève Tel Halif, tertre avec une ville fortifiée des âges du Bronze et du Fer, fouillé depuis les années 1970, où l’on place d’ordinaire le Rimmon de l’âge du Fer, bien que d’autres aient donné Tel Halif à Tsiklag ou à Horma ; la carte montre les deux sites."
    - "Aujourd’hui, les deux se trouvent dans la forêt de Lahav, en Israël, entre Beer-Schéba et Kiryat Gat, près du kibboutz Lahav et de la ville bédouine de Lakiya."
