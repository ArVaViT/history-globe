body:
  en:
    - "Aroer stood on the northern rim of the Arnon gorge, today's Wadi Mujib, beside the village of Ara'ir in Jordan, about 5 km south-east of Dhiban, the biblical Dibon. In the 1960s a Spanish expedition led by Emilio Olávarri made soundings and then excavations at the site. In Wadi Nukheila, a southern side valley of the Mujib, A. Kloner and C. Ben-David described an ancient built road that they date before the Romans from its construction and from the pottery of the structure guarding the crossing; it linked southern Moab with the north."
    - 'In Deuteronomy, Aroer, "which is by the brink of the river of Arnon", marks the southern end of the land that Israel took from Sihon, king of the Amorites. The children of Gad built Aroer, and Joshua makes it the border of Reuben. Jephthah, answering the king of Ammon, recalls that Israel had dwelt in Heshbon and Aroer and their towns for three hundred years. David''s census began at Aroer, and in the days of Jehu, Hazael of Damascus smote the land of Israel east of the Jordan "from Aroer, which is by the river Arnon, even Gilead and Bashan".'
    - 'About 840 BC, by the usual reckoning, Mesha, king of Moab, wrote on his stele from Dibon: "I built Aroer, and I made the highway at the Arnon". Kloner and Ben-David suggested that their road might be one of Mesha''s works, but where his highway ran is still uncertain. In Jeremiah''s oracle against Moab, Aroer is a Moabite town again: "O inhabitant of Aroer, stand by the way, and espy; ask him that fleeth".'
    - "In AD 106 the land passed into the new Roman province of Arabia, and Trajan's new road, the Via Nova Traiana, crossed the Arnon by the ascent from Dhiban rather than at Aroer. Early in the fourth century Eusebius wrote that Aroer was still pointed out, perched on the brow of the mountain above the gorge where the torrent runs down to the Dead Sea."
  ru:
    - "Ароер стоял на северном краю ущелья Арнона, нынешнего Вади Муджиб, у деревни Араир в Иордании, примерно в 5 км к юго-востоку от Дибана, библейского Дивона. В 1960-х годах испанская экспедиция под руководством Эмилио Олаварри провела здесь сначала разведочные, а затем основные раскопки. В Вади-Нухейла, южной боковой долине Муджиба, А. Клонер и К. Бен-Давид описали древнюю мощёную дорогу, которую они относят к доримскому времени по её устройству и по керамике сооружения, охранявшего переправу; она связывала южный Моав с северным."
    - "Во Второзаконии Ароер, «который на берегу потока Арнона», отмечает южный предел земли, которую Израиль взял у Сигона, царя Аморрейского. Сыны Гадовы построили Ароер, а книга Иисуса Навина делает его пределом Рувима. Иеффай, отвечая царю Аммонитскому, напоминает, что Израиль уже триста лет живёт в Есевоне и Ароере и зависящих от них городах. Перепись Давида началась от Ароера, а во дни Ииуя Азаил Дамасский поражал земли Израиля на восток от Иордана, «начиная от Ароера, который при потоке Арноне, и Галаад и Васан»."
    - "Около 840 г. до н. э., по обычной датировке, Меса, царь Моавитский, написал на своей стеле из Дивона: «Я построил Ароер и проложил дорогу у Арнона». Клонер и Бен-Давид предположили, что их дорога может быть одним из сооружений Месы, но где проходила его дорога, до сих пор неясно. В пророчестве Иеремии о Моаве Ароер снова моавитский город: «Стань у дороги и смотри, обитательница Ароера, спрашивай бегущего»."
    - "В 106 г. н. э. эта земля вошла в новую римскую провинцию Аравия, и Новая Траянова дорога пересекала Арнон по подъёму у Дибана, а не у Ароера. В начале IV века Евсевий писал, что Ароер всё ещё показывают на гребне горы над ущельем, где поток сбегает к Мёртвому морю."
  uk:
    - "Ароер стояв на північному краї ущелини Арнону, нинішнього вадію Муджиб, біля села Араїр в Йорданії, приблизно за 5 км на південний схід від Дібану, біблійного Дівона. У 1960-х роках іспанська експедиція під керівництвом Еміліо Оларварі провела на цьому місці пробні розкопи, а потім і розкопки. У ваді Нухейла, південній бічній долині вадію Муджиб, А. Клонер і К. Бен-Давід описали давню збудовану дорогу, яку вони датують доримським часом за її будовою та за керамікою споруди, що охороняла переправу; вона сполучала південний Моав із північним."
    - "У Второзаконні Ароер, «що по берегах ріки Арнона», позначає південний край землі, яку Ізраїль узяв у Сігона, царя аморіїв. Сини Гада збудували Ароер, а Ісус Навин робить його межею Рувима. Єфтай, відповідаючи цареві Аммона, нагадує, що Ізраїль мешкав у Гесбоні та Ароері і їхніх містах триста років. Перепис Давида почався в Ароері, а за днів Єгу Азаїл Дамаський бив землю Ізраїлю на схід від Йордану «від Ароеру на Арнон ріцї, й Галаад і Басан»."
    - "Близько 840 р. до н. е., за звичайним рахунком, Меша, цар Моава, написав на своїй стелі з Дівона: «Я збудував Ароер і зробив дорогу над Арноном». Клонер і Бен-Давід припустили, що їхня дорога може бути однією з будов Меші, але де пролягав його шлях, досі непевно. У пророцтві Єремії проти Моава Ароер знову моавське місто: «Стань при дорозї, сусїдко-осаднице Ароерська, питай у тих, що, втїкаючи, шукають рятунку»."
    - "У 106 р. н. е. земля перейшла до нової римської провінції Аравія, і нова дорога Траяна, Via Nova Traiana, перетинала Арнон по підйому від Дібану, а не в Ароері. На початку IV століття Євсевій писав, що Ароер ще показували, ніби примощений на чолі гори над ущелиною, де потік збігає до Мертвого моря."
  es:
    - "Aroer se alzaba en el borde septentrional de la garganta del Arnón, el actual uadi Mujib, junto a la aldea de Ara'ir, en Jordania, a unos 5 km al sudeste de Dhiban, la Dibón bíblica. En la década de 1960 una expedición española dirigida por Emilio Olávarri hizo sondeos y luego excavaciones en el sitio. En el uadi Nukheila, un valle lateral meridional del Mujib, A. Kloner y C. Ben-David describieron un antiguo camino construido que fechan antes de los romanos por su construcción y por la cerámica de la estructura que guardaba el paso; unía el sur de Moab con el norte."
    - "En el Deuteronomio, Aroer, «que está junto á la ribera del arroyo de Arnón», marca el extremo meridional de la tierra que Israel tomó a Sehón, rey de los amorreos. Los hijos de Gad edificaron Aroer, y Josué la hace frontera de Rubén. Jefté, respondiendo al rey de Amón, recuerda que Israel había habitado en Hesbón y Aroer y sus ciudades durante trescientos años. El censo de David comenzó en Aroer, y en los días de Jehú, Hazael de Damasco hirió la tierra de Israel al este del Jordán «desde Aroer que está junto al arroyo de Arnón, á Galaad y á Basán»."
    - "Hacia 840 a. C., según el cómputo habitual, Mesa, rey de Moab, escribió en su estela de Dibón: «Yo construí Aroer, e hice la calzada en el Arnón». Kloner y Ben-David sugirieron que su camino podría ser una de las obras de Mesa, pero por dónde pasaba su calzada sigue siendo incierto. En el oráculo de Jeremías contra Moab, Aroer vuelve a ser una ciudad moabita: «Párate en el camino, y mira, oh moradora de Aroer: pregunta á la que va huyendo»."
    - "En 106 d. C. la tierra pasó a la nueva provincia romana de Arabia, y el nuevo camino de Trajano, la Vía Nova Traiana, cruzó el Arnón por la subida desde Dhiban y no por Aroer. A principios del siglo IV Eusebio escribió que todavía se señalaba Aroer, encaramada en la frente de la montaña sobre la garganta por donde el torrente desciende al mar Muerto."
  pt:
    - "Aroer ficava na borda setentrional do desfiladeiro do Arnom, o atual uádi Mujib, junto à aldeia de Ara'ir, na Jordânia, cerca de 5 km a sudeste de Dhiban, a Dibom bíblica. Na década de 1960, uma expedição espanhola dirigida por Emilio Olávarri fez sondagens e depois escavações no sítio. No uádi Nukheila, um vale lateral meridional do Mujib, A. Kloner e C. Ben-David descreveram uma antiga estrada construída que datam de antes dos romanos por sua construção e pela cerâmica da estrutura que guardava a travessia; ela ligava o sul de Moabe ao norte."
    - "Em Deuteronômio, Aroer, “que está à beira do vale do Arnom”, marca o extremo sul da terra que Israel tomou de Seom, rei dos amorreus. Os filhos de Gade construíram Aroer, e Josué a faz fronteira de Rúben. Jefté, respondendo ao rei de Amom, lembra que Israel habitara em Hesbom e em Aroer e em seus povoados por trezentos anos. O recenseamento de Davi começou em Aroer, e nos dias de Jeú, Hazael de Damasco feriu a terra de Israel a leste do Jordão “desde Aroer, que fica junto ao vale do Arnom, até Gileade e Basã”."
    - "Por volta de 840 a.C., segundo o cálculo habitual, Mesa, rei de Moabe, escreveu em sua estela de Dibom: “Eu construí Aroer, e fiz a estrada no Arnom”. Kloner e Ben-David sugeriram que sua estrada poderia ser uma das obras de Mesa, mas por onde passava a rodovia dele ainda é incerto. No oráculo de Jeremias contra Moabe, Aroer é de novo uma cidade moabita: “Habitante de Aroer, fique junto ao caminho e observe. Pergunte ao que foge”."
    - "Em 106 d.C. a terra passou à nova província romana da Arábia, e a nova estrada de Trajano, a Via Nova Traiana, cruzou o Arnom pela subida de Dhiban, e não em Aroer. No início do século IV, Eusébio escreveu que Aroer ainda era mostrada, empoleirada na fronte da montanha acima do desfiladeiro por onde a torrente desce ao mar Morto."
  de:
    - "Aroër lag am Nordrand der Arnonschlucht, des heutigen Wadi Mudschib, beim Dorf Ara'ir in Jordanien, etwa 5 km südöstlich von Dhiban, dem biblischen Dibon. In den 1960er Jahren nahm eine spanische Expedition unter Emilio Olávarri dort Sondierungen und dann Grabungen vor. Im Wadi Nucheila, einem südlichen Seitental des Mudschib, beschrieben A. Kloner und C. Ben-David eine antike gebaute Straße, die sie nach ihrer Bauweise und nach der Keramik des Bauwerks, das den Übergang bewachte, in vorrömische Zeit datieren; sie verband das südliche Moab mit dem Norden."
    - "Im Fünften Buch Mose markiert Aroër, „das am Ufer des Bachs Arnon liegt“, das Südende des Landes, das Israel Sihon, dem König der Amoriter, abnahm. Die Kinder Gad bauten Aroër, und Josua macht es zur Grenze Rubens. Jeftah erinnert in seiner Antwort an den König von Ammon, dass Israel dreihundert Jahre in Heschbon und Aroër und ihren Orten gewohnt habe. Davids Zählung begann bei Aroër, und in Jehus Tagen schlug Hasaël von Damaskus das Land Israel östlich des Jordan „von Aroer an, das am Bach Arnon liegt, so Gilead wie Basan“."
    - "Um 840 v. Chr. nach üblicher Rechnung schrieb Mesa, der König von Moab, auf seine Stele aus Dibon: „Ich baute Aroër, und ich machte die Straße am Arnon.“ Kloner und Ben-David vermuteten, ihre Straße könnte eines der Werke Mesas sein, doch wo seine Straße verlief, ist weiterhin unsicher. In Jeremias Spruch gegen Moab ist Aroër wieder eine moabitische Stadt: „Tritt auf die Straße und schaue, du Einwohnerin Aroers; frage die, so da fliehen und entrinnen“."
    - "106 n. Chr. kam das Land an die neue römische Provinz Arabien, und Trajans neue Straße, die Via Nova Traiana, überquerte den Arnon am Aufstieg von Dhiban statt bei Aroër. Im frühen 4. Jahrhundert schrieb Eusebius, Aroër werde noch gezeigt, auf der Stirn des Berges über der Schlucht, wo der Bach zum Toten Meer hinabfließt."
  fr:
    - "Aroër se dressait sur le bord nord de la gorge de l’Arnon, l’actuel Wadi Mujib, près du village d’Ara’ir, en Jordanie, à environ 5 km au sud-est de Dhiban, la Dibon biblique. Dans les années 1960, une expédition espagnole dirigée par Emilio Olávarri fit des sondages puis des fouilles sur le site. Dans le Wadi Nukheila, vallée latérale méridionale du Mujib, A. Kloner et C. Ben-David ont décrit une ancienne route construite qu’ils datent d’avant les Romains d’après sa construction et la poterie de l’ouvrage qui gardait le passage ; elle reliait le sud de Moab au nord."
    - "Dans le Deutéronome, « Aroër sur les bords du torrent de l’Arnon » marque l’extrémité sud du pays qu’Israël prit à Sihon, roi des Amoréens. Les enfants de Gad bâtirent Aroër, et Josué en fait la limite de Ruben. Jephté, répondant au roi d’Ammon, rappelle qu’Israël avait habité Hesbon et Aroër et leurs villes pendant trois cents ans. Le dénombrement de David commença à Aroër, et du temps de Jéhu, Hazaël de Damas battit le pays d’Israël à l’est du Jourdain « depuis Aroër sur le torrent de l’Arnon jusqu’à Galaad et à Basan »."
    - "Vers 840 av. J.-C., selon le calcul habituel, Mescha, roi de Moab, écrivit sur sa stèle de Dibon : « J’ai bâti Aroër, et j’ai fait la route de l’Arnon ». Kloner et Ben-David ont suggéré que leur route pourrait être l’un des ouvrages de Mescha, mais le tracé de sa route reste incertain. Dans l’oracle de Jérémie contre Moab, Aroër est de nouveau une ville moabite : « Tiens-toi sur le chemin, et regarde, habitante d’Aroër ! Interroge le fuyard »."
    - "En 106 apr. J.-C., le pays passa à la nouvelle province romaine d’Arabie, et la nouvelle route de Trajan, la Via Nova Traiana, franchit l’Arnon par la montée de Dhiban et non à Aroër. Au début du IVe siècle, Eusèbe écrivait qu’on montrait encore Aroër, perchée au front de la montagne au-dessus de la gorge où le torrent descend vers la mer Morte."
  it:
    - "Aroer sorgeva sul bordo settentrionale della gola dell’Arnon, l’odierno Wadi Mujib, accanto al villaggio di Ara‘ir in Giordania, a circa 5 km a sud-est di Dhiban, la Dibon biblica. Negli anni Sessanta una spedizione spagnola guidata da Emilio Olávarri compì sul sito sondaggi e poi scavi. Nel Wadi Nukheila, una valle laterale meridionale del Mujib, A. Kloner e C. Ben-David hanno descritto un’antica strada costruita che datano a prima dei Romani in base alla sua costruzione e alla ceramica della struttura che sorvegliava il passaggio; collegava il Moab meridionale con il nord."
    - "Nel Deuteronomio Aroer, «che è sull’orlo della valle dell’Arnon», segna l’estremità meridionale della terra che Israele tolse a Sicon, re degli Amorei. I figli di Gad costruirono Aroer, e Giosuè ne fa il confine di Ruben. Iefte, rispondendo al re di Ammon, ricorda che Israele aveva abitato a Chesbon e ad Aroer e nelle loro città per trecento anni. Il censimento di Davide cominciò ad Aroer, e ai giorni di Ieu, Cazaèl di Damasco sconfisse il paese d’Israele a est del Giordano «fino ad Aroer ch’è presso la valle dell’Arnon, vale a dire tutto il paese di Galaad e di Bashan»."
    - "Intorno all’840 a.C., secondo il computo abituale, Mesa, re di Moab, scrisse sulla sua stele da Dibon: «Io ho costruito Aroer e ho fatto la strada sull’Arnon». Kloner e Ben-David hanno suggerito che la loro strada potrebbe essere una delle opere di Mesa, ma dove passasse la sua via resta incerto. Nell’oracolo di Geremia contro Moab, Aroer è di nuovo una città moabita: «O tu che abiti in Aroer, fermati per la strada, e guarda; interroga il fuggiasco»."
    - "Nel 106 d.C. il paese passò alla nuova provincia romana d’Arabia, e la nuova strada di Traiano, la Via Nova Traiana, attraversò l’Arnon per la salita da Dhiban anziché ad Aroer. All’inizio del IV secolo Eusebio scrisse che Aroer veniva ancora indicata, appollaiata sul ciglio del monte sopra la gola dove il torrente scende al Mar Morto."
  pl:
    - "Aroer leżało na północnym skraju wąwozu Arnonu, dzisiejszego Wadi Mujib, obok wsi Ara'ir w Jordanii, około 5 km na południowy wschód od Dhiban, biblijnego Dibonu. W latach 60. hiszpańska wyprawa pod kierunkiem Emilia Olávarriego wykonała tam sondaże, a potem wykopaliska. W Wadi Nukheila, południowej bocznej dolinie Wadi Mujib, A. Kloner i C. Ben-David opisali dawną zbudowaną drogę, którą datują na czasy przedrzymskie na podstawie jej budowy i ceramiki z budowli strzegącej przeprawy; łączyła ona południowy Moab z północnym."
    - "W Księdze Powtórzonego Prawa Aroer, „które leży nad brzegiem potoku Arnon”, wyznacza południowy kraniec ziemi, którą Izrael zabrał Sychonowi, królowi Amorejczyków. Synowie Gada zbudowali Aroer, a Jozue czyni je granicą Rubena. Jefte, odpowiadając królowi Ammonu, przypomina, że Izrael mieszkał w Cheszbonie i Aroer oraz ich miastach przez trzysta lat. Spis ludności Dawida zaczął się w Aroer, a za dni Jehu Chazael z Damaszku pobił ziemię Izraela na wschód od Jordanu „od Aroer, które jest u potoku Arnon, i Galaad, i Basan”."
    - "Około 840 r. p.n.e., według zwykłej rachuby, Mesza, król Moabu, napisał na swej steli z Dibonu: „Zbudowałem Aroer i uczyniłem drogę nad Arnonem”. Kloner i Ben-David sugerowali, że ich droga może być jednym z dzieł Meszy, lecz gdzie biegła jego droga, wciąż nie wiadomo. W wyroczni Jeremiasza przeciw Moabowi Aroer jest znów miastem moabickim: „Stań na drodze a przypatrz się pilnie, obywatelko Aroer! pytaj tego, który ucieka”."
    - "W 106 r. n.e. ziemia weszła w skład nowej rzymskiej prowincji Arabia, a nowa droga Trajana, Via Nova Traiana, przekraczała Arnon podjazdem od Dhiban, nie w Aroer. Na początku IV wieku Euzebiusz pisał, że Aroer wciąż wskazywano, wzniesione na krawędzi góry nad wąwozem, którym potok spływa do Morza Martwego."
  nl:
    - "Aroër lag op de noordrand van de Arnonkloof, de huidige Wadi Mujib, naast het dorp Ara’ir in Jordanië, zo’n 5 km ten zuidoosten van Dhiban, het bijbelse Dibon. In de jaren zestig deed een Spaanse expeditie onder leiding van Emilio Olávarri er proefsleuven en daarna opgravingen. In de Wadi Nukheila, een zuidelijk zijdal van de Mujib, beschreven A. Kloner en C. Ben-David een oude aangelegde weg die zij op grond van de bouwwijze en van het aardewerk van het bouwwerk dat de oversteek bewaakte vóór de Romeinen dateren; hij verbond het zuiden van Moab met het noorden."
    - "In Deuteronomium markeert Aroër, “dat aan den oever der beek Arnon is”, het zuidelijke einde van het land dat Israël van Sihon, de koning der Amorieten, nam. De kinderen van Gad bouwden Aroër, en Jozua maakt het tot de grens van Ruben. Jefta, de koning van Ammon antwoordend, herinnert eraan dat Israël driehonderd jaar in Chesbon en Aroër en hun steden had gewoond. Davids volkstelling begon bij Aroër, en in Jehu’s dagen sloeg Hazaël van Damascus het land Israël ten oosten van de Jordaan “van Aroer, dat aan de beek van Arnon is, en Gilead, en Basan”."
    - "Omstreeks 840 v.Chr., volgens de gebruikelijke berekening, schreef Mesa, koning van Moab, op zijn stèle uit Dibon: “Ik bouwde Aroër en legde de grote weg aan bij de Arnon”. Kloner en Ben-David opperden dat hun weg een van Mesa’s werken zou kunnen zijn, maar waar zijn grote weg liep, is nog onzeker. In Jeremia’s godsspraak tegen Moab is Aroër weer een Moabitische stad: “Sta aan den weg, en zie toe, gij inwoneres van Aroer! Vraag den vluchtenden man”."
    - "In 106 n.Chr. ging het land over in de nieuwe Romeinse provincie Arabië, en Trajanus’ nieuwe weg, de Via Nova Traiana, stak de Arnon over via de beklimming vanuit Dhiban in plaats van bij Aroër. Begin vierde eeuw schreef Eusebius dat Aroër nog werd aangewezen, gelegen op de rand van de berg boven de kloof waar de bergstroom naar de Dode Zee stort."
  cs:
    - "Aroer stál na severním okraji soutěsky Arnonu, dnešního vádí Mujib, u vesnice Ara'ir v Jordánsku, asi 5 km jihovýchodně od Dhibánu, biblického Dibonu. V 60. letech 20. století provedla španělská expedice vedená Emiliem Olávarrim na místě sondy a poté vykopávky. Ve vádí Nukheila, jižním postranním údolí vádí Mujib, popsali A. Kloner a C. Ben-David starověkou budovanou cestu, kterou podle její stavby a podle keramiky ze stavby střežící přechod datují do doby před Římany; spojovala jižní Moáb se severním."
    - "V Deuteronomiu označuje Aroer, „jenž jest na břehu potoka Arnon“, jižní konec země, kterou Izrael vzal Sichonovi, králi Amorejských. Synové Gádovi „vzdělali … Dibon, Atarot a Aroer“ a Jozue z něj činí hranici Rúbenovu. Jiftách, odpovídaje králi Amónovu, připomíná, že Izrael bydlel v Chešbónu a v Aroeru a v jejich městech tři sta let. Davidovo sčítání začalo v Aroeru a za Jehúových dnů Chazael Damašský pobil izraelskou zemi východně od Jordánu „od Aroer, kteréž jest při potoku Arnon, tak Galád jako Bázan“."
    - "Kolem roku 840 př. n. l., podle obvyklého počtu, napsal Meša, král Moábu, na své stéle z Dibonu: „Já jsem vystavěl Aroer a já jsem učinil cestu u Arnonu.“ Kloner a Ben-David naznačili, že jejich cesta by mohla být jedním z Mešových děl, ale kudy jeho cesta vedla, je stále nejisté. V Jeremjášově proroctví proti Moábu je Aroer opět moábským městem: „Postav se na cestě, a ohlédni se pilně, obyvatelkyně Aroer; vyptej se toho, kdož utíká“."
    - "Roku 106 n. l. země přešla do nové římské provincie Arábie a Traianova nová silnice, Via Nova Traiana, překročila Arnon na stoupání z Dhibánu, nikoli u Aroeru. Na počátku 4. století napsal Eusebios, že Aroer se stále ukazuje, posazený na čele hory nad soutěskou, kudy se bystřina řítí k Mrtvému moři."
  sv:
    - "Aroer låg på norra kanten av Arnonklyftan, i dag Wadi Mujib, vid byn Ara'ir i Jordanien, omkring 5 km sydost om Dhiban, det bibliska Dibon. På 1960-talet gjorde en spansk expedition under Emilio Olávarri provgrävningar och sedan utgrävningar på platsen. I Wadi Nukheila, en sidodal söder om Mujib, beskrev A. Kloner och C. Ben-David en forntida byggd väg som de daterar till före romarna utifrån dess konstruktion och keramiken från den byggnad som bevakade övergången; den förband södra Moab med norr."
    - "I Femte Mosebok markerar Aroer, ”vid bäcken Arnons strand”, södra änden av det land som Israel tog från Sichon, amoréernas kung. Gads barn byggde upp Aroer, och Josua gör det till Rubens gräns. Jefta, som svarar ammoniternas kung, påminner om att Israel hade bott i Heshbon och Aroer och deras städer i tre hundra år. Davids folkräkning började vid Aroer, och på Jehus tid slog Hasael av Damaskus Israels land öster om Jordan ”från Aroer vid bäcken Arnon, både Gilead och Basan”."
    - "Omkring 840 f.Kr., enligt den vanliga beräkningen, skrev Mesha, Moabs kung, på sin stele från Dibon: ”Jag byggde Aroer, och jag gjorde vägen vid Arnon”. Kloner och Ben-David föreslog att deras väg kan vara ett av Meshas verk, men var hans väg löpte är fortfarande osäkert. I Jeremias utsaga mot Moab är Aroer åter en moabitisk stad: ”Ställ dig vid vägen och spela omkring dig, du Aroers folk; fråga männen som fly och kvinnorna som söka rädda sig”."
    - "År 106 e.Kr. gick landet in i den nya romerska provinsen Arabien, och Trajanus’ nya väg, Via Nova Traiana, korsade Arnon vid uppstigningen från Dhiban i stället för vid Aroer. I början av 300-talet skrev Eusebios att Aroer ännu pekades ut, uppflugen på bergets rand ovanför klyftan där forsen rinner ned mot Döda havet."
  nb:
    - "Aroer lå på nordkanten av Arnon-kløften, dagens Wadi Mujib, ved landsbyen Ara'ir i Jordan, omtrent 5 km sørøst for Dhiban, det bibelske Dibon. På 1960-tallet foretok en spansk ekspedisjon ledet av Emilio Olávarri prøvegravinger og så utgravninger på stedet. I Wadi Nukheila, en sørlig sidedal til Mujib, beskrev A. Kloner og C. Ben-David en gammel anlagt vei som de daterer til før romerne ut fra byggemåten og ut fra keramikken i konstruksjonen som voktet overgangen; den forbandt sørlige Moab med nord."
    - "I 5. Mosebok markerer Aroer, «som ligger ved bredden av Arnon-åen», sørenden av landet Israel tok fra Sihon, amorittenes konge. Gads barn bygde opp Aroer igjen, og Josva gjør den til grensen for Ruben. Jefta minner i svaret til kongen av Ammon om at Israel hadde bodd i Hesjbon og Aroer og byene deres i tre hundre år. Davids folketelling begynte ved Aroer, og i Jehus dager slo Hasael av Damaskus Israels land øst for Jordan «like fra Aroer ved Arnon-åen, både Gilead og Basan»."
    - "Omkring 840 f.Kr., etter den vanlige beregningen, skrev Mesa, konge av Moab, på steleen sin fra Dibon: «Jeg bygde Aroer, og jeg lagde veien ved Arnon». Kloner og Ben-David antydet at deres vei kan være et av Mesas verk, men hvor hans vei gikk, er fortsatt usikkert. I Jeremias utsagn mot Moab er Aroer igjen en moabittisk by: «Still dig ved veien og se ut, du som bor i Aroer! Spør de flyktende og undkomne»."
    - "I 106 e.Kr. gikk landet inn i den nye romerske provinsen Arabia, og Trajans nye vei, Via Nova Traiana, krysset Arnon ved oppstigningen fra Dhiban snarere enn ved Aroer. Tidlig på 300-tallet skrev Eusebius at Aroer fortsatt ble pekt ut, plassert på fjellbrynet over kløften der strømmen renner ned til Dødehavet."
  tl:
    - "Ang Aroer ay nakatayo sa hilagang gilid ng bangin ng Arnon, ang Wadi Mujib ngayon, sa tabi ng nayon ng Ara'ir sa Jordan, mga 5 km sa timog-silangan ng Dhiban, ang Dibon ng Biblia. Noong dekada 1960, gumawa ang isang ekspedisyong Espanyol na pinamunuan ni Emilio Olávarri ng mga pagsubok na hukay at pagkatapos ay mga paghuhukay sa lugar. Sa Wadi Nukheila, isang katimugang gilid na libis ng Mujib, inilarawan nina A. Kloner at C. Ben-David ang isang sinaunang daang itinayo na ipinetsa nilang bago ang mga Romano mula sa pagkakagawa nito at sa palayok ng istrukturang nagbabantay sa tawiran; ikinonekta nito ang timog Moab sa hilaga."
    - "Sa Deuteronomio, ang Aroer, “na nasa tabi ng libis ng Arnon”, ay nagmamarka ng katimugang dulo ng lupaing kinuha ng Israel kay Sehon, hari ng mga Amorrheo. Itinayo ng mga anak ni Gad ang Aroer, at ginagawa itong hangganan ng Ruben ni Josue. Si Jephte, sa pagsagot sa hari ng Ammon, ay nagpapaalala na tumira ang Israel sa Hesbon at Aroer at sa mga bayan nila nang tatlong daang taon. Nagsimula ang sensus ni David sa Aroer, at sa mga araw ni Jehu, sinaktan ni Hazael ng Damasco ang lupain ng Israel sa silangan ng Jordan “mula sa Aroer, na nasa siping ng libis ng Arnon, hanggang sa Galaad at Basan”."
    - "Mga 840 BK, ayon sa karaniwang pagbilang, isinulat ni Mesa, hari ng Moab, sa kaniyang estela mula Dibon: “Itinayo ko ang Aroer, at ginawa ko ang lansangan sa Arnon”. Iminungkahi nina Kloner at Ben-David na ang kanilang daan ay maaaring isa sa mga gawa ni Mesa, ngunit hindi pa tiyak kung saan dumaan ang kaniyang lansangan. Sa hula ni Jeremias laban sa Moab, bayan muli ng Moab ang Aroer: “Oh nananahan sa Aroer, tumayo ka sa tabi ng daan, at manubok ka: itanong mo sa kaniya na tumatakas”."
    - "Noong 106 AD, napunta ang lupain sa bagong lalawigang Romano ng Arabia, at ang bagong daan ni Trajano, ang Via Nova Traiana, ay tumawid sa Arnon sa pag-akyat mula Dhiban sa halip na sa Aroer. Noong unang bahagi ng ika-4 na siglo, isinulat ni Eusebio na itinuturo pa ang Aroer, nakadapo sa gilid ng bundok sa itaas ng bangin kung saan bumababa ang agos patungo sa Dagat na Patay."
  da:
    - "Aroer lå på nordranden af Arnon-slugten, nutidens Wadi Mujib, ved landsbyen Ara'ir i Jordan, omkring 5 km sydøst for Dhiban, det bibelske Dibon. I 1960'erne foretog en spansk ekspedition under Emilio Olávarri prøvegravninger og siden udgravninger på stedet. I Wadi Nukheila, en sydlig sidedal til Mujib, beskrev A. Kloner og C. Ben-David en gammel anlagt vej, som de daterer til før romerne ud fra dens anlæg og keramikken fra bygningen, der vogtede overgangen; den forbandt det sydlige Moab med nord."
    - "I Femte Mosebog markerer Aroer, »som ligger ved Bredden af Arnons Bæk«, den sydlige ende af det land, Israel tog fra Sihon, amoriternes konge. Gads børn byggede Aroer, og Josva gør det til Rubens grænse. Jefta, der svarer Ammons konge, minder om, at Israel havde boet i Hesjbon og Aroer og deres byer i tre hundrede år. Davids folketælling begyndte ved Aroer, og i Jehus dage slog Hazael af Damaskus Israels land øst for Jordan »fra Aroer, som er ved Arnons Bæk, baade Gilead og Basan«."
    - "Omkring 840 f.Kr., efter den sædvanlige beregning, skrev Mesja, Moabs konge, på sin stele fra Dibon: »Jeg byggede Aroer, og jeg anlagde vejen ved Arnon«. Kloner og Ben-David foreslog, at deres vej kunne være et af Mesjas værker, men hvor hans vej løb, er stadig usikkert. I Jeremias' udsagn mod Moab er Aroer igen en moabitisk by: »Stil dig ved Vejen og se dig om, du Aroers Indbyggerske! spørg ham, som er flygtet«."
    - "I 106 e.Kr. gik landet over i den nye romerske provins Arabien, og Trajans nye vej, Via Nova Traiana, krydsede Arnon ved stigningen fra Dhiban snarere end ved Aroer. I begyndelsen af 300-tallet skrev Eusebios, at Aroer stadig blev udpeget, siddende på bjergets pande over slugten, hvor strømmen løber ned til Det Døde Hav."
  sr:
    - "Ароир је стајао на северном ободу клисуре Арнона, данашњег Вади Муџиба, поред села Араир у Јордану, око 5 км југоисточно од Дибана, библијског Девона. Шездесетих година 20. века шпанска експедиција коју је водио Емилио Олаварри вршила је на налазишту сондирања, а затим ископавања. У Вади Нукхејли, јужној бочној долини Муџиба, А. Клонер и К. Бен-Давид описали су древни грађени пут који датирају пре Римљана по начину градње и по керамици грађевине која је чувала прелаз; повезивао је јужни Моав са северним."
    - "У Поновљеном закону Ароир, „који је на потоку Арнону“, означава јужни крај земље коју је Израиљ узео од Сиона, цара аморејског. Синови Гадови саградили су Ароир, а Исус Навин га чини међом Рувимовом. Јефтај, одговарајући цару Амонову, подсећа да је Израиљ у Есевону и Ароиру и њиховим градовима живео три стотине година. Давидово пребројавање почело је у Ароиру, а у Јујево доба Азаило из Дамаска ударио је на земљу Израиљеву источно од Јордана „од Ароира на потоку Арнону, и Галад и Васан“."
    - "Око 840. п. н. е., по уобичајеном рачунању, Миса, цар Моава, написао је на својој стели из Девона: „Ја сам саградио Ароир и направио пут на Арнону“. Клонер и Бен-Давид су предложили да њихов пут може бити једно од Мисиних дела, али где је ишао његов пут, још је неизвесно. У Јеремијином пророштву против Моава Ароир је поново моавски град: „Стани на путу, и погледај, која живиш у Ароиру, упитај оног који бежи“."
    - "Године 106. н. е. земља је прешла у нову римску провинцију Арабију, а Трајанов нови пут, Виа Нова Трајана, прелазио је Арнон успоном од Дибана, а не код Ароира. Почетком 4. века Јевсевије је писао да се Ароир још показује, подигнут на челу планине изнад клисуре где бујица силази у Мртво море."
  hu:
    - "Aróer az Arnon-szurdok északi peremén állt, a mai Wadi Mujib mellett, Ara'ir falu mellett Jordániában, a bibliai Dibon, Dhiban városától mintegy 5 km-re délkeletre. Az 1960-as években Emilio Olávarri vezette spanyol expedíció végzett ott szondázást, majd ásatást. A Mujib déli oldalvölgyében, a Wadi Nukheilában A. Kloner és C. Ben-David leírt egy ősi épített utat, amelyet a római kor előttre keltez az építési módja és az átkelőt őrző építmény kerámiája alapján; összekötötte Dél-Moábot az északi résszel."
    - "A Deuteronomiumban Aróer, „a mely van az Arnon patakának partján”, azon föld déli végét jelöli, amelyet Izráel Szihon emoreus királytól vett el. Gád fiai megépítették Aróert, Józsué pedig Rúben határává teszi. Jefte az ammoni királynak válaszolva felidézi, hogy Izráel háromszáz éven át lakott Hesbonban és Aróerben és városaikban. Dávid népszámlálása Aróernél kezdődött, Jéhu napjaiban pedig Házael damaszkuszi király megverte Izráel Jordántól keletre fekvő földjét: „Aroertől fogva; mely az Arnon patak mellett van, mind Gileádot, mind Básánt”."
    - "Kr. e. 840 körül, a szokásos számítás szerint, Mésa, Moáb királya a dibóni sztéléjére ezt írta: „Én építettem Aróert, és én csináltam az országutat az Arnonnál.” Kloner és Ben-David feltételezte, hogy útjuk Mésa egyik műve lehet, de hogy országútja hol húzódott, még bizonytalan. Jeremiás Moáb elleni jövendölésében Aróer ismét moábi város: „Állj meg az úton, és nézz ide-oda Aroér lakosa, kérdezd meg a futót és a menekülőt”."
    - "Kr. u. 106-ban a föld Arábia új római provinciájához került, Traianus új útja, a Via Nova Traiana pedig a Dhibanból induló emelkedőn kelt át az Arnonon, nem Aróernél. A 4. század elején Euszébiosz azt írta, hogy Aróert még mutatták, a szurdok fölötti hegy homlokán, ahol a patak a Holt-tengerbe fut le."
  fi:
    - "Aroer sijaitsi Arnonin rotkon, nykyisen Wadi Mujibin, pohjareunalla Ara'irin kylän vieressä Jordaniassa, noin 5 km Dhibanista, Raamatun Dibonista, kaakkoon. 1960-luvulla Emilio Olávarrin johtama espanjalainen retkikunta teki paikalla koekaivauksia ja sitten kaivauksia. Wadi Nukheilassa, Mujibin eteläisessä sivulaaksossa, A. Kloner ja C. Ben-David kuvasivat muinaisen rakennetun tien, jonka he ajoittavat roomalaisia edeltäväksi sen rakenteen ja ylityspaikkaa vartioineen rakennelman keramiikan perusteella; se yhdisti eteläisen Moabin pohjoiseen."
    - "5. Mooseksen kirjassa Aroer, ”joka on Arnon-joen rannalla”, merkitsee sen maan eteläpäätä, jonka Israel otti Sihonilta, amorilaisten kuninkaalta. Gadin lapset rakensivat Aroerin, ja Joosua tekee siitä Ruubenin rajan. Jefta, vastatessaan Ammonin kuninkaalle, muistuttaa Israelin asuneen Hesbonissa ja Aroerissa kaupunkeineen kolmesataa vuotta. Daavidin väenlasku alkoi Aroerista, ja Jehun päivinä Damaskoksen Hasael löi Israelin maan Jordanin itäpuolella, ”alkaen Aroerista, joka on Arnon-joen rannalla – sekä Gileadin että Baasanin”."
    - "Noin 840 eaa. tavanomaisen laskelman mukaan Mesa, Moabin kuningas, kirjoitti Dibonista peräisin olevaan steelaansa: ”Minä rakensin Aroerin ja tein valtatien Arnonilla”. Kloner ja Ben-David ehdottivat, että heidän tiensä saattaisi olla yksi Mesan töistä, mutta missä hänen valtatiensä kulki, on yhä epävarmaa. Jeremian ennustuksessa Moabia vastaan Aroer on jälleen moabilainen kaupunki: ”Seiso tiellä ja tähystele, sinä Aroerin asukas; kysy pakolaisilta ja pelastuneilta”."
    - "Vuonna 106 jaa. maa liitettiin Rooman uuteen Arabian provinssiin, ja Trajanuksen uusi tie, Via Nova Traiana, ylitti Arnonin Dhibanista johtavaa nousua pitkin eikä Aroerin kohdalla. 300-luvun alussa Eusebios kirjoitti, että Aroer oli yhä näytettävissä, vuoren harjalla rotkon yläpuolella, missä puro laskee alas Kuolleellemerelle."
  vi:
    - "A-rô-e nằm trên rìa phía bắc của hẻm núi Ạt-nôn, nay là Wadi Mujib, bên làng Ara'ir ở Gióc-đa-ni, cách Dhiban, tức Đi-bôn trong Kinh Thánh, khoảng 5 km về phía đông nam. Vào những năm 1960, một đoàn thám hiểm Tây Ban Nha do Emilio Olávarri dẫn đầu đã đào thăm dò rồi khai quật tại địa điểm. Ở Wadi Nukheila, một thung lũng nhánh phía nam của Mujib, A. Kloner và C. Ben-David mô tả một con đường xây cổ mà họ định niên đại trước thời La Mã dựa vào cách xây và đồ gốm của công trình canh giữ chỗ băng qua; nó nối miền nam Mô-áp với miền bắc."
    - "Trong sách Phục Truyền Luật Lệ Ký, A-rô-e, “ở trên mé khe Ạt-nôn”, đánh dấu cực nam của vùng đất mà Y-sơ-ra-ên lấy từ Si-hôn, vua dân A-mô-rít. Con cháu Gát xây A-rô-e, và Giô-suê coi nó là ranh giới của Ru-bên. Giép-thê, trả lời vua Am-môn, nhắc rằng Y-sơ-ra-ên đã ở tại Hết-bôn và A-rô-e cùng các thành địa hạt của chúng ba trăm năm. Cuộc kiểm tra dân số của Đa-vít bắt đầu từ A-rô-e, và vào đời Giê-hu, Ha-xa-ên của Đa-mách đánh xứ Y-sơ-ra-ên phía đông sông Giô-đanh “từ thành A-rô-e, ở trên khe Ạt-nôn, và cho đến cả xứ Ga-la-át và xứ Ba-san”."
    - "Khoảng năm 840 TCN, theo cách tính thông thường, Mê-sa, vua Mô-áp, viết trên bia của mình từ Đi-bôn: “Ta đã xây A-rô-e, và ta đã làm con đường cao tại Ạt-nôn”. Kloner và Ben-David gợi ý rằng con đường của họ có thể là một công trình của Mê-sa, nhưng con đường của ông chạy ở đâu vẫn chưa chắc chắn. Trong lời sấm của Giê-rê-mi nghịch cùng Mô-áp, A-rô-e lại là một thành của Mô-áp: “Hỡi dân cư A-rô-e! Hãy đứng bên đường và ngó. Hãy hỏi đàn ông đi trốn”."
    - "Năm 106, xứ này chuyển vào tỉnh La Mã mới A-ra-bi, và con đường mới của Trajanus, Via Nova Traiana, vượt Ạt-nôn bằng con dốc từ Dhiban chứ không phải tại A-rô-e. Đầu thế kỷ 4, Eusebius viết rằng A-rô-e vẫn còn được chỉ ra, ngự trên bờ núi phía trên hẻm núi nơi dòng nước chảy xuống Biển Chết."
  ro:
    - "Aroer se afla pe marginea de nord a defileului Arnon, astăzi Wadi Mujib, lângă satul Ara'ir din Iordania, la aproximativ 5 km sud-est de Dhiban, biblicul Dibon. În anii 1960, o expediție spaniolă condusă de Emilio Olávarri a făcut acolo sondaje și apoi săpături. În Wadi Nukheila, o vale laterală sudică a Mujibului, A. Kloner și C. Ben-David au descris un vechi drum construit, pe care îl datează înaintea romanilor după construcția lui și după ceramica structurii care păzea trecerea; el lega sudul Moabului de nord."
    - "În Deuteronom, Aroer, „care este în marginea rîului Arnonului”, marchează capătul de sud al țării pe care Israel a luat-o de la Sihon, regele amoriților. Fiii lui Gad au zidit Aroerul, iar Iosua îl face hotar al lui Ruben. Ieftae, răspunzând regelui Amonului, amintește că Israel locuise în Hesbon și în Aroer și în cetățile lor trei sute de ani. Recensământul lui David a început la Aroer, iar în zilele lui Iehu, Hazael din Damasc a lovit țara lui Israel de la est de Iordan de la Aroer, care este lângă râul Arnon, până în Galaad și Basan."
    - "În jurul anului 840 î.Hr., după socoteala obișnuită, Meșa, regele Moabului, a scris pe stela sa de la Dibon: „Eu am zidit Aroerul și am făcut drumul la Arnon”. Kloner și Ben-David au sugerat că drumul lor ar putea fi una dintre lucrările lui Meșa, dar pe unde trecea drumul lui rămâne nesigur. În oracolul lui Ieremia împotriva Moabului, Aroer este din nou o cetate moabită: locuitorul Aroerului este chemat să stea la drum și să vegheze, să-l întrebe pe cel ce fuge."
    - "În 106 d.Hr., ținutul a trecut în noua provincie romană Arabia, iar noul drum al lui Traian, Via Nova Traiana, a trecut Arnonul prin urcușul de la Dhiban, nu la Aroer. La începutul secolului al IV-lea, Eusebiu scria că Aroerul era încă arătat, cocoțat pe fruntea muntelui deasupra defileului prin care torentul coboară spre Marea Moartă."
  bg:
    - "Ароер стоял на северния ръб на ждрелото на Арнон, днешния Вади Муджиб, до селото Араир в Йордания, на около 5 км югоизточно от Дхибан, библейския Дивон. През 1960-те години испанска експедиция, водена от Емилио Олаварри, направила сондажи и после разкопки на мястото. Във Вади Нухейла, южна странична долина на Муджиб, А. Клонер и С. Бен-Давид описали древен построен път, който датират преди римляните по конструкцията му и по керамиката на съоръжението, пазещо прехода; той свързвал южен Моав със севера."
    - "Във Второзаконие Ароер, който е „при устието на потока Арнон“, бележи южния край на земята, която Израил взел от Сихон, цар на аморейците. Гадовите синове построили Ароер, а Иисус Навин го прави граница на Рувим. Йефтай, отговаряйки на царя на Амон, припомня, че Израил живял в Есевон и Ароер и селата им триста години. Преброяването на Давид започнало в Ароер, а в дните на Йеху Азаил от Дамаск поразил земята на Израил на изток от Йордан, от Ароер при потока Арнон, чак до Галаад и Васан."
    - "Около 840 г. пр.н.е. по обичайното изчисление Меша, цар на Моав, написал на стелата си от Дивон: „Аз построих Ароер и направих пътя при Арнон“. Клонер и Бен-Давид предположили, че техният път може да е едно от делата на Меша, но къде е минавал пътят му, все още е неясно. В прорицанието на Йеремия против Моав Ароер отново е моавски град: „Жителко в Ароир, Застани при пътя та съгледай: Попитай оногоз който бяга“."
    - "През 106 г. н.е. земята преминала в новата римска провинция Арабия, а новият път на Траян, Виа Нова Траяна, прекосявал Арнон по изкачването от Дхибан, а не при Ароер. В началото на IV в. Евсевий писал, че Ароер още се показвал, кацнал на челото на планината над ждрелото, където потокът слиза към Мъртво море."
