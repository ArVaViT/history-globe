# Overview article (ADR 0007). Mainstream facts only; the Tel Gerisa identification is given as a proposal, the mound's ancient name being unknown; the second Gath-rimmon of Joshua 21:25 is explained as most commentators do.
id: gath-rimmon
place: a046c70
title:
  en: "Gath-rimmon"
  ru: "Гаф-Риммон"
  uk: "Гат-Риммон"
  es: "Gat-rimón"
  pt: "Gate-Rimom"
  de: "Gat-Rimmon"
  fr: "Gath-Rimmon"
body:
  en:
    - "Gath-rimmon, “winepress of the pomegranate”, was a town of the tribe of Dan in the coastal plain inland from Joppa. Joshua lists it among Dan's towns with “Jehud, and Bene-berak, and Gath-rimmon”, and then among the four Levitical cities taken from Dan for the Kohathites: “Aijalon with her suburbs, Gath-rimmon with her suburbs; four cities”, a list the Chronicler repeats, though he counts the two towns under Ephraim. A second Gath-rimmon in the half tribe of Manasseh, in the next verse of Joshua, is generally taken for a copyist's repetition of the name, since the parallel in Chronicles reads Bileam, that is Ibleam. Nothing is told of the town's history; it belongs to the lists alone."
    - "The site is not known for certain. Benjamin Mazar proposed Tel Gerisa (Tell Jerishe), a mound on the south bank of the Yarkon in Ramat Gan, which fits the order of Dan's towns along the river. The mound was dug by Eleazar Sukenik between 1927 and 1951 and by Ze'ev Herzog of Tel Aviv University in 1981–1995: a Middle Bronze Age city with a great earthen rampart, a Late Bronze town, and a village of the early Iron Age with Philistine pottery, followed by a smaller settlement of the tenth century BC, after which the mound declined. No inscription gives the mound's ancient name, and the other candidates on the map are Tel Zeton near Bnei Brak and Ras Abu Hamid near Ramla."
    - "Eusebius knew Gethremmon as a large village twelve Roman miles from Diospolis, that is Lod, on the road to Eleutheropolis. Tel Gerisa is today a low green hill beside the Yarkon in Ramat Gan, in the Tel Aviv conurbation."
  ru:
    - "Гаф-Риммон, «точило граната», был городом колена Данова на приморской равнине в глубине от Иоппии. Книга Иисуса Навина называет его среди городов Дана: «Игуд, Бене-Верак и Гаф-Риммон», а затем среди четырёх левитских городов, взятых у Дана для сынов Каафовых: «Аиалон и предместья его, Гаф-Риммон и предместья его: четыре города», и летописец повторяет этот список, хотя и относит оба города к Ефрему. Второй Гаф-Риммон в половине колена Манассиина, в следующем стихе Иисуса Навина, обычно считают повтором имени переписчиком, поскольку параллельное место в Паралипоменон читает Билеам, то есть Ивлеам. Об истории города не рассказано ничего; он принадлежит одним спискам."
    - "Место точно не известно. Биньямин Мазар предложил Тель-Герису (Телль-Джерише), холм на южном берегу Яркона в Рамат-Гане, что согласуется с порядком городов Дана вдоль реки. Холм раскапывали Элиэзер Сукеник в 1927–1951 годах и Зеэв Герцог из Тель-Авивского университета в 1981–1995: город средней бронзы с большим земляным валом, город поздней бронзы и селение раннего железного века с филистимской керамикой, а за ним меньшее поселение X века до н. э., после которого холм пришёл в упадок. Ни одна надпись не даёт древнего имени холма, а другие кандидаты на карте — Тель-Зетон у Бней-Брака и Рас-Абу-Хамид близ Рамлы."
    - "Евсевий знал Гефреммон как большое селение в двенадцати римских милях от Диосполя, то есть Лода, по дороге в Елевферополь. Тель-Гериса сегодня — невысокий зелёный холм у Яркона в Рамат-Гане, в тель-авивской агломерации."
  uk:
    - "Гат-Риммон, «давильня граната», був містом коліна Дана на прибережній рівнині вглиб країни від Яффи. Книга Ісуса Навина перелічує його серед міст Дана: «Ігуд, Бене-Барак і Гат-Риммон», а потім серед чотирьох левітських міст, узятих від Дана для каафітів: «Аялон укупі з пасовищами його, та Гат-Риммон укупі з пасовищами його — чотири міста»; цей перелік повторює й літописець, хоча відносить обидва міста до Єфрема. Другий Гат-Риммон у половині коліна Манасії, у наступному вірші Книги Ісуса Навина, зазвичай уважають повтором назви з боку переписувача, бо в паралельному місці Хронік стоїть Білеам, тобто Івлеам. Про історію міста нічого не розповідається; воно існує лише в переліках."
    - "Місце достеменно невідоме. Веніямин Мазар запропонував Тель-Геріса (Телль-Джеріша) — городище на південному березі Яркона в Рамат-Гані, що відповідає порядкові міст Дана вздовж річки. Городище розкопували Елеазар Сукеник у 1927–1951 роках і Зеєв Герцог із Тель-Авівського університету в 1981–1995 роках: там виявлено місто доби середньої бронзи з великим земляним валом, містечко пізньої бронзи й село раннього залізного віку з філістимською керамікою, потім менше поселення X ст. до н. е., після чого городище занепало. Жоден напис не дає давньої назви городища, а інші кандидати на карті — Тель-Цетон поблизу Бней-Брака та Рас-Абу-Хамід поблизу Рамли."
    - "Євсевій знав Гетреммон як велике село за дванадцять римських миль від Діосполя, тобто Лідди, на дорозі до Елевферополя. Тель-Геріса сьогодні — низький зелений пагорб біля Яркона в Рамат-Гані, в межах Тель-Авівської агломерації."
  es:
    - "Gat-rimón, «lagar de la granada», era una población de la tribu de Dan en la llanura costera, tierra adentro desde Jope. Josué la enumera entre las ciudades de Dan con «Jehud, y Bene-berác, y Gath-rimmón», y luego entre las cuatro ciudades levíticas tomadas de Dan para los coatitas: «A Ayalón con sus ejidos, á Gath-rimmón con sus ejidos: cuatro villas», lista que repite el Cronista, aunque este cuenta las dos poblaciones bajo Efraín. Un segundo Gat-rimón en la media tribu de Manasés, en el versículo siguiente de Josué, se tiene generalmente por una repetición del nombre debida a un copista, pues el paralelo de Crónicas dice Bileam, es decir, Ibleam. Nada se cuenta de la historia de la población; pertenece solo a las listas."
    - "El sitio no se conoce con certeza. Benjamin Mazar propuso Tel Gerisa (Tell Jerishe), un montículo en la orilla sur del Yarkón, en Ramat Gan, que concuerda con el orden de las ciudades de Dan a lo largo del río. El montículo fue excavado por Eleazar Sukenik entre 1927 y 1951 y por Ze'ev Herzog, de la Universidad de Tel Aviv, en 1981–1995: una ciudad de la Edad del Bronce Medio con un gran terraplén de tierra, una población del Bronce Final y una aldea de comienzos de la Edad del Hierro con cerámica filistea, seguida de un asentamiento menor del siglo X a. C., después del cual el montículo decayó. Ninguna inscripción da el nombre antiguo del montículo, y los otros candidatos del mapa son Tel Zeton, cerca de Bnei Brak, y Ras Abu Hamid, cerca de Ramla."
    - "Eusebio conoció Gethremmon como una gran aldea a doce millas romanas de Diospolis, es decir, Lida, en el camino de Eleuterópolis. Tel Gerisa es hoy una colina baja y verde junto al Yarkón, en Ramat Gan, dentro de la conurbación de Tel Aviv."
  pt:
    - "Gate-Rimom, “lagar da romã”, era uma cidade da tribo de Dã na planície costeira, no interior em relação a Jope. Josué a lista entre as cidades de Dã com “Jeúde, Bene-Beraque, Gate-Rimom”, e depois entre as quatro cidades levíticas tiradas de Dã para os coatitas: “Aijalom com suas pastagens, Gate-Rimom com suas pastagens: quatro cidades”, lista que o cronista repete, embora conte as duas cidades sob Efraim. Uma segunda Gate-Rimom, na meia tribo de Manassés, no versículo seguinte de Josué, é geralmente tomada por repetição do nome por um copista, pois o paralelo de Crônicas lê Bileão, isto é, Ibleão. Nada se conta da história da cidade; ela pertence só às listas."
    - "O sítio não é conhecido com certeza. Benjamin Mazar propôs Tel Gerisa (Tell Jerishe), um monte na margem sul do Yarkon, em Ramat Gan, que se ajusta à ordem das cidades de Dã ao longo do rio. O monte foi escavado por Eleazar Sukenik entre 1927 e 1951 e por Ze’ev Herzog, da Universidade de Tel Aviv, em 1981–1995: uma cidade da Idade do Bronze Médio com um grande baluarte de terra, uma cidade do Bronze Tardio e uma aldeia do início da Idade do Ferro com cerâmica filisteia, seguida de um povoado menor do século X a.C., depois do qual o monte declinou. Nenhuma inscrição dá o nome antigo do monte, e os outros candidatos no mapa são Tel Zeton, perto de Bnei Brak, e Ras Abu Hamid, perto de Ramla."
    - "Eusébio conheceu Gethremmon como uma grande aldeia a doze milhas romanas de Dióspolis, isto é, Lode, no caminho para Eleutéropolis. Tel Gerisa é hoje uma colina baixa e verde junto ao Yarkon, em Ramat Gan, na conurbação de Tel Aviv."
  de:
    - "Gat-Rimmon, „Kelter des Granatapfels“, war eine Stadt des Stammes Dan in der Küstenebene, landeinwärts von Joppe. Josua führt sie unter den Städten Dans auf mit „Jehud, Bne-Barak, Gath-Rimmon“ und dann unter den vier Levitenstädten, die Dan für die Kehatiter abgeben musste: „Ajalon und seine Vorstädte, Gath-Rimmon und seine Vorstädte“, eine Liste, die der Chronist wiederholt, wobei er die beiden Städte aber unter Ephraim zählt. Ein zweites Gat-Rimmon im halben Stamm Manasse, im nächsten Vers bei Josua, hält man allgemein für eine Wiederholung des Namens durch einen Abschreiber, denn die Parallele in der Chronik liest Bileam, das ist Jibleam. Von der Geschichte der Stadt wird nichts erzählt; sie gehört allein den Listen an."
    - "Die Stätte ist nicht sicher bekannt. Benjamin Mazar schlug Tel Gerisa (Tell Jerischa) vor, einen Hügel am Südufer des Jarkon in Ramat Gan, was zur Reihenfolge der Städte Dans am Fluss passt. Der Hügel wurde von Eleasar Sukenik zwischen 1927 und 1951 und von Ze'ev Herzog von der Universität Tel Aviv 1981–1995 ausgegraben: eine mittelbronzezeitliche Stadt mit einem großen Erdwall, eine spätbronzezeitliche Siedlung und ein Dorf der frühen Eisenzeit mit philistäischer Keramik, danach eine kleinere Siedlung des 10. Jahrhunderts v. Chr., worauf der Hügel verfiel. Keine Inschrift nennt den antiken Namen des Hügels; die anderen Kandidaten auf der Karte sind Tel Zeton bei Bnei Brak und Ras Abu Hamid bei Ramla."
    - "Eusebius kannte Gethremmon als großes Dorf zwölf römische Meilen von Diospolis, das heißt Lod, an der Straße nach Eleutheropolis. Tel Gerisa ist heute ein niedriger grüner Hügel am Jarkon in Ramat Gan, im Ballungsraum Tel Aviv."
  fr:
    - "Gath-Rimmon, « pressoir de la grenade », était une ville de la tribu de Dan, dans la plaine côtière, à l’intérieur des terres depuis Joppé. Josué la range parmi les villes de Dan avec « Jehud, Bené-Berak, Gath-Rimmon », puis parmi les quatre villes lévitiques prises sur Dan pour les Kehathites : « Ajalon et sa banlieue, et Gath-Rimmon et sa banlieue, quatre villes » ; le Chroniqueur reprend cette liste, mais il compte les deux villes sous Éphraïm. Un second Gath-Rimmon, dans la demi-tribu de Manassé, au verset suivant de Josué, passe généralement pour une répétition du nom par un copiste, puisque le parallèle des Chroniques porte Bileam, c’est-à-dire Jibleam. On ne raconte rien de l’histoire de la ville ; elle n’appartient qu’aux listes."
    - "Le site n’est pas connu avec certitude. Benjamin Mazar a proposé Tel Gerisa (Tell Jerishe), un tertre sur la rive sud du Yarkon, à Ramat Gan, ce qui s’accorde avec l’ordre des villes de Dan le long du fleuve. Le tertre a été fouillé par Eleazar Sukenik entre 1927 et 1951, puis par Ze’ev Herzog, de l’Université de Tel-Aviv, en 1981–1995 : une ville du Bronze moyen dotée d’un grand rempart de terre, une ville du Bronze récent, et un village du début de l’âge du Fer avec de la poterie philistine, suivi d’un établissement plus petit du Xe siècle av. J.-C., après quoi le tertre déclina. Aucune inscription ne donne le nom antique du tertre ; les autres candidats de la carte sont Tel Zeton, près de Bnei Brak, et Ras Abu Hamid, près de Ramla."
    - "Eusèbe connaissait Gethremmon comme un grand village situé à douze milles romains de Diospolis, c’est-à-dire Lydde, sur la route d’Éleuthéropolis. Tel Gerisa est aujourd’hui une colline basse et verte au bord du Yarkon, à Ramat Gan, dans l’agglomération de Tel-Aviv."
