# Overview article (ADR 0007). Mainstream facts only; the Tel Gerisa identification is given as a proposal, the mound's ancient name being unknown; the second Gath-rimmon of Joshua 21:25 is explained as most commentators do.
id: gath-rimmon
place: a046c70
title:
  en: "Gath-rimmon"
  ru: "Гаф-Риммон"
  uk: "Гат-Риммон"
  es: "Gat-rimón"
  pt: "Gate-Rimom"
  de: "Gat-Rimmon"
  fr: "Gath-Rimmon"
