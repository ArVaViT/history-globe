body:
  en:
    - "Gezer stands on a ridge at the edge of the Shephelah, where the road from Jerusalem down the valley of Aijalon meets the coastal highway. People first lived here in caves in the fourth millennium BC. In the Middle Bronze Age Gezer became a large walled city, with a row of tall standing stones that its first excavator called the High Place. In the Amarna letters of the fourteenth century BC its kings, among them Milkilu and Yapahu, write to Pharaoh, and late in the thirteenth century BC Pharaoh Merneptah boasted on his victory stela that Gezer had been seized."
    - "Joshua defeated Horam, king of Gezer, who came to help Lachish, but Ephraim did not drive out the Canaanites who lived in Gezer, and they paid tribute. The town was later given to the Levites. 1 Kings tells that a pharaoh took Gezer, burned it and gave it as a dowry to his daughter, Solomon's wife, and that Solomon rebuilt it. Its six-chambered gate, like those of Megiddo and Hazor, is dated by some to Solomon's tenth century and by others later. A small limestone tablet listing the months of the farming year, the Gezer Calendar, was found here and is commonly dated to the tenth century BC."
    - 'In the Hellenistic age the town, then called Gazara, was a Seleucid stronghold. About 142 BC Simon the Maccabee took it, put out its people, settled there men who kept the law, fortified it and made it the seat of his son John, captain of the army. Inscriptions cut in the rocks around the mound read "boundary of Gezer" in Hebrew letters and "of Alkios" in Greek; they date from the Hasmonean or the Herodian period and confirm the site''s identity.'
    - "In Roman times Gezer shrank to a village. Eusebius calls it Gazara, a village four miles north of Nicopolis, the former Emmaus, and in Byzantine times the old site was only thinly inhabited."
  ru:
    - "Газер стоит на гряде у края Шефелы, там, где дорога из Иерусалима по долине Аиалонской выходит к приморскому пути. Первые жители селились здесь в пещерах в IV тысячелетии до н. э. В среднем бронзовом веке Газер стал большим укреплённым городом с рядом высоких каменных столбов, который его первый раскопщик назвал «высотой». В амарнских письмах XIV века до н. э. его цари, среди них Милкилу и Япаху, пишут фараону, а в конце XIII века до н. э. фараон Мернептах похвалялся на победной стеле, что Газер захвачен."
    - "Иисус Навин поразил Горама, царя Газерского, пришедшего на помощь Лахису, но Ефрем не изгнал хананеев, живших в Газере, и они платили дань. Позже город отдали левитам. Третья книга Царств рассказывает, что фараон взял Газер, сжёг его и отдал в приданое своей дочери, жене Соломона, а Соломон отстроил его. Его шестикамерные ворота, подобные воротам Мегиддона и Асора, одни датируют X веком Соломона, другие — более поздним временем. Здесь же нашли небольшую известняковую табличку с перечнем месяцев земледельческого года — Газерский календарь, который обычно датируют X веком до н. э."
    - "В эллинистическую эпоху город, называвшийся тогда Газарой, был опорной крепостью Селевкидов. Около 142 г. до н. э. Симон Маккавей взял его, выселил жителей, поселил людей, соблюдавших закон, укрепил город и сделал его местопребыванием своего сына Иоанна, начальника войска. Надписи, высеченные на скалах вокруг холма, гласят «граница Газера» еврейскими буквами и «Алкиоса» по-гречески; они относятся к хасмонейскому или к иродову времени и подтверждают, что это то самое место."
    - "В римское время Газер сократился до селения. Евсевий называет его Газарой, селением в четырёх милях к северу от Никополя, прежнего Эммауса, а в византийское время старое место было заселено лишь редко."
  uk:
    - "Гезер стоїть на хребті на краю Шефели, де дорога з Єрусалима вниз долиною Аялона сходиться з прибережною магістраллю. Люди вперше оселилися тут у печерах у IV тисячолітті до н. е. За доби середньої бронзи Гезер став великим містом з мурами, з рядом високих стоячих каменів, який його перший розкопувач назвав Висотою. В амарнських листах XIV ст. до н. е. його царі, серед них Мілкілу й Япаху, пишуть фараонові, а наприкінці XIII ст. до н. е. фараон Мернептах хвалився на своїй стелі перемоги, що Гезер було захоплено."
    - "Ісус Навин розбив Горама, царя Гезера, який прийшов на допомогу Лахішу, але Єфрем не вигнав ханаанців, що жили в Гезері, і вони платили данину. Згодом місто віддали левітам. Перша книга Царів розповідає, що фараон узяв Гезер, спалив його й віддав як придане своїй дочці, дружині Соломона, і що Соломон його відбудував. Його брама з шістьма приміщеннями, як у Мегіддо й Гацора, датується одними Соломоновим X ст., іншими — пізніше. Тут знайдено невелику вапнякову табличку з переліком місяців землеробського року — Календар із Гезера, який зазвичай датують X ст. до н. е."
    - "За еллінізму місто, тоді зване Газара, було селевкідською твердинею. Близько 142 р. до н. е. Симон Макавей узяв його, вигнав його мешканців, оселив там людей, що дотримувалися Закону, укріпив його й зробив резиденцією свого сина Івана, начальника війська. Написи, вирізьблені в скелях навколо городища, читаються «межа Гезера» єврейськими літерами та «Алкіоса» грецькими; вони походять із хасмонейського або іродіанського часу й підтверджують ототожнення місця."
    - "За римських часів Гезер зменшився до села. Євсевій називає його Газара, село за чотири милі на північ від Нікополя, колишнього Еммауса, а за візантійських часів давнє місце було заселене лише слабко."
  es:
    - "Gezer se alza en una loma en el borde de la Sefelá, donde el camino de Jerusalén por el valle de Ajalón se encuentra con la gran vía de la costa. Los primeros habitantes vivieron aquí en cuevas en el cuarto milenio a. C. En la Edad del Bronce Medio Gezer se convirtió en una gran ciudad amurallada, con una hilera de altas piedras erguidas que su primer excavador llamó el Lugar Alto. En las cartas de Amarna del siglo XIV a. C. sus reyes, entre ellos Milkilu y Yapahu, escriben al faraón, y a fines del siglo XIII a. C. el faraón Merenptah se jactó en su estela de victoria de que Gezer había sido capturada."
    - "Josué derrotó a Horam, rey de Gezer, que acudió en ayuda de Laquis, pero Efraín no expulsó a los cananeos que habitaban en Gezer, y estos pagaron tributo. La ciudad fue dada más tarde a los levitas. 1 Reyes cuenta que un faraón tomó Gezer, la quemó y se la dio como dote a su hija, esposa de Salomón, y que Salomón la reconstruyó. Su puerta de seis cámaras, como las de Meguido y Hazor, es fechada por algunos en el siglo X de Salomón y por otros más tarde. Aquí se halló una pequeña tablilla de piedra caliza con la lista de los meses del año agrícola, el Calendario de Gezer, que suele fecharse en el siglo X a. C."
    - "En la época helenística la ciudad, llamada entonces Gazara, era una plaza fuerte seléucida. Hacia el 142 a. C. Simón el Macabeo la tomó, expulsó a su gente, estableció allí a hombres que guardaban la ley, la fortificó y la hizo sede de su hijo Juan, jefe del ejército. Las inscripciones talladas en las rocas alrededor del montículo dicen «límite de Gezer» en letras hebreas y «de Alkios» en griego; datan de la época asmonea o herodiana y confirman la identidad del sitio."
    - "En tiempos romanos Gezer quedó reducida a una aldea. Eusebio la llama Gazara, aldea a cuatro millas al norte de Nicópolis, la antigua Emaús, y en época bizantina el viejo sitio estaba solo escasamente habitado."
  pt:
    - "Gezer ergue-se numa crista na orla da Sefelá, onde a estrada que desce de Jerusalém pelo vale de Aijalom encontra a rodovia da costa. As pessoas viveram aqui primeiro em cavernas, no quarto milênio a.C. Na Idade do Bronze Médio, Gezer tornou-se uma grande cidade murada, com uma fileira de altas pedras eretas que seu primeiro escavador chamou de Lugar Alto. Nas cartas de Amarna do século XIV a.C., seus reis, entre eles Milkilu e Yapahu, escrevem ao faraó, e no fim do século XIII a.C. o faraó Merneptá se gabou, em sua estela da vitória, de que Gezer fora tomada."
    - "Josué derrotou Horão, rei de Gezer, que veio ajudar Laquis, mas Efraim não expulsou os cananeus que viviam em Gezer, e eles pagaram tributo. A cidade foi depois dada aos levitas. Primeiro Reis conta que um faraó tomou Gezer, queimou-a e a deu como dote à sua filha, esposa de Salomão, e que Salomão a reconstruiu. Seu portão de seis câmaras, como os de Megido e Hazor, é datado por alguns do século X de Salomão e por outros de época posterior. Uma pequena tábua de calcário que lista os meses do ano agrícola, o Calendário de Gezer, foi achada aqui e é comumente datada do século X a.C."
    - "Na época helenística a cidade, então chamada Gazara, era um reduto selêucida. Por volta de 142 a.C., Simão Macabeu a tomou, expulsou seu povo, estabeleceu ali homens que guardavam a lei, fortificou-a e fez dela a sede de seu filho João, comandante do exército. Inscrições cortadas nas rochas ao redor do monte dizem “limite de Gezer” em letras hebraicas e “de Alkios” em grego; datam do período asmoneu ou herodiano e confirmam a identidade do sítio."
    - "Em tempos romanos Gezer encolheu até virar uma aldeia. Eusébio a chama Gazara, uma aldeia a quatro milhas ao norte de Nicópolis, a antiga Emaús, e em tempos bizantinos o antigo sítio era apenas escassamente habitado."
  de:
    - "Geser liegt auf einem Höhenrücken am Rand der Schefela, wo die Straße von Jerusalem durch das Tal von Ajalon auf die Küstenstraße trifft. Menschen lebten hier zuerst im 4. Jahrtausend v. Chr. in Höhlen. In der Mittelbronzezeit wurde Geser zu einer großen ummauerten Stadt, mit einer Reihe hoher Standsteine, die sein erster Ausgräber die Kulthöhe nannte. In den Amarnabriefen des 14. Jahrhunderts v. Chr. schreiben seine Könige, darunter Milkilu und Yapahu, an den Pharao, und spät im 13. Jahrhundert v. Chr. rühmte sich Pharao Merenptah auf seiner Siegesstele, Geser sei genommen worden."
    - "Josua schlug Horam, den König von Geser, der Lachisch zu Hilfe kam, doch Ephraim vertrieb die Kanaaniter nicht, die in Geser wohnten, und sie wurden zinsbar. Die Stadt wurde später den Leviten gegeben. Das erste Buch der Könige erzählt, ein Pharao habe Geser genommen, mit Feuer verbrannt und seiner Tochter, Salomos Frau, als Mitgift gegeben, und Salomo habe es wieder aufgebaut. Sein Tor mit sechs Kammern, wie die von Megiddo und Hazor, wird von einigen in Salomos 10. Jahrhundert, von anderen später datiert. Eine kleine Kalksteintafel mit den Monaten des bäuerlichen Jahres, der Geser-Kalender, wurde hier gefunden und gewöhnlich ins 10. Jahrhundert v. Chr. datiert."
    - "In hellenistischer Zeit war die Stadt, damals Gazara genannt, eine seleukidische Festung. Um 142 v. Chr. nahm Simon der Makkabäer sie ein, vertrieb ihre Bewohner, siedelte dort gesetzestreue Männer an, befestigte sie und machte sie zum Sitz seines Sohnes Johannes, des Heerführers. Inschriften in den Felsen rings um den Hügel lesen „Grenze von Geser“ in hebräischen Buchstaben und „des Alkios“ auf Griechisch; sie stammen aus hasmonäischer oder herodianischer Zeit und bestätigen die Identität der Stätte."
    - "In römischer Zeit schrumpfte Geser zu einem Dorf. Eusebius nennt es Gazara, ein Dorf vier Meilen nördlich von Nikopolis, dem früheren Emmaus, und in byzantinischer Zeit war die alte Stätte nur dünn besiedelt."
  fr:
    - "Guézer se dresse sur une crête à la lisière de la Shéphéla, là où la route de Jérusalem descendant la vallée d’Ajalon rejoint la grande route côtière. On y vécut d’abord dans des grottes au IVe millénaire av. J.-C. À l’âge du Bronze moyen, Guézer devint une grande ville fortifiée, avec une rangée de hautes pierres dressées que son premier fouilleur nomma le Haut Lieu. Dans les lettres d’Amarna du XIVe siècle av. J.-C., ses rois, dont Milkilu et Yapahu, écrivent au pharaon, et à la fin du XIIIe siècle av. J.-C. le pharaon Merneptah se vanta sur sa stèle de victoire d’avoir pris Guézer."
    - "Josué battit Horam, roi de Guézer, venu au secours de Lakis, mais Éphraïm ne chassa pas les Cananéens qui habitaient à Guézer, et ceux-ci payèrent tribut. La ville fut plus tard donnée aux Lévites. Le premier livre des Rois raconte qu’un pharaon s’empara de Guézer, l’incendia et la donna en dot à sa fille, épouse de Salomon, et que Salomon la rebâtit. Sa porte à six chambres, comme celles de Meguiddo et de Hatsor, est datée par certains du Xe siècle de Salomon et par d’autres d’une époque plus tardive. Une petite tablette de calcaire énumérant les mois de l’année agricole, le calendrier de Guézer, y fut trouvée et est couramment datée du Xe siècle av. J.-C."
    - "À l’époque hellénistique, la ville, alors appelée Gazara, était une place forte séleucide. Vers 142 av. J.-C., Simon le Maccabée la prit, en chassa les habitants, y établit des hommes observant la Loi, la fortifia et en fit la résidence de son fils Jean, chef de l’armée. Des inscriptions taillées dans les rochers autour du tertre se lisent « limite de Guézer » en lettres hébraïques et « d’Alkios » en grec ; elles datent de la période hasmonéenne ou hérodienne et confirment l’identité du site."
    - "À l’époque romaine, Guézer se réduisit à un village. Eusèbe l’appelle Gazara, village à quatre milles au nord de Nicopolis, l’ancienne Emmaüs, et à l’époque byzantine l’ancien site n’était que peu habité."
  pl:
    - "Gezer stoi na grzbiecie na skraju Szefeli, gdzie droga z Jerozolimy w dół doliną Ajjalon spotyka się z nadmorskim traktem. Ludzie zamieszkali tu po raz pierwszy w jaskiniach w IV tysiącleciu p.n.e. W środkowej epoce brązu Gezer stało się wielkim miastem obwarowanym murami, z rzędem wysokich stojących kamieni, które jego pierwszy badacz nazwał Wyżyną. W listach z Amarna z XIV w. p.n.e. piszą do faraona jego królowie, wśród nich Milkilu i Japachu, a pod koniec XIII w. p.n.e. faraon Merenptah chwalił się na swojej steli zwycięstwa, że Gezer zostało zdobyte."
    - "Jozue pokonał Horama, króla Gezer, który przybył na pomoc Lakisz, lecz Efraim nie wypędził Kananejczyków mieszkających w Gezer i płacili oni daninę. Miasto oddano później Lewitom. Pierwsza Księga Królewska opowiada, że faraon zdobył Gezer, spalił je i dał jako posag swojej córce, żonie Salomona, a Salomon je odbudował. Jego brama z sześcioma komorami, podobna do bram Megiddo i Chasoru, jest datowana przez jednych na X w. Salomona, przez innych na czas późniejszy. Znaleziono tu małą wapienną tabliczkę z wykazem miesięcy roku rolniczego, kalendarz z Gezer, zwykle datowany na X w. p.n.e."
    - "W epoce hellenistycznej miasto, zwane wtedy Gazara, było twierdzą Seleucydów. Około 142 r. p.n.e. Szymon Machabeusz zdobył je, wypędził jego mieszkańców, osiedlił tam ludzi przestrzegających Prawa, obwarował je i uczynił siedzibą swego syna Jana, dowódcy wojska. Napisy wykute w skałach wokół pagórka brzmią „granica Gezer” hebrajskimi literami i „Alkiosa” po grecku; pochodzą z czasów hasmonejskich lub herodiańskich i potwierdzają tożsamość stanowiska."
    - "W czasach rzymskich Gezer zmalało do wsi. Euzebiusz nazywa je Gazara, wsią cztery mile na północ od Nikopolis, dawnego Emaus, a w czasach bizantyńskich dawne miejsce było zasiedlone tylko rzadko."
  it:
    - "Ghezer sorge su una dorsale al margine della Sefela, dove la strada che da Gerusalemme scende per la valle di Aialon incontra la grande via costiera. Vi si abitò per la prima volta nelle grotte, nel IV millennio a.C. Nel Bronzo Medio Ghezer divenne una grande città murata, con una fila di alte pietre erette che il suo primo scavatore chiamò l’Alto Luogo. Nelle lettere di Amarna del XIV secolo a.C. i suoi re, fra cui Milkilu e Yapahu, scrivono al faraone, e alla fine del XIII secolo a.C. il faraone Merenptah si vantò sulla sua stele della vittoria che Ghezer era stata presa."
    - "Giosuè sconfisse Oram, re di Ghezer, venuto in aiuto di Lachis, ma Efraim non cacciò i Cananei che abitavano a Ghezer, ed essi pagarono tributo. La città fu poi data ai Leviti. Il Primo libro dei Re racconta che un faraone prese Ghezer, la incendiò e la diede in dote alla figlia, moglie di Salomone, e che Salomone la ricostruì. La sua porta a sei camere, come quelle di Meghiddo e di Asor, è datata da alcuni al X secolo di Salomone e da altri a un’epoca più tarda. Una piccola tavoletta di calcare con l’elenco dei mesi dell’anno agricolo, il Calendario di Ghezer, fu trovata qui ed è comunemente datata al X secolo a.C."
    - "In età ellenistica la città, allora chiamata Gazara, era una roccaforte seleucide. Verso il 142 a.C. Simone Maccabeo la prese, ne scacciò gli abitanti, vi stabilì uomini osservanti della legge, la fortificò e ne fece la sede di suo figlio Giovanni, capo dell’esercito. Iscrizioni incise nelle rocce attorno al tell recano «confine di Ghezer» in lettere ebraiche e «di Alkios» in greco; risalgono al periodo asmoneo o erodiano e confermano l’identità del sito."
    - "In età romana Ghezer si ridusse a un villaggio. Eusebio la chiama Gazara, un villaggio a quattro miglia a nord di Nicopoli, l’antica Emmaus, e in età bizantina l’antico sito era abitato solo scarsamente."
  nl:
    - "Gezer ligt op een bergrug aan de rand van de Sefela, waar de weg van Jeruzalem door het dal van Ajalon de kustweg ontmoet. De eerste bewoning was in grotten, in het 4e millennium v.Chr. In de Midden-Bronstijd werd Gezer een grote ommuurde stad, met een rij hoge staande stenen die de eerste opgraver de Hoogte noemde. In de brieven van Amarna uit de 14e eeuw v.Chr. schrijven zijn koningen, onder wie Milkilu en Yapahu, aan de farao, en laat in de 13e eeuw v.Chr. roemde farao Merneptah op zijn overwinningsstele dat Gezer was ingenomen."
    - "Jozua versloeg Choram, de koning van Gezer, die Lachis te hulp kwam, maar Efraïm verdreef de Kanaänieten die in Gezer woonden niet, en zij betaalden schatting. De stad werd later aan de Levieten gegeven. Eerste Koningen vertelt dat een farao Gezer innam, in brand stak en als bruidsschat gaf aan zijn dochter, de vrouw van Salomo, en dat Salomo het herbouwde. Zijn poort met zes kamers, net als die van Megiddo en Hazor, wordt door sommigen gedateerd in Salomo’s 10e eeuw en door anderen later. Een klein kalkstenen tafeltje met de maanden van het landbouwjaar, de Kalender van Gezer, werd hier gevonden en wordt gewoonlijk gedateerd in de 10e eeuw v.Chr."
    - "In de hellenistische tijd was de stad, toen Gazara genoemd, een Seleucidisch bolwerk. Omstreeks 142 v.Chr. nam Simon de Makkabeeër haar in, verdreef haar bewoners, vestigde er mannen die de wet hielden, versterkte haar en maakte haar de zetel van zijn zoon Johannes, de legeroverste. Opschriften in de rotsen rond de heuvel luiden “grens van Gezer” in Hebreeuwse letters en “van Alkios” in Griekse; ze dateren uit de Hasmoneïsche of Herodiaanse tijd en bevestigen de identiteit van de plaats."
    - "In de Romeinse tijd kromp Gezer tot een dorp. Eusebius noemt het Gazara, een dorp vier mijl ten noorden van Nicopolis, het vroegere Emmaüs, en in Byzantijnse tijd was de oude plaats maar dun bewoond."
  cs:
    - "Gezer stojí na hřebeni na okraji Šefely, kde se cesta z Jeruzaléma údolím Ajalonu setkává s pobřežní magistrálou. Lidé zde poprvé žili v jeskyních ve 4. tisíciletí př. n. l. Ve střední době bronzové se Gezer stal velkým opevněným městem s řadou vysokých stojatých kamenů, které jeho první vykopávač nazval Výšinou. V amarnských dopisech 14. stol. př. n. l. píší faraonovi jeho králové, mezi nimi Milkilu a Japachu, a koncem 13. stol. př. n. l. se faraon Merneptah na své vítězné stéle chlubil, že Gezer byl zajat."
    - "Jozue porazil Horama, krále Gezeru, který přišel na pomoc Lachiši, ale Efrajim nevyhnal Kananejské, kteří žili v Gezeru, a ti platili tribut. Město bylo později dáno levitům. První kniha Královská vypráví, že faraon Gezer dobyl, spálil jej a dal jako věno své dceři, Šalomounově ženě, a že Šalomoun jej znovu vystavěl. Jeho brána o šesti komorách, jako brány Megida a Chacoru, je některými datována do Šalomounova 10. století, jinými později. Malá vápencová tabulka s výčtem měsíců zemědělského roku, Gezerský kalendář, zde byla nalezena a běžně se datuje do 10. stol. př. n. l."
    - "V helénistické době bylo město, tehdy zvané Gazara, seleukovskou pevností. Kolem roku 142 př. n. l. je dobyl Šimon Makabejský, vyhnal jeho lid, usadil tam muže, kteří zachovávali zákon, opevnil je a učinil je sídlem svého syna Jana, velitele vojska. Nápisy vytesané ve skalách kolem pahorku čtou „hranice Gezeru“ hebrejským písmem a „Alkiova“ řecky; pocházejí z doby hasmonejské nebo herodiánské a potvrzují totožnost místa."
    - "V římské době se Gezer zmenšil na vesnici. Eusebios jej nazývá Gazara, vesnicí čtyři míle severně od Nikopole, dřívějších Emauz, a v byzantské době bylo staré místo osídleno jen řídce."
  sv:
    - "Geser ligger på en ås i utkanten av Shefela, där vägen från Jerusalem nedför Ajalons dal möter kustvägen. Människor bodde här först i grottor under fjärde årtusendet f.Kr. Under mellanbronsåldern blev Geser en stor befäst stad, med en rad höga resta stenar som dess förste utgrävare kallade Högplatsen. I Amarnabreven från 1300-talet f.Kr. skriver dess kungar, bland dem Milkilu och Yapahu, till farao, och sent på 1200-talet f.Kr. skröt farao Merneptah på sin segerstele över att Geser hade intagits."
    - "Josua besegrade Horam, kung av Geser, som kom för att hjälpa Lakish, men Efraim fördrev inte kananéerna som bodde i Geser, och de betalade tribut. Staden gavs senare åt leviterna. Första Kungaboken berättar att en farao intog Geser, brände det och gav det som hemgift åt sin dotter, Salomos hustru, och att Salomo byggde upp det. Dess port med sex kamrar, liksom portarna i Megiddo och Hasor, dateras av somliga till Salomos 900-tal och av andra senare. En liten kalkstenstavla med årets jordbruksmånader, Geserkalendern, hittades här och dateras vanligen till 900-talet f.Kr."
    - "Under hellenistisk tid var staden, då kallad Gazara, en seleukidisk fästning. Omkring 142 f.Kr. intog Simon mackabeen den, drev ut folket, bosatte där män som höll lagen, befäste den och gjorde den till säte för sin son Johannes, härföraren. Inskrifter i klipporna kring kullen lyder ”Gesers gräns” med hebreiska bokstäver och ”av Alkios” på grekiska; de härrör från hasmoneisk eller herodiansk tid och bekräftar platsens identitet."
    - "Under romersk tid krympte Geser till en by. Eusebios kallar den Gazara, en by fyra romerska mil norr om Nikopolis, det forna Emmaus, och under bysantinsk tid var den gamla platsen bara glest bebodd."
  nb:
    - "Geser ligger på en rygg i utkanten av Sjefela, der veien fra Jerusalem ned gjennom Ajalon-dalen møter kystveien. Folk bodde først her i huler i det fjerde årtusen f.Kr. I mellombronsealder ble Geser en stor befestet by, med en rekke høye reiste steiner som den første utgraveren kalte Offerhaugen. I Amarna-brevene fra 1300-tallet f.Kr. skriver kongene, blant dem Milkilu og Yapahu, til Farao, og sent på 1200-tallet f.Kr. skrøt farao Merneptah på sin seierstele av at Geser var inntatt."
    - "Josva beseiret Horam, kongen i Geser, som kom for å hjelpe Lakisj, men Efraim drev ikke bort kanaanittene som bodde i Geser, og de betalte tributt. Byen ble senere gitt til levittene. Første Kongebok forteller at en farao inntok Geser, brente den og ga den i medgift til sin datter, Salomos hustru, og at Salomo gjenoppbygde den. Dens port med seks kamre, som portene i Megiddo og Hasor, dateres av noen til Salomos 900-tall og av andre senere. En liten kalksteinstavle med månedene i jordbruksåret, Geser-kalenderen, ble funnet her og dateres vanligvis til 900-tallet f.Kr."
    - "I hellenistisk tid var byen, da kalt Gazara, en seleukidisk festning. Omkring 142 f.Kr. inntok Simon Makkabeus den, drev ut folket, bosatte menn som holdt loven der, befestet den og gjorde den til sete for sønnen Johannes, hærføreren. Innskrifter hugget i klippene rundt haugen lyder «Gesers grense» med hebraiske bokstaver og «Alkios'» på gresk; de stammer fra den hasmoneiske eller herodianske perioden og bekrefter stedets identitet."
    - "I romersk tid skrumpet Geser inn til en landsby. Eusebius kaller den Gazara, en landsby fire romerske mil nord for Nikopolis, det tidligere Emmaus, og i bysantinsk tid var det gamle stedet bare tynt bebodd."
  tl:
    - "Ang Gezer ay nakatayo sa isang tagaytay sa gilid ng Sephela, kung saan ang daan mula Jerusalem pababa sa libis ng Ajalon ay nagtatagpo sa baybaying lansangan. Unang nanirahan ang mga tao rito sa mga yungib noong ika-4 na milenyo BK. Sa Gitnang Panahong Tanso, ang Gezer ay naging malaking lungsod na may pader, may hanay ng matatayog na nakatayong bato na tinawag ng unang humukay rito na Mataas na Dako. Sa mga liham ng Amarna noong ika-14 na siglo BK ay sumulat kay Faraon ang mga hari nito, kabilang sina Milkilu at Yapahu, at sa huling bahagi ng ika-13 siglo BK ay ipinagyabang ni Faraong Merneptah sa kaniyang estela ng tagumpay na nasakop ang Gezer."
    - "Tinalo ni Josue si Horam, hari ng Gezer, na dumating upang tulungan ang Lachis, ngunit hindi pinalayas ng Ephraim ang mga Cananeo na nakatira sa Gezer, at nagbayad sila ng buwis. Ibinigay ang bayan kalaunan sa mga Levita. Isinasalaysay ng 1 Mga Hari na kinuha ng isang faraon ang Gezer, sinunog ito at ibinigay na dote sa kaniyang anak na babae, asawa ni Salomon, at muling itinayo ito ni Salomon. Ang tarangkahan nito na may anim na silid, tulad ng sa Megiddo at Hasor, ay ipinetsa ng ilan sa ika-10 siglo ni Salomon at ng iba sa mas huli. Natagpuan dito ang isang maliit na tapyas na batong-apog na naglilista ng mga buwan ng taon ng pagsasaka, ang Kalendaryo ng Gezer, na karaniwang ipinepetsa sa ika-10 siglo BK."
    - "Sa panahong Helenistiko, ang bayan, na tinawag noon na Gazara, ay isang muog ng mga Seleucid. Mga 142 BK, sinakop ito ni Simon na Macabeo, pinalayas ang mga tao nito, nagpatira roon ng mga taong tumutupad ng kautusan, kinutaan ito at ginawang luklukan ng kaniyang anak na si Juan, kapitan ng hukbo. Ang mga inskripsiyong tinibag sa mga bato sa palibot ng gulod ay nagsasabing “hangganan ng Gezer” sa mga titik Hebreo at “ni Alkios” sa Griyego; mula ang mga ito sa panahong Hasmoneo o Herodiano at pinagtitibay ang pagkakakilanlan ng lugar."
    - "Sa panahong Romano, lumiit ang Gezer at naging nayon. Tinatawag ito ni Eusebio na Gazara, isang nayon na apat na milya sa hilaga ng Nicopolis, ang dating Emaus, at sa panahong Byzantine ay kakaunti na lamang ang naninirahan sa lumang lugar."
  da:
    - "Gezer ligger på en højderyg i udkanten af Sjefela, hvor vejen fra Jerusalem ned ad Ajjalon-dalen møder kystvejen. Folk boede første gang her i huler i 4. årtusinde f.Kr. I mellembronzealderen blev Gezer en stor befæstet by, med en række høje rejste sten, som dens første udgraver kaldte Højstedet. I Amarna-brevene fra 1300-tallet f.Kr. skriver dens konger, blandt dem Milkilu og Yapahu, til Farao, og sent i 1200-tallet f.Kr. praler Farao Merneptah på sin sejrsstele af, at Gezer var erobret."
    - "Josva besejrede Horam, konge af Gezer, som kom Lakisj til hjælp, men Efraim fordrev ikke kana'anæerne, der boede i Gezer, og de betalte skat. Byen blev senere givet til leviterne. Første Kongebog fortæller, at en farao indtog Gezer, brændte den og gav den som medgift til sin datter, Salomos hustru, og at Salomo genopbyggede den. Dens port med seks kamre, som portene i Megiddo og Hazor, dateres af nogle til Salomos 900-tal og af andre til senere. En lille kalkstenstavle med en liste over landbrugsårets måneder, Gezer-kalenderen, blev fundet her og dateres almindeligvis til 900-tallet f.Kr."
    - "I den hellenistiske tid var byen, da kaldt Gazara, en seleukidisk fæstning. Omkring 142 f.Kr. indtog Simon Makkabæeren den, fordrev dens folk, bosatte der mænd, som holdt loven, befæstede den og gjorde den til sæde for sin søn Johannes, hærfører. Indskrifter hugget i klipperne omkring højen lyder »Gezers grænse« med hebraiske bogstaver og »Alkios'« med græske; de stammer fra den hasmonæiske eller herodianske periode og bekræfter stedets identitet."
    - "I romersk tid skrumpede Gezer til en landsby. Eusebios kalder den Gazara, en landsby fire romerske mil nord for Nikopolis, det tidligere Emmaus, og i byzantinsk tid var det gamle sted kun tyndt befolket."
  sr:
    - "Гезер стоји на гребену на ободу Сефеле, где се пут од Јерусалима низ долину Ајалона среће с приобалним друмом. Људи су овде први пут живели у пећинама у четвртом миленијуму п. н. е. У средњем бронзаном добу Гезер је постао велик зидани град, с низом високих усправних камења које је његов први ископавач назвао Узвишица. У Амарнским писмима из четрнаестог века п. н. е. његови цареви, међу њима Милкилу и Јапаху, пишу Фараону, а крајем тринаестог века п. н. е. фараон Мернептах хвалио се на својој стели победе да је Гезер освојен."
    - "Исус је победио Орама, цара гезерског, који је дошао у помоћ Лахису, али Јефрем није изагнао Хананеје који су живели у Гезеру, и они су плаћали данак. Град је касније дат Левитима. Прва књига о Царевима приповеда да је фараон узео Гезер, спалио га и дао га као прћију својој кћери, Соломуновој жени, и да га је Соломун обновио. Његову капију са шест одаја, као и капије Мегида и Асора, једни датују у Соломунов десети век, а други касније. Овде је пронађена мала кречњачка плочица са списком месеци пољопривредне године, Гезерски календар, који се обично датује у десети век п. н. е."
    - "У хеленистичко доба град, тада назван Газара, био је селеукидско упориште. Око 142. п. н. е. Симон Макавејац заузео га је, протерао његов народ, населио ту људе који су држали закон, утврдио га и учинио седиштем свог сина Јована, заповедника војске. Натписи урезани у стене око хумке гласе „међа Гезера“ хебрејским словима и „Алкијева“ грчким; потичу из хасмонејског или иродовског раздобља и потврђују идентитет налазишта."
    - "У римско доба Гезер се свео на село. Јевсевије га назива Газара, село четири миље северно од Никопоља, некадашњег Емауса, а у византијско доба старо налазиште било је тек слабо насељено."
  hu:
    - "Gézer a Sefélá szélén emelkedő gerincen áll, ahol a Jeruzsálemből az Ajjalon völgyén lefelé vezető út találkozik a tengerparti főúttal. Az első lakók a Kr. e. 4. évezredben barlangokban éltek itt. A középső bronzkorban Gézer nagy, fallal körülvett várossá lett, magas álló kövek sorával, amelyet első ásatója Magaslatnak nevezett. A Kr. e. 14. századi Amarna-levelekben királyai, köztük Milkilu és Jápahu, a fáraónak írnak, és a Kr. e. 13. század végén Merneptah fáraó győzelmi sztéléjén azzal dicsekedett, hogy Gézert elfoglalták."
    - "Józsué legyőzte Hórámot, Gézer királyát, aki Lákis segítségére jött, de Efraim nem űzte ki a Gézerben lakó kánaánitákat, akik adót fizettek. A várost később a lévitáknak adták. A Királyok első könyve szerint egy fáraó elfoglalta Gézert, felégette, és hozományul adta leányának, Salamon feleségének, Salamon pedig újjáépítette. Hatkamrás kapuját, akárcsak Megiddó és Hácór kapuit, egyesek Salamon Kr. e. 10. századára, mások későbbre keltezik. Itt találtak egy kis mészkő táblát, amely a mezőgazdasági év hónapjait sorolja fel, a Gézeri naptárt, amelyet általában a Kr. e. 10. századra keltezik."
    - "A hellenisztikus korban a város, akkor Gazara, szeleukida erőd volt. Kr. e. 142 körül Simon, a makkabeus elfoglalta, kiűzte lakóit, a törvényt megtartó férfiakat telepített oda, megerősítette, és fia, János, a hadsereg parancsnoka székhelyévé tette. A halom körüli sziklákba vésett feliratok héber betűkkel „Gézer határa”, görögül „Alkiosé” szavakat olvasnak; a hasmóneus vagy a heródesi korból származnak, és megerősítik a lelőhely azonosságát."
    - "A római korban Gézer faluvá zsugorodott. Eusebius Gazarának nevezi, Nikopolisztól, az egykori Emmaustól négy mérföldre északra fekvő falunak, a bizánci korban pedig a régi lelőhely csak gyéren volt lakott."
  fi:
    - "Geser sijaitsee harjanteella Sefelan reunalla, missä Jerusalemista alas Ajalonin laaksoa laskeutuva tie kohtaa rannikon valtatien. Ihmiset asuivat täällä ensimmäisen kerran luolissa 4. vuosituhannella eaa. Keskipronssikaudella Geserista tuli suuri muurien ympäröimä kaupunki, jossa oli rivi korkeita pystykiviä, joita sen ensimmäinen kaivaja kutsui uhrikukkulaksi. 1300-luvun eaa. Amarna-kirjeissä sen kuninkaat, muiden muassa Milkilu ja Yapahu, kirjoittavat faraolle, ja 1200-luvun eaa. lopulla farao Merneptah kehui voittostelallaan, että Geser oli vallattu."
    - "Joosua voitti Geserin kuninkaan Horamin, joka tuli auttamaan Lakisia, mutta Efraim ei karkoittanut Geserissä asuneita kanaanilaisia, ja nämä maksoivat veroa. Kaupunki annettiin myöhemmin leeviläisille. Ensimmäinen Kuninkaiden kirja kertoo, että farao valtasi Geserin, poltti sen ja antoi sen myötäjäisinä tyttärelleen, Salomon vaimolle, ja että Salomo rakensi sen uudelleen. Sen kuusikammioinen portti, kuten Megiddon ja Hasorin portit, ajoitetaan joidenkin mukaan Salomon 900-luvulle ja toisten mukaan myöhemmäksi. Pieni kalkkikivitaulu, joka luettelee maatalousvuoden kuukaudet, Geserin kalenteri, löytyi täältä, ja se ajoitetaan yleisesti 900-luvulle eaa."
    - "Hellenistisellä ajalla kaupunki, jota silloin kutsuttiin Gazaraksi, oli seleukidien linnoitus. Noin vuonna 142 eaa. Simon makkabilainen valtasi sen, karkotti sen asukkaat, asetti sinne lakia noudattavia miehiä, linnoitti sen ja teki siitä poikansa Johanneksen, armeijan päällikön, asuinpaikan. Kummun ympärillä kallioihin hakatut kirjoitukset kuuluvat ”Geserin raja” heprealaisin kirjaimin ja ”Alkioksen” kreikaksi; ne ovat hasmonealaiselta tai herodeslaiselta ajalta ja vahvistavat paikan tunnistuksen."
    - "Rooman aikana Geser kutistui kyläksi. Eusebios kutsuu sitä nimellä Gazara, kylä 4 mailia pohjoiseen Nikopoliksesta, entisestä Emmauksesta, ja bysanttilaisella ajalla vanha paikka oli vain harvaan asuttu."
  vi:
    - "Ghê-xe nằm trên một sống đồi ở rìa Sê-phê-la, nơi con đường từ Giê-ru-sa-lem xuống thung lũng A-gia-lôn gặp xa lộ ven biển. Người ta lần đầu sống ở đây trong các hang động vào thiên niên kỷ 4 TCN. Vào thời Đồ Đồng Giữa, Ghê-xe trở thành một thành lớn có tường bao, với một hàng đá dựng cao mà người khai quật đầu tiên gọi là Nơi Cao. Trong các thư Amarna của thế kỷ 14 TCN, các vua của thành, trong đó có Milkilu và Yapahu, viết cho Pha-ra-ôn, và cuối thế kỷ 13 TCN Pha-ra-ôn Merneptah khoe trên bia chiến thắng rằng Ghê-xe đã bị chiếm."
    - "Giô-suê đánh bại Hô-ram, vua Ghê-xe, người đến giúp La-ki, nhưng Ép-ra-im không đuổi dân Ca-na-an ở Ghê-xe, và họ nộp cống. Thành về sau được giao cho người Lê-vi. Sách 1 Các Vua kể rằng một Pha-ra-ôn chiếm Ghê-xe, đốt thành và tặng làm của hồi môn cho con gái mình, vợ của Sa-lô-môn, và Sa-lô-môn xây lại thành. Cổng sáu phòng của thành, như của Mê-ghi-đô và Hát-so, được một số người định niên đại vào thế kỷ 10 của Sa-lô-môn và những người khác thì muộn hơn. Một bảng đá vôi nhỏ liệt kê các tháng của năm nông nghiệp, Lịch Gezer, được tìm thấy ở đây và thường được định niên đại vào thế kỷ 10 TCN."
    - "Vào thời Hy Lạp hóa, thành, lúc đó gọi là Gazara, là một thành trì của Seleucid. Khoảng năm 142 TCN Si-môn Maccabee chiếm thành, trục xuất dân, đưa vào ở những người giữ luật pháp, củng cố thành và biến thành nơi ở của con trai ông là Giăng, tướng chỉ huy quân đội. Các văn bia khắc vào đá quanh gò đọc là “ranh Gezer” bằng chữ Hê-bơ-rơ và “của Alkios” bằng tiếng Hy Lạp; chúng có từ thời Hasmonean hoặc thời Hê-rốt và xác nhận danh tính của địa điểm."
    - "Vào thời La Mã Ghê-xe co lại thành một làng. Eusebius gọi đó là Gazara, một làng cách Ni-cô-bô-li, tức Em-ma-út xưa, 4 dặm về phía bắc, và vào thời Byzantine địa điểm cũ chỉ có dân cư thưa thớt."
  ro:
    - "Ghezer se află pe o creastă la marginea Șefelei, unde drumul de la Ierusalim pe valea Aialonului se întâlnește cu magistrala litorală. Oamenii au locuit aici întâi în peșteri, în mileniul al IV-lea î.Hr. În Bronzul Mijlociu, Ghezer a devenit un oraș mare înconjurat de ziduri, cu un șir de pietre înalte înfipte, pe care primul său cercetător l-a numit Locul Înalt. În scrisorile de la Amarna din secolul al XIV-lea î.Hr., regii săi, între ei Milkilu și Iapahu, scriu faraonului, iar spre sfârșitul secolului al XIII-lea î.Hr., faraonul Merneptah s-a lăudat pe stela sa de victorie că Ghezerul fusese cucerit."
    - "Iosua l-a învins pe Horam, regele Ghezerului, care venise în ajutorul Lachișului, dar Efraim nu i-a izgonit pe canaaniții ce locuiau în Ghezer, și aceștia au plătit tribut. Orașul a fost dat mai târziu leviților. Cartea întâi a Regilor spune că un faraon a luat Ghezerul, l-a ars și l-a dat ca zestre fiicei sale, soția lui Solomon, iar Solomon l-a reconstruit. Poarta sa cu șase camere, ca cele din Meghido și Hațor, este datată de unii în secolul al X-lea al lui Solomon, iar de alții mai târziu. Aici a fost găsită o mică tăbliță de calcar cu lunile anului agricol, Calendarul din Ghezer, datat de obicei în secolul al X-lea î.Hr."
    - "În epoca elenistică, orașul, numit atunci Gazara, era o fortăreață seleucidă. În jurul anului 142 î.Hr., Simon Macabeul l-a luat, i-a scos pe locuitori, a așezat acolo oameni care păzeau legea, l-a întărit și l-a făcut reședința fiului său Ioan, căpetenia oștirii. Inscripțiile săpate în stâncile din jurul movilei, „hotarul Ghezerului” cu litere ebraice și „al lui Alkios” în greacă, datează din epoca hasmoneană sau herodiană și confirmă identitatea locului."
    - "În epoca romană, Ghezer s-a redus la un sat. Eusebiu îl numește Gazara, un sat la patru mile spre nord de Nicopole, fostul Emaus, iar în epoca bizantină vechiul loc era doar rar locuit."
  bg:
    - "Гезер стои на хребет на края на Шефела, където пътят от Йерусалим надолу по долината Аялон се среща с крайбрежния път. Хора за първи път живеят тук в пещери през IV хил. пр.н.е. През средната бронзова епоха Гезер стана голям град със стени, с редица високи изправени камъни, които първият му разкопвач нарече Високото място. В писмата от Амарна от XIV в. пр.н.е. царете му, сред тях Милкилу и Япаху, пишат на фараона, а в края на XIII в. пр.н.е. фараон Мернептах се хвали на победната си стела, че Гезер е бил превзет."
    - "Иисус Навин разби Хорам, царя на Гезер, който дойде да помогне на Лахис, но Ефрем не изгони ханаанците, които живееха в Гезер, и те плащаха данък. По-късно градът беше даден на левитите. 3 Царе разказва, че един фараон превзел Гезер, изгорил го и го дал като зестра на дъщеря си, жената на Соломон, и че Соломон го съградил отново. Шесткамерната му порта, подобно на тези в Мегидо и Хацор, някои датират към X в. на Соломон, а други — по-късно. Тук беше намерена малка варовикова плочка с месеците на земеделската година, Гезерският календар, обикновено датирана към X в. пр.н.е."
    - "През елинистическата епоха градът, наричан тогава Газара, беше селевкидска крепост. Около 142 г. пр.н.е. Симон Макавей го превзе, изгони жителите му, засели там мъже, които спазваха закона, укрепи го и го направи седалище на сина си Йоан, военачалник на войската. Надписи, издълбани в скалите около могилата, гласят „предел на Гезер“ с еврейски букви и „на Алкий“ на гръцки; те са от хасмонейския или Иродовия период и потвърждават идентичността на мястото."
    - "През римско време Гезер се смали до село. Евсевий го нарича Газара, село на четири мили северно от Никопол, бившия Емаус, а през византийската епоха старото място беше само рядко населено."
