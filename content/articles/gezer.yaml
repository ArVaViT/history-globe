# Overview article (ADR 0007). Mainstream facts only; disputed datings are named as such.
id: gezer
place: aed6538
title:
  en: "Gezer"
  ru: "Газер"
  uk: "Гезер"
  es: "Gezer"
  pt: "Gezer"
  de: "Geser"
  fr: "Guézer"
body:
  en:
    - "Gezer stands on a ridge at the edge of the Shephelah, where the road from Jerusalem down the valley of Aijalon meets the coastal highway. People first lived here in caves in the fourth millennium BC. In the Middle Bronze Age Gezer became a large walled city, with a row of tall standing stones that its first excavator called the High Place. In the Amarna letters of the fourteenth century BC its kings, among them Milkilu and Yapahu, write to Pharaoh, and late in the thirteenth century BC Pharaoh Merneptah boasted on his victory stela that Gezer had been seized."
    - "Joshua defeated Horam, king of Gezer, who came to help Lachish, but Ephraim did not drive out the Canaanites who lived in Gezer, and they paid tribute. The town was later given to the Levites. 1 Kings tells that a pharaoh took Gezer, burned it and gave it as a dowry to his daughter, Solomon's wife, and that Solomon rebuilt it. Its six-chambered gate, like those of Megiddo and Hazor, is dated by some to Solomon's tenth century and by others later. A small limestone tablet listing the months of the farming year, the Gezer Calendar, was found here and is commonly dated to the tenth century BC."
    - 'In the Hellenistic age the town, then called Gazara, was a Seleucid stronghold. About 142 BC Simon the Maccabee took it, put out its people, settled there men who kept the law, fortified it and made it the seat of his son John, captain of the army. Inscriptions cut in the rocks around the mound read "boundary of Gezer" in Hebrew letters and "of Alkios" in Greek; they date from the Hasmonean or the Herodian period and confirm the site''s identity.'
    - "In Roman times Gezer shrank to a village. Eusebius calls it Gazara, a village four miles north of Nicopolis, the former Emmaus, and in Byzantine times the old site was only thinly inhabited."
  ru:
    - "Газер стоит на гряде у края Шефелы, там, где дорога из Иерусалима по долине Аиалонской выходит к приморскому пути. Первые жители селились здесь в пещерах в IV тысячелетии до н. э. В среднем бронзовом веке Газер стал большим укреплённым городом с рядом высоких каменных столбов, который его первый раскопщик назвал «высотой». В амарнских письмах XIV века до н. э. его цари, среди них Милкилу и Япаху, пишут фараону, а в конце XIII века до н. э. фараон Мернептах похвалялся на победной стеле, что Газер захвачен."
    - "Иисус Навин поразил Горама, царя Газерского, пришедшего на помощь Лахису, но Ефрем не изгнал хананеев, живших в Газере, и они платили дань. Позже город отдали левитам. Третья книга Царств рассказывает, что фараон взял Газер, сжёг его и отдал в приданое своей дочери, жене Соломона, а Соломон отстроил его. Его шестикамерные ворота, подобные воротам Мегиддона и Асора, одни датируют X веком Соломона, другие — более поздним временем. Здесь же нашли небольшую известняковую табличку с перечнем месяцев земледельческого года — Газерский календарь, который обычно датируют X веком до н. э."
    - "В эллинистическую эпоху город, называвшийся тогда Газарой, был опорной крепостью Селевкидов. Около 142 г. до н. э. Симон Маккавей взял его, выселил жителей, поселил людей, соблюдавших закон, укрепил город и сделал его местопребыванием своего сына Иоанна, начальника войска. Надписи, высеченные на скалах вокруг холма, гласят «граница Газера» еврейскими буквами и «Алкиоса» по-гречески; они относятся к хасмонейскому или к иродову времени и подтверждают, что это то самое место."
    - "В римское время Газер сократился до селения. Евсевий называет его Газарой, селением в четырёх милях к северу от Никополя, прежнего Эммауса, а в византийское время старое место было заселено лишь редко."
  uk:
    - "Гезер стоїть на хребті на краю Шефели, де дорога з Єрусалима вниз долиною Аялона сходиться з прибережною магістраллю. Люди вперше оселилися тут у печерах у IV тисячолітті до н. е. За доби середньої бронзи Гезер став великим містом з мурами, з рядом високих стоячих каменів, який його перший розкопувач назвав Висотою. В амарнських листах XIV ст. до н. е. його царі, серед них Мілкілу й Япаху, пишуть фараонові, а наприкінці XIII ст. до н. е. фараон Мернептах хвалився на своїй стелі перемоги, що Гезер було захоплено."
    - "Ісус Навин розбив Горама, царя Гезера, який прийшов на допомогу Лахішу, але Єфрем не вигнав ханаанців, що жили в Гезері, і вони платили данину. Згодом місто віддали левітам. Перша книга Царів розповідає, що фараон узяв Гезер, спалив його й віддав як придане своїй дочці, дружині Соломона, і що Соломон його відбудував. Його брама з шістьма приміщеннями, як у Мегіддо й Гацора, датується одними Соломоновим X ст., іншими — пізніше. Тут знайдено невелику вапнякову табличку з переліком місяців землеробського року — Календар із Гезера, який зазвичай датують X ст. до н. е."
    - "За еллінізму місто, тоді зване Газара, було селевкідською твердинею. Близько 142 р. до н. е. Симон Макавей узяв його, вигнав його мешканців, оселив там людей, що дотримувалися Закону, укріпив його й зробив резиденцією свого сина Івана, начальника війська. Написи, вирізьблені в скелях навколо городища, читаються «межа Гезера» єврейськими літерами та «Алкіоса» грецькими; вони походять із хасмонейського або іродіанського часу й підтверджують ототожнення місця."
    - "За римських часів Гезер зменшився до села. Євсевій називає його Газара, село за чотири милі на північ від Нікополя, колишнього Еммауса, а за візантійських часів давнє місце було заселене лише слабко."
  es:
    - "Gezer se alza en una loma en el borde de la Sefelá, donde el camino de Jerusalén por el valle de Ajalón se encuentra con la gran vía de la costa. Los primeros habitantes vivieron aquí en cuevas en el cuarto milenio a. C. En la Edad del Bronce Medio Gezer se convirtió en una gran ciudad amurallada, con una hilera de altas piedras erguidas que su primer excavador llamó el Lugar Alto. En las cartas de Amarna del siglo XIV a. C. sus reyes, entre ellos Milkilu y Yapahu, escriben al faraón, y a fines del siglo XIII a. C. el faraón Merenptah se jactó en su estela de victoria de que Gezer había sido capturada."
    - "Josué derrotó a Horam, rey de Gezer, que acudió en ayuda de Laquis, pero Efraín no expulsó a los cananeos que habitaban en Gezer, y estos pagaron tributo. La ciudad fue dada más tarde a los levitas. 1 Reyes cuenta que un faraón tomó Gezer, la quemó y se la dio como dote a su hija, esposa de Salomón, y que Salomón la reconstruyó. Su puerta de seis cámaras, como las de Meguido y Hazor, es fechada por algunos en el siglo X de Salomón y por otros más tarde. Aquí se halló una pequeña tablilla de piedra caliza con la lista de los meses del año agrícola, el Calendario de Gezer, que suele fecharse en el siglo X a. C."
    - "En la época helenística la ciudad, llamada entonces Gazara, era una plaza fuerte seléucida. Hacia el 142 a. C. Simón el Macabeo la tomó, expulsó a su gente, estableció allí a hombres que guardaban la ley, la fortificó y la hizo sede de su hijo Juan, jefe del ejército. Las inscripciones talladas en las rocas alrededor del montículo dicen «límite de Gezer» en letras hebreas y «de Alkios» en griego; datan de la época asmonea o herodiana y confirman la identidad del sitio."
    - "En tiempos romanos Gezer quedó reducida a una aldea. Eusebio la llama Gazara, aldea a cuatro millas al norte de Nicópolis, la antigua Emaús, y en época bizantina el viejo sitio estaba solo escasamente habitado."
  pt:
    - "Gezer ergue-se numa crista na orla da Sefelá, onde a estrada que desce de Jerusalém pelo vale de Aijalom encontra a rodovia da costa. As pessoas viveram aqui primeiro em cavernas, no quarto milênio a.C. Na Idade do Bronze Médio, Gezer tornou-se uma grande cidade murada, com uma fileira de altas pedras eretas que seu primeiro escavador chamou de Lugar Alto. Nas cartas de Amarna do século XIV a.C., seus reis, entre eles Milkilu e Yapahu, escrevem ao faraó, e no fim do século XIII a.C. o faraó Merneptá se gabou, em sua estela da vitória, de que Gezer fora tomada."
    - "Josué derrotou Horão, rei de Gezer, que veio ajudar Laquis, mas Efraim não expulsou os cananeus que viviam em Gezer, e eles pagaram tributo. A cidade foi depois dada aos levitas. Primeiro Reis conta que um faraó tomou Gezer, queimou-a e a deu como dote à sua filha, esposa de Salomão, e que Salomão a reconstruiu. Seu portão de seis câmaras, como os de Megido e Hazor, é datado por alguns do século X de Salomão e por outros de época posterior. Uma pequena tábua de calcário que lista os meses do ano agrícola, o Calendário de Gezer, foi achada aqui e é comumente datada do século X a.C."
    - "Na época helenística a cidade, então chamada Gazara, era um reduto selêucida. Por volta de 142 a.C., Simão Macabeu a tomou, expulsou seu povo, estabeleceu ali homens que guardavam a lei, fortificou-a e fez dela a sede de seu filho João, comandante do exército. Inscrições cortadas nas rochas ao redor do monte dizem “limite de Gezer” em letras hebraicas e “de Alkios” em grego; datam do período asmoneu ou herodiano e confirmam a identidade do sítio."
    - "Em tempos romanos Gezer encolheu até virar uma aldeia. Eusébio a chama Gazara, uma aldeia a quatro milhas ao norte de Nicópolis, a antiga Emaús, e em tempos bizantinos o antigo sítio era apenas escassamente habitado."
  de:
    - "Geser liegt auf einem Höhenrücken am Rand der Schefela, wo die Straße von Jerusalem durch das Tal von Ajalon auf die Küstenstraße trifft. Menschen lebten hier zuerst im 4. Jahrtausend v. Chr. in Höhlen. In der Mittelbronzezeit wurde Geser zu einer großen ummauerten Stadt, mit einer Reihe hoher Standsteine, die sein erster Ausgräber die Kulthöhe nannte. In den Amarnabriefen des 14. Jahrhunderts v. Chr. schreiben seine Könige, darunter Milkilu und Yapahu, an den Pharao, und spät im 13. Jahrhundert v. Chr. rühmte sich Pharao Merenptah auf seiner Siegesstele, Geser sei genommen worden."
    - "Josua schlug Horam, den König von Geser, der Lachisch zu Hilfe kam, doch Ephraim vertrieb die Kanaaniter nicht, die in Geser wohnten, und sie wurden zinsbar. Die Stadt wurde später den Leviten gegeben. Das erste Buch der Könige erzählt, ein Pharao habe Geser genommen, mit Feuer verbrannt und seiner Tochter, Salomos Frau, als Mitgift gegeben, und Salomo habe es wieder aufgebaut. Sein Tor mit sechs Kammern, wie die von Megiddo und Hazor, wird von einigen in Salomos 10. Jahrhundert, von anderen später datiert. Eine kleine Kalksteintafel mit den Monaten des bäuerlichen Jahres, der Geser-Kalender, wurde hier gefunden und gewöhnlich ins 10. Jahrhundert v. Chr. datiert."
    - "In hellenistischer Zeit war die Stadt, damals Gazara genannt, eine seleukidische Festung. Um 142 v. Chr. nahm Simon der Makkabäer sie ein, vertrieb ihre Bewohner, siedelte dort gesetzestreue Männer an, befestigte sie und machte sie zum Sitz seines Sohnes Johannes, des Heerführers. Inschriften in den Felsen rings um den Hügel lesen „Grenze von Geser“ in hebräischen Buchstaben und „des Alkios“ auf Griechisch; sie stammen aus hasmonäischer oder herodianischer Zeit und bestätigen die Identität der Stätte."
    - "In römischer Zeit schrumpfte Geser zu einem Dorf. Eusebius nennt es Gazara, ein Dorf vier Meilen nördlich von Nikopolis, dem früheren Emmaus, und in byzantinischer Zeit war die alte Stätte nur dünn besiedelt."
  fr:
    - "Guézer se dresse sur une crête à la lisière de la Shéphéla, là où la route de Jérusalem descendant la vallée d’Ajalon rejoint la grande route côtière. On y vécut d’abord dans des grottes au IVe millénaire av. J.-C. À l’âge du Bronze moyen, Guézer devint une grande ville fortifiée, avec une rangée de hautes pierres dressées que son premier fouilleur nomma le Haut Lieu. Dans les lettres d’Amarna du XIVe siècle av. J.-C., ses rois, dont Milkilu et Yapahu, écrivent au pharaon, et à la fin du XIIIe siècle av. J.-C. le pharaon Merneptah se vanta sur sa stèle de victoire d’avoir pris Guézer."
    - "Josué battit Horam, roi de Guézer, venu au secours de Lakis, mais Éphraïm ne chassa pas les Cananéens qui habitaient à Guézer, et ceux-ci payèrent tribut. La ville fut plus tard donnée aux Lévites. Le premier livre des Rois raconte qu’un pharaon s’empara de Guézer, l’incendia et la donna en dot à sa fille, épouse de Salomon, et que Salomon la rebâtit. Sa porte à six chambres, comme celles de Meguiddo et de Hatsor, est datée par certains du Xe siècle de Salomon et par d’autres d’une époque plus tardive. Une petite tablette de calcaire énumérant les mois de l’année agricole, le calendrier de Guézer, y fut trouvée et est couramment datée du Xe siècle av. J.-C."
    - "À l’époque hellénistique, la ville, alors appelée Gazara, était une place forte séleucide. Vers 142 av. J.-C., Simon le Maccabée la prit, en chassa les habitants, y établit des hommes observant la Loi, la fortifia et en fit la résidence de son fils Jean, chef de l’armée. Des inscriptions taillées dans les rochers autour du tertre se lisent « limite de Guézer » en lettres hébraïques et « d’Alkios » en grec ; elles datent de la période hasmonéenne ou hérodienne et confirment l’identité du site."
    - "À l’époque romaine, Guézer se réduisit à un village. Eusèbe l’appelle Gazara, village à quatre milles au nord de Nicopolis, l’ancienne Emmaüs, et à l’époque byzantine l’ancien site n’était que peu habité."
