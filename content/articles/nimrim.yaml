# Overview article (ADR 0007). Mainstream facts only; the waters of Nimrim in two oracles on Moab; the two candidate wadis are given, with the southern one as the usual view.
id: nimrim
place: ace3edc
title:
  en: "Nimrim"
  ru: "Нимрим"
body:
  en:
    - "Nimrim is known only from “the waters of Nimrim” in the laments over Moab in Isaiah and Jeremiah. Isaiah says, “For the waters of Nimrim shall be desolate: for the hay is withered away, the grass faileth, there is no green thing”, and Jeremiah repeats the line among Moab's towns from Heshbon to Zoar and Horonaim. Perennial water on the dry slopes above the Dead Sea meant pasture, and its failing is the image of the land's ruin. Nothing else is told of the place."
    - "Two wadis are proposed. Most scholars favour Wadi en-Numeira in the south, which flows to the Dead Sea plain near the Early Bronze Age ruin of Numeira, because the oracles set Nimrim beside Zoar and Horonaim; the map puts its point there. Others prefer Wadi Nimrin in the north, opposite Jericho, by Beth-nimrah of Gad, where the name survives but the setting fits the oracles less well. Both are today in Jordan."
  ru:
    - "Нимрим известен только по словам о водах Нимрима в плачах о Моаве у Исаии и Иеремии. Исаия говорит: «потому что воды Нимрима иссякли, луга засохли, трава выгорела, не стало зелени», а Иеремия повторяет эти слова среди городов Моава от Есевона до Сигора и Оронаима. Постоянная вода на сухих склонах над Мёртвым морем означала пастбища, и её иссякание — образ гибели страны. Больше о месте ничего не сказано."
    - "Предлагают две долины. Большинство учёных предпочитают Вади эн-Нумейра на юге, которое выходит к равнине Мёртвого моря близ руин Нумейры раннего бронзового века, потому что пророчества ставят Нимрим рядом с Сигором и Оронаимом; там и стоит точка на карте. Другие выбирают Вади Нимрин на севере, против Иерихона, у Беф-Нимры Гадовой, где имя сохранилось, но обстановка хуже подходит к пророчествам. Обе долины сегодня в Иордании."
scripture:
  - Isa.15.5-Isa.15.6
  - Jer.48.34
