body:
  en:
    - "Nimrim is known only from “the waters of Nimrim” in the laments over Moab in Isaiah and Jeremiah. Isaiah says, “For the waters of Nimrim shall be desolate: for the hay is withered away, the grass faileth, there is no green thing”, and Jeremiah repeats the line among Moab's towns from Heshbon to Zoar and Horonaim. Perennial water on the dry slopes above the Dead Sea meant pasture, and its failing is the image of the land's ruin. Nothing else is told of the place."
    - "Two wadis are proposed. Many scholars favour Wadi en-Numeira in the south, which flows to the Dead Sea plain near the Early Bronze Age ruin of Numeira, because the oracles set Nimrim beside Zoar and Horonaim; the map puts its point there. Others prefer Wadi Nimrin in the north, opposite Jericho, by Beth-nimrah of Gad, where the name survives but the setting fits the oracles less well. Both are today in Jordan."
  ru:
    - "Нимрим известен только по словам о водах Нимрима в плачах о Моаве у Исаии и Иеремии. Исаия говорит: «потому что воды Нимрима иссякли, луга засохли, трава выгорела, не стало зелени», а Иеремия повторяет эти слова среди городов Моава от Есевона до Сигора и Оронаима. Постоянная вода на сухих склонах над Мёртвым морем означала пастбища, и её иссякание — образ гибели страны. Больше о месте ничего не сказано."
    - "Предлагают две долины. Многие учёные предпочитают Вади эн-Нумейра на юге, которое выходит к равнине Мёртвого моря близ руин Нумейры раннего бронзового века, потому что пророчества ставят Нимрим рядом с Сигором и Оронаимом; там и стоит точка на карте. Другие выбирают Вади Нимрин на севере, против Иерихона, у Беф-Нимры Гадовой, где имя сохранилось, но обстановка хуже подходит к пророчествам. Обе долины сегодня в Иордании."
  uk:
    - "Німрім відомий лише з «вод Німріму» в плачах над Моавом в Ісаї та Єремії. Ісая каже: «Бо висхнуть води в Нимримі, позасихають луги, трава вигорить, вся зелень ізникне», а Єремія повторює цей рядок серед міст Моаву від Гесбона до Сігора й Хоронаїма. Невсихаюча вода на сухих схилах над Мертвим морем означала пасовище, а її зникнення — образ руїни краю. Більше про це місце нічого не розповідається."
    - "Пропонують два уаді. Багато вчених віддають перевагу Ваді-ен-Нумейра на півдні, що тече до рівнини Мертвого моря поблизу руїн ранньої бронзової доби Нумейри, бо пророцтва ставлять Німрім поруч із Сігором і Хоронаїмом; карта розміщує його пункт саме там. Інші віддають перевагу Ваді-Німрін на півночі, навпроти Єрихона, біля Бет-Німри, що належала Гадові, де назва збереглася, але обставини гірше відповідають пророцтвам. Обидва нині в Йорданії."
  es:
    - "Nimrim se conoce solo por «las aguas de Nimrim» en las lamentaciones sobre Moab de Isaías y Jeremías. Isaías dice: «Las aguas de Nimrim serán consumidas, y secaráse la hierba, marchitaránse los retoños, todo verdor perecerá», y Jeremías repite la frase entre las ciudades de Moab desde Hesbón hasta Zoar y Horonaim. El agua perenne en las laderas secas sobre el mar Muerto significaba pasto, y su desaparición es la imagen de la ruina del país. Nada más se cuenta del lugar."
    - "Se proponen dos uadis. Muchos estudiosos prefieren el uadi en-Numeira, en el sur, que fluye hacia la llanura del mar Muerto cerca de las ruinas de Numeira, del Bronce Antiguo, porque los oráculos sitúan Nimrim junto a Zoar y Horonaim; el punto del mapa está allí. Otros prefieren el uadi Nimrin, en el norte, frente a Jericó, junto a Bet-nimra de Gad, donde el nombre se conserva, pero el entorno encaja peor con los oráculos. Ambos están hoy en Jordania."
  pt:
    - "Ninrim é conhecida apenas por “as águas de Ninrim” nas lamentações sobre Moabe em Isaías e Jeremias. Isaías diz: “Porque as águas de Ninrim ficarão desoladas; pois a erva secou, a relva tenra perece, não há nada verde”, e Jeremias repete o verso entre as cidades de Moabe, de Hesbom a Zoar e Horonaim. Água perene nas encostas secas acima do Mar Morto significava pasto, e sua falta é a imagem da ruína da terra. Nada mais se conta do lugar."
    - "Dois uádis são propostos. Muitos estudiosos preferem o Uádi en-Numeira, no sul, que deságua na planície do Mar Morto perto da ruína do Bronze Antigo de Numeira, porque os oráculos põem Ninrim ao lado de Zoar e Horonaim; o mapa coloca ali o seu ponto. Outros preferem o Uádi Nimrin, no norte, defronte de Jericó, junto a Bete-Ninra de Gade, onde o nome sobrevive, mas o cenário combina menos com os oráculos. Ambos ficam hoje na Jordânia."
  de:
    - "Nimrim ist nur durch „die Wasser zu Nimrim“ in den Klageliedern über Moab bei Jesaja und Jeremia bekannt. Jesaja sagt: „Denn die Wasser zu Nimrim versiegen, daß das Gras verdorrt und das Kraut verwelkt und kein Grünes wächst“, und Jeremia wiederholt den Vers unter den Städten Moabs von Heschbon bis Zoar und Horonajim: „denn auch die Wasser Nimrims sollen versiegen“. Dauerhaftes Wasser an den trockenen Hängen über dem Toten Meer bedeutete Weide, und sein Versiegen ist das Bild für den Untergang des Landes. Sonst wird über den Ort nichts erzählt."
    - "Vorgeschlagen werden zwei Wadis. Viele Gelehrte bevorzugen das Wadi en-Numeira im Süden, das nahe der frühbronzezeitlichen Ruine Numeira zur Ebene am Toten Meer fließt, weil die Orakel Nimrim neben Zoar und Horonajim stellen; die Karte setzt ihren Punkt dorthin. Andere ziehen das Wadi Nimrin im Norden vor, gegenüber von Jericho, bei Bet-Nimra in Gad, wo der Name fortlebt, die Lage aber weniger gut zu den Orakeln passt. Beide liegen heute in Jordanien."
  fr:
    - "Nimrim n’est connue que par « les eaux de Nimrim » dans les lamentations sur Moab d’Ésaïe et de Jérémie. Ésaïe dit : « Car les eaux de Nimrim sont ravagées, l’herbe est desséchée, le gazon est détruit, la verdure a disparu », et Jérémie reprend le trait parmi les villes de Moab, de Hesbon à Tsoar et à Choronaïm. Une eau pérenne sur les pentes sèches au-dessus de la mer Morte signifiait des pâturages, et sa défaillance est l’image de la ruine du pays. On ne dit rien d’autre du lieu."
    - "Deux oueds sont proposés. Beaucoup de spécialistes préfèrent le Wadi en-Numeira au sud, qui coule vers la plaine de la mer Morte près de la ruine de Numeira, de l’âge du Bronze ancien, parce que les oracles placent Nimrim à côté de Tsoar et de Choronaïm ; le point de la carte y est placé. D’autres préfèrent le Wadi Nimrin au nord, en face de Jéricho, près de Beth-Nimra de Gad, où le nom survit mais où le cadre convient moins bien aux oracles. Les deux sont aujourd’hui en Jordanie."
  it:
    - "Nimrim è nota solo dalle «acque di Nimrim» nei lamenti su Moab in Isaia e Geremia. Isaia dice: «le acque di Nimrim sono una desolazione, l’erba è seccata, l’erba minuta è scomparsa, non c’è più verdura», e Geremia ripete la frase tra le città di Moab da Chesbon a Soar e a Coronaim. L’acqua perenne sui pendii aridi sopra il Mar Morto significava pascolo, e il suo venir meno è l’immagine della rovina del paese. Del luogo non si dice altro."
    - "Si propongono due uadi. Molti studiosi preferiscono il Wadi en-Numeira a sud, che scorre verso la piana del Mar Morto presso la rovina di Numeira, del Bronzo Antico, perché gli oracoli pongono Nimrim accanto a Soar e a Coronaim; la mappa vi colloca il suo punto. Altri preferiscono il Wadi Nimrin a nord, di fronte a Gerico, presso Bet-Nimra di Gad, dove il nome sopravvive ma l’ambiente si accorda meno con gli oracoli. Oggi entrambi si trovano in Giordania."
  pl:
    - "Nimrim znane jest tylko z wyrażenia „wody Nimrym” w lamentach nad Moabem u Izajasza i Jeremiasza. Izajasz mówi: „że wody Nymrym zginą, że poschną zioła, uwiędnie trawa, a nic nie będzie zielonego”, a Jeremiasz powtarza ten wers wśród miast Moabu od Cheszbonu po Soar i Choronaim. Stała woda na suchych stokach nad Morzem Martwym oznaczała pastwisko, a jej brak jest obrazem ruiny kraju. Nic innego o tym miejscu nie wiadomo."
    - "Proponuje się dwa wadi. Wielu uczonych opowiada się za Wadi en-Numejra na południu, które spływa na równinę Morza Martwego koło ruin Numejra z wczesnej epoki brązu, ponieważ wyrocznie stawiają Nimrim obok Soar i Choronaim; mapa umieszcza tam swój punkt. Inni wolą Wadi Nimrin na północy, naprzeciw Jerycha, przy Bet-Nimra w Gadzie, gdzie nazwa przetrwała, lecz otoczenie gorzej pasuje do wyroczni. Oba leżą dziś w Jordanii."
  cs:
    - "Nimrím je známo jen z „vody Nimrim“ v nářcích nad Moábem u Izajáše a Jeremjáše. Izajáš praví: „Proto že vody Nimrim vymizejí, že uschne bylina, usvadne tráva, aniž co zeleného bude“, a Jeremjáš tento verš opakuje mezi moábskými městy od Chešbónu po Soar a Choronajim. Trvalá voda na suchých svazích nad Mrtvým mořem znamenala pastvu a její vyschnutí je obrazem zkázy země. Nic jiného se o místě nevypráví."
    - "Navrhují se dvě vádí. Mnozí učenci dávají přednost Vádí en-Numejra na jihu, které teče do pláně u Mrtvého moře poblíž ruin Numejra z rané doby bronzové, protože věštby kladou Nimrím vedle Soaru a Choronajimu; bod na mapě je tam. Jiní dávají přednost Vádí Nimrín na severu, naproti Jerichu, u Bét-nimry Gádovy, kde se jméno dochovalo, ale prostředí věštbám odpovídá hůře. Obě leží dnes v Jordánsku."
  nl:
    - "Nimrim is alleen bekend uit “de wateren van Nimrim” in de klaagliederen over Moab bij Jesaja en Jeremia. Jesaja zegt: “Want de wateren van Nimrim zullen enkel verwoesting wezen; want het gras is verdord, het tedere gras is vergaan, er is geen groente”, en Jeremia herhaalt de regel tussen Moabs steden van Chesbon tot Zoar en Choronaïm. Een bestendige waterbron op de droge hellingen boven de Dode Zee betekende weidegrond, en haar uitdrogen is het beeld van de ondergang van het land. Verder wordt over de plaats niets verteld."
    - "Er worden twee wadi’s voorgesteld. Veel geleerden geven de voorkeur aan de Wadi en-Numeira in het zuiden, die naar de vlakte van de Dode Zee stroomt bij de vroegbronstijdelijke ruïne Numeira, omdat de godsspraken Nimrim naast Zoar en Choronaïm plaatsen; het kaartpunt staat daar. Anderen verkiezen de Wadi Nimrin in het noorden, tegenover Jericho, bij Beth-Nimra van Gad, waar de naam voortleeft maar de ligging minder bij de godsspraken past. Beide liggen tegenwoordig in Jordanië."
  sv:
    - "Nimrim är bara känt från ”Nimrims vatten” i klagosångerna över Moab hos Jesaja och Jeremia. Jesaja säger: ”Nimrims vatten bliva torr ökenmark, gräset förtorkas, brodden vissnar, intet grönt lämnas kvar”, och Jeremia upprepar raden bland Moabs städer från Heshbon till Soar och Horonajim. Ständigt rinnande vatten på de torra sluttningarna ovanför Döda havet betydde bete, och dess sinande är bilden av landets ruin. Ingenting annat berättas om platsen."
    - "Två vadier föreslås. Många forskare föredrar Wadi en-Numeira i söder, som rinner mot Döda havets slätt nära den tidigbronsåldersruinen Numeira, eftersom orakeln ställer Nimrim vid sidan av Soar och Horonajim; kartan placerar sin punkt där. Andra föredrar Wadi Nimrin i norr, mittemot Jeriko, vid Gads Bet-Nimra, där namnet lever kvar men miljön passar orakeln sämre. Båda ligger i dag i Jordanien."
