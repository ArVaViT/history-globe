body:
  en:
    - "Ashkelon lay on the Mediterranean shore north of Gaza; its mound, Tel Ashkelon, is now a national park within the modern city. The town is named in Egyptian execration texts of the nineteenth and eighteenth centuries BC. In the Middle Bronze Age great earthen ramparts were raised around it, and a mudbrick gate with a vaulted passage, built in the first half of the second millennium BC, is among the oldest arches known. In the fourteenth century BC its ruler Yidya wrote to Pharaoh in the Amarna letters, and about 1208 BC Merneptah's stela names Ashkelon among the places he subdued in Canaan."
    - 'In the twelfth century BC, about 1170 BC by the excavators'' dating, the Philistines settled here, and Ashkelon became one of their five cities. Samson went down to Ashkelon and killed thirty of its men, and David''s lament for Saul says: "publish it not in the streets of Askelon". In 701 BC Sennacherib of Assyria deported its king Sidqa with his family and took Joppa and other towns that belonged to him. Amos, Zephaniah and Jeremiah foretold Ashkelon''s ruin.'
    - "In the month of Kislev 604 BC Nebuchadnezzar captured the city, carried off its king and plundered it; the Babylonian Chronicle says he turned it into a mound and heaps of ruins, and excavators found the burnt destruction layer. Ashkelon was rebuilt in the Persian period as a Phoenician town. Herodotus tells how Scythian raiders plundered its temple of Heavenly Aphrodite, which he calls the oldest temple of that goddess."
    - "Under the Hellenistic kings and Rome Ashkelon was a prosperous Greek city, independent of the Hasmoneans and of Herod, though Herod built baths, costly fountains and colonnades there. When the Jewish revolt broke out in AD 66, Jewish rebels attacked Ashkelon, and soon after two of their assaults on the walled city failed. By the fourth century Ashkelon had a bishop, and it remained a busy port into Byzantine times."
  ru:
    - "Аскалон стоял на берегу Средиземного моря к северу от Газы; его холм, Тель-Ашкелон, ныне — национальный парк в черте современного города. Город упомянут в египетских текстах проклятий XIX–XVIII веков до н. э. В среднем бронзовом веке его окружили огромные земляные валы, а глинобитные ворота со сводчатым проходом, построенные в первой половине II тысячелетия до н. э., — одна из древнейших известных арок. В XIV веке до н. э. его правитель Идия писал фараону в Амарнских письмах, а около 1208 г. до н. э. стела Мернептаха называет Аскалон среди покорённых им мест в Ханаане."
    - "В XII веке до н. э., по датировке раскопщиков около 1170 г. до н. э., здесь поселились филистимляне, и Аскалон стал одним из пяти их городов. Самсон ходил в Аскалон и убил там тридцать человек, а в плаче Давида о Сауле сказано: «не возвещайте на улицах Аскалона». В 701 г. до н. э. ассирийский царь Сеннахирим увёл в плен его царя Цидку с семьёй и взял Иоппию и другие принадлежавшие ему города. Амос, Софония и Иеремия предрекали Аскалону гибель."
    - "В месяце Кислеве 604 г. до н. э. Навуходоносор взял город, увёл его царя и разграбил его; Вавилонская хроника говорит, что он превратил его в холм и груды развалин, и раскопки нашли выжженный слой разрушения. В персидский период Аскалон отстроили как финикийский город. Геродот рассказывает, как скифы разграбили здесь храм Афродиты Небесной, который он называет древнейшим храмом этой богини."
    - "При эллинистических царях и Риме Аскалон был процветающим греческим городом, независимым и от Хасмонеев, и от Ирода, хотя Ирод построил здесь бани, дорогие фонтаны и колоннады. Когда в 66 г. н. э. вспыхнуло Иудейское восстание, иудейские повстанцы напали на Аскалон, а вскоре два их приступа на укреплённый город провалились. К IV веку в Аскалоне был епископ, и он оставался оживлённым портом и в византийское время."
  uk:
    - "Ашкелон лежав на середземноморському березі на північ від Гази; його пагорб, Тель-Ашкелон, нині — національний парк у межах сучасного міста. Місто названо в єгипетських текстах прокляття XIX–XVIII століть до н. е. У середню бронзову добу навколо нього зводили великі земляні вали, а цегляна брама зі склепінчастим проходом, збудована в першій половині II тисячоліття до н. е., є серед найдавніших відомих арок. У XIV столітті до н. е. його володар Йідія писав фараонові в листах з Амарни, а близько 1208 р. до н. е. стела Мернептаха називає Ашкелон серед місць, підкорених ним у Ханаані."
    - "У XII столітті до н. е., близько 1170 р. до н. е. за датуванням розкопників, тут оселилися филистимляни, і Ашкелон став одним з їхніх п'яти міст. Самсон спустився до Ашкелона й убив тридцять його чоловіків, а плач Давида за Саулом каже: «не звіщайте по улицях Аскалону». У 701 р. до н. е. Сінаххеріб Ассирійський вигнав його царя Сідку з родиною й узяв Яффу та інші міста, що йому належали. Амос, Софонія та Єремія провістили руїну Ашкелона."
    - "У місяці кіслеві 604 р. до н. е. Навуходоносор здобув місто, забрав його царя й пограбував його; Вавилонська хроніка каже, що він перетворив його на пагорб і купи руїн, і розкопники знайшли обпалений шар руйнування. Ашкелон відбудували в перську добу як фінікійське місто. Геродот розповідає, як скіфські нападники пограбували його храм Афродіти Небесної, який він називає найдавнішим храмом цієї богині."
    - "За елліністичних царів і Рима Ашкелон був заможним грецьким містом, незалежним від хасмонеїв і від Ірода, хоч Ірод збудував там лазні, дорогі фонтани й колонади. Коли в 66 р. н. е. вибухнуло юдейське повстання, юдейські повстанці напали на Ашкелон, а невдовзі два їхні штурми муроване місто відбило. До IV століття в Ашкелоні був єпископ, і він лишався жвавим портом до візантійських часів."
  es:
    - "Ascalón se hallaba en la costa del Mediterráneo, al norte de Gaza; su montículo, Tel Ashkelon, es hoy un parque nacional dentro de la ciudad moderna. La ciudad se nombra en textos egipcios de execración de los siglos XIX y XVIII a. C. En la Edad del Bronce Medio se levantaron en torno a ella grandes murallas de tierra, y una puerta de adobe con pasaje abovedado, construida en la primera mitad del segundo milenio a. C., se cuenta entre los arcos más antiguos conocidos. En el siglo XIV a. C. su gobernante Yidya escribió al faraón en las cartas de Amarna, y hacia 1208 a. C. la estela de Mernepta nombra Ascalón entre los lugares que sometió en Canaán."
    - "En el siglo XII a. C., hacia 1170 a. C. según la datación de los excavadores, los filisteos se establecieron aquí, y Ascalón se convirtió en una de sus cinco ciudades. Sansón descendió a Ascalón y mató a treinta de sus hombres, y el lamento de David por Saúl dice: «no deis las nuevas en las plazas de Ascalón». En 701 a. C. Senaquerib de Asiria deportó a su rey Sidqa con su familia y tomó Jope y otras ciudades que le pertenecían. Amós, Sofonías y Jeremías predijeron la ruina de Ascalón."
    - "En el mes de quislev de 604 a. C. Nabucodonosor capturó la ciudad, se llevó a su rey y la saqueó; la Crónica babilónica dice que la convirtió en un montículo y montones de ruinas, y los excavadores hallaron el estrato de destrucción quemado. Ascalón fue reconstruida en el período persa como ciudad fenicia. Heródoto cuenta cómo asaltantes escitas saquearon su templo de Afrodita Celeste, que él llama el más antiguo templo de esa diosa."
    - "Bajo los reyes helenísticos y Roma, Ascalón fue una próspera ciudad griega, independiente de los asmoneos y de Herodes, aunque Herodes construyó allí baños, costosas fuentes y columnatas. Cuando estalló la revuelta judía en 66 d. C., los rebeldes judíos atacaron Ascalón, y poco después dos de sus asaltos a la ciudad amurallada fracasaron. Para el siglo IV Ascalón tenía obispo, y siguió siendo un puerto activo hasta época bizantina."
  pt:
    - "Ascalom ficava na orla do Mediterrâneo ao norte de Gaza; seu montículo, Tel Ashkelon, é hoje um parque nacional dentro da cidade moderna. A cidade é citada em textos egípcios de execração dos séculos XIX e XVIII a.C. No Bronze Médio ergueram-se ao redor dela grandes muralhas de terra, e uma porta de tijolos de barro com passagem abobadada, construída na primeira metade do segundo milênio a.C., está entre os arcos mais antigos conhecidos. No século XIV a.C. seu governante Yidya escreveu ao Faraó nas cartas de Amarna, e por volta de 1208 a.C. a estela de Merneptá nomeia Ascalom entre os lugares que subjugou em Canaã."
    - "No século XII a.C., por volta de 1170 a.C. segundo a datação dos escavadores, os filisteus se estabeleceram aqui, e Ascalom tornou-se uma de suas cinco cidades. Sansão desceu a Ascalom e matou trinta de seus homens, e o lamento de Davi por Saul diz: “Não publiquem nas ruas de Asquelom”. Em 701 a.C., Senaqueribe da Assíria deportou seu rei Sidqa com a família e tomou Jope e outras cidades que lhe pertenciam. Amós, Sofonias e Jeremias predisseram a ruína de Ascalom."
    - "No mês de quisleu de 604 a.C., Nabucodonosor tomou a cidade, levou seu rei e a saqueou; a Crônica Babilônica diz que a transformou em montículo e montões de ruínas, e os escavadores acharam a camada de destruição queimada. Ascalom foi reconstruída no período persa como cidade fenícia. Heródoto conta como saqueadores citas pilharam seu templo de Afrodite Celeste, que ele chama o mais antigo templo dessa deusa."
    - "Sob os reis helenísticos e Roma, Ascalom foi uma próspera cidade grega, independente dos hasmoneus e de Herodes, embora Herodes ali construísse banhos, fontes custosas e colunatas. Quando a revolta judaica irrompeu em 66 d.C., rebeldes judeus atacaram Ascalom, e logo depois dois assaltos seus à cidade murada fracassaram. No século IV Ascalom tinha um bispo e permaneceu um porto movimentado até a época bizantina."
  de:
    - "Aschkelon lag an der Mittelmeerküste nördlich von Gaza; sein Hügel, Tel Aschkelon, ist heute ein Nationalpark innerhalb der modernen Stadt. Die Stadt wird in ägyptischen Ächtungstexten des 19. und 18. Jahrhunderts v. Chr. genannt. In der Mittelbronzezeit wurden große Erdwälle um sie aufgeworfen, und ein Lehmziegeltor mit gewölbtem Durchgang aus der ersten Hälfte des 2. Jahrtausends v. Chr. gehört zu den ältesten bekannten Bögen. Im 14. Jahrhundert v. Chr. schrieb ihr Herrscher Yidya in den Amarna-Briefen an den Pharao, und um 1208 v. Chr. nennt Merenptahs Stele Aschkelon unter den Orten, die er in Kanaan unterwarf."
    - "Im 12. Jahrhundert v. Chr., nach der Datierung der Ausgräber um 1170 v. Chr., siedelten sich hier die Philister an, und Aschkelon wurde eine ihrer fünf Städte. Simson ging nach Aschkelon hinab und erschlug dreißig seiner Männer, und Davids Klage um Saul sagt: „verkündet's nicht auf den Gassen zu Askalon“. 701 v. Chr. deportierte Sanherib von Assyrien seinen König Sidqa mit seiner Familie und nahm Joppe und andere Städte, die ihm gehörten. Amos, Zefanja und Jeremia sagten Aschkelons Untergang voraus."
    - "Im Monat Kislew 604 v. Chr. eroberte Nebukadnezar die Stadt, führte ihren König fort und plünderte sie; die Babylonische Chronik sagt, er habe sie zu einem Hügel und Trümmerhaufen gemacht, und die Ausgräber fanden die verbrannte Zerstörungsschicht. Aschkelon wurde in persischer Zeit als phönizische Stadt wiederaufgebaut. Herodot erzählt, wie skythische Räuber seinen Tempel der Himmlischen Aphrodite plünderten, den er den ältesten Tempel dieser Göttin nennt."
    - "Unter den hellenistischen Königen und Rom war Aschkelon eine blühende griechische Stadt, unabhängig von den Hasmonäern und von Herodes, obwohl Herodes dort Bäder, kostbare Brunnen und Säulenhallen baute. Als der jüdische Aufstand 66 n. Chr. ausbrach, griffen jüdische Aufständische Aschkelon an, und kurz darauf scheiterten zwei ihrer Angriffe auf die ummauerte Stadt. Im 4. Jahrhundert hatte Aschkelon einen Bischof, und es blieb bis in byzantinische Zeit ein reger Hafen."
  fr:
    - "Askalon se trouvait sur le littoral méditerranéen au nord de Gaza ; son tertre, Tel Ashkelon, est aujourd’hui un parc national dans la ville moderne. La ville est nommée dans des textes d’envoûtement égyptiens des XIXe et XVIIIe siècles av. J.-C. Au Bronze moyen, de grands remparts de terre furent élevés autour d’elle, et une porte en briques crues à passage voûté, bâtie dans la première moitié du IIe millénaire av. J.-C., compte parmi les plus anciennes arches connues. Au XIVe siècle av. J.-C., son souverain Yidya écrivit au pharaon dans les lettres d’Amarna, et vers 1208 av. J.-C. la stèle de Merenptah nomme Askalon parmi les lieux qu’il soumit en Canaan."
    - "Au XIIe siècle av. J.-C., vers 1170 av. J.-C. selon la datation des fouilleurs, les Philistins s’y établirent, et Askalon devint l’une de leurs cinq villes. Samson descendit à Askalon et y tua trente hommes, et la complainte de David sur Saül dit : « N’en publiez point la nouvelle dans les rues d’Askalon ». En 701 av. J.-C., Sanchérib d’Assyrie déporta son roi Sidqa avec sa famille et prit Joppé et d’autres villes qui lui appartenaient. Amos, Sophonie et Jérémie annoncèrent la ruine d’Askalon."
    - "Au mois de Kislev 604 av. J.-C., Nebucadnetsar prit la ville, emmena son roi et la pilla ; la Chronique babylonienne dit qu’il en fit un tertre et des tas de ruines, et les fouilleurs ont trouvé la couche de destruction par le feu. Askalon fut rebâtie à l’époque perse comme ville phénicienne. Hérodote raconte comment des pillards scythes ravagèrent son temple d’Aphrodite Céleste, qu’il dit le plus ancien temple de cette déesse."
    - "Sous les rois hellénistiques et Rome, Askalon fut une prospère cité grecque, indépendante des Hasmonéens et d’Hérode, bien qu’Hérode y bâtît des bains, des fontaines coûteuses et des colonnades. Quand la révolte juive éclata en 66 apr. J.-C., des rebelles juifs attaquèrent Askalon, et peu après deux de leurs assauts contre la ville fortifiée échouèrent. Au IVe siècle, Askalon avait un évêque, et elle resta un port actif jusqu’à l’époque byzantine."
  it:
    - "Ascalona sorgeva sulla riva del Mediterraneo a nord di Gaza; il suo tell, Tel Ashkelon, è oggi un parco nazionale all’interno della città moderna. La città è nominata nei testi egizi di esecrazione del XIX e XVIII secolo a.C. Nel Bronzo Medio furono innalzati intorno ad essa grandi bastioni di terra, e una porta di mattoni crudi con un passaggio a volta, costruita nella prima metà del II millennio a.C., è fra gli archi più antichi conosciuti. Nel XIV secolo a.C. il suo sovrano Yidya scrisse al faraone nelle lettere di Amarna, e intorno al 1208 a.C. la stele di Merneptah nomina Ascalona tra i luoghi da lui sottomessi in Canaan."
    - "Nel XII secolo a.C., intorno al 1170 a.C. secondo la datazione degli scavatori, i Filistei si stabilirono qui, e Ascalona divenne una delle loro cinque città. Sansone scese ad Ascalona e uccise trenta dei suoi uomini, e il lamento di Davide per Saul dice: «non lo pubblicate per le strade d’Askalon». Nel 701 a.C. Sennacherib d’Assiria deportò il suo re Sidqa con la famiglia e prese Giaffa e altre città che gli appartenevano. Amos, Sofonia e Geremia predissero la rovina di Ascalona."
    - "Nel mese di Kislev del 604 a.C. Nabucodonosor conquistò la città, portò via il suo re e la saccheggiò; la Cronaca babilonese dice che la ridusse a un tell e a cumuli di rovine, e gli scavatori hanno trovato lo strato di distruzione bruciato. Ascalona fu ricostruita in epoca persiana come città fenicia. Erodoto racconta come predoni sciti saccheggiarono il suo tempio di Afrodite Urania, che egli chiama il più antico tempio di quella dea."
    - "Sotto i re ellenistici e Roma Ascalona fu una prospera città greca, indipendente dagli Asmonei e da Erode, benché Erode vi costruisse bagni, costose fontane e colonnati. Quando nel 66 d.C. scoppiò la rivolta giudaica, ribelli giudei attaccarono Ascalona, e poco dopo due loro assalti alla città fortificata fallirono. Nel IV secolo Ascalona aveva un vescovo, e rimase un porto attivo fino all’epoca bizantina."
  pl:
    - "Aszkelon leżał na wybrzeżu Morza Śródziemnego na północ od Gazy; jego tell, Tel Aszkelon, jest dziś parkiem narodowym w obrębie współczesnego miasta. Miasto wymieniają egipskie teksty egzekracyjne z XIX i XVIII wieku p.n.e. W średniej epoce brązu wokół niego wzniesiono wielkie wały ziemne, a brama z cegły mułowej ze sklepionym przejściem, zbudowana w pierwszej połowie II tysiąclecia p.n.e., należy do najstarszych znanych łuków. W XIV wieku p.n.e. jego władca Yidya pisał do faraona w listach z Amarna, a około 1208 r. p.n.e. stela Merenptaha wymienia Aszkelon wśród miejsc, które podporządkował w Kanaanie."
    - "W XII wieku p.n.e., około 1170 r. p.n.e. według datowania wykopujących, osiedlili się tu Filistyni, a Aszkelon stał się jednym z ich pięciu miast. Samson zszedł do Aszkelonu i zabił trzydziestu jego mężów, a lament Dawida po Saulu mówi: „nie rozgłaszajcie po ulicach w Aszkalonie”. W 701 r. p.n.e. Sennacheryb z Asyrii deportował jego króla Sidkę z rodziną i zajął Jafę i inne należące do niego miasta. Amos, Sofoniasz i Jeremiasz zapowiadali zagładę Aszkelonu."
    - "W miesiącu kislew 604 r. p.n.e. Nabuchodonozor zdobył miasto, uprowadził jego króla i złupił je; Kronika babilońska mówi, że obrócił je w kopiec i stosy ruin, a wykopujący znaleźli spaloną warstwę zniszczenia. Aszkelon odbudowano w okresie perskim jako miasto fenickie. Herodot opowiada, jak scytyjscy najeźdźcy złupili jego świątynię Afrodyty Niebiańskiej, którą nazywa najstarszą świątynią tej bogini."
    - "Pod królami hellenistycznymi i Rzymem Aszkelon był zamożnym miastem greckim, niezależnym od Hasmoneuszy i od Heroda, choć Herod zbudował tam łaźnie, kosztowne fontanny i kolumnady. Gdy w 66 r. n.e. wybuchło powstanie żydowskie, żydowscy powstańcy napadli na Aszkelon, a wkrótce potem dwa ich szturmy na obwarowane miasto się nie powiodły. W IV wieku Aszkelon miał biskupa i pozostał ruchliwym portem do czasów bizantyjskich."
  nl:
    - "Askelon lag aan de Middellandse-Zeekust ten noorden van Gaza; zijn heuvel, Tel Askelon, is nu een nationaal park binnen de moderne stad. De stad wordt genoemd in Egyptische vervloekingsteksten van de negentiende en achttiende eeuw v.Chr. In de middenbronstijd werden grote aarden wallen rond haar opgeworpen, en een lemen poort met overwelfde doorgang, gebouwd in de eerste helft van het tweede millennium v.Chr., behoort tot de oudste bekende bogen. In de veertiende eeuw v.Chr. schreef haar heerser Yidya in de Amarnabrieven aan de farao, en omstreeks 1208 v.Chr. noemt Merneptahs stèle Askelon onder de plaatsen die hij in Kanaän onderwierp."
    - "In de twaalfde eeuw v.Chr., omstreeks 1170 v.Chr. volgens de datering van de opgravers, vestigden de Filistijnen zich hier, en Askelon werd een van hun vijf steden. Simson ging af naar Askelon en doodde dertig van zijn mannen, en Davids klaagzang over Saul zegt: “boodschapt het niet op de straten van Askelon”. In 701 v.Chr. voerde Sanherib van Assyrië zijn koning Sidqa met zijn familie weg en nam Joppe en andere steden die tot hem behoorden. Amos, Zefanja en Jeremia voorspelden Askelons ondergang."
    - "In de maand Kislev van 604 v.Chr. veroverde Nebukadnessar de stad, voerde haar koning weg en plunderde haar; de Babylonische kroniek zegt dat hij haar tot een heuvel en puinhopen maakte, en de opgravers vonden de verbrande vernietigingslaag. Askelon werd in de Perzische tijd herbouwd als Fenicische stad. Herodotus vertelt hoe Scythische rovers haar tempel van de Hemelse Aphrodite plunderden, die hij de oudste tempel van die godin noemt."
    - "Onder de hellenistische koningen en Rome was Askelon een welvarende Griekse stad, onafhankelijk van de Hasmoneeën en van Herodes, al liet Herodes er baden, kostbare fonteinen en zuilengalerijen bouwen. Toen de Joodse opstand in 66 n.Chr. uitbrak, vielen Joodse rebellen Askelon aan, en kort daarna mislukten twee van hun aanvallen op de ommuurde stad. In de vierde eeuw had Askelon een bisschop, en het bleef tot in Byzantijnse tijd een drukke haven."
  cs:
    - "Aškelon ležel na středomořském pobřeží severně od Gazy; jeho pahorek, Tel Aškelon, je nyní národním parkem uvnitř moderního města. Město je jmenováno v egyptských proklínacích textech z 19. a 18. století př. n. l. Ve střední době bronzové byly kolem něj vztyčeny velké hliněné valy a brána z nepálených cihel s klenutým průchodem, postavená v první polovině 2. tisíciletí př. n. l., patří k nejstarším známým obloukům. Ve 14. století př. n. l. psal jeho vládce Yidya faraonovi v Amarnských listech a kolem roku 1208 př. n. l. Merneptahova stéla jmenuje Aškelon mezi místy, která v Kanaánu podrobil."
    - "Ve 12. století př. n. l., podle datování vykopávačů kolem roku 1170 př. n. l., se zde usadili Pelištejci a Aškelon se stal jedním z jejich pěti měst. Samson sešel do Aškelonu a pobil z jeho mužů třicet a Davidův nářek nad Saulem praví: „Neoznamujtež v Gát, ani toho ohlašujte na ulicích Aškalon“. V roce 701 př. n. l. Senacherib Asyrský deportoval jeho krále Sidqu s rodinou a dobyl Joppe a další města, která mu patřila. Amos, Sofonjáš a Jeremjáš předpověděli zkázu Aškelonu."
    - "V měsíci kislevu roku 604 př. n. l. Nebukadnesar město dobyl, odvlekl jeho krále a vyplenil je; babylonská kronika praví, že z něj učinil pahorek a hromady zřícenin, a vykopávači našli vrstvu vypálení. Aškelon byl v perském období přestavěn jako fénické město. Hérodotos vypráví, jak skythští nájezdníci vyplenili jeho chrám nebeské Afrodíty, který nazývá nejstarším chrámem té bohyně."
    - "Za helénistických králů a Říma byl Aškelon prosperujícím řeckým městem, nezávislým na Hasmoneovcích i na Herodovi, ač tam Herodes postavil lázně, nákladné fontány a sloupořadí. Když roku 66 n. l. vypuklo židovské povstání, židovští povstalci napadli Aškelon a brzy poté se dva jejich útoky na opevněné město nezdařily. Ve 4. století měl Aškelon biskupa a zůstal rušným přístavem do byzantské doby."
  sv:
    - "Ashkelon låg vid Medelhavets strand norr om Gaza; dess kulle, Tel Ashkelon, är nu en nationalpark inne i den moderna staden. Staden nämns i egyptiska förbannelsetexter från 1800- och 1700-talen f.Kr. Under mellersta bronsåldern restes stora jordvallar kring den, och en lertegelport med välvd gång, byggd under första hälften av andra årtusendet f.Kr., är bland de äldsta kända valven. På 1300-talet f.Kr. skrev dess härskare Yidya till farao i Amarnabreven, och omkring 1208 f.Kr. nämner Merenptahs stele Ashkelon bland de platser han underkuvade i Kanaan."
    - "På 1100-talet f.Kr., omkring 1170 f.Kr. enligt utgrävarnas datering, bosatte sig filistéerna här, och Ashkelon blev en av deras fem städer. Simson gick ned till Ashkelon och dräpte trettio av dess män, och Davids klagan över Saul säger: ”bebåden det ej på Askelons gator”. År 701 f.Kr. förde Sanherib av Assyrien bort dess kung Sidqa med hans familj och intog Joppe och andra städer som tillhörde honom. Amos, Sefanja och Jeremia förutsade Ashkelons undergång."
    - "I månaden Kislev 604 f.Kr. intog Nebukadnessar staden, förde bort dess kung och plundrade den; den babyloniska krönikan säger att han gjorde den till en kulle och ruinhögar, och utgrävare fann det brända förstörelseskiktet. Ashkelon byggdes upp igen under persisk tid som en fenicisk stad. Herodotos berättar hur skytiska plundrare skövlade dess tempel för den himmelska Afrodite, som han kallar den äldsta helgedomen för den gudinnan."
    - "Under de hellenistiska kungarna och Rom var Ashkelon en välmående grekisk stad, oberoende av hasmoneerna och av Herodes, fastän Herodes lät bygga bad, dyrbara fontäner och pelargångar där. När det judiska upproret bröt ut år 66 e.Kr. angrep judiska rebeller Ashkelon, och strax därefter misslyckades två av deras anfall mot den muromgärdade staden. På 300-talet hade Ashkelon en biskop, och den förblev en livlig hamn in i bysantinsk tid."
  nb:
    - "Asjkelon lå ved Middelhavskysten nord for Gasa; tellen, Tel Ashkelon, er nå en nasjonalpark innenfor den moderne byen. Byen er nevnt i egyptiske forbannelsestekster fra 1800- og 1700-tallet f.Kr. I mellombronsealder ble store jordvoller reist rundt den, og en leirsteinsport med hvelvet gang, bygd i første halvdel av det andre årtusen f.Kr., er blant de eldste kjente buene. På 1300-tallet f.Kr. skrev herskeren Yidya til farao i Amarna-brevene, og omkring 1208 f.Kr. nevner Merneptahs stele Asjkelon blant stedene han underla seg i Kanaan."
    - "På 1100-tallet f.Kr., omkring 1170 f.Kr. etter utgravernes datering, bosatte filisterne seg her, og Asjkelon ble en av deres fem byer. Samson gikk ned til Asjkelon og slo ihjel tretti av mennene der, og Davids klagesang over Saul sier: «meld det ikke på gatene i Askalon». I 701 f.Kr. førte Sankerib av Assyria bort kongen Sidqa med familien og tok Jaffa og andre byer som hørte ham til. Amos, Sefanja og Jeremia forutsa Asjkelons undergang."
    - "I måneden kislev 604 f.Kr. inntok Nebukadnesar byen, førte bort kongen og plyndret den; den babylonske krøniken sier at han gjorde den til en haug og ruinhauger, og utgraverne fant det brente ødeleggelseslaget. Asjkelon ble gjenreist i persisk tid som en fønikisk by. Herodot forteller hvordan skytiske plyndrere herjet dens tempel for den himmelske Afrodite, som han kaller den eldste helligdommen for denne gudinnen."
    - "Under de hellenistiske kongene og Roma var Asjkelon en velstående gresk by, uavhengig av hasmoneerne og av Herodes, selv om Herodes bygde bad, kostbare fontener og søylehaller der. Da det jødiske opprøret brøt ut i 66 e.Kr., angrep jødiske opprørere Asjkelon, og kort etter mislyktes to av angrepene deres på den befestede byen. På 300-tallet hadde Asjkelon en biskop, og den forble en travel havn inn i bysantinsk tid."
  tl:
    - "Ang Ascalon ay nasa baybayin ng Mediteraneo sa hilaga ng Gaza; ang burol nitong Tel Ashkelon ay liwasang pambansa na ngayon sa loob ng makabagong lungsod. Pinangalanan ang bayan sa mga tekstong sumpa ng Egipto noong ika-19 at ika-18 siglo BK. Noong Gitnang Panahon ng Tanso, itinayo ang malalaking tambak-lupang pananggalang sa palibot nito, at ang isang pintuang laryo-putik na may daanang may bobeda, na itinayo sa unang kalahati ng ikalawang milenyo BK, ay kabilang sa pinakamatandang arko na kilala. Noong ika-14 na siglo BK, sumulat ang pinuno nitong si Yidya sa Faraon sa mga liham ng Amarna, at mga 1208 BK pinangalanan ng estela ni Merneptah ang Ascalon sa mga lugar na kaniyang nasakop sa Canaan."
    - "Noong ika-12 siglo BK, mga 1170 BK ayon sa pagpetsa ng mga naghukay, nanirahan dito ang mga Filisteo, at naging isa ang Ascalon sa kanilang limang lungsod. Lumusong si Samson sa Ascalon at pumatay ng tatlumpu sa mga lalaki nito, at sinasabi ng panaghoy ni David para kay Saul: “Huwag ninyong ihayag sa mga lansangan ng Ascalon”. Noong 701 BK, ipinatapon ni Sennacherib ng Asiria ang hari nitong si Sidqa kasama ng kaniyang pamilya at sinakop ang Joppa at iba pang bayang pag-aari nito. Inihula nina Amos, Zefanias at Jeremias ang pagkawasak ng Ascalon."
    - "Sa buwan ng Kislev 604 BK, sinakop ni Nabucodonosor ang lungsod, dinala ang hari nito at ninakawan ito; sinasabi ng Kronikang Babilonyo na ginawa niya itong burol at bunton ng mga guho, at natagpuan ng mga naghukay ang nasunog na patong ng pagkawasak. Muling itinayo ang Ascalon sa panahong Persiano bilang bayang Fenicio. Isinasalaysay ni Herodoto kung paano ninakawan ng mga mananalakay na Scita ang templo nito ng Afrodita ng Langit, na tinatawag niyang pinakamatandang templo ng diyosang iyon."
    - "Sa ilalim ng mga haring Helenistiko at Roma, ang Ascalon ay maunlad na lungsod na Griyego, malaya sa mga Hasmoneo at kay Herodes, bagaman nagtayo roon si Herodes ng mga paliguan, mamahaling bukal at kolonada. Nang sumiklab ang paghihimagsik ng mga Judio noong 66 AD, sinalakay ng mga rebeldeng Judio ang Ascalon, at di-nagtagal pagkatapos ay nabigo ang dalawa nilang pag-atake sa lungsod na may pader. Pagsapit ng ika-4 na siglo ay may obispo na ang Ascalon, at nanatili itong abalang daungan hanggang sa panahong Bisantino."
  da:
    - "Askalon lå ved Middelhavskysten nord for Gaza; dens tell, Tel Ashkelon, er nu en nationalpark inden for den moderne by. Byen nævnes i egyptiske forbandelsestekster fra 1800- og 1700-tallet f.Kr. I mellembronzealderen blev store jordvolde rejst omkring den, og en lerstensport med hvælvet passage, bygget i første halvdel af andet årtusinde f.Kr., er blandt de ældste kendte buer. I 1300-tallet f.Kr. skrev dens hersker Yidya til Farao i Amarna-brevene, og omkring 1208 f.Kr. nævner Merneptahs stele Askalon blandt de steder, han underlagde sig i Kana'an."
    - "I 1100-tallet f.Kr., omkring 1170 f.Kr. efter udgravernes datering, bosatte filisterne sig her, og Askalon blev en af deres fem byer. Samson gik ned til Askalon og dræbte tredive af dens mænd, og Davids klagesang over Saul siger: »bebuder det ikke paa Gaderne i Askalon«. I 701 f.Kr. bortførte Sankerib af Assyrien dens konge Sidqa med hans familie og tog Joppe og andre byer, der hørte ham til. Amos, Sefanja og Jeremias forudsagde Askalons undergang."
    - "I måneden kislev 604 f.Kr. indtog Nebukadnezar byen, bortførte dens konge og plyndrede den; Den babylonske krønike siger, at han gjorde den til en tell og ruinhobe, og udgraverne fandt det brændte ødelæggelseslag. Askalon blev genopbygget i den persiske periode som en fønikisk by. Herodot fortæller, hvordan skytiske plyndrere hærgede dens tempel for Afrodite Urania, som han kalder den ældste helligdom for denne gudinde."
    - "Under de hellenistiske konger og Rom var Askalon en velstående græsk by, uafhængig af hasmonæerne og af Herodes, skønt Herodes byggede bade, kostbare springvand og søjlegange dér. Da det jødiske oprør brød ud i 66 e.Kr., angreb jødiske oprørere Askalon, og kort efter slog to af deres stormløb mod den befæstede by fejl. I 300-tallet havde Askalon en biskop, og den forblev en travl havn ind i byzantinsk tid."
  sr:
    - "Ашкелон је лежао на средоземној обали северно од Газе; његова хумка, Тел Ашкелон, сада је национални парк унутар савременог града. Град се именује у египатским текстовима проклињања из 19. и 18. века п. н. е. У средњем бронзаном добу око њега су подигнути велики земљани бедеми, а врата од сирове опеке са засведеним пролазом, саграђена у првој половини другог миленијума п. н. е., међу најстаријим су познатим луковима. У 14. веку п. н. е. његов владар Јидија писао је фараону у писмима из Амарне, а око 1208. п. н. е. Мернептахова стела именује Ашкелон међу местима која је покорио у Ханану."
    - "У 12. веку п. н. е., око 1170. по датовању ископавача, Филистеји су се овде населили и Ашкелон је постао један од њихових пет градова. Самсон је сишао у Ашкелон и убио тридесет његових људи, а Давидово нарицање за Саулом каже: „не разглашујте по улицама аскалонским“. Године 701. п. н. е. Сенахирим Асирски одвео је његовог краља Сидку с породицом и узео Јопу и друге градове који су му припадали. Амос, Софонија и Јеремија прорекли су пропаст Ашкелона."
    - "У месецу кислеву 604. п. н. е. Навуходоносор је заузео град, одвео његовог краља и опљачкао га; Вавилонска хроника каже да га је претворио у хумку и гомиле рушевина, а ископавачи су нашли спаљени слој разарања. Ашкелон је обновљен у персијском периоду као фенички град. Херодот приповеда како су скитски пљачкаши опљачкали његов храм Афродите Уране, који назива најстаријим храмом те богиње."
    - "Под хеленистичким краљевима и Римом Ашкелон је био богат грчки град, независан од Хасмонејаца и од Ирода, мада је Ирод ту саградио купатила, скупе чесме и колонаде. Када је 66. н. е. избио јеврејски устанак, јеврејски побуњеници напали су Ашкелон, а убрзо потом два њихова напада на град са зидинама пропала су. До 4. века Ашкелон је имао епископа и остао је жива лука све у византијско доба."
  hu:
    - "Askelón a Földközi-tenger partján feküdt Gázától északra; halma, a Tel Ashkelon ma nemzeti park a modern városon belül. A várost a Kr. e. 19. és 18. századi egyiptomi átokszövegek említik. A középső bronzkorban hatalmas földsáncokat emeltek köré, és a Kr. e. 2. évezred első felében épült, boltíves átjárójú vályogtégla kapuja a legrégebbi ismert boltívek közé tartozik. A Kr. e. 14. században uralkodója, Jidja levelet írt a fáraónak az amarnai levelekben, és Kr. e. 1208 körül Merneptah sztéléje Askelónt azon helyek között nevezi meg, amelyeket Kánaánban leigázott."
    - "A Kr. e. 12. században, az ásatók keltezése szerint Kr. e. 1170 körül, a filiszteusok telepedtek meg itt, és Askelón az öt városuk egyike lett. Sámson lement Askelónba, és megölt harminc férfit, Dávid siralma Saul felett pedig így szól: „ne hirdessétek Askelon utczáin”. Kr. e. 701-ben Szanhérib asszír király száműzte királyát, Szidkát családjával együtt, és elfoglalta Joppét és más hozzá tartozó városokat. Ámós, Sofóniás és Jeremiás megjövendölték Askelón pusztulását."
    - "Kr. e. 604 kiszlév hónapjában Nabukodonozor elfoglalta a várost, elvitte királyát és kifosztotta; a babiloni krónika szerint halommá és romhalmazokká változtatta, az ásatók pedig megtalálták az égési pusztulási réteget. Askelónt a perzsa korban föníciai városként építették újjá. Hérodotosz elmeséli, hogyan fosztották ki a szkíta portyázók a Mennyei Aphrodité templomát, amelyet e istennő legrégebbi templomának nevez."
    - "A hellenisztikus királyok és Róma alatt Askelón virágzó görög város volt, független a hasmoneusoktól és Heródestől, bár Heródes fürdőket, drága szökőkutakat és oszlopcsarnokokat építtetett ott. Amikor Kr. u. 66-ban kitört a zsidó felkelés, zsidó lázadók megtámadták Askelónt, és nem sokkal később a fallal körülvett város elleni két rohamuk kudarcot vallott. A 4. századra Askelónnak püspöke volt, és a bizánci korban is forgalmas kikötő maradt."
  fi:
    - "Askelon sijaitsi Välimeren rannalla Gazasta pohjoiseen; sen kumpu, Tel Ashkelon, on nykyisin kansallispuisto nykyisen kaupungin sisällä. Kaupunki mainitaan egyptiläisissä kirouskirjoituksissa 1800- ja 1700-luvulta eaa. Keskipronssikaudella sen ympärille nostettiin suuret multavallit, ja kaareutuvalla läpikäytävällä varustettu savitiiliportti, rakennettu toisen vuosituhannen eaa. alkupuoliskolla, on vanhimpia tunnettuja kaaria. 1300-luvulla eaa. sen hallitsija Yidya kirjoitti faraolle Amarna-kirjeissä, ja noin 1208 eaa. Merneptahin stele nimeää Askelonin Kanaanissa kukistettujen paikkojen joukossa."
    - "1100-luvulla eaa., kaivajien ajoituksen mukaan noin 1170 eaa., filistealaiset asettuivat tänne, ja Askelonista tuli yksi heidän viidestä kaupungistaan. Simson meni alas Askeloniin ja tappoi kolmekymmentä sen miestä, ja Daavidin valitus Saulille sanoo: ”älkää julistako voitonsanomaa Askelonin kaduilla”. Vuonna 701 eaa. Assyrian Sanherib karkotti sen kuninkaan Sidqan perheineen ja valtasi Joppen ja muita hänelle kuuluneita kaupunkeja. Aamos, Sefanja ja Jeremia ennustivat Askelonin tuhoa."
    - "Kislev-kuussa 604 eaa. Nebukadnessar valloitti kaupungin, vei sen kuninkaan mukanaan ja ryösti sen; Babylonialainen kronikka sanoo hänen tehneen siitä kummun ja raunioläjiä, ja kaivajat löysivät palaneen tuhokerroksen. Askelon rakennettiin uudelleen persialaisella kaudella foinikialaisena kaupunkina. Herodotos kertoo, kuinka skyyttiryöstäjät ryöstivät sen Taivaallisen Afroditen temppelin, jota hän kutsuu tuon jumalattaren vanhimmaksi temppeliksi."
    - "Hellenististen kuninkaiden ja Rooman aikana Askelon oli vauras kreikkalainen kaupunki, riippumaton hasmonealaisista ja Herodeksesta, vaikka Herodes rakennutti sinne kylpylöitä, kalliita suihkulähteitä ja pylväskäytäviä. Kun juutalaiskapina puhkesi vuonna 66 jaa., juutalaiset kapinalliset hyökkäsivät Askeloniin, ja pian sen jälkeen kaksi heidän hyökkäystään muurein ympäröityä kaupunkia vastaan epäonnistui. 300-luvulle mennessä Askelonilla oli piispa, ja se pysyi vilkkaana satamana bysanttilaiselle ajalle asti."
  vi:
    - "Ách-ca-lôn nằm trên bờ Địa Trung Hải phía bắc Ga-xa; gò của nó, Tel Ashkelon, nay là công viên quốc gia trong thành phố hiện đại. Thành được nêu trong các văn bản nguyền rủa của Ai Cập thế kỷ 19 và 18 TCN. Vào thời Đồ Đồng Giữa, những thành lũy đất lớn được dựng quanh nó, và một cổng gạch bùn với lối đi có vòm, xây trong nửa đầu thiên niên kỷ thứ hai TCN, là một trong những vòm cuốn cổ nhất được biết. Vào thế kỷ 14 TCN, người cai trị nó là Yidya viết thư cho Pha-ra-ôn trong các thư Amarna, và khoảng năm 1208 TCN bia của Merneptah nêu Ách-ca-lôn trong số những nơi ông khuất phục ở Ca-na-an."
    - "Vào thế kỷ 12 TCN, khoảng năm 1170 TCN theo niên đại của các nhà khai quật, người Phi-li-tin định cư ở đây, và Ách-ca-lôn trở thành một trong năm thành của họ. Sam-sôn đi xuống Ách-ca-lôn và giết ba mươi người của nó, và bài ca than khóc của Đa-vít về Sau-lơ nói: “Chớ rao truyền sự ấy trong các đường phố Ách-ca-lôn”. Năm 701 TCN, San-chê-ríp của A-si-ri đày vua của nó là Sidqa cùng gia đình và chiếm Giốp-bê và các thành khác thuộc về ông. A-mốt, Sô-phô-ni và Giê-rê-mi báo trước sự tàn phá của Ách-ca-lôn."
    - "Vào tháng Kislev năm 604 TCN, Nê-bu-cát-nết-sa chiếm thành, bắt vua của nó đi và cướp phá nó; Niên sử Ba-by-lôn nói ông biến nó thành gò và đống đổ nát, và các nhà khai quật tìm thấy lớp phá hủy cháy. Ách-ca-lôn được xây lại vào thời Ba Tư như một thị trấn Phê-ni-xi. Herodotus kể những kẻ cướp Scythia đã cướp phá đền thờ Aphrodite Thiên Thượng của nó, mà ông gọi là đền cổ nhất của nữ thần ấy."
    - "Dưới các vua Hy Lạp hóa và dưới La Mã, Ách-ca-lôn là một thành Hy Lạp thịnh vượng, độc lập với nhà Hasmonaea và với Hê-rốt, dù Hê-rốt xây ở đó các nhà tắm, đài phun nước đắt giá và hàng cột. Khi cuộc nổi dậy của người Do Thái nổ ra năm 66, quân nổi dậy Do Thái tấn công Ách-ca-lôn, và ngay sau đó hai cuộc tấn công của họ vào thành có tường bao thất bại. Đến thế kỷ 4, Ách-ca-lôn có giám mục, và nó vẫn là một hải cảng nhộn nhịp đến thời Byzantine."
  ro:
    - "Ascalonul se afla pe țărmul Mediteranei, la nord de Gaza; tellul lui, Tel Ashkelon, este acum un parc național în interiorul orașului modern. Cetatea este numită în textele egiptene de execrare din secolele al XIX-lea și al XVIII-lea î.Hr. În epoca bronzului mijlociu au fost ridicate în jurul ei mari valuri de pământ, iar o poartă de cărămidă de lut cu un pasaj boltit, construită în prima jumătate a mileniului al II-lea î.Hr., se numără printre cele mai vechi arce cunoscute. În secolul al XIV-lea î.Hr., conducătorul ei Yidya i-a scris faraonului în scrisorile de la Amarna, iar în jurul anului 1208 î.Hr. stela lui Merneptah numește Ascalonul printre locurile pe care le-a supus în Canaan."
    - "În secolul al XII-lea î.Hr., în jurul anului 1170 î.Hr. după datarea arheologilor, filistenii s-au așezat aici, iar Ascalonul a devenit una dintre cele cinci cetăți ale lor. Samson a coborât la Ascalon și a ucis treizeci dintre bărbații lui, iar plângerea lui David pentru Saul spune: „să nu vestiți la ieșirile Ascalonului”. În 701 î.Hr., Senaherib al Asiriei l-a deportat pe regele lui, Sidqa, cu familia, și a luat Iafo și alte cetăți care îi aparțineau. Amos, Țefania și Ieremia au prevestit ruinarea Ascalonului."
    - "În luna Kislev din 604 î.Hr., Nebucadnețar a cucerit cetatea, i-a luat regele și a jefuit-o; Cronica babiloniană spune că a făcut din ea o movilă și grămezi de ruine, iar arheologii au găsit stratul de distrugere prin incendiu. Ascalonul a fost reconstruit în perioada persană ca oraș fenician. Herodot povestește cum cetele scite au jefuit templul Afroditei Cerești, pe care îl numește cel mai vechi templu al acestei zeițe."
    - "Sub regii eleniști și sub Roma, Ascalonul a fost un oraș grec prosper, independent față de hasmoneeni și de Irod, deși Irod a construit acolo băi, fântâni costisitoare și colonade. Când a izbucnit revolta iudaică din 66 d.Hr., rebelii iudei au atacat Ascalonul, iar curând după aceea două dintre asalturile lor asupra cetății înconjurate de ziduri au eșuat. În secolul al IV-lea Ascalonul avea un episcop și a rămas un port aglomerat până în vremea bizantină."
  bg:
    - "Аскалон лежал на средиземноморския бряг северно от Газа; могилата му, Тел Аскалон, е днес национален парк в рамките на съвременния град. Градът е назован в египетски текстове на проклятията от XIX и XVIII в. пр.н.е. През средната бронзова епоха около него били издигнати големи земни валове, а кирпичена порта със сводест проход, построена през първата половина на II хилядолетие пр.н.е., е сред най-старите известни арки. През XIV в. пр.н.е. неговият владетел Идия писал до фараона в Амарнските писма, а около 1208 г. пр.н.е. стелата на Мернептах назовава Аскалон сред местата, които покорил в Ханаан."
    - "През XII в. пр.н.е., около 1170 г. пр.н.е. по датировката на разкопвачите, тук се заселили филистимците и Аскалон станал един от петте им града. Самсон слязъл в Аскалон и убил тридесет от мъжете му, а оплакването на Давид за Саул казва: „Не проповядвайте по улиците на Аскалон“. През 701 г. пр.н.е. Сенахирим Асирийски изселил царя му Сидка със семейството му и превзел Яфа и други градове, които му принадлежали. Амос, Софония и Йеремия предсказали разрухата на Аскалон."
    - "През месец Кислев 604 г. пр.н.е. Навуходоносор превзел града, отвел царя му и го разграбил; Вавилонската хроника казва, че го превърнал в могила и купчини развалини, а разкопвачите намерили изгорелия слой на разрушението. Аскалон бил възстановен през персийския период като финикийски град. Херодот разказва как скитски нападатели разграбили храма му на Небесната Афродита, който нарича най-стария храм на тази богиня."
    - "При елинистическите царе и Рим Аскалон бил проспериращ гръцки град, независим от хасмонеите и от Ирод, макар Ирод да построил там бани, скъпи фонтани и колонади. Когато еврейското въстание избухнало през 66 г. н.е., еврейски бунтовници нападнали Аскалон и скоро след това два от щурмовете им срещу оградения град пропаднали. До IV в. Аскалон имал епископ и останал оживено пристанище до византийско време."
