body:
  en:
    - "“The city of Nahor” is where Abraham's servant went to find a wife for Isaac: “he arose, and went to Mesopotamia, unto the city of Nahor.” By its well he met Rebekah, granddaughter of Nahor, Abraham's brother. It cannot be decided whether this was a town named Nahor or simply the town where Nahor's family lived. Those who take the second view identify it with Haran, since Laban, Rebekah's brother, lives at Haran when Jacob later flees to him."
    - "There was also a real town of the name in the same region. The letters from Mari of the eighteenth century BC often mention Nahur, and Assyrian texts know it as Nahuru or Til-Nahiri, “mound of Nahur”; its site has not been found. The Encyclopaedia Judaica places it in the Balikh valley near Haran, while Michaël Guichard, who is editing the hundred or so letters from Nahur found at Mari, treats it as a town of the upper Habur. The map sets the city of Nahor at Haran itself, in today's south-eastern Turkey."
    - "Christian pilgrims looked for these scenes at Haran. In the 380s the pilgrim Egeria was shown there the well from which, the bishop said, Rebekah had watered the camels of Abraham's servant. The townspeople, still pagan, honoured a place about a mile from the city where the memorials of Nahor and Bethuel stood. Six miles from the city, a large church stood beside the well where Jacob was said to have watered Rachel's flocks, and about five hundred paces from it lay a village called Fadana, once, the bishop said, the farm of Laban, where Laban's memorial was shown."
  ru:
    - "«Город Нахора» — то место, куда раб Авраама пошёл искать жену Исааку: «Он встал и пошел в Месопотамию, в город Нахора». У его колодца он встретил Ревекку, внучку Нахора, брата Авраама. Нельзя решить, был ли это город по имени Нахор или просто город, где жила семья Нахора. Сторонники второго взгляда отождествляют его с Харраном, потому что Лаван, брат Ревекки, живёт в Харране, когда к нему позднее бежит Иаков."
    - "В той же области был и настоящий город с этим именем. Письма из Мари XVIII в. до н. э. часто упоминают Нахур, а ассирийские тексты знают его как Нахуру или Тиль-Нахири, «холм Нахура»; его место не найдено. Encyclopaedia Judaica помещает его в долине Балиха близ Харрана, а Мишель Гишар, издающий около сотни писем из Нахура, найденных в Мари, считает его городом верхнего Хабура. Карта ставит город Нахора в самом Харране, на нынешнем юго-востоке Турции."
    - "Христианские паломники искали эти события в Харране. В 380-х годах паломнице Эгерии показали там колодец, из которого, по словам епископа, Ревекка поила верблюдов раба Авраамова. Жители города, всё ещё язычники, почитали место примерно в миле от города, где стояли памятники Нахора и Вафуила. В шести милях от города у колодца, где, как говорили, Иаков поил стада Рахили, стояла большая церковь, а примерно в пятистах шагах от неё лежало селение Фадана, некогда, по словам епископа, усадьба Лавана; там показывали памятник Лавана."
  uk:
    - "Місто Нахора — це те місце, куди слуга Авраама вирушив шукати дружину Ісаакові: «та знявсь і пійшов у Месопотамію, у Нахорів город». Біля його колодязя він зустрів Ревеку, онуку Нахора, брата Авраама. Вирішити, чи це було місто на ім'я Нахор, чи просто місто, де жила родина Нахора, неможливо. Ті, хто приймає друге, ототожнюють його з Хараном, бо Лаван, брат Ревеки, мешкає в Харані, коли пізніше до нього тікає Яків."
    - "У тому самому краї було й справжнє місто з такою назвою. Листи з Марі XVIII ст. до н. е. часто згадують Нахур, а ассирійські тексти знають його як Нахуру або Тіль-Нахірі, «пагорб Нахура»; його місце не знайдено. Encyclopaedia Judaica розміщує його в долині Балиху поблизу Харана, тоді як Мікаель Гішар, який видає близько сотні листів із Нахура, знайдених у Марі, вважає його містом верхнього Хабуру. Мапа ставить місто Нахора в самому Харані, у нинішній південно-східній Туреччині."
    - "Християнські паломники шукали ці події в Харані. У 380-х роках паломниці Егерії показали там колодязь, з якого, за словами єпископа, Ревека напувала верблюдів слуги Авраама. Мешканці міста, ще язичники, шанували місце приблизно за милю від міста, де стояли пам'ятники Нахора й Бетуїла. За шість миль від міста біля колодязя, де, як казали, Яків напував отари Рахілі, стояла велика церква, а приблизно за п'ятсот кроків від неї лежало село Фадана, колись, за словами єпископа, садиба Лавана; там показували пам'ятник Лавана."
  es:
    - "La ciudad de Nacor es adonde fue el siervo de Abraham a buscar esposa para Isaac: «puesto en camino, llegó á Mesopotamia, á la ciudad de Nachôr». Junto a su pozo conoció a Rebeca, nieta de Nacor, hermano de Abraham. No puede decidirse si era una ciudad llamada Nacor o simplemente la ciudad donde vivía la familia de Nacor. Quienes adoptan la segunda opinión la identifican con Harán, pues Labán, hermano de Rebeca, vive en Harán cuando Jacob huye más tarde hacia él."
    - "Había también una ciudad real con ese nombre en la misma región. Las cartas de Mari del siglo XVIII a. C. mencionan a menudo Nahur, y los textos asirios la conocen como Nahuru o Til-Nahiri, «montículo de Nahur»; su emplazamiento no se ha hallado. La Encyclopaedia Judaica la sitúa en el valle del Balij, cerca de Harán, mientras que Michaël Guichard, que edita el centenar de cartas de Nahur halladas en Mari, la trata como una ciudad del alto Habur. El mapa sitúa la ciudad de Nacor en la propia Harán, en el actual sureste de Turquía."
    - "Los peregrinos cristianos buscaron estas escenas en Harán. En los años 380 la peregrina Egeria vio allí el pozo del que, según el obispo, Rebeca había dado de beber a los camellos del siervo de Abraham. Los habitantes, todavía paganos, veneraban un lugar a una milla de la ciudad aproximadamente, donde estaban los memoriales de Nacor y Bethuel. A seis millas de la ciudad, junto al pozo donde se decía que Jacob había abrevado los rebaños de Raquel, se alzaba una gran iglesia, y a unos quinientos pasos de ella estaba una aldea llamada Fadana, antigua finca de Labán según el obispo, donde se mostraba el memorial de Labán."
  pt:
    - "“A cidade de Naor” é aonde o servo de Abraão foi buscar uma esposa para Isaque: “Ele se levantou e foi para a Mesopotâmia, para a cidade de Naor.” Junto ao poço ele encontrou Rebeca, neta de Naor, irmão de Abraão. Não se pode decidir se era uma cidade chamada Naor ou simplesmente a cidade onde vivia a família de Naor. Os que adotam a segunda opinião a identificam com Harã, pois Labão, irmão de Rebeca, mora em Harã quando Jacó mais tarde foge para ele."
    - "Havia também uma cidade real com esse nome na mesma região. As cartas de Mari do século XVIII a.C. mencionam com frequência Nahur, e os textos assírios a conhecem como Nahuru ou Til-Nahiri, “montículo de Nahur”; seu sítio não foi encontrado. A Encyclopaedia Judaica a situa no vale do Balikh, perto de Harã, enquanto Michaël Guichard, que edita as cerca de cem cartas de Nahur encontradas em Mari, a trata como uma cidade do alto Habur. O mapa coloca a cidade de Naor na própria Harã, no sudeste da atual Turquia."
    - "Os peregrinos cristãos procuraram essas cenas em Harã. Na década de 380 a peregrina Egéria viu ali o poço do qual, segundo o bispo, Rebeca dera de beber aos camelos do servo de Abraão. Os habitantes, ainda pagãos, veneravam um lugar a cerca de uma milha da cidade onde ficavam os memoriais de Naor e Betuel. A seis milhas da cidade, junto ao poço onde Jacó teria dado de beber aos rebanhos de Raquel, erguia-se uma grande igreja, e a cerca de quinhentos passos dela ficava uma aldeia chamada Fadana, outrora, segundo o bispo, a propriedade de Labão, onde se mostrava o memorial de Labão."
  de:
    - "Die Stadt Nahors ist das Ziel von Abrahams Knecht, der für Isaak eine Frau suchte: Er „machte sich auf und zog nach Mesopotamien zu der Stadt Nahors“. An ihrem Brunnen traf er Rebekka, die Enkelin Nahors, des Bruders Abrahams. Es lässt sich nicht entscheiden, ob dies eine Stadt namens Nahor war oder einfach die Stadt, in der Nahors Familie wohnte. Wer die zweite Ansicht vertritt, setzt sie mit Haran gleich, da Laban, Rebekkas Bruder, in Haran lebt, als Jakob später zu ihm flieht."
    - "Es gab in derselben Gegend auch eine wirkliche Stadt dieses Namens. Die Briefe aus Mari aus dem achtzehnten Jahrhundert v. Chr. erwähnen oft Nahur, und assyrische Texte kennen sie als Nahuru oder Til-Nahiri, „Hügel des Nahur“; ihre Lage ist nicht gefunden. Die Encyclopaedia Judaica setzt sie im Balichtal nahe Haran an, während Michaël Guichard, der die etwa hundert in Mari gefundenen Briefe aus Nahur herausgibt, sie als Stadt am oberen Chabur behandelt. Die Karte setzt die Stadt Nahor in Haran selbst, im heutigen Südosten der Türkei."
    - "Christliche Pilger suchten diese Szenen in Haran. In den 380er-Jahren zeigte man der Pilgerin Egeria dort den Brunnen, aus dem nach den Worten des Bischofs Rebekka die Kamele von Abrahams Knecht getränkt hatte. Die Einwohner, noch Heiden, verehrten etwa eine Meile vor der Stadt einen Ort mit den Gedenkstätten Nahors und Bethuels. Sechs Meilen von der Stadt entfernt stand eine große Kirche bei dem Brunnen, an dem Jakob die Herden Rahels getränkt haben soll, und etwa fünfhundert Schritte davon lag ein Dorf namens Fadana, einst, wie der Bischof sagte, das Gut Labans, wo Labans Gedenkstätte gezeigt wurde."
  it:
    - "«La città di Nahor» è dove il servo di Abramo andò a cercare una moglie per Isacco: «e, messosi in viaggio, andò in Mesopotamia, alla città di Nahor». Presso il suo pozzo incontrò Rebecca, nipote di Nacor, fratello di Abramo. Non si può decidere se fosse una città di nome Nacor o semplicemente la città in cui viveva la famiglia di Nacor. Chi sostiene la seconda ipotesi la identifica con Carran, poiché Labano, fratello di Rebecca, vive a Carran quando Giacobbe più tardi fugge da lui."
    - "Esisteva anche una vera città di questo nome nella stessa regione. Le lettere di Mari del XVIII secolo a.C. menzionano spesso Nahur, e i testi assiri la conoscono come Nahuru o Til-Nahiri, «tell di Nahur»; il suo sito non è stato trovato. L’Encyclopaedia Judaica la colloca nella valle del Balikh vicino a Carran, mentre Michaël Guichard, che sta curando l’edizione del centinaio di lettere da Nahur trovate a Mari, la considera una città dell’alto Khabur. La carta pone la città di Nacor a Carran stessa, nell’odierna Turchia sud-orientale."
    - "I pellegrini cristiani cercarono queste scene a Carran. Negli anni 380 alla pellegrina Egeria fu mostrato lì il pozzo da cui, secondo il vescovo, Rebecca aveva abbeverato i cammelli del servo di Abramo. Gli abitanti, ancora pagani, veneravano un luogo a circa un miglio dalla città dove sorgevano le memorie di Nacor e di Betuel. A sei miglia dalla città, presso il pozzo dove si diceva che Giacobbe avesse abbeverato le greggi di Rachele, sorgeva una grande chiesa, e a circa cinquecento passi da essa si trovava un villaggio chiamato Fadana, un tempo, secondo il vescovo, il podere di Labano, dove si mostrava la memoria di Labano."
  fr:
    - "« La ville de Nachor » est celle où le serviteur d’Abraham alla chercher une épouse pour Isaac : « Il se leva, et alla en Mésopotamie, à la ville de Nachor. » À son puits, il rencontra Rebecca, petite-fille de Nachor, frère d’Abraham. On ne peut décider s’il s’agissait d’une ville nommée Nachor ou simplement de la ville où vivait la famille de Nachor. Ceux qui retiennent la seconde vue l’identifient avec Haran (Charan dans Louis Segond), puisque Laban, frère de Rebecca, vit à Haran quand Jacob s’enfuit plus tard chez lui."
    - "Il existait aussi une vraie ville de ce nom dans la même région. Les lettres de Mari du XVIIIe siècle av. J.-C. mentionnent souvent Nahur, et les textes assyriens la connaissent sous le nom de Nahourou ou Til-Nahiri, « butte de Nahur » ; son site n’a pas été trouvé. L’Encyclopaedia Judaica la place dans la vallée du Balikh près de Haran, tandis que Michaël Guichard, qui édite la centaine de lettres de Nahur trouvées à Mari, la traite comme une ville du haut Khabour. La carte place la ville de Nachor à Haran même, dans l’actuel sud-est de la Turquie."
    - "Les pèlerins chrétiens cherchèrent ces scènes à Haran. Dans les années 380, on montra là à la pèlerine Égérie le puits où, selon l’évêque, Rebecca avait abreuvé les chameaux du serviteur d’Abraham. Les habitants, encore païens, vénéraient à environ un mille de la ville un lieu où se trouvaient les mémoriaux de Nachor et de Bethuel. À six milles de la ville, une grande église s’élevait près du puits où Jacob aurait abreuvé les troupeaux de Rachel, et à environ cinq cents pas de là se trouvait un village appelé Fadana, jadis, selon l’évêque, le domaine de Laban, où l’on montrait le mémorial de Laban."
  nl:
    - "“De stad van Nahor” is waar Abrahams knecht heen ging om een vrouw voor Isaak te zoeken: “en hij maakte zich op, en toog heen naar Mesopotamië, naar de stad van Nahor.” Bij haar put ontmoette hij Rebekka, de kleindochter van Nahor, Abrahams broer. Het valt niet uit te maken of dit een stad was die Nahor heette of eenvoudig de stad waar Nahors familie woonde. Wie de tweede opvatting aanhangt, vereenzelvigt haar met Haran, aangezien Laban, Rebekka's broer, in Haran woont wanneer Jakob later naar hem vlucht."
    - "Er was ook een werkelijke stad met die naam in dezelfde streek. De brieven uit Mari uit de achttiende eeuw v.Chr. noemen vaak Nahur, en Assyrische teksten kennen het als Nachuru of Til-Nahiri, ‘heuvel van Nahur’; de ligging is niet gevonden. De Encyclopaedia Judaica plaatst het in de Balikhvallei bij Haran, terwijl Michaël Guichard, die de honderd of zo brieven uit Nahur uitgeeft die te Mari zijn gevonden, het behandelt als een stad van de bovenloop van de Chabur. De kaart zet de stad van Nahor bij Haran zelf, in het huidige zuidoosten van Turkije."
    - "Christelijke pelgrims zochten deze taferelen in Haran. In de jaren 380 werd de pelgrim Egeria daar de put getoond waaruit Rebekka volgens de bisschop de kamelen van Abrahams knecht had gedrenkt. De inwoners, nog heidenen, vereerden ongeveer een mijl buiten de stad een plek waar de gedenktekens van Nahor en Bethuel stonden. Zes mijl van de stad stond een grote kerk bij de put waar Jakob de kudden van Rachel gedrenkt zou hebben, en ongeveer vijfhonderd passen daarvandaan lag een dorp genaamd Fadana, volgens de bisschop eens de hoeve van Laban, waar Labans gedenkteken werd getoond."
  cs:
    - "„Město Nachorovo“ je místo, kam šel Abrahamův služebník najít ženu pro Izáka: „vstav, bral se k Aram Naharaim do města Náchor.“ U jeho studny potkal Rebeku, vnučku Nachora, Abrahamova bratra. Nelze rozhodnout, zda to bylo město jménem Nachor, nebo prostě město, kde žila Nachorova rodina. Kdo zastává druhý názor, ztotožňuje je s Cháranem, neboť Laban, Rebečin bratr, bydlí v Cháranu, když k němu Jákob později prchá."
    - "V téže oblasti bylo také skutečné město toho jména. Listy z Mari z osmnáctého století př. n. l. často zmiňují Nahur a asyrské texty je znají jako Nahuru nebo Til-Nahiri, „pahorek Nahuru“; jeho poloha nebyla nalezena. Encyclopaedia Judaica je klade do údolí Balíhu poblíž Cháranu, zatímco Michaël Guichard, který připravuje vydání asi stovky listů z Nahuru nalezených v Mari, je pokládá za město horního Chaburu. Mapa klade město Nachor do samotného Cháranu, v dnešním jihovýchodním Turecku."
    - "Křesťanští poutníci hledali tyto události v Cháranu. V 80. letech 4. století ukázali poutnici Egerii studnu, z níž podle biskupa Rebeka napájela velbloudy Abrahamova služebníka. Obyvatelé města, ještě pohané, uctívali asi míli od města místo, kde stály památníky Nachora a Bathuele. Šest mil od města stál u studny, kde prý Jákob napájel stáda Ráchel, velký kostel a asi pět set kroků od něj ležela vesnice zvaná Fadana, podle biskupa kdysi Labanův statek, kde ukazovali Labanův památník."
  pl:
    - "„Miasto Nachorowe” to miejsce, dokąd sługa Abrahama udał się po żonę dla Izaaka: „a wstawszy puścił się do Aram Naharaim, do miasta Nachorowego”. Przy jego studni spotkał Rebekę, wnuczkę Nachora, brata Abrahama. Nie można rozstrzygnąć, czy było to miasto zwane Nachor, czy po prostu miasto, w którym mieszkała rodzina Nachora. Ci, którzy przyjmują drugie wyjaśnienie, utożsamiają je z Charanem, ponieważ Laban, brat Rebeki, mieszka w Charanie, gdy Jakub później ucieka do niego."
    - "W tym samym regionie istniało też rzeczywiste miasto o tej nazwie. Listy z Mari z XVIII w. p.n.e. często wspominają Nahur, a teksty asyryjskie znają je jako Nahuru lub Til-Nahiri, „wzgórze Nahur”; jego położenie nie zostało odnalezione. Encyclopaedia Judaica umieszcza je w dolinie Balich koło Charanu, a Michaël Guichard, który opracowuje około stu listów z Nahur znalezionych w Mari, uważa je za miasto górnego Chabur. Mapa umieszcza miasto Nachora w samym Charanie, w dzisiejszej południowo-wschodniej Turcji."
    - "Chrześcijańscy pielgrzymi szukali tych wydarzeń w Charanie. W latach 80. IV wieku pielgrzymce Egerii pokazano tam studnię, z której według biskupa Rebeka poiła wielbłądy sługi Abrahama. Mieszkańcy miasta, wciąż poganie, czcili miejsce około mili od miasta, gdzie stały miejsca pamięci Nachora i Batuela. Sześć mil od miasta, przy studni, przy której Jakub miał poić trzody Racheli, stał wielki kościół, a około pięciuset kroków od niego leżała wieś zwana Fadana, niegdyś, jak mówił biskup, posiadłość Labana, gdzie pokazywano miejsce pamięci Labana."
  sv:
    - "”Nahors stad” är dit Abrahams tjänare for för att skaffa en hustru åt Isak: ”han stod upp och drog åstad till Nahors stad i Aram-Naharaim.” Vid dess brunn mötte han Rebecka, sondotter till Nachor, Abrahams bror. Det går inte att avgöra om detta var en stad som hette Nachor eller helt enkelt staden där Nachors familj bodde. De som anser det senare identifierar den med Harran, eftersom Laban, Rebeckas bror, bor i Harran när Jakob senare flyr till honom."
    - "Det fanns också en verklig stad med namnet i samma region. Breven från Mari från 1700-talet f.Kr. nämner ofta Nahur, och assyriska texter känner den som Nahuru eller Til-Nahiri, ”Nahurs kulle”; dess läge har inte hittats. Encyclopaedia Judaica placerar den i Balikhdalen nära Harran, medan Michaël Guichard, som utger de omkring hundra breven från Nahur som hittats i Mari, behandlar den som en stad i övre Habur. Kartan sätter Nachors stad i Harran självt, i dagens sydöstra Turkiet."
    - "Kristna pilgrimer sökte dessa händelser i Harran. På 380-talet visades pilgrimen Egeria där brunnen ur vilken Rebecka enligt biskopen hade vattnat Abrahams tjänares kameler. Stadens invånare, ännu hedningar, vördade en plats omkring en romersk mil från staden där minnesmärkena över Nachor och Betuel stod. Sex romerska mil från staden stod en stor kyrka vid brunnen där Jakob sades ha vattnat Rakels hjordar, och omkring femhundra steg därifrån låg en by som hette Fadana, enligt biskopen en gång Labans gård, där Labans minnesmärke visades."
  nb:
    - "«Nakors by» er stedet Abrahams tjener dro til for å finne en hustru til Isak: «han tok avsted og drog til Mesopotamia, til Nakors by.» Ved brønnen møtte han Rebekka, sønnedatter av Nahor, Abrahams bror. Det kan ikke avgjøres om dette var en by som het Nahor, eller bare byen der Nahors familie bodde. De som mener det siste, identifiserer den med Harran, siden Laban, Rebekkas bror, bor i Harran da Jakob senere flykter til ham."
    - "Det fantes også en virkelig by med dette navnet i samme område. Brevene fra Mari fra 1700-tallet f.Kr. nevner ofte Nahur, og assyriske tekster kjenner den som Nahuru eller Til-Nahiri, «Nahurs haug»; stedet er ikke funnet. Encyclopaedia Judaica plasserer den i Balikh-dalen nær Harran, mens Michaël Guichard, som utgir de rundt hundre brevene fra Nahur funnet i Mari, behandler den som en by i øvre Habur. Kartet setter Nahors by i selve Harran, i dagens sørøstlige Tyrkia."
    - "Kristne pilegrimer søkte disse hendelsene i Harran. På 380-tallet ble pilegrimen Egeria vist brønnen der Rebekka etter biskopens ord hadde vannet kamelene til Abrahams tjener. Byens innbyggere, ennå hedninger, æret et sted omkring en romersk mil fra byen der minnesmerkene over Nahor og Betuel sto. Seks romerske mil fra byen sto en stor kirke ved brønnen der Jakob skulle ha vannet Rakels flokker, og omkring fem hundre skritt derfra lå en landsby kalt Fadana, ifølge biskopen en gang Labans gård, der Labans minnesmerke ble vist."
  tl:
    - "“Ang bayan ni Nachor” ang pinuntahan ng lingkod ni Abraham upang humanap ng asawa para kay Isaac: “tumindig at napasa Mesopotamia, sa bayan ni Nachor.” Sa tabi ng balon nito ay nakilala niya si Rebeca, apo ni Nachor na kapatid ni Abraham. Hindi mapagpapasyahan kung ito ay isang bayang nagngangalang Nachor o simpleng bayang tinitirhan ng pamilya ni Nachor. Ang mga kumukuha sa ikalawang pananaw ay kumikilala rito sa Haran, yamang si Laban, kapatid ni Rebeca, ay nakatira sa Haran nang tumakas sa kaniya si Jacob nang kalaunan."
    - "Mayroon ding tunay na bayang may gayong pangalan sa iisang rehiyon. Madalas banggitin ng mga sulat mula sa Mari noong ika-18 na siglo BK ang Nahur, at kilala ito ng mga tekstong Asiryo bilang Nahuru o Til-Nahiri, “bunton ng Nahur”; hindi pa natatagpuan ang lugar nito. Inilalagay ito ng Encyclopaedia Judaica sa libis ng Balikh malapit sa Haran, samantalang si Michaël Guichard, na naghahanda ng edisyon ng humigit-kumulang isandaang sulat mula sa Nahur na natagpuan sa Mari, ay itinuturing itong bayan ng itaas na Habur. Inilalagay ng mapa ang bayan ni Nachor sa Haran mismo, sa timog-silangang Turkey ngayon."
    - "Hinanap ng mga Kristiyanong peregrino ang mga pangyayaring ito sa Haran. Noong dekada 380, ipinakita roon sa peregrinang si Egeria ang balon na, ayon sa obispo, pinagpainuman ni Rebeca sa mga kamelyo ng lingkod ni Abraham. Pinipitagan ng mga taga-lungsod, na mga pagano pa, ang isang pook mga isang milya mula sa lungsod na kinatatayuan ng mga alaala nina Nachor at Bethuel. Anim na milya mula sa lungsod, nakatayo ang isang malaking simbahan sa tabi ng balong sinasabing pinagpainuman ni Jacob sa mga kawan ni Raquel, at mga limandaang hakbang mula roon ay naroon ang isang nayong tinatawag na Fadana, na dati raw, ayon sa obispo, ay bukid ni Laban, kung saan ipinakikita ang alaala ni Laban."
  da:
    - "»Nakors Stad« er det sted, hvor Abrahams tjener drog hen for at finde en hustru til Isak: han »gjorde sig rede og drog til Aram Naharaim, til Nakors Stad«. Ved dens brønd mødte han Rebekka, barnebarn af Nahor, Abrahams broder. Det kan ikke afgøres, om det var en by ved navn Nahor eller blot den by, hvor Nahors slægt boede. De, der hælder til det sidste, identificerer den med Karan, eftersom Laban, Rebekkas bror, bor i Karan, da Jakob senere flygter til ham."
    - "Der fandtes også en virkelig by af samme navn i den samme egn. Brevene fra Mari fra 1700-tallet f.Kr. nævner ofte Nahur, og assyriske tekster kender den som Nahuru eller Til-Nahiri, »Nahurs høj«; dens beliggenhed er ikke fundet. Encyclopaedia Judaica placerer den i Balikh-dalen nær Karan, mens Michaël Guichard, der er ved at udgive de omkring hundrede breve fra Nahur, som er fundet i Mari, behandler den som en by i det øvre Habur. Kortet sætter Nahors by i selve Karan i det nuværende sydøstlige Tyrkiet."
    - "Kristne pilgrimme søgte disse begivenheder i Karan. I 380'erne blev pilgrimmen Egeria vist den brønd, hvorfra Rebekka efter biskoppens ord havde vandet Abrahams tjeners kameler. Byens indbyggere, stadig hedninger, ærede et sted omkring en romersk mil fra byen, hvor mindesmærkerne for Nahor og Bethuel stod. Seks romerske mil fra byen stod en stor kirke ved brønden, hvor Jakob skulle have vandet Rakels hjorde, og omkring fem hundrede skridt derfra lå en landsby ved navn Fadana, efter biskoppens ord engang Labans gård, hvor Labans mindesmærke blev vist."
  sr:
    - "„Град Нахоров“ је место где је Аврамов слуга отишао да нађе жену Исаку: „отишавши дође у Месопотамију до града Нахоровог.“ Код његовог студенца срео је Ревеку, унуку Нахора, Аврамовог брата. Не може се одлучити да ли је то био град по имену Нахор или једноставно град где је живела Нахорова породица. Они који прихватају друго гледиште поистовећују га с Хараном, пошто Лаван, Ревекин брат, живи у Харану кад Јаков касније бежи к њему."
    - "У истом крају постојао је и стваран град тог имена. Писма из Мари из 18. века п. н. е. често помињу Нахур, а асирски текстови га знају као Нахуру или Тил-Нахири, „брдо Нахурово“; његово место није нађено. Encyclopaedia Judaica смешта га у долину Балиха код Харана, док га Мишел Гишар, који приређује стотињак писама из Нахура нађених у Мари, сматра градом на горњем Хабуру. Карта поставља град Нахоров у сам Харан, у данашњој југоисточној Турској."
    - "Хришћански ходочасници тражили су ове догађаје у Харану. Ходочасници Егерији 380-их година показан је тамо студенац из којег је, по речима епископа, Ревека појила камиле Аврамовог слуге. Становници града, још пагани, поштовали су место око једне миље од града где су стајали споменици Нахора и Ватуила. Шест миља од града, уз студенац где је, како се говорило, Јаков појио Рахиљина стада, стајала је велика црква, а око петсто корака од ње лежало је село звано Фадана, некада, по речима епископа, Лаванов посед, где су показивали Лаванов споменик."
  hu:
    - "„Náhor városa” az, ahová Ábrahám szolgája elment, hogy feleséget keressen Izsáknak: „Felkele tehát és elméne Mésopotámiába, a Nákhor városába.” Kútjánál találkozott Rebekával, Náhor, Ábrahám testvére unokájával. Nem dönthető el, hogy ez egy Náhor nevű város volt-e, vagy egyszerűen az a város, ahol Náhor családja lakott. Akik a második nézetet vallják, Háránnal azonosítják, mivel Lábán, Rebeka testvére Hárán városában él, amikor Jákób később hozzá menekül."
    - "Ugyanebben a térségben volt egy ilyen nevű valódi város is. A Kr. e. 18. századi mári levelek gyakran említik Nahurt, az asszír szövegek pedig Nahuru vagy Til-Nahiri néven, „Nahur halma” jelentéssel ismerik; helyét nem találták meg. Az Encyclopaedia Judaica a Balih-völgyben, Hárán közelében helyezi el, míg Michaël Guichard, aki a Mariban talált mintegy száz nahuri levelet adja ki, a felső Habúr egyik városának tekinti. A térkép Náhor városát magán Háránnál jelöli, a mai délkelet-törökországi területen."
    - "A keresztény zarándokok Háránban keresték ezeket a jeleneteket. A 380-as években Egeria zarándoknak megmutatták ott a kutat, amelyből a püspök szerint Rebeka megitatta Ábrahám szolgájának tevéit. A város lakói, akik még pogányok voltak, a várostól mintegy egy mérföldre tisztelték azt a helyet, ahol Náhor és Bethuél emlékhelyei álltak. Hat mérföldre a várostól egy nagy templom állt annál a kútnál, ahol a hagyomány szerint Jákób Ráhel nyájait itatta, és tőle mintegy ötszáz lépésre feküdt egy Fadana nevű falu, a püspök szerint egykor Lábán birtoka, ahol Lábán emlékhelyét mutatták."
  fi:
    - "”Naahorin kaupunki” on paikka, johon Abrahamin palvelija meni etsimään vaimoa Iisakille: ”hän nousi ja lähti Mesopotamiaan, Naahorin kaupunkiin.” Sen lähteellä hän tapasi Rebekan, Abrahamin veljen Nahorin pojantyttären. Ei voida ratkaista, oliko tämä kaupunki nimeltään Nahor vai yksinkertaisesti kaupunki, jossa Nahorin suku asui. Ne, jotka katsovat jälkimmäistä, tunnistavat sen Harraniksi, sillä Laban, Rebekan veli, asuu Harranissa, kun Jaakob myöhemmin pakenee hänen luokseen."
    - "Samalla seudulla oli myös todellinen samanniminen kaupunki. Marin 1700-luvun eaa. kirjeet mainitsevat usein Nahurin, ja assyrialaiset tekstit tuntevat sen nimellä Nahuru tai Til-Nahiri, ”Nahurin kumpu”; sen paikkaa ei ole löydetty. Encyclopaedia Judaica sijoittaa sen Harranin lähelle Balikhin laaksoon, kun taas Michaël Guichard, joka toimittaa Marista löydettyjä noin sataa Nahurista lähetettyä kirjettä, pitää sitä ylä-Haburin kaupunkina. Kartta asettaa Nahorin kaupungin Harraniin itseensä, nykyiseen Kaakkois-Turkkiin."
    - "Kristityt pyhiinvaeltajat etsivät näitä tapahtumia Harranista. 380-luvulla pyhiinvaeltaja Egerialle näytettiin siellä kaivo, josta piispan mukaan Rebekka oli juottanut Abrahamin palvelijan kamelit. Kaupungin asukkaat, yhä pakanoita, kunnioittivat noin mailin päässä kaupungista paikkaa, jossa olivat Nahorin ja Betuelin muistomerkit. Kuuden mailin päässä kaupungista oli suuri kirkko sen kaivon luona, jolla Jaakobin sanottiin juottaneen Rakelin laumoja, ja noin viidensadan askeleen päässä siitä oli Fadana-niminen kylä, piispan mukaan aikoinaan Labanin tila, jossa näytettiin Labanin muistomerkki."
  vi:
    - "“Thành của Na-cô” là nơi người đầy tớ của Áp-ra-ham đến để tìm vợ cho Y-sác: “đứng dậy đi qua xứ Mê-sô-bô-ta-mi, đến thành của Na-cô.” Bên giếng của thành, ông gặp Rê-be-ca, cháu gái của Na-cô, em trai Áp-ra-ham. Không thể quyết định đây là một thành tên Na-cô hay chỉ là thành nơi gia đình Na-cô sinh sống. Những ai theo quan điểm thứ hai đồng nhất nó với Cha-ran, vì La-ban, anh của Rê-be-ca, ở Cha-ran khi Gia-cốp về sau trốn đến với ông."
    - "Cũng có một thành thật sự mang tên này trong cùng vùng. Các thư từ Mari thế kỷ 18 TCN thường nhắc đến Nahur, và các văn bản A-si-ri biết nó dưới tên Nahuru hay Til-Nahiri, “gò của Nahur”; vị trí của nó chưa được tìm thấy. Encyclopaedia Judaica đặt nó trong thung lũng Balikh gần Cha-ran, còn Michaël Guichard, người đang biên tập khoảng một trăm bức thư từ Nahur tìm thấy ở Mari, coi nó là một thành ở thượng lưu sông Habur. Bản đồ đặt thành Na-cô tại chính Cha-ran, nay ở đông nam Thổ Nhĩ Kỳ."
    - "Các khách hành hương Cơ Đốc đã tìm những cảnh này tại Cha-ran. Vào những năm 380, nữ khách hành hương Egeria được chỉ cho xem tại đó cái giếng mà theo lời giám mục, Rê-be-ca đã cho lạc đà của đầy tớ Áp-ra-ham uống nước. Dân thành, khi ấy vẫn là người ngoại giáo, tôn kính một nơi cách thành chừng một dặm, nơi có đài tưởng niệm Na-cô và Bê-tu-ên. Cách thành sáu dặm, có một nhà thờ lớn đứng bên cái giếng nơi Gia-cốp được cho là đã cho bầy chiên của Ra-chên uống nước, và cách đó chừng năm trăm bước có một làng tên Fadana, theo lời giám mục từng là trang trại của La-ban, nơi người ta chỉ đài tưởng niệm La-ban."
  ro:
    - "„Cetatea lui Nahor” este locul unde a mers slujitorul lui Avraam ca să găsească o soție pentru Isaac: „sculându-se s’a dus în Mesopotamia cetatea lui Nahor”. Lângă fântâna ei a întâlnit-o pe Rebeca, nepoata lui Nahor, fratele lui Avraam. Nu se poate hotărî dacă era o cetate numită Nahor sau pur și simplu cetatea unde locuia familia lui Nahor. Cei care o înțeleg în al doilea fel o identifică cu Haranul, deoarece Laban, fratele Rebecăi, locuiește la Haran când Iacov fuge mai târziu la el."
    - "A existat și o cetate reală cu acest nume în aceeași regiune. Scrisorile de la Mari din secolul al XVIII-lea î.Hr. pomenesc adesea Nahur, iar textele asiriene îl cunosc ca Nahuru sau Til-Nahiri, „movila lui Nahur”; locul lui nu a fost găsit. Encyclopaedia Judaica îl așază în valea Balikhului, lângă Haran, în timp ce Michaël Guichard, care editează cele aproximativ o sută de scrisori din Nahur găsite la Mari, îl socotește o cetate din cursul superior al Habur-ului. Harta așază cetatea lui Nahor chiar la Haran, în sud-estul actual al Turciei."
    - "Pelerinii creștini au căutat aceste întâmplări la Haran. În anii 380 i s-a arătat acolo pelerinei Egeria fântâna din care, după spusele episcopului, Rebeca adăpase cămilele slujitorului lui Avraam. Locuitorii, încă păgâni, cinsteau un loc aflat la aproximativ o milă de cetate, unde se aflau monumentele lui Nahor și Betuel. La șase mile de cetate, lângă fântâna unde se spunea că Iacov adăpase turmele Rahelei, se înălța o biserică mare, iar la vreo cinci sute de pași de ea se afla un sat numit Fadana, odinioară, după spusele episcopului, moșia lui Laban, unde se arăta monumentul lui Laban."
  bg:
    - "„Градът Нахоров“ е мястото, където слугата на Авраам отишъл да намери жена за Исаак: той „стана та отиде в Месопотамия, в града Нахоров“. При кладенеца му той срещнал Ревека, внучка на Нахор, брата на Авраам. Не може да се реши дали това е бил град на име Нахор, или просто градът, където живеело семейството на Нахор. Привържениците на второто мнение го отъждествяват с Харан, тъй като Лаван, братът на Ревека, живее в Харан, когато Яков по-късно бяга при него."
    - "В същата област е имало и истински град с това име. Писмата от Мари от XVIII в. пр.н.е. често споменават Нахур, а асирийски текстове го познават като Нахуру или Тил-Нахири, „могилата на Нахур“; мястото му не е открито. Encyclopaedia Judaica го поставя в долината на Балих близо до Харан, докато Мишел Гишар, който издава стотината писма от Нахур, намерени в Мари, го смята за град в горното течение на Хабур. Картата поставя града на Нахор в самия Харан, в днешна югоизточна Турция."
    - "Християнските поклонници търсели тези събития в Харан. През 380-те години на поклонничката Егерия показали там кладенеца, от който според епископа Ревека напоила камилите на Авраамовия слуга. Жителите на града, все още езичници, почитали място на около миля от града, където стояли паметниците на Нахор и Ватуил. На шест мили от града, до кладенеца, където според преданието Яков напоил стадата на Рахил, се издигала голяма църква, а на около петстотин крачки от нея лежало село на име Фадана, някога, по думите на епископа, имението на Лаван, където показвали паметника на Лаван."
