body:
  en:
    - "“The city of Nahor” is where Abraham's servant went to find a wife for Isaac: “he arose, and went to Mesopotamia, unto the city of Nahor.” By its well he met Rebekah, granddaughter of Nahor, Abraham's brother. It cannot be decided whether this was a town named Nahor or simply the town where Nahor's family lived. Those who take the second view identify it with Haran, since Laban, Rebekah's brother, lives at Haran when Jacob later flees to him."
    - "There was also a real town of the name in the same region. The letters from Mari of the eighteenth century BC often mention Nahur, and Assyrian texts know it as Nahuru or Til-Nahiri, “mound of Nahur”; its site has not been found. The Encyclopaedia Judaica places it in the Balikh valley near Haran, while Michaël Guichard, who is editing the hundred or so letters from Nahur found at Mari, treats it as a town of the upper Habur. The map sets the city of Nahor at Haran itself, in today's south-eastern Turkey."
  ru:
    - "«Город Нахора» — то место, куда раб Авраама пошёл искать жену Исааку: «Он встал и пошел в Месопотамию, в город Нахора». У его колодца он встретил Ревекку, внучку Нахора, брата Авраама. Нельзя решить, был ли это город по имени Нахор или просто город, где жила семья Нахора. Сторонники второго взгляда отождествляют его с Харраном, потому что Лаван, брат Ревекки, живёт в Харране, когда к нему позднее бежит Иаков."
    - "В той же области был и настоящий город с этим именем. Письма из Мари XVIII в. до н. э. часто упоминают Нахур, а ассирийские тексты знают его как Нахуру или Тиль-Нахири, «холм Нахура»; его место не найдено. Encyclopaedia Judaica помещает его в долине Балиха близ Харрана, а Мишель Гишар, издающий около сотни писем из Нахура, найденных в Мари, считает его городом верхнего Хабура. Карта ставит город Нахора в самом Харране, на нынешнем юго-востоке Турции."
  uk:
    - "Місто Нахора — це те місце, куди слуга Авраама вирушив шукати дружину Ісаакові: «та знявсь і пійшов у Месопотамію, у Нахорів город». Біля його колодязя він зустрів Ревеку, онуку Нахора, брата Авраама. Вирішити, чи це було місто на ім'я Нахор, чи просто місто, де жила родина Нахора, неможливо. Ті, хто приймає друге, ототожнюють його з Хараном, бо Лаван, брат Ревеки, мешкає в Харані, коли пізніше до нього тікає Яків."
    - "У тому самому краї було й справжнє місто з такою назвою. Листи з Марі XVIII ст. до н. е. часто згадують Нахур, а ассирійські тексти знають його як Нахуру або Тіль-Нахірі, «пагорб Нахура»; його місце не знайдено. Encyclopaedia Judaica розміщує його в долині Балиху поблизу Харана, тоді як Мікаель Гішар, який видає близько сотні листів із Нахура, знайдених у Марі, вважає його містом верхнього Хабуру. Мапа ставить місто Нахора в самому Харані, у нинішній південно-східній Туреччині."
  es:
    - "La ciudad de Nacor es adonde fue el siervo de Abraham a buscar esposa para Isaac: «puesto en camino, llegó á Mesopotamia, á la ciudad de Nachôr». Junto a su pozo conoció a Rebeca, nieta de Nacor, hermano de Abraham. No puede decidirse si era una ciudad llamada Nacor o simplemente la ciudad donde vivía la familia de Nacor. Quienes adoptan la segunda opinión la identifican con Harán, pues Labán, hermano de Rebeca, vive en Harán cuando Jacob huye más tarde hacia él."
    - "Había también una ciudad real con ese nombre en la misma región. Las cartas de Mari del siglo XVIII a. C. mencionan a menudo Nahur, y los textos asirios la conocen como Nahuru o Til-Nahiri, «montículo de Nahur»; su emplazamiento no se ha hallado. La Encyclopaedia Judaica la sitúa en el valle del Balij, cerca de Harán, mientras que Michaël Guichard, que edita el centenar de cartas de Nahur halladas en Mari, la trata como una ciudad del alto Habur. El mapa sitúa la ciudad de Nacor en la propia Harán, en el actual sureste de Turquía."
  pt:
    - "“A cidade de Naor” é aonde o servo de Abraão foi buscar uma esposa para Isaque: “Ele se levantou e foi para a Mesopotâmia, para a cidade de Naor.” Junto ao poço ele encontrou Rebeca, neta de Naor, irmão de Abraão. Não se pode decidir se era uma cidade chamada Naor ou simplesmente a cidade onde vivia a família de Naor. Os que adotam a segunda opinião a identificam com Harã, pois Labão, irmão de Rebeca, mora em Harã quando Jacó mais tarde foge para ele."
    - "Havia também uma cidade real com esse nome na mesma região. As cartas de Mari do século XVIII a.C. mencionam com frequência Nahur, e os textos assírios a conhecem como Nahuru ou Til-Nahiri, “montículo de Nahur”; seu sítio não foi encontrado. A Encyclopaedia Judaica a situa no vale do Balikh, perto de Harã, enquanto Michaël Guichard, que edita as cerca de cem cartas de Nahur encontradas em Mari, a trata como uma cidade do alto Habur. O mapa coloca a cidade de Naor na própria Harã, no sudeste da atual Turquia."
  de:
    - "Die Stadt Nahors ist das Ziel von Abrahams Knecht, der für Isaak eine Frau suchte: Er „machte sich auf und zog nach Mesopotamien zu der Stadt Nahors“. An ihrem Brunnen traf er Rebekka, die Enkelin Nahors, des Bruders Abrahams. Es lässt sich nicht entscheiden, ob dies eine Stadt namens Nahor war oder einfach die Stadt, in der Nahors Familie wohnte. Wer die zweite Ansicht vertritt, setzt sie mit Haran gleich, da Laban, Rebekkas Bruder, in Haran lebt, als Jakob später zu ihm flieht."
    - "Es gab in derselben Gegend auch eine wirkliche Stadt dieses Namens. Die Briefe aus Mari aus dem achtzehnten Jahrhundert v. Chr. erwähnen oft Nahur, und assyrische Texte kennen sie als Nahuru oder Til-Nahiri, „Hügel des Nahur“; ihre Lage ist nicht gefunden. Die Encyclopaedia Judaica setzt sie im Balichtal nahe Haran an, während Michaël Guichard, der die etwa hundert in Mari gefundenen Briefe aus Nahur herausgibt, sie als Stadt am oberen Chabur behandelt. Die Karte setzt die Stadt Nahor in Haran selbst, im heutigen Südosten der Türkei."
  it:
    - "«La città di Nahor» è dove il servo di Abramo andò a cercare una moglie per Isacco: «e, messosi in viaggio, andò in Mesopotamia, alla città di Nahor». Presso il suo pozzo incontrò Rebecca, nipote di Nacor, fratello di Abramo. Non si può decidere se fosse una città di nome Nacor o semplicemente la città in cui viveva la famiglia di Nacor. Chi sostiene la seconda ipotesi la identifica con Carran, poiché Labano, fratello di Rebecca, vive a Carran quando Giacobbe più tardi fugge da lui."
    - "Esisteva anche una vera città di questo nome nella stessa regione. Le lettere di Mari del XVIII secolo a.C. menzionano spesso Nahur, e i testi assiri la conoscono come Nahuru o Til-Nahiri, «tell di Nahur»; il suo sito non è stato trovato. L’Encyclopaedia Judaica la colloca nella valle del Balikh vicino a Carran, mentre Michaël Guichard, che sta curando l’edizione del centinaio di lettere da Nahur trovate a Mari, la considera una città dell’alto Khabur. La carta pone la città di Nacor a Carran stessa, nell’odierna Turchia sud-orientale."
  fr:
    - "« La ville de Nachor » est celle où le serviteur d’Abraham alla chercher une épouse pour Isaac : « Il se leva, et alla en Mésopotamie, à la ville de Nachor. » À son puits, il rencontra Rebecca, petite-fille de Nachor, frère d’Abraham. On ne peut décider s’il s’agissait d’une ville nommée Nachor ou simplement de la ville où vivait la famille de Nachor. Ceux qui retiennent la seconde vue l’identifient avec Haran (Charan dans Louis Segond), puisque Laban, frère de Rebecca, vit à Haran quand Jacob s’enfuit plus tard chez lui."
    - "Il existait aussi une vraie ville de ce nom dans la même région. Les lettres de Mari du XVIIIe siècle av. J.-C. mentionnent souvent Nahur, et les textes assyriens la connaissent sous le nom de Nahourou ou Til-Nahiri, « butte de Nahur » ; son site n’a pas été trouvé. L’Encyclopaedia Judaica la place dans la vallée du Balikh près de Haran, tandis que Michaël Guichard, qui édite la centaine de lettres de Nahur trouvées à Mari, la traite comme une ville du haut Khabour. La carte place la ville de Nachor à Haran même, dans l’actuel sud-est de la Turquie."
  nl:
    - "“De stad van Nahor” is waar Abrahams knecht heen ging om een vrouw voor Isaak te zoeken: “en hij maakte zich op, en toog heen naar Mesopotamië, naar de stad van Nahor.” Bij haar put ontmoette hij Rebekka, de kleindochter van Nahor, Abrahams broer. Het valt niet uit te maken of dit een stad was die Nahor heette of eenvoudig de stad waar Nahors familie woonde. Wie de tweede opvatting aanhangt, vereenzelvigt haar met Haran, aangezien Laban, Rebekka's broer, in Haran woont wanneer Jakob later naar hem vlucht."
    - "Er was ook een werkelijke stad met die naam in dezelfde streek. De brieven uit Mari uit de achttiende eeuw v.Chr. noemen vaak Nahur, en Assyrische teksten kennen het als Nachuru of Til-Nahiri, ‘heuvel van Nahur’; de ligging is niet gevonden. De Encyclopaedia Judaica plaatst het in de Balikhvallei bij Haran, terwijl Michaël Guichard, die de honderd of zo brieven uit Nahur uitgeeft die te Mari zijn gevonden, het behandelt als een stad van de bovenloop van de Chabur. De kaart zet de stad van Nahor bij Haran zelf, in het huidige zuidoosten van Turkije."
  cs:
    - "„Město Nachorovo“ je místo, kam šel Abrahamův služebník najít ženu pro Izáka: „vstav, bral se k Aram Naharaim do města Náchor.“ U jeho studny potkal Rebeku, vnučku Nachora, Abrahamova bratra. Nelze rozhodnout, zda to bylo město jménem Nachor, nebo prostě město, kde žila Nachorova rodina. Kdo zastává druhý názor, ztotožňuje je s Cháranem, neboť Laban, Rebečin bratr, bydlí v Cháranu, když k němu Jákob později prchá."
    - "V téže oblasti bylo také skutečné město toho jména. Listy z Mari z osmnáctého století př. n. l. často zmiňují Nahur a asyrské texty je znají jako Nahuru nebo Til-Nahiri, „pahorek Nahuru“; jeho poloha nebyla nalezena. Encyclopaedia Judaica je klade do údolí Balíhu poblíž Cháranu, zatímco Michaël Guichard, který připravuje vydání asi stovky listů z Nahuru nalezených v Mari, je pokládá za město horního Chaburu. Mapa klade město Nachor do samotného Cháranu, v dnešním jihovýchodním Turecku."
  pl:
    - "„Miasto Nachorowe” to miejsce, dokąd sługa Abrahama udał się po żonę dla Izaaka: „a wstawszy puścił się do Aram Naharaim, do miasta Nachorowego”. Przy jego studni spotkał Rebekę, wnuczkę Nachora, brata Abrahama. Nie można rozstrzygnąć, czy było to miasto zwane Nachor, czy po prostu miasto, w którym mieszkała rodzina Nachora. Ci, którzy przyjmują drugie wyjaśnienie, utożsamiają je z Charanem, ponieważ Laban, brat Rebeki, mieszka w Charanie, gdy Jakub później ucieka do niego."
    - "W tym samym regionie istniało też rzeczywiste miasto o tej nazwie. Listy z Mari z XVIII w. p.n.e. często wspominają Nahur, a teksty asyryjskie znają je jako Nahuru lub Til-Nahiri, „wzgórze Nahur”; jego położenie nie zostało odnalezione. Encyclopaedia Judaica umieszcza je w dolinie Balich koło Charanu, a Michaël Guichard, który opracowuje około stu listów z Nahur znalezionych w Mari, uważa je za miasto górnego Chabur. Mapa umieszcza miasto Nachora w samym Charanie, w dzisiejszej południowo-wschodniej Turcji."
