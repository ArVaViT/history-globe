# Overview article (ADR 0007). "The city of Nahor" is either Haran, where Nahor's family lived, or the town Nahur of the Mari letters (Balikh valley per EJ, upper Habur per Guichard) (the map places it at Haran); shown without choosing, after the Encyclopaedia Judaica.
