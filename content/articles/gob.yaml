body:
  en:
    - "Gob is the place of two battles with the Philistines in David's time, in which David's warriors killed men “of the sons of the giant”. First “there was again a battle with the Philistines at Gob: then Sibbechai the Hushathite slew Saph”; then “there was again a battle in Gob with the Philistines, where Elhanan the son of Jaare-oregim, a Beth-lehemite, slew the brother of Goliath the Gittite, the staff of whose spear was like a weaver’s beam”. The words “the brother of” are added by the King James Version; the Hebrew, and the Synodal Russian, say that Elhanan killed Goliath himself; the parallel in Chronicles names his victim Lahmi the brother of Goliath, and how these accounts fit the story of David has long been debated."
    - "Where Gob lay is unknown; the name appears nowhere else. Chronicles places the first of these battles “at Gezer”, so many take Gob as a lost or miscopied name for Gezer, and the map follows them; others have suggested Nob, which differs by one Hebrew letter, Gibbethon, or a site in the Elah valley such as Khirbet Qeiyafa, near where David met Goliath. None can be proved."
  ru:
    - "Гоб — место двух сражений с Филистимлянами во времена Давида, когда его воины убили людей «из потомков Рефаимов». Сначала «была снова война с Филистимлянами в Гобе; тогда Совохай Хушатянин убил Сафута»; затем «было и другое сражение в Гобе; тогда убил Елханан, сын Ягаре-Оргима Вифлеемского, Голиафа Гефянина, у которого древко копья было, как навой у ткачей». Английская Библия короля Иакова добавляет здесь слова «брата Голиафа», а еврейский текст, как и Синодальный перевод, говорит, что Елханан убил самого Голиафа; параллель в Паралипоменоне называет убитого Лахмием, братом Голиафовым, и как эти известия согласуются с рассказом о Давиде, давно спорят."
    - "Где был Гоб, неизвестно; больше это имя нигде не встречается. Паралипоменон помещает первую из этих битв «в Газере», поэтому многие считают Гоб утраченным или искажённым при переписке именем Газера, и карта следует им; другие предлагали Номву, отличающуюся одной еврейской буквой, Гавафон или место в долине дуба, например Хирбет-Кейафу, рядом с тем местом, где Давид встретил Голиафа. Ни одно предположение не доказано."
  uk:
    - "Гоб — місце двох битв з філістимлянами за часів Давида, в яких Давидові воїни вбили людей «з потомків велетенських». Спершу «була ще раз війна з Филистіями в Гобі. Тодї положив мерцем Хушатїй Собохай-Сафута»; потім «довелось іще раз воювати Филистіїв під Гобом; того разу вбив Елханан, син Ягаре-Оргима, з Бетлеєма, Голїята з Гету, що в його ратовище було завтовшки з ткацький вал». Слова «брата» в англійському перекладі короля Якова додані; давньоєврейський текст і російський Синодальний переклад кажуть, що Елханан убив самого Голіята; паралельне місце Хронік називає його жертвою Лахмія, брата Голіята, і те, як ці оповіді узгоджуються з історією Давида, давно дискутують."
    - "Де лежав Гоб, невідомо; назва більше ніде не трапляється. Хроніки поміщають першу з цих битв «в Газері», тож багато хто вважає Гоб втраченою або викривленою переписувачами назвою Гезера, і карта йде за ними; інші запропонували Ноб, який відрізняється однією давньоєврейською літерою, Гіббетон або місце в долині Ела, як-от Хірбет-Кейяфа, поблизу того місця, де Давид зустрів Голіята. Жодного не можна довести."
  es:
    - "Gob es el lugar de dos batallas con los filisteos en tiempos de David, en las que los guerreros de David mataron a hombres «de los hijos del gigante». Primero «Otra segunda guerra hubo después en Gob contra los Filisteos: entonces Sibechâi Husathita hirió á Saph, que era de los hijos del gigante»; luego «Otra guerra hubo en Gob contra los Filisteos, en la cual Elhanan, hijo de Jaare-oregim de Beth-lehem, hirió á Goliath Getheo, el asta de cuya lanza era como un enjullo de telar». Las palabras «el hermano de» las añade la versión del rey Jacobo (King James), y la Reina-Valera citada aquí no las tiene; el hebreo, y la Biblia sinodal rusa, dicen que Elhanán mató al propio Goliat; el paralelo de Crónicas nombra a su víctima Lahmi, hermano de Goliat, y cómo encajan estos relatos con la historia de David se discute desde hace mucho."
    - "Dónde estuvo Gob se ignora; el nombre no aparece en ningún otro lugar. Crónicas sitúa la primera de estas batallas «en Gezer», de modo que muchos toman Gob por un nombre perdido o mal copiado de Gezer, y el mapa los sigue; otros han sugerido Nob, que difiere en una letra hebrea, Gibetón, o un sitio del valle de Ela como Khirbet Qeiyafa, cerca de donde David se enfrentó a Goliat. Nada de ello puede probarse."
  pt:
    - "Gobe é o lugar de duas batalhas com os filisteus no tempo de Davi, nas quais os guerreiros de Davi mataram homens “dos descendentes do gigante”. Primeiro “Houve novamente guerra contra os filisteus em Gobe. Então Sibecai, o husatita, matou Safe”; depois “Houve novamente guerra contra os filisteus em Gobe, e Elanã, filho de Jaaré-Oregim, o belemita, matou o irmão de Golias, o geteu, cuja haste da lança era como um eixo de tecelão”. As palavras “o irmão de” são acrescentadas pela Versão King James; o hebraico, e a Sinodal russa, dizem que Elanã matou o próprio Golias; o paralelo de Crônicas nomeia sua vítima Lami, irmão de Golias, e como esses relatos se ajustam à história de Davi é há muito debatido."
    - "Onde ficava Gobe é desconhecido; o nome não aparece em nenhum outro lugar. Crônicas situa a primeira dessas batalhas “em Gezer”, de modo que muitos tomam Gobe como um nome perdido ou mal copiado de Gezer, e o mapa os segue; outros sugeriram Nobe, que difere por uma letra hebraica, Gibetom, ou um sítio no vale de Elá, como Khirbet Qeiyafa, perto de onde Davi encontrou Golias. Nenhum pode ser provado."
  de:
    - "Gob ist der Ort zweier Schlachten mit den Philistern zu Davids Zeit, in denen Davids Krieger Männer „der Kinder Rapha“ erschlugen, der Riesenkinder. Zuerst „erhob sich noch ein Krieg zu Gob mit den Philistern. Da schlug Sibbechai, der Husathiter, den Saph“; dann „erhob sich noch ein Krieg zu Gob mit den Philistern. Da schlug El-Hanan, der Sohn Jaere-Orgims, ein Bethlehemiter, den Goliath, den Gathiter, welcher hatte einen Spieß, des Stange war wie ein Weberbaum“. Die Worte „den Bruder“ fügt die King-James-Bibel hinzu; der hebräische Text und die russische Synodalübersetzung sagen, dass Elhanan Goliat selbst erschlug; die Parallele in der Chronik nennt als sein Opfer Lachmi, den Bruder Goliats, und wie sich diese Berichte zur Geschichte Davids fügen, ist seit langem umstritten."
    - "Wo Gob lag, ist unbekannt; der Name erscheint sonst nirgends. Die Chronik verlegt die erste dieser Schlachten „zu Geser“, weshalb viele Gob für einen verlorenen oder falsch abgeschriebenen Namen für Geser halten, und die Karte folgt ihnen; andere haben Nob vorgeschlagen, das sich um einen hebräischen Buchstaben unterscheidet, ferner Gibbeton oder eine Stätte im Elatal wie Chirbet Qeiyafa, nahe dem Ort, an dem David Goliat begegnete. Nichts davon lässt sich beweisen."
  fr:
    - "Gob est le lieu de deux batailles contre les Philistins du temps de David, où les guerriers de David tuèrent des hommes « des enfants de Rapha ». D’abord « il y eut encore, après cela, une bataille à Gob avec les Philistins. Alors Sibbecaï, le Huschatite, tua Saph » ; puis « il y eut encore une bataille à Gob avec les Philistins. Et Elchanan, fils de Jaaré-Oreguim, de Bethléhem, tua Goliath de Gath, qui avait une lance dont le bois était comme une ensouple de tisserand ». La version King James ajoute les mots « le frère de » devant Goliath ; l’hébreu, comme la Synodale russe, dit qu’Elchanan tua Goliath lui-même ; le parallèle des Chroniques nomme sa victime Lachmi, frère de Goliath, et l’accord de ces récits avec l’histoire de David est depuis longtemps débattu."
    - "On ignore où se trouvait Gob ; le nom n’apparaît nulle part ailleurs. Les Chroniques placent la première de ces batailles « à Guézer », aussi beaucoup tiennent-ils Gob pour un nom perdu ou mal copié de Guézer, et la carte les suit ; d’autres ont suggéré Nob, qui diffère d’une lettre hébraïque, Guibbethon, ou un site de la vallée d’Éla tel que Khirbet Qeiyafa, près de l’endroit où David rencontra Goliath. Rien ne peut être prouvé."
  pl:
    - "Gob to miejsce dwóch bitew z Filistynami za czasów Dawida, w których wojownicy Dawida zabili ludzi „z synów tegoż olbrzyma”. Najpierw „była znowu wojna w Gob z Filistynami, i zabił Sobochaj Husatycki Safa”; potem „Była też jeszcze inna wojna w Gob z Filistynami, kędy zabił Elhana, syna Jaara Oregim, Betlehemczyk, brata Golijatowego z Giet, którego drzewce u włóczni było jako nawój tkacki”. Słowa o „bracie” dodała Biblia Króla Jakuba; hebrajski tekst i rosyjska Biblia synodalna mówią, że Elchanan zabił samego Goliata; odpowiednik w Księgach Kronik nazywa jego ofiarę Lachmim, bratem Goliata, a jak te zapisy mają się do opowieści o Dawidzie, od dawna się spiera."
    - "Gdzie leżało Gob, nie wiadomo; nazwa nie pojawia się nigdzie indziej. Księgi Kronik umieszczają pierwszą z tych bitew „w Gazer”, więc wielu uważa Gob za zagubioną lub błędnie przepisaną nazwę Gezer, i mapa za nimi idzie; inni sugerowali Nob, różniące się jedną hebrajską literą, Gibbeton albo stanowisko w dolinie Ela, jak Chirbet Qeijafa, blisko miejsca, gdzie Dawid spotkał Goliata. Żadnego nie da się udowodnić."
  it:
    - "Gob è il luogo di due battaglie con i Filistei al tempo di Davide, nelle quali i guerrieri di Davide uccisero uomini «dei discendenti di Rafa». Dapprima «ci fu un’altra battaglia coi Filistei, a Gob; e allora Sibbecai di Huslah uccise Saf»; poi «ci fu un’altra battaglia coi Filistei a Gob; ed Elhanan, figliuolo di Jaare-Oreghim di Bethlehem uccise Goliath di Gath, di cui l’asta della lancia era come un subbio da tessitore». Le parole «il fratello di» sono aggiunte dalla King James Version; l’ebraico, e la Bibbia sinodale russa, dicono che Elcanan uccise Golia stesso; il passo parallelo delle Cronache nomina la sua vittima Lacmi, fratello di Golia, e come questi racconti si accordino con la storia di Davide è da tempo discusso."
    - "Dove si trovasse Gob è ignoto; il nome non compare altrove. Le Cronache collocano la prima di queste battaglie «a Ghezer», così molti intendono Gob come un nome perduto o copiato male per Ghezer, e la mappa li segue; altri hanno suggerito Nob, che differisce per una lettera ebraica, Ghibbeton, o un sito nella valle di Ela come Khirbet Qeiyafa, presso il luogo dove Davide incontrò Golia. Nulla può essere provato."
  nl:
    - "Gob is de plaats van twee veldslagen met de Filistijnen in Davids tijd, waarin Davids krijgers mannen doodden “van de kinderen van Rafa”. Eerst geschiedde het “dat er wederom een krijg was te Gob tegen de Filistijnen. Toen sloeg Sibbechai, de Husathiet, Saf”; dan “was er nog een krijg te Gob tegen de Filistijnen”, waar volgens de King James Version Elchanan, de zoon van Jaare-Oregim, een Bethlehemiet, “de broer van Goliat, den Gethiet” doodde, “wiens spiesenhout was als een weversboom”. De woorden “de broer van” zijn toegevoegd in de King James Version; het Hebreeuws, en de Russische Synodale tekst, zeggen dat Elchanan Goliat zelf doodde; de parallel in Kronieken noemt als zijn slachtoffer Lachmi, de broer van Goliat, en hoe deze berichten zich verhouden tot het verhaal van David wordt al lang besproken."
    - "Waar Gob lag, is onbekend; de naam komt nergens anders voor. Kronieken plaatst de eerste van deze veldslagen “te Gezer”, zodat velen Gob opvatten als een verloren of verkeerd overgeschreven naam voor Gezer, en de kaart volgt hen; anderen hebben gedacht aan Nob, dat één Hebreeuwse letter verschilt, aan Gibbeton, of aan een plaats in de Elavallei zoals Khirbet Qeiyafa, bij waar David Goliat ontmoette. Niets daarvan is te bewijzen."
  cs:
    - "Gób je místo dvou bitev s Pelištejci za Davidových dnů, v nichž Davidovi bojovníci zabili muže „z synů téhož obra“. Nejprve „Opět byla válka v Gob s Filistinskými. Tehdáž Sibbechai Chusatský zabil Sáfu“; potom „Byla ještě i jiná válka s Filistinskými v Gob, kdež Elchánan syn Járe Oregim Betlémský zabil bratra Goliáše Gittejského, u jehož kopí bylo dřevo jako vratidlo tkadlcovské“. Slovo „bratra“ doplnila Bible krále Jakuba, a stojí i v Bibli kralické citované výše; hebrejština a ruská synodální Bible říkají, že Elchanan zabil samotného Goliáše; paralela v Letopisech jmenuje jeho oběť Lachmího, bratra Goliášova, a jak tyto zprávy zapadají do příběhu o Davidovi, se dlouho diskutuje."
    - "Kde Gób ležel, není známo; jméno se nikde jinde nevyskytuje. Letopisy kladou první z těchto bitev „v Gázer“, takže mnozí pokládají Gób za ztracené nebo chybně opsané jméno Gezeru a mapa je následuje; jiní navrhli Nob, které se liší jedním hebrejským písmenem, Gibeton nebo místo v údolí Éla, například Chirbet Qejafa, poblíž místa, kde se David setkal s Goliášem. Žádné nelze dokázat."
