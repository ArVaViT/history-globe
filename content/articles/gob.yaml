body:
  en:
    - "Gob is the place of two battles with the Philistines in David's time, in which David's warriors killed men “of the sons of the giant”. First “there was again a battle with the Philistines at Gob: then Sibbechai the Hushathite slew Saph”; then “there was again a battle in Gob with the Philistines, where Elhanan the son of Jaare-oregim, a Beth-lehemite, slew the brother of Goliath the Gittite, the staff of whose spear was like a weaver’s beam”. The words “the brother of” are added by the King James Version; the Hebrew, and the Synodal Russian, say that Elhanan killed Goliath himself; the parallel in Chronicles names his victim Lahmi the brother of Goliath, and how these accounts fit the story of David has long been debated."
    - "Where Gob lay is unknown; the name appears nowhere else. Chronicles places the first of these battles “at Gezer”, so many take Gob as a lost or miscopied name for Gezer, and the map follows them; others have suggested Nob, which differs by one Hebrew letter, Gibbethon, or a site in the Elah valley such as Khirbet Qeiyafa, near where David met Goliath. None can be proved."
    - "Ancient readers were no surer. According to the International Standard Bible Encyclopedia, the Syriac version and the Septuagint read Gath, the Philistine city, in place of Gob, and it judged that reading probably correct. Josephus, retelling these wars, says that David sent his army when the Philistines had gathered at the city of Gazara, that is Gezer, and that Sibbechai killed many there who boasted of descent from the giants. For the next battle he names no place, and the Philistine champion falls to a kinsman of David, Nephan in Whiston's translation, with no mention of Goliath. Eusebius describes Gob only as the place where a battle was fought, and gives no location."
  ru:
    - "Гоб — место двух сражений с Филистимлянами во времена Давида, когда его воины убили людей «из потомков Рефаимов». Сначала «была снова война с Филистимлянами в Гобе; тогда Совохай Хушатянин убил Сафута»; затем «было и другое сражение в Гобе; тогда убил Елханан, сын Ягаре-Оргима Вифлеемского, Голиафа Гефянина, у которого древко копья было, как навой у ткачей». Английская Библия короля Иакова добавляет здесь слова «брата Голиафа», а еврейский текст, как и Синодальный перевод, говорит, что Елханан убил самого Голиафа; параллель в Паралипоменоне называет убитого Лахмием, братом Голиафовым, и как эти известия согласуются с рассказом о Давиде, давно спорят."
    - "Где был Гоб, неизвестно; больше это имя нигде не встречается. Паралипоменон помещает первую из этих битв «в Газере», поэтому многие считают Гоб утраченным или искажённым при переписке именем Газера, и карта следует им; другие предлагали Номву, отличающуюся одной еврейской буквой, Гавафон или место в долине дуба, например Хирбет-Кейафу, рядом с тем местом, где Давид встретил Голиафа. Ни одно предположение не доказано."
    - "Древние читатели знали не больше. По Международной стандартной библейской энциклопедии, сирийский перевод и Септуагинта читают вместо Гоба Геф, филистимский город, и это чтение там признано, вероятно, верным. Иосиф Флавий, пересказывая эти войны, пишет, что Давид послал войско, когда Филистимляне собрались у города Газары, то есть Газера, и что Совохай убил там многих, хвалившихся происхождением от исполинов. Для следующей битвы он не называет места, а филистимского силача сражает родственник Давида, в переводе Уистона Нефан, и о Голиафе не упоминается. Евсевий говорит о Гобе лишь как о месте, где была битва, и не указывает, где оно лежало."
  uk:
    - "Гоб — місце двох битв з філістимлянами за часів Давида, в яких Давидові воїни вбили людей «з потомків велетенських». Спершу «була ще раз війна з Филистіями в Гобі. Тодї положив мерцем Хушатїй Собохай-Сафута»; потім «довелось іще раз воювати Филистіїв під Гобом; того разу вбив Елханан, син Ягаре-Оргима, з Бетлеєма, Голїята з Гету, що в його ратовище було завтовшки з ткацький вал». Слова «брата» в англійському перекладі короля Якова додані; давньоєврейський текст і російський Синодальний переклад кажуть, що Елханан убив самого Голіята; паралельне місце Хронік називає його жертвою Лахмія, брата Голіята, і те, як ці оповіді узгоджуються з історією Давида, давно дискутують."
    - "Де лежав Гоб, невідомо; назва більше ніде не трапляється. Хроніки поміщають першу з цих битв «в Газері», тож багато хто вважає Гоб втраченою або викривленою переписувачами назвою Гезера, і карта йде за ними; інші запропонували Ноб, який відрізняється однією давньоєврейською літерою, Гіббетон або місце в долині Ела, як-от Хірбет-Кейяфа, поблизу того місця, де Давид зустрів Голіята. Жодного не можна довести."
    - "Давні читачі знали не більше. За International Standard Bible Encyclopedia, сирійський переклад і Септуагінта читають замість Гоба Гат, філістимське місто, і це читання там визнано, ймовірно, правильним. Йосип Флавій, переказуючи ці війни, пише, що Давид послав військо, коли філістимляни зібралися біля міста Газари, тобто Гезера, і що Собохай убив там багатьох, які хвалилися походженням від велетнів. Для наступної битви він не називає місця, а філістимського силача вбиває родич Давида, у перекладі Вістона Нефан, і про Голіята не згадується. Євсевій говорить про Гоб лише як про місце, де відбулася битва, і не вказує, де воно лежало."
  es:
    - "Gob es el lugar de dos batallas con los filisteos en tiempos de David, en las que los guerreros de David mataron a hombres «de los hijos del gigante». Primero «Otra segunda guerra hubo después en Gob contra los Filisteos: entonces Sibechâi Husathita hirió á Saph, que era de los hijos del gigante»; luego «Otra guerra hubo en Gob contra los Filisteos, en la cual Elhanan, hijo de Jaare-oregim de Beth-lehem, hirió á Goliath Getheo, el asta de cuya lanza era como un enjullo de telar». Las palabras «el hermano de» las añade la versión del rey Jacobo (King James), y la Reina-Valera citada aquí no las tiene; el hebreo, y la Biblia sinodal rusa, dicen que Elhanán mató al propio Goliat; el paralelo de Crónicas nombra a su víctima Lahmi, hermano de Goliat, y cómo encajan estos relatos con la historia de David se discute desde hace mucho."
    - "Dónde estuvo Gob se ignora; el nombre no aparece en ningún otro lugar. Crónicas sitúa la primera de estas batallas «en Gezer», de modo que muchos toman Gob por un nombre perdido o mal copiado de Gezer, y el mapa los sigue; otros han sugerido Nob, que difiere en una letra hebrea, Gibetón, o un sitio del valle de Ela como Khirbet Qeiyafa, cerca de donde David se enfrentó a Goliat. Nada de ello puede probarse."
    - "Los lectores antiguos no sabían más. Según la International Standard Bible Encyclopedia, la versión siríaca y la Septuaginta leen Gat, la ciudad filistea, en lugar de Gob, y juzgó probablemente correcta esa lectura. Josefo, al narrar estas guerras, dice que David envió su ejército cuando los filisteos se habían reunido junto a la ciudad de Gazara, es decir Gezer, y que Sibecai mató allí a muchos que se jactaban de descender de los gigantes. Para la batalla siguiente no nombra lugar, y el campeón filisteo cae a manos de un pariente de David, Nefán en la traducción de Whiston, sin mencionar a Goliat. Eusebio describe Gob solo como el lugar donde se libró una batalla, y no da ubicación."
  pt:
    - "Gobe é o lugar de duas batalhas com os filisteus no tempo de Davi, nas quais os guerreiros de Davi mataram homens “dos descendentes do gigante”. Primeiro “Houve novamente guerra contra os filisteus em Gobe. Então Sibecai, o husatita, matou Safe”; depois “Houve novamente guerra contra os filisteus em Gobe, e Elanã, filho de Jaaré-Oregim, o belemita, matou o irmão de Golias, o geteu, cuja haste da lança era como um eixo de tecelão”. As palavras “o irmão de” são acrescentadas pela Versão King James; o hebraico, e a Sinodal russa, dizem que Elanã matou o próprio Golias; o paralelo de Crônicas nomeia sua vítima Lami, irmão de Golias, e como esses relatos se ajustam à história de Davi é há muito debatido."
    - "Onde ficava Gobe é desconhecido; o nome não aparece em nenhum outro lugar. Crônicas situa a primeira dessas batalhas “em Gezer”, de modo que muitos tomam Gobe como um nome perdido ou mal copiado de Gezer, e o mapa os segue; outros sugeriram Nobe, que difere por uma letra hebraica, Gibetom, ou um sítio no vale de Elá, como Khirbet Qeiyafa, perto de onde Davi encontrou Golias. Nenhum pode ser provado."
    - "Os leitores antigos não sabiam mais. Segundo a International Standard Bible Encyclopedia, a versão siríaca e a Septuaginta leem Gate, a cidade filisteia, em lugar de Gobe, e ela julgou essa leitura provavelmente correta. Josefo, ao narrar essas guerras, diz que Davi enviou seu exército quando os filisteus se haviam reunido junto à cidade de Gazara, isto é, Gezer, e que Sibecai matou ali muitos que se gabavam de descender dos gigantes. Para a batalha seguinte não nomeia lugar algum, e o campeão filisteu cai diante de um parente de Davi, Nefã na tradução de Whiston, sem menção de Golias. Eusébio descreve Gobe apenas como o lugar onde se travou uma batalha, e não dá localização."
  de:
    - "Gob ist der Ort zweier Schlachten mit den Philistern zu Davids Zeit, in denen Davids Krieger Männer „der Kinder Rapha“ erschlugen, der Riesenkinder. Zuerst „erhob sich noch ein Krieg zu Gob mit den Philistern. Da schlug Sibbechai, der Husathiter, den Saph“; dann „erhob sich noch ein Krieg zu Gob mit den Philistern. Da schlug El-Hanan, der Sohn Jaere-Orgims, ein Bethlehemiter, den Goliath, den Gathiter, welcher hatte einen Spieß, des Stange war wie ein Weberbaum“. Die Worte „den Bruder“ fügt die King-James-Bibel hinzu; der hebräische Text und die russische Synodalübersetzung sagen, dass Elhanan Goliat selbst erschlug; die Parallele in der Chronik nennt als sein Opfer Lachmi, den Bruder Goliats, und wie sich diese Berichte zur Geschichte Davids fügen, ist seit langem umstritten."
    - "Wo Gob lag, ist unbekannt; der Name erscheint sonst nirgends. Die Chronik verlegt die erste dieser Schlachten „zu Geser“, weshalb viele Gob für einen verlorenen oder falsch abgeschriebenen Namen für Geser halten, und die Karte folgt ihnen; andere haben Nob vorgeschlagen, das sich um einen hebräischen Buchstaben unterscheidet, ferner Gibbeton oder eine Stätte im Elatal wie Chirbet Qeiyafa, nahe dem Ort, an dem David Goliat begegnete. Nichts davon lässt sich beweisen."
    - "Die antiken Leser wussten es nicht besser. Nach der International Standard Bible Encyclopedia lesen die syrische Übersetzung und die Septuaginta statt Gob Gat, die Philisterstadt, und sie hielt diese Lesart für wahrscheinlich richtig. Josephus sagt in seiner Nacherzählung dieser Kriege, David habe sein Heer ausgesandt, als sich die Philister bei der Stadt Gazara, also Geser, versammelt hatten, und Sibbechai habe dort viele getötet, die sich ihrer Abstammung von den Riesen rühmten. Für die nächste Schlacht nennt er keinen Ort, und der Vorkämpfer der Philister fällt durch einen Verwandten Davids, in Whistons Übersetzung Nephan, ohne dass Goliat erwähnt wird. Eusebius beschreibt Gob nur als den Ort, an dem eine Schlacht geschlagen wurde, und nennt keine Lage."
  fr:
    - "Gob est le lieu de deux batailles contre les Philistins du temps de David, où les guerriers de David tuèrent des hommes « des enfants de Rapha ». D’abord « il y eut encore, après cela, une bataille à Gob avec les Philistins. Alors Sibbecaï, le Huschatite, tua Saph » ; puis « il y eut encore une bataille à Gob avec les Philistins. Et Elchanan, fils de Jaaré-Oreguim, de Bethléhem, tua Goliath de Gath, qui avait une lance dont le bois était comme une ensouple de tisserand ». La version King James ajoute les mots « le frère de » devant Goliath ; l’hébreu, comme la Synodale russe, dit qu’Elchanan tua Goliath lui-même ; le parallèle des Chroniques nomme sa victime Lachmi, frère de Goliath, et l’accord de ces récits avec l’histoire de David est depuis longtemps débattu."
    - "On ignore où se trouvait Gob ; le nom n’apparaît nulle part ailleurs. Les Chroniques placent la première de ces batailles « à Guézer », aussi beaucoup tiennent-ils Gob pour un nom perdu ou mal copié de Guézer, et la carte les suit ; d’autres ont suggéré Nob, qui diffère d’une lettre hébraïque, Guibbethon, ou un site de la vallée d’Éla tel que Khirbet Qeiyafa, près de l’endroit où David rencontra Goliath. Rien ne peut être prouvé."
    - "Les lecteurs anciens n’en savaient pas davantage. Selon l’International Standard Bible Encyclopedia, la version syriaque et la Septante lisent Gath, la ville philistine, au lieu de Gob, et elle jugeait cette leçon probablement correcte. Josèphe, en racontant ces guerres, dit que David envoya son armée quand les Philistins s’étaient rassemblés près de la ville de Gazara, c’est-à-dire Guézer, et que Sibbecaï y tua beaucoup d’hommes qui se vantaient de descendre des géants. Pour la bataille suivante, il ne nomme aucun lieu, et le champion philistin tombe sous les coups d’un parent de David, Néphan dans la traduction de Whiston, sans mention de Goliath. Eusèbe décrit Gob seulement comme le lieu où une bataille fut livrée, sans le situer."
  pl:
    - "Gob to miejsce dwóch bitew z Filistynami za czasów Dawida, w których wojownicy Dawida zabili ludzi „z synów tegoż olbrzyma”. Najpierw „była znowu wojna w Gob z Filistynami, i zabił Sobochaj Husatycki Safa”; potem „Była też jeszcze inna wojna w Gob z Filistynami, kędy zabił Elhana, syna Jaara Oregim, Betlehemczyk, brata Golijatowego z Giet, którego drzewce u włóczni było jako nawój tkacki”. Słowa o „bracie” dodała Biblia Króla Jakuba; hebrajski tekst i rosyjska Biblia synodalna mówią, że Elchanan zabił samego Goliata; odpowiednik w Księgach Kronik nazywa jego ofiarę Lachmim, bratem Goliata, a jak te zapisy mają się do opowieści o Dawidzie, od dawna się spiera."
    - "Gdzie leżało Gob, nie wiadomo; nazwa nie pojawia się nigdzie indziej. Księgi Kronik umieszczają pierwszą z tych bitew „w Gazer”, więc wielu uważa Gob za zagubioną lub błędnie przepisaną nazwę Gezer, i mapa za nimi idzie; inni sugerowali Nob, różniące się jedną hebrajską literą, Gibbeton albo stanowisko w dolinie Ela, jak Chirbet Qeijafa, blisko miejsca, gdzie Dawid spotkał Goliata. Żadnego nie da się udowodnić."
    - "Dawni czytelnicy nie wiedzieli więcej. Według International Standard Bible Encyclopedia przekład syryjski i Septuaginta czytają zamiast Gob Gat, miasto filistyńskie, i encyklopedia uznała tę lekcję za prawdopodobnie poprawną. Józef Flawiusz, opowiadając o tych wojnach, mówi, że Dawid wysłał wojsko, gdy Filistyni zgromadzili się przy mieście Gazara, czyli Gezer, i że Sibbekaj zabił tam wielu chlubiących się pochodzeniem od olbrzymów. Przy następnej bitwie nie podaje miejsca, a filistyńskiego mocarza zabija krewny Dawida, w przekładzie Whistona Nefan, bez wzmianki o Goliacie. Euzebiusz opisuje Gob jedynie jako miejsce, gdzie stoczono bitwę, i nie podaje jego położenia."
  it:
    - "Gob è il luogo di due battaglie con i Filistei al tempo di Davide, nelle quali i guerrieri di Davide uccisero uomini «dei discendenti di Rafa». Dapprima «ci fu un’altra battaglia coi Filistei, a Gob; e allora Sibbecai di Huslah uccise Saf»; poi «ci fu un’altra battaglia coi Filistei a Gob; ed Elhanan, figliuolo di Jaare-Oreghim di Bethlehem uccise Goliath di Gath, di cui l’asta della lancia era come un subbio da tessitore». Le parole «il fratello di» sono aggiunte dalla King James Version; l’ebraico, e la Bibbia sinodale russa, dicono che Elcanan uccise Golia stesso; il passo parallelo delle Cronache nomina la sua vittima Lacmi, fratello di Golia, e come questi racconti si accordino con la storia di Davide è da tempo discusso."
    - "Dove si trovasse Gob è ignoto; il nome non compare altrove. Le Cronache collocano la prima di queste battaglie «a Ghezer», così molti intendono Gob come un nome perduto o copiato male per Ghezer, e la mappa li segue; altri hanno suggerito Nob, che differisce per una lettera ebraica, Ghibbeton, o un sito nella valle di Ela come Khirbet Qeiyafa, presso il luogo dove Davide incontrò Golia. Nulla può essere provato."
    - "I lettori antichi non ne sapevano di più. Secondo la International Standard Bible Encyclopedia, la versione siriaca e la Settanta leggono Gath, la città filistea, al posto di Gob, e giudicò probabilmente corretta questa lezione. Giuseppe Flavio, narrando queste guerre, dice che Davide mandò il suo esercito quando i Filistei si erano radunati presso la città di Gazara, cioè Ghezer, e che Sibbecai vi uccise molti che si vantavano di discendere dai giganti. Per la battaglia successiva non nomina alcun luogo, e il campione filisteo cade per mano di un parente di Davide, Nefan nella traduzione di Whiston, senza menzione di Golia. Eusebio descrive Gob soltanto come il luogo dove fu combattuta una battaglia, senza indicarne la posizione."
  nl:
    - "Gob is de plaats van twee veldslagen met de Filistijnen in Davids tijd, waarin Davids krijgers mannen doodden “van de kinderen van Rafa”. Eerst geschiedde het “dat er wederom een krijg was te Gob tegen de Filistijnen. Toen sloeg Sibbechai, de Husathiet, Saf”; dan “was er nog een krijg te Gob tegen de Filistijnen”, waar volgens de King James Version Elchanan, de zoon van Jaare-Oregim, een Bethlehemiet, “de broer van Goliat, den Gethiet” doodde, “wiens spiesenhout was als een weversboom”. De woorden “de broer van” zijn toegevoegd in de King James Version; het Hebreeuws, en de Russische Synodale tekst, zeggen dat Elchanan Goliat zelf doodde; de parallel in Kronieken noemt als zijn slachtoffer Lachmi, de broer van Goliat, en hoe deze berichten zich verhouden tot het verhaal van David wordt al lang besproken."
    - "Waar Gob lag, is onbekend; de naam komt nergens anders voor. Kronieken plaatst de eerste van deze veldslagen “te Gezer”, zodat velen Gob opvatten als een verloren of verkeerd overgeschreven naam voor Gezer, en de kaart volgt hen; anderen hebben gedacht aan Nob, dat één Hebreeuwse letter verschilt, aan Gibbeton, of aan een plaats in de Elavallei zoals Khirbet Qeiyafa, bij waar David Goliat ontmoette. Niets daarvan is te bewijzen."
    - "De oude lezers wisten het niet beter. Volgens de International Standard Bible Encyclopedia lezen de Syrische vertaling en de Septuaginta Gath, de Filistijnse stad, in plaats van Gob, en zij achtte die lezing waarschijnlijk juist. Josephus zegt in zijn navertelling van deze oorlogen dat David zijn leger zond toen de Filistijnen zich bij de stad Gazara, dat is Gezer, hadden verzameld, en dat Sibbechai daar velen doodde die erop roemden van de reuzen af te stammen. Bij de volgende slag noemt hij geen plaats, en de Filistijnse kampvechter valt door een verwant van David, Nefan in de vertaling van Whiston, zonder vermelding van Goliat. Eusebius beschrijft Gob alleen als de plaats waar een slag werd geleverd, en geeft geen ligging."
  cs:
    - "Gób je místo dvou bitev s Pelištejci za Davidových dnů, v nichž Davidovi bojovníci zabili muže „z synů téhož obra“. Nejprve „Opět byla válka v Gob s Filistinskými. Tehdáž Sibbechai Chusatský zabil Sáfu“; potom „Byla ještě i jiná válka s Filistinskými v Gob, kdež Elchánan syn Járe Oregim Betlémský zabil bratra Goliáše Gittejského, u jehož kopí bylo dřevo jako vratidlo tkadlcovské“. Slovo „bratra“ doplnila Bible krále Jakuba, a stojí i v Bibli kralické citované výše; hebrejština a ruská synodální Bible říkají, že Elchanan zabil samotného Goliáše; paralela v Letopisech jmenuje jeho oběť Lachmího, bratra Goliášova, a jak tyto zprávy zapadají do příběhu o Davidovi, se dlouho diskutuje."
    - "Kde Gób ležel, není známo; jméno se nikde jinde nevyskytuje. Letopisy kladou první z těchto bitev „v Gázer“, takže mnozí pokládají Gób za ztracené nebo chybně opsané jméno Gezeru a mapa je následuje; jiní navrhli Nob, které se liší jedním hebrejským písmenem, Gibeton nebo místo v údolí Éla, například Chirbet Qejafa, poblíž místa, kde se David setkal s Goliášem. Žádné nelze dokázat."
    - "Ani starověcí čtenáři nevěděli víc. Podle International Standard Bible Encyclopedia čtou syrský překlad a Septuaginta místo Góbu Gat, pelištejské město, a encyklopedie toto čtení pokládala za pravděpodobně správné. Josefus ve svém převyprávění těchto válek říká, že David poslal vojsko, když se Pelištejci shromáždili u města Gazara, tedy Gezeru, a že Sibbechai tam zabil mnoho mužů, kteří se chlubili původem od obrů. U další bitvy nejmenuje žádné místo a pelištejského bojovníka zabíjí Davidův příbuzný, ve Whistonově překladu Nefan, bez zmínky o Goliášovi. Eusebios popisuje Gób jen jako místo, kde se svedla bitva, a jeho polohu neuvádí."
  sv:
    - "Gob är platsen för två strider mot filistéerna på Davids tid, där Davids krigare dödade män som tillhörde ”rafaéernas avkomlingar”. Först ”stod åter en strid med filistéerna vid Gob; husatiten Sibbekai slog då ned Saf”; sedan ”Åter stod en strid med filistéerna vid Gob; Elhanan, Jaare-Oregims son, betlehemiten, slog då ned gatiten Goljat, som hade ett spjut vars skaft liknade en vävbom”. Orden ”the brother of” har lagts till av King James-bibeln; hebreiskan, och den ryska synodalbibeln, säger att Elhanan dödade Goljat själv; parallellstället i Krönikeboken nämner hans offer som Lachmi, Goljats bror, och hur dessa berättelser stämmer med Davids historia har länge debatterats."
    - "Var Gob låg är okänt; namnet förekommer ingen annanstans. Krönikeboken förlägger den första av dessa strider ”vid Geser”, så många tar Gob för ett förlorat eller felskrivet namn på Geser, och kartan följer dem; andra har föreslagit Nob, som skiljer sig med en hebreisk bokstav, Gibbeton eller en plats i Terebintdalen såsom Khirbet Qeiyafa, nära där David mötte Goljat. Ingen kan bevisas."
    - "De forntida läsarna visste inte mer. Enligt International Standard Bible Encyclopedia läser den syriska översättningen och Septuaginta Gat, filistéernas stad, i stället för Gob, och den bedömde den läsarten som troligen riktig. Josefus säger i sin återberättelse av dessa krig att David sände sin här när filistéerna hade samlats vid staden Gazara, det vill säga Geser, och att Sibbekai där dödade många som skröt med att härstamma från jättarna. För nästa strid nämner han ingen plats, och filistéernas förkämpe faller för en släkting till David, Nefan i Whistons översättning, utan att Goljat nämns. Eusebios beskriver Gob endast som platsen där en strid stod, och anger inget läge."
  nb:
    - "Gob er stedet for to slag mot filistrene i Davids tid, der Davids krigere drepte menn som hørte til «Rafas barn». Først «blev det atter strid med filistrene; det var ved Gob; da slo husatitten Sibbekai Saf, som hørte til Rafas barn»; så «blev det strid med filistrene ved Gob, og betlehemitten Elhanan, sønn av Ja'are-Orgim, slo gittitten Goliat, som hadde et spyd hvis skaft var som en veverstang». Ordene «broren til» er tilføyd av King James-oversettelsen; den hebraiske teksten, og den russiske synodalbibelen, sier at Elhanan drepte selveste Goliat; parallellen i Krønikebøkene nevner hans offer som Lahmi, broren til Goliat, og hvordan disse beretningene passer med fortellingen om David, har lenge vært omdiskutert."
    - "Hvor Gob lå, er ukjent; navnet forekommer ikke noe annet sted. Krønikebøkene plasserer det første av disse slagene «ved Geser», så mange tar Gob som et tapt eller feilkopiert navn for Geser, og kartet følger dem; andre har foreslått Nob, som skiller seg med én hebraisk bokstav, Gibbeton, eller et sted i Ela-dalen som Khirbet Qeiyafa, nær der David møtte Goliat. Ingen kan bevises."
    - "De gamle leserne visste ikke mer. Ifølge International Standard Bible Encyclopedia leser den syriske oversettelsen og Septuaginta Gat, filisterbyen, i stedet for Gob, og den mente at den lesemåten trolig var riktig. Josefus sier i sin gjenfortelling av disse krigene at David sendte hæren sin da filistrene hadde samlet seg ved byen Gazara, det vil si Geser, og at Sibbekai der drepte mange som skrøt av å nedstamme fra kjempene. For neste slag nevner han ikke noe sted, og filistrenes kjempe faller for en slektning av David, Nefan i Whistons oversettelse, uten at Goliat nevnes. Eusebios beskriver Gob bare som stedet der et slag ble utkjempet, og oppgir ingen beliggenhet."
  tl:
    - "Ang Gob ay lugar ng dalawang labanan sa mga Filisteo sa panahon ni David, kung saan pinatay ng mga mandirigma ni David ang mga lalaki “sa mga anak ng higante”. Una, “nagkaroon uli ng pakikidigma sa mga Filisteo sa Gob; nang magkagayo'y sinaktan ni Sibechai na Husathita si Saph”; pagkatapos, “nagkaroon uli ng pakikidigma sa mga Filisteo sa Gob; at pinatay ni Elhanan na anak ni Jaare-oregim, na Bethlehemita, si Goliath na Getheo, na ang puluhan ng kaniyang sibat ay gaya ng panghabi ng manghahabi”. Ang mga salitang “ang kapatid ni” ay idinagdag ng King James Version; sinasabi ng Hebreo, at ng Sinodal na Ruso, na si Goliath mismo ang napatay ni Elhanan; ang kahilera sa Mga Cronica ay pinapangalanan ang biktima niya na si Lahmi na kapatid ni Goliath, at matagal nang pinagtatalunan kung paano umaayon ang mga salaysay na ito sa kuwento ni David."
    - "Hindi alam kung saan ang Gob; hindi lumilitaw saanman ang pangalan. Inilalagay ng Mga Cronica ang una sa mga labanang ito kung saan “nagkaroon ng pagdidigma sa Gezer laban sa mga Filisteo”, kaya't maraming nag-aakalang ang Gob ay nawala o maling kopyang pangalan ng Gezer, at sinusunod sila ng mapa; ang iba ay nagmungkahi ng Nob, na iba sa isang titik Hebreo, Gibbethon, o isang lugar sa libis ng Ela gaya ng Khirbet Qeiyafa, malapit sa kung saan nakipagkita si David kay Goliath. Walang mapapatunayan."
    - "Hindi rin mas tiyak ang mga sinaunang mambabasa. Ayon sa International Standard Bible Encyclopedia, ang salin sa Siriaco at ang Septuaginta ay bumabasa ng Gath, ang lungsod ng mga Filisteo, sa halip na Gob, at itinuring nito na malamang na tama ang basang iyon. Sinasabi ni Josephus, sa kaniyang muling pagsasalaysay ng mga digmaang ito, na nagpadala si David ng kaniyang hukbo nang magtipon ang mga Filisteo sa lungsod ng Gazara, samakatuwid ay Gezer, at na doon ay pinatay ni Sibechai ang marami na nagmamalaking sila'y mula sa lahi ng mga higante. Sa sumunod na labanan ay hindi siya nagbanggit ng lugar, at ang kampeon ng mga Filisteo ay napatay ng isang kamag-anak ni David, si Nefan sa salin ni Whiston, nang walang pagbanggit kay Goliath. Inilalarawan ni Eusebio ang Gob bilang lugar lamang na pinaglabanan, at hindi niya sinasabi kung saan ito."
  da:
    - "Gob er stedet for to slag med filisterne i Davids tid, hvor Davids krigere dræbte mænd »af Rafas Børn«. Først hedder det: »der var endnu Krig i Gob med Filisterne, da slog Husathiteren Sibkaj Saf, som var af Rafas Børn«; derefter: »Og der var endnu en Krig i Gob med Filisterne, og El-Hanan, Jaare-Orgims Søn, slog Beth-Lahemi, Githiteren Goliath, hvis Spydstage var som en Væverstang«. Ordene »broderen til« er tilføjet af King James-oversættelsen; den hebraiske tekst og den russiske synodaltekst siger, at Elhanan dræbte selve Goliat; parallelstedet i Krønikebøgerne nævner hans offer Lahmi, Goliats broder, og hvordan disse beretninger passer med fortællingen om David, har længe været diskuteret."
    - "Hvor Gob lå, er ukendt; navnet optræder ikke andre steder. Krønikebøgerne placerer det første af disse slag »i Geser«, så mange tager Gob for et tabt eller fejlkopieret navn for Gezer, og kortet følger dem; andre har foreslået Nob, som adskiller sig med ét hebraisk bogstav, Gibbeton eller et sted i Ela-dalen såsom Khirbet Qeiyafa, nær hvor David mødte Goliat. Intet kan bevises."
    - "De gamle læsere vidste ikke mere. Ifølge International Standard Bible Encyclopedia læser den syriske oversættelse og Septuaginta Gat, filisterbyen, i stedet for Gob, og den anså den læsemåde for sandsynligvis rigtig. Josefus siger i sin genfortælling af disse krige, at David sendte sin hær, da filisterne havde samlet sig ved byen Gazara, det vil sige Geser, og at Sibkaj dér dræbte mange, som pralede af at nedstamme fra kæmperne. Ved det næste slag nævner han intet sted, og filisternes kæmpe falder for en slægtning af David, Nefan i Whistons oversættelse, uden at Goliat nævnes. Eusebios beskriver Gob kun som stedet, hvor der blev udkæmpet et slag, og angiver ingen beliggenhed."
  sr:
    - "Гоб је место двеју битака с Филистејима у Давидово доба, у којима су Давидови ратници убили људе „од синова Рафајевих“. Најпре „наста опет рат с Филистејима у Гову; и тада Сивехај Хусаћанин уби Сафа“; затим „опет наста други рат у Гову с Филистејима; и тада Елханан, син Јаре-Орегимов Витлејемац, уби брата Голијата Гетејина, коме копљача беше као вратило“. Реч „брата“ у преводу краља Џејмса је додатак; хебрејски текст и руски синодски превод кажу да је Елханан убио самог Голијата; паралела у Летописима именује његову жртву као Ламију, брата Голијатовог, а како се ови извештаји слажу с причом о Давиду, дуго је спорно."
    - "Где је Гоб лежао, непознато је; име се нигде другде не јавља. Летописи смештају прву од ових битака „у Гезеру“, па многи узимају Гоб као изгубљено или погрешно преписано име Гезера, и карта их следи; други су предложили Нов, који се разликује једним хебрејским словом, Гиветон, или налазиште у долини Иле као Хирбет Кејафа, близу места где је Давид срео Голијата. Ништа се не може доказати."
    - "Ни стари читаоци нису знали више. Према International Standard Bible Encyclopedia, сиријски превод и Септуагинта читају уместо Гоб Гат, филистејски град, и она је то читање сматрала вероватно исправним. Јосиф Флавије, препричавајући ове ратове, каже да је Давид послао војску када су се Филистеји скупили код града Газаре, то јест Гезера, и да је Сивехај онде убио многе који су се хвалили пореклом од дивова. За следећу битку не наводи место, а филистејског јунака убија Давидов рођак, у Вистоновом преводу Нефан, без помена Голијата. Јевсевије описује Гоб само као место где је вођена битка и не наводи где је лежао."
  hu:
    - "Gób két csata színhelye a filiszteusokkal Dávid idején, amelyekben Dávid harcosai megöltek valakit „az óriások maradékai közül”. Először „lőn azután is harczuk a Filiszteusokkal Gób városánál, és Sibbékai, Husát városból való, akkor megölé Sáfot, ki az óriások maradékai közül való vala”; majd „újra lőn háború a Filiszteusokkal Góbnál, hol Elkhanán, a Bethlehemből való Jaharé Oregimnek fia megölé a Gitteus Góliátot, kinek kopjanyele olyan vala, mint a szövőknek zugolyfája”. A „testvére” szót a King James Version teszi hozzá; a héber szöveg és a szinodális orosz szerint Elhanán magát Góliátot ölte meg; a Krónikák párhuzamos helye áldozatát Lahmiként, Góliát testvéreként nevezi meg, és hogy e beszámolók hogyan illeszkednek Dávid történetéhez, régóta vitatott."
    - "Hogy hol feküdt Gób, ismeretlen; a név máshol nem szerepel. A Krónikák az első csatát „Gézerben” helyezi, ezért sokan Góbot Gézer elveszett vagy félremásolt nevének tartják, és a térkép is őket követi; mások Nóbot javasolták, amely egyetlen héber betűben tér el, Gibbetont, vagy az Éla-völgyben fekvő lelőhelyet, például Hirbet Qeijafát, ott, ahol Dávid Góliáttal találkozott. Egyik sem bizonyítható."
    - "Az ókori olvasók sem tudtak többet. Az International Standard Bible Encyclopedia szerint a szír fordítás és a Septuaginta Gób helyett Gátot, a filiszteus várost olvassa, és ezt az olvasatot valószínűleg helyesnek ítélte. Josephus e háborúk elbeszélésében azt mondja, hogy Dávid akkor küldte ki seregét, amikor a filiszteusok Gazara városánál, vagyis Gézernél gyűltek össze, és hogy Sibbékai ott sokakat megölt azok közül, akik az óriásoktól való származásukkal kérkedtek. A következő csatánál nem nevez meg helyet, és a filiszteusok bajnokát Dávid egyik rokona, Whiston fordításában Nephan, öli meg, Góliát említése nélkül. Eusebius Góbot csak úgy írja le, mint ahol egy csatát vívtak, és fekvését nem adja meg."
  fi:
    - "Gob on kahden filistealaisten kanssa käydyn taistelun paikka Daavidin aikana, joissa Daavidin soturit tappoivat ”Raafan jälkeläisiä”, jättiläisen poikia. Ensin ”oli taas taistelu filistealaisten kanssa Goobissa: silloin huusalainen Sibbekai surmasi Safin”; sitten ”oli taistelu filistealaisia vastaan Goobissa. Elhanan, Jare-Ooregimin poika, beetlehemiläinen, surmasi gatilaisen Goljatin, jonka peitsen varsi oli niinkuin kangastukki”. Sanat ”Goljatin veli” on lisännyt King James -käännös; heprea ja venäläinen synodaaliteksti sanovat, että Elhanan tappoi Goljatin itsensä; Aikakirjojen rinnakkaiskohta nimeää hänen uhrinsa Lahmiksi, Goljatin veljeksi, ja siitä, miten nämä kertomukset sopivat Daavidin tarinaan, on kiistelty pitkään."
    - "Missä Gob sijaitsi, ei tiedetä; nimi ei esiinny muualla. Aikakirjat sijoittavat ensimmäisen näistä taisteluista ”Geserissä”, joten monet pitävät Gobia Geserin kadonneena tai väärin kopioituna nimenä, ja kartta seuraa heitä; toiset ovat ehdottaneet Nobia, joka eroaa yhdellä heprean kirjaimella, Gibbetonia tai paikkaa Elan laaksossa, kuten Khirbet Qeiyafaa, lähellä sitä paikkaa, jossa Daavid kohtasi Goljatin. Mitään ei voi todistaa."
    - "Muinaiset lukijat eivät tienneet enempää. International Standard Bible Encyclopedian mukaan syyrialainen käännös ja Septuaginta lukevat Gobin sijasta Gat, filistealaisten kaupunki, ja se piti tätä lukutapaa todennäköisesti oikeana. Josephus kertoo näiden sotien uudelleenkerronnassaan, että Daavid lähetti sotajoukkonsa, kun filistealaiset olivat kokoontuneet Gazaran kaupungin eli Geserin luo, ja että Sibbekai surmasi siellä monia, jotka kerskuivat polveutuvansa jättiläisistä. Seuraavan taistelun kohdalla hän ei mainitse paikkaa, ja filistealaisten sankarin surmaa Daavidin sukulainen, Whistonin käännöksessä Nefan, eikä Goljatia mainita. Eusebios kuvaa Gobia vain paikaksi, jossa käytiin taistelu, eikä kerro sen sijaintia."
  vi:
    - "Góp là nơi diễn ra hai trận đánh với người Phi-li-tin vào thời Đa-vít, trong đó các chiến sĩ của Đa-vít giết những người thuộc dòng người khổng lồ. Trước hết “lại có một trận khác cùng dân Phi-li-tin tại Góp. Ở đó, Si-bê-cai, người Hu-sa, giết Sáp, là con cháu của Ra-pha”; rồi “Tại Góp lại còn có một trận với dân Phi-li-tin nữa. Ên-cha-nan, con trai Gia-a-rê-Ô-rê-ghim, ở Bết-lê-hem, đánh giết Gô-li-át ở Gát; người có một cây lao, cán như ống trục của thợ dệt”. Bản King James thêm vào câu này chữ “the brother of” (em của), không có trong bản tiếng Việt trích ở trên; tiếng Hê-bơ-rơ, và bản Synodal Nga, nói rằng Ên-ha-nan giết chính Gô-li-át; bản song song trong sách Sử Ký nêu nạn nhân của ông là Lác-mi, em của Gô-li-át, và việc các tường thuật này khớp với câu chuyện của Đa-vít ra sao từ lâu đã được tranh luận."
    - "Góp ở đâu thì không biết; tên không xuất hiện ở nơi nào khác. Sách Sử Ký đặt trận đầu trong hai trận này “tại Ghê-xe”, nên nhiều người coi Góp là tên đã mất hoặc bị chép sai của Ghê-xe, và bản đồ theo họ; những người khác đề nghị Nóp, chỉ khác một chữ cái Hê-bơ-rơ, Ghi-bê-thôn, hoặc một địa điểm trong thung lũng Ê-la như Khirbet Qeiyafa, gần nơi Đa-vít gặp Gô-li-át. Không đề nghị nào có thể chứng minh."
    - "Các độc giả thời xưa cũng không biết hơn. Theo International Standard Bible Encyclopedia, bản dịch Sy-ri và bản Bảy Mươi đọc là Gát, thành của người Phi-li-tin, thay cho Góp, và bộ bách khoa này cho rằng cách đọc ấy có lẽ đúng. Josephus, khi kể lại các cuộc chiến này, nói rằng Đa-vít sai quân đi khi người Phi-li-tin tụ tập tại thành Gazara, tức Ghê-xe, và Si-bê-cai đã giết tại đó nhiều kẻ khoe mình thuộc dòng dõi người khổng lồ. Về trận kế tiếp, ông không nêu địa danh nào, và tay vô địch Phi-li-tin ngã dưới tay một người bà con của Đa-vít, trong bản dịch của Whiston là Nephan, không hề nhắc đến Gô-li-át. Eusebius chỉ mô tả Góp là nơi đã diễn ra một trận đánh, và không cho biết vị trí."
  ro:
    - "Gob este locul a două lupte cu filistenii din vremea lui David, în care luptătorii lui David au ucis oameni dintre fiii uriașului. Mai întâi a avut loc o luptă cu filistenii la Gob, unde Sibecai hușatitul l-a ucis pe Saf; apoi a avut loc iarăși o luptă la Gob cu filistenii, unde Elhanan, fiul lui Iaare-Oreghim, betleemitul, l-a ucis pe fratele lui Goliat din Gat, a cărui lance avea coada ca sulul țesătorilor. Cuvintele „fratele lui” sunt adăugate de Versiunea King James; ebraica și Biblia sinodală rusă spun că Elhanan l-a ucis pe Goliat însuși; paralela din Cronici numește victima lui Lahmi, fratele lui Goliat, iar cum se potrivesc aceste relatări cu povestea lui David este de multă vreme disputat."
    - "Unde se afla Gob este necunoscut; numele nu apare nicăieri altundeva. Cronicile plasează prima dintre aceste lupte „în Gazer”, așa că mulți socotesc Gob un nume pierdut sau copiat greșit pentru Ghezer, iar harta îi urmează; alții au sugerat Nob, care se deosebește printr-o singură literă ebraică, Ghibeton sau un loc din valea Ela, precum Khirbet Qeiyafa, lângă locul unde David l-a întâlnit pe Goliat. Nimic nu poate fi dovedit."
    - "Nici cititorii din vechime nu știau mai mult. După International Standard Bible Encyclopedia, versiunea siriacă și Septuaginta citesc Gat, cetatea filistenilor, în loc de Gob, iar enciclopedia a socotit această lecțiune probabil corectă. Josephus, repovestind aceste războaie, spune că David și-a trimis oastea când filistenii se adunaseră lângă cetatea Gazara, adică Ghezer, și că Sibecai a ucis acolo pe mulți care se lăudau că se trag din uriași. Pentru lupta următoare nu numește niciun loc, iar campionul filistenilor cade de mâna unei rude a lui David, Nefan în traducerea lui Whiston, fără vreo mențiune despre Goliat. Eusebiu descrie Gob doar ca locul unde s-a dat o luptă, fără să-i arate poziția."
  bg:
    - "Гов е мястото на две битки с филистимците по времето на Давид, в които воините на Давид убиха мъже „от чадата на Рафа“. Първо „стана пак бой с Филистмците в Гов, в който Сивехай Хусатецът умъртви Сафа“; после „пак стана бой в Гов с Филистимците; и Елханан синът на Яре-орегима, Витлеемеца, умъртви брата на Голиата Гетеца; и дървото на копието му бе като кросно на тъкач“. Думите „брата на“ са добавени от King James Version (и стоят и в Цариградската Библия); еврейският текст и руският Синодален превод казват, че Елханан убил самия Голиат; успоредният текст в Летописи назовава жертвата му Лахми, брата на Голиат, и как тези разкази се съгласуват с историята на Давид, отдавна е предмет на спор."
    - "Къде е бил Гов, не е известно; името не се среща никъде другаде. Летописи поставя първата от тези битки „в Гезер“, затова мнозина смятат Гов за изгубено или погрешно преписано име на Гезер и картата следва тях; други предлагат Нов, който се различава с една еврейска буква, Гиветон или място в долината Ила, като Хирбет Кейафа, близо до мястото, където Давид срещна Голиат. Нищо от това не може да бъде доказано."
    - "И древните читатели не знаели повече. Според International Standard Bible Encyclopedia сирийският превод и Септуагинта четат вместо Гов Гет, филистимския град, и енциклопедията смята това четене за вероятно правилно. Йосиф Флавий, преразказвайки тези войни, казва, че Давид изпратил войска, когато филистимците се събрали при град Газара, тоест Гезер, и че Сивехай убил там мнозина, които се хвалели, че произхождат от великаните. За следващата битка той не назовава място, а филистимския юнак поваля роднина на Давид, в превода на Уистън Нефан, без да се споменава Голиат. Евсевий описва Гов само като място, където е била битка, и не посочва къде е лежал."
