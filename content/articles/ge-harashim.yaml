body:
  en:
    - "Ge-harashim, “valley of craftsmen”, is named twice, once in a genealogy and once in a list of settlements. Among the clans of Judah, Seraiah begat Joab, “the father of the valley of Charashim; for they were craftsmen”: a note that a family of artisans lived there and gave the valley its name. After the exile the men of Benjamin settled in a row of towns ending with “Lod, and Ono, the valley of craftsmen”, where the King James Version translates the name and the Synodal Russian keeps it as Harashim. The Hebrew word can mean workers in wood, stone or metal."
    - "Nothing more is known. The company of Lod and Ono puts the valley on the edge of the coastal plain, near modern Lod and Kiryat Ono, and some think it is the same as the plain of Ono where Nehemiah's enemies asked to meet him. Several spots have been proposed, among them Wadi esh-Shellal, the area of Sarafand el-Kharab and Khirbet Hirsha, whose name may echo the old one; none has been confirmed, and the map marks only the general area around Lod."
  ru:
    - "Долина плотников, по-еврейски Ге-Харашим, названа дважды: один раз в родословии и один раз в списке поселений. Среди родов Иуды «Сераия родил Иоава, родоначальника долины плотников, потому что они были плотники» — заметка о том, что здесь жил род ремесленников, давший долине имя. После плена сыны Вениамина поселились в ряде городов, который кончается словами «Лоде, Оно, в долине Харашиме»: здесь Синодальный перевод оставляет имя непереведённым. Еврейское слово может означать мастеров по дереву, камню или металлу."
    - "Больше ничего не известно. Соседство с Лиддой и Оно помещает долину на краю приморской равнины, близ нынешних Лода и Кирьят-Оно, и некоторые считают её той же равниной Оно, где враги Неемии звали его на встречу. Предлагали несколько мест, среди них Вади-эш-Шеллаль, окрестности Сарафанд-эль-Хараба и Хирбет-Хиршу, чьё имя, быть может, отзывается древним; ни одно не подтверждено, и карта отмечает лишь общую область вокруг Лидды."
  uk:
    - "Долина теслів (Ґе-гарашім), «долина ремісників», названа двічі: один раз у родоводі, один раз у переліку поселень. Серед родів Юди Серая породив Йоава, «родоначальника Долини ремесників, бо вони були ремесники»: ця примітка вказує, що там жила родина майстрових і дала долині ім’я. Після вигнання Веніяминові люди оселилися в низці міст, яку завершують слова «Лодї, Оно, в долинї Харашимі», де англійський переклад короля Якова перекладає назву, а російський Синодальний переклад зберігає її як Харашим. Давньоєврейське слово може означати майстрів по дереву, каменю чи металу."
    - "Більше нічого не відомо. Сусідство Лідди й Оно розташовує долину на краю прибережної рівнини, поблизу сучасних Лідди (Лода) й Кір’ят-Оно, і дехто вважає її тією самою, що й рівнина Оно, де вороги Неемії пропонували зустрітися з ним. Пропонували кілька місць, серед них Ваді-еш-Шеллал, околиці Сарафанд-ель-Хараб і Хірбет-Хірша, назва якої може відлунювати давню; жодне не підтверджене, і карта позначає лише загальну місцевість навколо Лідди."
  es:
    - "Ge-harashim, «valle de los artífices», se nombra dos veces, una en una genealogía y otra en una lista de poblaciones. Entre los clanes de Judá, Seraías engendró a Joab, «padre de los habitantes en el valle llamado de Carisim, porque fueron artífices»: una nota según la cual vivía allí una familia de artesanos que dio nombre al valle. Después del destierro, los hombres de Benjamín se establecieron en una serie de poblaciones que termina con «Lod, y Ono, valle de los artífices», donde la versión del rey Jacobo (King James) traduce el nombre y la Biblia sinodal rusa lo conserva como Harashim. La palabra hebrea puede designar a trabajadores de la madera, la piedra o el metal."
    - "No se sabe nada más. La vecindad de Lida y Ono sitúa el valle en el borde de la llanura costera, cerca de las actuales Lod y Kiryat Ono, y algunos piensan que es el mismo que la llanura de Ono donde los enemigos de Nehemías le pidieron reunirse. Se han propuesto varios lugares, entre ellos el Wadi esh-Shellal, la zona de Sarafand el-Kharab y Khirbet Hirsha, cuyo nombre puede hacerse eco del antiguo; ninguno se ha confirmado, y el mapa señala solo la zona general en torno a Lida."
  pt:
    - "Ge-Harasim, “vale dos artesãos”, é nomeado duas vezes, uma numa genealogia e outra numa lista de povoados. Entre os clãs de Judá, Seraías gerou Joabe, “o pai de Ge-Harasim, pois eles eram artesãos”: uma nota de que uma família de artífices vivia ali e deu nome ao vale. Depois do exílio, os homens de Benjamim se estabeleceram numa fileira de cidades que termina com “em Lode e em Ono, o vale dos artesãos”, onde a Versão King James traduz o nome e a Bíblia Sinodal russa o mantém como Harashim. A palavra hebraica pode significar trabalhadores da madeira, da pedra ou do metal."
    - "Nada mais se sabe. A vizinhança de Lode e Ono situa o vale na orla da planície costeira, perto das modernas Lod e Kiryat Ono, e alguns pensam que é o mesmo que a planície de Ono onde os inimigos de Neemias lhe pediram um encontro. Vários lugares foram propostos, entre eles o uádi esh-Shellal, a área de Sarafand el-Kharab e Khirbet Hirsha, cujo nome pode ecoar o antigo; nenhum foi confirmado, e o mapa marca apenas a área geral em torno de Lode."
  de:
    - "Ge-Haraschim, „Tal der Handwerker“, wird zweimal genannt, einmal in einem Geschlechtsregister und einmal in einer Liste von Siedlungen. Unter den Sippen Judas zeugte Seraja Joab, „den Vater des Tals der Zimmerleute; denn sie waren Zimmerleute“: eine Notiz, dass dort eine Familie von Handwerkern wohnte und dem Tal den Namen gab. Nach dem Exil siedelten die Männer Benjamins in einer Reihe von Städten, die mit „Lod und Ono im Tal der Zimmerleute“ endet, wobei die King-James-Bibel den Namen übersetzt und die russische Synodalübersetzung ihn als Harashim beibehält. Das hebräische Wort kann Arbeiter in Holz, Stein oder Metall bezeichnen."
    - "Mehr ist nicht bekannt. Die Nachbarschaft von Lod und Ono rückt das Tal an den Rand der Küstenebene, in die Nähe des heutigen Lod und von Kirjat Ono, und manche halten es für dasselbe wie die Ebene von Ono, wo die Feinde Nehemias ihn zu einem Treffen baten. Mehrere Stellen sind vorgeschlagen worden, darunter das Wadi esch-Schellal, die Gegend von Sarafand el-Charab und Chirbet Hirscha, dessen Name an den alten anklingen könnte; keine ist bestätigt, und die Karte markiert nur das allgemeine Gebiet um Lod."
  fr:
    - "Ge-Harashim, « vallée des artisans », est nommée deux fois, une fois dans une généalogie et une fois dans une liste d’établissements. Parmi les clans de Juda, Seraja engendra Joab, « père de la vallée des ouvriers ; car ils étaient ouvriers » : notice indiquant qu’une famille d’artisans y vivait et donna son nom à la vallée. Après l’exil, les hommes de Benjamin s’établirent dans une suite de villes qui se termine par « Lod et Ono, la vallée des ouvriers », où la version King James traduit le nom et où la Synodale russe le garde sous la forme Harashim. Le mot hébreu peut désigner des ouvriers du bois, de la pierre ou du métal."
    - "On n’en sait pas davantage. Le voisinage de Lod et d’Ono place la vallée en bordure de la plaine côtière, près de Lod et de Kiryat Ono actuelles, et certains pensent qu’elle est identique à la plaine d’Ono où les ennemis de Néhémie lui demandèrent une entrevue. Plusieurs endroits ont été proposés, notamment l’oued esh-Shellal, la région de Sarafand el-Kharab et Khirbet Hirsha, dont le nom peut faire écho à l’ancien ; aucun n’a été confirmé, et la carte ne marque que la région générale autour de Lod."
  pl:
    - "Dolina Rzemieślników (Ge-Charaszim), „dolina rzemieślników”, jest wymieniona dwukrotnie, raz w rodowodzie, raz w wykazie osiedli. Wśród rodów Judy Serajasz spłodził Joaba, „ojca w dolinie mieszkających rzemieślników; bo rzemieślnicy byli”: uwaga, że mieszkała tam rodzina rzemieślników i dała dolinie nazwę. Po wygnaniu mężowie Beniamina osiedlili się w szeregu miast kończącym się na „Lod, i w Ono, i w dolinie rzemieślników”, gdzie Biblia Króla Jakuba tłumaczy nazwę, a rosyjska synodalna zachowuje ją jako Charaszim. Hebrajskie słowo może oznaczać pracujących w drewnie, kamieniu lub metalu."
    - "Nic więcej nie wiadomo. Sąsiedztwo Lod i Ono umieszcza dolinę na skraju niziny nadmorskiej, w pobliżu dzisiejszych Lod i Kirjat Ono, a niektórzy uważają ją za to samo co równina Ono, na której wrogowie Nehemiasza prosili o spotkanie z nim. Zaproponowano kilka miejsc, m.in. Wadi esz-Szellal, okolice Sarafand el-Charab i Chirbet Chirsza, której nazwa może odbijać dawną; żadnego nie potwierdzono, a mapa zaznacza tylko ogólny obszar wokół Lod."
  it:
    - "Ge-Carasim, «valle degli artigiani», è nominata due volte, una in una genealogia e una in un elenco di insediamenti. Fra i clan di Giuda, Seraia generò Ioab, «padre degli abitanti la valle degli artigiani, perché erano artigiani»: una nota secondo cui una famiglia di artigiani vi abitava e diede il nome alla valle. Dopo l’esilio gli uomini di Beniamino si stabilirono in una serie di città che termina con «Lod ed Ono, valle degli artigiani», dove la King James Version traduce il nome e la Bibbia sinodale russa lo conserva come Charashim. La parola ebraica può indicare lavoratori del legno, della pietra o del metallo."
    - "Non si sa altro. La compagnia di Lidda e Ono pone la valle al margine della pianura costiera, presso l’odierna Lidda e Kiryat Ono, e alcuni pensano che coincida con la pianura di Ono dove i nemici di Neemia chiesero di incontrarlo. Sono stati proposti vari luoghi, fra cui Wadi esh-Shellal, la zona di Sarafand el-Kharab e Khirbet Hirsha, il cui nome può echeggiare quello antico; nessuno è stato confermato, e la mappa segna soltanto la zona generale intorno a Lidda."
  nl:
    - "Ge-Charasim, “dal der werkmeesters”, wordt tweemaal genoemd, eenmaal in een geslachtsregister en eenmaal in een lijst van woonplaatsen. Onder de geslachten van Juda gewon Seraja Joab, “den vader des dals der werkmeesters; want zij waren werkmeesters”: een aantekening dat een familie van ambachtslieden daar woonde en het dal zijn naam gaf. Na de ballingschap vestigden de mannen van Benjamin zich in een reeks steden die eindigt met “Lod, en Ono, in het dal der werkmeesters”, waar de King James Version de naam vertaalt en de Russische Synodale vertaling hem als Charasim laat staan. Het Hebreeuwse woord kan werkers in hout, steen of metaal aanduiden."
    - "Verder is er niets bekend. De nabijheid van Lydda en Ono plaatst het dal aan de rand van de kustvlakte, bij het moderne Lod en Kiryat Ono, en sommigen menen dat het hetzelfde is als de vlakte van Ono waar de vijanden van Nehemia met hem wilden samenkomen. Verscheidene plaatsen zijn voorgesteld, onder meer de Wadi esh-Shellal, de omgeving van Sarafand el-Kharab en Khirbet Hirsha, waarvan de naam de oude kan weerklinken; geen daarvan is bevestigd, en de kaart markeert alleen het algemene gebied rond Lydda."
  cs:
    - "Gé-charašim, „údolí řemeslníků“, je jmenováno dvakrát, jednou v rodokmenu a jednou v seznamu sídel. Mezi čeleděmi Judovými Serajáš zplodil Joába, „otce bydlících v údolí řemeslníků; nebo tam řemeslníci byli“: poznámka, že tam žila rodina řemeslníků a dala údolí jméno. Po exilu se muži Benjamínovi usadili v řadě měst končící slovy „V Lod, v Ono a v údolí řemeslníků“, kde Bible krále Jakuba jméno překládá a ruská synodální Bible je zachovává jako Charašim. Hebrejské slovo může znamenat dělníky ve dřevě, kameni nebo kovu."
    - "Nic dalšího není známo. Sousedství Lodu a Ona klade údolí na okraj pobřežní roviny, poblíž dnešního Lodu a Kirjat Ono, a někteří se domnívají, že jde o totéž místo jako pláň Onó, kde si Nehemjášovi nepřátelé žádali schůzku s ním. Navrženo bylo několik míst, mezi nimi Wádí esh-Shellal, oblast Sarafand el-Kharab a Chirbet Hirsha, jejíž jméno může ozvěnou připomínat staré; žádné nebylo potvrzeno a mapa označuje jen obecnou oblast kolem Lodu."
  sv:
    - "Ge-Harashim, ”hantverkarnas dal”, nämns två gånger, en gång i en släktlista och en gång i en förteckning över bosättningar. Bland Judas släkter födde Seraja ”Joab, fader till Timmermansdalens släkt, ty dessa voro timmermän”: en anmärkning att en släkt av hantverkare bodde där och gav dalen dess namn. Efter exilen bosatte sig benjaminiterna i en rad städer som slutar med ”Lod, Ono, och Timmermansdalen”, där King James-bibeln översätter namnet och den ryska synodalbibeln behåller det som Harashim. Det hebreiska ordet kan betyda arbetare i trä, sten eller metall."
    - "Mer är inte känt. Att Lod och Ono nämns tillsammans placerar dalen i kanten av kustslätten, nära dagens Lod och Kiryat Ono, och somliga menar att den är densamma som Onos slätt där Nehemjas fiender bad att få möta honom. Flera platser har föreslagits, bland dem Wadi esh-Shellal, trakten kring Sarafand el-Kharab och Khirbet Hirsha, vars namn kan eka det gamla; ingen har bekräftats, och kartan markerar bara den allmänna trakten kring Lod."
  nb:
    - "Ge-Harasjim, «håndverkernes dal», er nevnt to ganger, én gang i en slektsliste og én gang i en liste over bosteder. Blant Judas ætter fikk Seraja sønnen Joab, «som var far til ætten i Tømmermannsdalen; for de var tømmermenn»: en notis om at en slekt av håndverkere bodde der og ga dalen navn. Etter eksilet bosatte Benjamins menn seg i en rekke byer som ender med «Lod, Ono og Tømmermannsdalen», der King James-oversettelsen oversetter navnet og den russiske synodalbibelen beholder det som Harasjim. Det hebraiske ordet kan bety arbeidere i tre, stein eller metall."
    - "Mer er ikke kjent. Sammen med Lod og Ono plasserer den dalen i utkanten av kystsletten, nær dagens Lod og Kiryat Ono, og noen mener at den er den samme som Ono-sletten der Nehemjas fiender ba om å få møte ham. Flere steder er foreslått, blant dem Wadi esh-Shellal, området rundt Sarafand el-Kharab og Khirbet Hirsha, hvis navn kan ekkoe det gamle; ingen er bekreftet, og kartet markerer bare det generelle området rundt Lod."
  tl:
    - "Ang Geharasim, “libis ng mga manggagawa”, ay pinangalanan nang dalawang beses, minsan sa isang talaangkanan at minsan sa isang talaan ng mga pamayanan. Sa mga angkan ng Juda, “naging anak ni Seraiah si Joab, na ama ng Geharasim; sapagka't sila'y mga manggagawa”: isang tala na isang pamilya ng mga artesano ang nanirahan doon at nagbigay ng pangalan sa libis. Pagkatapos ng pagkatapon, nanirahan ang mga lalaki ng Benjamin sa isang hanay ng mga bayan na nagtatapos sa “Lod, at sa Ono, na libis ng mga manggagawa”, kung saan isinasalin ng King James Version ang pangalan at pinananatili ito ng Synodal na Ruso bilang Harashim. Ang salitang Hebreo ay maaaring mangahulugan ng mga manggagawa sa kahoy, bato o metal."
    - "Wala nang higit na nalalaman. Ang pagsasama sa Lod at Ono ay naglalagay sa libis sa gilid ng kapatagan sa baybayin, malapit sa makabagong Lod at Kiryat Ono, at iniisip ng ilan na ito rin ang kapatagan ng Ono kung saan hiniling ng mga kaaway ni Nehemias na makipagkita sa kaniya. Ilang lugar ang iminungkahi, kabilang ang Wadi esh-Shellal, ang lugar ng Sarafand el-Kharab at ang Khirbet Hirsha, na ang pangalan ay maaaring umalingawngaw sa luma; walang nakumpirma, at ang mapa ay nagmamarka lamang ng pangkalahatang lugar sa palibot ng Lod."
  da:
    - "Ge-Harasjim, »håndværkernes dal«, nævnes to gange, én gang i et slægtsregister og én gang i en liste over bosættelser. Blandt Judas slægter avlede Seraja Joab, »en Fader til dem i Tømmermandsdalen; thi de vare Tømmermænd«: en note om, at en slægt af håndværkere boede der og gav dalen dens navn. Efter eksilet bosatte Benjamins mænd sig i en række byer, der ender med »Lod og Ono i Tømmermandsdalen«, hvor King James-oversættelsen oversætter navnet, og den russiske synodalbibel bevarer det som Harasjim. Det hebraiske ord kan betyde arbejdere i træ, sten eller metal."
    - "Mere vides ikke. At Lydda og Ono nævnes sammen med dalen, placerer den i udkanten af kystsletten, nær nutidens Lydda og Kiryat Ono, og nogle mener, at den er den samme som Ono-sletten, hvor Nehemias' fjender bad om at møde ham. Flere steder er foreslået, blandt dem Wadi esh-Shellal, området ved Sarafand el-Kharab og Khirbet Hirsha, hvis navn kan ligne det gamle; ingen er bekræftet, og kortet markerer kun det almene område omkring Lydda."
  sr:
    - "Долина дрводеља (хебрејски Ге-Харашим), „долина занатлија“, именована је двапут, једном у родослову и једном у списку насеља. Међу Јудиним родовима Сераја је родио Јоава, „оца оних што живе у долини дрводељској, јер беху дрводеље“: белешка да је ту живео род занатлија који је долини дао име. После изгнанства Венијаминови људи населили су низ градова који завршава са „у Лоду, у Онону, и у долини дрводељској“, где превод краља Џејмса преводи име, а руски синодски превод га чува као Харашим. Хебрејска реч може значити радника у дрвету, камену или металу."
    - "Више се не зна. Суседство Лиде и Она ставља долину на руб приобалне равнице, близу савремене Лиде и Кирјат Она, а неки мисле да је иста са ононским пољем у коме су Немијини непријатељи тражили да се са њим састану. Предложено је неколико места, међу њима Вади еш-Шелал, подручје Сарафанд ел-Хараба и Хирбет Хирша, чије име може одјекивати старо; ни једно није потврђено, а карта означава само опште подручје око Лиде."
scripture:
  - 1Chr.4.14
  - Neh.11.31-Neh.11.35
  - Neh.6.2
sources:
