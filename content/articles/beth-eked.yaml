body:
  en:
    - "Beth-eked, in full Beth-eked of the shepherds, was a place on the road from Jezreel to Samaria, the scene of one of the killings of Jehu's coup. The King James Version translates the name, “the shearing house”; the Synodal Bible keeps it, “Beth-eked of the shepherds”. After slaughtering the house of Ahab at Jezreel, Jehu “arose and departed, and came to Samaria. And as he was at the shearing house in the way, Jehu met with the brethren of Ahaziah king of Judah”, who were going down to greet the royal family, knowing nothing of what had happened. “And he said, Take them alive. And they took them alive, and slew them at the pit of the shearing house, even two and forty men; neither left he any of them.” The Chronicler tells the same deed without the place."
    - "Nothing else is recorded. Eusebius knew a village Bethacath in the great plain, fifteen Roman miles from Legio, the camp at Megiddo, and Beit Qad, a village about 6 km east of Jenin at the edge of the Jezreel valley, keeps something of the name and fits the road; Kafr Ra'i, in the hills to the south-west, has also been proposed. Neither has been excavated, and the cistern of the story has not been found."
  ru:
    - "Беф-Екед, полностью Беф-Екед пастушеский, — место на дороге из Изрееля в Самарию, где совершилось одно из убийств переворота Ииуя. Английская Библия короля Иакова переводит имя — «дом стрижки»; Синодальный перевод сохраняет его. Перебив дом Ахава в Изрееле, Ииуй «встал, и пошел, и пришел в Самарию. Находясь на пути при Беф-Екеде пастушеском, встретил Ииуй братьев Охозии, царя Иудейского», которые шли приветствовать царскую семью, ничего не зная о случившемся. «И сказал он: возьмите их живых. И взяли их живых, и закололи их», сорок два человека, «при колодезе Беф-Екеда, и не осталось из них ни одного». Паралипоменон рассказывает о том же без названия места."
    - "Больше ничего не записано. Евсевий знал селение Бетакаф на Великой равнине, в пятнадцати римских милях от Легиона, лагеря у Мегиддо, и Бейт-Кад, деревня примерно в 6 км к востоку от Дженина на краю Изреельской долины, хранит что-то от имени и подходит к дороге; предлагали также Кафр-Раи в холмах к юго-западу. Ни то, ни другое не копали, и колодца из рассказа не нашли."
  uk:
    - "Бет-Екед, у повній формі Бет-Екед пастухів, було місцем на дорозі від Їзреелю до Самарії, сценою одного з убивств Єгуїного перевороту. Біблія короля Якова перекладає назву: «дім стрижки»; Синодальний переклад її зберігає: «Бет-Екед пастухів». Перебивши дім Ахава в Їзреелі, Єгу «рушив він і пійшов у Самарию. По дорозї коло Бет-Екеда пастушого Наткнувсь Егуй на братів Охозії, царя Юдиного», які йшли вітати царську родину, нічого не знаючи про те, що сталося. «І повелїв: спіймайте їх живцем. І спіймали їх живцем та й повбивали — сорок і два чоловіка при колодязї Бет-Екеда, й не зісталось із них нї одного». Хронікар розповідає той самий вчинок без місця."
    - "Більше нічого не записано. Євсевій знав село Бетакат у великій рівнині, за п'ятнадцять римських миль від Легіону, табору при Мегіддо, а Бейт-Кад, село приблизно за 6 км на схід від Дженіна на краю Їзреельської долини, зберігає дещо з назви й пасує дорозі; пропонували також Кафр-Раї в пагорбах на південний захід. Жодне не розкопували, і цистерну з оповіді не знайдено."
  es:
    - "Bet-eked, en su forma completa Bet-eked de los pastores, era un lugar en el camino de Jezreel a Samaria, escenario de una de las matanzas del golpe de Jehú. La versión del rey Jacobo traduce el nombre, «la casa de esquileo»; la Biblia sinodal lo conserva, «Bet-eked de los pastores». Tras exterminar a la casa de Acab en Jezreel, Jehú «levantóse de allí, y vino á Samaria; y llegando él en el camino á una casa de esquileo de pastores» halló a los hermanos de Ocozías, rey de Judá, que bajaban a saludar a la familia real, sin saber nada de lo ocurrido. «Prendedlos vivos. Y después que los tomaron vivos, degolláronlos junto al pozo de la casa de esquileo, cuarenta y dos varones, sin dejar ninguno de ellos.» El Cronista cuenta el mismo hecho sin el lugar."
    - "Nada más se registra. Eusebio conocía una aldea Bethacath en la gran llanura, a quince millas romanas de Legio, el campamento de Meguido, y Beit Qad, una aldea a unos 6 km al este de Yenín, en el borde del valle de Jezreel, conserva algo del nombre y encaja con el camino; también se ha propuesto Kafr Ra'i, en las colinas al sudoeste. Ninguno ha sido excavado, y la cisterna del relato no ha sido hallada."
  pt:
    - "Bete-Equede, por inteiro Bete-Equede dos pastores, era um lugar na estrada de Jezreel a Samaria, cenário de um dos assassinatos do golpe de Jeú. A King James Version traduz o nome, “a casa de tosquia”; a Bíblia sinodal o conserva, “Bete-Equede dos pastores”. Depois de massacrar a casa de Acabe em Jezreel, Jeú “se levantou e partiu, e foi para Samaria. Estando ele na casa de tosquia dos pastores no caminho, Jeú encontrou-se com os irmãos de Acazias, rei de Judá”, que desciam para saudar a família real, sem saber o que acontecera. “Peguem-nos vivos! Eles os pegaram vivos, e os mataram junto ao poço da casa de tosquia, quarenta e dois homens. Ele não deixou nenhum deles.” O Cronista conta o mesmo feito sem o lugar."
    - "Nada mais é registrado. Eusébio conheceu uma aldeia Bethacath na grande planície, a quinze milhas romanas de Legio, o acampamento em Megido, e Beit Qad, uma aldeia a cerca de 6 km a leste de Jenin, na borda do vale de Jezreel, guarda algo do nome e combina com a estrada; Kafr Ra'i, nas colinas a sudoeste, também foi proposta. Nenhuma foi escavada, e a cisterna da história não foi achada."
  de:
    - "Bet-Eked, vollständig Bet-Eked der Hirten, war ein Ort an der Straße von Jesreel nach Samaria, Schauplatz einer der Tötungen bei Jehus Umsturz. Die King-James-Bibel übersetzt den Namen, „the shearing house“; die Synodalbibel behält ihn, „Bet-Eked der Hirten“. Nachdem Jehu in Jesreel das Haus Ahabs erschlagen hatte, „machte er sich auf, zog hin und kam gen Samaria. Unterwegs aber war ein Hirtenhaus. Da traf Jehu an die Brüder Ahasjas, des Königs Juda's“, die hinabzogen, um die königliche Familie zu grüßen, und nichts von dem Geschehenen wussten. „Greifet sie lebendig! Und sie griffen sie lebendig und schlachteten sie bei dem Brunnen am Hirtenhaus, zweiundvierzig Mann, und ließen nicht einen von ihnen übrig.“ Der Chronist erzählt dieselbe Tat ohne den Ort."
    - "Sonst ist nichts verzeichnet. Eusebius kannte ein Dorf Bethacath in der großen Ebene, fünfzehn römische Meilen von Legio, dem Lager bei Megiddo, und Beit Qad, ein Dorf etwa 6 km östlich von Dschenin am Rand des Jesreeltals, bewahrt etwas vom Namen und passt zur Straße; Kafr Ra'i in den Bergen im Südwesten wurde auch vorgeschlagen. Keines wurde ausgegraben, und die Zisterne der Erzählung wurde nicht gefunden."
  fr:
    - "Beth-Éked, en entier Beth-Éked des bergers, était un lieu sur la route de Jizreel à Samarie, scène d’un des meurtres du coup d’État de Jéhu. La King James Version traduit le nom, « the shearing house » ; la Bible synodale le garde, « Beth-Éked des bergers ». Après avoir massacré la maison d’Achab à Jizreel, Jéhu « se leva, et partit pour aller à Samarie. Arrivé à une maison de réunion des bergers, sur le chemin, Jéhu trouva les frères d’Achazia, roi de Juda », qui descendaient saluer la famille royale, ignorant ce qui s’était passé. « Jéhu dit : Saisissez-les vivants. Et ils les saisirent vivants, et les égorgèrent au nombre de quarante-deux, à la citerne de la maison de réunion ; Jéhu n’en laissa échapper aucun. » Le Chroniste raconte le même acte sans le lieu."
    - "Rien d’autre n’est consigné. Eusèbe connaissait un village Bethacath dans la grande plaine, à quinze milles romains de Legio, le camp de Meguiddo, et Beit Qad, village à environ 6 km à l’est de Jénine, au bord de la vallée de Jizreel, garde quelque chose du nom et s’accorde avec la route ; Kafr Ra’i, dans les collines au sud-ouest, a aussi été proposé. Aucun n’a été fouillé, et la citerne du récit n’a pas été retrouvée."
  it:
    - "Bet-Eked, per intero Bet-Eked dei pastori, era un luogo sulla strada da Izreel a Samaria, scena di una delle uccisioni del colpo di stato di Ieu. La King James Version traduce il nome, «the shearing house»; la Bibbia sinodale lo conserva, «Beth-eked dei pastori». Dopo aver massacrato la casa di Acab a Izreel, Ieu «si levò, e partì per andare a Samaria. Cammin facendo, giunto che fu alla casa di ritrovo dei pastori, Jehu s’imbatté nei fratelli di Achazia, re di Giuda», che scendevano a salutare la famiglia reale, ignari di ciò che era accaduto. «Jehu disse ai suoi: “Pigliateli vivi!” E quelli li presero vivi e li scannarono presso la cisterna della casa di ritrovo. Erano quarantadue, e non ne scampò uno». Il Cronista racconta lo stesso fatto senza il luogo."
    - "Nient’altro è registrato. Eusebio conosceva un villaggio Bethacath nella grande pianura, a quindici miglia romane da Legio, il campo di Meghiddo, e Beit Qad, un villaggio a circa 6 km a est di Jenin al margine della valle di Izreel, conserva qualcosa del nome e si accorda con la strada; è stata proposta anche Kafr Ra‘i, sulle colline a sud-ovest. Nessuno è stato scavato, e la cisterna del racconto non è stata trovata."
  pl:
    - "Bet-Eked, w pełnym brzmieniu Bet-Eked pasterzy, było miejscem przy drodze z Jizreel do Samarii, sceną jednego z zabójstw w przewrocie Jehu. Biblia króla Jakuba tłumaczy nazwę, „dom strzyżenia”; Biblia synodalna ją zachowuje, „Bet-Eked pasterzy”. Po wymordowaniu domu Achaba w Jizreel Jehu, jak czytamy, „wstawszy odszedł, i pojechał do Samaryi”, a w domu, „gdzie pasterze strzygali owce na drodze”, spotkał „braci Ochozyjasza króla Judzkiego”, którzy szli pozdrowić rodzinę królewską, nic nie wiedząc o tym, co się stało. „Tedy rzekł: Pojmajcie je żywo. I pojmali je żywo, i pobili je u studni onegoż domu, gdzie strzygano owce, czterdziestu i dwóch mężów, i nie zostawił żadnego z nich”. Kronikarz opowiada ten sam czyn bez miejsca."
    - "Nic więcej nie zapisano. Euzebiusz znał wieś Bethacath na wielkiej równinie, piętnaście mil rzymskich od Legio, obozu przy Megiddo, a Beit Qad, wieś około 6 km na wschód od Dżeninu na skraju doliny Jizreel, zachowuje coś z nazwy i pasuje do drogi; proponowano też Kafr Ra'i na wzgórzach na południowy zachód. Żadne nie było wykopywane, a cysterny z opowieści nie odnaleziono."
  nl:
    - "Beth-Eked, voluit Beth-Eked der herders, was een plaats aan de weg van Jizreël naar Samaria, het toneel van een van de moorden van Jehu’s staatsgreep. De King James Version vertaalt de naam, “het scheerhuis”; de Synodale Bijbel behoudt hem, “Beth-Eked der herders”. Nadat hij het huis van Achab te Jizreël had uitgeroeid, ging Jehu verder: “En hij maakte zich op, en toog heen en ging naar Samaria; en zijnde te Beth-Heked der herderen, op den weg, vond Jehu de broederen van Ahazia, den koning van Juda”, die de koninklijke familie wilden groeten zonder te weten wat er was gebeurd. “Toen zeide hij: Grijpt hen levend. En zij grepen hen levend; en zij sloegen hen bij den bornput van Beth-Heked, twee en veertig mannen, en hij liet niet een van hen over.” De Kroniekschrijver vertelt dezelfde daad zonder de plaats."
    - "Verder is niets overgeleverd. Eusebius kende een dorp Bethacath in de grote vlakte, vijftien Romeinse mijlen van Legio, het kamp bij Megiddo, en Beit Qad, een dorp zo’n 6 km ten oosten van Jenin aan de rand van de vallei van Jizreël, bewaart iets van de naam en past bij de weg; Kafr Ra’i, in de heuvels ten zuidwesten, is ook voorgesteld. Geen van beide is opgegraven, en de put uit het verhaal is niet gevonden."
  cs:
    - "Bét-eked, plným jménem Bét-eked pastýřů, bylo místo na cestě z Jizreelu do Samaří, dějiště jedné z vražd Jehúova převratu. Bible krále Jakuba překládá jméno „the shearing house“; synodální Bible je zachovává, „Bét-eked pastýřů“. Poté, co Jehú v Jizreelu pobil dům Achabův, „vstav, odebral se a jel do Samaří, a již byl v Betekedu pastýřů na cestě“. „I nalezl tam Jéhu bratří Ochoziáše, krále Judského“, kteří šli pozdravit královskou rodinu, aniž věděli, co se stalo. „Tedy řekl: Zjímejte je živé. I zjímali je živé, a pobili je u čisterny v Betekedu, čtyřidceti a dva muže, a nezůstal z nich žádný.“ Kronikář vypráví tentýž čin bez místa."
    - "Nic jiného není zaznamenáno. Eusebios znal vesnici Bethacath ve velké pláni, patnáct římských mil od Legia, tábora u Megida, a Bejt Qad, vesnice asi 6 km východně od Džanínu na okraji Jizreelského údolí, uchovává něco z jména a odpovídá cestě; navržen byl též Kafr Ra'i v pahorcích na jihozápadě. Žádné z nich nebylo vykopáno a cisterna z příběhu nebyla nalezena."
  sv:
    - "Bet-Eked, fullständigt Bet-Eked-Haroim, ”Bet-Eked av herdarna”, var en plats på vägen från Jisreel till Samaria, scenen för en av dråpen i Jehus statskupp. King James-översättningen översätter namnet, ”the shearing house”; synodalbibeln behåller det, ”Bet-Eked av herdarna”. Sedan han hade dräpt Achavs hus i Jisreel, ”stod han upp och begav sig åstad till Samaria; men under vägen, när Jehu kom till Bet-Eked-Haroim, träffade han på Ahasjas, Juda konungs, bröder”, som var på väg ned för att hälsa kungafamiljen och inte visste något om vad som hade hänt. ”Han sade: ’Gripen dem levande.’ Då grepo de dem levande och slaktade dem och kastade dem i Bet-Ekeds brunn, alla fyrtiotvå; han lät ingen av dem bliva kvar.” Krönikeförfattaren berättar samma gärning utan platsen."
    - "Ingenting annat är nedtecknat. Eusebios kände en by Bethacath på den stora slätten, femton romerska mil från Legio, lägret vid Megiddo, och Beit Qad, en by omkring 6 km öster om Jenin vid Jisreeldalens kant, bevarar något av namnet och passar vägen; Kafr Ra'i, i bergen i sydväst, har också föreslagits. Ingen har grävts ut, och cisternen i berättelsen har inte hittats."
  nb:
    - "Bet-Eked, fullt navn Bet-Eked for gjeterne, var et sted ved veien fra Jisreel til Samaria, åstedet for et av drapene i Jehus kupp. King James-oversettelsen oversetter navnet, «the shearing house»; synodalbibelen beholder det, «Bet-Eked for gjeterne». Etter å ha slaktet Akabs hus i Jisreel «gjorde Jehu sig rede og drog avsted til Samaria. Og da han underveis kom til Bet-Eked-Haro'im, møtte han Judas konge Akasjas brødre», som var på vei ned for å hilse på kongefamilien og ikke visste noe om det som hadde skjedd. «Grip dem levende! Så grep de dem levende og drepte dem ved brønnen i Bet-Eked, to og firti i tallet; han lot ikke en av dem bli i live.» Krønikeskriveren forteller den samme gjerningen uten stedet."
    - "Ingenting annet er oppgitt. Eusebius kjente en landsby Bethacath i den store sletten, femten romerske mil fra Legio, leiren ved Megiddo, og Beit Qad, en landsby omtrent 6 km øst for Jenin i kanten av Jisreel-dalen, bevarer noe av navnet og passer med veien; Kafr Ra'i, i åsene mot sørvest, er også foreslått. Ingen er gravd ut, og sisternen i fortellingen er ikke funnet."
  tl:
    - "Ang Beth-eked, buong Beth-eked ng mga pastol, ay lugar sa daan mula Jezreel patungong Samaria, tagpo ng isa sa mga pagpatay sa kudeta ni Jehu. Isinasalin ng King James Version ang pangalan, “the shearing house”; pinananatili ito ng Sinodal na Biblia, “Beth-eked ng mga pastol”. Matapos patayin ang sambahayan ni Achab sa Jezreel, si Jehu ay “nagtindig at yumaon, at naparoon sa Samaria. At samantalang siya'y nasa pagupitang-bahay ng mga pastor sa daan, ay nasalubong ni Jehu ang mga kapatid ni Ochozias na hari sa Juda”, na bumababa upang bumati sa maharlikang pamilya, walang alam sa nangyari. “Hulihin ninyo silang buhay. At hinuli nila silang buhay, at pinatay sa hukay ng pagupitang-bahay, sa makatuwid baga'y apat na pu't dalawang lalake; hindi nagiwan ng sinoman sa kanila.” Isinasalaysay ng may-akda ng Mga Cronica ang parehong gawa nang walang lugar."
    - "Wala nang ibang itinatala. Kilala ni Eusebio ang nayong Bethacath sa malaking kapatagan, labinlimang milyang Romano mula sa Legio, ang kampo sa Megiddo, at ang Beit Qad, nayong mga 6 km sa silangan ng Jenin sa gilid ng libis ng Jezreel, ay nagpapanatili ng bahagi ng pangalan at angkop sa daan; iminungkahi rin ang Kafr Ra'i, sa mga burol sa timog-kanluran. Wala sa dalawa ang nahukay, at hindi pa natatagpuan ang hukay ng kuwento."
  da:
    - "Bet-Eked, fuldt Hyrdernes Bet-Eked, var et sted på vejen fra Jizre'el til Samaria, skueplads for et af drabene i Jehus kup. King James Version oversætter navnet, »the shearing house«; synodalbibelen bevarer det, »Bet-Eked hos hyrderne«. Efter at Jehu havde slagtet Akabs hus i Jizre'el, hedder det: »Og han gjorde sig rede og drog hen og kom til Samaria. Og der han var ved Hyrdernes Beth-Eked paa Vejen, da traf Jehu paa Ahasias, Judas Konges, Brødre«, som var på vej ned for at hilse på kongefamilien uden at vide noget om, hvad der var sket. »Griber dem levende, og de grebe dem levende; og de slagtede dem ved Grøften ved Beth-Eked, to og fyrretyve Mænd, og man lod ikke een Mand blive tilovers af dem.« Krønikeskriveren fortæller den samme gerning uden stedet."
    - "Intet andet er optegnet. Eusebius kendte en landsby Bethacath i den store slette, femten romerske mil fra Legio, lejren ved Megiddo, og Beit Qad, en landsby omkring 6 km øst for Jenin ved kanten af Jizre'el-dalen, bevarer noget af navnet og passer til vejen; Kafr Ra'i, i bjergene mod sydvest, er også foreslået. Ingen af dem er udgravet, og fortællingens cisterne er ikke fundet."
  sr:
    - "Вет-Екед, у пуном облику Вет-Екед пастирски, био је место на путу од Језраела до Самарије, поприште једног од убистава Јујевог преврата. Библија краља Џејмса преводи име, „кућа стрижбе“; синодална Библија га чува, „Вет-Екед пастирски“. Пошто је поклао дом Ахавов у Језраелу, Јуј је кренуо: „Потом се подиже и пође да иде у Самарију; и кад беше код колибе пастирске на путу, нађе Јуј браћу Охозије цара Јудиног“, који су ишли да поздраве краљевску породицу, не знајући ништа о томе што се догодило. „Тада рече: Похватајте их живе. И похваташе их живе и поклаше их на студенцу код колибе пастирске, њих четрдесет, и не остави ниједног од њих.“ Летописац прича исто дело без места."
    - "Ништа друго није забележено. Јевсевије је знао село Ветакат у великој равници, петнаест римских миља од Легиона, логора код Мегида, а Бејт Кад, село око 6 км источно од Џенина на ободу Језраелске долине, чува нешто од имена и одговара путу; предлаган је и Кафр Раи, у брдима на југозападу. Ниједан није ископаван, а студенац из приче није нађен."
scripture:
  - 2Kgs.10.11-2Kgs.10.14
  - 2Chr.22.8
sources:
