# Overview article (ADR 0007). Mainstream facts only; a mountain region of southern Asia Minor that Paul crossed; mainstream facts only.
id: pisidia
place: a55aded
title:
  en: "Pisidia"
  ru: "Писидия"
  uk: "Пісідія"
  es: "Pisidia"
  pt: "Pisídia"
  de: "Pisidien"
  fr: "Pisidie"
body:
  en:
    - "Pisidia was the mountain country of the western Taurus in southern Asia Minor, north of the coastal plain of Pamphylia and south of Phrygia, around the lakes of today's Isparta and Burdur. Its people were known as fierce highlanders who kept their freedom against the Persians and gave trouble to every ruler after them. Augustus pacified the region after 25 BC, made it part of the province of Galatia, founded veteran colonies and built the Via Sebaste through it; cities such as Sagalassos flourished under Rome."
    - "Acts mentions it twice. On the first journey Paul and Barnabas went up from Perga and “came to Antioch in Pisidia, and went into the synagogue on the sabbath day”, the Roman colony on the region's northern edge, which has its own article; on the way back, “after they had passed throughout Pisidia, they came to Pamphylia”. The road through its passes was hard and the country lawless, which some see behind Paul's “perils of robbers”. Pisidia is today part of south-western Turkey, and the excavated city of Sagalassos is among its best-known sites."
  ru:
    - "Писидия — горная страна западного Тавра на юге Малой Азии, к северу от прибрежной равнины Памфилии и к югу от Фригии, вокруг озёр нынешних Испарты и Бурдура. Её жители слыли свирепыми горцами, сохранявшими свободу от персов и досаждавшими всем позднейшим правителям. Август усмирил край после 25 г. до н. э., включил его в провинцию Галатия, основал колонии ветеранов и провёл через него Августову дорогу; такие города, как Сагалас, процветали при Риме."
    - "Деяния упоминают её дважды. В первом путешествии Павел и Варнава, проходя от Пергии, «прибыли в Антиохию Писидийскую и, войдя в синагогу в день субботний, сели» — римскую колонию на северном краю области, о которой есть отдельная статья; на обратном пути, «пройдя через Писидию, пришли в Памфилию». Дорога через её перевалы была трудной, а край беззаконным, и некоторые видят в этом фон для слов Павла об «опасностях от разбойников». Сегодня Писидия — часть юго-запада Турции, и раскопанный Сагалас — одно из самых известных её мест."
  uk:
    - "Пісідія — гірський край західного Тавру на півдні Малої Азії, на північ від прибережної рівнини Памфілії та на південь від Фрігії, довкола озер нинішніх Ісперти й Бурдура. Її народ був відомий як запеклі горяни, що зберегли свободу проти персів і завдавали клопоту кожному наступному володареві. Август упокорив край після 25 р. до н. е., зробив його частиною провінції Галатія, заснував ветеранські колонії й проклав через нього Віа Себасте; такі міста, як Сагалассос, розквітали під владою Риму."
    - "Діяння згадують її двічі. У першій подорожі Павло й Варнава піднялися з Перге й «прибули в Антиохию Писидийську, і ввійшовши в школу субітнього дня» — це римська колонія на північному краї області, про яку є окрема стаття; дорогою назад, «перейшовши Писидию, прийшли в Памфилию». Дорога через її перевали була тяжка, а край беззаконний, і дехто вбачає за цим слова Павла про небезпеки: «у бідах (од) розбійників». Сьогодні Пісідія — частина південно-західної Туреччини, а розкопане місто Сагалассос належить до її найвідоміших пам’яток."
  es:
    - "Pisidia era la región montañosa del Tauro occidental, en el sur de Asia Menor, al norte de la llanura costera de Panfilia y al sur de Frigia, en torno a los lagos de las actuales Isparta y Burdur. Su pueblo era conocido como feroces montañeses que conservaron su libertad frente a los persas y dieron problemas a todos los gobernantes posteriores. Augusto pacificó la región después de 25 a. C., la incorporó a la provincia de Galacia, fundó colonias de veteranos y construyó a través de ella la Vía Sebaste; ciudades como Sagalasos florecieron bajo Roma."
    - "Los Hechos la mencionan dos veces. En el primer viaje Pablo y Bernabé subieron desde Perge y «llegaron á Antioquía de Pisidia, y entrando en la sinagoga un día de sábado», la colonia romana en el borde norte de la región, que tiene su propio artículo; a la vuelta, «pasando por Pisidia vinieron á Pamphylia». El camino por sus pasos era duro y el país sin ley, lo que algunos ven detrás de los «peligros de ladrones» de Pablo. Pisidia forma hoy parte del suroeste de Turquía, y la ciudad excavada de Sagalasos está entre sus lugares más conocidos."
  pt:
    - "A Pisídia era o país montanhoso do Tauro ocidental, no sul da Ásia Menor, ao norte da planície costeira da Panfília e ao sul da Frígia, em torno dos lagos das atuais Isparta e Burdur. Seu povo era conhecido como montanheses ferozes que guardaram a liberdade contra os persas e deram trabalho a todo governante depois deles. Augusto pacificou a região depois de 25 a.C., fez dela parte da província da Galácia, fundou colônias de veteranos e construiu por ela a Via Sebaste; cidades como Sagalasso floresceram sob Roma."
    - "Atos a menciona duas vezes. Na primeira viagem, Paulo e Barnabé subiram de Perge e “chegaram a Antioquia da Pisídia. Eles entraram na sinagoga no dia de sábado”, a colônia romana na orla norte da região, que tem artigo próprio; na volta, “passaram pela Pisídia e chegaram à Panfília”. A estrada por seus desfiladeiros era dura e o país sem lei, o que alguns veem por trás dos “perigos de salteadores” de Paulo. A Pisídia é hoje parte do sudoeste da Turquia, e a cidade escavada de Sagalasso está entre os seus sítios mais conhecidos."
  de:
    - "Pisidien war das Bergland des westlichen Taurus im Süden Kleinasiens, nördlich der Küstenebene Pamphyliens und südlich von Phrygien, um die Seen des heutigen Isparta und Burdur. Seine Bewohner galten als wilde Hochländer, die ihre Freiheit gegen die Perser behaupteten und jedem späteren Herrscher zu schaffen machten. Augustus befriedete die Region nach 25 v. Chr., schlug sie zur Provinz Galatien, gründete Veteranenkolonien und baute die Via Sebaste hindurch; Städte wie Sagalassos blühten unter Rom."
    - "Die Apostelgeschichte erwähnt es zweimal. Auf der ersten Reise gingen Paulus und Barnabas von Perge hinauf und „kamen gen Antiochien im Lande Pisidien und gingen in die Schule am Sabbattage“, in die römische Kolonie am Nordrand der Region, die einen eigenen Artikel hat; auf dem Rückweg heißt es: „Und zogen durch Pisidien und kamen nach Pamphylien“. Der Weg durch die Pässe war hart und das Land gesetzlos, was manche hinter Paulus' „Gefahr durch die Mörder“ sehen. Pisidien gehört heute zum Südwesten der Türkei, und die ausgegrabene Stadt Sagalassos ist eine seiner bekanntesten Stätten."
  fr:
    - "La Pisidie était le pays montagneux du Taurus occidental, dans le sud de l’Asie Mineure, au nord de la plaine côtière de Pamphylie et au sud de la Phrygie, autour des lacs de l’actuelle Isparta et de Burdur. Ses habitants passaient pour de farouches montagnards qui gardèrent leur liberté contre les Perses et donnèrent du fil à retordre à tous les maîtres suivants. Auguste pacifia la région après 25 av. J.-C., l’intégra à la province de Galatie, fonda des colonies de vétérans et y construisit la Via Sebaste ; des villes comme Sagalassos prospérèrent sous Rome."
    - "Les Actes la mentionnent deux fois. Lors du premier voyage, Paul et Barnabas montèrent de Perge et « arrivèrent à Antioche de Pisidie. Étant entrés dans la synagogue le jour du sabbat », colonie romaine au bord nord de la région, qui a son propre article ; au retour, « traversant ensuite la Pisidie, ils vinrent en Pamphylie ». La route par ses cols était dure et le pays sans loi, ce que certains voient derrière les « périls de la part des brigands » de Paul. La Pisidie fait aujourd’hui partie du sud-ouest de la Turquie, et la ville fouillée de Sagalassos compte parmi ses sites les plus connus."
