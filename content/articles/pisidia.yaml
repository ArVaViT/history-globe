body:
  en:
    - "Pisidia was the mountain country of the western Taurus in southern Asia Minor, north of the coastal plain of Pamphylia and south of Phrygia, around the lakes of today's Isparta and Burdur. Its people were known as fierce highlanders who kept their freedom against the Persians and gave trouble to every ruler after them. Augustus pacified the region after 25 BC, made it part of the province of Galatia, founded veteran colonies and built the Via Sebaste through it; cities such as Sagalassos flourished under Rome."
    - "Acts mentions it twice. On the first journey Paul and Barnabas went up from Perga and “came to Antioch in Pisidia, and went into the synagogue on the sabbath day”, the Roman colony on the region's northern edge, which has its own article; on the way back, “after they had passed throughout Pisidia, they came to Pamphylia”. The road through its passes was hard and the country lawless, which some see behind Paul's “perils of robbers”. Pisidia is today part of south-western Turkey, and the excavated city of Sagalassos is among its best-known sites."
  ru:
    - "Писидия — горная страна западного Тавра на юге Малой Азии, к северу от прибрежной равнины Памфилии и к югу от Фригии, вокруг озёр нынешних Испарты и Бурдура. Её жители слыли свирепыми горцами, сохранявшими свободу от персов и досаждавшими всем позднейшим правителям. Август усмирил край после 25 г. до н. э., включил его в провинцию Галатия, основал колонии ветеранов и провёл через него Августову дорогу; такие города, как Сагалас, процветали при Риме."
    - "Деяния упоминают её дважды. В первом путешествии Павел и Варнава, проходя от Пергии, «прибыли в Антиохию Писидийскую и, войдя в синагогу в день субботний, сели» — римскую колонию на северном краю области, о которой есть отдельная статья; на обратном пути, «пройдя через Писидию, пришли в Памфилию». Дорога через её перевалы была трудной, а край беззаконным, и некоторые видят в этом фон для слов Павла об «опасностях от разбойников». Сегодня Писидия — часть юго-запада Турции, и раскопанный Сагалас — одно из самых известных её мест."
  uk:
    - "Пісідія — гірський край західного Тавру на півдні Малої Азії, на північ від прибережної рівнини Памфілії та на південь від Фрігії, довкола озер нинішніх Ісперти й Бурдура. Її народ був відомий як запеклі горяни, що зберегли свободу проти персів і завдавали клопоту кожному наступному володареві. Август упокорив край після 25 р. до н. е., зробив його частиною провінції Галатія, заснував ветеранські колонії й проклав через нього Віа Себасте; такі міста, як Сагалассос, розквітали під владою Риму."
    - "Діяння згадують її двічі. У першій подорожі Павло й Варнава піднялися з Перге й «прибули в Антиохию Писидийську, і ввійшовши в школу субітнього дня» — це римська колонія на північному краї області, про яку є окрема стаття; дорогою назад, «перейшовши Писидию, прийшли в Памфилию». Дорога через її перевали була тяжка, а край беззаконний, і дехто вбачає за цим слова Павла про небезпеки: «у бідах (од) розбійників». Сьогодні Пісідія — частина південно-західної Туреччини, а розкопане місто Сагалассос належить до її найвідоміших пам’яток."
  es:
    - "Pisidia era la región montañosa del Tauro occidental, en el sur de Asia Menor, al norte de la llanura costera de Panfilia y al sur de Frigia, en torno a los lagos de las actuales Isparta y Burdur. Su pueblo era conocido como feroces montañeses que conservaron su libertad frente a los persas y dieron problemas a todos los gobernantes posteriores. Augusto pacificó la región después de 25 a. C., la incorporó a la provincia de Galacia, fundó colonias de veteranos y construyó a través de ella la Vía Sebaste; ciudades como Sagalasos florecieron bajo Roma."
    - "Los Hechos la mencionan dos veces. En el primer viaje Pablo y Bernabé subieron desde Perge y «llegaron á Antioquía de Pisidia, y entrando en la sinagoga un día de sábado», la colonia romana en el borde norte de la región, que tiene su propio artículo; a la vuelta, «pasando por Pisidia vinieron á Pamphylia». El camino por sus pasos era duro y el país sin ley, lo que algunos ven detrás de los «peligros de ladrones» de Pablo. Pisidia forma hoy parte del suroeste de Turquía, y la ciudad excavada de Sagalasos está entre sus lugares más conocidos."
  pt:
    - "A Pisídia era o país montanhoso do Tauro ocidental, no sul da Ásia Menor, ao norte da planície costeira da Panfília e ao sul da Frígia, em torno dos lagos das atuais Isparta e Burdur. Seu povo era conhecido como montanheses ferozes que guardaram a liberdade contra os persas e deram trabalho a todo governante depois deles. Augusto pacificou a região depois de 25 a.C., fez dela parte da província da Galácia, fundou colônias de veteranos e construiu por ela a Via Sebaste; cidades como Sagalasso floresceram sob Roma."
    - "Atos a menciona duas vezes. Na primeira viagem, Paulo e Barnabé subiram de Perge e “chegaram a Antioquia da Pisídia. Eles entraram na sinagoga no dia de sábado”, a colônia romana na orla norte da região, que tem artigo próprio; na volta, “passaram pela Pisídia e chegaram à Panfília”. A estrada por seus desfiladeiros era dura e o país sem lei, o que alguns veem por trás dos “perigos de salteadores” de Paulo. A Pisídia é hoje parte do sudoeste da Turquia, e a cidade escavada de Sagalasso está entre os seus sítios mais conhecidos."
  de:
    - "Pisidien war das Bergland des westlichen Taurus im Süden Kleinasiens, nördlich der Küstenebene Pamphyliens und südlich von Phrygien, um die Seen des heutigen Isparta und Burdur. Seine Bewohner galten als wilde Hochländer, die ihre Freiheit gegen die Perser behaupteten und jedem späteren Herrscher zu schaffen machten. Augustus befriedete die Region nach 25 v. Chr., schlug sie zur Provinz Galatien, gründete Veteranenkolonien und baute die Via Sebaste hindurch; Städte wie Sagalassos blühten unter Rom."
    - "Die Apostelgeschichte erwähnt es zweimal. Auf der ersten Reise gingen Paulus und Barnabas von Perge hinauf und „kamen gen Antiochien im Lande Pisidien und gingen in die Schule am Sabbattage“, in die römische Kolonie am Nordrand der Region, die einen eigenen Artikel hat; auf dem Rückweg heißt es: „Und zogen durch Pisidien und kamen nach Pamphylien“. Der Weg durch die Pässe war hart und das Land gesetzlos, was manche hinter Paulus' „Gefahr durch die Mörder“ sehen. Pisidien gehört heute zum Südwesten der Türkei, und die ausgegrabene Stadt Sagalassos ist eine seiner bekanntesten Stätten."
  fr:
    - "La Pisidie était le pays montagneux du Taurus occidental, dans le sud de l’Asie Mineure, au nord de la plaine côtière de Pamphylie et au sud de la Phrygie, autour des lacs de l’actuelle Isparta et de Burdur. Ses habitants passaient pour de farouches montagnards qui gardèrent leur liberté contre les Perses et donnèrent du fil à retordre à tous les maîtres suivants. Auguste pacifia la région après 25 av. J.-C., l’intégra à la province de Galatie, fonda des colonies de vétérans et y construisit la Via Sebaste ; des villes comme Sagalassos prospérèrent sous Rome."
    - "Les Actes la mentionnent deux fois. Lors du premier voyage, Paul et Barnabas montèrent de Perge et « arrivèrent à Antioche de Pisidie. Étant entrés dans la synagogue le jour du sabbat », colonie romaine au bord nord de la région, qui a son propre article ; au retour, « traversant ensuite la Pisidie, ils vinrent en Pamphylie ». La route par ses cols était dure et le pays sans loi, ce que certains voient derrière les « périls de la part des brigands » de Paul. La Pisidie fait aujourd’hui partie du sud-ouest de la Turquie, et la ville fouillée de Sagalassos compte parmi ses sites les plus connus."
  it:
    - "La Pisidia era il paese montuoso del Tauro occidentale nell’Asia Minore meridionale, a nord della pianura costiera della Panfilia e a sud della Frigia, attorno ai laghi delle odierne Isparta e Burdur. Il suo popolo era noto come fieri montanari che difesero la libertà contro i Persiani e diedero fastidio a ogni sovrano successivo. Augusto pacificò la regione dopo il 25 a.C., la inserì nella provincia di Galazia, fondò colonie di veterani e vi costruì la Via Sebaste; città come Sagalasso fiorirono sotto Roma."
    - "Gli Atti la menzionano due volte. Nel primo viaggio Paolo e Barnaba salirono da Perge e «giunsero ad Antiochia di Pisidia; e recatisi il sabato nella sinagoga», la colonia romana sul margine settentrionale della regione, che ha un articolo a parte; sulla via del ritorno, «traversata la Pisidia, vennero in Panfilia». La strada attraverso i suoi passi era dura e il paese senza legge, e alcuni vedono qui l’origine del «pericolo di ladroni» di Paolo. La Pisidia fa oggi parte della Turchia sud-occidentale, e la città scavata di Sagalasso è tra i suoi siti più noti."
  pl:
    - "Pizydia była górzystą krainą zachodniego Taurusu w południowej Azji Mniejszej, na północ od nadmorskiej równiny Pamfilii i na południe od Frygii, wokół jezior dzisiejszych Isparty i Burduru. Jej mieszkańcy byli znani jako dzicy górale, którzy obronili wolność przed Persami i sprawiali kłopoty każdemu późniejszemu władcy. August spacyfikował region po 25 roku p.n.e., włączył go do prowincji Galacji, założył kolonie weteranów i poprowadził przez niego Via Sebaste; miasta takie jak Sagalassos rozkwitły pod rządami Rzymu."
    - "Dzieje wspominają o niej dwa razy. W pierwszej podróży Paweł i Barnaba wyruszyli z Perge i „przyszli do Antyjochii Pisydejskiej, a wszedłszy do bóżnicy w dzień sobotni”, rzymskiej kolonii na północnym skraju regionu, która ma własny artykuł; w drodze powrotnej „A przeszedłszy Pisydyję, przyszli do Pamfilii”. Droga przez jej przełęcze była trudna, a kraj bezprawny, co niektórzy widzą za wyliczeniem Pawła „w niebezpieczeństwach od zbójców”. Pizydia należy dziś do południowo-zachodniej Turcji, a odkopane miasto Sagalassos jest jednym z jej najbardziej znanych stanowisk."
  cs:
    - "Pisidie byla hornatá země západního Taurusu v jižní Malé Asii, severně od pobřežní roviny Pamfylie a jižně od Frygie, kolem jezer dnešní Isparty a Burduru. Její lid byl znám jako divocí horalé, kteří uhájili svobodu proti Peršanům a dělali potíže každému vládci po nich. Augustus oblast po roce 25 př. n. l. pacifikoval, učinil ji součástí provincie Galacie, založil veteránské kolonie a vystavěl Via Sebaste, která jí prochází; města jako Sagalassos vzkvétala pod Římem."
    - "Skutky ji zmiňují dvakrát. Na první cestě Pavel a Barnabáš vystoupili z Perge a „přišli do Antiochie Pisidické, a všedše do školy v den sobotní“, římské kolonie na severním okraji oblasti, která má vlastní článek; na zpáteční cestě „A prošedše Pisidii, přišli do Pamfylie“. Cesta přes její průsmyky byla těžká a země bezzákonná, což někteří vidí za Pavlovým „v nebezpečenství od lotrů“. Pisidie je dnes částí jihozápadního Turecka a vykopané město Sagalassos patří k jejím nejznámějším místům."
  nl:
    - "Pisidië was het bergland van de westelijke Taurus in het zuiden van Klein-Azië, ten noorden van de kustvlakte van Pamfylië en ten zuiden van Frygië, rond de meren van het huidige Isparta en Burdur. De bewoners stonden bekend als woeste hooglanders die hun vrijheid tegen de Perzen bewaarden en elke latere heerser last bezorgden. Augustus pacificeerde de streek na 25 v.Chr., maakte haar deel van de provincie Galatië, stichtte veteranenkolonies en legde de Via Sebaste erdoorheen aan; steden als Sagalassos bloeiden onder Rome."
    - "Handelingen noemt het tweemaal. Op de eerste reis trokken Paulus en Barnabas van Perge omhoog en “kwamen te Antiochië, een stad in Pisidië; en gegaan zijnde in de synagoge op den dag des sabbats”, de Romeinse kolonie aan de noordrand van de streek, die een eigen artikel heeft; op de terugweg, “Pisidië doorgereisd hebbende, kwamen zij in Pamfylië”. De weg door de passen was moeilijk en het land wetteloos, wat sommigen achter Paulus’ “gevaren van moordenaars” zien. Pisidië maakt tegenwoordig deel uit van Zuidwest-Turkije, en de opgegraven stad Sagalassos behoort tot de bekendste plaatsen."
  sv:
    - "Pisidien var bergslandet i västra Taurus i södra Mindre Asien, norr om Pamfyliens kustslätt och söder om Frygien, kring sjöarna vid nuvarande Isparta och Burdur. Dess folk var kända som vilda bergsbor som behöll sin frihet mot perserna och vållade varje härskare efter dem besvär. Augustus pacificerade regionen efter 25 f.Kr., gjorde den till en del av provinsen Galatien, grundade veterankolonier och byggde Via Sebaste genom den; städer som Sagalassos blomstrade under Rom."
    - "Apostlagärningarna nämner det två gånger. På den första resan gick Paulus och Barnabas upp från Perge och ”kommo till Antiokia i Pisidien. Och på sabbatsdagen gingo de in i synagogan”, den romerska kolonin i regionens norra utkant, som har en egen artikel; på tillbakavägen ”färdades de vidare genom Pisidien och kommo till Pamfylien”. Vägen genom dess pass var hård och landet laglöst, vilket vissa ser bakom Paulus ”faror bland rövare”. Pisidien är i dag en del av sydvästra Turkiet, och den utgrävda staden Sagalassos hör till dess mest kända platser."
  nb:
    - "Pisidia var fjellandet i det vestlige Taurus i sørlige Lilleasia, nord for kystsletten Pamfylia og sør for Frygia, rundt innsjøene i dagens Isparta og Burdur. Folket var kjent som hardføre høylendinger som holdt på friheten mot perserne og voldte alle herskere etter dem bry. Augustus pasifiserte området etter 25 f.Kr., gjorde det til en del av provinsen Galatia, grunnla veterankolonier og bygde Via Sebaste gjennom det; byer som Sagalassos blomstret under Roma."
    - "Apostlenes gjerninger nevner det to ganger. På den første reisen dro Paulus og Barnabas opp fra Perge og «kom til Antiokia i Pisidia, og gikk inn i synagogen på sabbatsdagen», den romerske kolonien i områdets nordkant, som har sin egen artikkel; på hjemveien, «efterat de så hadde draget igjennem Pisidia, kom de til Pamfylia». Veien gjennom passene var hard og landet lovløst, noe noen ser bak Paulus' «farer blandt røvere». Pisidia er i dag en del av sørvestlige Tyrkia, og den utgravde byen Sagalassos hører til de best kjente stedene."
  tl:
    - "Ang Pisidia ay ang bulubunduking lupain ng kanlurang Taurus sa timog Asia Minor, sa hilaga ng kapatagang baybayin ng Pamfilia at sa timog ng Frigia, sa palibot ng mga lawa ng Isparta at Burdur ngayon. Kilala ang mga tao nito bilang mababangis na taga-bundok na nanatiling malaya laban sa mga Persiyano at nagbigay ng gulo sa bawat tagapamahala pagkatapos nila. Pinayapa ni Augusto ang rehiyon pagkatapos ng 25 BK, ginawa itong bahagi ng lalawigan ng Galacia, nagtatag ng mga koloniya ng beterano at nagtayo ng Via Sebaste na tumatawid dito; umunlad sa ilalim ng Roma ang mga lungsod gaya ng Sagalassos."
    - "Dalawang beses itong binabanggit ng Mga Gawa. Sa unang paglalakbay, umakyat sina Pablo at Bernabe mula sa Perga at “nagsidating sa Antioquia ng Pisidia; at sila'y nagsipasok sa sinagoga nang araw ng sabbath”, ang koloniyang Romano sa hilagang gilid ng rehiyon, na may sariling artikulo; pabalik, “kanilang tinahak ang Pisidia, at nagsiparoon sa Pamfilia”. Mahirap ang daan sa mga daanan nito at walang batas ang lupain, na nakikita ng ilan sa likod ng “mga kapanganiban sa mga tulisan” ni Pablo. Ang Pisidia ay bahagi ngayon ng timog-kanlurang Turkey, at ang nahukay na lungsod ng Sagalassos ay kabilang sa pinakakilalang pook nito."
  da:
    - "Pisidien var bjerglandet i det vestlige Taurus i det sydlige Lilleasien, nord for Pamfyliens kystslette og syd for Frygien, omkring nutidens søer ved Isparta og Burdur. Dets folk var kendt som voldsomme højlændere, der bevarede deres frihed mod perserne og voldte alle herskere efter dem besvær. Augustus pacificerede egnen efter 25 f.Kr., gjorde den til en del af provinsen Galatien, grundlagde veterankolonier og byggede Via Sebaste gennem den; byer som Sagalassos blomstrede under Rom."
    - "Apostlenes Gerninger nævner den to gange. På den første rejse drog Paulus og Barnabas op fra Perge og »kom til Antiokia i Pisidien og gik ind i Synagogen paa Sabbatsdagen«, den romerske koloni i egnens nordlige udkant, som har sin egen artikel; på hjemvejen »de droge igennem Pisidien og kom til Pamfylien«. Vejen gennem dens pas var hård og landet lovløst, hvilket nogle ser bag Paulus' »i Farer iblandt Røvere«. Pisidien er i dag en del af det sydvestlige Tyrkiet, og den udgravede by Sagalassos er blandt dets mest kendte steder."
  sr:
    - "Писидија је била планинска земља западног Тауруса у јужној Малој Азији, северно од приобалне равнице Памфилије и јужно од Фригије, око језера данашњих Испарте и Бурдура. Њен народ био је познат као жестоки горштаци који су очували слободу од Персијанаца и задавали невоље свим владарима после њих. Август је смирио област после 25. п. н. е., уградио је у провинцију Галатију, основао ветеранске колоније и кроз њу саградио Севастов пут; градови као Сагаласос цветали су под Римом."
    - "Дела је помињу двапут. На првом путовању Павле и Варнава попели су се из Перге и „дођоше у Антиохију писидијску, и ушавши у зборницу у дан суботни“ (то је римска колонија на северном ободу области, која има свој чланак); на повратку, „прошавши Писидију дођоше у Памфилију“. Пут кроз њене превоје био је тежак, а земља без закона, што неки виде иза Павловог „у страху од хајдука“. Писидија је данас део југозападне Турске, а ископани град Сагаласос међу њеним је најпознатијим налазиштима."
  hu:
    - "Piszídia a nyugati Taurusz hegyvidéke volt Kis-Ázsia déli részén, Pamfília tengerparti síkságától északra és Frígiától délre, a mai Isparta és Burdur tavai körül. Népét vad felföldiekként ismerték, akik szabadságukat megőrizték a perzsákkal szemben, és minden későbbi uralkodónak gondot okoztak. Augusztus Kr. e. 25 után megbékítette a vidéket, Galácia provinciájához csatolta, veterán gyarmatokat alapított, és a Via Sebastét építette át rajta; a Szagalasszoszhoz hasonló városok Róma alatt virágoztak."
    - "Az ApCsel kétszer említi. Az első úton Pál és Barnabás Pergéből felment, és „eljutának Antiókhiába, Pisidiának városába, és bemenvén szombatnapon a zsinagógába” – a vidék északi szélén fekvő római gyarmatba, amelynek külön cikke van; visszafelé pedig „Pisidián általmenvén, menének Pamfiliába”. A hágókon át vezető út nehéz volt, az ország pedig törvénytelen, amit egyesek Pál „veszedelemben rablók közt” szavai mögött látnak. Piszídia ma Délnyugat-Törökország része, és a feltárt Szagalasszosz legismertebb lelőhelyei közé tartozik."
  fi:
    - "Pisidia oli läntisen Taurus-vuoriston vuoristomaa Vähän-Aasian etelässä, Pamfylian rannikkotasangon pohjoispuolella ja Fryygian eteläpuolella, nykyisten Ispartan ja Burdurin järvien ympärillä. Sen kansa tunnettiin hurjina ylänköläisinä, jotka säilyttivät vapautensa persialaisia vastaan ja tuottivat vaivaa jokaiselle sen jälkeiselle hallitsijalle. Augustus rauhoitti seudun 25 eaa. jälkeen, liitti sen Galatian provinssiin, perusti veteraanisiirtokuntia ja rakennutti sen läpi Via Sebasten; kaupungit kuten Sagalassos kukoistivat Rooman alla."
    - "Apostolien teot mainitsee sen kahdesti. Ensimmäisellä matkalla Paavali ja Barnabas nousivat Pergestä ja ”saapuivat Pisidian Antiokiaan; ja he menivät synagoogaan sapatinpäivänä”, seudun pohjoisreunan roomalaiseen siirtokuntaan, jolla on oma artikkelinsa; paluumatkalla he ”kulkivat läpi Pisidian ja tulivat Pamfyliaan”. Tie solien halki oli vaikea ja maa laitonta, minkä jotkut näkevät Paavalin ”vaaroissa rosvojen keskellä” takana. Pisidia kuuluu nykyään Lounais-Turkkiin, ja kaivettu Sagalassosin kaupunki on sen tunnetuimpia kohteita."
  vi:
    - "Bi-si-đi là vùng núi của phía tây dãy Taurus ở nam Tiểu Á, phía bắc đồng bằng ven biển Bam-phi-ly và phía nam Phi-ri-gi, quanh các hồ Isparta và Burdur ngày nay. Dân của nó nổi tiếng là người miền núi hung dữ, giữ được tự do trước người Ba Tư và gây rắc rối cho mọi người cai trị sau đó. Au-gút-tơ bình định vùng này sau năm 25 TCN, đưa nó vào tỉnh Ga-la-ti, lập các thuộc địa cựu binh và xây Via Sebaste xuyên qua; các thành như Sagalassos hưng thịnh dưới thời La Mã."
    - "Sách Công Vụ nhắc đến nó hai lần. Trong chuyến đi thứ nhất, Phao-lô và Ba-na-ba đi lên từ Bẹt-giê, “đến thành An-ti-ốt xứ Bi-si-đi; rồi nhằm ngày Sa-bát, vào trong nhà hội mà ngồi”, thuộc địa La Mã ở rìa bắc của vùng, có bài riêng; trên đường về, hai sứ đồ “vượt qua đất Bi-si-đi, đến trong xứ Bam-phi-ly”. Con đường qua các đèo của nó gian nan và xứ này vô pháp, điều mà một số người thấy đằng sau câu “nguy với trộm cướp” của Phao-lô. Bi-si-đi ngày nay là một phần của tây nam Thổ Nhĩ Kỳ, và thành Sagalassos đã khai quật là một trong những địa điểm nổi tiếng nhất của nó."
  ro:
    - "Pisidia era țara muntoasă a Taurusului de vest din sudul Asiei Mici, la nord de câmpia litorală a Pamfiliei și la sud de Frigia, în jurul lacurilor din actualele Isparta și Burdur. Locuitorii ei erau cunoscuți ca munteni aprigi, care și-au păstrat libertatea față de perși și au dat bătaie de cap tuturor stăpânitorilor de după ei. Augustus a pacificat regiunea după 25 î.Hr., a făcut-o parte din provincia Galatia, a întemeiat colonii de veterani și a construit prin ea Via Sebaste; orașe precum Sagalassos au înflorit sub Roma."
    - "Faptele Apostolilor o pomenesc de două ori. În prima călătorie, Pavel și Barnaba au urcat de la Perga și „au venit în Antiohia Pisidiei, și intrând în sinagogă în ziua sâmbetei”, colonia romană de la marginea nordică a regiunii, care are propriul articol; la întoarcere, „trecând Pisidia, au venit în Pamfilia”. Drumul prin trecătorile ei era greu, iar țara fără lege, ceea ce unii văd în spatele „primejdiilor de către tâlhari” ale lui Pavel. Pisidia este astăzi parte a sud-vestului Turciei, iar orașul săpat Sagalassos este printre cele mai cunoscute situri ale ei."
  bg:
    - "Писидия била планинската страна на Западен Тавър в Южна Мала Азия, на север от крайбрежната равнина на Памфилия и на юг от Фригия, около езерата на днешните Испарта и Бурдур. Жителите ѝ били известни като свирепи планинци, които запазили свободата си срещу персите и създавали трудности на всеки владетел след тях. Август умиротворил областта след 25 г. пр.н.е., направил я част от провинция Галатия, основал колонии на ветерани и прокарал през нея Виа Себасте; градове като Сагаласос процъфтели под властта на Рим."
    - "Деяния я споменава два пъти. При първото пътуване Павел и Варнава се изкачили от Перга и „стигнаха в Антиохия Писидийска, и съботния ден влезоха в съборището“ — римската колония на северния край на областта, която има собствена статия; на връщане, „като минаха през Писидия дойдоха в Памфилия“. Пътят през проходите ѝ бил труден, а страната — беззаконна, което някои виждат зад думите на Павел „в беди от разбойници“. Днес Писидия е част от Югозападна Турция, а разкопаният град Сагаласос е сред най-известните ѝ обекти."
