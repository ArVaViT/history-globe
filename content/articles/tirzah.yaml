# Overview article (ADR 0007). Mainstream facts only; disputed datings and identifications are named as such. Tirzah follows the usual identification with Tell el-Far'ah (North).
id: tirzah
place: a80d317
title:
  en: "Tirzah"
  ru: "Фирца"
  uk: "Тірца"
  es: "Tirsa"
  pt: "Tirza"
  de: "Tirza"
  fr: "Thirtsa"
body:
  en:
    - "Tirzah is usually identified with Tell el-Far'ah (North), a large mound about 11 km north-east of Nablus at the head of Wadi el-Far'ah, by two strong springs and on the road from the hill country of Shechem down to the Jordan Valley. No inscription names the site. Edward Robinson had thought of Talluza for the likeness of its name; in 1931 W. F. Albright proposed Tell el-Far'ah as a large, well-watered and easily defended site of the right periods, and its excavator Roland de Vaux came to accept the identification. Most scholars and atlases follow it, though it remains a hypothesis."
    - "De Vaux dug the mound in nine seasons between 1946 and 1960 and traced settlement from the Neolithic. In the early third millennium BC a walled town with a monumental gate stood here; it was abandoned in the middle of that millennium, and only centuries later did a Middle Bronze Age town rise on the ruins. Joshua lists the king of Tirzah among the thirty-one kings Israel defeated, and Tirzah is also the name of one of the daughters of Zelophehad, usually read as a clan of Manasseh."
    - "After the kingdom divided, Tirzah became the royal city of Israel. Jeroboam's wife came home to Tirzah, and their sick son died as she crossed the threshold. Baasha and his son Elah reigned there; Zimri killed Elah as he lay drunk in the house of his steward, and seven days later, when Omri besieged the city, burned the king's house over himself. Omri reigned six years in Tirzah and then built Samaria. De Vaux saw in a large unfinished building at Tell el-Far'ah a trace of that move; Israel Finkelstein assigns Tirzah to an earlier level of the mound, and the dating of these levels is still debated."
    - 'Menahem went up from Tirzah to Samaria, killed King Shallum and took the throne. The Song of Songs says, "Thou art beautiful, O my love, as Tirzah". After the Assyrian conquest the town declined, and Tell el-Far''ah was abandoned about 600 BC. In the fourth century AD Eusebius could say of Thersa only that Joshua took it with its king.'
  ru:
    - "Фирцу обычно отождествляют с Телль-эль-Фара (Северным) — большим холмом примерно в 11 км к северо-востоку от Наблуса, у начала Вади-эль-Фара, у двух обильных источников, на дороге из нагорья Сихема в долину Иордана. Ни одна надпись не называет это место. Эдвард Робинсон думал о Таллузе из-за сходства названия; в 1931 г. У. Ф. Олбрайт предложил Телль-эль-Фара как большое, хорошо снабжённое водой и легко обороняемое поселение нужных эпох, и раскопщик холма Ролан де Во со временем принял это отождествление. Ему следуют большинство учёных и атласов, хотя оно остаётся гипотезой."
    - "Де Во копал холм девять сезонов между 1946 и 1960 гг. и проследил поселение с эпохи неолита. В начале III тысячелетия до н. э. здесь стоял обнесённый стеной город с монументальными воротами; в середине тысячелетия его покинули, и лишь спустя века на развалинах поднялся город среднего бронзового века. Книга Иисуса Навина называет царя Фирцы среди тридцати одного царя, побеждённых Израилем, а Фирцей звали и одну из дочерей Салпаада; её имя обычно понимают как имя рода Манассии."
    - "После разделения царства Фирца стала царским городом Израиля. Жена Иеровоама вернулась в Фирцу, и их больной сын умер, едва она переступила порог дома. Здесь царствовали Вааса и его сын Ила; Замврий убил Илу, когда тот напился допьяна в доме своего начальника над дворцом, а через семь дней, когда Амврий осадил город, сжёг над собой царский дом. Амврий царствовал в Фирце шесть лет, а затем построил Самарию. Де Во видел след этого переселения в большом недостроенном здании на Телль-эль-Фара; Израиль Финкельштейн относит Фирцу к более раннему слою холма, и датировка этих слоёв остаётся спорной."
    - "Менаим пошёл из Фирцы в Самарию, убил царя Селлума и воцарился вместо него. Песнь песней говорит: «Прекрасна ты, возлюбленная моя, как Фирца». После ассирийского завоевания город пришёл в упадок, и около 600 г. до н. э. Телль-эль-Фара опустел. В IV веке н. э. Евсевий мог сказать о Фирце лишь то, что Иисус Навин взял её вместе с её царём."
  uk:
    - "Тірцу зазвичай ототожнюють із Телль-ель-Фарахом (Північним), великим пагорбом приблизно за 11 км на північний схід від Наблуса у верхів’ї Вади-ель-Фарах, біля двох сильних джерел, на дорозі з гірської країни Сихема вниз до Йорданської долини. Жоден напис не називає місця. Едвард Робінсон думав про Таллюзу через схожість назви; 1931 року В. Ф. Олбрайт запропонував Телль-ель-Фарах як велике, добре зрошене і легко оборонне місце потрібних періодів, і його розкопувач Ролан де Во дійшов згоди з цим ототожненням. Більшість учених і атласів іде за ним, хоч воно лишається гіпотезою."
    - "Де Во копав пагорб дев’ять сезонів між 1946 і 1960 роками й простежив поселення від неоліту. На початку III тис. до н. е. тут стояло муроване місто з монументальною брамою; його покинули в середині того тисячоліття, і лише через кілька століть на руїнах постало місто середньої бронзової доби. Ісус Навин перелічує царя Тірци серед тридцяти одного царя, яких переміг Ізраїль, а Тірца — також ім’я однієї з доньок Салпаада, яке зазвичай читають як рід Манасії."
    - "Після поділу царства Тірца стала царським містом Ізраїлю. Жінка Єровоама повернулася додому в Тірцу, і їхній хворий син помер, коли вона переступила поріг. Тут царювали Вааса і його син Ела; Зімрі вбив Елу, коли той лежав п’яний у домі свого управителя, і сім днів по тому, коли Омрі облягав місто, спалив над собою царський дім. Омрі царював у Тірці шість років, а потім збудував Самарію. Де Во побачив у великій недобудованій споруді в Телль-ель-Фараху слід цього переїзду; Ізраель Фінкельштейн відносить Тірцу до раннішого шару пагорба, і датування цих шарів досі дискутується."
    - "Менаім вирушив із Тірци до Самарії, вбив царя Шаллума і сів на трон. Пісня над піснями каже: «Гарна ти, моя любко, неначе та Тирса». Після ассірійського завоювання місто занепало, і Телль-ель-Фарах покинули близько 600 р. до н. е. У IV столітті н. е. Євсевій міг сказати про Терсу лише те, що Ісус Навин узяв її разом з її царем."
  es:
    - "Tirsa se identifica habitualmente con Tell el-Far'ah (Norte), un gran montículo a unos 11 km al noreste de Nablus, en la cabecera del Wadi el-Far'ah, junto a dos fuertes manantiales y en el camino que baja de la región montañosa de Siquem al valle del Jordán. Ninguna inscripción nombra el sitio. Edward Robinson había pensado en Talluza por el parecido del nombre; en 1931 W. F. Albright propuso Tell el-Far'ah como un lugar grande, bien regado y fácil de defender, de los períodos adecuados, y su excavador Roland de Vaux llegó a aceptar la identificación. La mayoría de los estudiosos y atlas la siguen, aunque sigue siendo una hipótesis."
    - "De Vaux excavó el montículo en nueve campañas entre 1946 y 1960 y rastreó el asentamiento desde el Neolítico. A comienzos del tercer milenio a. C. se alzaba aquí una ciudad amurallada con una puerta monumental; fue abandonada a mediados de ese milenio, y solo siglos después se levantó sobre las ruinas una ciudad del Bronce Medio. Josué enumera al rey de Tirsa entre los treinta y un reyes que Israel derrotó, y Tirsa es también el nombre de una de las hijas de Zelofehad, que suele leerse como un clan de Manasés."
    - "Tras la división del reino, Tirsa se convirtió en la ciudad real de Israel. La mujer de Jeroboam volvió a casa a Tirsa, y su hijo enfermo murió cuando ella cruzaba el umbral. Baasa y su hijo Ela reinaron allí; Zimri mató a Ela mientras yacía ebrio en casa de su mayordomo, y siete días después, cuando Omri sitió la ciudad, quemó sobre sí la casa del rey. Omri reinó seis años en Tirsa y luego edificó Samaria. De Vaux vio en un gran edificio inacabado de Tell el-Far'ah una huella de ese traslado; Israel Finkelstein asigna Tirsa a un nivel anterior del montículo, y la datación de estos niveles sigue debatiéndose."
    - "Manahem subió de Tirsa a Samaria, mató al rey Salum y tomó el trono. El Cantar de los Cantares dice: «Hermosa eres tú, oh amiga mía, como Tirsa». Tras la conquista asiria la ciudad decayó, y Tell el-Far'ah fue abandonado hacia 600 a. C. En el siglo IV d. C., Eusebio solo podía decir de Thersa que Josué la tomó con su rey."
  pt:
    - "Tirza é geralmente identificada com Tell el-Far'ah (Norte), um grande monte a cerca de 11 km a nordeste de Nablus, na cabeceira do Wadi el-Far'ah, junto a duas fontes fortes e na estrada que desce da região montanhosa de Siquém ao vale do Jordão. Nenhuma inscrição nomeia o sítio. Edward Robinson havia pensado em Talluza pela semelhança do nome; em 1931, W. F. Albright propôs Tell el-Far'ah como sítio grande, bem irrigado e de fácil defesa, dos períodos certos, e seu escavador Roland de Vaux passou a aceitar a identificação. A maioria dos estudiosos e atlas a segue, embora continue sendo uma hipótese."
    - "De Vaux escavou o monte em nove temporadas entre 1946 e 1960 e rastreou o povoamento desde o Neolítico. No início do terceiro milênio a.C., havia ali uma cidade murada com um portão monumental; foi abandonada em meados desse milênio, e só séculos depois uma cidade do Bronze Médio se ergueu sobre as ruínas. Josué lista o rei de Tirza entre os trinta e um reis que Israel derrotou, e Tirza é também o nome de uma das filhas de Zelofeade, geralmente lido como um clã de Manassés."
    - "Depois que o reino se dividiu, Tirza tornou-se a cidade real de Israel. A mulher de Jeroboão voltou para casa, em Tirza, e o filho doente deles morreu quando ela cruzava o limiar. Baasa e seu filho Elá reinaram ali; Zinri matou Elá quando este jazia embriagado na casa de seu mordomo e, sete dias depois, quando Onri sitiou a cidade, queimou sobre si a casa do rei. Onri reinou seis anos em Tirza e depois construiu Samaria. De Vaux viu num grande edifício inacabado em Tell el-Far'ah um vestígio dessa mudança; Israel Finkelstein atribui Tirza a um nível anterior do monte, e a datação desses níveis ainda é debatida."
    - "Menaém subiu de Tirza a Samaria, matou o rei Salum e tomou o trono. O Cântico dos Cânticos diz: “Você é linda, minha amada, como Tirza”. Após a conquista assíria, a cidade declinou, e Tell el-Far'ah foi abandonada por volta de 600 a.C. No século IV d.C., Eusébio só podia dizer de Thersa que Josué a tomou com seu rei."
  de:
    - "Tirza wird meist mit Tell el-Far'ah (Nord) gleichgesetzt, einem großen Hügel etwa 11 km nordöstlich von Nablus am Kopf des Wadi el-Far'ah, bei zwei starken Quellen und an der Straße vom Bergland von Sichem hinab ins Jordantal. Keine Inschrift nennt den Ort. Edward Robinson hatte wegen der Namensähnlichkeit an Talluza gedacht; 1931 schlug W. F. Albright Tell el-Far'ah als großen, wasserreichen und leicht zu verteidigenden Ort der passenden Epochen vor, und sein Ausgräber Roland de Vaux kam dazu, die Gleichsetzung anzunehmen. Die meisten Forscher und Atlanten folgen ihr, doch bleibt sie eine Hypothese."
    - "De Vaux grub den Hügel in neun Kampagnen zwischen 1946 und 1960 aus und verfolgte die Besiedlung bis ins Neolithikum. Im frühen dritten Jahrtausend v. Chr. stand hier eine ummauerte Stadt mit monumentalem Tor; sie wurde in der Mitte jenes Jahrtausends aufgegeben, und erst Jahrhunderte später entstand eine mittelbronzezeitliche Stadt auf den Ruinen. Josua zählt den König von Tirza unter den einunddreißig Königen auf, die Israel besiegte, und Tirza ist auch der Name einer der Töchter Zelofhads, meist als Sippe Manasses gedeutet."
    - "Nach der Reichsteilung wurde Tirza Residenzstadt Israels. Jerobeams Frau kehrte nach Tirza heim, und ihr kranker Sohn starb, als sie die Schwelle überschritt. Baesa und sein Sohn Ela regierten dort; Simri erschlug Ela, als er betrunken im Haus seines Verwalters lag, und verbrannte sich sieben Tage später, als Omri die Stadt belagerte, mit dem Haus des Königs. Omri regierte sechs Jahre in Tirza und baute dann Samaria. De Vaux sah in einem großen unfertigen Gebäude in Tell el-Far'ah eine Spur dieses Umzugs; Israel Finkelstein ordnet Tirza einer früheren Schicht des Hügels zu, und die Datierung dieser Schichten ist noch umstritten."
    - "Menahem zog von Tirza nach Samaria hinauf, erschlug König Schallum und nahm den Thron. Das Hohelied sagt: „Du bist schön, meine Freundin, wie Thirza“. Nach der assyrischen Eroberung verfiel die Stadt, und Tell el-Far'ah wurde um 600 v. Chr. aufgegeben. Im vierten Jahrhundert n. Chr. konnte Eusebius von Thersa nur sagen, dass Josua es samt seinem König nahm."
  fr:
    - "Thirtsa est d’ordinaire identifiée à Tell el-Far’ah (nord), grand tertre à environ 11 km au nord-est de Naplouse, à la tête de l’oued el-Far’ah, près de deux fortes sources et sur la route qui descend des collines de Sichem vers la vallée du Jourdain. Aucune inscription ne nomme le site. Edward Robinson avait pensé à Talluza pour la ressemblance du nom ; en 1931, W. F. Albright proposa Tell el-Far’ah comme site vaste, bien arrosé et facile à défendre, des bonnes périodes, et son fouilleur Roland de Vaux en vint à accepter l’identification. La plupart des spécialistes et des atlas la suivent, bien qu’elle reste une hypothèse."
    - "De Vaux fouilla le tertre en neuf campagnes entre 1946 et 1960 et retraça l’occupation depuis le néolithique. Au début du IIIe millénaire av. J.-C., une ville fortifiée à porte monumentale s’y dressait ; elle fut abandonnée au milieu de ce millénaire, et ce n’est que des siècles plus tard qu’une ville du bronze moyen s’éleva sur les ruines. Josué range le roi de Thirtsa parmi les trente et un rois vaincus par Israël, et Thirtsa est aussi le nom d’une des filles de Tselophchad, d’ordinaire lu comme un clan de Manassé."
    - "Après la division du royaume, Thirtsa devint la ville royale d’Israël. La femme de Jéroboam revint à Thirtsa, et leur fils malade mourut comme elle franchissait le seuil. Baescha et son fils Éla y régnèrent ; Zimri tua Éla alors qu’il s’enivrait dans la maison de son intendant, et sept jours plus tard, quand Omri assiégea la ville, brûla sur lui la maison du roi. Omri régna six ans à Thirtsa, puis bâtit Samarie. De Vaux vit dans un grand bâtiment inachevé de Tell el-Far’ah la trace de ce déménagement ; Israel Finkelstein attribue Thirtsa à un niveau plus ancien du tertre, et la datation de ces niveaux reste débattue."
    - "Menahem monta de Thirtsa à Samarie, tua le roi Schallum et prit le trône. Le Cantique des cantiques dit : « Tu es belle, mon amie, comme Thirtsa ». Après la conquête assyrienne, la ville déclina, et Tell el-Far’ah fut abandonné vers 600 av. J.-C. Au IVe siècle apr. J.-C., Eusèbe ne pouvait dire de Thersa que Josué la prit avec son roi."
