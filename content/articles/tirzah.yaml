# Overview article (ADR 0007). Mainstream facts only; disputed datings and identifications are named as such. Tirzah follows the usual identification with Tell el-Far'ah (North).
id: tirzah
place: a80d317
title:
  en: "Tirzah"
  ru: "Фирца"
body:
  en:
    - "Tirzah is usually identified with Tell el-Far'ah (North), a large mound about 11 km north-east of Nablus at the head of Wadi el-Far'ah, by two strong springs and on the road from the hill country of Shechem down to the Jordan Valley. No inscription names the site. Edward Robinson had thought of Talluza for the likeness of its name; in 1931 W. F. Albright proposed Tell el-Far'ah as a large, well-watered and easily defended site of the right periods, and its excavator Roland de Vaux came to accept the identification. Most scholars and atlases follow it, though it remains a hypothesis."
    - "De Vaux dug the mound in nine seasons between 1946 and 1960 and traced settlement from the Neolithic. In the early third millennium BC a walled town with a monumental gate stood here; it was abandoned in the middle of that millennium, and only centuries later did a Middle Bronze Age town rise on the ruins. Joshua lists the king of Tirzah among the thirty-one kings Israel defeated, and Tirzah is also the name of one of the daughters of Zelophehad, usually read as a clan of Manasseh."
    - "After the kingdom divided, Tirzah became the royal city of Israel. Jeroboam's wife came home to Tirzah, and their sick son died as she crossed the threshold. Baasha and his son Elah reigned there; Zimri killed Elah as he lay drunk in the house of his steward, and seven days later, when Omri besieged the city, burned the king's house over himself. Omri reigned six years in Tirzah and then built Samaria. De Vaux saw in a large unfinished building at Tell el-Far'ah a trace of that move; Israel Finkelstein assigns Tirzah to an earlier level of the mound, and the dating of these levels is still debated."
    - 'Menahem went up from Tirzah to Samaria, killed King Shallum and took the throne. The Song of Songs says, "Thou art beautiful, O my love, as Tirzah". After the Assyrian conquest the town declined, and Tell el-Far''ah was abandoned about 600 BC. In the fourth century AD Eusebius could say of Thersa only that Joshua took it with its king.'
  ru:
    - "Фирцу обычно отождествляют с Телль-эль-Фара (Северным) — большим холмом примерно в 11 км к северо-востоку от Наблуса, у начала Вади-эль-Фара, у двух обильных источников, на дороге из нагорья Сихема в долину Иордана. Ни одна надпись не называет это место. Эдвард Робинсон думал о Таллузе из-за сходства названия; в 1931 г. У. Ф. Олбрайт предложил Телль-эль-Фара как большое, хорошо снабжённое водой и легко обороняемое поселение нужных эпох, и раскопщик холма Ролан де Во со временем принял это отождествление. Ему следуют большинство учёных и атласов, хотя оно остаётся гипотезой."
    - "Де Во копал холм девять сезонов между 1946 и 1960 гг. и проследил поселение с эпохи неолита. В начале III тысячелетия до н. э. здесь стоял обнесённый стеной город с монументальными воротами; в середине тысячелетия его покинули, и лишь спустя века на развалинах поднялся город среднего бронзового века. Книга Иисуса Навина называет царя Фирцы среди тридцати одного царя, побеждённых Израилем, а Фирцей звали и одну из дочерей Салпаада; её имя обычно понимают как имя рода Манассии."
    - "После разделения царства Фирца стала царским городом Израиля. Жена Иеровоама вернулась в Фирцу, и их больной сын умер, едва она переступила порог дома. Здесь царствовали Вааса и его сын Ила; Замврий убил Илу, когда тот напился допьяна в доме своего начальника над дворцом, а через семь дней, когда Амврий осадил город, сжёг над собой царский дом. Амврий царствовал в Фирце шесть лет, а затем построил Самарию. Де Во видел след этого переселения в большом недостроенном здании на Телль-эль-Фара; Израиль Финкельштейн относит Фирцу к более раннему слою холма, и датировка этих слоёв остаётся спорной."
    - "Менаим пошёл из Фирцы в Самарию, убил царя Селлума и воцарился вместо него. Песнь песней говорит: «Прекрасна ты, возлюбленная моя, как Фирца». После ассирийского завоевания город пришёл в упадок, и около 600 г. до н. э. Телль-эль-Фара опустел. В IV веке н. э. Евсевий мог сказать о Фирце лишь то, что Иисус Навин взял её вместе с её царём."
