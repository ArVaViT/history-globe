body:
  en:
    - "Shur is the desert on the north-eastern frontier of Egypt, the country between the Nile Delta and the Negev through which the road from Beersheba to Egypt ran; the Bible says it lies “before Egypt”, that is, facing it. The name means “wall” in Hebrew, and many connect it with the line of forts that Egyptian texts of the Middle Kingdom call the Walls of the Ruler, built to keep Asiatics out of the Delta; others take it for an Egyptian word or a place that gave its name to the road. How far the wilderness of Shur reached is unclear: the itinerary in Numbers calls the same first stage after the crossing of the sea “the wilderness of Etham”. The map marks the desert of north-western Sinai east of the Suez Canal, with the country east of the head of the Gulf of Suez and, at the far end of the road, Tel Sharuhen in the western Negev as other candidates."
    - "The angel found Hagar “by the fountain in the way to Shur” when she fled from Sarah. Abraham “dwelled between Kadesh and Shur, and sojourned in Gerar”; the Ishmaelites “dwelt from Havilah unto Shur, that is before Egypt”. After the crossing of the Red Sea Moses led Israel “into the wilderness of Shur; and they went three days in the wilderness, and found no water” until they came to Marah. Saul smote the Amalekites “from Havilah until thou comest to Shur, that is over against Egypt”, and David from Ziklag raided the peoples who had lived in that land “as thou goest to Shur, even unto the land of Egypt”."
    - "Nothing has been excavated under the name, and the desert is known from the Bible, Egyptian frontier texts and modern survey. Today it is the north of Egypt's Sinai peninsula and the eastern edge of the Delta along the Suez Canal, crossed by the road from Ismailia to the Gaza border."
  ru:
    - "Сур — пустыня на северо-восточной границе Египта, страна между дельтой Нила и Негевом, через которую шла дорога из Вирсавии в Египет; Библия говорит, что она лежит «пред Египтом», то есть напротив него. По-еврейски имя значит «стена», и многие связывают его с цепью крепостей, которую египетские тексты Среднего царства зовут Стенами Правителя, — её построили, чтобы не пускать азиатов в Дельту; другие видят в нём египетское слово или название места, давшего имя дороге. Как далеко простиралась пустыня Сур, неясно: перечень станов в книге Чисел называет тот же первый переход после моря «пустынею Ефам». На карте отмечена пустыня северо-западного Синая к востоку от Суэцкого канала, а как другие варианты — местность к востоку от северной оконечности Суэцкого залива и, на дальнем конце дороги, Тель-Шарухен в западном Негеве."
    - "Ангел нашёл Агарь, бежавшую от Сарры, «у источника на дороге к Суру». Авраам «поселился между Кадесом и между Суром; и был на время в Гераре»; Измаильтяне «жили от Хавилы до Сура, что пред Египтом». После перехода через Чермное море Моисей повёл Израильтян в пустыню Сур, «и шли они три дня по пустыне и не находили воды», пока не пришли в Мерру. Саул поразил Амалика «от Хавилы до окрестностей Сура, что пред Египтом», а Давид из Секелага нападал на народы, которые издавна населяли эту страну «до Сура и даже до земли Египетской»."
    - "Под этим именем ничего не раскопано, и пустыня известна по Библии, египетским пограничным текстам и современным обследованиям. Сегодня это север египетского Синая и восточный край Дельты вдоль Суэцкого канала, где проходит дорога из Исмаилии к границе Газы."
  uk:
    - "Сур — пустеля на північно-східному кордоні Єгипту, край між дельтою Нілу й Негевом, яким ішла дорога з Беер-Шеви до Єгипту; Біблія каже, що вона лежить «проти Египту», тобто навпроти нього. Назва єврейською означає «мур», і багато хто пов'язує її з лінією фортів, яку єгипетські тексти Середнього царства називають Стінами Володаря, збудованими, щоб не пускати азіатів у дельту; інші вважають її єгипетським словом або місцем, що дало назву дорозі. Як далеко сягала пустеля Сур, неясно: у переліку стоянок у Числах той самий перший етап після переходу через море названо «степом Етам». Карта позначає пустелю північно-західного Синаю на схід від Суецького каналу, а як інших кандидатів — край на схід від верхів'я Суецької затоки та, на дальньому кінці дороги, Тель-Шарухен у західному Негеві."
    - "Ангел знайшов Агар «коло криницї в пустинї, по дорозї в Сур», коли вона втікала від Сарри. Авраам «оселивсь між Кадесом і Суром, і якийсь час пробував у Герарі»; ізмаїльтяни жили «від Гавили до Сура, що проти Египту». Після переходу Червоного моря Мойсей повів Ізраїль до пустелі Сур; вони «йшли три днї степом, та й не знаходили води», доки не дійшли до Мерри. Саул побив амалекитян «від Хавили та й до Сира, що навпроти Египту», а Давид із Ціклагу нападав на народи, що «здавна жили в тій землї аж до Суру й до Египту»."
    - "Під цією назвою нічого не розкопано, а пустеля відома з Біблії, єгипетських прикордонних текстів і сучасних обстежень. Сьогодні це північ Синайського півострова в Єгипті та східний край дельти вздовж Суецького каналу, яким проходить дорога з Ісмаїлії до кордону з Газою."
  es:
    - "Shur es el desierto de la frontera nororiental de Egipto, el país entre el delta del Nilo y el Néguev por donde corría el camino de Beerseba a Egipto; la Biblia dice que está «enfrente de Egipto», es decir, frente a él. El nombre significa «muro» en hebreo, y muchos lo relacionan con la línea de fuertes que los textos egipcios del Reino Medio llaman los Muros del Gobernante, construidos para impedir la entrada de asiáticos en el Delta; otros lo toman por una palabra egipcia o por un lugar que dio su nombre al camino. Hasta dónde llegaba el desierto de Shur no está claro: el itinerario de Números llama a la misma primera etapa tras el cruce del mar «el desierto de Etham». El mapa señala el desierto del noroeste del Sinaí al este del canal de Suez, con la comarca al este de la cabecera del golfo de Suez y, en el extremo del camino, Tel Saruhén en el Néguev occidental como otros candidatos."
    - "El ángel halló a Agar «junto á la fuente que está en el camino del Sur» cuando huía de Sara. Abraham «asentó entre Cades y Shur, y habitó como forastero en Gerar»; los ismaelitas «habitaron desde Havila hasta Shur, que está enfrente de Egipto». Tras el cruce del mar Rojo Moisés condujo a Israel, que «salieron al desierto de Shur; y anduvieron tres días por el desierto sin hallar agua», hasta llegar a Mara. Saúl hirió a los amalecitas «desde Havila hasta llegar á Shur, que está á la frontera de Egipto», y David, desde Siclag, hizo incursiones contra los pueblos que habitaban aquella tierra «desde como se va á Shur hasta la tierra de Egipto»."
    - "Nada se ha excavado bajo este nombre, y el desierto se conoce por la Biblia, los textos fronterizos egipcios y la prospección moderna. Hoy es el norte de la península egipcia del Sinaí y el borde oriental del Delta a lo largo del canal de Suez, cruzado por la carretera de Ismailia a la frontera de Gaza."
  pt:
    - "Sur é o deserto na fronteira nordeste do Egito, o país entre o Delta do Nilo e o Neguebe por onde corria a estrada de Berseba ao Egito; a Bíblia diz que fica “diante do Egito”, isto é, de frente para ele. O nome significa “muro” em hebraico, e muitos o ligam à linha de fortes que textos egípcios do Reino Médio chamam Muros do Governante, construídos para manter os asiáticos fora do Delta; outros o tomam por uma palavra egípcia ou por um lugar que deu nome à estrada. Até onde chegava o deserto de Sur não é claro: o itinerário de Números chama a mesma primeira etapa depois da travessia do mar “deserto de Etã”. O mapa marca o deserto do noroeste do Sinai a leste do Canal de Suez, com a região a leste da ponta norte do Golfo de Suez e, na ponta da estrada, Tel Sharuhen, no Neguebe ocidental, como outros candidatos."
    - "O anjo achou Agar “junto à fonte no caminho de Sur” quando ela fugiu de Sara. Abraão “habitou entre Cades e Sur. Ele viveu como estrangeiro em Gerar”; os ismaelitas “habitaram desde Havilá até Sur, que fica diante do Egito”. Depois da travessia do Mar Vermelho, Moisés conduziu Israel, e “eles saíram para o deserto de Sur; e caminharam três dias no deserto, e não encontraram água” até chegarem a Mara. Saul feriu os amalequitas “desde Havilá até chegar a Sur, que fica a leste do Egito”, e Davi, a partir de Ziclague, atacou os povos que desde tempos antigos habitavam aquela terra “na direção de Sur até a terra do Egito”."
    - "Nada foi escavado sob esse nome, e o deserto é conhecido pela Bíblia, por textos egípcios de fronteira e por prospecção moderna. Hoje é o norte da península egípcia do Sinai e a orla leste do Delta ao longo do Canal de Suez, cruzada pela estrada de Ismaília à fronteira de Gaza."
  de:
    - "Schur ist die Wüste an der nordöstlichen Grenze Ägyptens, das Land zwischen dem Nildelta und dem Negev, durch das die Straße von Beerscheba nach Ägypten verlief; die Bibel sagt, sie liege „vor Ägypten“, also ihm gegenüber. Der Name bedeutet auf Hebräisch „Mauer“, und viele verbinden ihn mit der Linie von Forts, die ägyptische Texte des Mittleren Reiches die Mauern des Herrschers nennen, gebaut, um Asiaten vom Delta fernzuhalten; andere halten ihn für ein ägyptisches Wort oder einen Ort, der der Straße den Namen gab. Wie weit die Wüste Schur reichte, ist unklar: Die Stationenliste der Numeri nennt dieselbe erste Etappe nach dem Durchzug durch das Meer „die Wüste Etam“. Die Karte markiert die Wüste des nordwestlichen Sinai östlich des Sueskanals, mit dem Land östlich der Nordspitze des Golfs von Sues und, am fernen Ende der Straße, Tel Scharuhen im westlichen Negev als weiteren Kandidaten."
    - "Der Engel fand Hagar „bei dem Brunnen am Wege gen Sur“, als sie vor Sara floh. Abraham „wohnte zwischen Kades und Sur und ward ein Fremdling zu Gerar“; die Ismaeliter „wohnten von Hevila an bis gen Sur vor Ägypten“. Nach dem Durchzug durch das Rote Meer führte Mose Israel „zur Wüste Sur. Und sie wanderten drei Tage in der Wüste, daß sie kein Wasser fanden“, bis sie nach Mara kamen. Saul schlug die Amalekiter „von Hevila an bis gen Sur, das vor Ägypten liegt“, und David überfiel von Ziklag aus die Völker, die in jenem Land gewohnt hatten, „wo man kommt gen Sur bis an Ägyptenland“."
    - "Unter dem Namen wurde nichts ausgegraben, und die Wüste ist aus der Bibel, ägyptischen Grenztexten und moderner Vermessung bekannt. Heute ist sie der Norden der ägyptischen Sinai-Halbinsel und der Ostrand des Deltas am Sueskanal, durchquert von der Straße von Ismailia zur Grenze von Gaza."
  fr:
    - "Schur est le désert de la frontière nord-est de l’Égypte, le pays entre le delta du Nil et le Négev que traversait la route de Beer-Schéba à l’Égypte ; la Bible dit qu’il est « en face de l’Égypte ». Le nom signifie « mur » en hébreu, et beaucoup le rattachent à la ligne de forts que les textes égyptiens du Moyen Empire appellent les Murs du Souverain, bâtis pour tenir les Asiatiques hors du Delta ; d’autres y voient un mot égyptien ou un lieu qui aurait donné son nom à la route. Jusqu’où s’étendait le désert de Schur n’est pas clair : l’itinéraire des Nombres appelle la même première étape après la traversée de la mer « le désert d’Étham ». La carte marque le désert du nord-ouest du Sinaï à l’est du canal de Suez, avec la contrée à l’est du fond du golfe de Suez et, au bout de la route, Tel Scharuchen dans le Négev occidental comme autres candidats."
    - "L’ange trouva Agar « près de la source qui est sur le chemin de Schur » quand elle fuyait Sara. Abraham « s’établit entre Kadès et Schur, et fit un séjour à Guérar » ; les Ismaélites « habitèrent depuis Havila jusqu’à Schur, qui est en face de l’Égypte ». Après la traversée de la mer Rouge, Moïse mena Israël vers « le désert de Schur ; et, après trois journées de marche dans le désert, ils ne trouvèrent point d’eau » jusqu’à Mara. Saül battit Amalek « depuis Havila jusqu’à Schur, qui est en face de l’Égypte », et David, depuis Tsiklag, razzia les peuples qui habitaient ce pays « du côté de Schur et jusqu’au pays d’Égypte »."
    - "Rien n’a été fouillé sous ce nom, et le désert est connu par la Bible, les textes égyptiens de frontière et les prospections modernes. Aujourd’hui, c’est le nord de la péninsule égyptienne du Sinaï et le bord est du Delta le long du canal de Suez, traversé par la route d’Ismaïlia à la frontière de Gaza."
  it:
    - "Sur è il deserto sulla frontiera nord-orientale dell’Egitto, il paese tra il Delta del Nilo e il Negev attraverso il quale correva la strada da Bersabea all’Egitto; la Bibbia dice che si trova «dirimpetto all’Egitto». Il nome significa «muro» in ebraico, e molti lo collegano con la linea di forti che i testi egizi del Medio Regno chiamano i Muri del Sovrano, costruiti per tenere gli Asiatici fuori dal Delta; altri lo ritengono una parola egizia o un luogo che diede il nome alla strada. Fino a dove si estendesse il deserto di Sur non è chiaro: l’itinerario dei Numeri chiama la stessa prima tappa dopo l’attraversamento del mare «deserto di Etham». La mappa segna il deserto del Sinai nord-occidentale a est del Canale di Suez, con il territorio a est dell’estremità settentrionale del Golfo di Suez e, all’altra estremità della strada, Tel Sharuhen nel Negev occidentale come altri candidati."
    - "L’angelo trovò Agar «presso la sorgente ch’è sulla via di Shur» quando fuggì da Sara. Abramo «dimorò fra Kades e Shur, e abitò come forestiero in Gherar»; gli Ismaeliti «abitarono da Havila fino a Shur, ch’è dirimpetto all’Egitto». Dopo l’attraversamento del Mar Rosso Mosè condusse Israele «verso il deserto di Shur; camminarono tre giorni nel deserto, e non trovarono acqua» finché giunsero a Mara. Saul sconfisse gli Amalekiti «da Havila fino a Shur, che sta dirimpetto all’Egitto», e Davide da Siclag fece scorrerie contro i popoli che abitavano da tempi antichi quel paese, «dal lato di Shur fino al paese d’Egitto»."
    - "Nulla è stato scavato sotto questo nome, e il deserto è noto dalla Bibbia, dai testi egizi di frontiera e dalle ricognizioni moderne. Oggi è il nord della penisola egiziana del Sinai e il margine orientale del Delta lungo il Canale di Suez, attraversato dalla strada da Ismailia al confine di Gaza."
  pl:
    - "Szur to pustynia na północno-wschodniej granicy Egiptu, kraj między Deltą Nilu a Negewem, przez który biegła droga z Beer-Szeby do Egiptu; Biblia mówi, że leży „na przeciwko Egiptowi”, czyli zwrócona ku niemu. Nazwa znaczy po hebrajsku „mur” i wielu łączy ją z linią fortów, które egipskie teksty Średniego Państwa nazywają Murami Władcy, zbudowanymi, by nie wpuszczać Azjatów do Delty; inni uważają ją za słowo egipskie albo miejsce, które dało nazwę drodze. Jak daleko sięgała pustynia Szur, nie jest jasne: itinerarium w Księdze Liczb nazywa ten sam pierwszy etap po przejściu przez morze: „trzy dni drogi po puszczy Etam”. Mapa zaznacza pustynię północno-zachodniego Synaju na wschód od Kanału Sueskiego, kraj na wschód od północnego krańca Zatoki Sueskiej i, na dalekim końcu drogi, Tel Szaruchen w zachodnim Negewie jako innych kandydatów."
    - "Anioł znalazł Hagar „nad źródłem, przy drodze Sur”, gdy uciekała przed Sarą. Abraham „mieszkał między Kades i między Sur, i był gościem w Gerar”; Izmaelici „mieszkali od Hewila aż do Sur, która leży na przeciwko Egiptowi”. Po przejściu Morza Czerwonego Mojżesz poprowadził Izraela i „weszli w puszczą Sur; a idąc trzy dni przez puszczą, nie znaleźli wody”, aż doszli do Mara. Saul poraził Amalekitów „od Hewila, którędy chodzą do Sur, które jest przeciw Egiptowi”, a Dawid z Siklag napadał na ludy, które od dawna mieszkały w tej ziemi, „którędy chodzą przez Sur aż do ziemi Egipskiej”."
    - "Nic nie wykopano pod tą nazwą, a pustynię znamy z Biblii, egipskich tekstów granicznych i współczesnych badań. Dziś jest to północ egipskiego półwyspu Synaj i wschodni skraj Delty wzdłuż Kanału Sueskiego, przecięty drogą z Ismailii do granicy z Gazą."
  cs:
    - "Šur je poušť na severovýchodní hranici Egypta, krajina mezi nilskou deltou a Negevem, jíž vedla cesta z Beer-šeby do Egypta; Bible praví, že leží „proti Egyptu“, tedy tváří k němu. Jméno v hebrejštině znamená „zeď“ a mnozí je spojují s linií pevností, které egyptské texty Střední říše nazývají Zdi vládce, vystavěné, aby udržely Asiaty mimo Deltu; jiní je pokládají za egyptské slovo nebo za místo, které dalo jméno cestě. Jak daleko poušť Šur sahala, není jasné: itinerář v Numeri nazývá tutéž první etapu po přechodu moře „poušť Etam“. Mapa vyznačuje jako další kandidáty poušť severozápadního Sinaje východně od Suezského průplavu, krajinu východně od severního cípu Suezského zálivu a na vzdáleném konci cesty Tel Šaruchen v západním Negevu."
    - "Anděl nalezl Hagar „u studnice vody na poušti, u studnice té, kteráž jest při cestě Sur“, když utekla Sáře. Abraham „bydlil mezi Kádes a Sur; i byl pohostinu v Gerar“; Jišmaelovci „bydlili od Hevilah až do Sur, jenž jest proti Egyptu“. Po přechodu Rudého moře „hnul pak Mojžíš lidem Izraelským od moře Rudého, a táhli na poušť Sur. I šli tři dni po poušti, a nenalezli vod“, až přišli do Máry. Saul porazil Amalecha „od Hevilah, kudy se chodí do Sur, kteréž jest naproti Egyptu“, a David ze Siklagu podnikal výpady proti národům, které v té zemi bydlely „od starodávna“, „kudy se chodí přes Sur až do země Egyptské“."
    - "Pod tímto jménem nebylo nic vykopáno a poušť je známa z Bible, egyptských hraničních textů a moderního průzkumu. Dnes je to sever egyptského Sinajského poloostrova a východní okraj Delty podél Suezského průplavu, protnutý silnicí z Ismáílíje k hranici s Gazou."
  nl:
    - "Sur is de woestijn aan de noordoostelijke grens van Egypte, het land tussen de Nijldelta en de Negev waardoor de weg van Berseba naar Egypte liep; de Bijbel zegt van Sur dat het “voor aan Egypte is”, dat wil zeggen tegenover Egypte. De naam betekent “muur” in het Hebreeuws, en velen verbinden hem met de lijn van forten die Egyptische teksten uit het Middenrijk de Muren van de Heerser noemen, gebouwd om Aziaten uit de Delta te houden; anderen houden hem voor een Egyptisch woord of een plaats die de weg haar naam gaf. Hoe ver Sur reikte, is onduidelijk: de reisroute in Numeri noemt dezelfde eerste etappe na de oversteek van de zee “in de woestijn Etham”. De kaart wijst de woestijn van het noordwesten van de Sinaï ten oosten van het Suezkanaal aan, met het land ten oosten van de top van de Golf van Suez en, aan het einde van de weg, Tel Saruhen in de westelijke Negev als andere kandidaten."
    - "De engel vond Hagar “aan de fontein op den weg van Sur” toen zij voor Sara vluchtte. Abraham “woonde tussen Kades en tussen Sur; en hij verkeerde als vreemdeling te Gerar”; de Ismaëlieten “woonden van Havila tot Sur toe, hetwelk tegenover Egypte is”. Na de doortocht door de Rode Zee leidde Mozes Israël: “zij trokken uit tot in de woestijn Sur, en zij gingen drie dagen in de woestijn, en vonden geen water” tot zij bij Mara kwamen. Saul sloeg de Amalekieten “van Havila af, tot daar gij komt te Sur, dat voor aan Egypte is”, en David overviel vanuit Siklag de volken die dat land bewoonden, “dat gij gaat naar Sur, en tot aan Egypteland”."
    - "Onder die naam is niets opgegraven, en de woestijn is bekend uit de Bijbel, Egyptische grensteksten en modern onderzoek. Tegenwoordig is het het noorden van Egyptes Sinaïschiereiland en de oostrand van de Delta langs het Suezkanaal, doorkruist door de weg van Ismailia naar de grens van Gaza."
  sv:
    - "Shur är öknen vid Egyptens nordöstra gräns, landet mellan Nildeltat och Negev genom vilket vägen från Beer Sheva till Egypten gick; Bibeln säger att den ligger ”gent emot Egypten”, det vill säga mitt emot det. Namnet betyder ”mur” på hebreiska, och många sätter det i samband med den rad av fästningar som egyptiska texter från Mellersta riket kallar Härskarens murar, uppförda för att hålla asiater borta från deltat; andra anser det vara ett egyptiskt ord eller en plats som gav vägen dess namn. Hur långt Shurs öken sträckte sig är oklart: färdvägen i Fjärde Mosebok kallar samma första etapp efter genomgåendet av havet ”Etams öken”. Kartan markerar öknen i nordvästra Sinai öster om Suezkanalen, med landet öster om Suezbuktens inre del och, vid vägens ytterände, Tel Sharuhen i västra Negev som andra kandidater."
    - "Ängeln fann Hagar ”vid en vattenkälla i öknen, den källa som ligger vid vägen till Sur” när hon flydde från Sara. Om Abraham heter det: ”där uppehöll han sig mellan Kades och Sur, och någon tid bodde han i Gerar”; ismaeliterna ”hade sina boningsplatser från Havila ända till Sur, som ligger gent emot Egypten”. Efter genomgåendet av Röda havet lät Mose Israel bryta upp, och ”de drogo ut i öknen Sur; och tre dagar vandrade de i öknen utan att finna vatten”, tills de kom till Mara. Saul slog amalekiterna och förföljde dem ”från Havila fram emot Sur, som ligger öster om Egypten”, och David plundrade från Siklag de folk som sedan gammalt bodde i det landet, ”fram emot Sur och ända intill Egyptens land”."
    - "Inget har grävts ut under det namnet, och öknen är känd från Bibeln, egyptiska gränstexter och modern kartläggning. I dag är den norra delen av Egyptens Sinaihalvö och deltats östra kant längs Suezkanalen, genomkorsad av vägen från Ismailia till gränsen mot Gaza."
  nb:
    - "Sjur er ørkenen ved Egypts nordøstlige grense, landet mellom Nildeltaet og Negev som veien fra Beer-Sjeba til Egypt gikk gjennom; Bibelen sier at den ligger «midt for Egypten», det vil si vendt mot det. Navnet betyr «mur» på hebraisk, og mange knytter det til linjen av festninger som egyptiske tekster fra Midtre rike kaller Herskerens murer, bygd for å holde asiater ute av deltaet; andre mener det er et egyptisk ord eller et sted som ga veien navn. Hvor langt Sjurs ørken rakk, er uklart: reiseruten i Fjerde Mosebok kaller den samme første etappen etter havovergangen «Etams ørken». Kartet markerer ørkenen i nordvestre Sinai øst for Suezkanalen, med landet øst for innerste del av Suezbukta og, ved veiens ytterende, Tel Saruhen i vestlige Negev som andre kandidater."
    - "Engelen fant Hagar «ved kilden på veien til Sur» da hun flyktet fra Sara. Abraham «bodde mellem Kades og Sur», og siden opholdt han seg en tid i Gerar; ismaelittene «bodde fra Havila til Sur, som ligger midt for Egypten». Etter overgangen over Rødehavet førte Moses Israel ut i ørkenen: «de drog ut i ørkenen Sur; og tre dager drog de frem i ørkenen uten å finne vann», til de kom til Mara. Saul slo amalekittene «fra Havila til bortimot Sur, som ligger østenfor Egypten», og David plyndret fra Siklag folkene som fra gammel tid hadde bodd i det landet «som strekker sig bortimot Sur og helt til Egyptens land»."
    - "Ingenting er utgravd under navnet, og ørkenen er kjent fra Bibelen, egyptiske grensetekster og moderne kartlegging. I dag er den den nordlige delen av Egypts Sinai-halvøy og den østlige kanten av deltaet langs Suezkanalen, krysset av veien fra Ismailia til grensen mot Gasa."
  tl:
    - "Ang Shur ay ang ilang sa hilagang-silangang hangganan ng Egipto, ang lupain sa pagitan ng Delta ng Nilo at ng Negev na dinaraanan ng daan mula Beer-seba patungong Egipto; ayon sa Biblia ay “natatapat sa Egipto”, ibig sabihin, nakaharap. “Pader” ang kahulugan ng pangalan sa Hebreo; iniuugnay ito ng marami sa hanay ng kuta na tinawag ng mga tekstong Ehipsiyo ng Gitnang Kaharian na Mga Pader ng Pinuno, na itinayo upang mapigil ang mga Asyano sa Delta; ayon sa iba, salitang Ehipsiyo ito o lugar na nagbigay ng pangalan sa daan. Hindi malinaw ang abot ng ilang ng Shur: “ilang ng Etham” ang tawag ng Bilang sa gayon ding unang yugto pagkatawid sa dagat. Minamarkahan ng mapa ang disyerto ng hilagang-kanlurang Sinai sa silangan ng Kanal ng Suez; ang iba pang kandidato ay ang lupain sa silangan ng dulo ng Golpo ng Suez at, sa dulo ng daan, ang Tel Saruhen sa kanlurang Negev."
    - "Natagpuan ng anghel si Agar “sa bukal na nasa daang patungo sa Shur” nang siya ay tumakas kay Sara. Si Abraham ay “tumahan sa pagitan ng Cades at Shur; at siya'y nakipamayan sa Gerar”; ang mga Ismaelita ay “nagsisitahan sila mula sa Havila hanggang sa Shur, na natatapat sa Egipto”. Pagkatawid sa Dagat na Pula, pinatnubayan ni Moises ang Israel at sila'y “lumabas sa ilang ng Shur; at sila'y lumakad na tatlong araw sa ilang, at hindi nakasumpong ng tubig” hanggang sa dumating sila sa Mara. Sinaktan ni Saul ang mga Amalecita “mula sa Havila kung patungo ka sa Shur, na nasa tapat ng Egipto”, at mula sa Siclag ay sinalakay ni David ang mga bayang dating naninirahan sa lupaing iyon “gaya ng kung ikaw ay paroroon sa Shur, hanggang sa lupain ng Egipto”."
    - "Walang hinukay sa ilalim ng pangalang ito, at ang ilang ay nakikilala mula sa Biblia, sa mga tekstong Ehipsiyo ng hangganan at sa makabagong sarbey. Ngayon ito ay ang hilaga ng tangway ng Sinai ng Egipto at ang silangang gilid ng Delta sa tabi ng Kanal ng Suez, na tinatawid ng daan mula Ismailia patungo sa hangganan ng Gaza."
  da:
    - "Sjur er ørkenen ved Egyptens nordøstlige grænse, landet mellem Nildeltaet og Negev, som vejen fra Beersheba til Egypten gik igennem; Bibelen siger, at den ligger »foran Ægypten«, det vil sige over for det. Navnet betyder »mur« på hebraisk, og mange sætter det i forbindelse med den række af fæstninger, som egyptiske tekster fra Mellemriget kalder Herskerens Mure, bygget for at holde asiater ude af Deltaet; andre tager det for et egyptisk ord eller for et sted, der gav vejen sit navn. Hvor langt Sjurs ørken rakte, er uklart: vandreberetningen i Numeri kalder den samme første etape efter overgangen over havet »Ethams Ørk«. Kortet markerer ørkenen i det nordvestlige Sinai øst for Suezkanalen, med landet øst for Suezbugtens inderste del og, for enden af vejen, Tel Sharuhen i det vestlige Negev som andre kandidater."
    - "Engelen fandt Hagar »ved en Vandkilde i Ørken, ved den Kilde paa Vejen til Sur«, da hun flygtede fra Sara. Abraham »boede imellem Kades og imellem Sur og var fremmed i Gerar«; ismaelitterne »boede fra Havila indtil Sur, som er foran Ægypten«. Efter overgangen over Det Røde Hav førte Moses Israel videre: »de droge ud til den Ørk Sur, og de vandrede tre Dage i Ørkenen og fandt ikke Vand«, indtil de kom til Mara. Saul slog amalekitterne »fra Hevila indtil man kommer til Sur, som ligger lige for Ægypten«, og David overfaldt fra Siklag de folk, der fra gammel tid havde boet i det land »i Retningen af Schur og indtil Ægyptens Land«."
    - "Intet er udgravet under dette navn, og ørkenen kendes fra Bibelen, egyptiske grænsetekster og moderne undersøgelser. I dag er den den nordlige del af Egyptens Sinai-halvø og Deltaets østlige rand langs Suezkanalen, krydset af vejen fra Ismailia til grænsen mod Gaza."
  sr:
    - "Сур је пустиња на североисточној граници Египта, земља између делте Нила и Негева кроз коју је ишао пут од Вирсавеје у Египат; Библија каже да лежи „према Мисиру“, то јест лицем ка њему. Име на хебрејском значи „зид“ и многи га доводе у везу са низом утврда које египатски текстови Средњег краљевства зову Зидови Владара, подигнутим да Азијате држе даље од делте; други га сматрају египатском речју или местом које је путу дало име. Докле је сезала пустиња Сур, није јасно: у попису станица у Књизи о бројевима исти први ступањ после преласка мора води „преко пустиње Етама“ (Бр 33,8). Карта обележава пустињу северозападног Синаја источно од Суецког канала; као друге кандидате наводи земљу источно од врха Суецког залива и, на другом крају пута, Тел Шарухен у западном Негеву."
    - "Анђео је нашао Агару „код студенца на путу у Сур“ када је бежала од Саре. Аврам је „стани се између Кадиса и Сура; и живеше као дошљак у Герару“; Исмаиљци су „од Евилата до Сура према Мисиру“. После преласка Црвеног мора Мојсије је повео Израиља „у пустињу Сур; и три дана ишавши по пустињи не нађоше воду“ док нису дошли до Мере. Саул је тукао Амалика „од Авиле до Сура, који је према Мисиру“, а Давид је из Сиклага нападао народе који су живели у тој земљи „од Сура па до земље мисирске“."
    - "Под тим именом ништа није ископано, а пустиња је позната из Библије, египатских граничних текстова и савременог истраживања. Данас је то север египатског Синајског полуострва и источни руб делте дуж Суецког канала, кроз који води пут од Исмаилије до границе с Газом."
  hu:
    - "Súr Egyiptom északkeleti határának sivataga, a Nílus-delta és a Negev közötti terület, amelyen át a Beérsebából Egyiptomba vezető út haladt; a Biblia szerint „Égyiptom átellenében” van, azaz szemben vele. A név héberül „falat” jelent, és sokan a Közép-Birodalom egyiptomi szövegeiben az Uralkodó Falainak nevezett erődsorral hozzák kapcsolatba, amelyet az ázsiaiak Deltától való távoltartására építettek; mások egyiptomi szónak, vagy az útnak nevet adó helynek tartják. Súr pusztájának kiterjedése nem világos: a Számok könyvének útleírása a tengeren való átkelés utáni ugyanazon első szakaszról azt mondja, hogy „menének három napi járásnyira az Ethám pusztáján”. A térkép a Szuezi-csatornától keletre fekvő északnyugat-sínai sivatagot jelöli, további jelöltként a Szuezi-öböl csúcsától keletre fekvő vidéket valamint az út túlsó végén fekvő nyugat-negevi Tel Sárúhent."
    - "Az Úr angyala Hágárt, amikor Sára elől megszökött, „egy forrásnál a pusztában, annál a forrásnál, a mely a Súrba menő úton van” találta meg. Ábrahám „letelepedék Kádes és Súr között, és tartózkodék Gérárban”; az ismáeliták „Havilától fogva Súrig” laktak, „a mely Égyiptom átellenében van”. A Vörös-tengeren való átkelés után Mózes Izráelt „Súr puszta felé” vezette; „három napig menének a pusztában és nem találának vizet”, míg el nem jutottak Márába. Saul az amálekitákat „Havilától fogva egészen addig, a merre Súrba mennek, mely Égyiptom átellenében van” verte meg, Dávid pedig Ciklagból azokat a népeket fosztogatta, amelyek annak a földnek lakosai voltak, „a melyen Súrba mégy egészen Égyiptom földéig”."
    - "A név alatt semmit sem ástak ki, és a sivatagot a Bibliából, az egyiptomi határszövegekből és a modern felmérésekből ismerjük. Ma Egyiptom Sínai-félszigetének északi része és a Delta keleti széle a Szuezi-csatorna mentén, amelyet az Iszmáilijából a gázai határhoz vezető út szel át."
  fi:
    - "Sur on Egyptin koillisrajan aavikko, Niilin suiston ja Negevin välinen maa, jonka halki kulki tie Beersebasta Egyptiin; Raamattu sanoo sen sijaitsevan Egyptin edessä eli sitä vastapäätä. Nimi merkitsee heprean kielessä ”muuria”, ja monet yhdistävät sen linnakkeiden jonoon, jota Keskivaltakunnan egyptiläiset tekstit kutsuvat Hallitsijan muureiksi ja joka rakennettiin pitämään aasialaiset poissa suistosta; toiset pitävät sitä egyptiläisenä sanana tai paikkana, joka antoi nimensä tielle. Kuinka pitkälle Surin erämaa ulottui, on epäselvää: Neljännen Mooseksen kirjan reittiluettelo kutsuu samaa meren ylityksen jälkeistä ensimmäistä vaihetta nimellä Etamin erämaa. Kartalla on merkitty Luoteis-Siinain autiomaa Suezin kanavan itäpuolella; muita ehdokkaita ovat Suezinlahden pohjukan itäpuolinen alue ja tien toisessa päässä Tel Saruhen läntisessä Negevissä."
    - "Enkeli tapasi Hagarin ”lähteen luota, joka on Suurin tien varressa”, kun tämä pakeni Saaraa. Abraham ”asettui Kaadeksen ja Suurin välimaille; ja hän asui jonkun aikaa Gerarissa”; ismaelilaiset ”asuivat Havilasta aina Suuriin asti, joka on Egyptistä itään päin”. Punaisenmeren ylityksen jälkeen Mooses vei Israelin, ja ”he menivät Suurin erämaahan. Ja he vaelsivat kolme päivää erämaassa löytämättä vettä”, kunnes tulivat Maaraan. Saul voitti amalekilaiset ja ajoi heitä takaa ”Havilasta Suuriin päin, joka on Egyptistä itään päin”, ja Daavid teki Siklagista ryöstöretkiä niiden kansojen maahan, jotka asuivat siinä maassa, joka muinoin ”ulottui Suuriin päin ja Egyptin maahan asti”."
    - "Mitään ei ole kaivettu esiin tällä nimellä, ja aavikko tunnetaan Raamatusta, egyptiläisistä rajateksteistä ja nykyaikaisesta kartoituksesta. Nykyisin se on Egyptin Siinain niemimaan pohjoisosa ja Niilin suiston itäreuna Suezin kanavan varrella, jonka halki kulkee tie Ismailiasta Gazan rajalle."
  vi:
    - "Su-rơ là hoang mạc ở biên giới đông bắc Ê-díp-tô, vùng đất giữa châu thổ sông Ni-lơ và Nê-ghép mà con đường từ Bê-e-Sê-ba đến Ê-díp-tô băng qua; Kinh Thánh nói nó “đối ngang Ê-díp-tô”, nghĩa là quay mặt về xứ ấy. Tên này trong tiếng Hê-bơ-rơ nghĩa là “bức tường”, và nhiều người liên hệ với tuyến pháo đài mà các văn bản Ai Cập thời Trung Vương quốc gọi là Các Bức Tường của Người Cai Trị, xây để ngăn người châu Á vào châu thổ; người khác cho đó là một từ Ai Cập hay một địa điểm đã đặt tên cho con đường. Đồng vắng Su-rơ trải dài đến đâu thì không rõ: lộ trình trong sách Dân Số Ký gọi chính chặng đầu tiên sau khi qua biển là “đồng vắng Ê-tam”. Bản đồ đánh dấu hoang mạc tây bắc Sinai phía đông kênh đào Suez, với vùng đất phía đông đầu vịnh Suez và, ở tận cuối con đường, Tel Sharuhen ở tây Nê-ghép như những ứng viên khác."
    - "Thiên sứ gặp A-ga “gần bên suối nước, nơi mé đường đi về Su-rơ” khi nàng chạy trốn khỏi Sa-ra. Áp-ra-ham “kiều ngụ tại Ghê-ra, ở về giữa khoảng Ca-đe và Su-rơ”; người Ích-ma-ên ở “từ Ha-vi-la cho đến Xu-xơ, đối ngang Ê-díp-tô”. Sau khi qua Biển Đỏ, Môi-se dẫn Y-sơ-ra-ên “đến nơi đồng vắng Su-rơ; trọn ba ngày đi trong đồng vắng, kiếm chẳng được nước đâu cả”, cho đến khi tới Ma-ra. Sau-lơ đánh dân A-ma-léc “từ Ha-vi-la cho đến Su-rơ, đối ngang xứ Ê-díp-tô”, và Đa-vít từ Xiếc-lác cướp phá các dân đã sống từ lâu trong miền ấy, “ở miền lân cận Su-rơ cho đến xứ Ê-díp-tô”."
    - "Chưa có cuộc khai quật nào dưới tên này, và hoang mạc được biết qua Kinh Thánh, các văn bản biên giới Ai Cập và khảo sát hiện đại. Ngày nay đó là phía bắc bán đảo Sinai của Ai Cập và rìa đông của châu thổ dọc kênh đào Suez, được con đường từ Ismailia đến biên giới Ga-xa băng qua."
  ro:
    - "Șur este deșertul de la granița nord-estică a Egiptului, ținutul dintre Delta Nilului și Neghev prin care trecea drumul de la Beer-Șeba spre Egipt; Biblia spune că se află „înaintea feții Eghipetului”, adică în fața lui. Numele înseamnă „zid” în ebraică, iar mulți îl leagă de șirul de forturi pe care textele egiptene din Regatul Mijlociu îl numesc Zidurile Stăpânitorului, ridicat ca să țină asiaticii departe de Deltă; alții îl socotesc un cuvânt egiptean sau un loc care a dat numele drumului. Cât de departe ajungea pustia Șur nu este clar: itinerarul din Numeri numește pustia Etam aceeași primă etapă de după trecerea mării. Harta marchează deșertul din nord-vestul Sinaiului, la est de Canalul Suez, iar ca alți candidați ținutul de la est de capătul Golfului Suez și, la capătul îndepărtat al drumului, Tel Sharuhen din Neghevul de vest."
    - "Îngerul a găsit-o pe Agar „la izvorul cel din calea lui Sur” când fugea de Sara. Avraam a locuit între Cades și Șur și a poposit în Gherar; ismaeliții au locuit de la Havila până la Șur, care este înaintea Egiptului. După trecerea Mării Roșii, Moise l-a dus pe Israel „în pustia Sur, și a mers trei zile în pustie și n’au aflat apă să beà”, până au ajuns la Mara. Saul i-a lovit pe amaleciți de la Havila până la Șur, care este în fața Egiptului, iar David a năvălit din Țiclag asupra popoarelor care locuiau în acea țară „dela Ghelamsur și până la pământul Eghipetului”."
    - "Nimic nu a fost săpat sub acest nume, iar deșertul este cunoscut din Biblie, din textele egiptene de frontieră și din cercetările moderne. Astăzi este nordul peninsulei Sinai a Egiptului și marginea estică a Deltei de-a lungul Canalului Suez, străbătute de drumul de la Ismailia la granița cu Gaza."
  bg:
    - "Сур е пустинята на североизточната граница на Египет — страната между делтата на Нил и Негев, през която минавал пътят от Вирсавия за Египет; Библията казва, че тя лежи „срещу Египет“, тоест с лице към него. Името означава „стена“ на еврейски и мнозина го свързват с линията от крепости, които египетските текстове от Средното царство наричат Стените на владетеля, построени, за да не допускат азиатците в Делтата; други го смятат за египетска дума или за място, дало името си на пътя. Докъде е стигала пустинята Сур, не е ясно: маршрутът в Числа нарича същия първи етап след преминаването на морето „пустинята Етам“. Картата отбелязва пустинята в северозападен Синай източно от Суецкия канал, а като други кандидати — областта източно от северния край на Суецкия залив и, в далечния край на пътя, Тел Шарухен в западния Негев."
    - "Ангелът намерил Агар „близу при извора на пътя към Сур“, когато тя бягала от Сара. Авраам „насели се между Кадис и Сур, и стана пришлец в Герар“; потомците на Исмаил „се населиха от Евила до Сур, който е срещу Египет“. След преминаването на Червено море Мойсей повел Израил и те „излязоха към пустинята Сур; и ходиха три дни в пустинята, и не намерваха вода“, докато стигнали до Мера. Саул поразил амаликитяните „от Евила до входа на Сур, срещу Египет“, а Давид от Циклаг нападал народите, които живеели в тази земя „от входа на Сур и дори до Египетската земя“."
    - "Под това име нищо не е разкопавано и пустинята е позната от Библията, египетските гранични текстове и съвременни проучвания. Днес това е северът на египетския Синайски полуостров и източният край на Делтата покрай Суецкия канал, пресичан от пътя от Исмаилия до границата с Газа."
