# Overview article (ADR 0007). Mainstream facts only; the meaning of the name and the extent of the wilderness are given as uncertain.
id: shur
place: acdbce0
title:
  en: "Shur"
  ru: "Сур"
  uk: "Сур"
  es: "Shur"
  pt: "Sur"
  de: "Schur"
  fr: "Schur"
body:
  en:
    - "Shur is the desert on the north-eastern frontier of Egypt, the country between the Nile Delta and the Negev through which the road from Beersheba to Egypt ran; the Bible says it lies “before Egypt”, that is, facing it. The name means “wall” in Hebrew, and many connect it with the line of forts that Egyptian texts of the Middle Kingdom call the Walls of the Ruler, built to keep Asiatics out of the Delta; others take it for an Egyptian word or a place that gave its name to the road. How far the wilderness of Shur reached is unclear: the itinerary in Numbers calls the same first stage after the crossing of the sea “the wilderness of Etham”. The map marks the sands of north-western Sinai near the Suez Canal, with the gulf shore south of Suez and, at the far end of the road, Tel Sharuhen in the western Negev as other candidates."
    - "The angel found Hagar “by the fountain in the way to Shur” when she fled from Sarah. Abraham “dwelled between Kadesh and Shur, and sojourned in Gerar”; the Ishmaelites “dwelt from Havilah unto Shur, that is before Egypt”. After the crossing of the Red Sea Moses led Israel “into the wilderness of Shur; and they went three days in the wilderness, and found no water” until they came to Marah. Saul smote the Amalekites “from Havilah until thou comest to Shur, that is over against Egypt”, and David from Ziklag raided the peoples who had lived in that land “as thou goest to Shur, even unto the land of Egypt”."
    - "Nothing has been excavated under the name, and the desert is known from the Bible, Egyptian frontier texts and modern survey. Today it is the north of Egypt's Sinai peninsula and the eastern edge of the Delta along the Suez Canal, crossed by the road from Ismailia to the Gaza border."
  ru:
    - "Сур — пустыня на северо-восточной границе Египта, страна между дельтой Нила и Негевом, через которую шла дорога из Вирсавии в Египет; Библия говорит, что она лежит «пред Египтом», то есть напротив него. По-еврейски имя значит «стена», и многие связывают его с цепью крепостей, которую египетские тексты Среднего царства зовут Стенами Правителя, — её построили, чтобы не пускать азиатов в Дельту; другие видят в нём египетское слово или название места, давшего имя дороге. Как далеко простиралась пустыня Сур, неясно: перечень станов в книге Чисел называет тот же первый переход после моря «пустынею Ефам». На карте отмечены пески северо-западного Синая у Суэцкого канала, а как другие варианты — берег залива южнее Суэца и, на дальнем конце дороги, Тель-Шарухен в западном Негеве."
    - "Ангел нашёл Агарь, бежавшую от Сарры, «у источника на дороге к Суру». Авраам «поселился между Кадесом и между Суром; и был на время в Гераре»; Измаильтяне «жили от Хавилы до Сура, что пред Египтом». После перехода через Чермное море Моисей повёл Израильтян в пустыню Сур, «и шли они три дня по пустыне и не находили воды», пока не пришли в Мерру. Саул поразил Амалика «от Хавилы до окрестностей Сура, что пред Египтом», а Давид из Секелага нападал на народы, которые издавна населяли эту страну «до Сура и даже до земли Египетской»."
    - "Под этим именем ничего не раскопано, и пустыня известна по Библии, египетским пограничным текстам и современным обследованиям. Сегодня это север египетского Синая и восточный край Дельты вдоль Суэцкого канала, где проходит дорога из Исмаилии к границе Газы."
  uk:
    - "Сур — пустеля на північно-східному кордоні Єгипту, край між дельтою Нілу й Негевом, яким ішла дорога з Беер-Шеви до Єгипту; Біблія каже, що вона лежить «проти Египту», тобто навпроти нього. Назва єврейською означає «мур», і багато хто пов'язує її з лінією фортів, яку єгипетські тексти Середнього царства називають Стінами Володаря, збудованими, щоб не пускати азіатів у дельту; інші вважають її єгипетським словом або місцем, що дало назву дорозі. Як далеко сягала пустеля Сур, неясно: у переліку стоянок у Числах той самий перший етап після переходу через море названо «степом Етам». Карта позначає піски північно-західного Синаю поблизу Суецького каналу, а як інших кандидатів — берег затоки на південь від Суеца та, на дальньому кінці дороги, Тель-Шарухен у західному Негеві."
    - "Ангел знайшов Агар «коло криницї в пустинї, по дорозї в Сур», коли вона втікала від Сарри. Авраам «оселивсь між Кадесом і Суром, і якийсь час пробував у Герарі»; ізмаїльтяни жили «від Гавили до Сура, що проти Египту». Після переходу Червоного моря Мойсей повів Ізраїль до пустелі Сур; вони «йшли три днї степом, та й не знаходили води», доки не дійшли до Мерри. Саул побив амалекитян «від Хавили та й до Сира, що навпроти Египту», а Давид із Ціклагу нападав на народи, що «здавна жили в тій землї аж до Суру й до Египту»."
    - "Під цією назвою нічого не розкопано, а пустеля відома з Біблії, єгипетських прикордонних текстів і сучасних обстежень. Сьогодні це північ Синайського півострова в Єгипті та східний край дельти вздовж Суецького каналу, яким проходить дорога з Ісмаїлії до кордону з Газою."
  es:
    - "Shur es el desierto de la frontera nororiental de Egipto, el país entre el delta del Nilo y el Néguev por donde corría el camino de Beerseba a Egipto; la Biblia dice que está «enfrente de Egipto», es decir, frente a él. El nombre significa «muro» en hebreo, y muchos lo relacionan con la línea de fuertes que los textos egipcios del Reino Medio llaman los Muros del Gobernante, construidos para impedir la entrada de asiáticos en el Delta; otros lo toman por una palabra egipcia o por un lugar que dio su nombre al camino. Hasta dónde llegaba el desierto de Shur no está claro: el itinerario de Números llama a la misma primera etapa tras el cruce del mar «el desierto de Etham». El mapa señala las arenas del noroeste del Sinaí cerca del canal de Suez, con la orilla del golfo al sur de Suez y, en el extremo del camino, Tel Saruhén en el Néguev occidental como otros candidatos."
    - "El ángel halló a Agar «junto á la fuente que está en el camino del Sur» cuando huía de Sara. Abraham «asentó entre Cades y Shur, y habitó como forastero en Gerar»; los ismaelitas «habitaron desde Havila hasta Shur, que está enfrente de Egipto». Tras el cruce del mar Rojo Moisés condujo a Israel, que «salieron al desierto de Shur; y anduvieron tres días por el desierto sin hallar agua», hasta llegar a Mara. Saúl hirió a los amalecitas «desde Havila hasta llegar á Shur, que está á la frontera de Egipto», y David, desde Siclag, hizo incursiones contra los pueblos que habitaban aquella tierra «desde como se va á Shur hasta la tierra de Egipto»."
    - "Nada se ha excavado bajo este nombre, y el desierto se conoce por la Biblia, los textos fronterizos egipcios y la prospección moderna. Hoy es el norte de la península egipcia del Sinaí y el borde oriental del Delta a lo largo del canal de Suez, cruzado por la carretera de Ismailia a la frontera de Gaza."
  pt:
    - "Sur é o deserto na fronteira nordeste do Egito, o país entre o Delta do Nilo e o Neguebe por onde corria a estrada de Berseba ao Egito; a Bíblia diz que fica “diante do Egito”, isto é, de frente para ele. O nome significa “muro” em hebraico, e muitos o ligam à linha de fortes que textos egípcios do Reino Médio chamam Muros do Governante, construídos para manter os asiáticos fora do Delta; outros o tomam por uma palavra egípcia ou por um lugar que deu nome à estrada. Até onde chegava o deserto de Sur não é claro: o itinerário de Números chama a mesma primeira etapa depois da travessia do mar “deserto de Etã”. O mapa marca as areias do noroeste do Sinai perto do Canal de Suez, com a margem do golfo ao sul de Suez e, na ponta da estrada, Tel Sharuhen, no Neguebe ocidental, como outros candidatos."
    - "O anjo achou Agar “junto à fonte no caminho de Sur” quando ela fugiu de Sara. Abraão “habitou entre Cades e Sur. Ele viveu como estrangeiro em Gerar”; os ismaelitas “habitaram desde Havilá até Sur, que fica diante do Egito”. Depois da travessia do Mar Vermelho, Moisés conduziu Israel, e “eles saíram para o deserto de Sur; e caminharam três dias no deserto, e não encontraram água” até chegarem a Mara. Saul feriu os amalequitas “desde Havilá até chegar a Sur, que fica a leste do Egito”, e Davi, a partir de Ziclague, atacou os povos que desde tempos antigos habitavam aquela terra “na direção de Sur até a terra do Egito”."
    - "Nada foi escavado sob esse nome, e o deserto é conhecido pela Bíblia, por textos egípcios de fronteira e por prospecção moderna. Hoje é o norte da península egípcia do Sinai e a orla leste do Delta ao longo do Canal de Suez, cruzada pela estrada de Ismaília à fronteira de Gaza."
  de:
    - "Schur ist die Wüste an der nordöstlichen Grenze Ägyptens, das Land zwischen dem Nildelta und dem Negev, durch das die Straße von Beerscheba nach Ägypten verlief; die Bibel sagt, sie liege „vor Ägypten“, also ihm gegenüber. Der Name bedeutet auf Hebräisch „Mauer“, und viele verbinden ihn mit der Linie von Forts, die ägyptische Texte des Mittleren Reiches die Mauern des Herrschers nennen, gebaut, um Asiaten vom Delta fernzuhalten; andere halten ihn für ein ägyptisches Wort oder einen Ort, der der Straße den Namen gab. Wie weit die Wüste Schur reichte, ist unklar: Die Stationenliste der Numeri nennt dieselbe erste Etappe nach dem Durchzug durch das Meer „die Wüste Etam“. Die Karte markiert die Sande des nordwestlichen Sinai nahe dem Sueskanal, mit der Golfküste südlich von Sues und, am fernen Ende der Straße, Tel Scharuhen im westlichen Negev als weiteren Kandidaten."
    - "Der Engel fand Hagar „bei dem Brunnen am Wege gen Sur“, als sie vor Sara floh. Abraham „wohnte zwischen Kades und Sur und ward ein Fremdling zu Gerar“; die Ismaeliter „wohnten von Hevila an bis gen Sur vor Ägypten“. Nach dem Durchzug durch das Rote Meer führte Mose Israel „zur Wüste Sur. Und sie wanderten drei Tage in der Wüste, daß sie kein Wasser fanden“, bis sie nach Mara kamen. Saul schlug die Amalekiter „von Hevila an bis gen Sur, das vor Ägypten liegt“, und David überfiel von Ziklag aus die Völker, die in jenem Land gewohnt hatten, „wo man kommt gen Sur bis an Ägyptenland“."
    - "Unter dem Namen wurde nichts ausgegraben, und die Wüste ist aus der Bibel, ägyptischen Grenztexten und moderner Vermessung bekannt. Heute ist sie der Norden der ägyptischen Sinai-Halbinsel und der Ostrand des Deltas am Sueskanal, durchquert von der Straße von Ismailia zur Grenze von Gaza."
  fr:
    - "Schur est le désert de la frontière nord-est de l’Égypte, le pays entre le delta du Nil et le Négev que traversait la route de Beer-Schéba à l’Égypte ; la Bible dit qu’il est « en face de l’Égypte ». Le nom signifie « mur » en hébreu, et beaucoup le rattachent à la ligne de forts que les textes égyptiens du Moyen Empire appellent les Murs du Souverain, bâtis pour tenir les Asiatiques hors du Delta ; d’autres y voient un mot égyptien ou un lieu qui aurait donné son nom à la route. Jusqu’où s’étendait le désert de Schur n’est pas clair : l’itinéraire des Nombres appelle la même première étape après la traversée de la mer « le désert d’Étham ». La carte marque les sables du nord-ouest du Sinaï près du canal de Suez, avec le rivage du golfe au sud de Suez et, au bout de la route, Tel Scharuchen dans le Négev occidental comme autres candidats."
    - "L’ange trouva Agar « près de la source qui est sur le chemin de Schur » quand elle fuyait Sara. Abraham « s’établit entre Kadès et Schur, et fit un séjour à Guérar » ; les Ismaélites « habitèrent depuis Havila jusqu’à Schur, qui est en face de l’Égypte ». Après la traversée de la mer Rouge, Moïse mena Israël vers « le désert de Schur ; et, après trois journées de marche dans le désert, ils ne trouvèrent point d’eau » jusqu’à Mara. Saül battit Amalek « depuis Havila jusqu’à Schur, qui est en face de l’Égypte », et David, depuis Tsiklag, razzia les peuples qui habitaient ce pays « du côté de Schur et jusqu’au pays d’Égypte »."
    - "Rien n’a été fouillé sous ce nom, et le désert est connu par la Bible, les textes égyptiens de frontière et les prospections modernes. Aujourd’hui, c’est le nord de la péninsule égyptienne du Sinaï et le bord est du Delta le long du canal de Suez, traversé par la route d’Ismaïlia à la frontière de Gaza."
