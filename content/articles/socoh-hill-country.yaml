body:
  en:
    - "This Socoh was a town in the hill country of Judah south-west of Hebron, listed in the first hill-country district with Shamir and Jattir: “And in the mountains, Shamir, and Jattir, and Socoh”. It is a different town from the better-known Socoh of the Shephelah, by the valley of Elah, where the Philistines camped before David fought Goliath. It is identified with Khirbet Shuweikeh, a large ruin on a low hill about 16 km south-west of Hebron in today's West Bank, with many caves, rock-cut cisterns and dressed stones; E. W. G. Masterman judged the identification certain."
    - "Socoh is one of the four names stamped, with the words lmlk, “belonging to the king”, on the handles of the royal storage jars of Judah from the late eighth century BC, together with Hebron, Ziph and the unexplained mmšt. Which Socoh is meant is debated: A. F. Rainey, who took the jars to come from four royal wineries in the Judean hill country, looked to this Socoh, in the same southern hills as Hebron and Ziph; N. Na'aman placed the Socoh of the stamps north-west of Hebron, in the Shephelah."
  ru:
    - "Это Сохо — город в горах Иудеи к юго-западу от Хеврона, названный в первом горном округе вместе с Шамиром и Иаттиром: «На горах: Шамир, Иаттир и Сохо». Это другой город, не более известный Сохо в Шефеле у долины дуба, где филистимляне стояли станом перед боем Давида с Голиафом. Его отождествляют с Хирбет-Шувейке — большими развалинами на низком холме примерно в 16 км к юго-западу от Хеврона, на нынешнем Западном берегу, со множеством пещер, высеченных в скале цистерн и тёсаных камней; Э. У. Г. Мастерман считал это отождествление несомненным."
    - "Сохо — одно из четырёх имён, оттиснутых вместе со словами lmlk, «принадлежит царю», на ручках царских кувшинов-хранилищ Иудеи конца VIII в. до н. э., рядом с Хевроном, Зифом и необъяснённым mmšt. Какой Сохо имеется в виду, спорно: Э. Ф. Рейни, считавший, что кувшины шли из четырёх царских виноделен в Иудейских горах, видел здесь этот Сохо, лежащий в тех же южных горах, что Хеврон и Зиф; Н. Нааман помещал Сохо печатей к северо-западу от Хеврона, в Шефеле."
  fr:
    - "Ce Soco était une ville de la montagne de Juda, au sud-ouest d’Hébron, citée dans le premier district de la montagne avec Schamir et Jatthir : « Dans la montagne : Schamir, Jatthir, Soco ». C’est une ville différente du Soco mieux connu de la Shéphéla, près de la vallée d’Éla, où les Philistins campèrent avant que David combatte Goliath. On l’identifie avec Khirbet Shuweikeh, grande ruine sur une basse colline à environ 16 km au sud-ouest d’Hébron, dans l’actuelle Cisjordanie, avec de nombreuses grottes, des citernes taillées dans le roc et des pierres appareillées ; E. W. G. Masterman jugeait l’identification certaine."
    - "Soco est l’un des quatre noms estampillés, avec le mot lmlk, « appartenant au roi », sur les anses des jarres de stockage royales de Juda depuis la fin du VIIIe siècle av. J.-C., avec Hébron, Ziph et le mmšt inexpliqué. Quel Soco est visé est débattu : A. F. Rainey, qui tenait les jarres pour issues de quatre vignobles royaux des collines de Judée, pensait à ce Soco, dans les mêmes collines méridionales qu’Hébron et Ziph ; N. Na’aman plaçait le Soco des estampilles au nord-ouest d’Hébron, dans la Shéphéla."
  it:
    - "Questa Soco era una città dei monti di Giuda a sud-ovest di Ebron, elencata nel primo distretto montuoso con Samir e Iattir: «Nella contrada montuosa: Shanoir, Iattir, Soco». È una città diversa dalla più nota Soco della Sefela, presso la valle di Ela, dove i Filistei si accamparono prima che Davide combattesse Golia. È identificata con Khirbet Shuweikeh, una grande rovina su una bassa collina a circa 16 km a sud-ovest di Ebron, nell’odierna Cisgiordania, con molte grotte, cisterne scavate nella roccia e pietre squadrate; E. W. G. Masterman giudicò certa l’identificazione."
    - "Soco è uno dei quattro nomi impressi, con le parole lmlk, «appartenente al re», sulle anse delle giare regie da magazzino di Giuda dalla fine dell’VIII secolo a.C., insieme a Ebron, Zif e all’inspiegato mmšt. Quale Soco sia intesa è discusso: A. F. Rainey, che riteneva le giare provenienti da quattro cantine regie sui monti di Giuda, guardava a questa Soco, nelle stesse colline meridionali di Ebron e Zif; N. Na‘aman collocò la Soco dei bolli a nord-ovest di Ebron, nella Sefela."
  uk:
    - "Це Сохо було містом у юдейських горах на південний захід від Хеврона, названим у першому окрузі гір разом із Шаміром і Яттіром: «По горах же: Самир, Яттир і Сохо». Це інше місто, ніж краще відоме Сохо в Шефелі, біля долини Ела, де филистимляни отаборилися перед тим, як Давид бився з Голіятом. Його ототожнюють з Хірбет-Шувейке, великою руїною на низькому пагорбі приблизно за 16 км на південний захід від Хеврона на нинішньому Західному березі, з багатьма печерами, висіченими в скелі цистернами та обтесаним камінням; Е. В. Дж. Мастерман вважав ототожнення певним."
    - "Сохо — одна з чотирьох назв, відбитих разом зі словом lmlk, «належить цареві», на ручках царських комірних глеків Юди з кінця VIII ст. до н. е., поряд із Хевроном, Зіфом і незрозумілим mmšt. Яке саме Сохо мається на увазі, обговорюють: А. Ф. Рейні, який вважав, що глеки походять із чотирьох царських виноробень у юдейських горах, мав на увазі це Сохо, в тих самих південних горах, що й Хеврон та Зіф; Н. Нааман розмістив Сохо печаток на північний захід від Хеврона, в Шефелі."
  es:
    - "Este Soco era una ciudad de la región montañosa de Judá, al suroeste de Hebrón, enumerada en el primer distrito de la sierra con Samir y Jatir: «Y en las montañas, Samir, y Jattir, y Succoth». Es una ciudad distinta de la más conocida Soco de la Sefelá, junto al valle de Ela, donde acamparon los filisteos antes de que David luchara con Goliat. Se identifica con Khirbet Shuweikeh, una gran ruina sobre una colina baja a unos 16 km al suroeste de Hebrón, en la actual Cisjordania, con muchas cuevas, cisternas excavadas en la roca y sillares labrados; E. W. G. Masterman juzgó cierta la identificación."
    - "Soco es uno de los cuatro nombres estampados, con las palabras lmlk, «perteneciente al rey», en las asas de las jarras reales de almacenamiento de Judá desde fines del siglo VIII a. C., junto con Hebrón, Zif y el inexplicado mmšt. Se debate a qué Soco se refiere: A. F. Rainey, que entendía que las jarras procedían de cuatro bodegas reales de la región montañosa de Judea, se inclinó por este Soco, en las mismas colinas meridionales que Hebrón y Zif; N. Na'aman situó el Soco de los sellos al noroeste de Hebrón, en la Sefelá."
  nl:
    - "Dit Socho was een stad in het bergland van Juda ten zuidwesten van Hebron, vermeld in het eerste bergdistrict met Samir en Jattir: “Op het gebergte nu: Samir, en Jatthir, en Socho”. Het is een andere stad dan het bekendere Socho van de Sefela, bij de vallei van Ela, waar de Filistijnen kampeerden voordat David met Goliat vocht. Het wordt vereenzelvigd met Khirbet Shuweikeh, een grote ruïne op een lage heuvel ongeveer 16 km ten zuidwesten van Hebron op de huidige Westelijke Jordaanoever, met veel grotten, in de rots uitgehouwen cisternen en bewerkte stenen; E. W. G. Masterman achtte de gelijkstelling zeker."
    - "Socho is een van de vier namen die, met de woorden lmlk, “behorend aan de koning”, zijn gestempeld op de handvatten van de koninklijke voorraadkruiken van Juda vanaf de late achtste eeuw v.Chr., samen met Hebron, Zif en het onverklaarde mmšt. Welk Socho bedoeld is, wordt besproken: A. F. Rainey, die meende dat de kruiken afkomstig waren van vier koninklijke wijnmakerijen in het Judese bergland, dacht aan dit Socho, in dezelfde zuidelijke heuvels als Hebron en Zif; N. Na'aman plaatste het Socho van de stempels ten noordwesten van Hebron, in de Sefela."
  pl:
    - "To Soko było miastem w górach Judy na południowy zachód od Hebronu, wymienionym w pierwszym okręgu górskim wraz z Szamir i Jattir: „A na górze leżą Sam, i Jeter, i Soko”. Jest to inne miasto niż lepiej znane Soko w Szefeli, nad doliną Ela, gdzie Filistyni obozowali, zanim Dawid walczył z Goliatem. Utożsamia się je z Chirbet Szuwejka, dużą ruiną na niskim wzgórzu około 16 km na południowy zachód od Hebronu na dzisiejszym Zachodnim Brzegu, z wieloma jaskiniami, cysternami wykutymi w skale i ciosanymi kamieniami; E. W. G. Masterman uznał to utożsamienie za pewne."
    - "Soko jest jedną z czterech nazw odciskanych, ze słowami lmlk, „należące do króla”, na uchwytach królewskich dzbanów magazynowych Judy od końca VIII w. p.n.e., obok Hebronu, Zif i niewyjaśnionego mmšt. Które Soko ma się na myśli, jest przedmiotem sporu: A. F. Rainey, który uważał, że dzbany pochodzą z czterech królewskich wytwórni wina w górach judzkich, wskazywał to Soko, w tych samych południowych wzgórzach co Hebron i Zif; N. Na'aman umieścił Soko z pieczęci na północny zachód od Hebronu, w Szefeli."
  cs:
    - "Toto Sókó bylo město v judském pohoří jihozápadně od Hebronu, uvedené v prvním okrese pohoří se Šamirem a Jatirem: „A na horách: Samir, Jeter a Socho“. Je to jiné město než známější Sókó v Šefele, u údolí Éla, kde se Pelištejci utábořili, než David bojoval s Goliášem. Ztotožňuje se s Chirbet Šuvejke, velkou zříceninou na nízkém návrší asi 16 km jihozápadně od Hebronu v dnešním Západním břehu, s mnoha jeskyněmi, cisternami vytesanými ve skále a opracovanými kameny; E. W. G. Masterman považoval ztotožnění za jisté."
    - "Sókó je jedno ze čtyř jmen vyrytých razítkem, se slovy lmlk, „patřící králi“, na uchách královských zásobních džbánů Judy od konce osmého století př. n. l., spolu s Hebronem, Zífem a nevysvětleným mmšt. Které Sókó je míněno, je sporné: A. F. Rainey, který pokládal džbány za pocházející ze čtyř královských vinařství v judském pohoří, hledal toto Sókó, ve stejných jižních horách jako Hebron a Zíf; N. Na'aman kladl Sókó z razítek severozápadně od Hebronu, do Šefely."
  pt:
    - "Esta Socó era uma cidade na região montanhosa de Judá, a sudoeste de Hebrom, listada no primeiro distrito da região montanhosa com Samir e Jatir: “Na região montanhosa: Samir, Jatir, Socó”. É uma cidade diferente da mais conhecida Socó da Sefelá, junto ao vale de Elá, onde os filisteus acamparam antes de Davi lutar contra Golias. É identificada com Khirbet Shuweikeh, uma grande ruína sobre uma colina baixa cerca de 16 km a sudoeste de Hebrom, na atual Cisjordânia, com muitas cavernas, cisternas escavadas na rocha e pedras lavradas; E. W. G. Masterman julgou a identificação certa."
    - "Socó é um dos quatro nomes estampados, com as palavras lmlk, “pertencente ao rei”, nas alças das jarras reais de armazenamento de Judá a partir do final do século VIII a.C., junto com Hebrom, Zife e o inexplicado mmšt. Qual Socó se tem em vista é debatido: A. F. Rainey, que tomou as jarras como procedentes de quatro vinícolas reais da região montanhosa de Judá, voltou-se para esta Socó, nas mesmas colinas do sul que Hebrom e Zife; N. Na'aman situou a Socó dos carimbos a noroeste de Hebrom, na Sefelá."
  de:
    - "Dieses Socho war eine Stadt im Bergland von Juda südwestlich von Hebron, im ersten Bergland-Bezirk mit Schamir und Jattir aufgeführt: „Auf dem Gebirge aber war Samir, Jatthir, Socho“. Es ist eine andere Stadt als das bekanntere Socho der Schefela, am Elatal, wo die Philister lagerten, bevor David gegen Goliat kämpfte. Es wird mit Chirbet Schuweike gleichgesetzt, einer großen Ruine auf einem niedrigen Hügel etwa 16 km südwestlich von Hebron im heutigen Westjordanland, mit vielen Höhlen, in den Fels gehauenen Zisternen und behauenen Steinen; E. W. G. Masterman hielt die Gleichsetzung für sicher."
    - "Socho ist einer der vier Namen, die zusammen mit den Worten lmlk, „dem König gehörig“, auf die Henkel der königlichen Vorratskrüge Judas seit dem späten achten Jahrhundert v. Chr. gestempelt wurden, neben Hebron, Sif und dem ungeklärten mmšt. Welches Socho gemeint ist, ist umstritten: A. F. Rainey, der die Krüge aus vier königlichen Weinkellereien im judäischen Bergland herleitete, dachte an dieses Socho, in denselben südlichen Bergen wie Hebron und Sif; N. Na'aman setzte das Socho der Stempel nordwestlich von Hebron in der Schefela an."
  sv:
    - "Detta Soko var en stad i Judas bergsbygd sydväst om Hebron, upptagen i det första distriktet i bergsbygden tillsammans med Shamir och Jattir: ”Och i Bergsbygden: Samir, Jattir, Soko”. Det är en annan stad än det mer kända Soko i Shefela, vid Terebintdalen, där filisteerna lägrade sig innan David stred mot Goljat. Det identifieras med Khirbet Shuweikeh, en stor ruin på en låg kulle omkring 16 km sydväst om Hebron på nuvarande Västbanken, med många grottor, klipputhuggna cisterner och huggna stenar; E. W. G. Masterman ansåg identifieringen vara säker."
    - "Soko är ett av fyra namn som stämplats, tillsammans med orden lmlk, ”tillhörande kungen”, på handtagen till Judas kungliga förrådskärl från slutet av 700-talet f.Kr., jämte Hebron, Sif och det oförklarade mmšt. Vilket Soko som avses är omtvistat: A. F. Rainey, som menade att kärlen kom från fyra kungliga vinpressar i Judeens bergsbygd, tänkte på detta Soko, i samma södra berg som Hebron och Sif; N. Na'aman förlade stämplarnas Soko nordväst om Hebron, i Shefela."
  nb:
    - "Dette Soko var en by i Judas fjellland sørvest for Hebron, oppført i det første fjelldistriktet sammen med Sjamir og Jattir: «Og i fjellbygdene: Samir og Jattir og Soko». Det er en annen by enn det bedre kjente Soko i Sjefela, ved Ela-dalen, der filistrene leiret seg før David kjempet mot Goliat. Det identifiseres med Khirbet Shuweikeh, en stor ruin på en lav høyde omkring 16 km sørvest for Hebron på dagens Vestbredden, med mange huler, uthuggede sisterner og tilhuggede steiner; E. W. G. Masterman mente at identifikasjonen var sikker."
    - "Soko er ett av fire navn som er stemplet, sammen med ordene lmlk, «tilhørende kongen», på hankene til Judas kongelige lagerkrukker fra slutten av 700-tallet f.Kr., sammen med Hebron, Sif og det uforklarte mmšt. Hvilket Soko som menes, er omdiskutert: A. F. Rainey, som mente at krukkene kom fra fire kongelige vingårder i Judas fjellland, så til dette Soko, i de samme sørlige åsene som Hebron og Sif; N. Na'aman plasserte stempelets Soko nordvest for Hebron, i Sjefela."
scripture:
  - Josh.15.48
