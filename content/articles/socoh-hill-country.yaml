# Overview article (ADR 0007). The Socoh of the Judean hill country = Khirbet Shuweikeh south-west of Hebron (ISBE; the map's point); which Socoh the royal lmlk jar stamps name is shown as debated (Rainey 1982 hill country, Na'aman 1986 Shephelah). The Socoh of the Shephelah is socoh.yaml.
id: socoh-hill-country
