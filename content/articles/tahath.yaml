body:
  en:
    - "Tahath is one of the camps of Israel in the wilderness, known only from the list of stations in Numbers 33: “And they removed from Makheloth, and encamped at Tahath. And they departed from Tahath, and pitched at Tarah.” It belongs to the run of eighteen stations from Rithmah to Ezion-geber, between Hazeroth and Kadesh, most of which are named nowhere else in the Bible, and the text records nothing that happened there. The name means “below” or “beneath”, which may describe a low-lying spot; a man named Tahath appears among the Kohathite Levites, but there is no reason to connect him with the camp."
    - "No site has been proposed with any confidence. The itinerary itself is variously explained, as a record of a real route, as a list built from a later road through Sinai and the Negev, or as a mixture of both, and the order of its stations cannot be fixed on the ground. The map therefore places Tahath only approximately, within about 50 km of its neighbour Tarah, which is equally unknown."
  ru:
    - "Тахаф — один из станов Израиля в пустыне, известный только по перечню стоянок в 33-й главе книги Чисел: «И отправились из Макелофа и расположились станом в Тахафе. И отправились из Тахафа и расположились станом в Тарахе». Он входит в череду восемнадцати стоянок от Рифмы до Ецион-Гавера, между Асирофом и Кадесом, большинство которых больше нигде в Библии не названо, и текст не сообщает ни о каком событии там. Имя значит «низ» или «внизу», что может описывать низменное место; среди левитов-каафитов есть человек по имени Тахаф, но связывать его со станом нет оснований."
    - "Ни одного места с уверенностью не предложено. Сам маршрут объясняют по-разному — как запись подлинного пути, как перечень, составленный по позднейшей дороге через Синай и Негев, или как смесь того и другого, — и порядок его стоянок на местности не установить. Поэтому на карте Тахаф помещён лишь приблизительно, в пределах около 50 км от соседнего Тараха, который так же неизвестен."
  uk:
    - "Тахат — один із таборів Ізраїлю в пустелі, відомий лише з переліку стоянок у Числах 33: «І рушили з Макелоти та й отаборились у Талатї. І рушили з Талати та й отаборились у Таратї». Він належить до низки з вісімнадцяти стоянок від Ріфми до Еціон-Гевера, між Хацеротом і Кадешем, більшість яких більше ніде в Біблії не названі, і текст не фіксує нічого, що там відбулося. Ім’я означає «під» або «внизу», що, можливо, описує низинне місце; чоловік на ім’я Тахат є серед левитів-кехатян, але немає підстав пов’язувати його з табором."
    - "Жодного місця не запропоновано з певністю. Сам маршрут тлумачать по-різному: як запис справжнього шляху, як перелік, складений за пізнішою дорогою через Синай і Негев, або як суміш обох, і порядок його стоянок неможливо закріпити на місцевості. Тому мапа позначає Тахат лише приблизно, в межах близько 50 км від його сусідки Тарах, яка так само невідома."
  es:
    - "Tahat es uno de los campamentos de Israel en el desierto, conocido solo por la lista de estaciones de Números 33: «Y partidos de Maceloth, asentaron en Tahath. Y partidos de Tahath, asentaron en Tara». Pertenece a la serie de dieciocho estaciones de Ritma a Ezión-geber, entre Haserot y Cades, la mayoría de las cuales no se nombran en ningún otro lugar de la Biblia, y el texto no registra nada de lo que allí ocurrió. El nombre significa «debajo» o «bajo», lo que puede describir un paraje hundido; un hombre llamado Tahat figura entre los levitas coatitas, pero no hay motivo para relacionarlo con el campamento."
    - "No se ha propuesto ningún emplazamiento con confianza. El propio itinerario se explica de diversas maneras: como registro de una ruta real, como una lista construida a partir de un camino posterior a través del Sinaí y el Néguev, o como una mezcla de ambos, y el orden de sus estaciones no puede fijarse sobre el terreno. El mapa sitúa por ello Tahat solo de modo aproximado, a unos 50 km de su vecina Tara, igualmente desconocida."
  pt:
    - "Taate é um dos acampamentos de Israel no deserto, conhecido apenas pela lista de estações de Números 33: “Partiram de Macelote e acamparam em Taate. Partiram de Taate e acamparam em Tera.” Pertence à série de dezoito estações de Ritma a Eziom-Geber, entre Hazerote e Cades, a maioria das quais não é nomeada em nenhum outro lugar da Bíblia, e o texto nada registra do que ali aconteceu. O nome significa “abaixo” ou “debaixo”, o que pode descrever um lugar baixo; um homem chamado Taate aparece entre os levitas coatitas, mas não há razão para ligá-lo ao acampamento."
    - "Nenhum sítio foi proposto com confiança. O próprio itinerário é explicado de várias maneiras: como registro de uma rota real, como lista construída a partir de uma estrada posterior pelo Sinai e pelo Neguebe, ou como mistura das duas coisas, e a ordem de suas estações não pode ser fixada no terreno. O mapa, por isso, situa Taate apenas aproximadamente, a cerca de 50 km de sua vizinha Terá, igualmente desconhecida."
  de:
    - "Tahat ist eines der Lager Israels in der Wüste, nur bekannt aus der Stationenliste in Numeri 33: „Von Makheloth zogen sie aus und lagerten sich in Thahath. Von Thahath zogen sie aus und lagerten sich in Tharah.“ Es gehört zu der Reihe von achtzehn Stationen von Ritma bis Ezjon-Geber, zwischen Hazerot und Kadesch, von denen die meisten sonst nirgends in der Bibel genannt werden, und der Text berichtet nichts von dem, was dort geschah. Der Name bedeutet „unten“ oder „unterhalb“, was einen tief gelegenen Ort beschreiben könnte; ein Mann namens Tahat erscheint unter den kehatitischen Leviten, aber es gibt keinen Grund, ihn mit dem Lager zu verbinden."
    - "Kein Ort ist mit Zuversicht vorgeschlagen worden. Die Wegbeschreibung selbst wird unterschiedlich erklärt, als Aufzeichnung eines wirklichen Weges, als Liste aus einer späteren Straße durch Sinai und Negev oder als Mischung von beidem, und die Reihenfolge ihrer Stationen lässt sich im Gelände nicht festlegen. Die Karte setzt Tahat daher nur ungefähr an, innerhalb von etwa 50 km um den Nachbarn Tarach, der ebenso unbekannt ist."
  fr:
    - "Tahath est l’un des campements d’Israël dans le désert, connu seulement par la liste des étapes de Nombres 33 : « Ils partirent de Makhéloth, et campèrent à Tahath. Ils partirent de Tahath, et campèrent à Tarach. » Il appartient à la série de dix-huit étapes de Rithma à Etsjon-Guéber, entre Hatséroth et Qadesh, dont la plupart ne sont nommées nulle part ailleurs dans la Bible, et le texte ne rapporte rien de ce qui s’y passa. Le nom signifie « au-dessous », ce qui peut décrire un lieu bas ; un homme nommé Tahath figure parmi les lévites kehathites, mais rien ne le relie au campement."
    - "Aucun site n’a été proposé avec quelque assurance. L’itinéraire lui-même est expliqué de diverses façons : relation d’un parcours réel, liste construite à partir d’une route plus tardive à travers le Sinaï et le Négev, ou mélange des deux, et l’ordre de ses étapes ne peut être fixé sur le terrain. La carte place donc Tahath de façon approximative, à moins de 50 km de sa voisine Tarach, tout aussi inconnue."
  pl:
    - "Tachat jest jednym z obozów Izraela na pustyni, znanym tylko z wykazu stacji w Lb 33: „A ruszywszy się z Makelot, położyli się obozem w Tahat. A ruszywszy się z Tahatu, położyli się obozem w Tare.” Należy do ciągu osiemnastu stacji od Retmy do Esjon-Geber, między Chasserot a Kadesz, z których większość nie występuje nigdzie indziej w Biblii, a tekst nie notuje niczego, co się tam wydarzyło. Nazwa znaczy „poniżej” albo „pod”, co może opisywać nisko położone miejsce; człowiek o imieniu Tachat pojawia się wśród lewitów z rodu Kehata, ale nie ma powodu łączyć go z obozem."
    - "Nie zaproponowano żadnego stanowiska z jakąkolwiek pewnością. Sam wykaz stacji jest różnie tłumaczony: jako zapis rzeczywistej trasy, jako lista zbudowana z późniejszej drogi przez Synaj i Negew albo jako mieszanina obu, a kolejności jego stacji nie da się ustalić w terenie. Mapa umieszcza więc Tachat tylko w przybliżeniu, w odległości około 50 km od sąsiedniego Teracha, który jest równie nieznany."
  it:
    - "Tacat è uno degli accampamenti d’Israele nel deserto, noto solo dall’elenco delle tappe di Numeri 33: «Partirono da Makheloth e si accamparono a Tahath. Partirono da Tahath e si accamparono a Tarach». Appartiene alla serie di diciotto tappe da Ritma a Ezion-Gheber, fra Cazerot e Kades, la maggior parte delle quali non è nominata altrove nella Bibbia, e il testo non riferisce nulla di ciò che vi accadde. Il nome significa «sotto» o «al di sotto», il che può descrivere un luogo basso; un uomo di nome Tacat compare fra i leviti keatiti, ma non c’è motivo di collegarlo con l’accampamento."
    - "Non è stato proposto alcun sito con fiducia. L’itinerario stesso è spiegato in vari modi, come la registrazione di un percorso reale, come un elenco costruito a partire da una strada posteriore attraverso il Sinai e il Negheb, o come un misto dei due, e l’ordine delle sue tappe non si può fissare sul terreno. La mappa colloca perciò Tacat solo approssimativamente, entro circa 50 km dalla vicina Tara, ugualmente ignota."
  nl:
    - "Tachat is een van de kampplaatsen van Israël in de woestijn, alleen bekend uit de lijst van stations in Numeri 33: “En zij verreisden van Makheloth, en legerden zich in Tachath. En zij verreisden van Tachath, en legerden zich in Tharah.” Het behoort tot de reeks van achttien stations van Ritma tot Ezeon-Geber, tussen Hazerot en Kades, waarvan de meeste nergens anders in de Bijbel worden genoemd, en de tekst vermeldt niets wat er is gebeurd. De naam betekent “beneden” of “onder”, wat een laaggelegen plek kan beschrijven; een man genaamd Tachat komt voor onder de Kehatitische Levieten, maar er is geen reden hem met het kamp in verband te brengen."
    - "Er is met enige zekerheid geen plaats voorgesteld. De reisroute zelf wordt op uiteenlopende wijze verklaard, als het verslag van een werkelijke route, als een lijst opgebouwd uit een latere weg door de Sinaï en de Negev, of als een mengeling van beide, en de volgorde van de stations kan op het terrein niet worden vastgesteld. De kaart plaatst Tachat daarom slechts bij benadering, binnen ongeveer 50 km van zijn buur Tarach, die evenmin bekend is."
  cs:
    - "Tachat je jedno z izraelských tábořišť na poušti, známé jen ze seznamu stanic v Numeri 33: „Potom hnuvše se z Machelot, položili se v Tahat. A hnuvše se z Tahat, položili se v Tár.“ Patří k řadě osmnácti stanic od Ritmy po Ecjon-geber, mezi Chacerótem a Kádešem, z nichž většina není nikde jinde v Bibli jmenována, a text nezaznamenává nic, co se tam stalo. Jméno znamená „pod“ nebo „dole“, což může popisovat nízko položené místo; muž jménem Tachat se objevuje mezi levity z rodu Kehatova, ale není důvod spojovat ho s tábořištěm."
    - "Žádná lokalita nebyla navržena s jistotou. Samotný itinerář je vykládán různě, jako záznam skutečné trasy, jako seznam sestavený z pozdější cesty přes Sinaj a Negev, nebo jako směs obojího, a pořadí jeho stanic nelze určit v terénu. Mapa proto klade Tachat jen přibližně, do vzdálenosti asi 50 km od jeho souseda Tarachu, který je stejně neznámý."
  sv:
    - "Tachat är ett av Israels läger i öknen, känt endast från stationsförteckningen i 4 Mos 33: ”Och de bröto upp från Makhelot och lägrade sig i Tahat. Och de bröto upp från Tahat och lägrade sig i Tera.” Det hör till raden av arton stationer från Ritma till Esjon-Geber, mellan Haserot och Kadesh, de flesta omnämnda ingen annanstans i Bibeln, och texten antecknar ingenting som hände där. Namnet betyder ”nedanför” eller ”under”, vilket kan beskriva en lågt belägen plats; en man vid namn Tachat förekommer bland de kehatitiska leviterna, men det finns ingen anledning att förbinda honom med lägret."
    - "Ingen plats har föreslagits med någon säkerhet. Själva färdvägen förklaras på olika sätt, som en uppteckning av en verklig väg, som en förteckning byggd på en senare väg genom Sinai och Negev, eller som en blandning av båda, och stationernas ordning kan inte fastställas på marken. Kartan placerar därför Tachat bara ungefärligt, inom omkring 50 km från grannen Tera, som är lika okänd."
  nb:
    - "Tahat er en av Israels leirer i ørkenen, kjent bare fra stasjonslisten i Fjerde Mosebok 33: «Og de drog fra Makhelot og leiret sig i Tahat. Og de drog fra Tahat og leiret sig i Tarah.» Den hører til rekken av atten stasjoner fra Ritma til Esjon-Geber, mellom Haserot og Kadesj, de fleste navngitt ingen andre steder i Bibelen, og teksten forteller ikke noe om hva som skjedde der. Navnet betyr «under» eller «nedenfor», noe som kan beskrive et lavtliggende sted; en mann ved navn Tahat opptrer blant de kehatittiske levittene, men det er ingen grunn til å knytte ham til leiren."
    - "Ingen beliggenhet er foreslått med noen sikkerhet. Reiseruten selv forklares ulikt, som en beretning om en virkelig rute, som en liste bygd på en senere vei gjennom Sinai og Negev, eller som en blanding av begge, og rekkefølgen på stasjonene kan ikke fastlegges på bakken. Kartet plasserer derfor Tahat bare omtrentlig, innenfor omkring 50 km fra naboen Tarah, som er like ukjent."
  tl:
    - "Ang Tahath ay isa sa mga kampamento ng Israel sa ilang, na kilala lamang mula sa talaan ng mga himpilan sa Bilang 33: “At sila'y naglakbay mula sa Maceloth, at humantong sa Tahath. At sila'y naglakbay mula sa Tahath at humantong sa Tara.” Kabilang ito sa serye ng labingwalong himpilan mula Ritma hanggang Esion-geber, sa pagitan ng Haseroth at Cades, na karamihan ay hindi pinangalanan saanman sa Biblia, at wala itong itinatala na nangyari roon. Ang pangalan ay nangangahulugang “sa ibaba” o “sa ilalim”, na maaaring naglalarawan ng mababang lugar; may isang lalaking nagngangalang Tahath sa mga Levitang Kohathita, ngunit walang dahilan upang iugnay siya sa kampamento."
    - "Walang pook na iminungkahi nang may tiwala. Ang itineraryo mismo ay iba-iba ang paliwanag, bilang tala ng tunay na ruta, bilang talaang binuo mula sa mas huling daan sa Sinai at Negev, o bilang halo ng dalawa, at hindi matiyak sa lupa ang pagkakasunud-sunod ng mga himpilan nito. Kaya inilalagay lamang ng mapa ang Tahath nang tinatayang, sa loob ng humigit-kumulang 50 km mula sa kapitbahay nitong Tara, na hindi rin kilala."
  da:
    - "Tahat er en af Israels lejre i ørkenen, kendt kun fra stationslisten i 4 Mos 33: »Og de rejste fra Makeheloth, og de lejrede sig i Thabath. Og de rejste fra Thabath, og de lejrede sig i Thara.« Den hører til rækken af atten stationer fra Ritma til Esjon-Geber, mellem Haserot og Kadesj, hvoraf de fleste ikke nævnes andre steder i Bibelen, og teksten melder intet om, hvad der skete dér. Navnet betyder »under« eller »neden for«, hvilket kan beskrive et lavtliggende sted; en mand ved navn Tahat optræder blandt de kehatitiske leviter, men der er ingen grund til at forbinde ham med lejren."
    - "Intet sted er foreslået med nogen sikkerhed. Rejselisten selv forklares forskelligt, som en optegnelse af en virkelig rute, som en liste bygget på en senere vej gennem Sinaj og Negev eller som en blanding af begge, og rækkefølgen af dens stationer kan ikke fastlægges på stedet. Kortet placerer derfor Tahat kun omtrentligt, inden for omkring 50 km fra dens nabo Tera, som er lige så ukendt."
  sr:
    - "Тахат је један од логора Израиља у пустињи, познат само из списка станица у Књизи о бројевима 33: „А из Макидота отишавши стадоше у логор у Катату. А из Катата отишавши стадоше у логор у Тарату.“ Припада низу од осамнаест станица од Ратаме до Есион-Гавера, између Асирота и Кадиса, од којих већина нигде другде у Библији није поменута, а текст не бележи ништа што се ту догодило. Име значи „испод“ или „доле“, што може описивати ниско место; човек по имену Тахат јавља се међу левитима Катовцима, али нема разлога да се доводи у везу с логором."
    - "Ниједно налазиште није предложено с извесношћу. Сам попис станица различито се тумачи: као запис стварног пута, као списак сачињен према каснијем путу кроз Синај и Негев, или као мешавина обојег, а редослед његових станица не може се утврдити на терену. Карта зато Тахат смешта само приближно, у оквиру око 50 км од суседне Таре, која је подједнако непозната."
  hu:
    - "Tahat Izráel egyik pusztai tábora, amelyet csak a Számok 33. fejezetének állomáslistájából ismerünk: „elindulának Makhélótból, és tábort ütének Tháhátban. És elindulának Tháhátból, és tábort ütének Thárakhban.” Abba a Ritmától Ecjón-Géberig tartó tizennyolc állomásos sorba tartozik, Hacérót és Kádes között, amelyek többségét sehol másutt nem nevezi meg a Biblia, és a szöveg nem jegyzi fel, mi történt ott. A név „alatta” vagy „alatt” jelentésű, ami alacsonyan fekvő helyet írhat le; Tahat nevű férfi szerepel a kehátita léviták között, de nincs ok arra, hogy a táborral összekössék."
    - "Helyét senki sem javasolta biztosan. Magát az útleírást többféleképpen magyarázzák: valódi útvonal feljegyzéseként, a Sínai-félszigeten és a Negevben átvezető későbbi útból épített listaként, vagy a kettő keverékeként, és állomásainak sorrendje a terepen nem rögzíthető. A térkép ezért Tahatot csak hozzávetőlegesen helyezi el, szomszédjától, Terahtól, amely ugyanígy ismeretlen, mintegy 50 km-en belül."
  fi:
    - "Tahat on yksi Israelin erämaaleireistä, tunnettu vain Neljännen Mooseksen kirjan 33. luvun asemaluettelosta: ”Ja he lähtivät Makhelotista ja leiriytyivät Tahatiin. Ja he lähtivät Tahatista ja leiriytyivät Tarahiin.” Se kuuluu kahdeksantoista aseman jaksoon Ritmasta Esjon-Geberiin, Haserotin ja Kadeksen välillä; useimpia niistä ei mainita muualla Raamatussa, eikä teksti kerro mitään siellä tapahtuneen. Nimi merkitsee ”alla” tai ”alapuolella”, mikä voi kuvata alavaa paikkaa; Tahat-niminen mies esiintyy kehatilaisten leeviläisten joukossa, mutta häntä ei ole syytä yhdistää leiriin."
    - "Mitään paikkaa ei ole ehdotettu varmuudella. Itse reittiluettelo selitetään eri tavoin: todellisen reitin muistiinpanona, Siinain ja Negevin halki kulkeneesta myöhemmästä tiestä rakennettuna luettelona tai näiden sekoituksena, eikä sen asemien järjestystä voida maastossa vahvistaa. Kartta sijoittaa Tahatin siksi vain likimääräisesti, noin 50 km:n säteellä naapuristaan Tarahista, joka on yhtä tuntematon."
  vi:
    - "Ta-hát là một trong các trại của Y-sơ-ra-ên trong đồng vắng, chỉ được biết qua danh sách các chặng ở Dân Số Ký 33: “Đoạn, đi từ Mác-hê-lốt và đóng trại tại Ta-hát. Đi từ Ta-hát và đóng trại tại Ta-rách.” Nó thuộc chuỗi mười tám chặng từ Rít-ma đến Ê-xi-ôn-Ghê-be, giữa Hát-sê-rốt và Ca-đe, phần lớn không được nêu ở chỗ nào khác trong Kinh Thánh, và bản văn không ghi điều gì đã xảy ra ở đó. Tên nghĩa là “bên dưới” hay “phía dưới”, có thể mô tả một nơi trũng thấp; một người tên Ta-hát xuất hiện trong các người Lê-vi thuộc họ Kê-hát, nhưng không có lý do nào để liên hệ ông với trại này."
    - "Chưa có địa điểm nào được đề nghị với độ tin cậy nào. Chính lộ trình được giải thích khác nhau, là ghi chép về một tuyến đường có thật, là danh sách dựng từ một con đường về sau qua Si-na-i và Nê-ghép, hoặc là hỗn hợp của cả hai, và thứ tự các chặng không thể xác định trên thực địa. Vì vậy bản đồ chỉ đặt Ta-hát đại khái, trong vòng khoảng 50 km quanh Tha-rê, nơi lân cận cũng không rõ không kém."
  ro:
    - "Tahat este unul dintre popasurile lui Israel în pustie, cunoscut numai din lista popasurilor din Numeri 33: „Și au purces din Machilot, și au tăbărît în Kataat. Și au purces din Kataat, și au tăbărît în Tarat.” Face parte din șirul de optsprezece popasuri de la Ritma până la Ețion-Gheber, între Hațerot și Cades, dintre care cele mai multe nu sunt numite nicăieri altundeva în Biblie, iar textul nu consemnează nimic din ce s-a petrecut acolo. Numele înseamnă „dedesubt” sau „sub”, ceea ce poate descrie un loc scufundat; un om numit Tahat apare printre leviții cahatiți, dar nu există niciun motiv să-l legăm de tabără."
    - "Niciun loc nu a fost propus cu vreo încredere. Itinerarul însuși este explicat în feluri diferite: ca o consemnare a unui traseu real, ca o listă alcătuită dintr-un drum mai târziu prin Sinai și Neghev, sau ca un amestec al celor două, iar ordinea popasurilor nu poate fi fixată pe teren. De aceea harta așază Tahat doar aproximativ, la circa 50 km de vecina sa Tarah, la fel de necunoscută."
  bg:
    - "Тахат е един от становете на Израил в пустинята, известен само от списъка на стоянките в Чис. 33: „И като се дигнаха от Макилот разположиха стан в Тахат. И като се дигнаха от Тахат разположиха стан в Тара.“ Той спада към поредицата от осемнадесет стоянки от Ритма до Ецион-Гавер, между Асирот и Кадеш, повечето от които не се споменават никъде другаде в Библията, а текстът не съобщава нищо, случило се там. Името означава „долу“ или „под“, което може да описва ниско място; човек на име Тахат се среща сред левитите от рода на Каат, но няма основание да се свързва със стана."
    - "Не е предложено място с каквато и да е увереност. Самият маршрут се обяснява различно — като запис на действителен път, като списък, съставен по по-късен път през Синай и Негев, или като смесица от двете, а редът на стоянките му не може да се установи на терена. Затова картата поставя Тахат само приблизително, в рамките на около 50 км от съседната Тара, която е също толкова неизвестна."
