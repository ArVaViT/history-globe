# Overview article (ADR 0007). Mainstream facts only; a station known only from the itinerary of Numbers 33; unlocated, placed on the map only relative to its neighbours.
id: tahath
place: abe40d1
title:
  en: "Tahath"
  ru: "Тахаф"
  uk: "Тахат"
  es: "Tahat"
  pt: "Taate"
  de: "Tahat"
  fr: "Tahath"
body:
  en:
    - "Tahath is one of the camps of Israel in the wilderness, known only from the list of stations in Numbers 33: “And they removed from Makheloth, and encamped at Tahath. And they departed from Tahath, and pitched at Tarah.” It belongs to the run of eighteen stations from Rithmah to Ezion-geber, between Hazeroth and Kadesh, most of which are named nowhere else in the Bible, and the text records nothing that happened there. The name means “below” or “beneath”, which may describe a low-lying spot; a man named Tahath appears among the Kohathite Levites, but there is no reason to connect him with the camp."
    - "No site has been proposed with any confidence. The itinerary itself is variously explained, as a record of a real route, as a list built from a later road through Sinai and the Negev, or as a mixture of both, and the order of its stations cannot be fixed on the ground. The map therefore places Tahath only approximately, within about 50 km of its neighbour Tarah, which is equally unknown."
  ru:
    - "Тахаф — один из станов Израиля в пустыне, известный только по перечню стоянок в 33-й главе книги Чисел: «И отправились из Макелофа и расположились станом в Тахафе. И отправились из Тахафа и расположились станом в Тарахе». Он входит в череду восемнадцати стоянок от Рифмы до Ецион-Гавера, между Асирофом и Кадесом, большинство которых больше нигде в Библии не названо, и текст не сообщает ни о каком событии там. Имя значит «низ» или «внизу», что может описывать низменное место; среди левитов-каафитов есть человек по имени Тахаф, но связывать его со станом нет оснований."
    - "Ни одного места с уверенностью не предложено. Сам маршрут объясняют по-разному — как запись подлинного пути, как перечень, составленный по позднейшей дороге через Синай и Негев, или как смесь того и другого, — и порядок его стоянок на местности не установить. Поэтому на карте Тахаф помещён лишь приблизительно, в пределах около 50 км от соседнего Тараха, который так же неизвестен."
  uk:
    - "Тахат — один із таборів Ізраїлю в пустелі, відомий лише з переліку стоянок у Числах 33: «І рушили з Макелоти та й отаборились у Талатї. І рушили з Талати та й отаборились у Таратї». Він належить до низки з вісімнадцяти стоянок від Ріфми до Еціон-Гевера, між Хацеротом і Кадешем, більшість яких більше ніде в Біблії не названі, і текст не фіксує нічого, що там відбулося. Ім’я означає «під» або «внизу», що, можливо, описує низинне місце; чоловік на ім’я Тахат є серед левитів-кехатян, але немає підстав пов’язувати його з табором."
    - "Жодного місця не запропоновано з певністю. Сам маршрут тлумачать по-різному: як запис справжнього шляху, як перелік, складений за пізнішою дорогою через Синай і Негев, або як суміш обох, і порядок його стоянок неможливо закріпити на місцевості. Тому мапа позначає Тахат лише приблизно, в межах близько 50 км від його сусідки Тарах, яка так само невідома."
  es:
    - "Tahat es uno de los campamentos de Israel en el desierto, conocido solo por la lista de estaciones de Números 33: «Y partidos de Maceloth, asentaron en Tahath. Y partidos de Tahath, asentaron en Tara». Pertenece a la serie de dieciocho estaciones de Ritma a Ezión-geber, entre Haserot y Cades, la mayoría de las cuales no se nombran en ningún otro lugar de la Biblia, y el texto no registra nada de lo que allí ocurrió. El nombre significa «debajo» o «bajo», lo que puede describir un paraje hundido; un hombre llamado Tahat figura entre los levitas coatitas, pero no hay motivo para relacionarlo con el campamento."
    - "No se ha propuesto ningún emplazamiento con confianza. El propio itinerario se explica de diversas maneras: como registro de una ruta real, como una lista construida a partir de un camino posterior a través del Sinaí y el Néguev, o como una mezcla de ambos, y el orden de sus estaciones no puede fijarse sobre el terreno. El mapa sitúa por ello Tahat solo de modo aproximado, a unos 50 km de su vecina Tara, igualmente desconocida."
  pt:
    - "Taate é um dos acampamentos de Israel no deserto, conhecido apenas pela lista de estações de Números 33: “Partiram de Macelote e acamparam em Taate. Partiram de Taate e acamparam em Tera.” Pertence à série de dezoito estações de Ritma a Eziom-Geber, entre Hazerote e Cades, a maioria das quais não é nomeada em nenhum outro lugar da Bíblia, e o texto nada registra do que ali aconteceu. O nome significa “abaixo” ou “debaixo”, o que pode descrever um lugar baixo; um homem chamado Taate aparece entre os levitas coatitas, mas não há razão para ligá-lo ao acampamento."
    - "Nenhum sítio foi proposto com confiança. O próprio itinerário é explicado de várias maneiras: como registro de uma rota real, como lista construída a partir de uma estrada posterior pelo Sinai e pelo Neguebe, ou como mistura das duas coisas, e a ordem de suas estações não pode ser fixada no terreno. O mapa, por isso, situa Taate apenas aproximadamente, a cerca de 50 km de sua vizinha Terá, igualmente desconhecida."
  de:
    - "Tahat ist eines der Lager Israels in der Wüste, nur bekannt aus der Stationenliste in Numeri 33: „Von Makheloth zogen sie aus und lagerten sich in Thahath. Von Thahath zogen sie aus und lagerten sich in Tharah.“ Es gehört zu der Reihe von achtzehn Stationen von Ritma bis Ezjon-Geber, zwischen Hazerot und Kadesch, von denen die meisten sonst nirgends in der Bibel genannt werden, und der Text berichtet nichts von dem, was dort geschah. Der Name bedeutet „unten“ oder „unterhalb“, was einen tief gelegenen Ort beschreiben könnte; ein Mann namens Tahat erscheint unter den kehatitischen Leviten, aber es gibt keinen Grund, ihn mit dem Lager zu verbinden."
    - "Kein Ort ist mit Zuversicht vorgeschlagen worden. Die Wegbeschreibung selbst wird unterschiedlich erklärt, als Aufzeichnung eines wirklichen Weges, als Liste aus einer späteren Straße durch Sinai und Negev oder als Mischung von beidem, und die Reihenfolge ihrer Stationen lässt sich im Gelände nicht festlegen. Die Karte setzt Tahat daher nur ungefähr an, innerhalb von etwa 50 km um den Nachbarn Tarach, der ebenso unbekannt ist."
  fr:
    - "Tahath est l’un des campements d’Israël dans le désert, connu seulement par la liste des étapes de Nombres 33 : « Ils partirent de Makhéloth, et campèrent à Tahath. Ils partirent de Tahath, et campèrent à Tarach. » Il appartient à la série de dix-huit étapes de Rithma à Etsjon-Guéber, entre Hatséroth et Qadesh, dont la plupart ne sont nommées nulle part ailleurs dans la Bible, et le texte ne rapporte rien de ce qui s’y passa. Le nom signifie « au-dessous », ce qui peut décrire un lieu bas ; un homme nommé Tahath figure parmi les lévites kehathites, mais rien ne le relie au campement."
    - "Aucun site n’a été proposé avec quelque assurance. L’itinéraire lui-même est expliqué de diverses façons : relation d’un parcours réel, liste construite à partir d’une route plus tardive à travers le Sinaï et le Négev, ou mélange des deux, et l’ordre de ses étapes ne peut être fixé sur le terrain. La carte place donc Tahath de façon approximative, à moins de 50 km de sa voisine Tarach, tout aussi inconnue."
scripture:
  - Num.33.26-Num.33.27
sources:
