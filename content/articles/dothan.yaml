body:
  en:
    - "Dothan is Tell Dothan, a large mound south-west of Jenin and about 22 km north of Shechem. It stands in a broad valley through which a road passed between the coastal plain and the plain of Jezreel. Eusebius placed Dothaim about twelve miles north of Sebaste, the old Samaria. Joseph P. Free of Wheaton College excavated the mound from 1953 to 1964. The earliest remains go back to the Neolithic and Chalcolithic; in the Early Bronze Age it was a walled town, and it was settled again in the Middle and Late Bronze Ages."
    - 'In Genesis Jacob sent Joseph from the vale of Hebron to see whether it was well with his brothers at Shechem. A man told him they had said, "Let us go to Dothan", and Joseph found them in Dothan. They cast him into an empty pit, and when a company of Ishmeelites came from Gilead with camels bearing spicery, balm and myrrh down to Egypt, they sold him for twenty pieces of silver. The story follows the trade road that ran through the valley.'
    - 'In the days of the kings of Israel the prophet Elisha was at Dothan when the king of Syria, whose plans he kept revealing to the king of Israel, sent horses, chariots and a great host, and they compassed the city by night. To his frightened servant Elisha said, "Fear not: for they that be with us are more than they that be with them"; the LORD opened the young man''s eyes, and he saw that "the mountain was full of horses and chariots of fire round about Elisha". The Syrians were smitten with blindness, and Elisha led them to Samaria. Josephus, retelling the story, names the king Benhadad. In the Iron Age Dothan was a town of the kingdom of Israel.'
    - "In the early fourth century Eusebius still pointed out Dothaim as the place where Joseph found his brothers. The name lived on: in 1851 the Dutch traveller C. W. M. van de Velde heard the local people call the mound Dothan."
  ru:
    - "Дофан — это Телль-Дотан, большой холм к юго-западу от Дженина и примерно в 22 км к северу от Сихема. Он стоит в широкой долине, через которую шла дорога между приморской равниной и Изреельской равниной. Евсевий помещал Дофаим примерно в двенадцати милях к северу от Севастии, древней Самарии. Джозеф П. Фри из Уитонского колледжа копал холм с 1953 по 1964 г. Древнейшие находки относятся к неолиту и энеолиту; в раннем бронзовом веке здесь был обнесённый стеной город, а в среднем и позднем бронзовом веке место снова было заселено."
    - "В книге Бытия Иаков послал Иосифа из долины Хевронской посмотреть, здоровы ли братья его в Сихеме. Один человек сказал ему, что они говорили: «пойдем в Дофан», и Иосиф нашёл их в Дофане. Они бросили его в пустой ров, а когда из Галаада шёл караван Измаильтян, и верблюды их несли стираксу, бальзам и ладан в Египет, продали его за двадцать сребренников. Рассказ идёт по торговой дороге, проходившей через долину."
    - "Во дни царей Израильских пророк Елисей был в Дофане, когда царь Сирийский, чьи замыслы он постоянно открывал царю Израильскому, послал туда коней, колесницы и много войска, и они ночью окружили город. Испуганному слуге Елисей сказал: «не бойся, потому что тех, которые с нами, больше, нежели тех, которые с ними»; Господь открыл глаза слуге, и он увидел, что «вся гора наполнена конями и колесницами огненными кругом Елисея». Сириян поразила слепота, и Елисей привёл их в Самарию. Иосиф Флавий, пересказывая эту историю, называет царя Венададом. В железном веке Дофан был городом Израильского царства."
    - "В начале IV века Евсевий ещё указывал Дофаим как место, где Иосиф нашёл своих братьев. Имя сохранилось: в 1851 г. голландский путешественник Ч. В. М. ван де Велде слышал, как местные жители называют холм Дотаном."
  uk:
    - "Дофан — це Телль-Дофан, великий горб на південний захід від Дженіна й приблизно за 22 км на північ від Сихема. Він стоїть у широкій долині, крізь яку проходила дорога між прибережною рівниною та рівниною Їзреель. Євсевій розміщував Дотаїм приблизно за дванадцять миль на північ від Себасти, давньої Самарії. Джозеф П. Фрі з Вітонського коледжу розкопував горб з 1953 до 1964 р. Найдавніші рештки сягають неоліту й халколіту; у ранню бронзову добу це було місто з мурами, і воно було заселене знову в середню та пізню бронзу."
    - "У Книзі Буття Яків послав Йосипа з долини Хеврона довідатися, чи все гаразд у його братів у Сихемі. Якийсь чоловік сказав йому, що вони казали: «Поженимось у Дотан», і Йосип знайшов їх у Дофані. Вони кинули його до порожнього колодязя, а коли караван ізмаїльтян прийшов від Гілеаду з верблюдами, що везли пахощі, бальзам і мирру до Єгипту, продали його за двадцять срібняків. Розповідь іде вздовж торгової дороги, що проходила долиною."
    - "За днів царів Ізраїлю пророк Єлисей був у Дофані, коли цар Сирії, чиї плани він раз у раз виявляв цареві Ізраїлю, надіслав коней, колесниці й велике військо, і вони обступили місто вночі. Його переляканому слузі Єлисей сказав: «Не лякайся, бо тих, що з нами, більш, анїж тих, що з ними»; Господь відкрив юнакові очі, і він побачив, що «гора навкруги Елисея була заповнена кіньми й поломяними колесницями». Сирійців було вражено сліпотою, і Єлисей відвів їх до Самарії. Йосиф Флавій, переказуючи історію, називає царя Бен-Гададом. У залізну добу Дофан був містом царства Ізраїль."
    - "На початку IV ст. Євсевій ще показував Дотаїм як місце, де Йосип знайшов своїх братів. Назва жила далі: у 1851 р. голландський мандрівник К. В. М. ван де Вельде чув, як місцеві називали горб Дофан."
  es:
    - "Dotán es Tell Dotán, un gran montículo al sudoeste de Yenín y a unos 22 km al norte de Siquem. Se alza en un ancho valle por el que pasaba un camino entre la llanura costera y la llanura de Jezreel. Eusebio situó Dothaim a unas doce millas al norte de Sebaste, la antigua Samaria. Joseph P. Free, del Wheaton College, excavó el montículo de 1953 a 1964. Los restos más antiguos se remontan al Neolítico y al Calcolítico; en la Edad del Bronce Antiguo fue una ciudad amurallada, y volvió a estar poblada en el Bronce Medio y Tardío."
    - "En el Génesis, Jacob envió a José desde el valle de Hebrón para ver si sus hermanos estaban bien en Siquem. Un hombre le dijo que habían dicho: «Vamos á Dothán», y José los halló en Dotán. Lo arrojaron a una cisterna vacía, y cuando una compañía de ismaelitas llegó de Galaad con camellos que llevaban aromas, bálsamo y mirra a Egipto, lo vendieron por veinte piezas de plata. El relato sigue el camino comercial que atravesaba el valle."
    - "En los días de los reyes de Israel, el profeta Eliseo estaba en Dotán cuando el rey de Siria, cuyos planes él revelaba una y otra vez al rey de Israel, envió caballos, carros y un gran ejército, y cercaron la ciudad de noche. A su asustado siervo, Eliseo dijo: «No hayas miedo: porque más son los que están con nosotros que los que están con ellos»; el Señor abrió los ojos del joven, y este vio que «el monte estaba lleno de gente de á caballo, y de carros de fuego alrededor de Eliseo». Los sirios fueron heridos de ceguera, y Eliseo los condujo a Samaria. Josefo, al contar de nuevo la historia, nombra al rey Ben-adad. En la Edad del Hierro Dotán era una ciudad del reino de Israel."
    - "A comienzos del siglo IV Eusebio todavía mostraba Dothaim como el lugar donde José halló a sus hermanos. El nombre perduró: en 1851 el viajero holandés C. W. M. van de Velde oyó a los lugareños llamar al montículo Dothan."
  pt:
    - "Dotã é Tell Dothan, um grande monte a sudoeste de Jenin e a cerca de 22 km ao norte de Siquém. Fica num vale amplo por onde passava uma estrada entre a planície costeira e a planície de Jezreel. Eusébio situou Dothaim cerca de doze milhas ao norte de Sebaste, a antiga Samaria. Joseph P. Free, do Wheaton College, escavou o monte de 1953 a 1964. Os vestígios mais antigos remontam ao Neolítico e ao Calcolítico; no Bronze Antigo foi uma cidade murada, e foi habitada de novo nas Idades do Bronze Médio e Tardio."
    - "No Gênesis, Jacó enviou José do vale de Hebrom para ver se estava tudo bem com seus irmãos em Siquém. Um homem lhe disse que haviam dito: “Vamos para Dotã”, e José os encontrou em Dotã. Lançaram-no numa cisterna vazia, e quando uma caravana de ismaelitas veio de Gileade com camelos carregados de especiarias, bálsamo e mirra, descendo para o Egito, venderam-no por vinte peças de prata. A narrativa segue a estrada comercial que corria pelo vale."
    - "Nos dias dos reis de Israel, o profeta Eliseu estava em Dotã quando o rei da Síria, cujos planos ele não cessava de revelar ao rei de Israel, enviou cavalos, carros e um grande exército, e eles cercaram a cidade de noite. A seu servo assustado, Eliseu disse: “Não tenha medo, pois os que estão conosco são mais do que os que estão com eles”; o SENHOR abriu os olhos do jovem, e ele viu que “o monte estava cheio de cavalos e carros de fogo ao redor de Eliseu”. Os sírios foram feridos de cegueira, e Eliseu os levou a Samaria. Josefo, ao recontar a história, nomeia o rei Ben-Hadade. Na Idade do Ferro, Dotã foi uma cidade do reino de Israel."
    - "No início do século IV, Eusébio ainda indicava Dothaim como o lugar onde José encontrou seus irmãos. O nome sobreviveu: em 1851, o viajante holandês C. W. M. van de Velde ouviu os moradores chamarem o monte de Dothan."
  de:
    - "Dotan ist Tell Dotan, ein großer Hügel südwestlich von Dschenin und etwa 22 km nördlich von Sichem. Er liegt in einem breiten Tal, durch das eine Straße zwischen der Küstenebene und der Ebene Jesreel verlief. Eusebius setzte Dothaim etwa zwölf Meilen nördlich von Sebaste, dem alten Samaria, an. Joseph P. Free vom Wheaton College grub den Hügel von 1953 bis 1964 aus. Die ältesten Reste reichen in die Jungsteinzeit und Kupfersteinzeit zurück; in der Frühen Bronzezeit war er eine ummauerte Stadt, und er wurde in der Mittleren und Späten Bronzezeit erneut besiedelt."
    - "In der Genesis schickte Jakob Josef aus dem Tal von Hebron, um zu sehen, ob es seinen Brüdern in Sichem gut ging. Ein Mann sagte ihm, sie hätten gesagt: „Laßt uns gen Dothan gehen“, und Josef fand sie in Dotan. Sie warfen ihn in eine leere Grube, und als eine Karawane von Ismaelitern aus Gilead mit Kamelen kam, die Gewürz, Balsam und Myrrhe nach Ägypten hinabtrugen, verkauften sie ihn für zwanzig Silberstücke. Die Geschichte folgt der Handelsstraße, die durch das Tal verlief."
    - "In den Tagen der Könige Israels war der Prophet Elisa in Dotan, als der König von Syrien, dessen Pläne er dem König von Israel immer wieder verriet, Rosse, Wagen und ein großes Heer sandte und sie die Stadt bei Nacht umzingelten. Zu seinem verängstigten Diener sagte Elisa: „Fürchte dich nicht! denn derer ist mehr, die bei uns sind, als derer, die bei ihnen sind“; der HERR öffnete dem jungen Mann die Augen, und er sah, dass „der Berg voll feuriger Rosse und Wagen um Elisa her“ war. Die Syrer wurden mit Blindheit geschlagen, und Elisa führte sie nach Samaria. Josephus, der die Geschichte nacherzählt, nennt den König Benhadad. In der Eisenzeit war Dotan eine Stadt des Königreichs Israel."
    - "Anfang des 4. Jahrhunderts zeigte Eusebius Dothaim noch immer als den Ort, an dem Josef seine Brüder fand. Der Name lebte fort: 1851 hörte der niederländische Reisende C. W. M. van de Velde die Einheimischen den Hügel Dothan nennen."
  fr:
    - "Dothan est Tell Dothan, un grand tertre au sud-ouest de Jénine et à environ 22 km au nord de Sichem. Il se dresse dans une large vallée que traversait une route entre la plaine côtière et la plaine de Jizreel. Eusèbe plaçait Dothaim à environ douze milles au nord de Sébaste, l’ancienne Samarie. Joseph P. Free, du Wheaton College, fouilla le tertre de 1953 à 1964. Les plus anciens vestiges remontent au néolithique et au chalcolithique ; à l’âge du Bronze ancien, c’était une ville fortifiée, et elle fut de nouveau occupée aux âges du Bronze moyen et récent."
    - "Dans la Genèse, Jacob envoya Joseph de la vallée d’Hébron voir si tout allait bien pour ses frères à Sichem. Un homme lui dit qu’ils avaient dit : « Allons à Dothan », et Joseph les trouva à Dothan. Ils le jetèrent dans une citerne vide, et quand une caravane d’Ismaélites vint de Galaad avec des chameaux chargés d’aromates, de baume et de myrrhe pour les porter en Égypte, ils le vendirent pour vingt pièces d’argent. Le récit suit la route commerciale qui traversait la vallée."
    - "Du temps des rois d’Israël, le prophète Élisée se trouvait à Dothan quand le roi de Syrie, dont il révélait sans cesse les plans au roi d’Israël, envoya des chevaux, des chars et une grande armée, qui cernèrent la ville de nuit. À son serviteur effrayé, Élisée dit : « Ne crains point, car ceux qui sont avec nous sont en plus grand nombre que ceux qui sont avec eux » ; l’Éternel ouvrit les yeux du jeune homme, et il vit « la montagne pleine de chevaux et de chars de feu autour d’Élisée ». Les Syriens furent frappés d’aveuglement, et Élisée les conduisit à Samarie. Josèphe, en racontant l’épisode, nomme le roi Ben-Hadad. À l’âge du Fer, Dothan était une ville du royaume d’Israël."
    - "Au début du IVe siècle, Eusèbe montrait encore Dothaim comme le lieu où Joseph retrouva ses frères. Le nom a survécu : en 1851, le voyageur néerlandais C. W. M. van de Velde entendit les habitants appeler le tertre Dothan."
