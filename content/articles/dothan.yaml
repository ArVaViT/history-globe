body:
  en:
    - "Dothan is Tell Dothan, a large mound south-west of Jenin and about 22 km north of Shechem. It stands in a broad valley through which a road passed between the coastal plain and the plain of Jezreel. Eusebius placed Dothaim about twelve miles north of Sebaste, the old Samaria. Joseph P. Free of Wheaton College excavated the mound from 1953 to 1964. The earliest remains go back to the Neolithic and Chalcolithic; in the Early Bronze Age it was a walled town, and it was settled again in the Middle and Late Bronze Ages."
    - 'In Genesis Jacob sent Joseph from the vale of Hebron to see whether it was well with his brothers at Shechem. A man told him they had said, "Let us go to Dothan", and Joseph found them in Dothan. They cast him into an empty pit, and when a company of Ishmeelites came from Gilead with camels bearing spicery, balm and myrrh down to Egypt, they sold him for twenty pieces of silver. The story follows the trade road that ran through the valley.'
    - 'In the days of the kings of Israel the prophet Elisha was at Dothan when the king of Syria, whose plans he kept revealing to the king of Israel, sent horses, chariots and a great host, and they compassed the city by night. To his frightened servant Elisha said, "Fear not: for they that be with us are more than they that be with them"; the LORD opened the young man''s eyes, and he saw that "the mountain was full of horses and chariots of fire round about Elisha". The Syrians were smitten with blindness, and Elisha led them to Samaria. Josephus, retelling the story, names the king Benhadad. In the Iron Age Dothan was a town of the kingdom of Israel.'
    - "In the early fourth century Eusebius still pointed out Dothaim as the place where Joseph found his brothers. The name lived on: in 1851 the Dutch traveller C. W. M. van de Velde heard the local people call the mound Dothan."
  ru:
    - "Дофан — это Телль-Дотан, большой холм к юго-западу от Дженина и примерно в 22 км к северу от Сихема. Он стоит в широкой долине, через которую шла дорога между приморской равниной и Изреельской равниной. Евсевий помещал Дофаим примерно в двенадцати милях к северу от Севастии, древней Самарии. Джозеф П. Фри из Уитонского колледжа копал холм с 1953 по 1964 г. Древнейшие находки относятся к неолиту и энеолиту; в раннем бронзовом веке здесь был обнесённый стеной город, а в среднем и позднем бронзовом веке место снова было заселено."
    - "В книге Бытия Иаков послал Иосифа из долины Хевронской посмотреть, здоровы ли братья его в Сихеме. Один человек сказал ему, что они говорили: «пойдем в Дофан», и Иосиф нашёл их в Дофане. Они бросили его в пустой ров, а когда из Галаада шёл караван Измаильтян, и верблюды их несли стираксу, бальзам и ладан в Египет, продали его за двадцать сребренников. Рассказ идёт по торговой дороге, проходившей через долину."
    - "Во дни царей Израильских пророк Елисей был в Дофане, когда царь Сирийский, чьи замыслы он постоянно открывал царю Израильскому, послал туда коней, колесницы и много войска, и они ночью окружили город. Испуганному слуге Елисей сказал: «не бойся, потому что тех, которые с нами, больше, нежели тех, которые с ними»; Господь открыл глаза слуге, и он увидел, что «вся гора наполнена конями и колесницами огненными кругом Елисея». Сириян поразила слепота, и Елисей привёл их в Самарию. Иосиф Флавий, пересказывая эту историю, называет царя Венададом. В железном веке Дофан был городом Израильского царства."
    - "В начале IV века Евсевий ещё указывал Дофаим как место, где Иосиф нашёл своих братьев. Имя сохранилось: в 1851 г. голландский путешественник Ч. В. М. ван де Велде слышал, как местные жители называют холм Дотаном."
  uk:
    - "Дофан — це Телль-Дофан, великий горб на південний захід від Дженіна й приблизно за 22 км на північ від Сихема. Він стоїть у широкій долині, крізь яку проходила дорога між прибережною рівниною та рівниною Їзреель. Євсевій розміщував Дотаїм приблизно за дванадцять миль на північ від Себасти, давньої Самарії. Джозеф П. Фрі з Вітонського коледжу розкопував горб з 1953 до 1964 р. Найдавніші рештки сягають неоліту й халколіту; у ранню бронзову добу це було місто з мурами, і воно було заселене знову в середню та пізню бронзу."
    - "У Книзі Буття Яків послав Йосипа з долини Хеврона довідатися, чи все гаразд у його братів у Сихемі. Якийсь чоловік сказав йому, що вони казали: «Поженимось у Дотан», і Йосип знайшов їх у Дофані. Вони кинули його до порожнього колодязя, а коли караван ізмаїльтян прийшов від Гілеаду з верблюдами, що везли пахощі, бальзам і мирру до Єгипту, продали його за двадцять срібняків. Розповідь іде вздовж торгової дороги, що проходила долиною."
    - "За днів царів Ізраїлю пророк Єлисей був у Дофані, коли цар Сирії, чиї плани він раз у раз виявляв цареві Ізраїлю, надіслав коней, колесниці й велике військо, і вони обступили місто вночі. Його переляканому слузі Єлисей сказав: «Не лякайся, бо тих, що з нами, більш, анїж тих, що з ними»; Господь відкрив юнакові очі, і він побачив, що «гора навкруги Елисея була заповнена кіньми й поломяними колесницями». Сирійців було вражено сліпотою, і Єлисей відвів їх до Самарії. Йосиф Флавій, переказуючи історію, називає царя Бен-Гададом. У залізну добу Дофан був містом царства Ізраїль."
    - "На початку IV ст. Євсевій ще показував Дотаїм як місце, де Йосип знайшов своїх братів. Назва жила далі: у 1851 р. голландський мандрівник К. В. М. ван де Вельде чув, як місцеві називали горб Дофан."
  es:
    - "Dotán es Tell Dotán, un gran montículo al sudoeste de Yenín y a unos 22 km al norte de Siquem. Se alza en un ancho valle por el que pasaba un camino entre la llanura costera y la llanura de Jezreel. Eusebio situó Dothaim a unas doce millas al norte de Sebaste, la antigua Samaria. Joseph P. Free, del Wheaton College, excavó el montículo de 1953 a 1964. Los restos más antiguos se remontan al Neolítico y al Calcolítico; en la Edad del Bronce Antiguo fue una ciudad amurallada, y volvió a estar poblada en el Bronce Medio y Tardío."
    - "En el Génesis, Jacob envió a José desde el valle de Hebrón para ver si sus hermanos estaban bien en Siquem. Un hombre le dijo que habían dicho: «Vamos á Dothán», y José los halló en Dotán. Lo arrojaron a una cisterna vacía, y cuando una compañía de ismaelitas llegó de Galaad con camellos que llevaban aromas, bálsamo y mirra a Egipto, lo vendieron por veinte piezas de plata. El relato sigue el camino comercial que atravesaba el valle."
    - "En los días de los reyes de Israel, el profeta Eliseo estaba en Dotán cuando el rey de Siria, cuyos planes él revelaba una y otra vez al rey de Israel, envió caballos, carros y un gran ejército, y cercaron la ciudad de noche. A su asustado siervo, Eliseo dijo: «No hayas miedo: porque más son los que están con nosotros que los que están con ellos»; el Señor abrió los ojos del joven, y este vio que «el monte estaba lleno de gente de á caballo, y de carros de fuego alrededor de Eliseo». Los sirios fueron heridos de ceguera, y Eliseo los condujo a Samaria. Josefo, al contar de nuevo la historia, nombra al rey Ben-adad. En la Edad del Hierro Dotán era una ciudad del reino de Israel."
    - "A comienzos del siglo IV Eusebio todavía mostraba Dothaim como el lugar donde José halló a sus hermanos. El nombre perduró: en 1851 el viajero holandés C. W. M. van de Velde oyó a los lugareños llamar al montículo Dothan."
  pt:
    - "Dotã é Tell Dothan, um grande monte a sudoeste de Jenin e a cerca de 22 km ao norte de Siquém. Fica num vale amplo por onde passava uma estrada entre a planície costeira e a planície de Jezreel. Eusébio situou Dothaim cerca de doze milhas ao norte de Sebaste, a antiga Samaria. Joseph P. Free, do Wheaton College, escavou o monte de 1953 a 1964. Os vestígios mais antigos remontam ao Neolítico e ao Calcolítico; no Bronze Antigo foi uma cidade murada, e foi habitada de novo nas Idades do Bronze Médio e Tardio."
    - "No Gênesis, Jacó enviou José do vale de Hebrom para ver se estava tudo bem com seus irmãos em Siquém. Um homem lhe disse que haviam dito: “Vamos para Dotã”, e José os encontrou em Dotã. Lançaram-no numa cisterna vazia, e quando uma caravana de ismaelitas veio de Gileade com camelos carregados de especiarias, bálsamo e mirra, descendo para o Egito, venderam-no por vinte peças de prata. A narrativa segue a estrada comercial que corria pelo vale."
    - "Nos dias dos reis de Israel, o profeta Eliseu estava em Dotã quando o rei da Síria, cujos planos ele não cessava de revelar ao rei de Israel, enviou cavalos, carros e um grande exército, e eles cercaram a cidade de noite. A seu servo assustado, Eliseu disse: “Não tenha medo, pois os que estão conosco são mais do que os que estão com eles”; o SENHOR abriu os olhos do jovem, e ele viu que “o monte estava cheio de cavalos e carros de fogo ao redor de Eliseu”. Os sírios foram feridos de cegueira, e Eliseu os levou a Samaria. Josefo, ao recontar a história, nomeia o rei Ben-Hadade. Na Idade do Ferro, Dotã foi uma cidade do reino de Israel."
    - "No início do século IV, Eusébio ainda indicava Dothaim como o lugar onde José encontrou seus irmãos. O nome sobreviveu: em 1851, o viajante holandês C. W. M. van de Velde ouviu os moradores chamarem o monte de Dothan."
  de:
    - "Dotan ist Tell Dotan, ein großer Hügel südwestlich von Dschenin und etwa 22 km nördlich von Sichem. Er liegt in einem breiten Tal, durch das eine Straße zwischen der Küstenebene und der Ebene Jesreel verlief. Eusebius setzte Dothaim etwa zwölf Meilen nördlich von Sebaste, dem alten Samaria, an. Joseph P. Free vom Wheaton College grub den Hügel von 1953 bis 1964 aus. Die ältesten Reste reichen in die Jungsteinzeit und Kupfersteinzeit zurück; in der Frühen Bronzezeit war er eine ummauerte Stadt, und er wurde in der Mittleren und Späten Bronzezeit erneut besiedelt."
    - "In der Genesis schickte Jakob Josef aus dem Tal von Hebron, um zu sehen, ob es seinen Brüdern in Sichem gut ging. Ein Mann sagte ihm, sie hätten gesagt: „Laßt uns gen Dothan gehen“, und Josef fand sie in Dotan. Sie warfen ihn in eine leere Grube, und als eine Karawane von Ismaelitern aus Gilead mit Kamelen kam, die Gewürz, Balsam und Myrrhe nach Ägypten hinabtrugen, verkauften sie ihn für zwanzig Silberstücke. Die Geschichte folgt der Handelsstraße, die durch das Tal verlief."
    - "In den Tagen der Könige Israels war der Prophet Elisa in Dotan, als der König von Syrien, dessen Pläne er dem König von Israel immer wieder verriet, Rosse, Wagen und ein großes Heer sandte und sie die Stadt bei Nacht umzingelten. Zu seinem verängstigten Diener sagte Elisa: „Fürchte dich nicht! denn derer ist mehr, die bei uns sind, als derer, die bei ihnen sind“; der HERR öffnete dem jungen Mann die Augen, und er sah, dass „der Berg voll feuriger Rosse und Wagen um Elisa her“ war. Die Syrer wurden mit Blindheit geschlagen, und Elisa führte sie nach Samaria. Josephus, der die Geschichte nacherzählt, nennt den König Benhadad. In der Eisenzeit war Dotan eine Stadt des Königreichs Israel."
    - "Anfang des 4. Jahrhunderts zeigte Eusebius Dothaim noch immer als den Ort, an dem Josef seine Brüder fand. Der Name lebte fort: 1851 hörte der niederländische Reisende C. W. M. van de Velde die Einheimischen den Hügel Dothan nennen."
  fr:
    - "Dothan est Tell Dothan, un grand tertre au sud-ouest de Jénine et à environ 22 km au nord de Sichem. Il se dresse dans une large vallée que traversait une route entre la plaine côtière et la plaine de Jizreel. Eusèbe plaçait Dothaim à environ douze milles au nord de Sébaste, l’ancienne Samarie. Joseph P. Free, du Wheaton College, fouilla le tertre de 1953 à 1964. Les plus anciens vestiges remontent au néolithique et au chalcolithique ; à l’âge du Bronze ancien, c’était une ville fortifiée, et elle fut de nouveau occupée aux âges du Bronze moyen et récent."
    - "Dans la Genèse, Jacob envoya Joseph de la vallée d’Hébron voir si tout allait bien pour ses frères à Sichem. Un homme lui dit qu’ils avaient dit : « Allons à Dothan », et Joseph les trouva à Dothan. Ils le jetèrent dans une citerne vide, et quand une caravane d’Ismaélites vint de Galaad avec des chameaux chargés d’aromates, de baume et de myrrhe pour les porter en Égypte, ils le vendirent pour vingt pièces d’argent. Le récit suit la route commerciale qui traversait la vallée."
    - "Du temps des rois d’Israël, le prophète Élisée se trouvait à Dothan quand le roi de Syrie, dont il révélait sans cesse les plans au roi d’Israël, envoya des chevaux, des chars et une grande armée, qui cernèrent la ville de nuit. À son serviteur effrayé, Élisée dit : « Ne crains point, car ceux qui sont avec nous sont en plus grand nombre que ceux qui sont avec eux » ; l’Éternel ouvrit les yeux du jeune homme, et il vit « la montagne pleine de chevaux et de chars de feu autour d’Élisée ». Les Syriens furent frappés d’aveuglement, et Élisée les conduisit à Samarie. Josèphe, en racontant l’épisode, nomme le roi Ben-Hadad. À l’âge du Fer, Dothan était une ville du royaume d’Israël."
    - "Au début du IVe siècle, Eusèbe montrait encore Dothaim comme le lieu où Joseph retrouva ses frères. Le nom a survécu : en 1851, le voyageur néerlandais C. W. M. van de Velde entendit les habitants appeler le tertre Dothan."
  it:
    - "Dotan è Tell Dotan, un grande tell a sud-ovest di Jenin e a circa 22 km a nord di Sichem. Sorge in un’ampia valle attraverso la quale passava una strada fra la pianura costiera e la piana di Izreel. Eusebio collocava Dothaim a circa dodici miglia a nord di Sebaste, l’antica Samaria. Joseph P. Free del Wheaton College scavò il tell dal 1953 al 1964. I resti più antichi risalgono al Neolitico e al Calcolitico; nel Bronzo Antico fu una città murata, e fu abitata di nuovo nel Bronzo Medio e Tardo."
    - "Nella Genesi Giacobbe mandò Giuseppe dalla valle di Ebron a vedere se i suoi fratelli stavano bene a Sichem. Un uomo gli disse che avevano detto: «Andiamocene a Dotan», e Giuseppe li trovò a Dotan. Lo gettarono in una cisterna vuota, e quando una carovana di Ismaeliti giunse da Galaad con cammelli carichi di aromi, balsamo e mirra diretti in Egitto, lo vendettero per venti pezzi d’argento. Il racconto segue la strada commerciale che correva attraverso la valle."
    - "Ai giorni dei re d’Israele il profeta Eliseo era a Dotan quando il re di Siria, i cui piani egli continuava a rivelare al re d’Israele, mandò cavalli, carri e un grande esercito, che circondarono la città di notte. Al servo spaventato Eliseo disse: «Non temere, perché quelli che son con noi son più numerosi di quelli che son con loro»; il Signore aprì gli occhi del giovane, che «vide a un tratto il monte pieno di cavalli e di carri di fuoco intorno ad Eliseo». I Siri furono colpiti dalla cecità, ed Eliseo li condusse a Samaria. Giuseppe Flavio, riraccontando la storia, nomina il re Ben-Adad. Nell’età del Ferro Dotan era una città del regno d’Israele."
    - "All’inizio del IV secolo Eusebio indicava ancora Dothaim come il luogo dove Giuseppe trovò i fratelli. Il nome sopravvisse: nel 1851 il viaggiatore olandese C. W. M. van de Velde sentì la gente del posto chiamare il tell Dothan."
  pl:
    - "Dotan to Tell Dotan, duży kopiec na południowy zachód od Dżeninu i około 22 km na północ od Sychem. Stoi w szerokiej dolinie, którą przebiegała droga między równiną nadmorską a równiną Jizreel. Euzebiusz umieszczał Dotaim około dwunastu mil na północ od Sebaste, dawnej Samarii. Joseph P. Free z Wheaton College prowadził wykopaliska na kopcu od 1953 do 1964 r. Najstarsze pozostałości sięgają neolitu i chalkolitu; we wczesnej epoce brązu było to miasto obwarowane murem, a zasiedlono je ponownie w środkowej i późnej epoce brązu."
    - "W Księdze Rodzaju Jakub wysłał Józefa z doliny Hebronu, by zobaczył, czy dobrze się mają jego bracia w Sychem. Pewien człowiek powiedział mu, że mówili: „Pójdźmy do Dotain”, i Józef znalazł ich w Dotain. Wrzucili go do pustej cysterny, a gdy karawana Izmaelitów przybyła z Gileadu z wielbłądami niosącymi korzenie, balsam i mirrę do Egiptu, sprzedali go za dwadzieścia srebrników. Opowieść podąża za szlakiem handlowym, który biegł przez dolinę."
    - "W dniach królów Izraela prorok Elizeusz przebywał w Dotan, gdy król Syrii, którego zamiary stale ujawniał królowi Izraela, wysłał konie, wozy i wielkie wojsko, i otoczyli miasto nocą. Przestraszonemu słudze Elizeusz powiedział: „Nie bój się; bo więcej ich z nami, niż z nimi”; Pan otworzył oczy młodzieńca i ujrzał: „góra pełna koni, i wozy ogniste około Elizeusza”. Syryjczycy zostali rażeni ślepotą, a Elizeusz zaprowadził ich do Samarii. Józef Flawiusz, opowiadając tę historię na nowo, nazywa króla Ben-Hadadem. W epoce żelaza Dotan było miastem królestwa Izraela."
    - "Na początku IV w. Euzebiusz wciąż wskazywał Dotaim jako miejsce, gdzie Józef znalazł swych braci. Nazwa przetrwała: w 1851 r. holenderski podróżnik C. W. M. van de Velde usłyszał, jak miejscowi nazywają kopiec Dotan."
  nl:
    - "Dotan is Tell Dotan, een grote heuvel ten zuidwesten van Jenin en zo'n 22 km ten noorden van Sichem. Zij ligt in een brede vallei waardoor een weg liep tussen de kustvlakte en de vlakte van Jizreël. Eusebius plaatste Dothaim ongeveer twaalf mijl ten noorden van Sebaste, het oude Samaria. Joseph P. Free van Wheaton College groef de heuvel op van 1953 tot 1964. De oudste resten gaan terug tot het Neolithicum en Chalcolithicum; in de Vroege Bronstijd was het een ommuurde stad, en zij werd opnieuw bewoond in de Midden- en Late Bronstijd."
    - "In Genesis zond Jakob Jozef uit het dal van Hebron om te zien of het zijn broers te Sichem goed ging. Een man zei hem dat zij hadden gezegd: “Laat ons naar Dothan gaan”, en Jozef vond hen te Dothan. Zij wierpen hem in een lege put, en toen een karavaan Ismaëlieten uit Gilead kwam met kamelen die specerijen, balsem en mirre naar Egypte brachten, verkochten zij hem voor twintig zilverlingen. Het verhaal volgt de handelsweg die door de vallei liep."
    - "In de dagen van de koningen van Israël was de profeet Elisa te Dotan toen de koning van Syrië, wiens plannen hij steeds aan de koning van Israël onthulde, paarden, wagens en een groot leger zond, en zij de stad bij nacht omringden. Tot zijn angstige knecht zei Elisa: “Vrees niet; want die bij ons zijn, zijn meer, dan die bij hen zijn”; de HEER opende de ogen van de jongen, en hij zag dat “de berg was vol vurige paarden en wagenen rondom Elisa”. De Syriërs werden met blindheid geslagen, en Elisa leidde hen naar Samaria. Flavius Josephus, die het verhaal navertelt, noemt de koning Ben-Hadad. In de IJzertijd was Dotan een stad van het koninkrijk Israël."
    - "In het begin van de 4e eeuw wees Eusebius Dothaim nog aan als de plaats waar Jozef zijn broers vond. De naam leefde voort: in 1851 hoorde de Nederlandse reiziger C.W.M. van de Velde de bewoners de heuvel Dothan noemen."
  cs:
    - "Dótan je Tell Dothan, velký pahorek jihozápadně od Jeninu a asi 22 km severně od Šekemu. Stojí v široké dolině, kterou procházela cesta mezi pobřežní rovinou a Jizreelskou rovinou. Eusebios umístil Dothaim asi dvanáct mil severně od Sebasté, staré Samaří. Joseph P. Free z Wheaton College vykopával pahorek v letech 1953 až 1964. Nejstarší pozůstatky sahají do neolitu a chalkolitu; v rané době bronzové bylo hrazeným městem a znovu bylo osídleno ve střední a pozdní době bronzové."
    - "V Genesi Jákob poslal Josefa z hebronského údolí, aby se podíval, jak se daří jeho bratřím v Šekemu. Muž mu řekl, že říkali: „Poďme do Dothain“, a Josef je našel v Dótanu. Uvrhli ho do prázdné cisterny, a když z Gileadu přišla karavana Izmaelitů s velbloudy nesoucími vonné věci, balzám a myrhu dolů do Egypta, prodali ho za dvacet stříbrných. Příběh sleduje obchodní cestu, která procházela dolinou."
    - "Za králů Izraele byl prorok Elíša v Dótanu, když syrský král, jehož plány stále prozrazoval izraelskému králi, poslal koně, vozy a velké vojsko, a ti obklíčili město v noci. Svému vyděšenému služebníku Elíša řekl: „Neboj se, nebo mnohem více jich s námi jest, než s nimi“; Hospodin otevřel mladíkovi oči a ten uviděl, že „hora ta plná koňů, a vozové ohniví okolo Elizea“. Syřané byli poraženi slepotou a Elíša je odvedl do Samaří. Josephus, převyprávějící příběh, nazývá krále Benhadadem. V době železné byl Dótan městem Izraelského království."
    - "Na počátku 4. století stále ukazoval Eusebios Dothaim jako místo, kde Josef našel své bratry. Jméno žilo dál: roku 1851 slyšel nizozemský cestovatel C. W. M. van de Velde místní lidi nazývat pahorek Dothan."
  sv:
    - "Dotan är Tell Dothan, en stor kulle sydväst om Jenin och omkring 22 km norr om Shekem. Den ligger i en bred dal genom vilken en väg gick mellan kustslätten och Jisreelslätten. Eusebios placerade Dothaim omkring tolv romerska mil norr om Sebaste, det gamla Samaria. Joseph P. Free från Wheaton College grävde ut kullen 1953–1964. De äldsta lämningarna går tillbaka till neolitikum och kalkolitikum; under äldre bronsålder var den en muromgärdad stad, och den bebyggdes på nytt under mellersta och sen bronsålder."
    - "I Första Mosebok sände Jakob Josef från Hebrons dal för att se hur det stod till med hans bröder vid Shekem. En man berättade att de hade sagt: ”Låt oss gå till Dotain”, och Josef fann dem i Dotan. De kastade honom i en tom brunn, och när ett tåg av ismaeliter kom från Gilead med kameler lastade med dragantgummi, balsam och ladanum på väg ner till Egypten, sålde de honom för tjugu siklar silver. Berättelsen följer handelsvägen som gick genom dalen."
    - "På Israels kungars tid var profeten Elisha i Dotan när kungen av Aram, vars planer han ständigt avslöjade för Israels kung, sände hästar, vagnar och en stor här, och de omringade staden om natten. Till sin förskräckta tjänare sade Elisha: ”Frukta icke; ty de som äro med oss äro flera än de som äro med dem”; HERREN öppnade den unge mannens ögon, och han fick se att ”berget var fullt med hästar och vagnar av eld, runt omkring Elisa”. Araméerna slogs med blindhet, och Elisha förde dem till Samaria. Josefus, som återberättar historien, kallar kungen Ben-Hadad. Under järnåldern var Dotan en stad i kungariket Israel."
    - "I början av 300-talet pekade Eusebios fortfarande ut Dothaim som platsen där Josef fann sina bröder. Namnet levde kvar: 1851 hörde den holländske resenären C. W. M. van de Velde lokalbefolkningen kalla kullen Dothan."
  nb:
    - "Dotan er Tell Dotan, en stor haug sørvest for Jenin og omtrent 22 km nord for Sikem. Den ligger i en bred dal der en vei gikk mellom kystsletten og Jisreel-sletten. Eusebius plasserte Dothaim omtrent tolv romerske mil nord for Sebaste, det gamle Samaria. Joseph P. Free ved Wheaton College gravde ut haugen fra 1953 til 1964. De tidligste restene går tilbake til neolittisk og kalkolittisk tid; i tidlig bronsealder var den en befestet by, og den ble bosatt igjen i mellom- og senbronsealderen."
    - "I 1. Mosebok sendte Jakob Josef fra Hebron-dalen for å se om det sto vel til med brødrene hans i Sikem. En mann fortalte ham at de hadde sagt: «La oss gå til Dotan!», og Josef fant dem i Dotan. De kastet ham ned i en tom brønn, og da et reisefølge av ismaelitter kom fra Gilead med kameler som bar krydderier, balsam og ladanum ned til Egypt, solgte de ham for tyve sekel sølv. Fortellingen følger handelsveien som gikk gjennom dalen."
    - "På Israels kongers tid var profeten Elisja i Dotan da kongen i Syria, hvis planer han stadig avslørte for Israels konge, sendte hester, vogner og en stor hær, og de omringet byen om natten. Til sin redde tjener sa Elisja: «Vær ikke redd! De som er med oss, er flere enn de som er med dem»; Herren åpnet den unge mannens øyne, og han så at «fjellet var fullt av gloende hester og vogner rundt omkring Elisa». Syrerne ble slått med blindhet, og Elisja førte dem til Samaria. Josefus, som gjenforteller historien, kaller kongen Ben-Hadad. I jernalderen var Dotan en by i kongeriket Israel."
    - "Tidlig på 300-tallet pekte Eusebius fremdeles ut Dothaim som stedet der Josef fant sine brødre. Navnet levde videre: i 1851 hørte den nederlandske reisende C. W. M. van de Velde lokalbefolkningen kalle haugen Dotan."
  tl:
    - "Ang Dotan ay ang Tell Dothan, isang malaking tel sa timog-kanluran ng Jenin at mga 22 km sa hilaga ng Sichem. Nakatayo ito sa malawak na libis na dinaraanan ng isang daan sa pagitan ng kapatagang baybayin at ng kapatagan ng Jezreel. Inilagay ni Eusebio ang Dothaim mga labindalawang milya sa hilaga ng Sebaste, ang dating Samaria. Hinukay ni Joseph P. Free ng Wheaton College ang tel mula 1953 hanggang 1964. Ang pinakamaagang labi ay mula sa Neolitiko at Chalcolitiko; sa Maagang Panahon ng Tanso ito ay bayang may pader, at tinirhan itong muli noong Gitna at Huling Panahon ng Tanso."
    - "Sa Genesis, isinugo ni Jacob si Jose mula sa libis ng Hebron upang tingnan kung mabuti ang kalagayan ng kaniyang mga kapatid sa Sichem. Sinabi ng isang lalaki na sinabi ng mga ito, “Tayo na sa Dotan”, at nasumpungan ni Jose sila sa Dotan. Inihagis nila siya sa isang walang lamang hukay, at nang dumating ang isang pulutong ng mga Ismaelita mula sa Gilead na may mga kamelyong may dalang pabango, balsamo at mira pababa sa Egipto, ipinagbili nila siya sa halagang dalawampung pirasong pilak. Sinusundan ng kuwento ang daan ng kalakalan na dumaan sa libis."
    - "Noong mga araw ng mga hari ng Israel, nasa Dotan ang propetang si Eliseo nang magsugo ang hari ng Siria, na ang mga plano ay patuloy niyang inihahayag sa hari ng Israel, ng mga kabayo, karo at malaking hukbo, at pinalibutan nila ang lungsod sa gabi. Sa natatakot niyang lingkod, sinabi ni Eliseo, “Huwag kang matakot: sapagka't ang sumasaatin ay higit kay sa sumasa kanila”; idinilat ng Panginoon ang mga mata ng binata, at nakita niyang “ang bundok ay puno ng mga kabayo at ng mga karo ng apoy sa palibot ni Eliseo”. Binulag ang mga Siryo, at inakay sila ni Eliseo sa Samaria. Pinangalanan ni Josefo, sa muling pagsasalaysay ng kuwento, ang haring Ben-adad. Noong Panahon ng Bakal, ang Dotan ay bayan ng kaharian ng Israel."
    - "Noong maagang ika-4 na siglo, ipinakilala pa rin ni Eusebio ang Dothaim bilang pook kung saan nasumpungan ni Jose ang kaniyang mga kapatid. Nanatili ang pangalan: noong 1851, narinig ng manlalakbay na Olandes na si C. W. M. van de Velde na tinatawag ng mga lokal ang tel na Dothan."
  da:
    - "Dotan er Tell Dotan, en stor høj sydvest for Jenin og cirka 22 km nord for Sikem. Den ligger i en bred dal, hvor en vej gik mellem kystsletten og Jizre'el-sletten. Eusebios placerede Dothaim cirka tolv romerske mil nord for Sebaste, det gamle Samaria. Joseph P. Free fra Wheaton College udgravede højen fra 1953 til 1964. De tidligste rester går tilbage til yngre stenalder og kobberalder; i tidlig bronzealder var den en ommuret by, og den blev bosat igen i mellem- og senbronzealderen."
    - "I 1 Mosebog sendte Jakob Josef fra Hebrons dal for at se, om det gik godt med hans brødre ved Sikem. En mand fortalte ham, at de havde sagt: »Lader os gaa til Dothan«, og Josef fandt dem i Dotan. De kastede ham i en tom cisterne, og da et følge ismaelitter kom fra Gilead med kameler, der bar krydderier, balsam og myrra ned til Egypten, solgte de ham for tyve stykker sølv. Fortællingen følger den handelsvej, der løb gennem dalen."
    - "I Israels kongers tid var profeten Elisa i Dotan, da Syriens konge, hvis planer han stadig afslørede for Israels konge, sendte heste, vogne og en stor hær, og de omringede byen om natten. Til sin forskrækkede tjener sagde Elisa: »Frygt intet; thi de ere flere, som ere hos os, end de, som ere hos dem«; Herren åbnede den unge mands øjne, og han så, og »da var Bjerget fuldt af gloende Heste og Vogne trindt omkring Elisa«. Syrerne blev slået med blindhed, og Elisa førte dem til Samaria. Josefus, der genfortæller historien, nævner kongen som Ben-Hadad. I jernalderen var Dotan en by i kongeriget Israel."
    - "I begyndelsen af 300-tallet pegede Eusebios stadig på Dothaim som stedet, hvor Josef fandt sine brødre. Navnet levede videre: I 1851 hørte den nederlandske rejsende C. W. M. van de Velde de lokale kalde højen Dothan."
  sr:
    - "Дотаим је Тел Дотан, велика хумка југозападно од Џенина и око 22 км северно од Сихема. Стоји у широкој долини кроз коју је пролазио пут између приобалне равнице и језраелске равнице. Јевсевије је смештао Дотаим око дванаест миља северно од Себасте, старе Самарије. Џозеф П. Фри са колеџа Витон ископавао је хумку од 1953. до 1964. Најранији остаци сежу у неолит и халколит; у раном бронзаном добу био је град са зидинама, а поново је насељен у средњем и касном бронзаном добу."
    - "У Постању Јаков је послао Јосифа из долине хевронске да види како су његова браћа код Сихема. Један човек му је рекао да су рекли: „Хајдемо у Дотаим“, и Јосиф их је нашао у Дотаиму. Бацили су га у празну јаму, а када је гомила Исмаиљаца дошла из Галада с камилама које су носиле мирисаво корење, тамјан и смирну у Египат, продали су га за двадесет сребрника. Прича прати трговачки пут који је пролазио долином."
    - "У доба краљева Израиља пророк Јелисије био је у Дотаиму када је сиријски цар, чије је планове стално откривао израиљском цару, послао коње, кола и велику војску, и они су ноћу опколили град. Свом уплашеном слузи Јелисије је рекао: „Не бој се, јер је више наших него њихових“; Господ је отворио младићу очи, и он је видео да је гора „пуна коња и кола огњених око Јелисија“. Сирци су били ударени слепилом, а Јелисије их је одвео у Самарију. Јосиф Флавије, препричавајући причу, именује цара Вен-Адада. У гвоздено доба Дотаим је био град краљевства Израиља."
    - "Почетком 4. века Јевсевије је још показивао Дотаим као место где је Јосиф нашао своју браћу. Име је живело даље: 1851. холандски путник К. В. М. ван де Велде чуо је месне људе како хумку зову Дотан."
  hu:
    - "Dótán Tell Dótán, nagy halom Dzsenintől délnyugatra és Sikemtől mintegy 22 km-re északra. Széles völgyben áll, amelyen át út vezetett a tengerparti síkság és a Jezréel-síkság között. Eusebius Dothaimot Sebastétől, a régi Szamáriától mintegy tizenkét mérföldre északra helyezte. Joseph P. Free a Wheaton College-ból 1953-tól 1964-ig ásta a halmot. A legkorábbi maradványok a neolitikumra és a rézkorra nyúlnak vissza; a korai bronzkorban fallal övezett város volt, és a középső és késő bronzkorban ismét lakott."
    - "Mózes első könyvében Jákób Hebron völgyéből Józsefet elküldte megnézni, jól vannak-e testvérei Sikemben. Egy ember azt mondta neki, hogy hallotta tőlük: „Menjünk Dóthánba”, és József Dóthánban találta meg őket. Egy üres kútba vetették, és amikor Gileádból izmaelita karaván jött tevéken fűszerszámot, balzsamot és mirhát víve le Egyiptomba, húsz ezüstpénzen eladták. A történet a völgyön átvezető kereskedelmi utat követi."
    - "Izráel királyainak napjaiban Elizeus próféta Dótánban volt, amikor Szíria királya, akinek tervét újra meg újra felfedte Izráel királyának, lovakat, szekereket és nagy sereget küldött, és ezek éjjel körülvették a várost. Megrémült szolgájának Elizeus azt mondta: „Ne félj. Mert többen vannak, a kik velünk vannak, mint a kik ő velök.” Az Úr megnyitotta az ifjú szemét, és ő látta, hogy „a hegy rakva volt tüzes lovagokkal és szekerekkel Elizeus körül”. A szíriaiakat vaksággal verte meg, és Elizeus Szamáriába vezette őket. Josephus, a történetet újramesélve, a királyt Ben-Hadadnak nevezi. A vaskorban Dótán az Izráel királyság városa volt."
    - "A 4. század elején Eusebius még mutogatta Dothaimot annak a helynek, ahol József megtalálta testvéreit. A név fennmaradt: 1851-ben a holland utazó, C. W. M. van de Velde hallotta, hogy a helyiek Dótánnak hívják a halmot."
  fi:
    - "Dotan on Tell Dotan, suuri kumpare Jeninistä lounaaseen ja noin 22 km Sikemistä pohjoiseen. Se sijaitsee laajassa laaksossa, jonka läpi tie kulki rannikkotasangon ja Jisreelin tasangon välillä. Eusebios sijoitti Dothaimin noin kaksitoista mailia Sebastesta, vanhasta Samariasta, pohjoiseen. Joseph P. Free Wheaton Collegesta kaivoi kumparetta vuosina 1953–1964. Varhaisimmat jäännökset ulottuvat neoliittiselle ja kalkoliittiselle kaudelle; varhaispronssikaudella se oli muurein ympäröity kaupunki, ja se asutettiin uudelleen keski- ja myöhäispronssikausilla."
    - "1. Mooseksen kirjassa Jaakob lähetti Joosefin Hebronin laaksosta katsomaan, oliko hänen veljillään Sikemissä hyvin. Eräs mies kertoi hänelle heidän sanoneen: ”Menkäämme Dootaniin”, ja Joosef löysi heidät Dotanista. He heittivät hänet tyhjään kaivoon, ja kun ismaelilaisten kulkue tuli Gileadista kamelit kantaen mausteita, balsamia ja mirhamia alas Egyptiin, he myivät hänet kahdestakymmenestä hopearahasta. Kertomus seuraa laakson läpi kulkenutta kauppatietä."
    - "Israelin kuninkaiden aikana profeetta Elisa oli Dotanissa, kun Syyrian kuningas, jonka suunnitelmat hän paljasti Israelin kuninkaalle, lähetti hevosia, vaunuja ja suuren sotajoukon, ja ne piirittivät kaupungin yöllä. Pelästyneelle palvelijalleen Elisa sanoi: ”Älä pelkää, sillä niitä, jotka ovat meidän kanssamme, on enemmän kuin niitä, jotka ovat heidän kanssansa”; Herra avasi nuorukaisen silmät, ja hän näki, että ”vuori oli täynnä tulisia hevosia ja tulisia vaunuja Elisan ympärillä”. Syyrialaiset lyötiin sokeudella, ja Elisa johti heidät Samariaan. Josefus nimeää kertomuksessaan kuninkaan Benhadadiksi. Rautakaudella Dotan oli Israelin kuningaskunnan kaupunki."
    - "300-luvun alussa Eusebios osoitti yhä Dothaimin paikaksi, josta Joosef löysi veljensä. Nimi säilyi: vuonna 1851 hollantilainen matkailija C. W. M. van de Velde kuuli paikallisten kutsuvan kumparetta Dothaniksi."
  vi:
    - "Đô-than là Tell Dothan, một gò lớn phía tây nam Jenin và cách Si-chem khoảng 22 km về phía bắc. Nó đứng trong một thung lũng rộng, nơi một con đường đi qua giữa đồng bằng ven biển và đồng bằng Gít-rê-ên. Eusebius đặt Dothaim cách Sebaste, Sa-ma-ri xưa, khoảng mười hai dặm về phía bắc. Joseph P. Free của Wheaton College khai quật gò từ năm 1953 đến 1964. Các di tích sớm nhất trở về thời đồ đá mới và đồ đá đồng; vào thời đồ đồng sớm nó là một thị trấn có tường, và nó lại có người ở vào thời đồ đồng giữa và muộn."
    - "Trong sách Sáng thế ký, Gia-cốp sai Giô-sép từ thung lũng Hếp-rôn đi xem các anh mình ở Si-chem có bình an không. Một người nói với ông rằng họ đã nói: “Ta hãy đi đến Đô-ta-in”, và Giô-sép gặp họ ở Đô-than. Họ quăng ông xuống một cái hố trống, và khi một đoàn người Ích-ma-ên từ Ga-la-át đến với những con lạc đà chở hương liệu, nhũ hương và một dược xuống Ê-díp-tô, họ bán ông với giá hai mươi miếng bạc. Câu chuyện đi theo con đường buôn bán chạy qua thung lũng."
    - "Vào thời các vua Y-sơ-ra-ên, nhà tiên tri Ê-li-sê ở tại Đô-than khi vua Sy-ri, kẻ có các mưu kế bị ông cứ tiết lộ cho vua Y-sơ-ra-ên, sai ngựa, xe và một đạo quân lớn đến, và họ bao vây thành trong đêm. Với người tôi tớ hoảng sợ, Ê-li-sê nói: “Chớ sợ, những người ở với chúng ta đông hơn những người ở với chúng nó”; Đức Giê-hô-va mở mắt người trẻ, và người thấy “núi đầy những ngựa và xe bằng lửa ở chung quanh Ê-li-sê”. Người Sy-ri bị mù, và Ê-li-sê dẫn họ đến Sa-ma-ri. Josephus, khi kể lại câu chuyện, gọi tên vua là Benhadad. Vào thời đồ sắt Đô-than là một thành của vương quốc Y-sơ-ra-ên."
    - "Vào đầu thế kỷ 4, Eusebius vẫn chỉ Dothaim là nơi Giô-sép gặp các anh. Tên vẫn còn: năm 1851, nhà du hành người Hà Lan C. W. M. van de Velde nghe dân địa phương gọi gò là Dothan."
  ro:
    - "Dotan este Tell Dothan, o mare movilă la sud-vest de Jenin și la circa 22 km nord de Sihem. Se află într-o vale largă prin care trecea un drum între câmpia de coastă și câmpia Izreel. Eusebiu a așezat Dothaim la circa douăsprezece mile nord de Sebaste, vechea Samarie. Joseph P. Free de la Wheaton College a săpat movila din 1953 până în 1964. Cele mai vechi rămășițe merg înapoi până în neolitic și calcolitic; în epoca bronzului timpuriu a fost o cetate ziduită, iar în epoca bronzului mijlociu și târziu a fost locuită din nou."
    - "În Geneza, Iacov l-a trimis pe Iosif din valea Hebronului să vadă dacă frații lui sunt bine la Sihem. Un om i-a spus că ei ziseseră: „să mergem în Dotaim”, iar Iosif i-a găsit în Dotaim. L-au aruncat într-o groapă goală, iar când o ceată de ismaeliți a venit din Galaad cu cămile încărcate cu mirodenii, balsam și smirnă, coborând spre Egipt, l-au vândut pentru douăzeci de arginți. Istorisirea urmează drumul comercial care trecea prin vale."
    - "În zilele regilor lui Israel, profetul Elisei se afla la Dotan când regele Siriei, ale cărui planuri le dezvăluia mereu regelui lui Israel, a trimis cai, care și o mare oaste, iar ei au înconjurat cetatea noaptea. Slujitorului său înfricoșat Elisei i-a spus: „nu te teme că mai mulți sunt cu noi, decât cu ei”; Domnul a deschis ochii tânărului, iar acesta a văzut că „muntele erà plin de cai și de care de foc împrejurul lui Eliseiu”. Sirienii au fost loviți de orbire, iar Elisei i-a dus la Samaria. Iosif Flaviu, povestind întâmplarea, numește regele Ben-Hadad. În epoca fierului, Dotan era o cetate a regatului lui Israel."
    - "La începutul secolului al IV-lea, Eusebiu încă arăta Dothaim ca locul unde Iosif și-a găsit frații. Numele a trăit mai departe: în 1851, călătorul olandez C. W. M. van de Velde a auzit localnicii numind movila Dothan."
  bg:
    - "Дотан е Тел Дотан, голяма могила югозападно от Дженин и на около 22 км северно от Сихем. Той стои в широка долина, през която минавал път между крайбрежната равнина и Изреелската равнина. Евсевий поставя Дотаим на около дванадесет мили северно от Себастия, старата Самария. Джоузеф П. Фрий от колежа „Уийтън“ разкопавал могилата от 1953 до 1964 г. Най-ранните останки датират от неолита и халколита; през ранната бронзова епоха това бил град със стени, а през средната и късната бронзова епоха бил заселен отново."
    - "В Битие Яков изпратил Йосиф от Хевронската долина да види дали братята му в Сихем са добре. Един човек му казал, че са рекли: „Да идем в Дотан“, и Йосиф ги намерил в Дотан. Те го хвърлили в празен ров, а когато една дружина исмаиляни дошла от Галаад с камили, натоварени с аромати, балсам и смирна, на път надолу към Египет, го продали за двадесет сребърника. Разказът следва търговския път, който минавал през долината."
    - "В дните на израилските царе пророк Елисей бил в Дотан, когато сирийският цар, чиито планове той непрекъснато разкривал на израилския цар, изпратил коне, колесници и голяма войска, и те обиколили града през нощта. На уплашения си слуга Елисей казал: „Не бой се; защото повече са онези които са с нас нежели онези които са с тях“; Господ отворил очите на младежа и той видял, че „гората бе пълна с коне и колесници огнени около Елисея“. Сирийците били поразени със слепота и Елисей ги завел в Самария. Йосиф Флавий, преразказвайки историята, назовава царя Венадад. През желязната епоха Дотан бил град на Израилското царство."
    - "В началото на IV в. Евсевий още посочвал Дотаим като мястото, където Йосиф намерил братята си. Името оцеляло: през 1851 г. холандският пътешественик К. В. М. ван де Велде чул местните жители да наричат могилата Дотан."
