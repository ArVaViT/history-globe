body:
  en:
    - "Jattir was a town in the hill country of Judah, on the southern slopes of the Hebron hills where they fall away to the Negeb. It is identified with Khirbet Attir (Horvat Yattir), a ruin about 20 km south-south-west of Hebron that keeps the ancient name; the identification is not disputed. Eusebius says that Jether in his day was a very large village of the inner Daroma, twenty miles from Eleutheropolis near Malatha, inhabited entirely by Christians, and excavations in 1995–1999 uncovered two churches with mosaic floors from that Byzantine village, as well as pottery of the seventh century BC."
    - "Joshua lists Jattir among the towns of Judah “in the mountains”, with Shamir and Socoh, and gives it with its pasture lands to the priests, the sons of Aaron, together with Hebron, Libnah and Eshtemoa; Chronicles repeats the grant. When David came back to Ziklag with the spoil of the Amalekites he sent presents to the elders of Judah, “to them which were in Beth-el, and to them which were in south Ramoth, and to them which were in Jattir”, the towns of the south that had sheltered him in his outlaw years. Ira and Gareb “the Ithrite”, two of David's mighty men, may have come from Jattir, though the name may instead mean the clan of Ithrites that Chronicles connects with Kiriath-jearim."
    - "The ruin today lies at the edge of the Yatir Forest, Israel's largest planted forest, named after it, on the border with the West Bank south of as-Samu, the ancient Eshtemoa."
  ru:
    - "Иаттир был городом в нагорье Иуды, на южных склонах Хевронских гор, где они спускаются к Негеву. Его отождествляют с Хирбет-Аттиром (Хорват-Яттир), городищем примерно в 20 км к юго-юго-западу от Хеврона, сохранившим древнее имя; отождествление не оспаривается. Евсевий говорит, что Иефер в его дни был очень большим селением внутренней Даромы, в двадцати милях от Елевферополя близ Малафы, населённым одними христианами, и раскопки 1995–1999 годов открыли две церкви с мозаичными полами из этого византийского села, а также керамику VII века до н. э."
    - "Книга Иисуса Навина числит Иаттир среди городов Иуды «на горах», с Шамиром и Сохо, и отдаёт его с предместьями священникам, сыновьям Аарона, вместе с Хевроном, Ливной и Ештемо; Паралипоменон повторяет это. Вернувшись в Секелаг с добычей, взятой у Амаликитян, Давид послал подарки старейшинам Иуды — «тем, которые в Вефиле, и в Рамофе южном, и в Иаттире», в города юга, укрывавшие его в годы скитаний. Ира и Гареб «Итритянин», двое из храбрых Давида, могли быть родом из Иаттира, хотя имя может означать и род Ифриян, который Паралипоменон связывает с Кириаф-Иаримом."
    - "Городище сегодня лежит на краю леса Ятир, самого большого рукотворного леса Израиля, названного по нему, у границы с Западным берегом, к югу от Эс-Самуа, древнего Ештемо."
  uk:
    - "Яттір було містом у гірській країні Юди, на південних схилах хевронських пагорбів, де вони спадають до Негеву. Його ототожнюють із Хірбет-Аттір (Хорват-Яттір), руїною приблизно за 20 км на південь-південний захід від Хеврона, що зберігає давню назву; ототожнення не оспорюється. Євсевій каже, що Єфер за його часів був дуже великим селом внутрішньої Дароми, за двадцять миль від Елевферополя поблизу Малати, цілком заселеним християнами, і розкопки 1995–1999 років відкрили дві церкви з мозаїчними підлогами з цього візантійського села, а також кераміку VII ст. до н. е."
    - "Книга Ісуса Навина перелічує Яттір серед міст Юди «По горах», з Шаміром і Сохо, і дає його з пасовищами священикам, синам Аарона, разом з Хевроном, Лівною та Ештемоа; Хроніки повторюють дарування. Коли Давид повернувся до Ціклага зі здобиччю від амаликитян, він послав дарунки старійшинам Юди, «Так само й тим, що в Бетелї, в Рамотї полуденньому, і в Яттирі», містам півдня, що давали йому притулок у роки його вигнання. Іра і Гареб «з Ітрі», двоє Давидових лицарів, могли бути з Яттіра, хоча назва може означати й рід ітрян, який Хроніки пов’язують з Кір’ят-Єаримом."
    - "Руїна нині лежить на краю лісу Ятір, найбільшого штучного лісу Ізраїлю, названого за нею, на кордоні із Західним берегом на південь від ес-Саму, давнього Ештемоа."
  es:
    - "Jatir era una población de la región montañosa de Judá, en las laderas meridionales de las colinas de Hebrón donde descienden hacia el Néguev. Se identifica con Khirbet Attir (Horvat Yattir), una ruina a unos 20 km al sudsudoeste de Hebrón que conserva el nombre antiguo; la identificación no se discute. Eusebio dice que Jeter era en su tiempo una aldea muy grande del interior del Daroma, a veinte millas de Eleuterópolis, cerca de Malata, habitada enteramente por cristianos, y las excavaciones de 1995–1999 sacaron a la luz dos iglesias con suelos de mosaico de esa aldea bizantina, así como cerámica del siglo VII a. C."
    - "Josué enumera Jatir entre las ciudades de Judá «en las montañas», con Samir y Soco, y la da con sus ejidos a los sacerdotes, hijos de Aarón, junto con Hebrón, Libna y Estemoa; Crónicas repite la concesión. Cuando David volvió a Siclag con el botín de los amalecitas, envió regalos a los ancianos de Judá, «A los que estaban en Beth-el, y en Ramoth al mediodía, y á los que estaban en Jattir», las ciudades del sur que lo habían acogido en sus años de proscrito. Ira y Gareb «de Ithri», dos de los valientes de David, pueden haber venido de Jatir, aunque el nombre puede significar más bien el clan de los itreos que Crónicas vincula con Quiriat-jearim."
    - "La ruina se halla hoy en el borde del bosque de Yatir, el mayor bosque plantado de Israel, que lleva su nombre, en la frontera con Cisjordania, al sur de as-Samu, la antigua Estemoa."
  pt:
    - "Jatir era uma cidade na região montanhosa de Judá, nas encostas meridionais das colinas de Hebrom, onde elas descem para o Neguebe. É identificada com Khirbet Attir (Horvat Yattir), uma ruína a cerca de 20 km a su-sudoeste de Hebrom que guarda o antigo nome; a identificação não é contestada. Eusébio diz que Jéter, em seu tempo, era uma aldeia muito grande do interior do Daroma, a vinte milhas de Eleutéropolis, perto de Malata, habitada inteiramente por cristãos, e as escavações de 1995–1999 trouxeram à luz duas igrejas com pisos de mosaico dessa aldeia bizantina, além de cerâmica do século VII a.C."
    - "Josué lista Jatir entre as cidades de Judá “na região montanhosa”, com Samir e Socó, e a dá com suas pastagens aos sacerdotes, filhos de Arão, junto com Hebrom, Libna e Estemoa; Crônicas repete a concessão. Quando Davi voltou a Ziclague com os despojos dos amalequitas, enviou presentes aos anciãos de Judá, “aos que estavam em Betel, em Ramote do Sul e em Jatir”, as cidades do sul que o haviam abrigado nos anos em que foi fora da lei. Ira e Garebe, “o itrita”, dois dos valentes de Davi, podem ter vindo de Jatir, embora o nome possa significar antes o clã dos itritas que Crônicas liga a Quiriate-Jearim."
    - "A ruína fica hoje na orla da Floresta de Yatir, a maior floresta plantada de Israel, com o nome dela, na fronteira com a Cisjordânia, ao sul de as-Samu, a antiga Estemoa."
  de:
    - "Jattir war eine Stadt im Bergland Judas, an den Südhängen der Hebroner Berge, wo sie zum Negev abfallen. Es wird mit Chirbet Attir (Horvat Jatir) gleichgesetzt, einer Ruine etwa 20 km süd-südwestlich von Hebron, die den antiken Namen bewahrt; die Gleichsetzung ist unbestritten. Eusebius sagt, Jeter sei zu seiner Zeit ein sehr großes Dorf der inneren Daroma gewesen, zwanzig Meilen von Eleutheropolis nahe Malatha, ganz von Christen bewohnt, und Grabungen 1995–1999 legten zwei Kirchen mit Mosaikböden aus diesem byzantinischen Dorf frei, ebenso Keramik des 7. Jahrhunderts v. Chr."
    - "Josua führt Jattir unter den Städten Judas „auf dem Gebirge“ auf, mit Schamir und Socho, und gibt es mit seinem Weideland den Priestern, den Söhnen Aarons, zusammen mit Hebron, Libna und Eschtemoa; die Chronik wiederholt die Schenkung. Als David mit der Beute der Amalekiter nach Ziklag zurückkam, sandte er den Ältesten Judas Geschenke, „denen zu Beth-El, denen zu Ramoth im Mittagsland, denen zu Jatthir“, den Städten des Südens, die ihn in seinen Jahren als Gesetzloser beherbergt hatten. Ira und Gareb, „der Jethriter“, zwei von Davids Helden, stammten vielleicht aus Jattir, obwohl der Name auch die Sippe der Jitriter meinen kann, die die Chronik mit Kirjat-Jearim verbindet."
    - "Die Ruine liegt heute am Rand des Jatir-Waldes, Israels größtem gepflanzten Wald, der nach ihr benannt ist, an der Grenze zum Westjordanland südlich von as-Samu, dem antiken Eschtemoa."
  fr:
    - "Jatthir était une ville de la montagne de Juda, sur les pentes méridionales des collines d’Hébron là où elles descendent vers le Négev. On l’identifie à Khirbet Attir (Horvat Yattir), une ruine à environ 20 km au sud-sud-ouest d’Hébron qui garde le nom antique ; l’identification n’est pas contestée. Eusèbe dit que Jéther était de son temps un très grand village du Daroma intérieur, à vingt milles d’Éleuthéropolis près de Malatha, habité entièrement par des chrétiens, et des fouilles de 1995–1999 ont mis au jour deux églises à sols de mosaïque de ce village byzantin, ainsi que de la poterie du VIIe siècle av. J.-C."
    - "Josué compte Jatthir parmi les villes de Juda « dans la montagne », avec Schamir et Soco, et la donne avec ses pâturages aux prêtres, fils d’Aaron, avec Hébron, Libna et Eschthemoa ; les Chroniques répètent la donation. Quand David revint à Tsiklag avec le butin des Amalécites, il envoya des présents aux anciens de Juda, « à ceux de Béthel, à ceux de Ramoth du midi, à ceux de Jatthir », les villes du sud qui l’avaient abrité pendant ses années de hors-la-loi. Ira et Gareb, « de Jéther », deux des vaillants de David, venaient peut-être de Jatthir, bien que le nom puisse désigner plutôt le clan des Jéthriens que les Chroniques rattachent à Kirjath-Jearim."
    - "La ruine se trouve aujourd’hui en lisière de la forêt de Yatir, la plus grande forêt plantée d’Israël, qui porte son nom, à la frontière avec la Cisjordanie au sud d’as-Samu, l’antique Eschthemoa."
  pl:
    - "Jattir było miastem w górach Judy, na południowych stokach wzgórz Hebronu, gdzie opadają ku Negewowi. Utożsamia się je z Chirbet Attir (Chorwat Jatir), ruiną około 20 km na południe-południowy zachód od Hebronu, która zachowuje dawną nazwę; utożsamienie nie jest kwestionowane. Euzebiusz mówi, że Jeter był za jego czasów bardzo dużą wsią wewnętrznej Daromy, dwadzieścia mil od Eleuteropolis koło Malaty, zamieszkaną w całości przez chrześcijan, a wykopaliska w latach 1995–1999 odsłoniły dwa kościoły z posadzkami mozaikowymi z tej bizantyńskiej wsi, a także ceramikę z VII w. p.n.e."
    - "Jozue wymienia Jattir wśród miast Judy: „A na górze leżą Sam, i Jeter, i Soko”, i oddaje je z pastwiskami kapłanom, synom Aarona, razem z Hebronem, Libną i Esztemoa; Księgi Kronik powtarzają nadanie. Gdy Dawid wrócił do Siklag ze zdobyczą po Amalekitach, posłał dary starszym Judy, „Tym, co byli w Betel, i co w Ramacie na południe, i co byli w Gieter”, miastom południa, które dawały mu schronienie w latach banicji. Ira i Gareb, „Jetrytczyk”, dwaj z bohaterów Dawida, mogli pochodzić z Jattir, choć nazwa może oznaczać raczej ród Jitrytów, który Księgi Kronik łączą z Kiriat-Jearim."
    - "Ruina leży dziś na skraju Lasu Jatir, największego sztucznie zasadzonego lasu Izraela, nazwanego od niej, przy granicy z Zachodnim Brzegiem na południe od as-Samu, dawnego Esztemoa."
  it:
    - "Iattir era una città sui monti di Giuda, sui pendii meridionali delle colline di Ebron dove scendono verso il Negheb. È identificata con Khirbet Attir (Horvat Yattir), una rovina circa 20 km a sud-sud-ovest di Ebron che conserva il nome antico; l’identificazione non è contestata. Eusebio dice che Ieter ai suoi tempi era un grandissimo villaggio del Daroma interno, a venti miglia da Eleuteropoli presso Malata, abitato interamente da cristiani, e gli scavi del 1995–1999 hanno portato alla luce due chiese con pavimenti a mosaico di quel villaggio bizantino, oltre a ceramica del VII secolo a.C."
    - "Giosuè elenca Iattir fra le città di Giuda «Nella contrada montuosa», con Samir e Soco, e la dà con i suoi pascoli ai sacerdoti, figli di Aronne, insieme a Ebron, Libna ed Estemoa; le Cronache ripetono la concessione. Quando Davide tornò a Siclag con il bottino degli Amalechiti mandò doni agli anziani di Giuda, «a quelli di Bethel, a quelli di Ramoth del mezzogiorno, a quelli di Jattir», le città del sud che lo avevano accolto negli anni da fuorilegge. Ira e Gareb l’Itrita, due dei prodi di Davide, possono provenire da Iattir, benché il nome possa invece indicare il clan degli Itriti che le Cronache collegano a Kiriat-Iearim."
    - "La rovina si trova oggi al margine della Foresta di Yatir, la maggiore foresta piantata d’Israele, che da essa prende nome, sul confine con la Cisgiordania a sud di as-Samu, l’antica Estemoa."
  nl:
    - "Jattir was een stad in het bergland van Juda, op de zuidelijke hellingen van de heuvels van Hebron waar ze afdalen naar de Negev. Zij wordt vereenzelvigd met Khirbet Attir (Horvat Yattir), een ruïne ongeveer 20 km zuidzuidwestelijk van Hebron die de oude naam bewaart; de identificatie wordt niet betwist. Eusebius zegt dat Jeter in zijn tijd een zeer groot dorp van de binnenste Daroma was, twintig mijl van Eleutheropolis bij Malatha, geheel door christenen bewoond, en opgravingen in 1995–1999 legden twee kerken met mozaïekvloeren uit dat Byzantijnse dorp bloot, en ook aardewerk uit de 7e eeuw v.Chr."
    - "Jozua noemt Jattir onder de steden van Juda “op het gebergte”, met Samir en Socho, en geeft het met zijn weidegronden aan de priesters, de zonen van Aäron, samen met Hebron, Libna en Estemoa; Kronieken herhaalt de gift. Toen David met de buit van de Amalekieten naar Ziklag terugkwam, stuurde hij geschenken naar de oudsten van Juda, “tot die te Beth-El, en tot die te Ramoth tegen het zuiden, en tot die te Jather”, de steden van het zuiden die hem in zijn jaren als vogelvrije hadden beschut. Ira en Gareb “de Jethriet”, twee van Davids helden, kwamen misschien uit Jattir, al kan de naam ook het geslacht van de Jithrieten betekenen dat Kronieken met Kirjat-Jearim verbindt."
    - "De ruïne ligt nu aan de rand van het Yatirbos, Israëls grootste aangeplante bos, naar haar genoemd, aan de grens met de Westoever ten zuiden van as-Samu, het oude Estemoa."
  cs:
    - "Jatir bylo město v judské pahorkatině, na jižních svazích hebronských hor, kde klesají k Negevu. Ztotožňuje se s Chirbet Attir (Chorvat Jatir), zříceninou asi 20 km jihojihozápadně od Hebronu, která zachovává starověké jméno; ztotožnění není sporné. Eusebios praví, že Jeter byl za jeho dnů velmi velkou vesnicí vnitřní Daromy, dvacet mil od Eleutheropole poblíž Malathy, obydlenou výhradně křesťany, a vykopávky v letech 1995–1999 odkryly dva kostely s mozaikovými podlahami z oné byzantské vesnice i keramiku ze 7. stol. př. n. l."
    - "Jozue uvádí Jatir mezi městy Judovými „A na horách“, se Šamirem a Sókem, a dává jej s pastvinami kněžím, synům Áronovým, spolu s Hebronem, Libnou a Eštemoou; Letopisy udělení opakují. Když se David vrátil do Siklagu s kořistí z Amalechitských, poslal dary starším Judovým, „Těm, kteříž byli v Bethel, a kteříž v Rámat ku poledni, a kteříž byli v Jeter“, městům jihu, která mu poskytla úkryt v letech jeho psanství. Írá a Gareb „Itrejský“, dva z Davidových hrdinů, mohli pocházet z Jatiru, ačkoli jméno může místo toho znamenat rod Itrejských, které Letopisy spojují s Kirjat-jearímem."
    - "Zřícenina leží dnes na okraji lesa Jatir, největšího vysázeného lesa Izraele, který je po ní pojmenován, na hranici se Západním břehem jižně od as-Samú, starověké Eštemoy."
