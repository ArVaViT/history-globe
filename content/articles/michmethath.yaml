body:
  en:
    - "Michmethath is a landmark on the border between Ephraim and Manasseh in the hill country around Shechem. The description of Ephraim’s border says that “the border went out toward the sea to Michmethah on the north side; and the border went about eastward unto Taanath-shiloh”; that of Manasseh, that “the coast of Manasseh was from Asher to Michmethah, that lieth before Shechem; and the border went along on the right hand unto the inhabitants of En-tappuah”. The Hebrew has the article, “the Michmethath”, which suggests a feature of the landscape rather than a town, and “before Shechem” most likely means east of it. Nothing else is said of it."
    - "Its exact place is disputed. The map marks first Khirbet en-Nabi and then Khirbet Ibn Naser, in the hills south and south-east of Nablus; Mount Kabir (Jebel el-Kabir), the ridge north-east of the city, and Wadi Bedan, the valley that runs down from Shechem towards the Jordan, have also been proposed. All lie within a few kilometres of Shechem, today’s Nablus, and none can be shown to be the place."
  ru:
    - "Михмефаф — ориентир на границе между Ефремом и Манассией в горах вокруг Сихема. В описании предела Ефрема сказано: «идет предел к морю северною стороною Михмефафа и поворачивает к восточной стороне Фаанаф-Силома»; в описании предела Манассии: «Предел сынов Манассии идет от Асира к Михмефафу, который против Сихема; отсюда предел идет направо к жителям Ен-Таппуаха». В еврейском тексте имя стоит с артиклем, что указывает скорее на особенность местности, чем на город, а «против Сихема», вероятнее всего, значит к востоку от него. Больше о нём ничего не сказано."
    - "Точное место спорно. На карте первым отмечен Хирбет-эн-Наби, затем Хирбет-Ибн-Насер, в горах к югу и юго-востоку от Наблуса; предлагали также гору Кабир (Джебель-эль-Кабир), хребет к северо-востоку от города, и Вади Бедан — долину, спускающуюся от Сихема к Иордану. Все они лежат в нескольких километрах от Сихема, нынешнего Наблуса, и ни одно не удаётся доказать."
  uk:
    - "Міхметат — орієнтир на межі Єфрема й Манасії в гірській країні навколо Сихема. Опис межі Єфрема каже: «Потім тягнеться гряниця до моря північньою стороною Махмета та вертає на схід сонця на Таанат-Сило»; межі Манасії — «Ійшла ж гряниця Манассієва від Асира на Михметат, на схід сонця від Сихему; потім тягнулась гряниця праворуч до осадників Ен-Таппуахських». Староєврейський текст має артикль, «Міхметат», що вказує радше на рису ландшафту, ніж на місто, а староєврейське «перед Сихемом», найімовірніше, означає на схід від нього. Більше про нього нічого не сказано."
    - "Його точне місце спірне. Мапа позначає першим Хірбет-ен-Наби, а потім Хірбет-Ібн-Насер, у пагорбах на південь і південний схід від Наблуса; пропонували також гору Кабір (Джебель-ель-Кабір), хребет на північний схід від міста, і Ваді-Бедан, долину, що спускається від Сихема до Йордану. Усі лежать у межах кількох кілометрів від Сихема, сьогоднішнього Наблуса, і жодне не можна показати як це місце."
  es:
    - "Micmetat es un punto de referencia en la frontera entre Efraín y Manasés, en la sierra en torno a Siquem. La descripción de la frontera de Efraín dice que «sale este término á la mar, y á Michmetat al norte, y da vuelta este término hacia el oriente á Tanath-silo»; la de Manasés, que «fué el término de Manasés desde Aser hasta Michmetat, la cual está delante de Sichêm; y va este término á la mano derecha, á los que habitan en Tappua». El hebreo lleva el artículo, «la Micmetat», lo que sugiere un rasgo del paisaje más que una ciudad, y «delante de Sichêm» significa muy probablemente al este de ella. No se dice nada más."
    - "Su lugar exacto se discute. El mapa marca en primer lugar Khirbet en-Nabi y luego Khirbet Ibn Naser, en las colinas al sur y sudeste de Nablus; también se han propuesto el monte Kabir (Yebel el-Kabir), la cresta al nordeste de la ciudad, y el Wadi Bedán, el valle que baja de Siquem hacia el Jordán. Todos están a pocos kilómetros de Siquem, la actual Nablus, y ninguno puede mostrarse como el lugar."
  pt:
    - "Micmetate é um marco na fronteira entre Efraim e Manassés, nas colinas em torno de Siquém. A descrição da fronteira de Efraim diz que “A fronteira saiu para o oeste em Micmetate, ao norte. A fronteira virou para o leste até Taanate-Siló”; a de Manassés, que “A fronteira de Manassés ia de Aser até Micmetate, que está diante de Siquém. A fronteira seguia para a direita, até os habitantes de En-Tapua”. O hebraico traz o artigo, “a Micmetate”, o que sugere um acidente da paisagem e não uma cidade, e “diante de Siquém” provavelmente significa a leste dela. Nada mais se diz dela."
    - "Seu lugar exato é disputado. O mapa marca em primeiro lugar Khirbet en-Nabi e depois Khirbet Ibn Naser, nas colinas ao sul e sudeste de Nablus; o monte Kabir (Jebel el-Kabir), a crista a nordeste da cidade, e o Wadi Bedan, o vale que desce de Siquém rumo ao Jordão, também foram propostos. Todos ficam a poucos quilômetros de Siquém, a atual Nablus, e nenhum pode ser mostrado como o lugar."
  de:
    - "Michmetat ist ein Orientierungspunkt an der Grenze zwischen Ephraim und Manasse im Bergland um Sichem. Die Beschreibung der Grenze Ephraims sagt: „und geht aus gegen Abend bei Michmethath, das gegen Mitternacht liegt; daselbst lenkt sie sich herum gegen Aufgang gen Thaanath-Silo“; die Manasses: „Und die Grenze Manasses war von Asser gen Michmethath, das vor Sichem liegt, und reicht zur Rechten an die von En-Thappuah“. Das Hebräische hat den Artikel, „die Michmetat“, was eher ein Landschaftsmerkmal als eine Stadt nahelegt, und „vor Sichem“ bedeutet höchstwahrscheinlich östlich davon. Sonst wird nichts darüber gesagt."
    - "Ihre genaue Lage ist umstritten. Die Karte nennt zuerst Khirbet en-Nabi und dann Khirbet Ibn Naser, in den Hügeln südlich und südöstlich von Nablus; auch der Berg Kabir (Jebel el-Kabir), der Höhenzug nordöstlich der Stadt, und das Wadi Bedan, das Tal, das von Sichem zum Jordan hinabführt, wurden vorgeschlagen. Alle liegen wenige Kilometer von Sichem, dem heutigen Nablus, und bei keinem lässt sich zeigen, dass es der Ort ist."
  fr:
    - "Micmethath est un repère sur la limite entre Éphraïm et Manassé dans les collines autour de Sichem. La description de la limite d’Éphraïm dit qu’« elle continuait du côté de l’occident vers Micmethath au nord, tournait à l’orient vers Thaanath-Silo » ; celle de Manassé, que « la limite de Manassé s’étendait d’Aser à Micmethath, qui est près de Sichem, et allait à Jamin vers les habitants d’En-Tappuach ». L’hébreu a l’article, « la Micmethath », ce qui suggère un trait du paysage plutôt qu’une ville, et « près de Sichem » signifie le plus probablement à l’est de celle-ci. On n’en dit rien d’autre."
    - "Son emplacement exact est discuté. La carte marque d’abord Khirbet en-Nabi puis Khirbet Ibn Naser, dans les collines au sud et au sud-est de Naplouse ; le mont Kabir (djebel el-Kabir), la crête au nord-est de la ville, et l’ouadi Bedan, la vallée qui descend de Sichem vers le Jourdain, ont aussi été proposés. Tous se trouvent à quelques kilomètres de Sichem, l’actuelle Naplouse, et aucun ne peut être montré comme étant le lieu."
  it:
    - "Micmetat è un punto di riferimento sul confine tra Efraim e Manasse nella regione collinosa intorno a Sichem. La descrizione del confine di Efraim dice che esso «continuava, dal lato di occidente, verso Micmetath al nord, girava a oriente verso Taanath-Scilo»; quella di Manasse, che «Il confine di Manasse si estendeva da Ascer a Micmetath ch’è dirimpetto a Sichem, e andava a man destra verso gli abitanti di En-Tappuah». L’ebraico ha l’articolo, «il Micmetat», il che suggerisce un elemento del paesaggio piuttosto che una città, e «dirimpetto a Sichem» significa con ogni probabilità a oriente di essa. Altro non si dice."
    - "Il suo luogo esatto è discusso. La mappa segna per prima Khirbet en-Nabi e poi Khirbet Ibn Naser, sulle colline a sud e a sud-est di Nablus; sono stati proposti anche il Monte Kabir (Jebel el-Kabir), la dorsale a nord-est della città, e il Wadi Bedan, la valle che scende da Sichem verso il Giordano. Tutti si trovano entro pochi chilometri da Sichem, l’odierna Nablus, e di nessuno si può dimostrare che sia il luogo."
  pl:
    - "Mikmetat jest punktem orientacyjnym na granicy między Efraimem a Manassesem w górach wokół Sychem. Opis granicy Efraima mówi: „I wychodzi ta granica do morza od Machmeta ku północy, a idzie kołem ta granica pod wschód słońca do Tanat Selo”; opis Manassesa: „I była granica Manasesowa od Aser do Machmatat, które jest przeciwko Sychem, a idzie granica ta po prawej stronie do mieszkających w En Tafua”. Hebrajski ma rodzajnik, ha-Mikmetat, co sugeruje raczej element krajobrazu niż miasto, a „przeciwko Sychem” oznacza najpewniej na wschód od niego. Nic więcej o nim nie powiedziano."
    - "Jego dokładne położenie jest sporne. Mapa zaznacza najpierw Khirbet en-Nabi, a potem Khirbet Ibn Naser, na wzgórzach na południe i południowy wschód od Nablusu; proponowano też górę Kabir (Dżabal el-Kabir), grzbiet na północny wschód od miasta, i Wadi Bedan, dolinę biegnącą w dół od Sychem ku Jordanowi. Wszystkie leżą w odległości kilku kilometrów od Sychem, dzisiejszego Nablusu, i żadnego nie da się wykazać jako tego miejsca."
  nl:
    - "Michmetat is een oriëntatiepunt op de grens tussen Efraïm en Manasse in het heuvelland rond Sichem. De beschrijving van Efraïms grens zegt dat “deze landpale gaat uit tegen het westen bij Michmetath, van het noorden, en deze landpale keert zich om tegen het oosten naar Thaanath-Silo”; die van Manasse dat “de landpale van Manasse was van Aser af tot Michmetath, die voor aan Sichem is; en deze landpale gaat ter rechterhand tot aan de inwoners van En-Tappuah”. Het Hebreeuws heeft het lidwoord, “de Michmetat”, wat op een kenmerk van het landschap wijst eerder dan op een stad, en “voor aan Sichem” betekent hoogstwaarschijnlijk ten oosten ervan. Verder wordt er niets van gezegd."
    - "De exacte ligging is omstreden. De kaart toont eerst Khirbet en-Nabi en dan Khirbet Ibn Naser, in de heuvels ten zuiden en zuidoosten van Nabloes; ook de berg Kabir (Jebel el-Kabir), de rug ten noordoosten van de stad, en de Wadi Bedan, het dal dat van Sichem naar de Jordaan afloopt, zijn voorgesteld. Allemaal liggen ze binnen enkele kilometers van Sichem, het huidige Nabloes, en van geen is aan te tonen dat het de plaats is."
  cs:
    - "Michmetat je orientační bod na hranici mezi Efrajimem a Manasesem v pahorkatině kolem Šekemu. Popis hranice Efrajimovy praví, že „vychází meze ta k moři při Michmetat od půlnoční strany, a obchází meze k východu Tanatsilo“; Manasesovy, že „byla meze Manassesova od Asser, Michmetat, jenž jest před Sichem, a táhne se na pravou stranu k obyvatelům Entafue“. Hebrejština má člen, „ten Michmetat“, což naznačuje spíše rys krajiny než město, a „před Šekemem“ nejspíš znamená východně od něj. Nic jiného se o něm neříká."
    - "Jeho přesné místo je sporné. Mapa uvádí nejprve Khirbet en-Nabi a poté Khirbet Ibn Naser, v pahorcích jižně a jihovýchodně od Nábulusu; navrženy byly také hora Kabir (Jebel el-Kabir), hřbet severovýchodně od města, a Wádí Bedan, údolí, které z Šekemu klesá k Jordánu. Všechna leží v okruhu několika kilometrů od Šekemu, dnešního Nábulusu, a u žádného nelze prokázat, že je to ono místo."
  sv:
    - "Mikmetat är ett landmärke på gränsen mellan Efraim och Manasse i bergen kring Shekem. Beskrivningen av Efraims gräns säger: ”Sedan gick gränsen ut vid havet. I norr var Mikmetat gräns. Därifrån böjde sig gränsen österut till Taanat-Silo”; och om Manasse: ”Den gick från Aser till Mikmetat, som ligger gent emot Sikem; därefter gick gränsen åt höger, till En-Tappuas inbyggare”. Hebreiskan har bestämd artikel, ”ha-Mikmetat”, vilket antyder ett drag i landskapet snarare än en stad, och ”gent emot Sikem” betyder troligen öster därom. Inget annat sägs om den."
    - "Dess exakta läge är omstritt. Kartan markerar först Khirbet en-Nabi och sedan Khirbet Ibn Naser, i bergen söder och sydost om Nablus; berget Kabir (Jebel el-Kabir), åsen nordost om staden, och Wadi Bedan, dalen som löper ned från Shekem mot Jordan, har också föreslagits. Alla ligger inom några kilometer från Shekem, dagens Nablus, och ingen kan visas vara platsen."
  nb:
    - "Mikmetat er et landemerke på grensen mellom Efraim og Manasse i åsene omkring Sikem. Beskrivelsen av Efraims grense sier: «Mot nord gikk grensen over Mikmetat og bøide sig mot øst til Ta'anat-Silo»; beskrivelsen av Manasses: «Og Manasses grense gikk fra Aser til Mikmetat, som ligger midt imot Sikem; så tok grensen til høire til En-Tappuah-bygden.» Det hebraiske har den bestemte artikkelen, «Mikmetat», noe som antyder et trekk ved landskapet snarere enn en by, og «midt imot Sikem» betyr mest sannsynlig øst for den. Ingenting mer sies om stedet."
    - "Dets nøyaktige beliggenhet er omstridt. Kartet markerer først Khirbet en-Nabi og deretter Khirbet Ibn Naser, i åsene sør og sørøst for Nablus; Kabir-fjellet (Jebel el-Kabir), ryggen nordøst for byen, og Wadi Bedan, dalen som løper ned fra Sikem mot Jordan, er også foreslått. Alle ligger innen noen få kilometer fra Sikem, dagens Nablus, og ingen kan vises å være stedet."
  tl:
    - "Ang Michmetat ay palatandaan sa hangganan ng Ephraim at Manases sa maburol na lupain sa palibot ng Sichem. Sinasabi ng paglalarawan sa hangganan ng Ephraim na “ang hangganan ay palabas sa dakong kalunuran sa Michmetat, sa hilagaan; at ang hangganan ay paliko sa dakong silanganan hanggang sa Tanath-silo”; ang sa Manases, na “ang hangganan ng Manases ay mula sa Aser hanggang sa Michmetat, na nasa tapat ng Sichem; at ang hangganan ay patuloy sa kanan, hanggang sa mga taga En-tappua”. May pantukoy ang Hebreo, “ang Michmetat”, na nagmumungkahi ng katangian ng tanawin sa halip na bayan, at ang “nasa tapat ng Sichem” ay malamang na nangangahulugang sa silangan nito. Wala nang iba pang sinasabi tungkol dito."
    - "Pinagtatalunan ang eksaktong lugar nito. Unang minamarkahan ng mapa ang Khirbet en-Nabi at pagkatapos ang Khirbet Ibn Naser, sa mga burol sa timog at timog-silangan ng Nablus; iminungkahi rin ang Bundok Kabir (Jebel el-Kabir), ang tagaytay sa hilagang-silangan ng lungsod, at ang Wadi Bedan, ang libis na bumababa mula sa Sichem patungo sa Jordan. Lahat ay nasa loob ng ilang kilometro mula sa Sichem, ang Nablus ngayon, at walang naipakitang ito ang lugar."
  da:
    - "Mikmetat er et pejlemærke på grænsen mellem Efraim og Manasse i bjerglandet omkring Sikem. Beskrivelsen af Efraims grænse siger, at »Landemærket gaar i Vesten ud fra Nordsiden af Mikmethath, og Landemærket gaar omkring i Øster til Thaanath-Silo«; Manasses, at »Manasse Landemærke var fra Aser til Mikmethath, som ligger lige for Sikem; og Landemærket gaar ud paa den højre Side til Indbyggerne i En-Thappua«. Det hebraiske har kendeordet, ha-Mikmetat, hvilket antyder et landskabstræk snarere end en by, og »lige for Sikem« betyder sandsynligvis øst for den. Intet andet siges om det."
    - "Dets nøjagtige sted er omstridt. Kortet markerer først Khirbet en-Nabi og dernæst Khirbet Ibn Naser, i bjergene syd og sydøst for Nablus; Mount Kabir (Jebel el-Kabir), højderyggen nordøst for byen, og Wadi Bedan, dalen, der løber ned fra Sikem mod Jordan, er også blevet foreslået. Alle ligger inden for få kilometer fra Sikem, nutidens Nablus, og ingen kan påvises at være stedet."
  sr:
    - "Михмета је оријентир на граници између Јефрема и Манасије у брдима око Сихема. Опис Јефремове међе каже: „и излази међа на море код Михмете са северне стране, па се обрће међа к истоку до Танат-Силона“; Манасијине: „А међа Манасијина беше од Асира к Михмети, која је према Сихему, потом иде та међа надесно к становницима ен-тафујским“. Хебрејски има члан, „та Михмета“, што указује на обележје пејзажа пре него на град, а „према Сихему“ највероватније значи источно од њега. Више се ништа о њој не каже."
    - "Њено тачно место је спорно. Мапа прво означава Хирбет ен-Неби, а затим Хирбет Ибн Насер, у брдима јужно и југоисточно од Наблуса; предложени су и гора Кабир (Џебел ел-Кабир), гребен североисточно од града, и Вади Бедан, долина која силази од Сихема према Јордану. Сви леже на неколико километара од Сихема, данашњег Наблуса, и ниједан се не може показати као то место."
scripture:
  - Josh.16.5-Josh.16.6
  - Josh.17.7
sources:
