# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the candidates on the map are given without choosing one.
id: michmethath
place: a2f0a70
title:
  en: "Michmethath"
  ru: "Михмефаф"
  uk: "Міхметат"
  es: "Micmetat"
  pt: "Micmetate"
  de: "Michmetat"
  fr: "Micmethath"
body:
  en:
    - "Michmethath is a landmark on the border between Ephraim and Manasseh in the hill country around Shechem. The description of Ephraim’s border says that “the border went out toward the sea to Michmethah on the north side; and the border went about eastward unto Taanath-shiloh”; that of Manasseh, that “the coast of Manasseh was from Asher to Michmethah, that lieth before Shechem; and the border went along on the right hand unto the inhabitants of En-tappuah”. The Hebrew has the article, “the Michmethath”, which suggests a feature of the landscape rather than a town, and “before Shechem” most likely means east of it. Nothing else is said of it."
    - "Its exact place is disputed. The map marks first Khirbet en-Nabi and then Khirbet Ibn Naser, in the hills south and south-east of Nablus; Mount Kabir (Jebel el-Kabir), the ridge north-east of the city, and Wadi Bedan, the valley that runs down from Shechem towards the Jordan, have also been proposed. All lie within a few kilometres of Shechem, today’s Nablus, and none can be shown to be the place."
  ru:
    - "Михмефаф — ориентир на границе между Ефремом и Манассией в горах вокруг Сихема. В описании предела Ефрема сказано: «идет предел к морю северною стороною Михмефафа и поворачивает к восточной стороне Фаанаф-Силома»; в описании предела Манассии: «Предел сынов Манассии идет от Асира к Михмефафу, который против Сихема; отсюда предел идет направо к жителям Ен-Таппуаха». В еврейском тексте имя стоит с артиклем, что указывает скорее на особенность местности, чем на город, а «против Сихема», вероятнее всего, значит к востоку от него. Больше о нём ничего не сказано."
    - "Точное место спорно. На карте первым отмечен Хирбет-эн-Наби, затем Хирбет-Ибн-Насер, в горах к югу и юго-востоку от Наблуса; предлагали также гору Кабир (Джебель-эль-Кабир), хребет к северо-востоку от города, и Вади Бедан — долину, спускающуюся от Сихема к Иордану. Все они лежат в нескольких километрах от Сихема, нынешнего Наблуса, и ни одно не удаётся доказать."
  uk:
    - "Міхметат — орієнтир на межі Єфрема й Манасії в гірській країні навколо Сихема. Опис межі Єфрема каже: «Потім тягнеться гряниця до моря північньою стороною Махмета та вертає на схід сонця на Таанат-Сило»; межі Манасії — «Ійшла ж гряниця Манассієва від Асира на Михметат, на схід сонця від Сихему; потім тягнулась гряниця праворуч до осадників Ен-Таппуахських». Староєврейський текст має артикль, «Міхметат», що вказує радше на рису ландшафту, ніж на місто, а староєврейське «перед Сихемом», найімовірніше, означає на схід від нього. Більше про нього нічого не сказано."
    - "Його точне місце спірне. Мапа позначає першим Хірбет-ен-Наби, а потім Хірбет-Ібн-Насер, у пагорбах на південь і південний схід від Наблуса; пропонували також гору Кабір (Джебель-ель-Кабір), хребет на північний схід від міста, і Ваді-Бедан, долину, що спускається від Сихема до Йордану. Усі лежать у межах кількох кілометрів від Сихема, сьогоднішнього Наблуса, і жодне не можна показати як це місце."
  es:
    - "Micmetat es un punto de referencia en la frontera entre Efraín y Manasés, en la sierra en torno a Siquem. La descripción de la frontera de Efraín dice que «sale este término á la mar, y á Michmetat al norte, y da vuelta este término hacia el oriente á Tanath-silo»; la de Manasés, que «fué el término de Manasés desde Aser hasta Michmetat, la cual está delante de Sichêm; y va este término á la mano derecha, á los que habitan en Tappua». El hebreo lleva el artículo, «la Micmetat», lo que sugiere un rasgo del paisaje más que una ciudad, y «delante de Sichêm» significa muy probablemente al este de ella. No se dice nada más."
    - "Su lugar exacto se discute. El mapa marca en primer lugar Khirbet en-Nabi y luego Khirbet Ibn Naser, en las colinas al sur y sudeste de Nablus; también se han propuesto el monte Kabir (Yebel el-Kabir), la cresta al nordeste de la ciudad, y el Wadi Bedán, el valle que baja de Siquem hacia el Jordán. Todos están a pocos kilómetros de Siquem, la actual Nablus, y ninguno puede mostrarse como el lugar."
  pt:
    - "Micmetate é um marco na fronteira entre Efraim e Manassés, nas colinas em torno de Siquém. A descrição da fronteira de Efraim diz que “A fronteira saiu para o oeste em Micmetate, ao norte. A fronteira virou para o leste até Taanate-Siló”; a de Manassés, que “A fronteira de Manassés ia de Aser até Micmetate, que está diante de Siquém. A fronteira seguia para a direita, até os habitantes de En-Tapua”. O hebraico traz o artigo, “a Micmetate”, o que sugere um acidente da paisagem e não uma cidade, e “diante de Siquém” provavelmente significa a leste dela. Nada mais se diz dela."
    - "Seu lugar exato é disputado. O mapa marca em primeiro lugar Khirbet en-Nabi e depois Khirbet Ibn Naser, nas colinas ao sul e sudeste de Nablus; o monte Kabir (Jebel el-Kabir), a crista a nordeste da cidade, e o Wadi Bedan, o vale que desce de Siquém rumo ao Jordão, também foram propostos. Todos ficam a poucos quilômetros de Siquém, a atual Nablus, e nenhum pode ser mostrado como o lugar."
  de:
    - "Michmetat ist ein Orientierungspunkt an der Grenze zwischen Ephraim und Manasse im Bergland um Sichem. Die Beschreibung der Grenze Ephraims sagt: „und geht aus gegen Abend bei Michmethath, das gegen Mitternacht liegt; daselbst lenkt sie sich herum gegen Aufgang gen Thaanath-Silo“; die Manasses: „Und die Grenze Manasses war von Asser gen Michmethath, das vor Sichem liegt, und reicht zur Rechten an die von En-Thappuah“. Das Hebräische hat den Artikel, „die Michmetat“, was eher ein Landschaftsmerkmal als eine Stadt nahelegt, und „vor Sichem“ bedeutet höchstwahrscheinlich östlich davon. Sonst wird nichts darüber gesagt."
    - "Ihre genaue Lage ist umstritten. Die Karte nennt zuerst Khirbet en-Nabi und dann Khirbet Ibn Naser, in den Hügeln südlich und südöstlich von Nablus; auch der Berg Kabir (Jebel el-Kabir), der Höhenzug nordöstlich der Stadt, und das Wadi Bedan, das Tal, das von Sichem zum Jordan hinabführt, wurden vorgeschlagen. Alle liegen wenige Kilometer von Sichem, dem heutigen Nablus, und bei keinem lässt sich zeigen, dass es der Ort ist."
  fr:
    - "Micmethath est un repère sur la limite entre Éphraïm et Manassé dans les collines autour de Sichem. La description de la limite d’Éphraïm dit qu’« elle continuait du côté de l’occident vers Micmethath au nord, tournait à l’orient vers Thaanath-Silo » ; celle de Manassé, que « la limite de Manassé s’étendait d’Aser à Micmethath, qui est près de Sichem, et allait à Jamin vers les habitants d’En-Tappuach ». L’hébreu a l’article, « la Micmethath », ce qui suggère un trait du paysage plutôt qu’une ville, et « près de Sichem » signifie le plus probablement à l’est de celle-ci. On n’en dit rien d’autre."
    - "Son emplacement exact est discuté. La carte marque d’abord Khirbet en-Nabi puis Khirbet Ibn Naser, dans les collines au sud et au sud-est de Naplouse ; le mont Kabir (djebel el-Kabir), la crête au nord-est de la ville, et l’ouadi Bedan, la vallée qui descend de Sichem vers le Jourdain, ont aussi été proposés. Tous se trouvent à quelques kilomètres de Sichem, l’actuelle Naplouse, et aucun ne peut être montré comme étant le lieu."
scripture:
  - Josh.16.5-Josh.16.6
  - Josh.17.7
sources:
