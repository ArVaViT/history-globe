# Overview article (ADR 0007). Mainstream facts only; Jogbehah is usually placed at Jubeiha north of Amman, where the name survives; Tell Safut is given as the alternative.
id: jogbehah
place: acf6e00
title:
  en: "Jogbehah"
  ru: "Иогбега"
body:
  en:
    - "Jogbehah was a town of Gad in Gilead, east of the Jordan. When Moses gave the land of Sihon and Og to Gad and Reuben, the children of Gad built or fortified a list of towns, among them “Atroth, Shophan, and Jaazer, and Jogbehah”. It appears once more in the story of Gideon: pursuing the last of the Midianite army under Zebah and Zalmunna to Karkor, “Gideon went up by the way of them that dwelt in tents on the east of Nobah and Jogbehah, and smote the host: for the host was secure”. The town thus stood near the edge of the desert, on the route the nomads used."
    - "The name survives at al-Jubayha, now a district of northern Amman in Jordan, and most scholars place Jogbehah at the ruin of Khirbet el-Ajbeihat there, as the map does; the excavated mound of Tell Safut, about 3 km to the north-west, has been proposed instead. The Bible tells nothing more, and the town is not named in other ancient sources."
  ru:
    - "Иогбега был городом Гада в Галааде, к востоку от Иордана. Когда Моисей отдал Гаду и Рувиму землю Сигона и Ога, сыны Гадовы построили или укрепили ряд городов, и среди них «Атароф-Шофан, и Иазер, и Иогбегу». Он упомянут ещё раз в рассказе о Гедеоне: преследуя остатки мадиамского войска с Зевеем и Салманом до Каркора, «Гедеон пошел к живущим в шатрах на восток от Новы и Иогбеги и поразил стан, когда стан стоял беспечно». Город, стало быть, стоял у края пустыни, на пути, которым ходили кочевники."
    - "Имя сохранилось в аль-Джубейхе, ныне районе на севере Аммана в Иордании, и большинство исследователей помещает Иогбегу на развалинах Хирбет-эль-Аджбейхат там же, как и карта; вместо неё предлагали раскопанный холм Телль-Сафут примерно в 3 км к северо-западу. Больше Библия ничего не говорит, и в других древних источниках город не назван."
scripture:
