body:
  en:
    - "Jogbehah was a town of Gad in Gilead, east of the Jordan. When Moses gave the land of Sihon and Og to Gad and Reuben, the children of Gad built or fortified a list of towns, among them “Atroth, Shophan, and Jaazer, and Jogbehah”. It appears once more in the story of Gideon: pursuing the last of the Midianite army under Zebah and Zalmunna to Karkor, “Gideon went up by the way of them that dwelt in tents on the east of Nobah and Jogbehah, and smote the host: for the host was secure”. The town thus stood near the edge of the desert, on the route the nomads used."
    - "The name survives at al-Jubayha, now a district of northern Amman in Jordan, and Jogbehah is usually placed at the ruin of Khirbet el-Ajbeihat there, as the map does; the excavated mound of Tell Safut, about 3 km to the north-west, has been proposed instead. The Bible tells nothing more, and the town is not named in other ancient sources."
  ru:
    - "Иогбега был городом Гада в Галааде, к востоку от Иордана. Когда Моисей отдал Гаду и Рувиму землю Сигона и Ога, сыны Гадовы построили или укрепили ряд городов, и среди них «Атароф-Шофан, и Иазер, и Иогбегу». Он упомянут ещё раз в рассказе о Гедеоне: преследуя остатки мадиамского войска с Зевеем и Салманом до Каркора, «Гедеон пошел к живущим в шатрах на восток от Новы и Иогбеги и поразил стан, когда стан стоял беспечно». Город, стало быть, стоял у края пустыни, на пути, которым ходили кочевники."
    - "Имя сохранилось в аль-Джубейхе, ныне районе на севере Аммана в Иордании, и Иогбегу обычно помещают на развалинах Хирбет-эль-Аджбейхат там же, как и карта; вместо неё предлагали раскопанный холм Телль-Сафут примерно в 3 км к северо-западу. Больше Библия ничего не говорит, и в других древних источниках город не назван."
  uk:
    - "Йогбега було містом Гада в Гілеаді, на схід від Йордану. Коли Мойсей віддав землю Сігона й Ога Гадові та Рувимові, сини Гада збудували або укріпили низку міст, серед них «Та Атарот-Шофан, та Язер, та Йогбега». Воно з’являється ще раз в історії Гедеона: переслідуючи рештки мадіамського війська під проводом Зевея й Салмана до Каркору, «пійшов Гедеон караванним шляхом на схід сонця від Ноби й Йокбеги, та й ударив на табір, як військо спочивало собі безпечно». Отже, місто стояло біля краю пустелі, на шляху, яким користувалися кочовики."
    - "Назва зберігається в ель-Джубейха, нині районі північного Амману в Йорданії, і Йогбегу зазвичай розміщують на руїні Хірбет-ель-Аджбейгат там, як і карта; розкопане городище Телль-Сафут, приблизно за 3 км на північний захід, пропонували натомість. Біблія більше нічого не розповідає, і місто не названо в інших давніх джерелах."
  es:
    - "Jogbeha era una población de Gad en Galaad, al este del Jordán. Cuando Moisés dio la tierra de Sehón y de Og a Gad y a Rubén, los hijos de Gad edificaron o fortificaron una lista de ciudades, entre ellas «á Atroth-sophan, y á Jazer, y á Jogbaa». Aparece una vez más en la historia de Gedeón: persiguiendo los restos del ejército madianita bajo Zeba y Zalmuna hasta Carcor, «subiendo Gedeón hacia los que habitaban en tiendas, á la parte oriental de Noba y de Jogbea, hirió el campo, porque estaba el ejército sin recelo». La población se hallaba, pues, cerca del borde del desierto, en la ruta que usaban los nómadas."
    - "El nombre sobrevive en al-Jubayha, hoy un distrito del norte de Amán, en Jordania, y Jogbeha suele situarse en la ruina de Khirbet el-Ajbeihat, allí, como hace el mapa; en cambio se ha propuesto el montículo excavado de Tell Safut, a unos 3 km al noroeste. La Biblia no dice nada más, y la población no se nombra en otras fuentes antiguas."
  pt:
    - "Jogbeá era uma cidade de Gade em Gileade, a leste do Jordão. Quando Moisés deu a terra de Seom e Ogue a Gade e Rúben, os filhos de Gade edificaram ou fortificaram uma lista de cidades, entre elas “Atarote-Sofã, Jazer, Jogbeá”. Aparece uma vez mais na história de Gideão: perseguindo o resto do exército midianita sob Zeba e Zalmuna até Carcor, “Gideão subiu pelo caminho dos que habitavam em tendas, a leste de Noba e de Jogbeá, e atacou o exército; pois o exército se sentia seguro”. A cidade ficava assim perto da orla do deserto, na rota usada pelos nômades."
    - "O nome sobrevive em al-Jubayha, hoje um bairro do norte de Amã, na Jordânia, e Jogbeá costuma ser situada na ruína de Khirbet el-Ajbeihat ali, como faz o mapa; o monte escavado de Tell Safut, a cerca de 3 km a noroeste, foi proposto em vez dela. A Bíblia nada mais conta, e a cidade não é nomeada em outras fontes antigas."
  de:
    - "Jogbeha war eine Stadt Gads in Gilead, östlich des Jordan. Als Mose das Land Sihons und Ogs an Gad und Ruben gab, bauten oder befestigten die Kinder Gad eine Reihe von Städten, darunter „Atroth-Sophan, Jaser, Jogbeha“. Es erscheint noch einmal in der Geschichte Gideons, der den Rest des midianitischen Heeres unter Sebach und Zalmunna bis Karkor verfolgte: „Und Gideon zog hinauf auf der Straße derer, die in Hütten wohnten, gegen Morgen von Nobah und Jogbeha, und schlug das Heer, denn das Heer war sicher“. Die Stadt lag also nahe dem Wüstenrand, an der Route der Nomaden."
    - "Der Name lebt in al-Dschubeiha fort, heute ein Stadtteil im Norden Ammans in Jordanien, und Jogbeha wird meist an der Ruine Chirbet el-Adschbeihat dort angesetzt, wie die Karte; der ausgegrabene Hügel Tell Safut, etwa 3 km nordwestlich, ist stattdessen vorgeschlagen worden. Die Bibel erzählt nichts weiter, und die Stadt wird in anderen antiken Quellen nicht genannt."
  fr:
    - "Jogbeha était une ville de Gad en Galaad, à l’est du Jourdain. Quand Moïse donna le pays de Sihon et d’Og à Gad et à Ruben, les fils de Gad bâtirent ou fortifièrent une liste de villes, dont « Athroth-Schophan, Jaezer, Jogbeha ». Elle reparaît dans l’histoire de Gédéon : poursuivant les derniers restes de l’armée madianite sous Zébach et Tsalmunna jusqu’à Karkor, « Gédéon monta par le chemin de ceux qui habitent sous les tentes, à l’orient de Nobach et de Jogbeha, et il battit l’armée qui se croyait en sûreté ». La ville se trouvait donc près de la lisière du désert, sur la route qu’empruntaient les nomades."
    - "Le nom survit à al-Jubayha, aujourd’hui un quartier du nord d’Amman, en Jordanie, et Jogbeha est d’ordinaire placée à la ruine de Khirbet el-Ajbeihat, comme le fait la carte ; le tertre fouillé de Tell Safut, à environ 3 km au nord-ouest, a été proposé à la place. La Bible n’en dit rien de plus, et la ville n’est nommée dans aucune autre source antique."
  pl:
    - "Jogbeha było miastem Gada w Gileadzie, na wschód od Jordanu. Gdy Mojżesz dał ziemię Sychona i Oga Gadowi i Rubenowi, synowie Gada zbudowali lub obwarowali szereg miast, wśród nich „I Atrot, i Sofan, i Jazer, i Jegba”. Pojawia się jeszcze raz w opowieści o Gedeonie: ścigając resztę wojska madianickiego pod wodzą Zebacha i Salmunny do Karkor, „Tedy ciągnął Giedeon drogą tych, co mieszkali w namiociech, od wschodu słońca Nobe i Jegbaa, i uderzył na obóz, (a obóz się był ubezpieczył,)”. Miasto stało więc blisko skraju pustyni, na trasie używanej przez koczowników."
    - "Nazwa przetrwała w al-Dżubajha, dziś dzielnicy północnego Ammanu w Jordanii, i Jogbehę zwykle umieszcza się w ruinie Chirbet el-Adżbejhat tam, jak czyni mapa; zamiast tego proponowano wykopany pagórek Tell Safut, około 3 km na północny zachód. Biblia nie mówi nic więcej, a miasta nie wymieniają inne źródła starożytne."
  it:
    - "Iogbeà era una città di Gad in Galaad, a est del Giordano. Quando Mosè diede il paese di Sicon e di Og a Gad e a Ruben, i figli di Gad costruirono o fortificarono un elenco di città, fra cui «Atroth-Shofan, Iazer, Iogbehah». Compare ancora una volta nella storia di Gedeone: inseguendo gli ultimi dell’esercito madianita sotto Zebach e Zalmunna fino a Karkor, «Gedeone salì per la via di quelli che abitano sotto tende a oriente di Nobah e di Iogbeha, e sconfisse l’esercito, che si credeva sicuro». La città si trovava dunque presso il margine del deserto, sulla via usata dai nomadi."
    - "Il nome sopravvive ad al-Jubayha, oggi un quartiere di Amman nord in Giordania, e Iogbeà è di solito posta alla rovina di Khirbet el-Ajbeihat lì, come fa la mappa; è stato invece proposto il tell scavato di Tell Safut, circa 3 km a nord-ovest. La Bibbia non dice altro, e la città non è nominata in altre fonti antiche."
  nl:
    - "Jogbeha was een stad van Gad in Gilead, ten oosten van de Jordaan. Toen Mozes het land van Sihon en Og aan Gad en Ruben gaf, bouwden of versterkten de kinderen van Gad een reeks steden, onder meer “Atroth-Sofan, en Jaezer, en Jogbeha”. Het komt nog eenmaal voor in het verhaal van Gideon: terwijl hij het laatste deel van het Midianitische leger onder Zebach en Zalmunna tot Karkor achtervolgde, “Gideon toog opwaarts, den weg dergenen, die in tenten wonen, tegen het oosten van Nobah en Jogbeha; en hij sloeg dat leger, want het leger was zorgeloos”. De stad lag dus bij de rand van de woestijn, aan de route van de nomaden."
    - "De naam leeft voort in al-Jubayha, nu een wijk van Noord-Amman in Jordanië, en Jogbeha wordt gewoonlijk geplaatst bij de ruïne Khirbet el-Ajbeihat daar, zoals de kaart doet; de opgegraven heuvel Tell Safut, ongeveer 3 km naar het noordwesten, is in plaats daarvan voorgesteld. De Bijbel vertelt niets meer, en de stad wordt in andere oude bronnen niet genoemd."
  cs:
    - "Jogbeha bylo město Gádovo v Gileadu, východně od Jordánu. Když Mojžíš dal zemi Sichona a Óga Gádovi a Rúbenovi, synové Gádovi vystavěli nebo opevnili řadu měst, mezi nimi „A Atrot, Sofan, Jazer a Jegbaa“. Objevuje se ještě jednou v příběhu o Gedeonovi: pronásleduje poslední z midjánského vojska pod Zebachem a Calmunou ke Karkoru, „I táhna Gedeon cestou bydlících v staních od východní strany Nobe a Jegbaa, udeřil na to vojsko, kteréžto vojsko sobě počínalo bezpečně“. Město tedy stálo blízko okraje pouště, na trase, kterou užívali nomádi."
    - "Jméno přežívá v al-Džubajha, dnes čtvrti severního Ammánu v Jordánsku, a Jogbeha se obvykle klade do zříceniny Chirbet el-Adžbejhát tam, jak činí mapa; místo toho byl navržen vykopaný pahorek Tell Safút asi 3 km na severozápad. Bible nic dalšího neříká a město se v jiných starověkých pramenech nejmenuje."
  sv:
    - "Jogboha var en stad i Gad i Gilead, öster om Jordan. När Mose gav Sichons och Ogs land åt Gad och Ruben byggde Gads barn eller befäste en rad städer, bland dem ”Atrot-Sofan, Jaeser, Jogbeha”. Den förekommer en gång till i berättelsen om Gideon, som förföljde resten av midjaniternas här under Sevach och Salmunna till Karkor: ”Och Gideon drog upp på karavanvägen, öster om Noba och Jogbeha, och överföll hären, där den låg sorglös i sitt läger.” Staden stod alltså nära ökenkanten, vid den väg nomaderna använde."
    - "Namnet lever kvar i al-Jubayha, nu en stadsdel i norra Amman i Jordanien, och Jogboha placeras vanligen vid ruinen Khirbet el-Ajbeihat där, som kartan gör; den utgrävda kullen Tell Safut, omkring 3 km nordväst, har föreslagits i stället. Bibeln berättar inget mer, och staden nämns inte i andra antika källor."
  nb:
    - "Jogbeha var en by i Gad i Gilead, øst for Jordan. Da Moses ga landet til Sihon og Og til Gad og Ruben, bygde eller befestet Gads barn en liste byer, blant dem «Atrot-Sofan og Jaser og Jogbeha». Den forekommer en gang til i fortellingen om Gideon: på forfølgelsen av resten av midianittenes hær under Sebah og Salmunna til Karkor drog Gideon opp «ad teltboernes vei østenfor Nobah og Jogbea; og han slo hæren mens den var trygg». Byen sto dermed nær ørkenkanten, ved ruten nomadene brukte."
    - "Navnet overlever i al-Jubayha, nå en bydel i nordlige Amman i Jordan, og Jogbeha plasseres vanligvis ved ruinen Khirbet el-Ajbeihat der, slik kartet gjør; den utgravde haugen Tell Safut, omtrent 3 km mot nordvest, er foreslått i stedet. Bibelen forteller ikke mer, og byen nevnes ikke i andre antikke kilder."
  tl:
    - "Ang Jogbea ay isang bayan ni Gad sa Gilead, sa silangan ng Jordan. Nang ibigay ni Moises ang lupain nina Sehon at Og kay Gad at Ruben, itinayo o pinatibay ng mga anak ni Gad ang isang talaan ng mga bayan, kabilang ang “Ataroth-sophan, at ang Jazer, at ang Jogbaa”. Lumilitaw itong muli sa kuwento ni Gedeon: sa paghabol sa huling hukbo ng Midian sa ilalim nina Zeba at Zalmunna hanggang sa Carcor, “si Gedeon ay umahon sa daan ng mga tumatahan sa mga tolda sa silanganan ng Noba at Jogbea, at sinaktan ang hukbo; sapagka't ang hukbo ay tiwasay”. Kaya't ang bayan ay nasa malapit sa gilid ng disyerto, sa rutang ginamit ng mga nomada."
    - "Nananatili ang pangalan sa al-Jubayha, ngayon ay distrito ng hilagang Amman sa Jordan, at ang Jogbea ay karaniwang inilalagay sa guho ng Khirbet el-Ajbeihat doon, gaya ng ginagawa ng mapa; ang nahukay na burol ng Tell Safut, mga 3 km sa hilagang-kanluran, ay iminungkahi sa halip. Wala nang iba pang sinasabi ang Biblia, at hindi pinangalanan ang bayan sa ibang sinaunang batis."
  da:
    - "Jogboha var en by i Gad i Gilead, øst for Jordan. Da Moses gav Sihons og Ogs land til Gad og Ruben, byggede eller befæstede Gads børn en række byer, blandt dem »Ataroth-Sofan og Jaeser og Jogbea«. Den optræder endnu en gang i Gideons historie: Gideon forfulgte den sidste del af den midjanitiske hær under Zebah og Zalmunna til Karkor: »Og Gideon drog op ad deres Vej, som bo i Telte, Østen for Noba og Jogbea; og han slog den Lejr, thi Lejren var tryg«. Byen stod altså nær ørkenens rand, på den rute, nomaderne brugte."
    - "Navnet overlever ved al-Jubayha, nu et kvarter i det nordlige Amman i Jordan, og Jogboha placeres sædvanligvis ved ruinen Khirbet el-Ajbeihat dér, som kortet gør; den udgravede høj Tell Safut, omkring 3 km mod nordvest, er blevet foreslået i stedet. Bibelen fortæller intet mere, og byen nævnes ikke i andre oldtidskilder."
  sr:
    - "Јогвеја је била град Гада у Галаду, источно од Јордана. Кад је Мојсије дао земљу Сиона и Ога Гаду и Рувиму, синови Гадови су саградили или утврдили списак градова, међу њима „Атрот-Софан и Јазир и Јогвеју“. Јавља се још једном у причи о Гедеону: гонећи остатак мадијанске војске под Зевејем и Салманом до Каркора, „отиде Гедеон преко оних што живе под шаторима, с истока Нови и Јогвеји, и удари на војску кад војска стајаше безбрижна“. Град је дакле стајао близу ивице пустиње, на путу којим су ишли номади."
    - "Име преживљава у ел-Џубехи, сада четврти северног Амана у Јордану, а Јогвеја се обично ставља у рушевину Хирбет ел-Аџбејхат тамо, као што чини карта; предложена је уместо тога ископана хумка Тел Сафут, око 3 км северозападно. Библија не казује ништа више, а град се не именује у другим древним изворима."
  hu:
    - "Jogbeha Gád városa volt Gileádban, a Jordánon túl, keleten. Amikor Mózes Szihon és Óg földjét Gádnak és Rúbennek adta, Gád fiai városok egész sorát építették fel vagy erősítették meg, köztük ezeket: „Dibont, Ataróthot, Aroért, Atróth-Sofánt, Jázért, Jogbehát”. Egyszer még felbukkan, Gedeon történetében: amikor Gedeon a midiáni sereg maradékát Zebah és Calmunna vezetésével Karkorig üldözte, „felméne Gedeon a sátorban lakók útján keletre Nobahtól és Jogbehától, és szétverte a tábort, pedig a tábor biztonságban érezte magát”. A város tehát a sivatag peremén állt, azon az úton, amelyet a nomádok használtak."
    - "A név az al-Jubayhában maradt fenn, amely ma Amman északi kerülete Jordániában; Jogbehát általában az itteni Khirbet el-Ajbeihat romjánál keresik, ahogyan a térkép is teszi; helyette javasolták a kiásott Tell Safut halmot is, mintegy 3 km-re északnyugatra. A Biblia többet nem mond róla, és más ókori források sem említik a várost."
  fi:
    - "Jogbeha oli Gadin kaupunki Gileadissa, Jordanin itäpuolella. Kun Mooses antoi Sihonin ja Ogin maan Gadille ja Ruubenille, gaadilaiset rakensivat tai linnoittivat joukon kaupunkeja, niiden joukossa ”Atrot-Soofanin, Jaeserin, Jogbehan”. Se mainitaan vielä kerran Gideonin kertomuksessa: kun hän ajoi takaa Seban ja Salmunnan johtamaa midianilaisten sotajoukon viimeistä jäännöstä Karkoriin, ”Gideon kulki teltoissa-eläjien tietä Noobahin ja Jogbehan itäpuolitse ja voitti joukon, kun se oli huoletonna leirissään”. Kaupunki sijaitsi siis aavikon reunan tuntumassa, reitin varrella, jota paimentolaiset käyttivät."
    - "Nimi on säilynyt paikassa al-Jubayha, joka on nykyään Ammanin pohjoisosan kaupunginosa Jordaniassa, ja Jogbeha sijoitetaan yleensä siellä sijaitsevaan Khirbet el-Ajbeihatin raunioon, kuten kartallakin; sen sijaan on ehdotettu kaivettua Tell Safutin kumpua, noin 3 km luoteeseen. Raamattu ei kerro enempää, eikä kaupunkia mainita muissa muinaisissa lähteissä."
  vi:
    - "Giô-bê-ha là một thành của chi phái Gát ở Ga-la-át, phía đông sông Giô-đanh. Khi Môi-se ban xứ của Si-hôn và Óc cho Gát và Ru-bên, con cháu Gát đã xây cất hoặc củng cố một loạt thành, trong đó có “Ạt-rốt-Sô-phan, Gia-ê-xe, Giô-bê-ha”. Thành lại được nhắc một lần nữa trong câu chuyện về Ghê-đê-ôn: khi đuổi theo tàn quân Ma-đi-an dưới quyền Xê-bách và Xanh-mu-na đến Cạt-cô, “Ghê-đê-ôn đi lên theo đường của những dân ở dưới trại, tại hướng đông Nô-bách và Giô-bê-ha, đánh bại đạo binh vẫn tưởng rằng mình bình an vô-sự”. Như vậy thành nằm gần rìa sa mạc, trên con đường người du mục thường đi."
    - "Tên cũ còn lưu lại ở al-Jubayha, nay là một khu phía bắc Amman, Gióc-đa-ni; Giô-bê-ha thường được đặt tại di tích Khirbet el-Ajbeihat ở đó, như bản đồ đã làm; người ta cũng đề nghị thay vào đó là gò Tell Safut đã khai quật, cách khoảng 3 km về phía tây bắc. Kinh Thánh không nói gì thêm, và các nguồn cổ khác không nêu tên thành này."
  ro:
    - "Iogbeha era o cetate a lui Gad în Galaad, la est de Iordan. Când Moise a dat țara lui Sihon și a lui Og lui Gad și lui Ruben, fiii lui Gad au zidit sau au întărit o serie de cetăți, printre care Atrot, Șofan, Iazer și Iogbeha. Cetatea apare încă o dată în povestea lui Ghedeon: urmărind rămășița oastei madianite de sub Zebah și Țalmuna până la Carcor, „s’a suit Ghedeon pre calea celor ce lăcuesc în corturi la răsăritul Navei, aproape de Nava și Egheval și a lovit tabăra, care nu aveà teamă de nimic”. Cetatea se afla deci aproape de marginea deșertului, pe drumul folosit de nomazi."
    - "Numele a rămas la al-Jubayha, azi un cartier din nordul orașului Amman, în Iordania, iar Iogbeha este plasată de obicei la ruina Khirbet el-Ajbeihat de acolo, ca pe hartă; în schimb, s-a propus movila excavată Tell Safut, la circa 3 km spre nord-vest. Biblia nu spune nimic mai mult, iar cetatea nu este numită în alte surse antice."
  bg:
    - "Йогбеха е бил град на Гад в Галаад, на изток от Йордан. Когато Мойсей даде земята на Сихон и Ог на Гад и Рувим, Гадовите синове построиха или укрепиха редица градове, сред тях „Атротсофан, и Язир, и Иогнея“. Градът се споменава още веднъж в разказа за Гедеон, който преследваше остатъка от мадиамската войска на Зевей и Салмана до Каркор: „възлезе Гедеон през пътя на онези които живееха в шатри, от изток на Нова и на Иогвея, та порази стана когато станът беше в безгрижие“. Следователно градът е бил близо до края на пустинята, по пътя, по който минавали номадите."
    - "Името е запазено в ал-Джубайха, днес квартал в северната част на Аман в Йордания, и Йогбеха обикновено се поставя на развалините Хирбет ел-Аджбейхат там, както прави и картата; като алтернатива е предлаган разкопаният хълм Тел Сафут, на около 3 км северозападно. Библията не казва нищо повече, а други древни извори не назовават града."
