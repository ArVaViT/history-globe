body:
  en:
    - "Jogbehah was a town of Gad in Gilead, east of the Jordan. When Moses gave the land of Sihon and Og to Gad and Reuben, the children of Gad built or fortified a list of towns, among them “Atroth, Shophan, and Jaazer, and Jogbehah”. It appears once more in the story of Gideon: pursuing the last of the Midianite army under Zebah and Zalmunna to Karkor, “Gideon went up by the way of them that dwelt in tents on the east of Nobah and Jogbehah, and smote the host: for the host was secure”. The town thus stood near the edge of the desert, on the route the nomads used."
    - "The name survives at al-Jubayha, now a district of northern Amman in Jordan, and most scholars place Jogbehah at the ruin of Khirbet el-Ajbeihat there, as the map does; the excavated mound of Tell Safut, about 3 km to the north-west, has been proposed instead. The Bible tells nothing more, and the town is not named in other ancient sources."
  ru:
    - "Иогбега был городом Гада в Галааде, к востоку от Иордана. Когда Моисей отдал Гаду и Рувиму землю Сигона и Ога, сыны Гадовы построили или укрепили ряд городов, и среди них «Атароф-Шофан, и Иазер, и Иогбегу». Он упомянут ещё раз в рассказе о Гедеоне: преследуя остатки мадиамского войска с Зевеем и Салманом до Каркора, «Гедеон пошел к живущим в шатрах на восток от Новы и Иогбеги и поразил стан, когда стан стоял беспечно». Город, стало быть, стоял у края пустыни, на пути, которым ходили кочевники."
    - "Имя сохранилось в аль-Джубейхе, ныне районе на севере Аммана в Иордании, и большинство исследователей помещает Иогбегу на развалинах Хирбет-эль-Аджбейхат там же, как и карта; вместо неё предлагали раскопанный холм Телль-Сафут примерно в 3 км к северо-западу. Больше Библия ничего не говорит, и в других древних источниках город не назван."
  uk:
    - "Йогбега було містом Гада в Гілеаді, на схід від Йордану. Коли Мойсей віддав землю Сігона й Ога Гадові та Рувимові, сини Гада збудували або укріпили низку міст, серед них «Та Атарот-Шофан, та Язер, та Йогбега». Воно з’являється ще раз в історії Гедеона: переслідуючи рештки мадіамського війська під проводом Зевея й Салмана до Каркору, «пійшов Гедеон караванним шляхом на схід сонця від Ноби й Йокбеги, та й ударив на табір, як військо спочивало собі безпечно». Отже, місто стояло біля краю пустелі, на шляху, яким користувалися кочовики."
    - "Назва зберігається в ель-Джубейха, нині районі північного Амману в Йорданії, і більшість дослідників розміщують Йогбегу на руїні Хірбет-ель-Аджбейгат там, як і карта; розкопане городище Телль-Сафут, приблизно за 3 км на північний захід, пропонували натомість. Біблія більше нічого не розповідає, і місто не названо в інших давніх джерелах."
  es:
    - "Jogbeha era una población de Gad en Galaad, al este del Jordán. Cuando Moisés dio la tierra de Sehón y de Og a Gad y a Rubén, los hijos de Gad edificaron o fortificaron una lista de ciudades, entre ellas «á Atroth-sophan, y á Jazer, y á Jogbaa». Aparece una vez más en la historia de Gedeón: persiguiendo los restos del ejército madianita bajo Zeba y Zalmuna hasta Carcor, «subiendo Gedeón hacia los que habitaban en tiendas, á la parte oriental de Noba y de Jogbea, hirió el campo, porque estaba el ejército sin recelo». La población se hallaba, pues, cerca del borde del desierto, en la ruta que usaban los nómadas."
    - "El nombre sobrevive en al-Jubayha, hoy un distrito del norte de Amán, en Jordania, y la mayoría de los estudiosos sitúan Jogbeha en la ruina de Khirbet el-Ajbeihat, allí, como hace el mapa; en cambio se ha propuesto el montículo excavado de Tell Safut, a unos 3 km al noroeste. La Biblia no dice nada más, y la población no se nombra en otras fuentes antiguas."
  pt:
    - "Jogbeá era uma cidade de Gade em Gileade, a leste do Jordão. Quando Moisés deu a terra de Seom e Ogue a Gade e Rúben, os filhos de Gade edificaram ou fortificaram uma lista de cidades, entre elas “Atarote-Sofã, Jazer, Jogbeá”. Aparece uma vez mais na história de Gideão: perseguindo o resto do exército midianita sob Zeba e Zalmuna até Carcor, “Gideão subiu pelo caminho dos que habitavam em tendas, a leste de Noba e de Jogbeá, e atacou o exército; pois o exército se sentia seguro”. A cidade ficava assim perto da orla do deserto, na rota usada pelos nômades."
    - "O nome sobrevive em al-Jubayha, hoje um bairro do norte de Amã, na Jordânia, e a maioria dos estudiosos situa Jogbeá na ruína de Khirbet el-Ajbeihat ali, como faz o mapa; o monte escavado de Tell Safut, a cerca de 3 km a noroeste, foi proposto em vez dela. A Bíblia nada mais conta, e a cidade não é nomeada em outras fontes antigas."
  de:
    - "Jogbeha war eine Stadt Gads in Gilead, östlich des Jordan. Als Mose das Land Sihons und Ogs an Gad und Ruben gab, bauten oder befestigten die Kinder Gad eine Reihe von Städten, darunter „Atroth-Sophan, Jaser, Jogbeha“. Es erscheint noch einmal in der Geschichte Gideons, der den Rest des midianitischen Heeres unter Sebach und Zalmunna bis Karkor verfolgte: „Und Gideon zog hinauf auf der Straße derer, die in Hütten wohnten, gegen Morgen von Nobah und Jogbeha, und schlug das Heer, denn das Heer war sicher“. Die Stadt lag also nahe dem Wüstenrand, an der Route der Nomaden."
    - "Der Name lebt in al-Dschubeiha fort, heute ein Stadtteil im Norden Ammans in Jordanien, und die meisten Forscher setzen Jogbeha an der Ruine Chirbet el-Adschbeihat dort an, wie die Karte; der ausgegrabene Hügel Tell Safut, etwa 3 km nordwestlich, ist stattdessen vorgeschlagen worden. Die Bibel erzählt nichts weiter, und die Stadt wird in anderen antiken Quellen nicht genannt."
  fr:
    - "Jogbeha était une ville de Gad en Galaad, à l’est du Jourdain. Quand Moïse donna le pays de Sihon et d’Og à Gad et à Ruben, les fils de Gad bâtirent ou fortifièrent une liste de villes, dont « Athroth-Schophan, Jaezer, Jogbeha ». Elle reparaît dans l’histoire de Gédéon : poursuivant les derniers restes de l’armée madianite sous Zébach et Tsalmunna jusqu’à Karkor, « Gédéon monta par le chemin de ceux qui habitent sous les tentes, à l’orient de Nobach et de Jogbeha, et il battit l’armée qui se croyait en sûreté ». La ville se trouvait donc près de la lisière du désert, sur la route qu’empruntaient les nomades."
    - "Le nom survit à al-Jubayha, aujourd’hui un quartier du nord d’Amman, en Jordanie, et la plupart des spécialistes placent Jogbeha à la ruine de Khirbet el-Ajbeihat, comme le fait la carte ; le tertre fouillé de Tell Safut, à environ 3 km au nord-ouest, a été proposé à la place. La Bible n’en dit rien de plus, et la ville n’est nommée dans aucune autre source antique."
  pl:
    - "Jogbeha było miastem Gada w Gileadzie, na wschód od Jordanu. Gdy Mojżesz dał ziemię Sychona i Oga Gadowi i Rubenowi, synowie Gada zbudowali lub obwarowali szereg miast, wśród nich „I Atrot, i Sofan, i Jazer, i Jegba”. Pojawia się jeszcze raz w opowieści o Gedeonie: ścigając resztę wojska madianickiego pod wodzą Zebacha i Salmunny do Karkor, „Tedy ciągnął Giedeon drogą tych, co mieszkali w namiociech, od wschodu słońca Nobe i Jegbaa, i uderzył na obóz, (a obóz się był ubezpieczył,)”. Miasto stało więc blisko skraju pustyni, na trasie używanej przez koczowników."
    - "Nazwa przetrwała w al-Dżubajha, dziś dzielnicy północnego Ammanu w Jordanii, i większość uczonych umieszcza Jogbehę w ruinie Chirbet el-Adżbejhat tam, jak czyni mapa; zamiast tego proponowano wykopany pagórek Tell Safut, około 3 km na północny zachód. Biblia nie mówi nic więcej, a miasta nie wymieniają inne źródła starożytne."
  it:
    - "Iogbeà era una città di Gad in Galaad, a est del Giordano. Quando Mosè diede il paese di Sicon e di Og a Gad e a Ruben, i figli di Gad costruirono o fortificarono un elenco di città, fra cui «Atroth-Shofan, Iazer, Iogbehah». Compare ancora una volta nella storia di Gedeone: inseguendo gli ultimi dell’esercito madianita sotto Zebach e Zalmunna fino a Karkor, «Gedeone salì per la via di quelli che abitano sotto tende a oriente di Nobah e di Iogbeha, e sconfisse l’esercito, che si credeva sicuro». La città si trovava dunque presso il margine del deserto, sulla via usata dai nomadi."
    - "Il nome sopravvive ad al-Jubayha, oggi un quartiere di Amman nord in Giordania, e la maggior parte degli studiosi pone Iogbeà alla rovina di Khirbet el-Ajbeihat lì, come fa la mappa; è stato invece proposto il tell scavato di Tell Safut, circa 3 km a nord-ovest. La Bibbia non dice altro, e la città non è nominata in altre fonti antiche."
  nl:
    - "Jogbeha was een stad van Gad in Gilead, ten oosten van de Jordaan. Toen Mozes het land van Sihon en Og aan Gad en Ruben gaf, bouwden of versterkten de kinderen van Gad een reeks steden, onder meer “Atroth-Sofan, en Jaezer, en Jogbeha”. Het komt nog eenmaal voor in het verhaal van Gideon: terwijl hij het laatste deel van het Midianitische leger onder Zebach en Zalmunna tot Karkor achtervolgde, “Gideon toog opwaarts, den weg dergenen, die in tenten wonen, tegen het oosten van Nobah en Jogbeha; en hij sloeg dat leger, want het leger was zorgeloos”. De stad lag dus bij de rand van de woestijn, aan de route van de nomaden."
    - "De naam leeft voort in al-Jubayha, nu een wijk van Noord-Amman in Jordanië, en de meeste geleerden plaatsen Jogbeha bij de ruïne Khirbet el-Ajbeihat daar, zoals de kaart doet; de opgegraven heuvel Tell Safut, ongeveer 3 km naar het noordwesten, is in plaats daarvan voorgesteld. De Bijbel vertelt niets meer, en de stad wordt in andere oude bronnen niet genoemd."
  cs:
    - "Jogbeha bylo město Gádovo v Gileadu, východně od Jordánu. Když Mojžíš dal zemi Sichona a Óga Gádovi a Rúbenovi, synové Gádovi vystavěli nebo opevnili řadu měst, mezi nimi „A Atrot, Sofan, Jazer a Jegbaa“. Objevuje se ještě jednou v příběhu o Gedeonovi: pronásleduje poslední z midjánského vojska pod Zebachem a Calmunou ke Karkoru, „I táhna Gedeon cestou bydlících v staních od východní strany Nobe a Jegbaa, udeřil na to vojsko, kteréžto vojsko sobě počínalo bezpečně“. Město tedy stálo blízko okraje pouště, na trase, kterou užívali nomádi."
    - "Jméno přežívá v al-Džubajha, dnes čtvrti severního Ammánu v Jordánsku, a většina učenců klade Jogbehu do zříceniny Chirbet el-Adžbejhát tam, jak činí mapa; místo toho byl navržen vykopaný pahorek Tell Safút asi 3 km na severozápad. Bible nic dalšího neříká a město se v jiných starověkých pramenech nejmenuje."
