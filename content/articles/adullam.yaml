# Overview article (ADR 0007). Mainstream facts only; the usual identification (Khirbet esh-Sheikh Madhkur with 'Id el-Miyeh) is named as not yet confirmed by an inscription; the Maccabean episode is not given an exact year.
id: adullam
place: af82614
title:
  en: "Adullam"
  ru: "Одоллам"
  uk: "Одолам"
  es: "Adulam"
  pt: "Adulão"
  de: "Adullam"
