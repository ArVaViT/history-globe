body:
  en:
    - "Adullam lay in the Shephelah above the southern end of the Valley of Elah, about 11 km northeast of Beth Guvrin. Its upper town is usually placed at Khirbet esh-Sheikh Madhkur, a hilltop with rock-cut cisterns and caves, and the old name is thought to survive in the ruin of 'Id el-Miyeh at its foot, which Charles Clermont-Ganneau took for Adullam in the 1870s. No inscription has yet confirmed the identification. The site has been surveyed but hardly excavated; pottery from the surface shows settlement in the Bronze and Iron Ages."
    - 'In Genesis Judah went down from his brethren and "turned in to a certain Adullamite, whose name was Hirah". Joshua''s list of conquered kings names a king of Adullam, and the town is counted among the cities of the lowland of Judah. Fleeing from Achish of Gath, David "escaped to the cave Adullam"; there his family joined him, and "every one that was in distress, and every one that was in debt, and every one that was discontented" gathered to him, about four hundred men. Later three of his mighty men came to him at the cave of Adullam; when he longed for water from the well of Bethlehem, they broke through the host of the Philistines to bring it, and he poured it out unto the LORD.'
    - 'Rehoboam fortified Adullam with Lachish, Azekah and other towns of Judah. In the late eighth century BC Micah, naming the towns of the lowland, says "he shall come unto Adullam the glory of Israel". After the exile men of Judah lived again at Adullam and its villages, as Nehemiah records.'
    - "In the time of the Maccabees, after defeating Gorgias, the governor of Idumea, Judas Maccabeus gathered his army and came into the city of Odollam, where his men purified themselves and kept the sabbath. Josephus retells David's stay in the cave and lists Adullam among Rehoboam's cities. In the early fourth century AD Eusebius knew it as a very large village ten miles east of Eleutheropolis."
  ru:
    - "Одоллам лежал в Шефеле над южным концом долины дуба (Эла), примерно в 11 км к северо-востоку от Бейт-Гуврина. Его верхний город обычно помещают на Хирбет-эш-Шейх-Мазкур, вершине холма с высеченными в скале водоёмами и пещерами, а древнее имя, как считают, сохранилось в развалинах Ид-эль-Мийе у его подножия, которые Шарль Клермон-Ганно в 1870-х гг. признал Одолламом. Ни одна надпись пока не подтвердила это отождествление. Место обследовано, но почти не раскопано; черепки с поверхности говорят о поселении в бронзовом и железном веке."
    - "В книге Бытия Иуда отошёл от братьев своих «и поселился близ одного Одолламитянина, которому имя: Хира». В списке побеждённых Иисусом Навином царей назван царь Одоллама, а сам город числится среди городов низменности Иуды. Убегая от Анхуса, царя Гефского, Давид «убежал в пещеру Одолламскую»; туда к нему пришла его родня и собрались «все притесненные и все должники и все огорченные душею» — около четырёхсот человек. Позже трое из его храбрых пришли к нему в пещеру Одоллам; когда он захотел воды из колодезя Вифлеемского, они пробились сквозь стан филистимский и принесли её, но он вылил её во славу Господа."
    - "Ровоам укрепил Одоллам вместе с Лахисом, Азекой и другими городами Иудеи. В конце VIII века до н. э. Михей, перечисляя города низменности, говорит: «он пройдет до Одоллама, славы Израиля». После плена сыны Иуды снова жили в Одолламе и селах его, как сообщает Неемия."
    - "Во времена Маккавеев Иуда Маккавей, разбив Горгия, правителя Идумеи, собрал своё войско и пришёл в город Одоллам, где его воины очистились и провели субботу. Иосиф Флавий пересказывает, как Давид жил в пещере, и называет Одоллам среди городов Ровоама. В начале IV века н. э. Евсевий знал его как очень большое селение в десяти милях к востоку от Елевферополя."
  uk:
    - "Одолам лежав у Шефелі над південним кінцем Долини дуба, приблизно за 11 км на північний схід від Бейт-Губріна. Його верхнє місто зазвичай розміщують у Хірбет-еш-Шейх-Мадкур, на вершині пагорба з вирубаними в скелі цистернами та печерами, а стару назву, як вважають, зберігає руїна Ід-ель-Мійе біля його підніжжя, яку Шарль Клермон-Ганно у 1870-х роках визнав за Одолам. Жоден напис досі не підтвердив ототожнення. Місце обстежували, але майже не розкопували; поверхнева кераміка свідчить про поселення бронзової та залізної доби."
    - "У книзі Буття Юда відлучився від своїх братів і «присусїдивсь до одного Адуламця, на прізвище Гіра». У переліку переможених царів Ісуса Навина названо царя Одолама, а місто зараховано до міст низини Юди. Утікаючи від Анхуса Гатського, Давид «утїк у Адолламську печеру в горах»; там до нього приєдналася його родина, і зібралися «всякі злиденники й задовжені, й всякі невдоволені люде», близько чотирьохсот чоловіка. Пізніше троє з його силачів прийшли до нього в печеру Одоллам; коли він забажав води з колодязя Вифлеєма, вони пробилися крізь табір филистимлян, щоб принести її, а він вилив її для Господа."
    - "Ровоам укріпив Одолам разом із Лахішем, Азекою та іншими містами Юди. Наприкінці VIII століття до н. е. Міха, називаючи міста низини, каже: «він досягне до Оддоламу, — сієї слави Ізрайлевої». Після вигнання юдеї знову жили в Одолам і його селах, як записує Неемія."
    - "За часів Маккавеїв, після перемоги над Горгієм, правителем Ідумеї, Юда Маккавей зібрав військо і прийшов до міста Одоллам, де його люди очистилися й дотримали суботи. Йосиф Флавій переказує перебування Давида в печері й зараховує Одолам до міст Ровоама. На початку IV століття н. е. Євсевій знав його як дуже велике село за десять миль на схід від Елевтеропіля."
  es:
    - "Adulam se hallaba en la Sefelá, sobre el extremo meridional del valle de Ela, a unos 11 km al nordeste de Bet Guvrin. Su ciudad alta se sitúa por lo común en Khirbet esh-Sheikh Madhkur, una colina con cisternas y cuevas excavadas en la roca, y se cree que el antiguo nombre sobrevive en la ruina de 'Id el-Miyeh, a sus pies, que Charles Clermont-Ganneau tomó por Adulam en la década de 1870. Ninguna inscripción ha confirmado aún la identificación. El sitio ha sido prospectado pero apenas excavado; la cerámica de superficie muestra poblamiento en las edades del Bronce y del Hierro."
    - "En el Génesis, Judá descendió de sus hermanos y «fuése á un varón Adullamita, que se llamaba Hira». La lista de reyes vencidos de Josué nombra a un rey de Adulam, y la ciudad se cuenta entre las ciudades de la tierra baja de Judá. Huyendo de Aquis de Gat, David «escapóse á la cueva de Adullam»; allí se le unió su familia, y se juntaron con él «todos los afligidos, y todo el que estaba adeudado, y todos los que se hallaban en amargura de espíritu», unos cuatrocientos hombres. Más tarde tres de sus valientes fueron a él a la cueva de Adullam; cuando anheló agua del pozo de Belén, rompieron por el campo de los filisteos para traérsela, y él la derramó a Jehová."
    - "Roboam fortificó Adulam junto con Laquis, Azeca y otras ciudades de Judá. A finales del siglo VIII a. C. Miqueas, nombrando las ciudades de la tierra baja, dice: «la gloria de Israel vendrá hasta Adullam». Después del exilio, hombres de Judá vivieron de nuevo en Adulam y sus aldeas, como registra Nehemías."
    - "En tiempo de los macabeos, tras derrotar a Gorgias, gobernador de Idumea, Judas Macabeo reunió a su ejército y llegó a la ciudad de Odolam, donde sus hombres se purificaron y guardaron el sábado. Josefo vuelve a contar la estancia de David en la cueva y enumera Adulam entre las ciudades de Roboam. A principios del siglo IV d. C., Eusebio la conocía como una aldea muy grande a diez millas al este de Eleuterópolis."
  pt:
    - "Adulão ficava na Sefelá, acima da extremidade sul do vale de Elá, cerca de 11 km a nordeste de Bet Guvrin. Sua cidade alta costuma ser situada em Khirbet esh-Sheikh Madhkur, um cume com cisternas e cavernas escavadas na rocha, e pensa-se que o nome antigo sobreviva na ruína de ʻId el-Miyeh, ao seu pé, que Charles Clermont-Ganneau tomou por Adulão na década de 1870. Nenhuma inscrição confirmou ainda a identificação. O sítio foi levantado, mas quase não escavado; a cerâmica de superfície mostra povoamento nas Idades do Bronze e do Ferro."
    - "Em Gênesis, Judá afastou-se de seus irmãos e desceu “para visitar um certo adulamita, cujo nome era Hira”. A lista de reis vencidos por Josué nomeia um rei de Adulão, e a cidade é contada entre as da baixada de Judá. Fugindo de Aquis de Gate, Davi “escapou para a caverna de Adulão”; ali a sua família se juntou a ele, e “Todos os que estavam em aperto, todos os que estavam endividados e todos os amargurados de espírito se reuniram a ele”, cerca de quatrocentos homens. Mais tarde três de seus valentes vieram a ele à caverna de Adulão; quando ele teve saudade da água do poço de Belém, romperam pelo exército dos filisteus para trazê-la, e ele a derramou ao SENHOR."
    - "Roboão fortificou Adulão com Laquis, Azeca e outras cidades de Judá. No fim do século VIII a.C., Miqueias, nomeando as cidades da baixada, diz: “A glória de Israel chegará até Adulão”. Depois do exílio, homens de Judá viveram de novo em Adulão e suas aldeias, como registra Neemias."
    - "No tempo dos macabeus, depois de derrotar Górgias, governador da Iduméia, Judas Macabeu reuniu o seu exército e chegou à cidade de Odolam, onde os seus homens se purificaram e guardaram o sábado. Josefo conta de novo a estada de Davi na caverna e lista Adulão entre as cidades de Roboão. No início do século IV d.C., Eusébio a conhecia como uma aldeia muito grande a dez milhas a leste de Eleuterópolis."
  de:
    - "Adullam lag in der Schefela über dem südlichen Ende des Elatals, etwa 11 km nordöstlich von Bet Guvrin. Seine Oberstadt wird gewöhnlich bei Chirbet esch-Schech Madkur gesucht, einem Hügelgipfel mit in den Fels gehauenen Zisternen und Höhlen, und der alte Name soll in der Ruine 'Id el-Miye an seinem Fuß fortleben, die Charles Clermont-Ganneau in den 1870er Jahren für Adullam hielt. Keine Inschrift hat die Gleichsetzung bisher bestätigt. Der Ort wurde untersucht, aber kaum ausgegraben; Oberflächenkeramik zeigt Besiedlung in der Bronze- und Eisenzeit."
    - "Im ersten Buch Mose zog Juda von seinen Brüdern hinab und „tat sich zu einem Mann von Adullam, der hieß Hira“. Josuas Liste der besiegten Könige nennt einen König von Adullam, und die Stadt zählt zu den Städten der Niederung Judas. Auf der Flucht vor Achis von Gat „entrann“ David „in die Höhle Adullam“; dort kam seine Familie zu ihm, und „allerlei Männer, die in Not und Schulden und betrübten Herzens waren“, sammelten sich bei ihm, etwa vierhundert Mann. Später kamen drei seiner Helden zu ihm in die Höhle Adullam; als er sich nach Wasser aus dem Brunnen von Bethlehem sehnte, brachen sie durch das Heerlager der Philister, um es zu holen, und er goss es dem HERRN aus."
    - "Rehabeam befestigte Adullam mit Lachisch, Aseka und anderen Städten Judas. Im späten 8. Jahrhundert v. Chr. sagt Micha, die Städte der Niederung nennend: „die Herrlichkeit Israels soll kommen bis gen Adullam“. Nach dem Exil wohnten Männer aus Juda wieder in Adullam und seinen Dörfern, wie Nehemia berichtet."
    - "Zur Zeit der Makkabäer sammelte Judas Makkabäus nach dem Sieg über Gorgias, den Statthalter von Idumäa, sein Heer und kam in die Stadt Odollam, wo seine Männer sich reinigten und den Sabbat hielten. Josephus erzählt Davids Aufenthalt in der Höhle nach und führt Adullam unter den Städten Rehabeams auf. Im frühen 4. Jahrhundert n. Chr. kannte Eusebius es als sehr großes Dorf zehn Meilen östlich von Eleutheropolis."
  fr:
    - "Adullam se trouvait dans la Shéphéla, au-dessus de l’extrémité sud de la vallée d’Éla, à environ 11 km au nord-est de Beit Guvrin. Sa ville haute est d’ordinaire placée à Khirbet esh-Sheikh Madhkur, une colline portant des citernes et des grottes creusées dans le roc, et l’on pense que l’ancien nom survit dans la ruine de ’Id el-Miyeh, à son pied, que Charles Clermont-Ganneau prit pour Adullam dans les années 1870. Aucune inscription n’a encore confirmé l’identification. Le site a été prospecté mais à peine fouillé ; la céramique de surface atteste un habitat aux âges du Bronze et du Fer."
    - "Dans la Genèse, Juda s’éloigna de ses frères et « se retira vers un homme d’Adullam, nommé Hira ». La liste des rois vaincus par Josué nomme un roi d’Adullam, et la ville est comptée parmi celles de la plaine de Juda. Fuyant Akisch de Gath, David « se sauva dans la caverne d’Adullam » ; sa famille l’y rejoignit, et « tous ceux qui se trouvaient dans la détresse, qui avaient des créanciers, ou qui étaient mécontents, se rassemblèrent auprès de lui », environ quatre cents hommes. Plus tard, trois de ses vaillants hommes vinrent le trouver dans la caverne d’Adullam ; comme il désirait l’eau de la citerne de Bethléem, ils passèrent au travers du camp des Philistins pour l’apporter, et il la répandit devant l’Éternel."
    - "Roboam fortifia Adullam avec Lakis, Azéka et d’autres villes de Juda. À la fin du VIIIe siècle av. J.-C., Michée, nommant les villes de la plaine, dit : « La gloire d’Israël s’en ira jusqu’à Adullam ». Après l’exil, des hommes de Juda habitèrent de nouveau Adullam et ses villages, comme le note Néhémie."
    - "Au temps des Maccabées, après avoir vaincu Gorgias, gouverneur de l’Idumée, Judas Maccabée rassembla son armée et vint dans la ville d’Odollam, où ses hommes se purifièrent et observèrent le sabbat. Josèphe reprend le séjour de David dans la caverne et range Adullam parmi les villes de Roboam. Au début du IVe siècle apr. J.-C., Eusèbe la connaissait comme un très grand village à dix milles à l’est d’Éleuthéropolis."
  it:
    - "Adullam sorgeva nella Sefela, sopra l’estremità meridionale della Valle del Terebinto, a circa 11 km a nord-est di Beth Guvrin. La sua città alta è di solito collocata a Khirbet esh-Sheikh Madhkur, un’altura con cisterne e grotte scavate nella roccia, e si pensa che l’antico nome sopravviva nella rovina di ‘Id el-Miyeh ai suoi piedi, che Charles Clermont-Ganneau identificò con Adullam negli anni 1870. Nessuna iscrizione ha finora confermato l’identificazione. Il sito è stato esplorato ma appena scavato; la ceramica di superficie mostra un insediamento nelle età del Bronzo e del Ferro."
    - "Nella Genesi Giuda scese dai suoi fratelli e «andò a stare da un uomo di Adullam, che avea nome Hira». L’elenco dei re vinti da Giosuè nomina un re di Adullam, e la città è contata fra le città della pianura di Giuda. Fuggendo da Achis di Gat, Davide «si rifugiò nella spelonca di Adullam»; là la sua famiglia lo raggiunse, e «tutti quelli ch’erano in angustie, che avean dei debiti o che erano scontenti» si radunarono presso di lui, circa quattrocento uomini. Più tardi tre dei suoi prodi vennero da lui alla spelonca di Adullam; quando desiderò l’acqua del pozzo di Betlemme, essi si aprirono un varco attraverso il campo dei Filistei per portarla, ed egli la versò davanti al Signore."
    - "Roboamo fortificò Adullam con Lachis, Azeka e altre città di Giuda. Alla fine dell’VIII secolo a.C. Michea, nominando le città della pianura, dice: «fino ad Adullam andrà la gloria d’Israele». Dopo l’esilio gli uomini di Giuda abitarono di nuovo ad Adullam e nei suoi villaggi, come registra Neemia."
    - "Al tempo dei Maccabei, dopo aver sconfitto Gorgia, governatore dell’Idumea, Giuda Maccabeo radunò il suo esercito e giunse nella città di Odollam, dove i suoi uomini si purificarono e osservarono il sabato. Flavio Giuseppe racconta di nuovo il soggiorno di Davide nella grotta ed elenca Adullam tra le città di Roboamo. All’inizio del IV secolo d.C. Eusebio la conosceva come un grandissimo villaggio a dieci miglia a est di Eleuteropoli."
  pl:
    - "Adullam leżało w Szefeli nad południowym krańcem Doliny Ela, około 11 km na północny wschód od Bet Guvrin. Jego górne miasto umieszcza się zwykle w Chirbet esh-Sheikh Madhkur, na wzgórzu z wykutymi w skale cysternami i jaskiniami, a dawną nazwę uważa się za zachowaną w ruinie 'Id el-Miyeh u jego stóp, którą Charles Clermont-Ganneau uznał w latach 70. XIX wieku za Adullam. Żaden napis nie potwierdził dotąd tego utożsamienia. Miejsce zbadano powierzchniowo, lecz prawie nie wykopywano; ceramika z powierzchni wskazuje osadnictwo w epoce brązu i żelaza."
    - "W Księdze Rodzaju Juda odszedł od braci swoich i „wstąpił do niektórego męża Odolamickiego, którego imię było Chyra”. Wykaz zdobytych królów u Jozuego wymienia króla Adullam, a miasto liczy się wśród miast nizin Judy. Uciekając przed Achiszem z Gat, Dawid „uszedł do jaskini Adullam”; tam dołączyła do niego rodzina i zebrali się do niego „wszyscy, którzy byli utrapieni, i wszyscy, którzy byli dłużni, i wszyscy, którzykolwiek byli w gorzkości serca”, około czterystu mężów. Później trzech jego bohaterów przyszło do niego do jaskini Adullam; gdy zapragnął wody ze studni w Betlejem, przedarli się przez obóz Filistynów, by mu ją przynieść, a on wylał ją dla Pana."
    - "Roboam obwarował Adullam wraz z Lakisz, Azeką i innymi miastami Judy. U schyłku VIII wieku p.n.e. Mika, wymieniając miasta nizin, mówi: „przyjdzie aż do Odollam, i aż do chwały Izraelskiej”. Po wygnaniu mieszkańcy Judy znów osiedlili się w Adullam i jego wsiach, jak zapisał Nehemiasz."
    - "W czasach Machabeuszy, po pokonaniu Gorgiasza, namiestnika Idumei, Juda Machabeusz zebrał wojsko i wszedł do miasta Odollam, gdzie jego ludzie oczyścili się i obchodzili szabat. Józef Flawiusz opowiada na nowo pobyt Dawida w jaskini i wymienia Adullam wśród miast Roboama. Na początku IV wieku n.e. Euzebiusz znał je jako bardzo dużą wieś, dziesięć mil na wschód od Eleuteropolis."
  nl:
    - "Adullam lag in de Sefela boven het zuidelijke uiteinde van het Dal van Ela, ongeveer 11 km ten noordoosten van Beth Guvrin. De bovenstad wordt gewoonlijk geplaatst op Khirbet esh-Sheikh Madhkur, een heuveltop met in de rots uitgehouwen cisternen en grotten, en de oude naam zou voortleven in de ruïne van ’Id el-Miyeh aan de voet ervan, die Charles Clermont-Ganneau in de jaren 1870 voor Adullam hield. Geen inscriptie heeft de identificatie tot nu toe bevestigd. De plaats is verkend maar nauwelijks opgegraven; aardewerk aan het oppervlak wijst op bewoning in de bronstijd en de ijzertijd."
    - "In Genesis ging Juda van zijn broeders af en “keerde in tot een man van Adullam, wiens naam was Hira”. Jozua’s lijst van overwonnen koningen noemt een koning van Adullam, en de stad wordt gerekend tot de steden van het laagland van Juda. Op de vlucht voor Achis van Gat “ontkwam” David “in de spelonk van Adullam”; daar voegde zijn familie zich bij hem, en “alle man, die benauwd was, en alle man, die een schuldeiser had, en alle man, wiens ziel bitterlijk bedroefd was” verzamelde zich bij hem, omtrent vierhonderd man. Later kwamen drie van zijn helden tot hem in de spelonk van Adullam; toen hij verlangde naar water uit de bron van Bethlehem, braken zij door het leger der Filistijnen om het te halen, en hij goot het uit voor de HEER."
    - "Rehabeam versterkte Adullam, met Lachis, Azeka en andere steden van Juda. In de late achtste eeuw v.Chr. zegt Micha, de steden van het laagland noemend: “Hij zal komen tot aan Adullam, tot aan de heerlijkheid Israels”. Na de ballingschap woonden mannen van Juda weer in Adullam en zijn dorpen, zoals Nehemia vermeldt."
    - "In de tijd van de Makkabeeën verzamelde Judas Makkabeüs, na de overwinning op Gorgias, de gouverneur van Idumea, zijn leger en kwam in de stad Odollam, waar zijn mannen zich reinigden en de sabbat hielden. Josephus vertelt Davids verblijf in de grot opnieuw en noemt Adullam onder Rehabeams steden. In het begin van de vierde eeuw n.Chr. kende Eusebius het als een zeer groot dorp, tien mijl ten oosten van Eleutheropolis."
  cs:
    - "Adulam ležel v Šefele nad jižním koncem Élského údolí, asi 11 km severovýchodně od Bejt Guvrinu. Jeho horní město se obvykle klade do Chirbet esh-Sheikh Madhkur, na vrchol s cisternami a jeskyněmi vytesanými ve skále, a staré jméno prý přežívá ve zřícenině 'Id el-Miyeh u jeho úpatí, kterou Charles Clermont-Ganneau v 70. letech 19. století pokládal za Adulam. Žádný nápis ztotožnění dosud nepotvrdil. Místo bylo prozkoumáno povrchovým průzkumem, ale téměř nebylo vykopáno; keramika z povrchu ukazuje osídlení v době bronzové a železné."
    - "V Genesis Juda sešel od svých bratří a „uchýlil se k muži Odolamitskému, jehož jméno bylo Híra“. Jozuův seznam poražených králů jmenuje krále Adulamu a město se počítá mezi města judské nížiny. Když David utíkal před Achišem z Gatu, „skryl se v jeskyni Adulam“; tam se k němu připojila jeho rodina a „kteřížkoli byli v ssoužení, a kteřížkoli byli zadlužilí, a kteřížkoli byli v hořkosti ducha“ se k němu shromáždili, asi čtyři sta mužů. Později k němu do jeskyně Adulam přišli tři z jeho udatných; když zatoužil po vodě ze studny v Betlémě, probili se vojskem Pelištejských, aby ji přinesli, a on ji vylil Hospodinu."
    - "Rechabeám opevnil Adulam spolu s Lachišem, Azekou a dalšími městy Judy. Koncem 8. století př. n. l. praví Micheáš, když jmenuje města nížiny: „až do Adulam přijde, k slávě Izraelské“. Po vyhnanství v Adulamu a jeho vsích opět bydleli judští muži, jak zaznamenává Nehemjáš."
    - "Za časů Makabejských Juda Makabejský po porážce Gorgiáše, správce Idumeje, shromáždil své vojsko a přišel do města Odollam, kde se jeho muži očistili a světili sabat. Josephus Flavius převypráví Davidův pobyt v jeskyni a uvádí Adulam mezi Rechabeámovými městy. Na počátku 4. století n. l. jej Eusebios znal jako velmi velkou vesnici deset mil východně od Eleutheropole."
  sv:
    - "Adullam låg i Shefela ovanför södra änden av Terebintdalen, omkring 11 km nordost om Bet Guvrin. Dess övre stad förläggs vanligen till Khirbet esh-Sheikh Madhkur, en bergstopp med uthuggna cisterner och grottor, och det gamla namnet antas leva kvar i ruinen 'Id el-Miyeh vid dess fot, som Charles Clermont-Ganneau höll för Adullam på 1870-talet. Ingen inskrift har ännu bekräftat identifieringen. Platsen har undersökts men knappast grävts ut; keramik från ytan visar bosättning under brons- och järnåldern."
    - "I Första Mosebok begav sig Juda bort från sina bröder och ”slöt sig till en man i Adullam, som hette Hira”. Josuas förteckning över besegrade kungar nämner en kung i Adullam, och staden räknas bland städerna i Judas lågland. När David flydde från Akish i Gat ”flydde undan till Adullams grotta”; där kom hans familj till honom, och ”alla slags män som voro i något trångmål, alla som ansattes av fordringsägare och alla missnöjda” samlades hos honom, omkring fyrahundra man. Senare kom tre av hans hjältar till honom vid Adullams grotta; när han längtade efter vatten från brunnen i Betlehem bröt de sig igenom filistéernas läger för att hämta det, och han göt ut det för HERREN."
    - "Rehabeam befäste Adullam tillsammans med Lakish, Aseka och andra städer i Juda. I slutet av 700-talet f.Kr. säger Mika, när han nämner låglandets städer: ”Ända till Adullam skall Israels härlighet komma”. Efter exilen bodde Judas män åter i Adullam och dess byar, som Nehemja berättar."
    - "På mackabéernas tid, sedan Judas Mackabeus hade besegrat Gorgias, Idumeens ståthållare, samlade han sin här och kom till staden Odollam, där hans män renade sig och höll sabbaten. Josefus återberättar Davids vistelse i grottan och räknar upp Adullam bland Rehabeams städer. I början av 300-talet e.Kr. kände Eusebios den som en mycket stor by tio romerska mil öster om Eleutheropolis."
  nb:
    - "Adullam lå i Sjefela over den sørlige enden av Ela-dalen, omtrent 11 km nordøst for Bet Guvrin. Overbyen plasseres vanligvis ved Khirbet esh-Sheikh Madhkur, en høyde med fjellhugde sisterner og huler, og det gamle navnet antas å leve videre i ruinen 'Id el-Miyeh ved foten, som Charles Clermont-Ganneau regnet for Adullam på 1870-tallet. Ingen innskrift har ennå bekreftet identifiseringen. Stedet er kartlagt, men knapt gravd ut; keramikk fra overflaten viser bosetning i bronse- og jernalderen."
    - "I 1. Mosebok drog Juda ned fra sine brødre, og «han tok inn til en mann i Adullam, som hette Hira». Josvas liste over beseirede konger nevner en konge av Adullam, og byen regnes blant byene i lavlandet i Juda. David flyktet fra Akisj av Gat «til hulen ved Adullam»; der sluttet familien hans seg til ham, og «alle som var i nød, eller som var trykket av gjeld, eller som var misfornøide, samlet sig om ham», omkring fire hundre mann. Senere kom tre av hans helter til ham i hulen ved Adullam; da han lengtet etter vann fra brønnen i Betlehem, brøt de gjennom filisterflokken for å hente det, og han øste det ut for Herren."
    - "Rehabeam befestet Adullam sammen med Lakis, Aseka og andre byer i Juda. På slutten av 700-tallet f.Kr. sier Mika, idet han nevner byene i lavlandet: «Til Adullam skal Israels stormenn komme.» Etter eksilet bodde menn fra Juda igjen i Adullam og landsbyene dens, slik Nehemja forteller."
    - "På makkabeernes tid samlet Judas Makkabeus, etter å ha beseiret Gorgias, guvernøren i Idumea, hæren sin og kom til byen Odollam, der mennene hans renset seg og holdt sabbaten. Josefus gjenforteller Davids opphold i hulen og oppfører Adullam blant Rehabeams byer. Tidlig på 300-tallet e.Kr. kjente Eusebius den som en meget stor landsby ti romerske mil øst for Eleutheropolis."
  tl:
    - "Ang Adullam ay nasa Sephela sa itaas ng katimugang dulo ng Libis ng Ela, mga 11 km sa hilagang-silangan ng Beth Guvrin. Karaniwang inilalagay ang itaas na bayan nito sa Khirbet esh-Sheikh Madhkur, isang tuktok ng burol na may mga sisternang inukit sa bato at mga yungib, at iniisip na ang lumang pangalan ay nananatili sa guho ng 'Id el-Miyeh sa paanan nito, na itinuring ni Charles Clermont-Ganneau na Adullam noong dekada 1870. Wala pang inskripsiyong nagpatunay ng pagkakatukoy. Nasarbey na ang lugar ngunit halos hindi pa nahuhukay; ipinapakita ng mga piraso ng palayok sa ibabaw ang paninirahan noong Panahon ng Tanso at Bakal."
    - "Sa Genesis, bumaba si Juda mula sa kaniyang mga kapatid at “nagdaan sa isang Adullamita na ang pangalan ay Hira”. Pinangalanan ng talaan ni Josue ng mga nasakop na hari ang isang hari ng Adullam, at ibinibilang ang bayan sa mga lungsod ng mababang lupain ng Juda. Sa pagtakas kay Achis ng Gath, si David ay “tumakas sa yungib ng Adullam”; doon sumama sa kaniya ang kaniyang pamilya, at “bawa't isa na napipighati, at bawa't isa na may utang, at bawa't isa na may kalumbayan” ay nakipisan sa kaniya, mga apatnaraang tao. Kalaunan, tatlo sa kaniyang mga makapangyarihang lalaki ay lumapit sa kaniya sa yungib ng Adullam; nang manabik siya sa tubig mula sa balon ng Bethlehem, nilusob nila ang hukbo ng mga Filisteo upang dalhin ito, at ibinuhos niya ito sa Panginoon."
    - "Pinatibay ni Roboam ang Adullam kasama ng Lachis, Azeca at iba pang bayan ng Juda. Noong huling bahagi ng ika-8 siglo BK, sinabi ni Mikas, na nagpapangalan sa mga bayan ng mababang lupain, na “ang kaluwalhatian ng Israel ay darating hanggang sa Adullam”. Pagkatapos ng pagkabihag, muling tumira ang mga tao ng Juda sa Adullam at sa mga nayon nito, gaya ng itinatala ni Nehemias."
    - "Noong panahon ng mga Macabeo, matapos talunin si Gorgias, ang gobernador ng Idumea, tinipon ni Judas Macabeo ang kaniyang hukbo at pumasok sa lungsod ng Odollam, kung saan nilinis ng kaniyang mga tauhan ang kanilang sarili at ipinagdiwang ang sabbath. Isinasalaysay muli ni Josefo ang pananatili ni David sa yungib at inililista ang Adullam sa mga lungsod ni Roboam. Noong unang bahagi ng ika-4 na siglo AD, kilala ito ni Eusebio bilang isang napakalaking nayon na sampung milya sa silangan ng Eleutheropolis."
  da:
    - "Adullam lå i Sjefela over den sydlige ende af Terebintedalen, omkring 11 km nordøst for Beth Guvrin. Dens øvre by placeres sædvanligvis ved Khirbet esh-Sheikh Madhkur, en bakketop med klippehuggede cisterner og huler, og det gamle navn menes at leve videre i ruinen 'Id el-Miyeh ved dens fod, som Charles Clermont-Ganneau i 1870'erne tog for Adullam. Ingen indskrift har endnu bekræftet identifikationen. Stedet er undersøgt, men næsten ikke udgravet; keramik fra overfladen viser bosættelse i bronze- og jernalderen."
    - "I Første Mosebog drog Juda ned fra sine brødre og »tog ind til en Mand, en Adullamiter, og hans Navn var Hira«. Josvas liste over besejrede konger nævner en konge af Adullam, og byen regnes blandt byerne i Judas lavland. På flugt fra Akisj af Gat »undkom« David »til Hulen ved Adullam«; dér sluttede hans familie sig til ham, og »hver Mand, som var i Trang, og hver Mand, som trykkedes af Gæld, og hver Mand, som var beskeligen bedrøvet i Sjælen«, samlede sig til ham, omkring fire hundrede mænd. Senere kom tre af hans helte til ham ved hulen ved Adullam; da han længtes efter vand fra brønden i Betlehem, brød de gennem filisternes hær for at hente det, og han udgød det for Herren."
    - "Rehabeam befæstede Adullam sammen med Lakisj, Azeka og andre af Judas byer. I slutningen af 700-tallet f.Kr. siger Mika, idet han nævner lavlandets byer: »til Adullam skal Israels Herlighed komme«. Efter eksilet boede Judas mænd igen i Adullam og dens landsbyer, som Nehemias beretter."
    - "På makkabæernes tid samlede Judas Makkabæus, efter at have besejret Gorgias, Idumæas guvernør, sin hær og kom ind i byen Odollam, hvor hans mænd rensede sig og holdt sabbat. Josefus genfortæller Davids ophold i hulen og opregner Adullam blandt Rehabeams byer. I begyndelsen af 300-tallet e.Kr. kendte Eusebius den som en meget stor landsby ti romerske mil øst for Eleutheropolis."
  sr:
    - "Одолам је лежао у Сефели изнад јужног краја Долине храстова, око 11 км североисточно од Бет Гуврина. Његов горњи град обично се смешта у Хирбет еш-Шејх Мадкур, на брдски врх с цистернама и пећинама уклесаним у стену, а мисли се да старо име живи у рушевини Ид ел-Мије у његовом подножју, коју је Шарл Клермон-Гано седамдесетих година 19. века узео за Одолам. Ниједан натпис још није потврдио поистовећивање. Налазиште је истраживано, али једва ископавано; керамика с површине показује насељеност у бронзано и гвоздено доба."
    - "У Постању је Јуда отишао од браће своје и „уврати се код неког Одоламејца, коме име беше Ирас“. Исусов списак побеђених царева наводи цара Одолама, а град се убраја међу градове јудине низије. Бежећи од Ахиса из Гата, Давид „утече у пећину одоламску“; ту му се придружила породица и „скупише се око њега који год беху у невољи и који беху задужени и који год беху тужног срца“, око четири стотине људи. Касније су му три јунака дошла у пећину одоламску; када је зажелео воде са студенца витлејемског, пробила су се кроз војску Филистејаца да му је донесу, а он је проли пред Господом."
    - "Ровоам је утврдио Одолам са Лахисом, Азиком и другим градовима Јуде. Крајем 8. века п. н. е. Миха, именујући градове низије, каже: „доћи ће до Одолама, славе Израиљеве“. После изгнанства људи из Јуде поново су живели у Одоламу и његовим селима, како бележи Немија."
    - "У доба Макавејаца, пошто је победио Горгију, управитеља Идумеје, Јуда Макавејац је окупио војску и дошао у град Одолам, где су се његови људи очистили и држали суботу. Јосиф Флавије препричава Давидов боравак у пећини и наводи Одолам међу Ровоамовим градовима. Почетком 4. века н. е. Јевсевије га је знао као врло велико село десет миља источно од Елевтерополиса."
