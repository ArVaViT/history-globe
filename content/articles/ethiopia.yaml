body:
  en:
    - "The Ethiopia of these verses is not the modern country but Cush, the Nile land south of Egypt in today's Sudan; the Greek name Aithiopes, “burnt-faced”, passed through the Septuagint into the English and Russian Bibles. Here Cush is the far edge of the known world. Ahasuerus reigned over a hundred and twenty-seven provinces “from India even unto Ethiopia”, and Mordecai's decree went out to the rulers of all of them. The Persian record agrees: Darius lists Kush among the lands of his empire in his tomb inscription at Naqsh-i Rustam, and Herodotus tells that the Ethiopians bordering Egypt paid no fixed tribute but brought the king gifts of gold, ebony, boys and elephant tusks."
    - "Cushites also appear as people. When Absalom fell, Joab sent a Cushite runner to David; the King James Version, like the Synodal Bible, takes the Hebrew “the Cushite” as a name, Cushi, and it was he who brought the king the news. Job says of wisdom that “the topaz of Ethiopia shall not equal it”: Pliny, citing Juba, says the topazos came from an island in the Red Sea, and the stone he describes is thought to be the green peridot of Zabargad. Amos sets Israel beside the distant Cushites: “Are ye not as children of the Ethiopians unto me, O children of Israel?”"
    - "In Acts “a man of Ethiopia, an eunuch of great authority under Candace queen of the Ethiopians”, returning from Jerusalem, sat in his chariot reading Isaiah; Philip explained the prophet to him and baptised him. Candace, as Pliny notes, was a title passed from queen to queen at Meroë. Eusebius records that the eunuch was the first of the Gentiles to believe and was said to have preached in his own country. In the fourth century the Greek text of King Ezana of Aksum rendered his people's name Habashat as Ethiopians, and the name passed to the highland kingdom; the Ethiopian Church, calling the eunuch Bachos, counts him as the first of its faithful."
  ru:
    - "Ефиопия этих стихов — не нынешняя страна, а Куш, нильская земля к югу от Египта, в сегодняшнем Судане; греческое имя «эфиопы», «опалённые лицом», через Септуагинту перешло в русскую и английскую Библию. Здесь Куш — край известного мира. Артаксеркс царствовал над ста двадцатью семью областями «от Индии и до Ефиопии», и указ Мардохея был разослан правителям их всех. Персидские источники согласны: Дарий в надписи на своей гробнице в Накше-Рустаме числит Куш среди земель державы, а Геродот рассказывает, что эфиопы, соседние с Египтом, не платили постоянной подати, но приносили царю дары — золото, эбеновое дерево, мальчиков и слоновые бивни."
    - "Кушиты появляются и как люди. Когда пал Авессалом, Иоав послал к Давиду бегуна-кушита; Синодальный перевод, как и английская Библия, понимает еврейское «кушит» как имя — Хусий, — и это он принёс царю весть. Иов говорит о мудрости: «Не равняется с нею топаз Ефиопский»; Плиний со слов Юбы пишет, что топаз везли с острова в Красном море, и описанный им камень считают зелёным перидотом с острова Забаргад. Амос ставит Израиль рядом с далёкими кушитами: «Не таковы ли, как сыны Ефиоплян, и вы для Меня, сыны Израилевы?»"
    - "В Деяниях «муж Ефиоплянин, евнух, вельможа Кандакии, царицы Ефиопской», возвращаясь из Иерусалима, читал на колеснице пророка Исаию; Филипп объяснил ему пророка и крестил его. Кандакия, как замечает Плиний, — титул, переходивший в Мероэ от царицы к царице. Евсевий пишет, что евнух первым из язычников уверовал и, по преданию, проповедовал у себя на родине. В IV веке греческий текст надписи царя Эзаны из Аксума передал имя его народа, Хабашат, словом «эфиопы», и имя перешло к царству на нагорье; Эфиопская церковь, называя евнуха Бахосом, считает его первым из своих верных."
  uk:
    - "Ефіопія цих віршів — не сучасна країна, а Куш, нільська земля на південь від Єгипту в сьогоднішньому Судані; грецька назва айтіопес, «обпалені обличчя», перейшла через Септуагінту в англійські й російські Біблії. Тут Куш — далекий край відомого світу. Артаксеркс царював над сто двадцятьма сімома провінціями «від Индиї до Етиопиї», і указ Мардохея пішов до правителів усіх них. Перський запис це підтверджує: Дарій перелічує Куш серед земель своєї імперії у своєму гробничному написі в Накше-Рустамі, а Геродот розповідає, що ефіопи, які межували з Єгиптом, не платили сталої данини, а приносили цареві дари — золото, чорне дерево, хлопчиків і слонові бивні."
    - "Кушиті з'являються й як люди. Коли Авесалом упав, Йоав послав кушитського гінця до Давида; переклад короля Якова, як і Синодальна Біблія, бере єврейське «кушит» як ім'я, Хусій, і саме він приніс цареві звістку. Йов каже про мудрість: «Ба й топаз Етиопський їй не рівня»: Пліній, посилаючись на Юбу, каже, що топазос походив з острова в Червоному морі, а камінь, який він описує, вважають зеленим перидотом Забаргаду. Амос ставить Ізраїль поряд із далекими кушитами: «Чи ж ви менї не такими стали, як Етіопії, ви сини Ізраїля?»"
    - "У Діяннях «чоловік із Єтіопиї, євнух, вельможа Кандакиї, царицї Єтіопської», повертаючись з Єрусалима, сидів на своєму возі й читав Ісаю; Пилип пояснив йому пророка й охрестив його. Кандака, як зазначає Пліній, була титулом, що передавався від цариці до цариці в Мерое. Євсевій записує, що євнух був першим з поган, хто увірував, і, як кажуть, проповідував у своїй країні. У IV ст. грецький текст царя Езани з Аксума передав назву його народу Хабашат як ефіопи, і назва перейшла на гірське царство; Ефіопська церква, називаючи євнуха Бахосом, зараховує його як першого зі своїх вірних."
  es:
    - "La Etiopía de estos versículos no es el país moderno sino Cus, la tierra del Nilo al sur de Egipto, en el actual Sudán; el nombre griego Aithiopes, «rostros quemados», pasó por la Septuaginta a las Biblias inglesa y rusa. Aquí Cus es el confín del mundo conocido. Asuero reinó sobre ciento veintisiete provincias «desde la India hasta la Etiopía», y el decreto de Mardoqueo llegó a los gobernantes de todas ellas. El registro persa concuerda: Darío enumera Kush entre las tierras de su imperio en su inscripción funeraria de Naqsh-e Rostam, y Heródoto cuenta que los etíopes fronterizos con Egipto no pagaban tributo fijo sino que llevaban al rey regalos de oro, ébano, niños y colmillos de elefante."
    - "Los cusitas aparecen también como personas. Cuando cayó Absalón, Joab envió un corredor cusita a David; la versión King James, como la Biblia sinodal, toma el hebreo «el cusita» como un nombre, Cusi, y fue él quien llevó al rey la noticia. Job dice de la sabiduría que «No se igualará con ella esmeralda de Ethiopía» (el hebreo pitdah, «topacio» en la King James): Plinio, citando a Juba, dice que el topacio procedía de una isla del mar Rojo, y se piensa que la piedra que describe es el peridoto verde de Zabargad. Amós pone a Israel junto a los lejanos cusitas: «Hijos de Israel, ¿no me sois vosotros, dice Jehová, como hijos de Etiopes?»."
    - "En los Hechos, «un Etiope, eunuco, gobernador de Candace, reina de los Etiopes», de regreso de Jerusalén, estaba sentado en su carro leyendo a Isaías; Felipe le explicó al profeta y lo bautizó. Candace, como señala Plinio, era un título que pasaba de reina en reina en Meroe. Eusebio recoge que el eunuco fue el primero de los gentiles en creer y se decía que había predicado en su país. En el siglo IV el texto griego del rey Ezana de Axum tradujo el nombre de su pueblo, Habashat, como etíopes, y el nombre pasó al reino de las tierras altas; la Iglesia etíope, que llama al eunuco Bachos, lo cuenta como el primero de sus fieles."
  pt:
    - "A Etiópia destes versículos não é o país moderno, mas Cuxe, a terra do Nilo ao sul do Egito, no atual Sudão; o nome grego Aithiopes, “rostos queimados”, passou pela Septuaginta às Bíblias inglesa e russa. Aqui Cuxe é a orla extrema do mundo conhecido. Assuero reinava sobre cento e vinte e sete províncias “desde a Índia até a Etiópia”, e o decreto de Mardoqueu foi aos governantes de todas elas. O registro persa concorda: Dario lista Kush entre as terras de seu império na inscrição de seu túmulo em Naqsh-e Rustam, e Heródoto conta que os etíopes que faziam fronteira com o Egito não pagavam tributo fixo, mas traziam ao rei presentes de ouro, ébano, meninos e presas de elefante."
    - "Os cuxitas aparecem também como pessoas. Quando Absalão caiu, Joabe enviou um corredor cuxita a Davi; a King James Version, como a Bíblia Sinodal, toma o hebraico “o cuxita” como nome, Cuxi, e foi ele quem levou ao rei a notícia. Jó diz da sabedoria: “O topázio da Etiópia não se igualará a ela”: Plínio, citando Juba, diz que o topazos vinha de uma ilha do Mar Vermelho, e a pedra que ele descreve é tida como o peridoto verde de Zabargad. Amós põe Israel ao lado dos distantes cuxitas: “Acaso vocês não são para mim como os filhos dos etíopes, ó filhos de Israel?”"
    - "Em Atos, “um homem da Etiópia, um eunuco de grande autoridade sob Candace, rainha dos etíopes”, ao voltar de Jerusalém, lia Isaías sentado em sua carruagem; Filipe lhe explicou o profeta e o batizou. Candace, como nota Plínio, era um título passado de rainha a rainha em Meroé. Eusébio registra que o eunuco foi o primeiro dos gentios a crer e que, segundo se dizia, pregou em sua própria terra. No século IV, o texto grego do rei Ezana de Axum traduziu o nome do seu povo, Habashat, por etíopes, e o nome passou ao reino das terras altas; a Igreja Etíope, que chama o eunuco de Bachos, conta-o como o primeiro de seus fiéis."
  de:
    - "Das Äthiopien dieser Verse ist nicht das moderne Land, sondern Kusch, das Nilland südlich von Ägypten im heutigen Sudan; der griechische Name Aithiopes, „Verbrannt-Gesichtige“, gelangte über die Septuaginta in die englische und die russische Bibel. Kusch ist hier der äußerste Rand der bekannten Welt. Ahasveros herrschte über hundertsiebenundzwanzig Länder „von Indien bis an Mohrenland“, und Mordechais Erlass ging an die Herrscher aller. Die persische Überlieferung stimmt überein: Darius führt Kusch in seiner Grabinschrift in Naqsch-e Rostam unter den Ländern seines Reiches auf, und Herodot erzählt, die an Ägypten grenzenden Äthiopier hätten keinen festen Tribut gezahlt, sondern dem König Geschenke aus Gold, Ebenholz, Knaben und Elefantenzähnen gebracht."
    - "Kuschiter treten auch als Menschen auf. Als Absalom fiel, sandte Joab einen kuschitischen Läufer zu David; die King-James-Bibel nimmt wie die Synodalbibel das hebräische „der Kuschiter“ als Namen, Kuschi, und er war es, der dem König die Nachricht brachte. Hiob sagt von der Weisheit: „Topaz aus dem Mohrenland wird ihr nicht gleich geschätzt“: Plinius sagt unter Berufung auf Juba, der Topazos stamme von einer Insel im Roten Meer, und der von ihm beschriebene Stein gilt als der grüne Peridot von Zabargad. Amos stellt Israel neben die fernen Kuschiter: „Seid ihr Kinder Israel mir nicht gleichwie Mohren?“"
    - "In der Apostelgeschichte saß „ein Mann aus Mohrenland, ein Kämmerer und Gewaltiger der Königin Kandaze in Mohrenland“ auf der Rückreise von Jerusalem in seinem Wagen und las Jesaja; Philippus erklärte ihm den Propheten und taufte ihn. Kandake war, wie Plinius vermerkt, ein Titel, der in Meroë von Königin zu Königin weitergegeben wurde. Eusebius berichtet, der Kämmerer sei der Erste der Heiden gewesen, der glaubte, und habe in seinem Land gepredigt. Im 4. Jahrhundert gab der griechische Text König Ezanas von Aksum den Namen seines Volkes, Habaschat, mit Äthiopier wieder, und der Name ging auf das Hochlandkönigreich über; die äthiopische Kirche, die den Kämmerer Bachos nennt, zählt ihn als den ersten ihrer Gläubigen."
  fr:
    - "L’Éthiopie de ces versets n’est pas le pays moderne mais Cusch, le pays du Nil au sud de l’Égypte, dans l’actuel Soudan ; le nom grec Aithiopes, « aux visages brûlés », est passé par la Septante dans les Bibles anglaise et russe. Ici, Cusch est la lisière du monde connu. Assuérus régnait sur cent vingt-sept provinces « depuis l’Inde jusqu’en Éthiopie », et le décret de Mardochée parvint aux gouverneurs de toutes. Le témoignage perse concorde : Darius cite Kush parmi les pays de son empire dans son inscription funéraire de Naqsh-i Rustam, et Hérodote raconte que les Éthiopiens voisins de l’Égypte ne payaient aucun tribut fixe mais offraient au roi des dons d’or, d’ébène, de garçons et de défenses d’éléphant."
    - "Des Cushites apparaissent aussi comme personnes. À la mort d’Absalom, Joab envoya un coureur cuschite à David ; la version du roi Jacques, comme la Bible synodale, prend l’hébreu « le Cuschite » pour un nom, Cuschi, et c’est lui qui apporta la nouvelle au roi. Job dit de la sagesse que « la topaze d’Éthiopie n’est point son égale » : Pline, citant Juba, dit que la topazos venait d’une île de la mer Rouge, et la pierre qu’il décrit est tenue pour le péridot vert de Zabargad. Amos place Israël à côté des lointains Cushites : « N’êtes-vous pas pour moi comme les enfants des Éthiopiens, enfants d’Israël ? »"
    - "Dans les Actes, « un Éthiopien, un eunuque, ministre de Candace, reine d’Éthiopie », de retour de Jérusalem, lisait Ésaïe sur son char ; Philippe lui expliqua le prophète et le baptisa. Candace, note Pline, était un titre transmis de reine en reine à Méroé. Eusèbe rapporte que l’eunuque fut le premier des païens à croire et aurait prêché dans son propre pays. Au IVe siècle, le texte grec du roi Ézana d’Aksoum rendit le nom de son peuple, Habashat, par Éthiopiens, et le nom passa au royaume des hautes terres ; l’Église éthiopienne, qui appelle l’eunuque Bachos, le compte comme le premier de ses fidèles."
  it:
    - "L’Etiopia di questi versetti non è il paese moderno ma Cus, la terra del Nilo a sud dell’Egitto nell’odierno Sudan; il nome greco Aithiopes, «dal volto bruciato», è passato attraverso la Settanta nelle Bibbie inglese e russa. Qui Cus è l’estremo confine del mondo conosciuto. Assuero regnò su centoventisette province «dall’India sino all’Etiopia», e il decreto di Mardocheo fu inviato ai capi di tutte. Il documento persiano concorda: Dario elenca Kush fra le terre del suo impero nell’iscrizione della sua tomba a Naqsh-i Rustam, ed Erodoto racconta che gli Etiopi confinanti con l’Egitto non pagavano un tributo fisso ma portavano al re doni di oro, ebano, ragazzi e zanne di elefante."
    - "I Cusciti compaiono anche come persone. Quando Assalonne cadde, Ioab mandò un corridore cuscita a Davide; la King James Version, come la Bibbia sinodale, prende l’ebraico «il Cuscita» come nome, Cusi, ed egli portò al re la notizia. Giobbe dice della sapienza: «Il topazio d’Etiopia non può starle a fronte»: Plinio, citando Giuba, dice che il topazos veniva da un’isola del Mar Rosso, e la pietra da lui descritta si ritiene il peridoto verde di Zabargad. Amos pone Israele accanto ai lontani Cusciti: «Non siete voi per me come i figliuoli degli Etiopi, o figliuoli d’Israele?»"
    - "Negli Atti «un Etiopo, un eunuco, ministro di Candace, regina degli Etiopi», sovrintendente di tutti i suoi tesori, tornando da Gerusalemme sedeva sul suo carro leggendo Isaia; Filippo gli spiegò il profeta e lo battezzò. Candace, come nota Plinio, era un titolo passato di regina in regina a Meroe. Eusebio registra che l’eunuco fu il primo dei Gentili a credere e si diceva avesse predicato nel suo paese. Nel IV secolo il testo greco del re Ezana di Aksum rese il nome del suo popolo, Habashat, con Etiopi, e il nome passò al regno degli altopiani; la Chiesa etiope, chiamando l’eunuco Bachos, lo conta come il primo dei suoi fedeli."
  pl:
    - "Etiopia tych wersetów to nie współczesny kraj, lecz Kusz, nilowa kraina na południe od Egiptu, w dzisiejszym Sudanie; greckie imię Aithiopes, „o spalonych twarzach”, przeszło przez Septuagintę do angielskiej i rosyjskiej Biblii. Kusz jest tu dalekim krańcem znanego świata. Aswerus panował nad stu dwudziestoma siedmioma prowincjami od Indii aż po Kusz, a dekret Mardocheusza poszedł do władców wszystkich z nich. Perskie źródła się z tym zgadzają: Dariusz wymienia Kusz wśród krain swego imperium w napisie na grobowcu w Naksz-e Rostam, a Herodot mówi, że Etiopowie graniczący z Egiptem nie płacili stałej daniny, lecz przynosili królowi dary ze złota, hebanu, chłopców i kłów słoniowych."
    - "Kuszyci pojawiają się też jako ludzie. Gdy Absalom padł, Joab posłał do Dawida biegacza Kuszytę; Biblia Króla Jakuba, podobnie jak Biblia synodalna, bierze hebrajskie „Kuszyta” za imię, Kuszi, i to on przyniósł królowi wieść. Hiob mówi o mądrości: „Nie zrówna z nią i szmaragd z ziemi etyjopskiej” (angielski przekład ma tu topaz): Pliniusz, powołując się na Jubę, mówi, że topazos pochodził z wyspy na Morzu Czerwonym, a kamień, który opisuje, uważa się za zielony perydot z Zabargad. Amos stawia Izraela obok dalekich Kuszytów, pytając, czy synowie Izraela nie są dla Boga jak synowie Etiopczyków."
    - "W Dziejach Apostolskich eunuch etiopski, dostojnik Kandake, królowej Etiopczyków, zarządzający wszystkimi jej skarbami, wracając z Jerozolimy, siedział na swym wozie i czytał Izajasza; Filip wyjaśnił mu proroka i ochrzcił go. Kandake, jak zauważa Pliniusz, był tytułem przechodzącym z królowej na królową w Meroe. Euzebiusz zapisuje, że eunuch był pierwszym z pogan, który uwierzył, i podobno głosił w swoim kraju. W IV w. grecki tekst króla Ezany z Aksum oddał nazwę jego ludu Habaszat jako Etiopowie, i nazwa przeszła na górskie królestwo; Kościół etiopski, nazywając eunucha Bachos, zalicza go do pierwszych swych wiernych."
  nl:
    - "Het Ethiopië van deze verzen is niet het moderne land maar Kus, het Nijlland ten zuiden van Egypte in het huidige Soedan; de Griekse naam Aithiopes, “verbrande gezichten”, kwam via de Septuaginta in de Engelse en Russische Bijbel. Hier is Kus de verste rand van de bekende wereld. Ahasveros regeerde over honderdzevenentwintig landschappen “van Indië af tot aan Morenland toe”, en Mordechai's besluit ging uit naar de bestuurders van allemaal. De Perzische bron stemt overeen: Darius noemt Kush onder de landen van zijn rijk in zijn grafinscriptie te Naqsh-i Rustam, en Herodotus vertelt dat de Ethiopiërs aan de grens van Egypte geen vaste schatting betaalden maar de koning geschenken van goud, ebbenhout, jongens en olifantstanden brachten."
    - "Kusieten komen ook als personen voor. Toen Absalom gevallen was, zond Joab een Kusitische loper naar David; de King James Version neemt, evenals de Synodale Bijbel, het Hebreeuwse “de Kusiet” als naam, Kusi, en hij bracht de koning het nieuws. Job zegt van de wijsheid: “Men kan de Topaas van Morenland haar niet gelijk waarderen”: Plinius, naar Juba, zegt dat de topazos van een eiland in de Rode Zee kwam, en de steen die hij beschrijft wordt gehouden voor de groene peridoot van Zabargad. Amos zet Israël naast de verre Kusieten: “Zijt gijlieden Mij niet als de kinderen der Moren, o kinderen Israëls?”"
    - "In Handelingen zat “een Moorman, een kamerling, en een machtig heer van Candace, de koningin der Moren”, terugkerend uit Jeruzalem in zijn wagen Jesaja te lezen; Filippus legde hem de profeet uit en doopte hem. Candace was, zoals Plinius opmerkt, een titel die van koningin op koningin overging te Meroë. Eusebius meldt dat de kamerling de eerste van de heidenen was die geloofde en naar verluidt in zijn eigen land predikte. In de vierde eeuw gaf de Griekse tekst van koning Ezana van Axum de naam van zijn volk, Habashat, weer als Ethiopiërs, en de naam ging over op het hoogland-koninkrijk; de Ethiopische Kerk, die de kamerling Bachos noemt, rekent hem tot haar eerste gelovigen."
  cs:
    - "Etiopie těchto veršů není moderní země, ale Kúš, nilská země jižně od Egypta v dnešním Súdánu; řecké jméno Aithiopes, „spálené tváře“, přešlo přes Septuagintu do anglické a ruské Bible. Kúš je zde vzdálený okraj známého světa. Achašveroš kraloval nad sto dvaceti sedmi krajinami „od Indie až k Mouřenínské zemi“ a Mordokajův výnos šel k vládcům všech z nich. Perský záznam souhlasí: Dareios uvádí Kúš mezi země své říše v nápisu na své hrobce v Naqsh-i Rustam a Hérodotos vypráví, že Etiopové sousedící s Egyptem neplatili stálý tribut, ale přinášeli králi dary zlata, eben, chlapců a sloních klů."
    - "Kúšovci se objevují i jako lidé. Když Abšalom padl, poslal Joáb kúšovského běžce k Davidovi; Bible krále Jakuba stejně jako synodální Bible bere hebrejské „Kúšovec“ jako jméno, Kúší, a on přinesl králi zprávu. Job praví o moudrosti: „Není jí rovný v ceně smaragd z Mouřenínské země“; Plinius, citující Jubu, praví, že topazos (v Kralické „smaragd“) pocházel z ostrova v Rudém moři, a kámen, který popisuje, se pokládá za zelený peridot ze Zabargadu. Amos staví Izrael vedle vzdálených Kúšovců: „Zdaliž nejste podobni synům Mouřenínů přede mnou, ó synové Izraelovi?“"
    - "Ve Skutcích „muž Mouřenín, kleštěnec, komorník královny Mouřenínské Kandáces“, vracející se z Jeruzaléma, sedě na voze, četl Izajáše; Filip mu vyložil proroka a pokřtil ho. Kandake byl, jak poznamenává Plinius, titul předávaný z královny na královnu v Meroe. Eusebios zaznamenává, že eunuch byl prvním z pohanů, kdo uvěřil, a prý kázal ve své zemi. Ve 4. století převedl řecký text krále Ezany z Aksúmu jméno jeho lidu Habašat jako Etiopové a jméno přešlo na horské království; Etiopská církev, nazývající eunucha Bachos, jej počítá za prvního ze svých věřících."
  sv:
    - "Etiopien i dessa verser är inte det moderna landet utan Kush, Nilens land söder om Egypten i dagens Sudan; det grekiska namnet Aithiopes, ”brända ansikten”, gick genom Septuaginta in i de engelska och ryska biblarna. Här är Kush världens yttersta kant. Ahasveros regerade över hundra tjugusju hövdingdömen ”från Indien ända till Etiopien”, och Mordokajs skrivelse utfärdades till styresmännen i dem alla. Den persiska källan stämmer: Dareios förtecknar Kush bland rikets länder i sin gravinskription i Naqsh-i Rustam, och Herodotos berättar att etiopierna vid Egyptens gräns inte betalade någon fast skatt utan förde kungen gåvor av guld, ebenholts, gossar och elefantbetar."
    - "Kushiter förekommer också som människor. När Absalom föll sände Joav en kushitisk löpare till David; King James-bibeln, liksom den synodala, tar det hebreiska ”kushiten” som ett namn, Kushi, och det var han som förde kungen budet. Job säger om visheten att ”Etiopisk topas kan ej liknas vid henne”: Plinius, som citerar Juba, säger att topazos kom från en ö i Röda havet, och stenen han beskriver anses vara den gröna peridoten från Zabargad. Amos ställer Israel vid sidan av de avlägsna kushiterna: ”Ären I icke för mig lika med etiopiernas barn, I Israels barn?”"
    - "I Apostlagärningarna satt ”en etiopisk man, en hovman som var en mäktig herre hos Kandace, drottningen i Etiopien”, på hemväg från Jerusalem i sin vagn och läste Jesaja; Filippus förklarade profeten för honom och döpte honom. Kandace, noterar Plinius, var en titel som gick från drottning till drottning i Meroë. Eusebios berättar att hovmannen var den förste bland hedningarna som kom till tro och sades ha predikat i sitt eget land. På 300-talet återgav den grekiska texten av kung Ezana av Aksum hans folks namn Habashat som etiopier, och namnet gick över till högplatåns kungarike; den etiopiska kyrkan, som kallar hovmannen Bachos, räknar honom som den förste bland sina troende."
  nb:
    - "Etiopia i disse versene er ikke det moderne landet, men Kusj, Nil-landet sør for Egypt i dagens Sudan; det greske navnet Aithiopes, «brente ansikter», gikk gjennom Septuaginta inn i den engelske og den russiske bibelen. Her er Kusj kanten av den kjente verden. Ahasverus regjerte over hundre og tjuesju landskaper «fra India like til Etiopia», og Mordekais påbud gikk ut til herskerne i dem alle. Den persiske kilden stemmer: Dareios lister Kush blant rikets land i sin gravinnskrift ved Naqsh-i Rustam, og Herodot forteller at etiopierne ved Egypts grense ikke betalte fast tributt, men brakte kongen gaver av gull, ibenholt, gutter og elefantbein."
    - "Kusjitter forekommer også som enkeltpersoner. Da Absalom var falt, sendte Joab en kusjittisk løper til David; King James-oversettelsen tar, som den synodale bibelen, det hebraiske «kusjitten» som et navn, Kusji, og det var han som brakte kongen nyheten. Job sier om visdommen at «Etiopias topas kommer ikke op imot den»: Plinius, som viser til Juba, sier at topazos kom fra en øy i Rødehavet, og steinen han beskriver, antas å være den grønne peridoten fra Zabargad. Amos setter Israel ved siden av de fjerne kusjittene: «Er I mere verd for mig enn etiopernes barn, I Israels barn?»"
    - "I Apostlenes gjerninger satt «en etioper, en hoffmann, en høi embedsmann hos Kandake, etiopernes dronning», på hjemvei fra Jerusalem i sin vogn og leste Jesaja; Filip forklarte profeten for ham og døpte ham. Kandake var, som Plinius bemerker, en tittel som gikk fra dronning til dronning i Meroë. Eusebius opplyser at hoffmannen var den første blant hedningene som kom til tro og skal ha forkynt i sitt eget land. På 300-tallet gjengav den greske teksten til kong Ezana av Aksum folkets navn Habashat som etiopere, og navnet gikk over til høylandsriket; den etiopiske kirke, som kaller hoffmannen Bachos, regner ham som den første av sine troende."
