body:
  en:
    - "Dalmanutha is the place on the Sea of Galilee to which Jesus crossed after feeding the four thousand: “straightway he entered into a ship with his disciples, and came into the parts of Dalmanutha.” There the Pharisees came out to demand a sign from heaven. The name occurs nowhere else, in the Bible or outside it. In the parallel Matthew has Magadan in the oldest manuscripts and Magdala in the King James text, so the place is usually sought on the western shore near Magdala, where the map sets it."
    - "No site has been securely identified. Mendel Nun proposed a small anchorage just north of Magdala and suggested that the name may simply be the Aramaic word for a harbour; Gordon Franz, describing Magdala's own harbour, likewise took it as a Syriac word for harbour. In 2013 Ken Dark reported a previously unrecognised Roman town on the Ginosar plain between modern Migdal and the lake, with pottery from the second or first century BC to the Byzantine period, and suggested, tentatively, that it might be Dalmanutha. Others doubt that a town of this name ever existed."
    - "The manuscripts of Mark do not agree on the name: besides Dalmanutha they read Magedan, Melegada or Magdala, and one modern reference work suggests that Magdala may be the original reading. Eusebius, early in the fourth century, read Magedan in both Matthew and Mark and wrote that a district called Magedane lay around Gerasa. J. Rendel Harris argued that Dalmanutha arose from a word copied twice by mistake, so that the real place name was lost. Stanley, citing Schwarz, reported a cave in the cliffs south of the Ginosar plain called Teliman or Talmanutha, and W. Ewing wrote that, if this was true, it would point to a site near ʿAin el-Fuliyeh."
  ru:
    - "Далмануфа — место на море Галилейском, куда Иисус переправился после насыщения четырёх тысяч: «тотчас войдя в лодку с учениками Своими, прибыл в пределы Далмануфские». Там фарисеи вышли требовать от Него знамения с неба. Имя больше нигде не встречается — ни в Библии, ни вне её. В параллельном месте у Матфея древнейшие рукописи читают Магадан, а Синодальный перевод — «пределы Магдалинские», поэтому место обычно ищут на западном берегу у Магдалы, где его и ставит карта."
    - "Надёжно отождествить его не удалось. Мендель Нун предложил небольшую стоянку судов сразу к северу от Магдалы и предположил, что имя — просто арамейское слово со значением «гавань»; Гордон Франц, описывая гавань самой Магдалы, тоже видел в нём сирийское слово «гавань». В 2013 г. Кен Дарк сообщил о прежде не замеченном римском городе на равнине Геннисарет между нынешним Мигдалем и озером, с керамикой от II–I вв. до н. э. до византийского времени, и осторожно предположил, что это может быть Далмануфа. Другие сомневаются, что город с таким названием вообще существовал."
    - "Рукописи Евангелия от Марка расходятся в имени: кроме Далмануфы, в них стоит Магедан, Мелегада или Магдала, и один современный справочник допускает, что исконным чтением была Магдала. Евсевий в начале IV в. читал Магедан и у Матфея, и у Марка и писал, что область, называемая Магедана, лежит около Герасы. Дж. Рендел Харрис считал, что имя Далмануфа возникло из слова, по ошибке переписанного дважды, так что настоящее название места утрачено. Стэнли со ссылкой на Шварца сообщил о пещере в обрывах к югу от равнины Геннисарет, называемой Телиман или Талманута, а У. Юинг писал, что, если это так, это указывало бы на место близ Айн-эль-Фулийе."
  de:
    - "Dalmanuta ist der Ort am See Genezareth, zu dem Jesus nach der Speisung der Viertausend hinüberfuhr: „Und alsbald trat er in ein Schiff mit seinen Jüngern und kam in die Gegend von Dalmanutha.“ Dort kamen die Pharisäer heraus und forderten ein Zeichen vom Himmel. Der Name kommt nirgends sonst vor, weder in der Bibel noch außerhalb. In der Parallelstelle hat Matthäus in den ältesten Handschriften Magadan und im Text der King-James-Bibel Magdala, sodass der Ort gewöhnlich am Westufer nahe Magdala gesucht wird, wo ihn die Karte ansetzt."
    - "Keine Stätte ist sicher bestimmt. Mendel Nun schlug einen kleinen Ankerplatz unmittelbar nördlich von Magdala vor und meinte, der Name könne einfach das aramäische Wort für einen Hafen sein; Gordon Franz, der Magdalas eigenen Hafen beschrieb, hielt ihn ebenfalls für ein syrisches Wort für Hafen. 2013 berichtete Ken Dark von einer bisher unerkannten römischen Stadt in der Ebene Genezareth zwischen dem heutigen Migdal und dem See, mit Keramik vom zweiten oder ersten Jahrhundert v. Chr. bis in die byzantinische Zeit, und meinte vorsichtig, es könne Dalmanuta sein. Andere bezweifeln, dass es je eine Stadt dieses Namens gab."
    - "Die Handschriften des Markus sind sich über den Namen nicht einig: Neben Dalmanuta lesen sie Magedan, Melegada oder Magdala, und ein modernes Nachschlagewerk hält Magdala für die mögliche ursprüngliche Lesart. Eusebius las zu Beginn des vierten Jahrhunderts bei Matthäus wie bei Markus Magedan und schrieb, eine Magedane genannte Gegend liege um Gerasa. J. Rendel Harris meinte, Dalmanuta sei aus einem versehentlich doppelt abgeschriebenen Wort entstanden, sodass der wirkliche Ortsname verloren sei. Stanley berichtete unter Berufung auf Schwarz von einer Höhle in den Steilhängen südlich der Ebene Genezareth namens Teliman oder Talmanutha, und W. Ewing schrieb, wenn dies zutreffe, wiese es auf einen Ort bei ʿAin el-Fuliyeh."
  fr:
    - "Dalmanutha est le lieu de la mer de Galilée où Jésus passa après avoir nourri les quatre mille : « Aussitôt il monta dans la barque avec ses disciples, et se rendit dans la contrée de Dalmanutha. » Les pharisiens y vinrent lui demander un signe venant du ciel. Le nom ne se rencontre nulle part ailleurs, dans la Bible ou hors d’elle. Dans le passage parallèle, Matthieu porte Magadan dans les plus anciens manuscrits et Magdala dans le texte de la version du roi Jacques, si bien que le lieu est d’ordinaire cherché sur la rive occidentale près de Magdala, où la carte le place."
    - "Aucun site n’a été identifié avec certitude. Mendel Nun proposa un petit mouillage juste au nord de Magdala et suggéra que le nom pourrait n’être que le mot araméen pour un port ; Gordon Franz, décrivant le port même de Magdala, y vit de même un mot syriaque pour port. En 2013, Ken Dark signala une ville romaine jusque-là inconnue dans la plaine de Génésareth entre l’actuelle Migdal et le lac, avec de la céramique du IIe ou du Ier siècle av. J.-C. jusqu’à l’époque byzantine, et suggéra, avec prudence, qu’elle pourrait être Dalmanutha. D’autres doutent qu’une ville de ce nom ait jamais existé."
    - "Les manuscrits de Marc ne s’accordent pas sur le nom : outre Dalmanutha, ils portent Magedan, Melegada ou Magdala, et un ouvrage de référence moderne suggère que Magdala pourrait être la leçon originale. Eusèbe, au début du IVe siècle, lisait Magedan chez Matthieu comme chez Marc et écrivait qu’un district appelé Magedane se trouvait autour de Gérasa. J. Rendel Harris soutint que Dalmanutha était né d’un mot recopié deux fois par erreur, de sorte que le vrai nom du lieu s’est perdu. Stanley, citant Schwarz, signala dans les escarpements au sud de la plaine de Génésareth une grotte appelée Teliman ou Talmanutha, et W. Ewing écrivit que, si cela était vrai, cela désignerait un site près de ʿAïn el-Fuliyeh."
  pt:
    - "Dalmanuta é o lugar do mar da Galileia para onde Jesus atravessou depois de alimentar os quatro mil: “Imediatamente ele entrou no barco com seus discípulos e foi para a região de Dalmanuta.” Ali os fariseus saíram para exigir um sinal do céu. O nome não ocorre em nenhum outro lugar, na Bíblia ou fora dela. No paralelo, Mateus traz Magadã nos manuscritos mais antigos e Magdala no texto da King James, de modo que o lugar costuma ser procurado na margem oeste, perto de Magdala, onde o mapa o coloca."
    - "Nenhum sítio foi identificado com segurança. Mendel Nun propôs um pequeno ancoradouro logo ao norte de Magdala e sugeriu que o nome pode ser simplesmente a palavra aramaica para porto; Gordon Franz, ao descrever o próprio porto de Magdala, tomou-o igualmente como uma palavra siríaca para porto. Em 2013 Ken Dark relatou uma cidade romana até então desconhecida na planície de Genesaré, entre a atual Migdal e o lago, com cerâmica do século II ou I a.C. ao período bizantino, e sugeriu, a título provisório, que poderia ser Dalmanuta. Outros duvidam de que uma cidade com esse nome tenha existido."
    - "Os manuscritos de Marcos não concordam quanto ao nome: além de Dalmanuta, trazem Magedan, Melegada ou Magdala, e uma obra de referência moderna sugere que Magdala pode ser a leitura original. Eusébio, no início do século IV, lia Magedan tanto em Mateus como em Marcos e escreveu que um distrito chamado Magedane ficava em torno de Gerasa. J. Rendel Harris sustentou que Dalmanuta surgiu de uma palavra copiada duas vezes por engano, de modo que o verdadeiro nome do lugar se perdeu. Stanley, citando Schwarz, relatou uma caverna nas encostas a pique ao sul da planície de Genesaré chamada Teliman ou Talmanutha, e W. Ewing escreveu que, se isso fosse verdade, apontaria para um sítio perto de ʿAin el-Fuliyeh."
  it:
    - "Dalmanuta è il luogo sul mare di Galilea a cui Gesù passò dopo aver sfamato i quattromila: «subito, montato nella barca co’ suoi discepoli, andò dalle parti di Dalmanuta». Là i farisei uscirono a chiedere un segno dal cielo. Il nome non ricorre altrove, né nella Bibbia né fuori di essa. Nel passo parallelo Matteo ha Magadan nei manoscritti più antichi e Magdala nel testo della King James, perciò il luogo si cerca di solito sulla riva occidentale presso Magdala, dove lo colloca la carta."
    - "Nessun sito è stato identificato con sicurezza. Mendel Nun propose un piccolo approdo subito a nord di Magdala e suggerì che il nome possa essere semplicemente la parola aramaica per porto; Gordon Franz, descrivendo il porto di Magdala stessa, la intese ugualmente come una parola siriaca per porto. Nel 2013 Ken Dark riferì di una città romana finora non riconosciuta nella piana di Ghennesaret tra l’odierna Migdal e il lago, con ceramica dal II o I secolo a.C. al periodo bizantino, e suggerì, in via provvisoria, che potesse essere Dalmanuta. Altri dubitano che sia mai esistita una città con questo nome."
    - "I manoscritti di Marco non concordano sul nome: oltre a Dalmanuta leggono Magedan, Melegada o Magdala, e un’opera di consultazione moderna suggerisce che Magdala possa essere la lezione originaria. Eusebio, all’inizio del IV secolo, leggeva Magedan sia in Matteo sia in Marco e scriveva che un distretto chiamato Magedane si trovava intorno a Gerasa. J. Rendel Harris sostenne che Dalmanuta fosse nato da una parola copiata due volte per errore, sicché il vero nome del luogo è andato perduto. Stanley, citando Schwarz, riferì di una grotta nelle pareti a picco a sud della piana di Ghennesaret chiamata Teliman o Talmanutha, e W. Ewing scrisse che, se ciò fosse vero, indicherebbe un sito presso ʿAin el-Fuliyeh."
  nl:
    - "Dalmanuta is de plaats aan het Meer van Galilea waarheen Jezus overstak na de spijziging van de vierduizend: “terstond in het schip gegaan zijnde met Zijn discipelen, is Hij gekomen in de delen van Dalmanutha.” Daar kwamen de Farizeeën naar buiten om een teken uit de hemel te eisen. De naam komt nergens anders voor, in de Bijbel noch daarbuiten. In de parallel heeft Mattheüs in de oudste handschriften Magadan en in de tekst van de King James Version Magdala, zodat de plaats gewoonlijk aan de westoever bij Magdala wordt gezocht, waar de kaart haar zet."
    - "Geen plaats is met zekerheid geïdentificeerd. Mendel Nun stelde een kleine aanlegplaats net ten noorden van Magdala voor en suggereerde dat de naam eenvoudig het Aramese woord voor een haven kan zijn; Gordon Franz nam het, bij zijn beschrijving van Magdala's eigen haven, eveneens als een Syrisch woord voor haven. In 2013 meldde Ken Dark een voorheen niet herkende Romeinse stad in de vlakte van Ginosar tussen het moderne Migdal en het meer, met aardewerk van de tweede of eerste eeuw v.Chr. tot de Byzantijnse tijd, en suggereerde voorzichtig dat het Dalmanuta kon zijn. Anderen betwijfelen dat een stad met deze naam ooit heeft bestaan."
    - "De handschriften van Marcus zijn het over de naam niet eens: naast Dalmanuta lezen ze Magedan, Melegada of Magdala, en een modern naslagwerk acht Magdala mogelijk de oorspronkelijke lezing. Eusebius las in het begin van de vierde eeuw zowel bij Mattheüs als bij Marcus Magedan en schreef dat een gebied genaamd Magedane rond Gerasa lag. J. Rendel Harris betoogde dat Dalmanuta ontstond uit een woord dat per vergissing tweemaal was overgeschreven, zodat de echte plaatsnaam verloren ging. Stanley meldde, op gezag van Schwarz, een grot in de steile hellingen ten zuiden van de vlakte van Ginosar die Teliman of Talmanutha heette, en W. Ewing schreef dat dit, als het waar was, zou wijzen op een plaats bij ʿAin el-Fuliyeh."
  pl:
    - "Dalmanuta to miejsce nad Jeziorem Galilejskim, do którego Jezus przeprawił się po nakarmieniu czterech tysięcy: „A wnet wstąpiwszy w łódź z uczniami swoimi, przyszedł w strony Dalmanutskie”. Tam faryzeusze wyszli, by żądać znaku z nieba. Nazwa nie występuje nigdzie indziej, ani w Biblii, ani poza nią. W paralelnym fragmencie Mateusz ma w najstarszych rękopisach Magadan, a w tekście Biblii Króla Jakuba Magdalę, więc miejsca szuka się zwykle na zachodnim brzegu w pobliżu Magdali, gdzie umieszcza je mapa."
    - "Nie zidentyfikowano pewnie żadnego stanowiska. Mendel Nun zaproponował niewielką przystań tuż na północ od Magdali i przypuścił, że nazwa może po prostu być aramejskim słowem oznaczającym port; Gordon Franz, opisując port samej Magdali, uznał ją podobnie za syryjskie słowo oznaczające port. W 2013 roku Ken Dark doniósł o nierozpoznanym dotąd rzymskim mieście na równinie Genezaret między dzisiejszym Migdal a jeziorem, z ceramiką od II lub I w. p.n.e. do okresu bizantyjskiego, i zasugerował, ostrożnie, że może to być Dalmanuta. Inni wątpią, czy miasto o tej nazwie kiedykolwiek istniało."
    - "Rękopisy Ewangelii Marka nie zgadzają się co do nazwy: obok Dalmanuty mają Magedan, Melegada lub Magdala, a jedno współczesne dzieło encyklopedyczne dopuszcza, że pierwotną lekcją była Magdala. Euzebiusz na początku IV wieku czytał Magedan zarówno u Mateusza, jak i u Marka i pisał, że okolica zwana Magedane leży wokół Gerasy. J. Rendel Harris twierdził, że nazwa Dalmanuta powstała ze słowa omyłkowo przepisanego dwukrotnie, tak że prawdziwa nazwa miejsca zaginęła. Stanley, powołując się na Schwarza, doniósł o jaskini w urwiskach na południe od równiny Genezaret zwanej Teliman lub Talmanutha, a W. Ewing napisał, że jeśli to prawda, wskazywałoby to na miejsce koło ʿAin el-Fuliyeh."
  uk:
    - "Далмануфа — місце на Галілейському морі, куди Ісус переправився після нагодування чотирьох тисяч: «І, зараз увійшовши в човен з учениками своїми, прибув у сторони Далманутанські». Там вийшли фарисеї вимагати ознаки з неба. Назва не трапляється ніде більше, ні в Біблії, ні поза нею. У паралельному місці Матвій має Магадан у найдавніших рукописах і Магдалу в тексті короля Якова, тож місце зазвичай шукають на західному березі поблизу Магдали, де його й позначає мапа."
    - "Жодного місця надійно не ототожнено. Мендель Нун запропонував невелику якірну стоянку просто на північ від Магдали й припустив, що назва може бути просто арамейським словом для гавані; Гордон Франц, описуючи власну гавань Магдали, так само вважав її сирійським словом для гавані. 2013 р. Кен Дарк повідомив про досі не розпізнане римське місто на рівнині Гінносар між сучасним Мігдалем і озером, з керамікою від II чи I ст. до н. е. до візантійського періоду, і попередньо припустив, що це може бути Далмануфа. Інші сумніваються, що місто з такою назвою взагалі існувало."
    - "Рукописи Євангелія від Марка розходяться щодо назви: крім Далмануфи, вони мають Магедан, Мелегаду або Магдалу, і один сучасний довідник допускає, що первісним читанням була Магдала. Євсевій на початку IV ст. читав Магедан і в Матвія, і в Марка й писав, що край, званий Магедана, лежить довкола Гераси. Дж. Рендел Гарріс вважав, що назва Далмануфа постала зі слова, помилково переписаного двічі, тож справжня назва місця втрачена. Стенлі, посилаючись на Шварца, повідомив про печеру в урвищах на південь від рівнини Гінносар, звану Теліман або Талманута, а В. Юїнг писав, що, якщо це так, це вказувало б на місце поблизу Айн-ель-Фулійє."
  cs:
    - "Dalmanuta je místo na Galilejském jezeře, kam se Ježíš přeplavil po nasycení čtyř tisíc: „Potom hned vstoupiv na lodí s učedlníky svými, přeplavil se do krajin Dalmanutských.“ Tam vyšli farizeové žádat znamení z nebe. Jméno se jinde nevyskytuje, ani v Bibli, ani mimo ni. V paralelním místě má Matouš v nejstarších rukopisech Magadan a v textu Bible krále Jakuba Magdalu, takže se místo obvykle hledá na západním břehu poblíž Magdaly, kam je klade mapa."
    - "Žádné místo nebylo spolehlivě určeno. Mendel Nun navrhl malé kotviště těsně severně od Magdaly a naznačil, že jméno může být prostě aramejské slovo pro přístav; Gordon Franz, popisující vlastní přístav Magdaly, je rovněž pokládal za syrské slovo pro přístav. Roku 2013 oznámil Ken Dark dosud nerozpoznané římské město na Genezaretské rovině mezi dnešním Migdalem a jezerem, s keramikou od druhého nebo prvního století př. n. l. do byzantského období, a navrhl, váhavě, že by mohlo jít o Dalmanutu. Jiní pochybují, že město tohoto jména kdy existovalo."
    - "Rukopisy Markova evangelia se ve jménu neshodují: vedle Dalmanuty čtou Magedan, Melegada nebo Magdala a jedna moderní příručka připouští, že původním čtením byla Magdala. Eusebios na počátku čtvrtého století četl Magedan u Matouše i u Marka a psal, že kraj zvaný Magedane leží kolem Gerasy. J. Rendel Harris tvrdil, že jméno Dalmanuta vzniklo ze slova omylem opsaného dvakrát, takže skutečné jméno místa se ztratilo. Stanley s odvoláním na Schwarze uvedl jeskyni ve srázech jižně od Genezaretské roviny zvanou Teliman nebo Talmanutha a W. Ewing napsal, že pokud je to pravda, ukazovalo by to na místo poblíž ʿAin el-Fuliyeh."
  es:
    - "Dalmanuta es el lugar del mar de Galilea al que Jesús cruzó después de alimentar a los cuatro mil: «Y luego entrando en el barco con sus discípulos, vino á las partes de Dalmanutha». Allí salieron los fariseos a pedir una señal del cielo. El nombre no aparece en ningún otro lugar, ni en la Biblia ni fuera de ella. En el pasaje paralelo, Mateo tiene Magadán en los manuscritos más antiguos y Magdala en el texto de la King James, de modo que el lugar suele buscarse en la orilla occidental cerca de Magdala, donde lo sitúa el mapa."
    - "Ningún sitio ha sido identificado con seguridad. Mendel Nun propuso un pequeño fondeadero justo al norte de Magdala y sugirió que el nombre podría ser simplemente la palabra aramea para puerto; Gordon Franz, al describir el puerto de la propia Magdala, la tomó igualmente por una palabra siríaca para puerto. En 2013 Ken Dark informó de una ciudad romana antes no reconocida en la llanura de Ginosar, entre la actual Migdal y el lago, con cerámica desde el siglo II o I a. C. hasta el período bizantino, y sugirió, con cautela, que podría ser Dalmanuta. Otros dudan de que existiera jamás una ciudad con este nombre."
    - "Los manuscritos de Marcos no coinciden en el nombre: además de Dalmanuta, leen Magedan, Melegada o Magdala, y una obra de referencia moderna sugiere que Magdala pudo ser la lectura original. Eusebio, a comienzos del siglo IV, leía Magedan tanto en Mateo como en Marcos y escribió que un distrito llamado Magedane se encontraba en torno a Gerasa. J. Rendel Harris sostuvo que Dalmanuta surgió de una palabra copiada dos veces por error, de modo que el verdadero nombre del lugar se perdió. Stanley, citando a Schwarz, informó de una cueva en los escarpes al sur de la llanura de Ginosar llamada Teliman o Talmanutha, y W. Ewing escribió que, si esto era cierto, apuntaría a un sitio cerca de ʿAin el-Fuliyeh."
  sv:
    - "Dalmanuta är platsen vid Galileiska sjön dit Jesus for över efter att ha mättat de fyra tusen: ”Och strax därefter steg han i båten med sina lärjungar och for till trakten av Dalmanuta.” Där kom fariséerna ut för att kräva ett tecken från himlen. Namnet förekommer ingen annanstans, vare sig i Bibeln eller utanför den. I den parallella texten har Matteus Magadan i de äldsta handskrifterna och Magdala i King James-texten, så platsen söks vanligen på västra stranden nära Magdala, där kartan sätter den."
    - "Ingen plats har säkert identifierats. Mendel Nun föreslog en liten ankarplats strax norr om Magdala och antydde att namnet helt enkelt kan vara det arameiska ordet för hamn; Gordon Franz, som beskrev Magdalas egen hamn, tog det likaså som ett syriskt ord för hamn. År 2013 rapporterade Ken Dark en tidigare okänd romersk stad på Ginosarslätten mellan nuvarande Migdal och sjön, med keramik från andra eller första århundradet f.Kr. till bysantinsk tid, och föreslog, försiktigt, att den kunde vara Dalmanuta. Andra betvivlar att en stad med detta namn någonsin funnits."
    - "Handskrifterna av Markus är inte eniga om namnet: förutom Dalmanuta läser de Magedan, Melegada eller Magdala, och ett modernt uppslagsverk menar att Magdala kan vara den ursprungliga läsarten. Eusebios läste i början av 300-talet Magedan hos både Matteus och Markus och skrev att ett område kallat Magedane låg kring Gerasa. J. Rendel Harris hävdade att Dalmanuta uppstod ur ett ord som av misstag skrivits av två gånger, så att det verkliga ortnamnet gick förlorat. Stanley rapporterade med hänvisning till Schwarz en grotta i branterna söder om Ginosarslätten som kallades Teliman eller Talmanutha, och W. Ewing skrev att detta, om det stämde, skulle peka på en plats nära ʿAin el-Fuliyeh."
  nb:
    - "Dalmanuta er stedet ved Galileasjøen som Jesus krysset til etter at han hadde mettet de fire tusen: «Og straks gikk han ut i båten med sine disipler, og kom til landet ved Dalmanuta.» Der kom fariseerne ut for å kreve et tegn fra himmelen. Navnet forekommer ikke noe annet sted, verken i Bibelen eller utenfor. I den parallelle teksten har Matteus Magadan i de eldste håndskriftene og Magdala i King James-teksten, så stedet søkes vanligvis på vestkysten nær Magdala, der kartet setter det."
    - "Ingen plass er sikkert identifisert. Mendel Nun foreslo en liten ankerplass like nord for Magdala og antydet at navnet kan være det arameiske ordet for en havn; Gordon Franz, som beskriver Magdalas egen havn, tok det likeledes som et syrisk ord for havn. I 2013 rapporterte Ken Dark om en tidligere ukjent romersk by på Ginosar-sletten mellom dagens Migdal og sjøen, med keramikk fra 100- eller det første århundre f.Kr. til den bysantinske perioden, og antydet, forsiktig, at det kan være Dalmanuta. Andre tviler på at en by med dette navnet noen gang fantes."
    - "Håndskriftene av Markus er ikke enige om navnet: ved siden av Dalmanuta har de Magedan, Melegada eller Magdala, og et moderne oppslagsverk mener at Magdala kan være den opprinnelige lesemåten. Eusebios leste i begynnelsen av 300-tallet Magedan hos både Matteus og Markus og skrev at et område kalt Magedane lå rundt Gerasa. J. Rendel Harris hevdet at Dalmanuta oppsto av et ord som ved en feil ble skrevet av to ganger, slik at det virkelige stedsnavnet gikk tapt. Stanley meldte, med henvisning til Schwarz, om en hule i bratthengene sør for Ginosar-sletten som ble kalt Teliman eller Talmanutha, og W. Ewing skrev at dette, hvis det stemte, ville peke mot et sted nær ʿAin el-Fuliyeh."
  tl:
    - "Ang Dalmanuta ay ang pook sa Dagat ng Galilea na tinawiran ni Jesus pagkatapos pakainin ang apat na libo: “pagdaka'y lumulan siya sa daong na kasama ang kaniyang mga alagad, at napasa mga sakop ng Dalmanuta.” Doon lumabas ang mga Fariseo upang humingi ng tanda mula sa langit. Wala nang ibang lugar na binabanggit ang pangalan, sa Bibliya man o sa labas nito. Sa kahalintulad na talata, may Magadan si Mateo sa pinakamatatandang manuskrito at Magdala sa tekstong King James, kaya karaniwang hinahanap ang pook sa kanlurang baybayin malapit sa Magdala, kung saan ito inilalagay ng mapa."
    - "Wala pang tiyak na natukoy na pook. Iminungkahi ni Mendel Nun ang isang maliit na daungan sa hilaga lamang ng Magdala at ipinalagay na ang pangalan ay maaaring salitang Aramaiko lamang para sa daungan; si Gordon Franz, sa paglalarawan niya sa sariling daungan ng Magdala, ay itinuring din itong salitang Siriaco para sa daungan. Noong 2013, iniulat ni Ken Dark ang dating hindi kilalang bayang Romano sa kapatagan ng Ginosar sa pagitan ng makabagong Migdal at ng lawa, na may palayok mula ika-2 o ika-1 siglo BK hanggang panahong Bizantino, at iminungkahi, nang may pag-aalinlangan, na maaaring ito ang Dalmanuta. Pinagdududahan ng iba na may bayang ganito ang pangalan kailanman."
    - "Hindi nagkakaisa ang mga manuskrito ni Marcos sa pangalan: bukod sa Dalmanuta, mababasa sa mga ito ang Magedan, Melegada o Magdala, at isang makabagong sangguniang akda ang nagmumungkahing maaaring Magdala ang orihinal na basa. Noong unang bahagi ng ika-4 na siglo, nabasa ni Eusebio ang Magedan kapwa kay Mateo at kay Marcos at isinulat niyang may distritong tinatawag na Magedane sa palibot ng Gerasa. Ikinatwiran ni J. Rendel Harris na nagmula ang Dalmanuta sa isang salitang nakopya nang dalawang ulit dahil sa pagkakamali, kaya nawala ang tunay na pangalan ng pook. Iniulat ni Stanley, batay kay Schwarz, ang isang yungib sa matatarik na dalisdis sa timog ng kapatagan ng Ginosar na tinatawag na Teliman o Talmanutha, at isinulat ni W. Ewing na, kung totoo ito, ituturo nito ang isang pook malapit sa ʿAin el-Fuliyeh."
  da:
    - "Dalmanuta er stedet ved Genesaret Sø, som Jesus krydsede til efter mættelsen af de fire tusinde: »straks gik han om Bord i Skibet med sine Disciple og kom til Dalmanuthas Egne«. Dér kom farisæerne ud for at kræve et tegn fra himlen. Navnet findes ingen andre steder, hverken i Bibelen eller uden for den. I den parallelle beretning har Mattæus Magadan i de ældste håndskrifter og Magdala i King James-teksten, så stedet søges sædvanligvis på vestkysten nær Magdala, hvor kortet placerer det."
    - "Intet sted er sikkert identificeret. Mendel Nun foreslog en lille ankerplads lige nord for Magdala og antydede, at navnet blot kan være det aramæiske ord for en havn; Gordon Franz, der beskrev Magdalas egen havn, tog det ligeledes som et syrisk ord for havn. I 2013 rapporterede Ken Dark om en tidligere uopdaget romersk by på Ginosar-sletten mellem nutidens Migdal og søen, med keramik fra 2. eller 1. århundrede f.Kr. til den byzantinske tid, og foreslog forsigtigt, at den kunne være Dalmanuta. Andre betvivler, at en by med dette navn nogensinde har eksisteret."
    - "Håndskrifterne af Markus er ikke enige om navnet: ud over Dalmanuta har de Magedan, Melegada eller Magdala, og et moderne opslagsværk mener, at Magdala kan være den oprindelige læsemåde. Eusebios læste i begyndelsen af 300-tallet Magedan hos både Mattæus og Markus og skrev, at et område kaldet Magedane lå omkring Gerasa. J. Rendel Harris hævdede, at Dalmanuta opstod af et ord, der ved en fejl var skrevet af to gange, så det virkelige stednavn gik tabt. Stanley berettede med henvisning til Schwarz om en hule i skrænterne syd for Ginosar-sletten, kaldet Teliman eller Talmanutha, og W. Ewing skrev, at dette, hvis det var sandt, ville pege på et sted nær ʿAin el-Fuliyeh."
  sr:
    - "Далманута је место на Галилејском мору куда је Исус прешао после хране за четири хиљаде: „И одмах уђе у лађу с ученицима својим, и дође у околине далманутске“. Тамо су изашли фарисеји да траже знак с неба. Име се нигде другде не јавља, ни у Библији ни изван ње. У паралелном одломку Матеј у најстаријим рукописима има Магадан, а у тексту Краља Џејмса Магдалу, па се место обично тражи на западној обали близу Магдале, где га карта и смешта."
    - "Ниједно налазиште није поуздано утврђено. Мендел Нун предложио је мало пристаниште одмах северно од Магдале и претпоставио да је име можда једноставно арамејска реч за луку; Гордон Франц, описујући саму луку Магдале, такође је узео да је то сиријска реч за луку. Кен Дарк је 2013. пријавио до тада непризнат римски град на равници Гиносар између данашњег Мигдала и језера, с керамиком од 2. или 1. века п. н. е. до византијског периода, и пробно предложио да би могао бити Далманута. Други сумњају да је град тог имена икада постојао."
    - "Рукописи Јеванђеља по Марку не слажу се у имену: поред Далмануте имају Магедан, Мелегаду или Магдалу, а један савремени приручник допушта да је изворно читање била Магдала. Јевсевије је почетком 4. века читао Магедан и код Матеја и код Марка и писао да се област звана Магедана налази око Герасе. Џ. Рендел Харис је тврдио да је Далманута настала од речи грешком преписане двапут, тако да се право име места изгубило. Стенли је, позивајући се на Шварца, јавио о пећини у литицама јужно од равнице Гиносар званој Телиман или Талманута, а В. Јуинг је писао да би то, ако је тачно, упућивало на место близу Ајн ел-Фулије."
  hu:
    - "Dalmanuta az a hely a Galileai-tenger partján, ahová Jézus a négyezer megvendégelése után átkelt: „És azonnal a hajóba szálla tanítványaival, és méne Dalmánuta vidékére.” Ott jöttek ki a farizeusok, hogy mennyei jelet követeljenek. A név máshol nem fordul elő, sem a Bibliában, sem azon kívül. A párhuzamos helyen Máténál a legrégebbi kéziratokban Magadán, a King James-szövegben Magdala áll, ezért a helyet rendszerint a nyugati parton, Magdala közelében keresik, ahová a térkép is teszi."
    - "Egyetlen helyet sem azonosítottak biztosan. Mendel Nun egy Magdalától közvetlenül északra fekvő kis kikötőhelyet javasolt, és azt gondolta, hogy a név egyszerűen a kikötő arámi szava lehet; Gordon Franz Magdala saját kikötőjét leírva ugyancsak a kikötő szír szavának vette. 2013-ban Ken Dark egy addig fel nem ismert római városról számolt be a Ginosar-síkságon, a mai Migdal és a tó között, a Kr. e. 2. vagy 1. századtól a bizánci korig terjedő kerámiával, és óvatosan azt vetette fel, hogy ez lehet Dalmanuta. Mások kétlik, hogy ilyen nevű város valaha létezett."
    - "Márk evangéliumának kéziratai nem egyeznek a névben: Dalmanuta mellett Magedan, Melegada vagy Magdala áll bennük, és egy modern kézikönyv szerint Magdala lehet az eredeti olvasat. Eusebius a 4. század elején Máténál és Márknál is Magedant olvasott, és azt írta, hogy egy Magedané nevű vidék Gerasa körül fekszik. J. Rendel Harris szerint a Dalmanuta név egy tévedésből kétszer lemásolt szóból keletkezett, így a hely valódi neve elveszett. Stanley Schwarzra hivatkozva beszámolt egy barlangról a Ginosar-síkságtól délre eső meredek lejtőkön, amelyet Telimannak vagy Talmanuthának neveztek, és W. Ewing azt írta, hogy ha ez igaz, egy ʿAin el-Fuliyeh melletti helyre utalna."
  fi:
    - "Dalmanuta on paikka Galileanjärvellä, jonne Jeesus ylitti ruokittuaan neljätuhatta: ”Ja kohta hän astui opetuslapsineen venheeseen ja meni Dalmanutan seuduille.” Siellä fariseukset tulivat vaatimaan merkkiä taivaasta. Nimi ei esiinny muualla, ei Raamatussa eikä sen ulkopuolella. Rinnakkaiskohdassa Matteuksella on vanhimmissa käsikirjoituksissa Magadan ja King James -tekstissä Magdala, joten paikkaa etsitään yleensä läntiseltä rannalta Magdalan läheltä, mihin kartta sen sijoittaa."
    - "Mitään paikkaa ei ole varmuudella tunnistettu. Mendel Nun ehdotti pientä ankkuripaikkaa aivan Magdalan pohjoispuolella ja esitti, että nimi voi olla yksinkertaisesti aramean sana satamalle; Gordon Franz, kuvatessaan Magdalan omaa satamaa, piti sitä niin ikään syyrian satamaa tarkoittavana sanana. Vuonna 2013 Ken Dark raportoi aiemmin tunnistamattomasta roomalaisesta kaupungista Ginosarin tasangolla nykyisen Migdalin ja järven välissä, keramiikkaa toiselta tai ensimmäiseltä vuosisadalta eaa. bysanttilaiselle ajalle, ja esitti varovaisesti, että se voisi olla Dalmanuta. Toiset epäilevät, että tämännimistä kaupunkia on koskaan ollut."
    - "Markuksen käsikirjoitukset eivät ole yksimielisiä nimestä: Dalmanutan lisäksi niissä on Magedan, Melegada tai Magdala, ja eräs nykyinen hakuteos arvelee Magdalan voivan olla alkuperäinen lukutapa. Eusebios luki 300-luvun alussa Magedan sekä Matteukselta että Markukselta ja kirjoitti, että Magedane-niminen seutu sijaitsi Gerasan ympärillä. J. Rendel Harris esitti, että Dalmanuta syntyi sanasta, joka oli erehdyksessä kopioitu kahdesti, joten paikan oikea nimi katosi. Stanley kertoi Schwarziin viitaten luolasta Ginosarin tasangon eteläpuolisilla jyrkänteillä, jota kutsuttiin nimellä Teliman tai Talmanutha, ja W. Ewing kirjoitti, että jos tämä piti paikkansa, se viittaisi paikkaan ʿAin el-Fuliyehin lähellä."
  vi:
    - "Đa-ma-nu-tha là nơi trên Biển Ga-li-lê mà Giê-su sang đến sau khi nuôi bốn ngàn người: “rồi liền vào thuyền với môn đồ, sang xứ Đa-ma-nu-tha.” Tại đó người Pha-ri-si ra đòi một dấu lạ từ trời. Tên này không xuất hiện ở chỗ nào khác, trong Kinh Thánh hay ngoài Kinh Thánh. Ở đoạn song song, Ma-thi-ơ có Ma-ga-đan trong các bản chép tay xưa nhất và Magdala trong bản văn King James, nên người ta thường tìm nơi này ở bờ tây gần Magdala, nơi bản đồ đặt nó."
    - "Chưa xác định chắc chắn được địa điểm nào. Mendel Nun đề nghị một bến neo nhỏ ngay phía bắc Magdala và gợi ý rằng tên này có thể chỉ đơn giản là từ A-ram chỉ bến cảng; Gordon Franz, khi mô tả bến cảng của chính Magdala, cũng coi nó là một từ Syriac chỉ bến cảng. Năm 2013, Ken Dark báo cáo về một thị trấn La Mã trước đây chưa được nhận ra trên đồng bằng Ginosar giữa Migdal ngày nay và hồ, với đồ gốm từ thế kỷ 2 hoặc 1 TCN đến thời Byzantine, và gợi ý, một cách dè dặt, rằng nó có thể là Đa-ma-nu-tha. Những người khác nghi ngờ rằng từng có một thị trấn mang tên này."
    - "Các bản chép tay sách Mác không thống nhất về tên này: ngoài Đa-ma-nu-tha, chúng ghi Magedan, Melegada hoặc Magdala, và một sách tham khảo hiện đại cho rằng Magdala có thể là cách đọc nguyên thủy. Đầu thế kỷ 4, Eusebius đọc thấy Magedan ở cả Ma-thi-ơ lẫn Mác và viết rằng một vùng gọi là Magedane nằm quanh Giê-ra-sê. J. Rendel Harris lập luận rằng tên Đa-ma-nu-tha nảy sinh từ một chữ bị chép lặp hai lần do nhầm lẫn, khiến tên thật của nơi này bị mất. Stanley, dẫn lời Schwarz, thuật lại một hang động trên các vách dốc phía nam đồng bằng Ginosar gọi là Teliman hay Talmanutha, và W. Ewing viết rằng, nếu điều này đúng, nó sẽ chỉ về một địa điểm gần ʿAin el-Fuliyeh."
  ro:
    - "Dalmanuta este locul de pe Marea Galileii în care a trecut Isus după ce i-a hrănit pe cei patru mii: „îndată intrând în corabie cu ucenicii săi, au venit în părțile Dalmanutei”. Acolo au ieșit fariseii să ceară un semn din cer. Numele nu apare nicăieri altundeva, nici în Biblie, nici în afara ei. În paralela de la Matei se găsește Magadan în cele mai vechi manuscrise și Magdala în textul King James, de aceea locul este căutat de obicei pe malul de vest, lângă Magdala, unde îl așază harta."
    - "Niciun loc nu a fost identificat cu siguranță. Mendel Nun a propus un mic ancoraj chiar la nord de Magdala și a sugerat că numele ar putea fi pur și simplu cuvântul arameic pentru port; Gordon Franz, descriind portul Magdalei, l-a socotit la fel un cuvânt siriac pentru port. În 2013, Ken Dark a raportat o cetate romană necunoscută până atunci pe câmpia Ghenazaretului, între Migdal-ul de azi și lac, cu ceramică din secolul al II-lea sau I î.Hr. până în perioada bizantină, și a sugerat, cu prudență, că ar putea fi Dalmanuta. Alții se îndoiesc că a existat vreodată o cetate cu acest nume."
    - "Manuscrisele Evangheliei după Marcu nu cad de acord asupra numelui: pe lângă Dalmanuta, ele au Magedan, Melegada sau Magdala, iar o lucrare de referință modernă sugerează că Magdala ar putea fi lecțiunea originală. Eusebiu, la începutul secolului al IV-lea, citea Magedan atât la Matei, cât și la Marcu și scria că un ținut numit Magedane se afla în jurul Gherasei. J. Rendel Harris a susținut că Dalmanuta a apărut dintr-un cuvânt copiat de două ori din greșeală, astfel că adevăratul nume al locului s-a pierdut. Stanley, citându-l pe Schwarz, a semnalat o peșteră în pantele abrupte de la sud de câmpia Ghenazaretului numită Teliman sau Talmanutha, iar W. Ewing a scris că, dacă acest lucru era adevărat, ar indica un loc lângă ʿAin el-Fuliyeh."
  bg:
    - "Далмануфа е мястото на Галилейското езеро, където Исус преминал след нахранването на четирите хиляди: „И тутакси влезе в ладията с учениците си, и дойде в Далманутанските страни.“ Там фарисеите излезли да искат от него знамение от небето. Името не се среща никъде другаде, нито в Библията, нито извън нея. В успоредното място у Матей най-старите ръкописи имат Магадан, а текстът на крал Джеймс — Магдала, затова мястото обикновено се търси на западния бряг близо до Магдала, където го поставя картата."
    - "Никое място не е сигурно отъждествено. Мендел Нун предложил малко котвено място точно северно от Магдала и предположил, че името може да е просто арамейската дума за пристанище; Гордън Франц, описвайки собственото пристанище на Магдала, също го приел за сирийска дума за пристанище. През 2013 г. Кен Дарк съобщил за неизвестен дотогава римски град в равнината Гиносар между днешния Мигдал и езерото, с керамика от II или I в. пр.н.е. до византийския период, и предпазливо предположил, че това може да е Далмануфа. Други се съмняват, че град с такова име изобщо е съществувал."
    - "Ръкописите на Евангелието от Марк не са единни за името: освен Далмануфа те имат Магедан, Мелегада или Магдала, а едно съвременно справочно издание допуска, че първоначалното четене е било Магдала. Евсевий в началото на IV в. чел Магедан и у Матей, и у Марк и писал, че област, наречена Магедана, се намира около Гераса. Дж. Рендел Харис смятал, че името Далмануфа е възникнало от дума, по погрешка преписана два пъти, така че истинското име на мястото е изгубено. Стенли, позовавайки се на Шварц, съобщил за пещера в стръмните склонове южно от равнината Гиносар, наречена Телиман или Талманута, а У. Юинг писал, че ако това е вярно, то би сочило място близо до Айн ел-Фулийе."
scripture:
  - Mark.8.9
  - Mark.8.10
  - Mark.8.11
