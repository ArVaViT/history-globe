# Overview article (ADR 0007). Dalmanutha is unlocated: Magdala or its harbour (Mendel Nun, Gordon Franz), the Ginosar settlement (Ken Dark 2013, tentative), and the view that it is not a place name at all are shown without choosing; the map's point is with Magadan.
