body:
  en:
    - "Dalmanutha is the place on the Sea of Galilee to which Jesus crossed after feeding the four thousand: “straightway he entered into a ship with his disciples, and came into the parts of Dalmanutha.” There the Pharisees came out to demand a sign from heaven. The name occurs nowhere else, in the Bible or outside it. In the parallel Matthew has Magadan in the oldest manuscripts and Magdala in the King James text, so the place is usually sought on the western shore near Magdala, where the map sets it."
    - "No site has been securely identified. Mendel Nun proposed a small anchorage just north of Magdala and suggested that the name may simply be the Aramaic word for a harbour; Gordon Franz, describing Magdala's own harbour, likewise took it as a Syriac word for harbour. In 2013 Ken Dark reported a previously unrecognised Roman town on the Ginosar plain between modern Migdal and the lake, with pottery from the second or first century BC to the Byzantine period, and suggested, tentatively, that it might be Dalmanutha. Others doubt that a town of this name ever existed."
  ru:
    - "Далмануфа — место на море Галилейском, куда Иисус переправился после насыщения четырёх тысяч: «тотчас войдя в лодку с учениками Своими, прибыл в пределы Далмануфские». Там фарисеи вышли требовать от Него знамения с неба. Имя больше нигде не встречается — ни в Библии, ни вне её. В параллельном месте у Матфея древнейшие рукописи читают Магадан, а Синодальный перевод — «пределы Магдалинские», поэтому место обычно ищут на западном берегу у Магдалы, где его и ставит карта."
    - "Надёжно отождествить его не удалось. Мендель Нун предложил небольшую стоянку судов сразу к северу от Магдалы и предположил, что имя — просто арамейское слово со значением «гавань»; Гордон Франц, описывая гавань самой Магдалы, тоже видел в нём сирийское слово «гавань». В 2013 г. Кен Дарк сообщил о прежде не замеченном римском городе на равнине Геннисарет между нынешним Мигдалем и озером, с керамикой от II–I вв. до н. э. до византийского времени, и осторожно предположил, что это может быть Далмануфа. Другие сомневаются, что город с таким названием вообще существовал."
  de:
    - "Dalmanuta ist der Ort am See Genezareth, zu dem Jesus nach der Speisung der Viertausend hinüberfuhr: „Und alsbald trat er in ein Schiff mit seinen Jüngern und kam in die Gegend von Dalmanutha.“ Dort kamen die Pharisäer heraus und forderten ein Zeichen vom Himmel. Der Name kommt nirgends sonst vor, weder in der Bibel noch außerhalb. In der Parallelstelle hat Matthäus in den ältesten Handschriften Magadan und im Text der King-James-Bibel Magdala, sodass der Ort gewöhnlich am Westufer nahe Magdala gesucht wird, wo ihn die Karte ansetzt."
    - "Keine Stätte ist sicher bestimmt. Mendel Nun schlug einen kleinen Ankerplatz unmittelbar nördlich von Magdala vor und meinte, der Name könne einfach das aramäische Wort für einen Hafen sein; Gordon Franz, der Magdalas eigenen Hafen beschrieb, hielt ihn ebenfalls für ein syrisches Wort für Hafen. 2013 berichtete Ken Dark von einer bisher unerkannten römischen Stadt in der Ebene Genezareth zwischen dem heutigen Migdal und dem See, mit Keramik vom zweiten oder ersten Jahrhundert v. Chr. bis in die byzantinische Zeit, und meinte vorsichtig, es könne Dalmanuta sein. Andere bezweifeln, dass es je eine Stadt dieses Namens gab."
  fr:
    - "Dalmanutha est le lieu de la mer de Galilée où Jésus passa après avoir nourri les quatre mille : « Aussitôt il monta dans la barque avec ses disciples, et se rendit dans la contrée de Dalmanutha. » Les pharisiens y vinrent lui demander un signe venant du ciel. Le nom ne se rencontre nulle part ailleurs, dans la Bible ou hors d’elle. Dans le passage parallèle, Matthieu porte Magadan dans les plus anciens manuscrits et Magdala dans le texte de la version du roi Jacques, si bien que le lieu est d’ordinaire cherché sur la rive occidentale près de Magdala, où la carte le place."
    - "Aucun site n’a été identifié avec certitude. Mendel Nun proposa un petit mouillage juste au nord de Magdala et suggéra que le nom pourrait n’être que le mot araméen pour un port ; Gordon Franz, décrivant le port même de Magdala, y vit de même un mot syriaque pour port. En 2013, Ken Dark signala une ville romaine jusque-là inconnue dans la plaine de Génésareth entre l’actuelle Migdal et le lac, avec de la céramique du IIe ou du Ier siècle av. J.-C. jusqu’à l’époque byzantine, et suggéra, avec prudence, qu’elle pourrait être Dalmanutha. D’autres doutent qu’une ville de ce nom ait jamais existé."
  pt:
    - "Dalmanuta é o lugar do mar da Galileia para onde Jesus atravessou depois de alimentar os quatro mil: “Imediatamente ele entrou no barco com seus discípulos e foi para a região de Dalmanuta.” Ali os fariseus saíram para exigir um sinal do céu. O nome não ocorre em nenhum outro lugar, na Bíblia ou fora dela. No paralelo, Mateus traz Magadã nos manuscritos mais antigos e Magdala no texto da King James, de modo que o lugar costuma ser procurado na margem oeste, perto de Magdala, onde o mapa o coloca."
    - "Nenhum sítio foi identificado com segurança. Mendel Nun propôs um pequeno ancoradouro logo ao norte de Magdala e sugeriu que o nome pode ser simplesmente a palavra aramaica para porto; Gordon Franz, ao descrever o próprio porto de Magdala, tomou-o igualmente como uma palavra siríaca para porto. Em 2013 Ken Dark relatou uma cidade romana até então desconhecida na planície de Genesaré, entre a atual Migdal e o lago, com cerâmica do século II ou I a.C. ao período bizantino, e sugeriu, a título provisório, que poderia ser Dalmanuta. Outros duvidam de que uma cidade com esse nome tenha existido."
  it:
    - "Dalmanuta è il luogo sul mare di Galilea a cui Gesù passò dopo aver sfamato i quattromila: «subito, montato nella barca co’ suoi discepoli, andò dalle parti di Dalmanuta». Là i farisei uscirono a chiedere un segno dal cielo. Il nome non ricorre altrove, né nella Bibbia né fuori di essa. Nel passo parallelo Matteo ha Magadan nei manoscritti più antichi e Magdala nel testo della King James, perciò il luogo si cerca di solito sulla riva occidentale presso Magdala, dove lo colloca la carta."
    - "Nessun sito è stato identificato con sicurezza. Mendel Nun propose un piccolo approdo subito a nord di Magdala e suggerì che il nome possa essere semplicemente la parola aramaica per porto; Gordon Franz, descrivendo il porto di Magdala stessa, la intese ugualmente come una parola siriaca per porto. Nel 2013 Ken Dark riferì di una città romana finora non riconosciuta nella piana di Ghennesaret tra l’odierna Migdal e il lago, con ceramica dal II o I secolo a.C. al periodo bizantino, e suggerì, in via provvisoria, che potesse essere Dalmanuta. Altri dubitano che sia mai esistita una città con questo nome."
  nl:
    - "Dalmanuta is de plaats aan het Meer van Galilea waarheen Jezus overstak na de spijziging van de vierduizend: “terstond in het schip gegaan zijnde met Zijn discipelen, is Hij gekomen in de delen van Dalmanutha.” Daar kwamen de Farizeeën naar buiten om een teken uit de hemel te eisen. De naam komt nergens anders voor, in de Bijbel noch daarbuiten. In de parallel heeft Mattheüs in de oudste handschriften Magadan en in de tekst van de King James Version Magdala, zodat de plaats gewoonlijk aan de westoever bij Magdala wordt gezocht, waar de kaart haar zet."
    - "Geen plaats is met zekerheid geïdentificeerd. Mendel Nun stelde een kleine aanlegplaats net ten noorden van Magdala voor en suggereerde dat de naam eenvoudig het Aramese woord voor een haven kan zijn; Gordon Franz nam het, bij zijn beschrijving van Magdala's eigen haven, eveneens als een Syrisch woord voor haven. In 2013 meldde Ken Dark een voorheen niet herkende Romeinse stad in de vlakte van Ginosar tussen het moderne Migdal en het meer, met aardewerk van de tweede of eerste eeuw v.Chr. tot de Byzantijnse tijd, en suggereerde voorzichtig dat het Dalmanuta kon zijn. Anderen betwijfelen dat een stad met deze naam ooit heeft bestaan."
  pl:
    - "Dalmanuta to miejsce nad Jeziorem Galilejskim, do którego Jezus przeprawił się po nakarmieniu czterech tysięcy: „A wnet wstąpiwszy w łódź z uczniami swoimi, przyszedł w strony Dalmanutskie”. Tam faryzeusze wyszli, by żądać znaku z nieba. Nazwa nie występuje nigdzie indziej, ani w Biblii, ani poza nią. W paralelnym fragmencie Mateusz ma w najstarszych rękopisach Magadan, a w tekście Biblii Króla Jakuba Magdalę, więc miejsca szuka się zwykle na zachodnim brzegu w pobliżu Magdali, gdzie umieszcza je mapa."
    - "Nie zidentyfikowano pewnie żadnego stanowiska. Mendel Nun zaproponował niewielką przystań tuż na północ od Magdali i przypuścił, że nazwa może po prostu być aramejskim słowem oznaczającym port; Gordon Franz, opisując port samej Magdali, uznał ją podobnie za syryjskie słowo oznaczające port. W 2013 roku Ken Dark doniósł o nierozpoznanym dotąd rzymskim mieście na równinie Genezaret między dzisiejszym Migdal a jeziorem, z ceramiką od II lub I w. p.n.e. do okresu bizantyjskiego, i zasugerował, ostrożnie, że może to być Dalmanuta. Inni wątpią, czy miasto o tej nazwie kiedykolwiek istniało."
  uk:
    - "Далмануфа — місце на Галілейському морі, куди Ісус переправився після нагодування чотирьох тисяч: «І, зараз увійшовши в човен з учениками своїми, прибув у сторони Далманутанські». Там вийшли фарисеї вимагати ознаки з неба. Назва не трапляється ніде більше, ні в Біблії, ні поза нею. У паралельному місці Матвій має Магадан у найдавніших рукописах і Магдалу в тексті короля Якова, тож місце зазвичай шукають на західному березі поблизу Магдали, де його й позначає мапа."
    - "Жодного місця надійно не ототожнено. Мендель Нун запропонував невелику якірну стоянку просто на північ від Магдали й припустив, що назва може бути просто арамейським словом для гавані; Гордон Франц, описуючи власну гавань Магдали, так само вважав її сирійським словом для гавані. 2013 р. Кен Дарк повідомив про досі не розпізнане римське місто на рівнині Гінносар між сучасним Мігдалем і озером, з керамікою від II чи I ст. до н. е. до візантійського періоду, і попередньо припустив, що це може бути Далмануфа. Інші сумніваються, що місто з такою назвою взагалі існувало."
  cs:
    - "Dalmanuta je místo na Galilejském jezeře, kam se Ježíš přeplavil po nasycení čtyř tisíc: „Potom hned vstoupiv na lodí s učedlníky svými, přeplavil se do krajin Dalmanutských.“ Tam vyšli farizeové žádat znamení z nebe. Jméno se jinde nevyskytuje, ani v Bibli, ani mimo ni. V paralelním místě má Matouš v nejstarších rukopisech Magadan a v textu Bible krále Jakuba Magdalu, takže se místo obvykle hledá na západním břehu poblíž Magdaly, kam je klade mapa."
    - "Žádné místo nebylo spolehlivě určeno. Mendel Nun navrhl malé kotviště těsně severně od Magdaly a naznačil, že jméno může být prostě aramejské slovo pro přístav; Gordon Franz, popisující vlastní přístav Magdaly, je rovněž pokládal za syrské slovo pro přístav. Roku 2013 oznámil Ken Dark dosud nerozpoznané římské město na Genezaretské rovině mezi dnešním Migdalem a jezerem, s keramikou od druhého nebo prvního století př. n. l. do byzantského období, a navrhl, váhavě, že by mohlo jít o Dalmanutu. Jiní pochybují, že město tohoto jména kdy existovalo."
  es:
    - "Dalmanuta es el lugar del mar de Galilea al que Jesús cruzó después de alimentar a los cuatro mil: «Y luego entrando en el barco con sus discípulos, vino á las partes de Dalmanutha». Allí salieron los fariseos a pedir una señal del cielo. El nombre no aparece en ningún otro lugar, ni en la Biblia ni fuera de ella. En el pasaje paralelo, Mateo tiene Magadán en los manuscritos más antiguos y Magdala en el texto de la King James, de modo que el lugar suele buscarse en la orilla occidental cerca de Magdala, donde lo sitúa el mapa."
    - "Ningún sitio ha sido identificado con seguridad. Mendel Nun propuso un pequeño fondeadero justo al norte de Magdala y sugirió que el nombre podría ser simplemente la palabra aramea para puerto; Gordon Franz, al describir el puerto de la propia Magdala, la tomó igualmente por una palabra siríaca para puerto. En 2013 Ken Dark informó de una ciudad romana antes no reconocida en la llanura de Ginosar, entre la actual Migdal y el lago, con cerámica desde el siglo II o I a. C. hasta el período bizantino, y sugirió, con cautela, que podría ser Dalmanuta. Otros dudan de que existiera jamás una ciudad con este nombre."
  sv:
    - "Dalmanuta är platsen vid Galileiska sjön dit Jesus for över efter att ha mättat de fyra tusen: ”Och strax därefter steg han i båten med sina lärjungar och for till trakten av Dalmanuta.” Där kom fariséerna ut för att kräva ett tecken från himlen. Namnet förekommer ingen annanstans, vare sig i Bibeln eller utanför den. I den parallella texten har Matteus Magadan i de äldsta handskrifterna och Magdala i King James-texten, så platsen söks vanligen på västra stranden nära Magdala, där kartan sätter den."
    - "Ingen plats har säkert identifierats. Mendel Nun föreslog en liten ankarplats strax norr om Magdala och antydde att namnet helt enkelt kan vara det arameiska ordet för hamn; Gordon Franz, som beskrev Magdalas egen hamn, tog det likaså som ett syriskt ord för hamn. År 2013 rapporterade Ken Dark en tidigare okänd romersk stad på Ginosarslätten mellan nuvarande Migdal och sjön, med keramik från andra eller första århundradet f.Kr. till bysantinsk tid, och föreslog, försiktigt, att den kunde vara Dalmanuta. Andra betvivlar att en stad med detta namn någonsin funnits."
  nb:
    - "Dalmanuta er stedet ved Galileasjøen som Jesus krysset til etter at han hadde mettet de fire tusen: «Og straks gikk han ut i båten med sine disipler, og kom til landet ved Dalmanuta.» Der kom fariseerne ut for å kreve et tegn fra himmelen. Navnet forekommer ikke noe annet sted, verken i Bibelen eller utenfor. I den parallelle teksten har Matteus Magadan i de eldste håndskriftene og Magdala i King James-teksten, så stedet søkes vanligvis på vestkysten nær Magdala, der kartet setter det."
    - "Ingen plass er sikkert identifisert. Mendel Nun foreslo en liten ankerplass like nord for Magdala og antydet at navnet kan være det arameiske ordet for en havn; Gordon Franz, som beskriver Magdalas egen havn, tok det likeledes som et syrisk ord for havn. I 2013 rapporterte Ken Dark om en tidligere ukjent romersk by på Ginosar-sletten mellom dagens Migdal og sjøen, med keramikk fra 100- eller det første århundre f.Kr. til den bysantinske perioden, og antydet, forsiktig, at det kan være Dalmanuta. Andre tviler på at en by med dette navnet noen gang fantes."
  tl:
    - "Ang Dalmanuta ay ang pook sa Dagat ng Galilea na tinawiran ni Jesus pagkatapos pakainin ang apat na libo: “pagdaka'y lumulan siya sa daong na kasama ang kaniyang mga alagad, at napasa mga sakop ng Dalmanuta.” Doon lumabas ang mga Fariseo upang humingi ng tanda mula sa langit. Wala nang ibang lugar na binabanggit ang pangalan, sa Bibliya man o sa labas nito. Sa kahalintulad na talata, may Magadan si Mateo sa pinakamatatandang manuskrito at Magdala sa tekstong King James, kaya karaniwang hinahanap ang pook sa kanlurang baybayin malapit sa Magdala, kung saan ito inilalagay ng mapa."
    - "Wala pang tiyak na natukoy na pook. Iminungkahi ni Mendel Nun ang isang maliit na daungan sa hilaga lamang ng Magdala at ipinalagay na ang pangalan ay maaaring salitang Aramaiko lamang para sa daungan; si Gordon Franz, sa paglalarawan niya sa sariling daungan ng Magdala, ay itinuring din itong salitang Siriaco para sa daungan. Noong 2013, iniulat ni Ken Dark ang dating hindi kilalang bayang Romano sa kapatagan ng Ginosar sa pagitan ng makabagong Migdal at ng lawa, na may palayok mula ika-2 o ika-1 siglo BK hanggang panahong Bizantino, at iminungkahi, nang may pag-aalinlangan, na maaaring ito ang Dalmanuta. Pinagdududahan ng iba na may bayang ganito ang pangalan kailanman."
  da:
    - "Dalmanuta er stedet ved Genesaret Sø, som Jesus krydsede til efter mættelsen af de fire tusinde: »straks gik han om Bord i Skibet med sine Disciple og kom til Dalmanuthas Egne«. Dér kom farisæerne ud for at kræve et tegn fra himlen. Navnet findes ingen andre steder, hverken i Bibelen eller uden for den. I den parallelle beretning har Mattæus Magadan i de ældste håndskrifter og Magdala i King James-teksten, så stedet søges sædvanligvis på vestkysten nær Magdala, hvor kortet placerer det."
    - "Intet sted er sikkert identificeret. Mendel Nun foreslog en lille ankerplads lige nord for Magdala og antydede, at navnet blot kan være det aramæiske ord for en havn; Gordon Franz, der beskrev Magdalas egen havn, tog det ligeledes som et syrisk ord for havn. I 2013 rapporterede Ken Dark om en tidligere uopdaget romersk by på Ginosar-sletten mellem nutidens Migdal og søen, med keramik fra 2. eller 1. århundrede f.Kr. til den byzantinske tid, og foreslog forsigtigt, at den kunne være Dalmanuta. Andre betvivler, at en by med dette navn nogensinde har eksisteret."
  sr:
    - "Далманута је место на Галилејском мору куда је Исус прешао после хране за четири хиљаде: „И одмах уђе у лађу с ученицима својим, и дође у околине далманутске“. Тамо су изашли фарисеји да траже знак с неба. Име се нигде другде не јавља, ни у Библији ни изван ње. У паралелном одломку Матеј у најстаријим рукописима има Магадан, а у тексту Краља Џејмса Магдалу, па се место обично тражи на западној обали близу Магдале, где га карта и смешта."
    - "Ниједно налазиште није поуздано утврђено. Мендел Нун предложио је мало пристаниште одмах северно од Магдале и претпоставио да је име можда једноставно арамејска реч за луку; Гордон Франц, описујући саму луку Магдале, такође је узео да је то сиријска реч за луку. Кен Дарк је 2013. пријавио до тада непризнат римски град на равници Гиносар између данашњег Мигдала и језера, с керамиком од 2. или 1. века п. н. е. до византијског периода, и пробно предложио да би могао бити Далманута. Други сумњају да је град тог имена икада постојао."
scripture:
