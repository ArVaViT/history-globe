# Overview article (ADR 0007). Mainstream facts only; the Yotvata identification is given as the usual but unproven one, with the other candidates; the Roman fort is dated by its excavator.
id: jotbathah
place: a7384d7
title:
  en: "Jotbathah"
  ru: "Иотвафа"
  uk: "Йотвата"
  es: "Jotbata"
  pt: "Jotbatá"
  de: "Jotbata"
  fr: "Jothbatha"
  pl: "Jotbata"
  it: "Iotbata"
  nl: "Jotbata"
