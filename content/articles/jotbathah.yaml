body:
  en:
    - "Jotbathah was a camping place of Israel on the way from Kadesh to the Red Sea, and the one station on that stretch of which the Bible says anything beyond its name. Numbers lists it between Hor-haggidgad and Ebronah, two stops before Ezion-geber on the gulf: “they went from Hor-hagidgad, and pitched in Jotbathah. And they removed from Jotbathah, and encamped at Ebronah”. Deuteronomy, calling it Jotbath, adds the detail that explains the name, which means something like “pleasantness”: “from Gudgodah to Jotbath, a land of rivers of waters”. It was, then, an oasis with running water, a rare thing on that road, and since Ezion-geber lay at the head of the Gulf of Aqaba, Jotbathah is sought in the southern Arabah or on the gulf's shore."
    - "The usual identification is the oasis of Ain Ghadian in the Arabah about 40 km north of Eilat, where springs feed a marsh and palms: in the 1950s the kibbutz founded there took the name Yotvata on that assumption, and Zeev Meshel excavated beside it a Roman fort built under Diocletian, about AD 300, with a Latin inscription. Nothing from Israel's time has been found. Other candidates are Taba on the gulf shore south of Eilat, which the map prefers, the spring of Et-Taba in the Arabah near Yotvata, and Ein Weibeh further up the Arabah; none can be proved, and the choice depends on where Mount Sinai and the whole route are placed."
    - "Yotvata today is a kibbutz known across Israel for its dairy, with the Hai-Bar nature reserve beside it and the Timna copper mines a little to the south; Taba is the Egyptian border town at the head of the gulf, with its crossing from Eilat."
  ru:
    - "Иотвафа была стоянкой Израиля на пути от Кадеса к Чермному морю, единственной на этом отрезке, о которой Библия говорит что-то сверх имени. Книга Чисел ставит её между Хор-Агидгадом и Авроном, за две стоянки до Ецион-Гавера на заливе: «И отправились из Хор-Агидгада и расположились станом в Иотвафе. И отправились от Иотвафы и расположились станом в Авроне». Второзаконие добавляет подробность, объясняющую имя, которое значит примерно «приятность»: «из Гудгода в Иотвафу, в землю, где потоки вод». Значит, это был оазис с проточной водой, редкость на той дороге, и, поскольку Ецион-Гавер лежал у вершины залива Акаба, Иотвафу ищут в южной Араве или на берегу залива."
    - "Обычное отождествление — оазис Айн-Гадиан в Араве примерно в 40 км к северу от Эйлата, где источники питают болото и пальмы: в 1950-х годах основанный там кибуц взял имя Йотвата по этому предположению, а Зеэв Мешель раскопал рядом римскую крепость, построенную при Диоклетиане около 300 г. н. э., с латинской надписью. Ничего от времён Израиля не найдено. Другие кандидаты — Таба на берегу залива к югу от Эйлата, которой отдано предпочтение на карте, источник Эт-Таба в Араве близ Йотваты и Айн-Вейбе дальше по Араве; ни один нельзя доказать, и выбор зависит от того, куда помещают гору Синай и весь путь."
    - "Йотвата сегодня — кибуц, известный по всему Израилю своей молочной фермой, рядом с заповедником Хай-Бар и медными рудниками Тимны чуть южнее; Таба — египетский пограничный городок у вершины залива с переходом из Эйлата."
  uk:
    - "Йотвата була станом Ізраїлю на шляху від Кадеша до Червоного моря, і єдиною стоянкою на цьому відтинку, про яку Біблія каже щось, крім назви. Книга Чисел перелічує її між Хор-Гагідгадом та Авроною, за дві зупинки до Еціон-Гевера на затоці: «І рушили з Гор-Гідгада та й отаборились у Йотбатї. І рушили з Йотбата та й отаборились ув Абронї». Повторення Закону, називаючи її Йотбата, додає подробицю, що пояснює назву, яка означає щось на кшталт «приємність»: «від Гудгода у Йотбату країну, де багацько водяних бурчаків». Отже, це була оаза з проточною водою, рідкість на тій дорозі, і оскільки Еціон-Гевер лежав у вершині Акабської затоки, Йотвату шукають у південній Араві або на березі затоки."
    - "Звичайне ототожнення — оаза Айн-Гадіан в Араві приблизно за 40 км на північ від Ейлата, де джерела живлять болото й пальми: у 1950-х роках кібуц, заснований там, узяв назву Йотвата на цій підставі, і Зеєв Мешель розкопав поряд римський форт, збудований за Діоклетіана, близько 300 р. н. е., з латинським написом. Нічого з часів Ізраїлю не знайдено. Інші кандидати — Таба на березі затоки на південь від Ейлата, якій надає перевагу карта, джерело Ет-Таба в Араві поблизу Йотвати та Ейн-Вейбе далі вгору по Араві; жодного не можна довести, і вибір залежить від того, де розміщують гору Синай і весь маршрут."
    - "Йотвата сьогодні — кібуц, відомий по всьому Ізраїлю молочними продуктами, з заповідником Хай-Бар поряд і мідними копальнями Тімна трохи на південь; Таба — єгипетське прикордонне місто на вершині затоки, з переходом з Ейлата."
  es:
    - "Jotbata fue un lugar de campamento de Israel en el camino de Cades al mar Rojo, y la única estación de ese tramo de la que la Biblia dice algo más que el nombre. Números la enumera entre Hor-hagidgad y Abrona, dos paradas antes de Ezión-geber, en el golfo: «Y partidos del monte de Gidgad, asentaron en Jotbatha. Y partidos de Jotbatha, asentaron en Abrona». El Deuteronomio, llamándola Jotbath, añade el detalle que explica el nombre, que significa algo así como «amenidad»: «de Gudgod á Jotbath, tierra de arroyos de aguas». Era, pues, un oasis con agua corriente, cosa rara en aquel camino, y como Ezión-geber estaba en la cabecera del golfo de Áqaba, Jotbata se busca en el sur del Arabá o en la orilla del golfo."
    - "La identificación habitual es el oasis de Ain Ghadian, en el Arabá, a unos 40 km al norte de Eilat, donde manantiales alimentan una ciénaga y palmeras: en los años cincuenta el kibutz fundado allí tomó el nombre de Yotvata partiendo de esa suposición, y Zeev Meshel excavó junto a él un fuerte romano construido bajo Diocleciano, hacia el 300 d. C., con una inscripción latina. No se ha hallado nada de la época de Israel. Otros candidatos son Taba, en la orilla del golfo al sur de Eilat, que es la que prefiere el mapa, la fuente de Et-Taba en el Arabá, cerca de Yotvata, y Ein Weibeh, más arriba en el Arabá; ninguna puede probarse, y la elección depende de dónde se sitúen el monte Sinaí y toda la ruta."
    - "Yotvata es hoy un kibutz conocido en todo Israel por sus lácteos, con la reserva natural de Hai-Bar a su lado y las minas de cobre de Timna un poco al sur; Taba es la ciudad fronteriza egipcia en la cabecera del golfo, con su paso desde Eilat."
  pt:
    - "Jotbatá foi um pouso de Israel no caminho de Cades ao mar Vermelho, e a única estação desse trecho de que a Bíblia diz algo além do nome. Números a lista entre Hor-Gidgade e Abroná, duas paradas antes de Eziom-Geber, no golfo: “Partiram de Hor-Hagidgade e acamparam em Jotbatá. Partiram de Jotbatá e acamparam em Abroná”. Deuteronômio, chamando-a Jotbatá, acrescenta o detalhe que explica o nome, que significa algo como “amenidade”: “de Gudgoda para Jotbatá, uma terra de ribeiros de água”. Era, pois, um oásis de água corrente, coisa rara naquela estrada, e como Eziom-Geber ficava na cabeceira do golfo de Aqaba, Jotbatá é procurada na Arabá meridional ou na margem do golfo."
    - "A identificação usual é o oásis de Ain Ghadian, na Arabá, a cerca de 40 km ao norte de Eilat, onde fontes alimentam um brejo e palmeiras: na década de 1950 o quibutz fundado ali tomou o nome Yotvata, com base nessa suposição, e Zeev Meshel escavou ao lado um forte romano construído sob Diocleciano, por volta de 300 d.C., com uma inscrição latina. Nada do tempo de Israel foi achado. Outros candidatos são Taba, na margem do golfo ao sul de Eilat, que o mapa prefere, a fonte de Et-Taba, na Arabá, perto de Yotvata, e Ein Weibeh, mais acima na Arabá; nenhum pode ser provado, e a escolha depende de onde se situam o monte Sinai e toda a rota."
    - "Yotvata é hoje um quibutz conhecido em todo Israel por seus laticínios, com a reserva natural de Hai-Bar ao lado e as minas de cobre de Timna um pouco ao sul; Taba é a cidade de fronteira egípcia na cabeceira do golfo, com sua passagem desde Eilat."
  de:
    - "Jotbata war ein Lagerplatz Israels auf dem Weg von Kadesch zum Roten Meer und die einzige Station dieser Strecke, über die die Bibel mehr als den Namen sagt. Das vierte Buch Mose führt es zwischen Hor-Gidgad und Abrona auf, zwei Stationen vor Ezjon-Geber am Golf: „Von Horgidgad zogen sie aus und lagerten sich in Jotbatha. Von Jotbatha zogen sie aus und lagerten sich in Abrona.“ Das fünfte Buch Mose, das es Jotbat nennt, fügt die Angabe hinzu, die den Namen erklärt, der etwa „Annehmlichkeit“ bedeutet: „von Gugegoda gen Jotbatha, ein Land, da Bäche sind“. Es war also eine Oase mit fließendem Wasser, eine Seltenheit auf dieser Straße, und da Ezjon-Geber am Kopf des Golfs von Akaba lag, wird Jotbata in der südlichen Araba oder am Ufer des Golfs gesucht."
    - "Die übliche Gleichsetzung ist die Oase Ain Ghadian in der Araba etwa 40 km nördlich von Eilat, wo Quellen einen Sumpf und Palmen speisen: In den 1950er Jahren nahm der dort gegründete Kibbuz in dieser Annahme den Namen Jotwata an, und Ze'ev Meshel grub daneben ein römisches Kastell aus, unter Diokletian um 300 n. Chr. gebaut, mit einer lateinischen Inschrift. Nichts aus Israels Zeit ist gefunden worden. Weitere Kandidaten sind Taba am Golfufer südlich von Eilat, das die Karte bevorzugt, die Quelle Et-Taba in der Araba nahe Jotwata und Ein Weibeh weiter oben in der Araba; keiner lässt sich beweisen, und die Wahl hängt davon ab, wo man den Sinai und die ganze Route ansetzt."
    - "Jotwata ist heute ein in ganz Israel für seine Milchprodukte bekannter Kibbuz, mit dem Naturreservat Hai-Bar daneben und den Kupferminen von Timna etwas südlich; Taba ist die ägyptische Grenzstadt am Kopf des Golfs, mit dem Übergang von Eilat."
  fr:
    - "Jothbatha était un lieu de campement d’Israël sur la route de Qadesh à la mer Rouge, et la seule étape de ce tronçon dont la Bible dise quelque chose au-delà de son nom. Les Nombres la placent entre Hor-Guidgad et Abrona, deux étapes avant Etsjon-Guéber sur le golfe : « Ils partirent de Hor-Guidgad, et campèrent à Jothbatha. Ils partirent de Jothbatha, et campèrent à Abrona. » Le Deutéronome, qui l’appelle Jotbath, ajoute le détail qui explique le nom, lequel signifie à peu près « agrément » : « de Gudgoda pour Jothbatha, pays où il y a des cours d’eaux ». C’était donc une oasis aux eaux vives, chose rare sur cette route, et comme Etsjon-Guéber se trouvait à la tête du golfe d’Aqaba, on cherche Jothbatha dans le sud de l’Araba ou sur la rive du golfe."
    - "L’identification habituelle est l’oasis d’Aïn Ghadian dans l’Araba, à environ 40 km au nord d’Eilat, où des sources nourrissent un marais et des palmiers : dans les années 1950, le kibboutz qui y fut fondé prit le nom de Yotvata sur cette supposition, et Zeev Meshel fouilla à côté un fort romain bâti sous Dioclétien, vers 300 apr. J.-C., avec une inscription latine. Rien du temps d’Israël n’a été trouvé. D’autres candidats sont Taba, sur la rive du golfe au sud d’Eilat, que préfère la carte, la source d’Et-Taba dans l’Araba près de Yotvata, et Ein Weibeh plus haut dans l’Araba ; aucun ne peut être prouvé, et le choix dépend de l’emplacement que l’on donne au mont Sinaï et à tout l’itinéraire."
    - "Yotvata est aujourd’hui un kibboutz connu dans tout Israël pour ses produits laitiers, avec la réserve naturelle de Hai-Bar à côté et les mines de cuivre de Thimna un peu au sud ; Taba est la ville frontière égyptienne à la tête du golfe, avec son passage depuis Eilat."
  pl:
    - "Jotbata było miejscem obozowania Izraela w drodze z Kadesz do Morza Czerwonego i jedyną stacją na tym odcinku, o której Biblia mówi coś poza nazwą. Księga Liczb wymienia je między Chor-ha-Gidgad a Ebroną, dwa postoje przed Esjon-Geber nad zatoką: „A ruszywszy się z Horgidgad, położyli się obozem u Jotbata. A ruszywszy się z Jotbata, położyli się obozem w Habrona”. Księga Powtórzonego Prawa, nazywając je Jotbat, dodaje szczegół objaśniający nazwę, która znaczy coś jak „przyjemność”: „a z Gadgad do Jotbata, do ziemi ciekących wód”. Była więc oazą z bieżącą wodą, rzadkością na tej drodze, a ponieważ Esjon-Geber leżało u wylotu Zatoki Akaba, Jotbaty szuka się w południowej Arabie lub na brzegu zatoki."
    - "Zwykłe utożsamienie to oaza Ajn Ghadjan w Arabie około 40 km na północ od Ejlatu, gdzie źródła zasilają bagno i palmy: w latach pięćdziesiątych założony tam kibuc przyjął nazwę Jotwata na tym założeniu, a Zeew Meszel odkopał obok rzymski fort zbudowany za Dioklecjana, około 300 r. n.e., z łacińskim napisem. Nic z czasów Izraela nie znaleziono. Inni kandydaci to Taba na brzegu zatoki na południe od Ejlatu, którą woli mapa, źródło et-Taba w Arabie koło Jotwaty oraz Ajn Wejba wyżej w Arabie; żadnego nie można udowodnić, a wybór zależy od tego, gdzie umieści się górę Synaj i całą trasę."
    - "Jotwata to dziś kibuc znany w całym Izraelu z nabiału, z rezerwatem przyrody Chaj-Bar obok i kopalniami miedzi Timna nieco na południe; Taba to egipskie miasto graniczne u wylotu zatoki, z przejściem z Ejlatu."
  it:
    - "Iotbata era un accampamento d’Israele sulla via da Kades al Mar Rosso, e l’unica tappa su quel tratto di cui la Bibbia dice qualcosa oltre al nome. I Numeri la elencano fra Cor-Ghidgad e Abrona, due soste prima di Ezion-Gheber sul golfo: «Partirono da Hor-Ghidgad e si accamparono a Jotbathah. Partirono da Jotbathah e si accamparono a Abrona». Il Deuteronomio, chiamandola Jotbath, aggiunge il particolare che spiega il nome, che significa qualcosa come «amenità»: «da Gudgoda alla volta di Jotbatha, paese di corsi d’acqua». Era dunque un’oasi con acqua corrente, cosa rara su quella strada, e poiché Ezion-Gheber sorgeva in capo al Golfo di Aqaba, Iotbata si cerca nell’Araba meridionale o sulla riva del golfo."
    - "L’identificazione consueta è l’oasi di Ain Ghadian nell’Araba circa 40 km a nord di Eilat, dove sorgenti alimentano una palude e palme: negli anni Cinquanta il kibbutz fondato là prese il nome Yotvata su tale presupposto, e Zeev Meshel scavò accanto ad esso un forte romano costruito sotto Diocleziano, verso il 300 d.C., con un’iscrizione latina. Nulla del tempo d’Israele è stato trovato. Altri candidati sono Taba sulla riva del golfo a sud di Eilat, che la mappa preferisce, la sorgente di Et-Taba nell’Araba presso Yotvata, ed Ein Weibeh più in alto nell’Araba; nessuno si può provare, e la scelta dipende da dove si collocano il Monte Sinai e l’intero percorso."
    - "Yotvata è oggi un kibbutz noto in tutto Israele per i latticini, con la riserva naturale Hai-Bar accanto e le miniere di rame di Timna poco a sud; Taba è la città di confine egiziana in capo al golfo, con il suo valico da Eilat."
  nl:
    - "Jotbata was een legerplaats van Israël op de weg van Kades naar de Rode Zee, en het enige station op dat traject waarvan de Bijbel iets zegt behalve de naam. Numeri noemt het tussen Chor-Haggidgad en Abrona, twee haltes vóór Ezeon-Geber aan de golf: “En zij verreisden van Hor-gidgad, en legerden zich in Jotbatha. En zij verreisden van Jotbatha, en legerden zich in Abrona”. Deuteronomium, dat het Jotbath noemt, voegt het detail toe dat de naam verklaart, die zoiets als “aangenaamheid” betekent: “van Gudgod naar Jotbath, een land van waterbeken”. Het was dus een oase met stromend water, iets zeldzaams op die weg, en omdat Ezeon-Geber aan het uiteinde van de Golf van Aqaba lag, wordt Jotbata gezocht in de zuidelijke Araba of aan de oever van de golf."
    - "De gebruikelijke identificatie is de oase Ain Ghadian in de Araba ongeveer 40 km ten noorden van Eilat, waar bronnen een moeras en palmen voeden: in de jaren vijftig nam de daar gestichte kibboets op die veronderstelling de naam Yotvata aan, en Zeev Meshel groef ernaast een Romeins fort op dat onder Diocletianus omstreeks 300 n.Chr. was gebouwd, met een Latijns opschrift. Niets uit Israëls tijd is gevonden. Andere kandidaten zijn Taba aan de golfoever ten zuiden van Eilat, waaraan de kaart de voorkeur geeft, de bron van Et-Taba in de Araba bij Yotvata, en Ein Weibeh verder omhoog in de Araba; geen is te bewijzen, en de keuze hangt af van waar men de Sinaï en de hele route plaatst."
    - "Yotvata is nu een kibboets die door heel Israël bekend is om zijn zuivel, met het natuurreservaat Hai-Bar ernaast en de kopermijnen van Timna iets zuidelijker; Taba is de Egyptische grensstad aan het uiteinde van de golf, met haar grensovergang vanuit Eilat."
  cs:
    - "Jotbata bylo tábořiště Izraele na cestě z Kádeše k Rudému moři a jediná stanice na tomto úseku, o níž Bible říká něco víc než jméno. Numeri ji uvádějí mezi Chor-hagidgad a Ebronou, dvě zastávky před Ecjon-geberem u zálivu: „A hnuvše se z Chor Gidgad, položili se v Jotbata. Když se pak hnuli z Jotbata, položili se v Habrona.“ Deuteronomium, nazývající ji Jotbat, dodává podrobnost vysvětlující jméno, které znamená něco jako „příjemnost“: „z Gadgad do Jotbata, do země vod tekutých“. Byla to tedy oáza s tekoucí vodou, na této cestě vzácnost, a protože Ecjon-geber ležel na čele Akabského zálivu, hledá se Jotbata v jižní Arabě nebo na břehu zálivu."
    - "Obvyklým ztotožněním je oáza Ajn Ghadján v Arabě asi 40 km severně od Ejlatu, kde prameny napájejí močál a palmy: v 50. letech 20. století si tu založený kibuc vzal jméno Jotvata na tomto předpokladu a Ze'ev Meshel vykopal vedle něj římskou pevnost postavenou za Diokleciána, asi roku 300 n. l., s latinským nápisem. Z Izraelovy doby nebylo nalezeno nic. Dalšími kandidáty jsou Taba na břehu zálivu jižně od Ejlatu, které dává přednost mapa, pramen Et-Taba v Arabě poblíž Jotvaty a Ajn Weiba dále v Arabě; žádné nelze dokázat a volba závisí na tom, kam se klade hora Sinaj a celá trasa."
    - "Jotvata je dnes kibuc známý po celém Izraeli mléčnými výrobky, s přírodní rezervací Hai-Bar vedle a měděnými doly Timna kousek na jih; Taba je egyptské pohraniční město na čele zálivu s přechodem z Ejlatu."
scripture:
  - Num.33.33-Num.33.34
  - Deut.10.7
sources:
  - "G. I. Davies, The Way of the Wilderness: A Geographical Study of the Wilderness Itineraries in the Old Testament (1979)"
  - "Z. Meshel, 'A Fort at Yotvata from the Time of Diocletian', Israel Exploration Journal 39 (1989)"
  - "B. A. Levine, Numbers 21–36 (Anchor Bible 4A, 2000)"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (2nd ed., 1979)"
