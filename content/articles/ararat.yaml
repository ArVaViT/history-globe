body:
  en:
    - "Ararat in the Bible is a country, not a peak: the Hebrew form of Urartu, the kingdom that the Assyrians knew in the mountains north of them, around Lake Van, from the ninth to the seventh century BC. Its kings, Sarduri, Menua, Argishti and Rusa, ruled from Tushpa, the rock of Van, built fortresses and canals, wrote in cuneiform and fought Assyria for the passes; Sargon II's eighth campaign in 714 BC, told in his letter to the god Ashur, dealt them a heavy blow; Urartu recovered in the seventh century, but its fortresses were destroyed around 600 BC, and whether it ended under the Medes or the Scythians, or later, is debated. The Armenians inherited the land, and the Septuagint renders the name as Armenia in Isaiah, the King James Version in both Kings and Isaiah."
    - "Genesis says that after the flood “the ark rested in the seventh month, on the seventeenth day of the month, upon the mountains of Ararat”, somewhere in that highland. When Sennacherib was murdered in 681 BC, “Adrammelech and Sharezer his sons smote him with the sword: and they escaped into the land of Armenia”, that is Ararat; the Babylonian Chronicle records the murder, and Esarhaddon's own inscription says the brothers fled to an unknown land. Jeremiah summons against Babylon “the kingdoms of Ararat, Minni, and Ashchenaz”, Urartu, the Mannaeans and the Scythians (the Synodal text reads Media for Minni)."
    - "Which mountain the ark came to rest on the Bible does not say. Berossus, quoted by Josephus, put its remains in the mountains of the Cordyaeans, and Jewish, Syriac and early Muslim tradition pointed to Mount Judi (Cudi Dagi) above the Tigris near Cizre; from the Middle Ages Armenian tradition fixed on Masis, the volcano of 5,137 m that Europeans call Mount Ararat. It rises in eastern Turkey by the borders of Armenia and Iran, and the search for the ark on its slopes has found nothing. The old Urartian fortresses survive at Van, at Erebuni and Karmir Blur in Yerevan and at Cavustepe, and the land of Ararat is today shared by Turkey, Armenia and north-western Iran."
  ru:
    - "Арарат в Библии — страна, а не вершина: еврейская форма имени Урарту, царства, которое Ассирийцы знали в горах к северу от себя, вокруг озера Ван, с IX по VII век до н. э. Его цари — Сардури, Менуа, Аргишти, Руса — правили из Тушпы, скалы Вана, строили крепости и каналы, писали клинописью и бились с Ассирией за перевалы; восьмой поход Саргона II в 714 г. до н. э., описанный в его письме богу Ашшуру, нанёс им тяжёлый удар; в VII веке Урарту оправилось, но около 600 г. до н. э. его крепости были разрушены, и пало ли оно от Мидян, от скифов или позже — спорно. Землю унаследовали армяне, и Септуагинта передаёт имя как Армения у Исаии, а английская Библия короля Иакова — и у Исаии, и в книгах Царств."
    - "Книга Бытия говорит, что после потопа «остановился ковчег в седьмом месяце, в семнадцатый день месяца, на горах Араратских» — где-то в этом нагорье. Когда в 681 г. до н. э. был убит Сеннахирим, «Адрамелех и Шарецер, сыновья его, убили его мечом, а сами убежали в землю Араратскую»; Вавилонская хроника записала убийство, а собственная надпись Асардана говорит, что братья бежали в неведомую землю. Иеремия созывает против Вавилона «царства Араратские, Мидийские и Аскеназские» — Урарту, Маннеев и Скифов (в еврейском тексте вместо Мидии стоит Минни)."
    - "На какой горе остановился ковчег, Библия не говорит. Берос, которого цитирует Иосиф Флавий, помещал его остатки в горах Кордуенских, и иудейское, сирийское и раннее мусульманское предание указывало на гору Джуди (Джуди-Даг) над Тигром близ Джизре; с Средних веков армянское предание закрепило за ковчегом Масис — вулкан высотой 5137 м, который европейцы зовут Араратом. Он поднимается на востоке Турции у границ Армении и Ирана, и поиски ковчега на его склонах ничего не нашли. Урартские крепости стоят в Ване, в Эребуни и Кармир-Блуре в Ереване и в Чавуштепе, а землю Арарат делят сегодня Турция, Армения и северо-запад Ирана."
  uk:
    - "Арарат у Біблії — країна, а не вершина: єврейська форма Урарту, царства, яке ассирійці знали в горах на північ від себе, навколо озера Ван, з IX до VII століття до н. е. Його царі, Сардурі, Менуа, Аргішті й Руса, правили з Тушпи, скелі Ван, будували фортеці й канали, писали клинописом і воювали з Ассирією за перевали; восьмий похід Саргона II у 714 р. до н. е., описаний в його листі до бога Ашшура, завдав їм тяжкого удару; у VII столітті Урарту відновилося, але близько 600 р. до н. е. його фортеці зруйновано, і чи впало воно від мідян, від скіфів чи пізніше, — дискусійне питання. Вірмени успадкували цю землю, і Септуагінта передає назву як Вірменія в Ісаї, а Біблія короля Якова — і в Царів, і в Ісаї."
    - "Буття каже, що після потопу «зупинився ковчег у сьомому місяцї, на сїмнайцятий день місяця, на горі Арарацькій», десь у тому нагір'ї. Коли в 681 р. до н. е. Сінаххеріба вбили, «убили його мечем сини його, Адрамелех та Шарезер, і повтїкали в Арарат-землю», тобто в Арарат; Вавилонська хроніка записує вбивство, а власний напис Асархаддона каже, що брати втекли до невідомої землі. Єремія кличе проти Вавилона «царства: Арарацькі, Минїйські, Аскеназькі» — Урарту, маннеїв і скіфів (Синодальний текст читає Мідію замість Мінні)."
    - "На якій горі зупинився ковчег, Біблія не каже. Берос, якого цитує Йосиф Флавій, розмістив його рештки в горах кордієїв, а юдейське, сирійське й раннє мусульманське передання вказувало на гору Джуді (Джуді-Даг) над Тигром поблизу Джизре; від Середньовіччя вірменське передання зупинилося на Масісі, вулкані заввишки 5137 м, який європейці називають горою Арарат. Він здіймається у східній Туреччині на кордонах Вірменії та Ірану, і пошуки ковчега на його схилах нічого не виявили. Давні урартські фортеці збереглися у Вані, в Еребуні та Кармір-Блурі в Єревані й у Чавуштепе, а країну Арарат нині ділять Туреччина, Вірменія і північно-західний Іран."
  es:
    - "Ararat, en la Biblia, es un país, no una cumbre: la forma hebrea de Urartu, el reino que los asirios conocían en las montañas al norte de ellos, en torno al lago Van, del siglo IX al VII a. C. Sus reyes, Sarduri, Menua, Argishti y Rusa, gobernaron desde Tushpa, la roca de Van, construyeron fortalezas y canales, escribieron en cuneiforme y lucharon contra Asiria por los pasos; la octava campaña de Sargón II en 714 a. C., relatada en su carta al dios Asur, les asestó un duro golpe; Urartu se recuperó en el siglo VII, pero sus fortalezas fueron destruidas hacia 600 a. C., y se discute si terminó ante los medos o los escitas, o más tarde. Los armenios heredaron la tierra, y la Septuaginta traduce el nombre como Armenia en Isaías, y la versión del rey Jacobo tanto en Reyes como en Isaías."
    - "El Génesis dice que tras el diluvio «reposó el arca en el mes séptimo, á diecisiete días del mes, sobre los montes de Armenia» (en el hebreo, Ararat), en algún lugar de aquella región alta. Cuando Senaquerib fue asesinado en 681 a. C., sus hijos Adramelec y Sarezer «lo hirieron á cuchillo; y huyéronse á tierra de Ararat» (la versión del rey Jacobo dice «Armenia»); la Crónica babilónica registra el asesinato, y la propia inscripción de Esar-hadón dice que los hermanos huyeron a una tierra desconocida. Jeremías convoca contra Babilonia «los reinos de Ararat, de Minni, y de Aschênaz», es decir, Urartu, los mannaeos y los escitas (el texto sinodal lee Media por Mini)."
    - "La Biblia no dice sobre qué montaña se posó el arca. Beroso, citado por Josefo, puso sus restos en los montes de los cordieos, y la tradición judía, siria y musulmana antigua señaló el monte Judi (Cudi Dağı), sobre el Tigris, cerca de Cizre; desde la Edad Media la tradición armenia se fijó en el Masis, el volcán de 5137 m que los europeos llaman monte Ararat. Se alza en el este de Turquía, junto a las fronteras de Armenia e Irán, y la búsqueda del arca en sus laderas no ha hallado nada. Las antiguas fortalezas urartias sobreviven en Van, en Erebuni y Karmir Blur, en Ereván, y en Çavuştepe, y la tierra de Ararat la comparten hoy Turquía, Armenia y el noroeste de Irán."
  pt:
    - "Ararate, na Bíblia, é um país, não um pico: a forma hebraica de Urartu, o reino que os assírios conheciam nas montanhas ao norte, em torno do lago Van, do século IX ao VII a.C. Seus reis, Sarduri, Menua, Argishti e Rusa, governavam de Tushpa, a rocha de Van, construíram fortalezas e canais, escreviam em cuneiforme e lutavam com a Assíria pelas passagens; a oitava campanha de Sargão II, em 714 a.C., narrada em sua carta ao deus Assur, desferiu-lhes um duro golpe; Urartu se recuperou no século VII, mas suas fortalezas foram destruídas por volta de 600 a.C., e se discute se acabou diante dos medos ou dos citas, ou mais tarde. Os armênios herdaram a terra, e a Septuaginta traduz o nome por Armênia em Isaías, a King James Version em Reis e em Isaías."
    - "Gênesis diz que, depois do dilúvio, “A arca repousou no sétimo mês, no décimo sétimo dia do mês, sobre os montes de Ararate”, em algum ponto daquele planalto. Quando Senaqueribe foi assassinado em 681 a.C., “Adrameleque e Sarezer, seus filhos, o feriram à espada; e eles escaparam para a terra de Ararate”, que a King James chama de terra da Armênia; a Crônica Babilônica registra o assassinato, e a própria inscrição de Esar-Hadom diz que os irmãos fugiram para uma terra desconhecida. Jeremias convoca contra a Babilônia “os reinos de Ararate, Mini e Asquenaz”, Urartu, os manneus e os citas (o texto sinodal lê Média por Mini)."
    - "Em que montanha a arca repousou a Bíblia não diz. Beroso, citado por Josefo, pôs seus restos nas montanhas dos cordieus, e a tradição judaica, siríaca e muçulmana antiga apontava o monte Judi (Cudi Dagi), acima do Tigre, perto de Cizre; desde a Idade Média a tradição armênia fixou-se em Masis, o vulcão de 5.137 m que os europeus chamam monte Ararate. Ergue-se no leste da Turquia, junto às fronteiras da Armênia e do Irã, e a busca da arca em suas encostas nada encontrou. As antigas fortalezas urartianas subsistem em Van, em Erebuni e Karmir Blur, em Erevan, e em Cavustepe, e a terra de Ararate é hoje partilhada por Turquia, Armênia e noroeste do Irã."
  de:
    - "Ararat ist in der Bibel ein Land, kein Gipfel: die hebräische Form von Urartu, dem Königreich, das die Assyrer in den Bergen nördlich von sich um den Vansee kannten, vom 9. bis zum 7. Jahrhundert v. Chr. Seine Könige, Sarduri, Menua, Argischti und Rusa, herrschten von Tuschpa aus, dem Felsen von Van, bauten Festungen und Kanäle, schrieben in Keilschrift und kämpften mit Assyrien um die Pässe; Sargons II. achter Feldzug 714 v. Chr., in seinem Brief an den Gott Assur erzählt, versetzte ihnen einen schweren Schlag; Urartu erholte sich im 7. Jahrhundert, doch um 600 v. Chr. wurden seine Festungen zerstört, und ob es unter den Medern oder den Skythen endete oder später, ist umstritten. Die Armenier erbten das Land, und die Septuaginta gibt den Namen bei Jesaja als Armenien wieder, die King-James-Bibel in Könige und Jesaja."
    - "Das erste Buch Mose sagt, nach der Sintflut „ließ sich der Kasten nieder auf das Gebirge Ararat“, „am siebzehnten Tage des siebenten Monats“, irgendwo in jenem Hochland. Als Sanherib 681 v. Chr. ermordet wurde, „erschlugen ihn mit dem Schwert Adrammelech und Sarezer, seine Söhne, und entrannen ins Land Ararat“, in der King-James-Bibel Armenia; die Babylonische Chronik verzeichnet den Mord, und Asarhaddons eigene Inschrift sagt, die Brüder seien in ein unbekanntes Land geflohen. Jeremia ruft gegen Babylon „die Königreiche Ararat, Minni und Askenas“ auf, Urartu, die Mannäer und die Skythen (der Synodaltext liest Medien für Minni)."
    - "Auf welchem Berg die Arche zur Ruhe kam, sagt die Bibel nicht. Berossos, von Josephus zitiert, setzte ihre Reste in die Berge der Kordyäer, und jüdische, syrische und frühe muslimische Überlieferung wies auf den Berg Judi (Cudi Dağı) über dem Tigris bei Cizre; seit dem Mittelalter hielt sich die armenische Überlieferung an den Masis, den 5137 m hohen Vulkan, den Europäer Berg Ararat nennen. Er erhebt sich im Osten der Türkei an den Grenzen zu Armenien und Iran, und die Suche nach der Arche an seinen Hängen hat nichts ergeben. Die alten urartäischen Festungen bestehen in Van, in Erebuni und Karmir Blur in Jerewan und in Çavuştepe, und das Land Ararat teilen sich heute die Türkei, Armenien und der Nordwesten des Iran."
  fr:
    - "L’Ararat de la Bible est un pays, non un sommet : la forme hébraïque d’Urartu, le royaume que les Assyriens connaissaient dans les montagnes au nord d’eux, autour du lac de Van, du IXe au VIIe siècle av. J.-C. Ses rois, Sarduri, Menua, Argishti et Rusa, régnaient depuis Toushpa, le rocher de Van, bâtissaient forteresses et canaux, écrivaient en cunéiforme et disputaient à l’Assyrie les passages ; la huitième campagne de Sargon II en 714 av. J.-C., racontée dans sa lettre au dieu Assur, leur porta un coup sévère ; l’Urartu se releva au VIIe siècle, mais ses forteresses furent détruites vers 600 av. J.-C., et l’on débat s’il prit fin sous les Mèdes ou les Scythes, ou plus tard. Les Arméniens héritèrent du pays, et la Septante rend le nom par Arménie en Ésaïe, la King James Version dans les Rois comme dans Ésaïe."
    - "La Genèse dit qu’après le déluge « Le septième mois, le dix-septième jour du mois, l’arche s’arrêta sur les montagnes d’Ararat », quelque part dans ces hautes terres. Quand Sanchérib fut assassiné en 681 av. J.-C., « Adrammélec et Scharetser, ses fils, le frappèrent avec l’épée, et s’enfuirent au pays d’Ararat » ; la Chronique babylonienne note le meurtre, et l’inscription d’Esar-Haddon lui-même dit que les frères s’enfuirent vers un pays inconnu. Jérémie convoque contre Babylone « les royaumes d’Ararat, de Minni et d’Aschkenaz », l’Urartu, les Mannéens et les Scythes (le texte synodal lit Médie pour Minni)."
    - "Sur quelle montagne l’arche s’est posée, la Bible ne le dit pas. Bérose, cité par Josèphe, plaçait ses restes dans les montagnes des Cordyéens, et la tradition juive, syriaque et musulmane ancienne désignait le mont Judi (Cudi Dagi) au-dessus du Tigre près de Cizre ; depuis le Moyen Âge, la tradition arménienne s’est fixée sur le Masis, volcan de 5 137 m que les Européens appellent mont Ararat. Il s’élève dans l’est de la Turquie, près des frontières de l’Arménie et de l’Iran, et la recherche de l’arche sur ses pentes n’a rien trouvé. Les anciennes forteresses urartéennes subsistent à Van, à Erebuni et Karmir Blur à Erevan et à Cavustepe, et le pays d’Ararat est aujourd’hui partagé entre la Turquie, l’Arménie et le nord-ouest de l’Iran."
  it:
    - "Ararat nella Bibbia è un paese, non una vetta: la forma ebraica di Urartu, il regno che gli Assiri conoscevano sulle montagne a nord di loro, intorno al lago di Van, dal IX al VII secolo a.C. I suoi re, Sarduri, Menua, Argishti e Rusa, regnarono da Tushpa, la rupe di Van, costruirono fortezze e canali, scrissero in cuneiforme e combatterono l’Assiria per i passi; l’ottava campagna di Sargon II nel 714 a.C., narrata nella sua lettera al dio Assur, inflisse loro un duro colpo; Urartu si riprese nel VII secolo, ma le sue fortezze furono distrutte verso il 600 a.C., e si discute se finì per mano dei Medi o degli Sciti, o più tardi. Gli Armeni ereditarono la terra, e la Settanta rende il nome come Armenia in Isaia, la King James Version sia nei Re sia in Isaia."
    - "La Genesi dice che dopo il diluvio «nel settimo mese, il decimosettimo giorno del mese, l’arca si fermò sulle montagne di Ararat», da qualche parte in quell’altopiano. Quando Sennacherib fu assassinato nel 681 a.C., i suoi figli Adrammelec e Saretser «lo uccisero a colpi di spada, e si rifugiarono nel paese di Ararat»; la Cronaca babilonese registra l’assassinio, e l’iscrizione dello stesso Assaraddon dice che i fratelli fuggirono in una terra ignota. Geremia convoca contro Babilonia «i regni d’Ararat, di Minni e d’Ashkenaz», Urartu, i Mannei e gli Sciti (il testo sinodale legge Media per Minni)."
    - "Su quale monte l’arca si posò la Bibbia non lo dice. Beroso, citato da Flavio Giuseppe, pose i suoi resti sulle montagne dei Cordiei, e la tradizione giudaica, siriaca e musulmana antica indicava il monte Giudi (Cudi Dağı) sopra il Tigri presso Cizre; dal Medioevo la tradizione armena si fissò sul Masis, il vulcano di 5.137 m che gli europei chiamano monte Ararat. Sorge nella Turchia orientale presso i confini di Armenia e Iran, e la ricerca dell’arca sui suoi pendii non ha trovato nulla. Le antiche fortezze urartee sopravvivono a Van, a Erebuni e Karmir Blur a Erevan e a Cavustepe, e la terra di Ararat è oggi divisa tra Turchia, Armenia e Iran nord-occidentale."
  pl:
    - "Ararat w Biblii jest krajem, nie szczytem: hebrajską formą Urartu, królestwa, które Asyryjczycy znali w górach na północ od siebie, wokół jeziora Wan, od IX do VII wieku p.n.e. Jego królowie, Sarduri, Menua, Argiszti i Rusa, władali z Tuszpy, skały Wan, budowali twierdze i kanały, pisali pismem klinowym i walczyli z Asyrią o przełęcze; ósma kampania Sargona II w 714 r. p.n.e., opowiedziana w jego liście do boga Aszura, zadała im ciężki cios; Urartu podniosło się w VII wieku, ale około 600 r. p.n.e. jego twierdze zostały zniszczone, a czy upadło pod ciosami Medów, czy Scytów, czy później, jest sporne. Ziemię odziedziczyli Ormianie, a Septuaginta oddaje nazwę jako Armenia w Księdze Izajasza, Biblia króla Jakuba zaś w Księgach Królewskich i Izajasza."
    - "Księga Rodzaju mówi, że po potopie „odpoczął korab miesiąca siódmego, siedemnastego dnia tegoż miesiąca, na górach Ararad”, gdzieś w tej wyżynie. Gdy w 681 r. p.n.e. zamordowano Sennacheryba, „Adramelech i Sarassar, synowie jego, zabili go mieczem, a sami uciekli do ziemi Ararat”, czyli Armenii; Kronika babilońska zapisuje zabójstwo, a własny napis Asarhaddona mówi, że bracia uciekli do nieznanego kraju. Jeremiasz wzywa przeciw Babilonowi „królestwa Ararad, Minny, i Aschenas”, czyli Urartu, Mannejczyków i Scytów (tekst synodalny czyta Media zamiast Minni)."
    - "Na której górze spoczął korab, Biblia nie mówi. Berossos, cytowany przez Józefa Flawiusza, umieszczał jego szczątki w górach Kordyajskich, a tradycja żydowska, syryjska i wczesnomuzułmańska wskazywała górę Judi (Cudi Dağı) nad Tygrysem koło Cizre; od średniowiecza tradycja ormiańska ustaliła się na Masis, wulkanie o wysokości 5137 m, który Europejczycy nazywają górą Ararat. Wznosi się we wschodniej Turcji przy granicach Armenii i Iranu, a poszukiwania arki na jego zboczach nic nie dały. Dawne twierdze urartyjskie przetrwały w Wan, w Erebuni i Karmir Blur w Erywaniu oraz w Çavuştepe, a ziemię Ararat dzielą dziś Turcja, Armenia i północno-zachodni Iran."
  nl:
    - "Ararat is in de Bijbel een land, geen berg: de Hebreeuwse vorm van Urartu, het koninkrijk dat de Assyriërs kenden in het gebergte ten noorden van hen, rond het Vanmeer, van de negende tot de zevende eeuw v.Chr. Zijn koningen, Sarduri, Menua, Argishti en Rusa, regeerden vanuit Tushpa, de rots van Van, bouwden vestingen en kanalen, schreven in spijkerschrift en streden met Assyrië om de passen; Sargon II’s achtste veldtocht in 714 v.Chr., verteld in zijn brief aan de god Assur, bracht hun een zware slag toe; Urartu herstelde zich in de zevende eeuw, maar zijn vestingen werden rond 600 v.Chr. verwoest, en of het ten onder ging door de Meden of de Scythen, of later, is omstreden. De Armeniërs erfden het land, en de Septuaginta geeft de naam in Jesaja weer als Armenië, de King James Version zowel in Koningen als in Jesaja."
    - "Genesis zegt dat na de vloed “de ark rustte in de zevende maand, op den zeventienden dag der maand, op de bergen van Ararat”, ergens in dat hoogland. Toen Sanherib in 681 v.Chr. werd vermoord, gebeurde het “dat Adramelech en Sarezer, zijn zonen, hem met het zwaard versloegen; doch zij ontkwamen in het land van Ararat”, dat de King James Version Armenië noemt; de Babylonische kroniek vermeldt de moord, en Esarhaddons eigen inscriptie zegt dat de broers naar een onbekend land vluchtten. Jeremia roept tegen Babylon “de koninkrijken van Ararat, Minni en Askenaz” op, Urartu, de Mannaeërs en de Scythen (de Synodale tekst leest Medië voor Minni)."
    - "Op welke berg de ark tot rust kwam, zegt de Bijbel niet. Berossus, aangehaald door Josephus, plaatste de resten in het gebergte van de Kordyeeërs, en Joodse, Syrische en vroeg-islamitische overlevering wees naar de berg Judi (Cudi Dagi) boven de Tigris bij Cizre; vanaf de middeleeuwen koos de Armeense overlevering voor Masis, de vulkaan van 5137 m die Europeanen de berg Ararat noemen. Hij rijst op in Oost-Turkije bij de grenzen van Armenië en Iran, en de zoektocht naar de ark op zijn hellingen heeft niets opgeleverd. De oude Urartese vestingen bestaan nog bij Van, bij Erebuni en Karmir Blur in Yerevan en bij Cavustepe, en het land Ararat wordt tegenwoordig gedeeld door Turkije, Armenië en Noordwest-Iran."
  cs:
    - "Ararat je v Bibli země, nikoli vrchol: hebrejská podoba Urartu, království, které Asyřané znali v horách severně od sebe, kolem jezera Van, od 9. do 7. století př. n. l. Jeho králové, Sarduri, Menua, Argišti a Rusa, vládli z Tušpy, skály Vanu, stavěli pevnosti a kanály, psali klínovým písmem a bojovali s Asýrií o průsmyky; osmé tažení Sargona II. roku 714 př. n. l., vylíčené v jeho dopise bohu Aššurovi, jim zasadilo těžkou ránu; Urartu se v 7. století zotavilo, ale kolem roku 600 př. n. l. byly jeho pevnosti zničeny, a zda zaniklo pod Médy, nebo Skythy, či později, je sporné. Arméni zdědili zemi a Septuaginta překládá jméno jako Arménie v Izajášovi, Bible krále Jakuba v Knihách královských i Izajášovi."
    - "Genesis praví, že po potopě „odpočinul koráb sedmého měsíce, v sedmnáctý den toho měsíce na horách Ararat“, někde v oné vysočině. Když byl roku 681 př. n. l. zavražděn Senacherib, „Adramelech a Sarasar, synové jeho, zabili jej mečem, a sami utekli do země Ararat“, v Bibli krále Jakuba „Armenia“; babylonská kronika vraždu zaznamenává a Asarhadónův vlastní nápis praví, že bratři uprchli do neznámé země. Jeremjáš svolává proti Babylónu „království Ararat, Minni, Ascenez“, Urartu, Mannejce a Skythy (synodální text čte místo Minni Médii)."
    - "Na kterou horu koráb dosedl, Bible neříká. Berossos, citovaný Josephem Flaviem, kladl jeho zbytky do hor Kordyajců a židovská, syrská a raně muslimská tradice ukazovala na horu Júdí (Cudi Dağı) nad Tigridem u Cizre; od středověku se arménská tradice ustálila na Masisu, sopce vysoké 5137 m, kterou Evropané nazývají hora Ararat. Zdvihá se ve východním Turecku u hranic Arménie a Íránu a hledání korábu na jejích svazích nic nenašlo. Staré urartské pevnosti se zachovaly ve Vanu, v Erebuni a Karmir Blur v Jerevanu a v Çavuştepe a země Ararat je dnes rozdělena mezi Turecko, Arménii a severozápadní Írán."
