# Overview article (ADR 0007). Mainstream facts only; Pliny's list is given as his, and whether the cities formed a league is named as doubted.
id: decapolis
place: ae733a2
title:
  en: "Decapolis"
  ru: "Десятиградие"
  uk: "Десятимістя"
  es: "Decápolis"
  pt: "Decápolis"
  de: "Dekapolis"
  fr: "Décapole"
  it: "Decapoli"
