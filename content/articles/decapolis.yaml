body:
  en:
    - "The Decapolis, “ten cities”, was the Roman-period name for a group of Greek cities and their territories lying mostly east of the Jordan and the Sea of Galilee, with Scythopolis (Beth-shean) alone on the west bank. Pliny the Elder, noting that not everyone gave the same list, names Damascus, Philadelphia (the old Rabbah of Ammon), Raphana, Scythopolis, Gadara, Hippos, Dion, Pella, Gerasa and Canatha; Ptolemy a century later gave a longer list. They were Greek cities, several founded or refounded under Alexander's successors, islands of Hellenism among Jews, Nabataeans and Ituraeans. Alexander Jannaeus took many of them; Pompey in 63 BC freed them from Jewish rule and attached them to the province of Syria, and most dated their coins from that year. Whether they ever formed a league is doubted; the name may have meant no more than a region."
    - "The Gospels name it three times. Early in Jesus' ministry crowds followed him “from Galilee, and from Decapolis, and from Jerusalem, and from Judaea, and from beyond Jordan”. The man freed of the legion of demons in the country of the Gadarenes “began to publish in Decapolis how great things Jesus had done for him”. And returning from the region of Tyre and Sidon Jesus “came unto the sea of Galilee, through the midst of the coasts of Decapolis”, where he healed a deaf man with an impediment in his speech. In AD 66 Jewish bands attacked the cities of the Decapolis, and the people of Scythopolis slaughtered their own Jews; according to Eusebius the Christians of Jerusalem withdrew before the war to Pella. In 106 the southern cities passed into Trajan's province of Arabia."
    - "Today the ruins of Gerasa at Jerash, Gadara at Umm Qais and Pella at Tabaqat Fahl in Jordan, of Scythopolis at Beit She'an and Hippos at Sussita in Israel, and of Philadelphia beneath Amman's citadel are among the best-preserved Roman cities of the East, with colonnaded streets, theatres and temples; Damascus remains the capital of Syria."
  ru:
    - "Десятиградие, «десять городов», — название римского времени для группы греческих городов с их землями, лежавших большей частью к востоку от Иордана и Галилейского моря; на западном берегу был один Скифополь (Беф-Сан). Плиний Старший, замечая, что не все дают один и тот же перечень, называет Дамаск, Филадельфию (прежнюю Равву Аммонитскую), Рафану, Скифополь, Гадару, Гиппос, Дион, Пеллу, Герасу и Канафу; Птолемей столетием позже дал более длинный список. Это были греческие города, многие основанные или переустроенные при преемниках Александра, — островки эллинизма среди иудеев, набатеев и итурейцев. Александр Яннай взял многие из них; Помпей в 63 г. до н. э. освободил их от иудейской власти и приписал к провинции Сирия, и большинство вело счёт лет на монетах с этого года. Составляли ли они когда-нибудь союз, сомнительно; имя могло означать всего лишь область."
    - "Евангелия называют его трижды. В начале служения Иисуса за Ним шло множество народа «из Галилеи и Десятиградия, и Иерусалима, и Иудеи, и из-за Иордана». Человек, освобождённый от легиона бесов в стране Гадаринской, «начал проповедывать в Десятиградии, что сотворил с ним Иисус». А возвращаясь из пределов Тира и Сидона, Иисус «пошел к морю Галилейскому через пределы Десятиградия», где исцелил глухого косноязычного. В 66 г. н. э. иудейские отряды напали на города Десятиградия, а жители Скифополя перебили своих иудеев; по словам Евсевия, христиане Иерусалима перед войной ушли в Пеллу. В 106 году южные города вошли в провинцию Траяна Аравия."
    - "Сегодня развалины Герасы в Джераше, Гадары в Умм-Кайсе и Пеллы в Табакат-Фахле в Иордании, Скифополя в Бейт-Шеане и Гиппоса в Суссите в Израиле и Филадельфии под цитаделью Аммана — среди лучше всего сохранившихся римских городов Востока, с колоннадными улицами, театрами и храмами; Дамаск остаётся столицей Сирии."
  uk:
    - "Десятимістя, «десять міст», було римською назвою групи грецьких міст і їхніх територій, що лежали здебільшого на схід від Йордану та Галілейського моря, і лише Скіфополь (Бет-Шеан) стояв на західному березі. Пліній Старший, зазначаючи, що не всі наводили однаковий перелік, називає Дамаск, Філадельфію (давню Равву Аммонову), Рафану, Скіфополь, Гадару, Гіппос, Діон, Пеллу, Герасу і Канат; Птолемей століттям пізніше дав довший перелік. Це були грецькі міста, кілька з яких заснували або перезаснували наступники Александра, острови еллінізму серед юдеїв, набатеїв та ітуреїв. Александр Яннай захопив багато з них; Помпей у 63 р. до н. е. звільнив їх від юдейської влади й приєднав до провінції Сирія, і більшість рахувала дати на своїх монетах від того року. Чи утворювали вони коли-небудь союз, сумнівно; назва могла означати не більше ніж область."
    - "Євангелія називають її тричі. На початку служіння Ісуса юрби йшли за Ним «з Галилеї, й з Десятиграду, й з Єрусалиму, й з Юдеї, й зза Йордану». Чоловік, звільнений від легіону бісів у країні гадаринців, «почав проповідувати в Десятиградї, що зробив йому Ісус». І повертаючись з околиць Тиру й Сидону, Ісус «прийшов до моря Галилейського, у гряницї Десятиградські», де зцілив глухого й тяжкомовного. У 66 р. н. е. юдейські загони напали на міста Десятимістя, а жителі Скіфополя вирізали власних юдеїв; за Євсевієм, християни Єрусалима перед війною відійшли до Пелли. У 106 р. південні міста перейшли до Траянової провінції Аравія."
    - "Сьогодні руїни Гераси в Джераші, Гадари в Умм-Кайсі та Пелли в Табакат-Фахлі в Йорданії, Скіфополя в Бет-Шеані та Гіппоса в Сусіті в Ізраїлі, а також Філадельфії під цитаделлю Амману належать до найкраще збережених римських міст Сходу, з колонадними вулицями, театрами й храмами; Дамаск і досі є столицею Сирії."
  es:
    - "La Decápolis, «diez ciudades», era el nombre en época romana de un grupo de ciudades griegas y sus territorios situados sobre todo al este del Jordán y del mar de Galilea, con solo Escitópolis (Betsán) en la orilla occidental. Plinio el Viejo, que observa que no todos daban la misma lista, nombra Damasco, Filadelfia (la antigua Rabá de Amón), Rafana, Escitópolis, Gadara, Hipos, Dión, Pella, Gerasa y Canata; Tolomeo, un siglo después, dio una lista más larga. Eran ciudades griegas, varias fundadas o refundadas bajo los sucesores de Alejandro, islotes de helenismo entre judíos, nabateos e itureos. Alejandro Janeo tomó muchas de ellas; Pompeyo en el 63 a. C. las liberó del dominio judío y las agregó a la provincia de Siria, y la mayoría fechó sus monedas desde ese año. Se duda de que llegaran a formar una liga; el nombre pudo no significar más que una región."
    - "Los Evangelios la nombran tres veces. Al comienzo del ministerio de Jesús, las multitudes lo siguieron «de Galilea y de Decápolis y de Jerusalem y de Judea y de la otra parte del Jordán». El hombre liberado de la legión de demonios en la tierra de los gadarenos «comenzó á publicar en Decápolis cuán grandes cosas Jesús había hecho con él». Y al regresar de la región de Tiro y Sidón, Jesús «vino por Sidón á la mar de Galilea, por mitad de los términos de Decápolis», donde sanó a un sordo y tartamudo. En el 66 d. C. bandas judías atacaron las ciudades de la Decápolis, y los habitantes de Escitópolis degollaron a sus propios judíos; según Eusebio, los cristianos de Jerusalén se retiraron antes de la guerra a Pella. En el 106 las ciudades del sur pasaron a la provincia de Arabia de Trajano."
    - "Hoy las ruinas de Gerasa en Jerash, de Gadara en Umm Qais y de Pella en Tabaqat Fahl, en Jordania, de Escitópolis en Beit She'an y de Hipos en Sussita, en Israel, y de Filadelfia bajo la ciudadela de Amán figuran entre las ciudades romanas mejor conservadas de Oriente, con calles con columnatas, teatros y templos; Damasco sigue siendo la capital de Siria."
  pt:
    - "A Decápolis, “dez cidades”, era o nome, no período romano, de um grupo de cidades gregas e seus territórios situados sobretudo a leste do Jordão e do Mar da Galileia, com Citópolis (Bete-Seã) sozinha na margem oeste. Plínio, o Velho, observando que nem todos davam a mesma lista, nomeia Damasco, Filadélfia (a antiga Rabá de Amom), Rafana, Citópolis, Gadara, Hipos, Dion, Pela, Gerasa e Canata; Ptolomeu, um século depois, deu uma lista mais longa. Eram cidades gregas, várias fundadas ou refundadas sob os sucessores de Alexandre, ilhas de helenismo entre judeus, nabateus e itureus. Alexandre Janeu tomou muitas delas; Pompeu, em 63 a.C., as libertou do domínio judeu e as anexou à província da Síria, e a maioria datava suas moedas a partir desse ano. Se chegaram a formar uma liga é duvidoso; o nome pode ter designado apenas uma região."
    - "Os Evangelhos a nomeiam três vezes. No início do ministério de Jesus, multidões o seguiram “da Galileia, de Decápolis, de Jerusalém, da Judeia e do outro lado do Jordão”. O homem libertado da legião de demônios na terra dos gadarenos “começou a proclamar em Decápolis tudo o que Jesus havia feito por ele”. E, ao voltar da região de Tiro e Sidom, Jesus “foi para o mar da Galileia, passando pelo meio da região de Decápolis”, onde curou um surdo com dificuldade de fala. Em 66 d.C., bandos judeus atacaram as cidades da Decápolis, e o povo de Citópolis massacrou os próprios judeus; segundo Eusébio, os cristãos de Jerusalém retiraram-se antes da guerra para Pela. Em 106, as cidades do sul passaram à província da Arábia de Trajano."
    - "Hoje as ruínas de Gerasa em Jerash, de Gadara em Umm Qais e de Pela em Tabaqat Fahl, na Jordânia, de Citópolis em Beit She'an e de Hipos em Sussita, em Israel, e de Filadélfia sob a cidadela de Amã estão entre as cidades romanas mais bem conservadas do Oriente, com ruas colunadas, teatros e templos; Damasco continua capital da Síria."
  de:
    - "Die Dekapolis, die „Zehn Städte“, war in römischer Zeit der Name für eine Gruppe griechischer Städte samt Gebieten, überwiegend östlich des Jordan und des Sees Genezareth, mit Skythopolis (Bet-Schean) allein am Westufer. Plinius der Ältere, der anmerkt, dass die Listen abwichen, nennt Damaskus, Philadelphia (das alte Rabba von Ammon), Raphana, Skythopolis, Gadara, Hippos, Dion, Pella, Gerasa und Kanatha; Ptolemäus gab ein Jahrhundert später eine längere Liste. Es waren griechische Städte, mehrere unter Alexanders Nachfolgern (neu) gegründet, Inseln des Hellenismus unter Juden, Nabatäern und Ituräern. Alexander Jannäus nahm viele ein; Pompeius befreite sie 63 v. Chr. von der jüdischen Herrschaft und schloss sie Syrien an, die meisten datierten ihre Münzen von da an. Ob sie je einen Bund bildeten, ist zweifelhaft; der Name mag nur eine Region bezeichnet haben."
    - "Die Evangelien nennen sie dreimal. Zu Beginn von Jesu Wirken folgte ihm viel Volk „aus Galiläa, aus den Zehn-Städten, von Jerusalem, aus dem jüdischen Lande und von jenseits des Jordans“. Der von der Legion Dämonen befreite Mann im Land der Gadarener „fing an, auszurufen in den zehn Städten, wie große Wohltat ihm Jesus getan hatte“. Und als Jesus aus der Gegend von Tyrus und Sidon zurückkehrte, „kam er an das Galiläische Meer, mitten in das Gebiet der zehn Städte“, wo er einen Tauben heilte, der schwer sprach. Im Jahr 66 n. Chr. griffen jüdische Banden die Städte der Dekapolis an, und die Einwohner von Skythopolis schlachteten ihre eigenen Juden ab; nach Eusebius zogen sich die Christen Jerusalems vor dem Krieg nach Pella zurück. Im Jahr 106 gingen die südlichen Städte in Trajans Provinz Arabien über."
    - "Heute gehören die Ruinen von Gerasa in Dscharasch, Gadara in Umm Qais und Pella in Tabaqat Fahl in Jordanien, von Skythopolis in Bet Schean und Hippos in Sussita in Israel und von Philadelphia unter der Zitadelle von Amman zu den besterhaltenen römischen Städten des Ostens, mit Säulenstraßen, Theatern und Tempeln; Damaskus ist weiterhin die Hauptstadt Syriens."
  fr:
    - "La Décapole, « dix villes », est le nom donné à l’époque romaine à un groupe de villes grecques et de leurs territoires situés surtout à l’est du Jourdain et de la Mer de Galilée, Scythopolis (Beth-Schean) étant seule sur la rive ouest. Pline l’Ancien, notant que les listes variaient, cite Damas, Philadelphie (l’ancienne Rabba d’Ammon), Raphana, Scythopolis, Gadara, Hippos, Dion, Pella, Gérasa et Canatha ; Ptolémée, un siècle plus tard, en donna davantage. Villes grecques, plusieurs fondées ou refondées sous les successeurs d’Alexandre, îlots d’hellénisme parmi les Juifs, les Nabatéens et les Ituréens. Alexandre Jannée en prit beaucoup ; Pompée, en 63 av. J.-C., les libéra de la domination juive et les rattacha à la Syrie, et la plupart datèrent leurs monnaies de cette année. On doute qu’elles aient jamais formé une ligue ; le nom a pu ne désigner qu’une région."
    - "Les Évangiles la nomment trois fois. Au début du ministère de Jésus, des foules le suivirent « de la Galilée, de la Décapole, de Jérusalem, de la Judée, et d’au delà du Jourdain ». L’homme délivré de la légion de démons dans le pays des Gadaréniens « se mit à publier dans la Décapole tout ce que Jésus avait fait pour lui ». Et quand Jésus revint de la région de Tyr et de Sidon, ce fut « vers la mer de Galilée, en traversant le pays de la Décapole », où il guérit un sourd qui parlait avec peine. En 66 apr. J.-C., des bandes juives attaquèrent les villes de la Décapole, et les habitants de Scythopolis massacrèrent leurs propres Juifs ; selon Eusèbe, les chrétiens de Jérusalem se retirèrent avant la guerre à Pella. En 106, les villes du sud passèrent dans la province d’Arabie de Trajan."
    - "Aujourd’hui, les ruines de Gérasa à Jerash, de Gadara à Umm Qais et de Pella à Tabaqat Fahl, en Jordanie, de Scythopolis à Beit She’an et d’Hippos à Sussita, en Israël, et de Philadelphie sous la citadelle d’Amman comptent parmi les villes romaines les mieux conservées de l’Orient, avec rues à colonnades, théâtres et temples ; Damas reste la capitale de la Syrie."
  it:
    - "La Decapoli, «dieci città», era il nome d’epoca romana di un gruppo di città greche e dei loro territori situati per lo più a est del Giordano e del Lago di Tiberiade, con la sola Scitopoli (Beth-Shean) sulla riva occidentale. Plinio il Vecchio, notando che non tutti davano lo stesso elenco, nomina Damasco, Filadelfia (l’antica Rabba di Ammon), Rafana, Scitopoli, Gadara, Ippo, Dion, Pella, Gerasa e Canata; Tolomeo un secolo dopo diede un elenco più lungo. Erano città greche, parecchie fondate o rifondate sotto i successori di Alessandro, isole di ellenismo fra Ebrei, Nabatei e Iturei. Alessandro Ianneo ne prese molte; Pompeo nel 63 a.C. le liberò dal dominio ebraico e le unì alla provincia di Siria, e la maggior parte contava le sue monete da quell’anno. Si dubita che abbiano mai formato una lega; il nome può non aver significato più di una regione."
    - "I Vangeli la nominano tre volte. All’inizio del ministero di Gesù la folla lo seguì «dalla Galilea e dalla Decapoli e da Gerusalemme e dalla Giudea e d’oltre il Giordano». L’uomo liberato dalla legione di demòni nel paese dei Gadareni «cominciò a pubblicare per la Decapoli le grandi cose che Gesù aveva fatto per lui». E tornando dalla regione di Tiro e Sidone Gesù «tornò verso il mar di Galilea traversando il territorio della Decapoli», dove guarì un sordo che parlava a stento. Nel 66 d.C. bande ebraiche attaccarono le città della Decapoli, e gli abitanti di Scitopoli massacrarono i propri Ebrei; secondo Eusebio i cristiani di Gerusalemme si ritirarono prima della guerra a Pella. Nel 106 le città meridionali passarono nella provincia d’Arabia di Traiano."
    - "Oggi le rovine di Gerasa a Jerash, di Gadara a Umm Qais e di Pella a Tabaqat Fahl in Giordania, di Scitopoli a Beit She’an e di Ippo a Sussita in Israele, e di Filadelfia sotto la cittadella di Amman sono fra le città romane meglio conservate dell’Oriente, con strade colonnate, teatri e templi; Damasco resta la capitale della Siria."
  pl:
    - "Dekapol, „dziesięć miast”, było rzymską nazwą grupy greckich miast i ich terytoriów leżących głównie na wschód od Jordanu i Jeziora Galilejskiego, z samą Scytopolis (Bet-Szean) na zachodnim brzegu. Pliniusz Starszy, zaznaczając, że nie wszyscy podawali tę samą listę, wymienia Damaszek, Filadelfię (dawną Rabbę Ammonu), Rafanę, Scytopolis, Gadarę, Hippos, Dion, Pellę, Gerasę i Kanatę; Ptolemeusz sto lat później podał dłuższą listę. Były to miasta greckie, kilka założonych lub założonych na nowo za następców Aleksandra, wyspy hellenizmu wśród Żydów, Nabatejczyków i Iturejczyków. Aleksander Janneusz zajął wiele z nich; Pompejusz w 63 r. p.n.e. uwolnił je spod władzy żydowskiej i przyłączył do prowincji Syria, a większość liczyła od tego roku daty na monetach. Czy kiedykolwiek tworzyły związek, jest wątpliwe; nazwa mogła oznaczać tylko region."
    - "Ewangelie wymieniają go trzy razy. Na początku działalności Jezusa tłumy szły za nim „z Galilei, z dziesięciu miast, i z Jeruzalemu, i z Judzkiej ziemi, i zza Jordanu”. Człowiek uwolniony od legionu demonów w kraju Gadareńczyków „począł opowiadać w dziesięciu miastach, jako mu wielkie rzeczy uczynił Jezus”. A wracając z okolic Tyru i Sydonu, Jezus „przyszedł nad morze Galilejskie, pośrodkiem granic dziesięciu miast”, gdzie uzdrowił głuchego, który z trudem mówił. W 66 r. n.e. żydowskie bandy napadły na miasta Dekapolu, a mieszkańcy Scytopolis wymordowali własnych Żydów; według Euzebiusza chrześcijanie z Jerozolimy wycofali się przed wojną do Pelli. W 106 r. miasta południowe weszły do prowincji Arabii Trajana."
    - "Dziś ruiny Gerasy w Dżerasz, Gadary w Umm Kajs i Pelli w Tabakat Fahl w Jordanii, Scytopolis w Bet Szean i Hippos w Susicie w Izraelu oraz Filadelfii pod cytadelą Ammanu należą do najlepiej zachowanych rzymskich miast Wschodu, z ulicami kolumnowymi, teatrami i świątyniami; Damaszek pozostaje stolicą Syrii."
  nl:
    - "De Dekapolis, “tien steden”, was in de Romeinse tijd de naam van een groep Griekse steden met hun gebied, meest ten oosten van de Jordaan en het Meer van Galilea, met alleen Scythopolis (Beth-Sean) aan de westoever. Plinius de Oudere, die opmerkt dat niet iedereen dezelfde lijst gaf, noemt Damascus, Filadelfia (het oude Rabba van Ammon), Raphana, Scythopolis, Gadara, Hippos, Dion, Pella, Gerasa en Canatha; Ptolemaeus gaf een eeuw later een langere lijst. Het waren Griekse steden, enkele gesticht of herbouwd onder Alexanders opvolgers, eilanden van hellenisme te midden van Joden, Nabateeërs en Ituréeërs. Alexander Jannaeus nam er veel in; Pompeius bevrijdde ze in 63 v.Chr. van Joods bewind en voegde ze bij de provincie Syrië, en de meeste telden hun munten vanaf dat jaar. Of ze ooit een bond vormden is twijfelachtig; de naam kan slechts een streek hebben aangeduid."
    - "De evangeliën noemen haar driemaal. Vroeg in Jezus' optreden volgden hem scharen “van Galilea en van Dekapolis, en van Jeruzalem, en van Judea, en van over de Jordaan”. De man die van het legioen demonen was bevrijd in het land der Gadarenen “begon te verkondigen in het land van Dekapolis, wat grote dingen hem Jezus gedaan had”. En terugkerend uit het gebied van Tyrus en Sidon “kwam” Jezus “aan de zee van Galilea, door het midden der landpalen van Dekapolis”, waar hij een dove met een spraakgebrek genas. In 66 n.Chr. vielen Joodse benden de steden van de Dekapolis aan, en de bevolking van Scythopolis slachtte haar eigen Joden af; volgens Eusebius trokken de christenen van Jeruzalem vóór de oorlog naar Pella. In 106 kwamen de zuidelijke steden in Trajanus' provincie Arabië."
    - "Tegenwoordig behoren de ruïnes van Gerasa bij Jerash, Gadara bij Umm Qais en Pella bij Tabaqat Fahl in Jordanië, van Scythopolis bij Beit She'an en Hippos bij Sussita in Israël, en van Filadelfia onder de citadel van Amman tot de best bewaarde Romeinse steden van het Oosten, met zuilenstraten, theaters en tempels; Damascus blijft de hoofdstad van Syrië."
  cs:
    - "Dekapolis, „deset měst“, bylo v římské době jméno skupiny řeckých měst a jejich území ležících většinou východně od Jordánu a Galilejského jezera, přičemž samotná Skythopolis (Bét-šan) leží na západním břehu. Plinius Starší, který poznamenává, že ne všichni uváděli stejný seznam, jmenuje Damašek, Filadelfii (starou Rabbu Amónskou), Raphanu, Skythopolis, Gadaru, Hippos, Dion, Pellu, Gerasu a Kanatu; Ptolemaios o století později podal delší seznam. Byla to řecká města, několik z nich založených nebo obnovených za nástupců Alexandrových, ostrovy helénismu mezi Židy, Nabatejci a Ituřany. Alexandr Jannaios mnohá z nich dobyl; Pompeius je roku 63 př. n. l. osvobodil od židovské vlády a připojil k provincii Sýrie a většina z nich datovala své mince od onoho roku. Zda kdy tvořila spolek, je pochybné; jméno mohlo znamenat jen oblast."
    - "Evangelia je jmenují třikrát. Na počátku Ježíšova působení šly za ním zástupy „z Galilee a z krajiny Desíti měst, i z Jeruzaléma i z Judstva i z Zajordání“. Muž osvobozený od legie démonů v kraji Gadarských „počal ohlašovati v krajině Desíti měst, kterak veliké věci učinil mu Ježíš“. A vraceje se z končin Týru a Sidónu, Ježíš „přišel k moři Galilejskému, prostředkem krajin Desíti měst“, kde uzdravil hluchého s vadou řeči. Roku 66 n. l. napadly židovské oddíly města Dekapolis a obyvatelé Skythopolis pobili své vlastní Židy; podle Eusebia se křesťané Jeruzaléma před válkou stáhli do Pelly. Roku 106 přešla jižní města do Traianovy provincie Arábie."
    - "Dnes jsou zříceniny Gerasy v Jerash, Gadary v Umm Qais a Pelly v Tabaqat Fahl v Jordánsku, Skythopolis v Beit She'an a Hippu v Sussita v Izraeli a Filadelfie pod citadelou v Ammánu mezi nejlépe dochovanými římskými městy Východu, se sloupovými ulicemi, divadly a chrámy; Damašek zůstává hlavním městem Sýrie."
  sv:
    - "Dekapolis, ”de tio städerna”, var under romersk tid namnet på en grupp grekiska städer med sina områden, mestadels öster om Jordan och Galileiska sjön, med enbart Skythopolis (Bet-Shean) på västra stranden. Plinius den äldre, som noterar att inte alla gav samma förteckning, nämner Damaskus, Filadelfia (det gamla Ammons Rabba), Raphana, Skythopolis, Gadara, Hippos, Dion, Pella, Gerasa och Kanata; Ptolemaios gav ett sekel senare en längre lista. Det var grekiska städer, flera grundade eller återgrundade under Alexanders efterträdare, öar av hellenism bland judar, nabatéer och itureer. Alexander Jannaios intog många av dem; Pompejus befriade dem 63 f.Kr. från judiskt välde och förde dem till provinsen Syrien, och de flesta räknade sina mynt från det året. Om de någonsin bildade ett förbund är tveksamt; namnet kan ha betytt ingenting mer än en region."
    - "Evangelierna nämner den tre gånger. Tidigt i Jesu verksamhet följde folkskaror honom ”ifrån Galileen och Dekapolis och Jerusalem och Judeen och från landet på andra sidan Jordan”. Mannen som befriats från legionen av demoner i gerasenernas land ”begynte förkunna i Dekapolis huru stora ting Jesus hade gjort med honom”. Och när Jesus kom tillbaka från Tyros och Sidon kom han, ”genom Dekapolis’ område, till Galileiska sjön”, där han botade en döv man med talsvårigheter. År 66 e.Kr. angrep judiska band Dekapolis städer, och folket i Skythopolis slaktade sina egna judar; enligt Eusebios drog Jerusalems kristna sig före kriget tillbaka till Pella. År 106 övergick de södra städerna till Trajanus provins Arabien."
    - "I dag hör ruinerna av Gerasa vid Jerash, Gadara vid Umm Qais och Pella vid Tabaqat Fahl i Jordanien, av Skythopolis vid Beit She’an och Hippos vid Sussita i Israel, och av Filadelfia under Ammans citadell till Österlandets bäst bevarade romerska städer, med kolonnadgator, teatrar och tempel; Damaskus är fortfarande Syriens huvudstad."
  nb:
    - "Dekapolis, «ti byer», var romertidens navn på en gruppe greske byer og deres områder som for det meste lå øst for Jordan og Galileasjøen, med Skytopolis (Bet-Sjean) alene på vestbredden. Plinius den eldre, som bemerker at ikke alle gav samme liste, nevner Damaskus, Filadelfia (det gamle Rabba i Ammon), Raphana, Skytopolis, Gadara, Hippos, Dion, Pella, Gerasa og Kanatha; Ptolemaios gav et århundre senere en lengre liste. Det var greske byer, flere grunnlagt eller gjengrunnlagt under Aleksanders etterfølgere, hellenismens øyer blant jøder, nabateere og itureere. Aleksander Jannaios tok mange av dem; Pompeius løste dem i 63 f.Kr. fra jødisk herredømme og knyttet dem til provinsen Syria, og de fleste daterte sine mynter fra det året. Om de noen gang dannet et forbund, er tvilsomt; navnet kan ha betydd ikke mer enn en region."
    - "Evangeliene nevner den tre ganger. Tidlig i Jesu virke fulgte folkemengder ham «fra Galilea og Dekapolis og Jerusalem og Judea og landet hinsides Jordan». Mannen som ble fridd fra legionen av demoner i gadarenernes land, «begynte å kunngjøre i Dekapolis hvor store ting Jesus hadde gjort imot ham». Og på vei tilbake fra området ved Tyros og Sidon kom Jesus «gjennem Sidon til den Galileiske Sjø, midt igjennem Dekapolis-landet», der han helbredet en mann som var døv og hadde ondt for å tale. I 66 e.Kr. angrep jødiske bander byene i Dekapolis, og folket i Skytopolis slaktet sine egne jøder; ifølge Eusebius trakk de kristne i Jerusalem seg før krigen tilbake til Pella. I 106 gikk de sørlige byene over til Trajans provins Arabia."
    - "I dag er ruinene av Gerasa ved Jerash, Gadara ved Umm Qais og Pella ved Tabaqat Fahl i Jordan, av Skytopolis ved Beit She'an og Hippos ved Sussita i Israel, og av Filadelfia under citadellet i Amman blant de best bevarte romerske byene i Østen, med gater med søylegang, teatre og templer; Damaskus er fremdeles Syrias hovedstad."
  tl:
    - "Ang Decapolis, “sampung lungsod”, ay pangalang Romano para sa pangkat ng mga lungsod na Griyego at kanilang lupain, karamihan sa silangan ng Jordan at Dagat ng Galilea, na ang Scythopolis (Beth-san) lamang ang nasa kanlurang pampang. Pinangalanan ni Plinio na Nakatatanda, na nagsabing magkakaiba ang talaan, ang Damasco, Filadelfia (ang dating Rabba ng Ammon), Raphana, Scythopolis, Gadara, Hippos, Dion, Pella, Gerasa at Canatha; mas mahaba ang talaan ni Ptolemeo pagkaraan ng isang siglo. Ang ilan ay itinatag ng mga kahalili ni Alejandro, mga pulo ng Helenismo sa gitna ng mga Judio, Nabateo at Iturea. Kinuha ni Alejandro Janeo ang marami; pinalaya sila ni Pompeyo noong 63 BK mula sa pamamahalang Judio at iniugnay sa Siria, at karamihan ay nagpetsa ng barya mula noon. Pinagdududahan kung nagkaroon sila ng liga; maaaring rehiyon lamang ang kahulugan ng pangalan."
    - "Tatlong ulit itong nasa mga Ebanghelyo. Sa simula ng ministeryo ni Jesus, sinundan siya ng karamihan “mula sa Galilea at Decapolis at Jerusalem at Judea at mula sa dakong ibayo ng Jordan”. Ang lalaking pinalaya sa lehiyon ng mga demonyo sa lupain ng mga Gadareno ay “nagpasimulang ihayag sa Decapolis kung gaanong kadakilang mga bagay ang sa kaniya'y ginawa ni Jesus”. At pagbalik mula sa rehiyon ng Tiro at Sidon, si Jesus ay lumakad “hanggang sa dagat ng Galilea, na kaniyang tinahak ang mga hangganan ng Decapolis”, kung saan pinagaling niya ang bingi at utal. Noong 66 AD, sinalakay ng mga pangkat Judio ang mga lungsod nito, at pinatay ng mga taga-Scythopolis ang sarili nilang mga Judio; ayon kay Eusebio, umatras ang mga Kristiyano ng Jerusalem bago ang digmaan sa Pella. Noong 106, ang mga lungsod sa timog ay napunta sa lalawigan ng Arabia ni Trajano."
    - "Ngayon, ang mga guho ng Gerasa sa Jerash, Gadara sa Umm Qais at Pella sa Tabaqat Fahl sa Jordan, ng Scythopolis sa Beit She'an at Hippos sa Sussita sa Israel, at ng Filadelfia sa ilalim ng citadel ng Amman ay kabilang sa pinakamahusay na napanatiling lungsod Romano sa Silangan, na may mga lansangang may hanay ng haligi, dulaan at templo; ang Damasco ay nananatiling kabisera ng Siria."
  da:
    - "Dekapolis, »ti byer«, var den romerske tids navn for en gruppe græske byer med deres områder, der for det meste lå øst for Jordan og Genesaret Sø, med Skythopolis (Bet-Sjan) alene på vestbredden. Plinius den Ældre, der bemærker, at ikke alle gav den samme liste, nævner Damaskus, Filadelfia (det gamle Rabba i Ammon), Raphana, Skythopolis, Gadara, Hippos, Dion, Pella, Gerasa og Kanata; Ptolemaios gav et århundrede senere en længere liste. Det var græske byer, flere grundlagt eller genoprettet under Alexanders efterfølgere, hellenismens øer blandt jøder, nabatæere og iturææere. Alexander Jannæus indtog mange af dem; Pompejus befriede dem i 63 f.Kr. fra jødisk herredømme og lagde dem under provinsen Syrien, og de fleste daterede deres mønter fra det år. Om de nogensinde dannede et forbund, er tvivlsomt; navnet har måske ikke betydet mere end en region."
    - "Evangelierne nævner den tre gange. Tidligt i Jesu virke fulgte skarer ham »fra Galilæa og Dekapolis og Jerusalem og Judæa og fra Landet hinsides Jordan«. Manden, der blev befriet for legionen af dæmoner i gadarenernes land, »begyndte at kundgøre i Dekapolis, hvor store Ting Jesus havde gjort imod ham«. Og da Jesus vendte tilbage fra Tyrus' og Sidons egn, kom han »midt igennem Dekapolis's Egne til Galilæas Sø«, hvor han helbredte en døv, der havde svært ved at tale. I 66 e.Kr. angreb jødiske bander Dekapolis' byer, og Skythopolis' folk slagtede deres egne jøder; ifølge Eusebius trak Jerusalems kristne sig før krigen tilbage til Pella. I 106 gik de sydlige byer over i Trajans provins Arabien."
    - "I dag hører ruinerne af Gerasa ved Jerash, Gadara ved Umm Qais og Pella ved Tabaqat Fahl i Jordan, af Skythopolis ved Beit She'an og Hippos ved Sussita i Israel og af Filadelfia under Ammans citadel til Østens bedst bevarede romerske byer, med søjlegader, teatre og templer; Damaskus er stadig Syriens hovedstad."
  sr:
    - "Декаполис, „десет градова“, био је назив у римско доба за групу грчких градова и њихових територија који су лежали углавном источно од Јордана и Галилејског мора, са Скитопољем (Вет-Саном) једином на западној обали. Плиније Старији, напомињући да сви нису давали исти списак, именује Дамаск, Филаделфију (стару Раву Амонову), Рафану, Скитопољ, Гадару, Хипос, Дион, Пелу, Герасу и Канату; Птолемеј је век касније дао дужи списак. То су били грчки градови, неколико основаних или поново основаних под Александровим наследницима, острва хеленизма међу Јеврејима, Набатејцима и Итурејцима. Александар Јанеј узео је многе од њих; Помпеј их је 63. п. н. е. ослободио јеврејске власти и прикључио провинцији Сирији, а већина је од те године датирала свој новац. Сумња се да су икада чинили савез; име је можда значило само област."
    - "Јеванђеља га именују три пута. Рано у Исусовој служби мноштво га је следило „из Галилеје, и из Десет Градова, и из Јерусалима, и Јудеје, и испреко Јордана“. Човек ослобођен легије демона у гадаринском крају „поче приповедати у Десет градова шта му учини Исус“. А враћајући се из тирског и сидонског краја Исус „дође на море галилејско у крајеве десетоградске“, где је исцелио глувог човека са говорном маном. Године 66. н. е. јеврејске чете нападале су градове Декаполиса, а становници Скитопоља поклали су своје Јевреје; према Јевсевију, хришћани Јерусалима повукли су се пред рат у Пелу. Године 106. јужни градови прешли су у Трајанову провинцију Арабију."
    - "Данас рушевине Гераса у Џерашу, Гадаре у Ум Кеису и Пеле у Табакат Фахлу у Јордану, Скитопоља у Бет Шеану и Хипоса у Сусити у Израелу и Филаделфије испод аманске цитаделе спадају међу најбоље очуване римске градове Истока, с улицама са колонадама, позориштима и храмовима; Дамаск је и даље престоница Сирије."
