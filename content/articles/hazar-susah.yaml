# Overview article (ADR 0007). Mainstream facts only; Hazar-susah is unlocated; the equation with Sansannah and the Sbalat Abu Susein proposal are given as proposals; the chariot-town reading is an interpretation and is said so.
id: hazar-susah
place: ab270f6
