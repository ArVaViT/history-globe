body:
  en:
    - "Hazar-susah, “enclosure of the mare”, is a town of Simeon in the far south of Canaan, listed in Joshua among the towns of Simeon's lot inside Judah: “And Ziklag, and Beth-marcaboth, and Hazar-susah”. Chronicles repeats the list with the form Hazar-susim, “enclosure of horses”, and adds: “These were their cities unto the reign of David.” Because it stands beside Beth-marcaboth, “house of chariots”, some have thought of a station for chariots and horses on the southern roads, perhaps in the days of Solomon, but that is a guess from the names."
    - "Nothing else is known. In Judah's own list of southern towns the same slot is held by Sansannah, and many scholars take the two names for one place, as the map does; another proposal is Sbalat Abu Susein in the western Negeb, chosen for the echo of the name. Neither has been confirmed by excavation, and the town appears in no other text."
  ru:
    - "Хацар-Суса, «двор кобылицы», — город Симеона на крайнем юге Ханаана, который книга Иисуса Навина числит среди городов удела Симеона внутри Иуды: «Циклаг, Беф-Маркавоф и Хацар-Суса». Паралипоменон повторяет список с формой Хацарсусим, «двор коней», и добавляет: «Вот города их до царствования Давидова». Поскольку он стоит рядом с Беф-Маркавофом, «домом колесниц», некоторые думали о стоянке колесниц и коней на южных дорогах, быть может, во дни Соломона, но это догадка по именам."
    - "Больше ничего не известно. В собственном списке южных городов Иуды на том же месте стоит Сансана, и многие исследователи считают оба имени одним местом, как и карта; по другому предположению, это Сбалат-Абу-Сусейн в западном Негеве, выбранный по созвучию имени. Ни то ни другое раскопками не подтверждено, и ни в одном другом тексте город не упоминается."
  uk:
    - "Хацар-Суса, «огорожа кобили», — місто Симеона на крайньому півдні Ханаану, перелічене в Книзі Ісуса Навина серед міст Симеонового жереба всередині Юди: «Зиклаг, Бет-Маркабот і Газар-Суса». Хроніки повторюють перелік у формі Хацар-Сусім, «огорожа коней», і додають: «Оце міста їх до Давидового царювання». Оскільки воно стоїть поряд з Бет-Маркаботом, «домом колісниць», дехто думав про станцію для колісниць і коней на південних дорогах, можливо, за днів Соломона, але це припущення з назв."
    - "Більше нічого невідомо. У власному переліку південних міст Юди те саме місце займає Сансана, і багато дослідників вважають ці дві назви одним місцем, як і карта; інша пропозиція — Сбалат-Абу-Сусейн у західному Негеві, обраний за відлуння назви. Жодне не підтверджене розкопками, і місто не з’являється в жодному іншому тексті."
  es:
    - "Hazar-susa, «recinto de la yegua», es una población de Simeón en el extremo sur de Canaán, enumerada en Josué entre las ciudades de la suerte de Simeón dentro de Judá: «Siclag, Beth-marchâboth, y Hasar-susa». Crónicas repite la lista con la forma Hazar-susim, «recinto de caballos», y añade: «Estas fueron sus ciudades hasta el reino de David». Como está junto a Bet-marcabot, «casa de los carros», algunos han pensado en una estación de carros y caballos en los caminos del sur, quizá en tiempos de Salomón, pero eso es una conjetura a partir de los nombres."
    - "No se sabe nada más. En la propia lista de ciudades meridionales de Judá, el mismo lugar lo ocupa Sansana, y muchos estudiosos toman los dos nombres por un solo lugar, como hace el mapa; otra propuesta es Sbalat Abu Susein, en el Néguev occidental, elegida por el eco del nombre. Ninguna se ha confirmado por excavación, y la población no aparece en ningún otro texto."
  pt:
    - "Hazar-Susa, “recinto da égua”, é uma cidade de Simeão no extremo sul de Canaã, listada em Josué entre as cidades da porção de Simeão dentro de Judá: “Ziclague, Bete-Marcabote, Hazar-Susa”. Crônicas repete a lista com a forma Hazar-Susim, “recinto de cavalos”, e acrescenta: “Estas foram as suas cidades até o reinado de Davi.” Por estar ao lado de Bete-Marcabote, “casa de carros”, alguns pensaram numa estação de carros e cavalos nas estradas do sul, talvez nos dias de Salomão, mas isso é conjectura a partir dos nomes."
    - "Nada mais se sabe. Na lista própria de Judá das cidades do sul, o mesmo lugar é ocupado por Sansana, e muitos estudiosos tomam os dois nomes por um só lugar, como faz o mapa; outra proposta é Sbalat Abu Susein, no Neguebe ocidental, escolhida pelo eco do nome. Nenhuma foi confirmada por escavação, e a cidade não aparece em nenhum outro texto."
  de:
    - "Hazar-Susa, „Gehöft der Stute“, ist eine Stadt Simeons im äußersten Süden Kanaans, bei Josua unter den Städten von Simeons Los innerhalb Judas aufgeführt: „Ziklag, Beth-Markaboth, Hazar-Susa“. Die Chronik wiederholt die Liste mit der Form Hazar-Susim, „Gehöft der Pferde“, und fügt hinzu: „Dies waren ihre Städte bis auf den König David.“ Weil es neben Bet-Markabot, „Haus der Wagen“, steht, haben manche an eine Station für Wagen und Pferde an den Südstraßen gedacht, vielleicht zu Salomos Zeit, doch das ist eine Vermutung aus den Namen."
    - "Sonst ist nichts bekannt. In Judas eigener Liste der Südstädte nimmt Sansanna denselben Platz ein, und viele Forscher halten die beiden Namen für einen Ort, wie es die Karte tut; ein anderer Vorschlag ist Sbalat Abu Susein im westlichen Negev, gewählt wegen des Anklangs des Namens. Keiner ist durch Grabung bestätigt, und die Stadt erscheint in keinem anderen Text."
  fr:
    - "Hatsar-Susa, « enclos de la jument », est une ville de Siméon dans l’extrême sud de Canaan, inscrite chez Josué parmi les villes du lot de Siméon à l’intérieur de Juda : « Tsiklag, Beth-Marcaboth, Hatsar-Susa ». Les Chroniques répètent la liste sous la forme Hatsar-Susim, « enclos des chevaux », et ajoutent : « Ce furent là leurs villes jusqu’au règne de David. » Comme elle se trouve à côté de Beth-Marcaboth, « maison des chars », certains ont songé à une station de chars et de chevaux sur les routes du sud, peut-être du temps de Salomon, mais c’est une conjecture tirée des noms."
    - "On ne sait rien d’autre. Dans la liste propre de Juda pour les villes du sud, la même place est tenue par Sansanna, et beaucoup de spécialistes tiennent les deux noms pour un seul lieu, comme le fait la carte ; une autre proposition est Sbalat Abu Susein, dans le Négev occidental, choisie pour l’écho du nom. Ni l’une ni l’autre n’a été confirmée par la fouille, et la ville n’apparaît dans aucun autre texte."
  pl:
    - "Chasar-Susa, „zagroda klaczy”, to miasto Symeona na dalekim południu Kanaanu, wymienione u Jozuego wśród miast losu Symeona wewnątrz Judy: „I Syceleg, i Bet Marchabot, i Hasersusa”. Księgi Kronik powtarzają wykaz w formie Chasar-Susim, „zagroda koni”, i dodają: „Te miasta ich były, póki królował Dawid”. Ponieważ stoi obok Bet-Markabot, „domu rydwanów”, niektórzy myśleli o stacji dla rydwanów i koni na południowych drogach, może za Salomona, ale to domysł z nazw."
    - "Nic więcej nie wiadomo. W wykazie południowych miast samej Judy to samo miejsce zajmuje Sansana, i wielu uczonych uważa obie nazwy za jedno miejsce, jak czyni mapa; inna propozycja to Sbalat Abu Susejn w zachodnim Negewie, wybrany ze względu na echo nazwy. Żadnego nie potwierdziły wykopaliska, a miasto nie występuje w żadnym innym tekście."
  it:
    - "Cazar-Susa, «recinto della cavalla», è una città di Simeone nell’estremo sud di Canaan, elencata in Giosuè fra le città del lotto di Simeone dentro Giuda: «Tsiklag, Beth-Mareaboth, Hatsar-Susa». Le Cronache ripetono l’elenco con la forma Hatsar-Susim, «recinto dei cavalli», e aggiungono: «Queste furono le loro città, fino al regno di Davide». Poiché sta accanto a Bet-Marcabot, «casa dei carri», alcuni hanno pensato a una stazione per carri e cavalli sulle strade meridionali, forse al tempo di Salomone, ma è una congettura dedotta dai nomi."
    - "Nulla di più si sa. Nell’elenco proprio di Giuda delle città meridionali lo stesso posto è occupato da Sansanna, e molti studiosi ritengono i due nomi un solo luogo, come fa la mappa; un’altra proposta è Sbalat Abu Susein nel Negheb occidentale, scelta per l’eco del nome. Nessuna è stata confermata da scavi, e la città non compare in alcun altro testo."
  nl:
    - "Hazar-Susa, “omheining van de merrie”, is een stad van Simeon in het uiterste zuiden van Kanaän, in Jozua vermeld onder de steden van Simeons lot binnen Juda: “En Ziklag, en Beth-hammerchaboth, en Hazar-Suza”. Kronieken herhaalt de lijst met de vorm Hazar-Susim, “omheining van paarden”, en voegt toe: “Dit waren hun steden, totdat David koning werd.” Omdat het naast Beth-Markabot staat, “huis van wagens”, hebben sommigen gedacht aan een halteplaats voor wagens en paarden op de zuidelijke wegen, misschien in Salomo’s dagen, maar dat is een gissing uit de namen."
    - "Meer is er niet bekend. In Juda’s eigen lijst van zuidelijke steden wordt dezelfde plaats ingenomen door Sansanna, en veel geleerden houden de twee namen voor één plaats, zoals de kaart doet; een ander voorstel is Sbalat Abu Susein in de westelijke Negev, gekozen om de echo van de naam. Geen van beide is door opgraving bevestigd, en de stad komt in geen andere tekst voor."
  cs:
    - "Chacar-susa, „ohrada klisny“, je město Simeonovo v nejzazším jihu Kanaánu, uvedené v Jozue mezi městy Simeonova losu uvnitř Judska: „Sicelech a Betmarchabot, a Azarsusa“. Letopisy opakují seznam s tvarem Chacar-susim, „ohrada koní“, a dodávají: „Ta byla města jejich, dokudž kraloval David.“ Protože stojí vedle Bét-markabótu, „domu vozů“, mysleli někteří na stanici pro vozy a koně na jižních cestách, snad za Šalomounových dnů, ale to je domněnka z jmen."
    - "Nic dalšího není známo. V Judově vlastním seznamu jižních měst zaujímá totéž místo Sansana a mnozí učenci pokládají obě jména za jedno místo, jako to činí mapa; jiným návrhem je Sbalat Abu Susein v západním Negevu, zvolený pro ozvěnu jména. Žádné nebylo potvrzeno vykopávkami a město se neobjevuje v žádném jiném textu."
  sv:
    - "Hasar-Susa, ”stoets inhägnad”, är en stad i Simeon i yttersta södra Kanaan, upptagen hos Josua bland städerna i Simeons lott inom Juda: ”Siklag, Bet-Hammarkabot, Hasar-Susa”. Krönikeboken upprepar förteckningen med formen Hasar-Susim, ”hästarnas inhägnad”, och tillägger: ”Dessa voro deras städer, till dess att David blev konung.” Eftersom den står bredvid Bet-Markavot, ”vagnarnas hus”, har några tänkt på en station för vagnar och hästar vid södra vägarna, kanske på Salomos tid, men det är en gissning utifrån namnen."
    - "Inget annat är känt. I Judas egen förteckning över södra städer innehas samma plats av Sansanna, och många forskare tar de två namnen för en och samma plats, som kartan gör; ett annat förslag är Sbalat Abu Susein i västra Negev, valt för ett eko av namnet. Ingen har bekräftats genom utgrävning, och staden förekommer i ingen annan text."
  nb:
    - "Hasar-Susa, «merens innhegning», er en by i Simeon lengst sør i Kanaan, oppført hos Josva blant byene i Simeons lodd inne i Juda: «og Siklag og Bet-Hammarkabot og Hasar-Susa». Krønikebøkene gjentar listen med formen Hasar-Susim, «hestenes innhegning», og legger til: «det var deres byer inntil David blev konge». Fordi den står ved siden av Bet-Markabot, «vognenes hus», har noen tenkt på en stasjon for vogner og hester på de sørlige veiene, kanskje i Salomos dager, men det er en gjetning ut fra navnene."
    - "Ingenting annet er kjent. I Judas egen liste over sørlige byer innehas den samme plassen av Sansanna, og mange forskere tar de to navnene for ett sted, slik kartet gjør; et annet forslag er Sbalat Abu Susein i det vestlige Negev, valgt for ekkoet av navnet. Ingen av dem er bekreftet ved utgravning, og byen forekommer ikke i noen annen tekst."
  tl:
    - "Ang Hasarsusa, “bakuran ng kabayong babae”, ay isang bayan ng Simeon sa dulong timog ng Canaan, na itinatala ni Josue sa mga bayan ng bahagi ni Simeon sa loob ng Juda: “At Siclag, at Beth-marchaboth, at Hasarsusa”. Inuulit ng Mga Cronica ang talaan sa anyong Hasa-susim, “bakuran ng mga kabayo”, at idinaragdag: “Ito ang kanilang mga bayan hanggang sa paghahari ni David.” Yamang nasa tabi ito ng Beth-marchaboth, “bahay ng mga karo”, iniisip ng ilan ang isang himpilan ng mga karo at kabayo sa mga daan sa timog, marahil sa mga araw ni Salomon, ngunit hula lamang iyon mula sa mga pangalan."
    - "Wala nang ibang nalalaman. Sa sariling talaan ng Juda ng mga bayan sa timog, ang parehong puwesto ay hawak ng Sansana, at itinuturing ng maraming iskolar na iisang lugar ang dalawang pangalan, gaya ng ginagawa ng mapa; isa pang mungkahi ang Sbalat Abu Susein sa kanlurang Negeb, na pinili dahil sa alingawngaw ng pangalan. Wala sa dalawa ang nakumpirma ng paghuhukay, at ang bayan ay hindi lumilitaw sa alinmang ibang teksto."
  da:
    - "Hasar-Susa, »hoppens indhegning«, er en by i Simeon i det yderste syd af Kana'an, opført hos Josva blandt byerne i Simeons lod inden for Juda: »og Ziklag og Beth-Marcaboth og Hazar-Susa«. Krønikebøgerne gentager listen med formen Hasar-Susim, »hestenes indhegning«, og tilføjer: »disse vare deres Stæder, indtil David blev Konge«. Fordi den står ved siden af Bet-Markabot, »vognenes hus«, har nogle tænkt på en station for vogne og heste på de sydlige veje, måske i Salomos dage, men det er et gæt ud fra navnene."
    - "Intet andet er kendt. I Judas egen liste over sydlige byer indtages samme plads af Sansanna, og mange forskere tager de to navne for ét sted, som kortet gør; et andet forslag er Sbalat Abu Susein i det vestlige Negev, valgt for navnets ekko. Ingen af dem er bekræftet ved udgravning, og byen optræder i ingen anden tekst."
  sr:
    - "Асар-Суса, „двор кобиле“, је град Симеунов на крајњем југу Ханана, наведен у Исусу Навину међу градовима Симеуновог жреба унутар Јуде: „и Сиклаг и Вет-Мархавот и Асар-Суса“. Летописи понављају списак с обликом Асар-Сусим, „двор коња“, и додају: „То беху градови њихови до цара Давида.“ Пошто стоји уз Вет-Мархавот, „кућу кола“, неки су помислили на станицу за кола и коње на јужним путевима, можда у Соломуново доба, али то је погађање на основу имена."
    - "Ништа друго се не зна. У Јудином списку јужних градова исто место држи Сансана, и многи научници та два имена узимају за једно место, као и карта; други предлог је Сбалат Абу Сусејн у западном Негеву, изабран због одјека имена. Ни једно није потврђено ископавањем и град се не јавља ни у једном другом тексту."
  hu:
    - "Hácar-Szúsza, „a kanca kerítése”, Simeon városa Kánaán legdélibb részén, amelyet Józsué Simeon Júdán belüli sorsának városai között sorol fel: „Cziklág, Béth-Markaboth és Haczar-Szusza”. A Krónikák megismétli a jegyzéket a Hácar-Szuszim alakkal, „a lovak kerítése”, és hozzáteszi: „ezek valának az ő városaik mindaddig, míg Dávid királylyá lett.” Mivel Bét-Markabót, „a szekerek háza” mellett áll, egyesek a déli utakon szekerek és lovak állomására gondoltak, talán Salamon napjaiban, de ez a nevekből vont találgatás."
    - "Másról nem tudunk. Júda saját déli jegyzékében ugyanazt a helyet Szánszanna foglalja el, és sok kutató a két nevet egy helynek tartja, ahogyan a térkép is; egy másik javaslat a nyugati Negevben Szbálat Abu Szuszein, a név visszhangja miatt választva. Egyiket sem erősítette meg ásatás, és a város más szövegben nem szerepel."
  fi:
    - "Hasar-Susa, ”tamman aitaus”, on Simeonin kaupunki Kanaanin äärimmäisessä etelässä, Joosuan luettelossa Simeonin Juudan sisällä olevan arvan kaupunkien joukossa: ”Siklag, Beet-Markabot, Hasar-Suusa”. Aikakirjat toistavat luettelon muodolla Hasar-Susim, ”hevosten aitaus”, ja lisäävät: ”Nämä olivat heidän kaupunkinsa Daavidin hallitukseen asti.” Koska se on Beet-Markabotin, ”vaunujen talon”, vieressä, jotkut ovat ajatelleet vaunujen ja hevosten asemaa eteläisillä teillä, ehkä Salomon päivinä, mutta se on nimistä tehty arvaus."
    - "Muuta ei tiedetä. Juudan omassa eteläisten kaupunkien luettelossa saman paikan haltijana on Sansanna, ja monet tutkijat pitävät kahta nimeä yhden paikan nimenä, kuten kartta tekee; toinen ehdotus on Sbalat Abu Susein läntisessä Negevissä, valittu nimen kaiun vuoksi. Kumpaakaan ei ole vahvistettu kaivauksin, eikä kaupunki esiinny missään muussa tekstissä."
  vi:
    - "Hát-sa-Su-sa, “vòng rào của ngựa cái”, là một thành của Si-mê-ôn ở cực nam Ca-na-an, được liệt kê trong sách Giô-suê trong các thành thuộc phần bắt thăm của Si-mê-ôn bên trong Giu-đa: “Xiếc-lác, Bết-Ma-ca-bốt, Hát-sa-Su-sa”. Sách Sử Ký lặp lại bảng kê với dạng Hát-sa-Su-sim, “vòng rào của ngựa”, và thêm: “Ấy là các thành của chúng cho đến đời vua Đa-vít”. Vì đứng cạnh Bết-Ma-ca-bốt, “nhà của các xe”, có người nghĩ đến một trạm xe và ngựa trên các con đường phía nam, có lẽ vào thời Sa-lô-môn, nhưng đó là phỏng đoán từ các tên."
    - "Không biết gì thêm. Trong bảng kê các thành phía nam của chính Giu-đa, cùng vị trí ấy do San-sa-na giữ, và nhiều học giả coi hai tên là một nơi, như bản đồ; một đề nghị khác là Sbalat Abu Susein ở tây Nê-ghép, được chọn vì tiếng vang của tên. Chưa đề nghị nào được xác nhận bằng khai quật, và thành không xuất hiện trong văn bản nào khác."
  ro:
    - "Hațar-Susa, „curtea iepei”, este un oraș al lui Simeon în extremitatea sudică a Canaanului, înscris în Iosua printre orașele sorțului lui Simeon din Iuda: „Siclagul, Vitamarhavot, Asersusim”. Cronicile repetă lista cu forma Hațar-Susim, „curtea cailor”, și adaugă: „acestea sunt cetățile lor până la împăratul David”. Fiindcă stă lângă Bet-Marcabot, „casa carelor”, unii s-au gândit la o stație de care și cai pe drumurile sudice, poate în zilele lui Solomon, dar aceasta este o presupunere din nume."
    - "Nu se mai știe nimic. În lista proprie a lui Iuda cu orașele sudice, același loc este ținut de Sansana, iar mulți cercetători socotesc cele două nume un singur loc, ca harta; o altă propunere este Sbalat Abu Susein în Neghevul de vest, aleasă pentru ecoul numelui. Niciuna nu a fost confirmată prin săpături, iar orașul nu apare în niciun alt text."
  bg:
    - "Хацар-Суса, „ограда на кобилата“, е град на Симеон в най-южната част на Ханаан, изброен в книгата на Иисус Навин сред градовете от дела на Симеон вътре в Юда: „и Сиклаг, и Вет-маркавот, и Асар-суса“. Летописи повтаря списъка с формата Хацар-Сусим, „ограда на конете“, и добавя: „тези бяха градовете им до царствуването на Давида“. Понеже той стои до Бет-Маркавот, „дом на колесниците“, някои мислят за станция за колесници и коне по южните пътища, може би в дните на Соломон, но това е предположение по имената."
    - "Нищо друго не се знае. В собствения списък на южните градове на Юда същото място заема Сансана и много учени смятат двете имена за едно място, както и картата; друго предложение е Сбалат Абу Сусейн в западния Негев, избрано заради отгласа на името. Нито едното не е потвърдено с разкопки и градът не се появява в никой друг текст."
