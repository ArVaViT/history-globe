body:
  en:
    - "Ituraea was the land of the Itureans, a Semitic-speaking people whose origin is still disputed. From a base around Mount Lebanon and the Beqaa valley they spread in the Hellenistic period over the Anti-Lebanon, Mount Hermon, the northern Golan and the Hauran; their capital Chalcis has not been securely identified. Archaeological surveys find Iturean material culture in the Beqaa, the northern Golan and on Hermon, but not in Upper or Lower Galilee. Today these lands lie in Lebanon and Syria and in the Golan."
    - "Luke dates the start of John the Baptist's preaching to the year when Herod was tetrarch of Galilee “and his brother Philip tetrarch of Ituraea and of the region of Trachonitis, and Lysanias the tetrarch of Abilene”. It is the only mention of the land in the Bible. Josephus names Philip's lands as Batanea, Trachonitis and Auranitis, among others, so Luke's “Ituraea” is usually taken to mean the Iturean districts of Hermon and the Golan that had passed to Herod the Great and from him to Philip."
    - "In 104 or 103 BC the Hasmonean king Aristobulus I conquered a great part of Ituraea and, Josephus says, made the inhabitants who stayed be circumcised and live by Jewish law; he quotes Strabo, after Timagenes, to the same effect. Many modern scholars, Uzi Leibner among them, doubt that report. Ptolemy son of Mennaeus ruled the Itureans from Chalcis until about 40 BC, and Cassius Dio calls his successor Lysanias king of the Itureans. Augustus took Trachonitis from the tetrarch Zenodorus and gave it to Herod. The Romans prized Iturean archers; the last Iturean kingdom, given by Caligula to Soemus in AD 38, was joined to the province of Syria after his death in 49."
  ru:
    - "Итурея — земля итуреев, семитоязычного народа, происхождение которого до сих пор спорно. С исходных земель вокруг Ливанских гор и долины Бекаа они в эллинистическое время распространились по Антиливану, Ермону, северу Голан и Хаурану; их столица Халкида надёжно не отождествлена. Археологические обследования находят итурейскую материальную культуру в Бекаа, на севере Голан и на Ермоне, но не в Верхней и Нижней Галилее. Сегодня эти земли лежат в Ливане, Сирии и на Голанах."
    - "Лука датирует начало проповеди Иоанна Крестителя годом, когда Ирод был четвертовластником в Галилее, «Филипп, брат его, четвертовластником в Итурее и Трахонитской области, а Лисаний четвертовластником в Авилинее». Это единственное упоминание этой земли в Библии. Иосиф Флавий называет владениями Филиппа, среди прочих, Батанею, Трахонитиду и Авранитиду, поэтому под «Итуреей» у Луки обычно понимают итурейские области Ермона и Голан, перешедшие к Ироду Великому, а от него к Филиппу."
    - "В 104 или 103 г. до н. э. хасмонейский царь Аристовул I завоевал большую часть Итуреи и, по словам Иосифа Флавия, заставил оставшихся жителей принять обрезание и жить по иудейскому закону; он приводит о том же слова Страбона со ссылкой на Тимагена. Многие современные исследователи, среди них Узи Лейбнер, сомневаются в этом сообщении. Птолемей, сын Меннея, правил итуреями из Халкиды примерно до 40 г. до н. э., и Дион Кассий называет его преемника Лисания царём итуреев. Август отнял Трахонитиду у четвертовластника Зенодора и отдал её Ироду. Римляне ценили итурейских лучников; последнее итурейское царство, отданное Калигулой Сохему в 38 г. н. э., после его смерти в 49 г. присоединили к провинции Сирия."
  uk:
    - "Ітурея була країною ітурейців, семітомовного народу, походження якого досі спірне. З опорою навколо гори Ліван і долини Бекаа вони в елліністичний період розселилися по Антилібану, горі Гермон, північному Голану та Хавраню; їхню столицю Халкіду надійно не ототожнено. Археологічні обстеження знаходять ітурейську матеріальну культуру в Бекаа, на північному Голані та на Гермоні, але не у Верхній чи Нижній Галілеї. Нині ці землі лежать у Лівані, Сирії та на Голані."
    - "Лука датує початок проповіді Івана Христителя роком, коли, за його словами, «четверовластником у Галилеї Ірод, Филип же, брат його, четверовластником в Ітуреї і Трахонській землї, а Лисаний четверовластником в Авилинї». Це єдина згадка про цю країну в Біблії. Йосиф Флавій називає землі Пилипа Батанеєю, Трахонітською областю та Авранітидою, поміж інших, тож ітурейські землі в Луки зазвичай розуміють як ітурейські округи Гермону й Голану, що перейшли до Ірода Великого, а від нього до Пилипа."
    - "104 чи 103 р. до н. е. хасмонейський цар Аристовул I підкорив значну частину Ітуреї і, за Йосифом Флавієм, змусив мешканців, які залишилися, обрізатися й жити за юдейським законом; він цитує Страбона за Тімагеном у тому самому дусі. Багато сучасних учених, серед них Узі Лейбнер, сумніваються в цьому повідомленні. Птолемей, син Меннея, правив ітурейцями з Халкіди приблизно до 40 р. до н. е., а Кассій Діон називає його наступника Лісанія царем ітурейців. Август відібрав Трахонітську область в тетрарха Зенодора й віддав Іродові. Римляни цінували ітурейських лучників; останнє ітурейське царство, віддане Калігулою Соему 38 р. н. е., було приєднане до провінції Сирія після його смерті 49 р."
  es:
    - "Iturea era la tierra de los itureos, un pueblo de lengua semítica cuyo origen sigue discutido. Desde una base en torno al monte Líbano y el valle de la Becá se extendieron en época helenística por el Antilíbano, el monte Hermón, el norte del Golán y el Haurán; su capital, Calcis, no ha sido identificada con seguridad. Las prospecciones arqueológicas hallan cultura material iturea en la Becá, el norte del Golán y el Hermón, pero no en la Alta ni en la Baja Galilea. Hoy estas tierras se encuentran en el Líbano, en Siria y en el Golán."
    - "Lucas fecha el comienzo de la predicación de Juan el Bautista en el año en que Herodes era tetrarca de Galilea, «y su hermano Felipe tetrarca de Iturea y de la provincia de Traconite, y Lisanias tetrarca de Abilinia». Es la única mención de la tierra en la Biblia. Josefo nombra las tierras de Felipe como Batanea, Traconite y Auranítide, entre otras, de modo que la «Iturea» de Lucas suele entenderse como los distritos itureos del Hermón y el Golán que habían pasado a Herodes el Grande y de él a Felipe."
    - "En 104 o 103 a. C. el rey asmoneo Aristóbulo I conquistó gran parte de Iturea y, dice Josefo, hizo circuncidar a los habitantes que se quedaron y vivir según la ley judía; cita a Estrabón, a partir de Timágenes, en el mismo sentido. Muchos estudiosos modernos, entre ellos Uzi Leibner, dudan de ese relato. Ptolomeo hijo de Meneo gobernó a los itureos desde Calcis hasta cerca de 40 a. C., y Dión Casio llama a su sucesor Lisanias rey de los itureos. Augusto quitó Traconite al tetrarca Zenodoro y se la dio a Herodes. Los romanos apreciaban a los arqueros itureos; el último reino itureo, dado por Calígula a Sohemo en 38 d. C., fue unido a la provincia de Siria tras la muerte de este en 49."
  de:
    - "Ituräa war das Land der Ituräer, eines semitisch sprechenden Volkes, dessen Herkunft noch umstritten ist. Von einer Basis um den Libanon und die Bekaa-Ebene breiteten sie sich in hellenistischer Zeit über den Antilibanon, den Hermon, den nördlichen Golan und den Hauran aus; ihre Hauptstadt Chalkis ist nicht sicher bestimmt. Archäologische Surveys finden ituräische materielle Kultur in der Bekaa, im nördlichen Golan und am Hermon, aber nicht in Ober- oder Untergaliläa. Heute liegen diese Länder im Libanon, in Syrien und auf dem Golan."
    - "Lukas datiert den Beginn der Predigt Johannes des Täufers auf das Jahr, in dem Herodes Vierfürst in Galiläa war „und sein Bruder Philippus ein Vierfürst in Ituräa und in der Gegend Trachonitis und Lysanias ein Vierfürst zu Abilene“. Es ist die einzige Erwähnung des Landes in der Bibel. Josephus nennt als Philippus' Länder unter anderen Batanäa, Trachonitis und Auranitis, sodass Lukas' „Ituräa“ gewöhnlich auf die ituräischen Bezirke von Hermon und Golan bezogen wird, die an Herodes den Großen und von ihm an Philippus gefallen waren."
    - "Im Jahr 104 oder 103 v. Chr. eroberte der hasmonäische König Aristobul I. einen großen Teil Ituräas und ließ, sagt Josephus, die Einwohner, die blieben, beschneiden und nach jüdischem Gesetz leben; er zitiert Strabon nach Timagenes im selben Sinn. Viele moderne Gelehrte, darunter Uzi Leibner, bezweifeln diesen Bericht. Ptolemäus, Sohn des Mennaios, herrschte bis etwa 40 v. Chr. von Chalkis aus über die Ituräer, und Cassius Dio nennt seinen Nachfolger Lysanias König der Ituräer. Augustus nahm dem Tetrarchen Zenodoros Trachonitis und gab es Herodes. Die Römer schätzten ituräische Bogenschützen; das letzte ituräische Königtum, 38 n. Chr. von Caligula an Soaimos gegeben, wurde nach dessen Tod im Jahr 49 mit der Provinz Syrien vereinigt."
  fr:
    - "L’Iturée était le pays des Ituréens, peuple de langue sémitique dont l’origine reste disputée. À partir d’une base autour du mont Liban et de la vallée de la Bekaa, ils se répandirent à l’époque hellénistique sur l’Anti-Liban, le mont Hermon, le nord du Golan et le Havran ; leur capitale Chalcis n’a pas été identifiée avec certitude. Les prospections archéologiques trouvent une culture matérielle ituréenne dans la Bekaa, le nord du Golan et sur l’Hermon, mais non en Haute ni en Basse Galilée. Aujourd’hui, ces terres se trouvent au Liban, en Syrie et dans le Golan."
    - "Luc date le début de la prédication de Jean-Baptiste de l’année où Hérode était tétrarque de la Galilée, « son frère Philippe tétrarque de l’Iturée et du territoire de la Trachonite, Lysanias tétrarque de l’Abilène ». C’est la seule mention du pays dans la Bible. Josèphe nomme les terres de Philippe la Batanée, la Trachonite et l’Auranitide, entre autres, si bien que l’« Iturée » de Luc désigne d’ordinaire les districts ituréens de l’Hermon et du Golan, passés à Hérode le Grand puis, de lui, à Philippe."
    - "En 104 ou 103 av. J.-C., le roi hasmonéen Aristobule Ier conquit une grande partie de l’Iturée et, dit Josèphe, fit circoncire les habitants qui restèrent et les fit vivre selon la loi juive ; il cite Strabon, d’après Timagène, dans le même sens. Bien des savants modernes, dont Uzi Leibner, doutent de ce récit. Ptolémée fils de Mennaios régna sur les Ituréens depuis Chalcis jusque vers 40 av. J.-C., et Dion Cassius appelle son successeur Lysanias roi des Ituréens. Auguste ôta la Trachonite au tétrarque Zénodore et la donna à Hérode. Les Romains prisaient les archers ituréens ; le dernier royaume ituréen, donné par Caligula à Soèmos en 38 apr. J.-C., fut réuni à la province de Syrie après sa mort en 49."
  pt:
    - "A Itureia era a terra dos itureus, um povo de língua semítica cuja origem ainda é disputada. A partir de uma base em torno do monte Líbano e do vale da Bekaa, espalharam-se no período helenístico pelo Antilíbano, o monte Hermom, o norte do Golã e o Haurã; sua capital, Cálcis, não foi identificada com segurança. Levantamentos arqueológicos encontram cultura material iturea na Bekaa, no norte do Golã e no Hermom, mas não na Alta nem na Baixa Galileia. Hoje essas terras ficam no Líbano, na Síria e no Golã."
    - "Lucas data o início da pregação de João Batista ao ano em que Herodes era tetrarca da Galileia, “seu irmão Filipe tetrarca da região da Itureia e Traconites, e Lisânias tetrarca de Abilene”. É a única menção da terra na Bíblia. Josefo nomeia como terras de Filipe a Batanéia, a Traconites e a Auranítide, entre outras, de modo que a “Itureia” de Lucas costuma ser entendida como os distritos itureus do Hermom e do Golã, que haviam passado a Herodes, o Grande, e dele a Filipe."
    - "Em 104 ou 103 a.C. o rei hasmoneu Aristóbulo I conquistou grande parte da Itureia e, diz Josefo, fez circuncidar os habitantes que ficaram e os obrigou a viver segundo a lei judaica; Josefo cita Estrabão, a partir de Timágenes, no mesmo sentido. Muitos estudiosos modernos, entre eles Uzi Leibner, duvidam desse relato. Ptolomeu, filho de Meneu, governou os itureus a partir de Cálcis até cerca de 40 a.C., e Dião Cássio chama seu sucessor Lisânias de rei dos itureus. Augusto tirou a Traconites do tetrarca Zenodoro e a deu a Herodes. Os romanos apreciavam os arqueiros itureus; o último reino itureu, dado por Calígula a Soemo em 38 d.C., foi unido à província da Síria depois da morte dele, em 49."
  it:
    - "L’Iturea era la terra degli Iturei, un popolo di lingua semitica la cui origine è ancora discussa. Da una base intorno al monte Libano e alla valle della Beqa‘ si espansero in epoca ellenistica sull’Antilibano, sul monte Ermon, sul Golan settentrionale e sull’Auran; la loro capitale Calcide non è stata identificata con sicurezza. Le ricognizioni archeologiche trovano cultura materiale iturea nella Beqa‘, nel Golan settentrionale e sull’Ermon, ma non nella Galilea superiore né in quella inferiore. Oggi queste terre si trovano in Libano e in Siria e nel Golan."
    - "Luca data l’inizio della predicazione di Giovanni Battista all’anno in cui Erode era «tetrarca della Galilea, e Filippo, suo fratello, tetrarca dell’Iturea e della Traconitide, e Lisania tetrarca dell’Abilene». È l’unica menzione del paese nella Bibbia. Giuseppe Flavio indica i territori di Filippo come Batanea, Traconitide e Auranitide, tra gli altri, perciò l’«Iturea» di Luca si intende di solito come i distretti iturei dell’Ermon e del Golan passati a Erode il Grande e da lui a Filippo."
    - "Nel 104 o 103 a.C. il re asmoneo Aristobulo I conquistò gran parte dell’Iturea e, dice Giuseppe Flavio, fece circoncidere gli abitanti rimasti e li fece vivere secondo la legge giudaica; egli cita Strabone, da Timagene, nello stesso senso. Molti studiosi moderni, tra cui Uzi Leibner, dubitano di questo racconto. Tolomeo figlio di Mennèo governò gli Iturei da Calcide fino al 40 a.C. circa, e Cassio Dione chiama il suo successore Lisania re degli Iturei. Augusto tolse la Traconitide al tetrarca Zenodoro e la diede a Erode. I Romani apprezzavano gli arcieri iturei; l’ultimo regno itureo, dato da Caligola a Soemo nel 38 d.C., fu unito alla provincia di Siria dopo la morte di lui nel 49."
  nl:
    - "Iturea was het land van de Itureeërs, een Semitisch sprekend volk wiens herkomst nog omstreden is. Vanuit een basis rond de Libanon en de Bekaavallei verspreidden zij zich in de hellenistische tijd over de Anti-Libanon, de Hermon, de noordelijke Golan en de Hauran; hun hoofdstad Chalcis is niet zeker geïdentificeerd. Archeologische verkenningen vinden Iturese materiële cultuur in de Bekaa, de noordelijke Golan en op de Hermon, maar niet in Boven- of Neder-Galilea. Tegenwoordig liggen deze landen in Libanon en Syrië en in de Golan."
    - "Lukas dateert het begin van de prediking van Johannes de Doper naar het jaar waarin Herodes viervorst van Galilea was “en Filippus, zijn broeder, een viervorst over Iturea en over het land Trachonitis, en Lysanias een viervorst over Abilene”. Het is de enige vermelding van het land in de Bijbel. Josephus noemt Filippus' landen onder meer Batanea, Trachonitis en Auranitis, zodat Lukas' “Iturea” gewoonlijk wordt opgevat als de Iturese districten van de Hermon en de Golan die aan Herodes de Grote en van hem aan Filippus waren gekomen."
    - "In 104 of 103 v.Chr. veroverde de Hasmonese koning Aristobulus I een groot deel van Iturea en liet volgens Josephus de inwoners die bleven besnijden en naar de Joodse wet leven; hij citeert Strabo, naar Timagenes, in dezelfde zin. Veel moderne geleerden, onder wie Uzi Leibner, betwijfelen dat bericht. Ptolemaeus, zoon van Mennaeus, regeerde de Itureeërs vanuit Chalcis tot omstreeks 40 v.Chr., en Cassius Dio noemt zijn opvolger Lysanias koning van de Itureeërs. Augustus nam Trachonitis van de tetrarch Zenodorus en gaf het aan Herodes. De Romeinen waardeerden Iturese boogschutters; het laatste Iturese koninkrijk, in 38 n.Chr. door Caligula aan Soemus gegeven, werd na diens dood in 49 bij de provincie Syrië gevoegd."
  pl:
    - "Iturea była krainą Iturejczyków, ludu mówiącego językiem semickim, którego pochodzenie jest nadal sporne. Z siedzib wokół Gór Libanu i doliny Bekaa rozprzestrzenili się w okresie hellenistycznym na Antyliban, Hermon, północny Golan i Hauran; ich stolica Chalkis nie została pewnie zidentyfikowana. Badania powierzchniowe odnajdują kulturę materialną Iturejczyków w Bekaa, na północnym Golanie i na Hermonie, lecz nie w Górnej ani Dolnej Galilei. Dziś ziemie te leżą w Libanie i Syrii oraz na Golanie."
    - "Łukasz datuje początek nauczania Jana Chrzciciela na rok, gdy Herod był tetrarchą Galilei, „a Filip, brat jego, Tetrarchą Iturejskim i krainy Trachonickiej, a Lizanijasz Tetrarchą Abileńskim”. Jest to jedyna wzmianka o tej krainie w Biblii. Józef Flawiusz wymienia ziemie Filipa jako między innymi Batanea, Trachonitida i Auranitida, więc Iturea u Łukasza oznacza zwykle iturejskie okręgi Hermonu i Golanu, które przeszły na Heroda Wielkiego, a od niego na Filipa."
    - "W 104 lub 103 p.n.e. hasmonejski król Arystobul I podbił znaczną część Iturei i, jak mówi Józef Flawiusz, kazał obrzezać mieszkańców, którzy zostali, i żyć według prawa żydowskiego; powołuje się na Strabona, za Tymagenesem, w tym samym sensie. Wielu współczesnych uczonych, wśród nich Uzi Leibner, wątpi w tę wiadomość. Ptolemeusz syn Menneusza rządził Iturejczykami z Chalkis do około 40 p.n.e., a Kasjusz Dion nazywa jego następcę Lizaniasza królem Iturejczyków. August odebrał Trachonitidę tetrarsze Zenodorowi i oddał ją Herodowi. Rzymianie cenili iturejskich łuczników; ostatnie królestwo iturejskie, oddane przez Kaligulę Soemosowi w 38 r. n.e., włączono do prowincji Syrii po jego śmierci w 49."
  cs:
    - "Iturea byla země Iturejců, semitsky mluvícího lidu, jehož původ je dosud sporný. Ze základny kolem Libanonu a údolí Bikáa se v helénistickém období rozšířili po Antilibanonu, Hermonu, severních Golánech a Havranu; jejich hlavní město Chalkis nebylo spolehlivě určeno. Archeologické průzkumy nacházejí iturejskou hmotnou kulturu v Bikáa, na severních Golánech a na Hermonu, ale ne v Horní ani Dolní Galileji. Dnes tyto země leží v Libanonu, Sýrii a na Golánech."
    - "Lukáš datuje počátek kázání Jana Křtitele do roku, kdy byl Herodes tetrarchou Galileje, „Filip pak bratr jeho byl čtvrtákem Iturejské a Trachonitidské krajiny, a Lyzaniáš čtvrtákem Abilinským“. Je to jediná zmínka o této zemi v Bibli. Josephus Flavius uvádí Filipovy země jako Batanaiu, Trachonitidu a Auranitidu, mimo jiné, takže Lukášova „Iturea“ se obvykle chápe jako iturejské okresy Hermonu a Golánu, které připadly Herodovi Velikému a od něj Filipovi."
    - "V roce 104 nebo 103 př. n. l. dobyl hasmonejský král Aristobúlos I. velkou část Iturey a podle Josepha Flavia přinutil obyvatele, kteří zůstali, k obřízce a životu podle židovského zákona; cituje Strabóna, jenž čerpá z Timagena, v témž smyslu. Mnozí současní badatelé, mezi nimi Uzi Leibner, tuto zprávu zpochybňují. Ptolemaios, syn Mennaiův, vládl Iturejcům z Chalkidy do roku asi 40 př. n. l. a Cassius Dio nazývá jeho nástupce Lysania králem Iturejců. Augustus vzal Trachonitidu tetrarchovi Zenodorovi a dal ji Herodovi. Římané si cenili iturejských lučištníků; poslední iturejské království, které Kaligula roku 38 n. l. dal Soaimovi, bylo po jeho smrti roku 49 připojeno k provincii Sýrii."
  sv:
    - "Itureen var itureernas land, ett semitiskt talande folk vars ursprung fortfarande är omstritt. Från en bas kring Libanonberget och Bekaadalen spred de sig under hellenistisk tid över Antilibanon, Hermon, norra Golan och Hauran; deras huvudstad Chalkis har inte identifierats säkert. Arkeologiska undersökningar finner itureisk materiell kultur i Bekaa, norra Golan och på Hermon, men inte i övre eller nedre Galileen. I dag ligger dessa länder i Libanon och Syrien och på Golan."
    - "Lukas daterar Johannes döparens första predikan till året då Herodes var landsfurste i Galileen, ”hans broder Filippus landsfurste i Itureen och Trakonitis-landet, och Lysanias landsfurste i Abilene”. Det är landets enda omnämnande i Bibeln. Josefus nämner Filippos land som bland annat Batanea, Trachonitis och Auranitis, så Lukas ”Itureen” tas vanligen för de itureiska distrikten på Hermon och Golan som hade gått till Herodes den store och från honom till Filippos."
    - "År 104 eller 103 f.Kr. erövrade den hasmoneiske kungen Aristobulos I en stor del av Itureen och lät, säger Josefus, de invånare som stannade omskäras och leva efter judisk lag; han citerar Strabon, efter Timagenes, med samma innebörd. Många moderna forskare, bland dem Uzi Leibner, betvivlar den uppgiften. Ptolemaios, Mennaios son, härskade över itureerna från Chalkis till omkring 40 f.Kr., och Cassius Dio kallar hans efterträdare Lysanias itureernas kung. Augustus tog Trachonitis från tetrarken Zenodoros och gav det åt Herodes. Romarna värderade itureiska bågskyttar; det sista itureiska kungariket, givet av Caligula åt Soemus år 38 e.Kr., lades under provinsen Syrien efter hans död år 49."
  nb:
    - "Iturea var landet til itureerne, et semittisk talende folk hvis opprinnelse fortsatt er omstridt. Fra et utgangspunkt rundt Libanon og Bekaa-dalen spredte de seg i hellenistisk tid over Anti-Libanon, Hermon, nordlige Golan og Havran; deres hovedstad Khalkis er ikke sikkert identifisert. Arkeologiske undersøkelser finner itureisk materiell kultur i Bekaa, nordlige Golan og på Hermon, men ikke i øvre eller nedre Galilea. I dag ligger disse landene i Libanon og Syria og i Golan."
    - "Lukas daterer begynnelsen av døperen Johannes' forkynnelse til året da Herodes var fjerdingsfyrste i Galilea, «og hans bror Filip fjerdingsfyrste i det itureiske og trakonittiske land, og Lysanias fjerdingsfyrste i Abilene». Det er den eneste omtalen av landet i Bibelen. Josefus nevner Filips land som blant annet Batanea, Trakonitis og Auranitis, så Lukas' «itureiske» tas vanligvis for å bety de itureiske distriktene på Hermon og Golan som var gått til Herodes den store og fra ham til Filip."
    - "I 104 eller 103 f.Kr. erobret den hasmoneiske kongen Aristobulos 1. en stor del av Iturea og, sier Josefus, lot innbyggerne som ble igjen, omskjæres og leve etter jødisk lov; han siterer Strabon, etter Timagenes, i samme retning. Mange moderne forskere, blant dem Uzi Leibner, tviler på den beretningen. Ptolemaios, Mennaios' sønn, styrte itureerne fra Khalkis til omkring 40 f.Kr., og Cassius Dio kaller hans etterfølger Lysanias kongen av itureerne. Augustus tok Trakonitis fra tetrarken Zenodoros og ga den til Herodes. Romerne verdsatte itureiske bueskyttere; det siste itureiske kongedømmet, gitt av Caligula til Soaemus i 38 e.Kr., ble lagt til provinsen Syria etter hans død i 49."
