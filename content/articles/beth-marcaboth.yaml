body:
  en:
    - "Beth-marcaboth, “house of chariots”, was a town of Simeon in the Negeb, named twice in the same company. Joshua's list of Simeon's inheritance within Judah has “Ziklag, and Beth-marcaboth, and Hazar-susah”, and the Chronicler repeats it: “at Beth-marcaboth, and Hazar-susim, and at Beth-birei, and at Shaaraim. These were their cities unto the reign of David”. Hazar-susah beside it means “enclosure of horses”. In Joshua's list of Judah's own towns the same position is held by Madmannah and Sansannah, so most take Beth-marcaboth to be another name for Madmannah, perhaps a later one, and Hazar-susah for Sansannah."
    - "The names have suggested a depot of chariots and horses on the southern road, of the kind Solomon kept in his “cities for his chariots, and cities for his horsemen”, but that is a guess from the words alone; nothing in the text says it. No site is known. Madmannah is sought at Khirbet Tatrit or Khirbet umm ed-Deimneh, ruins some 17–19 km north-east of Beersheba in the northern Negev of Israel, and neither has been excavated."
  ru:
    - "Беф-Маркавоф, «дом колесниц», — город Симеона в Негеве, дважды названный в одном и том же ряду. Список удела Симеона внутри Иуды в книге Иисуса Навина даёт «Циклаг, Беф-Маркавоф и Хацар-Суса», и Паралипоменон его повторяет: «в Беф-Маркавофе, в Хацарсусиме, в Беф-Биреи и в Шаариме. Вот города их до царствования Давидова». Хацар-Суса рядом с ним значит «двор коней». В списке собственных городов Иуды то же место занимают Мадмана и Сансана, поэтому большинство считают Беф-Маркавоф другим, может быть, более поздним именем Мадманы, а Хацар-Сусу — Сансаны."
    - "Имена наводили на мысль о стоянке колесниц и коней на южной дороге, вроде тех, что были у Соломона: «города для колесниц, и города для конницы», но это догадка по одним словам; в тексте ничего такого нет. Место неизвестно. Мадману ищут в Хирбет-Татрите или Хирбет-Умм-эд-Деймне, руинах примерно в 17–19 км к северо-востоку от Беэр-Шевы в северном Негеве Израиля, и ни одну из них не копали."
  uk:
    - "Бет-Маркавот, «дім колісниць», було містом Симеона в Негеві, названим двічі в одній компанії. Перелік спадщини Симеона всередині Юди в книзі Ісуса Навина має «Зиклаг, Бет-Маркабот і Газар-Суса», і хронікар повторює: «В Бет-Маркавотї, в Хазарсусимі, в Бет-Біреї та в Шааримі. Оце міста їх до Давидового царювання». Хацар-Суса поряд означає «двір коней». У переліку власних міст Юди ту саму позицію займають Мадманна і Сансана, тож більшість вважає Бет-Маркавот іншою назвою Мадманни, можливо, пізнішою, а Хацар-Суса — Сансани."
    - "Назви навели на думку про склад колісниць і коней на південній дорозі, на кшталт тих, що Соломон тримав у своїх «міста про вози й міста про кінноту», але це здогад лише зі слів; у тексті про це нічого не сказано. Місце невідоме. Мадманну шукають у Хірбет-Татріті чи Хірбет-умм-ед-Дейменех, руїнах приблизно за 17–19 км на північний схід від Беер-Шеви в північному Негеві Ізраїлю, і жодну не розкопували."
  es:
    - "Bet-marcabot, «casa de carros», era una ciudad de Simeón en el Néguev, nombrada dos veces en la misma compañía. La lista de Josué de la heredad de Simeón dentro de Judá tiene «Siclag, Beth-marchâboth, y Hasar-susa», y el Cronista la repite: «Y en Beth-marchâboth, y en Hasasusim, y en Beth-birai, y en Saaraim. Estas fueron sus ciudades hasta el reino de David». Hazar-susa a su lado significa «recinto de caballos». En la lista de Josué de las ciudades propias de Judá, la misma posición la ocupan Madmana y Sansana, por lo que la mayoría toma Bet-marcabot por otro nombre de Madmana, quizá posterior, y Hazar-susa por Sansana."
    - "Los nombres han sugerido un depósito de carros y caballos en el camino meridional, del tipo que Salomón mantenía en «las ciudades de los carros, y las ciudades de la gente de á caballo», pero eso es una conjetura a partir de las palabras solas; nada en el texto lo dice. No se conoce ningún sitio. Madmana se busca en Khirbet Tatrit o Khirbet umm ed-Deimneh, ruinas a unos 17–19 km al nordeste de Beerseba, en el Néguev septentrional de Israel, y ninguna ha sido excavada."
  pt:
    - "Bete-Marcabote, “casa de carros”, era uma cidade de Simeão no Neguebe, nomeada duas vezes na mesma companhia. A lista de Josué da herança de Simeão dentro de Judá tem “Ziclague, Bete-Marcabote, Hazar-Susa”, e o Cronista a repete: “em Bete-Marcabote, em Hazar-Susim, em Bete-Biri e em Saaraim. Estas foram as suas cidades até o reinado de Davi”. Hazar-Susa, ao lado, significa “recinto de cavalos”. Na lista das cidades do próprio Judá, a mesma posição é ocupada por Madmana e Sansana, de modo que a maioria toma Bete-Marcabote por outro nome de Madmana, talvez mais tardio, e Hazar-Susa por Sansana."
    - "Os nomes sugeriram um depósito de carros e cavalos na estrada do sul, do tipo que Salomão mantinha nas “cidades para os seus carros” e nas “cidades para os seus cavaleiros”, mas isso é uma conjetura só a partir das palavras; nada no texto o diz. Nenhum sítio é conhecido. Madmana é procurada em Khirbet Tatrit ou Khirbet umm ed-Deimneh, ruínas a cerca de 17–19 km a nordeste de Berseba, no norte do Neguev de Israel, e nenhuma foi escavada."
  de:
    - "Bet-Markabot, „Haus der Wagen“, war eine Stadt Simeons im Negev, zweimal in derselben Gesellschaft genannt. Josuas Liste von Simeons Erbteil innerhalb Judas hat „Ziklag, Beth-Markaboth, Hazar-Susa“, und der Chronist wiederholt sie: „Beth-Markaboth, Hasar-Susim, Beth-Birei, Saaraim. Dies waren ihre Städte bis auf den König David“. Hazar-Susa daneben bedeutet „Gehege der Pferde“. In Josuas Liste der eigenen Städte Judas halten dieselbe Stellung Madmanna und Sansanna, daher nehmen die meisten Bet-Markabot für einen anderen, vielleicht späteren Namen Madmannas und Hazar-Susa für Sansanna."
    - "Die Namen haben ein Depot für Wagen und Pferde an der Südstraße nahegelegt, wie Salomo sie in seinen „Städten der Wagen“ und „Städten der Reiter“ hielt, doch das ist eine Vermutung allein aus den Worten; nichts im Text sagt es. Keine Stätte ist bekannt. Madmanna sucht man in Chirbet Tatrit oder Chirbet umm ed-Deimne, Ruinen etwa 17–19 km nordöstlich von Beerscheba im nördlichen Negev Israels, und keine wurde ausgegraben."
  fr:
    - "Beth-Marcaboth, « maison de chars », était une ville de Siméon dans le Négev, nommée deux fois en même compagnie. La liste de Josué de l’héritage de Siméon à l’intérieur de Juda porte « Tsiklag, Beth-Marcaboth, Hatsar-Susa », et le Chroniste la répète : « à Beth-Marcaboth, à Hatsar-Susim, à Beth-Bireï et à Schaaraïm. Ce furent là leurs villes jusqu’au règne de David ». Hatsar-Susa à côté signifie « enclos de chevaux ». Dans la liste de Josué des villes propres de Juda, la même place est tenue par Madmanna et Sansanna ; la plupart tiennent donc Beth-Marcaboth pour un autre nom de Madmanna, peut-être plus tardif, et Hatsar-Susa pour Sansanna."
    - "Les noms ont suggéré un dépôt de chars et de chevaux sur la route du sud, tel que Salomon en tenait dans « les villes pour les chars, les villes pour la cavalerie », mais c’est une conjecture tirée des seuls mots ; rien dans le texte ne le dit. Aucun site n’est connu. Madmanna est cherchée à Khirbet Tatrit ou à Khirbet umm ed-Deimneh, ruines à quelque 17–19 km au nord-est de Beer-Schéba dans le nord du Négev israélien, et aucune n’a été fouillée."
  it:
    - "Bet-Marcabot, «casa dei carri», era una città di Simeone nel Negheb, nominata due volte nella stessa compagnia. L’elenco dell’eredità di Simeone dentro Giuda in Giosuè ha «Tsiklag, Beth-Mareaboth, Hatsar-Susa», e il Cronista lo ripete: «a Beth-Marcaboth, ad Hatsar-Susim, a Beth-Biri ed a Shaaraim. Queste furono le loro città, fino al regno di Davide». Cazar-Susa accanto significa «recinto dei cavalli». Nell’elenco delle città proprie di Giuda in Giosuè la stessa posizione è tenuta da Madmanna e Sansanna, così i più ritengono Bet-Marcabot un altro nome di Madmanna, forse più tardo, e Cazar-Susa di Sansanna."
    - "I nomi hanno suggerito un deposito di carri e cavalli sulla strada meridionale, del tipo che Salomone teneva fra «le città per i suoi carri, le città per i suoi cavalieri», ma è una congettura dalle sole parole; nulla nel testo lo dice. Nessun sito è noto. Madmanna è cercata a Khirbet Tatrit o a Khirbet umm ed-Deimneh, rovine a circa 17–19 km a nord-est di Bersabea nel Negheb settentrionale di Israele, e nessuna delle due è stata scavata."
  pl:
    - "Bet-Markabot, „dom wozów”, było miastem Symeona w Negewie, wymienianym dwukrotnie w tym samym towarzystwie. Wykaz dziedzictwa Symeona wewnątrz Judy u Jozuego ma „I Syceleg, i Bet Marchabot, i Hasersusa”, i Kronikarz powtarza: „I w Bet Marchabot, i w Hasersusa, i w Betbirze, i w Saaraim. Te miasta ich były, póki królował Dawid”. Chasar-Susa obok niego oznacza „zagrodę koni”. W wykazie miast własnych Judy u Jozuego to samo miejsce zajmują Madmanna i Sansana, więc większość uważa Bet-Markabot za inną nazwę Madmanny, może późniejszą, a Chasar-Susę za Sansanę."
    - "Nazwy sugerowały skład wozów i koni przy drodze południowej, jak te, które Salomon miał w miastach określonych jako „miasta wozów, i miasta jezdnych”, lecz to domysł tylko z samych słów; tekst tego nie mówi. Miejsce nie jest znane. Madmannę szuka się w Chirbet Tatrit lub Chirbet umm ed-Deimneh, ruinach około 17–19 km na północny wschód od Beer-Szeby w północnym Negewie Izraela, i żadna nie była wykopywana."
  nl:
    - "Beth-Markabot, “huis van wagens”, was een stad van Simeon in de Negev, tweemaal in hetzelfde gezelschap genoemd. Jozua’s lijst van Simeons erfdeel binnen Juda heeft “Ziklag, en Beth-hammerchaboth, en Hazar-Suza”, en de Kroniekschrijver herhaalt het: “te Beth-markaboth, en te Hazar-Susim, en te Beth-Biri, en te Saaraim. Dit waren hun steden, totdat David koning werd”. Hazar-Susa ernaast betekent “omheining van paarden”. In Jozua’s lijst van Juda’s eigen steden wordt dezelfde plaats ingenomen door Madmanna en Sansanna, dus de meesten nemen Beth-Markabot voor een andere, misschien latere naam van Madmanna, en Hazar-Susa voor Sansanna."
    - "De namen hebben een depot van wagens en paarden aan de zuidelijke weg doen vermoeden, zoals Salomo er hield in zijn “wagensteden, en de steden der ruiteren”, maar dat is een gissing uit de woorden alleen; niets in de tekst zegt het. Geen plaats is bekend. Madmanna wordt gezocht bij Khirbet Tatrit of Khirbet umm ed-Deimneh, ruïnes zo’n 17–19 km ten noordoosten van Berseba in de noordelijke Negev van Israël, en geen van beide is opgegraven."
  cs:
    - "Bét-markabót, „dům vozů“, bylo město Simeonovo v Negevu, jmenované dvakrát ve stejné společnosti. Jozuův seznam Simeonova dědictví uvnitř Judy má „Sicelech a Betmarchabot, a Azarsusa“ a kronikář to opakuje: „A v Betmarchabot, a v Azarsusim, v Betberi a v Saraim. Ta byla města jejich, dokudž kraloval David“. Chacar-susa vedle něj znamená „ohrada koní“. V Jozuově seznamu vlastních měst Judových zastávají totéž místo Madmana a Sansana, a proto většina bere Bét-markabót za jiné jméno Madmany, snad pozdější, a Chacar-susu za Sansanu."
    - "Jména napovídala skladiště vozů a koní na jižní cestě, jaké Šalomoun držel ve svých městech: „města vozů, i města jezdců“, ale to je dohad jen ze slov; text to neříká. Místo není známo. Madmana se hledá v Chirbet Tatrit nebo Chirbet umm ed-Deimneh, zříceninách asi 17–19 km severovýchodně od Beer-šeby v severním Negevu Izraele, a ani jedna nebyla vykopána."
  sv:
    - "Bet-Markavot, ”vagnarnas hus”, var en stad i Simeon i Negev, nämnd två gånger i samma sällskap. Josuas förteckning över Simeons arvedel inom Juda har ”Siklag, Bet-Hammarkabot, Hasar-Susa”, och Krönikeförfattaren upprepar den: ”i Bet-Markabot, i Hasar-Susim, i Bet-Birei och i Saaraim. Dessa voro deras städer, till dess att David blev konung”. Hasar-Susa bredvid betyder ”hästarnas inhägnad”. I Josuas förteckning över Judas egna städer har Madmanna och Sansanna samma plats, så de flesta tar Bet-Markavot för ett annat namn på Madmanna, kanske ett senare, och Hasar-Susa för Sansanna."
    - "Namnen har antytt ett depåläger för vagnar och hästar vid södra vägen, av det slag Salomo höll i ”vagnsstäderna och häststäderna”, men det är en gissning enbart utifrån orden; ingenting i texten säger det. Ingen plats är känd. Madmanna söks vid Khirbet Tatrit eller Khirbet umm ed-Deimneh, ruiner omkring 17–19 km nordost om Beer Sheva i norra Negev i Israel, och ingen av dem har grävts ut."
  nb:
    - "Bet-Markabot, «vognenes hus», var en by i Simeon i Negev, nevnt to ganger i det samme følget. Josvas liste over Simeons arv innenfor Juda har «Siklag og Bet-Hammarkabot og Hasar-Susa», og Krønikeskriveren gjentar den: «og i Bet-Markabot og i Hasar-Susim og i Bet-Biri og i Sa'ara'im - det var deres byer inntil David blev konge». Hasar-Susa ved siden av betyr «hestenes gård». I Josvas liste over Judas egne byer innehas den samme plassen av Madmanna og Sansanna, så de fleste tar Bet-Markabot for å være et annet navn på Madmanna, kanskje et senere, og Hasar-Susa for Sansanna."
    - "Navnene har antydet et depot for vogner og hester på sørveien, av det slaget Salomo hadde i «byene for stridsvognene og byene for hestfolket», men det er en gjetning ut fra ordene alene; ingenting i teksten sier det. Intet sted er kjent. Madmanna søkes ved Khirbet Tatrit eller Khirbet umm ed-Deimneh, ruiner omkring 17–19 km nordøst for Beer-Sjeba i nordlige Negev i Israel, og ingen av dem er gravd ut."
  tl:
    - "Ang Beth-marchaboth, “bahay ng mga karo”, ay bayan ni Simeon sa Negeb, dalawang beses pinangalanan sa parehong pangkat. Ang talaan ni Josue ng mana ni Simeon sa loob ng Juda ay may “Siclag, at Beth-marchaboth, at Hasarsusa”, at inuulit ito ng may-akda ng Mga Cronica: “At sa Beth-marchaboth, at sa Hasa-susim, at sa Beth-birai, at sa Saaraim. Ito ang kanilang mga bayan hanggang sa paghahari ni David”. Ang Hasarsusa sa tabi nito ay nangangahulugang “kulungan ng mga kabayo”. Sa talaan ni Josue ng sariling mga bayan ng Juda, ang parehong posisyon ay hawak ng Madmanna at Sansana, kaya itinuturing ng karamihan ang Beth-marchaboth na isa pang pangalan ng Madmanna, marahil mas huli, at ang Hasarsusa na Sansana."
    - "Ipinahiwatig ng mga pangalan ang isang imbakan ng mga karo at kabayo sa timog na daan, ng uri ng iningatan ni Salomon sa kaniyang “mga bayan sa kaniyang mga karo, at ang mga bayan sa kaniyang mga mangangabayo”, ngunit hula iyon mula sa mga salita lamang; walang sinasabi ang teksto. Walang kilalang lugar. Hinahanap ang Madmanna sa Khirbet Tatrit o Khirbet umm ed-Deimneh, mga guho mga 17–19 km sa hilagang-silangan ng Beer-seba sa hilagang Negev ng Israel, at wala sa dalawa ang nahukay."
  da:
    - "Bet-Markabot, »vognenes hus«, var en by i Simeon i Negev, nævnt to gange i samme selskab. Josvas liste over Simeons arv inden for Juda har »Ziklag og Beth-Marcaboth og Hazar-Susa«, og Krønikeskriveren gentager den: »i Beth-Markaboth og i Hazar-Susim og i Beth-Biri og i Saaraim; disse vare deres Stæder, indtil David blev Konge«. Hasar-Susa ved siden af betyder »hestenes indhegning«. I Josvas liste over Judas egne byer indtages den samme plads af Madmanna og Sansanna, så de fleste tager Bet-Markabot for et andet navn for Madmanna, måske et senere, og Hasar-Susa for Sansanna."
    - "Navnene har antydet et depot for vogne og heste ved sydvejen, af den slags Salomo holdt i sine »Vognstæder og Stæder til Ryttere«, men det er et gæt ud fra ordene alene; intet i teksten siger det. Intet sted er kendt. Madmanna søges ved Khirbet Tatrit eller Khirbet umm ed-Deimneh, ruiner omkring 17–19 km nordøst for Beersheba i Israels nordlige Negev, og ingen af dem er udgravet."
  sr:
    - "Вет-Мархавот, „дом кола“, био је град Симеунов у Негеву, двапут именован у истом друштву. Исусов списак Симеуновог наследства унутар Јуде има „и Сиклаг и Вет-Мархавот и Асар-Суса“, а Летописац га понавља: „у Вет-Мархавоту и у Асар-Сусиму и у Вет-Виреју и у Сараиму. То беху градови њихови до цара Давида“. Асар-Суса поред њега значи „ограда коња“. У Исусовом списку Јудиних властитих градова исти положај држе Мадмана и Сансана, па већина узима Вет-Мархавот као друго име Мадмане, можда касније, а Асар-Сусу као Сансану."
    - "Имена су наговештавала депо кола и коња на јужном путу, какве је Соломун држао: „градове у којима му беху кола, и градове у којима му беху коњици“, али то је претпоставка само из речи; текст то не каже. Налазиште није познато. Мадмана се тражи у Хирбет Татриту или Хирбет ум ед-Дејмнеу, рушевинама неких 17–19 км североисточно од Вирсавеје у северном Негеву Израела, а ниједна није ископавана."
  hu:
    - "Bét-Markabót, „a szekerek háza”, Simeon városa volt a Negevben, kétszer ugyanabban a társaságban nevezik meg. Józsué jegyzéke Simeon Júdán belüli örökségéről tartalmazza: „Cziklág, Béth-Markaboth és Haczar-Szusza”, a Krónikák írója pedig megismétli: „Beth-Markabótban, Haczar-Szuszimban, Beth-Biriben és Saáraimban; ezek valának az ő városaik mindaddig, míg Dávid királylyá lett.” A mellette álló Hácar-Szúsza „lovak karámját” jelenti. Józsué Júda saját városainak jegyzékében ugyanezt a helyet Madmanna és Szánszanna foglalja el, így a legtöbben Bét-Markabótot Madmanna másik, talán későbbi nevének tartják, Hácar-Szúszát pedig Szánszannáénak."
    - "A nevek szekerek és lovak déli úton lévő depójára utaltak, olyanra, mint amilyeneket Salamon építtetett: „a szekerek városait, és a lovagok városait”, de ez pusztán a szavakból való találgatás; a szöveg ezt nem mondja. Helye nem ismert. Madmannát a Khirbet Tatritnál vagy a Khirbet umm ed-Deimnehnél keresik, a Beérsebától 17–19 km-re északkeletre fekvő romoknál Izráel északi Negevjében, és egyiket sem ásták ki."
  fi:
    - "Bet-Markabot, ”vaunujen talo”, oli Simeonin kaupunki Negevissä, nimetty kahdesti samassa seurassa. Joosuan Simeonin Juudan sisällä olevan perintöosan luettelossa on ”Siklag, Beet-Markabot, Hasar-Suusa”, ja Aikakirjojen kirjoittaja toistaa sen: ”Beet-Markabotissa, Hasar-Suusimissa, Beet-Birissä ja Saaraimissa. Nämä olivat heidän kaupunkinsa Daavidin hallitukseen asti.” Sen vieressä Hasar-Susa tarkoittaa ”hevosten aitausta”. Joosuan Juudan omien kaupunkien luettelossa saman aseman ottavat Madmanna ja Sansanna, joten useimmat pitävät Bet-Markabotia Madmannan toisena nimenä, ehkä myöhäisempänä, ja Hasar-Susaa Sansannana."
    - "Nimet ovat vihjanneet vaunujen ja hevosten varikkoon eteläisellä tiellä, sellaiseen, jollaisia Salomo piti: ”kaikki vaunukaupungit ja ratsumiesten kaupungit”, mutta se on pelkästään sanoista tehty arvaus; tekstissä ei sanota sitä. Paikkaa ei tunneta. Madmannaa etsitään Khirbet Tatritilta tai Khirbet umm ed-Deimnehiltä, raunioilta noin 17–19 km Beerseban koillispuolella Israelin pohjoisessa Negevissä, eikä kumpaakaan ole kaivettu."
  vi:
    - "Bết-Ma-ca-bốt, “nhà của những cỗ xe”, là một thành của Si-mê-ôn ở Nê-ghép, được nêu hai lần trong cùng nhóm. Danh sách sản nghiệp của Si-mê-ôn trong Giu-đa của Giô-suê có “Xiếc-lác, Bết-Ma-ca-bốt, Hát-sa-Su-sa”, và sử gia sách Sử Ký lặp lại: “ở tại Bết-Ma-ca-bốt, Hát-sa-Su-sim, Bết-Bi-rê, và tại Sa-a-ra-im. Ấy là các thành của chúng cho đến đời vua Đa-vít”. Hát-sa-Su-sa bên cạnh nghĩa là “khu rào của ngựa”. Trong danh sách các thành riêng của Giu-đa trong sách Giô-suê, cùng vị trí này do Mát-ma-na và San-sa-na giữ: “Xiếc-lát, Mát-ma-na, San-sa-na”, nên phần lớn cho Bết-Ma-ca-bốt là tên khác của Mát-ma-na, có lẽ là tên muộn hơn, và Hát-sa-Su-sa là San-sa-na."
    - "Các tên gợi ý một kho xe và ngựa trên đường phía nam, thuộc loại Sa-lô-môn giữ trong “những thành để xe cộ, những thành cho quân kỵ” của mình, nhưng đó là phỏng đoán chỉ từ chữ nghĩa; bản văn không nói. Không biết địa điểm. Mát-ma-na được tìm tại Khirbet Tatrit hoặc Khirbet umm ed-Deimneh, các tàn tích cách Bê-e-Sê-ba khoảng 17–19 km về phía đông bắc ở bắc Nê-ghép của Israel, và cả hai chưa được khai quật."
  ro:
    - "Bet-Marcabot, „casa carelor”, era o cetate a lui Simeon în Neghev, numită de două ori, de fiecare dată alături de aceleași nume. Lista lui Iosua a moștenirii lui Simeon în interiorul lui Iuda are „Siclagul, Vitamarhavot, Asersusim”, iar Cronicarul o repetă: „Și în Vetmarimot și în Imisuseosin, și a casei Varuseorim, acestea sunt cetățile lor până la împăratul David”. Hațar-Susa, de lângă ea, înseamnă „împrejmuirea cailor”. În lista cetăților proprii ale lui Iuda, aceeași poziție o ocupă Madmana și Sansana, așa că cei mai mulți socotesc Bet-Marcabot un alt nume pentru Madmana, poate unul mai târziu, și Hațar-Susa pentru Sansana."
    - "Numele au sugerat un depozit de care și cai pe drumul de sud, de felul celui pe care Solomon îl ținea în „toate cetățile carelor și toate cetățile călăreților”, dar este o presupunere doar din cuvinte; nimic din text nu o spune. Niciun loc nu este cunoscut. Madmana este căutată la Khirbet Tatrit sau Khirbet umm ed-Deimneh, ruine la 17–19 km nord-est de Beer-Șeba, în Neghevul de nord al Israelului, iar niciuna nu a fost excavată."
  bg:
    - "Бет-Маркавот, „дом на колесници“, бил град на Симеон в Негев, назован два пъти в една и съща компания. Списъкът на Иисус Навин за наследството на Симеон в Юда има „и Сиклаг, и Вет-маркавот, и Асар-суса“, а Летописецът го повтаря: „и във Вет-мархавот, и в Асар-сусим, и в Вет-вирей, и в Саараим: тези бяха градовете им до царствуването на Давида“. Хацар-Суса до него означава „ограда на конете“. В списъка на Иисус Навин на собствените градове на Юда същото място заемат Мадмана и Сансана, затова повечето вземат Бет-Маркавот за друго име на Мадмана, може би по-късно, а Хацар-Суса — за Сансана."
    - "Имената са навели мисълта за склад на колесници и коне на южния път, от вида, който Соломон държал в „градовете на колесниците, и градовете на конниците“, но това е догадка само по думите; нищо в текста не го казва. Мястото не е известно. Мадмана се търси при Хирбет Татрит или Хирбет Ум ед-Деймне, развалини на около 17–19 км североизточно от Вирсавия в северния Негев на Израил, и нито едната не е разкопана."
