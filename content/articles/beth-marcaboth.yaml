# Overview article (ADR 0007). Mainstream facts only; the equation with Madmannah rests on the parallel lists and is said so; the guess about a chariot depot is called a guess; no site.
id: beth-marcaboth
place: a87f8f5
title:
  en: "Beth-marcaboth"
  ru: "Беф-Маркавоф"
  uk: "Бет-Маркавот"
  es: "Bet-marcabot"
  pt: "Bete-Marcabote"
  de: "Bet-Markabot"
  fr: "Beth-Marcaboth"
body:
  en:
    - "Beth-marcaboth, “house of chariots”, was a town of Simeon in the Negeb, named twice in the same company. Joshua's list of Simeon's inheritance within Judah has “Ziklag, and Beth-marcaboth, and Hazar-susah”, and the Chronicler repeats it: “at Beth-marcaboth, and Hazar-susim, and at Beth-birei, and at Shaaraim. These were their cities unto the reign of David”. Hazar-susah beside it means “enclosure of horses”. In Joshua's list of Judah's own towns the same position is held by Madmannah and Sansannah, so most take Beth-marcaboth to be another name for Madmannah, perhaps a later one, and Hazar-susah for Sansannah."
    - "The names have suggested a depot of chariots and horses on the southern road, of the kind Solomon kept in his “cities for his chariots, and cities for his horsemen”, but that is a guess from the words alone; nothing in the text says it. No site is known. Madmannah is sought at Khirbet Tatrit or Khirbet umm ed-Deimneh, ruins some 15 km north-east of Beersheba in the northern Negev of Israel, and neither has been excavated."
  ru:
    - "Беф-Маркавоф, «дом колесниц», — город Симеона в Негеве, дважды названный в одном и том же ряду. Список удела Симеона внутри Иуды в книге Иисуса Навина даёт «Циклаг, Беф-Маркавоф и Хацар-Суса», и Паралипоменон его повторяет: «в Беф-Маркавофе, в Хацарсусиме, в Беф-Биреи и в Шаариме. Вот города их до царствования Давидова». Хацар-Суса рядом с ним значит «двор коней». В списке собственных городов Иуды то же место занимают Мадмана и Сансана, поэтому большинство считают Беф-Маркавоф другим, может быть, более поздним именем Мадманы, а Хацар-Сусу — Сансаны."
    - "Имена наводили на мысль о стоянке колесниц и коней на южной дороге, вроде тех, что были у Соломона: «города для колесниц, и города для конницы», но это догадка по одним словам; в тексте ничего такого нет. Место неизвестно. Мадману ищут в Хирбет-Татрите или Хирбет-Умм-эд-Деймне, руинах примерно в 15 км к северо-востоку от Беэр-Шевы в северном Негеве Израиля, и ни одну из них не копали."
  uk:
    - "Бет-Маркавот, «дім колісниць», було містом Симеона в Негеві, названим двічі в одній компанії. Перелік спадщини Симеона всередині Юди в книзі Ісуса Навина має «Зиклаг, Бет-Маркабот і Газар-Суса», і хронікар повторює: «В Бет-Маркавотї, в Хазарсусимі, в Бет-Біреї та в Шааримі. Оце міста їх до Давидового царювання». Хацар-Суса поряд означає «двір коней». У переліку власних міст Юди ту саму позицію займають Мадманна і Сансана, тож більшість вважає Бет-Маркавот іншою назвою Мадманни, можливо, пізнішою, а Хацар-Суса — Сансани."
    - "Назви навели на думку про склад колісниць і коней на південній дорозі, на кшталт тих, що Соломон тримав у своїх «міста про вози й міста про кінноту», але це здогад лише зі слів; у тексті про це нічого не сказано. Місце невідоме. Мадманну шукають у Хірбет-Татріті чи Хірбет-умм-ед-Дейменех, руїнах приблизно за 15 км на північний схід від Беер-Шеви в північному Негеві Ізраїлю, і жодну не розкопували."
  es:
    - "Bet-marcabot, «casa de carros», era una ciudad de Simeón en el Néguev, nombrada dos veces en la misma compañía. La lista de Josué de la heredad de Simeón dentro de Judá tiene «Siclag, Beth-marchâboth, y Hasar-susa», y el Cronista la repite: «Y en Beth-marchâboth, y en Hasasusim, y en Beth-birai, y en Saaraim. Estas fueron sus ciudades hasta el reino de David». Hazar-susa a su lado significa «recinto de caballos». En la lista de Josué de las ciudades propias de Judá, la misma posición la ocupan Madmana y Sansana, por lo que la mayoría toma Bet-marcabot por otro nombre de Madmana, quizá posterior, y Hazar-susa por Sansana."
    - "Los nombres han sugerido un depósito de carros y caballos en el camino meridional, del tipo que Salomón mantenía en «las ciudades de los carros, y las ciudades de la gente de á caballo», pero eso es una conjetura a partir de las palabras solas; nada en el texto lo dice. No se conoce ningún sitio. Madmana se busca en Khirbet Tatrit o Khirbet umm ed-Deimneh, ruinas a unos 15 km al nordeste de Beerseba, en el Néguev septentrional de Israel, y ninguna ha sido excavada."
  pt:
    - "Bete-Marcabote, “casa de carros”, era uma cidade de Simeão no Neguebe, nomeada duas vezes na mesma companhia. A lista de Josué da herança de Simeão dentro de Judá tem “Ziclague, Bete-Marcabote, Hazar-Susa”, e o Cronista a repete: “em Bete-Marcabote, em Hazar-Susim, em Bete-Biri e em Saaraim. Estas foram as suas cidades até o reinado de Davi”. Hazar-Susa, ao lado, significa “recinto de cavalos”. Na lista das cidades do próprio Judá, a mesma posição é ocupada por Madmana e Sansana, de modo que a maioria toma Bete-Marcabote por outro nome de Madmana, talvez mais tardio, e Hazar-Susa por Sansana."
    - "Os nomes sugeriram um depósito de carros e cavalos na estrada do sul, do tipo que Salomão mantinha nas “cidades para os seus carros” e nas “cidades para os seus cavaleiros”, mas isso é uma conjetura só a partir das palavras; nada no texto o diz. Nenhum sítio é conhecido. Madmana é procurada em Khirbet Tatrit ou Khirbet umm ed-Deimneh, ruínas a cerca de 15 km a nordeste de Berseba, no norte do Neguev de Israel, e nenhuma foi escavada."
  de:
    - "Bet-Markabot, „Haus der Wagen“, war eine Stadt Simeons im Negev, zweimal in derselben Gesellschaft genannt. Josuas Liste von Simeons Erbteil innerhalb Judas hat „Ziklag, Beth-Markaboth, Hazar-Susa“, und der Chronist wiederholt sie: „Beth-Markaboth, Hasar-Susim, Beth-Birei, Saaraim. Dies waren ihre Städte bis auf den König David“. Hazar-Susa daneben bedeutet „Gehege der Pferde“. In Josuas Liste der eigenen Städte Judas halten dieselbe Stellung Madmanna und Sansanna, daher nehmen die meisten Bet-Markabot für einen anderen, vielleicht späteren Namen Madmannas und Hazar-Susa für Sansanna."
    - "Die Namen haben ein Depot für Wagen und Pferde an der Südstraße nahegelegt, wie Salomo sie in seinen „Städten der Wagen“ und „Städten der Reiter“ hielt, doch das ist eine Vermutung allein aus den Worten; nichts im Text sagt es. Keine Stätte ist bekannt. Madmanna sucht man in Chirbet Tatrit oder Chirbet umm ed-Deimne, Ruinen etwa 15 km nordöstlich von Beerscheba im nördlichen Negev Israels, und keine wurde ausgegraben."
  fr:
    - "Beth-Marcaboth, « maison de chars », était une ville de Siméon dans le Négev, nommée deux fois en même compagnie. La liste de Josué de l’héritage de Siméon à l’intérieur de Juda porte « Tsiklag, Beth-Marcaboth, Hatsar-Susa », et le Chroniste la répète : « à Beth-Marcaboth, à Hatsar-Susim, à Beth-Bireï et à Schaaraïm. Ce furent là leurs villes jusqu’au règne de David ». Hatsar-Susa à côté signifie « enclos de chevaux ». Dans la liste de Josué des villes propres de Juda, la même place est tenue par Madmanna et Sansanna ; la plupart tiennent donc Beth-Marcaboth pour un autre nom de Madmanna, peut-être plus tardif, et Hatsar-Susa pour Sansanna."
    - "Les noms ont suggéré un dépôt de chars et de chevaux sur la route du sud, tel que Salomon en tenait dans « les villes pour les chars, les villes pour la cavalerie », mais c’est une conjecture tirée des seuls mots ; rien dans le texte ne le dit. Aucun site n’est connu. Madmanna est cherchée à Khirbet Tatrit ou à Khirbet umm ed-Deimneh, ruines à quelque 15 km au nord-est de Beer-Schéba dans le nord du Négev israélien, et aucune n’a été fouillée."
