# Overview article (ADR 0007). Mainstream facts only; a minor place with little archaeology, and the article says so.
id: ono
place: ae6bfe2
title:
  en: "Ono"
  ru: "Оно"
body:
  en:
    - "Ono was a town of the coastal plain inland from Joppa, near Lod, in the flat, fertile country of the Yarkon and Ayalon streams that the Bible calls “the plain of Ono”. A town of the same name, Unu, stands in the list of Canaanite places carved by Thutmose III at Karnak in the fifteenth century BC. Chronicles says it was built by Shemed of Benjamin together with Lod. After the exile “The children of Lod, Hadid, and Ono” came back from Babylon, 725 by Ezra's list, 721 by Nehemiah's, and Benjamites settled again at “Lod, and Ono, the valley of craftsmen”. When Nehemiah's wall was nearly finished, Sanballat and Geshem sent to him, “Come, let us meet together in some one of the villages in the plain of Ono”, and he refused, knowing they meant him harm; the plain seems to have lain outside the province of Judah, on neutral ground."
    - "The Mishnah counts Ono among the towns walled since the days of Joshua, and rabbis of Ono appear in the Talmud. The name survived in the Arab village of Kafr Ana, east of Jaffa, whose site most scholars take for the biblical town; the neighbouring Kafr Juna is the app's lesser candidate. Kafr Ana was abandoned in the war of 1948, and the Israeli town of Or Yehuda rose on its lands in the 1950s. No excavation has tested the site, and nothing of ancient Ono can be seen."
    - "Today the plain of Ono is built over by the suburbs of Tel Aviv: Or Yehuda on the old village, Kiryat Ono to the north, named after the biblical town, and Lod with Ben Gurion airport to the east."
  ru:
    - "Оно — город приморской равнины в глубине от Иоппии, близ Лода, в плоском плодородном краю рек Яркон и Аялон, который Библия зовёт равниной Оно. Город с тем же именем, Уну, стоит в списке ханаанских мест, высеченном Тутмосом III в Карнаке в XV веке до н. э. Паралипоменон говорит, что его построил Шемер из колена Вениаминова вместе с Лодом. После плена списки вернувшихся из Вавилона считают «уроженцев Лидды, Хадида и Оно»: 725 у Ездры, 721 у Неемии; Вениамитяне снова поселились в Лоде и Оно, «в долине Харашиме», долине ремесленников. Когда стена Неемии была почти закончена, Санаваллат и Гешем послали к нему: «приди, и сойдемся в одном из сел на равнине Оно», и он отказался, зная, что они замышляют зло; равнина, по-видимому, лежала вне провинции Иудея, на ничейной земле между Самарией и Иерусалимом."
    - "Мишна числит Оно среди городов, обнесённых стеной со дней Иисуса Навина, а в Талмуде встречаются раввины из Оно. Имя сохранилось в арабской деревне Кафр-Ана к востоку от Яффы, которую большинство учёных принимает за библейский город; соседняя Кафр-Джуна — второй, менее вероятный кандидат приложения. Кафр-Ана была покинута в войну 1948 года, и в 1950-х на её землях вырос израильский город Ор-Йехуда. Раскопками место не проверялось, и от древнего Оно ничего не видно."
    - "Сегодня равнина Оно застроена пригородами Тель-Авива: Ор-Йехуда на месте старой деревни, Кирьят-Оно к северу, названный по библейскому городу, и Лод с аэропортом Бен-Гурион к востоку."
