body:
  en:
    - "Ono was a town of the coastal plain inland from Joppa, near Lod, in the flat, fertile country of the Yarkon and Ayalon streams that the Bible calls “the plain of Ono”. A town of the same name, Unu, stands in the list of Canaanite places carved by Thutmose III at Karnak in the fifteenth century BC. Chronicles says it was built by Shemed of Benjamin together with Lod. After the exile “The children of Lod, Hadid, and Ono” came back from Babylon, 725 by Ezra's list, 721 by Nehemiah's, and Benjamites settled again at “Lod, and Ono, the valley of craftsmen”. When Nehemiah's wall was nearly finished, Sanballat and Geshem sent to him, “Come, let us meet together in some one of the villages in the plain of Ono”, and he refused, knowing they meant him harm; the plain seems to have lain outside the province of Judah, on neutral ground."
    - "The Mishnah counts Ono among the towns walled since the days of Joshua, and the town is often mentioned in the Talmud. The name survived in the Arab village of Kafr Ana, east of Jaffa, whose site most scholars take for the biblical town; the neighbouring Kafr Juna is the lesser candidate on the map. Kafr Ana was abandoned in the war of 1948, and the Israeli town of Or Yehuda rose on its lands in the 1950s. The site lies under the modern town and has seen only small salvage excavations; nothing of ancient Ono can be seen."
    - "Today the plain of Ono is built over by the suburbs of Tel Aviv: Or Yehuda on the old village, Kiryat Ono to the north, named after the biblical town, and Lod with Ben Gurion airport to the east."
  ru:
    - "Оно — город приморской равнины в глубине от Иоппии, близ Лода, в плоском плодородном краю рек Яркон и Аялон, который Библия зовёт равниной Оно. Город с тем же именем, Уну, стоит в списке ханаанских мест, высеченном Тутмосом III в Карнаке в XV веке до н. э. Паралипоменон говорит, что его построил Шемер из колена Вениаминова вместе с Лодом. После плена списки вернувшихся из Вавилона считают «уроженцев Лидды, Хадида и Оно»: 725 у Ездры, 721 у Неемии; Вениамитяне снова поселились в Лоде и Оно, «в долине Харашиме», долине ремесленников. Когда стена Неемии была почти закончена, Санаваллат и Гешем послали к нему: «приди, и сойдемся в одном из сел на равнине Оно», и он отказался, зная, что они замышляют зло; равнина, по-видимому, лежала вне провинции Иудея, на ничейной земле между Самарией и Иерусалимом."
    - "Мишна числит Оно среди городов, обнесённых стеной со дней Иисуса Навина, а Талмуд часто упоминает этот город. Имя сохранилось в арабской деревне Кафр-Ана к востоку от Яффы, которую большинство учёных принимает за библейский город; соседняя Кафр-Джуна — второй, менее вероятный кандидат на карте. Кафр-Ана была покинута в войну 1948 года, и в 1950-х на её землях вырос израильский город Ор-Йехуда. Место лежит под современным городом, и на нём велись лишь небольшие спасательные раскопки; от древнего Оно ничего не видно."
    - "Сегодня равнина Оно застроена пригородами Тель-Авива: Ор-Йехуда на месте старой деревни, Кирьят-Оно к северу, названный по библейскому городу, и Лод с аэропортом Бен-Гурион к востоку."
  uk:
    - "Оно було містом прибережної рівнини в глибині країни від Яффи, поблизу Лідди, на плоскій родючій землі потоків Яркон і Аялон, яку Біблія називає рівниною Оно. Місто з такою самою назвою, Уну, є в переліку ханаанських місць, висіченому Тутмосом III у Карнаку в XV ст. до н. е. За Хроніками, його збудував Шемер із Веніямина разом із Лиддою. Після заслання з Вавилона повернулися ті, «що родом з Лидди, Хадида та Оно»: 725 за списком Ездри, 721 за списком Неемії, а веніяминівці знову оселилися в «Лодї, Оно, в долинї Харашимі». Коли мур Неемії був майже завершений, Санаваллат і Гешем надіслали до нього: «Прийди, а зійдемось разом ув одному з сїл на рівнинї Оно», — і він відмовився, знаючи про їхній злий намір; рівнина, схоже, лежала поза провінцією Юда, на нейтральній землі."
    - "Мішна зараховує Оно до міст, обнесених мурами ще з днів Ісуса Навина, а в Талмуді місто часто згадується. Назва збереглася в арабському селі Кафр-Ана на схід від Яффи, місце якого більшість учених вважає біблійним містом; сусідня Кафр-Джуна — слабший кандидат на мапі. Кафр-Ана була покинута під час війни 1948 року, а на її землях у 1950-х роках постало ізраїльське місто Ор-Єгуда. Місце лежить під сучасним містом, і там проводили лише невеликі рятувальні розкопки; від давнього Оно нічого не видно."
    - "Нині рівнина Оно забудована передмістями Тель-Авіва: Ор-Єгуда на місці старого села, Кір’ят-Оно на півночі, названий на честь біблійного міста, і Лідда з аеропортом Бен-Гуріона на сході."
  es:
    - "Ono era una ciudad de la llanura costera, tierra adentro desde Jope, cerca de Lod, en el país llano y fértil de los arroyos Yarkon y Ayalón que la Biblia llama «el campo de Ono». Una ciudad del mismo nombre, Unu, figura en la lista de lugares cananeos grabada por Tutmosis III en Karnak en el siglo XV a. C. Crónicas dice que la edificó Semed de Benjamín junto con Lod. Tras el exilio volvieron de Babilonia «Los hijos de Lod, Hadid, y Ono», 725 según la lista de Esdras, 721 según la de Nehemías, y los benjaminitas se establecieron de nuevo en «Lod, y Ono, valle de los artífices». Cuando el muro de Nehemías estaba casi acabado, Sanbalat y Gesem le enviaron a decir: «Ven, y compongámonos juntos en alguna de las aldeas en el campo de Ono», y él se negó, sabiendo que le querían hacer mal; la llanura parece haber quedado fuera de la provincia de Judá, en terreno neutral."
    - "La Misná cuenta Ono entre las ciudades amuralladas desde los días de Josué, y el Talmud menciona a menudo la ciudad. El nombre sobrevivió en la aldea árabe de Kafr Ana, al este de Jafa, cuyo emplazamiento la mayoría de los estudiosos toma por la ciudad bíblica; la vecina Kafr Juna es el candidato menor en el mapa. Kafr Ana fue abandonada en la guerra de 1948, y la ciudad israelí de Or Yehuda se levantó sobre sus tierras en la década de 1950. El lugar yace bajo la ciudad moderna y solo ha tenido pequeñas excavaciones de salvamento; no se puede ver nada de la antigua Ono."
    - "Hoy la llanura de Ono está urbanizada por los suburbios de Tel Aviv: Or Yehuda sobre la antigua aldea, Kiryat Ono al norte, que lleva el nombre de la ciudad bíblica, y Lod con el aeropuerto Ben Gurión al este."
  pt:
    - "Ono era uma cidade da planície costeira, no interior de Jope, perto de Lode, no país plano e fértil dos riachos Yarkon e Ayalon que a Bíblia chama de “planície de Ono”. Uma cidade de mesmo nome, Unu, consta da lista de lugares cananeus gravada por Tutmés III em Karnak no século XV a.C. Crônicas diz que foi edificada por Semede, de Benjamim, junto com Lode. Depois do exílio, “os filhos de Lode, Hadide e Ono” voltaram da Babilônia, 725 pela lista de Esdras, 721 pela de Neemias, e benjamitas se estabeleceram de novo “em Lode e em Ono, o vale dos artesãos”. Quando o muro de Neemias estava quase pronto, Sambalá e Gesém lhe mandaram dizer: “Venha! Vamos nos encontrar em uma das aldeias na planície de Ono”, e ele recusou, sabendo que queriam lhe fazer mal; a planície parece ter ficado fora da província de Judá, em terreno neutro."
    - "A Mixná conta Ono entre as cidades muradas desde os dias de Josué, e a cidade é mencionada com frequência no Talmude. O nome sobreviveu na aldeia árabe de Kafr Ana, a leste de Jafa, cujo local a maioria dos estudiosos toma pela cidade bíblica; a vizinha Kafr Juna é o candidato menor no mapa. Kafr Ana foi abandonada na guerra de 1948, e a cidade israelense de Or Yehuda surgiu em suas terras na década de 1950. O local fica sob a cidade moderna e só teve pequenas escavações de salvamento; nada da antiga Ono pode ser visto."
    - "Hoje a planície de Ono está coberta pelos subúrbios de Tel Aviv: Or Yehuda sobre a antiga aldeia, Kiryat Ono ao norte, com o nome da cidade bíblica, e Lode, com o aeroporto Ben Gurion, a leste."
  de:
    - "Ono war eine Stadt der Küstenebene landeinwärts von Joppe, bei Lod, im flachen, fruchtbaren Land der Bäche Jarkon und Ajalon, das die Bibel „die Fläche Ono“ nennt. Ein Ort desselben Namens, Unu, steht in der Liste kanaanäischer Orte, die Tutmosis III. im 15. Jahrhundert v. Chr. in Karnak einmeißeln ließ. Die Chronik sagt, es sei von Schemed aus Benjamin zusammen mit Lod gebaut worden. Nach dem Exil kamen „der Kinder von Lod, Hadid und Ono“ aus Babylon zurück, 725 nach Esras Liste, 721 nach der Nehemias, und Benjaminiter siedelten wieder in „Lod und Ono, im Tal der Zimmerleute“. Als Nehemias Mauer fast fertig war, ließen Sanballat und Geschem ihm sagen: „Komm und laß uns zusammenkommen in den Dörfern in der Fläche Ono!“, und er lehnte ab, weil er wusste, dass sie ihm Böses wollten; die Ebene scheint außerhalb der Provinz Juda auf neutralem Boden gelegen zu haben."
    - "Die Mischna zählt Ono zu den Städten, die seit den Tagen Josuas ummauert sind, und im Talmud wird die Stadt oft erwähnt. Der Name überlebte im arabischen Dorf Kafr Ana östlich von Jaffa, dessen Stätte die meisten Gelehrten für die biblische Stadt halten; das benachbarte Kafr Dschuna ist auf der Karte der geringere Kandidat. Kafr Ana wurde im Krieg von 1948 aufgegeben, und auf seinem Land entstand in den 1950er Jahren die israelische Stadt Or Jehuda. Die Stätte liegt unter der modernen Stadt, und dort gab es nur kleine Rettungsgrabungen; vom antiken Ono ist nichts zu sehen."
    - "Heute ist die Fläche Ono von den Vororten von Tel Aviv überbaut: Or Jehuda auf dem alten Dorf, Kirjat Ono im Norden, nach der biblischen Stadt benannt, und Lod mit dem Flughafen Ben Gurion im Osten."
  fr:
    - "Ono était une ville de la plaine côtière, dans l’arrière-pays de Joppé, près de Lod, dans le pays plat et fertile du Yarkon et de l’Ayalon que la Bible appelle « la vallée d’Ono ». Une ville du même nom, Unu, figure sur la liste des lieux cananéens gravée par Thoutmosis III à Karnak au XVe siècle av. J.-C. Les Chroniques disent que Schémed de Benjamin la bâtit avec Lod. Après l’exil, « les fils de Lod, de Hadid et d’Ono » revinrent de Babylone, 725 selon la liste d’Esdras, 721 selon celle de Néhémie, et des Benjamites se réinstallèrent « à Lod et à Ono, la vallée des ouvriers ». Quand le mur de Néhémie fut presque achevé, Sanballat et Guéschem lui firent dire : « Viens, et ayons ensemble une entrevue dans les villages de la vallée d’Ono » ; il refusa, les sachant mal intentionnés ; la vallée semble s’être trouvée hors de la province de Juda, en terrain neutre."
    - "La Mishna range Ono parmi les villes entourées de murs depuis les jours de Josué, et le Talmud mentionne souvent la ville. Le nom a survécu dans le village arabe de Kafr Ana, à l’est de Jaffa, dont la plupart des spécialistes font le site de la ville biblique ; le voisin Kafr Juna est le candidat moindre de la carte. Kafr Ana fut abandonné dans la guerre de 1948, et la ville israélienne d’Or Yehuda s’éleva sur ses terres dans les années 1950. Le site est sous la ville moderne et n’a connu que de petites fouilles de sauvetage ; rien de l’antique Ono ne se voit."
    - "Aujourd’hui, la vallée d’Ono est couverte par les banlieues de Tel-Aviv : Or Yehuda sur l’ancien village, Kiryat Ono au nord, nommée d’après la ville biblique, et Lod avec l’aéroport Ben Gourion à l’est."
  it:
    - "Ono era una città della pianura costiera nell’entroterra di Giaffa, presso Lidda, nella pianura fertile e piatta dei torrenti Yarkon e Ayalon che la Bibbia chiama «valle di Ono». Una città di nome Unu compare nell’elenco di luoghi cananei scolpito da Tutmosi III a Karnak nel XV secolo a.C. Le Cronache dicono che fu costruita da Semed di Beniamino insieme a Lidda. Dopo l’esilio «i figliuoli di Lod, di Hadid e d’Ono» tornarono da Babilonia, 725 secondo l’elenco di Esdra, 721 secondo quello di Neemia, e i Beniaminiti si stabilirono di nuovo «a Lod ed a Ono, valle degli artigiani». Quando le mura di Neemia erano quasi finite, Sanballàt e Geshem gli mandarono a dire: «Vieni, e troviamoci assieme in uno dei villaggi della valle di Ono»; egli rifiutò, sapendo che volevano fargli del male. La valle sembra essere stata fuori della provincia di Giuda, in terreno neutrale."
    - "La Mishnah conta Ono tra le città cinte di mura fin dai tempi di Giosuè, e la città è spesso menzionata nel Talmud. Il nome sopravvisse nel villaggio arabo di Kafr Ana, a est di Giaffa, il cui sito la maggior parte degli studiosi ritiene la città biblica; la vicina Kafr Juna è il candidato minore sulla mappa. Kafr Ana fu abbandonata nella guerra del 1948, e la città israeliana di Or Yehuda sorse sulle sue terre negli anni 1950. Il sito giace sotto la città moderna e ha avuto solo piccoli scavi di emergenza; dell’antica Ono non si vede nulla."
    - "Oggi la valle di Ono è occupata dai sobborghi di Tel Aviv: Or Yehuda sul vecchio villaggio, Kiryat Ono a nord, che prende il nome dalla città biblica, e Lidda con l’aeroporto Ben Gurion a est."
  pl:
    - "Ono było miastem na nadmorskiej równinie w głębi lądu od Jafy, koło Lod, w płaskim, żyznym kraju potoków Jarkon i Ajalon, o którym Biblia mówi: „na polu Ono”. Miasto o tej samej nazwie, Unu, stoi na liście miejsc kanaanejskich wykutej przez Totmesa III w Karnaku w XV wieku p.n.e. Kroniki mówią, że zbudował je Szemed z Beniamina wraz z Lod. Po wygnaniu z Babilonu wróciło „Synów Lodowych, Hadydowych, i Onowych” 725 według listy Ezdrasza i 721 według listy Nehemiasza, a beniaminici osiedlili się znów „W Lod, i w Ono, i w dolinie rzemieślników”. Gdy mur Nehemiasza był prawie ukończony, Sanballat i Geszem posłali do niego: „Przyjdź, a zejdźmy się społem we wsiach, które są na polu Ono”, a on odmówił, wiedząc, że chcą mu zaszkodzić; pole to zdaje się leżeć poza prowincją Judy, na gruncie neutralnym."
    - "Miszna zalicza Ono do miast otoczonych murem od dni Jozuego, a Talmud często wspomina to miasto. Nazwa przetrwała w arabskiej wsi Kafr Ana, na wschód od Jafy, której miejsce większość uczonych uważa za biblijne miasto; sąsiedni Kafr Juna jest na mapie kandydatem mniej prawdopodobnym. Kafr Ana opuszczono w wojnie 1948 roku, a izraelskie miasto Or Jehuda wyrosło na jej gruntach w latach pięćdziesiątych. Miejsce leży pod współczesnym miastem i prowadzono tu tylko niewielkie wykopaliska ratownicze; nic z dawnego Ono nie jest widoczne."
    - "Dziś równina Ono jest zabudowana przedmieściami Tel Awiwu: Or Jehuda na dawnej wsi, na północy Kirjat Ono, nazwane od biblijnego miasta, a na wschodzie Lod z lotniskiem Ben Guriona."
  cs:
    - "Onó bylo město na pobřežní rovině ve vnitrozemí od Joppe, poblíž Lodu, v rovinaté úrodné krajině potoků Jarkon a Ajalon, kterou Bible nazývá „rovinami Ono“. Město téhož jména, Unu, stojí v seznamu kenaanských míst, který dal Thutmose III. vytesat v Karnaku v 15. století př. n. l. Kroniky praví, že je vystavěl Šemed z Benjamína spolu s Lodem. Po exilu se z Babylóna vrátili „Synů Lodových, Chadidových a Onových“, podle Ezdrášova seznamu 725, podle Nehemjášova 721, a Benjamínci se znovu usadili „V Lod, v Ono a v údolí řemeslníků“. Když byla Nehemjášova hradba téměř dokončena, vzkázali mu Sanbalat a Gešem: „Přiď, a rozmluvíme spolu ve vsi na rovinách Ono“; odmítl, protože věděl, že mu chtějí ublížit; zdá se, že rovina ležela mimo judskou provincii, na neutrální půdě."
    - "Mišna počítá Onó mezi města opevněná od Jozuových dnů a talmud město často zmiňuje. Jméno se dochovalo v arabské vesnici Kafr Ana východně od Jaffy, kterou většina učenců pokládá za biblické město; sousední Kafr Júna je na mapě menším kandidátem. Kafr Ana byla opuštěna ve válce roku 1948 a na jejích polích vyrostlo v 50. letech izraelské město Or Jehuda. Místo leží pod moderním městem a proběhly tu jen malé záchranné vykopávky; z dávného Onó není nic vidět."
    - "Dnes je rovina Onó zastavěna předměstími Tel Avivu: Or Jehuda na staré vesnici, Kirjat Ono na severu, pojmenované po biblickém městě, a Lod s letištěm Ben Guriona na východě."
  nl:
    - "Ono was een stad van de kustvlakte landinwaarts van Joppe, bij Lydda, in het vlakke, vruchtbare land van de beken Jarkon en Ajalon dat de Bijbel “het dal Ono” noemt. Een stad met dezelfde naam, Unu, staat in de lijst van Kanaänitische plaatsen die Thoetmosis III in de 15e eeuw v.Chr. in Karnak liet uithouwen. Kronieken zegt dat ze samen met Lydda werd gebouwd door Semed van Benjamin. Na de ballingschap kwamen “de kinderen van Lod, Hadid en Ono” uit Babylon terug, 725 volgens Ezra’s lijst, 721 volgens die van Nehemia, en Benjaminieten vestigden zich weer in “Lod, en Ono, in het dal der werkmeesters”. Toen Nehemia’s muur bijna klaar was, stuurden Sanballat en Gesem hem het bericht: “Kom en laat ons te zamen vergaderen in de dorpen, in het dal Ono”, en hij weigerde, wetend dat zij hem kwaad wilden doen; het dal lag kennelijk buiten de provincie Juda, op neutraal terrein."
    - "De Misjna rekent Ono tot de steden die sinds de dagen van Jozua ommuurd waren, en de stad wordt in de Talmoed vaak genoemd. De naam leefde voort in het Arabische dorp Kafr Ana, ten oosten van Jaffa, waarvan de plaats volgens de meeste geleerden de bijbelse stad is; het nabijgelegen Kafr Juna is op de kaart de mindere kandidaat. Kafr Ana werd in de oorlog van 1948 verlaten, en de Israëlische stad Or Yehuda verrees in de jaren 1950 op zijn land. De plaats ligt onder de moderne stad en kende alleen kleine noodopgravingen; van het oude Ono is niets te zien."
    - "Tegenwoordig is het dal van Ono volgebouwd met de buitenwijken van Tel Aviv: Or Yehuda op het oude dorp, Kiryat Ono in het noorden, naar de bijbelse stad genoemd, en Lydda met de luchthaven Ben Gurion in het oosten."
  sv:
    - "Ono var en stad på kustslätten inåt land från Joppe, nära Lod, i det platta, bördiga landet kring bäckarna Yarkon och Ayalon som Bibeln kallar ”Onos dal”. En stad med samma namn, Unu, står i förteckningen över kananeiska platser som Thutmosis III lät rista i Karnak på 1400-talet f.Kr. Krönikeböckerna säger att den byggdes av Shemed av Benjamin tillsammans med Lod. Efter exilen kom ”Lods, Hadids och Onos barn” tillbaka från Babylon, 725 enligt Esras förteckning, 721 enligt Nehemjas, och benjaminiter bosatte sig åter i ”Lod, Ono, och Timmermansdalen”. När Nehemjas mur nästan var färdig sände Sanballat och Geshem bud till honom: ”Kom, låt oss träda tillsammans i Kefirim i Onos dal”, och han vägrade, eftersom han visste att de ville honom illa; dalen tycks ha legat utanför provinsen Juda, på neutral mark."
    - "Mishna räknar Ono bland de städer som varit muromgärdade sedan Josuas dagar, och staden nämns ofta i Talmud. Namnet överlevde i den arabiska byn Kafr Ana, öster om Jaffa, vars plats de flesta forskare tar för den bibliska staden; den närliggande Kafr Juna är den mindre kandidaten på kartan. Kafr Ana övergavs i kriget 1948, och den israeliska staden Or Yehuda reste sig på dess marker på 1950-talet. Platsen ligger under den moderna staden och har bara sett små räddningsgrävningar; ingenting av det forntida Ono kan ses."
    - "I dag är Onos dal bebyggd av Tel Avivs förorter: Or Yehuda på den gamla byn, Kiryat Ono i norr, uppkallat efter den bibliska staden, och Lod med Ben-Gurion-flygplatsen i öster."
