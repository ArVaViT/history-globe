# Overview article (ADR 0007). Mainstream facts only; disputed datings and readings are named as such. The place is Laodicea on the Lycus in Phrygia, not Laodicea in Syria.
id: laodicea
place: a83fb1e
title:
  en: "Laodicea"
  ru: "Лаодикия"
  uk: "Лаодікея"
  es: "Laodicea"
  pt: "Laodiceia"
  de: "Laodizea"
  fr: "Laodicée"
body:
  en:
    - "Laodicea lay in the valley of the Lycus in south-western Phrygia, near today's Denizli, on the main road from Ephesus to the east. Hierapolis faced it across the valley about 10 km to the north, and Colossae stood a little farther up the Lycus. Pliny says the place was called first Diospolis and then Rhoas; the Seleucid king Antiochus II refounded it in the mid-third century BC and named it after his wife Laodice."
    - "Strabo says that Laodicea, once small, grew large in his own and his fathers' time, although it had suffered a siege in the war of Mithridates; its fertile land and rich citizens made it wealthy, and its sheep gave soft wool of a raven-black colour. Between Laodicea and Carura stood a temple of Men Carus with a noted school of physicians. Cicero records that in 62 BC the governor Flaccus seized at Laodicea a little over twenty pounds of gold collected by the Jews for Jerusalem. In AD 60 an earthquake laid the city in ruins, and, Tacitus notes, it recovered by its own resources without help from Rome."
    - 'Epaphras laboured for the believers of Laodicea and Hierapolis, and Paul greeted "the brethren which are in Laodicea, and Nymphas, and the church which is in his house". He asked the Colossians to have his letter read in Laodicea and to read "the epistle from Laodicea", which has not survived; what it was is disputed. In Revelation, the last of the letters to the seven churches rebukes Laodicea as "lukewarm, and neither cold nor hot", proud that it is rich and has need of nothing, and counsels it to buy gold tried in the fire, white raiment and eyesalve. Many link the image of lukewarm water to the city''s water supply; others take it as a plain figure. The letter ends: "Behold, I stand at the door, and knock".'
    - "Melito of Sardis wrote that at the time when Sagaris suffered martyrdom, under the proconsul Servilius Paulus, a great dispute about the Passover arose at Laodicea; Polycrates of Ephesus names Sagaris as a bishop and martyr who rests at Laodicea. In the fourth century a church council met at Laodicea, usually dated about 363, though some place it anywhere between 343 and 381. The city was then the metropolis of the province of Phrygia Pacatiana."
  ru:
    - "Лаодикия лежала в долине Лика на юго-западе Фригии, у нынешнего Денизли, на главной дороге из Ефеса на восток. Иераполь стоял напротив, по другую сторону долины, примерно в 10 км к северу, а Колоссы — немного выше по Лику. Плиний сообщает, что сначала это место называлось Диосполем, а затем Роасом; селевкидский царь Антиох II в середине III века до н. э. основал город заново и назвал его в честь своей жены Лаодики."
    - "Страбон пишет, что Лаодикия, прежде небольшая, выросла при нём и при его отцах, хотя и пострадала от осады во время войны с Митридатом; плодородная земля и богатые граждане сделали её состоятельной, а её овцы давали мягкую шерсть цвета воронова крыла. Между Лаодикией и Карурой стоял храм Мена Кару со знаменитой врачебной школой. Цицерон сообщает, что в 62 г. до н. э. наместник Флакк забрал в Лаодикии немногим более двадцати фунтов золота, собранного иудеями для Иерусалима. В 60 г. н. э. землетрясение разрушило город, и он, как замечает Тацит, оправился своими силами, без помощи Рима."
    - "Епафрас трудился ради верующих Лаодикии и Иераполя, а Павел писал: «Приветствуйте братьев в Лаодикии, и Нимфана, и домашнюю церковь его». Он просил колоссян прочитать его послание в Лаодикии, а то, «которое из Лаодикии», прочитать и им; оно не сохранилось, и что это было, — спорно. В Откровении последнее из посланий семи церквам обличает Лаодикию: «ты тепл, а не горяч и не холоден»; она гордится, что богата и ни в чём не имеет нужды, и ей дан совет купить золото, огнём очищенное, белую одежду и глазную мазь. Многие связывают образ тёплой воды с водоснабжением города; другие видят в нём простое иносказание. Послание кончается словами: «Се, стою у двери и стучу»."
    - "Мелитон Сардийский писал, что в то время, когда принял мученичество Сагарис, при проконсуле Сервилии Павле, в Лаодикии возник великий спор о Пасхе; Поликрат Эфесский называет Сагариса епископом и мучеником, который покоится в Лаодикии. В IV веке в Лаодикии собрался церковный собор, который обычно датируют около 363 г., хотя иные относят его к любому году между 343 и 381. Город был тогда митрополией провинции Фригия Пакатиана."
  uk:
    - "Лаодікея лежала в долині Ліка на південному заході Фрігії, поблизу сучасного Денізлі, на головній дорозі з Ефеса на схід. Ієраполіс стояв навпроти неї через долину приблизно за 10 км на північ, а Колоси — трохи вище по Ліку. Пліній каже, що місце спершу звалося Діосполь, а потім Роас; селевкідський цар Антіох II заснував його заново в середині III ст. до н. е. й назвав за своєю дружиною Лаодікою."
    - "Страбон каже, що Лаодікея, колись мала, виросла велика за його життя й за життя його батьків, хоча й зазнала облоги у війні Мітрідата; родюча земля та багаті громадяни зробили її заможною, а її вівці давали м’яку вовну воронового чорного кольору. Між Лаодікеєю та Карурою стояв храм Мена Кароса зі славною школою лікарів. Цицерон записує, що в 62 р. до н. е. намісник Флакк захопив у Лаодікеї трохи більше двадцяти фунтів золота, зібраного євреями для Єрусалима. У 60 р. н. е. землетрус обернув місто на руїни, і, зазначає Тацит, воно відбудувалося власними силами без допомоги з Риму."
    - "Епафрас трудився для віруючих Лаодікеї та Ієраполіса, а Павло привітав: «Витайте братів, що в Лаодикиї, і Нимфана, і домашню церкву його». Він просив колосян подбати, щоб його лист прочитали в Лаодікеї, і самим прочитати «написане з Лаодикиї», що не збереглося; чим воно було, є спірним. В Одкровенні останній із листів до семи церков докоряє Лаодікеї, що вона «лїтний єси, і нї зимний нї гарячий», пишаючись, що багата й нічого не потребує, і радить їй купити золото, випробуване вогнем, білу одіж і мазь для очей. Багато хто пов’язує образ теплої води з водопостачанням міста; інші вважають його простою образною мовою. Лист закінчується: «Ось, стою під дверми і стукаю»."
    - "Мелітон Сардійський писав, що під час, коли Сагаріс прийняв мучеництво, за проконсула Сервілія Павла, у Лаодікеї спалахнула велика суперечка про Пасху; Полікрат Ефеський називає Сагаріса єпископом і мучеником, що спочиває в Лаодікеї. У IV ст. у Лаодікеї зібрався церковний собор, його зазвичай датують близько 363 р., хоча дехто відносить його до будь-якого часу між 343 і 381 рр. Місто тоді було метрополією провінції Фрігії Пакатіанської."
  es:
    - "Laodicea se hallaba en el valle del Lico, en el suroeste de Frigia, cerca de la actual Denizli, en el camino principal de Éfeso hacia el este. Hierápolis quedaba enfrente, al otro lado del valle, a unos 10 km al norte, y Colosas se alzaba algo más arriba, junto al Lico. Plinio dice que el lugar se llamó primero Diospolis y luego Rhoas; el rey seléucida Antíoco II la refundó a mediados del siglo III a. C. y le dio el nombre de su esposa Laodice."
    - "Estrabón dice que Laodicea, antes pequeña, creció mucho en su tiempo y en el de sus padres, aunque había sufrido un asedio en la guerra de Mitrídates; su fértil tierra y sus ricos ciudadanos la hicieron próspera, y sus ovejas daban una lana suave de color negro cuervo. Entre Laodicea y Carura se alzaba un templo de Men Caro con una célebre escuela de médicos. Cicerón registra que en 62 a. C. el gobernador Flaco confiscó en Laodicea algo más de veinte libras de oro reunidas por los judíos para Jerusalén. En el año 60 d. C. un terremoto dejó la ciudad en ruinas y, anota Tácito, se recuperó con sus propios recursos, sin ayuda de Roma."
    - "Epafras trabajó por los creyentes de Laodicea y de Hierápolis, y Pablo saludó «á los hermanos que están en Laodicea, y á Nimfas, y á la iglesia que está en su casa». Pidió a los colosenses que hicieran leer su carta en Laodicea y que leyeran «la de Laodicea», es decir, la carta procedente de Laodicea, que no se ha conservado; se discute qué era. En el Apocalipsis, la última de las cartas a las siete iglesias reprende a Laodicea como «tibio, y no frío ni caliente», orgullosa de ser rica y de no tener necesidad de nada, y le aconseja comprar oro probado en el fuego, vestiduras blancas y colirio. Muchos relacionan la imagen del agua tibia con el abastecimiento de agua de la ciudad; otros la toman como una figura sencilla. La carta termina: «He aquí, yo estoy á la puerta y llamo»."
    - "Melitón de Sardis escribió que en el tiempo en que Sagaris sufrió el martirio, bajo el procónsul Servilio Paulo, surgió en Laodicea una gran disputa sobre la Pascua; Polícrates de Éfeso nombra a Sagaris como obispo y mártir que reposa en Laodicea. En el siglo IV se reunió en Laodicea un concilio de la Iglesia, fechado habitualmente hacia 363, aunque algunos lo sitúan en cualquier año entre 343 y 381. La ciudad era entonces la metrópolis de la provincia de Frigia Pacatiana."
  pt:
    - "Laodiceia ficava no vale do Lico, no sudoeste da Frígia, perto da atual Denizli, na estrada principal de Éfeso para o leste. Hierápolis ficava diante dela, do outro lado do vale, a cerca de 10 km ao norte, e Colossos estava um pouco mais acima no Lico. Plínio diz que o lugar se chamou primeiro Diópolis e depois Roas; o rei selêucida Antíoco II a refundou em meados do século III a.C. e deu-lhe o nome de sua mulher, Laódice."
    - "Estrabão diz que Laodiceia, antes pequena, cresceu muito em seu tempo e no de seus pais, embora tivesse sofrido um cerco na guerra de Mitrídates; suas terras férteis e seus cidadãos ricos a enriqueceram, e suas ovelhas davam lã macia de cor negra como a do corvo. Entre Laodiceia e Carura ficava um templo de Mên Caro com uma célebre escola de médicos. Cícero registra que em 62 a.C. o governador Flaco apreendeu em Laodiceia pouco mais de vinte libras de ouro reunidas pelos judeus para Jerusalém. Em 60 d.C. um terremoto reduziu a cidade a ruínas e, nota Tácito, ela se recuperou com os próprios recursos, sem ajuda de Roma."
    - "Epafras trabalhou pelos crentes de Laodiceia e Hierápolis, e Paulo saudou “os irmãos que estão em Laodiceia, bem como Ninfa e a igreja que está em sua casa”. Pediu aos colossenses que mandassem ler sua carta em Laodiceia e que lessem “a carta de Laodiceia”, que não sobreviveu; o que era é disputado. No Apocalipse, a última das cartas às sete igrejas repreende Laodiceia como “morno, e não é quente nem frio”, orgulhosa de ser rica e de nada precisar, e a aconselha a comprar ouro refinado no fogo, vestes brancas e colírio. Muitos ligam a imagem da água morna ao abastecimento de água da cidade; outros a tomam como simples figura. A carta termina: “Eis que estou à porta e bato”."
    - "Melito de Sardes escreveu que, no tempo em que Sagaris sofreu o martírio, sob o procônsul Sérvilo Paulo, surgiu em Laodiceia uma grande disputa sobre a Páscoa; Polícrates de Éfeso nomeia Sagaris como bispo e mártir que repousa em Laodiceia. No século IV reuniu-se em Laodiceia um concílio da Igreja, geralmente datado de cerca de 363, embora alguns o situem em qualquer ano entre 343 e 381. A cidade era então a metrópole da província da Frígia Pacatiana."
  de:
    - "Laodizea lag im Tal des Lykos im südwestlichen Phrygien, nahe dem heutigen Denizli, an der Hauptstraße von Ephesus nach Osten. Hierapolis lag ihm etwa 10 km nördlich auf der anderen Talseite gegenüber, und Kolossae stand ein Stück weiter oben am Lykos. Plinius sagt, der Ort habe zuerst Diospolis und dann Rhoas geheißen; der seleukidische König Antiochos II. gründete ihn Mitte des 3. Jahrhunderts v. Chr. neu und nannte ihn nach seiner Frau Laodike."
    - "Strabon sagt, Laodizea sei, einst klein, zu seiner und seiner Väter Zeit groß geworden, obwohl es im Krieg des Mithridates eine Belagerung erlitten hatte; sein fruchtbares Land und seine reichen Bürger machten es wohlhabend, und seine Schafe gaben weiche Wolle von rabenschwarzer Farbe. Zwischen Laodizea und Karura stand ein Tempel des Men Karu mit einer berühmten Ärzteschule. Cicero berichtet, der Statthalter Flaccus habe 62 v. Chr. in Laodizea etwas über zwanzig Pfund Gold beschlagnahmt, das die Juden für Jerusalem gesammelt hatten. Im Jahr 60 n. Chr. legte ein Erdbeben die Stadt in Trümmer, und, wie Tacitus anmerkt, erholte sie sich aus eigener Kraft ohne Hilfe Roms."
    - "Epaphras mühte sich um die Gläubigen von Laodizea und Hierapolis, und Paulus grüßte: „Grüßet die Brüder zu Laodizea und den Nymphas und die Gemeinde in seinem Hause“. Er bat die Kolosser, seinen Brief auch in Laodizea lesen zu lassen und „den von Laodizea“ zu lesen, der nicht erhalten ist; was er war, ist umstritten. In der Offenbarung tadelt der letzte der Briefe an die sieben Gemeinden Laodizea, weil es „lau“ sei „und weder kalt noch warm“, stolz, dass es reich ist und nichts bedarf; er rät ihm, im Feuer geläutertes Gold, weiße Kleider und Augensalbe zu kaufen. Viele verbinden das Bild vom lauen Wasser mit der Wasserversorgung der Stadt; andere verstehen es als schlichtes Bild. Der Brief endet: „Siehe, ich stehe vor der Tür und klopfe an“."
    - "Melito von Sardes schrieb, zur Zeit, als Sagaris unter dem Prokonsul Servilius Paulus das Martyrium erlitt, sei in Laodizea ein großer Streit um das Passafest entstanden; Polykrates von Ephesus nennt Sagaris als Bischof und Märtyrer, der in Laodizea ruht. Im 4. Jahrhundert tagte in Laodizea ein Kirchenkonzil, meist um 363 datiert, doch setzen manche es irgendwo zwischen 343 und 381 an. Die Stadt war damals Metropole der Provinz Phrygia Pacatiana."
  fr:
    - "Laodicée se trouvait dans la vallée du Lycos, dans le sud-ouest de la Phrygie, près de l’actuelle Denizli, sur la grande route d’Éphèse vers l’est. Hiérapolis lui faisait face de l’autre côté de la vallée, à environ 10 km au nord, et Colosses se dressait un peu plus haut sur le Lycos. Pline dit que le lieu s’appela d’abord Diospolis, puis Rhoas ; le roi séleucide Antiochos II la refonda au milieu du IIIe siècle av. J.-C. et lui donna le nom de son épouse Laodicé."
    - "Strabon dit que Laodicée, d’abord petite, devint grande de son temps et de celui de ses pères, bien qu’elle eût subi un siège pendant la guerre de Mithridate ; la fertilité de son sol et la richesse de ses citoyens la rendirent opulente, et ses moutons donnaient une laine douce, d’un noir de corbeau. Entre Laodicée et Carura se dressait un temple de Mên Carus avec une école de médecins renommée. Cicéron rapporte qu’en 62 av. J.-C. le gouverneur Flaccus saisit à Laodicée un peu plus de vingt livres d’or recueillies par les Juifs pour Jérusalem. En 60 apr. J.-C., un tremblement de terre réduisit la ville en ruines et, note Tacite, elle se releva par ses propres ressources, sans l’aide de Rome."
    - "Épaphras travailla pour les croyants de Laodicée et de Hiérapolis, et Paul salua « les frères qui sont à Laodicée, et Nymphas, et l’Église qui est dans sa maison ». Il demanda aux Colossiens de faire lire sa lettre à Laodicée et de lire à leur tour « celle qui vous arrivera de Laodicée », épître qui n’a pas survécu ; ce qu’elle était est discuté. Dans l’Apocalypse, la dernière des lettres aux sept Églises reproche à Laodicée d’être « tiède » et de n’être « ni froid ni bouillant », fière d’être riche et de n’avoir besoin de rien, et lui conseille d’acheter de l’or éprouvé par le feu, des vêtements blancs et un collyre. Beaucoup relient l’image de l’eau tiède à l’approvisionnement en eau de la ville ; d’autres y voient une simple figure. La lettre s’achève : « Voici, je me tiens à la porte, et je frappe. »"
    - "Méliton de Sardes écrivit qu’au temps où Sagaris subit le martyre, sous le proconsul Servilius Paulus, une grande dispute sur la Pâque s’éleva à Laodicée ; Polycrate d’Éphèse nomme Sagaris évêque et martyr, qui repose à Laodicée. Au IVe siècle, un concile se réunit à Laodicée, généralement daté d’environ 363, bien que certains le placent n’importe où entre 343 et 381. La ville était alors la métropole de la province de Phrygie Pacatienne."
