body:
  en:
    - "Laodicea lay in the valley of the Lycus in south-western Phrygia, near today's Denizli, on the main road from Ephesus to the east. Hierapolis faced it across the valley about 10 km to the north, and Colossae stood a little farther up the Lycus. Pliny says the place was called first Diospolis and then Rhoas; the Seleucid king Antiochus II refounded it in the mid-third century BC and named it after his wife Laodice."
    - "Strabo says that Laodicea, once small, grew large in his own and his fathers' time, although it had suffered a siege in the war of Mithridates; its fertile land and rich citizens made it wealthy, and its sheep gave soft wool of a raven-black colour. Between Laodicea and Carura stood a temple of Men Carus with a noted school of physicians. Cicero records that in 62 BC the governor Flaccus seized at Laodicea a little over twenty pounds of gold collected by the Jews for Jerusalem. In AD 60 an earthquake laid the city in ruins, and, Tacitus notes, it recovered by its own resources without help from Rome."
    - 'Epaphras laboured for the believers of Laodicea and Hierapolis, and Paul greeted "the brethren which are in Laodicea, and Nymphas, and the church which is in his house". He asked the Colossians to have his letter read in Laodicea and to read "the epistle from Laodicea", which has not survived; what it was is disputed. In Revelation, the last of the letters to the seven churches rebukes Laodicea as "lukewarm, and neither cold nor hot", proud that it is rich and has need of nothing, and counsels it to buy gold tried in the fire, white raiment and eyesalve. Many link the image of lukewarm water to the city''s water supply; others take it as a plain figure. Near its end it says: "Behold, I stand at the door, and knock".'
    - "Melito of Sardis wrote that at the time when Sagaris suffered martyrdom, under the proconsul Servilius Paulus, a great dispute about the Passover arose at Laodicea; Polycrates of Ephesus names Sagaris as a bishop and martyr who rests at Laodicea. In the fourth century a church council met at Laodicea, usually dated about 363, though some place it anywhere between 343 and 381. The city was then the metropolis of the province of Phrygia Pacatiana."
  ru:
    - "Лаодикия лежала в долине Лика на юго-западе Фригии, у нынешнего Денизли, на главной дороге из Ефеса на восток. Иераполь стоял напротив, по другую сторону долины, примерно в 10 км к северу, а Колоссы — немного выше по Лику. Плиний сообщает, что сначала это место называлось Диосполем, а затем Роасом; селевкидский царь Антиох II в середине III века до н. э. основал город заново и назвал его в честь своей жены Лаодики."
    - "Страбон пишет, что Лаодикия, прежде небольшая, выросла при нём и при его отцах, хотя и пострадала от осады во время войны с Митридатом; плодородная земля и богатые граждане сделали её состоятельной, а её овцы давали мягкую шерсть цвета воронова крыла. Между Лаодикией и Карурой стоял храм Мена Кару со знаменитой врачебной школой. Цицерон сообщает, что в 62 г. до н. э. наместник Флакк забрал в Лаодикии немногим более двадцати фунтов золота, собранного иудеями для Иерусалима. В 60 г. н. э. землетрясение разрушило город, и он, как замечает Тацит, оправился своими силами, без помощи Рима."
    - "Епафрас трудился ради верующих Лаодикии и Иераполя, а Павел писал: «Приветствуйте братьев в Лаодикии, и Нимфана, и домашнюю церковь его». Он просил колоссян прочитать его послание в Лаодикии, а то, «которое из Лаодикии», прочитать и им; оно не сохранилось, и что это было, — спорно. В Откровении последнее из посланий семи церквам обличает Лаодикию: «ты тепл, а не горяч и не холоден»; она гордится, что богата и ни в чём не имеет нужды, и ей дан совет купить золото, огнём очищенное, белую одежду и глазную мазь. Многие связывают образ тёплой воды с водоснабжением города; другие видят в нём простое иносказание. Ближе к концу в нём сказано: «Се, стою у двери и стучу»."
    - "Мелитон Сардийский писал, что в то время, когда принял мученичество Сагарис, при проконсуле Сервилии Павле, в Лаодикии возник великий спор о Пасхе; Поликрат Эфесский называет Сагариса епископом и мучеником, который покоится в Лаодикии. В IV веке в Лаодикии собрался церковный собор, который обычно датируют около 363 г., хотя иные относят его к любому году между 343 и 381. Город был тогда митрополией провинции Фригия Пакатиана."
  uk:
    - "Лаодікея лежала в долині Ліка на південному заході Фрігії, поблизу сучасного Денізлі, на головній дорозі з Ефеса на схід. Ієраполіс стояв навпроти неї через долину приблизно за 10 км на північ, а Колоси — трохи вище по Ліку. Пліній каже, що місце спершу звалося Діосполь, а потім Роас; селевкідський цар Антіох II заснував його заново в середині III ст. до н. е. й назвав за своєю дружиною Лаодікою."
    - "Страбон каже, що Лаодікея, колись мала, виросла велика за його життя й за життя його батьків, хоча й зазнала облоги у війні Мітрідата; родюча земля та багаті громадяни зробили її заможною, а її вівці давали м’яку вовну воронового чорного кольору. Між Лаодікеєю та Карурою стояв храм Мена Кароса зі славною школою лікарів. Цицерон записує, що в 62 р. до н. е. намісник Флакк захопив у Лаодікеї трохи більше двадцяти фунтів золота, зібраного євреями для Єрусалима. У 60 р. н. е. землетрус обернув місто на руїни, і, зазначає Тацит, воно відбудувалося власними силами без допомоги з Риму."
    - "Епафрас трудився для віруючих Лаодікеї та Ієраполіса, а Павло привітав: «Витайте братів, що в Лаодикиї, і Нимфана, і домашню церкву його». Він просив колосян подбати, щоб його лист прочитали в Лаодікеї, і самим прочитати «написане з Лаодикиї», що не збереглося; чим воно було, є спірним. В Одкровенні останній із листів до семи церков докоряє Лаодікеї, що вона «лїтний єси, і нї зимний нї гарячий», пишаючись, що багата й нічого не потребує, і радить їй купити золото, випробуване вогнем, білу одіж і мазь для очей. Багато хто пов’язує образ теплої води з водопостачанням міста; інші вважають його простою образною мовою. Ближче до кінця в ньому сказано: «Ось, стою під дверми і стукаю»."
    - "Мелітон Сардійський писав, що під час, коли Сагаріс прийняв мучеництво, за проконсула Сервілія Павла, у Лаодікеї спалахнула велика суперечка про Пасху; Полікрат Ефеський називає Сагаріса єпископом і мучеником, що спочиває в Лаодікеї. У IV ст. у Лаодікеї зібрався церковний собор, його зазвичай датують близько 363 р., хоча дехто відносить його до будь-якого часу між 343 і 381 рр. Місто тоді було метрополією провінції Фрігії Пакатіанської."
  es:
    - "Laodicea se hallaba en el valle del Lico, en el suroeste de Frigia, cerca de la actual Denizli, en el camino principal de Éfeso hacia el este. Hierápolis quedaba enfrente, al otro lado del valle, a unos 10 km al norte, y Colosas se alzaba algo más arriba, junto al Lico. Plinio dice que el lugar se llamó primero Diospolis y luego Rhoas; el rey seléucida Antíoco II la refundó a mediados del siglo III a. C. y le dio el nombre de su esposa Laodice."
    - "Estrabón dice que Laodicea, antes pequeña, creció mucho en su tiempo y en el de sus padres, aunque había sufrido un asedio en la guerra de Mitrídates; su fértil tierra y sus ricos ciudadanos la hicieron próspera, y sus ovejas daban una lana suave de color negro cuervo. Entre Laodicea y Carura se alzaba un templo de Men Caro con una célebre escuela de médicos. Cicerón registra que en 62 a. C. el gobernador Flaco confiscó en Laodicea algo más de veinte libras de oro reunidas por los judíos para Jerusalén. En el año 60 d. C. un terremoto dejó la ciudad en ruinas y, anota Tácito, se recuperó con sus propios recursos, sin ayuda de Roma."
    - "Epafras trabajó por los creyentes de Laodicea y de Hierápolis, y Pablo saludó «á los hermanos que están en Laodicea, y á Nimfas, y á la iglesia que está en su casa». Pidió a los colosenses que hicieran leer su carta en Laodicea y que leyeran «la de Laodicea», es decir, la carta procedente de Laodicea, que no se ha conservado; se discute qué era. En el Apocalipsis, la última de las cartas a las siete iglesias reprende a Laodicea como «tibio, y no frío ni caliente», orgullosa de ser rica y de no tener necesidad de nada, y le aconseja comprar oro probado en el fuego, vestiduras blancas y colirio. Muchos relacionan la imagen del agua tibia con el abastecimiento de agua de la ciudad; otros la toman como una figura sencilla. Cerca del final dice: «He aquí, yo estoy á la puerta y llamo»."
    - "Melitón de Sardis escribió que en el tiempo en que Sagaris sufrió el martirio, bajo el procónsul Servilio Paulo, surgió en Laodicea una gran disputa sobre la Pascua; Polícrates de Éfeso nombra a Sagaris como obispo y mártir que reposa en Laodicea. En el siglo IV se reunió en Laodicea un concilio de la Iglesia, fechado habitualmente hacia 363, aunque algunos lo sitúan en cualquier año entre 343 y 381. La ciudad era entonces la metrópolis de la provincia de Frigia Pacatiana."
  pt:
    - "Laodiceia ficava no vale do Lico, no sudoeste da Frígia, perto da atual Denizli, na estrada principal de Éfeso para o leste. Hierápolis ficava diante dela, do outro lado do vale, a cerca de 10 km ao norte, e Colossos estava um pouco mais acima no Lico. Plínio diz que o lugar se chamou primeiro Diópolis e depois Roas; o rei selêucida Antíoco II a refundou em meados do século III a.C. e deu-lhe o nome de sua mulher, Laódice."
    - "Estrabão diz que Laodiceia, antes pequena, cresceu muito em seu tempo e no de seus pais, embora tivesse sofrido um cerco na guerra de Mitrídates; suas terras férteis e seus cidadãos ricos a enriqueceram, e suas ovelhas davam lã macia de cor negra como a do corvo. Entre Laodiceia e Carura ficava um templo de Mên Caro com uma célebre escola de médicos. Cícero registra que em 62 a.C. o governador Flaco apreendeu em Laodiceia pouco mais de vinte libras de ouro reunidas pelos judeus para Jerusalém. Em 60 d.C. um terremoto reduziu a cidade a ruínas e, nota Tácito, ela se recuperou com os próprios recursos, sem ajuda de Roma."
    - "Epafras trabalhou pelos crentes de Laodiceia e Hierápolis, e Paulo saudou “os irmãos que estão em Laodiceia, bem como Ninfa e a igreja que está em sua casa”. Pediu aos colossenses que mandassem ler sua carta em Laodiceia e que lessem “a carta de Laodiceia”, que não sobreviveu; o que era é disputado. No Apocalipse, a última das cartas às sete igrejas repreende Laodiceia como “morno, e não é quente nem frio”, orgulhosa de ser rica e de nada precisar, e a aconselha a comprar ouro refinado no fogo, vestes brancas e colírio. Muitos ligam a imagem da água morna ao abastecimento de água da cidade; outros a tomam como simples figura. Perto do fim, diz: “Eis que estou à porta e bato”."
    - "Melito de Sardes escreveu que, no tempo em que Sagaris sofreu o martírio, sob o procônsul Sérvilo Paulo, surgiu em Laodiceia uma grande disputa sobre a Páscoa; Polícrates de Éfeso nomeia Sagaris como bispo e mártir que repousa em Laodiceia. No século IV reuniu-se em Laodiceia um concílio da Igreja, geralmente datado de cerca de 363, embora alguns o situem em qualquer ano entre 343 e 381. A cidade era então a metrópole da província da Frígia Pacatiana."
  de:
    - "Laodizea lag im Tal des Lykos im südwestlichen Phrygien, nahe dem heutigen Denizli, an der Hauptstraße von Ephesus nach Osten. Hierapolis lag ihm etwa 10 km nördlich auf der anderen Talseite gegenüber, und Kolossae stand ein Stück weiter oben am Lykos. Plinius sagt, der Ort habe zuerst Diospolis und dann Rhoas geheißen; der seleukidische König Antiochos II. gründete ihn Mitte des 3. Jahrhunderts v. Chr. neu und nannte ihn nach seiner Frau Laodike."
    - "Strabon sagt, Laodizea sei, einst klein, zu seiner und seiner Väter Zeit groß geworden, obwohl es im Krieg des Mithridates eine Belagerung erlitten hatte; sein fruchtbares Land und seine reichen Bürger machten es wohlhabend, und seine Schafe gaben weiche Wolle von rabenschwarzer Farbe. Zwischen Laodizea und Karura stand ein Tempel des Men Karu mit einer berühmten Ärzteschule. Cicero berichtet, der Statthalter Flaccus habe 62 v. Chr. in Laodizea etwas über zwanzig Pfund Gold beschlagnahmt, das die Juden für Jerusalem gesammelt hatten. Im Jahr 60 n. Chr. legte ein Erdbeben die Stadt in Trümmer, und, wie Tacitus anmerkt, erholte sie sich aus eigener Kraft ohne Hilfe Roms."
    - "Epaphras mühte sich um die Gläubigen von Laodizea und Hierapolis, und Paulus grüßte: „Grüßet die Brüder zu Laodizea und den Nymphas und die Gemeinde in seinem Hause“. Er bat die Kolosser, seinen Brief auch in Laodizea lesen zu lassen und „den von Laodizea“ zu lesen, der nicht erhalten ist; was er war, ist umstritten. In der Offenbarung tadelt der letzte der Briefe an die sieben Gemeinden Laodizea, weil es „lau“ sei „und weder kalt noch warm“, stolz, dass es reich ist und nichts bedarf; er rät ihm, im Feuer geläutertes Gold, weiße Kleider und Augensalbe zu kaufen. Viele verbinden das Bild vom lauen Wasser mit der Wasserversorgung der Stadt; andere verstehen es als schlichtes Bild. Gegen Ende heißt es: „Siehe, ich stehe vor der Tür und klopfe an“."
    - "Melito von Sardes schrieb, zur Zeit, als Sagaris unter dem Prokonsul Servilius Paulus das Martyrium erlitt, sei in Laodizea ein großer Streit um das Passafest entstanden; Polykrates von Ephesus nennt Sagaris als Bischof und Märtyrer, der in Laodizea ruht. Im 4. Jahrhundert tagte in Laodizea ein Kirchenkonzil, meist um 363 datiert, doch setzen manche es irgendwo zwischen 343 und 381 an. Die Stadt war damals Metropole der Provinz Phrygia Pacatiana."
  fr:
    - "Laodicée se trouvait dans la vallée du Lycos, dans le sud-ouest de la Phrygie, près de l’actuelle Denizli, sur la grande route d’Éphèse vers l’est. Hiérapolis lui faisait face de l’autre côté de la vallée, à environ 10 km au nord, et Colosses se dressait un peu plus haut sur le Lycos. Pline dit que le lieu s’appela d’abord Diospolis, puis Rhoas ; le roi séleucide Antiochos II la refonda au milieu du IIIe siècle av. J.-C. et lui donna le nom de son épouse Laodicé."
    - "Strabon dit que Laodicée, d’abord petite, devint grande de son temps et de celui de ses pères, bien qu’elle eût subi un siège pendant la guerre de Mithridate ; la fertilité de son sol et la richesse de ses citoyens la rendirent opulente, et ses moutons donnaient une laine douce, d’un noir de corbeau. Entre Laodicée et Carura se dressait un temple de Mên Carus avec une école de médecins renommée. Cicéron rapporte qu’en 62 av. J.-C. le gouverneur Flaccus saisit à Laodicée un peu plus de vingt livres d’or recueillies par les Juifs pour Jérusalem. En 60 apr. J.-C., un tremblement de terre réduisit la ville en ruines et, note Tacite, elle se releva par ses propres ressources, sans l’aide de Rome."
    - "Épaphras travailla pour les croyants de Laodicée et de Hiérapolis, et Paul salua « les frères qui sont à Laodicée, et Nymphas, et l’Église qui est dans sa maison ». Il demanda aux Colossiens de faire lire sa lettre à Laodicée et de lire à leur tour « celle qui vous arrivera de Laodicée », épître qui n’a pas survécu ; ce qu’elle était est discuté. Dans l’Apocalypse, la dernière des lettres aux sept Églises reproche à Laodicée d’être « tiède » et de n’être « ni froid ni bouillant », fière d’être riche et de n’avoir besoin de rien, et lui conseille d’acheter de l’or éprouvé par le feu, des vêtements blancs et un collyre. Beaucoup relient l’image de l’eau tiède à l’approvisionnement en eau de la ville ; d’autres y voient une simple figure. Vers la fin, elle dit : « Voici, je me tiens à la porte, et je frappe. »"
    - "Méliton de Sardes écrivit qu’au temps où Sagaris subit le martyre, sous le proconsul Servilius Paulus, une grande dispute sur la Pâque s’éleva à Laodicée ; Polycrate d’Éphèse nomme Sagaris évêque et martyr, qui repose à Laodicée. Au IVe siècle, un concile se réunit à Laodicée, généralement daté d’environ 363, bien que certains le placent n’importe où entre 343 et 381. La ville était alors la métropole de la province de Phrygie Pacatienne."
  it:
    - "Laodicea sorgeva nella valle del Lico, nella Frigia sud-occidentale, presso l’odierna Denizli, sulla grande strada da Efeso verso oriente. Gerapoli le stava di fronte dall’altra parte della valle, a circa 10 km a nord, e Colosse si trovava un po’ più in alto lungo il Lico. Plinio dice che il luogo si chiamò prima Diospoli e poi Roa; il re seleucide Antioco II la rifondò a metà del III secolo a.C. e le diede il nome della moglie Laodice."
    - "Strabone dice che Laodicea, un tempo piccola, crebbe molto ai suoi tempi e a quelli dei suoi padri, benché avesse subito un assedio nella guerra di Mitridate; la terra fertile e i ricchi cittadini la resero opulenta, e le sue pecore davano una lana morbida di colore nero corvino. Tra Laodicea e Carura sorgeva un tempio di Men Caro con una nota scuola di medici. Cicerone ricorda che nel 62 a.C. il governatore Flacco sequestrò a Laodicea poco più di venti libbre d’oro raccolte dagli ebrei per Gerusalemme. Nel 60 d.C. un terremoto ridusse la città in rovina, e, nota Tacito, essa si risollevò con le proprie forze senza aiuto da Roma."
    - "Epafra si affaticò per i credenti di Laodicea e di Gerapoli, e Paolo salutò «i fratelli che sono in Laodicea, e Ninfa e la chiesa che è in casa sua». Chiese ai Colossesi di far leggere la sua lettera a Laodicea e di leggere «quella che vi sarà mandata da Laodicea», che non è sopravvissuta; che cosa fosse è discusso. Nell’Apocalisse l’ultima delle lettere alle sette chiese rimprovera Laodicea perché «tiepido, e non sei né freddo né fervente», orgogliosa di essere ricca e di non aver bisogno di nulla, e le consiglia di comprare oro affinato col fuoco, vesti bianche e collirio. Molti collegano l’immagine dell’acqua tiepida all’approvvigionamento idrico della città; altri la intendono come una semplice figura. Verso la fine dice: «Ecco, io sto alla porta e picchio»."
    - "Melitone di Sardi scrisse che al tempo in cui Sagari subì il martirio, sotto il proconsole Servilio Paolo, sorse a Laodicea una grande disputa sulla Pasqua; Policrate di Efeso nomina Sagari come vescovo e martire che riposa a Laodicea. Nel IV secolo un concilio si tenne a Laodicea, di solito datato intorno al 363, benché alcuni lo collochino in qualunque anno tra il 343 e il 381. La città era allora la metropoli della provincia di Frigia Pacaziana."
  pl:
    - "Laodycea leżała w dolinie Lykosu w południowo-zachodniej Frygii, w pobliżu dzisiejszego Denizli, przy głównej drodze z Efezu na wschód. Hierapolis leżało naprzeciw niej po drugiej stronie doliny, około 10 km na północ, a Kolosy stały nieco wyżej nad Lykosem. Pliniusz mówi, że miejsce nazywało się najpierw Diospolis, a potem Rhoas; król Seleucydów Antioch II założył je na nowo w połowie III w. p.n.e. i nazwał od swej żony Laodiki."
    - "Strabon mówi, że Laodycea, niegdyś mała, urosła w jego własnych czasach i czasach jego ojców, choć przeszła oblężenie w wojnie z Mitrydatesem; żyzna ziemia i bogaci obywatele uczynili ją zamożną, a jej owce dawały miękką wełnę koloru kruczoczarnego. Między Laodyceą a Karurą stała świątynia Mena Karosa ze słynną szkołą lekarzy. Cyceron zapisuje, że w 62 r. p.n.e. namiestnik Flakkus zajął w Laodycei nieco ponad dwadzieścia funtów złota zebranego przez Żydów dla Jerozolimy. W 60 r. n.e. trzęsienie ziemi obróciło miasto w ruinę, a, jak zauważa Tacyt, podniosło się ono własnymi siłami, bez pomocy Rzymu."
    - "Epafras trudził się dla wierzących w Laodycei i Hierapolis, a Paweł pozdrowił „braci, którzy są w Laodycei, i Nymfasa, i zbór, który jest w domu jego”. Prosił Kolosan, by jego list odczytano w Laodycei, a także by przeczytali ten, „który jest pisany z Laodycei”, a który się nie zachował; czym był, jest sporne. W Apokalipsie ostatni z listów do siedmiu zborów karci Laodyceę: „jesteś letni, a ani zimny ani gorący”, dumną z tego, że jest bogata i niczego nie potrzebuje, i radzi jej kupić złoto w ogniu doświadczone, białe szaty i maść na oczy. Wielu wiąże obraz letniej wody z zaopatrzeniem miasta w wodę; inni biorą go za zwykłą przenośnię. Pod koniec czytamy w nim: „Oto stoję u drzwi i kołaczę”."
    - "Meliton z Sardes pisał, że w czasie, gdy Sagaris poniósł męczeńską śmierć za prokonsula Serwiliusza Paulusa, w Laodycei wybuchł wielki spór o Paschę; Polikrates z Efezu wymienia Sagarisa jako biskupa i męczennika, który spoczywa w Laodycei. W IV w. w Laodycei obradował sobór, zwykle datowany na około 363 r., choć niektórzy umieszczają go gdziekolwiek między 343 a 381 r. Miasto było wtedy metropolią prowincji Frygia Pacatiana."
  nl:
    - "Laodicea lag in de vallei van de Lycus in het zuidwesten van Frygië, bij het huidige Denizli, aan de hoofdweg van Efeze naar het oosten. Hiërapolis lag er ongeveer 10 km naar het noorden tegenover, aan de overkant van de vallei, en Kolosse stond wat verder stroomopwaarts langs de Lycus. Plinius zegt dat de plaats eerst Diospolis en daarna Rhoas heette; de Seleucidische koning Antiochus II stichtte haar in het midden van de derde eeuw v.Chr. opnieuw en noemde haar naar zijn vrouw Laodice."
    - "Strabo zegt dat Laodicea, eens klein, in zijn eigen tijd en die van zijn vaders groot werd, hoewel het in de oorlog van Mithridates een beleg had doorstaan; haar vruchtbare land en rijke burgers maakten haar welvarend, en haar schapen gaven zachte wol van een ravenzwarte kleur. Tussen Laodicea en Carura stond een tempel van Men Carus met een beroemde artsenschool. Cicero vermeldt dat de gouverneur Flaccus in 62 v.Chr. in Laodicea iets meer dan twintig pond goud in beslag nam dat de joden voor Jeruzalem hadden ingezameld. In 60 n.Chr. legde een aardbeving de stad in puin, en, merkt Tacitus op, ze herstelde uit eigen middelen zonder hulp van Rome."
    - "Epafras zette zich in voor de gelovigen van Laodicea en Hiërapolis, en Paulus groette “de broeders, die in Laodicea zijn, en Nymfas, en de Gemeente, die in zijn huis is”. Hij vroeg de Kolossenzen zijn brief in Laodicea te laten lezen en zelf te lezen wat “uit Laodicea geschreven is”, de brief die niet bewaard is gebleven; wat die was, is omstreden. In Openbaring bestraft de laatste van de brieven aan de zeven gemeenten Laodicea: “omdat gij lauw zijt, en noch koud noch heet”, trots dat het rijk is en niets nodig heeft, en raadt het aan goud te kopen dat in het vuur beproefd is, witte klederen en ogenzalf. Velen verbinden het beeld van lauw water met de watervoorziening van de stad; anderen vatten het op als een gewone beeldspraak. Tegen het einde zegt hij: “Zie, Ik sta aan de deur, en Ik klop”."
    - "Melito van Sardes schreef dat in de tijd toen Sagaris het martelaarschap onderging, onder proconsul Servilius Paulus, in Laodicea een groot geschil over het Pascha ontstond; Polycrates van Efeze noemt Sagaris als bisschop en martelaar die in Laodicea rust. In de vierde eeuw kwam in Laodicea een kerkconcilie bijeen, gewoonlijk gedateerd rond 363, al plaatsen sommigen het ergens tussen 343 en 381. De stad was toen de metropool van de provincie Phrygia Pacatiana."
  cs:
    - "Laodikeia ležela v údolí Lykos v jihozápadní Frygii, poblíž dnešního Denizli, při hlavní silnici z Efezu na východ. Hierapolis ležela naproti ní přes údolí asi 10 km na sever a Kolosy stály o něco výše na Lykovi. Plinius praví, že místo se zprvu jmenovalo Diospolis a pak Rhoas; seleukovský král Antiochos II. je v polovině 3. století př. n. l. znovu založil a pojmenoval po své ženě Laodiké."
    - "Strabón praví, že Laodikeia, kdysi malá, vyrostla za jeho života i za života jeho otců, ač zakusila obléhání ve válce s Mithridatem; úrodná půda a bohatí občané ji učinili zámožnou a její ovce dávaly měkkou vlnu havraní černi. Mezi Laodikeií a Karurou stál chrám Mena Karea s proslulou školou lékařů. Cicero zaznamenává, že roku 62 př. n. l. zabavil místodržitel Flaccus v Laodikeii něco přes dvacet liber zlata vybraného Židy pro Jeruzalém. Roku 60 n. l. zemětřesení obrátilo město v trosky a, jak poznamenává Tacitus, vzpamatovalo se z vlastních sil bez pomoci Říma."
    - "Epafras pracoval pro věřící v Laodikeii a Hierapoli a Pavel pozdravil „bratří Laodicenských, i Nymfy, i té církve, kteráž jest v domu jeho“. Požádal Kolosské, aby nechali jeho list přečíst v Laodikeii a sami přečetli ten, „kterýž jest psán z Laodicie“, který se nezachoval; co to bylo, je sporné. V Janově Zjevení poslední z listů sedmi církvím Laodikeiu kárá („vlažný, a ani studený, ani horký“), neboť je pyšná na své bohatství a nic nepotřebuje, a radí jí koupit zlato ohněm zkoušené, bílé roucho a mast na oči. Mnozí spojují obraz vlažné vody se zásobováním města vodou; jiní jej berou jako prostou figuru. Ke konci v něm stojí: „Aj, stojímť u dveří, a tluku“."
    - "Melitón ze Sard napsal, že v době, kdy Sagaris podstoupil mučednictví za prokonzula Servilia Paula, vznikl v Laodikeii velký spor o Paschu; Polykrates z Efezu jmenuje Sagarise jako biskupa a mučedníka, který odpočívá v Laodikeii. Ve 4. století se v Laodikeii sešel církevní koncil, obvykle datovaný kolem roku 363, ač jej někteří kladou kamkoli mezi roky 343 a 381. Město bylo tehdy metropolí provincie Frygie Pacatiana."
  sv:
    - "Laodikeia låg i Lykosdalen i sydvästra Frygien, nära dagens Denizli, vid huvudvägen från Efesos österut. Hierapolis låg mitt emot över dalen omkring 10 km norrut, och Kolossai stod något längre upp längs Lykos. Plinius säger att platsen först kallades Diospolis och sedan Rhoas; den seleukidiske kungen Antiochos II grundade om den vid mitten av 200-talet f.Kr. och uppkallade den efter sin hustru Laodike."
    - "Strabon säger att Laodikeia, som en gång var litet, växte stort på hans egen och hans fäders tid, fastän det hade lidit en belägring i Mithridates' krig; dess bördiga land och rika medborgare gjorde det välbärgat, och dess får gav mjuk ull av korpsvart färg. Mellan Laodikeia och Carura stod ett tempel för Men Carus med en berömd läkarskola. Cicero uppger att guvernören Flaccus år 62 f.Kr. i Laodikeia beslagtog drygt tjugo pund guld som judarna samlat in för Jerusalem. År 60 e.Kr. lade en jordbävning staden i ruiner, och, noterar Tacitus, den reste sig med egna medel utan hjälp från Rom."
    - "Epafras verkade för de troende i Laodikeia och Hierapolis, och Paulus hälsade ”bröderna i Laodicea, så ock Nymfas tillika med den församling som kommer tillhopa i hans hus”. Han bad kolosserna se till att hans brev lästes i Laodikeia och att själva läsa ”det brev, som kommer från Laodicea”, vilket inte har bevarats; vad det var är omstritt. I Uppenbarelseboken tillrättavisar det sista av breven till de sju församlingarna Laodikeia som ”ljum och varken varm eller kall”, stolt över att vara rik och inte behöva något, och råder den att köpa guld luttrat i eld, vita kläder och ögonsalva. Många kopplar bilden av ljumt vatten till stadens vattenförsörjning; andra tar den som en enkel bild. Nära slutet står det: ”Se, jag står för dörren och klappar”."
    - "Melito av Sardes skrev att när Sagaris led martyrdöden, under prokonsuln Servilius Paulus, uppstod en stor tvist om påsken i Laodikeia; Polykrates av Efesos nämner Sagaris som biskop och martyr som vilar i Laodikeia. På 300-talet sammanträdde ett kyrkomöte i Laodikeia, vanligen daterat till omkring 363, fast vissa placerar det någonstans mellan 343 och 381. Staden var då metropol i provinsen Phrygia Pacatiana."
  nb:
    - "Laodikea lå i Lykos-dalen i sørvestlige Frygia, nær dagens Denizli, ved hovedveien fra Efesos mot øst. Hierapolis lå rett over dalen omkring 10 km mot nord, og Kolossai lå et stykke lenger opp langs Lykos. Plinius sier at stedet først ble kalt Diospolis og så Rhoas; den seleukidiske kongen Antiokos II grunnla det på nytt midt på 200-tallet f.Kr. og oppkalte det etter sin hustru Laodike."
    - "Strabon sier at Laodikea, en gang liten, vokste seg stor i hans og hans fedres tid, selv om den hadde lidd under en beleiring i Mithridates' krig; dens fruktbare land og rike borgere gjorde den velstående, og dens sauer ga myk ull i en ravnsvart farge. Mellom Laodikea og Carura sto et tempel for Men Karus med en kjent legeskole. Cicero forteller at landshøvdingen Flaccus i 62 f.Kr. i Laodikea beslagla litt over tjue pund gull som jødene hadde samlet inn til Jerusalem. I 60 e.Kr. la et jordskjelv byen i ruiner, og, bemerker Tacitus, den kom seg på egen hånd uten hjelp fra Roma."
    - "Epafras arbeidet for de troende i Laodikea og Hierapolis, og Paulus hilste «brødrene i Laodikea, og Nymfas og menigheten i hans hus». Han ba kolossenserne la hans brev bli lest i Laodikea og lese «brevet fra Laodikea», som ikke er bevart; hva det var, er omstridt. I Åpenbaringen irettesetter det siste av brevene til de syv menighetene Laodikea som «lunken, og hverken kold eller varm», stolt av at den er rik og ikke fattes noe, og råder den til å kjøpe gull glødet i ild, hvite klær og øyensalve. Mange knytter bildet av lunkent vann til byens vannforsyning; andre tar det som et enkelt bilde. Mot slutten står det: «Se, jeg står for døren og banker»."
    - "Melito av Sardes skrev at det på den tiden da Sagaris led martyrdøden, under prokonsul Servilius Paulus, oppsto en stor strid om påsken i Laodikea; Polykrates av Efesos nevner Sagaris som biskop og martyr som hviler i Laodikea. På 300-tallet møttes et kirkemøte i Laodikea, vanligvis datert til omkring 363, selv om noen plasserer det et sted mellom 343 og 381. Byen var da hovedstad i provinsen Frygia Pacatiana."
  tl:
    - "Ang Laodicea ay nasa libis ng Lycus sa timog-kanlurang Frigia, malapit sa Denizli ngayon, sa pangunahing daan mula Efeso patungong silangan. Nakaharap dito sa kabila ng libis ang Hierapolis mga 10 km sa hilaga, at ang Colosas ay nakatayo nang kaunting mas mataas sa Lycus. Sinasabi ni Plinio na tinawag muna ang lugar na Diospolis at pagkatapos ay Rhoas; muling itinatag ito ng haring Seleucida na si Antioco II noong kalagitnaan ng ika-3 siglo BK at pinangalanan sa kaniyang asawang si Laodice."
    - "Sinasabi ni Estrabon na ang Laodicea, na dating maliit, ay lumaki noong kaniyang panahon at ng kaniyang mga ama, bagaman dumanas ito ng pagkubkob sa digmaan ni Mitridates; yumaman ito sa matabang lupa at mayayamang mamamayan nito, at ang mga tupa nito ay nagbigay ng malambot na lanang kulay-uwak. Sa pagitan ng Laodicea at Carura ay nakatayo ang templo ni Men Carus na may kilalang paaralan ng mga manggagamot. Itinala ni Ciceron na noong 62 BK sinamsam ng gobernador na si Flaccus sa Laodicea ang mahigit dalawampung libra ng ginto na tinipon ng mga Judio para sa Jerusalem. Noong 60 AD, winasak ng lindol ang lungsod, at, ayon kay Tacito, nakabawi ito sa sariling yaman nang walang tulong ng Roma."
    - "Nagpagal si Epafras para sa mga mananampalataya ng Laodicea at Hierapolis, at binati ni Pablo ang “mga kapatid na nangasa Laodicea, at si Nimfas, at ang iglesiang nasa kanilang bahay”. Hiniling niya sa mga taga-Colosas na ipabasa ang kaniyang sulat sa Laodicea at basahin “ang sulat na mula sa Laodicea”, na hindi nakaligtas; pinagtatalunan kung ano iyon. Sa Apocalipsis, ang huli sa mga sulat sa pitong iglesia ay pinagwiwikaan ang Laodicea bilang “malahininga, at hindi mainit o malamig man”, nagmamalaking mayaman at walang kailangan, at pinapayuhan itong bumili ng gintong dinalisay sa apoy, puting damit at pamahid sa mata. Iniuugnay ng marami ang larawan ng maligamgam na tubig sa suplay ng tubig ng lungsod; itinuturing ito ng iba na payak na paghahambing. Sa malapit sa wakas nito ay sinasabi: “Narito ako'y nakatayo sa pintuan at tumutuktok”."
    - "Isinulat ni Melito ng Sardis na nang magdusa ng pagkamartir si Sagaris, sa ilalim ng prokonsul na si Servilius Paulus, ay may malaking pagtatalo tungkol sa Paskua sa Laodicea; pinangangalanan ni Policrates ng Efeso si Sagaris bilang obispo at martir na nagpapahinga sa Laodicea. Noong ika-4 na siglo ay nagtipon ang isang konsilyo ng simbahan sa Laodicea, karaniwang ipinepetsa mga 363, bagaman inilalagay ito ng ilan kahit saan sa pagitan ng 343 at 381. Ang lungsod noon ay ang metropolis ng lalawigan ng Frigia Pacatiana."
  da:
    - "Laodikea lå i Lykos-dalen i det sydvestlige Frygien, nær nutidens Denizli, på hovedvejen fra Efesos mod øst. Hierapolis lå over for den på den anden side af dalen omkring 10 km mod nord, og Kolossæ stod lidt længere oppe ad Lykos. Plinius siger, at stedet først hed Diospolis og siden Rhoas; den seleukidiske konge Antiochos 2. genoprettede det i midten af 200-tallet f.Kr. og opkaldte det efter sin hustru Laodike."
    - "Strabon siger, at Laodikea, der engang var lille, voksede stort i hans egen og hans fædres tid, skønt det havde lidt en belejring i Mithridates' krig; dets frugtbare land og rige borgere gjorde det velhavende, og dets får gav blød uld af en ravnesort farve. Mellem Laodikea og Karura stod et tempel for Men Karos med en berømt lægeskole. Cicero beretter, at guvernøren Flaccus i 62 f.Kr. i Laodikea beslaglagde lidt over tyve pund guld, indsamlet af jøderne til Jerusalem. I 60 e.Kr. lagde et jordskælv byen i ruiner, og, bemærker Tacitus, den kom sig ved egne midler uden hjælp fra Rom."
    - "Epafras arbejdede for de troende i Laodikea og Hierapolis, og Paulus hilste »Brødrene i Laodikea og Nymfas og Menigheden i deres Hus«. Han bad kolossenserne om at lade hans brev læse i Laodikea og selv læse »Brevet fra Laodikea«, som ikke er bevaret; hvad det var, er omstridt. I Åbenbaringen irettesætter det sidste af brevene til de syv menigheder Laodikea som »lunken og hverken varm eller kold«, stolt af, at det er rigt og intet har brug for, og råder det til at købe guld prøvet i ild, hvidt klædebon og øjensalve. Mange knytter billedet af lunkent vand til byens vandforsyning; andre tager det som en almindelig figur. Nær slutningen står der: »Se, jeg staar for Døren og banker«."
    - "Melito af Sardes skrev, at der på det tidspunkt, da Sagaris led martyrdøden under prokonsul Servilius Paulus, opstod en stor strid om påsken i Laodikea; Polykrates af Efesos nævner Sagaris som biskop og martyr, der hviler i Laodikea. I 300-tallet samledes et kirkemøde i Laodikea, sædvanligvis dateret til omkring 363, selv om nogle placerer det et vilkårligt sted mellem 343 og 381. Byen var da hovedstad i provinsen Phrygia Pacatiana."
  sr:
    - "Лаодикија је лежала у долини Лика у југозападној Фригији, близу данашњег Денизлија, на главном путу од Ефеса на исток. Хијераполис јој је био насупрот преко долине, око 10 км северно, а Колосе су стајале нешто даље уз Лик. Плиније каже да се место најпре звало Диосполис, а затим Роас; селеукидски цар Антиох II обновио га је средином III века п. н. е. и назвао по својој жени Лаодики."
    - "Страбон каже да је Лаодикија, некад мала, нарасла за његовог и очева времена, иако је претрпела опсаду у рату с Митридатом; плодна земља и богати грађани учинили су је богатом, а њене овце давале су меку вуну гавранове црне боје. Између Лаодикије и Карура стајао је храм Мена Кароса с чувеном лекарском школом. Цицерон бележи да је 62. п. н. е. намесник Флак у Лаодикији запленио нешто више од двадесет фунти злата које су Јевреји сакупили за Јерусалим. Године 60. н. е. земљотрес је положио град у рушевине, а, како бележи Тацит, он се опоравио сопственим средствима, без помоћи Рима."
    - "Епафрас се трудио за вернике Лаодикије и Хијераполиса, а Павле је поздравио „браћу у Лаодикији, и Нимфана и домаћу цркву његову“. Замолио је Колошане да се његово писмо чита у Лаодикији и да они прочитају „ону што је писана у Лаодикију“, која није сачувана; шта је била, спорно је. У Откривењу последње од писама седам цркава кори Лаодикију: „Тако, будући млак, и ниси ни студен ни врућ“, јер је поносна што је богата и што ништа не потребује, и саветује јој да купи злато жежено у огњу, беле хаљине и масти за очи. Многи слику млаке воде повезују с водоснабдевањем града; други је узимају као обичну слику. Пред крај стоји: „Ево стојим на вратима и куцам“."
    - "Мелитон Сардијски је писао да је у време када је Сагарис пострадао као мученик, за проконзула Сервилија Паула, у Лаодикији настао велики спор о Пасхи; Поликрат Ефески именује Сагариса као епископа и мученика који почива у Лаодикији. У IV веку у Лаодикији је заседао црквени сабор, обично датиран око 363, мада га неки смештају било где између 343. и 381. Град је тада био метропола провинције Фригије Пакатијане."
