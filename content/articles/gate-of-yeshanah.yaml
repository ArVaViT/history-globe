body:
  en:
    - "The Gate of Yeshanah, the “old gate” of the King James Version and the Synodal Russian, was a gate in the north wall of Jerusalem in the time of Nehemiah. In the account of the rebuilding of the wall, which runs round the city from the Sheep Gate, it comes after the Fish Gate: “the old gate repaired Jehoiada the son of Paseah, and Meshullam the son of Besodeiah; they laid the beams thereof, and set up the doors thereof, and the locks thereof, and the bars thereof.” At the dedication of the wall one of the two processions passed “above the gate of Ephraim, and above the old gate, and above the fish gate”, which again sets it on the northern side, west of the Fish Gate."
    - "Little more is known. The Hebrew is unusual, and scholars differ on whether it means “the old gate”, “the gate of the old city”, or, with a small change, “the gate of the Mishneh”, the newer quarter on the western hill where the prophetess Huldah lived. Excavations in the Jewish Quarter, among them the Broad Wall uncovered by Nahman Avigad, show that the north-western hill was walled in the late Judean monarchy, but no gate found so far can be named with certainty, and the map places it only approximately, inside today's Old City."
  ru:
    - "Старые ворота, по-еврейски ворота Иешана, — ворота в северной стене Иерусалима во времена Неемии. В рассказе о восстановлении стены, который обходит город начиная с Овечьих ворот, они идут после Рыбных: «Старые ворота чинили Иоиада, сын Пасеаха, и Мешуллам, сын Бесодии: они покрыли их и вставили двери их, и замки их и засовы их». При освящении стены одно из двух шествий прошло «от ворот Ефремовых, мимо старых ворот и ворот Рыбных», что снова помещает их на северной стороне, к западу от Рыбных ворот."
    - "Больше известно немного. Еврейское выражение необычно, и учёные расходятся в том, значит ли оно «старые ворота», «ворота старого города» или, с малой поправкой, «ворота Мишне», нового квартала на западном холме, где жила пророчица Олдама. Раскопки в Еврейском квартале, в том числе Широкая стена, открытая Нахманом Авигадом, показывают, что северо-западный холм был обнесён стеной в конце Иудейского царства, но ни одни найденные ворота нельзя уверенно так назвать, и карта помещает их лишь приблизительно, в пределах нынешнего Старого города."
  uk:
    - "Старі ворота (Шеар-га-Єшана), «старі ворота» англійського перекладу короля Якова та російського Синодального перекладу, були воротами в північному мурі Єрусалима за часів Неемії. В оповіді про відбудову муру, що обходить місто від Овечих воріт, вони йдуть після Рибних воріт: «Старі ворота лагодили Йояда, син Пасеахів, і Мешуллам, син Бесодії: вони вкрили їх і вставили двері їх і замки їх, і засуви їх». Під час освячення муру одна з двох процесій проходила «від Ефраїмових воріт, попри старі ворота й ворота Рибні», що знову ставить їх на північному боці, на захід від Рибних воріт."
    - "Більше майже нічого не відомо. Давньоєврейська назва незвичайна, і дослідники розходяться в тому, чи означає вона «старі ворота», «ворота старого міста» або, з невеликою зміною, «ворота Мішне» — новішої дільниці на західному пагорбі, де жила пророчиця Хулда. Розкопки в Єврейському кварталі, зокрема Широка стіна, відкрита Нахманом Авігадом, показують, що північно-західний пагорб був обведений муром наприкінці юдейської монархії, але жодних знайдених досі воріт не можна назвати з певністю, і на карті їх позначено лише приблизно, у межах сучасного Старого міста."
  es:
    - "La puerta Vieja (Yeshanah), la «puerta vieja» de la versión del rey Jacobo (King James) y de la Biblia sinodal rusa, era una puerta del muro norte de Jerusalén en tiempos de Nehemías. En el relato de la reconstrucción del muro, que rodea la ciudad a partir de la puerta de las Ovejas, viene después de la puerta del Pescado: «la puerta Vieja restauraron Joiada hijo de Pasea, y Mesullam hijo de Besodías: ellos la enmaderaron, y levantaron sus puertas, con sus cerraduras y sus cerrojos». En la dedicación del muro, una de las dos procesiones pasó «desde la puerta de Ephraim hasta la puerta vieja, y á la puerta del Pescado», lo que de nuevo la sitúa en el lado norte, al oeste de la puerta del Pescado."
    - "Poco más se sabe. El hebreo es inusual, y los especialistas discrepan sobre si significa «la puerta vieja», «la puerta de la ciudad vieja» o, con un pequeño cambio, «la puerta del Mishné», el barrio más nuevo de la colina occidental donde vivía la profetisa Hulda. Las excavaciones del Barrio Judío, entre ellas el Muro Ancho descubierto por Nahman Avigad, muestran que la colina noroccidental estuvo amurallada a fines de la monarquía de Judá, pero ninguna puerta hallada hasta hoy puede identificarse con certeza, y el mapa la sitúa solo de manera aproximada, dentro de la actual Ciudad Vieja."
  pt:
    - "A Porta de Yeshanah, a “porta velha” da Versão King James e da Bíblia Sinodal russa, era uma porta na muralha norte de Jerusalém no tempo de Neemias. No relato da reconstrução da muralha, que contorna a cidade a partir da Porta das Ovelhas, ela vem depois da Porta do Peixe: “Joiada, filho de Paseia, e Mesulão, filho de Besodias, repararam a Porta Velha. Eles colocaram as suas vigas e assentaram as suas portas, os seus ferrolhos e as suas trancas”. Na dedicação da muralha, uma das duas procissões passou “por cima da Porta de Efraim, e pela Porta Velha, e pela Porta dos Peixes”, o que de novo a situa no lado norte, a oeste da Porta do Peixe."
    - "Pouco mais se sabe. O hebraico é incomum, e os estudiosos divergem sobre se significa “a porta velha”, “a porta da cidade velha” ou, com uma pequena alteração, “a porta do Misné”, o bairro mais novo na colina ocidental onde vivia a profetisa Hulda. As escavações no Bairro Judeu, entre elas o Muro Largo trazido à luz por Nahman Avigad, mostram que a colina noroeste foi cercada de muralhas no fim da monarquia de Judá, mas nenhuma porta encontrada até hoje pode ser identificada com certeza, e o mapa a coloca só de forma aproximada, dentro da Cidade Velha atual."
  de:
    - "Das Tor von Jeschana, das „alte Tor“ der King-James-Bibel und der russischen Synodalübersetzung, war zur Zeit Nehemias ein Tor in der Nordmauer Jerusalems. Im Bericht über den Wiederaufbau der Mauer, der vom Schaftor aus rings um die Stadt führt, steht es nach dem Fischtor: „Das alte Tor baute Jojada, der Sohn Paseahs, und Mesullam, der Sohn Besodjas; sie deckten es und setzten ein seine Türen und Schlösser und Riegel.“ Bei der Einweihung der Mauer zog einer der beiden Festzüge „zum Tor Ephraim hinan und zum alten Tor und zum Fischtor“, was es wiederum auf der Nordseite, westlich des Fischtors, verortet."
    - "Mehr ist kaum bekannt. Das Hebräische ist ungewöhnlich, und die Forschung ist uneins, ob es „das alte Tor“, „das Tor der Altstadt“ oder, bei einer kleinen Änderung, „das Tor der Mischne“ bedeutet, des neueren Stadtviertels auf dem Westhügel, in dem die Prophetin Hulda wohnte. Grabungen im Jüdischen Viertel, darunter die von Nahman Avigad freigelegte Breite Mauer, zeigen, dass der nordwestliche Hügel in der späten judäischen Königszeit ummauert war; doch kein bisher gefundenes Tor lässt sich sicher benennen, und die Karte setzt es nur ungefähr in die heutige Altstadt."
  fr:
    - "La Porte Vieille (Yeshanah), appelée « vieille porte » dans la version King James et dans la Bible synodale russe, était une porte du mur nord de Jérusalem au temps de Néhémie. Dans le récit de la reconstruction du mur, qui fait le tour de la ville à partir de la porte des Brebis, elle vient après la porte des Poissons : « Jojada, fils de Paséach, et Meschullam, fils de Besodia, réparèrent la vieille porte. Ils la couvrirent, et en posèrent les battants, les verrous et les barres. » Lors de la dédicace du mur, l’un des deux cortèges passa « au-dessus de la porte d’Éphraïm, de la vieille porte, de la porte des poissons », ce qui la situe de nouveau du côté nord, à l’ouest de la porte des Poissons."
    - "On n’en sait guère plus. L’hébreu est inhabituel, et les spécialistes divergent : il pourrait signifier « la vieille porte », « la porte de la vieille ville » ou, moyennant une légère modification, « la porte du Michné », le quartier plus récent de la colline occidentale où vivait la prophétesse Hulda. Les fouilles du quartier juif, dont la Muraille large mise au jour par Nahman Avigad, montrent que la colline nord-ouest était fortifiée à la fin de la monarchie judéenne, mais aucune porte découverte jusqu’ici ne peut être nommée avec certitude, et la carte ne la place qu’approximativement, à l’intérieur de la Vieille Ville actuelle."
  pl:
    - "Brama Jeszana, „stara brama” w Biblii Króla Jakuba i w synodalnej Biblii rosyjskiej, była bramą w północnym murze Jerozolimy za czasów Nehemiasza. W opisie odbudowy muru, który obiega miasto od Bramy Owczej, występuje po Bramie Rybnej: „A bramę starą poprawiali Jojada, syn Faseachowy, i Mesullam, syn Besodyjaszowy; ci ją przykryli, i przyprawili wrota do niej, i zamki jej, i zawory jej”. Przy poświęceniu muru jeden z dwóch pochodów szedł „od bramy Efraim ku bramie starej, i ku bramie rybnej”, co znów umieszcza ją po stronie północnej, na zachód od Bramy Rybnej."
    - "Niewiele więcej wiadomo. Hebrajskie wyrażenie jest niezwykłe, a uczeni spierają się, czy oznacza „starą bramę”, „bramę starego miasta”, czy też, po niewielkiej zmianie, „bramę Miszne”, nowszej dzielnicy na zachodnim wzgórzu, w której mieszkała prorokini Chulda. Wykopaliska w Dzielnicy Żydowskiej, w tym Szeroki Mur odsłonięty przez Nahmana Avigada, wykazują, że północno-zachodnie wzgórze otoczono murem pod koniec monarchii judzkiej, lecz żadnej z dotąd odkrytych bram nie można z pewnością przypisać Bramie Jeszana, więc mapa umieszcza ją tylko w przybliżeniu, wewnątrz dzisiejszego Starego Miasta."
  it:
    - "La Porta di Yeshanah, la «porta vecchia» della King James Version e della Bibbia sinodale russa, era una porta nel muro settentrionale di Gerusalemme al tempo di Neemia. Nel racconto della ricostruzione delle mura, che corre attorno alla città a partire dalla Porta delle Pecore, viene dopo la Porta dei Pesci: «Joiada, figliuolo di Paseah, e Meshullam, figliuolo di Besodeia, restaurarono la porta Vecchia; ne fecero l’intelaiatura, e vi posero le imposte, le serrature e le sbarre». Alla dedicazione delle mura una delle due processioni passò «al disopra della porta d’Efraim, della porta Vecchia, della porta dei Pesci», il che la colloca di nuovo sul lato nord, a ovest della Porta dei Pesci."
    - "Non si sa molto di più. L’ebraico è insolito, e gli studiosi divergono sul fatto che significhi «la porta vecchia», «la porta della città vecchia» oppure, con una piccola modifica, «la porta del Mishneh», il quartiere più recente sul colle occidentale dove abitava la profetessa Culda. Gli scavi nel Quartiere ebraico, fra cui il Muro Largo portato alla luce da Nahman Avigad, mostrano che il colle nord-occidentale era cinto di mura alla fine della monarchia di Giuda, ma nessuna porta finora trovata può essere identificata con certezza, e la mappa la colloca solo in modo approssimativo, all’interno dell’attuale Città Vecchia."
  nl:
    - "De Jesjanapoort, de “oude poort” van de King James Version en van de Russische Synodale vertaling, was in de tijd van Nehemia een poort in de noordmuur van Jeruzalem. In het verslag van de herbouw van de muur, dat vanaf de Schaapspoort rond de stad loopt, komt zij na de Vispoort: “En de Oude poort verbeterden Jojada, de zoon van Paseah, en Mesullam, de zoon van Besodja; deze zolderden zij, en richtten haar deuren op, met haar sloten en haar grendelen.” Bij de inwijding van de muur trok een van de twee optochten “van boven de poort van Efraim, en boven de Oude poort, en boven de Vispoort”, wat haar opnieuw aan de noordkant plaatst, ten westen van de Vispoort."
    - "Veel meer is niet bekend. Het Hebreeuws is ongewoon, en geleerden verschillen van mening of het “de oude poort”, “de poort van de oude stad” of, met een kleine wijziging, “de poort van de Misneh” betekent, de nieuwere wijk op de westelijke heuvel waar de profetes Chulda woonde. Opgravingen in de Joodse wijk, onder meer de Brede Muur die Nahman Avigad blootlegde, tonen aan dat de noordwestelijke heuvel in de late Judese monarchie ommuurd was, maar geen enkele tot nu toe gevonden poort kan met zekerheid zo worden genoemd, en de kaart plaatst haar slechts bij benadering, binnen de huidige Oude Stad."
  cs:
    - "Stará brána, hebrejsky brána Ješana, „stará brána“ Bible krále Jakuba a ruské synodální Bible, byla branou v severní hradbě Jeruzaléma v době Nehemjáše. Ve vyprávění o obnově hradby, které obchází město od Ovčí brány, následuje po Rybí bráně: „Bránu pak starou opravovali Joiada syn Paseachův, a Mesullam syn Besodiášův. Ti položili trámy její a vstavili vrata její s zámky a závorami jejími.“ Při vysvěcení hradby šel jeden ze dvou průvodů „od brány Efraim k bráně staré, a k bráně rybné“, což ji opět klade na severní stranu, západně od Rybí brány."
    - "Víc se neví. Hebrejština je neobvyklá a učenci se rozcházejí, zda to znamená „stará brána“, „brána starého města“, nebo, s malou změnou, „brána Mišne“, novější čtvrti na západním pahorku, kde bydlela prorokyně Chuldá. Vykopávky v Židovské čtvrti, mezi nimi Široká hradba odkrytá Nahmanem Avigadem, ukazují, že severozápadní pahorek byl na sklonku judské monarchie opevněn, ale žádnou dosud nalezenou bránu nelze s jistotou pojmenovat a mapa ji klade jen přibližně, dovnitř dnešního Starého Města."
  sv:
    - "Gamla porten, på hebreiska Jeshana, ”den gamla porten” i King James-bibeln och i den ryska synodalbibeln, var en port i Jerusalems norra mur på Nehemjas tid. I berättelsen om murens återuppbyggnad, som löper runt staden från Fårporten, kommer den efter Fiskporten: ”Gamla porten sattes i stånd av Jojada, Paseas son, och Mesullam, Besodjas son; de timrade upp den och satte in dess dörrar, dess riglar och bommar.” Vid murens invigning gick ett av de två tågen ”över Efraimsporten, Gamla porten och Fiskporten”, vilket åter placerar den på norra sidan, väster om Fiskporten."
    - "Mer är inte känt. Det hebreiska ordet är ovanligt, och forskarna är oeniga om det betyder ”den gamla porten”, ”den gamla stadens port” eller, med en liten ändring, ”Mishnes port”, den yngre stadsdelen på västra kullen där profetissan Hulda bodde. Utgrävningar i Judiska kvarteret, bland dem Breda muren som Nahman Avigad frilade, visar att nordvästra kullen var ringmurad under den sena judeiska monarkin, men ingen hittills funnen port kan med säkerhet namnges, och kartan placerar den bara ungefärligt, inom dagens Gamla stad."
  nb:
    - "Jesjana-porten, «den gamle port» i King James-oversettelsen og i den russiske synodalbibelen, var en port i Jerusalems nordmur på Nehemjas tid. I beretningen om gjenoppbyggingen av muren, som går rundt byen fra Saueporten, kommer den etter Fiskeporten: «Den gamle port blev satt i stand av Jojada, Paseahs sønn, og Mesullam, Besodjas sønn; de tømret den op og satte inn dører og låser og slåer.» Ved innvielsen av muren gikk det ene av de to togene «over Efra'im-porten, den gamle port og Fiskeporten», noe som igjen setter den på nordsiden, vest for Fiskeporten."
    - "Mer er det lite kjent. Det hebraiske uttrykket er uvanlig, og forskerne er uenige om det betyr «den gamle porten», «porten til den gamle byen» eller, med en liten endring, «porten til Mishne», den nyere bydelen på vestkullen der profetinnen Hulda bodde. Utgravninger i Jødekvarteret, blant dem Bredmuren som Nahman Avigad avdekket, viser at den nordvestlige høyden var innelukket av murer sent i det judeiske kongedømmet, men ingen port som er funnet hittil, kan navngis med sikkerhet, og kartet plasserer den bare omtrentlig, innenfor dagens gamleby."
  tl:
    - "Ang Pintuang-bayan ng Jesana, ang “old gate” ng King James Version at ng Synodal na Ruso, ay isang pintuan sa hilagang pader ng Jerusalem noong panahon ni Nehemias. Sa salaysay ng muling pagtatayo ng pader, na umiikot sa lungsod mula sa Pintuang-bayan ng mga Tupa, sumusunod ito sa Pintuang-bayan ng mga Isda: “ang dating pintuang-bayan ay hinusay ni Joiada na anak ni Pasea at ni Mesullam na anak ni Besodias; kanilang inilapat ang mga tahilan niyaon, at inilagay ang mga pinto niyaon, at ang mga trangka niyaon, at ang mga halang niyaon.” Sa pagtatalaga ng pader ay nagdaan ang isa sa dalawang prusisyon “sa ibabaw ng pintuang-bayan ng Ephraim, at sa matandang pintuang-bayan at sa pintuang-bayan ng mga isda”, na muling inilalagay ito sa hilagang panig, sa kanluran ng Pintuang-bayan ng mga Isda."
    - "Wala nang higit na nalalaman. Hindi pangkaraniwan ang Hebreo, at hindi magkasundo ang mga iskolar kung nangangahulugan ba ito ng “lumang pintuan”, “pintuan ng lumang lungsod”, o, sa isang maliit na pagbabago, “pintuan ng Mishneh”, ang mas bagong purok sa kanlurang burol kung saan nanirahan ang propetisang si Hulda. Ipinakikita ng mga paghuhukay sa Kwarter ng mga Judio, kabilang ang Malapad na Kuta na nahukay ni Nahman Avigad, na may pader ang hilagang-kanlurang burol sa huling bahagi ng monarkiyang Judeano, ngunit walang pintuang natagpuan hanggang ngayon na maaaring pangalanan nang tiyak, at inilalagay lamang ito ng mapa nang tinatayang, sa loob ng Lumang Lungsod ngayon."
  da:
    - "Den Gamle Port, hebraisk Jesjana, den »gamle port« i King James-oversættelsen og den russiske synodalbibel, var en port i Jerusalems nordmur på Nehemias' tid. I beretningen om genopbygningen af muren, som løber rundt om byen fra Fåreporten, kommer den efter Fiskeporten: »Og den gamle Port istandsatte Jojada, Paseas Søn, og Mesullam, Besodias Søn; de tømrede den og indsatte dens Døre med dens Laase og dens Stænger.« Ved murens indvielse gik et af de to optog »over Efraims Port og over den gamle Port og over Fiskeporten«, hvilket igen placerer den på nordsiden, vest for Fiskeporten."
    - "Mere vides ikke. Det hebraiske ord er usædvanligt, og forskerne er uenige om, hvorvidt det betyder »den gamle port«, »den gamle bys port« eller, med en lille ændring, »Mishnes port«, den nyere bydel på vesthøjen, hvor profetinden Hulda boede. Udgravninger i Det Jødiske Kvarter, deriblandt Den Brede Mur, som Nahman Avigad afdækkede, viser, at den nordvestlige høj var omgivet af mur i den sene judæiske kongetid, men ingen hidtil fundet port kan med sikkerhed navngives, og kortet placerer den kun omtrentligt, inden for nutidens gamle by."
  sr:
    - "Капија Јесане, „стара врата“ превода краља Џејмса и руског синодског превода, била је капија у северном зиду Јерусалима у Немијино доба. У приповести о обнови зида, која иде око града од Овчје капије, долази после Рибље капије: „стара врата поправља Јодај, син Фасејин и Месулам, син Весодијин, они их побрвнаше и метнуше крила и браве и преворнице.“ На освећењу зида једна од две поворке прошла је „изнад врата Јефремових к вратима старим и ка вратима рибљим“, што је поново смешта на северну страну, западно од Рибље капије."
    - "Више се не зна. Хебрејски израз је необичан, а научници се разилазе да ли значи „стара капија“, „капија старог града“ или, уз малу промену, „капија Мишнеа“, новијег краја на западном брду где је живела пророчица Олда. Ископавања у Јеврејској четврти, међу њима Широки зид који је открио Нахман Авигад, показују да је северозападно брдо било опасано зидом у позно доба јудејске монархије, али ни једна досад пронађена капија не може се именовати са сигурношћу, а карта је смешта само приближно, унутар данашњег Старог града."
scripture:
