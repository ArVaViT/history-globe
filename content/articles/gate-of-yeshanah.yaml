# Overview article (ADR 0007). Mainstream facts only; the meaning of the name and the gate's exact place on the north wall are given as debated.
id: gate-of-yeshanah
place: a2fa712
title:
  en: "Gate of Yeshanah"
  ru: "Старые ворота"
body:
  en:
    - "The Gate of Yeshanah, the “old gate” of the King James Version and the Synodal Russian, was a gate in the north wall of Jerusalem in the time of Nehemiah. In the account of the rebuilding of the wall, which runs round the city from the Sheep Gate, it comes after the Fish Gate: “the old gate repaired Jehoiada the son of Paseah, and Meshullam the son of Besodeiah; they laid the beams thereof, and set up the doors thereof, and the locks thereof, and the bars thereof.” At the dedication of the wall one of the two processions passed “above the gate of Ephraim, and above the old gate, and above the fish gate”, which again sets it on the northern side, west of the Fish Gate."
    - "Little more is known. The Hebrew is unusual, and scholars differ on whether it means “the old gate”, “the gate of the old city”, or, with a small change, “the gate of the Mishneh”, the newer quarter on the western hill where the prophetess Huldah lived. Excavations in the Jewish Quarter, among them the Broad Wall uncovered by Nahman Avigad, show that the north-western hill was walled in the late Judean monarchy, but no gate found so far can be named with certainty, and the map places it only approximately, inside today's Old City."
  ru:
    - "Старые ворота, по-еврейски ворота Иешана, — ворота в северной стене Иерусалима во времена Неемии. В рассказе о восстановлении стены, который обходит город начиная с Овечьих ворот, они идут после Рыбных: «Старые ворота чинили Иоиада, сын Пасеаха, и Мешуллам, сын Бесодии: они покрыли их и вставили двери их, и замки их и засовы их». При освящении стены одно из двух шествий прошло «от ворот Ефремовых, мимо старых ворот и ворот Рыбных», что снова помещает их на северной стороне, к западу от Рыбных ворот."
    - "Больше известно немного. Еврейское выражение необычно, и учёные расходятся в том, значит ли оно «старые ворота», «ворота старого города» или, с малой поправкой, «ворота Мишне», нового квартала на западном холме, где жила пророчица Олдама. Раскопки в Еврейском квартале, в том числе Широкая стена, открытая Нахманом Авигадом, показывают, что северо-западный холм был обнесён стеной в конце Иудейского царства, но ни одни найденные ворота нельзя уверенно так назвать, и карта помещает их лишь приблизительно, в пределах нынешнего Старого города."
