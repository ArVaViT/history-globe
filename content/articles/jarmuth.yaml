body:
  en:
    - "Jarmuth was a Canaanite city in the Shephelah whose king, Piram, joined the four others under Adoni-zedek of Jerusalem against Gibeon, was defeated by Joshua, hid with them in the cave at Makkedah and was hanged with them; “The king of Jarmuth, one” stands in the list of the thirty-one. The town fell to Judah, in the Shephelah with Adullam, Socoh and Azekah, and after the exile Judahites again lived “at En-rimmon, and at Zareah, and at Jarmuth”."
    - "The site is Tel Yarmuth (Khirbet el-Yarmuk), 25 km south-west of Jerusalem near Beit Shemesh, and the name has hardly changed since Eusebius, who knew it as the village Iermochos, ten miles from Eleutheropolis on the way to Jerusalem. Excavations by Pierre de Miroschedji from 1980 to 2009 showed that the great period of Jarmuth was long before Joshua: in the Early Bronze Age, in the third millennium BC, it was one of the largest cities of Canaan, 16 hectares within ramparts up to 40 m thick, with a palace of some 6,000 square metres, and was abandoned about 2300 BC. The Late Bronze and Iron Age town that the Bible knows occupied only the small acropolis at the top of the mound."
    - "Today the tell is a national park on the edge of Ramat Beit Shemesh, its Early Bronze Age walls and palace partly restored; the biblical Jarmuth is a thin layer on its summit."
  ru:
    - "Иармуф был ханаанским городом в Шефеле, чей царь Фирам вместе с четырьмя другими под началом Адониседека Иерусалимского выступил против Гаваона, был разбит Иисусом Навином, скрылся с ними в пещере в Македе и был повешен с ними; «один царь Иармуфа» стоит в списке тридцати одного. Город достался Иуде, в Шефеле вместе с Одолламом, Сохо и Азекой, а после плена Иудеи снова жили «в Ен-Риммоне, в Цоре и в Иармуфе»."
    - "Это Тель-Ярмут (Хирбет-эль-Ярмук) в 25 км к юго-западу от Иерусалима близ Бейт-Шемеша, и имя почти не изменилось со времён Евсевия, знавшего его как селение Иермохос в десяти милях от Элевтерополя по дороге в Иерусалим. Раскопки Пьера де Мирошеджи с 1980 по 2009 год показали, что великое время Иармуфа было задолго до Иисуса Навина: в раннем бронзовом веке, в III тысячелетии до н. э., это был один из крупнейших городов Ханаана, 16 гектаров внутри валов толщиной до 40 м, с дворцом около 6000 квадратных метров, и около 2300 г. до н. э. он был покинут. Город позднего бронзового и железного века, который знает Библия, занимал только маленький акрополь на вершине холма."
    - "Сегодня холм — национальный парк на краю Рамат-Бейт-Шемеша, стены и дворец раннего бронзового века частично восстановлены; библейский Иармуф — тонкий слой на его вершине."
  uk:
    - "Ярмут було ханаанським містом у Шефелі, чий цар Фірам разом з чотирма іншими під проводом Адоніседека Єрусалимського виступив проти Гаваона, був розбитий Ісусом Навином, сховався з ними в печері Македи і був повішений з ними; «Цар Ярмутський, один» стоїть у переліку тридцяти одного. Місто дісталося Юді, в Шефелі разом з Одоламом, Сохо й Азекою, а після вигнання юдеї знову жили «В Ен-Риммонї, в Зорі й в Ярмутї»."
    - "Місце — Тель-Ярмут (Хірбет-ель-Ярмук), за 25 км на південний захід від Єрусалима поблизу Бейт-Шемеша, і назва ледве змінилася від часів Євсевія, який знав її як село Ієрмох за десять миль від Елевферополя на шляху до Єрусалима. Розкопки П’єра де Мірошеджі від 1980 до 2009 року показали, що великий період Ярмута був задовго до Ісуса Навина: у ранньому бронзовому віці, в III тисячолітті до н. е., він був одним із найбільших міст Ханаану, 16 гектарів у межах валів завтовшки до 40 м, з палацом близько 6000 квадратних метрів, і був покинутий близько 2300 р. до н. е. Місто пізнього бронзового й залізного віків, яке знає Біблія, займало лише малий акрополь на вершині городища."
    - "Сьогодні тель — національний парк на краю Рамат-Бейт-Шемеша, його мури й палац раннього бронзового віку частково відновлені; біблійний Ярмут — тонкий шар на його вершині."
  es:
    - "Jarmut era una ciudad cananea de la Sefelá cuyo rey, Piram, se unió a los otros cuatro bajo Adonisedec de Jerusalén contra Gabaón, fue derrotado por Josué, se ocultó con ellos en la cueva de Maceda y fue colgado con ellos; «El rey de Jarmuth, otro» figura en la lista de los treinta y un reyes. La población cayó en poder de Judá, en la Sefelá con Adulam, Soco y Azeca, y tras el destierro los judaítas vivieron de nuevo «en En-rimmón, y en Soreah y en Jarmuth»."
    - "El sitio es Tel Yarmuth (Khirbet el-Yarmuk), a 25 km al suroeste de Jerusalén, cerca de Bet Semes, y el nombre apenas ha cambiado desde Eusebio, que la conocía como la aldea Iermochos, a diez millas de Eleuterópolis camino de Jerusalén. Las excavaciones de Pierre de Miroschedji de 1980 a 2009 mostraron que el gran período de Jarmut fue muy anterior a Josué: en la Edad del Bronce Antiguo, en el tercer milenio a. C., fue una de las mayores ciudades de Canaán, de 16 hectáreas dentro de murallas de hasta 40 m de grosor, con un palacio de unos 6000 metros cuadrados, y fue abandonada hacia el 2300 a. C. La población del Bronce Final y de la Edad del Hierro que conoce la Biblia ocupaba solo la pequeña acrópolis en lo alto del montículo."
    - "Hoy el tell es un parque nacional en el borde de Ramat Bet Semes, con sus murallas y su palacio del Bronce Antiguo parcialmente restaurados; la Jarmut bíblica es una delgada capa en su cima."
  pt:
    - "Jarmute era uma cidade cananeia na Sefelá cujo rei, Pirão, juntou-se aos outros quatro sob Adoni-Zedeque de Jerusalém contra Gibeão, foi derrotado por Josué, escondeu-se com eles na caverna de Maquedá e foi enforcado com eles; “o rei de Jarmute, um” consta da lista dos trinta e um. A cidade coube a Judá, na Sefelá, com Adulão, Socó e Azeca, e depois do exílio judaítas viveram de novo “em En-Rimom, em Zorá, em Jarmute”."
    - "O sítio é Tel Yarmuth (Khirbet el-Yarmuk), a 25 km a sudoeste de Jerusalém, perto de Beit Shemesh, e o nome mal mudou desde Eusébio, que a conheceu como a aldeia Iermochos, a dez milhas de Eleutéropolis no caminho para Jerusalém. As escavações de Pierre de Miroschedji, de 1980 a 2009, mostraram que o grande período de Jarmute foi muito antes de Josué: na Idade do Bronze Antigo, no terceiro milênio a.C., foi uma das maiores cidades de Canaã, com 16 hectares dentro de baluartes de até 40 m de espessura, com um palácio de cerca de 6.000 metros quadrados, e foi abandonada por volta de 2300 a.C. A cidade do Bronze Tardio e da Idade do Ferro que a Bíblia conhece ocupava apenas a pequena acrópole no alto do monte."
    - "Hoje o tell é um parque nacional na orla de Ramat Beit Shemesh, com suas muralhas e seu palácio do Bronze Antigo parcialmente restaurados; a Jarmute bíblica é uma fina camada em seu cume."
  de:
    - "Jarmut war eine kanaanitische Stadt in der Schefela, deren König Piram sich den vier anderen unter Adoni-Zedek von Jerusalem gegen Gibeon anschloss, von Josua besiegt wurde, sich mit ihnen in der Höhle bei Makkeda verbarg und mit ihnen gehängt wurde; „der König zu Jarmuth“ steht in der Liste der einunddreißig. Die Stadt fiel an Juda, in der Schefela mit Adullam, Socho und Aseka, und nach dem Exil wohnten Judäer wieder „zu En-Rimmon, Zora, Jarmuth“."
    - "Die Stätte ist Tel Jarmut (Chirbet el-Jarmuk), 25 km südwestlich von Jerusalem bei Bet Schemesch, und der Name hat sich seit Eusebius kaum verändert, der es als Dorf Iermochos zehn Meilen von Eleutheropolis an der Straße nach Jerusalem kannte. Grabungen von Pierre de Miroschedji von 1980 bis 2009 zeigten, dass die große Zeit Jarmuts lange vor Josua lag: In der Frühbronzezeit, im 3. Jahrtausend v. Chr., war es eine der größten Städte Kanaans, 16 Hektar innerhalb von bis zu 40 m dicken Wällen, mit einem Palast von etwa 6000 Quadratmetern, und wurde um 2300 v. Chr. verlassen. Die spätbronze- und eisenzeitliche Stadt, die die Bibel kennt, besetzte nur die kleine Akropolis oben auf dem Hügel."
    - "Heute ist der Tell ein Nationalpark am Rand von Ramat Bet Schemesch, seine frühbronzezeitlichen Mauern und der Palast teilweise restauriert; das biblische Jarmut ist eine dünne Schicht auf seinem Gipfel."
  fr:
    - "Jarmuth était une ville cananéenne de la Shéphéla dont le roi, Piream, se joignit aux quatre autres sous Adoni-Tsédek de Jérusalem contre Gabaon, fut vaincu par Josué, se cacha avec eux dans la caverne de Makkéda et fut pendu avec eux ; « le roi de Jarmuth, un » figure dans la liste des trente et un. La ville tomba à Juda, dans la Shéphéla avec Adullam, Soco et Azéka, et après l’exil des Judéens habitèrent de nouveau « à En-Rimmon, à Tsorea, à Jarmuth »."
    - "Le site est Tel Yarmuth (Khirbet el-Yarmuk), à 25 km au sud-ouest de Jérusalem près de Beit Shemesh, et le nom a à peine changé depuis Eusèbe, qui la connaissait comme le village Iermochos, à dix milles d’Éleuthéropolis sur la route de Jérusalem. Les fouilles de Pierre de Miroschedji de 1980 à 2009 ont montré que la grande époque de Jarmuth était bien antérieure à Josué : au Bronze ancien, au IIIe millénaire av. J.-C., c’était l’une des plus grandes villes de Canaan, 16 hectares dans des remparts épais jusqu’à 40 m, avec un palais d’environ 6 000 mètres carrés, abandonnée vers 2300 av. J.-C. La ville du Bronze récent et de l’âge du Fer que connaît la Bible n’occupait que la petite acropole au sommet du tertre."
    - "Aujourd’hui, le tell est un parc national à la lisière de Ramat Beit Shemesh, ses murs et son palais du Bronze ancien en partie restaurés ; la Jarmuth biblique est une mince couche à son sommet."
  pl:
    - "Jarmut było kananejskim miastem w Szefeli, którego król Piram dołączył do czterech innych pod wodzą Adoni-Sedeka z Jerozolimy przeciw Gibeonowi, został pokonany przez Jozuego, ukrył się z nimi w jaskini w Makkeda i został z nimi powieszony; „Król Jerymot jeden” stoi w wykazie trzydziestu jeden. Miasto przypadło Judzie, w Szefeli z Adullam, Soko i Azeką, a po wygnaniu Judejczycy znów mieszkali „w Enrymmon, i w Saraa, i w Jerymut”."
    - "Miejsce to Tel Jarmut (Chirbet el-Jarmuk), 25 km na południowy zachód od Jerozolimy koło Bet Szemesz, a nazwa niewiele się zmieniła od Euzebiusza, który znał je jako wieś Iermochos, dziesięć mil od Eleuteropolis przy drodze do Jerozolimy. Wykopaliska Pierre'a de Miroschedji od 1980 do 2009 r. wykazały, że wielki okres Jarmutu przypadał długo przed Jozuem: we wczesnej epoce brązu, w III tysiącleciu p.n.e., było jednym z największych miast Kanaanu, 16 hektarów w obrębie wałów grubych do 40 m, z pałacem o powierzchni około 6000 metrów kwadratowych, i zostało opuszczone około 2300 r. p.n.e. Miasto z późnej epoki brązu i żelaza, które zna Biblia, zajmowało tylko małą akropolę na szczycie pagórka."
    - "Dziś tell to park narodowy na skraju Ramat Bet Szemesz, z częściowo odbudowanymi murami i pałacem z wczesnej epoki brązu; biblijny Jarmut to cienka warstwa na jego szczycie."
  it:
    - "Iarmut era una città cananea nella Sefela il cui re, Piram, si unì agli altri quattro sotto Adoni-Sedek di Gerusalemme contro Gabaon, fu sconfitto da Giosuè, si nascose con loro nella grotta di Makkeda e fu impiccato con loro; «il re di Iarmuth» figura nell’elenco dei trentuno. La città cadde a Giuda, nella Sefela con Adullam, Soco e Azeka, e dopo l’esilio Giudei vissero di nuovo «in En-Rimmon, in Tsora, in Jarmuth»."
    - "Il sito è Tel Yarmuth (Khirbet el-Yarmuk), 25 km a sud-ovest di Gerusalemme presso Beit Shemesh, e il nome è appena cambiato dai tempi di Eusebio, che la conosceva come il villaggio Iermochos, a dieci miglia da Eleuteropoli sulla via di Gerusalemme. Gli scavi di Pierre de Miroschedji dal 1980 al 2009 mostrarono che il grande periodo di Iarmut fu molto prima di Giosuè: nel Bronzo Antico, nel III millennio a.C., fu una delle maggiori città di Canaan, 16 ettari entro bastioni spessi fino a 40 m, con un palazzo di circa 6000 metri quadrati, e fu abbandonata verso il 2300 a.C. La città del Bronzo Tardo e dell’età del Ferro che la Bibbia conosce occupava solo la piccola acropoli in cima al tell."
    - "Oggi il tell è un parco nazionale al margine di Ramat Beit Shemesh, con le mura e il palazzo del Bronzo Antico in parte restaurati; la Iarmut biblica è un sottile strato sulla sua sommità."
  nl:
    - "Jarmut was een Kanaänitische stad in de Sefela wier koning, Piram, zich met de vier anderen onder Adoni-Zedek van Jeruzalem tegen Gibeon verbond, door Jozua werd verslagen, zich met hen verborg in de grot bij Makkeda en met hen werd opgehangen; “De koning van Jarmuth, een” staat in de lijst van de eenendertig. De stad viel aan Juda, in de Sefela met Adullam, Socho en Azeka, en na de ballingschap woonden Judeeërs weer “te En-Rimmon, en te Zora, en te Jarmuth”."
    - "De plaats is Tel Yarmuth (Khirbet el-Yarmuk), 25 km ten zuidwesten van Jeruzalem bij Beit Shemesh, en de naam is sinds Eusebius nauwelijks veranderd; hij kende haar als het dorp Iermochos, tien mijl van Eleutheropolis op de weg naar Jeruzalem. Opgravingen van Pierre de Miroschedji van 1980 tot 2009 toonden aan dat de grote tijd van Jarmut lang vóór Jozua lag: in de Vroege Bronstijd, in het 3e millennium v.Chr., was het een van de grootste steden van Kanaän, 16 hectare binnen wallen tot 40 m dik, met een paleis van zo’n 6000 vierkante meter, en rond 2300 v.Chr. werd het verlaten. De stad uit de Late Bronstijd en IJzertijd die de Bijbel kent, besloeg alleen de kleine acropolis boven op de heuvel."
    - "Nu is de tell een nationaal park aan de rand van Ramat Beit Shemesh, met gedeeltelijk herstelde muren en paleis uit de Vroege Bronstijd; het bijbelse Jarmut is een dunne laag op de top."
  cs:
    - "Jarmut bylo kanaánské město v Šefele, jehož král Piram se připojil ke čtyřem dalším pod Adonicedekem Jeruzalémským proti Gibeonu, byl poražen Jozuem, ukryl se s nimi v jeskyni u Makedy a byl s nimi pověšen; „Král Jarmut jeden“ stojí v seznamu jedenatřiceti. Město připadlo Judovi, v Šefele s Adulamem, Sókem a Azekou, a po exilu žili Judovci opět „V Enremmon, v Zaraha, v Jarmut“."
    - "Místem je Tel Jarmut (Chirbet el-Jarmuk), 25 km jihozápadně od Jeruzaléma poblíž Bét Šemeše, a jméno se od Eusebia, který je znal jako vesnici Iermochos deset mil od Eleutheropole na cestě do Jeruzaléma, sotva změnilo. Vykopávky Pierra de Miroschedjiho od roku 1980 do roku 2009 ukázaly, že velké období Jarmutu bylo dlouho před Jozuem: v rané době bronzové, ve 3. tisíciletí př. n. l., bylo jedním z největších měst Kanaánu, 16 hektarů uvnitř valů silných až 40 m, s palácem o ploše asi 6 000 čtverečních metrů, a bylo opuštěno kolem roku 2300 př. n. l. Město z pozdní doby bronzové a doby železné, které Bible zná, zaujímalo jen malou akropoli na vrcholu pahorku."
    - "Dnes je tell národním parkem na okraji Ramat Bét Šemeš, jeho hradby a palác z rané doby bronzové jsou částečně obnoveny; biblický Jarmut je tenká vrstva na jeho vrcholu."
  sv:
    - "Jarmut var en kananeisk stad i Shefela vars kung, Piram, slöt sig till de fyra andra under Adoni-Sedek av Jerusalem mot Gibeon, besegrades av Josua, gömde sig med dem i grottan vid Mackeda och hängdes med dem; ”konungen i Jarmut en” står i förteckningen över de trettioen. Staden tillföll Juda, i Shefela med Adullam, Soko och Aseka, och efter exilen bodde judéer åter ”i En-Rimmon, Sorga, Jarmut”."
    - "Platsen är Tel Yarmuth (Khirbet el-Yarmuk), 25 km sydväst om Jerusalem nära Beit Shemesh, och namnet har knappt förändrats sedan Eusebios, som kände den som byn Iermochos, tio romerska mil från Eleutheropolis på vägen till Jerusalem. Utgrävningar av Pierre de Miroschedji 1980–2009 visade att Jarmuts storhetstid låg långt före Josua: under tidig bronsålder, på tredje årtusendet f.Kr., var den en av Kanaans största städer, 16 hektar innanför vallar upp till 40 m tjocka, med ett palats på omkring 6 000 kvadratmeter, och övergavs omkring 2300 f.Kr. Staden från senbronsåldern och järnåldern som Bibeln känner upptog bara den lilla akropolen på kullens topp."
    - "I dag är tellen en nationalpark i kanten av Ramat Beit Shemesh, med sina murar och sitt palats från tidig bronsålder delvis restaurerade; det bibliska Jarmut är ett tunt lager på dess topp."
  nb:
    - "Jarmut var en kanaanittisk by i Sjefela hvis konge, Piream, sluttet seg til de fire andre under Adoni-Sedek av Jerusalem mot Gibeon, ble beseiret av Josva, skjulte seg med dem i hulen ved Makkeda og ble hengt sammen med dem; «kongen i Jarmut én» står i listen over de en og tretti. Byen falt til Juda, i Sjefela med Adullam, Soko og Aseka, og etter eksilet bodde judeere igjen «i En-Rimmon, Sora, Jarmut»."
    - "Stedet er Tel Yarmuth (Khirbet el-Yarmuk), 25 km sørvest for Jerusalem nær Beit Shemesh, og navnet har knapt endret seg siden Eusebius, som kjente den som landsbyen Iermochos, ti romerske mil fra Eleutheropolis på veien til Jerusalem. Utgravninger av Pierre de Miroschedji fra 1980 til 2009 viste at Jarmuts store periode lå langt før Josva: i tidlig bronsealder, i det tredje årtusen f.Kr., var den en av de største byene i Kanaan, 16 hektar innenfor voller opptil 40 m tykke, med et palass på omtrent 6000 kvadratmeter, og ble forlatt omkring 2300 f.Kr. Byen fra sen bronsealder og jernalder som Bibelen kjenner, okkuperte bare den lille akropolis på toppen av haugen."
    - "I dag er haugen en nasjonalpark i kanten av Ramat Beit Shemesh, med murene og palasset fra tidlig bronsealder delvis restaurert; den bibelske Jarmut er et tynt lag på toppen."
  tl:
    - "Ang Jarmuth ay isang lungsod ng mga Cananeo sa Sephela na ang hari, si Phiream, ay sumama sa apat na iba pa sa ilalim ni Adoni-sedec ng Jerusalem laban sa Gabaon, natalo ni Josue, nagtago kasama nila sa yungib sa Maceda at ibinitin kasama nila; “Ang hari sa Jarmuth, isa” ay nasa talaan ng tatlumpu't isa. Napunta ang bayan sa Juda, sa Sephela kasama ang Adullam, Socho at Azeca, at pagkatapos ng pagkatapon ay muling nanirahan ang mga Judeano “sa En-rimmon, at sa Soreah, at sa Jarmuth”."
    - "Ang lugar ay ang Tel Yarmuth (Khirbet el-Yarmuk), 25 km sa timog-kanluran ng Jerusalem malapit sa Beit Shemesh, at halos hindi nagbago ang pangalan mula kay Eusebio, na nakakakilala rito bilang nayong Iermochos, sampung milya mula sa Eleutheropolis sa daan patungong Jerusalem. Ipinakita ng mga paghuhukay ni Pierre de Miroschedji mula 1980 hanggang 2009 na ang dakilang panahon ng Jarmuth ay matagal bago si Josue: sa Maagang Panahon ng Tanso, sa ika-3 milenyo BK, ito ay isa sa pinakamalalaking lungsod ng Canaan, 16 ektarya sa loob ng mga muog na hanggang 40 m ang kapal, na may palasyong mga 6,000 metrong parisukat, at iniwan mga 2300 BK. Ang bayan ng Huling Panahon ng Tanso at Panahon ng Bakal na kilala ng Biblia ay sumakop lamang sa maliit na akropolis sa tuktok ng burol."
    - "Ang tell ay ngayon isang pambansang liwasan sa gilid ng Ramat Beit Shemesh, na ang mga pader at palasyo nito ng Maagang Panahon ng Tanso ay bahagyang naibalik; ang Jarmuth ng Biblia ay manipis na patong sa tuktok nito."
  da:
    - "Jarmut var en kana'anæisk by i Sjefela, hvis konge, Piram, sluttede sig til de fire andre under Adoni-Zedek af Jerusalem mod Gibeon, blev besejret af Josva, skjulte sig med dem i hulen ved Makkeda og blev hængt med dem; »Kongen af Jarmuth een« står i listen over de enogtredive. Byen faldt til Juda, i Sjefela sammen med Adullam, Soko og Azeka, og efter eksilet boede judæere igen »i En-Rimmon og i Zora og i Jarmuth«."
    - "Stedet er Tel Yarmuth (Khirbet el-Yarmuk), 25 km sydvest for Jerusalem nær Beit Shemesh, og navnet har næppe ændret sig siden Eusebios, som kendte den som landsbyen Iermochos, ti romerske mil fra Eleutheropolis på vejen til Jerusalem. Udgravninger ledet af Pierre de Miroschedji fra 1980 til 2009 viste, at Jarmuts store periode lå længe før Josva: i den tidlige bronzealder, i 3. årtusinde f.Kr., var den en af Kana'ans største byer, 16 hektar inden for volde op til 40 m tykke, med et palads på omkring 6.000 kvadratmeter, og blev forladt omkring 2300 f.Kr. Byen fra sen bronzealder og jernalder, som Bibelen kender, optog kun den lille akropolis øverst på højen."
    - "I dag er tellen en nationalpark i udkanten af Ramat Beit Shemesh, dens mure og palads fra tidlig bronzealder delvis restaureret; det bibelske Jarmut er et tyndt lag på dens top."
  sr:
    - "Јармот је био ханански град у Сефели чији се цар, Пирам, придружио четворици других под Адониседеком Јерусалимским против Гаваона, био је потучен од Исуса, сакрио се с њима у пећини код Макиде и обешен с њима; „цар јармутски један“ стоји на списку тридесет и једног цара. Град је припао Јуди, у Сефели с Одоламом, Сохотом и Азиком, а после изгнанства Јудејци су поново живели „и у Ен-Римону и у Сареји и у Јармоту“."
    - "Налазиште је Тел Јармут (Хирбет ел-Јармук), 25 км југозападно од Јерусалима близу Бејт Шемеша, а име се једва променило од Јевсевија, који га је знао као село Јермохос, десет миља од Елеутерополиса на путу за Јерусалим. Ископавања Пјера де Мирошеџија од 1980. до 2009. показала су да је велико раздобље Јармота било много пре Исуса: у раном бронзаном добу, у трећем миленијуму п. н. е., био је један од највећих градова Ханана, 16 хектара унутар бедема дебелих до 40 м, са палатом од око 6.000 квадратних метара, и напуштен је око 2300. п. н. е. Град касног бронзаног и гвозденог доба који Библија зна заузимао је само малу акрополу на врху хумке."
    - "Данас је хумка национални парк на ободу Рамат Бејт Шемеша, а њени зидови и палата раног бронзаног доба делимично су обновљени; библијски Јармот је танак слој на њеном врху."
  hu:
    - "Jarmút sefélái kánaáni város volt, amelynek királya, Piram, a másik négy királlyal együtt a jeruzsálemi Adoni-Cedek vezetésével Gibeon ellen szövetkezett, Józsué legyőzte, velük együtt a makkédai barlangban rejtőzött, és velük együtt felakasztották; „Jármutnak királya egy” áll a harmincegy király jegyzékében. A város Júdához került, a Sefélában Adullámmal, Szókóval és Azekával, és a száműzetés után a júdeaiak ismét „En-Rimmonban, Sorában, Jarmuthban” laktak."
    - "A lelőhely Tel Jarmút (Hirbet el-Jarmuk), Jeruzsálemtől 25 km-re délnyugatra, Bét-Semes közelében, és a név alig változott Eusebius óta, aki Iermochos falunak ismerte, tíz mérföldre Eleutheropolisztól a Jeruzsálembe vezető úton. Pierre de Miroschedji 1980 és 2009 közötti ásatásai kimutatták, hogy Jarmút nagy korszaka jóval Józsué előtt volt: a kora bronzkorban, a Kr. e. 3. évezredben Kánaán egyik legnagyobb városa volt, 16 hektár, legfeljebb 40 m vastag sáncokon belül, mintegy 6000 négyzetméteres palotával, és Kr. e. 2300 körül elhagyták. A késő bronzkori és vaskori város, amelyet a Biblia ismer, csak a halom tetején lévő kis fellegvárat foglalta el."
    - "A tell ma nemzeti park Ramat Bét-Semes szélén, kora bronzkori falai és palotája részben helyreállítva; a bibliai Jarmút vékony réteg a csúcsán."
  fi:
    - "Jarmut oli kanaanilainen kaupunki Sefelassa, jonka kuningas Piram liittyi neljän muun kanssa Jerusalemin Adoni-Sedekin johdolla Gibeonia vastaan, Joosua voitti heidät, he piiloutuivat Makkedan luolaan ja heidät hirtettiin yhdessä; ”Jarmutin kuningas yksi” on kolmenkymmenenyhden luettelossa. Kaupunki joutui Juudalle, Sefelassa Adullamin, Sokon ja Asekan kanssa, ja pakkosiirtolaisuuden jälkeen juudalaiset asuivat jälleen paikoissa ”Een-Rimmonissa, Sorassa, Jarmutissa”."
    - "Paikka on Tel Yarmuth (Khirbet el-Yarmuk), 25 km Jerusalemista lounaaseen Beit Shemeshin lähellä, ja nimi on tuskin muuttunut Eusebioksen ajoista, joka tunsi sen Iermochos-nimisenä kylänä kymmenen mailin päässä Eleutheropoliksesta Jerusalemiin vievällä tiellä. Pierre de Miroschedjin kaivaukset vuosina 1980–2009 osoittivat, että Jarmutin suuri aika oli kauan ennen Joosuaa: varhaispronssikaudella, 3. vuosituhannella eaa., se oli yksi Kanaanin suurimmista kaupungeista, 16 hehtaaria jopa 40 m paksujen valleiden sisällä, noin 6 000 neliömetrin palatsilla, ja se hylättiin noin vuonna 2300 eaa. Myöhäispronssi- ja rautakauden kaupunki, jonka Raamattu tuntee, asutti vain pientä kaupunkilinnaa kummun huipulla."
    - "Nykyään kumpu on kansallispuisto Ramat Beit Shemeshin reunalla, sen varhaispronssikauden muurit ja palatsi osittain kunnostettuina; Raamatun Jarmut on ohut kerros sen huipulla."
  vi:
    - "Giạt-mút là một thành Ca-na-an ở Sê-phê-la mà vua Phi-ram cùng bốn vua khác dưới A-đô-ni-Xê-đéc của Giê-ru-sa-lem chống lại Ga-ba-ôn, bị Giô-suê đánh bại, ẩn cùng họ trong hang ở Ma-kê-đa và bị treo cùng họ; “vua Giạt-mút, vua La-ki” có trong bảng ba mươi mốt vua. Thành rơi vào tay Giu-đa, ở Sê-phê-la cùng A-đu-lam, Sô-cô và A-xê-ca, và sau cuộc lưu đày người Giu-đa lại ở “tại Ên-rim-môn, Xô-ra Giạt-mút”."
    - "Địa điểm là Tel Yarmuth (Khirbet el-Yarmuk), cách Giê-ru-sa-lem 25 km về phía tây nam gần Beit Shemesh, và tên hầu như không đổi từ thời Eusebius, người biết đó là làng Iermochos, cách Eleutheropolis 10 dặm trên đường đến Giê-ru-sa-lem. Các cuộc khai quật của Pierre de Miroschedji từ 1980 đến 2009 cho thấy thời kỳ vĩ đại của Giạt-mút nằm rất lâu trước Giô-suê: vào thời Đồ Đồng Sớm, thiên niên kỷ 3 TCN, đó là một trong những thành lớn nhất của Ca-na-an, rộng 16 hécta trong lũy dày đến 40 m, với một cung điện khoảng 6.000 mét vuông, và bị bỏ hoang khoảng năm 2300 TCN. Thị trấn thời Đồ Đồng Muộn và Đồ Sắt mà Kinh Thánh biết chỉ chiếm vệ thành nhỏ trên đỉnh gò."
    - "Ngày nay tell là một công viên quốc gia ở rìa Ramat Beit Shemesh, các tường và cung điện thời Đồ Đồng Sớm được phục hồi một phần; Giạt-mút trong Kinh Thánh chỉ là một lớp mỏng trên đỉnh."
  ro:
    - "Iarmut era un oraș canaanit din Șefela al cărui rege, Piream, s-a alăturat celorlalți patru sub Adoni-Țedec al Ierusalimului împotriva Gabaonului, a fost învins de Iosua, s-a ascuns cu ei în peștera de la Maceda și a fost spânzurat împreună cu ei; regele Iarmutului, unul, se află în lista celor treizeci și unu. Orașul a căzut lui Iuda, în Șefela, cu Adulam, Soco și Azeca, iar după exil iudeii au locuit din nou „în Ieremon și în Saraa și în Ierimut”."
    - "Locul este Tel Yarmuth (Khirbet el-Yarmuk), la 25 km spre sud-vest de Ierusalim, lângă Beit Shemesh, iar numele abia s-a schimbat de pe vremea lui Eusebiu, care îl cunoștea ca satul Iermochos, la zece mile de Eleutheropolis, pe drumul spre Ierusalim. Săpăturile lui Pierre de Miroschedji din 1980 până în 2009 au arătat că marea perioadă a Iarmutului a fost cu mult înainte de Iosua: în Bronzul Timpuriu, în mileniul al III-lea î.Hr., era unul dintre cele mai mari orașe din Canaan, de 16 hectare în interiorul unor valuri groase de până la 40 m, cu un palat de circa 6000 de metri pătrați, și a fost abandonat în jurul anului 2300 î.Hr. Orașul din Bronzul Târziu și Epoca Fierului pe care îl cunoaște Biblia ocupa doar mica acropolă din vârful movilei."
    - "Astăzi movila este un parc național la marginea Ramat Beit Shemesh, cu zidurile și palatul din Bronzul Timpuriu parțial restaurate; Iarmutul biblic este un strat subțire în vârful ei."
  bg:
    - "Ярмут беше ханаански град в Шефела, чийто цар Фирам се присъедини към другите четирима под предводителството на Адониседек от Йерусалим срещу Гаваон, беше разбит от Иисус Навин, скри се с тях в пещерата при Макед и беше обесен заедно с тях; „Ярмутский цар, един“ стои в списъка на тридесет и единте. Градът се падна на Юда, в Шефела заедно с Одолам, Сохо и Азека, а след изгнанието юдеи отново живееха „в Ен-римон, и в Сарая, и в Ярмут“."
    - "Мястото е Тел Ярмут (Хирбет ел-Ярмук), на 25 км югозападно от Йерусалим близо до Бейт Шемеш, а името почти не се е променило от времето на Евсевий, който го познаваше като село Иермохос, на десет мили от Елевтерополис по пътя за Йерусалим. Разкопките на Пиер дьо Мирошеджи от 1980 до 2009 г. показаха, че големият период на Ярмут е бил много преди Иисус Навин: през ранната бронзова епоха, през III хил. пр.н.е., той е бил един от най-големите градове на Ханаан — 16 хектара зад валове с дебелина до 40 м, с дворец от около 6000 квадратни метра, и е бил изоставен около 2300 г. пр.н.е. Градът от късната бронзова и желязната епоха, който познава Библията, заемаше само малкия акропол на върха на могилата."
    - "Днес могилата е национален парк на края на Рамат Бейт Шемеш, с частично възстановени стени и дворец от ранната бронзова епоха; библейският Ярмут е тънък пласт на върха ѝ."
