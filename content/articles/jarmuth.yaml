# Overview article (ADR 0007). Mainstream facts only; a minor biblical place with a major Early Bronze Age site.
id: jarmuth
place: a539e01
title:
  en: "Jarmuth"
  ru: "Иармуф"
  uk: "Ярмут"
  es: "Jarmut"
  pt: "Jarmute"
  de: "Jarmut"
  fr: "Jarmuth"
body:
  en:
    - "Jarmuth was a Canaanite city in the Shephelah whose king, Piram, joined the four others under Adoni-zedek of Jerusalem against Gibeon, was defeated by Joshua, hid with them in the cave at Makkedah and was hanged with them; “The king of Jarmuth, one” stands in the list of the thirty-one. The town fell to Judah, in the Shephelah with Adullam, Socoh and Azekah, and after the exile Judahites again lived “at En-rimmon, and at Zareah, and at Jarmuth”."
    - "The site is Tel Yarmuth (Khirbet el-Yarmuk), 25 km south-west of Jerusalem near Beit Shemesh, and the name has hardly changed since Eusebius, who knew it as the village Iermochos in the territory of Eleutheropolis. Excavations by Pierre de Miroschedji from 1980 to 2009 showed that the great period of Jarmuth was long before Joshua: in the Early Bronze Age, in the third millennium BC, it was one of the largest cities of Canaan, 16 hectares within ramparts up to 40 m thick, with a palace of some 6,000 square metres, and was abandoned about 2300 BC. The Late Bronze and Iron Age town that the Bible knows occupied only the small acropolis at the top of the mound."
    - "Today the tell is a national park on the edge of Ramat Beit Shemesh, its Early Bronze Age walls and palace partly restored; the biblical Jarmuth is a thin layer on its summit."
  ru:
    - "Иармуф был ханаанским городом в Шефеле, чей царь Фирам вместе с четырьмя другими под началом Адониседека Иерусалимского выступил против Гаваона, был разбит Иисусом Навином, скрылся с ними в пещере в Македе и был повешен с ними; «один царь Иармуфа» стоит в списке тридцати одного. Город достался Иуде, в Шефеле вместе с Одолламом, Сохо и Азекой, а после плена Иудеи снова жили «в Ен-Риммоне, в Цоре и в Иармуфе»."
    - "Это Тель-Ярмут (Хирбет-эль-Ярмук) в 25 км к юго-западу от Иерусалима близ Бейт-Шемеша, и имя почти не изменилось со времён Евсевия, знавшего его как селение Иермохос в округе Элевтерополя. Раскопки Пьера де Мирошеджи с 1980 по 2009 год показали, что великое время Иармуфа было задолго до Иисуса Навина: в раннем бронзовом веке, в III тысячелетии до н. э., это был один из крупнейших городов Ханаана, 16 гектаров внутри валов толщиной до 40 м, с дворцом около 6000 квадратных метров, и около 2300 г. до н. э. он был покинут. Город позднего бронзового и железного века, который знает Библия, занимал только маленький акрополь на вершине холма."
    - "Сегодня холм — национальный парк на краю Рамат-Бейт-Шемеша, стены и дворец раннего бронзового века частично восстановлены; библейский Иармуф — тонкий слой на его вершине."
  uk:
    - "Ярмут було ханаанським містом у Шефелі, чий цар Фірам разом з чотирма іншими під проводом Адоніседека Єрусалимського виступив проти Гаваона, був розбитий Ісусом Навином, сховався з ними в печері Македи і був повішений з ними; «Цар Ярмутський, один» стоїть у переліку тридцяти одного. Місто дісталося Юді, в Шефелі разом з Одоламом, Сохо й Азекою, а після вигнання юдеї знову жили «В Ен-Риммонї, в Зорі й в Ярмутї»."
    - "Місце — Тель-Ярмут (Хірбет-ель-Ярмук), за 25 км на південний захід від Єрусалима поблизу Бейт-Шемеша, і назва ледве змінилася від часів Євсевія, який знав її як село Ієрмох на території Елевферополя. Розкопки П’єра де Мірошеджі від 1980 до 2009 року показали, що великий період Ярмута був задовго до Ісуса Навина: у ранньому бронзовому віці, в III тисячолітті до н. е., він був одним із найбільших міст Ханаану, 16 гектарів у межах валів завтовшки до 40 м, з палацом близько 6000 квадратних метрів, і був покинутий близько 2300 р. до н. е. Місто пізнього бронзового й залізного віків, яке знає Біблія, займало лише малий акрополь на вершині городища."
    - "Сьогодні тель — національний парк на краю Рамат-Бейт-Шемеша, його мури й палац раннього бронзового віку частково відновлені; біблійний Ярмут — тонкий шар на його вершині."
  es:
    - "Jarmut era una ciudad cananea de la Sefelá cuyo rey, Piram, se unió a los otros cuatro bajo Adonisedec de Jerusalén contra Gabaón, fue derrotado por Josué, se ocultó con ellos en la cueva de Maceda y fue colgado con ellos; «El rey de Jarmuth, otro» figura en la lista de los treinta y un reyes. La población cayó en poder de Judá, en la Sefelá con Adulam, Soco y Azeca, y tras el destierro los judaítas vivieron de nuevo «en En-rimmón, y en Soreah y en Jarmuth»."
    - "El sitio es Tel Yarmuth (Khirbet el-Yarmuk), a 25 km al suroeste de Jerusalén, cerca de Bet Semes, y el nombre apenas ha cambiado desde Eusebio, que la conocía como la aldea Iermochos en el territorio de Eleuterópolis. Las excavaciones de Pierre de Miroschedji de 1980 a 2009 mostraron que el gran período de Jarmut fue muy anterior a Josué: en la Edad del Bronce Antiguo, en el tercer milenio a. C., fue una de las mayores ciudades de Canaán, de 16 hectáreas dentro de murallas de hasta 40 m de grosor, con un palacio de unos 6000 metros cuadrados, y fue abandonada hacia el 2300 a. C. La población del Bronce Final y de la Edad del Hierro que conoce la Biblia ocupaba solo la pequeña acrópolis en lo alto del montículo."
    - "Hoy el tell es un parque nacional en el borde de Ramat Bet Semes, con sus murallas y su palacio del Bronce Antiguo parcialmente restaurados; la Jarmut bíblica es una delgada capa en su cima."
  pt:
    - "Jarmute era uma cidade cananeia na Sefelá cujo rei, Pirão, juntou-se aos outros quatro sob Adoni-Zedeque de Jerusalém contra Gibeão, foi derrotado por Josué, escondeu-se com eles na caverna de Maquedá e foi enforcado com eles; “o rei de Jarmute, um” consta da lista dos trinta e um. A cidade coube a Judá, na Sefelá, com Adulão, Socó e Azeca, e depois do exílio judaítas viveram de novo “em En-Rimom, em Zorá, em Jarmute”."
    - "O sítio é Tel Yarmuth (Khirbet el-Yarmuk), a 25 km a sudoeste de Jerusalém, perto de Beit Shemesh, e o nome mal mudou desde Eusébio, que a conheceu como a aldeia Iermochos no território de Eleutéropolis. As escavações de Pierre de Miroschedji, de 1980 a 2009, mostraram que o grande período de Jarmute foi muito antes de Josué: na Idade do Bronze Antigo, no terceiro milênio a.C., foi uma das maiores cidades de Canaã, com 16 hectares dentro de baluartes de até 40 m de espessura, com um palácio de cerca de 6.000 metros quadrados, e foi abandonada por volta de 2300 a.C. A cidade do Bronze Tardio e da Idade do Ferro que a Bíblia conhece ocupava apenas a pequena acrópole no alto do monte."
    - "Hoje o tell é um parque nacional na orla de Ramat Beit Shemesh, com suas muralhas e seu palácio do Bronze Antigo parcialmente restaurados; a Jarmute bíblica é uma fina camada em seu cume."
  de:
    - "Jarmut war eine kanaanitische Stadt in der Schefela, deren König Piram sich den vier anderen unter Adoni-Zedek von Jerusalem gegen Gibeon anschloss, von Josua besiegt wurde, sich mit ihnen in der Höhle bei Makkeda verbarg und mit ihnen gehängt wurde; „der König zu Jarmuth“ steht in der Liste der einunddreißig. Die Stadt fiel an Juda, in der Schefela mit Adullam, Socho und Aseka, und nach dem Exil wohnten Judäer wieder „zu En-Rimmon, Zora, Jarmuth“."
    - "Die Stätte ist Tel Jarmut (Chirbet el-Jarmuk), 25 km südwestlich von Jerusalem bei Bet Schemesch, und der Name hat sich seit Eusebius kaum verändert, der es als Dorf Iermochos im Gebiet von Eleutheropolis kannte. Grabungen von Pierre de Miroschedji von 1980 bis 2009 zeigten, dass die große Zeit Jarmuts lange vor Josua lag: In der Frühbronzezeit, im 3. Jahrtausend v. Chr., war es eine der größten Städte Kanaans, 16 Hektar innerhalb von bis zu 40 m dicken Wällen, mit einem Palast von etwa 6000 Quadratmetern, und wurde um 2300 v. Chr. verlassen. Die spätbronze- und eisenzeitliche Stadt, die die Bibel kennt, besetzte nur die kleine Akropolis oben auf dem Hügel."
    - "Heute ist der Tell ein Nationalpark am Rand von Ramat Bet Schemesch, seine frühbronzezeitlichen Mauern und der Palast teilweise restauriert; das biblische Jarmut ist eine dünne Schicht auf seinem Gipfel."
  fr:
    - "Jarmuth était une ville cananéenne de la Shéphéla dont le roi, Piream, se joignit aux quatre autres sous Adoni-Tsédek de Jérusalem contre Gabaon, fut vaincu par Josué, se cacha avec eux dans la caverne de Makkéda et fut pendu avec eux ; « le roi de Jarmuth, un » figure dans la liste des trente et un. La ville tomba à Juda, dans la Shéphéla avec Adullam, Soco et Azéka, et après l’exil des Judéens habitèrent de nouveau « à En-Rimmon, à Tsorea, à Jarmuth »."
    - "Le site est Tel Yarmuth (Khirbet el-Yarmuk), à 25 km au sud-ouest de Jérusalem près de Beit Shemesh, et le nom a à peine changé depuis Eusèbe, qui la connaissait comme le village Iermochos dans le territoire d’Éleuthéropolis. Les fouilles de Pierre de Miroschedji de 1980 à 2009 ont montré que la grande époque de Jarmuth était bien antérieure à Josué : au Bronze ancien, au IIIe millénaire av. J.-C., c’était l’une des plus grandes villes de Canaan, 16 hectares dans des remparts épais jusqu’à 40 m, avec un palais d’environ 6 000 mètres carrés, abandonnée vers 2300 av. J.-C. La ville du Bronze récent et de l’âge du Fer que connaît la Bible n’occupait que la petite acropole au sommet du tertre."
    - "Aujourd’hui, le tell est un parc national à la lisière de Ramat Beit Shemesh, ses murs et son palais du Bronze ancien en partie restaurés ; la Jarmuth biblique est une mince couche à son sommet."
