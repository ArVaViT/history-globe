# Overview article (ADR 0007). Mainstream facts only; a minor biblical place with a major Early Bronze Age site.
id: jarmuth
place: a539e01
title:
  en: "Jarmuth"
  ru: "Иармуф"
body:
  en:
    - "Jarmuth was a Canaanite city in the Shephelah whose king, Piram, joined the four others under Adoni-zedek of Jerusalem against Gibeon, was defeated by Joshua, hid with them in the cave at Makkedah and was hanged with them; “The king of Jarmuth, one” stands in the list of the thirty-one. The town fell to Judah, in the Shephelah with Adullam, Socoh and Azekah, and after the exile Judahites again lived “at En-rimmon, and at Zareah, and at Jarmuth”."
    - "The site is Tel Yarmuth (Khirbet el-Yarmuk), 25 km south-west of Jerusalem near Beit Shemesh, and the name has hardly changed since Eusebius, who knew it as the village Iermochos in the territory of Eleutheropolis. Excavations by Pierre de Miroschedji from 1980 to 2009 showed that the great period of Jarmuth was long before Joshua: in the Early Bronze Age, in the third millennium BC, it was one of the largest cities of Canaan, 16 hectares within ramparts up to 40 m thick, with a palace of some 6,000 square metres, and was abandoned about 2300 BC. The Late Bronze and Iron Age town that the Bible knows occupied only the small acropolis at the top of the mound."
    - "Today the tell is a national park on the edge of Ramat Beit Shemesh, its Early Bronze Age walls and palace partly restored; the biblical Jarmuth is a thin layer on its summit."
  ru:
    - "Иармуф был ханаанским городом в Шефеле, чей царь Фирам вместе с четырьмя другими под началом Адониседека Иерусалимского выступил против Гаваона, был разбит Иисусом Навином, скрылся с ними в пещере в Македе и был повешен с ними; «один царь Иармуфа» стоит в списке тридцати одного. Город достался Иуде, в Шефеле вместе с Одолламом, Сохо и Азекой, а после плена Иудеи снова жили «в Ен-Риммоне, в Цоре и в Иармуфе»."
    - "Это Тель-Ярмут (Хирбет-эль-Ярмук) в 25 км к юго-западу от Иерусалима близ Бейт-Шемеша, и имя почти не изменилось со времён Евсевия, знавшего его как селение Иермохос в округе Элевтерополя. Раскопки Пьера де Мирошеджи с 1980 по 2009 год показали, что великое время Иармуфа было задолго до Иисуса Навина: в раннем бронзовом веке, в III тысячелетии до н. э., это был один из крупнейших городов Ханаана, 16 гектаров внутри валов толщиной до 40 м, с дворцом около 6000 квадратных метров, и около 2300 г. до н. э. он был покинут. Город позднего бронзового и железного века, который знает Библия, занимал только маленький акрополь на вершине холма."
    - "Сегодня холм — национальный парк на краю Рамат-Бейт-Шемеша, стены и дворец раннего бронзового века частично восстановлены; библейский Иармуф — тонкий слой на его вершине."
