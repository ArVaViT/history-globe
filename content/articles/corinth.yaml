# Overview article (ADR 0007). Mainstream facts only; disputed datings are named as such.
id: corinth
place: a6f437a
title:
  en: "Corinth"
  ru: "Коринф"
  uk: "Коринт"
  es: "Corinto"
  pt: "Corinto"
  de: "Korinth"
  fr: "Corinthe"
body:
  en:
    - "Corinth stands at the isthmus joining the Peloponnese to mainland Greece, below the citadel of Acrocorinth, with one harbour on each sea: Lechaeum on the Gulf of Corinth and Cenchreae on the Saronic Gulf. Under the tyrants Cypselus and Periander, in the seventh and early sixth centuries BC, it became a rich trading city; ships were hauled across the isthmus on a paved way, the diolkos, and the temple of Apollo was built in the sixth century BC."
    - "In the classical age Corinth was Athens' rival and Sparta's ally; in 337 BC Philip II gathered the Greeks there in the League of Corinth. As a leading city of the Achaean League it fought Rome, and in 146 BC Lucius Mummius sacked it, put most of those found there to the sword and sold the women and children. The site lay desolate until Julius Caesar founded a Roman colony there in 44 BC, settled largely with freedmen. Corinth became the seat of the proconsul of Achaia."
    - "Paul came from Athens and lodged with Aquila and Priscilla, tentmakers lately expelled from Rome. When the synagogue turned against him he taught next door in the house of Justus; Crispus, the ruler of the synagogue, believed, and Paul stayed eighteen months. The Jews brought him before the proconsul Gallio, who refused to judge the case. An inscription at Delphi dates Gallio's year in office to 51–52, which makes this one of the firmest dates in Paul's life. Apollos later worked here. Paul wrote two letters to the church, and Romans was probably written from Corinth: it commends Phoebe of Cenchreae and sends greetings from Erastus, the city treasurer."
    - "Nero began to cut a canal through the isthmus in AD 67, but the work was abandoned. About AD 96, by the usual dating, the church of Rome wrote to the Corinthians the letter known as 1 Clement. Earthquakes shook the Peloponnese in the later fourth century, and when Alaric's Goths overran Greece in 395–396 they took Corinth without a fight."
  ru:
    - "Коринф стоит у перешейка, соединяющего Пелопоннес с материковой Грецией, под крепостью Акрокоринф; у него было по гавани на каждом море: Лехей на Коринфском заливе и Кенхреи на Сароническом. При тиранах Кипселе и Периандре, в VII и начале VI века до н. э., он стал богатым торговым городом; корабли перетаскивали через перешеек по мощёному волоку — диолку, а в VI веке до н. э. был построен храм Аполлона."
    - "В классическую эпоху Коринф соперничал с Афинами и был союзником Спарты; в 337 г. до н. э. Филипп II собрал здесь греков в Коринфский союз. Как один из главных городов Ахейского союза Коринф воевал с Римом, и в 146 г. до н. э. Луций Муммий разграбил его, большую часть застигнутых в городе предал мечу, а женщин и детей продал в рабство. Место лежало в запустении, пока Юлий Цезарь не основал здесь в 44 г. до н. э. римскую колонию, заселённую в основном вольноотпущенниками. Коринф стал резиденцией проконсула Ахаии."
    - "Павел пришёл из Афин и поселился у Акилы и Прискиллы, делателей палаток, недавно изгнанных из Рима. Когда синагога восстала на него, он стал учить в соседнем доме Иуста; уверовал и Крисп, начальник синагоги, и Павел пробыл здесь полтора года. Иудеи привели его на суд к проконсулу Галлиону, но тот отказался судить. Надпись в Дельфах датирует год проконсульства Галлиона 51–52 гг., и это одна из самых твёрдых дат в жизни Павла. Позже здесь трудился Аполлос. Павел написал церкви два послания, а Послание к Римлянам, вероятно, написано в Коринфе: в нём он представляет Фиву из Кенхрей и передаёт приветствие от Ераста, городского казнохранителя."
    - "В 67 г. н. э. Нерон начал прорывать канал через перешеек, но работу бросили. Около 96 г. н. э., по обычной датировке, римская церковь написала коринфянам послание, известное как Первое послание Климента. Во второй половине IV века Пелопоннес сотрясали землетрясения, а когда в 395–396 гг. готы Алариха прошли по Греции, они взяли Коринф без боя."
  uk:
    - "Коринт стоїть на перешийку, що з'єднує Пелопоннес із материковою Елладою, під цитаделлю Акрокоринф, з однією гаванню на кожному морі: Лехеєм на Коринфській затоці та Кенхреями на Сароніській затоці. За тиранів Кіпсела та Періандра, у VII — на початку VI ст. до н. е., він став багатим торговим містом; кораблі перетягали через перешийок вимощеним шляхом, діолком, а храм Аполлона було збудовано в VI ст. до н. е."
    - "У класичну добу Коринт був суперником Афін і союзником Спарти; у 337 р. до н. е. Пилип II зібрав там греків у Коринфський союз. Як одне з провідних міст Ахейського союзу він воював із Римом, і в 146 р. до н. е. Луцій Муммій розграбував його, вирізав більшість знайдених там і продав жінок і дітей. Місце лежало спустошене, доки Юлій Цезар не заснував там римську колонію в 44 р. до н. е., заселену переважно вільновідпущениками. Коринт став резиденцією проконсула Ахаї."
    - "Павло прийшов з Афін і оселився в Акили та Прискилли, наметників, нещодавно вигнаних із Рима. Коли синагога обернулася проти нього, він навчав поряд, у домі Юста; Крисп, старійшина синагоги, увірував, і Павло лишився вісімнадцять місяців. Юдеї привели його до проконсула Галліона, який відмовився судити справу. Напис у Дельфах датує рік урядування Галліона 51–52 рр., що робить це однією з найпевніших дат у житті Павла. Згодом тут працював Аполлос. Павло написав церкві два листи, а послання до римлян, імовірно, написано в Коринті: воно рекомендує Фиву з Кенхрей і передає вітання від Ераста, міського скарбника."
    - "Нерон почав копати канал крізь перешийок у 67 р. н. е., але роботу залишили. Близько 96 р. н. е., за поширеною датою, римська церква написала коринфянам послання, відоме як Перше послання Климента. Землетруси сколихнули Пелопоннес наприкінці IV ст., а коли готи Аларіха в 395–396 рр. залили Елладу, вони взяли Коринт без бою."
  es:
    - "Corinto se alza en el istmo que une el Peloponeso con la Grecia continental, bajo la ciudadela del Acrocorinto, con un puerto en cada mar: Lequeo en el golfo de Corinto y Cencrea en el golfo Sarónico. Bajo los tiranos Cípselo y Periandro, en el siglo VII y comienzos del VI a. C., se convirtió en una rica ciudad comercial; las naves eran arrastradas a través del istmo por una vía pavimentada, el diolkos, y el templo de Apolo se construyó en el siglo VI a. C."
    - "En la época clásica Corinto fue rival de Atenas y aliada de Esparta; en el 337 a. C. Filipo II reunió allí a los griegos en la Liga de Corinto. Como ciudad destacada de la Liga Aquea combatió a Roma, y en el 146 a. C. Lucio Mumio la saqueó, pasó a cuchillo a la mayoría de los que allí encontró y vendió a las mujeres y a los niños. El sitio quedó desolado hasta que Julio César fundó allí una colonia romana en el 44 a. C., poblada en gran parte con libertos. Corinto pasó a ser sede del procónsul de Acaya."
    - "Pablo llegó desde Atenas y se alojó con Aquila y Priscila, fabricantes de tiendas expulsados poco antes de Roma. Cuando la sinagoga se volvió contra él, enseñó en la casa de Justo, contigua; Crispo, el principal de la sinagoga, creyó, y Pablo permaneció dieciocho meses. Los judíos lo llevaron ante el procónsul Galión, que se negó a juzgar el caso. Una inscripción de Delfos fecha el año de cargo de Galión en 51–52, lo que convierte esta en una de las fechas más firmes de la vida de Pablo. Apolos trabajó después aquí. Pablo escribió dos cartas a la iglesia, y la carta a los Romanos fue probablemente escrita desde Corinto: recomienda a Febe de Cencrea y envía saludos de Erasto, el tesorero de la ciudad."
    - "Nerón empezó a abrir un canal a través del istmo en el 67 d. C., pero la obra fue abandonada. Hacia el 96 d. C., según la datación habitual, la iglesia de Roma escribió a los corintios la carta conocida como 1 Clemente. Los terremotos sacudieron el Peloponeso a finales del siglo IV, y cuando los godos de Alarico invadieron Grecia en 395–396 tomaron Corinto sin combate."
  pt:
    - "Corinto fica no istmo que liga o Peloponeso à Grécia continental, abaixo da cidadela do Acrocorinto, com um porto em cada mar: Lecaio no Golfo de Corinto e Cencreia no Golfo Sarônico. Sob os tiranos Cípselo e Periandro, nos séculos VII e início do VI a.C., tornou-se uma rica cidade comercial; os navios eram arrastados através do istmo por uma via pavimentada, o diolkos, e o templo de Apolo foi construído no século VI a.C."
    - "Na época clássica, Corinto foi rival de Atenas e aliada de Esparta; em 337 a.C., Filipe II reuniu ali os gregos na Liga de Corinto. Como cidade importante da Liga Aqueia, combateu Roma, e em 146 a.C. Lúcio Múmio a saqueou, passou à espada a maioria dos que ali encontrou e vendeu as mulheres e crianças. O local jazeu desolado até que Júlio César fundou ali uma colônia romana em 44 a.C., povoada em grande parte por libertos. Corinto tornou-se a sede do procônsul da Acaia."
    - "Paulo veio de Atenas e hospedou-se com Áquila e Priscila, fabricantes de tendas havia pouco expulsos de Roma. Quando a sinagoga se voltou contra ele, ensinou na casa vizinha, de Justo; Crispo, chefe da sinagoga, creu, e Paulo ficou dezoito meses. Os judeus o levaram diante do procônsul Gálio, que se recusou a julgar o caso. Uma inscrição em Delfos data o ano de Gálio no cargo em 51–52, o que faz desta uma das datas mais firmes da vida de Paulo. Apolo trabalhou aqui mais tarde. Paulo escreveu duas cartas à igreja, e Romanos foi provavelmente escrita de Corinto: recomenda Febe de Cencreia e envia saudações de Erasto, o tesoureiro da cidade."
    - "Nero começou a abrir um canal através do istmo em 67 d.C., mas a obra foi abandonada. Por volta de 96 d.C., pela datação habitual, a igreja de Roma escreveu aos coríntios a carta conhecida como 1 Clemente. Terremotos abalaram o Peloponeso no fim do século IV, e quando os godos de Alarico invadiram a Grécia em 395–396, tomaram Corinto sem combate."
  de:
    - "Korinth liegt auf dem Isthmus, der den Peloponnes mit dem griechischen Festland verbindet, unterhalb der Burg Akrokorinth, mit je einem Hafen an jedem Meer: Lechaion am Golf von Korinth und Kenchreä am Saronischen Golf. Unter den Tyrannen Kypselos und Periander im 7. und frühen 6. Jahrhundert v. Chr. wurde es eine reiche Handelsstadt; Schiffe wurden auf einem gepflasterten Weg, dem Diolkos, über den Isthmus gezogen, und der Apollotempel wurde im 6. Jahrhundert v. Chr. gebaut."
    - "In klassischer Zeit war Korinth Athens Rivale und Spartas Verbündeter; 337 v. Chr. versammelte Philipp II. die Griechen dort im Korinthischen Bund. Als führende Stadt des Achaiischen Bundes kämpfte es gegen Rom, und 146 v. Chr. plünderte Lucius Mummius es, ließ die meisten dort Angetroffenen über die Klinge springen und verkaufte die Frauen und Kinder. Der Ort lag verödet, bis Julius Caesar dort 44 v. Chr. eine römische Kolonie gründete, die überwiegend mit Freigelassenen besiedelt wurde. Korinth wurde Sitz des Prokonsuls von Achaja."
    - "Paulus kam aus Athen und wohnte bei Aquila und Priscilla, Zeltmachern, die kürzlich aus Rom ausgewiesen worden waren. Als sich die Synagoge gegen ihn wandte, lehrte er nebenan im Haus des Justus; Krispus, der Vorsteher der Synagoge, glaubte, und Paulus blieb achtzehn Monate. Die Juden führten ihn vor den Prokonsul Gallio, der es ablehnte, den Fall zu entscheiden. Eine Inschrift in Delphi datiert Gallios Amtsjahr auf 51–52, was dies zu einem der festesten Daten im Leben des Paulus macht. Apollos wirkte später hier. Paulus schrieb der Gemeinde zwei Briefe, und der Römerbrief wurde wahrscheinlich von Korinth aus geschrieben: Er empfiehlt Phöbe von Kenchreä und übermittelt Grüße von Erastus, dem Stadtkämmerer."
    - "Nero begann im Jahr 67 n. Chr., einen Kanal durch den Isthmus zu graben, doch das Werk wurde aufgegeben. Um 96 n. Chr., nach der üblichen Datierung, schrieb die Gemeinde von Rom den Korinthern den als 1. Klemensbrief bekannten Brief. Erdbeben erschütterten den Peloponnes im späteren 4. Jahrhundert, und als Alarichs Goten 395–396 Griechenland überrannten, nahmen sie Korinth ohne Kampf ein."
  fr:
    - "Corinthe s’élève sur l’isthme qui joint le Péloponnèse à la Grèce continentale, au pied de la citadelle de l’Acrocorinthe, avec un port sur chaque mer : Léchaion sur le golfe de Corinthe et Cenchrées sur le golfe Saronique. Sous les tyrans Cypsélos et Périandre, aux VIIe et début du VIe siècle av. J.-C., elle devint une riche cité marchande ; les navires étaient halés à travers l’isthme sur une voie pavée, le diolkos, et le temple d’Apollon fut bâti au VIe siècle av. J.-C."
    - "À l’époque classique, Corinthe était la rivale d’Athènes et l’alliée de Sparte ; en 337 av. J.-C., Philippe II y réunit les Grecs dans la Ligue de Corinthe. Cité majeure de la Ligue achéenne, elle combattit Rome, et en 146 av. J.-C. Lucius Mummius la mit à sac, passa au fil de l’épée la plupart de ceux qu’il y trouva et vendit les femmes et les enfants. Le site resta désert jusqu’à ce que Jules César y fonde une colonie romaine en 44 av. J.-C., peuplée surtout d’affranchis. Corinthe devint le siège du proconsul d’Achaïe."
    - "Paul vint d’Athènes et logea chez Aquilas et Priscille, fabricants de tentes récemment expulsés de Rome. Quand la synagogue se retourna contre lui, il enseigna à côté, dans la maison de Justus ; Crispus, chef de la synagogue, crut, et Paul resta dix-huit mois. Les Juifs le firent comparaître devant le proconsul Gallion, qui refusa de juger l’affaire. Une inscription de Delphes date l’année de charge de Gallion de 51–52, ce qui en fait l’une des dates les plus sûres de la vie de Paul. Apollos travailla plus tard ici. Paul écrivit deux lettres à l’Église, et l’épître aux Romains fut probablement écrite de Corinthe : elle recommande Phœbé de Cenchrées et transmet les salutations d’Éraste, le trésorier de la ville."
    - "Néron commença à creuser un canal à travers l’isthme en 67 apr. J.-C., mais les travaux furent abandonnés. Vers 96 apr. J.-C., selon la datation habituelle, l’Église de Rome écrivit aux Corinthiens la lettre connue sous le nom de 1 Clément. Des séismes secouèrent le Péloponnèse dans la seconde moitié du IVe siècle, et quand les Goths d’Alaric envahirent la Grèce en 395–396, ils prirent Corinthe sans combat."
