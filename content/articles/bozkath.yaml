body:
  en:
    - "Bozkath was a town of Judah in the Shephelah, the low hill country between the Judaean mountains and the coastal plain, and almost nothing is known of it. Joshua lists it in the district of Lachish: “Lachish, and Bozkath, and Eglon”. Its one moment in history comes much later: when Josiah became king at eight years old, “his mother’s name was Jedidah, the daughter of Adaiah of Boscath”. So the mother of Judah's great reforming king came from this small country town."
    - "The site is unknown; no ancient writer locates it and no village kept the name. Its place in the Lachish list puts it somewhere near Lachish and Eglon, and the map follows the proposal of ad-Dawayima, a former Arab village on the edge of the hills about 7 km east of Lachish, depopulated in 1948. That is a guess by position: the site has not been excavated with Bozkath in view, and other ruins in the same district would serve as well."
  ru:
    - "Воцкаф — город Иуды в Шефеле, низких холмах между Иудейскими горами и приморской равниной, и о нём не известно почти ничего. Книга Иисуса Навина называет его в округе Лахиса: «Лахис, Воцкаф и Еглон». Единственный его миг в истории наступает гораздо позже: когда восьмилетний Иосия воцарился, «имя матери его Иедида, дочь Адаии, из Боцкафы». Так мать великого царя-преобразователя Иудеи происходила из этого небольшого сельского городка."
    - "Место неизвестно: ни один древний писатель его не указывает, и ни одно селение не сохранило имени. Место в списке Лахиса ставит его где-то близ Лахиса и Еглона, и карта следует предположению об эд-Давайме, бывшей арабской деревне на краю холмов примерно в 7 км к востоку от Лахиса, опустевшей в 1948 году. Это догадка по положению: там не копали ради Воцкафа, и другие развалины того же округа подошли бы не хуже."
  uk:
    - "Боцкат був містом Юди в Шефелі, низькому пагорбовому краї між юдейськими горами та прибережною рівниною, і про нього майже нічого не відомо. Ісус Навин згадує його в окрузі Лахіша: «Лахис, Воцкат і Еглон». Єдина його мить в історії настає значно пізніше: коли Йосія зацарював у вісім років, «матїр його звали Едида Адаївна, з Бозкафи». Отже, мати великого юдейського царя-реформатора походила з цього малого провінційного містечка."
    - "Місце невідоме; жоден давній автор його не локалізує, і жодне село не зберегло назви. Його місце у списку Лахіша ставить його десь неподалік від Лахіша та Еглона, і мапа йде за пропозицією ад-Давайіма, колишнього арабського села на краю пагорбів приблизно за 7 км на схід від Лахіша, знелюдненого в 1948 р. Це припущення за розташуванням: місце не розкопували з думкою про Боцкат, і з тим самим успіхом могли б підійти інші руїни того ж округу."
  es:
    - "Boscat era una ciudad de Judá en la Sefelá, la región de colinas bajas entre la montaña de Judea y la llanura costera, y casi nada se sabe de ella. Josué la enumera en el distrito de Laquis: «Lachîs, y Boscath, y Eglón». Su único momento en la historia llega mucho después: cuando Josías comenzó a reinar a los ocho años, «el nombre de su madre fué Idida hija de Adaía de Boscath». Así, la madre del gran rey reformador de Judá procedía de esta pequeña población rural."
    - "Se desconoce su emplazamiento; ningún escritor antiguo la sitúa y ninguna aldea conservó el nombre. Su lugar en la lista de Laquis la coloca en algún punto cercano a Laquis y Eglón, y el mapa sigue la propuesta de ad-Dawayima, una antigua aldea árabe en el borde de las colinas, a unos 7 km al este de Laquis, despoblada en 1948. Es una conjetura basada en la posición: el sitio no ha sido excavado con vistas a Boscat, y otras ruinas del mismo distrito servirían igual de bien."
  pt:
    - "Bozcate era uma cidade de Judá na Sefelá, a região de colinas baixas entre as montanhas de Judá e a planície costeira, e dela quase nada se sabe. Josué a lista no distrito de Laquis: “Laquis, Bozcate, Eglom”. Seu único momento na história vem muito depois: quando Josias se tornou rei, aos oito anos: “O nome de sua mãe era Jedida, filha de Adaías, de Bozcate”. Assim, a mãe do grande rei reformador de Judá veio desta pequena cidade do campo."
    - "O local é desconhecido; nenhum escritor antigo o situa, e nenhuma aldeia guardou o nome. Seu lugar na lista de Laquis o põe em algum ponto perto de Laquis e Eglom, e o mapa segue a proposta de ad-Dawayima, antiga aldeia árabe à beira das colinas, cerca de 7 km a leste de Laquis, despovoada em 1948. É um palpite por posição: o local não foi escavado tendo Bozcate em vista, e outras ruínas do mesmo distrito serviriam igualmente."
  de:
    - "Bozkat war eine Stadt Judas in der Schefela, dem niedrigen Hügelland zwischen dem judäischen Bergland und der Küstenebene, und fast nichts ist über sie bekannt. Josua führt sie im Bezirk von Lachisch auf: „Lachis, Bozkath, Eglon“. Ihr einziger Auftritt in der Geschichte kommt viel später. Josia wurde mit acht Jahren König: „Seine Mutter hieß Jedida, eine Tochter Adajas, von Bozkath.“ Die Mutter des großen Reformkönigs Judas stammte also aus dieser kleinen Landstadt."
    - "Der Ort ist unbekannt; kein antiker Schriftsteller verortet ihn, und kein Dorf hat den Namen bewahrt. Seine Stellung in der Liste von Lachisch weist ihn in die Nähe von Lachisch und Eglon, und die Karte folgt dem Vorschlag ad-Dawayima, einem ehemaligen arabischen Dorf am Rand des Berglandes etwa 7 km östlich von Lachisch, das 1948 entvölkert wurde. Das ist eine Vermutung nach der Lage: Der Ort ist nicht im Hinblick auf Bozkat ausgegraben worden, und andere Ruinen im selben Bezirk kämen ebenso in Frage."
  fr:
    - "Botskath était une ville de Juda dans la Shéphéla, le bas pays de collines entre les monts de Judée et la plaine côtière, et on n’en sait presque rien. Josué la range dans le district de Lakis : « Lakis, Botskath, Églon ». Son seul moment dans l’histoire est bien plus tardif : lorsque Josias devint roi à huit ans, « sa mère s’appelait Jedida, fille d’Adaja, de Botskath ». La mère du grand roi réformateur de Juda venait donc de cette petite ville de campagne."
    - "L’emplacement est inconnu ; aucun auteur antique ne le situe et aucun village n’a gardé le nom. Sa place dans la liste de Lakis la met quelque part près de Lakis et d’Églon, et la carte suit la proposition d’ad-Dawayima, ancien village arabe en bordure des collines, à environ 7 km à l’est de Lakis, dépeuplé en 1948. C’est une conjecture de position : le site n’a pas été fouillé en vue de Botskath, et d’autres ruines du même district conviendraient aussi bien."
  it:
    - "Boscat era una città di Giuda nella Sefela, la bassa regione collinare tra i monti della Giudea e la pianura costiera, e di essa non si sa quasi nulla. Giosuè la elenca nel distretto di Lachis: «Lakis, Botskath, Eglon». Il suo unico momento storico viene molto più tardi: quando Giosia diventò re a otto anni, «sua madre si chiamava Jedida, figliuola d’Adaia, da Botskath». Così la madre del grande re riformatore di Giuda veniva da questa piccola città di campagna."
    - "Il sito è ignoto; nessuno scrittore antico lo colloca e nessun villaggio ne ha serbato il nome. La sua posizione nell’elenco di Lachis lo pone nei dintorni di Lachis e di Eglon, e la mappa segue la proposta di ad-Dawayima, un ex villaggio arabo al margine delle colline, a circa 7 km a est di Lachis, spopolato nel 1948. È un’ipotesi basata sulla posizione: il sito non è stato scavato in funzione di Boscat, e altre rovine dello stesso distretto andrebbero altrettanto bene."
  pl:
    - "Boskat było miastem w Judzie w Szefeli, niskim kraju wzgórz między górami judzkimi a równiną nadmorską, i prawie nic o nim nie wiadomo. Jozue wymienia je w okręgu Lakisz: „Lachys, i Bassekat, i Eglon”. Jedyny jego moment w dziejach przypada dużo później: gdy Jozjasz został królem w wieku ośmiu lat, „a imię matki jego było Jedyda, córka Adaja z Besekatu”. Tak więc matka wielkiego judzkiego króla-reformatora pochodziła z tego małego miasteczka na prowincji."
    - "Położenie jest nieznane; żaden pisarz starożytny go nie wskazuje i żadna wieś nie zachowała nazwy. Jego miejsce na liście Lakisz umieszcza je gdzieś w pobliżu Lakisz i Eglon, a mapa idzie za propozycją ad-Dawajima, dawnej arabskiej wsi na skraju wzgórz, około 7 km na wschód od Lakisz, wyludnionej w 1948 r. Jest to domysł oparty na położeniu: stanowiska nie badano wykopaliskami z myślą o Boskat, a równie dobrze mogłyby posłużyć inne ruiny w tym samym okręgu."
  nl:
    - "Bozkat was een stad in Juda in de Sefela, het lage heuvelland tussen het bergland van Juda en de kustvlakte, en er is bijna niets over bekend. Jozua noemt de stad in het district van Lachis: “Lachis, en Bozkath, en Eglon”. Haar enige moment in de geschiedenis komt veel later: toen Josia op achtjarige leeftijd koning werd: “En de naam zijner moeder was Jedida, een dochter van Adaja, van Bozkath.” De moeder van Juda's grote hervormingskoning kwam dus uit dit kleine plattelandsstadje."
    - "De plaats is onbekend; geen antieke schrijver situeert haar en geen dorp heeft de naam bewaard. Haar plaats in de lijst van Lachis brengt haar ergens in de buurt van Lachis en Eglon, en de kaart volgt het voorstel ad-Dawayima, een voormalig Arabisch dorp aan de rand van het heuvelland, ongeveer 7 km ten oosten van Lachis, ontvolkt in 1948. Dat is een gissing op grond van de ligging: de plaats is niet opgegraven met het oog op Bozkat, en andere ruïnes in hetzelfde district zouden even goed passen."
  cs:
    - "Bockat byl město v Judsku v Šefele, nízké pahorkatině mezi judskými horami a pobřežní rovinou, a téměř nic se o něm neví. Jozue jej uvádí v okrese Lachiše: „Lachis, Baskat a Eglon“. Jeho jediná chvíle v dějinách přichází mnohem později: Jošijáš se stal králem v osmi letech a o jeho matce se praví: „Jméno matky jeho bylo Jedida, dcera Adaiášova z Baskat.“ Matka velkého judského reformátorského krále tedy pocházela z tohoto malého venkovského města."
    - "Poloha je neznámá; žádný antický autor ji nelokalizuje a žádná vesnice si jméno neuchovala. Jeho místo v seznamu lachišského okresu ho klade někam poblíž Lachiše a Eglonu a mapa následuje návrh ad-Dawayimy, bývalé arabské vesnice na okraji pahorků asi 7 km východně od Lachiše, vylidněné roku 1948. To je odhad podle polohy: lokalita nebyla vykopávána s ohledem na Bockat a stejně dobře by posloužily i jiné zříceniny téhož okresu."
  sv:
    - "Boskat var en stad i Juda i Shefela, det låga bergslandet mellan Judeens berg och kustslätten, och nästan ingenting är känt om den. Josua för upp den i Lakish-distriktet: ”Lakis, Boskat, Eglon”. Dess enda ögonblick i historien kommer långt senare: när Josia blev kung vid åtta års ålder, ”hans moder hette Jedida, Adajas dotter, från Boskat”. Alltså kom modern till Judas store reformkung från denna lilla landsortsstad."
    - "Platsen är okänd; ingen antik författare förlägger den, och ingen by har bevarat namnet. Dess plats i Lakish-förteckningen för den någonstans nära Lakish och Eglon, och kartan följer förslaget ad-Dawayima, en tidigare arabisk by i bergens utkant omkring 7 km öster om Lakish, som avfolkades 1948. Det är en gissning utifrån läget: platsen har inte grävts ut med Boskat i sikte, och andra ruiner i samma distrikt skulle passa lika bra."
  nb:
    - "Boskat var en by i Juda i Sjefela, det lave åslandet mellom Judafjellene og kystsletten, og nesten ingenting er kjent om den. Josva fører den opp i Lakisj-distriktet: «Lakis og Boskat og Eglon». Dens eneste øyeblikk i historien kommer mye senere: da Josjia ble konge som åtteåring, «hans mor hette Jedida; hun var datter av Adaja og var fra Boskat». Moren til Judas store reformkonge kom altså fra denne lille landsbyen."
    - "Stedet er ukjent; ingen gammel forfatter plasserer det, og ingen landsby har bevart navnet. Plassen i Lakisj-listen setter den et sted nær Lakisj og Eglon, og kartet følger forslaget ad-Dawayima, en tidligere arabisk landsby i kanten av åsene omtrent 7 km øst for Lakisj, avfolket i 1948. Det er en gjetning ut fra beliggenhet: stedet er ikke gravd ut med Boskat for øye, og andre ruiner i samme distrikt ville passe like godt."
  tl:
    - "Ang Boscat ay isang bayan ng Juda sa Sephela, ang mababang maburol na lupain sa pagitan ng mga bundok ng Judea at ng kapatagang baybayin, at halos wala nang nalalaman tungkol dito. Itinatala ito ni Josue sa distrito ng Lachis: “Lachis, at Boscat, at Eglon”. Ang tanging sandali nito sa kasaysayan ay higit na huli: nang maging hari si Josias sa walong taong gulang, “ang pangalan ng kaniyang ina ay Idida na anak ni Adaia na taga Boscat”. Kaya ang ina ng dakilang haring repormador ng Juda ay mula sa maliit na bayang ito sa lalawigan."
    - "Hindi alam ang pook; walang sinaunang manunulat na naglalagay rito at walang nayong nagpanatili ng pangalan. Inilalagay ito ng posisyon nito sa talaan ng Lachis sa isang lugar malapit sa Lachis at Eglon, at sinusunod ng mapa ang mungkahing ad-Dawayima, dating nayong Arabe sa gilid ng mga burol mga 7 km sa silangan ng Lachis, na nawalan ng tao noong 1948. Hula ito ayon sa posisyon: hindi pa nahuhukay ang pook na may Boscat sa isip, at ang ibang guho sa gayunding distrito ay maaaring ito rin."
  da:
    - "Boskat var en by i Juda i Sjefela, det lave bakkeland mellem Judas bjerge og kystsletten, og næsten intet vides om den. Josva opregner den i Lakisj-distriktet: »Lakis og Boskath og Eglon«. Dets eneste øjeblik i historien kommer meget senere: Da Josias blev konge som otteårig, hedder det: »hans Moders Navn var Jedida, Adajas Datter fra Bozkath«. Så moderen til Judas store reformkonge kom fra denne lille provinsby."
    - "Stedet er ukendt; ingen antik forfatter placerer det, og ingen landsby bevarede navnet. Dets plads i Lakisj-listen sætter det et sted i nærheden af Lakisj og Eglon, og kortet følger forslaget ad-Dawayima, en tidligere arabisk landsby i udkanten af bjergene cirka 7 km øst for Lakisj, affolket i 1948. Det er et gæt ud fra beliggenhed: Stedet er ikke udgravet med Boskat for øje, og andre ruiner i samme distrikt ville egne sig lige så godt."
  sr:
    - "Васкат је био град у Јуди у Сефели, ниском брдовитом крају између јудејских планина и приобалне равнице, о коме се готово ништа не зна. Исус Навин га наводи у округу Лахиса: „Лахис и Васкат и Јеглон“. Његов једини тренутак у историји долази много касније: када је Јосија постао цар са осам година, „матери му беше име Једида, кћи Адајева, из Воската“. Тако је мајка великог јудејског реформатора потицала из овог малог сеоског града."
    - "Место је непознато; ниједан стари писац га не одређује и ниједно село није сачувало име. Његово место у списку Лахиса смешта га негде близу Лахиса и Јеглона, а карта следи предлог ед Давајиме, некадашњег арапског села на рубу брда око 7 км источно од Лахиса, опустелог 1948. То је претпоставка на основу положаја: налазиште није ископавано имајући у виду Васкат, а и друге рушевине у истом крају подједнако би одговарале."
