body:
  en:
    - "Akrabbim, “scorpions”, is a landmark on the southern edge of the Promised Land, always met as an ascent: Numbers draws the border “from the south to the ascent of Akrabbim, and pass on to Zin”, Joshua repeats the line for Judah's border as Maaleh-acrabbim, and Judges sets “the coast of the Amorites” from “the going up to Akrabbim, from the rock, and upward”. Nothing happens there in the Bible; it is a point on a boundary, named between the end of the Dead Sea and Kadesh-barnea."
    - "Most scholars place it at the pass the map puts first, Ma’ale Akrabbim, where a track climbs in steep bends from the Arabah and the Zin valley onto the Negev highlands south-west of the Dead Sea. A Roman road with switchbacks still climbs here, and Israel paved a modern road through the pass in 1950. The second candidate, Jebel Umm al-Aqarib, “mother of scorpions”, is a minority guess resting on the name. The Akrabattene where Judas Maccabeus fought the Idumaeans (1 Maccabees 5:3) is usually linked to this district, though the link is not certain."
    - "Beyond its place in the border lists, little can be said: no town stood at the ascent, and no excavation names it. Today the pass lies inside Israel's Negev, a scenic but dangerous road above the Zin valley."
  ru:
    - "Акравим, «скорпионы», — ориентир на южном краю Земли обетованной, и всегда это подъём: в книге Чисел граница идёт «на юг к возвышенности Акравима и пойдет через Син», Иисус Навин повторяет ту же линию для границы Иуды — «к возвышенности Акраввимской», а в книге Судей «пределы Аморреев» начинаются «от возвышенности Акравим и от Селы». В Библии там ничего не происходит: это точка на границе между концом Мёртвого моря и Кадес-Варни."
    - "Большинство учёных помещают его у перевала, который на карте стоит первым, — Маале-Акрабим, где дорога крутыми петлями поднимается из Аравы и долины Цин на нагорье Негева к юго-западу от Мёртвого моря. Здесь до сих пор видна римская дорога с серпантином, а в 1950 году Израиль проложил через перевал асфальтовую дорогу. Второе место, Джебель-Умм-аль-Акариб, «мать скорпионов», — догадка меньшинства, опирающаяся на имя. Акрабаттину, где Иуда Маккавей бился с идумеями (1 Макк. 5:3), обычно связывают с этой округой, хотя связь не бесспорна."
    - "Кроме места в списках границ, сказать почти нечего: города у подъёма не было, и никакие раскопки его не называют. Сегодня перевал лежит в израильском Негеве — живописная, но опасная дорога над долиной Цин."
  uk:
    - "Акравім, «скорпіони», — орієнтир на південному краї Обітованої землі, який завжди трапляється як підйом: Числа проводять кордон так, що «гряниця на полуднє від узгіря Акробимського і перейде в Зин», Ісус Навин повторює лінію для кордону Юди як Маале-Акравім («Скорпіонів прохід»), а Книга Суддів починає «займище Аморіїв від Скорпийонового проходу далеко в гори». У Біблії там нічого не відбувається; це точка на межі, названа між кінцем Мертвого моря і Кадесом."
    - "Більшість учених розміщують його на перевалі, який мапа ставить першим, — Маале-Акравім, де стежка крутими вигинами здіймається від Арави та долини Сін на нагір'я Негеву на південний захід від Мертвого моря. Римська дорога із серпантином і досі йде тут угору, а Ізраїль прокладав через перевал сучасну дорогу в 1950 році. Другий кандидат, Джебель-Умм-аль-Акариб, «мати скорпіонів», — гіпотеза меншості, що спирається на назву. Акраваттену, де Юда Маккавей воював з ідумеями (1 Мак. 5:3), зазвичай пов'язують із цим округом, хоч зв'язок не певний."
    - "Окрім свого місця в прикордонних переліках, про нього мало що можна сказати: на підйомі не стояло міста, і жодні розкопки його не називають. Нині перевал лежить у Негеві в межах Ізраїлю — мальовнича, але небезпечна дорога над долиною Сін."
  es:
    - "Acrabim, «escorpiones», es un mojón en el límite meridional de la Tierra Prometida, que se encuentra siempre como una cuesta: Números traza la frontera «desde el mediodía hasta la subida de Acrabbim, y pasará hasta Zin», Josué repite la línea para la frontera de Judá como Maaleh-acrabbim, y Jueces sitúa «el término del Amorrheo» desde «la subida de Acrabim, desde la piedra, y arriba». Nada ocurre allí en la Biblia; es un punto de una frontera, nombrado entre el extremo del mar Muerto y Cades-barnea."
    - "La mayoría de los estudiosos la sitúan en el paso que el mapa pone primero, Ma'ale Akrabbim, donde una senda sube en empinadas curvas desde el Arabá y el valle de Zin hasta las tierras altas del Néguev, al sudoeste del mar Muerto. Una calzada romana con zigzags sigue subiendo por aquí, e Israel pavimentó una carretera moderna por el paso en 1950. El segundo candidato, Jebel Umm al-Aqarib, «madre de escorpiones», es una conjetura minoritaria que se apoya en el nombre. La Acrabatene donde Judas Macabeo combatió a los idumeos (1 Macabeos 5:3) suele relacionarse con esta comarca, aunque el vínculo no es seguro."
    - "Más allá de su lugar en las listas de fronteras, poco puede decirse: ninguna ciudad se alzaba en la cuesta, y ninguna excavación la nombra. Hoy el paso se halla dentro del Néguev de Israel, una carretera pintoresca pero peligrosa sobre el valle de Zin."
  pt:
    - "Acrabim, “escorpiões”, é um marco no limite meridional da Terra Prometida, encontrado sempre como uma subida: Números traça a fronteira “ao sul da subida de Acrabim, e passará até Zim”, Josué repete a linha para a fronteira de Judá como Maaleh-Acrabim, e Juízes situa a fronteira dos amorreus “desde a subida de Acrabim, desde a rocha, e para cima”. Nada acontece ali na Bíblia; é um ponto numa fronteira, nomeado entre o fim do mar Morto e Cades-Barneia."
    - "A maioria dos estudiosos a situa na passagem que o mapa põe em primeiro lugar, Maale Acrabim, onde uma trilha sobe em curvas íngremes da Arabá e do vale de Zim até as terras altas do Neguev, a sudoeste do mar Morto. Uma estrada romana com ziguezagues ainda sobe ali, e Israel pavimentou uma estrada moderna pela passagem em 1950. O segundo candidato, Jebel Umm al-Aqarib, “mãe dos escorpiões”, é uma conjetura minoritária apoiada no nome. A Acrabatena onde Judas Macabeu combateu os idumeus (1 Macabeus 5:3) costuma ser ligada a este distrito, embora a ligação não seja certa."
    - "Além do seu lugar nas listas de fronteira, pouco se pode dizer: nenhuma cidade se erguia na subida, e nenhuma escavação a nomeia. Hoje a passagem fica dentro do Neguev de Israel, uma estrada pitoresca, mas perigosa, acima do vale de Zim."
  de:
    - "Akrabbim, „Skorpione“, ist ein Orientierungspunkt am Südrand des Verheißenen Landes, immer als Anstieg begegnend: Im Vierten Buch Mose verläuft die Grenze „mittagwärts von der Steige Akrabbim“ und „durch Zin“, Josua wiederholt die Linie für Judas Grenze als Steige Akrabbim, und das Richterbuch setzt „die Grenze der Amoriter“ dorthin, „da man nach Akrabbim hinaufgeht, von dem Fels an und weiter hinauf“. In der Bibel geschieht dort nichts; es ist ein Punkt an einer Grenze, genannt zwischen dem Ende des Toten Meeres und Kadesch-Barnea."
    - "Die meisten Gelehrten setzen ihn an den Pass, den die Karte zuerst nennt, Ma’ale Akrabbim, wo ein Pfad in steilen Kehren aus der Araba und dem Zintal auf das Negev-Hochland südwestlich des Toten Meeres steigt. Eine römische Straße mit Serpentinen führt hier noch immer hinauf, und Israel baute 1950 eine moderne Straße durch den Pass. Der zweite Kandidat, Dschebel Umm al-Aqarib, „Mutter der Skorpione“, ist eine Minderheitsvermutung, die sich auf den Namen stützt. Die Akrabattene, wo Judas Makkabäus gegen die Idumäer kämpfte (1. Makkabäer 5,3), bringt man gewöhnlich mit dieser Gegend in Verbindung, doch ist der Zusammenhang nicht sicher."
    - "Über seine Stellung in den Grenzlisten hinaus lässt sich wenig sagen: Keine Stadt stand am Anstieg, und keine Grabung nennt ihn. Heute liegt der Pass im israelischen Negev, eine landschaftlich schöne, aber gefährliche Straße über dem Zintal."
  fr:
    - "Akrabbim, « scorpions », est un repère de la lisière sud de la Terre promise, toujours rencontré comme une montée : les Nombres tracent la frontière « au sud de la montée d’Akrabbim, passera par Tsin », Josué reprend la ligne pour la frontière de Juda sous le nom de Maaleh-Akrabbim, et les Juges font commencer « le territoire des Amoréens » « depuis la montée d’Akrabbim, depuis Séla, et en dessus ». Rien ne s’y passe dans la Bible ; c’est un point d’une frontière, nommé entre l’extrémité de la mer Morte et Kadès-Barnéa."
    - "La plupart des savants la placent au col que la carte met en premier, Ma’ale Akrabbim, où une piste gravit en lacets raides, depuis l’Araba et la vallée de Tsin, les hauteurs du Négev au sud-ouest de la mer Morte. Une route romaine à lacets monte encore ici, et Israël a tracé une route moderne dans le col en 1950. Le second candidat, Jebel Umm al-Aqarib, « mère des scorpions », est une hypothèse minoritaire fondée sur le nom. L’Akrabattène où Judas Maccabée combattit les Iduméens (1 Maccabées 5, 3) est d’ordinaire rattachée à cette région, sans certitude."
    - "Au-delà de sa place dans les listes de frontières, on ne peut guère en dire plus : aucune ville ne s’élevait à la montée, et aucune fouille ne la nomme. Le col se trouve aujourd’hui dans le Négev israélien, route pittoresque mais dangereuse au-dessus de la vallée de Tsin."
  it:
    - "Akrabbim, «scorpioni», è un punto di riferimento sul margine meridionale della Terra promessa, incontrato sempre come una salita: i Numeri tracciano il confine «al sud della salita di Akrabbim, passerà per Tsin», Giosuè ripete la linea per il confine di Giuda come Maaleh-Akrabbim, e i Giudici fissano «il confine degli Amorei» come esteso «dalla salita di Akrabbim, movendo da Sela, e su verso il nord». Nella Bibbia non vi accade nulla; è un punto su un confine, nominato tra l’estremità del Mar Morto e Kades-Barnea."
    - "La maggior parte degli studiosi lo colloca al passo che la carta pone per primo, Ma’ale Akrabbim, dove un sentiero sale in ripide curve dall’Araba e dalla valle di Zin sugli altopiani del Negheb a sud-ovest del Mar Morto. Una strada romana a tornanti sale ancora qui, e Israele vi ha costruito una strada moderna attraverso il passo nel 1950. Il secondo candidato, Jebel Umm al-Aqarib, «madre degli scorpioni», è un’ipotesi minoritaria che poggia sul nome. L’Acrabattene dove Giuda Maccabeo combatté gli Idumei (1 Maccabei 5,3) è di solito collegata a questo distretto, benché il legame non sia certo."
    - "Oltre al suo posto negli elenchi di confini, poco si può dire: nessuna città sorgeva alla salita, e nessuno scavo la nomina. Oggi il passo si trova nel Negheb d’Israele, una strada panoramica ma pericolosa sopra la valle di Zin."
  pl:
    - "Akrabbim, „skorpiony”, to punkt orientacyjny na południowym skraju Ziemi Obiecanej, zawsze występujący jako wzniesienie: Księga Liczb prowadzi granicę „od południa do Maaleakrabim, i pójdzie aż ku puszczy Syn”, Jozue powtarza tę linię dla granicy Judy jako Maale-Akrabbim, a Księga Sędziów opisuje „granicę Amorejczykową” od „góry, gdzie wstępują do niedźwiadków, od skały ich i wyżej”. Nic się tam w Biblii nie dzieje; to punkt na granicy, wymieniony między końcem Morza Martwego a Kadesz-Barnea."
    - "Większość uczonych umieszcza je w przełęczy, którą mapa podaje na pierwszym miejscu, Ma'ale Akrabbim, gdzie ścieżka wspina się stromymi zakrętami z Araby i doliny Sin na wyżynę Negewu na południowy zachód od Morza Martwego. Rzymska droga z serpentynami wciąż tu się wspina, a Izrael wybrukował w 1950 roku nowoczesną drogę przez przełęcz. Drugi kandydat, Dżabal Umm al-Aqarib, „matka skorpionów”, to domysł mniejszości oparty na nazwie. Akrabattene, gdzie Juda Machabeusz walczył z Idumejczykami (1 Mch 5,3), wiąże się zwykle z tą okolicą, choć związek ten nie jest pewny."
    - "Poza miejscem w wykazach granic niewiele można powiedzieć: u wzniesienia nie stało żadne miasto i żadne wykopaliska go nie nazywają. Dziś przełęcz leży w izraelskim Negewie, malownicza, lecz niebezpieczna droga nad doliną Sin."
  nl:
    - "Akrabbim, “schorpioenen”, is een oriëntatiepunt aan de zuidrand van het Beloofde Land, altijd als een helling aangetroffen: Numeri trekt de grens “van het zuiden naar den opgang van Akrabbim, en doorgaan naar Zin”, Jozua herhaalt de lijn voor Juda’s grens als Maaleh-Akrabbim, en Richteren laat “de landpale der Amorieten” lopen “van den opgang van Akrabbim, van den rotssteen, en opwaarts heen”. In de Bijbel gebeurt daar niets; het is een punt op een grens, genoemd tussen het einde van de Dode Zee en Kades-Barnea."
    - "De meeste geleerden plaatsen het bij de pas die de kaart als eerste noemt, Ma’ale Akrabbim, waar een pad in steile bochten uit de Araba en de Zinvallei omhoogklimt naar de Negevhoogvlakte ten zuidwesten van de Dode Zee. Een Romeinse weg met haarspeldbochten klimt hier nog steeds, en Israël legde in 1950 een moderne weg door de pas aan. De tweede kandidaat, Jebel Umm al-Aqarib, “moeder van schorpioenen”, is een minderheidsgissing die op de naam berust. De Akrabattene waar Judas Makkabeüs tegen de Idumeeërs vocht (1 Makkabeeën 5:3) wordt gewoonlijk met dit district verbonden, al is dat verband niet zeker."
    - "Buiten zijn plaats in de grenslijsten valt er weinig te zeggen: aan de helling stond geen stad, en geen opgraving noemt haar. Tegenwoordig ligt de pas binnen de Negev van Israël, een schilderachtige maar gevaarlijke weg boven de Zinvallei."
  cs:
    - "Akrabím, „štíři“, je orientační bod na jižním okraji Zaslíbené země, který se vždy vyskytuje jako výstup: Numeri vedou hranici tak, že „se zatočí to pomezí polední k Maleakrabim, a půjde až k Tsin“, Jozue opakuje tuto čáru pro hranici Judy jako Maalé-akrabím a Soudců klade hranici Amorejských tak, že „Pomezí pak Amorejského bylo od začátku hor Akrabim, od skály jejich i výše“. V Bibli se tam nic neděje; je to bod na hranici, jmenovaný mezi koncem Mrtvého moře a Kádeš-barneou."
    - "Většina badatelů jej klade do průsmyku, který mapa uvádí jako první, Ma’ale Akrabbim, kde stezka stoupá v příkrých zákrutách z Araby a údolí Sín na vysočinu Negevu jihozápadně od Mrtvého moře. Římská silnice se serpentinami tu stoupá dosud a Izrael vedl průsmykem moderní silnici v roce 1950. Druhý kandidát, Jebel Umm al-Aqarib, „matka štírů“, je menšinový dohad opřený o jméno. Akrabattene, kde Juda Makabejský bojoval s Idumejci (1 Mak 5,3), se obvykle spojuje s touto oblastí, ač toto spojení není jisté."
    - "Mimo své místo v seznamech hranic lze říci málo: u výstupu nestálo žádné město a žádné vykopávky jej nejmenují. Dnes průsmyk leží v izraelském Negevu, malebná, ale nebezpečná silnice nad údolím Sín."
