# Overview article (ADR 0007). Mainstream facts only; a minor border landmark known from three verses; the app's two candidates are named without choosing.
id: akrabbim
place: a39267b
title:
  en: "Akrabbim"
  ru: "Акравим"
body:
  en:
    - "Akrabbim, “scorpions”, is a landmark on the southern edge of the Promised Land, always met as an ascent: Numbers draws the border “from the south to the ascent of Akrabbim, and pass on to Zin”, Joshua repeats the line for Judah's border as Maaleh-acrabbim, and Judges sets “the coast of the Amorites” from “the going up to Akrabbim, from the rock, and upward”. Nothing happens there in the Bible; it is a point on a boundary, named between the end of the Dead Sea and Kadesh-barnea."
    - "Most scholars place it at the pass the map puts first, Ma’ale Akrabbim, where a track climbs in steep bends from the Arabah and the Zin valley onto the Negev highlands south-west of the Dead Sea. A Roman road with switchbacks still climbs here, and Israel paved a modern road through the pass in 1950. The second candidate, Jebel Umm al-Aqarib, “mother of scorpions”, is a minority guess resting on the name. The Akrabattene where Judas Maccabeus fought the Idumaeans (1 Maccabees 5:3) is usually linked to this district, though the link is not certain."
    - "Beyond its place in the border lists, little can be said: no town stood at the ascent, and no excavation names it. Today the pass lies inside Israel's Negev, a scenic but dangerous road above the Zin valley."
  ru:
    - "Акравим, «скорпионы», — ориентир на южном краю Земли обетованной, и всегда это подъём: в книге Чисел граница идёт «на юг к возвышенности Акравима и пойдет через Син», Иисус Навин повторяет ту же линию для границы Иуды — «к возвышенности Акраввимской», а в книге Судей «пределы Аморреев» начинаются «от возвышенности Акравим и от Селы». В Библии там ничего не происходит: это точка на границе между концом Мёртвого моря и Кадес-Варни."
    - "Большинство учёных помещают его у перевала, который на карте стоит первым, — Маале-Акрабим, где дорога крутыми петлями поднимается из Аравы и долины Цин на нагорье Негева к юго-западу от Мёртвого моря. Здесь до сих пор видна римская дорога с серпантином, а в 1950 году Израиль проложил через перевал асфальтовую дорогу. Второе место, Джебель-Умм-аль-Акариб, «мать скорпионов», — догадка меньшинства, опирающаяся на имя. Акрабаттину, где Иуда Маккавей бился с идумеями (1 Макк. 5:3), обычно связывают с этой округой, хотя связь не бесспорна."
    - "Кроме места в списках границ, сказать почти нечего: города у подъёма не было, и никакие раскопки его не называют. Сегодня перевал лежит в израильском Негеве — живописная, но опасная дорога над долиной Цин."
scripture:
  - Num.34.4
  - Josh.15.3
  - Judg.1.36
