body:
  en:
    - "Pekod is the Puqudu of Assyrian and Babylonian texts, an Aramaean tribe living in southern Babylonia, east of the lower Tigris toward Elam. Assyrian kings from Tiglath-pileser III to Sennacherib list the Puqudu among the Aramaean peoples they fought or deported, and under the Neo-Babylonian kings they were part of the Chaldean realm. The Hebrew name sounds like the verb “to visit” or “to punish”, and the prophets play on it."
    - "Ezekiel names Pekod with Shoa and Koa among the Babylonian and Chaldean horsemen whom the Lord will bring against faithless Jerusalem. Jeremiah's oracle against Babylon cries, “Go up against the land of Merathaim, even against it, and against the inhabitants of Pekod”, a pun on “double rebellion” and “punishment”; the Synodal Bible translates both words instead of keeping them as names. Beyond these lines and the cuneiform record nothing is known, and no site can be pointed to."
  ru:
    - "Пеход — это Пукуду ассирийских и вавилонских текстов, арамейское племя, жившее в южной Вавилонии, к востоку от нижнего Тигра, в сторону Елама. Ассирийские цари от Феглаффелласара III до Сеннахирима называют Пукуду среди арамейских народов, с которыми воевали или которых переселяли, а при нововавилонских царях они входили в Халдейское царство. Еврейское имя созвучно глаголу «посещать» или «наказывать», и пророки играют на этом."
    - "Иезекииль называет Пеход вместе с Шоа и Коа среди вавилонских и халдейских всадников, которых Господь наведёт на неверный Иерусалим: «сынов Вавилона и всех Халдеев, из Пехода, из Шоа и Коа». Пророчество Иеремии против Вавилона в еврейском тексте играет словами «двойной мятеж» и «наказание» — Мерафаим и Пеход; Синодальный перевод передаёт их не именами, а смыслом: «Иди на нее, на землю возмутительную, и накажи жителей ее». Кроме этих строк и клинописных упоминаний ничего не известно, и указать место нельзя."
  uk:
    - "Пеход — це Пукуду ассирійських і вавилонських текстів, арамейське плем’я, що жило в південному Вавилоні, на схід від нижнього Тигру в напрямку Еламу. Ассирійські царі від Тіглатпаласара III до Сінаххеріба зараховують пукуду до арамейських народів, з якими воювали або яких виселяли, а за нововавилонських царів вони були частиною Халдейського царства. Єврейська назва співзвучна з дієсловом «відвідати» чи «карати», і пророки грають на цьому."
    - "Єзекіїль називає Пеход разом із Шоа та Коа серед вавилонських і халдейських вершників, яких Господь наведе на невірний Єрусалим. Пророцтво Єремії проти Вавилона закликає: «Ійди ж проти неї — проти тієї землї ворохобної, і карай осадників її»; в єврейському тексті це гра слів на Мерафаїм, «подвійне повстання», і Пеход, «покарання», а Куліш перекладає обидва слова замість того, щоб зберігати їх як імена. Окрім цих рядків і клинописних записів, нічого не відомо, і жодного місця вказати не можна."
  es:
    - "Pecod es el Puqudu de los textos asirios y babilonios, una tribu aramea que vivía en el sur de Babilonia, al este del bajo Tigris, hacia Elam. Los reyes asirios desde Tiglat-pileser III hasta Senaquerib enumeran a los Puqudu entre los pueblos arameos que combatieron o deportaron, y bajo los reyes neobabilonios formaron parte del reino caldeo. El nombre hebreo suena como el verbo «visitar» o «castigar», y los profetas juegan con él."
    - "Ezequiel nombra a Pecod con Soa y Coa entre los jinetes babilonios y caldeos que el Señor traerá contra la infiel Jerusalén. El oráculo de Jeremías contra Babilonia clama: «Sube contra la tierra de Merathaim, contra ella, y contra los moradores de Pekod», un juego de palabras con «doble rebelión» y «castigo»; la Biblia sinodal traduce ambas palabras en lugar de conservarlas como nombres. Fuera de estas líneas y del registro cuneiforme no se sabe nada, y no puede señalarse ningún lugar."
  pt:
    - "Pecode é o Puqudu dos textos assírios e babilônicos, uma tribo aramaica que vivia no sul da Babilônia, a leste do baixo Tigre, em direção a Elão. Reis assírios, de Tiglate-Pileser III a Senaqueribe, listam os Puqudu entre os povos arameus que combateram ou deportaram, e sob os reis neobabilônicos eles faziam parte do reino caldeu. O nome hebraico soa como o verbo “visitar” ou “punir”, e os profetas jogam com ele."
    - "Ezequiel nomeia Pecode com Soa e Coa entre os cavaleiros babilônios e caldeus que o Senhor trará contra a infiel Jerusalém. O oráculo de Jeremias contra a Babilônia clama: “Subam contra a terra de Merataim, sim, contra ela, e contra os habitantes de Pecode”, um jogo com “dupla rebelião” e “castigo”; a Bíblia Sinodal traduz as duas palavras em vez de conservá-las como nomes. Além desses versos e do registro cuneiforme nada se sabe, e nenhum local pode ser apontado."
  de:
    - "Pekod ist das Puqudu der assyrischen und babylonischen Texte, ein aramäischer Stamm im südlichen Babylonien, östlich des unteren Tigris in Richtung Elam. Assyrische Könige von Tiglat-Pileser III. bis Sanherib führen die Puqudu unter den aramäischen Völkern auf, die sie bekämpften oder deportierten, und unter den neubabylonischen Königen gehörten sie zum chaldäischen Reich. Der hebräische Name klingt wie das Verb „heimsuchen“ oder „strafen“, und die Propheten spielen darauf an."
    - "Hesekiel nennt Pekod mit Schoa und Koa unter den babylonischen und chaldäischen Reitern, die der Herr gegen das treulose Jerusalem führen wird. Jeremias Spruch gegen Babylon ruft: „Zieh hinauf wider das Land, das alles verbittert hat; zieh hinauf wider die Einwohner der Heimsuchung“, ein Wortspiel mit „doppelter Auflehnung“ und „Strafe“; die Lutherbibel übersetzt beide Wörter, statt sie als Namen zu belassen. Außer diesen Zeilen und den Keilschrifttexten ist nichts bekannt, und keine Stätte lässt sich nennen."
  fr:
    - "Pekod est le Puqudu des textes assyriens et babyloniens, une tribu araméenne vivant dans le sud de la Babylonie, à l’est du bas Tigre vers l’Élam. Les rois assyriens, de Tiglath-Piléser III à Sanchérib, énumèrent les Puqudu parmi les peuples araméens qu’ils combattirent ou déportèrent, et sous les rois néo-babyloniens ils faisaient partie du royaume chaldéen. Le nom hébreu ressemble au verbe « visiter » ou « punir », et les prophètes jouent sur ce sens."
    - "Ézéchiel nomme Pekod avec Schoa et Koa parmi les cavaliers babyloniens et chaldéens que le Seigneur amènera contre Jérusalem l’infidèle. L’oracle de Jérémie contre Babylone s’écrie : « Monte contre le pays doublement rebelle, contre ses habitants, et châtie-les ! », jeu de mots sur Mérathaïm, « double rébellion », et Pekod, « châtiment » ; la Bible synodale russe traduit les deux mots au lieu de les garder comme noms (Louis Segond aussi). En dehors de ces lignes et des textes cunéiformes, on ne sait rien, et aucun site ne peut être indiqué."
  it:
    - "Pekod è il Puqudu dei testi assiri e babilonesi, una tribù aramea che viveva nella Babilonia meridionale, a est del basso Tigri verso l’Elam. I re assiri da Tiglat-Pilèser III a Sennacherib elencano i Puqudu tra i popoli aramei che combatterono o deportarono, e sotto i re neobabilonesi facevano parte del regno caldeo. Il nome ebraico suona come il verbo «visitare» o «punire», e i profeti vi giocano."
    - "Ezechiele nomina Pekod con Soa e Coa tra i cavalieri babilonesi e caldei che il Signore farà venire contro la Gerusalemme infedele. L’oracolo di Geremia contro Babilonia grida: «Sali contro il paese di Merathaim e contro gli abitanti di Pekod», un gioco di parole su «doppia ribellione» e «castigo»; la Bibbia sinodale traduce entrambe le parole invece di conservarle come nomi. Oltre a questi versetti e alla documentazione cuneiforme non si sa nulla, e non si può indicare alcun sito."
  pl:
    - "Pekod to Puqudu tekstów asyryjskich i babilońskich, plemię aramejskie zamieszkujące południową Babilonię, na wschód od dolnego Tygrysu w stronę Elamu. Królowie asyryjscy od Tiglat-Pilesera III do Sennacheryba wymieniają Puqudu wśród ludów aramejskich, z którymi walczyli lub które deportowali, a za królów nowobabilońskich byli częścią państwa chaldejskiego. Hebrajska nazwa brzmi jak czasownik „nawiedzać” albo „karać”, i prorocy grają na tym słowami."
    - "Ezechiel wymienia Pekod wraz z Szoa i Koa wśród babilońskich i chaldejskich jeźdźców, których Pan sprowadzi na niewierną Jerozolimę. Wyrocznia Jeremiasza przeciw Babilonowi woła: „Wyciągnij przeciwko tej ziemi odpornych, przeciwko niej, mówię, a obywateli jej nawiedź” (w hebrajskim Meratajim i Pekod), co jest grą słów na „podwójny bunt” i „karę”; Biblia synodalna tłumaczy oba słowa zamiast zachowywać je jako nazwy. Poza tymi wierszami i zapisem klinowym nic nie wiadomo i nie można wskazać żadnego miejsca."
  cs:
    - "Pekód je Puqudu asyrských a babylónských textů, aramejský kmen žijící v jižní Babylonii, východně od dolního Tigridu směrem k Élamu. Asyrští králové od Tiglatpilesara III. po Senacheriba uvádějí Puqudu mezi aramejskými národy, s nimiž bojovali nebo které deportovali, a za novobabylónských králů byli součástí chaldejské říše. Hebrejské jméno zní jako sloveso „navštívit“ či „potrestat“ a proroci si s ním hrají."
    - "Ezechiel jmenuje Pekód spolu se Šóou a Kóou mezi babylónskými a chaldejskými jezdci, které Hospodin přivede na nevěrný Jeruzalém. Jeremjášova věštba proti Babylónu volá: „Proti té zemi zpurných táhni, a proti obyvatelům pomsty“, hříčka s „dvojí vzpourou“ a „trestem“; synodální Bible překládá obě slova místo toho, aby je ponechala jako jména. Mimo tyto řádky a klínopisné záznamy není nic známo a nelze ukázat žádné místo."
  nl:
    - "Pekod is de Puqudu van Assyrische en Babylonische teksten, een Aramese stam in Zuid-Babylonië, ten oosten van de benedenloop van de Tigris richting Elam. Assyrische koningen van Tiglat-Pileser III tot Sanherib noemen de Puqudu onder de Aramese volken die zij bestreden of deporteerden, en onder de Nieuw-Babylonische koningen maakten zij deel uit van het Chaldeeuwse rijk. De Hebreeuwse naam klinkt als het werkwoord “bezoeken” of “straffen”, en de profeten spelen daarop in."
    - "Ezechiël noemt Pekod met Soa en Koa onder de Babylonische en Chaldeeuwse ruiters die de HEER tegen het trouweloze Jeruzalem zal brengen. Jeremia’s godsspraak tegen Babylon roept: “Tegen het land Merathaim, trek tegen hetzelve op, en tegen de inwoners van Pekod”, een woordspeling op “dubbele opstand” en “straf”; de Synodale Bijbel vertaalt beide woorden in plaats van ze als namen te laten staan. Buiten deze regels en de spijkerschriftbronnen is niets bekend, en geen plaats is aan te wijzen."
