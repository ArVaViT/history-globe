# Overview article (ADR 0007). Mainstream facts only; the Aramaean people Puqudu of southern Babylonia; mainstream facts only; the Synodal rendering of Jer 50:21 is noted.
id: pekod
place: a4b9865
title:
  en: "Pekod"
  ru: "Пеход"
body:
  en:
    - "Pekod is the Puqudu of Assyrian and Babylonian texts, an Aramaean tribe living in southern Babylonia, east of the lower Tigris toward Elam. Assyrian kings from Tiglath-pileser III to Sennacherib list the Puqudu among the Aramaean peoples they fought or deported, and under the Neo-Babylonian kings they were part of the Chaldean realm. The Hebrew name sounds like the verb “to visit” or “to punish”, and the prophets play on it."
    - "Ezekiel names Pekod with Shoa and Koa among the Babylonian and Chaldean horsemen whom the Lord will bring against faithless Jerusalem. Jeremiah's oracle against Babylon cries, “Go up against the land of Merathaim, even against it, and against the inhabitants of Pekod”, a pun on “double rebellion” and “punishment”; the Synodal Bible translates both words instead of keeping them as names. Beyond these lines and the cuneiform record nothing is known, and no site can be pointed to."
  ru:
    - "Пеход — это Пукуду ассирийских и вавилонских текстов, арамейское племя, жившее в южной Вавилонии, к востоку от нижнего Тигра, в сторону Елама. Ассирийские цари от Феглаффелласара III до Сеннахирима называют Пукуду среди арамейских народов, с которыми воевали или которых переселяли, а при нововавилонских царях они входили в Халдейское царство. Еврейское имя созвучно глаголу «посещать» или «наказывать», и пророки играют на этом."
    - "Иезекииль называет Пеход вместе с Шоа и Коа среди вавилонских и халдейских всадников, которых Господь наведёт на неверный Иерусалим: «сынов Вавилона и всех Халдеев, из Пехода, из Шоа и Коа». Пророчество Иеремии против Вавилона в еврейском тексте играет словами «двойной мятеж» и «наказание» — Мерафаим и Пеход; Синодальный перевод передаёт их не именами, а смыслом: «Иди на нее, на землю возмутительную, и накажи жителей ее». Кроме этих строк и клинописных упоминаний ничего не известно, и указать место нельзя."
scripture:
  - Jer.50.21
  - Ezek.23.23
sources:
