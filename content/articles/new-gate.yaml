# Overview article (ADR 0007). Mainstream facts only; a temple gate known from two verses in Jeremiah; the link with Jotham's upper gate is given as a common view, not as fact.
id: new-gate
place: aa85961
title:
  en: "New Gate"
  ru: "Новые ворота"
body:
  en:
    - "The New Gate was a gate of the temple in Jerusalem in the last years of the kingdom of Judah. Jeremiah mentions it twice. When the priests and prophets seized Jeremiah for foretelling the temple's ruin, “the princes of Judah … came up from the king's house unto the house of the LORD, and sat down in the entry of the new gate”, and there heard the case and spared him. Some years later Baruch read Jeremiah's scroll aloud “in the chamber of Gemariah the son of Shaphan the scribe, in the higher court, at the entry of the new gate”, before the scroll was taken to King Jehoiakim, who burned it."
    - "The gate led from the palace to the temple's upper court, and it is often taken to be “the higher gate of the house of the LORD” that King Jotham built, new in comparison with the older gates; the Bible does not say so. Nothing of it survives. It has nothing to do with the New Gate in the Ottoman walls of the Old City, opened in 1889."
  ru:
    - "Новые ворота — ворота храма в Иерусалиме в последние годы Иудейского царства. Иеремия упоминает их дважды. Когда священники и пророки схватили Иеремию за пророчество о разрушении храма, «князья Иудейские … пришли из дома царя к дому Господню и сели у входа в новые ворота дома Господня», выслушали дело и пощадили его. Несколько лет спустя Варух прочитал свиток Иеремии «в комнате Гемарии, сына Сафанова, писца, на верхнем дворе, у входа в новые ворота», прежде чем свиток отнесли царю Иоакиму, который его сжёг."
    - "Ворота вели от дворца к верхнему двору храма, и их часто отождествляют с воротами, о которых сказано, что царь Иоафам «построил верхние ворота при доме Господнем», — новыми по сравнению с более старыми; Библия этого не говорит. От них ничего не сохранилось. К Новым воротам в османских стенах Старого города, открытым в 1889 году, они отношения не имеют."
scripture:
  - Jer.26.10
  - Jer.36.10
  - 2Kgs.15.35
sources:
  - "J. Bright, Jeremiah (Anchor Bible, 1965)"
  - "W. L. Holladay, Jeremiah 2 (Hermeneia, 1989)"
  - "L. Ritmeyer, The Quest: Revealing the Temple Mount in Jerusalem (2006)"
