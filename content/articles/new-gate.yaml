body:
  en:
    - "The New Gate was a gate of the temple in Jerusalem in the last years of the kingdom of Judah. Jeremiah mentions it twice. When the priests and prophets seized Jeremiah for foretelling the temple's ruin, “the princes of Judah … came up from the king's house unto the house of the LORD, and sat down in the entry of the new gate”, and there heard the case and spared him. Some years later Baruch read Jeremiah's scroll aloud “in the chamber of Gemariah the son of Shaphan the scribe, in the higher court, at the entry of the new gate”, before the scroll was taken to King Jehoiakim, who burned it."
    - "The gate seems to have led from the palace to the temple's upper court, and it is often taken to be “the higher gate of the house of the LORD” that King Jotham built, new in comparison with the older gates; the Bible does not say so. Nothing of it survives. It has nothing to do with the New Gate in the Ottoman walls of the Old City, opened in 1889."
  ru:
    - "Новые ворота — ворота храма в Иерусалиме в последние годы Иудейского царства. Иеремия упоминает их дважды. Когда священники и пророки схватили Иеремию за пророчество о разрушении храма, «князья Иудейские … пришли из дома царя к дому Господню и сели у входа в новые ворота дома Господня», выслушали дело и пощадили его. Несколько лет спустя Варух прочитал свиток Иеремии «в комнате Гемарии, сына Сафанова, писца, на верхнем дворе, у входа в новые ворота», прежде чем свиток отнесли царю Иоакиму, который его сжёг."
    - "Ворота, по-видимому, вели от дворца к верхнему двору храма, и их часто отождествляют с воротами, о которых сказано, что царь Иоафам «построил верхние ворота при доме Господнем», — новыми по сравнению с более старыми; Библия этого не говорит. От них ничего не сохранилось. К Новым воротам в османских стенах Старого города, открытым в 1889 году, они отношения не имеют."
  uk:
    - "Нові ворота були воротами храму в Єрусалимі в останні роки Юдейського царства. Єремія згадує їх двічі. Коли священики й пророки схопили Єремію за те, що він провіщав руйнування храму, «князї Юдині, поприходили з царської палати до дому Господнього та й посїдали коло ввіходу в нові ворота дому Господнього», і там вислухали справу й помилували його. Кілька років потому Варух читав сувій Єремії вголос «в сьвітлицї писаря Гемарії Сафаненка, на верхньому подвіррі, коло ввіходу в нові ворота в дому Господньому», перш ніж сувій віднесли цареві Йоакимові, який його спалив."
    - "Ворота, здається, вели від палацу до верхнього подвір'я храму, і їх часто вважають тими воротами, про які сказано, що Йотам «збудував верхні ворота при храму Господньому», нові порівняно зі старішими воротами; Біблія цього не стверджує. Від них нічого не збереглося. Вони не мають нічого спільного з Новими воротами в османських мурах Старого міста, відкритими 1889 року."
  es:
    - "La Puerta Nueva era una puerta del templo de Jerusalén en los últimos años del reino de Judá. Jeremías la menciona dos veces. Cuando los sacerdotes y los profetas apresaron a Jeremías por anunciar la ruina del templo, «los príncipes de Judá … subieron de casa del rey á la casa de Jehová; y sentáronse en la entrada de la puerta nueva de Jehová», y allí oyeron el caso y lo libraron. Algunos años después Baruc leyó en voz alta el rollo de Jeremías «en la cámara de Gemarías hijo de Saphán escriba, en el atrio de arriba, á la entrada de la puerta nueva», antes de que el rollo fuera llevado al rey Joacim, que lo quemó."
    - "La puerta parece haber conducido del palacio al atrio superior del templo, y a menudo se la identifica con «la puerta más alta de la casa de Jehová» que construyó el rey Jotam, nueva en comparación con las puertas más antiguas; la Biblia no lo dice. No queda nada de ella. No tiene relación alguna con la Puerta Nueva de las murallas otomanas de la Ciudad Vieja, abierta en 1889."
  pt:
    - "A Porta Nova era uma porta do templo de Jerusalém nos últimos anos do reino de Judá. Jeremias a menciona duas vezes. Quando os sacerdotes e profetas prenderam Jeremias por predizer a ruína do templo, “os príncipes de Judá … subiram da casa do rei para a casa do SENHOR; e se assentaram à entrada da porta nova da casa do SENHOR”, e ali ouviram o caso e o pouparam. Alguns anos depois, Baruque leu em voz alta o rolo de Jeremias “na sala de Gemarias, filho de Safã, o escriba, no pátio superior, à entrada da porta nova da casa do SENHOR”, antes que o rolo fosse levado ao rei Jeoaquim, que o queimou."
    - "A porta parece ter levado do palácio ao pátio superior do templo, e costuma ser tomada por “a porta superior da casa do SENHOR” que o rei Jotão construiu, nova em comparação com as portas mais antigas; a Bíblia não o diz. Nada dela sobrevive. Não tem relação com a Porta Nova das muralhas otomanas da Cidade Velha, aberta em 1889."
  de:
    - "Das Neue Tor war ein Tor des Tempels in Jerusalem in den letzten Jahren des Königreichs Juda. Jeremia erwähnt es zweimal. Als Priester und Propheten Jeremia ergriffen, weil er den Untergang des Tempels vorausgesagt hatte, „gingen [die Fürsten Juda's] aus des Königs Hause hinauf ins Haus des HERRN und setzten sich vor das neue Tor“, hörten dort den Fall und verschonten ihn. Einige Jahre später las Baruch Jeremias Buchrolle laut vor „in der Kapelle Gemarjas, des Sohnes Saphans, des Kanzlers, im obern Vorhof, vor dem neuen Tor am Hause des HERRN“, ehe die Rolle zu König Jojakim gebracht wurde, der sie verbrannte."
    - "Das Tor scheint vom Palast zum oberen Vorhof des Tempels geführt zu haben, und man hält es oft für „das obere Tor am Hause des HERRN“, das König Jotam baute, neu im Vergleich zu den älteren Toren; die Bibel sagt das nicht. Nichts davon ist erhalten. Es hat nichts mit dem Neuen Tor in der osmanischen Mauer der Altstadt zu tun, das 1889 geöffnet wurde."
  fr:
    - "La Porte Neuve était une porte du temple de Jérusalem dans les dernières années du royaume de Juda. Jérémie la mentionne deux fois. Quand les prêtres et les prophètes se saisirent de Jérémie pour avoir annoncé la ruine du temple, « les chefs de Juda … montèrent de la maison du roi à la maison de l’Éternel, et s’assirent à l’entrée de la porte neuve de la maison de l’Éternel », entendirent là l’affaire et l’épargnèrent. Quelques années plus tard, Baruc lut à haute voix le rouleau de Jérémie « dans la chambre de Guemaria, fils de Schaphan, le secrétaire, dans le parvis supérieur, à l’entrée de la porte neuve », avant que le rouleau soit porté au roi Jojakim, qui le brûla."
    - "La porte semble avoir mené du palais au parvis supérieur du temple, et on y voit souvent « la porte supérieure de la maison de l’Éternel » que bâtit le roi Jotham, neuve par rapport aux portes plus anciennes ; la Bible ne le dit pas. Rien n’en subsiste. Elle n’a rien à voir avec la Porte Neuve des murailles ottomanes de la Vieille Ville, ouverte en 1889."
  it:
    - "La Porta Nuova era una porta del tempio di Gerusalemme negli ultimi anni del regno di Giuda. Geremia la menziona due volte. Quando i sacerdoti e i profeti afferrarono Geremia per aver predetto la rovina del tempio, «i capi di Giuda … salirono dalla casa del re alla casa dell’Eterno, e si sedettero all’ingresso della porta nuova della casa dell’Eterno», e lì ascoltarono il caso e lo risparmiarono. Alcuni anni dopo Baruc lesse ad alta voce il rotolo di Geremia «nella camera di Ghemaria, figliuolo di Shafan, segretario, nel cortile superiore, all’ingresso della porta nuova della casa dell’Eterno», prima che il rotolo fosse portato al re Ioiakim, che lo bruciò."
    - "La porta sembra aver condotto dal palazzo al cortile superiore del tempio, ed è spesso identificata con «la porta superiore della casa dell’Eterno» costruita dal re Iotam, nuova rispetto alle porte più antiche; la Bibbia non lo dice. Di essa non resta nulla. Non ha niente a che vedere con la Porta Nuova nelle mura ottomane della Città Vecchia, aperta nel 1889."
  pl:
    - "Brama Nowa była bramą świątyni jerozolimskiej w ostatnich latach królestwa Judy. Jeremiasz wspomina o niej dwa razy. Gdy kapłani i prorocy pojmali Jeremiasza za zapowiedź zburzenia świątyni, „książęta Judzcy, przyszli z domu królewskiego do domu Pańskiego, i usiedli w wejściu nowej bramy Pańskiej”, i tam wysłuchali sprawy i oszczędzili go. Kilka lat później Baruch czytał na głos zwój Jeremiasza „w pokoju Giemaryjasza, syna Safanowego, pisarza, w sieni wyższej, w wejściu bramy nowej”, zanim zwój zaniesiono królowi Jojakimowi, który go spalił."
    - "Brama prowadziła zapewne z pałacu na górny dziedziniec świątyni i często uważa się ją za „bramę najwyższą domu Pańskiego”, którą zbudował król Jotam, nową w porównaniu ze starszymi bramami; Biblia tego nie mówi. Nic z niej nie przetrwało. Nie ma nic wspólnego z Bramą Nową w osmańskich murach Starego Miasta, otwartą w 1889 roku."
  cs:
    - "Nová brána byla brána chrámu v Jeruzalémě v posledních letech judského království. Jeremjáš se o ní zmiňuje dvakrát. Když kněží a proroci jali Jeremjáše za to, že předpověděl zkázu chrámu, „knížata Judská ... přišli z domu královského do domu Hospodinova, a posadili se u dveří brány Hospodinovy nové“, vyslechla tam při a ušetřila ho. O několik let později četl Báruch Jeremjášův svitek nahlas „v pokoji Gemariáše syna Safanova, písaře, na síni hořejší, u dveří brány domu Hospodinova nové“, než byl svitek odnesen ke králi Jójakimovi, který jej spálil."
    - "Brána zřejmě vedla z paláce do horního nádvoří chrámu a často se pokládá za „bránu hořejší domu Hospodinova“, kterou vystavěl král Jotam, novou ve srovnání se staršími branami; Bible to však neříká. Nic z ní se nedochovalo. S Novou bránou v osmanských hradbách Starého Města, otevřenou roku 1889, nemá nic společného."
  nl:
    - "De Nieuwe Poort was een poort van de tempel in Jeruzalem in de laatste jaren van het koninkrijk Juda. Jeremia noemt haar tweemaal. Toen de priesters en profeten Jeremia grepen omdat hij de ondergang van de tempel voorspelde, “de vorsten van Juda … gingen zij op uit het huis des konings naar het huis des HEEREN; en zij zetten zich bij de deur der nieuwe poort des HEEREN”, en hoorden daar de zaak en spaarden hem. Enkele jaren later las Baruch Jeremia’s boekrol hardop voor “in de kamer van Gemarja, den zoon van Safan, den schrijver, in het bovenste voorhof, aan de deur der nieuwe poort”, voordat de rol naar koning Jojakim werd gebracht, die haar verbrandde."
    - "De poort leidde naar het schijnt van het paleis naar het bovenste voorhof van de tempel, en wordt vaak gelijkgesteld met “de hoge poort aan het huis des HEEREN” die koning Jotam bouwde, nieuw in vergelijking met de oudere poorten; de Bijbel zegt dit niet. Er is niets van over. Ze heeft niets te maken met de Nieuwe Poort in de Ottomaanse muren van de oude stad, geopend in 1889."
  sv:
    - "Nya porten var en port i templet i Jerusalem under kungariket Judas sista år. Jeremia nämner den två gånger. När prästerna och profeterna grep Jeremia för att han förutsagt templets ruin, ”Juda furstar … gingo de från konungshuset upp till HERRENS hus och satte sig vid ingången till HERRENS nya port”, och där hörde de målet och skonade honom. Några år senare läste Baruk upp Jeremias bokrulle ”i sekreteraren Gemarjas, Safans sons, kammare på den övre förgården, vid ingången till nya porten på HERRENS hus”, innan rullen togs till kung Jojakim, som brände den."
    - "Porten tycks ha lett från palatset till templets övre förgård, och den antas ofta vara ”Övre porten till HERRENS hus” som kung Jotam byggde, ny jämfört med de äldre portarna; Bibeln säger inte det. Ingenting av den finns kvar. Den har ingenting att göra med Nya porten i de osmanska murarna kring Gamla stan, öppnad 1889."
  nb:
    - "Nyporten var en port til tempelet i Jerusalem i de siste årene av kongeriket Juda. Jeremia nevner den to ganger. Da prestene og profetene grep Jeremia fordi han hadde forutsagt tempelets ødeleggelse, gikk Judas høvdinger «fra kongens hus op til Herrens hus, og de satte sig i inngangen til Herrens nye port», og der hørte de saken og skånet ham. Noen år senere leste Baruk Jeremias rull høyt «i statsskriveren Gemarjas, Safans sønns kammer i den øvre forgård, ved inngangen til den nye port i Herrens hus», før rullen ble tatt med til kong Jojakim, som brente den."
    - "Porten synes å ha ledet fra palasset til tempelets øvre forgård, og den tas ofte for å være «den øvre port i Herrens hus» som kong Jotam bygde, ny i forhold til de eldre portene; Bibelen sier det ikke. Ingenting av den er bevart. Den har ingenting å gjøre med Nyporten i de osmanske murene rundt gamlebyen, åpnet i 1889."
  tl:
    - "Ang Bagong Pintuang-bayan ay isang pintuang-bayan ng templo sa Jerusalem sa mga huling taon ng kaharian ng Juda. Dalawang ulit itong binabanggit ni Jeremias. Nang dakpin ng mga saserdote at mga propeta si Jeremias dahil sa paghula ng pagkawasak ng templo, “mga prinsipe sa Juda … sila'y nagsisampa sa bahay ng Panginoon na mula sa bahay ng hari; at sila'y nangaupo sa pasukan ng bagong pintuang-daan”, at doon dininig ang usapin at iniligtas siya. Makalipas ang ilang taon, binasa ni Baruch nang malakas ang balumbon ni Jeremias “sa silid ni Gemarias na anak ni Saphan na kalihim, sa mataas na looban sa pasukan ng bagong pintuang-daan”, bago dinala ang balumbon kay Haring Joacim, na sumunog nito."
    - "Tila patungo ang pintuang-bayan mula sa palasyo hanggang sa itaas na looban ng templo, at madalas itong ituring na “mataas na pintuang-bayan sa bahay ng Panginoon” na itinayo ni Haring Jotham, bago kung ihahambing sa mas lumang mga pintuang-bayan; hindi ito sinasabi ng Bibliya. Walang natira rito. Wala itong kaugnayan sa Bagong Pintuang-bayan sa mga pader na Otomano ng Lumang Lungsod, na binuksan noong 1889."
  da:
    - "Den Nye Port var en port til templet i Jerusalem i Judarigets sidste år. Jeremias nævner den to gange. Da præsterne og profeterne greb Jeremias, fordi han havde forudsagt templets ruin, »gik« Judas Fyrster »op fra Kongens Hus og til Herrens Hus, og de satte sig ved Indgangen til Herrens nye Port«, og dér hørte de sagen og skånede ham. Nogle år senere læste Baruk Jeremias' rulle højt »i Skriveren Gemarjas, Safans Søns, Kammer, i den øverste Forgaard, ved Indgangen igennem den nye Port paa Herrens Hus«, før ruljen blev bragt til kong Jojakim, som brændte den."
    - "Porten synes at have ført fra paladset til templets øvre forgård, og den tages ofte for »den øverste Port paa Herrens Hus«, som kong Jotam byggede, ny i sammenligning med de ældre porte; Bibelen siger det ikke. Intet af den er bevaret. Den har intet at gøre med Den Nye Port i den osmanniske bymur om den gamle bydel, åbnet i 1889."
  sr:
    - "Нова капија била је капија храма у Јерусалиму у последњим годинама краљевства Јудиног. Јеремија је помиње двапут. Кад су свештеници и пророци ухватили Јеремију што је прорекао пропаст храма, „кнезови Јудини … дођоше из дома царског у дом Господњи, и седоше пред нова врата Господња“, и ту су саслушали случај и поштедели га. Неколико година касније Варух је наглас читао Јеремијин свитак „у клети Гемарије, сина Сафановог писара, у горњем трему код нових врата дома Господњег“, пре него што је свитак однет цару Јоакиму, који га је спалио."
    - "Изгледа да је капија водила од палате до горњег дворишта храма, и често се узима да је то „највиша врата на дому Господњем“ које је подигао цар Јотам, нова у поређењу са старијим капијама; Библија то не каже. Од ње ништа није сачувано. Нема везе с Новом капијом у османским зидинама Старог града, отвореном 1889."
  hu:
    - "Az Új kapu a jeruzsálemi templom egyik kapuja volt Júda királyságának utolsó éveiben. Jeremiás kétszer említi. Amikor a papok és próféták elfogták Jeremiást, mert a templom pusztulását jövendölte, „a Júda fejedelmei … felmenének a király házából az Úrnak házába, és leülének az Úr új kapujának ajtajában”, és ott meghallgatták az ügyet, és megkímélték. Néhány évvel később Báruk hangosan felolvasta Jeremiás tekercsét „Gamáriának, az írástudó Sáfán fiának szobájában a felső pitvarban, az Úr háza új kapujának nyílásában”, mielőtt a tekercset Jójákim királyhoz vitték, aki elégette."
    - "A kapu úgy tűnik, a palotából a templom felső udvarába vezetett, és gyakran azonosítják azzal a kapuval, amelyet Jótám király épített: „az Úr házának felső kapuját”, amely a régebbi kapukhoz képest új volt; a Biblia ezt nem mondja ki. Belőle semmi sem maradt fenn. Semmi köze az Óváros oszmán falaiban 1889-ben megnyitott Új kapuhoz."
  fi:
    - "Uusi portti oli Jerusalemin temppelin portti Juudan kuningaskunnan viimeisinä vuosina. Jeremia mainitsee sen kahdesti. Kun papit ja profeetat tarttuivat Jeremiaan, koska hän oli ennustanut temppelin tuhoa, Juudan päämiehet ”menivät he kuninkaan palatsista Herran temppeliin ja istuivat Herran uuden portin ovelle”, ja siellä he kuulivat jutun ja säästivät hänet. Joitakin vuosia myöhemmin Baruk luki Jeremian kirjakäärön ääneen ”kirjuri Gemarjan, Saafanin pojan, kammiossa, ylemmässä esipihassa, Herran temppelin uuden portin ovella”, ennen kuin käärö vietiin kuningas Jojakimille, joka poltti sen."
    - "Portti näyttää johtaneen palatsista temppelin ylempään esipihaan, ja sen katsotaan usein olevan kuningas Jotamin rakentama portti: Jotam ”rakennutti Yläportin Herran temppeliin”, uusi verrattuna vanhempiin portteihin; Raamattu ei sano niin. Siitä ei ole säilynyt mitään. Sillä ei ole mitään tekemistä Uuden portin kanssa, joka avattiin vanhan kaupungin ottomaanien muureihin vuonna 1889."
  vi:
    - "Cửa Mới là một cổng của đền thờ ở Giê-ru-sa-lem trong những năm cuối của vương quốc Giu-đa. Giê-rê-mi nhắc đến nó hai lần. Khi các thầy tế lễ và tiên tri bắt Giê-rê-mi vì báo trước đền thờ sẽ bị hủy, “Các quan trưởng Giu-đa … từ trong cung vua lên nhà Đức Giê-hô-va, ngồi tại lối vào của cửa mới nhà Đức Giê-hô-va”, và tại đó nghe vụ việc rồi tha cho ông. Vài năm sau, Ba-rúc đọc to cuộn sách của Giê-rê-mi “trong phòng Ghê-ma-ria, con trai Sa-phan làm thơ ký, nơi hành lang trên, lối vào cửa mới nhà Đức Giê-hô-va”, trước khi cuộn sách được đem đến vua Giê-hô-gia-kim, người đã đốt nó."
    - "Cổng này dường như dẫn từ cung điện lên sân trên của đền thờ, và thường được cho là “cửa thượng của đền thờ Đức Giê-hô-va” mà vua Giô-tham xây, mới so với các cổng cũ hơn; Kinh Thánh không nói như vậy. Không còn gì của nó tồn tại. Nó không liên quan gì đến Cổng Mới trong tường thành thời Ottoman của Thành Cổ, mở năm 1889."
  ro:
    - "Poarta Nouă era o poartă a templului din Ierusalim în ultimii ani ai regatului Iuda. Ieremia o pomenește de două ori. Când preoții și profeții l-au prins pe Ieremia pentru că prevestise ruina templului, boierii lui Iuda, auzind aceste cuvinte, „s’au suit din casa împăratului la casa Domnului, și au stătut înaintea ușilor porții Domnului cei nouă”, și acolo au ascultat pricina și l-au cruțat. Câțiva ani mai târziu, Baruc a citit cu glas tare sulul lui Ieremia „în casa lui Gamarie fiul lui Safan scriitorul, sus înaintea ușilor porții casei Domnului cea nouă”, înainte ca sulul să fie dus regelui Ioiachim, care l-a ars."
    - "Poarta pare să fi dus de la palat la curtea de sus a templului și este adesea socotită „poarta casei Domnului cea din sus” pe care a zidit-o regele Iotam, nouă în comparație cu porțile mai vechi; Biblia nu spune acest lucru. Nu s-a păstrat nimic din ea. Nu are nicio legătură cu Poarta Nouă din zidurile otomane ale Orașului Vechi, deschisă în 1889."
  bg:
    - "Новата порта била порта на храма в Йерусалим в последните години на Юдейското царство. Йеремия я споменава два пъти. Когато свещениците и пророците хванали Йеремия, защото предсказвал разрушението на храма, „Юдините князове … възлязоха от царския дом в дома Господен, и седнаха във входа на новите врата Господни“ и там изслушали делото и го пощадили. Няколко години по-късно Варух прочел на глас свитъка на Йеремия „в стаята на Гемария Сафановия син, писеца, в горния двор, във входа на новите врата на дома Господен“, преди свитъкът да бъде занесен на цар Йоаким, който го изгорил."
    - "Портата, изглежда, водела от двореца към горния двор на храма и често се смята за „високите двери на дома Господен“, които построил цар Йотам — нови в сравнение с по-старите порти; Библията не казва това. Нищо от нея не е оцеляло. Тя няма нищо общо с Новата порта в османските стени на Стария град, отворена през 1889 г."
