# Overview article (ADR 0007). Mainstream facts only; a temple gate known from two verses in Jeremiah; the link with Jotham's upper gate is given as a common view, not as fact.
id: new-gate
place: aa85961
title:
  en: "New Gate"
  ru: "Новые ворота"
  uk: "Нові ворота"
  es: "Puerta Nueva"
  pt: "Porta Nova"
  de: "Neues Tor"
  fr: "Porte Neuve"
body:
  en:
    - "The New Gate was a gate of the temple in Jerusalem in the last years of the kingdom of Judah. Jeremiah mentions it twice. When the priests and prophets seized Jeremiah for foretelling the temple's ruin, “the princes of Judah … came up from the king's house unto the house of the LORD, and sat down in the entry of the new gate”, and there heard the case and spared him. Some years later Baruch read Jeremiah's scroll aloud “in the chamber of Gemariah the son of Shaphan the scribe, in the higher court, at the entry of the new gate”, before the scroll was taken to King Jehoiakim, who burned it."
    - "The gate led from the palace to the temple's upper court, and it is often taken to be “the higher gate of the house of the LORD” that King Jotham built, new in comparison with the older gates; the Bible does not say so. Nothing of it survives. It has nothing to do with the New Gate in the Ottoman walls of the Old City, opened in 1889."
  ru:
    - "Новые ворота — ворота храма в Иерусалиме в последние годы Иудейского царства. Иеремия упоминает их дважды. Когда священники и пророки схватили Иеремию за пророчество о разрушении храма, «князья Иудейские … пришли из дома царя к дому Господню и сели у входа в новые ворота дома Господня», выслушали дело и пощадили его. Несколько лет спустя Варух прочитал свиток Иеремии «в комнате Гемарии, сына Сафанова, писца, на верхнем дворе, у входа в новые ворота», прежде чем свиток отнесли царю Иоакиму, который его сжёг."
    - "Ворота вели от дворца к верхнему двору храма, и их часто отождествляют с воротами, о которых сказано, что царь Иоафам «построил верхние ворота при доме Господнем», — новыми по сравнению с более старыми; Библия этого не говорит. От них ничего не сохранилось. К Новым воротам в османских стенах Старого города, открытым в 1889 году, они отношения не имеют."
  uk:
    - "Нові ворота були воротами храму в Єрусалимі в останні роки Юдейського царства. Єремія згадує їх двічі. Коли священики й пророки схопили Єремію за те, що він провіщав руйнування храму, «князї Юдині, поприходили з царської палати до дому Господнього та й посїдали коло ввіходу в нові ворота дому Господнього», і там вислухали справу й помилували його. Кілька років потому Варух читав сувій Єремії вголос «в сьвітлицї писаря Гемарії Сафаненка, на верхньому подвіррі, коло ввіходу в нові ворота в дому Господньому», перш ніж сувій віднесли цареві Йоакимові, який його спалив."
    - "Ворота вели від палацу до верхнього подвір'я храму, і їх часто вважають тими воротами, про які сказано, що Йотам «збудував верхні ворота при храму Господньому», нові порівняно зі старішими воротами; Біблія цього не стверджує. Від них нічого не збереглося. Вони не мають нічого спільного з Новими воротами в османських мурах Старого міста, відкритими 1889 року."
  es:
    - "La Puerta Nueva era una puerta del templo de Jerusalén en los últimos años del reino de Judá. Jeremías la menciona dos veces. Cuando los sacerdotes y los profetas apresaron a Jeremías por anunciar la ruina del templo, «los príncipes de Judá … subieron de casa del rey á la casa de Jehová; y sentáronse en la entrada de la puerta nueva de Jehová», y allí oyeron el caso y lo libraron. Algunos años después Baruc leyó en voz alta el rollo de Jeremías «en la cámara de Gemarías hijo de Saphán escriba, en el atrio de arriba, á la entrada de la puerta nueva», antes de que el rollo fuera llevado al rey Joacim, que lo quemó."
    - "La puerta conducía del palacio al atrio superior del templo, y a menudo se la identifica con «la puerta más alta de la casa de Jehová» que construyó el rey Jotam, nueva en comparación con las puertas más antiguas; la Biblia no lo dice. No queda nada de ella. No tiene relación alguna con la Puerta Nueva de las murallas otomanas de la Ciudad Vieja, abierta en 1889."
  pt:
    - "A Porta Nova era uma porta do templo de Jerusalém nos últimos anos do reino de Judá. Jeremias a menciona duas vezes. Quando os sacerdotes e profetas prenderam Jeremias por predizer a ruína do templo, “os príncipes de Judá … subiram da casa do rei para a casa do SENHOR; e se assentaram à entrada da porta nova da casa do SENHOR”, e ali ouviram o caso e o pouparam. Alguns anos depois, Baruque leu em voz alta o rolo de Jeremias “na sala de Gemarias, filho de Safã, o escriba, no pátio superior, à entrada da porta nova da casa do SENHOR”, antes que o rolo fosse levado ao rei Jeoaquim, que o queimou."
    - "A porta levava do palácio ao pátio superior do templo, e costuma ser tomada por “a porta superior da casa do SENHOR” que o rei Jotão construiu, nova em comparação com as portas mais antigas; a Bíblia não o diz. Nada dela sobrevive. Não tem relação com a Porta Nova das muralhas otomanas da Cidade Velha, aberta em 1889."
  de:
    - "Das Neue Tor war ein Tor des Tempels in Jerusalem in den letzten Jahren des Königreichs Juda. Jeremia erwähnt es zweimal. Als Priester und Propheten Jeremia ergriffen, weil er den Untergang des Tempels vorausgesagt hatte, „gingen [die Fürsten Juda's] aus des Königs Hause hinauf ins Haus des HERRN und setzten sich vor das neue Tor“, hörten dort den Fall und verschonten ihn. Einige Jahre später las Baruch Jeremias Buchrolle laut vor „in der Kapelle Gemarjas, des Sohnes Saphans, des Kanzlers, im obern Vorhof, vor dem neuen Tor am Hause des HERRN“, ehe die Rolle zu König Jojakim gebracht wurde, der sie verbrannte."
    - "Das Tor führte vom Palast zum oberen Vorhof des Tempels, und man hält es oft für „das obere Tor am Hause des HERRN“, das König Jotam baute, neu im Vergleich zu den älteren Toren; die Bibel sagt das nicht. Nichts davon ist erhalten. Es hat nichts mit dem Neuen Tor in der osmanischen Mauer der Altstadt zu tun, das 1889 geöffnet wurde."
  fr:
    - "La Porte Neuve était une porte du temple de Jérusalem dans les dernières années du royaume de Juda. Jérémie la mentionne deux fois. Quand les prêtres et les prophètes se saisirent de Jérémie pour avoir annoncé la ruine du temple, « les chefs de Juda … montèrent de la maison du roi à la maison de l’Éternel, et s’assirent à l’entrée de la porte neuve de la maison de l’Éternel », entendirent là l’affaire et l’épargnèrent. Quelques années plus tard, Baruc lut à haute voix le rouleau de Jérémie « dans la chambre de Guemaria, fils de Schaphan, le secrétaire, dans le parvis supérieur, à l’entrée de la porte neuve », avant que le rouleau soit porté au roi Jojakim, qui le brûla."
    - "La porte menait du palais au parvis supérieur du temple, et on y voit souvent « la porte supérieure de la maison de l’Éternel » que bâtit le roi Jotham, neuve par rapport aux portes plus anciennes ; la Bible ne le dit pas. Rien n’en subsiste. Elle n’a rien à voir avec la Porte Neuve des murailles ottomanes de la Vieille Ville, ouverte en 1889."
scripture:
  - Jer.26.10
  - Jer.36.10
  - 2Kgs.15.35
