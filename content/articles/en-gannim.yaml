body:
  en:
    - "En-gannim, “spring of gardens”, was a town of Issachar, listed between Remeth and En-haddah, and a Levitical city given with Kishion, Daberath and Jarmuth to the sons of Gershon, “four cities”; the version of the Levitical list in Chronicles reads Anem in its place, perhaps a shortened form of the same name. A second En-gannim in the Shephelah of Judah is another place. That is all the Bible says of it."
    - "Where it stood is disputed. The traditional identification, going back to Edward Robinson, is Jenin at the southern edge of the Jezreel valley, the Ginae of Josephus on the border of Samaria and the Great Plain and perhaps the Beth-haggan past which Jehu pursued Ahaziah; the name and the springs fit, but Jenin lies in the hills of Manasseh rather than where Joshua puts Issachar's towns. Others therefore look nearer Mount Tabor, where Issachar's other towns cluster: Khirbet Beit Jann, Khirbet ed-Dir or a site of Anem have been proposed. None is proved, and the map's point marks a choice, not a finding."
    - "Jenin today is a Palestinian city in the northern West Bank; the other candidates are ruins and villages in Lower Galilee near Mount Tabor."
  ru:
    - "Ен-Ганним, «источник садов», — город Иссахара, названный между Ремефом и Ен-Хаддой, и левитский город, отданный вместе с Кишионом, Даврафом и Иармуфом сынам Гирсона, «четыре города»; вариант левитского списка в Паралипоменоне ставит на его место Анем, возможно, сокращённую форму того же имени. Второй Ен-Ганним, в Шефеле Иуды, — другое место. Это всё, что говорит о нём Библия."
    - "Где он стоял, спорно. Традиционное отождествление, восходящее к Эдварду Робинсону, — Дженин на южном краю долины Изреель, Гиная Иосифа Флавия на границе Самарии и Великой равнины и, быть может, Беф-Гаган, мимо которого Ииуй гнался за Охозией; имя и источники подходят, но Дженин лежит в горах Манассии, а не там, где книга Иисуса Навина помещает города Иссахара. Поэтому другие ищут ближе к горе Фавор, где теснятся остальные города Иссахара: предлагали Хирбет-Бейт-Джанн, Хирбет-эд-Дир или место Анема. Ни одно не доказано, и точка на карте отмечает выбор, а не находку."
    - "Дженин сегодня — палестинский город на севере Западного берега; остальные кандидаты — развалины и селения Нижней Галилеи у горы Фавор."
  uk:
    - "Ен-Ганнім, «джерело садів», було містом Іссахара, названим між Реметом і Ен-Хаддою, і левітським містом, даним з Кішіоном, Давратом та Ярмутом синам Гершома, «чотири міста»; варіант левітського списку в Хроніках читає замість нього Анем, можливо, скорочену форму тієї самої назви. Другий Ен-Ганнім у Шефелі Юди — інше місце. Це все, що Біблія каже про нього."
    - "Де він стояв, є спірним. Традиційне ототожнення, що сягає Едварда Робінсона, — Дженін на південному краї долини Їзреель, Гінея Йосифа Флавія на межі Самарії та Великої рівнини і, можливо, Бет-Гаган, повз яку Єгу гнався за Охозією; назва і джерела пасують, але Дженін лежить у горах Манасії, а не там, де Ісус Навин ставить міста Іссахара. Тому інші шукають ближче до гори Фавор, де групуються інші міста Іссахара: пропонували Хірбет-Бейт-Джанн, Хірбет-ед-Дір або місце Анема. Жодне не доведене, і точка на мапі позначає вибір, а не знахідку."
    - "Дженін сьогодні — палестинське місто на півночі Західного берега; інші кандидати — руїни й села в Нижній Галілеї поблизу гори Фавор."
  es:
    - "En-ganim, «fuente de los jardines», era una ciudad de Isacar, enumerada entre Remet y En-hada, y una ciudad levítica dada con Cisión, Daberat y Jarmut a los hijos de Gersón, «cuatro villas»; la versión de la lista levítica en Crónicas lee Anem en su lugar, quizá una forma abreviada del mismo nombre. Una segunda En-ganim, en la Sefelá de Judá, es otro lugar. Eso es todo lo que la Biblia dice de ella."
    - "Dónde estaba es objeto de debate. La identificación tradicional, que se remonta a Edward Robinson, es Yenín, en el borde meridional del valle de Jezreel, la Ginea de Josefo en la frontera de Samaria y la Gran Llanura y quizá el Bet-hagán junto al cual Jehú persiguió a Ocozías; el nombre y las fuentes encajan, pero Yenín se halla en las colinas de Manasés y no donde Josué sitúa las ciudades de Isacar. Otros miran por ello más cerca del monte Tabor, donde se agrupan las demás ciudades de Isacar: se han propuesto Khirbet Beit Jann, Khirbet ed-Dir o un sitio de Anem. Ninguna está probada, y el punto del mapa señala una elección, no un hallazgo."
    - "Yenín es hoy una ciudad palestina del norte de Cisjordania; los demás candidatos son ruinas y aldeas de la Baja Galilea, cerca del monte Tabor."
  pt:
    - "En-Ganim, “fonte dos jardins”, era uma cidade de Issacar, listada entre Remete e En-Hada, e uma cidade levítica dada com Quisiom, Daberate e Jarmute aos filhos de Gérson, “quatro cidades”; a versão da lista levítica nas Crônicas lê Anem em seu lugar, talvez uma forma abreviada do mesmo nome. Uma segunda En-Ganim, na Sefelá de Judá, é outro lugar. Isso é tudo o que a Bíblia diz dela."
    - "Onde ficava é disputado. A identificação tradicional, que remonta a Edward Robinson, é Jenin, no limite sul do vale de Jezreel, a Ginéia de Josefo, na fronteira entre Samaria e a Grande Planície, e talvez a Bete-Hagã diante da qual Jeú perseguiu Acazias; o nome e as fontes se ajustam, mas Jenin fica nas montanhas de Manassés e não onde Josué põe as cidades de Issacar. Outros procuram, por isso, mais perto do Monte Tabor, onde se agrupam as outras cidades de Issacar: Khirbet Beit Jann, Khirbet ed-Dir ou um local de Anem foram propostos. Nenhum está provado, e o ponto do mapa assinala uma escolha, não uma descoberta."
    - "Jenin é hoje uma cidade palestina no norte da Cisjordânia; os outros candidatos são ruínas e aldeias na Baixa Galileia, perto do Monte Tabor."
  de:
    - "En-Gannim, „Quelle der Gärten“, war eine Stadt Issachars, zwischen Remet und En-Hadda aufgeführt, und eine Levitenstadt, die mit Kischjon, Daberat und Jarmut den Söhnen Gerschons gegeben wurde, „vier Städte“; die Fassung der Levitenliste in der Chronik liest an ihrer Stelle Anem, vielleicht eine verkürzte Form desselben Namens. Ein zweites En-Gannim in der Schefela Judas ist ein anderer Ort. Das ist alles, was die Bibel von ihr sagt."
    - "Wo sie stand, ist umstritten. Die traditionelle Gleichsetzung, auf Edward Robinson zurückgehend, ist Dschenin am Südrand der Ebene Jesreel, das Ginae des Josephus an der Grenze zwischen Samaria und der Großen Ebene und vielleicht das Bet-Gan, an dem vorbei Jehu Ahasja verfolgte; der Name und die Quellen passen, doch liegt Dschenin im Bergland Manasses und nicht dort, wo Josua die Städte Issachars ansetzt. Andere suchen daher näher am Berg Tabor, wo sich die anderen Städte Issachars gruppieren: Khirbet Beit Jann, Khirbet ed-Dir oder ein Ort Anem wurden vorgeschlagen. Keiner ist bewiesen, und der Punkt der Karte bezeichnet eine Wahl, keinen Befund."
    - "Dschenin ist heute eine palästinensische Stadt im nördlichen Westjordanland; die anderen Kandidaten sind Ruinen und Dörfer in Untergaliläa nahe dem Berg Tabor."
  fr:
    - "En-Gannim, « source des jardins », était une ville d’Issacar, citée entre Rémeth et En-Hadda, et une ville lévitique donnée avec Kischjon, Dabrath et Jarmuth aux fils de Guerschon, « quatre villes » ; la version de la liste lévitique dans les Chroniques porte Anem à sa place, peut-être une forme abrégée du même nom. Une seconde En-Gannim, dans la Shéphéla de Juda, est un autre lieu. C’est tout ce que la Bible en dit."
    - "Son emplacement est débattu. L’identification traditionnelle, qui remonte à Edward Robinson, est Jénine, au bord sud de la vallée de Jizreel, la Ginae de Josèphe à la frontière de la Samarie et de la Grande Plaine et peut-être le Beth-Gagan devant lequel Jéhu poursuivit Achazia ; le nom et les sources conviennent, mais Jénine se trouve dans les collines de Manassé plutôt que là où Josué place les villes d’Issacar. D’autres cherchent donc plus près du Mont Thabor, où se groupent les autres villes d’Issacar : Khirbet Beit Jann, Khirbet ed-Dir ou un site d’Anem ont été proposés. Aucun n’est prouvé, et le point de la carte marque un choix, non une découverte."
    - "Jénine est aujourd’hui une ville palestinienne du nord de la Cisjordanie ; les autres candidats sont des ruines et des villages de Basse Galilée près du Mont Thabor."
  it:
    - "En-Gannim, «sorgente dei giardini», era una città di Issacar, elencata fra Remet e En-Cadda, e una città levitica data con Kision, Daberat e Iarmut ai figli di Gherson, «quattro città»; la versione dell’elenco levitico nelle Cronache legge Anem al suo posto, forse una forma abbreviata dello stesso nome. Un secondo En-Gannim nella Sefela di Giuda è un altro luogo. È tutto ciò che la Bibbia ne dice."
    - "Dove sorgesse è controverso. L’identificazione tradizionale, che risale a Edward Robinson, è Jenin al margine meridionale della valle di Izreel, la Ginae di Giuseppe Flavio al confine fra la Samaria e la Grande Pianura e forse il Bet-Agan oltre il quale Ieu inseguì Acazia; il nome e le sorgenti si accordano, ma Jenin si trova sulle alture di Manasse piuttosto che dove Giosuè pone le città di Issacar. Altri guardano perciò più vicino al Monte Tabor, dove si raggruppano le altre città di Issacar: sono stati proposti Khirbet Beit Jann, Khirbet ed-Dir o un sito di Anem. Nessuno è provato, e il punto sulla mappa segna una scelta, non un ritrovamento."
    - "Jenin è oggi una città palestinese della Cisgiordania settentrionale; gli altri candidati sono rovine e villaggi della Bassa Galilea presso il Monte Tabor."
  pl:
    - "En-Gannim, „źródło ogrodów”, było miastem Issachara, wymienionym między Remet i En-Chadda, oraz miastem lewickim danym wraz z Kiszjon, Daberat i Jarmut synom Gerszona, „miasta cztery”; wersja wykazu lewickiego w Księdze Kronik ma w jego miejsce Anem, być może skróconą formę tej samej nazwy. Drugie En-Gannim w Szefeli Judy jest innym miejscem. To wszystko, co Biblia o nim mówi."
    - "Gdzie stało, jest sporne. Tradycyjne utożsamienie, sięgające Edwarda Robinsona, to Dżenin na południowym skraju doliny Jizreel, Ginae Józefa Flawiusza na granicy Samarii i Wielkiej Równiny, a być może Bet-Hag-Gan, obok którego Jehu ścigał Ochozjasza; nazwa i źródła pasują, lecz Dżenin leży w górach Manassesa, a nie tam, gdzie Jozue umieszcza miasta Issachara. Inni szukają więc bliżej góry Tabor, gdzie skupiają się pozostałe miasta Issachara: proponowano Chirbet Bajt Dżann, Chirbet ed-Dir lub miejsce Anem. Żadnego nie udowodniono, a punkt na mapie oznacza wybór, nie odkrycie."
    - "Dżenin jest dziś palestyńskim miastem w północnej części Zachodniego Brzegu; inni kandydaci to ruiny i wsie w Dolnej Galilei koło góry Tabor."
  nl:
    - "En-Gannim, “bron der tuinen”, was een stad van Issachar, genoemd tussen Remet en En-Chadda, en een levitische stad die met Kisjon, Daberat en Jarmut aan de zonen van Gerson werd gegeven, “vier steden”; de versie van de levitische lijst in Kronieken leest daarvoor Anem, misschien een verkorte vorm van dezelfde naam. Een tweede En-Gannim in de Sefela van Juda is een andere plaats. Dat is alles wat de Bijbel erover zegt."
    - "Waar het stond, is omstreden. De traditionele identificatie, teruggaand op Edward Robinson, is Jenin aan de zuidrand van de vallei van Jizreël, het Ginae van Josephus op de grens van Samaria en de Grote Vlakte en misschien het Beth-Haggan waar Jehu Achazia voorbij achtervolgde; de naam en de bronnen passen, maar Jenin ligt in het bergland van Manasse en niet waar Jozua de steden van Issachar plaatst. Anderen zoeken daarom dichter bij de Tabor, waar Issachars andere steden zich groeperen: Khirbet Beit Jann, Khirbet ed-Dir of een plaats Anem zijn voorgesteld. Geen is bewezen, en het punt op de kaart markeert een keuze, geen bevinding."
    - "Jenin is nu een Palestijnse stad in het noorden van de Westelijke Jordaanoever; de andere kandidaten zijn ruïnes en dorpen in Neder-Galilea bij de Tabor."
  cs:
    - "Én-ganním, „pramen zahrad“, bylo město Isacharovo, uvedené mezi Remetem a Én-chadou, a levitské město dané s Kišjónem, Daberatem a Jarmutem synům Geršonovým, „města čtyři“; verze levitského seznamu v Letopisech čte na jeho místě Anem, snad zkrácenou formu téhož jména. Druhý Én-ganním v Šefele Judské je jiné místo. To je vše, co o něm Bible říká."
    - "Kde stálo, je sporné. Tradiční ztotožnění, sahající k Edwardu Robinsonovi, je Jenin na jižním okraji Jizreelského údolí, Josephova Gínaia na hranici Samaří a Velké roviny a snad Bét-hagan, kolem něhož Jehú pronásledoval Achazjáše; jméno i prameny odpovídají, ale Jenin leží v pahorcích Manasesových, a ne tam, kam Jozue klade města Isacharova. Jiní proto hledají blíže hory Tábor, kde se shlukují ostatní města Isacharova: navrženy byly Khirbet Beit Jann, Khirbet ed-Dir nebo místo Anem. Žádné není prokázáno a bod mapy označuje volbu, ne nález."
    - "Jenin je dnes palestinské město v severní části Západního břehu; ostatní kandidáti jsou zříceniny a vesnice v Dolní Galileji poblíž hory Tábor."
  sv:
    - "En-Gannim, ”trädgårdarnas källa”, var en stad i Isaskar, förtecknad mellan Remet och En-Hadda, och en levitstad som gavs med Kishjon, Daverat och Jarmut åt Gershons söner, ”fyra städer”; versionen av levitförteckningen i Krönikeboken har Anem i dess ställe, kanske en förkortad form av samma namn. Ett andra En-Gannim i Judas Shefela är en annan plats. Det är allt Bibeln säger om den."
    - "Var den låg är omtvistat. Den traditionella identifieringen, som går tillbaka på Edward Robinson, är Jenin vid södra kanten av Jisreeldalen, Josefus Ginae vid gränsen mellan Samaria och Stora slätten och kanske det Bet-Haggan förbi vilket Jehu förföljde Achasja; namnet och källorna passar, men Jenin ligger i Manasses berg snarare än där Josua placerar Isaskars städer. Andra söker därför närmare berget Tabor, där Isaskars övriga städer samlas: Khirbet Beit Jann, Khirbet ed-Dir eller en plats Anem har föreslagits. Ingen är bevisad, och kartans punkt markerar ett val, inte ett fynd."
    - "Jenin är i dag en palestinsk stad i norra Västbanken; de andra kandidaterna är ruiner och byar i nedre Galileen nära berget Tabor."
  nb:
    - "En-Gannim, «hagenes kilde», var en by i Issakar, oppført mellom Remet og En-Hadda, og en levittby gitt sammen med Kisjon, Daberat og Jarmut til Gersjons sønner, «fire byer»; versjonen av levittlisten i Krønikebøkene har Anem i stedet, kanskje en forkortet form av samme navn. En annen En-Gannim i Judas Sjefela er et annet sted. Det er alt Bibelen sier om den."
    - "Hvor den sto, er omdiskutert. Den tradisjonelle identifiseringen, som går tilbake til Edward Robinson, er Jenin i sørkanten av Jisreel-dalen, Josefus' Ginea på grensen mellom Samaria og Den store sletten og kanskje det Bet-Gan som Jehu forfulgte Ahasja forbi; navnet og kildene passer, men Jenin ligger i Manasses åser snarere enn der Josva legger Issakars byer. Andre ser derfor nærmere Tabor, der Issakars øvrige byer samler seg: Khirbet Beit Jann, Khirbet ed-Dir eller et sted for Anem er foreslått. Ingen er bevist, og kartets punkt markerer et valg, ikke et funn."
    - "Jenin er i dag en palestinsk by på nordlige Vestbredden; de andre kandidatene er ruiner og landsbyer i Nedre Galilea nær Tabor."
  tl:
    - "Ang En-gannim, “bukal ng mga halamanan”, ay isang bayan ng Issachar, nakalista sa pagitan ng Rameth at En-hadda, at lungsod ng mga Levita na ibinigay kasama ng Chision, Dabrath at Jarmuth sa mga anak ni Gerson, “apat na bayan”; ang bersiyon ng talaan ng mga Levita sa Mga Cronica ay may Anem sa halip, marahil pinaikling anyo ng gayunding pangalan. Ang ikalawang En-gannim sa Sephela ng Juda ay ibang pook. Iyon lamang ang sinasabi ng Bibliya tungkol dito."
    - "Pinagtatalunan kung saan ito nakatayo. Ang tradisyonal na pagkilala, mula kay Edward Robinson, ay ang Jenin sa katimugang gilid ng libis ng Jezreel, ang Ginae ni Josefo sa hangganan ng Samaria at ng Malaking Kapatagan at marahil ang Beth-haggan na pinaghabulan ni Jehu kay Ochozias; tugma ang pangalan at ang mga bukal, ngunit ang Jenin ay nasa mga burol ng Manases at hindi kung saan inilalagay ni Josue ang mga bayan ng Issachar. Kaya hinanap ito ng iba nang mas malapit sa Bundok Tabor, kung saan nagkukumpol ang iba pang bayan ng Issachar: iminungkahi ang Khirbet Beit Jann, Khirbet ed-Dir o isang pook ng Anem. Walang napatunayan, at ang punto ng mapa ay pagpili, hindi natuklasan."
    - "Ang Jenin ngayon ay lungsod ng mga Palestino sa hilagang West Bank; ang iba pang kandidato ay mga guho at nayon sa Mababang Galilea malapit sa Bundok Tabor."
  da:
    - "En-Gannim, »havernes kilde«, var en by i Issakar, opført mellem Remet og En-Hadda, og en levitisk by givet sammen med Kisjion, Daberat og Jarmut til Gersjons sønner, »fire Stæder«; versionen af den levitiske liste i Krønikebøgerne har Anem i dens sted, måske en forkortet form af det samme navn. En anden En-Gannim i Judas Sjefela er et andet sted. Det er alt, Bibelen siger om den."
    - "Hvor den stod, er omstridt. Den traditionelle identifikation, der går tilbage til Edward Robinson, er Jenin ved den sydlige kant af Jizre'el-dalen, Josefus' Ginae på grænsen mellem Samaria og Den Store Slette og måske det Bet-ha-Gan, forbi hvilket Jehu forfulgte Akazja; navnet og kilderne passer, men Jenin ligger i Manasses bjerge snarere end dér, hvor Josva placerer Issakars byer. Andre søger derfor nærmere Tabor, hvor Issakars øvrige byer klynger sig: Khirbet Beit Jann, Khirbet ed-Dir eller et sted ved Anem er blevet foreslået. Ingen er bevist, og kortets punkt markerer et valg, ikke et fund."
    - "Jenin er i dag en palæstinensisk by i den nordlige del af Vestbredden; de øvrige kandidater er ruiner og landsbyer i Nedre Galilæa nær Tabor."
