# Overview article (ADR 0007). Mainstream facts only; the Jenin identification is traditional and is set against the other candidates on the map; none is chosen.
id: en-gannim
place: a8eae19
title:
  en: "En-gannim"
  ru: "Ен-Ганним"
body:
  en:
    - "En-gannim, “spring of gardens”, was a town of Issachar, listed between Remeth and En-haddah, and a Levitical city given with Kishion, Daberath and Jarmuth to the sons of Gershon, “four cities”; the version of the Levitical list in Chronicles reads Anem in its place, perhaps a shortened form of the same name. A second En-gannim in the Shephelah of Judah is another place. That is all the Bible says of it."
    - "Where it stood is disputed. The traditional identification, going back to Edward Robinson, is Jenin at the southern edge of the Jezreel valley, the Ginae of Josephus on the border of Samaria and the Great Plain and perhaps the Beth-haggan past which Jehu pursued Ahaziah; the name and the springs fit, but Jenin lies in the hills of Manasseh rather than where Joshua puts Issachar's towns. Others therefore look nearer Mount Tabor, where Issachar's other towns cluster: Khirbet Beit Jann, Khirbet ed-Dir or a site of Anem have been proposed. None is proved, and the map's point marks a choice, not a finding."
    - "Jenin today is a Palestinian city in the northern West Bank; the other candidates are ruins and villages in Lower Galilee near Mount Tabor."
  ru:
    - "Ен-Ганним, «источник садов», — город Иссахара, названный между Ремефом и Ен-Хаддой, и левитский город, отданный вместе с Кишионом, Даврафом и Иармуфом сынам Гирсона, «четыре города»; вариант левитского списка в Паралипоменоне ставит на его место Анем, возможно, сокращённую форму того же имени. Второй Ен-Ганним, в Шефеле Иуды, — другое место. Это всё, что говорит о нём Библия."
    - "Где он стоял, спорно. Традиционное отождествление, восходящее к Эдварду Робинсону, — Дженин на южном краю долины Изреель, Гиная Иосифа Флавия на границе Самарии и Великой равнины и, быть может, Беф-Гаган, мимо которого Ииуй гнался за Охозией; имя и источники подходят, но Дженин лежит в горах Манассии, а не там, где книга Иисуса Навина помещает города Иссахара. Поэтому другие ищут ближе к горе Фавор, где теснятся остальные города Иссахара: предлагали Хирбет-Бейт-Джанн, Хирбет-эд-Дир или место Анема. Ни одно не доказано, и точка на карте отмечает выбор, а не находку."
    - "Дженин сегодня — палестинский город на севере Западного берега; остальные кандидаты — развалины и селения Нижней Галилеи у горы Фавор."
