# Overview article (ADR 0007). Mainstream facts only; the Khirbet Qeiyafa debate is named as such. The Synodal Bible has no proper name for the region.
id: shephelah
place: af084cf
title:
  en: "Shephelah"
  ru: "Шефела"
  uk: "Шефела"
  es: "Sefelá"
  pt: "Sefelá"
  de: "Schefela"
  fr: "Shéphéla"
body:
  en:
    - "The Shephelah, “the lowland”, is the belt of low hills between the mountains of Judah and the Philistine plain, some 15 km wide and 60 km long from the valley of Aijalon to beyond Lachish. Its soft chalk rises to 200–450 m and is cut by valleys running west to the sea: Aijalon, Sorek, Elah, Guvrin and Lachish. These valleys were the roads from the coast into the hill country, so the Shephelah was Judah's frontier and its granary, a land of grain, olives and the sycamore figs the Bible mentions: Solomon made cedars “as the sycomore trees that are in the vale”. The Synodal translation never uses it as a proper name: it says “low places”, “the lowland” or even “the valley”."
    - "Joshua lists the Shephelah among the regions of the conquest, “the hills, and of the south, and of the vale”, and names its towns of Judah: Eshtaol, Zorah, Jarmuth, Adullam, Socoh, Azekah, Libnah, Lachish, Eglon, Makkedah and others. Here Samson lived among the Philistines of Timnah, David faced Goliath in the valley of Elah, and Rehoboam fortified Lachish, Azekah and Adullam. Uzziah kept cattle “in the low country”, and under Ahaz the Philistines “invaded the cities of the low country”. Micah came from Moresheth in these hills; Jeremiah foresaw a time when fields would again be bought “in the cities of the valley”. Obadiah promised that “they of the plain” would possess the Philistines."
    - "The Shephelah was fought over because it was open. In 701 BC Sennacherib marched through it against Hezekiah, took forty-six walled towns, and had the siege of Lachish carved on the walls of his palace at Nineveh. The Babylonians came the same way; the Lachish letters, written on potsherds as Nebuchadnezzar closed in, mention the signal fires of Azekah. In Hellenistic times Marisa became an Idumean and Greek town, and the Maccabees fought their battles at Emmaus and Beth-horon on the lowland's northern edge."
    - "Archaeology has dug deeply here: Lachish, Beth-shemesh, Gezer, Tell es-Safi (Gath), Azekah, Tel Burna and Khirbet Qeiyafa above the valley of Elah, whose fortified town of about 1000 BC is a point of dispute about the kingdom of David. Today the Shephelah is central Israel between the Jerusalem hills and the coastal plain, with Beit Shemesh and Kiryat Gat as its towns, and Beit Guvrin-Maresha, with its bell caves and painted tombs, a national park and since 2014 a World Heritage site."
  ru:
    - "Шефела, «низменность», — полоса невысоких холмов между горами Иудеи и Филистимской равниной, шириной около 15 км и длиной около 60 км от долины Аиалон до земель за Лахисом. Её мягкий известняк поднимается на 200–450 м и прорезан долинами, бегущими на запад к морю: Аиалон, Сорек, Эла, Гуврин и Лахис. Эти долины были дорогами с побережья в нагорье, поэтому Шефела была и границей Иудеи, и её житницей — землёй хлеба, маслин и сикомор, о которых говорит Библия: Соломон сделал кедры равноценными «с сикоморами, растущими на низких местах». Синодальный перевод нигде не делает его названием: он говорит «низменные места», «низкие места», «низменность» и даже «долина»."
    - "Книга Иисуса Навина называет Шефелу среди земель завоевания — «всю землю нагорную и полуденную, и низменные места» — и перечисляет её города в уделе Иуды: Ештаол, Цора, Иармуф, Одоллам, Сохо, Азека, Ливна, Лахис, Еглон, Македа и другие. Здесь Самсон жил среди Филистимлян Фимнафы, Давид вышел против Голиафа в долине Эла, а Ровоам укрепил Лахис, Азеку и Одоллам. Озия держал скот «на низменности», а при Ахазе Филистимляне «рассыпались по городам низменного края». Из Морешета в этих холмах вышел Михей; Иеремия предвидел время, когда поля вновь будут покупать «в городах низменных». Авдий обещал, что живущие «в долине» завладеют Филистимлянами."
    - "За Шефелу воевали, потому что она открыта. В 701 г. до н. э. Сеннахирим прошёл по ней против Езекии, взял сорок шесть укреплённых городов и велел высечь осаду Лахиса на стенах своего дворца в Ниневии. Тем же путём пришли Вавилоняне; письма из Лахиса, написанные на черепках, когда Навуходоносор сжимал кольцо, упоминают сигнальные огни Азеки. В эллинистическое время Мариса стала идумейским и греческим городом, а Маккавеи сражались при Эммаусе и Вефороне на северном краю низменности."
    - "Археологи копали здесь глубоко: Лахис, Вефсамис, Газер, Телль-эс-Сафи (Геф), Азека, Тель-Бурна и Хирбет-Кейафа над долиной Эла, чей укреплённый город около 1000 г. до н. э. стал предметом спора о царстве Давида. Сегодня Шефела — центр Израиля между Иерусалимскими горами и прибрежной равниной, с городами Бейт-Шемеш и Кирьят-Гат, а Бейт-Гуврин-Мареша с её колоколообразными пещерами и расписными гробницами — национальный парк и с 2014 года объект Всемирного наследия."
  uk:
    - "Шефела, «низовина», — смуга низьких пагорбів між горами Юди та Філістимською рівниною, завширшки близько 15 км і завдовжки 60 км — від долини Аялона до місць за Лахішем. Її м'який крейдяний ґрунт здіймається до 200–450 м і порізаний долинами, що біжать на захід до моря: Аялон, Сорек, Ела, Гуврін і Лахіш. Ці долини були дорогами з узбережжя в гірську країну, тож Шефела була кордоном Юди і її житницею — краєм зерна, оливок і сикоморових смокв, які згадує Біблія: Соломон зробив кедри такими, як «сикомори по полях». Кулішів переклад ніколи не вживає її як власну назву: він каже «поділля» чи «низини»."
    - "Книга Ісуса Навина називає Шефелу серед областей завоювання — «нагірню і полуденню й поділля» — і перелічує її міста Юди: Ештаол, Цора, Ярмут, Одолам, Сохо, Азека, Лівна, Лахіш, Еглон, Македа та інші. Тут Самсон жив серед філістимлян Тімни, Давид вийшов проти Голіята в долині Ела, а Ровоам укріпив Лахіш, Азеку й Одолам. Уззія тримав худобу «по низинах», а за Ахаза філістимляни «понабігали були в міста на низинах». З Морешета в цих пагорбах походив Міха; Єремія передбачив час, коли поля знову купуватимуть «по містах подільських». Овадія обіцяв, що подоляне «впокорять собі Филистіїв»."
    - "За Шефелу воювали, бо вона відкрита. У 701 р. до н. е. Сінаххеріб пройшов нею проти Єзекії, взяв сорок шість обнесених мурами міст і наказав вирізьбити облогу Лахіша на стінах свого палацу в Ніневії. Вавилоняни прийшли тим самим шляхом; лахішські листи, написані на черепках, коли Навуходоносор стискав кільце, згадують сигнальні вогнища Азеки. В елліністичну добу Маріса стала ідумейським і грецьким містом, а Макавеї провели свої бої при Еммаусі та Бет-Хороні на північному краї низовини."
    - "Археологи копали тут глибоко: Лахіш, Бет-Шемеш, Гезер, Тель-ес-Сафі (Гат), Азека, Тель-Бурна й Хірбет-Кейяфа над долиною Ела, чиє укріплене місто близько 1000 р. до н. е. є предметом суперечки про царство Давида. Сьогодні Шефела — це центральний Ізраїль між Єрусалимськими пагорбами та прибережною рівниною, з містами Бейт-Шемеш і Кір'ят-Гат, а Бейт-Гуврін-Мареша з її дзвоноподібними печерами та розписаними гробницями — національний парк і від 2014 року об'єкт Світової спадщини."
  es:
    - "La Sefelá, «la tierra baja», es la franja de colinas bajas entre las montañas de Judá y la llanura filistea, de unos 15 km de ancho y 60 km de largo desde el valle de Ajalón hasta más allá de Laquis. Su blanda creta se eleva a 200–450 m y está cortada por valles que corren al oeste hacia el mar: Ajalón, Sorek, Ela, Guvrin y Laquis. Estos valles eran los caminos de la costa a la región montañosa, de modo que la Sefelá era la frontera y el granero de Judá, una tierra de grano, olivos y los higos sicómoros que menciona la Biblia: Salomón hizo los cedros «como los cabrahigos que están por los campos en abundancia». La traducción sinodal nunca la usa como nombre propio: dice «tierras bajas», «la llanura» o incluso «el valle»."
    - "Josué enumera la Sefelá entre las regiones de la conquista, «las montañas, y del mediodía, y de los llanos», y nombra sus ciudades de Judá: Estaol, Zora, Jarmut, Adulam, Soco, Azeca, Libna, Laquis, Eglón, Maceda y otras. Aquí vivió Sansón entre los filisteos de Timna, David se enfrentó a Goliat en el valle de Ela, y Roboam fortificó Laquis, Azeca y Adulam. Uzías tuvo «muchos ganados, así en los valles como en las vegas», y bajo Acaz los filisteos «se habían derramado por las ciudades de la llanura». Miqueas procedía de Moréset, en estas colinas; Jeremías previó un tiempo en que de nuevo se comprarían heredades «en las ciudades de las campiñas». Abdías prometió que poseerían «los llanos de los Palestinos»."
    - "Por la Sefelá se luchó porque estaba abierta. En 701 a. C. Senaquerib marchó a través de ella contra Ezequías, tomó cuarenta y seis ciudades amuralladas e hizo tallar el asedio de Laquis en las paredes de su palacio de Nínive. Los babilonios vinieron por el mismo camino; las cartas de Laquis, escritas en ostraca cuando Nabucodonosor se acercaba, mencionan las señales de fuego de Azeca. En época helenística Maresa se convirtió en una ciudad idumea y griega, y los macabeos libraron sus batallas en Emaús y Bet-horón, en el borde norte de la tierra baja."
    - "La arqueología ha excavado a fondo aquí: Laquis, Bet-semes, Gezer, Tell es-Safi (Gat), Azeca, Tel Burna y Khirbet Qeiyafa sobre el valle de Ela, cuya ciudad fortificada de hacia 1000 a. C. es un punto de disputa sobre el reino de David. Hoy la Sefelá es el centro de Israel entre las colinas de Jerusalén y la llanura costera, con Beit Shemesh y Kiryat Gat como sus ciudades, y Beit Guvrin-Maresha, con sus cuevas en forma de campana y sus tumbas pintadas, un parque nacional y desde 2014 un sitio del Patrimonio Mundial."
  pt:
    - "A Sefelá, “a baixada”, é a faixa de colinas baixas entre as montanhas de Judá e a planície filisteia, com cerca de 15 km de largura e 60 km de comprimento, do vale de Aijalom a além de Laquis. Seu giz macio sobe a 200–450 m e é cortado por vales que correm para o oeste, até o mar: Aijalom, Soreque, Elá, Guvrin e Laquis. Esses vales eram as estradas da costa para a região montanhosa, de modo que a Sefelá era a fronteira de Judá e seu celeiro, terra de grãos, azeitonas e dos figos de sicômoro que a Bíblia menciona: Salomão fez os cedros “tão comuns quanto os sicômoros que estão na baixada”. A tradução sinodal nunca a usa como nome próprio: diz “lugares baixos”, “a baixada” ou até “o vale”."
    - "Josué lista a Sefelá entre as regiões da conquista, “a região montanhosa, o Sul, a planície”, e nomeia suas cidades de Judá: Estaol, Zorá, Jarmute, Adulão, Socó, Azeca, Libna, Laquis, Eglom, Maquedá e outras. Aqui Sansão viveu entre os filisteus de Timna, Davi enfrentou Golias no vale de Elá, e Roboão fortificou Laquis, Azeca e Adulão. Uzias tinha gado “nas terras baixas”, e sob Acaz os filisteus tinham “invadido as cidades da planície”. Miqueias veio de Moresete, nessas colinas; Jeremias previu um tempo em que se comprariam campos de novo “nas cidades da planície”. Obadias prometeu que “os da planície” possuiriam os filisteus."
    - "A Sefelá foi disputada porque era aberta. Em 701 a.C. Senaqueribe marchou por ela contra Ezequias, tomou quarenta e seis cidades muradas e mandou esculpir o cerco de Laquis nas paredes de seu palácio em Nínive. Os babilônios vieram pelo mesmo caminho; as cartas de Laquis, escritas em cacos de cerâmica enquanto Nabucodonosor se aproximava, mencionam os fogos de sinal de Azeca. Em tempos helenísticos Maressa tornou-se uma cidade iduméia e grega, e os macabeus travaram suas batalhas em Emaús e Bete-Horom, na orla norte da baixada."
    - "A arqueologia cavou fundo aqui: Laquis, Bete-Semes, Gezer, Tell es-Safi (Gate), Azeca, Tel Burna e Khirbet Qeiyafa, acima do vale de Elá, cuja cidade fortificada de cerca de 1000 a.C. é ponto de disputa sobre o reino de Davi. Hoje a Sefelá é o centro de Israel entre as colinas de Jerusalém e a planície costeira, com Beit Shemesh e Kiryat Gat como suas cidades, e Beit Guvrin-Maresha, com suas cavernas em forma de sino e túmulos pintados, é um parque nacional e, desde 2014, sítio do Patrimônio Mundial."
  de:
    - "Die Schefela, „das Tiefland“, ist der Gürtel niedriger Hügel zwischen dem Gebirge Judas und der philistäischen Ebene, etwa 15 km breit und 60 km lang vom Tal von Ajalon bis über Lachisch hinaus. Ihr weicher Kreidekalk erhebt sich auf 200–450 m und wird von Tälern zerschnitten, die nach Westen zum Meer laufen: Ajalon, Sorek, Ela, Guvrin und Lachisch. Diese Täler waren die Straßen von der Küste ins Bergland, sodass die Schefela Judas Grenzland und Kornkammer war, ein Land von Getreide, Oliven und den Maulbeerfeigen, welche die Bibel erwähnt: Salomo machte Zedernholz „so viel wie die wilden Feigenbäume in den Gründen“. Die Lutherbibel gebraucht das Wort nie als Eigennamen; sie sagt „Gründe“, „Aue“ oder auch „Tal“."
    - "Josua führt die Schefela unter den Gebieten der Eroberung auf, „auf dem Gebirge und gegen Mittag und in den Gründen“, und nennt ihre Städte Judas: Eschtaol, Zora, Jarmut, Adullam, Socho, Aseka, Libna, Lachisch, Eglon, Makkeda und andere. Hier lebte Simson unter den Philistern von Timna, David stellte sich im Tal Ela Goliat, und Rehabeam befestigte Lachisch, Aseka und Adullam. Usija hielt Vieh „in den Auen“, und unter Ahas fielen die Philister „in die Städte in der Aue“ ein. Micha stammte aus Moreschet in diesen Hügeln; Jeremia sah eine Zeit voraus, in der man wieder Äcker kaufen würde „in Städten in den Gründen“. Obadja verhieß, „die in den Gründen werden die Philister besitzen“."
    - "Um die Schefela wurde gekämpft, weil sie offen war. Im Jahr 701 v. Chr. zog Sanherib durch sie gegen Hiskia, nahm sechsundvierzig ummauerte Städte und ließ die Belagerung von Lachisch in die Wände seines Palastes in Ninive meißeln. Die Babylonier kamen denselben Weg; die Lachisch-Briefe, auf Tonscherben geschrieben, als Nebukadnezar näher rückte, erwähnen die Signalfeuer von Aseka. In hellenistischer Zeit wurde Marescha eine idumäische und griechische Stadt, und die Makkabäer führten ihre Schlachten bei Emmaus und Bet-Horon am Nordrand des Tieflands."
    - "Die Archäologie hat hier tief gegraben: Lachisch, Bet-Schemesch, Geser, Tell es-Safi (Gat), Aseka, Tel Burna und Chirbet Qeijafa über dem Tal Ela, dessen befestigte Stadt von etwa 1000 v. Chr. ein Streitpunkt um das Königreich Davids ist. Heute ist die Schefela Mittelisrael zwischen den Jerusalemer Bergen und der Küstenebene, mit Bet Schemesch und Kirjat Gat als Städten und Bet Guvrin-Marescha, mit seinen Glockenhöhlen und bemalten Gräbern, als Nationalpark und seit 2014 Welterbestätte."
  fr:
    - "La Shéphéla, « la plaine basse », est la bande de basses collines entre les montagnes de Juda et la plaine philistine, large d’environ 15 km et longue de 60 km, de la vallée d’Ajalon à bien au-delà de Lakis. Sa craie tendre s’élève à 200–450 m et est entaillée de vallées qui descendent vers la mer à l’ouest : Ajalon, Sorek, Éla, Guvrin et Lakis. Ces vallées étaient les routes de la côte vers les hautes terres, si bien que la Shéphéla était la frontière de Juda et son grenier, pays de blé, d’olives et de figues de sycomore que mentionne la Bible : Salomon rendit les cèdres aussi nombreux « que les sycomores qui croissent dans la plaine ». La Bible synodale russe ne s’en sert jamais comme nom propre : elle dit « lieux bas », « basse terre » ou même « vallée » (Louis Segond : « la plaine »)."
    - "Josué compte la Shéphéla parmi les régions de la conquête, « la montagne, le midi, la plaine et les coteaux », et nomme ses villes de Juda : Eschthaol, Tsorea, Jarmuth, Adullam, Soco, Azéka, Libna, Lakis, Églon, Makkéda et d’autres. Ici Samson vécut chez les Philistins de Thimna, David affronta Goliath dans la vallée d’Éla, et Roboam fortifia Lakis, Azéka et Adullam. Ozias avait des troupeaux « dans la plaine », et sous Achaz les Philistins « firent une invasion dans les villes de la plaine ». Michée venait de Morescheth dans ces collines ; Jérémie prévit un temps où l’on achèterait de nouveau des champs « dans les villes de la plaine ». Abdias promit que « ceux de la plaine » posséderaient le pays des Philistins."
    - "La Shéphéla fut disputée parce qu’elle était ouverte. En 701 av. J.-C., Sanchérib la traversa contre Ézéchias, prit quarante-six villes fortifiées et fit sculpter le siège de Lakis sur les murs de son palais de Ninive. Les Babyloniens vinrent par le même chemin ; les lettres de Lakis, écrites sur des tessons quand Nebucadnetsar approchait, mentionnent les feux de signal d’Azéka. À l’époque hellénistique, Marisa devint une ville iduméenne et grecque, et les Maccabées livrèrent leurs batailles à Emmaüs et à Beth-Horon, au bord nord de la plaine basse."
    - "L’archéologie y a creusé profondément : Lakis, Beth-Schémesch, Guézer, Tell es-Safi (Gath), Azéka, Tel Burna et Khirbet Qeiyafa au-dessus de la vallée d’Éla, dont la ville fortifiée d’environ 1000 av. J.-C. est un point de dispute sur le royaume de David. Aujourd’hui, la Shéphéla est le centre d’Israël entre les collines de Jérusalem et la plaine côtière, avec Beit Shemesh et Kiryat Gat pour villes, et Beit Guvrin-Maresha, avec ses grottes en cloche et ses tombes peintes, parc national et, depuis 2014, site du patrimoine mondial."
