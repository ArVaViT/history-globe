  nb: "Sjefela"
  tl: "Sephela"
body:
  en:
    - "The Shephelah, “the lowland”, is the belt of low hills between the mountains of Judah and the Philistine plain, some 15 km wide and 60 km long from the valley of Aijalon to beyond Lachish. Its soft chalk rises to 200–450 m and is cut by valleys running west to the sea: Aijalon, Sorek, Elah, Guvrin and Lachish. These valleys were the roads from the coast into the hill country, so the Shephelah was Judah's frontier and its granary, a land of grain, olives and the sycamore figs the Bible mentions: Solomon made cedars “as the sycomore trees that are in the vale”. The Synodal translation never uses it as a proper name: it says “low places”, “the lowland” or even “the valley”."
    - "Joshua lists the Shephelah among the regions of the conquest, “the hills, and of the south, and of the vale”, and names its towns of Judah: Eshtaol, Zorah, Jarmuth, Adullam, Socoh, Azekah, Libnah, Lachish, Eglon, Makkedah and others. Here Samson went down to the Philistines of Timnah, David faced Goliath in the valley of Elah, and Rehoboam fortified Lachish, Azekah and Adullam. Uzziah kept cattle “in the low country”, and under Ahaz the Philistines “invaded the cities of the low country”. Micah came from Moresheth in these hills; Jeremiah foresaw a time when fields would again be bought “in the cities of the valley”. Obadiah promised that “they of the plain” would possess the Philistines."
    - "The Shephelah was fought over because it was open. In 701 BC Sennacherib marched through it against Hezekiah, took forty-six walled towns, and had the siege of Lachish carved on the walls of his palace at Nineveh. The Babylonians came the same way; the Lachish letters, written on potsherds as Nebuchadnezzar closed in, tell of watching for the fire signals of Lachish because Azekah could no longer be seen. In Hellenistic times Marisa became an Idumean and Greek town, and the Maccabees fought their battles at Emmaus and Beth-horon on the lowland's northern edge."
    - "Archaeology has dug deeply here: Lachish, Beth-shemesh, Gezer, Tell es-Safi (Gath), Azekah, Tel Burna and Khirbet Qeiyafa above the valley of Elah, whose fortified town of about 1000 BC is a point of dispute about the kingdom of David. Today the Shephelah is central Israel between the Jerusalem hills and the coastal plain, with Beit Shemesh and Kiryat Gat as its towns, and Beit Guvrin-Maresha, with its bell caves and painted tombs, a national park and since 2014 a World Heritage site."
  ru:
    - "Шефела, «низменность», — полоса невысоких холмов между горами Иудеи и Филистимской равниной, шириной около 15 км и длиной около 60 км от долины Аиалон до земель за Лахисом. Её мягкий известняк поднимается на 200–450 м и прорезан долинами, бегущими на запад к морю: Аиалон, Сорек, Эла, Гуврин и Лахис. Эти долины были дорогами с побережья в нагорье, поэтому Шефела была и границей Иудеи, и её житницей — землёй хлеба, маслин и сикомор, о которых говорит Библия: Соломон сделал кедры равноценными «с сикоморами, растущими на низких местах». Синодальный перевод нигде не делает его названием: он говорит «низменные места», «низкие места», «низменность» и даже «долина»."
    - "Книга Иисуса Навина называет Шефелу среди земель завоевания — «всю землю нагорную и полуденную, и низменные места» — и перечисляет её города в уделе Иуды: Ештаол, Цора, Иармуф, Одоллам, Сохо, Азека, Ливна, Лахис, Еглон, Македа и другие. Здесь Самсон ходил к Филистимлянам Фимнафы, Давид вышел против Голиафа в долине Эла, а Ровоам укрепил Лахис, Азеку и Одоллам. Озия держал скот «на низменности», а при Ахазе Филистимляне «рассыпались по городам низменного края». Из Морешета в этих холмах вышел Михей; Иеремия предвидел время, когда поля вновь будут покупать «в городах низменных». Авдий обещал, что живущие «в долине» завладеют Филистимлянами."
    - "За Шефелу воевали, потому что она открыта. В 701 г. до н. э. Сеннахирим прошёл по ней против Езекии, взял сорок шесть укреплённых городов и велел высечь осаду Лахиса на стенах своего дворца в Ниневии. Тем же путём пришли Вавилоняне; письма из Лахиса, написанные на черепках, когда Навуходоносор сжимал кольцо, рассказывают, как следили за сигнальными огнями Лахиса, потому что Азеки уже не было видно. В эллинистическое время Мариса стала идумейским и греческим городом, а Маккавеи сражались при Эммаусе и Вефороне на северном краю низменности."
    - "Археологи копали здесь глубоко: Лахис, Вефсамис, Газер, Телль-эс-Сафи (Геф), Азека, Тель-Бурна и Хирбет-Кейафа над долиной Эла, чей укреплённый город около 1000 г. до н. э. стал предметом спора о царстве Давида. Сегодня Шефела — центр Израиля между Иерусалимскими горами и прибрежной равниной, с городами Бейт-Шемеш и Кирьят-Гат, а Бейт-Гуврин-Мареша с её колоколообразными пещерами и расписными гробницами — национальный парк и с 2014 года объект Всемирного наследия."
  uk:
    - "Шефела, «низовина», — смуга низьких пагорбів між горами Юди та Філістимською рівниною, завширшки близько 15 км і завдовжки 60 км — від долини Аялона до місць за Лахішем. Її м'який крейдяний ґрунт здіймається до 200–450 м і порізаний долинами, що біжать на захід до моря: Аялон, Сорек, Ела, Гуврін і Лахіш. Ці долини були дорогами з узбережжя в гірську країну, тож Шефела була кордоном Юди і її житницею — краєм зерна, оливок і сикоморових смокв, які згадує Біблія: Соломон зробив кедри такими, як «сикомори по полях». Кулішів переклад ніколи не вживає її як власну назву: він каже «поділля» чи «низини»."
    - "Книга Ісуса Навина називає Шефелу серед областей завоювання — «нагірню і полуденню й поділля» — і перелічує її міста Юди: Ештаол, Цора, Ярмут, Одолам, Сохо, Азека, Лівна, Лахіш, Еглон, Македа та інші. Тут Самсон сходив до філістимлян Тімни, Давид вийшов проти Голіята в долині Ела, а Ровоам укріпив Лахіш, Азеку й Одолам. Уззія тримав худобу «по низинах», а за Ахаза філістимляни «понабігали були в міста на низинах». З Морешета в цих пагорбах походив Міха; Єремія передбачив час, коли поля знову купуватимуть «по містах подільських». Овадія обіцяв, що подоляне «впокорять собі Филистіїв»."
    - "За Шефелу воювали, бо вона відкрита. У 701 р. до н. е. Сінаххеріб пройшов нею проти Єзекії, взяв сорок шість обнесених мурами міст і наказав вирізьбити облогу Лахіша на стінах свого палацу в Ніневії. Вавилоняни прийшли тим самим шляхом; лахішські листи, написані на черепках, коли Навуходоносор стискав кільце, розповідають, як стежили за сигнальними вогнищами Лахіша, бо Азеки вже не було видно. В елліністичну добу Маріса стала ідумейським і грецьким містом, а Макавеї провели свої бої при Еммаусі та Бет-Хороні на північному краї низовини."
    - "Археологи копали тут глибоко: Лахіш, Бет-Шемеш, Гезер, Тель-ес-Сафі (Гат), Азека, Тель-Бурна й Хірбет-Кейяфа над долиною Ела, чиє укріплене місто близько 1000 р. до н. е. є предметом суперечки про царство Давида. Сьогодні Шефела — це центральний Ізраїль між Єрусалимськими пагорбами та прибережною рівниною, з містами Бейт-Шемеш і Кір'ят-Гат, а Бейт-Гуврін-Мареша з її дзвоноподібними печерами та розписаними гробницями — національний парк і від 2014 року об'єкт Світової спадщини."
  es:
    - "La Sefelá, «la tierra baja», es la franja de colinas bajas entre las montañas de Judá y la llanura filistea, de unos 15 km de ancho y 60 km de largo desde el valle de Ajalón hasta más allá de Laquis. Su blanda creta se eleva a 200–450 m y está cortada por valles que corren al oeste hacia el mar: Ajalón, Sorek, Ela, Guvrin y Laquis. Estos valles eran los caminos de la costa a la región montañosa, de modo que la Sefelá era la frontera y el granero de Judá, una tierra de grano, olivos y los higos sicómoros que menciona la Biblia: Salomón hizo los cedros «como los cabrahigos que están por los campos en abundancia». La traducción sinodal nunca la usa como nombre propio: dice «tierras bajas», «la llanura» o incluso «el valle»."
    - "Josué enumera la Sefelá entre las regiones de la conquista, «las montañas, y del mediodía, y de los llanos», y nombra sus ciudades de Judá: Estaol, Zora, Jarmut, Adulam, Soco, Azeca, Libna, Laquis, Eglón, Maceda y otras. Aquí descendió Sansón a los filisteos de Timna, David se enfrentó a Goliat en el valle de Ela, y Roboam fortificó Laquis, Azeca y Adulam. Uzías tuvo «muchos ganados, así en los valles como en las vegas», y bajo Acaz los filisteos «se habían derramado por las ciudades de la llanura». Miqueas procedía de Moréset, en estas colinas; Jeremías previó un tiempo en que de nuevo se comprarían heredades «en las ciudades de las campiñas». Abdías prometió que poseerían «los llanos de los Palestinos»."
    - "Por la Sefelá se luchó porque estaba abierta. En 701 a. C. Senaquerib marchó a través de ella contra Ezequías, tomó cuarenta y seis ciudades amuralladas e hizo tallar el asedio de Laquis en las paredes de su palacio de Nínive. Los babilonios vinieron por el mismo camino; las cartas de Laquis, escritas en ostraca cuando Nabucodonosor se acercaba, cuentan que se vigilaban las señales de fuego de Laquis porque ya no se veía Azeca. En época helenística Maresa se convirtió en una ciudad idumea y griega, y los macabeos libraron sus batallas en Emaús y Bet-horón, en el borde norte de la tierra baja."
    - "La arqueología ha excavado a fondo aquí: Laquis, Bet-semes, Gezer, Tell es-Safi (Gat), Azeca, Tel Burna y Khirbet Qeiyafa sobre el valle de Ela, cuya ciudad fortificada de hacia 1000 a. C. es un punto de disputa sobre el reino de David. Hoy la Sefelá es el centro de Israel entre las colinas de Jerusalén y la llanura costera, con Beit Shemesh y Kiryat Gat como sus ciudades, y Beit Guvrin-Maresha, con sus cuevas en forma de campana y sus tumbas pintadas, un parque nacional y desde 2014 un sitio del Patrimonio Mundial."
  pt:
    - "A Sefelá, “a baixada”, é a faixa de colinas baixas entre as montanhas de Judá e a planície filisteia, com cerca de 15 km de largura e 60 km de comprimento, do vale de Aijalom a além de Laquis. Seu giz macio sobe a 200–450 m e é cortado por vales que correm para o oeste, até o mar: Aijalom, Soreque, Elá, Guvrin e Laquis. Esses vales eram as estradas da costa para a região montanhosa, de modo que a Sefelá era a fronteira de Judá e seu celeiro, terra de grãos, azeitonas e dos figos de sicômoro que a Bíblia menciona: Salomão fez os cedros “tão comuns quanto os sicômoros que estão na baixada”. A tradução sinodal nunca a usa como nome próprio: diz “lugares baixos”, “a baixada” ou até “o vale”."
    - "Josué lista a Sefelá entre as regiões da conquista, “a região montanhosa, o Sul, a planície”, e nomeia suas cidades de Judá: Estaol, Zorá, Jarmute, Adulão, Socó, Azeca, Libna, Laquis, Eglom, Maquedá e outras. Aqui Sansão desceu até os filisteus de Timna, Davi enfrentou Golias no vale de Elá, e Roboão fortificou Laquis, Azeca e Adulão. Uzias tinha gado “nas terras baixas”, e sob Acaz os filisteus tinham “invadido as cidades da planície”. Miqueias veio de Moresete, nessas colinas; Jeremias previu um tempo em que se comprariam campos de novo “nas cidades da planície”. Obadias prometeu que “os da planície” possuiriam os filisteus."
    - "A Sefelá foi disputada porque era aberta. Em 701 a.C. Senaqueribe marchou por ela contra Ezequias, tomou quarenta e seis cidades muradas e mandou esculpir o cerco de Laquis nas paredes de seu palácio em Nínive. Os babilônios vieram pelo mesmo caminho; as cartas de Laquis, escritas em cacos de cerâmica enquanto Nabucodonosor se aproximava, contam que se vigiavam os fogos de sinal de Laquis porque Azeca já não se avistava. Em tempos helenísticos Maressa tornou-se uma cidade iduméia e grega, e os macabeus travaram suas batalhas em Emaús e Bete-Horom, na orla norte da baixada."
    - "A arqueologia cavou fundo aqui: Laquis, Bete-Semes, Gezer, Tell es-Safi (Gate), Azeca, Tel Burna e Khirbet Qeiyafa, acima do vale de Elá, cuja cidade fortificada de cerca de 1000 a.C. é ponto de disputa sobre o reino de Davi. Hoje a Sefelá é o centro de Israel entre as colinas de Jerusalém e a planície costeira, com Beit Shemesh e Kiryat Gat como suas cidades, e Beit Guvrin-Maresha, com suas cavernas em forma de sino e túmulos pintados, é um parque nacional e, desde 2014, sítio do Patrimônio Mundial."
  de:
    - "Die Schefela, „das Tiefland“, ist der Gürtel niedriger Hügel zwischen dem Gebirge Judas und der philistäischen Ebene, etwa 15 km breit und 60 km lang vom Tal von Ajalon bis über Lachisch hinaus. Ihr weicher Kreidekalk erhebt sich auf 200–450 m und wird von Tälern zerschnitten, die nach Westen zum Meer laufen: Ajalon, Sorek, Ela, Guvrin und Lachisch. Diese Täler waren die Straßen von der Küste ins Bergland, sodass die Schefela Judas Grenzland und Kornkammer war, ein Land von Getreide, Oliven und den Maulbeerfeigen, welche die Bibel erwähnt: Salomo machte Zedernholz „so viel wie die wilden Feigenbäume in den Gründen“. Die Lutherbibel gebraucht das Wort nie als Eigennamen; sie sagt „Gründe“, „Aue“ oder auch „Tal“."
    - "Josua führt die Schefela unter den Gebieten der Eroberung auf, „auf dem Gebirge und gegen Mittag und in den Gründen“, und nennt ihre Städte Judas: Eschtaol, Zora, Jarmut, Adullam, Socho, Aseka, Libna, Lachisch, Eglon, Makkeda und andere. Hier ging Simson zu den Philistern von Timna hinab, David stellte sich im Tal Ela Goliat, und Rehabeam befestigte Lachisch, Aseka und Adullam. Usija hielt Vieh „in den Auen“, und unter Ahas fielen die Philister „in die Städte in der Aue“ ein. Micha stammte aus Moreschet in diesen Hügeln; Jeremia sah eine Zeit voraus, in der man wieder Äcker kaufen würde „in Städten in den Gründen“. Obadja verhieß, „die in den Gründen werden die Philister besitzen“."
    - "Um die Schefela wurde gekämpft, weil sie offen war. Im Jahr 701 v. Chr. zog Sanherib durch sie gegen Hiskia, nahm sechsundvierzig ummauerte Städte und ließ die Belagerung von Lachisch in die Wände seines Palastes in Ninive meißeln. Die Babylonier kamen denselben Weg; die Lachisch-Briefe, auf Tonscherben geschrieben, als Nebukadnezar näher rückte, berichten, dass man nach den Signalfeuern von Lachisch Ausschau hielt, weil Aseka nicht mehr zu sehen war. In hellenistischer Zeit wurde Marescha eine idumäische und griechische Stadt, und die Makkabäer führten ihre Schlachten bei Emmaus und Bet-Horon am Nordrand des Tieflands."
    - "Die Archäologie hat hier tief gegraben: Lachisch, Bet-Schemesch, Geser, Tell es-Safi (Gat), Aseka, Tel Burna und Chirbet Qeijafa über dem Tal Ela, dessen befestigte Stadt von etwa 1000 v. Chr. ein Streitpunkt um das Königreich Davids ist. Heute ist die Schefela Mittelisrael zwischen den Jerusalemer Bergen und der Küstenebene, mit Bet Schemesch und Kirjat Gat als Städten und Bet Guvrin-Marescha, mit seinen Glockenhöhlen und bemalten Gräbern, als Nationalpark und seit 2014 Welterbestätte."
  fr:
    - "La Shéphéla, « la plaine basse », est la bande de basses collines entre les montagnes de Juda et la plaine philistine, large d’environ 15 km et longue de 60 km, de la vallée d’Ajalon à bien au-delà de Lakis. Sa craie tendre s’élève à 200–450 m et est entaillée de vallées qui descendent vers la mer à l’ouest : Ajalon, Sorek, Éla, Guvrin et Lakis. Ces vallées étaient les routes de la côte vers les hautes terres, si bien que la Shéphéla était la frontière de Juda et son grenier, pays de blé, d’olives et de figues de sycomore que mentionne la Bible : Salomon rendit les cèdres aussi nombreux « que les sycomores qui croissent dans la plaine ». La Bible synodale russe ne s’en sert jamais comme nom propre : elle dit « lieux bas », « basse terre » ou même « vallée » (Louis Segond : « la plaine »)."
    - "Josué compte la Shéphéla parmi les régions de la conquête, « la montagne, le midi, la plaine et les coteaux », et nomme ses villes de Juda : Eschthaol, Tsorea, Jarmuth, Adullam, Soco, Azéka, Libna, Lakis, Églon, Makkéda et d’autres. Ici Samson descendit chez les Philistins de Thimna, David affronta Goliath dans la vallée d’Éla, et Roboam fortifia Lakis, Azéka et Adullam. Ozias avait des troupeaux « dans la plaine », et sous Achaz les Philistins « firent une invasion dans les villes de la plaine ». Michée venait de Morescheth dans ces collines ; Jérémie prévit un temps où l’on achèterait de nouveau des champs « dans les villes de la plaine ». Abdias promit que « ceux de la plaine » posséderaient le pays des Philistins."
    - "La Shéphéla fut disputée parce qu’elle était ouverte. En 701 av. J.-C., Sanchérib la traversa contre Ézéchias, prit quarante-six villes fortifiées et fit sculpter le siège de Lakis sur les murs de son palais de Ninive. Les Babyloniens vinrent par le même chemin ; les lettres de Lakis, écrites sur des tessons quand Nebucadnetsar approchait, racontent qu’on guettait les feux de signal de Lakis, parce qu’on ne voyait plus Azéka. À l’époque hellénistique, Marisa devint une ville iduméenne et grecque, et les Maccabées livrèrent leurs batailles à Emmaüs et à Beth-Horon, au bord nord de la plaine basse."
    - "L’archéologie y a creusé profondément : Lakis, Beth-Schémesch, Guézer, Tell es-Safi (Gath), Azéka, Tel Burna et Khirbet Qeiyafa au-dessus de la vallée d’Éla, dont la ville fortifiée d’environ 1000 av. J.-C. est un point de dispute sur le royaume de David. Aujourd’hui, la Shéphéla est le centre d’Israël entre les collines de Jérusalem et la plaine côtière, avec Beit Shemesh et Kiryat Gat pour villes, et Beit Guvrin-Maresha, avec ses grottes en cloche et ses tombes peintes, parc national et, depuis 2014, site du patrimoine mondial."
  it:
    - "La Sefela, «la pianura bassa», è la fascia di basse colline tra i monti di Giuda e la pianura filistea, larga circa 15 km e lunga 60 dalla valle di Aialon fino oltre Lachis. Il suo morbido gesso si innalza a 200–450 m ed è inciso da valli che corrono a ovest verso il mare: Aialon, Sorek, Ela, Guvrin e Lachis. Queste valli erano le strade dalla costa alla regione montuosa, per cui la Sefela era la frontiera di Giuda e il suo granaio, un paese di grano, ulivi e fichi di sicomoro che la Bibbia menziona: Salomone fece i cedri «tanto abbondanti quanto i sicomori della pianura». La traduzione sinodale non la usa mai come nome proprio: dice «luoghi bassi», «la pianura bassa» o perfino «la valle»."
    - "Giosuè elenca la Sefela tra le regioni della conquista, «la contrada montuosa, il mezzogiorno, la regione bassa», e nomina le sue città di Giuda: Estaol, Zorea, Iarmut, Adullam, Soco, Azeka, Libna, Lachis, Eglon, Makkeda e altre. Qui Sansone scese dai Filistei di Timna, Davide affrontò Golia nella valle di Ela, e Roboamo fortificò Lachis, Azeka e Adullam. Ozia scavò cisterne «nella parte bassa del paese», e sotto Acaz i Filistei «aveano invaso le città della pianura». Michea veniva da Moreset su queste colline; Geremia previde un tempo in cui si sarebbero comprati di nuovo campi «nelle città della pianura». Abdia promise che «quelli della pianura» avrebbero posseduto il paese dei Filistei."
    - "Per la Sefela si combatté perché era aperta. Nel 701 a.C. Sennacherib la attraversò contro Ezechia, prese quarantasei città fortificate e fece scolpire l’assedio di Lachis sulle pareti del suo palazzo a Ninive. I Babilonesi vennero per la stessa via; le lettere di Lachis, scritte su cocci mentre Nabucodonosor si avvicinava, raccontano che si osservavano i fuochi di segnalazione di Lachis perché Azeka non si vedeva più. In epoca ellenistica Marisa divenne una città idumea e greca, e i Maccabei combatterono le loro battaglie a Emmaus e a Bet-Oron al margine settentrionale della pianura bassa."
    - "L’archeologia ha scavato a fondo qui: Lachis, Bet-Semes, Ghezer, Tell es-Safi (Gat), Azeka, Tel Burna e Khirbet Qeiyafa sopra la valle di Ela, la cui città fortificata del 1000 a.C. circa è un punto di disputa sul regno di Davide. Oggi la Sefela è il centro di Israele tra le colline di Gerusalemme e la pianura costiera, con Beit Shemesh e Kiryat Gat come città, e Beit Guvrin-Maresha, con le sue grotte a campana e le sue tombe dipinte, parco nazionale e dal 2014 sito del Patrimonio Mondiale."
  pl:
    - "Szefela, „nizina”, to pas niskich wzgórz między górami Judy a równiną filistyńską, szeroki na około 15 km i długi na 60 km od doliny Ajjalonu po okolice za Lakisz. Jej miękka kreda wznosi się na 200–450 m i jest przecięta dolinami biegnącymi na zachód do morza: Ajjalon, Sorek, Ela, Guwrin i Lakisz. Doliny te były drogami z wybrzeża w głąb gór, więc Szefela była granicą Judy i jej spichlerzem, krajem zboża, oliwek i sykomor, które wspomina Biblia: Salomon sprawił, że cedrów było „jako sykomorów, których na polu rośnie bardzo wiele”. Przekład synodalny nigdy nie używa jej jako nazwy własnej: mówi „niskie miejsca”, „nizina” albo nawet „dolina”."
    - "Jozue wylicza Szefelę wśród okolic podboju, „ziemię górną, i południową, i polną, i podgórną”, i wymienia jej miasta Judy: Esztaol, Sora, Jarmut, Adullam, Soko, Azeka, Libna, Lakisz, Eglon, Makkeda i inne. Tu Samson schodził do Filistynów z Timny, Dawid stanął przeciw Goliatowi w dolinie Ela, a Roboam umocnił Lakisz, Azekę i Adullam. Uzzjasz trzymał bydło „w dolinach, jako i w równinach”, a za Achaza Filistyni „wtargnęli do miast w równinach”. Mika pochodził z Moreszet w tych wzgórzach; Jeremiasz przewidział czas, gdy znów będą kupować pola „w miastach na równinach”. Abdiasz obiecał, że posiądą „równinę z Filistyńczykami”."
    - "O Szefelę walczono, bo była otwarta. W 701 roku p.n.e. Sennacheryb przemaszerował przez nią przeciw Ezechiaszowi, zdobył czterdzieści sześć obwarowanych miast i kazał wyrzeźbić oblężenie Lakisz na ścianach swego pałacu w Niniwie. Babilończycy przyszli tą samą drogą; listy z Lakisz, pisane na skorupach, gdy Nabuchodonozor się zbliżał, mówią o wypatrywaniu ogniowych sygnałów Lakisz, bo Azeki nie było już widać. W czasach hellenistycznych Marisa stała się miastem idumejskim i greckim, a Machabeusze toczyli bitwy pod Emaus i Bet-Choron na północnym skraju niziny."
    - "Archeologia kopała tu głęboko: Lakisz, Bet-Szemesz, Gezer, Tell es-Safi (Gat), Azeka, Tel Burna i Chirbet Qejafa nad doliną Ela, której obwarowane miasto z około 1000 roku p.n.e. jest przedmiotem sporu o królestwo Dawida. Dziś Szefela to środkowy Izrael między wzgórzami Jerozolimy a równiną nadmorską, z miastami Bet Szemesz i Kirjat Gat, a Bet Guwrin-Maresza, z jaskiniami dzwonowymi i malowanymi grobowcami, jest parkiem narodowym i od 2014 roku obiektem światowego dziedzictwa."
  cs:
    - "Šefela, „nížina“, je pás nízkých pahorků mezi judskými horami a pelištejskou rovinou, asi 15 km široký a 60 km dlouhý od údolí Ajalon za Lachiš. Její měkká křída se zvedá do 200–450 m a je rozřezána údolími spěchajícími na západ k moři: Ajalon, Sórek, Éla, Guvrin a Lachiš. Tato údolí byla cestami od pobřeží do pahorkatiny, takže Šefela byla judskou hranicí a jeho sýpkou, zemí obilí, oliv a sykomor, které Bible zmiňuje: Šalomoun učinil cedry „jako planého fíkoví, kteréž roste v údolí u velikém množství“. Synodální překlad ji nikdy nepoužívá jako vlastní jméno: říká „nížiny“, „nížina“ či dokonce „údolí“."
    - "Jozue uvádí Šefelu mezi oblastmi dobytí, „po horách, i polední stranu, i roviny a údolí“, a jmenuje její judská města: Eštaol, Corea, Jarmut, Adulam, Sókó, Azeka, Libna, Lachiš, Eglon, Makeda a další. Zde sestoupil Samson k Pelištejcům do Timny, David čelil Goliášovi v údolí Éla a Rechabeám opevnil Lachiš, Azeku a Adulam. Uzijáš choval dobytek „jakož při údolí tak i na rovinách“ a za Achaze Pelištejci „učinili vpád do měst, na rovinách k straně polední Judstva“. Micheáš pocházel z Moreše v těchto pahorcích; Jeremjáš předvídal čas, kdy se pole znovu budou kupovat „v městech na rovinách“. Obadjáš slíbil, že „děditi budou ... i v rovině s Filistinskými“."
    - "O Šefelu se bojovalo, protože byla otevřená. Roku 701 př. n. l. jí táhl Senacherib proti Chizkijášovi, dobyl čtyřicet šest opevněných měst a nechal obléhání Lachiše vytesat na stěny svého paláce v Ninive. Babylóňané přišli toutéž cestou; lachišské dopisy, psané na střepech, když se Nebukadnesar blížil, vyprávějí, že se vyhlížely signální ohně Lachiše, protože Azeka už nebyla vidět. V helénistické době se Marisa stala idumejským a řeckým městem a Makabejští svedli své bitvy u Emauz a Bét-choronu na severním okraji nížiny."
    - "Archeologie tu kopala hluboko: Lachiš, Bét-šemeš, Gezer, Tell es-Sáfi (Gat), Azeka, Tel Burna a Chirbet Qejafa nad údolím Éla, jejíž opevněné město z asi roku 1000 př. n. l. je bodem sporu o království Davidovo. Dnes je Šefela střední Izrael mezi jeruzalémskými pahorky a pobřežní rovinou, s městy Bejt Šemeš a Kirjat Gat a s Bejt Guvrin–Marešou, s jeskyněmi tvaru zvonů a malovanými hrobkami, národním parkem a od roku 2014 památkou světového dědictví."
  nl:
    - "De Sefela, “het laagland”, is de gordel van lage heuvels tussen het gebergte van Juda en de Filistijnse vlakte, zo’n 15 km breed en 60 km lang van de vallei van Ajalon tot voorbij Lachis. Het zachte krijt rijst tot 200–450 m en wordt doorsneden door dalen die naar de zee lopen: Ajalon, Soreq, Ela, Guvrin en Lachis. Deze dalen waren de wegen van de kust het bergland in, dus de Sefela was Juda’s grens en graanschuur, een land van graan, olijven en de wilde vijgen die de Bijbel noemt: Salomo maakte de cederen “als de wilde vijgebomen, die in de laagte zijn, in menigte”. De Synodale vertaling gebruikt het nooit als eigennaam: zij zegt “laagten”, “het laagland” of zelfs “de vallei”."
    - "Jozua noemt de Sefela onder de streken van de verovering, “het gebergte, en het zuiden, en de laagte”, en geeft de steden van Juda daar: Estaol, Zora, Jarmut, Adullam, Socho, Azeka, Libna, Lachis, Eglon, Makkeda en andere. Hier ging Simson af naar de Filistijnen van Timna, trad David Goliat tegemoet in de vallei van Ela, en versterkte Rehabeam Lachis, Azeka en Adullam. Uzzia hield vee “in de laagten”, en onder Achaz waren de Filistijnen “in de steden der laagte en het zuiden van Juda ingevallen”. Micha kwam uit Moreset in deze heuvels; Jeremia voorzag een tijd waarin weer velden gekocht zouden worden “in de steden der laagte”. Obadja beloofde dat “die van de laagte” de Filistijnen zouden bezitten."
    - "Om de Sefela werd gevochten omdat ze open was. In 701 v.Chr. trok Sanherib erdoorheen tegen Chizkia, nam zesenveertig ommuurde steden in en liet het beleg van Lachis op de muren van zijn paleis te Nineve beitelen. De Babyloniërs kwamen langs dezelfde weg; de Lachis-brieven, op potscherven geschreven toen Nebukadnessar naderde, vertellen dat men uitkeek naar de seinvuren van Lachis omdat Azeka niet meer te zien was. In de hellenistische tijd werd Marisa een Idumese en Griekse stad, en de Makkabeeën voerden hun veldslagen bij Emmaüs en Beth-Horon aan de noordrand van het laagland."
    - "De archeologie heeft hier diep gegraven: Lachis, Beth-Semes, Gezer, Tell es-Safi (Gat), Azeka, Tel Burna en Khirbet Qeiyafa boven de vallei van Ela, wier versterkte stad van omstreeks 1000 v.Chr. een twistpunt is over het koninkrijk van David. Tegenwoordig is de Sefela centraal Israël tussen de heuvels van Jeruzalem en de kustvlakte, met Beit Shemesh en Kiryat Gat als steden, en Beit Guvrin-Maresha, met zijn klokgrotten en beschilderde graven, een nationaal park en sinds 2014 werelderfgoed."
  sv:
    - "Shefela, ”låglandet”, är bältet av låga kullar mellan Judas berg och den filisteiska slätten, omkring 15 km brett och 60 km långt från Ajalondalen till bortom Lakish. Dess mjuka krita reser sig till 200–450 m och skärs av dalar som löper västerut mot havet: Ajalon, Sorek, Ela, Guvrin och Lakish. Dessa dalar var vägarna från kusten in i bergslandet, så Shefela var Judas gräns och dess spannmålsbod, ett land av säd, oliver och de mullbärsfikon som Bibeln nämner: Salomo gjorde cederträ ”lika vanligt som mullbärsfikonträ i Låglandet”. Den synodala översättningen använder det aldrig som egennamn: den säger ”låga platser”, ”låglandet” eller till och med ”dalen”."
    - "Josua räknar Shefela bland erövringens regioner, ”Bergsbygden, Sydlandet, Låglandet och Bergssluttningarna”, och nämner dess städer i Juda: Eshtaol, Sora, Jarmut, Adullam, Soko, Aseka, Livna, Lakish, Eglon, Mackeda och andra. Här gick Simson ned till filistéerna i Timna, David mötte Goljat i Elaldalen, och Rehabeam befäste Lakish, Aseka och Adullam. Ussia hade boskap ”både i låglandet och på slätten”, och under Achas hade filistéerna ”fallit in i städerna i Juda lågland och sydland”. Mika kom från Moreshet i dessa kullar; Jeremia förutsåg en tid då åkrar åter skulle köpas ”i Låglandets och i Sydlandets städer”. Obadja lovade att ”Låglandets folk skall taga filistéernas land”."
    - "Shefela var omstridd eftersom den var öppen. År 701 f.Kr. marscherade Sanherib genom den mot Hiskia, intog fyrtiosex muromgärdade städer och lät belägringen av Lakish hugga i väggarna i sitt palats i Nineve. Babylonierna kom samma väg; Lakishbreven, skrivna på lerskärvor när Nebukadnessar närmade sig, berättar om att spana efter Lakishs eldsignaler eftersom Aseka inte längre kunde ses. Under hellenistisk tid blev Marisa en idumeisk och grekisk stad, och mackabeerna utkämpade sina strider vid Emmaus och Bet-Horon i låglandets norra kant."
    - "Arkeologin har grävt djupt här: Lakish, Bet-Shemesh, Geser, Tell es-Safi (Gat), Aseka, Tel Burna och Khirbet Qeiyafa ovanför Elaldalen, vars befästa stad från omkring 1000 f.Kr. är en stridsfråga om Davids kungarike. I dag är Shefela centrala Israel mellan Jerusalems berg och kustslätten, med Beit Shemesh och Kiryat Gat som sina städer, och Beit Guvrin-Maresha, med sina klockgrottor och målade gravar, en nationalpark och sedan 2014 ett världsarv."
  nb:
    - "Sjefela, «lavlandet», er beltet av lave åser mellom Judas fjell og filistersletten, omtrent 15 km bredt og 60 km langt fra Ajalon-dalen til bortenfor Lakisj. Dens myke kritt hever seg til 200–450 m og er skåret av daler som løper vestover til havet: Ajalon, Sorek, Ela, Guvrin og Lakisj. Disse dalene var veiene fra kysten inn i fjellandet, så Sjefela var Judas grense og kornkammer, et land med korn, oliven og de morbærfikenene Bibelen nevner: Salomo gjorde sedertre like alminnelig som «morbærtrærne i lavlandet». Den synodale oversettelsen bruker det aldri som egennavn: den sier «lave steder», «lavlandet» eller til og med «dalen»."
    - "Josva oppfører Sjefela blant erobringens regioner, «både fjellbygdene og sydlandet og lavlandet», og navngir byene i Juda: Esjtaol, Sora, Jarmut, Adullam, Soko, Aseka, Libna, Lakisj, Eglon, Makkeda og andre. Her gikk Samson ned til filistrene i Timna, David møtte Goliat i Ela-dalen, og Rehabeam befestet Lakisj, Aseka og Adullam. Ussia holdt buskap «i lavlandet», og under Ahas «falt [filistrene] inn i byene i Juda, både i lavlandet og i sydlandet». Mika kom fra Moreset i disse åsene; Jeremia forutså en tid da marker igjen skulle kjøpes i «byene i lavlandet». Obadja lovte at «de som bor i lavlandet» skulle ta filistrenes land."
    - "Sjefela ble kjempet om fordi den var åpen. I 701 f.Kr. marsjerte Sankerib gjennom den mot Hiskia, tok førtiseks murbygde byer og lot beleiringen av Lakisj hogge ut på veggene i palasset sitt i Ninive. Babylonerne kom samme vei; Lakisj-brevene, skrevet på potteskår mens Nebukadnesar rykket nær, forteller om å speide etter Lakisjs ildsignaler fordi Aseka ikke lenger kunne ses. I hellenistisk tid ble Marisa en idumeisk og gresk by, og makkabeerne utkjempet sine slag ved Emmaus og Bet-Horon i lavlandets nordkant."
    - "Arkeologien har gravd dypt her: Lakisj, Bet-Sjemesj, Geser, Tell es-Safi (Gat), Aseka, Tel Burna og Khirbet Qeiyafa over Ela-dalen, hvis befestede by fra omkring 1000 f.Kr. er et stridspunkt om Davids rike. I dag er Sjefela det sentrale Israel mellom Jerusalems åser og kystsletten, med Beit Shemesh og Kiryat Gat som byer, og Beit Guvrin-Maresha, med klokkehulene og de malte gravene, en nasjonalpark og siden 2014 et verdensarvsted."
  tl:
    - "Ang Sephela, “ang mababang lupain”, ay ang sinturon ng mababang burol sa pagitan ng mga bundok ng Juda at ng kapatagan ng mga Filisteo, mga 15 km ang lapad at 60 km ang haba mula sa libis ng Ajalon hanggang lampas sa Lachis. Ang malambot na tisa nito ay umaangat sa 200–450 m at hinihiwa ng mga libis na tumatakbo pakanluran sa dagat: Ajalon, Sorek, Ela, Guvrin at Lachis. Ang mga libis na ito ang mga daan mula sa baybayin patungo sa maburol na lupain, kaya ang Sephela ang hangganan at kamalig ng Juda, lupain ng butil, oliba at ng mga igos na sikomoro na binabanggit ng Bibliya: ginawa ni Salomon ang mga sedro “gaya ng mga puno ng sikomoro na nasa mababang lupa”. Hindi kailanman ginagamit ng saling Sinodal ito bilang tamang pangalan: ang sinasabi nito ay “mabababang lugar”, “ang mababang lupain” o maging “ang libis”."
    - "Inililista ni Josue ang Sephela sa mga rehiyon ng pananakop, “ang lupaing maburol, at ang Timugan, at ang mababang lupain”, at pinangangalanan ang mga bayan nito ng Juda: Estaol, Sora, Jarmuth, Adullam, Socho, Azeca, Libna, Lachis, Eglon, Maceda at iba pa. Dito bumaba si Samson sa mga Filisteo ng Timna, hinarap ni David si Goliath sa libis ng Ela, at pinatibay ni Roboam ang Lachis, Azeca at Adullam. Nag-alaga si Uzzias ng mga hayop “sa mababang lupa”, at sa ilalim ni Achaz “nilusob ng mga Filisteo ang mga bayan ng mababang lupain”. Nagmula si Mikas sa Moreset sa mga burol na ito; nakita ni Jeremias ang panahong bibilhin muli ang mga bukid “sa mga bayan ng mababang lupain”. Ipinangako ni Obadias na “silang sa mababang lupa” ay aariin ang mga Filisteo."
    - "Pinag-agawan ang Sephela dahil bukás ito. Noong 701 BK, nagmartsa si Sennacherib rito laban kay Ezechias, kinuha ang apatnapu't anim na bayang may pader, at ipinaukit ang pagkubkob sa Lachis sa mga pader ng kaniyang palasyo sa Ninive. Parehong daan ang tinahak ng mga Babilonio; ang mga liham ng Lachis, isinulat sa mga basag na palayok habang papalapit si Nabucodonosor, ay nagsasalaysay ng pagbabantay sa mga hudyat ng apoy ng Lachis dahil hindi na makita ang Azeca. Noong panahong Helenistiko, ang Marisa ay naging bayang Idumeo at Griyego, at nakipaglaban ang mga Macabeo sa Emaus at Beth-horon sa hilagang gilid ng mababang lupain."
    - "Malalim ang naging paghuhukay ng arkeolohiya rito: Lachis, Beth-semes, Gezer, Tell es-Safi (Gath), Azeca, Tel Burna at Khirbet Qeiyafa sa itaas ng libis ng Ela, na ang bayang may kuta noong mga 1000 BK ay punto ng pagtatalo tungkol sa kaharian ni David. Ang Sephela ngayon ay gitnang Israel sa pagitan ng mga burol ng Jerusalem at ng kapatagang baybayin, na ang mga bayan nito ay Beit Shemesh at Kiryat Gat, at ang Beit Guvrin-Maresha, na may mga yungib na hugis kampana at pininturahang libingan, ay pambansang liwasan at mula 2014 ay pook ng Pandaigdigang Pamana."
