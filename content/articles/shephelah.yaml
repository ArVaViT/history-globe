# Overview article (ADR 0007). Mainstream facts only; the Khirbet Qeiyafa debate is named as such. The Synodal Bible has no proper name for the region.
id: shephelah
place: af084cf
title:
  en: "Shephelah"
  ru: "Шефела"
body:
  en:
    - "The Shephelah, “the lowland”, is the belt of low hills between the mountains of Judah and the Philistine plain, some 15 km wide and 60 km long from the valley of Aijalon to beyond Lachish. Its soft chalk rises to 200–450 m and is cut by valleys running west to the sea: Aijalon, Sorek, Elah, Guvrin and Lachish. These valleys were the roads from the coast into the hill country, so the Shephelah was Judah's frontier and its granary, a land of grain, olives and the sycamore figs the Bible mentions: Solomon made cedars “as the sycomore trees that are in the vale”. The Synodal translation never uses it as a proper name: it says “low places”, “the lowland” or even “the valley”."
    - "Joshua lists the Shephelah among the regions of the conquest, “the hills, and of the south, and of the vale”, and names its towns of Judah: Eshtaol, Zorah, Jarmuth, Adullam, Socoh, Azekah, Libnah, Lachish, Eglon, Makkedah and others. Here Samson lived among the Philistines of Timnah, David faced Goliath in the valley of Elah, and Rehoboam fortified Lachish, Azekah and Adullam. Uzziah kept cattle “in the low country”, and under Ahaz the Philistines “invaded the cities of the low country”. Micah came from Moresheth in these hills; Jeremiah foresaw a time when fields would again be bought “in the cities of the valley”. Obadiah promised that “they of the plain” would possess the Philistines."
    - "The Shephelah was fought over because it was open. In 701 BC Sennacherib marched through it against Hezekiah, took forty-six walled towns, and had the siege of Lachish carved on the walls of his palace at Nineveh. The Babylonians came the same way; the Lachish letters, written on potsherds as Nebuchadnezzar closed in, mention the signal fires of Azekah. In Hellenistic times Marisa became an Idumean and Greek town, and the Maccabees fought their battles at Emmaus and Beth-horon on the lowland's northern edge."
    - "Archaeology has dug deeply here: Lachish, Beth-shemesh, Gezer, Tell es-Safi (Gath), Azekah, Tel Burna and Khirbet Qeiyafa above the valley of Elah, whose fortified town of about 1000 BC is a point of dispute about the kingdom of David. Today the Shephelah is central Israel between the Jerusalem hills and the coastal plain, with Beit Shemesh and Kiryat Gat as its towns, and Beit Guvrin-Maresha, with its bell caves and painted tombs, a national park and since 2014 a World Heritage site."
  ru:
    - "Шефела, «низменность», — полоса невысоких холмов между горами Иудеи и Филистимской равниной, шириной около 15 км и длиной около 60 км от долины Аиалон до земель за Лахисом. Её мягкий известняк поднимается на 200–450 м и прорезан долинами, бегущими на запад к морю: Аиалон, Сорек, Эла, Гуврин и Лахис. Эти долины были дорогами с побережья в нагорье, поэтому Шефела была и границей Иудеи, и её житницей — землёй хлеба, маслин и сикомор, о которых говорит Библия: Соломон сделал кедры равноценными «с сикоморами, растущими на низких местах». Синодальный перевод нигде не делает его названием: он говорит «низменные места», «низкие места», «низменность» и даже «долина»."
    - "Книга Иисуса Навина называет Шефелу среди земель завоевания — «всю землю нагорную и полуденную, и низменные места» — и перечисляет её города в уделе Иуды: Ештаол, Цора, Иармуф, Одоллам, Сохо, Азека, Ливна, Лахис, Еглон, Македа и другие. Здесь Самсон жил среди Филистимлян Фимнафы, Давид вышел против Голиафа в долине Эла, а Ровоам укрепил Лахис, Азеку и Одоллам. Озия держал скот «на низменности», а при Ахазе Филистимляне «рассыпались по городам низменного края». Из Морешета в этих холмах вышел Михей; Иеремия предвидел время, когда поля вновь будут покупать «в городах низменных». Авдий обещал, что живущие «в долине» завладеют Филистимлянами."
    - "За Шефелу воевали, потому что она открыта. В 701 г. до н. э. Сеннахирим прошёл по ней против Езекии, взял сорок шесть укреплённых городов и велел высечь осаду Лахиса на стенах своего дворца в Ниневии. Тем же путём пришли Вавилоняне; письма из Лахиса, написанные на черепках, когда Навуходоносор сжимал кольцо, упоминают сигнальные огни Азеки. В эллинистическое время Мариса стала идумейским и греческим городом, а Маккавеи сражались при Эммаусе и Вефороне на северном краю низменности."
    - "Археологи копали здесь глубоко: Лахис, Вефсамис, Газер, Телль-эс-Сафи (Геф), Азека, Тель-Бурна и Хирбет-Кейафа над долиной Эла, чей укреплённый город около 1000 г. до н. э. стал предметом спора о царстве Давида. Сегодня Шефела — центр Израиля между Иерусалимскими горами и прибрежной равниной, с городами Бейт-Шемеш и Кирьят-Гат, а Бейт-Гуврин-Мареша с её колоколообразными пещерами и расписными гробницами — национальный парк и с 2014 года объект Всемирного наследия."
