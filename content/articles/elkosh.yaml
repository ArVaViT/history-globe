# Overview article (ADR 0007). Elkosh, home of Nahum, is unidentified: Alqosh in Iraq, Jerome's Helkesei in Galilee (El-Kauzeh, the map's point), and Elkesei near Beit Jibrin (Lives of the Prophets, after Nestle) are shown without choosing; Capernaum as a proposal.
id: elkosh
