body:
  en:
    - "Elkosh is known only from the heading of the book of Nahum: “The burden of Nineveh. The book of the vision of Nahum the Elkoshite.” The word is taken to name the prophet's home town, which has not been identified. Three old traditions place it far apart. Jerome, in the prologue to his commentary on Nahum, says that the village of Helkesei in Galilee was shown to him as Elkosh; it is usually placed at El-Kauzeh in southern Lebanon, near the Israeli border, where the map sets it. Some have suggested that Capernaum, “the village of Nahum”, took its name from the prophet."
    - "The Lives of the Prophets, a Jewish work preserved in Christian copies, says that Nahum came from Elkesei “beyond Jordan towards Begabor” and was of the tribe of Simeon; Eberhard Nestle took “beyond Jordan” for a gloss and read Begabor as Betogabra, Beit Jibrin in the Judaean Shephelah, and the International Standard Bible Encyclopedia favours a southern home for the prophet. In northern Iraq, the Christian town of Alqosh, north of Mosul, keeps a tomb of Nahum inside an old synagogue, to which the Jews of Iraq came on pilgrimage, above all at Shavuot; after the last Jews left around 1951 the building decayed, and the US-based Alliance for the Restoration of Cultural Heritage stabilised it in 2018 and then restored it, helped by $500,000 pledged by the United States government in 2019."
  ru:
    - "Елкош известен только по заглавию книги Наума: «Пророчество о Ниневии; книга видений Наума Елкосеянина». Это слово понимают как указание на родной город пророка, который не отождествлён. Три старых предания помещают его далеко друг от друга. Иероним в прологе к толкованию на Наума пишет, что ему показывали в Галилее селение Хелкесей как Елкош; его обычно помещают в Эль-Каузе на юге Ливана, у израильской границы, где его и ставит карта. Некоторые предполагали, что Капернаум, «селение Наума», получил имя от пророка."
    - "«Жития пророков», иудейское сочинение, сохранившееся в христианских списках, говорят, что Наум был из Елкесея «за Иорданом к Бегабору», из колена Симеонова; Эберхард Нестле счёл слова «за Иорданом» вставкой и прочёл Бегабор как Бетогабру, Бейт-Джибрин в Иудейской Шефеле, и Международная стандартная библейская энциклопедия склоняется к южной родине пророка. На севере Ирака в христианском городе Алькош к северу от Мосула в старой синагоге показывают гробницу Наума, к которой иракские евреи совершали паломничество, особенно на Шавуот; после ухода последних евреев ок. 1951 г. здание пришло в упадок, и американский Альянс за восстановление культурного наследия укрепил его в 2018 г., а затем отреставрировал, получив 500 000 долларов, обещанных правительством США в 2019 г."
  uk:
    - "Елкош відомий лише із заголовка книги Наума: «Пророцтво про Ниневію. Книга видива Наумового, з Елкосу». Це слово вважають назвою рідного міста пророка, яке не ототожнено. Три давні традиції розміщують його далеко одне від одного. Єронім у пролозі до свого коментаря на Наума каже, що йому показували село Гелкесей у Галілеї як Елкош; його зазвичай розміщують в Ель-Каузе на півдні Лівану, поблизу ізраїльського кордону, де його й позначає мапа. Дехто припускав, що Капернаум, «село Наума», дістав назву від пророка."
    - "«Життя пророків», єврейський твір, збережений у християнських списках, каже, що Наум походив з Елкесея «за Йорданом у бік Бегабора» і був з коліна Симеона; Еберхард Нестле вважав «за Йорданом» глосою, а Бегабор читав як Бетоґабра, Бейт-Джібрін в юдейській Шефелі, і International Standard Bible Encyclopedia віддає перевагу південній батьківщині пророка. У північному Іраку християнське місто Алькош, на північ від Мосула, зберігає гробницю Наума всередині старої синагоги, куди єврейська громада Іраку приходила на прощу, насамперед на Шавуот; після того як близько 1951 р. виїхали останні євреї, будівля занепадала, а американський Альянс з відновлення культурної спадщини 2018 р. стабілізував її, а потім відреставрував за допомогою 500 000 доларів, обіцяних урядом США 2019 р."
  es:
    - "Elcos solo se conoce por el encabezamiento del libro de Nahum: «Carga de Nínive. Libro de la visión de Nahum de El-kosh». Se entiende que la palabra nombra la ciudad natal del profeta, que no ha sido identificada. Tres tradiciones antiguas la sitúan muy lejos unas de otras. Jerónimo, en el prólogo de su comentario a Nahum, dice que le mostraron como Elcos la aldea de Helcesei, en Galilea; suele situarse en El-Kauzeh, en el sur del Líbano, cerca de la frontera israelí, donde la pone el mapa. Algunos han sugerido que Cafarnaúm, «la aldea de Nahum», tomó su nombre del profeta."
    - "Las Vidas de los profetas, obra judía conservada en copias cristianas, dice que Nahum procedía de Elcesei «al otro lado del Jordán hacia Begabor» y era de la tribu de Simeón; Eberhard Nestle tomó «al otro lado del Jordán» por una glosa y leyó Begabor como Betogabra, Beit Jibrin, en la Sefelá de Judea, y la International Standard Bible Encyclopedia prefiere un hogar meridional para el profeta. En el norte de Irak, la ciudad cristiana de Alqosh, al norte de Mosul, guarda una tumba de Nahum dentro de una antigua sinagoga, adonde peregrinaban los judíos de Irak, sobre todo por Shavuot; tras marcharse los últimos judíos hacia 1951, el edificio se deterioró, y la Alliance for the Restoration of Cultural Heritage, con sede en Estados Unidos, lo estabilizó en 2018 y luego lo restauró, con ayuda de 500 000 dólares prometidos por el gobierno de Estados Unidos en 2019."
  pt:
    - "Elcós é conhecida apenas pelo título do livro de Naum: “Uma revelação sobre Nínive. O livro da visão de Naum, o elcosita.” A palavra é tomada como nome da cidade natal do profeta, que não foi identificada. Três antigas tradições a situam em lugares muito distantes entre si. Jerônimo, no prólogo de seu comentário a Naum, diz que lhe mostraram como Elcós a aldeia de Helcesei, na Galileia; ela é geralmente situada em El-Kauzeh, no sul do Líbano, perto da fronteira israelense, onde o mapa a coloca. Alguns sugeriram que Cafarnaum, “aldeia de Naum”, tomou o nome do profeta."
    - "As Vidas dos Profetas, uma obra judaica preservada em cópias cristãs, diz que Naum veio de Elcesei, “do outro lado do Jordão, em direção a Begabor”, e era da tribo de Simeão; Eberhard Nestle tomou “do outro lado do Jordão” por uma glosa e leu Begabor como Betogabra, Beit Jibrin, na Sefelá da Judeia, e a International Standard Bible Encyclopedia prefere uma terra natal do profeta no sul. No norte do Iraque, a cidade cristã de Alqosh, ao norte de Mossul, guarda um túmulo de Naum dentro de uma antiga sinagoga, à qual os judeus do Iraque iam em peregrinação, sobretudo no Shavuot; depois que os últimos judeus partiram, por volta de 1951, o edifício se deteriorou, e a Alliance for the Restoration of Cultural Heritage, sediada nos Estados Unidos, o estabilizou em 2018 e depois o restaurou, com a ajuda de 500.000 dólares prometidos pelo governo dos Estados Unidos em 2019."
  de:
    - "Elkosch ist nur aus der Überschrift des Buches Nahum bekannt: „Dies ist die Last über Ninive und das Buch der Weissagung Nahums von Elkos.“ Das Wort gilt als Name der Heimatstadt des Propheten, die nicht identifiziert ist. Drei alte Überlieferungen setzen sie weit auseinander an. Hieronymus sagt im Prolog zu seinem Nahum-Kommentar, ihm sei das Dorf Helkesei in Galiläa als Elkosch gezeigt worden; es wird gewöhnlich in El-Kausa im Südlibanon nahe der israelischen Grenze angesetzt, wo die Karte es einträgt. Manche haben vermutet, dass Kapernaum, „das Dorf Nahums“, seinen Namen vom Propheten erhielt."
    - "Die Vitae Prophetarum, ein jüdisches Werk in christlichen Abschriften, sagen, Nahum stamme aus Elkesei „jenseits des Jordan gegen Begabor“ und gehöre zum Stamm Simeon; Eberhard Nestle hielt „jenseits des Jordan“ für eine Glosse und las Begabor als Betogabra, Bet Guvrin in der judäischen Schefela, und die International Standard Bible Encyclopedia bevorzugt eine südliche Heimat des Propheten. Im Nordirak bewahrt die christliche Stadt Alkosch nördlich von Mossul in einer alten Synagoge ein Grab Nahums, zu dem die Juden des Irak pilgerten, vor allem zu Schawuot; nachdem die letzten Juden um 1951 gegangen waren, verfiel das Gebäude, und die in den USA ansässige Alliance for the Restoration of Cultural Heritage sicherte es 2018 und stellte es dann wieder her, unterstützt von 500 000 Dollar, die die Regierung der Vereinigten Staaten 2019 zugesagt hatte."
  it:
    - "Elkos è nota solo dall’intestazione del libro di Naum: «Oracolo relativo a Ninive; libro della visione di Nahum d’Elkosh». La parola è intesa come il nome della città natale del profeta, che non è stata identificata. Tre antiche tradizioni la collocano in luoghi assai distanti. Girolamo, nel prologo al suo commento a Naum, dice che gli fu mostrato come Elkos il villaggio di Elcesei in Galilea; di solito la si pone a El-Kauzeh, nel Libano meridionale, vicino al confine israeliano, dove la colloca la carta. Alcuni hanno suggerito che Cafarnao, «il villaggio di Naum», abbia preso il nome dal profeta."
    - "Le Vite dei profeti, un’opera ebraica conservata in copie cristiane, dice che Naum veniva da Elcesei «oltre il Giordano verso Begabor» ed era della tribù di Simeone; Eberhard Nestle ritenne «oltre il Giordano» una glossa e lesse Begabor come Betogabra, Beit Jibrin nella Sefela di Giudea, e la International Standard Bible Encyclopedia propende per una patria meridionale del profeta. Nell’Iraq settentrionale, la città cristiana di Alqosh, a nord di Mosul, custodisce una tomba di Naum all’interno di un’antica sinagoga, meta di pellegrinaggio degli ebrei iracheni, soprattutto a Shavuot; dopo la partenza degli ultimi ebrei verso il 1951 l’edificio si deteriorò, e l’Alliance for the Restoration of Cultural Heritage, con sede negli Stati Uniti, lo stabilizzò nel 2018 e poi lo restaurò, con l’aiuto di 500.000 dollari promessi dal governo degli Stati Uniti nel 2019."
  fr:
    - "Elkosch n’est connu que par le titre du livre de Nahum : « Oracle sur Ninive. Livre de la prophétie de Nahum, d’Elkosch. » Le mot est tenu pour le nom de la ville natale du prophète, qui n’a pas été identifiée. Trois anciennes traditions la placent en des lieux très éloignés. Jérôme, dans le prologue de son commentaire sur Nahum, dit qu’on lui montra comme Elkosch le village de Helkesei, en Galilée ; on le place d’ordinaire à El-Kauzeh, dans le sud du Liban, près de la frontière israélienne, où la carte le situe. Certains ont suggéré que Capernaüm, « le village de Nahum », a pris son nom du prophète."
    - "Les Vies des prophètes, œuvre juive conservée dans des copies chrétiennes, disent que Nahum venait d’Elkesei « au-delà du Jourdain, vers Begabor » et était de la tribu de Siméon ; Eberhard Nestle tint « au-delà du Jourdain » pour une glose et lut Begabor comme Betogabra, Beit Jibrin dans la Shéphéla de Judée, et l’International Standard Bible Encyclopedia favorise une patrie méridionale du prophète. Dans le nord de l’Irak, la ville chrétienne d’Alqosh, au nord de Mossoul, garde un tombeau de Nahum dans une ancienne synagogue, où les Juifs d’Irak venaient en pèlerinage, surtout à Shavouot ; après le départ des derniers Juifs vers 1951, le bâtiment se délabra, et l’Alliance for the Restoration of Cultural Heritage, basée aux États-Unis, le stabilisa en 2018 puis le restaura, aidée par 500 000 dollars promis par le gouvernement des États-Unis en 2019."
  nl:
    - "Elkos is alleen bekend uit het opschrift van het boek Nahum: “De last van Nineve. Het boek des gezichts van Nahum, den Elkosiet.” Het woord wordt opgevat als de naam van de woonplaats van de profeet, die niet is geïdentificeerd. Drie oude overleveringen plaatsen haar ver uiteen. Hiëronymus zegt in de proloog van zijn commentaar op Nahum dat het dorp Helkesei in Galilea hem als Elkos werd getoond; het wordt gewoonlijk gezocht bij El-Kauzeh in Zuid-Libanon, dicht bij de Israëlische grens, waar de kaart het zet. Sommigen hebben gesuggereerd dat Kafarnaüm, ‘het dorp van Nahum’, zijn naam van de profeet kreeg."
    - "De Levens van de profeten, een Joods werk dat in christelijke afschriften is bewaard, zegt dat Nahum uit Elkesei kwam, “aan de overzijde van de Jordaan richting Begabor”, en van de stam Simeon was; Eberhard Nestle hield “aan de overzijde van de Jordaan” voor een glosse en las Begabor als Betogabra, Beit Jibrin in de Sefela van Judea; de International Standard Bible Encyclopedia verkiest een zuidelijke woonplaats. In het noorden van Irak bewaart de christelijke stad Alqosh, ten noorden van Mosul, een graf van Nahum in een oude synagoge, waarheen de Joden van Irak op bedevaart kwamen, vooral met Sjavoeot; nadat de laatste Joden omstreeks 1951 vertrokken, raakte het in verval, en de Amerikaanse Alliance for the Restoration of Cultural Heritage stabiliseerde het in 2018 en herstelde het, geholpen door 500.000 dollar die de VS in 2019 toezeiden."
  cs:
    - "Elkoš je známo jen z nadpisu knihy Nachuma: „Břímě Ninive: Kniha vidění Nahuma Elkošského.“ Slovo se chápe jako jméno rodného města proroka, které nebylo určeno. Tři staré tradice je kladou daleko od sebe. Jeroným v předmluvě ke svému komentáři k Nachumovi říká, že mu byla ukázána vesnice Helkesei v Galileji jako Elkoš; obvykle se klade do El-Kaúzy v jižním Libanonu, blízko izraelské hranice, kam je klade mapa. Někteří navrhli, že Kafarnaum, „Nachumova ves“, dostalo jméno po proroku."
    - "Životy proroků, židovské dílo zachované v křesťanských opisech, říkají, že Nachum pocházel z Elkesei „za Jordánem směrem k Begaboru“ a byl z pokolení Simeonova; Eberhard Nestle pokládal „za Jordánem“ za glosu a Begabor četl jako Betogabru, Bejt Džibrín v judské Šefele, a International Standard Bible Encyclopedia dává přednost jižnímu domovu proroka. V severním Iráku uchovává křesťanské město Alkoš severně od Mosulu Nachumův hrob ve staré synagoze, kam židé z Iráku putovali, zvláště na Šavuot; poté co kolem roku 1951 odešli poslední židé, budova chátrala a americká Alliance for the Restoration of Cultural Heritage ji roku 2018 zajistila a poté obnovila, s pomocí 500 000 dolarů, jež vláda Spojených států slíbila roku 2019."
  pl:
    - "Elkosz jest znane tylko z nagłówka Księgi Nahuma: „Brzemię Niniwy. Księgi widzenia Nahuma Elkosejczyka”. Słowo to uważa się za nazwę rodzinnego miasta proroka, którego nie zidentyfikowano. Trzy dawne tradycje umieszczają je bardzo daleko od siebie. Hieronim w prologu do komentarza do Nahuma mówi, że pokazano mu jako Elkosz wieś Helkesei w Galilei; zwykle umieszcza się ją w al-Kauze w południowym Libanie, blisko granicy izraelskiej, gdzie ustawia ją mapa. Niektórzy sugerowali, że Kafarnaum, „wieś Nahuma”, wzięło nazwę od proroka."
    - "Żywoty proroków, dzieło żydowskie zachowane w chrześcijańskich odpisach, mówią, że Nahum pochodził z Elkesei „za Jordanem ku Begabor” i był z pokolenia Symeona; Eberhard Nestle uznał „za Jordanem” za glosę i czytał Begabor jako Betogabra, Bajt Dżibrin w judzkiej Szefeli, a International Standard Bible Encyclopedia opowiada się za południową ojczyzną proroka. W północnym Iraku chrześcijańskie miasto Alkosz, na północ od Mosulu, zachowuje grób Nahuma w dawnej synagodze, do której Żydzi iraccy przybywali na pielgrzymki, zwłaszcza na Szawuot; gdy około 1951 roku wyjechali ostatni Żydzi, budynek podupadł, a amerykańska Alliance for the Restoration of Cultural Heritage zabezpieczyła go w 2018 roku, a potem odnowiła, przy pomocy 500 000 dolarów zadeklarowanych przez rząd Stanów Zjednoczonych w 2019 roku."
  sv:
    - "Elkosh är bara känt från rubriken till Nahums bok: ”Detta är en utsaga om Nineve, den bok som innehåller elkositen Nahums syn.” Ordet tas som namnet på profetens hemstad, som inte har identifierats. Tre gamla traditioner placerar den långt ifrån varandra. Hieronymus säger i prologen till sin Nahumkommentar att byn Helkesei i Galileen visades för honom som Elkosh; den placeras vanligen vid El-Kauzeh i södra Libanon, nära den israeliska gränsen, där kartan sätter den. Somliga har föreslagit att Kafarnaum, ”Nahums by”, fick sitt namn efter profeten."
    - "Profeternas liv, ett judiskt verk bevarat i kristna avskrifter, säger att Nahum kom från Elkesei ”på andra sidan Jordan mot Begabor” och var av Simeons stam; Eberhard Nestle tog ”på andra sidan Jordan” för en glosa och läste Begabor som Betogabra, Beit Jibrin i Judeens Shefela, och International Standard Bible Encyclopedia förordar ett sydligt hemland för profeten. I norra Irak har den kristna staden Alqosh, norr om Mosul, en grav efter Nahum inuti en gammal synagoga, dit Iraks judar vallfärdade, framför allt vid Shavuot; sedan de sista judarna lämnat landet omkring 1951 förföll byggnaden, och den USA-baserade Alliance for the Restoration of Cultural Heritage stabiliserade den 2018 och restaurerade den sedan, med hjälp av 500 000 dollar som den amerikanska regeringen utlovade 2019."
  nb:
    - "Elkosj er bare kjent fra overskriften til Nahums bok: «Dette er et utsagn om Ninive – en bok om elkositten Nahums syn.» Ordet antas å nevne profetens hjemby, som ikke er identifisert. Tre gamle tradisjoner plasserer den langt fra hverandre. Hieronymus sier i prologen til sin kommentar til Nahum at landsbyen Helkesei i Galilea ble vist ham som Elkosj; den plasseres vanligvis ved El-Kauzeh i Sør-Libanon, nær den israelske grensen, der kartet setter den. Noen har antydet at Kapernaum, «Nahums landsby», tok navn etter profeten."
    - "Profetenes liv, et jødisk verk bevart i kristne avskrifter, sier at Nahum kom fra Elkesei «hinsides Jordan mot Begabor» og var av Simeons stamme; Eberhard Nestle regnet «hinsides Jordan» som en glose og leste Begabor som Betogabra, Beit Jibrin i den judeiske Sjefela, og International Standard Bible Encyclopedia foretrekker et sørlig hjem for profeten. I Nord-Irak har den kristne byen Alqosh, nord for Mosul, en grav for Nahum inne i en gammel synagoge, dit Iraks jøder kom på pilegrimsferd, særlig ved Shavuot; etter at de siste jødene dro omkring 1951, forfalt bygningen, og den USA-baserte Alliance for the Restoration of Cultural Heritage sikret den i 2018 og restaurerte den deretter, hjulpet av 500 000 dollar lovet av den amerikanske regjeringen i 2019."
  tl:
    - "Ang Elkos ay kilala lamang mula sa pamagat ng aklat ni Nahum: “Ang hula tungkol sa Ninive. Ang aklat tungkol sa pangitain ni Nahum na Elkoshita.” Ang salita ay itinuturing na pangalan ng bayang sinilangan ng propeta, na hindi pa natutukoy. Tatlong lumang tradisyon ang naglalagay nito sa magkakalayo. Sinasabi ni Jeronimo, sa paunang salita ng kaniyang komentaryo kay Nahum, na ipinakita sa kaniya ang nayon ng Helkesei sa Galilea bilang Elkos; karaniwan itong inilalagay sa El-Kauzeh sa katimugang Libano, malapit sa hangganan ng Israel, kung saan ito inilalagay ng mapa. Iminungkahi ng ilan na ang Capernaum, “nayon ni Nahum”, ay kumuha ng pangalan mula sa propeta."
    - "Sinasabi ng Mga Buhay ng mga Propeta, isang akdang Judio na iningatan sa mga kopyang Kristiyano, na si Nahum ay galing sa Elkesei “sa kabila ng Jordan patungong Begabor” at lipi ni Simeon; itinuring ni Eberhard Nestle na glosa ang “sa kabila ng Jordan” at binasa ang Begabor bilang Betogabra, Beit Jibrin sa Sephela ng Judea, at pinapaboran ng International Standard Bible Encyclopedia ang katimugang tahanan ng propeta. Sa hilagang Iraq, ang bayang Kristiyano ng Alqosh, sa hilaga ng Mosul, ay may libingan ni Nahum sa loob ng lumang sinagoga, na pinuntahan ng mga Judio ng Iraq sa peregrinasyon, lalo na sa Shavuot; nang umalis ang huling mga Judio noong mga 1951, nabulok ang gusali, at pinatatag ito ng US-based Alliance for the Restoration of Cultural Heritage noong 2018 at saka nagpanumbalik, sa tulong ng $500,000 na ipinangako ng pamahalaan ng Estados Unidos noong 2019."
  da:
    - "Elkosj kendes kun fra overskriften til Nahums bog: »Profeti imod Ninive; Elkositen Nahums Syns Bog.« Ordet antages at nævne profetens hjemby, som ikke er identificeret. Tre gamle traditioner placerer den langt fra hinanden. Hieronymus siger i prologen til sin kommentar til Nahum, at landsbyen Helkesei i Galilæa blev vist ham som Elkosj; den placeres sædvanligvis ved El-Kauzeh i det sydlige Libanon, nær den israelske grænse, hvor kortet sætter den. Nogle har foreslået, at Kapernaum, »Nahums landsby«, fik sit navn fra profeten."
    - "Profeternes Liv, et jødisk værk bevaret i kristne afskrifter, siger, at Nahum kom fra Elkesei »hinsides Jordan mod Begabor« og var af Simeons stamme; Eberhard Nestle tog »hinsides Jordan« for en glose og læste Begabor som Betogabra, Beit Jibrin i den judæiske Sjefela, og International Standard Bible Encyclopedia foretrækker et sydligt hjem for profeten. I det nordlige Irak har den kristne by Alqosh, nord for Mosul, en grav for Nahum inde i en gammel synagoge, hvortil Iraks jøder kom på pilgrimsfærd, især til Shavuot; efter at de sidste jøder forlod stedet omkring 1951, forfaldt bygningen, og den USA-baserede Alliance for the Restoration of Cultural Heritage stabiliserede den i 2018 og restaurerede den derefter, hjulpet af 500.000 dollars, som USA's regering lovede i 2019."
scripture:
  - Nah.1.1
sources:
  - "Jerome, Commentary on Nahum, prologue (Helkesei in Galilee)"
  - "Lives of the Prophets (Pseudo-Epiphanius), Nahum (Elkesei near Begabar, of the tribe of Simeon)"
  - "W. R. Betteridge, 'Elkoshite', International Standard Bible Encyclopedia (1915) (the three traditions; Helkesei = El-Kauzeh between Ramieh and Bint Jebeil; Nestle's Betogabra, PEFQS 1879, 136)"
  - "Wikipedia, 'Nahum' (with its references: the Alqosh tomb, ARCH's stabilisation completed January 2018, US pledge of $500,000 on 26 April 2019)"
  - "J. Neurink, 'Hebrew prophet's tomb in Iraq saved from collapse', Al-Monitor, 21 March 2018 (last Jews left in 1951)"
  - "'Close to crumbling, the tomb of an ancient prophet is saved in Kurdish Iraq', J. The Jewish News of Northern California, 22 September 2021 (Shavuot pilgrimage; ARCH and GemaArt restoration)"
