# Overview article (ADR 0007). Mainstream facts only; Zaanannim is unlocated, the candidate sites are named without a choice, and the question of which Kedesh is left open.
id: zaanannim
place: a0c4f5e
title:
  en: "Zaanannim"
  ru: "Цананним"
body:
  en:
    - "Zaanannim is known from two verses, both about a great tree. In the border of Naphtali the line ran “from Heleph, from Allon to Zaanannim”; the Hebrew is usually read as “the oak in Zaanannim”, as the Russian Synodal text has it, rather than a town called Allon. In Judges, Heber the Kenite had parted from his kin and “pitched his tent unto the plain of Zaanaim, which is by Kedesh”, again more probably “the oak of Zaanannim”. It was in this tent that his wife Jael gave the fleeing Sisera milk and killed him with a tent peg, after Barak's victory over Jabin's army by the Kishon."
    - "Nothing else is known. The oak was evidently a landmark, perhaps a sacred tree, on the edge of Naphtali, but neither it nor Zaanannim has been found, and even the Kedesh beside it is disputed: Kedesh of Naphtali in Upper Galilee is far from the battlefield, so many prefer a Kedesh near the south-western shore of the Sea of Galilee. The map's chief candidates lie in Lower Galilee between Mount Tabor and the lake, Khan et-Tujjar (Hanot Taggarim) and Khirbet Bessum, with Shajarat el-Kalb south of the lake and Lejjun by Megiddo as further proposals. None has been confirmed."
  ru:
    - "Цананним известен по двум стихам, и оба говорят о большом дереве. Граница Неффалима шла «от Хелефа и от дубравы, что в Цананниме». Еврейский текст обычно так и понимают — как дерево, а не как город Аллон, который читает здесь английская Библия короля Якова. В книге Судей Хевер Кенеянин отделился от сородичей «и раскинул шатер свой у дубравы в Цаанниме близ Кедеса». В этом шатре его жена Иаиль напоила молоком бежавшего Сисару и убила его колом от шатра после победы Варака над войском Иавина у Киссона."
    - "Больше ничего не известно. Дуб был, очевидно, приметой на краю удела Неффалима, может быть, священным деревом, но ни его, ни Цананним не нашли, и даже соседний Кедес спорен: Кедес Неффалимов в Верхней Галилее далёк от поля битвы, поэтому многие предпочитают Кедес у юго-западного берега Галилейского моря. Главные кандидаты на карте лежат в Нижней Галилее между Фавором и озером — Ханот-Таггарим (Хан-эт-Туджар) и Хирбет-Бессум; предлагали также Шаджарат-эль-Кальб к югу от озера и Леджун у Мегиддо. Ни один не подтверждён."
scripture:
