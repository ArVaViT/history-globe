body:
  en:
    - "Zaanannim is known from two verses, both about a great tree. In the border of Naphtali the line ran “from Heleph, from Allon to Zaanannim”; the Hebrew is usually read as “the oak in Zaanannim”, as the Russian Synodal text has it, rather than a town called Allon. In Judges, Heber the Kenite had parted from his kin and “pitched his tent unto the plain of Zaanaim, which is by Kedesh”, again more probably “the oak of Zaanannim”. It was in this tent that his wife Jael gave the fleeing Sisera milk and killed him with a tent peg, after Barak's victory over Jabin's army by the Kishon."
    - "Nothing else is known. The oak was evidently a landmark, perhaps a sacred tree, on the edge of Naphtali, but neither it nor Zaanannim has been found, and even the Kedesh beside it is disputed: Kedesh of Naphtali in Upper Galilee is far from the battlefield, so many prefer a Kedesh near the south-western shore of the Sea of Galilee. The map's chief candidates lie in Lower Galilee between Mount Tabor and the lake, Khan et-Tujjar (Hanot Taggarim) and Khirbet Bessum, with Shajarat el-Kalb south of the lake and Lejjun by Megiddo as further proposals. None has been confirmed."
  ru:
    - "Цананним известен по двум стихам, и оба говорят о большом дереве. Граница Неффалима шла «от Хелефа и от дубравы, что в Цананниме». Еврейский текст обычно так и понимают — как дерево, а не как город Аллон, который читает здесь английская Библия короля Якова. В книге Судей Хевер Кенеянин отделился от сородичей «и раскинул шатер свой у дубравы в Цаанниме близ Кедеса». В этом шатре его жена Иаиль напоила молоком бежавшего Сисару и убила его колом от шатра после победы Варака над войском Иавина у Киссона."
    - "Больше ничего не известно. Дуб был, очевидно, приметой на краю удела Неффалима, может быть, священным деревом, но ни его, ни Цананним не нашли, и даже соседний Кедес спорен: Кедес Неффалимов в Верхней Галилее далёк от поля битвы, поэтому многие предпочитают Кедес у юго-западного берега Галилейского моря. Главные кандидаты на карте лежат в Нижней Галилее между Фавором и озером — Ханот-Таггарим (Хан-эт-Туджар) и Хирбет-Бессум; предлагали также Шаджарат-эль-Кальб к югу от озера и Леджун у Мегиддо. Ни один не подтверждён."
  uk:
    - "Цананнім відомий із двох віршів, обидва про велике дерево. На межі Нефталима лінія йшла «від Хелефа, від дуброви, що при Заннанимі»; староєврейський текст зазвичай читають як «дуб у Цананнімі», як має й російський Синодальний текст, а не як місто Аллон. У Книзі Суддів Хевер кенеянин відділився від свого роду і «напяв був свого намета у дуброві під Заанимом, що під Кадесом», знову ж імовірніше «дуб Цананнім». У цьому наметі його дружина Яїль дала втікачеві Сісарі молока й убила його наметовим колом після перемоги Варака над військом Явіна біля Кішону."
    - "Більше нічого не відомо. Дуб був, очевидно, орієнтиром, можливо, священним деревом, на краю Нефталима, але ані його, ані Цананніма не знайдено, і навіть Кедес поряд оспорюється: Кедес Нефталимів у Верхній Галілеї далеко від поля битви, тож багато хто віддає перевагу Кедесові поблизу південно-західного берега Галілейського моря. Головні кандидати мапи лежать у Нижній Галілеї між горою Фавор і озером, Хан-ет-Туджжар (Ханот-Таггарім) і Хірбет-Бессум, а Шаджарат-ель-Кальб на південь від озера та Леджун біля Мегіддо — додаткові пропозиції. Жодне не підтверджене."
  es:
    - "Zaananim se conoce por dos versículos, ambos sobre un gran árbol. En la frontera de Neftalí la línea corría «desde Heleph, y Allón-saananim»; el hebreo suele leerse como «la encina de Zaananim», como tiene el texto sinodal ruso, y no como una ciudad llamada Alón. En Jueces, Heber el ceneo se había apartado de los suyos y «puesto su tienda hasta el valle de Zaananim, que está junto á Cedes», de nuevo más probablemente «la encina de Zaananim». En esta tienda su mujer Jael dio leche al fugitivo Sísara y lo mató con una estaca de la tienda, tras la victoria de Barac sobre el ejército de Jabín junto al Cisón."
    - "No se sabe nada más. La encina era evidentemente un hito, quizá un árbol sagrado, en el borde de Neftalí, pero ni ella ni Zaananim se han hallado, e incluso se discute la Cedes que está junto a ella: la Cedes de Neftalí, en la Alta Galilea, está lejos del campo de batalla, por lo que muchos prefieren una Cedes cerca de la orilla suroeste del Mar de Galilea. Los principales candidatos del mapa se hallan en la Baja Galilea, entre el monte Tabor y el lago, Khan et-Tujjar (Hanot Taggarim) y Khirbet Bessum, con Shajarat el-Kalb, al sur del lago, y Lejjun, junto a Meguido, como propuestas adicionales. Ninguno se ha confirmado."
  pt:
    - "Zaananim é conhecida por dois versículos, ambos sobre uma grande árvore. Na fronteira de Naftali, a linha ia “desde Helefe, desde o carvalho em Zaananim”; o hebraico costuma ser lido como “o carvalho em Zaananim”, como tem o texto sinodal russo, e não como uma cidade chamada Alom. Em Juízes, Héber, o queneu, havia se separado de seus parentes e “armado a sua tenda até o carvalho de Zaananim, que fica junto a Quedes”, de novo mais provavelmente “o carvalho de Zaananim”. Foi nessa tenda que sua mulher Jael deu leite ao fugitivo Sísera e o matou com uma estaca de tenda, depois da vitória de Baraque sobre o exército de Jabim junto ao Quisom."
    - "Nada mais se sabe. O carvalho era evidentemente um marco, talvez uma árvore sagrada, na orla de Naftali, mas nem ele nem Zaananim foram achados, e até a Quedes ao lado é discutida: Quedes de Naftali, na Alta Galileia, fica longe do campo de batalha, e por isso muitos preferem uma Quedes perto da margem sudoeste do Mar da Galileia. Os principais candidatos do mapa ficam na Baixa Galileia, entre o Monte Tabor e o lago, Khan et-Tujjar (Hanot Taggarim) e Khirbet Bessum, com Shajarat el-Kalb, ao sul do lago, e Lejjun, perto de Megido, como outras propostas. Nenhum foi confirmado."
  de:
    - "Zaanannim ist aus zwei Versen bekannt, beide über einen großen Baum. An der Grenze Naftalis verlief die Linie „von Heleph, von den Eichen bei Zaanannim an“; das Hebräische wird meist als „die Eiche in Zaanannim“ gelesen, wie es auch der russische Synodaltext hat, nicht als Stadt namens Allon. Im Buch der Richter hatte sich Heber der Keniter von seiner Sippe getrennt und „hatte seine Hütte aufgeschlagen bei den Eichen zu Zaanannim neben Kedes“, wieder wahrscheinlicher „die Eiche von Zaanannim“. In diesem Zelt gab seine Frau Jael dem fliehenden Sisera Milch und tötete ihn mit einem Zeltpflock, nach Baraks Sieg über Jabins Heer am Kischon."
    - "Mehr ist nicht bekannt. Die Eiche war offenbar ein Orientierungspunkt, vielleicht ein heiliger Baum, am Rand Naftalis, doch weder sie noch Zaanannim wurde gefunden, und selbst das Kedesch neben ihr ist umstritten: Kedesch in Naftali in Obergaliläa liegt weit vom Schlachtfeld, weshalb viele ein Kedesch nahe dem Südwestufer des Sees Genezareth bevorzugen. Die Hauptkandidaten der Karte liegen in Untergaliläa zwischen dem Tabor und dem See, Khan et-Tujjar (Hanot Taggarim) und Khirbet Bessum, mit Shajarat el-Kalb südlich des Sees und Lejjun bei Megiddo als weiteren Vorschlägen. Keiner ist bestätigt."
  fr:
    - "Tsaanannim n’est connu que par deux versets, tous deux à propos d’un grand arbre. Dans la frontière de Nephthali, la ligne courait « depuis Héleph, depuis Allon, par Tsaanannim » ; l’hébreu se lit d’ordinaire « le chêne de Tsaanannim », comme dans le texte synodal russe, plutôt qu’une ville nommée Allon. Dans les Juges, Héber le Kénien s’était séparé des siens et « avait dressé sa tente jusqu’au chêne de Tsaannaïm, près de Kédesch », là encore plus probablement « le chêne de Tsaanannim ». C’est dans cette tente que sa femme Jaël donna du lait à Sisera en fuite et le tua d’un piquet de tente, après la victoire de Barak sur l’armée de Jabin au Kison."
    - "On ne sait rien d’autre. Le chêne était manifestement un repère, peut-être un arbre sacré, au bord de Nephthali, mais ni lui ni Tsaanannim n’ont été retrouvés, et même le Kédesch voisin est discuté : le Kédesch de Nephthali en Haute Galilée est loin du champ de bataille, si bien que beaucoup préfèrent un Kédesch près de la rive sud-ouest de la mer de Galilée. Les principaux candidats de la carte se trouvent en Basse Galilée entre le mont Thabor et le lac, Khan et-Tujjar (Hanot Taggarim) et Khirbet Bessum, avec Shajarat el-Kalb au sud du lac et Lejjun près de Meguiddo comme autres propositions. Aucun n’est confirmé."
  pl:
    - "Saananim jest znane z dwóch wersetów, oba o wielkim drzewie. W granicy Neftalego linia biegła „od Helef, i od Helon, do Saannanim”; hebrajski tekst czyta się zwykle jako „dąb w Saananim”, jak ma rosyjski tekst synodalny, a nie miasto zwane Allon. W Księdze Sędziów Cheber Kenita oddzielił się od swoich i „rozbił namiot swój aż do Elon w Sananim, które jest w Kades”, znowu bardziej prawdopodobnie „dąb Saananim”. W tym namiocie jego żona Jaela dała uciekającemu Sisarze mleka i zabiła go kołkiem od namiotu, po zwycięstwie Baraka nad wojskiem Jabina nad Kiszonem."
    - "Nic więcej nie wiadomo. Dąb był najwyraźniej punktem orientacyjnym, być może drzewem świętym, na skraju Neftalego, ale ani on, ani Saananim nie zostały odnalezione, a nawet leżące obok Kedesz jest sporne: Kedesz Neftalego w Górnej Galilei leży daleko od pola bitwy, więc wielu woli Kedesz w pobliżu południowo-zachodniego brzegu Jeziora Galilejskiego. Główni kandydaci na mapie leżą w Dolnej Galilei między Górą Tabor a jeziorem, Chan et-Tudżdżar (Chanot Taggarim) i Chirbet Bessum, a Szadżarat el-Kalb na południe od jeziora i Ladżdżun koło Megiddo to dalsze propozycje. Żaden nie został potwierdzony."
  it:
    - "Zaananim è nota da due versetti, entrambi su un grande albero. Nel confine di Neftali la linea correva «da Helef, da Elon-Bezaanannim»; l’ebraico si legge di solito «la quercia in Zaananim», come ha il testo sinodale russo, piuttosto che come una città chiamata Allon. Nei Giudici, Cheber il Cheneo si era separato dai suoi e «avea piantate le sue tende fino al querceto di Tsaannaim, ch’è presso a Kades», di nuovo più probabilmente «la quercia di Zaananim». Fu in questa tenda che sua moglie Giaele diede latte al fuggiasco Sisara e lo uccise con un picchetto della tenda, dopo la vittoria di Barak sull’esercito di Iabin al Kison."
    - "Non si sa altro. La quercia era evidentemente un punto di riferimento, forse un albero sacro, al margine di Neftali, ma né essa né Zaananim sono state trovate, e anche il Kedes accanto è discusso: Kedes di Neftali nell’Alta Galilea è lontana dal campo di battaglia, per cui molti preferiscono un Kedes presso la riva sud-occidentale del lago di Tiberiade. I principali candidati della mappa si trovano nella Bassa Galilea fra il Monte Tabor e il lago, Khan et-Tujjar (Hanot Taggarim) e Khirbet Bessum, con Shajarat el-Kalb a sud del lago e Lejjun presso Meghiddo come ulteriori proposte. Nessuno è confermato."
  nl:
    - "Zaänannim is bekend uit twee verzen, beide over een grote boom. In de grens van Naftali liep de lijn “van Helef, van Allon tot Zaanannim”; het Hebreeuws wordt gewoonlijk gelezen als “de eik in Zaänannim”, zoals de Russische Synodale tekst het heeft, in plaats van een stad genaamd Allon. In Richteren had Heber de Keniet zich afgezonderd van zijn verwanten en “had zijn tenten opgeslagen tot aan den eik in Zaanaim, die bij Kedes is”, opnieuw waarschijnlijker de eik van Zaänannim. In deze tent gaf zijn vrouw Jaël de vluchtende Sisera melk en doodde hem met een tentpin, na de overwinning van Barak op het leger van Jabin bij de Kison."
    - "Verder is niets bekend. De eik was kennelijk een oriëntatiepunt, misschien een heilige boom, aan de rand van Naftali, maar noch hij noch Zaänannim is gevonden, en zelfs het Kedes ernaast wordt betwist: Kedes van Naftali in Boven-Galilea ligt ver van het slagveld, dus velen verkiezen een Kedes bij de zuidwestelijke oever van het Meer van Galilea. De voornaamste kandidaten op de kaart liggen in Beneden-Galilea tussen de berg Tabor en het meer, Khan et-Tujjar (Hanot Taggarim) en Khirbet Bessum, met Shajarat el-Kalb ten zuiden van het meer en Lejjun bij Megiddo als verdere voorstellen. Geen is bevestigd."
  cs:
    - "Caananim je známo ze dvou veršů, obou o velkém stromě. V hranici Neftalí vedla čára „od Helef a od Elon do Sananim“; hebrejština se obvykle čte „dub v Caananim“, jak to má ruský synodální text, spíše než město jménem Alon. V Soudcích se Cheber Kenijský oddělil od svých příbuzných a „rozbil stany své až k Elon v Sananim, jenž jest v Kádes“, opět spíše „dub Caananim“. V tomto stanu dala jeho žena Jáel prchajícímu Siserovi mléko a zabila ho stanovým kolíkem po Bárakově vítězství nad Jabínovým vojskem u Kíšonu."
    - "Nic dalšího není známo. Dub byl zjevně orientačním bodem, snad posvátným stromem, na okraji Neftalí, ale ani on, ani Caananim nebyly nalezeny a sporný je i Kedeš vedle něj: Kedeš Neftalího v Horní Galileji je daleko od bojiště, a proto mnozí dávají přednost Kedeši poblíž jihozápadního břehu Galilejského jezera. Hlavní kandidáti mapy leží v Dolní Galileji mezi horou Tábor a jezerem, Chán et-Tudžár (Chanot Tagarim) a Chirbet Bessúm, s Šadžarat el-Kalb jižně od jezera a Ladžúnem u Megida jako dalšími návrhy. Nic nebylo potvrzeno."
  sv:
    - "Saanannim är känt från två verser, båda om ett stort träd. I Naftalis gräns löpte linjen ”från Helef, från terebinten i Saanannim”; hebreiskan läses vanligen som ”terebinten i Saanannim”, som den ryska synodala texten har det, snarare än en stad kallad Allon. I Domarboken hade Hever keniten skilt sig från sin släkt och ”hade sina tältplatser ända till terebinten i Saannim vid Kedes”, åter sannolikare ”terebinten i Saanannim”. Det var i detta tält som hans hustru Jael gav den flyende Sisera mjölk och dödade honom med en tältpinne, efter Baraks seger över Javins här vid Kishon."
    - "Inget annat är känt. Terebinten var uppenbarligen ett landmärke, kanske ett heligt träd, vid Naftalis rand, men varken den eller Saanannim har hittats, och till och med Kedesh bredvid är omstritt: Naftalis Kedesh i Övre Galileen ligger långt från slagfältet, så många föredrar ett Kedesh nära Galileiska sjöns sydvästra strand. Kartans främsta kandidater ligger i Nedre Galileen mellan Tabor och sjön, Khan et-Tujjar (Hanot Taggarim) och Khirbet Bessum, med Shajarat el-Kalb söder om sjön och Lejjun vid Megiddo som ytterligare förslag. Ingen har bekräftats."
  nb:
    - "Saanannim er kjent fra to vers, begge om et stort tre. I Naftalis grense løp linjen «fra Helef, fra eken ved Sa'anannim»; det hebraiske leses vanligvis som «eken ved Saanannim», slik den russiske synodalteksten har det, snarere enn en by kalt Allon. I Dommerne hadde keniteren Heber skilt seg fra sin slekt og «flyttet med sine telt like til Sa'ana'im-eken ved Kedes», igjen mer sannsynlig «eken ved Saanannim». Det var i dette teltet hans hustru Jael ga den flyktende Sisera melk og drepte ham med en teltplugg, etter Baraks seier over Jabins hær ved Kisjon."
    - "Ingenting annet er kjent. Eken var åpenbart et landemerke, kanskje et hellig tre, i utkanten av Naftali, men verken den eller Saanannim er funnet, og selv Kedesj ved siden av er omstridt: Kedesj i Naftali i Øvre Galilea ligger langt fra slagmarken, så mange foretrekker et Kedesj nær den sørvestlige bredden av Galileasjøen. Kartets viktigste kandidater ligger i Nedre Galilea mellom Tabor og innsjøen, Khan et-Tujjar (Hanot Taggarim) og Khirbet Bessum, med Shajarat el-Kalb sør for innsjøen og Lejjun ved Megiddo som ytterligere forslag. Ingen er bekreftet."
  tl:
    - "Kilala ang Saananim mula sa dalawang talata, parehong tungkol sa dakilang puno. Sa hangganan ng Nephtali, ang guhit ay “mula sa Heleph, mula sa encina sa Saananim”; karaniwang binabasa ang Hebreo bilang “encina sa Saananim”, gaya ng sa tekstong Synodal na Ruso, sa halip na bayang tinatawag na Allon. Sa Mga Hukom, humiwalay si Heber na Cineo sa kaniyang kamag-anak at “itinayo ang kaniyang tolda hanggang sa encina sa Zaananim, na nasa siping ng Cedes”, na muli, mas malamang, ay “encina sa Zaananim”. Sa tolda ring ito binigyan ni Jael, asawa niya, ng gatas ang tumatakas na si Sisara at pinatay siya ng tulos ng tolda, matapos ang tagumpay ni Barac laban sa hukbo ni Jabin sa Cison."
    - "Wala nang iba pang nalalaman. Ang encina ay malinaw na palatandaan, marahil sagradong puno, sa gilid ng Nephtali, ngunit hindi pa natatagpuan ito o ang Saananim, at pinagtatalunan pa maging ang Cedes sa tabi nito: ang Cedes ng Nephtali sa Itaas na Galilea ay malayo sa larangan ng labanan, kaya mas gusto ng marami ang isang Cedes malapit sa timog-kanlurang baybayin ng Dagat ng Galilea. Ang mga pangunahing kandidato ng mapa ay nasa Mababang Galilea sa pagitan ng Bundok Tabor at ng lawa, ang Khan et-Tujjar (Hanot Taggarim) at Khirbet Bessum, at ang Shajarat el-Kalb sa timog ng lawa at Lejjun sa tabi ng Megiddo bilang karagdagang mungkahi. Walang nakumpirma."
  da:
    - "Sa'anannim kendes fra to vers, begge om et stort træ. I Naftalis grænse løb linjen »fra Helef, fra Egen i Zaanannim«; det hebraiske læses sædvanligvis som »egen i Sa'anannim«, som den russiske Synodaltekst har det, snarere end en by kaldet Allon. I Dommerbogen havde keniten Heber skilt sig fra sine slægtninge og »slog sit Telt op indtil Lunden i Zaannaim, som er ved Kedes«, igen sandsynligere »egen i Sa'anannim«. Det var i dette telt, at hans hustru Jael gav den flygtende Sisera mælk og dræbte ham med en teltpløk, efter Baraks sejr over Jabins hær ved Kisjon."
    - "Mere vides ikke. Egen var åbenbart et landemærke, måske et helligt træ, på kanten af Naftali, men hverken den eller Sa'anannim er fundet, og selv Kedesj ved siden af er omstridt: Kedesj i Naftali i Øvre Galilæa ligger langt fra slagmarken, så mange foretrækker et Kedesj nær Genesaret Søs sydvestlige bred. Kortets vigtigste kandidater ligger i Nedre Galilæa mellem Tabor og søen, Khan et-Tujjar (Hanot Taggarim) og Khirbet Bessum, med Shajarat el-Kalb syd for søen og Lejjun ved Megiddo som yderligere forslag. Ingen er bekræftet."
  sr:
    - "Сананим је познат из два стиха, оба о једном великом дрвету. У граници Нефталимовој линија је ишла „од Елафа и од Алона до Сананима“; хебрејски се обично чита као „храст у Сананиму“, као што има руски синодски текст, а не као град по имену Алон. У Књизи о судијама Евер Кенејин се одвојио од рода и „беше разапео свој шатор код храстова занајимских, а то је код Кедеса“, опет вероватније „храст Сананимски“. У овом шатору његова жена Јаиља дала је бегунцу Сисари млека и убила га клином од шатора, после Варакове победе над Јавиновом војском на Кисону."
    - "Ништа друго није познато. Храст је очигледно био обележје, можда свето дрво, на ободу Нефталима, али ни он ни Сананим нису нађени, а спорно је чак и Кедес крај њега: Кедес Нефталимов у Горњој Галилеји далеко је од бојног поља, па многи радије узимају Кедес близу југозападне обале Галилејског мора. Главни кандидати на карти леже у Доњој Галилеји између Тавора и језера, Хан ет Туџар (Ханот Тагарим) и Хирбет Бесум, а Шаџарат ел Калб јужно од језера и Леџун код Мегида су даљи предлози. Ниједан није потврђен."
  hu:
    - "Caanannim két versből ismert, mindkettő egy nagy fáról szól. Naftáli határában a vonal így futott: „Heleftől, Elontól fogva Czaanannimnál”; a héber szöveget általában „a caanannimi tölgy”-ként olvassák, ahogy az orosz szinodális szöveg is, nem pedig Allon nevű városként. A Bírák könyvében Héber, a keneus elvált rokonaitól, és „sátorát a Saanaim tölgyesénél vonta fel, mely Kedes mellett van”, ismét inkább „a caanannimi tölgy”. Ebben a sátorban adott Jáél, Héber felesége tejet a menekülő Siserának, és ölte meg sátorcölöppel, miután Bárák a Kisonnál legyőzte Jábin seregét."
    - "Másról nem tudunk. A tölgy nyilván tájékozódási pont volt, talán szent fa, Náftáli szélén, de sem az, sem Caanannim nem került elő, és még a mellette lévő Kedes is vitatott: a Felső-Galileában lévő naftáli Kedes messze van a csatatértől, ezért sokan inkább a Galileai-tenger délnyugati partjához közeli Kedest részesítik előnyben. A térkép fő jelöltjei Alsó-Galileában, a Tábor-hegy és a tó között fekszenek, a Khán et-Tuddzsár (Hanót Taggárim) és a Khirbet Besszúm, további javaslatként a tótól délre fekvő Sadzsarat el-Kalb és a Megiddó melletti Ledzsdzsún. Egyiket sem erősítették meg."
  fi:
    - "Saananim tunnetaan kahdesta jakeesta, jotka molemmat koskevat suurta puuta. Naftalin rajalla linja kulki ”Heelefistä, Saanannimin tammesta”; heprea luetaan yleensä Saananimin tammeksi, kuten Venäjän synodaalinen teksti, eikä Allon-nimiseksi kaupungiksi. Tuomarien kirjassa keeniläinen Heber oli eronnut heimolaisistaan ja ”oli telttaansa pystytellen tullut aina Saanaimin tammelle asti, joka on Kedeksen luona”, jälleen todennäköisemmin Saananimin tammi. Tässä teltassa hänen vaimonsa Jael antoi pakenevalle Siseralle maitoa ja tappoi hänet telttavaarnalla Baarakin voitettua Jabinin armeijan Kisonilla."
    - "Muuta ei tiedetä. Tammi oli ilmeisesti maamerkki, ehkä pyhä puu, Naftalin laidalla, mutta ei se eikä Saananim ole löytynyt, ja jopa sen vieressä oleva Kedes on kiistanalainen: Naftalin Kedes Ylä-Galileassa on kaukana taistelukentältä, joten monet pitävät parempana Galileanjärven lounaisrannan lähellä olevaa Kedesiä. Kartan pääehdokkaat ovat Ala-Galileassa Taborvuoren ja järven välissä, Khan et-Tujjar (Hanot Taggarim) ja Khirbet Bessum, ja lisäehdotuksina Shajarat el-Kalb järven eteläpuolella ja Lejjun Megiddon luona. Mitään ei ole vahvistettu."
  vi:
    - "Xa-na-nim được biết qua hai câu, cả hai về một cây lớn. Trong biên giới Nép-ta-li, đường ranh chạy “từ Hê-lép, từ cây dẻ bộp ở tại Sa-na-im”; từ Hê-bơ-rơ thường được đọc là “cây sồi ở Xa-na-nim”, như bản Synodal Nga có, hơn là một thị trấn tên A-lôn. Trong Các Quan Xét, Hê-be người Kê-nít đã lìa khỏi dân mình và “đi dựng trại mình ở về cây dẻ bộp Sa-na-im, gần bên Kê-đe”, cũng nhiều khả năng là “cây sồi của Xa-na-nim”. Trong cái trại này, vợ ông là Gia-ên đã cho Si-sê-ra đang chạy trốn uống sữa và giết hắn bằng cọc lều, sau chiến thắng của Ba-rác trước đạo quân của Gia-bin bên Ki-sôn."
    - "Không biết gì thêm. Cây hiển nhiên là một mốc, có lẽ là một cây thiêng, ở rìa Nép-ta-li, nhưng cả nó lẫn Xa-na-nim đều chưa tìm thấy, và ngay cả Kê-đe bên cạnh cũng tranh cãi: Kê-đe của Nép-ta-li ở Thượng Ga-li-lê xa chiến trường, nên nhiều người ưa một Kê-đe gần bờ tây nam Biển Ga-li-lê. Các ứng viên chính của bản đồ nằm ở Hạ Ga-li-lê giữa Núi Tha-bô và hồ, Khan et-Tujjar (Hanot Taggarim) và Khirbet Bessum, với Shajarat el-Kalb phía nam hồ và Lejjun cạnh Mê-ghi-đô là các đề nghị khác. Chưa nơi nào được xác nhận."
  ro:
    - "Țaananim este cunoscut din două versete, amândouă despre un copac mare. În hotarul lui Neftali, linia mergea „Meelef, Olam, Seenanim”; ebraica este citită de obicei ca „stejarul din Țaananim”, cum are textul sinodal rus, și nu ca un oraș numit Alon. În Judecători, Heber cheneul se despărțise de neamul său și, în cuvintele cărții, „a fost întins cortul său până la stejarul de popaz, care este alăturea cu Chedes”, din nou mai degrabă „stejarul din Țaananim”. În acest cort, soția lui, Iael, i-a dat lapte lui Sisera fugar și l-a ucis cu un țăruș de cort, după victoria lui Barac asupra armatei lui Iabin la Chison."
    - "Nimic altceva nu se știe. Stejarul era evident un reper, poate un copac sacru, la marginea lui Neftali, dar nici el, nici Țaananim nu au fost găsiți, și chiar Chedeșul de lângă el este disputat: Chedeșul lui Neftali din Galileea de Sus este departe de câmpul de luptă, așa că mulți preferă un Chedeș de lângă țărmul sud-vestic al Mării Galileii. Principalii candidați ai hărții se află în Galileea de Jos, între Muntele Tabor și lac, Khan et-Tujjar (Hanot Taggarim) și Khirbet Bessum, iar Shajarat el-Kalb, la sud de lac, și Lejjun, lângă Meghido, sunt alte propuneri. Niciunul nu a fost confirmat."
  bg:
    - "Цананим е известен от два стиха, и двата за едно голямо дърво. По границата на Нефталим линията минавала „от Елеф, от Алон близу при Саананим“; еврейският текст обикновено се чете като „дъба в Цананим“, както го предава руският Синодален текст, а не като град на име Алон. В Съдии Хевер Кенеецът се бил отделил от рода си и „беше поставил шатъра си до дъба на Заанаима, който е близу при Кадис“ — отново по-вероятно „дъба на Цананим“. Именно в този шатър жена му Яил дала мляко на бягащия Сисара и го убила с кол от шатъра, след победата на Варак над войската на Явин при Кисон."
    - "Нищо друго не се знае. Дъбът очевидно е бил ориентир, може би свещено дърво, на края на Нефталим, но нито той, нито Цананим са намерени, а и Кедес до него е спорен: Кедес Нефталимов в Горна Галилея е далеч от бойното поле, затова мнозина предпочитат Кедес близо до югозападния бряг на Галилейското езеро. Главните кандидати на картата лежат в Долна Галилея между планината Тавор и езерото — Хан ет-Туджар (Ханот Тагарим) и Хирбет Бесум, а Шаджарат ел-Калб южно от езерото и Леджун при Мегидо са допълнителни предложения. Нито едно не е потвърдено."
