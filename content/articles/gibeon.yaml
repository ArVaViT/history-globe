body:
  en:
    - "Gibeon is el-Jib, a village on a hill about 9 km north-west of Jerusalem in the land of Benjamin. The identification, suggested in the nineteenth century from the name, was confirmed when James B. Pritchard of the University of Pennsylvania, who dug here in five seasons from 1956 to 1962, found jar handles inscribed with the name Gibeon. Caves and tombs cut in the rock of the hill held pottery and burials of the Early and Middle Bronze Ages. Pharaoh Shishak's list of towns at Karnak names Gibeon among the places of his campaign in the late tenth century BC."
    - 'The Book of Joshua calls Gibeon "a great city, as one of the royal cities". Its people, hearing what Joshua had done to Jericho and Ai, came to him at Gilgal with old sacks and torn wineskins as if from a far country, and won a league; when the trick came out, they were made hewers of wood and drawers of water. Five Amorite kings then besieged Gibeon, Joshua came to its help and routed them, and said, "Sun, stand thou still upon Gibeon". Later Gibeon was one of the towns of Benjamin given to the priests, the sons of Aaron.'
    - 'By the pool of Gibeon the men of Abner and of Joab met, and twelve from each side fell together; later Joab killed Amasa at the great stone in Gibeon. Saul had sought to destroy the Gibeonites, and in David''s day a famine was laid to it. The tabernacle stood on the great high place at Gibeon; there Solomon offered a thousand burnt offerings, and the LORD appeared to him in a dream. Hananiah, the prophet who opposed Jeremiah, came from Gibeon; Johanan overtook Ishmael "by the great waters that are in Gibeon"; and men of Gibeon helped rebuild the wall of Jerusalem under Nehemiah.'
    - "Pritchard cleared a great round pool cut into the rock, from which a stepped tunnel led some 13 m further down to a water chamber at the water table; many link it with the pool of 2 Samuel, though its date is debated. In the late Iron Age Gibeon made wine: more than two dozen jar handles bear the town's name and the names of their owners, dated to the eighth–seventh centuries BC, by some to the sixth. In AD 66 the Roman governor Cestius Gallus camped at Gabao, fifty furlongs from Jerusalem, and fell back there in his retreat. Eusebius still knew a village of the same name."
  ru:
    - "Гаваон — это Эль-Джиб, селение на холме примерно в 9 км к северо-западу от Иерусалима, в земле Вениамина. Отождествление, предложенное ещё в XIX веке по сходству названия, подтвердилось, когда Джеймс Б. Притчард из Пенсильванского университета, копавший здесь пять сезонов с 1956 по 1962 г., нашёл ручки кувшинов с надписью «Гаваон». В пещерах и гробницах, высеченных в скале холма, найдены керамика и погребения раннего и среднего бронзового века. Список городов фараона Сусакима в Карнаке называет Гаваон среди мест его похода в конце X века до н. э."
    - "Книга Иисуса Навина называет Гаваон городом большим, «как один из царских городов». Его жители, услышав, что Иисус сделал с Иерихоном и Гаем, пришли к нему в Галгал с ветхими мешками и изорванными мехами, будто из дальней земли, и добились союза; когда обман открылся, их сделали дровосеками и водоносами. Тогда пять царей Аморрейских осадили Гаваон, Иисус пришёл ему на помощь и разбил их и сказал: «стой, солнце, над Гаваоном». Позже Гаваон был среди городов колена Вениаминова, отданных священникам, сынам Аарона."
    - "У Гаваонского пруда встретились люди Авенира и Иоава, и по двенадцать с каждой стороны пали вместе; позже Иоав убил Амессая у большого камня, что у Гаваона. Саул хотел истребить гаваонитян, и во дни Давида голод был послан за это. Скиния стояла на высоте в Гаваоне; там Соломон вознёс тысячу всесожжений, и Господь явился ему во сне. Из Гаваона был пророк Анания, противившийся Иеремии; Иоанан настиг Исмаила «у больших вод, в Гаваоне»; а жители Гаваона помогали чинить стену Иерусалима при Неемии."
    - "Притчард расчистил большой круглый водоём, высеченный в скале, из которого ступенчатый туннель вёл ещё примерно на 13 м вниз к камере с водой на уровне грунтовых вод; многие связывают его с прудом из Второй книги Царств, хотя его датировка спорна. В конце железного века в Гаваоне делали вино: более чем на двух десятках ручек кувшинов стоят имя города и имена их владельцев; их датируют VIII–VII веками до н. э., некоторые — VI веком. В 66 г. н. э. римский наместник Цестий Галл стал лагерем у Габао, в пятидесяти стадиях от Иерусалима, и отступил туда при отходе. Евсевий ещё знал селение с тем же названием."
  uk:
    - "Гаваон — це ель-Джиб, село на пагорбі приблизно за 9 км на північний захід від Єрусалима в землі Веніямина. Ототожнення, запропоноване в XIX ст. за назвою, підтвердилося, коли Джеймс Б. Прічард з Пенсильванського університету, який розкопував тут п’ять сезонів з 1956 по 1962 рік, знайшов ручки глеків із написаною назвою Гаваон. Печери й гробниці, вирубані в скелі пагорба, містили кераміку та поховання раннього й середнього бронзового віку. Список міст фараона Сусакіма в Карнаку називає Гаваон серед місць його походу наприкінці X ст. до н. е."
    - "Книга Ісуса Навина називає Гаваон «город великий, як звичайно місто царське». Його мешканці, почувши, що Ісус Навин вчинив з Єрихоном та Аєм, прийшли до нього в Гілгал зі старими торбами й подертими бурдюками, наче з далекої країни, і здобули союз; коли хитрощі вийшли на яв, їх зробили дроворубами й водоносами. П’ять аморейських царів тоді обложили Гаваон, Ісус Навин прийшов йому на допомогу й розбив їх і сказав: «Сонце, стій над Габаоном». Пізніше Гаваон був одним із міст Веніямина, даних священикам, синам Аарона."
    - "Біля ставу Гаваона зустрілися люди Авеніра та Йоава, і з кожного боку впало по дванадцятеро; пізніше Йоав убив Амасу біля великого каменя в Гаваоні. Саул намагався знищити гаваонців, і за Давида голод пояснили саме цим. Скинія стояла на великій висоті в Гаваоні; там Соломон приніс тисячу всепалень, і Господь з’явився йому вві сні. Хананія, пророк, що виступив проти Єремії, був із Гаваона; Йоханан наздогнав Ізмаїла «коло великого ставу під Габаоном»; а люди з Гаваона допомагали відбудовувати мур Єрусалима за Неемії."
    - "Прічард розчистив великий круглий став, вирубаний у скелі, від якого сходовий тунель вів приблизно на 13 м глибше до водяної камери на рівні ґрунтових вод; багато хто пов’язує його зі ставом із Другої книги Самуїла, хоча його датування спірне. Наприкінці залізного віку Гаваон виробляв вино: понад два десятки ручок глеків мають назву міста й імена їх власників і датуються VIII–VII ст. до н. е., за деякими — VI ст. 66 р. н. е. римський намісник Цестій Галл отаборився в Габао, за п’ятдесят стадій від Єрусалима, і відступив туди під час свого відходу. Євсевій ще знав село з такою самою назвою."
  es:
    - "Gabaón es el-Jib, una aldea sobre una colina a unos 9 km al noroeste de Jerusalén, en la tierra de Benjamín. La identificación, sugerida en el siglo XIX a partir del nombre, quedó confirmada cuando James B. Pritchard, de la Universidad de Pensilvania, que excavó aquí en cinco campañas entre 1956 y 1962, halló asas de jarras con el nombre de Gabaón inscrito. Cuevas y tumbas excavadas en la roca de la colina contenían cerámica y enterramientos de las Edades del Bronce Antiguo y Medio. La lista de ciudades del faraón Sisac en Karnak nombra Gabaón entre los lugares de su campaña de fines del siglo X a. C."
    - "El libro de Josué llama a Gabaón «una gran ciudad, como una de las ciudades reales». Sus habitantes, al oír lo que Josué había hecho a Jericó y a Hai, fueron a él, a Gilgal, con sacos viejos y odres rotos como si vinieran de un país lejano, y obtuvieron una alianza; cuando se descubrió el engaño, fueron hechos leñadores y aguadores. Cinco reyes amorreos sitiaron entonces Gabaón, Josué acudió en su ayuda y los derrotó, y dijo: «Sol, detente en Gabaón». Más tarde Gabaón fue una de las ciudades de Benjamín dadas a los sacerdotes, hijos de Aarón."
    - "Junto al estanque de Gabaón se encontraron los hombres de Abner y de Joab, y cayeron juntos doce de cada bando; más tarde Joab mató a Amasa junto a la gran peña de Gabaón. Saúl había procurado exterminar a los gabaonitas, y en tiempos de David se les atribuyó un hambre. El tabernáculo estuvo en el gran alto de Gabaón; allí ofreció Salomón mil holocaustos, y el Señor se le apareció en sueños. Hananías, el profeta que se opuso a Jeremías, era de Gabaón; Johanán alcanzó a Ismael «junto á Aguas-muchas, que es en Gabaón»; y hombres de Gabaón ayudaron a reconstruir el muro de Jerusalén bajo Nehemías."
    - "Pritchard despejó un gran estanque redondo excavado en la roca, del que un túnel con escalones descendía unos 13 m más hasta una cámara de agua al nivel freático; muchos lo vinculan con el estanque de 2 Samuel, aunque su fecha se discute. A fines de la Edad del Hierro Gabaón producía vino: más de dos docenas de asas de jarras llevan el nombre de la población y los nombres de sus dueños, y se fechan en los siglos VIII–VII a. C., según algunos en el VI. En el 66 d. C. el gobernador romano Cestio Galo acampó en Gabao, a cincuenta estadios de Jerusalén, y allí se replegó en su retirada. Eusebio conoció aún una aldea del mismo nombre."
  pt:
    - "Gibeão é el-Jib, uma aldeia numa colina a cerca de 9 km a noroeste de Jerusalém, na terra de Benjamim. A identificação, sugerida no século XIX a partir do nome, foi confirmada quando James B. Pritchard, da Universidade da Pensilvânia, que escavou aqui em cinco temporadas de 1956 a 1962, achou alças de jarros inscritas com o nome de Gibeão. Cavernas e tumbas talhadas na rocha da colina continham cerâmica e sepultamentos do Bronze Antigo e Médio. A lista de cidades do faraó Sisaque em Karnak nomeia Gibeão entre os lugares de sua campanha no fim do século X a.C."
    - "O livro de Josué chama Gibeão “uma grande cidade, como uma das cidades reais”. Seu povo, ouvindo o que Josué fizera a Jericó e a Ai, foi a ele em Gilgal com sacos velhos e odres rotos, como de uma terra distante, e obteve uma aliança; quando o ardil se descobriu, foram feitos rachadores de lenha e tiradores de água. Cinco reis amorreus cercaram então Gibeão, Josué veio em seu socorro e os derrotou, e disse: “Sol, pare sobre Gibeom!” Mais tarde Gibeão foi uma das cidades de Benjamim dadas aos sacerdotes, filhos de Arão."
    - "Junto ao tanque de Gibeão se encontraram os homens de Abner e de Joabe, e doze de cada lado caíram juntos; mais tarde Joabe matou Amasa junto à grande pedra em Gibeão. Saul procurara destruir os gibeonitas, e nos dias de Davi uma fome foi atribuída a isso. O tabernáculo ficava no grande alto de Gibeão; ali Salomão ofereceu mil holocaustos, e o SENHOR lhe apareceu em sonho. Hananias, o profeta que se opôs a Jeremias, era de Gibeão; Joanã alcançou Ismael “junto às grandes águas que estão em Gibeão”; e homens de Gibeão ajudaram a reconstruir a muralha de Jerusalém sob Neemias."
    - "Pritchard desobstruiu um grande tanque redondo escavado na rocha, do qual um túnel em degraus descia cerca de 13 m mais fundo até uma câmara de água no lençol freático; muitos o ligam ao tanque de 2 Samuel, embora a sua data seja debatida. No fim da Idade do Ferro, Gibeão fazia vinho: mais de duas dúzias de alças de jarros trazem o nome da cidade e os nomes de seus donos, datadas dos séculos VIII–VII a.C., por alguns do VI. Em 66 d.C., o governador romano Céstio Galo acampou em Gabao, a cinquenta estádios de Jerusalém, e para lá recuou em sua retirada. Eusébio ainda conheceu uma aldeia do mesmo nome."
  de:
    - "Gibeon ist el-Dschib, ein Dorf auf einem Hügel etwa 9 km nordwestlich von Jerusalem im Land Benjamin. Die im 19. Jahrhundert aus dem Namen erschlossene Gleichsetzung wurde bestätigt, als James B. Pritchard von der University of Pennsylvania, der hier von 1956 bis 1962 in fünf Kampagnen grub, Krughenkel mit der Aufschrift Gibeon fand. In den Fels des Hügels gehauene Höhlen und Gräber enthielten Keramik und Bestattungen der Früh- und Mittelbronzezeit. Die Städteliste des Pharaos Schischak in Karnak nennt Gibeon unter den Orten seines Feldzugs im späten 10. Jahrhundert v. Chr."
    - "Das Buch Josua nennt Gibeon „eine große Stadt wie eine königliche Stadt“. Seine Bewohner kamen, als sie hörten, was Josua mit Jericho und Ai gemacht hatte, mit alten Säcken und zerrissenen Weinschläuchen wie aus fernem Land zu ihm nach Gilgal und erwirkten einen Bund; als der Trug herauskam, wurden sie zu Holzhauern und Wasserträgern gemacht. Fünf Amoriterkönige belagerten dann Gibeon, Josua kam ihm zu Hilfe und schlug sie und sprach: „Sonne, stehe still zu Gibeon“. Später war Gibeon eine der Städte Benjamins, die den Priestern, den Söhnen Aarons, gegeben wurden."
    - "Am Teich von Gibeon trafen die Männer Abners und Joabs aufeinander, und zwölf von jeder Seite fielen zugleich; später tötete Joab Amasa am großen Stein zu Gibeon. Saul hatte die Gibeoniter zu vernichten gesucht, und zu Davids Zeit wurde eine Hungersnot darauf zurückgeführt. Die Stiftshütte stand auf der großen Höhe von Gibeon; dort opferte Salomo tausend Brandopfer, und der HERR erschien ihm im Traum. Hananja, der Prophet, der sich Jeremia widersetzte, stammte aus Gibeon; Johanan holte Ismael „an dem großen Wasser bei Gibeon“ ein; und Männer von Gibeon halfen unter Nehemia beim Wiederaufbau der Mauer Jerusalems."
    - "Pritchard legte einen großen runden, in den Fels gehauenen Teich frei, von dem ein Stufentunnel rund 13 m tiefer zu einer Wasserkammer auf Grundwasserhöhe führte; viele verbinden ihn mit dem Teich des zweiten Samuelbuchs, doch seine Datierung ist umstritten. In der späten Eisenzeit stellte Gibeon Wein her: Mehr als zwei Dutzend Krughenkel tragen den Namen der Stadt und die Namen ihrer Besitzer, datiert ins 8.–7. Jahrhundert v. Chr., von manchen ins 6. Im Jahr 66 n. Chr. lagerte der römische Statthalter Cestius Gallus bei Gabao, fünfzig Stadien von Jerusalem, und fiel auf seinem Rückzug dorthin zurück. Eusebius kannte noch ein Dorf desselben Namens."
  fr:
    - "Gabaon est el-Jib, un village sur une colline à environ 9 km au nord-ouest de Jérusalem, en terre de Benjamin. L’identification, suggérée au XIXe siècle d’après le nom, fut confirmée quand James B. Pritchard, de l’Université de Pennsylvanie, qui fouilla ici en cinq saisons de 1956 à 1962, trouva des anses de jarres portant le nom de Gabaon. Des grottes et des tombes taillées dans le roc de la colline contenaient de la poterie et des sépultures du Bronze ancien et moyen. La liste de villes du pharaon Schischak à Karnak nomme Gabaon parmi les lieux de sa campagne de la fin du Xe siècle av. J.-C."
    - "Le livre de Josué appelle Gabaon « une grande ville, comme une des villes royales ». Ses habitants, apprenant ce que Josué avait fait à Jéricho et à Aï, vinrent le trouver à Guilgal avec de vieux sacs et des outres déchirées, comme d’un pays éloigné, et obtinrent une alliance ; quand la ruse fut découverte, ils furent employés à couper le bois et à puiser l’eau. Cinq rois amoréens assiégèrent alors Gabaon, Josué vint à son secours et les mit en déroute, et dit : « Soleil, arrête-toi sur Gabaon ». Plus tard, Gabaon fut l’une des villes de Benjamin données aux prêtres, fils d’Aaron."
    - "Près de l’étang de Gabaon se rencontrèrent les hommes d’Abner et ceux de Joab, et douze de chaque côté tombèrent ensemble ; plus tard, Joab tua Amasa près de la grande pierre de Gabaon. Saül avait cherché à détruire les Gabaonites, et du temps de David une famine lui fut imputée. La tente d’assignation se trouvait au haut lieu de Gabaon, « le principal des hauts lieux » ; Salomon y offrit mille holocaustes, et l’Éternel lui apparut en songe. Hanania, le prophète qui s’opposa à Jérémie, venait de Gabaon ; Jochanan atteignit Ismaël « près des grandes eaux de Gabaon » ; et des hommes de Gabaon aidèrent à rebâtir la muraille de Jérusalem sous Néhémie."
    - "Pritchard dégagea un grand bassin rond taillé dans le roc, d’où un tunnel à marches descendait sur environ 13 m jusqu’à une chambre d’eau au niveau de la nappe ; beaucoup le rattachent à l’étang de 2 Samuel, bien que sa date soit débattue. À la fin de l’âge du Fer, Gabaon produisait du vin : plus de deux douzaines d’anses de jarres portent le nom de la ville et ceux de leurs propriétaires, datées des VIIIe–VIIe siècles av. J.-C., par certains du VIe. En 66 apr. J.-C., le gouverneur romain Cestius Gallus campa à Gabao, à cinquante stades de Jérusalem, et s’y replia dans sa retraite. Eusèbe connaissait encore un village du même nom."
