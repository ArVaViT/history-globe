body:
  en:
    - "Gibeon is el-Jib, a village on a hill about 9 km north-west of Jerusalem in the land of Benjamin. The identification, suggested by early travellers from the name, was confirmed when James B. Pritchard of the University of Pennsylvania, who dug here in five seasons from 1956 to 1962, found jar handles inscribed with the name Gibeon. Caves and tombs cut in the rock of the hill held pottery and burials of the Early and Middle Bronze Ages. Pharaoh Shishak's list of towns at Karnak names Gibeon among the places of his campaign in the late tenth century BC."
    - 'The Book of Joshua calls Gibeon "a great city, as one of the royal cities". Its people, hearing what Joshua had done to Jericho and Ai, came to him at Gilgal with old sacks and torn wineskins as if from a far country, and won a league; when the trick came out, they were made hewers of wood and drawers of water. Five Amorite kings then besieged Gibeon, Joshua came to its help and routed them, and said, "Sun, stand thou still upon Gibeon". Later Gibeon was one of the towns of Benjamin given to the priests, the sons of Aaron.'
    - 'By the pool of Gibeon the men of Abner and of Joab met, and twelve from each side fell together; later Joab killed Amasa at the great stone in Gibeon. Saul had sought to destroy the Gibeonites, and in David''s day a famine was laid to it. The tabernacle stood on the great high place at Gibeon; there Solomon offered a thousand burnt offerings, and the LORD appeared to him in a dream. Hananiah, the prophet who opposed Jeremiah, came from Gibeon; Johanan overtook Ishmael "by the great waters that are in Gibeon"; and men of Gibeon helped rebuild the wall of Jerusalem under Nehemiah.'
    - "Pritchard cleared a great round pool cut into the rock, from which a stepped tunnel led some 13 m further down to a water chamber at the water table; many link it with the pool of 2 Samuel, though its date is debated. In the late Iron Age Gibeon made wine: more than two dozen jar handles bear the town's name and the names of their owners, dated to the eighth–seventh centuries BC, by some to the sixth. In AD 66 the Roman governor Cestius Gallus camped at Gabao, fifty furlongs from Jerusalem, and fell back there in his retreat. Eusebius still knew a village of the same name."
  ru:
    - "Гаваон — это Эль-Джиб, селение на холме примерно в 9 км к северо-западу от Иерусалима, в земле Вениамина. Отождествление, предложенное ещё первыми путешественниками по сходству названия, подтвердилось, когда Джеймс Б. Притчард из Пенсильванского университета, копавший здесь пять сезонов с 1956 по 1962 г., нашёл ручки кувшинов с надписью «Гаваон». В пещерах и гробницах, высеченных в скале холма, найдены керамика и погребения раннего и среднего бронзового века. Список городов фараона Сусакима в Карнаке называет Гаваон среди мест его похода в конце X века до н. э."
    - "Книга Иисуса Навина называет Гаваон городом большим, «как один из царских городов». Его жители, услышав, что Иисус сделал с Иерихоном и Гаем, пришли к нему в Галгал с ветхими мешками и изорванными мехами, будто из дальней земли, и добились союза; когда обман открылся, их сделали дровосеками и водоносами. Тогда пять царей Аморрейских осадили Гаваон, Иисус пришёл ему на помощь и разбил их и сказал: «стой, солнце, над Гаваоном». Позже Гаваон был среди городов колена Вениаминова, отданных священникам, сынам Аарона."
    - "У Гаваонского пруда встретились люди Авенира и Иоава, и по двенадцать с каждой стороны пали вместе; позже Иоав убил Амессая у большого камня, что у Гаваона. Саул хотел истребить гаваонитян, и во дни Давида голод был послан за это. Скиния стояла на высоте в Гаваоне; там Соломон вознёс тысячу всесожжений, и Господь явился ему во сне. Из Гаваона был пророк Анания, противившийся Иеремии; Иоанан настиг Исмаила «у больших вод, в Гаваоне»; а жители Гаваона помогали чинить стену Иерусалима при Неемии."
    - "Притчард расчистил большой круглый водоём, высеченный в скале, из которого ступенчатый туннель вёл ещё примерно на 13 м вниз к камере с водой на уровне грунтовых вод; многие связывают его с прудом из Второй книги Царств, хотя его датировка спорна. В конце железного века в Гаваоне делали вино: более чем на двух десятках ручек кувшинов стоят имя города и имена их владельцев; их датируют VIII–VII веками до н. э., некоторые — VI веком. В 66 г. н. э. римский наместник Цестий Галл стал лагерем у Габао, в пятидесяти стадиях от Иерусалима, и отступил туда при отходе. Евсевий ещё знал селение с тем же названием."
  uk:
    - "Гаваон — це ель-Джиб, село на пагорбі приблизно за 9 км на північний захід від Єрусалима в землі Веніямина. Ототожнення, запропоноване ранніми мандрівниками за назвою, підтвердилося, коли Джеймс Б. Прічард з Пенсильванського університету, який розкопував тут п’ять сезонів з 1956 по 1962 рік, знайшов ручки глеків із написаною назвою Гаваон. Печери й гробниці, вирубані в скелі пагорба, містили кераміку та поховання раннього й середнього бронзового віку. Список міст фараона Сусакіма в Карнаку називає Гаваон серед місць його походу наприкінці X ст. до н. е."
    - "Книга Ісуса Навина називає Гаваон «город великий, як звичайно місто царське». Його мешканці, почувши, що Ісус Навин вчинив з Єрихоном та Аєм, прийшли до нього в Гілгал зі старими торбами й подертими бурдюками, наче з далекої країни, і здобули союз; коли хитрощі вийшли на яв, їх зробили дроворубами й водоносами. П’ять аморейських царів тоді обложили Гаваон, Ісус Навин прийшов йому на допомогу й розбив їх і сказав: «Сонце, стій над Габаоном». Пізніше Гаваон був одним із міст Веніямина, даних священикам, синам Аарона."
    - "Біля ставу Гаваона зустрілися люди Авеніра та Йоава, і з кожного боку впало по дванадцятеро; пізніше Йоав убив Амасу біля великого каменя в Гаваоні. Саул намагався знищити гаваонців, і за Давида голод пояснили саме цим. Скинія стояла на великій висоті в Гаваоні; там Соломон приніс тисячу всепалень, і Господь з’явився йому вві сні. Хананія, пророк, що виступив проти Єремії, був із Гаваона; Йоханан наздогнав Ізмаїла «коло великого ставу під Габаоном»; а люди з Гаваона допомагали відбудовувати мур Єрусалима за Неемії."
    - "Прічард розчистив великий круглий став, вирубаний у скелі, від якого сходовий тунель вів приблизно на 13 м глибше до водяної камери на рівні ґрунтових вод; багато хто пов’язує його зі ставом із Другої книги Самуїла, хоча його датування спірне. Наприкінці залізного віку Гаваон виробляв вино: понад два десятки ручок глеків мають назву міста й імена їх власників і датуються VIII–VII ст. до н. е., за деякими — VI ст. 66 р. н. е. римський намісник Цестій Галл отаборився в Габао, за п’ятдесят стадій від Єрусалима, і відступив туди під час свого відходу. Євсевій ще знав село з такою самою назвою."
  es:
    - "Gabaón es el-Jib, una aldea sobre una colina a unos 9 km al noroeste de Jerusalén, en la tierra de Benjamín. La identificación, sugerida por los primeros viajeros a partir del nombre, quedó confirmada cuando James B. Pritchard, de la Universidad de Pensilvania, que excavó aquí en cinco campañas entre 1956 y 1962, halló asas de jarras con el nombre de Gabaón inscrito. Cuevas y tumbas excavadas en la roca de la colina contenían cerámica y enterramientos de las Edades del Bronce Antiguo y Medio. La lista de ciudades del faraón Sisac en Karnak nombra Gabaón entre los lugares de su campaña de fines del siglo X a. C."
    - "El libro de Josué llama a Gabaón «una gran ciudad, como una de las ciudades reales». Sus habitantes, al oír lo que Josué había hecho a Jericó y a Hai, fueron a él, a Gilgal, con sacos viejos y odres rotos como si vinieran de un país lejano, y obtuvieron una alianza; cuando se descubrió el engaño, fueron hechos leñadores y aguadores. Cinco reyes amorreos sitiaron entonces Gabaón, Josué acudió en su ayuda y los derrotó, y dijo: «Sol, detente en Gabaón». Más tarde Gabaón fue una de las ciudades de Benjamín dadas a los sacerdotes, hijos de Aarón."
    - "Junto al estanque de Gabaón se encontraron los hombres de Abner y de Joab, y cayeron juntos doce de cada bando; más tarde Joab mató a Amasa junto a la gran peña de Gabaón. Saúl había procurado exterminar a los gabaonitas, y en tiempos de David se les atribuyó un hambre. El tabernáculo estuvo en el gran alto de Gabaón; allí ofreció Salomón mil holocaustos, y el Señor se le apareció en sueños. Hananías, el profeta que se opuso a Jeremías, era de Gabaón; Johanán alcanzó a Ismael «junto á Aguas-muchas, que es en Gabaón»; y hombres de Gabaón ayudaron a reconstruir el muro de Jerusalén bajo Nehemías."
    - "Pritchard despejó un gran estanque redondo excavado en la roca, del que un túnel con escalones descendía unos 13 m más hasta una cámara de agua al nivel freático; muchos lo vinculan con el estanque de 2 Samuel, aunque su fecha se discute. A fines de la Edad del Hierro Gabaón producía vino: más de dos docenas de asas de jarras llevan el nombre de la población y los nombres de sus dueños, y se fechan en los siglos VIII–VII a. C., según algunos en el VI. En el 66 d. C. el gobernador romano Cestio Galo acampó en Gabao, a cincuenta estadios de Jerusalén, y allí se replegó en su retirada. Eusebio conoció aún una aldea del mismo nombre."
  pt:
    - "Gibeão é el-Jib, uma aldeia numa colina a cerca de 9 km a noroeste de Jerusalém, na terra de Benjamim. A identificação, sugerida pelos primeiros viajantes a partir do nome, foi confirmada quando James B. Pritchard, da Universidade da Pensilvânia, que escavou aqui em cinco temporadas de 1956 a 1962, achou alças de jarros inscritas com o nome de Gibeão. Cavernas e tumbas talhadas na rocha da colina continham cerâmica e sepultamentos do Bronze Antigo e Médio. A lista de cidades do faraó Sisaque em Karnak nomeia Gibeão entre os lugares de sua campanha no fim do século X a.C."
    - "O livro de Josué chama Gibeão “uma grande cidade, como uma das cidades reais”. Seu povo, ouvindo o que Josué fizera a Jericó e a Ai, foi a ele em Gilgal com sacos velhos e odres rotos, como de uma terra distante, e obteve uma aliança; quando o ardil se descobriu, foram feitos rachadores de lenha e tiradores de água. Cinco reis amorreus cercaram então Gibeão, Josué veio em seu socorro e os derrotou, e disse: “Sol, pare sobre Gibeom!” Mais tarde Gibeão foi uma das cidades de Benjamim dadas aos sacerdotes, filhos de Arão."
    - "Junto ao tanque de Gibeão se encontraram os homens de Abner e de Joabe, e doze de cada lado caíram juntos; mais tarde Joabe matou Amasa junto à grande pedra em Gibeão. Saul procurara destruir os gibeonitas, e nos dias de Davi uma fome foi atribuída a isso. O tabernáculo ficava no grande alto de Gibeão; ali Salomão ofereceu mil holocaustos, e o SENHOR lhe apareceu em sonho. Hananias, o profeta que se opôs a Jeremias, era de Gibeão; Joanã alcançou Ismael “junto às grandes águas que estão em Gibeão”; e homens de Gibeão ajudaram a reconstruir a muralha de Jerusalém sob Neemias."
    - "Pritchard desobstruiu um grande tanque redondo escavado na rocha, do qual um túnel em degraus descia cerca de 13 m mais fundo até uma câmara de água no lençol freático; muitos o ligam ao tanque de 2 Samuel, embora a sua data seja debatida. No fim da Idade do Ferro, Gibeão fazia vinho: mais de duas dúzias de alças de jarros trazem o nome da cidade e os nomes de seus donos, datadas dos séculos VIII–VII a.C., por alguns do VI. Em 66 d.C., o governador romano Céstio Galo acampou em Gabao, a cinquenta estádios de Jerusalém, e para lá recuou em sua retirada. Eusébio ainda conheceu uma aldeia do mesmo nome."
  de:
    - "Gibeon ist el-Dschib, ein Dorf auf einem Hügel etwa 9 km nordwestlich von Jerusalem im Land Benjamin. Die von frühen Reisenden aus dem Namen erschlossene Gleichsetzung wurde bestätigt, als James B. Pritchard von der University of Pennsylvania, der hier von 1956 bis 1962 in fünf Kampagnen grub, Krughenkel mit der Aufschrift Gibeon fand. In den Fels des Hügels gehauene Höhlen und Gräber enthielten Keramik und Bestattungen der Früh- und Mittelbronzezeit. Die Städteliste des Pharaos Schischak in Karnak nennt Gibeon unter den Orten seines Feldzugs im späten 10. Jahrhundert v. Chr."
    - "Das Buch Josua nennt Gibeon „eine große Stadt wie eine königliche Stadt“. Seine Bewohner kamen, als sie hörten, was Josua mit Jericho und Ai gemacht hatte, mit alten Säcken und zerrissenen Weinschläuchen wie aus fernem Land zu ihm nach Gilgal und erwirkten einen Bund; als der Trug herauskam, wurden sie zu Holzhauern und Wasserträgern gemacht. Fünf Amoriterkönige belagerten dann Gibeon, Josua kam ihm zu Hilfe und schlug sie und sprach: „Sonne, stehe still zu Gibeon“. Später war Gibeon eine der Städte Benjamins, die den Priestern, den Söhnen Aarons, gegeben wurden."
    - "Am Teich von Gibeon trafen die Männer Abners und Joabs aufeinander, und zwölf von jeder Seite fielen zugleich; später tötete Joab Amasa am großen Stein zu Gibeon. Saul hatte die Gibeoniter zu vernichten gesucht, und zu Davids Zeit wurde eine Hungersnot darauf zurückgeführt. Die Stiftshütte stand auf der großen Höhe von Gibeon; dort opferte Salomo tausend Brandopfer, und der HERR erschien ihm im Traum. Hananja, der Prophet, der sich Jeremia widersetzte, stammte aus Gibeon; Johanan holte Ismael „an dem großen Wasser bei Gibeon“ ein; und Männer von Gibeon halfen unter Nehemia beim Wiederaufbau der Mauer Jerusalems."
    - "Pritchard legte einen großen runden, in den Fels gehauenen Teich frei, von dem ein Stufentunnel rund 13 m tiefer zu einer Wasserkammer auf Grundwasserhöhe führte; viele verbinden ihn mit dem Teich des zweiten Samuelbuchs, doch seine Datierung ist umstritten. In der späten Eisenzeit stellte Gibeon Wein her: Mehr als zwei Dutzend Krughenkel tragen den Namen der Stadt und die Namen ihrer Besitzer, datiert ins 8.–7. Jahrhundert v. Chr., von manchen ins 6. Im Jahr 66 n. Chr. lagerte der römische Statthalter Cestius Gallus bei Gabao, fünfzig Stadien von Jerusalem, und fiel auf seinem Rückzug dorthin zurück. Eusebius kannte noch ein Dorf desselben Namens."
  fr:
    - "Gabaon est el-Jib, un village sur une colline à environ 9 km au nord-ouest de Jérusalem, en terre de Benjamin. L’identification, suggérée par les premiers voyageurs d’après le nom, fut confirmée quand James B. Pritchard, de l’Université de Pennsylvanie, qui fouilla ici en cinq saisons de 1956 à 1962, trouva des anses de jarres portant le nom de Gabaon. Des grottes et des tombes taillées dans le roc de la colline contenaient de la poterie et des sépultures du Bronze ancien et moyen. La liste de villes du pharaon Schischak à Karnak nomme Gabaon parmi les lieux de sa campagne de la fin du Xe siècle av. J.-C."
    - "Le livre de Josué appelle Gabaon « une grande ville, comme une des villes royales ». Ses habitants, apprenant ce que Josué avait fait à Jéricho et à Aï, vinrent le trouver à Guilgal avec de vieux sacs et des outres déchirées, comme d’un pays éloigné, et obtinrent une alliance ; quand la ruse fut découverte, ils furent employés à couper le bois et à puiser l’eau. Cinq rois amoréens assiégèrent alors Gabaon, Josué vint à son secours et les mit en déroute, et dit : « Soleil, arrête-toi sur Gabaon ». Plus tard, Gabaon fut l’une des villes de Benjamin données aux prêtres, fils d’Aaron."
    - "Près de l’étang de Gabaon se rencontrèrent les hommes d’Abner et ceux de Joab, et douze de chaque côté tombèrent ensemble ; plus tard, Joab tua Amasa près de la grande pierre de Gabaon. Saül avait cherché à détruire les Gabaonites, et du temps de David une famine lui fut imputée. La tente d’assignation se trouvait au haut lieu de Gabaon, « le principal des hauts lieux » ; Salomon y offrit mille holocaustes, et l’Éternel lui apparut en songe. Hanania, le prophète qui s’opposa à Jérémie, venait de Gabaon ; Jochanan atteignit Ismaël « près des grandes eaux de Gabaon » ; et des hommes de Gabaon aidèrent à rebâtir la muraille de Jérusalem sous Néhémie."
    - "Pritchard dégagea un grand bassin rond taillé dans le roc, d’où un tunnel à marches descendait sur environ 13 m jusqu’à une chambre d’eau au niveau de la nappe ; beaucoup le rattachent à l’étang de 2 Samuel, bien que sa date soit débattue. À la fin de l’âge du Fer, Gabaon produisait du vin : plus de deux douzaines d’anses de jarres portent le nom de la ville et ceux de leurs propriétaires, datées des VIIIe–VIIe siècles av. J.-C., par certains du VIe. En 66 apr. J.-C., le gouverneur romain Cestius Gallus campa à Gabao, à cinquante stades de Jérusalem, et s’y replia dans sa retraite. Eusèbe connaissait encore un village du même nom."
  pl:
    - "Gibeon to el-Jib, wieś na wzgórzu około 9 km na północny zachód od Jerozolimy w ziemi Beniamina. Utożsamienie, zaproponowane przez dawnych podróżników na podstawie nazwy, potwierdził James B. Pritchard z Uniwersytetu Pensylwanii, który prowadził tu wykopaliska w pięciu sezonach w latach 1956–1962 i znalazł uchwyty dzbanów z wypisaną nazwą Gibeon. Jaskinie i groby wykute w skale wzgórza zawierały ceramikę i pochówki z wczesnej i środkowej epoki brązu. Wykaz miast faraona Sziszaka w Karnaku wymienia Gibeon wśród miejsc jego wyprawy pod koniec X w. p.n.e."
    - "Księga Jozuego nazywa Gibeon: „miasto wielkie było Gabaon, jako jedno z miast królewskich”. Jego mieszkańcy, usłyszawszy, co Jozue uczynił z Jerychem i Aj, przyszli do niego do Gilgal ze starymi workami i podartymi bukłakami, jakby z dalekiego kraju, i zawarli przymierze; gdy podstęp wyszedł na jaw, uczyniono z nich rąbiących drwa i noszących wodę. Pięciu królów amorejskich oblegało potem Gibeon, Jozue przyszedł mu z pomocą i rozbił ich, i rzekł: „Słońce w Gabaon zastanów się”. Później Gibeon było jednym z miast Beniamina oddanych kapłanom, synom Aarona."
    - "U sadzawki Gibeonu spotkali się ludzie Abnera i Joaba i po dwunastu z każdej strony poległo razem; później Joab zabił Amasę przy wielkim kamieniu w Gibeonie. Saul zamierzał wytępić Gibeonitów, a za Dawida przypisano temu głód. Przybytek stał na wielkiej wyżynie w Gibeonie; tam Salomon złożył tysiąc całopalenia i Pan ukazał mu się we śnie. Chananiasz, prorok, który sprzeciwiał się Jeremiaszowi, pochodził z Gibeonu; Jochanan dogonił Izmaela „u wód wielkich, które są w Gabaon”; a ludzie z Gibeonu pomagali odbudować mur Jerozolimy za Nehemiasza."
    - "Pritchard oczyścił wielki okrągły zbiornik wykuty w skale, z którego schodzący stopniami tunel prowadził jeszcze około 13 m w dół do komory z wodą na poziomie wód gruntowych; wielu wiąże go z sadzawką z Drugiej Księgi Samuela, choć jego datowanie jest sporne. W późnej epoce żelaza Gibeon wytwarzało wino: ponad dwa tuziny uchwytów dzbanów noszą nazwę miasta i imiona ich właścicieli, datowane na VIII–VII w. p.n.e., przez niektórych na VI w. W 66 r. n.e. rzymski namiestnik Cestiusz Gallus obozował w Gabao, pięćdziesiąt stadiów od Jerozolimy, i tam cofnął się w odwrocie. Euzebiusz znał jeszcze wieś o tej samej nazwie."
  it:
    - "Gabaon è el-Jib, un villaggio su una collina circa 9 km a nord-ovest di Gerusalemme, nel paese di Beniamino. L’identificazione, suggerita dai primi viaggiatori a partire dal nome, fu confermata quando James B. Pritchard dell’Università della Pennsylvania, che vi scavò in cinque stagioni dal 1956 al 1962, trovò manici di anfora con inciso il nome Gabaon. Grotte e tombe scavate nella roccia della collina contenevano ceramiche e sepolture del Bronzo Antico e Medio. L’elenco di città del faraone Sisak a Karnak nomina Gabaon fra i luoghi della sua campagna della fine del X secolo a.C."
    - "Il libro di Giosuè dice di Gabaon che era «una città grande come una delle città reali». I suoi abitanti, udito ciò che Giosuè aveva fatto a Gerico e ad Ai, vennero da lui a Gàlgala con sacchi vecchi e otri strappati, come da un paese lontano, e ottennero un’alleanza; quando l’inganno fu scoperto, furono ridotti a spaccalegna e portatori d’acqua. Cinque re amorrei assediarono allora Gabaon, Giosuè venne in suo aiuto e li mise in rotta, e disse: «Sole, fermati su Gabaon». Più tardi Gabaon fu una delle città di Beniamino date ai sacerdoti, figli di Aronne."
    - "Presso la vasca di Gabaon gli uomini di Abner e di Ioab si incontrarono, e dodici per parte caddero insieme; più tardi Ioab uccise Amasa presso la gran pietra in Gabaon. Saul aveva cercato di sterminare i Gabaoniti, e ai giorni di Davide una carestia fu attribuita a ciò. La tenda di convegno stava sull’alto luogo principale di Gabaon; lì Salomone offrì mille olocausti, e il Signore gli apparve in sogno. Anania, il profeta che si oppose a Geremia, era di Gabaon; Ioanan raggiunse Ismaele «presso le grandi acque che sono a Gabaon»; e uomini di Gabaon aiutarono a ricostruire le mura di Gerusalemme sotto Neemia."
    - "Pritchard portò alla luce una grande vasca rotonda scavata nella roccia, da cui un tunnel a gradini scendeva per circa 13 m fino a una camera d’acqua alla falda; molti la collegano alla vasca di 2 Samuele, benché la sua data sia discussa. Nella tarda età del Ferro Gabaon produceva vino: più di due dozzine di manici di anfora recano il nome della città e quelli dei proprietari, datati ai secoli VIII–VII a.C., da alcuni al VI. Nel 66 d.C. il governatore romano Cestio Gallo si accampò a Gabao, a cinquanta stadi da Gerusalemme, e vi ripiegò nella sua ritirata. Eusebio conosceva ancora un villaggio con lo stesso nome."
  nl:
    - "Gibeon is el-Jib, een dorp op een heuvel ongeveer 9 km ten noordwesten van Jeruzalem in het land van Benjamin. De identificatie, door vroege reizigers op grond van de naam voorgesteld, werd bevestigd toen James B. Pritchard van de Universiteit van Pennsylvania, die hier in vijf seizoenen van 1956 tot 1962 groef, kruikhenkels met de naam Gibeon vond. In grotten en graven in de rots van de heuvel lagen aardewerk en begravingen uit de Vroege en Midden-Bronstijd. De stedenlijst van farao Sisak in Karnak noemt Gibeon onder de plaatsen van zijn veldtocht aan het eind van de 10e eeuw v.Chr."
    - "Het boek Jozua noemt Gibeon “een grote stad, als een der koninklijke steden”. De bewoners kwamen, toen zij hoorden wat Jozua met Jericho en Ai had gedaan, met oude zakken en gescheurde wijnzakken, alsof zij uit een ver land kwamen, naar hem toe in Gilgal en verkregen een verbond; toen de list uitkwam, werden zij houthouwers en waterputters. Vijf Amorietische koningen belegerden toen Gibeon, Jozua kwam het te hulp en sloeg hen op de vlucht, en zei: “Zon, sta stil te Gibeon”. Later was Gibeon een van de steden van Benjamin die aan de priesters, de zonen van Aäron, werden gegeven."
    - "Bij de vijver van Gibeon ontmoetten de mannen van Abner en van Joab elkaar, en twaalf van elke kant vielen samen; later doodde Joab Amasa bij de grote steen te Gibeon. Saul had de Gibeonieten willen uitroeien, en in Davids dagen werd een hongersnood daaraan toegeschreven. De tabernakel stond op de grote hoogte te Gibeon; daar bracht Salomo duizend brandoffers en verscheen de HEER hem in een droom. Chananja, de profeet die Jeremia tegensprak, kwam uit Gibeon; Johanan haalde Ismaël in “aan het grote water, dat bij Gibeon is”; en mannen uit Gibeon hielpen onder Nehemia de muur van Jeruzalem herbouwen."
    - "Pritchard legde een grote ronde vijver bloot, in de rots uitgehouwen, waaruit een getrapte tunnel zo’n 13 m dieper naar een waterkamer op de grondwaterspiegel leidde; velen brengen hem in verband met de vijver uit 2 Samuël, al is de datering omstreden. In de late IJzertijd maakte Gibeon wijn: meer dan twee dozijn kruikhenkels dragen de naam van de stad en die van hun eigenaars, gedateerd in de 8e–7e eeuw v.Chr., door sommigen in de 6e. In 66 n.Chr. sloeg de Romeinse stadhouder Cestius Gallus zijn kamp op te Gabao, vijftig stadiën van Jeruzalem, en week daarheen terug. Eusebius kende nog een dorp met dezelfde naam."
  cs:
    - "Gibeon je el-Džíb, vesnice na pahorku asi 9 km severozápadně od Jeruzaléma v Benjamínově zemi. Ztotožnění, navržené už ranými cestovateli podle jména, bylo potvrzeno, když James B. Pritchard z Pensylvánské univerzity, který zde kopal v pěti sezónách v letech 1956 až 1962, našel držadla džbánů s nápisem jména Gibeon. Jeskyně a hrobky vytesané do skály pahorku obsahovaly keramiku a pohřby z rané a střední doby bronzové. Seznam měst faraona Šíšaka v Karnaku jmenuje Gibeon mezi místy jeho tažení koncem 10. stol. př. n. l."
    - "Kniha Jozue o Gibeonu praví: „město veliké bylo Gabaon, jako jedno z měst královských“. Jeho lid, uslyšev, co Jozue učinil Jerichu a Ai, přišel k němu do Gilgalu se starými pytli a roztrhanými měchy, jako by byl z daleké země, a získal spojenectví; když se lest provalila, byli učiněni dřevaři a nosiči vody. Pět amorejských králů pak oblehlo Gibeon, Jozue mu přišel na pomoc a porazil je a řekl: „Slunce v Gabaon zastav se“. Později byl Gibeon jedním z měst Benjamínových daných kněžím, synům Áronovým."
    - "U Gibeonského rybníka se setkali muži Abnerovi a Joábovi a dvanáct z každé strany padlo spolu; později Joáb zabil Amasu u velkého kamene v Gibeonu. Saul se snažil Gibeonské vyhubit a za Davidových dnů byl na to svalen hladomor. Stánek stál na velké výšině v Gibeonu; tam Šalomoun obětoval tisíc zápalných obětí a Hospodin se mu ve snu zjevil. Chananjáš, prorok, který se stavěl proti Jeremjášovi, pocházel z Gibeonu; Jochanan dostihl Jišmaele „při vodách velikých, kteréž jsou v Gabaon“ a muži z Gibeonu pomáhali obnovit hradbu Jeruzaléma za Nehemjáše."
    - "Pritchard odkryl velký kulatý rybník vytesaný do skály, z něhož vedl schodišťový tunel asi 13 m dále dolů do vodní komory u hladiny podzemní vody; mnozí jej spojují s rybníkem z Druhé knihy Samuelovy, ačkoli jeho datování je sporné. V pozdní době železné se v Gibeonu vyráběl víno: více než dvě desítky držadel džbánů nese jméno města a jména jejich majitelů, datovaná do 8.–7. stol. př. n. l., některými do 6. století. Roku 66 n. l. se římský správce Cestius Gallus utábořil v Gabau, padesát stadií od Jeruzaléma, a při ústupu se tam vrátil. Eusebios ještě znal vesnici téhož jména."
  sv:
    - "Gibeon är el-Jib, en by på en kulle omkring 9 km nordväst om Jerusalem i Benjamins land. Identifieringen, föreslagen av tidiga resenärer utifrån namnet, bekräftades när James B. Pritchard vid University of Pennsylvania, som grävde här under fem säsonger 1956–1962, fann krukhandtag med namnet Gibeon inristat. Grottor och gravar uthuggna i kullens berg innehöll keramik och gravar från tidiga och mellersta bronsåldern. Farao Shishaks stadsförteckning i Karnak nämner Gibeon bland platserna i hans fälttåg sent på 900-talet f.Kr."
    - "Josuas bok kallar Gibeon ”en stor stad, såsom en av konungastäderna”. Dess invånare, som hört vad Josua gjort med Jeriko och Ai, kom till honom i Gilgal med gamla säckar och sönderrivna vinläglar som från ett fjärran land och vann ett förbund; när knepet avslöjades blev de vedhuggare och vattenbärare. Fem amoreiska kungar belägrade därefter Gibeon, Josua kom det till hjälp och slog dem på flykten och sade: ”Du sol, stå stilla i Gibeon”. Senare var Gibeon en av Benjamins städer som gavs åt prästerna, Arons söner."
    - "Vid Gibeons damm möttes Avners och Joavs män, och tolv från vardera sidan föll tillsammans; senare dödade Joav Amasa vid den stora stenen vid Gibeon. Saul hade försökt förgöra gibeoniterna, och på Davids tid lades en hungersnöd honom till last. Tabernaklet stod på den stora offerhöjden i Gibeon; där offrade Salomo tusen brännoffer, och Herren uppenbarade sig för honom i en dröm. Hananja, profeten som motsatte sig Jeremia, kom från Gibeon; Johanan hann ifatt Ismael ”vid det stora vattnet i Gibeon”; och män från Gibeon hjälpte till att bygga upp Jerusalems mur under Nehemja."
    - "Pritchard frilade en stor rund damm uthuggen i berget, från vilken en trappad tunnel ledde omkring 13 m längre ned till ett vattenrum vid grundvattennivån; många kopplar den till dammen i Andra Samuelsboken, fast dess datering är omstridd. Under sen järnålder tillverkade Gibeon vin: mer än två dussin krukhandtag bär stadens namn och ägarnas namn, daterade till 700–600-talen f.Kr., av somliga till 500-talet. År 66 e.Kr. slog den romerske ståthållaren Cestius Gallus läger i Gabao, femtio stadier från Jerusalem, och föll tillbaka dit under sin reträtt. Eusebios kände fortfarande en by med samma namn."
  nb:
    - "Gibeon er el-Jib, en landsby på en høyde omtrent 9 km nordvest for Jerusalem i Benjamins land. Identifikasjonen, foreslått av tidlige reisende ut fra navnet, ble bekreftet da James B. Pritchard ved Pennsylvania-universitetet, som gravde her i fem sesonger fra 1956 til 1962, fant krukkehanker innskrevet med navnet Gibeon. Huler og graver hugget i fjellet på høyden inneholdt keramikk og gravleggelser fra tidlig bronsealder og mellombronsealder. Farao Sjisjaks liste over byer i Karnak nevner Gibeon blant stedene i hans felttog sent på 900-tallet f.Kr."
    - "Josvas bok kaller Gibeon «en stor by, som en av kongebyene». Dens folk, som hørte hva Josva hadde gjort med Jeriko og Ai, kom til ham i Gilgal med gamle sekker og sprukne vinsekker som om de var fra et land langt borte, og vant en pakt; da lureriet ble avslørt, ble de gjort til vedhuggere og vannbærere. Fem amorittiske konger kringsatte så Gibeon, Josva kom den til hjelp og slo dem på flukt, og sa: «Stå stille, sol, i Gibeon». Senere var Gibeon en av Benjamins byer som ble gitt til prestene, Arons sønner."
    - "Ved Gibeon-dammen møttes Abners og Joabs menn, og tolv fra hver side falt sammen; senere drepte Joab Amasa ved den store steinen i Gibeon. Saul hadde søkt å utrydde gibeonittene, og i Davids tid ble en hungersnød lagt på det. Sammenkomstteltet sto på den store offerhaugen i Gibeon; der ofret Salomo tusen brennoffer, og Herren åpenbarte seg for ham i en drøm. Hananja, profeten som sto imot Jeremia, kom fra Gibeon; Johanan innhentet Ismael «ved det store vann i Gibeon»; og menn fra Gibeon hjalp til med å gjenreise Jerusalems mur under Nehemja."
    - "Pritchard frilegte en stor rund dam hugget inn i fjellet, hvorfra en trappet tunnel førte omkring 13 m lenger ned til et vannkammer ved grunnvannsspeilet; mange knytter den til dammen i Andre Samuelsbok, selv om dateringen er omdiskutert. I sen jernalder laget Gibeon vin: mer enn to dusin krukkehanker bærer byens navn og eiernes navn, datert til 700- og 600-tallet f.Kr., av noen til 500-tallet. I 66 e.Kr. slo den romerske guvernøren Cestius Gallus leir ved Gabao, femti stadier fra Jerusalem, og trakk seg tilbake dit under retretten. Eusebius kjente ennå en landsby med samme navn."
  tl:
    - "Ang Gabaon ay ang el-Jib, isang nayon sa isang burol mga 9 km sa hilagang-kanluran ng Jerusalem sa lupain ng Benjamin. Ang pagkakakilanlan, na iminungkahi ng mga naunang manlalakbay mula sa pangalan, ay napatunayan nang si James B. Pritchard ng University of Pennsylvania, na humukay rito sa limang panahon mula 1956 hanggang 1962, ay nakakita ng mga hawakan ng banga na may nakasulat na pangalang Gabaon. Ang mga yungib at libingang tinibag sa bato ng burol ay naglalaman ng palayok at mga libing ng Maaga at Gitnang Panahong Tanso. Pinangalanan ng listahan ng mga bayan ni Faraong Sisac sa Karnak ang Gabaon sa mga lugar ng kaniyang kampanya sa huling bahagi ng ika-10 siglo BK."
    - "Tinatawag ng Aklat ni Josue ang Gabaon na “malaking bayan na gaya ng isa sa mga bayan ng hari”. Ang mga tao nito, nang mabalitaan ang ginawa ni Josue sa Jerico at sa Hai, ay lumapit sa kaniya sa Gilgal na may mga lumang bayong at punit na sisidlang balat ng alak na tila mula sa malayong bayan, at nagkamit ng kasunduan; nang mabunyag ang daya, ginawa silang tagaputol ng kahoy at tagasalok ng tubig. Pagkatapos ay kinubkob ng limang hari ng mga Amorrheo ang Gabaon, tinulungan ito ni Josue at tinalo sila, at sinabi niya, “Araw, tumigil ka sa Gabaon”. Kalaunan ang Gabaon ay isa sa mga bayan ng Benjamin na ibinigay sa mga saserdote, ang mga anak ni Aaron."
    - "Sa tabi ng tangke ng Gabaon nagkita ang mga tauhan ni Abner at ni Joab, at labindalawa mula sa bawat panig ang sabay na nabuwal; kalaunan ay pinatay ni Joab si Amasa sa malaking bato sa Gabaon. Hinangad ni Saul na lipulin ang mga taga-Gabaon, at sa kapanahunan ni David ay isinisi rito ang isang taggutom. Nakatayo ang tabernakulo sa malaking mataas na dako sa Gabaon; doon naghandog si Salomon ng isang libong handog na susunugin, at napakita sa kaniya ang Panginoon sa panaginip. Si Hananias, ang propetang sumalungat kay Jeremias, ay mula sa Gabaon; naabutan ni Johanan si Ismael “sa tabi ng malaking bukal na nasa Gabaon”; at tumulong ang mga lalaki ng Gabaon sa muling pagtatayo ng pader ng Jerusalem sa ilalim ni Nehemias."
    - "Hinukay ni Pritchard ang isang malaking bilog na tangke na tinibag sa bato, kung saan ang isang hagdang lagusan ay umaabot nang mga 13 m pababa patungo sa silid ng tubig sa antas ng tubig sa lupa; iniuugnay ito ng marami sa tangke ng 2 Samuel, bagaman pinagtatalunan ang petsa nito. Sa huling Panahong Bakal, gumawa ng alak ang Gabaon: mahigit dalawang dosenang hawakan ng banga ang may pangalan ng bayan at ng kanilang mga may-ari, na ipinepetsa sa ika-8–7 siglo BK, ng ilan sa ika-6. Noong 66 AD, nagkampo ang gobernador Romano na si Cestius Gallus sa Gabao, limampung estadio mula sa Jerusalem, at doon umatras sa kaniyang pagbagsak. Kilala pa ni Eusebio ang isang nayon na may gayong pangalan."
  da:
    - "Gibeon er el-Jib, en landsby på en høj omkring 9 km nordvest for Jerusalem i Benjamins land. Identifikationen, foreslået af tidlige rejsende ud fra navnet, blev bekræftet, da James B. Pritchard fra University of Pennsylvania, der gravede her i fem sæsoner fra 1956 til 1962, fandt krukkehanke indskrevet med navnet Gibeon. Huler og grave hugget i højens klippe rummede keramik og begravelser fra tidlig og mellem bronzealder. Farao Sjisjaks liste over byer i Karnak nævner Gibeon blandt stederne på hans felttog sent i 900-tallet f.Kr."
    - "Josvas Bog kalder Gibeon »en stor Stad som en af de kongelige Stæder«. Dens folk, som hørte, hvad Josva havde gjort ved Jeriko og Ai, kom til ham i Gilgal med gamle sække og sønderrevne vinsække, som om de kom fra et fjernt land, og vandt et forbund; da narrestregen kom frem, blev de gjort til brændselshuggere og vandbærere. Fem amoritiske konger belejrede så Gibeon, Josva kom den til hjælp og slog dem på flugt og sagde: »Sol, staa stille i Gibeon«. Senere var Gibeon en af Benjamins byer, der blev givet præsterne, Arons sønner."
    - "Ved Gibeons dam mødtes Abners og Joabs mænd, og tolv fra hver side faldt sammen; senere dræbte Joab Amasa ved den store sten i Gibeon. Saul havde søgt at udrydde gibeonitterne, og i Davids dage blev en hungersnød ført tilbage til det. Tabernaklet stod på det store højsted i Gibeon; dér ofrede Salomo tusind brændofre, og Herren viste sig for ham i en drøm. Hananja, profeten der modsatte sig Jeremias, kom fra Gibeon; Johanan indhentede Ismael »ved det store Vand, som er i Gibeon«; og mænd fra Gibeon hjalp med at genopbygge Jerusalems mur under Nehemias."
    - "Pritchard afdækkede en stor rund dam hugget i klippen, hvorfra en trappetunnel førte omkring 13 m længere ned til et vandkammer ved grundvandsspejlet; mange sætter den i forbindelse med dammen i Anden Samuelsbog, selv om dens datering er omstridt. I sen jernalder lavede Gibeon vin: mere end to dusin krukkehanke bærer byens navn og ejernes navne, dateret til 700-tallet–600-tallet f.Kr., af nogle til 500-tallet. I 66 e.Kr. slog den romerske statholder Cestius Gallus lejr ved Gabao, halvtreds stadier fra Jerusalem, og faldt tilbage dertil under sit tilbagetog. Eusebios kendte stadig en landsby af samme navn."
