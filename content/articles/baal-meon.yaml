# Overview article (ADR 0007). Mainstream facts only; the identification with Ma'in rests on the name and Eusebius and is the usual one; the Mesha Stele line numbers follow the standard editions.
id: baal-meon
place: a76f7b7
title:
  en: "Baal-meon"
  ru: "Ваал-Меон"
  uk: "Ваал-Меон"
  es: "Baal-meón"
  pt: "Baal-Meom"
  de: "Baal-Meon"
  fr: "Baal-Meon"
