body:
  en:
    - "Baal-meon was a town on the plateau of Moab north of the Arnon, in the fertile wheat country south-west of Medeba. It is usually identified with Ma'in, a town about 7 km south-west of Madaba in Jordan whose name preserves the old one; Eusebius knew Beelmeon as a very large village near Mount Baaru, with its hot springs, nine miles from Heshbon, which fits the hot waters of Hammamat Ma'in in the gorge below. The Bible gives the name in four forms: Beon in the list of towns the tribes of Reuben and Gad asked for, Baal-meon among the towns Reuben rebuilt, “Beth-baal-meon” in Joshua, and Beth-meon in Jeremiah's oracle on Moab."
    - "Reuben's settlers rebuilt “Nebo, and Baal-meon, (their names being changed,)” and gave the towns new names, presumably to drop the name of the god Baal; Joshua assigns Reuben “Dibon, and Bamoth-baal, and Beth-baal-meon”, and the Reubenite chief Bela “dwelt in Aroer, even unto Nebo and Baal-meon”. The town changed hands with the plateau. On his stele, found at Dhiban and now in the Louvre, Mesha king of Moab, about 840 BC, says that he built Baal-meon and made a reservoir in it, and names Beth-baal-meon again among the places he restored. Ezekiel, in the sixth century, counts it with Beth-jeshimoth and Kiriathaim as the frontier cities of Moab, “the glory of the country”, to be opened to the men of the east."
    - "No excavation has traced the Iron Age town, but Ma'in was a considerable place in Byzantine times: a church on its acropolis has a mosaic floor of AD 719–720 with a border of the towns of the region, Belemounta among them; part of it is now kept at Madaba. Today Ma'in is a Jordanian town in the Madaba governorate, and the hot springs of Hammamat Ma'in below it are a resort above the Dead Sea."
  ru:
    - "Ваал-Меон — город на плоскогорье Моава к северу от Арнона, в хлебородной стране к юго-западу от Медевы. Его обычно отождествляют с Маином, городком примерно в 7 км к юго-западу от Мадабы в Иордании, чьё имя хранит древнее; Евсевий знал Веелмеон как очень большое селение у горы Ваару с её горячими источниками, в девяти милях от Есевона, что подходит к горячим водам Хаммамат-Маин в ущелье ниже. Библия даёт имя в четырёх видах: Веон в списке городов, которых просили колена Рувима и Гада, Ваал-Меон среди городов, отстроенных Рувимом, «Беф-Ваал-Меон» у Иисуса Навина и Бет-Маон в пророчестве Иеремии о Моаве."
    - "Поселенцы Рувима отстроили «Нево, и Ваал-Меон, которых имена переменены», и дали городам новые имена — надо думать, чтобы убрать имя бога Ваала; Иисус Навин отдаёт Рувиму «Дивон, Вамоф-Ваал и Беф-Ваал-Меон», а рувимский вождь Бела «обитал в Ароере до Нево и Ваал-Меона». Город переходил из рук в руки вместе с плоскогорьем. На своей стеле, найденной в Дивоне и хранящейся в Лувре, Меса, царь Моавитский, около 840 г. до н. э. говорит, что построил Ваал-Меон и сделал в нём водоём, и снова называет Беф-Ваал-Меон среди мест, которые восстановил. Иезекииль в VI веке называет его с Беф-Иешимофом и Кириафаимом среди пограничных городов Моава, «красы земли», которые будут открыты сынам востока."
    - "Раскопки не проследили город железного века, но в византийское время Маин был заметным местом: церковь на его акрополе имеет мозаичный пол 719–720 гг. н. э. с каймой из городов округи, среди них Велемунта; часть его хранится теперь в Мадабе. Сегодня Маин — иорданский городок в мухафазе Мадаба, а горячие источники Хаммамат-Маин под ним — курорт над Мёртвым морем."
  uk:
    - "Ваал-Меон було містом на плато Моаба на північ від Арнону, в родючому пшеничному краї на південний захід від Мадаби. Його зазвичай ототожнюють із Маїном, містом приблизно за 7 км на південний захід від Мадаби в Йорданії, чия назва зберігає давню; Євсевій знав Беельмеон як дуже велике село біля гори Баару, з гарячими джерелами, за дев'ять миль від Гесбону, що відповідає гарячим водам Хаммамат-Маїн в ущелині внизу. Біблія подає назву у чотирьох формах: Веон в переліку міст, яких просили племена Рувима і Гада, Ваал-Меон серед міст, відбудованих Рувимом, «Бет-Баал-Меон» у книзі Ісуса Навина і Бет-Меон у пророцтві Єремії про Моав."
    - "Поселенці Рувима відбудували «Небо та Бааль-Меон, перемінивши їх імена» і дали містам нові назви, імовірно, щоб відкинути ім'я бога Ваала; Ісус Навин визначає Рувимові «Дибон і Бамот-Баал і Бет-Баал-Меон», а рувимівський вождь Бела «жив ув Ароері до Нево та Баал-Меона». Місто переходило з рук у руки разом із плато. На своїй стелі, знайденій у Дібані й нині в Луврі, Меша, цар Моава, близько 840 р. до н. е. каже, що збудував Ваал-Меон і зробив у ньому водосховище, і знову називає Бет-Ваал-Меон серед відновлених ним місць. Єзекіїль у VI столітті зараховує його разом із Бет-Єшімотом і Кіріатаїмом до прикордонних міст Моава, «від краси землї», які буде відкрито для людей сходу."
    - "Жодні розкопки не виявили міста залізної доби, але Маїн був значним місцем за візантійських часів: церква на його акрополі має мозаїчну підлогу 719–720 рр. н. е. з облямівкою міст краю, серед них Белемунта; частину її нині зберігають у Мадабі. Нині Маїн — йорданське місто в мухафазі Мадаба, а гарячі джерела Хаммамат-Маїн під ним — курорт над Мертвим морем."
  es:
    - "Baal-meón era una ciudad de la meseta de Moab, al norte del Arnón, en la fértil región triguera al sudoeste de Medeba. Se identifica por lo común con Ma'in, una ciudad a unos 7 km al sudoeste de Madaba, en Jordania, cuyo nombre conserva el antiguo; Eusebio conocía Beelmeon como una aldea muy grande cerca del monte Baaru, con sus aguas termales, a nueve millas de Hesbón, lo que encaja con las aguas calientes de Hammamat Ma'in en la garganta de abajo. La Biblia da el nombre en cuatro formas: Beón en la lista de ciudades que pidieron las tribus de Rubén y Gad, Baal-meón entre las ciudades que reconstruyó Rubén, «Beth-baal-meón» en Josué y Bet-meón en el oráculo de Jeremías sobre Moab."
    - "Los colonos de Rubén reconstruyeron «Nebo, y Baal-meón, (mudados los nombres)» y dieron nuevos nombres a las ciudades, presumiblemente para suprimir el nombre del dios Baal; Josué asigna a Rubén «Dibón, y Bamoth-baal, y Beth-baal-meón», y el jefe rubenita Bela «habitó en Aroer hasta Nebo y Baal-meón». La ciudad cambió de manos con la meseta. En su estela, hallada en Dhiban y hoy en el Louvre, Mesa, rey de Moab, hacia 840 a. C., dice que construyó Baal-meón e hizo en ella un depósito de agua, y nombra de nuevo Bet-baal-meón entre los lugares que restauró. Ezequiel, en el siglo VI, la cuenta con Bet-jesimot y Quiriataim como las ciudades fronterizas de Moab, «las tierras deseables», que serían abiertas a los hombres del oriente."
    - "Ninguna excavación ha rastreado la ciudad de la edad del Hierro, pero Ma'in fue un lugar considerable en época bizantina: una iglesia en su acrópolis tiene un suelo de mosaico de 719–720 d. C. con una orla de las ciudades de la región, Belemounta entre ellas; parte de él se conserva hoy en Madaba. Hoy Ma'in es una ciudad jordana de la gobernación de Madaba, y las aguas termales de Hammamat Ma'in, bajo ella, son un balneario sobre el mar Muerto."
  pt:
    - "Baal-Meom era uma cidade no planalto de Moabe, ao norte do Arnom, na fértil região de trigo a sudoeste de Medeba. É geralmente identificada com Ma'in, uma cidade cerca de 7 km a sudoeste de Madaba, na Jordânia, cujo nome conserva o antigo; Eusébio conhecia Beelmeon como uma aldeia muito grande perto do monte Baaru, com suas fontes quentes, a nove milhas de Hesbom, o que combina com as águas quentes de Hammamat Ma'in, na garganta abaixo. A Bíblia dá o nome em quatro formas: Beom na lista de cidades que as tribos de Rúben e Gade pediram, Baal-Meom entre as cidades que Rúben reconstruiu, “Bete-Baal-Meom” em Josué e Bete-Meom no oráculo de Jeremias sobre Moabe."
    - "Os colonos de Rúben reconstruíram “Nebo e Baal-Meom (tendo seus nomes mudados)” e deram novos nomes às cidades, presumivelmente para abandonar o nome do deus Baal; Josué atribui a Rúben “Dibom, Bamote-Baal, Bete-Baal-Meom”, e o chefe rubenita Bela “habitou em Aroer, até Nebo e Baal-Meom”. A cidade mudou de mãos com o planalto. Em sua estela, achada em Dhiban e hoje no Louvre, Mesa, rei de Moabe, por volta de 840 a.C., diz que construiu Baal-Meom e fez nela um reservatório, e nomeia de novo Bete-Baal-Meom entre os lugares que restaurou. Ezequiel, no século VI, a conta com Bete-Jesimote e Quiriataim como as cidades de fronteira de Moabe, “a glória do país”, a serem abertas aos homens do oriente."
    - "Nenhuma escavação traçou a cidade da Idade do Ferro, mas Ma'in foi um lugar considerável na época bizantina: uma igreja em sua acrópole tem um piso de mosaico de 719–720 d.C. com uma borda das cidades da região, entre elas Belemounta; parte dele está hoje guardada em Madaba. Hoje Ma'in é uma cidade jordaniana da província de Madaba, e as fontes quentes de Hammamat Ma'in, abaixo, são um balneário acima do mar Morto."
  de:
    - "Baal-Meon war eine Stadt auf dem moabitischen Plateau nördlich des Arnon, im fruchtbaren Weizenland südwestlich von Medeba. Man setzt sie gewöhnlich mit Ma'in gleich, einer Stadt etwa 7 km südwestlich von Madaba in Jordanien, deren Name den alten bewahrt; Eusebius kannte Beelmeon als sehr großes Dorf nahe dem Berg Baaru mit seinen heißen Quellen, neun Meilen von Heschbon, was zu den heißen Wassern von Hammamat Ma'in in der Schlucht darunter passt. Die Bibel gibt den Namen in vier Formen: Beon in der Liste der Städte, die Ruben und Gad erbaten, Baal-Meon unter den von Ruben wieder aufgebauten Städten, „Beth-Baal-Meon“ bei Josua und Bet-Meon in Jeremias Spruch gegen Moab."
    - "Rubens Siedler bauten „Nebo, Baal-Meon, und änderten die Namen“ und gaben den Städten neue Namen, vermutlich um den Namen des Gottes Baal abzulegen; Josua weist Ruben „Dibon, Bamoth-Baal und Beth-Baal-Meon“ zu, und der rubenitische Fürst Bela „wohnte zu Aroer und bis gen Nebo und Baal-Meon“. Die Stadt wechselte mit dem Plateau den Besitzer. Auf seiner in Dhiban gefundenen und heute im Louvre befindlichen Stele sagt Mesa, der König von Moab, um 840 v. Chr., er habe Baal-Meon gebaut und darin ein Wasserbecken angelegt, und nennt Bet-Baal-Meon noch einmal unter den von ihm wiederhergestellten Orten. Hesekiel zählt es im 6. Jahrhundert mit Bet-Jeschimot und Kirjatajim zu den Grenzstädten Moabs, „das edle Land von Beth-Jesimoth, Baal-Meon und Kirjathaim“, das den Männern des Ostens geöffnet werden sollte."
    - "Keine Grabung hat die eisenzeitliche Stadt aufgespürt, doch Ma'in war in byzantinischer Zeit ein bedeutender Ort: Eine Kirche auf seiner Akropolis hat einen Mosaikboden von 719–720 n. Chr. mit einer Randleiste der Städte der Gegend, darunter Belemounta; ein Teil davon wird in Madaba aufbewahrt. Heute ist Ma'in eine jordanische Stadt im Gouvernement Madaba, und die heißen Quellen von Hammamat Ma'in darunter sind ein Kurort über dem Toten Meer."
  fr:
    - "Baal-Meon était une ville du plateau de Moab au nord de l’Arnon, dans le fertile pays de blé au sud-ouest de Médeba. Elle est d’ordinaire identifiée à Ma’in, ville à environ 7 km au sud-ouest de Madaba, en Jordanie, dont le nom conserve l’ancien ; Eusèbe connaissait Beelmeon comme un très grand village près du mont Baarou, avec ses sources chaudes, à neuf milles de Hesbon, ce qui convient aux eaux chaudes de Hammamat Ma’in dans la gorge en contrebas. La Bible donne le nom sous quatre formes : Béon dans la liste des villes que Ruben et Gad demandèrent, Baal-Meon parmi les villes que Ruben rebâtit, « Beth-Baal-Meon » dans Josué, et Beth-Méon dans l’oracle de Jérémie sur Moab."
    - "Les colons de Ruben rebâtirent « Nebo et Baal-Meon, dont les noms furent changés » et donnèrent de nouveaux noms aux villes, sans doute pour écarter le nom du dieu Baal ; Josué attribue à Ruben « Dibon, Bamoth-Baal, Beth-Baal-Meon », et le chef rubénite Béla « habitait à Aroër, et jusqu’à Nebo et à Baal-Meon ». La ville changea de mains avec le plateau. Sur sa stèle, trouvée à Dhiban et aujourd’hui au Louvre, Mescha, roi de Moab, vers 840 av. J.-C., dit avoir bâti Baal-Meon et y avoir fait un réservoir, et nomme de nouveau Beth-Baal-Meon parmi les lieux qu’il restaura. Ézéchiel, au VIe siècle, la compte avec Beth-Jeschimoth et Kirjathaïm comme villes frontières de Moab, « L’ornement du pays », destinées à être ouvertes aux hommes de l’Orient."
    - "Aucune fouille n’a retrouvé la ville de l’âge du Fer, mais Ma’in était un lieu considérable à l’époque byzantine : une église sur son acropole a un sol de mosaïque de 719-720 apr. J.-C. avec une bordure des villes de la région, dont Belemounta ; une partie est conservée à Madaba. Aujourd’hui Ma’in est une ville jordanienne du gouvernorat de Madaba, et les sources chaudes de Hammamat Ma’in au-dessous sont une station thermale au-dessus de la mer Morte."
  it:
    - "Baal-Meon era una città sull’altopiano di Moab a nord dell’Arnon, nella fertile regione granaria a sud-ovest di Màdaba. È di solito identificata con Ma‘in, una città a circa 7 km a sud-ovest di Madaba in Giordania il cui nome conserva l’antico; Eusebio conosceva Beelmeon come un grandissimo villaggio presso il monte Baaru, con le sue sorgenti calde, a nove miglia da Chesbon, il che si accorda con le acque calde di Hammamat Ma‘in nella gola sottostante. La Bibbia dà il nome in quattro forme: Beon nell’elenco delle città richieste dalle tribù di Ruben e Gad, Baal-Meon fra le città ricostruite da Ruben, «Beth-Baal-Meon» in Giosuè, e Bet-Meon nell’oracolo di Geremia su Moab."
    - "I coloni di Ruben ricostruirono «Nebo e Baal-Meon, i cui nomi furon mutati», e diedero alle città nuovi nomi, presumibilmente per eliminare il nome del dio Baal; Giosuè assegna a Ruben «Dibon, Bamoth-Baal, Beth-Baal-Meon», e il capo rubenita Bela «dimorava ad Aroer e si estendeva fino a Nebo ed a Baal-Meon». La città passò di mano con l’altopiano. Sulla sua stele, trovata a Dhiban e ora al Louvre, Mesa re di Moab, intorno all’840 a.C., dice di aver costruito Baal-Meon e di avervi fatto un serbatoio, e nomina di nuovo Bet-Baal-Meon fra i luoghi che restaurò. Ezechiele, nel VI secolo, la conta con Bet-Iesimòt e Kiriataim fra le città di frontiera di Moab, «lo splendore del paese», da aprire agli uomini dell’oriente."
    - "Nessuno scavo ha rintracciato la città dell’età del Ferro, ma Ma‘in fu un luogo considerevole in epoca bizantina: una chiesa sulla sua acropoli ha un pavimento a mosaico del 719–720 d.C. con una cornice delle città della regione, fra cui Belemounta; una parte è ora conservata a Madaba. Oggi Ma‘in è una città giordana nel governatorato di Madaba, e le sorgenti calde di Hammamat Ma‘in sottostanti sono una località di villeggiatura sopra il Mar Morto."
  pl:
    - "Baal-Meon było miastem na wyżynie Moabu na północ od Arnonu, w żyznym kraju pszenicy na południowy zachód od Medeby. Utożsamia się je zwykle z Ma'in, miastem około 7 km na południowy zachód od Madaby w Jordanii, którego nazwa zachowuje dawną; Euzebiusz znał Beelmeon jako bardzo dużą wieś koło góry Baaru, z gorącymi źródłami, dziewięć mil od Cheszbonu, co pasuje do gorących wód Hammamat Ma'in w wąwozie poniżej. Biblia podaje nazwę w czterech formach: Beon w wykazie miast, o które prosiły pokolenia Rubena i Gada, Baal-Meon wśród miast odbudowanych przez Rubena, „Bet Baal Meon” u Jozuego i Bet-Meon w wyroczni Jeremiasza o Moabie."
    - "Osadnicy Rubena odbudowali „Nebo, i Baalmeon, odmieniwszy im imiona” i nadali miastom nowe nazwy, najpewniej by odrzucić imię boga Baala; Jozue przydziela Rubenowi „Dybon i Bamot Baal, i Bet Baal Meon”, a rubenicki wódz Bela „mieszkał w Aroer aż ku Nebo i Baalmeon”. Miasto zmieniało właścicieli wraz z wyżyną. Na swej steli, znalezionej w Dhiban i dziś w Luwrze, Mesza, król Moabu, około 840 r. p.n.e., mówi, że zbudował Baal-Meon i wykonał w nim zbiornik, a Bet-Baal-Meon wymienia znów wśród miejsc, które odnowił. Ezechiel w VI wieku zalicza je z Bet-Jeszimot i Kiriataim do miast granicznych Moabu, „ozdobę ziemi”, które mają zostać otwarte dla ludzi ze wschodu."
    - "Żadne wykopaliska nie odsłoniły miasta z epoki żelaza, lecz Ma'in był znaczącym miejscem w czasach bizantyjskich: kościół na jego akropolu ma posadzkę mozaikową z lat 719–720 n.e. z obwódką z miastami regionu, wśród nich Belemounta; część znajduje się dziś w Madabie. Dziś Ma'in to jordańskie miasto w muhafazie Madaba, a gorące źródła Hammamat Ma'in poniżej niego są uzdrowiskiem nad Morzem Martwym."
  nl:
    - "Baäl-Meon was een stad op het plateau van Moab ten noorden van de Arnon, in het vruchtbare tarweland ten zuidwesten van Medeba. Zij wordt gewoonlijk geïdentificeerd met Ma’in, een stad zo’n 7 km ten zuidwesten van Madaba in Jordanië wier naam de oude bewaart; Eusebius kende Beelmeon als een zeer groot dorp nabij de berg Baaru, met zijn warme bronnen, negen mijl van Chesbon, wat past bij de warme wateren van Hammamat Ma’in in de kloof eronder. De Bijbel geeft de naam in vier vormen: Beon in de lijst van de steden die de stammen Ruben en Gad vroegen, Baäl-Meon onder de steden die Ruben herbouwde, “Beth-Baal-Meon” in Jozua, en Beth-Meon in Jeremia’s godsspraak over Moab."
    - "Rubens kolonisten herbouwden “Nebo, en Baal-Meon, veranderd zijnde van naam” en gaven de steden nieuwe namen, vermoedelijk om de naam van de god Baäl weg te laten; Jozua wijst Ruben toe “Dibon, en Bamoth-Baal, en Beth-Baal-Meon”, en de Rubenitische leider Bela “woonde te Aroer, en tot aan Nebo, en Baal-Meon”. De stad wisselde van hand met het plateau. Op zijn stèle, gevonden te Dhiban en nu in het Louvre, zegt Mesa, koning van Moab, omstreeks 840 v.Chr. dat hij Baäl-Meon bouwde en er een reservoir in maakte, en noemt Beth-Baäl-Meon opnieuw onder de plaatsen die hij herstelde. Ezechiël telt het in de zesde eeuw met Beth-Jesimot en Kirjataïm onder de grenssteden van Moab, “het sieraad des lands”, die voor de mannen van het oosten geopend zouden worden."
    - "Geen opgraving heeft de ijzertijdstad opgespoord, maar Ma’in was in Byzantijnse tijd een aanzienlijke plaats: een kerk op haar akropolis heeft een mozaïekvloer van 719–720 n.Chr. met een rand van de steden van de streek, Belemounta onder hen; een deel ervan wordt nu bewaard te Madaba. Tegenwoordig is Ma’in een Jordaanse stad in het gouvernement Madaba, en de warme bronnen van Hammamat Ma’in eronder vormen een kuuroord boven de Dode Zee."
  cs:
    - "Báal-meón bylo město na moábské planině severně od Arnonu, v úrodné pšeničné zemi jihozápadně od Medeby. Obvykle se ztotožňuje s Ma'inem, městem asi 7 km jihozápadně od Madaby v Jordánsku, jehož jméno uchovává staré; Eusebios znal Beelmeon jako velmi velkou vesnici poblíž hory Baaru, s jejími horkými prameny, devět mil od Chešbónu, což odpovídá horkým vodám Hammamat Ma'in v soutěsce pod ním. Bible uvádí jméno ve čtyřech podobách: Beon v seznamu měst, o něž žádaly kmeny Rúben a Gád, Báal-meón mezi městy, která Rúben přestavěl, „Betbalmeon“ v Jozue a Bét-meón v Jeremjášově proroctví o Moábu."
    - "Rúbenovi osadníci přestavěli „Nébo a Balmeon, změnivše jim jména“ a dali městům nová jména, zřejmě aby odstranili jméno boha Baala; Jozue přiděluje Rúbenovi „Dibon a Bamotbal a Betbalmeon“ a rúbenský náčelník Bela „bydlil v Aroer až do Nébo a Balmeon“. Město přecházelo s planinou z ruky do ruky. Na své stéle, nalezené v Dhibánu a nyní v Louvru, Meša, král Moábu, kolem roku 840 př. n. l. praví, že vystavěl Báal-meón a udělal v něm nádrž, a znovu jmenuje Bét-báal-meón mezi místy, která obnovil. Ezechiel v 6. století počítá toto město s Bét-ješimótem a Kirjatajimem mezi pohraniční města Moábu, jeho „rozkošnou zemi“, která se má otevřít mužům východu."
    - "Žádné vykopávky nevystopovaly město doby železné, ale Ma'in byl v byzantské době významným místem: kostel na jeho akropoli má mozaikovou podlahu z let 719–720 n. l. s bordurou měst oblasti, mezi nimi Belemounta; její část je nyní uchovávána v Madabě. Dnes je Ma'in jordánským městem v guvernorátu Madaba a horké prameny Hammamat Ma'in pod ním jsou lázeňským střediskem nad Mrtvým mořem."
