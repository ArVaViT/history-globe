body:
  en:
    - "Gath is identified with Tell es-Safi, a high mound where the Elah valley opens onto the coastal plain, about 9 km south of Ekron. The identification was first proposed in the nineteenth century, and after other sites were tried it is now widely accepted. The site fits the biblical geography, between Ekron and the hills of Judah, with the Philistines fleeing from the Elah valley toward Gath and Ekron; it was the largest Philistine city of the tenth and ninth centuries BC; and it was destroyed in the late ninth century, when Gath fell to Hazael. Excavations led by Aren Maeir of Bar-Ilan University, begun in 1996, show that the mound was settled from prehistoric to modern times."
    - "Gath was one of the five Philistine cities and the home of Goliath and of other giants whom David and his men killed. The captured ark was carried there from Ashdod, and plague followed it. Fleeing from Saul, David came to Achish, king of Gath; later he served Achish with six hundred men and received Ziklag from him. Ittai the Gittite and six hundred men from Gath stood by David when Absalom rebelled. Chronicles lists Gath among the towns Rehoboam fortified, and says that Uzziah broke down its wall."
    - "The Philistine city founded in the twelfth century BC grew into the largest city of the region. A potsherd of about the tenth century BC bears two names, alwt and wlt, which recall the name Goliath, though they do not refer to the giant. Late in the ninth century a siege trench was dug around the city and Gath was destroyed; this matches the report that Hazael, king of Syria, fought against Gath and took it. The city never regained its size. Amos points to Gath of the Philistines as a warning, and the cities that Amos, Zephaniah and Jeremiah condemn are Gaza, Ashkelon, Ashdod and Ekron, without Gath."
    - "Sargon II of Assyria lists Gath with Ashdod and Ashdod-Yam among the cities he took about 711 BC. In the fourth century AD Eusebius knew a village called Geth five miles from Eleutheropolis on the road to Diospolis; whether it stood on the old Philistine city is uncertain."
  ru:
    - "Геф отождествляют с Телль-эс-Сафи — высоким холмом там, где Долина дуба выходит на прибрежную равнину, примерно в 9 км к югу от Екрона. Это отождествление предложили ещё в XIX веке, и после того как пробовали другие места, оно получило широкое признание. Место подходит к библейской географии — между Екроном и горами Иудеи, и филистимляне бегут из Долины дуба к Гефу и Екрону; это был крупнейший филистимский город X–IX веков до н. э.; и он был разрушен в конце IX века, когда Геф взял Азаил. Раскопки Арена Маира из Бар-Иланского университета, начатые в 1996 г., показывают, что холм был заселён с доисторических до новых времён."
    - "Геф был одним из пяти филистимских городов и родиной Голиафа и других исполинов, которых убили Давид и его люди. Сюда из Азота перенесли захваченный ковчег, и вслед за ним пришла болезнь. Спасаясь от Саула, Давид пришёл к Анхусу, царю Гефскому; позднее он служил Анхусу с шестьюстами мужей и получил от него Секелаг. Еффей Гефянин и шестьсот человек из Гефа остались верны Давиду, когда восстал Авессалом. Вторая книга Паралипоменон относит Геф к городам, которые укрепил Ровоам, и говорит, что Озия разрушил его стены."
    - "Филистимский город, основанный в XII веке до н. э., вырос в крупнейший город края. На черепке около X века до н. э. написаны два имени, alwt и wlt, напоминающие имя Голиаф, хотя к самому исполину они не относятся. В конце IX века город окружили осадным рвом и разрушили; это совпадает с рассказом о том, что Азаил, царь Сирийский, пошёл войною на Геф и взял его. Прежних размеров город больше не достиг. Амос приводит Геф Филистимский в пример как предостережение, а города, которые осуждают Амос, Софония и Иеремия, — Газа, Аскалон, Азот и Екрон, без Гефа."
    - "Ассирийский царь Саргон II называет Геф вместе с Азотом и Ашдод-Ямом среди городов, взятых им около 711 г. до н. э. В IV веке н. э. Евсевий знал селение Геф в пяти милях от Елевферополя по дороге в Диосполь; стояло ли оно на месте древнего филистимского города, неясно."
  uk:
    - "Гат ототожнюють із Тель-ес-Сафі — високим городищем там, де долина Ела відкривається на прибережну рівнину, приблизно за 9 км на південь від Екрона. Це ототожнення вперше запропонували в XIX ст., і після того, як випробовували інші місця, його нині широко приймають. Місце відповідає біблійній географії, між Екроном і юдейськими пагорбами, де філістимляни тікають із долини Ела до Гата й Екрона; воно було найбільшим філістимським містом X–IX ст. до н. е.; і його зруйновано наприкінці IX ст., коли Гат упав перед Азаїлом. Розкопки під керівництвом Арена Маїра з Університету Бар-Ілан, розпочаті 1996 року, показують, що городище було заселене від доісторичних часів до новітніх."
    - "Гат був одним із п’яти філістимських міст і батьківщиною Голіята та інших велетнів, яких убили Давид і його люди. До Гата з Ашдода перенесли захоплений ковчег, і слідом за ним прийшла чума. Тікаючи від Саула, Давид прийшов до Анхуса, царя Гата; пізніше він служив Анхусові з шістьма сотнями людей і одержав від нього Ціклаг. Іттай Гатянин і шістсот чоловіків із Гата стояли при Давиді, коли повстав Авесалом. Хроніки зараховують Гат до міст, які укріпив Ровоам, і повідомляють, що Уззія зруйнував його мур."
    - "Філістимське місто, засноване в XII ст. до н. е., виросло в найбільше місто області. Черепок приблизно X ст. до н. е. має два імені — alwt і wlt, що нагадують ім’я Голіят, хоча до велетня вони не стосуються. Наприкінці IX ст. навколо міста викопали облоговий рів, і Гат було зруйновано; це збігається з повідомленням, що Азаїл, цар Сирії, воював проти Гата й узяв його. Місто вже ніколи не відновило свого розміру. Амос указує на Гат Філістимський як на застереження, а міста, які осуджують Амос, Софонія та Єремія, — Газа, Ашкелон, Ашдод і Екрон, без Гата."
    - "Саргон II Ассирійський заносить Гат разом з Ашдодом і Ашдод-Ямом до міст, які він узяв близько 711 р. до н. е. У IV ст. н. е. Євсевій знав село під назвою Геф за п’ять миль від Елевферополя на дорозі до Діосполя; чи стояло воно на місці давнього філістимського міста, невідомо."
  es:
    - "Gat se identifica con Tell es-Safi, un alto montículo donde el valle de Ela se abre a la llanura costera, a unos 9 km al sur de Ecrón. La identificación se propuso por primera vez en el siglo XIX y, tras ensayarse otros sitios, hoy se acepta ampliamente. El sitio concuerda con la geografía bíblica, entre Ecrón y las colinas de Judá, con los filisteos huyendo del valle de Ela hacia Gat y Ecrón; fue la mayor ciudad filistea de los siglos X y IX a. C.; y fue destruida a fines del siglo IX, cuando Gat cayó ante Hazael. Las excavaciones dirigidas por Aren Maeir, de la Universidad Bar-Ilan, iniciadas en 1996, muestran que el montículo estuvo poblado desde la prehistoria hasta la época moderna."
    - "Gat fue una de las cinco ciudades filisteas y la patria de Goliat y de otros gigantes a quienes mataron David y sus hombres. El arca capturada fue llevada allí desde Asdod, y la plaga la siguió. Huyendo de Saúl, David llegó a Aquis, rey de Gat; más tarde sirvió a Aquis con seiscientos hombres y recibió de él Siclag. Itai el guitita y seiscientos hombres de Gat permanecieron junto a David cuando Absalón se rebeló. Crónicas enumera Gat entre las ciudades que fortificó Roboam, y dice que Uzías derribó su muro."
    - "La ciudad filistea fundada en el siglo XII a. C. se convirtió en la mayor de la región. Un tiesto de hacia el siglo X a. C. lleva dos nombres, alwt y wlt, que recuerdan el nombre Goliat, aunque no se refieren al gigante. A fines del siglo IX se excavó una trinchera de asedio alrededor de la ciudad y Gat fue destruida; esto concuerda con la noticia de que Hazael, rey de Siria, peleó contra Gat y la tomó. La ciudad nunca recobró su tamaño. Amós señala a Gat de los filisteos como una advertencia, y las ciudades que condenan Amós, Sofonías y Jeremías son Gaza, Ascalón, Asdod y Ecrón, sin Gat."
    - "Sargón II de Asiria enumera Gat con Asdod y Asdod-Yam entre las ciudades que tomó hacia el 711 a. C. En el siglo IV d. C. Eusebio conoció una aldea llamada Geth a cinco millas de Eleuterópolis, en el camino de Diospolis; no es seguro que se alzara sobre la antigua ciudad filistea."
  pt:
    - "Gate é identificada com Tell es-Safi, um monte alto onde o vale de Elá se abre para a planície costeira, a cerca de 9 km ao sul de Ecrom. A identificação foi proposta pela primeira vez no século XIX e, depois de outros sítios terem sido tentados, é hoje amplamente aceita. O sítio se ajusta à geografia bíblica, entre Ecrom e as colinas de Judá, com os filisteus fugindo do vale de Elá em direção a Gate e Ecrom; foi a maior cidade filisteia dos séculos X e IX a.C.; e foi destruída no fim do século IX, quando Gate caiu diante de Hazael. As escavações dirigidas por Aren Maeir, da Universidade Bar-Ilan, iniciadas em 1996, mostram que o monte foi habitado da pré-história aos tempos modernos."
    - "Gate foi uma das cinco cidades filisteias e a terra de Golias e de outros gigantes que Davi e seus homens mataram. A arca capturada foi levada para lá desde Asdode, e a praga a seguiu. Fugindo de Saul, Davi foi a Aquis, rei de Gate; mais tarde serviu a Aquis com seiscentos homens e dele recebeu Ziclague. Itai, o geteu, e seiscentos homens de Gate ficaram ao lado de Davi quando Absalão se rebelou. Crônicas inclui Gate entre as cidades que Roboão fortificou e diz que Uzias derrubou o seu muro."
    - "A cidade filisteia fundada no século XII a.C. cresceu até se tornar a maior da região. Um caco de cerâmica de cerca do século X a.C. traz dois nomes, alwt e wlt, que lembram o nome Golias, embora não se refiram ao gigante. No fim do século IX uma trincheira de cerco foi cavada em torno da cidade e Gate foi destruída; isso concorda com o relato de que Hazael, rei da Síria, lutou contra Gate e a tomou. A cidade nunca recuperou o seu tamanho. Amós aponta Gate dos filisteus como advertência, e as cidades que Amós, Sofonias e Jeremias condenam são Gaza, Ascalom, Asdode e Ecrom, sem Gate."
    - "Sargão II da Assíria lista Gate com Asdode e Asdode-Iam entre as cidades que tomou por volta de 711 a.C. No século IV d.C., Eusébio conheceu uma aldeia chamada Geth, a cinco milhas de Eleutéropolis, no caminho para Dióspolis; se ela ficava sobre a antiga cidade filisteia, é incerto."
  de:
    - "Gat wird mit Tell es-Safi gleichgesetzt, einem hohen Hügel, wo sich das Elatal zur Küstenebene öffnet, etwa 9 km südlich von Ekron. Die Gleichsetzung wurde zuerst im 19. Jahrhundert vorgeschlagen und ist, nachdem andere Stätten erprobt worden waren, heute weithin anerkannt. Die Stätte passt zur biblischen Geographie, zwischen Ekron und dem Bergland Judas, mit den Philistern, die aus dem Elatal Richtung Gat und Ekron fliehen; sie war die größte philistäische Stadt des 10. und 9. Jahrhunderts v. Chr.; und sie wurde im späten 9. Jahrhundert zerstört, als Gat an Hasaël fiel. Grabungen unter Leitung von Aren Maeir von der Bar-Ilan-Universität, begonnen 1996, zeigen, dass der Hügel von der Vorgeschichte bis in die Neuzeit besiedelt war."
    - "Gat war eine der fünf philistäischen Städte und die Heimat Goliats und anderer Riesen, die David und seine Männer erschlugen. Die erbeutete Lade wurde von Aschdod dorthin gebracht, und die Plage folgte ihr. Auf der Flucht vor Saul kam David zu Achis, dem König von Gat; später diente er Achis mit sechshundert Mann und erhielt von ihm Ziklag. Ittai, der Gatiter, und sechshundert Männer aus Gat standen zu David, als Absalom sich erhob. Die Chronik zählt Gat unter die Städte, die Rehabeam befestigte, und sagt, dass Usija seine Mauer niederriss."
    - "Die im 12. Jahrhundert v. Chr. gegründete philistäische Stadt wuchs zur größten der Gegend heran. Eine Tonscherbe aus der Zeit um das 10. Jahrhundert v. Chr. trägt zwei Namen, alwt und wlt, die an den Namen Goliat erinnern, sich aber nicht auf den Riesen beziehen. Spät im 9. Jahrhundert wurde ein Belagerungsgraben um die Stadt gezogen, und Gat wurde zerstört; das passt zum Bericht, dass Hasaël, der König von Syrien, gegen Gat stritt und es gewann. Die Stadt erlangte ihre Größe nie wieder. Amos verweist auf „Gath der Philister“ als Warnung, und die Städte, die Amos, Zefanja und Jeremia verurteilen, sind Gaza, Aschkelon, Aschdod und Ekron, ohne Gat."
    - "Sargon II. von Assyrien führt Gat mit Aschdod und Aschdod-Jam unter den Städten auf, die er um 711 v. Chr. einnahm. Im 4. Jahrhundert n. Chr. kannte Eusebius ein Dorf namens Geth fünf Meilen von Eleutheropolis an der Straße nach Diospolis; ob es auf der alten philistäischen Stadt stand, ist ungewiss."
  fr:
    - "Gath est identifiée à Tell es-Safi, un haut tertre où la vallée d’Éla débouche sur la plaine côtière, à environ 9 km au sud d’Ékron. Cette identification, proposée d’abord au XIXe siècle, est aujourd’hui largement admise après l’essai d’autres sites. Le site s’accorde avec la géographie biblique, entre Ékron et les collines de Juda, les Philistins fuyant la vallée d’Éla vers Gath et Ékron ; c’était la plus grande ville philistine des Xe et IXe siècles av. J.-C. ; et elle fut détruite à la fin du IXe siècle, quand Gath tomba aux mains de Hazaël. Les fouilles dirigées par Aren Maeir, de l’Université Bar-Ilan, commencées en 1996, montrent que le tertre fut habité de la préhistoire aux temps modernes."
    - "Gath était l’une des cinq villes philistines, la patrie de Goliath et d’autres géants que David et ses hommes tuèrent. L’arche capturée y fut transportée depuis Asdod, et le fléau l’y suivit. Fuyant Saül, David vint chez Akisch, roi de Gath ; plus tard, il servit Akisch avec six cents hommes et reçut de lui Tsiklag. Ittaï de Gath et six cents hommes de Gath se tinrent aux côtés de David quand Absalom se révolta. Les Chroniques rangent Gath parmi les villes que Roboam fortifia, et disent qu’Ozias abattit ses murs."
    - "La ville philistine fondée au XIIe siècle av. J.-C. devint la plus grande de la région. Un tesson d’environ le Xe siècle av. J.-C. porte deux noms, alwt et wlt, qui rappellent le nom de Goliath, sans toutefois désigner le géant. À la fin du IXe siècle, une tranchée de siège fut creusée autour de la ville et Gath fut détruite ; cela concorde avec le récit selon lequel Hazaël, roi de Syrie, combattit contre Gath et s’en empara. La ville ne retrouva jamais sa taille. Amos montre Gath des Philistins comme un avertissement, et les villes que condamnent Amos, Sophonie et Jérémie sont Gaza, Askalon, Asdod et Ékron, sans Gath."
    - "Sargon II d’Assyrie range Gath avec Asdod et Asdod-Yam parmi les villes qu’il prit vers 711 av. J.-C. Au IVe siècle apr. J.-C., Eusèbe connaissait un village appelé Geth à cinq milles d’Éleuthéropolis, sur la route de Diospolis ; on ne sait s’il se dressait sur l’ancienne ville philistine."
  pl:
    - "Gat utożsamia się z Tell es-Safi, wysokim pagórkiem, gdzie dolina Ela otwiera się na nizinę nadmorską, około 9 km na południe od Ekronu. Utożsamienie to zaproponowano po raz pierwszy w XIX w., a po wypróbowaniu innych stanowisk jest dziś powszechnie przyjmowane. Miejsce pasuje do biblijnej geografii, między Ekronem a wzgórzami Judy, gdy Filistyni uciekali z doliny Ela w stronę Gat i Ekronu; było największym miastem filistyńskim X i IX w. p.n.e.; zostało zniszczone pod koniec IX w., gdy Gat padło łupem Chazaela. Wykopaliska prowadzone od 1996 r. pod kierunkiem Arena Maeira z Uniwersytetu Bar-Ilana pokazują, że pagórek był zasiedlony od czasów prehistorycznych po nowożytne."
    - "Gat było jednym z pięciu miast filistyńskich i rodzinnym miastem Goliata oraz innych olbrzymów, których zabili Dawid i jego ludzie. Zdobytą arkę przeniesiono tam z Aszdodu i zaraza poszła za nią. Uciekając przed Saulem, Dawid przybył do Achisza, króla Gat; później służył Achiszowi z sześciuset ludźmi i otrzymał od niego Siklag. Ittaj z Gat i sześciuset ludzi z Gat stanęli przy Dawidzie, gdy zbuntował się Absalom. Księgi Kronik wymieniają Gat wśród miast ufortyfikowanych przez Roboama i mówią, że Uzzjasz zburzył jego mur."
    - "Miasto filistyńskie założone w XII w. p.n.e. wyrosło na największe w regionie. Czerep z około X w. p.n.e. nosi dwa imiona, alwt i wlt, przypominające imię Goliat, choć nie odnoszą się do olbrzyma. Pod koniec IX w. wokół miasta wykopano rów oblężniczy i Gat zniszczono; zgadza się to z doniesieniem, że Chazael, król Syrii, walczył z Gat i zdobył je. Miasto nigdy nie odzyskało dawnych rozmiarów. Amos wskazuje Gat filistyńskie jako przestrogę, a miasta, które potępiają Amos, Sofoniasz i Jeremiasz, to Gaza, Aszkelon, Aszdod i Ekron, bez Gat."
    - "Sargon II z Asyrii wymienia Gat obok Aszdodu i Aszdod-Jam wśród miast zdobytych około 711 r. p.n.e. W IV w. n.e. Euzebiusz znał wieś zwaną Geth, pięć mil od Eleuteropolis przy drodze do Diospolis; czy stała ona na miejscu dawnego miasta filistyńskiego, nie jest pewne."
  it:
    - "Gat è identificata con Tell es-Safi, un alto tell dove la valle di Ela si apre sulla pianura costiera, circa 9 km a sud di Ekron. L’identificazione fu proposta la prima volta nell’Ottocento e, dopo che furono provati altri siti, è oggi largamente accettata. Il sito si accorda con la geografia biblica, fra Ekron e i colli di Giuda, con i Filistei in fuga dalla valle di Ela verso Gat ed Ekron; fu la più grande città filistea del X e IX secolo a.C.; e fu distrutta alla fine del IX secolo, quando Gat cadde in mano a Cazaèl. Gli scavi diretti da Aren Maeir dell’Università Bar-Ilan, iniziati nel 1996, mostrano che il tell fu abitato dall’epoca preistorica a quella moderna."
    - "Gat era una delle cinque città filistee e la patria di Golia e di altri giganti che Davide e i suoi uomini uccisero. L’arca catturata vi fu portata da Asdod, e il flagello la seguì. Fuggendo da Saul, Davide giunse da Achis, re di Gat; più tardi servì Achis con seicento uomini e ricevette da lui Siclag. Ittai il Ghitteo e seicento uomini di Gat stettero con Davide quando Assalonne si ribellò. Le Cronache elencano Gat fra le città fortificate da Roboamo, e dicono che Ozia ne abbatté le mura."
    - "La città filistea fondata nel XII secolo a.C. crebbe fino a diventare la più grande della regione. Un coccio del X secolo a.C. circa reca due nomi, alwt e wlt, che richiamano il nome Golia, benché non si riferiscano al gigante. Alla fine del IX secolo fu scavata una trincea d’assedio intorno alla città e Gat fu distrutta; ciò corrisponde alla notizia che Cazaèl, re di Siria, combatté contro Gat e la prese. La città non recuperò mai la sua grandezza. Amos indica Gat dei Filistei come un monito, e le città condannate da Amos, Sofonia e Geremia sono Gaza, Ascalona, Asdod ed Ekron, senza Gat."
    - "Sargon II d’Assiria elenca Gat con Asdod e Asdod-Yam fra le città da lui prese verso il 711 a.C. Nel IV secolo d.C. Eusebio conosceva un villaggio chiamato Geth a cinque miglia da Eleuteropoli sulla strada per Diospoli; se sorgesse sull’antica città filistea è incerto."
  nl:
    - "Gat wordt vereenzelvigd met Tell es-Safi, een hoge heuvel waar de Elavallei uitkomt op de kustvlakte, ongeveer 9 km ten zuiden van Ekron. Deze identificatie werd voor het eerst in de 19e eeuw voorgesteld en wordt, nadat andere plaatsen zijn geprobeerd, nu algemeen aanvaard. De plaats past bij de bijbelse geografie, tussen Ekron en het bergland van Juda, met de Filistijnen die uit de Elavallei vluchten naar Gat en Ekron; het was de grootste Filistijnse stad van de 10e en 9e eeuw v.Chr.; en het werd aan het eind van de 9e eeuw verwoest, toen Gat viel voor Hazaël. Opgravingen onder leiding van Aren Maeir van de Bar-Ilan-universiteit, begonnen in 1996, tonen aan dat de heuvel van de prehistorie tot de moderne tijd bewoond is geweest."
    - "Gat was een van de vijf Filistijnse steden en de woonplaats van Goliat en van andere reuzen die David en zijn mannen doodden. De buitgemaakte ark werd vanuit Asdod daarheen gebracht, en de plaag volgde haar. Op de vlucht voor Saul kwam David bij Achis, de koning van Gat; later diende hij Achis met zeshonderd man en kreeg van hem Ziklag. Ittai uit Gat en zeshonderd man uit Gat stonden David bij toen Absalom in opstand kwam. Kronieken noemt Gat onder de steden die Rehabeam versterkte, en zegt dat Uzzia zijn muur afbrak."
    - "De Filistijnse stad, gesticht in de 12e eeuw v.Chr., groeide uit tot de grootste stad van de streek. Een potscherf uit ongeveer de 10e eeuw v.Chr. draagt twee namen, alwt en wlt, die herinneren aan de naam Goliat, al verwijzen zij niet naar de reus. Laat in de 9e eeuw werd een belegeringsgracht rond de stad gegraven en werd Gat verwoest; dat komt overeen met het bericht dat Hazaël, de koning van Syrië, tegen Gat streed en het innam. De stad kreeg haar omvang nooit meer terug. Amos wijst op Gat van de Filistijnen als waarschuwing, en de steden die Amos, Zefanja en Jeremia veroordelen zijn Gaza, Askelon, Asdod en Ekron, zonder Gat."
    - "Sargon II van Assyrië noemt Gat samen met Asdod en Asdod-Yam onder de steden die hij omstreeks 711 v.Chr. innam. In de 4e eeuw n.Chr. kende Eusebius een dorp Geth op vijf mijl van Eleutheropolis aan de weg naar Diospolis; of het op de plaats van de oude Filistijnse stad lag, is onzeker."
  cs:
    - "Gat se ztotožňuje s Tell es-Safí, vysokým pahorkem, kde se údolí Éla otevírá do pobřežní roviny, asi 9 km jižně od Ekronu. Ztotožnění bylo poprvé navrženo v 19. století a poté, co byla vyzkoušena jiná místa, je dnes široce přijímáno. Místo odpovídá biblickému zeměpisu, mezi Ekronem a judskými horami, kdy Pelištejci utíkají z údolí Éla k Gatu a Ekronu; bylo největším pelištejským městem 10. a 9. stol. př. n. l.; a bylo zničeno koncem 9. století, kdy Gat padl Chazaelovi. Vykopávky vedené Arenem Maeirem z Univerzity Bar-Ilan, zahájené roku 1996, ukazují, že pahorek byl osídlen od pravěku do novověku."
    - "Gat byl jedním z pěti pelištejských měst a domovem Goliáše a dalších obrů, které David a jeho muži zabili. Zajatá schrána byla do něj přenesena z Ašdodu a mor ji provázel. David, prchající před Saulem, přišel k Achišovi, králi Gatu; později Achišovi sloužil se šesti sty muži a obdržel od něho Siklag. Itaj Gatský a šest set mužů z Gatu stáli při Davidovi, když se Abšalom vzbouřil. Letopisy uvádějí Gat mezi městy, která Rechabeám opevnil, a praví, že Uzijáš zbořil jeho hradbu."
    - "Pelištejské město založené ve 12. stol. př. n. l. vyrostlo v největší město oblasti. Střep z přibližně 10. stol. př. n. l. nese dvě jména, alwt a wlt, která připomínají jméno Goliáš, třebaže se nevztahují k obrovi. Koncem 9. století byl kolem města vykopán obléhací příkop a Gat byl zničen; to odpovídá zprávě, že Chazael, král Sýrie, bojoval proti Gatu a dobyl ho. Město už nikdy nedosáhlo své dřívější velikosti. Amos poukazuje na Gat Pelištejských jako na varování a města, která Amos, Sofonjáš a Jeremjáš odsuzují, jsou Gaza, Aškelon, Ašdod a Ekron, bez Gatu."
    - "Sargon II. Asyrský uvádí Gat s Ašdodem a Ašdod-Jamem mezi městy, která dobyl kolem roku 711 př. n. l. Ve 4. století n. l. znal Eusebios vesnici zvanou Geth pět mil od Eleutheropole na cestě do Diospole; zda stála na místě starého pelištejského města, je nejisté."
  sv:
    - "Gat identifieras med Tell es-Safi, en hög kulle där Elas dal öppnar sig mot kustslätten, omkring 9 km söder om Ekron. Identifieringen föreslogs först på 1800-talet, och efter att andra platser prövats är den nu allmänt accepterad. Platsen passar den bibliska geografin, mellan Ekron och Judas berg, med filistéerna som flyr från Elas dal mot Gat och Ekron; den var den största filisteiska staden på 900- och 800-talen f.Kr.; och den förstördes sent på 800-talet, då Gat föll för Hasael. Utgrävningar under ledning av Aren Maeir vid Bar-Ilan-universitetet, påbörjade 1996, visar att kullen var bebodd från förhistorisk till modern tid."
    - "Gat var en av de fem filisteiska städerna och hemort för Goljat och för andra jättar som David och hans män dödade. Den tillfångatagna arken fördes dit från Ashdod, och pesten följde den. På flykt undan Saul kom David till Akish, kung i Gat; senare tjänade han Akish med sex hundra man och fick Siklag av honom. Gatiten Ittaj och sex hundra män från Gat stod vid Davids sida när Absalom gjorde uppror. Krönikeboken räknar upp Gat bland de städer Rehabeam befäste och säger att Ussia bröt ned dess mur."
    - "Den filisteiska staden, grundad på 1100-talet f.Kr., växte till regionens största. En krukskärva från omkring 900-talet f.Kr. bär två namn, alwt och wlt, som erinrar om namnet Goljat, fast de inte syftar på jätten. Sent på 800-talet grävdes en belägringsgrav kring staden och Gat förstördes; det stämmer med uppgiften att Hasael, kung av Syrien, stred mot Gat och intog det. Staden återfick aldrig sin forna storlek. Amos pekar på filistéernas Gat som en varning, och de städer som Amos, Sefanja och Jeremia dömer är Gaza, Ashkelon, Ashdod och Ekron, utan Gat."
    - "Sargon II av Assyrien nämner Gat tillsammans med Ashdod och Ashdod-Yam bland de städer han intog omkring 711 f.Kr. På 300-talet e.Kr. kände Eusebios en by kallad Geth fem romerska mil från Eleutheropolis på vägen mot Diospolis; om den låg på den gamla filisteiska staden är osäkert."
  nb:
    - "Gat identifiseres med Tell es-Safi, en høy haug der Ela-dalen åpner seg mot kystsletten, omtrent 9 km sør for Ekron. Identifikasjonen ble først foreslått på 1800-tallet, og etter at andre steder var prøvd, er den nå bredt akseptert. Stedet passer med den bibelske geografien, mellom Ekron og Judas åser, med filistrene på flukt fra Ela-dalen mot Gat og Ekron; det var den største filistiske byen på 900- og 800-tallet f.Kr.; og det ble ødelagt sent på 800-tallet, da Gat falt for Hasael. Utgravninger ledet av Aren Maeir ved Bar-Ilan-universitetet, begynt i 1996, viser at haugen var bosatt fra forhistorisk til moderne tid."
    - "Gat var en av de fem filistiske byene og hjemstedet til Goliat og til andre kjemper som David og hans menn drepte. Den erobrede arken ble ført dit fra Asjdod, og pest fulgte den. På flukt fra Saul kom David til Akisj, kongen i Gat; senere tjente han Akisj med seks hundre mann og fikk Siklag av ham. Gittitten Ittai og seks hundre menn fra Gat sto ved Davids side da Absalom gjorde opprør. Krønikebøkene regner opp Gat blant byene Rehabeam befestet, og sier at Ussia rev ned muren."
    - "Den filistiske byen, grunnlagt på 1100-tallet f.Kr., vokste til regionens største by. Et potteskår fra omkring 900-tallet f.Kr. bærer to navn, alwt og wlt, som minner om navnet Goliat, selv om de ikke refererer til kjempen. Sent på 800-tallet ble det gravd en beleiringsgrøft rundt byen og Gat ble ødelagt; dette stemmer med beretningen om at Hasael, kongen i Syria, stred mot Gat og inntok den. Byen fikk aldri tilbake sin størrelse. Amos peker på Gat i Filisterland som en advarsel, og byene som Amos, Sefanja og Jeremia dømmer, er Gasa, Asjkelon, Asjdod og Ekron, uten Gat."
    - "Sargon 2. av Assyria oppfører Gat sammen med Asjdod og Asjdod-Yam blant byene han tok omkring 711 f.Kr. På 300-tallet e.Kr. kjente Eusebius en landsby kalt Geth fem romerske mil fra Eleutheropolis på veien til Diospolis; om den lå på den gamle filistiske byen, er usikkert."
  tl:
    - "Ang Gath ay kinikilala bilang ang Tell es-Safi, isang mataas na burol kung saan bumubukas ang libis ng Ela sa kapatagan sa baybayin, mga 9 km sa timog ng Ecron. Unang iminungkahi ang pagkakakilanlang ito noong ika-19 na siglo, at pagkatapos masubukan ang ibang lugar ay malawak na itong tinatanggap. Umaangkop ang lugar sa heograpiya ng Biblia, sa pagitan ng Ecron at ng mga burol ng Juda, na ang mga Filisteo ay tumatakas mula sa libis ng Ela patungong Gath at Ecron; ito ang pinakamalaking lungsod ng mga Filisteo noong ika-10 at ika-9 na siglo BK; at nawasak ito sa huling bahagi ng ika-9 na siglo, nang mahulog ang Gath kay Hazael. Ipinakikita ng mga paghuhukay na pinamunuan ni Aren Maeir ng Unibersidad ng Bar-Ilan, na nagsimula noong 1996, na ang burol ay tinirhan mula sa sinaunang panahon hanggang sa makabagong panahon."
    - "Ang Gath ay isa sa limang lungsod ng mga Filisteo at tahanan ni Goliath at ng iba pang mga higante na pinatay nina David at ng kaniyang mga tauhan. Dinala roon ang nahuling kaban mula sa Asdod, at sumunod ang salot. Sa pagtakas kay Saul, pumunta si David kay Achis, hari ng Gath; kalaunan ay naglingkod siya kay Achis kasama ang anim na raang lalaki at tumanggap mula rito ng Siclag. Si Ittai na Getheo at anim na raang lalaki mula sa Gath ay nanindigan kasama ni David nang maghimagsik si Absalom. Itinatala ng Mga Cronica ang Gath sa mga bayang pinatibay ni Roboam, at sinasabing giniba ni Uzzias ang pader nito."
    - "Ang lungsod ng mga Filisteo na itinatag noong ika-12 siglo BK ay lumago bilang pinakamalaking lungsod ng rehiyon. Isang pira-pirasong palayok mga ika-10 siglo BK ang may dalawang pangalan, alwt at wlt, na nagpapaalaala sa pangalang Goliath, bagaman hindi tumutukoy sa higante. Sa huling bahagi ng ika-9 na siglo ay hinukay ang isang trinsera ng pagkubkob sa palibot ng lungsod at nawasak ang Gath; tumutugma ito sa ulat na nakipaglaban si Hazael, hari ng Siria, sa Gath at sinakop ito. Hindi na nabawi ng lungsod ang dating laki nito. Itinuturo ni Amos ang Gath ng mga Filisteo bilang babala, at ang mga lungsod na hinahatulan nina Amos, Zefanias at Jeremias ay ang Gaza, Ascalon, Asdod at Ecron, nang walang Gath."
    - "Itinatala ni Sargon II ng Asiria ang Gath kasama ang Asdod at Asdod-Yam sa mga lungsod na sinakop niya mga 711 BK. Noong ika-4 na siglo AD, kilala ni Eusebio ang isang nayong tinatawag na Geth, limang milya mula sa Eleutheropolis sa daan patungong Diospolis; hindi tiyak kung nakatayo ito sa lumang lungsod ng mga Filisteo."
  da:
    - "Gat identificeres med Tell es-Safi, en høj, hvor Ela-dalen åbner sig mod kystsletten, omkring 9 km syd for Ekron. Identifikationen blev første gang foreslået i 1800-tallet, og efter at andre steder var prøvet, er den nu bredt accepteret. Stedet passer til den bibelske geografi, mellem Ekron og Judas bjerge, med filisterne flygtende fra Ela-dalen mod Gat og Ekron; det var den største filistæiske by i 900-tallet og 800-tallet f.Kr.; og det blev ødelagt sent i 800-tallet, da Gat faldt til Hazael. Udgravninger ledet af Aren Maeir fra Bar-Ilan Universitet, påbegyndt i 1996, viser, at højen var bebygget fra forhistorisk til nyere tid."
    - "Gat var en af de fem filistæiske byer og hjemsted for Goliat og for andre kæmper, som David og hans mænd dræbte. Den erobrede ark blev ført dertil fra Asdod, og pesten fulgte den. På flugt fra Saul kom David til Akisj, konge af Gat; senere tjente han Akisj med seks hundrede mand og fik Siklag af ham. Ittaj gittitten og seks hundrede mænd fra Gat stod ved Davids side, da Absalon gjorde oprør. Krønikebøgerne opregner Gat blandt de byer, Rehabeam befæstede, og siger, at Uzzija nedrev dens mur."
    - "Den filistæiske by, grundlagt i 1100-tallet f.Kr., voksede til regionens største by. Et potteskår fra omkring 900-tallet f.Kr. bærer to navne, alwt og wlt, som minder om navnet Goliat, selv om de ikke henviser til kæmpen. Sent i 800-tallet blev der gravet en belejringsgrav omkring byen, og Gat blev ødelagt; det stemmer med beretningen om, at Hazael, konge af Syrien, kæmpede mod Gat og indtog den. Byen nåede aldrig sin tidligere størrelse. Amos peger på Gat i Filisterlandet som en advarsel, og de byer, som Amos, Sefanja og Jeremias dømmer, er Gaza, Askalon, Asdod og Ekron, uden Gat."
    - "Sargon II af Assyrien opregner Gat sammen med Asdod og Asdod-Yam blandt de byer, han indtog omkring 711 f.Kr. I 300-tallet e.Kr. kendte Eusebios en landsby kaldet Geth fem romerske mil fra Eleutheropolis på vejen til Diospolis; om den lå på den gamle filistæiske bys sted, er usikkert."
  sr:
    - "Гат се поистовећује с Тел ес-Сафијем, високом хумком где се долина Иле отвара на приобалну равницу, око 9 км јужно од Акарона. Поистовећење је први пут предложено у деветнаестом веку, а пошто су испробана и друга места, данас је широко прихваћено. Налазиште одговара библијској географији, између Акарона и јудејских брда, јер Филистеји беже из долине Иле према Гату и Акарону; био је највећи филистејски град десетог и деветог века п. н. е.; и разорен је крајем деветог века, када је Гат пао пред Азаилом. Ископавања која од 1996. води Арен Маир са Универзитета Бар-Илан показују да је хумка била насељена од праисторије до новијег доба."
    - "Гат је био један од пет филистејских градова и завичај Голијата и других дивова које су Давид и његови људи побили. Заробљени ковчег пренет је тамо из Азота, а за њим је дошла куга. Бежећи од Саула, Давид је дошао Ахису, цару гатском; касније је служио Ахису са шест стотина људи и од њега примио Сиклаг. Итај Гетејин и шест стотина људи из Гата стајали су уз Давида кад се Авесалом побунио. Летописи набрајају Гат међу градовима које је Ровоам утврдио и кажу да је Озија срушио његов зид."
    - "Филистејски град основан у дванаестом веку п. н. е. израстао је у највећи град области. На једном ломку посуђа из око десетог века п. н. е. стоје два имена, алвт и влт, која подсећају на име Голијат, мада се не односе на дива. Крајем деветог века ископан је опсадни ров око града и Гат је разорен; то се слаже с вешћу да је Азаило, цар сирски, војевао на Гат и узео га. Град никад није повратио раније величине. Амос указује на Гат филистејски као на опомену, а градови које осуђују Амос, Софонија и Јеремија јесу Газа, Аскалон, Азот и Акарон, без Гата."
    - "Саргон II Асирски набраја Гат са Азотом и Азот-Јамом међу градовима које је узео око 711. п. н. е. У четвртом веку н. е. Јевсевије је знао село по имену Гет пет миља од Елеутерополиса на путу за Диосполис; да ли је стајало на месту старог филистејског града, није извесно."
