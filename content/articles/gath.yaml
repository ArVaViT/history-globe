# Overview article (ADR 0007). Mainstream facts only; Assyrian dates follow the standard chronology. Gath = Tell es-Safi, now widely accepted; the basis is given in the text.
id: gath
place: a18873f
title:
  en: "Gath"
  ru: "Геф"
  uk: "Гат"
  es: "Gat"
  pt: "Gate"
  de: "Gat"
  fr: "Gath"
body:
  en:
    - "Gath is identified with Tell es-Safi, a high mound where the Elah valley opens onto the coastal plain, about 9 km south of Ekron. The identification was first proposed in the nineteenth century, and after other sites were tried it is now widely accepted. The site fits the biblical geography, between Ekron and the hills of Judah, with the Philistines fleeing from the Elah valley toward Gath and Ekron; it was the largest Philistine city of the tenth and ninth centuries BC; and it was destroyed in the late ninth century, when Gath fell to Hazael. Excavations led by Aren Maeir of Bar-Ilan University, begun in 1996, show that the mound was settled from prehistoric to modern times."
    - "Gath was one of the five Philistine cities and the home of Goliath and of other giants whom David and his men killed. The captured ark was carried there from Ashdod, and plague followed it. Fleeing from Saul, David came to Achish, king of Gath; later he served Achish with six hundred men and received Ziklag from him. Ittai the Gittite and six hundred men from Gath stood by David when Absalom rebelled. Chronicles lists Gath among the towns Rehoboam fortified, and says that Uzziah broke down its wall."
    - "The Philistine city founded in the twelfth century BC grew into the largest city of the region. A potsherd of about the tenth century BC bears two names, alwt and wlt, which recall the name Goliath, though they do not refer to the giant. Late in the ninth century a siege trench was dug around the city and Gath was destroyed; this matches the report that Hazael, king of Syria, fought against Gath and took it. The city never regained its size. Amos points to Gath of the Philistines as a warning, and the cities that Amos, Zephaniah and Jeremiah condemn are Gaza, Ashkelon, Ashdod and Ekron, without Gath."
    - "Sargon II of Assyria lists Gath with Ashdod and Ashdod-Yam among the cities he took about 711 BC. In the fourth century AD Eusebius knew a village called Geth five miles from Eleutheropolis on the road to Diospolis; whether it stood on the old Philistine city is uncertain."
  ru:
    - "Геф отождествляют с Телль-эс-Сафи — высоким холмом там, где Долина дуба выходит на прибрежную равнину, примерно в 9 км к югу от Екрона. Это отождествление предложили ещё в XIX веке, и после того как пробовали другие места, оно получило широкое признание. Место подходит к библейской географии — между Екроном и горами Иудеи, и филистимляне бегут из Долины дуба к Гефу и Екрону; это был крупнейший филистимский город X–IX веков до н. э.; и он был разрушен в конце IX века, когда Геф взял Азаил. Раскопки Арена Маира из Бар-Иланского университета, начатые в 1996 г., показывают, что холм был заселён с доисторических до новых времён."
    - "Геф был одним из пяти филистимских городов и родиной Голиафа и других исполинов, которых убили Давид и его люди. Сюда из Азота перенесли захваченный ковчег, и вслед за ним пришла болезнь. Спасаясь от Саула, Давид пришёл к Анхусу, царю Гефскому; позднее он служил Анхусу с шестьюстами мужей и получил от него Секелаг. Еффей Гефянин и шестьсот человек из Гефа остались верны Давиду, когда восстал Авессалом. Вторая книга Паралипоменон относит Геф к городам, которые укрепил Ровоам, и говорит, что Озия разрушил его стены."
    - "Филистимский город, основанный в XII веке до н. э., вырос в крупнейший город края. На черепке около X века до н. э. написаны два имени, alwt и wlt, напоминающие имя Голиаф, хотя к самому исполину они не относятся. В конце IX века город окружили осадным рвом и разрушили; это совпадает с рассказом о том, что Азаил, царь Сирийский, пошёл войною на Геф и взял его. Прежних размеров город больше не достиг. Амос приводит Геф Филистимский в пример как предостережение, а города, которые осуждают Амос, Софония и Иеремия, — Газа, Аскалон, Азот и Екрон, без Гефа."
    - "Ассирийский царь Саргон II называет Геф вместе с Азотом и Ашдод-Ямом среди городов, взятых им около 711 г. до н. э. В IV веке н. э. Евсевий знал селение Геф в пяти милях от Елевферополя по дороге в Диосполь; стояло ли оно на месте древнего филистимского города, неясно."
  uk:
    - "Гат ототожнюють із Тель-ес-Сафі — високим городищем там, де долина Ела відкривається на прибережну рівнину, приблизно за 9 км на південь від Екрона. Це ототожнення вперше запропонували в XIX ст., і після того, як випробовували інші місця, його нині широко приймають. Місце відповідає біблійній географії, між Екроном і юдейськими пагорбами, де філістимляни тікають із долини Ела до Гата й Екрона; воно було найбільшим філістимським містом X–IX ст. до н. е.; і його зруйновано наприкінці IX ст., коли Гат упав перед Азаїлом. Розкопки під керівництвом Арена Маїра з Університету Бар-Ілан, розпочаті 1996 року, показують, що городище було заселене від доісторичних часів до новітніх."
    - "Гат був одним із п’яти філістимських міст і батьківщиною Голіята та інших велетнів, яких убили Давид і його люди. До Гата з Ашдода перенесли захоплений ковчег, і слідом за ним прийшла чума. Тікаючи від Саула, Давид прийшов до Анхуса, царя Гата; пізніше він служив Анхусові з шістьма сотнями людей і одержав від нього Ціклаг. Іттай Гатянин і шістсот чоловіків із Гата стояли при Давиді, коли повстав Авесалом. Хроніки зараховують Гат до міст, які укріпив Ровоам, і повідомляють, що Уззія зруйнував його мур."
    - "Філістимське місто, засноване в XII ст. до н. е., виросло в найбільше місто області. Черепок приблизно X ст. до н. е. має два імені — alwt і wlt, що нагадують ім’я Голіят, хоча до велетня вони не стосуються. Наприкінці IX ст. навколо міста викопали облоговий рів, і Гат було зруйновано; це збігається з повідомленням, що Азаїл, цар Сирії, воював проти Гата й узяв його. Місто вже ніколи не відновило свого розміру. Амос указує на Гат Філістимський як на застереження, а міста, які осуджують Амос, Софонія та Єремія, — Газа, Ашкелон, Ашдод і Екрон, без Гата."
    - "Саргон II Ассирійський заносить Гат разом з Ашдодом і Ашдод-Ямом до міст, які він узяв близько 711 р. до н. е. У IV ст. н. е. Євсевій знав село під назвою Геф за п’ять миль від Елевферополя на дорозі до Діосполя; чи стояло воно на місці давнього філістимського міста, невідомо."
  es:
    - "Gat se identifica con Tell es-Safi, un alto montículo donde el valle de Ela se abre a la llanura costera, a unos 9 km al sur de Ecrón. La identificación se propuso por primera vez en el siglo XIX y, tras ensayarse otros sitios, hoy se acepta ampliamente. El sitio concuerda con la geografía bíblica, entre Ecrón y las colinas de Judá, con los filisteos huyendo del valle de Ela hacia Gat y Ecrón; fue la mayor ciudad filistea de los siglos X y IX a. C.; y fue destruida a fines del siglo IX, cuando Gat cayó ante Hazael. Las excavaciones dirigidas por Aren Maeir, de la Universidad Bar-Ilan, iniciadas en 1996, muestran que el montículo estuvo poblado desde la prehistoria hasta la época moderna."
    - "Gat fue una de las cinco ciudades filisteas y la patria de Goliat y de otros gigantes a quienes mataron David y sus hombres. El arca capturada fue llevada allí desde Asdod, y la plaga la siguió. Huyendo de Saúl, David llegó a Aquis, rey de Gat; más tarde sirvió a Aquis con seiscientos hombres y recibió de él Siclag. Itai el guitita y seiscientos hombres de Gat permanecieron junto a David cuando Absalón se rebeló. Crónicas enumera Gat entre las ciudades que fortificó Roboam, y dice que Uzías derribó su muro."
    - "La ciudad filistea fundada en el siglo XII a. C. se convirtió en la mayor de la región. Un tiesto de hacia el siglo X a. C. lleva dos nombres, alwt y wlt, que recuerdan el nombre Goliat, aunque no se refieren al gigante. A fines del siglo IX se excavó una trinchera de asedio alrededor de la ciudad y Gat fue destruida; esto concuerda con la noticia de que Hazael, rey de Siria, peleó contra Gat y la tomó. La ciudad nunca recobró su tamaño. Amós señala a Gat de los filisteos como una advertencia, y las ciudades que condenan Amós, Sofonías y Jeremías son Gaza, Ascalón, Asdod y Ecrón, sin Gat."
    - "Sargón II de Asiria enumera Gat con Asdod y Asdod-Yam entre las ciudades que tomó hacia el 711 a. C. En el siglo IV d. C. Eusebio conoció una aldea llamada Geth a cinco millas de Eleuterópolis, en el camino de Diospolis; no es seguro que se alzara sobre la antigua ciudad filistea."
  pt:
    - "Gate é identificada com Tell es-Safi, um monte alto onde o vale de Elá se abre para a planície costeira, a cerca de 9 km ao sul de Ecrom. A identificação foi proposta pela primeira vez no século XIX e, depois de outros sítios terem sido tentados, é hoje amplamente aceita. O sítio se ajusta à geografia bíblica, entre Ecrom e as colinas de Judá, com os filisteus fugindo do vale de Elá em direção a Gate e Ecrom; foi a maior cidade filisteia dos séculos X e IX a.C.; e foi destruída no fim do século IX, quando Gate caiu diante de Hazael. As escavações dirigidas por Aren Maeir, da Universidade Bar-Ilan, iniciadas em 1996, mostram que o monte foi habitado da pré-história aos tempos modernos."
    - "Gate foi uma das cinco cidades filisteias e a terra de Golias e de outros gigantes que Davi e seus homens mataram. A arca capturada foi levada para lá desde Asdode, e a praga a seguiu. Fugindo de Saul, Davi foi a Aquis, rei de Gate; mais tarde serviu a Aquis com seiscentos homens e dele recebeu Ziclague. Itai, o geteu, e seiscentos homens de Gate ficaram ao lado de Davi quando Absalão se rebelou. Crônicas inclui Gate entre as cidades que Roboão fortificou e diz que Uzias derrubou o seu muro."
    - "A cidade filisteia fundada no século XII a.C. cresceu até se tornar a maior da região. Um caco de cerâmica de cerca do século X a.C. traz dois nomes, alwt e wlt, que lembram o nome Golias, embora não se refiram ao gigante. No fim do século IX uma trincheira de cerco foi cavada em torno da cidade e Gate foi destruída; isso concorda com o relato de que Hazael, rei da Síria, lutou contra Gate e a tomou. A cidade nunca recuperou o seu tamanho. Amós aponta Gate dos filisteus como advertência, e as cidades que Amós, Sofonias e Jeremias condenam são Gaza, Ascalom, Asdode e Ecrom, sem Gate."
    - "Sargão II da Assíria lista Gate com Asdode e Asdode-Iam entre as cidades que tomou por volta de 711 a.C. No século IV d.C., Eusébio conheceu uma aldeia chamada Geth, a cinco milhas de Eleutéropolis, no caminho para Dióspolis; se ela ficava sobre a antiga cidade filisteia, é incerto."
  de:
    - "Gat wird mit Tell es-Safi gleichgesetzt, einem hohen Hügel, wo sich das Elatal zur Küstenebene öffnet, etwa 9 km südlich von Ekron. Die Gleichsetzung wurde zuerst im 19. Jahrhundert vorgeschlagen und ist, nachdem andere Stätten erprobt worden waren, heute weithin anerkannt. Die Stätte passt zur biblischen Geographie, zwischen Ekron und dem Bergland Judas, mit den Philistern, die aus dem Elatal Richtung Gat und Ekron fliehen; sie war die größte philistäische Stadt des 10. und 9. Jahrhunderts v. Chr.; und sie wurde im späten 9. Jahrhundert zerstört, als Gat an Hasaël fiel. Grabungen unter Leitung von Aren Maeir von der Bar-Ilan-Universität, begonnen 1996, zeigen, dass der Hügel von der Vorgeschichte bis in die Neuzeit besiedelt war."
    - "Gat war eine der fünf philistäischen Städte und die Heimat Goliats und anderer Riesen, die David und seine Männer erschlugen. Die erbeutete Lade wurde von Aschdod dorthin gebracht, und die Plage folgte ihr. Auf der Flucht vor Saul kam David zu Achis, dem König von Gat; später diente er Achis mit sechshundert Mann und erhielt von ihm Ziklag. Ittai, der Gatiter, und sechshundert Männer aus Gat standen zu David, als Absalom sich erhob. Die Chronik zählt Gat unter die Städte, die Rehabeam befestigte, und sagt, dass Usija seine Mauer niederriss."
    - "Die im 12. Jahrhundert v. Chr. gegründete philistäische Stadt wuchs zur größten der Gegend heran. Eine Tonscherbe aus der Zeit um das 10. Jahrhundert v. Chr. trägt zwei Namen, alwt und wlt, die an den Namen Goliat erinnern, sich aber nicht auf den Riesen beziehen. Spät im 9. Jahrhundert wurde ein Belagerungsgraben um die Stadt gezogen, und Gat wurde zerstört; das passt zum Bericht, dass Hasaël, der König von Syrien, gegen Gat stritt und es gewann. Die Stadt erlangte ihre Größe nie wieder. Amos verweist auf „Gath der Philister“ als Warnung, und die Städte, die Amos, Zefanja und Jeremia verurteilen, sind Gaza, Aschkelon, Aschdod und Ekron, ohne Gat."
    - "Sargon II. von Assyrien führt Gat mit Aschdod und Aschdod-Jam unter den Städten auf, die er um 711 v. Chr. einnahm. Im 4. Jahrhundert n. Chr. kannte Eusebius ein Dorf namens Geth fünf Meilen von Eleutheropolis an der Straße nach Diospolis; ob es auf der alten philistäischen Stadt stand, ist ungewiss."
  fr:
    - "Gath est identifiée à Tell es-Safi, un haut tertre où la vallée d’Éla débouche sur la plaine côtière, à environ 9 km au sud d’Ékron. Cette identification, proposée d’abord au XIXe siècle, est aujourd’hui largement admise après l’essai d’autres sites. Le site s’accorde avec la géographie biblique, entre Ékron et les collines de Juda, les Philistins fuyant la vallée d’Éla vers Gath et Ékron ; c’était la plus grande ville philistine des Xe et IXe siècles av. J.-C. ; et elle fut détruite à la fin du IXe siècle, quand Gath tomba aux mains de Hazaël. Les fouilles dirigées par Aren Maeir, de l’Université Bar-Ilan, commencées en 1996, montrent que le tertre fut habité de la préhistoire aux temps modernes."
    - "Gath était l’une des cinq villes philistines, la patrie de Goliath et d’autres géants que David et ses hommes tuèrent. L’arche capturée y fut transportée depuis Asdod, et le fléau l’y suivit. Fuyant Saül, David vint chez Akisch, roi de Gath ; plus tard, il servit Akisch avec six cents hommes et reçut de lui Tsiklag. Ittaï de Gath et six cents hommes de Gath se tinrent aux côtés de David quand Absalom se révolta. Les Chroniques rangent Gath parmi les villes que Roboam fortifia, et disent qu’Ozias abattit ses murs."
    - "La ville philistine fondée au XIIe siècle av. J.-C. devint la plus grande de la région. Un tesson d’environ le Xe siècle av. J.-C. porte deux noms, alwt et wlt, qui rappellent le nom de Goliath, sans toutefois désigner le géant. À la fin du IXe siècle, une tranchée de siège fut creusée autour de la ville et Gath fut détruite ; cela concorde avec le récit selon lequel Hazaël, roi de Syrie, combattit contre Gath et s’en empara. La ville ne retrouva jamais sa taille. Amos montre Gath des Philistins comme un avertissement, et les villes que condamnent Amos, Sophonie et Jérémie sont Gaza, Askalon, Asdod et Ékron, sans Gath."
    - "Sargon II d’Assyrie range Gath avec Asdod et Asdod-Yam parmi les villes qu’il prit vers 711 av. J.-C. Au IVe siècle apr. J.-C., Eusèbe connaissait un village appelé Geth à cinq milles d’Éleuthéropolis, sur la route de Diospolis ; on ne sait s’il se dressait sur l’ancienne ville philistine."
