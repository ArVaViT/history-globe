# Overview article (ADR 0007). Mainstream facts only; the threshing floor of Atad is known from one episode; the Byzantine identification near Beth-hoglah is given as tradition, and the puzzle of “beyond Jordan” is stated, not solved.
id: atad
place: a2f186d
title:
  en: "Atad"
  ru: "Горен-гаатад"
body:
  en:
    - "The threshing floor of Atad, Goren ha-Atad in Hebrew, “the threshing floor of the bramble”, is the place where Joseph and the great funeral train from Egypt halted on the way to bury Jacob in the cave of Machpelah: “they came to the threshingfloor of Atad, which is beyond Jordan, and there they mourned with a great and very sore lamentation: and he made a mourning for his father seven days”. The Canaanites who saw it said, “This is a grievous mourning to the Egyptians”, and the place was named Abel-mizraim, “the mourning of Egypt”. The Synodal Bible keeps the Hebrew phrase as a single name, Goren-haatad, and translates Abel-mizraim as “the weeping of the Egyptians”."
    - "Where it was is not known. “Beyond Jordan” is a puzzle, since the direct road from Egypt to Hebron does not cross the river; some think the procession went round by the east, others that the phrase is used loosely. In the fourth century Eusebius and Jerome put Atad at Bethagla, the old Beth-hoglah, near Jericho west of the Jordan, and the Madaba mosaic map of the sixth century marks the spot, “Alon Atad, now Bethagla”. It is there, near the Greek monastery of Deir Hajla in the Jordan valley, that maps usually mark it; the tradition is old, but nothing on the ground confirms it."
  ru:
    - "Горен-гаатад, по-еврейски «гумно терновника», — место, где Иосиф и большое погребальное шествие из Египта остановились по пути, чтобы похоронить Иакова в пещере Махпела: «И дошли они до Горен-гаатада при Иордане и плакали там плачем великим и весьма сильным; и сделал Иосиф плач по отце своем семь дней». Хананеи, видевшие это, сказали: «велик плач этот у Египтян!», и место назвали Авел-Мицраим, «плач Египта». Синодальный перевод оставляет еврейское выражение одним именем, а Авел-Мицраим переводит: «плач Египтян»."
    - "Где оно было, неизвестно. В еврейском тексте место лежит «за Иорданом», что загадочно, ведь прямая дорога из Египта в Хеврон не пересекает реку; одни думают, что шествие шло в обход с востока, другие — что выражение употреблено вольно. В IV веке Евсевий и Иероним помещали Атад в Бефагле, древнем Беф-Хогле, близ Иерихона к западу от Иордана, и мозаичная карта из Мадабы VI века отмечает это место: «Алон Атад, ныне Бефагла». Там, у греческого монастыря Дейр-Хаджла в долине Иордана, его обычно и отмечают на картах; предание древнее, но ничто на земле его не подтверждает."
scripture:
