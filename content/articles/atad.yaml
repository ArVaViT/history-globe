# Overview article (ADR 0007). Mainstream facts only; the threshing floor of Atad is known from one episode; the Byzantine identification near Beth-hoglah is given as tradition, and the puzzle of “beyond Jordan” is stated, not solved.
id: atad
place: a2f186d
title:
  en: "Atad"
  ru: "Горен-гаатад"
  uk: "Атад"
  es: "Atad"
  pt: "Atade"
  de: "Atad"
  fr: "Athad"
body:
  en:
    - "The threshing floor of Atad, Goren ha-Atad in Hebrew, “the threshing floor of the bramble”, is the place where Joseph and the great funeral train from Egypt halted on the way to bury Jacob in the cave of Machpelah: “they came to the threshingfloor of Atad, which is beyond Jordan, and there they mourned with a great and very sore lamentation: and he made a mourning for his father seven days”. The Canaanites who saw it said, “This is a grievous mourning to the Egyptians”, and the place was named Abel-mizraim, “the mourning of Egypt”. The Synodal Bible keeps the Hebrew phrase as a single name, Goren-haatad, and translates Abel-mizraim as “the weeping of the Egyptians”."
    - "Where it was is not known. “Beyond Jordan” is a puzzle, since the direct road from Egypt to Hebron does not cross the river; some think the procession went round by the east, others that the phrase is used loosely. In the fourth century Eusebius and Jerome put Atad at Bethagla, the old Beth-hoglah, near Jericho west of the Jordan, and the Madaba mosaic map of the sixth century marks the spot, “Alon Atad, now Bethagla”. It is there, near the Greek monastery of Deir Hajla in the Jordan valley, that maps usually mark it; the tradition is old, but nothing on the ground confirms it."
  ru:
    - "Горен-гаатад, по-еврейски «гумно терновника», — место, где Иосиф и большое погребальное шествие из Египта остановились по пути, чтобы похоронить Иакова в пещере Махпела: «И дошли они до Горен-гаатада при Иордане и плакали там плачем великим и весьма сильным; и сделал Иосиф плач по отце своем семь дней». Хананеи, видевшие это, сказали: «велик плач этот у Египтян!», и место назвали Авел-Мицраим, «плач Египта». Синодальный перевод оставляет еврейское выражение одним именем, а Авел-Мицраим переводит: «плач Египтян»."
    - "Где оно было, неизвестно. В еврейском тексте место лежит «за Иорданом», что загадочно, ведь прямая дорога из Египта в Хеврон не пересекает реку; одни думают, что шествие шло в обход с востока, другие — что выражение употреблено вольно. В IV веке Евсевий и Иероним помещали Атад в Бефагле, древнем Беф-Хогле, близ Иерихона к западу от Иордана, и мозаичная карта из Мадабы VI века отмечает это место: «Алон Атад, ныне Бефагла». Там, у греческого монастыря Дейр-Хаджла в долине Иордана, его обычно и отмечают на картах; предание древнее, но ничто на земле его не подтверждает."
  uk:
    - "Тік Атада, на івриті Горен-га-Атад, «тік тернини», — місце, де Йосип і великий похоронний похід із Єгипту зупинилися дорогою ховати Якова в печері Махпела: «І прийшли аж до току Атадового, що по тім боцї Йорданї, і ридали там риданнєм великим і тяжким вельми. І зробив там голосїннє панотцеві свойму семиденне.» Ханаанці, які це бачили, сказали: «Гіркі сї поминки Египтянів!», і місце названо Авел-Міцраїм, «жалоба Єгипту». Синодальний переклад залишає єврейське словосполучення одним ім'ям, Горен-га-Атад, а Авел-Міцраїм перекладає: «плач єгиптян»."
    - "Де це було, невідомо. «По тім боцї Йорданї» — загадка, бо пряма дорога з Єгипту до Хеврону не перетинає річку; одні думають, що похід пішов в обхід зі сходу, інші — що вираз вжито вільно. У IV столітті Євсевій та Єронім розмістили Атад у Бетаґлі, давньому Бет-Хоґлі, поблизу Єрихону на захід від Йордану, а мозаїчна мапа Мадаби VI століття позначає це місце: «Алон Атад, нині Бетагла». Саме там, біля грецького монастиря Дейр-Хаджла в Йорданській долині, мапи зазвичай його позначають; переказ давній, але ніщо на місцевості його не підтверджує."
  es:
    - "La era de Atad, Goren ha-Atad en hebreo, «la era del espino», es el lugar donde José y el gran cortejo fúnebre de Egipto se detuvieron en el camino para sepultar a Jacob en la cueva de Macpela: «Y llegaron hasta la era de Atad, que está á la otra parte del Jordán, y endecharon allí con grande y muy grave lamentación: y José hizo á su padre duelo por siete días». Los cananeos que lo vieron dijeron: «Llanto grande es este de los Egipcios», y el lugar fue llamado Abel-mizraim, «el duelo de Egipto». La Biblia sinodal conserva la frase hebrea como un solo nombre, Goren-haatad, y traduce Abel-mizraim como «el llanto de los egipcios»."
    - "No se sabe dónde estuvo. «Al otro lado del Jordán» es un enigma, pues el camino directo de Egipto a Hebrón no cruza el río; algunos piensan que la comitiva dio un rodeo por el este, otros que la expresión se usa con laxitud. En el siglo IV Eusebio y Jerónimo situaron Atad en Betagla, la antigua Bet-hogla, cerca de Jericó, al oeste del Jordán, y el mapa en mosaico de Madaba, del siglo VI, marca el lugar: «Alon Atad, ahora Betagla». Es allí, cerca del monasterio griego de Deir Hajla, en el valle del Jordán, donde los mapas suelen marcarlo; la tradición es antigua, pero nada sobre el terreno la confirma."
  pt:
    - "A eira de Atade, Goren ha-Atad em hebraico, “a eira do espinheiro”, é o lugar onde José e o grande cortejo fúnebre do Egito pararam a caminho de sepultar Jacó na caverna de Macpela: “Eles chegaram à eira de Atade, que fica além do Jordão, e ali lamentaram com um pranto muito grande e profundo. Ele pranteou por seu pai durante sete dias”. Os cananeus que viram isso disseram: “Este é um pranto doloroso dos egípcios”, e o lugar foi chamado Abel-Mizraim, “o pranto do Egito”. A Bíblia sinodal russa conserva a expressão hebraica como um único nome, Goren-haatad, e traduz Abel-Mizraim como “o pranto dos egípcios”."
    - "Onde ficava não se sabe. “Além do Jordão” é um enigma, pois o caminho direto do Egito a Hebrom não atravessa o rio; alguns pensam que o cortejo deu a volta pelo leste, outros que a expressão é usada com largueza. No século IV, Eusébio e Jerônimo puseram Atade em Betagla, a antiga Bete-Hogla, perto de Jericó, a oeste do Jordão, e o mapa-mosaico de Madaba, do século VI, assinala o lugar: “Alon Atad, hoje Betagla”. É ali, perto do mosteiro grego de Deir Hajla, no vale do Jordão, que os mapas costumam marcá-lo; a tradição é antiga, mas nada no terreno a confirma."
  de:
    - "Die Tenne Atad, hebräisch Goren ha-Atad, „Tenne des Dornbuschs“, ist der Ort, wo Josef und der große Trauerzug aus Ägypten auf dem Weg halt machten, um Jakob in der Höhle Machpela zu bestatten: „Da sie nun an die Tenne Atad kamen, die jenseit des Jordans liegt, da hielten sie eine gar große und bittere Klage; und er trug über seinen Vater Leid sieben Tage.“ Die Kanaaniter, die es sahen, sagten: „Die Ägypter halten da große Klage“, und der Ort wurde Abel-Mizrajim genannt, „Der Ägypter Klage“. Die Synodalbibel behält den hebräischen Ausdruck als einen einzigen Namen, Goren-haatad, und übersetzt Abel-Mizrajim als „Weinen der Ägypter“."
    - "Wo er lag, ist nicht bekannt. „Jenseit des Jordans“ ist ein Rätsel, da die direkte Straße von Ägypten nach Hebron den Fluss nicht überquert; manche meinen, der Zug sei im Osten herumgezogen, andere, der Ausdruck sei lose gebraucht. Im 4. Jahrhundert setzten Eusebius und Hieronymus Atad nach Bethagla, dem alten Bet-Hogla, nahe Jericho westlich des Jordan, und die Madaba-Mosaikkarte des 6. Jahrhunderts markiert die Stelle: „Alon Atad, jetzt Bethagla“. Dort, nahe dem griechischen Kloster Deir Hajla im Jordantal, tragen die Karten ihn gewöhnlich ein; die Überlieferung ist alt, doch nichts im Gelände bestätigt sie."
  fr:
    - "L’aire d’Athad, Goren ha-Atad en hébreu, « l’aire de l’épine », est l’endroit où Joseph et le grand cortège funèbre venu d’Égypte firent halte en allant enterrer Jacob dans la grotte de Macpéla : « Arrivés à l’aire d’Athad, qui est au-delà du Jourdain, ils firent entendre de grandes et profondes lamentations ; et Joseph fit en l’honneur de son père un deuil de sept jours ». Les Cananéens qui le virent dirent : « Voilà un grand deuil parmi les Égyptiens ! », et le lieu fut nommé Abel-Mitsraïm, « le deuil de l’Égypte ». La Bible synodale garde l’expression hébraïque comme un seul nom, Goren-haatad, et traduit Abel-Mitsraïm par « les pleurs des Égyptiens »."
    - "On ignore où c’était. « Au-delà du Jourdain » est une énigme, car la route directe d’Égypte à Hébron ne traverse pas le fleuve ; certains pensent que le cortège fit un détour par l’est, d’autres que l’expression est employée de façon lâche. Au IVe siècle, Eusèbe et Jérôme placèrent Athad à Bethagla, l’ancienne Beth-Hogla, près de Jéricho, à l’ouest du Jourdain, et la carte-mosaïque de Madaba du VIe siècle marque le lieu : « Alon Atad, aujourd’hui Bethagla ». C’est là, près du monastère grec de Deir Hajla dans la vallée du Jourdain, que les cartes le marquent d’ordinaire ; la tradition est ancienne, mais rien sur le terrain ne la confirme."
scripture:
  - Gen.50.10-Gen.50.11
sources:
  - "Eusebius, Onomasticon, s.v. Area Atath"
  - "M. Avi-Yonah, The Madaba Mosaic Map (1954)"
  - "G. J. Wenham, Genesis 16–50 (Word Biblical Commentary, 1994)"
