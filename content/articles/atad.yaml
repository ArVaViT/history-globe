body:
  en:
    - "The threshing floor of Atad, Goren ha-Atad in Hebrew, “the threshing floor of the bramble”, is the place where Joseph and the great funeral train from Egypt halted on the way to bury Jacob in the cave of Machpelah: “they came to the threshingfloor of Atad, which is beyond Jordan, and there they mourned with a great and very sore lamentation: and he made a mourning for his father seven days”. The Canaanites who saw it said, “This is a grievous mourning to the Egyptians”, and the place was named Abel-mizraim, “the mourning of Egypt”. The Synodal Bible keeps the Hebrew phrase as a single name, Goren-haatad, and translates Abel-mizraim as “the weeping of the Egyptians”."
    - "Where it was is not known. “Beyond Jordan” is a puzzle, since the direct road from Egypt to Hebron does not cross the river; some think the procession went round by the east, others that the phrase is used loosely. In the fourth century Eusebius and Jerome put Atad at Bethagla, the old Beth-hoglah, near Jericho west of the Jordan, and the Madaba mosaic map of the sixth century marks the spot, “Alon Atath, now Bethagla”. It is there, near the Greek monastery of Deir Hajla in the Jordan valley, that maps usually mark it; the tradition is old, but nothing on the ground confirms it."
  ru:
    - "Горен-гаатад, по-еврейски «гумно терновника», — место, где Иосиф и большое погребальное шествие из Египта остановились по пути, чтобы похоронить Иакова в пещере Махпела: «И дошли они до Горен-гаатада при Иордане и плакали там плачем великим и весьма сильным; и сделал Иосиф плач по отце своем семь дней». Хананеи, видевшие это, сказали: «велик плач этот у Египтян!», и место назвали Авел-Мицраим, «плач Египта». Синодальный перевод оставляет еврейское выражение одним именем, а Авел-Мицраим переводит: «плач Египтян»."
    - "Где оно было, неизвестно. В еврейском тексте место лежит «за Иорданом», что загадочно, ведь прямая дорога из Египта в Хеврон не пересекает реку; одни думают, что шествие шло в обход с востока, другие — что выражение употреблено вольно. В IV веке Евсевий и Иероним помещали Атад в Бефагле, древнем Беф-Хогле, близ Иерихона к западу от Иордана, и мозаичная карта из Мадабы VI века отмечает это место: «Алон Атаф, ныне Бефагла». Там, у греческого монастыря Дейр-Хаджла в долине Иордана, его обычно и отмечают на картах; предание древнее, но ничто на земле его не подтверждает."
  uk:
    - "Тік Атада, на івриті Горен-га-Атад, «тік тернини», — місце, де Йосип і великий похоронний похід із Єгипту зупинилися дорогою ховати Якова в печері Махпела: «І прийшли аж до току Атадового, що по тім боцї Йорданї, і ридали там риданнєм великим і тяжким вельми. І зробив там голосїннє панотцеві свойму семиденне.» Ханаанці, які це бачили, сказали: «Гіркі сї поминки Египтянів!», і місце названо Авел-Міцраїм, «жалоба Єгипту». Синодальний переклад залишає єврейське словосполучення одним ім'ям, Горен-га-Атад, а Авел-Міцраїм перекладає: «плач єгиптян»."
    - "Де це було, невідомо. «По тім боцї Йорданї» — загадка, бо пряма дорога з Єгипту до Хеврону не перетинає річку; одні думають, що похід пішов в обхід зі сходу, інші — що вираз вжито вільно. У IV столітті Євсевій та Єронім розмістили Атад у Бетаґлі, давньому Бет-Хоґлі, поблизу Єрихону на захід від Йордану, а мозаїчна мапа Мадаби VI століття позначає це місце: «Алон Атаф, нині Бетагла». Саме там, біля грецького монастиря Дейр-Хаджла в Йорданській долині, мапи зазвичай його позначають; переказ давній, але ніщо на місцевості його не підтверджує."
  es:
    - "La era de Atad, Goren ha-Atad en hebreo, «la era del espino», es el lugar donde José y el gran cortejo fúnebre de Egipto se detuvieron en el camino para sepultar a Jacob en la cueva de Macpela: «Y llegaron hasta la era de Atad, que está á la otra parte del Jordán, y endecharon allí con grande y muy grave lamentación: y José hizo á su padre duelo por siete días». Los cananeos que lo vieron dijeron: «Llanto grande es este de los Egipcios», y el lugar fue llamado Abel-mizraim, «el duelo de Egipto». La Biblia sinodal conserva la frase hebrea como un solo nombre, Goren-haatad, y traduce Abel-mizraim como «el llanto de los egipcios»."
    - "No se sabe dónde estuvo. «Al otro lado del Jordán» es un enigma, pues el camino directo de Egipto a Hebrón no cruza el río; algunos piensan que la comitiva dio un rodeo por el este, otros que la expresión se usa con laxitud. En el siglo IV Eusebio y Jerónimo situaron Atad en Betagla, la antigua Bet-hogla, cerca de Jericó, al oeste del Jordán, y el mapa en mosaico de Madaba, del siglo VI, marca el lugar: «Alon Atath, ahora Betagla». Es allí, cerca del monasterio griego de Deir Hajla, en el valle del Jordán, donde los mapas suelen marcarlo; la tradición es antigua, pero nada sobre el terreno la confirma."
  pt:
    - "A eira de Atade, Goren ha-Atad em hebraico, “a eira do espinheiro”, é o lugar onde José e o grande cortejo fúnebre do Egito pararam a caminho de sepultar Jacó na caverna de Macpela: “Eles chegaram à eira de Atade, que fica além do Jordão, e ali lamentaram com um pranto muito grande e profundo. Ele pranteou por seu pai durante sete dias”. Os cananeus que viram isso disseram: “Este é um pranto doloroso dos egípcios”, e o lugar foi chamado Abel-Mizraim, “o pranto do Egito”. A Bíblia sinodal russa conserva a expressão hebraica como um único nome, Goren-haatad, e traduz Abel-Mizraim como “o pranto dos egípcios”."
    - "Onde ficava não se sabe. “Além do Jordão” é um enigma, pois o caminho direto do Egito a Hebrom não atravessa o rio; alguns pensam que o cortejo deu a volta pelo leste, outros que a expressão é usada com largueza. No século IV, Eusébio e Jerônimo puseram Atade em Betagla, a antiga Bete-Hogla, perto de Jericó, a oeste do Jordão, e o mapa-mosaico de Madaba, do século VI, assinala o lugar: “Alon Atath, hoje Betagla”. É ali, perto do mosteiro grego de Deir Hajla, no vale do Jordão, que os mapas costumam marcá-lo; a tradição é antiga, mas nada no terreno a confirma."
  de:
    - "Die Tenne Atad, hebräisch Goren ha-Atad, „Tenne des Dornbuschs“, ist der Ort, wo Josef und der große Trauerzug aus Ägypten auf dem Weg halt machten, um Jakob in der Höhle Machpela zu bestatten: „Da sie nun an die Tenne Atad kamen, die jenseit des Jordans liegt, da hielten sie eine gar große und bittere Klage; und er trug über seinen Vater Leid sieben Tage.“ Die Kanaaniter, die es sahen, sagten: „Die Ägypter halten da große Klage“, und der Ort wurde Abel-Mizrajim genannt, „Der Ägypter Klage“. Die Synodalbibel behält den hebräischen Ausdruck als einen einzigen Namen, Goren-haatad, und übersetzt Abel-Mizrajim als „Weinen der Ägypter“."
    - "Wo er lag, ist nicht bekannt. „Jenseit des Jordans“ ist ein Rätsel, da die direkte Straße von Ägypten nach Hebron den Fluss nicht überquert; manche meinen, der Zug sei im Osten herumgezogen, andere, der Ausdruck sei lose gebraucht. Im 4. Jahrhundert setzten Eusebius und Hieronymus Atad nach Bethagla, dem alten Bet-Hogla, nahe Jericho westlich des Jordan, und die Madaba-Mosaikkarte des 6. Jahrhunderts markiert die Stelle: „Alon Atath, jetzt Bethagla“. Dort, nahe dem griechischen Kloster Deir Hajla im Jordantal, tragen die Karten ihn gewöhnlich ein; die Überlieferung ist alt, doch nichts im Gelände bestätigt sie."
  fr:
    - "L’aire d’Athad, Goren ha-Atad en hébreu, « l’aire de l’épine », est l’endroit où Joseph et le grand cortège funèbre venu d’Égypte firent halte en allant enterrer Jacob dans la grotte de Macpéla : « Arrivés à l’aire d’Athad, qui est au-delà du Jourdain, ils firent entendre de grandes et profondes lamentations ; et Joseph fit en l’honneur de son père un deuil de sept jours ». Les Cananéens qui le virent dirent : « Voilà un grand deuil parmi les Égyptiens ! », et le lieu fut nommé Abel-Mitsraïm, « le deuil de l’Égypte ». La Bible synodale garde l’expression hébraïque comme un seul nom, Goren-haatad, et traduit Abel-Mitsraïm par « les pleurs des Égyptiens »."
    - "On ignore où c’était. « Au-delà du Jourdain » est une énigme, car la route directe d’Égypte à Hébron ne traverse pas le fleuve ; certains pensent que le cortège fit un détour par l’est, d’autres que l’expression est employée de façon lâche. Au IVe siècle, Eusèbe et Jérôme placèrent Athad à Bethagla, l’ancienne Beth-Hogla, près de Jéricho, à l’ouest du Jourdain, et la carte-mosaïque de Madaba du VIe siècle marque le lieu : « Alon Atath, aujourd’hui Bethagla ». C’est là, près du monastère grec de Deir Hajla dans la vallée du Jourdain, que les cartes le marquent d’ordinaire ; la tradition est ancienne, mais rien sur le terrain ne la confirme."
  it:
    - "L’aia di Atad, Goren ha-Atad in ebraico, «l’aia del rovo», è il luogo dove Giuseppe e il grande corteo funebre dall’Egitto si fermarono sulla via per seppellire Giacobbe nella grotta di Macpela: «E come furon giunti all’aia di Atad, ch’è oltre il Giordano, vi fecero grandi e profondi lamenti; e Giuseppe fece a suo padre un lutto di sette giorni». I Cananei che lo videro dissero: «Questo è un grave lutto per gli Egiziani!», e il luogo fu chiamato Abel-Misraim, «il lutto d’Egitto». La Bibbia sinodale conserva l’espressione ebraica come un unico nome, Goren-haatad, e traduce Abel-Misraim come «il pianto degli Egiziani»."
    - "Dove fosse non si sa. «Oltre il Giordano» è un enigma, poiché la via diretta dall’Egitto a Ebron non attraversa il fiume; alcuni pensano che il corteo abbia girato da oriente, altri che l’espressione sia usata in modo lasco. Nel IV secolo Eusebio e Girolamo posero Atad a Betagla, l’antica Bet-Cogla, presso Gerico a ovest del Giordano, e la mappa musiva di Madaba del VI secolo segna il luogo: «Alon Atath, ora Betagla». È lì, presso il monastero greco di Deir Hajla nella valle del Giordano, che le carte di solito lo segnano; la tradizione è antica, ma nulla sul terreno la conferma."
  pl:
    - "Klepisko Atad, po hebrajsku Goren ha-Atad, „klepisko cierni”, to miejsce, gdzie Józef i wielki orszak pogrzebowy z Egiptu zatrzymali się w drodze, by pochować Jakuba w jaskini Makpela: „I przyjechali aż na pole Atad, które jest przy brodzie Jordańskim, i płakali tam płaczem wielkim i bardzo ciężkim; i obchodził Józef po ojcu swym żałobę przez siedem dni”. Kananejczycy, którzy to widzieli, mówili: „Żałoba to ciężka Egipczanów”, i miejsce nazwano Abel-Misrajim, „żałoba Egiptu”. Biblia synodalna zachowuje hebrajskie wyrażenie jako jedną nazwę, Goren-haatad, a Abel-Misrajim tłumaczy jako „płacz Egipcjan”."
    - "Gdzie leżało, nie wiadomo. Hebrajskie „za Jordanem” (w Biblii Gdańskiej: „przy brodzie Jordańskim”) to zagadka, bo bezpośrednia droga z Egiptu do Hebronu nie przekracza rzeki; niektórzy sądzą, że orszak poszedł okrężną drogą od wschodu, inni, że to wyrażenie użyto swobodnie. W IV wieku Euzebiusz i Hieronim umieścili Atad w Betagla, dawnym Bet-Chogla, koło Jerycha na zachód od Jordanu, a mapa mozaikowa z Madaby z VI wieku zaznacza to miejsce: „Alon Atath, teraz Betagla”. Tam, w pobliżu greckiego klasztoru Deir Hajla w Dolinie Jordanu, mapy zwykle je zaznaczają; tradycja jest stara, lecz nic w terenie jej nie potwierdza."
  nl:
    - "De dorsvloer van Atad, in het Hebreeuws Goren ha-Atad, “de dorsvloer van de doornstruik”, is de plaats waar Jozef en de grote rouwstoet uit Egypte halt hielden op weg om Jakob te begraven in de spelonk van Machpela: “Toen zij nu aan het plein van het doornbos kwamen, dat aan gene zijde van de Jordaan is, hielden zij daar een grote en zeer zware rouwklage; en hij maakte zijn vader een rouw van zeven dagen”. De Kanaänieten die het zagen, zeiden: “Dit is een zware rouw der Egyptenaren”, en de plaats werd Abel-Mizraïm genoemd, “de rouw van Egypte”. De Synodale Bijbel bewaart de Hebreeuwse uitdrukking als één naam, Goren-haatad, en vertaalt Abel-Mizraïm als “het geween van de Egyptenaren”."
    - "Waar het was, is niet bekend. “Aan gene zijde van de Jordaan” is een raadsel, want de directe weg van Egypte naar Hebron steekt de rivier niet over; sommigen denken dat de stoet om het oosten heen ging, anderen dat de uitdrukking los wordt gebruikt. In de vierde eeuw plaatsten Eusebius en Hieronymus Atad bij Bethagla, het oude Beth-Chogla, bij Jericho ten westen van de Jordaan, en de Madabamozaïekkaart uit de zesde eeuw markeert de plek: “Alon Atath, nu Bethagla”. Daar, bij het Griekse klooster Deir Hajla in de Jordaanvallei, tekenen kaarten haar gewoonlijk in; de overlevering is oud, maar niets in het terrein bevestigt haar."
  cs:
    - "Humno Atad, hebrejsky Goren ha-Atad, „humno trnitého keře“, je místo, kde se Josef a velký pohřební průvod z Egypta zastavili na cestě k pohřbení Jákoba v jeskyni Makpela: „I přišli až k místu Atád, kteréž jest při brodu Jordánském, a kvílili tam kvílením velikým a velmi žalostným; i držel tu zámutek po otci svém za dnů sedm“. Kananejští, kteří to viděli, řekli: „Těžký to mají zámutek Egyptští“, a místo bylo pojmenováno Ábel-micrajim, „smutek Egypta“. Synodální Bible ponechává hebrejské spojení jako jediné jméno, Goren-haatad, a Ábel-micrajim překládá jako „pláč Egypťanů“."
    - "Kde bylo, není známo. Výraz „beyond Jordan“ v Bibli krále Jakuba je hádanka, protože přímá cesta z Egypta do Hebronu řeku nepřekračuje; někteří soudí, že průvod šel oklikou přes východ, jiní, že se tohoto výrazu užívá volně. Ve 4. století kladli Eusebios a Jeroným Atad do Bethagly, starého Bét-choglu, poblíž Jericha západně od Jordánu, a madabská mozaiková mapa ze 6. století toto místo označuje: „Alon Atath, nyní Bethagla“. Právě tam, poblíž řeckého kláštera Deir Hajla v Jordánském údolí, jej mapy obvykle vyznačují; tradice je stará, ale nic na zemi ji nepotvrzuje."
  sv:
    - "Atads tröskplats, Goren ha-Atad på hebreiska, ”törnbuskens tröskplats”, är platsen där Josef och det stora likfärdståget från Egypten gjorde halt på väg för att begrava Jakob i grottan i Makpela: ”När de nu kommo till Goren-Haatad, på andra sidan Jordan, höllo de där en mycket stor och högtidlig dödsklagan, och han anställde en sorgefest efter sin fader i sju dagar”. Kananéerna som såg det sade: ”Det är en högtidlig sorgefest som egyptierna här hålla”, och platsen fick namnet Avel-Misrajim, ”Egyptens sorg”. Synodalbibeln behåller det hebreiska uttrycket som ett enda namn, Goren-haatad, och översätter Avel-Misrajim som ”egyptiernas gråt”."
    - "Var det låg är inte känt. ”På andra sidan Jordan” är ett problem, eftersom den direkta vägen från Egypten till Hebron inte korsar floden; vissa tror att följet gick runt österut, andra att uttrycket används lösligt. På 300-talet förlade Eusebios och Hieronymus Atad till Betagla, det gamla Bet-Hogla, nära Jeriko väster om Jordan, och Madabamosaikkartan från 500-talet markerar platsen, ”Alon Atath, nu Betagla”. Det är där, nära det grekiska klostret Deir Hajla i Jordandalen, som kartor vanligen markerar den; traditionen är gammal, men ingenting i terrängen bekräftar den."
  nb:
    - "Treskeplassen Atad, på hebraisk Goren ha-Atad, «tornebuskens treskeplass», er stedet der Josef og det store likfølget fra Egypt stanset på veien for å gravlegge Jakob i hulen i Makpela: «Da de kom til Goren-Ha'atad på hin side Jordan, holdt de der en stor og høitidelig sørgefest, og han gjorde likferd efter sin far i syv dager.» Kana'anittene som så det, sa: «Det er en prektig likferd egypterne holder der», og stedet fikk navnet Abel-Misrajim, «Egypts sorg». Synodalbibelen beholder den hebraiske frasen som ett navn, Goren-haatad, og oversetter Abel-Misrajim som «egypternes gråt»."
    - "Hvor det lå, er ukjent. «Hinsides Jordan» er en gåte, siden den direkte veien fra Egypt til Hebron ikke krysser elven; noen mener at følget gikk om øst, andre at uttrykket brukes løst. På 300-tallet plasserte Eusebius og Hieronymus Atad ved Betagla, det gamle Bet-Hogla, nær Jeriko vest for Jordan, og Madaba-mosaikkens kart fra 500-tallet markerer stedet, «Alon Atath, nå Betagla». Det er der, nær det greske klosteret Deir Hajla i Jordandalen, at kart vanligvis markerer det; tradisjonen er gammel, men ingenting på bakken bekrefter den."
  tl:
    - "Ang giikan ni Atad, Goren ha-Atad sa Hebreo, “ang giikan ng dawag”, ay ang lugar kung saan huminto si Jose at ang malaking prusisyon ng libing mula sa Egipto sa daan upang ilibing si Jacob sa yungib ng Macpela: “At sila'y dumating sa giikan ni Atad, na nasa dako pa roon ng Jordan, at doo'y nanaghoy sila ng malakas at kapaitpait na panaghoy: at kaniyang pinanangisan ang kaniyang ama na pitong araw”. Sinabi ng mga Cananeong nakakita, “Ito'y isang kahambalhambal na panaghoy ng mga Egipcio”, at pinangalanan ang lugar na Abel-mizraim, “panaghoy ng Egipto”. Pinananatili ng Sinodal na Biblia ang pariralang Hebreo bilang iisang pangalan, Goren-haatad, at isinasalin ang Abel-mizraim bilang “ang pag-iyak ng mga Egipcio”."
    - "Hindi alam kung saan ito. Palaisipan ang “dako pa roon ng Jordan”, yamang hindi tumatawid sa ilog ang tuwirang daan mula Egipto patungong Hebron; iniisip ng ilan na umikot ang prusisyon sa silangan, ng iba na maluwag ang gamit ng parirala. Noong ika-4 na siglo, inilagay nina Eusebio at Jeronimo ang Atad sa Bethagla, ang dating Beth-hogla, malapit sa Jerico sa kanluran ng Jordan, at minamarkahan ng mapang mosaiko ng Madaba noong ika-6 na siglo ang lugar, “Alon Atath, na ngayon ay Bethagla”. Doon, malapit sa monasteryong Griyego ng Deir Hajla sa libis ng Jordan, karaniwang minamarkahan ito ng mga mapa; luma ang tradisyon, ngunit walang nagpapatunay sa lupa."
  da:
    - "Tærskepladsen Atad, hebraisk Goren ha-Atad, »tornekrattets tærskeplads«, er stedet, hvor Josef og det store ligfølge fra Egypten gjorde holdt på vej for at begrave Jakob i Makpela-hulen: »Der de kom til den Lade Atad, som ligger paa hin Side Jordan, da holdt de der en stor og saare svar Klage, og han lod holde Sorrig for sin Fader syv Dage.« Kana'anæerne, der så det, sagde: »Denne er en svar Sorrig for Ægypterne«, og stedet fik navnet Abel-Misrajim, »Ægypternes Sorrig«. Synodalbibelen bevarer det hebraiske udtryk som ét navn, Goren-haatad, og oversætter Abel-Misrajim som »egypternes gråd«."
    - "Hvor det lå, vides ikke. »Hinsides Jordan« er en gåde, da den direkte vej fra Egypten til Hebron ikke krydser floden; nogle mener, at toget gik uden om mod øst, andre at udtrykket er brugt løst. I 300-tallet placerede Eusebius og Hieronymus Atad ved Betagla, det gamle Bet-Hogla, nær Jeriko vest for Jordan, og Madaba-mosaikkortet fra 500-tallet markerer stedet: »Alon Atath, nu Betagla«. Det er dér, nær det græske kloster Deir Hajla i Jordandalen, at kort sædvanligvis markerer det; traditionen er gammel, men intet på jorden bekræfter den."
scripture:
  - Gen.50.10-Gen.50.13
sources:
  - "Eusebius, Onomasticon, s.v. Area Atath"
  - "M. Avi-Yonah, The Madaba Mosaic Map (1954)"
  - "G. J. Wenham, Genesis 16–50 (Word Biblical Commentary, 1994)"
status: checked
