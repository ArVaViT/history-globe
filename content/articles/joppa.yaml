# Overview article (ADR 0007). Mainstream facts only; disputed things are said to be disputed.
id: joppa
place: ae023a9
title:
  en: "Joppa"
  ru: "Иоппия"
  uk: "Яффа"
  es: "Jope"
  pt: "Jope"
  de: "Joppe"
  fr: "Joppé"
body:
  en:
    - "Joppa, today Jaffa in Tel Aviv-Yafo, stands on a rocky headland with a small natural harbour, the chief port of the central coast. It came under Egypt in the fifteenth century BC, when Thutmose III listed it among his conquests; an Egyptian tale on Papyrus Harris 500, the Taking of Joppa, tells how his general Djehuty brought soldiers into the town hidden in sacks. In the Amarna age it held Egyptian royal granaries, and excavators have uncovered the gateway of the Egyptian fortress, known as the Ramesses Gate."
    - "Joshua names Joppa at the border of the lot of Dan. Cedar from Lebanon was floated in rafts to Joppa for Solomon's temple and again for the temple rebuilt after the exile, and Jonah went down to Joppa to find a ship for Tarshish. In 701 BC Sennacherib of Assyria took Joppa, then a town of Sidqa, king of Ashkelon. In the Persian period the sarcophagus of Eshmunazar II of Sidon records that the Persian king gave Dor and Joppa to the Sidonians."
    - "In the Maccabean wars Judas burned Joppa's harbour after its people had drowned the Jews living among them; Jonathan took the city, and Simon garrisoned it and made it the Jews' port. Pompey freed Joppa in 63 BC, Julius Caesar returned it to the Jews under Hyrcanus II, and Augustus gave it to Herod. In AD 66 Cestius Gallus took Joppa, killed its people and burned it; when refugees made it a base for piracy, Vespasian's troops took it again in 67. Josephus mentions the rocks there where, by legend, Andromeda had been chained."
    - "In Acts the disciple Tabitha, also called Dorcas, died at Joppa, and Peter, called from nearby Lydda, raised her to life. He stayed many days with Simon a tanner, whose house was by the sea; on its roof he saw the vision of the sheet let down from heaven, and from here he went with the messengers of Cornelius to Caesarea. Describing Paula's pilgrimage in the 380s, Jerome mentions Joppa, close to her road at Lydda, as the port of Jonah's flight, and by the fifth century the town had its own bishop."
  ru:
    - "Иоппия, ныне Яффа в Тель-Авиве-Яффо, стоит на скалистом мысу с небольшой естественной гаванью — главным портом средней части побережья. В XV веке до н. э. она перешла под власть Египта: Тутмос III включил её в список своих завоеваний, а египетская повесть на папирусе Харрис 500, «Взятие Иоппии», рассказывает, как его военачальник Джехути ввёл в город воинов, спрятанных в мешках. В амарнскую эпоху здесь были царские житницы Египта, а раскопки открыли ворота египетской крепости, известные как ворота Рамсеса."
    - "Книга Иисуса Навина называет Иоппию на границе удела Дана. Кедры с Ливана сплавляли плотами в Иоппию для храма Соломона и снова для храма, отстроенного после плена, а Иона пришёл в Иоппию, чтобы найти корабль в Фарсис. В 701 г. до н. э. ассирийский царь Сеннахирим взял Иоппию, принадлежавшую тогда Цидке, царю Аскалона. В персидский период надпись на саркофаге сидонского царя Эшмуназара II сообщает, что персидский царь отдал сидонянам Дор и Иоппию."
    - "В Маккавейских войнах Иуда сжёг гавань Иоппии после того, как её жители утопили живших среди них иудеев; Ионафан взял город, а Симон поставил в нём гарнизон и сделал его иудейским портом. В 63 г. до н. э. Помпей освободил Иоппию, Юлий Цезарь вернул её иудеям при Гиркане II, а Август отдал её Ироду. В 66 г. н. э. Цестий Галл взял Иоппию, перебил жителей и сжёг город; когда беглецы сделали его гнездом морского разбоя, войска Веспасиана в 67 г. взяли его снова. Иосиф Флавий упоминает здешние скалы, к которым, по преданию, была прикована Андромеда."
    - "В Деяниях ученица Тавифа, она же Серна, умерла в Иоппии, и Пётр, позванный из соседней Лидды, воскресил её. Он долго жил у Симона кожевника, дом которого был при море; на его кровле Пётр увидел видение спущенного с неба полотна и отсюда пошёл с посланными Корнилия в Кесарию. Описывая паломничество Павлы в 380-х гг., Иероним упоминает лежащую неподалёку от Лидды Иоппию как пристань, откуда бежал Иона, а к V веку в городе был свой епископ."
  uk:
    - "Яффа, нині Яффо в Тель-Авів-Яффо, стоїть на скелястому мисі з малою природною гаванню, головним портом центрального узбережжя. Вона перейшла під владу Єгипту в XV ст. до н. е., коли Тутмос III зарахував її до своїх завоювань; єгипетська оповідь на папірусі Гарріс 500 «Взяття Яффи» розповідає, як його полководець Джегуті ввів воїнів у місто, захованих у мішках. За амарнської доби там були єгипетські царські зерносховища, і розкопувачі відкрили надбрамок єгипетської фортеці, відомий як Брама Рамсеса."
    - "Книга Ісуса Навина називає Яффу при межі жереба Дана. Кедр з Лівану сплавляли плотами до Яффи для храму Соломона і знову для храму, відбудованого після вигнання, а Йона зійшов до Яффи знайти корабель до Тарсису. 701 р. до н. е. Сінаххеріб Ассирійський узяв Яффу, тоді місто Сідки, царя Ашкелона. За перської доби саркофаг Ешмуназара II Сідонського записує, що перський цар віддав Дор і Яффу сідонцям."
    - "У макавейських війнах Юда спалив гавань Яффи після того, як її люди втопили юдеїв, що жили серед них; Йонатан узяв місто, а Симон поставив у ньому залогу й зробив його портом юдеїв. Помпей звільнив Яффу 63 р. до н. е., Юлій Цезар повернув її юдеям під Гірканом II, а Август віддав її Іродові. 66 р. н. е. Цестій Галл узяв Яффу, вбив її людей і спалив; коли біженці зробили її базою піратства, війська Веспасіана знову взяли її 67 року. Йосиф Флавій згадує там скелі, де, за легендою, була прикута Андромеда."
    - "У Діях учениця Тавіта, звана також Дорка, померла в Яффі, і Петро, покликаний із сусідньої Лідди, воскресив її. Він пробув багато днів у Симона кожум’яки, чий дім був біля моря; на його даху він побачив видіння полотнища, спущеного з неба, і звідси пішов з посланцями Корнилія до Кесарії. Описуючи паломництво Павли у 380-х роках, Ієронім згадує Яффу, поблизу її дороги в Лідді, як порт утечі Йони, а до V ст. місто мало власного єпископа."
  es:
    - "Jope, hoy Jaffa en Tel Aviv-Yafo, se alza sobre un promontorio rocoso con un pequeño puerto natural, el principal puerto de la costa central. Pasó a Egipto en el siglo XV a. C., cuando Tutmosis III la incluyó entre sus conquistas; un relato egipcio del Papiro Harris 500, la Toma de Jope, cuenta cómo su general Dyehuty introdujo soldados en la ciudad ocultos en sacos. En la época de Amarna albergaba graneros reales egipcios, y los excavadores han sacado a la luz la entrada de la fortaleza egipcia, conocida como la Puerta de Ramsés."
    - "Josué nombra Jope en el límite de la suerte de Dan. El cedro del Líbano se llevó en balsas a Jope para el templo de Salomón y de nuevo para el templo reconstruido tras el destierro, y Jonás bajó a Jope para hallar una nave rumbo a Tarsis. En el 701 a. C. Senaquerib de Asiria tomó Jope, entonces una ciudad de Sidqa, rey de Ascalón. En el período persa el sarcófago de Eshmunazar II de Sidón registra que el rey persa dio Dor y Jope a los sidonios."
    - "En las guerras macabeas Judas quemó el puerto de Jope después de que su gente ahogara a los judíos que vivían entre ellos; Jonatán tomó la ciudad, y Simón la guarneció y la hizo el puerto de los judíos. Pompeyo liberó Jope en el 63 a. C., Julio César la devolvió a los judíos bajo Hircano II, y Augusto la dio a Herodes. En el 66 d. C. Cestio Galo tomó Jope, mató a su gente y la quemó; cuando los refugiados la convirtieron en base de piratería, las tropas de Vespasiano la tomaron de nuevo en el 67. Josefo menciona las rocas de allí donde, según la leyenda, había sido encadenada Andrómeda."
    - "En Hechos la discípula Tabita, llamada también Dorcas, murió en Jope, y Pedro, llamado desde la cercana Lida, la resucitó. Se quedó muchos días con Simón, un curtidor, cuya casa estaba junto al mar; en su azotea vio la visión del lienzo bajado del cielo, y de aquí fue con los mensajeros de Cornelio a Cesarea. Al describir la peregrinación de Paula en los años 380, Jerónimo menciona Jope, cerca de su camino en Lida, como el puerto de la huida de Jonás, y en el siglo V la ciudad tenía ya su propio obispo."
  pt:
    - "Jope, hoje Jaffa, em Tel Aviv-Yafo, fica num promontório rochoso com um pequeno porto natural, o principal porto da costa central. Passou ao Egito no século XV a.C., quando Tutmés III a listou entre suas conquistas; um conto egípcio no Papiro Harris 500, a Tomada de Jope, narra como seu general Djehuty introduziu soldados na cidade escondidos em sacos. Na época de Amarna abrigava celeiros reais egípcios, e os escavadores trouxeram à luz o portão da fortaleza egípcia, conhecido como Portão de Ramessés."
    - "Josué nomeia Jope na fronteira da porção de Dã. Cedro do Líbano foi levado em jangadas até Jope para o templo de Salomão e de novo para o templo reconstruído depois do exílio, e Jonas desceu a Jope para achar um navio para Társis. Em 701 a.C., Senaqueribe da Assíria tomou Jope, então cidade de Sidqa, rei de Ascalom. No período persa, o sarcófago de Eshmunazar II de Sidom registra que o rei persa deu Dor e Jope aos sidônios."
    - "Nas guerras macabaicas, Judas queimou o porto de Jope depois que seu povo afogara os judeus que viviam entre eles; Jônatas tomou a cidade, e Simão a guarneceu e fez dela o porto dos judeus. Pompeu libertou Jope em 63 a.C., Júlio César a devolveu aos judeus sob Hircano II, e Augusto a deu a Herodes. Em 66 d.C., Céstio Galo tomou Jope, matou seu povo e a queimou; quando refugiados fizeram dela base de pirataria, as tropas de Vespasiano a tomaram de novo em 67. Josefo menciona os rochedos ali onde, segundo a lenda, Andrômeda fora acorrentada."
    - "Em Atos, a discípula Tabita, também chamada Dorcas, morreu em Jope, e Pedro, chamado da vizinha Lida, a ressuscitou. Ficou muitos dias com Simão, um curtidor, cuja casa ficava junto ao mar; no terraço dela viu a visão do lençol baixado do céu, e dali foi com os mensageiros de Cornélio a Cesareia. Descrevendo a peregrinação de Paula nos anos 380, Jerônimo menciona Jope, perto de seu caminho em Lida, como o porto da fuga de Jonas, e no século V a cidade tinha seu próprio bispo."
  de:
    - "Joppe, heute Jaffa in Tel Aviv-Jafo, liegt auf einer felsigen Landzunge mit einem kleinen natürlichen Hafen, dem wichtigsten Hafen der mittleren Küste. Es kam im 15. Jahrhundert v. Chr. unter Ägypten, als Thutmosis III. es unter seinen Eroberungen aufführte; eine ägyptische Erzählung auf dem Papyrus Harris 500, die Einnahme von Joppe, berichtet, wie sein General Djehuti Soldaten in Säcken versteckt in die Stadt brachte. In der Amarnazeit enthielt es ägyptische königliche Kornspeicher, und die Ausgräber haben das Torhaus der ägyptischen Festung freigelegt, bekannt als Ramsestor."
    - "Josua nennt Joppe an der Grenze des Loses Dans. Zedernholz vom Libanon wurde auf Flößen nach Joppe gebracht, für Salomos Tempel und noch einmal für den nach dem Exil wieder aufgebauten Tempel, und Jona ging nach Joppe hinab, um ein Schiff nach Tarsis zu finden. 701 v. Chr. nahm Sanherib von Assyrien Joppe, damals eine Stadt Sidqas, des Königs von Aschkelon. In persischer Zeit berichtet der Sarkophag Eschmunazars II. von Sidon, dass der persische König den Sidoniern Dor und Joppe gab."
    - "In den Makkabäerkriegen verbrannte Judas den Hafen von Joppe, nachdem seine Bewohner die unter ihnen lebenden Juden ertränkt hatten; Jonatan nahm die Stadt, und Simon legte eine Besatzung hinein und machte sie zum Hafen der Juden. Pompeius befreite Joppe 63 v. Chr., Julius Caesar gab es unter Hyrkanos II. den Juden zurück, und Augustus gab es Herodes. Im Jahr 66 n. Chr. nahm Cestius Gallus Joppe, tötete seine Bewohner und verbrannte es; als Flüchtlinge es zu einem Stützpunkt der Piraterie machten, nahmen Vespasians Truppen es 67 erneut. Josephus erwähnt die dortigen Felsen, an die der Legende nach Andromeda gekettet war."
    - "In der Apostelgeschichte starb die Jüngerin Tabita, auch Dorkas genannt, in Joppe, und Petrus, aus dem nahen Lydda gerufen, erweckte sie zum Leben. Er blieb viele Tage bei Simon, einem Gerber, dessen Haus am Meer lag; auf dessen Dach sah er die Vision vom Tuch, das vom Himmel herabgelassen wurde, und von hier ging er mit den Boten des Kornelius nach Caesarea. Bei der Beschreibung von Paulas Pilgerreise in den 380er Jahren erwähnt Hieronymus Joppe, nahe ihrem Weg bei Lydda, als Hafen von Jonas Flucht, und im 5. Jahrhundert hatte die Stadt einen eigenen Bischof."
  fr:
    - "Joppé, aujourd’hui Jaffa dans Tel-Aviv-Yafo, se dresse sur un promontoire rocheux avec un petit port naturel, le principal port de la côte centrale. Elle passa sous l’Égypte au XVe siècle av. J.-C., quand Thoutmosis III la compta parmi ses conquêtes ; un conte égyptien du papyrus Harris 500, la Prise de Joppé, raconte comment son général Djehouty fit entrer des soldats dans la ville cachés dans des sacs. À l’époque d’Amarna, elle abritait des greniers royaux égyptiens, et les fouilleurs ont mis au jour la porte de la forteresse égyptienne, connue sous le nom de porte de Ramsès."
    - "Josué nomme Joppé à la frontière du lot de Dan. Le cèdre du Liban fut acheminé en radeaux jusqu’à Joppé pour le temple de Salomon, puis pour le temple rebâti après l’exil, et Jonas descendit à Joppé pour trouver un navire pour Tarsis. En 701 av. J.-C., Sanchérib d’Assyrie prit Joppé, alors ville de Sidqa, roi d’Askalon. À l’époque perse, le sarcophage d’Eshmounazar II de Sidon rapporte que le roi perse donna Dor et Joppé aux Sidoniens."
    - "Dans les guerres maccabéennes, Judas brûla le port de Joppé après que ses habitants eurent noyé les Juifs vivant parmi eux ; Jonathan prit la ville, et Simon y mit garnison et en fit le port des Juifs. Pompée libéra Joppé en 63 av. J.-C., Jules César la rendit aux Juifs sous Hyrcan II, et Auguste la donna à Hérode. En 66 apr. J.-C., Cestius Gallus prit Joppé, tua ses habitants et la brûla ; quand des réfugiés en firent une base de piraterie, les troupes de Vespasien la reprirent en 67. Josèphe mentionne les rochers où, selon la légende, Andromède avait été enchaînée."
    - "Dans les Actes, la disciple Tabitha, appelée aussi Dorcas, mourut à Joppé, et Pierre, appelé de Lydde toute proche, la ressuscita. Il resta plusieurs jours chez Simon, un corroyeur, dont la maison était au bord de la mer ; sur son toit, il vit la vision de la nappe descendue du ciel, et de là il partit avec les messagers de Corneille pour Césarée. Décrivant le pèlerinage de Paula dans les années 380, Jérôme mentionne Joppé, près de sa route à Lydde, comme le port de la fuite de Jonas, et au Ve siècle la ville avait son propre évêque."
