body:
  en:
    - "Tel-melah, “mound of salt”, heads the list of places in Babylonia from which a group of returning exiles came who could not prove that they were Israelites: “these were they which went up from Tel-melah, Tel-harsa, Cherub, Addan, and Immer: but they could not shew their father's house, and their seed, whether they were of Israel”. The list is given twice, in Ezra and Nehemiah, and the town is named nowhere else. Like Tel-harsha and Tel-abib on the Chebar, it was probably a ruin mound resettled with deportees; the salt may point to the saline flats of lower Mesopotamia."
    - "Its site is not known. Since Babylonian records show Judeans settled in the countryside around Nippur in the sixth and fifth centuries BC, the map places Tel-melah roughly within about 50 km of Nippur; it also shows a site further south compared with Thelme, a town in lower Babylonia named by the geographer Ptolemy, on the strength of the name. Neither has been confirmed by an inscription."
  ru:
    - "Тел-Мелах, «соляной холм», открывает список мест в Вавилонии, откуда вышла группа возвращавшихся изгнанников, не сумевших доказать, что они израильтяне: «И вот вышедшие из Тел-Мелаха, Тел-Харши, Херуб-Аддан-Иммера, которые не могли показать о поколении своем и о племени своем от Израиля ли они». Список приведён дважды, у Ездры и Неемии, и больше этот город нигде не назван. Как Тел-Харша и Тел-Авив на реке Ховаре, это был, вероятно, холм развалин, заново заселённый переселенцами; соль может указывать на солончаки нижней Месопотамии."
    - "Где он находился, неизвестно. Поскольку вавилонские записи показывают иудеев, поселённых в сельской округе Ниппура в VI–V веках до н. э., на карте Тел-Мелах помещён приблизительно, в пределах около 50 км от Ниппура; показано на ней и место южнее, которое по созвучию сопоставляют с Тельме — городом нижней Вавилонии у географа Птолемея. Ни то ни другое надписью не подтверждено."
  uk:
    - "Тель-Мелах, «пагорб солі», відкриває перелік місць у Вавилонії, звідки походила група повернених вигнанців, які не могли довести, що вони ізраїльтяни: «ось ті, що вийшли з Телмелаха, Телхарші, Херув-Аддона та Іммера, але вони не могли вказати на дім батьків своїх і на племя своє, чи вони від Ізраїля». Перелік наведено двічі, в Ездри й Неємії, і місто більше ніде не названо. Як і Тель-Харша та Тел-Авів над Хебаром, воно, ймовірно, було пагорбом руїн, заселеним наново депортованими; сіль може вказувати на солончакові рівнини нижньої Месопотамії."
    - "Його місце невідоме. Оскільки вавилонські записи показують юдеїв, поселених у сільській місцевості навколо Ніппура в VI–V ст. до н. е., мапа позначає Тель-Мелах приблизно в межах близько 50 км від Ніппура; вона також показує місце далі на південь, порівнюване за назвою з Тельме, містом у нижній Вавилонії, названим географом Птолемеєм. Жодне не підтверджене написом."
  es:
    - "Tel-mela, «montículo de sal», encabeza la lista de lugares de Babilonia de donde procedía un grupo de desterrados que volvían y que no podían probar que eran israelitas: «estos fueron los que subieron de Tel-mela, Tel-harsa, Chêrub, Addan, é Immer, los cuales no pudieron mostrar la casa de sus padres, ni su linaje, si eran de Israel». La lista se da dos veces, en Esdras y en Nehemías, y la ciudad no se nombra en ningún otro lugar. Como Tel-harsa y Tel-abib junto al Quebar, era probablemente un montículo de ruinas repoblado con deportados; la sal puede apuntar a las salinas de la baja Mesopotamia."
    - "Su emplazamiento no se conoce. Como los registros babilónicos muestran judeos asentados en el campo en torno a Nippur en los siglos VI y V a. C., el mapa sitúa Tel-mela aproximadamente a unos 50 km de Nippur; muestra también un sitio más al sur, comparado con Telme, una ciudad de la baja Babilonia nombrada por el geógrafo Tolomeo, en virtud del nombre. Ninguno de los dos ha sido confirmado por una inscripción."
  pt:
    - "Tel-Melá, “monte de sal”, encabeça a lista de lugares da Babilônia de onde veio um grupo de exilados que voltavam e não podiam provar que eram israelitas: “Estes foram os que subiram de Tel-Melá, Tel-Harsa, Querube, Adã e Imer; mas eles não puderam provar as casas de seus pais e sua descendência, se eles eram de Israel”. A lista é dada duas vezes, em Esdras e Neemias, e a cidade não é nomeada em nenhum outro lugar. Como Tel-Harsa e Tel-Abibe junto ao Quebar, era provavelmente um monte de ruínas repovoado com deportados; o sal pode indicar as planícies salinas da baixa Mesopotâmia."
    - "Seu sítio não é conhecido. Como registros babilônicos mostram judeus assentados no campo em torno de Nippur nos séculos VI e V a.C., o mapa situa Tel-Melá aproximadamente a 50 km de Nippur; mostra também um sítio mais ao sul, comparado, pelo nome, com Telmé, cidade da baixa Babilônia citada pelo geógrafo Ptolomeu. Nenhum dos dois foi confirmado por inscrição."
  de:
    - "Tel-Melach, „Salzhügel“, steht an der Spitze der Liste von Orten in Babylonien, aus denen eine Gruppe heimkehrender Exilierter kam, die nicht nachweisen konnten, Israeliten zu sein: „Und diese zogen auch mit herauf von Thel-Melah, Thel-Harsa, Cherub, Addon und Immer, aber sie konnten nicht anzeigen ihr Vaterhaus noch ihr Geschlecht, ob sie aus Israel wären“. Die Liste steht zweimal, bei Esra und Nehemia, und die Stadt wird sonst nirgends genannt. Wie Tel-Harscha und Tel-Abib am Kebar war sie wohl ein mit Deportierten wiederbesiedelter Ruinenhügel; das Salz mag auf die salzhaltigen Ebenen Südmesopotamiens deuten."
    - "Ihre Lage ist unbekannt. Da babylonische Quellen Judäer zeigen, die im sechsten und fünften Jahrhundert v. Chr. auf dem Land um Nippur angesiedelt waren, setzt die Karte Tel-Melach ungefähr innerhalb von etwa 50 km um Nippur an; auf Grund des Namens zeigt sie auch einen weiter südlichen Ort, verglichen mit Telme, einer Stadt in Unterbabylonien, die der Geograph Ptolemäus nennt. Keines von beiden ist durch eine Inschrift bestätigt."
  fr:
    - "Tel-Mélach, « tertre de sel », ouvre la liste des lieux de Babylonie d’où venait un groupe d’exilés de retour qui ne pouvaient prouver qu’ils étaient Israélites : « Voici ceux qui partirent de Thel-Mélach, de Thel-Harscha, de Kerub-Addon, et d’Immer, et qui ne purent pas faire connaître leur maison paternelle et leur race, pour prouver qu’ils étaient d’Israël ». La liste est donnée deux fois, chez Esdras et chez Néhémie, et la ville n’est nommée nulle part ailleurs. Comme Tel-Harscha et Tel-Abib sur le Kebar, c’était probablement un tertre de ruines repeuplé de déportés ; le sel peut évoquer les terres salines de la basse Mésopotamie."
    - "Son site est inconnu. Comme des documents babyloniens montrent des Judéens installés dans la campagne autour de Nippur aux VIe et Ve siècles av. J.-C., la carte place Tel-Mélach de façon approximative, à moins de 50 km de Nippur ; elle montre aussi, plus au sud, un site rapproché de Telmé, ville de la basse Babylonie nommée par le géographe Ptolémée, en raison du nom. Aucun des deux n’a été confirmé par une inscription."
  pl:
    - "Tel-Melach, „kopiec soli”, otwiera listę miejsc w Babilonii, skąd przybyła grupa wracających wygnańców, którzy nie mogli udowodnić, że są Izraelitami: „A cić są, którzy wyszli z Telmelachu i z Telcharsa: Cherub, Addan, i Immer: ale nie mogli okazać domu ojców swoich i nasienia swego, jeźli z Izraela byli”. Lista występuje dwukrotnie, w Księdze Ezdrasza i Nehemiasza, a miasto nie jest wymienione nigdzie indziej. Podobnie jak Tel-Charsza i Tel-Abib nad Kebar, był to prawdopodobnie kopiec ruin zasiedlony deportowanymi; sól może wskazywać na słone równiny dolnej Mezopotamii."
    - "Jego położenie nie jest znane. Ponieważ dokumenty babilońskie pokazują Judejczyków osiedlonych na wsi wokół Nippur w VI i V wieku p.n.e., mapa umieszcza Tel-Melach z grubsza w odległości około 50 km od Nippur; pokazuje też, na podstawie nazwy, stanowisko dalej na południe, porównywane z Telme, miastem w dolnej Babilonii wymienianym przez geografa Ptolemeusza. Żadne z nich nie zostało potwierdzone inskrypcją."
  it:
    - "Tel-Mela, «tumulo di sale», apre l’elenco dei luoghi della Babilonia da cui veniva un gruppo di esuli ritornati che non potevano provare di essere israeliti: «Ed ecco quelli che tornarono da Tel-Melah, da Tel-Harsha, da Kerub-Addan, da Immer, e che non poterono indicare la loro casa patriarcale e la loro discendenza per provare ch’erano d’Israele». L’elenco è dato due volte, in Esdra e in Neemia, e la città non è nominata altrove. Come Tel-Carsa e Tel-Abib sul Chebar, era probabilmente un tumulo di rovine ripopolato con deportati; il sale può indicare le distese saline della bassa Mesopotamia."
    - "Il suo sito non è noto. Poiché i documenti babilonesi mostrano Giudei stabiliti nella campagna attorno a Nippur nel VI e V secolo a.C., la mappa colloca Tel-Mela approssimativamente entro circa 50 km da Nippur; mostra anche un sito più a sud, confrontato con Telme, città della bassa Babilonia nominata dal geografo Tolomeo, in base al nome. Nessuno dei due è stato confermato da un’iscrizione."
  nl:
    - "Tel-Melach, “zoutheuvel”, staat bovenaan de lijst van plaatsen in Babylonië waar een groep terugkerende ballingen vandaan kwam die niet konden bewijzen dat zij Israëlieten waren: “Dezen togen ook op van Tel-melah, Tel-harsa, Cherub, Addan en Immer; doch zij konden hunner vaderen huis en hun zaad niet bewijzen, of zij uit Israël waren”. De lijst wordt tweemaal gegeven, in Ezra en Nehemia, en de stad wordt nergens anders genoemd. Net als Tel-Charsa en Tel-Abib aan de Kebar was het waarschijnlijk een puinheuvel die opnieuw met weggevoerden werd bevolkt; het zout kan wijzen op de zoute vlakten van Beneden-Mesopotamië."
    - "De ligging is niet bekend. Omdat Babylonische bronnen tonen dat Judeeërs zich in de zesde en vijfde eeuw v.Chr. op het platteland rond Nippur vestigden, plaatst de kaart Tel-Melach bij benadering binnen ongeveer 50 km van Nippur; ze toont ook een plek verder naar het zuiden, vergeleken met Thelme, een stad in Beneden-Babylonië die door de geograaf Ptolemaeus wordt genoemd, op grond van de naam. Geen van beide is door een opschrift bevestigd."
  cs:
    - "Tel-melach, „pahorek soli“, stojí v čele seznamu míst v Babylonii, odkud pocházela skupina navrátivších se vyhnanců, kteří nemohli prokázat, že jsou Izraelité: „Tito také byli, kteříž šli z Telmelach, Telcharsa, Cherub, Addan a Immer, ale nemohli ukázati domu otců svých a semene svého, že by z Izraele byli“. Seznam je uveden dvakrát, u Ezdráše i u Nehemjáše, a město není jmenováno nikde jinde. Podobně jako Tel-charša a Tel-abíb na Kebaru to byl pravděpodobně pahorek zřícenin znovuosídlený deportovanými; sůl může ukazovat na slané roviny dolní Mezopotámie."
    - "Jeho poloha není známa. Protože babylónské záznamy ukazují Judejce usazené na venkově kolem Nippuru v 6. a 5. stol. př. n. l., mapa klade Tel-melach zhruba do vzdálenosti asi 50 km od Nippuru; podle jména ukazuje také místo dále na jih, srovnávané s Telme, městem v dolní Babylonii, které jmenuje geograf Ptolemaios. Ani jedno nebylo potvrzeno nápisem."
  sv:
    - "Tel-Melach, ”saltets kulle”, står först i förteckningen över platser i Babylonien varifrån en grupp återvändande landsflyktiga kom som inte kunde bevisa att de var israeliter: ”dessa voro de som drogo åstad från Tel-Mela, Tel-Harsa, Kerub, Addan och Immer, men som icke kunde uppgiva sina familjer och sin släkt och huruvida de voro av Israel”. Förteckningen ges två gånger, i Esra och Nehemja, och staden nämns ingen annanstans. Liksom Tel-Harsha och Tel-Abib vid Kebar var den sannolikt en ruinkulle som återbosatts med bortförda; saltet kan peka på de salta slätterna i nedre Mesopotamien."
    - "Dess läge är okänt. Eftersom babyloniska handlingar visar judar bosatta på landsbygden kring Nippur på 500- och 400-talen f.Kr. placerar kartan Tel-Melach ungefärligt inom omkring 50 km från Nippur; den visar också en plats längre söderut, jämförd med Thelme, en stad i nedre Babylonien som geografen Ptolemaios nämner, på grund av namnet. Ingen av dem har bekräftats av en inskrift."
  nb:
    - "Tel-Melah, «saltets haug», står først i listen over steder i Babylonia som en gruppe hjemvendte eksilerte kom fra, og som ikke kunne bevise at de var israelitter: «dette var de som drog hjem fra Tel-Melah, Tel-Harsa, Kerub, Addan og Immer, men ikke kunde opgi sin familie og sin ætt, eller om de var av Israel». Listen er gitt to ganger, i Esra og Nehemja, og byen er ikke nevnt noe annet sted. I likhet med Tel-Harsja og Tel-Abib ved Kebar var den trolig en ruinhaug bosatt på nytt med deporterte; saltet kan peke mot de salte slettene i nedre Mesopotamia."
    - "Beliggenheten er ikke kjent. Siden babylonske kilder viser judeere bosatt på landsbygda rundt Nippur på 500- og 400-tallet f.Kr., plasserer kartet Tel-Melah omtrentlig innenfor omkring 50 km fra Nippur; det viser også et sted lenger sør, sammenlignet med Telme, en by i nedre Babylonia nevnt av geografen Ptolemaios, på grunn av navnet. Ingen av dem er bekreftet av en innskrift."
  tl:
    - "Ang Tel-melah, “burol ng asin”, ang nangunguna sa talaan ng mga lugar sa Babilonia kung saan nanggaling ang isang pangkat ng mga bumabalik na ipinatapon na hindi makapagpatunay na sila'y mga Israelita: “At ang mga ito ang nagsiahon mula sa Tel-mela, Tel-harsa, Cherub, Addan, at Immer: nguni't hindi nila naipakilala ang mga sangbahayan ng kanilang mga magulang, at ang kanilang binhi kung sila'y taga Israel”. Dalawang beses ibinigay ang talaan, sa Ezra at Nehemias, at wala nang ibang pinangalanan ang bayan. Gaya ng Tel-harsha at Tel-abib sa Chebar, marahil ito ay burol ng guho na muling tinirhan ng mga itinapon; ang asin ay maaaring tumuro sa maaalat na kapatagan ng ibabang Mesopotamia."
    - "Hindi alam ang pook nito. Yamang ipinakikita ng mga talaang Babilonyo na nanirahan ang mga Judio sa kanayunan sa paligid ng Nippur noong ika-6 at ika-5 siglo BK, inilalagay ng mapa ang Tel-melah nang tinatayang sa loob ng humigit-kumulang 50 km mula sa Nippur; ipinakikita rin nito ang isang pook na mas timog, na inihambing sa Thelme, bayan sa ibabang Babilonia na pinangalanan ng heograpong si Ptolemeo, batay sa pangalan. Wala sa dalawa ang nakumpirma ng inskripsiyon."
  da:
    - "Tel-Melah, »saltets høj«, står først i listen over steder i Babylonien, hvorfra en gruppe hjemvendte eksilerede kom, som ikke kunne bevise, at de var israelitter: »disse ere de som droge op fra Thel-Mela, Thel-Harsa, Kerub, Addan og Immer; men de kunde ikke angive deres Fædres Hus og deres Slægt, om de vare af Israel«. Listen gives to gange, i Ezra og Nehemias, og byen nævnes ikke andre steder. Ligesom Tel-Harsja og Tel-Abib ved Kebar var den sandsynligvis en ruinhøj, der blev genbosat med deporterede; saltet kan pege på de salte flader i det nedre Mesopotamien."
    - "Dens sted er ikke kendt. Da babylonske optegnelser viser judæere bosat på landet omkring Nippur i 500- og 400-tallet f.Kr., placerer kortet Tel-Melah nogenlunde inden for omkring 50 km fra Nippur; det viser også et sted længere mod syd, som på grund af navnet sammenlignes med Thelme, en by i det nedre Babylonien nævnt af geografen Ptolemaios. Ingen af dem er bekræftet af en indskrift."
  sr:
    - "Тел-Мелех, „хум соли“, предводи списак места у Вавилонији одакле је дошла група повратника из изгнанства који нису могли доказати да су Израиљци: „И ови пођоше из Тел-Мелеха и Тел-Арисе, Херув, Адан и Имир, али не могоше показати отачки дом свој и семе своје, еда ли су од Израиља“. Списак је дат двапут, у Јездри и Немији, а град се нигде другде не именује. Као Тел-Харса и Телавив на Хевару, вероватно је био рушевински хум поново насељен одведенима; со може упућивати на слане равнице доње Месопотамије."
    - "Његово налазиште није познато. Пошто вавилонски записи показују Јудејце насељене на селу око Нипура у 6. и 5. веку п. н. е., карта Тел-Мелех смешта приближно у оквиру око 50 км од Нипура; на основу имена приказује и налазиште даље на југ, упоређено с Телмеом, градом у доњој Вавилонији који помиње географ Птолемеј. Ниједно није потврђено натписом."
