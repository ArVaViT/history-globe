# Overview article (ADR 0007). Mainstream facts only; a Babylonian place of the exiles, unlocated; the two candidates on the map (near Nippur; the Thelme of Greek geography) are named, neither as fact.
id: tel-melah
place: a2b5ee9
title:
  en: "Tel-melah"
  ru: "Тел-Мелах"
body:
  en:
    - "Tel-melah, “mound of salt”, heads the list of places in Babylonia from which a group of returning exiles came who could not prove that they were Israelites: “these were they which went up from Tel-melah, Tel-harsa, Cherub, Addan, and Immer: but they could not shew their father's house, and their seed, whether they were of Israel”. The list is given twice, in Ezra and Nehemiah, and the town is named nowhere else. Like Tel-harsha and Tel-abib on the Chebar, it was probably a ruin mound resettled with deportees; the salt may point to the saline flats of lower Mesopotamia."
    - "Its site is not known. Since Babylonian records show Judeans settled in the countryside around Nippur in the sixth and fifth centuries BC, the map places Tel-melah roughly within about 50 km of Nippur; it also shows a site further south compared with Thelme, a town in lower Babylonia named by the geographer Ptolemy, on the strength of the name. Neither has been confirmed by an inscription."
  ru:
    - "Тел-Мелах, «соляной холм», открывает список мест в Вавилонии, откуда вышла группа возвращавшихся изгнанников, не сумевших доказать, что они израильтяне: «И вот вышедшие из Тел-Мелаха, Тел-Харши, Херуб-Аддан-Иммера, которые не могли показать о поколении своем и о племени своем от Израиля ли они». Список приведён дважды, у Ездры и Неемии, и больше этот город нигде не назван. Как Тел-Харша и Тел-Авив на реке Ховаре, это был, вероятно, холм развалин, заново заселённый переселенцами; соль может указывать на солончаки нижней Месопотамии."
    - "Где он находился, неизвестно. Поскольку вавилонские записи показывают иудеев, поселённых в сельской округе Ниппура в VI–V веках до н. э., на карте Тел-Мелах помещён приблизительно, в пределах около 50 км от Ниппура; показано на ней и место южнее, которое по созвучию сопоставляют с Тельме — городом нижней Вавилонии у географа Птолемея. Ни то ни другое надписью не подтверждено."
scripture:
  - Ezra.2.59
  - Neh.7.61
  - Ezek.3.15
sources:
