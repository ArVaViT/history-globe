body:
  en:
    - "The Nile flows some 6,650 km from the lakes of East Africa to the Mediterranean and is usually counted the longest river in the world. The White Nile comes from Lake Victoria, the Blue Nile from Lake Tana in Ethiopia, and the two join at Khartoum; it is the Blue Nile and the Atbara, fed by the Ethiopian summer rains, that brought the yearly flood. Between Aswan, the ancient Syene at the First Cataract, and Cairo the river runs through a narrow valley, and then spreads into the Delta, whose seven mouths the ancients counted and Isaiah seems to recall. Herodotus called the Egypt that the Greeks reached by ship a gift of the river."
    - 'Egypt lived by the inundation: from July to October the river covered the fields and left its silt, and the height of the flood, read on nilometers, foretold plenty or famine; Pharaoh''s dream of seven fat and seven lean kine coming "up out of the river" belongs to this world. The Hebrew word for the Nile, ye''or, is borrowed from Egyptian; the King James Version renders it simply "the river". The Bible also knows Shihor, usually taken for the easternmost branch of the Delta, and "the river of Egypt" at the border of the promised land, which most identify with the Wadi el-Arish rather than the Nile.'
    - 'Pharaoh ordered every Hebrew son cast "into the river", and Moses was laid in an ark of bulrushes "in the flags by the river''s brink", where Pharaoh''s daughter found him. The first plague turned the waters of the river to blood so that "the fish that was in the river died", and the second brought frogs out of it. Isaiah foretells that "the river shall be wasted and dried up" and the fishers mourn; Jeremiah pictures Egypt rising "like a flood"; Ezekiel''s Pharaoh is "the great dragon that lieth in the midst of his rivers" and boasts, "My river is mine own"; Amos likens the trembling earth to the flood of Egypt; Nahum recalls Thebes "situate among the rivers".'
    - "The Nile remained Egypt's road and lifeline through the Greek, Roman and Arab periods, and Alexandria near its western mouth was one of the greatest ports of the ancient world. The Aswan Low Dam of 1902 and the High Dam, completed in 1970, ended the annual flood and created Lake Nasser; the Grand Ethiopian Renaissance Dam on the Blue Nile, built from 2011 and inaugurated in 2025, has set Ethiopia, Sudan and Egypt at odds over the river's water. The valley and the Delta hold nearly all of Egypt's more than a hundred million people."
  ru:
    - "Нил течёт около 6650 км от озёр Восточной Африки до Средиземного моря и обычно считается самой длинной рекой мира. Белый Нил выходит из озера Виктория, Голубой — из озера Тана в Эфиопии, и они сливаются у Хартума; именно Голубой Нил и Атбара, питаемые летними дождями Эфиопии, приносили ежегодный разлив. Между Асуаном, древней Сиеной у первого порога, и Каиром река идёт узкой долиной, а затем расходится Дельтой, семь рукавов которой считали древние и, по-видимому, вспоминает Исаия. Геродот назвал даром реки тот Египет, куда греки приплывали на кораблях."
    - "Египет жил разливом: с июля по октябрь река покрывала поля и оставляла ил, а высота воды, читаемая по ниломерам, предвещала изобилие или голод; сон фараона о семи тучных и семи тощих коровах, вышедших «из реки», принадлежит этому миру. Еврейское слово для Нила, «йеор», заимствовано из египетского; Синодальный перевод чаще всего передаёт его просто как «река». Библия знает и Сихор, который обычно принимают за восточный рукав Дельты, и поток Египетский на границе обетованной земли — «от реки Египетской до великой реки, реки Евфрата», — который большинство отождествляет не с Нилом, а с Вади-эль-Ариш."
    - "Фараон велел бросать всякого новорождённого у Евреев сына «в реку», а Моисея положили в корзинку из тростника «в тростнике у берега реки», где его нашла дочь фараона. Первая казнь обратила воду в реке в кровь, так что «рыба в реке вымерла», а вторая вывела из неё жаб. Исаия предрекает, что «река иссякнет и высохнет» и восплачут рыбаки; Иеремия изображает Египет, который «поднимается, как река»; фараон у Иезекииля — «большой крокодил, который, лежа среди рек своих», хвалится: «моя река, и я создал ее для себя»; Амос уподобляет колеблющуюся землю реке Египетской; Наум вспоминает Но-Аммон, «находящегося между реками»."
    - "Нил оставался дорогой и жизненной жилой Египта в греческое, римское и арабское время, а Александрия близ его западного устья была одним из величайших портов древнего мира. Старая Асуанская плотина 1902 года и Высотная, законченная в 1970-м, прекратили ежегодный разлив и создали озеро Насер; плотина «Возрождение» на Голубом Ниле, строившаяся в Эфиопии с 2011 года и открытая в 2025-м, поссорила Эфиопию, Судан и Египет из-за воды реки. В долине и Дельте живут почти все из более чем ста миллионов жителей Египта."
  uk:
    - "Ніл тече приблизно 6650 км від озер Східної Африки до Середземного моря й зазвичай вважається найдовшою річкою світу. Білий Ніл починається з озера Вікторія, Блакитний Ніл — з озера Тана в Ефіопії, і вони зливаються в Хартумі; саме Блакитний Ніл та Атбара, що живляться ефіопськими літніми дощами, приносили щорічну повідь. Між Асуаном, давньою Сієною біля Першого порога, та Каїром річка тече вузькою долиною, а потім розтікається в Дельту, сім гирл якої рахували давні й, схоже, згадує Ісая. Геродот називав даром річки той Єгипет, куди греки припливали кораблями."
    - "Єгипет жив розливом: від липня до жовтня річка вкривала поля й залишала мул, а висота повені, яку читали за нілометрами, віщувала достаток або голод; сон фараона про сім ситих і сім худих корів, що виходили з річки, належить до цього світу. Єврейське слово для Нілу, єор, запозичене з єгипетської; Біблія короля Якова передає його просто як «річка». Біблія знає також Сихор, який зазвичай вважають найсхіднішим рукавом Дельти, і межу обітованої землі «від ріки Египецької», яку більшість ототожнює з Ваді-ель-Арішем, а не з Нілом."
    - "Фараон наказав кидати кожного єврейського сина «в ріку», і Мойсея поклали в кошик з рогози «між осет уз беріг ріки», де його знайшла дочка фараона. Перша кара обернула води річки на кров, так що «риба в ріцї вигинула», а друга вивела з неї жаб. Ісая провіщає, що «ріка стане безводна й висохне», і рибалки заплачуть; Єремія змальовує Єгипет, що здіймається «мов ріка»; фараон у Єзекіїля — «величезний крокодиле, що лежиш посеред твоєї ріки» — і вихваляється: «Моя ріка, я сотворив її собі!»; Амос порівнює тремтіння землі з розливом Єгипту — «як ріка Египетська»; Наум згадує Но, «що розложився між ріками»."
    - "Ніл залишався дорогою та життєдайною жилою Єгипту в грецький, римський і арабський періоди, а Александрія біля його західного гирла була одним з найбільших портів давнього світу. Нижня Асуанська гребля 1902 року та Висока гребля, завершена 1970 року, поклали край щорічній повені й створили озеро Насер; Велика ефіопська дамба Відродження на Блакитному Нілі, що будувалася з 2011 року й була відкрита 2025 року, посварила Ефіопію, Судан і Єгипет через воду річки. Долина й Дельта вміщують майже всіх понад сто мільйонів мешканців Єгипту."
  es:
    - "El Nilo recorre unos 6650 km desde los lagos del África oriental hasta el Mediterráneo y suele contarse como el río más largo del mundo. El Nilo Blanco procede del lago Victoria, el Nilo Azul del lago Tana, en Etiopía, y ambos se unen en Jartum; son el Nilo Azul y el Atbara, alimentados por las lluvias estivales etíopes, los que traían la crecida anual. Entre Asuán, la antigua Sevene en la primera catarata, y El Cairo el río corre por un valle estrecho, y luego se abre en el Delta, cuyas siete bocas contaban los antiguos y que Isaías parece recordar. Heródoto llamó don del río al Egipto al que los griegos llegaban por mar."
    - "Egipto vivía de la inundación: de julio a octubre el río cubría los campos y dejaba su limo, y la altura de la crecida, leída en los nilómetros, anunciaba abundancia o hambre; el sueño de Faraón de siete vacas gordas y siete flacas que «del río subían» pertenece a este mundo. La palabra hebrea para el Nilo, ye'or, es un préstamo del egipcio; la King James Version la traduce simplemente «el río». La Biblia conoce también el Sihor, que por lo común se toma por el brazo más oriental del Delta, y «el río de Egipto» en la frontera de la tierra prometida, que la mayoría identifica con el uadi el-Arish y no con el Nilo."
    - "Faraón ordenó echar a todo hijo hebreo «en el río», y Moisés fue puesto en una arquilla de juncos «en un carrizal á la orilla del río», donde lo encontró la hija de Faraón. La primera plaga convirtió en sangre las aguas del río, de modo que «los peces que había en el río murieron», y la segunda hizo salir de él las ranas. Isaías anuncia que «el río se agotará y secará» y que los pescadores harán duelo; Jeremías imagina a Egipto que «como río se hincha»; el Faraón de Ezequiel es «el gran dragón que yace en medio de sus ríos» y se jacta: «Mío es mi río»; Amós compara la tierra que tiembla con el río de Egipto; Nahum recuerda a Tebas «asentada entre ríos»."
    - "El Nilo siguió siendo el camino y el sustento de Egipto durante los períodos griego, romano y árabe, y Alejandría, cerca de su desembocadura occidental, fue uno de los mayores puertos del mundo antiguo. La Presa Baja de Asuán, de 1902, y la Presa Alta, terminada en 1970, pusieron fin a la crecida anual y crearon el lago Nasser; la Gran Presa del Renacimiento Etíope, en el Nilo Azul, construida desde 2011 e inaugurada en 2025, ha enfrentado a Etiopía, Sudán y Egipto por las aguas del río. El valle y el Delta albergan casi a todos los más de cien millones de habitantes de Egipto."
  pt:
    - "O Nilo corre por cerca de 6.650 km, dos lagos da África Oriental ao Mediterrâneo, e costuma ser contado como o rio mais longo do mundo. O Nilo Branco vem do Lago Vitória, o Nilo Azul do Lago Tana, na Etiópia, e os dois se unem em Cartum; são o Nilo Azul e o Atbara, alimentados pelas chuvas de verão etíopes, que traziam a cheia anual. Entre Assuã, a antiga Sevene na Primeira Catarata, e o Cairo, o rio corre por um vale estreito e depois se abre no Delta, cujas sete bocas os antigos contavam e Isaías parece recordar. Heródoto chamou de dom do rio o Egito ao qual os gregos chegavam de navio."
    - "O Egito vivia da inundação: de julho a outubro o rio cobria os campos e deixava o seu limo, e a altura da cheia, lida nos nilômetros, anunciava fartura ou fome; o sonho do Faraó com sete vacas gordas e sete magras que “subiram do rio” pertence a esse mundo. A palavra hebraica para o Nilo, ye'or, é tomada do egípcio; a Bíblia King James a traduz simplesmente por “o rio”. A Bíblia conhece também o Sior, geralmente tomado pelo braço mais oriental do Delta, e “o rio do Egito”, na fronteira da terra prometida, que a maioria identifica com o Uádi el-Arish e não com o Nilo."
    - "O Faraó ordenou que todo filho hebreu fosse lançado “no rio”, e Moisés foi posto num cesto de papiro “entre os juncos à margem do rio”, onde a filha do Faraó o encontrou. A primeira praga transformou as águas do rio em sangue, de modo que “os peixes que estavam no rio morreram”, e a segunda trouxe rãs dele. Isaías prediz que “o rio se esgotará e secará” e os pescadores se lamentarão; Jeremias imagina o Egito subindo “como o Nilo”; o Faraó de Ezequiel é “o grande monstro que está deitado no meio dos seus rios” e se gaba: “O meu rio é meu”; Amós compara a terra que treme à cheia do Egito; Naum lembra Tebas, que “estava situada entre os rios”."
    - "O Nilo continuou sendo a estrada e a linha de vida do Egito nos períodos grego, romano e árabe, e Alexandria, perto de sua boca ocidental, foi um dos maiores portos do mundo antigo. A Barragem Baixa de Assuã, de 1902, e a Alta Barragem, concluída em 1970, puseram fim à cheia anual e criaram o Lago Nasser; a Grande Represa do Renascimento Etíope, no Nilo Azul, construída a partir de 2011 e inaugurada em 2025, colocou Etiópia, Sudão e Egito em desacordo sobre as águas do rio. O vale e o Delta abrigam quase todos os mais de cem milhões de habitantes do Egito."
  de:
    - "Der Nil fließt etwa 6650 km von den Seen Ostafrikas bis zum Mittelmeer und gilt gewöhnlich als der längste Fluss der Erde. Der Weiße Nil kommt aus dem Victoriasee, der Blaue Nil aus dem Tanasee in Äthiopien, und beide vereinen sich bei Khartum; es sind der Blaue Nil und der Atbara, gespeist von den äthiopischen Sommerregen, die die jährliche Flut brachten. Zwischen Assuan, dem antiken Syene am Ersten Katarakt, und Kairo durchfließt der Strom ein schmales Tal und breitet sich dann im Delta aus, dessen sieben Mündungen die Alten zählten und an die Jesaja zu erinnern scheint. Herodot nannte das Ägypten, das die Griechen zu Schiff erreichten, ein Geschenk des Flusses."
    - "Ägypten lebte von der Überschwemmung: Von Juli bis Oktober bedeckte der Fluss die Felder und ließ seinen Schlamm zurück, und die an Nilometern abgelesene Höhe der Flut kündigte Fülle oder Hungersnot an; Pharaos Traum von sieben fetten und sieben mageren Kühen, die „aus dem Wasser steigen“, gehört zu dieser Welt. Das hebräische Wort für den Nil, ye'or, ist aus dem Ägyptischen entlehnt; die King-James-Bibel gibt es schlicht mit „the river“ wieder. Die Bibel kennt auch den Schihor, meist für den östlichsten Arm des Deltas gehalten, und „den Bach Ägyptens“ an der Grenze des verheißenen Landes, den die meisten eher mit dem Wadi el-Arisch als mit dem Nil gleichsetzen."
    - "Pharao befahl, jeden hebräischen Sohn „ins Wasser“ zu werfen, und Mose wurde in ein „Kästlein von Rohr“ gelegt, „in das Schilf am Ufer des Wassers“, wo die Tochter Pharaos ihn fand. Die erste Plage verwandelte das Wasser des Flusses in Blut, sodass „die Fische im Strom starben“, und die zweite ließ Frösche daraus aufsteigen. Jesaja kündigt an, „der Strom wird versiegen und verschwinden“ und die Fischer klagen; Jeremia sieht Ägypten heraufziehen „wie der Nil“; Hesekiel redet Pharao an: „du großer Drache, der du in deinem Wasser liegst“, der prahlt: „Der Strom ist mein“; Amos vergleicht das bebende Land mit der Flut Ägyptens, „wie mit dem Fluß Ägyptens“; Nahum erinnert an Theben: „die Stadt No-Amon, die da lag an den Wassern“."
    - "Der Nil blieb in griechischer, römischer und arabischer Zeit Ägyptens Straße und Lebensader, und Alexandria nahe seiner westlichen Mündung war einer der größten Häfen der antiken Welt. Der Assuan-Staudamm von 1902 und der 1970 fertiggestellte Hochdamm beendeten die jährliche Flut und schufen den Nassersee; der Große Äthiopische Renaissance-Damm am Blauen Nil, seit 2011 gebaut und 2025 eingeweiht, hat Äthiopien, den Sudan und Ägypten wegen des Flusswassers entzweit. Das Tal und das Delta beherbergen fast alle der mehr als hundert Millionen Einwohner Ägyptens."
  fr:
    - "Le Nil coule sur environ 6 650 km depuis les lacs d’Afrique orientale jusqu’à la Méditerranée et passe d’ordinaire pour le plus long fleuve du monde. Le Nil Blanc vient du lac Victoria, le Nil Bleu du lac Tana en Éthiopie, et les deux se joignent à Khartoum ; ce sont le Nil Bleu et l’Atbara, nourris par les pluies d’été éthiopiennes, qui apportaient la crue annuelle. Entre Assouan, l’antique Syène à la première cataracte, et Le Caire, le fleuve traverse une vallée étroite, puis s’étale dans le Delta, dont les anciens comptaient sept bouches et qu’Ésaïe semble évoquer. Hérodote appelait don du fleuve l’Égypte que les Grecs atteignaient en bateau."
    - "L’Égypte vivait de l’inondation : de juillet à octobre le fleuve couvrait les champs et laissait son limon, et la hauteur de la crue, lue sur des nilomètres, annonçait l’abondance ou la famine ; le songe de Pharaon sur sept vaches grasses et sept vaches maigres qui « montèrent hors du fleuve » appartient à ce monde. Le mot hébreu pour le Nil, ye’or, est emprunté à l’égyptien ; la King James le rend simplement par « the river ». La Bible connaît aussi le Schichor, d’ordinaire pris pour la branche la plus orientale du Delta, et « le fleuve d’Égypte » à la frontière de la terre promise, que la plupart identifient au Wadi el-Arish plutôt qu’au Nil."
    - "Pharaon ordonna de jeter dans « le fleuve » tout garçon hébreu, et Moïse fut déposé dans une caisse de jonc « parmi les roseaux, sur le bord du fleuve », où la fille de Pharaon le trouva. La première plaie changea les eaux du fleuve en sang, si bien que « les poissons qui étaient dans le fleuve périrent », et la deuxième en fit sortir des grenouilles. Ésaïe annonce que « le fleuve deviendra sec et aride » et que les pêcheurs gémiront ; Jérémie montre l’Égypte qui « s’avance comme le Nil » ; le Pharaon d’Ézéchiel est le « grand crocodile, qui te couches au milieu de tes fleuves » et dit : « Mon fleuve est à moi » ; Amos compare la terre qui tremble au fleuve d’Égypte ; Nahum rappelle Thèbes, « assise au milieu des fleuves »."
    - "Le Nil resta la route et la source de vie de l’Égypte aux époques grecque, romaine et arabe, et Alexandrie, près de son embouchure occidentale, fut l’un des plus grands ports du monde antique. Le barrage bas d’Assouan, en 1902, et le haut barrage, achevé en 1970, ont mis fin à la crue annuelle et créé le lac Nasser ; le grand barrage de la Renaissance éthiopienne sur le Nil Bleu, construit à partir de 2011 et inauguré en 2025, a dressé l’Éthiopie, le Soudan et l’Égypte les uns contre les autres au sujet des eaux du fleuve. La vallée et le Delta abritent presque tous les plus de cent millions d’habitants de l’Égypte."
  it:
    - "Il Nilo scorre per circa 6.650 km dai laghi dell’Africa orientale al Mediterraneo ed è di solito considerato il fiume più lungo del mondo. Il Nilo Bianco viene dal Lago Vittoria, il Nilo Azzurro dal Lago Tana in Etiopia, e i due si uniscono a Khartum; sono il Nilo Azzurro e l’Atbara, alimentati dalle piogge estive etiopiche, a portare la piena annuale. Tra Assuan, l’antica Siene alla Prima Cataratta, e Il Cairo il fiume corre in una valle stretta, poi si apre nel Delta, di cui gli antichi contavano sette bocche e che Isaia sembra ricordare. Erodoto definì un dono del fiume l’Egitto che i Greci raggiungevano per nave."
    - "L’Egitto viveva dell’inondazione: da luglio a ottobre il fiume ricopriva i campi e vi lasciava il limo, e l’altezza della piena, letta sui nilometri, preannunciava abbondanza o carestia; il sogno del Faraone di sette vacche grasse e sette magre che vedeva «salire dal fiume» appartiene a questo mondo. La parola ebraica per il Nilo, ye’or, è presa in prestito dall’egizio; la King James Version la rende semplicemente «the river». La Bibbia conosce anche lo Sicor, di solito identificato con il ramo più orientale del Delta, e «il fiume d’Egitto» al confine della terra promessa, che i più identificano con il Wadi el-Arish piuttosto che con il Nilo."
    - "Il Faraone ordinò di gettare ogni figlio ebreo «nel fiume», e Mosè fu deposto in un canestro di giunchi «nel canneto sulla riva del fiume», dove lo trovò la figlia del Faraone. La prima piaga mutò in sangue le acque del fiume, così che «il pesce ch’era nel fiume morì», e la seconda ne fece uscire le rane. Isaia predice che «il fiume diverrà secco, arido» e i pescatori faranno cordoglio; Geremia raffigura l’Egitto che «sale come il Nilo»; il Faraone di Ezechiele è «gran coccodrillo, che giaci in mezzo ai tuoi fiumi» e si vanta: «Il mio fiume è mio»; Amos paragona la terra che trema alla piena d’Egitto; Naum ricorda Tebe, «ch’era assisa tra i fiumi»."
    - "Il Nilo rimase la strada e la linfa vitale dell’Egitto per tutta l’epoca greca, romana e araba, e Alessandria, presso la sua foce occidentale, fu uno dei più grandi porti del mondo antico. La Diga bassa di Assuan del 1902 e la Grande Diga, completata nel 1970, posero fine alla piena annuale e crearono il Lago Nasser; la Grande Diga della Rinascita Etiope sul Nilo Azzurro, costruita dal 2011 e inaugurata nel 2025, ha contrapposto Etiopia, Sudan ed Egitto sulle acque del fiume. La valle e il Delta ospitano quasi tutti i più di cento milioni di abitanti dell’Egitto."
  pl:
    - "Nil płynie około 6650 km od jezior Afryki Wschodniej do Morza Śródziemnego i zwykle uchodzi za najdłuższą rzekę świata. Biały Nil wypływa z jeziora Wiktorii, Błękitny Nil z jeziora Tana w Etiopii, a oba łączą się w Chartumie; to Błękitny Nil i Atbara, zasilane etiopskimi deszczami letnimi, przynosiły coroczną powódź. Między Asuanem, dawnym Syene przy Pierwszej Katarakcie, a Kairem rzeka płynie wąską doliną, po czym rozlewa się w Deltę, której siedem ujść liczyli starożytni, a Izajasz zdaje się o nich pamiętać. Herodot nazwał darem rzeki ten Egipt, do którego Grecy docierali statkami."
    - "Egipt żył z wylewu: od lipca do października rzeka zalewała pola i zostawiała muł, a wysokość powodzi, odczytywana na nilometrach, zapowiadała urodzaj lub głód; sen faraona o siedmiu krowach tłustych i siedmiu chudych, wychodzących „z rzeki”, należy do tego świata. Hebrajskie słowo na Nil, jeor, zapożyczone jest z egipskiego; Biblia Króla Jakuba oddaje je po prostu jako „the river”. Biblia zna też Szichor, zwykle uważany za najbardziej wschodnie ramię Delty, oraz granicę ziemi obiecanej „od rzeki Egipskiej”, którą większość utożsamia z Wadi el-Arisz, a nie z Nilem."
    - "Faraon rozkazał: „Każdego syna, który się urodzi, w rzekę go wrzućcie”, a Mojżesza położono w plecionce z sitowia „między rogóż na brzegu rzeki”, gdzie znalazła go córka faraona. Pierwsza plaga obróciła wody rzeki w krew, tak że „ryby, które były w rzece, pozdychały”, a druga wywiodła z niej żaby. Izajasz zapowiada, że „rzeka osiąknie i wyschnie”, a rybacy będą się smucić; Jeremiasz przedstawia Egipt wzbierający: „Egipt jako rzeka wzbiera”; Ezechiel zwraca się do faraona: „wielorybie wielki, który leżysz w pośrodku rzek twoich”, i dodaje, że mówi on: „Mojać jest rzeka, i jam ją sobie uczynił”; Amos porównuje drżącą ziemię do wezbrania rzeki Egiptu; Nahum wspomina No, które „leżało między rzekami”."
    - "Nil pozostał drogą i żyłą życia Egiptu w okresie greckim, rzymskim i arabskim, a Aleksandria u jego zachodniego ujścia była jednym z największych portów świata starożytnego. Niska Tama w Asuanie z 1902 roku i Wysoka Tama, ukończona w 1970 roku, położyły kres corocznemu wylewowi i stworzyły jezioro Nasera; Wielka Tama Etiopskiego Odrodzenia na Błękitnym Nilu, budowana od 2011 roku i otwarta w 2025 roku, poróżniła Etiopię, Sudan i Egipt o wody rzeki. Dolina i Delta skupiają prawie całą ludność Egiptu, liczącą ponad sto milionów."
  cs:
    - "Nil teče asi 6 650 km od jezer východní Afriky do Středozemního moře a obvykle se počítá za nejdelší řeku světa. Bílý Nil přitéká z Viktoriina jezera, Modrý Nil z jezera Tana v Etiopii a oba se stékají v Chartúmu; právě Modrý Nil a Atbara, živené etiopskými letními dešti, přinášely každoroční rozvod. Mezi Asuánem, starověkou Syenou u prvního kataraktu, a Káhirou protéká řeka úzkým údolím a pak se rozlévá do Delty, jejíž sedm ramen starověk počítal a Izajáš je zřejmě připomíná. Hérodotos nazval darem řeky ten Egypt, kam Řekové připlouvali lodí."
    - "Egypt žil ze záplavy: od července do října řeka zakrývala pole a zanechávala bahno a výška rozvodu, čtená na nilometrech, věštila hojnost či hlad; Faraonův sen o sedmi tučných a sedmi hubených kravách vycházejících „z toho potoku“ patří do tohoto světa. Hebrejské slovo pro Nil, jeor, je přejato z egyptštiny; King James Version je překládá prostě „the river“. Bible zná také Šichor, obvykle pokládaný za nejvýchodnější rameno Delty, a „řeku Egyptskou“ na hranici zaslíbené země, kterou většina ztotožňuje spíše s Vádí el-Aríš než s Nilem."
    - "Farao nařídil každého hebrejského syna „do řeky uvrzte“ a Mojžíš byl položen do ošitky z rákosu, „vyložila do rákosí u břehu řeky“, kde ho našla Faraonova dcera. První rána proměnila vody řeky v krev: „Ryby pak, kteréž byly v řece, pomřely“, a druhá z ní vyvedla žáby. Izajáš předpovídá, že „řeka osákne a vyschne“ a rybáři budou truchlit; Jeremjáš líčí Egypt, který „jako potok se valí“; Ezechielův Farao je „draku veliký, kterýž ležíš u prostřed řek svých“ a chlubí se: „Já mám řeku svou“; Amos přirovnává chvějící se zemi k tomu, že „zatopena bývá jako potokem Egyptským“; Nachum připomíná Théby, které „sedělo mezi řekami“."
    - "Nil zůstal egyptskou cestou i mízou života v době řecké, římské i arabské a Alexandrie u jeho západního ústí byla jedním z největších přístavů starověku. Asuánská přehrada z roku 1902 a Vysoká přehrada dokončená roku 1970 ukončily každoroční záplavu a vytvořily Násirovo jezero; Velká etiopská přehrada obrody na Modrém Nilu, stavěná od roku 2011 a slavnostně otevřená roku 2025, postavila Etiopii, Súdán a Egypt proti sobě kvůli vodě řeky. Údolí a Delta soustřeďují téměř všechny z více než sta milionů obyvatel Egypta."
  nl:
    - "De Nijl stroomt zo’n 6650 km van de meren van Oost-Afrika naar de Middellandse Zee en wordt meestal gerekend als de langste rivier ter wereld. De Witte Nijl komt uit het Victoriameer, de Blauwe Nijl uit het Tanameer in Ethiopië, en beide voegen zich samen bij Khartoem; het zijn de Blauwe Nijl en de Atbara, gevoed door de Ethiopische zomerregens, die de jaarlijkse overstroming brachten. Tussen Aswan, het oude Syene bij de Eerste Cataract, en Caïro stroomt de rivier door een smalle vallei en spreidt zich dan uit in de Delta, waarvan de zeven monden door de Ouden werden geteld en die Jesaja lijkt te herinneren. Herodotus noemde het Egypte dat de Grieken per schip bereikten een geschenk van de rivier."
    - "Egypte leefde van de overstroming: van juli tot oktober bedekte de rivier de akkers en liet haar slib achter, en de hoogte van de vloed, afgelezen op nilometers, voorspelde overvloed of hongersnood; Farao’s droom van zeven vette en zeven magere koeien die “uit de rivier” opkwamen, hoort bij die wereld. Het Hebreeuwse woord voor de Nijl, ye’or, is aan het Egyptisch ontleend; de King James Version geeft het eenvoudig weer met “the river”. De Bijbel kent ook de Sichor, meestal opgevat als de oostelijkste tak van de Delta, en “de rivier van Egypte” aan de grens van het beloofde land, die de meesten met de Wadi el-Arisj en niet met de Nijl vereenzelvigen."
    - "Farao beval elke Hebreeuwse zoon “in de rivier” te werpen, en Mozes werd in een kistje van biezen gelegd “in de biezen, aan den oever der rivier”, waar de dochter van Farao hem vond. De eerste plaag veranderde het water van de rivier in bloed, zodat “de vis, die in de rivier was, stierf”, en de tweede bracht kikkers daaruit voort. Jesaja voorspelt dat “de rivier zal verzijpen en verdrogen” en de vissers treuren; Jeremia schildert Egypte dat optrekt “als een stroom”; Ezechiëls Farao is “dien groten zeedraak, die in het midden zijner rivieren ligt” en pocht: “Mijn rivier is de mijne”; Amos vergelijkt de bevende aarde met de vloed van Egypte; Nahum herinnert Thebe, “gelegen in de rivieren”."
    - "De Nijl bleef in de Griekse, Romeinse en Arabische tijd Egyptes weg en levensader, en Alexandrië bij haar westelijke monding was een van de grootste havens van de oude wereld. De Lage Dam van Aswan uit 1902 en de Hoge Dam, voltooid in 1970, maakten een einde aan de jaarlijkse overstroming en schiepen het Nassermeer; de Grote Ethiopische Renaissancedam aan de Blauwe Nijl, vanaf 2011 gebouwd en in 2025 ingehuldigd, heeft Ethiopië, Soedan en Egypte over het water van de rivier tegenover elkaar gezet. De vallei en de Delta herbergen bijna alle ruim honderd miljoen inwoners van Egypte."
