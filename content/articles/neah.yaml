# Overview article (ADR 0007). Mainstream facts only; a border point of Zebulun known from one verse; the site is unknown and the app's candidates are given without choosing.
id: neah
place: a2a77d2
title:
  en: "Neah"
  ru: "Нея"
body:
  en:
    - "Neah is a point on the border of Zebulun in Lower Galilee, named once in the description of the tribe's boundary: from Gath-hepher and Ittah-kazin it “goeth out to Remmon-methoar to Neah”, and “the border compasseth it on the north side to Hannathon”. The Hebrew can also be read “to Rimmon, and turns toward Neah”, and translations differ on how to divide the words. Nothing else is said of the place, and no later source names it."
    - "Its site is unknown. The map marks Khirbet Nimrin, west of the Sea of Galilee, where the point stands; the Beit Netofa valley north of Nazareth, through which the border is thought to run toward Hannathon; the small mound of Tell el-Wawiyat in that valley; and, as an outside possibility, the same place as Neiel on the border of Asher. Each rests on the line of the border rather than on the name, and none is proved."
  ru:
    - "Нея — точка на границе Завулона в Нижней Галилее, названная один раз при описании предела колена: от Геф-Хефера и Итты-Кацина он «идет к Риммону, Мифоару и Нее; и поворачивает предел от севера к Ханнафону». Еврейский текст можно прочесть и как «к Риммону и поворачивает к Нее», и переводы по-разному делят эти слова. Больше о месте ничего не сказано, и позднейшие источники его не называют."
    - "Местоположение неизвестно. Карта отмечает Хирбет-Нимрин к западу от Галилейского моря, где стоит точка; долину Бейт-Нетофа к северу от Назарета, через которую, как думают, предел шёл к Ханнафону; небольшой холм Телль-эль-Вавият в этой долине; и, как дальний вариант, то же место, что Неиел на границе Асира. Все они опираются на ход границы, а не на имя, и ни один не доказан."
scripture:
  - Josh.19.13-Josh.19.14
sources:
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
  - "R. G. Boling and G. E. Wright, Joshua (Anchor Bible, 1982)"
  - "A. F. Rainey and R. S. Notley, The Sacred Bridge: Carta's Atlas of the Biblical World (2006)"
