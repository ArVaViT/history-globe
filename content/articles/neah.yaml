# Overview article (ADR 0007). Mainstream facts only; a border point of Zebulun known from one verse; the site is unknown and the app's candidates are given without choosing.
id: neah
place: a2a77d2
title:
  en: "Neah"
  ru: "Нея"
  uk: "Нея"
  es: "Nea"
  pt: "Neá"
  de: "Nea"
  fr: "Néa"
body:
  en:
    - "Neah is a point on the border of Zebulun in Lower Galilee, named once in the description of the tribe's boundary: from Gath-hepher and Ittah-kazin it “goeth out to Remmon-methoar to Neah”, and “the border compasseth it on the north side to Hannathon”. The Hebrew can also be read “to Rimmon, and turns toward Neah”, and translations differ on how to divide the words. Nothing else is said of the place, and no later source names it."
    - "Its site is unknown. The map marks Khirbet Nimrin, west of the Sea of Galilee, where the point stands; the Beit Netofa valley north of Nazareth, through which the border is thought to run toward Hannathon; the small mound of Tell el-Wawiyat in that valley; and, as an outside possibility, the same place as Neiel on the border of Asher. Each rests on the line of the border rather than on the name, and none is proved."
  ru:
    - "Нея — точка на границе Завулона в Нижней Галилее, названная один раз при описании предела колена: от Геф-Хефера и Итты-Кацина он «идет к Риммону, Мифоару и Нее; и поворачивает предел от севера к Ханнафону». Еврейский текст можно прочесть и как «к Риммону и поворачивает к Нее», и переводы по-разному делят эти слова. Больше о месте ничего не сказано, и позднейшие источники его не называют."
    - "Местоположение неизвестно. Карта отмечает Хирбет-Нимрин к западу от Галилейского моря, где стоит точка; долину Бейт-Нетофа к северу от Назарета, через которую, как думают, предел шёл к Ханнафону; небольшой холм Телль-эль-Вавият в этой долине; и, как дальний вариант, то же место, что Неиел на границе Асира. Все они опираются на ход границы, а не на имя, и ни один не доказан."
  uk:
    - "Нея — це пункт на кордоні Завулона в Нижній Галілеї, названий один раз в описі межі племені: від Гат-Хефера й Ітта-Казіна вона «йде далїй на Риммон, Мітоар і Нею», і «повертає від півночі на Ханнатон». Єврейський текст можна прочитати й так: «до Риммона, і повертає до Неї», і переклади розходяться в тому, як розділяти слова. Про це місце більше нічого не сказано, і жодне пізніше джерело його не називає."
    - "Його місце невідоме. Карта позначає Хірбет-Німрін, на захід від Галілейського моря, де розташований цей пункт; долину Бейт-Нетофа на північ від Назарета, якою, як вважають, межа йде до Ханнатона; невеликий горб Телль-ель-Вавіят у цій долині; і, як віддалену можливість, те саме місце, що й Неїл на кордоні Асира. Кожне ототожнення спирається на лінію межі, а не на назву, і жодне не доведене."
  es:
    - "Nea es un punto en la frontera de Zabulón, en la Baja Galilea, nombrado una sola vez en la descripción del límite de la tribu: desde Gat-hefer e Ita-cazín «sale á Rimmón rodeando á Nea», y «torna este término al norte á Hanatón». El hebreo puede leerse también «hasta Rimón, y gira hacia Nea», y las traducciones difieren en cómo dividir las palabras. Nada más se dice del lugar, y ninguna fuente posterior lo nombra."
    - "Se desconoce su emplazamiento. El mapa señala Khirbet Nimrin, al oeste del mar de Galilea, donde se encuentra el punto; el valle de Beit Netofa, al norte de Nazaret, por donde se cree que corre la frontera hacia Hanatón; el pequeño montículo de Tell el-Wawiyat en ese valle; y, como posibilidad remota, el mismo lugar que Neiel en la frontera de Aser. Cada una se apoya en el trazado de la frontera más que en el nombre, y ninguna está probada."
  pt:
    - "Neá é um ponto na fronteira de Zebulom, na Baixa Galileia, citado uma só vez na descrição dos limites da tribo: de Gate-Hefer e Ete-Cazim ela “saía em Rimom, que se estende até Neá”, e “a fronteira contornava pelo norte até Hanatom”. O hebraico também pode ser lido “para Rimom, e vira em direção a Neá”, e as traduções divergem quanto a como dividir as palavras. Nada mais se diz do lugar, e nenhuma fonte posterior o menciona."
    - "Seu local é desconhecido. O mapa assinala Khirbet Nimrin, a oeste do Mar da Galileia, onde fica o ponto; o vale de Beit Netofa, ao norte de Nazaré, por onde se pensa que a fronteira corria em direção a Hanatom; o pequeno tell de Tell el-Wawiyat nesse vale; e, como possibilidade remota, o mesmo lugar que Neiel, na fronteira de Aser. Cada proposta se apoia no traçado da fronteira, e não no nome, e nenhuma está provada."
  de:
    - "Nea ist ein Punkt an der Grenze Sebulons in Untergaliläa, der einmal in der Beschreibung der Stammesgrenze genannt wird: Von Gat-Hefer und Et-Kazin „kommt [sie] hinaus gen Rimmon, Mithoar und Nea“, und „lenkt sich herum mitternachtwärts gen Hannathon“. Der hebräische Text lässt sich auch lesen „nach Rimmon, und wendet sich gegen Nea“, und die Übersetzungen unterscheiden sich darin, wie die Wörter zu trennen sind. Sonst wird über den Ort nichts gesagt, und keine spätere Quelle nennt ihn."
    - "Seine Lage ist unbekannt. Die Karte markiert Chirbet Nimrin westlich des Sees Genezareth, wo der Punkt liegt; das Tal von Bet Netofa nördlich von Nazareth, durch das die Grenze Richtung Hannaton verlaufen soll; den kleinen Hügel Tell el-Wawiyat in diesem Tal; und als entfernte Möglichkeit denselben Ort wie Neïel an der Grenze Assers. Jede Gleichsetzung stützt sich auf den Grenzverlauf statt auf den Namen, und keine ist bewiesen."
  fr:
    - "Néa est un point de la frontière de Zabulon, en Basse Galilée, cité une seule fois dans la description de la limite de la tribu : de Guittha-Hépher et d’Ittha-Katsin elle « continuait à Rimmon, et se prolongeait jusqu’à Néa », puis « tournait ensuite du côté du nord vers Hannathon ». L’hébreu peut aussi se lire « jusqu’à Rimmon, et tourne vers Néa », et les traductions diffèrent sur la façon de couper les mots. Rien d’autre n’est dit du lieu, et aucune source postérieure ne le nomme."
    - "Son site est inconnu. La carte marque Khirbet Nimrin, à l’ouest de la mer de Galilée, là où se trouve le point ; la vallée de Beit Netofa, au nord de Nazareth, que la frontière est censée traverser vers Hannathon ; le petit tertre de Tell el-Wawiyat dans cette vallée ; et, comme possibilité extérieure, le même lieu que Néïel sur la frontière d’Aser. Chacun repose sur le tracé de la frontière plutôt que sur le nom, et aucun n’est prouvé."
scripture:
  - Josh.19.13-Josh.19.14
sources:
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
  - "R. G. Boling and G. E. Wright, Joshua (Anchor Bible, 1982)"
  - "A. F. Rainey and R. S. Notley, The Sacred Bridge: Carta's Atlas of the Biblical World (2006)"
