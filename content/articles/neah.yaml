body:
  en:
    - "Neah is a point on the border of Zebulun in Lower Galilee, named once in the description of the tribe's boundary: from Gath-hepher and Ittah-kazin it “goeth out to Remmon-methoar to Neah”, and “the border compasseth it on the north side to Hannathon”. The Hebrew can also be read “to Rimmon, and turns toward Neah”, and translations differ on how to divide the words. Nothing else is said of the place, and no later source names it."
    - "Its site is unknown. The map marks Khirbet Nimrin, west of the Sea of Galilee, where the point stands; the Beit Netofa valley north of Nazareth, through which the border is thought to run toward Hannathon; the small mound of Tell el-Wawiyat in that valley; and, as an outside possibility, the same place as Neiel on the border of Asher. The first three rest on the line of the border, the last on the likeness of the names, and none is proved."
  ru:
    - "Нея — точка на границе Завулона в Нижней Галилее, названная один раз при описании предела колена: от Геф-Хефера и Итты-Кацина он «идет к Риммону, Мифоару и Нее; и поворачивает предел от севера к Ханнафону». Еврейский текст можно прочесть и как «к Риммону и поворачивает к Нее», и переводы по-разному делят эти слова. Больше о месте ничего не сказано, и позднейшие источники его не называют."
    - "Местоположение неизвестно. Карта отмечает Хирбет-Нимрин к западу от Галилейского моря, где стоит точка; долину Бейт-Нетофа к северу от Назарета, через которую, как думают, предел шёл к Ханнафону; небольшой холм Телль-эль-Вавият в этой долине; и, как дальний вариант, то же место, что Неиел на границе Асира. Первые три опираются на ход границы, последний — на сходство имён, и ни один не доказан."
  uk:
    - "Нея — це пункт на кордоні Завулона в Нижній Галілеї, названий один раз в описі межі племені: від Гат-Хефера й Ітта-Казіна вона «йде далїй на Риммон, Мітоар і Нею», і «повертає від півночі на Ханнатон». Єврейський текст можна прочитати й так: «до Риммона, і повертає до Неї», і переклади розходяться в тому, як розділяти слова. Про це місце більше нічого не сказано, і жодне пізніше джерело його не називає."
    - "Його місце невідоме. Карта позначає Хірбет-Німрін, на захід від Галілейського моря, де розташований цей пункт; долину Бейт-Нетофа на північ від Назарета, якою, як вважають, межа йде до Ханнатона; невеликий горб Телль-ель-Вавіят у цій долині; і, як віддалену можливість, те саме місце, що й Неїл на кордоні Асира. Перші три ототожнення спираються на лінію межі, останнє — на схожість назв, і жодне не доведене."
  es:
    - "Nea es un punto en la frontera de Zabulón, en la Baja Galilea, nombrado una sola vez en la descripción del límite de la tribu: desde Gat-hefer e Ita-cazín «sale á Rimmón rodeando á Nea», y «torna este término al norte á Hanatón». El hebreo puede leerse también «hasta Rimón, y gira hacia Nea», y las traducciones difieren en cómo dividir las palabras. Nada más se dice del lugar, y ninguna fuente posterior lo nombra."
    - "Se desconoce su emplazamiento. El mapa señala Khirbet Nimrin, al oeste del mar de Galilea, donde se encuentra el punto; el valle de Beit Netofa, al norte de Nazaret, por donde se cree que corre la frontera hacia Hanatón; el pequeño montículo de Tell el-Wawiyat en ese valle; y, como posibilidad remota, el mismo lugar que Neiel en la frontera de Aser. Las tres primeras se apoyan en el trazado de la frontera, la última en la semejanza de los nombres, y ninguna está probada."
  pt:
    - "Neá é um ponto na fronteira de Zebulom, na Baixa Galileia, citado uma só vez na descrição dos limites da tribo: de Gate-Hefer e Ete-Cazim ela “saía em Rimom, que se estende até Neá”, e “a fronteira contornava pelo norte até Hanatom”. O hebraico também pode ser lido “para Rimom, e vira em direção a Neá”, e as traduções divergem quanto a como dividir as palavras. Nada mais se diz do lugar, e nenhuma fonte posterior o menciona."
    - "Seu local é desconhecido. O mapa assinala Khirbet Nimrin, a oeste do Mar da Galileia, onde fica o ponto; o vale de Beit Netofa, ao norte de Nazaré, por onde se pensa que a fronteira corria em direção a Hanatom; o pequeno tell de Tell el-Wawiyat nesse vale; e, como possibilidade remota, o mesmo lugar que Neiel, na fronteira de Aser. As três primeiras propostas se apoiam no traçado da fronteira, a última na semelhança dos nomes, e nenhuma está provada."
  de:
    - "Nea ist ein Punkt an der Grenze Sebulons in Untergaliläa, der einmal in der Beschreibung der Stammesgrenze genannt wird: Von Gat-Hefer und Et-Kazin „kommt [sie] hinaus gen Rimmon, Mithoar und Nea“, und „lenkt sich herum mitternachtwärts gen Hannathon“. Der hebräische Text lässt sich auch lesen „nach Rimmon, und wendet sich gegen Nea“, und die Übersetzungen unterscheiden sich darin, wie die Wörter zu trennen sind. Sonst wird über den Ort nichts gesagt, und keine spätere Quelle nennt ihn."
    - "Seine Lage ist unbekannt. Die Karte markiert Chirbet Nimrin westlich des Sees Genezareth, wo der Punkt liegt; das Tal von Bet Netofa nördlich von Nazareth, durch das die Grenze Richtung Hannaton verlaufen soll; den kleinen Hügel Tell el-Wawiyat in diesem Tal; und als entfernte Möglichkeit denselben Ort wie Neïel an der Grenze Assers. Die ersten drei Gleichsetzungen stützen sich auf den Grenzverlauf, die letzte auf die Ähnlichkeit der Namen, und keine ist bewiesen."
  fr:
    - "Néa est un point de la frontière de Zabulon, en Basse Galilée, cité une seule fois dans la description de la limite de la tribu : de Guittha-Hépher et d’Ittha-Katsin elle « continuait à Rimmon, et se prolongeait jusqu’à Néa », puis « tournait ensuite du côté du nord vers Hannathon ». L’hébreu peut aussi se lire « jusqu’à Rimmon, et tourne vers Néa », et les traductions diffèrent sur la façon de couper les mots. Rien d’autre n’est dit du lieu, et aucune source postérieure ne le nomme."
    - "Son site est inconnu. La carte marque Khirbet Nimrin, à l’ouest de la mer de Galilée, là où se trouve le point ; la vallée de Beit Netofa, au nord de Nazareth, que la frontière est censée traverser vers Hannathon ; le petit tertre de Tell el-Wawiyat dans cette vallée ; et, comme possibilité extérieure, le même lieu que Néïel sur la frontière d’Aser. Les trois premiers reposent sur le tracé de la frontière, le dernier sur la ressemblance des noms, et aucun n’est prouvé."
  it:
    - "Nea è un punto sul confine di Zabulon nella Bassa Galilea, nominato una sola volta nella descrizione del confine della tribù: da Gat-Efer e da Itta-Kazin esso «continuava verso Rimmon, prolungandosi fino a Nea», e «il confine girava dal lato di settentrione verso Hannathon». L’ebraico si può leggere anche «verso Rimmon, e svolta verso Nea», e le traduzioni divergono sul modo di dividere le parole. Del luogo non si dice altro e nessuna fonte posteriore lo nomina."
    - "Il suo sito è ignoto. La mappa segna Khirbet Nimrin, a ovest del Lago di Tiberiade, dove si trova il punto; la valle di Beit Netofa a nord di Nazaret, attraverso la quale si ritiene che il confine corra verso Cannaton; il piccolo tell di Tell el-Wawiyat in quella valle; e, come possibilità remota, lo stesso luogo di Neièl sul confine di Aser. Le prime tre ipotesi poggiano sul tracciato del confine, l’ultima sulla somiglianza dei nomi, e nessuna è provata."
  pl:
    - "Nea to punkt na granicy Zabulona w Dolnej Galilei, wymieniony raz w opisie granicy pokolenia: od Gat-Chefer i Itta-Kasin „wychodzi w Rymmon, i kołem idzie do Nehy”, a „idzie także kołem taż granica od północy ku Hannaton”. Tekst hebrajski można też czytać: do Rimmon i skręca ku Nea, a przekłady różnią się co do podziału słów. O miejscu nie mówi się nic więcej i żadne późniejsze źródło go nie wymienia."
    - "Jego położenie jest nieznane. Mapa zaznacza Chirbet Nimrin, na zachód od Jeziora Galilejskiego, gdzie leży ten punkt; dolinę Bet Netofa na północ od Nazaretu, przez którą, jak się sądzi, biegnie granica ku Channaton; niewielkie wzgórze Tell el-Wawijat w tej dolinie; oraz, jako możliwość dalszą, to samo miejsce co Neiel na granicy Aszera. Pierwsze trzy z tych miejsc opierają się na przebiegu granicy, ostatnie na podobieństwie nazw, i żadne nie jest udowodnione."
  cs:
    - "Nea je bod na hranici Zebulunova pokolení v Dolní Galileji, jednou jmenovaný v popisu hranice pokolení: od Gat-chefer a Ita-kasinu „vychází do Remmon, a točí se k Nea“ a „Točí se také táž meze od půlnoci do Anaton“. Hebrejský text lze číst i „do Rimmonu a stáčí se k Nea“ a překlady se liší v tom, jak slova rozdělit. Nic jiného o místě řečeno není a žádný pozdější pramen je nejmenuje."
    - "Jeho poloha je neznámá. Mapa vyznačuje Chirbet Nimrin, západně od Galilejského jezera, kde bod stojí; údolí Bejt Netofa severně od Nazareta, jímž prý hranice vede k Chananonu; malý pahorek Tell el-Wawijat v tomto údolí; a jako vnější možnost totéž místo jako Neíel na hranici Ašera. První tři spočívají na průběhu hranice, poslední na podobnosti jmen, a žádné není prokázáno."
  nl:
    - "Nea is een punt op de grens van Zebulon in Neder-Galilea, eenmaal genoemd in de beschrijving van de stamgrens: vanaf Gat-Chefer en Eth-Kazin “en zij komt uit te Rimmon-Methoar, hetwelk is Nea”, en “deze landpale keert zich om tegen het noorden naar Hannathon”. Het Hebreeuws kan ook worden gelezen als “naar Rimmon, en buigt af naar Nea”, en vertalingen verschillen in de verdeling van de woorden. Over de plaats wordt verder niets gezegd, en geen latere bron noemt haar."
    - "De ligging is onbekend. De kaart wijst Khirbet Nimrin aan, ten westen van het Meer van Galilea, waar het punt ligt; de vallei van Beit Netofa ten noorden van Nazareth, waardoor de grens vermoedelijk naar Channaton loopt; de kleine tel Tell el-Wawiyat in die vallei; en, als verre mogelijkheid, dezelfde plaats als Neïel op de grens van Aser. De eerste drie rusten op het verloop van de grens, de laatste op de gelijkenis van de namen, en geen is bewezen."
  sv:
    - "Nea är en punkt på Sebulons gräns i Nedre Galileen, nämnd en enda gång i beskrivningen av stammens gräns: från Gat-Hefer och Et-Kasin går den ”vidare till det Rimmon som sträcker sig till Nea”, och ”Härförbi böjde sig gränsen i norr till Hannaton”. Hebreiskan kan också läsas som att gränsen går till Rimmon och svänger mot Nea, och översättningarna skiljer sig åt i hur orden delas. Ingenting mer sägs om platsen, och ingen senare källa nämner den."
    - "Dess läge är okänt. Kartan markerar Khirbet Nimrin, väster om Galileiska sjön, där punkten står; Beit Netofa-dalen norr om Nasaret, genom vilken gränsen antas löpa mot Hannaton; den lilla kullen Tell el-Wawiyat i den dalen; och, som en yttre möjlighet, samma plats som Neiel på Ashers gräns. De tre första vilar på gränsens sträckning, den sista på namnens likhet, och ingen är bevisad."
  nb:
    - "Nea er et punkt på Sebulons grense i Nedre Galilea, nevnt én gang i beskrivelsen av stammens grense: fra Gat-Hefer og Et-Kasin går den «frem til Rimmon, som strekker sig bort til Hannea», og «så svinget grensen omkring dette sted nordover til Hannaton». Den hebraiske teksten kan også leses «til Rimmon, og svinger mot Nea», og oversettelsene er uenige om hvordan ordene skal deles. Ingenting annet sies om stedet, og ingen senere kilde nevner det."
    - "Stedet er ukjent. Kartet markerer Khirbet Nimrin, vest for Galileasjøen, der punktet står; Beit Netofa-dalen nord for Nasaret, som grensen antas å løpe gjennom mot Hannaton; den lille haugen Tell el-Wawiyat i den dalen; og, som en ytre mulighet, det samme stedet som Ne'iel på Asjers grense. De tre første hviler på grenselinjen, den siste på likheten mellom navnene, og ingen er bevist."
  tl:
    - "Ang Nea ay isang punto sa hangganan ng Zabulon sa Mababang Galilea, na isang beses lamang pinangalanan sa paglalarawan ng hangganan ng lipi: mula sa Gath-hepher at Ittakazin ay “palabas sa Rimmon na luwal hanggang sa Nea”, at “ang hangganan ay paliko sa hilagaan na patungo sa Hanaton”. Maaari ring basahin ang Hebreo na “hanggang sa Rimmon, at lumiliko patungo sa Nea”, at nagkakaiba ang mga salin sa kung paano hahatiin ang mga salita. Walang ibang sinasabi tungkol sa lugar, at walang huling batis na nagpapangalan dito."
    - "Hindi alam ang kinaroroonan nito. Minamarkahan ng mapa ang Khirbet Nimrin, sa kanluran ng Dagat ng Galilea, kung saan nakalagay ang punto; ang libis ng Beit Netofa sa hilaga ng Nazaret, na inaakalang dinaraanan ng hangganan patungo sa Hanaton; ang maliit na burol ng Tell el-Wawiyat sa libis na iyon; at, bilang panlabas na posibilidad, ang kaparehong lugar ng Nehiel sa hangganan ng Aser. Ang unang tatlo ay nakasalalay sa linya ng hangganan, ang huli sa pagkakahawig ng mga pangalan, at wala ni isa man ang napatunayan."
scripture:
  - Josh.19.13-Josh.19.14
sources:
