body:
  en:
    - "Mount Sinai is the mountain where, according to Exodus, God gave Israel the Law. Where it stood is not known for certain. Since the fourth century Christian tradition has placed it at Jebel Musa, the “mountain of Moses”, 2,285 m high in the granite heart of the southern Sinai peninsula, with the monastery of St Catherine at its foot. Other candidates are Ras Safsafeh, the northern spur of the same massif above the plain of er-Raha; Jebel Serbal above the oasis of Feiran; Jebel Katherina, the highest peak of the range; Har Karkom in the Negev, proposed by Emmanuel Anati; Jebel Sin Bishar in western Sinai; and mountains in north-west Arabia, since Paul writes of “mount Sinai in Arabia”."
    - "Israel came into the wilderness of Sinai in the third month after leaving Egypt and “camped before the mount”. On the third day “mount Sinai was altogether on a smoke, because the LORD descended upon it in fire”, and God spoke the Ten Commandments. Moses was on the mountain forty days and forty nights and received “two tables of testimony, tables of stone, written with the finger of God”; he broke them when he found the people worshipping the golden calf, and went up again for a second pair; when he came down, “the skin of his face shone”. Leviticus ends with the commandments given “in mount Sinai”. Deuteronomy and the books of Kings call the same mountain Horeb."
    - "In the Song of Deborah Sinai melts “from before the LORD”, in Psalm 68 it “was moved at the presence of God”, and Nehemiah's Levites remember that God “camest down also upon mount Sinai”. Elijah fled to the same mountain under the name Horeb. In the New Testament Stephen recalls the angel “in the mount Sina”; Paul makes Hagar stand for “mount Sinai in Arabia”; and Hebrews sets “the mount that might be touched, and that burned with fire” against mount Zion. The date of the events depends on the disputed date of the exodus, in the fifteenth or the thirteenth century BC."
    - "Pilgrims were climbing Jebel Musa by the fourth century: Egeria, about 383, describes the ascent, the church on the summit and the bush that still grew beside the chapel below. Justinian built the fortified monastery at its foot in the middle of the sixth century, and its library, one of the oldest in Christendom, held the Codex Sinaiticus until the nineteenth century. The monastery with the mountain has been a UNESCO World Heritage site since 2002. No trace of the Israelite camp has been found at any of the candidate mountains; the choice between them rests on the biblical itinerary and on tradition, and remains open."
  ru:
    - "Гора Синай — гора, на которой, по книге Исход, Бог дал Израилю Закон. Где она стояла, точно не известно. С IV века христианское предание помещает её на Джебель-Муса, «гору Моисея», высотой 2285 м в гранитном сердце южной части Синайского полуострова, у подножия которой стоит монастырь Святой Екатерины. Другие кандидаты — Рас-эс-Сафсафе, северный отрог того же массива над равниной Эр-Раха; Джебель-Сербал над оазисом Фейран; гора Святой Екатерины, высшая точка хребта; Хар-Карком в Негеве, предложенный Эммануэлем Анати; Джебель-Син-Бишар на западе Синая; и горы северо-западной Аравии, поскольку Павел помещает «гору Синай в Аравии»."
    - "Израиль пришёл в пустыню Синайскую в третий месяц по выходе из Египта и «расположился там Израиль станом против горы». На третий день «гора же Синай вся дымилась оттого, что Господь сошел на нее в огне», и Бог изрёк десять заповедей. Моисей пробыл на горе сорок дней и сорок ночей и получил «две скрижали откровения, скрижали каменные, на которых написано было перстом Божиим»; он разбил их, застав народ у золотого тельца, и взошёл снова за вторыми; когда он сходил, «лице его стало сиять лучами». Книга Левит кончается заповедями, данными «на горе Синае». Второзаконие и книги Царств называют ту же гору Хоривом."
    - "В песни Деворы горы тают «от лица Господа», в 67-м псалме земля трясётся и Синай — «от лица Бога», а левиты Неемии вспоминают: «снисшел Ты на гору Синай». Илия бежал к той же горе под именем Хорив. В Новом Завете Стефан вспоминает Ангела «на горе Синае»; у Павла Агарь означает «гору Синай в Аравии»; Послание к Евреям говорит верующим, что они приступили не «к горе, осязаемой и пылающей огнем», а к горе Сион. Дата событий зависит от спорной даты исхода, в XV или XIII веке до н. э."
    - "Паломники поднимались на Джебель-Муса уже в IV веке: Эгерия около 383 г. описывает восхождение, церковь на вершине и куст, который всё ещё рос у часовни внизу. Юстиниан в середине VI века построил у подножия укреплённый монастырь, и его библиотека, одна из древнейших в христианском мире, хранила Синайский кодекс до XIX века. Монастырь вместе с горой с 2002 года входит в список Всемирного наследия ЮНЕСКО. Следов израильского стана не найдено ни у одной из гор-кандидатов; выбор между ними опирается на библейский маршрут и на предание и остаётся открытым."
  uk:
    - "Гора Синай — гора, на якій, за Книгою Виходу, Бог дав Ізраїлю Закон. Де вона стояла, достеменно не відомо. Від IV ст. християнська традиція розміщує її на Джебель-Мусі, «горі Мойсея», заввишки 2285 м у гранітному серці південного Синайського півострова, з монастирем святої Катерини біля підніжжя. Інші кандидати — Рас-Сафсафа, північний відріг того самого масиву над рівниною ер-Раха; Джебель-Сербаль над оазисом Фейран; Джебель-Катерина, найвища вершина хребта; Хар-Кархом у Негеві, запропонована Еммануелем Анаті; Джебель-Сін-Бішар у західному Синаї; і гори на північному заході Аравії, бо Павло пише про «Синай, гора в Аравиї»."
    - "Ізраїль прийшов у пустелю Синай на третій місяць після виходу з Єгипту й отаборився перед горою. Третього дня «І димувала вся Синай гора, тим що спустивсь на її Господь в поломнї», і Бог промовив Десять заповідей. Мойсей був на горі сорок днів і сорок ночей і отримав «дві таблицї сьвідчення, таблицї камяні, на котрих писав палець Божий»; він розбив їх, коли побачив народ, що поклоняється золотому тельцю, і зійшов знову по другу пару; коли він сходив, «стала сияти проміннєм кожа на лицї в його». Левіт закінчується заповідями, даними «на Синай горі». Повторення Закону і Книги Царів називають ту саму гору Хорив."
    - "У Пісні Дебори «Синай великий танув од лиця Господня», у Псалмі 68 «Тремтїла земля … сам Синай перед Богом», а левіти Неемії згадують, що Бог «зійшов ти на Синай-гору». Ілля втікав до тієї самої гори під іменем Хорив. У Новому Завіті Стефан згадує ангела «на горі Синаї»; Павло робить Агар образом «Синай, гора в Аравиї»; а Послання до євреїв протиставляє «до гори, до котрої доторкаємої і до палаючого огню» горі Сіон. Дата подій залежить від спірної дати виходу, у XV чи XIII ст. до н. е."
    - "Прочани сходили на Джебель-Мусу вже в IV ст.: Егерія близько 383 р. описує сходження, церкву на вершині й кущ, що ще ріс біля каплиці внизу. Юстиніан збудував укріплений монастир біля підніжжя в середині VI ст., і його бібліотека, одна з найстаріших у християнстві, зберігала Синайський кодекс до XIX ст. Монастир із горою є об’єктом Всесвітньої спадщини ЮНЕСКО від 2002 р. Жодного сліду ізраїльського табору не знайдено на жодній із гір-кандидатів; вибір між ними спирається на біблійний маршрут і традицію й залишається відкритим."
  es:
    - "El monte Sinaí es la montaña donde, según Éxodo, Dios dio la Ley a Israel. Dónde estaba no se sabe con certeza. Desde el siglo IV la tradición cristiana lo ha situado en el Yebel Musa, la «montaña de Moisés», de 2285 m de altura en el corazón granítico de la península sur del Sinaí, con el monasterio de Santa Catalina a su pie. Otros candidatos son Ras Safsafeh, el espolón septentrional del mismo macizo sobre la llanura de er-Raha; el Yebel Serbal, sobre el oasis de Feirán; el Yebel Katherina, el pico más alto de la cordillera; Har Karkom, en el Néguev, propuesto por Emmanuel Anati; el Yebel Sin Bishar, en el Sinaí occidental; y montañas del noroeste de Arabia, pues Pablo escribe que «Sinaí es un monte de Arabia»."
    - "Israel llegó al desierto de Sinaí en el mes tercero después de salir de Egipto y «acampó allí Israel delante del monte». Al tercer día «todo el monte de Sinaí humeaba, porque Jehová había descendido sobre él en fuego», y Dios pronunció los Diez Mandamientos. Moisés estuvo en la montaña cuarenta días y cuarenta noches y recibió «dos tablas del testimonio, tablas de piedra escritas con el dedo de Dios»; las rompió al hallar al pueblo adorando el becerro de oro, y subió de nuevo por un segundo par; cuando bajó, «la tez de su rostro resplandecía». Levítico termina con los mandamientos dados «en el monte de Sinaí». Deuteronomio y los libros de los Reyes llaman Horeb a la misma montaña."
    - "En el Cántico de Débora, el Sinaí se derrite «delante de Jehová», en el Salmo 68 «aquel Sinaí tembló delante de Dios», y los levitas de Nehemías recuerdan que Dios «sobre el monte de Sinaí descendiste». Elías huyó a la misma montaña con el nombre de Horeb. En el Nuevo Testamento Esteban recuerda al ángel «en el monte Sina»; Pablo dice de Agar: «Agar ó Sinaí es un monte de Arabia»; y Hebreos opone «al monte que se podía tocar, y al fuego encendido» al monte Sion. La fecha de los hechos depende de la fecha discutida del éxodo, en el siglo XV o en el XIII a. C."
    - "Los peregrinos subían al Yebel Musa ya en el siglo IV: Egeria, hacia 383, describe la subida, la iglesia de la cumbre y la zarza que aún crecía junto a la capilla de más abajo. Justiniano construyó el monasterio fortificado a su pie a mediados del siglo VI, y su biblioteca, una de las más antiguas de la cristiandad, guardó el Códice Sinaítico hasta el siglo XIX. El monasterio con la montaña es Patrimonio Mundial de la UNESCO desde 2002. No se ha hallado rastro del campamento israelita en ninguna de las montañas candidatas; la elección entre ellas descansa en el itinerario bíblico y en la tradición, y sigue abierta."
  pt:
    - "O monte Sinai é a montanha onde, segundo Êxodo, Deus deu a Lei a Israel. Onde ficava não se sabe com certeza. Desde o século IV a tradição cristã o situa no Jebel Musa, a “montanha de Moisés”, com 2.285 m de altura no coração granítico do sul da península do Sinai, com o mosteiro de Santa Catarina ao seu pé. Outros candidatos são Ras Safsafeh, o esporão norte do mesmo maciço acima da planície de er-Raha; Jebel Serbal, acima do oásis de Feiran; Jebel Katherina, o pico mais alto da cordilheira; Har Karkom, no Neguebe, proposto por Emmanuel Anati; Jebel Sin Bishar, no Sinai ocidental; e montanhas no noroeste da Arábia, já que Paulo escreve “o monte Sinai, na Arábia”."
    - "Israel chegou ao deserto do Sinai no terceiro mês depois de deixar o Egito e “Israel acampou diante do monte”. No terceiro dia “Todo o monte Sinai fumegava, porque o SENHOR desceu sobre ele em fogo”, e Deus falou os Dez Mandamentos. Moisés esteve na montanha quarenta dias e quarenta noites e recebeu “as duas tábuas da aliança, tábuas de pedra, escritas com o dedo de Deus”; quebrou-as ao achar o povo adorando o bezerro de ouro, e subiu de novo por um segundo par; ao descer, “a pele do seu rosto resplandecia”. Levítico termina com os mandamentos dados “no monte Sinai”. Deuteronômio e os livros dos Reis chamam a mesma montanha Horebe."
    - "No Cântico de Débora o Sinai treme “diante da presença do SENHOR”, no Salmo 68 a terra treme “na presença do Deus do Sinai”, e os levitas de Neemias dizem a Deus: “Tu também desceste sobre o Monte Sinai”. Elias fugiu para a mesma montanha sob o nome Horebe. No Novo Testamento Estêvão recorda o anjo “no monte Sinai”; Paulo faz Agar representar “o monte Sinai, na Arábia”; e Hebreus opõe “um monte que pudesse ser tocado e que ardia em fogo” ao monte Sião. A data dos acontecimentos depende da data disputada do êxodo, no século XV ou no XIII a.C."
    - "Peregrinos subiam o Jebel Musa já no século IV: Egéria, por volta de 383, descreve a subida, a igreja no cume e a sarça que ainda crescia junto à capela abaixo. Justiniano construiu o mosteiro fortificado ao seu pé em meados do século VI, e sua biblioteca, uma das mais antigas da cristandade, guardou o Códice Sinaítico até o século XIX. O mosteiro com a montanha é Patrimônio Mundial da UNESCO desde 2002. Nenhum vestígio do acampamento israelita foi achado em qualquer das montanhas candidatas; a escolha entre elas repousa no itinerário bíblico e na tradição, e permanece em aberto."
  de:
    - "Der Berg Sinai ist der Berg, auf dem Gott nach 2. Mose Israel das Gesetz gab. Wo er stand, ist nicht sicher bekannt. Seit dem 4. Jahrhundert setzt die christliche Überlieferung ihn am Jebel Musa an, dem „Berg des Mose“, 2285 m hoch im Granitherzen der südlichen Sinai-Halbinsel, mit dem Katharinenkloster an seinem Fuß. Weitere Kandidaten sind Ras Safsafeh, der nördliche Ausläufer desselben Massivs über der Ebene von er-Raha; der Jebel Serbal über der Oase Feiran; der Jebel Katherina, der höchste Gipfel des Gebirges; Har Karkom im Negev, von Emmanuel Anati vorgeschlagen; der Jebel Sin Bishar im westlichen Sinai; und Berge im nordwestlichen Arabien, da Paulus schreibt, Hagar „heißt in Arabien der Berg Sinai“."
    - "Israel kam im dritten Monat nach dem Auszug aus Ägypten in die Wüste Sinai und lagerte sich dort „gegenüber dem Berge“. Am dritten Tag, heißt es: „Der ganze Berg Sinai aber rauchte, darum daß der HERR herab auf den Berg fuhr mit Feuer“, und Gott sprach die Zehn Gebote. Mose war vierzig Tage und vierzig Nächte auf dem Berg und empfing „zwei Tafeln des Zeugnisses; die waren beschrieben mit dem Finger Gottes“; er zerbrach sie, als er das Volk beim goldenen Kalb fand, und stieg für ein zweites Paar wieder hinauf; als er herabkam, wusste er nicht, „daß die Haut seines Angesichts glänzte“. Das 3. Buch Mose endet mit den Geboten, gegeben „auf dem Berge Sinai“. Das 5. Buch Mose und die Königsbücher nennen denselben Berg Horeb."
    - "Im Lied der Debora heißt es: „Die Berge ergossen sich vor dem HERRN, der Sinai vor dem HERRN“, in Psalm 68 „bebte die Erde, und die Himmel troffen vor Gott, dieser Sinai vor dem Gott, der Israels Gott ist“, und Nehemias Leviten erinnern, dass Gott „herabgestiegen auf den Berg Sinai“ ist. Elia floh unter dem Namen Horeb zu demselben Berg. Im Neuen Testament spricht Stephanus von dem Engel des HERRN „an dem Berge Sinai“; Paulus lässt Hagar für den Berg Sinai in Arabien stehen; und der Hebräerbrief stellt „den Berg, den man anrühren konnte und der mit Feuer brannte“, dem Berg Zion gegenüber. Die Datierung der Ereignisse hängt vom umstrittenen Datum des Auszugs ab, im 15. oder im 13. Jahrhundert v. Chr."
    - "Pilger bestiegen den Jebel Musa schon im 4. Jahrhundert: Egeria beschreibt um 383 den Aufstieg, die Kirche auf dem Gipfel und den Busch, der noch neben der Kapelle weiter unten wuchs. Justinian baute Mitte des 6. Jahrhunderts das befestigte Kloster an seinem Fuß, und seine Bibliothek, eine der ältesten der Christenheit, besaß bis ins 19. Jahrhundert den Codex Sinaiticus. Das Kloster mit dem Berg ist seit 2002 UNESCO-Welterbe. Von keinem der Kandidatenberge ist eine Spur des israelitischen Lagers gefunden worden; die Wahl zwischen ihnen beruht auf der biblischen Reisebeschreibung und auf der Überlieferung und bleibt offen."
  fr:
    - "Le mont Sinaï est la montagne où, selon l’Exode, Dieu donna la Loi à Israël. On ne sait pas avec certitude où il se dressait. Depuis le IVe siècle, la tradition chrétienne le place au djebel Moussa, la « montagne de Moïse », haute de 2 285 m au cœur granitique du sud de la péninsule du Sinaï, avec le monastère Sainte-Catherine à son pied. Les autres candidats sont Ras Safsafeh, l’éperon nord du même massif au-dessus de la plaine d’er-Raha ; le djebel Serbal au-dessus de l’oasis de Feiran ; le djebel Katarina, le plus haut sommet de la chaîne ; Har Karkom dans le Négev, proposé par Emmanuel Anati ; le djebel Sin Bishar dans l’ouest du Sinaï ; et des montagnes du nord-ouest de l’Arabie, puisque Paul écrit « le mont Sinaï en Arabie »."
    - "Israël arriva au désert de Sinaï le troisième mois après sa sortie d’Égypte, et « campa là, vis-à-vis de la montagne ». Le troisième jour, « la montagne de Sinaï était toute en fumée, parce que l’Éternel y était descendu au milieu du feu », et Dieu prononça les Dix Commandements. Moïse resta sur la montagne quarante jours et quarante nuits et reçut « les deux tables du témoignage, tables de pierre, écrites du doigt de Dieu » ; il les brisa en trouvant le peuple adorant le veau d’or, et remonta pour une seconde paire ; quand il redescendit, « la peau de son visage rayonnait ». Le Lévitique s’achève sur les commandements donnés « sur la montagne de Sinaï ». Le Deutéronome et les livres des Rois appellent la même montagne Horeb."
    - "Dans le Cantique de Débora, les montagnes s’ébranlent « devant l’Éternel », au Psaume 68 le Sinaï « s’ébranla devant Dieu », et les lévites de Néhémie rappellent à Dieu : « Tu descendis sur la montagne de Sinaï ». Élie s’enfuit vers la même montagne sous le nom d’Horeb. Dans le Nouveau Testament, Étienne rappelle l’ange « sur la montagne de Sinaï » ; Paul fait d’Agar la figure du « mont Sinaï en Arabie » ; et l’épître aux Hébreux oppose « une montagne qu’on pouvait toucher et qui était embrasée par le feu » à la montagne de Sion. La date des événements dépend de la date discutée de l’exode, au XVe ou au XIIIe siècle av. J.-C."
    - "Des pèlerins gravissaient le djebel Moussa dès le IVe siècle : Égérie, vers 383, décrit la montée, l’église du sommet et le buisson qui poussait encore à côté de la chapelle en contrebas. Justinien bâtit le monastère fortifié à son pied au milieu du VIe siècle, et sa bibliothèque, l’une des plus anciennes de la chrétienté, conserva le Codex Sinaiticus jusqu’au XIXe siècle. Le monastère avec la montagne est inscrit par l’UNESCO au patrimoine mondial depuis 2002. Aucune trace du camp israélite n’a été trouvée sur aucune des montagnes candidates ; le choix entre elles repose sur l’itinéraire biblique et la tradition, et reste ouvert."
  it:
    - "Il Monte Sinai è il monte dove, secondo l’Esodo, Dio diede a Israele la Legge. Dove sorgesse non è noto con certezza. Dal IV secolo la tradizione cristiana lo pone al Jebel Musa, il «monte di Mosè», alto 2285 m nel cuore granitico della penisola del Sinai meridionale, con il monastero di Santa Caterina ai piedi. Altri candidati sono Ras Safsafeh, lo sperone settentrionale dello stesso massiccio sopra la pianura di er-Raha; il Jebel Serbal sopra l’oasi di Feiran; il Jebel Katherina, la vetta più alta della catena; Har Karkom nel Negheb, proposto da Emmanuel Anati; il Jebel Sin Bishar nel Sinai occidentale; e monti dell’Arabia nord-occidentale, poiché Paolo scrive del «monte Sinai in Arabia»."
    - "Israele giunse al deserto del Sinai il terzo mese dopo aver lasciato l’Egitto, e «quivi si accampò Israele, dirimpetto al monte». Il terzo giorno «il monte Sinai era tutto fumante, perché l’Eterno v’era disceso in mezzo al fuoco», e Dio pronunciò i Dieci Comandamenti. Mosè rimase sul monte quaranta giorni e quaranta notti e ricevette «le due tavole della testimonianza, tavole di pietra, scritte col dito di Dio»; le spezzò quando trovò il popolo ad adorare il vitello d’oro, e salì di nuovo per un secondo paio; quando scese, «la pelle del suo viso era diventata tutta raggiante». Il Levitico termina con i comandamenti dati «sul monte Sinai». Il Deuteronomio e i libri dei Re chiamano lo stesso monte Oreb."
    - "Nel Cantico di Debora «anche il Sinai, là, fu scosso dinanzi all’Eterno», nel Salmo 68 «lo stesso Sinai tremò alla presenza di Dio», e i leviti di Neemia dicono a Dio: «E scendesti sul monte Sinai». Elia fuggì allo stesso monte con il nome di Oreb. Nel Nuovo Testamento Stefano ricorda l’angelo «nel deserto del monte Sinai»; Paolo fa rappresentare ad Agar «il monte Sinai in Arabia»; e gli Ebrei contrappongono «al monte che si toccava con la mano, avvolto nel fuoco» il monte Sion. La data degli eventi dipende dalla data discussa dell’esodo, nel XV o nel XIII secolo a.C."
    - "I pellegrini salivano il Jebel Musa già nel IV secolo: Egeria, verso il 383, descrive la salita, la chiesa sulla cima e il roveto che cresceva ancora accanto alla cappella più in basso. Giustiniano costruì il monastero fortificato ai suoi piedi a metà del VI secolo, e la sua biblioteca, una delle più antiche della cristianità, ospitò il Codex Sinaiticus fino all’Ottocento. Il monastero con il monte è patrimonio mondiale UNESCO dal 2002. Nessuna traccia dell’accampamento israelita è stata trovata in alcuno dei monti candidati; la scelta tra essi poggia sull’itinerario biblico e sulla tradizione, e resta aperta."
  pl:
    - "Góra Synaj to góra, na której według Księgi Wyjścia Bóg dał Izraelowi Prawo. Gdzie stała, nie wiadomo z pewnością. Od IV w. tradycja chrześcijańska umieszcza ją w Dżabal Musa, „górze Mojżesza”, o wysokości 2285 m w granitowym sercu południowego półwyspu Synaj, z klasztorem św. Katarzyny u stóp. Inni kandydaci to Ras Safsafeh, północna ostroga tego samego masywu nad równiną er-Raha; Dżabal Serbal nad oazą Feiran; Dżabal Katarzyny, najwyższy szczyt pasma; Har Karkom w Negewie, zaproponowany przez Emmanuela Anatiego; Dżabal Sin Bishar w zachodnim Synaju; oraz góry w północno-zachodniej Arabii, ponieważ Paweł mówi o górze Synaj „w Arabii”."
    - "Izrael przyszedł na pustynię Synaj w trzecim miesiącu po wyjściu z Egiptu i rozbił namioty „przeciw górze”. Trzeciego dnia „góra Synaj kurzyła się wszystka, przeto, iż zstąpił na nią Pan w ogniu”, a Bóg wypowiedział Dziesięć Przykazań. Mojżesz był na górze czterdzieści dni i czterdzieści nocy i otrzymał „dwie tablice świadectwa, tablice kamienne, pisane palcem Bożym”; rozbił je, gdy zastał lud oddający cześć złotemu cielcowi, i wstąpił ponownie po drugą parę; gdy zszedł, nie wiedział, „iżby się lśniła skóra twarzy jego”. Księga Kapłańska kończy się przykazaniami danymi „na górze Synaj”. Księga Powtórzonego Prawa i Księgi Królewskie nazywają tę samą górę Horeb."
    - "W Pieśni Debory Synaj topnieje „od oblicza Pańskiego”, w Psalmie 68 „ta góra Synaj drżała przed twarzą Boga”, a lewici Nehemiasza wspominają, że Bóg „na górę Synaj zstąpił”. Eliasz uciekł na tę samą górę pod nazwą Horeb. W Nowym Testamencie Szczepan wspomina anioła „na puszczy góry Synaj”; u Pawła Hagar oznacza górę Synaj w Arabii; a List do Hebrajczyków mówi, że wierzący nie przystąpili „do góry, która się da dotknąć, i do ognia gorejącego”, lecz do góry Syjon. Data wydarzeń zależy od spornej daty wyjścia, w XV lub XIII w. p.n.e."
    - "Pielgrzymi wspinali się na Dżabal Musa już w IV w.: Egeria, około 383 r., opisuje wejście, kościół na szczycie i krzew, który wciąż rósł obok kaplicy poniżej. Justynian zbudował obwarowany klasztor u jej stóp w połowie VI w., a jego biblioteka, jedna z najstarszych w chrześcijaństwie, przechowywała Kodeks Synajski do XIX w. Klasztor wraz z górą jest wpisany na listę światowego dziedzictwa UNESCO od 2002 r. Śladu obozu Izraelitów nie znaleziono na żadnej z kandydujących gór; wybór między nimi opiera się na biblijnym itinerarium i tradycji i pozostaje otwarty."
  nl:
    - "De Sinaï is de berg waar God volgens Exodus Israël de Wet gaf. Waar hij stond, is niet met zekerheid bekend. Sinds de vierde eeuw plaatst de christelijke overlevering hem bij de Jebel Musa, de “berg van Mozes”, 2.285 m hoog in het granieten hart van het zuidelijke schiereiland Sinaï, met het Katharinaklooster aan zijn voet. Andere kandidaten zijn Ras Safsafeh, de noordelijke uitloper van hetzelfde massief boven de vlakte van er-Raha; de Jebel Serbal boven de oase Feiran; de Jebel Katherina, de hoogste piek van het gebergte; Har Karkom in de Negev, voorgesteld door Emmanuel Anati; de Jebel Sin Bishar in het westen van de Sinaï; en bergen in het noordwesten van Arabië, aangezien Paulus schrijft over “Sina, een berg in Arabië”."
    - "Israël kwam in de derde maand na het verlaten van Egypte in de woestijn van Sinaï en “legerde zich aldaar tegenover dien berg”. Op de derde dag “rookte de ganse berg Sinai, omdat de HEERE op denzelven nederkwam in vuur”, en God sprak de Tien Geboden. Mozes was veertig dagen en nachten op de berg en ontving “de twee tafelen der getuigenis, tafelen van steen, beschreven met den vinger Gods”; hij brak ze toen hij het volk het gouden kalf zag aanbidden, en ging opnieuw omhoog voor een tweede paar; toen hij afdaalde, bleek dat “het vel zijns aangezichts glinsterde”. Leviticus eindigt met de geboden gegeven “op den berg Sinai”. Deuteronomium en de boeken Koningen noemen dezelfde berg Horeb."
    - "In het Lied van Debora smelt Sinaï “van het aangezicht des HEEREN”, in Psalm 68 beeft hij “voor het aanschijn Gods, des Gods van Israel”, en Nehemia's Levieten herinneren zich: “Gij zijt neergedaald op den berg Sinai”. Elia vluchtte naar dezelfde berg onder de naam Horeb. In het Nieuwe Testament herinnert Stefanus aan de engel “in de woestijn van den berg Sinai”; Paulus laat Hagar staan voor “Sina, een berg in Arabië”; en Hebreeën zet “den tastelijken berg, en het brandende vuur” tegenover de berg Sion. De datering van de gebeurtenissen hangt af van de omstreden datum van de uittocht, in de vijftiende of dertiende eeuw v.Chr."
    - "Pelgrims beklommen de Jebel Musa al in de vierde eeuw: Egeria, omstreeks 383, beschrijft de klim, de kerk op de top en de braamstruik die nog naast de kapel beneden groeide. Justinianus bouwde het versterkte klooster aan zijn voet in het midden van de zesde eeuw, en zijn bibliotheek, een van de oudste in de christenheid, bewaarde de Codex Sinaiticus tot de negentiende eeuw. Het klooster met de berg is sinds 2002 UNESCO-werelderfgoed. Van het Israëlitische kamp is bij geen van de kandidaat-bergen een spoor gevonden; de keuze tussen hen berust op de bijbelse reisroute en op de overlevering, en blijft open."
  cs:
    - "Hora Sinaj je hora, na níž podle Exodu dal Bůh Izraeli Zákon. Kde stála, není jisté. Od 4. století ji křesťanská tradice klade na Jebel Musa, „horu Mojžíšovu“, vysokou 2285 m v žulovém srdci jižního Sinajského poloostrova, s klášterem svaté Kateřiny u úpatí. Jinými kandidáty jsou Ras Safsafeh, severní výběžek téhož masivu nad pláni er-Raha; Jebel Serbal nad oázou Feiran; Jebel Katherina, nejvyšší vrchol pohoří; Har Karkom v Negevu, který navrhl Emmanuel Anati; Jebel Sin Bishar v západním Sinaji; a hory v severozápadní Arábii, protože Pavel píše: „Agar zajisté jest hora Sinai v Arabii“."
    - "Izrael přišel na poušť Sinaj třetího měsíce po odchodu z Egypta a „rozbili Izraelští stany naproti hoře“. Třetího dne „Hora pak Sinai všecka se kouřila, proto že sstoupil na ni Hospodin v ohni“ a Bůh pronesl Desatero. Mojžíš byl na hoře čtyřicet dní a čtyřicet nocí a přijal „dvě dsky svědectví, dsky kamenné, psané prstem Božím“; rozbil je, když našel lid klanějící se zlatému teleti, a vystoupil znovu pro druhý pár; když sestoupil, nevěděl, „že by se stkvěla kůže tváři jeho“. Leviticus končí přikázáními daným „na hoře Sinai“. Deuteronomium a Knihy králů nazývají tutéž horu Choreb."
    - "V Debořině písni „Hory se rozplynuly od tváři Hospodinovy, i ta hora Sinai třásla se před tváří Hospodina Boha Izraelského“, Žalm 68 praví o Sinaji: „i ta hora Sinai před přítomností Boží“ a Nehemjášovi levité se obracejí k Bohu: „Potom jsi sstoupil na horu Sinai“. Elijáš utekl na tutéž horu pod jménem Choreb. V Novém zákoně Štěpán připomíná anděla, „kterýž mluvíval k němu na hoře Sinai“; Pavel činí Hagar obrazem hory Sinaj v Arábii; a List Židům praví, že nepřistoupili „k hmotné hoře a k hořícímu ohni“, nýbrž k hoře Sijón. Datování událostí závisí na sporném datu exodu, v 15. nebo 13. století př. n. l."
    - "Poutníci vystupovali na Jebel Musa už ve 4. století: Egerie, kolem roku 383, popisuje výstup, kostel na vrcholu a keř, který dosud rostl vedle kaple pod ním. Justinianus postavil opevněný klášter u úpatí v polovině 6. století a jeho knihovna, jedna z nejstarších v křesťanstvu, uchovávala Codex Sinaiticus do 19. století. Klášter s horou je od roku 2002 památkou světového dědictví UNESCO. Na žádné z kandidátských hor nebyla nalezena stopa izraelského tábora; volba mezi nimi spočívá na biblickém itineráři a tradici a zůstává otevřená."
  sv:
    - "Sinaiberget är berget där Gud enligt Andra Mosebok gav Israel lagen. Var det låg vet man inte säkert. Sedan 300-talet har den kristna traditionen placerat det vid Jebel Musa, ”Moses berg”, 2 285 m högt i den södra Sinaihalvöns granitkärna, med Sankta Katarinas kloster vid foten. Andra kandidater är Ras Safsafeh, den norra utlöparen av samma bergsmassiv ovanför slätten er-Raha; Jebel Serbal ovanför oasen Feiran; Jebel Katherina, bergskedjans högsta topp; Har Karkom i Negev, föreslaget av Emmanuel Anati; Jebel Sin Bishar i västra Sinai samt berg i nordvästra Arabien, eftersom Paulus talar om ”berget Sina” i Arabien."
    - "Israel kom i den tredje månaden efter uttåget ur Egypten in i Sinais öken och ”lägrade sig där mitt emot berget”. På tredje dagen var det så att ”hela Sinai berg höljdes i rök, vid det att HERREN kom ned därpå i eld”, och Gud talade de tio budorden. Mose var på berget i fyrtio dagar och fyrtio nätter och fick ”vittnesbördets två tavlor, tavlor av sten, på vilka Gud hade skrivit med sitt finger”; han slog sönder dem när han fann folket dyrka guldkalven och steg upp igen för att få ett andra par; när han kom ned visste han ”icke att hans ansiktes hy hade blivit strålande”. Tredje Mosebok slutar med de bud som gavs ”på Sinai berg”. Femte Mosebok och Konungaböckerna kallar samma berg Horeb."
    - "I Deborasången skälver Sinai ”inför HERRENS ansikte”, i Psaltaren 68 heter det att Sinai ”bävade för Guds ansikte”, och Nehemjas leviter minns att Gud ”steg ned på berget Sinai”. Elia flydde till samma berg under namnet Horeb. I Nya testamentet minns Stefanos ängeln ”på berget Sinai”; Paulus låter Hagar stå för ”berget Sina” i Arabien; och Hebreerbrevet ställer ”ett berg som man kan taga på, ett som ’brann i eld’” mot berget Sion. Tidpunkten för händelserna beror på den omstridda dateringen av uttåget, på 1400-talet eller 1200-talet f.Kr."
    - "Pilgrimer besteg Jebel Musa redan på 300-talet: Egeria beskriver omkring 383 uppstigningen, kyrkan på toppen och busken som ännu växte invid kapellet nedanför. Justinianus lät bygga det befästa klostret vid foten vid mitten av 500-talet, och dess bibliotek, ett av kristenhetens äldsta, innehöll Codex Sinaiticus till 1800-talet. Klostret tillsammans med berget är sedan 2002 klassat som världsarv av Unesco. Inga spår av det israelitiska lägret har hittats vid något av kandidatbergen; valet mellan dem vilar på den bibliska färdvägen och på traditionen och förblir öppet."
  nb:
    - "Sinai er fjellet der Gud ifølge 2. Mosebok ga Israel loven. Hvor det lå, er ikke kjent med sikkerhet. Siden 300-tallet har den kristne tradisjonen plassert det ved Jebel Musa, «Moses' fjell», 2285 m høyt i granittkjernen på den sørlige Sinai-halvøya, med Sankt Katarina-klosteret ved foten. Andre kandidater er Ras Safsafeh, den nordlige utløperen av det samme massivet over sletten er-Raha; Jebel Serbal over oasen Feiran; Jebel Katherina, den høyeste toppen i fjellkjeden; Har Karkom i Negev, foreslått av Emmanuel Anati; Jebel Sin Bishar i det vestlige Sinai; og fjell i nordvestlige Arabia, siden Paulus skriver om «berget Sinai i Arabia»."
    - "Israel kom til Sinai ørken i den tredje måneden etter utferden fra Egypt og «leiret sig der midt imot fjellet». På den tredje dagen heter det at «hele Sinai berg stod i røk, fordi Herren var steget ned på det i ild», og Gud talte de ti bud. Moses var på fjellet i førti dager og førti netter og mottok «vidnesbyrdets to tavler, tavler av sten, skrevet med Guds finger»; han knuste dem da han fant folket i dans om gullkalven, og gikk opp igjen for å hente et nytt par; da han kom ned, het det at «hans ansikts hud skinte». 3. Mosebok slutter med budene som ble gitt «på Sinai berg». 5. Mosebok og Kongebøkene kaller det samme fjellet Horeb."
    - "I Deboras sang skjelver Sinai «for Herrens åsyn», i Salme 68 bevet det «for Guds åsyn», og Nehemjas levitter minnes at Gud «steg ned på Sinai berg». Elia flyktet til det samme fjellet under navnet Horeb. I Det nye testamente minner Stefanus om engelen «på Sinai berg»; Paulus lar Hagar stå for «berget Sinai i Arabia»; og Hebreerbrevet stiller «et fjell som en kan ta på med hender, og til brennende ild» opp mot Sions fjell. Tidspunktet for hendelsene avhenger av den omstridte dateringen av utferden, på 1400-tallet eller 1200-tallet f.Kr."
    - "Pilegrimer besteg Jebel Musa allerede på 300-tallet: Egeria, omkring 383, beskriver oppstigningen, kirken på toppen og tornebusken som fortsatt vokste ved kapellet nedenfor. Justinian lot bygge det befestede klosteret ved foten midt på 500-tallet, og biblioteket, et av de eldste i kristenheten, hadde Codex Sinaiticus helt til 1800-tallet. Klosteret sammen med fjellet har stått på UNESCOs verdensarvliste siden 2002. Det er ikke funnet spor av den israelittiske leiren på noen av kandidatfjellene; valget mellom dem hviler på den bibelske ferdaruten og på tradisjonen, og står fortsatt åpent."
