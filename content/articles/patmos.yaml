body:
  en:
    - "Patmos is a small, rocky island of about 34 square kilometres in the south-eastern Aegean, south of Samos and west of the coast of Asia Minor, among the islands now called the Dodecanese. Ancient writers rarely mention it. Thucydides tells that in 427 BC the Athenian commander Paches chased a Peloponnesian fleet as far as Patmos and then turned back, and Strabo places Patmos and the nearby Corassiae to the west of Icaria."
    - 'Patmos is named once in the Bible. At the opening of Revelation the seer writes: "I John, who also am your brother, and companion in tribulation, and in the kingdom and patience of Jesus Christ, was in the isle that is called Patmos, for the word of God, and for the testimony of Jesus Christ." There, "in the Spirit on the Lord''s day", he heard a voice telling him to write what he saw and send it to the seven churches of Asia, from Ephesus to Laodicea.'
    - "Early Christian writers took John's stay as banishment. Irenaeus says that the vision was seen toward the end of Domitian's reign, usually taken as about AD 95, and Eusebius says that John was condemned to live on Patmos in Domitian's persecution and returned to Ephesus when, under Nerva, those whom Domitian had banished were allowed home; Clement of Alexandria also tells of John's return from Patmos to Ephesus after the tyrant's death. Most scholars accept a date under Domitian, while some place Revelation in the years after Nero. Island exile was a common Roman penalty: Eusebius records that Flavia Domitilla, a niece of the consul Flavius Clemens, was banished to Pontia for her witness to Christ."
  ru:
    - "Патмос — небольшой скалистый остров площадью около 34 квадратных километров на юго-востоке Эгейского моря, к югу от Самоса и к западу от побережья Малой Азии, среди островов, которые ныне называют Додеканесом. Древние писатели упоминают его редко. Фукидид рассказывает, что в 427 г. до н. э. афинский военачальник Пахет преследовал пелопоннесский флот до самого Патмоса и затем повернул назад, а Страбон помещает Патмос и соседние Корассии к западу от Икарии."
    - "В Библии Патмос назван один раз. В начале Откровения тайнозритель пишет: «Я, Иоанн, брат ваш и соучастник в скорби и в царствии и в терпении Иисуса Христа, был на острове, называемом Патмос, за слово Божие и за свидетельство Иисуса Христа». Там, «в духе в день воскресный», он услышал голос, повелевший ему написать то, что он видит, и послать семи церквам в Асии, от Ефеса до Лаодикии."
    - "Раннехристианские писатели считали пребывание Иоанна на острове ссылкой. Ириней говорит, что видение было в конце правления Домициана, что обычно понимают как около 95 г. н. э., а Евсевий — что Иоанн во время гонения при Домициане был осуждён жить на Патмосе и вернулся в Ефес, когда при Нерве изгнанным Домицианом позволили вернуться; Климент Александрийский тоже рассказывает о возвращении Иоанна с Патмоса в Ефес после смерти тирана. Большинство учёных принимает датировку временем Домициана, а некоторые относят Откровение к годам после Нерона. Ссылка на остров была обычным римским наказанием: Евсевий сообщает, что Флавия Домицилла, племянница консула Флавия Климента, была сослана на Понтию за свидетельство о Христе."
  uk:
    - "Патмос — невеликий скелястий острів площею близько 34 квадратних кілометрів у південно-східній частині Егейського моря, на південь від Самоса й на захід від узбережжя Малої Азії, серед островів, які нині називають Додеканесом. Античні автори згадують його рідко. Фукідід розповідає, що 427 р. до н. е. афінський полководець Пахет гнав пелопоннеський флот аж до Патмоса, а потім повернув назад, а Страбон ставить Патмос і сусідні Корасії на захід від Ікарії."
    - "У Біблії Патмос названий один раз. На початку Одкровення провидець пише: «Я Йоан, і брат вам, і спільник у горю і в царстві і в терпінню Ісуса Христа, був на острові, званім Патмос, за слово Боже, і за сьвідкуваннє Ісуса Христа». Там, «в дусї в день Господень», він почув голос, що велів записати побачене й послати до семи церков Азії, від Ефеса до Лаодікеї."
    - "Ранньохристиянські автори вважали перебування Івана засланням. Іриней каже, що видіння було побачене наприкінці правління Доміціана, що зазвичай відносять до близько 95 р. н. е., а Євсевій каже, що Івана було засуджено жити на Патмосі під час гоніння Доміціана і що він повернувся до Ефеса, коли за Нерви тим, кого Доміціан вигнав, дозволили вернутися додому; Климент Александрійський також розповідає про повернення Івана з Патмоса до Ефеса після смерті тирана. Більшість учених приймають датування за Доміціана, дехто відносить Одкровення до років після Нерона. Острівне заслання було звичайним римським покаранням: Євсевій записує, що Флавію Домітіллу, племінницю консула Флавія Климента, було заслано на Понтію за свідчення про Христа."
  es:
    - "Patmos es una pequeña isla rocosa de unos 34 kilómetros cuadrados en el sureste del Egeo, al sur de Samos y al oeste de la costa de Asia Menor, entre las islas hoy llamadas Dodecaneso. Los escritores antiguos la mencionan rara vez. Tucídides cuenta que en 427 a. C. el comandante ateniense Paques persiguió una flota del Peloponeso hasta Patmos y luego dio la vuelta, y Estrabón sitúa Patmos y las cercanas Corasias al oeste de Icaria."
    - "Patmos se nombra una vez en la Biblia. Al comienzo del Apocalipsis el vidente escribe: «Yo Juan, vuestro hermano, y participante en la tribulación y en el reino, y en la paciencia de Jesucristo, estaba en la isla que es llamada Patmos, por la palabra de Dios y el testimonio de Jesucristo». Allí, «en el Espíritu en el día del Señor», oyó una voz que le mandaba escribir lo que veía y enviarlo a las siete iglesias de Asia, desde Éfeso hasta Laodicea."
    - "Los escritores cristianos antiguos tomaron la estancia de Juan como destierro. Ireneo dice que la visión se vio hacia el final del reinado de Domiciano, por lo común tomado como hacia el 95 d. C., y Eusebio dice que Juan fue condenado a vivir en Patmos en la persecución de Domiciano y volvió a Éfeso cuando, bajo Nerva, se permitió regresar a los que Domiciano había desterrado; Clemente de Alejandría cuenta también el regreso de Juan de Patmos a Éfeso tras la muerte del tirano. La mayoría de los estudiosos acepta una fecha bajo Domiciano, mientras que algunos sitúan el Apocalipsis en los años posteriores a Nerón. El destierro a una isla era una pena romana común: Eusebio registra que Flavia Domitila, sobrina del cónsul Flavio Clemente, fue desterrada a Pontia por su testimonio de Cristo."
  pt:
    - "Patmos é uma pequena ilha rochosa de cerca de 34 quilômetros quadrados no sudeste do Egeu, ao sul de Samos e a oeste da costa da Ásia Menor, entre as ilhas hoje chamadas Dodecaneso. Os autores antigos raramente a mencionam. Tucídides conta que em 427 a.C. o comandante ateniense Paques perseguiu uma frota peloponésia até Patmos e depois deu meia-volta, e Estrabão situa Patmos e as vizinhas Corásias a oeste de Icária."
    - "Patmos é citada uma só vez na Bíblia. No início do Apocalipse, o vidente escreve: “Eu, João, irmão e companheiro de vocês na tribulação, no Reino e na perseverança em Cristo Jesus, estava na ilha chamada Patmos por causa da Palavra de Deus e do testemunho de Jesus Cristo.” Ali, “no Espírito no dia do Senhor”, ouviu uma voz que lhe mandava escrever o que via e enviar às sete igrejas da Ásia, de Éfeso a Laodiceia."
    - "Os primeiros autores cristãos tomaram a estada de João por banimento. Ireneu diz que a visão foi vista perto do fim do reinado de Domiciano, geralmente tomado como cerca de 95 d.C., e Eusébio diz que João foi condenado a viver em Patmos na perseguição de Domiciano e voltou a Éfeso quando, sob Nerva, os que Domiciano havia banido puderam voltar para casa; Clemente de Alexandria também conta o regresso de João de Patmos a Éfeso depois da morte do tirano. A maioria dos estudiosos aceita uma data sob Domiciano, enquanto alguns situam o Apocalipse nos anos depois de Nero. O exílio em ilha era uma pena romana comum: Eusébio registra que Flávia Domitila, sobrinha do cônsul Flávio Clemente, foi banida para Pôncia por seu testemunho de Cristo."
  de:
    - "Patmos ist eine kleine, felsige Insel von etwa 34 Quadratkilometern im südöstlichen Ägäischen Meer, südlich von Samos und westlich der kleinasiatischen Küste, unter den heute Dodekanes genannten Inseln. Antike Autoren erwähnen sie selten. Thukydides berichtet, der athenische Befehlshaber Paches habe 427 v. Chr. eine peloponnesische Flotte bis Patmos verfolgt und sei dann umgekehrt, und Strabon setzt Patmos und die nahen Korassiai westlich von Ikaria."
    - "Patmos wird in der Bibel einmal genannt. Zu Beginn der Offenbarung schreibt der Seher: „Ich, Johannes, der auch euer Bruder und Mitgenosse an der Trübsal ist und am Reich und an der Geduld Jesu Christi, war auf der Insel, die da heißt Patmos, um des Wortes Gottes willen und des Zeugnisses Jesu Christi.“ Dort hörte er „im Geist an des HERRN Tag“ eine Stimme, die ihm auftrug, das Gesehene aufzuschreiben und an die sieben Gemeinden in Asia zu senden, von Ephesus bis Laodizea."
    - "Frühchristliche Autoren verstanden den Aufenthalt des Johannes als Verbannung. Irenäus sagt, die Vision sei gegen Ende der Regierung Domitians gesehen worden, gewöhnlich auf etwa 95 n. Chr. datiert, und Eusebius sagt, Johannes sei in der Verfolgung unter Domitian zum Leben auf Patmos verurteilt worden und nach Ephesus zurückgekehrt, als unter Nerva die von Domitian Verbannten heimkehren durften; auch Clemens von Alexandria erzählt von der Rückkehr des Johannes von Patmos nach Ephesus nach dem Tod des Tyrannen. Die meisten Gelehrten nehmen eine Datierung unter Domitian an, einige setzen die Offenbarung in die Jahre nach Nero. Inselverbannung war eine übliche römische Strafe: Eusebius berichtet, Flavia Domitilla, eine Nichte des Konsuls Flavius Clemens, sei wegen ihres Bekenntnisses zu Christus nach Pontia verbannt worden."
  fr:
    - "Patmos est une petite île rocheuse d’environ 34 kilomètres carrés dans le sud-est de la mer Égée, au sud de Samos et à l’ouest de la côte d’Asie Mineure, parmi les îles appelées aujourd’hui le Dodécanèse. Les auteurs anciens la mentionnent rarement. Thucydide raconte qu’en 427 av. J.-C. le commandant athénien Pachès poursuivit une flotte péloponnésienne jusqu’à Patmos, puis rebroussa chemin, et Strabon place Patmos et les Corassies voisines à l’ouest d’Icarie."
    - "Patmos n’est nommée qu’une fois dans la Bible. Au début de l’Apocalypse, le voyant écrit : « Moi Jean, votre frère, et qui ai part avec vous à la tribulation et au royaume et à la persévérance en Jésus, j’étais dans l’île appelée Patmos, à cause de la parole de Dieu et du témoignage de Jésus. » Là, « ravi en esprit au jour du Seigneur », il entendit une voix lui dire d’écrire ce qu’il voyait et de l’envoyer aux sept Églises d’Asie, d’Éphèse à Laodicée."
    - "Les écrivains chrétiens anciens ont pris le séjour de Jean pour un bannissement. Irénée dit que la vision eut lieu vers la fin du règne de Domitien, d’ordinaire situé vers 95 apr. J.-C., et Eusèbe que Jean fut condamné à vivre à Patmos lors de la persécution de Domitien et revint à Éphèse quand, sous Nerva, les bannis de Domitien purent rentrer ; Clément d’Alexandrie raconte aussi le retour de Jean de Patmos à Éphèse après la mort du tyran. La plupart des spécialistes acceptent une date sous Domitien, d’autres placent l’Apocalypse dans les années après Néron. L’exil insulaire était une peine romaine courante : Eusèbe rapporte que Flavia Domitilla, nièce du consul Flavius Clemens, fut reléguée à Pontia pour son témoignage rendu au Christ."
  it:
    - "Patmos è una piccola isola rocciosa di circa 34 chilometri quadrati nell’Egeo sud-orientale, a sud di Samo e a ovest della costa dell’Asia Minore, tra le isole oggi chiamate Dodecaneso. Gli autori antichi la menzionano raramente. Tucidide racconta che nel 427 a.C. il comandante ateniese Pachete inseguì una flotta peloponnesiaca fino a Patmos e poi tornò indietro, e Strabone pone Patmos e le vicine Corasie a ovest di Icaria."
    - "Patmos è nominata una sola volta nella Bibbia. All’inizio dell’Apocalisse il veggente scrive: «Io, Giovanni, vostro fratello e partecipe con voi della tribolazione, del regno e della costanza in Gesù, ero nell’isola chiamata Patmo a motivo della parola di Dio e della testimonianza di Gesù.» Là, «rapito in Ispirito nel giorno di Domenica», udì una voce che gli diceva di scrivere ciò che vedeva e di mandarlo alle sette chiese dell’Asia, da Efeso a Laodicea."
    - "Gli scrittori cristiani antichi intesero il soggiorno di Giovanni come un bando. Ireneo dice che la visione fu avuta verso la fine del regno di Domiziano, di solito ritenuta il 95 d.C. circa, ed Eusebio dice che Giovanni fu condannato a vivere a Patmos nella persecuzione di Domiziano e tornò a Efeso quando, sotto Nerva, a coloro che Domiziano aveva bandito fu permesso di rientrare; anche Clemente di Alessandria racconta il ritorno di Giovanni da Patmos a Efeso dopo la morte del tiranno. La maggior parte degli studiosi accetta una data sotto Domiziano, mentre alcuni collocano l’Apocalisse negli anni dopo Nerone. L’esilio su un’isola era una pena romana comune: Eusebio riferisce che Flavia Domitilla, nipote del console Flavio Clemente, fu bandita a Pontia per la sua testimonianza a Cristo."
  pl:
    - "Patmos to niewielka skalista wyspa o powierzchni około 34 kilometrów kwadratowych w południowo-wschodniej części Morza Egejskiego, na południe od Samos i na zachód od wybrzeża Azji Mniejszej, wśród wysp zwanych dziś Dodekanezem. Pisarze starożytni rzadko o niej wspominają. Tukidydes opowiada, że w 427 roku p.n.e. ateński dowódca Paches gonił flotę peloponeską aż do Patmos, po czym zawrócił, a Strabon umieszcza Patmos i pobliskie Korasje na zachód od Ikarii."
    - "Patmos jest wymienione w Biblii raz. Na początku Apokalipsy wizjoner pisze: „Ja Jan, którym też jest bratem waszym i uczestnikiem w ucisku i w królestwie, i w cierpliwości Jezusa Chrystusa, byłem na wyspie, którą zowią Patmos, dla słowa Bożego i dla świadectwa Jezusa Chrystusa”. Tam, „w zachwyceniu ducha w dzień Pański”, usłyszał głos, który kazał mu zapisać to, co widzi, i posłać siedmiu kościołom Azji, od Efezu po Laodyceę."
    - "Dawni pisarze chrześcijańscy uważali pobyt Jana za wygnanie. Ireneusz mówi, że widzenie ujrzano pod koniec panowania Domicjana, co zwykle datuje się na około 95 rok n.e., a Euzebiusz twierdzi, że Jan został skazany na pobyt na Patmos w prześladowaniu Domicjana i wrócił do Efezu, gdy za Nerwy pozwolono powrócić tym, których Domicjan wygnał; Klemens Aleksandryjski również opowiada o powrocie Jana z Patmos do Efezu po śmierci tyrana. Większość uczonych przyjmuje datę za Domicjana, niektórzy zaś umieszczają Apokalipsę w latach po Neronie. Zesłanie na wyspę było częstą karą rzymską: Euzebiusz zapisał, że Flawia Domitylla, bratanica konsula Flawiusza Klemensa, została zesłana na Pontię za świadectwo o Chrystusie."
  cs:
    - "Patmos je malý skalnatý ostrov o rozloze asi 34 čtverečních kilometrů v jihovýchodním Egejském moři, jižně od Samu a západně od pobřeží Malé Asie, mezi ostrovy zvanými dnes Dodekanés. Antičtí autoři se o něm zmiňují zřídka. Thúkýdidés vypráví, že roku 427 př. n. l. athénský velitel Pachés pronásledoval peloponéskou flotilu až k Patmu a pak se obrátil zpět, a Strabón klade Patmos a blízké Korassie západně od Ikarie."
    - "Patmos se v Bibli jmenuje jednou. Na počátku Zjevení vidoucí píše: „Já Jan, kterýž jsem i bratr váš, i spoluúčastník v soužení, i v království, i v trpělivosti Ježíše Krista, byl jsem na ostrově, kterýž slove Patmos, pro slovo Boží a svědectví Ježíše Krista.“ Tam, „u vytržení ducha v den Páně“, uslyšel hlas, který mu přikázal napsat, co vidí, a poslat to sedmi církvím v Asii, od Efezu po Laodikeiu."
    - "Raně křesťanští spisovatelé chápali Janův pobyt jako vyhnanství. Irenej praví, že vidění bylo spatřeno koncem Domitianovy vlády, obvykle kladené asi do roku 95 n. l., a Eusebius praví, že Jan byl za Domitianova pronásledování odsouzen žít na Patmu a vrátil se do Efezu, když za Nervy bylo vyhnancům dovoleno vrátit se domů; také Klement Alexandrijský vypráví o Janově návratu z Patmu do Efezu po smrti tyrana. Většina učenců přijímá dataci za Domitiana, někteří kladou Zjevení do let po Neronovi. Vyhnanství na ostrov bylo běžným římským trestem: Eusebius zaznamenává, že Flavia Domitilla, neteř konzula Flavia Klementa, byla pro své svědectví o Kristu vyhnána na Pontii."
  nl:
    - "Patmos is een klein, rotsachtig eiland van zo’n 34 vierkante kilometer in de zuidoostelijke Egeïsche Zee, ten zuiden van Samos en ten westen van de kust van Klein-Azië, tussen de eilanden die nu de Dodekanesos heten. Antieke schrijvers noemen het zelden. Thucydides vertelt dat de Atheense bevelhebber Paches in 427 v.Chr. een Peloponnesische vloot tot Patmos achtervolgde en toen terugkeerde, en Strabo plaatst Patmos en de nabijgelegen Korassiai ten westen van Ikaria."
    - "Patmos wordt eenmaal in de Bijbel genoemd. Aan het begin van Openbaring schrijft de ziener: “Ik, Johannes, die ook uw broeder ben, en medegenoot in de verdrukking, en in het Koninkrijk, en in de lijdzaamheid van Jezus Christus, was op het eiland, genaamd Patmos, om het Woord Gods, en om de getuigenis van Jezus Christus.” Daar, “in den geest op den dag des Heeren”, hoorde hij een stem die hem zei op te schrijven wat hij zag en het te sturen aan de zeven kerken van Asia, van Efeze tot Laodicea."
    - "Vroegchristelijke schrijvers vatten Johannes’ verblijf op als verbanning. Irenaeus zegt dat het visioen tegen het einde van Domitianus’ regering werd gezien, gewoonlijk opgevat als omstreeks 95 n.Chr., en Eusebius zegt dat Johannes in Domitianus’ vervolging veroordeeld werd op Patmos te wonen en naar Efeze terugkeerde toen onder Nerva zij die Domitianus had verbannen naar huis mochten; ook Clemens van Alexandrië vertelt van Johannes’ terugkeer van Patmos naar Efeze na de dood van de tiran. De meeste geleerden aanvaarden een datering onder Domitianus, terwijl sommigen Openbaring in de jaren na Nero plaatsen. Verbanning naar een eiland was een gewone Romeinse straf: Eusebius meldt dat Flavia Domitilla, een nicht van consul Flavius Clemens, om haar getuigenis van Christus naar Pontia werd verbannen."
  sv:
    - "Patmos är en liten, klippig ö på omkring 34 kvadratkilometer i sydöstra Egeiska havet, söder om Samos och väster om Mindre Asiens kust, bland de öar som nu kallas Dodekanesos. Antika författare nämner den sällan. Thukydides berättar att den atenske befälhavaren Paches 427 f.Kr. jagade en peloponnesisk flotta ända till Patmos och sedan vände tillbaka, och Strabon placerar Patmos och de närliggande Korassiai väster om Ikaria."
    - "Patmos nämns en enda gång i Bibeln. I början av Uppenbarelseboken skriver siaren: ”Jag, Johannes, eder broder, som med eder har del i bedrövelsen och riket och ståndaktigheten i Jesus, jag befann mig på den ö som heter Patmos, för Guds ords och Jesu vittnesbörds skull.” Där hörde han ”i andehänryckning på Herrens dag” en röst som sade åt honom att skriva ned vad han såg och sända det till de sju församlingarna i Asien, från Efesos till Laodikeia."
    - "Tidiga kristna författare uppfattade Johannes vistelse som förvisning. Irenaeus säger att synen skådades mot slutet av Domitianus regering, vanligen räknat som omkring år 95 e.Kr., och Eusebios säger att Johannes dömdes att bo på Patmos under Domitianus förföljelse och återvände till Efesos när de som Domitianus förvisat under Nerva fick återvända hem; Clemens av Alexandria berättar också om Johannes återkomst från Patmos till Efesos efter tyrannens död. De flesta forskare godtar en datering under Domitianus, medan några placerar Uppenbarelseboken åren efter Nero. Ö-exil var ett vanligt romerskt straff: Eusebios uppger att Flavia Domitilla, en syskondotter till konsuln Flavius Clemens, förvisades till Pontia för sitt vittnesbörd om Kristus."
  nb:
    - "Patmos er en liten, steinete øy på omtrent 34 km² i det sørøstlige Egeerhavet, sør for Samos og vest for kysten av Lilleasia, blant øyene som nå kalles Dodekanes. Antikkens forfattere nevner den sjelden. Tukydid forteller at den atenske sjefen Paches i 427 f.Kr. jaktet en peloponnesisk flåte helt til Patmos og så snudde, og Strabon plasserer Patmos og de nærliggende Korassiai vest for Ikaria."
    - "Patmos er nevnt én gang i Bibelen. I begynnelsen av Johannes' åpenbaring skriver seeren: «Jeg, Johannes, som er eders bror og har del med eder i trengselen og riket og tålmodigheten i Jesus, jeg var på den ø som kalles Patmos, for Guds ords og Jesu vidnesbyrds skyld.» Der hørte han, «bortrykket i ånden på Herrens dag», en røst som sa at han skulle skrive det han så og sende det til de sju menighetene i Asia, fra Efesos til Laodikea."
    - "Tidlige kristne forfattere tok Johannes' opphold som forvisning. Irenaeus sier at synet ble sett mot slutten av Domitians regjeringstid, vanligvis regnet som omkring 95 e.Kr., og Eusebius sier at Johannes ble dømt til å bo på Patmos under Domitians forfølgelse og vendte tilbake til Efesos da de som Domitian hadde forvist, fikk reise hjem under Nerva; Klemens av Aleksandria forteller også om Johannes' hjemkomst fra Patmos til Efesos etter tyrannens død. De fleste forskere godtar en datering under Domitian, mens noen plasserer Åpenbaringen i årene etter Nero. Øyforvisning var en vanlig romersk straff: Eusebius forteller at Flavia Domitilla, en niese av konsulen Flavius Clemens, ble forvist til Pontia for sitt vitnesbyrd om Kristus."
  tl:
    - "Ang Patmos ay isang maliit at mabatong pulo na may sukat na mga 34 kilometro kuwadrado sa timog-silangang Dagat Egeo, sa timog ng Samos at sa kanluran ng baybayin ng Asia Minor, sa mga pulong tinatawag ngayong Dodecaneso. Bihirang banggitin ito ng mga sinaunang manunulat. Isinasalaysay ni Tucidides na noong 427 BK, hinabol ng pinunong Ateniense na si Paches ang isang hukbong-dagat ng mga Peloponnesiano hanggang sa Patmos at saka bumalik, at inilalagay ni Strabo ang Patmos at ang karatig na Corassiae sa kanluran ng Icaria."
    - "Isang beses lamang pinangalanan ang Patmos sa Bibliya. Sa pambungad ng Apocalipsis, isinulat ng tagakita: “Akong si Juan, na inyong kapatid at inyong karamay sa kapighatian at sa kaharian at sa pagtitiis na kay Jesus, ay nasasa pulo na tinatawag na Patmos, dahil sa salita ng Dios at sa patotoo ni Jesus.” Doon, ang sabi niya, “Ako'y nasa Espiritu nang araw ng Panginoon”, at narinig niya ang isang tinig na nag-uutos sa kaniyang isulat ang kaniyang nakikita at ipadala ito sa pitong iglesia ng Asia, mula sa Efeso hanggang Laodicea."
    - "Itinuring ng mga sinaunang manunulat na Kristiyano na pagpapatapon ang pananatili ni Juan. Sinasabi ni Ireneo na nakita ang pangitain malapit sa katapusan ng paghahari ni Domiciano, karaniwang itinuturing na mga AD 95, at sinasabi ni Eusebio na hinatulan si Juan na manirahan sa Patmos sa pag-uusig ni Domiciano at bumalik sa Efeso nang, sa ilalim ni Nerva, pinayagang umuwi ang mga ipinatapon ni Domiciano; isinasalaysay din ni Clemente ng Alejandria ang pagbabalik ni Juan mula Patmos sa Efeso pagkamatay ng malupit. Tinatanggap ng karamihan ng iskolar ang petsa sa ilalim ni Domiciano, habang inilalagay ng ilan ang Apocalipsis sa mga taon pagkatapos ni Nero. Karaniwang parusang Romano ang pagpapatapon sa pulo: itinatala ni Eusebio na si Flavia Domitilla, pamangking babae ng konsul na si Flavio Clemente, ay ipinatapon sa Pontia dahil sa pagsaksi kay Cristo."
  da:
    - "Patmos er en lille, klippefuld ø på omkring 34 kvadratkilometer i det sydøstlige Ægæerhav, syd for Samos og vest for Lilleasiens kyst, blandt de øer, der nu kaldes Dodekanes. Antikke forfattere nævner den sjældent. Thukydid fortæller, at den athenske befalingsmand Paches i 427 f.Kr. jagede en peloponnesisk flåde helt til Patmos og så vendte om, og Strabon placerer Patmos og de nærliggende Korassiai vest for Ikaria."
    - "Patmos nævnes én gang i Bibelen. I begyndelsen af Johannes' Åbenbaring skriver seeren: »Jeg Johannes, eders Broder og meddelagtig i Trængselen og Riget og Udholdenheden i Jesus, var paa den Ø, som kaldes Patmos, for Guds Ords og for Jesu Vidnesbyrds Skyld.« Dér, hvor han »henryktes i Aanden paa Herrens Dag«, hørte han en røst, der bød ham skrive, hvad han så, og sende det til de syv menigheder i Asien, fra Efesos til Laodikea."
    - "Tidlige kristne forfattere opfattede Johannes' ophold som landsforvisning. Irenæus siger, at synet blev set mod slutningen af Domitians regeringstid, sædvanligvis taget som omkring 95 e.Kr., og Eusebios siger, at Johannes blev dømt til at leve på Patmos under Domitians forfølgelse og vendte tilbage til Efesos, da de, som Domitian havde forvist, under Nerva fik lov til at vende hjem; Klemens af Alexandria fortæller også om Johannes' hjemkomst fra Patmos til Efesos efter tyrannens død. De fleste forskere accepterer en datering under Domitian, mens nogle placerer Åbenbaringen i årene efter Nero. Landsforvisning til en ø var en almindelig romersk straf: Eusebios oplyser, at Flavia Domitilla, en niece til konsul Flavius Clemens, blev forvist til Pontia for sit vidnesbyrd om Kristus."
  sr:
    - "Патам је мало, стеновито острво од око 34 км² у југоисточном Егеју, јужно од Самоса и западно од обале Мале Азије, међу острвима која се данас зову Додеканез. Стари писци га ретко помињу. Тукидид приповеда да је 427. п. н. е. атински заповедник Пахет гонио пелопонеску флоту до Патама и онда се вратио, а Страбон смешта Патам и оближње Корасије западно од Икарије."
    - "Патам се у Библији помиње једном. На почетку Откривења пророк пише: „Ја Јован, који сам и брат ваш и друг у невољи, и у царству и трпљењу Исуса Христа, бејах на острву које се зове Патам, за реч Божију и за сведочанство Исуса Христа.“ Ту је, „у духу у дан недељни“, чуо глас који му налаже да напише што види и пошаље седам цркава Азије, од Ефеса до Лаодикије."
    - "Рани хришћански писци узимали су Јованов боравак као прогонство. Иринеј каже да је виђење виђено при крају Домицијанове владавине, што се обично узима као око 95. н. е., а Јевсевије каже да је Јован био осуђен да живи на Патаму у Домицијановом прогону и да се вратио у Ефес кад је под Нервом дозвољен повратак онима које је Домицијан прогнао; и Климент Александријски приповеда о Јовановом повратку с Патама у Ефес после тиранове смрти. Већина научника прихвата датум под Домицијаном, док неки Откривење смештају у године после Нерона. Острвско прогонство било је уобичајена римска казна: Јевсевије бележи да је Флавија Домитила, нећака конзула Флавија Климента, прогнана на Понтију због сведочења о Христу."
  hu:
    - "Pátmosz kicsi, sziklás, mintegy 34 négyzetkilométeres sziget az Égei-tenger délkeleti részén, Számosztól délre és a kis-ázsiai parttól nyugatra, a ma Dodekanészosznak nevezett szigetek között. Az ókori írók ritkán említik. Thuküdidész szerint Kr. e. 427-ben az athéni parancsnok, Pakhész egy peloponnészoszi flottát Pátmoszig üldözött, majd visszafordult, Sztrabón pedig Pátmoszt és a közeli Korassziai-szigeteket Ikariától nyugatra helyezi."
    - "Pátmosz a Bibliában egyszer szerepel. A Jelenések könyvének elején a látnok így ír: „Én János, a ki néktek atyátokfia is vagyok, társatok is a Jézus Krisztus szenvedésében és királyságában és tűrésében, a szigeten valék, a mely Páthmósnak neveztetik, az Isten beszédéért és a Jézus Krisztus bizonyságtételéért.” A szigeten „Lélekben valék ott az Úrnak napján”, hallott egy hangot, amely azt parancsolta neki, hogy írja le, amit lát, és küldje el Ázsia hét egyházának, Efezustól Laodiceáig."
    - "A korai keresztény írók János ottlétét száműzetésnek vették. Irenaeus szerint a látomást Domitianus uralkodásának vége felé látták, ami általában Kr. u. 95 körül van, Euszebiosz szerint pedig Jánost Domitianus üldözésében ítélték a Pátmoszon való tartózkodásra, és Efezusba tért vissza, amikor Nerva alatt azoknak, akiket Domitianus száműzött, megengedték a hazatérést; Alexandriai Kelemen is beszél János hazatéréséről Pátmoszról Efezusba a zsarnok halála után. A legtöbb tudós Domitianus alatti keltezést fogad el, néhányan pedig a Jelenéseket a Néró utáni évekre teszik. A szigeti száműzetés gyakori római büntetés volt: Euszebiosz feljegyzi, hogy Flavia Domitillát, Flavius Clemens consul unokahúgát Pontiára száműzték Krisztus melletti tanúságtételéért."
  fi:
    - "Patmos on pieni, kivinen saari, noin 34 neliökilometrin kokoinen, Egeanmeren kaakkoisosassa Samoksen eteläpuolella ja Vähän-Aasian rannikon länsipuolella nykyisten Dodekanesian saarten joukossa. Muinaiset kirjoittajat mainitsevat sen harvoin. Thukydides kertoo, että vuonna 427 eaa. ateenalainen päällikkö Paches ajoi peloponnesolaisten laivastoa takaa Patmokseen asti ja kääntyi sitten takaisin, ja Strabon sijoittaa Patmoksen ja läheiset Korassiat Ikarian länsipuolelle."
    - "Patmos mainitaan Raamatussa kerran. Ilmestyskirjan alussa näkijä kirjoittaa: ”Minä, Johannes, teidän veljenne, joka teidän kanssanne olen osallinen ahdistukseen ja valtakuntaan ja kärsivällisyyteen Jeesuksessa, minä olin Jumalan sanan ja Jeesuksen todistuksen tähden saaressa, jonka nimi on Patmos.” Siellä hän ”hengessä Herran päivänä” kuuli äänen, joka käski hänen kirjoittaa, mitä näki, ja lähettää se Aasian seitsemälle seurakunnalle, Efesoksesta Laodikeaan."
    - "Varhaiskristilliset kirjoittajat pitivät Johanneksen oleskelua karkotuksena. Irenaeus sanoo näyn nähdyn Domitianuksen hallituskauden lopulla, yleensä noin 95 jaa., ja Eusebios sanoo Johanneksen tuomitun asumaan Patmokselle Domitianuksen vainossa ja palanneen Efesokseen, kun Nervan aikana Domitianuksen karkottamat saivat palata kotiin; Aleksandrian Klemenskin kertoo Johanneksen paluusta Patmokselta Efesokseen tyrannin kuoleman jälkeen. Useimmat tutkijat hyväksyvät Domitianuksen ajan ajoituksen, kun taas jotkut sijoittavat Ilmestyskirjan Neron jälkeisiin vuosiin. Saarikarkotus oli yleinen roomalainen rangaistus: Eusebios kertoo konsuli Flavius Clemensin veljentyttären Flavia Domitillan karkotetun Pontiaan todistuksestaan Kristuksesta."
  vi:
    - "Bát-mô là một hòn đảo nhỏ, nhiều đá, rộng khoảng 34 kilômét vuông, ở đông nam biển Aegean, phía nam Sa-mốt và phía tây bờ biển Tiểu Á, trong số các đảo nay gọi là Dodecanese. Các tác giả cổ hiếm khi nhắc đến nó. Thucydides kể rằng năm 427 TCN chỉ huy A-thên Paches đuổi một hạm đội Peloponnesos đến tận Bát-mô rồi quay lại, và Strabo đặt Bát-mô và Corassiae lân cận ở phía tây Icaria."
    - "Bát-mô được nêu một lần trong Kinh Thánh. Ở phần mở đầu sách Khải Huyền, người thấy dị tượng viết: “Tôi là Giăng, là anh em và bạn của các anh em về hoạn nạn, về nước, về sự nhịn nhục trong Đức Chúa Jêsus, tôi đã ở trong đảo gọi là Bát-mô, vì cớ lời Đức Chúa Trời và chứng của Đức Chúa Jêsus.” Tại đó, “Nhằm ngày của Chúa, tôi được Đức Thánh Linh cảm hóa”, ông nghe một tiếng bảo ông chép điều mình thấy và gửi cho bảy hội thánh ở A-si, từ Ê-phê-sô đến Lao-đi-xê."
    - "Các tác giả Cơ Đốc đầu tiên coi việc Giăng ở đó là bị lưu đày. Irenaeus nói rằng thị kiến được thấy vào cuối triều Domitian, thường được tính là khoảng năm 95, và Eusebius nói Giăng bị kết án sống ở Bát-mô trong cuộc bách hại của Domitian và trở về Ê-phê-sô khi, dưới thời Nerva, những người Domitian đã đày được phép về nhà; Cơ-lê-măn ở A-léc-xan-tri cũng kể việc Giăng từ Bát-mô trở về Ê-phê-sô sau khi tên bạo chúa chết. Đa số học giả chấp nhận niên đại dưới thời Domitian, trong khi một số đặt sách Khải Huyền vào những năm sau Nero. Lưu đày ra đảo là hình phạt thường gặp của La Mã: Eusebius ghi rằng Flavia Domitilla, cháu gái của chấp chính quan Flavius Clemens, bị đày đến Pontia vì làm chứng cho Đấng Christ."
  ro:
    - "Patmos este o insulă mică și stâncoasă, de circa 34 km², în sud-estul Mării Egee, la sud de Samos și la vest de coasta Asiei Mici, printre insulele numite acum Dodecanez. Scriitorii antici o pomenesc rar. Tucidide povestește că în 427 î.Hr. comandantul atenian Paches a urmărit o flotă peloponesiacă până la Patmos și apoi s-a întors, iar Strabon așază Patmos și vecinele Corassiae la vest de Icaria."
    - "Patmos este numit o singură dată în Biblie. La începutul Apocalipsei, văzătorul scrie: „Eu Ioan, cel ce sunt și fratele vostru, și părtaș întru necazul și întru împărățiea și întru răbdarea întru Iisus Hristos, fost-am în ostrovul ce se chiamă Patmos, pentru cuvântul lui Dumnezeu, și pentru mărturisirea lui Iisus Hristos.” Acolo, „în Duh într’o zi de Duminică”, a auzit un glas care i-a poruncit să scrie ce vede și să trimită celor șapte biserici din Asia, de la Efes până la Laodiceea."
    - "Scriitorii creștini timpurii au înțeles șederea lui Ioan ca exil. Irineu spune că vedenia a fost văzută spre sfârșitul domniei lui Domițian, de obicei socotit în jurul anului 95 d.Hr., iar Eusebiu spune că Ioan a fost condamnat să trăiască pe Patmos în persecuția lui Domițian și s-a întors la Efes când, sub Nerva, cei exilați de Domițian au fost lăsați să se întoarcă; și Clement Alexandrinul povestește despre întoarcerea lui Ioan de pe Patmos la Efes după moartea tiranului. Cei mai mulți cercetători acceptă o datare sub Domițian, în timp ce unii așază Apocalipsa în anii de după Nero. Exilul pe o insulă era o pedeapsă romană obișnuită: Eusebiu consemnează că Flavia Domitilla, nepoata consulului Flavius Clemens, a fost exilată la Pontia pentru mărturia ei despre Hristos."
  bg:
    - "Патмос е малък скалист остров с площ около 34 кв. км в югоизточната част на Егейско море, южно от Самос и западно от брега на Мала Азия, сред островите, наричани днес Додеканези. Древните автори рядко го споменават. Тукидид разказва, че през 427 г. пр.н.е. атинският военачалник Пахет преследвал пелопонески флот чак до Патмос и после се върнал, а Страбон поставя Патмос и близките Корасии на запад от Икария."
    - "Патмос е назован веднъж в Библията. В началото на Откровението ясновидецът пише: „Аз Иоан, който съм и брат ваш и съучастник в скърбите и в царството и търпението Исус Христово, бех на острова нарицаем Патмос за словото Божие и за свидетелството Исус Христово.“ Там, „в неделен ден … в изстъпление Духом“, той чул глас, който му казал да напише видяното и да го изпрати на седемте църкви в Азия, от Ефес до Лаодикия."
    - "Раннохристиянските автори разбирали престоя на Йоан като заточение. Ириней казва, че видението било видяно към края на царуването на Домициан, обикновено приемано за около 95 г. н.е., а Евсевий съобщава, че Йоан бил осъден да живее на Патмос при Домициановото гонение и се върнал в Ефес, когато при Нерва на заточените от Домициан било позволено да се приберат; Климент Александрийски също разказва за завръщането на Йоан от Патмос в Ефес след смъртта на тирана. Повечето учени приемат датиране при Домициан, а някои поставят Откровението в годините след Нерон. Заточението на остров било обичайно римско наказание: Евсевий съобщава, че Флавия Домицила, племенница на консула Флавий Климент, била заточена на Понтия заради свидетелството си за Христос."
scripture:
  - Rev.1.9-Rev.1.11
