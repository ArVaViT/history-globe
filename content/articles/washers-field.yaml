# Overview article (ADR 0007). Mainstream facts only; the field is unlocated and the candidates are given without choosing; the Upper Pool has its own article.
id: washers-field
place: a84c559
title:
  en: "Fuller's Field"
  ru: "Поле белильничье"
  uk: "Поле сукновала"
  es: "Campo del Batanero"
  pt: "Campo do Lavandeiro"
  de: "Acker des Walkmüllers"
  fr: "Champ du foulon"
body:
  en:
    - "The Fuller's Field was a plot outside the walls of Jerusalem where fullers cleaned and whitened cloth, treading it in water with alkali and spreading it to dry; the trade needed water and open ground and smelt badly enough to be kept out of the city. The Bible mentions the field only as a landmark on the highway by “the conduit of the upper pool”, and its site follows that of the pool, which is itself uncertain. If the pool was at the Gihon spring, the field lay in the Kidron valley below the City of David, perhaps near En-rogel, whose name has been taken to mean “the fuller's spring”; if the pool lay north or north-west of the city, the field was on that side, where Josephus later knew a “Fuller's Monument” by the corner tower of the third wall. Nothing of it has been found."
    - "Isaiah was sent to meet King Ahaz “at the end of the conduit of the upper pool in the highway of the fuller's field” when Damascus and Israel threatened Jerusalem in 734 BC. In 701 BC the Rabshakeh, sent by Sennacherib from Lachish with a great army, “stood by the conduit of the upper pool in the highway of the fuller's field” and called to the people on the wall, within hearing of the city, to give up Hezekiah and come out to him. Both scenes need a place close under the wall, by a road, with water: a fullers' yard was that."
    - "The field has no later history. The valley below the City of David and the ground west of the Jaffa Gate, the two places where it is sought, are today Silwan and the park around the Mamilla pool."
  ru:
    - "Поле белильничье было участком за стенами Иерусалима, где белильщики чистили и отбеливали ткань, топча её в воде со щёлочью и расстилая для сушки; ремеслу нужны были вода и открытое место, и пахло оно так, что его держали вне города. Библия упоминает поле лишь как примету на дороге у «водопровода верхнего пруда», и его место следует за местом пруда, которое само неясно. Если пруд был у источника Гион, поле лежало в долине Кедрон под городом Давида, быть может у Ен-Рогела, чьё имя толковали как «источник белильщика»; если пруд лежал к северу или северо-западу от города, то и поле было на этой стороне, где Иосиф Флавий позднее знал «памятник Белильщика» у угловой башни третьей стены. Ничего от него не найдено."
    - "Исаия был послан встретить царя Ахаза «к концу водопровода верхнего пруда, на дорогу к полю белильничьему», когда Дамаск и Израиль грозили Иерусалиму в 734 г. до н. э. В 701 г. до н. э. Рабсак, посланный Сеннахиримом из Лахиса с большим войском, «остановился у водопровода верхнего пруда на дороге поля белильничьего» и, так что слышал город, звал народ на стене отступиться от Езекии и выйти к нему. Обеим сценам нужно место под самой стеной, у дороги, с водой: двор белильщиков был таким местом."
    - "Позднейшей истории у поля нет. Долина под городом Давида и земля к западу от Яффских ворот — два места, где его ищут, — сегодня это Сильван и парк вокруг пруда Мамилла."
  uk:
    - "Поле сукновала було ділянкою за мурами Єрусалима, де сукновали чистили й вибілювали тканину, топчучи її у воді з лугом і розстеляючи сушитися; ремесло потребувало води й відкритої землі й так тхнуло, що його виносили з міста. Біблія згадує поле лише як орієнтир на дорозі біля «водопроводу з верхнього ставу», і його місце залежить від місця ставка, яке само непевне. Якщо ставок був біля джерела Гіхон, поле лежало в долині Кедрону під Містом Давида, можливо, поблизу Ен-Рогела, чию назву тлумачили як «джерело сукновала»; якщо ставок лежав на північ чи північний захід від міста, поле було з того боку, де Йосиф Флавій пізніше знав «Пам’ятник Сукновала» біля кутової вежі третього муру. Від нього нічого не знайдено."
    - "Ісаї було велено зустріти царя Ахаза «на край водопроводу з верхнього ставу на Шаповаловому шляху», коли Дамаск і Ізраїль загрожували Єрусалиму 734 р. до н. е. У 701 р. до н. е. Рабсак, посланий Сінаххерібом з Лахіша з великим військом, і його люди «зайняли становище на водопроводї вижшого ставу, на дорозї до поля красильнього», і Рабсак закликав людей на мурі, у межах чутності міста, покинути Єзекію й вийти до нього. Обидві сцени потребують місця близько під муром, біля дороги, з водою: таким було сукновальне подвір’я."
    - "Пізнішої історії поле не має. Долина під Містом Давида й земля на захід від Яффських воріт, два місця, де його шукають, нині — Сільван і парк навколо басейну Мамілла."
  es:
    - "El Campo del Batanero era un terreno fuera de las murallas de Jerusalén donde los bataneros limpiaban y blanqueaban paños, pisándolos en agua con álcali y extendiéndolos para que se secaran; el oficio necesitaba agua y terreno abierto y olía lo bastante mal como para mantenerse fuera de la ciudad. La Biblia menciona el campo solo como hito en el camino, «junto al conducto del estanque de arriba», y su emplazamiento sigue al del estanque, que es a su vez incierto. Si el estanque estaba en la fuente de Gihón, el campo se hallaba en el valle del Cedrón, bajo la Ciudad de David, quizá cerca de En-rogel, cuyo nombre se ha tomado como «la fuente del batanero»; si el estanque estaba al norte o noroeste de la ciudad, el campo estaba en ese lado, donde Josefo conoció más tarde un «Monumento del Batanero» junto a la torre de la esquina de la tercera muralla. No se ha hallado nada de él."
    - "Isaías fue enviado a encontrarse con el rey Acaz «al cabo del conducto de la Pesquera de arriba, en el camino de la heredad del Lavador» cuando Damasco e Israel amenazaban Jerusalén en 734 a. C. En 701 a. C., el Rabsaces, enviado por Senaquerib desde Laquis con un gran ejército, «pararon junto al conducto del estanque de arriba, que es en el camino de la heredad del batanero» y llamó a la gente de la muralla, al alcance del oído de la ciudad, a abandonar a Ezequías y salir a él. Ambas escenas requieren un lugar muy cerca de la muralla, junto a un camino, con agua: un patio de bataneros lo era."
    - "El campo no tiene historia posterior. El valle bajo la Ciudad de David y el terreno al oeste de la Puerta de Jaffa, los dos lugares donde se busca, son hoy Silwan y el parque en torno al estanque de Mamilla."
  pt:
    - "O Campo do Lavandeiro era um terreno fora das muralhas de Jerusalém onde os lavandeiros limpavam e branqueavam tecido, pisando-o na água com álcali e estendendo-o para secar; o ofício precisava de água e de terreno aberto e cheirava mal o bastante para ser mantido fora da cidade. A Bíblia menciona o campo só como marco na estrada junto ao “aqueduto do tanque superior”, e seu sítio segue o do tanque, que é ele mesmo incerto. Se o tanque ficava na fonte de Giom, o campo estava no vale do Cedrom, abaixo da Cidade de Davi, talvez perto de En-Rogel, cujo nome já foi tomado como “a fonte do lavandeiro”; se o tanque ficava ao norte ou noroeste da cidade, o campo estava desse lado, onde Josefo conheceu depois um “Monumento do Lavandeiro” junto à torre de esquina do terceiro muro. Nada dele foi encontrado."
    - "Isaías foi enviado ao encontro do rei Acaz “no fim do aqueduto do tanque superior, na estrada do campo do lavandeiro” quando Damasco e Israel ameaçaram Jerusalém em 734 a.C. Em 701 a.C., o Rabsaqué, enviado por Senaqueribe de Laquis com um grande exército, “parou junto ao aqueduto do tanque superior, na estrada do campo do lavandeiro” e chamou o povo da muralha, ao alcance da voz da cidade, a abandonar Ezequias e sair a ele. Ambas as cenas exigem um lugar junto à muralha, ao lado de uma estrada, com água: um pátio de lavandeiros era isso."
    - "O campo não tem história posterior. O vale abaixo da Cidade de Davi e o terreno a oeste da Porta de Jafa, os dois lugares onde é procurado, são hoje Silwan e o parque em torno do tanque de Mamilla."
  de:
    - "Der Acker des Walkmüllers war ein Grundstück außerhalb der Mauern Jerusalems, wo Walker Tuch reinigten und bleichten, es in Wasser mit Lauge traten und zum Trocknen ausbreiteten; das Handwerk brauchte Wasser und freies Land und roch schlecht genug, um aus der Stadt ferngehalten zu werden. Die Bibel erwähnt den Acker nur als Orientierungspunkt an der Straße bei der „Wasserleitung des oberen Teichs“, und seine Lage folgt der des Teichs, die selbst unsicher ist. Lag der Teich an der Gihonquelle, so befand sich der Acker im Kidrontal unterhalb der Davidsstadt, vielleicht nahe En-Rogel, dessen Name als „Walkerquelle“ gedeutet wurde; lag der Teich nördlich oder nordwestlich der Stadt, dann auf dieser Seite, wo Josephus später ein „Walkerdenkmal“ am Eckturm der dritten Mauer kannte. Nichts davon ist gefunden worden."
    - "Jesaja wurde ausgesandt, König Ahas zu begegnen „an das Ende der Wasserleitung des oberen Teiches, am Wege beim Acker des Walkmüllers“, als Damaskus und Israel Jerusalem 734 v. Chr. bedrohten. 701 v. Chr. „trat“ der Rabsake, von Sanherib mit einem großen Heer von Lachisch gesandt, „an die Wasserleitung des oberen Teichs, am Wege bei dem Acker des Walkmüllers“ und rief den Leuten auf der Mauer in Hörweite der Stadt zu, Hiskia aufzugeben und zu ihm herauszukommen. Beide Szenen brauchen einen Ort dicht unter der Mauer, an einer Straße, mit Wasser: Ein Walkerplatz war das."
    - "Der Acker hat keine spätere Geschichte. Das Tal unterhalb der Davidsstadt und das Gelände westlich des Jaffa-Tors, die beiden Orte, wo man ihn sucht, sind heute Silwan und der Park um den Mamilla-Teich."
  fr:
    - "Le Champ du foulon était un terrain hors des murs de Jérusalem où les foulons nettoyaient et blanchissaient les étoffes, les piétinant dans l’eau avec de l’alcali et les étendant pour les faire sécher ; le métier exigeait de l’eau et de l’espace libre et sentait assez mauvais pour être tenu hors de la ville. La Bible ne mentionne le champ que comme repère sur la route de « l’aqueduc de l’étang supérieur », et son site suit celui du bassin, lui-même incertain. Si le bassin était à la source de Guihon, le champ se trouvait dans la vallée du Cédron au-dessous de la Cité de David, peut-être près d’En-Roguel, dont le nom a été compris comme « la source du foulon » ; si le bassin se trouvait au nord ou au nord-ouest de la ville, le champ était de ce côté, où Josèphe connut plus tard un « Monument du foulon » près de la tour d’angle du troisième mur. On n’en a rien trouvé."
    - "Ésaïe fut envoyé à la rencontre du roi Achaz « vers l’extrémité de l’aqueduc de l’étang supérieur, sur la route du champ du foulon » quand Damas et Israël menaçaient Jérusalem en 734 av. J.-C. En 701 av. J.-C., Rabschaké, envoyé de Lakis par Sanchérib avec une grande armée, « s’arrêta à l’aqueduc de l’étang supérieur, sur le chemin du champ du foulon » et appela les gens du rempart, à portée de voix de la ville, à abandonner Ézéchias et à sortir vers lui. Les deux scènes exigent un lieu tout contre le mur, près d’une route, avec de l’eau : un champ de foulons était cela."
    - "Le champ n’a pas d’histoire ultérieure. La vallée au-dessous de la Cité de David et le terrain à l’ouest de la porte de Jaffa, les deux lieux où on le cherche, sont aujourd’hui Silwan et le parc autour du bassin de Mamilla."
