# Overview article (ADR 0007). Mainstream facts only; the field is unlocated and the candidates are given without choosing; the Upper Pool has its own article.
id: washers-field
place: a84c559
title:
  en: "Fuller's Field"
  ru: "Поле белильничье"
body:
  en:
    - "The Fuller's Field was a plot outside the walls of Jerusalem where fullers cleaned and whitened cloth, treading it in water with alkali and spreading it to dry; the trade needed water and open ground and smelt badly enough to be kept out of the city. The Bible mentions the field only as a landmark on the highway by “the conduit of the upper pool”, and its site follows that of the pool, which is itself uncertain. If the pool was at the Gihon spring, the field lay in the Kidron valley below the City of David, perhaps near En-rogel, whose name has been taken to mean “the fuller's spring”; if the pool lay north or north-west of the city, the field was on that side, where Josephus later knew a “Fuller's Monument” by the corner tower of the third wall. Nothing of it has been found."
    - "Isaiah was sent to meet King Ahaz “at the end of the conduit of the upper pool in the highway of the fuller's field” when Damascus and Israel threatened Jerusalem in 734 BC. In 701 BC the Rabshakeh, sent by Sennacherib from Lachish with a great army, “stood by the conduit of the upper pool in the highway of the fuller's field” and called to the people on the wall, within hearing of the city, to give up Hezekiah and come out to him. Both scenes need a place close under the wall, by a road, with water: a fullers' yard was that."
    - "The field has no later history. The valley below the City of David and the ground west of the Jaffa Gate, the two places where it is sought, are today Silwan and the park around the Mamilla pool."
  ru:
    - "Поле белильничье было участком за стенами Иерусалима, где белильщики чистили и отбеливали ткань, топча её в воде со щёлочью и расстилая для сушки; ремеслу нужны были вода и открытое место, и пахло оно так, что его держали вне города. Библия упоминает поле лишь как примету на дороге у «водопровода верхнего пруда», и его место следует за местом пруда, которое само неясно. Если пруд был у источника Гион, поле лежало в долине Кедрон под городом Давида, быть может у Ен-Рогела, чьё имя толковали как «источник белильщика»; если пруд лежал к северу или северо-западу от города, то и поле было на этой стороне, где Иосиф Флавий позднее знал «памятник Белильщика» у угловой башни третьей стены. Ничего от него не найдено."
    - "Исаия был послан встретить царя Ахаза «к концу водопровода верхнего пруда, на дорогу к полю белильничьему», когда Дамаск и Израиль грозили Иерусалиму в 734 г. до н. э. В 701 г. до н. э. Рабсак, посланный Сеннахиримом из Лахиса с большим войском, «остановился у водопровода верхнего пруда на дороге поля белильничьего» и, так что слышал город, звал народ на стене отступиться от Езекии и выйти к нему. Обеим сценам нужно место под самой стеной, у дороги, с водой: двор белильщиков был таким местом."
    - "Позднейшей истории у поля нет. Долина под городом Давида и земля к западу от Яффских ворот — два места, где его ищут, — сегодня это Сильван и парк вокруг пруда Мамилла."
