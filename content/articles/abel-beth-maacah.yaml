body:
  en:
    - "Abel-beth-maacah was the northernmost town of Israel, on a high mound at the head of the Hula valley, about 6 km west of Dan and beside the modern border with Lebanon. The site is Tel Abel Beth Maacah (Tell Abil el-Qameh), whose Arabic name kept the biblical one. Abel means a meadow, and Beth-maacah ties the town to Maacah, the small Aramean kingdom to the north-east that fought David beside the Ammonites; the Chronicler calls the town Abel-maim, Abel of the waters, for the springs at its foot. Excavations since 2013 have found a large fortified city of the Canaanite period and an Israelite town of the Iron Age, with a finely carved faience head of a bearded king or dignitary from the ninth century BC."
    - "When Sheba son of Bichri raised Israel against David, he fled “unto Abel, and to Beth-maachah”, and Joab's army “cast up a bank against the city”. A wise woman called from the wall: “They were wont to speak in old time, saying, They shall surely ask counsel at Abel: and so they ended the matter”; her city, she said, was “a city and a mother in Israel”. Joab asked only for the rebel, the people cut off Sheba's head and threw it over the wall, and the siege was lifted."
    - "The town lay on the road of invaders from the north. Ben-hadad of Damascus, hired by Asa of Judah against Baasha, “smote Ijon, and Dan, and Abel-beth-maachah, and all Cinneroth, with all the land of Naphtali”; and in 733–732 BC Tiglath-pileser III of Assyria “took Ijon, and Abel-beth-maachah, and Janoah, and Kedesh, and Hazor, and Gilead, and Galilee, all the land of Naphtali, and carried them captive to Assyria”. Older editions of the Assyrian king's inscriptions read a town “Abilakka” on the border of the house of Omri and took it for Abel-beth-maacah; the current edition reads Abil-shitti, Abel-shittim beyond the Jordan. The mound was settled again in Persian, Hellenistic and later times; the village of Abil el-Qameh stood on it until 1948, and today the site lies in Israel beside Metula, with the excavation of the Hebrew University and Azusa Pacific University continuing."
  ru:
    - "Авел-Беф-Мааха была самым северным городом Израиля, на высоком холме у верхнего края долины Хула, примерно в 6 км к западу от Дана и рядом с нынешней границей с Ливаном. Это Тель-Авель-Бет-Мааха (Телль-Абиль-эль-Камх), чьё арабское название сохранило библейское. Авел значит луг, а Беф-Мааха связывает город с Маахой, малым арамейским царством к северо-востоку, воевавшим с Давидом на стороне Аммонитян; летописец зовёт город Авелмаим, Авел вод, по источникам у его подножия. Раскопки, идущие с 2013 года, открыли большой укреплённый город ханаанской поры и израильский город железного века, а в нём тонко вырезанную фаянсовую голову бородатого царя или вельможи IX века до н. э."
    - "Когда Савей, сын Бихри, поднял Израиль против Давида, Савей ушёл «до Авела-Беф-Мааха», и войско Иоава «насыпали вал пред городом». Умная женщина позвала со стены: «прежде говаривали: “кто хочет спросить, спроси в Авеле”; и так решали дело»; её город, сказала она, — «мать городов в Израиле». Иоав потребовал только мятежника, жители отсекли Савею голову и бросили её за стену, и осада была снята."
    - "Город лежал на пути завоевателей с севера. Венадад Дамасский, нанятый Асой Иудейским против Ваасы, «поразил Аин и Дан и Авел-Беф-Мааху и весь Киннероф, по всей земле Неффалима», а в 733–732 гг. до н. э. Феглаффелласар III Ассирийский «взял Ион, Авел-Беф-Мааху, и Ианох, и Кедес, и Асор, и Галаад, и Галилею, всю землю Неффалимову, и переселил их в Ассирию». Старые издания надписей ассирийского царя читали на границе дома Амврия город «Абилакка» и видели в нём Авел-Беф-Мааху; нынешнее издание читает Абиль-шитти, то есть Аве-Ситтим за Иорданом. Холм заселялся вновь в персидское, эллинистическое и позднейшее время; деревня Абиль-эль-Камх стояла на нём до 1948 года, а сегодня место лежит в Израиле рядом с Метулой, и раскопки Еврейского университета и Университета Азуса-Пасифик продолжаются."
  uk:
    - "Авел-Бет-Мааха був найпівнічнішим містом Ізраїлю, на високому пагорбі при витоку долини Хула, приблизно за 6 км на захід від Дану, біля сучасного кордону з Ліваном. Це місце — Тель-Авел-Бет-Мааха (Телль-Абіль-ель-Камх), чия арабська назва зберегла біблійну. «Авел» означає луг, а «Бет-Мааха» пов'язує місто з Маахою, невеликим арамейським царством на північному сході, яке воювало з Давидом разом з аммонітянами; хронікар називає місто Авел-Маїм, «Авел вод», через джерела біля його підніжжя. Розкопки від 2013 року виявили велике укріплене місто ханаанської доби та ізраїльське місто залізної доби, а також тонко різьблену фаянсову голову бородатого царя чи сановника IX століття до н. е."
    - "Коли Шева, син Біхрі, підняв Ізраїль проти Давида, він утік «до Абел-Бет-Мааха», і люди Йоава «насипали проти городу вал». Мудра жінка гукнула з муру: «У давні давна була така приповідка: хто хоче питати, нехай питає ув Абелї, й так чинено»; її місто, казала вона, було містом «матїр городів ув Ізраїлї». Йоав просив лише бунтівника, народ відтяв Шеві голову й перекинув її через мур, і облогу було знято."
    - "Місто лежало на шляху загарбників з півночі. Бен-Гадад Дамаський, найнятий Асою Юдейським проти Вааси, «звоював Анн і Дан і Абел-Бет-Мааху й увесь Киннерот, — всю землю Нефталїєву»; а в 733–732 рр. до н. е. Тіглатпаласар III Ассирійський «звоював Йон, Абел-бет-Мааху, Янох, Кедес і Асор, Галаад і Галилею, усю землю Нефталїєву, та й одвів їх в Ассирию». Старіші видання написів ассирійського царя читали місто «Абілакка» на кордоні дому Омрі й вважали його Авел-Бет-Маахою; нинішнє видання читає Абіл-шітті, тобто Авел-Ситтім за Йорданом. Пагорб знову заселяли за перської, елліністичної та пізніших епох; село Абіль-ель-Камх стояло на ньому до 1948 року, а нині це місце лежить в Ізраїлі поруч із Метулою, і розкопки Єврейського університету та Університету Азуса Пасифік тривають."
  es:
    - "Abel-bet-maaca era la ciudad más septentrional de Israel, sobre un alto montículo a la cabecera del valle de Hula, a unos 6 km al oeste de Dan y junto a la actual frontera con el Líbano. El sitio es Tel Abel Beth Maacah (Tell Abil el-Qameh), cuyo nombre árabe conservó el bíblico. Abel significa prado, y Bet-maaca vincula la ciudad con Maaca, el pequeño reino arameo del nordeste que combatió a David junto a los amonitas; el cronista llama a la ciudad Abel-maim, Abel de las aguas, por los manantiales que hay a sus pies. Las excavaciones desde 2013 han hallado una gran ciudad fortificada de época cananea y una población israelita de la edad del Hierro, con una cabeza de fayenza finamente tallada de un rey o dignatario barbado del siglo IX a. C."
    - "Cuando Seba hijo de Bichri levantó a Israel contra David, huyó «hasta Abel y Beth-maachâ», y el ejército de Joab «pusieron baluarte contra la ciudad». Una mujer sabia gritó desde el muro: «Antiguamente solían hablar, diciendo: Quien preguntare, pregunte en Abel: y así concluían»; su ciudad, dijo, era «una ciudad que es madre de Israel». Joab solo pidió al rebelde, el pueblo cortó la cabeza de Seba y la arrojó por encima del muro, y se levantó el asedio."
    - "La ciudad estaba en el camino de los invasores del norte. Ben-adad de Damasco, contratado por Asa de Judá contra Baasa, «hirió á Ahión, y á Dan, y á Abel-beth-maachâ, y á toda Cinneroth, con toda la tierra de Nephtalí»; y en 733–732 a. C. Tiglat-pileser III de Asiria «tomó á Ahión, Abel-beth-maachâ, y Janoa, y Cedes, y Asor, y Galaad, y Galilea, y toda la tierra de Nephtalí; y trasportólos á Asiria». Las ediciones antiguas de las inscripciones del rey asirio leían una ciudad «Abilakka» en la frontera de la casa de Omri y la identificaban con Abel-bet-maaca; la actual lee Abil-shitti, Abel-sitim, al otro lado del Jordán. El montículo fue habitado de nuevo en época persa, helenística y posteriores; la aldea de Abil el-Qameh se alzó sobre él hasta 1948, y hoy está en Israel junto a Metula, donde excavan las universidades Hebrea y Azusa Pacific."
  pt:
    - "Abel-Bete-Maacá era a cidade mais setentrional de Israel, num alto montículo na cabeceira do vale de Hula, cerca de 6 km a oeste de Dã e junto à atual fronteira com o Líbano. O sítio é Tel Abel Beth Maacah (Tell Abil el-Qameh), cujo nome árabe conservou o bíblico. Abel significa prado, e Bete-Maacá liga a cidade a Maacá, o pequeno reino arameu a nordeste que lutou contra Davi ao lado dos amonitas; o Cronista chama a cidade de Abel-Maim, Abel das águas, pelas fontes ao seu pé. Escavações desde 2013 revelaram uma grande cidade fortificada do período cananeu e uma cidade israelita da Idade do Ferro, com uma cabeça de faiança finamente esculpida de um rei ou dignitário barbudo do século IX a.C."
    - "Quando Seba, filho de Bicri, levantou Israel contra Davi, fugiu “até Abel, a Bete-Maaca”, e o exército de Joabe “construiu uma rampa de cerco contra a cidade”. Uma mulher sábia gritou do alto da muralha: “Antigamente costumavam dizer: ‘Certamente pedirão conselho em Abel’, e assim resolviam uma questão”; a sua cidade, disse ela, era “uma cidade e uma mãe em Israel”. Joabe pediu apenas o rebelde, o povo cortou a cabeça de Seba e a jogou por cima da muralha, e o cerco foi levantado."
    - "A cidade ficava na rota dos invasores vindos do norte. Ben-Hadade de Damasco, contratado por Asa de Judá contra Baasa, “atacou Ijom, Dã, Abel-Bete-Maaca, e toda Quinerete, com toda a terra de Naftali”; e em 733–732 a.C. Tiglate-Pileser III da Assíria “tomou Ijom, Abel-Bete-Maaca, Janoa, Quedes, Hazor, Gileade e a Galileia, toda a terra de Naftali; e os levou cativos para a Assíria”. Edições antigas das inscrições do rei assírio liam uma cidade “Abilakka” na fronteira da casa de Onri e a tomavam por Abel-Bete-Maacá; a edição atual lê Abil-shitti, Abel-Sitim, além do Jordão. O montículo foi povoado de novo nas épocas persa, helenística e posteriores; a aldeia de Abil el-Qameh esteve sobre ele até 1948, e hoje o sítio fica em Israel, junto a Metula, e a escavação da Universidade Hebraica e da Universidade Azusa Pacific continua."
  de:
    - "Abel-Bet-Maacha war die nördlichste Stadt Israels, auf einem hohen Hügel am Kopf des Hulatals, etwa 6 km westlich von Dan und an der heutigen Grenze zum Libanon. Der Ort ist Tel Abel Beth Maacah (Tell Abil el-Qameh), dessen arabischer Name den biblischen bewahrt hat. Abel bedeutet Wiese, und Bet-Maacha verbindet die Stadt mit Maacha, dem kleinen aramäischen Königreich im Nordosten, das neben den Ammonitern gegen David kämpfte; der Chronist nennt die Stadt Abel-Maim, Abel der Wasser, nach den Quellen an ihrem Fuß. Grabungen seit 2013 fanden eine große befestigte Stadt der Kanaanäerzeit und eine israelitische Stadt der Eisenzeit, dazu den fein gearbeiteten Fayence-Kopf eines bärtigen Königs oder Würdenträgers aus dem 9. Jahrhundert v. Chr."
    - "Als Scheba, der Sohn Bichris, Israel gegen David aufwiegelte, floh er „gen Abel und Beth-Maacha“, und Joabs Heer „schüttete einen Wall gegen die Stadt hin“. Eine kluge Frau rief von der Mauer: „Vorzeiten sprach man: Wer fragen will, der frage zu Abel; und so ging's wohl aus“; ihre Stadt, sagte sie, sei „Stadt und Mutter in Israel“. Joab verlangte nur den Aufrührer, das Volk schlug Scheba den Kopf ab und warf ihn über die Mauer, und die Belagerung wurde aufgehoben."
    - "Die Stadt lag am Weg der Eroberer aus dem Norden. Ben-Hadad von Damaskus, von Asa von Juda gegen Baesa angeworben, „schlug Ijon und Dan und Abel-Beth-Maacha, das ganze Kinneroth samt dem Lande Naphthali“; und 733–732 v. Chr. „nahm“ Tiglat-Pileser III. von Assyrien „Ijon, Abel-Beth-Maacha, Janoah, Kedes, Hazor, Gilead und Galiläa, das ganze Land Naphthali, und führte sie weg nach Assyrien“. Ältere Ausgaben der Königsinschriften lasen an der Grenze des Hauses Omri eine Stadt „Abilakka“ und hielten sie für Abel-Bet-Maacha; die heutige liest Abil-Schitti, Abel-Schittim jenseits des Jordan. Der Hügel wurde in persischer, hellenistischer und späterer Zeit wieder besiedelt; das Dorf Abil el-Qameh stand darauf bis 1948, und heute liegt der Ort in Israel neben Metula, wo die Grabungen der Hebräischen Universität und der Azusa Pacific University weitergehen."
  fr:
    - "Abel-Beth-Maaca était la ville la plus septentrionale d’Israël, sur un haut tertre à la tête de la vallée de la Houla, à environ 6 km à l’ouest de Dan et contre l’actuelle frontière du Liban. Le site est Tel Abel Beth Maacah (Tell Abil el-Qameh), dont le nom arabe a gardé le nom biblique. Abel signifie « prairie », et Beth-Maaca rattache la ville à Maaca, petit royaume araméen du nord-est qui combattit David aux côtés des Ammonites ; le Chroniste l’appelle Abel-Maïm, Abel des eaux, d’après les sources à son pied. Les fouilles menées depuis 2013 ont mis au jour une grande cité fortifiée de l’époque cananéenne et une ville israélite de l’âge du Fer, avec une tête en faïence finement sculptée d’un roi ou dignitaire barbu du IXe siècle av. J.-C."
    - "Quand Schéba, fils de Bicri, souleva Israël contre David, il s’enferma dans Abel-Beth-Maaca, et l’armée de Joab « éleva contre la ville une terrasse ». Une femme habile cria du haut de la muraille : « Autrefois on avait coutume de dire : Que l’on consulte Abel ! Et tout se terminait ainsi » ; sa ville, dit-elle, était « une ville qui est une mère en Israël ». Joab ne demandait que le rebelle ; on coupa la tête de Schéba, on la jeta par-dessus la muraille, et le siège fut levé."
    - "Elle était sur la route des envahisseurs du nord. Ben-Hadad de Damas, appelé par Asa de Juda contre Baescha, « battit Ijjon, Dan, Abel-Beth-Maaca, tout Kinneroth, et tout le pays de Nephthali » ; et en 733-732 av. J.-C., Tiglath-Piléser III d’Assyrie « prit Ijjon, Abel-Beth-Maaca, Janoach, Kédesch, Hatsor, Galaad et la Galilée, tout le pays de Nephthali, et il emmena captifs les habitants en Assyrie ». D’anciennes éditions des inscriptions assyriennes lisaient « Abilakka », ville à la frontière de la maison d’Omri, et y voyaient Abel-Beth-Maaca ; l’actuelle lit Abil-shitti, Abel-Sittim au-delà du Jourdain. Le tertre fut réoccupé aux époques perse, hellénistique et suivantes ; le village d’Abil el-Qameh y resta jusqu’en 1948 ; le site est aujourd’hui en Israël, près de Metoula, et les fouilles de l’Université hébraïque et de l’Azusa Pacific University continuent."
  it:
    - "Abel-Bet-Maaca era la città più settentrionale d’Israele, su un alto tell all’inizio della valle di Hula, a circa 6 km a ovest di Dan e accanto all’attuale confine con il Libano. Il sito è Tel Abel Beth Maacah (Tell Abil el-Qameh), il cui nome arabo ha conservato quello biblico. Abel significa prato, e Bet-Maaca lega la città a Maaca, il piccolo regno arameo a nord-est che combatté contro Davide al fianco degli Ammoniti; il Cronista chiama la città Abel-Maim, Abel delle acque, per le sorgenti ai suoi piedi. Gli scavi dal 2013 hanno portato alla luce una grande città fortificata dell’epoca cananea e una città israelitica dell’età del Ferro, con una testa di faience finemente scolpita di un re o dignitario barbuto del IX secolo a.C."
    - "Quando Sheba figlio di Bicri sollevò Israele contro Davide, si rifugiò «fino ad Abel ed a Beth-Maaca», e gli uomini di Ioab, venuti ad assediarla, «innalzarono contro la città un bastione». Una donna saggia gridò dalle mura: «Una volta si soleva dire: Si domandi consiglio ad Abel! ed era affar finito»; la sua città, disse, era «una città che è una madre in Israele». Ioab chiese soltanto il ribelle, il popolo tagliò la testa a Sheba e la gettò oltre le mura, e l’assedio fu tolto."
    - "La città si trovava sulla via degli invasori dal nord. Ben-Adad di Damasco, assoldato da Asa di Giuda contro Baasa, «espugnò Ijon, Dan, Abel-Beth-Maaca, tutta la contrada di Kinneroth con tutto il paese di Neftali»; e nel 733–732 a.C. Tiglat-Pilèser III d’Assiria «prese Ijon, Abel-Beth-Maaca, Janoah, Kedesh, Hatsor, Galaad, la Galilea, tutto il paese di Neftali, e ne menò gli abitanti in cattività in Assiria». Le vecchie edizioni delle iscrizioni del re leggevano una città «Abilakka» al confine della casa di Omri e la identificavano con Abel-Bet-Maaca; l’edizione attuale legge Abil-shitti, l’Abel-Sittim al di là del Giordano. Il tell fu riabitato in epoca persiana, ellenistica e oltre; il villaggio di Abil el-Qameh vi sorse fino al 1948, e oggi il sito è in Israele accanto a Metula, con gli scavi dell’Università ebraica e della Azusa Pacific University in corso."
  pl:
    - "Abel-Bet-Maaka było najdalej na północ wysuniętym miastem Izraela, na wysokim tellu u wylotu doliny Hula, około 6 km na zachód od Dan, tuż przy dzisiejszej granicy z Libanem. Miejscem tym jest Tel Abel Bet Maaka (Tell Abil el-Qameh), którego arabska nazwa zachowała biblijną. Abel oznacza łąkę, a Bet-Maaka wiąże miasto z Maaką, małym królestwem aramejskim na północnym wschodzie, które walczyło z Dawidem u boku Ammonitów; Kronikarz nazywa je Abel-Maim, Abel wód, od źródeł u jego stóp. Wykopaliska od 2013 roku odsłoniły wielkie ufortyfikowane miasto z okresu kananejskiego i izraelskie miasto z epoki żelaza, a w nim misternie rzeźbioną fajansową głowę brodatego króla lub dostojnika z IX wieku p.n.e."
    - "Gdy Szeba, syn Bikriego, poderwał Izraela przeciw Dawidowi, uciekł „aż do Abel i Betmaacha”, a wojsko Joaba obległo miasto i „usypali szańce przeciw miastu”. Mądra kobieta zawołała z muru: „Powiadano przedtem, mówiąc: Koniecznie pytać się będą w Abelu, a tak się wszystko sprawi”; jej miasto było, jak mówiła, „jedno miasto z spokojnych i wiernych w Izraelu”, a Joab chciał zatracić „miasto i matkę w Izraelu”. Joab żądał tylko buntownika, lud odciął Szebie głowę i wyrzucił ją za mur, a oblężenie zdjęto."
    - "Miasto leżało na drodze najeźdźców z północy. Ben-Hadad z Damaszku, wynajęty przez Asę z Judy przeciw Baaszy, „zburzył Hijon i Dan i Abelbetmaachę, i wszystko Cynnerot, i wszystkę ziemię Neftalim”; a w latach 733–732 p.n.e. Tiglat-Pileser III z Asyrii „wziął Ajon i Abelbetmaacha, i Jonoe, i Kiedes, i Azor, i Galaad, i Galileę, wszystkę ziemię Neftali, a przeniósł obywatele jej do Assyryi”. Starsze wydania inskrypcji króla asyryjskiego czytały miasto „Abilakka” na granicy domu Omriego i uważały je za Abel-Bet-Maaka; obecne wydanie czyta Abil-szitti, czyli Abel-Szittim za Jordanem. Tell zasiedlono ponownie w czasach perskich, hellenistycznych i późniejszych; wieś Abil el-Qameh stała na nim do 1948 roku, dziś miejsce leży w Izraelu obok Metuli, a wykopaliska Uniwersytetu Hebrajskiego i Azusa Pacific University trwają."
  nl:
    - "Abel-Beth-Maächa was Israëls noordelijkste stad, op een hoge heuvel aan het bovenste einde van de Hulavallei, zo’n 6 km ten westen van Dan, naast de huidige grens met Libanon. Het is Tel Abel Beth Maacha (Tell Abil el-Qameh), waarvan de Arabische naam de bijbelse bewaarde. Abel betekent weide, en Beth-Maächa verbindt de stad met Maächa, het kleine Arameese koninkrijk in het noordoosten dat met de Ammonieten tegen David streed; de Kroniekschrijver noemt de stad Abel-Maïm, Abel der wateren, naar de bronnen aan haar voet. Opgravingen sinds 2013 vonden een grote versterkte Kanaänitische stad en een Israëlitische stad uit de ijzertijd, met een fijn gesneden fajansen hoofd van een bebaarde koning of hoogwaardigheidsbekleder uit de negende eeuw v.Chr."
    - "Toen Seba, de zoon van Bichri, Israël tegen David opriep, vluchtte hij “naar Abel, te weten, Beth-Maacha”, en Joabs leger wierp “een wal op tegen de stad”. Een wijze vrouw riep van de muur: “In voortijden spraken zij gemeenlijk, zeggende: Zij zullen zonder twijfel te Abel vragen; en alzo volbrachten zij het”; haar stad, zei zij, was “een stad, die een moeder is in Israel”. Joab vroeg alleen om de opstandeling, het volk hieuw Seba’s hoofd af en wierp het over de muur, en het beleg werd opgeheven."
    - "De stad lag aan de weg van de indringers uit het noorden. Ben-Hadad van Damascus, door Asa van Juda tegen Baësa ingehuurd, “sloeg Ijon, en Dan, en Abel Beth-Maacha, en het ganse Cinneroth, met het ganse land Nafthali”; en in 733–732 v.Chr. “nam” Tiglat-Pileser III “Ijon in, en Abel-Beth-maacha, en Janoah, en Kedes, en Hazor, en Gilead, en Galilea, het ganse land van Nafthali; en hij voerde hen weg naar Assyrie”. Oudere edities van de Assyrische koningsinscripties lazen een stad “Abilakka” aan de grens van het huis van Omri en hielden die voor Abel-Beth-Maächa; de huidige leest Abil-sjitti, Abel-Sittim voorbij de Jordaan. De heuvel was weer bewoond in de Perzische, Hellenistische en latere tijd; het dorp Abil el-Qameh stond er tot 1948, en nu ligt de plaats in Israël naast Metula, waar de Hebreeuwse Universiteit en de Azusa Pacific University blijven graven."
  cs:
    - "Ábel-bét-maaka bylo nejsevernější město Izraele, na vysokém pahorku na horním konci údolí Chula, asi 6 km západně od Danu a při dnešní hranici s Libanonem. Místem je Tel Abel Beth Maacah (Tell Abil el-Qameh), jehož arabský název uchoval biblický. Ábel znamená louku a Bét-maaka spojuje město s Maakou, malým aramejským královstvím na severovýchodě, které bojovalo s Davidem po boku Amonitů; kronikář nazývá město Ábel-maim, Ábel vod, podle pramenů u jeho paty. Vykopávky od roku 2013 odkryly velké opevněné město z kenaanského období a izraelské město doby železné s jemně vyřezanou fajánsovou hlavou vousatého krále nebo hodnostáře z 9. století př. n. l."
    - "Když Šeba, syn Bikrího, pozdvihl Izrael proti Davidovi, utekl „do Abel Betmaacha“ a Joábovi muži „udělali násyp proti městu“. Z hradby zvolala rozumná žena: „Takť jsou rozmlouvali hned s počátku, řkouce: Bez pochyby žeť se ptáti budou Abelských, a tak se spraví“; její město, řekla, je „hlavní město v Izraeli“. Joáb žádal jen vzbouřence, lid Šebovi sťal hlavu a vyhodil ji přes zeď a obléhání bylo zrušeno."
    - "Město leželo na cestě útočníků od severu. Ben-hadad Damašský, najatý Asou Judským proti Baešovi, „dobyl Jon a Dan, též Abelbetmaachy, i všeho Ceneretu, a vší země Neftalím“; a v letech 733–732 př. n. l. Tiglatpilesar III. Asyrský „vzal Jon a Abel, dům Maacha a Janoe, Kedes a Azor, i Galád a Galilei, i všecku zemi Neftalím, a přenesl obyvatele jejich do Assyrie“. Starší vydání nápisů asyrského krále čtou město „Abilakka“ na hranici domu Omrího a pokládaly je za Ábel-bét-maaku; současné vydání čte Abil-šitti, Ábel-šitim za Jordánem. Pahorek byl znovu osídlen v době perské, helénistické i později; vesnice Abil el-Qameh na něm stála do roku 1948 a dnes leží místo v Izraeli vedle Metuly a vykopávky Hebrejské univerzity a Azusa Pacific University pokračují."
  sv:
    - "Avel-Bet-Maaka var Israels nordligaste stad, på en hög kulle vid övre änden av Hulaslätten, omkring 6 km väster om Dan och intill den nuvarande gränsen mot Libanon. Platsen är Tel Abel Beth Maacah (Tell Abil el-Qameh), vars arabiska namn har bevarat det bibliska. Abel betyder äng, och Bet-Maaka knyter staden till Maaka, det lilla arameiska kungariket i nordost som stred mot David vid ammoniternas sida; Krönikeförfattaren kallar staden Avel-Mayim, vattnens Avel, efter källorna vid dess fot. Utgrävningar sedan 2013 har funnit en stor befäst stad från kanaanéisk tid och en israelitisk stad från järnåldern, med ett fint snidat fajanshuvud av en skäggig kung eller dignitär från 800-talet f.Kr."
    - "När Sheva, Bikris son, reste Israel mot David flydde han ”till Abel och Bet-Maaka”, och Joavs här ”kastade upp mot staden en vall”. En klok kvinna ropade från muren: ”Fordom plägade man säga så: ’I Abel skall man fråga till råds’; sedan kunde man utföra sina planer.” Hennes stad, sade hon, var ”en stad som är en moder i Israel”. Joav begärde bara upprorsmannen, folket högg huvudet av Sheva och kastade ut det över muren, och belägringen hävdes."
    - "Staden låg vid de vägar längs vilka inkräktare kom från norr. Ben-Hadad av Damaskus, som Asa av Juda hade lejt mot Basha, ”förhärjade Ijon, Dan, Abel-Bet-Maaka och hela Kinarot jämte hela Naftali land”; och åren 733–732 f.Kr. ”intog” Tiglat-Pileser III av Assyrien ”Ijon, Abel-Bet-Maaka, Janoa, Kedes, Hasor, Gilead och Galileen, hela Naftali land, och förde folket bort till Assyrien”. Äldre utgåvor av den assyriske kungens inskriptioner läser en stad ”Abilakka” vid gränsen till Omris hus och höll den för Avel-Bet-Maaka; den nuvarande utgåvan läser Abil-shitti, Avel-Hashittim på andra sidan Jordan. Kullen bosattes på nytt under persisk, hellenistisk och senare tid; byn Abil el-Qameh låg på den till 1948, och i dag ligger platsen i Israel intill Metula, där Hebreiska universitetets och Azusa Pacific Universitys utgrävning fortsätter."
  nb:
    - "Abel-Bet-Maaka var den nordligste byen i Israel, på en høy tell ved øvre ende av Huladalen, omtrent 6 km vest for Dan og ved siden av dagens grense mot Libanon. Stedet er Tel Abel Beth Maacah (Tell Abil el-Qameh), hvis arabiske navn har bevart det bibelske. Abel betyr en eng, og Bet-Maaka knytter byen til Maaka, det lille arameiske riket i nordøst som kjempet mot David sammen med ammonittene; Krønikeboken kaller byen Abel-Ma'im, «vannenes Abel», etter kildene ved foten av den. Utgravninger siden 2013 har funnet en stor befestet by fra kana'anittisk tid og en israelittisk by fra jernalderen, med et fint skåret fajansehode av en skjegget konge eller høyere embetsmann fra 800-tallet f.Kr."
    - "Da Sjeba, Bikris sønn, reiste Israel mot David, dro han «til Abel og Bet-Ma'aka», og Joabs hær «opkastet en voll mot byen». En klok kvinne ropte fra muren: «Før pleide folk å si så: En skal spørre sig for i Abel, og så utførte de det»; byen hennes var, sa hun, «en by, en mor i Israel». Joab ba bare om opprøreren, folket hugg hodet av Sjeba og kastet det over muren, og beleiringen ble hevet."
    - "Byen lå ved veien for inntrengere fra nord. Ben-Hadad av Damaskus, leid av Asa av Juda mot Basja, «inntok Ijon og Dan og Abel-Bet-Ma'aka og hele Kinneret med hele Naftalis land»; og i 733–732 f.Kr. «tok» Tiglat-Pileser III av Assyria «Ijon og Abel-Bet-Ma'aka og Janoah og Kedes og Hasor og Gilead og Galilea, hele Naftalis land; og han bortførte innbyggerne til Assyria». Eldre utgaver av den assyriske kongens innskrifter leser en by «Abilakka» på grensen til Omris hus og tok den for Abel-Bet-Maaka; den nåværende utgaven leser Abil-sjitti, Abel-Sittim hinsides Jordan. Tellen ble bosatt igjen i persisk, hellenistisk og senere tid; landsbyen Abil el-Qameh lå på den til 1948, og i dag ligger stedet i Israel ved Metula, mens utgravningen til Det hebraiske universitet og Azusa Pacific University fortsetter."
  tl:
    - "Ang Abel-bethmaacha ang pinakahilagang bayan ng Israel, sa isang mataas na burol sa dulo ng libis ng Hula, mga 6 km sa kanluran ng Dan at katabi ng makabagong hangganan sa Libano. Ang lugar ay ang Tel Abel Beth Maacah (Tell Abil el-Qameh), na ang pangalang Arabe ay nagpanatili sa pangalang biblikal. Ang Abel ay nangangahulugang parang, at iniuugnay ng Beth-maacha ang bayan sa Maaca, ang maliit na kahariang Arameo sa hilagang-silangan na nakipaglaban kay David kasama ng mga Ammonita; tinatawag ng may-akda ng Mga Cronica ang bayan na Abel-maim, ang Abel ng mga tubig, dahil sa mga bukal sa paanan nito. Ang mga paghuhukay mula 2013 ay nakatuklas ng isang malaking kutang lungsod ng panahong Canaanita at isang bayang Israelita ng Panahon ng Bakal, kasama ang isang pinong inukit na ulo ng faience ng isang may balbas na hari o dignitaryo noong ika-9 na siglo BK."
    - "Nang pasiklabin ni Seba na anak ni Bichri ang Israel laban kay David, tumakas siya “sa Abel, at sa Beth-maacha”, at ang hukbo ni Joab ay “nagtindig ng isang bunton laban sa bayan”. Sumigaw ang isang pantas na babae mula sa kuta: “Sinasalita noong unang panahon, na sinasabi, Sila'y walang pagsalang hihingi ng payo sa Abel; at gayon nila tinapos ang usap.” Sinabi niyang ang kaniyang bayan ay isang bayan at isang ina sa Israel. Ang hiningi lamang ni Joab ay ang rebelde, pinugot ng bayan ang ulo ni Seba at inihagis sa kuta, at inalis ang pagkubkob."
    - "Daan ito ng mga mananakop mula sa hilaga. Si Ben-adad ng Damasco, na inupahan ni Asa ng Juda laban kay Baasa, ay sumalakay at “sinaktan ang Ahion at ang Dan, at ang Abel-bethmaacha at ang buong Cinneroth, sangpu ng buong lupain ng Nephtali”; noong 733–732 BK, lumusob si Tiglath-pileser III ng Asiria at “sinakop ang Ihion, at ang Abel-bethmaacha, at ang Janoa, at ang Cedes, at ang Asor, at ang Galaad, at ang Galilea, ang buong lupain ng Nephtali; at kaniyang dinalang bihag sila sa Asiria”. Ang “Abilakka” sa hangganan ng bahay ni Omri, na itinuring ng lumang edisyon ng inskripsiyon ng Asirio na Abel-bethmaacha, ay Abil-shitti (Abel-sitim sa ibayo ng Jordan) sa bagong edisyon. Muling tinirhan ito sa panahong Persiano, Helenistiko at kalaunan; may nayong Abil el-Qameh rito hanggang 1948; ngayon ay nasa Israel sa tabi ng Metula, hinuhukay pa ng Hebrew University at Azusa Pacific University."
  da:
    - "Abel-Bet-Maaka var Israels nordligste by, på en høj tell for enden af Hula-dalen, omkring 6 km vest for Dan og ved den nuværende grænse til Libanon. Stedet er Tel Abel Beth Maacah (Tell Abil el-Qameh), hvis arabiske navn har bevaret det bibelske. Abel betyder en eng, og Bet-Maaka knytter byen til Maaka, det lille arameiske kongerige mod nordøst, der kæmpede mod David sammen med ammonitterne; Krønikeskriveren kalder byen Abel-Majim, vandenes Abel, efter kilderne ved dens fod. Udgravninger siden 2013 har fundet en stor befæstet by fra kana'anæisk tid og en israelitisk by fra jernalderen, med et fint udskåret fajancehoved af en skægget konge eller højtstående mand fra 800-tallet f.Kr."
    - "Da Sjeba, Bikris søn, rejste Israel mod David, flygtede han »indtil Abel, nemlig Beth-Maaka«, og Joabs hær »kastede en Vold op imod Staden«. En klog kvinde råbte fra muren: »Fordum plejede man saaledes at tale, sigende: Man skal spørge sig for i Abel, og saaledes fuldbyrdede man det«; hendes by var, sagde hun, »en Stad og en Moder i Israel«. Joab krævede kun oprøreren, folket huggede Sjebas hoved af og kastede det over muren, og belejringen blev hævet."
    - "Byen lå på invasionernes vej fra nord. Ben-Hadad af Damaskus, lejet af Asa af Juda mod Basja, »slog Ijon og Dan og Abel-Beth-Maaka og hele Kinneroth, tillige med alt Nafthalis Land«; og i 733–732 f.Kr. »tog« Tiglat-Pileser 3. af Assyrien »Ijon og Abel-Beth-Maaka og Ianoa og Kedes og Hasor og Gilead og Galilæa, alt Nafthalis Land, og han bortførte dem til Assyrien«. Ældre udgaver af den assyriske konges indskrifter læser en by »Abilakka« ved Omris hus' grænse og tog den for Abel-Bet-Maaka; den nuværende udgave læser Abil-sjitti, Abel-Sjittim hinsides Jordan. Tellen blev bosat igen i persisk, hellenistisk og senere tid; landsbyen Abil el-Qameh lå på den indtil 1948, og i dag ligger stedet i Israel ved Metula, hvor Det Hebraiske Universitet og Azusa Pacific University fortsætter udgravningen."
  sr:
    - "Авел-Вет-Маха био је најсевернији град Израиља, на високој хумци на северном крају долине Хуле, око 6 км западно од Дана и поред данашње границе с Ливаном. Налазиште је Тел Абел Бет Маака (Тел Абил ел-Камех), чије је арапско име сачувало библијско. Авел значи ливада, а Вет-Маха везује град за Маху, мало арамејско краљевство на североистоку које се са Амонцима борило против Давида; летописац град назива Авел-Мајим, Авел вода, по изворима у подножју. Ископавања од 2013. открила су велики утврђени град из хананског доба и израиљски град из гвозденог доба, с лепо изрезбареном главом од фајансе брадатог краља или достојанственика из 9. века п. н. е."
    - "Када је Сева син Вихријев подигао Израиљ против Давида, побегао је „до Авела и до Ветмахе“, а Јоавова војска „ископаше опкоп око града“. Мудра жена је с зида довикнула: „Од старине се говори: Ваља питати у Авелу. И тако се извршаваше“; Јоав, рекла је, хоће да затре „град, и то мајку у Израиљу“. Јоав је тражио само бунџију, народ је Севи одсекао главу и бацио је преко зида, и опсада је дигнута."
    - "Град је лежао на путу освајача са севера. Вен-Адад из Дамаска, ког је Аса Јудин најмио против Васе, „покори Ијон и Дан и Авел Ветмаху и сав Хинерот и сву земљу Нефталимову“; а 733–732. п. н. е. Теглат-Феласар III Асирски „узе Ијон и Авел-Ветмаху и Јанох и Кедес и Асор и Галад и Галилеју, сву земљу Нефталимову, и пресели народ оданде у Асирију“. Старија издања натписа асирског цара читају град „Абилака“ на међи дома Амријевог и поистовећују га с Авел-Вет-Махом; садашње издање чита Абил-шити, Вел-Сатим са друге стране Јордана. Хумка је поново насељена у персијско, хеленистичко и касније доба; село Абил ел-Камех стајало је на њој до 1948, а данас налазиште лежи у Израелу поред Метуле, а ископавања Хебрејског универзитета и Универзитета Азуса Пацифик трају."
  hu:
    - "Ábel-Bét-Maaka Izráel legészakibb városa volt, a Húla-völgy kezdeténél emelkedő magas halmon, Dántól mintegy 6 km-re nyugatra, a mai libanoni határ mellett. A hely a Tel Abel Beth Maacah (Tell Abil el-Qameh), amelynek arab neve megőrizte a bibliai nevet. Az ábel rétet jelent, a Bét-Maaka pedig a várost Maakához köti, az északkeleten fekvő kis arám királysághoz, amely az ammonitákkal együtt harcolt Dávid ellen; a Krónikák írója a várost Ábel-Májimnak, a vizek Ábelének nevezi a lábánál fakadó források miatt. A 2013 óta folyó ásatások egy nagy, megerősített kánaáni kori várost és egy vaskori izraelita várost tártak fel, a Kr. e. 9. századból pedig egy szakállas király vagy előkelőség finoman faragott fajanszfejét."
    - "Amikor Séba, a Bikri fia fellázította Izráelt Dávid ellen, „Abelán és Béth-Maakán” át menekült, és Joáb serege „nagy töltést emelt a város ellen”. Egy eszes asszony kiáltott le a falról: „Korábban azt szokták mondani: Kérdezzék meg Abelát, és úgy végeztek”; városa, mondta, „egy város és anya Izráelben”. Joáb csak a lázadót kérte, a nép levágta Séba fejét, és kidobta a falon, az ostrom pedig véget ért."
    - "A város az északról érkező hódítók útvonalán feküdt. A damaszkuszi Ben-Hadad, akit Ásza júdai király bérelt fel Baása ellen, „bevevé Hijont és Dánt, és Abel Beth-Maakát, és az egész Kinneróthot a Nafthali egész földével”; Kr. e. 733–732-ben III. Tiglat-Pileszer asszír király „foglalta el Hijont, Abélt, Beth-Maakát, Jánoát, Kédest, Hásort, Gileádot, Galileát és a Nafthali egész földét, és hurczolta el őket, Assiriába”. Az asszír király feliratainak régebbi kiadásai Omri háza határán „Abilakka” városát olvasták, és Ábel-Bét-Maakával azonosították; a jelenlegi kiadás Abil-sittit olvas, vagyis a Jordánon túli Ábel-Sittimet. A halmot a perzsa, a hellenisztikus és a későbbi korokban ismét benépesítették; az Abil el-Qameh falu 1948-ig állt rajta, a lelőhely ma Izráelben van, Metula mellett, a Héber Egyetem és az Azusa Pacific University ásatása pedig folytatódik."
  fi:
    - "Abel-Bet-Maaka oli Israelin pohjoisin kaupunki, korkealla kumpareella Hulan laakson yläpäässä, noin 6 km Daanista länteen ja nykyisen Libanonin rajan vieressä. Paikka on Tel Abel Beth Maacah (Tell Abil el-Qameh), jonka arabialainen nimi on säilyttänyt Raamatun nimen. Abel tarkoittaa niittyä, ja Bet-Maaka liittää kaupungin Maakaan, koillisessa sijainneeseen pieneen aramealaiseen kuningaskuntaan, joka taisteli Daavidia vastaan ammonilaisten rinnalla; Aikakirjojen kirjoittaja kutsuu kaupunkia nimellä Abel-Maim, vetten Abel, sen juurella olevien lähteiden vuoksi. Vuodesta 2013 jatkuneissa kaivauksissa on löydetty suuri kanaanilaiskauden linnoitettu kaupunki ja rautakauden israelilainen kaupunki sekä hienosti veistetty fajanssipää parrakkaasta kuninkaasta tai arvohenkilöstä 800-luvulta eaa."
    - "Kun Saba, Bikrin poika, nosti Israelin Daavidia vastaan, hän pakeni ”Aabeliin ja Beet-Maakaan”, ja Jooabin väki piiritti kaupunkia ja ”loivat kaupunkia vastaan vallin”. Viisas vaimo huusi muurilta: ”Muinoin oli tapana sanoa: ’On kysyttävä neuvoa Aabelista’, ja niin tuli valmista.” Hänen kaupunkinsa oli hänen sanojensa mukaan kaupunki, ”joka on äiti Israelissa”. Jooab vaati vain kapinallista, kansa löi Saban pään poikki ja heitti sen muurin yli, ja piiritys purettiin."
    - "Kaupunki oli pohjoisen hyökkääjien tiellä. Damaskoksen Benhadad, jonka Juudan Asa oli palkannut Baesaa vastaan, ”valtasi Iijonin, Daanin, Aabel-Beet-Maakan ja koko Kinnerotin ynnä koko Naftalin maan”; ja vuosina 733–732 eaa. Assyrian Tiglat-Pileser III ”valloitti Iijonin, Aabel-Beet-Maakan, Jaanoahin, Kedeksen, Haasorin, Gileadin ja Galilean, koko Naftalin maan, ja vei asukkaat pakkosiirtolaisuuteen Assuriin”. Assyrian kuninkaan kirjoitusten vanhemmat editiot lukevat Omrin suvun rajalla olevan kaupungin ”Abilakka” ja pitivät sitä Abel-Bet-Maakana; nykyinen editio lukee Abil-sitti, Abel-Sittim Jordanin tuolla puolen. Kumpu asutettiin uudelleen persialaisella, hellenistisellä ja myöhemmällä ajalla; Abil el-Qameh -kylä oli sillä vuoteen 1948 asti, ja nykyisin paikka on Israelissa Metulan vieressä, ja Heprealaisen yliopiston ja Azusa Pacific Universityn kaivaukset jatkuvat."
  vi:
    - "A-bên Bết-Ma-ca là thành cực bắc của Y-sơ-ra-ên, nằm trên một gò đất cao ở đầu thung lũng Hula, cách Đan khoảng 6 km về phía tây và sát biên giới hiện nay với Li-ban. Địa điểm này là Tel Abel Beth Maacah (Tell Abil el-Qameh), nơi tên Ả Rập vẫn giữ tên trong Kinh Thánh. Abel nghĩa là đồng cỏ, còn Bết-Ma-ca nối thành này với Ma-a-ca, vương quốc nhỏ của người A-ram ở phía đông bắc đã giao chiến với Đa-vít bên cạnh người Am-môn; tác giả sách Sử Ký gọi thành là A-bên-ma-im, tức A-bên của các dòng nước, nhờ những mạch nước ở chân gò. Các cuộc khai quật từ năm 2013 đã tìm thấy một thành kiên cố lớn thời Ca-na-an và một thị trấn của người Y-sơ-ra-ên thời Đồ Sắt, cùng một chiếc đầu bằng đồ sành tráng men được chạm trổ tinh xảo, mô tả một vị vua hay quan chức có râu, có niên đại thế kỷ 9 TCN."
    - "Khi Sê-ba con trai Biếc-ri xúi dân Y-sơ-ra-ên chống lại Đa-vít, hắn chạy trốn đến A-bên Bết-Ma-ca, và quân của Giô-áp “đắp lên một cái lũy cao hơn đồn thành”. Một người nữ khôn ngoan ở trên đầu đồn thành la lên: “Thuở xưa người ta có thói quen nói rằng: hãy đi hỏi ý dân A-bên; rồi mới nên việc như thế”; nàng nói thành mình là “chánh đô của Y-sơ-ra-ên”. Giô-áp chỉ đòi kẻ phản nghịch; dân chúng chém đầu Sê-ba và ném ra qua tường, và cuộc vây hãm được dỡ bỏ."
    - "Thành nằm trên đường của kẻ xâm lăng từ phương bắc. Bên-Ha-đát ở Đa-mách, được A-sa của Giu-đa thuê chống lại Ba-ê-sa, đã “chiếm lấy Y-giôn, Đan, A-bên-Bết-Ma-ca, và cả xứ Ki-nê-rốt với xứ Nép-ta-li”; và năm 733–732 TCN, Tiếc-la-Phi-lê-se III của A-si-ri “chiếm lấy Y-giôn, A-bên-Bết-Ma-ca, Gia-nô-ác, Kê-đe, Hát-so, miền Ga-la-át, miền Ga-li-lê, và cả địa phận Nép-ta-li; đoạn đem dân sự các xứ ấy sang A-si-ri”. Các bản in cũ bia văn của vua A-si-ri đọc ra một thành “Abilakka” ở biên giới nhà Ôm-ri và cho đó là A-bên Bết-Ma-ca; bản hiệu đính hiện hành đọc là Abil-shitti, tức A-bên-Si-tim bên kia sông Giô-đanh. Gò lại có người ở vào thời Ba Tư, Hy Lạp hóa và sau đó; làng Abil el-Qameh đứng trên đó cho đến năm 1948, và ngày nay địa điểm nằm trong lãnh thổ Israel cạnh Metula, nơi Đại học Hê-bơ-rơ và Đại học Azusa Pacific vẫn đang khai quật."
  ro:
    - "Abel-Bet-Maaca era cea mai nordică cetate a lui Israel, pe un tell înalt la capătul de nord al văii Hula, la aproximativ 6 km vest de Dan și lângă granița actuală cu Libanul. Locul este Tel Abel Beth Maacah (Tell Abil el-Qameh), al cărui nume arab a păstrat numele biblic. Abel înseamnă pajiște, iar Bet-Maaca leagă cetatea de Maaca, micul regat aramean din nord-est care a luptat împotriva lui David alături de amoniți; Cronicarul numește cetatea Abel-Maim, Abel al apelor, după izvoarele de la poalele ei. Săpăturile din 2013 încoace au scos la iveală o cetate mare întărită din epoca canaanită și o așezare israelită din epoca fierului, cu un cap de faianță fin sculptat, înfățișând un rege sau un demnitar cu barbă, din secolul al IX-lea î.Hr."
    - "Când Șeba, fiul lui Bicri, a ridicat pe Israel împotriva lui David, el a fugit „la Evel și la Vetmaha”, iar oamenii lui Ioab „au făcut șanț asupra cetății”. O femeie înțeleaptă a strigat de pe zid, cu un proverb vechi despre cei care vin să ceară sfat la Abel; cetatea ei, a spus ea, era o cetate-mamă în Israel. Ioab a cerut doar pe răzvrătit, poporul i-a tăiat capul lui Șeba și l-a aruncat peste zid, iar asediul a fost ridicat."
    - "Cetatea se afla pe drumul invadatorilor veniți din nord. Ben-Hadad din Damasc, tocmit de Asa al lui Iuda contra lui Baeșa, „a bătut pre Aiin și pre Dan și pre Avel al casei Maahei și tot Heneretul până la pământul Neftali”; iar în anii 733–732 î.Hr. Tiglat-Pileser al III-lea al Asiriei „a luat Aia și Avel și Tamaaha și Anioh și Kenez și Asor și Galaad și Galilea tot pământul Netalimului, și i-au mutat pre ei în Asiriea”. Edițiile vechi ale inscripțiilor regelui asirian citesc „Abilakka” la hotarul casei lui Omri, socotită Abel-Bet-Maaca; ediția actuală citește Abil-shitti, adică Abel-Sitim, dincolo de Iordan. Tellul a fost locuit din nou în epoca persană, elenistică și mai târziu; satul Abil el-Qameh s-a aflat pe el până în 1948, astăzi locul se află în Israel, lângă Metula, iar săpăturile Universității Ebraice și ale Universității Azusa Pacific continuă."
  bg:
    - "Авел-Бет-Маха бил най-северният град на Израил, на висока могила в началото на долината Хула, на около 6 км западно от Дан и до днешната граница с Ливан. Мястото е Тел Авел Бет Маха (Тел Абил ел-Камех), чието арабско име е запазило библейското. Авел означава ливада, а Бет-Маха свързва града с Маха — малкото арамейско царство на североизток, което воювало срещу Давид заедно с амонците; Летописецът нарича града Авел-Маим, Авел на водите, заради изворите в подножието му. Разкопките от 2013 г. насам откриха голям укрепен град от ханаанския период и израилски град от желязната епоха, както и фино изработена фаянсова глава на брадат цар или велможа от IX в. пр.н.е."
    - "Когато Шева, син на Бихри, вдигнал Израил срещу Давид, той побягнал „в Авел и в Вет-мааха“, а войската на Йоав „дигнаха окоп против града“. Една умна жена извикала от стената: „Имаха обичай да говорят в старо време и казваха: Нека идат да се допитат в Авел, и така да свършат работата“; градът ѝ, казала тя, бил „град и даже столица в Израил“. Йоав поискал само размирника, людете отсекли главата на Шева и я хвърлили през стената, а обсадата била вдигната."
    - "Градът лежал на пътя на нашествениците от север. Венадад от Дамаск, нает от Аса от Юда срещу Вааса, „порази Иион, и Дан, и Авел-вет-мааха, и всичкия Хинерот, с всичката Нефталимова земя“; а през 733–732 г. пр.н.е. асирийският цар Теглатфеласар III „превзе Иион, Авел-вет-мааха, и Янох, и Кадес, и Асор, и Галаад, и Галилея, всичката Нефталимова земя, и заведе ги пленници в Асирия“. По-старите издания на надписите на асирийския цар четат град „Абилакка“ на границата на дома на Омри и го вземат за Авел-Бет-Маха; сегашното издание чете Абил-шити, Авел-Ситим отвъд Йордан. Могилата била заселвана отново през персийско, елинистическо и по-късно време; селището Абил ел-Камех стояло на нея до 1948 г., а днес мястото е в Израил до Метула, като разкопките на Еврейския университет и на университета „Азуса Пасифик“ продължават."
