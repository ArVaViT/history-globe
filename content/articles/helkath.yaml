# Overview article (ADR 0007). Mainstream facts only; Helkath is unlocated; the candidate tells are given without choosing; the Hukok of Chronicles is noted as its counterpart.
id: helkath
place: a1d1918
title:
  en: "Helkath"
  ru: "Хелкаф"
body:
  en:
    - "Helkath, “portion” or “smooth field”, is a town on the border of Asher, named first in Joshua's description of the tribe's land: “their border was Helkath, and Hali, and Beten, and Achshaph”. It was later one of the four towns of Asher given with their pasture lands to the Levites of the family of Gershon: “Helkath with her suburbs, and Rehob with her suburbs; four cities.” In the parallel list of Levitical towns in Chronicles its place is taken by Hukok, and it is uncertain whether that is a variant of the same name or another town. It is not the Helkath-hazzurim at Gibeon where the young men of Joab and Abner fought."
    - "Nothing more is known, and the site is uncertain. The border list suggests the south-eastern edge of Asher, towards the Jezreel valley and the Kishon. The map follows those who place it at Tel Qashish, a mound on the Kishon near Jokneam, excavated in the 1970s and 1980s; others suggest Tel Regev or Tell Amr nearby, or equate it with Hukkok in Naphtali. No inscription has settled the question."
  ru:
    - "Хелкаф, «удел» или «гладкое поле», — город на границе Асира, первым названный в описании земли колена: «пределом их были: Хелкаф, Хали, Ветен и Ахсаф». Позже он стал одним из четырёх городов Асира, отданных с предместьями левитам из рода Гирсона: «Хелкаф и предместья его, Рехов и предместья его: четыре города». В параллельном списке левитских городов в Паралипоменон на его месте стоит Хукок, и неясно, вариант ли это того же имени или другой город. Это не Хелкаф-Хаццурим у Гаваона, где сражались юноши Иоава и Авенира."
    - "Больше ничего не известно, и место не установлено. Список границы указывает на юго-восточный край Асира, к Изреельской долине и Кисону. Карта следует тем, кто помещает его на Тель-Кашише, холме на Кисоне близ Иокнеама, раскопанном в 1970–1980-х годах; другие предлагают соседние Тель-Регев или Телль-Амр либо отождествляют его с Хуккоком в уделе Неффалима. Ни одна надпись вопроса не решила."
scripture:
