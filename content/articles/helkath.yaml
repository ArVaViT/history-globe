# Overview article (ADR 0007). Mainstream facts only; Helkath is unlocated; the candidate tells are given without choosing; the Hukok of Chronicles is noted as its counterpart.
id: helkath
place: a1d1918
title:
  en: "Helkath"
  ru: "Хелкаф"
  uk: "Хелкат"
  es: "Helcat"
  pt: "Helcate"
  de: "Helkat"
  fr: "Helkath"
body:
  en:
    - "Helkath, “portion” or “smooth field”, is a town on the border of Asher, named first in Joshua's description of the tribe's land: “their border was Helkath, and Hali, and Beten, and Achshaph”. It was later one of the four towns of Asher given with their pasture lands to the Levites of the family of Gershon: “Helkath with her suburbs, and Rehob with her suburbs; four cities.” In the parallel list of Levitical towns in Chronicles its place is taken by Hukok, and it is uncertain whether that is a variant of the same name or another town. It is not the Helkath-hazzurim at Gibeon where the young men of Joab and Abner fought."
    - "Nothing more is known, and the site is uncertain. The border list suggests the south-eastern edge of Asher, towards the Jezreel valley and the Kishon. The map follows those who place it at Tel Qashish, a mound on the Kishon near Jokneam, excavated in the 1970s and 1980s; others suggest Tel Regev or Tell Amr nearby, or equate it with Hukkok in Naphtali. No inscription has settled the question."
  ru:
    - "Хелкаф, «удел» или «гладкое поле», — город на границе Асира, первым названный в описании земли колена: «пределом их были: Хелкаф, Хали, Ветен и Ахсаф». Позже он стал одним из четырёх городов Асира, отданных с предместьями левитам из рода Гирсона: «Хелкаф и предместья его, Рехов и предместья его: четыре города». В параллельном списке левитских городов в Паралипоменон на его месте стоит Хукок, и неясно, вариант ли это того же имени или другой город. Это не Хелкаф-Хаццурим у Гаваона, где сражались юноши Иоава и Авенира."
    - "Больше ничего не известно, и место не установлено. Список границы указывает на юго-восточный край Асира, к Изреельской долине и Кисону. Карта следует тем, кто помещает его на Тель-Кашише, холме на Кисоне близ Иокнеама, раскопанном в 1970–1980-х годах; другие предлагают соседние Тель-Регев или Телль-Амр либо отождествляют его с Хуккоком в уделе Неффалима. Ни одна надпись вопроса не решила."
  uk:
    - "Хелкат, «частка» або «гладке поле», — місто на межі Асира, назване першим в описі землі коліна в Книзі Ісуса Навина: «А границї їх були Хелкат, Халі, Бетен і Ахсаф». Пізніше воно було одним із чотирьох міст Асира, даних із їхніми пасовищами левітам роду Гершома: «Хелкат укупі з пасовищами його, та Регоб укупі з пасовищами його — чотири городи». У паралельному переліку левітських міст у Хроніках його місце займає Хукок, і не певно, чи це варіант тієї самої назви, чи інше місто. Це не Хелкат-Хаццурім біля Гаваона, де билися юнаки Йоава й Авеніра."
    - "Більше нічого невідомо, і місце не певне. Перелік меж вказує на південно-східний край Асира, до долини Їзреель і Кішону. Карта йде за тими, хто розміщує його в Тель-Кашиші, городищі на Кішоні поблизу Йокнеама, розкопаному в 1970–1980-х роках; інші пропонують Тель-Регев або Телль-Амр поблизу, або ототожнюють його з Хуккоком у Нефталимі. Жоден напис не розв’язав питання."
  es:
    - "Helcat, «porción» o «campo liso», es una población en la frontera de Aser, nombrada primero en la descripción de la tierra de la tribu en Josué: «Y su término fué Helchât, y Halí, y Betén, y Axaph». Fue luego una de las cuatro ciudades de Aser dadas con sus ejidos a los levitas de la familia de Gersón: «A Helchâth con sus ejidos, y á Rehob con sus ejidos: cuatro villas». En la lista paralela de ciudades levíticas de Crónicas su lugar lo ocupa Hucoc, y es incierto si es una variante del mismo nombre u otra población. No es la Helcat-hazurim de Gabaón donde lucharon los jóvenes de Joab y de Abner."
    - "No se sabe nada más y el sitio es incierto. La lista de fronteras sugiere el borde sudoriental de Aser, hacia el valle de Jezreel y el Cisón. El mapa sigue a quienes la sitúan en Tel Qashish, un montículo en el Cisón cerca de Jocneam, excavado en los años setenta y ochenta; otros sugieren Tel Regev o Tell Amr, cercanos, o la identifican con Hucoc de Neftalí. Ninguna inscripción ha resuelto la cuestión."
  pt:
    - "Helcate, “porção” ou “campo liso”, é uma cidade na fronteira de Aser, nomeada primeiro na descrição que Josué faz da terra da tribo: “A sua fronteira foi Helcate, Hali, Béten, Acsafe”. Foi depois uma das quatro cidades de Aser dadas, com suas pastagens, aos levitas da família de Gérson: “Helcate com suas pastagens e Reobe com suas pastagens: quatro cidades.” Na lista paralela de cidades levíticas em Crônicas, o seu lugar é tomado por Hucoque, e é incerto se é variante do mesmo nome ou outra cidade. Não é a Helcate-Hazurim em Gibeão, onde lutaram os jovens de Joabe e Abner."
    - "Nada mais se sabe, e o sítio é incerto. A lista de fronteira sugere a orla sudeste de Aser, rumo ao vale de Jezreel e ao Quisom. O mapa segue os que a põem em Tel Qashish, um monte no Quisom perto de Jocneão, escavado nas décadas de 1970 e 1980; outros sugerem Tel Regev ou Tell Amr, ali perto, ou a equiparam a Hucoque em Naftali. Nenhuma inscrição resolveu a questão."
  de:
    - "Helkat, „Anteil“ oder „glattes Feld“, ist eine Stadt an der Grenze Assers, bei Josua zuerst in der Beschreibung des Stammesgebiets genannt: „Und ihr Gebiet war Helkath, Hali, Beten, Achsaph“. Später gehörte es zu den vier Städten Assers, die mit ihrem Weideland den Leviten der Familie Gerschon gegeben wurden: „Helkath und seine Vorstädte, Rehob und seine Vorstädte.“ In der Parallelliste der Levitenstädte in der Chronik steht an seiner Stelle Hukok, und es ist ungewiss, ob das eine Variante desselben Namens oder eine andere Stadt ist. Es ist nicht das Helkat-Hazzurim bei Gibeon, wo die jungen Männer Joabs und Abners kämpften."
    - "Mehr ist nicht bekannt, und die Lage ist ungewiss. Die Grenzliste deutet auf den südöstlichen Rand Assers, zum Jesreeltal und zum Kischon hin. Die Karte folgt denen, die es in Tel Kaschisch ansetzen, einem Hügel am Kischon bei Jokneam, in den 1970er und 1980er Jahren ausgegraben; andere schlagen Tel Regev oder das nahe Tell Amr vor oder setzen es mit Hukkok in Naftali gleich. Keine Inschrift hat die Frage entschieden."
  fr:
    - "Helkath, « portion » ou « champ lisse », est une ville sur la frontière d’Aser, nommée d’abord dans la description du pays de la tribu par Josué : « Leur limite passait par Helkath, Hali, Béthen, Acschaph ». Elle fut plus tard l’une des quatre villes d’Aser données avec leurs pâturages aux Lévites de la famille de Guerschon : « Helkath et sa banlieue, et Rehob et sa banlieue ; quatre villes. » Dans la liste parallèle des villes lévitiques des Chroniques, sa place est tenue par Hukok, et l’on ignore s’il s’agit d’une variante du même nom ou d’une autre ville. Ce n’est pas le Helkath-Hatsurim de Gabaon où s’affrontèrent les jeunes gens de Joab et d’Abner."
    - "On ne sait rien de plus, et le site est incertain. La liste de frontière suggère le bord sud-est d’Aser, vers la vallée de Jizreel et le Kison. La carte suit ceux qui la placent à Tel Qashish, un tertre sur le Kison près de Jokneam, fouillé dans les années 1970 et 1980 ; d’autres proposent Tel Regev ou Tell Amr tout proche, ou l’identifient à Hukkok en Nephthali. Aucune inscription n’a tranché la question."
scripture:
