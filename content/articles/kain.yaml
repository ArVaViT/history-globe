body:
  en:
    - "Kain is a town in the hill country of Judah, listed in the district south-east of Hebron with Maon, Carmel, Ziph and Juttah: “Cain, Gibeah, and Timnah; ten cities with their villages”. The same Hebrew word is also the name of the Kenites, the clan of Moses' father-in-law, some of whom settled in the south of Judah, and in Balaam's last oracles it stands for that people: “Nevertheless the Kenite shall be wasted, until Asshur shall carry thee away captive”. The map joins the two verses; the town may well have been a Kenite settlement, but the oracle speaks of the people, not of a town."
    - "Nothing more is known. The town is usually placed near the village of Bani Na'im, about 6 km east of Hebron, where the shrine of Nebi Yaqin, on a height above the wilderness of Judah, is thought to preserve the name; the map stands on the nearby ruin of Khirbet Bani Dar. The identification is likely rather than proved."
    - "The Survey of Western Palestine thought Cain was probably the ruin of Yukin and took that name for a slight corruption of the Hebrew Ha-Cain. At Khirbet Yukin its surveyors recorded foundations, caves and cisterns, and in the modern shrine a shallow, grave-like hollow that was pointed out as the grave of Cain. The Survey also quotes the French explorer Victor Guérin, who knew the shrine instead as a little mosque of Lot, with the prints of his feet shown in the rock. At Khirbet Bani Dar, which the Survey thought might be the same ruin, Guérin saw a tower among many cisterns, caves and quarries."
  ru:
    - "Каин — город в горах Иудеи, названный в округе к юго-востоку от Хеврона вместе с Маоном, Кармилом, Зифом и Ютой: «Каин, Гива и Фимна: десять городов с их селами». То же еврейское слово — имя Кенеев, рода тестя Моисея, часть которого поселилась на юге Иудеи, и в последних притчах Валаама оно означает этот народ: «но разорен будет Каин, и недолго до того, что Ассур уведет тебя в плен». Синодальный перевод передаёт оба стиха как «Каин», и карта соединяет их; город вполне мог быть поселением Кенеев, но пророчество говорит о народе, а не о городе."
    - "Больше ничего не известно. Город обычно помещают близ селения Бани-Наим, примерно в 6 км к востоку от Хеврона, где святилище Наби-Якин на высоте над Иудейской пустыней, как думают, хранит его имя; точка карты стоит на соседних развалинах Хирбет-Бани-Дар. Отождествление скорее вероятно, чем доказано."
    - "«Обзор Западной Палестины» считал Каин, вероятно, развалинами Юкин, а это имя — лёгким искажением еврейского ха-Каин. На Хирбет-Юкин исследователи отметили фундаменты, пещеры и цистерны, а в новом святилище — неглубокую впадину наподобие могилы, которую показывали как могилу Каина. «Обзор» приводит также слова французского исследователя Виктора Герена, который знал святилище иначе — как маленькую мечеть Лота, где на скале показывали следы его ног. На Хирбет-Бани-Дар, которые «Обзор» считал, возможно, теми же развалинами, Герен видел башню среди множества цистерн, пещер и каменоломен."
  uk:
    - "Каїн — місто в гірській країні Юди, перелічене в окрузі на південний схід від Хеврона з Маоном, Кармелем, Зіфом і Юттою: «Каин, Гива та Тимна — десять городів з їх селами». Те саме давньоєврейське слово — також назва кенеїв, роду тестя Мойсея, частина яких оселилася на півдні Юди, і в останніх оракулах Валаама воно означає цей народ: «Та Ассур тебе в тяжкую одведе неволю». Карта поєднує обидва вірші; місто цілком могло бути поселенням кенеїв, але оракул говорить про народ, а не про місто."
    - "Більше нічого невідомо. Місто зазвичай розміщують поблизу села Бані-Наїм, приблизно за 6 км на схід від Хеврона, де святиня Неби-Якін на висоті над Юдейською пустелею, як вважають, зберігає назву; карта стоїть на руїні поблизу, Хірбет-Бані-Дар. Ототожнення радше ймовірне, ніж доведене."
    - "«Survey of Western Palestine» вважав Каїн, імовірно, руїною Юкін, а цю назву — легким спотворенням давньоєврейського га-Каїн. На Хірбет-Юкін дослідники зафіксували фундаменти, печери й цистерни, а в новій святині — неглибоку заглибину, схожу на могилу, яку показували як могилу Каїна. «Survey» також наводить слова французького дослідника Віктора Герена, який знав святиню натомість як маленьку мечеть Лота, де на скелі показували відбитки його ніг. На Хірбет-Бані-Дар, яку «Survey» вважав, можливо, тією самою руїною, Герен бачив вежу серед численних цистерн, печер і каменоломень."
  es:
    - "Cain es una población de la región montañosa de Judá, enumerada en el distrito al sudeste de Hebrón con Maón, Carmel, Zif y Jutá: «Caín, Gibea, y Timna; diez ciudades con sus aldeas». La misma palabra hebrea es también el nombre de los cineos, el clan del suegro de Moisés, algunos de los cuales se establecieron en el sur de Judá, y en los últimos oráculos de Balaam designa a ese pueblo: «el Cineo será echado, cuando Assur te llevará cautivo». El mapa une ambos versículos; la población bien pudo ser un asentamiento cineo, pero el oráculo habla del pueblo, no de una población."
    - "No se sabe nada más. La población suele situarse cerca de la aldea de Bani Na'im, a unos 6 km al este de Hebrón, donde se piensa que el santuario de Nebi Yaqin, en una altura sobre el desierto de Judá, conserva el nombre; el mapa se apoya en la cercana ruina de Khirbet Bani Dar. La identificación es probable más que demostrada."
    - "El Survey of Western Palestine pensó que Cain era probablemente la ruina de Yukin y tuvo ese nombre por una ligera corrupción del hebreo Ha-Cain. En Khirbet Yukin sus topógrafos registraron cimientos, cuevas y cisternas, y en el santuario moderno una hondonada poco profunda en forma de tumba que se mostraba como la tumba de Caín. El Survey cita también al explorador francés Victor Guérin, que conocía en cambio el santuario como una pequeña mezquita de Lot, donde se mostraban en la roca las huellas de sus pies. En Khirbet Bani Dar, que según el Survey podía ser la misma ruina, Guérin vio una torre entre muchas cisternas, cuevas y canteras."
  pt:
    - "Caim é uma cidade na região montanhosa de Judá, listada no distrito a sudeste de Hebrom com Maom, Carmelo, Zife e Jutá: “Caim, Gibeá e Timna; dez cidades com as suas aldeias”. A mesma palavra hebraica é também o nome dos queneus, o clã do sogro de Moisés, alguns dos quais se estabeleceram no sul de Judá, e nos últimos oráculos de Balaão designa esse povo: “No entanto, Caim será devastado, até que Assur o leve cativo”. O mapa une ambos os versículos; a cidade bem pode ter sido um povoado queneu, mas o oráculo fala do povo, não de uma cidade."
    - "Nada mais se sabe. A cidade é usualmente situada perto da aldeia de Bani Na’im, a cerca de 6 km a leste de Hebrom, onde se pensa que o santuário de Nebi Yaqin, numa altura acima do deserto de Judá, conserva o nome; o mapa se apoia na ruína próxima de Khirbet Bani Dar. A identificação é provável e não provada."
    - "O Survey of Western Palestine pensou que Caim era provavelmente a ruína de Yukin e tomou esse nome por uma leve corrupção do hebraico Ha-Cain. Em Khirbet Yukin os seus topógrafos registraram alicerces, cavernas e cisternas e, no santuário moderno, uma depressão rasa em forma de sepultura, apontada como o túmulo de Caim. O Survey cita também o explorador francês Victor Guérin, que conhecia o santuário, em vez disso, como uma pequena mesquita de Ló, onde se mostravam na rocha as pegadas dele. Em Khirbet Bani Dar, que o Survey julgava poder ser a mesma ruína, Guérin viu uma torre entre muitas cisternas, cavernas e pedreiras."
  de:
    - "Kain ist eine Stadt im Bergland Judas, im Bezirk südöstlich von Hebron mit Maon, Karmel, Sif und Juta aufgeführt: „Hakain, Gibea, Thimna. Das sind zehn Städte und ihre Dörfer.“ Dasselbe hebräische Wort ist auch der Name der Keniter, der Sippe von Moses Schwiegervater, von denen sich einige im Süden Judas niederließen, und in Bileams letzten Orakeln steht es für dieses Volk: „Aber, o Kain, du wirst verbrannt werden, wenn Assur dich gefangen wegführen wird.“ Die Karte verbindet beide Verse; die Stadt mag durchaus eine kenitische Siedlung gewesen sein, doch das Orakel spricht vom Volk, nicht von einer Stadt."
    - "Mehr ist nicht bekannt. Die Stadt wird meist nahe dem Dorf Bani Na'im angesetzt, etwa 6 km östlich von Hebron, wo das Heiligtum Nebi Jakin auf einer Anhöhe über der Wüste Juda den Namen bewahren soll; die Karte steht auf der nahen Ruine Chirbet Bani Dar. Die Gleichsetzung ist wahrscheinlich, aber nicht bewiesen."
    - "Der Survey of Western Palestine hielt Kain wahrscheinlich für die Ruine Yukin und diesen Namen für eine leichte Verderbnis des hebräischen Ha-Kain. Bei Chirbet Yukin verzeichneten die Vermesser Fundamente, Höhlen und Zisternen und im neuzeitlichen Heiligtum eine flache, grabähnliche Mulde, die als Grab Kains gezeigt wurde. Der Survey zitiert auch den französischen Forscher Victor Guérin, der das Heiligtum dagegen als kleine Moschee Lots kannte, wo man im Fels die Abdrücke seiner Füße zeigte. Bei Chirbet Bani Dar, das nach dem Survey dieselbe Ruine sein konnte, sah Guérin einen Turm zwischen vielen Zisternen, Höhlen und Steinbrüchen."
  fr:
    - "Kaïn est une ville de la montagne de Juda, inscrite dans le district au sud-est d’Hébron avec Maon, Carmel, Ziph et Jutta : « Kaïn, Guibea, et Thimna ; dix villes, et leurs villages ». Le même mot hébreu est aussi le nom des Kéniens, le clan du beau-père de Moïse, dont certains s’établirent dans le sud de Juda, et dans les derniers oracles de Balaam il désigne ce peuple : « Mais le Kénien sera chassé, quand l’Assyrien t’emmènera captif ». La carte joint les deux versets ; la ville fut peut-être une implantation kénienne, mais l’oracle parle du peuple, non d’une ville."
    - "On ne sait rien de plus. La ville est d’ordinaire placée près du village de Bani Na’im, à environ 6 km à l’est d’Hébron, où le sanctuaire de Nebi Yaqin, sur une hauteur au-dessus du désert de Juda, passe pour conserver le nom ; la carte se tient sur la ruine voisine de Khirbet Bani Dar. L’identification est probable plutôt que prouvée."
    - "Le Survey of Western Palestine pensait que Kaïn était probablement la ruine de Yukin et voyait dans ce nom une légère corruption de l’hébreu Ha-Caïn. À Khirbet Yukin, ses topographes relevèrent des fondations, des grottes et des citernes, et dans le sanctuaire moderne un creux peu profond en forme de tombe, montré comme la tombe de Caïn. Le Survey cite aussi l’explorateur français Victor Guérin, qui connaissait plutôt le sanctuaire comme une petite mosquée de Lot, où l’on montrait dans le rocher les empreintes de ses pieds. À Khirbet Bani Dar, qui selon le Survey pouvait être la même ruine, Guérin vit une tour parmi de nombreuses citernes, grottes et carrières."
  pl:
    - "Kain to miasto w górach Judy, wymienione w okręgu na południowy wschód od Hebronu z Maonem, Karmelem, Zifem i Juttą: „Kain, Gabaa, i Tamna, miast dziesięć, i wsi ich”. To samo hebrajskie słowo jest też nazwą Kenitów, rodu teścia Mojżesza, z których niektórzy osiedlili się na południu Judy, a w ostatnich orędziach Balaama oznacza ten lud: „Wszakże spustoszony będzie Kenejczyk, aż cię Assur zaprowadzi do więzienia”. Mapa łączy oba wersety; miasto mogło być osadą Kenitów, lecz orędzie mówi o ludzie, nie o mieście."
    - "Nic więcej nie wiadomo. Miasto umieszcza się zwykle koło wsi Bani Naim, około 6 km na wschód od Hebronu, gdzie sanktuarium Nebi Jakin, na wzniesieniu nad pustynią Judzką, uchodzi za zachowujące nazwę; mapa stoi na pobliskiej ruinie Chirbet Bani Dar. Utożsamienie jest prawdopodobne, nie udowodnione."
    - "Survey of Western Palestine uważał, że Kain to prawdopodobnie ruina Yukin, a tę nazwę uznał za lekkie zniekształcenie hebrajskiego Ha-Kain. W Chirbet Yukin jego topografowie odnotowali fundamenty, jaskinie i cysterny, a w nowym sanktuarium płytkie, podobne do grobu zagłębienie, pokazywane jako grób Kaina. Survey przytacza też francuskiego badacza Victora Guérina, który znał natomiast sanktuarium jako mały meczet Lota, gdzie w skale pokazywano odciski jego stóp. W Chirbet Bani Dar, które według Survey mogło być tą samą ruiną, Guérin widział wieżę wśród licznych cystern, jaskiń i kamieniołomów."
  it:
    - "Kain è una città sui monti di Giuda, elencata nel distretto a sud-est di Ebron con Maon, Carmelo, Zif e Iutta: «Kain, Ghibea e Timna: dieci città e i loro villaggi». La stessa parola ebraica è anche il nome dei Kenei, il clan del suocero di Mosè, alcuni dei quali si stabilirono nel sud di Giuda, e negli ultimi oracoli di Balaam indica quel popolo: «nondimeno, il Keneo dovrà essere devastato, finché l’Assiro ti meni in cattività». La mappa unisce entrambi i versetti; la città può ben essere stata un insediamento kenita, ma l’oracolo parla del popolo, non di una città."
    - "Nulla di più si sa. La città è di solito collocata presso il villaggio di Bani Na’im, circa 6 km a est di Ebron, dove si pensa che il santuario di Nebi Yaqin, su un’altura sopra il deserto di Giuda, conservi il nome; la mappa si pone sulla vicina rovina di Khirbet Bani Dar. L’identificazione è probabile più che provata."
    - "Il Survey of Western Palestine ritenne che Kain fosse probabilmente la rovina di Yukin e considerò quel nome una lieve corruzione dell’ebraico Ha-Cain. A Khirbet Yukin i suoi topografi registrarono fondamenta, grotte e cisterne, e nel santuario moderno una conca poco profonda simile a una tomba, indicata come la tomba di Caino. Il Survey cita anche l’esploratore francese Victor Guérin, che conosceva invece il santuario come una piccola moschea di Lot, dove nella roccia si mostravano le impronte dei suoi piedi. A Khirbet Bani Dar, che secondo il Survey poteva essere la stessa rovina, Guérin vide una torre tra molte cisterne, grotte e cave."
  nl:
    - "Kain is een stad in het bergland van Juda, vermeld in het district ten zuidoosten van Hebron met Maön, Karmel, Zif en Juta: “Kain, Gibea, en Timna; tien steden en haar dorpen”. Hetzelfde Hebreeuwse woord is ook de naam van de Kenieten, het geslacht van Mozes’ schoonvader, van wie sommigen zich in het zuiden van Juda vestigden, en in Bileams laatste godsspraken staat het voor dat volk: “Evenwel zal Kain verteerd worden, totdat u Assur gevankelijk wegvoeren zal”. De kaart verbindt beide verzen; de stad kan best een Kenitische nederzetting zijn geweest, maar de godsspraak spreekt over het volk, niet over een stad."
    - "Verder is niets bekend. De stad wordt gewoonlijk geplaatst bij het dorp Bani Na’im, ongeveer 6 km ten oosten van Hebron, waar het heiligdom Nebi Yaqin, op een hoogte boven de woestijn van Juda, de naam zou bewaren; de kaart staat op de nabije ruïne Khirbet Bani Dar. De identificatie is waarschijnlijk maar niet bewezen."
    - "De Survey of Western Palestine hield Kain waarschijnlijk voor de ruïne Yukin en die naam voor een lichte verbastering van het Hebreeuwse Ha-Kain. Bij Khirbet Yukin legden de landmeters fundamenten, grotten en cisternen vast, en in het moderne heiligdom een ondiepe, grafachtige kuil die als het graf van Kaïn werd aangewezen. De Survey citeert ook de Franse ontdekkingsreiziger Victor Guérin, die het heiligdom daarentegen kende als een kleine moskee van Lot, waar men in de rots de afdrukken van zijn voeten toonde. Bij Khirbet Bani Dar, dat volgens de Survey dezelfde ruïne kon zijn, zag Guérin een toren te midden van vele cisternen, grotten en steengroeven."
  cs:
    - "Kajin je město v judské pahorkatině, uvedené v okrese jihovýchodně od Hebronu s Maonem, Karmelem, Zífem a Jutou: „Kain, Gabaa a Tamna, měst deset i vsi jejich“. Totéž hebrejské slovo je také jméno Kenijců, rodu Mojžíšova tchána, z nichž někteří se usadili na jihu Judy, a v Bileámových posledních výrocích stojí za tento lid: „Ale však vyhnán bude Cineus, Assur zajatého jej povede.“ Mapa oba verše spojuje; město mohlo být kenijským sídlem, ale výrok mluví o lidu, nikoli o městě."
    - "Nic dalšího není známo. Město se obvykle klade poblíž vesnice Báni Na'im, asi 6 km východně od Hebronu, kde svatyně Nabí Jaqín na výšině nad judskou pouští prý uchovává jméno; mapa stojí na nedaleké zřícenině Chirbet Báni Dar. Ztotožnění je pravděpodobné, nikoli dokázané."
    - "Survey of Western Palestine pokládal Kajin pravděpodobně za zříceninu Yukin a toto jméno za mírné zkomolení hebrejského Ha-Kajin. Na Chirbet Yukin zaznamenali jeho zeměměřiči základy, jeskyně a cisterny a v novodobé svatyni mělkou prohlubeň podobnou hrobu, ukazovanou jako hrob Kainův. Survey cituje také francouzského badatele Victora Guérina, který znal svatyni naopak jako malou mešitu Lotovu, kde se ve skále ukazovaly otisky jeho nohou. Na Chirbet Báni Dar, které podle Survey mohlo být touž zříceninou, viděl Guérin věž mezi mnoha cisternami, jeskyněmi a lomy."
  sv:
    - "Kain är en stad i Juda bergsbygd, upptagen i distriktet sydost om Hebron tillsammans med Maon, Karmel, Sif och Jutta: ”Kain, Gibea och Timna” – ”tio städer med sina byar”. Samma hebreiska ord är också namnet på keniterna, släkten till Moses svärfader, av vilka några bosatte sig i södra Juda, och i Bileams sista orakel står det för detta folk: ”Likväl skall Kain bliva utrotad; ja, Assur skall omsider föra dig i fångenskap”. Kartan förenar båda verserna; staden kan mycket väl ha varit en kenitisk bosättning, men oraklet talar om folket, inte om en stad."
    - "Inget mer är känt. Staden placeras vanligen nära byn Bani Na'im, omkring 6 km öster om Hebron, där helgedomen Nebi Yaqin, på en höjd ovanför Juda öken, antas bevara namnet; kartan står på den närbelägna ruinen Khirbet Bani Dar. Identifieringen är sannolik men inte bevisad."
    - "Survey of Western Palestine ansåg att Kain troligen var ruinen Yukin och höll det namnet för en lätt förvanskning av hebreiskans Ha-Kain. Vid Khirbet Yukin noterade lantmätarna grunder, grottor och cisterner, och i den nutida helgedomen en grund, gravliknande fördjupning som visades som Kains grav. Survey citerar också den franske forskningsresanden Victor Guérin, som i stället kände helgedomen som en liten moské helgad åt Lot, där man i klippan visade avtrycken av hans fötter. Vid Khirbet Bani Dar, som enligt Survey kunde vara samma ruin, såg Guérin ett torn bland många cisterner, grottor och stenbrott."
  nb:
    - "Kain er en by i fjellandet i Juda, oppført i distriktet sørøst for Hebron sammen med Maon, Karmel, Sif og Jutta: «Hakka'in, Gibea og Timna - ti byer med tilhørende landsbyer». Det samme hebraiske ordet er også navnet på kenittene, klanen til Moses' svigerfar, hvorav noen slo seg ned i det sørlige Juda, og i Bileams siste orakler står det for dette folket: «men enda skal Kain bli ødelagt når Assur fører dig bort i fangenskap». Kartet slår begge versene sammen; byen kan godt ha vært en kenittisk bosetning, men oraklet taler om folket, ikke om en by."
    - "Mer er ikke kjent. Byen plasseres vanligvis nær landsbyen Bani Na'im, omkring 6 km øst for Hebron, der helligdommen Nebi Yaqin, på en høyde over Judas ørken, antas å bevare navnet; kartet står på ruinen Khirbet Bani Dar i nærheten. Identifikasjonen er sannsynlig, men ikke bevist."
    - "Survey of Western Palestine mente at Kain trolig var ruinen Yukin, og holdt det navnet for en lett forvanskning av hebraisk Ha-Kain. Ved Khirbet Yukin noterte landmålerne grunnmurer, huler og sisterner, og i den moderne helligdommen en grunn, gravlignende fordypning som ble vist fram som Kains grav. Survey siterer også den franske oppdagelsesreisende Victor Guérin, som i stedet kjente helligdommen som en liten moské viet Lot, der man i berget viste avtrykkene av føttene hans. Ved Khirbet Bani Dar, som ifølge Survey kunne være den samme ruinen, så Guérin et tårn blant mange sisterner, huler og steinbrudd."
  tl:
    - "Ang Cain ay bayan sa maburol na lupain ng Juda, na nakatala sa distrito sa timog-silangan ng Hebron kasama ng Maon, Carmel, Ziph at Juta: “Cain, Gibea, at Timna: sangpung bayan pati ng mga nayon ng mga yaon.” Ang gayon ding salitang Hebreo ay pangalan din ng mga Cineo, ang angkan ng biyenan ni Moises, na ang ilan ay nanirahan sa timog ng Juda, at sa huling mga orakulo ni Balaam ay tumutukoy ito sa lahing iyon: “Gayon ma'y mawawasak ang Cain, Hanggang sa ikaw ay madalang bihag ng Assur.” Pinag-uugnay ng mapa ang dalawang talata; maaaring pamayanan nga ng mga Cineo ang bayan, ngunit ang orakulo ay nagsasalita tungkol sa lahi, hindi sa isang bayan."
    - "Wala nang iba pang nalalaman. Karaniwang inilalagay ang bayan malapit sa nayon ng Bani Na'im, mga 6 km sa silangan ng Hebron, kung saan ang dambana ng Nebi Yaqin, sa isang tuktok sa itaas ng ilang ng Juda, ay pinaniniwalaang nag-iingat ng pangalan; inilalagay ito ng mapa sa kalapit na guho ng Khirbet Bani Dar. Malamang ngunit hindi napatunayan ang pagkakakilanlan."
    - "Inakala ng Survey of Western Palestine na ang Cain ay malamang na ang guho ng Yukin, at itinuring nito ang pangalang iyon na bahagyang pagbaluktot ng Hebreong Ha-Cain. Sa Khirbet Yukin, itinala ng mga tagasukat nito ang mga pundasyon, mga yungib at mga balon, at sa makabagong dambana ang isang mababaw na hukay na parang libingan na itinuturo bilang libingan ni Cain. Sinisipi rin ng Survey ang Pranses na manggagalugad na si Victor Guérin, na nakakilala naman sa dambana bilang isang maliit na moske ni Lot, kung saan ipinapakita sa bato ang mga bakas ng kanyang mga paa. Sa Khirbet Bani Dar, na inakala ng Survey na maaaring iisang guho, nakakita si Guérin ng isang tore sa gitna ng maraming balon, yungib at tibagan."
  da:
    - "Kain er en by i Judas bjergland, opført i distriktet sydøst for Hebron sammen med Maon, Karmel, Zif og Jutta: »Kain, Gibea og Timna; ti Stæder og deres Landsbyer«. Det samme hebraiske ord er også navnet på kenitterne, slægten til Moses' svigerfar, hvoraf nogle bosatte sig i det sydlige Juda, og i Bileams sidste udsagn står det for dette folk: »Thi mon Kain skal hjemfalde til, Undergang, indtil Assur fører dig i Fangenskab«. Kortet forbinder begge vers; byen kan meget vel have været en kenitisk bosættelse, men udsagnet taler om folket, ikke om en by."
    - "Mere vides ikke. Byen placeres sædvanligvis nær landsbyen Bani Na'im, omkring 6 km øst for Hebron, hvor helligdommen Nebi Yaqin på en højde over Judas ørken menes at bevare navnet; kortet står på den nærliggende ruin Khirbet Bani Dar. Identifikationen er sandsynlig snarere end bevist."
    - "Survey of Western Palestine mente, at Kain sandsynligvis var ruinen Yukin, og anså det navn for en let forvanskning af hebraisk Ha-Kain. Ved Khirbet Yukin noterede landmålerne fundamenter, huler og cisterner og i den nyere helligdom en lav, gravlignende fordybning, der blev vist som Kains grav. Survey citerer også den franske opdagelsesrejsende Victor Guérin, der i stedet kendte helligdommen som en lille moské viet Lot, hvor man i klippen viste aftrykkene af hans fødder. Ved Khirbet Bani Dar, som ifølge Survey kunne være den samme ruin, så Guérin et tårn blandt mange cisterner, huler og stenbrud."
  sr:
    - "Кин је град у јудејском горју, наведен у округу југоисточно од Хеврона с Маоном, Кармилом, Зифом и Јутом: „Кајин, Гаваја и Тамна; десет градова са селима својим“. Иста хебрејска реч је и име Кенеја, племена Мојсијевог таста, од којих су се неки настанили на југу Јуде, а у Валамовим последњим пророштвима она означава тај народ: „Али ће бити изагнан Кенеј; Асур ће га заробити“. Мапа повезује оба стиха; град је врло могуће био кенејско насеље, али пророштво говори о народу, а не о граду."
    - "Више се не зна ништа. Град се обично смешта близу села Бани Наим, око 6 км источно од Хеврона, где се сматра да светилиште Неби Јакин, на узвишењу изнад јудејске пустиње, чува име; мапа стоји на оближњој рушевини Хирбет Бани Дар. Идентификација је вероватна, али недоказана."
    - "Истраживање Западне Палестине мислило је да је Кин вероватно рушевина Јукин, а то име сматрало је благим искварењем хебрејског Ха-Каин. На Хирбет Јукину његови премеравачи забележили су темеље, пећине и цистерне, а у новијем светилишту плитко удубљење налик гробу, које је показивано као Каинов гроб. Истраживање наводи и француског истраживача Виктора Герена, који је светилиште, напротив, знао као малу Лотову џамију, где су на стени показивани отисци његових стопа. На Хирбет Бани Дару, за који је Истраживање мислило да би могао бити иста рушевина, Герен је видео кулу међу многим цистернама, пећинама и каменоломима."
  hu:
    - "Káin város Júda hegyvidékén, a Hebrontól délkeletre eső kerületben, Maónnal, Kármellel, Ziffel és Juttával együtt szerepel a jegyzékben: „Kajin, Gibea és Timna. Tíz város és ezeknek falui”. Ugyanez a héber szó a keniták neve is, Mózes apósának törzséé, amelynek egy része Júda déli részén telepedett meg, és Bálám utolsó jövendöléseiben erre a népre áll: „Mégis el fog pusztulni Kain; a míg Assur téged fogva viszen”. A térkép összekapcsolja a két verset; a város jól lehetett kenita település, de a jövendölés a népről szól, nem városról."
    - "Többet nem tudunk. A várost általában Bani Na'im falu közelébe helyezik, Hebrontól mintegy 6 km-re keletre, ahol a Júdai-pusztára néző magaslaton álló Nebi Yaqin szentély őrizheti meg a nevet; a térkép a közeli Khirbet Bani Dar romján áll. Az azonosítás valószínű, de nem bizonyított."
    - "A Survey of Western Palestine úgy vélte, hogy Káin valószínűleg Yukin romja, ezt a nevet pedig a héber Ha-Kajin enyhe torzulásának tartotta. Khirbet Yukinnál felmérői alapfalakat, barlangokat és ciszternákat jegyeztek fel, az újkori szentélyben pedig egy sekély, sírszerű mélyedést, amelyet Káin sírjaként mutattak. A Survey idézi a francia kutatót, Victor Guérint is, aki a szentélyt viszont Lót kis mecseteként ismerte, ahol a sziklában lábnyomait mutatták. Khirbet Bani Darnál, amely a Survey szerint ugyanaz a rom lehetett, Guérin tornyot látott sok ciszterna, barlang és kőfejtő között."
  fi:
    - "Kain on kaupunki Juudan vuoristossa, mainittu Hebronista kaakkoon sijaitsevan piirin luettelossa Maonin, Karmelin, Sifin ja Juttan kanssa: ”Kain, Gibea, Timna – kymmenen kaupunkia kylineen”. Sama heprealainen sana on myös keeniläisten nimi, Mooseksen apen suvun, josta osa asettui Juudan eteläosaan, ja Bileamin viimeisissä sanoissa se tarkoittaa tuota kansaa: ”Mutta sittenkin Kain hävitetään: ei aikaakaan, niin Assur vie sinut vangiksi.” Kartta yhdistää molemmat kohdat; kaupunki on hyvinkin voinut olla keeniläisten asuinpaikka, mutta lausuma puhuu kansasta, ei kaupungista."
    - "Muuta ei tiedetä. Kaupunki sijoitetaan yleensä Bani Na'imin kylän lähelle, noin 6 km Hebronista itään, missä Nebi Yaqinin pyhäkön Juudan erämaan yläpuolisella korkeudella arvellaan säilyttäneen nimen; kartta seisoo läheisellä Khirbet Bani Darin raunioilla. Tunnistus on todennäköinen mutta ei todistettu."
    - "Survey of Western Palestine piti Kainia todennäköisesti Yukinin raunioina ja tätä nimeä heprean Ha-Kain-nimen lievänä vääristymänä. Khirbet Yukinissa sen kartoittajat merkitsivät muistiin perustuksia, luolia ja vesisäiliöitä sekä uudenaikaisessa pyhäkössä matalan, hautaa muistuttavan painanteen, jota näytettiin Kainin hautana. Survey lainaa myös ranskalaista tutkimusmatkailijaa Victor Guérinia, joka tunsi pyhäkön sen sijaan Lootin pienenä moskeijana, jossa kalliossa näytettiin hänen jalanjälkiään. Khirbet Bani Darissa, joka Surveyn mukaan saattoi olla sama raunio, Guérin näki tornin monien vesisäiliöiden, luolien ja louhosten keskellä."
  vi:
    - "Ca-in là một thành trong xứ đồi núi Giu-đa, được liệt kê ở khu vực đông nam Hếp-rôn cùng Ma-ôn, Cạt-mên, Xíp và Giu-ta: “Ca-in, Ghi-bê-a, và Thim-na: hết thảy mười thành với các làng của nó”. Cùng từ Hê-bơ-rơ ấy cũng là tên của người Kê-nít, gia tộc của cha vợ Môi-se, một số trong họ đã định cư ở miền nam Giu-đa, và trong những lời sấm cuối của Ba-la-am, từ ấy chỉ dân tộc này: “Nhưng Ca-in sẽ bị hư nát, Cho đến khi A-su-rơ bắt dẫn tù ngươi”. Bản đồ nối hai câu ấy lại; thành rất có thể là một khu định cư của người Kê-nít, nhưng lời sấm nói về dân tộc, không phải về một thành."
    - "Không còn biết gì thêm. Thành thường được đặt gần làng Bani Na'im, cách Hếp-rôn khoảng 6 km về phía đông, nơi đền Nebi Yaqin, trên một cao điểm phía trên đồng vắng Giu-đa, được cho là còn giữ tên; bản đồ đặt tại di tích gần đó là Khirbet Bani Dar. Việc đồng nhất này có khả năng chứ chưa được chứng minh."
    - "Survey of Western Palestine cho rằng Ca-in có lẽ là phế tích Yukin và coi tên ấy là một biến dạng nhẹ của tiếng Hê-bơ-rơ Ha-Cain. Tại Khirbet Yukin, các nhà khảo sát ghi nhận nền móng, hang và bể chứa nước, và trong đền thờ thời nay có một chỗ trũng nông giống ngôi mộ được chỉ là mộ của Ca-in. Survey cũng dẫn lời nhà thám hiểm người Pháp Victor Guérin, người thì lại biết đền thờ này như một nhà thờ Hồi giáo nhỏ của Lót, nơi người ta chỉ dấu chân ông trên đá. Tại Khirbet Bani Dar, mà Survey nghĩ có thể là cùng một phế tích, Guérin thấy một tháp giữa nhiều bể chứa nước, hang và mỏ đá."
  ro:
    - "Cain este o cetate din regiunea muntoasă a lui Iuda, înscrisă în districtul de la sud-est de Hebron împreună cu Maon, Carmel, Zif și Iuta: Cain, Ghibea și Timna, zece cetăți cu satele lor. Același cuvânt ebraic este și numele cheniților, neamul socrului lui Moise, dintre care unii s-au așezat în sudul lui Iuda; în ultimele oracole ale lui Balaam el desemnează acel popor: chenitul va fi pustiit până când Așur te va duce în robie. Harta unește cele două versete; cetatea poate foarte bine să fi fost o așezare chenită, dar oracolul vorbește despre popor, nu despre o cetate."
    - "Nu se știe nimic mai mult. Cetatea este plasată de obicei lângă satul Bani Na'im, la circa 6 km est de Hebron, unde se crede că numele se păstrează în sanctuarul Nebi Yaqin, pe o înălțime deasupra pustiei lui Iuda; harta se sprijină pe ruina apropiată Khirbet Bani Dar. Identificarea este probabilă, nu dovedită."
    - "Survey of Western Palestine a crezut că Cain era probabil ruina Yukin și a socotit acest nume o ușoară stâlcire a ebraicului Ha-Cain. La Khirbet Yukin topografii săi au consemnat temelii, peșteri și cisterne, iar în sanctuarul modern o scobitură puțin adâncă, asemenea unui mormânt, arătată drept mormântul lui Cain. Survey îl citează și pe exploratorul francez Victor Guérin, care cunoștea însă sanctuarul ca pe o mică moschee a lui Lot, unde în stâncă se arătau urmele picioarelor lui. La Khirbet Bani Dar, despre care Survey credea că ar putea fi aceeași ruină, Guérin a văzut un turn printre multe cisterne, peșteri și cariere."
  bg:
    - "Каин е град в Юдейските планини, изброен в областта югоизточно от Хеврон заедно с Маон, Кармил, Зиф и Юта: „Акаин, Гаваа, и Тамна, градове десет, и селата им“. Същата еврейска дума е и името на кенейците — рода на тъста на Мойсей, част от които се заселили в южната част на Юда, — и в последните пророчества на Валаам тя означава този народ: „Но Кенейците ще се разорят Доде те заплени Ассур“. Картата свързва двата стиха; градът може и да е бил кенейско селище, но пророчеството говори за народа, а не за град."
    - "Нищо повече не е известно. Градът обикновено се поставя близо до село Бани Наим, на около 6 км източно от Хеврон, където светилището Неби Якин, на възвишение над Юдейската пустиня, се смята, че пази името; картата е поставена на близката развалина Хирбет Бани Дар. Отъждествяването е вероятно, но не е доказано."
    - "Проучването на Западна Палестина смята Каин вероятно за развалината Юкин, а това име — за леко изопачаване на еврейското Ха-Каин. При Хирбет Юкин неговите топографи отбелязват основи, пещери и цистерни, а в новото светилище — плитка вдлъбнатина като гроб, показвана като гроба на Каин. Проучването цитира и френския изследовател Виктор Герен, който познава светилището по друг начин — като малка джамия на Лот, където в скалата показвали отпечатъците от краката му. При Хирбет Бани Дар, който според Проучването може да е същата развалина, Герен вижда кула сред много цистерни, пещери и каменоломни."
