# Overview article (ADR 0007). Mainstream facts only; Kain is a town of Judah near Hebron; Numbers 24:22 speaks of the Kenites, whose Hebrew name is Kain, and the link with the town is the map's, not the text's; the site is a proposal.
id: kain
