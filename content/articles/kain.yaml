body:
  en:
    - "Kain is a town in the hill country of Judah, listed in the district south-east of Hebron with Maon, Carmel, Ziph and Juttah: “Cain, Gibeah, and Timnah; ten cities with their villages”. The same Hebrew word is also the name of the Kenites, the clan of Moses' father-in-law, some of whom settled in the south of Judah, and in Balaam's last oracles it stands for that people: “Nevertheless the Kenite shall be wasted, until Asshur shall carry thee away captive”. The Synodal Bible renders both verses “Каин”, and the map joins them; the town may well have been a Kenite settlement, but the oracle speaks of the people, not of a town."
    - "Nothing more is known. The town is usually placed near the village of Bani Na'im, about 6 km east of Hebron, where the shrine of Nebi Yaqin, on a height above the wilderness of Judah, is thought to preserve the name; the map stands on the nearby ruin of Khirbet Bani Dar. Neither site has been excavated, and the identification is likely rather than proved."
  ru:
    - "Каин — город в горах Иудеи, названный в округе к юго-востоку от Хеврона вместе с Маоном, Кармилом, Зифом и Ютой: «Каин, Гива и Фимна: десять городов с их селами». То же еврейское слово — имя Кенеев, рода тестя Моисея, часть которого поселилась на юге Иудеи, и в последних притчах Валаама оно означает этот народ: «но разорен будет Каин, и недолго до того, что Ассур уведет тебя в плен». Синодальный перевод передаёт оба стиха как «Каин», и карта соединяет их; город вполне мог быть поселением Кенеев, но пророчество говорит о народе, а не о городе."
    - "Больше ничего не известно. Город обычно помещают близ селения Бани-Наим, примерно в 6 км к востоку от Хеврона, где святилище Наби-Якин на высоте над Иудейской пустыней, как думают, хранит его имя; точка карты стоит на соседних развалинах Хирбет-Бани-Дар. Ни одно из этих мест не раскапывалось, и отождествление скорее вероятно, чем доказано."
  uk:
    - "Каїн — місто в гірській країні Юди, перелічене в окрузі на південний схід від Хеврона з Маоном, Кармелем, Зіфом і Юттою: «Каин, Гива та Тимна — десять городів з їх селами». Те саме давньоєврейське слово — також назва кенеїв, роду тестя Мойсея, частина яких оселилася на півдні Юди, і в останніх оракулах Валаама воно означає цей народ: «Та Ассур тебе в тяжкую одведе неволю». Синодальна Біблія передає обидва вірші як «Каин», і карта їх поєднує; місто цілком могло бути поселенням кенеїв, але оракул говорить про народ, а не про місто."
    - "Більше нічого невідомо. Місто зазвичай розміщують поблизу села Бані-Наїм, приблизно за 6 км на схід від Хеврона, де святиня Неби-Якін на висоті над Юдейською пустелею, як вважають, зберігає назву; карта стоїть на руїні поблизу, Хірбет-Бані-Дар. Жодне з місць не розкопувалося, і ототожнення радше ймовірне, ніж доведене."
  es:
    - "Cain es una población de la región montañosa de Judá, enumerada en el distrito al sudeste de Hebrón con Maón, Carmel, Zif y Jutá: «Caín, Gibea, y Timna; diez ciudades con sus aldeas». La misma palabra hebrea es también el nombre de los cineos, el clan del suegro de Moisés, algunos de los cuales se establecieron en el sur de Judá, y en los últimos oráculos de Balaam designa a ese pueblo: «el Cineo será echado, cuando Assur te llevará cautivo». La Biblia sinodal traduce ambos versículos «Каин», y el mapa los une; la población bien pudo ser un asentamiento cineo, pero el oráculo habla del pueblo, no de una población."
    - "No se sabe nada más. La población suele situarse cerca de la aldea de Bani Na'im, a unos 6 km al este de Hebrón, donde se piensa que el santuario de Nebi Yaqin, en una altura sobre el desierto de Judá, conserva el nombre; el mapa se apoya en la cercana ruina de Khirbet Bani Dar. Ninguno de los sitios ha sido excavado, y la identificación es probable más que demostrada."
  pt:
    - "Caim é uma cidade na região montanhosa de Judá, listada no distrito a sudeste de Hebrom com Maom, Carmelo, Zife e Jutá: “Caim, Gibeá e Timna; dez cidades com as suas aldeias”. A mesma palavra hebraica é também o nome dos queneus, o clã do sogro de Moisés, alguns dos quais se estabeleceram no sul de Judá, e nos últimos oráculos de Balaão designa esse povo: “No entanto, Caim será devastado, até que Assur o leve cativo”. A Bíblia Sinodal traduz ambos os versículos “Каин”, e o mapa os une; a cidade bem pode ter sido um povoado queneu, mas o oráculo fala do povo, não de uma cidade."
    - "Nada mais se sabe. A cidade é usualmente situada perto da aldeia de Bani Na’im, a cerca de 6 km a leste de Hebrom, onde se pensa que o santuário de Nebi Yaqin, numa altura acima do deserto de Judá, conserva o nome; o mapa se apoia na ruína próxima de Khirbet Bani Dar. Nenhum dos sítios foi escavado, e a identificação é provável e não provada."
  de:
    - "Kain ist eine Stadt im Bergland Judas, im Bezirk südöstlich von Hebron mit Maon, Karmel, Sif und Juta aufgeführt: „Hakain, Gibea, Thimna. Das sind zehn Städte und ihre Dörfer.“ Dasselbe hebräische Wort ist auch der Name der Keniter, der Sippe von Moses Schwiegervater, von denen sich einige im Süden Judas niederließen, und in Bileams letzten Orakeln steht es für dieses Volk: „Aber, o Kain, du wirst verbrannt werden, wenn Assur dich gefangen wegführen wird.“ Die Synodalübersetzung gibt beide Verse als „Каин“ wieder, und die Karte verbindet sie; die Stadt mag durchaus eine kenitische Siedlung gewesen sein, doch das Orakel spricht vom Volk, nicht von einer Stadt."
    - "Mehr ist nicht bekannt. Die Stadt wird meist nahe dem Dorf Bani Na'im angesetzt, etwa 6 km östlich von Hebron, wo das Heiligtum Nebi Jakin auf einer Anhöhe über der Wüste Juda den Namen bewahren soll; die Karte steht auf der nahen Ruine Chirbet Bani Dar. Keine der Stätten ist ausgegraben, und die Gleichsetzung ist wahrscheinlich, aber nicht bewiesen."
  fr:
    - "Kaïn est une ville de la montagne de Juda, inscrite dans le district au sud-est d’Hébron avec Maon, Carmel, Ziph et Jutta : « Kaïn, Guibea, et Thimna ; dix villes, et leurs villages ». Le même mot hébreu est aussi le nom des Kéniens, le clan du beau-père de Moïse, dont certains s’établirent dans le sud de Juda, et dans les derniers oracles de Balaam il désigne ce peuple : « Mais le Kénien sera chassé, quand l’Assyrien t’emmènera captif ». La Bible synodale rend les deux versets par « Каин », et la carte les joint ; la ville fut peut-être une implantation kénienne, mais l’oracle parle du peuple, non d’une ville."
    - "On ne sait rien de plus. La ville est d’ordinaire placée près du village de Bani Na’im, à environ 6 km à l’est d’Hébron, où le sanctuaire de Nebi Yaqin, sur une hauteur au-dessus du désert de Juda, passe pour conserver le nom ; la carte se tient sur la ruine voisine de Khirbet Bani Dar. Aucun des deux sites n’a été fouillé, et l’identification est probable plutôt que prouvée."
  pl:
    - "Kain to miasto w górach Judy, wymienione w okręgu na południowy wschód od Hebronu z Maonem, Karmelem, Zifem i Juttą: „Kain, Gabaa, i Tamna, miast dziesięć, i wsi ich”. To samo hebrajskie słowo jest też nazwą Kenitów, rodu teścia Mojżesza, z których niektórzy osiedlili się na południu Judy, a w ostatnich orędziach Balaama oznacza ten lud: „Wszakże spustoszony będzie Kenejczyk, aż cię Assur zaprowadzi do więzienia”. Biblia synodalna oddaje oba wersety jako „Каин”, i mapa je łączy; miasto mogło być osadą Kenitów, lecz orędzie mówi o ludzie, nie o mieście."
    - "Nic więcej nie wiadomo. Miasto umieszcza się zwykle koło wsi Bani Naim, około 6 km na wschód od Hebronu, gdzie sanktuarium Nebi Jakin, na wzniesieniu nad pustynią Judzką, uchodzi za zachowujące nazwę; mapa stoi na pobliskiej ruinie Chirbet Bani Dar. Żadne stanowisko nie było badane, a utożsamienie jest prawdopodobne, nie udowodnione."
  it:
    - "Kain è una città sui monti di Giuda, elencata nel distretto a sud-est di Ebron con Maon, Carmelo, Zif e Iutta: «Kain, Ghibea e Timna: dieci città e i loro villaggi». La stessa parola ebraica è anche il nome dei Kenei, il clan del suocero di Mosè, alcuni dei quali si stabilirono nel sud di Giuda, e negli ultimi oracoli di Balaam indica quel popolo: «nondimeno, il Keneo dovrà essere devastato, finché l’Assiro ti meni in cattività». La Bibbia sinodale rende entrambi i versetti «Каин», e la mappa li unisce; la città può ben essere stata un insediamento kenita, ma l’oracolo parla del popolo, non di una città."
    - "Nulla di più si sa. La città è di solito collocata presso il villaggio di Bani Na’im, circa 6 km a est di Ebron, dove si pensa che il santuario di Nebi Yaqin, su un’altura sopra il deserto di Giuda, conservi il nome; la mappa si pone sulla vicina rovina di Khirbet Bani Dar. Nessuno dei due siti è stato scavato, e l’identificazione è probabile più che provata."
  nl:
    - "Kain is een stad in het bergland van Juda, vermeld in het district ten zuidoosten van Hebron met Maön, Karmel, Zif en Juta: “Kain, Gibea, en Timna; tien steden en haar dorpen”. Hetzelfde Hebreeuwse woord is ook de naam van de Kenieten, het geslacht van Mozes’ schoonvader, van wie sommigen zich in het zuiden van Juda vestigden, en in Bileams laatste godsspraken staat het voor dat volk: “Evenwel zal Kain verteerd worden, totdat u Assur gevankelijk wegvoeren zal”. De Synodale Bijbel geeft beide verzen weer als “Каин”, en de kaart verbindt ze; de stad kan best een Kenitische nederzetting zijn geweest, maar de godsspraak spreekt over het volk, niet over een stad."
    - "Verder is niets bekend. De stad wordt gewoonlijk geplaatst bij het dorp Bani Na’im, ongeveer 6 km ten oosten van Hebron, waar het heiligdom Nebi Yaqin, op een hoogte boven de woestijn van Juda, de naam zou bewaren; de kaart staat op de nabije ruïne Khirbet Bani Dar. Geen van beide plaatsen is opgegraven, en de identificatie is waarschijnlijk maar niet bewezen."
  cs:
    - "Kajin je město v judské pahorkatině, uvedené v okrese jihovýchodně od Hebronu s Maonem, Karmelem, Zífem a Jutou: „Kain, Gabaa a Tamna, měst deset i vsi jejich“. Totéž hebrejské slovo je také jméno Kenijců, rodu Mojžíšova tchána, z nichž někteří se usadili na jihu Judy, a v Bileámových posledních výrocích stojí za tento lid: „Ale však vyhnán bude Cineus, Assur zajatého jej povede.“ Synodální Bible oba verše vykládá „Каин“ a mapa je spojuje; město mohlo být kenijským sídlem, ale výrok mluví o lidu, nikoli o městě."
    - "Nic dalšího není známo. Město se obvykle klade poblíž vesnice Báni Na'im, asi 6 km východně od Hebronu, kde svatyně Nabí Jaqín na výšině nad judskou pouští prý uchovává jméno; mapa stojí na nedaleké zřícenině Chirbet Báni Dar. Žádné místo nebylo vykopáno a ztotožnění je pravděpodobné, nikoli dokázané."
