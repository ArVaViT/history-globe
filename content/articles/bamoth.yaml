body:
  en:
    - "Bamoth, “high places”, is a station on Israel's march through the land of Moab, named only in the itinerary of Numbers: “from Mattanah to Nahaliel: and from Nahaliel to Bamoth: And from Bamoth in the valley, that is in the country of Moab, to the top of Pisgah, which looketh toward Jeshimon”. It therefore lay on the plateau north of the Arnon, between the gorge and the heights above the Dead Sea, one stage short of Pisgah. It is probably the same place as Bamoth-baal, where Balak took Balaam to look down on Israel, and which Joshua lists among the towns of Reuben with Dibon and Beth-baal-meon."
    - "The Mesha Stele of the ninth century BC, set up at Dibon by the king of Moab, says that he built Beth-bamoth, “for it was destroyed”; most readers take this for the same town, which would put it in Moabite hands after Reuben's day. Beyond that nothing is known. Eusebius puts it only vaguely in the region of the Arnon, and no ruin bears the name; Khirbet el-Quweiqiyeh, on the plateau a few kilometres south of Mount Nebo, is the usual guess, with Jebel Ataruz and Khirbet Libb, further south towards Dibon, also proposed. None has been excavated with Bamoth in view, so the map shows a region rather than a spot: the farmland of Jordan's Madaba governorate between Mount Nebo and Dhiban."
  ru:
    - "Вамоф, «высоты», — стан на пути Израиля через землю Моава, названный только в маршруте книги Чисел: «из Матанны в Нагалиил, из Нагалиила в Вамоф, из Вамофа в Гай, который в земле Моава, на вершине горы Фасги, обращенной лицем к пустыне». Значит, он лежал на плато к северу от Арнона, между ущельем и высотами над Мёртвым морем, на один переход не доходя до Фасги. Вероятно, это то же место, что Вамоф-Ваал, куда Валак возвёл Валаама взглянуть на Израиль и которое книга Иисуса Навина называет среди городов Рувима вместе с Дивоном и Беф-Ваал-Меоном."
    - "Стела Меши IX века до н. э., поставленная царём Моава в Дивоне, говорит, что он отстроил Беф-Бамоф, «ибо он был разрушен»; большинство читателей видят в этом тот же город, который, выходит, после времён Рувима перешёл к Моавитянам. Сверх этого ничего не известно. Евсевий помещает его лишь смутно в области Арнона, и ни одна руина не носит этого имени; обычная догадка — Хирбет-эль-Кувейкия на плато в нескольких километрах к югу от горы Нево; предлагали также Джебель-Атаруз и Хирбет-Либб, южнее, ближе к Дивону. Ни одно из них не копали ради Вамофа, так что карта показывает скорее область, чем точку: поля иорданской провинции Мадаба между горой Нево и Дибаном."
  uk:
    - "Вамот, «висоти», — стоянка Ізраїлевого походу землею Моава, названа лише в переліку станів у Числах: «Із Маттана в Нахалієль, а з Нахалієля до Бамота; А з Бамота в долину, що на полях Моаба, до верховин гори Пізга, що стремить над дикою полониною». Отже, він лежав на плато на північ від Арнону, між ущелиною та висотами над Мертвим морем, за один перехід до Фасги. Це, ймовірно, те саме місце, що й Вамот-Ваал, куди Валак привів Валаама дивитися вниз на Ізраїль, і який Ісус Навин зараховує до міст Рувима разом із Дівоном та Бет-Ваал-Меоном."
    - "Стела Меші IX століття до н. е., поставлена в Дівоні царем Моава, каже, що він збудував Бет-Вамот, «бо він був зруйнований»; більшість читачів вважає це тим самим містом, що поставило б його в моавські руки після днів Рувима. Крім цього нічого не відомо. Євсевій розміщує його лише невиразно в районі Арнону, і жодна руїна не носить цієї назви; Хірбет-ель-Кувейкійє, на плато за кілька кілометрів на південь від гори Нево, — звичайна здогадка, з Джебель-Аттарусом і Хірбет-Лібб, далі на південь до Дівону, також пропонованими. Жодне не розкопано з огляду на Вамот, тож мапа показує край, а не точку: рілля йорданської мухафази Мадаба між горою Нево і Дібаном."
  es:
    - "Bamot, «lugares altos», es una estación de la marcha de Israel por la tierra de Moab, nombrada solo en el itinerario de Números: «de Mathana á Nahaliel: y de Nahaliel á Bamoth: Y de Bamoth al valle que está en los campos de Moab, y á la cumbre de Pisga, que mira á Jesimón». Se hallaba, pues, en la meseta al norte del Arnón, entre la garganta y las alturas sobre el mar Muerto, a una etapa de Pisga. Es probablemente el mismo lugar que Bamot-baal, donde Balac llevó a Balaam para que contemplara a Israel, y que Josué enumera entre las ciudades de Rubén con Dibón y Bet-baal-meón."
    - "La estela de Mesa, del siglo IX a. C., erigida en Dibón por el rey de Moab, dice que construyó Bet-bamot, «porque había sido destruida»; la mayoría de los lectores la toman por la misma ciudad, lo que la pondría en manos moabitas después de los días de Rubén. Más allá de eso nada se sabe. Eusebio la sitúa solo vagamente en la región del Arnón, y ninguna ruina lleva el nombre; Khirbet el-Quweiqiyeh, en la meseta unos kilómetros al sur del monte Nebo, es la conjetura habitual, y también se han propuesto Jebel Ataruz y Khirbet Libb, más al sur hacia Dibón. Ninguno ha sido excavado con Bamot en vista, de modo que el mapa muestra una región más que un punto: las tierras de labranza de la gobernación jordana de Madaba entre el monte Nebo y Dhiban."
  pt:
    - "Bamote, “lugares altos”, é uma estação da marcha de Israel pela terra de Moabe, nomeada só no itinerário de Números: “e de Mataná para Naaliel; e de Naaliel para Bamote; e de Bamote para o vale que está no campo de Moabe, até o topo de Pisga, que olha para o deserto”. Ficava, pois, no planalto ao norte do Arnom, entre o desfiladeiro e as alturas acima do mar Morto, uma etapa antes de Pisga. É provavelmente o mesmo lugar que Bamote-Baal, onde Balaque levou Balaão para olhar Israel de cima, e que Josué lista entre as cidades de Rúben com Dibom e Bete-Baal-Meom."
    - "A Estela de Mesa, do século IX a.C., erguida em Dibom pelo rei de Moabe, diz que ele construiu Bete-Bamote, “pois estava destruída”; a maioria dos leitores a toma pela mesma cidade, o que a poria em mãos moabitas depois do tempo de Rúben. Além disso, nada se sabe. Eusébio a situa só vagamente na região do Arnom, e nenhuma ruína leva o nome; Khirbet el-Quweiqiyeh, no planalto a poucos quilômetros ao sul do monte Nebo, é a conjetura habitual, sendo também propostos Jebel Ataruz e Khirbet Libb, mais ao sul, rumo a Dibom. Nenhum foi escavado tendo Bamote em vista, de modo que o mapa mostra uma região, e não um ponto: as terras agrícolas da província jordaniana de Madaba entre o monte Nebo e Dhiban."
  de:
    - "Bamot, „Höhen“, ist eine Station auf Israels Zug durch das Land Moab, nur im Wegverzeichnis des Vierten Buches Mose genannt: „und von Matthana gen Nahaliel; und von Nahaliel gen Bamoth; und von Bamoth in das Tal, das im Felde Moabs liegt, zu dem hohen Berge Pisgas, der gegen die Wüste sieht“. Es lag also auf dem Plateau nördlich des Arnon, zwischen der Schlucht und den Höhen über dem Toten Meer, eine Etappe vor Pisga. Es ist wahrscheinlich derselbe Ort wie Bamot-Baal, wohin Balak Bileam führte, damit er auf Israel hinabsah, und den Josua unter den Städten Rubens mit Dibon und Bet-Baal-Meon aufführt."
    - "Die Mesa-Stele des 9. Jahrhunderts v. Chr., vom König von Moab in Dibon aufgestellt, sagt, er habe Bet-Bamot gebaut, „denn es war zerstört“; die meisten Leser halten das für dieselbe Stadt, die dann nach Rubens Zeit in moabitischer Hand gewesen wäre. Darüber hinaus ist nichts bekannt. Eusebius setzt es nur vage in die Gegend des Arnon, und keine Ruine trägt den Namen; Chirbet el-Quweiqiye auf dem Plateau einige Kilometer südlich des Berges Nebo ist die übliche Vermutung, auch Dschebel Ataruz und Chirbet Libb weiter südlich Richtung Dibon wurden vorgeschlagen. Keiner wurde im Blick auf Bamot ausgegraben, daher zeigt die Karte eine Gegend statt einer Stelle: das Ackerland des jordanischen Gouvernements Madaba zwischen dem Berg Nebo und Dhiban."
  fr:
    - "Bamoth, « hauts lieux », est une étape de la marche d’Israël à travers le pays de Moab, nommée seulement dans l’itinéraire des Nombres : « de Matthana, à Nahaliel ; de Nahaliel, à Bamoth ; de Bamoth, à la vallée qui est dans le territoire de Moab, au sommet du Pisga, en regard du désert ». Elle se trouvait donc sur le plateau au nord de l’Arnon, entre la gorge et les hauteurs au-dessus de la mer Morte, à une étape du Pisga. C’est probablement le même lieu que Bamoth-Baal, où Balak mena Balaam pour regarder Israël d’en haut, et que Josué range parmi les villes de Ruben avec Dibon et Beth-Baal-Meon."
    - "La stèle de Mescha du IXe siècle av. J.-C., dressée à Dibon par le roi de Moab, dit qu’il a bâti Beth-Bamoth, « car elle était détruite » ; la plupart des lecteurs y voient la même ville, qui serait ainsi aux mains de Moab après l’époque de Ruben. Au-delà, on ne sait rien. Eusèbe ne la place que vaguement dans la région de l’Arnon, et aucune ruine ne porte le nom ; Khirbet el-Quweiqiyeh, sur le plateau à quelques kilomètres au sud du mont Nebo, est l’hypothèse habituelle, avec Jebel Ataruz et Khirbet Libb, plus au sud vers Dibon, aussi proposés. Aucun n’a été fouillé en vue de Bamoth ; la carte montre donc une région plutôt qu’un point : la campagne du gouvernorat jordanien de Madaba entre le mont Nebo et Dhiban."
  it:
    - "Bamot, «luoghi alti», è una tappa della marcia d’Israele attraverso la terra di Moab, nominata soltanto nell’itinerario dei Numeri: «da Matthana a Nahaliel; da Nahaliel a Bamoth, e da Bamoth nella valle che è nella campagna di Moab, verso l’altura del Pisga che domina il deserto». Sorgeva dunque sull’altopiano a nord dell’Arnon, tra la gola e le alture sopra il Mar Morto, a una tappa dal Pisga. È probabilmente lo stesso luogo di Bamot-Baal, dove Balak condusse Balaam a guardare Israele dall’alto, e che Giosuè elenca fra le città di Ruben con Dibon e Bet-Baal-Meon."
    - "La stele di Mesa del IX secolo a.C., eretta a Dibon dal re di Moab, dice che egli costruì Bet-Bamot, «perché era distrutta»; i più la ritengono la stessa città, che sarebbe così in mani moabite dopo i giorni di Ruben. Oltre a ciò nulla si sa. Eusebio la pone solo vagamente nella regione dell’Arnon, e nessuna rovina porta il nome; Khirbet el-Quweiqiyeh, sull’altopiano a pochi chilometri a sud del monte Nebo, è la solita ipotesi, con Jebel Ataruz e Khirbet Libb, più a sud verso Dibon, pure proposti. Nessuno è stato scavato in vista di Bamot, così la carta mostra una regione e non un punto: la terra coltivata del governatorato giordano di Madaba tra il monte Nebo e Dhiban."
  pl:
    - "Bamot, „wyżyny”, to stacja na szlaku Izraela przez ziemię Moabu, wymieniona tylko w itinerarium Księgi Liczb: „A z Matana do Nahalijelu, a z Nahalijelu do Bamotu; A z Bamotu ku Hagaj, które jest w polach Moabskich, na wierzchu pagórka, który leży ku puszczy”. Leżało więc na wyżynie na północ od Arnonu, między wąwozem a wzniesieniami nad Morzem Martwym, o jeden etap przed Pisgą. Jest to prawdopodobnie to samo miejsce co Bamot-Baal, gdzie Balak zaprowadził Balaama, by patrzył na Izraela, i które Jozue wymienia wśród miast Rubena z Dibonem i Bet-Baal-Meon."
    - "Stela Meszy z IX wieku p.n.e., wzniesiona w Dibonie przez króla Moabu, mówi, że zbudował Bet-Bamot, „bo było zburzone”; większość czytelników uważa to za to samo miasto, co umieściłoby je w rękach moabickich po czasach Rubena. Poza tym nic nie wiadomo. Euzebiusz umieszcza je tylko niejasno w okolicy Arnonu i żadna ruina nie nosi tej nazwy; Chirbet el-Quweiqiyeh, na wyżynie kilka kilometrów na południe od góry Nebo, jest zwykłym domysłem, a Dżabal Ataruz i Chirbet Libb, dalej na południe ku Dibonowi, także proponowano. Żaden nie był wykopywany pod kątem Bamot, więc mapa pokazuje region, a nie punkt: pola muhafazy Madaba w Jordanii między górą Nebo a Dhiban."
  nl:
    - "Bamot, “hoogten”, is een standplaats op Israëls tocht door het land Moab, alleen genoemd in het reisverslag van Numeri: “En van Mattana tot Nahaliel; en van Nahaliel tot Bamoth; en van Bamoth tot het dal, dat in het veld van Moab is, aan de hoogte van Pisga, en dat tegen de wildernis ziet.” Het lag dus op het plateau ten noorden van de Arnon, tussen de kloof en de hoogten boven de Dode Zee, een etappe vóór de Pisga. Het is waarschijnlijk dezelfde plaats als Bamot-Baäl, waar Balak Bileam meenam om op Israël neer te zien, en die Jozua onder de steden van Ruben noemt met Dibon en Beth-Baäl-Meon."
    - "De Mesastèle uit de negende eeuw v.Chr., opgericht te Dibon door de koning van Moab, zegt dat hij Beth-Bamot bouwde, “want zij was verwoest”; de meeste lezers houden dit voor dezelfde stad, die dan na Rubens tijd in Moabitische handen zou zijn. Verder is niets bekend. Eusebius plaatst haar slechts vaag in de streek van de Arnon, en geen ruïne draagt de naam; Khirbet el-Quweiqiyeh, op het plateau enkele kilometers ten zuiden van de berg Nebo, is de gebruikelijke gissing, met Jebel Ataruz en Khirbet Libb, verder zuidelijk richting Dibon, ook voorgesteld. Geen is met Bamot in het vizier opgegraven, dus de kaart toont een streek eerder dan een punt: het akkerland van het Jordaanse gouvernement Madaba tussen de berg Nebo en Dhiban."
  cs:
    - "Bamót, „výšiny“, je stanice na Izraelově pochodu zemí Moábu, jmenovaná jen v itineráři Numeri: „A z Matana do Nahaliel, z Nahaliel do Bamot, A z Bamot do údolí, kteréž jest na poli Moábském, až k vrchu hory, kteráž leží na proti poušti“. Leželo tedy na planině severně od Arnonu, mezi soutěskou a výšinami nad Mrtvým mořem, o jednu etapu před Pisgou. Je to pravděpodobně totéž místo jako Bamót-báal, kam Balak vzal Bileáma, aby shlížel na Izrael, a které Jozue uvádí mezi městy Rúbenovými s Dibonem a Bét-báal-meónem."
    - "Mešova stéla z 9. století př. n. l., vztyčená v Dibonu králem Moábu, praví, že vybudoval Bét-bamót, „neboť byl zničen“; většina čtenářů to bere za totéž město, což by je kladlo do moábských rukou po Rúbenových dnech. Dál není nic známo. Eusebios je klade jen neurčitě do oblasti Arnonu a žádná zřícenina jméno nenese; Chirbet el-Quweiqiyeh, na planině několik kilometrů jižně od hory Nebo, je obvyklým dohadem, přičemž navrženy byly i Jebel Ataruz a Chirbet Libb, dále na jih k Dibonu. Žádné z nich nebylo vykopáno s ohledem na Bamót, takže mapa ukazuje spíše oblast než bod: zemědělskou půdu jordánského guvernorátu Madaba mezi horou Nebo a Dhibánem."
  sv:
    - "Bamot, ”offerhöjder”, är en station på Israels marsch genom Moabs land, nämnd bara i vandringsförteckningen i Fjärde Mosebok: ”från Mattana till Nahaliel, från: Nahaliel till Bamot, från Bamot till den dal som ligger: på Moabs mark uppe på Pisga, där man kan se ut över ödemarken”. Den låg alltså på platån norr om Arnon, mellan klyftan och höjderna ovanför Döda havet, en etapp före Pisga. Det är sannolikt samma plats som Bamot-Baal, där Balak förde Bileam för att se ned på Israel, och som Josua upptar bland Rubens städer med Dibon och Bet-Baal-Meon."
    - "Mesha-stelen från 800-talet f.Kr., rest i Dibon av Moabs kung, säger att han byggde Bet-Bamot, ”ty det var förstört”; de flesta läsare tar detta för samma stad, som då skulle ha kommit i moabiternas händer efter Rubens tid. Utöver det är ingenting känt. Eusebios placerar den bara vagt i Arnons trakt, och ingen ruin bär namnet; Khirbet el-Quweiqiyeh, på platån några kilometer söder om Nebo, är den vanliga gissningen, med Jebel Ataruz och Khirbet Libb, längre söderut mot Dibon, också föreslagna. Ingen har grävts ut med Bamot i åtanke, så kartan visar en trakt snarare än en punkt: jordbruksmarken i Jordaniens guvernement Madaba mellan Nebo och Dhiban."
  nb:
    - "Bamot, «offerhauger», er en stasjon på Israels marsj gjennom Moabs land, nevnt bare i reiseruten i 4. Mosebok: «og fra Matana til Nahaliel og fra Nahaliel til Bamot og fra Bamot til den dal som ligger i Moab-marken, tett ved toppen av Pisga, og hvor en skuer ut over ørkenen». Den lå altså på høysletten nord for Arnon, mellom kløften og høydene over Dødehavet, én etappe før Pisga. Det er trolig det samme stedet som Bamot-Baal, dit Balak førte Bileam for å se ned på Israel, og som Josva oppfører blant Rubens byer med Dibon og Bet-Ba'al-Meon."
    - "Mesa-steleen fra 800-tallet f.Kr., reist i Dibon av kongen av Moab, sier at han bygde Bet-Bamot, «for den var ødelagt»; de fleste lesere tar dette for den samme byen, noe som ville plassere den i moabittisk eie etter Rubens tid. Utover det er ingenting kjent. Eusebius plasserer den bare vagt i Arnon-området, og ingen ruin bærer navnet; Khirbet el-Quweiqiyeh, på høysletten noen få kilometer sør for Nebo, er den vanlige gjetningen, med Jebel Ataruz og Khirbet Libb, lenger sør mot Dibon, også foreslått. Ingen er gravd ut med Bamot for øye, så kartet viser en region snarere enn et punkt: jordbrukslandet i Jordans Madaba-guvernement mellom Nebo og Dhiban."
  tl:
    - "Ang Bamoth, “mataas na dako”, ay himpilan sa martsa ng Israel sa lupain ng Moab, na pinangalanan lamang sa talaan ng paglalakbay ng Mga Bilang: “mula sa Mathana ay napasa Nahaliel: at mula sa Nahaliel ay napasa Bamoth; At mula sa Bamoth ay napasa libis na nasa bukid ng Moab, sa taluktok ng Pisga, na patungo sa ilang”. Kaya nasa talampas ito sa hilaga ng Arnon, sa pagitan ng bangin at ng mga kataasan sa itaas ng Dagat na Patay, isang yugto bago ang Pisga. Marahil ito ang Bamoth-baal, kung saan dinala ni Balac si Balaam upang tanawin ang Israel, at na inililista ni Josue sa mga bayan ni Ruben kasama ng Dibon at Beth-baal-meon."
    - "Sinasabi ng Estela ni Mesa noong ika-9 na siglo BK, na itinayo sa Dibon ng hari ng Moab, na itinayo niya ang Beth-bamoth, “sapagkat ito ay nawasak”; itinuturing ito ng karamihan ng mga mambabasa na iisang bayan, na maglalagay dito sa kamay ng mga Moabita pagkatapos ng panahon ni Ruben. Bukod doon, wala nang alam. Inilalagay lamang ito ni Eusebio nang malabo sa rehiyon ng Arnon, at walang guhong may ganitong pangalan; ang Khirbet el-Quweiqiyeh, sa talampas ilang kilometro sa timog ng Bundok Nebo, ang karaniwang hula, at iminungkahi rin ang Jebel Ataruz at Khirbet Libb, mas timog patungong Dibon. Walang hinukay na may Bamoth sa isip, kaya rehiyon at hindi tiyak na punto ang ipinapakita ng mapa: ang bukirin ng Gobernorado ng Madaba ng Jordan sa pagitan ng Bundok Nebo at Dhiban."
  da:
    - "Bamot, »offerhøje«, er en station på Israels march gennem Moabs land, nævnt kun i rejseberetningen i 4 Mosebog: »og fra Matthana til Nahaliel, og fra Nahaliel til Bamoth, og fra Bamoth til den Dal, som er paa Moabs Mark, mod Toppen af Pisga, der skuer ud over Ørken«. Den lå altså på højsletten nord for Arnon, mellem slugten og højderne over Det Døde Hav, én etape før Pisga. Det er sandsynligvis det samme sted som Bamot-Ba'al, hvor Balak førte Bileam op for at se ned på Israel, og som Josva opregner blandt Rubens byer sammen med Dibon og Bet-Ba'al-Meon."
    - "Mesja-stelen fra 800-tallet f.Kr., rejst i Dibon af Moabs konge, siger, at han byggede Bet-Bamot, »thi den var ødelagt«; de fleste læsere tager det for den samme by, hvilket ville placere den på moabitiske hænder efter Rubens tid. Ud over det vides intet. Eusebius placerer den kun vagt i Arnon-egnen, og ingen ruin bærer navnet; Khirbet el-Quweiqiyeh, på højsletten få kilometer syd for Nebo, er det sædvanlige gæt, med Jebel Ataruz og Khirbet Libb, længere mod syd mod Dibon, også foreslået. Ingen er udgravet med Bamot for øje, så kortet viser en egn snarere end et punkt: agerlandet i Jordans Madaba-guvernement mellem Nebo og Dhiban."
  sr:
    - "Вамот, „узвишења“, станица је на Израиљевом маршу кроз земљу Моав, именована само у путопису Књиге Бројева: „а из Мантанаила, у Надил, а из Надила у Вамот, а из Вамота у долину која је у пољу моавском код горе Фазге и гледа у пустињу“. Лежао је, дакле, на висоравни северно од Арнона, између клисуре и висина изнад Мртвог мора, једну етапу пред Фазгом. Вероватно је исто место што и Вамот-Вал, где је Валак повео Валама да погледа Израиља и који Исус Навин наводи међу градовима Рувимовим с Девоном и Вет-Валмеоном."
    - "Мисина стела из 9. века п. н. е., подигнута у Девону од цара Моава, каже да је саградио Вет-Вамот, „јер је био срушен“; већина читалаца то узима за исти град, што би га ставило у моавске руке после Рувимовог доба. Осим тога ништа није познато. Јевсевије га само неодређено смешта у крај Арнона, а ниједна рушевина не носи име; Хирбет ел-Куејкије, на висоравни неколико километара јужно од горе Нево, уобичајена је претпоставка, а предлагани су и Џебел Атаруз и Хирбет Либ, даље на југ ка Девону. Ниједан није ископаван имајући Вамот на уму, па карта приказује област а не тачку: обрадива земља јорданског гувернората Мадаба између горе Нево и Дибана."
