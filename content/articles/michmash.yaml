body:
  en:
    - "Michmash was a town of Benjamin about 11 km north-north-east of Jerusalem. It is identified with the village of Mukhmas, which keeps the ancient name. The town stood on the north side of the steep gorge of Wadi es-Suweinit; Geba, today's Jaba, faces it on the south side, little more than 2 km away. Here the way from the north to Jerusalem crossed the gorge, at the place the Bible calls the passage of Michmash."
    - "Michmash is best known from Saul's war with the Philistines. Saul first held Michmash with two thousand men, while Jonathan was in Gibeah. After Jonathan struck the Philistine garrison in Geba, the Philistines came up in great numbers and camped at Michmash, and their garrison went out to the passage of Michmash. Between the two sides stood two sharp rocks, Bozez and Seneh; Jonathan and his armourbearer climbed up to the Philistine post, the camp fell into panic, and that day Israel struck the Philistines from Michmash to Aijalon."
    - 'Isaiah names Michmash in his picture of an army marching on Jerusalem from the north: "at Michmash he hath laid up his carriages". After the exile 122 men of Michmash returned from Babylon, and in Nehemiah''s day it was one of the places where the Benjamites lived.'
    - "When Bacchides, the Seleucid general, made peace with Jonathan Maccabeus and left Judea in the 150s BC, Jonathan settled at Michmash and began to govern the people from there; both 1 Maccabees and Josephus record this. In the fourth century Eusebius mentions a large village called Machmas in the district of Jerusalem, nine miles from the city, near Rama."
  ru:
    - "Михмас — город Вениаминов примерно в 11 км к северо-северо-востоку от Иерусалима. Его отождествляют с деревней Мухмас, сохранившей древнее имя. Город стоял на северной стороне крутого ущелья вади эс-Сувейнит; на южной стороне, чуть больше чем в 2 км, напротив него лежит Гева, нынешняя Джаба. Здесь дорога с севера на Иерусалим пересекала ущелье — у места, которое Библия называет переправой Михмасской."
    - "Больше всего Михмас известен по войне Саула с филистимлянами. Сначала Саул с двумя тысячами человек стоял в Михмасе, а Ионафан был в Гиве. После того как Ионафан разбил филистимский охранный отряд в Геве, филистимляне пришли в великом множестве и стали станом в Михмасе, а их передовой отряд вышел к переправе Михмасской. Между сторонами стояли две острые скалы, Боцец и Сене; Ионафан и его оруженосец взобрались к филистимскому посту, в стане поднялось смятение, и в тот день Израиль поражал филистимлян от Михмаса до Аиалона."
    - "Исаия называет Михмас в картине войска, идущего на Иерусалим с севера: «в Михмасе складывает свои запасы». После плена из Вавилона вернулись сто двадцать два жителя Михмаса, а во дни Неемии он был одним из мест, где жили вениамитяне."
    - "Когда селевкидский полководец Вакхид заключил мир с Ионафаном Маккавеем и в 150-х гг. до н. э. ушёл из Иудеи, Ионафан поселился в Михмасе и стал оттуда управлять народом; об этом пишут и Первая книга Маккавейская, и Иосиф Флавий. В IV веке Евсевий упоминает большое селение Махмас в округе Иерусалима, в девяти милях от города, близ Рамы."
  uk:
    - "Міхмас був містом Веніяміна приблизно за 11 км на північ-північний схід від Єрусалима. Його ототожнюють із селом Мухмас, що зберігає давню назву. Місто стояло на північному боці крутої ущелини Ваді-ес-Суейніт; Геба, сьогоднішня Джаба, дивиться на нього з південного боку, трохи більше ніж за 2 км. Тут шлях з півночі до Єрусалима перетинав ущелину, у місці, яке Біблія називає переходом Міхмасу."
    - "Міхмас найкраще відомий з війни Саула з філістимлянами. Саул спершу тримав Міхмас із двома тисячами чоловіків, а Йонатан був у Гіві. Після того як Йонатан розбив філістимський гарнізон у Гебі, філістимляни прийшли у великій кількості й отаборилися в Міхмасі, і їхній гарнізон вийшов до переходу Міхмасу. Між двома сторонами стояли дві гострі скелі, Боцец і Сене; Йонатан і його зброєносець піднялися до філістимської застави, табір охопила паніка, і того дня Ізраїль бив філістимлян від Міхмасу до Аялона."
    - "Ісая називає Міхмас у своїй картині війська, що йде на Єрусалим з півночі: «в Михмасї покидає тягарі свої». Після полону 122 мужі з Міхмасу повернулися з Вавилона, а за Неемії це було одне з місць, де жили веніяминяни."
    - "Коли Вакхід, селевкідський воєначальник, уклав мир з Йонатаном Макавеєм і залишив Юдею в 150-х рр. до н. е., Йонатан оселився в Міхмасі й почав управляти народом звідти; це записують і Перша книга Макавеїв, і Йосиф Флавій. У IV ст. Євсевій згадує велике село Махмас в окрузі Єрусалима, за дев’ять миль від міста, поблизу Рами."
  es:
    - "Micmas era una ciudad de Benjamín a unos 11 km al nornordeste de Jerusalén. Se identifica con la aldea de Mukhmas, que conserva el nombre antiguo. La ciudad se alzaba en el lado norte de la escarpada garganta del Wadi es-Suweinit; Geba, la actual Jaba, queda enfrente, en el lado sur, a poco más de 2 km. Aquí el camino del norte a Jerusalén cruzaba la garganta, en el lugar que la Biblia llama el paso de Micmas."
    - "Micmas es más conocida por la guerra de Saúl con los filisteos. Saúl ocupó primero Micmas con dos mil hombres, mientras Jonatán estaba en Gabaa. Después de que Jonatán hiriera la guarnición filistea en Geba, los filisteos subieron en gran número y acamparon en Micmas, y su guarnición salió al paso de Micmas. Entre los dos bandos se alzaban dos peñascos agudos, Boces y Sene; Jonatán y su escudero subieron hasta el puesto filisteo, el campamento cayó en pánico, y aquel día Israel hirió a los filisteos desde Micmas hasta Ajalón."
    - "Isaías nombra Micmas en su cuadro de un ejército que marcha sobre Jerusalén desde el norte: «en Michmas contará su ejército». Después del destierro regresaron de Babilonia 122 hombres de Micmas, y en tiempos de Nehemías era uno de los lugares donde vivían los benjamitas."
    - "Cuando Báquides, el general seléucida, hizo la paz con Jonatán Macabeo y dejó Judea en los años 150 a. C., Jonatán se estableció en Micmas y comenzó a gobernar al pueblo desde allí; lo registran tanto 1 Macabeos como Josefo. En el siglo IV, Eusebio menciona una gran aldea llamada Machmas en el distrito de Jerusalén, a nueve millas de la ciudad, cerca de Rama."
  pt:
    - "Micmás era uma cidade de Benjamim a cerca de 11 km a nor-nordeste de Jerusalém. É identificada com a aldeia de Mukhmas, que conserva o nome antigo. A cidade ficava no lado norte da íngreme garganta do Wadi es-Suweinit; Geba, a atual Jaba, fica diante dela, no lado sul, a pouco mais de 2 km. Aqui o caminho do norte para Jerusalém cruzava a garganta, no lugar que a Bíblia chama de desfiladeiro de Micmás."
    - "Micmás é mais conhecida pela guerra de Saul com os filisteus. Saul primeiro ocupou Micmás com dois mil homens, enquanto Jônatas estava em Gibeá. Depois que Jônatas atacou a guarnição filisteia em Geba, os filisteus subiram em grande número e acamparam em Micmás, e seu destacamento avançou para o desfiladeiro de Micmás. Entre os dois lados havia dois penhascos agudos, Bozez e Sené; Jônatas e seu escudeiro escalaram até o posto filisteu, o acampamento caiu em pânico, e naquele dia Israel feriu os filisteus de Micmás até Aijalom."
    - "Isaías nomeia Micmás em seu quadro de um exército que marcha sobre Jerusalém vindo do norte: “Em Micmás ele guarda a sua bagagem”. Depois do exílio, 122 homens de Micmás voltaram da Babilônia, e no tempo de Neemias era um dos lugares onde moravam os benjamitas."
    - "Quando Báquides, o general selêucida, fez paz com Jônatas Macabeu e deixou a Judeia na década de 150 a.C., Jônatas estabeleceu-se em Micmás e começou dali a governar o povo; tanto 1 Macabeus quanto Josefo o registram. No século IV, Eusébio menciona uma grande aldeia chamada Machmas no distrito de Jerusalém, a nove milhas da cidade, perto de Ramá."
  de:
    - "Michmas war eine Stadt in Benjamin, etwa 11 km nordnordöstlich von Jerusalem. Es wird mit dem Dorf Mukhmas gleichgesetzt, das den alten Namen bewahrt. Die Stadt lag auf der Nordseite der steilen Schlucht des Wadi es-Suweinit; Geba, das heutige Jaba, liegt ihr auf der Südseite gegenüber, kaum mehr als 2 km entfernt. Hier überquerte der Weg aus dem Norden nach Jerusalem die Schlucht, an der Stelle, die die Bibel den Pass von Michmas nennt."
    - "Michmas ist am bekanntesten aus Sauls Krieg mit den Philistern. Saul hielt zuerst Michmas mit zweitausend Mann, während Jonatan in Gibea war. Nachdem Jonatan die Wache der Philister in Geba geschlagen hatte, zogen die Philister in großer Zahl herauf und lagerten sich bei Michmas, und ihre Wache zog zum Pass von Michmas hinaus. Zwischen den beiden Seiten standen zwei spitze Felsen, Bozez und Sene; Jonatan und sein Waffenträger kletterten zum Posten der Philister hinauf, das Lager geriet in Panik, und an jenem Tag schlug Israel die Philister von Michmas bis Ajalon."
    - "Jesaja nennt Michmas in seinem Bild eines Heeres, das von Norden auf Jerusalem marschiert: „er mustert sein Gerät zu Michmas“. Nach dem Exil kehrten 122 Männer aus Michmas aus Babylon zurück, und zu Nehemias Zeit war es einer der Orte, wo die Benjaminiter wohnten."
    - "Als Bacchides, der seleukidische Feldherr, in den 150er Jahren v. Chr. mit Jonatan Makkabäus Frieden schloss und Judäa verließ, ließ sich Jonatan in Michmas nieder und begann von dort das Volk zu regieren; sowohl das 1. Makkabäerbuch als auch Josephus berichten dies. Im 4. Jahrhundert erwähnt Eusebius ein großes Dorf namens Machmas im Bezirk von Jerusalem, neun Meilen von der Stadt entfernt, nahe Rama."
  fr:
    - "Micmasch était une ville de Benjamin à environ 11 km au nord-nord-est de Jérusalem. On l’identifie au village de Mukhmas, qui garde l’ancien nom. La ville se dressait sur le côté nord de la gorge abrupte de l’ouadi es-Suweinit ; Guéba, l’actuelle Jaba, lui fait face sur le côté sud, à un peu plus de 2 km. Là, la route du nord vers Jérusalem franchissait la gorge, à l’endroit que la Bible appelle le passage de Micmasch."
    - "Micmasch est surtout connue par la guerre de Saül contre les Philistins. Saül tint d’abord Micmasch avec deux mille hommes, tandis que Jonathan était à Guibea. Après que Jonathan eut battu la garnison philistine de Guéba, les Philistins montèrent en grand nombre et campèrent à Micmasch, et leur garnison sortit vers le passage de Micmasch. Entre les deux camps se dressaient deux rochers aigus, Botsets et Séné ; Jonathan et son écuyer grimpèrent jusqu’au poste philistin, le camp tomba dans la panique, et ce jour-là Israël battit les Philistins depuis Micmasch jusqu’à Ajalon."
    - "Ésaïe nomme Micmasch dans son tableau d’une armée marchant sur Jérusalem depuis le nord : « il laisse ses bagages à Micmasch ». Après l’exil, 122 hommes de Micmasch revinrent de Babylone, et du temps de Néhémie elle était l’un des lieux où habitaient les Benjaminites."
    - "Quand Bacchidès, le général séleucide, fit la paix avec Jonathan Maccabée et quitta la Judée dans les années 150 av. J.-C., Jonathan s’installa à Micmasch et commença de là à gouverner le peuple ; 1 Maccabées et Flavius Josèphe le rapportent. Au IVe siècle, Eusèbe mentionne un grand village appelé Machmas dans le district de Jérusalem, à neuf milles de la ville, près de Rama."
  it:
    - "Micmas era una città di Beniamino a circa 11 km a nord-nord-est di Gerusalemme. È identificata con il villaggio di Mukhmas, che ne conserva l’antico nome. La città sorgeva sul lato nord della ripida gola del Wadi es-Suweinit; Gheba, l’odierna Jaba, le sta di fronte sul lato sud, a poco più di 2 km. Qui la via da nord a Gerusalemme attraversava la gola, nel luogo che la Bibbia chiama il passo di Micmas."
    - "Micmas è nota soprattutto dalla guerra di Saul con i Filistei. Saul tenne dapprima Micmas con duemila uomini, mentre Gionata era a Gabaa. Dopo che Gionata ebbe colpito la guarnigione filistea a Gheba, i Filistei salirono in gran numero e si accamparono a Micmas, e la loro guarnigione uscì verso il passo di Micmas. Tra i due schieramenti stavano due rupi aguzze, Boses e Sene; Gionata e il suo scudiero salirono al posto filisteo, il campo cadde nel panico, e quel giorno Israele batté i Filistei da Micmas ad Aialon."
    - "Isaia nomina Micmas nel quadro di un esercito che marcia su Gerusalemme da nord: «depone i suoi bagagli a Micmash». Dopo l’esilio 122 uomini di Micmas tornarono da Babilonia, e ai giorni di Neemia era uno dei luoghi dove abitavano i Beniaminiti."
    - "Quando Bacchide, il generale seleucide, fece pace con Gionata Maccabeo e lasciò la Giudea negli anni 150 a.C., Gionata si stabilì a Micmas e di là cominciò a governare il popolo; lo registrano sia il primo libro dei Maccabei sia Giuseppe Flavio. Nel IV secolo Eusebio menziona un grande villaggio chiamato Machmas nel distretto di Gerusalemme, a nove miglia dalla città, presso Rama."
  pl:
    - "Mikmas było miastem Beniamina około 11 km na północny wschód od Jerozolimy. Utożsamia się je z wsią Mukhmas, która zachowuje starożytną nazwę. Miasto stało po północnej stronie stromego wąwozu Wadi es-Suweinit; Geba, dzisiejsza Jaba, leży naprzeciw po południowej stronie, nieco ponad 2 km dalej. Tu droga z północy do Jerozolimy przecinała wąwóz, w miejscu, które Biblia nazywa przełęczą Mikmas."
    - "Mikmas jest najlepiej znane z wojny Saula z Filistynami. Saul najpierw trzymał Mikmas z dwoma tysiącami ludzi, podczas gdy Jonatan był w Gibei. Gdy Jonatan uderzył na filistyńską załogę w Geba, Filistyni przyciągnęli w wielkiej liczbie i rozbili obóz w Mikmas, a ich załoga wyszła do przełęczy Mikmas. Między obiema stronami stały dwie ostre skały, Boses i Sene; Jonatan i jego giermek wspięli się do filistyńskiej placówki, obóz wpadł w panikę i tego dnia Izrael bił Filistynów od Mikmas do Ajjalon."
    - "Izajasz wymienia Mikmas w obrazie wojska maszerującego na Jerozolimę z północy: „w Machmas złoży oręż swój”. Po niewoli 122 mężów z Mikmas wróciło z Babilonu, a w dniach Nehemiasza było to jedno z miejsc, gdzie mieszkali Beniaminici."
    - "Gdy Bakchides, seleucydzki wódz, zawarł pokój z Jonatanem Machabeuszem i opuścił Judeę w latach pięćdziesiątych II w. p.n.e., Jonatan osiadł w Mikmas i stamtąd zaczął rządzić ludem; zapisują to 1 Księga Machabejska i Józef Flawiusz. W IV w. Euzebiusz wspomina dużą wieś zwaną Machmas w okręgu Jerozolimy, dziewięć mil od miasta, koło Rama."
  nl:
    - "Michmas was een stad van Benjamin, ongeveer 11 km noordnoordoost van Jeruzalem. Het wordt geïdentificeerd met het dorp Mukhmas, dat de oude naam bewaart. De stad lag aan de noordkant van de steile kloof van de Wadi es-Suweinit; Geba, het huidige Jaba, ligt er aan de zuidkant tegenover, nauwelijks meer dan 2 km verderop. Hier stak de weg van het noorden naar Jeruzalem de kloof over, op de plaats die de Bijbel de pas van Michmas noemt."
    - "Michmas is vooral bekend uit Sauls oorlog met de Filistijnen. Saul hield eerst Michmas met tweeduizend man, terwijl Jonatan in Gibea was. Nadat Jonatan de Filistijnse bezetting in Geba had geslagen, kwamen de Filistijnen in groten getale op en legerden zich bij Michmas, en hun bezetting trok naar de pas van Michmas. Tussen de twee partijen stonden twee scherpe rotsen, Bozez en Sene; Jonatan en zijn wapendrager klommen naar de Filistijnse post, het kamp raakte in paniek, en die dag versloeg Israël de Filistijnen van Michmas tot Ajalon."
    - "Jesaja noemt Michmas in zijn beeld van een leger dat vanuit het noorden naar Jeruzalem optrekt: “te Michmas legt hij zijn gereedschap af”. Na de ballingschap keerden 122 mannen van Michmas uit Babylon terug, en in Nehemia's tijd was het een van de plaatsen waar de Benjaminieten woonden."
    - "Toen Bacchides, de Seleucidische veldheer, vrede sloot met Jonatan Makkabeüs en in de jaren 150 v.Chr. Judea verliet, vestigde Jonatan zich te Michmas en begon vandaar het volk te besturen; zowel 1 Makkabeeën als Josephus vermelden dit. In de vierde eeuw noemt Eusebius een groot dorp Machmas in het district Jeruzalem, negen mijl van de stad, bij Rama."
  cs:
    - "Michmas bylo město Benjamínovo asi 11 km severoseverovýchodně od Jeruzaléma. Ztotožňuje se s vesnicí Mukhmas, která staré jméno zachovává. Město stálo na severní straně příkré rokle Wádí es-Suweinit; Geba, dnešní Jaba, leží naproti na jižní straně, o něco víc než 2 km daleko. Tudy vedla cesta od severu do Jeruzaléma přes soutěsku, na místě, které Bible nazývá průsmykem Michmas."
    - "Michmas je nejznámější z Saulovy války s Pelištejci. Saul nejprve držel Michmas s dvěma tisíci muži, zatímco Jonatan byl v Gibeji. Poté co Jonatan udeřil na pelištejskou posádku v Gebě, přitáhli Pelištejci v hojném počtu a utábořili se v Michmasu a jejich stráž vyšla k průsmyku Michmas. Mezi oběma stranami stály dvě ostré skály, Bocec a Seneh; Jonatan a jeho zbrojnoš vyšplhali k pelištejskému postavení, tábor se dal do paniky a toho dne Izrael bil Pelištejce od Michmasu po Ajalon."
    - "Izajáš jmenuje Michmas v obraze vojska táhnoucího na Jeruzalém ze severu: „v Michmas složí nádobí svá“. Po exilu se z Babylóna vrátilo 122 mužů z Michmasu a za Nehemjáše to bylo jedno z míst, kde bydleli Benjamínovci."
    - "Když Bakchidés, seleukovský vojevůdce, uzavřel mír s Jonatanem Makabejským a opustil Judsko v 150. letech př. n. l., usadil se Jonatan v Michmasu a začal odtud spravovat lid; zaznamenávají to První kniha Makabejských i Josephus. Ve 4. století zmiňuje Eusebius velkou vesnici zvanou Machmas v okrese Jeruzaléma, devět mil od města, poblíž Rámy."
