body:
  en:
    - "Nahalal, also spelled Nahallal and Nahalol, was a town of Zebulun on the edge of the plain of Jezreel, named with Kattath, Shimron, Idalah and Bethlehem of Galilee among the tribe's twelve towns, and given with its pastures to the Levites of Merari: “Dimnah with her suburbs, Nahalal with her suburbs; four cities.” The name seems to mean a watering place or pasture for flocks. The tribe did not hold it at first: “Neither did Zebulun drive out the inhabitants of Kitron, nor the inhabitants of Nahalol; but the Canaanites dwelt among them, and became tributaries.” The Bible says no more, and nothing is known of it from other ancient sources."
    - "Where it lay is disputed. The Jerusalem Talmud says that Nahalal is Mahalul, which is taken to be Ma'lul, a village that stood on the valley's northern edge west of Nazareth until 1948, and that is the oldest identification. Others have looked to Tel Nahal (Tell en-Nahl) by the mouth of the Kishon at Haifa, whose name resembles the old one, or to a ruin near the modern village of Nahalal in the western valley, which the map lists first; no excavation has settled the matter, and the map shows all three."
    - "The modern Nahalal, founded in 1921 as the first moshav, a cooperative farming village, and laid out by the architect Richard Kauffmann in concentric circles that are still a landmark from the air, took the biblical name; Moshe Dayan grew up there. Two of the candidates lie within a few kilometres of each other in the Jezreel valley, and the third some 20 km away at Haifa, in northern Israel."
  ru:
    - "Нагалал, также Нагалол, был городом Завулона на краю равнины Изреельской, названным вместе с Каттафом, Шимроном, Идеалой и галилейским Вифлеемом среди двенадцати городов колена и отданным с предместьями левитам из рода Мерари: «Димну и предместья ее, Нагалал и предместья его: четыре города». Имя, по-видимому, означает водопой или пастбище для скота. Колено не сразу овладело им: «И Завулон не изгнал жителей Китрона и жителей Наглола, и жили Хананеи среди их и платили им дань». Больше Библия ничего не говорит, и из других древних источников о нём ничего не известно."
    - "Где он лежал, спорно. Иерусалимский Талмуд говорит, что Нагалал — это Махалул, в котором видят Маалуль, деревню, стоявшую на северном краю равнины к западу от Назарета до 1948 года; это древнейшее отождествление. Другие указывали на Тель-Нахаль (Телль-эн-Нахль) у устья Киссона в Хайфе, чьё имя похоже на древнее, или на развалины рядом с нынешним посёлком Нагалал в западной части равнины, которые на карте стоят первыми; раскопки вопроса не решили, и на карте показаны все три места."
    - "Нынешний Нагалал, основанный в 1921 году как первый мошав, кооперативное земледельческое поселение, и спланированный архитектором Рихардом Кауфманом концентрическими кругами, которые до сих пор служат приметой с воздуха, взял библейское имя; там вырос Моше Даян. Два кандидата лежат в нескольких километрах друг от друга в Изреельской долине, третий — примерно в 20 км от них, в Хайфе, на севере Израиля."
  uk:
    - "Нагалал, якого пишуть також Нагаллал і Нагалол, був містом племені Завулона на краю Їзреельської долини; його названо поруч із Каттатом, Шімроном, Ідалою та Вифлеємом Галілейським серед дванадцяти міст цього племені, а разом із пасовищами його віддано левітам з роду Мерарі: «Димну з пасовищами її, та Нагалал вкупі з пасовищами його — чотири городи». Назва, схоже, означає водопій або пасовище для отар. Спочатку плем'я міста не здобуло: «І Зебулон не повиганяв осадників Китронських і осадників Наглолських; так і зостались Канаанїї проміж ними на житлї, та й платили їм дань». Більше Біблія нічого не каже, і з інших давніх джерел про нього нічого не відомо."
    - "Де саме він лежав, суперечать. Єрусалимський Талмуд каже, що Нагалал — це Магалул, який ототожнюють із Маалюлем, селом, що до 1948 року стояло на північному краю долини, на захід від Назарета; це найдавніше ототожнення. Інші шукали його в Тель-Нахалі (Телль-ен-Нахль) біля гирла Кішона в Хайфі, назва якого нагадує давню, або в руїнах поблизу сучасного села Нагалал у західній частині долини, які карта вказує першими; жодні розкопки питання не розв'язали, і карта показує всі три місця."
    - "Сучасний Нагалал, заснований 1921 року як перший мошав, кооперативне землеробське село, і спланований архітектором Ріхардом Кауфманом у вигляді концентричних кіл, які й досі є орієнтиром із повітря, дістав біблійну назву; тут виріс Моше Даян. Два з претендентів лежать за кілька кілометрів один від одного в Їзреельській долині, а третій — приблизно за 20 км, у Хайфі, на півночі Ізраїлю."
  es:
    - "Nahalal, escrita también Nahallal y Nahalol, era una ciudad de Zabulón en el borde de la llanura de Jezreel, nombrada junto con Catat, Simrón, Idala y Belén de Galilea entre las doce ciudades de la tribu, y entregada con sus pastos a los levitas de Merari: «Dimna con sus ejidos, Naalal con sus ejidos: cuatro villas». El nombre parece significar un abrevadero o un pasto para los rebaños. La tribu no la poseyó al principio: «Tampoco Zabulón echó á los que habitaban en Chîtron y á los que habitaban en Naalol; mas el Cananeo habitó en medio de él, y le fueron tributarios». La Biblia no dice más, y de ella no se sabe nada por otras fuentes antiguas."
    - "Su ubicación es discutida. El Talmud de Jerusalén dice que Nahalal es Mahalul, que se identifica con Ma'lul, una aldea que estuvo hasta 1948 en el borde norte del valle, al oeste de Nazaret, y es la identificación más antigua. Otros han mirado a Tel Nahal (Tell en-Nahl), junto a la desembocadura del Cisón en Haifa, cuyo nombre se parece al antiguo, o a unas ruinas cercanas a la actual aldea de Nahalal, en el valle occidental, que el mapa señala en primer lugar; ninguna excavación ha resuelto la cuestión, y el mapa muestra las tres."
    - "La actual Nahalal, fundada en 1921 como el primer moshav, una aldea agrícola cooperativa, y trazada por el arquitecto Richard Kauffmann en círculos concéntricos que aún son un punto de referencia visto desde el aire, tomó el nombre bíblico; Moshé Dayan se crió allí. Dos de los candidatos están a pocos kilómetros uno del otro en el valle de Jezreel, y el tercero a unos 20 km, en Haifa, en el norte de Israel."
  pt:
    - "Naalal, também grafada Naalol e Nahallal, era uma cidade de Zebulom na orla da planície de Jezreel, citada com Catate, Sinrom, Idala e Belém da Galileia entre as doze cidades da tribo, e entregue com suas pastagens aos levitas de Merari: “Dimna com suas pastagens e Naalal com suas pastagens: quatro cidades.” O nome parece significar um bebedouro ou pasto para rebanhos. A tribo não a ocupou de início: “Zebulom não expulsou os habitantes de Quitrom, nem os habitantes de Naalal; mas os cananeus viveram entre eles e foram sujeitos a trabalhos forçados.” A Bíblia não diz mais nada, e nada se sabe dela por outras fontes antigas."
    - "Onde ficava é disputado. O Talmude de Jerusalém diz que Naalal é Mahalul, que se identifica com Ma'lul, aldeia que existiu até 1948 na borda norte do vale, a oeste de Nazaré, e que é a identificação mais antiga. Outros pensaram em Tel Nahal (Tell en-Nahl), junto à foz do Quisom, em Haifa, cujo nome lembra o antigo, ou em uma ruína perto da atual aldeia de Nahalal, no oeste do vale, que o mapa indica em primeiro lugar; nenhuma escavação resolveu a questão, e o mapa mostra os três locais."
    - "A atual Nahalal, fundada em 1921 como o primeiro moshav, aldeia agrícola cooperativa, e traçada pelo arquiteto Richard Kauffmann em círculos concêntricos que ainda são um marco visto do ar, tomou o nome bíblico; Moshe Dayan cresceu ali. Dois dos candidatos ficam a poucos quilômetros um do outro no vale de Jezreel, e o terceiro a cerca de 20 km, em Haifa, no norte de Israel."
  de:
    - "Nahalal, auch Nahallal und Nahalol geschrieben, war eine Stadt Sebulons am Rand der Jesreel-Ebene. Sie wird mit Kattat, Schimron, Jidala und Bethlehem in Galiläa unter den zwölf Städten des Stammes genannt und wurde samt ihren Weideflächen den Leviten aus Merari gegeben: „Dimna und seine Vorstädte, Nahalal und seine Vorstädte.“ Der Name bedeutet wohl eine Tränke oder Weide für Herden. Der Stamm besaß die Stadt zunächst nicht: „Sebulon vertrieb auch nicht die Einwohner von Kitron und Nahalol; sondern die Kanaaniter wohnten unter ihnen und waren zinsbar.“ Mehr sagt die Bibel nicht, und aus anderen antiken Quellen ist nichts über den Ort bekannt."
    - "Wo er lag, ist umstritten. Der Jerusalemer Talmud setzt Nahalal mit Mahalul gleich, das als Ma'lul gilt, ein Dorf am nördlichen Rand der Ebene westlich von Nazareth, das bis 1948 bestand; es ist die älteste Gleichsetzung. Andere dachten an Tel Nahal (Tell en-Nahl) an der Mündung des Kischon bei Haifa, dessen Name dem alten ähnelt, oder an eine Ruine nahe dem heutigen Dorf Nahalal in der westlichen Ebene, die die Karte an erster Stelle nennt. Keine Grabung hat die Frage entschieden, und die Karte zeigt alle drei."
    - "Das heutige Nahalal wurde 1921 als erster Moschaw, ein genossenschaftliches Bauerndorf, gegründet, vom Architekten Richard Kauffmann in konzentrischen Kreisen angelegt, die aus der Luft noch immer ein Wahrzeichen sind, und übernahm den biblischen Namen; Mosche Dayan wuchs dort auf. Zwei der Kandidaten liegen nur wenige Kilometer voneinander entfernt in der Jesreel-Ebene, der dritte etwa 20 km entfernt bei Haifa im Norden Israels."
  fr:
    - "Nahalal, aussi écrit Nahallal et Nahalol, était une ville de Zabulon au bord de la plaine de Jizreel, citée avec Katthath, Schimron, Idala et Bethléem de Galilée parmi les douze villes de la tribu, et donnée avec ses pâturages aux Lévites de Merari : « Dimna et sa banlieue, et Nahalal et sa banlieue, quatre villes. » Le nom semble signifier un abreuvoir ou un pâturage pour les troupeaux. La tribu ne la posséda pas d’abord : « Zabulon ne chassa point les habitants de Kitron, ni les habitants de Nahalol ; et les Cananéens habitèrent au milieu de Zabulon, mais ils furent assujettis à un tribut. » La Bible n’en dit pas davantage, et d’autres sources anciennes n’en disent rien."
    - "Son emplacement est disputé. Le Talmud de Jérusalem dit que Nahalal est Mahalul, que l’on identifie à Ma’lul, village qui s’élevait jusqu’en 1948 au bord nord de la vallée, à l’ouest de Nazareth, et c’est la plus ancienne identification. D’autres ont songé à Tel Nahal (Tell en-Nahl), à l’embouchure du Kison, à Haïfa, dont le nom ressemble à l’ancien, ou à des ruines proches du village moderne de Nahalal, dans l’ouest de la vallée, que la carte cite en premier ; aucune fouille n’a tranché, et la carte montre les trois."
    - "Le Nahalal moderne, fondé en 1921 comme premier moshav, village agricole coopératif, et tracé par l’architecte Richard Kauffmann en cercles concentriques qui restent un repère vu du ciel, a repris le nom biblique ; Moshe Dayan y a grandi. Deux des candidats se trouvent à quelques kilomètres l’un de l’autre dans la vallée de Jizreel, et le troisième à quelque 20 km, à Haïfa, dans le nord d’Israël."
  it:
    - "Naalal, scritta anche Nahallal e Nahalol, era una città di Zabulon al margine della piana di Izreel, citata con Kattat, Simron, Idala e Betlemme di Galilea tra le dodici città della tribù e assegnata con i suoi pascoli ai Leviti di Merari: «Dimna e il suo contado, e Nahalal col suo contado: quattro città». Il nome sembra significare un abbeveratoio o un pascolo per le greggi. La tribù non la tenne subito: «Zabulon non cacciò gli abitanti di Kitron, né gli abitanti di Nahalol; e i Cananei abitarono in mezzo a Zabulon e furon soggetti a servitù». La Bibbia non dice altro, e da altre fonti antiche non se ne sa nulla."
    - "Dove sorgesse è controverso. Il Talmud di Gerusalemme dice che Naalal è Mahalul, identificata con Ma’lul, un villaggio che fino al 1948 sorgeva sul margine settentrionale della valle, a ovest di Nazaret, ed è l’identificazione più antica. Altri hanno guardato a Tel Nahal (Tell en-Nahl), presso la foce del Kison a Haifa, il cui nome somiglia all’antico, o a una rovina vicino all’odierno villaggio di Nahalal nella parte occidentale della valle, che la mappa elenca per prima; nessuno scavo ha risolto la questione, e la mappa mostra tutti e tre i luoghi."
    - "L’odierna Nahalal, fondata nel 1921 come primo moshav, un villaggio agricolo cooperativo, e progettata dall’architetto Richard Kauffmann in cerchi concentrici che ancora oggi sono un punto di riferimento visto dall’alto, ha preso il nome biblico; vi crebbe Moshe Dayan. Due dei candidati distano pochi chilometri l’uno dall’altro nella valle di Izreel, il terzo circa 20 km più in là, a Haifa, nel nord di Israele."
  pl:
    - "Nahalal, pisany też Nahallal i Nahalol, było miastem Zabulona na skraju równiny Jizreel, wymienionym wraz z Kattat, Szimronem, Jidalą i Betlejem w Galilei wśród dwunastu miast pokolenia i oddanym wraz z pastwiskami lewitom z rodu Merariego: „Damna i przedmieścia jego; Nahalol i przedmieścia jego; miasta cztery”. Nazwa zdaje się oznaczać wodopój lub pastwisko dla trzód. Pokolenie nie objęło go od razu w posiadanie: „Zabulon też nie wypędził mieszkających w Cetron, i mieszkających w Nahalol; przetoż mieszkał Chananejczyk między nimi, będąc hołdownikiem ich”. Biblia nie mówi o nim nic więcej i z innych źródeł starożytnych nic o nim nie wiadomo."
    - "Gdzie leżało, jest sporne. Talmud jerozolimski mówi, że Nahalal to Mahalul, który uchodzi za Ma'lul, wieś stojącą do 1948 roku na północnym skraju doliny, na zachód od Nazaretu; jest to najstarsze utożsamienie. Inni wskazywali Tel Nahal (Tell en-Nahl) przy ujściu Kiszonu w Hajfie, którego nazwa przypomina dawną, albo ruiny koło dzisiejszej wsi Nahalal w zachodniej części doliny, które mapa wymienia na pierwszym miejscu; żadne wykopaliska nie rozstrzygnęły sprawy, a mapa pokazuje wszystkie trzy miejsca."
    - "Współczesny Nahalal, założony w 1921 roku jako pierwszy moszaw, czyli spółdzielcza wieś rolnicza, i zaplanowany przez architekta Richarda Kauffmanna w koncentrycznych kręgach, które do dziś są z powietrza charakterystycznym punktem orientacyjnym, przejął biblijną nazwę; wychował się tu Mosze Dajan. Dwaj kandydaci leżą w odległości kilku kilometrów od siebie w dolinie Jizreel, a trzeci około 20 km dalej, w Hajfie, w północnym Izraelu."
  cs:
    - "Nahalal, psaný také Nahallal a Nahalol, byl město Zebulunova pokolení na okraji Jizreelské roviny, uváděné spolu s Kattatem, Šimronem, Jidalou a galilejským Betlémem mezi dvanácti městy tohoto pokolení a vydané s pastvinami levitům z rodu Merari: „Damna a předměstí jeho, Naalol a předměstí jeho, města čtyři.“ Jméno snad znamená napajedlo nebo pastvinu pro stáda. Pokolení je zprvu nezískalo: „Zabulon též nevyhnal obyvatelů Cetron, a obyvatelů Naalol, protož bydlil Kananejský u prostřed něho, a dával jemu plat.“ Víc Bible neříká a z jiných starověkých pramenů o něm nic známo není."
    - "Kde ležel, je sporné. Jeruzalémský talmud praví, že Nahalal je Mahalul, v němž se vidí Maalul, vesnice, která do roku 1948 stála na severním okraji roviny západně od Nazareta; je to nejstarší ztotožnění. Jiní hledali jej na Tel Nahal (Tell en-Nahl) u ústí Kíšonu v Haifě, jehož jméno se tomu starému podobá, nebo v rozvalinách u dnešní vesnice Nahalal v západní části roviny, které mapa uvádí na prvním místě; žádné vykopávky věc nerozhodly a mapa ukazuje všechna tři místa."
    - "Dnešní Nahalal, založený roku 1921 jako první mošav, družstevní zemědělská vesnice, a architektem Richardem Kauffmannem rozvržený do soustředných kruhů, které jsou dodnes výrazným orientačním bodem při pohledu ze vzduchu, převzal biblické jméno; vyrostl tu Moše Dajan. Dva z kandidátů leží v Jizreelském údolí několik kilometrů od sebe a třetí asi 20 km odtud v Haifě, na severu Izraele."
  nl:
    - "Nahalal, ook gespeld Nahallal en Nahalol, was een stad van Zebulon aan de rand van de vlakte van Jizreël. Ze wordt genoemd met Kattat, Simron, Jidala en Bethlehem in Galilea onder de twaalf steden van de stam en werd met haar weidegronden gegeven aan de Levieten van Merari: “Dimna en haar voorsteden, Nahalal en haar voorsteden: vier steden.” De naam betekent kennelijk drinkplaats of weide voor kudden. De stam bezat haar aanvankelijk niet: “Zebulon verdreef de inwoners van Kitron niet, noch de inwoners van Nahalol; maar de Kanaänieten woonden in het midden van hem, en waren cijnsbaar.” Meer zegt de Bijbel niet, en uit andere oude bronnen is er niets over bekend."
    - "Waar ze lag, is omstreden. De Jeruzalemse Talmoed zegt dat Nahalal Mahalul is, dat wordt gelijkgesteld met Ma’lul, een dorp dat tot 1948 aan de noordrand van de vallei ten westen van Nazareth stond; dat is de oudste identificatie. Anderen dachten aan Tel Nahal (Tell en-Nahl) bij de monding van de Kison bij Haifa, waarvan de naam op de oude lijkt, of aan een ruïne bij het moderne dorp Nahalal in het westen van de vallei, dat de kaart als eerste vermeldt; geen opgraving heeft de kwestie beslecht, en de kaart toont alle drie."
    - "Het moderne Nahalal, in 1921 gesticht als eerste mosjav, een coöperatief landbouwdorp, en door architect Richard Kauffmann aangelegd in concentrische cirkels die vanuit de lucht nog steeds opvallen, nam de bijbelse naam over; Mosje Dayan groeide er op. Twee van de kandidaten liggen op enkele kilometers van elkaar in de vallei van Jizreël, de derde zo’n 20 km verderop bij Haifa, in het noorden van Israël."
  sv:
    - "Nahalal, även stavat Nahallal och Nahalol, var en stad i Sebulon i utkanten av Jisreelslätten, nämnd tillsammans med Kattat, Shimron, Jidala och Betlehem i Galileen bland stammens tolv städer, och given med sina betesmarker åt Meraris leviter: ”Dimna med dess utmarker och Nahalal med dess utmarker – fyra städer.” Namnet förefaller betyda en vattningsplats eller betesmark för boskap. Stammen höll den inte från början: ”Sebulon fördrev icke invånarna i Kitron och invånarna i Nahalol, utan kananéerna bodde kvar bland dem, men blevo arbetspliktiga under dem.” Bibeln säger inget mer, och ingenting är känt om staden från andra forntida källor."
    - "Var den låg är omstritt. Jerusalemtalmud säger att Nahalal är Mahalul, vilket antas vara Ma'lul, en by som låg vid dalens norra kant väster om Nasaret fram till 1948, och det är den äldsta identifikationen. Andra har sett Tel Nahal (Tell en-Nahl) vid Kishons mynning i Haifa, vars namn liknar det gamla, eller en ruin nära den moderna byn Nahalal i den västra dalen, som kartan anger först; ingen utgrävning har avgjort saken, och kartan visar alla tre."
    - "Det moderna Nahalal, grundat 1921 som den första moshaven, en kooperativ jordbruksby, och planlagt av arkitekten Richard Kauffmann i koncentriska cirklar som ännu är ett landmärke sett från luften, tog det bibliska namnet; Moshe Dayan växte upp där. Två av kandidaterna ligger inom några kilometer från varandra i Jisreeldalen, och den tredje cirka 20 km bort vid Haifa, i norra Israel."
  nb:
    - "Nahalal, også skrevet Nahallal og Nahalol, var en by i Sebulon i kanten av Jisreel-sletten, nevnt sammen med Kattat, Sjimron, Jidala og Betlehem i Galilea blant stammens tolv byer, og gitt med sine beitemarker til Meraris levitter: «Dimna med jorder, Nahalal med jorder – fire byer.» Navnet synes å bety et vanningssted eller en beitemark for flokker. Stammen eide den ikke først: «Sebulon drev ikke bort innbyggerne i Kitron og innbyggerne i Nahalol, men kana'anittene blev boende midt iblandt dem og blev arbeidspliktige.» Bibelen sier ikke mer, og ingenting er kjent om den fra andre gamle kilder."
    - "Hvor den lå, er omstridt. Jerusalem-talmud sier at Nahalal er Mahalul, som antas å være Ma'lul, en landsby som lå ved dalens nordkant vest for Nasaret til 1948, og dette er den eldste identifikasjonen. Andre har sett mot Tel Nahal (Tell en-Nahl) ved munningen av Kisjon ved Haifa, hvis navn ligner det gamle, eller mot en ruin nær den moderne landsbyen Nahalal i den vestlige dalen, som kartet oppfører først; ingen utgravning har avgjort saken, og kartet viser alle tre."
    - "Det moderne Nahalal, grunnlagt i 1921 som den første moshaven, en kooperativ landbrukslandsby, og tegnet av arkitekten Richard Kauffmann i konsentriske sirkler som fortsatt er et landemerke fra luften, tok det bibelske navnet; Moshe Dayan vokste opp der. To av kandidatene ligger noen få kilometer fra hverandre i Jisreel-dalen, og den tredje omtrent 20 km unna ved Haifa, i Nord-Israel."
  tl:
    - "Ang Naalal, na binabaybay ding Nahallal at Naalol, ay isang bayan ng Zabulon sa gilid ng kapatagan ng Jezreel, na pinangalanan kasama ng Catah, Simron, Ideala at Bethlehem ng Galilea sa labindalawang bayan ng lipi, at ibinigay kasama ng mga pastulan nito sa mga Levita ng Merari: “Ang Dimna pati ng mga nayon niyaon, ang Naalal pati ng mga nayon niyaon; apat na bayan.” Tila nangangahulugan ang pangalan ng isang inuman ng tubig o pastulan para sa mga kawan. Hindi ito hinawakan ng lipi sa simula: “Hindi pinalayas ni Zabulon ang mga nananahan sa Chitron, ni ang mga nananahan sa Naalol; kundi ang mga Cananeo ay nagsitahan sa gitna nila, at naging mga tagapagpaatag.” Wala nang sinasabi pa ang Bibliya, at walang nalalaman tungkol dito mula sa iba pang sinaunang batis."
    - "Pinagtatalunan kung saan ito matatagpuan. Sinasabi ng Talmud ng Jerusalem na ang Naalal ay Mahalul, na itinuturing na Ma'lul, isang nayon na nakatayo sa hilagang gilid ng libis sa kanluran ng Nazaret hanggang 1948, at iyon ang pinakamatandang pagkilala. Tumingin ang iba sa Tel Nahal (Tell en-Nahl) sa bunganga ng Cison sa Haifa, na ang pangalan ay kahawig ng luma, o sa isang guho malapit sa makabagong nayon ng Nahalal sa kanlurang libis, na unang nakalista sa mapa; walang paghuhukay ang nakalutas sa usapin, at ipinapakita ng mapa ang lahat ng tatlo."
    - "Ang makabagong Nahalal, na itinatag noong 1921 bilang kauna-unahang moshav, isang kooperatibang nayong pansakahan, at inilatag ng arkitektong si Richard Kauffmann sa mga konsentrikong bilog na landmark pa rin kapag tiningnan mula sa himpapawid, ay kumuha ng pangalang biblikal; doon lumaki si Moshe Dayan. Dalawa sa mga kandidato ay magkalapit sa loob ng ilang kilometro sa libis ng Jezreel, at ang ikatlo ay mga 20 km ang layo sa Haifa, sa hilagang Israel."
