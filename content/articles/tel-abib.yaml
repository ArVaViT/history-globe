body:
  en:
    - "Tel-abib was a settlement of Judean exiles in Babylonia, where Ezekiel lived after his call by the river of Chebar: “Then I came to them of the captivity at Tel-abib, that dwelt by the river of Chebar, and I sat where they sat, and remained there astonished among them seven days.” The name is usually explained from Akkadian til abubi, “mound of the flood”, that is, an ancient ruin mound. The Chebar was a canal near Nippur, the Kabaru of the fifth-century BC business archive of the Murashu family; the site of Tel-abib itself has not been found."
    - "The exiles' life in such villages is known from cuneiform tablets of a place called Al-Yahudu, “the town of Judah”, somewhere in the same region, dated from 572 to 477 BC, which record Judean families leasing land, paying taxes and giving their children Hebrew names. In 1902 Nahum Sokolow chose the biblical name as the title of his Hebrew translation of Theodor Herzl's novel Altneuland, “old-new land”, and in 1910 the new Jewish quarter founded beside Jaffa took the name Tel Aviv."
  ru:
    - "Тел-Авив — поселение иудейских изгнанников в Вавилонии, где жил Иезекииль после своего призвания при реке Ховаре: «И пришел я к переселенным в Тел-Авив, живущим при реке Ховаре, и остановился там, где они жили, и провел среди них семь дней в изумлении». Имя обычно объясняют из аккадского тиль абуби, «холм потопа», то есть древний холм развалин. Ховар был каналом близ Ниппура — Кабару делового архива семьи Мурашу V в. до н. э.; само место Тел-Авива не найдено."
    - "Жизнь изгнанников в таких селениях известна по клинописным табличкам из места Аль-Яхуду, «город Иудеи», в той же области, датированным 572–477 гг. до н. э., где иудейские семьи арендуют землю, платят подати и дают детям еврейские имена. В 1902 г. Наум Соколов взял библейское имя для заглавия своего еврейского перевода романа Теодора Герцля «Альтнойланд» («Старая новая земля»), и в 1910 г. новый еврейский квартал, основанный рядом с Яффой, получил имя Тель-Авив."
  cs:
    - "Tel-abíb bylo sídliště judských vyhnanců v Babylonii, kde Ezechiel žil po svém povolání u řeky Kebar: „I přišel jsem k zajatým do Telabib, bydlícím při řece Chebar, a seděl jsem, kdež oni bydlili. Seděl jsem, pravím, sedm dní u prostřed nich s užasnutím.“ Jméno se obvykle vykládá z akkadského til abubi, „pahorek potopy“, tedy starověký zříceninový pahorek. Kebar byl kanál poblíž Nippuru, Kabaru obchodního archivu rodiny Murašú z pátého století př. n. l.; samo místo Tel-abíbu nebylo nalezeno."
    - "Život vyhnanců v takových vesnicích je znám z klínopisných tabulek místa zvaného Al-Jahúdu, „město Judy“, kdesi v téže oblasti, datovaných od roku 572 do roku 477 př. n. l., které zaznamenávají judské rodiny pronajímající půdu, platící daně a dávající svým dětem hebrejská jména. V roce 1902 zvolil Nachum Sokolov biblické jméno za název svého hebrejského překladu románu Theodora Herzla Altneuland, „stará nová země“, a v roce 1910 převzala jméno Tel Aviv nová židovská čtvrť založená vedle Jaffy."
  uk:
    - "Тел-Авів був поселенням юдейських вигнанців у Вавилонії, де жив Єзекіїль після свого покликання над річкою Хебар: «І прибув я так до переселенцїв у Тель-Абиб, і осїв там, де вони жили, та й провів між ними сїм день, у безтямі». Назву зазвичай пояснюють з аккадського til abubi, «пагорб потопу», тобто давній пагорб-руїна. Хебар був каналом поблизу Ніппура, Кабару ділового архіву родини Мурашу V ст. до н. е.; саме місце Тел-Авіва не знайдено."
    - "Життя вигнанців у таких селах відоме з клинописних табличок місця під назвою Аль-Яхуду, «місто Юди», десь у тому самому краї, датованих 572–477 рр. до н. е., які фіксують юдейські родини, що орендують землю, платять податки й дають дітям єврейські імена. 1902 р. Нахум Соколов обрав біблійну назву для свого єврейського перекладу роману Теодора Герцля «Altneuland», «стара-нова земля», а 1910 р. новий єврейський квартал, заснований поряд із Яффою, дістав назву Тель-Авів."
  pl:
    - "Tel-Abib było osadą wygnańców judzkich w Babilonii, gdzie mieszkał Ezechiel po swoim powołaniu nad rzeką Kebar: „I przyszedłem do pojmanych do Telabib, którzy mieszkali przy rzece Chebar, i siadłem gdzie oni mieszkali, a siedziałem tam siedm dni w pośrodku ich, zdumiawszy się”. Nazwę wyjaśnia się zwykle z akadyjskiego til abubi, „wzgórze potopu”, czyli dawne wzgórze ruin. Kebar był kanałem koło Nippur, Kabaru z V-wiecznego archiwum handlowego rodziny Murasu; samego Tel-Abib nie odnaleziono."
    - "Życie wygnańców w takich wsiach znamy z tabliczek klinowych z miejscowości zwanej Al-Jahudu, „miasto Judy”, gdzieś w tym samym regionie, datowanych na lata 572-477 p.n.e., które zapisują judzkie rodziny dzierżawiące ziemię, płacące podatki i nadające dzieciom imiona hebrajskie. W 1902 roku Nahum Sokolow wybrał biblijną nazwę na tytuł hebrajskiego przekładu powieści Theodora Herzla Altneuland, „stara-nowa ziemia”, a w 1910 roku nowa dzielnica żydowska założona obok Jafy przyjęła nazwę Tel Awiw."
  es:
    - "Tel-abib fue un asentamiento de desterrados judaítas en Babilonia, donde vivió Ezequiel tras su llamada junto al río Quebar: «Y vine á los trasportados en Telabib, que moraban junto al río de Chebar, y asenté donde ellos estaban asentados, y allí permanecí siete días atónito entre ellos». El nombre suele explicarse por el acadio til abubi, «montículo del diluvio», es decir, un antiguo montículo de ruinas. El Quebar era un canal cerca de Nippur, el Kabaru del archivo comercial de la familia Murashu del siglo V a. C.; el emplazamiento de la propia Tel-abib no ha sido hallado."
    - "La vida de los desterrados en tales aldeas se conoce por tablillas cuneiformes de un lugar llamado Al-Yahudu, «la ciudad de Judá», en algún punto de la misma región, fechadas de 572 a 477 a. C., que registran a familias judaítas arrendando tierras, pagando impuestos y poniendo a sus hijos nombres hebreos. En 1902 Nahum Sokolow eligió el nombre bíblico como título de su traducción hebrea de la novela de Theodor Herzl Altneuland, «tierra vieja-nueva», y en 1910 el nuevo barrio judío fundado junto a Jaffa tomó el nombre de Tel Aviv."
  pt:
    - "Tel-Abibe era um povoado de exilados judeus na Babilônia, onde Ezequiel vivia depois do seu chamado junto ao rio Quebar: “Então cheguei aos do cativeiro em Tel-Abibe, que moravam junto ao rio Quebar, e aonde eles moravam; e sentei-me ali atônito entre eles por sete dias.” O nome costuma ser explicado a partir do acádico til abubi, “montículo do dilúvio”, isto é, um antigo montículo de ruínas. O Quebar era um canal perto de Nipur, o Kabaru do arquivo comercial da família Murashu, do século V a.C.; o sítio de Tel-Abibe em si não foi encontrado."
    - "A vida dos exilados em tais aldeias é conhecida por tabuinhas cuneiformes de um lugar chamado Al-Yahudu, “a cidade de Judá”, em algum ponto da mesma região, datadas de 572 a 477 a.C., que registram famílias judaicas arrendando terras, pagando impostos e dando aos filhos nomes hebraicos. Em 1902 Nahum Sokolow escolheu o nome bíblico como título de sua tradução hebraica do romance Altneuland, “terra velha-nova”, de Theodor Herzl, e em 1910 o novo bairro judaico fundado ao lado de Jafa tomou o nome de Tel Aviv."
  de:
    - "Tel-Abib war eine Siedlung judäischer Verbannter in Babylonien, wo Hesekiel nach seiner Berufung am Fluss Kebar lebte: „Und ich kam zu den Gefangenen, die am Wasser Chebar wohnten, gen Thel-Abib, und setzte mich zu ihnen, die da saßen, und blieb daselbst unter ihnen sieben Tage ganz traurig.“ Der Name wird gewöhnlich aus dem akkadischen til abubi erklärt, „Hügel der Flut“, das heißt ein alter Ruinenhügel. Der Kebar war ein Kanal nahe Nippur, das Kabaru des Geschäftsarchivs der Familie Muraschu aus dem fünften Jahrhundert v. Chr.; die Stätte von Tel-Abib selbst ist nicht gefunden."
    - "Das Leben der Verbannten in solchen Dörfern ist aus Keilschrifttafeln eines Ortes namens Al-Jahudu, „Stadt Judas“, irgendwo in derselben Gegend, bekannt, datiert von 572 bis 477 v. Chr., die judäische Familien verzeichnen, die Land pachteten, Steuern zahlten und ihren Kindern hebräische Namen gaben. 1902 wählte Nahum Sokolow den biblischen Namen als Titel seiner hebräischen Übersetzung von Theodor Herzls Roman Altneuland, und 1910 nahm das neue jüdische Viertel, das neben Jaffa gegründet wurde, den Namen Tel Aviv an."
  fr:
    - "Tel-Abib était une colonie d’exilés judéens en Babylonie, où Ézéchiel vécut après son appel près du fleuve Kebar : « J’arrivai à Thel-Abib, vers les exilés qui demeuraient près du fleuve du Kebar, et dans le lieu où ils se trouvaient ; là je restai sept jours, stupéfait au milieu d’eux. » Le nom s’explique d’ordinaire par l’akkadien til abubi, « butte du déluge », c’est-à-dire une ancienne butte de ruines. Le Kebar était un canal près de Nippur, le Kabaru des archives commerciales de la famille Murashu, du Ve siècle av. J.-C. ; le site de Tel-Abib lui-même n’a pas été trouvé."
    - "La vie des exilés dans de tels villages est connue par des tablettes cunéiformes d’un lieu appelé Al-Yahudu, « la ville de Juda », quelque part dans la même région, datées de 572 à 477 av. J.-C., qui montrent des familles judéennes louant des terres, payant des impôts et donnant à leurs enfants des noms hébreux. En 1902, Nahum Sokolow choisit le nom biblique comme titre de sa traduction hébraïque du roman Altneuland de Theodor Herzl, « vieille-nouvelle terre », et en 1910 le nouveau quartier juif fondé à côté de Jaffa prit le nom de Tel-Aviv."
  it:
    - "Tel-Abib era un insediamento di esuli giudei in Babilonia, dove Ezechiele visse dopo la sua chiamata presso il fiume Chebar: «E giunsi da quelli ch’erano in cattività a Tel-abib presso al fiume Kebar, e mi fermai dov’essi dimoravano; e dimorai quivi sette giorni, mesto e silenzioso, in mezzo a loro». Il nome si spiega di solito dall’accadico til abubi, «tell del diluvio», cioè un’antica collina di rovine. Il Chebar era un canale presso Nippur, il Kabaru dell’archivio commerciale del V secolo a.C. della famiglia dei Murashu; il sito di Tel-Abib non è stato trovato."
    - "La vita degli esuli in simili villaggi è nota da tavolette cuneiformi di un luogo chiamato Al-Yahudu, «la città di Giuda», da qualche parte nella stessa regione, datate dal 572 al 477 a.C., che registrano famiglie giudee che prendono terra in affitto, pagano tasse e danno ai figli nomi ebraici. Nel 1902 Nahum Sokolow scelse il nome biblico come titolo della sua traduzione ebraica del romanzo Altneuland di Theodor Herzl, «terra vecchia-nuova», e nel 1910 il nuovo quartiere ebraico fondato accanto a Giaffa prese il nome di Tel Aviv."
  nl:
    - "Tel-Abib was een nederzetting van Judese ballingen in Babylonië, waar Ezechiël woonde na zijn roeping aan de rivier de Kebar: “En ik kwam tot de weggevoerden te Tel-Abib, die aan de rivier Chebar woonden, en ik bleef daar zij woonden; ja, ik bleef daar verbaasd in het midden van hen zeven dagen.” De naam wordt gewoonlijk verklaard uit het Akkadische til abubi, ‘heuvel van de vloed’, dat wil zeggen een oude ruïneheuvel. De Kebar was een kanaal bij Nippur, het Kabaru van het zakenarchief van de familie Murashu uit de vijfde eeuw v.Chr.; de plaats van Tel-Abib zelf is niet gevonden."
    - "Het leven van de ballingen in zulke dorpen is bekend uit spijkerschrifttabletten van een plaats Al-Yahudu, ‘de stad van Juda’, ergens in dezelfde streek, gedateerd van 572 tot 477 v.Chr., die Judese families vermelden die land pachtten, belasting betaalden en hun kinderen Hebreeuwse namen gaven. In 1902 koos Nahum Sokolow de bijbelse naam als titel van zijn Hebreeuwse vertaling van Theodor Herzls roman Altneuland, ‘oud-nieuw land’, en in 1910 kreeg de nieuwe Joodse wijk bij Jaffa de naam Tel Aviv."
  sv:
    - "Tel-Abib var en bosättning av judeiska landsflyktiga i Babylonien, där Hesekiel bodde efter sin kallelse vid floden Kebar: ”Och jag kom till de fångna i Tel-Abib, till dem som bodde vid strömmen Kebar, till den plats där de bodde; och jag satt där ibland dem i sju dagar, försänkt i djup sorg.” Namnet förklaras vanligen ur akkadiskans til abubi, ”översvämningens kulle”, det vill säga en forntida ruinkulle. Kebar var en kanal nära Nippur, Kabaru i släkten Murashus affärsarkiv från 400-talet f.Kr.; själva platsen Tel-Abib har inte hittats."
    - "De landsflyktigas liv i sådana byar är känt från kilskriftstavlor från en plats kallad Al-Yahudu, ”Judas stad”, någonstans i samma region, daterade från 572 till 477 f.Kr., som berättar om judeiska familjer som arrenderade mark, betalade skatt och gav sina barn hebreiska namn. År 1902 valde Nahum Sokolow det bibliska namnet som titel på sin hebreiska översättning av Theodor Herzls roman Altneuland, ”gammalt-nytt land”, och år 1910 fick den nya judiska stadsdelen som grundades bredvid Jaffa namnet Tel Aviv."
  nb:
    - "Tel-Abib var en bosetning av judeiske eksilerte i Babylonia, der Esekiel bodde etter at han var blitt kalt ved elven Kebar: «jeg kom til de bortførte i Tel-Abib, de som bodde ved elven Kebar, og hvor de ellers bodde, og jeg satt der i syv dager iblandt dem og stirret frem for mig». Navnet forklares vanligvis av akkadisk til abubi, «syndflodens haug», det vil si en eldgammel ruinhaug. Kebar var en kanal nær Nippur, Kabaru i Murashu-familiens forretningsarkiv fra 400-tallet f.Kr.; selve stedet Tel-Abib er ikke funnet."
    - "De eksilertes liv i slike landsbyer er kjent fra kileskrifttavler fra et sted kalt Al-Yahudu, «Judas by», et sted i samme region, datert fra 572 til 477 f.Kr., som forteller om judeiske familier som leier jord, betaler skatt og gir barna hebraiske navn. I 1902 valgte Nahum Sokolow det bibelske navnet som tittel på sin hebraiske oversettelse av Theodor Herzls roman Altneuland, «gammelt–nytt land», og i 1910 fikk den nye jødiske bydelen grunnlagt ved siden av Jaffa navnet Tel Aviv."
