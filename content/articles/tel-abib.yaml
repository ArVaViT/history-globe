body:
  en:
    - "Tel-abib was a settlement of Judean exiles in Babylonia, where Ezekiel lived after his call by the river of Chebar: “Then I came to them of the captivity at Tel-abib, that dwelt by the river of Chebar, and I sat where they sat, and remained there astonished among them seven days.” The name is usually explained from Akkadian til abubi, “mound of the flood”, that is, an ancient ruin mound. The Chebar was a canal near Nippur, the Kabaru of the fifth-century BC business archive of the Murashu family; the site of Tel-abib itself has not been found."
    - "The exiles' life in such villages is known from cuneiform tablets of a place called Al-Yahudu, “the town of Judah”, somewhere in the same region, dated from 572 to 477 BC, which record Judean families leasing land, paying taxes and giving their children Hebrew names. In 1902 Nahum Sokolow chose the biblical name as the title of his Hebrew translation of Theodor Herzl's novel Altneuland, “old-new land”, and in 1910 the new Jewish quarter founded beside Jaffa took the name Tel Aviv."
    - "Read as Hebrew, the name means “hill of ears of grain”: abib is a fresh ear of grain, and also the name of the spring month of the new grain. Jerome kept this sense in the Vulgate, where Ezekiel comes “to the heap of new grain”, while the Greek Septuagint read no place name here and has him come among the captives “passing on high”. Ezekiel was probably among those carried off with King Jehoiachin in 597 BC. He dated his call to the fifth year of that captivity, and later the elders of Judah sat before him in his house."
  ru:
    - "Тел-Авив — поселение иудейских изгнанников в Вавилонии, где жил Иезекииль после своего призвания при реке Ховаре: «И пришел я к переселенным в Тел-Авив, живущим при реке Ховаре, и остановился там, где они жили, и провел среди них семь дней в изумлении». Имя обычно объясняют из аккадского тиль абуби, «холм потопа», то есть древний холм развалин. Ховар был каналом близ Ниппура — Кабару делового архива семьи Мурашу V в. до н. э.; само место Тел-Авива не найдено."
    - "Жизнь изгнанников в таких селениях известна по клинописным табличкам из места Аль-Яхуду, «город Иудеи», в той же области, датированным 572–477 гг. до н. э., где иудейские семьи арендуют землю, платят подати и дают детям еврейские имена. В 1902 г. Наум Соколов взял библейское имя для заглавия своего еврейского перевода романа Теодора Герцля «Альтнойланд» («Старая новая земля»), и в 1910 г. новый еврейский квартал, основанный рядом с Яффой, получил имя Тель-Авив."
    - "Если читать имя по-еврейски, оно значит «холм колосьев»: авив — свежий колос, а также название весеннего месяца нового зерна. Иероним сохранил этот смысл в Вульгате, где Иезекииль приходит «к груде новых плодов», а греческая Септуагинта не увидела здесь названия места и говорит, что он пришёл к пленным «поднятым ввысь». Иезекииль, вероятно, был среди уведённых с царём Иехонией в 597 г. до н. э. Своё призвание он датировал пятым годом этого плена, а позже старейшины Иудейские сидели перед ним в его доме."
  cs:
    - "Tel-abíb bylo sídliště judských vyhnanců v Babylonii, kde Ezechiel žil po svém povolání u řeky Kebar: „I přišel jsem k zajatým do Telabib, bydlícím při řece Chebar, a seděl jsem, kdež oni bydlili. Seděl jsem, pravím, sedm dní u prostřed nich s užasnutím.“ Jméno se obvykle vykládá z akkadského til abubi, „pahorek potopy“, tedy starověký zříceninový pahorek. Kebar byl kanál poblíž Nippuru, Kabaru obchodního archivu rodiny Murašú z pátého století př. n. l.; samo místo Tel-abíbu nebylo nalezeno."
    - "Život vyhnanců v takových vesnicích je znám z klínopisných tabulek místa zvaného Al-Jahúdu, „město Judy“, kdesi v téže oblasti, datovaných od roku 572 do roku 477 př. n. l., které zaznamenávají judské rodiny pronajímající půdu, platící daně a dávající svým dětem hebrejská jména. V roce 1902 zvolil Nachum Sokolov biblické jméno za název svého hebrejského překladu románu Theodora Herzla Altneuland, „stará nová země“, a v roce 1910 převzala jméno Tel Aviv nová židovská čtvrť založená vedle Jaffy."
    - "Čteno hebrejsky znamená jméno „pahorek klasů“: abíb je čerstvý klas a také jméno jarního měsíce nového obilí. Jeroným tento smysl zachoval ve Vulgátě, kde Ezechiel přichází „k hromadě nové úrody“, zatímco řecká Septuaginta zde nečetla žádné místní jméno a nechává ho přijít k zajatcům „povzneseného do výše“. Ezechiel byl pravděpodobně mezi odvedenými s králem Jójakínem roku 597 př. n. l. Své povolání datoval do pátého roku tohoto zajetí a později u něho v domě sedávali starší Judy."
  uk:
    - "Тел-Авів був поселенням юдейських вигнанців у Вавилонії, де жив Єзекіїль після свого покликання над річкою Хебар: «І прибув я так до переселенцїв у Тель-Абиб, і осїв там, де вони жили, та й провів між ними сїм день, у безтямі». Назву зазвичай пояснюють з аккадського til abubi, «пагорб потопу», тобто давній пагорб-руїна. Хебар був каналом поблизу Ніппура, Кабару ділового архіву родини Мурашу V ст. до н. е.; саме місце Тел-Авіва не знайдено."
    - "Життя вигнанців у таких селах відоме з клинописних табличок місця під назвою Аль-Яхуду, «місто Юди», десь у тому самому краї, датованих 572–477 рр. до н. е., які фіксують юдейські родини, що орендують землю, платять податки й дають дітям єврейські імена. 1902 р. Нахум Соколов обрав біблійну назву для свого єврейського перекладу роману Теодора Герцля «Altneuland», «стара-нова земля», а 1910 р. новий єврейський квартал, заснований поряд із Яффою, дістав назву Тель-Авів."
    - "Якщо читати назву по-єврейськи, вона означає «пагорб колосся»: авів — свіжий колос, а також назва весняного місяця нового зерна. Ієронім зберіг цей зміст у Вульгаті, де Єзекіїль приходить «до копиці нового збіжжя», а грецька Септуагінта не побачила тут назви місця й каже, що він прийшов до полонених «піднесений угору». Єзекіїль, імовірно, був серед виведених із царем Єхонією 597 р. до н. е. Своє покликання він датував п’ятим роком цього полону, а згодом старші Юди сиділи перед ним у його домі."
  pl:
    - "Tel-Abib było osadą wygnańców judzkich w Babilonii, gdzie mieszkał Ezechiel po swoim powołaniu nad rzeką Kebar: „I przyszedłem do pojmanych do Telabib, którzy mieszkali przy rzece Chebar, i siadłem gdzie oni mieszkali, a siedziałem tam siedm dni w pośrodku ich, zdumiawszy się”. Nazwę wyjaśnia się zwykle z akadyjskiego til abubi, „wzgórze potopu”, czyli dawne wzgórze ruin. Kebar był kanałem koło Nippur, Kabaru z archiwum handlowego rodziny Murasu z V w. p.n.e.; samego Tel-Abib nie odnaleziono."
    - "Życie wygnańców w takich wsiach znamy z tabliczek klinowych z miejscowości zwanej Al-Jahudu, „miasto Judy”, gdzieś w tym samym regionie, datowanych na lata 572-477 p.n.e., które zapisują judzkie rodziny dzierżawiące ziemię, płacące podatki i nadające dzieciom imiona hebrajskie. W 1902 roku Nahum Sokolow wybrał biblijną nazwę na tytuł hebrajskiego przekładu powieści Theodora Herzla Altneuland, „stara-nowa ziemia”, a w 1910 roku nowa dzielnica żydowska założona obok Jafy przyjęła nazwę Tel Awiw."
    - "Czytana po hebrajsku nazwa znaczy „wzgórze kłosów”: abib to świeży kłos, a także nazwa wiosennego miesiąca nowego zboża. Hieronim zachował ten sens w Wulgacie, gdzie Ezechiel przychodzi „do stosu nowych zbiorów”, natomiast grecka Septuaginta nie odczytała tu nazwy miejsca i każe mu przyjść do jeńców „uniesionym w górę”. Ezechiel był prawdopodobnie wśród uprowadzonych z królem Jojakinem w 597 r. p.n.e. Swoje powołanie datował na piąty rok tej niewoli, a później starsi Judy siedzieli przed nim w jego domu."
  es:
    - "Tel-abib fue un asentamiento de desterrados judaítas en Babilonia, donde vivió Ezequiel tras su llamada junto al río Quebar: «Y vine á los trasportados en Telabib, que moraban junto al río de Chebar, y asenté donde ellos estaban asentados, y allí permanecí siete días atónito entre ellos». El nombre suele explicarse por el acadio til abubi, «montículo del diluvio», es decir, un antiguo montículo de ruinas. El Quebar era un canal cerca de Nippur, el Kabaru del archivo comercial de la familia Murashu del siglo V a. C.; el emplazamiento de la propia Tel-abib no ha sido hallado."
    - "La vida de los desterrados en tales aldeas se conoce por tablillas cuneiformes de un lugar llamado Al-Yahudu, «la ciudad de Judá», en algún punto de la misma región, fechadas de 572 a 477 a. C., que registran a familias judaítas arrendando tierras, pagando impuestos y poniendo a sus hijos nombres hebreos. En 1902 Nahum Sokolow eligió el nombre bíblico como título de su traducción hebrea de la novela de Theodor Herzl Altneuland, «tierra vieja-nueva», y en 1910 el nuevo barrio judío fundado junto a Jaffa tomó el nombre de Tel Aviv."
    - "Leído como hebreo, el nombre significa «colina de espigas»: abib es la espiga tierna, y también el nombre del mes de primavera del grano nuevo. Jerónimo conservó este sentido en la Vulgata, donde Ezequiel llega «al montón de mieses nuevas», mientras que la Septuaginta griega no leyó aquí ningún nombre de lugar y lo hace llegar a los cautivos «elevado en lo alto». Ezequiel estuvo probablemente entre los deportados con el rey Joaquín en 597 a. C. Fechó su llamada en el quinto año de aquella cautividad, y más tarde los ancianos de Judá se sentaron delante de él en su casa."
  pt:
    - "Tel-Abibe era um povoado de exilados judeus na Babilônia, onde Ezequiel vivia depois do seu chamado junto ao rio Quebar: “Então cheguei aos do cativeiro em Tel-Abibe, que moravam junto ao rio Quebar, e aonde eles moravam; e sentei-me ali atônito entre eles por sete dias.” O nome costuma ser explicado a partir do acádico til abubi, “montículo do dilúvio”, isto é, um antigo montículo de ruínas. O Quebar era um canal perto de Nipur, o Kabaru do arquivo comercial da família Murashu, do século V a.C.; o sítio de Tel-Abibe em si não foi encontrado."
    - "A vida dos exilados em tais aldeias é conhecida por tabuinhas cuneiformes de um lugar chamado Al-Yahudu, “a cidade de Judá”, em algum ponto da mesma região, datadas de 572 a 477 a.C., que registram famílias judaicas arrendando terras, pagando impostos e dando aos filhos nomes hebraicos. Em 1902 Nahum Sokolow escolheu o nome bíblico como título de sua tradução hebraica do romance Altneuland, “terra velha-nova”, de Theodor Herzl, e em 1910 o novo bairro judaico fundado ao lado de Jafa tomou o nome de Tel Aviv."
    - "Lido como hebraico, o nome significa “colina de espigas”: abib é a espiga nova, e também o nome do mês de primavera do grão novo. Jerônimo manteve esse sentido na Vulgata, onde Ezequiel chega “ao monte de frutos novos”, enquanto a Septuaginta grega não leu aqui nome de lugar e o faz chegar aos cativos “erguido no alto”. Ezequiel estava provavelmente entre os levados com o rei Joaquim em 597 a.C. Datou o seu chamado no quinto ano daquele cativeiro, e mais tarde os anciãos de Judá se sentaram diante dele em sua casa."
  de:
    - "Tel-Abib war eine Siedlung judäischer Verbannter in Babylonien, wo Hesekiel nach seiner Berufung am Fluss Kebar lebte: „Und ich kam zu den Gefangenen, die am Wasser Chebar wohnten, gen Thel-Abib, und setzte mich zu ihnen, die da saßen, und blieb daselbst unter ihnen sieben Tage ganz traurig.“ Der Name wird gewöhnlich aus dem akkadischen til abubi erklärt, „Hügel der Flut“, das heißt ein alter Ruinenhügel. Der Kebar war ein Kanal nahe Nippur, das Kabaru des Geschäftsarchivs der Familie Muraschu aus dem fünften Jahrhundert v. Chr.; die Stätte von Tel-Abib selbst ist nicht gefunden."
    - "Das Leben der Verbannten in solchen Dörfern ist aus Keilschrifttafeln eines Ortes namens Al-Jahudu, „Stadt Judas“, irgendwo in derselben Gegend, bekannt, datiert von 572 bis 477 v. Chr., die judäische Familien verzeichnen, die Land pachteten, Steuern zahlten und ihren Kindern hebräische Namen gaben. 1902 wählte Nahum Sokolow den biblischen Namen als Titel seiner hebräischen Übersetzung von Theodor Herzls Roman Altneuland, und 1910 nahm das neue jüdische Viertel, das neben Jaffa gegründet wurde, den Namen Tel Aviv an."
    - "Hebräisch gelesen bedeutet der Name „Ährenhügel“: Abib ist die frische Ähre und zugleich der Name des Frühlingsmonats des neuen Getreides. Hieronymus behielt diesen Sinn in der Vulgata bei, wo Hesekiel „zum Haufen der neuen Früchte“ kommt, während die griechische Septuaginta hier keinen Ortsnamen las und ihn „in die Höhe gehoben“ zu den Gefangenen kommen lässt. Hesekiel war wahrscheinlich unter denen, die 597 v. Chr. mit König Jojachin weggeführt wurden. Er datierte seine Berufung in das fünfte Jahr dieser Gefangenschaft, und später saßen die Ältesten Judas in seinem Haus vor ihm."
  fr:
    - "Tel-Abib était une colonie d’exilés judéens en Babylonie, où Ézéchiel vécut après son appel près du fleuve Kebar : « J’arrivai à Thel-Abib, vers les exilés qui demeuraient près du fleuve du Kebar, et dans le lieu où ils se trouvaient ; là je restai sept jours, stupéfait au milieu d’eux. » Le nom s’explique d’ordinaire par l’akkadien til abubi, « butte du déluge », c’est-à-dire une ancienne butte de ruines. Le Kebar était un canal près de Nippur, le Kabaru des archives commerciales de la famille Murashu, du Ve siècle av. J.-C. ; le site de Tel-Abib lui-même n’a pas été trouvé."
    - "La vie des exilés dans de tels villages est connue par des tablettes cunéiformes d’un lieu appelé Al-Yahudu, « la ville de Juda », quelque part dans la même région, datées de 572 à 477 av. J.-C., qui montrent des familles judéennes louant des terres, payant des impôts et donnant à leurs enfants des noms hébreux. En 1902, Nahum Sokolow choisit le nom biblique comme titre de sa traduction hébraïque du roman Altneuland de Theodor Herzl, « vieille-nouvelle terre », et en 1910 le nouveau quartier juif fondé à côté de Jaffa prit le nom de Tel-Aviv."
    - "Lu en hébreu, le nom signifie « colline des épis » : abib est l’épi frais, et aussi le nom du mois de printemps du grain nouveau. Jérôme garda ce sens dans la Vulgate, où Ézéchiel vient « au tas des grains nouveaux », tandis que la Septante grecque ne lut ici aucun nom de lieu et le fait venir chez les captifs « élevé dans les airs ». Ézéchiel fut probablement parmi les déportés emmenés avec le roi Jojakin en 597 av. J.-C. Il data son appel de la cinquième année de cette captivité, et plus tard les anciens de Juda s’assirent devant lui dans sa maison."
  it:
    - "Tel-Abib era un insediamento di esuli giudei in Babilonia, dove Ezechiele visse dopo la sua chiamata presso il fiume Chebar: «E giunsi da quelli ch’erano in cattività a Tel-abib presso al fiume Kebar, e mi fermai dov’essi dimoravano; e dimorai quivi sette giorni, mesto e silenzioso, in mezzo a loro». Il nome si spiega di solito dall’accadico til abubi, «tell del diluvio», cioè un’antica collina di rovine. Il Chebar era un canale presso Nippur, il Kabaru dell’archivio commerciale del V secolo a.C. della famiglia dei Murashu; il sito di Tel-Abib non è stato trovato."
    - "La vita degli esuli in simili villaggi è nota da tavolette cuneiformi di un luogo chiamato Al-Yahudu, «la città di Giuda», da qualche parte nella stessa regione, datate dal 572 al 477 a.C., che registrano famiglie giudee che prendono terra in affitto, pagano tasse e danno ai figli nomi ebraici. Nel 1902 Nahum Sokolow scelse il nome biblico come titolo della sua traduzione ebraica del romanzo Altneuland di Theodor Herzl, «terra vecchia-nuova», e nel 1910 il nuovo quartiere ebraico fondato accanto a Giaffa prese il nome di Tel Aviv."
    - "Letto come ebraico, il nome significa «collina delle spighe»: abib è la spiga fresca, e anche il nome del mese primaverile del grano nuovo. Girolamo mantenne questo senso nella Vulgata, dove Ezechiele giunge «al mucchio delle messi nuove», mentre la Settanta greca non lesse qui alcun nome di luogo e lo fa giungere tra i prigionieri «sollevato in alto». Ezechiele fu probabilmente tra i deportati con il re Ioiachin nel 597 a.C. Datò la sua chiamata al quinto anno di quella cattività, e più tardi gli anziani di Giuda sedettero davanti a lui nella sua casa."
  nl:
    - "Tel-Abib was een nederzetting van Judese ballingen in Babylonië, waar Ezechiël woonde na zijn roeping aan de rivier de Kebar: “En ik kwam tot de weggevoerden te Tel-Abib, die aan de rivier Chebar woonden, en ik bleef daar zij woonden; ja, ik bleef daar verbaasd in het midden van hen zeven dagen.” De naam wordt gewoonlijk verklaard uit het Akkadische til abubi, ‘heuvel van de vloed’, dat wil zeggen een oude ruïneheuvel. De Kebar was een kanaal bij Nippur, het Kabaru van het zakenarchief van de familie Murashu uit de vijfde eeuw v.Chr.; de plaats van Tel-Abib zelf is niet gevonden."
    - "Het leven van de ballingen in zulke dorpen is bekend uit spijkerschrifttabletten van een plaats Al-Yahudu, ‘de stad van Juda’, ergens in dezelfde streek, gedateerd van 572 tot 477 v.Chr., die Judese families vermelden die land pachtten, belasting betaalden en hun kinderen Hebreeuwse namen gaven. In 1902 koos Nahum Sokolow de bijbelse naam als titel van zijn Hebreeuwse vertaling van Theodor Herzls roman Altneuland, ‘oud-nieuw land’, en in 1910 kreeg de nieuwe Joodse wijk bij Jaffa de naam Tel Aviv."
    - "Als Hebreeuws gelezen betekent de naam ‘heuvel van aren’: abib is een verse aar, en ook de naam van de voorjaarsmaand van het nieuwe graan. Hiëronymus hield deze betekenis vast in de Vulgaat, waar Ezechiël komt ‘bij de hoop van nieuwe vruchten’, terwijl de Griekse Septuaginta hier geen plaatsnaam las en hem ‘in de hoogte zwevend’ bij de ballingen laat komen. Ezechiël was waarschijnlijk onder hen die in 597 v.Chr. met koning Jojachin werden weggevoerd. Hij dateerde zijn roeping in het vijfde jaar van die ballingschap, en later zaten de oudsten van Juda in zijn huis voor hem."
  sv:
    - "Tel-Abib var en bosättning av judeiska landsflyktiga i Babylonien, där Hesekiel bodde efter sin kallelse vid floden Kebar: ”Och jag kom till de fångna i Tel-Abib, till dem som bodde vid strömmen Kebar, till den plats där de bodde; och jag satt där ibland dem i sju dagar, försänkt i djup sorg.” Namnet förklaras vanligen ur akkadiskans til abubi, ”översvämningens kulle”, det vill säga en forntida ruinkulle. Kebar var en kanal nära Nippur, Kabaru i släkten Murashus affärsarkiv från 400-talet f.Kr.; själva platsen Tel-Abib har inte hittats."
    - "De landsflyktigas liv i sådana byar är känt från kilskriftstavlor från en plats kallad Al-Yahudu, ”Judas stad”, någonstans i samma region, daterade från 572 till 477 f.Kr., som berättar om judeiska familjer som arrenderade mark, betalade skatt och gav sina barn hebreiska namn. År 1902 valde Nahum Sokolow det bibliska namnet som titel på sin hebreiska översättning av Theodor Herzls roman Altneuland, ”gammalt-nytt land”, och år 1910 fick den nya judiska stadsdelen som grundades bredvid Jaffa namnet Tel Aviv."
    - "Läst som hebreiska betyder namnet ”axens kulle”: abib är ett färskt ax och också namnet på vårmånaden för den nya säden. Hieronymus behöll denna betydelse i Vulgata, där Hesekiel kommer ”till högen av ny gröda”, medan den grekiska Septuaginta inte läste något ortnamn här och låter honom komma till de fångna ”upplyft i höjden”. Hesekiel var troligen bland dem som fördes bort med kung Jojakin år 597 f.Kr. Han daterade sin kallelse till det femte året av denna fångenskap, och senare satt Juda äldste framför honom i hans hus."
  nb:
    - "Tel-Abib var en bosetning av judeiske eksilerte i Babylonia, der Esekiel bodde etter at han var blitt kalt ved elven Kebar: «jeg kom til de bortførte i Tel-Abib, de som bodde ved elven Kebar, og hvor de ellers bodde, og jeg satt der i syv dager iblandt dem og stirret frem for mig». Navnet forklares vanligvis av akkadisk til abubi, «syndflodens haug», det vil si en eldgammel ruinhaug. Kebar var en kanal nær Nippur, Kabaru i Murashu-familiens forretningsarkiv fra 400-tallet f.Kr.; selve stedet Tel-Abib er ikke funnet."
    - "De eksilertes liv i slike landsbyer er kjent fra kileskrifttavler fra et sted kalt Al-Yahudu, «Judas by», et sted i samme region, datert fra 572 til 477 f.Kr., som forteller om judeiske familier som leier jord, betaler skatt og gir barna hebraiske navn. I 1902 valgte Nahum Sokolow det bibelske navnet som tittel på sin hebraiske oversettelse av Theodor Herzls roman Altneuland, «gammelt–nytt land», og i 1910 fikk den nye jødiske bydelen grunnlagt ved siden av Jaffa navnet Tel Aviv."
    - "Lest som hebraisk betyr navnet «aksenes haug»: abib er et ferskt aks og også navnet på vårmåneden for det nye kornet. Hieronymus beholdt denne betydningen i Vulgata, der Esekiel kommer «til haugen av ny grøde», mens den greske Septuaginta ikke leste noe stedsnavn her og lar ham komme til de bortførte «løftet i høyden». Esekiel var trolig blant dem som ble ført bort med kong Jojakin i 597 f.Kr. Han daterte sitt kall til det femte året av dette fangenskapet, og senere satt Judas eldste foran ham i huset hans."
  tl:
    - "Ang Tel-abib ay isang pamayanan ng mga ipinatapong Judio sa Babilonia, kung saan tumira si Ezekiel pagkatapos ng kaniyang pagtawag sa tabi ng ilog Chebar: “Nang magkagayo'y naparoon ako sa mga bihag sa Tel-abib, na nagsisitahan sa pangpang ng ilog Chebar, at sa kanikanilang kinatatahanan; at ako'y umupo roong natitigilan sa gitna nila na pitong araw.” Karaniwang ipinaliliwanag ang pangalan mula sa Akkadian na til abubi, “burol ng baha”, iyon ay, isang sinaunang burol ng guho. Ang Chebar ay isang kanal malapit sa Nippur, ang Kabaru ng archive pangnegosyo ng pamilya Murashu noong ika-5 siglo BK; hindi pa natatagpuan ang mismong pook ng Tel-abib."
    - "Ang buhay ng mga ipinatapon sa gayong mga nayon ay nalalaman mula sa mga tabletang kuneiporme ng isang lugar na tinatawag na Al-Yahudu, “ang bayan ng Juda”, sa isang lugar sa rehiyon ding iyon, na may petsang 572 hanggang 477 BK, na nagtatala ng mga pamilyang Judio na umuupa ng lupa, nagbabayad ng buwis at nagbibigay ng mga pangalang Hebreo sa kanilang mga anak. Noong 1902, pinili ni Nahum Sokolow ang pangalang biblikal bilang pamagat ng kaniyang salin sa Hebreo ng nobela ni Theodor Herzl na Altneuland, “lumang-bagong lupain”, at noong 1910, ang bagong purok Judio na itinatag sa tabi ng Jaffa ay nagkaroon ng pangalang Tel Aviv."
    - "Kung babasahin bilang Hebreo, ang pangalan ay nangangahulugang “burol ng mga uhay”: ang abib ay sariwang uhay, at pangalan din ng buwan ng tagsibol ng bagong butil. Pinanatili ni Jeronimo ang kahulugang ito sa Vulgata, kung saan dumating si Ezekiel “sa bunton ng bagong ani”, samantalang ang Griyegong Septuaginta ay hindi bumasa rito ng pangalan ng lugar at sinasabing dumating siya sa mga bihag “na itinaas sa kaitaasan”. Malamang na kabilang si Ezekiel sa mga dinalang kasama ni Haring Joachin noong 597 BK. Itinakda niya ang kaniyang pagtawag sa ikalimang taon ng pagkabihag na iyon, at nang maglaon ay umupo sa harap niya sa kaniyang bahay ang mga matanda ng Juda."
  da:
    - "Tel-Abib var en bosættelse af judæiske eksilerede i Babylonien, hvor Ezekiel boede efter sin kaldelse ved floden Kebar: »jeg kom til de bortførte til Tel-Abib, til dem, som boede ved Floden Kebar, og der, hvor de boede, blev jeg siddende i syv Dage, stum midt iblandt dem.« Navnet forklares sædvanligvis ud fra akkadisk til abubi, »syndflodens høj«, det vil sige en gammel ruinhøj. Kebar var en kanal nær Nippur, Kabaru i Murashu-familiens forretningsarkiv fra 400-tallet f.Kr.; selve Tel-Abibs sted er ikke fundet."
    - "De eksileredes liv i sådanne landsbyer kendes fra kileskrifttavler fra et sted kaldet Al-Yahudu, »Judas by«, et sted i samme egn, dateret fra 572 til 477 f.Kr., som beretter om judæiske familier, der forpagter jord, betaler skat og giver deres børn hebraiske navne. I 1902 valgte Nahum Sokolow det bibelske navn som titel på sin hebraiske oversættelse af Theodor Herzls roman Altneuland, »gammelt-nyt land«, og i 1910 tog det nye jødiske kvarter, der blev grundlagt ved siden af Jaffa, navnet Tel Aviv."
    - "Læst som hebraisk betyder navnet »aksenes høj«: abib er et friskt aks og også navnet på forårsmåneden for det nye korn. Hieronymus bevarede denne betydning i Vulgata, hvor Ezekiel kommer »til dyngen af ny afgrøde«, mens den græske Septuaginta ikke læste noget stednavn her og lader ham komme til de bortførte »løftet i højden«. Ezekiel var sandsynligvis blandt dem, der blev ført bort med kong Jojakin i 597 f.Kr. Han daterede sin kaldelse til det femte år af dette fangenskab, og senere sad Judas ældste foran ham i hans hus."
  sr:
    - "Телавив је био насеље јудејских изгнаника у Вавилонији, где је Језекиљ живео после свог призвања крај реке Хевар: „И дођох к робљу у Телавив, које становаше на реци Хевару, и седох где они сеђаху, и седех онде међу њима чудећи се“, седам дана. Име се обично објашњава из акадског тил абуби, „хум потопа“, то јест древни рушевински хум. Хевар је био канал близу Нипура, Кабару из пословног архива породице Мурашу из 5. века п. н. е.; само налазиште Телавива није пронађено."
    - "Живот изгнаника у таквим селима познат је из клинастих плочица места званог Ал-Јахуду, „град Јуде“, негде у истој области, датираних од 572. до 477. п. н. е., које бележе јудејске породице како закупљују земљу, плаћају порезе и дају деци хебрејска имена. Године 1902. Нахум Соколов изабрао је библијско име за наслов свог хебрејског превода романа „Алтнојланд“ Теодора Херцла, „стара-нова земља“, а 1910. нова јеврејска четврт основана крај Јафе добила је име Тел Авив."
    - "Читано као хебрејско, име значи „хум класја“: авив је свеж клас, а и име пролећног месеца новог жита. Јероним је задржао тај смисао у Вулгати, где Језекиљ долази „до гомиле нових плодова“, док грчка Септуагинта ту није прочитала име места и каже да је дошао к робљу „подигнут увис“. Језекиљ је вероватно био међу одведенима с краљем Јоахином 597. п. н. е. Своје призвање датовао је петом годином тог ропства, а касније су старешине Јудине седеле пред њим у његовој кући."
  hu:
    - "Tél-Ábib júdeai számkivetettek települése volt Babilóniában, ahol Ezékiel élt, miután a Kebár folyónál elhívták: „eljuték Tél-Ábibba a foglyokhoz, a kik lakoznak vala a Kébár folyó mellett, és leülék, ők is ott ülvén; és ott ülék hét nap némán ő közöttük.” A nevet általában az akkád til abubiból magyarázzák, „a vízözön halma”, vagyis egy ősi romhalom. A Kebár a Nippur melletti csatorna volt, a Murasú család Kr. e. 5. századi üzleti levéltárának Kabaruja; maga Tél-Ábib helye nem került elő."
    - "A számkivetettek életét az ilyen falvakban az Al-Jahudu nevű helyről származó ékírásos táblák ismertetik, amelynek neve „Júda városa”, és valahol ugyanabban a térségben feküdt, és a táblák Kr. e. 572-től 477-ig terjednek: júdeai családok földet bérelnek, adót fizetnek, és gyermekeiknek héber nevet adnak. 1902-ben Nahum Sokolow a bibliai nevet választotta Herzl Tivadar Altneuland című regénye héber fordításának címéül, „régi-új föld”, 1910-ben pedig a Jaffa mellett alapított új zsidó negyed a Tel Aviv nevet vette fel."
    - "Héberül olvasva a név jelentése „kalászok halma”: az ábib friss kalász, és egyben az új gabona tavaszi hónapjának neve. Jeromos ezt az értelmet őrizte meg a Vulgatában, ahol Ezékiel „az új termés halmához” érkezik, a görög Septuaginta viszont itt nem olvasott helynevet, és úgy írja, hogy „a magasba emelve” ment a foglyokhoz. Ezékiel valószínűleg azok között volt, akiket Kr. e. 597-ben Jójákin királlyal együtt hurcoltak el. Elhívását ennek a fogságnak az ötödik évére keltezte, később pedig Júda vénei ültek előtte a házában."
  fi:
    - "Tel-Abib oli juudalaisten pakkosiirtolaisten asutus Babyloniassa, missä Hesekiel asui kutsumuksensa jälkeen Kebar-joen varrella: ”Ja minä tulin Tell-Aabibiin pakkosiirtolaisten tykö, jotka asuivat Kebar-joen varrella; ja siellä, missä he asuivat, minä istuin jäykistyneenä heidän keskuudessaan seitsemän päivää.” Nimi selitetään yleensä akkadin sanasta til abubi, ”tulvan kumpare”, eli muinaisesta raunioröykkiöstä. Kebar oli Nippurin lähellä oleva kanava, Murashu-suvun 400-luvun eaa. liikearkiston Kabaru; Tel-Abibin paikkaa ei ole löydetty."
    - "Pakkosiirtolaisten elämä tällaisissa kylissä tunnetaan nuolenpäätauluista paikasta nimeltä Al-Yahudu, ”Juudan kaupunki”, jossakin samalla seudulla; taulut on ajoitettu vuosiin 572–477 eaa., ja ne kirjaavat juudalaisten perheiden vuokraavan maata, maksavan veroja ja antavan lapsilleen heprealaisia nimiä. Vuonna 1902 Nahum Sokolow valitsi Raamatun nimen otsikoksi Theodor Herzlin romaanin Altneuland, ”vanha-uusi maa”, heprealaiselle käännökselleen, ja vuonna 1910 Jaffan viereen perustettu uusi juutalainen kaupunginosa otti nimen Tel Aviv."
    - "Hepreaksi luettuna nimi merkitsee ”tähkien kumparetta”: abib on tuore tähkä ja myös uuden viljan kevätkuukauden nimi. Hieronymus säilytti tämän merkityksen Vulgatassa, jossa Hesekiel tulee ”uuden sadon kasan luo”, kun taas kreikkalainen Septuaginta ei lukenut tässä paikannimeä ja antaa hänen tulla pakkosiirtolaisten luo ”korkeuteen nostettuna”. Hesekiel oli todennäköisesti niiden joukossa, jotka vietiin pois kuningas Jojakinin kanssa vuonna 597 eaa. Hän ajoitti kutsumuksensa tämän vankeuden viidenteen vuoteen, ja myöhemmin Juudan vanhimmat istuivat hänen edessään hänen talossaan."
  vi:
    - "Tên-A-bíp là một khu định cư của những người Giu-đa bị lưu đày ở Ba-by-lôn, nơi Ê-xê-chi-ên sống sau khi được kêu gọi bên sông Kê-ba: “Ta bèn đi đến Tên-A-bíp cùng những kẻ bị đày ở trên bờ sông Kê-ba. Ta dừng lại nơi họ đang ở, và trú lại giữa họ bảy ngày, buồn rầu lặng lẽ.” Tên này thường được giải thích từ tiếng Akkad til abubi, “gò của trận đại hồng thủy”, tức là một gò tàn tích cổ. Kê-ba là một kênh gần Nippur, Kabaru của văn khố thương mại thế kỷ 5 TCN của gia tộc Murashu; địa điểm của chính Tên-A-bíp chưa tìm thấy."
    - "Đời sống của những người lưu đày trong các làng như vậy được biết qua các bảng chữ hình nêm của một nơi tên Al-Yahudu, “thành của Giu-đa”, ở đâu đó trong cùng vùng, có niên đại từ năm 572 đến 477 TCN, ghi lại các gia đình Giu-đa thuê đất, đóng thuế và đặt cho con cái những tên Hê-bơ-rơ. Năm 1902, Nahum Sokolow chọn tên Kinh Thánh này làm nhan đề cho bản dịch tiếng Hê-bơ-rơ của tiểu thuyết Altneuland của Theodor Herzl, “xứ cũ–mới”, và năm 1910 khu phố Do Thái mới lập cạnh Jaffa lấy tên Tel Aviv."
    - "Đọc theo tiếng Hê-bơ-rơ, tên này nghĩa là “đồi bông lúa”: abib là bông lúa non, và cũng là tên tháng mùa xuân của lúa mới. Jerome giữ nghĩa này trong bản Vulgate, nơi Ê-xê-chi-ên đến “nơi đống lúa mới”, còn Bản Bảy Mươi tiếng Hy Lạp không đọc thấy địa danh ở đây và cho ông đến với những người bị đày “được nâng lên cao”. Ê-xê-chi-ên có lẽ ở trong số những người bị bắt đi cùng vua Giê-hô-gia-kin năm 597 TCN. Ông định niên đại sự kêu gọi mình vào năm thứ năm của cuộc lưu đày ấy, và về sau các trưởng lão Giu-đa ngồi trước mặt ông trong nhà ông."
  ro:
    - "Tel-Abib era o așezare a exilaților iudei din Babilonia, unde a locuit Ezechiel după chemarea lui de lângă râul Chebar: a venit la cei din robie de la Tel-Abib, care locuiau lângă râul Chebar, a șezut acolo unde stăteau ei și a rămas acolo uluit în mijlocul lor șapte zile. Numele este explicat de obicei din akkadianul til abubi, „movila potopului”, adică o movilă străveche de ruine. Chebarul era un canal din apropiere de Nippur, Kabaru din arhiva de afaceri a familiei Murashu din secolul al V-lea î.Hr.; locul Tel-Abibului însuși nu a fost găsit."
    - "Viața exilaților în astfel de sate se cunoaște din tăblițele cuneiforme dintr-un loc numit Al-Yahudu, „cetatea lui Iuda”, undeva în aceeași regiune, datate între 572 și 477 î.Hr., care consemnează familii iudeene arendând pământ, plătind impozite și dând copiilor nume ebraice. În 1902, Nahum Sokolow a ales numele biblic drept titlu al traducerii ebraice a romanului lui Theodor Herzl Altneuland, „țara veche-nouă”, iar în 1910 noul cartier evreiesc întemeiat lângă Iafo a primit numele Tel Aviv."
    - "Citit ca ebraic, numele înseamnă „dealul spicelor”: abib este spicul proaspăt, și totodată numele lunii de primăvară a grânelor noi. Ieronim a păstrat acest sens în Vulgata, unde Ezechiel vine „la grămada de roade noi”, în timp ce Septuaginta greacă nu a citit aici un nume de loc și îl face să vină la robi „înălțat în văzduh”. Ezechiel a fost probabil printre cei duși cu regele Ioiachin în 597 î.Hr. El și-a datat chemarea în al cincilea an al acelei robii, iar mai târziu bătrânii lui Iuda au șezut înaintea lui în casa sa."
  bg:
    - "Тел-Авив било селище на юдейски изгнаници във Вавилония, където живял Йезекиил след призванието си при реката Ховар: „И дойдох при пленниците в Телавив, които обитаваха при реката Ховар, и седнах дето те седнаха, и останах там между тях седем дни в смайване.“ Името обикновено се обяснява от акадското til abubi, „могила на потопа“, тоест древна могила от развалини. Ховар бил канал близо до Нипур — Кабару от деловия архив на семейство Мурашу от V в. пр.н.е.; самото място на Тел-Авив не е намерено."
    - "Животът на изгнаниците в такива села е известен от клинописни плочки от място, наречено Ал-Яхуду, „градът на Юда“, някъде в същата област, датирани от 572 до 477 г. пр.н.е., които отбелязват юдейски семейства, наемащи земя, плащащи данъци и даващи на децата си еврейски имена. През 1902 г. Нахум Соколов избрал библейското име за заглавие на своя превод на иврит на романа на Теодор Херцл „Altneuland“, „стара-нова земя“, а през 1910 г. новият еврейски квартал, основан до Яфа, приел името Тел Авив."
    - "Прочетено като еврейско, името означава „хълм от класове“: авив е свеж клас, а също и името на пролетния месец на новото жито. Йероним запазил този смисъл във Вулгата, където Йезекиил идва „при купа от нови плодове“, докато гръцката Септуагинта не прочела тук име на място и казва, че той дошъл при пленниците „издигнат във висините“. Йезекиил вероятно бил сред отведените с цар Йехония през 597 г. пр.н.е. Той датирал призванието си в петата година на този плен, а по-късно старейшините на Юда седели пред него в дома му."
