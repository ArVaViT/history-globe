body:
  en:
    - "Gallim was a village of Benjamin north of Jerusalem, named only twice. When David fled from Saul, “Saul had given Michal his daughter, David’s wife, to Phalti the son of Laish, which was of Gallim”; later Ish-bosheth took her back from him for David. Isaiah names it in his picture of the Assyrian army marching on Jerusalem from the north, town by town, through Aiath, Michmash, Geba, Ramah and “Gibeah of Saul”, and then cries: “Lift up thy voice, O daughter of Gallim: cause it to be heard unto Laish, O poor Anathoth.” The company of Anathoth puts Gallim close to Jerusalem, on the last stretch of that road."
    - "Beyond that nothing is known. Eusebius knew a village Gallaia near Ekron, on the coastal plain far from Isaiah's road; no inscription names Gallim, and no site has been excavated as Gallim. Two small ruins north of Jerusalem, Khirbet Kakul near Anathoth and Khirbet Erha, are the usual proposals; other places of similar name have also been suggested. The map's point marks one of these guesses. The area today lies on the northern edge of Jerusalem, among villages and suburbs."
  ru:
    - "Галлим — селение Вениамина к северу от Иерусалима, названное только дважды. Когда Давид бежал от Саула, «Саул же отдал дочь свою Мелхолу, жену Давидову, Фалтию, сыну Лаиша, что из Галлима»; позже Иевосфей взял её от него и вернул Давиду. Исаия называет его в картине ассирийского войска, идущего на Иерусалим с севера от города к городу, через Аиаф, Михмас, Геву, Раму и Гиву Саулову, и затем восклицает: «Вой голосом твоим, дочь Галима; пусть услышит тебя Лаис, бедный Анафоф!» Соседство с Анафофом помещает Галлим близ Иерусалима, на последнем отрезке этого пути."
    - "Сверх этого ничего не известно. Евсевий знал селение Галлея близ Екрона, на приморской равнине, далеко от пути, описанного Исаией; ни одна надпись Галлим не называет, и ни одно место не раскапывали как Галлим. Обычно предлагают две небольшие развалины к северу от Иерусалима — Хирбет-Какуль близ Анафофа и Хирбет-Эрха; предлагали и другие места со сходным именем. Точка на карте отмечает одну из этих догадок. Сегодня эти места лежат на северной окраине Иерусалима, среди селений и пригородов."
  uk:
    - "Галлім — село Веніямина на північ від Єрусалима, згадане лише двічі. Коли Давид утікав від Саула, «Саул же віддав дочку свою Мелхолу, жінку Давидову, Фалтієві Лайшенкові із Галлиму»; пізніше Ішбошет забрав її в нього й повернув Давидові. Ісая називає його в картині ассирійського війська, що йде на Єрусалим з півночі, місто за містом, через Аїат, Міхмас, Гебу, Раму та «Гива Саулова», а тоді вигукує: «Гукай голосно, дочко Галиму; нехай почують тебе Лаїс та й Анатот бідний!» Сусідство Анатота розташовує Галлім поблизу Єрусалима, на останньому відтинку цього шляху."
    - "Більше про нього нічого не відомо. Євсевій знав село Галлея поблизу Екрона, на узбережній рівнині, далеко від шляху, описаного Ісаєю; жоден напис не називає Галлім, і жодне місце не розкопували як Галлім. Зазвичай пропонують дві невеликі руїни на північ від Єрусалима — Хірбет-Какуль поблизу Анатота та Хірбет-Ерха; пропонували й інші місця зі схожою назвою. Точка на карті позначає одне з цих припущень. Сьогодні ця місцевість лежить на північній околиці Єрусалима, серед сіл і передмість."
  es:
    - "Galim era una aldea de Benjamín al norte de Jerusalén, nombrada solo dos veces. Cuando David huyó de Saúl, «Saúl había dado su hija Michâl mujer de David, á Palti hijo de Lais, que era de Gallim»; más tarde Is-boset se la quitó a este para devolvérsela a David. Isaías la nombra en su cuadro del ejército asirio que avanza sobre Jerusalén desde el norte, ciudad tras ciudad, por Ayat, Micmas, Geba, Ramá y «Gabaa de Saúl», y exclama entonces: «Grita en alta voz, hija de Galim; haz que se oiga hacia Lais, pobrecilla Anathoth». La vecindad de Anatot sitúa a Galim cerca de Jerusalén, en el último tramo de aquel camino."
    - "Más allá de esto no se sabe nada. Eusebio conoció una aldea Gallaia cerca de Ecrón, en la llanura costera, lejos del camino de Isaías; ninguna inscripción nombra a Galim y ningún yacimiento ha sido excavado como Galim. Las propuestas habituales son dos pequeñas ruinas al norte de Jerusalén, Khirbet Kakul, cerca de Anatot, y Khirbet Erha; se han sugerido también otros lugares de nombre parecido. El punto del mapa señala una de estas conjeturas. Hoy la zona se encuentra en el borde norte de Jerusalén, entre aldeas y suburbios."
  pt:
    - "Galim era uma aldeia de Benjamim ao norte de Jerusalém, mencionada apenas duas vezes. Quando Davi fugiu de Saul, “Saul havia dado a sua filha Mical, mulher de Davi, a Palti, filho de Laís, que era de Galim”; mais tarde Is-Bosete a tomou dele para devolvê-la a Davi. Isaías a cita no quadro do exército assírio que marcha do norte contra Jerusalém, cidade após cidade, por Aiate, Micmás, Geba, Ramá e “Gibeá de Saul”, e então exclama: “Clame em alta voz, filha de Galim! Ouça, Laís! Pobre Anatote!” A vizinhança de Anatote situa Galim perto de Jerusalém, no último trecho desse caminho."
    - "Além disso, nada se sabe. Eusébio conheceu uma aldeia chamada Galaia perto de Ecrom, na planície costeira, longe do caminho de Isaías; nenhuma inscrição menciona Galim, e nenhum sítio foi escavado como Galim. Duas pequenas ruínas ao norte de Jerusalém, Khirbet Kakul, perto de Anatote, e Khirbet Erha, são as propostas habituais; outros lugares de nome semelhante também foram sugeridos. O ponto do mapa marca um desses palpites. Hoje a área fica na margem norte de Jerusalém, entre aldeias e subúrbios."
  de:
    - "Gallim war ein Dorf Benjamins nördlich von Jerusalem und wird nur zweimal genannt. Als David vor Saul floh, heißt es: „Saul aber hatte Michal seine Tochter, Davids Weib, Phalti, dem Sohn des Lais von Gallim, gegeben“; später ließ Isch-Boschet sie ihm wegnehmen und David zurückgeben. Jesaja nennt es in seinem Bild des assyrischen Heeres, das von Norden her Stadt für Stadt gegen Jerusalem zieht, über Ajat, Michmas, Geba, Rama und „Gibea Sauls“, und ruft dann: „Du Tochter Gallim, schreie laut! merke auf, Laisa, du elendes Anathoth!“ Die Nachbarschaft Anatots rückt Gallim nahe an Jerusalem, auf das letzte Stück dieses Weges."
    - "Darüber hinaus ist nichts bekannt. Eusebius kannte ein Dorf Gallaia bei Ekron, auf der Küstenebene, weit entfernt von Jesajas Weg; keine Inschrift nennt Gallim, und keine Stätte ist als Gallim ausgegraben worden. Üblicherweise werden zwei kleine Ruinen nördlich von Jerusalem vorgeschlagen, Chirbet Kakul bei Anatot und Chirbet Erha; auch andere Orte mit ähnlichem Namen sind genannt worden. Der Punkt auf der Karte bezeichnet eine dieser Vermutungen. Die Gegend liegt heute am nördlichen Rand Jerusalems, zwischen Dörfern und Vororten."
  fr:
    - "Gallim était un village de Benjamin, au nord de Jérusalem, nommé seulement deux fois. Quand David fuyait Saül, « Saül avait donné sa fille Mical, femme de David, à Palthi de Gallim, fils de Laïsch » ; plus tard, Isch-Boscheth la lui reprit pour la rendre à David. Ésaïe le nomme dans son tableau de l’armée assyrienne marchant sur Jérusalem depuis le nord, ville après ville, par Aïath, Micmasch, Guéba, Rama et « Guibea de Saül », puis s’écrie : « Fais éclater ta voix, fille de Gallim ! Prends garde, Laïs ! Malheur à toi, Anathoth ! » Le voisinage d’Anathoth place Gallim près de Jérusalem, sur le dernier tronçon de cette route."
    - "Au-delà, on ne sait rien. Eusèbe connaissait un village nommé Gallaia près d’Ékron, sur la plaine côtière, loin de la route d’Ésaïe ; aucune inscription ne nomme Gallim, et aucun site n’a été fouillé comme étant Gallim. Deux petites ruines au nord de Jérusalem, Khirbet Kakul près d’Anathoth et Khirbet Erha, sont les propositions habituelles ; d’autres lieux de nom voisin ont aussi été suggérés. Le point de la carte marque l’une de ces conjectures. Aujourd’hui, la zone se trouve sur la lisière nord de Jérusalem, parmi villages et faubourgs."
  pl:
    - "Gallim było wsią w Beniaminie na północ od Jerozolimy, wspomnianą tylko dwukrotnie. Gdy Dawid uciekał przed Saulem: „Albowiem Saul dał był Michol, córkę swoję, żonę Dawidowę, Faltemu, synowi Laisowemu, który był z Gallim”; później Isz-Boszet odebrał ją temu mężowi i oddał Dawidowi. Izajasz wymienia je w obrazie wojska asyryjskiego, które pochodzi na Jerozolimę z północy, miasto po mieście, przez Ajat, Mikmas, Gebę, Ramę i „Gabaa Saulowe”, po czym woła: „Podnieś głos twój, córko Gallim! niech słyszą w Lais, o ubogie Anatot!”. Sąsiedztwo Anatot umieszcza Gallim blisko Jerozolimy, na ostatnim odcinku tej drogi."
    - "Poza tym nic nie wiadomo. Euzebiusz znał wieś Gallaia koło Ekronu, na nizinie nadmorskiej, daleko od drogi Izajasza; żaden napis nie wymienia Gallim i żadne stanowisko nie zostało wykopane jako Gallim. Zwykle proponuje się dwie niewielkie ruiny na północ od Jerozolimy, Chirbet Kakul koło Anatot i Chirbet Erha; podawano też inne miejsca o podobnej nazwie. Punkt na mapie oznacza jeden z tych domysłów. Dziś okolica leży na północnym skraju Jerozolimy, wśród wsi i przedmieść."
  it:
    - "Gallim era un villaggio di Beniamino a nord di Gerusalemme, nominato soltanto due volte. Quando Davide fuggì da Saul, «Saul avea dato Mical sua figliuola, moglie di Davide, a Palti, figliuolo di Laish, che era di Gallim»; più tardi Is-Baal la fece riprendere a lui per restituirla a Davide. Isaia lo nomina nel quadro dell’esercito assiro che marcia su Gerusalemme da nord, città dopo città, per Aiat, Micmas, Gheba, Rama e «Ghibea di Saul», ed esclama: «Grida forte a tutta voce, o figlia di Gallim! Tendi l’orecchio, o Laish! Povera Anathoth!» La vicinanza di Anatòt colloca Gallim presso Gerusalemme, sull’ultimo tratto di quella strada."
    - "Oltre a questo non si sa nulla. Eusebio conosceva un villaggio Gallaia presso Ekron, sulla pianura costiera, lontano dalla strada di Isaia; nessuna iscrizione nomina Gallim e nessun sito è stato scavato come Gallim. Due piccole rovine a nord di Gerusalemme, Khirbet Kakul presso Anatòt e Khirbet Erha, sono le proposte consuete; sono stati suggeriti anche altri luoghi dal nome simile. Il punto della mappa segna una di queste congetture. Oggi la zona si trova al margine settentrionale di Gerusalemme, fra villaggi e sobborghi."
  nl:
    - "Gallim was een dorp van Benjamin ten noorden van Jeruzalem, dat maar tweemaal genoemd wordt. Toen David voor Saul vluchtte, staat er: “Saul had zijn dochter Michal, de huisvrouw van David, gegeven aan Palti, den zoon van Lais, die van Gallim was”; later liet Isboset haar bij hem weghalen om haar aan David terug te geven. Jesaja noemt het in zijn beeld van het Assyrische leger dat van het noorden uit, stad na stad, tegen Jeruzalem optrekt, langs Ajat, Michmas, Geba, Rama en “Gibea Sauls”, en roept dan uit: “Roep luide met uw stem, gij dochter van Gallim! laat ze horen tot Lais toe, o ellendige Anathoth!” Door de nabijheid van Anatot ligt Gallim dicht bij Jeruzalem, aan het laatste stuk van die weg."
    - "Verder is er niets over bekend. Eusebius kende een dorp Gallaia bij Ekron, op de kustvlakte, ver van Jesaja’s route; geen enkel opschrift noemt Gallim, en geen enkele vindplaats is als Gallim opgegraven. Twee kleine ruïnes ten noorden van Jeruzalem, Khirbet Kakul bij Anatot en Khirbet Erha, zijn de gebruikelijke voorstellen; ook andere plaatsen met een gelijkende naam zijn genoemd. Het punt op de kaart markeert een van die gissingen. Het gebied ligt nu aan de noordrand van Jeruzalem, tussen dorpen en voorsteden."
  cs:
    - "Galim byla vesnice v Benjamínově území severně od Jeruzaléma, jmenovaná jen dvakrát. Když David utíkal před Saulem, „Saul Míkol dceru svou, manželku Davidovu, dal byl Faltiovi, synu Lais, kterýž byl z Gallim“; později ji Íš-bošet od něho vzal a vrátil Davidovi. Izajáš ji jmenuje v obrazu asyrského vojska, které táhne na Jeruzalém ze severu, město za městem, přes Ajat, Michmas, Gebu, Rámu a „Gabaa Saulovo“, a pak volá: „Naříkej hlasem svým, město Gallim, ať se slyší v Lais: Ach, ubohá Anatot.“ Sousedství Anatótu klade Galim blízko Jeruzaléma, na poslední úsek té cesty."
    - "Nic dalšího není známo. Eusebios znal vesnici Gallaia poblíž Ekronu, na pobřežní rovině daleko od Izajášovy cesty; žádný nápis Galim nejmenuje a žádné místo nebylo prozkoumáno vykopávkami jako Galim. Obvyklými návrhy jsou dvě malé zříceniny severně od Jeruzaléma, Chirbet Kakul u Anatótu a Chirbet Erha; navrhována byla i jiná místa s podobným jménem. Bod na mapě označuje jednu z těchto domněnek. Dnes oblast leží na severním okraji Jeruzaléma, mezi vesnicemi a předměstími."
  sv:
    - "Gallim var en by i Benjamin norr om Jerusalem som nämns bara två gånger. När David flydde undan Saul var det så att ”Saul hade givit sin dotter Mikal, Davids hustru, åt Palti, Lais' son, från Gallim”; senare tog Ish-Boshet henne tillbaka från honom åt David. Jesaja nämner den i sin bild av den assyriska hären som tågar mot Jerusalem från norr, stad för stad, genom Ajat, Mikmas, Geba, Rama och ”Sauls Gibea”, och ropar sedan: ”Ropa högt, du dotter Gallim. Giv akt, du Laisa. Arma Anatot!” Att Anatot nämns tillsammans med Gallim placerar det nära Jerusalem, på den sista sträckan av den vägen."
    - "Utöver det är intet känt. Eusebios kände en by Gallaia nära Ekron, på kustslätten långt från Jesajas väg; ingen inskrift nämner Gallim, och ingen plats har grävts ut som Gallim. Två små ruiner norr om Jerusalem, Khirbet Kakul nära Anatot och Khirbet Erha, är de vanliga förslagen; andra platser med liknande namn har också föreslagits. Kartans punkt markerar en av dessa gissningar. Området ligger i dag i norra utkanten av Jerusalem, bland byar och förorter."
  nb:
    - "Gallim var en landsby i Benjamin nord for Jerusalem, nevnt bare to ganger. Da David flyktet fra Saul, «hadde Saul gitt sin datter Mikal, Davids hustru, til Palti, sønn av La'is, som var fra Gallim»; senere tok Isjbosjet henne tilbake fra ham for David. Jesaja nevner den i sitt bilde av den assyriske hæren som marsjerer mot Jerusalem fra nord, by for by, gjennom Ajjat, Mikmas, Geba, Rama og «Sauls Gibea», og roper så: «Skrik høit, du Gallims datter! Gi akt, Laisa! Arme Anatot!» At den står sammen med Anatot, plasserer Gallim nær Jerusalem, på den siste strekningen av den veien."
    - "Utover det er ingenting kjent. Eusebius kjente en landsby Gallaia ved Ekron, på kystsletten langt fra Jesajas vei; ingen innskrift nevner Gallim, og ingen lokalitet er utgravd som Gallim. To små ruiner nord for Jerusalem, Khirbet Kakul ved Anatot og Khirbet Erha, er de vanlige forslagene; andre steder med liknende navn er også foreslått. Kartets punkt markerer en av disse gjetningene. Området ligger i dag i den nordlige utkanten av Jerusalem, blant landsbyer og forsteder."
  tl:
    - "Ang Gallim ay isang nayon ng Benjamin sa hilaga ng Jerusalem, na dalawang beses lamang pinangalanan. Nang tumakas si David kay Saul, “ibinigay ni Saul si Michal na kaniyang anak, na asawa ni David, kay Palti na anak ni Lais na taga Gallim”; kalaunan ay binawi siya mula rito ni Is-boseth para kay David. Pinangalanan ito ni Isaias sa kaniyang larawan ng hukbong Asirio na lumalakad laban sa Jerusalem mula sa hilaga, bayan-bayan, sa Ajad, Michmas, Geba, Rama at “Gibea ni Saul”, at pagkatapos ay sumisigaw: “Humiyaw kang malakas ng iyong tinig, Oh anak na babae ng Galim! duminig ka, Oh Lais! Oh ikaw na kaawaawang Anathoth!” Ang pagsasama sa Anathoth ay naglalagay sa Gallim na malapit sa Jerusalem, sa huling bahagi ng daang iyon."
    - "Higit pa roon ay walang nalalaman. May kilalang nayong Gallaia si Eusebio malapit sa Ecron, sa kapatagan sa baybayin na malayo sa daan ni Isaias; walang inskripsiyong nagpapangalan sa Gallim, at walang lugar na nahukay bilang Gallim. Dalawang maliit na guho sa hilaga ng Jerusalem, ang Khirbet Kakul malapit sa Anathoth at ang Khirbet Erha, ang karaniwang mungkahi; may iminungkahi rin na iba pang lugar na may katulad na pangalan. Ang tuldok ng mapa ay nagmamarka ng isa sa mga hulang ito. Ang lugar ay ngayon sa hilagang gilid ng Jerusalem, sa gitna ng mga nayon at mga arabal."
  da:
    - "Gallim var en landsby i Benjamin nord for Jerusalem, kun nævnt to gange. Da David flygtede fra Saul, var det således, at »Saul havde givet Mikal sin Datter, Davids Hustru, til Palti, Lais Søn, som var fra Gallim«; senere tog Isj-Bosjet hende tilbage fra ham til David. Esajas nævner den i sit billede af den assyriske hær, der marcherer mod Jerusalem fra nord, by for by, gennem Ajjat, Mikmas, Geba, Rama og »Sauls Gibea«, og råber så: »Raab højt, du Gallims Datter! giv Agt, Lajsa! ulykkeligt er Anathoth.« At Anatot nævnes sammen med den, placerer Gallim tæt ved Jerusalem, på det sidste stykke af den vej."
    - "Ud over det vides intet. Eusebios kendte en landsby Gallaia nær Ekron, på kystsletten langt fra Esajas' vej; ingen indskrift nævner Gallim, og intet sted er udgravet som Gallim. To små ruiner nord for Jerusalem, Khirbet Kakul nær Anatot og Khirbet Erha, er de sædvanlige forslag; andre steder med lignende navn er også blevet foreslået. Kortets punkt markerer et af disse gæt. Området ligger i dag i Jerusalems nordlige udkant blandt landsbyer og forstæder."
  sr:
    - "Галим је био село у Венијаминовом племену северно од Јерусалима, именован само двапут. Кад је Давид бежао од Саула, „Саул даде Михалу кћер своју, жену Давидовом, Фалтију сину Лаисовом из Галима“; касније ју је Исвостеј одузео од њега за Давида. Исаија га помиње у слици асирске војске која с севера иде на Јерусалим, град по град, преко Гаја, Михмаса, Геве, Раме и „Гаваје Саулове“, па затим узвикује: „Вичи гласно, кћери Галимова; нек се чује у Лаис, јадни Анатоте!“ Присуство Анатота ставља Галим близу Јерусалима, на последњу деоницу тог пута."
    - "Осим тога ништа се не зна. Јевсевије је знао село Галају код Акарона, на приобалној равници, далеко од Исаијиног пута; ни један натпис не помиње Галим и ни једно налазиште није ископавано као Галим. Две мале рушевине северно од Јерусалима, Хирбет Какул код Анатота и Хирбет Ерха, уобичајени су предлози; предложена су и друга места сличног имена. Тачка на карти означава једну од тих претпоставки. Подручје данас лежи на северном ободу Јерусалима, међу селима и предграђима."
scripture:
  - 1Sam.25.44
  - 2Sam.3.14-2Sam.3.15
  - Isa.10.28-Isa.10.30
sources:
