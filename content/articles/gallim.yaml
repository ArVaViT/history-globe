  - "H. Wildberger, Isaiah 1-12: A Commentary (English tr., 1991)"
  - "P. K. McCarter, I Samuel (Anchor Bible, 1980)"
  - "A. F. Rainey and R. S. Notley, The Sacred Bridge: Carta's Atlas of the Biblical World (2006)"
