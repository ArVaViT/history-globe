body:
  en:
    - "Arubboth was the seat of the third of Solomon's twelve districts, which provided food for the king's household one month a year: “The son of Hesed, in Aruboth; to him pertained Sochoh, and all the land of Hepher”. It is named only here. Adam Zertal, who surveyed the hills of northern Samaria and excavated Khirbet el-Hamam, a fortified hilltop between the southern edge of Galilee and northern Samaria, identified it with Arubboth; he found there an Iron Age town with a segment of its city wall."
    - "Zertal also identified Khirbet el-Hamam with Narbata, the Jewish town of the Second Temple period to which, Josephus says, the Jews of Caesarea fled with their books of the Law in AD 66, sixty stades from the city, and whose district, Narbatene, Cestius Gallus's horsemen laid waste in the same year. Around the hill he traced a Roman circumvallation wall, camps and an assault ramp, which he took for a siege of the first year of the revolt. The site lies today in the northern West Bank."
  ru:
    - "Арюбоф — средоточие третьего из двенадцати округов Соломона, которые по месяцу в году содержали царский дом: «Бен-Хесед — в Арюбофе; ему же принадлежал Соко и вся земля Хефер». Он назван только здесь. Адам Зерталь, обследовавший горы северной Самарии и раскопавший Хирбет-эль-Хамам, укреплённую вершину между южным краем Галилеи и северной Самарией, отождествил её с Арюбофом; он нашёл там город железного века с участком городской стены."
    - "Зерталь отождествил Хирбет-эль-Хамам и с Нарбатой — иудейским городом времени Второго храма, куда, по словам Иосифа Флавия, в 66 г. н. э. бежали со своими книгами Закона иудеи Кесарии, в шестидесяти стадиях от города, и чью округу, Нарбатену, в том же году опустошили всадники Цестия Галла. Вокруг холма он проследил римскую обводную стену, лагеря и осадную насыпь, которые счёл следами осады первого года восстания. Сегодня это место находится на севере Западного берега."
  cs:
    - "Arubót bylo sídlo třetího z Šalomounových dvanácti okresů, které zásobovaly královský dvůr potravou po jeden měsíc v roce: „Syn Chesed v Arubot, jehož bylo Socho i všecka země Chefer.“ Je jmenováno jen zde. Adam Zertal, který prozkoumal kopce severního Samaří a kopal v Chirbet el-Hamám, opevněném návrší mezi jižním okrajem Galileje a severním Samařím, je ztotožnil s Arubótem; nalezl tam město z doby železné s úsekem městské hradby."
    - "Zertal také ztotožnil Chirbet el-Hamám s Narbatou, židovským městem z doby Druhého chrámu, kam podle Josepha Flavia uprchli židé z Cesareje se svými knihami Zákona roku 66 n. l., šedesát stadií od města, a jehož okres, Narbatenu, Cestius Gallus jízdou téhož roku zpustošil. Kolem návrší vysledoval římskou obléhací hradbu, tábory a útočnou rampu, které pokládal za obléhání prvního roku povstání. Místo leží dnes v severní části Západního břehu."
  uk:
    - "Арюбот був осідком третього з дванадцяти округів Соломона, які постачали харчі для царського двору по одному місяцю на рік: «Хезеденко в Аруботї; йому вказано Сохо та все займище Хеферське». Він названий лише тут. Адам Цертал, який обстежив гори північної Самарії й розкопав Хірбет-ель-Хамам, укріплену вершину пагорба між південним краєм Галілеї та північною Самарією, ототожнив його з Арюботом; він знайшов там місто залізної доби з відрізком міського муру."
    - "Цертал також ототожнив Хірбет-ель-Хамам з Нарбатою, юдейським містом періоду Другого храму, куди, за Йосифом Флавієм, втекли юдеї Кесарії зі своїми книгами Закону 66 р. н. е., за шістдесят стадіїв від міста, і чий округ, Нарбатену, того самого року спустошила кіннота Цестія Галла. Навколо пагорба він простежив римський оточувальний мур, табори й штурмову рампу, які вважав слідами облоги першого року повстання. Місце лежить нині на північному Західному березі."
  pl:
    - "Aruboth było siedzibą trzeciego z dwunastu okręgów Salomona, które dostarczały żywności na dwór królewski jeden miesiąc w roku: „Syn Heseda w Arubot, który trzymał Socho i wszystkę ziemię Chefer”. Jest wymienione tylko tu. Adam Zertal, który badał wzgórza północnej Samarii i prowadził wykopaliska w Chirbet el-Hamam, obwarowanym szczycie wzgórza między południowym skrajem Galilei a północną Samarią, utożsamił je z Aruboth; znalazł tam miasto z epoki żelaza z odcinkiem muru miejskiego."
    - "Zertal utożsamił też Chirbet el-Hamam z Narbatą, żydowskim miastem z okresu Drugiej Świątyni, do którego, jak mówi Józef Flawiusz, Żydzi z Cezarei uciekli ze swymi księgami Prawa w 66 r. n.e., w odległości sześćdziesięciu stadiów od miasta, i którego okręg, Narbatene, spustoszyła w tym samym roku jazda Cestiusza Gallusa. Wokół wzgórza wytropił rzymski wał oblężniczy, obozy i rampę szturmową, które uznał za ślady oblężenia z pierwszego roku powstania. Stanowisko leży dziś w północnej części Zachodniego Brzegu."
  es:
    - "Arubot fue la sede del tercero de los doce distritos de Salomón, que proveían de alimento a la casa del rey un mes al año: «El hijo de Hesed, en Aruboth; éste tenía también á Sochô y toda la tierra de Ephet». Solo se nombra aquí. Adam Zertal, que exploró las colinas del norte de Samaria y excavó Khirbet el-Hamam, una cima fortificada entre el borde meridional de Galilea y el norte de Samaria, la identificó con Arubot; halló allí una ciudad de la edad del Hierro con un tramo de su muralla."
    - "Zertal identificó también Khirbet el-Hamam con Narbata, la ciudad judía de la época del Segundo Templo adonde, dice Josefo, huyeron los judíos de Cesarea con sus libros de la Ley en 66 d. C., a sesenta estadios de la ciudad, y cuyo distrito, Narbatene, fue devastado en el mismo año por los jinetes de Cestio Galo. En torno a la colina trazó un muro de circunvalación romano, campamentos y una rampa de asalto, que tomó por un asedio del primer año de la rebelión. El lugar se halla hoy en el norte de Cisjordania."
  pt:
    - "Arubote era a sede do terceiro dos doze distritos de Salomão, que forneciam mantimentos à casa do rei um mês por ano: “Ben-Hesede, em Arubote (Socó e toda a terra de Héfer pertenciam a ele)”. É nomeada somente aqui. Adam Zertal, que fez o levantamento das colinas do norte de Samaria e escavou Khirbet el-Hamam, uma colina fortificada entre a borda sul da Galileia e o norte de Samaria, a identificou com Arubote; encontrou ali uma cidade da Idade do Ferro com um trecho de sua muralha."
    - "Zertal também identificou Khirbet el-Hamam com Narbata, a cidade judaica do período do Segundo Templo para onde, diz Josefo, os judeus de Cesareia fugiram com seus livros da Lei em 66 d.C., a sessenta estádios da cidade, e cujo distrito, a Narbatena, os cavaleiros de Céstio Galo devastaram no mesmo ano. Em volta da colina ele traçou um muro romano de circunvalação, acampamentos e uma rampa de assalto, que tomou por um cerco do primeiro ano da revolta. O sítio fica hoje no norte da Cisjordânia."
  de:
    - "Arubbot war der Sitz des dritten von Salomos zwölf Bezirken, die den Haushalt des Königs je einen Monat im Jahr versorgten: „der Sohn Heseds zu Arubboth, und hatte dazu Socho und das ganze Land Hepher“. Es wird nur hier genannt. Adam Zertal, der die Hügel Nordsamarias erkundete und Chirbet el-Hamam ausgrub, eine befestigte Hügelkuppe zwischen dem Südrand Galiläas und Nordsamaria, setzte es mit Arubbot gleich; er fand dort eine eisenzeitliche Stadt mit einem Stück ihrer Stadtmauer."
    - "Zertal setzte Chirbet el-Hamam auch mit Narbata gleich, der jüdischen Stadt der Zeit des Zweiten Tempels, in die sich nach Josephus die Juden von Caesarea im Jahr 66 n. Chr. mit ihren Gesetzesbüchern flüchteten, sechzig Stadien von der Stadt entfernt, und deren Bezirk Narbatene die Reiter des Cestius Gallus im selben Jahr verwüsteten. Rings um den Hügel verfolgte er eine römische Circumvallationsmauer, Lager und eine Belagerungsrampe, die er für eine Belagerung im ersten Jahr des Aufstands hielt. Die Stätte liegt heute im nördlichen Westjordanland."
  fr:
    - "Arubboth était le siège du troisième des douze districts de Salomon, qui pourvoyaient à l’entretien de la maison du roi un mois par an : « Le fils de Hésed, à Arubboth ; il avait Soco et tout le pays de Hépher ». Elle n’est nommée qu’ici. Adam Zertal, qui prospecta les collines du nord de la Samarie et fouilla Khirbet el-Hamam, hauteur fortifiée entre le bord sud de la Galilée et le nord de la Samarie, l’identifia avec Arubboth ; il y trouva une ville de l’âge du Fer avec un tronçon de son rempart."
    - "Zertal identifia aussi Khirbet el-Hamam avec Narbata, la ville juive de l’époque du Second Temple où, dit Josèphe, les Juifs de Césarée s’enfuirent avec leurs livres de la Loi en 66 apr. J.-C., à soixante stades de la ville, et dont le district, la Narbatène, fut ravagé la même année par les cavaliers de Cestius Gallus. Autour de la colline, il releva un mur de circonvallation romain, des camps et une rampe d’assaut, qu’il prit pour un siège de la première année de la révolte. Le site se trouve aujourd’hui dans le nord de la Cisjordanie."
  it:
    - "Arubbot era la sede del terzo dei dodici distretti di Salomone, che provvedevano al mantenimento della casa del re un mese all’anno: «Ben-Hesed, ad Arubboth; aveva Soco e tutto il paese di Hefer». È nominata solo qui. Adam Zertal, che esplorò le colline della Samaria settentrionale e scavò Khirbet el-Hamam, un’altura fortificata tra il margine meridionale della Galilea e la Samaria settentrionale, la identificò con Arubbot; vi trovò una città dell’età del Ferro con un tratto della sua cinta muraria."
    - "Zertal identificò inoltre Khirbet el-Hamam con Narbata, la città ebraica del periodo del Secondo Tempio in cui, dice Giuseppe Flavio, gli ebrei di Cesarea fuggirono con i loro libri della Legge nel 66 d.C., a sessanta stadi dalla città, e il cui distretto, la Narbatene, fu devastato nello stesso anno dai cavalieri di Cestio Gallo. Attorno alla collina egli individuò un muro di circonvallazione romano, accampamenti e una rampa d’assalto, che ritenne un assedio del primo anno della rivolta. Il sito si trova oggi nella Cisgiordania settentrionale."
  nl:
    - "Aruboth was de zetel van het derde van Salomo's twaalf districten, die een maand per jaar het huishouden van de koning van voedsel voorzagen: “De zoon van Hesed in Arubboth; hij had daartoe Socho en het ganse land Hefer.” Het wordt alleen hier genoemd. Adam Zertal, die de heuvels van het noorden van Samaria verkende en Khirbet el-Hamam opgroef, een versterkte heuveltop tussen de zuidrand van Galilea en het noorden van Samaria, vereenzelvigde het met Aruboth; hij vond er een stad uit de ijzertijd met een deel van de stadsmuur."
    - "Zertal vereenzelvigde Khirbet el-Hamam ook met Narbata, de Joodse stad uit de tijd van de Tweede Tempel waarheen volgens Josephus de Joden van Caesarea in 66 n.Chr. met hun boeken van de Wet vluchtten, zestig stadiën van de stad, en wier district, Narbatene, de ruiters van Cestius Gallus in hetzelfde jaar verwoestten. Rond de heuvel traceerde hij een Romeinse omsluitingsmuur, kampen en een bestormingshelling, die hij hield voor een beleg uit het eerste jaar van de opstand. De plaats ligt tegenwoordig in het noorden van de Westelijke Jordaanoever."
  sv:
    - "Arubbot var säte för det tredje av Salomos tolv distrikt, som försåg kungens hushåll med mat en månad om året: ”Ben-Hesed i Arubbot, vilken hade Soko och hela Heferlandet”. Det nämns bara här. Adam Zertal, som kartlade bergen i norra Samaria och grävde ut Khirbet el-Hamam, en befäst bergstopp mellan södra Galileens kant och norra Samaria, identifierade det med Arubbot; han fann där en järnåldersstad med en del av dess stadsmur."
    - "Zertal identifierade också Khirbet el-Hamam med Narbata, den judiska staden från andra tempelperioden dit, säger Josefus, judarna i Caesarea flydde med sina lagböcker år 66 e.Kr., sextio stadier från staden, och vars distrikt, Narbatene, Cestius Gallus’ ryttare förödde samma år. Runt kullen spårade han en romersk belägringsmur, läger och en stormramp, som han tog för en belägring under revoltens första år. Platsen ligger i dag på norra Västbanken."
  nb:
    - "Arubbot var sete for det tredje av Salomos tolv distrikter, som forsynte kongens husholdning med mat én måned i året: «Heseds sønn i Arubbot; han hadde Soko og hele Hefer-bygden». Det nevnes bare her. Adam Zertal, som kartla åsene i Nord-Samaria og gravde ut Khirbet el-Hamam, en befestet høyde mellom sørkanten av Galilea og Nord-Samaria, identifiserte den med Arubbot; han fant der en by fra jernalderen med et stykke av bymuren."
    - "Zertal identifiserte også Khirbet el-Hamam med Narbata, den jødiske byen fra annen tempels tid som, ifølge Josefus, jødene i Cæsarea flyktet til med lovbøkene sine i 66 e.Kr., seksti stadier fra byen, og hvis distrikt, Narbatene, Cestius Gallus' ryttere herjet samme år. Rundt høyden sporet han en romersk omslutningsmur, leirer og en angrepsrampe, som han tok for en beleiring i det første året av opprøret. Stedet ligger i dag på nordlige Vestbredden."
  tl:
    - "Ang Aruboth ay luklukan ng ikatlo sa labindalawang distrito ni Salomon, na nagbibigay ng pagkain para sa sambahayan ng hari sa isang buwan bawat taon: “Si Ben-hesed, sa Aruboth (sa kaniya'y nauukol ang Socho, at ang buong lupain ng Ephet:)”. Dito lamang ito pinangalanan. Si Adam Zertal, na nag-sarbey sa mga burol ng hilagang Samaria at naghukay sa Khirbet el-Hamam, isang nakukutaang tuktok ng burol sa pagitan ng timog na gilid ng Galilea at hilagang Samaria, ay nagtumbas rito sa Aruboth; nakatuklas siya roon ng bayan ng Panahon ng Bakal na may bahagi ng pader ng lungsod."
    - "Itinumbas din ni Zertal ang Khirbet el-Hamam sa Narbata, ang bayang Judio ng panahon ng Ikalawang Templo na, ayon kay Josefo, pinuntahan ng mga Judio ng Cesarea dala ang kanilang mga aklat ng Kautusan noong 66 AD, animnapung stadia mula sa lungsod, at na ang distrito nitong Narbatene ay winasak ng mga mangangabayo ni Cestius Gallus sa parehong taon. Sa palibot ng burol, sinubaybayan niya ang pader ng paglilibot na Romano, mga kampo at rampa ng pag-atake, na itinuring niyang pagkubkob sa unang taon ng paghihimagsik. Ang lugar ay nasa hilagang West Bank ngayon."
  da:
    - "Arubbot var sæde for det tredje af Salomos tolv distrikter, som forsynede kongens husholdning én måned om året: »Heseds Søn i Aruboth, han havde Soko og hele Landet Hefer«. Det nævnes kun her. Adam Zertal, der undersøgte Nordsamarias bjerge og udgravede Khirbet el-Hamam, en befæstet bakketop mellem Galilæas sydrand og det nordlige Samaria, identificerede den med Arubbot; han fandt dér en jernalderby med et stykke af dens bymur."
    - "Zertal identificerede også Khirbet el-Hamam med Narbata, den jødiske by fra Andet Tempels tid, hvortil jøderne i Cæsarea ifølge Josefus flygtede med deres lovbøger i 66 e.Kr., tres stadier fra byen, og hvis distrikt, Narbatene, Cestius Gallus' ryttere hærgede samme år. Omkring bakken sporede han en romersk belejringsmur, lejre og en stormrampe, som han tog for en belejring i oprørets første år. Stedet ligger i dag i den nordlige Vestbred."
