body:
  en:
    - "Nineveh stood on the east bank of the Tigris, opposite modern Mosul, where the small Khosr river joins it; its ruins are the two mounds of Kuyunjik and Nebi Yunus. People lived there from about 6000 BC, and by the third millennium it was a town known for its temple of Ishtar. In the fourteenth century BC the king of Mitanni sent the statue of Ishtar of Nineveh to Egypt, as one of the Amarna letters records. Genesis lists Nineveh among the first cities of Mesopotamia."
    - "Nineveh was long one of Assyria's royal cities, but its great age began when Sennacherib (705–681 BC) made it his capital about 700 BC. He built a vast palace, a wall about 12 km long and canals bringing water from the hills; reliefs from that palace show his siege of Lachish in 701 BC. The Bible says he returned from Judah to Nineveh and was killed there by his sons, and the Babylonian Chronicle also records his murder in 681 BC. Ashurbanipal later gathered a library of more than twenty thousand tablets and fragments in the city."
    - "The Book of Jonah tells of the prophet sent to the great city and of its repentance, and Jesus held up the men of Nineveh as an example. Nahum and Zephaniah foretold its ruin. In 612 BC the Babylonians under Nabopolassar and the Medes under Cyaxares took and destroyed Nineveh after a siege of about three months, as the Babylonian Chronicle records, and Assyria never recovered."
    - "A smaller town lived on at the site under the Persians, the Seleucids and the Parthians, while the town that became Mosul grew on the opposite bank. Tradition placed the tomb of Jonah on the Nebi Yunus mound. From the 1840s Botta, Layard and their successors uncovered the palaces, the reliefs and Ashurbanipal's library."
  ru:
    - "Ниневия стояла на восточном берегу Тигра, напротив нынешнего Мосула, там, где в него впадает речка Хоср; её руины — два холма, Куюнджик и Неби-Юнус. Люди жили здесь примерно с 6000 г. до н. э., а в III тысячелетии до н. э. это был город, известный храмом Иштар. В XIV веке до н. э. царь Митанни посылал статую Иштар Ниневийской в Египет, о чём сообщает одно из Амарнских писем. Книга Бытия называет Ниневию среди первых городов Месопотамии."
    - "Ниневия издавна была одним из царских городов Ассирии, но её великая пора началась, когда Сеннахирим (705–681 гг. до н. э.) около 700 г. до н. э. сделал её столицей. Он построил огромный дворец, стену длиной около 12 км и каналы, подводившие воду с гор; рельефы этого дворца изображают его осаду Лахиса в 701 г. до н. э. Библия говорит, что он вернулся из Иудеи в Ниневию и был убит там своими сыновьями, и Вавилонская хроника тоже сообщает о его убийстве в 681 г. до н. э. Позже Ашшурбанапал собрал здесь библиотеку из более чем двадцати тысяч табличек и их обломков."
    - "Книга Ионы рассказывает о пророке, посланном в этот великий город, и о покаянии ниневитян, а Иисус ставил жителей Ниневии в пример. Наум и Софония предрекали её гибель. В 612 г. до н. э. вавилоняне во главе с Набопаласаром и мидяне во главе с Киаксаром после примерно трёхмесячной осады взяли и разрушили Ниневию, как сообщает Вавилонская хроника, и Ассирия уже не поднялась."
    - "При персах, Селевкидах и парфянах на месте города продолжал жить меньший город, а на противоположном берегу рос город, ставший Мосулом. Предание помещало гробницу Ионы на холме Неби-Юнус. С 1840-х годов Ботта, Лэйярд и их преемники раскопали дворцы, рельефы и библиотеку Ашшурбанапала."
  uk:
    - "Ніневія стояла на східному березі Тигру, навпроти сучасного Мосула, де до нього впадає невелика річка Хосер; її руїни — два пагорби Куюнджик і Неби-Юнус. Люди жили там приблизно з 6000 р. до н. е., і в третьому тисячолітті це було місто, відоме храмом Іштар. У XIV столітті до н. е. цар Мітанні надіслав статую Іштар Ніневійської до Єгипту, як свідчить один з амарнських листів. Книга Буття зараховує Ніневію до перших міст Месопотамії."
    - "Ніневія довго була одним із царських міст Ассирії, але її велика доба настала, коли Сінаххеріб (705–681 рр. до н. е.) зробив її своєю столицею близько 700 р. до н. е. Він збудував величезний палац, мур завдовжки приблизно 12 км і канали, що приводили воду з пагорбів; рельєфи з цього палацу показують його облогу Лахіша 701 р. до н. е. Біблія каже, що він повернувся з Юдеї до Ніневії й був там убитий своїми синами, а Вавилонська хроніка також фіксує його вбивство 681 р. до н. е. Згодом Ашшурбаніпал зібрав у місті бібліотеку з понад двадцяти тисяч табличок і уламків."
    - "Книга Йони розповідає про пророка, посланого до великого міста, і про його покаяння, а Ісус поставив ніневіян за приклад. Наум і Софонія провіщали його руйнування. 612 р. до н. е. вавилоняни під проводом Набопаласара та мідійці під проводом Кіаксара взяли й зруйнували Ніневію після облоги тривалістю близько трьох місяців, як свідчить Вавилонська хроніка, і Ассирія вже не оговталася."
    - "За персів, Селевкідів і парфян на місці жило менше місто, тимчасом як місто, що стало Мосулом, виросло на протилежному березі. Переказ розміщував гробницю Йони на пагорбі Неби-Юнус. З 1840-х років Ботта, Лейярд і їхні наступники відкрили палаци, рельєфи та бібліотеку Ашшурбаніпала."
  es:
    - "Nínive se alzaba en la orilla oriental del Tigris, frente a la actual Mosul, donde se le une el pequeño río Khosr; sus ruinas son los dos montículos de Kuyunjik y Nebi Yunus. Hubo gente allí desde alrededor del 6000 a. C., y en el tercer milenio era una ciudad conocida por su templo de Istar. En el siglo XIV a. C. el rey de Mitani envió a Egipto la estatua de Istar de Nínive, como registra una de las cartas de Amarna. El Génesis enumera Nínive entre las primeras ciudades de Mesopotamia."
    - "Nínive fue durante mucho tiempo una de las ciudades reales de Asiria, pero su gran época comenzó cuando Senaquerib (705–681 a. C.) la hizo su capital hacia el 700 a. C. Construyó un vasto palacio, una muralla de unos 12 km de longitud y canales que traían agua de las colinas; los relieves de ese palacio muestran su asedio de Laquis en 701 a. C. La Biblia dice que volvió de Judá a Nínive y que allí lo mataron sus hijos, y la Crónica babilónica registra también su asesinato en 681 a. C. Asurbanipal reunió después en la ciudad una biblioteca de más de veinte mil tablillas y fragmentos."
    - "El libro de Jonás cuenta cómo el profeta fue enviado a la gran ciudad y cómo esta se arrepintió, y Jesús puso a los hombres de Nínive como ejemplo. Nahum y Sofonías anunciaron su ruina. En 612 a. C. los babilonios de Nabopolasar y los medos de Ciaxares tomaron y destruyeron Nínive tras un asedio de unos tres meses, como registra la Crónica babilónica, y Asiria nunca se recuperó."
    - "Una ciudad más pequeña siguió viviendo en el lugar bajo los persas, los seléucidas y los partos, mientras la ciudad que llegaría a ser Mosul crecía en la orilla opuesta. La tradición situó la tumba de Jonás en el montículo de Nebi Yunus. Desde la década de 1840, Botta, Layard y sus sucesores sacaron a la luz los palacios, los relieves y la biblioteca de Asurbanipal."
  pt:
    - "Nínive ficava na margem leste do Tigre, defronte da atual Mossul, onde o pequeno rio Khosr se junta a ele; suas ruínas são os dois montes de Kuyunjik e Nebi Yunus. Havia gente ali desde cerca de 6000 a.C., e no terceiro milênio já era uma cidade conhecida por seu templo de Ishtar. No século XIV a.C., o rei de Mitani enviou ao Egito a estátua de Ishtar de Nínive, como registra uma das cartas de Amarna. O Gênesis lista Nínive entre as primeiras cidades da Mesopotâmia."
    - "Nínive foi por muito tempo uma das cidades reais da Assíria, mas sua grande época começou quando Senaqueribe (705–681 a.C.) a fez sua capital por volta de 700 a.C. Ele construiu um vasto palácio, uma muralha de cerca de 12 km e canais que traziam água das colinas; relevos desse palácio mostram o seu cerco de Laquis em 701 a.C. A Bíblia diz que ele voltou de Judá a Nínive e ali foi morto por seus filhos, e a Crônica Babilônica também registra o seu assassinato em 681 a.C. Assurbanípal reuniu mais tarde na cidade uma biblioteca de mais de vinte mil tábuas e fragmentos."
    - "O Livro de Jonas conta do profeta enviado à grande cidade e do seu arrependimento, e Jesus apontou os homens de Nínive como exemplo. Naum e Sofonias predisseram a sua ruína. Em 612 a.C., os babilônios sob Nabopolassar e os medos sob Ciaxares tomaram e destruíram Nínive depois de um cerco de cerca de três meses, como registra a Crônica Babilônica, e a Assíria nunca se recuperou."
    - "Uma cidade menor continuou no local sob os persas, os selêucidas e os partas, enquanto a cidade que se tornou Mossul crescia na margem oposta. A tradição situou o túmulo de Jonas no monte de Nebi Yunus. A partir da década de 1840, Botta, Layard e seus sucessores descobriram os palácios, os relevos e a biblioteca de Assurbanípal."
  de:
    - "Ninive lag am Ostufer des Tigris, gegenüber dem heutigen Mossul, wo der kleine Fluss Chosr in ihn mündet; seine Ruinen sind die beiden Hügel Kujundschik und Nebi Junus. Seit etwa 6000 v. Chr. lebten dort Menschen, und im 3. Jahrtausend war es eine Stadt, die für ihren Tempel der Ischtar bekannt war. Im 14. Jahrhundert v. Chr. schickte der König von Mitanni das Standbild der Ischtar von Ninive nach Ägypten, wie einer der Amarna-Briefe berichtet. Die Genesis zählt Ninive zu den ersten Städten Mesopotamiens."
    - "Ninive war lange eine der Königsstädte Assyriens, doch seine große Zeit begann, als Sanherib (705–681 v. Chr.) es um 700 v. Chr. zu seiner Hauptstadt machte. Er baute einen riesigen Palast, eine etwa 12 km lange Mauer und Kanäle, die Wasser aus den Bergen heranführten; Reliefs aus diesem Palast zeigen seine Belagerung von Lachisch im Jahr 701 v. Chr. Die Bibel berichtet, er sei aus Juda nach Ninive zurückgekehrt und dort von seinen Söhnen erschlagen worden, und auch die Babylonische Chronik verzeichnet seine Ermordung im Jahr 681 v. Chr. Assurbanipal sammelte später in der Stadt eine Bibliothek von mehr als zwanzigtausend Tafeln und Fragmenten."
    - "Das Buch Jona erzählt vom Propheten, der zur großen Stadt gesandt wurde, und von ihrer Umkehr, und Jesus hielt die Männer von Ninive als Beispiel vor. Nahum und Zefanja kündigten ihren Untergang an. Im Jahr 612 v. Chr. nahmen die Babylonier unter Nabopolassar und die Meder unter Kyaxares Ninive nach etwa dreimonatiger Belagerung ein und zerstörten es, wie die Babylonische Chronik berichtet, und Assyrien erholte sich nie wieder."
    - "Unter den Persern, Seleukiden und Parthern lebte eine kleinere Stadt an der Stätte fort, während die Stadt, aus der Mossul wurde, am gegenüberliegenden Ufer wuchs. Die Überlieferung setzte das Grab Jonas auf den Hügel Nebi Junus. Seit den 1840er Jahren legten Botta, Layard und ihre Nachfolger die Paläste, die Reliefs und Assurbanipals Bibliothek frei."
  fr:
    - "Ninive se dressait sur la rive orientale du Tigre, en face de l’actuelle Mossoul, là où le petit Khosr le rejoint ; ses ruines sont les deux tertres de Kuyunjik et de Nebi Yunus. On y vivait dès 6000 av. J.-C. environ, et au IIIe millénaire c’était une ville connue pour son temple d’Ishtar. Au XIVe siècle av. J.-C., le roi du Mitanni envoya en Égypte la statue d’Ishtar de Ninive, comme le consigne l’une des lettres d’Amarna. La Genèse range Ninive parmi les premières villes de Mésopotamie."
    - "Ninive fut longtemps l’une des villes royales de l’Assyrie, mais son grand âge commença quand Sanchérib (705–681 av. J.-C.) en fit sa capitale vers 700 av. J.-C. Il y bâtit un vaste palais, une muraille d’environ 12 km et des canaux amenant l’eau des collines ; les reliefs de ce palais montrent son siège de Lakis en 701 av. J.-C. La Bible dit qu’il revint de Juda à Ninive et y fut tué par ses fils, et la Chronique babylonienne note aussi son meurtre en 681 av. J.-C. Assurbanipal réunit plus tard dans la ville une bibliothèque de plus de vingt mille tablettes et fragments."
    - "Le livre de Jonas raconte l’envoi du prophète à la grande ville et sa repentance, et Jésus cita en exemple les hommes de Ninive. Nahum et Sophonie annoncèrent sa ruine. En 612 av. J.-C., les Babyloniens de Nabopolassar et les Mèdes de Cyaxare prirent et détruisirent Ninive après un siège d’environ trois mois, comme le consigne la Chronique babylonienne, et l’Assyrie ne s’en releva jamais."
    - "Une ville plus petite survécut sur le site sous les Perses, les Séleucides et les Parthes, tandis que la ville devenue Mossoul grandissait sur la rive opposée. La tradition plaçait le tombeau de Jonas sur le tertre de Nebi Yunus. À partir des années 1840, Botta, Layard et leurs successeurs mirent au jour les palais, les reliefs et la bibliothèque d’Assurbanipal."
  it:
    - "Ninive sorgeva sulla riva orientale del Tigri, di fronte all’odierna Mosul, dove vi confluisce il piccolo fiume Khosr; le sue rovine sono i due tell di Kuyunjik e di Nebi Yunus. Vi si abitava dal 6000 a.C. circa, e nel III millennio era una città nota per il suo tempio di Ishtar. Nel XIV secolo a.C. il re di Mitanni inviò in Egitto la statua di Ishtar di Ninive, come attesta una delle lettere di Amarna. La Genesi elenca Ninive tra le prime città della Mesopotamia."
    - "Ninive fu a lungo una delle città regali dell’Assiria, ma la sua grande epoca cominciò quando Sennacherib (705–681 a.C.) ne fece la capitale verso il 700 a.C. Vi costruì un vasto palazzo, una cinta lunga circa 12 km e canali che portavano l’acqua dalle colline; i rilievi di quel palazzo mostrano il suo assedio di Lachis nel 701 a.C. La Bibbia dice che da Giuda tornò a Ninive e vi fu ucciso dai suoi figli, e anche la Cronaca babilonese registra il suo assassinio nel 681 a.C. Assurbanipal radunò poi nella città una biblioteca di più di ventimila tavolette e frammenti."
    - "Il libro di Giona narra del profeta inviato alla grande città e del suo pentimento, e Gesù additò gli uomini di Ninive come esempio. Naum e Sofonia ne predissero la rovina. Nel 612 a.C. i Babilonesi sotto Nabopolassar e i Medi sotto Ciassare presero e distrussero Ninive dopo un assedio di circa tre mesi, come registra la Cronaca babilonese, e l’Assiria non si riprese più."
    - "Sul sito sopravvisse una città più piccola sotto i Persiani, i Seleucidi e i Parti, mentre la città che sarebbe diventata Mosul crebbe sulla riva opposta. La tradizione collocò la tomba di Giona sul tell di Nebi Yunus. Dagli anni 1840 Botta, Layard e i loro successori portarono alla luce i palazzi, i rilievi e la biblioteca di Assurbanipal."
  pl:
    - "Niniwa leżała na wschodnim brzegu Tygrysu, naprzeciw dzisiejszego Mosulu, tam gdzie wpada do niego niewielka rzeka Chosr; jej ruiny to dwa kopce, Kujundżyk i Nebi Junus. Mieszkano tam od około 6000 roku p.n.e., a w III tysiącleciu było to już miasto znane ze świątyni Isztar. W XIV wieku p.n.e. król Mitanni wysłał posąg Isztar z Niniwy do Egiptu, jak zapisano w jednym z listów z Amarny. Księga Rodzaju wymienia Niniwę wśród pierwszych miast Mezopotamii."
    - "Niniwa długo była jednym z miast królewskich Asyrii, ale jej wielki wiek zaczął się, gdy Sennacheryb (705–681 p.n.e.) uczynił ją około 700 roku p.n.e. swoją stolicą. Zbudował rozległy pałac, mur o długości około 12 km i kanały doprowadzające wodę ze wzgórz; reliefy z tego pałacu ukazują jego oblężenie Lakisz w 701 roku p.n.e. Biblia mówi, że wrócił z Judy do Niniwy i został tam zabity przez swoich synów, a Kronika babilońska również odnotowuje jego zamordowanie w 681 roku p.n.e. Aszurbanipal zgromadził później w mieście bibliotekę liczącą ponad dwadzieścia tysięcy tabliczek i fragmentów."
    - "Księga Jonasza opowiada o proroku posłanym do wielkiego miasta i o jego nawróceniu, a Jezus stawiał mieszkańców Niniwy za przykład. Nahum i Sofoniasz zapowiedzieli jej ruinę. W 612 roku p.n.e. Babilończycy pod wodzą Nabopolasara i Medowie pod wodzą Kiaksaresa zdobyli i zburzyli Niniwę po oblężeniu trwającym około trzech miesięcy, jak odnotowuje Kronika babilońska, i Asyria nigdy się nie podźwignęła."
    - "Za Persów, Seleucydów i Partów na miejscu żyło nadal mniejsze miasto, podczas gdy miasto, które stało się Mosulem, rozrosło się na przeciwległym brzegu. Tradycja umieszczała grób Jonasza na kopcu Nebi Junus. Od lat czterdziestych XIX wieku Botta, Layard i ich następcy odkrywali pałace, reliefy i bibliotekę Aszurbanipala."
  cs:
    - "Ninive stálo na východním břehu Tigridu, naproti dnešnímu Mosulu, kde se do něj vlévá říčka Chosr; jeho zříceninami jsou dva pahorky Kujundžik a Nabí Júnus. Lidé tam žili asi od roku 6000 př. n. l. a ve 3. tisíciletí to bylo město proslulé chrámem Ištar. Ve 14. století př. n. l. poslal mitannijský král sochu Ištar Ninivské do Egypta, jak zaznamenává jeden z amarnských dopisů. Genesis uvádí Ninive mezi prvními městy Mezopotámie."
    - "Ninive bylo dlouho jedním z královských měst Asýrie, ale jeho velký věk začal, když je Senacherib (705–681 př. n. l.) kolem roku 700 př. n. l. učinil svým hlavním městem. Vystavěl rozsáhlý palác, hradbu dlouhou asi 12 km a kanály přivádějící vodu z hor; reliéfy z tohoto paláce ukazují jeho obléhání Lachiše roku 701 př. n. l. Bible praví, že se z Judska vrátil do Ninive a byl tam zabit svými syny, a babylónská kronika také zaznamenává jeho zavraždění roku 681 př. n. l. Aššurbanipal později shromáždil ve městě knihovnu o více než dvaceti tisících tabulek a zlomků."
    - "Kniha Jonáš vypráví o proroku poslaném do velkého města a o jeho pokání a Ježíš uvedl ninivské muže za příklad. Nachum a Sofonjáš předpověděli jeho zkázu. Roku 612 př. n. l. Babylóňané pod Nabopolasarem a Médové pod Kyaxarem dobyli a zničili Ninive po asi tříměsíčním obléhání, jak zaznamenává babylónská kronika, a Asýrie se už nikdy nevzpamatovala."
    - "Na místě žilo za Peršanů, Seleukovců a Parthů dál menší město, zatímco město, které se stalo Mosulem, vyrostlo na protějším břehu. Podání kladlo hrob Jonášův na pahorek Nabí Júnus. Od 40. let 19. století odkryli Botta, Layard a jejich nástupci paláce, reliéfy i Aššurbanipalovu knihovnu."
  nl:
    - "Nineve lag aan de oostoever van de Tigris, tegenover het moderne Mosul, waar de kleine rivier de Khosr erin uitmondt; haar ruïnes zijn de twee heuvels Kuyunjik en Nebi Yunus. Er woonden al mensen vanaf omstreeks 6000 v.Chr., en in het derde millennium was het een stad die bekendstond om haar tempel van Isjtar. In de 14e eeuw v.Chr. stuurde de koning van Mitanni het beeld van Isjtar van Nineve naar Egypte, zoals een van de Amarnabrieven meldt. Genesis noemt Nineve onder de eerste steden van Mesopotamië."
    - "Nineve was lang een van de koningssteden van Assyrië, maar haar grote tijd begon toen Sanherib (705–681 v.Chr.) haar omstreeks 700 v.Chr. tot hoofdstad maakte. Hij bouwde een enorm paleis, een muur van zo’n 12 km lengte en kanalen die water uit de heuvels aanvoerden; reliëfs uit dat paleis tonen zijn beleg van Lachis in 701 v.Chr. De Bijbel zegt dat hij uit Juda naar Nineve terugkeerde en daar door zijn zonen werd gedood, en ook de Babylonische Kroniek vermeldt zijn moord in 681 v.Chr. Assurbanipal verzamelde later in de stad een bibliotheek van meer dan twintigduizend tabletten en fragmenten."
    - "Het boek Jona vertelt van de profeet die naar de grote stad werd gezonden en van haar bekering, en Jezus hield de mannen van Nineve als voorbeeld voor. Nahum en Zefanja voorspelden haar ondergang. In 612 v.Chr. veroverden en verwoestten de Babyloniërs onder Nabopolassar en de Meden onder Cyaxares Nineve na een beleg van ongeveer drie maanden, zoals de Babylonische Kroniek meldt, en Assyrië herstelde zich nooit."
    - "Onder de Perzen, de Seleuciden en de Parthen leefde een kleinere stad op de plek voort, terwijl de stad die Mosul werd aan de overkant groeide. De overlevering plaatste het graf van Jona op de heuvel Nebi Yunus. Vanaf de jaren 1840 legden Botta, Layard en hun opvolgers de paleizen, de reliëfs en de bibliotheek van Assurbanipal bloot."
  sv:
    - "Nineve låg på Tigris östra strand, mittemot nuvarande Mosul, där den lilla floden Khosr förenar sig med den; dess ruiner är de två kullarna Kuyunjik och Nebi Yunus. Människor bodde där från omkring 6000 f.Kr., och under det tredje årtusendet f.Kr. var det en stad känd för sitt Ishtartempel. På 1300-talet f.Kr. sände kungen av Mitanni Ishtar av Ninives staty till Egypten, vilket ett av Amarnabreven berättar. Första Mosebok förtecknar Nineve bland Mesopotamiens första städer."
    - "Nineve var länge en av Assyriens kungastäder, men dess storhetstid började när Sanherib (705–681 f.Kr.) gjorde det till sin huvudstad omkring 700 f.Kr. Han lät bygga ett väldigt palats, en mur på omkring 12 km och kanaler som förde vatten från kullarna; reliefer från det palatset visar hans belägring av Lakish 701 f.Kr. Bibeln säger att han vände tillbaka från Juda till Nineve och dödades där av sina söner, och den babyloniska krönikan nämner också hans mord 681 f.Kr. Assurbanipal samlade senare ett bibliotek på mer än tjugotusen tavlor och fragment i staden."
    - "Jonas bok berättar om profeten som sändes till den stora staden och om dess omvändelse, och Jesus höll fram Ninives män som ett exempel. Nahum och Sefanja förutsade dess undergång. År 612 f.Kr. intog och förstörde babylonierna under Nabopolassar och mederna under Kyaxares Nineve efter en belägring på omkring tre månader, vilket den babyloniska krönikan berättar, och Assyrien återhämtade sig aldrig."
    - "En mindre stad levde kvar på platsen under perserna, seleukiderna och parterna, medan staden som blev Mosul växte upp på motsatta stranden. Traditionen förlade Jonas grav till kullen Nebi Yunus. Från 1840-talet frilade Botta, Layard och deras efterföljare palatsen, relieferna och Assurbanipals bibliotek."
  nb:
    - "Ninive lå på østbredden av Tigris, rett overfor dagens Mosul, der den lille elven Khosr munner ut i den; ruinene er de to haugene Kuyunjik og Nebi Yunus. Mennesker bodde der fra omkring 6000 f.Kr., og på 3. årtusen f.Kr. var det en by kjent for sitt tempel for Ishtar. På 1300-tallet f.Kr. sendte kongen av Mitanni statuen av Ishtar fra Ninive til Egypt, slik et av Amarna-brevene forteller. Første Mosebok oppfører Ninive blant Mesopotamias første byer."
    - "Ninive var lenge en av Assyrias kongebyer, men dens store tid begynte da Sankerib (705–681 f.Kr.) gjorde den til hovedstad omkring 700 f.Kr. Han bygde et enormt palass, en mur omtrent 12 km lang og kanaler som førte vann fra åsene; relieffer fra dette palasset viser beleiringen av Lakisj i 701 f.Kr. Bibelen sier at han vendte tilbake fra Juda til Ninive og ble drept der av sine sønner, og den babylonske kronikken forteller også om drapet på ham i 681 f.Kr. Assurbanipal samlet senere et bibliotek på mer enn tjue tusen tavler og fragmenter i byen."
    - "Jonas' bok forteller om profeten som ble sendt til den store byen og om dens omvendelse, og Jesus holdt Ninives menn frem som eksempel. Nahum og Sefanja forutsa dens fall. I 612 f.Kr. inntok og ødela babylonerne under Nabopolassar og mederne under Kyaksares Ninive etter en beleiring på omtrent tre måneder, slik den babylonske kronikken forteller, og Assyria kom aldri til hektene igjen."
    - "En mindre by levde videre på stedet under perserne, seleukidene og partherne, mens byen som ble til Mosul vokste opp på den andre bredden. Tradisjonen plasserte Jonas' grav på haugen Nebi Yunus. Fra 1840-årene avdekket Botta, Layard og deres etterfølgere palassene, relieffene og Assurbanipals bibliotek."
  tl:
    - "Ang Ninive ay nakatayo sa silangang pampang ng Tigris, sa tapat ng makabagong Mosul, kung saan sumasanib dito ang maliit na ilog Khosr; ang mga guho nito ay ang dalawang burol ng Kuyunjik at Nebi Yunus. May mga taong nanirahan doon mula bandang 6000 BK, at pagsapit ng ika-3 milenyo ay isa na itong bayang kilala sa templo ni Ishtar. Noong ika-14 na siglo BK, ipinadala ng hari ng Mitanni sa Egipto ang rebulto ni Ishtar ng Ninive, gaya ng itinatala ng isa sa mga liham ng Amarna. Inililista ng Genesis ang Ninive sa mga unang lungsod ng Mesopotamia."
    - "Matagal nang isa ang Ninive sa mga lungsod-hari ng Asiria, ngunit nagsimula ang dakila nitong panahon nang gawin itong kabisera ni Sennacherib (705–681 BK) bandang 700 BK. Nagtayo siya ng malawak na palasyo, isang pader na mga 12 km ang haba at mga kanal na nagdadala ng tubig mula sa mga burol; ipinakikita ng mga relyebo mula sa palasyong iyon ang kaniyang pagkubkob sa Lachis noong 701 BK. Sinasabi ng Bibliya na bumalik siya mula sa Juda sa Ninive at pinatay doon ng kaniyang mga anak, at itinatala rin ng Kronikang Babilonio ang pagpatay sa kaniya noong 681 BK. Nang maglaon, nagtipon si Ashurbanipal sa lungsod ng aklatan ng higit sa dalawampung libong tapyas at piraso."
    - "Isinasalaysay ng Aklat ni Jonas ang propetang sinugo sa dakilang lungsod at ang pagsisisi nito, at itinuro ni Jesus ang mga taga-Ninive bilang halimbawa. Inihula nina Nahum at Zefanias ang pagkawasak nito. Noong 612 BK, sinakop at winasak ng mga Babilonio sa ilalim ni Nabopolassar at ng mga Medo sa ilalim ni Ciaxares ang Ninive pagkatapos ng pagkubkob na humigit-kumulang tatlong buwan, gaya ng itinatala ng Kronikang Babilonio, at hindi na muling bumangon ang Asiria."
    - "Isang mas maliit na bayan ang nanatili sa lugar sa ilalim ng mga Persiyano, Seleucida at Parthiano, samantalang ang bayang naging Mosul ay lumago sa kabilang pampang. Inilagay ng tradisyon ang libingan ni Jonas sa burol ng Nebi Yunus. Mula dekada 1840, inilantad nina Botta, Layard at ng kanilang mga kahalili ang mga palasyo, ang mga relyebo at ang aklatan ni Ashurbanipal."
  da:
    - "Nineve lå på Tigris' østbred, over for nutidens Mosul, hvor den lille flod Khosr løber ud i den; dens ruiner er de to høje Kuyunjik og Nebi Yunus. Der boede mennesker fra omkring 6000 f.Kr., og i 3. årtusinde f.Kr. var det en by kendt for sit Ishtar-tempel. I 1300-tallet f.Kr. sendte kongen af Mitanni Ishtar-statuen fra Nineve til Egypten, som et af Amarna-brevene beretter. 1. Mosebog opregner Nineve blandt Mesopotamiens første byer."
    - "Nineve var længe en af Assyriens kongebyer, men dens store tid begyndte, da Sankerib (705–681 f.Kr.) gjorde den til sin hovedstad omkring 700 f.Kr. Han byggede et vældigt palads, en mur på omkring 12 km og kanaler, der førte vand fra bjergene; relieffer fra det palads viser hans belejring af Lakisj i 701 f.Kr. Bibelen siger, at han vendte tilbage fra Juda til Nineve og blev dræbt dér af sine sønner, og Den babylonske krønike optegner også hans mord i 681 f.Kr. Assurbanipal samlede senere et bibliotek på mere end tyve tusind tavler og fragmenter i byen."
    - "Jonas' Bog fortæller om profeten, der blev sendt til den store by, og om dens omvendelse, og Jesus holdt Ninives mænd frem som eksempel. Nahum og Sefanja forudsagde dens undergang. I 612 f.Kr. indtog og ødelagde babylonierne under Nabopolassar og mederne under Kyaxares Nineve efter en belejring på omkring tre måneder, som Den babylonske krønike beretter, og Assyrien kom sig aldrig."
    - "En mindre by levede videre på stedet under perserne, seleukiderne og partherne, mens byen, der blev til Mosul, voksede op på den modsatte bred. Traditionen placerede Jonas' grav på højen Nebi Yunus. Fra 1840'erne afdækkede Botta, Layard og deres efterfølgere paladserne, relieffer og Assurbanipals bibliotek."
  sr:
    - "Нинива је стајала на источној обали Тигра, насупрот савременом Мосулу, где се у њега улива мала река Хосер; њене рушевине су две хумке, Кујунџик и Неби Јунус. Људи су ту живели од око 6000. п. н. е., а у 3. миленијуму била је град познат по храму Иштар. У 14. веку п. н. е. краљ Митанија послао је кип Иштар из Ниниве у Египат, што бележи једно од писама из Амарне. Постање убраја Ниниву међу прве градове Месопотамије."
    - "Нинива је дуго била један од краљевских градова Асирије, али њено велико доба почело је кад ју је Сенахирим (705–681. п. н. е.) око 700. п. н. е. учинио својом престоницом. Подигао је огромну палату, зид дугачак око 12 км и канале који доводе воду с брда; рељефи из те палате приказују његову опсаду Лахиса 701. п. н. е. Библија каже да се вратио из Јуде у Ниниву и да су га ту убили синови, а и Вавилонска хроника бележи његово убиство 681. п. н. е. Асурбанипал је касније у граду скупио библиотеку од више од двадесет хиљада плоча и одломака."
    - "Књига о Јони приповеда о пророку послатом у велики град и о његовом покајању, а Исус је Ниневљане истакао као пример. Наум и Софонија прорекли су њену пропаст. Године 612. п. н. е. Вавилонци под Набополасаром и Међани под Кијаксаром заузели су и разорили Ниниву после опсаде од око три месеца, како бележи Вавилонска хроника, и Асирија се никад није опоравила."
    - "Мањи град живео је на том месту под Персијанцима, Селеукидима и Партљанима, док је на супротној обали расао град који је постао Мосул. Предање је смештало Јонин гроб на хумку Неби Јунус. Од 1840-их Бота, Лејард и њихови следбеници открили су палате, рељефе и Асурбанипалову библиотеку."
  hu:
    - "Ninive a Tigris keleti partján állt, a mai Moszullal szemben, ahol a kis Khosr folyó beletorkollik; romjai Kuyunjik és Nebi Yunus két halma. Kr. e. 6000 körül már laktak ott, és a harmadik évezredben az Istár templomáról ismert város volt. A Kr. e. 14. században a mitanni király elküldte a ninivei Istár szobrát Egyiptomba, ahogy az egyik amarnai levél feljegyzi. Mózes első könyve Ninivét Mezopotámia első városai között sorolja fel."
    - "Ninive régóta Asszíria egyik királyi városa volt, de nagy kora akkor kezdődött, amikor Szanhérib (Kr. e. 705–681) Kr. e. 700 körül fővárosává tette. Hatalmas palotát épített, mintegy 12 km hosszú falat és a dombokról vizet hozó csatornákat; a palota domborművei Lákis Kr. e. 701-es ostromát ábrázolják. A Biblia szerint Júdából visszatért Ninivébe, és ott fiai megölték, a Babiloni krónika pedig szintén feljegyzi meggyilkolását Kr. e. 681-ben. Assurbanipal később több mint húszezer táblából és töredékből álló könyvtárat gyűjtött a városban."
    - "Jónás könyve elmondja a nagy városba küldött próféta történetét és a város megtérését, Jézus pedig a ninivei férfiakat állította példának. Náhum és Sofóniás megjövendölte pusztulását. Kr. e. 612-ben a babiloniak Nabopolasszar vezetésével és a médek Kjaxarész vezetésével mintegy háromhónapos ostrom után elfoglalták és lerombolták Ninivét, ahogy a Babiloni krónika feljegyzi, és Asszíria soha többé nem épült fel."
    - "A helyen kisebb város élt tovább a perzsák, a szeleukidák és a pártusok alatt, míg a Moszullá váló város a szemközti parton nőtt. A hagyomány Jónás sírját a Nebi Yunus halomra helyezte. Az 1840-es évektől Botta, Layard és utódaik feltárták a palotákat, a domborműveket és Assurbanipal könyvtárát."
  fi:
    - "Niinive sijaitsi Tigriksen itärannalla nykyisen Mosulin vastapäätä, missä pieni Khosr-joki yhtyy siihen; sen rauniot ovat Kuyunjikin ja Nebi Yunusin kaksi kumpua. Siinä asuttiin noin vuodesta 6000 eaa., ja kolmannella vuosituhannella eaa. se oli Ishtarin temppelistään tunnettu kaupunki. 1300-luvulla eaa. Mitannin kuningas lähetti Niiniven Ishtarin patsaan Egyptiin, kuten yksi Amarnan kirjeistä kertoo. 1. Mooseksen kirja luettelee Niiniven Mesopotamian ensimmäisten kaupunkien joukkoon."
    - "Niinive oli pitkään yksi Assyrian kuninkaankaupungeista, mutta sen suuri aika alkoi, kun Sanherib (705–681 eaa.) teki siitä pääkaupunkinsa noin vuonna 700 eaa. Hän rakennutti valtavan palatsin, noin 12 km pitkän muurin ja kanavat, jotka toivat vettä kukkuloilta; sen palatsin reliefit esittävät hänen Lakisin piirityksensä vuonna 701 eaa. Raamattu kertoo hänen palanneen Juudasta Niiniveen ja poikiensa tappaneen hänet siellä, ja Babylonialainen kronikka kirjaa myös hänen murhansa vuonna 681 eaa. Assurbanipal kokosi myöhemmin kaupunkiin yli kaksikymmentätuhatta savitaulua ja sirpaletta käsittävän kirjaston."
    - "Joonan kirja kertoo profeetasta, joka lähetettiin suureen kaupunkiin, ja sen katumuksesta, ja Jeesus asetti Niiniven miehet esimerkiksi. Nahum ja Sefanja ennustivat sen tuhoa. Vuonna 612 eaa. Nabopolassarin johtamat babylonialaiset ja Kyaksareen johtamat meedialaiset valtasivat ja hävittivät Niiniven noin kolme kuukautta kestäneen piirityksen jälkeen, kuten Babylonialainen kronikka kertoo, eikä Assyria enää toipunut."
    - "Pienempi kaupunki jatkoi elämäänsä paikalla persialaisten, seleukidien ja parthialaisten aikana, kun taas Mosuliksi tullut kaupunki kasvoi vastarannalla. Perimätieto sijoitti Joonan haudan Nebi Yunusin kummulle. 1840-luvulta Botta, Layard ja heidän seuraajansa paljastivat palatsit, reliefit ja Assurbanipalin kirjaston."
  vi:
    - "Ni-ni-ve nằm trên bờ đông sông Hi-đê-ke, đối diện Mosul ngày nay, nơi con sông nhỏ Khosr hợp vào; tàn tích của nó là hai gò Kuyunjik và Nebi Yunus. Người ta sống ở đó từ khoảng năm 6000 TCN, và đến thiên niên kỷ thứ ba đó là một thành nổi tiếng với đền thờ Ishtar. Vào thế kỷ 14 TCN, vua Mitanni gửi tượng Ishtar của Ni-ni-ve sang Ai Cập, như một bức thư Amarna ghi lại. Sách Sáng Thế Ký liệt kê Ni-ni-ve trong số các thành đầu tiên của Mê-sô-bô-ta-mi."
    - "Ni-ni-ve từ lâu là một trong những thành vương giả của A-si-ri, nhưng thời đại lớn của nó bắt đầu khi San-chê-ríp (705–681 TCN) lấy làm kinh đô khoảng năm 700 TCN. Ông xây một cung điện đồ sộ, một bức tường dài khoảng 12 km và các kênh dẫn nước từ đồi về; các phù điêu từ cung điện ấy cho thấy cuộc vây hãm La-ki của ông năm 701 TCN. Kinh Thánh nói ông từ Giu-đa trở về Ni-ni-ve và bị các con trai giết ở đó, và Biên niên sử Ba-by-lôn cũng ghi lại vụ ám sát ông năm 681 TCN. Về sau Ashurbanipal gom trong thành một thư viện hơn hai mươi nghìn bảng đất sét và mảnh vỡ."
    - "Sách Giô-na kể về vị tiên tri được sai đến thành lớn và sự ăn năn của nó, và Chúa Giê-su nêu dân Ni-ni-ve làm gương. Na-hum và Sô-phô-ni báo trước sự diệt vong của nó. Năm 612 TCN, người Ba-by-lôn dưới quyền Nabopolassar và người Mê-đi dưới quyền Cyaxares chiếm và hủy diệt Ni-ni-ve sau cuộc vây hãm khoảng ba tháng, như Biên niên sử Ba-by-lôn ghi lại, và A-si-ri không bao giờ hồi phục."
    - "Một thị trấn nhỏ hơn vẫn tồn tại tại địa điểm dưới thời Ba Tư, Seleucus và Parthia, trong khi thành phố về sau trở thành Mosul lớn lên ở bờ đối diện. Truyền thống đặt mộ của Giô-na trên gò Nebi Yunus. Từ thập niên 1840, Botta, Layard và những người kế tục đã khai quật các cung điện, phù điêu và thư viện của Ashurbanipal."
  ro:
    - "Ninive se afla pe malul estic al Tigrului, față în față cu actualul Mosul, unde se varsă în el micul râu Khosr; ruinele ei sunt cele două movile, Kuyunjik și Nebi Yunus. Locul a fost locuit încă de pe la 6000 î.Hr., iar în mileniul al III-lea era un oraș cunoscut pentru templul zeiței Ishtar. În secolul al XIV-lea î.Hr., regele din Mitanni a trimis în Egipt statuia lui Ishtar din Ninive, după cum consemnează una dintre scrisorile de la Amarna. Geneza înșiră Ninive printre primele cetăți ale Mesopotamiei."
    - "Ninive a fost multă vreme una dintre cetățile regale ale Asiriei, dar marea ei epocă a început când Senaherib (705–681 î.Hr.) a făcut din ea capitala sa, în jurul anului 700 î.Hr. El a construit un palat uriaș, un zid lung de circa 12 km și canale care aduceau apă din dealuri; reliefurile din acel palat înfățișează asediul lui asupra Lachișului în 701 î.Hr. Biblia spune că s-a întors din Iuda la Ninive și a fost ucis acolo de fiii săi, iar Cronica babiloniană consemnează și ea uciderea lui în 681 î.Hr. Asurbanipal a adunat mai târziu în oraș o bibliotecă de peste douăzeci de mii de tăblițe și fragmente."
    - "Cartea lui Iona povestește despre profetul trimis în marea cetate și despre pocăința ei, iar Isus i-a dat pe oamenii din Ninive drept pildă. Naum și Țefania au prevestit ruina ei. În 612 î.Hr., babilonienii conduși de Nabopolasar și mezii conduși de Ciaxar au luat și au distrus Ninive după un asediu de circa trei luni, după cum consemnează Cronica babiloniană, iar Asiria nu și-a mai revenit."
    - "Un oraș mai mic a continuat să existe pe loc sub perși, seleucizi și parți, în timp ce orașul care avea să devină Mosul a crescut pe malul opus. Tradiția a așezat mormântul lui Iona pe movila Nebi Yunus. Începând din anii 1840, Botta, Layard și urmașii lor au scos la iveală palatele, reliefurile și biblioteca lui Asurbanipal."
  bg:
    - "Ниневия се намирала на източния бряг на Тигър, срещу днешния Мосул, там, където в него се влива малката река Хоср; руините ѝ са двете могили Куюнджик и Неби Юнус. Хора живеели там от около 6000 г. пр.н.е., а през III хилядолетие тя била град, известен с храма си на Ищар. През XIV в. пр.н.е. царят на Митани изпратил статуята на Ищар от Ниневия в Египет, както съобщава едно от писмата от Амарна. Битие изброява Ниневия сред първите градове на Месопотамия."
    - "Ниневия дълго била един от царските градове на Асирия, но голямата ѝ епоха започнала, когато Сенахирим (705–681 г. пр.н.е.) я направил своя столица около 700 г. пр.н.е. Той построил огромен дворец, стена с дължина около 12 км и канали, докарващи вода от хълмовете; релефи от този дворец показват обсадата му на Лахис през 701 г. пр.н.е. Библията казва, че той се върнал от Юда в Ниневия и там бил убит от синовете си, а Вавилонската хроника също записва убийството му през 681 г. пр.н.е. По-късно Ашурбанипал събрал в града библиотека от над двадесет хиляди плочки и фрагменти."
    - "Книгата на Йона разказва за пророка, изпратен в големия град, и за покаянието му, а Исус посочил мъжете на Ниневия за пример. Наум и Софония предсказали гибелта ѝ. През 612 г. пр.н.е. вавилонците под водачеството на Набополасар и мидийците под водачеството на Киаксар превзели и разрушили Ниневия след около тримесечна обсада, както записва Вавилонската хроника, и Асирия никога не се възстановила."
    - "На мястото продължил да живее по-малък град при персите, Селевкидите и партите, докато градът, който станал Мосул, растял на отсрещния бряг. Традицията поставя гроба на Йона на могилата Неби Юнус. От 1840-те години Бота, Лейърд и техните наследници разкрили дворците, релефите и библиотеката на Ашурбанипал."
