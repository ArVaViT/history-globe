# Overview article (ADR 0007). Mainstream facts only; Mesopotamian dates follow the middle chronology.
id: nineveh
place: a70fd5d
title:
  en: "Nineveh"
  ru: "Ниневия"
  uk: "Ніневія"
  es: "Nínive"
  pt: "Nínive"
  de: "Ninive"
  fr: "Ninive"
body:
  en:
    - "Nineveh stood on the east bank of the Tigris, opposite modern Mosul, where the small Khosr river joins it; its ruins are the two mounds of Kuyunjik and Nebi Yunus. People lived there from about 6000 BC, and by the third millennium it was a town known for its temple of Ishtar. In the fourteenth century BC the king of Mitanni sent the statue of Ishtar of Nineveh to Egypt, as one of the Amarna letters records. Genesis lists Nineveh among the first cities of Mesopotamia."
    - "Nineveh was long one of Assyria's royal cities, but its great age began when Sennacherib (705–681 BC) made it his capital about 700 BC. He built a vast palace, a wall about 12 km long and canals bringing water from the hills; reliefs from that palace show his siege of Lachish in 701 BC. The Bible says he returned from Judah to Nineveh and was killed there by his sons, and the Babylonian Chronicle also records his murder in 681 BC. Ashurbanipal later gathered a library of more than twenty thousand tablets and fragments in the city."
    - "The Book of Jonah tells of the prophet sent to the great city and of its repentance, and Jesus held up the men of Nineveh as an example. Nahum and Zephaniah foretold its ruin. In 612 BC the Babylonians under Nabopolassar and the Medes under Cyaxares took and destroyed Nineveh after a siege of about three months, as the Babylonian Chronicle records, and Assyria never recovered."
    - "Only a small settlement lived on at the site under the Persians, the Seleucids and the Parthians, while the town that became Mosul grew on the opposite bank. Tradition placed the tomb of Jonah on the Nebi Yunus mound. From the 1840s Botta, Layard and their successors uncovered the palaces, the reliefs and Ashurbanipal's library."
  ru:
    - "Ниневия стояла на восточном берегу Тигра, напротив нынешнего Мосула, там, где в него впадает речка Хоср; её руины — два холма, Куюнджик и Неби-Юнус. Люди жили здесь примерно с 6000 г. до н. э., а в III тысячелетии до н. э. это был город, известный храмом Иштар. В XIV веке до н. э. царь Митанни посылал статую Иштар Ниневийской в Египет, о чём сообщает одно из Амарнских писем. Книга Бытия называет Ниневию среди первых городов Месопотамии."
    - "Ниневия издавна была одним из царских городов Ассирии, но её великая пора началась, когда Сеннахирим (705–681 гг. до н. э.) около 700 г. до н. э. сделал её столицей. Он построил огромный дворец, стену длиной около 12 км и каналы, подводившие воду с гор; рельефы этого дворца изображают его осаду Лахиса в 701 г. до н. э. Библия говорит, что он вернулся из Иудеи в Ниневию и был убит там своими сыновьями, и Вавилонская хроника тоже сообщает о его убийстве в 681 г. до н. э. Позже Ашшурбанапал собрал здесь библиотеку из более чем двадцати тысяч табличек и их обломков."
    - "Книга Ионы рассказывает о пророке, посланном в этот великий город, и о покаянии ниневитян, а Иисус ставил жителей Ниневии в пример. Наум и Софония предрекали её гибель. В 612 г. до н. э. вавилоняне во главе с Набопаласаром и мидяне во главе с Киаксаром после примерно трёхмесячной осады взяли и разрушили Ниневию, как сообщает Вавилонская хроника, и Ассирия уже не поднялась."
    - "При персах, Селевкидах и парфянах на месте города сохранялось лишь небольшое поселение, а на противоположном берегу рос город, ставший Мосулом. Предание помещало гробницу Ионы на холме Неби-Юнус. С 1840-х годов Ботта, Лэйярд и их преемники раскопали дворцы, рельефы и библиотеку Ашшурбанапала."
  uk:
    - "Ніневія стояла на східному березі Тигру, навпроти сучасного Мосула, де до нього впадає невелика річка Хосер; її руїни — два пагорби Куюнджик і Неби-Юнус. Люди жили там приблизно з 6000 р. до н. е., і в третьому тисячолітті це було місто, відоме храмом Іштар. У XIV столітті до н. е. цар Мітанні надіслав статую Іштар Ніневійської до Єгипту, як свідчить один з амарнських листів. Книга Буття зараховує Ніневію до перших міст Месопотамії."
    - "Ніневія довго була одним із царських міст Ассирії, але її велика доба настала, коли Сінаххеріб (705–681 рр. до н. е.) зробив її своєю столицею близько 700 р. до н. е. Він збудував величезний палац, мур завдовжки приблизно 12 км і канали, що приводили воду з пагорбів; рельєфи з цього палацу показують його облогу Лахіша 701 р. до н. е. Біблія каже, що він повернувся з Юдеї до Ніневії й був там убитий своїми синами, а Вавилонська хроніка також фіксує його вбивство 681 р. до н. е. Згодом Ашшурбаніпал зібрав у місті бібліотеку з понад двадцяти тисяч табличок і уламків."
    - "Книга Йони розповідає про пророка, посланого до великого міста, і про його покаяння, а Ісус поставив ніневіян за приклад. Наум і Софонія провіщали його руйнування. 612 р. до н. е. вавилоняни під проводом Набопаласара та мідійці під проводом Кіаксара взяли й зруйнували Ніневію після облоги тривалістю близько трьох місяців, як свідчить Вавилонська хроніка, і Ассирія вже не оговталася."
    - "За персів, Селевкідів і парфян на місці жило лише невелике поселення, тимчасом як місто, що стало Мосулом, виросло на протилежному березі. Переказ розміщував гробницю Йони на пагорбі Неби-Юнус. З 1840-х років Ботта, Лейярд і їхні наступники відкрили палаци, рельєфи та бібліотеку Ашшурбаніпала."
  es:
    - "Nínive se alzaba en la orilla oriental del Tigris, frente a la actual Mosul, donde se le une el pequeño río Khosr; sus ruinas son los dos montículos de Kuyunjik y Nebi Yunus. Hubo gente allí desde alrededor del 6000 a. C., y en el tercer milenio era una ciudad conocida por su templo de Istar. En el siglo XIV a. C. el rey de Mitani envió a Egipto la estatua de Istar de Nínive, como registra una de las cartas de Amarna. El Génesis enumera Nínive entre las primeras ciudades de Mesopotamia."
    - "Nínive fue durante mucho tiempo una de las ciudades reales de Asiria, pero su gran época comenzó cuando Senaquerib (705–681 a. C.) la hizo su capital hacia el 700 a. C. Construyó un vasto palacio, una muralla de unos 12 km de longitud y canales que traían agua de las colinas; los relieves de ese palacio muestran su asedio de Laquis en 701 a. C. La Biblia dice que volvió de Judá a Nínive y que allí lo mataron sus hijos, y la Crónica babilónica registra también su asesinato en 681 a. C. Asurbanipal reunió después en la ciudad una biblioteca de más de veinte mil tablillas y fragmentos."
    - "El libro de Jonás cuenta cómo el profeta fue enviado a la gran ciudad y cómo esta se arrepintió, y Jesús puso a los hombres de Nínive como ejemplo. Nahum y Sofonías anunciaron su ruina. En 612 a. C. los babilonios de Nabopolasar y los medos de Ciaxares tomaron y destruyeron Nínive tras un asedio de unos tres meses, como registra la Crónica babilónica, y Asiria nunca se recuperó."
    - "Solo un pequeño asentamiento siguió viviendo en el lugar bajo los persas, los seléucidas y los partos, mientras la ciudad que llegaría a ser Mosul crecía en la orilla opuesta. La tradición situó la tumba de Jonás en el montículo de Nebi Yunus. Desde la década de 1840, Botta, Layard y sus sucesores sacaron a la luz los palacios, los relieves y la biblioteca de Asurbanipal."
  pt:
    - "Nínive ficava na margem leste do Tigre, defronte da atual Mossul, onde o pequeno rio Khosr se junta a ele; suas ruínas são os dois montes de Kuyunjik e Nebi Yunus. Havia gente ali desde cerca de 6000 a.C., e no terceiro milênio já era uma cidade conhecida por seu templo de Ishtar. No século XIV a.C., o rei de Mitani enviou ao Egito a estátua de Ishtar de Nínive, como registra uma das cartas de Amarna. O Gênesis lista Nínive entre as primeiras cidades da Mesopotâmia."
    - "Nínive foi por muito tempo uma das cidades reais da Assíria, mas sua grande época começou quando Senaqueribe (705–681 a.C.) a fez sua capital por volta de 700 a.C. Ele construiu um vasto palácio, uma muralha de cerca de 12 km e canais que traziam água das colinas; relevos desse palácio mostram o seu cerco de Laquis em 701 a.C. A Bíblia diz que ele voltou de Judá a Nínive e ali foi morto por seus filhos, e a Crônica Babilônica também registra o seu assassinato em 681 a.C. Assurbanípal reuniu mais tarde na cidade uma biblioteca de mais de vinte mil tábuas e fragmentos."
    - "O Livro de Jonas conta do profeta enviado à grande cidade e do seu arrependimento, e Jesus apontou os homens de Nínive como exemplo. Naum e Sofonias predisseram a sua ruína. Em 612 a.C., os babilônios sob Nabopolassar e os medos sob Ciaxares tomaram e destruíram Nínive depois de um cerco de cerca de três meses, como registra a Crônica Babilônica, e a Assíria nunca se recuperou."
    - "Só um pequeno povoado continuou no local sob os persas, os selêucidas e os partas, enquanto a cidade que se tornou Mossul crescia na margem oposta. A tradição situou o túmulo de Jonas no monte de Nebi Yunus. A partir da década de 1840, Botta, Layard e seus sucessores descobriram os palácios, os relevos e a biblioteca de Assurbanípal."
  de:
    - "Ninive lag am Ostufer des Tigris, gegenüber dem heutigen Mossul, wo der kleine Fluss Chosr in ihn mündet; seine Ruinen sind die beiden Hügel Kujundschik und Nebi Junus. Seit etwa 6000 v. Chr. lebten dort Menschen, und im 3. Jahrtausend war es eine Stadt, die für ihren Tempel der Ischtar bekannt war. Im 14. Jahrhundert v. Chr. schickte der König von Mitanni das Standbild der Ischtar von Ninive nach Ägypten, wie einer der Amarna-Briefe berichtet. Die Genesis zählt Ninive zu den ersten Städten Mesopotamiens."
    - "Ninive war lange eine der Königsstädte Assyriens, doch seine große Zeit begann, als Sanherib (705–681 v. Chr.) es um 700 v. Chr. zu seiner Hauptstadt machte. Er baute einen riesigen Palast, eine etwa 12 km lange Mauer und Kanäle, die Wasser aus den Bergen heranführten; Reliefs aus diesem Palast zeigen seine Belagerung von Lachisch im Jahr 701 v. Chr. Die Bibel berichtet, er sei aus Juda nach Ninive zurückgekehrt und dort von seinen Söhnen erschlagen worden, und auch die Babylonische Chronik verzeichnet seine Ermordung im Jahr 681 v. Chr. Assurbanipal sammelte später in der Stadt eine Bibliothek von mehr als zwanzigtausend Tafeln und Fragmenten."
    - "Das Buch Jona erzählt vom Propheten, der zur großen Stadt gesandt wurde, und von ihrer Umkehr, und Jesus hielt die Männer von Ninive als Beispiel vor. Nahum und Zefanja kündigten ihren Untergang an. Im Jahr 612 v. Chr. nahmen die Babylonier unter Nabopolassar und die Meder unter Kyaxares Ninive nach etwa dreimonatiger Belagerung ein und zerstörten es, wie die Babylonische Chronik berichtet, und Assyrien erholte sich nie wieder."
    - "Unter den Persern, Seleukiden und Parthern lebte nur noch eine kleine Siedlung an der Stätte, während die Stadt, aus der Mossul wurde, am gegenüberliegenden Ufer wuchs. Die Überlieferung setzte das Grab Jonas auf den Hügel Nebi Junus. Seit den 1840er Jahren legten Botta, Layard und ihre Nachfolger die Paläste, die Reliefs und Assurbanipals Bibliothek frei."
  fr:
    - "Ninive se dressait sur la rive orientale du Tigre, en face de l’actuelle Mossoul, là où le petit Khosr le rejoint ; ses ruines sont les deux tertres de Kuyunjik et de Nebi Yunus. On y vivait dès 6000 av. J.-C. environ, et au IIIe millénaire c’était une ville connue pour son temple d’Ishtar. Au XIVe siècle av. J.-C., le roi du Mitanni envoya en Égypte la statue d’Ishtar de Ninive, comme le consigne l’une des lettres d’Amarna. La Genèse range Ninive parmi les premières villes de Mésopotamie."
    - "Ninive fut longtemps l’une des villes royales de l’Assyrie, mais son grand âge commença quand Sanchérib (705–681 av. J.-C.) en fit sa capitale vers 700 av. J.-C. Il y bâtit un vaste palais, une muraille d’environ 12 km et des canaux amenant l’eau des collines ; les reliefs de ce palais montrent son siège de Lakis en 701 av. J.-C. La Bible dit qu’il revint de Juda à Ninive et y fut tué par ses fils, et la Chronique babylonienne note aussi son meurtre en 681 av. J.-C. Assurbanipal réunit plus tard dans la ville une bibliothèque de plus de vingt mille tablettes et fragments."
    - "Le livre de Jonas raconte l’envoi du prophète à la grande ville et sa repentance, et Jésus cita en exemple les hommes de Ninive. Nahum et Sophonie annoncèrent sa ruine. En 612 av. J.-C., les Babyloniens de Nabopolassar et les Mèdes de Cyaxare prirent et détruisirent Ninive après un siège d’environ trois mois, comme le consigne la Chronique babylonienne, et l’Assyrie ne s’en releva jamais."
    - "Seule une petite bourgade survécut sur le site sous les Perses, les Séleucides et les Parthes, tandis que la ville devenue Mossoul grandissait sur la rive opposée. La tradition plaçait le tombeau de Jonas sur le tertre de Nebi Yunus. À partir des années 1840, Botta, Layard et leurs successeurs mirent au jour les palais, les reliefs et la bibliothèque d’Assurbanipal."
