body:
  en:
    - "Anathoth was a town of Benjamin about 4 km north-east of Jerusalem. Its name lives on in the Arab village of 'Anata; Josephus puts it twenty furlongs from Jerusalem and Eusebius at the third milestone. Whether the ancient town lay under the village or on the nearby hill of Ras el-Kharrubeh, where trial soundings were made in 1936, is disputed. The name may recall the Canaanite goddess Anat."
    - 'Joshua lists Anathoth among the cities given to the sons of Aaron, the priests. Two of David''s mighty men, Abiezer and Jehu, came from here. Abiathar the priest had sided with Adonijah, and Solomon, instead of putting him to death, sent him home to his fields at Anathoth. In Isaiah''s picture of an enemy marching on Jerusalem from the north, "poor Anathoth" is one of the places on the way.'
    - 'Anathoth is best known as the home of Jeremiah, "of the priests that were in Anathoth in the land of Benjamin". Its men sought his life and told him not to prophesy in the name of the LORD. During the Babylonian siege of Jerusalem, while he was shut up in the court of the prison, Jeremiah bought the field of his cousin Hanameel at Anathoth by the right of redemption, as a sign that "Houses and fields and vineyards shall be possessed again in this land". When he tried to leave the city for the land of Benjamin, he was seized as a deserter; Josephus says he was on his way to Anathoth.'
    - "After the exile 128 men of Anathoth came back from Babylon, and in Nehemiah's day the town was again lived in by Benjamites. In the fourth century Eusebius still knew Anathoth near Jerusalem as the home of Jeremiah. Pottery of the Iron Age and of Hellenistic times has been found at 'Anata, and remains of a Byzantine church show that the village was lived in during late antiquity."
  ru:
    - "Анафоф — город Вениаминов примерно в 4 км к северо-востоку от Иерусалима. Его имя сохранилось в арабской деревне Аната; Иосиф Флавий помещает его в двадцати стадиях от Иерусалима, а Евсевий — у третьего милевого камня. Лежал ли древний город под деревней или на соседнем холме Рас-эль-Харруба, где в 1936 г. сделали пробные раскопы, — вопрос спорный. Возможно, название связано с ханаанской богиней Анат."
    - "Книга Иисуса Навина называет Анафоф среди городов, отданных священникам, сынам Аарона. Отсюда были два из храбрых Давида — Евиезер и Иегу. Священник Авиафар поддержал Адонию, и Соломон, вместо того чтобы казнить его, отослал его на его поле в Анафоф. В картине Исаии, где враг идёт на Иерусалим с севера, «бедный Анафоф» — одно из мест на его пути."
    - "Больше всего Анафоф известен как родина Иеремии, «из священников в Анафофе, в земле Вениаминовой». Его жители искали души пророка и запрещали ему пророчествовать во имя Господа. Во время вавилонской осады Иерусалима, когда Иеремия был заключён во дворе стражи, он купил поле своего двоюродного брата Анамеила в Анафофе по праву выкупа — в знак того, что «домы и поля и виноградники будут снова покупаемы в земле сей». Когда он хотел уйти из города в землю Вениаминову, его задержали как перебежчика; Иосиф Флавий пишет, что он шёл в Анафоф."
    - "После плена в Анафоф вернулись из Вавилона сто двадцать восемь человек, а во дни Неемии в нём снова жили вениамитяне. В IV веке Евсевий всё ещё знал Анафоф близ Иерусалима как родину Иеремии. В Анате найдена керамика железного века и эллинистического времени, а остатки византийской церкви показывают, что в поздней античности деревня была обитаема."
  uk:
    - "Анатот був містом Веніяміна приблизно за 4 км на північний схід від Єрусалима. Його назва живе в арабському селі Аната; Йосиф Флавій розміщує його за двадцять стадіїв від Єрусалима, а Євсевій — біля третього верстового каменя. Чи стояло давнє місто під селом, чи на сусідньому пагорбі Рас-ель-Харруба, де 1936 року провели пробні розкопи, — спірне. Назва може нагадувати ханаанську богиню Анат."
    - "Ісус Навин зараховує Анатот до міст, даних синам Аарона, священникам. Двоє з могутніх Давида, Авіезер і Єгу, походили звідси. Священник Авіятар став на бік Адонії, і Соломон, замість стратити його, відіслав його додому на поля в Анатоті: «Ійди ув Анатот у твій хутор». В Ісаїному образі ворога, що йде на Єрусалим з півночі, «Анатот бідний» — одне з місць на шляху."
    - "Анатот найвідоміший як батьківщина Єремії, «з тих сьвященників, що жили в Анатотї, в займищі Беняминовому». Його мужі шукали його життя й казали йому не пророкувати в ім'я Господнє. Під час вавилонської облоги Єрусалима, коли Єремія був замкнений у дворі в'язниці, він купив поле свого двоюрідного брата Анамеїла в Анатоті за правом викупу, як знак, що «Будуть колись ізнов купуватись доми й поля й виноградники в сїй землї». Коли він спробував вийти з міста в землю Веніяміна, його схопили як перебіжчика; Йосиф Флавій каже, що він ішов до Анатоту."
    - "Після вигнання 128 мужів з Анатоту повернулися з Вавилона, а за днів Неемії місто знову було заселене веніяминянами. У IV столітті Євсевій ще знав Анатот поблизу Єрусалима як батьківщину Єремії. В Анаті знайдено кераміку залізної доби й елліністичних часів, а рештки візантійської церкви свідчать, що село було заселене в пізню давнину."
  es:
    - "Anatot era una ciudad de Benjamín a unos 4 km al nordeste de Jerusalén. Su nombre pervive en la aldea árabe de 'Anata; Josefo la sitúa a veinte estadios de Jerusalén y Eusebio en el tercer miliario. Se discute si la antigua ciudad estaba bajo la aldea o en la cercana colina de Ras el-Kharrubeh, donde se hicieron sondeos de prueba en 1936. El nombre puede recordar a la diosa cananea Anat."
    - "Josué enumera Anatot entre las ciudades dadas a los hijos de Aarón, los sacerdotes. Dos de los valientes de David, Abiezer y Jehú, procedían de aquí. El sacerdote Abiatar se había puesto de parte de Adonías, y Salomón, en lugar de darle muerte, lo envió a sus campos de Anatot. En la imagen de Isaías de un enemigo que marcha sobre Jerusalén desde el norte, «pobrecilla Anathoth» es uno de los lugares del camino."
    - "Anatot es conocida sobre todo como patria de Jeremías, «de los sacerdotes que estuvieron en Anathoth, en tierra de Benjamín». Sus hombres buscaron su vida y le dijeron que no profetizara en el nombre de Jehová. Durante el asedio babilonio de Jerusalén, mientras estaba encerrado en el patio de la cárcel, Jeremías compró el campo de su primo Hanameel en Anatot por derecho de redención, como señal de que «Aun se comprarán casas, y heredades, y viñas en esta tierra». Cuando intentó salir de la ciudad hacia tierra de Benjamín, fue apresado como desertor; Josefo dice que iba camino de Anatot."
    - "Después del exilio, 128 hombres de Anatot volvieron de Babilonia, y en tiempos de Nehemías la ciudad estaba de nuevo habitada por benjaminitas. En el siglo IV Eusebio aún conocía Anatot cerca de Jerusalén como patria de Jeremías. En 'Anata se ha hallado cerámica de la edad del Hierro y de época helenística, y los restos de una iglesia bizantina muestran que la aldea estuvo habitada en la Antigüedad tardía."
  pt:
    - "Anatote era uma cidade de Benjamim cerca de 4 km a nordeste de Jerusalém. Seu nome sobrevive na aldeia árabe de ʻAnata; Josefo a põe a vinte estádios de Jerusalém e Eusébio ao terceiro marco miliário. Se a cidade antiga ficava sob a aldeia ou na colina vizinha de Ras el-Kharrubeh, onde se fizeram sondagens em 1936, é discutido. O nome pode lembrar a deusa cananeia Anate."
    - "Josué lista Anatote entre as cidades dadas aos filhos de Arão, os sacerdotes. Dois dos valentes de Davi, Abiezer e Jeú, eram daqui. O sacerdote Abiatar havia seguido Adonias e Salomão, em vez de o matar, mandou-o para casa, para os seus campos em Anatote. No quadro de Isaías de um inimigo que marcha sobre Jerusalém desde o norte, “Pobre Anatote!” é um dos lugares no caminho."
    - "Anatote é mais conhecida como a terra de Jeremias, “um dos sacerdotes que estavam em Anatote, na terra de Benjamim”. Seus homens procuraram tirar-lhe a vida e lhe disseram que não profetizasse no nome do SENHOR. Durante o cerco babilônico de Jerusalém, enquanto estava preso no pátio da guarda, Jeremias comprou de seu primo Hanameel o campo de Anatote pelo direito de resgate, como sinal de que “Casas, campos e vinhas ainda serão comprados novamente nesta terra”. Quando tentou sair da cidade para a terra de Benjamim, foi preso como desertor; Josefo diz que ia a caminho de Anatote."
    - "Depois do exílio, 128 homens de Anatote voltaram da Babilônia, e nos dias de Neemias a cidade foi de novo habitada por benjamitas. No século IV, Eusébio ainda conhecia Anatote, perto de Jerusalém, como a terra de Jeremias. Cerâmica da Idade do Ferro e da época helenística foi encontrada em ʻAnata, e restos de uma igreja bizantina mostram que a aldeia foi habitada na Antiguidade tardia."
  de:
    - "Anatot war eine Stadt Benjamins, etwa 4 km nordöstlich von Jerusalem. Sein Name lebt im arabischen Dorf 'Anata fort; Josephus setzt es zwanzig Stadien von Jerusalem entfernt an, Eusebius beim dritten Meilenstein. Ob die antike Stadt unter dem Dorf oder auf dem nahen Hügel Ras el-Charrube lag, wo 1936 Probegrabungen vorgenommen wurden, ist umstritten. Der Name mag an die kanaanäische Göttin Anat erinnern."
    - "Josua zählt Anatot unter den Städten auf, die den Söhnen Aarons, den Priestern, gegeben wurden. Zwei von Davids Helden, Abiëser und Jehu, stammten von hier. Der Priester Abjatar hatte zu Adonija gehalten, und Salomo ließ ihn nicht töten, sondern schickte ihn heim auf seine Äcker in Anatot. In Jesajas Bild eines Feindes, der von Norden gegen Jerusalem zieht, ist „du elendes Anathoth“ einer der Orte am Weg."
    - "Am bekanntesten ist Anatot als Heimat Jeremias, „aus den Priestern zu Anathoth im Lande Benjamin“. Seine Männer trachteten ihm nach dem Leben und sagten ihm, er solle nicht im Namen des HERRN weissagen. Während der babylonischen Belagerung Jerusalems, als er im Hof des Gefängnisses eingeschlossen war, kaufte Jeremia den Acker seines Vetters Hanamel in Anatot kraft des Einlösungsrechts, als Zeichen dafür, dass „noch soll man Häuser, Äcker und Weinberge kaufen in diesem Lande“. Als er die Stadt verlassen und ins Land Benjamin gehen wollte, wurde er als Überläufer ergriffen; Josephus sagt, er sei auf dem Weg nach Anatot gewesen."
    - "Nach dem Exil kehrten 128 Männer von Anatot aus Babylon zurück, und zu Nehemias Zeit war die Stadt wieder von Benjaminitern bewohnt. Im 4. Jahrhundert kannte Eusebius Anatot bei Jerusalem noch als Heimat Jeremias. In 'Anata wurden Keramik der Eisenzeit und der hellenistischen Zeit gefunden, und Reste einer byzantinischen Kirche zeigen, dass das Dorf in der Spätantike bewohnt war."
  fr:
    - "Anathoth était une ville de Benjamin à environ 4 km au nord-est de Jérusalem. Son nom survit dans le village arabe de ’Anata ; Josèphe la met à vingt stades de Jérusalem et Eusèbe à la troisième borne milliaire. On discute si la ville antique se trouvait sous le village ou sur la colline voisine de Ras el-Kharrubeh, où des sondages d’essai furent faits en 1936. Le nom peut rappeler la déesse cananéenne Anat."
    - "Josué range Anathoth parmi les villes données aux fils d’Aaron, les prêtres. Deux des vaillants hommes de David, Abiézer et Jéhu, en étaient originaires. Le prêtre Abiathar avait pris parti pour Adonija, et Salomon, au lieu de le faire mourir, le renvoya dans ses champs d’Anathoth. Dans le tableau d’Ésaïe d’un ennemi marchant du nord sur Jérusalem, « Malheur à toi, Anathoth ! » figure parmi les étapes."
    - "Anathoth est surtout connue comme patrie de Jérémie, « l’un des sacrificateurs d’Anathoth, dans le pays de Benjamin ». Ses hommes en voulurent à sa vie et lui dirent de ne pas prophétiser au nom de l’Éternel. Pendant le siège babylonien de Jérusalem, alors qu’il était enfermé dans la cour de la prison, Jérémie acheta par droit de rachat le champ de son cousin Hanameel à Anathoth, en signe qu’« on achètera encore des maisons, des champs et des vignes, dans ce pays ». Quand il voulut quitter la ville pour le pays de Benjamin, il fut arrêté comme déserteur ; Josèphe dit qu’il allait à Anathoth."
    - "Après l’exil, 128 hommes d’Anathoth revinrent de Babylone, et du temps de Néhémie la ville était de nouveau habitée par des Benjaminites. Au IVe siècle, Eusèbe connaissait encore Anathoth près de Jérusalem comme patrie de Jérémie. De la céramique de l’âge du Fer et de l’époque hellénistique a été trouvée à ’Anata, et les restes d’une église byzantine montrent que le village était habité durant l’Antiquité tardive."
  it:
    - "Anatòt era una città di Beniamino a circa 4 km a nord-est di Gerusalemme. Il suo nome vive nel villaggio arabo di ‘Anata; Flavio Giuseppe la pone a venti stadi da Gerusalemme ed Eusebio al terzo miglio. Se l’antica città sorgesse sotto il villaggio o sulla vicina collina di Ras el-Kharrubeh, dove nel 1936 furono compiuti sondaggi di prova, è discusso. Il nome può ricordare la dea cananea Anat."
    - "Giosuè elenca Anatòt fra le città date ai figli di Aronne, i sacerdoti. Due dei prodi di Davide, Abiezer e Ieu, venivano da qui. Il sacerdote Abiatar si era schierato con Adonia, e Salomone, invece di metterlo a morte, lo rimandò a casa nei suoi campi ad Anatòt. Nel quadro di Isaia di un nemico che marcia su Gerusalemme da nord, «Povera Anathoth» è uno dei luoghi lungo la via."
    - "Anatòt è nota soprattutto come patria di Geremia, «uno dei sacerdoti che stavano ad Anatoth, nel paese di Beniamino». I suoi uomini cercarono la sua vita e gli dissero di non profetare nel nome del Signore. Durante l’assedio babilonese di Gerusalemme, mentre era rinchiuso nel cortile della prigione, Geremia comprò il campo del cugino Canamèl ad Anatòt per diritto di riscatto, come segno che «Si compreranno ancora delle case, de’ campi e delle vigne, in questo paese». Quando tentò di lasciare la città per il paese di Beniamino, fu arrestato come disertore; Flavio Giuseppe dice che era in cammino verso Anatòt."
    - "Dopo l’esilio 128 uomini di Anatòt tornarono da Babilonia, e ai giorni di Neemia la città era di nuovo abitata dai Beniaminiti. Nel IV secolo Eusebio conosceva ancora Anatòt presso Gerusalemme come patria di Geremia. Ad ‘Anata sono state trovate ceramiche dell’età del Ferro e dell’epoca ellenistica, e i resti di una chiesa bizantina mostrano che il villaggio fu abitato nella tarda antichità."
  pl:
    - "Anatot było miastem Beniamina około 4 km na północny wschód od Jerozolimy. Jego nazwa żyje w arabskiej wsi 'Anata; Józef Flawiusz umieszcza je w odległości dwudziestu stadiów od Jerozolimy, a Euzebiusz przy trzecim kamieniu milowym. Czy dawne miasto leżało pod wsią, czy na pobliskim wzgórzu Ras el-Kharrubeh, gdzie w 1936 roku wykonano próbne sondaże, jest sporne. Nazwa może przywodzić na myśl kananejską boginię Anat."
    - "Jozue wymienia Anatot wśród miast oddanych synom Aarona, kapłanom. Stąd pochodziło dwóch bohaterów Dawida, Abiezer i Jehu. Kapłan Abiatar stanął po stronie Adoniasza, a Salomon zamiast go zabić, odesłał go do jego pól w Anatot. W obrazie Izajasza, w którym wróg maszeruje na Jerozolimę z północy, „ubogie Anatot” jest jednym z miejsc na drodze."
    - "Anatot jest najbardziej znane jako dom Jeremiasza, „z kapłanów, którzy byli w Anatot, w ziemi Benjamin”. Jego mieszkańcy czyhali na jego życie i zakazali mu prorokować w imię Pana. Podczas babilońskiego oblężenia Jerozolimy, gdy był zamknięty w sieni więzienia, Jeremiasz kupił z prawa wykupu pole swego kuzyna Chananeela w Anatot, na znak, że „Jeszcze będą kupowane domy, i role, i winnice w tej ziemi”. Gdy próbował opuścić miasto i udać się do ziemi Beniamina, schwytano go jako zbiega; Józef Flawiusz mówi, że szedł do Anatot."
    - "Po wygnaniu 128 mężów z Anatot wróciło z Babilonu, a za Nehemiasza miasto znów zamieszkali beniaminici. W IV wieku Euzebiusz wciąż znał Anatot koło Jerozolimy jako dom Jeremiasza. W 'Anata znaleziono ceramikę z epoki żelaza i okresu hellenistycznego, a pozostałości kościoła bizantyjskiego świadczą, że wieś była zamieszkana w późnej starożytności."
  nl:
    - "Anatot was een stad van Benjamin, ongeveer 4 km ten noordoosten van Jeruzalem. De naam leeft voort in het Arabische dorp ’Anata; Josephus plaatst haar twintig stadiën van Jeruzalem en Eusebius bij de derde mijlpaal. Of de oude stad onder het dorp lag of op de nabije heuvel Ras el-Kharrubeh, waar in 1936 proefsleuven werden gegraven, is omstreden. De naam herinnert misschien aan de Kanaänitische godin Anat."
    - "Jozua rekent Anatot tot de steden die aan de zonen van Aäron, de priesters, werden gegeven. Twee van Davids helden, Abiëzer en Jehu, kwamen hier vandaan. De priester Abjatar had Adonia gesteund, en Salomo zond hem, in plaats van hem te doden, naar huis, naar zijn akkers te Anatot. In Jesaja’s beeld van een vijand die uit het noorden tegen Jeruzalem optrekt, is “ellendige Anathoth” een van de plaatsen onderweg."
    - "Anatot is het best bekend als de woonplaats van Jeremia, “uit de priesteren, die te Anathoth waren, in het land van Benjamin”. Zijn mannen stonden hem naar het leven en zeiden hem niet te profeteren in de naam van de HEER. Tijdens het Babylonische beleg van Jeruzalem, toen hij opgesloten zat in de voorhof van de gevangenis, kocht Jeremia met het recht van lossing de akker van zijn neef Hanameël te Anatot, als teken dat “er zullen nog huizen, en velden, en wijngaarden in dit land gekocht worden”. Toen hij de stad wilde verlaten naar het land van Benjamin, werd hij als overloper gegrepen; Josephus zegt dat hij op weg was naar Anatot."
    - "Na de ballingschap keerden 128 mannen van Anatot uit Babylon terug, en in Nehemia’s dagen werd de stad weer door Benjaminieten bewoond. In de vierde eeuw kende Eusebius Anatot nog bij Jeruzalem als de woonplaats van Jeremia. Aardewerk uit de ijzertijd en de hellenistische tijd is te ’Anata gevonden, en resten van een Byzantijnse kerk tonen dat het dorp in de late oudheid bewoond was."
  cs:
    - "Anatót bylo město Benjamínovo asi 4 km severovýchodně od Jeruzaléma. Jeho jméno žije v arabské vesnici 'Anata; Josephus Flavius je klade dvacet stadií od Jeruzaléma a Eusebios u třetího milníku. Zda staré město leželo pod vesnicí, nebo na blízkém pahorku Ras el-Kharrubeh, kde byly roku 1936 provedeny zkušební sondy, je sporné. Jméno může připomínat kenaanskou bohyni Anat."
    - "Jozue uvádí Anatót mezi městy daná synům Áronovým, kněžím. Dva z Davidových udatných, Abíezer a Jehú, pocházeli odtud. Kněz Abjatar stál na straně Adonijáše a Šalomoun ho místo popravy poslal domů na jeho pole v Anatótu. V Izajášově obrazu nepřítele táhnoucího na Jeruzalém od severu je „ubohá Anatot“ jedním z míst na cestě."
    - "Anatót je nejlépe znám jako domov Jeremjášův, „z kněží, kteříž byli v Anatot, v zemi Beniamin“. Jeho muži mu šli po životě a řekli mu, aby neprorokoval ve jménu Hospodinově. Za babylonského obležení Jeruzaléma, když byl zavřen v síni stráže, koupil Jeremjáš právem příbuzenského výkupu pole svého bratrance Chanamela v Anatótu jako znamení, že „Ještěť kupováni budou domové, a rolí, i vinice v zemi této“. Když se pokusil opustit město do země Beniaminovy, byl zatčen jako přeběhlík; Josephus Flavius praví, že šel do Anatótu."
    - "Po vyhnanství se z Babylóna vrátilo 128 mužů z Anatótu a za Nehemjášových dnů ve městě opět bydleli Benjamínovci. Ve 4. století Eusebios stále znal Anatót poblíž Jeruzaléma jako domov Jeremjášův. V 'Anata byla nalezena keramika z doby železné i helénistické a zbytky byzantského kostela ukazují, že vesnice byla obývána v pozdní antice."
  sv:
    - "Anatot var en stad i Benjamin omkring 4 km nordost om Jerusalem. Dess namn lever kvar i den arabiska byn 'Anata; Josefus placerar den tjugo stadier från Jerusalem och Eusebios vid tredje milstolpen. Om den antika staden låg under byn eller på den närliggande höjden Ras el-Kharrubeh, där provschakt gjordes 1936, är omstritt. Namnet kan påminna om den kananeiska gudinnan Anat."
    - "Josua räknar upp Anatot bland de städer som gavs åt Arons söner, prästerna. Två av Davids hjältar, Avieser och Jehu, kom härifrån. Prästen Evjatar hade ställt sig på Adonias sida, och Salomo skickade honom, i stället för att döda honom, hem till hans jordagods i Anatot. I Jesajas bild av en fiende som tågar mot Jerusalem från norr är ”Arma Anatot!” en av platserna på vägen."
    - "Anatot är mest känt som Jeremias hemort, ”en av prästerna i Anatot i Benjamins land”. Dess män sökte hans liv och sade åt honom att inte profetera i HERRENS namn. Under den babyloniska belägringen av Jerusalem, medan han satt fången i fängelsegården, köpte Jeremia sin kusin Hanamels åker i Anatot med lösenrätt, som ett tecken på att ”Ännu en gång skall man komma att i detta land köpa hus och åkrar och vingårdar”. När han försökte lämna staden för Benjamins land greps han som överlöpare; Josefus säger att han var på väg till Anatot."
    - "Efter exilen kom 128 män från Anatot tillbaka från Babylon, och på Nehemjas tid bodde benjaminiter åter i staden. På 300-talet kände Eusebios ännu Anatot nära Jerusalem som Jeremias hemort. Keramik från järnåldern och den hellenistiska tiden har hittats vid 'Anata, och lämningar av en bysantinsk kyrka visar att byn var bebodd under senantiken."
  nb:
    - "Anatot var en by i Benjamin omtrent 4 km nordøst for Jerusalem. Navnet lever videre i den arabiske landsbyen 'Anata; Josefus plasserer den tjue stadier fra Jerusalem og Eusebius ved tredje milepæl. Om den gamle byen lå under landsbyen eller på den nærliggende høyden Ras el-Kharrubeh, der prøvegravinger ble gjort i 1936, er omstridt. Navnet kan minne om den kana'anittiske gudinnen Anat."
    - "Josva oppfører Anatot blant byene som ble gitt til Arons sønner, prestene. To av Davids helter, Abieser og Jehu, kom herfra. Presten Abjatar hadde holdt med Adonja, og Salomo sendte ham, i stedet for å drepe ham, hjem til gården hans i Anatot. I Jesajas bilde av en fiende som marsjerer mot Jerusalem fra nord, er «Arme Anatot!» ett av stedene på veien."
    - "Anatot er best kjent som Jeremias hjemsted, «en av prestene i Anatot i Benjamins land». Mennene der sto ham etter livet og sa at han ikke skulle profetere i Herrens navn. Under den babylonske beleiringen av Jerusalem, mens han var innestengt i vaktgården, kjøpte Jeremia marken til sin fetter Hanamel i Anatot ved innløsningsretten, som et tegn på at «Ennu en gang skal det kjøpes hus og marker og vingårder i dette land». Da han forsøkte å forlate byen for å dra til Benjamins land, ble han grepet som overløper; Josefus sier at han var på vei til Anatot."
    - "Etter eksilet vendte 128 menn fra Anatot tilbake fra Babylon, og i Nehemjas dager var byen igjen bebodd av benjaminitter. På 300-tallet kjente Eusebius fortsatt Anatot nær Jerusalem som Jeremias hjemsted. Keramikk fra jernalderen og fra hellenistisk tid er funnet ved 'Anata, og levninger av en bysantinsk kirke viser at landsbyen var bebodd i senantikken."
  tl:
    - "Ang Anathoth ay bayan ng Benjamin mga 4 km sa hilagang-silangan ng Jerusalem. Nabubuhay ang pangalan nito sa nayong Arabe ng 'Anata; inilalagay ito ni Josefo nang dalawampung stadia mula sa Jerusalem at ni Eusebio sa ikatlong milyahe. Pinagtatalunan kung ang sinaunang bayan ay nasa ilalim ng nayon o sa kalapit na burol ng Ras el-Kharrubeh, kung saan ginawa ang mga pagsubok na hukay noong 1936. Maaaring ipaalala ng pangalan ang diyosang Cananeo na si Anat."
    - "Inililista ni Josue ang Anathoth sa mga lungsod na ibinigay sa mga anak ni Aaron, ang mga saserdote. Dalawa sa mga makapangyarihang lalaki ni David, sina Abiezer at Jehu, ay taga-rito. Kumampi si Abiathar na saserdote kay Adonia, at si Salomon, sa halip na patayin siya, ay pinauwi siya sa kaniyang mga bukid sa Anathoth. Sa larawan ni Isaias ng kaaway na nagmamartsa mula sa hilaga laban sa Jerusalem, ang “kaawaawang Anathoth” ay isa sa mga lugar sa daan."
    - "Pinakakilala ang Anathoth bilang tahanan ni Jeremias, “isa sa mga saserdote na nasa Anathoth sa lupain ng Benjamin”. Hinangad ng mga taga-roon ang kaniyang buhay at sinabihan siyang huwag manghula sa pangalan ng Panginoon. Sa pagkubkob ng Babilonia sa Jerusalem, habang nakakulong siya sa looban ng bantayan, binili ni Jeremias ang bukid ng kaniyang pinsang si Hanamel sa Anathoth ayon sa karapatan ng pagtubos, bilang tanda na “Mga bahay, at mga parang, at mga ubasan ay mangabibili pa uli sa lupaing ito”. Nang tangka niyang lumabas ng lungsod patungong lupain ng Benjamin, dinakip siya bilang tumalikod; sinasabi ni Josefo na patungo siya sa Anathoth."
    - "Pagkatapos ng pagkabihag, 128 lalaki ng Anathoth ang bumalik mula sa Babilonia, at sa mga araw ni Nehemias ay muling tinirhan ng mga Benjamita ang bayan. Noong ika-4 na siglo, kilala pa ni Eusebio ang Anathoth malapit sa Jerusalem bilang tahanan ni Jeremias. May natagpuan sa 'Anata na mga palayok ng Panahon ng Bakal at panahong Helenistiko, at ipinapakita ng mga labi ng isang simbahang Bisantino na tinirhan ang nayon noong huling sinaunang panahon."
  da:
    - "Anatot var en by i Benjamin omkring 4 km nordøst for Jerusalem. Dens navn lever videre i den arabiske landsby 'Anata; Josefus placerer den tyve stadier fra Jerusalem og Eusebios ved den tredje milepæl. Om den antikke by lå under landsbyen eller på den nærliggende høj Ras el-Kharrubeh, hvor der blev foretaget prøvegravninger i 1936, er omstridt. Navnet kan minde om den kana'anæiske gudinde Anat."
    - "Josva opregner Anatot blandt de byer, der blev givet til Arons sønner, præsterne. To af Davids helte, Abiezer og Jehu, kom herfra. Præsten Abjatar havde holdt med Adonija, og Salomo sendte ham, i stedet for at dræbe ham, hjem til hans marker i Anatot. I Esajas' billede af en fjende, der rykker mod Jerusalem fra nord, er »ulykkeligt er Anathoth« en af stederne på vejen."
    - "Anatot er bedst kendt som Jeremias' hjemby, »en af Præsterne, som vare i Anathoth, i Benjamins Land«. Dens mænd stræbte ham efter livet og sagde, at han ikke skulle profetere i Herrens navn. Under den babyloniske belejring af Jerusalem, mens han var indelukket i fængslets forgård, købte Jeremias sin fætter Hanamels mark i Anatot med indløsningsret, som tegn på, at »Endnu skal der købes Huse og Agre og Vingaarde i dette Land«. Da han forsøgte at forlade byen for at gå til Benjamins land, blev han grebet som overløber; Josefus siger, at han var på vej til Anatot."
    - "Efter eksilet vendte 128 mænd fra Anatot tilbage fra Babylon, og i Nehemias' dage var byen igen beboet af benjaminitter. I 300-tallet kendte Eusebios stadig Anatot nær Jerusalem som Jeremias' hjemby. Keramik fra jernalderen og den hellenistiske tid er fundet ved 'Anata, og levn af en byzantinsk kirke viser, at landsbyen var beboet i sen oldtid."
  sr:
    - "Анатот је био град Венијаминов око 4 км североисточно од Јерусалима. Његово име живи у арапском селу Аната; Јосиф Флавије га смешта двадесет стадија од Јерусалима, а Јевсевије код трећег миљоказа. Да ли је стари град лежао испод села или на оближњем брегу Рас ел-Харуба, где су 1936. вршена пробна сондирања, спорно је. Име може подсећати на хананејску богињу Анат."
    - "Исус Навин наводи Анатот међу градовима датим синовима Ароновим, свештеницима. Двојица Давидових јунака, Авијезер и Јуј, били су одавде. Свештеник Авијатар био је на страни Адоније, а Соломун га је, уместо да га погуби, послао кући на његове њиве у Анатоту. У Исаијиној слици непријатеља који с севера иде на Јерусалим, „јадни Анатоте!“ једно је од места на путу."
    - "Анатот је најпознатији као завичај Јеремије, „између свештеника који беху у Анатоту у земљи Венијаминовој“. Његови људи тражили су му душу и говорили му да не пророкује у име Господње. Док је Јерусалим био под вавилонском опсадом, а он затворен у трему од тамнице, Јеремија је по праву откупа купио њиву свог сродника Анамеила у Анатоту, као знак да „још ће се куповати куће и њиве и виногради у овој земљи“. Када је покушао да напусти град и оде у земљу Венијаминову, ухваћен је као бегунац; Јосиф Флавије каже да је ишао у Анатот."
    - "После изгнанства 128 људи из Анатота вратило се из Вавилона, а у Немијино доба град су поново насељавали Венијаминовци. У 4. веку Јевсевије је још знао Анатот близу Јерусалима као завичај Јеремије. У Анати је нађена керамика гвозденог и хеленистичког доба, а остаци византијске цркве показују да је село било насељено у касној антици."
  hu:
    - "Anatót Benjámin városa volt Jeruzsálemtől mintegy 4 km-re északkeletre. Neve az arab 'Anata faluban él tovább; Josephus húsz stadionra helyezi Jeruzsálemtől, Euszébiosz a harmadik mérföldkőnél. Vitatott, hogy az ókori város a falu alatt vagy a közeli Ras el-Kharrubeh dombon feküdt-e, ahol 1936-ban próbaszondázást végeztek. A név a kánaáni Anat istennőre emlékeztethet."
    - "Józsué Anatótot azon városok között sorolja fel, amelyeket Áron fiainak, a papoknak adtak. Dávid két vitéze, Abiézer és Jéhu innen származott. Abjátár pap Adónia pártján állt, és Salamon, ahelyett hogy megölette volna, hazaküldte anatóti földjeire. Ézsaiás képében, amelyben az ellenség északról vonul Jeruzsálem ellen, „szegény Anathóth” az egyik hely az út mentén."
    - "Anatót leginkább Jeremiás hazájaként ismert, aki „az Anatótban, Benjámin földén lakó papok közül vala”. Emberei életére törtek, és megmondták neki, hogy ne prófétáljon az Úr nevében. Jeruzsálem babiloni ostroma alatt, miközben a tömlöc pitvarában volt elzárva, Jeremiás megvette unokatestvére, Hanameél anatóti mezőjét a megváltás jogán, annak jeléül, hogy „még házakat, mezőket és szőlőket fognak venni e földön”. Amikor megpróbált elhagyni a várost Benjámin földje felé, szökevényként elfogták; Josephus szerint Anatótba tartott."
    - "A száműzetés után Anatót 128 embere tért vissza Babilonból, és Nehémiás napjaiban a várost ismét benjáminiták lakták. A 4. században Euszébiosz még úgy ismerte Anatótot, mint Jeremiás Jeruzsálem közelében fekvő hazáját. 'Anatán vaskori és hellenisztikus kerámiát találtak, egy bizánci templom maradványai pedig azt mutatják, hogy a falu a késő ókorban lakott volt."
  fi:
    - "Anatot oli Benjaminin kaupunki noin 4 km Jerusalemista koilliseen. Sen nimi elää arabikylässä 'Anata; Josefus sijoittaa sen kahdenkymmenen stadionin päähän Jerusalemista ja Eusebios kolmannelle mailinpylväälle. Onko muinainen kaupunki sijainnut kylän alla vai läheisellä Ras el-Kharrubeh -kukkulalla, jolla tehtiin koekaivauksia vuonna 1936, on kiistanalaista. Nimi voi muistuttaa kanaanilaisesta jumalattaresta Anatista."
    - "Joosua luettelee Anatotin Aaronin poikien, pappien, saamien kaupunkien joukossa. Kaksi Daavidin sankaria, Abieser ja Jehu, tuli täältä. Pappi Abjatar oli asettunut Adonian puolelle, ja Salomo lähetti hänet surmaamisen sijaan kotiin pelloilleen Anatotiin. Jesajan kuvassa vihollisesta, joka marssii Jerusalemia kohti pohjoisesta, ”Poloinen Anatot” on yksi tien varren paikoista."
    - "Anatot tunnetaan parhaiten Jeremian kotipaikkana, ”Anatotissa, Benjaminin maassa, asuvia pappeja”. Sen miehet tavoittelivat hänen henkeään ja käskivät hänen olla profetoimatta Herran nimessä. Babylonialaisten Jerusalemin piirityksen aikana, kun hän oli suljettuna vankilan esipihaan, Jeremia osti serkkunsa Hananeelin pellon Anatotissa lunastusoikeudella merkiksi siitä, että ”Vielä kerran ostetaan tässä maassa taloja ja peltoja ja viinitarhoja”. Kun hän yritti lähteä kaupungista Benjaminin maahan, hänet otettiin kiinni karkurina; Josefuksen mukaan hän oli matkalla Anatotiin."
    - "Pakkosiirtolaisuuden jälkeen 128 Anatotin miestä palasi Babylonista, ja Nehemian päivinä benjaminilaiset asuivat kaupungissa jälleen. 300-luvulla Eusebios tunsi yhä Anatotin Jerusalemin lähellä Jeremian kotipaikkana. 'Anatasta on löydetty rautakauden ja hellenistisen ajan keramiikkaa, ja bysanttilaisen kirkon jäännökset osoittavat kylän olleen asuttu myöhäisantiikissa."
  vi:
    - "A-na-tốt là một thành của Bên-gia-min cách Giê-ru-sa-lem khoảng 4 km về phía đông bắc. Tên của nó còn sống trong làng Ả Rập 'Anata; Josephus đặt nó cách Giê-ru-sa-lem hai mươi stadion và Eusebius đặt tại cột mốc dặm thứ ba. Thành cổ nằm dưới làng hay trên ngọn đồi gần đó Ras el-Kharrubeh, nơi các cuộc đào thăm dò được thực hiện năm 1936, thì còn tranh cãi. Tên này có thể gợi đến nữ thần Ca-na-an Anat."
    - "Giô-suê liệt kê A-na-tốt trong các thành ban cho con cháu A-rôn, tức các thầy tế lễ. Hai dõng sĩ của Đa-vít, A-bi-ê-xe và Giê-hu, đến từ đây. Thầy tế lễ A-bia-tha đã theo phe A-đô-ni-gia, và Sa-lô-môn, thay vì xử tử ông, sai ông về ruộng của mình ở A-na-tốt. Trong bức tranh của Ê-sai về quân thù từ phương bắc tiến đánh Giê-ru-sa-lem, “Thương thay cho người A-na-tốt!” là một trong những nơi trên đường."
    - "A-na-tốt nổi tiếng nhất là quê hương của Giê-rê-mi, “một trong các thầy tế lễ ở A-na-tốt, xứ Bên-gia-min”. Người trong thành tìm hại mạng ông và bảo ông đừng nói tiên tri nhân danh Đức Giê-hô-va. Trong cuộc vây hãm Giê-ru-sa-lem của người Ba-by-lôn, khi bị giam trong hành lang nhà tù, Giê-rê-mi mua ruộng của người anh em họ Ha-na-mê-ên ở A-na-tốt theo quyền chuộc lại, như dấu hiệu rằng “Người ta sẽ còn mua nhà, ruộng, và vườn nho trong đất nầy”. Khi ông toan rời thành đi đến xứ Bên-gia-min, ông bị bắt như kẻ đào ngũ; Josephus nói ông đang trên đường đến A-na-tốt."
    - "Sau cuộc lưu đày, 128 người của A-na-tốt trở về từ Ba-by-lôn, và vào thời Nê-hê-mi, thành lại có người Bên-gia-min ở. Vào thế kỷ 4, Eusebius vẫn biết A-na-tốt gần Giê-ru-sa-lem là quê hương của Giê-rê-mi. Đồ gốm thời Đồ Sắt và Hy Lạp hóa đã được tìm thấy tại 'Anata, và tàn tích một nhà thờ Byzantine cho thấy làng có người ở vào hậu kỳ cổ đại."
  ro:
    - "Anatot era o cetate a lui Beniamin, la aproximativ 4 km nord-est de Ierusalim. Numele ei trăiește în satul arab 'Anata; Josephus o pune la douăzeci de stadii de Ierusalim, iar Eusebiu la al treilea miliar. Dacă vechea cetate se afla sub sat sau pe dealul apropiat Ras el-Kharrubeh, unde au fost făcute sondaje de încercare în 1936, este disputat. Numele ar putea evoca zeița canaanită Anat."
    - "Iosua înșiră Anatotul printre cetățile date fiilor lui Aaron, preoții. Doi dintre vitejii lui David, Abiezer și Iehu, erau de aici. Preotul Abiatar fusese de partea lui Adonia, iar Solomon, în loc să-l omoare, l-a trimis acasă, la ogoarele lui din Anatot. În tabloul lui Isaia al unui dușman care înaintează spre Ierusalim dinspre nord, Anatotul, numit sărman, este unul dintre locurile de pe drum."
    - "Anatot este cunoscut mai ales ca patria lui Ieremia, fiul lui Helchia, „din preoți, care lăcuià în Anatot în pământul lui Veniamin”. Oamenii din Anatot i-au căutat sufletul și i-au spus: „nu vei prorocì în numele Domnului”. În timpul asediului babilonean al Ierusalimului, pe când era închis în curtea temniței, Ieremia a cumpărat ogorul vărului său Hanameel, de la Anatot, prin dreptul de răscumpărare, ca semn că „încă se vor mai cumpărà case și țarine și vii în pământul acesta”. Când a încercat să părăsească cetatea ca să meargă în pământul lui Beniamin, a fost prins drept dezertor; Josephus spune că se îndrepta spre Anatot."
    - "După exil, 128 de oameni din Anatot s-au întors din Babilon, iar în zilele lui Neemia cetatea a fost locuită din nou de beniamiți. În secolul al IV-lea, Eusebiu cunoștea încă Anatotul de lângă Ierusalim ca patria lui Ieremia. La 'Anata s-a găsit ceramică din epoca fierului și din epoca elenistică, iar rămășițele unei biserici bizantine arată că satul a fost locuit în Antichitatea târzie."
  bg:
    - "Анатот бил град на Вениамин на около 4 км североизточно от Йерусалим. Името му живее в арабското село Аната; Йосиф Флавий го поставя на двадесет стадия от Йерусалим, а Евсевий — при третия милеви камък. Дали древният град е лежал под селото, или на близкия хълм Рас ел-Харубе, където през 1936 г. били направени пробни сондажи, е спорно. Името може да напомня ханаанската богиня Анат."
    - "Иисус Навин изброява Анатот сред градовете, дадени на синовете на Аарон, свещениците. Двама от силните мъже на Давид, Авиезер и Йеху, идвали оттук. Свещеник Авиатар бил застанал на страната на Адония и Соломон, вместо да го умъртви, го пратил у дома, на нивите му в Анатот. В картината на Исаия за враг, настъпващ към Йерусалим от север, „Нищий Анатоте“ е едно от местата по пътя."
    - "Анатот е най-известен като родното място на Йеремия, „от свещениците които бяха в Анатот у Вениаминовата земя“. Мъжете му търсели живота му и му казвали да не пророкува в името на Господа. По време на вавилонската обсада на Йерусалим, докато бил затворен в двора на тъмницата, Йеремия купил нивата на братовчед си Ханамеел в Анатот по правото на откуп, като знак, че „Къщи, и ниви, и лозя ще се добият пак в таз земя“. Когато се опитал да напусне града за земята на Вениамин, бил заловен като дезертьор; Йосиф Флавий казва, че бил на път за Анатот."
    - "След изгнанието 128 мъже от Анатот се върнали от Вавилон, а в дните на Неемия градът отново бил обитаван от вениаминци. През IV в. Евсевий още знаел Анатот близо до Йерусалим като дома на Йеремия. В Аната е намерена керамика от желязната епоха и от елинистическо време, а останки от византийска църква показват, че селото е било обитавано през късната античност."
