# Overview article (ADR 0007). Mainstream facts only; the exact site of Anathoth is named as disputed, the Babylonian siege follows the usual date of 587 or 586 BC.
id: anathoth
place: ab34789
title:
  en: "Anathoth"
  ru: "Анафоф"
body:
  en:
    - "Anathoth was a town of Benjamin about 4 km north-east of Jerusalem. Its name lives on in the Arab village of 'Anata; Josephus puts it twenty furlongs from Jerusalem and Eusebius at the third milestone. Whether the ancient town lay under the village or on the nearby hill of Ras el-Kharrubeh, where trial soundings were made in 1936, is disputed. The name may recall the Canaanite goddess Anat."
    - 'Joshua lists Anathoth among the cities given to the sons of Aaron, the priests. Two of David''s mighty men, Abiezer and Jehu, came from here. Abiathar the priest had sided with Adonijah, and Solomon, instead of putting him to death, sent him home to his fields at Anathoth. In Isaiah''s picture of an enemy marching on Jerusalem from the north, "poor Anathoth" is one of the places on the way.'
    - 'Anathoth is best known as the home of Jeremiah, "of the priests that were in Anathoth in the land of Benjamin". Its men sought his life and told him not to prophesy in the name of the LORD. During the Babylonian siege of Jerusalem, while he was shut up in the court of the prison, Jeremiah bought the field of his cousin Hanameel at Anathoth by the right of redemption, as a sign that "Houses and fields and vineyards shall be possessed again in this land". When he tried to leave the city for the land of Benjamin, he was seized as a deserter; Josephus says he was on his way to Anathoth.'
    - "After the exile 128 men of Anathoth came back from Babylon, and in Nehemiah's day the town was again lived in by Benjamites. In the fourth century Eusebius still knew Anathoth near Jerusalem as the home of Jeremiah. Pottery of the Iron Age and of Hellenistic times has been found at 'Anata, and remains of a Byzantine church show that the village was lived in during late antiquity."
  ru:
    - "Анафоф — город Вениаминов примерно в 4 км к северо-востоку от Иерусалима. Его имя сохранилось в арабской деревне Аната; Иосиф Флавий помещает его в двадцати стадиях от Иерусалима, а Евсевий — у третьего милевого камня. Лежал ли древний город под деревней или на соседнем холме Рас-эль-Харруба, где в 1936 г. сделали пробные раскопы, — вопрос спорный. Возможно, название связано с ханаанской богиней Анат."
    - "Книга Иисуса Навина называет Анафоф среди городов, отданных священникам, сынам Аарона. Отсюда были два из храбрых Давида — Евиезер и Иегу. Священник Авиафар поддержал Адонию, и Соломон, вместо того чтобы казнить его, отослал его на его поле в Анафоф. В картине Исаии, где враг идёт на Иерусалим с севера, «бедный Анафоф» — одно из мест на его пути."
    - "Больше всего Анафоф известен как родина Иеремии, «из священников в Анафофе, в земле Вениаминовой». Его жители искали души пророка и запрещали ему пророчествовать во имя Господа. Во время вавилонской осады Иерусалима, когда Иеремия был заключён во дворе стражи, он купил поле своего двоюродного брата Анамеила в Анафофе по праву выкупа — в знак того, что «домы и поля и виноградники будут снова покупаемы в земле сей». Когда он хотел уйти из города в землю Вениаминову, его задержали как перебежчика; Иосиф Флавий пишет, что он шёл в Анафоф."
    - "После плена в Анафоф вернулись из Вавилона сто двадцать восемь человек, а во дни Неемии в нём снова жили вениамитяне. В IV веке Евсевий всё ещё знал Анафоф близ Иерусалима как родину Иеремии. В Анате найдена керамика железного века и эллинистического времени, а остатки византийской церкви показывают, что в поздней античности деревня была обитаема."
