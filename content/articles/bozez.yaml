body:
  en:
    - "Bozez was one of two crags at the pass of Michmash, where Jonathan and his armourbearer climbed up to the Philistine outpost: “there was a sharp rock on the one side, and a sharp rock on the other side: and the name of the one was Bozez, and the name of the other Seneh. The forefront of the one was situate northward over against Michmash, and the other southward over against Gibeah.” The pass is the deep gorge of Wadi es-Suweinit, between Mukhmas and Jaba north-east of Jerusalem, and Bozez is the crag on the Michmash side; the names are not used elsewhere."
    - "The pass was fought over again in February 1918. Major Vivian Gilbert, who served in the British army in Palestine, later told how a brigade major, on the eve of a frontal attack on the Turkish position at Mukhmas, remembered the name from the Bible and read the story of Jonathan by candlelight; he woke the brigadier, whose scouts found the pass between two crags thinly held. A single company went up it by night, and at dawn the Turks, thinking themselves surrounded, fled. The story is known from Gilbert's account, published in 1923."
  ru:
    - "Боцец — одна из двух скал у перехода Михмасского, где Ионафан со своим оруженосцем поднялся к филистимскому отряду: «была острая скала с одной стороны и острая скала с другой: имя одной Боцец, а имя другой Сене; одна скала выдавалась с севера к Михмасу, другая с юга к Гиве». Переход — это глубокое ущелье вади эс-Сувейнит между Мухмасом и Джабой к северо-востоку от Иерусалима, а Боцец — скала со стороны Михмаса; больше эти имена нигде не встречаются."
    - "За переход снова сражались в феврале 1918 г. Майор Вивиан Гилберт, служивший в британской армии в Палестине, рассказал позднее, как один бригадный майор накануне лобовой атаки на турецкую позицию у Мухмаса вспомнил это имя по Библии и прочёл при свече историю Ионафана; он разбудил командира бригады, и разведчики нашли проход между двумя скалами слабо охраняемым. Ночью по нему поднялась одна рота, и на рассвете турки, решив, что окружены, бежали. Эта история известна по рассказу Гилберта, изданному в 1923 г."
  uk:
    - "Боцец був однією з двох скель біля міхмаського проходу, куди Йонатан із зброєносцем піднявся до филистимської застави: «по сїм і по тім боцї гострі скелї: Одну звали Бозез, другу Сене» і далі: «Одна скеля стриміла на північньому боцї, навпроти Михмаса, друга на полуденньому боцї, навпроти Гиви». Прохід — це глибока ущелина Вади-ес-Сувейніт, між Мухмасом і Джабою на північний схід від Єрусалима, а Боцец — скеля з міхмаського боку; ці назви більше ніде не вживаються."
    - "За прохід билися знову в лютому 1918 р. Майор Вівіан Гілберт, який служив у британській армії в Палестині, пізніше розповів, як бригадний майор напередодні лобової атаки на турецьку позицію в Мухмасі згадав цю назву з Біблії й при свічці прочитав історію Йонатана; він розбудив бригадира, чиї розвідники знайшли прохід між двома скелями слабо обороненим. Одна рота піднялася ним уночі, і на світанку турки, вважаючи себе оточеними, втекли. Цю історію знано з розповіді Гілберта, виданої 1923 р."
  es:
    - "Boces era uno de los dos peñascos del paso de Micmas, por donde Jonatán y su escudero subieron hasta el puesto avanzado filisteo: «un peñasco agudo de la una parte, y otro de la otra parte; el uno se llamaba Boses y el otro Sene: El un peñasco situado al norte hacia Michmas, y el otro al mediodía hacia Gabaa». El paso es la honda garganta del Wadi es-Suweinit, entre Mukhmas y Jaba, al nordeste de Jerusalén, y Boces es el peñasco del lado de Micmas; los nombres no se usan en ningún otro lugar."
    - "El paso volvió a disputarse en febrero de 1918. El mayor Vivian Gilbert, que sirvió en el ejército británico en Palestina, contó después cómo un mayor de brigada, en vísperas de un ataque frontal contra la posición turca de Mukhmas, recordó el nombre de la Biblia y leyó a la luz de una vela la historia de Jonatán; despertó al brigadier, cuyos exploradores hallaron el paso entre dos peñascos débilmente guarnecido. Una sola compañía subió por él de noche, y al amanecer los turcos, creyéndose rodeados, huyeron. La historia se conoce por el relato de Gilbert, publicado en 1923."
  pt:
    - "Bozez era um dos dois penhascos na passagem de Micmás, por onde Jônatas e seu escudeiro subiram até o posto avançado filisteu: “Em cada um dos lados do desfiladeiro pelo qual Jônatas procurava chegar ao destacamento dos filisteus havia um penhasco íngreme; o nome de um era Bozez, e o nome do outro era Sené. Um penhasco se erguia ao norte, de frente para Micmás, e o outro ao sul, de frente para Geba.” A passagem é o profundo desfiladeiro do uádi es-Suweinit, entre Mukhmas e Jaba, a nordeste de Jerusalém, e Bozez é o penhasco do lado de Micmás; os nomes não são usados em nenhum outro lugar."
    - "A passagem foi disputada de novo em fevereiro de 1918. O major Vivian Gilbert, que serviu no exército britânico na Palestina, contou mais tarde como um major de brigada, na véspera de um ataque frontal à posição turca em Mukhmas, lembrou-se do nome pela Bíblia e leu a história de Jônatas à luz de vela; ele acordou o brigadeiro, cujos batedores acharam a passagem entre dois penhascos fracamente guarnecida. Uma única companhia subiu por ela à noite e, ao amanhecer, os turcos, julgando-se cercados, fugiram. A história é conhecida pelo relato de Gilbert, publicado em 1923."
  de:
    - "Bozez war einer von zwei Felsen am Pass von Michmas, wo Jonatan und sein Waffenträger zum Vorposten der Philister hinaufstiegen: „zwei spitze Felsen, einer diesseits, der andere jenseits; der eine hieß Bozez, der andere Sene. Und einer sah von Mitternacht gegen Michmas und der andere von Mittag gegen Geba.“ Der Pass ist die tiefe Schlucht des Wadi es-Suweinit zwischen Muchmas und Dscheba nordöstlich von Jerusalem, und Bozez ist der Felsen auf der Seite von Michmas; die Namen werden sonst nicht gebraucht."
    - "Um den Pass wurde im Februar 1918 erneut gekämpft. Major Vivian Gilbert, der in der britischen Armee in Palästina diente, erzählte später, wie sich ein Brigademajor am Vorabend eines Frontalangriffs auf die türkische Stellung bei Muchmas an den Namen aus der Bibel erinnerte und bei Kerzenlicht die Geschichte Jonatans las; er weckte den Brigadegeneral, dessen Späher den Pass zwischen zwei Felsen schwach besetzt fanden. Eine einzelne Kompanie stieg nachts hinauf, und im Morgengrauen flohen die Türken, die sich umzingelt glaubten. Die Geschichte ist aus Gilberts 1923 veröffentlichtem Bericht bekannt."
  fr:
    - "Botsets (Bozez dans la version du roi Jacques) était l’une des deux dents rocheuses du passage de Micmasch, par où Jonathan et son écuyer montèrent jusqu’au poste philistin : « il y avait une dent de rocher d’un côté et une dent de rocher de l’autre côté, l’une portant le nom de Botsets et l’autre celui de Séné. L’une de ces dents est au nord vis-à-vis de Micmasch, et l’autre au midi vis-à-vis de Guéba. » Le passage est la profonde gorge de l’ouadi es-Suweinit, entre Mukhmas et Jaba, au nord-est de Jérusalem, et Botsets est la dent du côté de Micmasch ; les noms ne sont pas employés ailleurs. Guéba est Gibeah dans la version du roi Jacques."
    - "Le passage fut de nouveau disputé en février 1918. Le major Vivian Gilbert, qui servit dans l’armée britannique en Palestine, raconta plus tard comment un major de brigade, à la veille d’une attaque frontale contre la position turque de Mukhmas, se souvint du nom par la Bible et lut à la bougie l’histoire de Jonathan ; il réveilla le brigadier, dont les éclaireurs trouvèrent le passage entre deux dents faiblement tenu. Une seule compagnie y monta de nuit, et à l’aube les Turcs, se croyant encerclés, s’enfuirent. L’histoire est connue par le récit de Gilbert, publié en 1923."
  it:
    - "Boses era una delle due rupi al passo di Micmas, dove Gionata e il suo scudiero salirono verso l’avamposto filisteo: «c’era una punta di rupe da una parte e una punta di rupe dall’altra parte: una si chiamava Botsets, e l’altra Seneh. Una di queste punte sorgeva al nord, dirimpetto a Micmas, e l’altra a mezzogiorno, dirimpetto a Ghibea». Il passo è la profonda gola del Wadi es-Suweinit, tra Mukhmas e Jaba a nord-est di Gerusalemme, e Boses è la rupe sul lato di Micmas; i nomi non ricorrono altrove."
    - "Il passo fu conteso di nuovo nel febbraio 1918. Il maggiore Vivian Gilbert, che prestò servizio nell’esercito britannico in Palestina, raccontò poi come un maggiore di brigata, alla vigilia di un attacco frontale alla posizione turca a Mukhmas, ricordò il nome dalla Bibbia e lesse la storia di Gionata alla luce di una candela; svegliò il brigadiere, i cui esploratori trovarono il passo tra due rupi debolmente presidiato. Una sola compagnia lo risalì di notte, e all’alba i Turchi, credendosi circondati, fuggirono. La storia è nota dal racconto di Gilbert, pubblicato nel 1923."
  nl:
    - "Bozez was een van twee rotsklippen bij de pas van Michmas, waar Jonatan en zijn wapendrager naar de Filistijnse voorpost klommen: “een scherpte van een steenklip aan deze zijde, en een scherpte van een steenklip aan gene zijde; en de naam der ene was Bozes, en de naam der andere Sene. De ene tand was gelegen tegen het noorden, tegenover Michmas, en de andere tegen het zuiden, tegenover Geba.” De pas is de diepe kloof van de Wadi es-Suweinit, tussen Mukhmas en Jaba ten noordoosten van Jeruzalem, en Bozez is de klip aan de kant van Michmas; de namen worden elders niet gebruikt."
    - "Om de pas werd in februari 1918 opnieuw gevochten. Majoor Vivian Gilbert, die in het Britse leger in Palestina diende, vertelde later hoe een brigademajoor, op de vooravond van een frontale aanval op de Turkse stelling bij Mukhmas, de naam uit de Bijbel herinnerde en bij kaarslicht het verhaal van Jonatan las; hij wekte de brigadegeneraal, wiens verkenners de pas tussen twee klippen zwak bezet vonden. Eén compagnie ging er 's nachts door omhoog, en bij het ochtendgloren sloegen de Turken, die zich omsingeld waanden, op de vlucht. Het verhaal is bekend uit Gilberts verslag, uitgegeven in 1923."
  pl:
    - "Boses była jedną z dwóch skał w przesmyku Mikmas, którymi Jonatan i jego giermek wspięli się do filistyńskiej strażnicy: „była skała ostra po jednej stronie, także skała ostra po drugiej stronie; jednej imię Boses a drugiej Sene. Skała jedna była na północy przeciwko Machmas, a druga na południe przeciwko Gabaa”. Przesmyk to głęboki wąwóz Wadi as-Suwajnit między Muchmas a Dżaba na północny wschód od Jerozolimy, a Boses to skała po stronie Mikmas; nazwy nie są używane nigdzie indziej."
    - "O przesmyk walczono znowu w lutym 1918 roku. Major Vivian Gilbert, który służył w armii brytyjskiej w Palestynie, opowiedział później, jak major brygady w przeddzień frontalnego ataku na pozycję turecką w Muchmas przypomniał sobie tę nazwę z Biblii i czytał przy świecy opowieść o Jonatanie; obudził brygadiera, a jego zwiadowcy znaleźli przesmyk między dwiema skałami słabo obsadzony. Jedna kompania weszła nim nocą, a o świcie Turcy, sądząc, że są otoczeni, uciekli. Historia jest znana z relacji Gilberta opublikowanej w 1923 roku."
  cs:
    - "Bocec byl jedním ze dvou útesů v průsmyku u Michmasu, kde Jonatan a jeho zbrojnoš vylezli k pelištejské stráži: „byla skála příkrá k přecházení s této strany, též skála příkrá k přecházení s oné strany; jméno jedné Bóses, a jméno druhé Seneh. Jedna skála byla na půlnoci proti Michmas, a druhá na poledne proti Gabaa.“ Průsmykem je hluboká soutěska Wádí as-Suvajnit mezi Muchmasem a Džabou severovýchodně od Jeruzaléma a Bocec je útes na straně Michmasu; jména se jinde nepoužívají."
    - "O průsmyk se bojovalo znovu v únoru 1918. Major Vivian Gilbert, který sloužil v britské armádě v Palestině, později vyprávěl, jak si brigádní major v předvečer čelního útoku na turecké postavení u Muchmasu vzpomněl na jméno z Bible a při svíčce četl příběh o Jonatanovi; vzbudil brigádního generála, jehož zvědové shledali průsmyk mezi dvěma útesy slabě obsazený. Jedna rota jím v noci vystoupila a za svítání Turci, domnívajíce se, že jsou obklíčeni, uprchli. Příběh je znám z Gilbertova vyprávění, vydaného roku 1923."
  sv:
    - "Boses var en av två klippor vid passet vid Mikmas, där Jonatan och hans vapenbärare klättrade upp till filistéernas utpost: ”i passet, där Jonatan sökte gå över för att komma till filistéernas utpost, låg på vardera sidan en brant klippa; den ena hette Boses och den andra Sene. Den ena klippan reste sig i norr, mitt emot Mikmas, den andra i söder, mitt emot Geba.” Passet är den djupa klyftan Wadi es-Suweinit, mellan Mukhmas och Jaba nordost om Jerusalem, och Boses är klippan på Mikmassidan; namnen används inte på något annat ställe."
    - "Passet var skådeplats för strid på nytt i februari 1918. Major Vivian Gilbert, som tjänstgjorde i den brittiska armén i Palestina, berättade senare hur en brigadmajor, kvällen före en frontalattack mot den turkiska ställningen vid Mukhmas, mindes namnet från Bibeln och läste berättelsen om Jonatan vid levande ljus; han väckte brigadgeneralen, vars spanare fann passet mellan två klippor svagt bemannat. Ett enda kompani gick upp genom det under natten, och i gryningen flydde turkarna, som trodde sig vara omringade. Berättelsen är känd genom Gilberts redogörelse, utgiven 1923."
  nb:
    - "Boses var en av to klipper ved passet ved Mikmas, der Jonatan og hans våpenbærer klatret opp til filistrenes forpost: «Mellem skarene som Jonatan søkte å komme frem igjennem for å nå til filistrenes forpost, var det en bratt klippe på hver side; den ene hette Boses og den andre Sene. Den ene klippe reiser sig bratt i nord midt imot Mikmas, den andre i syd midt imot Geba.» Passet er den dype kløften Wadi es-Suweinit, mellom Mukhmas og Jaba nordøst for Jerusalem, og Boses er klippen på Mikmas-siden; navnene brukes ikke andre steder."
    - "Passet ble kjempet om på ny i februar 1918. Major Vivian Gilbert, som tjenestegjorde i den britiske hæren i Palestina, fortalte senere hvordan en brigademajor, kvelden før et frontalangrep på den tyrkiske stillingen ved Mukhmas, kom på navnet fra Bibelen og leste fortellingen om Jonatan ved levende lys; han vekket brigadesjefen, hvis speidere fant passet mellom to klipper svakt besatt. Ett kompani gikk opp det om natten, og ved daggry flyktet tyrkerne, som trodde seg omringet. Fortellingen er kjent fra Gilberts beretning, utgitt i 1923."
