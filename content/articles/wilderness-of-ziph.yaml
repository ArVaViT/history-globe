# Overview article (ADR 0007). Mainstream facts only; written for the wilderness, the town of Ziph having its own article; the places within it are located by name only and are said so.
id: wilderness-of-ziph
place: a50057d
title:
  en: "Wilderness of Ziph"
  ru: "Пустыня Зиф"
  uk: "Пустеля Зіф"
  es: "Desierto de Zif"
  pt: "Deserto de Zife"
  de: "Wüste Sif"
  fr: "Désert de Ziph"
body:
  en:
    - "The wilderness of Ziph is the stretch of the Judean desert that falls away east and south-east of Ziph, the town on the ridge about 6 km south-east of Hebron where the farmed hills end. Beyond it the bare limestone slopes, cut by dry wadis, drop toward the Dead Sea; the Bible calls that whole waste Jeshimon. Winter rain gives it a short spring of grass for flocks, and its caves and ridges have sheltered fugitives in every age. The story names places within it that are known only from the story: the hill of Hachilah, which “is on the south of Jeshimon”, and Horesh, which the King James Bible translates as “a wood” and which is usually taken for a place, perhaps Khirbet Khoreisa a few kilometres south of Ziph. None has been dug."
    - "Here David hid from Saul after leaving Keilah. “David abode in the wilderness in strong holds, and remained in a mountain in the wilderness of Ziph. And Saul sought him every day, but God delivered him not into his hand.” At Horesh Jonathan came to him for the last time, told him “thou shalt be king over Israel, and I shall be next unto thee”, and the two made a covenant."
    - "Then the Ziphites went up to Saul at Gibeah and offered to betray David's hiding places, and the chase ran on into the wilderness of Maon until a Philistine raid called Saul away. Later the Ziphites informed again, and “Saul arose, and went down to the wilderness of Ziph, having three thousand chosen men of Israel with him, to seek David in the wilderness of Ziph”; he camped on the hill of Hachilah, and David crept into the camp by night and took the spear and the cruse of water from beside his head. The title of Psalm 54 remembers the Ziphites' betrayal."
    - "The wilderness is today the eastern edge of the south Hebron hills in the West Bank, between the town of Yatta and the Dead Sea, still grazed by flocks and still mostly empty."
  ru:
    - "Пустыня Зиф — часть Иудейской пустыни, спадающая на восток и юго-восток от Зифа, города на гребне примерно в 6 км к юго-востоку от Хеврона, где кончаются возделанные холмы. Дальше голые известняковые склоны, изрезанные сухими руслами, спускаются к Мёртвому морю; всю эту пустошь Библия зовёт Иесимоном. Зимний дождь даёт ей короткую весеннюю траву для стад, а её пещеры и гряды во все века укрывали беглецов. Рассказ называет в ней места, известные только из рассказа: холм Гахила, «что направо от Иесимона», и Хореш, который Синодальный перевод передаёт как «лес» и который обычно считают названием места, быть может Хирбет-Хурейса в нескольких километрах к югу от Зифа. Ни одно из них не раскопано."
    - "Здесь Давид скрывался от Саула, уйдя из Кеилы. «Давид же пребывал в пустыне в неприступных местах и потом на горе в пустыне Зиф. Саул искал его всякий день; но Бог не предал Давида в руки его». В Хореше Ионафан пришёл к нему в последний раз, сказал ему: «ты будешь царствовать над Израилем, а я буду вторым по тебе», и они заключили завет."
    - "Потом зифеи пошли к Саулу в Гиву и предложили выдать убежища Давида, и погоня ушла в пустыню Маон, пока набег филистимлян не отозвал Саула. Позже зифеи донесли снова, и «встал Саул и спустился в пустыню Зиф, и с ним три тысячи отборных мужей Израильских, чтоб искать Давида в пустыне Зиф»; он стал станом на холме Гахила, а Давид ночью прокрался в стан и унёс копьё и сосуд с водой от его изголовья. Надписание 53-го псалма помнит предательство зифеев."
    - "Сегодня эта пустыня — восточная кромка южных Хевронских гор на Западном берегу, между городом Ятта и Мёртвым морем; по ней всё так же пасут стада, и она всё так же почти пуста."
  uk:
    - "Пустеля Зіф — смуга Юдейської пустелі, що спадає на схід і південний схід від Зіфа, міста на гряді приблизно за 6 км на південний схід від Хеврона, де закінчуються оброблювані пагорби. За ним голі вапнякові схили, прорізані сухими вадами, спускаються до Мертвого моря; Біблія називає всю цю пустку Єшимоном. Зимовий дощ дарує їй коротку весну трави для отар, а її печери та гряди в усі віки давали притулок утікачам. Розповідь називає в ній місця, відомі лише з неї: пагорб Гахіла, що «направо від Есимону», і Хореш, який Біблія короля Якова перекладає як «ліс» і який зазвичай беруть за місце, можливо, Хірбет-Хорейса за кілька кілометрів на південь від Зіфа. Жодне не розкопане."
    - "Тут Давид ховався від Саула після Кеїли. «Давид же державсь у пустинї на неприступних місцях, а опісля по горах у пустинї Зиф, а Саул, знай, шукав його, та Бог не подав його на поталу йому». У Хореші Йонатан прийшов до нього востаннє, сказав йому: «ти будеш царем над Ізраїлем, а я буду другим по тобі», і вони склали умову."
    - "Потім зифіяни пішли до Саула в Гіву й запропонували зрадити сховки Давида, і переслідування дійшло до пустелі Маон, доки филистимський набіг не відкликав Саула. Пізніше зифіяни донесли знову, і «зладивсь Саул із трьома тисячами чоловіка вибраних з Ізраїля у Зуф-пустиню, шукати Давида в пустинї Зуф»; він таборував на пагорбі Гахіла, і Давид вкрався в табір уночі й узяв спис і посудину з водою від його голови. Напис Псалма 54 пам’ятає зраду зифіян."
    - "Пустеля нині — східний край південних пагорбів Хеврона на Західному березі, між містом Ятта і Мертвим морем, досі випасана отарами й досі здебільшого порожня."
  es:
    - "El desierto de Zif es el tramo del desierto de Judea que desciende al este y sureste de Zif, la ciudad de la cresta a unos 6 km al sureste de Hebrón donde terminan las colinas cultivadas. Más allá, las laderas calizas desnudas, cortadas por wadis secos, caen hacia el mar Muerto; la Biblia llama Jesimón a todo ese yermo. La lluvia invernal le da una breve primavera de hierba para los rebaños, y sus cuevas y crestas han dado cobijo a fugitivos en todas las épocas. El relato nombra lugares dentro de él que solo se conocen por el relato: la colina de Haquila, que está «á la mano derecha del desierto», y Horés, que la versión King James traduce como «a wood» (un bosque) y que suele tomarse por un lugar, quizá Khirbet Khoreisa, a unos kilómetros al sur de Zif. Ninguno ha sido excavado."
    - "Aquí se ocultó David de Saúl tras dejar Keila. «Y David se estaba en el desierto en peñas, y habitaba en un monte en el desierto de Ziph; y buscábalo Saúl todos los días, mas Dios no lo entregó en sus manos». En Horés, Jonatán vino a él por última vez, le dijo «tú reinarás sobre Israel, y yo seré segundo después de ti», y los dos hicieron alianza."
    - "Luego los zifeos subieron a Saúl en Gabaa y se ofrecieron a delatar los escondites de David, y la persecución siguió hasta el desierto de Maón, hasta que una incursión filistea apartó a Saúl. Más tarde los zifeos informaron de nuevo, y «Saúl entonces se levantó, y descendió al desierto de Ziph, llevando consigo tres mil hombres escogidos de Israel, para buscar á David en el desierto de Ziph»; acampó en la colina de Haquila, y David entró en el campamento de noche y tomó la lanza y la botija de agua de junto a su cabecera. El título del Salmo 54 recuerda la traición de los zifeos."
    - "El desierto es hoy el borde oriental de las colinas del sur de Hebrón, en Cisjordania, entre la ciudad de Yatta y el mar Muerto, aún pastoreado por rebaños y aún mayormente vacío."
  pt:
    - "O deserto de Zife é o trecho do deserto de Judá que desce a leste e sudeste de Zife, a cidade na serra a cerca de 6 km a sudeste de Hebrom, onde terminam as colinas cultivadas. Além dela, as encostas nuas de calcário, cortadas por uádis secos, descem para o Mar Morto; a Bíblia chama todo esse ermo de Jesimom. A chuva de inverno lhe dá uma curta primavera de pasto para os rebanhos, e suas cavernas e serras abrigaram fugitivos em todas as eras. A história nomeia nele lugares conhecidos só por ela: a colina de Haquilá, que “fica ao sul do deserto”, e Horesa, que a versão King James traduz como “um bosque” e que costuma ser tomada por um lugar, talvez Khirbet Khoreisa, alguns quilômetros ao sul de Zife. Nenhum foi escavado."
    - "Aqui Davi se escondeu de Saul depois de deixar Queila. “Davi permaneceu no deserto, em fortalezas, e ficou na região montanhosa do deserto de Zife. Saul o procurava todos os dias, mas Deus não o entregou em suas mãos.” Em Horesa, Jônatas veio a ele pela última vez e lhe disse: “você será rei sobre Israel, e eu serei o segundo depois de você”, e os dois fizeram uma aliança."
    - "Depois os zifeus subiram a Saul em Gibeá e se ofereceram para trair os esconderijos de Davi, e a perseguição seguiu para o deserto de Maom até que uma incursão filisteia chamou Saul embora. Mais tarde os zifeus denunciaram de novo, e “Saul se levantou e desceu ao deserto de Zife, levando consigo três mil homens escolhidos de Israel, para procurar Davi no deserto de Zife”; acampou na colina de Haquilá, e Davi se esgueirou no acampamento à noite e tomou a lança e o jarro de água de junto de sua cabeça. O título do Salmo 54 recorda a traição dos zifeus."
    - "O deserto é hoje a orla oriental das colinas do sul de Hebrom, na Cisjordânia, entre a cidade de Yatta e o Mar Morto, ainda pastoreado por rebanhos e ainda quase vazio."
  de:
    - "Die Wüste Sif ist der Streifen der Judäischen Wüste, der östlich und südöstlich von Sif abfällt, der Stadt auf dem Höhenrücken etwa 6 km südöstlich von Hebron, wo das bewirtschaftete Bergland endet. Dahinter fallen die kahlen Kalksteinhänge, von trockenen Wadis zerschnitten, zum Toten Meer ab; die Bibel nennt diese ganze Einöde Jeschimon. Winterregen schenkt ihr einen kurzen Frühling mit Gras für die Herden, und ihre Höhlen und Rücken haben zu allen Zeiten Flüchtlinge geschützt. Die Geschichte nennt Orte darin, die nur aus ihr bekannt sind: den Hügel Hachila, der „zur Rechten liegt an der Wüste“, und Horesch, das die Lutherbibel als „Heide“ wiedergibt und das meist für einen Ort gehalten wird, vielleicht Khirbet Khoreisa einige Kilometer südlich von Sif. Nichts davon ist ausgegraben."
    - "Hier verbarg sich David vor Saul, nachdem er Keïla verlassen hatte. „David aber blieb in der Wüste verborgen und blieb auf dem Berge in der Wüste Siph. Saul aber suchte ihn sein Leben lang; aber Gott gab ihn nicht in seine Hände.“ In Horesch kam Jonatan zum letzten Mal zu ihm, sagte ihm: „du wirst König werden über Israel, so will ich der nächste um dich sein“, und die beiden schlossen einen Bund."
    - "Dann zogen die Sifiter zu Saul nach Gibea hinauf und boten an, Davids Verstecke zu verraten, und die Jagd lief weiter in die Wüste Maon, bis ein Philistereinfall Saul abrief. Später verrieten die Sifiter erneut, und „da machte sich Saul auf und zog herab zur Wüste Siph und mit ihm dreitausend junger Mannschaft in Israel, daß er David suchte in der Wüste Siph“; er lagerte auf dem Hügel Hachila, und David schlich bei Nacht ins Lager und nahm Spieß und Wasserbecher von Sauls Haupt. Die Überschrift von Psalm 54 erinnert an den Verrat der Sifiter."
    - "Die Wüste ist heute der Ostrand der südlichen Hebroner Berge im Westjordanland, zwischen der Stadt Jatta und dem Toten Meer, noch immer von Herden beweidet und meist leer."
  fr:
    - "Le désert de Ziph est l’étendue du désert de Judée qui descend à l’est et au sud-est de Ziph, ville de la crête à environ 6 km au sud-est d’Hébron où finissent les collines cultivées. Au-delà, les pentes calcaires nues, entaillées d’oueds à sec, tombent vers la mer Morte ; la Bible appelle tout ce désert Jeschimon. La pluie d’hiver lui donne un bref printemps d’herbe pour les troupeaux, et ses grottes et ses crêtes ont abrité des fugitifs à toutes les époques. Le récit nomme des lieux qui ne sont connus que par lui : la colline de Hakila, « qui est au midi du désert », et Horesch, que la Louis Segond traduit par « forêt » et qu’on prend d’ordinaire pour un lieu, peut-être Khirbet Khoreisa à quelques kilomètres au sud de Ziph. Aucun n’a été fouillé."
    - "Ici David se cacha de Saül après avoir quitté Keïla. « David demeura au désert, dans des lieux forts, et il resta sur la montagne du désert de Ziph. Saül le cherchait toujours, mais Dieu ne le livra pas entre ses mains. » À Horesch, Jonathan vint le voir pour la dernière fois, lui dit : « Tu régneras sur Israël, et moi je serai au second rang près de toi », et les deux firent alliance."
    - "Puis les Ziphiens montèrent auprès de Saül à Guibea et offrirent de trahir les cachettes de David, et la poursuite se prolongea dans le désert de Maon jusqu’à ce qu’un raid philistin rappelle Saül. Plus tard, les Ziphiens dénoncèrent de nouveau, et « Saül se leva et descendit au désert de Ziph, avec trois mille hommes de l’élite d’Israël, pour chercher David dans le désert de Ziph » ; il campa sur la colline de Hakila, et David se glissa de nuit dans le camp et prit la lance et la cruche d’eau au chevet de sa tête. Le titre du psaume 54 se souvient de la trahison des Ziphiens."
    - "Le désert est aujourd’hui le bord oriental des collines du sud d’Hébron, en Cisjordanie, entre la ville de Yatta et la mer Morte, encore pâturé par des troupeaux et toujours presque vide."
