body:
  en:
    - "The wilderness of Ziph is the stretch of the Judean desert that falls away east and south-east of Ziph, the town on the ridge about 6 km south-east of Hebron where the farmed hills end. Beyond it the bare limestone slopes, cut by dry wadis, drop toward the Dead Sea; the Bible calls that whole waste Jeshimon. Winter rain gives it a short spring of grass for flocks, and its caves and ridges have sheltered fugitives in every age. The story names places within it that are known only from the story: the hill of Hachilah, which “is on the south of Jeshimon”, and Horesh, which the King James Bible translates as “a wood” and which is usually taken for a place, perhaps Khirbet Khoreisa a few kilometres south of Ziph. None has been dug."
    - "Here David hid from Saul after leaving Keilah. “David abode in the wilderness in strong holds, and remained in a mountain in the wilderness of Ziph. And Saul sought him every day, but God delivered him not into his hand.” At Horesh Jonathan came to him for the last time, told him “thou shalt be king over Israel, and I shall be next unto thee”, and the two made a covenant."
    - "Then the Ziphites went up to Saul at Gibeah and offered to betray David's hiding places, and the chase ran on into the wilderness of Maon until a Philistine raid called Saul away. Later the Ziphites informed again, and “Saul arose, and went down to the wilderness of Ziph, having three thousand chosen men of Israel with him, to seek David in the wilderness of Ziph”; he camped on the hill of Hachilah, and David crept into the camp by night and took the spear and the cruse of water from beside his head. The title of Psalm 54 remembers the Ziphites' betrayal."
    - "The wilderness is today the eastern edge of the south Hebron hills in the West Bank, between the town of Yatta and the Dead Sea, still grazed by flocks and still mostly empty."
  ru:
    - "Пустыня Зиф — часть Иудейской пустыни, спадающая на восток и юго-восток от Зифа, города на гребне примерно в 6 км к юго-востоку от Хеврона, где кончаются возделанные холмы. Дальше голые известняковые склоны, изрезанные сухими руслами, спускаются к Мёртвому морю; всю эту пустошь Библия зовёт Иесимоном. Зимний дождь даёт ей короткую весеннюю траву для стад, а её пещеры и гряды во все века укрывали беглецов. Рассказ называет в ней места, известные только из рассказа: холм Гахила, «что направо от Иесимона», и Хореш, который Синодальный перевод передаёт как «лес» и который обычно считают названием места, быть может Хирбет-Хурейса в нескольких километрах к югу от Зифа. Ни одно из них не раскопано."
    - "Здесь Давид скрывался от Саула, уйдя из Кеилы. «Давид же пребывал в пустыне в неприступных местах и потом на горе в пустыне Зиф. Саул искал его всякий день; но Бог не предал Давида в руки его». В Хореше Ионафан пришёл к нему в последний раз, сказал ему: «ты будешь царствовать над Израилем, а я буду вторым по тебе», и они заключили завет."
    - "Потом зифеи пошли к Саулу в Гиву и предложили выдать убежища Давида, и погоня ушла в пустыню Маон, пока набег филистимлян не отозвал Саула. Позже зифеи донесли снова, и «встал Саул и спустился в пустыню Зиф, и с ним три тысячи отборных мужей Израильских, чтоб искать Давида в пустыне Зиф»; он стал станом на холме Гахила, а Давид ночью прокрался в стан и унёс копьё и сосуд с водой от его изголовья. Надписание 53-го псалма помнит предательство зифеев."
    - "Сегодня эта пустыня — восточная кромка южных Хевронских гор на Западном берегу, между городом Ятта и Мёртвым морем; по ней всё так же пасут стада, и она всё так же почти пуста."
  uk:
    - "Пустеля Зіф — смуга Юдейської пустелі, що спадає на схід і південний схід від Зіфа, міста на гряді приблизно за 6 км на південний схід від Хеврона, де закінчуються оброблювані пагорби. За ним голі вапнякові схили, прорізані сухими вадами, спускаються до Мертвого моря; Біблія називає всю цю пустку Єшимоном. Зимовий дощ дарує їй коротку весну трави для отар, а її печери та гряди в усі віки давали притулок утікачам. Розповідь називає в ній місця, відомі лише з неї: пагорб Гахіла, що «направо від Есимону», і Хореш, який Біблія короля Якова перекладає як «ліс» і який зазвичай беруть за місце, можливо, Хірбет-Хорейса за кілька кілометрів на південь від Зіфа. Жодне не розкопане."
    - "Тут Давид ховався від Саула після Кеїли. «Давид же державсь у пустинї на неприступних місцях, а опісля по горах у пустинї Зиф, а Саул, знай, шукав його, та Бог не подав його на поталу йому». У Хореші Йонатан прийшов до нього востаннє, сказав йому: «ти будеш царем над Ізраїлем, а я буду другим по тобі», і вони склали умову."
    - "Потім зифіяни пішли до Саула в Гіву й запропонували зрадити сховки Давида, і переслідування дійшло до пустелі Маон, доки филистимський набіг не відкликав Саула. Пізніше зифіяни донесли знову, і «зладивсь Саул із трьома тисячами чоловіка вибраних з Ізраїля у Зуф-пустиню, шукати Давида в пустинї Зуф»; він таборував на пагорбі Гахіла, і Давид вкрався в табір уночі й узяв спис і посудину з водою від його голови. Напис Псалма 54 пам’ятає зраду зифіян."
    - "Пустеля нині — східний край південних пагорбів Хеврона на Західному березі, між містом Ятта і Мертвим морем, досі випасана отарами й досі здебільшого порожня."
  es:
    - "El desierto de Zif es el tramo del desierto de Judea que desciende al este y sureste de Zif, la ciudad de la cresta a unos 6 km al sureste de Hebrón donde terminan las colinas cultivadas. Más allá, las laderas calizas desnudas, cortadas por wadis secos, caen hacia el mar Muerto; la Biblia llama Jesimón a todo ese yermo. La lluvia invernal le da una breve primavera de hierba para los rebaños, y sus cuevas y crestas han dado cobijo a fugitivos en todas las épocas. El relato nombra lugares dentro de él que solo se conocen por el relato: la colina de Haquila, que está «á la mano derecha del desierto», y Horés, que la versión King James traduce como «a wood» (un bosque) y que suele tomarse por un lugar, quizá Khirbet Khoreisa, a unos kilómetros al sur de Zif. Ninguno ha sido excavado."
    - "Aquí se ocultó David de Saúl tras dejar Keila. «Y David se estaba en el desierto en peñas, y habitaba en un monte en el desierto de Ziph; y buscábalo Saúl todos los días, mas Dios no lo entregó en sus manos». En Horés, Jonatán vino a él por última vez, le dijo «tú reinarás sobre Israel, y yo seré segundo después de ti», y los dos hicieron alianza."
    - "Luego los zifeos subieron a Saúl en Gabaa y se ofrecieron a delatar los escondites de David, y la persecución siguió hasta el desierto de Maón, hasta que una incursión filistea apartó a Saúl. Más tarde los zifeos informaron de nuevo, y «Saúl entonces se levantó, y descendió al desierto de Ziph, llevando consigo tres mil hombres escogidos de Israel, para buscar á David en el desierto de Ziph»; acampó en la colina de Haquila, y David entró en el campamento de noche y tomó la lanza y la botija de agua de junto a su cabecera. El título del Salmo 54 recuerda la traición de los zifeos."
    - "El desierto es hoy el borde oriental de las colinas del sur de Hebrón, en Cisjordania, entre la ciudad de Yatta y el mar Muerto, aún pastoreado por rebaños y aún mayormente vacío."
  pt:
    - "O deserto de Zife é o trecho do deserto de Judá que desce a leste e sudeste de Zife, a cidade na serra a cerca de 6 km a sudeste de Hebrom, onde terminam as colinas cultivadas. Além dela, as encostas nuas de calcário, cortadas por uádis secos, descem para o Mar Morto; a Bíblia chama todo esse ermo de Jesimom. A chuva de inverno lhe dá uma curta primavera de pasto para os rebanhos, e suas cavernas e serras abrigaram fugitivos em todas as eras. A história nomeia nele lugares conhecidos só por ela: a colina de Haquilá, que “fica ao sul do deserto”, e Horesa, que a versão King James traduz como “um bosque” e que costuma ser tomada por um lugar, talvez Khirbet Khoreisa, alguns quilômetros ao sul de Zife. Nenhum foi escavado."
    - "Aqui Davi se escondeu de Saul depois de deixar Queila. “Davi permaneceu no deserto, em fortalezas, e ficou na região montanhosa do deserto de Zife. Saul o procurava todos os dias, mas Deus não o entregou em suas mãos.” Em Horesa, Jônatas veio a ele pela última vez e lhe disse: “você será rei sobre Israel, e eu serei o segundo depois de você”, e os dois fizeram uma aliança."
    - "Depois os zifeus subiram a Saul em Gibeá e se ofereceram para trair os esconderijos de Davi, e a perseguição seguiu para o deserto de Maom até que uma incursão filisteia chamou Saul embora. Mais tarde os zifeus denunciaram de novo, e “Saul se levantou e desceu ao deserto de Zife, levando consigo três mil homens escolhidos de Israel, para procurar Davi no deserto de Zife”; acampou na colina de Haquilá, e Davi se esgueirou no acampamento à noite e tomou a lança e o jarro de água de junto de sua cabeça. O título do Salmo 54 recorda a traição dos zifeus."
    - "O deserto é hoje a orla oriental das colinas do sul de Hebrom, na Cisjordânia, entre a cidade de Yatta e o Mar Morto, ainda pastoreado por rebanhos e ainda quase vazio."
  de:
    - "Die Wüste Sif ist der Streifen der Judäischen Wüste, der östlich und südöstlich von Sif abfällt, der Stadt auf dem Höhenrücken etwa 6 km südöstlich von Hebron, wo das bewirtschaftete Bergland endet. Dahinter fallen die kahlen Kalksteinhänge, von trockenen Wadis zerschnitten, zum Toten Meer ab; die Bibel nennt diese ganze Einöde Jeschimon. Winterregen schenkt ihr einen kurzen Frühling mit Gras für die Herden, und ihre Höhlen und Rücken haben zu allen Zeiten Flüchtlinge geschützt. Die Geschichte nennt Orte darin, die nur aus ihr bekannt sind: den Hügel Hachila, der „zur Rechten liegt an der Wüste“, und Horesch, das die Lutherbibel als „Heide“ wiedergibt und das meist für einen Ort gehalten wird, vielleicht Khirbet Khoreisa einige Kilometer südlich von Sif. Nichts davon ist ausgegraben."
    - "Hier verbarg sich David vor Saul, nachdem er Keïla verlassen hatte. „David aber blieb in der Wüste verborgen und blieb auf dem Berge in der Wüste Siph. Saul aber suchte ihn sein Leben lang; aber Gott gab ihn nicht in seine Hände.“ In Horesch kam Jonatan zum letzten Mal zu ihm, sagte ihm: „du wirst König werden über Israel, so will ich der nächste um dich sein“, und die beiden schlossen einen Bund."
    - "Dann zogen die Sifiter zu Saul nach Gibea hinauf und boten an, Davids Verstecke zu verraten, und die Jagd lief weiter in die Wüste Maon, bis ein Philistereinfall Saul abrief. Später verrieten die Sifiter erneut, und „da machte sich Saul auf und zog herab zur Wüste Siph und mit ihm dreitausend junger Mannschaft in Israel, daß er David suchte in der Wüste Siph“; er lagerte auf dem Hügel Hachila, und David schlich bei Nacht ins Lager und nahm Spieß und Wasserbecher von Sauls Haupt. Die Überschrift von Psalm 54 erinnert an den Verrat der Sifiter."
    - "Die Wüste ist heute der Ostrand der südlichen Hebroner Berge im Westjordanland, zwischen der Stadt Jatta und dem Toten Meer, noch immer von Herden beweidet und meist leer."
  fr:
    - "Le désert de Ziph est l’étendue du désert de Judée qui descend à l’est et au sud-est de Ziph, ville de la crête à environ 6 km au sud-est d’Hébron où finissent les collines cultivées. Au-delà, les pentes calcaires nues, entaillées d’oueds à sec, tombent vers la mer Morte ; la Bible appelle tout ce désert Jeschimon. La pluie d’hiver lui donne un bref printemps d’herbe pour les troupeaux, et ses grottes et ses crêtes ont abrité des fugitifs à toutes les époques. Le récit nomme des lieux qui ne sont connus que par lui : la colline de Hakila, « qui est au midi du désert », et Horesch, que la Louis Segond traduit par « forêt » et qu’on prend d’ordinaire pour un lieu, peut-être Khirbet Khoreisa à quelques kilomètres au sud de Ziph. Aucun n’a été fouillé."
    - "Ici David se cacha de Saül après avoir quitté Keïla. « David demeura au désert, dans des lieux forts, et il resta sur la montagne du désert de Ziph. Saül le cherchait toujours, mais Dieu ne le livra pas entre ses mains. » À Horesch, Jonathan vint le voir pour la dernière fois, lui dit : « Tu régneras sur Israël, et moi je serai au second rang près de toi », et les deux firent alliance."
    - "Puis les Ziphiens montèrent auprès de Saül à Guibea et offrirent de trahir les cachettes de David, et la poursuite se prolongea dans le désert de Maon jusqu’à ce qu’un raid philistin rappelle Saül. Plus tard, les Ziphiens dénoncèrent de nouveau, et « Saül se leva et descendit au désert de Ziph, avec trois mille hommes de l’élite d’Israël, pour chercher David dans le désert de Ziph » ; il campa sur la colline de Hakila, et David se glissa de nuit dans le camp et prit la lance et la cruche d’eau au chevet de sa tête. Le titre du psaume 54 se souvient de la trahison des Ziphiens."
    - "Le désert est aujourd’hui le bord oriental des collines du sud d’Hébron, en Cisjordanie, entre la ville de Yatta et la mer Morte, encore pâturé par des troupeaux et toujours presque vide."
  pl:
    - "Pustynia Zif to pas Pustyni Judzkiej opadający na wschód i południowy wschód od Zif, miasta na grzbiecie około 6 km na południowy wschód od Hebronu, gdzie kończą się uprawiane wzgórza. Dalej nagie wapienne stoki, przecięte suchymi wadi, opadają ku Morzu Martwemu; Biblia nazywa całe to pustkowie Jeszimon. Zimowe deszcze dają mu krótką wiosnę z trawą dla stad, a jego jaskinie i grzbiety dawały schronienie zbiegom we wszystkich wiekach. Opowieść wymienia w nim miejsca znane tylko z niej: pagórek Chakila, który „jest po prawej stronie Jesymona”, i Choresz, które Biblia Króla Jakuba tłumaczy jako „las” i które bierze się zwykle za miejsce, być może Chirbet Churejsa kilka kilometrów na południe od Zif. Żadnego nie kopano."
    - "Tu Dawid ukrywał się przed Saulem po opuszczeniu Keili. „I mieszkał Dawid na puszczy w miejscach obronnych, a został na górze w puszczy Zyf. I szukał go Saul po wszystkie dni; lecz nie podał go Bóg w ręce jego.” W Choresz Jonatan przyszedł do niego po raz ostatni, powiedział mu: „a ty będziesz królował nad Izraelem, ja zaś będę wtórym po tobie”, i obaj zawarli przymierze."
    - "Potem Zifejczycy poszli do Saula do Gibei i zaoferowali zdradę kryjówek Dawida, a pościg ciągnął się na pustynię Maon, aż najazd filistyński odwołał Saula. Później Zifejczycy donieśli znowu i „Ruszył się tedy Saul, i ciągnął na puszczą Zyf, a z nim trzy tysiące mężów przebranych z Izraela, aby szukał Dawida na puszczy Zyf”; rozbił obóz na pagórku Chakila, a Dawid wkradł się do obozu nocą i zabrał włócznię i dzban wody sprzed głowy Saula. Tytuł Psalmu 54 pamięta zdradę Zifejczyków."
    - "Pustynia to dziś wschodni skraj południowych wzgórz Hebronu na Zachodnim Brzegu, między miastem Jatta a Morzem Martwym, nadal wypasana przez stada i nadal w większości pusta."
  it:
    - "Il deserto di Zif è il tratto del deserto di Giuda che scende a est e a sud-est di Zif, la città sul crinale circa 6 km a sud-est di Ebron dove finiscono le colline coltivate. Oltre di essa i pendii nudi di calcare, incisi da uadi asciutti, scendono verso il Mar Morto; la Bibbia chiama tutto quel deserto Iesimon. La pioggia invernale gli dà una breve primavera d’erba per le greggi, e le sue grotte e i suoi crinali hanno offerto rifugio a fuggiaschi in ogni epoca. Il racconto nomina luoghi al suo interno noti solo da esso: la collina di Chechilà, che «è a mezzogiorno del deserto», e Choresh, che la King James Version traduce con «a wood» e che di solito si intende come un luogo, forse Khirbet Khoreisa, pochi chilometri a sud di Zif. Nessuno è stato scavato."
    - "Qui Davide si nascose da Saul dopo aver lasciato Keila. «Davide rimase nel deserto in luoghi forti; e se ne stette nella contrada montuosa del deserto di Zif. Saul lo cercava continuamente, ma Dio non glielo dette nelle mani.» A Choresh Gionata venne da lui per l’ultima volta, gli disse: «tu regnerai sopra Israele, e io sarò il secondo dopo di te», ed essi fecero alleanza."
    - "Poi gli Zifei salirono da Saul a Gabaa e si offrirono di tradire i nascondigli di Davide, e l’inseguimento proseguì nel deserto di Maon finché un’incursione filistea richiamò Saul. In seguito gli Zifei fecero di nuovo la spia, e «Saul si levò e scese nel deserto di Zif avendo seco tremila uomini scelti d’Israele, per cercar Davide nel deserto di Zif»; si accampò sulla collina di Chechilà, e Davide si introdusse di notte nel campo e prese la lancia e la brocca dell’acqua presso il suo capo. Il titolo del Salmo 54 ricorda il tradimento degli Zifei."
    - "Il deserto è oggi il margine orientale delle colline di Ebron meridionali in Cisgiordania, fra la città di Yatta e il Mar Morto, ancora pascolato dalle greggi e ancora per lo più vuoto."
  nl:
    - "De woestijn Zif is het deel van de Judese woestijn dat naar het oosten en zuidoosten afloopt vanaf Zif, de stad op de bergrug ongeveer 6 km ten zuidoosten van Hebron waar de bebouwde heuvels eindigen. Daarachter dalen de kale kalksteenhellingen, doorsneden door droge wadi’s, naar de Dode Zee; de Bijbel noemt die hele wildernis Jesimon. De winterregen geeft haar een korte lente van gras voor de kudden, en haar grotten en bergruggen hebben in alle tijden vluchtelingen onderdak geboden. Het verhaal noemt plaatsen erin die alleen uit het verhaal bekend zijn: de heuvel Chachila, “die aan de rechterhand der wildernis is”, en Choresj, dat de King James Bible met “a wood” weergeeft en dat gewoonlijk voor een plaats wordt gehouden, misschien Khirbet Khoreisa een paar kilometer ten zuiden van Zif. Geen is opgegraven."
    - "Hier verborg David zich voor Saul nadat hij Keïla had verlaten. “David nu bleef in de woestijn in de vestingen, en hij bleef op den berg in de woestijn Zif; en Saul zocht hem alle dagen, doch God gaf hem niet over in zijn hand.” Bij Choresj kwam Jonatan voor het laatst tot hem, zei hem: “gij zult koning worden over Israël, en ik zal de tweede bij u zijn”, en de twee sloten een verbond."
    - "Daarna gingen de Zifieten op naar Saul in Gibea en boden aan Davids schuilplaatsen te verraden, en de achtervolging liep door in de woestijn Maön totdat een Filistijnse inval Saul wegriep. Later verklikten de Zifieten opnieuw, en “maakte zich Saul op, en toog af naar de woestijn Zif, en met hem drie duizend man, uitgelezenen van Israël, om David te zoeken in de woestijn Zif”; hij legerde zich op de heuvel Chachila, en David sloop ’s nachts het kamp in en nam de spies en de waterfles van zijn hoofdeinde. Het opschrift van Psalm 54 herinnert aan het verraad van de Zifieten."
    - "De woestijn is tegenwoordig de oostrand van de zuidelijke heuvels van Hebron op de Westelijke Jordaanoever, tussen de stad Yatta en de Dode Zee, nog steeds door kudden begraasd en nog steeds grotendeels leeg."
  cs:
    - "Zífská poušť je úsek Judské pouště, který se svažuje na východ a jihovýchod od Zífu, města na hřebeni asi 6 km jihovýchodně od Hebronu, kde končí obdělávané kopce. Za ním holé vápencové svahy, rozříznuté suchými vádími, klesají k Mrtvému moři; Bible nazývá celou tu pustinu Ješimon. Zimní déšť jí dává krátké jaro s trávou pro stáda a její jeskyně a hřebeny skrývaly uprchlíky v každé době. Příběh jmenuje v ní místa, jež jsou známa jen z příběhu: pahorek Chachila, který „jest na pravé straně pouště“, a Choreš, které King James Bible překládá jako „les“ a které se obvykle pokládá za místo, snad Chirbet Churejsa několik kilometrů jižně od Zífu. Žádné nebylo vykopáno."
    - "Zde se David skrýval před Saulem po odchodu z Keily. „Byl pak David na poušti v místech bezpečných, a bydlil na hoře, na poušti Zif. A ačkoli hledal ho Saul po všecky ty dny, však nevydal ho Bůh v ruku jeho.“ V Chorešu za ním Jonatan přišel naposledy, řekl mu: „ty kralovati budeš nad Izraelem, a já budu druhý po tobě“, a oba učinili smlouvu."
    - "Pak Zífští přišli k Saulovi do Gibey a nabídli, že prozradí Davidovy úkryty, a honička pokračovala do Maónské pouště, dokud pelištejský vpád Saula neodvolal. Později Zífští udávali znovu a „povstal Saul a táhl na poušť Zif, a s ním tři tisíce mužů vybraných z Izraele, aby hledal Davida na poušti Zif“; utábořil se na pahorku Chachila a David se v noci vplížil do tábora a vzal kopí a číši s vodou od jeho hlavy. Nadpis žalmu 54 připomíná zradu Zífských."
    - "Poušť je dnes východním okrajem jižních hebronských hor na Západním břehu, mezi městem Jatta a Mrtvým mořem, dosud spásaná stády a dosud většinou prázdná."
  sv:
    - "Sifs öken är den del av Judeens öken som stupar österut och sydost om Sif, staden på åsen omkring 6 km sydost om Hebron där de odlade bergen tar slut. Bortom den sluttar kala kalkstensbranter, skurna av torra wadier, mot Döda havet; Bibeln kallar hela den ödemarken Jeshimon. Vinterregnet ger den en kort vår med gräs för hjordar, och dess grottor och åsar har skyddat flyktingar i alla tider. Berättelsen nämner platser inom den som bara är kända från berättelsen: höjden Hakila, som ligger ”söder om ödemarken”, och Horesh, som King James-översättningen återger som ”a wood” och som vanligen tas för en plats, kanske Khirbet Khoreisa några kilometer söder om Sif. Ingen har grävts ut."
    - "Här gömde sig David för Saul efter att ha lämnat Keila. ”Så uppehöll sig nu David i öknen på bergfästena; han uppehöll sig bland bergen i öknen Sif. Och Saul sökte alltjämt efter honom, men Gud gav honom icke i hans hand.” Vid Horesh kom Jonatan till honom för sista gången, sade till honom ”du skall bliva konung över Israel, och jag skall då hava andra platsen, näst efter dig”, och de två slöt ett förbund."
    - "Sedan gick sifiterna upp till Saul i Giva och erbjöd sig att förråda Davids gömställen, och jakten fortsatte in i Maons öken tills ett filisteiskt plundringståg kallade bort Saul. Senare angav sifiterna honom igen, och ”Då bröt Saul upp och drog ned till öknen Sif med tre tusen män utvalda ur Israel, för att söka efter David i öknen Sif”; han slog läger på höjden Hakila, och David smög in i lägret om natten och tog spjutet och vattenkrukan från hans huvudgärd. Rubriken till Psalm 54 minns sifiternas svek."
    - "Öknen är i dag östra kanten av södra Hebronbergen på Västbanken, mellan staden Yatta och Döda havet, fortfarande betad av hjordar och fortfarande mestadels tom."
  nb:
    - "Sif-ørkenen er strekningen av Judeaørkenen som faller bort øst og sørøst for Sif, byen på ryggen omkring 6 km sørøst for Hebron der de dyrkede åsene tar slutt. Hinsides den faller de bare kalksteinsskråningene, skåret av tørre wadier, ned mot Dødehavet; Bibelen kaller hele den ødemarken Jesjimon. Vinterregnet gir den en kort vår med gress til flokkene, og hulene og ryggene har gitt flyktninger ly i alle tider. Fortellingen nevner steder i den som bare er kjent fra fortellingen: høyden Hakila, som ligger «sønnenfor ørkenen», og Horesj, som King James-oversettelsen gjengir som «en skog» og som vanligvis tas for et sted, kanskje Khirbet Khoreisa noen få kilometer sør for Sif. Ingen er utgravd."
    - "Her skjulte David seg for Saul etter å ha forlatt Keila. «Siden holdt David til i ørkenen, i fjellborgene; han holdt til i fjellene i Sifs ørken; og Saul søkte efter ham hele tiden, men Gud gav ham ikke i hans hånd.» Ved Horesj kom Jonatan til ham for siste gang og sa at «du skal bli konge over Israel, og jeg skal være den næste efter dig», og de to sluttet en pakt."
    - "Så dro sifittene opp til Saul i Gibea og tilbød seg å forråde Davids skjulesteder, og jakten fortsatte inn i Maon-ørkenen til et filistersk innfall kalte Saul bort. Senere angav sifittene på nytt, og «tok Saul ut og drog ned til Sifs ørken med tre tusen mann, som var utvalgt av hele Israel, for å søke efter David i Sifs ørken»; han slo leir på Hakila-høyden, og David krøp inn i leiren om natten og tok spydet og vannkrukken fra hodegjerdet hans. Overskriften til Salme 54 minnes sifittenes forræderi."
    - "Ørkenen er i dag østkanten av de sørlige Hebron-åsene på Vestbredden, mellom byen Yatta og Dødehavet, fortsatt beitet av flokker og fortsatt for det meste tom."
  tl:
    - "Ang ilang ng Ziph ay ang kahabaan ng disyerto ng Judea na bumababa sa silangan at timog-silangan ng Ziph, bayan sa tagaytay mga 6 km sa timog-silangan ng Hebron kung saan nagtatapos ang mga sinasakang burol. Sa kabila nito, ang hubad na dalisdis na apog, na hinihiwa ng mga tuyong wadi, ay bumababa patungo sa Dagat na Patay; tinatawag ng Biblia ang buong ilang na iyon na Jesimon. Binibigyan ito ng ulan ng taglamig ng maikling tagsibol ng damo para sa mga kawan, at kinublihan ng mga yungib at tagaytay nito ang mga takas sa bawat panahon. Pinangangalanan ng kuwento ang mga lugar sa loob nito na kilala lamang mula sa kuwento: ang burol ng Hachila, na “nasa timugan ng ilang”, at ang Hores, na isinasalin ng King James Bible na “a wood” at karaniwang itinuturing na lugar, marahil ang Khirbet Khoreisa ilang kilometro sa timog ng Ziph. Walang nahukay."
    - "Dito nagtago si David kay Saul pagkaalis sa Ceila. “Si David ay tumahan sa ilang sa mga katibayan, at nanira sa lupaing maburol sa ilang ng Ziph. At pinag-uusig siya ni Saul araw-araw, nguni't hindi siya ibinigay ng Dios sa kaniyang kamay.” Sa Hores, huling lumapit sa kaniya si Jonathan at sinabi sa kaniyang “ikaw ay magiging hari sa Israel, at ako'y magiging pangalawa mo”, at nakipagtipan ang dalawa."
    - "Pagkatapos ay umahon ang mga taga-Ziph kay Saul sa Gibea at nag-alok na ipagkanulo ang pinagkukublihan ni David, at nagpatuloy ang habulan sa ilang ng Maon hanggang tawagin si Saul ng pagsalakay ng mga Filisteo. Kalaunan, muling nagsumbong ang mga taga-Ziph, at “bumangon si Saul at lumusong sa ilang ng Ziph, na may tatlong libong piling lalake sa Israel na kasama niya upang hanapin si David sa ilang ng Ziph”; nagkampo siya sa burol ng Hachila, at pumasok si David nang gabi sa kampamento at kinuha ang sibat at ang banga ng tubig sa tabi ng kaniyang ulo. Inaalala ng pamagat ng Awit 54 ang pagkakanulo ng mga taga-Ziph."
    - "Ang ilang ay ang silangang gilid ngayon ng timugang mga burol ng Hebron sa Kanlurang Pampang, sa pagitan ng bayan ng Yatta at ng Dagat na Patay, pinagpapastulan pa rin ng mga kawan at halos walang laman."
