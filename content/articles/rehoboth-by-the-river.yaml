body:
  en:
    - "Rehoboth “by the river” was the home of Saul (Shaul), one of the kings who reigned in Edom before Israel had kings: “And Samlah died, and Saul of Rehoboth by the river reigned in his stead”, in Genesis and again in Chronicles. The name means “broad places” and is shared with the well Isaac dug near Gerar and with Rehoboth-Ir by Nineveh, which are different places. This line is all that is known of it."
    - "Which river is meant is disputed. In the Bible “the river” usually means the Euphrates, and some place the town at ar-Rahba on the Euphrates near Mayadin in Syria, which the map marks. Others keep it within Edom, by a wadi of the Arabah or the plateau: the point on the map stands at Ras Rihab north of Bozrah, with Wadi Ghuwayr and Khirbet Musrab as further candidates. None has produced evidence, and the question stays open."
  ru:
    - "Реховоф, «что при реке», — родина Саула, одного из царей, царствовавших в Едоме прежде, чем у Израиля появились цари: «И умер Самла, и воцарился по нем Саул из Реховофа, что при реке», в книге Бытия и ещё раз в Паралипоменоне. Имя значит «широкие места» и совпадает с именем колодца, выкопанного Исааком близ Герара, и Реховоф-Ира у Ниневии, но это другие места. Эта строка — всё, что о нём известно."
    - "О какой реке речь, спорят. В Библии «река» обычно означает Евфрат, и некоторые помещают город в Эр-Рахбе на Евфрате близ Майадина в Сирии, которая отмечена на карте. Другие оставляют его в Едоме, у одного из вади Аравы или плато: точка на карте стоит у Рас-Рихаба к северу от Восора, а Вади Гувейр и Хирбет-Мусраб — другие варианты. Ни один не дал доказательств, и вопрос остаётся открытым."
  uk:
    - "Реховот «над рікою» був батьківщиною Саула (Шауля), одного з царів, що царювали в Едомі, перш ніж Ізраїль мав царів: «Умер же Самла, і царював намість його Савул із Рехобота над рікою», у Книзі Буття й знову в Книгах Хронік. Назва означає «широкі місця» і збігається з назвою колодязя, який Ісаак викопав поблизу Герара, та Реховот-Ір поблизу Ніневії, що є іншими місцями. Цей рядок — усе, що про нього відомо."
    - "Яку річку мають на увазі, спірно. У Біблії «ріка» зазвичай означає Євфрат, і дехто поміщає місто в ар-Рахбі на Євфраті поблизу Маядіна в Сирії, що позначено на карті. Інші тримають його в Едомі, біля ваді в Араві або на плато: точка на карті стоїть у Рас-Ріхабі на північ від Боцри, а Ваді-Ґувайр і Хірбет-Мусраб — додаткові кандидати. Жоден не дав доказів, і питання лишається відкритим."
  es:
    - "Rehobot «junto al río» era la patria de Saúl (Shaúl), uno de los reyes que reinaron en Edom antes de que Israel tuviera reyes: «Y murió Samla, y reinó en su lugar Saúl, de Rehoboth del Río», en el Génesis y de nuevo en Crónicas. El nombre significa «lugares anchos» y lo comparten el pozo que cavó Isaac cerca de Gerar y Rehobot-ir, junto a Nínive, que son lugares distintos. Esta línea es todo lo que se sabe de ella."
    - "Qué río se quiere decir se discute. En la Biblia «el río» suele significar el Éufrates, y algunos sitúan la ciudad en ar-Rahba, en el Éufrates, cerca de Mayadin, en Siria, que el mapa señala. Otros la mantienen dentro de Edom, junto a un uadi del Arabá o de la meseta: el punto del mapa está en Ras Rihab, al norte de Bosra, con Wadi Ghuwayr y Khirbet Musrab como candidatos adicionales. Ninguno ha dado pruebas, y la cuestión sigue abierta."
  pt:
    - "Reobote “junto ao rio” era a terra de Saul (Shaul), um dos reis que reinaram em Edom antes que Israel tivesse reis: “Samlá morreu, e Saul, de Reobote, junto ao rio, reinou em seu lugar”, no Gênesis e de novo em Crônicas. O nome significa “lugares largos” e é partilhado com o poço que Isaque cavou perto de Gerar e com Reobote-Ir, junto a Nínive, que são lugares diferentes. Esta linha é tudo o que se sabe dela."
    - "Que rio se tem em vista é disputado. Na Bíblia “o rio” costuma significar o Eufrates, e alguns situam a cidade em ar-Rahba, no Eufrates, perto de Mayadin, na Síria, que o mapa marca. Outros a mantêm dentro de Edom, junto a um uádi da Arabá ou do planalto: o ponto no mapa fica em Ras Rihab, ao norte de Bosra, com Wadi Ghuwayr e Khirbet Musrab como outros candidatos. Nenhum deu provas, e a questão continua aberta."
  de:
    - "Rehobot „am Strom“ war die Heimat Sauls (Schauls), eines der Könige, die in Edom regierten, ehe Israel Könige hatte: „Da Samla starb, ward Saul König, von Rehoboth am Strom“, in der Genesis und wieder in der Chronik. Der Name bedeutet „weite Plätze“ und teilt sich mit dem Brunnen, den Isaak bei Gerar grub, und mit Rehobot-Ir bei Ninive, die andere Orte sind. Diese Zeile ist alles, was darüber bekannt ist."
    - "Welcher Strom gemeint ist, ist umstritten. In der Bibel bedeutet „der Strom“ meist den Euphrat, und manche setzen die Stadt nach ar-Rahba am Euphrat bei Mayadin in Syrien, das die Karte markiert. Andere halten sie in Edom, an einem Wadi der Araba oder auf der Hochfläche: Der Kartenpunkt steht bei Ras Rihab nördlich von Bozra, mit Wadi Ghuwair und Chirbet Musrab als weiteren Kandidaten. Keiner hat Belege erbracht, und die Frage bleibt offen."
  fr:
    - "Rehoboth « sur le fleuve » était la patrie de Saül (Shaül), l’un des rois qui régnèrent en Édom avant qu’Israël eût des rois : « Samla mourut ; et Saül, de Rehoboth sur le fleuve, régna à sa place », dans la Genèse et de nouveau dans les Chroniques. Le nom signifie « lieux spacieux » et est partagé avec le puits que creusa Isaac près de Guérar et avec Rehoboth-Ir près de Ninive, qui sont d’autres lieux. Cette ligne est tout ce qu’on en sait."
    - "Quel fleuve est visé est disputé. Dans la Bible, « le fleuve » désigne d’ordinaire l’Euphrate, et certains placent la ville à ar-Rahba sur l’Euphrate près de Mayadine, en Syrie, que marque la carte. D’autres la gardent en Édom, près d’un oued de l’Araba ou du plateau : le point de la carte est à Ras Rihab, au nord de Botsra, avec Wadi Ghuwayr et Khirbet Musrab comme autres candidats. Aucun n’a fourni de preuve, et la question reste ouverte."
  it:
    - "Recobot «sul Fiume» era la patria di Saul (Shaul), uno dei re che regnarono in Edom prima che Israele avesse re: «Samla morì, e Saul di Rehoboth sul Fiume, regnò in luogo suo», nella Genesi e di nuovo nelle Cronache. Il nome significa «luoghi ampi» ed è condiviso con il pozzo che Isacco scavò presso Gerar e con Recobot-Ir presso Ninive, che sono luoghi diversi. Questa riga è tutto ciò che si sa di essa."
    - "Quale fiume sia inteso è controverso. Nella Bibbia «il fiume» di solito significa l’Eufrate, e alcuni collocano la città ad ar-Rahba sull’Eufrate presso Mayadin in Siria, che la mappa segna. Altri la tengono entro Edom, presso un uadi dell’Araba o dell’altopiano: il punto sulla mappa sta a Ras Rihab a nord di Bosra, con Wadi Ghuwayr e Khirbet Musrab come ulteriori candidati. Nessuno ha prodotto prove, e la questione resta aperta."
  pl:
    - "Rechobot „u rzeki” było domem Saula (Szaula), jednego z królów, którzy panowali w Edomie, zanim Izrael miał królów: „I umarł Samla, a królował miasto niego Saul, z Rechobot u rzeki”, w Księdze Rodzaju i ponownie w Kronikach. Nazwa znaczy „szerokie miejsca” i jest wspólna ze studnią, którą Izaak wykopał koło Gerar, i z Rechobot-Ir koło Niniwy, które są innymi miejscami. Ten wers to wszystko, co o nim wiadomo."
    - "Która rzeka jest tu na myśli, jest sporne. W Biblii „rzeka” zwykle oznacza Eufrat i niektórzy umieszczają miasto w ar-Rahba nad Eufratem koło Majadin w Syrii, co zaznacza mapa. Inni trzymają je w Edomie, nad wadi Araby lub na płaskowyżu: punkt na mapie stoi w Ras Rihab na północ od Bosry, z Wadi Ghuwajr i Chirbet Musrab jako dalszymi kandydatami. Żaden nie dostarczył dowodów i pytanie pozostaje otwarte."
  cs:
    - "Rechobót „od řeky“ byl domovem Saula (Šaula), jednoho z králů, kteří kralovali v Edómu, než měl Izrael krále: „A po smrti Semlově kraloval na místě jeho Saul z Rohobot od řeky“, v Genesis a znovu v Kronikách. Jméno znamená „široká místa“ a sdílí je studna, kterou vykopal Izák u Gerary, a Rechobót-ír u Ninive, což jsou jiná místa. Tento řádek je vše, co o něm známe."
    - "Která řeka se myslí, je sporné. V Bibli „řeka“ obvykle znamená Eufrat a někteří kladou město do ar-Rahby na Eufratu poblíž Majádínu v Sýrii, kterou mapa vyznačuje. Jiní je ponechávají v Edómu, u vádí v Arabě nebo na plošině: bod na mapě stojí v Rás Rihab severně od Bosry, s Vádí Ghuvajr a Chirbet Musrab jako dalšími kandidáty. Žádné nepřineslo důkaz a otázka zůstává otevřená."
  nl:
    - "Rehobot “aan de rivier” was de woonplaats van Saul (Sjaul), een van de koningen die in Edom regeerden vóór Israël koningen had: “En Samla stierf, en Saul van Rehoboth, aan de rivier, regeerde in zijn plaats”, in Genesis en opnieuw in Kronieken. De naam betekent “wijde plaatsen” en wordt gedeeld met de put die Isaak bij Gerar groef en met Rehobot-Ir bij Nineve, die andere plaatsen zijn. Deze regel is alles wat ervan bekend is."
    - "Welke rivier bedoeld is, is omstreden. In de Bijbel betekent “de rivier” meestal de Eufraat, en sommigen plaatsen de stad bij ar-Rahba aan de Eufraat bij Mayadin in Syrië, wat de kaart aanwijst. Anderen houden haar binnen Edom, bij een wadi van de Araba of het plateau: het punt op de kaart staat bij Ras Rihab ten noorden van Bozra, met Wadi Ghuwayr en Khirbet Musrab als verdere kandidaten. Geen enkele heeft bewijs opgeleverd, en de vraag blijft open."
