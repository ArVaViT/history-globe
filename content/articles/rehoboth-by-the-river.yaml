# Overview article (ADR 0007). Mainstream facts only; Rehoboth “by the river”, the home of an Edomite king; whether the river is the Euphrates or a wadi of Edom is disputed and both are given.
id: rehoboth-by-the-river
place: a17e154
title:
  en: "Rehoboth by the River"
  ru: "Реховоф при реке"
  uk: "Реховот над рікою"
  es: "Rehobot del Río"
  pt: "Reobote junto ao rio"
  de: "Rehobot am Strom"
  fr: "Rehoboth sur le fleuve"
  it: "Recobot sul Fiume"
  pl: "Rechobot u rzeki"
  cs: "Rechobót od řeky"
  nl: "Rehobot aan de rivier"
  sv: "Rehovot vid floden"
  nb: "Rehobot ved elven"
  tl: "Rehoboth na tabi ng Ilog"
  da: "Rehobot ved Floden"
  sr: "Реховот на реци"
  hu: "Rehóbót a folyóvíz mellett"
  fi: "Rehobot virran varrella"
  vi: "Rê-hô-bốt trên mé sông"
  ro: "Rehobot de lângă râu"
  bg: "Реховот при реката"
body:
  en:
    - "Rehoboth “by the river” was the home of Saul (Shaul), one of the kings who reigned in Edom before Israel had kings: “And Samlah died, and Saul of Rehoboth by the river reigned in his stead”, in Genesis and again in Chronicles. The name means “broad places” and is shared with the well Isaac dug near Gerar and with Rehoboth-Ir by Nineveh, which are different places. This line is all that is known of it."
    - "Which river is meant is disputed. In the Bible “the river” usually means the Euphrates, and some place the town at ar-Rahba on the Euphrates near Mayadin in Syria, which the map marks. Others keep it within Edom, by a wadi of the Arabah or the plateau: the point on the map stands at Ras Rihab north of Bozrah, with Wadi Ghuwayr and Khirbet Musrab as further candidates. None has produced evidence, and the question stays open."
    - "Saul is the sixth of the eight kings in the list. Six of them are named with a town of their own, and none is said to be the son of the king before him. The ancient Aramaic translations already read the river as the Euphrates: Targum Onkelos and the Targum of Pseudo-Jonathan both render the phrase as Rehoboth on the Euphrates. Eusebius looked south instead. He writes that in his day there was a fortress of this name in Gebalene, as the country around Petra that had once been Edom was then called, and Jerome's Latin version adds a large village of the same name."
  ru:
    - "Реховоф, «что при реке», — родина Саула, одного из царей, царствовавших в Едоме прежде, чем у Израиля появились цари: «И умер Самла, и воцарился по нем Саул из Реховофа, что при реке», в книге Бытия и ещё раз в Паралипоменоне. Имя значит «широкие места» и совпадает с именем колодца, выкопанного Исааком близ Герара, и Реховоф-Ира у Ниневии, но это другие места. Эта строка — всё, что о нём известно."
    - "О какой реке речь, спорят. В Библии «река» обычно означает Евфрат, и некоторые помещают город в Эр-Рахбе на Евфрате близ Майадина в Сирии, которая отмечена на карте. Другие оставляют его в Едоме, у одного из вади Аравы или плато: точка на карте стоит у Рас-Рихаба к северу от Восора, а Вади Гувейр и Хирбет-Мусраб — другие варианты. Ни один не дал доказательств, и вопрос остаётся открытым."
    - "Саул — шестой из восьми царей этого списка. Шестеро из них названы со своим городом, и ни один не назван сыном предыдущего царя. Древние арамейские переводы уже понимали эту реку как Евфрат: и Таргум Онкелоса, и Таргум Псевдо-Ионафана передают эти слова как Реховоф на Евфрате. Евсевий, напротив, искал его на юге. Он пишет, что в его время крепость с этим именем стояла в Гебалене, как называли тогда область вокруг Петры, бывшую некогда Едомом, а латинский перевод Иеронима добавляет большое селение с тем же именем."
  uk:
    - "Реховот «над рікою» був батьківщиною Саула (Шауля), одного з царів, що царювали в Едомі, перш ніж Ізраїль мав царів: «Умер же Самла, і царював намість його Савул із Рехобота над рікою», у Книзі Буття й знову в Книгах Хронік. Назва означає «широкі місця» і збігається з назвою колодязя, який Ісаак викопав поблизу Герара, та Реховот-Ір поблизу Ніневії, що є іншими місцями. Цей рядок — усе, що про нього відомо."
    - "Яку річку мають на увазі, спірно. У Біблії «ріка» зазвичай означає Євфрат, і дехто поміщає місто в ар-Рахбі на Євфраті поблизу Маядіна в Сирії, що позначено на карті. Інші тримають його в Едомі, біля ваді в Араві або на плато: точка на карті стоїть у Рас-Ріхабі на північ від Боцри, а Ваді-Ґувайр і Хірбет-Мусраб — додаткові кандидати. Жоден не дав доказів, і питання лишається відкритим."
    - "Саул — шостий із восьми царів цього списку. Шістьох із них названо з власним містом, і жоден не названий сином попереднього царя. Давні арамейські переклади вже розуміли цю ріку як Євфрат: і Таргум Онкелоса, і Таргум Псевдо-Йонатана передають ці слова як Реховот на Євфраті. Євсевій натомість шукав його на півдні. Він пише, що за його часів фортеця з цією назвою стояла в Гебалені, як тоді називали край довкола Петри, колись Едом, а латинський переклад Єроніма додає велике село з тією самою назвою."
  es:
    - "Rehobot «junto al río» era la patria de Saúl (Shaúl), uno de los reyes que reinaron en Edom antes de que Israel tuviera reyes: «Y murió Samla, y reinó en su lugar Saúl, de Rehoboth del Río», en el Génesis y de nuevo en Crónicas. El nombre significa «lugares anchos» y lo comparten el pozo que cavó Isaac cerca de Gerar y Rehobot-ir, junto a Nínive, que son lugares distintos. Esta línea es todo lo que se sabe de ella."
    - "Qué río se quiere decir se discute. En la Biblia «el río» suele significar el Éufrates, y algunos sitúan la ciudad en ar-Rahba, en el Éufrates, cerca de Mayadin, en Siria, que el mapa señala. Otros la mantienen dentro de Edom, junto a un uadi del Arabá o de la meseta: el punto del mapa está en Ras Rihab, al norte de Bosra, con Wadi Ghuwayr y Khirbet Musrab como candidatos adicionales. Ninguno ha dado pruebas, y la cuestión sigue abierta."
    - "Saúl es el sexto de los ocho reyes de la lista. Seis de ellos se nombran con una ciudad propia, y de ninguno se dice que fuera hijo del rey anterior. Las antiguas traducciones arameas ya entendían que el río era el Éufrates: el Targum de Onqelos y el Targum Pseudo-Jonatán vierten la expresión como Rehobot del Éufrates. Eusebio, en cambio, miraba al sur. Escribe que en su tiempo había una fortaleza de ese nombre en la Gebalene, como se llamaba entonces la región en torno a Petra que antes había sido Edom, y la versión latina de Jerónimo añade una gran aldea del mismo nombre."
  pt:
    - "Reobote “junto ao rio” era a terra de Saul (Shaul), um dos reis que reinaram em Edom antes que Israel tivesse reis: “Samlá morreu, e Saul, de Reobote, junto ao rio, reinou em seu lugar”, no Gênesis e de novo em Crônicas. O nome significa “lugares largos” e é partilhado com o poço que Isaque cavou perto de Gerar e com Reobote-Ir, junto a Nínive, que são lugares diferentes. Esta linha é tudo o que se sabe dela."
    - "Que rio se tem em vista é disputado. Na Bíblia “o rio” costuma significar o Eufrates, e alguns situam a cidade em ar-Rahba, no Eufrates, perto de Mayadin, na Síria, que o mapa marca. Outros a mantêm dentro de Edom, junto a um uádi da Arabá ou do planalto: o ponto no mapa fica em Ras Rihab, ao norte de Bosra, com Wadi Ghuwayr e Khirbet Musrab como outros candidatos. Nenhum deu provas, e a questão continua aberta."
    - "Saul é o sexto dos oito reis da lista. Seis deles são nomeados com uma cidade própria, e de nenhum se diz que fosse filho do rei anterior. As antigas traduções aramaicas já entendiam o rio como o Eufrates: o Targum Onkelos e o Targum Pseudo-Jônatas vertem a expressão como Reobote do Eufrates. Eusébio, por sua vez, olhava para o sul. Ele escreve que em seu tempo havia uma fortaleza com esse nome na Gebalene, como se chamava então a região em torno de Petra que outrora fora Edom, e a versão latina de Jerônimo acrescenta uma grande aldeia de mesmo nome."
  de:
    - "Rehobot „am Strom“ war die Heimat Sauls (Schauls), eines der Könige, die in Edom regierten, ehe Israel Könige hatte: „Da Samla starb, ward Saul König, von Rehoboth am Strom“, in der Genesis und wieder in der Chronik. Der Name bedeutet „weite Plätze“ und teilt sich mit dem Brunnen, den Isaak bei Gerar grub, und mit Rehobot-Ir bei Ninive, die andere Orte sind. Diese Zeile ist alles, was darüber bekannt ist."
    - "Welcher Strom gemeint ist, ist umstritten. In der Bibel bedeutet „der Strom“ meist den Euphrat, und manche setzen die Stadt nach ar-Rahba am Euphrat bei Mayadin in Syrien, das die Karte markiert. Andere halten sie in Edom, an einem Wadi der Araba oder auf der Hochfläche: Der Kartenpunkt steht bei Ras Rihab nördlich von Bozra, mit Wadi Ghuwair und Chirbet Musrab als weiteren Kandidaten. Keiner hat Belege erbracht, und die Frage bleibt offen."
    - "Saul ist der sechste der acht Könige der Liste. Sechs von ihnen werden mit einer eigenen Stadt genannt, und keiner heißt Sohn des Königs vor ihm. Die alten aramäischen Übersetzungen verstanden den Strom bereits als den Euphrat: Targum Onkelos und Targum Pseudo-Jonathan geben die Wendung beide als Rehobot am Euphrat wieder. Eusebius dagegen suchte im Süden. Er schreibt, zu seiner Zeit habe es eine Festung dieses Namens in der Gebalene gegeben, wie man das Land um Petra nannte, das einst Edom gewesen war, und die lateinische Fassung des Hieronymus fügt ein großes Dorf gleichen Namens hinzu."
  fr:
    - "Rehoboth « sur le fleuve » était la patrie de Saül (Shaül), l’un des rois qui régnèrent en Édom avant qu’Israël eût des rois : « Samla mourut ; et Saül, de Rehoboth sur le fleuve, régna à sa place », dans la Genèse et de nouveau dans les Chroniques. Le nom signifie « lieux spacieux » et est partagé avec le puits que creusa Isaac près de Guérar et avec Rehoboth-Ir près de Ninive, qui sont d’autres lieux. Cette ligne est tout ce qu’on en sait."
    - "Quel fleuve est visé est disputé. Dans la Bible, « le fleuve » désigne d’ordinaire l’Euphrate, et certains placent la ville à ar-Rahba sur l’Euphrate près de Mayadine, en Syrie, que marque la carte. D’autres la gardent en Édom, près d’un oued de l’Araba ou du plateau : le point de la carte est à Ras Rihab, au nord de Botsra, avec Wadi Ghuwayr et Khirbet Musrab comme autres candidats. Aucun n’a fourni de preuve, et la question reste ouverte."
    - "Saül est le sixième des huit rois de la liste. Six d’entre eux sont nommés avec une ville propre, et aucun n’est dit fils du roi précédent. Les anciennes traductions araméennes comprenaient déjà le fleuve comme l’Euphrate : le Targum Onkelos et le Targum du Pseudo-Jonathan rendent tous deux l’expression par Rehoboth sur l’Euphrate. Eusèbe, lui, regardait vers le sud. Il écrit qu’à son époque il y avait une forteresse de ce nom dans la Gébalène, nom qu’on donnait alors au pays autour de Pétra qui avait été Édom, et la version latine de Jérôme ajoute un grand village du même nom."
  it:
    - "Recobot «sul Fiume» era la patria di Saul (Shaul), uno dei re che regnarono in Edom prima che Israele avesse re: «Samla morì, e Saul di Rehoboth sul Fiume, regnò in luogo suo», nella Genesi e di nuovo nelle Cronache. Il nome significa «luoghi ampi» ed è condiviso con il pozzo che Isacco scavò presso Gerar e con Recobot-Ir presso Ninive, che sono luoghi diversi. Questa riga è tutto ciò che si sa di essa."
    - "Quale fiume sia inteso è controverso. Nella Bibbia «il fiume» di solito significa l’Eufrate, e alcuni collocano la città ad ar-Rahba sull’Eufrate presso Mayadin in Siria, che la mappa segna. Altri la tengono entro Edom, presso un uadi dell’Araba o dell’altopiano: il punto sulla mappa sta a Ras Rihab a nord di Bosra, con Wadi Ghuwayr e Khirbet Musrab come ulteriori candidati. Nessuno ha prodotto prove, e la questione resta aperta."
    - "Saul è il sesto degli otto re della lista. Sei di loro sono nominati con una città propria, e di nessuno si dice che fosse figlio del re precedente. Le antiche traduzioni aramaiche intendevano già il fiume come l’Eufrate: il Targum Onqelos e il Targum Pseudo-Jonathan rendono entrambi l’espressione con Recobot sull’Eufrate. Eusebio guardava invece a sud. Scrive che ai suoi tempi c’era una fortezza con questo nome nella Gebalene, come si chiamava allora la regione intorno a Petra che un tempo era stata Edom, e la versione latina di Girolamo aggiunge un grande villaggio con lo stesso nome."
  pl:
    - "Rechobot „u rzeki” było domem Saula (Szaula), jednego z królów, którzy panowali w Edomie, zanim Izrael miał królów: „I umarł Samla, a królował miasto niego Saul, z Rechobot u rzeki”, w Księdze Rodzaju i ponownie w Kronikach. Nazwa znaczy „szerokie miejsca” i jest wspólna ze studnią, którą Izaak wykopał koło Gerar, i z Rechobot-Ir koło Niniwy, które są innymi miejscami. Ten wers to wszystko, co o nim wiadomo."
    - "Która rzeka jest tu na myśli, jest sporne. W Biblii „rzeka” zwykle oznacza Eufrat i niektórzy umieszczają miasto w ar-Rahba nad Eufratem koło Majadin w Syrii, co zaznacza mapa. Inni trzymają je w Edomie, nad wadi Araby lub na płaskowyżu: punkt na mapie stoi w Ras Rihab na północ od Bosry, z Wadi Ghuwajr i Chirbet Musrab jako dalszymi kandydatami. Żaden nie dostarczył dowodów i pytanie pozostaje otwarte."
    - "Saul jest szóstym z ośmiu królów tej listy. Sześciu z nich wymieniono z własnym miastem i o żadnym nie powiedziano, że był synem poprzedniego króla. Dawne przekłady aramejskie rozumiały już tę rzekę jako Eufrat: Targum Onkelosa i Targum Pseudo-Jonatana oddają to wyrażenie jako Rechobot nad Eufratem. Euzebiusz natomiast szukał na południu. Pisze, że za jego czasów istniała twierdza o tej nazwie w Gebalenie, jak nazywano wówczas kraj wokół Petry, niegdyś Edom, a łacińska wersja Hieronima dodaje dużą wieś o tej samej nazwie."
  cs:
    - "Rechobót „od řeky“ byl domovem Saula (Šaula), jednoho z králů, kteří kralovali v Edómu, než měl Izrael krále: „A po smrti Semlově kraloval na místě jeho Saul z Rohobot od řeky“, v Genesis a znovu v Kronikách. Jméno znamená „široká místa“ a sdílí je studna, kterou vykopal Izák u Gerary, a Rechobót-ír u Ninive, což jsou jiná místa. Tento řádek je vše, co o něm známe."
    - "Která řeka se myslí, je sporné. V Bibli „řeka“ obvykle znamená Eufrat a někteří kladou město do ar-Rahby na Eufratu poblíž Majádínu v Sýrii, kterou mapa vyznačuje. Jiní je ponechávají v Edómu, u vádí v Arabě nebo na plošině: bod na mapě stojí v Rás Rihab severně od Bosry, s Vádí Ghuvajr a Chirbet Musrab jako dalšími kandidáty. Žádné nepřineslo důkaz a otázka zůstává otevřená."
    - "Saul je šestý z osmi králů tohoto seznamu. Šest z nich je jmenováno s vlastním městem a o žádném se neříká, že by byl synem předchozího krále. Staré aramejské překlady už chápaly řeku jako Eufrat: Targum Onkelos i Targum Pseudo-Jonatan podávají ta slova jako Rechobót na Eufratu. Eusebios naproti tomu hledal na jihu. Píše, že v jeho době stála pevnost toho jména v Gebaléně, jak se tehdy říkalo krajině kolem Petry, kdysi Edómu, a Jeronýmova latinská verze přidává velkou vesnici téhož jména."
  nl:
    - "Rehobot “aan de rivier” was de woonplaats van Saul (Sjaul), een van de koningen die in Edom regeerden vóór Israël koningen had: “En Samla stierf, en Saul van Rehoboth, aan de rivier, regeerde in zijn plaats”, in Genesis en opnieuw in Kronieken. De naam betekent “wijde plaatsen” en wordt gedeeld met de put die Isaak bij Gerar groef en met Rehobot-Ir bij Nineve, die andere plaatsen zijn. Deze regel is alles wat ervan bekend is."
    - "Welke rivier bedoeld is, is omstreden. In de Bijbel betekent “de rivier” meestal de Eufraat, en sommigen plaatsen de stad bij ar-Rahba aan de Eufraat bij Mayadin in Syrië, wat de kaart aanwijst. Anderen houden haar binnen Edom, bij een wadi van de Araba of het plateau: het punt op de kaart staat bij Ras Rihab ten noorden van Bozra, met Wadi Ghuwayr en Khirbet Musrab als verdere kandidaten. Geen enkele heeft bewijs opgeleverd, en de vraag blijft open."
    - "Saul is de zesde van de acht koningen in de lijst. Zes van hen worden met een eigen stad genoemd, en van geen van hen wordt gezegd dat hij de zoon was van de koning vóór hem. De oude Aramese vertalingen vatten de rivier al op als de Eufraat: de Targum Onkelos en de Targum Pseudo-Jonathan geven de uitdrukking beide weer als Rehobot aan de Eufraat. Eusebius zocht het daarentegen in het zuiden. Hij schrijft dat er in zijn tijd een vesting van die naam lag in de Gebalene, zoals het land rond Petra dat eens Edom was toen heette, en de Latijnse versie van Hiëronymus voegt een groot dorp met dezelfde naam toe."
  sv:
    - "Rehovot ”vid floden” var hemorten för Saul (Shaul), en av kungarna som regerade i Edom innan Israel hade kungar: ”När Samla dog, blev Saul från Rehobot vid floden konung efter honom”, i Första Mosebok och åter i Krönikeböckerna. Namnet betyder ”breda platser” och delas med brunnen som Isak grävde nära Gerar och med Rehovot-Ir vid Nineve, som är andra platser. Denna rad är allt som är känt om det."
    - "Vilken flod som avses är omstritt. I Bibeln betyder ”floden” vanligen Eufrat, och vissa placerar staden vid ar-Rahba vid Eufrat nära Mayadin i Syrien, som kartan markerar. Andra håller den inom Edom, vid en wadi i Arava eller på platån: kartpunkten står vid Ras Rihab norr om Bosra, med Wadi Ghuwayr och Khirbet Musrab som ytterligare kandidater. Ingen har gett belägg, och frågan förblir öppen."
    - "Saul är den sjätte av de åtta kungarna i listan. Sex av dem nämns med en egen stad, och ingen sägs vara son till kungen före honom. De gamla arameiska översättningarna förstod redan floden som Eufrat: både Targum Onkelos och Targum Pseudo-Jonatan återger uttrycket som Rehovot vid Eufrat. Eusebios sökte i stället söderut. Han skriver att det på hans tid fanns en fästning med det namnet i Gebalene, som landet kring Petra, en gång Edom, då kallades, och Hieronymus latinska version tillägger en stor by med samma namn."
  nb:
    - "Rehobot «ved elven» var hjemstedet til Sjaul (Saul), en av kongene som regjerte i Edom før Israel hadde konger: «Da Samla døde, blev Saul fra Rehobot ved elven konge i hans sted», i 1. Mosebok og igjen i Krønikebøkene. Navnet betyr «vide steder» og deles med brønnen Isak gravde nær Gerar og med Rehobot-Ir ved Ninive, som er andre steder. Denne linjen er alt som er kjent om det."
    - "Hvilken elv som menes, er omstridt. I Bibelen betyr «elven» vanligvis Eufrat, og noen plasserer byen ved ar-Rahba ved Eufrat nær Mayadin i Syria, som kartet markerer. Andre holder den innenfor Edom, ved en wadi i Arava eller på platået: kartpunktet står ved Ras Rihab nord for Bosra, med Wadi Ghuwayr og Khirbet Musrab som ytterligere kandidater. Ingen har gitt belegg, og spørsmålet står åpent."
    - "Saul er den sjette av de åtte kongene i listen. Seks av dem nevnes med en egen by, og ingen sies å være sønn av kongen før ham. De gamle arameiske oversettelsene forsto allerede elven som Eufrat: både Targum Onkelos og Targum Pseudo-Jonatan gjengir uttrykket som Rehobot ved Eufrat. Eusebius lette derimot i sør. Han skriver at det på hans tid fantes en festning med dette navnet i Gebalene, som landet rundt Petra, en gang Edom, da ble kalt, og Hieronymus' latinske versjon legger til en stor landsby med samme navn."
  tl:
    - "Ang Rehoboth “sa tabi ng Ilog” ay ang tahanan ni Saul (Shaul), isa sa mga haring naghari sa Edom bago magkaroon ng mga hari ang Israel: “At namatay si Samla at naghari na kahalili niya si Saul, na taga Rehoboth na tabi ng Ilog”, sa Genesis at muli sa Mga Cronica. Ang pangalan ay nangangahulugang “maluluwang na dako” at ibinabahagi sa balon na hinukay ni Isaac malapit sa Gerar at sa Rehobotir malapit sa Ninive, na magkakaibang lugar. Ang linyang ito ang lahat ng nalalaman tungkol dito."
    - "Pinagtatalunan kung aling ilog ang tinutukoy. Sa Bibliya, ang “ilog” ay karaniwang nangangahulugang Eufrates, at inilalagay ng ilan ang bayan sa ar-Rahba sa Eufrates malapit sa Mayadin sa Siria, na minamarkahan ng mapa. Pinananatili ito ng iba sa loob ng Edom, sa tabi ng wadi ng Araba o ng talampas: ang punto sa mapa ay nasa Ras Rihab sa hilaga ng Bozra, na may Wadi Ghuwayr at Khirbet Musrab bilang karagdagang mga kandidato. Walang nagbigay ng ebidensiya, at nananatiling bukás ang tanong."
    - "Si Saul ang ikaanim sa walong hari sa talaan. Anim sa kanila ang binabanggit kasama ang sariling bayan, at wala ni isang sinasabing anak ng haring nauna sa kaniya. Ang mga sinaunang saling Arameo ay umunawa na sa ilog bilang Eufrates: kapwa isinalin ng Targum Onqelos at ng Targum Pseudo-Jonathan ang parirala bilang Rehoboth sa Eufrates. Sa timog naman tumingin si Eusebio. Isinulat niya na noong kaniyang panahon ay may isang kuta na may ganitong pangalan sa Gebalene, gaya ng tawag noon sa lupain sa palibot ng Petra na dating Edom, at idinagdag ng saling Latin ni Jeronimo ang isang malaking nayon na may parehong pangalan."
  da:
    - "Rehobot »ved Floden« var hjemstedet for Saul (Sjaul), en af de konger, der regerede i Edom, før Israel havde konger: »Og Samla døde, og Saul af Rekoboth ved Floden blev Konge i hans Sted«, i 1. Mosebog og igen i Krønikebøgerne. Navnet betyder »brede steder« og deles med brønden, Isak gravede nær Gerar, og med Rehobot-Ir ved Nineve, som er andre steder. Denne linje er alt, hvad der vides om det."
    - "Hvilken flod der menes, er omstridt. I Bibelen betyder »Floden« sædvanligvis Eufrat, og nogle placerer byen ved ar-Rahba ved Eufrat nær Mayadin i Syrien, som kortet markerer. Andre holder den inden for Edom, ved en wadi i Araba eller på plateauet: kortets punkt står ved Ras Rihab nord for Bosra, med Wadi Ghuwayr og Khirbet Musrab som yderligere kandidater. Ingen har givet beviser, og spørgsmålet forbliver åbent."
    - "Saul er den sjette af de otte konger i listen. Seks af dem nævnes med en by for sig, og ingen siges at være søn af kongen før ham. De gamle aramæiske oversættelser forstod allerede floden som Eufrat: både Targum Onkelos og Targum Pseudo-Jonatan gengiver udtrykket som Rehobot ved Eufrat. Eusebios søgte derimod mod syd. Han skriver, at der på hans tid lå en fæstning af dette navn i Gebalene, som landet omkring Petra, engang Edom, dengang blev kaldt, og Hieronymus' latinske version tilføjer en stor landsby af samme navn."
  sr:
    - "Реховот „на реци“ био је завичај Саула (Шаула), једног од царева који су владали у Едому пре него што је Израиљ имао царева: „А кад умре Самада, зацари се на његово место Саул из Ровота на реци“, у Постању и поново у Летописима. Име значи „пространа места“ и дели га бунар који је Исак ископао код Герара и Реховот-Ир код Ниниве, а то су различита места. Овај ред је све што се о њему зна."
    - "Која је река у питању, спорно је. У Библији „река“ обично значи Еуфрат, и неки смештају град у ер-Рахбу на Еуфрату код Мајадина у Сирији, коју карта означава. Други га држе унутар Едома, поред вадија Араве или висоравни: тачка на карти стоји у Рас Рихабу северно од Восора, а Вади Гувајр и Хирбет Мусраб су даљи кандидати. Ниједан није дао доказе, а питање остаје отворено."
    - "Саул је шести од осам царева на том списку. Шесторица од њих наведена су са својим градом, и ни за једног се не каже да је био син претходног цара. Стари арамејски преводи већ су ту реку схватали као Еуфрат: и Таргум Онкелос и Таргум Псеудо-Јонатан преносе тај израз као Реховот на Еуфрату. Јевсевије је, напротив, тражио на југу. Он пише да је у његово време тврђава тог имена постојала у Гебалени, како се тада звао крај око Петре, некада Едом, а Јеронимова латинска верзија додаје велико село истог имена."
  hu:
    - "A Rehóbót „a folyó mellett” Saul (Saúl) otthona volt, azon királyok egyike, akik Edomban uralkodtak, mielőtt Izráelnek királyai lettek: „És meghala Szamlá és uralkodék helyette Saul, a folyóvíz mellett való Rékhobóthból”, Mózes első könyvében és újra a Krónikákban. A név „tágas helyeket” jelent, és közös a Gerár mellett Izsák ásta kúttal és a Ninive melletti Rehóbót-Írral, amelyek más helyek. Ez a sor mindaz, amit róla tudni."
    - "Hogy melyik folyóról van szó, vitatott. A Bibliában „a folyó” általában az Eufráteszt jelenti, és egyesek a várost az Eufrátesz melletti ar-Rahbánál helyezik el Mayadin közelében Szíriában, amelyet a térkép jelöl. Mások Edomon belül tartják, az Arábá egyik vádija vagy a fennsík mellett: a térkép pontja a Boszrától északra fekvő Ras Rihabnál áll, a Wadi Ghuwayr és a Khirbet Musrab további jelöltekkel. Egyik sem hozott bizonyítékot, és a kérdés nyitott marad."
    - "Saul a lista nyolc királya közül a hatodik. Hatot közülük saját városukkal neveznek meg, és egyikről sem mondják, hogy az előtte uralkodó király fia lett volna. A régi arámi fordítások már az Eufráteszt értették a folyón: Targum Onkelosz és Targum Pszeudo-Jonatán egyaránt Rehóbót az Eufrátesz mellett alakban adja vissza a kifejezést. Eusebius viszont délen kereste. Azt írja, hogy az ő idejében egy ilyen nevű erőd állt Gebalénében, ahogy akkor a Petra körüli, egykor Edomhoz tartozó vidéket nevezték, Jeromos latin változata pedig egy azonos nevű nagy falut is említ."
  fi:
    - "Rehobot ”virran varrella” oli Saulin (Shaul) kotipaikka, yhden niistä kuninkaista, jotka hallitsivat Edomissa ennen kuin Israelilla oli kuninkaita: ”Kun Samla kuoli, tuli Saul, Rehobotista, virran varrelta, kuninkaaksi hänen sijaansa”, 1. Mooseksen kirjassa ja jälleen Aikakirjoissa. Nimi merkitsee ”leveitä paikkoja”, ja se on yhteinen Iisakin Gerarin lähelle kaivaman kaivon ja Niiniven vieressä olevan Rehobot-Irin kanssa, jotka ovat eri paikkoja. Tämä rivi on kaikki, mitä siitä tiedetään."
    - "Mikä joki tarkoitetaan, on kiistanalaista. Raamatussa ”joki” tarkoittaa yleensä Eufratia, ja jotkut sijoittavat kaupungin ar-Rahbaan Eufratin varrelle Mayadinin lähelle Syyriassa, minkä kartta merkitsee. Toiset pitävät sen Edomissa, Araban wadin tai ylängön varrella: kartan piste on Ras Rihabissa Bosrasta pohjoiseen, ja Wadi Ghuwayr ja Khirbet Musrab ovat muita ehdokkaita. Mikään ei ole tuottanut todisteita, ja kysymys pysyy avoimena."
    - "Saul on luettelon kahdeksasta kuninkaasta kuudes. Kuusi heistä mainitaan oman kaupunkinsa kanssa, eikä kenenkään sanota olleen edeltäjänsä poika. Vanhat arameankieliset käännökset ymmärsivät virran jo Eufratiksi: sekä Onkeloksen targum että Pseudo-Jonatanin targum kääntävät ilmauksen Rehobotiksi Eufratin varrella. Eusebios sen sijaan etsi etelästä. Hän kirjoittaa, että hänen aikanaan Gebalenessa oli tämänniminen linnoitus; niin kutsuttiin silloin Petran ympäristöä, entistä Edomia, ja Hieronymuksen latinankielinen laitos lisää samannimisen suuren kylän."
  vi:
    - "Rê-hô-bốt “ở trên mé sông” là quê của Sau-lơ (Shaul), một trong các vua trị vì ở Ê-đôm trước khi Y-sơ-ra-ên có vua: “Vua Sam-la băng, Sau-lơ, người Rê-hô-bốt ở trên mé sông, lên kế vị”, trong Sáng Thế Ký và lại trong sách Sử Ký. Tên có nghĩa là “những nơi rộng” và trùng với giếng Y-sác đào gần Ghê-ra và với Rê-hô-bốt-Y-rơ bên Ni-ni-ve, vốn là những nơi khác. Dòng này là tất cả những gì biết về nơi đó."
    - "Con sông nào được nhắc đến còn tranh luận. Trong Kinh Thánh, “con sông” thường là sông Ơ-phơ-rát, và một số người đặt thành tại ar-Rahba trên sông Ơ-phơ-rát gần Mayadin ở Sy-ri, mà bản đồ đánh dấu. Những người khác giữ nó trong Ê-đôm, bên một wadi của A-ra-ba hay cao nguyên: điểm trên bản đồ đặt tại Ras Rihab phía bắc Bốt-ra, với Wadi Ghuwayr và Khirbet Musrab là các ứng viên khác. Không nơi nào đưa ra bằng chứng, và vấn đề vẫn bỏ ngỏ."
    - "Sau-lơ là vua thứ sáu trong tám vua của danh sách. Sáu người trong số đó được nêu tên cùng một thành riêng, và không ai được nói là con của vua trước mình. Các bản dịch tiếng A-ram xưa đã hiểu con sông là sông Ơ-phơ-rát: cả Targum Onqelos lẫn Targum Pseudo-Jonathan đều dịch cụm từ này là Rê-hô-bốt trên sông Ơ-phơ-rát. Trái lại, Eusebius tìm về phía nam. Ông viết rằng vào thời ông có một đồn lũy mang tên này ở Gebalene, tên gọi khi ấy của vùng quanh Petra vốn xưa là Ê-đôm, và bản La-tinh của Jerome thêm một làng lớn cùng tên."
  ro:
    - "Rehobot „de lângă râu” a fost locul de baștină al lui Saul (Shaul), unul dintre regii care au domnit în Edom înainte ca Israel să aibă regi: „Și a murit Samada, și a împărățit după el Saul din Roovot de lângă rîu”, în Geneza și din nou în Cronici. Numele înseamnă „locuri largi” și îl poartă și fântâna pe care a săpat-o Isaac lângă Gherar și Rehobot-Ir de lângă Ninive, care sunt locuri diferite. Acest rând este tot ce se știe despre el."
    - "Care râu se înțelege este disputat. În Biblie „râul” înseamnă de obicei Eufratul, iar unii așază cetatea la ar-Rahba, pe Eufrat, lângă Mayadin, în Siria, pe care harta o marchează. Alții o păstrează în Edom, lângă un wadi al Arabei sau pe platou: punctul de pe hartă stă la Ras Rihab, la nord de Boțra, cu Wadi Ghuwayr și Khirbet Musrab ca alți candidați. Niciunul nu a dat dovezi, iar chestiunea rămâne deschisă."
    - "Saul este al șaselea dintre cei opt regi din listă. Șase dintre ei sunt numiți cu o cetate a lor, și despre niciunul nu se spune că ar fi fost fiul regelui dinainte. Vechile traduceri aramaice înțelegeau deja râul ca Eufratul: atât Targumul Onkelos, cât și Targumul Pseudo-Ionatan redau expresia prin Rehobot de pe Eufrat. Eusebiu, în schimb, căuta spre sud. El scrie că pe vremea lui exista o fortăreață cu acest nume în Gebalene, cum se numea atunci ținutul din jurul Petrei, odinioară Edom, iar versiunea latină a lui Ieronim adaugă un sat mare cu același nume."
  bg:
    - "Реховот „при реката“ бил родното място на Саул (Шаул), един от царете, които царували в Едом, преди Израил да има царе: „И умря Самла; и въцари се вместо него Саул, от Роовот, който е при реката“, в Битие и отново в Летописи. Името означава „широки места“ и го споделят кладенецът, който Исаак изкопал близо до Герар, и Реховот-Ир край Ниневия, които са различни места. Този ред е всичко, което се знае за него."
    - "Коя река се има предвид, е спорно. В Библията „реката“ обикновено означава Ефрат и някои поставят града при ар-Рахба на Ефрат близо до Маядин в Сирия, който картата отбелязва. Други го държат в пределите на Едом, край някое уади на Арава или на платото: точката на картата стои при Рас Рихаб северно от Восор, а Уади Гуейр и Хирбет Мусраб са допълнителни кандидати. Никой от тях не е дал доказателства и въпросът остава открит."
    - "Саул е шестият от осемте царе в списъка. Шестима от тях са назовани със свой град и за никого не се казва, че е син на предишния цар. Древните арамейски преводи вече разбирали реката като Ефрат: и Таргум Онкелос, и Таргум Псевдо-Йонатан предават израза като Реховот на Ефрат. Евсевий пък търсел на юг. Той пише, че по негово време имало крепост с това име в Гебалена, както тогава наричали областта около Петра, някога Едом, а латинската версия на Йероним добавя голямо село със същото име."
