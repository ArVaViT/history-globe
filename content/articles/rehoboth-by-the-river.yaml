# Overview article (ADR 0007). Mainstream facts only; Rehoboth “by the river”, the home of an Edomite king; whether the river is the Euphrates or a wadi of Edom is disputed and both are given.
id: rehoboth-by-the-river
place: a17e154
title:
  en: "Rehoboth"
  ru: "Реховоф"
body:
  en:
    - "Rehoboth “by the river” was the home of Saul (Shaul), one of the kings who reigned in Edom before Israel had kings: “And Samlah died, and Saul of Rehoboth by the river reigned in his stead”, in Genesis and again in Chronicles. The name means “broad places” and is shared with the well Isaac dug near Gerar and with Rehoboth-Ir by Nineveh, which are different places. This line is all that is known of it."
    - "Which river is meant is disputed. In the Bible “the river” usually means the Euphrates, and some place the town at ar-Rahba on the Euphrates near Mayadin in Syria, which the map marks. Others keep it within Edom, by a wadi of the Arabah or the plateau: the point on the map stands at Ras Rihab north of Bozrah, with Wadi Ghuwayr and Khirbet Musrab as further candidates. None has produced evidence, and the question stays open."
  ru:
    - "Реховоф, «что при реке», — родина Саула, одного из царей, царствовавших в Едоме прежде, чем у Израиля появились цари: «И умер Самла, и воцарился по нем Саул из Реховофа, что при реке», в книге Бытия и ещё раз в Паралипоменоне. Имя значит «широкие места» и совпадает с именем колодца, выкопанного Исааком близ Герара, и Реховоф-Ира у Ниневии, но это другие места. Эта строка — всё, что о нём известно."
    - "О какой реке речь, спорят. В Библии «река» обычно означает Евфрат, и некоторые помещают город в Эр-Рахбе на Евфрате близ Майадина в Сирии, которая отмечена на карте. Другие оставляют его в Едоме, у одного из вади Аравы или плато: точка на карте стоит у Рас-Рихаба к северу от Восора, а Вади Гувейр и Хирбет-Мусраб — другие варианты. Ни один не дал доказательств, и вопрос остаётся открытым."
scripture:
  - Gen.36.37
  - 1Chr.1.48
