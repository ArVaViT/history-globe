body:
  en:
    - "Enaim is the place where Tamar waited for Judah. Hearing that her father-in-law was going up to his sheepshearers at Timnah, she put off her widow's garments, veiled herself and “sat in an open place, which is by the way to Timnath”; the Hebrew is petah Enaim, “the entrance of Enaim”, and when Judah's friend came to redeem the pledge he asked the men of the place, “Where is the harlot, that was openly by the way side?”, that is, at Enaim. The King James Version translated the name as if it were a common noun; the Synodal Russian keeps it, “at the gate of Enaim”. From that meeting came Perez, the ancestor of David."
    - "The town is generally taken to be the Enam of Joshua's list of the Shephelah, named with Jarmuth, Adullam, Socoh and Azekah in the hills about the Elah valley, where roads climb from the plain toward the hill country; Adullam, the home of Judah's friend Hirah, lies in the same district. No site is agreed, the name has not survived, and nothing has been excavated as Enaim; proposals range along Nahal Yarmut and the Elah valley, and the map's point is a choice among them."
  ru:
    - "Енаим — место, где Фамарь ждала Иуду. Услышав, что свёкор идёт стричь овец своих в Фамну, она сняла одежду вдовства, покрылась покрывалом и «села у ворот Енаима, что на дороге в Фамну»; по-еврейски это «петах Енаим», «вход в Енаим», и когда друг Иуды пришёл выкупить залог, он спросил жителей того места: «где блудница, которая была в Енаиме при дороге?». Английская Библия короля Иакова перевела имя как нарицательное, «на открытом месте»; Синодальный перевод его сохраняет. От той встречи родился Фарес, предок Давида."
    - "Город обычно считают Гаенамом из списка Шефелы в книге Иисуса Навина, названным вместе с Иармуфом, Одолламом, Сохо и Азекой в холмах у долины дуба, где дороги поднимаются с равнины в горы; Одоллам, откуда был Хира, друг Иуды, лежит в том же округе. Место не установлено, имя не сохранилось, и ничего не раскопано как Енаим; предложения тянутся вдоль Нахаль-Ярмут и долины дуба, и точка на карте — выбор среди них."
  uk:
    - "Енаїм — місце, де Тамар чекала на Юду. Почувши, що її свекор іде до своїх стригачів овець у Тімну, вона зняла вдовину одіж, закуталася й «сїла в Енаїмській царинї, що при дорозї в Тімну»; єврейською петах Енаїм, «вхід Енаїма», і коли друг Юди прийшов викупити заставу, він запитав людей того місця: «Де блудниця, що седїла під Енамом при дорозї?» — тобто в Енаїмі. Переклад короля Якова переклав назву так, ніби це загальний іменник; Синодальний російський переклад зберігає її: «при вході до Енаїма». Від тієї зустрічі пішов Фарес, предок Давида."
    - "Місто зазвичай вважають Енамом зі списку Шефели в Ісуса Навина, названим поряд із Ярмутом, Одоламом, Сохо й Азекою в горах навколо Долини дуба, де дороги піднімаються з рівнини в бік гірської країни; Одолам, дім Юдиного друга Хіри, лежить у тому самому окрузі. Жодне місце не є загальновизнаним, назва не збереглася, і ніщо не розкопано як Енаїм; пропозиції розкидані вздовж Нахаль-Ярмут і долини Іла, і точка на мапі — вибір серед них."
  es:
    - "Enaim es el lugar donde Tamar esperó a Judá. Al saber que su suegro subía a Timna a sus esquiladores, se quitó los vestidos de viudez, se cubrió con un velo y «se puso á la puerta de las aguas que están junto al camino de Timnath»; el hebreo es petah Enaim, «la entrada de Enaim», y cuando el amigo de Judá vino a rescatar la prenda preguntó a los hombres del lugar: «¿Dónde está la ramera de las aguas junto al camino?», es decir, en Enaim. La versión King James tradujo el nombre como si fuera un nombre común; la Biblia sinodal rusa lo conserva: «a la puerta de Enaim». De aquel encuentro nació Fares, antepasado de David."
    - "La ciudad se identifica generalmente con la Enam de la lista de Josué para la Sefelá, nombrada con Jarmut, Adulam, Soco y Azeca en las colinas en torno al valle de Ela, donde los caminos suben de la llanura hacia la región montañosa; Adulam, patria de Hira, el amigo de Judá, se halla en el mismo distrito. No hay acuerdo sobre ningún sitio, el nombre no ha sobrevivido y nada se ha excavado como Enaim; las propuestas se reparten a lo largo del Nahal Yarmut y del valle de Ela, y el punto del mapa es una elección entre ellas."
  pt:
    - "Enaim é o lugar onde Tamar esperou por Judá. Ao saber que seu sogro subia aos tosquiadores de suas ovelhas em Timna, ela tirou as roupas de viúva, cobriu-se com o véu e “assentou-se à porta de Enaim, que está no caminho para Timna”; o hebraico é petah Enaim, “a entrada de Enaim”, e quando o amigo de Judá veio resgatar o penhor, perguntou aos homens do lugar: “Onde está a prostituta que estava em Enaim, à beira do caminho?”, isto é, em Enaim. A King James Version traduziu o nome como se fosse substantivo comum; o russo Sinodal o conserva, “à porta de Enaim”. Desse encontro nasceu Perez, antepassado de Davi."
    - "A cidade é geralmente tida como a Enã da lista de Josué para a Sefelá, nomeada com Jarmute, Adulão, Socó e Azeca nas colinas em torno do vale de Elá, onde as estradas sobem da planície para a região montanhosa; Adulão, a terra de Hira, amigo de Judá, fica no mesmo distrito. Nenhum local é consensual, o nome não sobreviveu e nada foi escavado como Enaim; as propostas se distribuem ao longo do Nahal Yarmut e do vale de Elá, e o ponto do mapa é uma escolha entre elas."
  de:
    - "Enajim ist der Ort, an dem Tamar auf Juda wartete. Als sie hörte, dass ihr Schwiegervater zu seinen Schafscherern nach Timna hinaufging, legte sie ihre Witwenkleider ab, verhüllte sich und „setzte sich vor das Tor von Enaim an dem Wege gen Thimnath“; das Hebräische ist petach Enajim, „Eingang von Enajim“, und als Judas Freund kam, um das Pfand einzulösen, fragte er die Männer des Ortes: „Wo ist die Hure, die zu Enaim am Wege saß?“, das heißt in Enajim. Die King-James-Bibel übersetzte den Namen, als wäre er ein Gattungsname; die russische Synodalbibel behält ihn bei, „am Tor von Enajim“. Aus dieser Begegnung ging Perez hervor, der Ahnherr Davids."
    - "Die Stadt wird allgemein für das Enam in Josuas Liste der Schefela gehalten, mit Jarmut, Adullam, Socho und Aseka in den Hügeln um das Elatal genannt, wo Straßen aus der Ebene ins Bergland ansteigen; Adullam, die Heimat von Judas Freund Hira, liegt im selben Bezirk. Kein Ort ist anerkannt, der Name hat nicht überlebt, und nichts ist als Enajim ausgegraben worden; die Vorschläge reichen den Nahal Jarmut und das Elatal entlang, und der Punkt der Karte ist eine Wahl unter ihnen."
  fr:
    - "Énaïm est l’endroit où Tamar attendit Juda. Apprenant que son beau-père montait à Thimna pour la tonte de ses brebis, elle ôta ses habits de veuve, se couvrit d’un voile et « s’assit à l’entrée d’Énaïm, sur le chemin de Thimna » ; l’hébreu est petah Enaïm, « l’entrée d’Énaïm », et quand l’ami de Juda vint dégager le gage, il interrogea les gens du lieu : « Où est cette prostituée qui se tenait à Énaïm, sur le chemin ? », c’est-à-dire à Énaïm. La version du roi Jacques a traduit le nom comme s’il s’agissait d’un nom commun ; la Bible russe synodale le garde, à la porte d’Énaïm. De cette rencontre naquit Pérets, ancêtre de David."
    - "La ville est généralement tenue pour l’Énam de la liste de la Shéphéla de Josué, nommée avec Jarmuth, Adullam, Soco et Azéka dans les collines autour de la vallée d’Éla, où des routes montent de la plaine vers la montagne ; Adullam, patrie de l’ami de Juda, Hira, se trouve dans le même district. Aucun site ne fait l’unanimité, le nom n’a pas survécu, et rien n’a été fouillé comme Énaïm ; les propositions s’étendent le long du Nahal Yarmut et de la vallée d’Éla, et le point de la carte est un choix parmi elles."
  it:
    - "Enaim è il luogo dove Tamar aspettò Giuda. Sentito che il suocero saliva a Timna dai tosatori delle sue pecore, depose le vesti da vedova, si velò e «si pose a sedere alla porta di Enaim, ch’è sulla via di Timna»; l’ebraico è petah Enaim, «l’ingresso di Enaim», e quando l’amico di Giuda venne a riscattare il pegno chiese alla gente del luogo: «Dov’è quella meretrice che stava a Enaim, sulla via?» La King James Version ha tradotto il nome come se fosse un nome comune («open place»); il russo sinodale lo conserva, «alla porta di Enaim». Da quell’incontro nacque Peres, antenato di Davide."
    - "La città si ritiene in genere l’Enam dell’elenco della Sefela di Giosuè, nominata con Iarmut, Adullam, Soco e Azeka sulle alture attorno alla Valle del Terebinto, dove le strade salgono dalla pianura verso la regione collinare; Adullam, patria di Chira, amico di Giuda, si trova nello stesso distretto. Nessun sito è concordato, il nome non è sopravvissuto, e nulla è stato scavato come Enaim; le proposte si distribuiscono lungo il Nahal Yarmut e la Valle del Terebinto, e il punto della mappa è una scelta fra esse."
  pl:
    - "Enajim to miejsce, gdzie Tamar czekała na Judę. Usłyszawszy, że jej teść idzie do strzygących jego owce w Timnie, zdjęła szaty wdowie, okryła się welonem i „usiadła na rozstaniu drogi, która wiedzie do Timnat”; po hebrajsku jest petach Enajim, „wejście do Enajim”, a gdy przyjaciel Judy przyszedł wykupić zastaw, zapytał mężów miejsca: „Gdzie jest nierządnica ona, która była na rozstaniu tej drogi?”, to znaczy w Enajim. Biblia Króla Jakuba oddała nazwę tak, jakby była rzeczownikiem pospolitym; rosyjski synodalny zachowuje ją: „u bramy Enajim”. Z tego spotkania pochodzi Peres, przodek Dawida."
    - "Miasto uważa się zwykle za Enam z wykazu Szefeli Jozuego, wymienione z Jarmut, Adullam, Soko i Azeka we wzgórzach wokół doliny Ela, gdzie drogi wspinają się z równiny ku górskiemu krajowi; Adullam, dom przyjaciela Judy, Chiry, leży w tym samym okręgu. Żadne miejsce nie jest uzgodnione, nazwa nie przetrwała, a nic nie wykopano jako Enajim; propozycje rozciągają się wzdłuż Nachal Jarmut i doliny Ela, a punkt na mapie jest wyborem wśród nich."
  nl:
    - "Enaïm is de plaats waar Tamar op Juda wachtte. Toen zij hoorde dat haar schoonvader naar zijn schaapscheerders te Timna optrok, legde zij haar weduwekleren af, sluierde zich en “zette zich aan den ingang der twee fonteinen, die op den weg naar Timna is”; in het Hebreeuws petach Enaïm, “de ingang van Enaïm”, en toen Juda's vriend het onderpand kwam inlossen, vroeg hij de mannen van de plaats: “Waar is de hoer, die bij deze twee fonteinen aan den weg was?”, dat wil zeggen bij Enaïm. De King James Version vertaalde de naam alsof het een soortnaam was; de Synodale Russische Bijbel behoudt hem, “bij de poort van Enaïm”. Uit die ontmoeting kwam Perez voort, de voorvader van David."
    - "De stad wordt algemeen gezien als het Enam van Jozua's lijst van de Sefela, genoemd met Jarmut, Adullam, Socho en Azeka in de heuvels rond het Ela-dal, waar wegen uit de vlakte naar het bergland klimmen; Adullam, de woonplaats van Juda's vriend Chira, ligt in hetzelfde district. Geen plaats is algemeen aanvaard, de naam is niet bewaard, en niets is als Enaïm opgegraven; voorstellen lopen langs de Nachal Yarmut en het Ela-dal, en het punt op de kaart is een keuze daaruit."
  cs:
    - "Enajim je místo, kde Támar čekala na Judu. Uslyšela, že tchán jde nahoru ke svým střižcům do Timny, svlékla vdovské roucho, zahalila se a „seděla na rozcestí, kudy se jde do Tamnas“; hebrejsky petach Enajim, „vchod do Enajimu“, a když přítel Judův přišel vyplatit zástavu, ptal se mužů toho místa: „Kde jest ta nevěstka, kteráž seděla na rozcestí této cesty?“, to je v Enajimu. Bible krále Jakuba přeložila jméno, jako by šlo o obecné podstatné jméno; synodální ruský text je zachovává, „u brány Enajim“. Z toho setkání vzešel Peres, předek Davidův."
    - "Město se obecně pokládá za Enam ze seznamu Šefely u Jozua, jmenovaný s Jarmutem, Adulamem, Sókó a Azekou v horách kolem Élského údolí, kde cesty stoupají z roviny do pahorkatiny; Adulam, domov Judova přítele Chíry, leží ve stejném okrese. Žádné místo není shodně přijato, jméno se nezachovalo a nic nebylo vykopáno jako Enajim; návrhy se táhnou podél Nahal Yarmut a Élského údolí a bod mapy je volbou mezi nimi."
  sv:
    - "Enajim är platsen där Tamar väntade på Juda. När hon hörde att hennes svärfader var på väg upp till sina fårklippare i Timna lade hon av sig änkekläderna, betäckte sig med en slöja och ”satte sig vid porten till Enaim på vägen till Timna”; på hebreiska står petah Enaim, ”ingången till Enajim”, och när Judas vän kom för att lösa in panten frågade han männen på orten: ”Var är tempeltärnan, hon som satt i Enaim vid vägen?” King James-bibeln översatte namnet som om det vore ett vanligt substantiv; den ryska synodala behåller det, ”vid Enajims port”. Ur det mötet kom Peres, Davids stamfader."
    - "Staden anses i allmänhet vara Enam i Josuas förteckning över Shefela, nämnd med Jarmut, Adullam, Soko och Aseka i bergen kring Terebintdalen, där vägar stiger från slätten mot bergslandet; Adullam, hemorten för Judas vän Hira, ligger i samma distrikt. Ingen plats är vedertagen, namnet har inte överlevt, och inget har grävts ut som Enajim; förslagen sträcker sig längs Nahal Yarmut och Terebintdalen, och kartans punkt är ett val bland dem."
  nb:
    - "Enajim er stedet der Tamar ventet på Juda. Da hun hørte at hennes svigerfar skulle opp til sine saueklippere i Timna, la hun av seg enkeklærne, tilslørte seg og «satte sig ved inngangen til Ena'im, på veien til Timna»; det hebraiske er petah Enaim, «inngangen til Enajim», og da Judas venn kom for å løse ut pantet, spurte han folkene på stedet: «Hvor er skjøgen, hun i Ena'im, ved veien?» King James-oversettelsen oversatte navnet som om det var et appellativ; den russiske synodale beholder det, «ved porten til Enajim». Fra dette møtet kom Peres, Davids stamfar."
    - "Byen regnes vanligvis for å være Enam i Josvas liste over Sjefela, nevnt sammen med Jarmut, Adullam, Soko og Aseka i åsene rundt Ela-dalen, der veier stiger fra sletten mot fjellandet; Adullam, hjemstedet til Judas venn Hira, ligger i samme distrikt. Ingen plass er man enige om, navnet har ikke overlevd, og intet er gravd ut som Enajim; forslagene spenner langs Nahal Yarmut og Ela-dalen, og kartets punkt er et valg blant dem."
  tl:
    - "Ang Enaim ang lugar kung saan naghintay si Tamar kay Juda. Nang marinig niyang aakyat ang kaniyang biyenan sa mga manggugupit ng kaniyang tupa sa Timnath, hinubad niya ang suot ng pagkabao, nagtakip ng lambong at “naupo sa pasukan ng Enaim, na nasa daan ng Timnath”; ang Hebreo ay petah Enaim, “ang pasukan ng Enaim”, at nang dumating ang kaibigan ni Juda upang tubusin ang sanla, itinanong niya sa mga tao sa lugar, “Saan nandoon ang patutot na nasa tabi ng daan sa Enaim?”. Isinalin ng King James Version ang pangalan na tila karaniwang pangngalan; iniingatan ito ng Sinodal na Ruso, “sa pintuan ng Enaim”. Mula sa pagtatagpong iyon ay nagmula si Phares, ninuno ni David."
    - "Karaniwang itinuturing ang bayan na En-am ng talaan ni Josue ng Sephela, na pinangalanan kasama ng Jarmuth, Adullam, Socho at Azeca sa mga burol sa palibot ng libis ng Ela, kung saan umaakyat ang mga daan mula sa kapatagan patungong maburol na lupain; ang Adullam, tahanan ng kaibigan ni Juda na si Hira, ay nasa gayunding distrito. Walang napagkasunduang pook, hindi nanatili ang pangalan, at walang nahukay bilang Enaim; ang mga mungkahi ay mula sa Nahal Yarmut hanggang sa libis ng Ela, at ang punto ng mapa ay pagpili sa kanila."
  da:
    - "Enajim er stedet, hvor Tamar ventede på Juda. Da hun hørte, at hendes svigerfar skulle op til sine fåreklippere i Timna, tog hun sine enkeklæder af, dækkede sig til med et slør og »satte sig ved Indgangen til Enaim, som er paa Vejen til Thimnat«; det hebraiske er petah Enaim, »Enajims indgang«, og da Judas ven kom for at indløse pantet, spurgte han stedets mænd: »Hvor er Skøgen, hun ved Enaim, paa Vejen?« King James-oversættelsen oversatte navnet, som om det var et fællesnavn; den russiske synodalbibel bevarer det: »ved Enajims port«. Af det møde kom Peres, Davids forfader."
    - "Byen antages almindeligvis at være Enajim i Josvas liste over Sjefela, nævnt sammen med Jarmut, Adullam, Soko og Azeka i bjergene omkring Terebintedalen, hvor veje stiger fra sletten mod bjerglandet; Adullam, hjemstedet for Judas ven Hira, ligger i samme distrikt. Intet sted er der enighed om, navnet har ikke overlevet, og intet er udgravet som Enajim; forslagene spænder langs Nahal Yarmut og Terebintedalen, og kortets punkt er et valg blandt dem."
  sr:
    - "Енајим је место где је Тамара чекала Јуду. Чувши да њен свекар иде својим стрижачима оваца у Тамну, скинула је удовичко рухо, покрила се велом и „седе на раскршће на путу који иде у Тамну“; хебрејски је петах Енајим, „улаз Енајима“, а када је Јудин пријатељ дошао да откупи залог, питао је људе тог места: „Где је она курва што је била на раскршћу на овом путу?“, то јест у Енајиму. Превод Краља Џејмса превео је име као да је обична именица; Синодална Библија га задржава, „на вратима Енајима“. Из тог сусрета потекао је Фарес, предак Давидов."
    - "Град се обично схвата као Енам са Исусовог списка Сефеле, наведен са Јармотом, Одоламом, Сохотом и Азиком у брдима око долине Ила, где се путеви пењу из равнице ка брдском крају; Одолам, завичај Јудиног пријатеља Ираса, лежи у истом крају. Ниједно налазиште није усаглашено, име није сачувано и ништа није ископано као Енајим; предлози иду дуж Нахал Јармута и долине Ила, а тачка на карти је избор међу њима."
  hu:
    - "Énájim az a hely, ahol Támár Júdára várt. Amikor meghallotta, hogy apósa Timnába megy juhnyíróihoz, levetette özvegyi ruháját, beburkolózott, és „leűle Enajim kapujába, mely a Thimnába vezető úton van”; a héber petah Enaim, „Énájim bejárata”, és amikor Júda barátja kiváltani jött a zálogot, megkérdezte a hely férfiait: „Hol van az a felavatott parázna nő, a ki Enajim mellett az útfélen vala?”, vagyis Énájimnál. A King James-fordítás a nevet köznévként fordította; a Szinodális orosz megtartja: „Énájim kapujában”. Abból a találkozásból született Pérec, Dávid őse."
    - "A várost általában azonosítják a Józsué-féle sefélái jegyzék Énámjával, amelyet Jarmúttal, Adullámmal, Szókóval és Azekával együtt említenek az Éla-völgy körüli dombok között, ahol az utak a síkságról a hegyvidék felé emelkednek; Adullám, Júda barátja, Hírá otthona ugyanabban a körzetben fekszik. Egyetlen helyet sem fogadtak el, a név nem maradt fenn, és semmit sem ástak ki Énájimként; a javaslatok a Nahal Jarmut és az Éla-völgy mentén szóródnak, és a térkép pontja egy választás közülük."
  fi:
    - "Enaim on paikka, jossa Tamar odotti Juudaa. Kuultuaan appensa lähtevän ylös lampaidensa keritsijöiden luo Timnaan hän riisui leskenvaatteensa, verhoutui huntuun ja ”istui Eenaimin portille, Timnaan vievän tien varteen”; heprea on petah Enaim, ”Enaimin sisäänkäynti”, ja kun Juudan ystävä tuli lunastamaan pantin, hän kysyi paikan miehiltä: ”Missä on se pyhäkköportto, joka istui Eenaimissa tien varressa?” King James -käännös käänsi nimen kuin yleisnimen; venäläinen synodaalikäännös säilyttää sen, ”Enaimin portilla”. Tuosta kohtaamisesta syntyi Peres, Daavidin kantaisä."
    - "Kaupungin katsotaan yleensä olevan Joosuan Sefela-luettelon Enam, mainittu Jarmutin, Adullamin, Sokon ja Asekan kanssa Elan laakson ympäristön kukkuloilla, missä tiet nousevat tasangolta vuoristoon; Adullam, Juudan ystävän Hiran koti, sijaitsee samassa piirissä. Mitään paikkaa ei ole sovittu, nimi ei ole säilynyt, eikä mitään ole kaivettu Enaimina; ehdotukset ulottuvat Nahal Yarmutin ja Elan laakson varrelle, ja kartan piste on valinta niiden joukosta."
  vi:
    - "Ê-na-im là nơi Ta-ma chờ Giu-đa. Nghe tin cha chồng đi lên chỗ những người hớt lông chiên của ông ở Thim-na, nàng cởi áo góa bụa, che mặt và “ngồi trước cửa thành Ê-na-im, bên con đường đi về Thim-na”; tiếng Hê-bơ-rơ là petah Enaim, “lối vào Ê-na-im”, và khi bạn của Giu-đa đến chuộc vật cầm, ông hỏi dân nơi ấy: “Người kỵ nữ khi trước ở ngoài đường nơi cửa thành Ê-na-im đâu rồi?”, tức tại Ê-na-im. Bản King James dịch tên này như thể nó là một danh từ chung; bản Synodal Nga giữ nó, “ở cổng Ê-na-im”. Từ cuộc gặp gỡ ấy sinh ra Phê-rết, tổ tiên của Đa-vít."
    - "Thành thường được coi là Ê-nam trong bảng Sê-phê-la của Giô-suê, được nêu cùng Giạt-mút, A-đu-lam, Sô-cô và A-xê-ca trong vùng đồi quanh thung lũng Ê-la, nơi các con đường leo từ đồng bằng lên vùng đồi núi; A-đu-lam, quê của bạn Giu-đa là Hi-ra, nằm trong cùng khu vực. Chưa thống nhất địa điểm nào, tên không còn tồn tại, và chưa có gì được khai quật là Ê-na-im; các đề nghị trải dọc Nahal Yarmut và thung lũng Ê-la, và điểm trên bản đồ là một lựa chọn trong số đó."
  ro:
    - "Enaim este locul unde l-a așteptat Tamar pe Iuda. Auzind că socrul ei urcă la tunzătorii lui de la Timna, ea și-a lepădat hainele de văduvă, s-a învăluit și „a șezut la porțile Enanului, care este în calea Tamnei”; ebraica are petah Enaim, „intrarea Enaimului”, iar când prietenul lui Iuda a venit să răscumpere zălogul, a întrebat oamenii locului: „unde este curva care a fost în Enan lângă cale?”, adică la Enaim. King James Version a tradus numele ca și cum ar fi fost un substantiv comun; textul sinodal rus îl păstrează, „la poarta Enaimului”. Din acea întâlnire s-a născut Pereț, strămoșul lui David."
    - "Cetatea este socotită în general Enam din lista Șefelei a lui Iosua, numită cu Iarmut, Adulam, Soco și Azeca în dealurile din jurul văii Ela, unde drumurile urcă din câmpie spre ținutul muntos; Adulam, patria lui Hira, prietenul lui Iuda, se află în același district. Niciun loc nu este unanim acceptat, numele nu a supraviețuit, iar nimic nu a fost săpat ca Enaim; propunerile se întind de-a lungul Nahal Yarmut și al văii Ela, iar punctul de pe hartă este o alegere dintre ele."
  bg:
    - "Енаим е мястото, където Тамар чакала Юда. Като чула, че свекър ѝ се изкачва при стригачите на овцете си в Тимна, тя съблякла вдовишките си дрехи, забулила се и „седна при прехода на Енаим, който е при пътя на Тамна“; на иврит е петах Енаим, „входът на Енаим“, и когато приятелят на Юда дошъл да откупи залога, той попитал мъжете от мястото: „Де е блудницата която беше при Енаим на пътя?“ Библията на крал Джеймс превела името, сякаш е нарицателно съществително; руският Синодален превод го запазва: „при вратата на Енаим“. От онази среща произлязъл Фарес, прадедът на Давид."
    - "Градът обикновено се смята за Енам от списъка на Шефела в книгата Иисус Навин, назован с Ярмут, Одолам, Сохо и Азека в хълмовете около долината Ела, където пътищата се изкачват от равнината към планинската област; Одолам, родното място на приятеля на Юда Хира, лежи в същия окръг. Няма съгласие за мястото, името не е оцеляло и нищо не е разкопано като Енаим; предложенията се простират покрай Нахал Ярмут и долината Ела, а точката на картата е избор между тях."
