# Overview article (ADR 0007). Mainstream facts only; a minor place: the equation with Enam is the usual view and is given as such; no site.
id: enaim
place: a59fdf2
title:
  en: "Enaim"
  ru: "Енаим"
body:
  en:
    - "Enaim is the place where Tamar waited for Judah. Hearing that her father-in-law was going up to his sheepshearers at Timnah, she put off her widow's garments, veiled herself and “sat in an open place, which is by the way to Timnath”; the Hebrew is petah Enaim, “the entrance of Enaim”, and when Judah's friend came to redeem the pledge he asked the men of the place, “Where is the harlot, that was openly by the way side?”, that is, at Enaim. The King James Version translated the name as if it were a common noun; the Synodal Russian keeps it, “at the gate of Enaim”. From that meeting came Perez, the ancestor of David."
    - "The town is generally taken to be the Enam of Joshua's list of the Shephelah, named with Jarmuth, Adullam, Socoh and Azekah in the hills about the Elah valley, where roads climb from the plain toward the hill country; Adullam, the home of Judah's friend Hirah, lies in the same district. No site is agreed, the name has not survived, and nothing has been excavated as Enaim; proposals range along Nahal Yarmut and the Elah valley, and the map's point is a choice among them."
  ru:
    - "Енаим — место, где Фамарь ждала Иуду. Услышав, что свёкор идёт стричь овец своих в Фамну, она сняла одежду вдовства, покрылась покрывалом и «села у ворот Енаима, что на дороге в Фамну»; по-еврейски это «петах Енаим», «вход в Енаим», и когда друг Иуды пришёл выкупить залог, он спросил жителей того места: «где блудница, которая была в Енаиме при дороге?». Английская Библия короля Иакова перевела имя как нарицательное, «на открытом месте»; Синодальный перевод его сохраняет. От той встречи родился Фарес, предок Давида."
    - "Город обычно считают Гаенамом из списка Шефелы в книге Иисуса Навина, названным вместе с Иармуфом, Одолламом, Сохо и Азекой в холмах у долины дуба, где дороги поднимаются с равнины в горы; Одоллам, откуда был Хира, друг Иуды, лежит в том же округе. Место не установлено, имя не сохранилось, и ничего не раскопано как Енаим; предложения тянутся вдоль Нахаль-Ярмут и долины дуба, и точка на карте — выбор среди них."
scripture:
