# Overview article (ADR 0007). Mainstream facts only; the portico is placed on the east side of the Temple Mount as Josephus does; the age of the eastern wall's older masonry is given as debated.
id: solomons-portico
place: a47c817
title:
  en: "Solomon’s Portico"
  ru: "Притвор Соломонов"
  uk: "Соломонів портик"
  es: "Pórtico de Salomón"
  pt: "Pórtico de Salomão"
  de: "Halle Salomos"
  fr: "Portique de Salomon"
body:
  en:
    - "Solomon's Portico was the colonnade that ran along the east side of the outer court of the Temple in Jerusalem, above the Kidron valley and facing the Mount of Olives. Josephus tells that when Herod rebuilt the Temple he surrounded its vast platform with roofed porticoes, double rows of white marble columns twenty-five cubits high under ceilings of carved cedar, and that the eastern one kept the name of Solomon: the people, he says, asked King Agrippa II to rebuild this eastern portico, the work of Solomon, and the king refused, since it would take long and cost great sums; in the Jewish War he says that Solomon himself had walled the eastern side of the hill. Whether anything of the first Temple stood there is doubtful, but the eastern wall is the one side that Herod did not rebuild from the ground, and its older masonry gave the portico its name."
    - "Here Jesus was walking at the feast of the Dedication, in winter, when the Jews gathered round him and asked whether he was the Christ, and tried to stone him for saying “I and my Father are one”: “And Jesus walked in the temple in Solomon's porch.” After Peter and John healed the lame man at the Beautiful Gate, “all the people ran together unto them in the porch that is called Solomon's, greatly wondering”, and Peter preached to them there. The portico became the apostles' meeting place: “by the hands of the apostles were many signs and wonders wrought among the people”, and “they were all with one accord in Solomon's porch”, while no outsider dared to join them, though the people held them in honour."
    - "Nothing of the colonnade stands. The eastern wall of the Temple Mount is still the Herodian line, and about 32 m north of its south-eastern corner a straight seam in the masonry shows where Herod's extension was joined to an older wall, of the Hasmoneans or earlier, which scholars dispute; the portico ran above it. The Golden Gate of the Byzantine or early Islamic period now breaks the wall, a Muslim cemetery lies at its foot, and the platform above is the Haram al-Sharif, where the eastern colonnade is remembered only in the texts."
  ru:
    - "Притвор Соломонов — колоннада, тянувшаяся вдоль восточной стороны внешнего двора храма в Иерусалиме, над Кедронской долиной, напротив горы Елеонской. Иосиф Флавий рассказывает, что Ирод, перестраивая храм, окружил его огромную площадку крытыми притворами — двойными рядами беломраморных колонн высотой в двадцать пять локтей под потолками из резного кедра — и что восточный притвор сохранил имя Соломона: народ, по его словам, просил царя Агриппу II перестроить этот восточный притвор, дело рук Соломона, но царь отказал, потому что работа заняла бы много времени и стоила бы огромных денег; в «Иудейской войне» он говорит, что сам Соломон обнёс стеной восточную сторону горы. Стояло ли там что-нибудь от первого храма, сомнительно, но восточная стена — единственная сторона, которую Ирод не перестраивал с основания, и её более древняя кладка дала притвору имя."
    - "Здесь Иисус ходил в праздник обновления, зимой, когда Иудеи обступили Его и спросили, не Он ли Христос, и хотели побить Его камнями за слова «Я и Отец — одно»: «И ходил Иисус в храме, в притворе Соломоновом». После того как Пётр и Иоанн исцелили хромого у Красных ворот, «весь народ в изумлении сбежался к ним в притвор, называемый Соломонов», и Пётр там проповедовал. Притвор стал местом собраний апостолов: «Руками же Апостолов совершались в народе многие знамения и чудеса; и все единодушно пребывали в притворе Соломоновом», а из посторонних никто не смел пристать к ним, народ же прославлял их."
    - "От колоннады ничего не осталось. Восточная стена Храмовой горы по сей день идёт по иродовой линии, и примерно в 32 м к северу от её юго-восточного угла прямой шов в кладке показывает, где пристройка Ирода примкнула к более древней стене — хасмонейской или ещё старше, о чём учёные спорят; притвор шёл над ней. Теперь стену прорезают Золотые ворота византийского или раннеисламского времени, у её подножия лежит мусульманское кладбище, а площадка наверху — Харам-аш-Шариф, где о восточной колоннаде напоминают только тексты."
  uk:
    - "Соломонів портик — це колонада, що тяглася вздовж східного боку зовнішнього подвір’я Храму в Єрусалимі, над долиною Кедрону, обличчям до Оливкової гори. Йосиф Флавій розповідає, що, відбудовуючи Храм, Ірод оточив його величезну платформу критими портиками — подвійними рядами колон з білого мармуру заввишки двадцять п’ять ліктів під стелями з різьбленого кедра — і що східний зберіг ім’я Соломона: народ, каже він, просив царя Агриппу II відбудувати цей східний портик, діло Соломона, і цар відмовив, бо це забрало б багато часу й коштувало величезних грошей; у «Юдейській війні» він пише, що сам Соломон обніс муром східний бік пагорба. Чи стояло там щось із першого Храму — сумнівно, але східна стіна — єдиний бік, який Ірод не відбудовував з основ, і її старіша кладка дала портику назву."
    - "Тут ходив Ісус на свято Оновлення, взимку, коли юдеї обступили Його й питали, чи Він Христос, і хотіли побити Його камінням за слова «Я і Отець одно»: «І ходив Ісус по церкві у Соломоновім ходнику». Після того як Петро та Іван зцілили кульгавого біля Прекрасних воріт, «збіг ся до них увесь народ у ходник званий Соломонів, дивуючись», і Петро проповідував їм там. Портик став місцем зібрання апостолів: «Руками ж апостолськими дїялись ознаки й чудеса в народї многі», і «були однодушні всї в ходнику Соломоновім», а з сторонніх ніхто не наважувався приєднатися до них, хоча народ їх шанував."
    - "Від колонади не лишилося нічого. Східна стіна Храмової гори досі лежить на іродіанській лінії, і приблизно за 32 м на північ від її південно-східного кута пряма шпара в кладці показує, де продовження Ірода приєднали до старішої стіни — хасмонейської чи ще давнішої, що вчені оспорюють; портик здіймався над нею. Золоті ворота візантійської чи ранньоісламської доби тепер розривають стіну, біля її підніжжя лежить мусульманський цвинтар, а платформа над нею — Харам аш-Шариф, де східну колонаду пам’ятають лише в текстах."
  es:
    - "El Pórtico de Salomón era la columnata del lado oriental del atrio exterior del Templo de Jerusalén, sobre el valle del Cedrón y frente al Monte de los Olivos. Josefo cuenta que, cuando Herodes reconstruyó el Templo, rodeó su enorme explanada con pórticos cubiertos, dobles hileras de columnas de mármol blanco de veinticinco codos de altura bajo techos de cedro tallado, y que el oriental conservó el nombre de Salomón: el pueblo, dice, pidió al rey Agripa II que reconstruyera este pórtico oriental, obra de Salomón, y el rey se negó, porque llevaría mucho tiempo y costaría grandes sumas; en la Guerra de los judíos dice que el propio Salomón amuralló el lado oriental de la colina. Es dudoso que allí se mantuviera algo del primer Templo, pero el muro oriental es el único lado que Herodes no reconstruyó desde los cimientos, y su mampostería más antigua dio nombre al pórtico."
    - "Aquí andaba Jesús en la fiesta de la Dedicación, en invierno, cuando los judíos se reunieron en torno a él y le preguntaron si era el Cristo, y trataron de apedrearlo por decir «Yo y el Padre una cosa somos»: «Y Jesús andaba en el templo por el portal de Salomón». Después de que Pedro y Juan sanaron al cojo en la Puerta la Hermosa, «todo el pueblo concurrió á ellos al pórtico que se llama de Salomón, atónitos», y Pedro les predicó allí. El pórtico se convirtió en el lugar de reunión de los apóstoles: «por las manos de los apóstoles eran hechos muchos milagros y prodigios en el pueblo», y «estaban todos unánimes en el pórtico de Salomón», mientras ningún extraño osaba juntarse con ellos, aunque el pueblo los tenía en honor."
    - "De la columnata no queda nada en pie. El muro oriental del Monte del Templo sigue siendo la línea herodiana, y a unos 32 m al norte de su esquina sudoriental una junta recta en la mampostería muestra dónde la ampliación de Herodes se unió a un muro más antiguo, de los asmoneos o anterior, lo que los estudiosos discuten; el pórtico corría por encima de él. La Puerta Dorada, de época bizantina o islámica temprana, rompe ahora el muro, un cementerio musulmán yace a su pie, y la explanada de arriba es el Haram al-Sharif, donde la columnata oriental solo se recuerda en los textos."
  pt:
    - "O Pórtico de Salomão era a colunata que corria ao longo do lado leste do pátio externo do Templo, em Jerusalém, acima do vale do Cedrom e de frente para o Monte das Oliveiras. Josefo conta que, quando Herodes reconstruiu o Templo, cercou sua vasta plataforma com pórticos cobertos, de fileiras duplas de colunas de mármore branco com vinte e cinco côvados de altura, sob tetos de cedro entalhado, e que o oriental conservava o nome de Salomão: o povo, diz ele, pediu ao rei Agripa II que reconstruísse esse pórtico oriental, obra de Salomão, e o rei recusou, porque demoraria e custaria grandes somas; na Guerra Judaica ele diz que o próprio Salomão havia murado o lado leste da colina. É duvidoso que algo do primeiro Templo estivesse ali, mas o muro oriental é o único lado que Herodes não reconstruiu desde o chão, e sua alvenaria mais antiga deu nome ao pórtico."
    - "Aqui Jesus caminhava na festa da Dedicação, no inverno, quando os judeus o rodearam e perguntaram se era o Cristo, e tentaram apedrejá-lo por dizer “Eu e o Pai somos um”: “Jesus estava caminhando no templo, no pórtico de Salomão.” Depois que Pedro e João curaram o coxo à Porta Formosa, “todo o povo correu para eles, no pórtico chamado de Salomão, profundamente admirado”, e Pedro pregou-lhes ali. O pórtico tornou-se o ponto de encontro dos apóstolos: “Por meio dos apóstolos, muitos sinais e maravilhas eram realizados entre o povo”, e “todos estavam unânimes no Pórtico de Salomão”, embora nenhum de fora ousasse juntar-se a eles, ainda que o povo os tivesse em honra."
    - "Nada da colunata permanece de pé. O muro oriental do Monte do Templo ainda segue a linha herodiana e, a cerca de 32 m ao norte de seu canto sudeste, uma junta reta na alvenaria mostra onde a ampliação de Herodes foi unida a um muro mais antigo, dos hasmoneus ou anterior, o que os estudiosos discutem; o pórtico corria acima dele. A Porta Dourada, do período bizantino ou islâmico antigo, interrompe agora o muro, um cemitério muçulmano jaz a seus pés, e a plataforma acima é o Haram al-Sharif, onde a colunata oriental é lembrada apenas nos textos."
  de:
    - "Die Halle Salomos war die Säulenhalle an der Ostseite des äußeren Vorhofs des Tempels in Jerusalem, oberhalb des Kidrontals und dem Ölberg zugewandt. Josephus berichtet, Herodes habe beim Neubau des Tempels dessen riesige Plattform mit überdachten Säulenhallen umgeben, doppelten Reihen weißer Marmorsäulen von fünfundzwanzig Ellen Höhe unter geschnitzten Zedernholzdecken, und die östliche habe den Namen Salomos behalten: Das Volk, sagt er, bat König Agrippa II., diese östliche Halle, das Werk Salomos, wieder aufzubauen, doch der König lehnte ab, da es lange dauern und große Summen kosten würde; im Jüdischen Krieg sagt er, Salomo selbst habe die Ostseite des Hügels ummauert. Ob dort etwas vom ersten Tempel stand, ist zweifelhaft, aber die Ostmauer ist die eine Seite, die Herodes nicht von Grund auf neu baute, und ihr älteres Mauerwerk gab der Halle den Namen."
    - "Hier ging Jesus am Tempelweihfest, im Winter, umher, als die Juden ihn umringten und fragten, ob er der Christus sei, und ihn steinigen wollten, weil er sagte: „Ich und der Vater sind eins“: „Und Jesus wandelte im Tempel in der Halle Salomos.“ Nachdem Petrus und Johannes an der Schönen Pforte den Lahmen geheilt hatten, „lief alles Volk zu ihnen in die Halle, die da heißt Salomos, und wunderten sich“, und Petrus predigte ihnen dort. Die Halle wurde zum Treffpunkt der Apostel: „Es geschahen aber viel Zeichen und Wunder im Volk durch der Apostel Hände“, und „sie waren alle in der Halle Salomos einmütig“, während keiner der anderen wagte, sich ihnen anzuschließen, obwohl das Volk sie in hohen Ehren hielt."
    - "Von der Säulenhalle steht nichts mehr. Die Ostmauer des Tempelbergs folgt noch der herodianischen Linie, und etwa 32 m nördlich ihrer südöstlichen Ecke zeigt eine gerade Fuge im Mauerwerk, wo Herodes' Erweiterung an eine ältere Mauer anschloss, hasmonäisch oder früher, was die Forschung unterschiedlich beurteilt; die Halle verlief oberhalb davon. Das Goldene Tor der byzantinischen oder frühislamischen Zeit durchbricht heute die Mauer, ein muslimischer Friedhof liegt an ihrem Fuß, und die Plattform darüber ist der Haram al-Sharif, wo die östliche Säulenhalle nur noch in den Texten erinnert wird."
  fr:
    - "Le Portique de Salomon était la colonnade qui longeait le côté est du parvis extérieur du Temple de Jérusalem, au-dessus de la vallée du Cédron et face au mont des Oliviers. Josèphe raconte qu’en rebâtissant le Temple, Hérode entoura sa vaste plate-forme de portiques couverts, doubles rangées de colonnes de marbre blanc hautes de vingt-cinq coudées sous des plafonds de cèdre sculpté, et que celui de l’est garda le nom de Salomon : le peuple, dit-il, demanda au roi Agrippa II de rebâtir ce portique oriental, œuvre de Salomon, et le roi refusa, car cela serait long et coûteux ; dans la Guerre des Juifs, il dit que Salomon lui-même avait muré le côté est de la colline. On doute que quoi que ce soit du premier Temple s’y soit dressé, mais le mur oriental est le seul côté qu’Hérode n’ait pas rebâti depuis le sol, et sa maçonnerie plus ancienne donna son nom au portique."
    - "Jésus s’y promenait à la fête de la Dédicace, en hiver, quand les Juifs l’entourèrent pour lui demander s’il était le Christ, et cherchèrent à le lapider pour avoir dit « Moi et le Père nous sommes un » : « Jésus se promenait dans le temple, sous le portique de Salomon. » Après que Pierre et Jean eurent guéri le boiteux à la porte Belle, « tout le peuple étonné accourut vers eux, au portique dit de Salomon », et Pierre leur y prêcha. Le portique devint le lieu de réunion des apôtres : « beaucoup de miracles et de prodiges se faisaient au milieu du peuple par les mains des apôtres. Ils se tenaient tous ensemble au portique de Salomon », et aucun autre n’osait se joindre à eux, bien que le peuple les louât hautement."
    - "Rien de la colonnade ne subsiste. Le mur est du mont du Temple suit toujours la ligne hérodienne, et à environ 32 m au nord de son angle sud-est, une jointure rectiligne dans la maçonnerie montre où l’extension d’Hérode fut raccordée à un mur plus ancien, hasmonéen ou antérieur, ce que les spécialistes discutent ; le portique courait au-dessus. La Porte Dorée, de l’époque byzantine ou du début de l’époque islamique, interrompt désormais le mur, un cimetière musulman s’étend à son pied, et la plate-forme au-dessus est le Haram al-Sharif, où la colonnade orientale n’est plus évoquée que dans les textes."
scripture:
  - John.10.22-John.10.30
  - Acts.3.1-Acts.3.12
  - Acts.5.12-Acts.5.13
