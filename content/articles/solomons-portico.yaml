body:
  en:
    - "Solomon's Portico was the colonnade that ran along the east side of the outer court of the Temple in Jerusalem, above the Kidron valley and facing the Mount of Olives. Josephus tells that when Herod rebuilt the Temple he surrounded its vast platform with roofed porticoes, double rows of white marble columns twenty-five cubits high under ceilings of carved cedar, and that the eastern one kept the name of Solomon: the people, he says, asked King Agrippa II to rebuild this eastern portico, the work of Solomon, and the king refused, since it would take long and cost great sums; in the Jewish War he says that Solomon himself had walled the eastern side of the hill. Whether anything of the first Temple stood there is doubtful, but the eastern wall is the one side that Herod did not rebuild from the ground, and its older masonry probably explains why the portico bore his name."
    - "Here Jesus was walking at the feast of the Dedication, in winter, when the Jews gathered round him and asked whether he was the Christ, and tried to stone him for saying “I and my Father are one”: “And Jesus walked in the temple in Solomon's porch.” After Peter and John healed the lame man at the Beautiful Gate, “all the people ran together unto them in the porch that is called Solomon's, greatly wondering”, and Peter preached to them there. The portico became the apostles' meeting place: “by the hands of the apostles were many signs and wonders wrought among the people”, and “they were all with one accord in Solomon's porch”, while no outsider dared to join them, though the people held them in honour."
    - "Nothing of the colonnade stands. The eastern wall of the Temple Mount is still the Herodian line, and about 32 m north of its south-eastern corner a straight seam in the masonry shows where Herod's extension was joined to an older wall, of the Hasmoneans or earlier, which scholars dispute; the portico ran above it. The Golden Gate of the Byzantine or early Islamic period now breaks the wall, a Muslim cemetery lies at its foot, and the platform above is the Haram al-Sharif, where the eastern colonnade is remembered only in the texts."
  ru:
    - "Притвор Соломонов — колоннада, тянувшаяся вдоль восточной стороны внешнего двора храма в Иерусалиме, над Кедронской долиной, напротив горы Елеонской. Иосиф Флавий рассказывает, что Ирод, перестраивая храм, окружил его огромную площадку крытыми притворами — двойными рядами беломраморных колонн высотой в двадцать пять локтей под потолками из резного кедра — и что восточный притвор сохранил имя Соломона: народ, по его словам, просил царя Агриппу II перестроить этот восточный притвор, дело рук Соломона, но царь отказал, потому что работа была бы долгой и дорогой; в «Иудейской войне» он говорит, что сам Соломон обнёс стеной восточную сторону горы. Стояло ли там что-нибудь от первого храма, сомнительно, но восточная стена — единственная сторона, которую Ирод не перестраивал с основания, и её более древняя кладка, вероятно, объясняет, почему притвор носил имя Соломона."
    - "Здесь Иисус ходил в праздник обновления, зимой, когда Иудеи обступили Его и спросили, не Он ли Христос, и хотели побить Его камнями за слова «Я и Отец — одно»: «И ходил Иисус в храме, в притворе Соломоновом». После того как Пётр и Иоанн исцелили хромого у Красных ворот, «весь народ в изумлении сбежался к ним в притвор, называемый Соломонов», и Пётр там проповедовал. Притвор стал местом собраний апостолов: «Руками же Апостолов совершались в народе многие знамения и чудеса; и все единодушно пребывали в притворе Соломоновом», а из посторонних никто не смел пристать к ним, народ же прославлял их."
    - "От колоннады ничего не осталось. Восточная стена Храмовой горы по сей день идёт по иродовой линии, и примерно в 32 м к северу от её юго-восточного угла прямой шов в кладке показывает, где пристройка Ирода примкнула к более древней стене — хасмонейской или ещё старше, о чём учёные спорят; притвор шёл над ней. Теперь стену прорезают Золотые ворота византийского или раннеисламского времени, у её подножия лежит мусульманское кладбище, а площадка наверху — Харам-аш-Шариф, где о восточной колоннаде напоминают только тексты."
  uk:
    - "Соломонів портик — це колонада, що тяглася вздовж східного боку зовнішнього подвір’я Храму в Єрусалимі, над долиною Кедрону, обличчям до Оливкової гори. Йосиф Флавій розповідає, що, відбудовуючи Храм, Ірод оточив його величезну платформу критими портиками — подвійними рядами колон з білого мармуру заввишки двадцять п’ять ліктів під стелями з різьбленого кедра — і що східний зберіг ім’я Соломона: народ, каже він, просив царя Агриппу II відбудувати цей східний портик, діло Соломона, і цар відмовив, бо це забрало б багато часу й коштувало величезних грошей; у «Юдейській війні» він пише, що сам Соломон обніс муром східний бік пагорба. Чи стояло там щось із першого Храму — сумнівно, але східна стіна — єдиний бік, який Ірод не відбудовував з основ, і її старіша кладка, ймовірно, пояснює, чому портик носив ім’я Соломона."
    - "Тут ходив Ісус на свято Оновлення, взимку, коли юдеї обступили Його й питали, чи Він Христос, і хотіли побити Його камінням за слова «Я і Отець одно»: «І ходив Ісус по церкві у Соломоновім ходнику». Після того як Петро та Іван зцілили кульгавого біля Прекрасних воріт, «збіг ся до них увесь народ у ходник званий Соломонів, дивуючись», і Петро проповідував їм там. Портик став місцем зібрання апостолів: «Руками ж апостолськими дїялись ознаки й чудеса в народї многі», і «були однодушні всї в ходнику Соломоновім», а з сторонніх ніхто не наважувався приєднатися до них, хоча народ їх шанував."
    - "Від колонади не лишилося нічого. Східна стіна Храмової гори досі лежить на іродіанській лінії, і приблизно за 32 м на північ від її південно-східного кута пряма шпара в кладці показує, де продовження Ірода приєднали до старішої стіни — хасмонейської чи ще давнішої, що вчені оспорюють; портик здіймався над нею. Золоті ворота візантійської чи ранньоісламської доби тепер розривають стіну, біля її підніжжя лежить мусульманський цвинтар, а платформа над нею — Харам аш-Шариф, де східну колонаду пам’ятають лише в текстах."
  es:
    - "El Pórtico de Salomón era la columnata del lado oriental del atrio exterior del Templo de Jerusalén, sobre el valle del Cedrón y frente al Monte de los Olivos. Josefo cuenta que, cuando Herodes reconstruyó el Templo, rodeó su enorme explanada con pórticos cubiertos, dobles hileras de columnas de mármol blanco de veinticinco codos bajo techos de cedro tallado, y que el oriental conservó el nombre de Salomón: el pueblo, dice, pidió al rey Agripa II que reconstruyera este pórtico oriental, obra de Salomón, y el rey se negó, por lo largo y costoso de la obra; en la Guerra de los judíos dice que el propio Salomón amuralló el lado oriental de la colina. Es dudoso que allí se mantuviera algo del primer Templo, pero el muro oriental es el único lado que Herodes no reconstruyó desde los cimientos, y su mampostería más antigua probablemente explica por qué el pórtico llevaba su nombre."
    - "Aquí andaba Jesús en la fiesta de la Dedicación, en invierno, cuando los judíos se reunieron en torno a él y le preguntaron si era el Cristo, y trataron de apedrearlo por decir «Yo y el Padre una cosa somos»: «Y Jesús andaba en el templo por el portal de Salomón». Después de que Pedro y Juan sanaron al cojo en la Puerta la Hermosa, «todo el pueblo concurrió á ellos al pórtico que se llama de Salomón, atónitos», y Pedro les predicó allí. El pórtico se convirtió en el lugar de reunión de los apóstoles: «por las manos de los apóstoles eran hechos muchos milagros y prodigios en el pueblo», y «estaban todos unánimes en el pórtico de Salomón», mientras ningún extraño osaba juntarse con ellos, aunque el pueblo los tenía en honor."
    - "De la columnata no queda nada en pie. El muro oriental del Monte del Templo sigue siendo la línea herodiana, y a unos 32 m al norte de su esquina sudoriental una junta recta en la mampostería muestra dónde la ampliación de Herodes se unió a un muro más antiguo, de los asmoneos o anterior, lo que los estudiosos discuten; el pórtico corría por encima de él. La Puerta Dorada, de época bizantina o islámica temprana, rompe ahora el muro, un cementerio musulmán yace a su pie, y la explanada de arriba es el Haram al-Sharif, donde la columnata oriental solo se recuerda en los textos."
  pt:
    - "O Pórtico de Salomão era a colunata ao longo do lado leste do pátio externo do Templo, em Jerusalém, acima do vale do Cedrom e de frente para o Monte das Oliveiras. Josefo conta que, quando Herodes reconstruiu o Templo, cercou sua vasta plataforma com pórticos cobertos, de fileiras duplas de colunas de mármore branco com vinte e cinco côvados de altura, sob tetos de cedro entalhado, e que o oriental conservava o nome de Salomão: o povo, diz ele, pediu ao rei Agripa II que reconstruísse esse pórtico oriental, obra de Salomão, e o rei recusou, porque demoraria e custaria grandes somas; na Guerra Judaica ele diz que o próprio Salomão murara o lado leste da colina. É duvidoso que algo do primeiro Templo estivesse ali, mas o muro oriental é o único lado que Herodes não reconstruiu desde o chão, e sua alvenaria mais antiga provavelmente explica por que o pórtico levava o seu nome."
    - "Aqui Jesus caminhava na festa da Dedicação, no inverno, quando os judeus o rodearam e perguntaram se era o Cristo, e tentaram apedrejá-lo por dizer “Eu e o Pai somos um”: “Jesus estava caminhando no templo, no pórtico de Salomão.” Depois que Pedro e João curaram o coxo à Porta Formosa, “todo o povo correu para eles, no pórtico chamado de Salomão, profundamente admirado”, e Pedro pregou-lhes ali. O pórtico tornou-se o ponto de encontro dos apóstolos: “Por meio dos apóstolos, muitos sinais e maravilhas eram realizados entre o povo”, e “todos estavam unânimes no Pórtico de Salomão”, embora nenhum de fora ousasse juntar-se a eles, ainda que o povo os tivesse em honra."
    - "Nada da colunata permanece de pé. O muro oriental do Monte do Templo ainda segue a linha herodiana e, a cerca de 32 m ao norte de seu canto sudeste, uma junta reta na alvenaria mostra onde a ampliação de Herodes foi unida a um muro mais antigo, dos hasmoneus ou anterior, o que os estudiosos discutem; o pórtico corria acima dele. A Porta Dourada, do período bizantino ou islâmico antigo, interrompe agora o muro, um cemitério muçulmano jaz a seus pés, e a plataforma acima é o Haram al-Sharif, onde a colunata oriental é lembrada apenas nos textos."
  de:
    - "Die Halle Salomos war die Säulenhalle an der Ostseite des äußeren Vorhofs des Tempels in Jerusalem, oberhalb des Kidrontals und dem Ölberg zugewandt. Josephus berichtet, Herodes habe beim Neubau des Tempels dessen riesige Plattform mit überdachten Säulenhallen umgeben, doppelten Reihen weißer Marmorsäulen von fünfundzwanzig Ellen Höhe unter geschnitzten Zedernholzdecken, und die östliche habe den Namen Salomos behalten: Das Volk, sagt er, bat König Agrippa II., diese östliche Halle, das Werk Salomos, wieder aufzubauen, doch der König lehnte ab, da es lange dauern und große Summen kosten würde; im Jüdischen Krieg sagt er, Salomo selbst habe die Ostseite des Hügels ummauert. Ob dort etwas vom ersten Tempel stand, ist zweifelhaft, aber die Ostmauer ist die eine Seite, die Herodes nicht von Grund auf neu baute, und ihr älteres Mauerwerk erklärt wohl, warum die Halle seinen Namen trug."
    - "Hier ging Jesus am Tempelweihfest, im Winter, umher, als die Juden ihn umringten und fragten, ob er der Christus sei, und ihn steinigen wollten, weil er sagte: „Ich und der Vater sind eins“: „Und Jesus wandelte im Tempel in der Halle Salomos.“ Nachdem Petrus und Johannes an der Schönen Pforte den Lahmen geheilt hatten, „lief alles Volk zu ihnen in die Halle, die da heißt Salomos, und wunderten sich“, und Petrus predigte ihnen dort. Die Halle wurde zum Treffpunkt der Apostel: „Es geschahen aber viel Zeichen und Wunder im Volk durch der Apostel Hände“, und „sie waren alle in der Halle Salomos einmütig“, während keiner der anderen wagte, sich ihnen anzuschließen, obwohl das Volk sie in hohen Ehren hielt."
    - "Von der Säulenhalle steht nichts mehr. Die Ostmauer des Tempelbergs folgt noch der herodianischen Linie, und etwa 32 m nördlich ihrer südöstlichen Ecke zeigt eine gerade Fuge im Mauerwerk, wo Herodes' Erweiterung an eine ältere Mauer anschloss, hasmonäisch oder früher, was die Forschung unterschiedlich beurteilt; die Halle verlief oberhalb davon. Das Goldene Tor der byzantinischen oder frühislamischen Zeit durchbricht heute die Mauer, ein muslimischer Friedhof liegt an ihrem Fuß, und die Plattform darüber ist der Haram al-Sharif, wo die östliche Säulenhalle nur noch in den Texten erinnert wird."
  fr:
    - "Le Portique de Salomon était la colonnade longeant le côté est du parvis extérieur du Temple de Jérusalem, au-dessus de la vallée du Cédron et face au mont des Oliviers. Josèphe raconte qu’en rebâtissant le Temple, Hérode entoura sa vaste plate-forme de portiques couverts, doubles rangées de colonnes de marbre blanc hautes de vingt-cinq coudées sous des plafonds de cèdre sculpté, et que celui de l’est garda le nom de Salomon : le peuple, dit-il, demanda au roi Agrippa II de rebâtir ce portique oriental, œuvre de Salomon, et le roi refusa, car cela serait long et coûteux ; dans la Guerre des Juifs, il dit que Salomon lui-même avait muré le côté est de la colline. On doute que rien du premier Temple s’y soit dressé, mais le mur oriental est le seul côté qu’Hérode n’ait pas rebâti depuis le sol, et sa maçonnerie plus ancienne explique probablement pourquoi le portique portait son nom."
    - "Jésus s’y promenait à la fête de la Dédicace, en hiver, quand les Juifs l’entourèrent pour lui demander s’il était le Christ, et cherchèrent à le lapider pour avoir dit « Moi et le Père nous sommes un » : « Jésus se promenait dans le temple, sous le portique de Salomon. » Après que Pierre et Jean eurent guéri le boiteux à la porte Belle, « tout le peuple étonné accourut vers eux, au portique dit de Salomon », et Pierre leur y prêcha. Le portique devint le lieu de réunion des apôtres : « beaucoup de miracles et de prodiges se faisaient au milieu du peuple par les mains des apôtres. Ils se tenaient tous ensemble au portique de Salomon », et aucun autre n’osait se joindre à eux, bien que le peuple les louât hautement."
    - "Rien de la colonnade ne subsiste. Le mur est du mont du Temple suit toujours la ligne hérodienne, et à environ 32 m au nord de son angle sud-est, une jointure rectiligne dans la maçonnerie montre où l’extension d’Hérode fut raccordée à un mur plus ancien, hasmonéen ou antérieur, ce que les spécialistes discutent ; le portique courait au-dessus. La Porte Dorée, de l’époque byzantine ou du début de l’époque islamique, interrompt désormais le mur, un cimetière musulman s’étend à son pied, et la plate-forme au-dessus est le Haram al-Sharif, où la colonnade orientale n’est plus évoquée que dans les textes."
  pl:
    - "Krużganek Salomona był kolumnadą biegnącą wzdłuż wschodniej strony zewnętrznego dziedzińca Świątyni w Jerozolimie, nad doliną Cedronu i naprzeciw Góry Oliwnej. Józef Flawiusz pisze, że gdy Herod przebudowywał Świątynię, otoczył jej rozległą platformę krytymi portykami, podwójnymi rzędami kolumn z białego marmuru o wysokości dwudziestu pięciu łokci pod sufitami z rzeźbionego cedru, i że wschodni zachował imię Salomona: lud, jak mówi, prosił króla Agryppę II o odbudowę tego wschodniego portyku, dzieła Salomona, a król odmówił, gdyż trwałoby to długo i kosztowało wielkie sumy; w Wojnie żydowskiej pisze, że sam Salomon obwarował murem wschodnią stronę wzgórza. Czy cokolwiek z pierwszej Świątyni stało tam, jest wątpliwe, ale mur wschodni to jedyna strona, której Herod nie odbudował od fundamentów, a jego starsze mury prawdopodobnie tłumaczą, dlaczego portyk nosił imię Salomona."
    - "Tu, w Świątyni, Jezus przechadzał się podczas święta Poświęcenia, w zimie, gdy Żydzi otoczyli go i pytali, czy jest Chrystusem, i próbowali go ukamienować za słowa „Ja i Ojciec jedno jesteśmy”: „I przechadzał się Jezus w kościele, w przysionku Salomonowym.” Gdy Piotr i Jan uzdrowili chromego u Pięknej Bramy, „zbieżał się do nich wszystek lud do przysionka, który zwano Salomonowym, zdumiawszy się”, a Piotr przemawiał tam do nich. Krużganek stał się miejscem spotkań apostołów: „przez ręce apostolskie działo się wiele znamion i cudów między ludem” i „byli wszyscy jednomyślnie w przysionku Salomonowym”, a nikt z obcych nie śmiał się do nich przyłączyć, choć lud miał ich w poważaniu."
    - "Z kolumnady nic nie stoi. Wschodni mur Wzgórza Świątynnego nadal biegnie herodiańską linią, a około 32 m na północ od jego południowo-wschodniego narożnika prosty szew w murze pokazuje, gdzie rozbudowę Heroda połączono ze starszym murem, hasmonejskim lub wcześniejszym, co badacze kwestionują; krużganek biegł nad nim. Złota Brama z okresu bizantyjskiego lub wczesnoislamskiego przerywa dziś mur, u jego stóp leży muzułmański cmentarz, a platforma nad nim to Haram asz-Szarif, gdzie wschodnią kolumnadę pamiętają już tylko teksty."
  it:
    - "Il Portico di Salomone era il colonnato lungo il lato orientale del cortile esterno del Tempio di Gerusalemme, sopra il Cedron e di fronte al Monte degli Ulivi. Giuseppe Flavio narra che, quando Erode ricostruì il Tempio, circondò la vasta spianata di portici coperti, a doppie file di colonne di marmo bianco alte venticinque cubiti sotto soffitti di cedro scolpito, e che quello orientale conservava il nome di Salomone: il popolo, dice, chiese al re Agrippa II di ricostruire questo portico orientale, opera di Salomone, ed egli rifiutò, per la lunghezza e il costo dell’opera; nella Guerra giudaica dice che Salomone aveva cinto di mura il lato orientale della collina. Che vi sorgesse qualcosa del primo Tempio è dubbio, ma il muro orientale è l’unico lato che Erode non ricostruì dalle fondamenta, e la sua muratura più antica spiega probabilmente perché il portico portasse il suo nome."
    - "Qui Gesù passeggiava durante la festa della Dedicazione, d’inverno, quando i Giudei si strinsero attorno a lui e gli chiesero se fosse il Cristo, e tentarono di lapidarlo perché aveva detto: «Io ed il Padre siamo uno»: «E Gesù passeggiava nel tempio, sotto il portico di Salomone». Dopo che Pietro e Giovanni ebbero guarito lo zoppo alla Porta Bella, «tutto il popolo, attonito, accorse a loro al portico detto di Salomone», e Pietro vi predicò. Il portico divenne il luogo di riunione degli apostoli: «molti segni e prodigi eran fatti fra il popolo per le mani degli apostoli», e «tutti di pari consentimento si ritrovavano sotto il portico di Salomone», mentre nessun estraneo osava unirsi a loro, benché il popolo li magnificasse."
    - "Del colonnato non resta nulla. Il muro orientale del Monte del Tempio è ancora la linea erodiana, e a circa 32 m a nord del suo angolo sud-orientale una giuntura rettilinea nella muratura mostra dove l’ampliamento di Erode fu raccordato a un muro più antico, degli Asmonei o anteriore, su cui gli studiosi discutono; il portico correva sopra di esso. La Porta d’Oro, di epoca bizantina o altomedievale islamica, interrompe oggi il muro, un cimitero musulmano giace ai suoi piedi, e la spianata sovrastante è l’Haram al-Sharif, dove il colonnato orientale è ricordato soltanto nei testi."
  nl:
    - "De zuilengang van Salomo was de zuilengalerij langs de oostzijde van het buitenste voorhof van de tempel in Jeruzalem, boven het Kidrondal, tegenover de Olijfberg. Flavius Josephus vertelt dat Herodes bij de herbouw van de tempel het plateau omringde met overdekte zuilengangen, dubbele rijen witmarmeren zuilen van vijfentwintig el hoog onder plafonds van gesneden cederhout, en dat de oostelijke de naam van Salomo behield: het volk, zegt hij, vroeg koning Agrippa II deze oostelijke zuilengang, het werk van Salomo, te herbouwen, en de koning weigerde wegens de duur en de kosten; in De Joodse Oorlog zegt hij dat Salomo zelf de oostzijde van de heuvel had ommuurd. Of er iets van de eerste tempel stond, is twijfelachtig, maar de oostmuur is de ene zijde die Herodes niet vanaf de grond herbouwde, en het oudere metselwerk verklaart waarschijnlijk waarom de zuilengang Salomo’s naam droeg."
    - "Hier wandelde Jezus op het feest van de Inwijding, in de winter, toen de Joden zich om Hem verzamelden en vroegen of Hij de Christus was, en Hem probeerden te stenigen omdat Hij zei: “Ik en de Vader zijn een.” “En Jezus wandelde in den tempel, in het voorhof van Salomo.” Nadat Petrus en Johannes de kreupele bij de Schone Poort hadden genezen, “liep al het volk gezamenlijk tot hen in het voorhof, hetwelk Salomo’s voorhof genaamd wordt, verbaasd zijnde”, en Petrus predikte daar tot hen. De zuilengang werd de ontmoetingsplaats van de apostelen: “door de handen der apostelen geschiedden vele tekenen en wonderen onder het volk”, en “zij waren allen eendrachtelijk in het voorhof van Salomo”, terwijl niemand van buiten zich bij hen durfde te voegen, al hield het volk hen in grote achting."
    - "Van de zuilengalerij staat niets meer overeind. De oostelijke muur van de Tempelberg volgt nog de lijn van Herodes, en ongeveer 32 m ten noorden van de zuidoosthoek toont een rechte naad in het metselwerk waar Herodes’ uitbreiding aan een oudere muur werd verbonden, van de Hasmoneeën of eerder, wat geleerden betwisten; de zuilengang liep erboven. De Gouden Poort uit de Byzantijnse of vroeg-islamitische tijd doorbreekt nu de muur, een moslimbegraafplaats ligt aan de voet ervan, en het plateau erboven is de Haram al-Sharif, waar de oostelijke zuilengalerij alleen nog in de teksten wordt herinnerd."
  cs:
    - "Šalomounovo podloubí bylo kolonádou táhnoucí se po východní straně vnějšího nádvoří chrámu v Jeruzalémě, nad údolím Kidronu a obrácená k Olivové hoře. Josephus vypráví, že když Herodes přestavoval chrám, obklopil jeho rozsáhlou plošinu krytými podloubími, dvojitými řadami sloupů z bílého mramoru vysokých pětadvacet loket pod stropy z vyřezávaného cedru, a že východní si podržela jméno Šalomounovo: lid prý požádal krále Agrippu II., aby toto východní podloubí, dílo Šalomounovo, přestavěl, a král odmítl, protože by to trvalo dlouho a stálo velké sumy; v Židovské válce říká, že sám Šalomoun obezdil východní stranu pahorku. Zda tam stálo něco z prvního chrámu, je pochybné, ale východní zeď je jediná strana, kterou Herodes nepřestavěl od základů, a její starší zdivo nejspíš vysvětluje, proč podloubí neslo Šalomounovo jméno."
    - "Zde se Ježíš procházel na svátek Posvěcení, v zimě, když se kolem něho shromáždili Židé, ptali se, zda je Kristus, a chtěli ho ukamenovat za to, že řekl: „Já a Otec jedno jsme“: „I procházel se Ježíš v chrámě po síňci Šalomounově.“ Poté, co Petr a Jan uzdravili chromého u Krásné brány, „sběhl se k nim všecken lid do síňce, kteráž sloula Šalomounova, předěšen jsa“, a Petr tam k nim kázal. Podloubí se stalo místem setkávání apoštolů: „Skrze ruce pak apoštolů dáli se divové a zázrakové velicí v lidu“ a „bývali všickni jednomyslně v síňci Šalomounově“, zatímco nikdo cizí se neodvážil připojit se k nim, ač je lid ctil."
    - "Z kolonády nic nestojí. Východní zeď Chrámové hory je stále herodovskou linií a asi 32 m severně od jejího jihovýchodního rohu ukazuje přímá spára ve zdivu, kde byla Herodova přístavba připojena ke starší zdi, hasmonejské nebo ještě dřívější, což učenci sporují; podloubí vedlo nad ní. Zlatá brána z byzantského nebo raně islámského období dnes zeď přerušuje, u jejího úpatí leží muslimský hřbitov a plošina nad ní je Haram aš-Šaríf, kde je východní kolonáda připomínána jen v textech."
  sv:
    - "Salomos pelarhall var kolonnaden som löpte längs östra sidan av templets yttre förgård i Jerusalem, ovanför Kidrondalen och vänd mot Olivberget. Josefus berättar att Herodes, när han byggde om templet, omgav dess väldiga plattform med takbelagda pelargångar, dubbla rader av vita marmorpelare tjugofem alnar höga under tak av huggen ceder, och att den östra behöll Salomos namn: folket, säger han, bad kung Agrippa II att bygga upp denna östra pelargång, Salomos verk, och kungen vägrade, eftersom det skulle ta lång tid och kosta stora summor; i Judiska kriget säger han att Salomo själv hade murat in kullens östra sida. Huruvida något av det första templet stod där är tveksamt, men östmuren är den enda sida som Herodes inte byggde om från grunden, och dess äldre murverk förklarar sannolikt varför pelargången bar hans namn."
    - "Här gick Jesus vid tempelinvigningsfesten, på vintern, då judarna samlades omkring honom och frågade om han var Kristus, och försökte stena honom för att han sade ”Jag och Fadern äro ett”: ”Och Jesus gick fram och åter i Salomos pelargång i helgedomen.” Sedan Petrus och Johannes hade botat den lame vid Sköna porten, ”strömmade allt folket, utom sig av häpnad, tillsammans till dem på den plats som kallades Salomos pelargång”, och Petrus predikade för dem där. Pelargången blev apostlarnas mötesplats: ”genom apostlarna gjordes många tecken och under bland folket”, och ”de höllo sig alla endräktigt tillsammans i Salomos pelargång”, medan ingen utomstående vågade ansluta sig till dem, fast folket höll dem i ära."
    - "Ingenting av kolonnaden står kvar. Tempelbergets östra mur följer fortfarande Herodes' linje, och omkring 32 m norr om dess sydöstra hörn visar en rak söm i murverket var Herodes' utbyggnad fogades till en äldre mur, från hasmoneerna eller tidigare, vilket forskarna tvistar om; pelarhallen löpte ovanför den. Den Gyllene porten från bysantinsk eller tidig islamisk tid bryter nu muren, en muslimsk begravningsplats ligger vid dess fot, och plattformen ovanför är Haram al-Sharif, där den östra kolonnaden bara minns i texterna."
  nb:
    - "Salomos søylegang var kolonnaden som løp langs østsiden av den ytre forgården til tempelet i Jerusalem, over Kedron-dalen og vendt mot Oljeberget. Josefus forteller at da Herodes gjenreiste tempelet, omgav han den veldige plattformen med overdekte søylehaller, doble rekker av hvite marmorsøyler, tjuefem alen høye, under tak av utskåret sedertre, og at den østlige beholdt Salomos navn: folket, sier han, ba kong Agrippa II om å gjenreise denne østlige søylegangen, Salomos verk, og kongen avslo, fordi det ville ta lang tid og koste store summer; i Den jødiske krig sier han at Salomo selv hadde murt inn østsiden av høyden. Om noe fra det første tempelet sto der, er tvilsomt, men østmuren er den eneste siden Herodes ikke bygde opp fra grunnen, og dens eldre murverk forklarer trolig hvorfor søylegangen bar hans navn."
    - "Her gikk Jesus omkring ved tempelvielsens fest, om vinteren, da jødene samlet seg rundt ham og spurte om han var Kristus, og forsøkte å stene ham fordi han sa «jeg og Faderen, vi er ett»: «og Jesus gikk omkring i templet i Salomos buegang». Etter at Peter og Johannes helbredet den vanføre mannen ved Fagerporten, «strømmet hele folket i forundring sammen om dem ved den buegang som kalles Salomos buegang», og Peter talte til dem der. Søylegangen ble apostlenes samlingssted: «det blev gjort mange tegn og undergjerninger blandt folket ved apostlenes hender», og «de holdt alle samdrektig til i Salomos buegang», mens ingen utenforstående våget å slutte seg til dem, selv om folket holdt dem i ære."
    - "Ingenting av kolonnaden står igjen. Tempelhøydens østmur følger fortsatt herodiansk linje, og omkring 32 m nord for sørøsthjørnet viser en rett søm i murverket hvor Herodes' utvidelse ble føyd til en eldre mur, av hasmoneerne eller tidligere, noe forskere er uenige om; søylegangen løp over den. Gullporten fra bysantinsk eller tidlig islamsk tid bryter nå muren, en muslimsk gravplass ligger ved foten av den, og plattformen over er Haram al-Sharif, der den østlige kolonnaden bare er husket i tekstene."
  tl:
    - "Ang Portiko ni Salomon ay hanay ng haligi sa silangang panig ng panlabas na bulwagan ng Templo sa Jerusalem, sa ibabaw ng libis ng Cedron, nakaharap sa Bundok ng mga Olibo. Ayon kay Josefo, nang muling itayo ni Herodes ang Templo, pinalibutan niya ng portikong may bubong ang tuntungan nito: dobleng hanay ng puting haliging marmol na 25 siko ang taas, kisameng inukit na sedro; pinanatili ng silangan ang pangalan ni Salomon. Hiniling daw ng bayan kay Haring Agripa II na itayong muli ang silangang portiko, gawa ni Salomon, ngunit tumanggi siya dahil magtatagal at magastos; sa Digmaang Judio, sabi niyang si Salomon mismo ang nagpader sa silangang panig ng burol. Kaduda-duda kung may natira mula sa unang Templo, ngunit ang silangang pader lamang ang hindi itinayong muli ni Herodes mula sa lupa, at marahil ang mas lumang pagmamason nito ang dahilan ng pangalan ng portiko."
    - "Dito naglalakad si Jesus sa kapistahan ng Pagtatalaga, noong taglamig, nang magtipon sa palibot niya ang mga Judio at itanong kung siya ang Cristo, at tangkaing batuhin siya dahil sa pagsasabing “Ako at ang Ama ay iisa”: “at naglalakad si Jesus sa templo sa portiko ni Salomon.” Matapos pagalingin nina Pedro at Juan ang pilay sa Pintuang Maganda, “nagsitakbong samasama sa kanila ang buong bayan sa tinatawag na portiko ni Salomon na lubhang nanggigilalas”, at nangaral doon si Pedro sa kanila. Ang portiko ay naging dako ng pagpupulong ng mga apostol: “sa pamamagitan ng mga kamay ng mga apostol ay ginawa ang maraming tanda at kababalaghan sa gitna ng mga tao”, at “nangaroon silang lahat na nangagkakaisa sa portiko ni Salomon”, samantalang walang tagalabas na nangahas sumama sa kanila, bagaman iginagalang sila ng bayan."
    - "Walang natitira sa hanay ng haligi. Ang silangang pader ng Bundok ng Templo ay nananatiling guhit ni Herodes, at mga 32 m sa hilaga ng timog-silangang sulok nito ay may tuwid na tahi sa pagmamason na nagpapakita kung saan pinagdugtong ang pagpapalawak ni Herodes sa mas lumang pader, ng mga Hasmoneo o mas maaga, na pinagtatalunan ng mga iskolar; ang portiko ay nasa itaas nito. Ang Pintuang Ginto ng panahong Bizantino o maagang Islamiko ay bumabali na ngayon sa pader, may libingang Muslim sa paanan nito, at ang tuntungan sa itaas ay ang Haram al-Sharif, kung saan ang silangang hanay ng haligi ay naaalala na lamang sa mga teksto."
  da:
    - "Salomos Søjlegang var kolonnaden, der løb langs østsiden af templets ydre forgård i Jerusalem, over Kedron-dalen og med udsigt mod Oliebjerget. Josefus fortæller, at da Herodes genopbyggede templet, omgav han dets vældige plateau med overdækkede søjlegange, dobbelte rækker af hvide marmorsøjler på femogtyve alen under lofter af udskåret cedertræ, og at den østlige beholdt Salomos navn: folket, siger han, bad kong Agrippa 2. om at genopbygge denne østlige søjlegang, Salomos værk, og kongen afslog, da det ville tage lang tid og koste store summer; i Den jødiske Krig siger han, at Salomo selv havde ført mur op om bjergets østside. Om noget af det første tempel stod der, er tvivlsomt, men den østlige mur er den ene side, som Herodes ikke genopbyggede fra grunden, og dens ældre murværk forklarer sandsynligvis, hvorfor søjlegangen bar Salomos navn."
    - "Her gik Jesus ved Indvielsesfesten, om vinteren, da jøderne samledes omkring ham og spurgte, om han var Kristus, og forsøgte at stene ham, fordi han sagde: »Jeg og Faderen, vi ere eet«: »Jesus gik omkring i Helligdommen, i Salomons Søjlegang.« Efter at Peter og Johannes havde helbredt den lamme ved Den Skønne Port, »løb alt Folket rædselsslaget sammen om dem i den Søjlegang, som kaldes Salomons«, og Peter prædikede for dem dér. Søjlegangen blev apostlenes mødested: »ved Apostlenes Hænder skete der mange Tegn og Undere iblandt Folket«, og »de vare alle endrægtigt sammen i Salomons Søjlegang«, mens ingen udenforstående turde slutte sig til dem, selv om folket holdt dem i ære."
    - "Intet af kolonnaden står tilbage. Tempelbjergets østmur følger stadig den herodianske linje, og omkring 32 m nord for dens sydøstlige hjørne viser en lige sammenføjning i murværket, hvor Herodes' udvidelse blev føjet til en ældre mur, fra hasmonæerne eller tidligere, hvilket forskerne er uenige om; søjlegangen løb oven på den. Den Gyldne Port fra byzantinsk eller tidlig islamisk tid bryder nu muren, en muslimsk gravplads ligger ved dens fod, og plateauet ovenfor er Haram al-Sharif, hvor den østlige kolonnade kun huskes i tekster."
  sr:
    - "Соломонов трем био је колонада која је ишла дуж источне стране спољашњег дворишта Храма у Јерусалиму, изнад долине Кедрон и према Маслинској гори. Јосиф Флавије приповеда да је Ирод, обнављајући Храм, његову огромну платформу оградио покривеним тремовима, двоструким редовима белих мермерних стубова високих двадесет пет лаката под плафонима од резбареног кедра, и да је источни задржао Соломоново име: народ је, каже он, тражио од цара Агрипе II да обнови тај источни трем, Соломоново дело, а цар је одбио јер би трајало дуго и коштало велике суме; у Јеврејском рату каже да је сам Соломон оградио источну страну брда. Да ли је ишта од првог Храма ту стајало, сумњиво је, али је источни зид једина страна коју Ирод није подизао из темеља, и његово старије зидање вероватно објашњава зашто је трем носио то име."
    - "Овде је Исус ходао на празник обновљења, зими, када су се Јудејци окупили око њега и питали је ли он Христос, и покушали су да га каменују због речи „Ја и Отац једно смо“: „И ходаше Исус у цркви по трему Соломуновом.“ Пошто су Петар и Јован исцелили хромог на Красним вратима, „навалише к њима сви људи у трем, који се зваше Соломунов, и чуђаху се“, и Петар им је тамо проповедао. Трем је постао место окупљања апостола: „рукама апостолским учинише се многи знаци и чудеса међу људима“ и „беху сви једнодушно у трему Соломуновом“, док им се ниједан туђин није усуђивао прићи, иако их је народ уважавао."
    - "Од колонаде не стоји ништа. Источни зид Храмовне горе и данас је Иродова линија, а око 32 м северно од његовог југоисточног угла права спојница у зидању показује где је Иродово проширење спојено са старијим зидом, хасмонејским или ранијим, што научници оспоравају; трем је ишао изнад њега. Златна капија из византијског или раноисламског доба сада прекида зид, муслиманско гробље лежи у његовом подножју, а платформа изнад је Харам аш Шариф, где се источна колонада памти само у текстовима."
  hu:
    - "Salamon csarnoka az az oszlopsor volt, amely a jeruzsálemi templom külső udvarának keleti oldalán húzódott, a Kidron-völgy fölött, az Olajfák hegyével szemben. Josephus szerint Heródes a templom hatalmas teraszát az újjáépítéskor fedett csarnokokkal vette körül: kettős fehér márványoszlop-sorral, huszonöt könyök magasan, faragott cédrusmennyezet alatt; a keleti megtartotta Salamon nevét. A nép, mondja, arra kérte II. Agrippa királyt, hogy építse újjá ezt a keleti csarnokot, Salamon művét, de a király elutasította, mert sokáig tartana és nagy összegekbe kerülne; A zsidó háborúban azt mondja, hogy maga Salamon falazta be a domb keleti oldalát. Hogy az első templomból állt-e ott valami, kétséges, de a keleti fal az egyetlen oldal, amelyet Heródes nem alapjaitól építtetett újjá, és régebbi falazata valószínűleg megmagyarázza, miért viselte a csarnok az ő nevét."
    - "Itt járt Jézus a templomszentelés ünnepén, télen, amikor a zsidók köréje gyűltek, megkérdezték, hogy ő-e a Krisztus, és megkövezni próbálták, mert azt mondta: „Én és az Atya egy vagyunk”: „És Jézus a templomban, a Salamon tornáczában jár vala.” Miután Péter és János meggyógyította a sánta embert a Szép kapunál, „az egész nép álmélkodva összefuta ő hozzájok a tornáczba, mely Salamonénak neveztetik”, és Péter ott prédikált nekik. A csarnok az apostolok találkozóhelyévé lett: „az apostolok kezei által pedig sok jel és csoda lőn a nép között”, és „egyakarattal mindnyájan a Salamon tornáczában valának”, miközben kívülálló nem merészelt csatlakozni hozzájuk, bár a nép tisztelte őket."
    - "Az oszlopsorból semmi sem áll. A Templomhegy keleti fala ma is a heródesi vonalat követi, és délkeleti sarkától mintegy 32 m-re északra egyenes varrat látszik a falazatban, ahol Heródes bővítése egy régebbi falhoz csatlakozik, amely a hasmóneusoktól vagy korábbról való, erről a tudósok vitatkoznak; a csarnok ez fölött húzódott. A bizánci vagy kora iszlám kori Arany kapu ma megszakítja a falat, tövében muszlim temető fekszik, a fölötte lévő terasz pedig a Haram es-Serif, ahol a keleti oszlopsorra csak a szövegek emlékeznek."
  fi:
    - "Salomonin pylväskäytävä oli pylväikkö Jerusalemin temppelin ulkopihan itäsivulla Kidronin laakson yläpuolella Öljymäkeä vastapäätä. Josefus kertoo Herodeksen rakentaessa temppelin uudelleen ympäröineen sen valtavan tasanteen katetuilla pylväskäytävillä: valkoisen marmorin kaksoispylväsrivit, kaksikymmentäviisi kyynärää korkeat, veistettyjen setrikattojen alla. Itäinen säilytti Salomon nimen: kansa pyysi hänen mukaansa kuningas Agrippa II:ta rakentamaan uudelleen tämän Salomon rakentaman itäisen pylväskäytävän, mutta kuningas kieltäytyi, koska se veisi aikaa ja maksaisi paljon; Juutalaissodassa hän kertoo Salomon itse muuranneen kukkulan itäsivun. Onko siellä ensimmäisen temppelin jäänteitä, on epävarmaa, mutta itämuuri on ainoa sivu, jota Herodes ei rakentanut perustuksista alkaen, ja sen vanhempi muuraus selittää luultavasti, miksi pylväskäytävä kantoi Salomon nimeä."
    - "Täällä Jeesus käyskeli temppelin vihkimisen muistojuhlana, talvella, kun juutalaiset kerääntyivät hänen ympärilleen ja kysyivät, oliko hän Kristus, ja yrittivät kivittää hänet, koska hän sanoi ”Minä ja Isä olemme yhtä”: ”Ja Jeesus käyskeli pyhäkössä, Salomon pylväskäytävässä.” Kun Pietari ja Johannes olivat parantaneet rampaa Kauniilla portilla, ”riensi kaikki kansa hämmästyksen vallassa heidän luoksensa niin sanottuun Salomon pylväskäytävään”, ja Pietari saarnasi heille siellä. Pylväskäytävästä tuli apostolien kokoontumispaikka: ”apostolien kätten kautta tapahtui kansassa monta tunnustekoa ja ihmettä”, ja ”he olivat kaikki yksimielisesti koolla Salomon pylväskäytävässä”, vaikka kukaan ulkopuolinen ei uskaltanut liittyä heihin, joskin kansa piti heitä suuressa kunniassa."
    - "Pylväikköä ei ole jäljellä. Temppelivuoren itämuuri on yhä herodeslainen linja, ja noin 32 m sen kaakkoiskulmasta pohjoiseen muurauksen suora sauma osoittaa, mistä Herodeksen laajennus liitettiin vanhempaan muuriin, hasmonealaisten tai vielä varhaisempaan, mistä tutkijat kiistelevät; pylväskäytävä kulki sen yläpuolella. Bysanttilaisen tai varhaisen islamilaisen ajan Kultainen portti katkaisee nyt muurin, sen juurella on muslimien hautausmaa, ja yläpuolella oleva tasanne on Haram al-Sharif, jossa itäinen pylväikkö on muistissa vain teksteissä."
  vi:
    - "Hiên cửa Sa-lô-môn là dãy hành lang cột chạy dọc phía đông của sân ngoài Đền Thờ tại Giê-ru-sa-lem, phía trên thung lũng Xết-rôn và đối diện Núi Ô-li-ve. Josephus kể rằng khi Hê-rốt xây lại Đền Thờ, ông bao quanh nền rộng lớn của nó bằng các hành lang có mái, những hàng cột đá cẩm thạch trắng đôi cao hai mươi lăm cu-bít dưới trần gỗ bá hương chạm khắc, và hành lang phía đông giữ tên Sa-lô-môn: ông nói dân chúng xin vua Ạc-ríp-ba II xây lại hành lang phía đông này, công trình của Sa-lô-môn, và vua từ chối vì sẽ lâu và tốn nhiều tiền; trong Chiến tranh Do Thái ông nói chính Sa-lô-môn đã xây tường phía đông của ngọn đồi. Không chắc có gì của Đền Thờ thứ nhất đứng ở đó, nhưng tường phía đông là cạnh duy nhất mà Hê-rốt không xây lại từ nền, và phần xây cũ hơn của nó có lẽ giải thích vì sao hành lang mang tên ông."
    - "Tại đây Giê-su đang đi dạo vào lễ Khánh Thành, mùa đông, khi người Do Thái vây quanh Ngài và hỏi Ngài có phải là Đấng Christ không, và tìm cách ném đá Ngài vì Ngài nói “Ta với Cha là một”: “Đức Chúa Jêsus đi dạo trong đền thờ, dưới hiên cửa Sa-lô-môn.” Sau khi Phi-e-rơ và Giăng chữa người què ở Cửa Đẹp, “cả dân chúng lấy làm lạ, chạy đến cùng các người đó ở nơi hiên cửa gọi là Sa-lô-môn”, và Phi-e-rơ giảng cho họ tại đó. Hiên cửa trở thành nơi họp của các sứ đồ: “có nhiều phép lạ dấu kỳ được làm ra trong dân bởi tay các sứ đồ”, và “các môn đồ đều hiệp một lòng nhóm nhau dưới hiên cửa Sa-lô-môn”, trong khi không người ngoài nào dám nhập bọn, dù dân chúng tôn trọng họ."
    - "Không còn gì của hành lang cột này. Tường đông của Núi Đền Thờ vẫn là đường nét thời Hê-rốt, và cách góc đông nam của nó khoảng 32 m về phía bắc, một đường nối thẳng trong khối xây cho thấy chỗ phần mở rộng của Hê-rốt được ghép vào một bức tường cũ hơn, của nhà Hasmonean hay sớm hơn, điều mà các học giả tranh luận; hành lang chạy phía trên nó. Cổng Vàng thời Byzantine hay đầu thời Hồi giáo nay cắt ngang bức tường, một nghĩa địa Hồi giáo nằm dưới chân, và nền phía trên là Haram al-Sharif, nơi hành lang cột phía đông chỉ còn được nhớ trong các văn bản."
  ro:
    - "Pridvorul lui Solomon era colonada de pe latura estică a curții exterioare a Templului din Ierusalim, deasupra Văii Chedronului, cu fața spre Muntele Măslinilor. Iosif Flaviu spune că Irod, reconstruind Templul, a înconjurat platforma uriașă cu porticuri acoperite, cu rânduri duble de coloane de marmură albă înalte de douăzeci și cinci de coți, sub tavane de cedru sculptat, și că cel estic a păstrat numele lui Solomon: poporul, spune el, l-a rugat pe regele Agripa al II-lea să refacă acest portic estic, lucrare a lui Solomon, dar regele a refuzat, pentru că ar fi durat mult și ar fi costat mult; în Războiul iudaic spune că Solomon însuși zidise latura estică a dealului. Dacă ceva din primul Templu se afla acolo este îndoielnic, dar zidul estic este singura latură pe care Irod nu a refăcut-o de la temelie, iar zidăria lui mai veche explică probabil numele porticului."
    - "Aici umbla Isus la sărbătoarea Înnoirii, iarna, când iudeii s-au adunat în jurul lui și l-au întrebat dacă este Hristosul, și au încercat să-l ucidă cu pietre fiindcă a spus „Eu și Tatăl una suntem”: „Și umblà Iisus în biserică în pridvorul lui Solomon.” După ce Petru și Ioan l-au vindecat pe șchiop la Poarta Frumoasă, tot poporul a alergat la ei în pridvorul numit al lui Solomon, plin de uimire, și Petru le-a predicat acolo. Pridvorul a devenit locul de întâlnire al apostolilor: „prin mâinile apostolilor se făceau semne și minuni multe întru norod”, iar „erau toți cu un gând în pridvorul lui Solomon”, în timp ce niciun străin nu îndrăznea să li se alăture, deși poporul îi socotea cu cinste."
    - "Nimic din colonadă nu a rămas în picioare. Zidul estic al Muntelui Templului este încă linia lui Irod, iar la circa 32 m nord de colțul său sud-estic, o îmbinare dreaptă în zidărie arată unde extinderea lui Irod a fost unită cu un zid mai vechi, hasmonean sau chiar anterior, ceea ce cercetătorii dezbat; porticul se întindea deasupra lui. Poarta de Aur din epoca bizantină sau islamică timpurie întrerupe acum zidul, un cimitir musulman se află la poalele lui, iar platforma de deasupra este Haram al-Șarif, unde colonada estică este amintită doar în texte."
  bg:
    - "Соломоновият трем бил колонадата по източната страна на външния двор на Храма в Йерусалим, над долината Кедрон, срещу Елеонския хълм. Йосиф Флавий разказва, че когато Ирод преустроил Храма, обградил огромната му платформа с покрити портици — двойни редици колони от бял мрамор, високи двадесет и пет лакътя, под тавани от резбован кедър, и че източният запазил името на Соломон: народът, казва той, помолил цар Агрипа II да възстанови този източен портик, дело на Соломон, но царят отказал, понеже това щяло да отнеме много време и огромни средства; в „Юдейската война“ той пише, че самият Соломон оградил със стена източната страна на хълма. Дали там е стояло нещо от Първия храм, е съмнително, но източната стена е единствената страна, която Ирод не изградил из основи, и по-старата ѝ зидария вероятно обяснява защо портикът носел името му."
    - "Тук Исус ходел на празника на Освещението, през зимата, когато юдеите го обградили и го питали дали е Христос, и се опитали да го убият с камъни, защото казал: „Аз и Отец едно сме“: „И ходеше Исус в храма, в притвора Соломонов.“ След като Петър и Йоан изцелили куция при Красивата порта, „всичкият народ смаян стече се при тех в притвора нарицаем Соломонов“, и Петър им проповядвал там. Тремът станал място за събиране на апостолите: „много знамения и чудеса биваха в народа чрез ръцете на апостолите“ и „всички единодушно беха в притвора Соломонов“, а никой отвън не смеел да се присъедини към тях, макар народът да ги почитал."
    - "От колонадата нищо не е оцеляло. Източната стена на Храмовия хълм все още следва Иродовата линия, а на около 32 м северно от югоизточния ѝ ъгъл права фуга в зидарията показва къде Иродовото разширение е присъединено към по-стара стена — хасмонейска или по-ранна, за което учените спорят; портикът минавал над нея. Златната порта от византийския или ранноислямския период днес прекъсва стената, в подножието ѝ лежи мюсюлманско гробище, а платформата горе е Харам аш-Шариф, където източната колонада се помни само в текстовете."
