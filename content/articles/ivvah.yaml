body:
  en:
    - "Ivvah, Ivah in the Authorised Version, closes the list of conquered cities with which Sennacherib's officer taunted Jerusalem in 701 BC: “Where are the gods of Hamath, and of Arpad? where are the gods of Sepharvaim, Hena, and Ivah? have they delivered Samaria out of mine hand?” Sennacherib's letter to Hezekiah repeats the list with “the king of the city of Sepharvaim, of Hena, and Ivah”, and Isaiah has the same words. Most identify it with Ava, one of the places from which the king of Assyria brought settlers into the cities of Samaria after 722 BC, together with Babylon, Cuthah, Hamath and Sepharvaim; the newcomers kept their gods, and “the Avites made Nibhaz and Tartak”. In Hebrew the two names differ only in the last letter."
    - "Where it was is unknown. Since the list runs through Syria, many look for Ivvah there: the first candidate on the map is Kafr Aya on the Orontes south-west of Homs, and another is Imma, now Imm, between Antioch and Aleppo. Others, taking Sepharvaim for Sippar, have placed it in Babylonia, as the second candidate on the map does by equating it with Ama; and some have held that Hena and Ivvah are not places at all but names of gods, or damaged words. The gods Nibhaz and Tartak are known from no other source, so they give no help. Nothing further is known."
    - "No site has been excavated as Ivvah. Kafr Aya is a village in the Homs governorate of Syria, among the orchards and lakes of the Orontes valley."
  ru:
    - "Ивва замыкает перечень покорённых городов, которым военачальник Сеннахирима дразнил Иерусалим в 701 г. до н. э.: «Где боги Емафа и Арпада? Где боги Сепарваима, Ены и Иввы? Спасли ли они Самарию от руки моей?» Письмо Сеннахирима Езекии повторяет перечень: «царь города Сепарваима, Ены и Иввы», и у Исаии те же слова. Большинство отождествляют её с Аввой, одним из мест, откуда царь Ассирийский перевёл поселенцев в города Самарийские после 722 г. до н. э., вместе с Вавилоном, Кутой, Емафом и Сепарваимом; пришельцы сохранили своих богов, и «Аввийцы сделали Нивхаза и Тартака». По-еврейски два имени различаются лишь последней буквой."
    - "Где она была, неизвестно. Поскольку перечень идёт по Сирии, многие ищут Ивву там: первый кандидат на карте — Кафр-Айя на Оронте к юго-западу от Хомса, другой — Имма, нынешний Имм, между Антиохией и Алеппо. Другие, принимая Сепарваим за Сиппар, помещали её в Вавилонии, как делает и второй кандидат на карте, отождествляя её с Амой; а некоторые считали, что Ена и Ивва — вовсе не места, а имена богов или испорченные слова. Боги Нивхаз и Тартак не известны ни из какого другого источника и потому ничем не помогают. Больше ничего не известно."
    - "Ни одно место не раскапывали как Ивву. Кафр-Айя — деревня в провинции Хомс в Сирии, среди садов и озёр долины Оронта."
  uk:
    - "Івва, Іва в Авторизованій версії (король Яків), закриває перелік підкорених міст, яким офіцер Сінаххеріба глузував з Єрусалима 701 р. до н. е.: «Де боги Ематові й Арпадові? де боги Сефарваїмові, Енині й Івині? Чи ж вирятували вони Самарию з руки моєї?» Лист Сінаххеріба до Єзекії повторює перелік зі словами «царь пад городом Сефарваїмом, Еною й Іввою», і Ісая має ті самі слова. Більшість ототожнює її з Авою, одним із місць, звідки цар Ассирії привів поселенців до міст Самарії по 722 р. до н. е., разом з Вавилоном, Кутою, Хаматом і Сефарваїмом; прибульці зберегли своїх богів, і «Аввії зробили Нибхаза й Тартака». Давньоєврейською ці дві назви різняться лише останньою літерою."
    - "Де вона була, невідомо. Оскільки перелік іде по Сирії, багато хто шукає Івву там: перший кандидат на карті — Кафр-Ая на Оронті на південний захід від Хомса, а інший — Імма, нині Імм, між Антіохією та Алеппо. Інші, вважаючи Сефарваїм Сіппаром, розмістили її у Вавилонії, як і другий кандидат на карті, ототожнюючи її з Амою; а дехто вважав, що Хена та Івва — це зовсім не місця, а імена богів або пошкоджені слова. Боги Нибхаз і Тартак не відомі з жодного іншого джерела, тож не допомагають. Більше нічого невідомо."
    - "Жодне місце не розкопували як Івву. Кафр-Ая — село в губернаторстві Хомс у Сирії, серед садів і озер долини Оронта."
  es:
    - "Iva, Ivah en la versión autorizada (King James), cierra la lista de ciudades conquistadas con la que el oficial de Senaquerib se burló de Jerusalén en el 701 a. C.: «¿Dónde está el dios de Hamath, y de Arphad? ¿dónde el dios de Sepharvaim, de Hena, y de Hiva? ¿pudieron éstos librar á Samaria de mi mano?». La carta de Senaquerib a Ezequías repite la lista con «el rey de la ciudad de Sepharvaim, de Hena, y de Hiva», e Isaías tiene las mismas palabras. La mayoría la identifica con Ava, uno de los lugares de donde el rey de Asiria trajo colonos a las ciudades de Samaria después del 722 a. C., junto con Babilonia, Cuta, Hamat y Sefarvaim; los recién llegados conservaron sus dioses, y «Los Heveos hicieron á Nibhaz y á Tharthac». En hebreo los dos nombres difieren solo en la última letra."
    - "Dónde estuvo se ignora. Como la lista recorre Siria, muchos buscan allí Iva: el primer candidato del mapa es Kafr Aya, en el Orontes, al suroeste de Homs, y otro es Imma, hoy Imm, entre Antioquía y Alepo. Otros, tomando Sefarvaim por Sippar, la han situado en Babilonia, como hace el segundo candidato del mapa al equipararla con Ama; y algunos han sostenido que Hena e Iva no son lugares sino nombres de dioses, o palabras dañadas. Los dioses Nibhaz y Tartac no se conocen por ninguna otra fuente, de modo que no ayudan. No se sabe nada más."
    - "Ningún sitio ha sido excavado como Iva. Kafr Aya es una aldea de la gobernación de Homs, en Siria, entre los huertos y lagos del valle del Orontes."
  pt:
    - "Iva, Ivah na Versão Autorizada, fecha a lista das cidades conquistadas com que o oficial de Senaqueribe zombou de Jerusalém em 701 a.C.: “Onde estão os deuses de Hamate e de Arpade? Onde estão os deuses de Sefarvaim, de Hena e de Iva? Acaso eles livraram Samaria da minha mão?” A carta de Senaqueribe a Ezequias repete a lista com “o rei da cidade de Sefarvaim, de Hena e de Iva”, e Isaías traz as mesmas palavras. A maioria a identifica com Ava, um dos lugares de onde o rei da Assíria trouxe colonos para as cidades de Samaria depois de 722 a.C., junto com Babilônia, Cuta, Hamate e Sefarvaim; os recém-chegados conservaram seus deuses, e “os aveus fizeram Nibaz e Tartaque”. Em hebraico os dois nomes diferem só na última letra."
    - "Onde ficava é desconhecido. Como a lista percorre a Síria, muitos procuram Iva ali: o primeiro candidato do mapa é Kafr Aya, no Orontes, a sudoeste de Homs, e outro é Imma, hoje Imm, entre Antioquia e Alepo. Outros, tomando Sefarvaim por Sipar, a puseram na Babilônia, como faz o segundo candidato do mapa, equiparando-a a Ama; e alguns sustentaram que Hena e Iva não são lugares, mas nomes de deuses, ou palavras corrompidas. Os deuses Nibaz e Tartaque não são conhecidos por nenhuma outra fonte, de modo que não ajudam. Nada mais se sabe."
    - "Nenhum sítio foi escavado como Iva. Kafr Aya é uma aldeia na província de Homs, na Síria, entre os pomares e lagos do vale do Orontes."
  de:
    - "Iwa, in der King-James-Bibel Ivah, beschließt die Liste eroberter Städte, mit der Sanheribs Offizier Jerusalem 701 v. Chr. verhöhnte: „Wo sind die Götter zu Hamath und Arpad? Wo sind die Götter zu Sepharvaim, Hena und Iwwa? Haben sie auch Samaria errettet von meiner Hand?“ Sanheribs Brief an Hiskia wiederholt die Liste mit „der König der Stadt Sepharvaim, von Hena und Iwwa“, und Jesaja hat dieselben Worte. Die meisten setzen es mit Awa gleich, einem der Orte, aus denen der König von Assyrien nach 722 v. Chr. Siedler in die Städte Samarias brachte, zusammen mit Babylon, Kuta, Hamat und Sefarwajim; die Neuankömmlinge behielten ihre Götter, und „die von Avva machten Nibehas und Tharthak“. Im Hebräischen unterscheiden sich die beiden Namen nur im letzten Buchstaben."
    - "Wo es lag, ist unbekannt. Da die Liste durch Syrien führt, suchen viele Iwa dort: Der erste Kandidat auf der Karte ist Kafr Aja am Orontes südwestlich von Homs, ein weiterer Imma, heute Imm, zwischen Antiochia und Aleppo. Andere, die Sefarwajim für Sippar halten, haben es in Babylonien angesetzt, wie es der zweite Kandidat auf der Karte tut, indem er es mit Ama gleichsetzt; und manche haben gemeint, Hena und Iwa seien gar keine Orte, sondern Götternamen oder beschädigte Wörter. Die Götter Nibchas und Tartak sind aus keiner anderen Quelle bekannt, sie helfen also nicht weiter. Mehr ist nicht bekannt."
    - "Keine Stätte ist als Iwa ausgegraben. Kafr Aja ist ein Dorf im syrischen Gouvernement Homs, zwischen den Obstgärten und Seen des Orontestals."
  fr:
    - "Ivva, Ivah dans la version autorisée, clôt la liste des villes conquises dont l’officier de Sanchérib railla Jérusalem en 701 av. J.-C. : « Où sont les dieux de Hamath et d’Arpad ? Où sont les dieux de Sepharvaïm, d’Héna et d’Ivva ? Ont-ils délivré Samarie de ma main ? » La lettre de Sanchérib à Ézéchias reprend la liste avec « le roi de la ville de Sepharvaïm, d’Héna et d’Ivva », et Ésaïe a les mêmes mots. La plupart l’identifient à Avva, l’un des lieux d’où le roi d’Assyrie fit venir des colons dans les villes de Samarie après 722 av. J.-C., avec Babylone, Cutha, Hamath et Sepharvaïm ; les nouveaux venus gardèrent leurs dieux, et « ceux d’Avva firent Nibchaz et Tharthak ». En hébreu, les deux noms ne diffèrent que par la dernière lettre."
    - "On ignore où elle se trouvait. Comme la liste parcourt la Syrie, beaucoup y cherchent Ivva : le premier candidat de la carte est Kafr Aya sur l’Oronte, au sud-ouest de Homs, et un autre Imma, aujourd’hui Imm, entre Antioche et Alep. D’autres, prenant Sepharvaïm pour Sippar, l’ont placée en Babylonie, comme le fait le second candidat de la carte en l’identifiant à Ama ; et certains ont soutenu que Héna et Ivva ne sont pas des lieux mais des noms de dieux, ou des mots abîmés. Les dieux Nibchaz et Tharthak ne sont connus d’aucune autre source et n’aident donc pas. On ne sait rien de plus."
    - "Aucun site n’a été fouillé comme Ivva. Kafr Aya est un village du gouvernorat de Homs, en Syrie, parmi les vergers et les lacs de la vallée de l’Oronte."
  pl:
    - "Iwwa, w Biblii Króla Jakuba Ivah, zamyka wykaz podbitych miast, którymi oficer Sennacheryba drwił z Jerozolimy w 701 r. p.n.e.: „Gdzież jest bóg Emat i Arfad? gdzież jest bóg Sefarwaim, Ana i Awa? izali wyrwali Samaryję z rąk moich?”. List Sennacheryba do Ezechiasza powtarza wykaz słowami „król miasta Sefarwaim, Ana i Awa”, a Izajasz ma te same słowa. Większość utożsamia ją z Awą, jednym z miejsc, z których król Asyrii sprowadził osadników do miast Samarii po 722 r. p.n.e., razem z Babilonem, Kutą, Chamat i Sefarwaim; przybysze zachowali swoich bogów, a „Hewejczycy uczynili Nebahaz, i Tartak”. W hebrajskim obie nazwy różnią się tylko ostatnią literą."
    - "Gdzie leżała, nie wiadomo. Ponieważ wykaz biegnie przez Syrię, wielu szuka Iwwy tam: pierwszym kandydatem na mapie jest Kafr Aja nad Orontesem na południowy zachód od Homs, a innym Imma, dziś Imm, między Antiochią a Aleppo. Inni, uważając Sefarwaim za Sippar, umieścili ją w Babilonii, jak czyni drugi kandydat na mapie, utożsamiając ją z Ama; a niektórzy twierdzili, że Hena i Iwwa nie są w ogóle miejscami, lecz imionami bogów albo uszkodzonymi słowami. Bogowie Nebahaz i Tartak nie są znani z żadnego innego źródła, więc nie pomagają. Nic więcej nie wiadomo."
    - "Żadne stanowisko nie zostało wykopane jako Iwwa. Kafr Aja to wieś w muhafazie Homs w Syrii, wśród sadów i jezior doliny Orontesu."
  it:
    - "Ivva, Ivah nella Authorised Version, chiude l’elenco delle città conquistate con cui l’ufficiale di Sennacherib schernì Gerusalemme nel 701 a.C.: «Dove sono gli dèi di Hamath e d’Arpad? Dove sono gli dèi di Sefarvaim, di Hena e d’Ivva? Hanno essi liberata Samaria dalla mia mano?» La lettera di Sennacherib a Ezechia ripete l’elenco con «il re della città di Sefarvaim, di Hena e d’Ivva», e Isaia ha le stesse parole. I più la identificano con Ava, uno dei luoghi da cui il re d’Assiria portò coloni nelle città di Samaria dopo il 722 a.C., insieme a Babilonia, Cuta, Camat e Sefarvaim; i nuovi venuti conservarono i loro dèi, e «quelli di Avva fecero Nibhaz e Tartak». In ebraico i due nomi differiscono solo per l’ultima lettera."
    - "Dove fosse è ignoto. Poiché l’elenco attraversa la Siria, molti cercano Ivva là: il primo candidato sulla mappa è Kafr Aya sull’Oronte a sud-ovest di Homs, e un altro è Imma, oggi Imm, fra Antiochia e Aleppo. Altri, prendendo Sefarvaim per Sippar, l’hanno posta in Babilonia, come fa il secondo candidato sulla mappa equiparandola ad Ama; e alcuni hanno sostenuto che Ena e Ivva non siano affatto luoghi ma nomi di dèi, o parole corrotte. Gli dèi Nibhaz e Tartak non sono noti da altre fonti, perciò non aiutano. Nulla di più si sa."
    - "Nessun sito è stato scavato come Ivva. Kafr Aya è un villaggio nel governatorato siriano di Homs, fra i frutteti e i laghi della valle dell’Oronte."
  nl:
    - "Iwwa, Ivah in de Authorised Version, sluit de lijst van veroverde steden waarmee Sanheribs officier Jeruzalem in 701 v.Chr. bespotte: “Waar zijn de goden van Hamath, en van Arpad? Waar zijn de goden van Sefarvaim, Hena en Ivva? Ja, hebben zij Samaria uit mijn hand gered?” Sanheribs brief aan Chizkia herhaalt de lijst met “de koning der stad Sefarvaim, Hena en Ivva”, en Jesaja heeft dezelfde woorden. De meesten vereenzelvigen het met Ava, een van de plaatsen waaruit de koning van Assyrië na 722 v.Chr. kolonisten naar de steden van Samaria bracht, samen met Babel, Chuta, Hamat en Sefarvaïm; de nieuwkomers behielden hun goden, en “de Avieten maakten Nibhaz en Tartak”. In het Hebreeuws verschillen de twee namen alleen in de laatste letter."
    - "Waar het lag, is onbekend. Omdat de lijst door Syrië loopt, zoeken velen Iwwa daar: de eerste kandidaat op de kaart is Kafr Aya aan de Orontes ten zuidwesten van Homs, en een andere is Imma, nu Imm, tussen Antiochië en Aleppo. Anderen, die Sefarvaïm voor Sippar houden, hebben het in Babylonië geplaatst, zoals de tweede kandidaat op de kaart doet door het gelijk te stellen met Ama; en sommigen hebben gemeend dat Hena en Iwwa helemaal geen plaatsen zijn maar namen van goden, of beschadigde woorden. De goden Nibhaz en Tartak zijn uit geen andere bron bekend, dus zij helpen niet. Verder is niets bekend."
    - "Geen plaats is als Iwwa opgegraven. Kafr Aya is een dorp in het Syrische gouvernement Homs, tussen de boomgaarden en meren van de Orontesvallei."
  cs:
    - "Ivva, v Bibli krále Jakuba Ivah, uzavírá seznam dobytých měst, jimiž Senacheribův důstojník v roce 701 př. n. l. se vysmíval Jeruzalému: „Kdež jsou bohové Emat a Arfad? Kde jsou bohové Sefarvaim, Ana a Ava? Zdaliž jsou vysvobodili Samaří z ruky mé?“ Senacheribův dopis Chizkijášovi seznam opakuje: „král města Sefarvaim, Ana i Ava“, a Izajáš má tatáž slova. Většina ji ztotožňuje s Avou, jedním z míst, odkud král asyrský přivedl osadníky do měst Samaří po roce 722 př. n. l., spolu s Babylónem, Kutou, Chamatem a Sefarvajim; příchozí si ponechali své bohy a „Hevejští tolikéž udělali Nibchaz a Tartak“. V hebrejštině se obě jména liší jen posledním písmenem."
    - "Kde ležela, není známo. Protože seznam prochází Sýrií, mnozí hledají Ivvu tam: prvním kandidátem na mapě je Kafr Aja na Orontu jihozápadně od Homsu a jiným Imma, nyní Imm, mezi Antiochií a Aleppem. Jiní, kteří berou Sefarvajim za Sippar, ji umístili do Babylonie, jak činí druhý kandidát na mapě, který ji ztotožňuje s Amou; a někteří tvrdili, že Hena a Ivva nejsou vůbec místa, nýbrž jména bohů nebo poškozená slova. Bohové Nibchaz a Tartak nejsou známi z žádného jiného pramene, takže nepomáhají. Nic dalšího není známo."
    - "Žádné místo nebylo vykopáno jako Ivva. Kafr Aja je vesnice v gubernii Homs v Sýrii, mezi sady a jezery orontského údolí."
  sv:
    - "Ivva, Ivah i Authorised Version, avslutar förteckningen över erövrade städer med vilken Sanheribs ombud hånade Jerusalem år 701 f.Kr.: ”Var äro Hamats och Arpads gudar? Var äro Sefarvaims, Henas och Ivas gudar? Eller hava de räddat Samaria ur min hand?” Sanheribs brev till Hiskia upprepar förteckningen med ”konungen över Sefarvaims stad, över Hena och Iva”, och Jesaja har samma ord. De flesta identifierar den med Ava, en av platserna från vilka Assyriens kung förde nybyggare till Samarias städer efter 722 f.Kr., tillsammans med Babylon, Kuta, Hamat och Sefarvajim; nykomlingarna behöll sina gudar, och ”aviterna gjorde sig en Nibhas och en Tartak”. På hebreiska skiljer sig de två namnen bara i sista bokstaven."
    - "Var det låg är okänt. Eftersom förteckningen går genom Syrien söker många Ivva där: den första kandidaten på kartan är Kafr Aya vid Orontes sydväst om Homs, och en annan är Imma, nu Imm, mellan Antiochia och Aleppo. Andra, som tar Sefarvajim för Sippar, har placerat den i Babylonien, som kartans andra kandidat gör genom att likställa den med Ama; och några har menat att Hena och Ivva inte alls är platser utan namn på gudar, eller skadade ord. Gudarna Nibhas och Tartak är kända från ingen annan källa, så de hjälper inte. Inget vidare är känt."
    - "Ingen plats har grävts ut som Ivva. Kafr Aya är en by i Syriens guvernement Homs, bland fruktodlingarna och sjöarna i Orontesdalen."
  nb:
    - "Iva (Ivah i Authorised Version) avslutter listen over erobrede byer som Sankeribs offiser hånte Jerusalem med i 701 f.Kr.: «Hvor er Hamats og Arpads guder? Hvor er Sefarva'ims, Henas og Ivvas guder? Har vel Samarias guder reddet det av min hånd?» Sankeribs brev til Hiskia gjentar listen med «byen Sefarva'ims konge, Henas og Ivvas konger», og Jesaja har de samme ordene. De fleste identifiserer den med Ava, ett av stedene hvorfra Assyrias konge hentet nybyggere til byene i Samaria etter 722 f.Kr., sammen med Babylon, Kuta, Hamat og Sefarvajim; de nyankomne beholdt sine guder, og avvittene gjorde, som det heter, «et billede av Nibhas og av Tartak». På hebraisk skiller de to navnene seg bare i den siste bokstaven."
    - "Hvor den lå, er ukjent. Siden listen går gjennom Syria, leter mange etter Iva der: den første kandidaten på kartet er Kafr Aya ved Orontes sørvest for Homs, og en annen er Imma, nå Imm, mellom Antiokia og Aleppo. Andre, som tar Sefarvajim for Sippar, har plassert den i Babylonia, slik den andre kandidaten på kartet gjør ved å sette den lik Ama; og noen har hevdet at Hena og Iva slett ikke er steder, men navn på guder eller skadede ord. Gudene Nibhas og Tartak er ikke kjent fra noen annen kilde, så de hjelper ikke. Ingenting mer er kjent."
    - "Ingen lokalitet er gravd ut som Iva. Kafr Aya er en landsby i guvernementet Homs i Syria, blant fruktplantasjene og innsjøene i Orontes-dalen."
  tl:
    - "Ang Hiva (Ivvah sa Hebreo, Ivah sa Authorised Version) ang nagtatapos sa talaan ng mga nasakop na lungsod na ipinang-uyam ng opisyal ni Sennacherib sa Jerusalem noong 701 BK: “Saan nandoon ang mga dios ng Hamath, at ng Arphad? Saan nandoon ang mga dios ng Sepharvaim, ng Hena, at ng Hiva? Iniligtas ba nila ang Samaria sa aking kamay?” Inuulit ng liham ni Sennacherib kay Ezechias ang talaan na may “ang hari sa bayan ng Sepharvaim, ng Hena, at ng Hiva”, at ganoon din ang mga salita ni Isaias. Karamihan ay kumikilala rito sa Ava, isa sa mga lugar na pinagdalhan ng hari ng Asiria ng mga naninirahan sa mga bayan ng Samaria pagkatapos ng 722 BK, kasama ang Babilonia, Cutha, Hamath at Sepharvaim; iningatan ng mga bagong dating ang kanilang mga diyos, at “itinayo ng mga Avveo ang Nibhaz at ang Tharthac”. Sa Hebreo, ang dalawang pangalan ay magkaiba lamang sa huling titik."
    - "Hindi alam kung nasaan ito. Yamang dumaraan sa Siria ang talaan, maraming naghahanap ng Hiva roon: ang unang kandidato sa mapa ay ang Kafr Aya sa Orontes sa timog-kanluran ng Homs, at ang isa pa ay ang Imma, ngayon ay Imm, sa pagitan ng Antioquia at Aleppo. Ang iba, na kumukuha sa Sepharvaim bilang Sippar, ay inilagay ito sa Babilonia, gaya ng ikalawang kandidato sa mapa na itinutumbas ito sa Ama; at iginiit ng ilan na ang Hena at Hiva ay hindi mga lugar kundi mga pangalan ng mga diyos, o sirang mga salita. Ang mga diyos na Nibhaz at Tharthac ay hindi kilala mula sa ibang batis, kaya't hindi sila nakatutulong. Wala nang ibang nalalaman."
    - "Walang lugar na nahukay bilang Hiva. Ang Kafr Aya ay isang nayon sa gobernadorado ng Homs ng Siria, sa gitna ng mga halamanan at lawa ng libis ng Orontes."
