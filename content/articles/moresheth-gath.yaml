# Overview article (ADR 0007). Mainstream facts only; Tel Goded (Tell ej-Judeideh) is given as the usual identification, resting on Eusebius and Jerome, with the alternatives named.
id: moresheth-gath
place: a6ac675
title:
  en: "Moresheth-gath"
  ru: "Морешеф-Геф"
body:
  en:
    - "Moresheth-gath was the home of the prophet Micah, “Micah the Morasthite”, who prophesied in the days of Jotham, Ahaz and Hezekiah, in the second half of the eighth century BC. The name, “possession of Gath”, marks it as a village of the Shephelah in the orbit of Philistine Gath, and it stands among the towns of Micah's lament, Gath, Achzib, Mareshah, Adullam and Lachish, over which the Assyrian invasion was to pass: “Therefore shalt thou give presents to Moresheth-gath”, the parting gifts of a bride, as the town is given away. A century later the elders of Judah remembered that “Micah the Morasthite prophesied in the days of Hezekiah king of Judah” that Zion would be ploughed like a field, and that Hezekiah had not put him to death but feared the LORD; the precedent saved Jeremiah's life."
    - "Eusebius placed Morasthi to the east of Eleutheropolis (Beit Guvrin), and Jerome, retracing Paula's journey, names Morasthim, once Micah's tomb and now a church. On that basis the site is usually sought at Tell ej-Judeideh (Tel Goded), a mound a few kilometres north of Beit Guvrin, which Bliss and Macalister dug for the Palestine Exploration Fund in 1899–1900, finding a fortified town of the Judean monarchy with many jar handles stamped “belonging to the king” from Hezekiah's reign, Micah's own time; Shimon Gibson reassessed their records in 1994. Tel Zayit to the west and Tell Eton to the south have also been proposed, and some older scholars took Moresheth to be Mareshah itself under another name."
    - "Tel Goded today is a mound in the Judean lowlands of Israel, in the farmland north of Beit Guvrin, which has not been dug again since 1900; the church of Micah's tomb has not been found."
  ru:
    - "Морешеф-Геф был родиной пророка Михея Морасфитина, пророчествовавшего во дни Иоафама, Ахаза и Езекии, во второй половине VIII века до н. э. Имя, «владение Гефа», отмечает его как селение Шефелы в орбите филистимского Гефа, и оно стоит среди городов плача Михея — Гефа, Ахзива, Мореша, Одоллама и Лахиса, по которым должно было пройти ассирийское нашествие: «Посему ты посылать будешь дары в Морешеф-Геф» — прощальные дары невесте, когда город отдают. Столетие спустя старейшины Иудеи вспоминали, что «Михей Морасфитянин пророчествовал во дни Езекии, царя Иудейского», что Сион будет вспахан, как поле, и что Езекия не предал его смерти, а убоялся Господа; этот пример спас жизнь Иеремии."
    - "Евсевий помещал Морасфи к востоку от Елевферополя (Бейт-Гуврина), а Иероним, описывая путешествие Павлы, называет Морасфим — некогда гробницу Михея, а ныне церковь. На этом основании место обычно ищут на Телль-эдж-Джудейде (Тель-Годед), холме в нескольких километрах к северу от Бейт-Гуврина, который Блисс и Макалистер копали для Палестинского исследовательского фонда в 1899–1900 годах и нашли укреплённый город иудейского царства со множеством ручек кувшинов с печатью «царю» времён Езекии, то есть самого Михея; Шимон Гибсон заново разобрал их записи в 1994 году. Предлагали также Тель-Зайит к западу и Тель-Этон к югу, а некоторые учёные прошлого считали Морешеф самой Марешей под другим именем."
    - "Тель-Годед сегодня — холм в Иудейской низменности Израиля, среди полей к северу от Бейт-Гуврина, который с 1900 года больше не раскапывали; церковь над гробницей Михея не найдена."
scripture:
