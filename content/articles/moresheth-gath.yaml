body:
  en:
    - "Moresheth-gath was the home of the prophet Micah, “Micah the Morasthite”, who prophesied in the days of Jotham, Ahaz and Hezekiah, in the second half of the eighth century BC. The name, “possession of Gath”, marks it as a village of the Shephelah in the orbit of Philistine Gath, and it stands among the towns of Micah's lament, Gath, Achzib, Mareshah, Adullam and Lachish, over which the Assyrian invasion was to pass: “Therefore shalt thou give presents to Moresheth-gath”, the parting gifts of a bride, as the town is given away. A century later the elders of Judah remembered that “Micah the Morasthite prophesied in the days of Hezekiah king of Judah” that Zion would be ploughed like a field, and that Hezekiah had not put him to death but feared the LORD; the precedent was cited in Jeremiah's defence."
    - "Eusebius placed Morasthi to the east of Eleutheropolis (Beit Guvrin), and Jerome, retracing Paula's journey, names Morasthim, once Micah's tomb and now a church. On that basis the site is usually sought at Tell ej-Judeideh (Tel Goded), a mound a few kilometres north of Beit Guvrin, which Bliss and Macalister dug for the Palestine Exploration Fund in 1899–1900, finding a fortified town of the Judean monarchy with many jar handles stamped “belonging to the king” from Hezekiah's reign, Micah's own time; Shimon Gibson reassessed their records in 1994. Tel Zayit to the west and Tell Eton to the south have also been proposed, and some older scholars took Moresheth to be Mareshah itself under another name."
    - "Tel Goded today is a mound in the Judean lowlands of Israel, in the farmland north of Beit Guvrin, which has not been dug again since 1900; the church of Micah's tomb has not been found."
  ru:
    - "Морешеф-Геф был родиной пророка Михея Морасфитина, пророчествовавшего во дни Иоафама, Ахаза и Езекии, во второй половине VIII века до н. э. Имя, «владение Гефа», отмечает его как селение Шефелы в орбите филистимского Гефа, и оно стоит среди городов плача Михея — Гефа, Ахзива, Мореша, Одоллама и Лахиса, по которым должно было пройти ассирийское нашествие: «Посему ты посылать будешь дары в Морешеф-Геф» — прощальные дары невесте, когда город отдают. Столетие спустя старейшины Иудеи вспоминали, что «Михей Морасфитянин пророчествовал во дни Езекии, царя Иудейского», что Сион будет вспахан, как поле, и что Езекия не предал его смерти, а убоялся Господа; на этот пример сослались, защищая Иеремию."
    - "Евсевий помещал Морасфи к востоку от Елевферополя (Бейт-Гуврина), а Иероним, описывая путешествие Павлы, называет Морасфим — некогда гробницу Михея, а ныне церковь. На этом основании место обычно ищут на Телль-эдж-Джудейде (Тель-Годед), холме в нескольких километрах к северу от Бейт-Гуврина, который Блисс и Макалистер копали для Палестинского исследовательского фонда в 1899–1900 годах и нашли укреплённый город иудейского царства со множеством ручек кувшинов с печатью «царю» времён Езекии, то есть самого Михея; Шимон Гибсон заново разобрал их записи в 1994 году. Предлагали также Тель-Зайит к западу и Тель-Этон к югу, а некоторые учёные прошлого считали Морешеф самой Марешей под другим именем."
    - "Тель-Годед сегодня — холм в Иудейской низменности Израиля, среди полей к северу от Бейт-Гуврина, который с 1900 года больше не раскапывали; церковь над гробницей Михея не найдена."
  uk:
    - "Морешет-Гат був домом пророка Міхея, «Михея Морастія», який пророкував за днів Йотама, Ахаза й Єзекії, у другій половині VIII ст. до н. е. Назва, «володіння Гата», позначає його як село Шефели в орбіті філістимського Гата, і воно стоїть серед міст плачу Міхея — Гата, Ахзіва, Мареші, Одолама й Лахіша, через які мало пройти ассирійське вторгнення: «Тим же то будеш ти посилати дари в Морешет-Гет» — прощальні дари нареченої, коли місто віддають. Через століття старші Юди згадали, що «Михей з Морасту пророкував за царя Юдейського Езекії», що Сіон орати муть, як ниву, і що Єзекія не вбив його, а злякався Господа; на цей прецедент послалися, захищаючи Єремію."
    - "Євсевій розміщував Мораст на схід від Елевтерополя (Бейт-Гуврін), а Ієронім, повторюючи подорож Павли, називає Морастім, колись гробницю Міхея, а тепер церкву. На цій підставі місце зазвичай шукають у Телль-ед-Джудейде (Тель-Годед), пагорбі за кілька кілометрів на північ від Бейт-Гуврина, який Бліс і Макалістер розкопували для Фонду дослідження Палестини в 1899–1900 рр., знайшовши укріплене місто Юдейської монархії з багатьма ручками збанків із печаткою «належить цареві» часів Єзекії, часів самого Міхея; Шимон Гібсон переглянув їхні записи 1994 р. Пропонували також Тель-Зайт на заході й Телль-Ейтон на півдні, а деякі давніші вчені вважали Морешет самою Марешою під іншою назвою."
    - "Тель-Годед сьогодні — пагорб в Юдейській низовині Ізраїлю, на ріллі на північ від Бейт-Гуврина, який не копали вдруге від 1900 р.; церкву гробниці Міхея не знайдено."
  es:
    - "Moreset-gat era la patria del profeta Miqueas, «Miqueas de Morasti», que profetizó en los días de Jotam, Acaz y Ezequías, en la segunda mitad del siglo VIII a. C. El nombre, «posesión de Gat», la señala como una aldea de la Sefelá en la órbita de la filistea Gat, y figura entre las ciudades del lamento de Miqueas, Gat, Aczib, Maresa, Adulam y Laquis, por donde debía pasar la invasión asiria: «Por tanto, tú darás dones á Moreseth-gath», los regalos de despedida de una novia, mientras la ciudad es entregada. Un siglo después, los ancianos de Judá recordaron que «Miqueas de Morasti profetizó en tiempo de Ezechîas rey de Judá» que Sion sería arada como un campo, y que Ezequías no lo había mandado matar sino que temió a Jehová; el precedente se citó en defensa de Jeremías."
    - "Eusebio situó Morasti al este de Eleuterópolis (Beit Guvrin), y Jerónimo, siguiendo el viaje de Paula, nombra Morasthim, antes tumba de Miqueas y ahora iglesia. Sobre esa base el sitio se busca habitualmente en Tell ej-Judeideh (Tel Goded), un montículo a pocos kilómetros al norte de Beit Guvrin, que Bliss y Macalister excavaron para el Palestine Exploration Fund en 1899–1900, hallando una ciudad fortificada de la monarquía de Judá con muchas asas de jarras selladas «del rey» del reinado de Ezequías, la época del propio Miqueas; Shimon Gibson reevaluó sus registros en 1994. También se han propuesto Tel Zayit, al oeste, y Tell Eton, al sur, y algunos estudiosos antiguos tomaron Moreset por la propia Maresa bajo otro nombre."
    - "Tel Goded es hoy un montículo en las tierras bajas de Judea, en Israel, en los campos al norte de Beit Guvrin, que no ha vuelto a excavarse desde 1900; la iglesia de la tumba de Miqueas no ha sido hallada."
  pt:
    - "Moresete-Gate foi a terra do profeta Miqueias, “Miqueias, o morastita”, que profetizou nos dias de Jotão, Acaz e Ezequias, na segunda metade do século VIII a.C. O nome, “posse de Gate”, a marca como uma aldeia da Sefelá na órbita da filisteia Gate, e ela está entre as cidades do lamento de Miqueias, Gate, Aczibe, Maressa, Adulão e Laquis, por onde passaria a invasão assíria: “Portanto, você dará um presente de despedida a Moresete-Gate”, os presentes de despedida de uma noiva, enquanto a cidade é entregue. Um século depois, os anciãos de Judá lembraram que “Miqueias, o morastita, profetizou nos dias de Ezequias, rei de Judá” que Sião seria arada como um campo, e que Ezequias não o matou mas temeu o SENHOR; o precedente foi citado na defesa de Jeremias."
    - "Eusébio situou Morasti a leste de Eleuterópolis (Bet Guvrin), e Jerônimo, refazendo a viagem de Paula, nomeia Morastim, outrora o túmulo de Miqueias e agora uma igreja. Com base nisso, o sítio costuma ser procurado em Tell ej-Judeideh (Tel Goded), um montículo a poucos quilômetros ao norte de Bet Guvrin, que Bliss e Macalister escavaram para o Fundo de Exploração da Palestina em 1899–1900, achando uma cidade fortificada da monarquia de Judá com muitas alças de jarro carimbadas “pertencente ao rei” do reinado de Ezequias, o próprio tempo de Miqueias; Shimon Gibson reavaliou seus registros em 1994. Tel Zayit, a oeste, e Tell Eton, ao sul, também foram propostos, e alguns estudiosos mais antigos tomaram Moresete pela própria Maressa sob outro nome."
    - "Tel Goded é hoje um montículo nas terras baixas da Judeia, em Israel, nos campos ao norte de Bet Guvrin, que não foi escavado de novo desde 1900; a igreja do túmulo de Miqueias não foi encontrada."
  de:
    - "Moreschet-Gat war die Heimat des Propheten Micha, „Micha von Moreseth“, der zur Zeit Jotams, Ahas' und Hiskias weissagte, in der zweiten Hälfte des 8. Jahrhunderts v. Chr. Der Name, „Besitz von Gat“, kennzeichnet es als Dorf der Schefela im Umfeld des philistäischen Gat, und es steht unter den Städten von Michas Klage, Gat, Achsib, Maresa, Adullam und Lachisch, über die der assyrische Einfall hinwegziehen sollte: „Du wirst dich müssen scheiden von Moreseth-Gath“, im Hebräischen ist von den Abschiedsgeschenken einer Braut die Rede, als werde die Stadt weggegeben. Ein Jahrhundert später erinnerten die Ältesten Judas daran: „Zur Zeit Hiskias, des Königs in Juda, war ein Prophet, Micha von Moreseth“, der gesagt hatte, „Zion wird wie ein Acker gepflügt werden“, und Hiskia ihn nicht töten ließ: „ja sie fürchteten vielmehr den HERRN“; der Präzedenzfall wurde zu Jeremias Verteidigung angeführt."
    - "Eusebius setzte Morasthi östlich von Eleutheropolis (Beit Guvrin) an, und Hieronymus, der Paulas Reise nachzeichnet, nennt Morasthim, einst Michas Grab und jetzt eine Kirche. Daraufhin wird der Ort meist in Tell ej-Judeideh (Tel Goded) gesucht, einem Hügel einige Kilometer nördlich von Beit Guvrin, den Bliss und Macalister 1899–1900 für den Palestine Exploration Fund ausgruben und dabei eine befestigte Stadt der judäischen Monarchie mit vielen Krughenkeln fanden, gestempelt „dem König gehörig“, aus der Zeit Hiskias, Michas eigener Zeit; Schimon Gibson wertete ihre Aufzeichnungen 1994 neu aus. Tel Zayit im Westen und Tell Eton im Süden wurden ebenfalls vorgeschlagen, und manche ältere Gelehrte hielten Moreschet für Maresa selbst unter anderem Namen."
    - "Tel Goded ist heute ein Hügel im judäischen Tiefland Israels, im Ackerland nördlich von Beit Guvrin, der seit 1900 nicht wieder ausgegraben wurde; die Kirche von Michas Grab ist nicht gefunden worden."
  fr:
    - "Moréscheth-Gath était la patrie du prophète Michée, « Michée, de Moréscheth », qui prophétisa du temps de Jotham, d’Achaz et d’Ézéchias, dans la seconde moitié du VIIIe siècle av. J.-C. Le nom, « possession de Gath », la désigne comme un village de la Shéphéla dans l’orbite de la Gath philistine, et elle figure parmi les villes de la complainte de Michée, Gath, Aczib, Maréscha, Adullam et Lakis, sur lesquelles devait passer l’invasion assyrienne : Michée parle de présents d’adieu à Moréscheth-Gath, ceux d’une fiancée, tandis que la ville est livrée. Un siècle plus tard, les anciens de Juda se souvinrent que « Michée, de Moréscheth, prophétisait du temps d’Ézéchias, roi de Juda » que Sion serait labourée comme un champ, et que, loin de le faire mourir, Ézéchias avait craint l’Éternel ; ce précédent fut invoqué pour la défense de Jérémie."
    - "Eusèbe plaçait Morasthi à l’est d’Éleuthéropolis (Beit Guvrin), et Jérôme, refaisant le voyage de Paula, nomme Morasthim, jadis le tombeau de Michée et aujourd’hui une église. Sur cette base, le site est d’ordinaire cherché à Tell ej-Judeideh (Tel Goded), tertre à quelques kilomètres au nord de Beit Guvrin, que Bliss et Macalister fouillèrent pour le Palestine Exploration Fund en 1899–1900, trouvant une ville fortifiée de la monarchie de Juda avec de nombreuses anses de jarres estampillées « appartenant au roi » du règne d’Ézéchias, le temps même de Michée ; Shimon Gibson a réexaminé leurs relevés en 1994. Tel Zayit à l’ouest et Tell Eton au sud ont aussi été proposés, et certains anciens savants prenaient Moréscheth pour Maréscha elle-même sous un autre nom."
    - "Tel Goded est aujourd’hui un tertre des basses terres de Judée, en Israël, dans les terres cultivées au nord de Beit Guvrin, qui n’a pas été refouillé depuis 1900 ; l’église du tombeau de Michée n’a pas été retrouvée."
  it:
    - "Morèset-Gat era la patria del profeta Michea, «Michea, il Morashtita», che profetizzò ai giorni di Iotam, Acaz ed Ezechia, nella seconda metà dell’VIII secolo a.C. Il nome, «possesso di Gat», la segna come un villaggio della Sefela nell’orbita della Gat filistea, e sta tra le città del lamento di Michea, Gat, Aczib, Maresa, Adullam e Lachis, sulle quali doveva passare l’invasione assira: «Perciò tu darai un regalo d’addio a Moresheth-Gath», i doni di congedo di una sposa, mentre la città viene ceduta. Un secolo dopo gli anziani di Giuda ricordarono che «Michea, il Morashtita, profetizzò ai giorni d’Ezechia, re di Giuda» che Sion sarebbe stata arata come un campo, e che Ezechia non l’aveva messo a morte ma aveva temuto l’Eterno; il precedente fu citato in difesa di Geremia."
    - "Eusebio collocava Morasthi a est di Eleuteropoli (Bet Guvrin), e Girolamo, ripercorrendo il viaggio di Paola, nomina Morasthim, un tempo tomba di Michea e ora chiesa. Su questa base il sito si cerca di solito a Tell ej-Judeideh (Tel Goded), un tell a pochi chilometri a nord di Bet Guvrin, che Bliss e Macalister scavarono per il Palestine Exploration Fund nel 1899–1900, trovando una città fortificata della monarchia giudaica con molte anse di giara bollate «appartenente al re» dal regno di Ezechia, il tempo stesso di Michea; Shimon Gibson ha riesaminato le loro registrazioni nel 1994. Sono stati proposti anche Tel Zayit a ovest e Tell Eton a sud, e alcuni studiosi più antichi ritennero Morèset la stessa Maresa sotto un altro nome."
    - "Tel Goded è oggi un tell nelle basse terre giudee di Israele, tra i campi a nord di Bet Guvrin, che non è stato più scavato dal 1900; la chiesa della tomba di Michea non è stata trovata."
  pl:
    - "Moreszet-Gat było domem proroka Miki, „Micheasza Morastytczyka”, który prorokował za dni Jotama, Achaza i Ezechiasza, w drugiej połowie VIII w. p.n.e. Nazwa, „posiadłość Gat”, znamionuje je jako wieś Szefeli w orbicie filistyńskiego Gat, i stoi wśród miast lamentu Miki, Gat, Akzib, Maresza, Adullam i Lakisz, przez które miała przejść asyryjska inwazja: „poślę upominki swe do Moreset w Giet”, pożegnalne dary panny młodej, gdy miasto jest oddawane. Wiek później starsi Judy pamiętali, że „Micheasz Morastytczyk prorokował za dni Ezechijasza, króla Judzkiego”, iż Syjon będzie zorany jak pole, i że Ezechiasz go nie zabił, lecz bał się Pana; na precedens powołano się w obronie Jeremiasza."
    - "Euzebiusz umieszczał Morasthi na wschód od Eleuteropolis (Bet Guvrin), a Hieronim, odtwarzając podróż Pauli, wymienia Morasthim, niegdyś grób Miki, a teraz kościół. Na tej podstawie miejsca szuka się zwykle w Tell ej-Judeideh (Tel Goded), kopcu kilka kilometrów na północ od Bet Guvrin, który Bliss i Macalister wykopywali dla Palestine Exploration Fund w latach 1899–1900, znajdując obwarowane miasto judzkiej monarchii z wieloma uchwytami dzbanów z pieczęcią „należące do króla” z czasów Ezechiasza, własnych czasów Miki; Shimon Gibson ponownie ocenił ich zapisy w 1994 r. Proponowano także Tel Zayit na zachodzie i Tell Eton na południu, a niektórzy dawniejsi uczeni uważali Moreszet za samą Maresę pod inną nazwą."
    - "Tel Goded jest dziś kopcem na judzkich nizinach w Izraelu, na polach na północ od Bet Guvrin, którego nie wykopywano ponownie od 1900 r.; kościół z grobem Miki nie został znaleziony."
  nl:
    - "Moreset-Gat was de woonplaats van de profeet Micha, “Micha, den Morastiet”, die profeteerde in de dagen van Jotam, Achaz en Chizkia, in de tweede helft van de achtste eeuw v.Chr. De naam, “bezit van Gat”, wijst het aan als een dorp van de Sefela in de invloedssfeer van het Filistijnse Gat, en het staat onder de steden van Micha's klaagzang, Gat, Achzib, Maresa, Adullam en Lachis, waar de Assyrische inval doorheen zou trekken: “Daarom geef geschenken aan Morescheth-Gaths”, de afscheidsgeschenken van een bruid, nu de stad wordt weggegeven. Een eeuw later zeiden de oudsten van Juda: “Micha, de Morastiet, heeft in de dagen van Hizkia, koning van Juda, geprofeteerd”, dat Sion als een akker geploegd zou worden; en dat Chizkia hem niet had gedood maar de HEER had gevreesd – het precedent werd aangevoerd ter verdediging van Jeremia."
    - "Eusebius plaatste Morasthi ten oosten van Eleutheropolis (Beit Guvrin), en Hiëronymus, die Paula's reis navolgt, noemt Morasthim, eens Micha's graf en nu een kerk. Op die grond wordt de plaats gewoonlijk gezocht bij Tell ej-Judeideh (Tel Goded), een heuvel enkele kilometers ten noorden van Beit Guvrin, die Bliss en Macalister in 1899–1900 voor de Palestine Exploration Fund opgroeven, waarbij zij een versterkte stad van de Judese monarchie vonden met vele kruikhandvatten gestempeld “van de koning” uit Chizkia's regering, Micha's eigen tijd; Shimon Gibson herbeoordeelde hun gegevens in 1994. Tel Zayit in het westen en Tell Eton in het zuiden zijn eveneens voorgesteld, en sommige oudere geleerden hielden Moreset voor Maresa zelf onder een andere naam."
    - "Tel Goded is tegenwoordig een heuvel in het Judese laagland van Israël, in het akkerland ten noorden van Beit Guvrin, die sinds 1900 niet meer is opgegraven; de kerk van Micha's graf is niet gevonden."
  cs:
    - "Morešet-gat byl domov proroka Micheáše, zvaného „Moraštický“, který prorokoval za dnů Jotama, Achaze a Chizkijáše v druhé polovině 8. století př. n. l. Jméno, „majetek Gatu“, označuje vesnici Šefely v dosahu pelištejského Gatu a stojí mezi městy Micheášova nářku, Gatem, Achzívem, Marešou, Adulamem a Lachišem, přes něž měl projít asyrský vpád: „Protož pošleš dary své s Morešet v Gát“, odchodní dary nevěsty, jak je město odevzdáváno. O století později si judští starší pamatovali, že „Micheáš Moraštický prorokoval za času Ezechiáše krále Judského“, že Sijón bude zorán jako pole, a že jej Chizkijáš nezabil, nýbrž se bál Hospodina; precedens byl uveden na Jeremjášovu obranu."
    - "Eusebius kladl Morasthi na východ od Eleutheropole (Bejt Guvrin) a Jeroným, sledující cestu Pauly, jmenuje Morasthim, kdysi Micheášův hrob a nyní kostel. Na tomto základě se místo obvykle hledá v Tell ej-Judeideh (Tel Goded), pahorku několik kilometrů severně od Bejt Guvrinu, který pro Palestine Exploration Fund vykopávali Bliss a Macalister v letech 1899–1900 a nalezli opevněné město judské monarchie s mnoha uchy džbánů s razítkem „králův“ z doby Chizkijášovy, Micheášova vlastního času; Shimon Gibson jejich záznamy znovu zhodnotil roku 1994. Navrženy byly také Tel Zayit na západě a Tell Eton na jihu a někteří starší badatelé pokládali Morešet za samotnou Marešu pod jiným jménem."
    - "Tel Goded je dnes pahorek v judské nížině Izraele, na polích severně od Bejt Guvrinu, který nebyl od roku 1900 znovu kopán; kostel Micheášova hrobu nebyl nalezen."
  sv:
    - "Moreshet-Gat var profeten Mikas hemort, ”morastiten Mika”, som profeterade på Jotams, Achas' och Hiskias tid, under senare hälften av 700-talet f.Kr. Namnet, ”Gats egendom”, utmärker den som en by i Shefela i den filisteiska staden Gats omlopp, och den står bland städerna i Mikas klagan, Gat, Aksiv, Maresha, Adullam och Lakish, över vilka den assyriska invasionen skulle gå: ”Därför måste du giva skiljebrev åt Moreset-Gat”, en bruds avskedsgåvor, när staden bortges. Ett sekel senare mindes Judas äldste att ”Morastiten Mika profeterade i Hiskias, Juda konungs, tid” och sade att Sion skulle upplöjas som en åker, och att Hiskia inte hade dödat honom utan fruktat HERREN; prejudikatet åberopades till Jeremias försvar."
    - "Eusebios förlade Morasthi öster om Eleutheropolis (Beit Guvrin), och Hieronymus, som följer Paulas resa, nämner Morasthim, en gång Mikas grav och nu en kyrka. På den grunden söks platsen vanligen vid Tell ej-Judeideh (Tel Goded), en kulle några kilometer norr om Beit Guvrin, som Bliss och Macalister grävde för Palestine Exploration Fund 1899–1900 och fann en befäst stad från Juda monarki med många krukhandtag stämplade ”tillhörande kungen” från Hiskias tid, Mikas egen tid; Shimon Gibson omvärderade deras uppteckningar 1994. Tel Zayit i väster och Tell Eton i söder har också föreslagits, och vissa äldre forskare tog Moreshet för Maresha självt under ett annat namn."
    - "Tel Goded är i dag en kulle i Judeens lågland i Israel, i jordbruksmarken norr om Beit Guvrin, som inte har grävts om sedan 1900; kyrkan över Mikas grav har inte hittats."
  nb:
    - "Moresjet-Gat var hjemstedet til profeten Mika, «Mika fra Moreset», som profeterte i Jotams, Ahas' og Hiskias dager, i siste halvdel av 700-tallet f.Kr. Navnet, «Gats eiendom», kjennetegner det som en landsby i Sjefela i det filistriske Gats omland, og den står blant byene i Mikas klagesang, Gat, Aksib, Maresja, Adullam og Lakisj, som den assyriske invasjonen skulle trekke forbi: «Derfor skal du gi avkall på Moreset-Gat», ordene om avskjedsgavene til en brud idet byen gis bort. Et århundre senere husket Judas eldste at «Mika fra Moreset profeterte i Judas konge Esekias' dager» og forkynte at «Sion skal pløies som en aker», og at Hiskia ikke hadde drept ham, men fryktet Herren; presedensen ble anført til Jeremias forsvar."
    - "Eusebius plasserte Morasthi øst for Eleutheropolis (Bet Guvrin), og Hieronymus, som fulgte Paulas reise, nevner Morasthim, en gang Mikas grav og nå en kirke. På det grunnlaget søkes stedet vanligvis ved Tell ej-Judeideh (Tel Goded), en haug noen kilometer nord for Bet Guvrin, som Bliss og Macalister gravde for Palestine Exploration Fund i 1899–1900 og fant en befestet by fra det judeiske kongedømmet med mange krukehåndtak stemplet «tilhørende kongen» fra Hiskias regjeringstid, Mikas egen tid; Sjimon Gibson vurderte deres opptegnelser på nytt i 1994. Tel Zayit i vest og Tell Eton i sør er også foreslått, og noen eldre forskere tok Moreset for å være Maresja selv under et annet navn."
    - "Tel Goded er i dag en haug i det judeiske lavlandet i Israel, i jordbrukslandet nord for Bet Guvrin, som ikke har vært gravd i siden 1900; kirken ved Mikas grav er ikke funnet."
  tl:
    - "Ang Moresethgath ay tahanan ng propetang si Mikas, “Mikas na Morastita”, na nanghula sa mga araw nina Jotham, Achaz at Ezechias, sa ikalawang kalahati ng ika-8 siglo BK. Ang pangalan, “pag-aari ng Gath”, ay nagtatanda rito bilang nayon ng Sephela sa sakop ng Gath ng mga Filisteo, at nasa mga bayan ng panaghoy ni Mikas, Gath, Achzib, Maresa, Adullam at Lachis, na daraanan ng paglusob ng mga Asirio: “Kaya't ikaw ay magbibigay ng kaloob sa pagpapaalam sa Moresethgath”, ang mga kaloob ng pamamaalam ng isang nobya, habang ibinibigay ang bayan. Makalipas ang isang siglo, naalaala ng mga matanda ng Juda na “Miqueas na Morastita ay nanghula sa mga kaarawan ni Ezechias na hari sa Juda” na ang Sion ay aararuhing parang bukid, at hindi siya ipinapatay ni Ezechias kundi natakot sa Panginoon; binanggit ang pangyayaring ito sa pagtatanggol kay Jeremias."
    - "Inilagay ni Eusebio ang Morasthi sa silangan ng Eleutheropolis (Beit Guvrin), at binabanggit ni Jeronimo, na sinusubaybayan ang paglalakbay ni Paula, ang Morasthim, na dating libingan ni Mikas at ngayon ay simbahan. Batay rito, karaniwang hinahanap ang pook sa Tell ej-Judeideh (Tel Goded), isang burol ilang kilometro sa hilaga ng Beit Guvrin, na hinukay nina Bliss at Macalister para sa Palestine Exploration Fund noong 1899–1900, na nakatuklas ng kutang bayan ng monarkiyang Judeo na may maraming hawakan ng banga na tinatakan ng “pag-aari ng hari” mula sa paghahari ni Ezechias, ang panahon mismo ni Mikas; muling sinuri ni Shimon Gibson ang kanilang mga tala noong 1994. Iminungkahi rin ang Tel Zayit sa kanluran at ang Tell Eton sa timog, at itinuring ng ilang mas lumang iskolar na ang Moreseth ay Maresa mismo sa ibang pangalan."
    - "Ang Tel Goded ngayon ay burol sa mababang lupain ng Judea sa Israel, sa bukirin sa hilaga ng Beit Guvrin, na hindi na muling hinukay mula 1900; hindi pa natatagpuan ang simbahan ng libingan ni Mikas."
  da:
    - "Moresjet-Gat var hjemsted for profeten Mika, »Moraskthiten Mika«, som profeterede i Jotams, Akaz' og Hizkijas dage, i anden halvdel af 700-tallet f.Kr. Navnet, »Gats ejendom«, viser, at det var en landsby i Sjefela i kredsen om filisternes Gat, og det står blandt byerne i Mikas klagesang, Gat, Akzib, Maresja, Adullam og Lakisj, over hvilke den assyriske invasion skulle gå: »Derfor skal du give Afkald paa Moresketh-Gath«, en bruds afskedsgaver, idet byen gives bort. Et århundrede senere huskede Judas ældste, at »Morasktiten Mika spaaede i Ezekias's, Judas Konges Dage«, at Zion skulle pløjes som en ager, og at Hizkija ikke havde dræbt ham, men frygtet Herren; præcedensen blev anført til Jeremias' forsvar."
    - "Eusebius placerede Morasthi øst for Eleutheropolis (Beit Guvrin), og Hieronymus, der følger Paulas rejse, nævner Morasthim, engang Mikas grav og nu en kirke. På dette grundlag søges stedet sædvanligvis ved Tell ej-Judeideh (Tel Goded), en høj nogle få kilometer nord for Beit Guvrin, som Bliss og Macalister gravede for Palestine Exploration Fund i 1899–1900 og fandt en befæstet by fra det judæiske kongedømme med mange krukkehanke stemplet »tilhørende kongen« fra Hizkijas regeringstid, Mikas egen tid; Shimon Gibson revurderede deres optegnelser i 1994. Tel Zayit mod vest og Tell Eton mod syd er også blevet foreslået, og nogle ældre forskere tog Moresjet for at være Maresja selv under et andet navn."
    - "Tel Goded er i dag en høj i Israels judæiske lavland, i agerlandet nord for Beit Guvrin, som ikke er gravet igen siden 1900; kirken ved Mikas grav er ikke fundet."
