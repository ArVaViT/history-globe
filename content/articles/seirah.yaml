# Overview article (ADR 0007). Mainstream facts only; the place is unlocated and may be a landscape word rather than a town; the app's three candidates are named.
id: seirah
place: a1aff30
title:
  en: "Seirah"
  ru: "Сеираф"
  uk: "Сеїра"
  es: "Seirat"
  pt: "Seira"
  de: "Seïra"
  fr: "Séira"
body:
  en:
    - "Seirah (Seirath in the King James Version) is the place to which Ehud escaped after killing Eglon, king of Moab, in his upper room: while the king's servants waited at the locked doors, Ehud “passed beyond the quarries, and escaped unto Seirath”, and from there “blew a trumpet in the mountain of Ephraim” and led the Israelites down against the Moabites at the fords of the Jordan. The name occurs only here. The Hebrew word suggests something hairy or shaggy, so it may mean a wooded or scrub-covered hill rather than a town; the “quarries”, or carved stones, that he passed were “by Gilgal” near Jericho."
    - "Nothing more is known. Since Ehud sounded the trumpet in the hills of Ephraim, most place Seirah somewhere on the western slopes above Jericho, on the road up into the hill country; others leave it in the Jordan Valley, and the map shows both, with a third candidate in Moab across the river, the direction a fugitive from Moab's king would hardly have taken. No site bears a form of the name, and nothing has been excavated as Seirah."
  ru:
    - "Сеираф — место, куда спасся Аод, убив Еглона, царя Моавитского, в его горнице: пока слуги царя ждали у запертых дверей, Аод «прошел мимо истуканов и спасся в Сеираф», а оттуда «вострубил трубою на горе Ефремовой» и повёл израильтян вниз против моавитян к переправам через Иордан. Имя встречается только здесь. Еврейское слово означает что-то косматое, так что это может быть не город, а лесистый или заросший кустарником холм; «истуканы», мимо которых он прошёл, стояли «в Галгале» близ Иерихона."
    - "Больше ничего не известно. Поскольку Аод трубил на горе Ефремовой, большинство помещает Сеираф где-то на западных склонах над Иерихоном, на дороге вверх в нагорье; другие оставляют его в долине Иордана, и на карте показаны оба варианта, а третьим — Моав за рекой, куда беглец от моавитского царя едва ли направился бы. Ни одно место не носит похожего имени, и ничего не раскопано как Сеираф."
  uk:
    - "Сеїра (у Біблії Куліша — Сеїрат) — місце, куди втік Егуд, убивши Еглона, царя Моава, в його горішній кімнаті: поки слуги царя чекали біля замкнених дверей, Егуд «пройшов мимо виструганих ідолїв і уйшов у Сеїрат», а звідти «ударив на Ефраїм горах у трубу» й повів ізраїльтян вниз на моавітян до бродів Йордану. Назва трапляється лише тут. Івритське слово наводить на думку про щось волосате, кошлате, тож вона може означати вкритий лісом чи чагарями пагорб, а не місто; «каменярні», або тесані камені, повз які він пройшов, були «біля Гілгала», поблизу Єрихона."
    - "Більше нічого не відомо. Оскільки Егуд засурмив у горах Ефраїма, більшість поміщає Сеїру десь на західних схилах над Єрихоном, на дорозі вгору в нагір'я; інші лишають її в Йорданській долині, і карта показує обидва місця, із третім кандидатом у Моаві по той бік річки, у напрямку, яким утікач від царя Моава навряд чи пішов би. Жодне місце не носить форми цієї назви, і ніщо не розкопане як Сеїра."
  es:
    - "Seirat (Seirath en la King James Version) es el lugar adonde escapó Aod tras matar a Eglón, rey de Moab, en su aposento alto: mientras los siervos del rey esperaban ante las puertas cerradas, Aod, «pasando los ídolos, salvóse en Seirath», y desde allí «tocó el cuerno en el monte de Ephraim» y condujo a los israelitas contra los moabitas en los vados del Jordán. El nombre aparece solo aquí. La palabra hebrea sugiere algo velludo o hirsuto, de modo que puede significar una colina boscosa o cubierta de matorral más que una ciudad; los «ídolos», o piedras talladas, que pasó estaban «en Gilgal», cerca de Jericó."
    - "No se sabe nada más. Como Aod tocó el cuerno en las colinas de Efraín, la mayoría sitúa Seirat en algún lugar de las laderas occidentales sobre Jericó, en el camino que sube a la región montañosa; otros la dejan en el valle del Jordán, y el mapa muestra ambos, con un tercer candidato en Moab al otro lado del río, la dirección que difícilmente habría tomado un fugitivo del rey de Moab. Ningún lugar lleva una forma del nombre, y nada se ha excavado como Seirat."
  pt:
    - "Seira (Seirath na King James) é o lugar para onde Eúde escapou depois de matar Eglom, rei de Moabe, em seu quarto superior: enquanto os servos do rei esperavam diante das portas trancadas, Eúde “passou pelos ídolos de pedra e fugiu para Seirá”, e dali “tocou a trombeta na região montanhosa de Efraim” e conduziu os israelitas contra os moabitas nos vaus do Jordão. O nome ocorre só aqui. A palavra hebraica sugere algo peludo ou hirsuto, de modo que pode significar uma colina arborizada ou coberta de mato, e não uma cidade; as “pedreiras”, ou pedras talhadas, por que passou ficavam “perto de Gilgal”, junto a Jericó."
    - "Nada mais se sabe. Como Eúde tocou a trombeta nas colinas de Efraim, a maioria situa Seira em algum ponto das encostas ocidentais acima de Jericó, na estrada que sobe para a região montanhosa; outros a deixam no vale do Jordão, e o mapa mostra ambos, com um terceiro candidato em Moabe, do outro lado do rio, direção que um fugitivo do rei de Moabe dificilmente tomaria. Nenhum local traz uma forma do nome, e nada foi escavado como Seira."
  de:
    - "Seïra (in der King-James-Bibel Seirath) ist der Ort, wohin Ehud floh, nachdem er Eglon, den König von Moab, in dessen Obergemach getötet hatte: Während die Diener des Königs vor den verschlossenen Türen warteten, ging Ehud „an den Götzen vorüber und entrann bis gen Seira“, und dort „blies er die Posaune auf dem Gebirge Ephraim“ und führte die Israeliten hinab gegen die Moabiter an den Furten des Jordan. Der Name kommt nur hier vor. Das hebräische Wort weist auf etwas Haariges oder Zottiges, es mag also einen bewaldeten oder buschbewachsenen Hügel statt einer Stadt bezeichnen; die „Götzen“ (in der King-James-Bibel „quarries“), behauene Steine, an denen er vorüberging, standen bei Gilgal nahe Jericho."
    - "Mehr ist nicht bekannt. Da Ehud im Gebirge Ephraim die Posaune blies, setzen die meisten Seïra irgendwo an die Westhänge über Jericho, an die Straße hinauf ins Bergland; andere lassen es im Jordantal, und die Karte zeigt beides, mit einem dritten Kandidaten in Moab jenseits des Flusses, in eine Richtung, die ein Flüchtling vor dem König Moabs kaum eingeschlagen hätte. Keine Stätte trägt eine Form des Namens, und nichts wurde als Seïra ausgegraben."
  fr:
    - "Séira (Seirath dans la King James Version) est le lieu où Éhud s’échappa après avoir tué Églon, roi de Moab, dans sa chambre haute : tandis que les serviteurs du roi attendaient devant les portes fermées, Éhud « dépassa les carrières, et se sauva à Seïra », et de là « sonna de la trompette dans la montagne d’Éphraïm » et mena les Israélites contre les Moabites aux gués du Jourdain. Le nom n’apparaît qu’ici. Le mot hébreu évoque quelque chose de velu ou de hirsute, de sorte qu’il peut signifier une colline boisée ou couverte de broussailles plutôt qu’une ville ; les « carrières », ou pierres taillées, qu’il dépassa étaient « près de Guilgal », près de Jéricho."
    - "On ne sait rien de plus. Puisqu’Éhud sonna de la trompette dans les collines d’Éphraïm, la plupart placent Séira quelque part sur les pentes occidentales au-dessus de Jéricho, sur la route montant vers les hautes terres ; d’autres la laissent dans la vallée du Jourdain, et la carte montre les deux, avec un troisième candidat en Moab, de l’autre côté du fleuve, direction qu’un fugitif du roi de Moab n’aurait guère prise. Aucun site ne porte une forme du nom, et rien n’a été fouillé comme Séira."
scripture:
