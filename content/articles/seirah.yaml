body:
  en:
    - "Seirah (Seirath in the King James Version) is the place to which Ehud escaped after killing Eglon, king of Moab, in his upper room: while the king's servants waited at the locked doors, Ehud “passed beyond the quarries, and escaped unto Seirath”, and from there “blew a trumpet in the mountain of Ephraim” and led the Israelites down against the Moabites at the fords of the Jordan. The name occurs only here. The Hebrew word suggests something hairy or shaggy, so it may mean a wooded or scrub-covered hill rather than a town; the “quarries”, or carved stones, that he passed were “by Gilgal” near Jericho."
    - "Nothing more is known. Since Ehud sounded the trumpet in the hills of Ephraim, most place Seirah somewhere on the western slopes above Jericho, on the road up into the hill country; others leave it in the Jordan Valley, and the map shows both, with a third candidate in Moab across the river, the direction a fugitive from Moab's king would hardly have taken. No site bears a form of the name, and nothing has been excavated as Seirah."
  ru:
    - "Сеираф — место, куда спасся Аод, убив Еглона, царя Моавитского, в его горнице: пока слуги царя ждали у запертых дверей, Аод «прошел мимо истуканов и спасся в Сеираф», а оттуда «вострубил трубою на горе Ефремовой» и повёл израильтян вниз против моавитян к переправам через Иордан. Имя встречается только здесь. Еврейское слово означает что-то косматое, так что это может быть не город, а лесистый или заросший кустарником холм; «истуканы», мимо которых он прошёл, стояли «в Галгале» близ Иерихона."
    - "Больше ничего не известно. Поскольку Аод трубил на горе Ефремовой, большинство помещает Сеираф где-то на западных склонах над Иерихоном, на дороге вверх в нагорье; другие оставляют его в долине Иордана, и на карте показаны оба варианта, а третьим — Моав за рекой, куда беглец от моавитского царя едва ли направился бы. Ни одно место не носит похожего имени, и ничего не раскопано как Сеираф."
  uk:
    - "Сеїра (у Біблії Куліша — Сеїрат) — місце, куди втік Егуд, убивши Еглона, царя Моава, в його горішній кімнаті: поки слуги царя чекали біля замкнених дверей, Егуд «пройшов мимо виструганих ідолїв і уйшов у Сеїрат», а звідти «ударив на Ефраїм горах у трубу» й повів ізраїльтян вниз на моавітян до бродів Йордану. Назва трапляється лише тут. Івритське слово наводить на думку про щось волосате, кошлате, тож вона може означати вкритий лісом чи чагарями пагорб, а не місто; «каменярні», або тесані камені, повз які він пройшов, були «біля Гілгала», поблизу Єрихона."
    - "Більше нічого не відомо. Оскільки Егуд засурмив у горах Ефраїма, більшість поміщає Сеїру десь на західних схилах над Єрихоном, на дорозі вгору в нагір'я; інші лишають її в Йорданській долині, і карта показує обидва місця, із третім кандидатом у Моаві по той бік річки, у напрямку, яким утікач від царя Моава навряд чи пішов би. Жодне місце не носить форми цієї назви, і ніщо не розкопане як Сеїра."
  es:
    - "Seirat (Seirath en la King James Version) es el lugar adonde escapó Aod tras matar a Eglón, rey de Moab, en su aposento alto: mientras los siervos del rey esperaban ante las puertas cerradas, Aod, «pasando los ídolos, salvóse en Seirath», y desde allí «tocó el cuerno en el monte de Ephraim» y condujo a los israelitas contra los moabitas en los vados del Jordán. El nombre aparece solo aquí. La palabra hebrea sugiere algo velludo o hirsuto, de modo que puede significar una colina boscosa o cubierta de matorral más que una ciudad; los «ídolos», o piedras talladas, que pasó estaban «en Gilgal», cerca de Jericó."
    - "No se sabe nada más. Como Aod tocó el cuerno en las colinas de Efraín, la mayoría sitúa Seirat en algún lugar de las laderas occidentales sobre Jericó, en el camino que sube a la región montañosa; otros la dejan en el valle del Jordán, y el mapa muestra ambos, con un tercer candidato en Moab al otro lado del río, la dirección que difícilmente habría tomado un fugitivo del rey de Moab. Ningún lugar lleva una forma del nombre, y nada se ha excavado como Seirat."
  pt:
    - "Seira (Seirath na King James) é o lugar para onde Eúde escapou depois de matar Eglom, rei de Moabe, em seu quarto superior: enquanto os servos do rei esperavam diante das portas trancadas, Eúde “passou pelos ídolos de pedra e fugiu para Seirá”, e dali “tocou a trombeta na região montanhosa de Efraim” e conduziu os israelitas contra os moabitas nos vaus do Jordão. O nome ocorre só aqui. A palavra hebraica sugere algo peludo ou hirsuto, de modo que pode significar uma colina arborizada ou coberta de mato, e não uma cidade; as “pedreiras”, ou pedras talhadas, por que passou ficavam “perto de Gilgal”, junto a Jericó."
    - "Nada mais se sabe. Como Eúde tocou a trombeta nas colinas de Efraim, a maioria situa Seira em algum ponto das encostas ocidentais acima de Jericó, na estrada que sobe para a região montanhosa; outros a deixam no vale do Jordão, e o mapa mostra ambos, com um terceiro candidato em Moabe, do outro lado do rio, direção que um fugitivo do rei de Moabe dificilmente tomaria. Nenhum local traz uma forma do nome, e nada foi escavado como Seira."
  de:
    - "Seïra (in der King-James-Bibel Seirath) ist der Ort, wohin Ehud floh, nachdem er Eglon, den König von Moab, in dessen Obergemach getötet hatte: Während die Diener des Königs vor den verschlossenen Türen warteten, ging Ehud „an den Götzen vorüber und entrann bis gen Seira“, und dort „blies er die Posaune auf dem Gebirge Ephraim“ und führte die Israeliten hinab gegen die Moabiter an den Furten des Jordan. Der Name kommt nur hier vor. Das hebräische Wort weist auf etwas Haariges oder Zottiges, es mag also einen bewaldeten oder buschbewachsenen Hügel statt einer Stadt bezeichnen; die „Götzen“ (in der King-James-Bibel „quarries“), behauene Steine, an denen er vorüberging, standen bei Gilgal nahe Jericho."
    - "Mehr ist nicht bekannt. Da Ehud im Gebirge Ephraim die Posaune blies, setzen die meisten Seïra irgendwo an die Westhänge über Jericho, an die Straße hinauf ins Bergland; andere lassen es im Jordantal, und die Karte zeigt beides, mit einem dritten Kandidaten in Moab jenseits des Flusses, in eine Richtung, die ein Flüchtling vor dem König Moabs kaum eingeschlagen hätte. Keine Stätte trägt eine Form des Namens, und nichts wurde als Seïra ausgegraben."
  fr:
    - "Séira (Seirath dans la King James Version) est le lieu où Éhud s’échappa après avoir tué Églon, roi de Moab, dans sa chambre haute : tandis que les serviteurs du roi attendaient devant les portes fermées, Éhud « dépassa les carrières, et se sauva à Seïra », et de là « sonna de la trompette dans la montagne d’Éphraïm » et mena les Israélites contre les Moabites aux gués du Jourdain. Le nom n’apparaît qu’ici. Le mot hébreu évoque quelque chose de velu ou de hirsute, de sorte qu’il peut signifier une colline boisée ou couverte de broussailles plutôt qu’une ville ; les « carrières », ou pierres taillées, qu’il dépassa étaient « près de Guilgal », près de Jéricho."
    - "On ne sait rien de plus. Puisqu’Éhud sonna de la trompette dans les collines d’Éphraïm, la plupart placent Séira quelque part sur les pentes occidentales au-dessus de Jéricho, sur la route montant vers les hautes terres ; d’autres la laissent dans la vallée du Jourdain, et la carte montre les deux, avec un troisième candidat en Moab, de l’autre côté du fleuve, direction qu’un fugitif du roi de Moab n’aurait guère prise. Aucun site ne porte une forme du nom, et rien n’a été fouillé comme Séira."
  it:
    - "Seirat (Seirath nella King James Version) è il luogo in cui Eud scampò dopo aver ucciso Eglon, re di Moab, nella sua camera alta: mentre i servi del re aspettavano alle porte chiuse, Eud «passò oltre le cave di pietra, e si mise in salvo nella Seira», e da lì «suonò la tromba nella contrada montuosa di Efraim» e guidò gli Israeliti giù contro i Moabiti ai guadi del Giordano. Il nome ricorre solo qui. La parola ebraica suggerisce qualcosa di peloso o ispido, per cui può significare una collina boscosa o coperta di sterpi più che una città; le «cave», o pietre scolpite, che passò erano «presso a Ghilgal» vicino a Gerico."
    - "Non si sa altro. Poiché Eud suonò la tromba sulle colline di Efraim, i più collocano Seirat da qualche parte sui pendii occidentali sopra Gerico, sulla strada che sale nella regione montuosa; altri la lasciano nella Valle del Giordano, e la mappa mostra entrambe, con un terzo candidato in Moab oltre il fiume, la direzione che un fuggiasco dal re di Moab difficilmente avrebbe preso. Nessun sito porta una forma del nome, e nulla è stato scavato come Seirat."
  pl:
    - "Seira (Seirath w Biblii Króla Jakuba) to miejsce, dokąd uciekł Ehud po zabiciu Eglona, króla Moabu, w jego górnej izbie: gdy słudzy króla czekali przed zamkniętymi drzwiami, Ehud, „minąwszy góry kamienne, szedł do Seiratu”, i stamtąd „zatrąbił w trąbę na górze Efraim” i poprowadził Izraelitów przeciw Moabitom nad brodami Jordanu. Nazwa występuje tylko tu. Hebrajskie słowo kojarzy się z czymś włochatym lub kudłatym, więc może oznaczać wzgórze zalesione lub porośnięte krzewami, a nie miasto; „góry kamienne”, czyli ciosane kamienie, które minął, to te, „które były w Galgal” koło Jerycha."
    - "Nic więcej nie wiadomo. Ponieważ Ehud zatrąbił w górach Efraima, większość umieszcza Seirę gdzieś na zachodnich stokach nad Jerychem, przy drodze w górę do kraju wyżyn; inni zostawiają ją w Dolinie Jordanu, a mapa pokazuje obie, z trzecim kandydatem w Moabie za rzeką, w kierunku, którego uciekinier przed królem Moabu raczej by nie obrał. Żadne stanowisko nie nosi postaci tej nazwy i nic nie wykopano jako Seirę."
  cs:
    - "Seira (v King James Version Seirath) je místo, kam Ehúd utekl poté, co v horním pokoji zabil Eglona, krále Moábu: zatímco královi služebníci čekali u zamčených dveří, Ehúd „ušel, a přešed lomy, přišel do Seirat“, a odtud „troubil v troubu na hoře Efraim“ a vedl Izraelity dolů proti Moábským u jordánských brodů. Jméno se vyskytuje jen zde. Hebrejské slovo napovídá cosi chlupatého či huňatého, takže může znamenat zalesněný či křovinatý pahorek spíše než město; „lomy“, neboli tesané kameny, které minul, byly „blízko Galgala“ u Jericha."
    - "Nic víc není známo. Protože Ehúd troubil v pahorcích Efrajimských, kladou většinou Seiru někam na západní svahy nad Jerichem, na cestu vzhůru do pahorkatiny; jiní ji ponechávají v Jordánském údolí a mapa ukazuje obojí, s třetím kandidátem v Moábu za řekou, ve směru, kterým by uprchlík před moábským králem sotva šel. Žádné místo nenese podobu jména a nic nebylo vykopáno jako Seira."
  nl:
    - "Seïra (Seirath in de King James Version) is de plaats waarheen Ehud ontkwam nadat hij Eglon, de koning van Moab, in zijn bovenvertrek had gedood: terwijl de dienaren van de koning bij de gesloten deuren wachtten, “ging” Ehud “voorbij de gesneden beelden, en ontkwam naar Sehirath”, en vandaar “blies hij met de bazuin op het gebergte van Efraim” en leidde de Israëlieten naar beneden tegen de Moabieten bij de voorden van de Jordaan. De naam komt alleen hier voor. Het Hebreeuwse woord doet denken aan iets harigs of ruigs, dus het kan een beboste of met struikgewas bedekte heuvel betekenen in plaats van een stad; de “gesneden beelden”, in de King James “quarries”, gehouwen stenen, die hij voorbijging, lagen “bij Gilgal” nabij Jericho."
    - "Meer is niet bekend. Omdat Ehud de bazuin blies in de heuvels van Efraïm, plaatsen de meesten Seïra ergens op de westelijke hellingen boven Jericho, aan de weg omhoog naar het bergland; anderen laten het in de Jordaanvallei, en de kaart toont beide, met een derde kandidaat in Moab aan de overkant van de rivier, de richting die een vluchteling voor de koning van Moab nauwelijks zou hebben genomen. Geen plaats draagt een vorm van de naam, en niets is als Seïra opgegraven."
  sv:
    - "Seira (Seirath i King James-översättningen) är platsen dit Ehud flydde efter att ha dödat Eglon, Moabs kung, i hans övre rum: medan kungens tjänare väntade vid de låsta dörrarna hade Ehud ”hunnit förbi Belätesplatsen och flydde sedan undan till Seira”, och därifrån lät han stöta i basun i Efraims bergsbygd och förde israeliterna ned mot moabiterna vid vadställena över Jordan. Namnet förekommer bara här. Det hebreiska ordet antyder något hårigt eller raggigt, så det kan betyda en skogig eller buskbevuxen kulle snarare än en stad; den plats med huggna stenar, ”Belätesplatsen vid Gilgal”, som han passerade låg nära Jeriko."
    - "Mer är inte känt. Eftersom Ehud stötte i basunen i Efraims berg placerar de flesta Seira någonstans på de västra sluttningarna ovanför Jeriko, på vägen upp i bergslandet; andra lämnar det i Jordandalen, och kartan visar båda, med en tredje kandidat i Moab på andra sidan floden, den riktning en flykting från Moabs kung knappast hade tagit. Ingen plats bär en form av namnet, och ingenting har grävts ut som Seira."
  nb:
    - "Seira (Seirath i King James Version) er stedet Ehud rømte til etter å ha drept Eglon, kongen av Moab, i overværelset hans: mens kongens tjenere ventet ved de låste dørene, var Ehud «allerede kommet forbi stenbruddene og kom frem til Se'ira», og derfra «støtte han i basunen på Efra'im-fjellet» og førte israelittene ned mot moabittene ved vadestedene over Jordan. Navnet forekommer bare her. Det hebraiske ordet antyder noe hårete eller buskete, så det kan bety en skogkledd eller krattkledd høyde snarere enn en by; «stenbruddene», eller de hogde steinene, han passerte var «ved Gilgal» nær Jeriko."
    - "Ingenting mer er kjent. Siden Ehud blåste i basunen i Efraims åser, plasserer de fleste Seira et sted i de vestlige skråningene over Jeriko, på veien opp i fjellandet; andre lar det ligge i Jordandalen, og kartet viser begge, med en tredje kandidat i Moab på den andre siden av elven, retningen en flyktning fra Moabs konge neppe ville ha tatt. Ingen steder bærer en form av navnet, og ingenting er gravd ut som Seira."
  tl:
    - "Ang Seirath (Seirah sa makabagong Ingles, Seirath sa King James Version) ay ang lugar kung saan tumakas si Aod pagkatapos patayin si Eglon, hari ng Moab, sa itaas na silid nito: habang naghihintay ang mga lingkod ng hari sa nakasarang mga pinto, dumaan si Aod sa “dako roon ng tibagan ng bato at tumakas hanggang sa Seirath”, at mula roon ay “hinipan ang pakakak sa lupaing maburol ng Ephraim” at pinangunahan ang mga Israelita pababa laban sa mga Moabita sa mga tawiran ng Jordan. Dito lamang lumilitaw ang pangalan. Ang salitang Hebreo ay nagpapahiwatig ng mabuhok o gusot, kaya maaaring nangangahulugan ito ng burol na makahoy o may sukal sa halip na bayan; ang “tibagan ng bato”, o mga inukit na bato, na dinaanan niya ay “na nasa piling ng Gilgal” malapit sa Jerico."
    - "Wala nang iba pang nalalaman. Yamang hinipan ni Aod ang pakakak sa mga burol ng Ephraim, inilalagay ng karamihan ang Seirath sa isang lugar sa kanlurang dalisdis sa itaas ng Jerico, sa daang paakyat sa maburol na lupain; iniiwan ito ng iba sa Libis ng Jordan, at ipinapakita ng mapa ang dalawa, na may ikatlong kandidato sa Moab sa kabila ng ilog, ang direksiyong halos hindi tatahakin ng tumatakas mula sa hari ng Moab. Walang lugar na may anyo ng pangalan, at walang hinukay bilang Seirath."
  da:
    - "Se'ira (Seirath i King James-oversættelsen) er stedet, hvortil Ehud flygtede efter at have dræbt Eglon, Moabs konge, i hans sommersal: mens kongens tjenere ventede ved de aflåste døre, undkom Ehud: han »gik forbi Stenbrudene og undkom til Seirath«, og derfra »blæste han i Trompeten paa Efraims Bjerg« og førte israelitterne ned mod moabitterne ved Jordans vadesteder. Navnet forekommer kun her. Det hebraiske ord antyder noget behåret eller strid, så det kan betyde en skovklædt eller buskbevokset høj snarere end en by; »stenbruddene«, eller hugne sten, som han passerede, var »ved Gilgal« nær Jeriko."
    - "Mere vides ikke. Da Ehud blæste i trompeten i Efraims bjerge, placerer de fleste Se'ira et sted på de vestlige skråninger over Jeriko, på vejen op i højlandet; andre lader det blive i Jordandalen, og kortet viser begge, med en tredje kandidat i Moab hinsides floden, den retning, en flygtning fra Moabs konge næppe ville have taget. Intet sted bærer en form af navnet, og intet er udgravet som Se'ira."
  sr:
    - "Сераф (Сеират у Библији краља Џејмса) је место у које је Аод побегао пошто је убио Еглона, цара моавског, у његовој горњој соби: док су царске слуге чекале пред закључаним вратима, Аод „прође ликове камене, и утече у Сериот“, а оданде „затруби у трубу у гори Јефремовој“ и повео Израиљце доле против Моаваца на бродовима јорданским. Име се јавља само овде. Хебрејска реч наговештава нешто длакаво или чупаво, па може значити шумовито или шибљем обрасло брдо пре него град; „ликови камени“, то јест клесано камење, које је прошао, беху „код Галгала“ близу Јерихона."
    - "Ништа више није познато. Пошто је Аод затрубио у брдима Јефремовим, већина Сераф смешта негде на западним падинама изнад Јерихона, на путу горе у брдовиту земљу; други га остављају у Долини јорданској, а карта приказује оба, с трећим кандидатом у Моаву преко реке, у правцу који би бегунац од цара Моава тешко узео. Ниједно налазиште не носи облик имена и ништа није ископано као Сераф."
  hu:
    - "Széira (Seirath a King James Version-ben) az a hely, ahová Ehúd menekült, miután megölte Eglont, Moáb királyát felső szobájában: míg a király szolgái a zárt ajtók előtt vártak, Ehúd „elhaladván a kőbányák mellett, Szeiráhba futott”, és onnan „kürtjébe fújt az Efraim hegyén”, és lehozta az izraelitákat a moábiak ellen a Jordán gázlóihoz. A név csak itt fordul elő. A héber szó szőrös vagy bozontos dolgot sejtet, így erdős vagy bozótos dombot jelenthet, nem várost; a „kőbányák”, azaz faragott kövek, amelyek mellett elhaladt, „Gilgálnál” voltak, Jerikó közelében."
    - "Többet nem tudni. Mivel Ehúd az efraimi hegyekben fújt kürtbe, a legtöbben Széirát valahol a Jerikó feletti nyugati lejtőkön helyezik el, a hegyvidékre felvezető úton; mások a Jordán-völgyben hagyják, és a térkép mindkettőt mutatja, egy harmadik jelölttel Moábban a folyón túl, abban az irányban, amelyet a moábi király elől menekülő aligha választott volna. Egyetlen hely sem viseli a név alakját, és semmit sem ástak ki Széiraként."
  fi:
    - "Seira (King James -käännöksessä Seirath) on paikka, johon Ehud pakeni surmattuaan Moabin kuninkaan Eglonin tämän yläsalissa: kun kuninkaan palvelijat odottivat lukittujen ovien takana, Ehud oli ”päässyt jumalankuvien ohi ja pakeni Seiraan”, ja sieltä hän ”puhalsi pasunaan Efraimin vuoristossa” ja johti israelilaiset alas moabilaisia vastaan Jordanin kahlauspaikoilla. Nimi esiintyy vain täällä. Heprean sana viittaa karvaiseen tai takkuiseen, joten se voi tarkoittaa metsäistä tai pensaikkoista kukkulaa pikemmin kuin kaupunkia; King Jamesin ”quarries”, eli veistetyt kivet, joiden ohi hän kulki, olivat ”Gilgalin luona” Jerikon lähellä."
    - "Muuta ei tiedetä. Koska Ehud puhalsi pasunaan Efraimin kukkuloilla, useimmat sijoittavat Seiran jonnekin Jerikon yläpuolisille läntisille rinteille, kukkulamaalle johtavan tien varrelle; toiset jättävät sen Jordanin laaksoon, ja kartta näyttää molemmat, kolmantena ehdokkaana Moabissa joen toisella puolella, mihin Moabin kuninkaan luota pakeneva tuskin olisi suunnannut. Mikään paikka ei kanna nimen muotoa, eikä mitään ole kaivettu Seirana."
  vi:
    - "Sê-i-rát (Seirath trong bản King James) là nơi Ê-hút chạy trốn sau khi giết Éc-lôn, vua Mô-áp, trong phòng trên của vua: trong khi các đầy tớ của vua chờ trước cửa khóa, Ê-hút “trốn qua khỏi các hầm đá, lánh đến Sê-ri-a”, và từ đó “thổi kèn lên trong núi Ép-ra-im” rồi dẫn người Y-sơ-ra-ên xuống đánh người Mô-áp ở các chỗ cạn sông Giô-đanh. Tên chỉ xuất hiện ở đây. Từ Hê-bơ-rơ gợi ý điều gì đó có lông hay xù xì, nên có thể nó chỉ một ngọn đồi có cây hay bụi hơn là một thành; những “hầm đá”, hay đá đẽo, mà ông đi qua là “ở gần Ghinh-ganh” gần Giê-ri-cô."
    - "Không biết gì thêm. Vì Ê-hút thổi kèn trong các đồi Ép-ra-im, đa số đặt Sê-i-rát đâu đó trên sườn tây phía trên Giê-ri-cô, trên đường lên vùng đồi; những người khác để nó trong Đồng bằng Giô-đanh, và bản đồ cho thấy cả hai, với ứng viên thứ ba ở Mô-áp bên kia sông, hướng mà một người chạy trốn khỏi vua Mô-áp khó mà đi. Không địa điểm nào mang dạng của tên, và chưa có gì được khai quật là Sê-i-rát."
  ro:
    - "Seira (Seirath în versiunea King James) este locul unde a scăpat Ehud după ce l-a ucis pe Eglon, regele Moabului, în camera lui de sus: în timp ce slujitorii regelui așteptau la ușile încuiate, Ehud, „trecând pe lângă idoli, a scăpat în Sirota”, și de acolo „a trâmbițat cu bucium în muntele lui Efraim” și a coborât în fruntea israeliților împotriva moabiților la vadurile Iordanului. Numele apare doar aici. Cuvântul ebraic sugerează ceva păros sau zbârlit, așa că poate însemna un deal acoperit de păduri sau tufișuri mai degrabă decât o cetate; carierele, adică pietrele cioplite, pe care le-a trecut erau lângă Ghilgal, aproape de Ierihon."
    - "Nu se mai știe nimic. Fiindcă Ehud a sunat din trâmbiță în dealurile lui Efraim, cei mai mulți așază Seira undeva pe povârnișurile vestice de deasupra Ierihonului, pe drumul care urcă în ținutul muntos; alții o lasă în Valea Iordanului, iar harta le arată pe amândouă, cu un al treilea candidat în Moab, peste râu, direcția pe care un fugar de la regele Moabului abia ar fi luat-o. Niciun loc nu poartă o formă a numelui și nimic nu a fost săpat ca Seira."
  bg:
    - "Сеира (в Библията на крал Джеймс Seirath) е мястото, където избягал Ехуд, след като убил моавския цар Еглон в горната му стая: докато слугите на царя чакали пред заключените врати, Ехуд „премина сечените камене та се отърва в Сепрота“ и оттам „затръби с тръбата в гората Ефрем“ и повел израилтяните надолу срещу моавците при бродовете на Йордан. Името се среща само тук. Еврейската дума подсказва нещо космато или рошаво, така че може да означава залесен или обрасъл с храсти хълм, а не град; „сечените камене“, или изваяните камъни, покрай които минал, били „при Галгал“ близо до Йерихон."
    - "Нищо повече не се знае. Тъй като Ехуд затръбил в хълмовете на Ефрем, повечето поставят Сеира някъде по западните склонове над Йерихон, по пътя нагоре към планинската страна; други я оставят в Йорданската долина, а картата показва и двете, с трети кандидат в Моав отвъд реката — посока, която беглец от моавския цар едва ли би поел. Никое място не носи форма на името и нищо не е разкопано като Сеира."
