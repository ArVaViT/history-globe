body:
  en:
    - "Damascus lies on a plateau east of the Anti-Lebanon mountains, where the Barada river spreads out into the Ghouta, a broad oasis at the edge of the Syrian desert. Farmers lived nearby at Tell Ramad by the seventh millennium BC. The city's name appears in the lists of Thutmose III in the fifteenth century BC, and in the Amarna letters of the fourteenth century its land was held for Pharaoh by Biryawaza. Genesis already knows it: Abram pursues the kings as far as Hobah near Damascus, and his steward Eliezer is of Damascus."
    - "From about the tenth century BC Damascus was the capital of the Aramean kingdom of Aram. The Bible tells of David's garrisons there, of Rezon who seized it in Solomon's day, of the kings Ben-hadad and Hazael who fought Israel, and of Naaman the commander, healed by Elisha, who praised Abana and Pharpar, the rivers of Damascus. Assyrian inscriptions name Hadadezer of Damascus among the kings who fought Shalmaneser III at Qarqar in 853 BC, and in 841 BC Shalmaneser besieged Hazael in the city without taking it."
    - "Rezin of Damascus joined Israel against Judah; Ahaz called in Tiglath-pileser III, who took Damascus in 732 BC, killed Rezin and deported its people, as 2 Kings tells and the Assyrian Eponym Chronicle confirms with its campaigns against Damascus. Isaiah and Amos had foretold its fall. The city lived on as a provincial centre under the Assyrians, Babylonians and Persians, and after Alexander it was contested by the Ptolemies and the Seleucids. The Nabataean king Aretas III held it about 85 BC, and in 64 BC Pompey brought it under Rome."
    - "On the road to Damascus Saul of Tarsus was converted; in the city, at the street called Straight, Ananias laid his hands on him and he was baptised, and he later escaped over the wall in a basket while the governor under King Aretas guarded the city. Roman Damascus was laid out on a grid around a vast temple of Jupiter, which at the end of the fourth century, under Theodosius I, became a church, later known as the church of John the Baptist. Damascus remained a leading city of Byzantine Syria until the Arab conquest of 634."
  ru:
    - "Дамаск лежит на плато к востоку от хребта Антиливан, там, где река Барада растекается по Гуте — широкому оазису на краю Сирийской пустыни. Земледельцы жили поблизости, в Телль-Рамаде, уже в VII тысячелетии до н. э. Имя города встречается в списках Тутмоса III в XV веке до н. э., а в Амарнских письмах XIV века его землёй правил от имени фараона Бирьяваза. Знает его и книга Бытия: Аврам преследует царей до Ховы, что по левую сторону Дамаска, а его домоправитель Елиезер — из Дамаска."
    - "Примерно с X века до н. э. Дамаск был столицей арамейского царства Арам. Библия рассказывает о гарнизонах Давида в нём, о Разоне, захватившем город во дни Соломона, о царях Венададе и Азаиле, воевавших с Израилем, и о военачальнике Неемане, исцелённом Елисеем, который хвалил Авану и Фарфар, реки Дамасские. Ассирийские надписи называют Хададезера Дамасского среди царей, сражавшихся с Салманасаром III при Каркаре в 853 г. до н. э., а в 841 г. до н. э. Салманасар осаждал Азаила в городе, но не взял его."
    - "Рецин, царь Дамасский, выступил вместе с Израилем против Иудеи; Ахаз призвал Феглафелласара (Тиглатпаласара III), который в 732 г. до н. э. взял Дамаск, убил Рецина и выселил жителей, как рассказывает 4-я книга Царств и подтверждает ассирийская Хроника эпонимов, отмечающая походы на Дамаск. Исаия и Амос предсказывали его падение. Город продолжал жить как центр провинции при ассирийцах, вавилонянах и персах, а после Александра за него спорили Птолемеи и Селевкиды. Набатейский царь Арета III владел им около 85 г. до н. э., а в 64 г. до н. э. Помпей подчинил его Риму."
    - "На пути в Дамаск обратился Савл из Тарса; в городе, на улице, называемой Прямою, Анания возложил на него руки, и он крестился, а позже спасся, спущенный в корзине по стене, когда областной правитель царя Ареты стерёг город. Римский Дамаск был распланирован сеткой улиц вокруг огромного храма Юпитера, который в конце IV века, при Феодосии I, стал церковью, позже известной как церковь Иоанна Крестителя. Дамаск оставался одним из главных городов византийской Сирии до арабского завоевания 634 г."
  uk:
    - "Дамаск лежить на плато на схід від гір Антиліван, де річка Барада розливається в Гуту, широкий оазис на краю Сирійської пустелі. Землероби жили неподалік у Телль-Рамаді вже у VII тис. до н. е. Назва міста з'являється в списках Тутмоса III у XV ст. до н. е., а в амарнських листах XIV ст. його землю тримав для фараона Бірьяваза. Книга Буття вже знає його: Аврам переслідує царів аж до Хови поблизу Дамаска, а його управитель Еліезер — з Дамаска."
    - "Приблизно від X ст. до н. е. Дамаск був столицею арамейського царства Арам. Біблія розповідає про Давидові залоги там, про Разона, який захопив його за днів Соломона, про царів Бен-Гадада й Азаїла, що воювали з Ізраїлем, і про воєначальника Наамана, зціленого Єлисеєм, який хвалив Авану й Фарфар, ріки Дамаска. Ассирійські написи називають Адраазара Дамаського серед царів, що билися з Салманассаром III при Каркарі в 853 р. до н. е., а в 841 р. до н. е. Салманассар облягав Азаїла в місті, не взявши його."
    - "Рецін Дамаський приєднався до Ізраїлю проти Юди; Ахаз покликав Тіглатпаласара III, який узяв Дамаск у 732 р. до н. е., убив Реціна й вивів його людей, як розповідає 2 Книга Царів і підтверджує ассирійська Хроніка епонімів зі своїми походами проти Дамаска. Ісая й Амос провіщали його падіння. Місто жило далі як провінційний осередок під ассирійцями, вавилонянами й персами, а після Александра за нього змагалися Птолемеї й Селевкіди. Набатейський цар Арета III тримав його близько 85 р. до н. е., а в 64 р. до н. е. Помпей підпорядкував його Римові."
    - "На дорозі до Дамаска навернувся Савл із Тарса; у місті, на вулиці, що зветься Пряма, Ананія поклав на нього руки, і він охрестився, а згодом утік через мур у кошику, поки намісник царя Арети стеріг місто. Римський Дамаск було розплановано за сіткою навколо величезного храму Юпітера, який наприкінці IV ст., за Феодосія I, став церквою, пізніше відомою як церква Івана Хрестителя. Дамаск лишався провідним містом візантійської Сирії аж до арабського завоювання 634 р."
  es:
    - "Damasco se encuentra en una meseta al este de las montañas del Antilíbano, donde el río Barada se extiende en la Guta, un amplio oasis en el borde del desierto sirio. Agricultores vivían cerca, en Tell Ramad, ya en el séptimo milenio a. C. El nombre de la ciudad aparece en las listas de Tutmosis III en el siglo XV a. C., y en las cartas de Amarna del siglo XIV su territorio era mantenido para el faraón por Biryawaza. El Génesis ya la conoce: Abram persigue a los reyes hasta Hoba, cerca de Damasco, y su mayordomo Eliezer es de Damasco."
    - "Desde el siglo X a. C. aproximadamente Damasco fue la capital del reino arameo de Aram. La Biblia habla de las guarniciones de David allí, de Rezón, que se apoderó de ella en tiempos de Salomón, de los reyes Ben-adad y Hazael, que combatieron a Israel, y de Naamán, el general, sanado por Eliseo, que elogió el Abana y el Farfar, los ríos de Damasco. Las inscripciones asirias nombran a Hadad-ezer de Damasco entre los reyes que combatieron a Salmanasar III en Qarqar en el 853 a. C., y en el 841 a. C. Salmanasar sitió a Hazael en la ciudad sin tomarla."
    - "Rezín de Damasco se unió a Israel contra Judá; Acaz llamó a Tiglat-pileser III, que tomó Damasco en el 732 a. C., mató a Rezín y deportó a su gente, como cuenta 2 Reyes y confirma la Crónica de los Epónimos asiria con sus campañas contra Damasco. Isaías y Amós habían anunciado su caída. La ciudad siguió viviendo como centro provincial bajo asirios, babilonios y persas, y tras Alejandro fue disputada por los Ptolomeos y los seléucidas. El rey nabateo Aretas III la tuvo hacia el 85 a. C., y en el 64 a. C. Pompeyo la sometió a Roma."
    - "En el camino de Damasco se convirtió Saulo de Tarso; en la ciudad, en la calle llamada Derecha, Ananías le impuso las manos y fue bautizado, y más tarde escapó por el muro en una espuerta mientras el gobernador del rey Aretas guardaba la ciudad. La Damasco romana fue trazada en cuadrícula en torno a un vasto templo de Júpiter, que a finales del siglo IV, bajo Teodosio I, se convirtió en iglesia, conocida más tarde como la iglesia de San Juan Bautista. Damasco siguió siendo una ciudad principal de la Siria bizantina hasta la conquista árabe del 634."
  pt:
    - "Damasco fica num planalto a leste das montanhas do Antilíbano, onde o rio Barada se espalha na Ghouta, um vasto oásis na orla do deserto sírio. Agricultores viviam perto, em Tell Ramad, já no sétimo milênio a.C. O nome da cidade aparece nas listas de Tutmés III, no século XV a.C., e nas cartas de Amarna do século XIV sua terra era mantida para o faraó por Biryawaza. O Gênesis já a conhece: Abrão persegue os reis até Hobá, perto de Damasco, e seu mordomo Eliézer é de Damasco."
    - "A partir de cerca do século X a.C., Damasco foi a capital do reino arameu de Arã. A Bíblia fala das guarnições de Davi ali, de Rezom, que a tomou nos dias de Salomão, dos reis Ben-Hadade e Hazael, que combateram Israel, e de Naamã, o comandante curado por Eliseu, que louvou Abana e Farfar, os rios de Damasco. Inscrições assírias nomeiam Hadadezer de Damasco entre os reis que combateram Salmaneser III em Qarqar, em 853 a.C., e em 841 a.C. Salmaneser sitiou Hazael na cidade sem tomá-la."
    - "Rezim de Damasco uniu-se a Israel contra Judá; Acaz chamou Tiglate-Pileser III, que tomou Damasco em 732 a.C., matou Rezim e deportou seu povo, como conta 2 Reis e confirma a Crônica dos Epônimos assíria com suas campanhas contra Damasco. Isaías e Amós haviam predito a sua queda. A cidade continuou como centro provincial sob assírios, babilônios e persas, e depois de Alexandre foi disputada entre Ptolomeus e Selêucidas. O rei nabateu Aretas III a manteve por volta de 85 a.C., e em 64 a.C. Pompeu a submeteu a Roma."
    - "No caminho de Damasco, Saulo de Tarso foi convertido; na cidade, na rua chamada Direita, Ananias impôs as mãos sobre ele e ele foi batizado, e mais tarde escapou pelo muro num cesto enquanto o governador sob o rei Aretas guardava a cidade. A Damasco romana foi traçada em grade em torno de um vasto templo de Júpiter, que no fim do século IV, sob Teodósio I, tornou-se igreja, depois conhecida como igreja de João Batista. Damasco continuou sendo uma das principais cidades da Síria bizantina até a conquista árabe de 634."
  de:
    - "Damaskus liegt auf einem Plateau östlich des Antilibanon, wo sich der Fluss Barada zur Ghuta ausbreitet, einer weiten Oase am Rand der syrischen Wüste. Bauern lebten bereits im 7. Jahrtausend v. Chr. in der Nähe in Tell Ramad. Der Name der Stadt erscheint in den Listen Thutmosis’ III. im 15. Jahrhundert v. Chr., und in den Amarnabriefen des 14. Jahrhunderts wurde ihr Land von Birjawaza für den Pharao gehalten. Die Genesis kennt sie bereits: Abram verfolgt die Könige bis Hoba bei Damaskus, und sein Verwalter Elieser stammt aus Damaskus."
    - "Ab etwa dem 10. Jahrhundert v. Chr. war Damaskus die Hauptstadt des aramäischen Königreichs Aram. Die Bibel erzählt von Davids Besatzungen dort, von Reson, der es zu Salomos Zeit an sich riss, von den Königen Ben-Hadad und Hasaël, die gegen Israel kämpften, und von dem Feldhauptmann Naaman, der von Elisa geheilt wurde und Abana und Parpar, die Flüsse von Damaskus, rühmte. Assyrische Inschriften nennen Hadadeser von Damaskus unter den Königen, die 853 v. Chr. bei Karkar gegen Salmanassar III. kämpften, und 841 v. Chr. belagerte Salmanassar Hasaël in der Stadt, ohne sie einzunehmen."
    - "Rezin von Damaskus verband sich mit Israel gegen Juda; Ahas rief Tiglat-Pileser III. herbei, der Damaskus 732 v. Chr. einnahm, Rezin tötete und sein Volk wegführte, wie das 2. Buch der Könige erzählt und die assyrische Eponymenchronik mit ihren Feldzügen gegen Damaskus bestätigt. Jesaja und Amos hatten seinen Fall vorhergesagt. Die Stadt lebte als Provinzzentrum unter Assyrern, Babyloniern und Persern fort, und nach Alexander wurde sie zwischen Ptolemäern und Seleukiden umkämpft. Der nabatäische König Aretas III. hielt sie um 85 v. Chr., und 64 v. Chr. brachte Pompeius sie unter Rom."
    - "Auf dem Weg nach Damaskus wurde Saulus von Tarsus bekehrt; in der Stadt, in der Straße namens Gerade, legte ihm Hananias die Hände auf und er wurde getauft, und später entkam er in einem Korb über die Mauer, während der Statthalter unter König Aretas die Stadt bewachte. Das römische Damaskus wurde nach einem Raster um einen gewaltigen Jupitertempel angelegt, der Ende des 4. Jahrhunderts unter Theodosius I. zur Kirche wurde, später als Johanneskirche bekannt. Damaskus blieb bis zur arabischen Eroberung 634 eine führende Stadt des byzantinischen Syrien."
  fr:
    - "Damas s’étend sur un plateau à l’est de l’Anti-Liban, là où la rivière Barada se déploie dans la Ghouta, vaste oasis aux confins du désert de Syrie. Des agriculteurs vivaient tout près, à Tell Ramad, dès le VIIe millénaire av. J.-C. Le nom de la ville figure dans les listes de Thoutmosis III au XVe siècle av. J.-C., et dans les lettres d’Amarna du XIVe siècle son pays était tenu pour Pharaon par Biryawaza. La Genèse la connaît déjà : Abram poursuit les rois jusqu’à Choba, près de Damas, et son intendant Éliézer est de Damas."
    - "À partir du Xe siècle av. J.-C. environ, Damas fut la capitale du royaume araméen d’Aram. La Bible parle des garnisons de David, de Rezon qui s’en empara du temps de Salomon, des rois Ben-Hadad et Hazaël qui combattirent Israël, et de Naaman le chef de l’armée, guéri par Élisée, qui vanta l’Abana et le Parpar, fleuves de Damas. Des inscriptions assyriennes nomment Hadadézer de Damas parmi les rois qui combattirent Salmanasar III à Qarqar en 853 av. J.-C., et en 841 av. J.-C. Salmanasar assiégea Hazaël dans la ville sans la prendre."
    - "Retsin de Damas s’allia à Israël contre Juda ; Achaz appela Tiglath-Piléser III, qui prit Damas en 732 av. J.-C., tua Retsin et déporta son peuple, comme le raconte 2 Rois et comme le confirme la Chronique des éponymes assyrienne avec ses campagnes contre Damas. Ésaïe et Amos avaient annoncé sa chute. La ville survécut comme centre provincial sous les Assyriens, les Babyloniens et les Perses, et après Alexandre elle fut disputée entre les Ptolémées et les Séleucides. Le roi nabatéen Arétas III la tint vers 85 av. J.-C., et en 64 av. J.-C. Pompée la soumit à Rome."
    - "Sur le chemin de Damas, Saul de Tarse fut converti ; dans la ville, à la rue appelée la Droite, Ananias lui imposa les mains et il fut baptisé, et il s’échappa plus tard par-dessus le mur dans une corbeille tandis que le gouverneur du roi Arétas gardait la ville. La Damas romaine fut tracée en damier autour d’un vaste temple de Jupiter, qui à la fin du IVe siècle, sous Théodose Ier, devint une église, plus tard connue comme l’église de Jean-Baptiste. Damas resta une grande ville de la Syrie byzantine jusqu’à la conquête arabe de 634."
  it:
    - "Damasco sorge su un altopiano a est dei monti dell’Anti-Libano, dove il fiume Barada si apre nella Ghouta, un’ampia oasi al margine del deserto siriano. Agricoltori vivevano nei pressi, a Tell Ramad, fin dal VII millennio a.C. Il nome della città compare negli elenchi di Tutmosi III nel XV secolo a.C., e nelle lettere di Amarna del XIV secolo il suo territorio era tenuto per il faraone da Biryawaza. La Genesi già la conosce: Abramo insegue i re fino a Coba, vicino a Damasco, e il suo servo Eliezer è di Damasco."
    - "Dal X secolo a.C. circa Damasco fu la capitale del regno aramaico di Aram. La Bibbia narra delle guarnigioni di Davide, di Rezon che se ne impadronì ai giorni di Salomone, dei re Ben-Adad e Cazaèl che combatterono contro Israele, e del comandante Naaman, guarito da Eliseo, che lodò l’Abana e il Parpar, i fiumi di Damasco. Iscrizioni assire nominano Adadezer di Damasco fra i re che combatterono Salmanàssar III a Qarqar nell’853 a.C., e nell’841 a.C. Salmanàssar assediò Cazaèl nella città senza prenderla."
    - "Resin di Damasco si unì a Israele contro Giuda; Acaz chiamò Tiglat-Pilèser III, che prese Damasco nel 732 a.C., uccise Resin e ne deportò gli abitanti, come narra 2 Re e conferma la Cronaca assira degli Eponimi con le sue campagne contro Damasco. Isaia e Amos ne avevano predetto la caduta. La città sopravvisse come centro provinciale sotto Assiri, Babilonesi e Persiani, e dopo Alessandro fu contesa fra Tolomei e Seleucidi. Il re nabateo Areta III la tenne intorno all’85 a.C., e nel 64 a.C. Pompeo la sottomise a Roma."
    - "Sulla via di Damasco Saulo di Tarso si convertì; in città, nella via detta Diritta, Anania gli impose le mani ed egli fu battezzato, e più tardi fuggì oltre le mura in una cesta mentre il governatore del re Areta sorvegliava la città. La Damasco romana fu disegnata a griglia attorno a un vasto tempio di Giove, che alla fine del IV secolo, sotto Teodosio I, divenne una chiesa, poi nota come chiesa di Giovanni Battista. Damasco restò una delle principali città della Siria bizantina fino alla conquista araba del 634."
  pl:
    - "Damaszek leży na płaskowyżu na wschód od gór Antylibanu, gdzie rzeka Barada rozlewa się w Ghutę, rozległą oazę na skraju pustyni syryjskiej. Rolnicy mieszkali w pobliżu w Tell Ramad już w VII tysiącleciu p.n.e. Nazwa miasta pojawia się na listach Totmesa III w XV w. p.n.e., a w listach z Amarna z XIV w. jego ziemię dla faraona trzymał Biriawaza. Księga Rodzaju już je zna: Abram ściga królów aż do Choba koło Damaszku, a jego zarządca Eliezer pochodzi z Damaszku."
    - "Od około X w. p.n.e. Damaszek był stolicą aramejskiego królestwa Aram. Biblia opowiada o garnizonach Dawida w nim, o Rezonie, który zawładnął nim za czasów Salomona, o królach, Ben-Hadadzie i Chazaelu, którzy walczyli z Izraelem, i o wodzu Naamanie, uzdrowionym przez Elizeusza, który wychwalał Abanę i Farpar, rzeki Damaszku. Inskrypcje asyryjskie wymieniają Hadadezera z Damaszku wśród królów, którzy walczyli z Salmanasarem III pod Karkar w 853 r. p.n.e., a w 841 r. p.n.e. Salmanasar oblegał Chazaela w mieście, lecz go nie zdobył."
    - "Resin z Damaszku sprzymierzył się z Izraelem przeciw Judzie; Achaz wezwał Tiglat-Pilesera III, który zdobył Damaszek w 732 r. p.n.e., zabił Resina i wywiózł jego mieszkańców, jak opowiada Druga Księga Królewska i potwierdza asyryjska Kronika eponimów swymi wyprawami przeciw Damaszkowi. Izajasz i Amos zapowiedzieli jego upadek. Miasto przetrwało jako ośrodek prowincjonalny pod Asyryjczykami, Babilończykami i Persami, a po Aleksandrze spierali się o nie Ptolemeusze i Seleucydzi. Król nabatejski Aretas III trzymał je około 85 r. p.n.e., a w 64 r. p.n.e. Pompejusz podporządkował je Rzymowi."
    - "Na drodze do Damaszku nawrócił się Saul z Tarsu; w mieście, przy ulicy zwanej Prostą, Ananiasz włożył na niego ręce i on został ochrzczony, a później uciekł przez mur w koszu, gdy namiestnik króla Aretasa strzegł miasta. Rzymski Damaszek wytyczono na siatce wokół ogromnej świątyni Jowisza, która pod koniec IV w., za Teodozjusza I, stała się kościołem, znanym później jako kościół św. Jana Chrzciciela. Damaszek pozostał czołowym miastem bizantyjskiej Syrii aż do arabskiego podboju w 634 r."
  nl:
    - "Damascus ligt op een plateau ten oosten van het Antilibanongebergte, waar de rivier de Barada zich uitspreidt tot de Ghouta, een brede oase aan de rand van de Syrische woestijn. Boeren woonden vlakbij te Tell Ramad al in het zevende millennium v.Chr. De naam van de stad staat in de lijsten van Thoetmosis III uit de vijftiende eeuw v.Chr., en in de Amarnabrieven van de veertiende eeuw hield Biryawaza haar land voor de farao. Genesis kent haar al: Abram achtervolgt de koningen tot Choba bij Damascus, en zijn rentmeester Eliëzer is uit Damascus."
    - "Vanaf omstreeks de tiende eeuw v.Chr. was Damascus de hoofdstad van het Aramese koninkrijk Aram. De Bijbel vertelt van Davids garnizoenen daar, van Rezon die de stad in Salomo's dagen greep, van de koningen Ben-Hadad en Hazaël die tegen Israël streden, en van legeroverste Naäman, door Elisa genezen, die de Abana en de Parpar prees, de rivieren van Damascus. Assyrische inscripties noemen Hadadezer van Damascus onder de koningen die in 853 v.Chr. bij Qarqar tegen Salmaneser III vochten, en in 841 v.Chr. belegerde Salmaneser Hazaël in de stad zonder haar te nemen."
    - "Rezin van Damascus verbond zich met Israël tegen Juda; Achaz riep Tiglat-Pileser III in, die Damascus in 732 v.Chr. innam, Rezin doodde en de bevolking wegvoerde, zoals 2 Koningen vertelt en de Assyrische eponiemenkroniek met haar veldtochten tegen Damascus bevestigt. Jesaja en Amos hadden haar val voorzegd. De stad bleef een provinciaal centrum onder Assyriërs, Babyloniërs en Perzen, en na Alexander werd om haar gestreden door Ptolemaeën en Seleuciden. De Nabateese koning Aretas III hield haar omstreeks 85 v.Chr., en in 64 v.Chr. bracht Pompeius haar onder Rome."
    - "Op de weg naar Damascus werd Saulus van Tarsus bekeerd; in de stad, in de straat die Recht heet, legde Ananias hem de handen op en werd hij gedoopt, en later ontsnapte hij in een mand over de muur terwijl de stadhouder van koning Aretas de stad bewaakte. Het Romeinse Damascus was in een raster aangelegd rond een enorme Jupitertempel, die aan het eind van de vierde eeuw onder Theodosius I een kerk werd, later bekend als de kerk van Johannes de Doper. Damascus bleef een voorname stad van Byzantijns Syrië tot de Arabische verovering van 634."
  cs:
    - "Damašek leží na plošině východně od pohoří Antilibanon, kde se řeka Barada rozlévá do Ghúty, širokého oázového pásu na okraji syrské pouště. Zemědělci žili poblíž v Tell Ramad již v 7. tisíciletí př. n. l. Jméno města se objevuje v seznamech Thutmosise III. v 15. století př. n. l. a v amarnských dopisech ze 14. století držel jeho zemi pro faraona Biryawaza. Genesis ho už zná: Abram pronásleduje krále až k Chobě u Damašku a jeho správce Eliezer je z Damašku."
    - "Od asi 10. století př. n. l. byl Damašek hlavním městem aramejského království Aram. Bible vypráví o Davidových posádkách tam, o Rezonovi, který se ho zmocnil za Šalomounových dnů, o králích Ben-hadadovi a Chazaelovi, kteří bojovali s Izraelem, a o veliteli Námánovi, uzdraveném Elíšou, který velebil Abanu a Farpar, řeky Damašku. Asyrské nápisy jmenují Hadadezera z Damašku mezi králi, kteří bojovali se Salmanasarem III. u Qarqaru roku 853 př. n. l., a roku 841 př. n. l. Salmanasar obléhal Chazaela ve městě, aniž je dobyl."
    - "Resín Damašský se spojil s Izraelem proti Judsku; Achaz přivolal Tiglatpilesara III., který roku 732 př. n. l. Damašek dobyl, zabil Resína a odvlekl jeho lid, jak vypráví Druhá kniha Královská a jak potvrzuje asyrská Eponymní kronika svými taženími proti Damašku. Izajáš a Amos ohlásili jeho pád. Město žilo dál jako provinciální středisko za Asyřanů, Babylóňanů a Peršanů a po Alexandrovi oň soupeřili Ptolemaiovci a Seleukovci. Nabatejský král Aretas III. jej držel kolem roku 85 př. n. l. a roku 64 př. n. l. je Pompeius podřídil Římu."
    - "Na cestě do Damašku byl obrácen Saul z Tarsu; ve městě, v ulici zvané Přímá, na něj Ananiáš vložil ruce a on byl pokřtěn a později uprchl přes hradbu v koši, zatímco správce za krále Aretase hlídal město. Římský Damašek byl rozvržen do mřížky kolem obrovského Jupiterova chrámu, který se koncem 4. století za Theodosia I. stal kostelem, později známým jako kostel Jana Křtitele. Damašek zůstal vedoucím městem byzantské Sýrie až do arabského dobytí roku 634."
  sv:
    - "Damaskus ligger på en platå öster om Antilibanonbergen, där floden Barada breder ut sig i Ghouta, en vid oas vid den syriska öknens kant. Bönder bodde i närheten vid Tell Ramad redan under sjunde årtusendet f.Kr. Stadens namn förekommer i Thutmosis III:s förteckningar på 1400-talet f.Kr., och i Amarnabreven från 1300-talet hölls dess land åt farao av Biryawaza. Första Mosebok känner redan till den: Abram förföljer kungarna ända till Hova nära Damaskus, och hans förvaltare Elieser är från Damaskus."
    - "Från omkring 900-talet f.Kr. var Damaskus huvudstad i det arameiska kungariket Aram. Bibeln berättar om Davids garnisoner där, om Reson som tog den på Salomos tid, om kungarna Ben-Hadad och Hasael som stred mot Israel, och om fältöversten Naaman, botad av Elisha, som prisade Avana och Parpar, Damaskus floder. Assyriska inskriptioner nämner Hadadeser av Damaskus bland kungarna som bekämpade Salmanassar III vid Qarqar 853 f.Kr., och 841 f.Kr. belägrade Salmanassar Hasael i staden utan att inta den."
    - "Resin av Damaskus slöt sig till Israel mot Juda; Achas kallade in Tiglat-Pileser III, som intog Damaskus 732 f.Kr., dödade Resin och förde bort dess folk, såsom Andra Konungaboken berättar och den assyriska eponymkrönikan bekräftar med sina fälttåg mot Damaskus. Jesaja och Amos hade förutsagt dess fall. Staden levde vidare som provinscentrum under assyrierna, babylonierna och perserna, och efter Alexander stred ptolemaierna och seleukiderna om den. Den nabatéiske kungen Aretas III höll den omkring 85 f.Kr., och 64 f.Kr. lade Pompejus den under Rom."
    - "På vägen till Damaskus omvändes Saul från Tarsos; i staden, vid gatan som kallas Raka, lade Ananias händerna på honom och han döptes, och han flydde senare över muren i en korg medan ståthållaren under kung Aretas bevakade staden. Det romerska Damaskus anlades i rutnät kring ett väldigt Jupitertempel, som i slutet av 300-talet, under Theodosius I, blev en kyrka, senare känd som Johannes döparens kyrka. Damaskus förblev en ledande stad i bysantinska Syrien fram till den arabiska erövringen 634."
  nb:
    - "Damaskus ligger på et platå øst for Anti-Libanon-fjellene, der elven Barada brer seg ut i Ghouta, en vid oase i kanten av den syriske ørkenen. Bønder bodde i nærheten ved Tell Ramad allerede i det sjuende årtusen f.Kr. Byens navn dukker opp i listene til Tutmosis III på 1400-tallet f.Kr., og i Amarna-brevene fra 1300-tallet ble dens land holdt for farao av Biryawaza. 1. Mosebok kjenner den allerede: Abram forfølger kongene helt til Hoba nær Damaskus, og hans forvalter Elieser er fra Damaskus."
    - "Fra omkring 900-tallet f.Kr. var Damaskus hovedstad i det arameiske riket Aram. Bibelen forteller om Davids garnisoner der, om Reson som tok den på Salomos tid, om kongene Ben-Hadad og Hasael som kjempet mot Israel, og om hærføreren Na'aman, helbredet av Elisja, som priste Abana og Parpar, elvene i Damaskus. Assyriske innskrifter nevner Hadadeser av Damaskus blant kongene som kjempet mot Salmanassar III ved Qarqar i 853 f.Kr., og i 841 f.Kr. beleiret Salmanassar Hasael i byen uten å ta den."
    - "Resin av Damaskus sluttet seg til Israel mot Juda; Ahas kalte inn Tiglat-Pileser III, som tok Damaskus i 732 f.Kr., drepte Resin og deporterte folket, slik 2. Kongebok forteller og Den assyriske eponymkrønike bekrefter med sine felttog mot Damaskus. Jesaja og Amos hadde forutsagt dens fall. Byen levde videre som provinssentrum under assyrerne, babylonerne og perserne, og etter Aleksander ble den omstridt mellom ptolemeerne og seleukidene. Den nabateiske kongen Aretas III holdt den omkring 85 f.Kr., og i 64 f.Kr. la Pompeius den under Roma."
    - "På veien til Damaskus ble Saulus fra Tarsos omvendt; i byen, ved gaten som kalles den rette, la Ananias hendene på ham, og han ble døpt, og han slapp senere unna over muren i en kurv mens landshøvdingen under kong Aretas voktet byen. Det romerske Damaskus ble lagt ut i rutenett omkring et enormt tempel for Jupiter, som mot slutten av 300-tallet, under Theodosius I, ble en kirke, senere kjent som Døperen Johannes' kirke. Damaskus forble en ledende by i det bysantinske Syria til den arabiske erobringen i 634."
  tl:
    - "Ang Damasco ay nasa isang talampas sa silangan ng mga bundok ng Anti-Libano, kung saan kumakalat ang ilog Barada sa Ghouta, isang malawak na oasis sa gilid ng disyerto ng Siria. Nakatira na ang mga magsasaka sa malapit sa Tell Ramad noong ika-7 milenyo BK. Lumilitaw ang pangalan ng lungsod sa mga talaan ni Thutmose III noong ika-15 siglo BK, at sa mga liham sa Amarna noong ika-14 na siglo ay hawak ni Biryawaza ang lupain nito para sa Faraon. Kilala na ito ng Genesis: hinabol ni Abram ang mga hari hanggang Hobah malapit sa Damasco, at ang katiwala niyang si Eliezer ay taga-Damasco."
    - "Mula noong mga ika-10 siglo BK, ang Damasco ang kabisera ng kahariang Arameo ng Aram. Isinasalaysay ng Bibliya ang mga bantay ni David doon, si Rezon na umagaw nito noong panahon ni Salomon, ang mga haring sina Ben-adad at Hazael na nakipaglaban sa Israel, at si Naaman na kumander, na pinagaling ni Eliseo, na pumuri sa Abana at Pharphar, mga ilog ng Damasco. Pinangalanan ng mga inskripsiyong Asiryo si Hadadezer ng Damasco sa mga haring nakipaglaban kay Salmanasar III sa Qarqar noong 853 BK, at noong 841 BK kinubkob ni Salmanasar si Hazael sa lungsod nang hindi ito nakukuha."
    - "Sumama si Rezin ng Damasco sa Israel laban sa Juda; tinawag ni Achaz si Tiglath-pileser III, na kumuha sa Damasco noong 732 BK, pumatay kay Rezin at nagpatapon sa mga tao nito, gaya ng isinasalaysay ng 2 Mga Hari at pinagtitibay ng Kronika ng mga Eponimo ng Asiria sa mga kampanya nito laban sa Damasco. Inihula nina Isaias at Amos ang pagbagsak nito. Nagpatuloy ang lungsod bilang sentrong panlalawigan sa ilalim ng mga Asiryo, Babilonio at Persiano, at pagkatapos ni Alejandro ay pinagtalunan ng mga Ptolemeo at Seleucida. Hinawakan ito ng haring Nabateo na si Aretas III noong mga 85 BK, at noong 64 BK dinala ito ni Pompeyo sa ilalim ng Roma."
    - "Sa daan patungong Damasco nagbalik-loob si Saul ng Tarso; sa lungsod, sa lansangang tinatawag na Matuwid, ipinatong ni Ananias ang kaniyang mga kamay sa kaniya at siya'y binautismuhan, at nang maglaon ay tumakas siya sa pader sa isang basket habang binabantayan ng gobernador sa ilalim ni Haring Aretas ang lungsod. Ang Damasco ng panahong Romano ay inilatag sa isang parilya sa palibot ng malaking templo ni Jupiter, na sa wakas ng ika-4 na siglo, sa ilalim ni Teodosio I, ay naging simbahan, na nang maglaon ay kilala bilang simbahan ni Juan Bautista. Nanatiling nangungunang lungsod ng Bizantinong Siria ang Damasco hanggang sa pananakop ng mga Arabe noong 634."
  da:
    - "Damaskus ligger på en højslette øst for Anti-Libanon-bjergene, hvor floden Barada breder sig ud i Ghouta, en bred oase i udkanten af den syriske ørken. Bønder boede i nærheden ved Tell Ramad allerede i 7. årtusinde f.Kr. Byens navn optræder i Thutmosis 3.s lister i 1400-tallet f.Kr., og i Amarna-brevene fra 1300-tallet blev dens land holdt for faraoen af Biryawaza. 1 Mosebog kender den allerede: Abram forfølger kongerne helt til Hoba nær Damaskus, og hans forvalter Eliezer er fra Damaskus."
    - "Fra omkring 900-tallet f.Kr. var Damaskus hovedstad i det aramæiske kongerige Aram. Bibelen fortæller om Davids garnisoner dér, om Rezon, der greb den i Salomos dage, om kongerne Ben-Hadad og Hazael, som kæmpede mod Israel, og om hærføreren Na'aman, helbredt af Elisa, som priste Abana og Parpar, Damaskus' floder. Assyriske indskrifter nævner Hadadezer af Damaskus blandt de konger, der kæmpede mod Salmanassar 3. ved Qarqar i 853 f.Kr., og i 841 f.Kr. belejrede Salmanassar Hazael i byen uden at indtage den."
    - "Retsin af Damaskus sluttede sig til Israel mod Juda; Akaz tilkaldte Tiglat-Pileser 3., som indtog Damaskus i 732 f.Kr., dræbte Retsin og deporterede dets folk, som 2 Kongebog fortæller og den assyriske Eponymkrønike bekræfter med sine felttog mod Damaskus. Esajas og Amos havde forudsagt dens fald. Byen levede videre som provinscentrum under assyrerne, babylonierne og perserne, og efter Alexander blev den omstridt mellem ptolemæerne og seleukiderne. Den nabatæiske konge Aretas 3. holdt den omkring 85 f.Kr., og i 64 f.Kr. bragte Pompejus den under Rom."
    - "På vejen til Damaskus blev Saul fra Tarsus omvendt; i byen, i gaden kaldet Den Lige, lagde Ananias hænderne på ham, og han blev døbt, og senere slap han over muren i en kurv, mens guvernøren under kong Aretas bevogtede byen. Det romerske Damaskus var anlagt i et gittermønster omkring et vældigt tempel for Jupiter, som i slutningen af 300-tallet, under Theodosius 1., blev en kirke, senere kendt som Johannes Døberens kirke. Damaskus forblev en førende by i det byzantinske Syrien indtil den arabiske erobring i 634."
  sr:
    - "Дамаск лежи на висоравни источно од планина Антиливана, где се река Барада шири у Гуту, широку оазу на рубу сиријске пустиње. Земљорадници су у близини живели у Тел Рамаду већ у 7. миленијуму п. н. е. Име града јавља се у списковима Тутмеса III у 15. веку п. н. е., а у амарнским писмима из 14. века његову земљу је за фараона држао Бирјаваза. Постање га већ зна: Аврам гони цареве све до Хове код Дамаска, а његов управитељ Елијезер је из Дамаска."
    - "Од око 10. века п. н. е. Дамаск је био престоница арамејског краљевства Арам. Библија приповеда о Давидовим посадама тамо, о Резону који га је заузео у Соломуново доба, о царевима Вен-Ададу и Азаилу који су ратовали с Израиљем и о заповеднику Наману, кога је Јелисије исцелио и који је хвалио Авану и Фарфар, реке Дамаска. Асирски натписи именују Адад-Езера из Дамаска међу краљевима који су се борили против Салманасара III код Каркара 853. п. н. е., а 841. п. н. е. Салманасар је опседао Азаила у граду не заузевши га."
    - "Ресин из Дамаска придружио се Израиљу против Јуде; Ахаз је позвао Теглат-Феласара III, који је 732. п. н. е. заузео Дамаск, убио Ресина и депортовао његов народ, како приповеда Књига о царевима, а потврђује асирска Епонимска хроника својим походима на Дамаск. Исаија и Амос најавили су његов пад. Град је живео даље као покрајинско средиште под Асирцима, Вавилонцима и Персијанцима, а после Александра о њему су се отимали Птолемејевићи и Селевкиди. Набатејски краљ Арета III држао га је око 85. п. н. е., а 64. п. н. е. Помпеј га је подвргао Риму."
    - "На путу за Дамаск обратио се Савле из Тарса; у граду, у улици која се зове Права, Ананија је положио руке на њега и он је био крштен, а касније је утекао преко зида у корпи док је намесник под краљем Аретом чувао град. Римски Дамаск био је постављен на мрежи око огромног Јупитеровог храма, који је крајем 4. века, за Теодосија I, постао црква, касније позната као црква Јована Крститеља. Дамаск је остао водећи град византијске Сирије до арапског освајања 634."
