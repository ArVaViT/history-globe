# Overview article (ADR 0007). Mainstream facts only; this is the Aphek of the Sharon (Antipatris); whether 1 Samuel 29 means the same Aphek is said to be debated.
id: aphek
place: a7b2e63
title:
  en: "Aphek"
  ru: "Афек"
  uk: "Афек"
  es: "Afec"
  pt: "Afeque"
  de: "Afek"
  fr: "Aphek"
body:
  en:
    - "Aphek was a Canaanite city at the springs of the Yarkon river, on the eastern edge of the plain of Sharon, where the road along the coast was squeezed between the river's marshes and the hills: Tell Ras el-Ain, now Tel Afek by Rosh HaAyin, some 15 km east of Tel Aviv. The name means “stronghold” or “river bed”, and several towns bore it; the Bible knows an Aphek in Asher, another on the Golan where Ben-hadad was beaten, and a third in Lebanon. This one is named in the Egyptian execration texts of the nineteenth century BC and in the list of Thutmose III. Moshe Kochavi's excavations in 1972–1985 found a Middle Bronze city, a Late Bronze palace of the Egyptian governor with cuneiform tablets of the thirteenth century, among them a letter from an official of Ugarit, and early Philistine pottery over its ruins."
    - "Joshua's list of the defeated kings has “the king of Aphek, one; the king of Lasharon, one”. The city was the Philistines' forward base against the hill country: Israel “pitched beside Eben-ezer: and the Philistines pitched in Aphek”, and in the two battles that followed Israel was routed and lost the sons of Eli and the ark of God. Before Gilboa “the Philistines gathered together all their armies to Aphek” while the Israelites camped by the spring in Jezreel; many take this to be the same Aphek, the muster point of the Philistine lords, though some look for it nearer Jezreel."
    - "About 9 BC Herod the Great built a new city on the site and called it Antipatris after his father Antipater, choosing, Josephus says, a well-watered plain with fine trees. Here the Roman cavalry rested when “the soldiers, as it was commanded them, took Paul, and brought him by night to Antipatris” on the road from Jerusalem to Caesarea; a paved Roman street and a forum have been dug. The city declined after an earthquake in AD 363. An Ottoman fort of the sixteenth century still crowns the mound, which lies in the Yarkon National Park, and the springs feed the river that flows through Tel Aviv."
  ru:
    - "Афек — ханаанский город у истоков реки Яркон, на восточном краю Саронской равнины, где прибрежная дорога зажата между речными болотами и холмами: Телль-Рас-эль-Айн, ныне Тель-Афек у Рош-ха-Аина, примерно в 15 км к востоку от Тель-Авива. Имя значит «крепость» или «русло», и так звались несколько городов; Библия знает Афек в уделе Асира, другой на Голане, где был разбит Венадад, и третий в Ливане. Этот назван в египетских заклинательных текстах XIX века до н. э. и в списке Тутмоса III. Раскопки Моше Кохави в 1972–1985 годах открыли город среднего бронзового века, дворец египетского наместника позднего бронзового века с клинописными табличками XIII века, среди них письмо чиновника из Угарита, и раннюю филистимскую керамику над его руинами."
    - "В списке побеждённых царей у Иисуса Навина стоит: «Один царь Афека, один царь Шарона». Город был передовой базой Филистимлян против нагорья: Израильтяне «расположились станом при Авен-Езере, а Филистимляне расположились при Афеке», и в двух последовавших битвах Израиль был разбит и потерял сыновей Илия и ковчег Божий. Перед Гелвуем «собрали Филистимляне все ополчения свои в Афеке», а Израильтяне стояли у источника в Изрееле; многие считают, что это тот же Афек, сборный пункт филистимских владетелей, хотя иные ищут его ближе к Изреелю."
    - "Около 9 г. до н. э. Ирод Великий построил на этом месте новый город и назвал его Антипатридой в честь своего отца Антипатра, выбрав, по словам Иосифа Флавия, хорошо орошённую равнину с прекрасными деревьями. Здесь отдыхала римская конница, когда «воины, по данному им приказанию, взяв Павла, повели ночью в Антипатриду» по дороге из Иерусалима в Кесарию; раскопаны мощёная римская улица и форум. Город пришёл в упадок после землетрясения 363 г. н. э. Османская крепость XVI века до сих пор венчает холм, лежащий в национальном парке Яркон, а источники питают реку, что течёт через Тель-Авив."
  uk:
    - "Афек був ханаанським містом біля джерел річки Яркон, на східному краї Шаронської рівнини, де прибережна дорога затискалася між болотами річки та пагорбами: Телль-Рас-ель-Айн, нині Тель-Афек біля Рош-га-Айіну, приблизно за 15 км на схід від Тель-Авіва. Назва означає «твердиня» або «річище», і кілька міст її носили; Біблія знає Афек в Асірі, інший на Голані, де розбили Бен-Гадада, і третій у Лівані. Цей згаданий у єгипетських текстах прокляття XIX століття до н. е. і в переліку Тутмоса III. Розкопки Моше Кохаві в 1972–1985 рр. виявили місто середньої бронзової доби, палац єгипетського намісника пізньої бронзової доби з клинописними табличками XIII століття, серед них лист від урядовця Угарита, та ранню філістимську кераміку над його руїнами."
    - "Перелік переможених царів у книзі Ісуса Навина має: «Царь Афекський, один; царь Саронський, один». Місто було передовою базою филистимлян проти нагір'я: Ізраїль «отаборились при Авен-Езері, тим часом як Филистії отаборились під Афеком», і в двох битвах, що настали, Ізраїль був розбитий і втратив синів Ілія та ковчег Божий. Перед Гілбоа «скупили Филистії всї потуги до купи в Афецї», а ізраїльтяни стали табором біля джерела в Їзреелі; багато хто вважає це тим самим Афеком, збірним пунктом филистимських володарів, хоч дехто шукає його ближче до Їзреелю."
    - "Близько 9 р. до н. е. Ірод Великий збудував на цьому місці нове місто й назвав його Антипатрида на честь свого батька Антипатра, обравши, як каже Йосиф Флавій, добре зрошену рівнину з гарними деревами. Тут відпочивала римська кіннота, коли «воїни ж, як звелено їм, узявши Павла, повели в ночі в Антипатриду» на дорозі з Єрусалима до Кесарії; розкопано вимощену римську вулицю та форум. Місто занепало після землетрусу 363 р. н. е. Османський форт XVI століття й досі вінчає пагорб, що лежить у національному парку Яркон, а джерела живлять річку, яка тече через Тель-Авів."
  es:
    - "Afec era una ciudad cananea en los manantiales del río Yarkón, en el borde oriental de la llanura de Sarón, donde el camino de la costa se estrechaba entre las marismas del río y las colinas: Tell Ras el-Ain, hoy Tel Afek, junto a Rosh HaAyin, a unos 15 km al este de Tel Aviv. El nombre significa «fortaleza» o «lecho de río», y varias ciudades lo llevaron; la Biblia conoce un Afec en Aser, otro en el Golán donde fue derrotado Ben-adad, y un tercero en el Líbano. Este se nombra en los textos egipcios de execración del siglo XIX a. C. y en la lista de Tutmosis III. Las excavaciones de Moshe Kochavi en 1972–1985 hallaron una ciudad del Bronce Medio, un palacio del Bronce Final del gobernador egipcio con tablillas cuneiformes del siglo XIII, entre ellas una carta de un funcionario de Ugarit, y cerámica filistea temprana sobre sus ruinas."
    - "La lista de reyes vencidos de Josué tiene «el rey de Aphec, otro: el rey de Lasarón, otro». La ciudad era la base avanzada de los filisteos contra la región montañosa: Israel «asentó campo junto á Eben-ezer, y los Filisteos asentaron el suyo en Aphec», y en las dos batallas que siguieron Israel fue derrotado y perdió a los hijos de Elí y el arca de Dios. Antes de Gilboa, «los Filisteos juntaron todos sus campos en Aphec» mientras los israelitas acampaban junto a la fuente de Jezreel; muchos piensan que es el mismo Afec, el punto de reunión de los señores filisteos, aunque algunos lo buscan más cerca de Jezreel."
    - "Hacia 9 a. C. Herodes el Grande construyó una ciudad nueva en el sitio y la llamó Antípatris, por su padre Antípatro, eligiendo, dice Josefo, una llanura bien regada con hermosos árboles. Aquí descansó la caballería romana cuando «los soldados, tomando á Pablo como les era mandado, lleváronle de noche á Antipatris», en el camino de Jerusalén a Cesarea; se han excavado una calle romana pavimentada y un foro. La ciudad decayó tras un terremoto en 363 d. C. Un fuerte otomano del siglo XVI aún corona el montículo, que se halla en el Parque Nacional del Yarkón, y los manantiales alimentan el río que atraviesa Tel Aviv."
  pt:
    - "Afeque era uma cidade cananeia junto às nascentes do rio Yarkon, na borda oriental da planície de Sarom, onde a estrada da costa se estreitava entre os pântanos do rio e as colinas: Tell Ras el-Ain, hoje Tel Afek, junto a Rosh HaAyin, cerca de 15 km a leste de Tel Aviv. O nome significa “fortaleza” ou “leito de rio”, e várias cidades o tiveram; a Bíblia conhece uma Afeque em Aser, outra no Golã onde Ben-Hadade foi derrotado, e uma terceira no Líbano. Esta é citada nos textos egípcios de execração do século XIX a.C. e na lista de Tutmés III. As escavações de Moshe Kochavi em 1972–1985 acharam uma cidade do Bronze Médio, um palácio do Bronze Final do governador egípcio com tabuinhas cuneiformes do século XIII, entre elas uma carta de um funcionário de Ugarit, e cerâmica filisteia antiga sobre as suas ruínas."
    - "A lista de reis vencidos de Josué traz “o rei de Afeque, um; o rei de Lassarom, um”. A cidade era a base avançada dos filisteus contra a região montanhosa: Israel “acampou perto de Ebenézer; e os filisteus acamparam em Afeque”, e nas duas batalhas que se seguiram Israel foi derrotado e perdeu os filhos de Eli e a arca de Deus. Antes do Gilboa, “Os filisteus reuniram todos os seus exércitos em Afeque”, enquanto os israelitas acampavam junto à fonte em Jezreel; muitos tomam esta pela mesma Afeque, ponto de reunião dos senhores filisteus, embora alguns a procurem mais perto de Jezreel."
    - "Por volta de 9 a.C., Herodes, o Grande, construiu uma nova cidade no local e a chamou Antipátride, em honra de seu pai Antípatro, escolhendo, diz Josefo, uma planície bem irrigada e de belas árvores. Aqui descansou a cavalaria romana quando “os soldados, cumprindo as suas ordens, pegaram Paulo e o levaram de noite para Antipátride”, na estrada de Jerusalém a Cesareia; foram escavadas uma rua romana pavimentada e um fórum. A cidade declinou após um terremoto em 363 d.C. Um forte otomano do século XVI ainda coroa o montículo, que fica no Parque Nacional do Yarkon, e as nascentes alimentam o rio que atravessa Tel Aviv."
  de:
    - "Afek war eine kanaanäische Stadt bei den Quellen des Jarkon am Ostrand der Scharonebene, wo die Küstenstraße zwischen den Sümpfen des Flusses und den Bergen eingeengt wurde: Tell Ras el-Ain, heute Tel Afek bei Rosch ha-Ajin, etwa 15 km östlich von Tel Aviv. Der Name bedeutet „Festung“ oder „Flussbett“, und mehrere Städte trugen ihn; die Bibel kennt ein Afek in Asser, ein anderes auf dem Golan, wo Ben-Hadad geschlagen wurde, und ein drittes im Libanon. Dieses wird in den ägyptischen Ächtungstexten des 19. Jahrhunderts v. Chr. und in der Liste Thutmosis' III. genannt. Moshe Kochavis Grabungen 1972–1985 fanden eine mittelbronzezeitliche Stadt, einen spätbronzezeitlichen Palast des ägyptischen Statthalters mit Keilschrifttafeln des 13. Jahrhunderts, darunter einem Brief eines Beamten aus Ugarit, und frühe philistäische Keramik über seinen Ruinen."
    - "Josuas Liste der besiegten Könige hat „der König zu Aphek, der König zu Lasaron“. Die Stadt war der vorgeschobene Stützpunkt der Philister gegen das Bergland: die Israeliten „lagerten sich bei Eben-Ezer. Die Philister aber hatten sich gelagert zu Aphek“, und in den beiden folgenden Schlachten wurde Israel vernichtend geschlagen und verlor die Söhne Elis und die Lade Gottes. Vor Gilboa „versammelten“ die Philister „alle ihre Heere zu Aphek“, während die Israeliten an der Quelle in Jesreel lagerten; viele halten das für dasselbe Afek, den Sammelplatz der philistäischen Fürsten, doch suchen einige es näher bei Jesreel."
    - "Um 9 v. Chr. baute Herodes der Große an dieser Stelle eine neue Stadt und nannte sie Antipatris nach seinem Vater Antipater, wobei er, wie Josephus sagt, eine wasserreiche Ebene mit schönen Bäumen wählte. Hier rastete die römische Reiterei, als „die Kriegsknechte, wie ihnen befohlen war, nahmen Paulus und führten ihn bei der Nacht gen Antipatris“, an der Straße von Jerusalem nach Cäsarea; eine gepflasterte römische Straße und ein Forum wurden ausgegraben. Die Stadt verfiel nach einem Erdbeben 363 n. Chr. Ein osmanisches Fort des 16. Jahrhunderts krönt noch immer den Hügel, der im Jarkon-Nationalpark liegt, und die Quellen speisen den Fluss, der durch Tel Aviv fließt."
  fr:
    - "Aphek était une ville cananéenne aux sources du Yarkon, sur le bord oriental de la plaine de Saron, là où la route côtière était resserrée entre les marais du fleuve et les collines : Tell Ras el-Ain, aujourd’hui Tel Afek, près de Rosh HaAyin, à quelque 15 km à l’est de Tel-Aviv. Le nom signifie « forteresse » ou « lit de fleuve », et plusieurs villes le portaient ; la Bible connaît une Aphek en Aser, une autre sur le Golan où Ben-Hadad fut battu, et une troisième au Liban. Celle-ci est nommée dans les textes d’envoûtement égyptiens du XIXe siècle av. J.-C. et dans la liste de Thoutmosis III. Les fouilles de Moshe Kochavi en 1972-1985 ont révélé une ville du Bronze moyen, un palais du gouverneur égyptien du Bronze récent avec des tablettes cunéiformes du XIIIe siècle, dont une lettre d’un fonctionnaire d’Ougarit, et de la céramique philistine ancienne sur ses ruines."
    - "La liste des rois vaincus par Josué porte « le roi d’Aphek, un ; le roi de Lascharon, un ». La ville était la base avancée des Philistins contre la montagne : Israël « campa près d’Ében-Ézer, et les Philistins étaient campés à Aphek », et dans les deux batailles qui suivirent, Israël fut mis en déroute et perdit les fils d’Éli et l’arche de Dieu. Avant le Guilboa, « les Philistins rassemblèrent toutes leurs troupes à Aphek » pendant qu’Israël campait près de la source de Jizreel ; beaucoup y voient la même Aphek, point de rassemblement des seigneurs philistins, bien que certains la cherchent plus près de Jizreel."
    - "Vers 9 av. J.-C., Hérode le Grand bâtit une ville nouvelle sur le site et l’appela Antipatris d’après son père Antipater, choisissant, dit Josèphe, une plaine bien arrosée aux beaux arbres. Les cavaliers romains s’y reposèrent quand « les soldats, selon l’ordre qu’ils avaient reçu, prirent Paul, et le conduisirent pendant la nuit jusqu’à Antipatris » sur la route de Jérusalem à Césarée ; une rue romaine dallée et un forum ont été dégagés. La ville déclina après un séisme en 363 apr. J.-C. Un fort ottoman du XVIe siècle couronne encore le tertre, qui se trouve dans le parc national du Yarkon, et les sources alimentent le fleuve qui traverse Tel-Aviv."
