# Overview article (ADR 0007). Mainstream facts only; this is the Aphek of the Sharon (Antipatris); whether 1 Samuel 29 means the same Aphek is said to be debated.
id: aphek
place: a7b2e63
title:
  en: "Aphek"
  ru: "Афек"
body:
  en:
    - "Aphek was a Canaanite city at the springs of the Yarkon river, on the eastern edge of the plain of Sharon, where the road along the coast was squeezed between the river's marshes and the hills: Tell Ras el-Ain, now Tel Afek by Rosh HaAyin, some 15 km east of Tel Aviv. The name means “stronghold” or “river bed”, and several towns bore it; the Bible knows an Aphek in Asher, another on the Golan where Ben-hadad was beaten, and a third in Lebanon. This one is named in the Egyptian execration texts of the nineteenth century BC and in the list of Thutmose III. Moshe Kochavi's excavations in 1972–1985 found a Middle Bronze city, a Late Bronze palace of the Egyptian governor with cuneiform tablets of the thirteenth century, among them a letter from an official of Ugarit, and early Philistine pottery over its ruins."
    - "Joshua's list of the defeated kings has “the king of Aphek, one; the king of Lasharon, one”. The city was the Philistines' forward base against the hill country: Israel “pitched beside Eben-ezer: and the Philistines pitched in Aphek”, and in the two battles that followed Israel was routed and lost the sons of Eli and the ark of God. Before Gilboa “the Philistines gathered together all their armies to Aphek” while the Israelites camped by the spring in Jezreel; many take this to be the same Aphek, the muster point of the Philistine lords, though some look for it nearer Jezreel."
    - "About 9 BC Herod the Great built a new city on the site and called it Antipatris after his father Antipater, choosing, Josephus says, a well-watered plain with fine trees. Here the Roman cavalry rested when “the soldiers, as it was commanded them, took Paul, and brought him by night to Antipatris” on the road from Jerusalem to Caesarea; a paved Roman street and a forum have been dug. The city declined after an earthquake in AD 363. An Ottoman fort of the sixteenth century still crowns the mound, which lies in the Yarkon National Park, and the springs feed the river that flows through Tel Aviv."
  ru:
    - "Афек — ханаанский город у истоков реки Яркон, на восточном краю Саронской равнины, где прибрежная дорога зажата между речными болотами и холмами: Телль-Рас-эль-Айн, ныне Тель-Афек у Рош-ха-Аина, примерно в 15 км к востоку от Тель-Авива. Имя значит «крепость» или «русло», и так звались несколько городов; Библия знает Афек в уделе Асира, другой на Голане, где был разбит Венадад, и третий в Ливане. Этот назван в египетских заклинательных текстах XIX века до н. э. и в списке Тутмоса III. Раскопки Моше Кохави в 1972–1985 годах открыли город среднего бронзового века, дворец египетского наместника позднего бронзового века с клинописными табличками XIII века, среди них письмо чиновника из Угарита, и раннюю филистимскую керамику над его руинами."
    - "В списке побеждённых царей у Иисуса Навина стоит: «Один царь Афека, один царь Шарона». Город был передовой базой Филистимлян против нагорья: Израильтяне «расположились станом при Авен-Езере, а Филистимляне расположились при Афеке», и в двух последовавших битвах Израиль был разбит и потерял сыновей Илия и ковчег Божий. Перед Гелвуем «собрали Филистимляне все ополчения свои в Афеке», а Израильтяне стояли у источника в Изрееле; многие считают, что это тот же Афек, сборный пункт филистимских владетелей, хотя иные ищут его ближе к Изреелю."
    - "Около 9 г. до н. э. Ирод Великий построил на этом месте новый город и назвал его Антипатридой в честь своего отца Антипатра, выбрав, по словам Иосифа Флавия, хорошо орошённую равнину с прекрасными деревьями. Здесь отдыхала римская конница, когда «воины, по данному им приказанию, взяв Павла, повели ночью в Антипатриду» по дороге из Иерусалима в Кесарию; раскопаны мощёная римская улица и форум. Город пришёл в упадок после землетрясения 363 г. н. э. Османская крепость XVI века до сих пор венчает холм, лежащий в национальном парке Яркон, а источники питают реку, что течёт через Тель-Авив."
