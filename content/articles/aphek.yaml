body:
  en:
    - "Aphek was a Canaanite city at the springs of the Yarkon river, on the eastern edge of the plain of Sharon, where the road along the coast was squeezed between the river's marshes and the hills: Tell Ras el-Ain, now Tel Afek by Rosh HaAyin, some 15 km east of Tel Aviv. The name means “stronghold” or “river bed”, and several towns bore it; the Bible knows an Aphek in Asher, another, probably on the Golan, where Ben-hadad was beaten, and a third in Lebanon. This one is named in the Egyptian execration texts of the nineteenth or eighteenth century BC and in the list of Thutmose III. Moshe Kochavi's excavations in 1972–1985 found a Middle Bronze city, a Late Bronze palace of the Egyptian governor with cuneiform tablets of the thirteenth century, among them a letter from an official of Ugarit, and early Philistine pottery over its ruins."
    - "Joshua's list of the defeated kings has “the king of Aphek, one; the king of Lasharon, one”. The city was the Philistines' forward base against the hill country: Israel “pitched beside Eben-ezer: and the Philistines pitched in Aphek”, and in the two battles that followed Israel was routed and lost the sons of Eli and the ark of God. Before Gilboa “the Philistines gathered together all their armies to Aphek” while the Israelites camped by the spring in Jezreel; many take this to be the same Aphek, the muster point of the Philistine lords, though some look for it nearer Jezreel."
    - "About 9 BC Herod the Great built a new city on the site and called it Antipatris after his father Antipater, choosing, Josephus says, a well-watered plain with fine trees. Here Paul's night march ended when “the soldiers, as it was commanded them, took Paul, and brought him by night to Antipatris” on the road from Jerusalem to Caesarea; a paved Roman street and a forum have been dug. The city declined after an earthquake in AD 363. An Ottoman fort of the sixteenth century still crowns the mound, which lies in the Yarkon National Park, and the springs feed the river that flows through Tel Aviv."
  ru:
    - "Афек — ханаанский город у истоков реки Яркон, на восточном краю Саронской равнины, где прибрежная дорога зажата между речными болотами и холмами: Телль-Рас-эль-Айн, ныне Тель-Афек у Рош-ха-Аина, примерно в 15 км к востоку от Тель-Авива. Имя значит «крепость» или «русло», и так звались несколько городов; Библия знает Афек в уделе Асира, другой, вероятно, на Голане, где был разбит Венадад, и третий в Ливане. Этот назван в египетских заклинательных текстах XIX или XVIII века до н. э. и в списке Тутмоса III. Раскопки Моше Кохави в 1972–1985 годах открыли город среднего бронзового века, дворец египетского наместника позднего бронзового века с клинописными табличками XIII века, среди них письмо чиновника из Угарита, и раннюю филистимскую керамику над его руинами."
    - "В списке побеждённых царей у Иисуса Навина стоит: «Один царь Афека, один царь Шарона». Город был передовой базой Филистимлян против нагорья: Израильтяне «расположились станом при Авен-Езере, а Филистимляне расположились при Афеке», и в двух последовавших битвах Израиль был разбит и потерял сыновей Илия и ковчег Божий. Перед Гелвуем «собрали Филистимляне все ополчения свои в Афеке», а Израильтяне стояли у источника в Изрееле; многие считают, что это тот же Афек, сборный пункт филистимских владетелей, хотя иные ищут его ближе к Изреелю."
    - "Около 9 г. до н. э. Ирод Великий построил на этом месте новый город и назвал его Антипатридой в честь своего отца Антипатра, выбрав, по словам Иосифа Флавия, хорошо орошённую равнину с прекрасными деревьями. Здесь окончился ночной переход Павла, когда «воины, по данному им приказанию, взяв Павла, повели ночью в Антипатриду» по дороге из Иерусалима в Кесарию; раскопаны мощёная римская улица и форум. Город пришёл в упадок после землетрясения 363 г. н. э. Османская крепость XVI века до сих пор венчает холм, лежащий в национальном парке Яркон, а источники питают реку, что течёт через Тель-Авив."
  uk:
    - "Афек був ханаанським містом біля джерел річки Яркон, на східному краї Шаронської рівнини, де прибережна дорога затискалася між болотами річки та пагорбами: Телль-Рас-ель-Айн, нині Тель-Афек біля Рош-га-Айіну, приблизно за 15 км на схід від Тель-Авіва. Назва означає «твердиня» або «річище», і кілька міст її носили; Біблія знає Афек в Асірі, інший, імовірно, на Голані, де розбили Бен-Гадада, і третій у Лівані. Цей згаданий у єгипетських текстах прокляття XIX або XVIII століття до н. е. і в переліку Тутмоса III. Розкопки Моше Кохаві в 1972–1985 рр. виявили місто середньої бронзової доби, палац єгипетського намісника пізньої бронзової доби з клинописними табличками XIII століття, серед них лист від урядовця Угарита, та ранню філістимську кераміку над його руїнами."
    - "Перелік переможених царів у книзі Ісуса Навина має: «Царь Афекський, один; царь Саронський, один». Місто було передовою базою филистимлян проти нагір'я: Ізраїль «отаборились при Авен-Езері, тим часом як Филистії отаборились під Афеком», і в двох битвах, що настали, Ізраїль був розбитий і втратив синів Ілія та ковчег Божий. Перед Гілбоа «скупили Филистії всї потуги до купи в Афецї», а ізраїльтяни стали табором біля джерела в Їзреелі; багато хто вважає це тим самим Афеком, збірним пунктом филистимських володарів, хоч дехто шукає його ближче до Їзреелю."
    - "Близько 9 р. до н. е. Ірод Великий збудував на цьому місці нове місто й назвав його Антипатрида на честь свого батька Антипатра, обравши, як каже Йосиф Флавій, добре зрошену рівнину з гарними деревами. Тут закінчився нічний перехід Павла, коли «воїни ж, як звелено їм, узявши Павла, повели в ночі в Антипатриду» на дорозі з Єрусалима до Кесарії; розкопано вимощену римську вулицю та форум. Місто занепало після землетрусу 363 р. н. е. Османський форт XVI століття й досі вінчає пагорб, що лежить у національному парку Яркон, а джерела живлять річку, яка тече через Тель-Авів."
  es:
    - "Afec era una ciudad cananea en los manantiales del río Yarkón, en el borde oriental de la llanura de Sarón, donde el camino de la costa se estrechaba entre las marismas del río y las colinas: Tell Ras el-Ain, hoy Tel Afek, junto a Rosh HaAyin, a unos 15 km al este de Tel Aviv. El nombre significa «fortaleza» o «lecho de río», y varias ciudades lo llevaron; la Biblia conoce un Afec en Aser, otro, probablemente en el Golán, donde fue derrotado Ben-adad, y un tercero en el Líbano. Este se nombra en los textos egipcios de execración de los siglos XIX o XVIII a. C. y en la lista de Tutmosis III. Las excavaciones de Moshe Kochavi en 1972–1985 hallaron una ciudad del Bronce Medio, un palacio del Bronce Final del gobernador egipcio con tablillas cuneiformes del siglo XIII, entre ellas una carta de un funcionario de Ugarit, y cerámica filistea temprana sobre sus ruinas."
    - "La lista de reyes vencidos de Josué tiene «el rey de Aphec, otro: el rey de Lasarón, otro». La ciudad era la base avanzada de los filisteos contra la región montañosa: Israel «asentó campo junto á Eben-ezer, y los Filisteos asentaron el suyo en Aphec», y en las dos batallas que siguieron Israel fue derrotado y perdió a los hijos de Elí y el arca de Dios. Antes de Gilboa, «los Filisteos juntaron todos sus campos en Aphec» mientras los israelitas acampaban junto a la fuente de Jezreel; muchos piensan que es el mismo Afec, el punto de reunión de los señores filisteos, aunque algunos lo buscan más cerca de Jezreel."
    - "Hacia 9 a. C. Herodes el Grande construyó una ciudad nueva en el sitio y la llamó Antípatris, por su padre Antípatro, eligiendo, dice Josefo, una llanura bien regada con hermosos árboles. Aquí terminó la marcha nocturna de Pablo cuando «los soldados, tomando á Pablo como les era mandado, lleváronle de noche á Antipatris», en el camino de Jerusalén a Cesarea; se han excavado una calle romana pavimentada y un foro. La ciudad decayó tras un terremoto en 363 d. C. Un fuerte otomano del siglo XVI aún corona el montículo, que se halla en el Parque Nacional del Yarkón, y los manantiales alimentan el río que atraviesa Tel Aviv."
  pt:
    - "Afeque era uma cidade cananeia junto às nascentes do rio Yarkon, na borda oriental da planície de Sarom, onde a estrada da costa se estreitava entre os pântanos do rio e as colinas: Tell Ras el-Ain, hoje Tel Afek, junto a Rosh HaAyin, cerca de 15 km a leste de Tel Aviv. O nome significa “fortaleza” ou “leito de rio”, e várias cidades o tiveram; a Bíblia conhece uma Afeque em Aser, outra, provavelmente no Golã, onde Ben-Hadade foi derrotado, e uma terceira no Líbano. Esta é citada nos textos egípcios de execração do século XIX ou XVIII a.C. e na lista de Tutmés III. As escavações de Moshe Kochavi em 1972–1985 acharam uma cidade do Bronze Médio, um palácio do Bronze Final do governador egípcio com tabuinhas cuneiformes do século XIII, entre elas uma carta de um funcionário de Ugarit, e cerâmica filisteia antiga sobre as suas ruínas."
    - "A lista de reis vencidos de Josué traz “o rei de Afeque, um; o rei de Lassarom, um”. A cidade era a base avançada dos filisteus contra a região montanhosa: Israel “acampou perto de Ebenézer; e os filisteus acamparam em Afeque”, e nas duas batalhas que se seguiram Israel foi derrotado e perdeu os filhos de Eli e a arca de Deus. Antes do Gilboa, “Os filisteus reuniram todos os seus exércitos em Afeque”, enquanto os israelitas acampavam junto à fonte em Jezreel; muitos tomam esta pela mesma Afeque, ponto de reunião dos senhores filisteus, embora alguns a procurem mais perto de Jezreel."
    - "Por volta de 9 a.C., Herodes, o Grande, construiu uma nova cidade no local e a chamou Antipátride, em honra de seu pai Antípatro, escolhendo, diz Josefo, uma planície bem irrigada e de belas árvores. Aqui terminou a marcha noturna de Paulo quando “os soldados, cumprindo as suas ordens, pegaram Paulo e o levaram de noite para Antipátride”, na estrada de Jerusalém a Cesareia; foram escavadas uma rua romana pavimentada e um fórum. A cidade declinou após um terremoto em 363 d.C. Um forte otomano do século XVI ainda coroa o montículo, que fica no Parque Nacional do Yarkon, e as nascentes alimentam o rio que atravessa Tel Aviv."
  de:
    - "Afek war eine kanaanäische Stadt bei den Quellen des Jarkon am Ostrand der Scharonebene, wo die Küstenstraße zwischen den Sümpfen des Flusses und den Bergen eingeengt wurde: Tell Ras el-Ain, heute Tel Afek bei Rosch ha-Ajin, etwa 15 km östlich von Tel Aviv. Der Name bedeutet „Festung“ oder „Flussbett“, und mehrere Städte trugen ihn; die Bibel kennt ein Afek in Asser, ein anderes, wahrscheinlich auf dem Golan, wo Ben-Hadad geschlagen wurde, und ein drittes im Libanon. Dieses wird in den ägyptischen Ächtungstexten des 19. oder 18. Jahrhunderts v. Chr. und in der Liste Thutmosis' III. genannt. Moshe Kochavis Grabungen 1972–1985 fanden eine mittelbronzezeitliche Stadt, einen spätbronzezeitlichen Palast des ägyptischen Statthalters mit Keilschrifttafeln des 13. Jahrhunderts, darunter einem Brief eines Beamten aus Ugarit, und frühe philistäische Keramik über seinen Ruinen."
    - "Josuas Liste der besiegten Könige hat „der König zu Aphek, der König zu Lasaron“. Die Stadt war der vorgeschobene Stützpunkt der Philister gegen das Bergland: die Israeliten „lagerten sich bei Eben-Ezer. Die Philister aber hatten sich gelagert zu Aphek“, und in den beiden folgenden Schlachten wurde Israel vernichtend geschlagen und verlor die Söhne Elis und die Lade Gottes. Vor Gilboa „versammelten“ die Philister „alle ihre Heere zu Aphek“, während die Israeliten an der Quelle in Jesreel lagerten; viele halten das für dasselbe Afek, den Sammelplatz der philistäischen Fürsten, doch suchen einige es näher bei Jesreel."
    - "Um 9 v. Chr. baute Herodes der Große an dieser Stelle eine neue Stadt und nannte sie Antipatris nach seinem Vater Antipater, wobei er, wie Josephus sagt, eine wasserreiche Ebene mit schönen Bäumen wählte. Hier endete der Nachtmarsch des Paulus, als „die Kriegsknechte, wie ihnen befohlen war, nahmen Paulus und führten ihn bei der Nacht gen Antipatris“, an der Straße von Jerusalem nach Cäsarea; eine gepflasterte römische Straße und ein Forum wurden ausgegraben. Die Stadt verfiel nach einem Erdbeben 363 n. Chr. Ein osmanisches Fort des 16. Jahrhunderts krönt noch immer den Hügel, der im Jarkon-Nationalpark liegt, und die Quellen speisen den Fluss, der durch Tel Aviv fließt."
  fr:
    - "Aphek était une ville cananéenne aux sources du Yarkon, sur le bord oriental de la plaine de Saron, là où la route côtière se resserrait entre les marais du fleuve et les collines : Tell Ras el-Ain, aujourd’hui Tel Afek, près de Rosh HaAyin, à quelque 15 km à l’est de Tel-Aviv. Le nom signifie « forteresse » ou « lit de fleuve », et plusieurs villes le portaient ; la Bible connaît une Aphek en Aser, une autre, probablement sur le Golan, où Ben-Hadad fut battu, et une troisième au Liban. Celle-ci figure dans les textes d’envoûtement égyptiens du XIXe ou du XVIIIe siècle av. J.-C. et dans la liste de Thoutmosis III. Les fouilles de Moshe Kochavi (1972-1985) ont révélé une ville du Bronze moyen, un palais du gouverneur égyptien du Bronze récent avec des tablettes cunéiformes du XIIIe siècle, dont une lettre d’un fonctionnaire d’Ougarit, et de la céramique philistine ancienne sur ses ruines."
    - "La liste des rois vaincus par Josué porte « le roi d’Aphek, un ; le roi de Lascharon, un ». La ville était la base avancée des Philistins contre la montagne : Israël « campa près d’Ében-Ézer, et les Philistins étaient campés à Aphek », et dans les deux batailles qui suivirent, Israël fut mis en déroute et perdit les fils d’Éli et l’arche de Dieu. Avant le Guilboa, « les Philistins rassemblèrent toutes leurs troupes à Aphek » pendant qu’Israël campait près de la source de Jizreel ; beaucoup y voient la même Aphek, point de rassemblement des seigneurs philistins, bien que certains la cherchent plus près de Jizreel."
    - "Vers 9 av. J.-C., Hérode le Grand bâtit une ville nouvelle sur le site et l’appela Antipatris d’après son père Antipater, choisissant, dit Josèphe, une plaine bien arrosée aux beaux arbres. La marche nocturne de Paul s’y acheva quand « les soldats, selon l’ordre qu’ils avaient reçu, prirent Paul, et le conduisirent pendant la nuit jusqu’à Antipatris » sur la route de Jérusalem à Césarée ; une rue romaine dallée et un forum ont été dégagés. La ville déclina après un séisme en 363 apr. J.-C. Un fort ottoman du XVIe siècle couronne encore le tertre, qui se trouve dans le parc national du Yarkon, et les sources alimentent le fleuve qui traverse Tel-Aviv."
  it:
    - "Afek era una città cananea alle sorgenti del fiume Yarkon, sul margine orientale della piana di Saròn, dove la strada lungo la costa era stretta tra le paludi del fiume e le colline: Tell Ras el-Ain, oggi Tel Afek presso Rosh HaAyin, a circa 15 km a est di Tel Aviv. Il nome significa «roccaforte» o «letto di fiume», e diverse città lo portarono; la Bibbia conosce un’Afek in Aser, un’altra, probabilmente sul Golan, dove Ben-Adad fu sconfitto, e una terza in Libano. Questa è nominata nei testi egizi di esecrazione del XIX o XVIII secolo a.C. e nell’elenco di Tutmosi III. Gli scavi di Moshe Kochavi nel 1972–1985 hanno trovato una città del Bronzo Medio, un palazzo del Bronzo Tardo del governatore egizio con tavolette cuneiformi del XIII secolo, fra cui una lettera di un funzionario di Ugarit, e ceramica filistea antica sopra le sue rovine."
    - "L’elenco dei re sconfitti di Giosuè ha «il re di Afek, il re di Sharon». La città era la base avanzata dei Filistei contro la regione collinosa: Israele «si accampò presso Eben-Ezer; i Filistei erano accampati presso Afek», e nelle due battaglie che seguirono Israele fu sbaragliato e perse i figli di Eli e l’arca di Dio. Prima di Gelboe «I Filistei radunarono tutte le loro truppe ad Afek», mentre gli Israeliti si accampavano presso la sorgente di Izreel; molti ritengono che sia la stessa Afek, il punto di raduno dei signori filistei, benché alcuni la cerchino più vicino a Izreel."
    - "Intorno al 9 a.C. Erode il Grande costruì sul sito una nuova città e la chiamò Antipatride in onore del padre Antipatro, scegliendo, dice Flavio Giuseppe, una pianura ben irrigata con begli alberi. Qui terminò la marcia notturna di Paolo quando «I soldati dunque, secondo ch’era loro stato ordinato, presero Paolo e lo condussero di notte ad Antipatrìda» sulla strada da Gerusalemme a Cesarea; sono state scavate una strada romana lastricata e un foro. La città decadde dopo un terremoto del 363 d.C. Un forte ottomano del XVI secolo corona ancora il tell, che si trova nel Parco nazionale Yarkon, e le sorgenti alimentano il fiume che attraversa Tel Aviv."
  pl:
    - "Afek było kananejskim miastem u źródeł rzeki Jarkon, na wschodnim skraju równiny Szaron, gdzie droga wzdłuż wybrzeża była ściśnięta między bagnami rzeki a wzgórzami: Tell Ras el-Ain, dziś Tel Afek koło Rosz ha-Ajin, około 15 km na wschód od Tel Awiwu. Nazwa oznacza „twierdzę” lub „koryto rzeki”, nosiło ją kilka miast; Biblia zna Afek w Aszerze, inny, prawdopodobnie na Golanie, gdzie pobito Ben-Hadada, i trzeci w Libanie. Ten wymieniają egipskie teksty egzekracyjne z XIX lub XVIII wieku p.n.e. i lista Totmesa III. Wykopaliska Moshe Kochaviego z lat 1972–1985 odsłoniły miasto ze średniej epoki brązu, pałac egipskiego namiestnika z późnej epoki brązu z klinowymi tabliczkami z XIII wieku, wśród nich list urzędnika z Ugarit, oraz wczesnofilistyńską ceramikę nad jego ruinami."
    - "Wykaz pokonanych królów u Jozuego zawiera „Król Afek jeden; król Saron jeden”. Miasto było wysuniętą bazą Filistynów przeciw górskiej krainie: Izrael „położył się obozem u Ebenezer, Filistynowie zaś położyli się obozem w Afeku”, a w dwóch bitwach, które potem nastąpiły, Izrael został rozgromiony i stracił synów Helego i skrzynię Bożą. Przed Gilboa „zebrali Filistynowie wszystkie wojska swe do Afeku”, gdy Izraelczycy obozowali nad źródłem w Jizreel; wielu uważa to za ten sam Afek, miejsce zbiórki władców filistyńskich, choć niektórzy szukają go bliżej Jizreel."
    - "Około 9 r. p.n.e. Herod Wielki zbudował na tym miejscu nowe miasto i nazwał je Antypatris od imienia ojca Antypatra, wybrawszy, jak mówi Józef Flawiusz, dobrze nawodnioną równinę z pięknymi drzewami. Tu zakończył się nocny marsz Pawła, gdy „Żołnierze tedy tak, jako im było rozkazano, wziąwszy Pawła, prowadzili go nocą do Antypatrydy” na drodze z Jerozolimy do Cezarei; odkopano brukowaną rzymską ulicę i forum. Miasto podupadło po trzęsieniu ziemi w 363 r. n.e. Osmański fort z XVI wieku wciąż wieńczy tell, który leży w Parku Narodowym Jarkon, a źródła zasilają rzekę płynącą przez Tel Awiw."
  nl:
    - "Afek was een Kanaänitische stad bij de bronnen van de rivier de Yarkon, aan de oostrand van de Saronvlakte, waar de kustweg klem zat tussen de moerassen van de rivier en de heuvels: Tell Ras el-Ain, nu Tel Afek bij Rosj HaAyin, zo’n 15 km ten oosten van Tel Aviv. De naam betekent “vesting” of “rivierbedding”, en meerdere steden droegen hem; de Bijbel kent een Afek in Aser, een ander, waarschijnlijk op de Golan, waar Ben-Hadad werd verslagen, en een derde in Libanon. Dit wordt genoemd in de Egyptische vervloekingsteksten van de negentiende of achttiende eeuw v.Chr. en in de lijst van Thoetmosis III. Moshe Kochavi’s opgravingen (1972–1985) vonden een stad uit de middenbronstijd, een paleis uit de late bronstijd van de Egyptische gouverneur met spijkerschrifttabletten uit de dertiende eeuw, waaronder een brief van een functionaris uit Ugarit, en vroeg-Filistijns aardewerk over de ruïnes."
    - "Jozua’s lijst van verslagen koningen heeft “De koning van Afek, een; de koning van Lassaron, een”. De stad was de voorste basis van de Filistijnen tegen het bergland: Israël “legerde zich bij Eben-Haezer, maar de Filistijnen legerden zich bij Afek”, en in de twee slagen die volgden werd Israël verslagen en verloor de zonen van Eli en de ark Gods. Vóór de Gilboa: “De Filistijnen nu hadden al hun legers vergaderd te Afek”, terwijl de Israëlieten zich legerden bij de bron in Jizreël; velen houden dit voor hetzelfde Afek, het verzamelpunt van de Filistijnse vorsten, al zoeken sommigen het dichter bij Jizreël."
    - "Omstreeks 9 v.Chr. bouwde Herodes de Grote een nieuwe stad op de plaats en noemde haar Antipatris naar zijn vader Antipater, waarbij hij, zegt Josephus, een goed bewaterde vlakte met mooie bomen koos. Hier eindigde de nachtmars van Paulus toen “de krijgsknechten dan, gelijk hun bevolen was, namen Paulus, en brachten hem des nachts tot Antipatris” aan de weg van Jeruzalem naar Caesarea; een geplaveide Romeinse straat en een forum zijn opgegraven. De stad raakte in verval na een aardbeving in 363 n.Chr. Een Ottomaans fort uit de zestiende eeuw bekroont nog de heuvel, die in het Yarkon National Park ligt, en de bronnen voeden de rivier die door Tel Aviv stroomt."
  cs:
    - "Afek bylo kenaanské město u pramenů řeky Jarkon na východním okraji Šaronské pláně, kde byla cesta podél pobřeží stísněna mezi bažinami řeky a pahorky: Tell Ras el-Ain, dnes Tel Afek u Roš ha-Ajin, asi 15 km východně od Tel Avivu. Jméno znamená „pevnost“ nebo „říční koryto“ a nese je několik měst; Bible zná Afek v Ašeru, další, pravděpodobně na Golanu, kde byl poražen Ben-hadad, a třetí v Libanonu. Tento je jmenován v egyptských proklínacích textech z 19. či 18. století př. n. l. a v seznamu Thutmosise III. Vykopávky Moše Kochaviho v letech 1972–1985 nalezly město ze střední doby bronzové, palác egyptského správce z pozdní doby bronzové s klínopisnými tabulkami z 13. století, mezi nimi dopis úředníka z Ugaritu, a raně pelištejskou keramiku nad jeho zříceninami."
    - "Jozuův seznam poražených králů má „Král Afek jeden, král Sáron jeden“. Město bylo předsunutou základnou Pelištejců proti pahorkatině: Izrael vytáhl a „položili se při Eben-Ezer, Filistinští pak položili se v Afeku“ a ve dvou bitvách, které následovaly, byl Izrael rozprášen a ztratil Élího syny i truhlu Boží. Před Gilboou „shromáždili Filistinští všecka vojska svá u Afeku“, zatímco Izraelci tábořili u pramene v Jizreelu; mnozí v tom vidí tentýž Afek, shromaždiště pelištejských knížat, ač jiní jej hledají blíže Jizreelu."
    - "Kolem roku 9 př. n. l. postavil Herodes Veliký na místě nové město a nazval je Antipatris podle svého otce Antipatra, když si vybral, praví Josephus Flavius, dobře zavlažovanou pláň s krásnými stromy. Zde skončil Pavlův noční pochod, když „žoldnéři, jakž jim poručeno bylo, pojavše Pavla, přivedli jej v noci do Antipatridy“ na cestě z Jeruzaléma do Cesareje; byla vykopána dlážděná římská ulice a fórum. Město upadlo po zemětřesení roku 363 n. l. Osmanská pevnost ze 16. století stále korunuje pahorek, který leží v Národním parku Jarkon, a prameny napájejí řeku, jež protéká Tel Avivem."
  sv:
    - "Afek var en kananeisk stad vid källorna till floden Yarkon, på östra kanten av Sarons slätt, där vägen längs kusten trängdes samman mellan flodens kärr och bergen: Tell Ras el-Ain, nu Tel Afek vid Rosh HaAyin, omkring 15 km öster om Tel Aviv. Namnet betyder ”fäste” eller ”flodbädd”, och flera städer bar det; Bibeln känner ett Afek i Asher, ett annat, sannolikt på Golan, där Ben-Hadad blev slagen, och ett tredje i Libanon. Detta nämns i de egyptiska förbannelsetexterna från 1800- eller 1700-talet f.Kr. och i Thutmosis III:s lista. Moshe Kochavis utgrävningar 1972–1985 fann en stad från mellersta bronsåldern, ett palats från senare bronsåldern åt den egyptiske ståthållaren med kilskriftstavlor från 1200-talet f.Kr., bland dem ett brev från en ämbetsman i Ugarit, och tidig filisteisk keramik över dess ruiner."
    - "Josuas förteckning över de besegrade kungarna har ”konungen i Afek en, konungen i Lassaron en”. Staden var filistéernas främre bas mot bergslandet: Israel ”lägrade sig vid Eben-Haeser, under det filistéerna hade lägrat sig vid Afek”, och i de två striderna som följde blev Israel slaget och förlorade Elis söner och Guds ark. Före Gilboa: ”Filistéerna församlade nu alla sina härar i Afek, medan israeliterna voro lägrade vid källan i Jisreel”; många tar detta för samma Afek, filistéfurstarnas samlingsplats, fastän några söker det närmare Jisreel."
    - "Omkring 9 f.Kr. byggde Herodes den store en ny stad på platsen och kallade den Antipatris efter sin far Antipater, och valde, säger Josefus, en vattenrik slätt med vackra träd. Här slutade Paulus’ nattmarsch när ”Så togo nu krigsmännen Paulus, såsom det hade blivit dem befallt, och förde honom om natten till Antipatris” på vägen från Jerusalem till Caesarea; en stenlagd romersk gata och ett forum har grävts fram. Staden förföll efter en jordbävning år 363 e.Kr. Ett osmanskt fort från 1500-talet kröner ännu kullen, som ligger i Yarkons nationalpark, och källorna matar floden som rinner genom Tel Aviv."
  nb:
    - "Afek var en kana'anittisk by ved kildene til elven Yarkon, i østkanten av Sjaron-sletten, der veien langs kysten var presset mellom elvens myrer og åsene: Tell Ras el-Ain, nå Tel Afek ved Rosh HaAyin, omtrent 15 km øst for Tel Aviv. Navnet betyr «festning» eller «elveleie», og flere byer bar det; Bibelen kjenner en Afek i Asjer, en annen, trolig på Golan, der Ben-Hadad ble slått, og en tredje i Libanon. Denne er nevnt i de egyptiske forbannelsestekstene fra 1800- eller 1700-tallet f.Kr. og i listen til Tutmosis III. Moshe Kochavis utgravninger i 1972–1985 fant en by fra mellombronsealder, et palass fra senbronsealder for den egyptiske guvernøren med kileskrifttavler fra 1200-tallet, blant dem et brev fra en embetsmann i Ugarit, og tidlig filistersk keramikk over ruinene."
    - "Josvas liste over de beseirede kongene har «kongen i Afek én, kongen i Lassaron én». Byen var filisternes fremskutte base mot fjellandet: Israel «leiret sig ved Eben-Eser, og filistrene leiret sig i Afek», og i de to slagene som fulgte, ble Israel slått og mistet Elis sønner og Guds ark. Før Gilboa heter det: «Filistrene samlet alle sine hærer i Afek», mens israelittene leiret seg ved kilden i Jisreel; mange mener at dette er den samme Afek, samlingsstedet for filisterfyrstene, selv om noen leter etter den nærmere Jisreel."
    - "Omkring 9 f.Kr. bygde Herodes den store en ny by på stedet og kalte den Antipatris etter sin far Antipater, og valgte, sier Josefus, en vannrik slette med fine trær. Her endte Paulus' nattmarsj da «krigsfolket tok nu Paulus, som det var blitt dem pålagt, og førte ham om natten til Antipatris» på veien fra Jerusalem til Cæsarea; en brolagt romersk gate og et forum er gravd fram. Byen forfalt etter et jordskjelv i 363 e.Kr. Et osmansk fort fra 1500-tallet kroner fortsatt tellen, som ligger i Yarkon nasjonalpark, og kildene mater elven som renner gjennom Tel Aviv."
