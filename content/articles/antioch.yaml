body:
  en:
    - "Antioch lies on the Orontes in northern Syria, about 25 km from the sea, between the river and Mount Silpius; today it is Antakya in Turkey. Seleucus I Nicator founded it in 300 BC and named it after his father Antiochus, with Seleucia Pieria as its port and the grove of Apollo at Daphne as its suburb. It became the capital of the Seleucid kings and grew into a city of four walled quarters."
    - "When Pompey made Syria a Roman province in 64 BC, Antioch became the seat of its governor. Herod the Great paved its main street and lined it with colonnades. Josephus counts it the third city of the Roman world, and it had a large Jewish community."
    - "In Acts, believers scattered after Stephen's death preached to Greeks at Antioch. Jerusalem sent Barnabas, who brought Saul from Tarsus, and here the disciples were first called Christians; when Agabus foretold a famine, the church sent relief to Judea. The church sent Barnabas and Saul on their first journey and received them back. A dispute over circumcision took Paul and Barnabas to Jerusalem, and they returned with the apostles' letter. Paul withstood Peter at Antioch, and from here he set out on his later journeys."
    - "Its bishop Ignatius was taken to Rome under Trajan and wrote letters to the churches on the way. Trajan was in the city when a great earthquake struck in AD 115. Constantine began the octagonal Great Church, and his son Constantius finished it; it was dedicated in 341 at a council held there. Julian spent the winter of 362–363 in Antioch and quarrelled with its people. Libanius taught rhetoric there, and John Chrysostom preached there from 386 until he became bishop of Constantinople in 398."
  ru:
    - "Антиохия стоит на Оронте в Северной Сирии, примерно в 25 км от моря, между рекой и горой Сильпий; сегодня это Антакья в Турции. Селевк I Никатор основал её в 300 г. до н. э. и назвал в честь своего отца Антиоха; гаванью ей служила Селевкия Пиерийская, а предместьем — роща Аполлона в Дафне. Город стал столицей Селевкидов и разросся до четырёх кварталов, каждый со своей стеной."
    - "Когда Помпей в 64 г. до н. э. сделал Сирию римской провинцией, Антиохия стала резиденцией её наместника. Ирод Великий вымостил её главную улицу и обнёс колоннадами. Иосиф Флавий называет её третьим городом римского мира; в ней жила большая иудейская община."
    - "По книге Деяний, верующие, рассеянные после гибели Стефана, проповедовали в Антиохии Еллинам. Иерусалим послал туда Варнаву, он привёл из Тарса Савла, и здесь ученики впервые стали называться христианами; когда Агав предсказал голод, церковь послала помощь в Иудею. Отсюда церковь отправила Варнаву и Савла в первое путешествие и приняла их по возвращении. Спор об обрезании привёл Павла и Варнаву в Иерусалим, и они вернулись с посланием апостолов. В Антиохии Павел противостал Петру, и отсюда он отправлялся в следующие путешествия."
    - "Её епископа Игнатия при Траяне увезли в Рим, и по пути он писал послания церквам. Траян находился в городе, когда в 115 г. н. э. его постигло сильное землетрясение. Константин начал строить восьмигранную Великую церковь, а его сын Констанций достроил её; её освятили в 341 г. на соборе, собравшемся здесь же. Юлиан провёл в Антиохии зиму 362–363 гг. и рассорился с горожанами. Здесь учил риторике Ливаний, а Иоанн Златоуст проповедовал с 386 г., пока в 398 г. не стал епископом Константинополя."
  uk:
    - "Антіохія лежить на Оронті в північній Сирії, приблизно за 25 км від моря, між річкою і горою Сілпій; нині це Антак'я в Туреччині. Селевк I Нікатор заснував її в 300 р. до н. е. і назвав на честь свого батька Антіоха, з Селевкією Пієрією як портом і гаєм Аполлона в Дафні як передмістям. Вона стала столицею Селевкідських царів і виросла в місто з чотирьох мурованих кварталів."
    - "Коли Помпей у 64 р. до н. е. зробив Сирію римською провінцією, Антіохія стала резиденцією її намісника. Ірод Великий вимостив її головну вулицю і обрамив колонадами. Йосиф Флавій вважає її третім містом римського світу, і в ній була велика юдейська громада."
    - "У Діях віруючі, розсіяні після смерті Стефана, проповідували еллінам в Антіохії. Єрусалим послав Варнаву, який привів Савла з Тарса, і тут учні вперше названі християнами; коли Агав провістив голод, церква послала допомогу Юдеї. Церква послала Варнаву й Савла в першу подорож і прийняла їх назад. Суперечка про обрізання привела Павла й Варнаву до Єрусалима, і вони повернулися з листом апостолів. Павло протистояв Петрові в Антіохії, і звідси він вирушав у пізніші подорожі."
    - "Її єпископа Ігнатія було відвезено до Рима за Траяна, і він писав листи церквам дорогою. Траян був у місті, коли в 115 р. н. е. стався великий землетрус. Костянтин почав будувати восьмикутну Велику церкву, а його син Констанцій закінчив; її освятили в 341 році на соборі, що там відбувся. Юліан провів зиму 362–363 рр. в Антіохії й посварився з її мешканцями. Лібаній викладав там риторику, а Іван Золотоуст проповідував там від 386 року, поки не став єпископом Константинополя в 398 році."
  es:
    - "Antioquía se halla a orillas del Orontes, en el norte de Siria, a unos 25 km del mar, entre el río y el monte Silpio; hoy es Antakya, en Turquía. Seleuco I Nicátor la fundó en 300 a. C. y le puso el nombre de su padre Antíoco, con Seleucia de Pieria como puerto y el bosque de Apolo en Dafne como arrabal. Se convirtió en la capital de los reyes seléucidas y creció hasta ser una ciudad de cuatro barrios amurallados."
    - "Cuando Pompeyo hizo de Siria una provincia romana en 64 a. C., Antioquía pasó a ser la sede de su gobernador. Herodes el Grande pavimentó su calle principal y la bordeó de columnatas. Josefo la cuenta como la tercera ciudad del mundo romano, y tenía una numerosa comunidad judía."
    - "En los Hechos, los creyentes dispersados tras la muerte de Esteban predicaron a los griegos en Antioquía. Jerusalén envió a Bernabé, que trajo a Saulo desde Tarso, y aquí los discípulos fueron llamados cristianos por primera vez; cuando Agabo predijo una hambruna, la iglesia envió socorro a Judea. La iglesia envió a Bernabé y a Saulo en su primer viaje y los recibió de vuelta. Una disputa sobre la circuncisión llevó a Pablo y a Bernabé a Jerusalén, y regresaron con la carta de los apóstoles. Pablo se enfrentó a Pedro en Antioquía, y de aquí partió para sus viajes posteriores."
    - "Su obispo Ignacio fue llevado a Roma bajo Trajano y escribió cartas a las iglesias por el camino. Trajano estaba en la ciudad cuando un gran terremoto la sacudió en 115 d. C. Constantino comenzó la Gran Iglesia octogonal, y su hijo Constancio la terminó; fue dedicada en 341 en un concilio celebrado allí. Juliano pasó el invierno de 362–363 en Antioquía y se enemistó con sus habitantes. Libanio enseñó allí retórica, y Juan Crisóstomo predicó allí desde 386 hasta que fue nombrado obispo de Constantinopla en 398."
  pt:
    - "Antioquia fica no Orontes, no norte da Síria, a cerca de 25 km do mar, entre o rio e o monte Sílpio; hoje é Antakya, na Turquia. Seleuco I Nicátor a fundou em 300 a.C. e lhe deu o nome de seu pai Antíoco, com Selêucia de Piéria como porto e o bosque de Apolo em Dafne como subúrbio. Tornou-se a capital dos reis selêucidas e cresceu até ser uma cidade de quatro bairros murados."
    - "Quando Pompeu fez da Síria uma província romana em 64 a.C., Antioquia tornou-se a sede de seu governador. Herodes, o Grande, pavimentou a sua rua principal e a ladeou de colunatas. Josefo a conta como a terceira cidade do mundo romano, e ela tinha uma grande comunidade judaica."
    - "Em Atos, os crentes dispersos após a morte de Estêvão pregaram aos gregos em Antioquia. Jerusalém enviou Barnabé, que trouxe Saulo de Tarso, e aqui os discípulos foram chamados cristãos pela primeira vez; quando Ágabo predisse uma fome, a igreja enviou socorro à Judeia. A igreja enviou Barnabé e Saulo na primeira viagem e os recebeu de volta. Uma disputa sobre a circuncisão levou Paulo e Barnabé a Jerusalém, e eles voltaram com a carta dos apóstolos. Paulo resistiu a Pedro em Antioquia, e daqui partiu para as viagens seguintes."
    - "Seu bispo Inácio foi levado a Roma sob Trajano e escreveu cartas às igrejas pelo caminho. Trajano estava na cidade quando um grande terremoto a atingiu em 115 d.C. Constantino começou a Grande Igreja octogonal, e seu filho Constâncio a terminou; foi dedicada em 341 num concílio ali realizado. Juliano passou o inverno de 362–363 em Antioquia e brigou com o seu povo. Libânio ensinou retórica ali, e João Crisóstomo pregou ali de 386 até se tornar bispo de Constantinopla em 398."
  de:
    - "Antiochia liegt am Orontes in Nordsyrien, etwa 25 km vom Meer, zwischen dem Fluss und dem Berg Silpios; heute ist es Antakya in der Türkei. Seleukos I. Nikator gründete es 300 v. Chr. und benannte es nach seinem Vater Antiochos, mit Seleukia Pieria als Hafen und dem Hain des Apollon in Daphne als Vorort. Es wurde Hauptstadt der seleukidischen Könige und wuchs zu einer Stadt mit vier ummauerten Vierteln."
    - "Als Pompeius 64 v. Chr. Syrien zur römischen Provinz machte, wurde Antiochia Sitz ihres Statthalters. Herodes der Große pflasterte seine Hauptstraße und säumte sie mit Säulenhallen. Josephus zählt es als dritte Stadt der römischen Welt, und es hatte eine große jüdische Gemeinde."
    - "In der Apostelgeschichte predigten die nach dem Tod des Stephanus zerstreuten Gläubigen in Antiochia den Griechen. Jerusalem sandte Barnabas, der Saulus aus Tarsus holte, und hier wurden die Jünger zuerst Christen genannt; als Agabus eine Hungersnot voraussagte, schickte die Gemeinde Hilfe nach Judäa. Die Gemeinde sandte Barnabas und Saulus auf ihre erste Reise und nahm sie wieder auf. Ein Streit über die Beschneidung führte Paulus und Barnabas nach Jerusalem, und sie kehrten mit dem Brief der Apostel zurück. Paulus widerstand Petrus in Antiochia, und von hier brach er zu seinen späteren Reisen auf."
    - "Sein Bischof Ignatius wurde unter Trajan nach Rom gebracht und schrieb unterwegs Briefe an die Gemeinden. Trajan war in der Stadt, als 115 n. Chr. ein großes Erdbeben sie traf. Konstantin begann die achteckige Große Kirche, sein Sohn Konstantius vollendete sie; sie wurde 341 auf einem dort abgehaltenen Konzil geweiht. Julian verbrachte den Winter 362–363 in Antiochia und lag mit seinen Bürgern im Streit. Libanios lehrte dort Rhetorik, und Johannes Chrysostomus predigte dort von 386 bis zu seiner Erhebung zum Bischof von Konstantinopel 398."
  fr:
    - "Antioche se trouve sur l’Oronte, dans le nord de la Syrie, à environ 25 km de la mer, entre le fleuve et le mont Silpius ; c’est aujourd’hui Antakya, en Turquie. Séleucos Ier Nicator la fonda en 300 av. J.-C. et lui donna le nom de son père Antiochos, avec Séleucie de Piérie pour port et le bois d’Apollon à Daphné pour faubourg. Elle devint la capitale des rois séleucides et grandit jusqu’à former une ville de quatre quartiers fortifiés."
    - "Quand Pompée fit de la Syrie une province romaine en 64 av. J.-C., Antioche devint le siège de son gouverneur. Hérode le Grand pava sa rue principale et la borda de colonnades. Josèphe la compte pour la troisième ville du monde romain, et elle abritait une importante communauté juive."
    - "Dans les Actes, des croyants dispersés après la mort d’Étienne prêchèrent à des Grecs à Antioche. Jérusalem y envoya Barnabas, qui alla chercher Saül à Tarse, et c’est là que les disciples furent appelés chrétiens pour la première fois ; quand Agabus annonça une famine, l’Église envoya des secours en Judée. L’Église envoya Barnabas et Saül pour leur premier voyage et les reçut à leur retour. Une dispute sur la circoncision conduisit Paul et Barnabas à Jérusalem, d’où ils revinrent avec la lettre des apôtres. Paul résista à Pierre à Antioche, et c’est de là qu’il partit pour ses voyages ultérieurs."
    - "Son évêque Ignace fut emmené à Rome sous Trajan et écrivit des lettres aux Églises en chemin. Trajan était dans la ville lors du grand tremblement de terre de 115 apr. J.-C. Constantin commença la Grande Église octogonale, que son fils Constance acheva ; elle fut dédiée en 341 lors d’un concile tenu sur place. Julien passa l’hiver 362-363 à Antioche et se brouilla avec ses habitants. Libanios y enseigna la rhétorique, et Jean Chrysostome y prêcha de 386 jusqu’à ce qu’il devînt évêque de Constantinople en 398."
  it:
    - "Antiochia si trova sull’Oronte, nella Siria settentrionale, a circa 25 km dal mare, tra il fiume e il monte Silpio; oggi è Antakya, in Turchia. Seleuco I Nicatore la fondò nel 300 a.C. e le diede il nome del padre Antioco, con Seleucia di Pieria come porto e il bosco di Apollo a Dafne come sobborgo. Divenne la capitale dei re seleucidi e crebbe fino a essere una città di quattro quartieri fortificati."
    - "Quando Pompeo fece della Siria una provincia romana nel 64 a.C., Antiochia divenne la sede del suo governatore. Erode il Grande lastricò la sua via principale e la fiancheggiò di colonnati. Flavio Giuseppe la conta come la terza città del mondo romano, e vi era una numerosa comunità giudaica."
    - "Negli Atti, i credenti dispersi dopo la morte di Stefano predicarono ai Greci ad Antiochia. Gerusalemme mandò Barnaba, che condusse Saulo da Tarso, e qui i discepoli furono chiamati per la prima volta cristiani; quando Agabo predisse una carestia, la chiesa mandò soccorsi in Giudea. La chiesa mandò Barnaba e Saulo nel loro primo viaggio e li riaccolse. Una disputa sulla circoncisione condusse Paolo e Barnaba a Gerusalemme, ed essi tornarono con la lettera degli apostoli. Paolo resistette a Pietro ad Antiochia, e da qui partì per i suoi viaggi successivi."
    - "Il suo vescovo Ignazio fu condotto a Roma sotto Traiano e scrisse lettere alle chiese lungo il cammino. Traiano era in città quando un grande terremoto la colpì nel 115 d.C. Costantino iniziò la Grande Chiesa ottagonale, e suo figlio Costanzo la terminò; fu dedicata nel 341 durante un concilio tenuto lì. Giuliano trascorse l’inverno del 362–363 ad Antiochia e litigò con i suoi abitanti. Libanio vi insegnò retorica, e Giovanni Crisostomo vi predicò dal 386 fino a diventare vescovo di Costantinopoli nel 398."
  pl:
    - "Antiochia leży nad Orontesem w północnej Syrii, około 25 km od morza, między rzeką a górą Silpios; dziś jest to Antakya w Turcji. Założył ją w 300 r. p.n.e. Seleukos I Nikator i nazwał od imienia swego ojca Antiocha; jej portem była Seleucja Pieria, a przedmieściem gaj Apolla w Dafne. Stała się stolicą królów Seleucydów i rozrosła się w miasto o czterech obwarowanych dzielnicach."
    - "Gdy Pompejusz w 64 r. p.n.e. uczynił z Syrii rzymską prowincję, Antiochia stała się siedzibą jej namiestnika. Herod Wielki wybrukował jej główną ulicę i obsadził ją kolumnadami. Józef Flawiusz uważa ją za trzecie miasto świata rzymskiego, a mieszkała tam liczna społeczność żydowska."
    - "W Dziejach wierzący rozproszeni po śmierci Szczepana głosili Grekom w Antiochii. Jerozolima posłała Barnabę, który sprowadził Saula z Tarsu, i tu uczniowie po raz pierwszy zostali nazwani chrześcijanami; gdy Agabos zapowiedział głód, wspólnota posłała pomoc do Judei. Wspólnota wysłała Barnabę i Saula w ich pierwszą podróż i przyjęła ich z powrotem. Spór o obrzezanie zawiódł Pawła i Barnabę do Jerozolimy, a wrócili z listem apostołów. Paweł sprzeciwił się Piotrowi w Antiochii i stąd wyruszał w późniejsze podróże."
    - "Jej biskup Ignacy został zawleczony do Rzymu za Trajana i pisał w drodze listy do kościołów. Trajan przebywał w mieście, gdy w 115 r. n.e. nawiedziło je wielkie trzęsienie ziemi. Konstantyn rozpoczął ośmioboczny Wielki Kościół, a jego syn Konstancjusz go dokończył; poświęcono go w 341 roku na odbywającym się tam soborze. Julian spędził zimę 362–363 w Antiochii i pokłócił się z jej mieszkańcami. Libaniusz nauczał tam retoryki, a Jan Chryzostom głosił tam kazania od 386 roku, aż w 398 został biskupem Konstantynopola."
  nl:
    - "Antiochië ligt aan de Orontes in Noord-Syrië, ongeveer 25 km van de zee, tussen de rivier en de berg Silpius; tegenwoordig is het Antakya in Turkije. Seleucus I Nicator stichtte het in 300 v.Chr. en noemde het naar zijn vader Antiochus, met Seleucië Pieria als haven en het bos van Apollo te Daphne als voorstad. Het werd de hoofdstad van de Seleucidische koningen en groeide uit tot een stad met vier ommuurde wijken."
    - "Toen Pompeius in 64 v.Chr. van Syrië een Romeinse provincie maakte, werd Antiochië de zetel van haar landvoogd. Herodes de Grote liet de hoofdstraat plaveien en met zuilengalerijen omzomen. Josephus rekent het tot de derde stad van de Romeinse wereld, en er woonde een grote Joodse gemeenschap."
    - "In Handelingen predikten gelovigen die na Stefanus’ dood waren verspreid, tot Grieken te Antiochië. Jeruzalem zond Barnabas, die Saulus uit Tarsus haalde, en hier werden de discipelen het eerst christenen genoemd; toen Agabus een hongersnood voorspelde, zond de gemeente hulp naar Judea. De gemeente zond Barnabas en Saulus op hun eerste reis en ontving hen terug. Een geschil over de besnijdenis bracht Paulus en Barnabas naar Jeruzalem, en zij keerden terug met de brief van de apostelen. Paulus weerstond Petrus te Antiochië, en van hier trok hij uit op zijn latere reizen."
    - "Zijn bisschop Ignatius werd onder Trajanus naar Rome gebracht en schreef onderweg brieven aan de gemeenten. Trajanus was in de stad toen in 115 n.Chr. een zware aardbeving toesloeg. Constantijn begon de achthoekige Grote Kerk en zijn zoon Constantius voltooide haar; zij werd in 341 ingewijd op een daar gehouden concilie. Julianus bracht de winter van 362–363 in Antiochië door en kreeg ruzie met de bevolking. Libanius gaf er retorica, en Johannes Chrysostomus preekte er vanaf 386 tot hij in 398 bisschop van Constantinopel werd."
  cs:
    - "Antiochie leží na Orontu v severní Sýrii, asi 25 km od moře, mezi řekou a horou Silpios; dnes je to Antakya v Turecku. Založil ji roku 300 př. n. l. Seleukos I. Níkátór a pojmenoval ji podle svého otce Antiocha, s Seleukeií Pierií jako přístavem a Apollónovým hájem v Dafné jako předměstím. Stala se hlavním městem seleukovských králů a vyrostla ve město o čtyřech opevněných čtvrtích."
    - "Když Pompeius roku 64 př. n. l. učinil ze Sýrie římskou provincii, stala se Antiochie sídlem jejího správce. Herodes Veliký vydláždil její hlavní ulici a lemoval ji sloupořadími. Josephus Flavius ji počítá za třetí město římského světa a měla velkou židovskou obec."
    - "Ve Skutcích věřící rozptýlení po Štěpánově smrti kázali v Antiochii Řekům. Jeruzalém poslal Barnabáše, který přivedl Saula z Tarsu, a zde byli učedníci poprvé nazváni křesťany; když Agabos předpověděl hladomor, církev poslala pomoc do Judska. Církev vyslala Barnabáše a Saula na první cestu a přijala je zpět. Spor o obřízku zavedl Pavla a Barnabáše do Jeruzaléma a vrátili se s listem apoštolů. Pavel se v Antiochii postavil proti Petrovi a odtud se vydal na své pozdější cesty."
    - "Její biskup Ignác byl za Traiana odveden do Říma a cestou psal církvím listy. Traianus byl ve městě, když roku 115 n. l. udeřilo velké zemětřesení. Konstantin zahájil osmiúhelníkový Velký kostel a jeho syn Constantius jej dokončil; byl vysvěcen roku 341 na tamním koncilu. Julianus strávil zimu 362–363 v Antiochii a pohádal se s jejími obyvateli. Libanios tam vyučoval rétoriku a Jan Zlatoústý tam kázal od roku 386, dokud se roku 398 nestal biskupem v Konstantinopoli."
