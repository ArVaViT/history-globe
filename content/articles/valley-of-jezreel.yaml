# Overview article (ADR 0007). Mainstream facts only; the valley, not the town of Jezreel, which has its own article.
id: valley-of-jezreel
place: aa516c2
title:
  en: "Valley of Jezreel"
  ru: "Долина Изреельская"
  uk: "Долина Їзреель"
  es: "Valle de Jezreel"
  pt: "Vale de Jezreel"
  de: "Jesreel-Ebene"
  fr: "Vallée de Jizreel"
  pl: "Dolina Jizreel"
  it: "Valle di Izreel"
  nl: "Vlakte van Jizreël"
  cs: "Jizre'elské údolí"
  sv: "Jisreels dal"
body:
  en:
    - "The valley of Jezreel is the great plain that cuts across northern Israel from Mount Carmel and the bay of Haifa to the Jordan at Beth-shean, between the hills of Galilee on the north and Samaria and Gilboa on the south. The Greeks called its western part Esdraelon, after the town of Jezreel at its eastern end. The Kishon drains it to the sea and the Harod, from the spring under Gilboa, to the Jordan. It was the crossroads of the country: the coast road from Egypt to Damascus climbed into it through the pass at Megiddo, and whoever held the plain held the way north."
    - "In the Bible it is a battlefield. The sons of Joseph complained that “all the Canaanites that dwell in the land of the valley have chariots of iron”, at Beth-shean and “in the valley of Jezreel”; Deborah and Barak broke Sisera's chariots at the Kishon; the Midianites “pitched in the valley of Jezreel” and Gideon's three hundred routed them from the spring of Harod. Saul and his sons died on Gilboa, and the Israelites “on the other side of the valley” fled from their towns. Ahab's winter capital was at Jezreel, with Naboth's vineyard; there Jehu killed Joram and Jezebel. Hosea named his son Jezreel and foretold that the Lord would “break the bow of Israel in the valley of Jezreel”, which came true when Jehu's line ended. Josiah fell at Megiddo in 609 BC, and Revelation gathers the kings of the earth at Armageddon, the mountain of Megiddo."
    - "The plain has been fought over ever since: Thutmose III won it at Megiddo about 1457 BC, the earliest battle recorded in detail; the Mamluks beat the Mongols at Ain Jalut, the spring of Harod, in 1260; Napoleon's troops fought at Mount Tabor in 1799, and Allenby, who took the title Viscount of Megiddo, broke the Ottoman front here in 1918. Tells of the ancient towns stand all along it: Megiddo, Taanach, Jezreel, Beth-shean, Yoqne'am, Shimron."
    - "In the nineteenth century the valley was largely malarial marsh owned by absentee landlords. Zionist land companies bought much of it from the Sursock family from 1921 on, the swamps were drained, and Nahalal and Ein Harod were founded that year; today the Emek, with Afula at its centre, is Israel's richest farmland, and Megiddo is a World Heritage site."
  ru:
    - "Долина Изреельская — большая равнина, пересекающая север Израиля от горы Кармил и Хайфского залива до Иордана у Беф-Сана, между холмами Галилеи на севере и Самарией и Гелвуем на юге. Греки называли её западную часть Ездрилоном, по городу Изреель у её восточного конца. Киссон уносит её воды к морю, а Харод, от источника под Гелвуем, — к Иордану. Это был перекрёсток страны: приморская дорога из Египта в Дамаск поднималась в неё через проход у Мегиддона, и кто держал равнину, тот держал путь на север."
    - "В Библии это поле битв. Сыны Иосифа жаловались, что «железные колесницы у всех Хананеев, живущих на долине», в Беф-Сане и «на долине Изреельской»; Девора и Варак сокрушили колесницы Сисары у Киссона; Мадианитяне «стали станом на долине Изреельской», и триста воинов Гедеона обратили их в бегство от источника Харод. Саул и его сыновья погибли на Гелвуе, и Израильтяне, «жившие на стороне долины», бежали из своих городов. Зимняя столица Ахава была в Изрееле, с виноградником Навуфея; там Ииуй убил Иорама и Иезавель. Осия назвал сына Изреелем и предрёк, что Господь сокрушит «лук Израилев в долине Изреель», что сбылось, когда пресёкся род Ииуя. Иосия пал при Мегиддоне в 609 г. до н. э., а Откровение собирает царей земли при Армагеддоне, горе Мегиддо."
    - "За равнину сражались и после: Тутмос III выиграл её при Мегиддоне около 1457 г. до н. э. — в первой битве, описанной подробно; мамлюки разбили монголов при Айн-Джалуте, источнике Харод, в 1260 году; войска Наполеона бились у горы Фавор в 1799-м, а Алленби, получивший титул виконта Мегиддо, прорвал здесь османский фронт в 1918-м. Холмы древних городов стоят вдоль всей долины: Мегиддон, Фаанах, Изреель, Беф-Сан, Иокнеам, Шимрон."
    - "В XIX веке долина была по большей части малярийным болотом во владении отсутствующих хозяев. Сионистские земельные компании с 1921 года скупили значительную её часть у семьи Сурсук, болота осушили, и в тот же год основали Нахалаль и Эйн-Харод; сегодня Эмек с Афулой посередине — богатейшие сельские земли Израиля, а Мегиддон — объект Всемирного наследия."
  uk:
    - "Долина Їзреель — велика рівнина, що перетинає північ Ізраїлю від гори Кармель і затоки Хайфи до Йордану в Бет-Шеані, між пагорбами Галілеї на півночі та Самарією й Гільбоа на півдні. Греки називали її західну частину Ездрелоном, за містом Їзреель на її східному кінці. Кішон відводить її води до моря, а Харод, з джерела під Гільбоа, до Йордану. Це було роздоріжжя краю: прибережна дорога з Єгипту до Дамаска входила в неї через прохід у Мегіддо, і хто тримав рівнину, тримав шлях на північ."
    - "У Біблії це поле битв. Сини Йосипа скаржилися, що «в усїх Канааніїв, що живуть на поділлї, є залїзні боєві колесницї» — у Бет-Шеані й «на Езреель-долинї»; Дебора й Варак розбили колісниці Сісари біля Кішону; мадіамляни «отаборились на Езреель-долинї», і триста Гедеона розбили їх від джерела Харод. Саул і його сини загинули на Гільбоа, а ізраїльтяни «по тім боцї долини» полишили свої міста й утекли. Зимова столиця Ахава була в Їзреелі, з виноградником Навуфея; там Єгу вбив Йорама і Єзавель. Осія назвав сина Їзреелем і передрік, що Господь «поломлю лука Ізрайлевого на Езреель-долинї», що збулося, коли рід Єгу скінчився. Йосія упав у Мегіддо 609 р. до н. е., а Одкровення збирає царів землі в Армагеддоні, горі Мегіддо."
    - "Відтоді за рівнину воювали постійно: Тутмос III виграв її в Мегіддо близько 1457 р. до н. е., найдавнішу докладно записану битву; мамлюки розбили монголів при Айн-Джалуті, джерелі Харод, 1260 року; війська Наполеона билися біля гори Фавор 1799 року, а Алленбі, який узяв титул віконта Мегіддо, прорвав османський фронт тут 1918 року. Телі давніх міст стоять уздовж неї: Мегіддо, Таанах, Їзреель, Бет-Шеан, Йокнеам, Шімрон."
    - "У XIX столітті долина була здебільшого малярійним болотом у власності відсутніх землевласників. Сіоністські земельні компанії від 1921 року скупили значну її частину в родини Сурсок, болота осушили, і того року заснували Нагалал і Ейн-Харод; нині Емек з Афулою в центрі — найбагатші сільськогосподарські угіддя Ізраїлю, а Мегіддо — об’єкт Світової спадщини."
  es:
    - "El valle de Jezreel es la gran llanura que corta el norte de Israel desde el monte Carmelo y la bahía de Haifa hasta el Jordán en Betsán, entre las colinas de Galilea al norte y Samaria y Gilboa al sur. Los griegos llamaban a su parte occidental Esdrelón, por la ciudad de Jezreel en su extremo oriental. El Cisón la drena hacia el mar y el Harod, desde la fuente bajo Gilboa, hacia el Jordán. Era la encrucijada del país: el camino de la costa, de Egipto a Damasco, subía a ella por el paso de Meguido, y quien tenía la llanura tenía el camino al norte."
    - "En la Biblia es un campo de batalla. Los hijos de José se quejaron de que «todos los Cananeos que habitan la tierra de la campiña, tienen carros herrados», en Betsán y «en el valle de Jezreel»; Débora y Barac deshicieron los carros de Sísara en el Cisón; los madianitas «asentaron campo en el valle de Jezreel» y los trescientos de Gedeón los pusieron en fuga desde la fuente de Harod. Saúl y sus hijos murieron en Gilboa, y los israelitas «de la otra parte del valle» huyeron de sus ciudades. La capital de invierno de Acab estaba en Jezreel, con la viña de Nabot; allí Jehú mató a Joram y Jezabel. Oseas llamó Jezreel a su hijo y anunció, en nombre del Señor: «quebraré yo el arco de Israel en el valle de Jezreel», cumplido al acabar la dinastía de Jehú. Josías cayó en Meguido en 609 a. C., y el Apocalipsis reúne a los reyes de la tierra en Armagedón, el monte de Meguido."
    - "La llanura ha sido disputada desde entonces: Tutmosis III la ganó en Meguido hacia 1457 a. C., la batalla más antigua registrada con detalle; los mamelucos vencieron a los mongoles en Ain Jalut, la fuente de Harod, en 1260; las tropas de Napoleón combatieron en el monte Tabor en 1799, y Allenby, que tomó el título de vizconde de Meguido, rompió aquí el frente otomano en 1918. Tells de las antiguas ciudades se alzan a lo largo de ella: Meguido, Taanac, Jezreel, Betsán, Yoqne'am, Simrón."
    - "En el siglo XIX el valle era en gran parte una marisma palúdica propiedad de terratenientes ausentes. Compañías sionistas de tierras compraron buena parte a la familia Sursock a partir de 1921, se drenaron los pantanos y ese año se fundaron Nahalal y Ein Harod; hoy el Emek, con Afula en su centro, es la tierra de labor más rica de Israel, y Meguido es Patrimonio Mundial."
  pt:
    - "O vale de Jezreel é a grande planície que corta o norte de Israel, do Monte Carmelo e da baía de Haifa ao Jordão, em Bete-Seã, entre as colinas da Galileia ao norte e Samaria e Gilboa ao sul. Os gregos chamavam sua parte ocidental Esdrelom, da cidade de Jezreel em sua extremidade oriental. O Quisom a drena para o mar e o Harode, da fonte sob Gilboa, para o Jordão. Era a encruzilhada do país: a estrada costeira do Egito a Damasco subia a ela pela passagem de Megido, e quem detinha a planície detinha o caminho do norte."
    - "Na Bíblia é um campo de batalha. Os filhos de José queixaram-se de que “Todos os cananeus que habitam na terra do vale têm carros de ferro”, em Bete-Seã e “no vale de Jezreel”; Débora e Baraque quebraram os carros de Sísera no Quisom; os midianitas “acamparam no vale de Jezreel” e os trezentos de Gideão os puseram em fuga a partir da fonte de Harode. Saul e seus filhos morreram em Gilboa, e os israelitas “do outro lado do vale” fugiram de suas cidades. A capital de inverno de Acabe era em Jezreel, com a vinha de Nabote; ali Jeú matou Jorão e Jezabel. Oseias deu ao filho o nome de Jezreel e predisse, em nome do Senhor: “quebrarei o arco de Israel no vale de Jezreel”, o que se cumpriu quando acabou a linhagem de Jeú. Josias caiu em Megido em 609 a.C., e o Apocalipse reúne os reis da terra em Armagedom, o monte de Megido."
    - "A planície foi disputada desde então: Tutmés III a ganhou em Megido por volta de 1457 a.C., a batalha mais antiga registrada em detalhe; os mamelucos venceram os mongóis em Ain Jalut, a fonte de Harode, em 1260; as tropas de Napoleão lutaram no Monte Tabor em 1799, e Allenby, que tomou o título de visconde de Megido, rompeu a frente otomana aqui em 1918. Tells de antigas cidades se erguem ao longo dela: Megido, Taanaque, Jezreel, Bete-Seã, Yoqne'am, Sinrom."
    - "No século XIX, o vale era em grande parte pântano malárico pertencente a proprietários ausentes. Companhias sionistas de terras compraram boa parte da família Sursock a partir de 1921, os pântanos foram drenados, e Naalal e Ein Harod foram fundadas nesse ano; hoje o Emek, com Afula no centro, é a terra agrícola mais rica de Israel, e Megido é patrimônio mundial."
  de:
    - "Die Jesreel-Ebene ist die große Ebene, die Nordisrael vom Karmel und der Bucht von Haifa bis zum Jordan bei Bet-Schean durchschneidet, zwischen den Hügeln Galiläas im Norden und Samaria und Gilboa im Süden. Die Griechen nannten ihren westlichen Teil Esdrelon, nach der Stadt Jesreel an ihrem Ostende. Der Kischon entwässert sie zum Meer und der Harod, von der Quelle unter dem Gilboa, zum Jordan. Sie war der Kreuzweg des Landes: Die Küstenstraße von Ägypten nach Damaskus stieg am Pass von Megiddo in sie hinauf, und wer die Ebene hielt, hielt den Weg nach Norden."
    - "In der Bibel ist sie ein Schlachtfeld. Die Söhne Josefs klagten: „es sind eiserne Wagen bei allen Kanaanitern, die im Tal des Landes wohnen: bei denen zu Beth-Sean und seinen zugehörigen Orten und bei denen im Tal Jesreel“; Debora und Barak schlugen Siseras Wagen am Kischon; die Midianiter „lagerten sich im Grunde Jesreel“, und Gideons dreihundert schlugen sie von der Quelle Harod aus in die Flucht. Saul und seine Söhne fielen am Gilboa, und die Israeliten „jenseits des Grundes“ flohen aus ihren Städten. Ahabs Winterhauptstadt war Jesreel, mit Nabots Weinberg; dort tötete Jehu Joram und Isebel. Hosea nannte seinen Sohn Jesreel und sagte voraus, der Herr werde „den Bogen Israels zerbrechen im Tal Jesreel“, was eintraf, als Jehus Linie endete. Josia fiel 609 v. Chr. bei Megiddo, und die Offenbarung versammelt die Könige der Erde in Harmagedon, dem Berg von Megiddo."
    - "Seither wurde um die Ebene gekämpft: Thutmosis III. gewann sie bei Megiddo um 1457 v. Chr., die früheste ausführlich überlieferte Schlacht; die Mamluken schlugen 1260 die Mongolen bei Ain Jalut, der Quelle Harod; Napoleons Truppen kämpften 1799 am Tabor, und Allenby, der den Titel Viscount of Megiddo annahm, durchbrach hier 1918 die osmanische Front. Tells der antiken Städte stehen entlang der ganzen Ebene: Megiddo, Taanach, Jesreel, Bet-Schean, Yoqne'am, Schimron."
    - "Im neunzehnten Jahrhundert war das Tal großenteils malariaverseuchtes Sumpfland in der Hand abwesender Grundherren. Zionistische Landgesellschaften kauften ab 1921 einen großen Teil von der Familie Sursock, die Sümpfe wurden trockengelegt, und Nahalal und Ein Harod wurden in jenem Jahr gegründet; heute ist der Emek mit Afula im Zentrum Israels reichstes Ackerland, und Megiddo ist Weltkulturerbe."
  fr:
    - "La vallée de Jizreel est la grande plaine qui traverse le nord d’Israël du mont Carmel et de la baie de Haïfa au Jourdain à Beth-Schean, entre les collines de Galilée au nord et la Samarie et le Guilboa au sud. Les Grecs appelaient sa partie occidentale Esdrelon, d’après la ville de Jizreel à son extrémité est. Le Kison la draine vers la mer et le Harod, depuis la source sous le Guilboa, vers le Jourdain. C’était le carrefour du pays : la route côtière d’Égypte à Damas y montait par le défilé de Meguiddo, et qui tenait la plaine tenait la route du nord."
    - "Dans la Bible, un champ de bataille. Les fils de Joseph se plaignirent qu’« il y a des chars de fer chez tous les Cananéens qui habitent la vallée », à Beth-Schean et « dans la vallée de Jizreel » ; Débora et Barak brisèrent les chars de Sisera au Kison ; les Madianites « campèrent dans la vallée de Jizréel » et les trois cents de Gédéon les chassèrent depuis la source de Harod. Saül et ses fils moururent sur le Guilboa, et les Israélites « de ce côté de la vallée » abandonnèrent leurs villes. La capitale d’hiver d’Achab était à Jizreel, avec la vigne de Naboth ; là Jéhu tua Joram et Jézabel. Osée nomma son fils Jizreel et annonça : « je briserai l’arc d’Israël dans la vallée de Jizreel », accompli à la fin de la lignée de Jéhu. Josias tomba à Meguiddo en 609 av. J.-C., et l’Apocalypse rassemble les rois de la terre à Armageddon, la montagne de Meguiddo."
    - "La plaine a été disputée depuis : Thoutmosis III la conquit à Meguiddo vers 1457 av. J.-C., la plus ancienne bataille consignée en détail ; les Mamelouks battirent les Mongols à Aïn Jalut, la source de Harod, en 1260 ; les troupes de Napoléon combattirent au mont Thabor en 1799, et Allenby, qui prit le titre de vicomte de Meguiddo, rompit ici le front ottoman en 1918. Des tells des villes antiques s’y alignent : Meguiddo, Thaanac, Jizreel, Beth-Schean, Yoqne’am, Schimron."
    - "Au XIXe siècle, la vallée était en grande partie un marais paludéen appartenant à des propriétaires absents. Des sociétés foncières sionistes en achetèrent une grande partie à la famille Sursock à partir de 1921, les marais furent asséchés, et Nahalal et Ein Harod furent fondés cette année-là ; aujourd’hui l’Emek, avec Afula en son centre, est la plus riche terre agricole d’Israël, et Meguiddo est un site du patrimoine mondial."
  pl:
    - "Dolina Jizreel to wielka równina przecinająca północny Izrael od Karmelu i zatoki Hajfy do Jordanu pod Bet-Szean, między wzgórzami Galilei na północy a Samarią i Gilboa na południu. Grecy nazywali jej zachodnią część Ezdrelon, od miasta Jizreel na jej wschodnim krańcu. Kiszon odprowadza jej wody do morza, a Charod, ze źródła pod Gilboa, do Jordanu. Była skrzyżowaniem dróg kraju: nadmorska droga z Egiptu do Damaszku wspinała się w nią przez przełęcz pod Megiddo, a kto trzymał równinę, trzymał drogę na północ."
    - "W Biblii jest polem bitew. Synowie Józefa skarżyli się, że „wozy żelazne są u wszystkich Chananejczyków, którzy mieszkają w ziemi nadolnej”, w Bet-Szean i u tych, „którzy mieszkają w dolinie Jezreel”; Debora i Barak rozbili wozy Sisery nad Kiszonem; Madianici „położyli się obozem w dolinie Jezreel”, a trzystu ludzi Gedeona rozgromiło ich od źródła Charod. Saul i jego synowie polegli na Gilboa, a Izraelici „którzy za doliną” uciekli ze swoich miast. Zimowa stolica Achaba była w Jizreel, z winnicą Nabota; tam Jehu zabił Jorama i Izebel. Ozeasz nazwał swego syna Jizreel i zapowiedział, że Pan złamie łuk Izraelski „w dolinie Jezreel”, co się spełniło, gdy dynastia Jehu dobiegła końca. Jozjasz poległ pod Megiddo w 609 roku p.n.e., a Apokalipsa zgromadza królów ziemi w Armagedonie, górze Megiddo."
    - "Równina jest od tamtej pory polem walk: Totmes III zwyciężył pod Megiddo około 1457 roku p.n.e., w najwcześniejszej szczegółowo zapisanej bitwie; Mamelucy pokonali Mongołów pod Ajn Dżalut, przy źródle Charod, w 1260 roku; wojska Napoleona walczyły pod Górą Tabor w 1799 roku, a Allenby, który przyjął tytuł wicehrabiego Megiddo, przełamał tu front osmański w 1918 roku. Kopce dawnych miast stoją wzdłuż niej: Megiddo, Taanak, Jizreel, Bet-Szean, Jokneam, Szimron."
    - "W XIX wieku dolina była w dużej mierze malarycznym bagnem należącym do nieobecnych właścicieli. Syjonistyczne spółki ziemskie od 1921 roku kupiły znaczną część od rodziny Sursoków, bagna osuszono, a w tym roku założono Nahalal i Ejn Charod; dziś Emek, z Afulą w centrum, jest najbogatszą ziemią uprawną Izraela, a Megiddo jest miejscem światowego dziedzictwa."
  it:
    - "La valle di Izreel è la grande piana che taglia il nord di Israele dal Monte Carmelo e dalla baia di Haifa al Giordano a Bet-Scean, fra le colline di Galilea a nord e Samaria e Gelboe a sud. I Greci chiamarono la sua parte occidentale Esdrelon, dalla città di Izreel alla sua estremità orientale. Il Kison la drena verso il mare e il Carod, dalla sorgente sotto Gelboe, verso il Giordano. Era il crocevia del paese: la strada costiera dall’Egitto a Damasco vi saliva per il passo di Meghiddo, e chi teneva la piana teneva la via del nord."
    - "Nella Bibbia è un campo di battaglia. I figli di Giuseppe lamentarono che «tutti i Cananei che l’abitano hanno dei carri di ferro», a Bet-Scean e nella valle di Izreel; Debora e Barak spezzarono i carri di Sisara al Kison; i Madianiti «si accamparono nella valle di Izreel» e i trecento di Gedeone li misero in fuga dalla sorgente di Carod. Saul e i suoi figli morirono sul Gelboe, e gli Israeliti «che stavano di là dalla valle» abbandonarono le loro città. La capitale invernale di Acab era a Izreel, con la vigna di Nabot; lì Ieu uccise Ioram e Gezabele. Osea diede al figlio il nome Izreel e predisse, a nome del Signore: «io spezzerò l’arco d’Israele nella valle d’Jizreel», cosa avvenuta quando finì la dinastia di Ieu. Giosia cadde a Meghiddo nel 609 a.C., e l’Apocalisse raduna i re della terra ad Armaghedon, il monte di Meghiddo."
    - "La piana è stata contesa da allora in poi: Tutmosi III la vinse a Meghiddo verso il 1457 a.C., la più antica battaglia registrata nei particolari; i Mamelucchi batterono i Mongoli ad Ain Jalut, la sorgente di Carod, nel 1260; le truppe di Napoleone combatterono al Monte Tabor nel 1799, e Allenby, che prese il titolo di Visconte di Megiddo, sfondò qui il fronte ottomano nel 1918. Tell di antiche città sorgono lungo tutta la piana: Meghiddo, Taanach, Izreel, Bet-Scean, Yoqne’am, Simron."
    - "Nell’Ottocento la valle era in gran parte palude malarica di proprietari assenti. Società fondiarie sioniste ne acquistarono buona parte dalla famiglia Sursock dal 1921 in poi, le paludi furono bonificate, e quell’anno furono fondate Naalal ed Ein Harod; oggi l’Emek, con Afula al centro, è la terra agricola più ricca di Israele, e Meghiddo è patrimonio mondiale."
  nl:
    - "De vallei van Jizreël is de grote vlakte die Noord-Israël doorsnijdt van de berg Karmel en de baai van Haifa tot de Jordaan bij Beth-Sean, tussen de heuvels van Galilea in het noorden en Samaria en Gilboa in het zuiden. De Grieken noemden het westelijke deel Esdraelon, naar de stad Jizreël aan het oostelijke einde. De Kison voert haar af naar de zee en de Charod, vanaf de bron onder Gilboa, naar de Jordaan. Het was het kruispunt van het land: de kustweg van Egypte naar Damascus klom erin door de pas bij Megiddo, en wie de vlakte hield, hield de weg naar het noorden."
    - "In de Bijbel is het een slagveld. De zonen van Jozef klaagden dat “er zijn ook ijzeren wagens bij alle Kanaänieten, die in het land des dals wonen”, bij Beth-Sean en “in het dal van Jizreel”; Debora en Barak braken de wagens van Sisera bij de Kison; de Midianieten “legerden zich in het dal van Jizreel” en Gideons driehonderd sloegen hen op de vlucht vanaf de bron van Charod. Saul en zijn zonen stierven op de Gilboa, en de Israëlieten “die aan deze zijde van het dal waren” vluchtten uit hun steden. Achabs winterhoofdstad was Jizreël, met de wijngaard van Nabot; daar doodde Jehu Joram en Izebel. Hosea noemde zijn zoon Jizreël en voorspelde dat de HEER “Israels boog verbreken zal, in het dal van Jizreel”, wat uitkwam toen het huis van Jehu eindigde. Josia viel bij Megiddo in 609 v.Chr., en Openbaring verzamelt de koningen der aarde bij Armageddon, de berg van Megiddo."
    - "Er is sindsdien steeds om de vlakte gevochten: Thoetmosis III won haar bij Megiddo omstreeks 1457 v.Chr., de oudste in details vastgelegde veldslag; de Mammelukken versloegen de Mongolen bij Ain Jalut, de bron van Charod, in 1260; Napoleons troepen vochten in 1799 bij de berg Tabor, en Allenby, die de titel burggraaf van Megiddo aannam, doorbrak hier in 1918 het Ottomaanse front. Heuvels van de antieke steden staan langs de hele vlakte: Megiddo, Taänach, Jizreël, Beth-Sean, Yoqne’am, Simron."
    - "In de negentiende eeuw was de vallei grotendeels malariamoeras in bezit van afwezige landheren. Zionistische grondmaatschappijen kochten vanaf 1921 een groot deel van de familie Sursock, de moerassen werden drooggelegd, en dat jaar werden Nahalal en Ein Harod gesticht; tegenwoordig is de Emek, met Afula in het centrum, het rijkste landbouwgebied van Israël, en Megiddo is een werelderfgoedlocatie."
  cs:
    - "Jizre'elské údolí je velká rovina, která protíná severní Izrael od hory Karmel a zálivu Haify k Jordánu u Bét-še'anu, mezi galilejskými kopci na severu a Samařím a Gilboa na jihu. Řekové nazývali jeho západní část Esdrelon podle města Jizreel na jeho východním konci. Kíšon je odvodňuje k moři a Charod od pramene pod Gilboa k Jordánu. Bylo křižovatkou země: pobřežní cesta z Egypta do Damašku do něj stoupala průsmykem u Megida a kdo držel rovinu, držel cestu na sever."
    - "V Bibli je bojištěm. Synové Josefovi si stěžovali, že „vozy železné mají všickni Kananejští, kteříž bydlejí v luzích těch“, v Bét-še'anu a „v údolí Jezreel“; Debora a Bárak rozdrtili Siserovy vozy u Kíšonu; Madiánští „položili se v údolí Jezreel“ a Gedeonových tři sta je zahnalo od pramene Charod. Saul a jeho synové zahynuli na Gilboa a Izraelci, „kteříž bydlili za tím údolím“, utíkali ze svých měst. Achabovo zimní hlavní město bylo v Jizreelu, s Nábotovou vinicí; tam Jehú zabil Jorama a Jezábel. Ozeáš pojmenoval svého syna Jizreel a předpověděl, že Pán řekl: „polámi lučiště Izraelovo v údolí Jezreel“, což se splnilo, když skončil Jehúův rod. Jošijáš padl u Megida roku 609 př. n. l. a Zjevení shromažďuje krále země u Armagedonu, hory Megido."
    - "O rovinu se od té doby bojuje: Thutmose III. ji získal u Megida kolem roku 1457 př. n. l., v nejstarší podrobně zaznamenané bitvě; mameluci porazili Mongoly u Ajn Džalút, pramene Charod, roku 1260; Napoleonova vojska bojovala u hory Tábor roku 1799 a Allenby, který přijal titul vikomta z Megida, zde roku 1918 prorazil osmanskou frontu. Telly starověkých měst stojí po celé její délce: Megido, Taanach, Jizreel, Bét-še'an, Jokneam, Šimron."
    - "V 19. století bylo údolí z velké části malarickou bažinou ve vlastnictví absentujících statkářů. Sionistické pozemkové společnosti od roku 1921 koupily velkou část od rodiny Sursocků, bažiny byly odvodněny a téhož roku založeny Nahalal a Ejn Charod; dnes je Emek, s Afulou ve středu, nejbohatší izraelskou zemědělskou půdou a Megido je památkou světového dědictví."
  sv:
    - "Jisreels dal är den stora slätten som skär tvärs över norra Israel från Karmel och Haifabukten till Jordan vid Bet-Shean, mellan Galileens berg i norr och Samarien och Gilboa i söder. Grekerna kallade dess västra del Esdrelon, efter staden Jisreel vid dess östra ände. Kishon dränerar den till havet och Harod, från källan under Gilboa, till Jordan. Den var landets korsväg: kustvägen från Egypten till Damaskus steg in i den genom passet vid Megiddo, och den som höll slätten höll vägen norrut."
    - "I Bibeln är den ett slagfält. Josefs söner klagade över att ”de kananéer som bo i dalbygden hava allasammans stridsvagnar av järn”, både i Bet-Shean och ”i Jisreels dal”; Debora och Barak slog Siseras vagnar vid Kishon; midjaniterna hade ”lägrat sig i Jisreels dal” och Gideons trehundra jagade dem från Harodskällan. Saul och hans söner dog på Gilboa, och israeliterna ”på andra sidan dalen” flydde från sina städer. Achavs vinterhuvudstad låg i Jisreel, med Navots vingård; där dödade Jehu Joram och Isebel. Hosea gav sin son namnet Jisreel och förutsade att Herren skulle ”bryta sönder Israels båge i Jisreels dal”, vilket gick i uppfyllelse när Jehus ätt tog slut. Josia stupade vid Megiddo 609 f.Kr., och Uppenbarelseboken samlar jordens kungar vid Harmagedon, Megiddos berg."
    - "Slätten har det stridits om sedan dess: Thutmosis III vann den vid Megiddo omkring 1457 f.Kr., den tidigaste strid som är utförligt dokumenterad; mamlukerna slog mongolerna vid Ain Jalut, Harods källa, 1260; Napoleons trupper stred vid berget Tabor 1799, och Allenby, som tog titeln viscount av Megiddo, bröt den ottomanska fronten här 1918. Tellerna av de forntida städerna står längs hela den: Megiddo, Taanak, Jisreel, Bet-Shean, Yoqne'am, Shimron."
    - "På 1800-talet var dalen till stor del malariasumpmark ägd av frånvarande godsägare. Sionistiska landbolag köpte stora delar av den av familjen Sursock från 1921, träsken dikades ut, och Nahalal och Ein Harod grundades samma år; i dag är Emek, med Afula i centrum, Israels rikaste jordbruksmark, och Megiddo är ett världsarv."
