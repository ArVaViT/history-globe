# Overview article (ADR 0007). Mainstream facts only; the valley, not the town of Jezreel, which has its own article.
id: valley-of-jezreel
place: aa516c2
title:
  en: "Valley of Jezreel"
  ru: "Долина Изреельская"
body:
  en:
    - "The valley of Jezreel is the great plain that cuts across northern Israel from Mount Carmel and the bay of Haifa to the Jordan at Beth-shean, between the hills of Galilee on the north and Samaria and Gilboa on the south. The Greeks called its western part Esdraelon, after the town of Jezreel at its eastern end. The Kishon drains it to the sea and the Harod, from the spring under Gilboa, to the Jordan. It was the crossroads of the country: the coast road from Egypt to Damascus climbed into it through the pass at Megiddo, and whoever held the plain held the way north."
    - "In the Bible it is a battlefield. The sons of Joseph complained that “all the Canaanites that dwell in the land of the valley have chariots of iron”, at Beth-shean and “in the valley of Jezreel”; Deborah and Barak broke Sisera's chariots at the Kishon; the Midianites “pitched in the valley of Jezreel” and Gideon's three hundred routed them from the spring of Harod. Saul and his sons died on Gilboa, and the Israelites “on the other side of the valley” fled from their towns. Ahab's winter capital was at Jezreel, with Naboth's vineyard; there Jehu killed Joram and Jezebel. Hosea named his son Jezreel and foretold that the Lord would “break the bow of Israel in the valley of Jezreel”, which came true when Jehu's line ended. Josiah fell at Megiddo in 609 BC, and Revelation gathers the kings of the earth at Armageddon, the mountain of Megiddo."
    - "The plain has been fought over ever since: Thutmose III won it at Megiddo about 1457 BC, the earliest battle recorded in detail; the Mamluks beat the Mongols at Ain Jalut, the spring of Harod, in 1260; Napoleon's troops fought at Mount Tabor in 1799, and Allenby, who took the title Viscount of Megiddo, broke the Ottoman front here in 1918. Tells of the ancient towns stand all along it: Megiddo, Taanach, Jezreel, Beth-shean, Yoqne'am, Shimron."
    - "In the nineteenth century the valley was largely malarial marsh owned by absentee landlords. The Jewish National Fund bought most of it from the Sursock family in 1921, the swamps were drained, and Nahalal and Ein Harod were founded that year; today the Emek, with Afula at its centre, is Israel's richest farmland, and Megiddo is a World Heritage site."
  ru:
    - "Долина Изреельская — большая равнина, пересекающая север Израиля от горы Кармил и Хайфского залива до Иордана у Беф-Сана, между холмами Галилеи на севере и Самарией и Гелвуем на юге. Греки называли её западную часть Ездрилоном, по городу Изреель у её восточного конца. Киссон уносит её воды к морю, а Харод, от источника под Гелвуем, — к Иордану. Это был перекрёсток страны: приморская дорога из Египта в Дамаск поднималась в неё через проход у Мегиддона, и кто держал равнину, тот держал путь на север."
    - "В Библии это поле битв. Сыны Иосифа жаловались, что «железные колесницы у всех Хананеев, живущих на долине», в Беф-Сане и «на долине Изреельской»; Девора и Варак сокрушили колесницы Сисары у Киссона; Мадианитяне «стали станом на долине Изреельской», и триста воинов Гедеона обратили их в бегство от источника Харод. Саул и его сыновья погибли на Гелвуе, и Израильтяне, «жившие на стороне долины», бежали из своих городов. Зимняя столица Ахава была в Изрееле, с виноградником Навуфея; там Ииуй убил Иорама и Иезавель. Осия назвал сына Изреелем и предрёк, что Господь сокрушит «лук Израилев в долине Изреель», что сбылось, когда пресёкся род Ииуя. Иосия пал при Мегиддоне в 609 г. до н. э., а Откровение собирает царей земли при Армагеддоне, горе Мегиддо."
    - "За равнину сражались и после: Тутмос III выиграл её при Мегиддоне около 1457 г. до н. э. — в первой битве, описанной подробно; мамлюки разбили монголов при Айн-Джалуте, источнике Харод, в 1260 году; войска Наполеона бились у горы Фавор в 1799-м, а Алленби, получивший титул виконта Мегиддо, прорвал здесь османский фронт в 1918-м. Холмы древних городов стоят вдоль всей долины: Мегиддон, Фаанах, Изреель, Беф-Сан, Иокнеам, Шимрон."
    - "В XIX веке долина была по большей части малярийным болотом во владении отсутствующих хозяев. Еврейский национальный фонд купил большую её часть у семьи Сурсук в 1921 году, болота осушили, и в тот же год основали Нахалаль и Эйн-Харод; сегодня Эмек с Афулой посередине — богатейшие сельские земли Израиля, а Мегиддон — объект Всемирного наследия."
