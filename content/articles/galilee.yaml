body:
  en:
    - 'Galilee is the north of the land west of the Jordan, between the plain of Jezreel and the mountains of Lebanon, bounded on the east by the Sea of Galilee and the upper Jordan. The Hebrew galil means a circle or district; Isaiah calls it "Galilee of the nations", and in Joshua Kedesh "in Galilee in mount Naphtali" is a city of refuge. Upper Galilee is a highland rising to 1,200 m at Mount Meron; Lower Galilee is a country of low ridges and fertile valleys, with Nazareth, Cana and Sepphoris, falling to the lake 210 m below sea level. Josephus praises its rich soil and its many towns and villages.'
    - 'Solomon gave Hiram of Tyre "twenty cities in the land of Galilee". In 733–732 BC Tiglath-pileser III took "Galilee, all the land of Naphtali, and carried them captive to Assyria", and the region was thinly settled for centuries. The Hasmonean kings brought it under Jewish rule late in the second century BC; how many Jews lived there before then is debated, but by the first century Galilee was a Jewish country of villages and synagogues, ruled by Herod Antipas, tetrarch from 4 BC to AD 39, from Sepphoris and then from Tiberias, the city he built about AD 20. Judas of Galilee led a revolt at the census of AD 6.'
    - 'Jesus grew up at Nazareth and, when John was imprisoned, "departed into Galilee" and settled at Capernaum, where Matthew sees Isaiah fulfilled: "Galilee of the Gentiles; The people which sat in darkness saw great light". He "went about all Galilee, teaching in their synagogues", called fishermen on the lake, made water wine at Cana and reproached Chorazin, Bethsaida and Capernaum. In Jerusalem some objected, "Shall Christ come out of Galilee?", and Peter was known by his Galilean speech. Pilate sent Jesus to Herod on learning that he was a Galilean, and after the resurrection the disciples went "into Galilee, into a mountain where Jesus had appointed them".'
    - "In the war of AD 66–67 Josephus commanded Galilee and surrendered to Vespasian at Jotapata. After the revolt of Bar Kokhba the Jewish leadership moved north: the Mishnah was compiled in Galilee about AD 200 and the Jerusalem Talmud mainly at Tiberias, and the synagogues of Capernaum, Chorazin and Baram belong to the following centuries. Galilee is today the Northern District of Israel, with Nazareth, Tiberias, Safed and Acre, home to Jews, Arabs, Druze and the country's largest Christian communities."
  ru:
    - "Галилея — север земли к западу от Иордана, между Изреельской равниной и горами Ливана, с востока ограниченный Галилейским морем и верхним Иорданом. Еврейское «галиль» значит круг или округ; Исаия называет её «Галилея языческая», а в книге Иисуса Навина Кедес «в Галилее на горе Неффалимовой» — город убежища. Верхняя Галилея — нагорье, поднимающееся до 1200 м у горы Мерон; Нижняя — страна невысоких гряд и плодородных долин с Назаретом, Каной и Сепфорисом, спускающаяся к озеру на 210 м ниже уровня моря. Иосиф Флавий хвалит её тучную почву и множество городов и селений."
    - "Соломон дал Хираму Тирскому «двадцать городов в земле Галилейской». В 733–732 гг. до н. э. Феглаффелласар III взял «Галилею, всю землю Неффалимову, и переселил их в Ассирию», и край на века стал малолюдным. Хасмонейские цари подчинили его иудейской власти в конце II века до н. э.; сколько Иудеев жило там прежде — спорно, но к I веку Галилея была иудейской страной селений и синагог, которой Ирод Антипа, четвертовластник с 4 г. до н. э. по 39 г. н. э., правил из Сепфориса, а потом из Тивериады, построенной им около 20 г. н. э. Иуда Галилеянин поднял восстание при переписи 6 г. н. э."
    - "Иисус вырос в Назарете и, когда Иоанн был отдан под стражу, «удалился в Галилею» и поселился в Капернауме, где Матфей видит исполнение слов Исаии: «Галилея языческая, народ, сидящий во тьме, увидел свет великий». Матфей пишет: «И ходил Иисус по всей Галилее, уча в синагогах их»; Он призвал рыбаков на озере, претворил воду в вино в Кане и укорял Хоразин, Вифсаиду и Капернаум. В Иерусалиме иные возражали: «разве из Галилеи Христос придет?», а Петра узнали по галилейскому наречию. Пилат, узнав, что Иисус Галилеянин, послал Его к Ироду, а после воскресения ученики пошли «в Галилею, на гору, куда повелел им Иисус»."
    - "В войну 66–67 гг. н. э. Иосиф Флавий командовал Галилеей и сдался Веспасиану в Иотапате. После восстания Бар-Кохбы иудейское руководство переместилось на север: Мишна была составлена в Галилее около 200 г. н. э., Иерусалимский Талмуд — главным образом в Тивериаде, а синагоги Капернаума, Хоразина и Барама относятся к последующим векам. Сегодня Галилея — Северный округ Израиля с Назаретом, Тивериадой, Цфатом и Акко, где живут евреи, арабы, друзы и самые большие христианские общины страны."
  uk:
    - "Галілея — північ землі на захід від Йордану, між рівниною Їзреель і горами Ліван, обмежена зі сходу Галілейським морем і верхнім Йорданом. Єврейське галіль означає коло або округу; Ісая називає її «Галилею поганську», а в Ісуса Навина Кедес «в Галилеї на Нафталїєвій горі» — місто-захисток. Верхня Галілея — нагір'я, що піднімається до 1200 м на горі Мерон; Нижня Галілея — край низьких хребтів і родючих долин, з Назаретом, Каною та Сепфорісом, що спускається до озера на 210 м нижче рівня моря. Йосиф Флавій хвалить її багатий ґрунт і численні міста та села."
    - "Соломон поступився Хірамові Тирському «двайцятьма городами в Галилейській країнї». У 733–732 рр. до н. е. Тіглатпаласар III узяв «Галаад і Галилею, усю землю Нефталїєву, та й одвів їх в Ассирию», і область століттями була рідко заселена. Хасмонейські царі підпорядкували її юдейській владі наприкінці II ст. до н. е.; скільки юдеїв жило там раніше, є предметом суперечки, але в I ст. Галілея була юдейським краєм сіл і синагог, яким від 4 р. до н. е. до 39 р. н. е. правив тетрарх Ірод Антипа, спершу із Сепфоріса, а потім із Тіверіади, міста, яке він збудував близько 20 р. н. е. Юда Галилейський очолив повстання під час перепису 6 р. н. е."
    - "Ісус виріс у Назареті і, коли Івана було ув'язнено, «перейшов у Галилею» та оселився в Капернаумі, де Матвій бачить виконання Ісаї: «Галилея поганська; люде сидячі в темряві побачили сьвітло велике». Він «ходив … по всїй Галилеї, навчаючи по школах їх», покликав рибалок на озері, перетворив воду на вино в Кані та докорив Хоразинові, Віфсаїді й Капернаумові. В Єрусалимі дехто заперечував: «Чи з Галилеї ж Христу приходити?», а Петра впізнавали з галілейської говірки. Пилат відіслав Ісуса до Ірода, дізнавшись, що Він галілеянин, а після воскресіння учні пішли «в Галилею, на гору, куди повелїв їм Ісус»."
    - "Під час війни 66–67 рр. н. е. Йосиф Флавій командував у Галілеї й здався Веспасіанові в Йотапаті. Після повстання Бар-Кохби юдейське керівництво переселилося на північ: Мішну було складено в Галілеї близько 200 р. н. е., а Єрусалимський Талмуд — переважно в Тіверіаді, і синагоги Капернаума, Хоразина та Барама належать до наступних століть. Галілея сьогодні — Північний округ Ізраїлю, з Назаретом, Тіверіадою, Цфатом та Акко, домівка юдеїв, арабів, друзів і найбільших християнських громад країни."
  es:
    - "Galilea es el norte de la tierra al oeste del Jordán, entre la llanura de Jezreel y las montañas del Líbano, limitada al este por el mar de Galilea y el alto Jordán. El hebreo galil significa círculo o distrito; Isaías la llama «Galilea de las gentes», y en Josué Cedes «en Galilea, en el monte de Nephtalí» es una ciudad de refugio. La Alta Galilea es una región montañosa que se eleva hasta 1200 m en el monte Merón; la Baja Galilea es una tierra de lomas bajas y valles fértiles, con Nazaret, Caná y Séforis, que desciende hasta el lago, a 210 m bajo el nivel del mar. Josefo elogia su rico suelo y sus muchas ciudades y aldeas."
    - "Salomón dio a Hiram de Tiro «veinte ciudades en tierra de Galilea». En 733–732 a. C. Tiglat-pileser III tomó «Galilea, y toda la tierra de Nephtalí; y trasportólos á Asiria», y la región estuvo escasamente poblada durante siglos. Los reyes asmoneos la sometieron al dominio judío a finales del siglo II a. C.; se debate cuántos judíos vivían allí antes, pero en el siglo I Galilea era un país judío de aldeas y sinagogas, gobernado por Herodes Antipas, tetrarca del 4 a. C. al 39 d. C., desde Séforis y luego desde Tiberias, la ciudad que construyó hacia el 20 d. C. Judas el Galileo encabezó una revuelta en el censo del 6 d. C."
    - "Jesús creció en Nazaret y, cuando Juan fue encarcelado, «se volvió á Galilea» y se estableció en Cafarnaúm, donde Mateo ve cumplido a Isaías: «Galilea de los Gentiles; El pueblo asentado en tinieblas, vió gran luz». «Rodeó [...] toda Galilea, enseñando en las sinagogas de ellos», llamó a pescadores en el lago, convirtió el agua en vino en Caná y reprochó a Corazín, Betsaida y Cafarnaúm. En Jerusalén algunos objetaron: «¿De Galilea ha de venir el Cristo?», y Pedro era reconocido por su acento galileo. Pilato envió a Jesús a Herodes al saber que era galileo, y tras la resurrección los discípulos «se fueron á Galilea, al monte donde Jesús les había ordenado»."
    - "En la guerra del 66–67 d. C. Josefo mandó en Galilea y se rindió a Vespasiano en Jotapata. Tras la revuelta de Bar Kojba la dirección judía se trasladó al norte: la Misná se compiló en Galilea hacia el 200 d. C. y el Talmud de Jerusalén sobre todo en Tiberias, y las sinagogas de Cafarnaúm, Corazín y Baram pertenecen a los siglos siguientes. Galilea es hoy el Distrito Norte de Israel, con Nazaret, Tiberias, Safed y Acre, hogar de judíos, árabes, drusos y las mayores comunidades cristianas del país."
  pt:
    - "A Galileia é o norte da terra a oeste do Jordão, entre a planície de Jezreel e as montanhas do Líbano, limitada a leste pelo Mar da Galileia e pelo alto Jordão. O hebraico galil significa círculo ou distrito; Isaías a chama “a Galileia das nações”, e em Josué Quedes “na Galileia, na região montanhosa de Naftali” é uma cidade de refúgio. A Alta Galileia é um planalto que sobe a 1.200 m no monte Meron; a Baixa Galileia é uma região de cristas baixas e vales férteis, com Nazaré, Caná e Séforis, descendo até o lago, 210 m abaixo do nível do mar. Josefo louva seu solo rico e suas muitas cidades e aldeias."
    - "Salomão deu a Hirão de Tiro “vinte cidades na terra da Galileia”. Em 733–732 a.C., Tiglate-Pileser III tomou “a Galileia, toda a terra de Naftali; e os levou cativos para a Assíria”, e a região foi pouco povoada por séculos. Os reis hasmoneus a submeteram ao domínio judeu no fim do século II a.C.; quantos judeus viviam ali antes disso é debatido, mas no século I a Galileia era um país judeu de aldeias e sinagogas, governado por Herodes Antipas, tetrarca de 4 a.C. a 39 d.C., a partir de Séforis e depois de Tiberíades, a cidade que ele construiu por volta de 20 d.C. Judas, o galileu, liderou uma revolta no recenseamento de 6 d.C."
    - "Jesus cresceu em Nazaré e, quando João foi preso, “retirou-se para a Galileia” e se fixou em Cafarnaum, onde Mateus vê Isaías cumprido: “Galileia dos gentios; o povo que estava sentado nas trevas viu uma grande luz”. Ele “percorria toda a Galileia, ensinando nas sinagogas deles”, chamou pescadores no lago, fez da água vinho em Caná e repreendeu Corazim, Betsaida e Cafarnaum. Em Jerusalém alguns objetaram: “Será que o Cristo vem da Galileia?”, e Pedro era conhecido pelo seu falar galileu. Pilatos enviou Jesus a Herodes ao saber que era galileu, e depois da ressurreição os discípulos foram “para a Galileia, para o monte para onde Jesus os havia enviado”."
    - "Na guerra de 66–67 d.C., Josefo comandou a Galileia e se rendeu a Vespasiano em Jotapata. Depois da revolta de Bar Kokhba, a liderança judaica se mudou para o norte: a Mishná foi compilada na Galileia por volta de 200 d.C. e o Talmude de Jerusalém sobretudo em Tiberíades, e as sinagogas de Cafarnaum, Corazim e Baram pertencem aos séculos seguintes. A Galileia é hoje o Distrito Norte de Israel, com Nazaré, Tiberíades, Safed e Acre, lar de judeus, árabes, drusos e das maiores comunidades cristãs do país."
  de:
    - "Galiläa ist der Norden des Landes westlich des Jordan, zwischen der Ebene Jesreel und den Bergen des Libanon, im Osten vom See Genezareth und dem oberen Jordan begrenzt. Das hebräische galil bedeutet Kreis oder Bezirk; Jesaja nennt es „der Heiden Galiläa“, und bei Josua ist Kedes „in Galiläa, auf dem Gebirge Naphthali“ eine Freistadt. Obergaliläa ist ein Hochland, das am Berg Meron bis 1200 m ansteigt; Untergaliläa ist ein Land niedriger Höhenzüge und fruchtbarer Täler, mit Nazareth, Kana und Sepphoris, das zum See 210 m unter dem Meeresspiegel abfällt. Josephus rühmt seinen reichen Boden und seine vielen Städte und Dörfer."
    - "Salomo gab Hiram von Tyrus „zwanzig Städte im Land Galiläa“. In den Jahren 733–732 v. Chr. nahm Tiglat-Pileser III. „Galiläa, das ganze Land Naphthali, und führte sie weg nach Assyrien“, und die Region war jahrhundertelang dünn besiedelt. Die hasmonäischen Könige brachten sie Ende des 2. Jahrhunderts v. Chr. unter jüdische Herrschaft; wie viele Juden dort vorher lebten, ist umstritten, doch im 1. Jahrhundert war Galiläa ein jüdisches Land von Dörfern und Synagogen, regiert von Herodes Antipas, Tetrarch von 4 v. Chr. bis 39 n. Chr., von Sepphoris und dann von Tiberias aus, der Stadt, die er um 20 n. Chr. baute. Judas der Galiläer führte bei der Schätzung des Jahres 6 n. Chr. einen Aufstand an."
    - "Jesus wuchs in Nazareth auf und als Johannes gefangen gesetzt wurde, „zog er in das galiläische Land“ und ließ sich in Kapernaum nieder, wo Matthäus Jesaja erfüllt sieht: „Das Land Sebulon und das Land Naphthali, am Wege des Meeres, jenseit des Jordans, und das heidnische Galiläa, das Volk, das in Finsternis saß, hat ein großes Licht gesehen“. Er „ging umher im ganzen galiläischen Lande, lehrte sie in ihren Schulen“, rief Fischer am See, machte in Kana Wasser zu Wein und tadelte Chorazin, Betsaida und Kapernaum. In Jerusalem wandten manche ein: „Soll Christus aus Galiläa kommen?“, und Petrus war an seiner galiläischen Sprache zu erkennen. Pilatus schickte Jesus zu Herodes, als er erfuhr, dass er ein Galiläer war, und nach der Auferstehung: „Aber die elf Jünger gingen nach Galiläa auf einen Berg, dahin Jesus sie beschieden hatte“."
    - "Im Krieg von 66–67 n. Chr. befehligte Josephus Galiläa und ergab sich bei Jotapata Vespasian. Nach dem Aufstand des Bar Kochba verlagerte sich die jüdische Führung nach Norden: Die Mischna wurde um 200 n. Chr. in Galiläa zusammengestellt und der Jerusalemer Talmud vor allem in Tiberias, und die Synagogen von Kapernaum, Chorazin und Baram gehören in die folgenden Jahrhunderte. Galiläa ist heute der Nordbezirk Israels, mit Nazareth, Tiberias, Safed und Akko, Heimat von Juden, Arabern, Drusen und den größten christlichen Gemeinden des Landes."
  fr:
    - "La Galilée est le nord du pays à l’ouest du Jourdain, entre la plaine de Jizreel et les montagnes du Liban, bornée à l’est par la Mer de Galilée et le haut Jourdain. L’hébreu galil signifie cercle ou district ; Ésaïe l’appelle la Galilée des nations, et chez Josué Kédesch, « en Galilée, dans la montagne de Nephthali », est une ville de refuge. La Haute Galilée est un haut pays qui s’élève à 1 200 m au Mont Méron ; la Basse Galilée est un pays de basses crêtes et de vallées fertiles, avec Nazareth, Cana et Sepphoris, qui descend vers le lac à 210 m sous le niveau de la mer. Josèphe loue son sol riche et ses nombreuses villes et villages."
    - "Salomon donna à Hiram de Tyr « vingt villes dans le pays de Galilée ». En 733–732 av. J.-C., Tiglath-Piléser III prit « la Galilée, tout le pays de Nephthali, et il emmena captifs les habitants en Assyrie », et la région fut peu peuplée pendant des siècles. Les rois hasmonéens la soumirent à la domination juive à la fin du IIe siècle av. J.-C. ; on débat du nombre de Juifs qui y vivaient auparavant, mais au Ier siècle la Galilée était un pays juif de villages et de synagogues, gouverné par Hérode Antipas, tétrarque de 4 av. J.-C. à 39 apr. J.-C., depuis Sepphoris puis depuis Tibériade, la ville qu’il bâtit vers 20 apr. J.-C. Judas le Galiléen mena une révolte lors du recensement de 6 apr. J.-C."
    - "Jésus grandit à Nazareth et, quand Jean fut livré, « se retira dans la Galilée » et s’établit à Capernaüm, où Matthieu voit s’accomplir Ésaïe : « la Galilée des Gentils, ce peuple, assis dans les ténèbres, a vu une grande lumière ». Il « parcourait toute la Galilée, enseignant dans les synagogues », appela des pêcheurs sur le lac, changea l’eau en vin à Cana de Galilée et blâma Chorazin, Bethsaïda et Capernaüm. À Jérusalem, certains objectèrent : « Est-ce bien de la Galilée que doit venir le Christ ? », et Pierre était reconnu à son parler galiléen. Pilate envoya Jésus à Hérode en apprenant qu’il était galiléen, et après la résurrection les disciples « allèrent en Galilée, sur la montagne que Jésus leur avait désignée »."
    - "Pendant la guerre de 66–67 apr. J.-C., Josèphe commanda la Galilée et se rendit à Vespasien à Jotapata. Après la révolte de Bar Kokhba, la direction juive passa au nord : la Michna fut compilée en Galilée vers 200 apr. J.-C. et le Talmud de Jérusalem surtout à Tibériade, et les synagogues de Capernaüm, de Chorazin et de Baram datent des siècles suivants. La Galilée est aujourd’hui le district Nord d’Israël, avec Nazareth, Tibériade, Safed et Acre, foyer de Juifs, d’Arabes, de Druzes et des plus grandes communautés chrétiennes du pays."
  it:
    - "La Galilea è il nord del paese a ovest del Giordano, fra la piana di Izreel e i monti del Libano, delimitata a est dal Lago di Tiberiade e dall’alto Giordano. L’ebraico galil significa cerchio o distretto; Isaia la chiama «la Galilea de’ Gentili», e in Giosuè Kedes «in Galilea nella contrada montuosa di Neftali» è una città di rifugio. L’Alta Galilea è un altopiano che si innalza a 1200 m sul Monte Meron; la Bassa Galilea è un paese di basse dorsali e valli fertili, con Nazaret, Cana e Sefforis, che scende al lago a 210 m sotto il livello del mare. Giuseppe Flavio ne loda il suolo ricco e le molte città e villaggi."
    - "Salomone diede a Chiram di Tiro «venti città nel paese di Galilea». Nel 733–732 a.C. Tiglat-Pilèser III prese «la Galilea, tutto il paese di Neftali, e ne menò gli abitanti in cattività in Assiria», e la regione fu scarsamente popolata per secoli. I re asmonei la portarono sotto il dominio ebraico alla fine del II secolo a.C.; quanti Ebrei vi vivessero prima è dibattuto, ma nel I secolo la Galilea era un paese ebraico di villaggi e sinagoghe, governato da Erode Antipa, tetrarca dal 4 a.C. al 39 d.C., da Sefforis e poi da Tiberiade, la città da lui costruita verso il 20 d.C. Giuda il Galileo guidò una rivolta al censimento del 6 d.C."
    - "Gesù crebbe a Nazaret e, quando Giovanni fu messo in prigione, «si ritirò in Galilea» e si stabilì a Cafarnao, dove Matteo vede adempiersi Isaia: «la Galilea dei Gentili, il popolo che giaceva nelle tenebre, ha veduto una gran luce». Egli «andava attorno per tutta la Galilea, insegnando nelle loro sinagoghe», chiamò pescatori sul lago, mutò l’acqua in vino a Cana e rimproverò Corazin, Betsaida e Cafarnao. A Gerusalemme alcuni obiettarono: «Ma è forse dalla Galilea che viene il Cristo?», e Pietro era riconoscibile dalla parlata galilea. Pilato mandò Gesù a Erode quando seppe che era Galileo, e dopo la risurrezione i discepoli andarono «in Galilea sul monte che Gesù avea loro designato»."
    - "Nella guerra del 66–67 d.C. Giuseppe Flavio comandò la Galilea e si arrese a Vespasiano a Iotapata. Dopo la rivolta di Bar Kokhba la direzione ebraica si spostò a nord: la Mishnah fu compilata in Galilea verso il 200 d.C. e il Talmud di Gerusalemme soprattutto a Tiberiade, e le sinagoghe di Cafarnao, Corazin e Baram appartengono ai secoli seguenti. La Galilea è oggi il Distretto Settentrionale d’Israele, con Nazaret, Tiberiade, Safed e Acri, patria di Ebrei, Arabi, Drusi e delle maggiori comunità cristiane del paese."
  pl:
    - "Galilea to północ ziemi na zachód od Jordanu, między równiną Jizreel a górami Libanu, ograniczona na wschodzie Jeziorem Galilejskim i górnym Jordanem. Hebrajskie galil znaczy krąg lub okręg; Izajasz nadaje jej tytuł: „Galilea poganów”, a w Księdze Jozuego Kedesz „w Galilei na górze Neftali” jest miastem ucieczki. Górna Galilea to wyżyna wznosząca się do 1200 m na górze Meron; Dolna Galilea to kraj niskich grzbietów i żyznych dolin, z Nazaretem, Kaną i Sefforis, opadający ku jezioru 210 m poniżej poziomu morza. Józef Flawiusz chwali jej bogatą ziemię i liczne miasta i wsie."
    - "Salomon dał Hiramowi z Tyru „dwadzieścia miast w ziemi Galilejskiej”. W latach 733–732 p.n.e. Tiglat-Pileser III wziął „Galileę, wszystkę ziemię Neftali, a przeniósł obywatele jej do Assyryi”, a region był przez stulecia słabo zasiedlony. Królowie hasmonejscy podporządkowali go władzy żydowskiej pod koniec II w. p.n.e.; ilu Żydów mieszkało tam wcześniej, jest dyskutowane, lecz w I w. Galilea była żydowskim krajem wsi i synagog, rządzonym przez Heroda Antypasa, tetrarchę od 4 r. p.n.e. do 39 r. n.e., z Sefforis, a potem z Tyberiady, miasta, które zbudował około 20 r. n.e. Juda Galilejczyk poprowadził bunt przy spisie w 6 r. n.e."
    - "Jezus wychował się w Nazarecie i gdy Jan został uwięziony, „wrócił się do Galilei” i osiadł w Kafarnaum, gdzie Mateusz widzi spełnienie Izajasza: „Galilea poganów; Lud, który siedział w ciemności, widział światłość wielką”. Jak czytamy, „obchodził Jezus wszystkę Galileją, ucząc w bóżnicach ich”, powołał rybaków nad jeziorem, w Kanie zamienił wodę w wino i wyrzucał Korozain, Betsaidzie i Kafarnaum. W Jerozolimie niektórzy oponowali: „Azaż z Galilei przyjdzie Chrystus?”, a Piotra poznawano po galilejskiej mowie. Piłat odesłał Jezusa do Heroda, dowiedziawszy się, że jest Galilejczykiem, a po zmartwychwstaniu uczniowie poszli „do Galilei na górę, gdzie im był naznaczył Jezus”."
    - "W wojnie 66–67 r. n.e. Józef Flawiusz dowodził Galileą i poddał się Wespazjanowi w Jotapacie. Po powstaniu Bar Kochby przywództwo żydowskie przeniosło się na północ: Misznę spisano w Galilei około 200 r. n.e., a Talmud jerozolimski głównie w Tyberiadzie, zaś synagogi Kafarnaum, Korozain i Baram należą do następnych stuleci. Galilea to dziś Okręg Północny Izraela, z Nazaretem, Tyberiadą, Safedem i Akką, dom Żydów, Arabów, Druzów i największych chrześcijańskich wspólnot w kraju."
  nl:
    - "Galilea is het noorden van het land ten westen van de Jordaan, tussen de vlakte van Jizreël en het Libanongebergte, in het oosten begrensd door het Meer van Galilea en de bovenloop van de Jordaan. Het Hebreeuwse galil betekent kring of district; Jesaja noemt het “Galilea der heidenen”, en in Jozua is Kedes “in Galilea, op het gebergte van Nafthali” een vrijstad. Boven-Galilea is een hoogland dat bij de berg Meron tot 1200 m stijgt; Neder-Galilea is een land van lage ruggen en vruchtbare dalen, met Nazareth, Kana en Sepforis, dat afdaalt naar het meer 210 m onder zeeniveau. Josephus prijst zijn rijke grond en zijn vele steden en dorpen."
    - "Over Hiram van Tyrus zegt Koningen: “alstoen de koning Salomo aan Hiram twintig steden gaf in het land van Galilea”. In 733–732 v.Chr. nam Tiglat-Pileser III “Galilea, het ganse land van Nafthali; en hij voerde hen weg naar Assyrië”, en de streek was eeuwenlang dun bevolkt. De Hasmonese koningen brachten haar aan het eind van de tweede eeuw v.Chr. onder Joods bewind; hoeveel Joden er daarvoor woonden, is omstreden, maar in de eerste eeuw was Galilea een Joods land van dorpen en synagogen, bestuurd door Herodes Antipas, tetrarch van 4 v.Chr. tot 39 n.Chr., vanuit Sepforis en daarna vanuit Tiberias, de stad die hij omstreeks 20 n.Chr. bouwde. Judas de Galileeër leidde bij de volkstelling van 6 n.Chr. een opstand."
    - "Jezus groeide op te Nazareth en, toen Johannes gevangen was, “is Hij wedergekeerd naar Galilea” en vestigde zich te Kafarnaüm, waar Mattheüs Jesaja vervuld ziet: “Galilea der volken; Het volk, dat in duisternis zat, heeft een groot licht gezien”. Hij “omging geheel Galilea, lerende in hun synagogen”, riep vissers aan het meer, maakte water tot wijn te Kana en verweet Chorazin, Bethsaïda en Kafarnaüm. In Jeruzalem wierpen sommigen tegen: “Zal dan de Christus uit Galilea komen?”, en Petrus werd herkend aan zijn Galilese spraak. Pilatus zond Jezus naar Herodes toen hij vernam dat hij een Galileeër was, en na de opstanding gingen de leerlingen “naar Galilea, naar den berg, waar Jezus hen bescheiden had”."
    - "In de oorlog van 66–67 n.Chr. voerde Josephus het bevel over Galilea en gaf zich bij Jotapata over aan Vespasianus. Na de opstand van Bar Kochba verhuisde de Joodse leiding naar het noorden: de Misjna werd omstreeks 200 n.Chr. in Galilea samengesteld en de Jeruzalemse Talmoed vooral te Tiberias, en de synagogen van Kafarnaüm, Chorazin en Baram horen bij de eeuwen daarna. Galilea is nu het Noordelijk District van Israël, met Nazareth, Tiberias, Safed en Akko, thuis van Joden, Arabieren, Druzen en de grootste christelijke gemeenschappen van het land."
  cs:
    - "Galilea je sever země západně od Jordánu, mezi Jizreelskou rovinou a horami Libanonu, ohraničený na východě Galilejským jezerem a horním Jordánem. Hebrejské galil znamená kruh nebo okres; Izajáš ji nazývá „Galilei lidnou“ a u Jozua je Kedeš „v Galilei na hoře Neftalím“ útočištným městem. Horní Galilea je vysočina dosahující 1200 m na hoře Meron; Dolní Galilea je země nízkých hřbetů a úrodných údolí, s Nazaretem, Kánou a Sepforis, klesající k jezeru 210 m pod hladinou moře. Josephus chválí její bohatou půdu a mnoho měst a vesnic."
    - "Šalomoun dal Chíramovi z Týru „dvadceti měst v zemi Galilejské“. V letech 733–732 př. n. l. Tiglatpilesar III. vzal „Galád a Galilei, i všecku zemi Neftalím, a přenesl obyvatele jejich do Assyrie“ a oblast byla po staletí řídce osídlena. Hasmonejští králové ji podrobili židovské vládě koncem 2. století př. n. l.; kolik Židů tam žilo před tím, je sporné, ale v 1. století byla Galilea židovskou zemí vesnic a synagog, vládl jí Herodes Antipas, tetrarcha od roku 4 př. n. l. do 39 n. l., ze Sepforis a pak z Tiberiady, města, které postavil kolem roku 20 n. l. Juda Galilejský vedl povstání při sčítání roku 6 n. l."
    - "Ježíš vyrostl v Nazaretě a když byl Jan uvězněn, „odšel do Galilee“ a usadil se v Kafarnaum, kde Matouš vidí naplněného Izajáše: „Galilea pohanská, Lid, kterýž bydlil v temnostech, viděl světlo veliké“. Pak, jak se praví, „procházel Ježíš všecku Galilei, uče v shromážděních jejich“, povolal rybáře u jezera, proměnil vodu ve víno v Káně a vyčítal Chorazinu, Betsaidě a Kafarnaum. V Jeruzalémě někteří namítali: „Zdaliž od Galilee přijde Kristus?“ a Petr byl poznán podle galilejské řeči. Pilát poslal Ježíše k Herodovi, když se dozvěděl, že je Galilejský, a po vzkříšení učedníci šli „do Galilee na horu, kdežto jim byl uložil Ježíš“."
    - "Při válce let 66–67 n. l. velel Josephus v Galileji a vzdal se Vespasianovi v Jotapatě. Po Bar Kochbově povstání se židovské vedení přesunulo na sever: Mišna byla sestavena v Galileji kolem roku 200 n. l. a jeruzalémský Talmud hlavně v Tiberiadě a synagogy Kafarnaum, Chorazinu a Baramu patří do následujících staletí. Galilea je dnes Severní okres Izraele s Nazaretem, Tiberiadou, Safedem a Akkem, domovem Židů, Arabů, Drúzů a největších křesťanských komunit země."
  sv:
    - "Galileen är den norra delen av landet väster om Jordan, mellan Jisreelslätten och Libanonbergen, begränsad i öster av Galileiska sjön och övre Jordan. Det hebreiska galil betyder en krets eller ett distrikt; Jesaja talar om ”hedningarnas Galileen”, och hos Josua är Kedesh ”i Galileen, i Naftali bergsbygd” en tillflyktsstad. Övre Galileen är ett högland som stiger till 1 200 m vid berget Meron; nedre Galileen är ett land av låga åsar och bördiga dalar, med Nasaret, Kana och Sepforis, som sluttar ned mot sjön 210 m under havsytan. Josefus prisar dess rika jord och dess många städer och byar."
    - "Salomo gav Hiram av Tyros ”tjugu städer i Galileen”. Åren 733–732 f.Kr. intog Tiglat-Pileser III ”Galileen, hela Naftali land, och förde folket bort till Assyrien”, och trakten var glest befolkad i århundraden. De hasmoneiska kungarna lade den under judiskt styre sent under 100-talet f.Kr.; hur många judar som bodde där dessförinnan är omdebatterat, men på första århundradet var Galileen ett judiskt land med byar och synagogor, styrt av Herodes Antipas, tetrark från 4 f.Kr. till 39 e.Kr., från Sepforis och sedan från Tiberias, staden han byggde omkring år 20 e.Kr. Judas från Galileen ledde ett uppror vid manntalet år 6 e.Kr."
    - "Jesus växte upp i Nasaret, och när Johannes hade satts i fängelse ”drog han sig tillbaka till Galileen”; han bosatte sig i Kafarnaum, där Matteus ser Jesaja uppfyllas: ”hedningarnas Galileen – det folk som där satt i mörker fick se ett stort ljus”. Han ”gick omkring i hela Galileen och undervisade i deras synagogor”, kallade fiskare vid sjön, gjorde vatten till vin i Kana och höll sitt ve över Korasin, Betsaida och Kafarnaum. I Jerusalem invände några: ”Icke kommer väl Messias från Galileen?”, och Petrus avslöjades av sin galileiska dialekt. Pilatus sände Jesus till Herodes när han fick veta att han var galilé, och efter uppståndelsen begav sig lärjungarna ”till det berg i Galileen, dit Jesus hade bjudit dem att gå”."
    - "Under kriget 66–67 e.Kr. ledde Josefus Galileen och kapitulerade inför Vespasianus vid Jotapata. Efter Bar Kokhba-upproret flyttade den judiska ledningen norrut: Mishnan sammanställdes i Galileen omkring år 200 e.Kr. och Jerusalemtalmud huvudsakligen i Tiberias, och synagogorna i Kafarnaum, Korasin och Baram hör till de följande århundradena. Galileen är i dag Israels norra distrikt, med Nasaret, Tiberias, Safed och Akko, hem för judar, araber, drusar och landets största kristna samfund."
  nb:
    - "Galilea er den nordlige delen av landet vest for Jordan, mellom Jisreel-sletten og Libanonfjellene, avgrenset i øst av Galileasjøen og øvre Jordan. Det hebraiske galil betyr en sirkel eller et distrikt; Jesaja kaller det «hedningenes Galilea», og i Josva er «Kedes i Galilea i Naftali-fjellene» en tilfluktsby. Øvre Galilea er et høyland som stiger til 1200 m ved Meron-fjellet; nedre Galilea er et land med lave rygger og fruktbare daler, med Nasaret, Kana og Sepforis, som faller ned til innsjøen 210 m under havet. Josefus priser dens rike jord og dens mange byer og landsbyer."
    - "Salomo ga Hiram av Tyros «tyve byer i Galilea». I 733–732 f.Kr. tok Tiglat-Pileser 3. «Galilea, hele Naftalis land; og han bortførte innbyggerne til Assyria», og området var tynt befolket i århundrer. De hasmoneiske kongene brakte det under jødisk styre sent på 100-tallet f.Kr.; hvor mange jøder som bodde der før den tid, er omdiskutert, men på det første århundre var Galilea et jødisk land av landsbyer og synagoger, styrt av Herodes Antipas, tetrark fra 4 f.Kr. til 39 e.Kr., fra Sepforis og så fra Tiberias, byen han bygde omkring 20 e.Kr. Judas fra Galilea ledet et opprør ved folketellingen i 6 e.Kr."
    - "Jesus vokste opp i Nasaret, og da Johannes ble kastet i fengsel, «drog han bort til Galilea» og slo seg ned i Kapernaum, der Matteus ser Jesaja oppfylt: «hedningenes Galilea, det folk som satt i mørke, har sett et stort lys». Han «gikk omkring i hele Galilea og lærte folket i deres synagoger», kalte fiskere ved innsjøen, gjorde vann til vin i Kana og refset Korasin, Betsaida og Kapernaum. I Jerusalem innvendte noen: «Messias kommer da vel ikke fra Galilea?», og Peter ble gjenkjent på sin galileiske tale. Pilatus sendte Jesus til Herodes da han fikk vite at han var galileer, og etter oppstandelsen «drog» disiplene «til Galilea til det fjell hvor Jesus hadde satt dem stevne»."
    - "I krigen i 66–67 e.Kr. ledet Josefus Galilea og overga seg til Vespasian ved Jotapata. Etter Bar Kokhba-opprøret flyttet den jødiske ledelsen nordover: Mishnaen ble samlet i Galilea omkring 200 e.Kr. og Jerusalem-talmud hovedsakelig i Tiberias, og synagogene i Kapernaum, Korasin og Baram hører til de følgende århundrene. Galilea er i dag Israels Nordlige distrikt, med Nasaret, Tiberias, Safed og Akko, hjem for jøder, arabere, drusere og landets største kristne samfunn."
  tl:
    - "Ang Galilea ay ang hilaga ng lupain sa kanluran ng Jordan, sa pagitan ng kapatagan ng Jezreel at ng mga bundok ng Libano, na may hangganan sa silangan ang Dagat ng Galilea at ang itaas na Jordan. Ang Hebreong galil ay nangangahulugang isang bilog o distrito; tinatawag ito ni Isaias na “Galilea ng mga bansa”, at sa Josue ang Cedes “sa Galilea sa lupaing maburol ng Nepthali” ay isang lungsod-kanlungan. Ang Itaas na Galilea ay isang mataas na lupain na umaabot sa 1,200 m sa Bundok Meron; ang Ibabang Galilea ay isang lupain ng mabababang tagaytay at matatabang libis, na may Nazaret, Cana at Sepphoris, na bumababa sa lawa na 210 m sa ibaba ng antas ng dagat. Pinupuri ni Josephus ang mayamang lupa nito at ang maraming bayan at nayon nito."
    - "Binigyan ni Salomon si Hiram ng Tiro ng “dalawang pung bayan sa lupain ng Galilea”. Noong 733–732 BK sinakop ni Tiglath-pileser III ang “Galilea, ang buong lupain ng Nephtali; at kaniyang dinalang bihag sila sa Asiria”, at kakaunti ang naninirahan sa rehiyon sa loob ng mga siglo. Dinala ito ng mga haring Hasmoneo sa ilalim ng pamamahalang Judio sa huling bahagi ng ika-2 siglo BK; pinagtatalunan kung ilang Judio ang nanirahan doon bago noon, ngunit pagsapit ng ika-1 siglo ang Galilea ay isang bansang Judio ng mga nayon at sinagoga, na pinamahalaan ni Herodes Antipas, tetrarka mula 4 BK hanggang 39 AD, mula sa Sepphoris at pagkatapos ay mula sa Tiberias, ang lungsod na itinayo niya mga 20 AD. Si Judas na taga-Galilea ay namuno sa isang paghihimagsik sa sensus ng 6 AD."
    - "Lumaki si Jesus sa Nazaret at, nang dakpin si Juan, “umuwi siya sa Galilea” at nanirahan sa Capernaum, kung saan nakikita ni Mateo na natupad ang sinabi ni Isaias: “Galilea ng mga Gentil, Ang bayang nalulugmok sa kadiliman, ay Nakakita ng dakilang ilaw”. “Nilibot ni Jesus ang buong Galilea, na nagtuturo sa mga sinagoga nila”, tumawag ng mga mangingisda sa lawa, ginawang alak ang tubig sa Cana at sinaway ang Corazin, Bethsaida at Capernaum. Sa Jerusalem ay tumutol ang ilan, “Ano, sa Galilea baga manggagaling ang Cristo?”, at nakilala si Pedro sa kaniyang pananalitang taga-Galilea. Ipinadala ni Pilato si Jesus kay Herodes nang malaman na siya ay taga-Galilea, at pagkatapos ng pagkabuhay na muli ay “nagsiparoon ang labingisang alagad sa Galilea, sa bundok na sa kanila'y itinuro ni Jesus”."
    - "Sa digmaan ng 66–67 AD pinamunuan ni Josephus ang Galilea at sumuko kay Vespasian sa Jotapata. Pagkatapos ng paghihimagsik ni Bar Kokhba ay lumipat sa hilaga ang pamunuang Judio: ang Mishnah ay binuo sa Galilea mga 200 AD at ang Talmud ng Jerusalem ay higit sa lahat sa Tiberias, at ang mga sinagoga ng Capernaum, Corazin at Baram ay kabilang sa mga sumunod na siglo. Ang Galilea ngayon ay ang Distritong Hilaga ng Israel, na may Nazaret, Tiberias, Safed at Acre, tahanan ng mga Judio, Arabe, Druze at ng pinakamalalaking pamayanang Kristiyano ng bansa."
  da:
    - "Galilæa er den nordlige del af landet vest for Jordan mellem Jizre'el-sletten og Libanons bjerge, afgrænset mod øst af Genesaret Sø og den øvre Jordan. Det hebraiske galil betyder en kreds eller et distrikt; Esajas kalder det »Hedningernes Galilæa«, og hos Josva er »Kedes i Galilæa paa Nafthali Bjerg« en tilflugtsby. Øvre Galilæa er et højland, der stiger til 1.200 m ved Meron-bjerget; Nedre Galilæa er et land af lave højdedrag og frugtbare dale med Nazaret, Kana og Sepphoris, som falder ned til søen 210 m under havets overflade. Josefus roser dets rige jord og dets mange byer og landsbyer."
    - "Salomo gav Hiram af Tyrus »tyve Stæder i Galilæas Land«. I 733–732 f.Kr. tog Tiglat-Pileser III »Galilæa, alt Nafthalis Land, og han bortførte dem til Assyrien«, og regionen var tyndt befolket i århundreder. De hasmonæiske konger bragte den under jødisk styre sent i 2. århundrede f.Kr.; hvor mange jøder der boede der før da, er omstridt, men i 1. århundrede var Galilæa et jødisk land af landsbyer og synagoger, styret af Herodes Antipas, tetrark fra 4 f.Kr. til 39 e.Kr., fra Sepphoris og siden fra Tiberias, den by han byggede omkring 20 e.Kr. Judas fra Galilæa ledede et oprør ved folketællingen i 6 e.Kr."
    - "Jesus voksede op i Nazaret, og da Johannes var kastet i fængsel, »drog han bort til Galilæa« og bosatte sig i Kapernaum, hvor Mattæus ser Esajas opfyldt: »Hedningernes Galilæa, det Folk, som sad i Mørke, har set et stort Lys«. Han »gik omkring i hele Galilæa, idet han lærte i deres Synagoger«, kaldte fiskere ved søen, gjorde vand til vin i Kana og skændte på Korazin, Betsajda og Kapernaum. I Jerusalem indvendte nogle: »Mon da Kristus kommer fra Galilæa?«, og Peter blev kendt på sin galilæiske tale. Pilatus sendte Jesus til Herodes, da han fik at vide, at han var galilæer, og efter opstandelsen »gik« disciplene »til Galilæa, til det Bjerg, hvor Jesus havde sat dem Stævne«."
    - "I krigen 66–67 e.Kr. havde Josefus kommandoen i Galilæa og overgav sig til Vespasian ved Jotapata. Efter Bar Kokhba-oprøret flyttede den jødiske ledelse mod nord: Mishnaen blev samlet i Galilæa omkring 200 e.Kr. og Jerusalem-Talmud hovedsagelig i Tiberias, og synagogerne i Kapernaum, Korazin og Baram hører til de følgende århundreder. Galilæa er i dag Israels Nordistrikt med Nazaret, Tiberias, Safed og Akko, hjem for jøder, arabere, drusere og landets største kristne samfund."
  sr:
    - "Галилеја је север земље западно од Јордана, између Језраелске равнице и ливанских планина, ограничена на истоку Галилејским морем и горњим Јорданом. Хебрејско галил значи круг или област; Исаија говори о „Галилеји незнабожачкој“, а у Исусу Навину Кедес „у Галилеји у гори Нефталимовој“ град је уточишта. Горња Галилеја је висораван која се диже до 1.200 м на Мерону; Доња Галилеја је земља ниских гребена и плодних долина, са Назаретом, Каном и Сефорисом, која пада к језеру 210 м испод нивоа мора. Јосиф Флавије хвали њено богато тло и многобројне градове и села."
    - "Соломун је Хираму из Тира дао „двадесет градова у земљи галилејској“. Године 733–732. п. н. е. Теглат-Феласар III узео је „Галилеју, сву земљу Нефталимову, и пресели народ оданде у Асирију“, и област је вековима била слабо насељена. Хасмонејски цареви подвргли су је јеврејској власти крајем другог века п. н. е.; колико је Јевреја тамо живело пре тога, спорно је, али је у првом веку Галилеја била јеврејска земља села и зборница, којом је од 4. п. н. е. до 39. н. е. као тетрарх владао Ирод Антипа, из Сефориса, а потом из Тиверијаде, града који је подигао око 20. н. е. Јуда Галилејац повео је устанак при попису 6. н. е."
    - "Исус је одрастао у Назарету и, када је Јован био затворен, „отиде у Галилеју“ и настанио се у Капернауму, где Матеј види испуњеног Исаију: „Галилеја незнабожачка. Људи који седе у тами, видеше видело велико.“ По Матеју, „прохођаше по свој Галилеји Исус учећи по зборницама њиховим“; звао је рибаре на језеру, претворио воду у вино у Кани и прекоревао Хоразин, Витсаиду и Капернаум. У Јерусалиму су неки приговарали: „Зар ће Христос из Галилеје доћи?“, а Петар је био познат по галилејском говору. Пилат је послао Исуса Ироду кад је дознао да је Галилејац, а после васкрсења ученици су отишли „у Галилеју у гору куда им је казао Исус“."
    - "У рату 66–67. н. е. Јосиф Флавије је командовао Галилејом и предао се Веспазијану код Јотапате. После Бар Кохбиног устанка јеврејско вођство се преселило на север: Мишна је састављена у Галилеји око 200. н. е., а Јерусалимски талмуд углавном у Тиверијади, и зборнице у Капернауму, Хоразину и Бараму припадају следећим вековима. Галилеја је данас Северни округ Израиља, с Назаретом, Тиверијадом, Цфатом и Акром, дом Јевреја, Арапа, Друза и највећих хришћанских заједница у земљи."
  hu:
    - "Galilea a Jordántól nyugatra fekvő föld északi része, a Jezréel-síkság és a Libanon hegyei között, keleten a Galileai-tenger és a felső Jordán határolja. A héber galil kört vagy kerületet jelent; Ézsaiás „a pogányok Galileájának” nevezi, Józsuénál pedig Kedes „Galileában a Nafthali hegyén” menedékváros. Felső-Galilea a Meron-hegynél 1200 m-ig emelkedő felföld; Alsó-Galilea alacsony gerincek és termékeny völgyek vidéke, Názáret, Kána és Széforisz városaival, és a tengerszint alatt 210 m-rel fekvő tó felé ereszkedik. Josephus dicséri gazdag talaját és sok városát és falvát."
    - "Salamon Hírámnak, Tírusz királyának „húsz várost Galileának földén” adott. Kr. e. 733–732-ben III. Tiglat-Pileszer elfoglalta „Galileát és a Nafthali egész földét, és hurczolta el őket, Assiriába”, és a vidék évszázadokig gyéren lakott maradt. A hasmóneus királyok a Kr. e. 2. század végén hozták zsidó uralom alá; hogy előtte hány zsidó élt ott, az vitatott, de az 1. századra Galilea falvak és zsinagógák zsidó országa volt, amelyet Heródes Antipász, Kr. e. 4-től Kr. u. 39-ig negyedes fejedelem kormányzott Széforiszból, majd Tiberiasból, az általa Kr. u. 20 körül épített városból. A galileai Júdás a Kr. u. 6-os népszámlálás idején lázadást vezetett."
    - "Jézus Názáretben nőtt fel, és amikor Jánost börtönbe vetették, „visszatére Galileába”, és Kapernaumban telepedett le, ahol Máté Ézsaiás szavának beteljesedését látja: „a pogányok Galileája, A nép, a mely sötétségben ül vala, láta nagy világosságot”. „Bejárá Jézus az egész Galileát, tanítva azok zsinagógáiban”, halászokat hívott a tó mellett, vizet változtatott borrá Kánában, és megfeddte Korazint, Betszaidát és Kapernaumot. Jeruzsálemben némelyek ellenvetették: „Csak nem Galileából jön el a Krisztus?”, Pétert pedig galileai beszédéről ismerték fel. Pilátus Heródeshez küldte Jézust, amikor megtudta, hogy galileai, és a feltámadás után a tanítványok „Galileába, a hegyre, a hová Jézus rendelte vala őket” mentek."
    - "A Kr. u. 66–67-es háborúban Josephus volt Galilea parancsnoka, és Jotapatánál megadta magát Vespasianusnak. A Bar Kohba-felkelés után a zsidó vezetés északra költözött: a Misnát Galileában állították össze Kr. u. 200 körül, a jeruzsálemi Talmudot főként Tiberiasban, Kapernaum, Korazin és Baram zsinagógái pedig az ezt követő századokból származnak. Galilea ma Izrael Északi Körzete, Názárettel, Tiberiassal, Szafeddel és Akkóval, zsidók, arabok, drúzok és az ország legnagyobb keresztény közösségeinek otthona."
  fi:
    - "Galilea on Jordanin länsipuolisen maan pohjoisosa Jisreelin tasangon ja Libanonin vuorten välissä, itäpuolelta rajoittuen Galileanjärveen ja ylempään Jordaniin. Heprean galil merkitsee kehää tai aluetta; Jesaja nimittää sitä pakanain alueeksi, ja Joosuan kirjassa Kedes ”Galileasta, Naftalin vuoristosta” on turvakaupunki. Ylä-Galilea on ylänkö, joka nousee 1 200 metriin Meron-vuorella; Ala-Galilea on matalien harjanteiden ja hedelmällisten laaksojen maata, jossa ovat Nasaret, Kaana ja Seforis ja joka laskeutuu 210 m merenpinnan alapuolella olevalle järvelle. Josephus ylistää sen rikasta maaperää ja monia kaupunkeja ja kyliä."
    - "Salomo antoi Tyroksen Hiramille ”kaksikymmentä kaupunkia Galilean maakunnasta”. Vuosina 733–732 eaa. Tiglat-Pileser III valloitti ”Galilean, koko Naftalin maan, ja vei asukkaat pakkosiirtolaisuuteen Assuriin”, ja alue oli harvaan asuttu vuosisatojen ajan. Hasmonealaiset kuninkaat saivat sen juutalaisen vallan alle 100-luvun eaa. lopulla; kuinka monta juutalaista siellä asui sitä ennen, on kiistanalaista, mutta 1. vuosisadalla Galilea oli juutalainen kylien ja synagogien maa, jota hallitsi Herodes Antipas, tetrarkka vuodesta 4 eaa. vuoteen 39 jaa., ensin Seforiksesta ja sitten Tiberiaasta, kaupungista, jonka hän rakensi noin vuonna 20 jaa. Juudas Galilealainen johti kapinaa vuoden 6 jaa. väestönlaskennan aikaan."
    - "Jeesus varttui Nasaretissa ja, kun Johannes oli pantu vankeuteen, ”poistui Galileaan” ja asettui Kapernaumiin, jossa Matteus näkee Jesajan täyttyneen: ”pakanain Galilea – kansa, joka pimeydessä istui, näki suuren valkeuden”. Hän ”kierteli kautta koko Galilean ja opetti heidän synagoogissaan”, kutsui kalastajia järvellä, teki vedestä viiniä Kaanassa ja nuhteli Korasinia, Betsaidaa ja Kapernaumia. Jerusalemissa jotkut väittivät vastaan: ”Ei suinkaan Kristus tule Galileasta?”, ja Pietari tunnettiin galilealaisesta puheestaan. Pilatus lähetti Jeesuksen Herodeksen luo kuultuaan, että tämä oli galilealainen, ja ylösnousemuksen jälkeen opetuslapset menivät ”Galileaan sille vuorelle, jonne Jeesus oli käskenyt heidän mennä”."
    - "Vuosien 66–67 jaa. sodassa Josephus johti Galileaa ja antautui Vespasianukselle Jotapatassa. Bar Kokhban kapinan jälkeen juutalainen johto siirtyi pohjoiseen: Mishna koottiin Galileassa noin vuonna 200 jaa. ja Jerusalemin talmud pääasiassa Tiberiaassa, ja Kapernaumin, Korasinin ja Baramin synagogat kuuluvat seuraaville vuosisadoille. Galilea on nykyään Israelin pohjoinen piiri, jossa ovat Nasaret, Tiberias, Safed ja Akko ja jossa asuvat juutalaiset, arabit, druusit ja maan suurimmat kristityt yhteisöt."
  vi:
    - "Ga-li-lê là phần phía bắc của xứ ở tây sông Giô-đanh, giữa đồng bằng Gít-rê-ên và các dãy núi Li-ban, phía đông giáp Biển Ga-li-lê và thượng nguồn sông Giô-đanh. Từ Hê-bơ-rơ galil có nghĩa là vòng tròn hay vùng; Ê-sai gọi đó là “xứ Ga-li-lê của dân ngoại”, và trong sách Giô-suê, “Kê-đe ở Ga-li-lê tại trên núi Nép-ta-li” là một thành trú ẩn. Thượng Ga-li-lê là cao nguyên cao đến 1.200 m ở núi Meron; Hạ Ga-li-lê là xứ có những sống đồi thấp và thung lũng màu mỡ, dốc xuống hồ ở độ sâu 210 m dưới mực nước biển, với Na-xa-rét, Ca-na và Sepphoris. Josephus ca ngợi đất đai phì nhiêu cùng nhiều thành và làng của vùng này."
    - "Sa-lô-môn ban cho Hi-ram ở Ty-rơ “hai mươi thành ở xứ Ga-li-lê”. Vào năm 733–732 TCN Tiếc-la-Phi-lê-se III chiếm “miền Ga-li-lê, và cả địa phận Nép-ta-li; đoạn đem dân sự các xứ ấy sang A-si-ri”, và vùng này thưa dân trong nhiều thế kỷ. Các vua Hasmonean đặt vùng này dưới quyền Do Thái vào cuối thế kỷ 2 TCN; trước đó có bao nhiêu người Do Thái sống ở đây còn tranh luận, nhưng đến thế kỷ 1 Ga-li-lê là một xứ Do Thái gồm các làng và hội đường, do Hê-rốt An-ti-ba, chư hầu tứ phân từ năm 4 TCN đến năm 39, cai trị từ Sepphoris rồi từ Ti-bê-ri-át, thành ông xây khoảng năm 20. Giu-đa người Ga-li-lê lãnh đạo một cuộc nổi dậy trong cuộc kiểm tra dân số năm 6."
    - "Giê-su lớn lên ở Na-xa-rét và, khi Giăng bị bắt giam, “lánh qua xứ Ga-li-lê” rồi định cư ở Ca-bê-na-um, nơi Ma-thi-ơ thấy lời Ê-sai ứng nghiệm: “Tức là xứ Ga-li-lê thuộc về dân ngoại … Dân ấy ngồi chỗ tối tăm, Đã thấy ánh sáng lớn”. Ngài “đi khắp xứ Ga-li-lê, dạy dỗ trong các nhà hội”, gọi những người đánh cá bên hồ, hóa nước thành rượu ở Ca-na và quở trách Cô-ra-xin, Bết-sai-đa và Ca-bê-na-um. Tại Giê-ru-sa-lem có người phản đối: “Đấng Christ há từ Ga-li-lê mà đến sao?”, và Phi-e-rơ bị nhận ra bởi giọng nói Ga-li-lê. Phi-lát gửi Giê-su đến Hê-rốt khi biết Ngài là người Ga-li-lê, và sau sự sống lại, các môn đồ “đi qua xứ Ga-li-lê, lên hòn núi mà Đức Chúa Jêsus đã chỉ cho”."
    - "Trong cuộc chiến năm 66–67, Josephus chỉ huy Ga-li-lê và đầu hàng Vespasian tại Jotapata. Sau cuộc nổi dậy của Bar Kokhba, giới lãnh đạo Do Thái dời lên phía bắc: Mishnah được biên soạn ở Ga-li-lê khoảng năm 200 và Talmud Giê-ru-sa-lem chủ yếu ở Ti-bê-ri-át, còn các hội đường ở Ca-bê-na-um, Cô-ra-xin và Baram thuộc những thế kỷ sau đó. Ngày nay Ga-li-lê là Quận Bắc của Israel, với Na-xa-rét, Ti-bê-ri-át, Safed và Acre, nơi cư trú của người Do Thái, người Ả Rập, người Druze và những cộng đồng Cơ Đốc lớn nhất của đất nước."
  ro:
    - "Galileea este nordul țării de la vest de Iordan, între câmpia Izreelului și munții Libanului, mărginită la est de Marea Galileii și de cursul superior al Iordanului. Cuvântul ebraic galil înseamnă cerc sau district; Isaia o numește „Galileea neamurilor”, iar în Iosua Chedeș „în Galilea în muntele lui Neftalì” este o cetate de scăpare. Galileea de Sus este un podiș care se ridică până la 1200 m la Muntele Meron; Galileea de Jos este un ținut de culmi joase și văi roditoare, cu Nazaret, Cana și Sepphoris, coborând spre lac, la 210 m sub nivelul mării. Iosif Flaviu îi laudă solul bogat și numeroasele orașe și sate."
    - "Solomon i-a dat lui Hiram din Tir „douăzeci de cetăți în pământul Galileii”. În 733–732 î.Hr., Tiglat-Pileser al III-lea „a luat ... Galilea tot pământul Netalimului, și i-au mutat pre ei în Asiriea”, iar regiunea a fost slab populată timp de secole. Regii hasmonei au adus-o sub stăpânire iudaică la sfârșitul secolului al II-lea î.Hr.; cât de mulți iudei locuiau acolo înainte este disputat, dar în secolul I Galileea era o țară iudaică de sate și sinagogi, condusă de Irod Antipa, tetrarh din 4 î.Hr. până în 39 d.Hr., mai întâi din Sepphoris, apoi din Tiberiada, orașul construit de el în jurul anului 20 d.Hr. Iuda Galileanul a condus o răscoală la recensământul din 6 d.Hr."
    - "Isus a crescut la Nazaret și, când Ioan a fost întemnițat, „s’au dus în Galileea” și s-a stabilit la Capernaum, unde Matei vede împlinită profeția lui Isaia: „Galileea neamurilor; Norodul cel ce ședeà întru întunerec a văzut lumină mare”. „Au străbătut ... toată Galileea, învățând în adunările lor”, a chemat pescari pe lac, a prefăcut apa în vin la Cana și i-a mustrat pe Horazin, Betsaida și Capernaum. La Ierusalim, unii au obiectat că Hristos nu poate veni din Galileea, iar Petru a fost recunoscut după vorbirea lui galileeană. Pilat l-a trimis pe Isus la Irod aflând că este galileean, iar după înviere ucenicii au mers în Galileea, pe muntele unde Isus le poruncise."
    - "În războiul din 66–67 d.Hr., Iosif Flaviu a comandat Galileea și s-a predat lui Vespasian la Iotapata. După răscoala lui Bar Kohba, conducerea iudaică s-a mutat spre nord: Mishna a fost alcătuită în Galileea în jurul anului 200 d.Hr., iar Talmudul de Ierusalim mai ales la Tiberiada; sinagogile din Capernaum, Horazin și Baram aparțin secolelor următoare. Astăzi Galileea este Districtul de Nord al Israelului, cu Nazaret, Tiberiada, Safed și Acra, patria evreilor, arabilor, druzilor și a celor mai mari comunități creștine din țară."
  bg:
    - "Галилея е северната част на земята на запад от Йордан, между Изреелската равнина и планините на Ливан, ограничена на изток от Галилейското езеро и горното течение на Йордан. Еврейското галил означава кръг или област; Исаия я нарича „Галилея езическа“, а в книгата на Иисус Навин Кедес „в Галилея в Нефталимовата гора“ е град за прибежище. Горна Галилея е планинска област, която се издига до 1200 м при планината Мерон; Долна Галилея е земя от ниски хребети и плодородни долини, с Назарет, Кана и Сепфорис, спускаща се към езерото на 210 м под морското равнище. Йосиф Флавий възхвалява богатата ѝ почва и многобройните ѝ градове и села."
    - "Соломон даде на Хирам от Тир „двадесет града в Галилейската земя“. През 733–732 г. пр.н.е. Теглатфеласар III превзе „Галилея, всичката Нефталимова земя, и заведе ги пленници в Асирия“, и областта остана рядко населена в продължение на векове. Хасмонейските царе я поставиха под юдейска власт в края на II в. пр.н.е.; колко юдеи са живели там преди това, е спорно, но към I в. Галилея беше юдейска земя от села и синагоги, управлявана от Ирод Антипа, тетрарх от 4 г. пр.н.е. до 39 г. н.е., първо от Сепфорис, а после от Тивериада — града, който той построи около 20 г. н.е. Юда Галилеец вдигна въстание при преброяването от 6 г. н.е."
    - "Исус израсна в Назарет и, когато Йоан беше хвърлен в тъмница, „отиде в Галилея“ и се засели в Капернаум, където Матей вижда изпълнено Исаия: „Галилея езическа; народ който седеше в тъмнина виде виделина голяма“. Той „обхождаше... всичката Галилея, та поучаваше в съборищата им“, призова рибари на езерото, превърна водата във вино в Кана и укори Хоразин, Витсаида и Капернаум. В Йерусалим някои възразяваха: „от Галилея ли ще дойде Христос?“, а Петър беше познат по галилейския си говор. Пилат изпрати Исус при Ирод, като узна, че е галилеец, а след възкресението учениците отидоха „в Галилея, на гората дето им заръча Исус“."
    - "Във войната от 66–67 г. н.е. Йосиф Флавий командваше Галилея и се предаде на Веспасиан при Йотапата. След въстанието на Бар Кохба юдейското ръководство се премести на север: Мишна беше съставена в Галилея около 200 г. н.е., а Йерусалимският Талмуд — главно в Тивериада, и синагогите в Капернаум, Хоразин и Барам принадлежат на следващите векове. Днес Галилея е Северният окръг на Израел, с Назарет, Тивериада, Цфат и Акра, дом на евреи, араби, друзи и на най-големите християнски общности в страната."
