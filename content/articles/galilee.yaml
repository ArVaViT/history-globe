body:
  en:
    - 'Galilee is the north of the land west of the Jordan, between the plain of Jezreel and the mountains of Lebanon, bounded on the east by the Sea of Galilee and the upper Jordan. The Hebrew galil means a circle or district; Isaiah calls it "Galilee of the nations", and in Joshua Kedesh "in Galilee in mount Naphtali" is a city of refuge. Upper Galilee is a highland rising to 1,200 m at Mount Meron; Lower Galilee is a country of low ridges and fertile valleys, with Nazareth, Cana and Sepphoris, falling to the lake 210 m below sea level. Josephus praises its rich soil and its many towns and villages.'
    - 'Solomon gave Hiram of Tyre "twenty cities in the land of Galilee". In 733–732 BC Tiglath-pileser III took "Galilee, all the land of Naphtali, and carried them captive to Assyria", and the region was thinly settled for centuries. The Hasmonean kings brought it under Jewish rule late in the second century BC; how many Jews lived there before then is debated, but by the first century Galilee was a Jewish country of villages and synagogues, ruled by Herod Antipas, tetrarch from 4 BC to AD 39, from Sepphoris and then from Tiberias, the city he built about AD 20. Judas of Galilee led a revolt at the census of AD 6.'
    - 'Jesus grew up at Nazareth and, when John was imprisoned, "departed into Galilee" and settled at Capernaum, where Matthew sees Isaiah fulfilled: "Galilee of the Gentiles; The people which sat in darkness saw great light". He "went about all Galilee, teaching in their synagogues", called fishermen on the lake, made water wine at Cana and reproached Chorazin, Bethsaida and Capernaum. In Jerusalem some objected, "Shall Christ come out of Galilee?", and Peter was known by his Galilean speech. Pilate sent Jesus to Herod on learning that he was a Galilean, and after the resurrection the disciples went "into Galilee, into a mountain where Jesus had appointed them".'
    - "In the war of AD 66–67 Josephus commanded Galilee and surrendered to Vespasian at Jotapata. After the revolt of Bar Kokhba the Jewish leadership moved north: the Mishnah was compiled at Sepphoris about AD 200 and the Jerusalem Talmud at Tiberias, and the synagogues of Capernaum, Chorazin and Baram belong to the following centuries. Galilee is today the Northern District of Israel, with Nazareth, Tiberias, Safed and Acre, home to Jews, Arabs, Druze and the country's largest Christian communities."
  ru:
    - "Галилея — север земли к западу от Иордана, между Изреельской равниной и горами Ливана, с востока ограниченный Галилейским морем и верхним Иорданом. Еврейское «галиль» значит круг или округ; Исаия называет её «Галилея языческая», а в книге Иисуса Навина Кедес «в Галилее на горе Неффалимовой» — город убежища. Верхняя Галилея — нагорье, поднимающееся до 1200 м у горы Мерон; Нижняя — страна невысоких гряд и плодородных долин с Назаретом, Каной и Сепфорисом, спускающаяся к озеру на 210 м ниже уровня моря. Иосиф Флавий хвалит её тучную почву и множество городов и селений."
    - "Соломон дал Хираму Тирскому «двадцать городов в земле Галилейской». В 733–732 гг. до н. э. Феглаффелласар III взял «Галилею, всю землю Неффалимову, и переселил их в Ассирию», и край на века стал малолюдным. Хасмонейские цари подчинили его иудейской власти в конце II века до н. э.; сколько Иудеев жило там прежде — спорно, но к I веку Галилея была иудейской страной селений и синагог, которой Ирод Антипа, четвертовластник с 4 г. до н. э. по 39 г. н. э., правил из Сепфориса, а потом из Тивериады, построенной им около 20 г. н. э. Иуда Галилеянин поднял восстание при переписи 6 г. н. э."
    - "Иисус вырос в Назарете и, когда Иоанн был отдан под стражу, «удалился в Галилею» и поселился в Капернауме, где Матфей видит исполнение слов Исаии: «Галилея языческая, народ, сидящий во тьме, увидел свет великий». Матфей пишет: «И ходил Иисус по всей Галилее, уча в синагогах их»; Он призвал рыбаков на озере, претворил воду в вино в Кане и укорял Хоразин, Вифсаиду и Капернаум. В Иерусалиме иные возражали: «разве из Галилеи Христос придет?», а Петра узнали по галилейскому наречию. Пилат, узнав, что Иисус Галилеянин, послал Его к Ироду, а после воскресения ученики пошли «в Галилею, на гору, куда повелел им Иисус»."
    - "В войну 66–67 гг. н. э. Иосиф Флавий командовал Галилеей и сдался Веспасиану в Иотапате. После восстания Бар-Кохбы иудейское руководство переместилось на север: Мишна была составлена в Сепфорисе около 200 г. н. э., Иерусалимский Талмуд — в Тивериаде, а синагоги Капернаума, Хоразина и Барама относятся к последующим векам. Сегодня Галилея — Северный округ Израиля с Назаретом, Тивериадой, Цфатом и Акко, где живут евреи, арабы, друзы и самые большие христианские общины страны."
  uk:
    - "Галілея — північ землі на захід від Йордану, між рівниною Їзреель і горами Ліван, обмежена зі сходу Галілейським морем і верхнім Йорданом. Єврейське галіль означає коло або округу; Ісая називає її «Галилею поганську», а в Ісуса Навина Кедес «в Галилеї на Нафталїєвій горі» — місто-захисток. Верхня Галілея — нагір'я, що піднімається до 1200 м на горі Мерон; Нижня Галілея — край низьких хребтів і родючих долин, з Назаретом, Каною та Сепфорісом, що спускається до озера на 210 м нижче рівня моря. Йосиф Флавій хвалить її багатий ґрунт і численні міста та села."
    - "Соломон поступився Хірамові Тирському «двайцятьма городами в Галилейській країнї». У 733–732 рр. до н. е. Тіглатпаласар III узяв «Галаад і Галилею, усю землю Нефталїєву, та й одвів їх в Ассирию», і область століттями була рідко заселена. Хасмонейські царі підпорядкували її юдейській владі наприкінці II ст. до н. е.; скільки юдеїв жило там раніше, є предметом суперечки, але в I ст. Галілея була юдейським краєм сіл і синагог, яким від 4 р. до н. е. до 39 р. н. е. правив тетрарх Ірод Антипа, спершу із Сепфоріса, а потім із Тіверіади, міста, яке він збудував близько 20 р. н. е. Юда Галилейський очолив повстання під час перепису 6 р. н. е."
    - "Ісус виріс у Назареті і, коли Івана було ув'язнено, «перейшов у Галилею» та оселився в Капернаумі, де Матвій бачить виконання Ісаї: «Галилея поганська; люде сидячі в темряві побачили сьвітло велике». Він «ходив … по всїй Галилеї, навчаючи по школах їх», покликав рибалок на озері, перетворив воду на вино в Кані та докорив Хоразинові, Віфсаїді й Капернаумові. В Єрусалимі дехто заперечував: «Чи з Галилеї ж Христу приходити?», а Петра впізнавали з галілейської говірки. Пилат відіслав Ісуса до Ірода, дізнавшись, що Він галілеянин, а після воскресіння учні пішли «в Галилею, на гору, куди повелїв їм Ісус»."
    - "Під час війни 66–67 рр. н. е. Йосиф Флавій командував у Галілеї й здався Веспасіанові в Йотапаті. Після повстання Бар-Кохби юдейське керівництво переселилося на північ: Мішну було складено в Сепфорісі близько 200 р. н. е., а Єрусалимський Талмуд — у Тіверіаді, і синагоги Капернаума, Хоразина та Барама належать до наступних століть. Галілея сьогодні — Північний округ Ізраїлю, з Назаретом, Тіверіадою, Цфатом та Акко, домівка юдеїв, арабів, друзів і найбільших християнських громад країни."
  es:
    - "Galilea es el norte de la tierra al oeste del Jordán, entre la llanura de Jezreel y las montañas del Líbano, limitada al este por el mar de Galilea y el alto Jordán. El hebreo galil significa círculo o distrito; Isaías la llama «Galilea de las gentes», y en Josué Cedes «en Galilea, en el monte de Nephtalí» es una ciudad de refugio. La Alta Galilea es una región montañosa que se eleva hasta 1200 m en el monte Merón; la Baja Galilea es una tierra de lomas bajas y valles fértiles, con Nazaret, Caná y Séforis, que desciende hasta el lago, a 210 m bajo el nivel del mar. Josefo elogia su rico suelo y sus muchas ciudades y aldeas."
    - "Salomón dio a Hiram de Tiro «veinte ciudades en tierra de Galilea». En 733–732 a. C. Tiglat-pileser III tomó «Galilea, y toda la tierra de Nephtalí; y trasportólos á Asiria», y la región estuvo escasamente poblada durante siglos. Los reyes asmoneos la sometieron al dominio judío a finales del siglo II a. C.; se debate cuántos judíos vivían allí antes, pero en el siglo I Galilea era un país judío de aldeas y sinagogas, gobernado por Herodes Antipas, tetrarca del 4 a. C. al 39 d. C., desde Séforis y luego desde Tiberias, la ciudad que construyó hacia el 20 d. C. Judas el Galileo encabezó una revuelta en el censo del 6 d. C."
    - "Jesús creció en Nazaret y, cuando Juan fue encarcelado, «se volvió á Galilea» y se estableció en Cafarnaúm, donde Mateo ve cumplido a Isaías: «Galilea de los Gentiles; El pueblo asentado en tinieblas, vió gran luz». «Rodeó [...] toda Galilea, enseñando en las sinagogas de ellos», llamó a pescadores en el lago, convirtió el agua en vino en Caná y reprochó a Corazín, Betsaida y Cafarnaúm. En Jerusalén algunos objetaron: «¿De Galilea ha de venir el Cristo?», y Pedro era reconocido por su acento galileo. Pilato envió a Jesús a Herodes al saber que era galileo, y tras la resurrección los discípulos «se fueron á Galilea, al monte donde Jesús les había ordenado»."
    - "En la guerra del 66–67 d. C. Josefo mandó en Galilea y se rindió a Vespasiano en Jotapata. Tras la revuelta de Bar Kojba la dirección judía se trasladó al norte: la Misná se compiló en Séforis hacia el 200 d. C. y el Talmud de Jerusalén en Tiberias, y las sinagogas de Cafarnaúm, Corazín y Baram pertenecen a los siglos siguientes. Galilea es hoy el Distrito Norte de Israel, con Nazaret, Tiberias, Safed y Acre, hogar de judíos, árabes, drusos y las mayores comunidades cristianas del país."
  pt:
    - "A Galileia é o norte da terra a oeste do Jordão, entre a planície de Jezreel e as montanhas do Líbano, limitada a leste pelo Mar da Galileia e pelo alto Jordão. O hebraico galil significa círculo ou distrito; Isaías a chama “a Galileia das nações”, e em Josué Quedes “na Galileia, na região montanhosa de Naftali” é uma cidade de refúgio. A Alta Galileia é um planalto que sobe a 1.200 m no monte Meron; a Baixa Galileia é uma região de cristas baixas e vales férteis, com Nazaré, Caná e Séforis, descendo até o lago, 210 m abaixo do nível do mar. Josefo louva seu solo rico e suas muitas cidades e aldeias."
    - "Salomão deu a Hirão de Tiro “vinte cidades na terra da Galileia”. Em 733–732 a.C., Tiglate-Pileser III tomou “a Galileia, toda a terra de Naftali; e os levou cativos para a Assíria”, e a região foi pouco povoada por séculos. Os reis hasmoneus a submeteram ao domínio judeu no fim do século II a.C.; quantos judeus viviam ali antes disso é debatido, mas no século I a Galileia era um país judeu de aldeias e sinagogas, governado por Herodes Antipas, tetrarca de 4 a.C. a 39 d.C., a partir de Séforis e depois de Tiberíades, a cidade que ele construiu por volta de 20 d.C. Judas, o galileu, liderou uma revolta no recenseamento de 6 d.C."
    - "Jesus cresceu em Nazaré e, quando João foi preso, “retirou-se para a Galileia” e se fixou em Cafarnaum, onde Mateus vê Isaías cumprido: “Galileia dos gentios; o povo que estava sentado nas trevas viu uma grande luz”. Ele “percorria toda a Galileia, ensinando nas sinagogas deles”, chamou pescadores no lago, fez da água vinho em Caná e repreendeu Corazim, Betsaida e Cafarnaum. Em Jerusalém alguns objetaram: “Será que o Cristo vem da Galileia?”, e Pedro era conhecido pelo seu falar galileu. Pilatos enviou Jesus a Herodes ao saber que era galileu, e depois da ressurreição os discípulos foram “para a Galileia, para o monte para onde Jesus os havia enviado”."
    - "Na guerra de 66–67 d.C., Josefo comandou a Galileia e se rendeu a Vespasiano em Jotapata. Depois da revolta de Bar Kokhba, a liderança judaica se mudou para o norte: a Mishná foi compilada em Séforis por volta de 200 d.C. e o Talmude de Jerusalém em Tiberíades, e as sinagogas de Cafarnaum, Corazim e Baram pertencem aos séculos seguintes. A Galileia é hoje o Distrito Norte de Israel, com Nazaré, Tiberíades, Safed e Acre, lar de judeus, árabes, drusos e das maiores comunidades cristãs do país."
  de:
    - "Galiläa ist der Norden des Landes westlich des Jordan, zwischen der Ebene Jesreel und den Bergen des Libanon, im Osten vom See Genezareth und dem oberen Jordan begrenzt. Das hebräische galil bedeutet Kreis oder Bezirk; Jesaja nennt es „der Heiden Galiläa“, und bei Josua ist Kedes „in Galiläa, auf dem Gebirge Naphthali“ eine Freistadt. Obergaliläa ist ein Hochland, das am Berg Meron bis 1200 m ansteigt; Untergaliläa ist ein Land niedriger Höhenzüge und fruchtbarer Täler, mit Nazareth, Kana und Sepphoris, das zum See 210 m unter dem Meeresspiegel abfällt. Josephus rühmt seinen reichen Boden und seine vielen Städte und Dörfer."
    - "Salomo gab Hiram von Tyrus „zwanzig Städte im Land Galiläa“. In den Jahren 733–732 v. Chr. nahm Tiglat-Pileser III. „Galiläa, das ganze Land Naphthali, und führte sie weg nach Assyrien“, und die Region war jahrhundertelang dünn besiedelt. Die hasmonäischen Könige brachten sie Ende des 2. Jahrhunderts v. Chr. unter jüdische Herrschaft; wie viele Juden dort vorher lebten, ist umstritten, doch im 1. Jahrhundert war Galiläa ein jüdisches Land von Dörfern und Synagogen, regiert von Herodes Antipas, Tetrarch von 4 v. Chr. bis 39 n. Chr., von Sepphoris und dann von Tiberias aus, der Stadt, die er um 20 n. Chr. baute. Judas der Galiläer führte bei der Schätzung des Jahres 6 n. Chr. einen Aufstand an."
    - "Jesus wuchs in Nazareth auf und als Johannes gefangen gesetzt wurde, „zog er in das galiläische Land“ und ließ sich in Kapernaum nieder, wo Matthäus Jesaja erfüllt sieht: „Das Land Sebulon und das Land Naphthali, am Wege des Meeres, jenseit des Jordans, und das heidnische Galiläa, das Volk, das in Finsternis saß, hat ein großes Licht gesehen“. Er „ging umher im ganzen galiläischen Lande, lehrte sie in ihren Schulen“, rief Fischer am See, machte in Kana Wasser zu Wein und tadelte Chorazin, Betsaida und Kapernaum. In Jerusalem wandten manche ein: „Soll Christus aus Galiläa kommen?“, und Petrus war an seiner galiläischen Sprache zu erkennen. Pilatus schickte Jesus zu Herodes, als er erfuhr, dass er ein Galiläer war, und nach der Auferstehung: „Aber die elf Jünger gingen nach Galiläa auf einen Berg, dahin Jesus sie beschieden hatte“."
    - "Im Krieg von 66–67 n. Chr. befehligte Josephus Galiläa und ergab sich bei Jotapata Vespasian. Nach dem Aufstand des Bar Kochba verlagerte sich die jüdische Führung nach Norden: Die Mischna wurde um 200 n. Chr. in Sepphoris zusammengestellt und der Jerusalemer Talmud in Tiberias, und die Synagogen von Kapernaum, Chorazin und Baram gehören in die folgenden Jahrhunderte. Galiläa ist heute der Nordbezirk Israels, mit Nazareth, Tiberias, Safed und Akko, Heimat von Juden, Arabern, Drusen und den größten christlichen Gemeinden des Landes."
  fr:
    - "La Galilée est le nord du pays à l’ouest du Jourdain, entre la plaine de Jizreel et les montagnes du Liban, bornée à l’est par la Mer de Galilée et le haut Jourdain. L’hébreu galil signifie cercle ou district ; Ésaïe l’appelle la Galilée des nations, et chez Josué Kédesch, « en Galilée, dans la montagne de Nephthali », est une ville de refuge. La Haute Galilée est un haut pays qui s’élève à 1 200 m au Mont Méron ; la Basse Galilée est un pays de basses crêtes et de vallées fertiles, avec Nazareth, Cana et Sepphoris, qui descend vers le lac à 210 m sous le niveau de la mer. Josèphe loue son sol riche et ses nombreuses villes et villages."
    - "Salomon donna à Hiram de Tyr « vingt villes dans le pays de Galilée ». En 733–732 av. J.-C., Tiglath-Piléser III prit « la Galilée, tout le pays de Nephthali, et il emmena captifs les habitants en Assyrie », et la région fut peu peuplée pendant des siècles. Les rois hasmonéens la soumirent à la domination juive à la fin du IIe siècle av. J.-C. ; on débat du nombre de Juifs qui y vivaient auparavant, mais au Ier siècle la Galilée était un pays juif de villages et de synagogues, gouverné par Hérode Antipas, tétrarque de 4 av. J.-C. à 39 apr. J.-C., depuis Sepphoris puis depuis Tibériade, la ville qu’il bâtit vers 20 apr. J.-C. Judas le Galiléen mena une révolte lors du recensement de 6 apr. J.-C."
    - "Jésus grandit à Nazareth et, quand Jean fut livré, « se retira dans la Galilée » et s’établit à Capernaüm, où Matthieu voit s’accomplir Ésaïe : « la Galilée des Gentils, ce peuple, assis dans les ténèbres, a vu une grande lumière ». Il « parcourait toute la Galilée, enseignant dans les synagogues », appela des pêcheurs sur le lac, changea l’eau en vin à Cana de Galilée et blâma Chorazin, Bethsaïda et Capernaüm. À Jérusalem, certains objectèrent : « Est-ce bien de la Galilée que doit venir le Christ ? », et Pierre était reconnu à son parler galiléen. Pilate envoya Jésus à Hérode en apprenant qu’il était galiléen, et après la résurrection les disciples « allèrent en Galilée, sur la montagne que Jésus leur avait désignée »."
    - "Pendant la guerre de 66–67 apr. J.-C., Josèphe commanda la Galilée et se rendit à Vespasien à Jotapata. Après la révolte de Bar Kokhba, la direction juive passa au nord : la Michna fut compilée à Sepphoris vers 200 apr. J.-C. et le Talmud de Jérusalem à Tibériade, et les synagogues de Capernaüm, de Chorazin et de Baram datent des siècles suivants. La Galilée est aujourd’hui le district Nord d’Israël, avec Nazareth, Tibériade, Safed et Acre, foyer de Juifs, d’Arabes, de Druzes et des plus grandes communautés chrétiennes du pays."
  it:
    - "La Galilea è il nord del paese a ovest del Giordano, fra la piana di Izreel e i monti del Libano, delimitata a est dal Lago di Tiberiade e dall’alto Giordano. L’ebraico galil significa cerchio o distretto; Isaia la chiama «la Galilea de’ Gentili», e in Giosuè Kedes «in Galilea nella contrada montuosa di Neftali» è una città di rifugio. L’Alta Galilea è un altopiano che si innalza a 1200 m sul Monte Meron; la Bassa Galilea è un paese di basse dorsali e valli fertili, con Nazaret, Cana e Sefforis, che scende al lago a 210 m sotto il livello del mare. Giuseppe Flavio ne loda il suolo ricco e le molte città e villaggi."
    - "Salomone diede a Chiram di Tiro «venti città nel paese di Galilea». Nel 733–732 a.C. Tiglat-Pilèser III prese «la Galilea, tutto il paese di Neftali, e ne menò gli abitanti in cattività in Assiria», e la regione fu scarsamente popolata per secoli. I re asmonei la portarono sotto il dominio ebraico alla fine del II secolo a.C.; quanti Ebrei vi vivessero prima è dibattuto, ma nel I secolo la Galilea era un paese ebraico di villaggi e sinagoghe, governato da Erode Antipa, tetrarca dal 4 a.C. al 39 d.C., da Sefforis e poi da Tiberiade, la città da lui costruita verso il 20 d.C. Giuda il Galileo guidò una rivolta al censimento del 6 d.C."
    - "Gesù crebbe a Nazaret e, quando Giovanni fu messo in prigione, «si ritirò in Galilea» e si stabilì a Cafarnao, dove Matteo vede adempiersi Isaia: «la Galilea dei Gentili, il popolo che giaceva nelle tenebre, ha veduto una gran luce». Egli «andava attorno per tutta la Galilea, insegnando nelle loro sinagoghe», chiamò pescatori sul lago, mutò l’acqua in vino a Cana e rimproverò Corazin, Betsaida e Cafarnao. A Gerusalemme alcuni obiettarono: «Ma è forse dalla Galilea che viene il Cristo?», e Pietro era riconoscibile dalla parlata galilea. Pilato mandò Gesù a Erode quando seppe che era Galileo, e dopo la risurrezione i discepoli andarono «in Galilea sul monte che Gesù avea loro designato»."
    - "Nella guerra del 66–67 d.C. Giuseppe Flavio comandò la Galilea e si arrese a Vespasiano a Iotapata. Dopo la rivolta di Bar Kokhba la direzione ebraica si spostò a nord: la Mishnah fu compilata a Sefforis verso il 200 d.C. e il Talmud di Gerusalemme a Tiberiade, e le sinagoghe di Cafarnao, Corazin e Baram appartengono ai secoli seguenti. La Galilea è oggi il Distretto Settentrionale d’Israele, con Nazaret, Tiberiade, Safed e Acri, patria di Ebrei, Arabi, Drusi e delle maggiori comunità cristiane del paese."
  pl:
    - "Galilea to północ ziemi na zachód od Jordanu, między równiną Jizreel a górami Libanu, ograniczona na wschodzie Jeziorem Galilejskim i górnym Jordanem. Hebrajskie galil znaczy krąg lub okręg; Izajasz nadaje jej tytuł: „Galilea poganów”, a w Księdze Jozuego Kedesz „w Galilei na górze Neftali” jest miastem ucieczki. Górna Galilea to wyżyna wznosząca się do 1200 m na górze Meron; Dolna Galilea to kraj niskich grzbietów i żyznych dolin, z Nazaretem, Kaną i Sefforis, opadający ku jezioru 210 m poniżej poziomu morza. Józef Flawiusz chwali jej bogatą ziemię i liczne miasta i wsie."
    - "Salomon dał Hiramowi z Tyru „dwadzieścia miast w ziemi Galilejskiej”. W latach 733–732 p.n.e. Tiglat-Pileser III wziął „Galileę, wszystkę ziemię Neftali, a przeniósł obywatele jej do Assyryi”, a region był przez stulecia słabo zasiedlony. Królowie hasmonejscy podporządkowali go władzy żydowskiej pod koniec II w. p.n.e.; ilu Żydów mieszkało tam wcześniej, jest dyskutowane, lecz w I w. Galilea była żydowskim krajem wsi i synagog, rządzonym przez Heroda Antypasa, tetrarchę od 4 r. p.n.e. do 39 r. n.e., z Sefforis, a potem z Tyberiady, miasta, które zbudował około 20 r. n.e. Juda Galilejczyk poprowadził bunt przy spisie w 6 r. n.e."
    - "Jezus wychował się w Nazarecie i gdy Jan został uwięziony, „wrócił się do Galilei” i osiadł w Kafarnaum, gdzie Mateusz widzi spełnienie Izajasza: „Galilea poganów; Lud, który siedział w ciemności, widział światłość wielką”. Jak czytamy, „obchodził Jezus wszystkę Galileją, ucząc w bóżnicach ich”, powołał rybaków nad jeziorem, w Kanie zamienił wodę w wino i wyrzucał Korozain, Betsaidzie i Kafarnaum. W Jerozolimie niektórzy oponowali: „Azaż z Galilei przyjdzie Chrystus?”, a Piotra poznawano po galilejskiej mowie. Piłat odesłał Jezusa do Heroda, dowiedziawszy się, że jest Galilejczykiem, a po zmartwychwstaniu uczniowie poszli „do Galilei na górę, gdzie im był naznaczył Jezus”."
    - "W wojnie 66–67 r. n.e. Józef Flawiusz dowodził Galileą i poddał się Wespazjanowi w Jotapacie. Po powstaniu Bar Kochby przywództwo żydowskie przeniosło się na północ: Misznę spisano w Sefforis około 200 r. n.e., a Talmud jerozolimski w Tyberiadzie, zaś synagogi Kafarnaum, Korozain i Baram należą do następnych stuleci. Galilea to dziś Okręg Północny Izraela, z Nazaretem, Tyberiadą, Safedem i Akką, dom Żydów, Arabów, Druzów i największych chrześcijańskich wspólnot w kraju."
  nl:
    - "Galilea is het noorden van het land ten westen van de Jordaan, tussen de vlakte van Jizreël en het Libanongebergte, in het oosten begrensd door het Meer van Galilea en de bovenloop van de Jordaan. Het Hebreeuwse galil betekent kring of district; Jesaja noemt het “Galilea der heidenen”, en in Jozua is Kedes “in Galilea, op het gebergte van Nafthali” een vrijstad. Boven-Galilea is een hoogland dat bij de berg Meron tot 1200 m stijgt; Neder-Galilea is een land van lage ruggen en vruchtbare dalen, met Nazareth, Kana en Sepforis, dat afdaalt naar het meer 210 m onder zeeniveau. Josephus prijst zijn rijke grond en zijn vele steden en dorpen."
    - "Over Hiram van Tyrus zegt Koningen: “alstoen de koning Salomo aan Hiram twintig steden gaf in het land van Galilea”. In 733–732 v.Chr. nam Tiglat-Pileser III “Galilea, het ganse land van Nafthali; en hij voerde hen weg naar Assyrië”, en de streek was eeuwenlang dun bevolkt. De Hasmonese koningen brachten haar aan het eind van de tweede eeuw v.Chr. onder Joods bewind; hoeveel Joden er daarvoor woonden, is omstreden, maar in de eerste eeuw was Galilea een Joods land van dorpen en synagogen, bestuurd door Herodes Antipas, tetrarch van 4 v.Chr. tot 39 n.Chr., vanuit Sepforis en daarna vanuit Tiberias, de stad die hij omstreeks 20 n.Chr. bouwde. Judas de Galileeër leidde bij de volkstelling van 6 n.Chr. een opstand."
    - "Jezus groeide op te Nazareth en, toen Johannes gevangen was, “is Hij wedergekeerd naar Galilea” en vestigde zich te Kafarnaüm, waar Mattheüs Jesaja vervuld ziet: “Galilea der volken; Het volk, dat in duisternis zat, heeft een groot licht gezien”. Hij “omging geheel Galilea, lerende in hun synagogen”, riep vissers aan het meer, maakte water tot wijn te Kana en verweet Chorazin, Bethsaïda en Kafarnaüm. In Jeruzalem wierpen sommigen tegen: “Zal dan de Christus uit Galilea komen?”, en Petrus werd herkend aan zijn Galilese spraak. Pilatus zond Jezus naar Herodes toen hij vernam dat hij een Galileeër was, en na de opstanding gingen de leerlingen “naar Galilea, naar den berg, waar Jezus hen bescheiden had”."
    - "In de oorlog van 66–67 n.Chr. voerde Josephus het bevel over Galilea en gaf zich bij Jotapata over aan Vespasianus. Na de opstand van Bar Kochba verhuisde de Joodse leiding naar het noorden: de Misjna werd omstreeks 200 n.Chr. te Sepforis samengesteld en de Jeruzalemse Talmoed te Tiberias, en de synagogen van Kafarnaüm, Chorazin en Baram horen bij de eeuwen daarna. Galilea is nu het Noordelijk District van Israël, met Nazareth, Tiberias, Safed en Akko, thuis van Joden, Arabieren, Druzen en de grootste christelijke gemeenschappen van het land."
  cs:
    - "Galilea je sever země západně od Jordánu, mezi Jizreelskou rovinou a horami Libanonu, ohraničený na východě Galilejským jezerem a horním Jordánem. Hebrejské galil znamená kruh nebo okres; Izajáš ji nazývá „Galilei lidnou“ a u Jozua je Kedeš „v Galilei na hoře Neftalím“ útočištným městem. Horní Galilea je vysočina dosahující 1200 m na hoře Meron; Dolní Galilea je země nízkých hřbetů a úrodných údolí, s Nazaretem, Kánou a Sepforis, klesající k jezeru 210 m pod hladinou moře. Josephus chválí její bohatou půdu a mnoho měst a vesnic."
    - "Šalomoun dal Chíramovi z Týru „dvadceti měst v zemi Galilejské“. V letech 733–732 př. n. l. Tiglatpilesar III. vzal „Galád a Galilei, i všecku zemi Neftalím, a přenesl obyvatele jejich do Assyrie“ a oblast byla po staletí řídce osídlena. Hasmonejští králové ji podrobili židovské vládě koncem 2. století př. n. l.; kolik Židů tam žilo před tím, je sporné, ale v 1. století byla Galilea židovskou zemí vesnic a synagog, vládl jí Herodes Antipas, tetrarcha od roku 4 př. n. l. do 39 n. l., ze Sepforis a pak z Tiberiady, města, které postavil kolem roku 20 n. l. Juda Galilejský vedl povstání při sčítání roku 6 n. l."
    - "Ježíš vyrostl v Nazaretě a když byl Jan uvězněn, „odšel do Galilee“ a usadil se v Kafarnaum, kde Matouš vidí naplněného Izajáše: „Galilea pohanská, Lid, kterýž bydlil v temnostech, viděl světlo veliké“. Pak, jak se praví, „procházel Ježíš všecku Galilei, uče v shromážděních jejich“, povolal rybáře u jezera, proměnil vodu ve víno v Káně a vyčítal Chorazinu, Betsaidě a Kafarnaum. V Jeruzalémě někteří namítali: „Zdaliž od Galilee přijde Kristus?“ a Petr byl poznán podle galilejské řeči. Pilát poslal Ježíše k Herodovi, když se dozvěděl, že je Galilejský, a po vzkříšení učedníci šli „do Galilee na horu, kdežto jim byl uložil Ježíš“."
    - "Při válce let 66–67 n. l. velel Josephus v Galileji a vzdal se Vespasianovi v Jotapatě. Po Bar Kochbově povstání se židovské vedení přesunulo na sever: Mišna byla sestavena v Sepforis kolem roku 200 n. l. a jeruzalémský Talmud v Tiberiadě a synagogy Kafarnaum, Chorazinu a Baramu patří do následujících staletí. Galilea je dnes Severní okres Izraele s Nazaretem, Tiberiadou, Safedem a Akkem, domovem Židů, Arabů, Drúzů a největších křesťanských komunit země."
