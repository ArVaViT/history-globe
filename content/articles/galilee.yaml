# Overview article (ADR 0007). Mainstream facts only; the extent of Jewish settlement in Galilee before the Hasmoneans is noted as debated.
id: galilee
place: a9cf1e8
title:
  en: "Galilee"
  ru: "Галилея"
  uk: "Галілея"
  es: "Galilea"
  pt: "Galileia"
  de: "Galiläa"
  fr: "Galilée"
  it: "Galilea"
  pl: "Galilea"
