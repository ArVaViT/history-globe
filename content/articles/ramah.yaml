body:
  en:
    - 'Ramah of Benjamin, whose name means "height", is commonly identified with the village of er-Ram, on a hill by the ridge road about 8 km north of Jerusalem, between Gibeah to the south and Geba to the east. Josephus puts it forty furlongs from Jerusalem, and Eusebius six or seven miles to the north, opposite Bethel (the Greek and Latin texts of his Onomasticon differ). Little archaeological work has been done there; a modern survey of the site found much pottery of the Iron Age, little of the Persian period and more again of Hellenistic times.'
    - "Ramah is listed among the cities of Benjamin. The prophetess Deborah judged Israel under her palm tree between Ramah and Bethel, and the Levite of Judges, on his way home, thought of lodging in Gibeah or in Ramah. The books of Samuel name Ramah as the home of Samuel, where he judged Israel and was buried; 1 Samuel opens in Ramathaim-zophim. Whether this was the same town is disputed: some place Samuel's Ramah here, others elsewhere, for example at Nebi Samwil or farther north-west at Rentis."
    - "Ramah lay on the border between the two kingdoms. Baasha of Israel began to build it so that no one could go out or come in to Asa of Judah; Asa bribed Ben-hadad of Damascus to attack Israel, and when Baasha stopped, Asa carried off its stones and timber and built Geba and Mizpah with them. Isaiah, describing an army marching on Jerusalem from the north, says that Ramah is afraid. After Jerusalem fell in 587 or 586 BC, Nebuzar-adan released Jeremiah at Ramah, where he had been taken in chains among the captives bound for Babylon."
    - 'In Jeremiah, Rachel weeps for her children: "A voice was heard in Ramah". Matthew applies these words to the children killed at Bethlehem under Herod. After the exile the men of Ramah and Geba, 621 in all, returned from Babylon, and Ramah is named among the places where the Benjamites lived in Nehemiah''s day. In the fourth century Eusebius still knew Rama of Benjamin as the city of Saul, north of Jerusalem.'
  ru:
    - "Рама Вениаминова, чьё имя означает «высота», обычно отождествляется с деревней Ар-Рам на холме у дороги по хребту примерно в 8 км к северу от Иерусалима, между Гивой на юге и Гевой на востоке. Иосиф Флавий помещает её в сорока стадиях от Иерусалима, а Евсевий — в шести или семи милях к северу, напротив Вефиля (греческий и латинский тексты его «Ономастикона» расходятся). Археологи здесь почти не работали; одно из современных обследований местности обнаружило много керамики железного века, мало — персидского времени и снова больше — эллинистического."
    - "Рама названа среди городов Вениаминовых. Пророчица Девора судила Израиль под своей пальмой между Рамою и Вефилем, а левит из Книги Судей на пути домой думал заночевать в Гиве или в Раме. Книги Царств называют Раму домом Самуила: там он судил Израиля и там был погребён; Первая книга Царств начинается в Рамафаим-Цофиме. Был ли это тот же город — вопрос спорный: одни помещают Раму Самуила здесь, другие в иных местах, например в Неби-Самуиле или дальше к северо-западу, в Рентисе."
    - "Рама лежала на границе двух царств. Вааса, царь Израильский, начал строить её, чтобы никто не выходил и не приходил к Асе, царю Иудейскому; Аса подкупил Венадада Дамасского, чтобы тот напал на Израиль, и когда Вааса прекратил стройку, Аса вывез из Рамы камни и дерева и выстроил из них Геву и Массифу. Исаия, описывая войско, идущее на Иерусалим с севера, говорит, что Рама трясётся. После падения Иерусалима в 587 или 586 г. до н. э. Навузардан отпустил Иеремию в Раме, куда того привели скованного цепями среди пленных, переселяемых в Вавилон."
    - "У Иеремии Рахиль плачет о детях своих: «голос слышен в Раме». Матфей относит эти слова к младенцам, убитым в Вифлееме при Ироде. После плена уроженцы Рамы и Гевы, шестьсот двадцать один человек, вернулись из Вавилона, а во дни Неемии Рама названа среди мест, где жили вениамитяне. В IV веке Евсевий всё ещё знал Раму Вениаминову как город Саула к северу от Иерусалима."
  uk:
    - "Рама Веніяміна, ім’я якої означає «висота», зазвичай ототожнюється із селом ер-Рам на пагорбі біля гребеневої дороги приблизно за 8 км на північ від Єрусалима, між Гівою на півдні та Гебою на сході. Йосиф Флавій розміщує її за сорок стадій від Єрусалима, а Євсевій — за шість чи сім миль на північ, навпроти Бет-Ела (грецький і латинський тексти його «Ономастикона» розходяться). Археологічних робіт там проведено мало; одне із сучасних обстежень місцевості виявило багато кераміки залізної доби, мало — перського періоду й знову більше — елліністичних часів."
    - "Раму зараховано до міст Веніяміна. Пророчиця Дебора судила Ізраїль під своєю пальмою між Рамою та Бет-Елом, а левіт із Книги Суддів, ідучи додому, думав заночувати в Гіві або в Рамі. Книги Самуїла називають Раму домівкою Самуїла, де він судив Ізраїль і був похований; Перша книга Самуїла починається в Рамафаїм-Цофімі. Чи було це те саме місто, суперечать: одні поміщають тут Раму Самуїла, інші деінде, наприклад у Неби-Самуїлі або далі на північний захід, у Рентісі."
    - "Рама лежала на межі двох царств. Вааса Ізраїльський почав її будувати, щоб ніхто не міг ні вийти, ні ввійти до Аси Юдейського; Аса підкупив Бен-Гадада Дамаського, щоб той напав на Ізраїль, і коли Вааса припинив, Аса забрав її каміння й деревину та збудував з них Гебу й Міцпу. Ісая, описуючи військо, що йде на Єрусалим з півночі, каже, що Рама боїться. Після падіння Єрусалима в 587 або 586 р. до н. е. Навузардан звільнив Єремію в Рамі, куди його привели в кайданах серед полонених, що йшли до Вавилона."
    - "У Єремії Рахіль плаче за своїми дітьми: «Чути голосїннє аж у Рамі». Матвій відносить ці слова до дітей, убитих у Вифлеємі за Ірода. Після вигнання мешканці Рами та Геби, усього 621, повернулися з Вавилона, і Рама названа серед місць, де жили веніямінці за днів Неемії. У IV ст. Євсевій ще знав Раму Веніямінову як місто Саула, на північ від Єрусалима."
  es:
    - "Ramá de Benjamín, cuyo nombre significa «altura», se identifica por lo común con la aldea de er-Ram, en una colina junto al camino de la cresta, a unos 8 km al norte de Jerusalén, entre Gabaa al sur y Geba al este. Josefo la pone a cuarenta estadios de Jerusalén, y Eusebio a seis o siete millas al norte, frente a Betel (los textos griego y latino de su Onomasticon difieren). Se ha hecho poco trabajo arqueológico allí; una prospección moderna del lugar halló mucha cerámica de la Edad del Hierro, poca del período persa y de nuevo más de la época helenística."
    - "Ramá figura entre las ciudades de Benjamín. La profetisa Débora juzgaba a Israel bajo su palmera entre Ramá y Betel, y el levita de Jueces, de camino a casa, pensó en alojarse en Gabaa o en Ramá. Los libros de Samuel nombran Ramá como patria de Samuel, donde juzgó a Israel y fue sepultado; 1 Samuel comienza en Ramataim-zofim. Si era la misma ciudad se discute: unos sitúan aquí la Ramá de Samuel, otros en otra parte, por ejemplo en Nebi Samwil o más al noroeste, en Rentis."
    - "Ramá estaba en la frontera entre los dos reinos. Baasa de Israel empezó a edificarla para que nadie pudiera salir ni entrar a Asa de Judá; Asa sobornó a Ben-adad de Damasco para que atacara a Israel, y cuando Baasa cesó, Asa se llevó sus piedras y su madera y con ellas edificó Geba y Mizpa. Isaías, al describir un ejército que marcha sobre Jerusalén desde el norte, dice que Ramá tiembla. Tras la caída de Jerusalén en 587 o 586 a. C., Nabuzaradán puso en libertad a Jeremías en Ramá, adonde había sido llevado encadenado entre los cautivos con destino a Babilonia."
    - "En Jeremías, Raquel llora por sus hijos: «Voz fué oída en Ramá». Mateo aplica estas palabras a los niños muertos en Belén bajo Herodes. Tras el exilio los hombres de Ramá y de Geba, 621 en total, volvieron de Babilonia, y Ramá se nombra entre los lugares donde vivían los benjaminitas en tiempos de Nehemías. En el siglo IV Eusebio aún conocía Ramá de Benjamín como la ciudad de Saúl, al norte de Jerusalén."
  pt:
    - "Ramá de Benjamim, cujo nome significa “altura”, é comumente identificada com a aldeia de er-Ram, numa colina junto à estrada da crista a cerca de 8 km ao norte de Jerusalém, entre Gibeá ao sul e Geba a leste. Josefo a põe a quarenta estádios de Jerusalém, e Eusébio a seis ou sete milhas ao norte, defronte de Betel (os textos grego e latino de seu Onomástico divergem). Pouco trabalho arqueológico foi feito ali; uma prospecção moderna do local encontrou muita cerâmica da Idade do Ferro, pouca do período persa e de novo mais da época helenística."
    - "Ramá é listada entre as cidades de Benjamim. A profetisa Débora julgava Israel sob sua palmeira entre Ramá e Betel, e o levita de Juízes, a caminho de casa, pensou em pousar em Gibeá ou em Ramá. Os livros de Samuel nomeiam Ramá como a casa de Samuel, onde ele julgou Israel e foi sepultado; 1 Samuel começa em Ramataim-Zofim. Se era a mesma cidade é discutido: uns situam aqui a Ramá de Samuel, outros em outro lugar, por exemplo em Nebi Samwil ou mais a noroeste, em Rentis."
    - "Ramá ficava na fronteira entre os dois reinos. Baasa de Israel começou a edificá-la para que ninguém saísse nem chegasse a Asa de Judá; Asa subornou Ben-Hadade de Damasco para atacar Israel e, quando Baasa parou, Asa levou suas pedras e madeira e com elas edificou Geba e Mispá. Isaías, descrevendo um exército que marcha sobre Jerusalém pelo norte, diz que Ramá treme. Depois da queda de Jerusalém em 587 ou 586 a.C., Nebuzaradã soltou Jeremias em Ramá, onde ele fora levado acorrentado entre os cativos a caminho da Babilônia."
    - "Em Jeremias, Raquel chora por seus filhos: “Ouve-se uma voz em Ramá”. Mateus aplica essas palavras às crianças mortas em Belém sob Herodes. Depois do exílio os homens de Ramá e Geba, 621 ao todo, voltaram da Babilônia, e Ramá é citada entre os lugares onde os benjamitas viviam no tempo de Neemias. No século IV, Eusébio ainda conhecia Ramá de Benjamim como a cidade de Saul, ao norte de Jerusalém."
  de:
    - "Rama in Benjamin, dessen Name „Höhe“ bedeutet, wird gewöhnlich mit dem Dorf er-Ram gleichgesetzt, auf einem Hügel an der Höhenstraße etwa 8 km nördlich von Jerusalem, zwischen Gibea im Süden und Geba im Osten. Josephus setzt es vierzig Stadien von Jerusalem an, Eusebius sechs oder sieben Meilen nördlich, gegenüber Bethel (der griechische und der lateinische Text seines Onomastikons weichen ab). Dort wurde wenig archäologisch gearbeitet; eine moderne Begehung der Stätte fand viel Keramik der Eisenzeit, wenig der persischen Zeit und wieder mehr aus hellenistischer Zeit."
    - "Rama steht in der Liste der Städte Benjamins. Die Prophetin Debora richtete Israel unter ihrer Palme „zwischen Rama und Beth-El“, und der Levit der Richter erwog auf dem Heimweg, „zu Gibea oder zu Rama“ zu übernachten. Die Samuelbücher nennen Rama als Heimat Samuels, wo er Israel richtete und begraben wurde; das 1. Samuelbuch beginnt in Ramatajim-Zofim. Ob es dieselbe Stadt war, ist umstritten: Manche setzen Samuels Rama hierher, andere anderswohin, etwa nach Nebi Samwil oder weiter nordwestlich nach Rentis."
    - "Rama lag an der Grenze zwischen den beiden Königreichen. Baesa von Israel begann es zu bauen, „daß niemand sollte aus und ein ziehen auf Asas Seite“; Asa von Juda bestach Ben-Hadad von Damaskus, Israel anzugreifen, und als Baesa aufhörte, schaffte Asa seine Steine und sein Holz weg und baute damit Geba und Mizpa. Jesaja sagt, als er ein Heer aus dem Norden gegen Jerusalem ziehen sieht: „Rama erschrickt“. Nach dem Fall Jerusalems 587 oder 586 v. Chr. ließ Nebusaradan Jeremia in Rama frei, wohin er in Ketten unter den Gefangenen nach Babylon gebracht worden war."
    - "Bei Jeremia weint Rahel um ihre Kinder: „Man hört eine klägliche Stimme und bitteres Weinen auf der Höhe“ (Luther gibt den Namen Rama mit „Höhe“ wieder). Matthäus bezieht diese Worte auf die unter Herodes in Bethlehem getöteten Kinder. Nach dem Exil kehrten die Männer von Rama und Geba, insgesamt 621, aus Babylon zurück, und Rama wird unter den Orten genannt, wo Benjaminiter zu Nehemias Zeit wohnten. Im 4. Jahrhundert kannte Eusebius Rama in Benjamin noch als die Stadt Sauls nördlich von Jerusalem."
  fr:
    - "Rama de Benjamin, dont le nom signifie « hauteur », est couramment identifiée au village d’er-Ram, sur une colline au bord de la route de crête, à environ 8 km au nord de Jérusalem, entre Guibea au sud et Guéba à l’est. Flavius Josèphe la met à quarante stades de Jérusalem, et Eusèbe à six ou sept milles au nord, en face de Béthel (les textes grec et latin de son Onomasticon diffèrent). Peu de travaux archéologiques y ont été faits ; une prospection moderne du site a trouvé beaucoup de céramique de l’âge du Fer, peu de l’époque perse et de nouveau davantage de l’époque hellénistique."
    - "Rama figure parmi les villes de Benjamin. La prophétesse Débora jugeait Israël sous son palmier entre Rama et Béthel, et le Lévite des Juges, en route vers chez lui, pensa loger à Guibea ou à Rama. Les livres de Samuel nomment Rama comme la patrie de Samuel, où il jugea Israël et fut enterré ; 1 Samuel s’ouvre à Ramathaïm-Tsophim. S’agit-il de la même ville, c’est disputé : certains placent ici la Rama de Samuel, d’autres ailleurs, par exemple à Nebi Samwil ou plus au nord-ouest, à Rantis."
    - "Rama se trouvait à la frontière entre les deux royaumes. Baescha d’Israël commença à la bâtir pour empêcher quiconque de sortir ou d’entrer chez Asa de Juda ; Asa soudoya Ben-Hadad de Damas pour attaquer Israël, et quand Baescha cessa, Asa emporta ses pierres et son bois et en bâtit Guéba et Mitspa. Ésaïe, décrivant une armée marchant sur Jérusalem depuis le nord, dit que « Rama tremble ». Après la chute de Jérusalem en 587 ou 586 av. J.-C., Nebuzaradan libéra Jérémie à Rama, où il avait été conduit enchaîné parmi les captifs en route pour Babylone."
    - "Chez Jérémie, Rachel pleure ses enfants : « On entend des cris à Rama ». Matthieu applique ces paroles aux enfants tués à Bethléem sous Hérode. Après l’exil, les gens de Rama et de Guéba, 621 en tout, revinrent de Babylone, et Rama est nommée parmi les lieux où vivaient les Benjamites au temps de Néhémie. Au IVe siècle, Eusèbe connaissait encore Rama de Benjamin comme la ville de Saül, au nord de Jérusalem."
  it:
    - "Rama di Beniamino, il cui nome significa «altura», è comunemente identificata con il villaggio di er-Ram, su una collina presso la strada di crinale circa 8 km a nord di Gerusalemme, tra Gabaa a sud e Gheba a est. Giuseppe Flavio la pone a quaranta stadi da Gerusalemme, ed Eusebio a sei o sette miglia a nord, di fronte a Betel (i testi greco e latino del suo Onomasticon differiscono). Vi è stato svolto poco lavoro archeologico; una ricognizione moderna del sito ha trovato molta ceramica dell’età del Ferro, poca del periodo persiano e di nuovo di più di epoca ellenistica."
    - "Rama è elencata tra le città di Beniamino. La profetessa Debora giudicava Israele sotto la sua palma tra Rama e Betel, e il Levita dei Giudici, tornando a casa, pensò di pernottare a Gabaa o a Rama. I libri di Samuele nominano Rama come patria di Samuele, dove giudicò Israele e fu sepolto; 1 Samuele si apre a Ramataim-Zofim. Se fosse la stessa città è controverso: alcuni collocano qui la Rama di Samuele, altri altrove, per esempio a Nebi Samwil o più a nord-ovest a Rantis."
    - "Rama si trovava sul confine tra i due regni. Baasa d’Israele cominciò a costruirla perché nessuno potesse uscire o entrare dalla parte di Asa di Giuda; Asa corruppe Ben-Adad di Damasco perché attaccasse Israele, e quando Baasa smise, Asa portò via le sue pietre e il suo legname e vi costruì Gheba e Mizpa. Isaia, descrivendo un esercito che marcia su Gerusalemme da nord, dice che Rama trema. Dopo la caduta di Gerusalemme nel 587 o 586 a.C., Nebuzaradan liberò Geremia a Rama, dove era stato condotto in catene tra i prigionieri diretti a Babilonia."
    - "In Geremia Rachele piange i suoi figli: «S’è udita una voce in Rama». Matteo applica queste parole ai bambini uccisi a Betlemme sotto Erode. Dopo l’esilio gli uomini di Rama e di Gheba, 621 in tutto, tornarono da Babilonia, e Rama è nominata tra i luoghi in cui abitavano i Beniaminiti ai tempi di Neemia. Nel IV secolo Eusebio conosceva ancora Rama di Beniamino come la città di Saul, a nord di Gerusalemme."
  pl:
    - "Rama w Beniaminie, której nazwa znaczy „wysokość”, jest zwykle utożsamiana z wsią er-Ram, na wzgórzu przy drodze grzbietowej około 8 km na północ od Jerozolimy, między Gibeą na południu a Gebą na wschodzie. Józef Flawiusz umieszcza ją w odległości czterdziestu stadiów od Jerozolimy, a Euzebiusz sześć lub siedem mil na północ, naprzeciw Betel (greckie i łacińskie teksty jego Onomastikonu różnią się). Niewiele tam badań archeologicznych; współczesne badania powierzchniowe znalazły dużo ceramiki z epoki żelaza, mało z okresu perskiego i znów więcej z czasów hellenistycznych."
    - "Rama jest wymieniona wśród miast Beniamina. Prorokini Debora sądziła Izraela pod swoją palmą między Ramą a Betel, a lewita z Księgi Sędziów w drodze do domu myślał o noclegu w Gibei albo w Ramie. Księgi Samuela wymieniają Ramę jako dom Samuela, gdzie sądził Izraela i został pochowany; 1 Księga Samuela zaczyna się w Ramataim-Sofim. Czy było to to samo miasto, jest sporne: jedni umieszczają tu Ramę Samuela, inni gdzie indziej, na przykład w Nebi Samwil albo dalej na północny zachód w Rantis."
    - "Rama leżała na granicy między dwoma królestwami. Baasza z Izraela zaczął ją budować, aby nikt nie mógł wychodzić ani wchodzić do Asy z Judy; Asa przekupił Ben-Hadada z Damaszku, by zaatakował Izraela, a gdy Baasza przerwał, Asa zabrał jej kamienie i drewno i zbudował z nich Gebę i Mispę. Izajasz, opisując armię maszerującą na Jerozolimę z północy, mówi, że Rama się lęka. Po upadku Jerozolimy w 587 lub 586 roku p.n.e. Nebuzaradan uwolnił Jeremiasza w Ramie, dokąd został zaprowadzony w kajdanach wśród jeńców idących do Babilonu."
    - "U Jeremiasza Rachela płacze nad swymi dziećmi: „Głos w Rama słyszany jest”. Mateusz odnosi te słowa do dzieci zabitych w Betlejem za Heroda. Po wygnaniu mężowie z Ramy i Geby, w sumie 621, wrócili z Babilonu, a Rama jest wymieniona wśród miejsc, gdzie mieszkali beniaminici za Nehemiasza. W IV wieku Euzebiusz znał jeszcze Ramę Beniamina jako miasto Saula, na północ od Jerozolimy."
  cs:
    - "Ráma Benjamínova, jejíž jméno znamená „výšina“, se obvykle ztotožňuje s vesnicí er-Rám, na pahorku u hřebenové cesty asi 8 km severně od Jeruzaléma, mezi Gibeou na jihu a Gebou na východě. Josephus ji klade čtyřicet stadií od Jeruzaléma a Eusebius šest či sedm mil na sever, naproti Bét-elu (řecký a latinský text jeho Onomastiku se liší). Archeologických prací se tam provedlo málo; jeden moderní průzkum lokality našel mnoho keramiky z doby železné, málo z doby perské a opět více z helénistické."
    - "Ráma je uvedena mezi městy Benjamínovými. Prorokyně Debora soudila Izraele pod svou palmou mezi Rámou a Bét-elem a levita ze Soudců na cestě domů pomýšlel na nocleh v Gibeji nebo v Ráma. Knihy Samuelovy jmenují Rámu jako domov Samuelův, kde soudil Izraele a byl pohřben; 1. Samuelova začíná v Ramatajim-sófim. Zda šlo o totéž město, je sporné: někteří kladou Samuelovu Rámu sem, jiní jinam, například do Nabí Samvílu nebo dále na severozápad do Rantísu."
    - "Ráma ležela na hranici mezi oběma královstvími. Baeša Izraelský ji začal stavět, aby nikdo nemohl vyjít ani vejít k Asovi Judskému; Asa podplatil Ben-hadada Damašského, aby napadl Izrael, a když Baeša přestal, Asa odvezl její kámen a dříví a vystavěl z nich Gebu a Micpu. Izajáš, popisující vojsko táhnoucí na Jeruzalém od severu, praví, že se Ráma bojí. Po pádu Jeruzaléma roku 587 nebo 586 př. n. l. propustil Nebuzaradan Jeremjáše v Ráma, kam byl odveden v poutech mezi zajatci určenými do Babylóna."
    - "U Jeremjáše pláče Ráchel nad svými dětmi: „Hlas v Ráma slyšán jest“. Matouš tato slova vztahuje na děti pobité v Betlémě za Heroda. Po exilu se z Babylóna vrátili muži z Ráma a Geby, celkem 621, a Ráma je jmenována mezi místy, kde Benjamínci žili v Nehemjášových dnech. Ve 4. století Eusebius ještě znal Rámu Benjamínovu jako Saulovo město severně od Jeruzaléma."
  nl:
    - "Rama van Benjamin, wier naam “hoogte” betekent, wordt algemeen gelijkgesteld met het dorp er-Ram, op een heuvel aan de bergkamweg zo’n 8 km ten noorden van Jeruzalem, tussen Gibea in het zuiden en Geba in het oosten. Josephus plaatst het op veertig stadiën van Jeruzalem, en Eusebius op zes of zeven mijl naar het noorden, tegenover Bethel (de Griekse en Latijnse teksten van zijn Onomasticon verschillen). Er is weinig archeologisch werk verricht; een modern onderzoek van de plaats vond veel aardewerk uit de ijzertijd, weinig uit de Perzische tijd en weer meer uit de hellenistische tijd."
    - "Rama staat vermeld onder de steden van Benjamin. De profetes Debora richtte Israël onder haar palmboom tussen Rama en Bethel, en de Leviet van Richteren dacht op weg naar huis in Gibea of in Rama te overnachten. De boeken van Samuël noemen Rama als de woonplaats van Samuël, waar hij Israël richtte en begraven werd; 1 Samuël opent in Ramataïm-Zofim. Of dat dezelfde stad was, is omstreden: sommigen plaatsen Samuëls Rama hier, anderen elders, bijvoorbeeld bij Nebi Samwil of verder naar het noordwesten bij Rentis."
    - "Rama lag op de grens tussen de twee koninkrijken. Baësa van Israël begon het te bouwen zodat niemand naar Asa van Juda kon uit- of ingaan; Asa omkocht Ben-Hadad van Damascus om Israël aan te vallen, en toen Baësa ophield, nam Asa de stenen en het hout mee en bouwde er Geba en Mizpa mee. Jesaja, die een leger beschrijft dat uit het noorden naar Jeruzalem optrekt, zegt dat Rama bevreesd is. Na de val van Jeruzalem in 587 of 586 v.Chr. liet Nebuzaradan Jeremia bij Rama vrij, waar hij in ketenen was gebracht onder de gevangenen op weg naar Babylon."
    - "Bij Jeremia weent Rachel om haar kinderen: “Er is een stem gehoord in Rama”. Mattheüs past deze woorden toe op de kinderen die onder Herodes te Bethlehem werden gedood. Na de ballingschap keerden de mannen van Rama en Geba, 621 in totaal, uit Babylon terug, en Rama wordt genoemd onder de plaatsen waar de Benjaminieten in Nehemia’s tijd woonden. In de 4e eeuw kende Eusebius Rama van Benjamin nog als de stad van Saul, ten noorden van Jeruzalem."
  sv:
    - "Benjamins Rama, vars namn betyder ”höjd”, identifieras vanligen med byn er-Ram, på en kulle vid åsvägen cirka 8 km norr om Jerusalem, mellan Giva i söder och Geba i öster. Josefus placerar det fyrtio stadier från Jerusalem, och Eusebios sex eller sju romerska mil norrut, mitt emot Betel (de grekiska och latinska texterna i hans Onomastikon skiljer sig åt). Lite arkeologiskt arbete har gjorts där; en modern undersökning av platsen fann mycket keramik från järnåldern, litet från persertiden och åter mer från hellenistisk tid."
    - "Rama förtecknas bland Benjamins städer. Profetissan Debora dömde Israel under sin palm mellan Rama och Betel, och leviten i Domarboken tänkte, på väg hem, övernatta i Giva eller i Rama. Samuelsböckerna nämner Rama som Samuels hem, där han dömde Israel och blev begravd; Första Samuelsboken inleds i Ramatajim-Sofim. Om detta var samma stad är omstritt: vissa placerar Samuels Rama här, andra på annat håll, till exempel vid Nebi Samwil eller längre nordväst vid Rentis."
    - "Rama låg på gränsen mellan de två kungadömena. Basha av Israel började bygga ut det så att ingen kunde gå ut eller in till Asa av Juda; Asa mutade Ben-Hadad av Damaskus att angripa Israel, och när Basha slutade förde Asa bort dess stenar och timmer och byggde Geba och Mispa med dem. Jesaja, som beskriver en armé som marscherar mot Jerusalem från norr, säger att Rama är rädd. Efter Jerusalems fall 587 eller 586 f.Kr. frigav Nebusaradan Jeremia i Rama, dit han hade förts i kedjor bland de fångar som var på väg till Babylon."
    - "Hos Jeremia gråter Rakel över sina barn: ”Ett rop höres i Rama”. Matteus tillämpar dessa ord på barnen som dödades i Betlehem under Herodes. Efter exilen återvände männen från Rama och Geba, 621 sammanlagt, från Babylon, och Rama nämns bland platserna där benjaminiterna bodde på Nehemjas tid. På 300-talet kände Eusebios fortfarande Rama i Benjamin som Sauls stad, norr om Jerusalem."
  nb:
    - "Benjamins Rama, hvis navn betyr «høyde», identifiseres vanligvis med landsbyen er-Ram, på en høyde ved åsryggveien omtrent 8 km nord for Jerusalem, mellom Gibea i sør og Geba i øst. Josefus plasserer den førti stadier fra Jerusalem, og Eusebius seks eller sju romerske mil mot nord, rett overfor Betel (de greske og latinske tekstene av hans Onomasticon er ulike). Lite arkeologisk arbeid er gjort der; en moderne undersøkelse av stedet fant mye keramikk fra jernalderen, lite fra persertiden og mer igjen fra hellenistisk tid."
    - "Rama er oppført blant Benjamins byer. Profetinnen Debora dømte Israel under sin palme mellom Rama og Betel, og levitten i Dommernes bok tenkte på vei hjem å overnatte i Gibea eller i Rama. Samuelsbøkene nevner Rama som Samuels hjemsted, der han dømte Israel og ble begravet; 1. Samuelsbok åpner i Ramatajim-Sofim. Om dette var den samme byen, er omstridt: noen plasserer Samuels Rama her, andre andre steder, for eksempel ved Nebi Samwil eller lenger nordvest ved Rentis."
    - "Rama lå på grensen mellom de to kongerikene. Basja av Israel begynte å bygge den for at ingen skulle kunne dra ut eller inn til Asa av Juda; Asa bestakk Ben-Hadad av Damaskus til å angripe Israel, og da Basja stanset, bar Asa bort steinene og tømmeret og bygde Geba og Mispa med dem. Jesaja, som beskriver en hær på marsj mot Jerusalem fra nord, sier at Rama er redd. Etter Jerusalems fall i 587 eller 586 f.Kr. løslot Nebusaradan Jeremia i Rama, dit han var tatt i lenker blant fangene på vei til Babylon."
    - "Hos Jeremia gråter Rakel over barna sine: «En røst høres i Rama». Matteus anvender disse ordene på barna som ble drept i Betlehem under Herodes. Etter eksilet vendte mennene fra Rama og Geba, 621 i alt, tilbake fra Babylon, og Rama er nevnt blant stedene der benjaminittene bodde på Nehemjas tid. På 300-tallet kjente Eusebius fortsatt Rama i Benjamin som Sauls by, nord for Jerusalem."
  tl:
    - "Ang Rama ng Benjamin, na ang pangalan ay nangangahulugang “taas”, ay karaniwang kinikilala sa nayon ng er-Ram, sa isang burol sa tabi ng daan sa tagaytay na mga 8 km sa hilaga ng Jerusalem, sa pagitan ng Gibea sa timog at Geba sa silangan. Inilalagay ito ni Josephus nang apatnapung stadia mula sa Jerusalem, at ni Eusebio nang anim o pitong milya sa hilaga, sa tapat ng Beth-el (nagkakaiba ang tekstong Griyego at Latin ng kaniyang Onomasticon). Kaunting gawaing arkeolohikal ang ginawa roon; nakatagpo ang isang makabagong pagsisiyasat sa lugar ng maraming palayok ng Panahong Bakal, kaunti mula sa panahong Persiyano at higit pa muli mula sa panahong Helenistiko."
    - "Nakalista ang Rama sa mga lungsod ng Benjamin. Ang propetisang si Debora ay naghukom sa Israel sa ilalim ng kaniyang puno ng palma sa pagitan ng Rama at Beth-el, at ang Levita ng Mga Hukom, sa kaniyang pag-uwi, ay nag-isip na tumuloy sa Gibea o sa Rama. Pinangangalanan ng mga aklat ni Samuel ang Rama bilang tahanan ni Samuel, kung saan siya naghukom sa Israel at inilibing; nagsisimula ang 1 Samuel sa Ramathaim-sophim. Pinagtatalunan kung iisang bayan ito: inilalagay ng ilan ang Rama ni Samuel dito, ng iba sa ibang lugar, halimbawa sa Nebi Samwil o mas hilagang-kanluran sa Rentis."
    - "Ang Rama ay nasa hangganan ng dalawang kaharian. Sinimulan ni Baasa ng Israel na itayo ito upang walang makalabas o makapasok kay Asa ng Juda; sinuhulan ni Asa si Ben-adad ng Damasco na salakayin ang Israel, at nang tumigil si Baasa, dinala ni Asa ang mga bato at kahoy nito at itinayo ang Geba at Mizpa mula rito. Sa paglalarawan ni Isaias sa isang hukbong nagmamartsa mula sa hilaga patungong Jerusalem, sinasabing nanginginig ang Rama. Pagkatapos bumagsak ang Jerusalem noong 587 o 586 BK, pinalaya ni Nabuzaradan si Jeremias sa Rama, kung saan siya dinala nang nakagapos kasama ng mga bihag na patungo sa Babilonia."
    - "Sa Jeremias, umiiyak si Raquel para sa kaniyang mga anak: “Isang tinig ay narinig sa Rama”. Ikinakapit ni Mateo ang mga salitang ito sa mga batang pinatay sa Bethlehem sa ilalim ni Herodes. Pagkatapos ng pagkatapon, bumalik mula sa Babilonia ang mga lalaki ng Rama at Geba, 621 lahat, at pinangalanan ang Rama sa mga lugar kung saan nanirahan ang mga Benjaminita sa panahon ni Nehemias. Noong ika-4 na siglo, kilala pa rin ni Eusebio ang Rama ng Benjamin bilang lungsod ni Saul, sa hilaga ng Jerusalem."
  da:
    - "Benjamins Rama, hvis navn betyder »højde«, identificeres almindeligvis med landsbyen er-Ram, på en bakke ved højderygvejen omkring 8 km nord for Jerusalem, mellem Gibea mod syd og Geba mod øst. Josefus placerer den fyrre stadier fra Jerusalem, og Eusebius seks eller syv romerske mil mod nord, over for Betel (de græske og latinske tekster af hans Onomasticon er forskellige). Der er udført lidt arkæologisk arbejde dér; en moderne undersøgelse af stedet fandt meget keramik fra jernalderen, lidt fra persertiden og igen mere fra hellenistisk tid."
    - "Rama er opregnet blandt Benjamins byer. Profetinden Debora dømte Israel under sit palmetræ mellem Rama og Betel, og leviten i Dommerbogen tænkte på sin vej hjem på at overnatte i Gibea eller i Rama. Samuelsbøgerne nævner Rama som Samuels hjem, hvor han dømte Israel og blev begravet; 1 Samuelsbog åbner i Ramatajim-Sofim. Om det var den samme by, er omstridt: nogle placerer Samuels Rama her, andre andetsteds, for eksempel ved Nebi Samwil eller længere mod nordvest ved Rentis."
    - "Rama lå på grænsen mellem de to kongeriger. Basja af Israel begyndte at bygge den, for at ingen skulle gå ud eller ind til Asa af Juda; Asa bestak Ben-Hadad af Damaskus til at angribe Israel, og da Basja holdt op, bar Asa dens sten og tømmer bort og byggede Geba og Mispa med dem. Esajas, der beskriver en hær, som marcherer mod Jerusalem fra nord, siger, at Rama er bange. Efter Jerusalems fald i 587 eller 586 f.Kr. løslod Nebuzaradan Jeremias i Rama, hvor han var blevet ført i lænker blandt de fanger, der skulle til Babylon."
    - "Hos Jeremias græder Rakel over sine børn: »Der er hørt en Røst i Rama«. Mattæus anvender disse ord på børnene, der blev dræbt i Betlehem under Herodes. Efter eksilet vendte Ramas og Gebas mænd, 621 i alt, tilbage fra Babylon, og Rama nævnes blandt de steder, hvor benjamitterne boede i Nehemias' dage. I 300-tallet kendte Eusebius stadig Benjamins Rama som Sauls by, nord for Jerusalem."
  sr:
    - "Рама Венијаминова, чије име значи „висина“, обично се поистовећује са селом ер-Рам, на брду поред гребенског пута око 8 км северно од Јерусалима, између Гаваје на југу и Геве на истоку. Јосиф Флавије је смешта четрдесет стадија од Јерусалима, а Јевсевије шест или седам миља северно, насупрот Ветиљу (грчки и латински текст његовог Ономастикона разликују се). Мало је археолошког рада ту обављено; савремени преглед налазишта нашао је много керамике гвозденог доба, мало из персијског периода и поново више из хеленистичког."
    - "Рама је наведена међу градовима Венијаминовим. Пророчица Девора судила је Израиљу под својом палмом између Раме и Ветиља, а левит из Судија, на путу кући, мислио је да ноћи у Гаваји или у Рами. Књиге Самуилове именују Раму као дом Самуилов, где је судио Израиљу и где је погребен; 1. Самуилова почиње у Раматајим-Софиму. Да ли је то био исти град, спорно је: неки Самуилову Раму смештају овде, други другде, на пример у Неби Самвил или даље северозападно у Рентис."
    - "Рама је лежала на граници између два краљевства. Васа Израиљев почео ју је градити да нико не може ни изићи ни доћи к Аси Јудином; Аса је подмитио Вен-Адада Дамаског да нападне Израиљ, а кад је Васа престао, Аса је однео њено камење и дрва и од њих саградио Геву и Масфу. Исаија, описујући војску која маршира на Јерусалим са севера, каже да се Рама препала. Пошто је Јерусалим пао 587. или 586. п. н. е., Невузардан је пустио Јеремију у Рами, где је био одведен у оковима међу заробљеницима на путу у Вавилон."
    - "Код Јеремије Рахиља плаче за својом децом: „Глас у Рами чу се“. Матеј примењује те речи на децу побијену у Витлејему за Ирода. После изгнанства људи Раме и Геве, њих 621, вратили су се из Вавилона, а Рама је наведена међу местима где су Венијаминци живели у Немијино доба. У 4. веку Јевсевије је још знао Раму Венијаминову као Саулов град северно од Јерусалима."
