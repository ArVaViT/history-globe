body:
  en:
    - "Tiphsah, “ford” or “crossing”, marks the north-eastern end of Solomon's realm: “he had dominion over all the region on this side the river, from Tiphsah even to Azzah, over all the kings on this side the river”. It is usually taken to be Thapsacus, the great crossing of the middle Euphrates known from Greek writers, and the map follows this. The Tiphsah that Menahem sacked “from Tirzah” is generally held to be another place, near Tirzah in the hills of Samaria; some read Tappuah there."
    - "In 401 BC Cyrus the Younger halted for five days at Thapsacus, then a large and prosperous city, before leading his Greek mercenaries across the Euphrates against his brother; Xenophon tells the story. In 331 BC Alexander crossed there on two bridges of boats on his way to Gaugamela, as Arrian relates. Strabo, after Eratosthenes, speaks of the old bridge of the Euphrates at Thapsacus. Its site is still disputed: proposals range from the Carchemish area (Farrell, Engels) and Zeugma (Gawlikowski) to Jebel Khalid, Dibsi Faraj and Balis, all in today's northern Syria or south-eastern Turkey."
  ru:
    - "Типсах, «брод» или «переправа», отмечает северо-восточный конец царства Соломона: «он владычествовал над всею землею по эту сторону реки, от Типсаха до Газы, над всеми царями по эту сторону реки». Его обычно понимают как Фапсак, большую переправу через средний Евфрат, известную греческим писателям, и карта следует этому. Типсах, который Менаим разорил, «начиная от Фирцы», обычно считают другим местом, близ Фирцы в горах Самарии; некоторые читают там Таппуах."
    - "В 401 г. до н. э. Кир Младший пять дней стоял в Фапсаке, тогда большом и богатом городе, прежде чем повести своих греческих наёмников через Евфрат против брата; об этом рассказывает Ксенофонт. В 331 г. до н. э. там по двум наплавным мостам переправился Александр на пути к Гавгамелам, как пишет Арриан. Страбон вслед за Эратосфеном говорит о старом мосте через Евфрат у Фапсака. Его место до сих пор спорно: предложения простираются от окрестностей Каркемиша (Фаррелл, Энгельс) и Зевгмы (Гавликовский) до Джебель-Халида, Дибси-Фараджа и Балиса — всё на нынешнем севере Сирии или юго-востоке Турции."
  cs:
    - "Tifsach, „brod“ nebo „přechod“, vyznačuje severovýchodní konec Šalomounovy říše: „On zajisté panoval všudy s této strany řeky od Tipsach až do Gázy nade všemi králi, kteříž byli před řekou.“ Obvykle se pokládá za Thapsakos, velký přechod středního Eufratu známý z řeckých autorů, a mapa tento názor sleduje. Tifsach, které Menachem vyplenil „od Tersa“, se obecně pokládá za jiné místo, blízko Tirsy v samařských horách; někteří tam čtou Tapúach."
    - "V roce 401 př. n. l. se Kýros Mladší zastavil v Thapsaku, tehdy velkém a prosperujícím městě, na pět dní, než vedl své řecké žoldnéře přes Eufrat proti bratrovi; příběh vypráví Xenofón. V roce 331 př. n. l. tam Alexandr přešel po dvou lodních mostech na cestě ke Gaugamelám, jak líčí Arrianos. Strabón po Eratosthenovi mluví o starém mostě přes Eufrat u Thapsaku. Jeho poloha je dosud sporná: návrhy sahají od oblasti Karkemíše (Farrell, Engels) a Zeugmatu (Gawlikowski) po Džabal Chálid, Dibsi Faradž a Bális, vše v dnešní severní Sýrii nebo jihovýchodním Turecku."
  uk:
    - "Тіфсах, «брід» або «переправа», позначає північно-східний край царства Соломона: «Бо він панував над усією землею по тім боцї ріки, від Типсаха до Гази, над усїма царями по тім боцї ріки». Його зазвичай вважають Тапсаком, великою переправою середнього Євфрату, відомою з грецьких авторів, і мапа йде за цим. Тіфсах, який Менаім пограбував «від Тирзи», загалом вважають іншим місцем, поблизу Тірци в горах Самарії; дехто читає там Таппуах."
    - "401 р. до н. е. Кір Молодший п'ять днів стояв у Тапсаку, тоді великому й заможному місті, а потім повів своїх грецьких найманців через Євфрат проти брата; цю історію розповідає Ксенофонт. 331 р. до н. е. Александр переправився там двома мостами з човнів по дорозі до Гавгамел, як оповідає Арріан. Страбон за Ератосфеном говорить про старий міст через Євфрат у Тапсаку. Його місце досі спірне: пропозиції йдуть від околиць Каркемиша (Фаррелл, Енгельс) і Зевгми (Гавліковський) до Джебель-Халіда, Дібсі-Фарадж і Баліса, усе в нинішній північній Сирії чи південно-східній Туреччині."
  pl:
    - "Tifsach, „bród” lub „przeprawa”, wyznacza północno-wschodni kraniec królestwa Salomona: „panował wszędy z tej strony rzeki od Tasfa aż do Gazy nad wszystkimi królmi, którzy byli przed rzeką”. Uważa się je zwykle za Tapsakus, wielką przeprawę przez środkowy Eufrat znaną z pisarzy greckich, i mapa idzie za tym. Tifsach, które Menachem złupił „od Tersy”, uważa się powszechnie za inne miejsce, koło Tirsy we wzgórzach Samarii; niektórzy czytają tam Tappuach."
    - "W 401 p.n.e. Cyrus Młodszy zatrzymał się w Tapsakus na pięć dni, wówczas dużym i zamożnym mieście, zanim poprowadził swoich greckich najemników przez Eufrat przeciw bratu; opowiada o tym Ksenofont. W 331 p.n.e. Aleksander przeprawił się tam po dwóch mostach łodziowych w drodze do Gaugameli, jak opisuje Arrian. Strabon, za Eratostenesem, mówi o dawnym moście na Eufracie w Tapsakus. Jego położenie jest nadal sporne: propozycje sięgają od okolic Karkemisz (Farrell, Engels) i Zeugmy (Gawlikowski) po Dżabal Chalid, Dibsi Faradż i Balis, wszystko w dzisiejszej północnej Syrii lub południowo-wschodniej Turcji."
  es:
    - "Tifsa, «vado» o «paso», marca el extremo nororiental del reino de Salomón: «señoreaba en toda la región que estaba de la otra parte del río, desde Tiphsa hasta Gaza, sobre todos los reyes de la otra parte del río». Suele identificarse con Tapsaco, el gran paso del Éufrates medio conocido por los autores griegos, y el mapa lo sigue. La Tifsa que Manahem saqueó «desde Thirsa» se tiene por lo general por otro lugar, cerca de Tirsa, en las colinas de Samaria; algunos leen allí Tapúa."
    - "En 401 a. C. Ciro el Joven se detuvo cinco días en Tapsaco, entonces una ciudad grande y próspera, antes de conducir a sus mercenarios griegos al otro lado del Éufrates contra su hermano; Jenofonte cuenta la historia. En 331 a. C. Alejandro cruzó allí sobre dos puentes de barcas camino de Gaugamela, según refiere Arriano. Estrabón, a partir de Eratóstenes, habla del antiguo puente del Éufrates en Tapsaco. Su emplazamiento sigue discutido: las propuestas van de la zona de Carquemis (Farrell, Engels) y Zeugma (Gawlikowski) a Yebel Khalid, Dibsi Faraj y Balis, todos en el actual norte de Siria o sureste de Turquía."
  pt:
    - "Tifsa, “vau” ou “travessia”, marca a extremidade nordeste do reino de Salomão: “tinha domínio sobre tudo deste lado do Rio, desde Tifsa até Gaza, sobre todos os reis deste lado do Rio”. É geralmente tomada por Tapsaco, a grande travessia do médio Eufrates conhecida dos escritores gregos, e o mapa segue isso. A Tifsa que Menaém saqueou “desde Tirza” é em geral tida por outro lugar, perto de Tirza, nas colinas de Samaria; alguns leem ali Tapua."
    - "Em 401 a.C. Ciro, o Moço, parou cinco dias em Tapsaco, então uma cidade grande e próspera, antes de conduzir seus mercenários gregos através do Eufrates contra o irmão; Xenofonte conta a história. Em 331 a.C. Alexandre atravessou ali em duas pontes de barcos a caminho de Gaugamela, como relata Arriano. Estrabão, a partir de Eratóstenes, fala da antiga ponte do Eufrates em Tapsaco. Seu sítio ainda é disputado: as propostas vão da região de Carquêmis (Farrell, Engels) e de Zeugma (Gawlikowski) a Jebel Khalid, Dibsi Faraj e Balis, todos no atual norte da Síria ou sudeste da Turquia."
  de:
    - "Tifsach, „Furt“ oder „Übergang“, bezeichnet das nordöstliche Ende von Salomos Reich: „Denn er herrschte im ganzen Lande diesseit des Stromes, von Tiphsah bis gen Gaza, über alle Könige diesseit des Stromes“. Es wird gewöhnlich für Tapsakus gehalten, den großen Übergang über den mittleren Euphrat, der aus griechischen Schriftstellern bekannt ist, und die Karte folgt dem. Das Tifsach, das Menahem „von Thirza aus“ plünderte, gilt allgemein als ein anderer Ort, nahe Tirza im Bergland von Samaria; manche lesen dort Tappuach."
    - "Im Jahr 401 v. Chr. rastete Kyros der Jüngere fünf Tage in Tapsakus, damals einer großen und wohlhabenden Stadt, bevor er seine griechischen Söldner über den Euphrat gegen seinen Bruder führte; Xenophon erzählt die Geschichte. Im Jahr 331 v. Chr. überschritt Alexander dort auf zwei Schiffsbrücken den Fluss auf dem Weg nach Gaugamela, wie Arrian berichtet. Strabon spricht nach Eratosthenes von der alten Brücke über den Euphrat bei Tapsakus. Ihre Lage ist noch umstritten: Die Vorschläge reichen von der Gegend von Karkemisch (Farrell, Engels) und Zeugma (Gawlikowski) bis zum Dschebel Chalid, Dibsi Faradsch und Balis, alle im heutigen Nordsyrien oder Südosten der Türkei."
  fr:
    - "Thiphsach, « gué » ou « passage », marque l’extrémité nord-est du royaume de Salomon : « Il dominait sur tout le pays de l’autre côté du fleuve, depuis Thiphsach jusqu’à Gaza, sur tous les rois de l’autre côté du fleuve ». On y voit d’ordinaire Thapsaque, le grand passage de l’Euphrate moyen connu des auteurs grecs, et la carte suit cet avis. Le Thiphsach que Menahem mit à sac « avec son territoire depuis Thirtsa » est généralement tenu pour un autre lieu, près de Thirtsa dans les collines de Samarie ; certains y lisent Tappuach."
    - "En 401 av. J.-C., Cyrus le Jeune fit halte cinq jours à Thapsaque, alors ville grande et prospère, avant de conduire ses mercenaires grecs de l’autre côté de l’Euphrate contre son frère ; Xénophon raconte l’épisode. En 331 av. J.-C., Alexandre y passa sur deux ponts de bateaux en route vers Gaugamèles, comme le rapporte Arrien. Strabon, d’après Ératosthène, parle de l’ancien pont de l’Euphrate à Thapsaque. Son site reste disputé : les propositions vont de la région de Carkemisch (Farrell, Engels) et de Zeugma (Gawlikowski) à Djebel Khalid, Dibsi Faraj et Balis, tous dans l’actuel nord de la Syrie ou sud-est de la Turquie."
  it:
    - "Tifsach, «guado» o «passaggio», segna l’estremità nord-orientale del regno di Salomone: «Egli dominava su tutto il paese di qua dal fiume, da Tifsa fino a Gaza, su tutti i re di qua dal fiume». È di solito identificata con Tapsaco, il grande guado dell’Eufrate medio noto dagli autori greci, e la carta segue questa ipotesi. La Tifsach che Menachem saccheggiò «partito da Tirtsa» è ritenuta in genere un altro luogo, vicino a Tirza sulle colline di Samaria; alcuni vi leggono Tappuach."
    - "Nel 401 a.C. Ciro il Giovane sostò cinque giorni a Tapsaco, allora una città grande e prospera, prima di condurre i suoi mercenari greci attraverso l’Eufrate contro il fratello; Senofonte racconta la vicenda. Nel 331 a.C. Alessandro vi passò su due ponti di barche diretto a Gaugamela, come narra Arriano. Strabone, da Eratostene, parla dell’antico ponte dell’Eufrate a Tapsaco. Il suo sito è ancora discusso: le proposte vanno dall’area di Carchemis (Farrell, Engels) e da Zeugma (Gawlikowski) a Jebel Khalid, Dibsi Faraj e Balis, tutte nell’odierna Siria settentrionale o Turchia sud-orientale."
  nl:
    - "Tifsach, ‘doorwaadbare plaats’ of ‘overgang’, markeert het noordoostelijke einde van Salomo's rijk: “hij had heerschappij over al wat op deze zijde der rivier was van Thifsah tot aan Gaza, over alle koningen op deze zijde der rivier”. Het wordt gewoonlijk opgevat als Thapsacus, de grote oversteekplaats van de middenloop van de Eufraat die uit Griekse schrijvers bekend is, en de kaart volgt dit. Het Tifsach dat Menachem plunderde “van Thirza af” wordt algemeen voor een andere plaats gehouden, bij Tirza in het bergland van Samaria; sommigen lezen daar Tappuach."
    - "In 401 v.Chr. hield Cyrus de Jongere vijf dagen halt bij Thapsacus, toen een grote en welvarende stad, voordat hij zijn Griekse huurlingen over de Eufraat tegen zijn broer voerde; Xenophon vertelt het verhaal. In 331 v.Chr. stak Alexander er over op twee schipbruggen op weg naar Gaugamela, zoals Arrianus meedeelt. Strabo spreekt, naar Eratosthenes, van de oude brug over de Eufraat bij Thapsacus. De ligging is nog omstreden: de voorstellen lopen uiteen van de omgeving van Karkemis (Farrell, Engels) en Zeugma (Gawlikowski) tot Jebel Khalid, Dibsi Faraj en Balis, alle in het huidige noorden van Syrië of zuidoosten van Turkije."
  sv:
    - "Tifsach, ”vadställe” eller ”övergång”, markerar den nordöstra änden av Salomos rike: ”han rådde över hela landet på andra sidan floden, ifrån Tifsa ända till Gasa, över alla konungar på andra sidan floden”. Det anses vanligen vara Thapsakos, den stora övergången över mellersta Eufrat som är känd från grekiska författare, och kartan följer detta. Tifsach som Menachem plundrade ”från Tirsa” anses allmänt vara en annan plats, nära Tirsa i Samariens berg; några läser Tappuach där."
    - "År 401 f.Kr. stannade Kyros den yngre i fem dagar vid Thapsakos, då en stor och välmående stad, innan han förde sina grekiska legosoldater över Eufrat mot sin bror; Xenofon berättar historien. År 331 f.Kr. gick Alexander över där på två båtbroar på väg till Gaugamela, som Arrianos berättar. Strabon, efter Eratosthenes, talar om den gamla Eufratbron vid Thapsakos. Dess läge är fortfarande omstritt: förslagen sträcker sig från Karkemishtrakten (Farrell, Engels) och Zeugma (Gawlikowski) till Jebel Khalid, Dibsi Faraj och Balis, alla i dagens norra Syrien eller sydöstra Turkiet."
  nb:
    - "Tifsah, «vadested» eller «overgang», markerer den nordøstlige enden av Salomos rike: «han rådet over hele landet vestenfor elven, fra Tifsah like til Gasa, over alle kongene vestenfor elven». Den antas vanligvis å være Tapsakus, den store overgangen over midtre Eufrat kjent fra greske forfattere, og kartet følger dette. Tifsah som Menahem herjet «fra Tirsa», regnes vanligvis for å være et annet sted, nær Tirsa i åsene i Samaria; noen leser Tappuah der."
    - "I 401 f.Kr. holdt Kyros den yngre hvil i fem dager i Tapsakus, den gang en stor og velstående by, før han førte sine greske leiesoldater over Eufrat mot broren sin; Xenofon forteller historien. I 331 f.Kr. krysset Aleksander der på to flåtebroer på vei til Gaugamela, slik Arrian forteller. Strabon, etter Eratosthenes, taler om den gamle broen over Eufrat ved Tapsakus. Beliggenheten er fortsatt omstridt: forslagene spenner fra Karkemisj-området (Farrell, Engels) og Zeugma (Gawlikowski) til Jebel Khalid, Dibsi Faraj og Balis, alle i dagens nordlige Syria eller sørøstlige Tyrkia."
  tl:
    - "Ang Tiphsa, “tawiran” o “daanan”, ang nagmamarka sa hilagang-silangang dulo ng kaharian ni Salomon: “sakop niya ang buong lupain ng dakong ito ng Ilog, mula sa Tiphsa hanggang sa Gaza, sa lahat ng mga hari sa dakong ito ng Ilog”. Karaniwan itong itinuturing na Thapsacus, ang dakilang tawiran ng gitnang Eufrates na kilala sa mga manunulat na Griego, at sinusunod ito ng mapa. Ang Tiphsa na nilooban ni Manahem “mula sa Thirza” ay karaniwang itinuturing na ibang lugar, malapit sa Tirsa sa mga burol ng Samaria; binabasa roon ng ilan ang Tappua."
    - "Noong 401 BK, huminto nang limang araw si Ciro na Nakababata sa Thapsacus, noo'y malaki at masaganang lunsod, bago pangunahan ang kaniyang mga upahang Griego sa kabila ng Eufrates laban sa kapatid niya; isinasalaysay ito ni Xenophon. Noong 331 BK, tumawid doon si Alejandro sa dalawang tulay na bangka patungong Gaugamela, ayon kay Arriano. Binabanggit ni Estrabon, mula kay Eratosthenes, ang lumang tulay ng Eufrates sa Thapsacus. Pinagtatalunan pa rin ang pook nito: ang mga mungkahi ay mula sa rehiyon ng Carchemis (Farrell, Engels) at Zeugma (Gawlikowski) hanggang sa Jebel Khalid, Dibsi Faraj at Balis, na pawang nasa hilagang Siria o timog-silangang Turkey ngayon."
  da:
    - "Tifsa, »vadested« eller »overgang«, markerer den nordøstlige ende af Salomos rige: »han herskede i alt det, som laa paa denne Side af Floden, fra Thipsa og indtil Gaza, over alle Konger paa denne Side af Floden«. Det regnes sædvanligvis for Thapsakos, den store overgang over den midterste Eufrat kendt fra græske forfattere, og kortet følger dette. Den Tifsa, som Menahem plyndrede, »da han drog ud fra Thirza«, regnes almindeligvis for et andet sted, nær Tirsa i Samarias bjerge; nogle læser Tappua dér."
    - "I 401 f.Kr. gjorde Kyros den Yngre holdt fem dage i Thapsakos, dengang en stor og velstående by, før han førte sine græske lejesoldater over Eufrat mod sin bror; Xenofon fortæller historien. I 331 f.Kr. krydsede Alexander dér på to bådbroer på vej til Gaugamela, som Arrian beretter. Strabon taler efter Eratosthenes om den gamle bro over Eufrat ved Thapsakos. Dens sted er stadig omstridt: forslagene spænder fra Karkemisj-området (Farrell, Engels) og Zeugma (Gawlikowski) til Jebel Khalid, Dibsi Faraj og Balis, alle i nutidens nordlige Syrien eller sydøstlige Tyrkiet."
