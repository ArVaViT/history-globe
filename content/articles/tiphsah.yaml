# Overview article (ADR 0007). Tiphsah of 1 Kgs 4:24 is usually taken as Thapsacus, the Euphrates crossing (the map's point), whose site is itself disputed; the Tiphsah of 2 Kgs 15:16 is a different place (see tappuah.yaml).
id: tiphsah
