# Overview article (ADR 0007). Secacah: Khirbet es-Samrah in the Buqei'a (Cross & Milik 1956; the map's point) and Khirbet Qumran (Allegro; Eshel 1995) are shown without choosing; Cross & Milik's Qumran = City of Salt noted; the Copper Scroll references follow 3Q15.
