body:
  en:
    - "Secacah was one of the six towns of Judah's wilderness district by the Dead Sea: “In the wilderness, Beth-arabah, Middin, and Secacah, And Nibshan, and the city of Salt, and En-gedi; six cities with their villages.” It is named only here in the Bible. In 1956 Frank Moore Cross and Józef Milik, who explored the Iron Age sites of the Buqei'a, the upland valley behind Qumran, placed it at Khirbet es-Samrah, a walled Iron Age settlement there; the map follows this."
    - "Secacah reappears in the Copper Scroll (3Q15) from Qumran Cave 3, a list of hidden treasures, which names it several times among the hiding places and speaks of its dam and its aqueduct. John Allegro, who first published the scroll, identified Secacah with Khirbet Qumran itself, near the Buqei'a, and Hanan Eshel later argued the same; the water system of Qumran, of the early Roman period, fits the scroll's description. Cross and Milik, like Martin Noth, had instead taken Qumran to be the City of Salt of the same list. Qumran, too, was first settled in the Iron Age. Both sites lie today in the West Bank, near the north-western shore of the Dead Sea."
  ru:
    - "Секаха — один из шести городов пустынного округа Иуды у Мёртвого моря: «В пустыне: Беф-Арава, Миддин и Секаха, Нившан, Ир-Мелах и Ен-Геди: шесть городов с их селами». В Библии он назван только здесь. В 1956 г. Фрэнк Мур Кросс и Юзеф Милик, обследовавшие поселения железного века в Букейе, горной долине за Кумраном, поместили его в Хирбет-эс-Самре, обнесённом стеной поселении железного века; карта следует этому."
    - "Секаха снова появляется в Медном свитке (3Q15) из третьей кумранской пещеры, списке спрятанных сокровищ, который несколько раз называет её среди тайников и говорит о её плотине и водоводе. Джон Аллегро, первым издавший свиток, отождествлял Секаху с самим Хирбет-Кумраном близ Букейи, а позднее то же доказывал Ханан Эшель; водная система Кумрана раннеримского времени соответствует описанию свитка. Кросс и Милик, как и Мартин Нот, напротив, видели в Кумране Ир-Мелах из того же списка. Кумран тоже был впервые заселён в железном веке. Оба места находятся сегодня на Западном берегу, у северо-западного берега Мёртвого моря."
  uk:
    - "Секаха була одним із шести міст юдейського пустельного округу біля Мертвого моря: «У степу: Бет-Арава, Миддин, Секаха, Нибсан та Солоний город та Енгеди — шість хородів з їх селами». У Біблії вона названа лише тут. 1956 р. Френк Мур Кросс і Юзеф Мілік, які досліджували місця залізної доби в Букеї, високогірній долині за Кумраном, розмістили її в Хірбет-ес-Самрі, обнесеному муром поселенні залізної доби там; мапа йде за цим."
    - "Секаха з'являється знову в Мідному сувої (3Q15) з кумранської печери 3, переліку прихованих скарбів, який кілька разів називає її серед схованок і говорить про її греблю та акведук. Джон Аллегро, який перший опублікував сувій, ототожнив Секаху із самим Хірбет-Кумраном, поблизу Букеї, і Ханан Ешель пізніше обстоював те саме; водна система Кумрана ранньоримського періоду відповідає опису сувою. Кросс і Мілік, як і Мартін Нот, натомість вважали Кумран Солоним містом із того самого переліку. Кумран також уперше заселили в залізну добу. Обидва місця лежать нині на Західному березі, поблизу північно-західного берега Мертвого моря."
  es:
    - "Secaca era una de las seis ciudades del distrito desértico de Judá junto al mar Muerto: «En el desierto, Beth-araba, Middín, y Sechâchâ, Y Nibsan, y la ciudad de la sal, y Engedi; seis ciudades con sus aldeas». Solo se nombra aquí en la Biblia. En 1956 Frank Moore Cross y Józef Milik, que exploraron los yacimientos de la edad del Hierro de la Buqeia, el valle elevado detrás de Qumrán, la situaron en Khirbet es-Samrah, un asentamiento amurallado de la edad del Hierro allí; el mapa lo sigue."
    - "Secaca reaparece en el Rollo de Cobre (3Q15) de la Cueva 3 de Qumrán, una lista de tesoros ocultos, que la nombra varias veces entre los escondrijos y habla de su presa y su acueducto. John Allegro, primer editor del rollo, identificó Secaca con la propia Khirbet Qumrán, cerca de la Buqeia, y Hanan Eshel sostuvo después lo mismo; el sistema hidráulico de Qumrán, de principios de la época romana, concuerda con la descripción del rollo. Cross y Milik, como Martin Noth, habían tomado en cambio Qumrán por la Ciudad de la Sal de la misma lista. También Qumrán se pobló por primera vez en la edad del Hierro. Ambos yacimientos se hallan hoy en Cisjordania, cerca de la orilla noroccidental del mar Muerto."
  pt:
    - "Secacá era uma das seis cidades do distrito do deserto de Judá, junto ao mar Morto: “No deserto: Bete-Arabá, Midim, Secaca, Nibsã, a Cidade do Sal e En-Gedi; seis cidades com as suas aldeias.” É nomeada somente aqui na Bíblia. Em 1956 Frank Moore Cross e Józef Milik, que exploraram os sítios da Idade do Ferro da Buqei'a, o vale elevado atrás de Qumran, a situaram em Khirbet es-Samrah, um povoado murado da Idade do Ferro ali; o mapa segue isso."
    - "Secacá reaparece no Rolo de Cobre (3Q15) da Caverna 3 de Qumran, uma lista de tesouros escondidos, que a nomeia várias vezes entre os esconderijos e fala de sua represa e de seu aqueduto. John Allegro, que primeiro publicou o rolo, identificou Secacá com a própria Khirbet Qumran, perto da Buqei'a, e Hanan Eshel defendeu depois o mesmo; o sistema de águas de Qumran, do período romano antigo, combina com a descrição do rolo. Cross e Milik, como Martin Noth, haviam tomado Qumran, em vez disso, pela Cidade do Sal da mesma lista. Qumran também foi povoada pela primeira vez na Idade do Ferro. Ambos os sítios ficam hoje na Cisjordânia, perto da margem noroeste do mar Morto."
  de:
    - "Sechacha war eine der sechs Städte des Wüstenbezirks Judas am Toten Meer: „In der Wüste aber war Beth-Araba, Middin, Sechacha, Nibsan und die Salzstadt und Engedi. Das sind sechs Städte und ihre Dörfer.“ Es wird in der Bibel nur hier genannt. Frank Moore Cross und Józef Milik, die 1956 die eisenzeitlichen Stätten der Buqea erkundeten, des Hochtals hinter Qumran, setzten es in Chirbet es-Samra an, einer ummauerten eisenzeitlichen Siedlung dort; die Karte folgt dem."
    - "Sechacha erscheint wieder in der Kupferrolle (3Q15) aus Höhle 3 von Qumran, einer Liste verborgener Schätze, die es mehrmals unter den Verstecken nennt und von seinem Damm und seinem Aquädukt spricht. John Allegro, der die Rolle zuerst veröffentlichte, setzte Sechacha mit Chirbet Qumran selbst gleich, nahe der Buqea, und Hanan Eshel vertrat es später ebenso; die Wasseranlage von Qumran aus frührömischer Zeit passt zur Beschreibung der Rolle. Cross und Milik hatten wie Martin Noth dagegen Qumran für die Salzstadt derselben Liste gehalten. Auch Qumran wurde erstmals in der Eisenzeit besiedelt. Beide Stätten liegen heute im Westjordanland, nahe dem nordwestlichen Ufer des Toten Meeres."
  it:
    - "Secacà era una delle sei città del distretto desertico di Giuda presso il Mar Morto: «Nel deserto: Beth-Araba, Middin, Secacah, Nibshan, Ir-Hammelah e Enghedi: sei città e i loro villaggi». È nominata solo qui nella Bibbia. Nel 1956 Frank Moore Cross e Józef Milik, che esplorarono i siti dell’età del Ferro della Buqei‘a, la valle d’altura dietro Qumran, la collocarono a Khirbet es-Samrah, un insediamento fortificato dell’età del Ferro; la carta segue questa ipotesi."
    - "Secacà ricompare nel Rotolo di rame (3Q15) della Grotta 3 di Qumran, un elenco di tesori nascosti, che la nomina più volte tra i nascondigli e parla della sua diga e del suo acquedotto. John Allegro, che per primo pubblicò il rotolo, identificò Secacà con la stessa Khirbet Qumran, vicina alla Buqei‘a, e più tardi Hanan Eshel sostenne lo stesso; il sistema idrico di Qumran, del primo periodo romano, corrisponde alla descrizione del rotolo. Cross e Milik, come Martin Noth, avevano invece ritenuto Qumran la Città del Sale dello stesso elenco. Anche Qumran fu abitata per la prima volta nell’età del Ferro. Entrambi i siti si trovano oggi in Cisgiordania, vicino alla riva nord-occidentale del Mar Morto."
  fr:
    - "Secaca était l’une des six villes du district du désert de Juda, au bord de la mer Morte : « Dans le désert : Beth-Araba, Middin, Secaca, Nibschan, Ir-Hammélach, et En-Guédi ; six villes, et leurs villages. » Elle n’est nommée qu’ici dans la Bible. En 1956, Frank Moore Cross et Józef Milik, qui explorèrent les sites de l’âge du Fer de la Bouqeia, la vallée haute derrière Qumrân, la placèrent à Khirbet es-Samrah, établissement fortifié de l’âge du Fer ; la carte suit cet avis."
    - "Secaca reparaît dans le Rouleau de cuivre (3Q15) de la grotte 3 de Qumrân, liste de trésors cachés, qui la nomme plusieurs fois parmi les cachettes et parle de son barrage et de son aqueduc. John Allegro, qui publia le rouleau le premier, identifia Secaca avec Khirbet Qumrân même, près de la Bouqeia, et Hanan Eshel soutint plus tard la même chose ; le système hydraulique de Qumrân, du début de l’époque romaine, s’accorde avec la description du rouleau. Cross et Milik, comme Martin Noth, avaient plutôt pris Qumrân pour la Ville du Sel (Ir-Hammélach) de la même liste. Qumrân fut elle aussi habitée d’abord à l’âge du Fer. Les deux sites se trouvent aujourd’hui en Cisjordanie, près de la rive nord-ouest de la mer Morte."
  nl:
    - "Sekaka was een van de zes steden van Juda's woestijndistrict bij de Dode Zee: “In de woestijn: Beth-araba, Middin en Sechacha, En Nibsan, en de Zoutstad, en Engedi; zes steden en haar dorpen.” Het wordt in de Bijbel alleen hier genoemd. In 1956 plaatsten Frank Moore Cross en Józef Milik, die de ijzertijdplaatsen van de Buqei'a, de hooggelegen vallei achter Qumran, verkenden, het bij Khirbet es-Samrah, een ommuurde nederzetting uit de ijzertijd aldaar; de kaart volgt dit."
    - "Sekaka komt opnieuw voor in de Koperen Rol (3Q15) uit Qumran-grot 3, een lijst van verborgen schatten, die het meermalen onder de bergplaatsen noemt en spreekt van zijn dam en zijn aquaduct. John Allegro, die de rol als eerste publiceerde, vereenzelvigde Sekaka met Khirbet Qumran zelf, bij de Buqei'a, en Hanan Eshel bepleitte later hetzelfde; het watersysteem van Qumran uit de vroeg-Romeinse tijd past bij de beschrijving in de rol. Cross en Milik hadden, evenals Martin Noth, Qumran juist voor de Zoutstad uit dezelfde lijst gehouden. Ook Qumran werd voor het eerst in de ijzertijd bewoond. Beide plaatsen liggen tegenwoordig op de Westelijke Jordaanoever, bij de noordwestkust van de Dode Zee."
  cs:
    - "Sekaka bylo jedno ze šesti měst judského pouštního okresu u Mrtvého moře: „Na poušti: Betaraba, Middin a Sechacha; A Nibsam, a město solné, a Engadi, měst šest i vsi jejich.“ Je jmenována jen zde v Bibli. V roce 1956 ji Frank Moore Cross a Józef Milik, kteří zkoumali sídliště doby železné v Bukej'a, vysoko položeném údolí za Kumránem, umístili do Chirbet es-Samra, opevněného sídliště z doby železné tamtéž; mapa tento názor sleduje."
    - "Sekaka se znovu objevuje v Měděném svitku (3Q15) z kumránské jeskyně 3, seznamu ukrytých pokladů, který ji několikrát jmenuje mezi skrýšemi a mluví o její přehradě a jejím akvaduktu. John Allegro, který svitek poprvé vydal, ztotožnil Sekaku s Chirbet Kumrán samotným, poblíž Bukej'y, a Chanan Eshel později tvrdil totéž; kumránský vodní systém z raně římského období popisu svitku odpovídá. Cross a Milik, stejně jako Martin Noth, naopak pokládali Kumrán za Město soli téhož seznamu. I Kumrán byl poprvé osídlen v době železné. Obě místa leží dnes na Západním břehu, poblíž severozápadního břehu Mrtvého moře."
  pl:
    - "Sekaka było jednym z sześciu miast okręgu pustynnego Judy nad Morzem Martwym: „A na puszczy: Bet Araba, Meddyn, i Sechacha; I Nebsan, i miasto Soli, i Engaddy, miast sześć, i wsi ich”. Jest wymienione w Biblii tylko tu. W 1956 roku Frank Moore Cross i Józef Milik, którzy badali stanowiska z epoki żelaza w Buqei'a, górskiej dolinie za Qumran, umieścili je w Chirbet es-Samra, obwarowanej osadzie z epoki żelaza; mapa idzie za tym."
    - "Sekaka pojawia się znów w Zwoju Miedzianym (3Q15) z jaskini 3 w Qumran, wykazie ukrytych skarbów, który wymienia je kilkakrotnie wśród kryjówek i mówi o jego tamie i akwedukcie. John Allegro, który pierwszy opublikował zwój, utożsamił Sekakę z samym Chirbet Qumran, koło Buqei'a, a Hanan Eshel argumentował później tak samo; system wodny Qumran z wczesnego okresu rzymskiego pasuje do opisu zwoju. Cross i Milik, podobnie jak Martin Noth, uważali natomiast Qumran za Miasto Soli z tej samej listy. Qumran także zasiedlono po raz pierwszy w epoce żelaza. Oba stanowiska leżą dziś na Zachodnim Brzegu, blisko północno-zachodniego brzegu Morza Martwego."
  sv:
    - "Sekaka var en av de sex städerna i Judas ökendistrikt vid Döda havet: ”I Öknen: Bet-Haaraba, Middin, Sekaka, Nibsan, Ir-Hammela och En-Gedi – sex städer med sina byar.” Det nämns bara här i Bibeln. År 1956 placerade Frank Moore Cross och Józef Milik, som utforskade järnåldersplatserna i Buqeia, höglandsdalen bakom Qumran, det vid Khirbet es-Samrah, en muromgärdad järnåldersbosättning där; kartan följer detta."
    - "Sekaka dyker upp igen i Kopparrullen (3Q15) från Qumrangrotta 3, en förteckning över dolda skatter, som nämner det flera gånger bland gömställena och talar om dess damm och dess akvedukt. John Allegro, som först publicerade rullen, identifierade Sekaka med Khirbet Qumran självt, nära Buqeia, och Hanan Eshel argumenterade senare likadant; Qumrans vattensystem från tidig romersk tid passar rullens beskrivning. Cross och Milik hade, liksom Martin Noth, i stället tagit Qumran för Ir-Hammelach i samma förteckning. Också Qumran bosattes först under järnåldern. Båda platserna ligger i dag på Västbanken, nära Döda havets nordvästra strand."
  nb:
    - "Sekaka var en av de seks byene i Judas ørkendistrikt ved Dødehavet: «I ørkenen: Bet-Ha'araba, Middin og Sekaka og Hannibsan og Ir-Hammelah og En-Gedi – seks byer med tilhørende landsbyer.» Det er bare nevnt her i Bibelen. I 1956 plasserte Frank Moore Cross og Józef Milik, som utforsket jernaldersteder i Buqei'a, høylandsdalen bak Qumran, det ved Khirbet es-Samrah, en befestet jernaldersbosetning der; kartet følger dette."
    - "Sekaka dukker opp igjen i Kobberrullen (3Q15) fra Qumran-hule 3, en liste over skjulte skatter, som nevner det flere ganger blant gjemmestedene og taler om dets dam og akvedukt. John Allegro, som først utga rullen, identifiserte Sekaka med selve Khirbet Qumran, nær Buqei'a, og Hanan Eshel argumenterte senere det samme; Qumrans vannsystem, fra tidlig romertid, passer til rullens beskrivelse. Cross og Milik hadde, som Martin Noth, i stedet tatt Qumran for å være Ir-Melah i den samme listen. Også Qumran ble først bosatt i jernalderen. Begge stedene ligger i dag på Vestbredden, nær nordvestkysten av Dødehavet."
