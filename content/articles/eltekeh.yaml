# Overview article (ADR 0007). Mainstream facts only; Assyrian dates follow the standard chronology; the site is disputed and the candidates are given as such.
id: eltekeh
place: a3c4559
title:
  en: "Eltekeh"
  ru: "Елтеке"
  uk: "Елтеке"
  es: "Elteque"
  pt: "Elteque"
  de: "Elteke"
  fr: "Eltheké"
  it: "Elteche"
  pl: "Elteke"
