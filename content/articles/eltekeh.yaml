body:
  en:
    - "Eltekeh was a town of Dan in the coastal plain, listed with Gibbethon and Baalath, and one of the four Levitical cities taken “out of the tribe of Dan” for the sons of Kohath, with Gibbethon, Aijalon and Gath-rimmon; the parallel list in Chronicles omits it, and the Synodal Russian spells it Elteke in one verse and Elpheke in the other. That is all the Bible says of it."
    - "Its fame is Assyrian. Sennacherib's annals of his campaign of 701 BC record that at Altaqu, which is Eltekeh, he met the kings of Egypt and the bowmen, chariots and horses of the king of Kush who had come to help Ekron, defeated them, and then besieged and took Altaqu and Timnah before punishing Ekron and turning on Hezekiah's Judah and besieging its fortified cities. The battle places Eltekeh in the coastal plain within reach of Ekron and Timnah."
    - "Several mounds have been proposed. Tel Shalaf (Tell esh-Shallaf) north-east of Yavne, suggested by Benjamin Mazar, is the usual choice; Tell el-Melat west of Gezer has also been proposed; Khirbet el-Muqanna (Tel Miqne) was Albright's choice but is now known to be Ekron itself. Tel Shalaf is known from surface survey, and the identification rests on geography and pottery alone."
  ru:
    - "Елтеке — город Дана на приморской равнине, названный вместе с Гавафоном и Ваалафом, и один из четырёх левитских городов, отданных «от колена Данова» сынам Каафа вместе с Гавафоном, Аиалоном и Гаф-Риммоном; параллельный список в Паралипоменоне его опускает, а Синодальный перевод пишет его в одном стихе Елтеке, в другом Елфеке. Это всё, что говорит о нём Библия."
    - "Его известность — ассирийская. Анналы Сеннахирима о походе 701 г. до н. э. рассказывают, что при Альтаку, то есть Елтеке, он встретил царей Египта и лучников, колесницы и коней царя Куша, пришедших на помощь Екрону, разбил их, а затем осадил и взял Альтаку и Фимну, прежде чем покарать Екрон и обратиться на Иудею Езекии. Битва помещает Елтеке на приморской равнине неподалёку от Екрона и Фимны."
    - "Предлагали несколько холмов. Тель-Шалаф (Телль-эш-Шаллаф) к северо-востоку от Явне, предложенный Беньямином Мазаром, — обычный выбор; предлагали и Телль-эль-Мелат к западу от Газера; Хирбет-эль-Муканна (Тель-Микне) выбирал Олбрайт, но теперь известно, что это сам Екрон. Тель-Шалаф известен по разведке поверхности, и отождествление опирается лишь на географию и керамику."
  uk:
    - "Елтеке було містом Дана на прибережній рівнині, названим поряд із Гіббетоном і Ваалатом, і одним із чотирьох левітських міст, узятих «А від поколїння Данового» для синів Кааха, разом із Гіббетоном, Аялоном і Гат-Риммоном; паралельний перелік у Хроніках його пропускає, а Синодальний російський переклад пише Елтеке в одному вірші й Елфеке в іншому. Це все, що Біблія каже про нього."
    - "Його слава ассирійська. Аннали Сінаххеріба про його похід 701 р. до н. е. записують, що в Алтаку, тобто Елтеке, він зустрів царів Єгипту та лучників, колісниці й коней царя Куша, які прийшли на допомогу Екрону, розбив їх, а потім облягав і взяв Алтаку й Тімну, перш ніж покарати Екрон і обернутися проти Юди Єзекії та облягати її укріплені міста. Битва ставить Елтеке на прибережній рівнині в межах досяжності від Екрона і Тімни."
    - "Пропонували кілька горбів. Телль-Шалаф (Телль-еш-Шаллаф) на північний схід від Явне, запропонований Беньяміном Мазаром, — звичайний вибір; Телль-ель-Мелат на захід від Гезера теж пропонували; Хірбет-ель-Мукана (Телль-Мікне) був вибором Олбрайта, але нині відомо, що це сам Екрон. Телль-Шалаф відомий з поверхневого обстеження, і ототожнення спирається лише на географію та кераміку."
  es:
    - "Elteque era una ciudad de Dan en la llanura costera, enumerada con Gibetón y Baalat, y una de las cuatro ciudades levíticas tomadas «de la tribu de Dan» para los hijos de Coat, junto con Gibetón, Ajalón y Gat-rimón; la lista paralela de Crónicas la omite, y la Biblia sinodal rusa la escribe Elteke en un versículo y Elpheke en el otro. Eso es todo lo que dice la Biblia de ella."
    - "Su fama es asiria. Los anales de Senaquerib sobre su campaña del 701 a. C. registran que en Altaqu, que es Elteque, se enfrentó a los reyes de Egipto y a los arqueros, carros y caballos del rey de Cus que habían venido en ayuda de Ecrón, los derrotó y luego sitió y tomó Altaqu y Timna antes de castigar a Ecrón y volverse contra el Judá de Ezequías y sitiar sus ciudades fortificadas. La batalla sitúa Elteque en la llanura costera, al alcance de Ecrón y Timna."
    - "Se han propuesto varios montículos. Tel Shalaf (Tell esh-Shallaf), al nordeste de Yavne, sugerido por Benjamin Mazar, es la opción habitual; también se ha propuesto Tell el-Melat, al oeste de Gezer; Khirbet el-Muqanna (Tel Miqne) fue la elección de Albright pero hoy se sabe que es la propia Ecrón. Tel Shalaf se conoce por prospección de superficie, y la identificación descansa solo en la geografía y la cerámica."
  pt:
    - "Elteque era uma cidade de Dã na planície costeira, listada com Gibetom e Baalate, e uma das quatro cidades levíticas tomadas “Da tribo de Dã” para os filhos de Coate, com Gibetom, Aijalom e Gate-Rimom; a lista paralela das Crônicas a omite, e o russo Sinodal a grafa Elteke num versículo e Elpheke no outro. Isso é tudo o que a Bíblia diz dela."
    - "Sua fama é assíria. Os anais de Senaqueribe sobre sua campanha de 701 a.C. registram que em Altaqu, que é Elteque, ele enfrentou os reis do Egito e os arqueiros, carros e cavalos do rei de Cuxe que haviam vindo em auxílio de Ecrom, os derrotou, e depois sitiou e tomou Altaqu e Timna antes de castigar Ecrom e se voltar contra a Judá de Ezequias e sitiar suas cidades fortificadas. A batalha situa Elteque na planície costeira, ao alcance de Ecrom e Timna."
    - "Vários montes foram propostos. Tel Shalaf (Tell esh-Shallaf), a nordeste de Yavne, sugerido por Benjamin Mazar, é a escolha habitual; Tell el-Melat, a oeste de Gezer, também foi proposto; Khirbet el-Muqanna (Tel Miqne) foi a escolha de Albright, mas sabe-se agora que é a própria Ecrom. Tel Shalaf é conhecido por levantamento de superfície, e a identificação repousa apenas na geografia e na cerâmica."
  de:
    - "Elteke war eine Stadt Dans in der Küstenebene, zusammen mit Gibbeton und Baalat aufgeführt und eine der vier Levitenstädte, die „von dem Stamme Dan“ für die Söhne Kehats genommen wurden, mit Gibbeton, Ajalon und Gat-Rimmon: „Von dem Stamme Dan vier Städte: Eltheke und seine Vorstädte, Gibbethon und seine Vorstädte“; die Parallelliste in der Chronik lässt sie aus, und die russische Synodalbibel schreibt sie in einem Vers Elteke und im anderen Elpheke. Das ist alles, was die Bibel von ihr sagt."
    - "Ihr Ruhm ist assyrisch. Sanheribs Annalen seines Feldzugs von 701 v. Chr. verzeichnen, dass er bei Altaqu, das ist Elteke, den Königen Ägyptens und den Bogenschützen, Wagen und Pferden des Königs von Kusch begegnete, die Ekron zu Hilfe gekommen waren, sie besiegte und dann Altaqu und Timna belagerte und einnahm, ehe er Ekron bestrafte und sich gegen Hiskias Juda wandte und dessen befestigte Städte belagerte. Die Schlacht setzt Elteke in die Küstenebene in Reichweite von Ekron und Timna."
    - "Mehrere Hügel wurden vorgeschlagen. Tel Schalaf (Tell esh-Shallaf) nordöstlich von Jawne, von Benjamin Mazar vorgeschlagen, ist die übliche Wahl; Tell el-Melat westlich von Geser wurde ebenfalls vorgeschlagen; Khirbet el-Muqanna (Tel Miqne) war Albrights Wahl, ist aber heute als Ekron selbst bekannt. Tel Schalaf ist aus Oberflächenuntersuchungen bekannt, und die Gleichsetzung beruht allein auf Geographie und Keramik."
  fr:
    - "Eltheké était une ville de Dan dans la plaine côtière, citée avec Guibbethon et Baalath, et l’une des quatre villes lévitiques prises « de la tribu de Dan » pour les fils de Kehath, avec Guibbethon, Ajalon et Gath-Rimmon ; la liste parallèle des Chroniques l’omet, et la Bible russe synodale l’orthographie Elteke dans un verset et Elpheke dans l’autre. C’est tout ce que la Bible en dit."
    - "Sa célébrité est assyrienne. Les annales de Sanchérib sur sa campagne de 701 av. J.-C. rapportent qu’à Altaqu, qui est Eltheké, il rencontra les rois d’Égypte et les archers, chars et chevaux du roi de Cusch venus au secours d’Ékron, les battit, puis assiégea et prit Altaqu et Thimna avant de châtier Ékron et de se tourner contre le Juda d’Ézéchias et d’assiéger ses villes fortifiées. La bataille place Eltheké dans la plaine côtière, à portée d’Ékron et de Thimna."
    - "Plusieurs tertres ont été proposés. Tel Shalaf (Tell esh-Shallaf), au nord-est de Yavné, suggéré par Benjamin Mazar, est le choix habituel ; Tell el-Melat, à l’ouest de Guézer, a aussi été proposé ; Khirbet el-Muqanna (Tel Miqne) était le choix d’Albright, mais on sait maintenant que c’est Ékron elle-même. Tel Shalaf n’est connu que par prospection de surface, et l’identification repose sur la seule géographie et la poterie."
  it:
    - "Elteche era una città di Dan nella pianura costiera, elencata con Ghibbeton e Baalat, e una delle quattro città levitiche prese «della tribù di Dan» per i figli di Keat, con Ghibbeton, Aialon e Gat-Rimmon; l’elenco parallelo delle Cronache la omette, e il russo sinodale la scrive Elteke in un versetto ed Elpheke nell’altro. È tutto ciò che la Bibbia dice di essa."
    - "La sua fama è assira. Gli annali di Sennacherib sulla campagna del 701 a.C. registrano che ad Altaqu, che è Elteche, egli incontrò i re d’Egitto e gli arcieri, i carri e i cavalli del re di Kush venuti in aiuto di Ekron, li sconfisse, poi assediò e prese Altaqu e Timna prima di punire Ekron e volgersi contro la Giuda di Ezechia assediandone le città fortificate. La battaglia colloca Elteche nella pianura costiera a portata di Ekron e di Timna."
    - "Sono stati proposti vari tell. Tel Shalaf (Tell esh-Shallaf) a nord-est di Yavne, suggerito da Benjamin Mazar, è la scelta abituale; è stato proposto anche Tell el-Melat a ovest di Ghezer; Khirbet el-Muqanna (Tel Miqne) fu la scelta di Albright ma è ora noto essere la stessa Ekron. Tel Shalaf è noto da ricognizioni di superficie, e l’identificazione poggia solo su geografia e ceramica."
  pl:
    - "Elteke było miastem Dana w równinie nadmorskiej, wymienionym razem z Gibbeton i Baalat, i jednym z czterech miast lewickich wziętych „z pokolenia Danowego” dla synów Kehata, wraz z Gibbeton, Ajjalon i Gat-Rimmon; paralelny wykaz w Księdze Kronik je pomija, a rosyjski synodalny pisze je Elteke w jednym wersecie, a Elfeke w drugim. To wszystko, co Biblia o nim mówi."
    - "Jego sława jest asyryjska. Roczniki Sennacheryba z jego wyprawy w 701 r. p.n.e. zapisują, że pod Altaku, czyli Elteke, spotkał królów Egiptu oraz łuczników, rydwany i konie króla Kusz, którzy przybyli na pomoc Ekronowi, rozgromił ich, a potem oblegał i zdobył Altaku i Timnę, nim ukarał Ekron i zwrócił się przeciw Judzie Ezechiasza, oblegając jej warowne miasta. Bitwa umieszcza Elteke w równinie nadmorskiej w zasięgu Ekronu i Timny."
    - "Zaproponowano kilka kopców. Tel Szalaf (Tell esh-Szallaf) na północny wschód od Jawne, zaproponowany przez Beniamina Mazara, jest zwykłym wyborem; wskazywano też Tell el-Melat na zachód od Gezer; Chirbet el-Mukanna (Tel Mikne) było wyborem Albrighta, ale wiadomo teraz, że to sam Ekron. Tel Szalaf znany jest z badań powierzchniowych, a utożsamienie opiera się wyłącznie na geografii i ceramice."
  nl:
    - "Eltekeh was een stad van Dan in de kustvlakte, genoemd met Gibbeton en Baälat, en een van de vier levitische steden “van den stam van Dan, Elteke en haar voorsteden, Gibbethon en haar voorsteden” voor de zonen van Kehat, met Ajalon en Gat-Rimmon; de parallelle lijst in Kronieken laat haar weg, en de Synodale Russische Bijbel schrijft Elteke in het ene vers en Elfeke in het andere. Dat is alles wat de Bijbel erover zegt."
    - "Haar faam is Assyrisch. Sanheribs annalen van zijn veldtocht van 701 v.Chr. vermelden dat hij bij Altaqu, dat is Eltekeh, de koningen van Egypte en de boogschutters, wagens en paarden van de koning van Kus ontmoette die Ekron te hulp waren gekomen, hen versloeg, en daarna Altaqu en Timna belegerde en innam voordat hij Ekron strafte en zich tegen Chizkia's Juda keerde en de versterkte steden belegerde. De slag plaatst Eltekeh in de kustvlakte, binnen bereik van Ekron en Timna."
    - "Verscheidene heuvels zijn voorgesteld. Tel Shalaf (Tell esh-Shallaf) ten noordoosten van Javne, voorgesteld door Benjamin Mazar, is de gebruikelijke keuze; ook Tell el-Melat ten westen van Gezer is voorgesteld; Khirbet el-Muqanna (Tel Miqne) was Albrights keuze, maar blijkt nu Ekron zelf te zijn. Tel Shalaf is bekend uit oppervlakteonderzoek, en de identificatie berust alleen op geografie en aardewerk."
  cs:
    - "Elteke bylo město Danovo v pobřežní rovině, uvedené s Gibetonem a Báalatem, a jedno ze čtyř levitských měst vzatých „Z pokolení pak Dan“ pro syny Kehatovy, s Gibetonem, Ajalonem a Gat-rimmonem; paralelní seznam v Letopisech je vynechává a synodální ruský text píše Elteke v jednom verši a Elfeke v druhém. To je vše, co o něm Bible říká."
    - "Jeho proslulost je asyrská. Senacheribovy anály jeho tažení roku 701 př. n. l. zaznamenávají, že u Altaqu, což je Elteke, se střetl s králi Egypta a s lučištníky, vozy a koňmi krále Kúše, kteří přišli na pomoc Ekronu, porazil je a pak oblehl a dobyl Altaqu a Timnu, než potrestal Ekron a obrátil se na Chizkijášovo Judsko a oblehl jeho opevněná města. Bitva klade Elteke do pobřežní roviny na dosah Ekronu a Timny."
    - "Navrženo bylo několik pahorků. Tel Shalaf (Tell esh-Shallaf) severovýchodně od Yavne, navržený Benjaminem Mazarem, je obvyklou volbou; navržen byl také Tell el-Melat západně od Gezeru; Khirbet el-Muqanna (Tel Miqne) byl Albrightovou volbou, ale dnes je známo, že je samým Ekronem. Tel Shalaf je znám z povrchového průzkumu a ztotožnění spočívá jen na zeměpisu a keramice."
