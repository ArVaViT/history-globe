body:
  en:
    - "Havvoth-jair, “the villages of Jair” (Hebrew havvah, a tent camp or hamlet), was a group of settlements east of the Jordan in northern Gilead and Bashan, named after Jair of the tribe of Manasseh. Numbers says that “Jair the son of Manasseh went and took the small towns thereof, and called them Havoth-jair”; Deuteronomy that he took all the region of Argob to the border of Geshur and Maacah and called Bashan after himself; Joshua gives half-Manasseh “all the towns of Jair, which are in Bashan, threescore cities”. Chronicles traces Jair to Hezron of Judah through the daughter of Machir, with twenty-three cities in Gilead, and adds that Geshur and Aram later took them."
    - "Judges tells of another Jair, a Gileadite who judged Israel twenty-two years and had thirty sons riding thirty ass colts, with thirty cities “called Havoth-jair unto this day, which are in the land of Gilead” (the Synodal text has thirty-two). Under Solomon “the towns of Jair” in Gilead and the sixty walled cities of Argob belonged to the district of Ben-geber at Ramoth-gilead."
    - "The books disagree about the number, twenty-three, thirty or sixty, and about whether the villages lay in Gilead or Bashan; many scholars read Jair as the name of a clan whose settlements shifted and multiplied over time. No single site has been identified, and none has been excavated as Havvoth-jair; the villages are usually sought in the hills of northern Gilead between the Yarmuk and the Jabbok, about modern Irbid and Ajlun, perhaps spreading toward the lava country of the Hauran."
    - "That region is today the Irbid and Ajlun governorates of northern Jordan, a well-watered farming country with the oak woods of Ajlun, where many small tells remain unexplored."
  ru:
    - "Селения Иаировы, по-еврейски Хаввот-Яир (хавва — стан шатров или хутор), были группой поселений к востоку от Иордана, в северном Галааде и Васане, названных по Иаиру из колена Манассиина. Книга Чисел говорит: «Иаир, сын Манассии, пошел и взял селения их, и назвал их: селения Иаировы»; Второзаконие — что он взял всю область Аргов до пределов Гесурских и Маахских и назвал Васан своим именем; книга Иисуса Навина даёт половине Манассии «все селения Иаировы, что в Васане, шестьдесят городов». Паралипоменон возводит Иаира к Есрому из Иуды через дочь Махира, с двадцатью тремя городами в Галааде, и добавляет, что Гессуряне и Сирияне позже их взяли."
    - "Книга Судей рассказывает о другом Иаире, Галаадитянине, который судил Израиль двадцать два года и имел по Синодальному тексту тридцать два сына на молодых ослах и тридцать два города, что «до сего дня называют селениями Иаира, что в земле Галаадской» (в еврейском тексте — тридцать). При Соломоне «селения Иаира» в Галааде и шестьдесят укреплённых городов Аргова входили в округ Бен-Гевера в Рамофе Галаадском."
    - "Книги расходятся в числе — двадцать три, тридцать или шестьдесят — и в том, лежали ли селения в Галааде или в Васане; многие учёные читают Иаира как имя рода, чьи поселения со временем смещались и множились. Ни одно место не отождествлено и ни одно не раскопано как Селения Иаировы; их обычно ищут в горах северного Галаада между Ярмуком и Иавоком, около нынешних Ирбида и Аджлуна, возможно, с выходом к лавовой стране Хаурана."
    - "Эта область сегодня — провинции Ирбид и Аджлун на севере Иордании, хорошо орошённый земледельческий край с дубовыми лесами Аджлуна, где многие небольшие телли остаются неисследованными."
  uk:
    - "Селища Яіра (давньоєвр. хаввот-яір, «намети Яіра»; хавва — наметовий табір або хутір) — група поселень на схід від Йордану в північному Гілеаді й Башані, названа за Яіром з коліна Манасії. Книга Чисел каже: «Яір же Манассієнко пійшов і заняв села їх та й назвав їх Яїровими селами»; Повторення Закону — що він узяв усю округу Аргов до межі Гешуру й Мааха й назвав Башан за собою; Книга Ісуса Навина дає половині коліна Манасії «через усї села Яірові в Базанї, шістьдесять міст». Хроніки виводять Яіра від Хецрона з Юди через дочку Махіра, з двадцятьма трьома містами в Гілеаді, і додають, що Гешур і Арам пізніше їх забрали."
    - "Книга Суддів розповідає про іншого Яіра, гілеадянина, який судив Ізраїль двадцять два роки і мав тридцять синів, що їздили на тридцяти ослицях, і тридцять міст, які й донині зовуться Селищами Яіра в краї Гілеад (Синодальний текст має тридцять два). За Соломона «оселї Яірові Манассієнкові, що в Галаадї, і країну Аргоб у Басанї, шістьдесять великих городів з мурами» належали до округи Бен-Гевера в Рамоті Гілеадському."
    - "Книги розходяться щодо числа — двадцять три, тридцять чи шістдесят — і щодо того, чи лежали селища в Гілеаді, чи в Башані; багато дослідників читають Яір як назву роду, чиї поселення з часом переміщувалися й множилися. Жодного окремого місця не ототожнено, і жодне не розкопували як Селища Яіра; їх зазвичай шукають у пагорбах північного Гілеаду між Ярмуком і Яббоком, довкола сучасних Ірбіда й Аджлуна, можливо, з поширенням у бік лавового краю Хавран."
    - "Цей край нині — округи Ірбід і Аджлун на півночі Йорданії, добре зрошений землеробський край з дубовими лісами Аджлуна, де багато малих теллів лишаються недослідженими."
  es:
    - "Havot-jair, «las aldeas de Jair» (en hebreo havvah, campamento de tiendas o caserío), era un grupo de asentamientos al este del Jordán, en el norte de Galaad y en Basán, llamados así por Jair, de la tribu de Manasés. Números dice que «Jair hijo de Manasés fué y tomó sus aldeas, y púsoles por nombre Havoth-jair»; Deuteronomio, que tomó toda la región de Argob hasta el límite de Gesur y Maaca y dio a Basán su propio nombre; Josué da a la media tribu de Manasés «todas las aldeas de Jair que están en Basán, sesenta poblaciones». Crónicas hace descender a Jair de Hezrón, de Judá, por la hija de Maquir, con veintitrés ciudades en Galaad, y añade que Gesur y Aram se las tomaron después."
    - "Jueces habla de otro Jair, un galaadita que juzgó a Israel veintidós años y tuvo treinta hijos que cabalgaban sobre treinta asnos, con treinta ciudades «que se llamaron las villas de Jair hasta hoy, las cuales están en la tierra de Galaad» (el texto sinodal tiene treinta y dos). Bajo Salomón, «las ciudades de Jair» en Galaad y las sesenta ciudades amuralladas de Argob pertenecían al distrito de Ben-geber en Ramot de Galaad."
    - "Los libros discrepan en el número, veintitrés, treinta o sesenta, y en si las aldeas estaban en Galaad o en Basán; muchos estudiosos leen Jair como el nombre de un clan cuyos asentamientos cambiaron y se multiplicaron con el tiempo. No se ha identificado ningún sitio único, y ninguno ha sido excavado como Havot-jair; las aldeas suelen buscarse en las colinas del norte de Galaad entre el Yarmuk y el Jaboc, en torno a las actuales Irbid y Ajlun, quizá extendiéndose hacia la región de lava del Haurán."
    - "Esa región es hoy las gobernaciones de Irbid y Ajlun, en el norte de Jordania, un país de cultivo bien regado con los robledales de Ajlun, donde quedan sin explorar muchos pequeños tells."
  pt:
    - "Havote-Jair, “as aldeias de Jair” (hebraico havvah, acampamento de tendas ou povoado), era um grupo de povoados a leste do Jordão, no norte de Gileade e em Basã, assim chamado por Jair, da tribo de Manassés. Números diz que “Jair, filho de Manassés, foi e tomou os seus povoados, e os chamou de Havote-Jair”; Deuteronômio, que ele tomou toda a região de Argobe até a fronteira de Gesur e Maacá e deu a Basã o seu próprio nome; Josué dá à meia tribo de Manassés “todas as aldeias de Jair, que estão em Basã, sessenta cidades”. Crônicas traça Jair a Hezrom, de Judá, pela filha de Maquir, com vinte e três cidades em Gileade, e acrescenta que Gesur e Arã as tomaram depois."
    - "Juízes fala de outro Jair, um gileadita que julgou Israel vinte e dois anos e teve trinta filhos que montavam em trinta jumentinhos, com trinta cidades “que são chamadas Havote-Jair até o dia de hoje, e ficam na terra de Gileade” (o texto Sinodal tem trinta e duas). Sob Salomão, “os povoados de Jair, filho de Manassés, que estão em Gileade” e as sessenta cidades muradas de Argobe pertenciam ao distrito de Ben-Geber em Ramote-Gileade."
    - "Os livros divergem quanto ao número, vinte e três, trinta ou sessenta, e quanto a os povoados ficarem em Gileade ou em Basã; muitos estudiosos leem Jair como o nome de um clã cujos povoados mudaram e se multiplicaram com o tempo. Nenhum sítio único foi identificado, e nenhum foi escavado como Havote-Jair; os povoados costumam ser procurados nas colinas do norte de Gileade, entre o Yarmuk e o Jaboque, em torno das modernas Irbid e Ajlun, talvez se estendendo para a região de lava do Haurã."
    - "Essa região é hoje as províncias de Irbid e Ajlun, no norte da Jordânia, terra agrícola bem irrigada, com os bosques de carvalhos de Ajlun, onde muitos pequenos tells permanecem inexplorados."
  de:
    - "Hawwot-Jair, „die Dörfer Jaïrs“ (hebräisch chawwa, ein Zeltlager oder Weiler), war eine Gruppe von Siedlungen östlich des Jordan im nördlichen Gilead und in Baschan, benannt nach Jaïr aus dem Stamm Manasse. Das vierte Buch Mose sagt: „Jair aber, der Sohn Manasses, ging hin und gewann ihre Dörfer und hieß sie Dörfer Jairs“; das fünfte, er habe die ganze Gegend Argob bis an die Grenze der Geschuriter und Maachathiter genommen und Baschan nach seinem Namen benannt; Josua gibt dem halben Manasse „alle Flecken Jairs, die in Basan liegen“, sechzig Städte. Die Chronik führt Jaïr über die Tochter Machirs auf Hezron von Juda zurück, mit dreiundzwanzig Städten in Gilead, und fügt hinzu, Geschur und Aram hätten sie später genommen."
    - "Das Buch der Richter erzählt von einem anderen Jaïr, einem Gileaditer, der Israel zweiundzwanzig Jahre richtete und dreißig Söhne hatte, die auf dreißig Eselsfüllen ritten, mit dreißig Städten, die „Dörfer Jairs bis auf diesen Tag“ hießen „und liegen in Gilead“ (der Synodaltext hat zweiunddreißig). Unter Salomo gehörten „die Flecken Jairs“ in Gilead und die sechzig befestigten Städte Argobs zum Bezirk Ben-Gebers in Ramot in Gilead."
    - "Die Bücher widersprechen sich in der Zahl, dreiundzwanzig, dreißig oder sechzig, und darin, ob die Dörfer in Gilead oder in Baschan lagen; viele Forscher lesen Jaïr als Namen einer Sippe, deren Siedlungen sich im Lauf der Zeit verschoben und vermehrten. Keine einzelne Stätte ist identifiziert, und keine ist als Hawwot-Jair ausgegraben; die Dörfer werden meist im Bergland des nördlichen Gilead zwischen Jarmuk und Jabbok gesucht, um das heutige Irbid und Adschlun, vielleicht sich zum Lavaland des Hauran hin ausbreitend."
    - "Diese Gegend sind heute die Gouvernements Irbid und Adschlun im Norden Jordaniens, ein gut bewässertes Ackerland mit den Eichenwäldern von Adschlun, wo viele kleine Tells unerforscht sind."
  fr:
    - "Les bourgs de Jaïr (hébreu havvah, camp de tentes ou hameau) étaient un groupe d’établissements à l’est du Jourdain, dans le nord de Galaad et en Basan, nommés d’après Jaïr, de la tribu de Manassé. Les Nombres disent que « Jaïr, fils de Manassé, se mit en marche, prit les bourgs, et les appela bourgs de Jaïr » ; le Deutéronome qu’il prit toute la contrée d’Argob jusqu’à la frontière des Gueschuriens et des Maacathiens et appela Basan de son nom ; Josué donne à la demi-tribu de Manassé « tous les bourgs de Jaïr en Basan, soixante villes ». Les Chroniques rattachent Jaïr à Hetsron de Juda par la fille de Makir, avec vingt-trois villes en Galaad, et ajoutent que Gueschur et Aram les prirent plus tard."
    - "Les Juges parlent d’un autre Jaïr, un Galaadite qui fut juge en Israël pendant vingt-deux ans et eut trente fils montant sur trente ânons, avec trente villes « appelées encore aujourd’hui bourgs de Jaïr, et situées dans le pays de Galaad » (le texte synodal en compte trente-deux). Sous Salomon, « les bourgs de Jaïr » en Galaad et les soixante villes à murailles d’Argob relevaient du district du fils de Guéber, à Ramoth en Galaad."
    - "Les livres divergent sur le nombre, vingt-trois, trente ou soixante, et sur la question de savoir si les bourgs se trouvaient en Galaad ou en Basan ; beaucoup de spécialistes lisent Jaïr comme le nom d’un clan dont les établissements se déplacèrent et se multiplièrent avec le temps. Aucun site unique n’a été identifié, et aucun n’a été fouillé comme étant les bourgs de Jaïr ; on les cherche d’ordinaire dans les collines du nord de Galaad entre le Yarmouk et le Jabbok, vers Irbid et Ajloun actuelles, peut-être s’étendant vers le pays de lave du Havran."
    - "Cette région est aujourd’hui celle des gouvernorats d’Irbid et d’Ajloun, dans le nord de la Jordanie, un pays agricole bien arrosé avec les bois de chênes d’Ajloun, où de nombreux petits tells restent inexplorés."
  pl:
    - "Chawwot-Jair, „wsie Jaira” (hebr. chawwa, obóz namiotów lub osada), to grupa osiedli na wschód od Jordanu w północnym Gileadzie i Baszanie, nazwana od Jaira z pokolenia Manassesa. Księga Liczb mówi: „Potem Jair, syn Manasesów, wtargnął, i pobrał wsi ich, które przezwał Chawot Jair”; Księga Powtórzonego Prawa, że zajął całą krainę Argob aż do granicy Geszuru i Maaki i nazwał Baszan od swego imienia; Jozue daje połowie Manassesa „wszystkie wsi Jairowe, które są w Basan, sześćdziesiąt miast”. Księgi Kronik wywodzą Jaira od Chesrona z Judy przez córkę Makira, z dwudziestoma trzema miastami w Gileadzie, i dodają, że Geszur i Aram później je zabrały."
    - "Księga Sędziów opowiada o innym Jairze, Gileadczyku, który sądził Izraela dwadzieścia dwa lata i miał trzydziestu synów jeżdżących na trzydziestu oślętach, z trzydziestoma miastami, „które zwano Awot Jair aż po dzisiejszy dzień w ziemi Galaadskiej” (tekst synodalny ma trzydzieści dwa). Za Salomona okręg Ben-Gebera w Ramot w Gileadzie obejmował „wsi Jaira, syna Manasesowego, które leżą w Galaad” i sześćdziesiąt obwarowanych miast Argobu."
    - "Księgi nie zgadzają się co do liczby, dwadzieścia trzy, trzydzieści czy sześćdziesiąt, ani co do tego, czy wsie leżały w Gileadzie, czy w Baszanie; wielu uczonych czyta Jair jako nazwę rodu, którego osiedla z czasem się przesuwały i mnożyły. Nie zidentyfikowano żadnego miejsca i żadne nie zostało wykopane jako Chawwot-Jair; wsi szuka się zwykle we wzgórzach północnego Gileadu między Jarmukiem a Jabbokiem, koło dzisiejszych Irbid i Adżlun, może rozciągających się ku lawowym krainom Hauranu."
    - "Region ten to dziś prowincje Irbid i Adżlun w północnej Jordanii, dobrze nawodniony kraj rolniczy z dębowymi lasami Adżlun, gdzie wiele małych tellów pozostaje niezbadanych."
  it:
    - "Avvot-Iair, «i villaggi di Iair» (ebraico havvah, accampamento di tende o borgata), era un gruppo di insediamenti a est del Giordano nella Galaad settentrionale e in Basan, così chiamato da Iair della tribù di Manasse. I Numeri dicono che «Iair, figliuolo di Manasse, andò anch’egli e prese i loro borghi, e li chiamò Havvoth-Iair»; il Deuteronomio che egli prese tutta la regione di Argob fino ai confini di Ghesur e di Maaca e chiamò Basan col suo nome; Giosuè dà alla mezza tribù di Manasse «tutti i borghi di Iair in Basan, in tutto, sessanta terre». Le Cronache fanno risalire Iair a Chesron di Giuda attraverso la figlia di Machir, con ventitré città in Galaad, e aggiungono che Ghesur e Aram le presero poi."
    - "I Giudici raccontano di un altro Iair, un Galaadita che fu giudice d’Israele per ventidue anni e ebbe trenta figli che cavalcavano trenta asinelli, con trenta città «che si chiamano anche oggi i borghi di Jair, e sono nel paese di Galaad» (il testo sinodale ha trentadue). Sotto Salomone «i villaggi di Jair» in Galaad e le sessanta città murate di Argob appartenevano al distretto di Ben-Geber a Ramot di Galaad."
    - "I libri discordano sul numero, ventitré, trenta o sessanta, e sul fatto che i villaggi si trovassero in Galaad o in Basan; molti studiosi leggono Iair come il nome di un clan i cui insediamenti si spostarono e si moltiplicarono nel tempo. Nessun sito singolo è stato identificato, e nessuno è stato scavato come Avvot-Iair; i villaggi si cercano di solito sulle colline della Galaad settentrionale fra lo Yarmuk e lo Iabbok, intorno alle odierne Irbid e Ajlun, forse estendendosi verso la zona lavica dell’Auran."
    - "Quella regione è oggi costituita dai governatorati di Irbid e Ajlun nella Giordania settentrionale, un paese agricolo ben irrigato con i boschi di querce di Ajlun, dove molti piccoli tell restano inesplorati."
  nl:
    - "Havvot-Jaïr, “de dorpen van Jaïr” (Hebreeuws havvah, een tentenkamp of gehucht), was een groep nederzettingen ten oosten van de Jordaan in het noorden van Gilead en Basan, genoemd naar Jaïr van de stam Manasse. Numeri zegt dat “Jair nu, de zoon van Manasse, ging heen en nam hunlieder dorpen in, en hij noemde die Havvoth-Jair”; Deuteronomium dat hij het hele gebied van Argob tot aan de grens van Gesur en Maächa innam en Basan naar zichzelf noemde; Jozua geeft de halve Manasse “al de vlekken van Jair, die in Bazan zijn, zestig steden”. Kronieken voert Jaïr terug op Chesron van Juda via de dochter van Machir, met drieëntwintig steden in Gilead, en voegt toe dat Gesur en Aram ze later namen."
    - "Richteren vertelt van een andere Jaïr, een Gileadiet die tweeëntwintig jaar over Israël richtte en dertig zonen had op dertig ezelsveulens, met dertig steden die “zij noemden Havvoth-Jair, tot op dezen dag, dewelke in het land van Gilead zijn” (de Synodale tekst heeft tweeëndertig). Onder Salomo behoorden “de dorpen van Jair” in Gilead en de zestig ommuurde steden van Argob tot het district van Ben-Geber te Ramot in Gilead."
    - "De boeken verschillen over het aantal, drieëntwintig, dertig of zestig, en over de vraag of de dorpen in Gilead of in Basan lagen; veel geleerden lezen Jaïr als de naam van een geslacht wiens nederzettingen in de loop van de tijd verschoven en zich vermenigvuldigden. Geen enkele plaats is geïdentificeerd, en geen is als Havvot-Jaïr opgegraven; de dorpen worden gewoonlijk gezocht in de heuvels van noordelijk Gilead tussen de Yarmuk en de Jabbok, rond het moderne Irbid en Ajlun, misschien uitwaaierend naar het lavaland van de Hauran."
    - "Die streek is nu de gouvernementen Irbid en Ajlun in Noord-Jordanië, een waterrijk landbouwgebied met de eikenbossen van Ajlun, waar veel kleine tells onverkend zijn."
  cs:
    - "Chavót-jaír, „Jairovy vsi“ (hebrejsky chavva, tábor stanů nebo osada), byla skupina sídel východně od Jordánu v severním Gileadu a Bášanu, pojmenovaná po Jaírovi z kmene Manasesova. Numeri praví: „Jair také syn Manassesův táhl a vzal vsi jejich, a nazval je vsi Jairovy“; Deuteronomium, že vzal celou oblast Argob až k hranici Gešuru a Maaky a nazval Bášan podle sebe; Jozue dává půlkmeni Manasesovu „všecky vesnice Jair, kteréž jsou v Bázan, šedesáte měst“. Letopisy odvozují Jaíra od Checrona z Judy přes dceru Machírovu, s třiadvaceti městy v Gileadu, a dodávají, že je později vzaly Gešur a Aram."
    - "Soudcové vypráví o jiném Jaírovi, Gileadském, který soudil Izraele dvaadvacet let a měl třicet synů jezdících na třiceti oslatech, s třiceti městy, „kteráž sloula vsi Jairovy až do dnešního dne, a ty jsou v zemi Galád“ (synodální text má třicet dvě). Za Šalomouna patřily „vsi Jair, syna Manassesova, kteréž jsou v Galád“ a šedesát opevněných měst Argobu do okresu Ben-geberova v Rámotu v Gileadu."
    - "Knihy se rozcházejí v počtu, třiadvacet, třicet nebo šedesát, i v tom, zda vsi ležely v Gileadu, nebo v Bášanu; mnozí učenci čtou Jaír jako jméno rodu, jehož sídla se v čase posouvala a množila. Žádné jednotlivé místo nebylo ztotožněno ani vykopáváno jako Chavót-jaír; vsi se obvykle hledají v pahorcích severního Gileadu mezi Jarmukem a Jabokem, kolem dnešního Irbidu a Adžlúnu, snad s rozšířením k lávové zemi Havranu."
    - "Tato oblast je dnes gubernií Irbid a Adžlún v severním Jordánsku, dobře zavlažená zemědělská krajina s dubovými lesy Adžlúnu, kde zůstává mnoho malých telů neprozkoumaných."
  sv:
    - "Havvot-Jair, ”Jairs byar” (hebreiska havvah, ett tältläger eller en by), var en grupp bosättningar öster om Jordan i norra Gilead och Bashan, uppkallade efter Jair av Manasse stam. Fjärde Moseboken säger att ”Jair, Manasses son, gick åstad och intog deras byar och kallade dem Jairs byar”; Femte Moseboken att han tog hela landsträckan Argov till Geshurs och Maakas gräns och kallade Bashan efter sig själv; Josua ger halva Manasse ”alla Jairs byar i Basan, sextio städer”. Krönikeboken för Jair tillbaka till Hesron av Juda genom Makirs dotter, med tjugotre städer i Gilead, och tillägger att Geshur och Aram senare tog dem."
    - "Domarboken berättar om en annan Jair, en gileadit som dömde Israel i tjugotvå år och hade trettio söner som red på trettio åsnor, med trettio städer: ”Dessa kallar man ännu i dag Jairs byar, och de ligga i Gileads land” (den synodala texten har trettiotvå). Under Salomo hörde ”Jairs byar” i Gilead och Argovs sextio muromgärdade städer till Ben-Gebers distrikt i Ramot-Gilead."
    - "Böckerna är oeniga om antalet, tjugotre, trettio eller sextio, och om byarna låg i Gilead eller Bashan; många forskare läser Jair som namnet på en klan vars bosättningar växlade och förökades med tiden. Ingen enskild plats har identifierats, och ingen har grävts ut som Havvot-Jair; byarna söks vanligen i norra Gileads berg mellan Jarmuk och Jabbok, kring moderna Irbid och Ajlun, kanske med utbredning mot Haurans lavaland."
    - "Den trakten är i dag guvernementen Irbid och Ajlun i norra Jordanien, ett välvattnat jordbruksland med Ajluns ekskogar, där många små tell ännu är outforskade."
  nb:
    - "Havvot-Jair, «Jairs landsbyer» (hebraisk havvah, en teltleir eller liten landsby), var en gruppe bosetninger øst for Jordan i det nordlige Gilead og Basan, oppkalt etter Jair av Manasses stamme. Fjerde Mosebok sier: «Og Ja'ir, Manasses sønn, drog avsted og inntok deres landsbyer; og han kalte dem Ja'irs byer»; Femte Mosebok at han inntok hele Argob-landet til grensen mot Gesjur og Maaka og kalte Basan etter seg selv; Josva gir halve Manasse «alle Ja'irs teltbyer, som ligger i Basan, seksti byer». Krønikebøkene fører Jair tilbake til Hesron av Juda gjennom Makirs datter, med tre og tjue byer i Gilead, og legger til at Gesjur og Aram senere tok dem."
    - "Dommerboken forteller om en annen Jair, en gileaditt som dømte Israel i to og tjue år og hadde tretti sønner som red på tretti asenfoler, med tretti byer: «disse kalles den dag idag Ja'irs byer; de ligger i Gileads land» (den synodale teksten har trettito). Under Salomo hørte «Jairs byer» i Gilead og de seksti befestede byene i Argob til distriktet til Ben-Geber i Ramot-Gilead."
    - "Bøkene er uenige om tallet, tre og tjue, tretti eller seksti, og om landsbyene lå i Gilead eller Basan; mange forskere leser Jair som navnet på en klan hvis bosetninger flyttet seg og økte over tid. Ingen enkelt lokalitet er identifisert, og ingen er utgravd som Havvot-Jair; landsbyene søkes vanligvis i åsene i det nordlige Gilead mellom Yarmuk og Jabbok, rundt dagens Irbid og Ajlun, kanskje bredt ut mot lavalandet i Havran."
    - "Det området er i dag guvernementene Irbid og Ajlun i det nordlige Jordan, et godt vannet jordbruksland med eikeskogene i Ajlun, der mange små tell-hauger ligger uutforsket."
  tl:
    - "Ang Havoth-jair, “mga nayon ni Jair” (Hebreong havvah, kampo ng mga tolda o maliit na nayon), ay isang pangkat ng mga paninirahan sa silangan ng Jordan sa hilagang Gilead at Basan, na ipinangalan kay Jair ng lipi ni Manases. Sinasabi ng Mga Bilang na “si Jair na anak ni Manases ay naparoon at sinakop ang mga bayan niyaon at tinawag na Havoth-jair”; ng Deuteronomio na sinakop niya ang buong lupain ng Argob hanggang sa hangganan ng mga Gessureo at ng mga Machateo at tinawag ang Basan ayon sa kaniyang pangalan; ng Josue na ibinigay sa kalahating Manases “ang lahat ng mga bayan ng Jair na nasa Basan, anim na pung bayan”. Ibinabalik ng Mga Cronica si Jair kay Hezron ng Juda sa pamamagitan ng anak na babae ni Machir, na may dalawang pu't tatlong bayan sa Galaad, at idinaragdag na kinuha ang mga ito kalaunan ng Gesur at Aram."
    - "Isinasalaysay ng Mga Hukom ang isa pang Jair, isang Galaadita na naghukom sa Israel ng dalawang pu't dalawang taon at may tatlong pung anak na sumasakay sa tatlong pung asno, na may tatlong pung bayan na “tinatawag na Havot-jair hanggang sa araw na ito, na nangasa lupain ng Galaad” (ang tekstong Synodal ay may tatlumpu't dalawa). Sa ilalim ni Salomon “ang mga bayan ni Jair na anak ni Manases, na nasa Galaad” at ang animnapung kutang lungsod ng Argob ay kabilang sa distrito ni Ben-geber sa Ramoth-galaad."
    - "Hindi nagkakasundo ang mga aklat sa bilang, dalawampu't tatlo, tatlumpu o animnapu, at kung ang mga nayon ay nasa Gilead o Basan; binabasa ng maraming iskolar ang Jair bilang pangalan ng isang angkan na ang mga paninirahan ay lumipat at dumami sa paglipas ng panahon. Walang iisang lugar na natukoy, at wala ring nahukay bilang Havoth-jair; karaniwang hinahanap ang mga nayon sa mga burol ng hilagang Gilead sa pagitan ng Yarmuk at Jaboc, sa palibot ng makabagong Irbid at Ajlun, marahil na umaabot patungo sa lupaing lava ng Hauran."
    - "Ang rehiyong iyon ay ngayon ang mga gobernadorado ng Irbid at Ajlun sa hilagang Jordan, isang lupaing sakahan na masaganang may tubig na may mga gubat ng encina ng Ajlun, kung saan maraming maliliit na tell ang hindi pa napag-aaralan."
  da:
    - "Havvot-Ja'ir, »Jairs landsbyer« (hebraisk havvah, en teltlejr eller lille landsby), var en gruppe bosættelser øst for Jordan i det nordlige Gilead og Basan, opkaldt efter Jair af Manasses stamme. Fjerde Mosebog siger, at »Jair, Manasse Søn, gik hen og indtog deres Smaabyer og kaldte dem Havoth-Jair«; Femte Mosebog, at han indtog hele egnen Argob indtil Gesuriternes og Maakathiternes grænse og opkaldte Basan efter sig selv; Josva giver halve Manasse »alle Jairs Byer, som ligge i Basan, tresindstyve Stæder«. Krønikebøgerne fører Jair tilbage til Hezron af Juda gennem Makirs datter, med treogtyve byer i Gilead, og tilføjer, at Gesjur og Aram senere tog dem."
    - "Dommerbogen fortæller om en anden Jair, en gileadit, som dømte Israel to og tyve år og havde tredive sønner, der red på tredive asenføl, med tredive byer: »dem kaldte de Jairs Byer indtil denne Dag, de ligge i Gileads Land« (den russiske synodaltekst har toogtredive). Under Salomo hørte »Jairs, Manasse Søns, Byer, som ere i Gilead« og Argobs tres befæstede byer til Ben-Gebers distrikt i Ramot i Gilead."
    - "Bøgerne er uenige om tallet, treogtyve, tredive eller tres, og om landsbyerne lå i Gilead eller Basan; mange forskere læser Jair som navnet på en slægt, hvis bosættelser flyttede sig og formerede sig med tiden. Intet enkelt sted er identificeret, og intet er udgravet som Havvot-Ja'ir; landsbyerne søges sædvanligvis i det nordlige Gileads bjerge mellem Yarmuk og Jabbok, omkring nutidens Irbid og Ajlun, måske strækkende sig mod Haurans lavaland."
    - "Den egn er i dag guvernementerne Irbid og Ajlun i det nordlige Jordan, et veltvandet landbrugsland med Ajluns egeskove, hvor mange små tells forbliver uudforsket."
  sr:
    - "Јаирова села (хебрејски хавот-јаир, хава је логор шатора или засеок) била су скуп насеља источно од Јордана у северном Галаду и Васану, названа по Јаиру из Манасијиног племена. Бројеви кажу: „Јаир, син Манасијин отиде и узе села њихова и прозва их села Јаирова“; Поновљени закони да је узео сав крај Аргова до међе Гесура и Махе и Васан назвао својим именом; Исус Навин даје половини Манасијиног племена „сва села Јаирова, што су у Васану, шездесет градова“. Летописи изводе Јаира од Есрома из Јуде преко Махирове кћери, са двадесет три града у Галаду, и додају да су их Гесур и Арам касније узели."
    - "Судије приповедају о другом Јаиру, Галађанину који је судио Израиљу двадесет и две године и имао тридесет синова на тридесеторо магаради, са тридесет градова „који се зову села Јаирова до данас и јесу у земљи Галадовој“ (у синодском тексту је тридесет два). За Соломуна су „села Јаира“ у Галаду и шездесет утврђених градова Аргова припадала округу Вен-Гевера у Рамоту Галадском."
    - "Књиге се разилазе у броју, двадесет три, тридесет или шездесет, и у томе да ли су села лежала у Галаду или Васану; многи научници читају Јаир као име рода чија су се насеља временом померала и множила. Ни једно место није утврђено и ни једно није ископавано као Јаирова села; села се обично траже у брдима северног Галада између Јармука и Јавока, око данашњих Ирбида и Аџлуна, можда ширећи се према вулканском крају Аврана."
    - "Тај крај је данас гувернорати Ирбид и Аџлун у северном Јордану, добро наводњена пољопривредна земља са храстовим шумама Аџлуна, где су многе мале хумке још неистражене."
  hu:
    - "Havvót-Jaír, „Jaír falvai” (héberül havvá: sátortábor vagy falu), a Jordántól keletre, Gileád északi részén és Básánban fekvő települések csoportja volt, amelyet a Manassé törzséből való Jaírról neveztek el. A Számok könyve szerint „Jáir pedig, a Manasse fia elméne, és bevevé azoknak falvait, és hívá azokat Jáir falvainak”; a Mózes ötödik könyve szerint Argób egész vidékét kapta a Gesúr és Maaka határáig, és Básánt is a nevéről nevezte; Józsué Manassé fél törzsének határához számítja „Jairnak minden faluja, a melyek Básánban vannak, hatvan város”-t. A Krónikák Jaírt Júda Hecrónjától Mákír leányán át vezeti le, huszonhárom várossal Gileádban, és hozzáteszi, hogy Gesúr és Arám később elvette őket."
    - "A Bírák könyve egy másik Jaírról is szól, egy gileádiról, aki huszonkét évig ítélte Izráelt, harminc fia harminc szamárcsikón nyargalt, és harminc városuk volt, „melyeket mind e mai napig Jáir faluinak neveznek, melyek Gileád földén vannak” (a szinodális szövegben harminckettő áll). Salamon alatt „Jáirnak, a Manasse fiának falui, melyek Gileádban valának”, és Argób hatvan megerősített városa Ben-Géber rámót-gileádi kerületéhez tartozott."
    - "A könyvek eltérnek a számban, huszonhárom, harminc vagy hatvan, és abban is, hogy a falvak Gileádban vagy Básánban feküdtek-e; sok kutató Jaírt egy nemzetség nevének olvassa, amelynek települései idővel eltolódtak és megsokasodtak. Egyetlen helyet sem azonosítottak, és egyet sem ástak ki Havvót-Jaírként; a falvakat rendszerint Gileád északi hegyeiben keresik a Jarmuk és a Jabbók között, a mai Irbid és Adzslún körül, talán a Hauran lávavidéke felé is kiterjedve."
    - "Ez a vidék ma Észak-Jordánia Irbid és Adzslún kormányzósága, jól öntözött mezőgazdasági vidék Adzslún tölgyeseivel, ahol sok kis tell feltáratlan."
  fi:
    - "Havvot-Jair, ”Jairin kylät” (heprean havvah, telttaleiri tai pikkukylä), oli ryhmä asutuksia Jordanin itäpuolella Pohjois-Gileadissa ja Basanissa, nimetty Manassen heimon Jairin mukaan. Mooseksen neljäs kirja sanoo: ”Jaair, Manassen poika, meni ja valloitti heidän leirikylänsä ja kutsui ne Jaairin leirikyliksi”; Mooseksen viides kirja, että hän valloitti koko Argobin alueen Gesurin ja Maakan rajalle ja nimesi Basanin itsensä mukaan; Joosua antaa Manassen puolelle heimolle ”kaikki Jaairin leirikylät Baasanissa, kuusikymmentä kaupunkia”. Aikakirjat johtavat Jairin Juudan Hesronista Makirin tyttären kautta kahdenkymmenenkolmen Gileadin kaupungin kanssa ja lisäävät, että Gesur ja Aram veivät ne myöhemmin."
    - "Tuomarien kirja kertoo toisesta Jairista, gileadilaisesta, joka tuomitsi Israelia kaksikymmentäkaksi vuotta ja jolla oli kolmekymmentä poikaa ratsastamassa kolmellakymmenellä aasilla, ja kolmekymmentä kaupunkia, ”joita vielä tänäkin päivänä kutsutaan Jaairin leirikyliksi ja jotka ovat Gileadin maassa” (synodaalisessa tekstissä on kolmekymmentäkaksi). Salomon aikana ”Jaairin leirikylät” Gileadissa ja Argobin kuusikymmentä muurien ympäröimää kaupunkia kuuluivat Ben-Geberin piiriin Ramot-Gileadissa."
    - "Kirjat ovat eri mieltä lukumäärästä, kaksikymmentäkolme, kolmekymmentä tai kuusikymmentä, ja siitä, sijaitsivatko kylät Gileadissa vai Basanissa; monet tutkijat lukevat Jairin suvun nimeksi, jonka asutukset siirtyivät ja lisääntyivät ajan mittaan. Yhtäkään paikkaa ei ole tunnistettu, eikä yhtäkään kaivettu Havvot-Jairina; kyliä etsitään yleensä Pohjois-Gileadin kukkuloilta Jarmukin ja Jabbokin väliltä, nykyisen Irbidin ja Ajlunin seudulta, ehkä levittäytyen kohti Hauranin laavamaata."
    - "Seutu on nykyään Pohjois-Jordanian Irbidin ja Ajlunin kuvernementit, hyvin kasteltua viljelymaata Ajlunin tammimetsineen, jossa monet pienet kummut ovat yhä tutkimatta."
  vi:
    - "Ha-vốt Giai-rơ, “các thôn Giai-rơ” (tiếng Hê-bơ-rơ havvah, trại lều hay xóm nhỏ), là một nhóm khu định cư phía đông sông Giô-đanh ở bắc Ga-la-át và Ba-san, đặt tên theo Giai-rơ thuộc chi phái Ma-na-se. Dân Số Ký nói rằng “Giai-rơ, là con trai Ma-na-se, đi chiếm các thôn dân A-mô-rít, đặt tên là thôn Giai-rơ”; Phục Truyền nói ông chiếm cả miền Ạt-gốp đến giới hạn Ghê-su-rơ và Ma-a-ca và đặt tên mình cho Ba-san; Giô-suê ban cho nửa Ma-na-se “các thôn Giai-rơ trong Ba-san, có sáu mươi thành”. Sách Sử Ký truy Giai-rơ về Hết-rôn của Giu-đa qua con gái Ma-ki, với hai mươi ba thành ở Ga-la-át, và thêm rằng Ghê-su-rơ và A-ram về sau chiếm chúng."
    - "Sách Các Quan Xét kể về một Giai-rơ khác, người Ga-la-át đã xét xử Y-sơ-ra-ên hai mươi hai năm và có ba mươi con trai cỡi ba mươi lừa con, với ba mươi thành mà người ta “cũng còn gọi nó là thôn Giai-rơ” “ở tại xứ Ga-la-át” (bản Synodal có ba mươi hai). Dưới Sa-lô-môn, các thôn Giai-rơ ở Ga-la-át và sáu mươi thành có tường của Ạt-gốp thuộc khu của Bên-Ghê-be tại Ra-mốt Ga-la-át, là người “coi thôn Giai-rơ, ở trong Ga-la-át”."
    - "Các sách bất đồng về con số, hai mươi ba, ba mươi hay sáu mươi, và về việc các thôn nằm ở Ga-la-át hay Ba-san; nhiều học giả đọc Giai-rơ là tên của một gia tộc có các khu định cư dịch chuyển và tăng lên theo thời gian. Chưa xác định được địa điểm đơn lẻ nào, và không nơi nào được khai quật như là Ha-vốt Giai-rơ; các thôn thường được tìm trong các đồi bắc Ga-la-át giữa sông Yarmuk và Gia-bốc, quanh Irbid và Ajlun hiện đại, có lẽ lan về vùng đất dung nham của Ha-vơ-ran."
    - "Vùng đó ngày nay là các tỉnh Irbid và Ajlun của bắc Jordan, miền canh tác nhiều nước với rừng sồi Ajlun, nơi còn nhiều gò nhỏ chưa được khám phá."
  ro:
    - "Havot-Iair, „satele lui Iair” (în ebraică havvah, tabără de corturi sau cătun), era un grup de așezări la est de Iordan, în nordul Galaadului și în Basan, numit după Iair din seminția lui Manase. Numeri spune că „Iahir feciorul lui Manasì a mers, și a luat sălașurile lor, și le-a numit sălașurile lui Iahir”; Deuteronomul, că a luat „toată laturea Argovului, până la hotarele Gargasii și ale Mahatii” și a numit Basanul după sine; Iosua dă jumătății de Manase „toate satele Iair, care sunt în pământul Vasanitidei șasezeci de cetăți”. Cronicile îl leagă pe Iair de Hețron al lui Iuda prin fiica lui Machir, cu douăzeci și trei de cetăți în Galaad, și adaugă că Gheșur și Aram le-au luat mai târziu."
    - "Cartea Judecătorilor vorbește despre un alt Iair, un galaadit care a judecat Israelul douăzeci și doi de ani și a avut treizeci de fii călare pe treizeci de mânji de măgar, cu treizeci de cetăți pe care „le-au chemat satele lui Iair până în ziua aceasta, și sunt acestea în pământul Galaad” (textul sinodal are treizeci și doi). Sub Solomon, orașele lui Iair din Galaad și cele șaizeci de cetăți întărite ale Argobului țineau de districtul lui Ben-Gheber, de la Ramot din Galaad."
    - "Cărțile nu se potrivesc asupra numărului, douăzeci și trei, treizeci sau șaizeci, și asupra faptului dacă satele erau în Galaad sau în Basan; mulți cercetători citesc Iair ca numele unui clan ale cărui așezări s-au mutat și s-au înmulțit în timp. Niciun loc unic nu a fost identificat, și niciunul nu a fost săpat ca Havot-Iair; satele sunt căutate de obicei în dealurile nordului Galaadului, între Yarmuk și Iaboc, în jurul Irbidului și Ajlunului de azi, poate întinzându-se spre ținutul de lavă al Hauranului."
    - "Regiunea este astăzi guvernoratele Irbid și Ajlun din nordul Iordaniei, un ținut agricol bine udat, cu pădurile de stejar din Ajlun, unde multe mici movile rămân neexplorate."
  bg:
    - "Хавот-Яир, „селата на Яир“ (еврейски хава — шатров лагер или махала), беше група селища на изток от Йордан в северен Галаад и Васан, наречени на Яир от племето на Манасия. Числа казва, че „Яир Манасиевът син отиде та завладя паланките му, и наименува ги Авот-Яир“; Второзаконие — че той взел цялата област Аргов до пределите на Гесур и Маха и нарекъл Васан на себе си; книгата на Иисус Навин дава на половината от Манасия „всичките паланки на Яир които са у Васан, шестдесет градове“. Летописи извежда Яир от Хецрон от Юда чрез дъщерята на Махир, с двадесет и три града в Галаад, и добавя, че по-късно Гесур и Арам ги взели."
    - "Съдии разказва за друг Яир, галаадец, който съди Израил двадесет и две години и имаше тридесет сина, яздещи тридесет ослови жребета, с тридесет града, „називаеми Яирови Паланки дори до днес, които са в земята Галаад“ (Синодалният текст има тридесет и два). При Соломон „паланките на Яира“ в Галаад и шестдесетте укрепени града на Аргов принадлежаха на областта на Бен-Гевер в Рамот Галаадски."
    - "Книгите не са съгласни за броя — двадесет и три, тридесет или шестдесет, и за това дали селата са лежали в Галаад или във Васан; много учени четат Яир като име на род, чиито селища са се премествали и умножавали с времето. Нито едно отделно място не е идентифицирано и никое не е разкопавано като Хавот-Яир; селата обикновено се търсят в хълмовете на северен Галаад между Ярмук и Явок, около днешните Ирбид и Аджлун, като може би са стигали към лавовата земя на Хауран."
    - "Тази област днес са губернаторствата Ирбид и Аджлун в Северна Йордания — добре напоявана земеделска земя с дъбовите гори на Аджлун, където много малки могили остават непроучени."
