# Overview article (ADR 0007). Mainstream facts only; the differing numbers and locations in the sources are set out, not harmonised.
id: havvoth-jair
place: a26c8f2
title:
  en: "Havvoth-jair"
  ru: "Селения Иаировы"
  uk: "Селища Яіра"
  es: "Havot-jair"
  pt: "Havote-Jair"
  de: "Hawwot-Jair"
  fr: "Bourgs de Jaïr"
body:
  en:
    - "Havvoth-jair, “the villages of Jair” (Hebrew havvah, a tent camp or hamlet), was a group of settlements east of the Jordan in northern Gilead and Bashan, named after Jair of the tribe of Manasseh. Numbers says that “Jair the son of Manasseh went and took the small towns thereof, and called them Havoth-jair”; Deuteronomy that he took all the region of Argob to the border of Geshur and Maacah and called Bashan after himself; Joshua gives half-Manasseh “all the towns of Jair, which are in Bashan, threescore cities”. Chronicles traces Jair to Hezron of Judah through the daughter of Machir, with twenty-three cities in Gilead, and adds that Geshur and Aram later took them."
    - "Judges tells of another Jair, a Gileadite who judged Israel twenty-two years and had thirty sons riding thirty ass colts, with thirty cities “called Havoth-jair unto this day, which are in the land of Gilead” (the Synodal text has thirty-two). Under Solomon “the towns of Jair” in Gilead and the sixty walled cities of Argob belonged to the district of Ben-geber at Ramoth-gilead."
    - "The books disagree about the number, twenty-three, thirty or sixty, and about whether the villages lay in Gilead or Bashan; many scholars read Jair as the name of a clan whose settlements shifted and multiplied over time. No single site has been identified, and none has been excavated as Havvoth-jair; the villages are usually sought in the hills of northern Gilead between the Yarmuk and the Jabbok, about modern Irbid and Ajlun, perhaps spreading toward the lava country of the Hauran."
    - "That region is today the Irbid and Ajlun governorates of northern Jordan, a well-watered farming country with the oak woods of Ajlun, where many small tells remain unexplored."
  ru:
    - "Селения Иаировы, по-еврейски Хаввот-Яир (хавва — стан шатров или хутор), были группой поселений к востоку от Иордана, в северном Галааде и Васане, названных по Иаиру из колена Манассиина. Книга Чисел говорит: «Иаир, сын Манассии, пошел и взял селения их, и назвал их: селения Иаировы»; Второзаконие — что он взял всю область Аргов до пределов Гесурских и Маахских и назвал Васан своим именем; книга Иисуса Навина даёт половине Манассии «все селения Иаировы, что в Васане, шестьдесят городов». Паралипоменон возводит Иаира к Есрому из Иуды через дочь Махира, с двадцатью тремя городами в Галааде, и добавляет, что Гессуряне и Сирияне позже их взяли."
    - "Книга Судей рассказывает о другом Иаире, Галаадитянине, который судил Израиль двадцать два года и имел по Синодальному тексту тридцать два сына на молодых ослах и тридцать два города, что «до сего дня называют селениями Иаира, что в земле Галаадской» (в еврейском тексте — тридцать). При Соломоне «селения Иаира» в Галааде и шестьдесят укреплённых городов Аргова входили в округ Бен-Гевера в Рамофе Галаадском."
    - "Книги расходятся в числе — двадцать три, тридцать или шестьдесят — и в том, лежали ли селения в Галааде или в Васане; многие учёные читают Иаира как имя рода, чьи поселения со временем смещались и множились. Ни одно место не отождествлено и ни одно не раскопано как Селения Иаировы; их обычно ищут в горах северного Галаада между Ярмуком и Иавоком, около нынешних Ирбида и Аджлуна, возможно, с выходом к лавовой стране Хаурана."
    - "Эта область сегодня — провинции Ирбид и Аджлун на севере Иордании, хорошо орошённый земледельческий край с дубовыми лесами Аджлуна, где многие небольшие телли остаются неисследованными."
  uk:
    - "Селища Яіра (давньоєвр. хаввот-яір, «намети Яіра»; хавва — наметовий табір або хутір) — група поселень на схід від Йордану в північному Гілеаді й Башані, названа за Яіром з коліна Манасії. Книга Чисел каже: «Яір же Манассієнко пійшов і заняв села їх та й назвав їх Яїровими селами»; Повторення Закону — що він узяв усю округу Аргов до межі Гешуру й Мааха й назвав Башан за собою; Книга Ісуса Навина дає половині коліна Манасії «через усї села Яірові в Базанї, шістьдесять міст». Хроніки виводять Яіра від Хецрона з Юди через дочку Махіра, з двадцятьма трьома містами в Гілеаді, і додають, що Гешур і Арам пізніше їх забрали."
    - "Книга Суддів розповідає про іншого Яіра, гілеадянина, який судив Ізраїль двадцять два роки і мав тридцять синів, що їздили на тридцяти ослицях, і тридцять міст, які й донині зовуться Селищами Яіра в краї Гілеад (Синодальний текст має тридцять два). За Соломона «оселї Яірові Манассієнкові, що в Галаадї, і країну Аргоб у Басанї, шістьдесять великих городів з мурами» належали до округи Бен-Гевера в Рамоті Гілеадському."
    - "Книги розходяться щодо числа — двадцять три, тридцять чи шістдесят — і щодо того, чи лежали селища в Гілеаді, чи в Башані; багато дослідників читають Яір як назву роду, чиї поселення з часом переміщувалися й множилися. Жодного окремого місця не ототожнено, і жодне не розкопували як Селища Яіра; їх зазвичай шукають у пагорбах північного Гілеаду між Ярмуком і Яббоком, довкола сучасних Ірбіда й Аджлуна, можливо, з поширенням у бік лавового краю Хавран."
    - "Цей край нині — округи Ірбід і Аджлун на півночі Йорданії, добре зрошений землеробський край з дубовими лісами Аджлуна, де багато малих теллів лишаються недослідженими."
  es:
    - "Havot-jair, «las aldeas de Jair» (en hebreo havvah, campamento de tiendas o caserío), era un grupo de asentamientos al este del Jordán, en el norte de Galaad y en Basán, llamados así por Jair, de la tribu de Manasés. Números dice que «Jair hijo de Manasés fué y tomó sus aldeas, y púsoles por nombre Havoth-jair»; Deuteronomio, que tomó toda la región de Argob hasta el límite de Gesur y Maaca y dio a Basán su propio nombre; Josué da a la media tribu de Manasés «todas las aldeas de Jair que están en Basán, sesenta poblaciones». Crónicas hace descender a Jair de Hezrón, de Judá, por la hija de Maquir, con veintitrés ciudades en Galaad, y añade que Gesur y Aram se las tomaron después."
    - "Jueces habla de otro Jair, un galaadita que juzgó a Israel veintidós años y tuvo treinta hijos que cabalgaban sobre treinta asnos, con treinta ciudades «que se llamaron las villas de Jair hasta hoy, las cuales están en la tierra de Galaad» (el texto sinodal tiene treinta y dos). Bajo Salomón, «las ciudades de Jair» en Galaad y las sesenta ciudades amuralladas de Argob pertenecían al distrito de Ben-geber en Ramot de Galaad."
    - "Los libros discrepan en el número, veintitrés, treinta o sesenta, y en si las aldeas estaban en Galaad o en Basán; muchos estudiosos leen Jair como el nombre de un clan cuyos asentamientos cambiaron y se multiplicaron con el tiempo. No se ha identificado ningún sitio único, y ninguno ha sido excavado como Havot-jair; las aldeas suelen buscarse en las colinas del norte de Galaad entre el Yarmuk y el Jaboc, en torno a las actuales Irbid y Ajlun, quizá extendiéndose hacia la región de lava del Haurán."
    - "Esa región es hoy las gobernaciones de Irbid y Ajlun, en el norte de Jordania, un país de cultivo bien regado con los robledales de Ajlun, donde quedan sin explorar muchos pequeños tells."
  pt:
    - "Havote-Jair, “as aldeias de Jair” (hebraico havvah, acampamento de tendas ou povoado), era um grupo de povoados a leste do Jordão, no norte de Gileade e em Basã, assim chamado por Jair, da tribo de Manassés. Números diz que “Jair, filho de Manassés, foi e tomou os seus povoados, e os chamou de Havote-Jair”; Deuteronômio, que ele tomou toda a região de Argobe até a fronteira de Gesur e Maacá e deu a Basã o seu próprio nome; Josué dá à meia tribo de Manassés “todas as aldeias de Jair, que estão em Basã, sessenta cidades”. Crônicas traça Jair a Hezrom, de Judá, pela filha de Maquir, com vinte e três cidades em Gileade, e acrescenta que Gesur e Arã as tomaram depois."
    - "Juízes fala de outro Jair, um gileadita que julgou Israel vinte e dois anos e teve trinta filhos que montavam em trinta jumentinhos, com trinta cidades “que são chamadas Havote-Jair até o dia de hoje, e ficam na terra de Gileade” (o texto Sinodal tem trinta e duas). Sob Salomão, “os povoados de Jair, filho de Manassés, que estão em Gileade” e as sessenta cidades muradas de Argobe pertenciam ao distrito de Ben-Geber em Ramote-Gileade."
    - "Os livros divergem quanto ao número, vinte e três, trinta ou sessenta, e quanto a os povoados ficarem em Gileade ou em Basã; muitos estudiosos leem Jair como o nome de um clã cujos povoados mudaram e se multiplicaram com o tempo. Nenhum sítio único foi identificado, e nenhum foi escavado como Havote-Jair; os povoados costumam ser procurados nas colinas do norte de Gileade, entre o Yarmuk e o Jaboque, em torno das modernas Irbid e Ajlun, talvez se estendendo para a região de lava do Haurã."
    - "Essa região é hoje as províncias de Irbid e Ajlun, no norte da Jordânia, terra agrícola bem irrigada, com os bosques de carvalhos de Ajlun, onde muitos pequenos tells permanecem inexplorados."
  de:
    - "Hawwot-Jair, „die Dörfer Jaïrs“ (hebräisch chawwa, ein Zeltlager oder Weiler), war eine Gruppe von Siedlungen östlich des Jordan im nördlichen Gilead und in Baschan, benannt nach Jaïr aus dem Stamm Manasse. Das vierte Buch Mose sagt: „Jair aber, der Sohn Manasses, ging hin und gewann ihre Dörfer und hieß sie Dörfer Jairs“; das fünfte, er habe die ganze Gegend Argob bis an die Grenze der Geschuriter und Maachathiter genommen und Baschan nach seinem Namen benannt; Josua gibt dem halben Manasse „alle Flecken Jairs, die in Basan liegen“, sechzig Städte. Die Chronik führt Jaïr über die Tochter Machirs auf Hezron von Juda zurück, mit dreiundzwanzig Städten in Gilead, und fügt hinzu, Geschur und Aram hätten sie später genommen."
    - "Das Buch der Richter erzählt von einem anderen Jaïr, einem Gileaditer, der Israel zweiundzwanzig Jahre richtete und dreißig Söhne hatte, die auf dreißig Eselsfüllen ritten, mit dreißig Städten, die „Dörfer Jairs bis auf diesen Tag“ hießen „und liegen in Gilead“ (der Synodaltext hat zweiunddreißig). Unter Salomo gehörten „die Flecken Jairs“ in Gilead und die sechzig befestigten Städte Argobs zum Bezirk Ben-Gebers in Ramot in Gilead."
    - "Die Bücher widersprechen sich in der Zahl, dreiundzwanzig, dreißig oder sechzig, und darin, ob die Dörfer in Gilead oder in Baschan lagen; viele Forscher lesen Jaïr als Namen einer Sippe, deren Siedlungen sich im Lauf der Zeit verschoben und vermehrten. Keine einzelne Stätte ist identifiziert, und keine ist als Hawwot-Jair ausgegraben; die Dörfer werden meist im Bergland des nördlichen Gilead zwischen Jarmuk und Jabbok gesucht, um das heutige Irbid und Adschlun, vielleicht sich zum Lavaland des Hauran hin ausbreitend."
    - "Diese Gegend sind heute die Gouvernements Irbid und Adschlun im Norden Jordaniens, ein gut bewässertes Ackerland mit den Eichenwäldern von Adschlun, wo viele kleine Tells unerforscht sind."
  fr:
    - "Les bourgs de Jaïr (hébreu havvah, camp de tentes ou hameau) étaient un groupe d’établissements à l’est du Jourdain, dans le nord de Galaad et en Basan, nommés d’après Jaïr, de la tribu de Manassé. Les Nombres disent que « Jaïr, fils de Manassé, se mit en marche, prit les bourgs, et les appela bourgs de Jaïr » ; le Deutéronome qu’il prit toute la contrée d’Argob jusqu’à la frontière des Gueschuriens et des Maacathiens et appela Basan de son nom ; Josué donne à la demi-tribu de Manassé « tous les bourgs de Jaïr en Basan, soixante villes ». Les Chroniques rattachent Jaïr à Hetsron de Juda par la fille de Makir, avec vingt-trois villes en Galaad, et ajoutent que Gueschur et Aram les prirent plus tard."
    - "Les Juges parlent d’un autre Jaïr, un Galaadite qui fut juge en Israël pendant vingt-deux ans et eut trente fils montant sur trente ânons, avec trente villes « appelées encore aujourd’hui bourgs de Jaïr, et situées dans le pays de Galaad » (le texte synodal en compte trente-deux). Sous Salomon, « les bourgs de Jaïr » en Galaad et les soixante villes à murailles d’Argob relevaient du district du fils de Guéber, à Ramoth en Galaad."
    - "Les livres divergent sur le nombre, vingt-trois, trente ou soixante, et sur la question de savoir si les bourgs se trouvaient en Galaad ou en Basan ; beaucoup de spécialistes lisent Jaïr comme le nom d’un clan dont les établissements se déplacèrent et se multiplièrent avec le temps. Aucun site unique n’a été identifié, et aucun n’a été fouillé comme étant les bourgs de Jaïr ; on les cherche d’ordinaire dans les collines du nord de Galaad entre le Yarmouk et le Jabbok, vers Irbid et Ajloun actuelles, peut-être s’étendant vers le pays de lave du Havran."
    - "Cette région est aujourd’hui celle des gouvernorats d’Irbid et d’Ajloun, dans le nord de la Jordanie, un pays agricole bien arrosé avec les bois de chênes d’Ajloun, où de nombreux petits tells restent inexplorés."
