body:
  en:
    - "Baalah is another name of Kiriath-jearim, the town on the border of Judah and Benjamin about 13 km west of Jerusalem where the ark of the covenant rested for twenty years. Joshua, tracing Judah's northern border, brings it from the spring of Nephtoah to Mount Ephron, “and the border was drawn to Baalah, which is Kirjath-jearim: And the border compassed from Baalah westward unto mount Seir”; the same book twice calls the town Kirjath-baal, “which is Kirjath-jearim”. The Chronicler has David go up “to Baalah, that is, to Kirjath-jearim, which belonged to Judah, to bring up thence the ark of God”, where the parallel in Samuel says he went “from Baale of Judah”. The old name points to a Canaanite sanctuary of Baal; Kiriath-jearim, “the city of forests”, is the name Israel used."
    - "Two other places share the name and are not this one: Baalah, a town in the Negeb of Judah, and Mount Baalah on the border near Ekron and Jabneel. Kiriath-jearim itself is identified with Deir el-Azar, the hill above Abu Ghosh, where Eusebius already knew Kariathiareim on the road from Jerusalem to Diospolis. Excavations in 2017 found on the summit a great artificial platform held by massive retaining walls, which the excavators date to the eighth century BC; who built it, and why, is debated."
    - "Today the summit carries the church of Our Lady of the Ark of the Covenant, built in 1924 over the remains of a Byzantine church, with a statue of Mary visible from the Jerusalem road; the article on Kiriath-jearim tells the rest of the story."
  ru:
    - "Ваал — другое имя Кириаф-Иарима, города на границе Иуды и Вениамина примерно в 13 км к западу от Иерусалима, где двадцать лет стоял ковчег завета. Книга Иисуса Навина, ведя северный предел Иуды от источника Нефтоах к горе Ефрона, говорит: «поворачивает предел к Ваалу, который есть Кириаф-Иарим; потом поворачивает предел от Ваала к морю и идет к горе Сеиру»; та же книга дважды зовёт город Кириаф-Ваал, «иначе Кириаф-Иарим». В книге Царств Давид идёт за ковчегом «из Ваала Иудина»; в параллельном рассказе Паралипоменон еврейский текст тоже называет Ваал, но Синодальный перевод оставляет там только Кириаф-Иарим. Старое имя указывает на ханаанское святилище Ваала; Кириаф-Иарим, «город лесов», — имя, которым пользовался Израиль."
    - "Два других места носят то же имя и к этому не относятся: Ваала, город в Негеве Иудином, и гора Ваал на границе близ Екрона и Иавнеила. Сам Кириаф-Иарим отождествляют с Дейр-эль-Азаром, холмом над Абу-Гошем, где Евсевий уже знал Кариафиарим на дороге из Иерусалима в Диосполь. Раскопки 2017 года открыли на вершине большую искусственную площадку, удержанную мощными подпорными стенами, которую раскопщики датируют VIII веком до н. э.; кто и зачем её построил, спорно."
    - "Сегодня вершину занимает церковь Богоматери Ковчега Завета, построенная в 1924 году над остатками византийской церкви, со статуей Марии, видной с иерусалимской дороги; остальное рассказывает статья о Кириаф-Иариме."
  uk:
    - "Ваала — інша назва Кіріят-Єаріма, міста на межі Юди і Веніяміна приблизно за 13 км на захід від Єрусалима, де ковчег завіту спочивав двадцять років. Ісус Навин, окреслюючи північний кордон Юди, веде його від джерела Нефтоах до гори Ефрон, і «повертає гряниця на Баалу, се Киріят-Ярим. Від Баала ж повертає гряниця на захід сонця до Сеір-гори»; та сама книга двічі називає місто Киріят-Баал, «се Киріят-Ярим». Хронікар каже, що Давид пішов до Ваали, тобто до Кіріят-Єаріма, що належав Юді, щоб звідти перенести ковчег Божий, а в паралельному місці Самуїла сказано, що він вирушив із Ваали Юдиної (так у єврейському тексті; в Кулішевому перекладі цих слів немає). Давня назва вказує на ханаанське святилище Ваала; Кіріят-Єарим, «місто лісів», — ім'я, яким користувався Ізраїль."
    - "Ще два місця мають ту саму назву, і це не воно: Ваала, місто в Негеві Юди, і гора Ваала на кордоні біля Екрону та Явнеїла. Сам Кіріят-Єарим ототожнюють із Дейр-ель-Азаром, пагорбом над Абу-Гошем, де Євсевій уже знав Каріатіарім на дорозі від Єрусалима до Діосполя. Розкопки 2017 року знайшли на вершині велику штучну платформу, утримувану масивними підпірними стінами, яку розкопники датують VIII століттям до н. е.; хто і навіщо її збудував, дискутується."
    - "Нині на вершині стоїть церква Богоматері Ковчега Завіту, збудована 1924 року над рештками візантійської церкви, зі статуєю Марії, видною з єрусалимської дороги; решту історії розповідає стаття про Кіріят-Єарим."
  es:
    - "Baala es otro nombre de Quiriat-jearim, la ciudad en la frontera entre Judá y Benjamín, a unos 13 km al oeste de Jerusalén, donde reposó durante veinte años el arca de la alianza. Josué, trazando la frontera septentrional de Judá, la lleva desde la fuente de Neftoa hasta el monte Efrón, «rodeando luego el mismo término á Baala, la cual es Chîriath-jearim. Después torna este término desde Baala hacia el occidente al monte de Seir»; el mismo libro llama dos veces a la ciudad Quiriat-baal, «que es Chîriath-jearim». El Cronista hace que David suba «á Baala de Chîriath-jearim, que es en Judá, para pasar de allí el arca de Jehová Dios», donde el paralelo de Samuel dice que fue «de Baal de Judá». El antiguo nombre apunta a un santuario cananeo de Baal; Quiriat-jearim, «ciudad de los bosques», es el nombre que usó Israel."
    - "Otros dos lugares comparten el nombre y no son este: Baala, una ciudad en el Néguev de Judá, y el monte Baala en la frontera cerca de Ecrón y Jabneel. La propia Quiriat-jearim se identifica con Deir el-Azar, la colina sobre Abu Ghosh, donde Eusebio ya conocía Kariathiareim en el camino de Jerusalén a Dióspolis. Las excavaciones de 2017 hallaron en la cima una gran plataforma artificial sostenida por macizos muros de contención, que los excavadores fechan en el siglo VIII a. C.; quién la construyó, y por qué, se debate."
    - "Hoy la cima lleva la iglesia de Nuestra Señora del Arca de la Alianza, construida en 1924 sobre los restos de una iglesia bizantina, con una estatua de María visible desde el camino de Jerusalén; el artículo sobre Quiriat-jearim cuenta el resto de la historia."
  pt:
    - "Baalá é outro nome de Quiriate-Jearim, a cidade na fronteira de Judá e Benjamim, cerca de 13 km a oeste de Jerusalém, onde a arca da aliança ficou vinte anos. Josué, traçando a fronteira norte de Judá, leva-a da fonte de Neftoa ao monte Efrom, “a fronteira se estendia até Baalá (também chamada Quiriate-Jearim); e a fronteira contornava desde Baalá, para o oeste, até o monte Seir”; o mesmo livro chama duas vezes a cidade Quiriate-Baal, “também chamada Quiriate-Jearim”. O Cronista faz Davi subir “a Baalá, isto é, a Quiriate-Jearim, que pertencia a Judá, para trazer de lá a arca de Deus”, onde o paralelo de Samuel diz que foi “de Baalá de Judá”. O nome antigo aponta para um santuário cananeu de Baal; Quiriate-Jearim, “cidade das florestas”, é o nome que Israel usava."
    - "Dois outros lugares partilham o nome e não são este: Baalá, uma cidade no Neguebe de Judá, e o monte Baalá, na fronteira perto de Ecrom e Jabneel. A própria Quiriate-Jearim é identificada com Deir el-Azar, a colina acima de Abu Ghosh, onde Eusébio já conhecia Kariathiareim na estrada de Jerusalém a Diópolis. Escavações em 2017 acharam no cume uma grande plataforma artificial sustentada por maciços muros de arrimo, que os escavadores datam do século VIII a.C.; quem a construiu, e por quê, é discutido."
    - "Hoje o cume tem a igreja de Nossa Senhora da Arca da Aliança, construída em 1924 sobre os restos de uma igreja bizantina, com uma estátua de Maria visível da estrada de Jerusalém; o artigo sobre Quiriate-Jearim conta o resto da história."
  de:
    - "Baala ist ein anderer Name für Kirjat-Jearim, die Stadt an der Grenze von Juda und Benjamin etwa 13 km westlich von Jerusalem, wo die Bundeslade zwanzig Jahre ruhte. Josua führt, Judas Nordgrenze beschreibend, sie von der Quelle Neftoach zum Berg Efron, „und neigt sich gen Baala, das ist Kirjath-Jearim, und lenkt sich herum von Baala gegen Abend zum Gebirge Seir“; dasselbe Buch nennt die Stadt zweimal Kirjat-Baal, „das ist Kirjath-Jearim“. Der Chronist lässt David hinaufziehen „gen Baala, nach Kirjath-Jearim, welches liegt in Juda, daß er von da heraufbrächte die Lade Gottes“, wo der Parallelbericht Samuels sagt, er sei „gen Baal in Juda“ gegangen. Der alte Name weist auf ein kanaanäisches Baalsheiligtum; Kirjat-Jearim, „Stadt der Wälder“, ist der Name, den Israel gebrauchte."
    - "Zwei andere Orte teilen den Namen und sind nicht dieser: Baala, eine Stadt im Negev von Juda, und der Berg Baala an der Grenze bei Ekron und Jabneel. Kirjat-Jearim selbst wird mit Deir el-Azar gleichgesetzt, dem Hügel über Abu Gosch, wo Eusebius schon Kariathiareim an der Straße von Jerusalem nach Diospolis kannte. Grabungen 2017 fanden auf dem Gipfel eine große künstliche Plattform, von mächtigen Stützmauern gehalten, die die Ausgräber ins 8. Jahrhundert v. Chr. datieren; wer sie baute und warum, ist umstritten."
    - "Heute trägt der Gipfel die Kirche Unserer Lieben Frau von der Bundeslade, 1924 über den Resten einer byzantinischen Kirche erbaut, mit einer Marienstatue, die von der Straße nach Jerusalem aus zu sehen ist; der Artikel über Kirjat-Jearim erzählt den Rest der Geschichte."
  fr:
    - "Baala est un autre nom de Kirjath-Jearim, la ville à la frontière de Juda et de Benjamin, à environ 13 km à l’ouest de Jérusalem, où l’arche de l’alliance demeura vingt ans. Josué, traçant la frontière nord de Juda, la mène de la source de Nephthoach à la montagne d’Éphron, et elle « se prolongeait par Baala, qui est Kirjath-Jearim. De Baala elle tournait à l’occident vers la montagne de Séir » ; le même livre appelle deux fois la ville « Kirjath-Baal, qui est Kirjath-Jearim ». Le Chroniste fait monter David « à Baala, à Kirjath-Jearim, qui est à Juda, pour faire monter de là l’arche de Dieu », là où le passage parallèle de Samuel dit qu’il partit « depuis Baalé-Juda ». L’ancien nom évoque un sanctuaire cananéen de Baal ; Kirjath-Jearim, « ville des forêts », est le nom qu’employait Israël."
    - "Deux autres lieux portent ce nom sans être celui-ci : Baala, ville du Négev de Juda, et le mont Baala à la frontière près d’Ékron et de Jabnéel. Kirjath-Jearim elle-même est identifiée à Deir el-Azar, la colline au-dessus d’Abu Ghosh, où Eusèbe connaissait déjà Kariathiareim sur la route de Jérusalem à Diospolis. Des fouilles en 2017 ont trouvé au sommet une grande plateforme artificielle tenue par de massifs murs de soutènement, que les fouilleurs datent du VIIIe siècle av. J.-C. ; qui l’a bâtie, et pourquoi, est discuté."
    - "Aujourd’hui le sommet porte l’église Notre-Dame de l’Arche d’Alliance, bâtie en 1924 sur les restes d’une église byzantine, avec une statue de Marie visible depuis la route de Jérusalem ; l’article sur Kirjath-Jearim raconte la suite de l’histoire."
