body:
  en:
    - "The Most Holy Place, or Holy of Holies, was the innermost room of the tabernacle and then of the Temple in Jerusalem, where the ark of the covenant stood. In the tabernacle a veil divided “between the holy place and the most holy”, and the mercy seat was set upon the ark “in the most holy place”. In Solomon's Temple it was the debir, which the King James Version calls “the oracle”: a cube of twenty cubits (about 9 m) overlaid with gold, with two olive-wood cherubim ten cubits high, under whose wings the priests brought the ark “into the oracle of the house, to the most holy place”. Chronicles says the gold alone came to six hundred talents."
    - "Only the high priest entered, once a year on the Day of Atonement, with blood and incense: Leviticus warns Aaron “that he come not at all times into the holy place within the vail before the mercy seat”. The Letter to the Hebrews builds on this: “after the second veil, the tabernacle which is called the Holiest of all”, into which “went the high priest alone once every year, not without blood”. Ezekiel's visionary temple keeps the twenty-cubit room, “This is the most holy place”, and Daniel's seventy weeks end with the anointing of “the most Holy”."
    - "The ark vanished when the Babylonians burnt the Temple in 587 or 586 BC, and the inner room of the Second Temple stood empty. When Pompey took Jerusalem in 63 BC he went in, Josephus says, and saw what only the high priest might see, but took nothing; Tacitus records that Pompey found no image of a god there, only an empty seat and bare secrets. The Mishnah remembers a stone there, the Foundation Stone, on which the high priest set his censer. The Gospels tell that at the death of Jesus “the veil of the temple was rent in twain from the top to the bottom”, and Hebrews speaks of “boldness to enter into the holiest by the blood of Jesus”, by a new way “through the veil, that is to say, his flesh”."
    - "The Temple was destroyed in AD 70. Since 691 or 692 the Dome of the Rock has stood on the Temple Mount (al-Haram al-Sharif) over the exposed bedrock. Where on the Mount the Most Holy Place stood is debated: one view sets it over this rock, others somewhat to the north or to the south of it. Nothing of the room survives, and excavation on the Mount is not permitted. Many observant Jews do not walk on the platform at all, for fear of treading where the Holy of Holies stood."
  ru:
    - "Святое Святых — внутренняя комната скинии, а затем Иерусалимского храма, где стоял ковчег завета. В скинии завеса отделяла «святилище от Святаго-святых», а крышку ковчега велено было положить «во Святом-святых». В храме Соломона это был давир — Синодальный перевод так и оставляет еврейское слово: куб в двадцать локтей (около 9 м), обложенный золотом, с двумя херувимами из масличного дерева высотой в десять локтей, под крылья которых священники внесли ковчег «на место его, в давир храма, во Святое Святых». По Паралипоменону, одного золота на него пошло шестьсот талантов."
    - "Входил сюда только первосвященник, раз в год, в день очищения, с кровью и курением: Левит предупреждает Аарона, «чтоб он не во всякое время входил во святилище за завесу пред крышку». На это опирается Послание к Евреям: «За второю же завесою была скиния, называемая „святое святых“», куда «однажды в год один только первосвященник, не без крови». В храме, который видел Иезекииль, та же комната в двадцать локтей: «это — Святое Святых», а семьдесят седьмин Даниила кончаются тем, что «помазан был Святый святых»."
    - "Ковчег исчез, когда вавилоняне сожгли храм в 587 или 586 г. до н. э., и внутренняя комната Второго храма стояла пустой. Взяв Иерусалим в 63 г. до н. э., Помпей вошёл туда и, по словам Иосифа Флавия, увидел то, что дозволено видеть одному первосвященнику, но ничего не тронул; Тацит пишет, что Помпей не нашёл там изображения бога — лишь пустое место и бессодержательные тайны. Мишна помнит там камень, Камень основания, на который первосвященник ставил кадильницу. Евангелия рассказывают, что в час смерти Иисуса «завеса в храме разодралась надвое, сверху донизу», а Послание к Евреям говорит о дерзновении «входить во святилище посредством Крови Иисуса Христа» новым путём — «чрез завесу, то есть, плоть Свою»."
    - "Храм был разрушен в 70 г. н. э. С 691–692 гг. на Храмовой горе (Харам-аш-Шариф) над выходом скалы стоит Купол Скалы. Где на горе стояло Святое Святых, спорят: по одному мнению — над этой скалой, по другим — несколько севернее или южнее. От самой комнаты ничего не осталось, а раскопки на горе не разрешены. Многие религиозные евреи вовсе не ходят по площадке, чтобы не ступить туда, где стояло Святое Святых."
  uk:
    - "Святеє Святих, або Свята Святих, було найпотаємнішою кімнатою скинії, а потім Храму в Єрусалимі, де стояв ковчег завіту. У скинії завіса мала «роздїляти … вам сьвятиню від пресьвятої сьвятинї», а віко було покладене на ковчег «в пресьвятій сьвятинї». У Соломоновому храмі це був девір, який Біблія короля Якова називає «оракулом»: куб у двадцять ліктів (близько 9 м), обкладений золотом, із двома херувимами з оливкового дерева заввишки десять ліктів, під крила яких священики внесли ковчег — «у Сьвяте Сьвятих під крила херувимів». Книга Хронік каже, що самого золота пішло шістсот талантів."
    - "Входив лише первосвященник, раз на рік у День спокути, з кров’ю й кадилом: Книга Левіт застерігає Аарона, «щоб не входив по всяк час у сьвятинї за завісу, перед віко, що на скринї». На цьому будує Послання до євреїв: «За другою ж завісою скиня, що звана: Сьвятая Сьвятих», куди «у другу ж раз у рік сам архиєрей, не без крові». Видіннєвий храм Єзекіїля зберігає двадцятилікотну кімнату: «Се сьвяте сьвятих», а сімдесят сімок Даниїла завершуються тим, що «помазаний буде Сьвятий над сьвятими»."
    - "Ковчег зник, коли вавилоняни спалили Храм 587 або 586 р. до н. е., і внутрішня кімната Другого храму стояла порожньою. Коли Помпей узяв Єрусалим 63 р. до н. е., він, каже Йосиф Флавій, увійшов і побачив те, що міг бачити лише первосвященник, але нічого не взяв; Тацит записує, що Помпей не знайшов там зображення бога, лише порожнє сидіння і голі таємниці. Мішна згадує там камінь, Камінь основи, на який первосвященник ставив кадильницю. Євангелія розповідають, що в час смерті Ісуса «завіса церковня роздерлась надвоє од верху до низу», а Послання до євреїв говорить про те, що «маючи свободу входити у сьвятиню кровю Ісусовою», «дорогою новою і живою, котру обновив нам Він завісою, се єсть тїлом своїм»."
    - "Храм було зруйновано 70 р. н. е. Від 691 чи 692 р. на Храмовій горі (аль-Харам аш-Шариф) стоїть Купол Скелі над оголеним скельним ґрунтом. Де на горі стояло Святеє Святих, є предметом суперечки: один погляд розміщує його над цією скелею, інші — трохи на північ або на південь від неї. Від кімнати нічого не зберігається, а розкопки на горі не дозволені. Багато віруючих євреїв узагалі не ходять по платформі, боячись ступити там, де стояло Святеє Святих."
  es:
    - "El Lugar Santísimo, o Santo de los Santos, era la sala más interior del tabernáculo y luego del Templo de Jerusalén, donde estaba el arca de la alianza. En el tabernáculo, un velo separaba «entre el lugar santo y el santísimo», y la cubierta se colocaba sobre el arca «en el lugar santísimo». En el Templo de Salomón era el debir, que la versión del rey Jacobo llama «oráculo»: un cubo de veinte codos (unos 9 m) recubierto de oro, con dos querubines de madera de olivo de diez codos de altura, bajo cuyas alas los sacerdotes metieron el arca «en el oráculo de la casa, en el lugar santísimo». Crónicas dice que solo el oro ascendía a seiscientos talentos."
    - "Solo entraba el sumo sacerdote, una vez al año, el Día de la Expiación, con sangre e incienso: Levítico advierte a Aarón «que no en todo tiempo entre en el santuario del velo adentro, delante de la cubierta». La Carta a los Hebreos se apoya en ello: «Tras el segundo velo estaba el tabernáculo, que llaman el Lugar Santísimo», al que entraba «sólo el pontífice una vez en el año, no sin sangre». El templo visionario de Ezequiel conserva la sala de veinte codos: «Este es el lugar santísimo», y las setenta semanas de Daniel terminan con la unción «al Santo de los santos»."
    - "El arca desapareció cuando los babilonios incendiaron el Templo en 587 o 586 a. C., y la sala interior del Segundo Templo quedó vacía. Cuando Pompeyo tomó Jerusalén en 63 a. C. entró, dice Josefo, y vio lo que solo el sumo sacerdote podía ver, pero no tomó nada; Tácito registra que Pompeyo no halló allí imagen de ningún dios, solo un asiento vacío y secretos desnudos. La Misná recuerda allí una piedra, la Piedra Fundacional, sobre la cual el sumo sacerdote colocaba su incensario. Los Evangelios cuentan que a la muerte de Jesús «el velo del templo se rompió en dos, de alto á bajo», y Hebreos habla de «libertad para entrar en el santuario por la sangre de Jesucristo», por un camino nuevo «por el velo, esto es, por su carne»."
    - "El Templo fue destruido en 70 d. C. Desde 691 o 692 la Cúpula de la Roca se alza en el Monte del Templo (al-Haram al-Sharif) sobre la roca madre al descubierto. Dónde estuvo el Lugar Santísimo en el Monte se debate: una opinión lo sitúa sobre esta roca, otras algo al norte o al sur de ella. No sobrevive nada de la sala, y la excavación en el Monte no está permitida. Muchos judíos observantes no pisan en absoluto la explanada, por temor a pisar donde estuvo el Santo de los Santos."
  pt:
    - "O Santo dos Santos, ou Lugar Santíssimo, era a câmara mais interior do tabernáculo e depois do Templo em Jerusalém, onde ficava a arca da aliança. No tabernáculo, um véu dividia “o Lugar Santo do Santíssimo Lugar”, e o propiciatório foi posto sobre a arca “no Santíssimo Lugar”. No Templo de Salomão era o debir, que a King James Version chama de “oráculo”: um cubo de vinte côvados (cerca de 9 m) revestido de ouro, com dois querubins de madeira de oliveira de dez côvados de altura, sob cujas asas os sacerdotes trouxeram a arca “para o seu lugar, no santuário interior da casa, no lugar santíssimo”. As Crônicas dizem que só o ouro somava seiscentos talentos."
    - "Só o sumo sacerdote entrava, uma vez por ano, no Dia da Expiação, com sangue e incenso: Levítico adverte Arão a que “não entre a qualquer momento no Lugar Santíssimo, para dentro do véu, diante do propiciatório”. A Carta aos Hebreus se apoia nisso: “Atrás do segundo véu estava o tabernáculo que é chamado o Santo dos Santos”, no qual “apenas o sumo sacerdote entra, uma vez por ano, não sem sangue”. O templo visionário de Ezequiel mantém a câmara de vinte côvados: “Este é o Lugar Santíssimo”, e as setenta semanas de Daniel terminam com a unção do “Santo dos Santos”."
    - "A arca desapareceu quando os babilônios queimaram o Templo em 587 ou 586 a.C., e a câmara interior do Segundo Templo ficou vazia. Quando Pompeu tomou Jerusalém em 63 a.C., entrou nela, diz Josefo, e viu o que só o sumo sacerdote podia ver, mas nada levou; Tácito registra que Pompeu não achou ali imagem de deus alguma, só uma sede vazia e segredos nus. A Mishná recorda ali uma pedra, a Pedra Fundamental, sobre a qual o sumo sacerdote punha o seu incensário. Os Evangelhos contam que na morte de Jesus “o véu do templo se rasgou em dois, de alto a baixo”, e Hebreus fala de “ousadia para entrar no Santuário pelo sangue de Jesus”, por um caminho novo “pelo véu, isto é, a sua carne”."
    - "O Templo foi destruído em 70 d.C. Desde 691 ou 692, a Cúpula da Rocha ergue-se no Monte do Templo (al-Haram al-Sharif) sobre a rocha nua exposta. Onde no Monte ficava o Santo dos Santos é debatido: uma opinião o põe sobre essa rocha, outras um pouco ao norte ou ao sul dela. Nada da câmara sobrevive, e a escavação no Monte não é permitida. Muitos judeus observantes não pisam de modo algum na plataforma, por medo de pisar onde ficava o Santo dos Santos."
  de:
    - "Das Allerheiligste war der innerste Raum der Stiftshütte und dann des Tempels in Jerusalem, in dem die Bundeslade stand. In der Stiftshütte schied ein Vorhang „zwischen dem Heiligen und dem Allerheiligsten“, und der Gnadenstuhl wurde auf die Lade gelegt „in dem Allerheiligsten“. Im Tempel Salomos war es der Debir, bei Luther „der Chor“: ein Würfel von zwanzig Ellen (etwa 9 m), mit Gold überzogen, mit zwei Cherubim aus Ölbaumholz, zehn Ellen hoch, unter deren Flügeln die Priester die Lade brachten, „in den Chor des Hauses, in das Allerheiligste, unter die Flügel der Cherubim“. Die Chronik sagt, allein das Gold habe „bei sechshundert Zentner“ betragen."
    - "Nur der Hohepriester trat ein, einmal im Jahr am Versöhnungstag, mit Blut und Räucherwerk: Das 3. Buch Mose warnt Aaron, „daß er nicht zu aller Zeit in das inwendige Heiligtum gehe hinter den Vorhang vor den Gnadenstuhl“. Der Hebräerbrief baut darauf: „Hinter dem andern Vorhang aber war die Hütte, die da heißt das Allerheiligste“, in die „nur einmal im Jahr allein der Hohepriester, nicht ohne Blut“ ging. Hesekiels visionärer Tempel behält den Raum von zwanzig Ellen, „Dies ist das Allerheiligste“, und Daniels siebzig Wochen enden damit, dass „ein Hochheiliges gesalbt werden“ wird."
    - "Die Lade verschwand, als die Babylonier den Tempel 587 oder 586 v. Chr. verbrannten, und der innere Raum des Zweiten Tempels stand leer. Als Pompeius 63 v. Chr. Jerusalem einnahm, ging er hinein, sagt Josephus, und sah, was nur der Hohepriester sehen durfte, nahm aber nichts mit; Tacitus berichtet, Pompeius habe dort kein Götterbild gefunden, nur einen leeren Sitz und kahle Geheimnisse. Die Mischna erinnert an einen Stein dort, den Grundstein, auf den der Hohepriester sein Räucherbecken stellte. Die Evangelien berichten, dass beim Tod Jesu „der Vorhang im Tempel zerriß in zwei Stücke von obenan bis untenaus“, und der Hebräerbrief spricht von „der Freudigkeit zum Eingang in das Heilige durch das Blut Jesu“ auf einem neuen Weg „durch den Vorhang, das ist durch sein Fleisch“."
    - "Der Tempel wurde 70 n. Chr. zerstört. Seit 691 oder 692 steht der Felsendom auf dem Tempelberg (al-Haram asch-Scharif) über dem freiliegenden Felsen. Wo auf dem Berg das Allerheiligste stand, ist umstritten: Eine Ansicht setzt es über diesen Felsen, andere etwas nördlich oder südlich davon. Nichts von dem Raum ist erhalten, und Ausgrabungen auf dem Berg sind nicht erlaubt. Viele gläubige Juden betreten die Plattform überhaupt nicht, aus Furcht, dorthin zu treten, wo das Allerheiligste stand."
  fr:
    - "Le Saint des saints, ou lieu très saint, était la pièce la plus intérieure du tabernacle puis du Temple de Jérusalem, où se trouvait l’arche de l’alliance. Dans le tabernacle, un voile servait de séparation « entre le lieu saint et le lieu très saint », et le propitiatoire fut placé sur l’arche « dans le lieu très saint ». Dans le Temple de Salomon, c’était le debir, que la version du roi Jacques appelle « l’oracle » : un cube de vingt coudées (environ 9 m) recouvert d’or, avec deux chérubins de bois d’olivier hauts de dix coudées, sous les ailes desquels les sacrificateurs portèrent l’arche « dans le sanctuaire de la maison, dans le lieu très saint ». Les Chroniques disent que l’or seul représentait six cents talents."
    - "Seul le grand-prêtre y entrait, une fois par an, le Jour des expiations, avec du sang et de l’encens : le Lévitique avertit Aaron de ne pas entrer « en tout temps dans le sanctuaire, au dedans du voile, devant le propitiatoire ». L’épître aux Hébreux s’appuie là-dessus : « Derrière le second voile se trouvait la partie du tabernacle appelée le saint des saints », où « le souverain sacrificateur seul entre une fois par an, non sans y porter du sang ». Le temple visionnaire d’Ézéchiel garde la pièce de vingt coudées : « C’est ici le lieu très saint », et les soixante-dix semaines de Daniel s’achèvent par l’onction du « Saint des saints »."
    - "L’arche disparut quand les Babyloniens brûlèrent le Temple en 587 ou 586 av. J.-C., et la pièce intérieure du Second Temple resta vide. Quand Pompée prit Jérusalem en 63 av. J.-C., il y entra, dit Flavius Josèphe, et vit ce que seul le grand-prêtre pouvait voir, mais ne prit rien ; Tacite rapporte que Pompée n’y trouva aucune image de dieu, seulement un siège vide et des secrets nus. La Michna garde le souvenir d’une pierre, la pierre de fondation, sur laquelle le grand-prêtre posait son encensoir. Les Évangiles racontent qu’à la mort de Jésus « le voile du temple se déchira en deux, depuis le haut jusqu’en bas », et l’épître aux Hébreux parle d’« une libre entrée dans le sanctuaire » « au moyen du sang de Jésus », par une voie nouvelle « au travers du voile, c’est-à-dire, de sa chair »."
    - "Le Temple fut détruit en 70 apr. J.-C. Depuis 691 ou 692, le Dôme du Rocher se dresse sur le mont du Temple (al-Haram al-Sharif) au-dessus du rocher affleurant. L’emplacement du Saint des saints sur le Mont est débattu : une opinion le place au-dessus de ce rocher, d’autres un peu au nord ou au sud. Rien de la pièce ne subsiste, et les fouilles sur le Mont ne sont pas permises. Beaucoup de Juifs pratiquants ne marchent pas du tout sur l’esplanade, de crainte de fouler l’endroit où se trouvait le Saint des saints."
  it:
    - "Il Santo dei Santi era la stanza più interna del tabernacolo e poi del Tempio di Gerusalemme, dove stava l’arca dell’alleanza. Nel tabernacolo un velo segnava «la separazione del luogo santo dal santissimo», e il propiziatorio era posto sull’arca «nel luogo santissimo». Nel Tempio di Salomone era il debir, che la King James Version chiama «l’oracolo»: un cubo di venti cubiti (circa 9 m) rivestito d’oro, con due cherubini di legno d’ulivo alti dieci cubiti, sotto le cui ali i sacerdoti portarono l’arca «nel santuario della casa, nel luogo santissimo». Le Cronache dicono che il solo oro ammontava a seicento talenti."
    - "Vi entrava solo il sommo sacerdote, una volta all’anno nel giorno dell’Espiazione, con sangue e incenso: il Levitico avverte Aronne «di non entrare in ogni tempo nel santuario, di là dal velo, davanti al propiziatorio». La Lettera agli Ebrei vi si appoggia: «dietro la seconda cortina v’era il tabernacolo detto il Luogo santissimo», dove «entra una volta solamente all’anno il solo sommo sacerdote, e non senza sangue». Il tempio visionario di Ezechiele conserva la stanza di venti cubiti: «Questo è il luogo santissimo», e le settanta settimane di Daniele culminano con l’unzione di «un luogo santissimo»."
    - "L’arca scomparve quando i Babilonesi bruciarono il Tempio nel 587 o 586 a.C., e la stanza interna del Secondo Tempio rimase vuota. Quando Pompeo prese Gerusalemme nel 63 a.C. vi entrò, dice Giuseppe Flavio, e vide ciò che solo il sommo sacerdote poteva vedere, ma non prese nulla; Tacito registra che Pompeo non vi trovò alcuna immagine di dio, solo una sede vuota e segreti nudi. La Mishnà ricorda là una pietra, la Pietra di Fondazione, su cui il sommo sacerdote posava il turibolo. I Vangeli raccontano che alla morte di Gesù «la cortina del tempio si squarciò in due, da cima a fondo», e Ebrei parla di «libertà d’entrare nel santuario in virtù del sangue di Gesù», per «quella via recente e vivente che egli ha inaugurata per noi attraverso la cortina, vale a dire la sua carne»."
    - "Il Tempio fu distrutto nel 70 d.C. Dal 691 o 692 la Cupola della Roccia sorge sul Monte del Tempio (al-Haram al-Sharif) sopra la roccia viva scoperta. Dove sul Monte stesse il Santo dei Santi è discusso: un’opinione lo pone sopra questa roccia, altre un poco a nord o a sud di essa. Nulla della stanza sopravvive, e gli scavi sul Monte non sono permessi. Molti ebrei osservanti non salgono affatto sulla spianata, per timore di calpestare il luogo dove sorgeva il Santo dei Santi."
  pl:
    - "Miejsce Najświętsze, czyli Święte Świętych, było najgłębszym pomieszczeniem przybytku, a potem Świątyni w Jerozolimie, gdzie stała arka przymierza. W przybytku zasłona dzieliła „świątnicę od świątnicy najświętszej”, a ubłagalnia była położona na arce „w świątnicy najświętszej”. W Świątyni Salomona było to debir, które Biblia Króla Jakuba nazywa „wyrocznią”: sześcian o boku dwudziestu łokci (około 9 m) pokryty złotem, z dwoma cherubinami z drewna oliwnego o wysokości dziesięciu łokci, pod których skrzydła kapłani wnieśli arkę „do wnętrznego domu, do świątnicy świętych”. Księga Kronik mówi, że samo złoto wyniosło sześćset talentów."
    - "Wchodził tylko arcykapłan, raz w roku w Dzień Przebłagania, z krwią i kadzidłem: Księga Kapłańska ostrzega Aarona: „niech nie wchodzi każdego czasu do świątnicy wewnątrz za zasłonę przed ubłagalnią”. List do Hebrajczyków na tym buduje: „A za drugą zasłoną był przybytek, który zwano świątnicą najświętszą”, a „do drugiego raz w rok sam najwyższy kapłan, nie bez krwi”. Wizjonerska świątynia Ezechiela zachowuje dwudziestołokciową komnatę: „To jest świątnica świętych”, a siedemdziesiąt tygodni Daniela kończy się pomazaniem „Świętego świętych”."
    - "Arka zniknęła, gdy Babilończycy spalili Świątynię w 587 lub 586 r. p.n.e., a wewnętrzna komnata Drugiej Świątyni stała pusta. Gdy Pompejusz zdobył Jerozolimę w 63 r. p.n.e., wszedł tam, mówi Józef Flawiusz, i zobaczył to, co wolno było widzieć tylko arcykapłanowi, ale niczego nie zabrał; Tacyt zapisuje, że Pompejusz nie znalazł tam wizerunku boga, tylko puste miejsce i nagie tajemnice. Miszna pamięta tam kamień, Kamień Fundamentowy, na którym arcykapłan stawiał kadzielnicę. Ewangelie opowiadają, że przy śmierci Jezusa w Świątyni „zasłona kościelna rozerwała się na dwoje od wierzchu aż do dołu”, a List do Hebrajczyków mówi, że mamy „wolność, wnijść do świątnicy przez krew Jezusową”, nową drogą „przez zasłonę, to jest przez ciało swoje”."
    - "Świątynię zburzono w 70 r. n.e. Od 691 lub 692 r. na Górze Świątynnej (al-Haram asz-Szarif) stoi Kopuła na Skale nad odsłoniętą skałą macierzystą. Gdzie na Górze stało Miejsce Najświętsze, jest sporne: jeden pogląd umieszcza je nad tą skałą, inni nieco na północ lub na południe od niej. Nic z komnaty nie przetrwało, a wykopalisk na Górze nie wolno prowadzić. Wielu praktykujących Żydów w ogóle nie chodzi po platformie, z obawy przed nadepnięciem na miejsce, gdzie stało Święte Świętych."
  nl:
    - "Het Allerheiligste, of Heilige der Heiligen, was de binnenste ruimte van de tabernakel en daarna van de tempel in Jeruzalem, waar de ark van het verbond stond. In de tabernakel zou de voorhang “een scheiding maken tussen het heilige, en tussen het heilige der heiligen”, en het verzoendeksel werd op de ark gezet “in het heilige der heiligen”. In Salomo's tempel was het het debir, dat de King James Version “het orakel” noemt: een kubus van twintig el (ongeveer 9 m) bekleed met goud, met twee cherubs van olijfhout van tien el hoog, onder wier vleugels de priesters de ark brachten “tot de aanspraakplaats van het huis, tot het heilige der heiligen”. Kronieken zegt dat het goud alleen al zeshonderd talenten bedroeg."
    - "Alleen de hogepriester ging er binnen, eenmaal per jaar op de Grote Verzoendag, met bloed en reukwerk: Leviticus waarschuwt Aäron “dat hij niet te allen tijde ga in het heilige, binnen den voorhang, voor het verzoendeksel”. De Brief aan de Hebreeën bouwt hierop voort: “achter het tweede voorhangsel was de tabernakel, genaamd het heilige der heiligen”, en “in den tweeden tabernakel ging alleen de hogepriester, eenmaal des jaars, niet zonder bloed”. Ezechiëls visioenentempel behoudt de ruimte van twintig el, “Dit is de heiligheid der heiligheden”, en Daniëls zeventig weken eindigen met de zalving van “de heiligheid der heiligheden”."
    - "De ark verdween toen de Babyloniërs de tempel in 587 of 586 v.Chr. verbrandden, en de binnenruimte van de Tweede Tempel stond leeg. Toen Pompeius Jeruzalem in 63 v.Chr. innam, ging hij er binnen, zegt Josephus, en zag wat alleen de hogepriester mocht zien, maar nam niets mee; Tacitus meldt dat Pompeius er geen godsbeeld vond, alleen een lege zetel en kale geheimen. De Misjna herinnert zich daar een steen, de Grondsteen, waarop de hogepriester zijn wierookvat zette. De evangeliën vertellen dat bij de dood van Jezus “het voorhangsel des tempels scheurde in tweeën, van boven tot beneden”, en Hebreeën spreekt van “vrijmoedigheid ... om in te gaan in het heiligdom door het bloed van Jezus”, op een nieuwe weg “door het voorhangsel, dat is, door Zijn vlees”."
    - "De tempel werd in 70 n.Chr. verwoest. Sinds 691 of 692 staat de Rotskoepel op de Tempelberg (al-Haram al-Sharif) boven de blootliggende rots. Waar op de berg het Allerheiligste stond, is omstreden: één opvatting plaatst het boven deze rots, anderen enigszins ten noorden of ten zuiden ervan. Niets van de ruimte is bewaard, en opgraving op de berg is niet toegestaan. Veel orthodoxe joden betreden het platform helemaal niet, uit vrees te treden waar het Heilige der Heiligen stond."
  cs:
    - "Velesvatyně, neboli Svatyně svatých, byla nejvnitřnější místnost svatostánku a pak chrámu v Jeruzalémě, kde stála truhla úmluvy. Ve svatostánku oddělovala opona „svatyni od svatyně svatých“ a slitovnice byla položena na truhlu „v svatyni svatých“. V Šalomounově chrámu to byl debir, který anglická Bible krále Jakuba nazývá „orákulum“: krychle o dvaceti loktech (asi 9 m) obložená zlatem se dvěma cherubíny z olivového dřeva vysokými deset loktů, pod jejichž křídla kněží vnesli truhlu „do vnitřního domu, totiž do svatyně svatých pod křídla cherubínů“. Kroniky praví, že samo zlato činilo šest set talentů."
    - "Vstupoval jen velekněz, jednou za rok o Dni smíření, s krví a kadidlem: Leviticus varuje Árona, „ať nevchází každého času do svatyně za oponu před slitovnici“. List Židům na tom staví: „Za druhou pak oponou byl stánek, kterýž sloul svatyně svatých“, a o druhém stanu praví: „Do druhého pak jedinou v rok sám nejvyšší kněz, ne bez krve“. Ezechielův vizionářský chrám zachovává místnost o dvaceti loktech: „Tato jest svatyně svatých“ a Danielových sedmdesát týdnů končí pomazáním „Svatého svatých“."
    - "Truhla zmizela, když Babyloňané spálili chrám roku 587 nebo 586 př. n. l., a vnitřní místnost Druhého chrámu stála prázdná. Když Pompeius roku 63 př. n. l. dobyl Jeruzalém, vešel dovnitř, praví Josephus, a viděl, co smí vidět jen velekněz, ale nic nevzal; Tacitus zaznamenává, že Pompeius tam nenašel obraz boha, jen prázdné sídlo a holá tajemství. Mišna připomíná tam kámen, Základní kámen, na který velekněz postavil kadidelnici. Evangelia vypravují, že při smrti Ježíšově „opona chrámová roztrhla se na dvé, od vrchu až dolů“, a List Židům praví, že máme „plnou svobodu k vjíti do svatyně skrze krev Ježíšovu“, „cestou novou a živou, kterouž nám způsobil skrze oponu, to jest tělo své“."
    - "Chrám byl zničen roku 70 n. l. Od roku 691 nebo 692 stojí na Chrámové hoře (al-Haram al-Sharif) Skalní dóm nad obnaženým skalním podložím. Kde na hoře Velesvatyně stála, je sporné: jedno mínění ji klade nad tuto skálu, jiná poněkud severně nebo jižně od ní. Z místnosti se nezachovalo nic a vykopávky na hoře nejsou povoleny. Mnozí zbožní Židé na plošinu nevstupují vůbec, ze strachu, že by šlápli tam, kde stála Svatyně svatých."
  sv:
    - "Det allra heligaste var det innersta rummet i tabernaklet och sedan i templet i Jerusalem, där förbundsarken stod. I tabernaklet skilde en förlåt ”mellan det heliga och det allraheligaste”, och nådastolen sattes på arken ”inne i det allraheligaste”. I Salomos tempel var det debir, som King James Version kallar ”oraklet”: en kub om tjugu alnar (omkring 9 m) överdragen med guld, med två kerubar av olivträ, tio alnar höga, under vilkas vingar prästerna förde arken ”i husets kor, i det allraheligaste”. Krönikeböckerna säger att enbart guldet uppgick till sexhundra talenter."
    - "Endast översteprästen gick in, en gång om året på försoningsdagen, med blod och rökelse: Tredje Mosebok varnar Aron ”att han icke på vilken tid som helst får gå in i helgedomen innanför förlåten, framför nådastolen som är ovanpå arken”. Hebreerbrevet bygger på detta: ”bakom den andra förlåten var ett annat rum i tabernaklet, ett som kallas »det allraheligaste»”, i vilket allenast översteprästen går in ”en gång om året, och då aldrig utan blod”. Hesekiels visionära tempel behåller rummet om tjugu alnar, ”Detta är det allraheligaste”, och Daniels sjuttio veckor slutar med smörjelsen av ”en höghelig helgedom”."
    - "Arken försvann när babylonierna brände templet 587 eller 586 f.Kr., och Andra templets innersta rum stod tomt. När Pompeius intog Jerusalem 63 f.Kr. gick han in, säger Josefus, och såg vad endast översteprästen fick se, men tog ingenting; Tacitus uppger att Pompeius där inte fann någon gudabild, bara en tom plats och tomma hemligheter. Mishna minns en sten där, Grundstenen, på vilken översteprästen ställde sitt rökelsekar. Evangelierna berättar att vid Jesu död ”rämnade förlåten i templet i två stycken, uppifrån och ända ned”, och Hebreerbrevet talar om ”en fast tillförsikt att få gå in i det allraheligaste i och genom Jesu blod”, på en ny och levande väg ”ditin genom förlåten”, ”det är genom sitt kött”."
    - "Templet förstördes år 70 e.Kr. Sedan 691 eller 692 har Klippdomen stått på Tempelberget (al-Haram al-Sharif) över den blottade berggrunden. Var på berget det allra heligaste stod är omdebatterat: en uppfattning förlägger det över denna klippa, andra något norr eller söder om den. Inget av rummet finns kvar, och utgrävning på berget är inte tillåten. Många observanta judar går överhuvudtaget inte på plattformen, av rädsla att trampa där det allra heligaste stod."
  nb:
    - "Det aller helligste, eller Det Aller-helligste, var det innerste rommet i tabernaklet og så i tempelet i Jerusalem, der paktens ark sto. I tabernaklet delte et forheng «mellem det Hellige og det Aller-helligste», og nådestolen ble satt «ovenpå vidnesbyrdets ark i det Aller-helligste». I Salomos tempel var det debir, som King James-oversettelsen kaller «orakelet»: en kube på tyve alen (omkring 9 m) kledd med gull, med to kjeruber av oljetre ti alen høye, under hvis vinger prestene førte arken «inn på dens plass i husets kor, i det Aller-helligste». Krønikebøkene sier at gullet alene kom på seks hundre talenter."
    - "Bare ypperstepresten gikk inn, én gang i året på forsoningsdagen, med blod og røkelse: Tredje Mosebok advarer Aron «at han ikke til enhver tid må gå inn i helligdommen innenfor forhenget, frem til nådestolen». Hebreerbrevet bygger på dette: «Og bak det annet forheng var det telt som kalles det Aller-helligste», og der «går bare ypperstepresten inn en gang om året, ikke uten blod». Esekiels visjonære tempel beholder rommet på tyve alen: «Dette er det Aller-helligste», og Daniels sytti uker ender med at man skal «salve et Aller-helligste»."
    - "Arken forsvant da babylonerne brente tempelet i 587 eller 586 f.Kr., og det indre rommet i det andre tempelet sto tomt. Da Pompeius tok Jerusalem i 63 f.Kr. gikk han inn, sier Josefus, og så det bare ypperstepresten kunne se, men tok ingenting; Tacitus forteller at Pompeius ikke fant noe gudebilde der, bare et tomt sete og tomme hemmeligheter. Mishnah husker en stein der, Grunnsteinen, som ypperstepresten satte sitt røkelseskar på. Evangeliene forteller at ved Jesu død «forhenget i templet revnet i to stykker fra øverst til nederst», og Hebreerbrevet taler om at vi «i Jesu blod har frimodighet til å gå inn i helligdommen», en ny vei «gjennem forhenget, det er hans kjød»."
    - "Tempelet ble ødelagt i 70 e.Kr. Siden 691 eller 692 har Klippedomen stått på Tempelhøyden (al-Haram al-Sharif) over den blottlagte fjellgrunnen. Hvor på høyden Det aller helligste sto, er omdiskutert: ett syn setter det over denne klippen, andre noe nord eller sør for den. Ingenting av rommet er bevart, og utgravning på høyden er ikke tillatt. Mange troende jøder går ikke på plattformen i det hele tatt, av frykt for å tråkke der Det aller helligste sto."
  tl:
    - "Ang Kabanal-banalang Dako, o Banal ng mga Banal, ay ang pinakaloob na silid ng tabernakulo at kalaunan ng Templo sa Jerusalem, kung saan nakalagay ang kaban ng tipan. Sa tabernakulo, hinati ng isang lambong “ang dakong banal at ang kabanalbanalang dako”, at inilagay ang luklukan ng awa sa ibabaw ng kaban “sa kabanalbanalang dako”. Sa Templo ni Salomon ito ang debir, na tinatawag ng King James Version na “the oracle”: isang kubo na dalawampung siko (mga 9 m) na binalot ng ginto, na may dalawang querubin na kahoy na olibo na sampung siko ang taas, na sa ilalim ng mga pakpak nila ipinasok ng mga saserdote ang kaban “sa loob ng sanggunian ng bahay, sa kabanalbanalang dako”. Sinasabi ng Mga Cronica na ang ginto lamang ay umabot sa anim na raang talento."
    - "Ang dakilang saserdote lamang ang pumasok, minsan sa isang taon sa Araw ng Pagtubos, na may dugo at insenso: binabalaan ng Levitico si Aaron na “huwag pumasok tuwina sa dakong banal, sa loob ng tabing, sa harap ng luklukan ng awa”. Itinatayo ng Sulat sa mga Hebreo rito: “sa likod ng ikalawang tabing ay ang tabernakulo na tinatawag na Dakong Kabanalbanalan”, kung saan “pumapasok na nagiisa ang dakilang saserdote, minsan sa isang taon, na hindi walang dalang dugo”. Pinananatili ng huwarang templo ni Ezekiel ang silid na dalawampung siko, “Ito ang kabanalbanalang dako”, at nagtatapos ang pitumpung sanlinggo ni Daniel sa pagpapahid sa “kabanalbanalan”."
    - "Naglaho ang kaban nang sunugin ng mga Babilonyo ang Templo noong 587 o 586 BK, at naiwang walang laman ang panloob na silid ng Ikalawang Templo. Nang sakupin ni Pompeyo ang Jerusalem noong 63 BK, pumasok siya, ayon kay Josefo, at nakita ang tanging maaaring makita ng dakilang saserdote, ngunit walang kinuha; ayon kay Tacito, walang larawan ng diyos na nasumpungan doon si Pompeyo, kundi walang lamang luklukan at hubad na mga lihim. Naaalala ng Mishnah ang isang bato roon, ang Bato ng Pundasyon, na pinaglagyan ng insensaryo ng dakilang saserdote. Ayon sa mga Ebanghelyo, sa pagkamatay ni Jesus “ang tabing ng templo'y nahapak na nagkadalawa buhat sa itaas hanggang sa ibaba”, at binabanggit ng Hebreo ang “kalayaan ngang makapasok sa dakong banal sa pamamagitan ng dugo ni Jesus”, sa daang bago “sa pamamagitan ng tabing, sa makatuwid baga'y sa kaniyang laman”."
    - "Winasak ang Templo noong 70 AD. Mula 691 o 692, nakatayo ang Simboryo ng Bato sa Bundok ng Templo (al-Haram al-Sharif) sa ibabaw ng nakalantad na batong-lupa. Pinagtatalunan kung saan sa Bundok nakatayo ang Kabanal-banalang Dako: inilalagay ito ng isang pananaw sa ibabaw ng batong ito, ng iba nang bahagya sa hilaga o timog nito. Walang natitira sa silid, at hindi pinahihintulutan ang paghuhukay sa Bundok. Hindi lumalakad sa plataporma ang maraming relihiyosong Judio, sa takot na tapakan ang kinatatayuan ng Banal ng mga Banal."
  da:
    - "Det Allerhelligste, eller Helligdommenes Helligdom, var det inderste rum i tabernaklet og siden i templet i Jerusalem, hvor pagtens ark stod. I tabernaklet skilte et forhæng »imellem det hellige og imellem det allerhelligste«, og nådestolen blev sat på arken »i det allerhelligste«. I Salomos tempel var det debir, som King James-oversættelsen kalder »orakelet«: en terning på tyve alen (omkring 9 m) beklædt med guld, med to keruber af oliventræ, ti alen høje, under hvis vinger præsterne førte arken »til Koret udi Huset, ind i det allerhelligste«. Krønikebøgerne siger, at guldet alene beløb sig til seks hundrede talenter."
    - "Kun ypperstepræsten gik ind, én gang om året på forsoningsdagen, med blod og røgelse: Tredje Mosebog advarer Aron, »at han ikke til enhver Tid maa gaa ind i Helligdommen inden for Forhænget lige for Naadestolen«. Hebræerbrevet bygger på dette: »bag det andet Forhæng var et Telt, det, som kaldes det allerhelligste«, og »i det andet gaar alene Ypperstepræsten ind een Gang om Aaret, ikke uden Blod«. Ezekiels visionære tempel bevarer rummet på tyve alen: »Dette er det Allerhelligste«, og Daniels halvfjerdsindstyve uger ender med salvelsen af »et Allerhelligste«."
    - "Arken forsvandt, da babylonierne brændte templet i 587 eller 586 f.Kr., og det andet tempels inderste rum stod tomt. Da Pompejus indtog Jerusalem i 63 f.Kr., gik han ind, siger Josefus, og så, hvad kun ypperstepræsten måtte se, men tog intet; Tacitus beretter, at Pompejus ikke fandt noget gudebillede dér, kun et tomt sæde og nøgne hemmeligheder. Mishnaen mindes en sten dér, Grundstenen, hvorpå ypperstepræsten satte sit røgelseskar. Evangelierne fortæller, at ved Jesu død »Forhænget i Templet splittedes i to Stykker, fra øverst til nederst«, og Hebræerbrevet taler om »Frimodighed til den Indgang i Helligdommen ved Jesu Blod«, ad en ny vej »igennem Forhænget, det er hans Kød«."
    - "Templet blev ødelagt i 70 e.Kr. Siden 691 eller 692 har Klippedomen stået på Tempelbjerget (al-Haram al-Sharif) over det blottede grundfjeld. Hvor på bjerget Det Allerhelligste stod, er omdiskuteret: ét synspunkt sætter det over denne klippe, andre noget nord eller syd for den. Intet af rummet er bevaret, og udgravning på bjerget er ikke tilladt. Mange troende jøder går slet ikke på plateauet af frygt for at træde, hvor Det Allerhelligste stod."
  sr:
    - "Светиња над светињама, или Најсветије место, била је најунутрашња просторија скиније, а затим Храма у Јерусалиму, где је стајао ковчег завета. У скинији је завеса раздвајала „светињу од светиње над светињама“, а заклопац је стављен на ковчег „у светињи над светињама“. У Соломуновом храму то је био дебир, који Библија краља Џејмса зове „пророчиште“: коцка од двадесет лаката (око 9 м) обложена златом, са два херувима од маслиновог дрвета високим десет лаката, под чија су крила свештеници унели ковчег „у унутрашњи дом, у светињу над светињама, под крила херувимима“. Летописи кажу да је само злато износило шест стотина таланата."
    - "Улазио је само првосвештеник, једном годишње на Дан помирења, с крвљу и тамјаном: Књига Левитска упозорава Арона „да не улази у свако доба у светињу за завес пред заклопац који је на ковчегу“. Посланица Јеврејима на томе гради: „А за другим завесом беше скинија, која се зове светиња над светињама“, у коју „улажаше једном у години сам поглавар свештенички, не без крви“. Језекиљев виђени храм задржава просторију од двадесет лаката: „Ово је светиња над светињама“, а Данилових седамдесет недеља завршава се помазањем „Свети над светима“."
    - "Ковчег је нестао када су Вавилонци спалили Храм 587. или 586. п. н. е., и унутрашња просторија Другог храма стајала је празна. Када је Помпеј 63. п. н. е. заузео Јерусалим, ушао је, каже Јосиф Флавије, и видео што је смео видети само првосвештеник, али није ништа узео; Тацит бележи да Помпеј тамо није нашао слику божанства, само празну столицу и голе тајне. Мишна памти ту један камен, Камен темељац, на који је првосвештеник стављао кадионицу. Јеванђеља причају да се при Исусовој смрти „завеса црквена раздре се надвоје од горњег краја до доњег“, а Посланица Јеврејима говори о томе да имамо „слободу ... улазити у светињу крвљу Исуса Христа“, новим путем кроз завесу, то јест своје тело."
    - "Храм је разорен 70. н. е. Од 691. или 692. на Храмовној гори (Харам еш-Шариф) стоји Купола на стени над откривеном стеном. Где је на гори Светиња над светињама стајала, спорно је: једно гледиште је смешта над ову стену, друга мало северно или јужно од ње. Од просторије није сачувано ништа, а ископавања на гори нису дозвољена. Многи побожни Јевреји уопште не ходају по платоу, из страха да не нагазе где је стајала Светиња над светињама."
  hu:
    - "A Szentek szentje, a Szentek Szentje, a szentsátor, majd a jeruzsálemi templom legbelső helyisége volt, ahol a szövetség ládája állt. A szentsátorban kárpit választotta el „a szent helyet a szentek szentjétől”, és a fedelet a ládára tették „a szentek szentjébe”. Salamon templomában ez a debir volt, amelyet a King James-fordítás „orákulumnak” nevez: húsz singes (mintegy 9 m) kocka, arannyal borítva, két tíz sing magas olajfa kérubbal, amelyek szárnyai alá a papok bevitték a ládát „a ház belső részébe, a szentek-szentjébe”. A Krónikák szerint csak az arany hatszáz tálentum volt."
    - "Csak a főpap léphetett be, évente egyszer, az engesztelés napján, vérrel és tömjénnel: a Leviták könyve int Áront, „hogy ne menjen be akármikor a szenthelyre a függönyön belül a fedél elé”. A Zsidókhoz írt levél erre épít: „A második kárpiton túl pedig az a sátor, melyet neveztek szentek szentének”, ahová „egy-egy évben egyszer csak maga a főpap, vérrel” ment. Ezékiel látomásos temploma megtartja a húsz singes helyiséget, „Ez a szentek szentje”, és Dániel hetven hete azzal végződik, hogy „felkenettessék a Szentek szente”."
    - "A láda eltűnt, amikor a babiloniak Kr. e. 587-ben vagy 586-ban felégették a templomot, és a második templom belső helyisége üresen állt. Amikor Pompeius Kr. e. 63-ban elfoglalta Jeruzsálemet, bement, mondja Josephus, és látta, amit csak a főpap láthatott, de semmit sem vitt el; Tacitus följegyzi, hogy Pompeius nem talált ott istenképet, csak üres széket és puszta titkokat. A Misna egy kőre emlékszik ott, az Alapkőre, amelyre a főpap tömjénezőjét tette. Az evangéliumok szerint Jézus halálakor „a templom kárpítja fölétől aljáig ketté hasada”, a Zsidókhoz írt levél pedig „bizodalmunk van a szentélybe való bemenetelre a Jézus vére által” szavakkal új útról beszél, „a kárpit, azaz az ő teste által”."
    - "A templom Kr. u. 70-ben elpusztult. 691 vagy 692 óta a Sziklamecset áll a Templomhegyen (al-Haram al-Sharif) a szabadon álló alapkőzet fölött. Hogy a Hegyen hol állt a Szentek szentje, vitatott: az egyik nézet e szikla fölé helyezi, mások tőle kissé északra vagy délre. A helyiségből semmi sem maradt, és a Hegyen ásatás nem engedélyezett. Sok vallásos zsidó egyáltalán nem lép a platóra, attól való félelmében, hogy arra lép, ahol a Szentek szentje állt."
  fi:
    - "Kaikkeinpyhin eli pyhistä pyhin oli tabernaakkelin ja sitten Jerusalemin temppelin sisin huone, jossa liitonarkki seisoi. Tabernaakkelissa esirippu jakoi ”pyhän ja kaikkeinpyhimmän” välillä, ja armoistuin asetettiin arkin päälle, joka oli ”kaikkeinpyhimmässä”. Salomon temppelissä se oli debir, jota King James -käännös kutsuu nimellä ”oracle”: kaksikymmentä kyynärää (noin 9 m) leveä kuutio, kullalla päällystetty, kaksi kymmenen kyynärän korkuista öljypuista kerubia, joiden siipien alle papit toivat arkin ”temppelin kuoriin, kaikkeinpyhimpään”. Aikakirjat sanovat, että pelkkä kulta painoi kuusisataa talenttia."
    - "Vain ylimmäinen pappi astui sisään, kerran vuodessa sovituspäivänä, veren ja suitsukkeen kanssa: 3. Moos. varoittaa Aaronia: ”älköön hän joka aika menkö pyhimpään, esiripun sisäpuolelle, armoistuimen eteen”. Heprealaiskirje rakentaa tälle: ”toisen esiripun takana oli se maja, jonka nimi on ’kaikkeinpyhin’”, johon ”toiseen majaan menee ainoastaan ylimmäinen pappi kerran vuodessa, ei ilman verta”. Hesekielin näkemän temppelin kaksikymmentä kyynärää oleva huone säilyy: ”Tämä on kaikkeinpyhin”, ja Danielin seitsemänkymmentä viikkoa päättyvät siihen, että ”kaikkeinpyhin voidellaan”."
    - "Arkki katosi, kun babylonialaiset polttivat temppelin 587 tai 586 eaa., ja toisen temppelin sisähuone seisoi tyhjänä. Kun Pompeius valtasi Jerusalemin 63 eaa., hän meni sisään, Josephus sanoo, ja näki sen, minkä vain ylimmäinen pappi saattoi nähdä, mutta ei ottanut mitään; Tacitus kertoo, ettei Pompeius löytänyt sieltä jumalankuvaa, vain tyhjän istuimen ja paljaat salaisuudet. Mishna muistaa siellä olleen kiven, Perustuskiven, jolle ylimmäinen pappi asetti suitsutusastiansa. Evankeliumit kertovat, että Jeesuksen kuollessa ”temppelin esirippu repesi kahtia ylhäältä alas asti”, ja Heprealaiskirje puhuu siitä, että ”meillä Jeesuksen veren kautta on pääsy kaikkeinpyhimpään” uutta tietä pitkin, joka ”käy esiripun, se on hänen lihansa, kautta”."
    - "Temppeli tuhottiin vuonna 70 jaa. Vuodesta 691 tai 692 Kalliomoskeija on seissyt Temppelivuorella (al-Haram al-Sharif) paljastuneen peruskallion päällä. Missä vuorella Kaikkeinpyhin sijaitsi, on kiistanalaista: yksi näkemys sijoittaa sen tämän kallion päälle, toiset hieman sen pohjois- tai eteläpuolelle. Huoneesta ei ole säilynyt mitään, eikä vuorella saa kaivaa. Monet uskonnolliset juutalaiset eivät astu alustalle lainkaan peläten astuvansa sinne, missä pyhistä pyhin sijaitsi."
  vi:
    - "Nơi Chí Thánh, hay Holy of Holies, là gian trong cùng của đền tạm và rồi của Đền Thờ ở Giê-ru-sa-lem, nơi hòm giao ước đặt. Trong đền tạm, một bức màn ngăn cách “nơi thánh và nơi chí thánh”, và nắp thi ân được đặt trên hòm “trong nơi chí thánh”. Trong Đền Thờ của Sa-lô-môn, đó là debir, mà bản King James gọi là “the oracle”: một khối lập phương hai mươi cu-đê (khoảng 9 m) bọc vàng, với hai chê-ru-bin bằng gỗ ô-li-ve cao mười cu-đê, dưới cánh chúng các thầy tế lễ đem hòm vào “trong nơi chí thánh, dưới cánh chê-ru-bin”. Sách Sử ký nói riêng vàng đã đến sáu trăm ta lâng."
    - "Chỉ thầy tế lễ thượng phẩm vào, mỗi năm một lần vào Ngày Chuộc tội, với huyết và hương: Lê-vi ký cảnh cáo A-rôn “chớ vào luôn luôn trong nơi thánh ở phía trong bức màn, trước nắp thi ân trên hòm bảng chứng”. Thư gửi người Hê-bơ-rơ xây trên điều này: “rồi đến phía trong màn thứ hai, tức là phần gọi là nơi rất thánh”, nơi “mỗi năm một lần chỉ một mình thầy tế lễ thượng phẩm vào, chẳng bao giờ mà không đem huyết”. Đền Thờ khải tượng của Ê-xê-chi-ên giữ gian hai mươi cu-đê, “Chính là chỗ rất thánh đây”, và bảy mươi tuần của Đa-ni-ên kết thúc với việc xức dầu cho “Đấng rất thánh”."
    - "Hòm biến mất khi người Ba-by-lôn đốt Đền Thờ năm 587 hoặc 586 TCN, và gian trong của Đền Thờ Thứ Hai đứng trống. Khi Pompey chiếm Giê-ru-sa-lem năm 63 TCN, ông bước vào, Josephus nói, và thấy điều chỉ thầy tế lễ thượng phẩm được thấy, nhưng không lấy gì; Tacitus ghi rằng Pompey không thấy tượng thần nào ở đó, chỉ một chỗ ngồi trống và những điều bí mật trơ trụi. Mishnah nhớ có một tảng đá ở đó, Đá Nền, nơi thầy tế lễ thượng phẩm đặt lư hương. Các sách Phúc Âm kể rằng khi Giê-su chết, “cái màn trong đền thờ, bị xé ra làm hai từ trên chí dưới”, và thư Hê-bơ-rơ nói về việc “nhờ huyết Đức Chúa Jêsus được dạn dĩ vào nơi rất thánh”, bởi con đường mới “ngang qua cái màn, nghĩa là ngang qua xác Ngài”."
    - "Đền Thờ bị phá hủy năm 70. Từ năm 691 hoặc 692, Vòm Đá đứng trên Núi Đền Thờ (al-Haram al-Sharif) phía trên nền đá lộ thiên. Nơi Chí Thánh đứng ở đâu trên Núi còn tranh luận: một quan điểm đặt nó trên tảng đá này, những người khác hơi về phía bắc hay phía nam. Không gì của gian ấy còn lại, và việc khai quật trên Núi không được phép. Nhiều người Do Thái sùng đạo không bước lên nền đó chút nào, vì sợ giẫm lên chỗ Nơi Chí Thánh từng ở."
  ro:
    - "Sfânta Sfintelor era încăperea cea mai dinăuntru a cortului și apoi a Templului din Ierusalim, unde se afla chivotul legământului. În cort, o perdea despărțea „între sfânta, și între sfânta sfintelor”, iar capacul ispășirii a fost pus peste chivot „în sfânta sfintelor”. În Templul lui Solomon era debir, pe care King James Version îl numește oracolul: un cub de douăzeci de coți (circa 9 m) acoperit cu aur, cu doi heruvimi din lemn de măslin înalți de zece coți, iar preoții au adus chivotul „înlăuntrul casei în sfânta Sfintelor supt aripile Heruvimilor”. Cronicile spun că numai aurul a ajuns la șase sute de talanți."
    - "Intra numai marele preot, o dată pe an, în Ziua Ispășirii, cu sânge și tămâie: Leviticul îl avertizează pe Aaron „să nu intre în toată vremea întru cel sfânt mai înlăuntru de catapeteazma cea din fața acoperemântului împăcării”. Epistola către Evrei se sprijină pe aceasta: „a doua catapeteazmă, cortul cel ce se chiemà Sfintele sfintelor”, iar „în cel de al doilea, odată în an singur arhiereul, nu fără de sânge”. Templul din viziunea lui Ezechiel păstrează încăperea de douăzeci de coți: „aceasta este Sfânta Sfintelor”, iar cele șaptezeci de săptămâni ale lui Daniel se încheie cu ungerea: „să se ungă Sfântul sfinților”."
    - "Chivotul a dispărut când babilonienii au ars Templul în 587 sau 586 î.Hr., iar încăperea interioară a celui de-al Doilea Templu a rămas goală. Când Pompei a luat Ierusalimul în 63 î.Hr., a intrat, spune Iosif Flaviu, și a văzut ce nu putea vedea decât marele preot, dar n-a luat nimic; Tacit consemnează că Pompei n-a găsit acolo nicio imagine a unui zeu, doar un scaun gol și taine goale. Mișna amintește acolo o piatră, Piatra Temeliei, pe care marele preot își așeza cădelnița. Evangheliile spun că la moartea lui Isus „catapeteasma Bisericei s’a rupt în două, de sus până jos”, iar Evrei vorbește despre „îndrăsneală a intrà întru cele sfinte prin sângele lui Iisus”, pe o cale nouă „prin catapeteazmă, adică prin trupul său”."
    - "Templul a fost distrus în 70 d.Hr. Din 691 sau 692, Domul Stâncii se înalță pe Muntele Templului (al-Haram al-Sharif), deasupra stâncii descoperite. Unde anume pe Munte se afla Sfânta Sfintelor este disputat: o părere o așază deasupra acestei stânci, altele ceva mai la nord sau la sud de ea. Din încăpere nu s-a păstrat nimic, iar săpăturile pe Munte nu sunt permise. Mulți evrei practicanți nu calcă deloc pe platformă, de teama de a nu călca unde se afla Sfânta Sfintelor."
  bg:
    - "Светая светих, или Пресвятото място, е било най-вътрешното помещение на скинията, а после на Храма в Йерусалим, където стоял ковчегът на завета. В скинията една завеса отделяше „светото място от пресветото“, а очистилището беше положено върху ковчега „в пресветото място“. В Соломоновия храм това бил давирът, който King James Version нарича „оракула“: куб от двадесет лакти (около 9 м), обкован със злато, с два херувима от маслиново дърво, високи десет лакти, под чиито крила свещениците внесоха ковчега „в давира на дома, в светая светих“. Летописи казват, че само златото възлизало на шестстотин таланта."
    - "Влизал единствено първосвещеникът, веднъж в годината в Деня на умилостивението, с кръв и тамян: Левит предупреждава Аарон „да не влиза всяко време в светилището което е отвътре завесата, пред очистилището“. Посланието към евреите надгражда това: „зад втората завеса имаше скиния която се казваше Светая Светих“, в която „еднъж в годината влезваше първосвещеникът сам, не без кръв“. Видяният от Йезекиил храм запазва помещението от двадесет лакти: „Това е най-светото място“, а седемдесетте седмици на Даниил завършват с това „да се помаже Пресветият“."
    - "Ковчегът изчезнал, когато вавилонците изгорили Храма през 587 или 586 г. пр.н.е., и вътрешното помещение на Втория храм стояло празно. Когато Помпей превзел Йерусалим през 63 г. пр.н.е., той влязъл, казва Йосиф Флавий, и видял онова, което само първосвещеникът можел да вижда, но не взел нищо; Тацит отбелязва, че Помпей не намерил там изображение на бог, а само празен престол и голи тайнства. Мишна помни там един камък, Основния камък, върху който първосвещеникът поставял кадилницата си. Евангелията разказват, че при смъртта на Исус „завесата на храма раздра се на две от горе до долу“, а Посланието към евреите говори за „дързновение да влезем в светилището чрез кръвта Исусова“, по нов път „през завесата, сиреч плътта си“."
    - "Храмът е разрушен през 70 г. н.е. От 691 или 692 г. на Храмовия хълм (ал-Харам аш-Шариф) над откритата скала стои Куполът на скалата. Къде на хълма е било Светая светих, е спорно: едно мнение го поставя над тази скала, други — малко на север или на юг от нея. Нищо от помещението не е оцеляло, а разкопки на хълма не се разрешават. Много религиозни юдеи изобщо не стъпват на платформата от страх да не минат там, където е било Светая светих."
