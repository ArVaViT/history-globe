# Overview article (ADR 0007). Mainstream facts only; the position of the inner sanctuary on the Temple Mount is given as disputed.
id: most-holy-place
place: a9acaaf
title:
  en: "Most Holy Place"
  ru: "Святое Святых"
  uk: "Святеє Святих"
  es: "Lugar Santísimo"
  pt: "Santo dos Santos"
  de: "Allerheiligstes"
