body:
  en:
    - "The Jericho of the Gospels was not the mound of Joshua's city, Tell es-Sultan, which lay deserted, but a new town about 2 km to the south at the mouth of the Wadi Qelt, where the road from Jerusalem comes down into the Jordan valley: the mounds of Tulul Abu el-Alayiq on both banks of the stream. The map keeps this place apart; the older Jericho has its own article."
    - "Here the Hasmonean kings built a winter palace with pools and gardens, watered by aqueducts from the springs of the Wadi Qelt, and here in 35 BC the young high priest Aristobulus III was drowned by Herod's men in a swimming pool. Herod, who had to lease the balsam and date groves back from Cleopatra after Antony gave them to her, built three palaces of his own, the last with a sunken garden and a bath on both banks of the wadi, and a theatre and hippodrome nearby. He died at Jericho in 4 BC. Strabo describes the oasis: a plain ringed by mountains, a palm grove a hundred stadia long, the king's palace and the balsam that grew nowhere else. Archelaus rebuilt the palace, and in AD 68 Vespasian's army found the town deserted and garrisoned it."
    - "Jesus came this way on his last journey to Jerusalem. As he left Jericho with a great crowd, blind Bartimaeus “sat by the highway side begging” and was healed; Luke, who sets the healing as Jesus “was come nigh unto Jericho”, adds that in the city Zacchaeus, “the chief among the publicans”, climbed a sycamore to see him and received him at his house. The man in the parable “went down from Jerusalem to Jericho, and fell among thieves”: the road drops about a thousand metres in 25 km through the desert along the Wadi Qelt."
    - "Charles Warren dug trenches here in 1868; James Kelso and Dimitri Baramki in 1950 and James Pritchard in 1951 uncovered Herod's buildings, and Ehud Netzer's excavations of 1973–1987 laid out the whole sequence of Hasmonean and Herodian palaces. The ruins lie beside the Jerusalem road on the western edge of the modern city of Jericho (Ariha) in the West Bank, under the cliffs of the Judaean desert."
  ru:
    - "Иерихон Евангелий — не холм города Иисуса Навина, Телль-эс-Султан, который лежал в запустении, а новый город примерно в 2 км к югу, у выхода Вади-Кельт, где дорога из Иерусалима спускается в Иорданскую долину: холмы Тулуль-Абу-эль-Алайик по обоим берегам потока. Карта держит это место отдельно; у древнего Иерихона своя статья."
    - "Здесь цари Хасмонеи построили зимний дворец с бассейнами и садами, питаемыми водопроводами от источников Вади-Кельт, и здесь в 35 г. до н. э. люди Ирода утопили в бассейне юного первосвященника Аристовула III. Ирод, которому пришлось арендовать у Клеопатры бальзамовые и финиковые рощи после того, как Антоний подарил их ей, построил три собственных дворца, последний — с углублённым садом и баней по обоим берегам вади, а поблизости театр и ипподром. Он умер в Иерихоне в 4 г. до н. э. Страбон описывает оазис: равнина в кольце гор, пальмовая роща длиной в сто стадиев, царский дворец и бальзам, не росший больше нигде. Архелай отстроил дворец, а в 68 г. н. э. войско Веспасиана нашло город опустевшим и поставило в нём гарнизон."
    - "Этим путём Иисус шёл в последнее путешествие в Иерусалим. Когда Он выходил из Иерихона с множеством народа, слепой Вартимей «сидел у дороги, прося милостыни» и был исцелён; Лука, у которого исцеление происходит, «Когда же подходил Он к Иерихону», добавляет, что в городе Закхей, «начальник мытарей», влез на смоковницу, чтобы увидеть Его, и принял Его в своём доме. Человек из притчи «шел из Иерусалима в Иерихон и попался разбойникам»: дорога теряет около тысячи метров высоты на 25 км пустыни вдоль Вади-Кельт."
    - "Чарльз Уоррен копал здесь траншеи в 1868 году; Джеймс Келсо и Димитрий Барамки в 1950-м и Джеймс Притчард в 1951-м открыли постройки Ирода, а раскопки Эхуда Нецера 1973–1987 годов выстроили всю последовательность хасмонейских и иродианских дворцов. Руины лежат у Иерусалимской дороги на западной окраине современного Иерихона (Арихи) на Западном берегу, под обрывами Иудейской пустыни."
  uk:
    - "Єрихон Євангелій був не городищем міста Ісуса Навина, Телль-ес-Султаном, що лежало безлюдним, а новим містом приблизно за 2 км на південь, у гирлі Ваді-Кельт, де дорога з Єрусалима спускається в Йорданську долину: це городища Туллюль-Абу-ель-Алайк по обидва береги потоку. Карта тримає це місце окремо; давній Єрихон має власну статтю."
    - "Тут хасмонейські царі збудували зимовий палац із басейнами й садами, що зрошувалися акведуками з джерел Ваді-Кельт, і тут 35 р. до н. е. юного первосвященника Аристовула III втопили в басейні люди Ірода. Ірод, якому довелося орендувати назад бальзамові й фінікові гаї в Клеопатри після того, як Антоній віддав їх їй, збудував три власні палаци, останній із заглибленим садом і лазнею по обидва береги вади, а також театр і іподром поблизу. Він помер в Єрихоні 4 р. до н. е. Страбон описує оазу: рівнина, обведена горами, пальмовий гай довжиною сто стадій, царський палац і бальзам, що ріс лише тут. Архелай відбудував палац, а 68 р. н. е. військо Веспасіана застало місто безлюдним і поставило в ньому залогу."
    - "Ісус пройшов цим шляхом у своїй останній подорожі до Єрусалима. Коли Він виходив з Єрихона з великим натовпом, сліпий Вартимей «сидїв над шляхом, просячи» і зцілився; Лука, який ставить зцілення, коли Ісус «наближав ся до Єрихона», додає, що в місті Закхей, «старший між митниками», виліз на шовковицю, щоб побачити Його, і прийняв у своєму домі. Чоловік у притчі «ійшов з Єрусалиму в Єрихон, і попав ся розбійникам»: дорога спадає приблизно на тисячу метрів на 25 км крізь пустелю вздовж Ваді-Кельт."
    - "Чарлз Воррен копав тут рови 1868 року; Джеймс Келсо і Дімітрі Барамкі 1950 року та Джеймс Прічард 1951 року відкрили будівлі Ірода, а розкопки Егуда Нецера 1973–1987 років виклали всю послідовність хасмонейських та іродіанських палаців. Руїни лежать біля єрусалимської дороги на західному краї сучасного міста Єрихон (Ариха) на Західному березі, під скелями Юдейської пустелі."
  es:
    - "El Jericó de los Evangelios no era el montículo de la ciudad de Josué, Tell es-Sultan, que yacía desierto, sino una población nueva a unos 2 km al sur, en la desembocadura del Wadi Qelt, donde el camino de Jerusalén baja al valle del Jordán: los montículos de Tulul Abu el-Alayiq a ambas orillas del arroyo. El mapa mantiene este lugar aparte; el Jericó más antiguo tiene su propio artículo."
    - "Aquí los reyes asmoneos construyeron un palacio de invierno con estanques y jardines, regados por acueductos desde los manantiales del Wadi Qelt, y aquí, en el 35 a. C., el joven sumo sacerdote Aristóbulo III fue ahogado por los hombres de Herodes en una piscina. Herodes, que tuvo que arrendar de nuevo a Cleopatra los palmerales de bálsamo y dátiles después de que Antonio se los diera a ella, construyó tres palacios propios, el último con un jardín hundido y un baño a ambas orillas del wadi, y un teatro y un hipódromo cercanos. Murió en Jericó en el 4 a. C. Estrabón describe el oasis: una llanura rodeada de montañas, un palmeral de cien estadios de largo, el palacio del rey y el bálsamo que no crecía en ningún otro sitio. Arquelao reconstruyó el palacio, y en el 68 d. C. el ejército de Vespasiano halló la población desierta y le puso guarnición."
    - "Jesús pasó por aquí en su último viaje a Jerusalén. Al salir de Jericó con una gran multitud, el ciego Bartimeo «estaba sentado junto al camino mendigando» y fue sanado; Lucas, que sitúa la curación «acercándose él á Jericó», añade que en la ciudad Zaqueo, «el principal de los publicanos», subió a un sicómoro para verlo y lo recibió en su casa. El hombre de la parábola «descendía de Jerusalem á Jericó, y cayó en manos de ladrones»: el camino baja unos mil metros en 25 km por el desierto a lo largo del Wadi Qelt."
    - "Charles Warren abrió zanjas aquí en 1868; James Kelso y Dimitri Baramki en 1950 y James Pritchard en 1951 sacaron a la luz los edificios de Herodes, y las excavaciones de Ehud Netzer de 1973–1987 pusieron al descubierto toda la secuencia de palacios asmoneos y herodianos. Las ruinas se hallan junto al camino de Jerusalén, en el borde occidental de la ciudad moderna de Jericó (Ariha), en Cisjordania, bajo los acantilados del desierto de Judea."
  pt:
    - "A Jericó dos Evangelhos não era o monte da cidade de Josué, Tell es-Sultan, que jazia deserto, mas uma cidade nova a cerca de 2 km ao sul, na foz do uádi Qelt, onde a estrada de Jerusalém desce ao vale do Jordão: os montes de Tulul Abu el-Alayiq, nas duas margens do riacho. O mapa mantém este lugar à parte; a Jericó mais antiga tem seu próprio artigo."
    - "Aqui os reis asmoneus construíram um palácio de inverno com tanques e jardins, irrigados por aquedutos das fontes do uádi Qelt, e aqui, em 35 a.C., o jovem sumo sacerdote Aristóbulo III foi afogado por homens de Herodes numa piscina. Herodes, que teve de arrendar de volta de Cleópatra os palmares e bálsamos que Antônio lhe dera, construiu três palácios próprios, o último com um jardim rebaixado e uma casa de banhos nas duas margens do uádi, e um teatro e um hipódromo ali perto. Morreu em Jericó em 4 a.C. Estrabão descreve o oásis: uma planície cercada de montanhas, um palmar de cem estádios de comprimento, o palácio do rei e o bálsamo que não crescia em nenhum outro lugar. Arquelau reconstruiu o palácio, e em 68 d.C. o exército de Vespasiano encontrou a cidade deserta e nela pôs uma guarnição."
    - "Jesus passou por aqui em sua última viagem a Jerusalém. Quando saía de Jericó com uma grande multidão, o cego Bartimeu estava “sentado à beira do caminho” mendigando e foi curado; Lucas, que situa a cura “ao aproximar-se ele de Jericó”, acrescenta que na cidade Zaqueu, “chefe dos cobradores de impostos”, subiu num sicômoro para vê-lo e o recebeu em sua casa. O homem da parábola “descia de Jerusalém para Jericó e caiu nas mãos de salteadores”: a estrada desce cerca de mil metros em 25 km pelo deserto, ao longo do uádi Qelt."
    - "Charles Warren abriu trincheiras aqui em 1868; James Kelso e Dimitri Baramki em 1950 e James Pritchard em 1951 trouxeram à luz edifícios de Herodes, e as escavações de Ehud Netzer, de 1973–1987, revelaram toda a sequência de palácios asmoneus e herodianos. As ruínas ficam junto à estrada de Jerusalém, na orla ocidental da moderna cidade de Jericó (Ariha), na Cisjordânia, sob os penhascos do deserto da Judeia."
  de:
    - "Das Jericho der Evangelien war nicht der Hügel von Josuas Stadt, Tell es-Sultan, der verlassen lag, sondern eine neue Stadt etwa 2 km südlich an der Mündung des Wadi Qelt, wo die Straße von Jerusalem ins Jordantal herabkommt: die Hügel von Tulul Abu el-Aleiq beiderseits des Baches. Die Karte hält diesen Ort getrennt; das ältere Jericho hat einen eigenen Artikel."
    - "Hier bauten die hasmonäischen Könige einen Winterpalast mit Teichen und Gärten, von Aquädukten aus den Quellen des Wadi Qelt bewässert, und hier wurde 35 v. Chr. der junge Hohepriester Aristobul III. von Herodes' Männern in einem Schwimmbecken ertränkt. Herodes, der die Balsam- und Dattelhaine von Kleopatra zurückpachten musste, nachdem Antonius sie ihr gegeben hatte, baute drei eigene Paläste, den letzten mit einem eingesenkten Garten und einem Bad beiderseits des Wadi, und in der Nähe ein Theater und ein Hippodrom. Er starb 4 v. Chr. in Jericho. Strabon beschreibt die Oase: eine von Bergen umgebene Ebene, ein hundert Stadien langer Palmenhain, der Königspalast und der Balsam, der nirgends sonst wuchs. Archelaus baute den Palast wieder auf, und im Jahr 68 n. Chr. fand Vespasians Heer die Stadt verlassen vor und legte eine Besatzung hinein."
    - "Jesus kam auf seiner letzten Reise nach Jerusalem hier vorbei. Als er Jericho mit einer großen Menge verließ, „saß ein Blinder, Bartimäus, des Timäus Sohn, am Wege und bettelte“ und wurde geheilt; Lukas, der die Heilung ansetzt, als Jesus „nahe an Jericho kam“, fügt hinzu, dass in der Stadt Zachäus, „ein Oberster der Zöllner“, auf einen Maulbeerbaum stieg, um ihn zu sehen, und ihn in seinem Haus aufnahm. Der Mann im Gleichnis „ging von Jerusalem hinab gen Jericho und fiel unter die Mörder“: Die Straße fällt auf 25 km durch die Wüste entlang des Wadi Qelt um etwa tausend Meter."
    - "Charles Warren legte hier 1868 Gräben an; James Kelso und Dimitri Baramki 1950 und James Pritchard 1951 legten Herodes' Bauten frei, und Ehud Netzers Grabungen von 1973–1987 brachten die ganze Abfolge der hasmonäischen und herodianischen Paläste ans Licht. Die Ruinen liegen neben der Jerusalemer Straße am Westrand der heutigen Stadt Jericho (Ariha) im Westjordanland, unter den Felswänden der Judäischen Wüste."
  fr:
    - "Le Jéricho des Évangiles n’était pas le tertre de la ville de Josué, Tell es-Sultan, qui gisait désert, mais une ville nouvelle à environ 2 km au sud, à l’embouchure de l’oued Qelt, là où la route de Jérusalem descend dans la vallée du Jourdain : les tertres de Tulul Abu el-Alayiq sur les deux rives du cours d’eau. La carte tient ce lieu à part ; l’ancien Jéricho a sa propre fiche."
    - "Ici les rois hasmonéens bâtirent un palais d’hiver avec bassins et jardins, arrosé par des aqueducs depuis les sources de l’oued Qelt, et ici, en 35 av. J.-C., le jeune grand prêtre Aristobule III fut noyé dans une piscine par les hommes d’Hérode. Hérode, qui dut reprendre à bail à Cléopâtre les palmeraies de baumiers et de dattiers qu’Antoine lui avait données, bâtit trois palais à lui, le dernier avec un jardin en contrebas et un bain sur les deux rives de l’oued, ainsi qu’un théâtre et un hippodrome tout près. Il mourut à Jéricho en 4 av. J.-C. Strabon décrit l’oasis : une plaine cernée de montagnes, une palmeraie longue de cent stades, le palais du roi et le baume qui ne poussait nulle part ailleurs. Archélaüs rebâtit le palais, et en 68 apr. J.-C. l’armée de Vespasien trouva la ville déserte et y mit une garnison."
    - "Jésus passa par ici lors de son dernier voyage vers Jérusalem. Comme il quittait Jéricho avec une grande foule, l’aveugle Bartimée « était assis au bord du chemin » à mendier et fut guéri ; Luc, qui situe la guérison « comme Jésus approchait de Jéricho », ajoute que dans la ville Zachée, « chef des publicains », monta sur un sycomore pour le voir et le reçut chez lui. L’homme de la parabole « descendait de Jérusalem à Jéricho. Il tomba au milieu des brigands » : la route descend d’environ mille mètres en 25 km à travers le désert le long de l’oued Qelt."
    - "Charles Warren y creusa des tranchées en 1868 ; James Kelso et Dimitri Baramki en 1950 et James Pritchard en 1951 mirent au jour des bâtiments d’Hérode, et les fouilles d’Ehud Netzer de 1973–1987 dégagèrent toute la suite des palais hasmonéens et hérodiens. Les ruines se trouvent le long de la route de Jérusalem, à la lisière ouest de la ville moderne de Jéricho (Ariha), en Cisjordanie, sous les falaises du désert de Judée."
  pl:
    - "Jerycho z Ewangelii nie było pagórkiem miasta Jozuego, Tell es-Sultan, który leżał opuszczony, lecz nowym miastem około 2 km na południe u ujścia Wadi Kelt, gdzie droga z Jerozolimy schodzi do doliny Jordanu: pagórkami Tulul Abu el-Alajik po obu brzegach strumienia. Mapa trzyma to miejsce osobno; starsze Jerycho ma własny artykuł."
    - "Tu królowie hasmonejscy zbudowali zimowy pałac z basenami i ogrodami, nawadniany akweduktami ze źródeł Wadi Kelt, i tu w 35 r. p.n.e. młody arcykapłan Arystobul III został utopiony przez ludzi Heroda w basenie. Herod, który musiał dzierżawić gaje balsamu i daktyli od Kleopatry po tym, jak Antoniusz jej je dał, zbudował trzy własne pałace, ostatni z zagłębionym ogrodem i łaźnią po obu brzegach wadi, oraz pobliski teatr i hipodrom. Zmarł w Jerychu w 4 r. p.n.e. Strabon opisuje oazę: równinę otoczoną górami, gaj palmowy długości stu stadiów, pałac króla i balsam, który nigdzie indziej nie rósł. Archelaos odbudował pałac, a w 68 r. n.e. wojsko Wespazjana zastało miasto opuszczone i osadziło w nim załogę."
    - "Jezus szedł tędy w ostatniej podróży do Jerozolimy. Gdy wychodził z Jerycha z wielkim tłumem, ślepy Bartymeusz „siedział podle drogi żebrząc” i został uzdrowiony; Łukasz, który umieszcza uzdrowienie, „gdy się on przybliżał do Jerycha”, dodaje, że w mieście Zacheusz, „który był przełożony nad celnikami”, wspiął się na sykomorę, by go zobaczyć, i przyjął go w swoim domu. Człowiek z przypowieści „zstępował z Jeruzalemu do Jerycha, i wpadł między zbójców”: droga spada około tysiąca metrów na 25 km przez pustynię wzdłuż Wadi Kelt."
    - "Charles Warren kopał tu rowy w 1868 r.; James Kelso i Dimitri Baramki w 1950 r. oraz James Pritchard w 1951 r. odsłonili budowle Heroda, a wykopaliska Ehuda Netzera z lat 1973–1987 wydobyły całą sekwencję pałaców hasmonejskich i herodiańskich. Ruiny leżą przy drodze do Jerozolimy na zachodnim skraju współczesnego miasta Jerycho (Arycha) na Zachodnim Brzegu, pod klifami pustyni judzkiej."
  it:
    - "La Gerico dei Vangeli non era il tell della città di Giosuè, Tell es-Sultan, che giaceva deserto, ma una città nuova circa 2 km a sud, alla foce del Wadi Qelt, dove la strada da Gerusalemme scende nella valle del Giordano: i tell di Tulul Abu el-Alayiq sulle due rive del torrente. La mappa tiene separato questo luogo; la Gerico più antica ha una sua voce."
    - "Qui i re asmonei costruirono un palazzo invernale con vasche e giardini, irrigato da acquedotti dalle sorgenti del Wadi Qelt, e qui nel 35 a.C. il giovane sommo sacerdote Aristobulo III fu annegato in una piscina dagli uomini di Erode. Erode, che dovette riprendere in affitto da Cleopatra i palmeti di balsamo e datteri dopo che Antonio glieli aveva dati, costruì tre palazzi propri, l’ultimo con un giardino incassato e un bagno sulle due rive del wadi, e vicino un teatro e un ippodromo. Morì a Gerico nel 4 a.C. Strabone descrive l’oasi: una piana cinta da monti, un palmeto lungo cento stadi, il palazzo del re e il balsamo che non cresceva altrove. Archelao ricostruì il palazzo, e nel 68 d.C. l’esercito di Vespasiano trovò la città deserta e vi pose una guarnigione."
    - "Gesù passò di qui nel suo ultimo viaggio a Gerusalemme. Mentre usciva da Gerico con una gran folla, Bartimeo, «cieco mendicante, sedeva presso la strada» e fu guarito; Luca, che pone la guarigione quando Gesù «si avvicinava a Gerico», aggiunge che in città Zaccheo, «capo dei pubblicani», salì su un sicomoro per vederlo e lo accolse in casa sua. L’uomo della parabola «scendeva da Gerusalemme a Gerico, e s’imbatté in ladroni»: la strada scende di circa mille metri in 25 km attraverso il deserto lungo il Wadi Qelt."
    - "Charles Warren scavò trincee qui nel 1868; James Kelso e Dimitri Baramki nel 1950 e James Pritchard nel 1951 portarono alla luce gli edifici di Erode, e gli scavi di Ehud Netzer del 1973–1987 hanno messo in luce l’intera sequenza dei palazzi asmonei ed erodiani. Le rovine si trovano accanto alla strada di Gerusalemme al margine occidentale della moderna Gerico (Ariha) in Cisgiordania, sotto le scogliere del deserto di Giuda."
  nl:
    - "Het Jericho van de evangeliën was niet de heuvel van Jozua’s stad, Tell es-Sultan, die verlaten lag, maar een nieuwe stad ongeveer 2 km naar het zuiden bij de monding van de Wadi Qelt, waar de weg uit Jeruzalem afdaalt in het Jordaandal: de heuvels van Tulul Abu el-Alayiq aan beide oevers van de beek. De kaart houdt deze plaats apart; het oudere Jericho heeft een eigen artikel."
    - "Hier bouwden de Hasmoneïsche koningen een winterpaleis met vijvers en tuinen, bewaterd door aquaducten van de bronnen van de Wadi Qelt, en hier werd in 35 v.Chr. de jonge hogepriester Aristobulus III door Herodes’ mannen in een zwembad verdronken. Herodes, die de balsem- en dadelgaarden van Cleopatra moest terughuren nadat Antonius ze haar had gegeven, bouwde drie eigen paleizen, het laatste met een verzonken tuin en een bad aan beide oevers van de wadi, en een theater en renbaan in de buurt. Hij stierf in 4 v.Chr. te Jericho. Strabo beschrijft de oase: een vlakte omringd door bergen, een palmbos van honderd stadiën lang, het koninklijk paleis en de balsem die nergens anders groeide. Archelaüs herbouwde het paleis, en in 68 n.Chr. vond het leger van Vespasianus de stad verlaten en legde er een garnizoen in."
    - "Jezus kwam hier langs op zijn laatste reis naar Jeruzalem. Toen hij Jericho met een grote schare verliet, zat de blinde Bartimeüs “aan den weg, bedelende” en werd genezen; Lukas, die de genezing plaatst “als Hij nabij Jericho kwam”, voegt toe dat in de stad Zacheüs, “een overste der tollenaren”, in een wilde vijgenboom klom om hem te zien en hem in zijn huis ontving. De man in de gelijkenis “kwam af van Jeruzalem naar Jericho, en viel onder de moordenaars”: de weg daalt ongeveer duizend meter in 25 km door de woestijn langs de Wadi Qelt."
    - "Charles Warren groef hier in 1868 sleuven; James Kelso en Dimitri Baramki in 1950 en James Pritchard in 1951 legden Herodes’ gebouwen bloot, en Ehud Netzers opgravingen van 1973–1987 brachten de hele reeks Hasmoneïsche en Herodiaanse paleizen aan het licht. De ruïnes liggen naast de weg naar Jeruzalem aan de westrand van de moderne stad Jericho (Ariha) op de Westoever, onder de kliffen van de Judese woestijn."
  cs:
    - "Jericho z evangelií nebylo pahorkem Jozuova města, Tell es-Sultán, který ležel opuštěný, ale nové město asi 2 km na jih u ústí Wádí Kelt, kde cesta z Jeruzaléma sestupuje do Jordánského údolí: pahorky Tulul Abu el-Alayiq na obou březích potoka. Mapa toto místo drží stranou; starší Jericho má vlastní článek."
    - "Zde hasmonejští králové postavili zimní palác s bazény a zahradami, zavlažovanými akvadukty z pramenů Wádí Kelt, a zde roku 35 př. n. l. nechal Herodes utopit mladého velekněze Aristobúla III. v bazénu. Herodes, který musel balzámové a datlové háje najmout zpět od Kleopatry poté, co je jí Antonius dal, postavil tři vlastní paláce, poslední s potopenou zahradou a lázní na obou březích wádí, a nedaleko divadlo a hippodrom. Zemřel v Jerichu roku 4 př. n. l. Strabón popisuje oázu: rovinu obklopenou horami, palmový háj dlouhý sto stadií, královský palác a balzám, který nerostl nikde jinde. Archelaos palác přestavěl a roku 68 n. l. našlo Vespasianovo vojsko město opuštěné a umístilo v něm posádku."
    - "Ježíš šel touto cestou na své poslední cestě do Jeruzaléma. Když vycházel z Jericha s velkým zástupem, slepý Bartimaios „seděl podle cesty, žebře“ a byl uzdraven; Lukáš, který klade uzdravení do chvíle, „když se přibližoval k Jericho“, dodává, že ve městě Zacheus, „hejtman nad celnými“, vylezl na sykomoru, aby ho spatřil, a přijal ho ve svém domě. Muž z podobenství „šel z Jeruzaléma do Jericho, i upadl mezi lotry“: cesta klesá asi o tisíc metrů na 25 km pouští podél Wádí Kelt."
    - "Charles Warren zde kopal příkopy roku 1868; James Kelso a Dimitri Baramki roku 1950 a James Pritchard roku 1951 odkryli Herodovy budovy a vykopávky Ehuda Necera z let 1973–1987 vyložily celou posloupnost hasmonejských a herodiánských paláců. Zříceniny leží vedle jeruzalémské cesty na západním okraji moderního města Jericha (Arícha) na Západním břehu, pod útesy judské pouště."
  sv:
    - "Evangeliernas Jeriko var inte kullen med Josuas stad, Tell es-Sultan, som låg öde, utan en ny stad omkring 2 km söderut vid mynningen av Wadi Qelt, där vägen från Jerusalem kommer ned i Jordandalen: kullarna Tulul Abu el-Alayiq på båda sidor om bäcken. Kartan håller denna plats skild; det äldre Jeriko har sin egen artikel."
    - "Här byggde de hasmoneiska kungarna ett vinterpalats med dammar och trädgårdar, bevattnade av akvedukter från källorna i Wadi Qelt, och här drunknades år 35 f.Kr. den unge översteprästen Aristobulos III av Herodes män i en simbassäng. Herodes, som fick arrendera tillbaka balsam- och dadellundarna av Kleopatra sedan Antonius gett dem till henne, byggde tre egna palats, det sista med en nedsänkt trädgård och ett bad på båda sidor om wadin, och en teater och hippodrom i närheten. Han dog i Jeriko 4 f.Kr. Strabon beskriver oasen: en slätt omgiven av berg, en palmlund hundra stadier lång, kungens palats och balsamen som växte ingen annanstans. Archelaos byggde upp palatset, och år 68 e.Kr. fann Vespasianus armé staden öde och lade en garnison i den."
    - "Jesus kom denna väg på sin sista färd till Jerusalem. När han lämnade Jeriko med en stor skara blev den blinde Bartimeus, som ”satt där vid vägen”, botad; Lukas, som förlägger botandet till när Jesus ”nalkades Jeriko”, tillägger att Sackeus i staden, ”förman för publikanerna”, steg upp i ett mullbärsfikonträd för att se honom och tog emot honom i sitt hus. Mannen i liknelsen ”begav sig från Jerusalem ned till Jeriko, men råkade ut för rövare”: vägen sjunker omkring tusen meter på 25 km genom öknen längs Wadi Qelt."
    - "Charles Warren grävde schakt här 1868; James Kelso och Dimitri Baramki 1950 och James Pritchard 1951 frilade Herodes byggnader, och Ehud Netzers utgrävningar 1973–1987 lade ut hela följden av hasmoneiska och herodianska palats. Ruinerna ligger vid Jerusalemvägen i västra kanten av den moderna staden Jeriko (Ariha) på Västbanken, under den judeiska öknens klippor."
  nb:
    - "Evangeliets Jeriko var ikke haugen til Josvas by, Tell es-Sultan, som lå forlatt, men en ny by omtrent 2 km mot sør ved munningen av Wadi Qelt, der veien fra Jerusalem kommer ned i Jordan-dalen: haugene Tulul Abu el-Alayiq på begge sider av bekken. Kartet holder dette stedet for seg; det eldre Jeriko har sin egen artikkel."
    - "Her bygde de hasmoneiske kongene et vinterpalass med bassenger og hager, vannet av akvedukter fra kildene i Wadi Qelt, og her ble i 35 f.Kr. den unge øversteprest Aristobulos 3. druknet av Herodes' menn i et svømmebasseng. Herodes, som måtte leie balsam- og daddellundene tilbake fra Kleopatra etter at Antonius ga dem til henne, bygde tre palasser selv, det siste med en nedsenket hage og et bad på begge sider av wadien, og et teater og en hippodrom i nærheten. Han døde i Jeriko i 4 f.Kr. Strabon beskriver oasen: en slette omkranset av fjell, en palmelund hundre stadier lang, kongens palass og balsamen som ikke vokste noe annet sted. Arkelaus gjenoppbygde palasset, og i 68 e.Kr. fant Vespasians hær byen forlatt og la en garnison i den."
    - "Jesus kom denne veien på sin siste reise til Jerusalem. Da han forlot Jeriko med en stor folkemengde, «satt Timeus' sønn, Bartimeus, en blind tigger, ved veien» og ble helbredet; Lukas, som legger helbredelsen til da Jesus «kom nær til Jeriko», tilføyer at Sakkeus, «overtolder», i byen klatret opp i et morbærtre for å se ham og tok imot ham i sitt hus. Mannen i lignelsen «gikk ned fra Jerusalem til Jeriko, og han falt iblandt røvere»: veien faller omtrent tusen meter på 25 km gjennom ørkenen langs Wadi Qelt."
    - "Charles Warren gravde søkesjakter her i 1868; James Kelso og Dimitri Baramki i 1950 og James Pritchard i 1951 avdekket Herodes' bygninger, og Ehud Netzers utgravninger i 1973–1987 la ut hele rekken av hasmoneiske og herodianske palasser. Ruinene ligger ved Jerusalem-veien i vestkanten av dagens by Jeriko (Ariha) på Vestbredden, under klippene i den judeiske ørkenen."
  tl:
    - "Ang Jerico ng mga Ebanghelyo ay hindi ang burol ng lungsod ni Josue, ang Tell es-Sultan, na nilisan, kundi isang bagong bayan mga 2 km sa timog sa bukana ng Wadi Qelt, kung saan bumababa ang daan mula sa Jerusalem sa libis ng Jordan: ang mga burol ng Tulul Abu el-Alayiq sa magkabilang pampang ng batis. Pinananatili ng mapa ang lugar na ito nang hiwalay; may sariling artikulo ang mas lumang Jerico."
    - "Dito nagtayo ang mga haring Hasmoneo ng palasyo sa taglamig na may tangke at halamanan, na dinidilig ng aqueduct mula sa mga bukal ng Wadi Qelt, at dito noong 35 BK, nilunod ng mga tauhan ni Herodes ang batang dakilang saserdoteng si Aristobulo III sa isang tangkeng paliguan. Si Herodes, na kinailangang upahan kay Cleopatra ang mga halamanan ng balsamo at datiles pagkatapos ibigay ni Antony sa kaniya, ay nagtayo ng tatlong sariling palasyo, ang huli ay may lubog na halamanan at paliguan sa magkabilang pampang ng wadi, at teatro at hippodrome sa malapit. Namatay siya sa Jerico (4 BK). Inilalarawan ni Strabo ang oasis: kapatagang ring ng bundok, kakahuyan ng palma na 100 estadia ang haba, palasyo ng hari at balsamong dito lamang tumubo. Itinayong muli ni Arquelao ang palasyo; noong 68 AD, natagpuan ng hukbo ni Vespasian na wala nang tao ang bayan at binantayan ito."
    - "Dumaan dito si Jesus sa kaniyang huling paglalakbay patungong Jerusalem. Nang lisanin niya ang Jerico kasama ang malaking pulutong, ang bulag na si Bartimeo ay “nakaupo sa tabi ng daan na nagpapalimos” at pinagaling; si Lucas, na nagtatakda ng pagpapagaling nang “nalalapit na sila sa Jerico”, ay nagdaragdag na sa lungsod si Zaqueo, “isang puno ng mga maniningil ng buwis”, ay umakyat sa isang sikomoro upang makita siya at tinanggap siya sa kaniyang bahay. Ang tao sa talinghaga ay “bumababa sa Jerico na mula sa Jerusalem; at siya'y nahulog sa kamay ng mga tulisan”: ang daan ay bumababa ng halos isang libong metro sa 25 km sa disyerto sa kahabaan ng Wadi Qelt."
    - "Humukay si Charles Warren ng mga trinsera rito noong 1868; nakatuklas sina James Kelso at Dimitri Baramki noong 1950 at James Pritchard noong 1951 ng mga gusali ni Herodes, at inilatag ng mga paghuhukay ni Ehud Netzer noong 1973–1987 ang buong pagkakasunud-sunod ng mga palasyong Hasmoneo at Herodiano. Ang mga guho ay nasa tabi ng daan ng Jerusalem sa kanlurang gilid ng makabagong lungsod ng Jerico (Ariha) sa West Bank, sa ilalim ng mga bangin ng disyerto ng Judea."
  da:
    - "Evangeliernes Jeriko var ikke højen for Josvas by, Tell es-Sultan, som lå øde, men en ny by omkring 2 km mod syd ved mundingen af Wadi Qelt, hvor vejen fra Jerusalem kommer ned i Jordandalen: højene Tulul Abu el-Alayiq på begge bredder af bækken. Kortet holder dette sted adskilt; det ældre Jeriko har sin egen artikel."
    - "Her byggede de hasmonæiske konger et vinterpalads med damme og haver, vandet af akvædukter fra kilderne i Wadi Qelt, og her blev i 35 f.Kr. den unge ypperstepræst Aristobul III druknet af Herodes' mænd i et svømmebassin. Herodes, der måtte leje balsam- og daddellundene tilbage fra Kleopatra, efter at Antonius havde givet hende dem, byggede tre paladser til sig selv, det sidste med en nedsænket have og et bad på begge bredder af wadien, og et teater og hippodrom i nærheden. Han døde i Jeriko i 4 f.Kr. Strabon beskriver oasen: en slette ringet af bjerge, en palmelund hundrede stadier lang, kongens palads og balsamen, der ikke voksede andre steder. Arkelaus genopbyggede paladset, og i 68 e.Kr. fandt Vespasians hær byen forladt og lagde en garnison i den."
    - "Jesus kom denne vej på sin sidste rejse til Jerusalem. Da han forlod Jeriko med en stor skare, sad den blinde Bartimæus, »en blind Tigger, ved Vejen«, og blev helbredt; Lukas, der placerer helbredelsen, »da han nærmede sig til Jeriko«, tilføjer, at Zakæus i byen, »Overtolder«, klatrede op i et morbærfigentræ for at se ham og modtog ham i sit hus. Manden i lignelsen »gik ned fra Jerusalem til Jeriko, og han faldt iblandt Røvere«: vejen falder omkring tusind meter på 25 km gennem ørkenen langs Wadi Qelt."
    - "Charles Warren gravede her prøvegrave i 1868; James Kelso og Dimitri Baramki i 1950 og James Pritchard i 1951 afdækkede Herodes' bygninger, og Ehud Netzers udgravninger i 1973–1987 lagde hele rækkefølgen af hasmonæiske og herodianske paladser frem. Ruinerne ligger ved Jerusalem-vejen i udkanten af det nuværende Jeriko (Ariha) på Vestbredden, under klipperne i den judæiske ørken."
  sr:
    - "Јерихон из јеванђеља није била хумка града Исуса Навина, Тел ес-Султан, који је лежао напуштен, већ нов град око 2 км јужно на ушћу Вади Келта, где се пут из Јерусалима спушта у долину Јордана: хумке Тулул Абу ел-Алајик на обе обале потока. Карта ово место држи одвојено; старији Јерихон има свој чланак."
    - "Овде су хасмонејски цареви саградили зимску палату са базенима и вртовима, напајану аквадуктима из извора Вади Келта, и овде је 35. п. н. е. млади првосвештеник Аристовул III био удављен од Иродових људи у базену за пливање. Ирод, који је морао да узме у закуп гајеве балзама и датуља од Клеопатре пошто их је Антоније њој дао, подигао је три сопствене палате, последњу с потопљеним вртом и купатилом на обе обале вадија, и позориште и хиподром у близини. Умро је у Јерихону 4. п. н. е. Страбон описује оазу: равницу окружену планинама, палмин гај дугачак сто стадија, краљеву палату и балзам који није расао нигде другде. Архелај је обновио палату, а 68. н. е. Веспазијанова војска нашла је град напуштен и поставила посаду."
    - "Исус је овуда дошао на свом последњем путовању у Јерусалим. Док је излазио из Јерихона са великим народом, слепи Вартимеј „сеђаше крај пута просећи“ и био је исцељен; Лука, који смешта исцељење кад се Исус „приближи к Јерихону“, додаје да се у граду Закхеј, „старешина царинички“, попео на дуд да Га види и примио Га у својој кући. Човек из приче „силажаше из Јерусалима у Јерихон, па га ухватише хајдуци“: пут пада око хиљаду метара на 25 км кроз пустињу дуж Вади Келта."
    - "Чарлс Ворен копао је овде ровове 1868; Џејмс Келсо и Димитри Барамки 1950. и Џејмс Причард 1951. открили су Иродове зграде, а ископавања Ехуда Нецера 1973–1987. разоткрила су цео низ хасмонејских и иродовских палата. Рушевине леже поред јерусалимског пута на западном ободу савременог града Јерихона (Ариха) на Западној обали, испод литица јудејске пустиње."
  hu:
    - "Az evangéliumok Jerikója nem Józsué városának halma, a Tell es-Szultán volt, amely elhagyatottan állt, hanem egy új város mintegy 2 km-re délre, a Vádi Qelt torkolatánál, ahol a Jeruzsálemből induló út a Jordán-völgybe ér: a patak két partján a Tulúl Abu el-Alájik halmai. A térkép ezt a helyet külön tartja; a régebbi Jerikónak saját cikke van."
    - "Itt építettek a hasmóneus királyok téli palotát medencékkel és kertekkel, a Vádi Qelt forrásaiból vízvezetékekkel öntözve, és itt fullasztották Kr. e. 35-ben Heródes emberei úszómedencébe a fiatal főpapot, III. Arisztobuloszt. Heródes, akinek vissza kellett bérelnie a balzsam- és datolyaligeteket Kleopátrától, miután Antonius neki adta őket, három saját palotát épített, az utolsót süllyesztett kerttel és fürdővel a vádi mindkét partján, valamint közelében színházat és hippodromot. Kr. e. 4-ben halt meg Jerikóban. Sztrabón leírja az oázist: hegyek övezte síkság, száz stadion hosszú pálmaliget, a király palotája és a balzsam, amely máshol nem nőtt. Arkhelaosz újjáépítette a palotát, és Kr. u. 68-ban Vespasianus serege elhagyatottan találta a várost, és helyőrséget telepített bele."
    - "Jézus erre jött utolsó jeruzsálemi útján. Amikor nagy tömeggel kijött Jerikóból, a vak Bartimeus „ott üle az úton, koldulván”, és meggyógyult; Lukács, aki a gyógyítást úgy helyezi el, hogy Jézus „Jerikhóhoz közeledett”, hozzáteszi, hogy a városban Zákeus, aki „fővámszedő vala”, vadfügefára mászott, hogy lássa, és házában fogadta. A példabeszéd embere „megy vala alá Jeruzsálemből Jerikóba, és rablók kezébe esék”: az út mintegy ezer métert ereszkedik 25 km alatt a sivatagon át a Vádi Qelt mentén."
    - "Charles Warren 1868-ban árkokat ásott itt; James Kelso és Dimitri Baramki 1950-ben, és James Pritchard 1951-ben Heródes épületeit tárták fel, Ehud Netzer 1973–1987-es ásatásai pedig kirajzolták a hasmóneus és heródesi paloták teljes sorozatát. A romok a jeruzsálemi út mellett a mai Jerikó (Ariha) város nyugati szélén fekszenek Ciszjordániában, a júdeai sivatag sziklafalai alatt."
  fi:
    - "Evankeliumien Jeriko ei ollut Joosuan kaupungin kumpu Tell es-Sultan, joka oli autiona, vaan uusi kaupunki noin 2 km etelässä Wadi Qeltin suulla, missä Jerusalemista tuleva tie laskeutuu Jordanin laaksoon: Tulul Abu el-Alayiqin kummut puron molemmin puolin. Kartta pitää tämän paikan erillään; vanhemmalla Jerikolla on oma artikkelinsa."
    - "Täällä hasmonealaiset kuninkaat rakensivat talvipalatsin altaineen ja puutarhoineen, joita Wadi Qeltin lähteiden vesijohdot kastelivat, ja täällä vuonna 35 eaa. Herodeksen miehet hukuttivat nuoren ylipapin Aristobulos III:n uima-altaaseen. Herodes, jonka oli vuokrattava palsami- ja taateliviljelmät takaisin Kleopatralta Antoniuksen annettua ne tälle, rakensi kolme omaa palatsia, viimeisen upotettuine puutarhoineen ja kylpylöineen wadin molemmin puolin, sekä teatterin ja hippodromin lähelle. Hän kuoli Jerikossa vuonna 4 eaa. Strabon kuvaa keidasta: vuorten ympäröimä tasanko, sata stadionia pitkä palmulehto, kuninkaan palatsi ja palsami, joka ei kasvanut missään muualla. Arkelaos rakensi palatsin uudelleen, ja vuonna 68 jaa. Vespasianuksen armeija löysi kaupungin autiona ja sijoitti siihen varuskunnan."
    - "Jeesus tuli tätä tietä viimeisellä matkallaan Jerusalemiin. Lähtiessään Jerikosta suuren väkijoukon kanssa sokea Bartimaios ”istui … tien vieressä” kerjäten ja parannettiin; Luukas, joka sijoittaa parantamisen Jeesuksen ”lähestyessä Jerikoa”, lisää, että kaupungissa Sakkeus, ”publikaanien päämies”, kiipesi metsäviikunapuuhun nähdäkseen hänet ja otti hänet taloonsa. Vertauksen mies ”vaelsi Jerusalemista alas Jerikoon ja joutui ryövärien käsiin”: tie laskee noin tuhat metriä 25 km:n matkalla autiomaan halki Wadi Qeltia pitkin."
    - "Charles Warren kaivoi täällä kaivantoja vuonna 1868; James Kelso ja Dimitri Baramki vuonna 1950 ja James Pritchard vuonna 1951 paljastivat Herodeksen rakennuksia, ja Ehud Netzerin kaivaukset vuosina 1973–1987 paljastivat hasmonealaisten ja herodeslaisten palatsien koko sarjan. Rauniot sijaitsevat Jerusalemin tien varrella nykyisen Jerikon (Ariha) kaupungin länsireunalla Länsirannalla, Juudean autiomaan kallioiden alla."
  vi:
    - "Giê-ri-cô của các sách Phúc Âm không phải gò thành của Giô-suê, Tell es-Sultan, nơi đã bị bỏ hoang, mà là một thị trấn mới cách khoảng 2 km về phía nam ở cửa Wadi Qelt, nơi con đường từ Giê-ru-sa-lem xuống thung lũng Giô-đanh: các gò Tulul Abu el-Alayiq ở hai bờ dòng suối. Bản đồ giữ nơi này riêng; Giê-ri-cô cổ hơn có bài riêng."
    - "Tại đây các vua Hasmonean xây một cung điện mùa đông có hồ và vườn, được tưới bằng các cống dẫn nước từ các suối của Wadi Qelt, và tại đây năm 35 TCN thầy tế lễ thượng phẩm trẻ A-rích-tô-bu III bị người của Hê-rốt dìm chết trong một hồ bơi. Hê-rốt, người phải thuê lại các lùm nhũ hương và chà là từ Cleopatra sau khi Antony tặng bà, xây ba cung điện riêng, cung cuối cùng có vườn chìm và nhà tắm ở hai bờ wadi, và một nhà hát cùng trường đua ngựa gần đó. Ông chết ở Giê-ri-cô năm 4 TCN. Strabo mô tả ốc đảo: một đồng bằng có núi bao quanh, một lùm cọ dài một trăm stadia, cung điện của vua và nhũ hương không mọc ở nơi nào khác. A-chê-la-u xây lại cung điện, và năm 68 quân đội Vespasian thấy thị trấn hoang vắng và đặt đồn lính."
    - "Giê-su đi đường này trong chuyến cuối đến Giê-ru-sa-lem. Khi Ngài rời Giê-ri-cô cùng một đoàn dân đông, Ba-ti-mê mù “ngồi xin ở bên đường” và được chữa lành; Lu-ca, người đặt việc chữa lành khi Ngài “đến gần thành Giê-ri-cô”, thêm rằng trong thành Xa-chê, người “làm đầu bọn thâu thuế”, trèo lên cây sung để thấy Ngài và đón Ngài về nhà. Người trong dụ ngôn “từ thành Giê-ru-sa-lem xuống thành Giê-ri-cô, lâm vào kẻ cướp”: con đường dốc xuống khoảng 1.000 mét trong 25 km qua sa mạc dọc Wadi Qelt."
    - "Charles Warren đào các hào ở đây năm 1868; James Kelso và Dimitri Baramki năm 1950 và James Pritchard năm 1951 phát lộ các công trình của Hê-rốt, và các cuộc khai quật của Ehud Netzer năm 1973–1987 phơi bày toàn bộ chuỗi cung điện Hasmonean và Hê-rốt. Tàn tích nằm bên đường đến Giê-ru-sa-lem ở rìa tây thành phố Giê-ri-cô (Ariha) hiện đại ở Bờ Tây, dưới các vách đá của sa mạc Giu-đê."
  ro:
    - "Ierihonul din Evanghelii nu era movila cetății lui Iosua, Tell es-Sultan, care zăcea pustie, ci un oraș nou, la circa 2 km spre sud, la gura lui Wadi Qelt, unde drumul de la Ierusalim coboară în valea Iordanului: movilele Tulul Abu el-Alayiq de pe ambele maluri ale pârâului. Harta păstrează acest loc separat; Ierihonul mai vechi are propriul articol."
    - "Aici regii hasmonei au construit un palat de iarnă cu bazine și grădini, udat de apeducte din izvoarele lui Wadi Qelt, și aici, în 35 î.Hr., tânărul mare preot Aristobul al III-lea a fost înecat într-o piscină de oamenii lui Irod. Irod, care a trebuit să ia înapoi în arendă de la Cleopatra livezile de balsam și de curmali după ce Antoniu i le dăduse ei, și-a construit trei palate proprii, ultimul cu o grădină scufundată și o baie pe ambele maluri ale wadiului, și un teatru și un hipodrom în apropiere. A murit la Ierihon în 4 î.Hr. Strabon descrie oaza: o câmpie încercuită de munți, o palmerie de o sută de stadii lungime, palatul regelui și balsamul care nu creștea în altă parte. Arhelau a reconstruit palatul, iar în 68 d.Hr. armata lui Vespasian a găsit orașul pustiu și l-a ocupat cu o garnizoană."
    - "Isus a trecut pe aici în ultima sa călătorie spre Ierusalim. Când a ieșit din Ierihon cu o mare mulțime, orbul Bartimeu „ședeà lângă cale cerșind” și a fost vindecat; Luca, care așază vindecarea când Isus „s’au apropiat ... de Ierihon”, adaugă că în oraș Zacheu, „mai mare vameșilor”, s-a suit într-un sicomor ca să-l vadă și l-a primit în casa lui. Omul din parabolă „se pogorà din Ierusalim în Ierihon și a căzut în tâlhari”: drumul coboară circa o mie de metri în 25 km prin deșert, de-a lungul lui Wadi Qelt."
    - "Charles Warren a săpat aici șanțuri în 1868; James Kelso și Dimitri Baramki în 1950 și James Pritchard în 1951 au dezvelit clădirile lui Irod, iar săpăturile lui Ehud Netzer din 1973–1987 au scos la iveală întreaga succesiune de palate hasmonee și herodiene. Ruinele se află lângă drumul Ierusalimului, la marginea de vest a orașului modern Ierihon (Ariha), în Cisiordania, sub stâncile deșertului Iudeii."
  bg:
    - "Йерихон на Евангелията не беше могилата на града на Иисус Навин, Тел ес-Султан, която беше пуста, а нов град на около 2 км на юг при устието на Уади Келт, където пътят от Йерусалим слиза в Йорданската долина: могилите Тулул Абу ел-Алаик от двата бряга на потока. Картата държи това място отделно; по-старият Йерихон има своя статия."
    - "Тук хасмонейските царе построиха зимен дворец с басейни и градини, напоявани от акведукти от изворите на Уади Келт, и тук през 35 г. пр.н.е. младият първосвещеник Аристовул III беше удавен от хората на Ирод в плувен басейн. Ирод, който трябваше да взема под наем от Клеопатра горичките с балсам и финикови палми, след като Антоний ѝ ги даде, построи три собствени двореца, последния с вдлъбната градина и баня от двата бряга на уадито, а наблизо — театър и хиподрум. Той умря в Йерихон през 4 г. пр.н.е. Страбон описва оазиса: равнина, обградена от планини, палмова горичка, дълга сто стадия, царския дворец и балсама, който не растял никъде другаде. Архелай възстанови двореца, а през 68 г. н.е. войската на Веспасиан намери града опустял и постави в него гарнизон."
    - "Исус мина оттук при последното си пътуване към Йерусалим. Когато излизаше от Йерихон с много народ, слепият Вартимей „седеше при пътя та просеше“ и беше изцелен; Лука, който поставя изцелението, когато Исус „наближаваше до Ерихон“, добавя, че в града Закхей, „началник на митарите“, се качи на черница, за да го види, и го прие в дома си. Човекът от притчата „слезваше от Ерусалим в Иерихон и налете на разбойници“: пътят се спуска около хиляда метра за 25 км през пустинята покрай Уади Келт."
    - "Чарлз Уорън изкопа тук ровове през 1868 г.; Джеймс Келсо и Димитри Барамки през 1950 г. и Джеймс Причард през 1951 г. разкриха сградите на Ирод, а разкопките на Ехуд Нецер през 1973–1987 г. изясниха цялата последователност от хасмонейски и Иродови дворци. Развалините лежат до пътя за Йерусалим на западния край на днешния град Йерихон (Ариха) на Западния бряг, под скалите на Юдейската пустиня."
