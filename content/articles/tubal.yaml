body:
  en:
    - "Tubal is a people of Asia Minor, a son of Japheth in the table of nations and the constant companion of Meshech in Ezekiel. It is generally identified with Tabal of the Assyrian records, a land of small Luwian-speaking kingdoms on the plateau of south-central Anatolia, in the old Hittite country around modern Kayseri and Niğde, north of the Taurus and its silver mines. Shalmaneser III received tribute from twenty-four kings of Tabal in 837 BC; Tiglath-pileser III deposed its king Wassurme and put a commoner, Hulli, in his place; Sargon II married his daughter to Ambaris of Tabal and then, in 713, carried him off to Assyria. Hieroglyphic Luwian inscriptions of these kings survive on the rocks of Cappadocia. The Greeks later knew the Tibareni on the Black Sea coast, in the same satrapy as the Moschi, and Josephus made the Thobelites the Iberians of the Caucasus."
    - "Ezekiel names “Javan, Tubal, and Meshech” among the merchants of Tyre who “traded the persons of men and vessels of brass”, the slaves and bronze that Anatolia exported. In his vision of the dead “there is Meshech, Tubal, and all her multitude”, warriors gone down to the pit. And in the oracle against Gog, Tubal is half of his realm: “Gog, the land of Magog, the chief prince of Meshech and Tubal”. Isaiah sends survivors as messengers to far nations, “to Tubal, and Javan, to the isles afar off, that have not heard my fame”; the Synodal Bible writes the name there as Tubal rather than its usual Fuval."
    - "Tabal was overrun by the Cimmerians in the seventh century BC, later passed under Persian rule, and the name died out. The region is central Turkey, around Kayseri and Niğde, where the mound of Kültepe and the rock inscriptions of the Tabalian kings remain."
  ru:
    - "Фувал — народ Малой Азии, сын Иафета в таблице народов и постоянный спутник Мешеха у Иезекииля. Его обычно отождествляют с Табалом ассирийских записей — страной малых лувийских царств на плато южной Анатолии, в старой хеттской земле вокруг нынешних Кайсери и Нигде, к северу от Тавра и его серебряных рудников. Салманасар III получил дань от двадцати четырёх царей Табала в 837 г. до н. э.; Тиглатпаласар III низложил его царя Вассурме и посадил на его место простолюдина Хулли; Саргон II выдал дочь за Амбариса Табальского, а затем, в 713 г., увёл его в Ассирию. Лувийские иероглифические надписи этих царей сохранились на скалах Каппадокии. Греки позже знали тибаренов на берегу Чёрного моря, в одной сатрапии с мосхами, а Иосиф Флавий считал фовелитов иберами Кавказа."
    - "Иезекииль называет Иавана, Фувала и Мешеха среди купцов Тира, которые выменивали товары «на души человеческие и медную посуду» — рабов и бронзу, которые вывозила Анатолия. В его видении мёртвых «там Мешех и Фувал со всем множеством своим», воины, сошедшие в преисподнюю. А в пророчестве о Гоге Фувал — половина его державы: «Гог, князь Роша, Мешеха и Фувала». Исаия посылает уцелевших вестниками к дальним народам, «к Тубалу и Явану, на дальние острова, которые не слышали обо Мне»; Синодальная Библия пишет здесь имя как Тубал, а не обычное Фувал."
    - "В VII веке до н. э. Табал опустошили киммерийцы, позже он вошёл в Персидскую державу, и имя исчезло. Этот край — центральная Турция, около Кайсери и Нигде, где остались холм Кюльтепе и наскальные надписи табальских царей."
  uk:
    - "Тувал — народ Малої Азії, син Яфета в Таблиці народів і постійний супутник Мешеха в Єзекіїля. Його загалом ототожнюють із Табалом ассірійських записів, краєм малих лувійськомовних царств на плато південно-центральної Анатолії, в давній хетській країні навколо сучасних Кайсері та Нігде, на північ від Тавра та його срібних копалень. Салманассар III отримав данину від двадцяти чотирьох царів Табалу 837 р. до н. е.; Тіглатпаласар III скинув його царя Вассурме й поставив на його місце простолюдина Хуллі; Саргон II видав свою доньку за Амбариса Табальського, а потім, у 713 році, забрав його в Ассирію. Ієрогліфічні лувійські написи цих царів збереглися на скелях Каппадокії. Греки пізніше знали тібаренів на чорноморському узбережжі, в тій самій сатрапії, що й мосхи, а Йосиф Флавій зробив тобелітів іберійцями Кавказу."
    - "Єзекіїль називає «Яван, Тубал й Мешех» серед купців Тіру, які «міняли товари твої за душі людські (раби) й мідяний посуд», тобто рабів і бронзу, що Анатолія вивозила. У його видінні мертвих «Там лежить Мешех, Тубал із усією громадою своєю», воїни, що зійшли в яму. А в пророцтві проти Гога Тувал — половина його царства: «Гога в Магог-землї, проти князя Рошського, Мешехського й Тубалського». Ісая посилає тих, що вціліли, вістунами до далеких народів: «у Тубалу, Евану, й по далеких островах, що слави моєї не вбачали»; Синодальний переклад пише там ім’я як Тубал, а не звичне Фувал."
    - "Табал був захоплений кіммерійцями у VII ст. до н. е., пізніше потрапив під владу персів, і назва зникла. Цей край — центральна Туреччина, навколо Кайсері та Нігде, де лишаються пагорб Кюльтепе і скельні написи табальських царів."
  es:
    - "Tubal es un pueblo de Asia Menor, hijo de Jafet en la Tabla de las Naciones y compañero constante de Mesec en Ezequiel. Se identifica generalmente con el Tabal de los registros asirios, una tierra de pequeños reinos de lengua luvita en la meseta del centro-sur de Anatolia, en el antiguo país hitita en torno a las actuales Kayseri y Niğde, al norte del Tauro y de sus minas de plata. Salmanasar III recibió tributo de veinticuatro reyes de Tabal en 837 a. C.; Tiglat-pileser III depuso a su rey Wassurme y puso en su lugar a un plebeyo, Hulli; Sargón II casó a su hija con Ambaris de Tabal y luego, en 713, se lo llevó a Asiria. Inscripciones en jeroglífico luvita de estos reyes se conservan en las rocas de Capadocia. Los griegos conocieron más tarde a los tibarenos en la costa del Mar Negro, en la misma satrapía que los moscos, y Josefo hizo de los tobelitas los íberos del Cáucaso."
    - "Ezequiel nombra a «Grecia, Tubal, y Mesec» entre los mercaderes de Tiro que comerciaban «con hombres y con vasos de metal», los esclavos y el bronce que exportaba Anatolia. En su visión de los muertos, «Allí Mesech, y Tubal, y toda su multitud», guerreros descendidos a la fosa. Y en el oráculo contra Gog, Tubal es la mitad de su dominio: «Gog en tierra de Magog, príncipe de la cabecera de Mesech y Tubal». Isaías envía a sobrevivientes como mensajeros a naciones lejanas, «á Tubal y á Javán, á las islas apartadas que no oyeron de mí»; la Biblia sinodal escribe allí el nombre como Tubal en lugar de su habitual Fuval."
    - "Tabal fue invadida por los cimerios en el siglo VII a. C., más tarde pasó al dominio persa, y el nombre se extinguió. La región es el centro de Turquía, en torno a Kayseri y Niğde, donde subsisten el montículo de Kültepe y las inscripciones rupestres de los reyes de Tabal."
  pt:
    - "Tubal é um povo da Ásia Menor, filho de Jafé na tabela das nações e companheiro constante de Meseque em Ezequiel. É geralmente identificado com o Tabal dos registros assírios, uma terra de pequenos reinos de língua luvita no planalto do centro-sul da Anatólia, na antiga terra hitita em torno das atuais Kayseri e Niğde, ao norte do Tauro e de suas minas de prata. Salmaneser III recebeu tributo de vinte e quatro reis de Tabal em 837 a.C.; Tiglate-Pileser III depôs seu rei Wassurme e pôs em seu lugar um plebeu, Hulli; Sargão II casou sua filha com Ambaris de Tabal e depois, em 713, levou-o para a Assíria. Inscrições em luvita hieroglífico desses reis sobrevivem nas rochas da Capadócia. Os gregos conheceram depois os tibarenos na costa do Mar Negro, na mesma satrapia dos moscos, e Josefo fez dos tobelitas os ibéricos do Cáucaso."
    - "Ezequiel nomeia “Javã, Tubal e Meseque” entre os comerciantes de Tiro que “trocavam vidas humanas e utensílios de bronze”, os escravos e o bronze que a Anatólia exportava. Em sua visão dos mortos, “Lá estão Meseque, Tubal e toda a sua multidão”, guerreiros descidos à cova. E no oráculo contra Gogue, Tubal é metade de seu reino: “Gogue, da terra de Magogue, o príncipe de Rôs, Meseque e Tubal”. Isaías envia sobreviventes como mensageiros a nações distantes, “a Tubal e Javã, às ilhas distantes, que não ouviram da minha fama”; a Bíblia Sinodal escreve ali o nome como Tubal, e não como seu habitual Fuval."
    - "Tabal foi invadida pelos cimérios no século VII a.C., passou depois ao domínio persa, e o nome se extinguiu. A região é o centro da Turquia, em torno de Kayseri e Niğde, onde permanecem o monte de Kültepe e as inscrições rupestres dos reis tabalianos."
  de:
    - "Tubal ist ein Volk Kleinasiens, ein Sohn Jafets in der Völkertafel und bei Hesekiel ständiger Gefährte Meschechs. Es wird meist mit Tabal der assyrischen Quellen gleichgesetzt, einem Land kleiner luwischer Königreiche auf der Hochebene Süd-Zentralanatoliens, im alten Hethiterland um das heutige Kayseri und Niğde, nördlich des Taurus und seiner Silberminen. Salmanassar III. erhielt 837 v. Chr. Tribut von vierundzwanzig Königen von Tabal; Tiglat-Pileser III. setzte seinen König Wassurme ab und den Bürgerlichen Hulli ein; Sargon II. gab Ambaris von Tabal seine Tochter zur Frau und führte ihn 713 nach Assyrien fort. Hieroglyphenluwische Inschriften dieser Könige sind auf Felsen in Kappadokien erhalten. Die Griechen kannten später die Tibarener an der Schwarzmeerküste, in derselben Satrapie wie die Moscher, und Josephus machte die Thobeliter zu den Iberern des Kaukasus."
    - "Hesekiel nennt „Javan, Thubal und Mesech“ unter den Händlern von Tyrus, die „leibeigene Leute und Geräte von Erz auf deine Märkte gebracht“ haben, die Sklaven und die Bronze, die Anatolien ausführte. In seiner Vision der Toten „liegt Mesech und Thubal mit allem ihrem Haufen umher begraben“, gefallene Krieger in der Grube. Und im Spruch gegen Gog ist Tubal die Hälfte seines Reiches: „Gog, der im Lande Magog ist und der oberste Fürst in Mesech und Thubal“. Jesaja sendet Gerettete als Boten zu fernen Völkern, „gen Thubal und Javan und in die Ferne zu den Inseln, da man nichts von mir gehört hat“; die Synodalbibel schreibt den Namen dort Tubal statt des sonst üblichen Fuval."
    - "Tabal wurde im siebten Jahrhundert v. Chr. von den Kimmeriern überrannt, kam später unter persische Herrschaft, und der Name erlosch. Die Region ist das zentrale Anatolien um Kayseri und Niğde, wo der Hügel Kültepe und die Felsinschriften der tabalischen Könige erhalten sind."
  fr:
    - "Tubal est un peuple d’Asie Mineure, un fils de Japhet dans la table des nations et le compagnon constant de Méschec chez Ézéchiel. On l’identifie généralement au Tabal des annales assyriennes, pays de petits royaumes de langue louvite sur le plateau du centre-sud de l’Anatolie, dans l’ancien pays hittite autour de Kayseri et de Niğde, au nord du Taurus et de ses mines d’argent. Salmanasar III reçut le tribut de vingt-quatre rois de Tabal en 837 av. J.-C. ; Tiglath-Piléser III déposa son roi Wassurme et mit à sa place un roturier, Hulli ; Sargon II maria sa fille à Ambaris de Tabal puis, en 713, l’emmena en Assyrie. Leurs inscriptions en louvite hiéroglyphique subsistent sur les rochers de Cappadoce. Les Grecs connurent plus tard les Tibarènes sur la côte de la mer Noire, dans la même satrapie que les Moschoï, et Josèphe fit des Thobélites les Ibères du Caucase."
    - "Ézéchiel nomme « Javan, Tubal et Méschec » parmi les marchands de Tyr, qui « donnaient des esclaves et des ustensiles d’airain », les esclaves et le bronze qu’exportait l’Anatolie. Dans sa vision des morts, « là sont Méschec, Tubal, et toute leur multitude », des guerriers descendus dans la fosse. Et dans l’oracle contre Gog, Tubal est la moitié de son royaume : « Gog, au pays de Magog, … le prince de Rosch, de Méschec et de Tubal ». Ésaïe envoie des survivants comme messagers vers des nations lointaines, « à Tubal et à Javan, aux îles lointaines, qui jamais n’ont entendu parler de moi » ; la Bible synodale y écrit le nom Tubal plutôt que son habituel Fuval."
    - "Tabal fut submergé par les Cimmériens au VIIe siècle av. J.-C., passa plus tard sous domination perse, et le nom disparut. La région est la Turquie centrale, autour de Kayseri et de Niğde, où subsistent le tertre de Kültepe et les inscriptions rupestres des rois tabaléens."
  pl:
    - "Tubal to lud Azji Mniejszej, syn Jafeta w tablicy narodów i stały towarzysz Meszeka u Ezechiela. Utożsamia się go zwykle z Tabal ze źródeł asyryjskich, krajem małych królestw mówiących po luwijsku na płaskowyżu południowo-środkowej Anatolii, w dawnym kraju Hetytów wokół dzisiejszych Kayseri i Niğde, na północ od Taurusu i jego kopalń srebra. Salmanasar III otrzymał daninę od dwudziestu czterech królów Tabal w 837 roku p.n.e.; Tiglat-Pileser III złożył jego króla Wassurme i osadził na jego miejscu człowieka z gminu, Hulliego; Sargon II wydał swą córkę za Ambarisa z Tabal, a potem, w 713 roku, uprowadził go do Asyrii. Hieroglificzne inskrypcje luwijskie tych królów zachowały się na skałach Kapadocji. Grecy znali później Tybarenów na wybrzeżu Morza Czarnego, w tej samej satrapii co Moschowie, a Józef Flawiusz uznał Tobelitów za Iberów z Kaukazu."
    - "Ezechiel wymienia „Jawan, Tubal, i Mesech” wśród kupców Tyru, którzy „ludzi i naczynie miedziane dawali na zamianę tobie”, czyli niewolników i brąz, które eksportowała Anatolia. W jego widzeniu umarłych „Tam Mesech, Tubal i wszystka zgraja jego”, wojownicy zstąpili do dołu. A we wyroczni przeciw Gogowi Tubal jest połową jego państwa: „Gogowi w ziemi Magog, książęciu głównemu w Mesech i Tubal”. Izajasz posyła ocalałych jako posłańców do dalekich narodów, „do Tubala, i do Jawanu, na wyspy dalekie, które nic o mnie nie słyszały”; Biblia synodalna zapisuje tam imię jako Tubal, a nie zwykłe Fuwal."
    - "Tabal został zalany przez Kimmerów w VII wieku p.n.e., później przeszedł pod panowanie perskie, a nazwa wyszła z użycia. Region ten to środkowa Turcja, wokół Kayseri i Niğde, gdzie pozostają kopiec Kültepe i skalne inskrypcje królów Tabal."
  it:
    - "Tubal è un popolo dell’Asia Minore, figlio di Iafet nella tavola delle nazioni e compagno costante di Mesec in Ezechiele. È generalmente identificato con il Tabal dei documenti assiri, un paese di piccoli regni luvi sull’altopiano dell’Anatolia centro-meridionale, nell’antico paese ittita attorno alle odierne Kayseri e Niğde, a nord del Tauro e delle sue miniere d’argento. Salmanàssar III ricevette tributo da ventiquattro re di Tabal nell’837 a.C.; Tiglat-Pilèser III depose il suo re Wassurme e mise al suo posto un uomo comune, Hulli; Sargon II diede sua figlia in moglie ad Ambaris di Tabal e poi, nel 713, lo portò in Assiria. Iscrizioni in luvio geroglifico di questi re restano sulle rocce della Cappadocia. I Greci conobbero poi i Tibareni sulla costa del Mar Nero, nella stessa satrapia dei Mosci, e Giuseppe Flavio fece dei Tobeliti gli Iberi del Caucaso."
    - "Ezechiele nomina «Javan, Tubal e Mescec» fra i mercanti di Tiro che «dànno anime umane e utensili di rame», gli schiavi e il bronzo che l’Anatolia esportava. Nella sua visione dei morti «là è Mescec, Tubal e tutta la loro moltitudine», guerrieri scesi nella fossa. E nell’oracolo contro Gog, Tubal è metà del suo regno: «Gog del paese di Magog, principe sovrano di Mescec e di Tubal». Isaia manda dei superstiti come messaggeri a nazioni lontane, «a Tubal e a Javan, alle isole lontane che non han mai udito la mia fama»; la Bibbia sinodale scrive lì il nome Tubal invece del consueto Fuval."
    - "Tabal fu invasa dai Cimmeri nel VII secolo a.C., passò poi sotto il dominio persiano, e il nome si estinse. La regione è la Turchia centrale, attorno a Kayseri e Niğde, dove restano il tell di Kültepe e le iscrizioni rupestri dei re di Tabal."
  nl:
    - "Tubal is een volk van Klein-Azië, een zoon van Jafet in de Tafel der Volken en de vaste metgezel van Mesech bij Ezechiël. Het wordt algemeen vereenzelvigd met Tabal in de Assyrische bronnen, een land van kleine Luwische koninkrijken op het plateau van Midden-Anatolië, in het oude Hettitische land rond Kayseri en Niğde, ten noorden van de Taurus en zijn zilvermijnen. Salmaneser III ontving in 837 v.Chr. schatting van 24 koningen van Tabal; Tiglat-Pileser III zette hun koning Wassurme af en plaatste de burger Hulli in zijn plaats; Sargon II gaf zijn dochter aan Ambaris van Tabal en voerde hem in 713 naar Assyrië. Luwische hiërogliefenopschriften van deze koningen staan op de rotsen van Cappadocië. De Grieken kenden later de Tibarenen aan de Zwarte Zee, in dezelfde satrapie als de Moschi, en Flavius Josephus maakte van de Thobelieten de Iberiërs van de Kaukasus."
    - "Ezechiël noemt “Javan, Tubal en Mesech” onder de kooplieden van Tyrus, die handel dreven “met mensenzielen en koperen vaten”, de slaven en het brons die Anatolië uitvoerde. In zijn visioen van de doden “is Mesech, en Tubal, met haar ganse menigte”, krijgers die in de kuil zijn neergedaald. En in het godsspraakwoord tegen Gog is Tubal de helft van zijn rijk: “Gog, het land van Magog, den hoofdvorst van Mesech en Tubal”. Jesaja zendt overlevenden als boodschappers naar verre volken, “naar Tubal en Javan, tot de ver gelegen eilanden, die Mijn gerucht niet gehoord” hebben; de Synodale Bijbel schrijft de naam daar als Tubal in plaats van het gebruikelijke Fuval."
    - "Tabal werd in de zevende eeuw v.Chr. door de Cimmeriërs overrompeld, kwam later onder Perzische heerschappij, en de naam stierf uit. De streek is Centraal-Turkije, rond Kayseri en Niğde, waar de heuvel Kültepe en de rotsopschriften van de Tabalische koningen bewaard zijn."
  cs:
    - "Túbal je národ v Malé Asii, syn Jafetův v tabulce národů a stálý druh Meška v Ezechielovi. Je obecně ztotožňován s Tabalem asyrských záznamů, zemí malých luwijsky mluvících království na plošině jihostřední Anatolie, ve staré chetitské zemi kolem dnešního Kayseri a Niğde, severně od Tauru a jeho stříbrných dolů. Salmanasar III. přijal roku 837 př. n. l. tribut od čtyřiadvaceti králů Tabalu; Tiglatpilesar III. sesadil jeho krále Wassurmeho a dosadil místo něj prostého člověka Hulliho; Sargon II. provdal svou dceru za Ambarise z Tabalu a pak, roku 713, jej odvedl do Asýrie. Hieroglyfické luwijské nápisy těchto králů se dochovaly na skalách Kappadokie. Řekové později znali Tibareny na pobřeží Černého moře, ve stejné satrapii jako Moschové, a Josephus učinil z Thobelitů Ibery z Kavkazu."
    - "Ezechiel jmenuje „Javan, Tubal a Mešech“ mezi kupci Týru, kteří „lidi a nádobí měděné dávali za směnu tobě“, tedy otroky a bronz, které Anatolie vyvážela. Ve vidění mrtvých je „tam Mešech, Tubal i všecko množství jeho“, bojovníci, kteří sestoupili do jámy. A v proroctví proti Gogovi je Túbal polovinou jeho říše: „Gogovi, země Magog, knížeti a hlavě v Mešech a Tubal“. Izajáš posílá ty, kdo vyvázli, jako posly ke vzdáleným národům, „do Tubal a Javan, na ostrovy daleké, kteříž neslýchali pověsti o mně“; synodální překlad tam píše jméno Tubal, a ne obvyklé Fuval."
    - "Tabal byl v 7. stol. př. n. l. zaplaven Kimmerijci, později přešel pod perskou vládu a jméno zaniklo. Oblast je střední Turecko, kolem Kayseri a Niğde, kde zůstávají pahorek Kültepe a skalní nápisy tabalských králů."
  sv:
    - "Tubal är ett folk i Mindre Asien, en son till Jafet i Folkens tavla och Mesheks ständige följeslagare hos Hesekiel. Det identifieras allmänt med Tabal i de assyriska källorna, ett land med små luwiskspråkiga riken på platån i södra mellersta Anatolien, i det gamla hettitiska landet kring nutidens Kayseri och Niğde, norr om Taurus och dess silvergruvor. Salmanassar III tog emot tribut från tjugofyra kungar av Tabal år 837 f.Kr.; Tiglat-Pileser III avsatte dess kung Wassurme och satte en vanlig man, Hulli, i hans ställe; Sargon II gifte bort sin dotter med Ambaris av Tabal och förde honom sedan, år 713, bort till Assyrien. Hieroglyfluwiska inskrifter av dessa kungar finns kvar på klipporna i Kappadokien. Grekerna kände senare tibarenerna vid Svartahavskusten, i samma satrapi som moscherna, och Josefus gjorde thobeliterna till kaukasiska iberer."
    - "Hesekiel nämner ”Javan, Tubal och Mesek” bland Tyros' köpmän som ”drevo köpenskap med dig; trälar och kopparkärl gåvo de dig i utbyte”, de slavar och den brons som Anatolien exporterade. I hans syn av de döda ”ligger Mesek-Tubal med hela sin larmande hop”, krigare som gått ner i graven. Och i utsagan mot Gog är Tubal hälften av hans rike: ”Gog i Magogs land, mot hövdingen över Ros, Mesek och Tubal”. Jesaja sänder överlevande som budbärare till fjärran folk, ”till Tubal och Javan, till havsländerna i fjärran, som icke hava hört något om mig eller sett min härlighet”; den synodala bibeln skriver där namnet Tubal i stället för sitt vanliga Fuval."
    - "Tabal översvämmades av kimmerierna på 600-talet f.Kr., kom senare under persiskt välde, och namnet dog ut. Regionen är centrala Turkiet, kring Kayseri och Niğde, där kullen Kültepe och de tabaliska kungarnas klippinskrifter finns kvar."
  nb:
    - "Tubal er et folk i Lilleasia, en sønn av Jafet i folketavlen og Mesjeks stadige følgesvenn hos Esekiel. Det identifiseres vanligvis med Tabal i de assyriske kildene, et land med små luwisktalende kongedømmer på platået i sør-sentrale Anatolia, i det gamle hettittiske landet rundt dagens Kayseri og Niğde, nord for Taurus og sølvgruvene der. Salmanassar III mottok tributt fra tjuefire konger av Tabal i 837 f.Kr.; Tiglat-Pileser III avsatte kongen deres Wassurme og satte en alminnelig mann, Hulli, i hans sted; Sargon II giftet bort datteren sin med Ambaris av Tabal og førte ham så, i 713, bort til Assyria. Hieroglyfisk-luwiske innskrifter fra disse kongene er bevart på fjellene i Kappadokia. Grekerne kjente senere tibarenerne på Svartehavskysten, i samme satrapi som moskerne, og Josefus gjorde tobelittene til iberne i Kaukasus."
    - "Esekiel nevner Javan, Tubal og Mesek blant kjøpmennene i Tyros: «Javan, Tubal og Mesek var dine kremmere; med mennesker og kobberkar betalte de dine varer», slavene og bronsen Anatolia eksporterte. I synet hans av de døde «Der er Mesek-Tubal og hele hans larmende hop», krigere som er sunket ned i graven. Og i utsagnet mot Gog er Tubal halvparten av hans rike: «Gog i Magogs land, fyrsten over Ros, Mesek og Tubal». Jesaja sender overlevende som budbringere til fjerne folk, «til Tubal og Javan, til de fjerne kyster som ikke har hørt tidenden om mig»; synodalbibelen skriver navnet der som Tubal i stedet for sin vanlige Fuval."
    - "Tabal ble overrent av kimmerierne på 600-tallet f.Kr., kom senere under persisk styre, og navnet døde ut. Regionen er det sentrale Tyrkia, rundt Kayseri og Niğde, der haugen Kültepe og fjellinnskriftene til de tabalske kongene fortsatt finnes."
  tl:
    - "Ang Tubal ay bayan ng Asia Minor, anak ni Japhet sa talaan ng mga bansa at laging kasama ni Mesech sa Ezekiel. Karaniwan itong kinikilala sa Tabal ng talaang Asirio, lupain ng maliliit na kahariang nagsasalita ng Luwian sa talampas ng timog-gitnang Anatolia, sa dating lupain ng mga Heteo sa paligid ng Kayseri at Niğde, hilaga ng Taurus at ng mga minahan nitong pilak. Tumanggap si Salmanasar III ng buwis mula sa 24 na hari ng Tabal (837 BK); pinatalsik ni Tiglath-pileser III si Wassurme, pinalitan ng karaniwang tao, si Hulli; ipinakasal ni Sargon II ang anak kay Ambaris ng Tabal at dinala siya sa Asiria noong 713. Nananatili sa mga bato ng Capadocia ang inskripsiyong hieroglyphic na Luwian ng mga haring ito. Nakilala ng mga Griego ang Tibareni sa baybayin ng Dagat Itim, sa satrapiya ng mga Moschi, at ginawa ni Josefo na mga Iberian ng Caucasus ang mga Thobelita."
    - "Pinangangalanan ni Ezekiel ang “Javan, ang Tubal, at ang Mesec” sa mga mangangalakal ng Tiro na “kinakalakal ang mga tao at ang mga sisidlang tanso”, ang mga alipin at tanso na iniluluwas ng Anatolia. Sa pangitain niya ng mga patay, “Nandoon ang Mesech, ang Tubal, at ang buo niyang karamihan”, mga mandirigmang bumaba sa hukay. At sa orakulo laban kay Gog, kalahati ng kaharian nito ang Tubal: “sa dako ni Gog, sa lupain ng Magog, na prinsipe sa Ros, sa Mesech, at sa Tubal”. Isinusugo ni Isaias ang mga nakaligtas bilang mensahero sa malalayong bansa, “sa Tubal at Javan, sa mga pulong malayo na hindi nangakarinig ng aking kabantugan”; isinusulat doon ng Bibliyang Synodal ang pangalan na Tubal sa halip na ang karaniwang Fuval."
    - "Sinakop ng mga Cimmerio ang Tabal noong ika-7 siglo BK, pagkaraan ay napasailalim sa pamamahalang Persiyano, at naglaho ang pangalan. Ang rehiyon ay gitnang Turkey, sa paligid ng Kayseri at Niğde, kung saan nananatili ang burol ng Kültepe at ang mga inskripsiyon sa bato ng mga haring Tabalian."
  da:
    - "Tubal er et folk i Lilleasien, en søn af Jafet i folketavlen og Mesjeks stadige følgesvend hos Ezekiel. Det identificeres almindeligvis med Tabal i de assyriske optegnelser, et land af små luwisk-talende kongeriger på højsletten i det syd-centrale Anatolien, i det gamle hittitiske land omkring nutidens Kayseri og Niğde, nord for Taurus og dets sølvminer. Salmanassar 3. modtog tribut fra fireogtyve konger af Tabal i 837 f.Kr.; Tiglat-Pileser 3. afsatte dets konge Wassurme og satte en jævn mand, Hulli, i hans sted; Sargon 2. gav sin datter til Ambaris af Tabal og bortførte ham derefter, i 713, til Assyrien. Hieroglyf-luwiske indskrifter af disse konger er bevaret på Kappadokiens klipper. Grækerne kendte senere tibarenerne på Sortehavskysten, i samme satrapi som moskerne (Moschi), og Josephus gjorde tobelitterne til Kaukasus' iberere."
    - "Ezekiel nævner Tyrus' købmænd: »Javan, Tubal og Mesek, de vare dine Kræmmere; Menneskesjæle og Kobberkar gave de dig i Tusk«, slaver og bronze, som Anatolien udførte. I hans syn om de døde: »Der er Mesek, Tubal og al dets Hob«, krigere, der er sænket i graven. Og i spådommen mod Gog er Tubal halvdelen af hans rige: »Gog i Magogs Land, Fyrsten over Rosk, Mesek og Tubal«. Esajas sender overlevende som budbringere til fjerne folk, »til Thubal og Javan, til de langtfraliggende Øer, til dem, som ikke have hørt noget Rygte om mig«; Synodalbibelen skriver navnet dér som Tubal i stedet for sit sædvanlige Fuval."
    - "Tabal blev hærget af kimmerierne i 600-tallet f.Kr., kom senere under persisk styre, og navnet uddøde. Området er det centrale Tyrkiet omkring Kayseri og Niğde, hvor tellen Kültepe og de tabaliske kongers klippeindskrifter står tilbage."
  sr:
    - "Товел је народ Мале Азије, син Јафетов у табели народа и стални пратилац Месеха код Језекиља. Углавном се поистовећује с Табалом из асирских записа, земљом малих лувијски говорећих краљевстава на висоравни јужно-средишње Анадолије, у старој хетитској земљи око савремених Кајсерија и Нигдеа, северно од Тауруса и његових рудника сребра. Салманасар III примио је данак од двадесет четири цара Табала 837. п. н. е.; Теглат-Феласар III збацио је његовог цара Васурмеа и ставио на његово место простог човека, Хулија; Саргон II удао је своју кћер за Амбариса из Табала, а затим га 713. однео у Асирију. Хијероглифски лувијски натписи тих царева сачувани су на стенама Кападокије. Грци су касније знали Тибарене на обали Црног мора, у истој сатрапији као Мошхи, а Јосиф Флавије је од Товелита направио Иберце Кавказа."
    - "Језекиљ именује „Јаван, Тувал и Месех“ међу трговцима Тира који су трговали „с душама људским и судима бронзаним“, робљем и бронзом које је Анадолија извозила. У његовом виђењу мртвих „онде је Месех, Тувал и све мноштво његово“, ратници сишли у јаму. А у пророштву против Гога Товел је половина његове државе: „према Гогу у земљи Магогу, кнезу и глави у Месеху и Тувалу“. Исаија шаље преживеле као гласнике далеким народима, „у Тувал и у Јаван и на далека острва, која не чуше глас о мени нити видеше славу моју“; Руска синодална Библија ту пише име као Тубал, а не као уобичајено Фувал."
    - "Табал су у 7. веку п. н. е. прегазили Кимеријци, касније је прешао под персијску власт, а име је изумрло. Област је средишња Турска, око Кајсерија и Нигдеа, где остају хум Култепе и стенски натписи табалских царева."
