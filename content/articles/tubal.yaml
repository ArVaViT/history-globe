# Overview article (ADR 0007). Mainstream facts only; the identification with Tabal is the usual one.
id: tubal
place: aaaaead
title:
  en: "Tubal"
  ru: "Фувал"
  uk: "Тувал"
  es: "Tubal"
  pt: "Tubal"
  de: "Tubal"
