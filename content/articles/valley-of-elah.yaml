body:
  en:
    - "The valley of Elah, “the terebinth valley”, is the broad valley in the Judean lowland about 25 km south-west of Jerusalem through which a winter stream runs west from the hills toward the Philistine plain and Gath. Its Arabic name, Wadi es-Sant, is also a tree name: the acacia valley. The towns of the valley are those of the story: Socoh (Khirbet Shuweikeh) on its south side, Azekah (Tell Zakariya) on its north side to the west, Adullam a little south, and on the ridge above its north bank the fortified town of Khirbet Qeiyafa, excavated by Yosef Garfinkel in 2007–2013, which he dates to about 1000 BC and takes for the biblical Shaaraim; the dating and the name are debated. The road from Philistia up to Bethlehem and Hebron followed the valley, which is why armies met there."
    - "“Now the Philistines gathered together their armies to battle, and were gathered together at Shochoh, which belongeth to Judah, and pitched between Shochoh and Azekah, in Ephes-dammim. And Saul and the men of Israel were gathered together, and pitched by the valley of Elah”, the two camps on the hills on either side with the valley between. For forty days Goliath of Gath came out to challenge Israel. Jesse sent David from Bethlehem with bread and cheeses for his brothers, who “were in the valley of Elah, fighting with the Philistines”; David “chose him five smooth stones out of the brook” and killed the giant with his sling, and the Philistines fled by the way of Shaaraim to Gath and Ekron. The priest at Nob later kept Goliath's sword, “whom thou slewest in the valley of Elah”, wrapped in a cloth behind the ephod."
    - "The valley today lies in Israel, crossed by the road from Beit Shemesh to Beit Guvrin; the stream bed is dry most of the year, the floor is farmed, and Tel Azekah and Khirbet Qeiyafa are open to visitors."
  ru:
    - "Долина дуба, по-еврейски Эмек-ха-Эла, «долина теревинфа», — широкая долина в Иудейской низменности примерно в 25 км к юго-западу от Иерусалима, по которой зимний поток бежит с гор на запад к Филистимской равнине и Гефу. Арабское имя, Вади-эс-Сант, тоже связано с деревом: долина акаций. Города долины — те же, что в рассказе: Сохо (Хирбет-Шувейке) на южной стороне, Азека (Телль-Закария) на северной стороне, западнее, Одоллам чуть южнее, а на гребне над северным берегом — укреплённый город Хирбет-Кейафа, раскопанный Йосефом Гарфинкелем в 2007–2013 годах; он датирует его временем около 1000 г. до н. э. и считает библейским Шаараимом, но и дата, и имя оспариваются. По долине шла дорога из Филистии вверх к Вифлеему и Хеврону, оттого здесь и сходились войска."
    - "«Филистимляне собрали войска свои для войны и собрались в Сокхофе, что в Иудее, и расположились станом между Сокхофом и Азеком в Ефес-Даммиме. А Саул и Израильтяне собрались и расположились станом в долине дуба» — два стана на холмах по обе стороны, а долина между ними. Сорок дней Голиаф из Гефа выходил вызывать Израиль. Иессей послал Давида из Вифлеема с хлебом и сырами к братьям, которые «находились в долине дуба и готовились к сражению с Филистимлянами»; Давид «выбрал себе пять гладких камней из ручья» и убил великана из пращи, а филистимляне бежали дорогой к Шаараиму до Гефа и Екрона. Священник в Номве позже хранил меч Голиафа, «которого ты поразил в долине дуба», завёрнутый в одежду позади ефода."
    - "Долина сегодня лежит в Израиле, её пересекает дорога из Бейт-Шемеша в Бейт-Гуврин; русло сухо большую часть года, дно распахано, а Тель-Азека и Хирбет-Кейафа открыты для посетителей."
  uk:
    - "Долина дуба, староєврейською Ела, «долина теребінта», — широка долина в юдейській низовині приблизно за 25 км на південний захід від Єрусалима, якою зимовий потік тече на захід від пагорбів до філістимської рівнини й Гата. Її арабська назва, Вади-ес-Сант, теж пов’язана з деревом: акацієва долина. Міста долини — це міста розповіді: Сохо (Хірбет-Шувейка) на її південному боці, Азека (Телль-Закарія) на північному боці далі на захід, Одолам трохи південніше, а на гряді над її північним берегом — укріплене місто Хірбет-Кеяфа, розкопане Йосефом Гарфінкелем у 2007–2013 роках, яке він датує близько 1000 р. до н. е. і вважає біблійним Шаараїмом; датування й назва дискутуються. Дорога з Філістії вгору до Вифлеєма та Хеврона йшла долиною, тому армії там і зустрічалися."
    - "«Филистії зібрали своє військо до бою, та й зійшлись в Сохотї, що в Юдеї, та й отаборились під Ефес-Даммимом між Сохотом і Азеком. Саул же й Ізраїльське військо скупились й отаборились в долинї Теребінта», два табори на пагорбах по обидва боки з долиною між ними. Сорок днів Голіят із Гата виходив викликати Ізраїль. Єссей послав Давида з Вифлеєма з хлібом і сирами для його братів, що «стояли в Теребинтовій долинї, і ладились до бою з Филистіями»; Давид «знайшов собі пять гладеньких каменїв в потоцї» і вбив велетня пращею, а филистимляни втікали дорогою Шааримською до Гата й Екрона. Священик у Нобі згодом зберігав меч Голіята, «що ти вбив у Теребинтовій долинї», «обгорнутий одежею, позад ефода»."
    - "Нині долина лежить в Ізраїлі, перетята дорогою від Бейт-Шемеша до Бейт-Гуврін; русло потоку сухе більшу частину року, дно обробляють, а Тель-Азека й Хірбет-Кеяфа відкриті для відвідувачів."
  es:
    - "El valle de Ela, «el valle del terebinto», es el amplio valle de la llanura de Judea, a unos 25 km al suroeste de Jerusalén, por el que corre un arroyo invernal hacia el oeste, desde las colinas hacia la llanura filistea y Gat. Su nombre árabe, Wadi es-Sant, también es nombre de un árbol: el valle de la acacia. Las ciudades del valle son las de la historia: Soco (Khirbet Shuweikeh) en su lado sur, Azeca (Tell Zakariya) en su lado norte, hacia el oeste, Adulam un poco al sur, y en la cresta sobre su orilla norte la ciudad fortificada de Khirbet Qeiyafa, excavada por Yosef Garfinkel en 2007–2013, que él fecha hacia 1000 a. C. y toma por la bíblica Saaraim; la datación y el nombre se debaten. El camino de Filistea hacia Belén y Hebrón seguía el valle, por lo cual los ejércitos se encontraban allí."
    - "«Y los Filisteos juntaron sus ejércitos para la guerra, y congregáronse en Sochô, que es de Judá, y asentaron el campo entre Sochô y Azeca, en Ephes-dammim. Y también Saúl y los hombres de Israel se juntaron, y asentaron el campo en el valle del Alcornoque», los dos campamentos en las colinas de uno y otro lado con el valle entre ellos. Durante cuarenta días Goliat de Gat salió a desafiar a Israel. Isaí envió a David desde Belén con pan y quesos para sus hermanos, que «estaban en el valle del Alcornoque, peleando con los Filisteos»; David «escogióse cinco piedras lisas del arroyo» y mató al gigante con su honda, y los filisteos huyeron por el camino de Saaraim hasta Gat y Ecrón. El sacerdote de Nob guardó después la espada de Goliat, «que tú venciste en el valle del Alcornoque», envuelta en un velo detrás del efod."
    - "Hoy el valle se encuentra en Israel, cruzado por la carretera de Beit Shemesh a Beit Guvrin; el cauce del arroyo está seco la mayor parte del año, el fondo se cultiva, y Tel Azeca y Khirbet Qeiyafa están abiertos a los visitantes."
  pt:
    - "O vale de Elá, “o vale do terebinto”, é o amplo vale da planície de Judá, a cerca de 25 km a sudoeste de Jerusalém, por onde um riacho de inverno corre para oeste, das colinas para a planície filisteia e Gate. Seu nome árabe, Wadi es-Sant, também é nome de árvore: o vale da acácia. As cidades do vale são as da história: Socó (Khirbet Shuweikeh) em seu lado sul, Azeca (Tell Zakariya) no lado norte, a oeste, Adulão um pouco ao sul e, na serra acima de sua margem norte, a cidade fortificada de Khirbet Qeiyafa, escavada por Yosef Garfinkel em 2007–2013, que ele data de cerca de 1000 a.C. e toma pela Saaraim bíblica; a datação e o nome são debatidos. A estrada da Filístia a Belém e Hebrom seguia o vale, razão pela qual exércitos ali se encontravam."
    - "“Ora, os filisteus reuniram os seus exércitos para a guerra; juntaram-se em Socó, que pertence a Judá, e acamparam entre Socó e Azeca, em Efes-Damim. Saul e os homens de Israel se reuniram, acamparam no vale de Elá”, os dois campos nas colinas de cada lado, com o vale no meio. Por quarenta dias Golias de Gate saiu para desafiar Israel. Jessé enviou Davi de Belém com pão e queijos para seus irmãos, que “estavam no vale de Elá, lutando contra os filisteus”; Davi “escolheu cinco pedras lisas no riacho” e matou o gigante com sua funda, e os filisteus fugiram pelo caminho de Saaraim até Gate e Ecrom. O sacerdote de Nobe guardou mais tarde a espada de Golias, “a quem você matou no vale de Elá”, embrulhada num pano atrás do éfode."
    - "O vale hoje fica em Israel, cruzado pela estrada de Bete-Semes a Beit Guvrin; o leito do riacho está seco na maior parte do ano, o fundo é cultivado, e Tel Azeca e Khirbet Qeiyafa estão abertas a visitantes."
  de:
    - "Das Elatal, „das Terebinthental“, ist das breite Tal im judäischen Tiefland etwa 25 km südwestlich von Jerusalem, durch das ein Winterbach aus den Bergen nach Westen zur Philisterebene und nach Gat fließt. Sein arabischer Name, Wadi es-Sant, ist ebenfalls ein Baumname: das Akaziental. Die Städte des Tals sind die der Erzählung: Socho (Khirbet Shuweikeh) an seiner Südseite, Aseka (Tell Zakariya) an der Nordseite im Westen, Adullam ein Stück südlich und auf dem Höhenzug über seinem Nordufer die befestigte Stadt Khirbet Qeiyafa, von Yosef Garfinkel 2007–2013 ausgegraben, den er auf etwa 1000 v. Chr. datiert und für das biblische Schaaraim hält; Datierung und Name sind umstritten. Die Straße von Philistäa hinauf nach Bethlehem und Hebron folgte dem Tal, weshalb dort Heere aufeinandertrafen."
    - "„Die Philister sammelten ihre Heere zum Streit und kamen zusammen zu Socho in Juda und lagerten sich zwischen Socho und Aseka bei Ephes-Dammim. Aber Saul und die Männer Israels kamen zusammen und lagerten sich im Eichgrunde“, die beiden Lager auf den Hügeln beiderseits mit dem Tal dazwischen. Vierzig Tage lang trat Goliat von Gat vor, Israel herauszufordern. Isai sandte David aus Bethlehem mit Brot und Käse zu seinen Brüdern, die „im Eichgrunde waren und stritten wider die Philister“; David „erwählte fünf glatte Steine aus dem Bach“ und tötete den Riesen mit seiner Schleuder, und die Philister flohen auf dem Weg nach Schaaraim nach Gat und Ekron. Der Priester in Nob verwahrte später Goliats Schwert, „den du schlugst im Eichgrunde“, in einen Mantel gewickelt hinter dem Efod."
    - "Das Tal liegt heute in Israel, von der Straße von Bet Schemesch nach Bet Guvrin durchquert; das Bachbett ist die meiste Zeit des Jahres trocken, der Talboden wird bewirtschaftet, und Tel Aseka und Khirbet Qeiyafa sind für Besucher geöffnet."
  fr:
    - "La vallée d’Éla, « la vallée des térébinthes », est la large vallée de la plaine de Judée, à environ 25 km au sud-ouest de Jérusalem, où un cours d’eau d’hiver court vers l’ouest depuis les collines en direction de la plaine philistine et de Gath. Son nom arabe, Wadi es-Sant, est aussi un nom d’arbre : la vallée de l’acacia. Les villes de la vallée sont celles du récit : Soco (Khirbet Shuweikeh) sur son côté sud, Azéka (Tell Zakariya) sur son côté nord à l’ouest, Adullam un peu au sud, et, sur la crête au-dessus de sa rive nord, la ville fortifiée de Khirbet Qeiyafa, fouillée par Yosef Garfinkel en 2007-2013, qu’il date d’environ 1000 av. J.-C. et prend pour le Schaaraïm biblique ; la datation et le nom sont débattus. La route de la Philistie vers Bethléem et Hébron suivait la vallée, ce qui explique que les armées s’y soient rencontrées."
    - "« Les Philistins réunirent leurs armées pour faire la guerre, et ils se rassemblèrent à Soco, qui appartient à Juda ; ils campèrent entre Soco et Azéka, à Éphès-Dammim. Saül et les hommes d’Israël se rassemblèrent aussi ; ils campèrent dans la vallée des térébinthes », les deux camps sur les collines de part et d’autre, la vallée entre eux. Pendant quarante jours, Goliath de Gath sortit défier Israël. Isaï envoya David de Bethléem avec du pain et des fromages pour ses frères, qui étaient « dans la vallée des térébinthes, faisant la guerre aux Philistins » ; David « choisit dans le torrent cinq pierres polies » et tua le géant de sa fronde, et les Philistins fuirent par le chemin de Schaaraïm jusqu’à Gath et Ékron. Le prêtre de Nob garda plus tard l’épée de Goliath, « que tu as tué dans la vallée des térébinthes », enveloppée dans un drap derrière l’éphod."
    - "La vallée se trouve aujourd’hui en Israël, traversée par la route de Beit Shemesh à Beit Guvrin ; le lit du cours d’eau est à sec presque toute l’année, le fond est cultivé, et Tel Azéka et Khirbet Qeiyafa se visitent."
  pl:
    - "Dolina Ela, „dolina terebintu”, to szeroka dolina na nizinie judzkiej około 25 km na południowy zachód od Jerozolimy, którą zimowy strumień płynie na zachód od wzgórz ku równinie filistyńskiej i Gat. Jej arabska nazwa, Wadi es-Sant, też jest nazwą drzewa: dolina akacji. Miasta doliny to te z opowieści: Soko (Chirbet Szuwejka) po jej południowej stronie, Azeka (Tell Zakarija) po północnej stronie na zachodzie, Adullam nieco na południe, a na grzbiecie nad jej północnym brzegiem warowne miasto Chirbet Kajafa, badane przez Josefa Garfinkela w latach 2007–2013, które on datuje na około 1000 rok p.n.e. i uważa za biblijne Szaaraim; datowanie i nazwa są sporne. Droga z Filistei w górę do Betlejem i Hebronu biegła doliną, dlatego spotykały się tam armie."
    - "„Tedy zebrali Filistynowie wojska swe, aby walczyli, a zeszli się u Sochot, które jest w Judzie, i położyli się obozem między Sochotem i między Asekiem na granicach Domim. A Saul i mężowie Izraelscy zebrali się, i położyli się obozem w dolinie Ela”, oba obozy na wzgórzach po obu stronach z doliną pośrodku. Przez czterdzieści dni Goliat z Gat wychodził, by wyzywać Izraela. Jesse posłał Dawida z Betlejem z chlebem i serami dla jego braci, którzy „leżeli w dolinie Ela, walcząc przeciwko Filistynom”; Dawid „obrał sobie pięć gładkich kamieni z potoku” i zabił olbrzyma procą, a Filistyni uciekali drogą przez Szaaraim do Gat i Ekronu. Kapłan w Nob przechowywał później miecz Goliata, „któregoś zabił w dolinie Ela”, zawinięty w sukno za efodem."
    - "Dolina leży dziś w Izraelu, przecięta drogą z Bet Szemesz do Bet Guwrin; koryto strumienia jest suche przez większość roku, dno jest uprawiane, a Tel Azeka i Chirbet Kajafa są dostępne dla zwiedzających."
  it:
    - "La valle di Ela, «valle del terebinto», è l’ampia valle della bassa Giudea, circa 25 km a sud-ovest di Gerusalemme, attraversata da un torrente invernale che corre a ovest dalle colline verso la pianura filistea e Gat. Il suo nome arabo, Wadi es-Sant, è anch’esso un nome d’albero: la valle dell’acacia. Le città della valle sono quelle del racconto: Soco (Khirbet Shuweikeh) sul suo lato meridionale, Azeka (Tell Zakariya) sul lato settentrionale a ovest, Adullam un po’ a sud, e sul crinale sopra la sponda nord la città fortificata di Khirbet Qeiyafa, scavata da Yosef Garfinkel nel 2007–2013, che egli data verso il 1000 a.C. e ritiene la biblica Saaraim; datazione e nome sono discussi. La strada dalla Filistea verso Betlemme ed Ebron seguiva la valle, ed è per questo che vi si scontravano gli eserciti."
    - "«Or i Filistei misero insieme i loro eserciti per combattere, si radunarono a Soco, che appartiene a Giuda, e si accamparono fra Soco e Azeka, a Efes-Dammim. Saul e gli uomini d’Israele si radunarono anch’essi, si accamparono nella valle dei terebinti», i due campi sulle colline dai lati opposti con la valle in mezzo. Per quaranta giorni Golia di Gat uscì a sfidare Israele. Iesse mandò Davide da Betlemme con pane e formaggi per i fratelli, che «sono nella valle dei terebinti a combattere contro i Filistei»; Davide «si scelse nel torrente cinque pietre ben lisce» e uccise il gigante con la fionda, e i Filistei fuggirono per la via di Saaraim fino a Gat ed Ekron. Il sacerdote di Nob custodì poi la spada di Golia, «che tu uccidesti nella valle de’ terebinti», involta in un panno dietro all’efod."
    - "La valle si trova oggi in Israele, attraversata dalla strada da Beit Shemesh a Beit Guvrin; il letto del torrente è asciutto per la maggior parte dell’anno, il fondo è coltivato, e Tel Azeka e Khirbet Qeiyafa sono aperti ai visitatori."
  nl:
    - "Het dal van Ela, “het terebintendal”, is het brede dal in de Judese laagvlakte ongeveer 25 km ten zuidwesten van Jeruzalem waardoor een winterbeek vanuit de heuvels naar het westen stroomt, naar de Filistijnse vlakte en Gat. De Arabische naam, Wadi es-Sant, is eveneens een boomnaam: het acaciadal. De steden van het dal zijn die van het verhaal: Socho (Khirbet Shuweikeh) aan de zuidzijde, Azeka (Tell Zakariya) aan de noordzijde in het westen, Adullam iets zuidelijker, en op de bergrug boven de noordoever de versterkte stad Khirbet Qeiyafa, in 2007–2013 opgegraven door Yosef Garfinkel, die haar dateert omstreeks 1000 v.Chr. en voor het Bijbelse Saäraïm houdt; de datering en de naam worden betwist. De weg van Filistea omhoog naar Bethlehem en Hebron volgde het dal, en daarom ontmoetten legers elkaar daar."
    - "“En de Filistijnen verzamelden hun heir ten strijde, en verzamelden zich te Socho, dat in Juda is; en zij legerden zich tussen Socho en tussen Azeka, aan het einde van Dammim. Doch Saul en de mannen van Israel verzamelden zich, en legerden zich in het eikendal”, de twee legerplaatsen op de heuvels aan weerszijden met het dal ertussen. Veertig dagen lang kwam Goliat van Gat naar buiten om Israël uit te dagen. Isaï zond David uit Bethlehem met brood en kazen naar zijn broers, die “waren bij het eikendal met de Filistijnen strijdende”; David “koos zich vijf gladde stenen uit de beek” en doodde de reus met zijn slinger, en de Filistijnen vluchtten via de weg van Saäraïm naar Gat en Ekron. De priester van Nob bewaarde later het zwaard van Goliat, “denwelken gij sloegt in het eikendal”, gewonden in een kleed achter de efod."
    - "Het dal ligt tegenwoordig in Israël, doorkruist door de weg van Beit Shemesh naar Beit Guvrin; het beekbed is het grootste deel van het jaar droog, de bodem wordt bebouwd, en Tel Azeka en Khirbet Qeiyafa zijn voor bezoekers geopend."
  cs:
    - "Élské údolí, „údolí terebintu“, je široké údolí v judské nížině asi 25 km jihozápadně od Jeruzaléma, jímž protéká zimní potok na západ z kopců k pelištejské pláni a ke Gatu. Jeho arabské jméno, Wádí es-Sant, je rovněž jménem stromu: údolí akácií. Města údolí jsou ta z příběhu: Sókó (Chirbet Šuwejke) na jeho jižní straně, Azeka (Tell Zakarija) na severní straně na západě, Adulam kousek na jih a na hřebeni nad jeho severním břehem opevněné město Chirbet Qejafa, vykopávané Josefem Garfinkelem v letech 2007–2013, které on datuje kolem roku 1000 př. n. l. a pokládá za biblické Šaarajim; datování i jméno jsou sporné. Silnice z Pelištie nahoru do Betléma a Hebronu vedla údolím, a proto se tam setkávala vojska."
    - "„I sebrali Filistinští vojska svá k boji, a shromáždili se u Socho, kteréž jest Judovo, a položili se mezi Socho a Azeka na pomezí Dammim. Ale Saul a muži Izraelští sebravše se, položili se v údolí Elah“, oba tábory na kopcích po obou stranách s údolím mezi nimi. Po čtyřicet dní vycházel Goliáš z Gatu a vyzýval Izrael. Jišaj poslal Davida z Betléma s chlebem a sýry bratrům, kteří „byli v údolí Elah, bojujíce proti Filistinským“; David „vybral sobě pět kamenů hladkých z potoku“ a obra zabil prakem a Pelištejci utíkali cestou k Šaarajimu do Gatu a Ekronu. Kněz v Nobu později uchovával Goliášův meč, „kteréhož jsi zabil v údolí Elah“, zabalený v plátně za efodem."
    - "Údolí dnes leží v Izraeli, protínané silnicí z Bejt Šemeš do Bejt Guvrin; koryto potoka je většinu roku suché, dno se obdělává a Tel Azeka a Chirbet Qejafa jsou přístupné návštěvníkům."
  sv:
    - "Terebintdalen, på hebreiska Elas dal, ”terebintens dal”, är den breda dalen i Judeens lågland omkring 25 km sydväst om Jerusalem genom vilken en vinterbäck rinner västerut från bergen mot filisteernas slätt och Gat. Dess arabiska namn, Wadi es-Sant, är också ett trädnamn: akaciadalen. Dalens städer är berättelsens: Soko (Khirbet Shuweikeh) på dess södra sida, Aseka (Tell Zakariya) på dess norra sida i väster, Adullam något söderut, och på åsen ovanför dess norra strand den befästa staden Khirbet Qeiyafa, utgrävd av Yosef Garfinkel 2007–2013, som han daterar till omkring 1000 f.Kr. och tar för bibelns Shaarajim; dateringen och namnet är omdebatterade. Vägen från Filisteen upp till Betlehem och Hebron följde dalen, vilket är skälet till att härar möttes där."
    - "”Men filistéerna församlade sina härar till strid; de församlade sig vid det Soko som hör till Juda. Och de lägrade sig mellan Soko och Aseka, vid Efes-Dammim. Saul och Israels män hade ock församlat sig och lägrat sig i Terebintdalen”, de två lägren på bergen på var sin sida med dalen emellan. I fyrtio dagar kom Goljat från Gat ut för att utmana Israel. Isai sände David från Betlehem med bröd och ostar till hans bröder, som ”äro … i Terebintdalen och strida mot filistéerna”; David ”valde ut åt sig fem släta stenar ur bäcken” och dödade jätten med sin slunga, och filisteerna flydde på vägen till Shaarajim, till Gat och Ekron. Prästen i Nob förvarade senare Goljats svärd, ”honom som du slog ned i Terebintdalen”, inlindat i ett kläde bakom efoden."
    - "Dalen ligger i dag i Israel, genomkorsad av vägen från Beit Shemesh till Beit Guvrin; bäckbädden är torr större delen av året, dalbottnen odlas, och Tel Aseka och Khirbet Qeiyafa är öppna för besökare."
  nb:
    - "Ela-dalen, «terebintdalen», er den brede dalen i Judeas lavland omkring 25 km sørvest for Jerusalem som en vinterbekk renner gjennom vestover fra åsene mot filistersletten og Gat. Det arabiske navnet, Wadi es-Sant, er også et trenavn: akasiedalen. Byene i dalen er de fra fortellingen: Soko (Khirbet Shuweikeh) på sørsiden, Aseka (Tell Zakariya) på nordsiden mot vest, Adullam litt sør, og på åsryggen over nordbredden den befestede byen Khirbet Qeiyafa, utgravd av Yosef Garfinkel i 2007–2013, som han daterer til omkring 1000 f.Kr. og tar for bibelens Sjaarajim; dateringen og navnet er omdiskutert. Veien fra Filistea opp til Betlehem og Hebron fulgte dalen, og derfor møttes hærene der."
    - "«Filistrene samlet sine hærer til strid og kom sammen i Soko, som hører til Juda; og de slo leir mellem Soko og Aseka ved Efes-Dammim. Og Saul og Israels menn samlet sig og; de leiret sig i Terebintedalen», de to leirene på åsene på hver side med dalen imellom. I førti dager kom Goliat fra Gat ut for å utfordre Israel. Isai sendte David fra Betlehem med brød og oster til brødrene hans, om hvem det heter at «Saul er med dem og alle Israels menn i Terebinte-dalen og strider med filistrene»; David «søkte sig ut fem glatte stener i bekken» og drepte kjempen med slyngen sin, og filistrene flyktet på veien mot Sjaarajim til Gat og Ekron. Presten i Nob hadde senere Goliats sverd, «han som du slo ihjel i Terebinte-dalen», innsvøpt i et klede bak livkjortelen."
    - "Dalen ligger i dag i Israel, krysset av veien fra Beit Shemesh til Beit Guvrin; elveleiet er tørt det meste av året, bunnen dyrkes, og Tel Aseka og Khirbet Qeiyafa er åpne for besøkende."
  tl:
    - "Ang libis ng Ela, “ang libis ng terebinto”, ay malawak na libis sa mababang lupain ng Judea mga 25 km sa timog-kanluran ng Jerusalem, na dinadaanan ng batis ng taglamig pakanluran mula sa mga burol patungo sa kapatagan ng mga Filisteo at Gath. Ang pangalan nitong Arabe, Wadi es-Sant, ay pangalan din ng puno: ang libis ng akasya. Ang mga bayan ng libis ay yaong sa kuwento: Socho (Khirbet Shuweikeh) sa timog na panig, Azeca (Tell Zakariya) sa hilagang panig sa kanluran, Adullam nang kaunti sa timog, at sa tagaytay sa itaas ng hilagang pampang nito ang bayang may kuta na Khirbet Qeiyafa, hinukay ni Yosef Garfinkel noong 2007–2013, na pinepetsahan niya sa mga 1000 BK at itinuturing na Saaraim ng Biblia; pinagtatalunan ang petsa at pangalan. Sinundan ng daan mula Filistia paakyat sa Bethlehem at Hebron ang libis, kaya doon nagtagpo ang mga hukbo."
    - "“Ngayo'y pinisan ng mga Filisteo ang kanilang hukbo upang bumaka at sila'y nagpipisan sa Socho, na nauukol sa Juda, at nagsihantong sa pagitan ng Socho at ng Azeca, sa Ephesdammim. At nagpipisan si Saul at ang mga lalake ng Israel, at nagsihantong sa libis ng Ela”, ang dalawang kampamento sa mga burol sa magkabilang panig, may libis sa pagitan. Apatnapung araw na hinamon ng Gath na si Goliath ang Israel. Isinugo ni Isai si David mula sa Bethlehem na may tinapay at keso para sa kaniyang mga kapatid, na “nasa libis ng Ela, na nakikipaglaban sa mga Filisteo”; “pumili siya ng limang makinis na bato mula sa batis” at pinatay ni David ang higante gamit ang panghilagpos, at tumakas ang mga Filisteo sa daan ng Saaraim patungong Gath at Ecron. Kalaunan, iningatan ng saserdote sa Nob ang tabak ni Goliath, “na iyong pinatay sa libis ng Ela”, nabibilot sa kayo sa likod ng epod."
    - "Ang libis ngayon ay nasa Israel, tinatawid ng daan mula Beit Shemesh patungong Beit Guvrin; tuyo ang sapa sa halos buong taon, sinasaka ang sahig, at bukás sa mga bisita ang Tel Azeca at Khirbet Qeiyafa."
  da:
    - "Terebintedalen, »terebintdalen«, er den brede dal i Judæas lavland omkring 25 km sydvest for Jerusalem, gennem hvilken en vinterbæk løber mod vest fra bjergene mod filisterslettet og Gat. Dens arabiske navn, Wadi es-Sant, er også et træ-navn: akaciedalen. Dalens byer er historiens byer: Soko (Khirbet Shuweikeh) på dens sydside, Azeka (Tell Zakariya) på dens nordside mod vest, Adullam lidt mod syd, og på højdedraget over dens nordbred den befæstede by Khirbet Qeiyafa, udgravet af Yosef Garfinkel i 2007–2013, som han dater til omkring 1000 f.Kr. og tager for det bibelske Sja'arajim; dateringen og navnet er omdiskuteret. Vejen fra Filistæa op til Betlehem og Hebron fulgte dalen, hvorfor hære mødtes dér."
    - "»Og Filisterne havde samlet deres Lejre til Krigen og samlede sig i Soko, som er i Juda; og de lejrede sig imellem Soko og imellem Aseka ved Efes-Dammim. Og Saul og Israels Mænd samledes og lejrede sig i Egens Dal«, de to lejre på bjergene på hver side med dalen imellem. I fyrre dage kom Goliat fra Gat ud for at udfordre Israel. Isaj sendte David fra Betlehem med brød og oste til hans brødre, der »vare i Egens Dal for at stride imod Filisterne«; David »udvalgte sig fem glatte Stene af Bækken« og dræbte kæmpen med sin slynge, og filistrene flygtede ad vejen til Sja'arajim til Gat og Ekron. Præsten i Nob opbevarede senere Goliats sværd, »som du slog i Egens Dal«, svøbt i et klæde bag efoden."
    - "I dag ligger dalen i Israel, krydset af vejen fra Beit Shemesh til Beit Guvrin; bækkens leje er tørt det meste af året, bunden dyrkes, og Tel Azeka og Khirbet Qeiyafa er åbne for besøgende."
