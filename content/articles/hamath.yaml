body:
  en:
    - "Hamath is the city of Hama in western Syria, on the river Orontes. Its great mound, the old citadel, was excavated by a Danish expedition in the 1930s under Harald Ingholt, which found settlement reaching back to prehistoric times. In the Iron Age Hamath was the capital of a kingdom in central Syria. Its ninth-century kings left inscriptions in Luwian hieroglyphs, and a later king, Zakkur, king of Hamath and Lu'ash, wrote in Aramaic on a stele of how Bar-Hadad son of Hazael and his allies besieged him at Hazrak, early in the eighth century BC."
    - 'In 2 Samuel, Toi, king of Hamath, sent his son Joram with gifts to David after David had defeated Hadadezer, and 2 Chronicles says that Solomon built store cities in Hamath. In 853 BC Irhuleni of Hamath and Adad-idri of Damascus led the coalition, Ahab of Israel among them, that met Shalmaneser III at Qarqar, a royal city of Hamath. 2 Kings says that Jeroboam II recovered Hamath for Israel, and Amos calls it "Hamath the great". In the 730s BC Eni-il of Hamath paid tribute to Tiglath-pileser III.'
    - 'In 720 BC Ilu-bi''di of Hamath stirred up Arpad, Simirra, Damascus and Samaria against Assyria. Sargon II defeated him at Qarqar, flayed him and took chariots and horsemen of Hamath into his own army. 2 Kings tells how the king of Assyria settled men of Hamath in the cities of Samaria, and how the Rabshakeh asked the people of Jerusalem, "Where are the gods of Hamath, and of Arpad?" Riblah, in the land of Hamath, later served as the camp of conquerors: there Pharaoh Necho put Jehoahaz in bonds, and there Nebuchadnezzar judged Zedekiah. In 605 BC, the Babylonian Chronicle says, Nebuchadnezzar''s troops overtook the Egyptians fleeing from Carchemish in the district of Hamath and conquered the whole area.'
    - "Under the Seleucid kings the city was renamed Epiphania, usually taken to honour Antiochus IV Epiphanes; Josephus notes that its people still called it Amathe. Early in the fourth century Eusebius suggested that the Hamath of Isaiah and Amos was perhaps Epiphania near Emesa. It remained a city of Roman and Byzantine Syria, and after the Arab conquest in the seventh century its old name, Hama, came back into use."
  ru:
    - "Емаф — это город Хама в западной Сирии, на реке Оронт. Его большой холм, старую цитадель, раскапывала датская экспедиция в 1930-х годах под руководством Харальда Ингхольта, нашедшая следы поселения, восходящие к доисторическим временам. В железном веке Емаф был столицей царства в средней Сирии. Его цари IX века оставили надписи лувийскими иероглифами, а более поздний царь Заккур, царь Емафа и Луаша, рассказал на арамейской стеле, как Бар-Хадад, сын Азаила, со своими союзниками осаждал его в Хазраке в начале VIII века до н. э."
    - "Во Второй книге Царств Фой, царь Емафа, послал своего сына Иорама с дарами к Давиду, после того как Давид разбил Адраазара, а Вторая книга Паралипоменон говорит, что Соломон построил города для запасов в Емафе. В 853 г. до н. э. Ирхулени Емафский и Адад-идри Дамасский возглавили союз царей, в котором был и Ахав Израильский, выступивший против Салманассара III при Каркаре, царском городе Емафа. Четвёртая книга Царств говорит, что Иеровоам II возвратил Израилю Емаф, а Амос называет его «Емаф великий». В 730-х гг. до н. э. Ени-ил Емафский платил дань Феглафелласару III."
    - "В 720 г. до н. э. Илу-бииди Емафский поднял против Ассирии Арпад, Симирру, Дамаск и Самарию. Саргон II разбил его при Каркаре, содрал с него кожу и взял колесницы и всадников Емафа в своё войско. Четвёртая книга Царств рассказывает, как царь Ассирийский поселил людей из Емафа в городах Самарийских и как Рабсак спрашивал жителей Иерусалима: «Где боги Емафа и Арпада?» Ривла в земле Емафской позже служила станом завоевателей: там фараон Нехао задержал Иоахаза, и там Навуходоносор произнёс суд над Седекией. В 605 г. до н. э., по Вавилонской хронике, войска Навуходоносора настигли бежавших от Кархемиса египтян в области Емафа и покорили весь этот край."
    - "При Селевкидах город переименовали в Епифанию, как обычно считают, в честь Антиоха IV Епифана; Иосиф Флавий замечает, что жители по-прежнему называли его Амафой. В начале IV века Евсевий предположил, что Емаф у Исаии и Амоса — это, возможно, Епифания близ Емесы. Город оставался в составе римской и византийской Сирии, а после арабского завоевания в VII веке вновь вошло в употребление его древнее имя — Хама."
  uk:
    - "Хамат — це місто Хама в західній Сирії на річці Оронт. Його велике городище, давня цитадель, розкопувала данська експедиція в 1930-х роках під керівництвом Харальда Інгхольта, що виявила поселення, яке сягає доісторичних часів. За залізного віку Хамат був столицею царства в центральній Сирії. Його царі IX ст. залишили написи лувійськими ієрогліфами, а пізніший цар Закір, цар Хамату й Луаша, написав арамейською на стелі про те, як Бар-Гадад, син Азаїла, і його союзники облягали його в Хадраху на початку VIII ст. до н. е."
    - "У Другій книзі Самуїла Фой, цар Хамату, послав сина Йорама з дарами до Давида після того, як Давид розбив Адраазара, а Друга книга Хронік каже, що Соломон збудував у Хаматі міста про запаси. 853 р. до н. е. Ірхулені з Хамату й Адад-ідрі з Дамаска очолили коаліцію, до якої входив Ахав Ізраїльський, що зустріла Салманассара III при Каркарі, царському місті Хамату. Друга книга Царів каже, що Єровоам II повернув Хамат Ізраїлеві, а Амос називає його «Емат Великий». У 730-х роках до н. е. Ені-іл з Хамату сплачував данину Тіглатпаласару III."
    - "720 р. до н. е. Ілубі’ді з Хамату підняв Арпад, Сіміру, Дамаск і Самарію проти Ассирії. Саргон II розбив його при Каркарі, здер із нього шкіру і взяв колісниці й вершників Хамату до власного війська. Друга книга Царів розповідає, як цар Ассирії оселив людей Хамату в містах Самарії, і як Рабсак запитав жителів Єрусалима: «Де боги Ематові й Арпадові?» Рівла, в землі Хамату, пізніше правила за табір завойовників: там фараон Нехо ув’язнив Йоахаза, і там Навуходоносор судив Седекію. 605 р. до н. е., за Вавилонською хронікою, війська Навуходоносора наздогнали єгиптян, що тікали від Каркемиша в окрузі Хамату, і підкорили всю область."
    - "За селевкідських царів місто перейменували на Епіфанію, що зазвичай розуміють як честь Антіоха IV Епіфана; Йосиф Флавій зазначає, що його мешканці все ще називали його Амате. На початку IV ст. Євсевій припустив, що Хамат Ісаї й Амоса був, можливо, Епіфанією поблизу Емеси. Воно лишалося містом римської й візантійської Сирії, а після арабського завоювання в VII ст. його давня назва, Хама, знову ввійшла у вжиток."
  es:
    - "Hamat es la ciudad de Hama, en el oeste de Siria, a orillas del río Orontes. Su gran montículo, la antigua ciudadela, fue excavado por una expedición danesa en los años treinta bajo Harald Ingholt, que halló un poblamiento que se remonta a la prehistoria. En la Edad del Hierro Hamat fue la capital de un reino del centro de Siria. Sus reyes del siglo IX dejaron inscripciones en jeroglíficos luvitas, y un rey posterior, Zakkur, rey de Hamat y Lu'ash, escribió en arameo, en una estela, cómo Bar-Hadad, hijo de Hazael, y sus aliados lo sitiaron en Hazrak a comienzos del siglo VIII a. C."
    - "En 2 Samuel, Toi, rey de Hamat, envió a su hijo Joram con regalos a David después de que este derrotara a Hadad-ezer, y 2 Crónicas dice que Salomón edificó ciudades de provisiones en Hamat. En el 853 a. C. Irhuleni de Hamat y Adad-idri de Damasco encabezaron la coalición, con Acab de Israel entre ellos, que se enfrentó a Salmanasar III en Qarqar, una ciudad real de Hamat. 2 Reyes dice que Jeroboam II recobró Hamat para Israel, y Amós la llama «la gran Hamath». En la década del 730 a. C. Eni-il de Hamat pagó tributo a Tiglat-pileser III."
    - "En el 720 a. C. Ilu-bi'di de Hamat sublevó a Arfad, Simirra, Damasco y Samaria contra Asiria. Sargón II lo derrotó en Qarqar, lo desolló e incorporó a su propio ejército carros y jinetes de Hamat. 2 Reyes cuenta cómo el rey de Asiria estableció a hombres de Hamat en las ciudades de Samaria, y cómo el Rabsaces preguntó al pueblo de Jerusalén: «¿Dónde está el dios de Hamath, y de Arphad?». Ribla, en la tierra de Hamat, sirvió después como campamento de conquistadores: allí el faraón Necao puso en prisión a Joacaz, y allí Nabucodonosor juzgó a Sedequías. En el 605 a. C., dice la Crónica babilónica, las tropas de Nabucodonosor alcanzaron a los egipcios que huían de Carquemis en el distrito de Hamat y conquistaron toda la región."
    - "Bajo los reyes seléucidas la ciudad fue rebautizada Epifanía, nombre que suele entenderse en honor de Antíoco IV Epífanes; Josefo anota que su gente aún la llamaba Amathe. A comienzos del siglo IV Eusebio sugirió que la Hamat de Isaías y Amós era quizá Epifanía, cerca de Émesa. Siguió siendo una ciudad de la Siria romana y bizantina, y tras la conquista árabe del siglo VII volvió a usarse su antiguo nombre, Hama."
  pt:
    - "Hamate é a cidade de Hama, no oeste da Síria, no rio Orontes. Seu grande monte, a antiga cidadela, foi escavado por uma expedição dinamarquesa na década de 1930 sob Harald Ingholt, que achou ocupação remontando à pré-história. Na Idade do Ferro, Hamate foi a capital de um reino na Síria central. Seus reis do século IX deixaram inscrições em hieróglifos luvitas, e um rei posterior, Zakur, rei de Hamate e Lu’ash, escreveu em aramaico numa estela como Bar-Hadade, filho de Hazael, e seus aliados o sitiaram em Hazrak, no início do século VIII a.C."
    - "Em 2 Samuel, Toi, rei de Hamate, enviou seu filho Jorão com presentes a Davi depois que Davi derrotou Hadadezer, e 2 Crônicas diz que Salomão construiu cidades-armazém em Hamate. Em 853 a.C., Irhuleni de Hamate e Adad-idri de Damasco lideraram a coalizão, com Acabe de Israel entre eles, que enfrentou Salmaneser III em Qarqar, cidade real de Hamate. Segundo Reis, Jeroboão II recuperou Hamate para Israel, e Amós a chama de “grande Hamate”. Na década de 730 a.C., Eni-il de Hamate pagou tributo a Tiglate-Pileser III."
    - "Em 720 a.C., Ilu-bi’di de Hamate incitou Arpade, Simirra, Damasco e Samaria contra a Assíria. Sargão II o derrotou em Qarqar, esfolou-o e incorporou ao próprio exército carros e cavaleiros de Hamate. Segundo 2 Reis, o rei da Assíria estabeleceu homens de Hamate nas cidades de Samaria, e o Rabsaqué perguntou ao povo de Jerusalém: “Onde estão os deuses de Hamate e de Arpade?” Ribla, na terra de Hamate, serviu mais tarde de acampamento de conquistadores: ali o faraó Neco pôs Jeoacaz a ferros, e ali Nabucodonosor julgou Zedequias. Em 605 a.C., diz a Crônica Babilônica, as tropas de Nabucodonosor alcançaram os egípcios que fugiam de Carquemis no distrito de Hamate e conquistaram toda a área."
    - "Sob os reis selêucidas a cidade foi renomeada Epifânia, usualmente tomado como homenagem a Antíoco IV Epifânio; Josefo nota que seu povo ainda a chamava Amate. No início do século IV, Eusébio sugeriu que a Hamate de Isaías e Amós era talvez Epifânia, perto de Emesa. Continuou sendo uma cidade da Síria romana e bizantina, e depois da conquista árabe no século VII o seu antigo nome, Hama, voltou ao uso."
  de:
    - "Hamat ist die Stadt Hama im westlichen Syrien am Orontes. Ihr großer Hügel, die alte Zitadelle, wurde in den 1930er Jahren von einer dänischen Expedition unter Harald Ingholt ausgegraben, die eine bis in die Vorgeschichte zurückreichende Besiedlung fand. In der Eisenzeit war Hamat die Hauptstadt eines Königreichs in Mittelsyrien. Seine Könige des 9. Jahrhunderts hinterließen Inschriften in luwischen Hieroglyphen, und ein späterer König, Zakkur, König von Hamat und Luasch, schrieb auf einer Stele auf Aramäisch, wie Bar-Hadad, der Sohn Hasaëls, und seine Verbündeten ihn zu Beginn des 8. Jahrhunderts v. Chr. in Hazrak belagerten."
    - "Im zweiten Samuelbuch schickte Toi, „der König zu Hamath“, seinen Sohn Joram mit Geschenken zu David, nachdem David Hadadeser geschlagen hatte, und die Chronik sagt, dass Salomo in Hamat Kornstädte baute. 853 v. Chr. führten Irhuleni von Hamat und Adad-idri von Damaskus die Koalition an, der auch Ahab von Israel angehörte und die bei Qarqar, einer Königsstadt Hamats, auf Salmanassar III. traf. Das zweite Königsbuch sagt, dass Jerobeam II. Hamat für Israel zurückgewann, und Amos nennt es „Hamath, die große Stadt“. In den 730er Jahren v. Chr. zahlte Eni-il von Hamat Tiglat-Pileser III. Tribut."
    - "720 v. Chr. stiftete Ilu-bi'di von Hamat Arpad, Simirra, Damaskus und Samaria gegen Assyrien auf. Sargon II. besiegte ihn bei Qarqar, ließ ihn häuten und nahm Wagen und Reiter Hamats in sein eigenes Heer. Das zweite Königsbuch erzählt, wie der König von Assyrien Männer aus Hamat in den Städten Samarias ansiedelte und wie der Rabsake die Leute Jerusalems fragte: „Wo sind die Götter zu Hamath und Arpad?“ Ribla im Land Hamat diente später als Lager der Eroberer: Dort legte Pharao Necho Joahas in Fesseln, und dort richtete Nebukadnezar Zedekia. Im Jahr 605 v. Chr. holten nach der Babylonischen Chronik Nebukadnezars Truppen die vor Karkemisch fliehenden Ägypter im Gebiet von Hamat ein und eroberten das ganze Gebiet."
    - "Unter den seleukidischen Königen wurde die Stadt in Epiphania umbenannt, meist als Ehrung für Antiochos IV. Epiphanes verstanden; Josephus bemerkt, dass ihre Bewohner sie noch Amathe nannten. Im frühen 4. Jahrhundert vermutete Eusebius, das Hamat bei Jesaja und Amos sei vielleicht Epiphania bei Emesa. Sie blieb eine Stadt des römischen und byzantinischen Syrien, und nach der arabischen Eroberung im 7. Jahrhundert kam ihr alter Name Hama wieder in Gebrauch."
  fr:
    - "Hamath est la ville de Hama, dans l’ouest de la Syrie, sur l’Oronte. Son grand tertre, l’ancienne citadelle, fut fouillé par une expédition danoise dans les années 1930 sous Harald Ingholt, qui y trouva un peuplement remontant à la préhistoire. À l’âge du Fer, Hamath fut la capitale d’un royaume du centre de la Syrie. Ses rois du IXe siècle laissèrent des inscriptions en hiéroglyphes louvites, et un roi plus tardif, Zakkour, roi de Hamath et de Lu’ash, écrivit en araméen sur une stèle comment Bar-Hadad, fils de Hazaël, et ses alliés l’assiégèrent à Hazrak, au début du VIIIe siècle av. J.-C."
    - "Dans 2 Samuel, Thoï, roi de Hamath, envoya son fils Joram avec des présents à David après la défaite d’Hadadézer, et 2 Chroniques dit que Salomon bâtit des villes-magasins en Hamath. En 853 av. J.-C., Irhuleni de Hamath et Adad-idri de Damas conduisirent la coalition, où se trouvait Achab d’Israël, qui affronta Salmanasar III à Qarqar, ville royale de Hamath. Les Rois disent que Jéroboam II fit rentrer Hamath sous la puissance d’Israël, et Amos l’appelle « Hamath la grande ». Dans les années 730 av. J.-C., Eni-il de Hamath paya tribut à Tiglath-Piléser III."
    - "En 720 av. J.-C., Ilu-bi’di de Hamath souleva Arpad, Simirra, Damas et Samarie contre l’Assyrie. Sargon II le battit à Qarqar, l’écorcha et incorpora à sa propre armée des chars et des cavaliers de Hamath. Les Rois racontent comment le roi d’Assyrie établit des gens de Hamath dans les villes de Samarie, et comment le Rabschaké demanda au peuple de Jérusalem : « Où sont les dieux de Hamath et d’Arpad ? » Ribla, au pays de Hamath, servit plus tard de camp aux conquérants : là Pharaon Néco enchaîna Joachaz, et là Nebucadnetsar jugea Sédécias. En 605 av. J.-C., dit la Chronique babylonienne, les troupes de Nebucadnetsar rattrapèrent les Égyptiens fuyant Carkemisch dans le district de Hamath et conquirent toute la région."
    - "Sous les rois séleucides, la ville fut rebaptisée Épiphanie, d’ordinaire pour honorer Antiochus IV Épiphane ; Josèphe note que ses habitants l’appelaient encore Amathé. Au début du IVe siècle, Eusèbe suggéra que le Hamath d’Ésaïe et d’Amos était peut-être Épiphanie près d’Émèse. Elle resta une ville de la Syrie romaine et byzantine, et après la conquête arabe du VIIe siècle son ancien nom, Hama, reprit cours."
  pl:
    - "Chamat to miasto Hama w zachodniej Syrii nad rzeką Orontes. Jego wielki pagórek, dawną cytadelę, badała w latach trzydziestych duńska ekspedycja pod kierunkiem Haralda Ingholta, która odkryła osadnictwo sięgające czasów prehistorycznych. W epoce żelaza Chamat było stolicą królestwa w środkowej Syrii. Jego królowie z IX w. zostawili napisy hieroglifami luwijskimi, a późniejszy król, Zakkur, król Chamat i Lu'asz, opisał po aramejsku na steli, jak Bar-Hadad, syn Chazaela, i jego sprzymierzeńcy oblegali go w Chazrak na początku VIII w. p.n.e."
    - "W Drugiej Księdze Samuela Toi, król Chamat, posłał swego syna Jorama z darami do Dawida po pokonaniu przez niego Hadadezera, a Druga Księga Kronik mówi, że Salomon zbudował miasta składowe w Chamat. W 853 r. p.n.e. Irchuleni z Chamat i Adad-idri z Damaszku poprowadzili koalicję, wśród niej Achaba izraelskiego, która spotkała Salmanasara III pod Karkar, królewskim miastem Chamat. Druga Księga Królewska mówi, że Jeroboam II odzyskał Chamat dla Izraela, a Amos mówi o nim: „idźcie z onąd do Emat wielkiego”. W latach 730. p.n.e. Eni-il z Chamat płacił daninę Tiglat-Pileserowi III."
    - "W 720 r. p.n.e. Ilu-bi'di z Chamat podburzył przeciw Asyrii Arpad, Simirrę, Damaszek i Samarię. Sargon II pokonał go pod Karkar, kazał go odrzeć ze skóry i wcielił do własnego wojska rydwany i jazdę z Chamat. Druga Księga Królewska opowiada, jak król Asyrii osiedlił ludzi z Chamat w miastach Samarii i jak Rabszake pytał mieszkańców Jerozolimy: „Gdzież jest bóg Emat i Arfad?”. Ribla, w ziemi Chamat, służyła później jako obóz zdobywców: tam faraon Neko zakuł Joachaza w kajdany, a tam Nabuchodonozor sądził Sedekiasza. W 605 r. p.n.e., jak mówi Kronika babilońska, wojska Nabuchodonozora dogoniły Egipcjan uciekających z Karkemisz w okręgu Chamat i podbiły cały obszar."
    - "Za królów Seleucydów miasto przemianowano na Epiphania, zwykle w hołdzie Antiochowi IV Epifanesowi; Józef Flawiusz zauważa, że jego mieszkańcy nadal nazywali je Amathe. Na początku IV w. Euzebiusz sugerował, że Chamat z Izajasza i Amosa to może Epiphania koło Emesy. Pozostało miastem rzymskiej i bizantyńskiej Syrii, a po arabskim podboju w VII w. wróciła do użytku jego dawna nazwa, Hama."
  it:
    - "Camat è la città di Hama nella Siria occidentale, sul fiume Oronte. Il suo grande tell, l’antica cittadella, fu scavato negli anni Trenta da una spedizione danese sotto Harald Ingholt, che trovò un insediamento risalente alla preistoria. Nell’età del Ferro Camat fu la capitale di un regno della Siria centrale. I suoi re del IX secolo lasciarono iscrizioni in geroglifici luvi, e un re posteriore, Zakkur, re di Camat e Lu’ash, scrisse in aramaico su una stele come Bar-Adad figlio di Cazaèl e i suoi alleati lo assediarono a Hazrak, all’inizio dell’VIII secolo a.C."
    - "In 2 Samuele, Toi, re di Camat, mandò suo figlio Ioram con doni a Davide dopo che Davide ebbe sconfitto Adadezer, e 2 Cronache dice che Salomone costruì città di rifornimento in Camat. Nell’853 a.C. Irhuleni di Camat e Adad-idri di Damasco guidarono la coalizione, con Acab d’Israele fra loro, che incontrò Salmanàssar III a Qarqar, città regia di Camat. 2 Re dice che Geroboamo II riconquistò Camat a Israele, e Amos la chiama «Hamath la grande». Negli anni 730 a.C. Eni-il di Camat pagò tributo a Tiglat-Pilèser III."
    - "Nel 720 a.C. Ilu-bi’di di Camat sollevò Arpad, Simirra, Damasco e Samaria contro l’Assiria. Sargon II lo sconfisse a Qarqar, lo fece scuoiare e incorporò nel proprio esercito carri e cavalieri di Camat. 2 Re racconta come il re d’Assiria stabilì uomini di Camat nelle città di Samaria, e come il Rabsache chiese al popolo di Gerusalemme: «Dove sono gli dèi di Hamath e d’Arpad?» Ribla, nel paese di Camat, servì poi da accampamento dei conquistatori: là il faraone Neco mise in catene Ioacaz, e là Nabucodonosor giudicò Sedecia. Nel 605 a.C., dice la Cronaca babilonese, le truppe di Nabucodonosor raggiunsero gli Egiziani in fuga da Carchemis nel distretto di Camat e conquistarono l’intera zona."
    - "Sotto i re seleucidi la città fu ribattezzata Epifania, di solito intesa in onore di Antioco IV Epifane; Giuseppe Flavio nota che la sua gente la chiamava ancora Amathe. All’inizio del IV secolo Eusebio suggerì che la Camat di Isaia e di Amos fosse forse Epifania presso Emesa. Restò una città della Siria romana e bizantina, e dopo la conquista araba del VII secolo il suo antico nome, Hama, tornò in uso."
  nl:
    - "Hamat is de stad Hama in West-Syrië, aan de Orontes. De grote heuvel, de oude citadel, werd in de jaren dertig opgegraven door een Deense expeditie onder Harald Ingholt, die bewoning vond tot in de prehistorie. In de IJzertijd was Hamat de hoofdstad van een koninkrijk in Midden-Syrië. Zijn koningen uit de 9e eeuw lieten opschriften na in Luwische hiërogliefen, en een latere koning, Zakkur, koning van Hamat en Lu’ash, schreef in het Aramees op een stele hoe Bar-Hadad, zoon van Hazaël, en zijn bondgenoten hem bij Hazrak belegerden, in het begin van de 8e eeuw v.Chr."
    - "In 2 Samuël stuurde Toï, koning van Hamat, zijn zoon Joram met geschenken naar David nadat David Hadadezer had verslagen, en 2 Kronieken zegt dat Salomo schatsteden bouwde in Hamat. In 853 v.Chr. leidden Irhuleni van Hamat en Adad-idri van Damascus de coalitie, waarvan Achab van Israël deel uitmaakte, die Salmaneser III ontmoette bij Qarqar, een koninklijke stad van Hamat. 2 Koningen zegt dat Jerobeam II Hamat voor Israël heroverde, en Amos noemt het “Hamath, de grote stad”. In de jaren 730 v.Chr. betaalde Eni-il van Hamat schatting aan Tiglat-Pileser III."
    - "In 720 v.Chr. hitste Ilu-bi’di van Hamat Arpad, Simirra, Damascus en Samaria op tegen Assyrië. Sargon II versloeg hem bij Qarqar, vilde hem en nam strijdwagens en ruiters van Hamat op in zijn eigen leger. 2 Koningen vertelt hoe de koning van Assyrië mannen van Hamat vestigde in de steden van Samaria, en hoe de Rabsake de bevolking van Jeruzalem vroeg: “Waar zijn de goden van Hamath, en van Arpad?” Ribla, in het land van Hamat, diende later als kamp van veroveraars: daar liet farao Necho Joachaz boeien, en daar velde Nebukadnessar het oordeel over Zedekia. In 605 v.Chr., zegt de Babylonische Kroniek, achterhaalden Nebukadnessars troepen de Egyptenaren die uit Karkemis vluchtten in het district Hamat en veroverden het hele gebied."
    - "Onder de Seleucidische koningen werd de stad herdoopt tot Epiphania, gewoonlijk opgevat als eerbetoon aan Antiochus IV Epifanes; Josephus merkt op dat de bevolking haar nog Amathe noemde. In het begin van de 4e eeuw opperde Eusebius dat het Hamat van Jesaja en Amos misschien het Epiphania bij Emesa was. Zij bleef een stad van Romeins en Byzantijns Syrië, en na de Arabische verovering in de 7e eeuw kwam haar oude naam, Hama, weer in gebruik."
  cs:
    - "Chamat je město Hamá v západní Sýrii na řece Orontu. Jeho velký pahorek, stará citadela, byl vykopáván dánskou expedicí ve 30. letech 20. století pod vedením Haralda Ingholta, která nalezla osídlení sahající do pravěku. V době železné byl Chamat hlavním městem království ve střední Sýrii. Jeho králové z 9. století zanechali nápisy luwijskými hieroglyfy a pozdější král Zakúr, král Chamatu a Lu'ašu, napsal aramejsky na stéle, jak jej Bar-Hadad, syn Chazaelův, a jeho spojenci oblehli v Chazraku, na počátku 8. stol. př. n. l."
    - "Ve Druhé knize Samuelově poslal Toú, král Chamatu, svého syna Jorama s dary k Davidovi poté, co David porazil Hadadezera, a Druhá kniha Letopisů praví, že Šalomoun vystavěl v Chamatu města skladů. Roku 853 př. n. l. vedli Irchuleni z Chamatu a Adad-idri z Damašku koalici, v níž byl i Achab Izraelský, která se u Karkaru, královského města Chamatu, střetla se Salmanasarem III. Druhá kniha Královská praví, že Jarobeám II. získal Chamat zpět pro Izrael, a Amos jej nazývá „Emat veliké“. Ve 30. letech 8. stol. př. n. l. platil Eni-il z Chamatu tribut Tiglatpilesarovi III."
    - "Roku 720 př. n. l. pobouřil Ilu-bi'di z Chamatu proti Asýrii Arpad, Simirru, Damašek a Samaří. Sargon II. jej porazil u Karkaru, stáhl z něj kůži a vzal vozy a jezdce Chamatu do vlastního vojska. Druhá kniha Královská vypráví, jak král asyrský usadil muže z Chamatu ve městech Samaří a jak se Rab-šake ptal lidu Jeruzaléma: „Kdež jsou bohové Emat a Arfad?“ Ribla v zemi Chamat později sloužila jako tábor dobyvatelů: tam dal faraon Nekó Joachaza do pout a tam Nebukadnesar soudil Sidkijáše. Roku 605 př. n. l., praví Babylónská kronika, Nebukadnesarovi vojáci dostihli Egypťany prchající z Karkemíše v oblasti Chamatu a dobyli celé oblasti."
    - "Za seleukovských králů bylo město přejmenováno na Epifanii, obvykle na počest Antiocha IV. Epifana; Josephus poznamenává, že jeho obyvatelé mu stále říkali Amathe. Na počátku 4. století Eusebios navrhl, že Chamat z Izajáše a Amose byla snad Epifania u Emesy. Zůstalo městem římské a byzantské Sýrie a po arabském dobytí v 7. století se vrátilo staré jméno Hamá."
  sv:
    - "Hamat är staden Hama i västra Syrien, vid floden Orontes. Dess stora kulle, den gamla citadellen, grävdes ut av en dansk expedition på 1930-talet under Harald Ingholt, som fann bosättning som går tillbaka till förhistorisk tid. Under järnåldern var Hamat huvudstad i ett kungarike i centrala Syrien. Dess kungar på 800-talet f.Kr. lämnade inskrifter i luwiska hieroglyfer, och en senare kung, Zakkur, kung av Hamat och Lu'ash, skrev på arameiska på en stele hur Bar-Hadad, son till Hasael, och hans allierade belägrade honom i Hazrak, tidigt på 700-talet f.Kr."
    - "I Andra Samuelsboken sände Toi, kung av Hamat, sin son Joram med gåvor till David efter att David besegrat Hadadeser, och Andra Krönikeboken säger att Salomo byggde förrådsstäder i Hamat. År 853 f.Kr. ledde Irhuleni av Hamat och Adad-idri av Damaskus koalitionen, Achav av Israel bland dem, som mötte Salmanassar III vid Qarqar, en kunglig stad i Hamat. Andra Kungaboken säger att Jerobeam II återvann Hamat åt Israel, och Amos kallar det ”Stora Hamat”. På 730-talet f.Kr. betalade Eni-il av Hamat tribut till Tiglat-Pileser III."
    - "År 720 f.Kr. uppviglade Ilu-bi'di av Hamat Arpad, Simirra, Damaskus och Samaria mot Assyrien. Sargon II besegrade honom vid Qarqar, flådde honom och tog Hamats stridsvagnar och ryttare in i sin egen armé. Andra Kungaboken berättar hur Assyriens kung bosatte män från Hamat i Samarias städer, och hur Rab-Shake frågade Jerusalems folk: ”Var äro Hamats och Arpads gudar?” Rivla, i Hamats land, tjänade senare som erövrares läger: där satte farao Neko Joachas i bojor, och där dömde Nebukadnessar Sidkia. År 605 f.Kr. fick Nebukadnessars trupper, enligt den babyloniska krönikan, fatt på egyptierna som flydde från Karkemish i Hamats distrikt och erövrade hela området."
    - "Under de seleukidiska kungarna döptes staden om till Epifania, vanligen förstått som en hyllning till Antiochos IV Epifanes; Josefus noterar att dess folk fortfarande kallade den Amathe. Tidigt på 300-talet föreslog Eusebios att Hamat hos Jesaja och Amos kanske var Epifania nära Emesa. Den förblev en stad i romerska och bysantinska Syrien, och efter den arabiska erövringen på 600-talet kom dess gamla namn, Hama, åter i bruk."
