# Overview article (ADR 0007). Mainstream facts only; Assyrian and Babylonian dates follow the standard eponym and chronicle reckoning.
id: hamath
place: ac62cbc
title:
  en: "Hamath"
  ru: "Емаф"
  uk: "Хамат"
  es: "Hamat"
  pt: "Hamate"
  de: "Hamat"
