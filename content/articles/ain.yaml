body:
  en:
    - "Ain, “spring”, is the name of a small town in the Negeb of Judah, known only from lists. Joshua counts “Ain, and Rimmon” at the end of the southern towns of Judah, gives “Ain, Remmon, and Ether, and Ashan” to Simeon, whose lot lay inside Judah's, and Chronicles repeats the Simeonite villages as Etam, Ain, Rimmon, Tochen and Ashan. Since Nehemiah's list of resettled towns has a single En-rimmon, most scholars read Ain and Rimmon as one place, “Spring of Rimmon”, and the first site on the map is the same as En-rimmon, usually sought at Tel Halif by Kibbutz Lahav, or at Khirbet Umm er-Ramamin beside it, some 15 km north of Beersheba."
    - "The Levitical list in Joshua gives “Ain” where Chronicles has Ashan, so a second view makes Ain and Ashan the same; Horbat Anim in the hills south of Hebron, which keeps a like name, is a third and distant guess. Another Ain, on the northern border by the Sea of Galilee, is a different place. The Bible tells no story of Ain."
    - "Tel Halif has been dug since 1976 by the Lahav Research Project, which found a walled town of the Early Bronze Age, a Late Bronze and Iron Age settlement destroyed about 701 BC, and Persian and Roman remains; whether it is Rimmon, Ziklag or another town is still argued, and nothing from the ground names Ain. Kibbutz Lahav and its forest now stand beside the mound at the northern edge of the Negev."
  ru:
    - "Аин, «источник», — имя маленького города в Негеве Иудином, известного только по спискам. Книга Иисуса Навина называет «Аин и Риммон» в конце южных городов Иуды, отдаёт «Аин, Риммон, Ефер и Ашан» Симеону, чей удел лежал внутри Иудина, а Паралипоменон повторяет сёла Симеона: Етам, Аин, Риммон, Фокен и Ашан. Поскольку в списке заново заселённых городов у Неемии стоит один Ен-Риммон, большинство учёных читают Аин и Риммон как одно место — «источник Риммона», и первое место на карте совпадает с Ен-Риммоном, который обычно ищут в Тель-Халифе у кибуца Лахав или в Хирбет-Умм-эр-Рамамин рядом с ним, примерно в 15 км к северу от Вирсавии."
    - "В списке левитских городов у Иисуса Навина стоит Аин там, где у Паралипоменона Ашан, так что по второму взгляду Аин и Ашан — одно; Хорват-Аним в горах к югу от Хеврона, хранящий похожее имя, — третья, далёкая догадка. Другой Аин, на северной границе у Галилейского моря, — иное место. Библия не рассказывает об Аине ничего."
    - "Тель-Халиф копает с 1976 года экспедиция Лахав: найдены обнесённый стеной город раннего бронзового века, поселение позднего бронзового и железного веков, разрушенное около 701 г. до н. э., и персидские и римские остатки; Риммон ли это, Секелаг или иной город, спорят до сих пор, и ничто из земли не называет Аина. Кибуц Лахав и его лес стоят теперь у холма на северном краю Негева."
  uk:
    - "Аїн, «джерело», — назва невеликого міста в Негеві Юди, відомого лише з переліків. Ісус Навин зараховує «Аин і Риммон» наприкінці південних міст Юди, дає «Анн, Риммон, Етер та Ашан» Симеонові, чий уділ лежав усередині Юдиного, а Хроніки повторюють симеонівські села як «Етам, Аїн, Риммон, Токен та Ашан». Оскільки в переліку Неемії поселених міст стоїть один Ен-Риммон, більшість учених читає Аїн і Риммон як одне місце, «Джерело Риммону», і перше місце на мапі збігається з Ен-Риммоном, який зазвичай шукають на Тель-Халіфі біля кібуца Лахав або в Хірбет-Умм-ер-Раманіні поряд, приблизно за 15 км на північ від Беер-Шеви."
    - "Левітський перелік у книзі Ісуса Навина має «Анн» там, де Хроніки мають Ашан, тож за другою думкою Аїн і Ашан — те саме; Хорбат-Анім у пагорбах на південь від Хеврону, що зберігає подібну назву, — третя й далека здогадка. Інший Аїн, на північному кордоні біля Галілейського моря, — інше місце. Біблія не розповідає про Аїн жодної історії."
    - "Тель-Халіф розкопує від 1976 року Лахавський дослідницький проєкт, який виявив муроване місто ранньої бронзової доби, поселення пізньої бронзової та залізної доби, зруйноване близько 701 р. до н. е., а також перські й римські рештки; чи це Риммон, Ціклаг або інше місто, досі сперечаються, і ніщо з землі не називає Аїн. Кібуц Лахав і його ліс стоять нині поряд із пагорбом на північному краю Негеву."
  es:
    - "Ain, «manantial», es el nombre de una pequeña ciudad del Néguev de Judá, conocida solo por listas. Josué cuenta «Aín, y Rimmón» al final de las ciudades meridionales de Judá, da «Aín, Rimmón, Eter, y Asán» a Simeón, cuyo lote estaba dentro del de Judá, y las Crónicas repiten las aldeas de Simeón como Etam, Ain, Rimón, Token y Asán. Como la lista de ciudades repobladas de Nehemías tiene un único En-rimón, la mayoría de los estudiosos leen Ain y Rimón como un solo lugar, «fuente de Rimón», y el primer sitio del mapa es el mismo que En-rimón, que suele buscarse en Tel Halif, junto al kibutz Lahav, o en Khirbet Umm er-Ramamin, a su lado, unos 15 km al norte de Beerseba."
    - "La lista levítica de Josué da «Ain» donde las Crónicas tienen Asán, por lo que una segunda opinión hace de Ain y Asán el mismo lugar; Horbat Anim, en las colinas al sur de Hebrón, que conserva un nombre parecido, es una tercera conjetura lejana. Otro Ain, en la frontera septentrional junto al mar de Galilea, es un lugar distinto. La Biblia no cuenta ninguna historia de Ain."
    - "Tel Halif se excava desde 1976 por el Lahav Research Project, que halló una ciudad amurallada de la Edad del Bronce Antiguo, un asentamiento del Bronce Final y de la edad del Hierro destruido hacia 701 a. C., y restos persas y romanos; se sigue discutiendo si es Rimón, Siclag u otra ciudad, y nada hallado en el terreno nombra Ain. El kibutz Lahav y su bosque se alzan hoy junto al montículo, en el borde septentrional del Néguev."
  pt:
    - "Aim, “fonte”, é o nome de uma pequena cidade no Neguebe de Judá, conhecida apenas por listas. Josué conta “Aim e Rimom” no fim das cidades meridionais de Judá, dá “Aim, Rimom, Eter e Asã” a Simeão, cujo lote ficava dentro do de Judá, e Crônicas repete as aldeias simeonitas como Etã, Aim, Rimom, Toquém e Asã. Como a lista de cidades repovoadas de Neemias tem um único En-Rimom, a maioria dos estudiosos lê Aim e Rimom como um só lugar, “Fonte de Rimom”, e o primeiro sítio do mapa é o mesmo que En-Rimom, geralmente procurado em Tel Halif, junto ao quibutz Lahav, ou em Khirbet Umm er-Ramamin, ao lado, cerca de 15 km ao norte de Berseba."
    - "A lista levítica em Josué traz “Aim” onde Crônicas tem Asã, de modo que uma segunda opinião faz de Aim e Asã o mesmo lugar; Horbat Anim, nas colinas ao sul de Hebrom, que guarda um nome semelhante, é uma terceira e distante conjetura. Outra Aim, na fronteira setentrional, junto ao mar da Galileia, é um lugar diferente. A Bíblia não conta nenhuma história de Aim."
    - "Tel Halif é escavado desde 1976 pelo Lahav Research Project, que encontrou uma cidade fortificada da Idade do Bronze Antigo, um povoado do Bronze Final e da Idade do Ferro destruído por volta de 701 a.C., e vestígios persas e romanos; se é Rimom, Ziclague ou outra cidade ainda se discute, e nada do solo nomeia Aim. O quibutz Lahav e a sua floresta estão agora ao lado do montículo, na borda setentrional do Neguev."
  de:
    - "Ajin, „Quelle“, ist der Name einer kleinen Stadt im Negev von Juda, nur aus Listen bekannt. Josua zählt „Ain, Rimmon“ am Ende der südlichen Städte Judas auf, gibt Simeon, dessen Los innerhalb Judas lag, „Ain, Rimmon, Ehter, Asan“, und die Chronik wiederholt die simeonitischen Dörfer als Etam, Ain, Rimmon, Tochen und Asan. Da Nehemias Liste der wiederbesiedelten Städte nur ein einziges En-Rimmon hat, lesen die meisten Gelehrten Ajin und Rimmon als einen Ort, „Quelle des Rimmon“, und die erste Stätte auf der Karte ist dieselbe wie En-Rimmon, gewöhnlich bei Tel Halif am Kibbuz Lahav gesucht oder bei Chirbet Umm er-Ramamin daneben, etwa 15 km nördlich von Beerscheba."
    - "Die Levitenliste bei Josua gibt „Ain“, wo die Chronik Asan hat, daher macht eine zweite Ansicht Ajin und Aschan zu demselben Ort; Horbat Anim in den Bergen südlich von Hebron, das einen ähnlichen Namen bewahrt, ist eine dritte, ferne Vermutung. Ein anderes Ajin an der Nordgrenze beim See Genezareth ist ein anderer Ort. Die Bibel erzählt keine Geschichte von Ajin."
    - "Tel Halif wird seit 1976 vom Lahav Research Project ausgegraben, das eine ummauerte Stadt der Frühbronzezeit, eine Siedlung der Spätbronze- und Eisenzeit, um 701 v. Chr. zerstört, sowie persische und römische Reste fand; ob es Rimmon, Ziklag oder eine andere Stadt ist, wird weiter diskutiert, und nichts aus dem Boden nennt Ajin. Der Kibbuz Lahav und sein Wald stehen heute neben dem Hügel am Nordrand des Negev."
  fr:
    - "Aïn, « source », est le nom d’une petite ville du Négev de Juda, connue seulement par des listes. Josué compte « Aïn, et Rimmon » à la fin des villes méridionales de Juda, donne « Aïn, Rimmon, Éther, et Aschan » à Siméon, dont le lot se trouvait à l’intérieur de celui de Juda, et les Chroniques redonnent les villages de Siméon : Étam, Aïn, Rimmon, Tochen et Aschan. Comme la liste de Néhémie sur les villes repeuplées n’a qu’un seul En-Rimmon, la plupart des savants lisent Aïn et Rimmon comme un seul lieu, « source de Rimmon », et le premier site de la carte est le même qu’En-Rimmon, d’ordinaire cherché à Tel Halif, près du kibboutz Lahav, ou à Khirbet Umm er-Ramamin, à côté, à quelque 15 km au nord de Beer-Schéba."
    - "La liste lévitique de Josué donne « Aïn » là où les Chroniques ont Aschan ; une seconde opinion tient donc Aïn et Aschan pour identiques ; Horbat Anim, dans les collines au sud d’Hébron, qui garde un nom voisin, est une troisième hypothèse, lointaine. Un autre Aïn, à la frontière nord, près de la mer de Galilée, est un autre lieu. La Bible ne raconte aucune histoire d’Aïn."
    - "Tel Halif est fouillé depuis 1976 par le Lahav Research Project, qui y a trouvé une ville fortifiée du Bronze ancien, un établissement du Bronze récent et de l’âge du Fer détruit vers 701 av. J.-C., et des vestiges perses et romains ; qu’il s’agisse de Rimmon, de Tsiklag ou d’une autre ville, on en débat encore, et rien dans le sol ne nomme Aïn. Le kibboutz Lahav et sa forêt se dressent aujourd’hui à côté du tertre, à la lisière nord du Néguev."
  it:
    - "Ain, «sorgente», è il nome di una piccola città del Negheb di Giuda, nota soltanto dagli elenchi. Giosuè conta «Ain, Rimmon» alla fine delle città meridionali di Giuda, dà «Ain, Rimmon, Ether e Ashan» a Simeone, il cui lotto era dentro quello di Giuda, e le Cronache ripetono i villaggi simeoniti come Etam, Ain, Rimmon, Token e Asan. Poiché l’elenco di Neemia delle città ripopolate ha un solo En-Rimmon, la maggior parte degli studiosi legge Ain e Rimmon come un unico luogo, «sorgente di Rimmon», e il primo sito sulla carta coincide con En-Rimmon, di solito cercata a Tel Halif presso il kibbutz Lahav, o a Khirbet Umm er-Ramamin accanto, a circa 15 km a nord di Bersabea."
    - "L’elenco levitico di Giosuè dà «Ain» dove le Cronache hanno Asan, così una seconda opinione fa di Ain e Asan lo stesso luogo; Horbat Anim sulle colline a sud di Ebron, che conserva un nome simile, è una terza e lontana ipotesi. Un altro Ain, sul confine settentrionale presso il Lago di Tiberiade, è un luogo diverso. La Bibbia non racconta alcuna storia di Ain."
    - "Tel Halif è scavato dal 1976 dal Lahav Research Project, che ha trovato una città murata dell’antica età del Bronzo, un insediamento del Bronzo Tardo e dell’età del Ferro distrutto intorno al 701 a.C., e resti persiani e romani; se sia Rimmon, Siclag o un’altra città è ancora discusso, e nulla dal terreno nomina Ain. Il kibbutz Lahav e la sua foresta sorgono ora accanto al tell, al margine settentrionale del Negheb."
  pl:
    - "Ain, „źródło”, to nazwa małego miasta w Negewie Judy, znanego tylko z wykazów. Jozue zalicza „Ain, i Remmon” na końcu południowych miast Judy, daje „Ain, Remmon, i Atar, i Asan” Symeonowi, którego los leżał wewnątrz losu Judy, a Księga Kronik powtarza wsie symeonitów jako Etam, Ain, Rimmon, Token i Aszan. Ponieważ wykaz miast zasiedlonych ponownie u Nehemiasza ma jedno En-Rimmon, większość uczonych czyta Ain i Rimmon jako jedno miejsce, „Źródło Rimmon”, a pierwsze miejsce na mapie jest tym samym co En-Rimmon, szukane zwykle w Tel Halif przy kibucu Lahav albo w sąsiednim Chirbet Umm er-Ramamin, około 15 km na północ od Beer-Szeby."
    - "Wykaz lewicki u Jozuego podaje „Ain” tam, gdzie Księga Kronik ma Aszan, więc drugi pogląd uznaje Ain i Aszan za jedno; Horbat Anim we wzgórzach na południe od Hebronu, zachowujące podobną nazwę, to trzeci i odległy domysł. Inny Ain, na północnej granicy nad Jeziorem Galilejskim, jest miejscem odmiennym. Biblia nie opowiada o Ain żadnej historii."
    - "Tel Halif jest wykopywany od 1976 roku przez Lahav Research Project, który odkrył obwarowane miasto z wczesnej epoki brązu, osadę z późnej epoki brązu i epoki żelaza zniszczoną około 701 r. p.n.e. oraz pozostałości perskie i rzymskie; czy to Rimmon, Siklag czy inne miasto, wciąż się spiera, a nic z ziemi nie podaje nazwy Ain. Kibuc Lahav i jego las stoją dziś obok tellu na północnym skraju Negewu."
  nl:
    - "Ain, “bron”, is de naam van een kleine stad in de Negev van Juda, alleen bekend uit lijsten. Jozua rekent “Ain, en Rimmon” tot het einde van de zuidelijke steden van Juda, geeft “Ain, Rimmon, en Ether, en Asan” aan Simeon, wiens lot binnen dat van Juda lag, en Kronieken herhaalt de Simeonitische dorpen als Etam, Ain, Rimmon, Tochen en Asan. Omdat Nehemia’s lijst van herbewoonde steden één En-Rimmon heeft, lezen de meeste geleerden Ain en Rimmon als één plaats, “Bron van Rimmon”, en de eerste plaats op de kaart is dezelfde als En-Rimmon, gewoonlijk gezocht bij Tel Halif bij kibboets Lahav, of bij Khirbet Umm er-Ramamin ernaast, zo’n 15 km ten noorden van Berseba."
    - "De levietenlijst in Jozua geeft “Ain” waar Kronieken Asan heeft, dus een tweede opvatting maakt Ain en Asan tot dezelfde plaats; Horbat Anim in de heuvels ten zuiden van Hebron, dat een gelijkluidende naam bewaart, is een derde en verre gissing. Een ander Ain, aan de noordgrens bij het Meer van Galilea, is een andere plaats. De Bijbel vertelt geen verhaal over Ain."
    - "Tel Halif wordt sinds 1976 opgegraven door het Lahav Research Project, dat een ommuurde stad uit de vroege bronstijd vond, een nederzetting uit de late bronstijd en ijzertijd die omstreeks 701 v.Chr. werd verwoest, en Perzische en Romeinse resten; of het Rimmon, Siklag of een andere stad is, wordt nog betwist, en niets uit de bodem noemt Ain. Kibboets Lahav en zijn bos staan nu naast de heuvel aan de noordrand van de Negev."
  cs:
    - "Ajin, „pramen“, je jméno malého města v judském Negevu, známého jen ze seznamů. Jozue počítá „Ain a Remmon“ na konci jižních měst Judy, dává „Ain, Remmon, též Eter a Asan“ Simeonovi, jehož úděl ležel uvnitř Judova, a Letopisy opakují simeonské vesnice jako Etam, Ain, Remmon, Tochen a Asan. Protože Nehemjášův seznam znovu osídlených měst má jediný Én-rimmon, čte většina badatelů Ajin a Rimmon jako jedno místo, „pramen Rimmonu“, a první místo na mapě je totéž co Én-rimmon, obvykle hledaný na Tel Halif u kibucu Lahav nebo v Chirbet Umm er-Ramamin vedle něj, asi 15 km severně od Beer-šeby."
    - "Levitský seznam v Jozue uvádí „Ain“ tam, kde Letopisy mají Ašan, takže druhý názor činí z Ajinu a Ašanu totéž místo; Horbat Anim v pahorcích jižně od Hebronu, který uchovává podobné jméno, je třetí a vzdálený dohad. Jiný Ajin, na severní hranici u Galilejského jezera, je jiné místo. Bible o Ajinu nevypráví žádný příběh."
    - "Tel Halif kopal od roku 1976 Lahav Research Project, který našel opevněné město z rané doby bronzové, osídlení z pozdní doby bronzové a železné zničené kolem roku 701 př. n. l. a perské a římské pozůstatky; zda jde o Rimmon, Siklag, nebo jiné město, se dosud diskutuje a nic ze země jméno Ajin neuvádí. Kibuc Lahav a jeho les stojí nyní vedle pahorku na severním okraji Negevu."
  sv:
    - "Ajin, ”källa”, är namnet på en liten stad i Judas Negev, känd bara från förteckningar. Josua räknar ”Ain och Rimmon” sist bland Judas sydliga städer, ger ”Ain, Rimmon, Eter och Asan” till Simeon, vars lott låg inom Judas, och Krönikeböckerna upprepar simeoniternas byar som Etam, Ajin, Rimmon, Token och Ashan. Eftersom Nehemjas förteckning över återbosatta städer har en enda En-Rimmon läser de flesta forskare Ajin och Rimmon som en och samma plats, ”Rimmons källa”, och den första platsen på kartan är densamma som En-Rimmon, som vanligen söks vid Tel Halif vid kibbutzen Lahav, eller vid Khirbet Umm er-Ramamin bredvid, omkring 15 km norr om Beer Sheva."
    - "Den levitiska förteckningen i Josua har ”Ain” där Krönikeböckerna har Ashan, så en andra uppfattning gör Ajin och Ashan till samma ort; Horbat Anim i bergen söder om Hebron, som har behållit ett liknande namn, är en tredje och avlägsen gissning. Ett annat Ajin, på norra gränsen vid Galileiska sjön, är en annan plats. Bibeln berättar ingen historia om Ajin."
    - "Tel Halif har grävts sedan 1976 av Lahav Research Project, som fann en muromgärdad stad från äldre bronsåldern, en bosättning från senare bronsåldern och järnåldern som förstördes omkring 701 f.Kr., samt persiska och romerska lämningar; om den är Rimmon, Siklag eller en annan stad är fortfarande omstritt, och inget ur marken nämner Ajin. Kibbutzen Lahav och dess skog ligger nu invid kullen vid Negevs norra kant."
  nb:
    - "Ajin, «kilde», er navnet på en liten by i Negev i Juda, bare kjent fra lister. Josva regner «Ajin og Rimmon» på slutten av de sørlige byene i Juda, gir «A'in, Rimmon og Eter og Asan» til Simeon, hvis lodd lå innenfor Judas, og Krønikebøkene gjentar simeonittenes landsbyer som Etam, A'in, Rimmon, Token og Asan. Siden Nehemjas liste over gjenbosatte byer har bare én En-Rimmon, leser de fleste forskere Ajin og Rimmon som ett sted, «Rimmons kilde», og det første punktet på kartet er det samme som En-Rimmon, vanligvis søkt ved Tel Halif ved Kibbutz Lahav, eller ved Khirbet Umm er-Ramamin ved siden av, omtrent 15 km nord for Beer-Sjeba."
    - "Levittlisten i Josva har «A'in» der Krønikebøkene har Asan, så et annet syn gjør Ajin og Asjan til det samme; Horbat Anim i åsene sør for Hebron, som har et lignende navn, er en tredje og fjern gjetning. En annen Ajin, på nordgrensen ved Galileasjøen, er et annet sted. Bibelen forteller ingen historie om Ajin."
    - "Tel Halif har vært gravd siden 1976 av Lahav Research Project, som fant en befestet by fra eldre bronsealder, en bosetning fra senbronsealder og jernalder ødelagt omkring 701 f.Kr., og persiske og romerske levninger; om den er Rimmon, Siklag eller en annen by, diskuteres fortsatt, og ingenting fra bakken nevner Ajin. Kibbutz Lahav og skogen dens ligger nå ved siden av tellen i nordkanten av Negev."
  tl:
    - "Ang Ain, “bukal”, ay pangalan ng isang maliit na bayan sa Negeb ng Juda, na kilala lamang mula sa mga talaan. Ibinibilang ni Josue ang “Ain at Rimmon” sa dulo ng mga katimugang bayan ng Juda, ibinibigay ang “Ain, Rimmon, at Eter, at Asan” kay Simeon, na ang bahagi ay nasa loob ng bahagi ng Juda, at inuulit ng Mga Cronica ang mga nayon ng Simeon bilang Etam, Ain, Rimmon, Tochen at Asan. Yamang ang talaan ni Nehemias ng mga bayang muling tinirhan ay may iisang En-rimmon, binabasa ng karamihan ng mga iskolar ang Ain at Rimmon bilang iisang lugar, “Bukal ng Rimmon”, at ang unang lugar sa mapa ay kapareho ng En-rimmon, na karaniwang hinahanap sa Tel Halif sa tabi ng Kibbutz Lahav, o sa Khirbet Umm er-Ramamin sa tabi nito, mga 15 km sa hilaga ng Beer-seba."
    - "Ibinibigay ng talaan ng mga Levita sa Josue ang “Ain” kung saan ang Mga Cronica ay may Asan, kaya ang ikalawang pananaw ay ginagawang iisa ang Ain at Asan; ang Horbat Anim sa mga burol sa timog ng Hebron, na nagpapanatili ng katulad na pangalan, ay pangatlo at malayong hula. Ang isa pang Ain, sa hilagang hangganan sa tabi ng Dagat ng Galilea, ay ibang lugar. Walang isinasalaysay ang Biblia tungkol sa Ain."
    - "Ang Tel Halif ay hinuhukay mula 1976 ng Lahav Research Project, na nakatuklas ng isang bayang may pader noong Maagang Panahon ng Tanso, isang pamayanan ng Huling Panahon ng Tanso at Panahon ng Bakal na winasak noong mga 701 BK, at mga labing Persiano at Romano; pinagtatalunan pa kung ito ay Rimmon, Siclag o ibang bayan, at walang mula sa lupa na nagpapangalan sa Ain. Ang Kibbutz Lahav at ang kagubatan nito ay nakatayo ngayon sa tabi ng burol sa hilagang gilid ng Negev."
  da:
    - "Ajin, »kilde«, er navnet på en lille by i Judas Negev, kendt alene fra lister. Josva regner »Ain og Rimmom« med blandt de sydlige byer i Juda til sidst, giver »Ajin, Rimmon og Ether og Asan« til Simeon, hvis lod lå inden for Judas, og Krønikebøgerne gentager simeonitternes landsbyer som »Etam og Ajn, Rimmon og Thoken og Asan«. Da Nehemias' liste over genbosatte byer har ét enkelt En-Rimmon, læser de fleste forskere Ajin og Rimmon som ét sted, »Rimmons kilde«, og det første sted på kortet er det samme som En-Rimmon, sædvanligvis søgt ved Tel Halif ved kibbutzen Lahav eller ved Khirbet Umm er-Ramamin ved siden af, omkring 15 km nord for Beersheba."
    - "Den levitiske liste i Josva har »Ajin«, hvor Krønikebøgerne har Asan, så et andet synspunkt gør Ajin og Asjan til det samme; Horbat Anim i bjergene syd for Hebron, som bevarer et lignende navn, er et tredje og fjernt gæt. En anden Ajin, på nordgrænsen ved Genesaret Sø, er et andet sted. Bibelen fortæller ingen historie om Ajin."
    - "Tel Halif er blevet gravet siden 1976 af Lahav Research Project, som fandt en befæstet by fra tidlig bronzealder, en bosættelse fra senbronze- og jernalderen ødelagt omkring 701 f.Kr. samt persiske og romerske levn; om det er Rimmon, Siklag eller en anden by, diskuteres stadig, og intet fra jorden nævner Ajin. Kibbutzen Lahav og dens skov ligger nu ved tellen i Negevs nordkant."
  sr:
    - "Аин, „извор“, име је малог града у Негеву Јудином, познатог само из спискова. Исус Навин убраја „Ајин и Римон“ на крај јужних градова Јуде, даје „Ајин, Ремон и Етер и Асан“ Симеуну, чији се жреб налазио унутар Јудиног, а Летописи понављају симеунска села као Итам, Ајин, Римон, Тохен и Асан. Пошто Немијин списак поново насељених градова има један Ен-Римон, већина научника чита Аин и Римон као једно место, „Извор Римонов“, а прво налазиште на карти исто је што и Ен-Римон, који се обично тражи у Тел Халифу поред кибуца Лахав или у Хирбет Ум ер-Рамамину поред њега, неких 15 км северно од Вирсавеје."
    - "Левитски списак у Исусу Навину даје „Ајин“ где Летописи имају Асан, па друго гледиште чини Аин и Асан истим; Хорбат Аним у брдима јужно од Хеврона, који чува слично име, трећа је и далека претпоставка. Други Аин, на северној међи код Галилејског мора, јесте друго место. Библија не прича никакву причу о Аину."
    - "Тел Халиф од 1976. копа Истраживачки пројекат Лахав, који је открио утврђен град раног бронзаног доба, насеље касног бронзаног и гвозденог доба разорено око 701. п. н. е. и персијске и римске остатке; да ли је то Римон, Сиклаг или други град, још се расправља, и ништа из земље не именује Аин. Кибуц Лахав и његова шума сада стоје поред хумке на северном ободу Негева."
