# Overview article (ADR 0007). Mainstream facts only; a minor place known from lists alone; the candidates on the map are named without choosing; the Ain of the northern border is a different record.
id: ain
place: afb265c
title:
  en: "Ain"
  ru: "Аин"
  uk: "Аїн"
  es: "Ain"
  pt: "Aim"
  de: "Ajin"
  fr: "Aïn"
body:
  en:
    - "Ain, “spring”, is the name of a small town in the Negeb of Judah, known only from lists. Joshua counts “Ain, and Rimmon” at the end of the southern towns of Judah, gives “Ain, Remmon, and Ether, and Ashan” to Simeon, whose lot lay inside Judah's, and Chronicles repeats the Simeonite villages as Etam, Ain, Rimmon, Tochen and Ashan. Since Nehemiah's list of resettled towns has a single En-rimmon, most scholars read Ain and Rimmon as one place, “Spring of Rimmon”, and the first site on the map is the same as En-rimmon, usually sought at Tel Halif by Kibbutz Lahav, or at Khirbet Umm er-Ramamin beside it, some 15 km north of Beersheba."
    - "The Levitical list in Joshua gives “Ain” where Chronicles has Ashan, so a second view makes Ain and Ashan the same; Horbat Anim in the hills south of Hebron, which keeps a like name, is a third and distant guess. Another Ain, on the northern border by the Sea of Galilee, is a different place. The Bible tells no story of Ain."
    - "Tel Halif has been dug since 1976 by the Lahav Research Project, which found a walled town of the Early Bronze Age, a Late Bronze and Iron Age settlement destroyed about 701 BC, and Persian and Roman remains; whether it is Rimmon, Ziklag or another town is still argued, and nothing from the ground names Ain. Kibbutz Lahav and its forest now stand beside the mound at the northern edge of the Negev."
  ru:
    - "Аин, «источник», — имя маленького города в Негеве Иудином, известного только по спискам. Книга Иисуса Навина называет «Аин и Риммон» в конце южных городов Иуды, отдаёт «Аин, Риммон, Ефер и Ашан» Симеону, чей удел лежал внутри Иудина, а Паралипоменон повторяет сёла Симеона: Етам, Аин, Риммон, Фокен и Ашан. Поскольку в списке заново заселённых городов у Неемии стоит один Ен-Риммон, большинство учёных читают Аин и Риммон как одно место — «источник Риммона», и первое место на карте совпадает с Ен-Риммоном, который обычно ищут в Тель-Халифе у кибуца Лахав или в Хирбет-Умм-эр-Рамамин рядом с ним, примерно в 15 км к северу от Вирсавии."
    - "В списке левитских городов у Иисуса Навина стоит Аин там, где у Паралипоменона Ашан, так что по второму взгляду Аин и Ашан — одно; Хорват-Аним в горах к югу от Хеврона, хранящий похожее имя, — третья, далёкая догадка. Другой Аин, на северной границе у Галилейского моря, — иное место. Библия не рассказывает об Аине ничего."
    - "Тель-Халиф копает с 1976 года экспедиция Лахав: найдены обнесённый стеной город раннего бронзового века, поселение позднего бронзового и железного веков, разрушенное около 701 г. до н. э., и персидские и римские остатки; Риммон ли это, Секелаг или иной город, спорят до сих пор, и ничто из земли не называет Аина. Кибуц Лахав и его лес стоят теперь у холма на северном краю Негева."
  uk:
    - "Аїн, «джерело», — назва невеликого міста в Негеві Юди, відомого лише з переліків. Ісус Навин зараховує «Аин і Риммон» наприкінці південних міст Юди, дає «Анн, Риммон, Етер та Ашан» Симеонові, чий уділ лежав усередині Юдиного, а Хроніки повторюють симеонівські села як «Етам, Аїн, Риммон, Токен та Ашан». Оскільки в переліку Неемії поселених міст стоїть один Ен-Риммон, більшість учених читає Аїн і Риммон як одне місце, «Джерело Риммону», і перше місце на мапі збігається з Ен-Риммоном, який зазвичай шукають на Тель-Халіфі біля кібуца Лахав або в Хірбет-Умм-ер-Раманіні поряд, приблизно за 15 км на північ від Беер-Шеви."
    - "Левітський перелік у книзі Ісуса Навина має «Анн» там, де Хроніки мають Ашан, тож за другою думкою Аїн і Ашан — те саме; Хорбат-Анім у пагорбах на південь від Хеврону, що зберігає подібну назву, — третя й далека здогадка. Інший Аїн, на північному кордоні біля Галілейського моря, — інше місце. Біблія не розповідає про Аїн жодної історії."
    - "Тель-Халіф розкопує від 1976 року Лахавський дослідницький проєкт, який виявив муроване місто ранньої бронзової доби, поселення пізньої бронзової та залізної доби, зруйноване близько 701 р. до н. е., а також перські й римські рештки; чи це Риммон, Ціклаг або інше місто, досі сперечаються, і ніщо з землі не називає Аїн. Кібуц Лахав і його ліс стоять нині поряд із пагорбом на північному краю Негеву."
  es:
    - "Ain, «manantial», es el nombre de una pequeña ciudad del Néguev de Judá, conocida solo por listas. Josué cuenta «Aín, y Rimmón» al final de las ciudades meridionales de Judá, da «Aín, Rimmón, Eter, y Asán» a Simeón, cuyo lote estaba dentro del de Judá, y las Crónicas repiten las aldeas de Simeón como Etam, Ain, Rimón, Token y Asán. Como la lista de ciudades repobladas de Nehemías tiene un único En-rimón, la mayoría de los estudiosos leen Ain y Rimón como un solo lugar, «fuente de Rimón», y el primer sitio del mapa es el mismo que En-rimón, que suele buscarse en Tel Halif, junto al kibutz Lahav, o en Khirbet Umm er-Ramamin, a su lado, unos 15 km al norte de Beerseba."
    - "La lista levítica de Josué da «Ain» donde las Crónicas tienen Asán, por lo que una segunda opinión hace de Ain y Asán el mismo lugar; Horbat Anim, en las colinas al sur de Hebrón, que conserva un nombre parecido, es una tercera conjetura lejana. Otro Ain, en la frontera septentrional junto al mar de Galilea, es un lugar distinto. La Biblia no cuenta ninguna historia de Ain."
    - "Tel Halif se excava desde 1976 por el Lahav Research Project, que halló una ciudad amurallada de la Edad del Bronce Antiguo, un asentamiento del Bronce Final y de la edad del Hierro destruido hacia 701 a. C., y restos persas y romanos; se sigue discutiendo si es Rimón, Siclag u otra ciudad, y nada hallado en el terreno nombra Ain. El kibutz Lahav y su bosque se alzan hoy junto al montículo, en el borde septentrional del Néguev."
  pt:
    - "Aim, “fonte”, é o nome de uma pequena cidade no Neguebe de Judá, conhecida apenas por listas. Josué conta “Aim e Rimom” no fim das cidades meridionais de Judá, dá “Aim, Rimom, Eter e Asã” a Simeão, cujo lote ficava dentro do de Judá, e Crônicas repete as aldeias simeonitas como Etã, Aim, Rimom, Toquém e Asã. Como a lista de cidades repovoadas de Neemias tem um único En-Rimom, a maioria dos estudiosos lê Aim e Rimom como um só lugar, “Fonte de Rimom”, e o primeiro sítio do mapa é o mesmo que En-Rimom, geralmente procurado em Tel Halif, junto ao quibutz Lahav, ou em Khirbet Umm er-Ramamin, ao lado, cerca de 15 km ao norte de Berseba."
    - "A lista levítica em Josué traz “Aim” onde Crônicas tem Asã, de modo que uma segunda opinião faz de Aim e Asã o mesmo lugar; Horbat Anim, nas colinas ao sul de Hebrom, que guarda um nome semelhante, é uma terceira e distante conjetura. Outra Aim, na fronteira setentrional, junto ao mar da Galileia, é um lugar diferente. A Bíblia não conta nenhuma história de Aim."
    - "Tel Halif é escavado desde 1976 pelo Lahav Research Project, que encontrou uma cidade fortificada da Idade do Bronze Antigo, um povoado do Bronze Final e da Idade do Ferro destruído por volta de 701 a.C., e vestígios persas e romanos; se é Rimom, Ziclague ou outra cidade ainda se discute, e nada do solo nomeia Aim. O quibutz Lahav e a sua floresta estão agora ao lado do montículo, na borda setentrional do Neguev."
  de:
    - "Ajin, „Quelle“, ist der Name einer kleinen Stadt im Negev von Juda, nur aus Listen bekannt. Josua zählt „Ain, Rimmon“ am Ende der südlichen Städte Judas auf, gibt Simeon, dessen Los innerhalb Judas lag, „Ain, Rimmon, Ehter, Asan“, und die Chronik wiederholt die simeonitischen Dörfer als Etam, Ain, Rimmon, Tochen und Asan. Da Nehemias Liste der wiederbesiedelten Städte nur ein einziges En-Rimmon hat, lesen die meisten Gelehrten Ajin und Rimmon als einen Ort, „Quelle des Rimmon“, und die erste Stätte auf der Karte ist dieselbe wie En-Rimmon, gewöhnlich bei Tel Halif am Kibbuz Lahav gesucht oder bei Chirbet Umm er-Ramamin daneben, etwa 15 km nördlich von Beerscheba."
    - "Die Levitenliste bei Josua gibt „Ain“, wo die Chronik Asan hat, daher macht eine zweite Ansicht Ajin und Aschan zu demselben Ort; Horbat Anim in den Bergen südlich von Hebron, das einen ähnlichen Namen bewahrt, ist eine dritte, ferne Vermutung. Ein anderes Ajin an der Nordgrenze beim See Genezareth ist ein anderer Ort. Die Bibel erzählt keine Geschichte von Ajin."
    - "Tel Halif wird seit 1976 vom Lahav Research Project ausgegraben, das eine ummauerte Stadt der Frühbronzezeit, eine Siedlung der Spätbronze- und Eisenzeit, um 701 v. Chr. zerstört, sowie persische und römische Reste fand; ob es Rimmon, Ziklag oder eine andere Stadt ist, wird weiter diskutiert, und nichts aus dem Boden nennt Ajin. Der Kibbuz Lahav und sein Wald stehen heute neben dem Hügel am Nordrand des Negev."
  fr:
    - "Aïn, « source », est le nom d’une petite ville du Négev de Juda, connue seulement par des listes. Josué compte « Aïn, et Rimmon » à la fin des villes méridionales de Juda, donne « Aïn, Rimmon, Éther, et Aschan » à Siméon, dont le lot se trouvait à l’intérieur de celui de Juda, et les Chroniques redonnent les villages de Siméon : Étam, Aïn, Rimmon, Tochen et Aschan. Comme la liste de Néhémie sur les villes repeuplées n’a qu’un seul En-Rimmon, la plupart des savants lisent Aïn et Rimmon comme un seul lieu, « source de Rimmon », et le premier site de la carte est le même qu’En-Rimmon, d’ordinaire cherché à Tel Halif, près du kibboutz Lahav, ou à Khirbet Umm er-Ramamin, à côté, à quelque 15 km au nord de Beer-Schéba."
    - "La liste lévitique de Josué donne « Aïn » là où les Chroniques ont Aschan ; une seconde opinion tient donc Aïn et Aschan pour identiques ; Horbat Anim, dans les collines au sud d’Hébron, qui garde un nom voisin, est une troisième hypothèse, lointaine. Un autre Aïn, à la frontière nord, près de la mer de Galilée, est un autre lieu. La Bible ne raconte aucune histoire d’Aïn."
    - "Tel Halif est fouillé depuis 1976 par le Lahav Research Project, qui y a trouvé une ville fortifiée du Bronze ancien, un établissement du Bronze récent et de l’âge du Fer détruit vers 701 av. J.-C., et des vestiges perses et romains ; qu’il s’agisse de Rimmon, de Tsiklag ou d’une autre ville, on en débat encore, et rien dans le sol ne nomme Aïn. Le kibboutz Lahav et sa forêt se dressent aujourd’hui à côté du tertre, à la lisière nord du Néguev."
