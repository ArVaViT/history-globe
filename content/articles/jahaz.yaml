# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the candidates are given without choosing.
id: jahaz
place: ad9b1cd
title:
  en: "Jahaz"
  ru: "Иааца"
body:
  en:
    - "Jahaz, also spelt Jahazah and Jahzah, was a town on the Moabite plateau east of the Dead Sea, on the edge of the desert north of the Arnon. It is first named as a battlefield: when Israel asked leave to pass through the land of Sihon, the Amorite king of Heshbon, Sihon gathered his people and “came to Jahaz, and fought against Israel”, and Israel took his land from the Arnon to the Jabbok. Joshua lists Jahaz among the towns of Reuben, and it was given to the Levites of the family of Merari."
    - "The town changed hands between Israel and Moab. The Mesha Stele, the inscription of the Moabite king of about 840 BC, says that the king of Israel had built Jahaz and lived there while he fought Mesha, until Chemosh drove him out; Mesha then took two hundred men of Moab, captured Jahaz and joined it to Dibon. In the prophets it is Moabite: “Heshbon shall cry, and Elealeh: their voice shall be heard even unto Jahaz”, says Isaiah, and Jeremiah's oracle on Moab names it among the cities of the plain country, “upon Holon, and upon Jahazah, and upon Mephaath”. Eusebius still knew Jassa as a place pointed out between Medeba and Dibon."
    - "Where Jahaz stood is not settled. The site most often proposed is Khirbet el-Medeiyineh on the Wadi eth-Themed, a fortified Iron Age town on the desert edge east of Dibon, excavated since 1996; others have argued for Khirbet Libb on the King's Highway between Medeba and Dibon, for Khirbet Iskander on the Wadi el-Wala, or for er-Remeil, Aleiyan and Khirbet Umm el-Idham. All the candidates lie in Jordan, on the plateau north of the Arnon."
  ru:
    - "Иааца, в Синодальном переводе также Яаца, была городом на Моавитском плато к востоку от Мёртвого моря, на краю пустыни к северу от Арнона. Впервые она названа как поле битвы: когда Израиль попросил пройти через землю Сигона, Аморрейского царя Есевона, Сигон собрал народ свой, «дошел до Иаацы, и сразился с Израилем», и Израиль взял его землю от Арнона до Иавока. Книга Иисуса Навина числит Иаацу среди городов Рувима, и она была отдана левитам из рода Мерари."
    - "Город переходил из рук Израиля в руки Моава и обратно. Стела Месы, надпись Моавитского царя около 840 г. до н. э., говорит, что царь Израильский построил Иаацу и жил в ней, воюя с Месой, пока Хамос не изгнал его; тогда Меса взял двести человек из Моава, захватил Иаацу и присоединил её к Дивону. У пророков она моавитская: «И вопит Есевон и Елеала; голос их слышится до самой Иаацы», — говорит Исаия, а пророчество Иеремии о Моаве называет её среди городов равнины: «И суд пришел на равнины, на Халон и на Иаацу, и на Мофаф». Евсевий ещё знал Иассу как место, которое показывали между Медевой и Дивоном."
    - "Где стояла Иааца, не решено. Чаще всего предлагают Хирбет-эль-Медейине на Вади-эт-Темед, укреплённый город железного века на краю пустыни к востоку от Дивона, раскапываемый с 1996 года; другие указывали на Хирбет-Либб на Царской дороге между Медевой и Дивоном, на Хирбет-Искандер на Вади-эль-Вала или на Эр-Ремейль, Алейян и Хирбет-Умм-эль-Идхам. Все эти места лежат в Иордании, на плато к северу от Арнона."
