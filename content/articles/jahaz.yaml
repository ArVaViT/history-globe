# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the candidates are given without choosing.
id: jahaz
place: ad9b1cd
title:
  en: "Jahaz"
  ru: "Иааца"
  uk: "Яца"
  es: "Jahaza"
  pt: "Jaza"
  de: "Jahaz"
  fr: "Jahats"
body:
  en:
    - "Jahaz, also spelt Jahazah and Jahzah, was a town on the Moabite plateau east of the Dead Sea, on the edge of the desert north of the Arnon. It is first named as a battlefield: when Israel asked leave to pass through the land of Sihon, the Amorite king of Heshbon, Sihon gathered his people and “came to Jahaz, and fought against Israel”, and Israel took his land from the Arnon to the Jabbok. Joshua lists Jahaz among the towns of Reuben, and it was given to the Levites of the family of Merari."
    - "The town changed hands between Israel and Moab. The Mesha Stele, the inscription of the Moabite king of about 840 BC, says that the king of Israel had built Jahaz and lived there while he fought Mesha, until Chemosh drove him out; Mesha then took two hundred men of Moab, captured Jahaz and joined it to Dibon. In the prophets it is Moabite: “Heshbon shall cry, and Elealeh: their voice shall be heard even unto Jahaz”, says Isaiah, and Jeremiah's oracle on Moab names it among the cities of the plain country, “upon Holon, and upon Jahazah, and upon Mephaath”. Eusebius still knew Jassa as a place pointed out between Medeba and Dibon."
    - "Where Jahaz stood is not settled. The site most often proposed is Khirbet el-Medeiyineh on the Wadi eth-Themed, a fortified Iron Age town on the desert edge east of Dibon, excavated since 1996; others have argued for Khirbet Libb on the King's Highway between Medeba and Dibon, for Khirbet Iskander on the Wadi el-Wala, or for er-Remeil, Aleiyan and Khirbet Umm el-Idham. All the candidates lie in Jordan, on the plateau north of the Arnon."
  ru:
    - "Иааца, в Синодальном переводе также Яаца, была городом на Моавитском плато к востоку от Мёртвого моря, на краю пустыни к северу от Арнона. Впервые она названа как поле битвы: когда Израиль попросил пройти через землю Сигона, Аморрейского царя Есевона, Сигон собрал народ свой, «дошел до Иаацы, и сразился с Израилем», и Израиль взял его землю от Арнона до Иавока. Книга Иисуса Навина числит Иаацу среди городов Рувима, и она была отдана левитам из рода Мерари."
    - "Город переходил из рук Израиля в руки Моава и обратно. Стела Меши, надпись Моавитского царя около 840 г. до н. э., говорит, что царь Израильский построил Иаацу и жил в ней, воюя с Месой, пока Хамос не изгнал его; тогда Меса взял двести человек из Моава, захватил Иаацу и присоединил её к Дивону. У пророков она моавитская: «И вопит Есевон и Елеала; голос их слышится до самой Иаацы», — говорит Исаия, а пророчество Иеремии о Моаве называет её среди городов равнины: «И суд пришел на равнины, на Халон и на Иаацу, и на Мофаф». Евсевий ещё знал Иассу как место, которое показывали между Медевой и Дивоном."
    - "Где стояла Иааца, не решено. Чаще всего предлагают Хирбет-эль-Медейине на Вади-эт-Темед, укреплённый город железного века на краю пустыни к востоку от Дивона, раскапываемый с 1996 года; другие указывали на Хирбет-Либб на Царской дороге между Медевой и Дивоном, на Хирбет-Искандер на Вади-эль-Вала или на Эр-Ремейль, Алейян и Хирбет-Умм-эль-Идхам. Все эти места лежат в Иордании, на плато к северу от Арнона."
  uk:
    - "Яца, пишуть також Яаза й Яхца, було містом на моавському плато на схід від Мертвого моря, на краю пустелі на північ від Арнону. Воно вперше названо як поле битви: коли Ізраїль попросив дозволу пройти землею Сігона, аморейського царя Гесбону, Сігон зібрав свій народ і «прийшов у Ягаз та й почав бити на Ізраїля», а Ізраїль узяв його землю від Арнону до Яббоку. Книга Ісуса Навина перелічує Яцу серед міст Рувима, і її дали левітам роду Мерарі."
    - "Місто переходило з рук у руки між Ізраїлем і Моавом. Стела Меші, напис моавського царя близько 840 р. до н. е., каже, що цар Ізраїлю збудував Яцу і жив там, поки воював з Мешею, доки Хемош не вигнав його; Меша тоді взяв двісті людей Моава, захопив Яцу й приєднав її до Дівона. У пророків вона моавська: «Есебон і Елеала голосять; крик їх доходить аж до Яази», каже Ісая, а оракул Єремії про Моав називає її серед міст рівнини, «на Халон і на Яазу й на Мофат». Євсевій ще знав Ясу як місце, на яке вказували між Мадабою та Дівоном."
    - "Де стояла Яца, не вирішено. Місце, яке пропонують найчастіше, — Хірбет-ель-Медейнех на Ваді-ет-Темед, укріплене місто залізного віку на краю пустелі на схід від Дівона, яке розкопують від 1996 року; інші обстоювали Хірбет-Лібб на Царській дорозі між Мадабою та Дівоном, Хірбет-Іскандер на Ваді-ель-Вала або ер-Ремейль, Алейян і Хірбет-Умм-ель-Ідхам. Усі кандидати лежать в Йорданії, на плато на північ від Арнону."
  es:
    - "Jahaza, escrita también Jahazá y Jahzá, era una población de la meseta de Moab, al este del mar Muerto, en el borde del desierto al norte del Arnón. Se nombra primero como campo de batalla: cuando Israel pidió permiso para pasar por la tierra de Sehón, el rey amorreo de Hesbón, Sehón reunió a su pueblo y «vino á Jahaz, y peleó contra Israel», e Israel tomó su tierra desde el Arnón hasta el Jaboc. Josué enumera Jahaza entre las ciudades de Rubén, y fue dada a los levitas de la familia de Merari."
    - "La población cambió de manos entre Israel y Moab. La estela de Mesa, la inscripción del rey moabita de hacia el 840 a. C., dice que el rey de Israel había construido Jahaza y vivía allí mientras combatía a Mesa, hasta que Quemós lo expulsó; Mesa tomó entonces doscientos hombres de Moab, capturó Jahaza y la unió a Dibón. En los profetas es moabita: «Hesbón y Eleale gritarán, hasta Jahas se oirá su voz», dice Isaías, y el oráculo de Jeremías sobre Moab la nombra entre las ciudades de la campiña, «sobre Holón, y sobre Jahzah, y sobre Mephaath». Eusebio conocía aún Jassa como un lugar señalado entre Medeba y Dibón."
    - "Dónde estuvo Jahaza no está resuelto. El sitio más a menudo propuesto es Khirbet el-Medeiyineh, en el Wadi eth-Themed, una ciudad fortificada de la Edad del Hierro en el borde del desierto al este de Dibón, excavada desde 1996; otros han defendido Khirbet Libb, en el Camino Real entre Medeba y Dibón, Khirbet Iskander, en el Wadi el-Wala, o er-Remeil, Aleiyan y Khirbet Umm el-Idham. Todos los candidatos se hallan en Jordania, en la meseta al norte del Arnón."
  pt:
    - "Jaza, também escrita Jahazah e Jahzah, era uma cidade no planalto moabita a leste do mar Morto, na borda do deserto ao norte do Arnom. É nomeada primeiro como campo de batalha: quando Israel pediu licença para passar pela terra de Seom, o rei amorreu de Hesbom, Seom reuniu seu povo e “saiu contra Israel no deserto, e chegou a Jaza. Ele lutou contra Israel”, e Israel tomou sua terra do Arnom ao Jaboque. Josué lista Jaza entre as cidades de Rúben, e foi dada aos levitas da família de Merari."
    - "A cidade mudou de mãos entre Israel e Moabe. A Estela de Mesa, a inscrição do rei moabita de cerca de 840 a.C., diz que o rei de Israel edificara Jaza e vivera ali enquanto combatia Mesa, até que Quemós o expulsou; Mesa tomou então duzentos homens de Moabe, capturou Jaza e a uniu a Dibom. Nos profetas é moabita: “Hesbom clama com Eleale. Sua voz é ouvida até Jaza”, diz Isaías, e o oráculo de Jeremias sobre Moabe a nomeia entre as cidades da planície, “sobre Holom, sobre Jaza, sobre Mefaate”. Eusébio ainda conheceu Jassa como um lugar apontado entre Medeba e Dibom."
    - "Onde Jaza ficava não está resolvido. O sítio mais proposto é Khirbet el-Medeiyineh, no uádi eth-Themed, uma cidade fortificada da Idade do Ferro na borda do deserto a leste de Dibom, escavada desde 1996; outros defenderam Khirbet Libb, na Estrada Real entre Medeba e Dibom, Khirbet Iskander, no uádi el-Wala, ou er-Remeil, Aleiyan e Khirbet Umm el-Idham. Todos os candidatos ficam na Jordânia, no planalto ao norte do Arnom."
  de:
    - "Jahaz, auch Jahaza und Jahza geschrieben, war eine Stadt auf der moabitischen Hochebene östlich des Toten Meeres, am Wüstenrand nördlich des Arnon. Sie wird zuerst als Schlachtfeld genannt: Als Israel um Durchzug durch das Land Sihons, des Amoriterkönigs von Heschbon, bat, sammelte Sihon sein Volk, und „als er gen Jahza kam, stritt er wider Israel“, und Israel nahm sein Land vom Arnon bis zum Jabbok. Josua führt Jahaz unter den Städten Rubens auf, und es wurde den Leviten der Familie Merari gegeben."
    - "Die Stadt wechselte zwischen Israel und Moab. Die Mesa-Stele, die Inschrift des moabitischen Königs von etwa 840 v. Chr., sagt, der König von Israel habe Jahaz gebaut und dort gewohnt, während er gegen Mesa kämpfte, bis Kemosch ihn vertrieb; Mesa nahm dann zweihundert Männer Moabs, eroberte Jahaz und schlug es zu Dibon. Bei den Propheten ist es moabitisch: „Hesbon und Eleale schreien, daß man's zu Jahza hört“, sagt Jesaja, und Jeremias Orakel über Moab nennt es unter den Städten des Flachlands: „über Holon, Jahza, Mephaath“. Eusebius kannte noch Jassa als einen Ort, der zwischen Medeba und Dibon gezeigt wurde."
    - "Wo Jahaz stand, ist nicht entschieden. Die am häufigsten vorgeschlagene Stätte ist Chirbet el-Medeijine am Wadi eth-Themed, eine befestigte eisenzeitliche Stadt am Wüstenrand östlich von Dibon, seit 1996 ausgegraben; andere haben für Chirbet Libb an der Königsstraße zwischen Medeba und Dibon, für Chirbet Iskander am Wadi el-Wala oder für er-Remeil, Aleijan und Chirbet Umm el-Idham plädiert. Alle Kandidaten liegen in Jordanien, auf der Hochebene nördlich des Arnon."
  fr:
    - "Jahats, aussi écrite Jahtsa et Jahtsah, était une ville du plateau moabite à l’est de la mer Morte, en lisière du désert au nord de l’Arnon. Elle est d’abord nommée comme champ de bataille : quand Israël demanda à traverser le pays de Sihon, roi amoréen de Hesbon, Sihon rassembla son peuple et « vint à Jahats, et combattit Israël », et Israël prit son pays de l’Arnon au Jabbok. Josué compte Jahats parmi les villes de Ruben, et elle fut donnée aux Lévites de la famille de Merari."
    - "La ville passa d’Israël à Moab et inversement. La stèle de Mescha, l’inscription du roi moabite d’environ 840 av. J.-C., dit que le roi d’Israël avait bâti Jahats et y habitait pendant qu’il combattait Mescha, jusqu’à ce que Chemosh le chasse ; Mescha prit alors deux cents hommes de Moab, s’empara de Jahats et l’annexa à Dibon. Chez les prophètes, elle est moabite : « Hesbon et Élealé poussent des cris, on entend leur voix jusqu’à Jahats », dit Ésaïe, et l’oracle de Jérémie sur Moab la nomme parmi les villes du pays de la plaine, « sur Holon, sur Jahats, sur Méphaath ». Eusèbe connaissait encore Jassa comme un lieu montré entre Médeba et Dibon."
    - "L’emplacement de Jahats n’est pas fixé. Le site le plus souvent proposé est Khirbet el-Medeiyineh sur l’oued eth-Themed, ville fortifiée de l’âge du Fer en lisière du désert à l’est de Dibon, fouillée depuis 1996 ; d’autres ont plaidé pour Khirbet Libb sur la route royale entre Médeba et Dibon, pour Khirbet Iskander sur l’oued el-Wala, ou pour er-Remeil, Aleiyan et Khirbet Umm el-Idham. Tous les candidats se trouvent en Jordanie, sur le plateau au nord de l’Arnon."
