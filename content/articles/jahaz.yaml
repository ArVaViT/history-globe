body:
  en:
    - "Jahaz, also spelt Jahazah and Jahzah, was a town on the Moabite plateau east of the Dead Sea, on the edge of the desert north of the Arnon. It is first named as a battlefield: when Israel asked leave to pass through the land of Sihon, the Amorite king of Heshbon, Sihon gathered his people and “came to Jahaz, and fought against Israel”, and Israel took his land from the Arnon to the Jabbok. Joshua lists Jahaz among the towns of Reuben, and it was given to the Levites of the family of Merari."
    - "The town changed hands between Israel and Moab. The Mesha Stele, the inscription of the Moabite king of about 840 BC, says that the king of Israel had built Jahaz and lived there while he fought Mesha, until Chemosh drove him out; Mesha then took two hundred men of Moab, captured Jahaz and joined it to Dibon. In the prophets it is Moabite: “Heshbon shall cry, and Elealeh: their voice shall be heard even unto Jahaz”, says Isaiah, and Jeremiah's oracle on Moab names it among the cities of the plain country, “upon Holon, and upon Jahazah, and upon Mephaath”. Eusebius still knew Jassa as a place pointed out between Medeba and Dibon."
    - "Where Jahaz stood is not settled. The site most often proposed is Khirbet el-Medeiyineh on the Wadi eth-Themed, a fortified Iron Age town on the desert edge north-east of Dibon, excavated from 1996 to 2012; others have argued for Khirbet Libb on the King's Highway between Medeba and Dibon, for Khirbet Iskander on the Wadi el-Wala, or for er-Remeil, Aleiyan and Khirbet Umm el-Idham. All the candidates lie in Jordan, on the plateau north of the Arnon."
  ru:
    - "Иааца, в Синодальном переводе также Яаца, была городом на Моавитском плато к востоку от Мёртвого моря, на краю пустыни к северу от Арнона. Впервые она названа как поле битвы: когда Израиль попросил пройти через землю Сигона, Аморрейского царя Есевона, Сигон собрал народ свой, «дошел до Иаацы, и сразился с Израилем», и Израиль взял его землю от Арнона до Иавока. Книга Иисуса Навина числит Иаацу среди городов Рувима, и она была отдана левитам из рода Мерари."
    - "Город переходил из рук Израиля в руки Моава и обратно. Стела Меши, надпись Моавитского царя около 840 г. до н. э., говорит, что царь Израильский построил Иаацу и жил в ней, воюя с Месой, пока Хамос не изгнал его; тогда Меса взял двести человек из Моава, захватил Иаацу и присоединил её к Дивону. У пророков она моавитская: «И вопит Есевон и Елеала; голос их слышится до самой Иаацы», — говорит Исаия, а пророчество Иеремии о Моаве называет её среди городов равнины: «И суд пришел на равнины, на Халон и на Иаацу, и на Мофаф». Евсевий ещё знал Иассу как место, которое показывали между Медевой и Дивоном."
    - "Где стояла Иааца, не решено. Чаще всего предлагают Хирбет-эль-Медейине на Вади-эт-Темед, укреплённый город железного века на краю пустыни к северо-востоку от Дивона, раскопанный в 1996–2012 годах; другие указывали на Хирбет-Либб на Царской дороге между Медевой и Дивоном, на Хирбет-Искандер на Вади-эль-Вала или на Эр-Ремейль, Алейян и Хирбет-Умм-эль-Идхам. Все эти места лежат в Иордании, на плато к северу от Арнона."
  uk:
    - "Яца, пишуть також Яаза й Яхца, було містом на моавському плато на схід від Мертвого моря, на краю пустелі на північ від Арнону. Воно вперше названо як поле битви: коли Ізраїль попросив дозволу пройти землею Сігона, аморейського царя Гесбону, Сігон зібрав свій народ і «прийшов у Ягаз та й почав бити на Ізраїля», а Ізраїль узяв його землю від Арнону до Яббоку. Книга Ісуса Навина перелічує Яцу серед міст Рувима, і її дали левітам роду Мерарі."
    - "Місто переходило з рук у руки між Ізраїлем і Моавом. Стела Меші, напис моавського царя близько 840 р. до н. е., каже, що цар Ізраїлю збудував Яцу і жив там, поки воював з Мешею, доки Хемош не вигнав його; Меша тоді взяв двісті людей Моава, захопив Яцу й приєднав її до Дівона. У пророків вона моавська: «Есебон і Елеала голосять; крик їх доходить аж до Яази», каже Ісая, а оракул Єремії про Моав називає її серед міст рівнини, «на Халон і на Яазу й на Мофат». Євсевій ще знав Ясу як місце, на яке вказували між Мадабою та Дівоном."
    - "Де стояла Яца, не вирішено. Місце, яке пропонують найчастіше, — Хірбет-ель-Медейнех на Ваді-ет-Темед, укріплене місто залізного віку на краю пустелі на північний схід від Дівона, яке розкопували у 1996–2012 роках; інші обстоювали Хірбет-Лібб на Царській дорозі між Мадабою та Дівоном, Хірбет-Іскандер на Ваді-ель-Вала або ер-Ремейль, Алейян і Хірбет-Умм-ель-Ідхам. Усі кандидати лежать в Йорданії, на плато на північ від Арнону."
  es:
    - "Jahaza, escrita también Jahazá y Jahzá, era una población de la meseta de Moab, al este del mar Muerto, en el borde del desierto al norte del Arnón. Se nombra primero como campo de batalla: cuando Israel pidió permiso para pasar por la tierra de Sehón, el rey amorreo de Hesbón, Sehón reunió a su pueblo y «vino á Jahaz, y peleó contra Israel», e Israel tomó su tierra desde el Arnón hasta el Jaboc. Josué enumera Jahaza entre las ciudades de Rubén, y fue dada a los levitas de la familia de Merari."
    - "La población cambió de manos entre Israel y Moab. La estela de Mesa, la inscripción del rey moabita de hacia el 840 a. C., dice que el rey de Israel había construido Jahaza y vivía allí mientras combatía a Mesa, hasta que Quemós lo expulsó; Mesa tomó entonces doscientos hombres de Moab, capturó Jahaza y la unió a Dibón. En los profetas es moabita: «Hesbón y Eleale gritarán, hasta Jahas se oirá su voz», dice Isaías, y el oráculo de Jeremías sobre Moab la nombra entre las ciudades de la campiña, «sobre Holón, y sobre Jahzah, y sobre Mephaath». Eusebio conocía aún Jassa como un lugar señalado entre Medeba y Dibón."
    - "Dónde estuvo Jahaza no está resuelto. El sitio más a menudo propuesto es Khirbet el-Medeiyineh, en el Wadi eth-Themed, una ciudad fortificada de la Edad del Hierro en el borde del desierto al nordeste de Dibón, excavada de 1996 a 2012; otros han defendido Khirbet Libb, en el Camino Real entre Medeba y Dibón, Khirbet Iskander, en el Wadi el-Wala, o er-Remeil, Aleiyan y Khirbet Umm el-Idham. Todos los candidatos se hallan en Jordania, en la meseta al norte del Arnón."
  pt:
    - "Jaza, também escrita Jahazah e Jahzah, era uma cidade no planalto moabita a leste do mar Morto, na borda do deserto ao norte do Arnom. É nomeada primeiro como campo de batalha: quando Israel pediu licença para passar pela terra de Seom, o rei amorreu de Hesbom, Seom reuniu seu povo e “saiu contra Israel no deserto, e chegou a Jaza. Ele lutou contra Israel”, e Israel tomou sua terra do Arnom ao Jaboque. Josué lista Jaza entre as cidades de Rúben, e foi dada aos levitas da família de Merari."
    - "A cidade mudou de mãos entre Israel e Moabe. A Estela de Mesa, a inscrição do rei moabita de cerca de 840 a.C., diz que o rei de Israel edificara Jaza e vivera ali enquanto combatia Mesa, até que Quemós o expulsou; Mesa tomou então duzentos homens de Moabe, capturou Jaza e a uniu a Dibom. Nos profetas é moabita: “Hesbom clama com Eleale. Sua voz é ouvida até Jaza”, diz Isaías, e o oráculo de Jeremias sobre Moabe a nomeia entre as cidades da planície, “sobre Holom, sobre Jaza, sobre Mefaate”. Eusébio ainda conheceu Jassa como um lugar apontado entre Medeba e Dibom."
    - "Onde Jaza ficava não está resolvido. O sítio mais proposto é Khirbet el-Medeiyineh, no uádi eth-Themed, uma cidade fortificada da Idade do Ferro na borda do deserto a nordeste de Dibom, escavada de 1996 a 2012; outros defenderam Khirbet Libb, na Estrada Real entre Medeba e Dibom, Khirbet Iskander, no uádi el-Wala, ou er-Remeil, Aleiyan e Khirbet Umm el-Idham. Todos os candidatos ficam na Jordânia, no planalto ao norte do Arnom."
  de:
    - "Jahaz, auch Jahaza und Jahza geschrieben, war eine Stadt auf der moabitischen Hochebene östlich des Toten Meeres, am Wüstenrand nördlich des Arnon. Sie wird zuerst als Schlachtfeld genannt: Als Israel um Durchzug durch das Land Sihons, des Amoriterkönigs von Heschbon, bat, sammelte Sihon sein Volk, und „als er gen Jahza kam, stritt er wider Israel“, und Israel nahm sein Land vom Arnon bis zum Jabbok. Josua führt Jahaz unter den Städten Rubens auf, und es wurde den Leviten der Familie Merari gegeben."
    - "Die Stadt wechselte zwischen Israel und Moab. Die Mesa-Stele, die Inschrift des moabitischen Königs von etwa 840 v. Chr., sagt, der König von Israel habe Jahaz gebaut und dort gewohnt, während er gegen Mesa kämpfte, bis Kemosch ihn vertrieb; Mesa nahm dann zweihundert Männer Moabs, eroberte Jahaz und schlug es zu Dibon. Bei den Propheten ist es moabitisch: „Hesbon und Eleale schreien, daß man's zu Jahza hört“, sagt Jesaja, und Jeremias Orakel über Moab nennt es unter den Städten des Flachlands: „über Holon, Jahza, Mephaath“. Eusebius kannte noch Jassa als einen Ort, der zwischen Medeba und Dibon gezeigt wurde."
    - "Wo Jahaz stand, ist nicht entschieden. Die am häufigsten vorgeschlagene Stätte ist Chirbet el-Medeijine am Wadi eth-Themed, eine befestigte eisenzeitliche Stadt am Wüstenrand nordöstlich von Dibon, von 1996 bis 2012 ausgegraben; andere haben für Chirbet Libb an der Königsstraße zwischen Medeba und Dibon, für Chirbet Iskander am Wadi el-Wala oder für er-Remeil, Aleijan und Chirbet Umm el-Idham plädiert. Alle Kandidaten liegen in Jordanien, auf der Hochebene nördlich des Arnon."
  fr:
    - "Jahats, aussi écrite Jahtsa et Jahtsah, était une ville du plateau moabite à l’est de la mer Morte, en lisière du désert au nord de l’Arnon. Elle est d’abord nommée comme champ de bataille : quand Israël demanda à traverser le pays de Sihon, roi amoréen de Hesbon, Sihon rassembla son peuple et « vint à Jahats, et combattit Israël », et Israël prit son pays de l’Arnon au Jabbok. Josué compte Jahats parmi les villes de Ruben, et elle fut donnée aux Lévites de la famille de Merari."
    - "La ville passa d’Israël à Moab et inversement. La stèle de Mescha, l’inscription du roi moabite d’environ 840 av. J.-C., dit que le roi d’Israël avait bâti Jahats et y habitait pendant qu’il combattait Mescha, jusqu’à ce que Chemosh le chasse ; Mescha prit alors deux cents hommes de Moab, s’empara de Jahats et l’annexa à Dibon. Chez les prophètes, elle est moabite : « Hesbon et Élealé poussent des cris, on entend leur voix jusqu’à Jahats », dit Ésaïe, et l’oracle de Jérémie sur Moab la nomme parmi les villes du pays de la plaine, « sur Holon, sur Jahats, sur Méphaath ». Eusèbe connaissait encore Jassa comme un lieu montré entre Médeba et Dibon."
    - "L’emplacement de Jahats n’est pas fixé. Le site le plus souvent proposé est Khirbet el-Medeiyineh sur l’oued eth-Themed, ville fortifiée de l’âge du Fer en lisière du désert au nord-est de Dibon, fouillée de 1996 à 2012 ; d’autres ont plaidé pour Khirbet Libb sur la route royale entre Médeba et Dibon, pour Khirbet Iskander sur l’oued el-Wala, ou pour er-Remeil, Aleiyan et Khirbet Umm el-Idham. Tous les candidats se trouvent en Jordanie, sur le plateau au nord de l’Arnon."
  pl:
    - "Jahaz, pisany też Jahaza i Jahza, było miastem na płaskowyżu moabskim na wschód od Morza Martwego, na skraju pustyni na północ od Arnonu. Jest wymienione najpierw jako pole bitwy: gdy Izrael prosił o przejście przez ziemię Sychona, amorejskiego króla Cheszbonu, Sychon zebrał swój lud, „a gdy przyszedł do Jahazy, zwiódł bitwę z Izraelem”, i Izrael wziął jego ziemię od Arnonu do Jabboku. Jozue wymienia Jahaz wśród miast Rubena, a oddano je lewitom z rodu Merariego."
    - "Miasto przechodziło z rąk do rąk między Izraelem a Moabem. Stela Meszy, napis króla Moabu z około 840 r. p.n.e., mówi, że król Izraela zbudował Jahaz i mieszkał tam, walcząc z Meszą, dopóki Kemosz go nie wypędził; Mesza wziął wtedy dwustu mężów Moabu, zdobył Jahaz i przyłączył do Dibon. U proroków jest moabskie: „I będzie wołał Hesebon i Eleale, aż w Jahas słyszany będzie głos ich”, mówi Izajasz, a orędzie Jeremiasza o Moabie wymienia je wśród miast równiny, „na Holon, i na Jassa, i na Mefaat”. Euzebiusz znał jeszcze Jassę jako miejsce wskazywane między Medebą a Dibon."
    - "Gdzie stało Jahaz, nie jest rozstrzygnięte. Miejsce najczęściej proponowane to Chirbet el-Medejjine nad Wadi eth-Temed, obwarowane miasto z epoki żelaza na skraju pustyni na północny wschód od Dibon, badane w latach 1996–2012; inni opowiadali się za Chirbet Libb przy Drodze Królewskiej między Medebą a Dibon, za Chirbet Iskander nad Wadi el-Wala albo za er-Remejl, Alejan i Chirbet Umm el-Idham. Wszyscy kandydaci leżą w Jordanii, na płaskowyżu na północ od Arnonu."
  it:
    - "Iaaz, scritta anche Iaaza e Iahza, era una città sull’altopiano moabita a est del Mar Morto, al margine del deserto a nord dell’Arnon. È nominata per la prima volta come campo di battaglia: quando Israele chiese di passare per il paese di Sicon, il re amorreo di Chesbon, Sicon radunò il suo popolo e «giunse a Jahats, e diè battaglia a Israele», e Israele prese il suo paese dall’Arnon allo Iabbok. Giosuè elenca Iaaz fra le città di Ruben, e fu data ai Leviti della famiglia di Merari."
    - "La città passò di mano fra Israele e Moab. La Stele di Mesa, l’iscrizione del re moabita dell’840 a.C. circa, dice che il re d’Israele aveva costruito Iaaz e vi abitava mentre combatteva Mesa, finché Camos lo scacciò; Mesa prese allora duecento uomini di Moab, conquistò Iaaz e l’unì a Dibon. Nei profeti è moabita: «Heshbon ed Elealeh gridano; la loro voce s’ode fino a Jahats», dice Isaia, e l’oracolo di Geremia su Moab la nomina fra le città della pianura, «sopra Holon, sopra Jahats, su Mefaath». Eusebio conosceva ancora Jassa come un luogo indicato fra Màdaba e Dibon."
    - "Dove sorgesse Iaaz non è stabilito. Il sito più spesso proposto è Khirbet el-Medeiyineh sul Wadi eth-Themed, una città fortificata dell’età del Ferro al margine del deserto a nord-est di Dibon, scavata dal 1996 al 2012; altri hanno sostenuto Khirbet Libb sulla Via del Re fra Màdaba e Dibon, Khirbet Iskander sul Wadi el-Wala, o er-Remeil, Aleiyan e Khirbet Umm el-Idham. Tutti i candidati si trovano in Giordania, sull’altopiano a nord dell’Arnon."
  nl:
    - "Jahaz, ook gespeld Jahaza en Jahza, was een stad op het plateau van Moab ten oosten van de Dode Zee, aan de rand van de woestijn ten noorden van de Arnon. Zij wordt het eerst genoemd als slagveld: toen Israël verlof vroeg om door het land van Sihon, de Amorietische koning van Chesbon, te trekken, verzamelde Sihon zijn volk en “kwam te Jahza, en streed tegen Israel”, en Israël nam zijn land in van de Arnon tot de Jabbok. Jozua noemt Jahaz onder de steden van Ruben, en het werd gegeven aan de Levieten van het geslacht van Merari."
    - "De stad wisselde van hand tussen Israël en Moab. De Mesa-stele, het opschrift van de Moabitische koning van omstreeks 840 v.Chr., zegt dat de koning van Israël Jahaz had gebouwd en daar woonde terwijl hij tegen Mesa streed, tot Kemosj hem verdreef; Mesa nam toen tweehonderd man van Moab, veroverde Jahaz en voegde het bij Dibon. Bij de profeten is het Moabitisch: “Zo Hesbon als Eleale schreeuwt, hun stem wordt gehoord tot Jahaz toe”, zegt Jesaja, en Jeremia’s godsspraak over Moab noemt het onder de steden van het vlakke land, “over Holon, en over Jahza, en over Mefaath”. Eusebius kende Jassa nog als een aangewezen plaats tussen Medeba en Dibon."
    - "Waar Jahaz stond, is niet beslist. De meest voorgestelde plaats is Khirbet el-Medeiyineh aan de Wadi eth-Themed, een versterkte stad uit de IJzertijd aan de woestijnrand ten noordoosten van Dibon, van 1996 tot 2012 opgegraven; anderen hebben gepleit voor Khirbet Libb aan de Koningsweg tussen Medeba en Dibon, voor Khirbet Iskander aan de Wadi el-Wala, of voor er-Remeil, Aleiyan en Khirbet Umm el-Idham. Alle kandidaten liggen in Jordanië, op het plateau ten noorden van de Arnon."
  cs:
    - "Jahac, psaný též Jahaza a Jahca, bylo město na moábské plošině východně od Mrtvého moře, na okraji pouště severně od Arnonu. Je poprvé jmenováno jako bojiště: když Izrael žádal o povolení projít zemí Sichona, amorejského krále Chešbónu, Sichon shromáždil svůj lid a „přitáh do Jasa, bojoval proti Izraelovi“ a Izrael vzal jeho zemi od Arnonu k Jabokovi. Jozue uvádí Jahac mezi městy Rúbenovými a bylo dáno levitům z rodu Merari."
    - "Město přecházelo mezi Izraelem a Moábem. Mešova stéla, nápis moábského krále z doby kolem 840 př. n. l., praví, že izraelský král vystavěl Jahac a bydlel v něm, když bojoval s Mešou, dokud jej Kemoš nevyhnal; Meša pak vzal dvě stě mužů z Moábu, Jahac dobyl a připojil jej k Dibonu. U proroků je moábský: „A křičeti bude Ezebon a Eleale, až v Jasa slyšán bude hlas jejich“, praví Izajáš, a Jeremjášův výrok o Moábu jej jmenuje mezi městy rovinné země, „na Holon a na Jasa a na Mefat“. Eusebios ještě znal Jassu jako místo ukazované mezi Medebou a Dibonem."
    - "Kde Jahac stál, není rozhodnuto. Nejčastěji navrhovaným místem je Chirbet el-Medeiyineh na Wádí eth-Themed, opevněné město doby železné na okraji pouště severovýchodně od Dibonu, vykopávané v letech 1996–2012; jiní se zasazovali o Chirbet Libb na Královské cestě mezi Medebou a Dibonem, o Chirbet Iskander na Wádí el-Wala nebo o er-Remeil, Aleiyan a Chirbet Umm el-Idham. Všichni kandidáti leží v Jordánsku, na plošině severně od Arnonu."
  sv:
    - "Jahas, också stavat Jahasa och Jahsa, var en stad på Moabplatån öster om Döda havet, i ökenbrynet norr om Arnon. Den nämns först som slagfält: när Israel bad om lov att tåga genom landet för Sichon, amoréernas kung i Heshbon, församlade Sichon sitt folk och drog ut ”till dess han kom till Jahas; där gav han sig i strid med Israel”, och Israel tog hans land från Arnon till Jabbok. Josua räknar upp Jahas bland Rubens städer, och det gavs åt leviterna av Meraris släkt."
    - "Staden växlade händer mellan Israel och Moab. Mesha-stelen, inskriften av den moabitiska kungen omkring 840 f.Kr., säger att Israels kung hade byggt Jahas och bott där medan han stred mot Mesha, tills Kemosh drev ut honom; Mesha tog då tvåhundra män av Moab, intog Jahas och förenade det med Dibon. Hos profeterna är det moabitiskt: ”Hesbon och Eleale höja klagorop, så att det höres ända till Jahas”, säger Jesaja, och Jeremias spådom om Moab nämner det bland slättlandets städer, ”över Holon, Jahas och Mofaat”. Eusebios kände fortfarande Jassa som en plats man pekade ut mellan Medeba och Dibon."
    - "Var Jahas stod är inte avgjort. Platsen som oftast föreslagits är Khirbet el-Medeiyineh vid Wadi eth-Themed, en befäst järnåldersstad i ökenkanten nordost om Dibon, utgrävd 1996–2012; andra har argumenterat för Khirbet Libb vid Kungsvägen mellan Medeba och Dibon, för Khirbet Iskander vid Wadi el-Wala, eller för er-Remeil, Aleiyan och Khirbet Umm el-Idham. Alla kandidaterna ligger i Jordanien, på platån norr om Arnon."
  nb:
    - "Jahas, også skrevet Jahsa og Jahza, var en by på det moabittiske platået øst for Dødehavet, i ørkenkanten nord for Arnon. Den nevnes først som en slagmark: da Israel ba om lov til å dra gjennem landet til Sihon, amorittkongen i Hesjbon, samlet Sihon folket sitt, og «han kom til Jahas og stred mot Israel», og Israel tok hans land fra Arnon til Jabbok. Josva oppfører Jahas blant Rubens byer, og den ble gitt til levittene av Meraris ætt."
    - "Byen skiftet hender mellom Israel og Moab. Mesa-steinen, innskriften til den moabittiske kongen omkring 840 f.Kr., sier at Israels konge hadde bygd Jahas og bodd der mens han kjempet mot Mesa, til Kemosj drev ham ut; Mesa tok så to hundre menn av Moab, erobret Jahas og la den til Dibon. Hos profetene er den moabittisk: «Hesbon og El'ale skriker så det høres like til Jahas», sier Jesaja, og Jeremias utsagn om Moab nevner den blant slettelandets byer, «over Holon og over Jahsa og over Mofa'at». Eusebius kjente fortsatt Jassa som et sted som ble pekt ut mellom Medeba og Dibon."
    - "Hvor Jahas sto, er ikke avgjort. Stedet som oftest foreslås er Khirbet el-Medeiyineh ved Wadi eth-Themed, en befestet jernalderby i ørkenkanten nordøst for Dibon, gravd ut fra 1996 til 2012; andre har argumentert for Khirbet Libb ved Kongeveien mellom Medeba og Dibon, for Khirbet Iskander ved Wadi el-Wala, eller for er-Remeil, Aleiyan og Khirbet Umm el-Idham. Alle kandidatene ligger i Jordan, på platået nord for Arnon."
  tl:
    - "Ang Jahaz, isinusulat ding Jahazah at Jahzah, ay isang bayan sa talampas ng Moab sa silangan ng Dagat na Patay, sa gilid ng disyerto sa hilaga ng Arnon. Unang pinangalanan ito bilang larangan ng digmaan: nang humingi ang Israel ng pahintulot na dumaan sa lupain ni Sehon, hari ng mga Amorrheo ng Hesbon, “pinisan ni Sehon ang kaniyang buong bayan, at lumabas sa ilang laban sa Israel at dumating hanggang Jahaz: at nilabanan ang Israel”, at kinuha ng Israel ang kaniyang lupain mula sa Arnon hanggang Jaboc. Itinatala ni Josue ang Jahaz sa mga bayan ni Ruben, at ibinigay ito sa mga Levita ng angkan ni Merari."
    - "Nagpalitan ng kamay ang bayan sa pagitan ng Israel at Moab. Sinasabi ng Estelang Mesa, ang inskripsiyon ng haring Moabita noong mga 840 BK, na itinayo ng hari ng Israel ang Jahaz at tumira roon habang nakikipaglaban kay Mesa, hanggang palayasin siya ni Chemosh; kinuha pagkatapos ni Mesa ang dalawang daang lalaki ng Moab, sinakop ang Jahaz at idinagdag sa Dibon. Sa mga propeta ito ay Moabita: “ang Hesbon ay humihiyaw, at ang Eleale; ang kanilang tinig ay naririnig hanggang sa Jahas”, sabi ni Isaias, at pinangangalanan ito ng orakulo ni Jeremias tungkol sa Moab sa mga lungsod ng lupaing patag, sa Olon, at sa “Jahzah, at sa Mephaath”. Kilala pa ni Eusebio ang Jassa bilang lugar na itinuturo sa pagitan ng Medeba at Dibon."
    - "Hindi nalutas kung saan nakatayo ang Jahaz. Ang pinakamadalas na iminumungkahing lugar ay ang Khirbet el-Medeiyineh sa Wadi eth-Themed, isang nakukutaang bayan ng Panahon ng Bakal sa gilid ng disyerto sa hilagang-silangan ng Dibon, na hinukay mula 1996 hanggang 2012; ang iba ay nagpangatwiran para sa Khirbet Libb sa Daang Hari sa pagitan ng Medeba at Dibon, para sa Khirbet Iskander sa Wadi el-Wala, o para sa er-Remeil, Aleiyan at Khirbet Umm el-Idham. Ang lahat ng kandidato ay nasa Jordan, sa talampas sa hilaga ng Arnon."
  da:
    - "Jahas, også stavet Jahasa og Jahsa, var en by på Moab-plateauet øst for Det Døde Hav, i ørkenens rand nord for Arnon. Den nævnes først som slagmark: da Israel bad om tilladelse til at drage gennem landet tilhørende Sihon, den amoritiske konge af Hesjbon, samlede Sihon sit folk, drog ud mod Israel i ørkenen og »kom til Jaza; og han stred imod Israel«, og Israel tog hans land fra Arnon til Jabbok. Josva opregner Jahas blandt Rubens byer, og den blev givet til leviterne af Meraris slægt."
    - "Byen skiftede hænder mellem Israel og Moab. Mesja-stelen, indskriften af den moabitiske konge fra omkring 840 f.Kr., siger, at Israels konge havde bygget Jahas og boede der, mens han kæmpede mod Mesja, indtil Kemosj drev ham ud; Mesja tog så to hundrede mænd af Moab, indtog Jahas og føjede den til Dibon. Hos profeterne er den moabitisk: »Hesbon og Eleale raabe, deres Røst høres indtil Jahaz«, siger Esajas, og Jeremias' orakel om Moab nævner den blandt slettelandets byer, »til Holon og til Jaza og over Mefaat«. Eusebios kendte stadig Jassa som et sted, der blev udpeget mellem Medeba og Dibon."
    - "Hvor Jahas stod, er ikke afgjort. Det sted, der oftest foreslås, er Khirbet el-Medeiyineh ved Wadi eth-Themed, en befæstet jernalderby i ørkenens rand nordøst for Dibon, udgravet fra 1996 til 2012; andre har argumenteret for Khirbet Libb på Kongevejen mellem Medeba og Dibon, for Khirbet Iskander ved Wadi el-Wala eller for er-Remeil, Aleiyan og Khirbet Umm el-Idham. Alle kandidater ligger i Jordan, på plateauet nord for Arnon."
  sr:
    - "Јаса, пише се и Јаза и Јахаза, била је град на моавској висоравни источно од Мртвог мора, на ободу пустиње северно од Арнона. Први пут је именован као бојиште: кад је Израиљ тражио допуштење да прође кроз земљу Сиона, аморејског цара Есевона, Сион је сабрао свој народ и „дође у Јасу, и поби се с Израиљем“, и Израиљ је узео његову земљу од Арнона до Јавока. Исус набраја Јасу међу градовима Рувимовим, и дата је Левитима из породице Мераријеве."
    - "Град је мењао господаре између Израиља и Моава. Мисина стела, натпис моавског цара из око 840. п. н. е., каже да је цар Израиља подигао Јасу и живео ту док је ратовао против Мисе, док га Хемос није истерао; Миса је затим узео две стотине људи Моава, заузео Јасу и придружио је Девону. Код пророка је моавска: „И викаће Есевон и Елеала, до Јасе чуће им се глас“, каже Исаија, а Јеремијино пророштво о Моаву именује је међу градовима равне земље, „на Олон и на Јасу и Мифат“. Јевсевије је још знао Јасу као место показивано између Медеве и Девона."
    - "Где је Јаса стајала, није утврђено. Налазиште које се најчешће предлаже је Хирбет ел-Медејина на Вади ет-Темеду, утврђени град гвозденог доба на ободу пустиње североисточно од Девона, ископаван од 1996. до 2012; други су заступали Хирбет Либ на Краљевском путу између Медеве и Девона, Хирбет Искандер на Вади ел-Вали, или Ер-Ремејл, Алејан и Хирбет Ум ел-Идам. Сви кандидати леже у Јордану, на висоравни северно од Арнона."
  hu:
    - "Jahac, másként Jahácá és Jahca, a Holt-tengertől keletre fekvő moábi fennsík városa volt, a sivatag szélén, az Arnontól északra. Először csatatérként említik: amikor Izráel engedélyt kért Szihon, Hesbon emóreus királya földjén való átvonuláshoz, Szihon összegyűjtötte népét, és „jöve Jaháczba; és megütközék Izráellel”, Izráel pedig elvette földjét az Arnontól a Jabbókig. Józsué Jahacot Rúben városai között sorolja fel, és a Merári nemzetségbeli lévitáknak adták."
    - "A város gazdát cserélt Izráel és Moáb között. A Mésa-sztélé, a moábi király Kr. e. 840 körüli felirata azt mondja, hogy Izráel királya építette Jahacot, és ott lakott, miközben Mésa ellen harcolt, míg Kemós ki nem űzte; Mésa ekkor kétszáz moábi férfit vett, elfoglalta Jahacot, és Dibonhoz csatolta. A prófétáknál moábi: „És kiált Hesbon és Eleálé, szavok Jáháczig hallatik”, mondja Ézsaiás, Jeremiás Moáb elleni jövendölése pedig a síksági városok között nevezi meg: „Hólonra, Jására és Mefátra”. Eusebius még ismerte Jassát, mint a Médeba és Dibon között mutatott helyet."
    - "Hogy hol állt Jahac, nem eldöntött. A leggyakrabban javasolt hely Hirbet el-Medejine a Vádi eth-Themed mentén, a Dibontól északkeletre fekvő megerősített vaskori város a sivatag szélén, amelyet 1996-tól 2012-ig ástak; mások Hirbet Libb mellett érveltek a Médeba és Dibon közötti Király útján, Hirbet Iszkander mellett a Vádi el-Walán, vagy er-Remejl, Alejján és Hirbet Umm el-Idhám mellett. Minden jelölt Jordániában, az Arnontól északra fekvő fennsíkon van."
  fi:
    - "Jahas, kirjoitetaan myös Jahasa ja Jahza, oli kaupunki Moabin ylätasangolla Kuolleenmeren itäpuolella, aavikon reunalla Arnonista pohjoiseen. Se mainitaan ensimmäisen kerran taistelukenttänä: kun Israel pyysi lupaa kulkea amorilaisten kuninkaan Sihonin, Hesbonin kuninkaan, maan läpi, Sihon kokosi väkensä ja ”kun hän oli tullut Jahaaseen, ryhtyi hän taisteluun Israelia vastaan”, ja Israel valtasi hänen maansa Arnonista Jabbokiin. Joosua luettelee Jahaksen Ruubenin kaupunkien joukossa, ja se annettiin Merarin suvun leeviläisille."
    - "Kaupunki vaihtoi omistajaa Israelin ja Moabin välillä. Mesa-stele, Moabin kuninkaan noin vuodelta 840 eaa. kirjoitus, sanoo Israelin kuninkaan rakentaneen Jahaksen ja asuneen siellä sotiessaan Mesaa vastaan, kunnes Kemos ajoi hänet pois; Mesa otti sitten kaksisataa Moabin miestä, valtasi Jahaksen ja liitti sen Dibonin. Profeetoilla se on moabilainen: ”Hesbon ja Elale huutavat; Jahaaseen asti kuuluu niiden parku”, sanoo Jesaja, ja Jeremian Moab-ennustus nimeää sen tasangon maan kaupunkien joukossa, ”Hoolonille, Jahaalle ja Meefaatille”. Eusebios tunsi vielä Jassan paikkana, jota näytettiin Medeban ja Dibonin välissä."
    - "Missä Jahas sijaitsi, ei ole ratkaistu. Useimmin ehdotettu paikka on Khirbet el-Medeiyineh Wadi eth-Themedillä, rautakautinen linnoitettu kaupunki aavikon reunalla Dibonista koilliseen, jota kaivettiin vuosina 1996–2012; toiset ovat puolustaneet Khirbet Libbiä Kuninkaantiellä Medeban ja Dibonin välillä, Khirbet Iskanderia Wadi el-Walalla tai er-Remeilia, Aleiyania ja Khirbet Umm el-Idhamia. Kaikki ehdokkaat sijaitsevat Jordaniassa, Arnonin pohjoispuolisella ylätasangolla."
  vi:
    - "Gia-hát, cũng viết Gia-sa và Giát-sa, là một thành trên cao nguyên Mô-áp phía đông Biển Chết, ở rìa sa mạc phía bắc sông Ạt-nôn. Thành lần đầu được nêu như một chiến trường: khi Y-sơ-ra-ên xin phép đi ngang xứ Si-hôn, vua A-mô-rít ở Hết-bôn, Si-hôn nhóm dân mình và “đến Gia-hát, chiến trận cùng Y-sơ-ra-ên”, và Y-sơ-ra-ên chiếm xứ ông từ Ạt-nôn đến Gia-bốc. Giô-suê liệt kê Gia-hát trong các thành của Ru-bên, và thành được ban cho người Lê-vi thuộc họ Mê-ra-ri."
    - "Thành đổi chủ giữa Y-sơ-ra-ên và Mô-áp. Bia Mê-sa, văn bia của vua Mô-áp khoảng năm 840 TCN, nói rằng vua Y-sơ-ra-ên đã xây Gia-hát và ở đó trong khi giao chiến với Mê-sa, cho đến khi Kê-mốt đuổi ông đi; Mê-sa bèn lấy hai trăm người Mô-áp, chiếm Gia-hát và nối vào Đi-bôn. Trong các nhà tiên tri, đó là thành của Mô-áp: “Hết-bôn và Ê-lê-a-lê kêu la, tiếng nghe thấu đến Gia-hát”, Ê-sai nói, và lời tiên tri của Giê-rê-mi về Mô-áp nêu thành trong các thành của xứ đồng bằng, “trên Hô-lôn, Gia-sa, Mê-phát”. Eusebius vẫn biết Jassa là một nơi được chỉ giữa Mê-đê-ba và Đi-bôn."
    - "Gia-hát đứng ở đâu chưa ngã ngũ. Địa điểm thường được đề nghị nhất là Khirbet el-Medeiyineh bên Wadi eth-Themed, một thành kiên cố thời Đồ Sắt ở rìa sa mạc đông bắc Đi-bôn, được khai quật từ năm 1996 đến 2012; những người khác lập luận cho Khirbet Libb trên Đường Vua giữa Mê-đê-ba và Đi-bôn, cho Khirbet Iskander bên Wadi el-Wala, hoặc cho er-Remeil, Aleiyan và Khirbet Umm el-Idham. Mọi ứng viên đều nằm ở Jordan, trên cao nguyên phía bắc Ạt-nôn."
  ro:
    - "Iahaț, scris și Iahața și Iahța, era un oraș pe podișul moabit, la est de Marea Moartă, la marginea deșertului de la nord de Arnon. Este numit întâi ca loc de bătălie: când Israel a cerut voie să treacă prin țara lui Sihon, regele amorit din Hesbon, Sihon și-a adunat poporul, iar „au ieșit în pustie să steà împrotiva lui Israil, și au venit în Iassa, și a stat împrotiva lui Israil”, și Israel i-a luat țara de la Arnon până la Iaboc. Iosua îl enumeră printre orașele lui Ruben, iar leviților din familia lui Merari le-a fost dat."
    - "Orașul a trecut de la Israel la Moab și înapoi. Stela lui Meșa, inscripția regelui moabit din jurul anului 840 î.Hr., spune că regele lui Israel zidise Iahațul și locuise acolo cât timp se războia cu Meșa, până când Chemoș l-a izgonit; Meșa a luat apoi două sute de bărbați din Moab, a cucerit Iahațul și l-a alipit Dibonului. La profeți este moabit: „până la Iassa s’a auzit glasul lor”, spune Isaia despre strigătul Hesbonului și al Elealei, iar profeția lui Ieremia despre Moab îl numește printre cetățile câmpiei, alături de Holon și Mefaat. Eusebiu mai cunoștea Jassa ca pe un loc arătat între Medeba și Dibon."
    - "Unde se afla Iahațul nu este stabilit. Locul propus cel mai des este Khirbet el-Medeiyineh, pe Wadi eth-Themed, un oraș fortificat din Epoca Fierului la marginea deșertului, la nord-est de Dibon, săpat din 1996 până în 2012; alții au susținut Khirbet Libb, pe Drumul Regelui dintre Medeba și Dibon, Khirbet Iskander, pe Wadi el-Wala, sau er-Remeil, Aleiyan și Khirbet Umm el-Idham. Toți candidații se află în Iordania, pe podișul de la nord de Arnon."
  bg:
    - "Яхац, изписван също Яхаца и Яца, беше град на Моавското плато на изток от Мъртво море, на края на пустинята северно от Арнон. За първи път се назовава като бойно поле: когато Израил поиска позволение да мине през земята на Сихон, аморейския цар на Есевон, Сихон събра народа си, „дойде в Яса та направи бой против Израиля“, и Израил взе земята му от Арнон до Явок. Книгата на Иисус Навин изброява Яхац сред градовете на Рувим и той беше даден на левитите от рода на Мерари."
    - "Градът минаваше от ръцете на Израил в ръцете на Моав и обратно. Стелата на Меша, надписът на моавския цар от около 840 г. пр.н.е., казва, че царят на Израил съградил Яхац и живял там, докато воювал с Меша, докато Кемош не го прогонил; тогава Меша взел двеста мъже от Моав, превзел Яхац и го присъединил към Дивон. При пророците той е моавски: „И Есевон ще въпие, и Елеала: Гласът им ще се чуе дори до Яса“, казва Исаия, а пророчеството на Йеремия за Моав го назовава сред градовете на полянската земя: „На Олон, и на Яса, и на Мифаат“. Евсевий още познаваше Яса като място, посочвано между Медева и Дивон."
    - "Къде е стоял Яхац, не е установено. Най-често предлаганото място е Хирбет ел-Медейине на Уади ет-Темед — укрепен град от желязната епоха на края на пустинята североизточно от Дивон, разкопаван от 1996 до 2012 г.; други се застъпват за Хирбет Либ на Царския път между Медева и Дивон, за Хирбет Искандер на Уади ел-Уала или за ер-Ремейл, Алеян и Хирбет Ум ел-Идхам. Всички кандидати лежат в Йордания, на платото северно от Арнон."
