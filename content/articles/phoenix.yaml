body:
  en:
    - "Phoenix was a harbour town on the south coast of Crete, the port of inland Anopolis, which the Barrington Atlas and Pleiades place at Loutro in the region of Sfakia, directly north of the islet of Gavdos, the Clauda of Acts. Two harbours flank the small peninsula there: the sheltered bay of Loutro, opening east, and the bay of Phineka on the west side, which keeps the ancient name. The Phoenix “of the Lampians” that Strabo sets on the isthmus where the island narrows to about a hundred stadia is placed by the Barrington Atlas farther east, near Sellia, as a separate town."
    - "At Fair Havens, late in the season, the crew of Paul's ship decided against his advice to move on, “if by any means they might attain to Phenice, and there to winter; which is an haven of Crete, and lieth toward the south west and north west.” A gentle south wind seemed to favour them, but the north-easter Euroclydon drove the ship out to sea before it reached Phoenix. The description of the harbour is the difficulty. W. M. Calder, following James Smith, held Loutro to be the only harbour on that coast fit for a large ship to winter in and read the Greek, in sailors' language, as “looking down the south-west and north-west winds”, that is, facing east, or else supposed the description mistaken; Bishop Christopher Wordsworth took the plain sense, facing west, and chose the western bay. An inscription of Trajan's reign found at Loutro shows that Egyptian grain ships wintered there."
  ru:
    - "Финик — приморский город на южном берегу Крита, гавань лежавшего в глубине острова Анополиса; Баррингтонский атлас и Pleiades помещают его в Лутро в области Сфакия, прямо к северу от островка Гавдос, Клавды Деяний. Маленький полуостров там окружают две бухты: укрытая бухта Лутро, открытая на восток, и бухта Финика на западной стороне, сохранившая древнее имя. Финик «лампейцев», который Страбон ставит на перешейке, где остров сужается примерно до ста стадиев, Баррингтонский атлас помещает восточнее, у Селлии, как отдельный город."
    - "В Хороших Пристанях, на исходе навигации, корабельщики решили вопреки совету Павла идти дальше, «чтобы, если можно, дойти до Финика, пристани Критской, лежащей против юго-западного и северо-западного ветра, и там перезимовать». Тихий южный ветер, казалось, благоприятствовал им, но северо-восточный ветер эвроклидон унёс корабль в море, прежде чем он дошёл до Финика. Трудность — в описании гавани. У. М. Колдер вслед за Джеймсом Смитом считал Лутро единственной гаванью этого берега, где может зимовать большой корабль, и понимал греческие слова на языке моряков как «смотрящая по направлению юго-западного и северо-западного ветров», то есть на восток, или же допускал ошибку в описании; епископ Кристофер Вордсворт брал прямой смысл — на запад — и выбирал западную бухту. Надпись времени Траяна, найденная в Лутро, показывает, что египетские хлебные корабли зимовали там."
  uk:
    - "Фінік був портовим містечком на південному узбережжі Криту, портом внутрішнього Анополіса, який «Barrington Atlas» і «Pleiades» розміщують у Лутро в області Сфакія, прямо на північ від острівця Гавдос, Клавди з Діянь. Два порти обабіч маленького півострова: захищена бухта Лутро, відкрита на схід, і бухта Фінека на західному боці, яка зберігає давню назву. Фінік «лампіян», який Страбон ставить на перешийку, де острів звужується до приблизно ста стадіїв, «Barrington Atlas» розміщує далі на схід, поблизу Селлії, як окреме місто."
    - "На Добрих Пристанях, наприкінці сезону, команда корабля Павла вирішила всупереч його раді рушати далі: «чи не можна б як, добравшись до Финикиї, перезимувати в пристанї Крицькій, що лежить між вітром полуденнїм і західнїм». Легкий південний вітер, здавалося, сприяв їм, але північно-східний Євроклидон відігнав корабель у море, не давши дістатися до Фініка. Складність — в описі порту. В. М. Колдер, услід за Джеймсом Смітом, вважав Лутро єдиним портом на тому березі, придатним, щоб велике судно зимувало в ньому, і читав грецьке, моряцькою мовою, як «що дивиться вниз за південно-західним і північно-західним вітрами», тобто на схід, або ж припускав, що опис хибний; єпископ Крістофер Вордсворт узяв прямий зміст, на захід, і вибрав західну бухту. Напис часів Траяна, знайдений у Лутро, показує, що там зимували єгипетські зернові кораблі."
  es:
    - "Fenice era una ciudad portuaria de la costa meridional de Creta, el puerto de la interior Anópolis, que el Barrington Atlas y Pleiades sitúan en Loutro, en la región de Sfakiá, justo al norte del islote de Gavdos, la Clauda de los Hechos. Dos puertos flanquean allí la pequeña península: la bahía abrigada de Loutro, abierta al este, y la bahía de Phineka, en el lado occidental, que conserva el nombre antiguo. La Fenice «de los lampios» que Estrabón sitúa en el istmo donde la isla se estrecha hasta unos cien estadios la coloca el Barrington Atlas más al este, cerca de Sellia, como ciudad distinta."
    - "En Buenos Puertos, ya avanzada la estación, la tripulación decidió, contra el consejo de Pablo, seguir «por si pudiesen arribar á Fenice é invernar allí», un puerto de Creta que mira al suroeste y al noroeste. Un suave viento sur parecía favorecerlos, pero el euroclidón, del nordeste, la arrastró mar adentro antes de llegar. La descripción del puerto es la dificultad. W. M. Calder, siguiendo a James Smith, sostuvo que Loutro era el único puerto de esa costa apto para invernar una nave grande y leyó el griego, en lenguaje marinero, como «mirando hacia abajo los vientos del suroeste y del noroeste», es decir, al este, o supuso errónea la descripción; el obispo Christopher Wordsworth tomó el sentido llano, al oeste, y eligió la bahía occidental. Una inscripción de Trajano hallada en Loutro muestra que allí invernaban naves graneras egipcias."
  pt:
    - "Fênix era uma cidade portuária na costa sul de Creta, o porto de Anópolis, no interior, que o Barrington Atlas e o Pleiades situam em Loutro, na região de Sfakia, diretamente ao norte do ilhéu de Gavdos, a Clauda de Atos. Dois portos ladeiam ali a pequena península: a baía abrigada de Loutro, aberta para o leste, e a baía de Phineka, no lado oeste, que conserva o nome antigo. A Fênix “dos lampeus” que Estrabão coloca no istmo onde a ilha se estreita a cerca de cem estádios é situada pelo Barrington Atlas mais a leste, perto de Sellia, como cidade distinta."
    - "Em Bons Portos, no fim da estação, a tripulação do navio de Paulo decidiu, contra o conselho dele, seguir adiante, “para ver se de algum modo poderiam chegar a Fenice e invernar lá, que é um porto de Creta, voltado para o sudoeste e noroeste”. Um suave vento sul parecia favorecê-los, mas o nordeste Euroclidão levou o navio ao alto-mar antes de Fênix. O problema é a descrição do porto. W. M. Calder, seguindo James Smith, sustentou que Loutro era o único porto naquela costa próprio para um navio grande invernar e leu o grego, em linguagem de marinheiros, como “olhando a favor dos ventos sudoeste e noroeste”, isto é, voltado para o leste, ou supôs a descrição errada; o bispo Christopher Wordsworth tomou o sentido simples, voltado para o oeste, e escolheu a ocidental. Uma inscrição do tempo de Trajano achada em Loutro mostra que navios graneleiros egípcios invernavam ali."
  de:
    - "Phönix war eine Hafenstadt an der Südküste Kretas, der Hafen des im Landesinneren gelegenen Anopolis, das der Barrington Atlas und Pleiades in Loutro in der Region Sfakia ansetzen, unmittelbar nördlich der Insel Gavdos, dem Klauda der Apostelgeschichte. Zwei Häfen flankieren dort die kleine Halbinsel: die geschützte, nach Osten offene Bucht von Loutro und die Bucht von Phineka auf der Westseite, die den antiken Namen bewahrt. Das Phönix „der Lampäer“, das Strabon an die Landenge setzt, wo sich die Insel auf etwa hundert Stadien verengt, setzt der Barrington Atlas weiter östlich nahe Sellia an, als eigene Stadt."
    - "In Schönhafen, spät im Jahr, beschloss die Besatzung von Paulus' Schiff gegen seinen Rat weiterzufahren, „ob sie könnten kommen gen Phönix, zu überwintern, welches ist eine Anfurt an Kreta gegen Südwest und Nordwest“. Ein sanfter Südwind schien günstig, doch der Nordost, von der King-James-Bibel Euroclydon genannt, trieb das Schiff hinaus, bevor es Phönix erreichte. Die Hafenbeschreibung ist die Schwierigkeit. W. M. Calder hielt mit James Smith Loutro für den einzigen Überwinterungshafen großer Schiffe an dieser Küste und las das Griechische seemännisch als „dem Südwest- und Nordwestwind entlang hinabblickend“, also nach Osten gerichtet, oder hielt sie für irrig; Bischof Christopher Wordsworth nahm den einfachen Sinn, nach Westen, und wählte die westliche Bucht. Eine Inschrift aus Trajans Zeit in Loutro zeigt, dass dort ägyptische Getreideschiffe überwinterten."
  it:
    - "Fenice era una cittadina portuale sulla costa meridionale di Creta, il porto di Anopoli nell’entroterra, che il Barrington Atlas e Pleiades collocano a Loutro, nella regione di Sfakia, direttamente a nord dell’isolotto di Gavdos, la Clauda degli Atti. Due porti fiancheggiano là la piccola penisola: la baia riparata di Loutro, aperta a est, e la baia di Phineka sul lato occidentale, che conserva il nome antico. La Fenice «dei Lampei» che Strabone pone sull’istmo dove l’isola si restringe a circa cento stadi è collocata dal Barrington Atlas più a est, presso Sellia, come città distinta."
    - "A Buoni Porti, a stagione inoltrata, l’equipaggio decise, contro il parere di Paolo, di proseguire, «per cercare d’arrivare a Fenice, porto di Creta che guarda a Libeccio e a Maestro, e di passarvi l’inverno». Un «leggero scirocco» sembrò favorirli, ma il vento turbinoso Euraquilone spinse la nave al largo prima che raggiungesse Fenice. Il problema è la descrizione del porto. W. M. Calder, sulla scia di James Smith, ritenne Loutro l’unico porto di quella costa dove una grande nave potesse svernare e lesse il greco, in linguaggio marinaresco, come «che guarda lungo i venti di sud-ovest e di nord-ovest», cioè rivolto a est, oppure suppose la descrizione errata; il vescovo Christopher Wordsworth prese il senso piano, rivolto a ovest, e scelse la baia occidentale. Un’iscrizione del regno di Traiano trovata a Loutro mostra che vi svernavano le navi granarie egiziane."
  fr:
    - "Phénix (Phenice dans la version du roi Jacques) était une ville portuaire de la côte sud de la Crète, le port d’Anopolis, dans l’intérieur, que le Barrington Atlas et Pleiades placent à Loutro, dans la région de Sfakia, juste au nord de l’îlot de Gavdos, le Clauda des Actes. Deux ports bordent la petite péninsule : la baie abritée de Loutro, ouverte à l’est, et la baie de Phineka, du côté ouest, qui garde le nom antique. Le Phénix « des Lampiens » que Strabon situe sur l’isthme où l’île se resserre à environ cent stades est placé par le Barrington Atlas plus à l’est, près de Sellia, comme une ville distincte."
    - "À Beaux-Ports, tard dans la saison, l’équipage du navire de Paul décida, contre son avis, de repartir « pour tâcher d’atteindre Phénix, port de Crète qui regarde le sud-ouest et le nord-ouest, afin d’y passer l’hiver ». Un léger vent du sud les favorisa, mais le vent du nord-est, Euraquilon (Euroclydon dans la version du roi Jacques), chassa le navire en mer avant Phénix. La difficulté est la description du port. W. M. Calder, après James Smith, tenait Loutro pour le seul port de cette côte où hiverner un grand navire et lisait le grec, en langage de marin, comme « regardant le long des vents du sud-ouest et du nord-ouest », donc vers l’est, ou jugeait la description fautive ; l’évêque Christopher Wordsworth prit le sens simple, vers l’ouest, d’où la baie occidentale. Une inscription de Trajan trouvée à Loutro montre que des navires à blé égyptiens y hivernaient."
  nl:
    - "Fenix was een havenstad aan de zuidkust van Kreta, de haven van het in het binnenland gelegen Anopolis, die de Barrington Atlas en Pleiades plaatsen bij Loutro in de streek Sfakia, recht ten noorden van het eilandje Gavdos, het Klauda van Handelingen. Twee havens flankeren daar het kleine schiereiland: de beschutte baai van Loutro, naar het oosten open, en de baai van Phineka aan de westzijde, die de oude naam bewaart. Het Fenix “van de Lampiërs” dat Strabo plaatst op de landengte waar het eiland versmalt tot ongeveer honderd stadiën, wordt door de Barrington Atlas verder oostwaarts, bij Sellia, als een afzonderlijke stad geplaatst."
    - "Bij Schone Havens besloot de bemanning van Paulus' schip laat in het seizoen tegen zijn raad verder te varen, “of zij enigszins te Fenix konden aankomen om te overwinteren, zijnde een haven in Kreta, strekkende tegen het zuidwesten en tegen het noordwesten.” Een zachte zuidenwind scheen gunstig, maar de noordoostenwind Euroklydon dreef het schip de zee op vóór Fenix. De beschrijving van de haven is het probleem. W. M. Calder hield, James Smith volgend, Loutro voor de enige haven daar waar een groot schip kon overwinteren en las het Grieks in zeemanstaal als “uitziend langs de zuidwest- en noordwestenwinden”, dus naar het oosten gericht, of nam een onjuiste beschrijving aan; bisschop Christopher Wordsworth nam de gewone zin, naar het westen, en koos de westelijke baai. Een inscriptie uit Trajanus' tijd bij Loutro toont dat Egyptische graanschepen er overwinterden."
  cs:
    - "Foinix bylo přístavní město na jižním pobřeží Kréty, přístav vnitrozemské Anopole, které Barrington Atlas a Pleiades kladou do Loutra v oblasti Sfakia, přímo severně od ostrůvku Gavdos, Klaudy ze Skutků. Malý poloostrov tam ohraničují dva přístavy: chráněná zátoka Loutro, otevřená k východu, a zátoka Finika na západní straně, která si zachovala starověké jméno. Foinix „Lampijských“, který Strabón klade na šíji, kde se ostrov zužuje asi na sto stadií, klade Barrington Atlas dále na východ, poblíž Sellie, jako samostatné město."
    - "V Dobrých přístavech se koncem plavební sezony posádka Pavlovy lodi proti jeho radě rozhodla pokračovat v cestě v naději, že dosáhne Foinixu a tam přezimuje; byl to kretský přístav obrácený k jihozápadu a severozápadu. Mírný jižní vítr jim zdánlivě přál, ale severovýchodní vítr Euroklydon odnesl loď na moře, než Foinix dosáhla. Potíž působí popis přístavu. W. M. Calder, jda za Jamesem Smithem, pokládal Loutro za jediný přístav na tom pobřeží, vhodný pro přezimování velké lodi, a četl řečtinu v námořnické řeči jako „hledící po větrech jihozápadním a severozápadním“, tedy obrácený k východu, nebo předpokládal, že popis je mylný; biskup Christopher Wordsworth vzal prostý smysl, obrácený k západu, a zvolil západní zátoku. Nápis z doby Traianovy nalezený v Loutru ukazuje, že tam přezimovaly egyptské obilní lodě."
  pl:
    - "Fenike było portowym miastem na południowym wybrzeżu Krety, portem śródlądowej Anopolis, które Barrington Atlas i Pleiades umieszczają w Loutro w regionie Sfakia, wprost na północ od wysepki Gawdos, Klauda z Dziejów. Dwa porty otaczają tam mały półwysep: osłonięta zatoka Loutro, otwarta na wschód, i zatoka Fineka po stronie zachodniej, która zachowuje starożytną nazwę. Fenike „Lampijczyków”, które Strabon umieszcza na przesmyku, gdzie wyspa zwęża się do około stu stadiów, Barrington Atlas umieszcza dalej na wschód, koło Sellia, jako odrębne miasto."
    - "W Pięknych Przystaniach, późno w sezonie, załoga okrętu Pawła postanowiła wbrew jego radzie płynąć dalej, „owaby jakożkolwiek mogli przeprawiwszy się do Fenicyi, przezimować u portu Kreteńskiego, który leży między wiatrem południowym i zachodnim”. Łagodny wiatr południowy zdawał się sprzyjać, lecz Euroklidon, wicher północno-wschodni, wyrzucił okręt na morze przed Fenike. Trudność stanowi opis portu. W. M. Calder, idąc za Jamesem Smithem, uważał Loutro za jedyny port na tym wybrzeżu zdatny do zimowania dużego okrętu i czytał grecki tekst żeglarskim językiem jako „patrzący w dół wiatrów południowo-zachodniego i północno-zachodniego”, czyli zwrócony na wschód, albo uznawał opis za błędny; biskup Christopher Wordsworth przyjął zwykły sens, zwrócony na zachód, i wybrał zachodnią zatokę. Napis z czasów Trajana z Loutro pokazuje, że zimowały tam egipskie zbożowce."
  sv:
    - "Foinix var en hamnstad på Kretas sydkust, hamn för Anopolis inåt land, som Barrington Atlas och Pleiades placerar vid Loutro i regionen Sfakia, rakt norr om holmen Gavdos, Apostlagärningarnas Kauda. Två hamnar flankerar den lilla halvön där: den skyddade viken vid Loutro, öppen mot öster, och viken vid Phineka på västra sidan, som behåller det antika namnet. Det Foinix ”hos lampaierna” som Strabon placerar på näset där ön smalnar av till omkring hundra stadier placeras av Barrington Atlas längre österut, nära Sellia, som en separat stad."
    - "Vid Goda hamnarna, sent på säsongen, beslöt besättningen mot Paulus råd att fortsätta: man skulle ”försöka om man kunde komma fram till Fenix, en hamn på Kreta, som ligger skyddad mot sydväst och nordväst; där skulle de sedan stanna över vintern”. En lindrig sunnanvind tycktes gynna dem, men nordostorkanen Euroklydon drev skeppet ut till havs före Foinix. Hamnbeskrivningen är svårigheten. W. M. Calder höll, efter James Smith, Loutro för den enda hamnen på kusten där ett stort skepp kunde övervintra och läste grekiskan, på sjömansspråk, som ”blickande ned längs sydvästvinden och nordvästvinden”, alltså vänd mot öster, eller antog att beskrivningen var felaktig; biskop Christopher Wordsworth tog den enkla meningen, vänd mot väster, och valde västra viken. En inskription från Trajanus tid vid Loutro visar att egyptiska spannmålsskepp övervintrade där."
  nb:
    - "Føniks var en havneby på sørkysten av Kreta, havnen for Anopolis inne i landet, som Barrington Atlas og Pleiades plasserer ved Loutro i regionen Sfakia, rett nord for øya Gavdos, Klauda i Apostlenes gjerninger. To havner flankerer den lille halvøya der: den skjermede bukten Loutro, som åpner seg mot øst, og bukten Phineka på vestsiden, som beholder det gamle navnet. Føniks «hos lampierne» som Strabon setter på eidet der øya smalner til omkring hundre stadier, plasseres av Barrington Atlas lenger øst, nær Sellia, som en egen by."
    - "Ved Godhavn, sent på sesongen, bestemte mannskapet på Paulus' skip seg, mot hans råd, for å dra videre, «om de måskje kunde vinne frem og ta vinterhavn i Føniks, en havn på Kreta, som vender mot sydvest og nordvest». En svak sønnavind syntes å være gunstig for dem, men nordøstvinden Euroklydon drev skipet ut på havet før det nådde Føniks. Beskrivelsen av havnen er vanskeligheten. W. M. Calder, som fulgte James Smith, mente Loutro var den eneste havnen på den kysten som egnet seg for et stort skip å overvintre i, og leste det greske, på sjømannsspråk, som «ser ned mot sørvest- og nordvestvindene», det vil si vendt mot øst, eller antok ellers at beskrivelsen var feil; biskop Christopher Wordsworth tok den enkle meningen, vendt mot vest, og valgte den vestlige bukten. En inskripsjon fra Trajans tid funnet ved Loutro viser at egyptiske kornskip overvintret der."
  tl:
    - "Ang Fenix ay isang bayang daungan sa timog baybayin ng Creta, ang daungan ng Anopolis sa loob ng lupain, na inilalagay ng Barrington Atlas at Pleiades sa Loutro sa rehiyon ng Sfakia, direktang hilaga ng pulong Gavdos, ang Clauda ng Mga Gawa. Dalawang daungan ang nasa magkabilang gilid ng maliit na tangway roon: ang masisilungang look ng Loutro, na bukás sa silangan, at ang look ng Phineka sa kanlurang panig, na nagpapanatili ng sinaunang pangalan. Ang Fenix “ng mga Lampio” na inilalagay ni Strabo sa kipot ng lupa kung saan kumikitid ang pulo sa humigit-kumulang isandaang stadia ay inilalagay ng Barrington Atlas nang mas silangan, malapit sa Sellia, bilang hiwalay na bayan."
    - "Sa Mabubuting Daongan, huli sa panahon, nagpasyang magpatuloy ang mga tauhan ng barko ni Pablo laban sa payo niya, “baka sakaling sa anomang paraan ay makarating sila sa Fenix, at doon huminto sa tagginaw; na yao'y daungan ng Creta …” Pumabor ang banayad na hanging timog, ngunit itinaboy ng hilagang-silangang Euroclydon ang barko bago ang Fenix. Ang paglalarawan sa daungan ang suliranin. Kay W. M. Calder, kasunod ni James Smith, Loutro lamang ang daungang akma sa taglamig ng malaking barko, at ang Griyego sa wika ng mandaragat ay “nakatingin sa ibaba ng hanging timog-kanluran at hilagang-kanluran”, kaya nakaharap sa silangan, o mali ang paglalarawan; kinuha ni Obispo Christopher Wordsworth ang tahasang kahulugan, kanluran, at pinili ang kanlurang look. Ipinakikita ng inskripsiyon ni Trajan sa Loutro na doon nagtaglamig ang mga barkong butil ng Egipto."
  da:
    - "Føniks var en havneby på Kretas sydkyst, havn for Anopolis inde i landet, som Barrington Atlas og Pleiades placerer ved Loutro i egnen Sfakia, lige nord for øen Gavdos, Apostlenes Gerningers Klavde. To havne flankerer den lille halvø dér: Loutros beskyttede bugt, der åbner sig mod øst, og Phinekas bugt på vestsiden, som bevarer det gamle navn. Føniks »hos lampierne«, som Strabon placerer på landtangen, hvor øen smalner til omkring hundrede stadier, placerer Barrington Atlas længere mod øst, nær Sellia, som en særskilt by."
    - "I Gode Havne, sent på sæsonen, besluttede besætningen på Paulus' skib mod hans råd at sejle videre, »om man muligt kunde naa hen og overvintre i Føniks, en Havn paa Kreta, som vender imod Sydvest og Nordvest«. En mild sønden-vind syntes at begunstige dem, men nordøststormen Eurakvilo drev skibet ud på havet, før det nåede Føniks. Beskrivelsen af havnen er vanskeligheden. W. M. Calder, der fulgte James Smith, mente, at Loutro er den eneste havn på den kyst, der egner sig til, at et stort skib kan overvintre, og læste det græske, på sømandssprog, som »ser ned ad sydvest- og nordvestvindene«, det vil sige vendende mod øst, eller antog ellers, at beskrivelsen var fejlagtig; biskop Christopher Wordsworth tog den enkle mening, vendende mod vest, og valgte den vestlige bugt. En indskrift fra Trajans tid fundet i Loutro viser, at egyptiske kornskibe overvintrede der."
  sr:
    - "Финик је био лучки град на јужној обали Крита, пристаниште унутрашњег Анопоља, који Barrington Atlas и Pleiades смештају у Лутро у крају Сфакија, право северно од острвцета Гавдос, Клауде из Дела. Два пристаништа окружују то мало полуострво: заклоњени залив Лутро, окренут истоку, и залив Финика на западној страни, који чува старо име. Финик „Лампејаца“ који Страбон ставља на превлаку где се острво сужава на око сто стадија, Barrington Atlas помера даље на исток, близу Селије, као посебан град."
    - "У Добрим Пристаништима, касно у сезони, посада Павловог брода одлучила је против његовог савета да крене даље, „не би ли како могли доћи до Финика, и онде да зимују у пристаништу критском, које гледа к југу и к западу“. Благи јужни ветар као да им је био наклоњен, али северо-источни Евроклидон отерао је лађу на пучину пре него што је стигла до Финика. Тешкоћа је опис пристаништа. В. М. Колдер, следећи Џејмса Смита, држао је да је Лутро једино пристаниште на тој обали погодно да у њему зими велики брод, и читао је грчки, морнарским језиком, као „гледајући низ југозападни и северозападни ветар“, то јест окренуто истоку, или је претпостављао да је опис погрешан; бискуп Кристофер Вордсворт узео је обичан смисао, окренуто западу, и изабрао западни залив. Натпис из Трајанове владавине нађен у Лутру показује да су египатске житне лађе ту зимовале."
  hu:
    - "Főnix Kréta déli partján fekvő kikötőváros volt, a szárazföld belsejében lévő Anópolisz kikötője, amelyet a Barrington Atlas és a Pleiades a Szfakia vidékén fekvő Loutróra tesz, közvetlenül az ApCsel Kaudájaként azonosított Gavdos szigetecskétől északra. Két kikötő övezi ott a kis félszigetet: a keletre nyíló, védett loutrói öböl, és a nyugati oldalon a Phineka-öböl, amely az ókori nevet őrzi. A „lampaiak” Főnixét, amelyet Sztrabón a szigetet mintegy száz stadionnyira beszűkítő földszorosra tesz, a Barrington Atlas külön városként keletebbre, Sellia közelébe helyezi."
    - "A Szép Kikötőkben, késő évszakban, Pál hajójának legénysége tanácsa ellenére a továbbhajózás mellett döntött: „ha valami módon eljutva Fénixbe, Kréta kikötőjébe, mely délnyugot és északnyugot felé néz, kitelelhetnének”. Szelíd déli szél látszott kedvezni nekik, de az északkeleti Eurakülón a nyílt tengerre sodorta a hajót, mielőtt Főnixet elérte volna. A kikötő leírása a nehézség. W. M. Calder James Smith nyomán Loutrót tartotta az egyetlen olyan kikötőnek azon a parton, amely nagy hajó teleléséhez alkalmas, és a görög szöveget matrózok nyelvén úgy olvasta, hogy „a délnyugati és északnyugati szél irányában lefelé néz”, azaz keletre néz, vagy pedig a leírást tévesnek vélte; Christopher Wordsworth püspök a szó szerinti értelmet vette, nyugatra nézést, és a nyugati öblöt választotta. Egy Loutróban talált trajanusi kori felirat szerint egyiptomi gabonahajók teleltek ott."
  fi:
    - "Foiniks oli satamakaupunki Kreetan etelärannikolla, sisämaassa sijaitsevan Anopoliksen satama, jonka Barrington Atlas ja Pleiades sijoittavat Loutroon Sfakian alueella, suoraan Gavdos-luodon, Apostolien tekojen Klauda-saaren, pohjoispuolelle. Pienen niemimaan kyljillä on kaksi satamaa: itään avautuva suojainen Loutron lahti ja läntisellä puolella Phinekan lahti, joka säilyttää muinaisen nimen. Lampialaisten Foiniks, jonka Strabon asettaa kannakselle, jossa saari kapenee noin sadan stadionin levyiseksi, on Barrington Atlaksessa sijoitettu kauemmas itään, Sellian lähelle, erillisenä kaupunkina."
    - "Kauniissa Satamissa, myöhään kauden aikana, Paavalin laivan miehistö päätti hänen neuvostaan huolimatta jatkaa matkaa, ”voidakseen ehkä päästä talvehtimaan Foiniksiin, erääseen Kreetan satamaan, joka antaa lounaaseen ja luoteeseen päin”. Lempeä etelätuuli näytti suosivan heitä, mutta koillismyrsky Euroklydon ajoi laivan ulapalle ennen kuin se ehti Foiniksiin. Vaikeutena on sataman kuvaus. W. M. Calder, James Smithiä seuraten, piti Loutroa ainoana sen rannikon satamana, jossa suuri laiva voi talvehtia, ja luki kreikan merimieskielellä ”katsoen alas lounais- ja luoteistuulia”, eli itään päin, tai muuten arveli kuvauksen virheelliseksi; piispa Christopher Wordsworth otti kirjaimellisen merkityksen, länteen päin, ja valitsi läntisen lahden. Loutrosta löydetty Trajanuksen ajan kirjoitus osoittaa egyptiläisten viljalaivojen talvehtineen siellä."
  vi:
    - "Phê-nit là một thị trấn cảng trên bờ nam đảo Cơ-rết, cảng của Anopolis trong nội địa, mà Barrington Atlas và Pleiades đặt tại Loutro trong vùng Sfakia, ngay phía bắc đảo nhỏ Gavdos, tức Cơ-lô-đa trong sách Công Vụ. Hai vịnh nằm hai bên bán đảo nhỏ ở đó: vịnh Loutro có chỗ trú, mở về phía đông, và vịnh Phineka ở phía tây, giữ tên cổ. Phê-nit “của người Lampia” mà Strabo đặt ở eo đất nơi đảo thu hẹp còn khoảng một trăm stadia thì Barrington Atlas đặt xa hơn về phía đông, gần Sellia, như một thị trấn riêng."
    - "Tại Hải cảng Tốt, vào cuối mùa đi biển, thủy thủ đoàn của tàu Phao-lô quyết định, trái lời ông khuyên, đi tiếp, “ráng sức đến cảng Phê-nít, là cảng của đảo Cơ-rết, hướng phía tây nam và phía tây bắc, đặng qua mùa đông ở đó”. Một cơn gió nam nhẹ có vẻ thuận cho họ, nhưng gió đông bắc Ơ-ra-qui-lôn đẩy tàu ra khơi trước khi đến Phê-nit. Mô tả về cảng là điều khó. W. M. Calder, theo James Smith, cho Loutro là cảng duy nhất trên bờ ấy thích hợp cho tàu lớn qua mùa đông và đọc tiếng Hy Lạp, theo ngôn ngữ thủy thủ, là “nhìn xuống các ngọn gió tây nam và tây bắc”, tức quay mặt về đông, hoặc cho rằng mô tả bị nhầm; Giám mục Christopher Wordsworth theo nghĩa thẳng, quay mặt về tây, và chọn vịnh phía tây. Một bia ký thời Trajan tìm thấy ở Loutro cho thấy các tàu lúa mì Ai Cập qua mùa đông ở đó."
  ro:
    - "Fenix era un oraș-port pe coasta de sud a Cretei, portul orașului Anopolis din interior, pe care Barrington Atlas și Pleiades îl așază la Loutro, în regiunea Sfakia, chiar la nord de insulița Gavdos, Clauda din Faptele Apostolilor. Două porturi flanchează acolo mica peninsulă: golful adăpostit Loutro, deschis spre est, și golful Phineka, pe latura de vest, care păstrează numele antic. Fenixul „al lampienilor”, pe care Strabon îl așază pe istmul unde insula se îngustează la circa o sută de stadii, este plasat de Barrington Atlas mai spre est, lângă Sellia, ca oraș separat."
    - "La Bunele Porturi, târziu în sezon, echipajul corabiei lui Pavel a hotărât, împotriva sfatului lui, să meargă mai departe, „ca de ar puteà să ajungă să ierneze în Finica, limanul Critului, care caută spre Liva și spre Hor”. Un vânt blând de sud părea să-i favorizeze, dar Evroclidon, vântul de nord-est, a împins corabia în larg înainte de Fenix. Dificultatea o ridică descrierea portului. W. M. Calder, urmându-l pe James Smith, a socotit Loutro singurul port de pe acea coastă bun pentru iernarea unei corăbii mari și a citit greaca, în limbaj marinăresc, ca „privind în josul vânturilor de sud-vest și de nord-vest”, adică cu fața spre est, sau a presupus că descrierea e greșită; episcopul Christopher Wordsworth a luat sensul simplu, spre vest, și a ales golful vestic. O inscripție din vremea lui Traian, găsită la Loutro, arată că acolo iernau corăbiile egiptene cu grâu."
  bg:
    - "Финик бил пристанищен град на южния бряг на Крит, пристанището на разположения навътре Анополис, който Barrington Atlas и Pleiades поставят при Лутро в областта Сфакия, точно на север от островчето Гавдос, Клавдий от Деяния. Две пристанища обграждат малкия полуостров там: защитеният залив на Лутро, отворен на изток, и заливът Финика от западната страна, който пази древното име. Финик „на лампийците“, който Страбон поставя на провлака, където островът се стеснява до около сто стадия, Barrington Atlas поставя по-на изток, близо до Селия, като отделен град."
    - "В Добри пристанища, късно през сезона, екипажът на кораба на Павел решил против съвета му да продължи, за да стигне, „ако би било възможно, до Финик, пристанище Критско което гледа срещу югозападния и северозападния ветър, и там да презимуват“. Лек южен вятър сякаш им помагал, но североизточният Евроклидон изтласкал кораба в морето, преди да стигне Финик. Трудността е в описанието на пристанището. У. М. Калдър, следвайки Джеймс Смит, смятал Лутро за единственото пристанище по този бряг, годно за зимуване на голям кораб, и четял гръцкия текст на езика на моряците като „гледащо надолу по югозападния и северозападния вятър“, тоест обърнато на изток, или смятал описанието за погрешно; епископ Кристофър Уърдсуърт приел буквалния смисъл, обърнато на запад, и избрал западния залив. Надпис от времето на Траян, намерен в Лутро, показва, че египетски кораби с жито зимували там."
