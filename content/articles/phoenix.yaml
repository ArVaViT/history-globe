# Overview article (ADR 0007). Phoenix of Acts 27:12 lay at Loutro in Sfakia, south-west Crete (Barrington Atlas, Pleiades); the harbour itself is disputed between Loutro (Calder in the ISBE, after Smith) and the western bay at Phineka (Wordsworth; the map's point), shown without choosing. Strabo's Phoenix of the Lampians is placed by the Barrington Atlas near Sellia, a different town.
