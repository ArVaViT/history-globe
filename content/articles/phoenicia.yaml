body:
  en:
    - "Phoenicia is the Greek name for the narrow coast between the Lebanon mountains and the sea, from Arvad in the north past Byblos, Beirut and Sidon to Tyre and the foot of Carmel. The Greeks called its people Phoinikes, usually explained from phoinix, the purple-red of the dye they sold; the people called themselves Canaanites, and the Old Testament speaks only of Tyre, Sidon and Canaan. From these harbours, in the first millennium BC, sailed the ships that planted Carthage, by tradition in 814 BC, and carried the alphabet to Greece; Hiram of Tyre sent cedar and craftsmen to David and Solomon. The cities paid tribute to Assyria and Babylon, served Persia with their fleets, fell to Alexander when he took Tyre in 332 BC, and passed to Rome with Syria in 64 BC."
    - "Four verses of the New Testament name it. Jesus went into the borders of Tyre and Sidon, where a woman “a Greek, a Syrophenician by nation” begged him for her daughter; Matthew calls her a Canaanite. After Stephen's death the scattered believers “travelled as far as Phenice, and Cyprus, and Antioch, preaching the word to none but unto the Jews only”; Paul and Barnabas on their way to the council in Jerusalem “passed through Phenice and Samaria, declaring the conversion of the Gentiles”; and on his last voyage Paul found “a ship sailing over unto Phenicia”, landed at Tyre, where he stayed seven days with the disciples, and went on to Ptolemais. About AD 194 Septimius Severus made Syria Phoenice a province of its own."
    - "Today Phoenicia is the coast of Lebanon and the north-west corner of Israel. Tyre and Byblos have been World Heritage Sites since 1984, and Sidon's sea castle, Beirut's Roman baths and the purple-shell heaps of the old dye-works are still to be seen."
  ru:
    - "Финикия — греческое имя узкого побережья между Ливанскими горами и морем, от Арвада на севере мимо Библа, Бейрута и Сидона до Тира и подножия Кармила. Греки звали его жителей «фойникес», что обычно объясняют от «фойникс», пурпурно-красного цвета краски, которой они торговали; сами они звали себя Хананеями, и Ветхий Завет говорит только о Тире, Сидоне и Ханаане. Из этих гаваней в I тысячелетии до н. э. уходили корабли, основавшие Карфаген, по преданию в 814 г. до н. э., и принёсшие в Грецию алфавит; Хирам Тирский посылал кедр и мастеров Давиду и Соломону. Города платили дань Ассирии и Вавилону, служили Персии своим флотом, пали перед Александром, взявшим Тир в 332 г. до н. э., и отошли к Риму вместе с Сирией в 64 г. до н. э."
    - "В Новом Завете её называют четыре стиха. Иисус пришёл в пределы Тирские и Сидонские, где женщина, «язычница, родом сирофиникиянка», просила Его за свою дочь; Матфей зовёт её Хананеянкой. После смерти Стефана рассеявшиеся верующие «прошли до Финикии, и Кипра, и Антиохии, никому не проповедуя слово, кроме Иудеев»; Павел и Варнава по дороге на собор в Иерусалим проходили Финикию и Самарию, «рассказывая об обращении язычников»; а в последнем плавании Павел нашёл «корабль, идущий в Финикию», сошёл в Тире, где семь дней пробыл с учениками, и двинулся в Птолемаиду. Около 194 г. н. э. Септимий Север сделал Финикийскую Сирию отдельной провинцией."
    - "Сегодня Финикия — побережье Ливана и северо-западный угол Израиля. Тир и Библ с 1984 года — объекты Всемирного наследия; морской замок Сидона, римские бани Бейрута и груды раковин от старых красилен пурпура видны до сих пор."
  uk:
    - "Фінікія — грецька назва вузького узбережжя між Ліванськими горами й морем, від Арвада на півночі повз Библ, Бейрут і Сідон до Тіру та підніжжя Кармелю. Греки називали її народ Phoinikes, що зазвичай виводять від phoinix, пурпурно-червоного кольору барвника, яким вони торгували; самі ж вони називали себе ханаанеями, а Старий Завіт згадує лише Тір, Сідон і Ханаан. З цих гаваней у I тис. до н. е. вирушали кораблі, що заснували Карфаген — за переказом, 814 р. до н. е., — і понесли до Греції алфавіт; Хірам Тірський посилав кедр і майстрів Давидові та Соломонові. Міста платили данину Ассирії й Вавилону, служили Персії своїми флотами, впали перед Александром, коли той узяв Тір 332 р. до н. е., і 64 р. до н. е. разом із Сирією перейшли до Риму."
    - "Чотири вірші Нового Завіту називають її. Ісус пішов у межі Тіру й Сідона, де жінка, «Грекиня, родом Сирофиникиянка», просила Його за дочку; Матвій називає її хананеянкою. Після смерті Стефана розсіяні віруючі «пійшли аж у Финикию, Кипр і Антиохию, нїкому не проповідуючи слова, тільки одним Жидам»; Павло й Варнава, ідучи на собор до Єрусалима, «проходили Финикию та Самарию, оповідуючи про наверненнє поган»; а в останню подорож Павло знайшов «корабель, що плив у Финикию», зійшов на берег у Тірі, де пробув сім днів з учнями, і поплив далі до Птолемаїди. Близько 194 р. н. е. Септимій Север виділив Сирію Фінікійську в окрему провінцію."
    - "Сьогодні Фінікія — це узбережжя Лівану та північно-західний кут Ізраїлю. Тір і Библ є об’єктами Світової спадщини з 1984 року, а морський замок Сідона, римські лазні Бейрута та купи пурпурових раковин від давніх красильних майстерень можна побачити й досі."
  es:
    - "Fenicia es el nombre griego de la estrecha costa entre los montes del Líbano y el mar, desde Arvad en el norte, pasando por Biblos, Beirut y Sidón, hasta Tiro y el pie del Carmelo. Los griegos llamaban a su pueblo phoinikes, que suele explicarse por phoinix, el rojo púrpura del tinte que vendían; el pueblo se llamaba a sí mismo cananeo, y el Antiguo Testamento habla solo de Tiro, Sidón y Canaán. De estos puertos zarparon, en el primer milenio a. C., las naves que fundaron Cartago, según la tradición en 814 a. C., y llevaron el alfabeto a Grecia; Hiram de Tiro envió cedro y artesanos a David y a Salomón. Las ciudades pagaron tributo a Asiria y a Babilonia, sirvieron a Persia con sus flotas, cayeron ante Alejandro cuando tomó Tiro en 332 a. C. y pasaron a Roma con Siria en 64 a. C."
    - "Cuatro versículos del Nuevo Testamento la nombran. Jesús fue a los términos de Tiro y de Sidón, donde una mujer «Griega, Sirofenisa de nación» le rogó por su hija; Mateo la llama cananea. Tras la muerte de Esteban, los creyentes dispersos «anduvieron hasta Fenicia, y Cipro, y Antioquía, no hablando á nadie la palabra, sino sólo á los Judíos»; Pablo y Bernabé, de camino al concilio de Jerusalén, «pasaron por la Fenicia y Samaria, contando la conversión de los Gentiles»; y en su último viaje Pablo halló «un barco que pasaba á Fenicia», desembarcó en Tiro, donde se quedó siete días con los discípulos, y siguió a Tolemaida. Hacia 194 d. C. Septimio Severo hizo de Siria Fenicia una provincia propia."
    - "Hoy Fenicia es la costa del Líbano y el rincón noroeste de Israel. Tiro y Biblos son Patrimonio Mundial desde 1984, y aún pueden verse el castillo del mar de Sidón, los baños romanos de Beirut y los montones de conchas de púrpura de las antiguas tintorerías."
  pt:
    - "Fenícia é o nome grego da estreita costa entre as montanhas do Líbano e o mar, de Arvade, no norte, passando por Biblos, Beirute e Sidom até Tiro e o pé do Carmelo. Os gregos chamavam seu povo de phoinikes, em geral explicado por phoinix, o vermelho-púrpura do corante que vendiam; o povo se chamava cananeu, e o Antigo Testamento fala apenas de Tiro, Sidom e Canaã. Desses portos, no primeiro milênio a.C., partiram os navios que fundaram Cartago, segundo a tradição em 814 a.C., e levaram o alfabeto à Grécia; Hirão de Tiro enviou cedro e artífices a Davi e Salomão. As cidades pagaram tributo à Assíria e à Babilônia, serviram à Pérsia com suas frotas, caíram diante de Alexandre quando ele tomou Tiro em 332 a.C. e passaram a Roma com a Síria em 64 a.C."
    - "Quatro versículos do Novo Testamento a nomeiam. Jesus foi à região de Tiro e Sidom, onde uma mulher “grega, de origem siro-fenícia” lhe implorou pela filha; Mateus a chama de cananeia. Depois da morte de Estêvão, os crentes dispersos “viajaram até a Fenícia, Chipre e Antioquia, anunciando a palavra somente aos judeus”; Paulo e Barnabé, a caminho do concílio em Jerusalém, “passaram tanto pela Fenícia quanto por Samaria, declarando a conversão dos gentios”; e na última viagem Paulo achou “um navio que fazia a travessia para a Fenícia”, desembarcou em Tiro, onde ficou sete dias com os discípulos, e seguiu para Ptolemaida. Por volta de 194 d.C., Sétimo Severo fez da Síria Fenícia uma província à parte."
    - "Hoje a Fenícia é a costa do Líbano e o canto noroeste de Israel. Tiro e Biblos são Patrimônio Mundial desde 1984, e o castelo marítimo de Sidom, os banhos romanos de Beirute e os montes de conchas de púrpura das antigas tinturarias ainda podem ser vistos."
  de:
    - "Phönizien ist der griechische Name für die schmale Küste zwischen dem Libanongebirge und dem Meer, von Arwad im Norden über Byblos, Beirut und Sidon bis Tyrus und zum Fuß des Karmel. Die Griechen nannten sein Volk Phoinikes, meist von phoinix erklärt, dem Purpurrot des Farbstoffs, den sie verkauften; das Volk selbst nannte sich Kanaanäer, und das Alte Testament spricht nur von Tyrus, Sidon und Kanaan. Aus diesen Häfen segelten im 1. Jahrtausend v. Chr. die Schiffe, die Karthago gründeten, der Überlieferung nach 814 v. Chr., und das Alphabet nach Griechenland trugen; Hiram von Tyrus schickte David und Salomo Zedernholz und Handwerker. Die Städte zahlten Assyrien und Babylon Tribut, dienten Persien mit ihren Flotten, fielen an Alexander, als er 332 v. Chr. Tyrus einnahm, und kamen 64 v. Chr. mit Syrien an Rom."
    - "Vier Verse des Neuen Testaments nennen es. Jesus ging in das Gebiet von Tyrus und Sidon, wo eine Frau, „ein griechisches Weib aus Syrophönizien“, ihn für ihre Tochter bat; Matthäus nennt sie eine Kanaaniterin. Nach Stephanus' Tod „gingen“ die zerstreuten Gläubigen „umher bis gen Phönizien und Zypern und Antiochien und redeten das Wort zu niemand denn allein zu den Juden“; Paulus und Barnabas „zogen“ auf dem Weg zum Konzil in Jerusalem „durch Phönizien und Samarien und erzählten die Bekehrung der Heiden“; und auf seiner letzten Reise landete Paulus, nachdem sie „ein Schiff fanden, das nach Phönizien fuhr“, in Tyrus, blieb sieben Tage bei den Jüngern und zog weiter nach Ptolemais. Um 194 n. Chr. machte Septimius Severus Syria Phoenice zu einer eigenen Provinz."
    - "Heute ist Phönizien die Küste des Libanon und die Nordwestecke Israels. Tyrus und Byblos sind seit 1984 Welterbestätten, und die Seeburg von Sidon, die römischen Bäder von Beirut und die Purpurschneckenhaufen der alten Färbereien sind noch zu sehen."
  fr:
    - "Phénicie est le nom grec de l’étroite côte entre les monts du Liban et la mer, d’Arvad au nord, en passant par Byblos, Beyrouth et Sidon, jusqu’à Tyr et au pied du Carmel. Les Grecs appelaient ses habitants Phoinikes, d’ordinaire expliqué par phoinix, le rouge pourpre de la teinture qu’ils vendaient ; ils se disaient eux-mêmes Cananéens, et l’Ancien Testament ne parle que de Tyr, de Sidon et de Canaan. De ces ports, au premier millénaire av. J.-C., partirent les navires qui fondèrent Carthage, selon la tradition en 814 av. J.-C., et portèrent l’alphabet en Grèce ; Hiram de Tyr envoya cèdres et artisans à David et à Salomon. Les villes payèrent tribut à l’Assyrie et à Babylone, servirent la Perse de leurs flottes, tombèrent devant Alexandre quand il prit Tyr en 332 av. J.-C., et passèrent à Rome avec la Syrie en 64 av. J.-C."
    - "Quatre versets du Nouveau Testament la nomment. Jésus alla dans le territoire de Tyr et de Sidon, où une femme « grecque, syro-phénicienne d’origine » le supplia pour sa fille ; Matthieu l’appelle cananéenne. Après la mort d’Étienne, les croyants dispersés « allèrent jusqu’en Phénicie, dans l’île de Chypre, et à Antioche, annonçant la parole seulement aux Juifs » ; Paul et Barnabas, en route pour le concile de Jérusalem, passèrent « à travers la Phénicie et la Samarie, racontant la conversion des païens » ; et lors de son dernier voyage, Paul trouva « un navire qui faisait la traversée vers la Phénicie », aborda à Tyr, où il resta sept jours avec les disciples, et poursuivit jusqu’à Ptolémaïs. Vers 194 apr. J.-C., Septime Sévère fit de la Syrie Phénicie une province distincte."
    - "Aujourd’hui, la Phénicie est la côte du Liban et le coin nord-ouest d’Israël. Tyr et Byblos sont inscrites au patrimoine mondial depuis 1984, et le château de mer de Sidon, les bains romains de Beyrouth et les tas de coquilles de pourpre des anciennes teintureries se voient encore."
  it:
    - "Fenicia è il nome greco della stretta costa tra i monti del Libano e il mare, da Arvad a nord oltre Biblo, Beirut e Sidone fino a Tiro e ai piedi del Carmelo. I Greci chiamavano il suo popolo Phoinikes, di solito spiegato da phoinix, il rosso porpora della tintura che vendevano; il popolo si diceva cananeo, e l’Antico Testamento parla solo di Tiro, Sidone e Canaan. Da questi porti, nel I millennio a.C., salparono le navi che fondarono Cartagine, per tradizione nell’814 a.C., e portarono l’alfabeto in Grecia; Chiram di Tiro mandò cedro e artigiani a Davide e a Salomone. Le città pagarono tributo all’Assiria e a Babilonia, servirono la Persia con le loro flotte, caddero davanti ad Alessandro quando prese Tiro nel 332 a.C. e passarono a Roma con la Siria nel 64 a.C."
    - "Quattro versetti del Nuovo Testamento la nominano. Gesù andò verso i confini di Tiro e di Sidone, dove una donna «pagana, di nazione sirofenicia» lo pregò per la figlia; Matteo la dice cananea. Dopo la morte di Stefano i credenti dispersi «passarono fino in Fenicia, in Cipro e in Antiochia, non annunziando la Parola ad alcuno se non ai Giudei soltanto»; Paolo e Barnaba, andando al concilio di Gerusalemme, «traversarono la Fenicia e la Samaria, raccontando la conversione dei Gentili»; e nell’ultimo viaggio Paolo trovò «una nave che passava in Fenicia», approdò a Tiro, dove rimase sette giorni con i discepoli, e proseguì per Tolemaide. Verso il 194 d.C. Settimio Severo fece della Siria Fenicia una provincia a sé."
    - "Oggi la Fenicia è la costa del Libano e l’angolo nord-occidentale di Israele. Tiro e Biblo sono Patrimonio dell’Umanità dal 1984, e il castello sul mare di Sidone, le terme romane di Beirut e i cumuli di conchiglie di porpora delle antiche tintorie si vedono ancora."
  pl:
    - "Fenicja to greckie imię wąskiego wybrzeża między górami Libanu a morzem, od Arwadu na północy przez Biblos, Bejrut i Sydon do Tyru i podnóża Karmelu. Grecy nazywali jej mieszkańców Phoinikes, co zwykle tłumaczy się od phoinix, purpurowej czerwieni barwnika, który sprzedawali; sami nazywali się Kananejczykami, a Stary Testament mówi tylko o Tyrze, Sydonie i Kanaanie. Z tych portów w I tysiącleciu p.n.e. wypływały okręty, które założyły Kartaginę, według tradycji w 814 roku p.n.e., i zaniosły alfabet do Grecji; Hiram z Tyru posłał cedr i rzemieślników Dawidowi i Salomonowi. Miasta płaciły trybut Asyrii i Babilonowi, służyły Persji swymi flotami, padły przed Aleksandrem, gdy zdobył Tyr w 332 roku p.n.e., i wraz z Syrią przeszły do Rzymu w 64 roku p.n.e."
    - "Cztery wersety Nowego Testamentu ją wymieniają. Jezus udał się na granice Tyru i Sydonu, gdzie niewiasta „Grecka, rodem z Syrofenicyi” prosiła go za córkę; Mateusz nazywa ją Kananejką. Po śmierci Szczepana rozproszeni wierzący „przeszli aż do Fenicyi i Cypru, i do Antyjochii, nikomu nie opowiadając słowa Bożego, tylko samym Żydom”; Paweł i Barnaba w drodze na sobór do Jerozolimy „szli przez Fenicyję i Samaryję, powiadając o nawróceniu poganów”; a w ostatniej podróży Paweł znalazł „okręt, który miał płynąć do Fenicyi”, wylądował w Tyrze, gdzie spędził siedem dni z uczniami, i popłynął dalej do Ptolemaidy. Około 194 roku n.e. Septymiusz Sewer uczynił z Syrii Fenicji osobną prowincję."
    - "Dziś Fenicja to wybrzeże Libanu i północno-zachodni róg Izraela. Tyr i Biblos znajdują się na liście światowego dziedzictwa od 1984 roku, a morski zamek Sydonu, rzymskie łaźnie Bejrutu i hałdy muszli purpurowych dawnych farbiarni można nadal oglądać."
  cs:
    - "Fénicie je řecké jméno úzkého pobřeží mezi pohořím Libanon a mořem, od Arvadu na severu přes Byblos, Bejrút a Sidón k Týru a úpatí Karmelu. Řekové nazývali její lid Foinikes, obvykle z foinix, purpurově červené barvy, kterou prodávali; lid sám se nazýval Kanaánci a Starý zákon mluví jen o Týru, Sidónu a Kanaánu. Z těchto přístavů v prvním tisíciletí př. n. l. plynuly lodě, které založily Kartágo, podle tradice roku 814 př. n. l., a přenesly abecedu do Řecka; Chíram Týrský posílal cedr a řemeslníky Davidovi a Šalomounovi. Města platila tribut Asýrii a Babylónu, sloužila Persii svými flotilami, padla Alexandrovi, když roku 332 př. n. l. dobyl Týr, a roku 64 př. n. l. přešla se Sýrií k Římu."
    - "Čtyři verše Nového zákona ji jmenují. Ježíš vešel do končin Týru a Sidónu, kde ho žena, „pohanka, Syrofenitská rodem“, prosila za dceru; Matouš ji nazývá Kananejkou. Po Štěpánově smrti rozptýlení věřící „přišli až do Fenicen a Cypru a do Antiochie, žádnému nemluvíce slova Božího než samým toliko Židům“; Pavel a Barnabáš na cestě na jeruzalémský sněm „šli skrze Fenicen a Samaří, vypravujíce o obrácení pohanů na víru“; a na své poslední plavbě Pavel našel „lodí, kteráž měla plouti do Fenicen“, vystoupil v Týru, kde zůstal sedm dní s učedníky, a pokračoval do Ptolemaidy. Kolem roku 194 n. l. učinil Septimius Severus ze Syria Phoenice samostatnou provincii."
    - "Dnes je Fénicie pobřeží Libanonu a severozápadní roh Izraele. Týr a Byblos jsou od roku 1984 světovým dědictvím a mořský hrad v Sidónu, římské lázně v Bejrútu i hromady purpurových lastur ze starých barvíren lze dosud vidět."
  nl:
    - "Fenicië is de Griekse naam voor de smalle kust tussen het Libanongebergte en de zee, van Arwad in het noorden langs Byblos, Beiroet en Sidon tot Tyrus en de voet van de Karmel. De Grieken noemden de bewoners Phoinikes, meestal verklaard uit phoinix, het purperrood van de verf die zij verkochten; de bewoners noemden zichzelf Kanaänieten, en het Oude Testament spreekt alleen van Tyrus, Sidon en Kanaän. Vanuit deze havens voeren in het 1e millennium v.Chr. de schepen die Carthago stichtten, volgens de overlevering in 814 v.Chr., en het alfabet naar Griekenland brachten; Hiram van Tyrus zond cederhout en ambachtslieden naar David en Salomo. De steden betaalden schatting aan Assyrië en Babylon, dienden Perzië met hun vloten, vielen aan Alexander toen hij Tyrus in 332 v.Chr. nam, en gingen in 64 v.Chr. met Syrië over aan Rome."
    - "Vier verzen van het Nieuwe Testament noemen het. Jezus ging naar de grensstreken van Tyrus en Sidon, waar een vrouw, “een Griekse vrouw, van geboorte uit Syro-Fenicië”, hem om haar dochter smeekte; Mattheüs noemt haar een Kanaänitische. Na de dood van Stefanus gingen de verstrooide gelovigen, zegt Handelingen, “het land door tot Fenicië toe, en Cyprus, en Antiochië, tot niemand het Woord sprekende, dan alleen tot de Joden”; Paulus en Barnabas reisden op weg naar het concilie te Jeruzalem “door Fenicië en Samarie, verhalende de bekering der heidenen”; en op zijn laatste reis vond Paulus “een schip ... dat naar Fenicië overvoer”, landde te Tyrus, waar hij zeven dagen bij de discipelen bleef, en trok verder naar Ptolemaïs. Omstreeks 194 n.Chr. maakte Septimius Severus van Syria Phoenice een eigen provincie."
    - "Tegenwoordig is Fenicië de kust van Libanon en de noordwesthoek van Israël. Tyrus en Byblos zijn sinds 1984 Werelderfgoed, en het zeekasteel van Sidon, de Romeinse baden van Beiroet en de hopen purperslakken van de oude verfwerkplaatsen zijn nog te zien."
  sv:
    - "Fenicien är det grekiska namnet på den smala kusten mellan Libanonbergen och havet, från Arvad i norr förbi Byblos, Beirut och Sidon till Tyros och foten av Karmel. Grekerna kallade folket phoinikes, vanligen förklarat av phoinix, det purpurröda i färgen de sålde; folket kallade sig själva kananéer, och Gamla testamentet talar bara om Tyros, Sidon och Kanaan. Från dessa hamnar seglade under första årtusendet f.Kr. skeppen som grundade Kartago, enligt traditionen 814 f.Kr., och förde alfabetet till Grekland; Hiram av Tyros sände cederträ och hantverkare till David och Salomo. Städerna betalade tribut till Assyrien och Babylon, tjänade Persien med sina flottor, föll till Alexander när han intog Tyros 332 f.Kr., och övergick till Rom med Syrien 64 f.Kr."
    - "Fyra verser i Nya testamentet nämner det. Jesus gick in i Tyros och Sidons gränstrakter, där en kvinna, ”grekisk kvinna av syrofenicisk härkomst”, bad honom för sin dotter; Matteus kallar henne kananeisk. Efter Stefanos död, heter det om de kringspridda troende, att de ”drogo emellertid omkring ända till Fenicien och Cypern och Antiokia, men förkunnade icke ordet för andra än för judar”; Paulus och Barnabas på väg till rådet i Jerusalem ”foro genom Fenicien och Samarien och förtäljde utförligt om hedningarnas omvändelse”; och på sin sista resa fann Paulus ”ett skepp som skulle fara över till Fenicien”, landade i Tyros, där han stannade sju dagar hos lärjungarna, och fortsatte till Ptolemais. Omkring 194 e.Kr. gjorde Septimius Severus Syria Foinike till en egen provins."
    - "I dag är Fenicien Libanons kust och Israels nordvästra hörn. Tyros och Byblos har varit världsarv sedan 1984, och Sidons sjöfästning, Beiruts romerska bad och de gamla färgeriernas högar av purpurmusslor kan ännu ses."
  nb:
    - "Fønikia er det greske navnet på den smale kysten mellom Libanonfjellene og havet, fra Arvad i nord forbi Byblos, Beirut og Sidon til Tyros og foten av Karmel. Grekerne kalte folket Phoinikes, vanligvis forklart ut fra phoinix, den purpurrøde fargen de solgte; folket kalte seg selv kanaaneere, og Det gamle testamente nevner bare Tyros, Sidon og Kanaan. Fra disse havnene seilte i det første årtusen f.Kr. skipene som grunnla Kartago, etter tradisjonen i 814 f.Kr., og brakte alfabetet til Hellas; Hiram av Tyros sendte sedertre og håndverkere til David og Salomo. Byene betalte skatt til Assyria og Babylon, tjente Persia med flåtene sine, falt til Aleksander da han tok Tyros i 332 f.Kr., og gikk over til Roma sammen med Syria i 64 f.Kr."
    - "Fire vers i Det nye testamente nevner det. Jesus dro til Tyros' og Sidons landemerker, der en kvinne, «en hedensk kvinne, syrofønikisk av ætt», ba ham for datteren sin; Matteus kaller henne en «kananeisk kvinne». Etter Stefanus' død drog de adspredte «omkring like til Fønikia og Kypern og Antiokia, men talte ikke ordet til andre enn jøder»; Paulus og Barnabas på vei til konsilet i Jerusalem drog «gjennem Fønikia og Samaria, idet de fortalte om hedningenes omvendelse»; og på sin siste reise fant Paulus «et skib som skulde fare rett over til Fønikia», gikk i land i Tyros, hvor han ble sju dager hos disiplene, og dro videre til Ptolemais. Omkring 194 e.Kr. gjorde Septimius Severus Syria Phoenice til en egen provins."
    - "I dag er Fønikia kysten av Libanon og nordvesthjørnet av Israel. Tyros og Byblos har vært verdensarvsteder siden 1984, og Sidons sjøborg, Beiruts romerske bad og purpursneglehaugene fra de gamle fargeriene kan fortsatt sees."
  tl:
    - "Pangalang Griyego ang Fenicia sa makipot na baybayin sa pagitan ng mga bundok ng Libano at ng dagat, mula Arvad sa hilaga, sa Byblos, Beirut at Sidon hanggang Tiro at paanan ng Carmel. Phoinikes ang tawag ng mga Griyego sa mga tao nito, karaniwang ipinaliliwanag mula sa phoinix, ang pula-purpurang tinang ipinagbibili nila; Cananeo ang tawag nila sa sarili, at Tiro, Sidon at Canaan lamang ang nasa Lumang Tipan. Mula sa mga daungang ito, noong unang milenyo BK, naglayag ang mga barkong nagtatag ng Cartago, ayon sa tradisyon noong 814 BK, at nagdala ng alpabeto sa Grecia; nagpadala si Hiram ng Tiro ng sedro at manggagawa kina David at Salomon. Nagbayad ng tributo ang mga lungsod sa Asiria at Babilonia, naglingkod sa Persia gamit ang hukbong-dagat, bumagsak kay Alejandro nang sakupin niya ang Tiro noong 332 BK, at napunta sa Roma kasama ng Siria noong 64 BK."
    - "Apat na talata ng Bagong Tipan ang nagpapangalan dito. Pumasok si Jesus sa mga hangganan ng Tiro at Sidon, kung saan isang babae, “isang Griega, isang Sirofenisa, ayon sa lahi”, ay namanhik sa kaniya para sa anak niyang babae; Cananea ang tawag sa kaniya ni Mateo. Pagkamatay ni Esteban, ang mga nagsipangalat na mananampalataya “nangaglakbay hanggang sa Fenicia, at sa Chipre, at sa Antioquia, na hindi nagsaysay kanino man ng salita kundi sa mga Judio lamang”; sina Pablo at Bernabe patungo sa kapulungan sa Jerusalem “tinahak ang Fenicia at Samaria, na isinasaysay ang pagbabalik-loob ng mga Gentil”; sa huling paglalayag, nakasumpong si Pablo ng “isang daong na dumaraang patungo sa Fenicia”, dumaong sa Tiro, nanatili roon nang 7 araw kasama ang mga alagad, at nagpatuloy sa Tolemaida. Mga AD 194, ginawa ni Septimio Severo na sariling lalawigan ang Siria Fenicia."
    - "Sa ngayon, ang Fenicia ay ang baybayin ng Libano at ang hilagang-kanlurang sulok ng Israel. Ang Tiro at Byblos ay mga Pook ng Pandaigdigang Pamana mula pa noong 1984, at makikita pa rin ang kastilyong-dagat ng Sidon, ang mga paliguang Romano ng Beirut at ang mga bunton ng kabibeng purpura ng lumang gawaan ng tina."
  da:
    - "Fønikien er det græske navn for den smalle kyst mellem Libanonbjergene og havet, fra Arvad i nord forbi Byblos, Beirut og Sidon til Tyrus og foden af Karmel. Grækerne kaldte dets folk phoinikes, sædvanligvis forklaret ud fra phoinix, det purpurrøde i den farve, de solgte; folket kaldte sig selv kana'anæere, og Det Gamle Testamente taler kun om Tyrus, Sidon og Kana'an. Fra disse havne sejlede i 1. årtusinde f.Kr. skibene, der anlagde Karthago, ifølge traditionen i 814 f.Kr., og bragte alfabetet til Grækenland; Hiram af Tyrus sendte cedertræ og håndværkere til David og Salomo. Byerne betalte skat til Assyrien og Babylon, tjente Persien med deres flåder, faldt til Alexander, da han tog Tyrus i 332 f.Kr., og gik med Syrien til Rom i 64 f.Kr."
    - "Fire vers i Det Nye Testamente nævner det. Jesus gik ind i Tyrus' og Sidons egne, hvor en kvinde, »græsk, af Herkomst en Syrofønikerinde«, bad ham for sin datter; Mattæus kalder hende en kana'anæisk kvinde. Efter Stefanus' død »vandrede« de spredte troende »om lige til Fønikien og Kypern og Antiokia, og de talte ikke Ordet til nogen uden til Jøder alene«; Paulus og Barnabas »droge igennem Fønikien og Samaria og fortalte om Hedningernes Omvendelse« på vej til mødet i Jerusalem; og på sin sidste rejse fandt Paulus »et Skib, som skulde gaa lige til Fønikien«, landede i Tyrus, hvor han blev syv dage hos disciplene, og drog videre til Ptolemais. Omkring 194 e.Kr. gjorde Septimius Severus Syria Phoenice til en provins for sig."
    - "I dag er Fønikien Libanons kyst og det nordvestlige hjørne af Israel. Tyrus og Byblos har været på verdensarvslisten siden 1984, og Sidons havborg, Beiruts romerske bade og de gamle farverieres bunker af purpursneglskaller kan stadig ses."
  sr:
    - "Феникија је грчко име за уску обалу између ливанских планина и мора, од Арвада на северу преко Библа, Бејрута и Сидона до Тира и подножја Кармила. Грци су њене људе звали Фојнике, што се обично објашњава од фојникс, пурпурно-црвене боје коју су продавали; сами су себе звали Хананејима, а Стари завет говори само о Тиру, Сидону и Ханану. Из тих пристаништа, у 1. миленијуму п. н. е., испловиле су лађе које су основале Картагину, по предању 814. п. н. е., и однеле писмо у Грчку; Хирам из Тира слао је кедар и мајсторе Давиду и Соломуну. Градови су плаћали данак Асирији и Вавилону, служили Персији својим флотама, пали Александру кад је 332. п. н. е. узео Тир, и прешли на Рим са Сиријом 64. п. н. е."
    - "Четири стиха Новог завета је помињу. Исус је отишао у крајеве тирске и сидонске, где Га је жена, „Гркиња родом Сирофиничанка“, молила за своју кћер; Матеј је зове Хананејком. После Стефанове смрти расејани верници „прођоше тја до Финикије и Кипра и Антиохије, ником не говорећи реч до самим Јеврејима“; Павле и Варнава на путу на сабор у Јерусалиму „пролажаху кроз Финикију и Самарију казујући обраћање незнабожаца“; а на свом последњем путовању Павле је нашао „лађу која полази у Финикију“, пристао у Тиру, где је остао седам дана с ученицима, и отишао у Птолемаиду. Око 194. н. е. Септимије Север је од Сирије Феникије начинио засебну провинцију."
    - "Данас је Феникија обала Либана и северозападни угао Израела. Тир и Библ су на листи светске баштине од 1984, а сидонски морски замак, бејрутска римска купатила и гомиле пурпурних шкољки стародавних радионица боје још се виде."
  hu:
    - "Fönícia a Libanon-hegység és a tenger közötti keskeny part görög neve, az északi Arvádtól Büblosz, Bejrút és Szidón mellett Tíruszig és a Kármel lábáig. A görögök népét phoinikesnek nevezték, ami általában a phoinixből, az általuk árult festék bíbor-vörös színéből magyarázható; maguk kánaánitáknak nevezték magukat, az Ószövetség pedig csak Tíruszról, Szidónról és Kánaánról beszél. Ezekből a kikötőkből indultak a Kr. e. 1. évezredben azok a hajók, amelyek Karthágót alapították, a hagyomány szerint Kr. e. 814-ben, és az ábécét Görögországba vitték; a tíruszi Hírám cédrust és mestereket küldött Dávidnak és Salamonnak. A városok adót fizettek Asszíriának és Babilonnak, flottájukkal Perzsiát szolgálták, Nagy Alexandrosz kezére kerültek, amikor Kr. e. 332-ben bevette Tíruszt, és Szíriával együtt Kr. e. 64-ben Rómához kerültek."
    - "Az Újszövetség négy verse nevezi meg. Jézus Tírusz és Szidón határára ment, ahol egy asszony – „pogány vala síro-fenicziai származású” – a leányáért könyörgött neki; Máté kánaáni asszonynak nevezi. István halála után a szétszóródott hívők „eljutának Fenicziáig, Cziprusig és Antiókhiáig, senkinek nem prédikálván az ígét, hanem csak a zsidóknak”; Pál és Barnabás a jeruzsálemi zsinatra menet „általmentek Fenicián és Samárián, elbeszélve a pogányok megtérését”; utolsó útján pedig Pál talált „egy hajót, mely Fenicziába méne által”, Tíruszban kiszállt, ahol hét napot töltött a tanítványokkal, majd Ptolemaiszba ment tovább. Kr. u. 194 körül Septimius Severus Syria Phoenicét külön provinciává tette."
    - "Ma Fönícia Libanon partja és Izrael északnyugati sarka. Tírusz és Büblosz 1984 óta világörökségi helyszín, Szidón tengeri vára, Bejrút római fürdői és a régi festőműhelyek bíbor kagylóhalmai pedig ma is láthatók."
  fi:
    - "Foinikia on kreikkalainen nimi kapealle rannikolle Libanonin vuorten ja meren välissä, pohjoisen Arvadista Byblosin, Beirutin ja Sidonin ohi Tyrokseen ja Karmelin juurelle. Kreikkalaiset kutsuivat sen asukkaita nimellä Phoinikes, yleensä selitettynä sanasta phoinix, heidän myymänsä värin purppuranpunaisesta; kansa itse kutsui itseään kanaanilaisiksi, ja Vanha testamentti puhuu vain Tyroksesta, Sidonista ja Kanaanista. Näistä satamista purjehtivat ensimmäisellä vuosituhannella eaa. laivat, jotka perustivat Karthagon, perimätiedon mukaan 814 eaa., ja veivät aakkoset Kreikkaan; Tyroksen Hiram lähetti setriä ja käsityöläisiä Daavidille ja Salomolle. Kaupungit maksoivat veroa Assyrialle ja Babylonille, palvelivat Persiaa laivastoillaan, joutuivat Aleksanterin haltuun tämän valloittaessa Tyroksen 332 eaa. ja siirtyivät Roomalle Syyrian mukana 64 eaa."
    - "Neljä Uuden testamentin jaetta mainitsee sen. Jeesus meni Tyroksen ja Sidonin alueelle, missä nainen, ”kreikatar, syntyään syyrofoinikialainen”, rukoili häneltä apua tyttärelleen; Matteus kutsuu häntä kanaanilaiseksi. Stefanoksen kuoleman jälkeen hajaantuneet uskovat ”vaelsivat ympäri hamaan Foinikiaan ja Kyproon ja Antiokiaan saakka, mutta eivät puhuneet sanaa muille kuin ainoastaan juutalaisille”; Paavali ja Barnabas matkallaan Jerusalemin kokoukseen ”kulkivat Foinikian ja Samarian kautta ja kertoivat pakanain kääntymyksestä”; ja viimeisellä matkallaan Paavali löysi ”Foinikiaan menevän laivan”, nousi maihin Tyroksessa, jossa viipyi seitsemän päivää opetuslasten luona, ja jatkoi Ptolemaikseen. Noin 194 jaa. Septimius Severus teki Syria Phoenicesta oman provinssinsa."
    - "Nykyään Foinikia on Libanonin rannikko ja Israelin luoteiskulma. Tyros ja Byblos ovat olleet maailmanperintökohteita vuodesta 1984, ja Sidonin merilinna, Beirutin roomalaiset kylpylät ja vanhojen värjäämöiden purppurasimpukkakasat ovat yhä nähtävissä."
  vi:
    - "Phê-ni-xi là tên Hy Lạp của dải bờ biển hẹp giữa dãy núi Li-ban và biển, từ A-vát ở phía bắc qua Byblos, Beirut và Si-đôn đến Ty-rơ và chân núi Cạt-mên. Người Hy Lạp gọi dân của nó là Phoinikes, thường được giải thích từ phoinix, màu đỏ tía của thuốc nhuộm họ bán; chính họ tự gọi mình là người Ca-na-an, và Cựu Ước chỉ nói về Ty-rơ, Si-đôn và Ca-na-an. Từ các hải cảng này, trong thiên niên kỷ thứ nhất TCN, các con tàu đã đi lập Carthage, theo truyền thống vào năm 814 TCN, và đem bảng chữ cái đến Hy Lạp; Hi-ram ở Ty-rơ gửi gỗ bá hương và thợ khéo đến Đa-vít và Sa-lô-môn. Các thành nộp cống cho A-si-ri và Ba-by-lôn, phục vụ Phe-rơ-sơ bằng hạm đội, sụp đổ trước A-léc-xan-đơ khi ông chiếm Ty-rơ năm 332 TCN, và thuộc về Rô-ma cùng Sy-ri năm 64 TCN."
    - "Bốn câu Tân Ước nêu tên nó. Chúa Giê-su đi đến bờ cõi Ty-rơ và Si-đôn, nơi một người đàn bà “người Gờ-réc, dân Sy-rô-phê-ni-xi” xin Ngài cho con gái bà; Ma-thi-ơ gọi bà là người Ca-na-an. Sau cái chết của Ê-tiên, các tín hữu bị tản lạc “đi đến xứ Phê-ni-xi, đảo Chíp-rơ và thành An-ti-ốt, chỉ giảng đạo cho người Giu-đa thôi”; Phao-lô và Ba-na-ba trên đường đến hội nghị ở Giê-ru-sa-lem “trải qua xứ Phê-ni-xi và xứ Sa-ma-ri, thuật lại sự người ngoại trở về đạo”; và trong chuyến đi cuối, Phao-lô gặp “một chiếc tàu, dương buồm chạy qua xứ Phê-ni-xi”, cập bến Ty-rơ, nơi ông ở bảy ngày với các môn đồ, rồi đi tiếp đến Bê-tô-lê-mai. Khoảng năm 194, Septimius Severus lập Syria Phoenice thành một tỉnh riêng."
    - "Ngày nay Phê-ni-xi là bờ biển Li-ban và góc tây bắc của Israel. Ty-rơ và Byblos là di sản thế giới từ năm 1984, và lâu đài biển của Si-đôn, nhà tắm La Mã của Beirut và các đống vỏ ốc tía của xưởng nhuộm cũ vẫn còn thấy được."
  ro:
    - "Fenicia este numele grecesc al coastei înguste dintre munții Liban și mare, de la Arvad în nord, pe lângă Biblos, Beirut și Sidon, până la Tir și poalele Carmelului. Grecii îi numeau pe locuitorii ei Phoinikes, de obicei explicat prin phoinix, roșul-purpuriu al vopselei pe care o vindeau; oamenii înșiși se numeau canaaniți, iar Vechiul Testament vorbește doar de Tir, Sidon și Canaan. Din aceste porturi au plecat, în mileniul I î.Hr., corăbiile care au întemeiat Cartagina, după tradiție în 814 î.Hr., și au dus alfabetul în Grecia; Hiram din Tir a trimis cedru și meșteri lui David și lui Solomon. Cetățile plăteau tribut Asiriei și Babilonului, au slujit Persia cu flotele lor, au căzut în fața lui Alexandru când a luat Tirul în 332 î.Hr. și au trecut la Roma odată cu Siria în 64 î.Hr."
    - "Patru versete din Noul Testament o numesc. Isus a mers în ținutul Tirului și al Sidonului, unde o femeie, „muierea elină, de neam din Finichia Siriei”, l-a rugat pentru fiica ei; Matei o numește canaanită. După moartea lui Ștefan, credincioșii risipiți „au trecut până la Finichia, și la Chipru și la Antiohia, nimenui grăind cuvântul fără numai Iudeilor”; Pavel și Barnaba, în drum spre sinodul din Ierusalim, „au trecut prin Finichia și Samaria, povestind de întoarcerea neamurilor”; iar în ultima sa călătorie Pavel a găsit „corabie trecând la Finichia”, a debarcat la Tir, unde a stat șapte zile cu ucenicii, și a mers mai departe la Ptolemaida. În jurul anului 194 d.Hr., Septimius Severus a făcut din Siria Phoenice o provincie aparte."
    - "Astăzi Fenicia este coasta Libanului și colțul de nord-vest al Israelului. Tirul și Biblosul sunt sit al Patrimoniului Mondial din 1984, iar castelul maritim al Sidonului, băile romane din Beirut și movilele de cochilii purpurii ale vechilor vopsitorii pot fi încă văzute."
  bg:
    - "Финикия е гръцкото име на тясното крайбрежие между Ливанските планини и морето, от Арвад на север през Библос, Бейрут и Сидон до Тир и подножието на Кармил. Гърците наричали жителите му фойникес, което обикновено се обяснява с фойникс — пурпурночервения цвят на боята, която продавали; самите те се наричали ханаанци, а Старият завет говори само за Тир, Сидон и Ханаан. От тези пристанища през I хилядолетие пр.н.е. тръгвали корабите, които основали Картаген, по традиция през 814 г. пр.н.е., и пренесли азбуката в Гърция; Хирам от Тир изпращал кедър и майстори на Давид и Соломон. Градовете плащали данък на Асирия и Вавилон, служели на Персия с флотите си, паднали пред Александър, когато той превзел Тир през 332 г. пр.н.е., и преминали към Рим заедно със Сирия през 64 г. пр.н.е."
    - "Четири стиха от Новия завет я назовават. Исус отишъл в пределите на Тир и Сидон, където една жена, „Елинка, родом Сирофиникианка“, го молила за дъщеря си; Матей я нарича ханаанка. След смъртта на Стефан разпръснатите вярващи „преминаха до Финикия и Кипър и Антиохия, и никому другиму не проповедваха словото освен на Юдеите“; Павел и Варнава на път за събора в Йерусалим „минуваха през Финикия и Самария и разказваха обръщането на езичниците“; а при последното си плаване Павел намерил „кораб който заминваше за Финикия“, слязъл в Тир, където останал седем дни с учениците, и продължил към Птолемаида. Около 194 г. н.е. Септимий Север направил Сирия Финикийска отделна провинция."
    - "Днес Финикия е крайбрежието на Ливан и северозападният ъгъл на Израел. Тир и Библос са обекти на световното наследство от 1984 г., а морската крепост на Сидон, римските бани в Бейрут и купищата черупки от пурпурни охлюви от старите бояджийници могат да се видят и днес."
