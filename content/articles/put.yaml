# Overview article (ADR 0007). Mainstream facts only; the identification with Libya is given as the usual one, Punt as the alternative.
id: put
place: ad0520f
title:
  en: "Put"
  ru: "Ливия"
body:
  en:
    - "Put, in the older English Bibles Phut, is a people and land of Africa named beside Egypt and Cush. In the table of nations “the sons of Ham; Cush, and Mizraim, and Phut, and Canaan”, that is, Nubia, Egypt, Put and Canaan. The Greek translators of the prophets rendered Put as Libyans, Josephus says that Phut settled Libya and that the Libyans were once called Phutians after him, and nearly all later readers have followed them: Put is Libya, the coast west of Egypt, with Cyrene. A Persian royal inscription of Darius lists the land Putaya among his subjects, which scholars identify with Libya. Some have preferred Punt, the land of incense on the Red Sea known from Egyptian records, chiefly because Nahum names Put and the Lubim, the Libyans, side by side; this remains a minority view."
    - "The men of Put appear in the prophets as soldiers: the men “that handle the shield”, in Pharaoh Necho's army routed at Carchemish, where the King James Version turns Put into Libyans; mercenaries of Tyre, “They of Persia and of Lud and of Phut were in thine army, thy men of war”; allies of Egypt doomed to fall with her, “Ethiopia, and Libya, and Lydia, and all the mingled people”; and warriors in the host of Gog, “Persia, Ethiopia, and Libya with them; all of them with shield and helmet”. Nahum reminds Nineveh that Thebes too had fallen though “Put and Lubim were thy helpers”; the Synodal Bible there has Copts and Libyans. In Isaiah's promise that the survivors will be sent to the far nations the Hebrew text reads Pul, which the Greek Bible and most scholars take to be Put."
    - "Libyan tribes fought and served Egypt from the New Kingdom onward, and a Libyan dynasty, that of Shishak, ruled Egypt in the tenth to eighth centuries BC. The Greeks founded Cyrene in Libya about 630 BC, and men of Cyrene, Simon who carried the cross and the Jews of the Cyrenian synagogue, appear in the New Testament. Today Libya is a state of North Africa with its capital at Tripoli; Cyrene's ruins stand near Shahhat in the east."
  ru:
    - "Фут, в Синодальном переводе большей частью Ливия, — народ и земля Африки, названная рядом с Египтом и Хушем. В таблице народов «Сыны Хама: Хуш, Мицраим, Фут и Ханаан», то есть Нубия, Египет, Фут и Ханаан. Греческие переводчики пророков передали Фут как «ливийцы», Иосиф Флавий говорит, что Фут заселил Ливию и что ливийцы некогда звались по нему футийцами, и почти все позднейшие читатели последовали за ними: Фут — это Ливия, берег к западу от Египта, с Киреной. Персидская царская надпись Дария перечисляет среди его подданных землю Путая, в которой учёные видят Ливию. Некоторые предпочитали Пунт, страну благовоний на Красном море, известную по египетским записям, главным образом потому, что Наум называет Фут и лубим, ливийцев, рядом; это остаётся мнением меньшинства."
    - "Люди Фута появляются у пророков как воины: «вооруженные щитом», в войске фараона Нехао, разбитом при Кархемисе; наёмники Тира — «Перс и Лидиянин и Ливиец находились в войске твоем и были у тебя ратниками»; союзники Египта, обречённые пасть вместе с ним, — «Ефиопия, и Ливия, и Лидия, и весь смешанный народ»; и воины в полчище Гога — «Персов, Ефиоплян и Ливийцев с ними, всех со щитами и в шлемах». Наум напоминает Ниневии, что пали и Фивы, хотя «Копты и Ливийцы приходили на помощь тебе», — так Синодальный перевод передаёт здесь Фут и лубим. В обещании Исаии послать уцелевших к дальним народам еврейский текст читает Пул, в котором греческая Библия и большинство учёных видят Фут."
    - "Ливийские племена воевали с Египтом и служили ему начиная с Нового царства, а ливийская династия, династия Сусакима, правила Египтом в X–VIII веках до н. э. Греки основали в Ливии Кирену около 630 г. до н. э., и в Новом Завете появляются Киринеяне — Симон, нёсший крест, и Иудеи Киринейской синагоги. Сегодня Ливия — государство Северной Африки со столицей в Триполи; развалины Кирены стоят у Шаххата на востоке страны."
