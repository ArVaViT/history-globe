# Overview article (ADR 0007). Mainstream facts only; the identification with Libya is given as the usual one, Punt as the alternative.
id: put
place: ad0520f
title:
  en: "Put"
  ru: "Ливия"
  uk: "Лівія"
  es: "Fut"
  pt: "Pute"
  de: "Put"
  fr: "Puth"
body:
  en:
    - "Put, in the older English Bibles Phut, is a people and land of Africa named beside Egypt and Cush. In the table of nations “the sons of Ham; Cush, and Mizraim, and Phut, and Canaan”, that is, Nubia, Egypt, Put and Canaan. The Greek translators of the prophets rendered Put as Libyans, Josephus says that Phut settled Libya and that the Libyans were once called Phutians after him, and nearly all later readers have followed them: Put is Libya, the coast west of Egypt, with Cyrene. A Persian royal inscription of Darius lists the land Putaya among his subjects, which scholars identify with Libya. Some have preferred Punt, the land of incense on the Red Sea known from Egyptian records, chiefly because Nahum names Put and the Lubim, the Libyans, side by side; this remains a minority view."
    - "The men of Put appear in the prophets as soldiers: the men “that handle the shield”, in Pharaoh Necho's army routed at Carchemish, where the King James Version turns Put into Libyans; mercenaries of Tyre, “They of Persia and of Lud and of Phut were in thine army, thy men of war”; allies of Egypt doomed to fall with her, “Ethiopia, and Libya, and Lydia, and all the mingled people”; and warriors in the host of Gog, “Persia, Ethiopia, and Libya with them; all of them with shield and helmet”. Nahum reminds Nineveh that Thebes too had fallen though “Put and Lubim were thy helpers”; the Synodal Bible there has Copts and Libyans. In Isaiah's promise that the survivors will be sent to the far nations the Hebrew text reads Pul, which the Greek Bible and most scholars take to be Put."
    - "Libyan tribes fought and served Egypt from the New Kingdom onward, and a Libyan dynasty, that of Shishak, ruled Egypt in the tenth to eighth centuries BC. The Greeks founded Cyrene in Libya about 630 BC, and men of Cyrene, Simon who carried the cross and the Jews of the Cyrenian synagogue, appear in the New Testament. Today Libya is a state of North Africa with its capital at Tripoli; Cyrene's ruins stand near Shahhat in the east."
  ru:
    - "Фут, в Синодальном переводе большей частью Ливия, — народ и земля Африки, названная рядом с Египтом и Хушем. В таблице народов «Сыны Хама: Хуш, Мицраим, Фут и Ханаан», то есть Нубия, Египет, Фут и Ханаан. Греческие переводчики пророков передали Фут как «ливийцы», Иосиф Флавий говорит, что Фут заселил Ливию и что ливийцы некогда звались по нему футийцами, и почти все позднейшие читатели последовали за ними: Фут — это Ливия, берег к западу от Египта, с Киреной. Персидская царская надпись Дария перечисляет среди его подданных землю Путая, в которой учёные видят Ливию. Некоторые предпочитали Пунт, страну благовоний на Красном море, известную по египетским записям, главным образом потому, что Наум называет Фут и лубим, ливийцев, рядом; это остаётся мнением меньшинства."
    - "Люди Фута появляются у пророков как воины: «вооруженные щитом», в войске фараона Нехао, разбитом при Кархемисе; наёмники Тира — «Перс и Лидиянин и Ливиец находились в войске твоем и были у тебя ратниками»; союзники Египта, обречённые пасть вместе с ним, — «Ефиопия, и Ливия, и Лидия, и весь смешанный народ»; и воины в полчище Гога — «Персов, Ефиоплян и Ливийцев с ними, всех со щитами и в шлемах». Наум напоминает Ниневии, что пали и Фивы, хотя «Копты и Ливийцы приходили на помощь тебе», — так Синодальный перевод передаёт здесь Фут и лубим. В обещании Исаии послать уцелевших к дальним народам еврейский текст читает Пул, в котором греческая Библия и большинство учёных видят Фут."
    - "Ливийские племена воевали с Египтом и служили ему начиная с Нового царства, а ливийская династия, династия Сусакима, правила Египтом в X–VIII веках до н. э. Греки основали в Ливии Кирену около 630 г. до н. э., и в Новом Завете появляются Киринеяне — Симон, нёсший крест, и Иудеи Киринейской синагоги. Сегодня Ливия — государство Северной Африки со столицей в Триполи; развалины Кирены стоят у Шаххата на востоке страны."
  uk:
    - "Фут, у давніших англійських Бібліях Phut, — народ і земля в Африці, названі поряд з Єгиптом і Кушем. У таблиці народів «А сини Хамові: Куш та Мизраїм, да Фут, да Канаан», тобто Нубія, Єгипет, Фут і Ханаан. Грецькі перекладачі пророків передали Фут як лівійців, Йосиф Флавій каже, що Фут заселив Лівію і що лівійці колись звалися за ним футійцями, і майже всі пізніші читачі пішли за ними: Фут — це Лівія, узбережжя на захід від Єгипту, з Киреною. Перський царський напис Дарія перелічує серед його підданих землю Путая, в якій учені вбачають Лівію. Дехто віддавав перевагу Пунту, країні пахощів на Червоному морі, відомій за єгипетськими записами, головно тому, що Наум називає Фут і лубім, лівійців, поруч; це лишається думкою меншості."
    - "Люди Фута постають у пророків як воїни: ті, «узброєні щитами», у війську фараона Нехао, розбитому під Каркемишем, де Біблія короля Якова передає Фут як лівійців; найманці Тіру — «Перські й Лидійські й Либійські люде служили затязцями в полках твоїх»; союзники Єгипту, приречені впасти разом із ним, — «Етіопія й Ливія й Лидия і ввесь помішаний нарід»; і воїни у війську Гога — «Персів, Етіопіїв, а з ними й Ливіїв, — всїх із щитами й в шоломах». Наум нагадує Ніневії, що й Но впало, хоч йому допомагали Фут і лубіми; Синодальний переклад має там коптів і лівійців. В обіцянці Ісаї послати уцілілих до далеких народів єврейський текст читає Пул, у якому грецька Біблія і більшість учених вбачають Фут."
    - "Лівійські племена воювали проти Єгипту й служили йому від Нового царства, а лівійська династія, династія Сусакіма, правила Єгиптом у X–VIII ст. до н. е. Греки заснували Кирену в Лівії близько 630 р. до н. е., і киренці — Симон, що ніс хрест, та юдеї киренської синагоги — з’являються в Новому Завіті. Сьогодні Лівія — держава Північної Африки зі столицею в Тріполі; руїни Кирени стоять поблизу Шаххата на сході."
  es:
    - "Fut, en las Biblias inglesas antiguas Phut, es un pueblo y una tierra de África nombrados junto a Egipto y Cus. En la tabla de las naciones, «Los hijos de Châm: Cush, y Mizraim, y Phut, y Canaán», es decir, Nubia, Egipto, Fut y Canaán. Los traductores griegos de los profetas tradujeron Fut por libios, Josefo dice que Fut se estableció en Libia y que los libios fueron llamados antaño futeos por él, y casi todos los lectores posteriores los han seguido: Fut es Libia, la costa al oeste de Egipto, con Cirene. Una inscripción real persa de Darío enumera la tierra Putaya entre sus súbditos, que los estudiosos identifican con Libia. Algunos han preferido Punt, la tierra del incienso en el mar Rojo conocida por los registros egipcios, sobre todo porque Nahum nombra juntos a Fut y a los lubim, los libios; esta sigue siendo una opinión minoritaria."
    - "Los hombres de Fut aparecen en los profetas como soldados: los hombres «que toman escudo», en el ejército del faraón Necao derrotado en Carquemis, donde la King James Version traduce Fut por libios; mercenarios de Tiro, «Persas y Lidios, y los de Phut, fueron en tu ejército tus hombres de guerra»; aliados de Egipto condenados a caer con ella, «Etiopía, y Libia, y Lidia, y todo el conjunto de pueblo»; y guerreros en la hueste de Gog, «Persia, y Etiopía, y Libia con ellos; todos ellos con escudos y almetes». Nahum recuerda a Nínive que también Tebas había caído aunque «Put y Libia fueron en tu ayuda»; la Biblia sinodal tiene allí coptos y libios. En la promesa de Isaías de que los sobrevivientes serán enviados a las naciones lejanas, el texto hebreo lee Pul, que la Biblia griega y la mayoría de los estudiosos toman por Fut."
    - "Las tribus libias combatieron a Egipto y lo sirvieron desde el Reino Nuevo en adelante, y una dinastía libia, la de Sisac, gobernó Egipto del siglo X al VIII a. C. Los griegos fundaron Cirene en Libia hacia 630 a. C., y hombres de Cirene, Simón que llevó la cruz y los judíos de la sinagoga de los cireneos, aparecen en el Nuevo Testamento. Hoy Libia es un Estado del norte de África con su capital en Trípoli; las ruinas de Cirene se alzan cerca de Shahhat, en el este."
  pt:
    - "Pute, nas Bíblias inglesas mais antigas Phut, é um povo e uma terra da África citados ao lado do Egito e de Cuxe. Na Tábua das Nações: “Os filhos de Cam foram: Cuxe, Mizraim, Pute e Canaã”, isto é, Núbia, Egito, Pute e Canaã. Os tradutores gregos dos profetas verteram Pute por líbios, Josefo diz que Fut povoou a Líbia e que os líbios eram antigamente chamados futeus por causa dele, e quase todos os leitores posteriores os seguiram: Pute é a Líbia, a costa a oeste do Egito, com Cirene. Uma inscrição real persa de Dario lista entre seus súditos a terra Putaya, que os estudiosos identificam com a Líbia. Alguns preferiram Punte, a terra do incenso no Mar Vermelho conhecida dos registros egípcios, principalmente porque Naum nomeia lado a lado Pute e os lubim, os líbios; esta continua sendo uma visão minoritária."
    - "Os homens de Pute aparecem nos profetas como soldados: os que “empunham o escudo” no exército do faraó Neco, derrotado em Carquemis, onde a Bíblia King James converte Pute em líbios; mercenários de Tiro, “A Pérsia, Lude e Pute estavam no seu exército, seus homens de guerra”; aliados do Egito condenados a cair com ele, “A Etiópia, Pute, Lude, toda a mistura de povos”; e guerreiros na hoste de Gogue, “Pérsia, Cuxe e Pute estarão com eles, todos eles com escudo e capacete”. Naum lembra a Nínive que também Tebas caiu, embora “Pute e a Líbia eram os seus ajudadores”; a Bíblia Sinodal ali tem coptas e líbios. Na promessa de Isaías de que os sobreviventes serão enviados às nações distantes, o texto hebraico lê Pul, que a Bíblia grega e a maioria dos estudiosos tomam por Pute."
    - "Tribos líbias combateram e serviram o Egito desde o Novo Reino, e uma dinastia líbia, a de Sisaque, governou o Egito do século X ao VIII a.C. Os gregos fundaram Cirene, na Líbia, por volta de 630 a.C., e homens de Cirene, Simão que carregou a cruz e os judeus da sinagoga dos cireneus, aparecem no Novo Testamento. Hoje a Líbia é um Estado do Norte da África com capital em Trípoli; as ruínas de Cirene ficam perto de Shahhat, no leste."
  de:
    - "Put, in älteren englischen Bibeln Phut, ist ein Volk und Land Afrikas, das neben Ägypten und Kusch genannt wird. In der Völkertafel: „Die Kinder von Ham sind diese: Chus, Mizraim, Put und Kanaan“, das heißt Nubien, Ägypten, Put und Kanaan. Die griechischen Übersetzer der Propheten gaben Put als Libyer wieder, Josephus sagt, Phut habe Libyen besiedelt und die Libyer hießen nach ihm einst Phutier, und fast alle späteren Leser sind ihnen gefolgt: Put ist Libyen, die Küste westlich von Ägypten, mit Kyrene. Eine persische Königsinschrift des Darius führt das Land Putaya unter seinen Untertanen auf, das Gelehrte mit Libyen gleichsetzen. Manche haben Punt vorgezogen, das Weihrauchland am Roten Meer aus den ägyptischen Quellen, vor allem weil Nahum Put und die Lubim, die Libyer, nebeneinander nennt; das bleibt eine Minderheitsmeinung."
    - "Die Männer von Put erscheinen bei den Propheten als Soldaten: die Männer, „aus Put, die den Schild führen“, im Heer des Pharao Necho, das bei Karkemisch geschlagen wurde, wo die King-James-Bibel Put mit Libyer wiedergibt; Söldner von Tyrus, „Die aus Persien, Lud und Lybien waren dein Kriegsvolk“; Verbündete Ägyptens, die mit ihm fallen werden, Äthiopien und „Libyen und Lud mit allerlei Volk“; und Krieger im Heer Gogs, „Perser, … und Libyer, die alle Schild und Helm führen“. Nahum erinnert Ninive, dass auch Theben gefallen war, obwohl, so der Text, „Put und Libyen waren ihre Hilfe“; die russische Synodalübersetzung hat dort Kopten und Libyer. In Jesajas Verheißung, dass die Geretteten zu den fernen Völkern gesandt werden, liest der hebräische Text Pul, was die griechische Bibel und die meisten Gelehrten für Put halten."
    - "Libysche Stämme kämpften und dienten seit dem Neuen Reich für Ägypten, und eine libysche Dynastie, die Schischaks, herrschte im 10. bis 8. Jahrhundert v. Chr. über Ägypten. Die Griechen gründeten Kyrene in Libyen um 630 v. Chr., und Männer aus Kyrene, Simon, der das Kreuz trug, und die Juden der Synagoge der Kyrenäer, erscheinen im Neuen Testament. Heute ist Libyen ein Staat Nordafrikas mit der Hauptstadt Tripolis; die Ruinen von Kyrene stehen bei Schahhat im Osten."
  fr:
    - "Puth, Phut dans les anciennes Bibles anglaises, est un peuple et un pays d’Afrique nommé à côté de l’Égypte et de Cusch. Dans le tableau des nations : « Les fils de Cham furent : Cusch, Mitsraïm, Puth et Canaan », c’est-à-dire la Nubie, l’Égypte, Puth et Canaan. Les traducteurs grecs des prophètes rendirent Puth par Libyens, Flavius Josèphe dit que Phut peupla la Libye et que les Libyens furent jadis appelés Phutiens d’après lui, et presque tous les lecteurs postérieurs les ont suivis : Puth est la Libye, la côte à l’ouest de l’Égypte, avec Cyrène. Une inscription royale perse de Darius cite le pays Putaya parmi ses sujets, que les spécialistes identifient à la Libye. Certains préfèrent Pount, le pays de l’encens sur la mer Rouge connu des textes égyptiens, surtout parce que Nahum nomme côte à côte Puth et les Lubim, les Libyens ; c’est un avis minoritaire."
    - "Les hommes de Puth apparaissent chez les prophètes comme soldats : ceux « qui portent le bouclier », dans l’armée du pharaon Néco écrasée à Carkemisch, où la King James Version fait de Puth des Libyens ; mercenaires de Tyr, « ceux de Perse, de Lud et de Puth servaient dans ton armée, c’étaient des hommes de guerre » ; alliés de l’Égypte voués à tomber avec elle, « l’Éthiopie, Puth, Lud … tomberont avec eux par l’épée » ; et guerriers de l’armée de Gog, « ceux de Perse, d’Éthiopie et de Puth, tous portant le bouclier et le casque ». Nahum rappelle à Ninive que Thèbes était tombée elle aussi, bien que « Puth et les Libyens étaient ses auxiliaires » ; la Bible synodale russe y a « Coptes et Libyens » (Louis Segond : Puth). Dans la promesse d’Ésaïe d’envoyer les réchappés vers les nations lointaines, l’hébreu lit Pul, que la Bible grecque et la plupart des spécialistes tiennent pour Puth."
    - "Des tribus libyennes combattirent et servirent l’Égypte dès le Nouvel Empire, et une dynastie libyenne, celle de Schischak, régna sur l’Égypte du Xe au VIIIe siècle av. J.-C. Les Grecs fondèrent Cyrène en Libye vers 630 av. J.-C., et des hommes de Cyrène, Simon qui porta la croix et les Juifs de la synagogue des Cyrénéens, paraissent dans le Nouveau Testament. Aujourd’hui, la Libye est un État d’Afrique du Nord avec sa capitale à Tripoli ; les ruines de Cyrène se dressent près de Shahhat, à l’est."
