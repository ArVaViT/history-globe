body:
  en:
    - "Salem is the city of Melchizedek. When Abram came back from rescuing Lot and defeating the four kings, “Melchizedek king of Salem brought forth bread and wine: and he was the priest of the most high God”; he blessed Abram, and Abram gave him a tenth of all. The psalm that celebrates God's victory over the kings says, “In Salem also is his tabernacle, and his dwelling place in Zion”, setting the two names side by side; and the letter to the Hebrews draws out the name: Melchizedek is “King of righteousness, and after that also King of Salem, which is, King of peace”, a priest without genealogy whose order Christ fulfils."
    - "Most readers, ancient and modern, have taken Salem for Jerusalem, as the psalm implies. The Genesis Apocryphon from Qumran glosses it “Salem, that is Jerusalem”, Josephus says Melchizedek's Solyma was afterwards called Hierosolyma, and the city's later king Adoni-zedek bears a name of the same shape. But Jerusalem's name was already Urusalim in the Amarna letters, so Salem would be a poetic short form. Two other traditions exist. Jerome, writing to Evangelus, says Salem was not Jerusalem but a town near Scythopolis where the ruins of Melchizedek's palace were shown, the Salim near which John baptised at Aenon; and the Samaritans place it at the village of Salim east of Shechem, reading Genesis 33:18 as “Jacob came to Shalem, a city of Shechem”, as the King James Bible also does; the Russian Bible takes the word as “in peace”."
    - "Today Salem is, for most, the Old City of Jerusalem; the village of Salim stands east of Nablus, and the Salim of Jerome is sought in the Jordan valley south of Beth-shean."
  ru:
    - "Салим — город Мелхиседека. Когда Аврам возвращался, выручив Лота и разбив четырёх царей, «Мелхиседек, царь Салимский, вынес хлеб и вино, он был священник Бога Всевышнего»; он благословил Аврама, и Аврам дал ему десятую часть из всего. Псалом, прославляющий победу Бога над царями, говорит: «И было в Салиме жилище Его и пребывание Его на Сионе», ставя два имени рядом; а Послание к Евреям раскрывает имя: Мелхиседек — «царь правды, а потом и царь Салима, то есть, царь мира», священник без родословия, чей чин исполняет Христос."
    - "Большинство читателей, древних и новых, принимало Салим за Иерусалим, как и подразумевает псалом. Апокриф Книги Бытия из Кумрана поясняет: «Салим, то есть Иерусалим», Иосиф Флавий говорит, что Солиму Мелхиседека позже назвали Иеросолимой, а позднейший царь города Адониседек носит имя того же склада. Но имя Иерусалима уже в Амарнских письмах — Урусалим, так что Салим был бы поэтическим сокращением. Есть и два других предания. Иероним в письме к Евангелу пишет, что Салим — не Иерусалим, а городок близ Скифополя, где показывали развалины дворца Мелхиседека, тот Салим, близ которого Иоанн крестил в Еноне; а Самаряне помещают его в деревню Салим к востоку от Сихема, понимая Бытие 33:18 так, что Иаков пришёл в Салим, город Сихемский, как читает и английская Библия короля Иакова; русская Библия читает здесь «благополучно пришел в город Сихем»."
    - "Сегодня Салим для большинства — Старый город Иерусалима; деревня Салим стоит к востоку от Наблуса, а Салим Иеронима ищут в долине Иордана к югу от Беф-Сана."
  uk:
    - "Салім — це місто Мелхиседека. Коли Аврам повернувся, звільнивши Лота й переможивши чотирьох царів, «Мелхизедек, царь Салемський, винїс хлїб і вино; був же він сьвященник Бога вишнього»; він поблагословив Аврама, а Аврам дав йому десяту частину з усього. Псалом, що славить перемогу Бога над царями, каже: «І в Салемі оселя його, а дім його на Сионї», ставлячи обидві назви поряд; а послання до євреїв тлумачить ім'я: Мелхиседек — це «цар правди, а потім і цар Салимський, чи то цар впокою», священник без родоводу, чий чин звершує Христос."
    - "Більшість читачів, давніх і сучасних, вважала Салім Єрусалимом, як мовби випливає з псалма. Апокриф Книги Буття з Кумрана пояснює: «Салем, тобто Єрусалим»; Йосиф Флавій каже, що Мелхиседекова Солима згодом звалася Гієросолимою, а пізніший цар міста Адоні-Цедек має таку саму форму. Але назва Єрусалима вже була Урусалім в Амарнських листах, тож Салім був би поетичною скороченою формою. Існують ще два перекази. Ієронім, пишучи до Євангела, каже, що Салім був не Єрусалимом, а містом поблизу Скіфополя, де показували руїни палацу Мелхиседека, тим Салімом, поблизу якого Іван хрестив в Еноні; а самаряни поміщають його в селі Салім на схід від Сихема, читаючи Буття 33:18 як «Яків прийшов до Шалему, міста Сихемового», так само, як і Біблія короля Якова; Біблія Куліша розуміє це слово як «щасливо»."
    - "Нині Салім для більшості — це Старе місто Єрусалима; село Салім стоїть на схід від Наблуса, а Салім Ієроніма шукають у Йорданській долині на південь від Бет-Шеана."
  es:
    - "Salem es la ciudad de Melquisedec. Cuando Abram volvió de rescatar a Lot y de derrotar a los cuatro reyes, «Melchîsedec, rey de Salem, sacó pan y vino; el cual era sacerdote del Dios alto»; bendijo a Abram, y Abram le dio el diezmo de todo. El salmo que celebra la victoria de Dios sobre los reyes dice: «Y en Salem está su tabernáculo, y su habitación en Sión», poniendo los dos nombres uno junto a otro; y la carta a los Hebreos desarrolla el nombre: Melquisedec es «Rey de justicia; y luego también Rey de Salem, que es, Rey de paz», un sacerdote sin genealogía cuyo orden cumple Cristo."
    - "La mayoría de los lectores, antiguos y modernos, toma Salem por Jerusalén, como implica el salmo. El Apócrifo del Génesis de Qumrán la glosa «Salem, es decir, Jerusalén», Josefo dice que la Solima de Melquisedec se llamó después Hierosolima, y el posterior rey de la ciudad, Adonisedec, tiene un nombre de igual forma. Pero Jerusalén era ya Urusalim en las cartas de Amarna, así que Salem sería una forma poética abreviada. Hay otras dos tradiciones. Jerónimo, escribiendo a Evangelo, dice que Salem no era Jerusalén, sino una ciudad cerca de Escitópolis donde se mostraban las ruinas del palacio de Melquisedec, la Salim cerca de la cual bautizaba Juan en Enón; y los samaritanos la sitúan en la aldea de Salim, al este de Siquem, leyendo Génesis 33:18 como «Jacob llegó a Salem, ciudad de Siquem», como hace también la King James; la Biblia rusa toma la palabra como «en paz»."
    - "Hoy Salem es, para la mayoría, la Ciudad Vieja de Jerusalén; la aldea de Salim se encuentra al este de Nablus, y la Salim de Jerónimo se busca en el valle del Jordán al sur de Bet-seán."
  pt:
    - "Salém é a cidade de Melquisedeque. Quando Abrão voltou de resgatar Ló e derrotar os quatro reis, “Melquisedeque, rei de Salém, trouxe pão e vinho. Ele era sacerdote do Deus Altíssimo”; abençoou Abrão, e Abrão lhe deu o dízimo de tudo. O salmo que celebra a vitória de Deus sobre os reis diz: “Seu tabernáculo também está em Salém. Sua morada em Sião”, pondo os dois nomes lado a lado; e a carta aos Hebreus explica o nome: Melquisedeque é primeiro, “por interpretação, ‘rei de justiça’, e depois também ‘rei de Salém’, que significa ‘rei de paz’”, um sacerdote sem genealogia cuja ordem Cristo cumpre."
    - "A maioria dos leitores, antigos e modernos, tomou Salém por Jerusalém, como o salmo dá a entender. O Gênesis Apócrifo de Qumran a glosa “Salém, isto é, Jerusalém”, Josefo diz que a Solima de Melquisedeque foi depois chamada Hierosolima, e o rei posterior da cidade, Adoni-Zedeque, tem um nome da mesma forma. Mas o nome de Jerusalém já era Urusalim nas cartas de Amarna, de modo que Salém seria uma forma abreviada poética. Existem duas outras tradições. Jerônimo, escrevendo a Evângelo, diz que Salém não era Jerusalém, mas uma cidade perto de Citópolis onde se mostravam as ruínas do palácio de Melquisedeque, a Salim perto da qual João batizava em Enom; e os samaritanos a põem na aldeia de Salim, a leste de Siquém, lendo Gênesis 33:18 como “Jacó chegou a Salém, cidade de Siquém”, como também faz a Bíblia King James; a Bíblia russa toma a palavra como “em paz”."
    - "Hoje Salém é, para a maioria, a Cidade Velha de Jerusalém; a aldeia de Salim fica a leste de Nablus, e a Salim de Jerônimo é procurada no vale do Jordão, ao sul de Bete-Seã."
  de:
    - "Salem ist die Stadt Melchisedeks. Als Abram vom Befreien Lots und vom Sieg über die vier Könige zurückkam, heißt es: „Melchisedek, der König von Salem, trug Brot und Wein hervor. Und er war ein Priester Gottes des Höchsten“; er segnete Abram, und Abram gab ihm den Zehnten von allem. Der Psalm, der Gottes Sieg über die Könige feiert, sagt: „Zu Salem ist sein Gezelt, und seine Wohnung zu Zion“, und stellt die beiden Namen nebeneinander; und der Hebräerbrief deutet den Namen: Melchisedek ist „ein König der Gerechtigkeit; darnach aber ist er auch ein König Salems, das ist: ein König des Friedens“, ein Priester ohne Stammbaum, dessen Ordnung Christus erfüllt."
    - "Die meisten Leser, antike wie moderne, hielten Salem für Jerusalem, wie der Psalm nahelegt. Das Genesis-Apokryphon aus Qumran erklärt es als „Salem, das ist Jerusalem“, Josephus sagt, Melchisedeks Solyma sei später Hierosolyma genannt worden, und der spätere König der Stadt, Adoni-Zedek, trägt einen Namen derselben Form. Doch Jerusalem hieß schon in den Amarna-Briefen Urusalim, Salem wäre also eine dichterische Kurzform. Zwei andere Überlieferungen gibt es. Hieronymus schreibt an Evangelus, Salem sei nicht Jerusalem, sondern eine Stadt nahe Skythopolis mit gezeigten Ruinen von Melchisedeks Palast, das Salim, bei dem Johannes in Änon taufte; und die Samaritaner setzen es ins Dorf Salim östlich von Sichem und lesen Genesis 33,18 als „Jakob kam nach Schalem, einer Stadt Sichems“, wie es auch die King-James-Bibel tut; die russische Bibel fasst das Wort als „in Frieden“."
    - "Heute ist Salem für die meisten die Altstadt von Jerusalem; das Dorf Salim liegt östlich von Nablus, und das Salim des Hieronymus wird im Jordantal südlich von Bet-Schean gesucht."
  fr:
    - "Salem est la ville de Melchisédek. Quand Abram revint d’avoir délivré Lot et vaincu les quatre rois, « Melchisédek, roi de Salem, fit apporter du pain et du vin : il était sacrificateur du Dieu Très-Haut » ; il bénit Abram, et Abram lui donna la dîme de tout. Le psaume qui célèbre la victoire de Dieu sur les rois dit : « Sa tente est à Salem, et sa demeure à Sion », mettant les deux noms côte à côte ; et la lettre aux Hébreux commente le nom : Melchisédek est « d’abord roi de justice, d’après la signification de son nom, ensuite roi de Salem, c’est-à-dire roi de paix », sacrificateur sans généalogie dont le Christ accomplit l’ordre."
    - "La plupart des lecteurs, anciens et modernes, ont pris Salem pour Jérusalem, comme le psaume l’implique. L’Apocryphe de la Genèse (Qumrân) la glose « Salem, c’est-à-dire Jérusalem », Flavius Josèphe dit que la Solyma de Melchisédek fut plus tard appelée Hierosolyma, et son roi Adoni-Tsédek porte un nom de même forme. Mais Jérusalem s’appelait déjà Urusalim dans les lettres d’Amarna, Salem serait donc un abrégé poétique. Il existe deux autres traditions. Jérôme, écrivant à Évangélus, dit que Salem n’était pas Jérusalem mais une ville près de Scythopolis où l’on montrait les ruines du palais de Melchisédek, la Salim près de laquelle Jean baptisait à Énon ; et les Samaritains la placent au village de Salim à l’est de Sichem, lisant Genèse 33:18 comme Jacob arrivant à Shalem, ville de Sichem, ainsi que la King James ; la Bible russe prend le mot au sens de « en paix »."
    - "Aujourd’hui, Salem est, pour la plupart, la Vieille Ville de Jérusalem ; le village de Salim se trouve à l’est de Naplouse, et la Salim de Jérôme est cherchée dans la vallée du Jourdain, au sud de Beth-Schean."
  it:
    - "Salem è la città di Melchisedek. Quando Abramo tornò dal salvataggio di Lot e dalla sconfitta dei quattro re, «Melchisedec, re di Salem, fece portar del pane e del vino. Egli era sacerdote dell’Iddio altissimo»; benedisse Abramo, e Abramo gli diede la decima d’ogni cosa. Il salmo che celebra la vittoria di Dio sui re dice: «Il suo tabernacolo è in Salem, e la sua dimora in Sion», ponendo i due nomi uno accanto all’altro; e la lettera agli Ebrei sviluppa il nome: Melchisedek è «Re di giustizia, e poi anche Re di Salem, vale a dire Re di pace», un sacerdote senza genealogia il cui ordine Cristo adempie."
    - "I più, antichi e moderni, hanno preso Salem per Gerusalemme, come il salmo implica. Il Genesi Apocrifo di Qumran la glossa «Salem, cioè Gerusalemme», Giuseppe Flavio dice che la Solyma di Melchisedek fu poi chiamata Hierosolyma, e il successivo re della città, Adoni-Sedek, ha un nome simile. Ma il nome di Gerusalemme era già Urusalim nelle lettere di Amarna, per cui Salem sarebbe una forma abbreviata poetica. Esistono altre due tradizioni. Girolamo, scrivendo a Evangelo, dice che Salem non era Gerusalemme ma una città presso Scitopoli dove si mostravano le rovine del palazzo di Melchisedek, la Salim presso cui Giovanni battezzava a Enon; e i Samaritani la pongono al villaggio di Salim a est di Sichem, leggendo Genesi 33,18 come «Giacobbe giunse a Shalem, città di Sichem», come fa anche la King James Bible; la Bibbia russa intende la parola come «in pace»."
    - "Oggi Salem è, per i più, la Città Vecchia di Gerusalemme; il villaggio di Salim sorge a est di Nablus, e la Salim di Girolamo si cerca nella valle del Giordano a sud di Bet-Sean."
  pl:
    - "Salem to miasto Melchizedeka. Gdy Abram wrócił z ocalenia Lota i pokonania czterech królów, „Melchisedek, król Salemski, wyniósł chleb i wino; a ten był kapłanem Boga najwyższego”; pobłogosławił Abrama, a Abram dał mu dziesiątą część ze wszystkiego. Psalm, który obchodzi zwycięstwo Boga nad królami, mówi: „W Salemie jest przybytek jego, a mieszkanie jego na Syonie”, stawiając obie nazwy obok siebie; a List do Hebrajczyków rozwija imię: Melchizedek to „król sprawiedliwości, potem też król Salem, co jest król pokoju”, kapłan bez rodowodu, którego porządek wypełnia Chrystus."
    - "Większość czytelników, dawnych i współczesnych, uważała Salem za Jerozolimę, jak sugeruje psalm. Apokryf Księgi Rodzaju z Qumran objaśnia je: „Salem, czyli Jerozolima”, Józef Flawiusz mówi, że Solyma Melchizedeka została później nazwana Hierosolyma, a późniejszy król miasta Adoni-Sedek nosi imię podobnego kształtu. Lecz nazwa Jerozolimy brzmiała już Urusalim w listach z Amarny, więc Salem byłoby poetycką formą skróconą. Istnieją dwie inne tradycje. Hieronim, pisząc do Ewangelusa, mówi, że Salem nie było Jerozolimą, lecz miastem koło Scytopolis, gdzie pokazywano ruiny pałacu Melchizedeka, Salim, koło którego Jan chrzcił w Ainon; a Samarytanie umieszczają je we wsi Salim na wschód od Sychem, czytając Rdz 33,18 jako Jakub przyszedł do Szalem, miasta Sychem, tak jak czyta też Biblia Króla Jakuba; Biblia rosyjska bierze to słowo jako „w pokoju”."
    - "Dziś Salem to dla większości Stare Miasto Jerozolimy; wieś Salim stoi na wschód od Nablusu, a Salim Hieronima szuka się w dolinie Jordanu na południe od Bet-Szean."
  cs:
    - "Šalém je město Melchisedekovo. Když se Abram vracel z vysvobození Lota a z porážky čtyř králů, „Melchisedech také král Sálem, vynesl chléb a víno; a ten byl kněz Boha silného nejvyššího“; požehnal Abramovi a Abram mu dal desátek ze všeho. Žalm oslavující Boží vítězství nad králi praví: „V Sálem jest stánek jeho, a obydlé jeho na Sionu“, kladoucí obě jména vedle sebe; a List Židům jméno vykládá: Melchisedek je „král spravedlnosti, potom pak i král Sálem, to jest král pokoje“, kněz bez rodokmenu, jehož řád Kristus naplňuje."
    - "Většina čtenářů, starověkých i moderních, pokládala Šalém za Jeruzalém, jak žalm naznačuje. Genesis Apokryfon z Kumránu je glosuje „Šalém, to jest Jeruzalém“, Josephus praví, že Melchisedekovo Solyma se později nazývalo Hierosolyma, a pozdější jeruzalémský král Adonicedek nese jméno téhož tvaru. Ale jméno Jeruzaléma bylo už v amarnských dopisech Urusalim, takže Šalém by byl básnickou zkrácenou podobou. Existují dvě další tradice. Jeroným v listu Evangelovi praví, že Šalém nebyl Jeruzalém, ale město poblíž Skythopole, kde se ukazovaly zříceniny Melchisedekova paláce, Salim, u něhož Jan křtil v Ainónu; a Samařané je kladou do vesnice Salim východně od Šekemu a čtou Genesis 33,18 jako „Jákob přišel do Šalému, města Šekemu“, jak čte i anglická Bible krále Jakuba; ruská Bible bere slovo jako „v pokoji“."
    - "Dnes je Šalém pro většinu Staré Město Jeruzaléma; vesnice Salim stojí východně od Nábulusu a Jeronýmův Salim se hledá v Jordánském údolí jižně od Bét-šeanu."
  nl:
    - "Salem is de stad van Melchizedek. Toen Abram terugkwam van de redding van Lot en de overwinning op de vier koningen, “En Melchizedek, koning van Salem, bracht voort brood en wijn; en hij was een priester des allerhoogsten Gods”; hij zegende Abram, en Abram gaf hem de tiende van alles. De psalm die Gods overwinning op de koningen viert, zegt: “En in Salem is Zijn hut, en Zijn woning in Sion”, waarmee hij de twee namen naast elkaar zet; en de brief aan de Hebreeën werkt de naam uit: Melchizedek is “koning der gerechtigheid, en daarna ook ... een koning van Salem, hetwelk is een koning des vredes”, een priester zonder genealogie wiens orde Christus vervult."
    - "De meeste lezers, oud en modern, hebben Salem voor Jeruzalem gehouden, zoals de psalm veronderstelt. Het Genesis-apocrief uit Qumran glosseert “Salem, dat is Jeruzalem”, Josephus zegt dat Melchizedeks Solyma later Hierosolyma heette, en de latere koning van de stad, Adoni-Zedek, draagt een naam van dezelfde vorm. Jeruzalems naam was in de Amarnabrieven al Urusalim, Salem zou dus een dichterlijke korte vorm zijn. Er zijn nog twee overleveringen. Hieronymus schrijft aan Evangelus dat Salem niet Jeruzalem was maar een stad bij Scythopolis waar de ruïnes van Melchizedeks paleis werden getoond, het Salim waarbij Johannes doopte te Enon; en de Samaritanen plaatsen het in het dorp Salim ten oosten van Sichem, door Genesis 33:18 zo te lezen dat Jakob te Salem kwam, een stad van Sichem, zoals ook de King James Bible doet; de Russische Bijbel vat het woord op als “in vrede”."
    - "Tegenwoordig is Salem voor de meesten de Oude Stad van Jeruzalem; het dorp Salim ligt ten oosten van Nabloes, en het Salim van Hieronymus wordt in de Jordaanvallei ten zuiden van Beth-Sean gezocht."
  sv:
    - "Salem är Melkisedeks stad. När Abram kom tillbaka efter att ha räddat Lot och besegrat de fyra kungarna, då ”Melki-Sedek, konungen i Salem, lät bära ut bröd och vin; denne var präst åt Gud den Högste”; han välsignade Abram, och Abram gav honom tionde av allt. Psalmen som firar Guds seger över kungarna säger: ”i Salem vart hans hydda rest och hans boning på Sion”, och ställer de två namnen sida vid sida; och Hebreerbrevet utlägger namnet: Melkisedek är, när man uttyder hans namn, ”först och främst ’rättfärdighetens konung’, men därjämte ock ’Salems konung’, det är ’fridens konung’”, en präst utan släktregister vars ordning Kristus fullbordar."
    - "De flesta läsare, forntida och moderna, har tagit Salem för Jerusalem, som psalmen antyder. Genesisapokryfon från Qumran glosserar det ”Salem, det är Jerusalem”, Josefus säger att Melkisedeks Solyma senare kallades Hierosolyma, och stadens senare kung Adoni-Sedek bär ett namn av samma form. Men Jerusalems namn var redan Urusalim i Amarnabreven, så Salem vore en poetisk kortform. Två andra traditioner finns. Hieronymus, som skriver till Evangelus, säger att Salem inte var Jerusalem utan en stad nära Skythopolis där ruinerna av Melkisedeks palats visades, det Salim nära vilket Johannes döpte vid Ainon; och samarierna placerar det vid byn Salim öster om Shekem, och läser 1 Mos 33:18 som ”Jakob kom till Salem, en stad i Sikem”, som också King James-översättningen gör; den ryska bibeln tar ordet som ”i frid”."
    - "I dag är Salem för de flesta Jerusalems Gamla stad; byn Salim ligger öster om Nablus, och Hieronymus Salim söks i Jordandalen söder om Bet-Shean."
  nb:
    - "Salem er Melkisedeks by. Da Abram kom tilbake fra å ha reddet Lot og slått de fire kongene, heter det: «Og Melkisedek, kongen i Salem, kom ut med brød og vin; han var prest for den høieste Gud»; han velsignet Abram, og Abram ga ham tiende av alt. Salmen som feirer Guds seier over kongene, sier: «Og han reiste sin hytte i Salem og sin bolig på Sion», og setter de to navnene side om side; og Hebreerbrevet utlegger navnet: Melkisedek er «rettferdighets konge, men dernæst også Salems konge, det er freds konge», en prest uten slektstavle hvis orden Kristus fullbyrder."
    - "De fleste lesere, gamle og moderne, har tatt Salem for Jerusalem, slik salmen antyder. Genesis-apokryfen fra Qumran glosserer det «Salem, det vil si Jerusalem», Josefus sier at Melkisedeks Solyma senere ble kalt Hierosolyma, og byens senere konge Adoni-Sedek bærer et navn av samme form. Men Jerusalems navn var allerede Urusalim i Amarna-brevene, så Salem ville være en poetisk kortform. To andre tradisjoner finnes. Hieronymus, som skriver til Evangelos, sier at Salem ikke var Jerusalem, men en by nær Skythopolis der ruinene av Melkisedeks palass ble vist, den Salim nær hvilken Johannes døpte i Ainon; og samaritanene plasserer det i landsbyen Salim øst for Sikem og leser 1. Mosebok 33,18 som at Jakob kom til Salem, en by i Sikem, slik også King James-bibelen har det; den russiske bibelen tar ordet som «i fred»."
    - "I dag er Salem for de fleste gamlebyen i Jerusalem; landsbyen Salim ligger øst for Nablus, og Hieronymus' Salim søkes i Jordandalen sør for Bet-Sjean."
  tl:
    - "Ang Salem ang lungsod ni Melquisedec. Nang bumalik si Abram mula sa pagliligtas kay Lot at pagtalo sa apat na hari, “Melquisedec, na hari sa Salem, ay naglabas ng tinapay at alak; at siya'y saserdote ng Kataastaasang Dios”; pinagpala niya si Abram, at binigyan siya ni Abram ng ikasampung bahagi ng lahat. Sinasabi ng awit na nagdiriwang sa tagumpay ng Dios laban sa mga hari, “Nasa Salem naman ang kaniyang tabernakulo, at ang kaniyang dakong tahanan ay sa Sion”, na inilalagay nang magkatabi ang dalawang pangalan; at ipinaliliwanag ng liham sa mga Hebreo ang pangalan: si Melquisedec ay “Hari ng katuwiran, at saka Hari naman sa Salem, na sa makatuwid, ay Hari ng kapayapaan”, isang saserdoteng walang talaangkanan na tinutupad ni Cristo ang orden."
    - "Karamihan ng mambabasa, noon at ngayon, ay itinuring ang Salem na Jerusalem, gaya ng ipinahihiwatig ng awit. Ipinaliliwanag ito ng Genesis Apocryphon ng Qumran: “Salem, iyon ay Jerusalem”; sabi ni Josefo, tinawag kalaunang Hierosolyma ang Solyma ni Melquisedec, at kahawig ang pangalan ng kalaunang haring si Adoni-sedec. Ngunit Urusalim na ang Jerusalem sa mga liham ng Amarna, kaya ang Salem ay malamang na patulang pinaikling anyo. Dalawa pa ang tradisyon. Ayon kay Jerome, sa sulat kay Evangelo, hindi Jerusalem ang Salem kundi bayan malapit sa Scythopolis, kung saan ipinakita ang guho ng palasyo ni Melquisedec, ang Salim malapit sa Enon kung saan nagbautismo si Juan; inilalagay ito ng mga Samaritano sa nayong Salim silangan ng Sichem, binabasa ang Genesis 33:18 bilang “Dumating si Jacob sa Shalem, isang bayan ng Sichem”, gaya ng King James Bible; “payapa” ang basa ng Bibliyang Ruso."
    - "Sa ngayon, ang Salem para sa karamihan ay ang Lumang Lungsod ng Jerusalem; ang nayon ng Salim ay nasa silangan ng Nablus, at ang Salim ni Jerome ay hinahanap sa libis ng Jordan sa timog ng Beth-shean."
  da:
    - "Salem er Melkisedeks by. Da Abram kom tilbage fra at redde Lot og besejre de fire konger, »Melkisedek, Kongen af Salem, bragte Brød og Vin, og han var den højeste Guds Præst«; han velsignede Abram, og Abram gav ham tiende af alt. Salmen, der fejrer Guds sejr over kongerne, siger: »hans Paulun var i Salem, og hans Bolig i Zion«, og stiller dermed de to navne side om side; og Hebræerbrevet udlægger navnet: Melkisedek er »naar hans Navn udlægges, først er Retfærdigheds Konge, dernæst ogsaa Salems Konge, det er: Freds Konge«, en præst uden slægtregister, hvis orden Kristus opfylder."
    - "De fleste læsere, gamle og nyere, har taget Salem for Jerusalem, som salmen antyder. Genesis-apokryfonet fra Qumran glosserer det »Salem, det vil sige Jerusalem«, Josefus siger, at Melkisedeks Solyma senere blev kaldt Hierosolyma, og byens senere konge Adoni-Zedek bærer et navn af samme form. Men Jerusalems navn var allerede Urusalim i Amarna-brevene, så Salem ville være en poetisk kortform. To andre traditioner findes. Hieronymus siger i et brev til Evangelus, at Salem ikke var Jerusalem, men en by nær Skythopolis, hvor ruinerne af Melkisedeks palads blev vist, det Salim, nær hvilket Johannes døbte i Ænon; og samaritanerne placerer det ved landsbyen Salim øst for Sikem og læser 1 Mos 33,18 som »Jakob kom til Sjalem, en by i Sikem«, som King James-bibelen også gør; den russiske bibel tager ordet som »i fred«."
    - "I dag er Salem for de fleste Jerusalems gamle bydel; landsbyen Salim ligger øst for Nablus, og Hieronymus' Salim søges i Jordandalen syd for Bet-San."
  sr:
    - "Салим је град Мелхиседеков. Кад се Аврам вратио пошто је спасао Лота и победио четири цара, „Мелхиседек цар салимски изнесе хлеб и вино; а он беше свештеник Бога Вишњег“; благословио је Аврама, а Аврам му је дао десетак од свега. Псалам који слави Божју победу над царевима каже: „У Салиму је стан Његов и насеље Његово на Сиону“, стављајући ова два имена једно поред другог; а Посланица Јеврејима развија име: Мелхиседек је „цар правде, потом и цар салимски, то јест цар мира“, свештеник без родословља чији ред испуњава Христос."
    - "Већина читалаца, древних и савремених, Салим је узимала за Јерусалим, како подразумева псалам. Апокриф Постања из Кумрана тумачи га „Салим, то јест Јерусалим“, Јосиф Флавије каже да се Мелхиседекова Солима касније звала Хијеросолима, а каснији цар града Адониседек носи име истог облика. Али име Јерусалима већ је било Урусалим у писмима из Амарне, па би Салим био песнички скраћени облик. Постоје још два предања. Јероним, пишући Евангелу, каже да Салим није Јерусалим него град близу Скитопоља где су показиване рушевине Мелхиседекове палате, Салим близу кога је Јован крштавао у Енону; а Самарићани га смештају у село Салим источно од Сихема, читајући Постање 33,18 као „Јаков дође у Салим, град Сихемски“, као што чини и Библија краља Џејмса; руска Библија реч узима као „у миру“."
    - "Данас је Салим, за већину, Стари град Јерусалима; село Салим стоји источно од Наблуса, а Јеронимов Салим тражи се у долини Јордана јужно од Вет-Сана."
  hu:
    - "Sálem Melkizedek városa. Amikor Ábrám visszatért Lót kiszabadításából és a négy király legyőzéséből, „Melkhisédek pedig Sálem királya, kenyeret és bort hoza; ő pedig a Magasságos Istennek papja vala”; megáldotta Ábrámot, Ábrám pedig mindenből tizedet adott neki. A zsoltár, amely Isten győzelmét ünnepli a királyok felett, mellérendeli a két nevet: Sálemet és Siont; a Zsidókhoz írt levél pedig kifejti a nevet: Melkizedek „igazság királya, azután pedig Sálem királya is, azaz békesség királya”, nemzetségtábla nélküli pap, akinek rendjét Krisztus teljesíti be."
    - "A legtöbb olvasó, ókori és mai, Sálemet Jeruzsálemnek vette, ahogy a zsoltár sugallja. A qumráni Genezis Apokrifon úgy magyarázza: „Sálem, azaz Jeruzsálem”, Josephus Flavius szerint Melkizedek Szolümája később Hierosolüma lett, és a város későbbi királya, Adoni-Cedek neve hasonló alakú. De Jeruzsálem neve már Urusalim volt az amarnai levelekben, így Sálem költői rövid alak volna. Két másik hagyomány létezik. Jeromos Evangeluszhoz írt levelében azt mondja, hogy Sálem nem Jeruzsálem volt, hanem egy Szkütopolisz melletti város, ahol Melkizedek palotájának romjait mutatták, az a Szálim, amelynek közelében János Ainónban keresztelt; a szamaritánusok pedig a Sikemtől keletre fekvő Szálim faluban helyezik el, az 1Móz 33,18-at úgy olvasva, hogy Jákób Sálembe érkezett, Sikem városába, ahogyan a King James Bible is; az orosz Biblia a szót „békében” értelemben veszi."
    - "Ma Sálem a legtöbbek számára Jeruzsálem Óvárosa; Szálim faluja Nablustól keletre áll, a Jeromos-féle Szálimot pedig a Bét-Seántól délre fekvő Jordán-völgyben keresik."
  fi:
    - "Salem on Melkisedekin kaupunki. Kun Abram palasi pelastettuaan Lootin ja voitettuaan neljä kuningasta, ”Melkisedek, Saalemin kuningas, toi leipää ja viiniä; hän oli Jumalan, Korkeimman, pappi”; hän siunasi Abramin, ja Abram antoi hänelle kymmenykset kaikesta. Psalmi, joka juhlistaa Jumalan voittoa kuninkaista, sanoo: ”Saalemissa on hänen majansa ja hänen asumuksensa Siionissa”, asettaen kaksi nimeä rinnakkain; ja Heprealaiskirje avaa nimen: Melkisedek on ”vanhurskauden kuningas” ja sen lisäksi vielä ”Saalemin kuningas”, se on ”rauhan kuningas”, pappi ilman sukuluetteloa, jonka järjestyksen Kristus täyttää."
    - "Useimmat muinaiset ja nykyiset lukijat ovat pitäneet Salemia Jerusalemina, kuten psalmi antaa ymmärtää. Qumranin 1. Mooseksen kirjan apokryfi selittää: ”Salem, se on Jerusalem”, Josephuksen mukaan Melkisedekin Solymaa kutsuttiin myöhemmin Hierosolymaksi, ja kaupungin myöhemmän kuninkaan Adoni-Sedekin nimi on samanmuotoinen. Mutta Jerusalemin nimi oli jo Amarnan kirjeissä Urusalim, joten Salem olisi runollinen lyhytmuoto. Muita perimätietoja on kaksi. Hieronymus kirjoittaa Evangelokselle, että Salem ei ollut Jerusalem vaan Skythopoliin lähellä oleva kaupunki, jossa näytettiin Melkisedekin palatsin rauniot, Salim, jonka lähellä Johannes kastoi Ainonissa; ja samarialaiset sijoittavat sen Salimin kylään Sikemistä itään lukien 1. Moos. 33:18:n niin, että Jaakob tuli Shalemiin, Sikemin kaupunkiin, kuten King James -käännöskin; venäläinen Raamattu kääntää sen ”rauhassa”."
    - "Nykyään Salem on useimmille Jerusalemin vanha kaupunki; Salimin kylä on Nablusista itään, ja Hieronymuksen Salimia etsitään Jordanin laaksosta Bet-Seanista etelään."
  vi:
    - "Sa-lem là thành của Mên-chi-xê-đéc. Khi Áp-ram trở về sau khi cứu Lót và đánh bại bốn vua, “Mên-chi-xê-đéc, vua Sa-lem, sai đem bánh và rượu ra. Vả, vua nầy là thầy tế lễ của Đức Chúa Trời Chí cao”; ông chúc phước cho Áp-ram, và Áp-ram dâng cho ông một phần mười mọi thứ. Thi thiên ca ngợi chiến thắng của Đức Chúa Trời trước các vua nói: “Đền tạm Ngài ở Sa-lem, Và nơi ở Ngài tại Si-ôn”, đặt hai tên cạnh nhau; và thư Hê-bơ-rơ giải nghĩa tên: Mên-chi-xê-đéc, “trước hết là vua sự công bình, lại là vua của Sa-lem nữa, nghĩa là vua bình an”, một thầy tế lễ không gia phổ mà ban của ông Đấng Christ làm trọn."
    - "Phần lớn độc giả, xưa và nay, coi Sa-lem là Giê-ru-sa-lem, như thi thiên ngụ ý. Sáng Thế Ký Ngụy Thư từ Qumran chú giải nó là “Sa-lem, tức Giê-ru-sa-lem”, Josephus nói Solyma của Mên-chi-xê-đéc về sau được gọi là Hierosolyma, và vua về sau của thành là A-đô-ni-Xê-đéc mang một tên cùng dạng. Nhưng tên Giê-ru-sa-lem đã là Urusalim trong các thư Amarna, nên Sa-lem sẽ là dạng rút gọn mang tính thơ. Có hai truyền thống khác. Jerome, viết cho Evangelus, nói Sa-lem không phải Giê-ru-sa-lem mà là một thị trấn gần Scythopolis, nơi người ta chỉ tàn tích cung điện của Mên-chi-xê-đéc, tức Sa-lim gần Ê-nôn nơi Giăng làm phép báp-têm; và người Sa-ma-ri đặt nó ở làng Salim phía đông Si-chem, đọc Sáng Thế Ký 33:18 là Gia-cốp đến Sa-lem, một thành của Si-chem, như bản King James cũng làm; Kinh Thánh tiếng Nga hiểu chữ ấy là “trong bình an”."
    - "Ngày nay Sa-lem đối với đa số là Thành Cổ của Giê-ru-sa-lem; làng Salim đứng phía đông Nablus, và Salim của Jerome được tìm trong thung lũng Giô-đanh phía nam Bết-Sê-an."
  ro:
    - "Salem este cetatea lui Melhisedec. Când Avram s-a întors după ce l-a salvat pe Lot și i-a învins pe cei patru regi, „Melhisedec împăratul Salimului i-a adus pâine și vin, și erà el preot lui Dumnezeu celui prea înalt”; l-a binecuvântat pe Avram, iar Avram i-a dat zeciuială din toate. Psalmul care sărbătorește biruința lui Dumnezeu asupra regilor spune că în Salem este cortul Lui, iar locuința Lui în Sion, așezând cele două nume alături; iar epistola către Evrei dezvoltă numele: Melhisedec este „Împăratul dreptăței, iar apoi și împăratul Salimului, care este Împăratul păcei”, un preot fără genealogie al cărui rang îl împlinește Hristos."
    - "Cei mai mulți cititori, antici și moderni, au luat Salem drept Ierusalim, cum sugerează psalmul. Apocrifonul Genezei de la Qumran îl glosează „Salem, adică Ierusalim”, Iosif Flaviu spune că Solyma lui Melhisedec s-a numit mai târziu Hierosolyma, iar regele ulterior al cetății, Adoni-Țedec, poartă un nume de aceeași formă. Dar numele Ierusalimului era deja Urusalim în scrisorile de la Amarna, așa că Salem ar fi o formă scurtă poetică. Există două alte tradiții. Ieronim, scriindu-i lui Evangelus, spune că Salem nu era Ierusalimul, ci o cetate lângă Scitopolis, unde erau arătate ruinele palatului lui Melhisedec, Salim lângă care boteza Ioan la Enon; iar samaritenii îl așază în satul Salim de la est de Sihem, citind Geneza 33:18 ca „a venit Iacov în Salim cetatea Sichimilor”, cum face și Biblia King James; Biblia rusă înțelege cuvântul ca „în pace”."
    - "Astăzi Salem este, pentru cei mai mulți, Orașul Vechi al Ierusalimului; satul Salim se află la est de Nablus, iar Salimul lui Ieronim este căutat în valea Iordanului, la sud de Bet-Șean."
  bg:
    - "Салим е градът на Мелхиседек. Когато Аврам се върнал, след като спасил Лот и разбил четиримата царе, „Мелхиседек цар Салимски изнесе хляб и вино; а той беше свещеник на Бога Вишняго“; той благословил Аврам, а Аврам му дал десятък от всичко. Псаломът, който възпява Божията победа над царете, казва: „Скинията му е в Салим, И жилището му е в Сион“, поставяйки двете имена едно до друго; а Посланието към евреите разтълкува името: Мелхиседек е „цар на правдата, а после и цар Салимски, сиреч цар на мир“, свещеник без родословие, чийто чин Христос изпълнява."
    - "Повечето читатели, древни и съвременни, разбират Салим като Йерусалим, както подсказва псаломът. Апокрифът на Битие от Кумран го пояснява: „Салим, тоест Йерусалим“, Йосиф Флавий казва, че Солима на Мелхиседек по-късно била наречена Йерусалим, а по-късният цар на града Адониседек носи име със същия строеж. Но в писмата от Амарна името на Йерусалим вече е Урусалим, така че Салим би бил поетична кратка форма. Съществуват и две други традиции. Йероним, в писмо до Евангел, казва, че Салим не е Йерусалим, а град край Скитопол, където показвали руините на двореца на Мелхиседек — Салим, близо до който Йоан кръщавал в Енон; а самаряните го поставят при село Салим на изток от Сихем, като четат Битие 33:18 „дойде в Салим, град Сихемов“, както го чете и Библията на крал Джеймс; руската Библия разбира думата като „в мир“."
    - "Днес Салим е за повечето Старият град на Йерусалим; село Салим се намира на изток от Наблус, а Салим на Йероним се търси в Йорданската долина южно от Бет-Шеан."
