body:
  en:
    - "Adam, or Adamah, was a town in the Jordan valley by a ford of the river, “beside Zaretan”. Most scholars identify it with Tell ed-Damiyeh (Tall Damiya), a mound on the east bank of the Jordan just south of the mouth of the Jabbok, near the Damiya bridge; the American J. W. McGarvey, who visited in 1879, was among the first to make the equation, and the old name lives on in Damiya. The town is usually recognised in the list of places of the Egyptian king Shoshenq I at Karnak, from the late tenth century BC, a few entries after Penuel. The excavators themselves note that the mound's small size, only a few hectares, makes the identification less certain than it seems."
    - "When Israel crossed the Jordan opposite Jericho, “the waters which came down from above stood and rose up upon an heap very far from the city Adam, that is beside Zaretan: and those that came down toward the sea of the plain, even the salt sea, failed, and were cut off”. This is the only certain mention of the town. The river has been blocked near Damiya in historical times: the fourteenth-century Arab historian an-Nuwayri records that in December 1267, while Sultan Baybars's bridge at Damiya was being repaired, a high bank on the west side fell into the Jordan and stopped its flow from midnight until the fourth hour of the day."
    - "Excavations by Lucas Petit of the National Museum of Antiquities in Leiden and Zeidan Kafafi of Yarmouk University, after soundings in 2004–2005 and seasons from 2012 to 2019, uncovered a late Iron Age complex of storerooms and a sanctuary with two platforms, painted terracotta figurines of horses and women, Egyptian scarabs and a cuneiform text; the complex burned in a fierce fire around 700 BC. In the Persian and Hellenistic periods the mound held storage pits, and in Byzantine and Ottoman times it was a cemetery. Tell ed-Damiyeh lies today in the Jordan Valley, in Jordan."
  ru:
    - "Адам, или Адама, — город в долине Иордана у брода через реку, «подле Цартана». Большинство учёных отождествляют его с Телль-эд-Дамийе (Телль-Дамия), холмом на восточном берегу Иордана чуть южнее устья Иавока, близ моста Дамия; американец Дж. У. Макгарви, побывавший здесь в 1879 г., был одним из первых, кто предложил это отождествление, и древнее имя живёт в названии Дамия. Город обычно узнают в списке мест египетского царя Шешонка I в Карнаке, конец X в. до н. э., через несколько строк после Пенуэла. Сами раскопщики отмечают, что малый размер холма, всего несколько гектаров, делает отождествление менее надёжным, чем кажется."
    - "Когда Израиль переходил Иордан напротив Иерихона, «вода, текущая сверху, остановилась и стала стеною на весьма большое расстояние, до города Адама, который подле Цартана; а текущая в море равнины, в море Соленое, ушла и иссякла». Это единственное несомненное упоминание города. Река в историческое время перекрывалась возле Дамии: арабский историк XIV в. ан-Нувайри сообщает, что в декабре 1267 г., когда чинили мост султана Бейбарса у Дамии, высокий холм на западном берегу обрушился в Иордан и остановил его течение с полуночи до четвёртого часа дня."
    - "Раскопки Лукаса Петита из Национального музея древностей в Лейдене и Зейдана Кафафи из Ярмукского университета — после разведки 2004–2005 гг. и сезонов 2012–2019 гг. — открыли комплекс позднего железного века с кладовыми и святилищем с двумя помостами, расписными терракотовыми фигурками коней и женщин, египетскими скарабеями и клинописным текстом; комплекс сгорел в сильном пожаре ок. 700 г. до н. э. В персидское и эллинистическое время на холме были ямы-хранилища, а в византийское и османское — кладбище. Телль-эд-Дамийе находится сегодня в Иорданской долине, в Иордании."
  uk:
    - "Адам, або Адама, було містом у долині Йордану біля броду через річку, біля Цартана. Більшість учених ототожнюють його з Телль-ед-Дамією (Телль-Дамія), пагорбом на східному березі Йордану трохи на південь від гирла Яббока, поблизу мосту Дамія; американець Дж. В. Макґарві, який відвідав це місце 1879 р., був серед перших, хто так його ототожнив, а стара назва живе в Дамії. Місто зазвичай упізнають у списку місць єгипетського царя Шешонка I в Карнаку, з кінця X ст. до н. е., за кілька записів після Пенуела. Самі розкопувачі зауважують, що малий розмір пагорба, лише кілька гектарів, робить це ототожнення менш певним, ніж воно здається."
    - "Коли Ізраїль переходив Йордан навпроти Єрихону, «вода, що текла згори, і стояла як мур аж до міста Адаму, та аж до Сартана; та ж вода, що ішла у низ до степового моря, до Соленого моря, стекла зовсїм». Це єдина певна згадка про місто. У історичні часи річку біля Дамії перегороджувало: арабський історик XIV ст. ан-Нувайрі повідомляє, що в грудні 1267 р., коли ремонтували міст султана Бейбарса в Дамії, високий берег із західного боку обвалився в Йордан і зупинив його течію від півночі до четвертої години дня."
    - "Розкопки Люкаса Петіта з Національного музею старожитностей у Лейдені та Зейдана Кафафі з університету Ярмук, після зондувань 2004–2005 рр. і сезонів 2012–2019 рр., виявили комплекс пізньої залізної доби зі сховищами й святилищем із двома платформами, розписані теракотові фігурки коней і жінок, єгипетські скарабеї та клинописний текст; близько 700 р. до н. е. комплекс згорів у лютій пожежі. У перський та елліністичний періоди на пагорбі були ями для зберігання, а за візантійських і османських часів — цвинтар. Нині Телль-ед-Дамія лежить у долині Йордану, в Йорданії."
  es:
    - "Adam, o Adamá, era una población del valle del Jordán junto a un vado del río, «al lado de Sarethan». La mayoría de los estudiosos la identifican con Tell ed-Damiyeh (Tall Damiya), un montículo de la orilla oriental del Jordán, justo al sur de la desembocadura del Jaboc, cerca del puente de Damiya; el estadounidense J. W. McGarvey, que lo visitó en 1879, fue de los primeros en proponer la ecuación, y el antiguo nombre pervive en Damiya. La ciudad suele reconocerse en la lista de lugares del rey egipcio Sheshonq I en Karnak, de fines del siglo X a. C., pocas entradas después de Peniel. Los propios excavadores señalan que el pequeño tamaño del montículo, de solo unas hectáreas, hace la identificación menos segura de lo que parece."
    - "Cuando Israel cruzó el Jordán frente a Jericó, «las aguas que venían de arriba, se pararon como en un montón bien lejos de la ciudad de Adam, que está al lado de Sarethan; y las que descendían á la mar de los llanos, al mar Salado, se acabaron y fueron partidas». Es la única mención segura de la ciudad. El río ha quedado bloqueado cerca de Damiya en tiempos históricos: el historiador árabe del siglo XIV an-Nuwayri refiere que en diciembre de 1267, mientras se reparaba el puente del sultán Baybars en Damiya, una alta ribera del lado occidental cayó al Jordán y detuvo su curso desde medianoche hasta la cuarta hora del día."
    - "Las excavaciones de Lucas Petit, del Museo Nacional de Antigüedades de Leiden, y de Zeidan Kafafi, de la Universidad de Yarmuk, tras sondeos en 2004–2005 y campañas de 2012 a 2019, sacaron a la luz un complejo de fines de la edad del Hierro con almacenes y un santuario de dos plataformas, figurillas pintadas de terracota de caballos y mujeres, escarabeos egipcios y un texto cuneiforme; el complejo ardió en un violento incendio hacia 700 a. C. En las épocas persa y helenística el montículo albergó silos, y en tiempos bizantinos y otomanos fue un cementerio. Tell ed-Damiyeh se encuentra hoy en el valle del Jordán, en Jordania."
  pt:
    - "Adã, ou Adamá, era uma cidade do vale do Jordão junto a um vau do rio, “ao lado de Zaretã”. A maioria dos estudiosos a identifica com Tell ed-Damiyeh (Tall Damiya), um montículo na margem leste do Jordão, logo ao sul da foz do Jaboque, perto da ponte de Damiya; o americano J. W. McGarvey, que a visitou em 1879, foi um dos primeiros a fazer essa equação, e o nome antigo sobrevive em Damiya. A cidade é geralmente reconhecida na lista de lugares do rei egípcio Sosenque I em Carnaque, do final do século X a.C., algumas entradas depois de Penuel. Os próprios escavadores observam que o tamanho reduzido do montículo, de apenas alguns hectares, torna a identificação menos certa do que parece."
    - "Quando Israel atravessou o Jordão defronte de Jericó, “as águas que desciam de cima pararam e se ergueram em um só monte muito longe dali, em Adã, a cidade que fica ao lado de Zaretã; e as que desciam em direção ao mar da Arabá, o Mar Salgado, foram totalmente cortadas”. Esta é a única menção segura da cidade. O rio foi represado perto de Damiya em tempos históricos: o historiador árabe do século XIV an-Nuwayri registra que, em dezembro de 1267, enquanto a ponte do sultão Baibars em Damiya estava sendo reparada, uma alta barranca do lado oeste desabou no Jordão e deteve seu fluxo da meia-noite até a quarta hora do dia."
    - "Escavações de Lucas Petit, do Museu Nacional de Antiguidades de Leiden, e de Zeidan Kafafi, da Universidade de Yarmouk, depois de sondagens em 2004–2005 e campanhas de 2012 a 2019, revelaram um complexo do final da Idade do Ferro com depósitos e um santuário de duas plataformas, figuras de terracota pintadas de cavalos e mulheres, escaravelhos egípcios e um texto cuneiforme; o complexo foi consumido por um violento incêndio por volta de 700 a.C. Nos períodos persa e helenístico o montículo continha silos de armazenamento, e nos tempos bizantinos e otomanos serviu de cemitério. Tell ed-Damiyeh fica hoje no vale do Jordão, na Jordânia."
  de:
    - "Adam oder Adama war eine Stadt im Jordantal an einer Furt des Flusses, bei Zaretan. Die meisten Gelehrten setzen sie mit Tell ed-Damiye (Tall Damiya) gleich, einem Hügel am Ostufer des Jordan unmittelbar südlich der Jabbokmündung, nahe der Brücke von Damiya; der Amerikaner J. W. McGarvey, der 1879 dort war, gehörte zu den Ersten, die diese Gleichung aufstellten, und der alte Name lebt in Damiya fort. Die Stadt wird gewöhnlich in der Ortsliste des ägyptischen Königs Scheschonq I. in Karnak aus dem späten zehnten Jahrhundert v. Chr. erkannt, einige Einträge nach Pnuel. Die Ausgräber selbst weisen darauf hin, dass die geringe Größe des Hügels, nur wenige Hektar, die Gleichsetzung unsicherer macht, als es scheint."
    - "Als Israel dem Jordan gegenüber von Jericho überschritt, „da stand das Wasser, das von oben herniederkam, aufgerichtet auf einem Haufen, sehr ferne, bei der Stadt Adam, die zur Seite Zarthans liegt; aber das Wasser das zum Meer hinunterlief, zum Salzmeer, das nahm ab und verfloß“. Dies ist die einzige sichere Erwähnung der Stadt. Der Fluss ist bei Damiya in geschichtlicher Zeit verstopft worden: Der arabische Historiker an-Nuwairi aus dem 14. Jahrhundert berichtet, dass im Dezember 1267, als die Brücke des Sultans Baibars bei Damiya ausgebessert wurde, ein hohes Ufer auf der Westseite in den Jordan stürzte und seinen Lauf von Mitternacht bis zur vierten Stunde des Tages unterbrach."
    - "Grabungen von Lucas Petit vom Nationalen Museum für Altertümer in Leiden und Zeidan Kafafi von der Yarmouk-Universität, nach Sondierungen 2004–2005 und Kampagnen von 2012 bis 2019, legten einen spät eisenzeitlichen Komplex aus Vorratsräumen und ein Heiligtum mit zwei Plattformen frei, dazu bemalte Terrakottafiguren von Pferden und Frauen, ägyptische Skarabäen und einen Keilschrifttext; der Komplex brannte um 700 v. Chr. in einem heftigen Feuer nieder. In persischer und hellenistischer Zeit enthielt der Hügel Vorratsgruben, und in byzantinischer und osmanischer Zeit war er ein Friedhof. Tell ed-Damiye liegt heute im Jordantal, in Jordanien."
  fr:
    - "Adam, ou Adama, était une ville de la vallée du Jourdain, près d’un gué du fleuve, « à côté de Tsarthan ». La plupart des exégètes l’identifient avec Tell ed-Damiyeh (Tall Damiya), une butte de la rive orientale du Jourdain, juste au sud de l’embouchure du Jabbok, près du pont de Damiya ; l’Américain J. W. McGarvey, qui s’y rendit en 1879, fut parmi les premiers à faire cette équation, et l’ancien nom survit dans Damiya. On reconnaît d’ordinaire la ville dans la liste de lieux du roi égyptien Sheshonq Ier à Karnak, de la fin du Xe siècle av. J.-C., quelques entrées après Peniel. Les fouilleurs notent eux-mêmes que la petite taille de la butte, quelques hectares seulement, rend l’identification moins sûre qu’il n’y paraît."
    - "Quand Israël traversa le Jourdain vis-à-vis de Jéricho, « les eaux qui descendent d’en haut s’arrêtèrent, et s’élevèrent en un monceau, à une très grande distance, près de la ville d’Adam, qui est à côté de Tsarthan ; et celles qui descendaient vers la mer de la plaine, la mer Salée, furent complètement coupées ». C’est la seule mention certaine de la ville. Le fleuve a été barré près de Damiya à l’époque historique : l’historien arabe du XIVe siècle an-Nuwayri rapporte qu’en décembre 1267, pendant la réparation du pont du sultan Baybars à Damiya, une haute berge de la rive ouest s’écroula dans le Jourdain et arrêta son cours de minuit jusqu’à la quatrième heure du jour."
    - "Les fouilles de Lucas Petit, du Musée national des antiquités de Leyde, et de Zeidan Kafafi, de l’université du Yarmouk, après des sondages en 2004–2005 et des campagnes de 2012 à 2019, ont mis au jour un complexe du Fer récent de magasins et un sanctuaire à deux plates-formes, des figurines de terre cuite peintes de chevaux et de femmes, des scarabées égyptiens et un texte cunéiforme ; le complexe fut détruit par un violent incendie vers 700 av. J.-C. Aux époques perse et hellénistique la butte comptait des fosses de stockage, et aux époques byzantine et ottomane elle servit de cimetière. Tell ed-Damiyeh se trouve aujourd’hui dans la vallée du Jourdain, en Jordanie."
  it:
    - "Adam, o Adamah, era una città della valle del Giordano presso un guado del fiume, «allato di Tsartan». La maggior parte degli studiosi la identifica con Tell ed-Damiyeh (Tall Damiya), un tell sulla riva orientale del Giordano appena a sud della foce dello Iabbok, presso il ponte di Damiya; l’americano J. W. McGarvey, che lo visitò nel 1879, fu tra i primi a proporre l’equazione, e l’antico nome sopravvive in Damiya. La città si riconosce di solito nell’elenco di località del re egizio Sheshonq I a Karnak, della fine del X secolo a.C., alcune voci dopo Penuel. Gli stessi scavatori osservano che le dimensioni ridotte del tell, pochi ettari, rendono l’identificazione meno sicura di quanto sembri."
    - "Quando Israele attraversò il Giordano dirimpetto a Gerico, «le acque che scendevano d’insù si fermarono e si elevarono in un mucchio, a una grandissima distanza, fin presso la città di Adam che è allato di Tsartan; e quelle che scendevano verso il mare della pianura, il mar Salato, furono interamente separate da esse». È l’unica menzione certa della città. Il fiume è stato sbarrato presso Damiya in tempi storici: lo storico arabo del XIV secolo an-Nuwayri racconta che nel dicembre 1267, mentre si riparava il ponte del sultano Baybars a Damiya, un’alta sponda sul lato occidentale franò nel Giordano e ne fermò il corso da mezzanotte fino alla quarta ora del giorno."
    - "Gli scavi di Lucas Petit del Museo nazionale di antichità di Leida e di Zeidan Kafafi dell’Università dello Yarmouk, dopo i sondaggi del 2004–2005 e le campagne dal 2012 al 2019, hanno portato alla luce un complesso della tarda età del Ferro con magazzini e un santuario con due piattaforme, figurine di terracotta dipinta di cavalli e donne, scarabei egizi e un testo cuneiforme; il complesso bruciò in un violento incendio intorno al 700 a.C. In epoca persiana ed ellenistica il tell ospitò fosse per derrate e in età bizantina e ottomana fu un cimitero. Tell ed-Damiyeh si trova oggi nella valle del Giordano, in Giordania."
  nl:
    - "Adam, of Adama, was een stad in de Jordaanvallei bij een doorwaadbare plaats van de rivier, “ter zijde van Sarthan”. De meeste geleerden vereenzelvigen haar met Tell ed-Damiyeh (Tall Damiya), een heuvel aan de oostelijke oever van de Jordaan net ten zuiden van de monding van de Jabbok, bij de brug van Damiya; de Amerikaan J. W. McGarvey, die er in 1879 kwam, was een van de eersten die deze gelijkstelling maakte, en de oude naam leeft voort in Damiya. De stad wordt gewoonlijk herkend in de lijst van plaatsen van de Egyptische koning Sjosjenq I in Karnak, uit de late tiende eeuw v.Chr., enkele vermeldingen na Peniël. De opgravers zelf merken op dat de geringe omvang van de heuvel, slechts enkele hectaren, de gelijkstelling minder zeker maakt dan zij lijkt."
    - "Toen Israël de Jordaan overtrok tegenover Jericho, “stonden de wateren, die van boven afkwamen; zij rezen op een hoop, zeer verre van de stad Adam af, die ter zijde van Sarthan ligt; en die naar de zee des vlakken velds, te weten de Zoutzee, afliepen, vergingen, zij werden afgesneden”. Dit is de enige zekere vermelding van de stad. De rivier is in historische tijden bij Damiya afgedamd: de Arabische geschiedschrijver an-Nuwayri uit de veertiende eeuw vermeldt dat in december 1267, terwijl de brug van sultan Baybars bij Damiya werd hersteld, een hoge oever aan de westzijde in de Jordaan stortte en de stroom van middernacht tot het vierde uur van de dag stillegde."
    - "Opgravingen van Lucas Petit van het Rijksmuseum van Oudheden in Leiden en Zeidan Kafafi van de Yarmouk-universiteit, na proefsleuven in 2004–2005 en campagnes van 2012 tot 2019, brachten een complex uit de late ijzertijd aan het licht met voorraadkamers en een heiligdom met twee platforms, beschilderde terracotta beeldjes van paarden en vrouwen, Egyptische scarabeeën en een spijkerschrifttekst; het complex brandde omstreeks 700 v.Chr. in een hevige brand af. In de Perzische en hellenistische tijd bevatte de heuvel voorraadkuilen, en in de Byzantijnse en Ottomaanse tijd was hij een begraafplaats. Tell ed-Damiyeh ligt tegenwoordig in de Jordaanvallei, in Jordanië."
  pl:
    - "Adam, czyli Adama, było miastem w dolinie Jordanu, przy brodzie na rzece, „ku stronie Sartan”. Większość uczonych utożsamia je z Tell ed-Damiją (Tall Damija), wzgórzem na wschodnim brzegu Jordanu, tuż na południe od ujścia Jabboku, w pobliżu mostu w Damiji; Amerykanin J. W. McGarvey, który odwiedził to miejsce w 1879 roku, był jednym z pierwszych, którzy dokonali tego utożsamienia, a dawna nazwa żyje w nazwie Damija. Miasto rozpoznaje się zwykle na liście miejscowości egipskiego króla Szeszonka I w Karnaku, z końca X w. p.n.e., kilka pozycji po Penuel. Sami badacze zauważają, że niewielki rozmiar wzgórza, zaledwie kilka hektarów, czyni to utożsamienie mniej pewnym, niż się wydaje."
    - "Gdy Izrael przeprawiał się przez Jordan naprzeciw Jerycha, „wody płynące z gór, a stanęły w jednej kupie bardzo daleko od Adama, miasta, które jest ku stronie Sartan; a które płynęły na dół do morza pustego, morza słonego, zginęły i ustały”. Jest to jedyna pewna wzmianka o tym mieście. W czasach historycznych rzeka bywała zatamowana w okolicy Damiji: czternastowieczny arabski historyk an-Nuwajri zapisał, że w grudniu 1267 roku, gdy naprawiano most sułtana Bajbarsa w Damiji, wysoki brzeg po zachodniej stronie osunął się do Jordanu i wstrzymał jego bieg od północy do czwartej godziny dnia."
    - "Wykopaliska Lucasa Petita z Narodowego Muzeum Starożytności w Lejdzie i Zeidana Kafafiego z Uniwersytetu Jarmuk, po sondażach w latach 2004-2005 i sezonach od 2012 do 2019 roku, odsłoniły kompleks z późnej epoki żelaza: magazyny i sanktuarium z dwiema platformami, malowane terakotowe figurki koni i kobiet, egipskie skarabeusze i tekst klinowy; kompleks spłonął w gwałtownym pożarze około 700 p.n.e. W okresie perskim i hellenistycznym na wzgórzu znajdowały się jamy zasobowe, a w czasach bizantyjskich i osmańskich cmentarz. Tell ed-Damija leży dziś w Dolinie Jordanu, w Jordanii."
  cs:
    - "Adam, neboli Adama, bylo město v Jordánském údolí u brodu přes řeku, „k straně Sartan“. Většina badatelů je ztotožňuje s Tell ad-Damíja (Tall Damíja), pahorkem na východním břehu Jordánu těsně jižně od ústí Jaboku, poblíž mostu Damíja; Američan J. W. McGarvey, který místo navštívil roku 1879, patřil k prvním, kdo toto ztotožnění provedli, a staré jméno žije v názvu Damíja. Město se obvykle poznává v seznamu míst egyptského krále Šošenka I. v Karnaku z konce desátého století př. n. l., několik položek za Penuelem. Sami vykopávači poznamenávají, že malá velikost pahorku, jen několik hektarů, činí ztotožnění méně jistým, než se zdá."
    - "Když Izrael přecházel Jordán proti Jerichu, „zastavily se vody, kteréž s hůry přicházely, a shrnuly se v hromadu jednu velmi daleko od Adam města, kteréž leží k straně Sartan, kteréž pak odcházely k moři dolů, k moři slanému sešly a sběhly“. Je to jediná jistá zmínka o městě. V historické době byla řeka u Damíje přehrazena: arabský historik čtrnáctého století an-Nuwajrí zaznamenává, že v prosinci 1267, když se opravoval most sultána Bajbarse u Damíje, spadl do Jordánu vysoký břeh na západní straně a zastavil jeho tok od půlnoci do čtvrté hodiny dne."
    - "Vykopávky Lucase Petita z Národního muzea starožitností v Leidenu a Zeidana Kafafiho z Jarmúkské univerzity, po sondách v letech 2004–2005 a v sezonách od roku 2012 do roku 2019, odkryly komplex z pozdní doby železné se skladišti a svatyní se dvěma podstavci, malované terakotové figurky koní a žen, egyptské skarabey a klínopisný text; komplex kolem roku 700 př. n. l. vyhořel v prudkém požáru. V perském a helénistickém období byly na pahorku zásobní jámy a v byzantské a osmanské době hřbitov. Tell ad-Damíja leží dnes v Jordánském údolí, v Jordánsku."
  sv:
    - "Adam, eller Adama, var en stad i Jordandalen vid ett vadställe i floden, ”bredvid Saretan”. De flesta forskare identifierar den med Tell ed-Damiyeh (Tall Damiya), en kulle på Jordans östra strand strax söder om Jabboks mynning, nära Damiyabron; amerikanen J. W. McGarvey, som besökte platsen 1879, var bland de första som gjorde jämförelsen, och det gamla namnet lever kvar i Damiya. Staden brukar kännas igen i den egyptiske kungen Shoshenq I:s ortlista i Karnak, från slutet av 900-talet f.Kr., några poster efter Penuel. Utgrävarna själva påpekar att kullens ringa storlek, bara några hektar, gör identifieringen osäkrare än den ser ut."
    - "När Israel gick över Jordan mitt emot Jeriko, ”då stannade det vatten som kom uppifrån, och blev stående såsom en samlad hög långt borta, uppe vid Adam, staden som ligger bredvid Saretan; och det vatten som flöt ned mot Hedmarkshavet, Salthavet, blev sålunda helt och hållet avskuret”. Det är den enda säkra omnämningen av staden. Floden har blockerats nära Damiya under historisk tid: den arabiske historikern an-Nuwayri på 1300-talet berättar att en hög strandbank på västsidan i december 1267, medan sultan Baybars bro vid Damiya reparerades, föll ned i Jordan och stoppade dess flöde från midnatt till dagens fjärde timme."
    - "Utgrävningar av Lucas Petit vid Nationalmuseet för fornsaker i Leiden och Zeidan Kafafi vid Yarmouk-universitetet, efter provgrävningar 2004–2005 och säsonger från 2012 till 2019, blottlade ett komplex från sena järnåldern med förrådsrum och en helgedom med två plattformar, målade terrakottafigurer av hästar och kvinnor, egyptiska skarabéer och en kilskriftstext; komplexet brann ned i en våldsam eld omkring 700 f.Kr. Under den persiska och hellenistiska tiden fanns lagringsgropar på kullen, och under bysantinsk och osmansk tid var den en begravningsplats. Tell ed-Damiyeh ligger i dag i Jordandalen i Jordanien."
