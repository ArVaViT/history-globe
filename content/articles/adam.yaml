# Overview article (ADR 0007). Tell ed-Damiyeh is the usual identification, questioned for the mound's small size; excavation dates follow the Leiden–Yarmouk project.
id: adam
place: adc31c7
title:
  en: "Adam"
  ru: "Адам"
  uk: "Адам"
  es: "Adam"
  pt: "Adã"
