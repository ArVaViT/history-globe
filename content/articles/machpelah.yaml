# Overview article (ADR 0007). Mainstream facts only; the Herodian date of the enclosure is given as the usual attribution; written for the tomb itself, Hebron having its own article.
id: machpelah
place: ae00861
title:
  en: "Machpelah"
  ru: "Махпела"
  uk: "Махпела"
  es: "Macpela"
  pt: "Macpela"
  de: "Machpela"
  fr: "Macpéla"
body:
  en:
    - "Machpelah is the cave at Hebron in which Abraham buried Sarah, and the field in which it lay. The name, “double”, may describe a cave of two chambers; the Greek Bible calls it the double cave. In Genesis 23 Abraham, “a stranger and a sojourner” among the Hittites of Hebron, asks for “the cave of Machpelah”, at the end of Ephron's field, and buys the field, the cave and the trees “before Mamre” for “four hundred shekels of silver, current money with the merchant”, weighed out at the city gate: the first piece of the promised land his family owned. There Isaac and Ishmael buried him; there Jacob, dying in Egypt, asked to lie with his fathers, “there they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah”, and his sons carried him up to Canaan and did so."
    - "Over the cave stands a great rectangular enclosure of drafted ashlars with pilasters, about 59 by 34 m, without inscription but so like the walls of Herod's Temple Mount that it is attributed to Herod the Great. Josephus speaks of the patriarchs' monuments of fine marble at Hebron, and the pilgrim of Bordeaux in 333 saw a square monument of wonderful beauty where the three patriarchs and their wives lay. A church was built inside the enclosure in the Byzantine period; after the Arab conquest the building became the mosque of Abraham, the Haram al-Khalil; the Crusaders made it a church again in the twelfth century, when canons are said to have entered the cave and found the bones, and Saladin restored it as a mosque, with a pulpit made at Ascalon in 1091."
    - "From 1267, under the Mamluk sultan Baybars, Jews and Christians were barred from the building and prayed at a step outside, until 1967, when Israel took Hebron. The cave itself, under the floor, is closed; the six cenotaphs above it stand for Abraham, Sarah, Isaac, Rebekah, Jacob and Leah, and a cenotaph of Joseph was added beside them. In 1994 a Jewish settler shot dead twenty-nine Muslims at prayer here, and the building has since been divided between a mosque and a synagogue, each side opened wholly to the other on a few days a year. UNESCO inscribed the old town of Hebron with the sanctuary in 2017. Stephen's speech in Acts, by contrast, speaks of a tomb that Abraham bought at Shechem, where Genesis has Jacob buy land and Abraham buy at Hebron."
  ru:
    - "Махпела — пещера в Хевроне, в которой Авраам похоронил Сарру, и поле, на котором она лежала. Имя, «двойная», может описывать пещеру из двух камер; греческая Библия называет её двойной пещерой. В 23-й главе Бытия Авраам, «пришлец и поселенец» среди Хеттеев Хеврона, просит отдать ему «пещеру Махпелу», которая на конце поля Ефрона, и покупает поле, пещеру и деревья «против Мамре» за «четыреста сиклей серебра, какое ходит у купцов», отвешенных у городских ворот: первый клочок обетованной земли, которым владела его семья. Там погребли его Исаак и Измаил; там Иаков, умирая в Египте, просил положить его с отцами: «там похоронили Авраама и Сарру, жену его; там похоронили Исаака и Ревекку, жену его; и там похоронил я Лию», — и сыновья отнесли его в Ханаан и исполнили это."
    - "Над пещерой стоит огромная прямоугольная ограда из тёсаных камней с пилястрами, около 59 на 34 м, без надписи, но настолько похожая на стены Храмовой горы Ирода, что её приписывают Ироду Великому. Иосиф Флавий говорит о памятниках патриархов из прекрасного мрамора в Хевроне, а паломник из Бордо в 333 г. видел четырёхугольный памятник дивной красоты, где лежат три патриарха с жёнами. В византийское время внутри ограды построили церковь; после арабского завоевания здание стало мечетью Авраама, Харам-эль-Халиль; крестоносцы в XII веке снова сделали его церковью, и тогда, как рассказывают, каноники спустились в пещеру и нашли кости, а Саладин вернул ему вид мечети и поставил минбар, сделанный в Аскалоне в 1091 г."
    - "С 1267 г., при мамлюкском султане Бейбарсе, иудеям и христианам был закрыт вход в здание, и они молились на ступени снаружи, пока в 1967 г. Израиль не занял Хеврон. Сама пещера под полом закрыта; шесть кенотафов над ней означают Авраама, Сарру, Исаака, Ревекку, Иакова и Лию, а рядом добавлен кенотаф Иосифа. В 1994 г. еврейский поселенец застрелил здесь двадцать девять мусульман на молитве, и с тех пор здание разделено между мечетью и синагогой, а несколько дней в году каждая сторона целиком открыта другой. В 2017 г. ЮНЕСКО внесла старый город Хеврона со святилищем в список Всемирного наследия. Речь Стефана в Деяниях, напротив, говорит о гробе, который Авраам купил в Сихеме, тогда как по книге Бытия в Сихеме покупал землю Иаков, а Авраам — в Хевроне."
  uk:
    - "Махпела — печера в Хевроні, в якій Авраам поховав Сарру, і поле, на якому вона лежала. Назва, «подвійна», може описувати печеру з двома кімнатами; грецька Біблія називає її подвійною печерою. У Книзі Буття, розділ 23, Авраам, «Пересельник і чужениця я в вас» серед хетів Хеврона, просить, щоб йому поступилися «печерою Махпеловою», на краю поля Ефрона, і купує поле, печеру та дерева «навпроти Мамрійщини» за «чотирі ста секлїв срібла ходячого в купцїв», відважені при міській брамі: перша ділянка обітованої землі, яку мала його родина. Там поховали його Ісаак та Ізмаїл; там Яків, умираючи в Єгипті, просив покласти його з батьками: «Там поховано Авраама й Сарру, жону його; там поховано Ізаака й Ребеку, жену його, і там поховав я Лею», і сини понесли його до Ханаану й зробили так."
    - "Над печерою стоїть велика прямокутна огорожа з обтесаних квадрів із пілястрами, приблизно 59 на 34 м, без напису, але так схожа на стіни Храмової гори Ірода, що її приписують Іродові Великому. Йосиф Флавій говорить про пам’ятки патріархів із тонкого мармуру в Хевроні, а Бордоський пілігрим 333 р. бачив чотирикутну пам’ятку дивної краси, де лежали три патріархи та їхні дружини. У візантійську добу всередині огорожі збудували церкву; після арабського завоювання будівля стала мечеттю Авраама, Харам аль-Халіль; хрестоносці знову зробили її церквою в XII ст., коли каноніки, як кажуть, увійшли до печери й знайшли кістки, а Салах-ад-Дін відновив її як мечеть, із мінбаром, виготовленим в Ашкелоні 1091 р."
    - "Від 1267 р., за мамлюцького султана Бейбарса, євреям і християнам було заборонено входити до будівлі, і вони молилися на сходинці ззовні, аж до 1967 р., коли Ізраїль узяв Хеврон. Сама печера, під підлогою, зачинена; шість кенотафів над нею позначають Авраама, Сарру, Ісаака, Ревеку, Якова й Лію, а поруч додано кенотаф Йосипа. 1994 р. єврейський поселенець розстріляв тут двадцять дев’ять мусульман під час молитви, і відтоді будівлю поділено між мечеттю й синагогою, кожну сторону повністю відкривають іншій у кілька днів на рік. ЮНЕСКО внесло старе місто Хеврона зі святинею до списку 2017 р. Промова Стефана в Діях, навпаки, говорить про гробницю, яку Авраам купив у Сихемі, тоді як у Книзі Буття Яків купує землю, а Авраам купує в Хевроні."
  es:
    - "Macpela es la cueva de Hebrón en la que Abraham sepultó a Sara, y el campo en que estaba. El nombre, «doble», puede describir una cueva de dos cámaras; la Biblia griega la llama la cueva doble. En Génesis 23, Abraham, «Peregrino y advenedizo» entre los hititas de Hebrón, pide «la cueva de Macpela», al cabo de la heredad de Efrón, y compra el campo, la cueva y los árboles «enfrente de Mamre» por «cuatrocientos siclos de plata, de buena ley entre mercaderes», pesados en la puerta de la ciudad: la primera porción de la tierra prometida que su familia poseyó. Allí lo sepultaron Isaac e Ismael; allí Jacob, moribundo en Egipto, pidió yacer con sus padres: «Allí sepultaron á Abraham y á Sara su mujer; allí sepultaron á Isaac y á Rebeca su mujer; allí también sepulté yo á Lea», y sus hijos lo llevaron a Canaán y así lo hicieron."
    - "Sobre la cueva se alza un gran recinto rectangular de sillares con margen cincelado y pilastras, de unos 59 por 34 m, sin inscripción pero tan parecido a los muros del Monte del Templo de Herodes que se atribuye a Herodes el Grande. Josefo habla de los monumentos de los patriarcas, de fino mármol, en Hebrón, y el peregrino de Burdeos vio en 333 un monumento cuadrado de maravillosa belleza donde yacían los tres patriarcas y sus esposas. En el período bizantino se construyó una iglesia dentro del recinto; tras la conquista árabe el edificio pasó a ser la mezquita de Abraham, el Haram al-Khalil; los cruzados lo convirtieron de nuevo en iglesia en el siglo XII, cuando se dice que los canónigos entraron en la cueva y hallaron los huesos, y Saladino lo restauró como mezquita, con un púlpito hecho en Ascalón en 1091."
    - "Desde 1267, bajo el sultán mameluco Baybars, judíos y cristianos tuvieron prohibida la entrada al edificio y rezaban en un escalón exterior, hasta 1967, cuando Israel tomó Hebrón. La cueva misma, bajo el suelo, está cerrada; los seis cenotafios que hay sobre ella representan a Abraham, Sara, Isaac, Rebeca, Jacob y Lea, y junto a ellos se añadió un cenotafio de José. En 1994 un colono judío mató a tiros a veintinueve musulmanes que rezaban aquí, y desde entonces el edificio está dividido entre una mezquita y una sinagoga, cada parte abierta por completo a la otra unos pocos días al año. La UNESCO inscribió en 2017 la ciudad vieja de Hebrón con el santuario. El discurso de Esteban en Hechos, en cambio, habla de un sepulcro que Abraham compró en Siquem, donde Génesis hace que Jacob compre tierra y que Abraham compre en Hebrón."
  pt:
    - "Macpela é a caverna em Hebrom onde Abraão sepultou Sara, e o campo em que ficava. O nome, “dupla”, pode descrever uma caverna de duas câmaras; a Bíblia grega a chama de caverna dupla. Em Gênesis 23, Abraão, “estrangeiro e peregrino” entre os hititas de Hebrom, pede “a caverna de Macpela”, na extremidade do campo de Efrom, e compra o campo, a caverna e as árvores “em frente a Manre” por “quatrocentos siclos de prata, de acordo com o peso corrente entre os mercadores”, pesados à porta da cidade: a primeira parcela da terra prometida que sua família possuiu. Ali Isaque e Ismael o sepultaram; ali Jacó, morrendo no Egito, pediu para jazer com seus pais: “Lá sepultaram Abraão e Sara, sua mulher. Lá sepultaram Isaque e Rebeca, sua mulher, e lá eu sepultei Lia”, e seus filhos o levaram a Canaã e assim fizeram."
    - "Sobre a caverna ergue-se um grande recinto retangular de silhares emoldurados com pilastras, de cerca de 59 por 34 m, sem inscrição, mas tão semelhante às muralhas do Monte do Templo de Herodes que é atribuído a Herodes, o Grande. Josefo fala dos monumentos de mármore fino dos patriarcas em Hebrom, e o peregrino de Bordéus, em 333, viu um monumento quadrado de maravilhosa beleza onde jaziam os três patriarcas e suas mulheres. Uma igreja foi construída dentro do recinto no período bizantino; depois da conquista árabe o edifício tornou-se a mesquita de Abraão, o Haram al-Khalil; os cruzados fizeram dele de novo uma igreja no século XII, quando se diz que cônegos entraram na caverna e acharam os ossos, e Saladino o restaurou como mesquita, com um púlpito feito em Ascalão em 1091."
    - "A partir de 1267, sob o sultão mameluco Baybars, judeus e cristãos foram impedidos de entrar no edifício e oravam num degrau do lado de fora, até 1967, quando Israel tomou Hebrom. A própria caverna, sob o piso, está fechada; os seis cenotáfios acima dela representam Abraão, Sara, Isaque, Rebeca, Jacó e Lia, e um cenotáfio de José foi acrescentado ao lado. Em 1994 um colono judeu matou a tiros vinte e nove muçulmanos em oração aqui, e o edifício foi desde então dividido entre uma mesquita e uma sinagoga, cada lado aberto por inteiro ao outro em alguns dias do ano. A UNESCO inscreveu a cidade velha de Hebrom com o santuário em 2017. O discurso de Estêvão em Atos, por outro lado, fala de um túmulo que Abraão comprou em Siquém, onde Gênesis faz Jacó comprar terra e Abraão comprar em Hebrom."
  de:
    - "Machpela ist die Höhle bei Hebron, in der Abraham Sara begrub, und das Feld darum. Der Name, „doppelt“, meint vielleicht eine Höhle mit zwei Kammern; die griechische Bibel nennt sie die doppelte Höhle. In 1. Mose 23 sagt Abraham den Hethitern von Hebron: „Ich bin ein Fremder und Einwohner bei euch“, bittet um „seine zwiefache Höhle, die er hat am Ende seines Ackers“ und kauft Feld, Höhle und Bäume „Mamre gegenüber“ für „vierhundert Lot Silber, das im Kauf gang und gäbe war“, am Stadttor abgewogen: das erste Stück des verheißenen Landes in seinem Familienbesitz. Dort begruben ihn Isaak und Ismael; dort wollte Jakob, sterbend in Ägypten, bei den Vätern liegen: „Daselbst haben sie Abraham begraben und Sara, sein Weib. Daselbst haben sie auch Isaak begraben und Rebekka, sein Weib. Daselbst habe ich auch Lea begraben“; seine Söhne brachten ihn nach Kanaan und begruben ihn dort."
    - "Über der Höhle steht eine große rechteckige Umfassung aus Quadern mit Randschlag und Pilastern, etwa 59 mal 34 m, ohne Inschrift, aber den Mauern des herodianischen Tempelbergs so ähnlich, dass man sie Herodes dem Großen zuschreibt. Josephus spricht von Denkmälern der Patriarchen aus feinem Marmor in Hebron, und der Pilger von Bordeaux sah 333 ein quadratisches Denkmal von wunderbarer Schönheit, in dem die drei Patriarchen und ihre Frauen lagen. In byzantinischer Zeit wurde innerhalb der Umfassung eine Kirche gebaut; nach der arabischen Eroberung wurde das Gebäude zur Abraham-Moschee, dem Haram al-Khalil; die Kreuzfahrer machten es im 12. Jahrhundert wieder zur Kirche, wobei Chorherren in die Höhle eingedrungen sein und die Gebeine gefunden haben sollen, und Saladin stellte es als Moschee wieder her, mit einer 1091 in Aschkelon gefertigten Kanzel."
    - "Ab 1267, unter dem Mamelukensultan Baibars, war Juden und Christen der Zutritt zum Gebäude verwehrt, und sie beteten an einer Stufe draußen, bis Israel 1967 Hebron einnahm. Die Höhle selbst unter dem Boden ist verschlossen; die sechs Kenotaphe darüber stehen für Abraham, Sara, Isaak, Rebekka, Jakob und Lea, und ein Kenotaph Josefs wurde daneben hinzugefügt. 1994 erschoss hier ein jüdischer Siedler neunundzwanzig betende Muslime, und das Gebäude ist seither zwischen einer Moschee und einer Synagoge geteilt, wobei jede Seite an wenigen Tagen im Jahr der anderen ganz geöffnet wird. Die UNESCO nahm die Altstadt von Hebron mit dem Heiligtum 2017 in die Liste auf. Die Rede des Stephanus in der Apostelgeschichte spricht dagegen von einem Grab, das Abraham in Sichem kaufte, während die Genesis Jakob dort Land kaufen und Abraham in Hebron kaufen lässt."
  fr:
    - "Macpéla est la caverne d’Hébron où Abraham enterra Sara, et le champ où elle se trouvait. Le nom, « double », peut décrire une caverne à deux chambres ; la Bible grecque l’appelle la caverne double. Dans Genèse 23, Abraham, « étranger et habitant » parmi les Hittites d’Hébron, demande « la caverne de Macpéla », à l’extrémité du champ d’Éphron, et achète le champ, la caverne et les arbres « vis-à-vis de Mamré » pour « quatre cents sicles d’argent ayant cours chez le marchand », pesés à la porte de la ville : le premier morceau de la terre promise que sa famille posséda. Là l’enterrèrent Isaac et Ismaël ; là Jacob, mourant en Égypte, demanda à reposer avec ses pères : « Là on a enterré Abraham et Sara, sa femme ; là on a enterré Isaac et Rebecca, sa femme ; et là j’ai enterré Léa », et ses fils le transportèrent au pays de Canaan et firent ainsi."
    - "Au-dessus de la caverne se dresse une grande enceinte rectangulaire de blocs à marges ciselées et de pilastres, d’environ 59 sur 34 m, sans inscription mais si semblable aux murs de l’esplanade du Temple d’Hérode qu’on l’attribue à Hérode le Grand. Flavius Josèphe parle de monuments des patriarches en beau marbre à Hébron, et le pèlerin de Bordeaux vit en 333 un monument carré d’une beauté merveilleuse où reposaient les trois patriarches et leurs épouses. Une église fut bâtie à l’intérieur de l’enceinte à l’époque byzantine ; après la conquête arabe, l’édifice devint la mosquée d’Abraham, le Haram al-Khalil ; les croisés en refirent une église au XIIe siècle, époque où des chanoines auraient pénétré dans la caverne et trouvé les ossements, et Saladin la restaura en mosquée, avec une chaire faite à Ascalon en 1091."
    - "À partir de 1267, sous le sultan mamelouk Baybars, Juifs et chrétiens furent exclus de l’édifice et priaient sur une marche à l’extérieur, jusqu’en 1967, quand Israël prit Hébron. La caverne elle-même, sous le sol, est fermée ; les six cénotaphes au-dessus représentent Abraham, Sara, Isaac, Rebecca, Jacob et Léa, et un cénotaphe de Joseph a été ajouté à côté. En 1994, un colon juif y abattit vingt-neuf musulmans en prière, et l’édifice a depuis été divisé entre une mosquée et une synagogue, chaque côté s’ouvrant entièrement à l’autre quelques jours par an. L’UNESCO a inscrit en 2017 la vieille ville d’Hébron avec le sanctuaire. Le discours d’Étienne dans les Actes, en revanche, parle d’un tombeau qu’Abraham acheta à Sichem, là où la Genèse fait acheter à Jacob un terrain et à Abraham, à Hébron."
