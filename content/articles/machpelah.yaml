# Overview article (ADR 0007). Mainstream facts only; the Herodian date of the enclosure is given as the usual attribution; written for the tomb itself, Hebron having its own article.
id: machpelah
place: ae00861
title:
  en: "Machpelah"
  ru: "Махпела"
body:
  en:
    - "Machpelah is the cave at Hebron in which Abraham buried Sarah, and the field in which it lay. The name, “double”, may describe a cave of two chambers; the Greek Bible calls it the double cave. In Genesis 23 Abraham, “a stranger and a sojourner” among the Hittites of Hebron, asks for “the cave of Machpelah”, at the end of Ephron's field, and buys the field, the cave and the trees “before Mamre” for “four hundred shekels of silver, current money with the merchant”, weighed out at the city gate: the first piece of the promised land his family owned. There Isaac and Ishmael buried him; there Jacob, dying in Egypt, asked to lie with his fathers, “there they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah”, and his sons carried him up to Canaan and did so."
    - "Over the cave stands a great rectangular enclosure of drafted ashlars with pilasters, about 59 by 34 m, without inscription but so like the walls of Herod's Temple Mount that it is attributed to Herod the Great. Josephus speaks of the patriarchs' monuments of fine marble at Hebron, and the pilgrim of Bordeaux in 333 saw a square monument of wonderful beauty where the three patriarchs and their wives lay. A church was built inside the enclosure in the Byzantine period; after the Arab conquest the building became the mosque of Abraham, the Haram al-Khalil; the Crusaders made it a church again in the twelfth century, when canons are said to have entered the cave and found the bones, and Saladin restored it as a mosque, with a pulpit made at Ascalon in 1091."
    - "From 1267, under the Mamluk sultan Baybars, Jews and Christians were barred from the building and prayed at a step outside, until 1967, when Israel took Hebron. The cave itself, under the floor, is closed; the six cenotaphs above it stand for Abraham, Sarah, Isaac, Rebekah, Jacob and Leah, and a cenotaph of Joseph was added beside them. In 1994 a Jewish settler shot dead twenty-nine Muslims at prayer here, and the building has since been divided between a mosque and a synagogue, each side opened wholly to the other on a few days a year. UNESCO inscribed the old town of Hebron with the sanctuary in 2017. Stephen's speech in Acts, by contrast, speaks of a tomb that Abraham bought at Shechem, where Genesis has Jacob buy land and Abraham buy at Hebron."
  ru:
    - "Махпела — пещера в Хевроне, в которой Авраам похоронил Сарру, и поле, на котором она лежала. Имя, «двойная», может описывать пещеру из двух камер; греческая Библия называет её двойной пещерой. В 23-й главе Бытия Авраам, «пришлец и поселенец» среди Хеттеев Хеврона, просит отдать ему «пещеру Махпелу», которая на конце поля Ефрона, и покупает поле, пещеру и деревья «против Мамре» за «четыреста сиклей серебра, какое ходит у купцов», отвешенных у городских ворот: первый клочок обетованной земли, которым владела его семья. Там погребли его Исаак и Измаил; там Иаков, умирая в Египте, просил положить его с отцами: «там похоронили Авраама и Сарру, жену его; там похоронили Исаака и Ревекку, жену его; и там похоронил я Лию», — и сыновья отнесли его в Ханаан и исполнили это."
    - "Над пещерой стоит огромная прямоугольная ограда из тёсаных камней с пилястрами, около 59 на 34 м, без надписи, но настолько похожая на стены Храмовой горы Ирода, что её приписывают Ироду Великому. Иосиф Флавий говорит о памятниках патриархов из прекрасного мрамора в Хевроне, а паломник из Бордо в 333 г. видел четырёхугольный памятник дивной красоты, где лежат три патриарха с жёнами. В византийское время внутри ограды построили церковь; после арабского завоевания здание стало мечетью Авраама, Харам-эль-Халиль; крестоносцы в XII веке снова сделали его церковью, и тогда, как рассказывают, каноники спустились в пещеру и нашли кости, а Саладин вернул ему вид мечети и поставил минбар, сделанный в Аскалоне в 1091 г."
    - "С 1267 г., при мамлюкском султане Бейбарсе, иудеям и христианам был закрыт вход в здание, и они молились на ступени снаружи, пока в 1967 г. Израиль не занял Хеврон. Сама пещера под полом закрыта; шесть кенотафов над ней означают Авраама, Сарру, Исаака, Ревекку, Иакова и Лию, а рядом добавлен кенотаф Иосифа. В 1994 г. еврейский поселенец застрелил здесь двадцать девять мусульман на молитве, и с тех пор здание разделено между мечетью и синагогой, а несколько дней в году каждая сторона целиком открыта другой. В 2017 г. ЮНЕСКО внесла старый город Хеврона со святилищем в список Всемирного наследия. Речь Стефана в Деяниях, напротив, говорит о гробе, который Авраам купил в Сихеме, тогда как по книге Бытия в Сихеме покупал землю Иаков, а Авраам — в Хевроне."
