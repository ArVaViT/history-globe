body:
  en:
    - "Machpelah is the cave at Hebron in which Abraham buried Sarah, and the field in which it lay. The name, “double”, may describe a cave of two chambers; the Greek Bible calls it the double cave. In Genesis 23 Abraham, “a stranger and a sojourner” among the Hittites of Hebron, asks for “the cave of Machpelah”, at the end of Ephron's field, and buys the field, the cave and the trees “before Mamre” for “four hundred shekels of silver, current money with the merchant”, weighed out at the city gate: the first piece of the promised land his family owned. There Isaac and Ishmael buried him; there Jacob, dying in Egypt, asked to lie with his fathers, “there they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah”, and his sons carried him up to Canaan and did so."
    - "Over the cave stands a great rectangular enclosure of drafted ashlars with pilasters, about 59 by 34 m, without inscription but so like the walls of Herod's Temple Mount that it is attributed to Herod the Great. Josephus speaks of the patriarchs' monuments of fine marble at Hebron, and the pilgrim of Bordeaux in 333 saw a square monument of wonderful beauty where the three patriarchs and their wives lay. A church was built inside the enclosure in the Byzantine period; after the Arab conquest the building became the mosque of Abraham, the Haram al-Khalil; the Crusaders made it a church again in the twelfth century, when canons are said to have entered the cave and found the bones, and Saladin restored it as a mosque, with a pulpit made at Ascalon in 1091."
    - "From 1267, under the Mamluk sultan Baybars, Jews and Christians were barred from the building and prayed at a step outside, until 1967, when Israel took Hebron. The cave itself, under the floor, is closed; the six cenotaphs above it stand for Abraham, Sarah, Isaac, Rebekah, Jacob and Leah, and a cenotaph of Joseph was added beside them. In 1994 a Jewish settler shot dead twenty-nine Muslims at prayer here, and the building has since been divided between a mosque and a synagogue, each side opened wholly to the other on a few days a year. UNESCO inscribed the old town of Hebron with the sanctuary in 2017. Stephen's speech in Acts, by contrast, speaks of a tomb that Abraham bought at Shechem, where Genesis has Jacob buy land and Abraham buy at Hebron."
  ru:
    - "Махпела — пещера в Хевроне, в которой Авраам похоронил Сарру, и поле, на котором она лежала. Имя, «двойная», может описывать пещеру из двух камер; греческая Библия называет её двойной пещерой. В 23-й главе Бытия Авраам, «пришлец и поселенец» среди Хеттеев Хеврона, просит отдать ему «пещеру Махпелу», которая на конце поля Ефрона, и покупает поле, пещеру и деревья «против Мамре» за «четыреста сиклей серебра, какое ходит у купцов», отвешенных у городских ворот: первый клочок обетованной земли, которым владела его семья. Там погребли его Исаак и Измаил; там Иаков, умирая в Египте, просил положить его с отцами: «там похоронили Авраама и Сарру, жену его; там похоронили Исаака и Ревекку, жену его; и там похоронил я Лию», — и сыновья отнесли его в Ханаан и исполнили это."
    - "Над пещерой стоит огромная прямоугольная ограда из тёсаных камней с пилястрами, около 59 на 34 м, без надписи, но настолько похожая на стены Храмовой горы Ирода, что её приписывают Ироду Великому. Иосиф Флавий говорит о памятниках патриархов из прекрасного мрамора в Хевроне, а паломник из Бордо в 333 г. видел четырёхугольный памятник дивной красоты, где лежат три патриарха с жёнами. В византийское время внутри ограды построили церковь; после арабского завоевания здание стало мечетью Авраама, Харам-эль-Халиль; крестоносцы в XII веке снова сделали его церковью, и тогда, как рассказывают, каноники спустились в пещеру и нашли кости, а Саладин вернул ему вид мечети и поставил минбар, сделанный в Аскалоне в 1091 г."
    - "С 1267 г., при мамлюкском султане Бейбарсе, иудеям и христианам был закрыт вход в здание, и они молились на ступени снаружи, пока в 1967 г. Израиль не занял Хеврон. Сама пещера под полом закрыта; шесть кенотафов над ней означают Авраама, Сарру, Исаака, Ревекку, Иакова и Лию, а рядом добавлен кенотаф Иосифа. В 1994 г. еврейский поселенец застрелил здесь двадцать девять мусульман на молитве, и с тех пор здание разделено между мечетью и синагогой, а несколько дней в году каждая сторона целиком открыта другой. В 2017 г. ЮНЕСКО внесла старый город Хеврона со святилищем в список Всемирного наследия. Речь Стефана в Деяниях, напротив, говорит о гробе, который Авраам купил в Сихеме, тогда как по книге Бытия в Сихеме покупал землю Иаков, а Авраам — в Хевроне."
  uk:
    - "Махпела — печера в Хевроні, в якій Авраам поховав Сарру, і поле, на якому вона лежала. Назва, «подвійна», може описувати печеру з двома кімнатами; грецька Біблія називає її подвійною печерою. У Книзі Буття, розділ 23, Авраам, «Пересельник і чужениця я в вас» серед хетів Хеврона, просить, щоб йому поступилися «печерою Махпеловою», на краю поля Ефрона, і купує поле, печеру та дерева «навпроти Мамрійщини» за «чотирі ста секлїв срібла ходячого в купцїв», відважені при міській брамі: перша ділянка обітованої землі, яку мала його родина. Там поховали його Ісаак та Ізмаїл; там Яків, умираючи в Єгипті, просив покласти його з батьками: «Там поховано Авраама й Сарру, жону його; там поховано Ізаака й Ребеку, жену його, і там поховав я Лею», і сини понесли його до Ханаану й зробили так."
    - "Над печерою стоїть велика прямокутна огорожа з обтесаних квадрів із пілястрами, приблизно 59 на 34 м, без напису, але так схожа на стіни Храмової гори Ірода, що її приписують Іродові Великому. Йосиф Флавій говорить про пам’ятки патріархів із тонкого мармуру в Хевроні, а Бордоський пілігрим 333 р. бачив чотирикутну пам’ятку дивної краси, де лежали три патріархи та їхні дружини. У візантійську добу всередині огорожі збудували церкву; після арабського завоювання будівля стала мечеттю Авраама, Харам аль-Халіль; хрестоносці знову зробили її церквою в XII ст., коли каноніки, як кажуть, увійшли до печери й знайшли кістки, а Салах-ад-Дін відновив її як мечеть, із мінбаром, виготовленим в Ашкелоні 1091 р."
    - "Від 1267 р., за мамлюцького султана Бейбарса, євреям і християнам було заборонено входити до будівлі, і вони молилися на сходинці ззовні, аж до 1967 р., коли Ізраїль узяв Хеврон. Сама печера, під підлогою, зачинена; шість кенотафів над нею позначають Авраама, Сарру, Ісаака, Ревеку, Якова й Лію, а поруч додано кенотаф Йосипа. 1994 р. єврейський поселенець розстріляв тут двадцять дев’ять мусульман під час молитви, і відтоді будівлю поділено між мечеттю й синагогою, кожну сторону повністю відкривають іншій у кілька днів на рік. ЮНЕСКО внесло старе місто Хеврона зі святинею до списку 2017 р. Промова Стефана в Діях, навпаки, говорить про гробницю, яку Авраам купив у Сихемі, тоді як у Книзі Буття Яків купує землю, а Авраам купує в Хевроні."
  es:
    - "Macpela es la cueva de Hebrón en la que Abraham sepultó a Sara, y el campo en que estaba. El nombre, «doble», puede describir una cueva de dos cámaras; la Biblia griega la llama la cueva doble. En Génesis 23, Abraham, «Peregrino y advenedizo» entre los hititas de Hebrón, pide «la cueva de Macpela», al cabo de la heredad de Efrón, y compra el campo, la cueva y los árboles «enfrente de Mamre» por «cuatrocientos siclos de plata, de buena ley entre mercaderes», pesados en la puerta de la ciudad: la primera porción de la tierra prometida que su familia poseyó. Allí lo sepultaron Isaac e Ismael; allí Jacob, moribundo en Egipto, pidió yacer con sus padres: «Allí sepultaron á Abraham y á Sara su mujer; allí sepultaron á Isaac y á Rebeca su mujer; allí también sepulté yo á Lea», y sus hijos lo llevaron a Canaán y así lo hicieron."
    - "Sobre la cueva se alza un gran recinto rectangular de sillares con margen cincelado y pilastras, de unos 59 por 34 m, sin inscripción pero tan parecido a los muros del Monte del Templo de Herodes que se atribuye a Herodes el Grande. Josefo habla de los monumentos de los patriarcas, de fino mármol, en Hebrón, y el peregrino de Burdeos vio en 333 un monumento cuadrado de maravillosa belleza donde yacían los tres patriarcas y sus esposas. En el período bizantino se construyó una iglesia dentro del recinto; tras la conquista árabe el edificio pasó a ser la mezquita de Abraham, el Haram al-Khalil; los cruzados lo convirtieron de nuevo en iglesia en el siglo XII, cuando se dice que los canónigos entraron en la cueva y hallaron los huesos, y Saladino lo restauró como mezquita, con un púlpito hecho en Ascalón en 1091."
    - "Desde 1267, bajo el sultán mameluco Baybars, judíos y cristianos tuvieron prohibida la entrada al edificio y rezaban en un escalón exterior, hasta 1967, cuando Israel tomó Hebrón. La cueva misma, bajo el suelo, está cerrada; los seis cenotafios que hay sobre ella representan a Abraham, Sara, Isaac, Rebeca, Jacob y Lea, y junto a ellos se añadió un cenotafio de José. En 1994 un colono judío mató a tiros a veintinueve musulmanes que rezaban aquí, y desde entonces el edificio está dividido entre una mezquita y una sinagoga, cada parte abierta por completo a la otra unos pocos días al año. La UNESCO inscribió en 2017 la ciudad vieja de Hebrón con el santuario. El discurso de Esteban en Hechos, en cambio, habla de un sepulcro que Abraham compró en Siquem, donde Génesis hace que Jacob compre tierra y que Abraham compre en Hebrón."
  pt:
    - "Macpela é a caverna em Hebrom onde Abraão sepultou Sara, e o campo em que ficava. O nome, “dupla”, pode descrever uma caverna de duas câmaras; a Bíblia grega a chama de caverna dupla. Em Gênesis 23, Abraão, “estrangeiro e peregrino” entre os hititas de Hebrom, pede “a caverna de Macpela”, na extremidade do campo de Efrom, e compra o campo, a caverna e as árvores “em frente a Manre” por “quatrocentos siclos de prata, de acordo com o peso corrente entre os mercadores”, pesados à porta da cidade: a primeira parcela da terra prometida que sua família possuiu. Ali Isaque e Ismael o sepultaram; ali Jacó, morrendo no Egito, pediu para jazer com seus pais: “Lá sepultaram Abraão e Sara, sua mulher. Lá sepultaram Isaque e Rebeca, sua mulher, e lá eu sepultei Lia”, e seus filhos o levaram a Canaã e assim fizeram."
    - "Sobre a caverna ergue-se um grande recinto retangular de silhares emoldurados com pilastras, de cerca de 59 por 34 m, sem inscrição, mas tão semelhante às muralhas do Monte do Templo de Herodes que é atribuído a Herodes, o Grande. Josefo fala dos monumentos de mármore fino dos patriarcas em Hebrom, e o peregrino de Bordéus, em 333, viu um monumento quadrado de maravilhosa beleza onde jaziam os três patriarcas e suas mulheres. Uma igreja foi construída dentro do recinto no período bizantino; depois da conquista árabe o edifício tornou-se a mesquita de Abraão, o Haram al-Khalil; os cruzados fizeram dele de novo uma igreja no século XII, quando se diz que cônegos entraram na caverna e acharam os ossos, e Saladino o restaurou como mesquita, com um púlpito feito em Ascalão em 1091."
    - "A partir de 1267, sob o sultão mameluco Baybars, judeus e cristãos foram impedidos de entrar no edifício e oravam num degrau do lado de fora, até 1967, quando Israel tomou Hebrom. A própria caverna, sob o piso, está fechada; os seis cenotáfios acima dela representam Abraão, Sara, Isaque, Rebeca, Jacó e Lia, e um cenotáfio de José foi acrescentado ao lado. Em 1994 um colono judeu matou a tiros vinte e nove muçulmanos em oração aqui, e o edifício foi desde então dividido entre uma mesquita e uma sinagoga, cada lado aberto por inteiro ao outro em alguns dias do ano. A UNESCO inscreveu a cidade velha de Hebrom com o santuário em 2017. O discurso de Estêvão em Atos, por outro lado, fala de um túmulo que Abraão comprou em Siquém, onde Gênesis faz Jacó comprar terra e Abraão comprar em Hebrom."
  de:
    - "Machpela ist die Höhle bei Hebron, in der Abraham Sara begrub, und das Feld darum. Der Name, „doppelt“, meint vielleicht eine Höhle mit zwei Kammern; die griechische Bibel nennt sie die doppelte Höhle. In 1. Mose 23 sagt Abraham den Hethitern von Hebron: „Ich bin ein Fremder und Einwohner bei euch“, bittet um „seine zwiefache Höhle, die er hat am Ende seines Ackers“ und kauft Feld, Höhle und Bäume „Mamre gegenüber“ für „vierhundert Lot Silber, das im Kauf gang und gäbe war“, am Stadttor abgewogen: das erste Stück des verheißenen Landes in seinem Familienbesitz. Dort begruben ihn Isaak und Ismael; dort wollte Jakob, sterbend in Ägypten, bei den Vätern liegen: „Daselbst haben sie Abraham begraben und Sara, sein Weib. Daselbst haben sie auch Isaak begraben und Rebekka, sein Weib. Daselbst habe ich auch Lea begraben“; seine Söhne brachten ihn nach Kanaan und begruben ihn dort."
    - "Über der Höhle steht eine große rechteckige Umfassung aus Quadern mit Randschlag und Pilastern, etwa 59 mal 34 m, ohne Inschrift, aber den Mauern des herodianischen Tempelbergs so ähnlich, dass man sie Herodes dem Großen zuschreibt. Josephus spricht von Denkmälern der Patriarchen aus feinem Marmor in Hebron, und der Pilger von Bordeaux sah 333 ein quadratisches Denkmal von wunderbarer Schönheit, in dem die drei Patriarchen und ihre Frauen lagen. In byzantinischer Zeit wurde innerhalb der Umfassung eine Kirche gebaut; nach der arabischen Eroberung wurde das Gebäude zur Abraham-Moschee, dem Haram al-Khalil; die Kreuzfahrer machten es im 12. Jahrhundert wieder zur Kirche, wobei Chorherren in die Höhle eingedrungen sein und die Gebeine gefunden haben sollen, und Saladin stellte es als Moschee wieder her, mit einer 1091 in Aschkelon gefertigten Kanzel."
    - "Ab 1267, unter dem Mamelukensultan Baibars, war Juden und Christen der Zutritt zum Gebäude verwehrt, und sie beteten an einer Stufe draußen, bis Israel 1967 Hebron einnahm. Die Höhle selbst unter dem Boden ist verschlossen; die sechs Kenotaphe darüber stehen für Abraham, Sara, Isaak, Rebekka, Jakob und Lea, und ein Kenotaph Josefs wurde daneben hinzugefügt. 1994 erschoss hier ein jüdischer Siedler neunundzwanzig betende Muslime, und das Gebäude ist seither zwischen einer Moschee und einer Synagoge geteilt, wobei jede Seite an wenigen Tagen im Jahr der anderen ganz geöffnet wird. Die UNESCO nahm die Altstadt von Hebron mit dem Heiligtum 2017 in die Liste auf. Die Rede des Stephanus in der Apostelgeschichte spricht dagegen von einem Grab, das Abraham in Sichem kaufte, während die Genesis Jakob dort Land kaufen und Abraham in Hebron kaufen lässt."
  fr:
    - "Macpéla est la caverne d’Hébron où Abraham enterra Sara, et le champ où elle se trouvait. Le nom, « double », peut décrire une caverne à deux chambres ; la Bible grecque l’appelle la caverne double. Dans Genèse 23, Abraham, « étranger et habitant » parmi les Hittites d’Hébron, demande « la caverne de Macpéla », à l’extrémité du champ d’Éphron, et achète le champ, la caverne et les arbres « vis-à-vis de Mamré » pour « quatre cents sicles d’argent ayant cours chez le marchand », pesés à la porte de la ville : le premier morceau de la terre promise que sa famille posséda. Là l’enterrèrent Isaac et Ismaël ; là Jacob, mourant en Égypte, demanda à reposer avec ses pères : « Là on a enterré Abraham et Sara, sa femme ; là on a enterré Isaac et Rebecca, sa femme ; et là j’ai enterré Léa », et ses fils le transportèrent au pays de Canaan et firent ainsi."
    - "Au-dessus de la caverne se dresse une grande enceinte rectangulaire de blocs à marges ciselées et de pilastres, d’environ 59 sur 34 m, sans inscription mais si semblable aux murs de l’esplanade du Temple d’Hérode qu’on l’attribue à Hérode le Grand. Flavius Josèphe parle de monuments des patriarches en beau marbre à Hébron, et le pèlerin de Bordeaux vit en 333 un monument carré d’une beauté merveilleuse où reposaient les trois patriarches et leurs épouses. Une église fut bâtie à l’intérieur de l’enceinte à l’époque byzantine ; après la conquête arabe, l’édifice devint la mosquée d’Abraham, le Haram al-Khalil ; les croisés en refirent une église au XIIe siècle, époque où des chanoines auraient pénétré dans la caverne et trouvé les ossements, et Saladin la restaura en mosquée, avec une chaire faite à Ascalon en 1091."
    - "À partir de 1267, sous le sultan mamelouk Baybars, Juifs et chrétiens furent exclus de l’édifice et priaient sur une marche à l’extérieur, jusqu’en 1967, quand Israël prit Hébron. La caverne elle-même, sous le sol, est fermée ; les six cénotaphes au-dessus représentent Abraham, Sara, Isaac, Rebecca, Jacob et Léa, et un cénotaphe de Joseph a été ajouté à côté. En 1994, un colon juif y abattit vingt-neuf musulmans en prière, et l’édifice a depuis été divisé entre une mosquée et une synagogue, chaque côté s’ouvrant entièrement à l’autre quelques jours par an. L’UNESCO a inscrit en 2017 la vieille ville d’Hébron avec le sanctuaire. Le discours d’Étienne dans les Actes, en revanche, parle d’un tombeau qu’Abraham acheta à Sichem, là où la Genèse fait acheter à Jacob un terrain et à Abraham, à Hébron."
  it:
    - "Macpela è la grotta a Ebron in cui Abramo seppellì Sara, e il campo in cui si trovava. Il nome, «doppia», può descrivere una grotta di due camere; la Bibbia greca la chiama la caverna doppia. In Genesi 23 Abramo, «straniero e avventizio» tra gli Ittiti di Ebron, chiede «la sua spelonca di Macpela che è all’estremità del suo campo», e compra il campo, la grotta e gli alberi «dirimpetto a Mamre» per «quattrocento sicli d’argento, di buona moneta mercantile», pesati alla porta della città: il primo pezzo della terra promessa posseduto dalla sua famiglia. Là lo seppellirono Isacco e Ismaele; là Giacobbe, morendo in Egitto, chiese di giacere con i suoi padri: «Quivi furon sepolti Abrahamo e Sara sua moglie; quivi furon sepolti Isacco e Rebecca sua moglie, e quivi io seppellii Lea», e i suoi figli lo portarono in Canaan e lo fecero."
    - "Sopra la grotta sorge un grande recinto rettangolare di conci a bugnato con lesene, di circa 59 per 34 m, senza iscrizione ma così simile alle mura del Monte del Tempio di Erode da essere attribuito a Erode il Grande. Giuseppe Flavio parla di monumenti di marmo pregiato dei patriarchi a Ebron, e il pellegrino di Bordeaux nel 333 vide un monumento quadrato di mirabile bellezza dove giacevano i tre patriarchi e le loro mogli. In età bizantina fu costruita una chiesa all’interno del recinto; dopo la conquista araba l’edificio divenne la moschea di Abramo, l’Haram al-Khalil; i Crociati ne fecero di nuovo una chiesa nel XII secolo, quando si dice che dei canonici siano entrati nella grotta e vi abbiano trovato le ossa, e Saladino la restaurò come moschea, con un pulpito fatto ad Ascalona nel 1091."
    - "Dal 1267, sotto il sultano mamelucco Baibars, ebrei e cristiani furono esclusi dall’edificio e pregarono su un gradino all’esterno, fino al 1967, quando Israele prese Ebron. La grotta, sotto il pavimento, è chiusa; i sei cenotafi sopra di essa rappresentano Abramo, Sara, Isacco, Rebecca, Giacobbe e Lia, e accanto a essi fu aggiunto un cenotafio di Giuseppe. Nel 1994 un colono ebreo uccise a colpi d’arma da fuoco ventinove musulmani in preghiera qui, e da allora l’edificio è diviso tra una moschea e una sinagoga, ciascuna parte interamente aperta all’altra pochi giorni all’anno. L’UNESCO ha iscritto la città vecchia di Ebron con il santuario nel 2017. Il discorso di Stefano negli Atti, per contrasto, parla di una tomba che Abramo comprò a Sichem, mentre la Genesi fa comprare a Giacobbe un terreno e ad Abramo a Ebron."
  pl:
    - "Makpela to jaskinia w Hebronie, w której Abraham pochował Sarę, i pole, na którym leżała. Nazwa, „podwójna”, może opisywać jaskinię o dwóch komorach; grecka Biblia nazywa ją jaskinią podwójną. W Rdz 23 Abraham, „Gościem i przychodniem jestem u was”, wśród Hetytów z Hebronu, prosi Efrona, by „ustąpił jaskini swojej Machpela”, na końcu jego pola, i kupuje pole, jaskinię i drzewa „przeciwko Mamre” za „cztery sta syklów srebra, tak jako szły między kupcami”, odważone w bramie miasta: pierwszy kawałek ziemi obiecanej, którym władała jego rodzina. Tam pochowali go Izaak i Izmael; tam Jakub, umierając w Egipcie, prosił o pochowanie z ojcami: „Tam pogrzebiono Abrahama, i Sarę, żonę jego; tam pogrzebiono Izaaka, i Rebekę żonę jego; tamem też pogrzebał Liję”, a jego synowie zanieśli go do Kanaanu i tak uczynili."
    - "Nad jaskinią stoi wielkie prostokątne ogrodzenie z ciosanych bloków z pilastrami, o wymiarach około 59 na 34 m, bez inskrypcji, ale tak podobne do murów Wzgórza Świątynnego Heroda, że przypisuje się je Herodowi Wielkiemu. Józef Flawiusz mówi o pomnikach patriarchów z pięknego marmuru w Hebronie, a pielgrzym z Bordeaux w 333 r. widział kwadratowy pomnik o cudownej piękności, gdzie spoczywali trzej patriarchowie i ich żony. W okresie bizantyjskim wewnątrz ogrodzenia zbudowano kościół; po arabskim podboju budynek stał się meczetem Abrahama, Haram al-Chalil; krzyżowcy zamienili go znów w kościół w XII w., gdy kanonicy mieli wejść do jaskini i znaleźć kości, a Saladyn przywrócił go jako meczet, z minbarem wykonanym w Aszkelonie w 1091 r."
    - "Od 1267 r., za mameluckiego sułtana Bajbarsa, Żydom i chrześcijanom zakazano wstępu do budynku i modlili się na stopniu na zewnątrz, aż do 1967 r., gdy Izrael zajął Hebron. Sama jaskinia, pod posadzką, jest zamknięta; sześć kenotafów nad nią oznacza Abrahama, Sarę, Izaaka, Rebekę, Jakuba i Leę, a obok dodano kenotaf Józefa. W 1994 r. żydowski osadnik zastrzelił tu dwudziestu dziewięciu modlących się muzułmanów, a budynek podzielono od tamtej pory między meczet i synagogę, z których każda jest w kilka dni w roku w całości otwierana dla drugiej strony. UNESCO wpisało stare miasto Hebron wraz z sanktuarium na listę w 2017 r. Mowa Szczepana w Dziejach natomiast mówi o grobie, który Abraham kupił w Sychem, gdzie Księga Rodzaju każe Jakubowi kupić ziemię, a Abrahamowi kupować w Hebronie."
  nl:
    - "Machpela is de grot bij Hebron waarin Abraham Sara begroef, en de akker waarin zij lag. De naam, “dubbel”, kan een grot met twee kamers beschrijven; de Griekse Bijbel noemt haar de dubbele grot. In Genesis 23 vraagt Abraham, “een vreemdeling en inwoner” onder de Hettieten van Hebron, om “de spelonk van Machpela”, aan het eind van Efrons akker, en koopt de akker, de grot en de bomen “tegenover Mamre” voor “vierhonderd sikkelen zilvers, onder den koopman gangbaar”, afgewogen bij de stadspoort: het eerste stuk van het beloofde land dat zijn familie bezat. Daar begroeven Isaak en Ismaël hem; daar vroeg Jakob, stervend in Egypte, bij zijn vaderen te mogen liggen, “Aldaar hebben zij Abraham begraven, en Sara, zijn huisvrouw; daar hebben zij Izak begraven, en Rebekka, zijn huisvrouw; en daar heb ik Lea begraven”, en zijn zonen brachten hem naar Kanaän en deden dat."
    - "Boven de grot staat een grote rechthoekige omheining van bewerkte blokken met pilasters, ongeveer 59 bij 34 m, zonder inscriptie maar zo gelijkend op de muren van Herodes' Tempelberg dat ze aan Herodes de Grote wordt toegeschreven. Josephus spreekt van de gedenktekens van de aartsvaders van prachtig marmer in Hebron, en de pelgrim van Bordeaux zag in 333 een vierkant monument van wonderbaarlijke schoonheid waar de drie aartsvaders en hun vrouwen lagen. In de Byzantijnse tijd werd binnen de omheining een kerk gebouwd; na de Arabische verovering werd het gebouw de moskee van Abraham, de Haram al-Khalil; de kruisvaarders maakten er in de twaalfde eeuw weer een kerk van, toen kanunniken de grot zouden zijn binnengegaan en de beenderen zouden hebben gevonden, en Saladin herstelde haar als moskee, met een kansel die in 1091 in Ascalon was gemaakt."
    - "Vanaf 1267, onder de mamelukse sultan Baibars, werden joden en christenen de toegang tot het gebouw ontzegd en baden zij bij een trede buiten, tot 1967, toen Israël Hebron innam. De grot zelf, onder de vloer, is gesloten; de zes cenotafen erboven staan voor Abraham, Sara, Isaak, Rebekka, Jakob en Lea, en een cenotaaf van Jozef werd naast hen toegevoegd. In 1994 schoot een joodse kolonist hier negenentwintig moslims dood tijdens het gebed, en het gebouw is sindsdien verdeeld tussen een moskee en een synagoge, waarbij elke zijde op enkele dagen per jaar geheel voor de ander wordt opengesteld. UNESCO plaatste de oude stad van Hebron met het heiligdom in 2017 op de werelderfgoedlijst. De rede van Stefanus in Handelingen spreekt daarentegen van een graf dat Abraham bij Sichem kocht, waar Genesis Jakob land laat kopen en Abraham bij Hebron."
  cs:
    - "Makpela je jeskyně v Hebronu, v níž Abraham pochoval Sáru, a pole, na kterém ležela. Jméno, „dvojitá“, může popisovat jeskyni o dvou komorách; řecká Bible ji nazývá dvojitou jeskyní. Ve Genesis 23 Abraham, který mezi Chetity z Hebronu pravil: „Hostem a příchozím jsem u vás“, žádá o „jeskyni Machpelah“ na konci Efrónova pole a kupuje pole, jeskyni i stromoví „proti Mamre“ za „čtyři sta lotů stříbrných, běžných mezi kupci“, odvážených v městské bráně: první kus zaslíbené země, který jeho rodina vlastnila. Tam ho pochovali Izák a Jišmael; tam chtěl ležet s otci Jákob, umíraje v Egyptě: „Tam pochovali Abrahama a Sáru ženu jeho; tam pochovali Izáka a Rebeku ženu jeho; tam také pochovali Líu“, a jeho synové ho přenesli do Kanaánu a učinili tak."
    - "Nad jeskyní stojí velký obdélníkový areál z tesaných kvádrů s pilastry, asi 59 × 34 m, bez nápisu, ale tak podobný zdem Herodovy Chrámové hory, že se připisuje Herodovi Velikému. Josephus mluví o památkách patriarchů z jemného mramoru v Hebronu a putník z Bordeaux roku 333 viděl čtvercovou památku podivuhodné krásy, kde leželi tři patriarchové a jejich ženy. V byzantské době byl uvnitř areálu postaven kostel; po arabském dobytí se budova stala mešitou Abrahamovou, Haram al-Chalíl; křižáci z ní ve 12. století znovu učinili kostel, kdy prý kanovníci vstoupili do jeskyně a našli kosti, a Saladin ji obnovil jako mešitu s kazatelnou zhotovenou v Aškelonu roku 1091."
    - "Od roku 1267, za mamlúckého sultána Bajbarse, byli Židé a křesťané z budovy vyloučeni a modlili se na schodu před ní, až do roku 1967, kdy Izrael obsadil Hebron. Samotná jeskyně pod podlahou je uzavřena; šest kenotafů nad ní představuje Abrahama, Sáru, Izáka, Rebeku, Jákoba a Líu a vedle nich byl přidán kenotaf Josefův. V roce 1994 zde židovský osadník zastřelil dvacet devět muslimů při modlitbě a budova je od té doby rozdělena mezi mešitu a synagogu, z nichž každá se několik dní v roce zcela otevírá druhé straně. UNESCO zapsalo starý Hebron se svatyní roku 2017. Štěpánova řeč ve Skutcích naproti tomu mluví o hrobě, který Abraham koupil v Šekemu, kde Genesis má Jákoba kupujícího pozemek a Abrahama kupujícího v Hebronu."
  sv:
    - "Makpela är grottan i Hebron där Abraham begrov Sara, och åkern där den låg. Namnet, ”dubbel”, kan beskriva en grotta med två kamrar; den grekiska Bibeln kallar den den dubbla grottan. I Första Mosebok 23 ber Abraham, ”en främling och gäst” bland hetiterna i Hebron, om ”grottan i Makpela”, vid ändan av Efrons åker, och köper åkern, grottan och träden ”gent emot Mamre” för ”fyra hundra siklar silver, sådant silver som var gångbart i handel”, avvägda i stadsporten: den första bit av det utlovade landet som hans släkt ägde. Där begrov Isak och Ismael honom; dit bad Jakob, döende i Egypten, att få vila hos sina fäder: ”där de hava begravit Abraham och hans hustru Sara, där de ock hava begravit Isak och hans hustru Rebecka, och där jag själv har begravit Lea”, och hans söner förde honom upp till Kanaan och gjorde så."
    - "Över grottan står en stor rektangulär inhägnad av ramhuggna kvaderstenar med pilastrar, omkring 59 gånger 34 m, utan inskrift men så lik murarna kring Herodes' Tempelberg att den tillskrivs Herodes den store. Josefus talar om patriarkernas monument av fin marmor i Hebron, och pilgrimen från Bordeaux såg år 333 ett fyrkantigt monument av underbar skönhet där de tre patriarkerna och deras hustrur låg. En kyrka byggdes innanför inhägnaden under bysantinsk tid; efter den arabiska erövringen blev byggnaden Abrahams moské, Haram al-Khalil; korsfararna gjorde den till kyrka igen på 1100-talet, då kanikerna sägs ha gått in i grottan och funnit benen, och Saladin återställde den som moské, med en predikstol gjord i Ashkelon 1091."
    - "Från 1267, under mamlukernas sultan Baybars, var judar och kristna utestängda från byggnaden och bad vid ett trappsteg utanför, till 1967, då Israel intog Hebron. Själva grottan, under golvet, är stängd; de sex kenotaferna ovanför den står för Abraham, Sara, Isak, Rebecka, Jakob och Lea, och en kenotaf för Josef lades till bredvid dem. År 1994 sköt en judisk nybyggare ihjäl tjugonio muslimer vid bön här, och byggnaden har sedan dess delats mellan en moské och en synagoga, där vardera sidan öppnas helt för den andra några dagar om året. Unesco skrev in Hebrons gamla stad med helgedomen på världsarvslistan 2017. Stefanos' tal i Apostlagärningarna talar däremot om en grav som Abraham köpte i Shekem, där Första Moseboken låter Jakob köpa mark och Abraham köpa i Hebron."
  nb:
    - "Makpela er hulen i Hebron der Abraham begravde Sara, og marken den lå på. Navnet, «dobbelt», kan beskrive en hule med to kamre; den greske Bibelen kaller den den doble hulen. I Første Mosebok 23 ber Abraham, «en fremmed og utlending» blant hettittene i Hebron, om «Makpela-hulen», i utkanten av Efrons mark, og kjøper marken, hulen og trærne «østenfor Mamre» for «fire hundre sekel sølv, slike som var gangbare i handel», veid opp i byporten: det første stykket av det lovte landet hans slekt eide. Der begravde Isak og Ismael ham; der ba Jakob, døende i Egypt, om å få ligge hos sine fedre: «Der begravde de Abraham og Sara, hans hustru, der begravde de Isak og Rebekka, hans hustru, og der begravde jeg Lea», og hans sønner førte ham opp til Kanaan og gjorde det."
    - "Over hulen står en stor rektangulær innhegning av tilhugde kvadersteiner med pilastre, omkring 59 ganger 34 m, uten innskrift, men så lik murene i Herodes' tempelhøyde at den tilskrives Herodes den store. Josefus taler om patriarkenes monumenter av fin marmor i Hebron, og pilegrimen fra Bordeaux så i 333 et firkantet monument av underfull skjønnhet der de tre patriarkene og deres hustruer lå. En kirke ble bygget inne i innhegningen i bysantinsk tid; etter den arabiske erobringen ble bygningen Abrahams moské, Haram al-Khalil; korsfarerne gjorde den til kirke igjen på 1100-tallet, da kanniker skal ha gått inn i hulen og funnet beinene, og Saladin gjenopprettet den som moské, med en prekestol laget i Askalon i 1091."
    - "Fra 1267, under mamelukksultanen Baybars, var jøder og kristne utestengt fra bygningen og ba på et trinn utenfor, til 1967, da Israel tok Hebron. Selve hulen, under gulvet, er stengt; de seks kenotafene over den står for Abraham, Sara, Isak, Rebekka, Jakob og Lea, og en kenotaf for Josef ble lagt til ved siden av. I 1994 skjøt en jødisk bosetter ned tjueni muslimer under bønn her, og bygningen har siden vært delt mellom en moské og en synagoge, hver side åpnet helt for den andre noen få dager i året. UNESCO oppførte Hebrons gamleby med helligdommen på verdensarvlisten i 2017. Stefanus' tale i Apostlenes gjerninger taler derimot om en grav som Abraham kjøpte i Sikem, der Første Mosebok lar Jakob kjøpe mark og Abraham kjøpe i Hebron."
  tl:
    - "Ang Macpela ay yungib sa Hebron na pinaglibingan ni Abraham kay Sara, at ang parang nito. Maaaring tumukoy sa yungib na may dalawang silid ang pangalang “dalawahan”; dalawahang yungib ang tawag ng Biblia sa Griyego. Sa Genesis 23, si Abraham, “tagaibang bayan at nakikipamayan sa inyo” sa mga Hetheo ng Hebron, humingi ng “yungib ng Macpela” sa dulo ng parang ni Ephron at binili ang parang, yungib at mga puno “sa tapat ng Mamre” sa halagang “apat na raang siklong pilak, na karaniwang salapi ng mga mangangalakal”, tinimbang sa pintuang-bayan: unang pag-aari ng pamilya sa ipinangakong lupa. Inilibing siya roon nina Isaac at Ismael; hiniling ng naghihingalong Jacob sa Egipto na mahimlay sa piling ng mga ama, “Doon nila inilibing si Abraham at si Sara na kaniyang asawa; … si Isaac at si Rebeca na kaniyang asawa; at doon ko inilibing si Lea”, at dinala siya ng mga anak sa Canaan at ginawa iyon."
    - "Sa ibabaw ng yungib ay may malaking parihabang bakod ng mga batong hinasa na may mga pilaster, mga 59 sa 34 m, na walang inskripsiyon ngunit kahawig ng mga pader ng Bundok ng Templo ni Herodes kaya iniuugnay kay Herodes na Dakila. Binabanggit ni Josefo ang mga bantayog ng mga patriyarka sa pinong marmol sa Hebron, at nakita ng peregrino ng Bordeaux noong 333 isang parisukat na bantayog na kahanga-hanga ang ganda kung saan nakahimlay ang tatlong patriyarka at mga asawa nila. Nagtayo ng simbahan sa loob ng bakod noong panahong Bizantino; pagkasakop ng mga Arabe ay naging moske ni Abraham ang gusali, ang Haram al-Khalil; ginawa itong simbahang muli ng mga Krusado noong ika-12 siglo, nang sinasabing pumasok ang mga kanon sa yungib at natagpuan ang mga buto, at ibinalik ito ni Saladin bilang moske, na may pulpitong gawa sa Ascalon noong 1091."
    - "Mula 1267, sa ilalim ng sultang Mameluko na si Baybars, ipinagbawal sa mga Judio at Kristiyano ang gusali at nanalangin sila sa isang baytang sa labas, hanggang 1967, nang sakupin ng Israel ang Hebron. Sarado ang yungib mismo sa ilalim ng sahig; ang anim na kenotapyo sa itaas ay para kina Abraham, Sara, Isaac, Rebeca, Jacob at Lea, at idinagdag sa tabi nila ang kenotapyo ni Jose. Noong 1994, binaril ng isang Judiong taga-pamayanang Israeli ang dalawampu't siyam na Muslim na nagdarasal dito; mula noon ay hati ang gusali sa moske at sinagoga, na bawat panig ay lubos na binubuksan sa isa pa sa ilang araw bawat taon. Noong 2017, isinama ng UNESCO ang lumang bayan ng Hebron at ang santuwaryo. Sa kabilang dako, binabanggit ng talumpati ni Esteban sa Mga Gawa ang libingang binili ni Abraham sa Sichem, samantalang sa Genesis ay bumili roon ng lupa si Jacob at sa Hebron si Abraham."
  da:
    - "Makpela er hulen ved Hebron, hvor Abraham begravede Sara, og marken, hvor den lå. Navnet, »dobbelt«, kan beskrive en hule med to kamre; den græske bibel kalder den den dobbelte hule. I Første Mosebog 23 siger Abraham, der er »en fremmed og Gæst hos eder« blandt hittitterne i Hebron, at han ønsker »Hulen Makpela« ved enden af Efrons ager, og køber marken, hulen og træerne »tværs over for Mamre« for »fire Hundrede Sekel Sølv, gængse i Køb«, vejet af ved byens port: det første stykke af det forjættede land, hans slægt ejede. Dér begravede Isak og Ismael ham; dér bad Jakob, døende i Egypten, om at ligge hos sine fædre: »Der have de begravet Abraham og Sara, hans Hustru; der have de begravet Isak og Rebekka, hans Hustru; og der har jeg begravet Lea«, og hans sønner bar ham op til Kana'an og gjorde det."
    - "Over hulen står en stor rektangulær indhegning af tilhuggede kvadre med pilastre, omkring 59 gange 34 m, uden indskrift, men så lig murene på Herodes' Tempelbjerg, at den tilskrives Herodes den Store. Josefus taler om patriarkernes monumenter af fin marmor i Hebron, og pilgrimmen fra Bordeaux så i 333 et firkantet monument af vidunderlig skønhed, hvor de tre patriarker og deres hustruer lå. En kirke blev bygget inde i indhegningen i den byzantinske tid; efter den arabiske erobring blev bygningen til Abrahams moské, Haram al-Khalil; korsfarerne gjorde den til kirke igen i 1100-tallet, da kanniker siges at være gået ind i hulen og have fundet knoglerne, og Saladin genindrettede den som moské, med en prædikestol lavet i Ascalon i 1091."
    - "Fra 1267, under mamelukkernes sultan Baybars, var jøder og kristne udelukket fra bygningen og bad ved en trappe udenfor, indtil 1967, da Israel indtog Hebron. Selve hulen, under gulvet, er lukket; de seks kenotafer ovenover står for Abraham, Sara, Isak, Rebekka, Jakob og Lea, og et kenotaf for Josef blev føjet til ved siden af. I 1994 skød en jødisk bosætter niogtyve muslimer ihjel under bøn her, og bygningen er siden delt mellem en moské og en synagoge, hvor hver side åbnes helt for den anden nogle få dage om året. UNESCO optog Hebrons gamle by med helligdommen i 2017. Stefanus' tale i Apostlenes Gerninger taler derimod om en grav, som Abraham købte i Sikem, hvor Første Mosebog lader Jakob købe jord og Abraham købe i Hebron."
  sr:
    - "Макпела је пећина у Хеврону у којој је Аврам сахранио Сару, и њива на којој је лежала. Име, „двострука“, може описивати пећину са две одаје; грчка Библија је зове двоструком пећином. У Постању 23 Аврам, који Хетитима у Хеврону каже „Странац сам и дошљак код вас“, тражи „пећину у Макпели, која је накрај њиве његове“, и купује њиву, пећину и дрвеће „према Мамрији“ за „четири стотине сикала сребра, како су ишли међу трговцима“, одмерених на градској капији: први комад обећане земље који је његова породица поседовала. Ту су га сахранили Исак и Исмаило; ту је Јаков, умирући у Египту, тражио да лежи с оцима: „Онде погребе Аврама и Сару жену његову, онде погребоше Исака и Ревеку жену његову, и онде погребох Лију“, а његови синови су га однели у Ханан и тако учинили."
    - "Над пећином стоји велика правоугаона ограда од тесаника с пиластрима, око 59 са 34 м, без натписа али толико налик зидовима Иродове Храмовне горе да се приписује Ироду Великом. Јосиф Флавије говори о споменицима патријараха од финог мермера у Хеврону, а путник из Бордоа 333. видео је четвороугаони споменик дивне лепоте где леже три патријарха и њихове жене. У ограду је у византијском раздобљу саграђена црква; после арапског освајања зграда је постала Аврамова џамија, Харам ел-Халил; крсташи су је у XII веку поново начинили црквом, када су каноници, како се каже, ушли у пећину и нашли кости, а Саладин ју је обновио као џамију, са минбаром направљеним у Ашкелону 1091."
    - "Од 1267, под мамелучким султаном Бајбарсом, Јевреји и хришћани били су искључени из зграде и молили су се на степеници напољу, све до 1967, када је Израел заузео Хеврон. Сама пећина, испод пода, затворена је; шест кенотафа изнад ње представљају Аврама, Сару, Исака, Ревеку, Јакова и Лију, а поред њих је додат Јосифов кенотаф. Године 1994. јеврејски насељеник је овде убио двадесет девет муслимана на молитви, и зграда је од тада подељена између џамије и синагоге, свака страна потпуно отворена другој неколико дана годишње. УНЕСКО је 2017. уписао стари град Хеврон са светилиштем. Стефанов говор у Делима, насупрот томе, говори о гробу који је Аврам купио у Сихему, где Постање има да Јаков купује земљу, а Аврам купује у Хеврону."
  hu:
    - "Makpéla a hebroni barlang, amelybe Ábrahám Sárát eltemette, és a mező, amelyben állt. A név, „kettős”, kétkamrás barlangra utalhat; a görög Biblia kettős barlangnak nevezi. A Teremtés könyve 23. fejezetében Ábrahám, aki így szól Hebron hettitáihoz: „Idegen és jövevény vagyok közöttetek”, kéri „Makpelá barlangját, mely az övé, mely az ő mezejének szélében van”, és megveszi a mezőt, a barlangot és a fákat „Mamré átellenében”; az árat, „kalmároknál kelendő négyszáz ezüst siklust”, a város kapujában mérték ki: családja első birtoka az ígéret földjén. Ott temette el őt Izsák és Izmael; ott akart Jákób is, Egyiptomban haldokolva, atyáival feküdni: „Oda temették el Ábrahámot és Sárát az ő feleségét; oda temették Izsákot és Rebekát az ő feleségét; s oda temettem el Leát is”, és fiai felvitték Kánaánba, és így tettek."
    - "A barlang fölött nagy, téglalap alakú, pilaszteres, simított kváderkövekből épült kerítőfal áll, mintegy 59×34 m, felirat nélkül, de annyira hasonlít a Heródes-féle Templomhegy falaira, hogy Nagy Heródesnek tulajdonítják. Josephus említi a pátriárkák finom márványból készült emlékműveit Hebronban, a Kr. u. 333-as bordeaux-i zarándok pedig csodálatos szépségű négyszögletes emlékművet látott, ahol a három pátriárka és feleségeik feküdtek. A kerítésen belül a bizánci korban templomot építettek; az arab hódítás után az épület Ábrahám mecsete, a Haram al-Khalil lett; a keresztesek a 12. században ismét templommá tették, amikor a kanonokok állítólag bementek a barlangba, és megtalálták a csontokat, Szaladin pedig mecsetként állította helyre, az 1091-ben Askalónban készült szószékkel."
    - "1267-től, Bajbarsz mameluk szultán idejétől a zsidókat és keresztényeket kizárták az épületből, és a kinti lépcsőnél imádkoztak, 1967-ig, amikor Izrael elfoglalta Hebront. Maga a barlang a padló alatt zárva van; a fölötte álló hat kenotáfium Ábrahámot, Sárát, Izsákot, Rebekát, Jákóbot és Leát jelképezi, melléjük József kenotáfiumát is felvették. 1994-ben egy zsidó telepes itt huszonkilenc imádkozó muszlimot lőtt agyon, az épületet azóta mecset és zsinagóga között osztották meg, mindkét oldal évente néhány napra teljesen megnyílik a másik előtt. Az UNESCO 2017-ben a szentéllyel együtt felvette a világörökségi listára Hebron óvárosát. István beszéde az Apostolok cselekedeteiben ezzel szemben olyan sírról beszél, amelyet Ábrahám Sikemben vett, ahol a Teremtés könyve szerint Jákób vett földet, Ábrahám pedig Hebronban."
  fi:
    - "Makpela on Hebronissa sijaitseva luola, johon Abraham hautasi Saaran, ja pelto, jolla se sijaitsi. Nimi, ”kaksinkertainen”, voi kuvata kaksikammioista luolaa; kreikkalainen Raamattu kutsuu sitä kaksoisluolaksi. 1. Moos. 23:ssa Abraham, ”muukalainen ja vieras” Hebronin heettiläisten keskuudessa, pyytää ”Makpelan luolaa”, Efronin pellon perällä, ja ostaa pellon, luolan ja puut ”itään päin Mamresta” hinnalla ”neljäsataa hopeasekeliä, kaupassa käypää”, punnittuna kaupungin portilla: ensimmäinen luvatun maan osa, jonka hänen sukunsa omisti. Siihen Iisak ja Ismael hautasivat hänet; siihen Jaakob, kuollessaan Egyptissä, pyysi päästä isiensä viereen: ”Siihen on haudattu Aabraham ja hänen vaimonsa Saara, siihen on haudattu Iisak ja hänen vaimonsa Rebekka, ja siihen minäkin hautasin Leean”, ja hänen poikansa veivät hänet Kanaaniin ja tekivät niin."
    - "Luolan päällä on suuri suorakulmainen aitaus reunalyödyistä kvaaderikivistä ja pilastereista, noin 59 × 34 m, ilman kirjoitusta mutta niin Herodeksen Temppelivuoren muurien kaltainen, että se katsotaan Herodes Suuren työksi. Josephus puhuu patriarkkojen hienosta marmorisesta muistomerkistä Hebronissa, ja Bordeaux'n pyhiinvaeltaja näki vuonna 333 neliskulmaisen, ihmeellisen kauniin muistomerkin, jossa kolme patriarkkaa vaimoineen lepäsi. Aitauksen sisään rakennettiin kirkko bysanttilaisella kaudella; arabivalloituksen jälkeen rakennuksesta tuli Abrahamin moskeija, Haram al-Khalil; ristiretkeläiset tekivät siitä jälleen kirkon 1100-luvulla, jolloin kaniikkien kerrotaan menneen luolaan ja löytäneen luut, ja Saladin palautti sen moskeijaksi, sisustaen sen Askelonissa vuonna 1091 tehdyllä saarnatuolilla."
    - "Vuodesta 1267, mamelukkisulttaani Baybarsin aikana, juutalaisilta ja kristityiltä kiellettiin pääsy rakennukseen, ja he rukoilivat ulkopuolella portaalla vuoteen 1967, jolloin Israel valtasi Hebronin. Itse luola lattian alla on suljettu; sen yläpuolella olevat kuusi kenotafia edustavat Abrahamia, Saaraa, Iisakia, Rebekkaa, Jaakobia ja Leaa, ja niiden viereen lisättiin Joosefin kenotafi. Vuonna 1994 juutalainen uudisasukas ampui täällä kuoliaaksi kaksikymmentäyhdeksän rukoilevaa muslimia, ja rakennus on sittemmin jaettu moskeijaksi ja synagogaksi, ja kumpikin puoli avataan kokonaan toiselle muutamana päivänä vuodessa. UNESCO merkitsi Hebronin vanhan kaupungin pyhäkköineen maailmanperintöluetteloon vuonna 2017. Stefanoksen puhe Apostolien teoissa sen sijaan puhuu haudasta, jonka Abraham osti Sikemissä, vaikka Genesiksessä Jaakob ostaa maata ja Abraham ostaa Hebronissa."
  vi:
    - "Mặc-bê-la là hang ở Hếp-rôn nơi Áp-ra-ham chôn Sa-ra, và là thửa ruộng chứa nó. Tên, nghĩa là “đôi”, có thể mô tả một hang hai buồng; bản Kinh Thánh Hy Lạp gọi là hang đôi. Trong Sáng thế ký 23, Áp-ra-ham, “một khách kiều ngụ” giữa người Hittite ở Hếp-rôn, xin “hang đá Mặc-bê-la” ở đầu cùng ruộng của Ép-rôn, và mua thửa ruộng, hang và cây cối “nằm ngang Mam-rê” với giá “bốn trăm siếc-lơ bạc cho người, là bạc thông dụng nơi các tay buôn bán”, cân ngay cửa thành: phần đất đầu tiên của xứ hứa mà gia đình ông sở hữu. Y-sác và Ích-ma-ên chôn ông ở đó; Gia-cốp, sắp chết ở Ai Cập, xin nằm với tổ phụ: “nơi đó, người ta đã chôn Áp-ra-ham và Sa-ra, vợ người; Y-sác và Rê-be-ca, vợ người; mà lại nơi đó cha cũng đã chôn Lê-a nữa”, và các con đem ông về Ca-na-an và làm như vậy."
    - "Trên hang có một khu vây rào chữ nhật lớn bằng đá xẻ có viền và cột ốp, khoảng 59 x 34 m, không có bản khắc nhưng giống tường Núi Đền Thờ của Hê-rốt đến mức được gán cho Hê-rốt Đại đế. Josephus nói về các đài tưởng niệm bằng đá cẩm thạch đẹp của các tổ phụ ở Hếp-rôn, và người hành hương Bordeaux năm 333 thấy một đài vuông tuyệt đẹp nơi ba tổ phụ và các bà vợ nằm. Một nhà thờ được xây trong khu vây thời Byzantine; sau cuộc chinh phục Ả Rập, tòa nhà thành đền Hồi giáo Áp-ra-ham, Haram al-Khalil; quân Thập tự chinh biến lại thành nhà thờ thế kỷ 12, khi, theo lời kể, các tu sĩ kinh sĩ đã vào hang và thấy hài cốt, và Saladin phục hồi thành đền Hồi giáo, với một bục giảng làm ở Ascalon năm 1091."
    - "Từ năm 1267, dưới Mamluk sultan Baybars, người Do Thái và Cơ Đốc bị cấm vào tòa nhà và cầu nguyện ở một bậc thềm bên ngoài, cho đến năm 1967, khi Israel chiếm Hếp-rôn. Chính cái hang, dưới sàn, bị đóng; sáu đài tưởng niệm phía trên đại diện cho Áp-ra-ham, Sa-ra, Y-sác, Rê-be-ca, Gia-cốp và Lê-a, và một đài của Giô-sép được thêm vào cạnh. Năm 1994, một người định cư Do Thái bắn chết hai mươi chín tín đồ Hồi giáo đang cầu nguyện ở đây, và tòa nhà từ đó chia giữa một đền Hồi giáo và một nhà hội, mỗi bên mở hoàn toàn cho bên kia vài ngày mỗi năm. UNESCO ghi danh khu phố cổ Hếp-rôn cùng đền thánh năm 2017. Ngược lại, bài giảng của Ê-tiên trong sách Công vụ nói về một ngôi mộ Áp-ra-ham mua ở Si-chem, nơi Sáng thế ký chép Gia-cốp mua đất và Áp-ra-ham mua ở Hếp-rôn."
  ro:
    - "Macpela este peștera din Hebron în care Avraam a îngropat-o pe Sara, și câmpul în care se afla. Numele, „dublă”, poate descrie o peșteră cu două încăperi; Biblia greacă o numește peștera dublă. În Facerea 23, Avraam, care le spune hitiților din Hebron: „Strein și nemernic sunt eu la voi”, cere „peștera țarinei cea îndoită”, de la capătul câmpului lui Efron, și cumpără câmpul, peștera și copacii „împreajma Mamvrei” cu „patru sute de drahme de argint ales la neguțători”, cântărite la poarta cetății: prima bucată din țara făgăduită pe care a stăpânit-o familia lui. Acolo l-au îngropat Isaac și Ismael; acolo, murind în Egipt, Iacov a cerut să fie așezat cu părinții lui: „Acolo au îngropat pe Avraam și pe Sarra femeia lui, acolo au îngropat pe Isaac și pe Reveca femeia lui, acolo au îngropat pre Lia”, iar fiii lui l-au dus în Canaan și au făcut așa."
    - "Peste peșteră se înalță o mare incintă dreptunghiulară de blocuri fățuite cu pilaștri, de circa 59 pe 34 m, fără inscripție, dar atât de asemănătoare cu zidurile Muntelui Templului al lui Irod încât se atribuie lui Irod cel Mare. Iosif Flaviu vorbește despre monumentele patriarhilor din marmură fină de la Hebron, iar pelerinul din Bordeaux a văzut în 333 un monument pătrat de o frumusețe minunată unde se odihneau cei trei patriarhi și soțiile lor. În perioada bizantină s-a ridicat o biserică în interiorul incintei; după cucerirea arabă clădirea a devenit moscheea lui Avraam, Haram al-Khalil; cruciații au făcut-o din nou biserică în secolul al XII-lea, când canonicii ar fi intrat în peșteră și ar fi găsit oasele, iar Saladin a restaurat-o ca moschee, cu un amvon făcut la Ascalon în 1091."
    - "Din 1267, sub sultanul mameluc Baybars, evreii și creștinii au fost opriți să intre în clădire și s-au rugat la o treaptă de afară, până în 1967, când Israelul a luat Hebronul. Peștera însăși, de sub podea, este închisă; cele șase cenotafe de deasupra îi reprezintă pe Avraam, Sara, Isaac, Rebeca, Iacov și Lea, iar alături a fost adăugat un cenotaf al lui Iosif. În 1994, un colonist evreu a împușcat aici douăzeci și nouă de musulmani aflați la rugăciune, iar clădirea a fost de atunci împărțită între o moschee și o sinagogă, fiecare parte fiind deschisă în întregime celeilalte în câteva zile pe an. UNESCO a înscris orașul vechi al Hebronului cu sanctuarul în 2017. Cuvântarea lui Ștefan din Faptele Apostolilor, în schimb, vorbește despre un mormânt pe care Avraam l-ar fi cumpărat la Sihem, acolo unde Facerea spune că Iacov a cumpărat pământ, iar Avraam la Hebron."
  bg:
    - "Махпела е пещерата в Хеврон, в която Авраам погреба Сара, и нивата, в която тя се намирала. Името, „двойна“, може да описва пещера с две камери; гръцката Библия я нарича двойната пещера. В Битие 23 Авраам, „чужденец и пришлец“ сред хетейците в Хеврон, моли Ефрон „да ми даде пещерата си Махпелах, в края на нивата си“ и купува нивата, пещерата и дърветата „пред Мамврий“ за „четиристотин сикли сребърни каквито минуваха между търговци“, претеглени при градската порта: първото парче от обетованата земя, което семейството му притежавало. Там го погребаха Исаак и Исмаил; там Яков, умирайки в Египет, поиска да лежи с бащите си: „Там погребоха Авраама и Сарра жена му: там погребоха Исаака и Ревека жена му: и там погребох аз Лия“, а синовете му го пренесоха в Ханаан и направиха така."
    - "Над пещерата стои голяма правоъгълна ограда от дялани блокове с пиластри, около 59 на 34 м, без надпис, но толкова сходна със стените на Храмовия хълм на Ирод, че се приписва на Ирод Велики. Йосиф Флавий говори за паметниците на патриарсите от хубав мрамор в Хеврон, а поклонникът от Бордо през 333 г. видял квадратен паметник с чудна красота, където лежали тримата патриарси и жените им. През византийския период вътре в оградата била построена църква; след арабското завоевание сградата станала джамията на Авраам, Харам ал-Халил; кръстоносците отново я превърнали в църква през XII в., когато каноници според разказите влезли в пещерата и намерили костите, а Саладин я възстановил като джамия, с амвон, изработен в Аскалон през 1091 г."
    - "От 1267 г., при мамлюкския султан Байбарс, на юдеите и християните е забранено да влизат в сградата и те се молят на едно стъпало отвън — до 1967 г., когато Израел завзема Хеврон. Самата пещера под пода е затворена; шестте кенотафа над нея са за Авраам, Сара, Исаак, Ревека, Яков и Лия, а до тях е добавен кенотаф на Йосиф. През 1994 г. еврейски заселник застрелва тук двадесет и девет мюсюлмани по време на молитва и оттогава сградата е разделена между джамия и синагога, като всяка страна се отваря изцяло за другата няколко дни в годината. ЮНЕСКО вписва стария град на Хеврон със светилището през 2017 г. Речта на Стефан в Деянията, за разлика от това, говори за гроб, който Авраам купил в Сихем, където Битие казва, че земя купил Яков, а Авраам купил в Хеврон."
