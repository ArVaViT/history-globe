body:
  en:
    - "Sardis lay in western Asia Minor, by today's village of Sart, where the Pactolus stream comes down from Mount Tmolus into the valley of the Hermus. A steep citadel rose above the lower city. The site was lived on in the Bronze Age, but Sardis grew great as the royal city of Lydia, whose kings of the Mermnad house, from Gyges to Croesus, ruled much of western Asia Minor in the seventh and sixth centuries BC. The Pactolus once carried gold dust, Strabo says, and Herodotus calls the Lydians the first people known to strike coins of gold and silver."
    - "Cyrus of Persia took Sardis from Croesus, usually dated about 547 BC; Herodotus tells how a Persian soldier climbed the cliff on the side of the citadel that no one guarded. Sardis became the seat of a Persian satrap and the western end of the Royal Road to Susa. Ionian rebels burned the lower city about 498 BC. In 334 BC it surrendered to Alexander, who let the Lydians keep their ancient laws. About 214 BC Antiochus III took it from the rebel Achaeus, again by scaling an unguarded wall. In AD 17 an earthquake struck twelve cities of Asia, Sardis worst of all, and Tiberius gave it ten million sesterces and five years free of tribute."
    - 'Revelation names Sardis fifth of the seven churches of Asia, and its letter is one of the sternest: "I know thy works, that thou hast a name that thou livest, and art dead." It calls the church to watch, or the Lord will come "as a thief", yet it says that a few in Sardis "have not defiled their garments; and they shall walk with me in white". Some identify Sepharad, where exiles from Jerusalem lived according to Obadiah, with Sardis, whose Lydian name was similar; others doubt it.'
    - "Roman decrees quoted by Josephus show that the Jews of Sardis had their own assembly and a place to meet in the first century BC. In the late Roman city they used part of the great bath-gymnasium as a synagogue over 50 m long, uncovered by the Harvard-Cornell excavations in 1962; most of its decoration dates from the fourth and fifth centuries. About 170 Melito, bishop of Sardis, addressed an apology to the emperor and wrote On the Passover, and Polycrates of Ephesus named him among the great lights of Asia who lie in Sardis. Sardis remained the chief city of the province of Lydia into the sixth century."
  ru:
    - "Сардис лежал на западе Малой Азии, у нынешней деревни Сарт, там, где ручей Пактол спускается с горы Тмол в долину Герма. Над нижним городом поднималась крутая крепость. Люди жили здесь ещё в бронзовом веке, но величие пришло к Сардису как к царскому городу Лидии, цари которой из рода Мермнадов, от Гигеса до Крёза, в VII и VI веках до н. э. владели большей частью западной Малой Азии. Пактол, по словам Страбона, некогда нёс золотой песок, а Геродот называет лидийцев первыми известными людьми, которые стали чеканить монету из золота и серебра."
    - "Персидский царь Кир взял Сардис у Крёза — обычно это датируют около 547 г. до н. э.; Геродот рассказывает, как персидский воин взобрался по обрыву с той стороны крепости, которую никто не охранял. Сардис стал резиденцией персидского сатрапа и западным концом Царской дороги в Сузы. Около 498 г. до н. э. восставшие ионийцы сожгли нижний город. В 334 г. до н. э. он сдался Александру, который оставил лидийцам их древние законы. Около 214 г. до н. э. Антиох III отнял его у мятежника Ахея — и снова потому, что воины взобрались на неохраняемую стену. В 17 г. н. э. землетрясение поразило двенадцать городов Асии, а сильнее всех Сардис, и Тиберий дал ему десять миллионов сестерциев и на пять лет освободил от податей."
    - "Откровение называет Сардис пятой из семи церквей Асии, и послание к нему одно из самых суровых: «знаю твои дела; ты носишь имя, будто жив, но ты мертв». Оно призывает церковь бодрствовать, иначе Господь найдёт на неё, «как тать», но говорит, что в Сардисе есть несколько человек, «которые не осквернили одежд своих и будут ходить со Мною в белых одеждах». Одни отождествляют Сефарад, где, по книге Авдия, жили переселенные из Иерусалима, с Сардисом, лидийское имя которого было созвучным; другие в этом сомневаются."
    - "Римские постановления, которые приводит Иосиф Флавий, показывают, что у иудеев Сардиса в I веке до н. э. было своё собрание и место для встреч. В позднеримском городе они заняли часть большого комплекса бань и гимнасия под синагогу длиной более 50 м, открытую Гарвардско-Корнелльской экспедицией в 1962 г.; большая часть её убранства относится к IV и V векам. Около 170 г. Мелитон, епископ Сардийский, обратился к императору с апологией и написал сочинение «О Пасхе», а Поликрат Эфесский назвал его среди великих светил Асии, покоящихся в Сардисе. Город оставался главным городом провинции Лидия и в VI веке."
  uk:
    - "Сарди лежали в західній Малій Азії, біля сучасного села Сарт, де струмок Пактол спадає з гори Тмол у долину Герма. Над нижнім містом здіймалася стрімка цитадель. Місце було заселене ще в бронзовому віці, але Сарди стали великими як царське місто Лідії, чиї царі з дому Мермнадів, від Гіга до Креза, правили більшою частиною західної Малої Азії в VII–VI ст. до н. е. Пактол колись ніс золотий пісок, каже Страбон, а Геродот називає лідійців першим народом, відомим тим, що карбував монети із золота й срібла."
    - "Кір Перський узяв Сарди в Креза, що зазвичай датують близько 547 р. до н. е.; Геродот розповідає, як перський воїн виліз на скелю з того боку цитаделі, який ніхто не охороняв. Сарди стали осідком перського сатрапа й західним кінцем Царської дороги до Суз. Іонійські повстанці спалили нижнє місто близько 498 р. до н. е. У 334 р. до н. е. воно здалося Александру, який дозволив лідійцям зберегти їхні давні закони. Близько 214 р. до н. е. Антіох III відбив його в повстанця Ахея, знову видершись на неохоронюваний мур. У 17 р. н. е. землетрус вразив дванадцять міст Азії, і Сарди найтяжче з усіх, а Тиверій дав їм десять мільйонів сестерціїв і п'ять років звільнення від данини."
    - "Одкровення називає Сарди п'ятою з семи церков Азії, і лист до неї — один із найсуворіших: «Знаю твої дїла, що маєш імя, що живеш, а мертвий єси». Він закликає церкву чувати, інакше Господь прийде «як злодїй», і водночас каже, що кілька людей у Сардах «не опоганили одеж своїх», і «вони ходити муть зо мною у білих». Дехто ототожнює Сефарад, де за Овадією жили вигнанці з Єрусалима, із Сардами, чия лідійська назва була подібна; інші сумніваються."
    - "Римські декрети, які цитує Йосиф Флавій, показують, що євреї Сард у I ст. до н. е. мали власні збори й місце для зустрічей. У пізньоримському місті вони використовували частину великого лазневого гімнасію як синагогу завдовжки понад 50 м, відкриту гарвардсько-корнелльськими розкопками 1962 р.; більша частина її оздоблення датується IV–V ст. Близько 170 р. Мелітон, єпископ Сард, адресував імператорові апологію й написав «Про Пасху», а Полікрат Ефеський назвав його серед великих світил Азії, що спочивають у Сардах. Сарди лишалися головним містом провінції Лідія аж до VI ст."
  es:
    - "Sardis estaba en el oeste de Asia Menor, junto a la actual aldea de Sart, donde el arroyo Pactolo baja del monte Tmolo al valle del Hermo. Una ciudadela escarpada se alzaba sobre la ciudad baja. El lugar estuvo habitado en la Edad del Bronce, pero Sardis llegó a ser grande como ciudad real de Lidia, cuyos reyes de la casa Mermnada, desde Giges hasta Creso, gobernaron gran parte del oeste de Asia Menor en los siglos VII y VI a. C. El Pactolo arrastraba antaño polvo de oro, dice Estrabón, y Heródoto llama a los lidios el primer pueblo conocido que acuñó monedas de oro y plata."
    - "Ciro de Persia tomó Sardis a Creso, por lo común hacia 547 a. C.; Heródoto cuenta cómo un soldado persa trepó por el acantilado del lado de la ciudadela que nadie guardaba. Sardis se convirtió en sede de un sátrapa persa y en el extremo occidental del Camino Real a Susa. Rebeldes jonios quemaron la ciudad baja hacia 498 a. C. En 334 a. C. se rindió a Alejandro, que dejó a los lidios conservar sus antiguas leyes. Hacia 214 a. C. Antíoco III la tomó al rebelde Aqueo, de nuevo escalando un muro sin guardia. En 17 d. C. un terremoto golpeó doce ciudades de Asia, Sardis la peor de todas, y Tiberio le dio diez millones de sestercios y cinco años libres de tributo."
    - "El Apocalipsis nombra Sardis en quinto lugar entre las siete iglesias de Asia, y su carta es una de las más severas: «Yo conozco tus obras, que tienes nombre que vives, y estás muerto». Llama a la iglesia a velar, o el Señor vendrá «como ladrón», y sin embargo dice que unos pocos en Sardis «no han ensuciado sus vestiduras: y andarán conmigo en vestiduras blancas». Algunos identifican Sefarad, donde vivían los desterrados de Jerusalén según Abdías, con Sardis, cuyo nombre lidio era parecido; otros lo dudan."
    - "Los decretos romanos citados por Josefo muestran que los judíos de Sardis tenían su propia asamblea y un lugar de reunión en el siglo I a. C. En la ciudad romana tardía usaron parte del gran gimnasio-baño como sinagoga de más de 50 m de longitud, sacada a la luz por las excavaciones de Harvard y Cornell en 1962; la mayor parte de su decoración data de los siglos IV y V. Hacia 170 Melitón, obispo de Sardis, dirigió una apología al emperador y escribió Sobre la Pascua, y Polícrates de Éfeso lo nombró entre las grandes luminarias de Asia que yacen en Sardis. Sardis siguió siendo la ciudad principal de la provincia de Lidia hasta el siglo VI."
  pt:
    - "Sardes ficava no oeste da Ásia Menor, junto à atual aldeia de Sart, onde o riacho Pactolo desce do Monte Tmolo para o vale do Hermo. Uma cidadela íngreme se erguia acima da cidade baixa. O local foi habitado na Idade do Bronze, mas Sardes cresceu como cidade real da Lídia, cujos reis da casa dos Mermnadas, de Giges a Creso, governaram grande parte do oeste da Ásia Menor nos séculos VII e VI a.C. O Pactolo carregou outrora pó de ouro, diz Estrabão, e Heródoto chama os lídios de primeiro povo conhecido a cunhar moedas de ouro e prata."
    - "Ciro da Pérsia tomou Sardes de Creso, em geral datado de cerca de 547 a.C.; Heródoto conta como um soldado persa escalou o penhasco do lado da cidadela que ninguém guardava. Sardes tornou-se sede de um sátrapa persa e a ponta ocidental da Estrada Real até Susã. Rebeldes jônios queimaram a cidade baixa por volta de 498 a.C. Em 334 a.C. rendeu-se a Alexandre, que deixou os lídios conservar suas antigas leis. Por volta de 214 a.C., Antíoco III a tomou do rebelde Aqueu, de novo escalando uma muralha sem guarda. Em 17 d.C. um terremoto atingiu doze cidades da Ásia, Sardes pior que todas, e Tibério lhe deu dez milhões de sestércios e cinco anos de isenção de tributo."
    - "O Apocalipse nomeia Sardes a quinta das sete igrejas da Ásia, e sua carta é uma das mais severas: “Conheço as suas obras, sei que você tem a reputação de estar vivo, mas está morto.” Convoca a igreja a vigiar, ou o Senhor virá “como um ladrão”, mas diz que alguns em Sardes “não contaminaram as suas vestes. Elas andarão comigo vestidas de branco”. Alguns identificam Sefarade, onde viviam exilados de Jerusalém segundo Obadias, com Sardes, cujo nome lídio era semelhante; outros duvidam."
    - "Decretos romanos citados por Josefo mostram que os judeus de Sardes tinham sua própria assembleia e um lugar de reunião no século I a.C. Na cidade romana tardia usaram parte do grande complexo de banho e ginásio como sinagoga com mais de 50 m de comprimento, descoberta pelas escavações de Harvard e Cornell em 1962; a maior parte da decoração é dos séculos IV e V. Por volta de 170, Melitão, bispo de Sardes, dirigiu uma apologia ao imperador e escreveu Sobre a Páscoa, e Polícrates de Éfeso o nomeou entre as grandes luzes da Ásia que jazem em Sardes. Sardes continuou a principal cidade da província da Lídia até o século VI."
  de:
    - "Sardes lag in Westkleinasien beim heutigen Dorf Sart, wo der Bach Paktolos vom Tmolos ins Tal des Hermos herabkommt. Eine steile Zitadelle erhob sich über der Unterstadt. Die Stätte war in der Bronzezeit bewohnt, doch Sardes wurde groß als Königsstadt Lydiens, dessen Könige aus dem Haus der Mermnaden, von Gyges bis Krösus, im 7. und 6. Jahrhundert v. Chr. einen großen Teil Westkleinasiens beherrschten. Der Paktolos führte einst Goldstaub, sagt Strabon, und Herodot nennt die Lyder das erste bekannte Volk, das Münzen aus Gold und Silber prägte."
    - "Kyrus von Persien nahm Sardes von Krösus, meist auf etwa 547 v. Chr. datiert; Herodot erzählt, ein persischer Soldat sei an der Seite der Zitadelle, die niemand bewachte, die Klippe hinaufgeklettert. Sardes wurde Sitz eines persischen Satrapen und westliches Ende der Königsstraße nach Susa. Ionische Aufständische brannten um 498 v. Chr. die Unterstadt nieder. Im Jahr 334 v. Chr. ergab es sich Alexander, der die Lyder ihre alten Gesetze behalten ließ. Um 214 v. Chr. nahm Antiochos III. es dem aufständischen Achaios ab, wieder durch Erklimmen einer unbewachten Mauer. Im Jahr 17 n. Chr. traf ein Erdbeben zwölf Städte Asias, Sardes am schlimmsten, und Tiberius gab ihm zehn Millionen Sesterzen und fünf Jahre Abgabenfreiheit."
    - "Die Offenbarung nennt Sardes als fünfte der sieben Gemeinden Asias, und ihr Brief ist einer der strengsten: „Ich weiß deine Werke; denn du hast den Namen, daß du lebest, und bist tot.“ Er ruft die Gemeinde zum Wachen, sonst komme der Herr „wie ein Dieb“, sagt aber, dass es in Sardes einige gibt, „die nicht ihre Kleider besudelt haben; und sie werden mit mir wandeln in weißen Kleidern“. Manche setzen Sefarad, wo nach Obadja Verbannte aus Jerusalem lebten, mit Sardes gleich, dessen lydischer Name ähnlich war; andere zweifeln daran."
    - "Römische Erlasse bei Josephus zeigen, dass die Juden von Sardes im 1. Jahrhundert v. Chr. eine eigene Versammlung und einen Versammlungsort hatten. In der spätrömischen Stadt nutzten sie einen Teil des großen Bad-Gymnasiums als Synagoge von über 50 m Länge, 1962 von den Harvard-Cornell-Grabungen freigelegt; der größte Teil ihres Schmucks stammt aus dem 4. und 5. Jahrhundert. Um 170 richtete Melito, Bischof von Sardes, eine Apologie an den Kaiser und schrieb „Über das Passa“, und Polykrates von Ephesus nannte ihn unter den großen Lichtern Asias, die in Sardes ruhen. Sardes blieb bis ins 6. Jahrhundert die Hauptstadt der Provinz Lydien."
  fr:
    - "Sardes se trouvait dans l’ouest de l’Asie Mineure, près de l’actuel village de Sart, là où le ruisseau Pactole descend du mont Tmolos dans la vallée de l’Hermos. Une citadelle abrupte dominait la ville basse. Le site était habité à l’âge du Bronze, mais Sardes devint grande comme ville royale de la Lydie, dont les rois de la maison des Mermnades, de Gygès à Crésus, dominèrent une grande part de l’ouest de l’Asie Mineure aux VIIe et VIe siècles av. J.-C. Le Pactole charriait jadis de la poudre d’or, dit Strabon, et Hérodote appelle les Lydiens le premier peuple connu à frapper des monnaies d’or et d’argent."
    - "Cyrus de Perse prit Sardes à Crésus, d’ordinaire vers 547 av. J.-C. ; Hérodote raconte comment un soldat perse escalada la falaise du côté de la citadelle que nul ne gardait. Sardes devint le siège d’un satrape perse et l’extrémité occidentale de la Route royale vers Suse. Des rebelles ioniens brûlèrent la ville basse vers 498 av. J.-C. En 334 av. J.-C., elle se rendit à Alexandre, qui laissa aux Lydiens leurs anciennes lois. Vers 214 av. J.-C., Antiochos III la prit au rebelle Achéos, là encore en escaladant un mur non gardé. En 17 apr. J.-C., un séisme frappa douze villes d’Asie, Sardes plus que toute autre, et Tibère lui donna dix millions de sesterces et cinq ans d’exemption de tribut."
    - "L’Apocalypse nomme Sardes cinquième des sept Églises d’Asie, et sa lettre est l’une des plus sévères : « Je connais tes œuvres. Je sais que tu passes pour être vivant, et tu es mort. » Elle appelle l’Église à veiller, sans quoi le Seigneur viendra « comme un voleur », mais dit que quelques-uns à Sardes « n’ont pas souillé leurs vêtements ; ils marcheront avec moi en vêtements blancs ». Certains identifient Sepharad, où vivaient selon Abdias des exilés de Jérusalem, avec Sardes, dont le nom lydien était semblable ; d’autres en doutent."
    - "Des décrets romains cités par Flavius Josèphe montrent que les Juifs de Sardes avaient leur propre assemblée et un lieu de réunion au Ier siècle av. J.-C. Dans la ville romaine tardive, ils utilisaient une partie du grand bain-gymnase comme synagogue de plus de 50 m de long, mise au jour par les fouilles Harvard-Cornell en 1962 ; l’essentiel de son décor date des IVe et Ve siècles. Vers 170, Méliton, évêque de Sardes, adressa une apologie à l’empereur et écrivit Sur la Pâque, et Polycrate d’Éphèse le nomma parmi les grands luminaires d’Asie qui reposent à Sardes. Sardes resta la principale ville de la province de Lydie jusqu’au VIe siècle."
  it:
    - "Sardi si trovava nell’Asia Minore occidentale, presso l’odierno villaggio di Sart, dove il torrente Pattolo scende dal monte Tmolo nella valle dell’Ermo. Una ripida cittadella si ergeva sopra la città bassa. Il sito era abitato nell’età del Bronzo, ma Sardi divenne grande come città regale della Lidia, i cui re della casa dei Mermnadi, da Gige a Creso, governarono gran parte dell’Asia Minore occidentale nel VII e VI secolo a.C. Il Pattolo portava un tempo polvere d’oro, dice Strabone, ed Erodoto chiama i Lidi il primo popolo noto a coniare monete d’oro e d’argento."
    - "Ciro di Persia prese Sardi a Creso, di solito datato al 547 a.C. circa; Erodoto racconta come un soldato persiano scalò la roccia sul lato della cittadella che nessuno sorvegliava. Sardi divenne sede di un satrapo persiano e l’estremità occidentale della Via Regia per Susa. Ribelli ionici bruciarono la città bassa verso il 498 a.C. Nel 334 a.C. si arrese ad Alessandro, che lasciò ai Lidi le loro antiche leggi. Verso il 214 a.C. Antioco III la prese al ribelle Acheo, di nuovo scalando un muro non sorvegliato. Nel 17 d.C. un terremoto colpì dodici città d’Asia, Sardi più di tutte, e Tiberio le diede dieci milioni di sesterzi e cinque anni di esenzione dai tributi."
    - "L’Apocalisse nomina Sardi quinta delle sette chiese d’Asia, e la sua lettera è una delle più severe: «Io conosco le tue opere: tu hai nome di vivere e sei morto.» Chiama la chiesa a vegliare, altrimenti il Signore verrà «come un ladro», eppure dice che a Sardi pochi «non hanno contaminato le loro vesti; essi cammineranno meco in vesti bianche». Alcuni identificano Sefarad, dove secondo Abdia vivevano gli esuli da Gerusalemme, con Sardi, il cui nome lidio era simile; altri ne dubitano."
    - "Decreti romani citati da Giuseppe Flavio mostrano che gli Ebrei di Sardi avevano una propria assemblea e un luogo di riunione nel I secolo a.C. Nella città tardo-romana usavano come sinagoga, lunga più di 50 m, una parte del grande complesso di terme e ginnasio, portata alla luce dagli scavi di Harvard e Cornell nel 1962; gran parte della sua decorazione risale al IV e V secolo. Verso il 170 Melitone, vescovo di Sardi, indirizzò un’apologia all’imperatore e scrisse Sulla Pasqua, e Policrate di Efeso lo nominò tra le grandi luci d’Asia che riposano a Sardi. Sardi rimase la città principale della provincia di Lidia fino al VI secolo."
  pl:
    - "Sardes leżały w zachodniej Azji Mniejszej, przy dzisiejszej wsi Sart, gdzie strumień Paktolos spływa z góry Tmolos do doliny Hermosu. Stroma cytadela wznosiła się nad dolnym miastem. Miejsce było zamieszkane w epoce brązu, lecz Sardes urosły w potęgę jako miasto królewskie Lidii, której królowie z domu Mermnadów, od Gygesa do Krezusa, rządzili znaczną częścią zachodniej Azji Mniejszej w VII i VI wieku p.n.e. Paktolos niósł niegdyś złoty pył, mówi Strabon, a Herodot nazywa Lidyjczyków pierwszym znanym ludem bijącym monety ze złota i srebra."
    - "Cyrus perski zdobył Sardes od Krezusa, co zwykle datuje się na około 547 rok p.n.e.; Herodot opowiada, jak perski żołnierz wspiął się na urwisko po stronie cytadeli, której nikt nie strzegł. Sardes stały się siedzibą perskiego satrapy i zachodnim końcem Drogi Królewskiej do Suzy. Jońscy powstańcy spalili dolne miasto około 498 roku p.n.e. W 334 roku p.n.e. poddały się Aleksandrowi, który pozwolił Lidyjczykom zachować ich dawne prawa. Około 214 roku p.n.e. Antioch III zdobył je od zbuntowanego Achajosa, znów wspinając się na niestrzeżony mur. W 17 roku n.e. trzęsienie ziemi dotknęło dwanaście miast Azji, Sardes najbardziej ze wszystkich, a Tyberiusz dał im dziesięć milionów sestercji i pięć lat wolnych od trybutu."
    - "Apokalipsa wymienia Sardes jako piąty z siedmiu kościołów Azji, a jego list jest jednym z najsurowszych: „Znam uczynki twoje, i masz imię, że żyjesz; aleś jest umarły”. Wzywa kościół do czuwania, bo inaczej Pan przyjdzie „jako złodziej”, lecz mówi, że w Sardes są niektóre osoby, „które nie pokalały szat swoich; przetoż chodzić będą ze mną w szatach białych”. Niektórzy utożsamiają Sefarad, gdzie według Abdiasza mieszkali wygnańcy z Jerozolimy, z Sardes, których lidyjska nazwa była podobna; inni w to wątpią."
    - "Dekrety rzymskie cytowane przez Józefa Flawiusza pokazują, że Żydzi z Sardes mieli w I wieku p.n.e. własne zgromadzenie i miejsce spotkań. W późnorzymskim mieście używali części wielkiego kompleksu łaźni i gimnazjonu jako synagogi o długości ponad 50 m, odsłoniętej przez wykopaliska Harvard–Cornell w 1962 roku; większość jej dekoracji pochodzi z IV i V wieku. Około 170 roku Melito, biskup Sardes, skierował apologię do cesarza i napisał O Pasze, a Polikrates z Efezu wymienił go wśród wielkich świateł Azji, które spoczywają w Sardes. Sardes pozostały głównym miastem prowincji Lidii do VI wieku."
  cs:
    - "Sardy ležely v západní Malé Asii, u dnešní vesnice Sart, kde potok Paktólos stéká z hory Tmólos do údolí Hermu. Nad dolním městem se zvedala strmá citadela. Místo bylo osídleno v době bronzové, ale Sardy se proslavily jako královské město Lýdie, jejíž králové z rodu Mermnovců, od Gygy po Kroisa, vládli velké části západní Malé Asie v 7. a 6. století př. n. l. Paktólos kdysi nesl zlatý prach, praví Strabón, a Hérodotos nazývá Lýdy prvním známým národem, který razil zlaté a stříbrné mince."
    - "Kýros Perský dobyl Sardy od Kroisa, obvykle datováno asi do roku 547 př. n. l.; Hérodotos vypráví, jak perský voják vylezl na útes na straně citadely, kterou nikdo nehlídal. Sardy se staly sídlem perského satrapy a západním koncem Královské cesty do Sus. Iónští povstalci spálili dolní město asi roku 498 př. n. l. Roku 334 př. n. l. se vzdaly Alexandrovi, který Lýdům nechal jejich staré zákony. Asi roku 214 př. n. l. je Antiochos III. vzal povstalci Achaiovi, opět zdoláním nehlídané hradby. Roku 17 n. l. zemětřesení postihlo dvanáct měst Asie, Sardy nejhůře, a Tiberius jim dal deset milionů sestercií a pět let osvobození od tributu."
    - "Zjevení jmenuje Sardy pátou ze sedmi církví Asie a jeho list je jedním z nejpřísnějších: „Vím skutky tvé: máš jméno, že jsi živ, ale jsi mrtvý.“ Vyzývá církev, aby bděla, jinak Pán přijde „jako zloděj“, a přesto praví, že některé osoby v Sardách „neposkvrnily roucha svého, protož budouť se procházeti se mnou v bílém rouše“. Někteří ztotožňují Sefarad, kde podle Obadjáše žili vyhnanci z Jeruzaléma, se Sardami, jejichž lýdské jméno bylo podobné; jiní o tom pochybují."
    - "Římské výnosy citované Josephem ukazují, že Židé v Sardách měli v 1. století př. n. l. vlastní shromáždění a místo setkávání. V pozdně římském městě užívali část velké lázeňské tělocvičny jako synagogu dlouhou přes 50 m, odkrytou vykopávkami Harvardu a Cornellu roku 1962; většina její výzdoby pochází ze 4. a 5. století. Asi roku 170 adresoval Melitón, biskup sardský, císaři apologii a napsal O velikonocích a Polykrates z Efezu jej jmenoval mezi velkými světly Asie, která leží v Sardách. Sardy zůstaly hlavním městem provincie Lýdie do 6. století."
  nl:
    - "Sardes lag in het westen van Klein-Azië, bij het huidige dorp Sart, waar de Paktolos van de Tmolos afdaalt in de vallei van de Hermos. Een steile burcht rees boven de benedenstad. De plaats was in de bronstijd bewoond, maar Sardes werd groot als koningsstad van Lydië, wier koningen uit het huis van de Mermnaden, van Gyges tot Croesus, in de 7e en 6e eeuw v.Chr. een groot deel van West-Klein-Azië beheersten. De Paktolos voerde eens goudstof mee, zegt Strabo, en Herodotus noemt de Lydiërs het eerste volk waarvan bekend is dat het gouden en zilveren munten sloeg."
    - "Cyrus van Perzië nam Sardes van Croesus, meestal gedateerd omstreeks 547 v.Chr.; Herodotus vertelt hoe een Perzische soldaat de rots beklom aan de kant van de burcht die niemand bewaakte. Sardes werd de zetel van een Perzische satraap en het westelijke eindpunt van de Koningsweg naar Susa. Ionische opstandelingen verbrandden de benedenstad omstreeks 498 v.Chr. In 334 v.Chr. gaf het zich over aan Alexander, die de Lydiërs hun oude wetten liet houden. Omstreeks 214 v.Chr. nam Antiochus III het van de opstandeling Achaios, opnieuw door een onbewaakte muur te beklimmen. In 17 n.Chr. trof een aardbeving twaalf steden van Asia, Sardes het zwaarst, en Tiberius gaf het tien miljoen sestertiën en vijf jaar vrijstelling van belasting."
    - "Openbaring noemt Sardes de vijfde van de zeven kerken van Asia, en haar brief is een van de strengste: “Ik weet uw werken, dat gij den naam hebt, dat gij leeft, en gij zijt dood.” Hij roept de gemeente op te waken, anders zal de Heer komen “als een dief”, en toch zegt hij dat enkelen in Sardes “hun klederen niet bevlekt hebben, en zij zullen met Mij wandelen in witte klederen”. Sommigen vereenzelvigen Sefarad, waar volgens Obadja ballingen uit Jeruzalem woonden, met Sardes, wier Lydische naam gelijkluidend was; anderen betwijfelen dat."
    - "Romeinse besluiten die Josephus aanhaalt, tonen dat de Joden van Sardes in de 1e eeuw v.Chr. een eigen vergadering en een plaats van samenkomst hadden. In de laat-Romeinse stad gebruikten zij een deel van het grote bad-gymnasion als synagoge van meer dan 50 m lang, in 1962 blootgelegd door de opgravingen van Harvard en Cornell; het grootste deel van de versiering dateert uit de 4e en 5e eeuw. Omstreeks 170 richtte Melito, bisschop van Sardes, een apologie aan de keizer en schreef Over het Pascha, en Polycrates van Efeze noemde hem onder de grote lichten van Asia die in Sardes rusten. Sardes bleef tot in de 6e eeuw de hoofdstad van de provincie Lydië."
  sv:
    - "Sardes låg i västra Mindre Asien, vid dagens by Sart, där bäcken Paktolos kommer ned från berget Tmolos till Hermosdalen. En brant citadell reste sig över nedre staden. Platsen var bebodd under bronsåldern, men Sardes blev stort som Lydiens kungastad, vars kungar av mermnadätten, från Gyges till Kroisos, härskade över stora delar av västra Mindre Asien på 600- och 500-talen f.Kr. Paktolos förde en gång guldstoft, säger Strabon, och Herodotos kallar lydierna det första folk man känner som slog mynt av guld och silver."
    - "Kyros av Persien tog Sardes från Kroisos, vanligen daterat till omkring 547 f.Kr.; Herodotos berättar hur en persisk soldat klättrade uppför klippan på den sida av citadellet som ingen bevakade. Sardes blev säte för en persisk satrap och västra änden av Kungsvägen till Susa. Joniska rebeller brände nedre staden omkring 498 f.Kr. År 334 f.Kr. kapitulerade det till Alexander, som lät lydierna behålla sina gamla lagar. Omkring 214 f.Kr. tog Antiochos III det från rebellen Achaios, åter genom att bestiga en obevakad mur. År 17 e.Kr. drabbade en jordbävning tolv städer i Asien, Sardes värst av alla, och Tiberius gav det tio miljoner sestertier och fem år utan tribut."
    - "Uppenbarelseboken nämner Sardes som femte av de sju församlingarna i Asien, och dess brev är ett av de strängaste: ”Jag känner dina gärningar; du har det namnet om dig, att du lever, men du är död.” Det manar församlingen att vaka, annars kommer Herren ”såsom en tjuv”, men säger att några få i Sardes ”icke hava fläckat sina kläder; och dessa skola vandra med mig i vita kläder”. Vissa identifierar Sefarad, där landsflyktiga från Jerusalem bodde enligt Obadja, med Sardes, vars lydiska namn liknade det; andra tvivlar."
    - "Romerska påbud som Josefus citerar visar att judarna i Sardes hade en egen församling och en samlingsplats under första århundradet f.Kr. I den sena romerska staden använde de en del av det stora badgymnasiet som en synagoga över 50 m lång, frilagd av Harvard-Cornell-utgrävningarna 1962; det mesta av dess dekor härrör från 300- och 400-talen. Omkring 170 riktade Melito, biskop av Sardes, en apologi till kejsaren och skrev Om påsken, och Polykrates av Efesos nämnde honom bland Asiens stora ljus som vilar i Sardes. Sardes förblev huvudstad i provinsen Lydien in på 500-talet."
  nb:
    - "Sardes lå i vestlige Lilleasia, ved dagens landsby Sart, der bekken Paktolos kommer ned fra Tmolos inn i Hermos-dalen. En bratt citadell reiste seg over nedre by. Stedet var bebodd i bronsealderen, men Sardes ble stor som kongebyen i Lydia, hvis konger av mermnadenes hus, fra Gyges til Kroisos, styrte mye av vestlige Lilleasia på 600- og 500-tallet f.Kr. Paktolos førte en gang gullstøv, sier Strabon, og Herodot kaller lydierne det første kjente folket som slo mynter av gull og sølv."
    - "Kyros av Persia tok Sardes fra Kroisos, vanligvis datert omkring 547 f.Kr.; Herodot forteller hvordan en persisk soldat klatret opp den siden av citadellet ingen voktet. Sardes ble sete for en persisk satrap og den vestlige enden av Kongeveien til Susa. Joniske opprørere brente nedre by omkring 498 f.Kr. I 334 f.Kr. overga den seg til Aleksander, som lot lydierne beholde sine gamle lover. Omkring 214 f.Kr. tok Antiokhos III den fra opprøreren Akhaios, igjen ved å klatre over en ubevoktet mur. I 17 e.Kr. rammet et jordskjelv tolv byer i Asia, Sardes verst, og Tiberius ga den ti millioner sestertser og fem år fri for skatt."
    - "Johannes' åpenbaring nevner Sardes som den femte av de sju menighetene i Asia, og brevet er et av de strengeste: «Jeg vet om dine gjerninger, at du har navn av at du lever, og du er død.» Det kaller menigheten til å våke, ellers kommer Herren «som en tyv», men sier at noen få i Sardes «ikke har smittet sine klær, og de skal gå med mig i hvite klær». Noen identifiserer Sefarad, der landflyktige fra Jerusalem bodde ifølge Obadja, med Sardes, hvis lydiske navn var lignende; andre tviler."
    - "Romerske dekreter sitert av Josefus viser at jødene i Sardes hadde sin egen forsamling og et sted å møtes i 1. århundre f.Kr. I den sene romerske byen brukte de en del av det store badegymnasiet som synagoge, over 50 m lang, avdekket av Harvard-Cornell-utgravningene i 1962; det meste av dekorasjonen stammer fra 300- og 400-tallet. Omkring 170 rettet Melito, biskop i Sardes, en apologi til keiseren og skrev Om påsken, og Polykrates av Efesos nevnte ham blant Asias store lys som hviler i Sardes. Sardes forble hovedby i provinsen Lydia inn på 500-tallet."
  tl:
    - "Ang Sardis ay nasa kanlurang Asia Minor, sa tabi ng nayon ng Sart ngayon, kung saan bumababa ang batis ng Pactolus mula sa Bundok Tmolus patungo sa libis ng Hermus. Isang matarik na kuta ang umaangat sa itaas ng ibabang lungsod. Tinirhan ang lugar noong Panahong Tanso, ngunit naging dakila ang Sardis bilang maharlikang lungsod ng Lidia, na ang mga hari ng sambahayang Mermnad, mula kay Gyges hanggang kay Croesus, ay namuno sa malaking bahagi ng kanlurang Asia Minor noong ika-7 at ika-6 na siglo BK. Minsang nagdala ng alikabok ng ginto ang Pactolus, ayon kay Strabo, at tinatawag ni Herodotus ang mga Lidio na unang kilalang bayang gumawa ng mga baryang ginto at pilak."
    - "Kinuha ni Ciro ng Persia ang Sardis kay Croesus, na karaniwang ipinepetsa bandang 547 BK; isinasalaysay ni Herodotus kung paano umakyat ang isang sundalong Persiyano sa bangin sa gilid ng kuta na walang nagbabantay. Ang Sardis ay naging luklukan ng satrapang Persiyano at kanlurang dulo ng Maharlikang Daan patungong Susan. Sinunog ng mga rebeldeng Ionio ang ibabang lungsod bandang 498 BK. Noong 334 BK, sumuko ito kay Alejandro, na hinayaan ang mga Lidio na panatilihin ang kanilang sinaunang batas. Bandang 214 BK, kinuha ito ni Antioco III mula sa rebeldeng si Achaeus, muli sa pag-akyat sa pader na walang bantay. Noong AD 17, tinamaan ng lindol ang labindalawang lungsod ng Asia, pinakamalubha ang Sardis, at binigyan ito ni Tiberio ng sampung milyong sesterces at limang taong walang tributo."
    - "Pinangalanan ng Apocalipsis ang Sardis na ikalima sa pitong iglesia ng Asia, at ang liham nito ay isa sa pinakamahigpit: “Nalalaman ko ang iyong mga gawa, na ikaw ay may pangalang ikaw ay nabubuhay, at ikaw ay patay.” Tinatawag nito ang iglesia na magpuyat, o paririyan ang Panginoon “gaya ng magnanakaw”, ngunit sinasabi nitong may ilan sa Sardis na “hindi nangagdumi ng kanilang mga damit: at sila'y kasama kong magsisilakad na may mga damit na maputi”. Iniuugnay ng ilan ang Sepharad, kung saan nanirahan ang mga tapon mula sa Jerusalem ayon kay Obadias, sa Sardis, na may katulad na pangalang Lidio; pinag-aalinlanganan ito ng iba."
    - "Ipinakikita ng mga dekretong Romano na sinipi ni Josephus na ang mga Judio ng Sardis ay may sariling kapulungan at lugar ng pagtitipon noong ika-1 siglo BK. Sa huling lungsod na Romano, ginamit nila ang bahagi ng malaking paliguang-gymnasium bilang sinagoga na mahigit 50 m ang haba, na inilantad ng mga paghuhukay ng Harvard-Cornell noong 1962; karamihan ng palamuti nito ay mula sa ika-4 at ika-5 siglo. Bandang 170, nagpadala si Melito, obispo ng Sardis, ng apolohiya sa emperador at sumulat ng Tungkol sa Paskua, at pinangalanan siya ni Polycrates ng Efeso sa mga dakilang ilaw ng Asia na nakahimlay sa Sardis. Nanatiling pangunahing lungsod ng lalawigan ng Lidia ang Sardis hanggang ika-6 na siglo."
  da:
    - "Sardes lå i det vestlige Lilleasien, ved nutidens landsby Sart, hvor åen Paktolos kommer ned fra Tmolos ind i Hermos' dal. En stejl borg rejste sig over den nedre by. Stedet var beboet i bronzealderen, men Sardes blev stort som Lydiens kongeby, hvis konger af mermnadehuset, fra Gyges til Kroisos, herskede over meget af det vestlige Lilleasien i 600- og 500-tallet f.Kr. Paktolos førte engang guldstøv, siger Strabon, og Herodot kalder lyderne det første folk, man kender, der prægede mønter af guld og sølv."
    - "Kyros af Persien tog Sardes fra Kroisos, sædvanligvis dateret til omkring 547 f.Kr.; Herodot fortæller, hvordan en persisk soldat klatrede op ad klippen på den side af borgen, som ingen bevogtede. Sardes blev sæde for en persisk satrap og den vestlige ende af Kongevejen til Susa. Ioniske oprørere brændte den nedre by omkring 498 f.Kr. I 334 f.Kr. overgav den sig til Alexander, som lod lyderne beholde deres gamle love. Omkring 214 f.Kr. tog Antiochos 3. den fra oprøreren Achaios, igen ved at bestige en ubevogtet mur. I 17 e.Kr. ramte et jordskælv tolv af Asiens byer, Sardes værst af alle, og Tiberius gav den ti millioner sesterser og fem år fri for skat."
    - "Johannes' Åbenbaring nævner Sardes som den femte af Asiens syv menigheder, og dens brev er et af de strengeste: »Jeg kender dine Gerninger, at da har Ord for at leve og er dog død.« Det kalder menigheden til at våge, ellers vil Herren komme »som en Tyv«, men siger, at nogle få i Sardes er dem, »som ikke have besmittet deres Klæder; de skulle vandre med mig i hvide Klæder«. Nogle identificerer Sefarad, hvor landflygtige fra Jerusalem boede ifølge Obadja, med Sardes, hvis lydiske navn lignede; andre tvivler."
    - "Romerske dekreter citeret af Josefus viser, at jøderne i Sardes havde deres egen forsamling og et sted at mødes i 1. århundrede f.Kr. I den sene romerske by brugte de en del af det store badegymnasion som synagoge på over 50 m, afdækket af Harvard-Cornell-udgravningerne i 1962; det meste af dens udsmykning stammer fra 300- og 400-tallet. Omkring 170 rettede Melito, biskop af Sardes, en forsvarsskrivelse til kejseren og skrev Om påsken, og Polykrates af Efesos nævnte ham blandt Asiens store lys, som hviler i Sardes. Sardes forblev hovedby i provinsen Lydien ind i 500-tallet."
  sr:
    - "Сард је лежао у западној Малој Азији, код данашњег села Сарт, где поток Пактол силази с планине Тмол у долину Херма. Стрма цитадела уздизала се изнад доњег града. Место је било насељено у бронзаном добу, али је Сард постао велик као краљевски град Лидије, чији су краљеви из куће Мермнада, од Гига до Креза, владали великим делом западне Мале Азије у 7. и 6. веку п. н. е. Пактол је некад носио златни прах, каже Страбон, а Херодот Лиђане назива првим познатим народом који је ковао новац од злата и сребра."
    - "Кир Персијски узео је Сард од Креза, што се обично датира око 547. п. н. е.; Херодот приповеда како се један персијски војник попео на литицу на страни цитаделе коју нико није чувао. Сард је постао седиште персијског сатрапа и западни крај Краљевског пута до Суса. Јонски побуњеници спалили су доњи град око 498. п. н. е. Године 334. п. н. е. предао се Александру, који је Лиђанима оставио њихове древне законе. Око 214. п. н. е. Антиох III одузео га је од побуњеника Ахеја, опет пењући се на нечуван зид. Године 17. н. е. земљотрес је погодио дванаест градова Азије, Сард најтеже, а Тиверије му је дао десет милиона сестерција и пет година ослобођења од данка."
    - "Откривење именује Сард пету од седам цркава Азије, а његова посланица је једна од најоштријих: „Знам твоја дела, да имаш име да си жив, а мртав си.“ Позива цркву да бди, или ће Господ доћи „као лупеж“, а ипак каже да неколицина у Сарду „не опоганише својих хаљина, и ходиће са мном у белима“. Неки Сефарад, где су по Овадији живели изгнаници из Јерусалима, поистовећују са Сардом, чије је лидијско име слично; други сумњају."
    - "Римски декрети које цитира Јосиф Флавије показују да су Јевреји Сарда имали своју скупштину и место сабирања у 1. веку п. н. е. У касноантичком граду користили су део великог купатила-гимназиона као синагогу дугу преко 50 м, коју су открила харвардско-корнелска ископавања 1962; већина њеног украса потиче из 4. и 5. века. Око 170. Мелитон, епископ Сарда, упутио је апологију цару и написао О Пасхи, а Поликрат Ефески навео га је међу велике светиљке Азије које леже у Сарду. Сард је остао главни град провинције Лидије до 6. века."
