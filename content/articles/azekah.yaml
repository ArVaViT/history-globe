body:
  en:
    - "Azekah was a fortified town of Judah in the Shephelah, the foothills between the hill country and the Philistine plain. Its site, Tel Azekah (Tell Zakariya), is a steep mound above the valley of Elah, about 30 km south-west of Jerusalem, on the road that climbed from the coast towards Hebron and Bethlehem. The mound was first excavated by Bliss and Macalister for the Palestine Exploration Fund in 1898–1899, and since 2012 by a joint expedition of Tel Aviv and Heidelberg universities, which has found a large Canaanite town of the Late Bronze Age, destroyed by fire about 1130 BC, under the Judahite city."
    - "When Joshua routed the five Amorite kings at Gibeon and chased them down the pass of Beth-horon, “the LORD cast down great stones from heaven upon them unto Azekah”. Joshua lists Azekah in the Shephelah district of Judah with Jarmuth, Adullam and Socoh. The Philistines, with Goliath among them, “pitched between Shochoh and Azekah, in Ephes-dammim” for the battle in the valley of Elah; Rehoboam fortified the town among the strongholds of Judah, and after the exile men of Judah settled again “at Azekah, and in the villages thereof”."
    - "Azekah stood on the road of invaders. A fragmentary Assyrian text, generally assigned to Sennacherib's campaign of 701 BC, describes the siege of Azekah, set on a mountain ridge like pointed daggers, and its capture by ramps and battering rams. In 588 BC, as Nebuchadnezzar's army closed on Jerusalem, Jeremiah noted that Lachish and Azekah alone held out, “for these defenced cities remained of the cities of Judah”; one of the ostraca found in the gate of Lachish, a letter from an outpost, says that its men are watching for the fire signals of Lachish because they can no longer see Azekah. Eusebius knew Azeca as a village between Eleutheropolis and Jerusalem."
    - "Today Tel Azekah lies in Israel, in the British Park near the moshav of Zekharia, with a view over the valley of Elah; the excavation continues each summer."
  ru:
    - "Азека была укреплённым городом Иудеи в Шефеле, предгорьях между нагорьем и Филистимской равниной. Её место, Тель-Азека (Телль-Закария), — крутой холм над долиной Дуба примерно в 30 км к юго-западу от Иерусалима, на дороге, поднимавшейся от побережья к Хеврону и Вифлеему. Холм впервые раскапывали Блисс и Макалистер для Палестинского исследовательского фонда в 1898–1899 годах, а с 2012 года — совместная экспедиция Тель-Авивского и Гейдельбергского университетов, нашедшая под иудейским городом большой ханаанский город позднего бронзового века, сгоревший около 1130 г. до н. э."
    - "Когда Иисус Навин разбил пятерых Аморрейских царей при Гаваоне и гнал их по спуску Вефоронскому, «Господь бросал на них с небес большие камни града до самого Азека». Книга Иисуса Навина числит Азеку в округе Шефелы вместе с Иармуфом, Одолламом и Сохо. Филистимляне, и среди них Голиаф, «расположились станом между Сокхофом и Азеком в Ефес-Даммиме» для битвы в долине Дуба; Ровоам укрепил город среди крепостей Иудеи, а после плена люди Иуды снова поселились «в Азеке и зависящих от нее городах»."
    - "Азека стояла на пути завоевателей. Обломок ассирийского текста, который обычно относят к походу Сеннахирима 701 г. до н. э., описывает осаду Азеки, расположенной на горном хребте, словно острые кинжалы, и её взятие при помощи насыпей и таранов. В 588 г. до н. э., когда войско Навуходоносора подступало к Иерусалиму, Иеремия отметил, что держались лишь Лахис и Азека, «ибо из городов Иудейских сии только оставались, как города укрепленные»; один из черепков, найденных в воротах Лахиса, письмо с заставы, сообщает, что его люди следят за сигнальными огнями Лахиса, потому что Азеки больше не видят. Евсевий знал Азеку как селение между Элевтерополем и Иерусалимом."
    - "Сегодня Тель-Азека лежит в Израиле, в Британском парке у мошава Зехария, с видом на долину Дуба; раскопки продолжаются каждое лето."
  uk:
    - "Азека була укріпленим містом Юди в Шефелі, передгір'ї між нагір'ям і филистимською рівниною. Її місце, Тель-Азека (Телль-Закарія), — стрімкий пагорб над Долиною дуба, приблизно за 30 км на південний захід від Єрусалима, на дорозі, що піднімалася від узбережжя до Хеврону та Вифлеєма. Пагорб уперше розкопували Бліс і Макалістер для Фонду дослідження Палестини у 1898–1899 рр., а від 2012 року — спільна експедиція університетів Тель-Авіва і Гайдельберга, яка під юдейським містом знайшла велике ханаанське місто пізньої бронзової доби, зруйноване вогнем близько 1130 р. до н. е."
    - "Коли Ісус Навин розбив п'ятьох аморійських царів при Гаваоні та гнав їх униз перевалом Бет-Хорона, «Господь спустив на них з небес страшенний град мов каміннє аж до Азека». Ісус Навин зараховує Азеку до округу Шефела Юди разом із Ярмутом, Одоламом і Сохо. Филистимляни, серед них Голіят, «отаборились під Ефес-Даммимом між Сохотом і Азеком» для битви в Долині дуба; Ровоам укріпив місто серед твердинь Юди, а після вигнання юдеї знову оселилися «в Азецї і в залежних від неї містах»."
    - "Азека стояла на шляху загарбників. Уривчастий ассирійський текст, загалом віднесений до походу Сінаххеріба 701 р. до н. е., описує облогу Азеки, що стоїть на гірському хребті, мов гострі кинджали, і її здобуття насипами та таранами. У 588 р. до н. е., коли військо Навуходоносора підступало до Єрусалима, Єремія зазначив, що лише Лахіш і Азека ще тримаються, «одні бо сї зоставались ізміж городів Юдиних, як городи утверджені»; один з остраконів, знайдених у брамі Лахіша, лист з форпосту, каже, що його люди стежать за вогняними сигналами Лахіша, бо вже не бачать Азеки. Євсевій знав Азеку як село між Елевтеропілем і Єрусалимом."
    - "Нині Тель-Азека лежить в Ізраїлі, в Британському парку біля мошава Зехарія, з видом на Долину дуба; розкопки тривають щоліта."
  es:
    - "Azeca era una ciudad fortificada de Judá en la Sefelá, las estribaciones entre la región montañosa y la llanura filistea. Su sitio, Tel Azekah (Tell Zakariya), es un empinado montículo sobre el valle de Ela, a unos 30 km al sudoeste de Jerusalén, en el camino que subía desde la costa hacia Hebrón y Belén. El montículo fue excavado por primera vez por Bliss y Macalister para el Palestine Exploration Fund en 1898–1899, y desde 2012 por una expedición conjunta de las universidades de Tel Aviv y Heidelberg, que ha hallado bajo la ciudad judaíta una gran ciudad cananea del Bronce Final, destruida por el fuego hacia 1130 a. C."
    - "Cuando Josué puso en fuga a los cinco reyes amorreos en Gabaón y los persiguió por el paso de Bet-horón, «Jehová echó sobre ellos del cielo grandes piedras hasta Azeca». Josué enumera Azeca en el distrito de la Sefelá de Judá con Jarmut, Adulam y Soco. Los filisteos, con Goliat entre ellos, «asentaron el campo entre Sochô y Azeca, en Ephes-dammim» para la batalla en el valle de Ela; Roboam fortificó la ciudad entre las plazas fuertes de Judá, y tras el exilio hombres de Judá se establecieron de nuevo en «Azeca y sus aldeas»."
    - "Azeca estaba en el camino de los invasores. Un texto asirio fragmentario, atribuido por lo general a la campaña de Senaquerib de 701 a. C., describe el asedio de Azeca, situada en una cresta montañosa como dagas puntiagudas, y su captura con rampas y arietes. En 588 a. C., cuando el ejército de Nabucodonosor se cerraba sobre Jerusalén, Jeremías observó que solo Laquis y Azeca resistían, «porque de las ciudades fuertes de Judá éstas habían quedado»; uno de los óstraca hallados en la puerta de Laquis, una carta de un puesto avanzado, dice que sus hombres vigilan las señales de fuego de Laquis porque ya no pueden ver Azeca. Eusebio conocía Azeca como una aldea entre Eleuterópolis y Jerusalén."
    - "Hoy Tel Azekah se encuentra en Israel, en el Parque Británico, cerca del moshav de Zekharia, con vistas al valle de Ela; la excavación continúa cada verano."
  pt:
    - "Azeca era uma cidade fortificada de Judá na Sefelá, as colinas baixas entre a região montanhosa e a planície filisteia. Seu sítio, Tel Azekah (Tell Zakariya), é um montículo íngreme acima do vale de Elá, cerca de 30 km a sudoeste de Jerusalém, na estrada que subia da costa para Hebrom e Belém. O montículo foi escavado primeiro por Bliss e Macalister para o Fundo de Exploração da Palestina em 1898–1899 e, desde 2012, por uma expedição conjunta das universidades de Tel Aviv e Heidelberg, que achou, sob a cidade de Judá, uma grande cidade cananeia do Bronze Final, destruída pelo fogo por volta de 1130 a.C."
    - "Quando Josué derrotou os cinco reis amorreus em Gibeão e os perseguiu pela descida de Bete-Horom, “o SENHOR lançou do céu grandes pedras sobre eles até Azeca”. Josué lista Azeca no distrito da Sefelá de Judá com Jarmute, Adulão e Socó. Os filisteus, com Golias entre eles, “acamparam entre Socó e Azeca, em Efes-Damim” para a batalha no vale de Elá; Roboão a fortificou entre as fortalezas de Judá, e depois do exílio homens de Judá se instalaram de novo “em Azeca e seus povoados”."
    - "Azeca ficava na rota dos invasores. Um texto assírio fragmentário, em geral atribuído à campanha de Senaqueribe de 701 a.C., descreve o cerco de Azeca, posta numa crista de montanha como punhais pontiagudos, e sua tomada por rampas e aríetes. Em 588 a.C., quando o exército de Nabucodonosor se fechava sobre Jerusalém, Jeremias notou que só Laquis e Azeca resistiam, “pois somente estas restaram das cidades de Judá como cidades fortificadas”; um dos óstracos achados na porta de Laquis, uma carta de um posto avançado, diz que seus homens vigiam os sinais de fogo de Laquis porque já não conseguem ver Azeca. Eusébio conhecia Azeca como uma aldeia entre Eleuterópolis e Jerusalém."
    - "Hoje Tel Azekah fica em Israel, no Parque Britânico, perto do moshav de Zekharia, com vista para o vale de Elá; a escavação continua a cada verão."
  de:
    - "Aseka war eine befestigte Stadt Judas in der Schefela, dem Vorland zwischen Bergland und Philisterebene. Ihre Stätte, Tel Azeka (Tell Zakariya), ist ein steiler Hügel über dem Elatal, etwa 30 km südwestlich von Jerusalem, an der Straße, die von der Küste nach Hebron und Bethlehem anstieg. Der Hügel wurde 1898–1899 erstmals von Bliss und Macalister für den Palestine Exploration Fund ausgegraben und seit 2012 von einer gemeinsamen Expedition der Universitäten Tel Aviv und Heidelberg, die unter der judäischen Stadt eine große kanaanäische Stadt der Spätbronzezeit fand, um 1130 v. Chr. durch Feuer zerstört."
    - "Als Josua die fünf amoritischen Könige bei Gibeon schlug und sie den Pass von Bet-Horon hinabjagte, „ließ der HERR einen großen Hagel vom Himmel auf sie fallen bis gen Aseka“. Josua führt Aseka im Bezirk der Schefela Judas auf, mit Jarmut, Adullam und Socho. Die Philister, unter ihnen Goliat, „lagerten sich zwischen Socho und Aseka bei Ephes-Dammim“ zur Schlacht im Elatal; Rehabeam befestigte die Stadt unter den Festen Judas, und nach dem Exil siedelten Männer aus Juda wieder „zu Aseka und seinen Ortschaften“."
    - "Aseka lag am Weg der Eroberer. Ein fragmentarischer assyrischer Text, meist Sanheribs Feldzug von 701 v. Chr. zugeschrieben, beschreibt die Belagerung von Aseka, das wie spitze Dolche auf einem Bergrücken lag, und seine Einnahme mit Rampen und Rammböcken. Als Nebukadnezars Heer 588 v. Chr. Jerusalem einschloss, vermerkte Jeremia, nur Lachisch und Aseka hielten stand, „denn diese waren noch übriggeblieben von den festen Städten Juda's“; eines der im Tor von Lachisch gefundenen Ostraka, ein Brief von einem Außenposten, sagt, seine Männer hielten nach den Feuersignalen von Lachisch Ausschau, weil sie Aseka nicht mehr sehen könnten. Eusebius kannte Azeka als Dorf zwischen Eleutheropolis und Jerusalem."
    - "Heute liegt Tel Azeka in Israel, im Britischen Park beim Moschaw Zecharia, mit Blick über das Elatal; die Grabung wird jeden Sommer fortgesetzt."
  fr:
    - "Azéka était une ville fortifiée de Juda dans la Shéphéla, les contreforts entre la montagne et la plaine philistine. Son site, Tel Azekah (Tell Zakariya), est un tertre escarpé au-dessus de la vallée d’Éla, à environ 30 km au sud-ouest de Jérusalem, sur la route qui montait de la côte vers Hébron et Bethléem. Le tertre fut d’abord fouillé par Bliss et Macalister pour le Palestine Exploration Fund en 1898-1899, puis depuis 2012 par une expédition conjointe des universités de Tel-Aviv et de Heidelberg, qui a trouvé sous la ville judéenne une grande ville cananéenne du Bronze récent, détruite par le feu vers 1130 av. J.-C."
    - "Quand Josué mit en déroute les cinq rois amoréens à Gabaon et les poursuivit dans la descente de Beth-Horon, « l’Éternel fit tomber du ciel sur eux de grosses pierres jusqu’à Azéka ». Josué range Azéka dans le district de Juda de la Shéphéla avec Jarmuth, Adullam et Soco. Les Philistins, avec Goliath parmi eux, « campèrent entre Soco et Azéka, à Éphès-Dammim » pour la bataille de la vallée d’Éla ; Roboam fortifia la ville parmi les places fortes de Juda, et après l’exil des hommes de Juda s’y établirent de nouveau, « à Azéka et dans les lieux de son ressort »."
    - "Azéka se trouvait sur la route des envahisseurs. Un texte assyrien fragmentaire, généralement attribué à la campagne de Sanchérib en 701 av. J.-C., décrit le siège d’Azéka, posée sur une crête de montagne comme des poignards pointus, et sa prise par des rampes et des béliers. En 588 av. J.-C., tandis que l’armée de Nebucadnetsar se resserrait sur Jérusalem, Jérémie nota que Lakis et Azéka tenaient seules, « car c’étaient des villes fortes qui restaient parmi les villes de Juda » ; un des ostraca trouvés dans la porte de Lakis, lettre d’un avant-poste, dit que ses hommes guettent les signaux de feu de Lakis parce qu’ils ne voient plus Azéka. Eusèbe connaissait Azeca comme un village entre Éleuthéropolis et Jérusalem."
    - "Aujourd’hui Tel Azekah se trouve en Israël, dans le parc britannique près du moshav de Zekharia, avec vue sur la vallée d’Éla ; la fouille se poursuit chaque été."
  it:
    - "Azeka era una città fortificata di Giuda nella Sefela, le pendici tra la regione collinosa e la pianura filistea. Il suo sito, Tel Azekah (Tell Zakariya), è un ripido tell sopra la Valle del Terebinto, a circa 30 km a sud-ovest di Gerusalemme, sulla strada che saliva dalla costa verso Ebron e Betlemme. Il tell fu scavato per la prima volta da Bliss e Macalister per il Palestine Exploration Fund nel 1898–1899, e dal 2012 da una spedizione congiunta delle università di Tel Aviv e di Heidelberg, che ha trovato sotto la città giudaita una grande città cananea del Bronzo Tardo, distrutta dal fuoco intorno al 1130 a.C."
    - "Quando Giosuè mise in rotta i cinque re amorei a Gabaon e li inseguì giù per il passo di Bet-Oron, «l’Eterno fe’ cader dal cielo su loro delle grosse pietre fino ad Azeka». Giosuè elenca Azeka nel distretto della Sefela di Giuda con Iarmut, Adullam e Soco. I Filistei, con Golia fra loro, «si accamparono fra Soco e Azeka, a Efes-Dammim» per la battaglia nella valle del Terebinto; Roboamo fortificò la città fra le roccaforti di Giuda, e dopo l’esilio gli uomini di Giuda si stabilirono di nuovo «in Azeka e ne’ luoghi che ne dipendevano»."
    - "Azeka sorgeva sulla via degli invasori. Un testo assiro frammentario, generalmente attribuito alla campagna di Sennacherib del 701 a.C., descrive l’assedio di Azeka, posta su una cresta montuosa come pugnali appuntiti, e la sua conquista con rampe e arieti. Nel 588 a.C., mentre l’esercito di Nabucodonosor si stringeva su Gerusalemme, Geremia notò che Lachis e Azeka resistevano da sole, «ch’eran tutto quello che rimaneva, in fatto di città fortificate, fra le città di Giuda»; uno degli ostraca trovati nella porta di Lachis, una lettera da un avamposto, dice che i suoi uomini stanno cercando i segnali di fuoco di Lachis perché non possono più vedere Azeka. Eusebio conosceva Azeca come un villaggio tra Eleuteropoli e Gerusalemme."
    - "Oggi Tel Azekah si trova in Israele, nel Parco britannico presso il moshav di Zekharia, con vista sulla Valle del Terebinto; lo scavo continua ogni estate."
  pl:
    - "Azeka było obwarowanym miastem Judy w Szefeli, podgórzu między krainą górską a równiną filistyńską. Jego miejsce, Tel Azeka (Tell Zakariya), to stromy tell nad doliną Ela, około 30 km na południowy zachód od Jerozolimy, przy drodze wspinającej się od wybrzeża ku Hebronowi i Betlejem. Tell po raz pierwszy kopali Bliss i Macalister dla Palestine Exploration Fund w latach 1898–1899, a od 2012 roku wspólna wyprawa uniwersytetów w Tel Awiwie i Heidelbergu, która pod miastem judzkim odkryła wielkie kananejskie miasto z późnej epoki brązu, zniszczone ogniem około 1130 r. p.n.e."
    - "Gdy Jozue rozgromił pięciu królów amorejskich pod Gibeonem i gonił ich w dół przełęczą Bet-Choron, „Pan spuścił na nie kamienie wielkie z nieba aż do Aseka”. Jozue zalicza Azekę do okręgu Szefeli w Judzie razem z Jarmutem, Adullam i Soko. Filistyni, a wśród nich Goliat, „położyli się obozem między Sochotem i między Asekiem na granicach Domim” do bitwy w dolinie Ela; Roboam obwarował miasto wśród twierdz Judy, a po wygnaniu mieszkańcy Judy osiedlili się znów „w Aseku i we wsiach jego”."
    - "Azeka leżała na drodze najeźdźców. Fragmentaryczny tekst asyryjski, zwykle przypisywany kampanii Sennacheryba z 701 r. p.n.e., opisuje oblężenie Azeki, położonej na grzbiecie górskim jak ostre sztylety, i jej zdobycie rampami i taranami. W 588 r. p.n.e., gdy wojsko Nabuchodonozora zamykało pierścień wokół Jerozolimy, Jeremiasz zanotował, że tylko Lakisz i Azeka się trzymały, „albowiem te były pozostały z miast Judzkich miasta obronne”; jeden z ostraków znalezionych w bramie Lakisz, list z placówki, mówi, że jej ludzie wypatrują sygnałów ogniowych Lakisz, bo nie widzą już Azeki. Euzebiusz znał Azekę (Azeca) jako wieś między Eleuteropolis a Jerozolimą."
    - "Dziś Tel Azeka leży w Izraelu, w Parku Brytyjskim koło moszawu Zekharia, z widokiem na dolinę Ela; wykopaliska trwają co lato."
  nl:
    - "Azeka was een versterkte stad van Juda in de Sefela, de voorheuvels tussen het bergland en de Filistijnse vlakte. Haar plaats, Tel Azeka (Tell Zakariya), is een steile heuvel boven het Dal van Ela, zo’n 30 km ten zuidwesten van Jeruzalem, aan de weg die van de kust omhoog naar Hebron en Bethlehem klom. De heuvel werd voor het eerst opgegraven door Bliss en Macalister voor de Palestine Exploration Fund in 1898–1899, en sinds 2012 door een gezamenlijke expeditie van de universiteiten van Tel Aviv en Heidelberg, die onder de Judese stad een grote Kanaänitische stad uit de late bronstijd vond, omstreeks 1130 v.Chr. door brand verwoest."
    - "Toen Jozua de vijf Amorietische koningen bij Gibeon versloeg en door de pas van Beth-Horon achtervolgde, “wierp de HEERE grote stenen op hen van den hemel, tot Azeka toe”. Jozua noemt Azeka in het district van Juda in de Sefela met Jarmut, Adullam en Socho. De Filistijnen, met Goliat onder hen, “legerden zich tussen Socho en tussen Azeka, aan het einde van Dammim” voor de strijd in het Dal van Ela; Rehabeam versterkte de stad onder de vestingen van Juda, en na de ballingschap vestigden mannen van Juda zich weer in “Azeka en haar onderhorige plaatsen”."
    - "Azeka lag aan de weg van indringers. Een fragmentarische Assyrische tekst, gewoonlijk toegeschreven aan Sanheribs veldtocht van 701 v.Chr., beschrijft het beleg van Azeka, op een bergkam als puntige dolken gelegen, en de inname met hellingen en stormrammen. In 588 v.Chr., toen Nebukadnessars leger op Jeruzalem aanrukte, merkte Jeremia op dat alleen Lachis en Azeka standhielden, “want deze, zijnde vaste steden, waren overgebleven onder de steden van Juda”; een van de ostraca uit de poort van Lachis, een brief van een buitenpost, zegt dat zijn mannen naar de vuursignalen van Lachis uitkijken omdat zij Azeka niet meer kunnen zien. Eusebius kende Azeca als een dorp tussen Eleutheropolis en Jeruzalem."
    - "Tegenwoordig ligt Tel Azeka in Israël, in het Britse Park bij de moshav Zekharia, met uitzicht over het Dal van Ela; de opgraving gaat elke zomer door."
  cs:
    - "Azeka byla opevněné město Judy v Šefele, pahorkatině mezi horským krajem a pelištejskou pláni. Její místo, Tel Azeka (Tell Zakariya), je příkrý pahorek nad Élským údolím, asi 30 km jihozápadně od Jeruzaléma, na cestě, která stoupala od pobřeží k Hebronu a Betlému. Pahorek poprvé vykopávali Bliss a Macalister pro Palestine Exploration Fund v letech 1898–1899 a od roku 2012 společná expedice univerzit v Tel Avivu a Heidelbergu, která pod judským městem našla velké kenaanské město pozdní doby bronzové, zničené ohněm kolem roku 1130 př. n. l."
    - "Když Jozue rozprášil pět amorejských králů u Gibeonu a honil je průsmykem Bét-choronu, Hospodin „metal na ně kamení veliké s nebe, až k Azeku“. Jozue uvádí Azeku v šefelském okrsku Judy s Jarmutem, Adulamem a Sókó. Pelištejci, mezi nimi Goliáš, k bitvě v Élském údolí „položili se mezi Socho a Azeka na pomezí Dammim“; Rechabeám Azeku opevnil mezi judskými pevnostmi a po vyhnanství se judští muži usadili opět „v Azeka a vesnicích jeho“."
    - "Azeka stála na cestě útočníků. Zlomkovitý asyrský text, obecně připisovaný Senacheribovu tažení roku 701 př. n. l., popisuje obléhání Azeky, položené na horském hřebeni jako ostré dýky, a její dobytí valy a berany. V roce 588 př. n. l., když se vojsko Nebukadnesarovo stahovalo kolem Jeruzaléma, Jeremjáš poznamenal, že vzdorují jen Lachiš a Azeka, „nebo ta byla pozůstala z měst Judských města hrazená“; jedno z ostrak nalezených v bráně Lachiše, dopis z předsunuté stráže, praví, že její muži vyhlížejí ohňové signály Lachiše, protože už nevidí Azeku. Eusebios znal Azeku jako vesnici mezi Eleutheropolí a Jeruzalémem."
    - "Dnes leží Tel Azeka v Izraeli, v Britském parku poblíž mošavu Zekharia, s výhledem do Élského údolí; vykopávky pokračují každé léto."
