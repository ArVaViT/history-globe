# Overview article (ADR 0007). Mainstream facts only; Ezekiel 30:5, where the versions differ, is explained.
id: arabia
place: a59f6f5
title:
  en: "Arabia"
  ru: "Аравия"
  uk: "Аравія"
  es: "Arabia"
  pt: "Arábia"
  de: "Arabien"
  fr: "Arabie"
  it: "Arabia"
  pl: "Arabia"
  nl: "Arabië"
  cs: "Arábie"
  sv: "Arabien"
body:
  en:
    - "In the Old Testament Arabia is less a country than the steppe and desert east and south of the settled land, and its people. Solomon's gold came in part from “all the kings of Arabia” along with the spice merchants; the Arabians brought Jehoshaphat flocks of rams and goats, and later raided Judah. Isaiah's “burden upon Arabia” speaks to the caravans of Dedan hiding in the scrub and to Tema bringing water to fugitives; Jeremiah's cup of wrath goes to “all the kings of Arabia, and all the kings of the mingled people that dwell in the desert”; Ezekiel names “Arabia, and all the princes of Kedar” among Tyre's traders in lambs and goats. Geshem the Arabian mocked Nehemiah's wall."
    - "In Ezekiel 30:5 the same Hebrew letters are read as Arabia by some translators and as “mingled people” by the King James and Synodal versions. Outside the Bible, Assyrian records from 853 BC, when Gindibu the Arab brought a thousand camels to Qarqar, name Arab kings and queens, and Nabonidus of Babylon spent ten years at Tema in the oasis country."
    - "Greek writers divided Arabia into the fertile south, the desert and, later, Arabia Petraea about Petra. Herodotus described its frankincense; the Nabataeans built a trading kingdom from Petra that lasted until Trajan made it the Roman province of Arabia in AD 106, with its capital at Bostra. In the New Testament Arabians hear the apostles at Pentecost; Paul after his conversion “went into Arabia, and returned again unto Damascus”, that is, into the Nabataean kingdom of Aretas IV, whose governor later tried to arrest him; and he writes of “mount Sinai in Arabia”."
    - "In the seventh century the Arabian Peninsula became the cradle of Islam. Today it holds Saudi Arabia, Yemen, Oman, the Emirates, Qatar, Bahrain and Kuwait; the old caravan cities of the Bible's Arabia, Tema (Tayma) and Dedan (al-Ula), are being excavated, and the Nabataean tombs of Hegra near al-Ula were inscribed by UNESCO in 2008."
  ru:
    - "В Ветхом Завете Аравия — не столько страна, сколько степь и пустыня к востоку и югу от населённой земли и её народ. Золото Соломону шло, среди прочего, «от всех царей Аравийских» и от купцов благовоний; Аравитяне пригоняли Иосафату стада овнов и козлов, а позже разоряли Иудею. «Пророчество об Аравии» у Исаии обращено к караванам Деданским, укрывающимся в лесу, и к Фемайцам, несущим воду беглецам; чаша гнева у Иеремии достаётся всем царям Аравии и царям народов разноплеменных, живущих в пустыне; Иезекииль называет Аравию и всех князей Кидарских среди торговцев Тира ягнятами и козлами. Гешем Аравитянин насмехался над стеной Неемии."
    - "В Иез. 30:5 те же еврейские буквы одни переводчики читают как Аравия, а перевод Короля Иакова и Синодальный — как «смешанный народ». Вне Библии ассирийские записи с 853 г. до н. э., когда Гиндибу Араб привёл к Каркару тысячу верблюдов, называют арабских царей и цариц, а Набонид Вавилонский провёл десять лет в Феме среди оазисов."
    - "Греческие писатели делили Аравию на плодородный юг, пустыню и, позже, Каменистую Аравию вокруг Петры. Геродот описал её ладан; Набатеи построили из Петры торговое царство, просуществовавшее до того, как Траян в 106 г. н. э. сделал его римской провинцией Аравия со столицей в Бостре. В Новом Завете аравитяне слышат апостолов в день Пятидесятницы; Павел после обращения «пошел в Аравию и опять возвратился в Дамаск», то есть в Набатейское царство Ареты IV, чей наместник позже пытался его схватить; и он пишет, что «Агарь означает гору Синай в Аравии»."
    - "В VII веке Аравийский полуостров стал колыбелью ислама. Сегодня на нём Саудовская Аравия, Йемен, Оман, Эмираты, Катар, Бахрейн и Кувейт; старые караванные города библейской Аравии — Фема (Тайма) и Дедан (Эль-Ула) — раскапываются, а набатейские гробницы Хегры близ Эль-Улы в 2008 году внесены в список ЮНЕСКО."
  uk:
    - "У Старому Завіті Аравія — це радше не країна, а степ і пустеля на схід і південь від осілої землі, та її народ. Золото Соломонові приносили, поміж іншими, торговці прянощами та «всї царі Арабські»; араби привели Йосафатові отари баранів і козлів, а пізніше нападали на Юду. Ісаїн «Слово пророче про Арабію» звертається до караванів Дедану, що ховаються в хащах, і до Теми, що несе воду втікачам; чаша гніву Єремії йде до «царів Арабійських і царів у народів мішаних, що кочують у пустинї»; Єзекіїль називає серед торговців Тіру ягнятами й козлами: «Арабія й усї князї Кедарські». Гешем Араб глузував з Неемієвого муру."
    - "У Єзекіїля 30:5 ті самі єврейські літери одні перекладачі читають як Аравію, а переклади короля Якова й Синодальний — як «помішаний нарід». Поза Біблією ассирійські записи від 853 р. до н. е., коли Гіндібу Араб привів тисячу верблюдів до Каркара, називають арабських царів і цариць, а вавилонський Набонід провів десять років у Темі в краю оаз."
    - "Грецькі автори ділили Аравію на родючий південь, пустелю і пізніше Аравію Петрейську навколо Петри. Геродот описував її ладан; набатеї збудували з Петри торговельне царство, що тривало, поки Траян не зробив його римською провінцією Аравія в 106 р. н. е. зі столицею в Бострі. У Новому Завіті араби слухають апостолів у П'ятидесятницю; Павло після навернення «пійшов у Аравию, та й знов вернувсь у Дамаск», тобто в набатейське царство Арети IV, чий намісник пізніше намагався його схопити; і він пише про «Синай, гора в Аравиї»."
    - "У VII столітті Аравійський півострів став колискою ісламу. Нині тут Саудівська Аравія, Ємен, Оман, Емірати, Катар, Бахрейн і Кувейт; давні караванні міста біблійної Аравії — Тема (Тайма) і Дедан (Аль-Ула) — розкопують, а набатейські гробниці Хегри біля Аль-Ули ЮНЕСКО внесла до списку 2008 року."
  es:
    - "En el Antiguo Testamento Arabia es menos un país que la estepa y el desierto al este y al sur de la tierra poblada, y su gente. El oro de Salomón procedía en parte de «todos los reyes de Arabia», junto con los mercaderes de especias; los árabes llevaron a Josafat rebaños de carneros y de machos cabríos, y más tarde asaltaron Judá. La «carga sobre Arabia» de Isaías se dirige a las caravanas de Dedán escondidas en la maleza y a Tema, que lleva agua a los fugitivos; la copa de ira de Jeremías va a «todos los reyes de Arabia, y á todos los reyes de pueblos mezclados que habitan en el desierto»; Ezequiel nombra «Arabia y todos los príncipes de Cedar» entre los mercaderes de Tiro en corderos y machos cabríos. Gesem el árabe se burló de la muralla de Nehemías."
    - "En Ezequiel 30:5 las mismas letras hebreas son leídas como Arabia por algunos traductores y como «todo el conjunto de pueblo» por la Reina-Valera y por las versiones del rey Jacobo y sinodal. Fuera de la Biblia, los registros asirios desde 853 a. C., cuando Gindibu el árabe llevó mil camellos a Qarqar, nombran reyes y reinas árabes, y Nabónido de Babilonia pasó diez años en Tema, en la región de los oasis."
    - "Los escritores griegos dividieron Arabia en el sur fértil, el desierto y, más tarde, Arabia Pétrea en torno a Petra. Heródoto describió su incienso; los nabateos construyeron un reino comercial desde Petra que duró hasta que Trajano lo convirtió en la provincia romana de Arabia en 106 d. C., con capital en Bosra. En el Nuevo Testamento, árabes oyen a los apóstoles en Pentecostés; Pablo, tras su conversión, «me fuí á la Arabia, y volví de nuevo á Damasco», es decir, al reino nabateo de Aretas IV, cuyo gobernador intentó más tarde detenerlo; y escribe sobre «un monte de Arabia»."
    - "En el siglo VII la península arábiga se convirtió en la cuna del islam. Hoy comprende Arabia Saudita, Yemen, Omán, los Emiratos, Catar, Baréin y Kuwait; las antiguas ciudades caravaneras de la Arabia de la Biblia, Tema (Tayma) y Dedán (al-Ula), están siendo excavadas, y las tumbas nabateas de Hegra, cerca de al-Ula, fueron inscritas por la UNESCO en 2008."
  pt:
    - "No Antigo Testamento, a Arábia é menos um país que a estepe e o deserto a leste e ao sul da terra povoada, e o seu povo. O ouro de Salomão vinha em parte de “Todos os reis da Arábia”, juntamente com os mercadores de especiarias; os árabes trouxeram a Josafá rebanhos de carneiros e bodes, e mais tarde invadiram Judá. O “peso sobre a Arábia”, de Isaías, fala às caravanas de Dedã escondidas nos matagais e a Temá levando água aos fugitivos; o cálice da ira, em Jeremias, vai a “todos os reis da Arábia, todos os reis da mistura de povos que habitam no deserto”; Ezequiel nomeia “A Arábia e todos os príncipes de Quedar” entre os negociantes de cordeiros e bodes de Tiro. Gesém, o árabe, zombou da muralha de Neemias."
    - "Em Ezequiel 30:5 as mesmas letras hebraicas são lidas como Arábia por alguns tradutores e como “mistura de povos” pelas versões King James e sinodal. Fora da Bíblia, registros assírios de 853 a.C., quando Gindibu, o árabe, levou mil camelos a Qarqar, nomeiam reis e rainhas árabes, e Nabonido da Babilônia passou dez anos em Temá, na terra dos oásis."
    - "Escritores gregos dividiam a Arábia no sul fértil, no deserto e, mais tarde, na Arábia Pétrea em torno de Petra. Heródoto descreveu o seu incenso; os nabateus construíram um reino comercial a partir de Petra que durou até Trajano fazer dele a província romana da Arábia em 106 d.C., com capital em Bostra. No Novo Testamento, árabes ouvem os apóstolos em Pentecostes; Paulo, depois da conversão, diz: “parti para a Arábia. Depois, retornei a Damasco”, isto é, ao reino nabateu de Aretas IV, cujo governador tentou depois prendê-lo; e escreve do “monte Sinai, na Arábia”."
    - "No século VII a península Arábica tornou-se o berço do islã. Hoje abriga a Arábia Saudita, o Iêmen, Omã, os Emirados, o Catar, o Bahrein e o Kuwait; as antigas cidades de caravanas da Arábia bíblica, Temá (Tayma) e Dedã (al-Ula), estão sendo escavadas, e os túmulos nabateus de Hegra, perto de al-Ula, foram inscritos pela UNESCO em 2008."
  de:
    - "Im Alten Testament ist Arabien weniger ein Land als die Steppe und Wüste östlich und südlich des besiedelten Landes und ihr Volk. Salomos Gold kam teils „von allen Königen Arabiens“ zusammen mit den Gewürzhändlern; die Araber brachten Josaphat Herden von Widdern und Böcken und fielen später in Juda ein. Jesajas „Last über Arabien“ gilt den Karawanen der Dedaniter, die sich im Gestrüpp verbergen, und Tema, das Flüchtlingen Wasser bringt; Jeremias Zornbecher geht an „allen Königen in Arabien, allen Königen gegen Abend, die in der Wüste wohnen“; Hesekiel nennt „Arabien und alle Fürsten von Kedar“ unter Tyrus' Händlern mit Lämmern und Böcken. Geschem, der Araber, verspottete Nehemias Mauer."
    - "In Hesekiel 30,5 werden dieselben hebräischen Buchstaben von manchen Übersetzern als Arabien gelesen, in der King-James- und der Synodalbibel als „allerlei Volk“. Außerhalb der Bibel nennen assyrische Aufzeichnungen seit 853 v. Chr., als Gindibu der Araber tausend Kamele nach Qarqar brachte, arabische Könige und Königinnen, und Nabonid von Babylon verbrachte zehn Jahre in Tema im Oasenland."
    - "Griechische Autoren teilten Arabien in den fruchtbaren Süden, die Wüste und später Arabia Petraea um Petra. Herodot beschrieb seinen Weihrauch; die Nabatäer bauten von Petra aus ein Handelskönigreich auf, das bestand, bis Trajan es 106 n. Chr. zur römischen Provinz Arabien mit der Hauptstadt Bostra machte. Im Neuen Testament hören Araber die Apostel zu Pfingsten; Paulus „zog hin nach Arabien und kam wiederum gen Damaskus“ nach seiner Bekehrung, das heißt ins Nabatäerreich des Aretas IV., dessen Statthalter später versuchte, ihn festzunehmen; und er schreibt: „Hagar heißt in Arabien der Berg Sinai“."
    - "Im 7. Jahrhundert wurde die Arabische Halbinsel die Wiege des Islam. Heute liegen dort Saudi-Arabien, Jemen, Oman, die Emirate, Katar, Bahrain und Kuwait; die alten Karawanenstädte des biblischen Arabien, Tema (Tayma) und Dedan (al-Ula), werden ausgegraben, und die nabatäischen Gräber von Hegra bei al-Ula wurden 2008 von der UNESCO in die Welterbeliste eingetragen."
  fr:
    - "Dans l’Ancien Testament, l’Arabie est moins un pays que la steppe et le désert à l’est et au sud du pays habité, avec son peuple. L’or de Salomon venait en partie de « tous les rois d’Arabie », avec les marchands d’épices ; les Arabes apportèrent à Josaphat des troupeaux de béliers et de boucs, et plus tard razzièrent Juda. L’« Oracle sur l’Arabie » d’Ésaïe s’adresse aux caravanes de Dedan cachées dans les broussailles et à Théma qui porte de l’eau aux fugitifs ; la coupe de colère de Jérémie va à « tous les rois d’Arabie, et… tous les rois des Arabes qui habitent dans le désert » ; Ézéchiel nomme « l’Arabie et tous les princes de Kédar » parmi les marchands d’agneaux et de boucs de Tyr. Guéschem l’Arabe se moqua du mur de Néhémie."
    - "En Ézéchiel 30, 5, les mêmes lettres hébraïques sont lues « Arabie » par certains traducteurs et « peuple mêlé » par les versions King James et synodale. Hors de la Bible, des annales assyriennes dès 853 av. J.-C., quand Gindibu l’Arabe amena mille chameaux à Qarqar, nomment des rois et des reines arabes, et Nabonide de Babylone passa dix ans à Théma, en pays d’oasis."
    - "Les auteurs grecs divisaient l’Arabie en un sud fertile, le désert et, plus tard, l’Arabie pétrée autour de Pétra. Hérodote décrivit son encens ; les Nabatéens bâtirent depuis Pétra un royaume marchand qui dura jusqu’à ce que Trajan en fît la province romaine d’Arabie en 106 apr. J.-C., avec Bostra pour capitale. Dans le Nouveau Testament, des Arabes entendent les apôtres à la Pentecôte ; Paul après sa conversion dit : « je partis pour l’Arabie. Puis je revins encore à Damas », c’est-à-dire dans le royaume nabatéen d’Arétas IV, dont le gouverneur tenta plus tard de l’arrêter ; et il écrit « le mont Sinaï en Arabie »."
    - "Au VIIe siècle, la péninsule arabique devint le berceau de l’islam. Elle comprend aujourd’hui l’Arabie saoudite, le Yémen, Oman, les Émirats, le Qatar, Bahreïn et le Koweït ; les anciennes villes caravanières de l’Arabie biblique, Théma (Tayma) et Dedan (al-Ula), sont en cours de fouille, et les tombes nabatéennes de Hégra, près d’al-Ula, furent inscrites par l’UNESCO en 2008."
  it:
    - "Nell’Antico Testamento l’Arabia è meno un paese che la steppa e il deserto a est e a sud della terra abitata, e il suo popolo. L’oro di Salomone proveniva in parte da «tutti i re d’Arabia» insieme ai mercanti di spezie; gli Arabi portarono a Giosafat greggi di montoni e capri, e più tardi razziarono Giuda. L’«Oracolo contro l’Arabia» di Isaia parla alle carovane dei Dedaniti nascoste nei boschi e a Tema che porta acqua ai fuggiaschi; la coppa dell’ira di Geremia va a «tutti i re d’Arabia, e a tutti i re della mescolanza di popoli che abita nel deserto»; Ezechiele nomina «L’Arabia e tutti i principi di Kedar» fra i mercanti di Tiro in agnelli e capri. Geshem l’Arabo derise le mura di Neemia."
    - "In Ezechiele 30,5 le stesse lettere ebraiche sono lette come Arabia da alcuni traduttori e come «gente mista» dalle versioni King James e sinodale. Fuori dalla Bibbia, le cronache assire dall’853 a.C., quando Gindibu l’Arabo portò mille cammelli a Qarqar, nominano re e regine arabi, e Nabonedo di Babilonia trascorse dieci anni a Tema, nella regione delle oasi."
    - "Gli scrittori greci divisero l’Arabia nel sud fertile, nel deserto e, più tardi, nell’Arabia Petraea intorno a Petra. Erodoto ne descrisse l’incenso; i Nabatei costruirono da Petra un regno commerciale che durò fino a quando Traiano ne fece la provincia romana d’Arabia nel 106 d.C., con capitale a Bostra. Nel Nuovo Testamento gli Arabi ascoltano gli apostoli a Pentecoste; Paolo dopo la conversione «me ne andai in Arabia; quindi tornai di nuovo a Damasco», cioè nel regno nabateo di Areta IV, il cui governatore tentò poi di arrestarlo; e scrive del «monte Sinai in Arabia»."
    - "Nel VII secolo la penisola araba divenne la culla dell’islam. Oggi comprende Arabia Saudita, Yemen, Oman, Emirati, Qatar, Bahrein e Kuwait; le antiche città carovaniere dell’Arabia biblica, Tema (Tayma) e Dedan (al-Ula), sono in corso di scavo, e le tombe nabatee di Hegra presso al-Ula furono iscritte dall’UNESCO nel 2008."
  pl:
    - "W Starym Testamencie Arabia jest raczej stepem i pustynią na wschód i południe od ziemi zasiedlonej, wraz z jej ludem, niż krajem. Złoto Salomona pochodziło po części od „wszystkich królów Arabskich” obok kupców korzennych; Arabowie przynieśli Jozafatowi trzody baranów i kozłów, a później najeżdżali Judę. „Brzemię na Arabiję” Izajasza przemawia do karawan Dedanu kryjących się w zaroślach i do Temy niosącej wodę zbiegom; kielich gniewu Jeremiasza trafia do „wszystkich królów Arabskich, i wszystkich królów tego pospólstwa, które mieszka na puszczy”; Ezechiel wymienia wśród kupców Tyru, handlujących jagniętami i kozłami, „Arabczycy, i wszyscy książęta Kedarscy”. Geszem Arab szydził z muru Nehemiasza."
    - "W Ez 30,5 te same litery hebrajskie niektórzy tłumacze czytają jako Arabia, a Biblia króla Jakuba i synodalna jako „lud mieszany”. Poza Biblią zapisy asyryjskie od 853 r. p.n.e., gdy Arab Gindibu przywiódł tysiąc wielbłądów pod Qarqar, wymieniają arabskich królów i królowe, a Nabonid z Babilonu spędził dziesięć lat w Temie w krainie oaz."
    - "Pisarze greccy dzielili Arabię na żyzne południe, pustynię i, później, Arabię Petrejską wokół Petry. Herodot opisał jej kadzidło; Nabatejczycy zbudowali z Petry królestwo handlowe, które trwało, aż Trajan uczynił z niego w 106 r. n.e. rzymską prowincję Arabię ze stolicą w Bostrze. W Nowym Testamencie Arabowie słyszą apostołów w dniu Pięćdziesiątnicy; Paweł po nawróceniu, jak pisze, „alem szedł do Arabii i wróciłem się zasię do Damaszku”, to znaczy do królestwa nabatejskiego Aretasa IV, którego namiestnik próbował go później pojmać; pisze też: „Agar jest góra Synaj w Arabii”."
    - "W VII wieku Półwysep Arabski stał się kolebką islamu. Dziś mieszczą się na nim Arabia Saudyjska, Jemen, Oman, Emiraty, Katar, Bahrajn i Kuwejt; dawne karawanowe miasta biblijnej Arabii, Tema (Tajma) i Dedan (al-Ula), są wykopywane, a nabatejskie grobowce Hegry koło al-Ula wpisano na listę UNESCO w 2008 roku."
  nl:
    - "In het Oude Testament is Arabië minder een land dan de steppe en woestijn ten oosten en zuiden van het bewoonde land, en haar volk. Salomo’s goud kwam deels van “alle koningen van Arabië” naast de kruidenhandelaars; de Arabieren brachten Josafat kudden rammen en bokken, en plunderden later Juda. Jesaja’s “last tegen Arabië” spreekt tot de karavanen van Dedan die zich in het struikgewas verbergen en tot Tema dat water brengt aan vluchtelingen; Jeremia’s beker van gramschap gaat naar “allen koningen van Arabië; en allen koningen des gemengden hoops, die in de woestijn wonen”; Ezechiël noemt “Arabië en alle vorsten van Kedar” onder Tyrus’ handelaars in lammeren en bokken. Gesem de Arabier bespotte Nehemia’s muur."
    - "In Ezechiël 30:5 worden dezelfde Hebreeuwse letters door sommige vertalers als Arabië gelezen en door de King James en de Synodale vertaling als “mingled people”. Buiten de Bijbel noemen Assyrische annalen vanaf 853 v.Chr., toen Gindibu de Arabier duizend kamelen naar Qarqar bracht, Arabische koningen en koninginnen, en Nabonidus van Babylon bracht tien jaar door te Tema in het oasegebied."
    - "Griekse schrijvers verdeelden Arabië in het vruchtbare zuiden, de woestijn en later Arabia Petraea rond Petra. Herodotus beschreef zijn wierook; de Nabateeërs bouwden vanuit Petra een handelsrijk dat standhield tot Trajanus er in 106 n.Chr. de Romeinse provincie Arabië van maakte, met Bostra als hoofdstad. In het Nieuwe Testament horen Arabieren de apostelen met Pinksteren; Paulus “ging henen naar Arabië, en keerde wederom naar Damaskus” na zijn bekering, dat wil zeggen naar het Nabateese koninkrijk van Aretas IV, wiens landvoogd hem later probeerde te arresteren; en hij schrijft over “Sina, een berg in Arabië”."
    - "In de zevende eeuw werd het Arabische Schiereiland de bakermat van de islam. Tegenwoordig omvat het Saoedi-Arabië, Jemen, Oman, de Emiraten, Qatar, Bahrein en Koeweit; de oude karavaansteden van het Arabië van de Bijbel, Tema (Tayma) en Dedan (al-Ula), worden opgegraven, en de Nabateese graven van Hegra bij al-Ula werden in 2008 door UNESCO ingeschreven."
  cs:
    - "Ve Starém zákoně je Arábie spíše stepí a pouští východně a jižně od osídlené země, a jejím lidem, než zemí. Šalomounovo zlato pocházelo zčásti „ode všech králů Arabských“ spolu s obchodníky s kořením; Arabové přihnali Jozafatovi stáda beranů a kozlů a později přepadali Judu. Izajášovo „Břímě na Arabii“ promlouvá ke karavanám Dedanských, které se ukrývají v křoví, a k Témě, která nosí vodu uprchlíkům; Jeremjášův kalich hněvu míří na „všecky krále Arabské, i všecky krále té směsice, kteříž bydlí na poušti“; Ezechiel jmenuje mezi týrskými obchodníky s jehňaty a kozami: „Arabští i všecka knížata Cedarská kupčívali tobě k ruce v beranech a skopcích i kozlích“. Gešem Arabský se posmíval Nehemjášově hradbě."
    - "V Ezechielovi 30,5 jsou táž hebrejská písmena čtena některými překladateli jako Arábie, ale jako „mingled people“, smíšený lid, v Bibli krále Jakuba a v synodálním překladu. Mimo Bibli jmenují asyrské záznamy z roku 853 př. n. l., kdy Gindibu Arab přivedl k Qarqaru tisíc velbloudů, arabské krále a královny a Nabonid Babylónský strávil deset let v Témě v oázové zemi."
    - "Řečtí spisovatelé dělili Arábii na úrodný jih, poušť a později Arabia Petraea kolem Petry. Hérodotos popsal její kadidlo; Nabatejci vybudovali z Petry obchodní království, které trvalo, dokud z něj Traianus roku 106 n. l. neučinil římskou provincii Arábii s hlavním městem Bostrou. V Novém zákoně Arabové slyší apoštoly o Letnicích; Pavel po svém obrácení, jak praví, „šel jsem do Arabie, přišel jsem pak zase do Damašku“, tedy do nabatejského království Aretase IV., jehož správce se jej později pokusil zatknout; a píše o „hoře Sinai v Arabii“."
    - "V 7. století se Arabský poloostrov stal kolébkou islámu. Dnes zahrnuje Saúdskou Arábii, Jemen, Omán, Emiráty, Katar, Bahrajn a Kuvajt; staré karavanní města biblické Arábie, Téma (Tayma) a Dedan (al-Ula), se vykopávají a nabatejské hrobky Hegry u al-Ula byly roku 2008 zapsány UNESCO."
  sv:
    - "I Gamla testamentet är Arabien mindre ett land än stäppen och öknen öster och söder om det bebodda landet, och dess folk. Salomos guld kom delvis från ”Arabiens alla konungar” jämte kryddhandlarna; araberna förde Josafat hjordar av baggar och bockar, och plundrade senare Juda. Jesajas ”utsaga över Arabien” talar till Dedans karavaner som gömmer sig i snåret och till Tema som för vatten till flyktingar; Jeremias vredesbägare går till ”alla konungar i Arabien och alla konungar över Erebs folk, som bo i öknen”; Hesekiel nämner ”Araberna och Kedars alla furstar” bland Tyros’ köpmän på lamm och bockar. Geshem araben hånade Nehemjas mur."
    - "I Hesekiel 30:5 läses samma hebreiska bokstäver som Arabien av vissa översättare och som ”blandat folk” av King James-översättningen och synodalbibeln. Utanför Bibeln nämner assyriska källor från 853 f.Kr., då Gindibu araben förde ett tusen kameler till Qarqar, arabiska kungar och drottningar, och Nabonid av Babylon tillbringade tio år i Tema i oaslandet."
    - "Grekiska författare delade Arabien i det bördiga södra, öknen och, senare, Arabia Petraea kring Petra. Herodotos beskrev dess rökelse; nabateerna byggde ett handelsrike från Petra som varade tills Trajanus gjorde det till den romerska provinsen Arabien år 106 e.Kr., med huvudstad i Bostra. I Nya testamentet hör araber apostlarna på pingsten; Paulus for efter sin omvändelse ”bort till Arabien och vände så åter tillbaka till Damaskus”, det vill säga till Aretas IV:s nabateiska rike, vars ståthållare senare försökte gripa honom; och han skriver att ”Berget Sina kallas nämligen i Arabien för Agar”."
    - "På 600-talet blev den arabiska halvön islams vagga. I dag rymmer den Saudiarabien, Jemen, Oman, Emiraten, Qatar, Bahrain och Kuwait; de gamla karavanstäderna i Bibelns Arabien, Tema (Tayma) och Dedan (al-Ula), grävs ut, och de nabateiska gravarna i Hegra nära al-Ula skrevs in av Unesco 2008."
