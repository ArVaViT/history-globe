# Overview article (ADR 0007). Mainstream facts only; the extent of Canaan in the ancient texts and the models of Israel's settlement are given as debated.
id: canaan
place: a581f0c
title:
  en: "Canaan"
  ru: "Ханаан"
  uk: "Ханаан"
  es: "Canaán"
  pt: "Canaã"
  de: "Kanaan"
  fr: "Canaan"
body:
  en:
    - 'Canaan is the name the Bible gives to the land west of the Jordan before Israel: "the border of the Canaanites was from Sidon, as thou comest to Gerar, unto Gaza". Numbers draws its bounds from the brook of Egypt and the wilderness of Zin in the south to the entrance of Hamath in the north, with the Jordan as the eastern limit. Outside the Bible the name appears perhaps as early as an eighteenth-century BC letter from Mari, then at Alalakh, in the Amarna letters of the fourteenth century, when Canaan was an Egyptian province, and on the stele of Merneptah about 1208 BC. Its meaning is uncertain; a link with purple dye has been proposed.'
    - 'Genesis counts Canaan among the sons of Ham, cursed by Noah, and lists his descendants from Sidon and Heth to the Jebusites and Amorites. Abram "went forth to go into the land of Canaan", and God promised it to his seed as "an everlasting possession". Jacob''s sons went down from it to Egypt, and Moses was sent to bring Israel up "unto a land flowing with milk and honey" held by seven nations "greater and mightier than thou". The spies found cities walled and very great, and the Canaanites "by the sea, and by the coast of Jordan". Joshua took the land, yet Judges admits that at Beth-shean, Megiddo and elsewhere "the Canaanites would dwell in that land", and that Israel put them to tribute "and did not utterly drive them out".'
    - "Archaeology shows Canaan in the Late Bronze Age as a land of city-states under Egypt, Hazor, Megiddo and Lachish among them, whose kings write to the pharaoh in the Amarna letters. The tablets of Ugarit, found from 1929, reveal the Canaanite gods, El, Baal, Asherah and Anat, against whom the prophets fought. Many of these cities were destroyed or declined around 1200 BC, and hundreds of small villages then appeared in the hill country. How Israel came to be there is debated: by conquest, by peaceful infiltration, by an uprising within Canaan, or as a people that grew out of the Canaanites themselves."
    - 'The Phoenicians long remained Canaanites in speech and name, and Augustine says that the Punic-speaking peasants near Hippo still called themselves Chanani. Isaiah foresees cities of Egypt speaking "the language of Canaan", and in Matthew "a woman of Canaan" from the coasts of Tyre and Sidon wins healing for her daughter; Paul at Antioch recalls the "seven nations in the land of Chanaan". The land of Canaan is today Israel, the Palestinian territories and Lebanon, with the edges of Syria and Jordan.'
  ru:
    - "Ханаан — имя, которым Библия называет землю к западу от Иордана до Израиля: «были пределы Хананеев от Сидона к Герару до Газы». Книга Чисел проводит её границы от потока Египетского и пустыни Син на юге до входа в Емаф на севере, с Иорданом как восточным пределом. Вне Библии имя встречается, возможно, уже в письме из Мари XVIII века до н. э., затем в Алалахе, в амарнских письмах XIV века, когда Ханаан был египетской провинцией, и на стеле Мернептаха около 1208 г. до н. э. Значение его неясно; предлагали связь с пурпурной краской."
    - "Книга Бытия числит Ханаана среди сынов Хама, проклятого Ноем, и перечисляет его потомков от Сидона и Хета до Иевусеев и Аморреев. Аврам вышел, «чтобы идти в землю Ханаанскую», и Бог обещал её его потомству «во владение вечное». Сыновья Иакова сошли оттуда в Египет, а Моисей был послан вывести Израиль «в землю хорошую и пространную, где течет молоко и мед», которой владели семь народов, «которые многочисленнее и сильнее тебя». Соглядатаи нашли города укреплённые, весьма большие, и Хананеев, живущих при море и на берегу Иордана. Иисус Навин взял землю, но книга Судей признаёт, что в Бефсане, Мегиддоне и других местах «остались Хананеи жить в земле сей» и что Израиль, придя в силу, сделал Хананеев данниками, «но изгнать не изгнал их»."
    - "Археология показывает Ханаан позднего бронзового века как страну городов-государств под властью Египта — среди них Асор, Мегиддон и Лахис, — чьи цари пишут фараону в амарнских письмах. Таблички Угарита, находимые с 1929 года, открывают ханаанских богов — Эла, Ваала, Ашеру и Анат, — с которыми боролись пророки. Многие из этих городов были разрушены или пришли в упадок около 1200 г. до н. э., и тогда в нагорье появились сотни малых селений. Как Израиль оказался там, спорно: завоеванием, мирным проникновением, восстанием внутри Ханаана или как народ, выросший из самих Хананеев."
    - "Финикийцы долго оставались Хананеями по языку и имени, и Августин говорит, что говорившие по-пунийски крестьяне под Гиппоном ещё называли себя Хананеями. Исаия предвидит города Египта, говорящие «языком Ханаанским», а у Матфея «женщина Хананеянка» из пределов Тира и Сидона вымаливает исцеление дочери; Павел в Антиохии вспоминает «семь народов в земле Ханаанской». Земля Ханаанская сегодня — это Израиль, палестинские территории и Ливан с краями Сирии и Иордании."
  uk:
    - "Ханаан — назва, яку Біблія дає землі на захід від Йордану до Ізраїлю: «займище Кананеїв сягало від Сидону до Герару, до Гази». Книга Чисел проводить її межі від Потоку Єгипетського та пустелі Сін на півдні до Входу в Хамат на півночі, а зі сходу її обмежує Йордан. Поза Біблією назва зустрічається, можливо, вже в листі XVIII ст. до н. е. з Марі, потім в Алалаху, в амарнських листах XIV ст., коли Ханаан був єгипетською провінцією, і на стелі Мернептаха близько 1208 р. до н. е. Її значення непевне; пропонували зв'язок із пурпуровим барвником."
    - "Книга Буття зараховує Ханаана до синів Хама, і Ной його проклинає; Буття перелічує його нащадків від Сідона й Хета до євусеїв та аморіїв. Аврам вийшов, «щоб ійти в землю Канаанську», і Бог пообіцяв її його насінню «на віковічню державу». Сини Якова зійшли з неї до Єгипту, а Мойсея було послано вивести Ізраїль «у землю текучу молоком і медом», яку тримали сім народів, «більших і потужніщих за тебе». Розвідники знайшли міста «утверджені … вельми великі», а ханаанців «над морем і здовж берегів Іорданських». Ісус Навин узяв землю, та Книга Суддів визнає, що в Бет-Шеані, Мегіддо й деінде «вдалось Канаанїям зістатись на житлї в цїй країнї» і що Ізраїль обклав їх даниною, «а повиганяти не повиганяв»."
    - "Археологія показує Ханаан доби пізньої бронзи як край міст-держав під владою Єгипту, серед них Гацор, Мегіддо й Лахіш, чиї царі пишуть фараонові в амарнських листах. Таблички з Угариту, знайдені від 1929 р., відкривають ханаанських богів — Ела, Ваала, Ашеру й Анат, проти яких боролися пророки. Багато цих міст було зруйновано або вони занепали близько 1200 р. до н. е., і тоді в горах з'явилися сотні невеликих сіл. Як Ізраїль опинився там, є предметом суперечки: завоюванням, мирним проникненням, повстанням усередині Ханаану чи як народ, що виріс із самих ханаанців."
    - "Фінікійці довго лишалися ханаанцями за мовою й назвою, і Августин каже, що пунійськомовні селяни поблизу Гіппона ще називали себе Chanani. Ісая бачить міста Єгипту, що говорять «мовою Канаанською», а в Матвія «жінка Канаанка» з околиць Тиру й Сидону здобуває зцілення для своєї дочки; Павло в Антіохії згадує «сїм народів у землї Канаанській». Земля Ханаан — це сьогодні Ізраїль, палестинські території та Ліван, із краями Сирії та Йорданії."
  es:
    - "Canaán es el nombre que da la Biblia a la tierra al oeste del Jordán antes de Israel: «el término de los Cananeos desde Sidón, viniendo á Gerar hasta Gaza». Números traza sus límites desde el torrente de Egipto y el desierto de Zin en el sur hasta la entrada de Hamat en el norte, con el Jordán como límite oriental. Fuera de la Biblia el nombre aparece quizá ya en una carta de Mari del siglo XVIII a. C., luego en Alalakh, en las cartas de Amarna del siglo XIV, cuando Canaán era una provincia egipcia, y en la estela de Mernepta hacia el 1208 a. C. Su significado es incierto; se ha propuesto una relación con el tinte púrpura."
    - "El Génesis cuenta a Canaán entre los hijos de Cam, maldecido por Noé, y enumera a sus descendientes desde Sidón y Het hasta los jebuseos y los amorreos. Abram y los suyos «salieron para ir á tierra de Canaán», y Dios la prometió a su descendencia «en heredad perpetua». Los hijos de Jacob bajaron desde allí a Egipto, y Moisés fue enviado para hacer subir a Israel «á tierra que fluye leche y miel» poseída por siete naciones «mayores y más fuertes que tú». Los espías hallaron «las ciudades muy grandes y fuertes», y a los cananeos «junto á la mar, y á la ribera del Jordán». Josué tomó la tierra, y sin embargo Jueces admite que en Betsán, Meguido y otros lugares «el Cananeo quiso habitar en esta tierra», y que Israel lo hizo tributario, «mas no lo echó»."
    - "La arqueología muestra a Canaán en la Edad del Bronce Tardío como una tierra de ciudades-estado bajo Egipto, entre ellas Hazor, Meguido y Laquis, cuyos reyes escriben al faraón en las cartas de Amarna. Las tablillas de Ugarit, halladas desde 1929, revelan los dioses cananeos, El, Baal, Asera y Anat, contra los que lucharon los profetas. Muchas de estas ciudades fueron destruidas o decayeron hacia el 1200 a. C., y entonces aparecieron cientos de pequeñas aldeas en la región montañosa. Cómo llegó Israel allí es objeto de debate: por conquista, por infiltración pacífica, por un levantamiento dentro de Canaán o como un pueblo surgido de los propios cananeos."
    - "Los fenicios siguieron siendo largo tiempo cananeos en lengua y en nombre, y Agustín dice que los campesinos de habla púnica cercanos a Hipona todavía se llamaban a sí mismos Chanani. Isaías prevé ciudades de Egipto que hablarán «la lengua de Canaán», y en Mateo «una mujer Cananea» de las comarcas de Tiro y Sidón obtiene la curación de su hija; Pablo, en Antioquía, recuerda las «siete naciones en la tierra de Canaán». La tierra de Canaán es hoy Israel, los territorios palestinos y el Líbano, con los bordes de Siria y Jordania."
  pt:
    - "Canaã é o nome que a Bíblia dá à terra a oeste do Jordão antes de Israel: “A fronteira dos cananeus ia desde Sidom — indo na direção de Gerar — até Gaza”. Números traça seus limites do ribeiro do Egito e do deserto de Zim, ao sul, até a entrada de Hamate, ao norte, com o Jordão como limite oriental. Fora da Bíblia, o nome aparece talvez já numa carta de Mari do século XVIII a.C., depois em Alalakh, nas cartas de Amarna do século XIV, quando Canaã era uma província egípcia, e na estela de Merneptá, por volta de 1208 a.C. Seu significado é incerto; propôs-se uma ligação com o corante púrpura."
    - "O Gênesis conta Canaã entre os filhos de Cam, amaldiçoado por Noé, e lista seus descendentes, de Sidom e Hete até os jebuseus e amorreus. Abrão saiu “para ir à terra de Canaã”, e Deus a prometeu à sua descendência “como posse perpétua”. Os filhos de Jacó desceram dela ao Egito, e Moisés foi enviado para fazer Israel subir “para uma terra que mana leite e mel”, ocupada por sete nações “maiores e mais poderosas do que você”. Os espias contaram que “as cidades são fortificadas e muito grandes” e os cananeus “junto ao mar e ao longo da margem do Jordão”. Josué tomou a terra, mas Juízes admite que em Bete-Seã, Megido e em outros lugares “os cananeus persistiram em habitar naquela terra”, e que Israel os sujeitou a trabalhos forçados, mas “não os expulsou totalmente”."
    - "A arqueologia mostra Canaã na Idade do Bronze Tardio como uma terra de cidades-estado sob o Egito, entre elas Hazor, Megido e Laquis, cujos reis escrevem ao faraó nas cartas de Amarna. As tabuinhas de Ugarit, achadas a partir de 1929, revelam os deuses cananeus, El, Baal, Aserá e Anate, contra quem os profetas lutaram. Muitas dessas cidades foram destruídas ou declinaram por volta de 1200 a.C., e centenas de pequenas aldeias surgiram então nas montanhas. Como Israel chegou a estar ali é debatido: por conquista, por infiltração pacífica, por uma revolta dentro de Canaã, ou como um povo surgido dos próprios cananeus."
    - "Os fenícios permaneceram por muito tempo cananeus na língua e no nome, e Agostinho diz que os camponeses de fala púnica perto de Hipona ainda se chamavam Chanani. Isaías prevê cidades do Egito falando “a língua de Canaã”, e em Mateus “uma mulher cananeia” das regiões de Tiro e Sidom obtém a cura da filha; Paulo, em Antioquia, recorda as “sete nações na terra de Canaã”. A terra de Canaã é hoje Israel, os territórios palestinos e o Líbano, com as bordas da Síria e da Jordânia."
  de:
    - "Kanaan ist der Name, den die Bibel dem Land westlich des Jordan vor Israel gibt: „Und ihre Grenzen waren von Sidon an durch Gerar bis gen Gaza“. Das Buch Numeri zieht seine Grenzen vom Bach Ägyptens und der Wüste Zin im Süden bis zum Eingang nach Hamat im Norden, mit dem Jordan als östlicher Grenze. Außerhalb der Bibel erscheint der Name vielleicht schon in einem Brief aus Mari des 18. Jahrhunderts v. Chr., dann in Alalach, in den Amarnabriefen des 14. Jahrhunderts, als Kanaan eine ägyptische Provinz war, und auf der Stele des Merenptah um 1208 v. Chr. Seine Bedeutung ist unsicher; ein Zusammenhang mit Purpurfarbstoff wurde vorgeschlagen."
    - "Die Genesis zählt Kanaan zu den Söhnen Hams, von Noah verflucht, und führt seine Nachkommen von Sidon und Heth bis zu den Jebusitern und Amoritern auf. Abram zog aus, „zu reisen in das Land Kanaan“, und Gott verhieß es seinem Samen „zu ewiger Besitzung“. Jakobs Söhne zogen von dort nach Ägypten hinab, und Mose wurde gesandt, Israel hinaufzuführen „in ein Land, darin Milch und Honig fließt“, das von sieben Völkern besetzt war, „die größer und stärker sind denn du“. Die Kundschafter fanden die Städte ummauert und sehr groß, und die Kanaaniter wohnten „am Meer und um den Jordan“. Josua nahm das Land, doch das Richterbuch räumt ein, dass in Bet-Schean, Megiddo und anderswo „die Kanaaniter blieben wohnen im Land“ und dass Israel sie zinsbar machte „und vertrieb sie nicht“."
    - "Die Archäologie zeigt Kanaan in der Späten Bronzezeit als ein Land von Stadtstaaten unter Ägypten, darunter Hazor, Megiddo und Lachisch, deren Könige in den Amarnabriefen an den Pharao schreiben. Die ab 1929 gefundenen Tafeln von Ugarit enthüllen die kanaanäischen Götter, El, Baal, Aschera und Anat, gegen die die Propheten kämpften. Viele dieser Städte wurden um 1200 v. Chr. zerstört oder verfielen, und im Bergland erschienen dann Hunderte kleiner Dörfer. Wie Israel dorthin kam, ist umstritten: durch Eroberung, durch friedliches Einsickern, durch einen Aufstand innerhalb Kanaans oder als ein Volk, das aus den Kanaanitern selbst hervorging."
    - "Die Phönizier blieben lange in Sprache und Namen Kanaaniter, und Augustinus sagt, die punisch sprechenden Bauern bei Hippo hätten sich noch immer Chanani genannt. Jesaja sieht Städte Ägyptens „nach der Sprache Kanaans“ reden, und bei Matthäus erlangt „ein kanaanäisches Weib“ aus der Gegend von Tyrus und Sidon Heilung für ihre Tochter; Paulus erinnert in Antiochia an die „sieben Völker in dem Lande Kanaan“. Das Land Kanaan ist heute Israel, die palästinensischen Gebiete und der Libanon, mit den Randgebieten Syriens und Jordaniens."
  fr:
    - "Canaan est le nom que la Bible donne au pays à l’ouest du Jourdain avant Israël : « Les limites des Cananéens allèrent depuis Sidon, du côté de Guérar, jusqu’à Gaza ». Les Nombres tracent ses limites depuis le Torrent d’Égypte et le désert de Tsin au sud jusqu’à l’Entrée de Hamath au nord, le Jourdain formant la limite orientale. Hors de la Bible, le nom apparaît peut-être dès une lettre de Mari du XVIIIe siècle av. J.-C., puis à Alalakh, dans les lettres d’Amarna du XIVe siècle, quand Canaan était une province égyptienne, et sur la stèle de Merenptah vers 1208 av. J.-C. Son sens est incertain ; un lien avec la teinture de pourpre a été proposé."
    - "La Genèse compte Canaan parmi les fils de Cham, maudit par Noé, et énumère ses descendants, de Sidon et de Heth jusqu’aux Jébusiens et aux Amoréens. Abram partit « pour aller dans le pays de Canaan », et Dieu le promit à sa descendance « en possession perpétuelle ». Les fils de Jacob en descendirent en Égypte, et Moïse fut envoyé pour faire monter Israël « dans un pays où coulent le lait et le miel » que tenaient sept nations « plus nombreuses et plus puissantes que toi ». Les espions trouvèrent des villes fortifiées et très grandes, et les Cananéens « près de la mer et le long du Jourdain ». Josué prit le pays, mais les Juges avouent qu’à Beth-Schean, à Meguiddo et ailleurs « les Cananéens voulurent rester dans ce pays », et qu’Israël les assujettit à un tribut, « mais il ne les chassa point »."
    - "L’archéologie montre Canaan à l’âge du Bronze récent comme un pays de cités-États sous domination égyptienne, dont Hatsor, Meguiddo et Lakis, dont les rois écrivent au pharaon dans les lettres d’Amarna. Les tablettes d’Ougarit, découvertes à partir de 1929, révèlent les dieux cananéens, El, Baal, Ashéra et Anat, contre lesquels luttaient les prophètes. Beaucoup de ces villes furent détruites ou déclinèrent vers 1200 av. J.-C., et des centaines de petits villages apparurent alors dans la montagne. La manière dont Israël s’y établit est débattue : par conquête, par infiltration pacifique, par un soulèvement au sein de Canaan, ou comme un peuple issu des Cananéens eux-mêmes."
    - "Les Phéniciens restèrent longtemps cananéens par la langue et le nom, et Augustin dit que les paysans de langue punique près d’Hippone se nommaient encore Chanani. Ésaïe voit des villes d’Égypte parler « la langue de Canaan », et dans Matthieu « une femme cananéenne » des côtes de Tyr et de Sidon obtient la guérison de sa fille ; Paul, à Antioche, rappelle « sept nations au pays de Canaan ». Le pays de Canaan est aujourd’hui Israël, les territoires palestiniens et le Liban, avec les marges de la Syrie et de la Jordanie."
