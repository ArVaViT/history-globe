# Overview article (ADR 0007). Mainstream facts only; the identification with Kaloi Limenes is secure because the name survives; the date of the voyage is given as debated.
id: fair-havens
place: aae626a
title:
  en: "Fair Havens"
  ru: "Хорошие Пристани"
  uk: "Добрі Пристані"
  es: "Buenos Puertos"
  pt: "Bons Portos"
  de: "Schönhafen"
  fr: "Beaux-Ports"
  it: "Buoni Porti"
  pl: "Piękne Przystanie"
  nl: "Schone Havens"
  cs: "Dobré přístavy"
body:
  en:
    - "Fair Havens is a small bay on the south coast of Crete where the ship carrying Paul to Rome put in. After slow sailing against the wind they passed Salmone and “came unto a place which is called The fair havens; nigh whereunto was the city of Lasea”. It was already late in the season, “because the fast was now already past”, the Day of Atonement in the autumn, and Paul warned that going on would bring “hurt and much damage”. But “the centurion believed the master and the owner of the ship”, and “because the haven was not commodious to winter in”, most advised sailing on to Phenice, a better harbour farther west; caught by the north-east gale, the ship was driven to Malta. The year is debated, most often put at AD 59 or 60."
    - "That is all that is known of the place in antiquity. The name survives as Kaloi Limenes, a bay east of Cape Lithino, partly sheltered by the cape and small islands but open to much of the sea, which agrees with Luke's judgement. Ruins on the shore a short way to the east, found in 1856, are usually taken to be those of Lasea. Today Kaloi Limenes is a small village with a chapel of Saint Paul and a fuel depot for ships on the islet of Saint Paul at its entrance."
  ru:
    - "Хорошие Пристани — небольшая бухта на южном берегу Крита, куда зашёл корабль, на котором Павла везли в Рим. После медленного плавания против ветра миновали Салмону и «прибыли к одному месту, называемому Хорошие Пристани, близ которого был город Ласея». Время было уже позднее, «потому что и пост уже прошел» — осенний День очищения, и Павел предупреждал, что дальнейшее плавание будет «с затруднениями и с большим вредом». Но «сотник более доверял кормчему и начальнику корабля», и, «как пристань не была приспособлена к зимовке», многие советовали идти дальше, в Финик, лучшую гавань западнее; застигнутый северо-восточной бурей, корабль был унесён к Мелиту. Год спорен, чаще всего называют 59 или 60 г. н. э."
    - "Больше о месте в древности ничего не известно. Имя сохранилось: Калои-Лименес — бухта к востоку от мыса Литино, отчасти прикрытая мысом и островками, но открытая значительной части моря, что сходится с оценкой Луки. Развалины на берегу немного к востоку, найденные в 1856 году, обычно считают остатками Ласеи. Сегодня Калои-Лименес — маленькое селение с часовней апостола Павла и топливной базой для судов на островке Святого Павла у входа в бухту."
  uk:
    - "Добрі Пристані — мала бухта на південному березі Криту, де зайшов корабель, що віз Павла до Рима. Після повільного плавання проти вітру вони минули Салмону й «прибули на врочище Гарна пристань, від котрого був близько город Ласей». Було вже пізно в сезоні, «тим що вже й піст минув», тобто Судний день восени, і Павло застерігав, що плавання буде «з утратою і з великою шкодою». Але «Сотник же керманичові і властителеві корабля довіряв більш», і «Як же пристань не була вигідна на зимуваннє», більшість радила пливти далі до Фенікса, кращої гавані далі на захід; піймане північно-східним штормом, судно було віднесене до Мальти. Рік є спірним, найчастіше його ставлять на 59 або 60 р. н. е."
    - "Це все, що відомо про місце в давнину. Назва зберігається як Калой-Лімнес, бухта на схід від мису Літіно, частково захищена мисом і малими островами, але відкрита значній частині моря, що узгоджується з судженням Луки. Руїни на березі трохи на схід, знайдені у 1856 р., зазвичай вважають рештками Ласеї. Сьогодні Калой-Лімнес — мале село з каплицею святого Павла та паливним складом для кораблів на острівці святого Павла при вході."
  es:
    - "Buenos Puertos es una pequeña bahía de la costa sur de Creta donde recaló la nave que llevaba a Pablo a Roma. Tras una lenta navegación contra el viento pasaron Salmona y «llegamos á un lugar que llaman Buenos Puertos, cerca del cual estaba la ciudad de Lasea». Era ya tarde en la estación, «porque ya era pasado el ayuno», el Día de la Expiación, en otoño, y Pablo advirtió que seguir adelante traería «trabajo y mucho daño». Pero «el centurión creía más al piloto y al patrón de la nave», y, «no habiendo puerto cómodo para invernar», la mayoría aconsejó seguir hasta Fenice, un puerto mejor más al oeste; atrapada por el temporal del nordeste, la nave fue arrastrada hasta Malta. El año se debate, y se sitúa con más frecuencia en el 59 o el 60 d. C."
    - "Eso es todo lo que se sabe del lugar en la Antigüedad. El nombre sobrevive como Kaloi Limenes, una bahía al este del cabo Litino, parcialmente abrigada por el cabo y por pequeñas islas pero abierta a gran parte del mar, lo que concuerda con el juicio de Lucas. Unas ruinas en la orilla, un poco al este, halladas en 1856, suelen tenerse por las de Lasea. Hoy Kaloi Limenes es una pequeña aldea con una capilla de San Pablo y un depósito de combustible para barcos en el islote de San Pablo, a su entrada."
  pt:
    - "Bons Portos é uma pequena baía na costa sul de Creta onde fez escala o navio que levava Paulo a Roma. Depois de uma navegação lenta contra o vento, passaram Salmona e chegaram a “um certo lugar chamado Bons Portos, perto da cidade de Laseia”. Já era tarde na estação, “porque o Jejum já havia passado”, o Dia da Expiação, no outono, e Paulo advertiu que prosseguir traria “prejuízo e grande perda”. Mas “o centurião deu mais crédito ao piloto e ao dono do navio”, e como “o porto não era adequado para passar o inverno”, a maioria aconselhou seguir para Fenice, um porto melhor mais a oeste; apanhado pelo vendaval do nordeste, o navio foi levado até Malta. O ano é debatido, mais frequentemente situado em 59 ou 60 d.C."
    - "Isso é tudo o que se sabe do lugar na Antiguidade. O nome sobrevive como Kaloi Limenes, uma baía a leste do cabo Lithino, em parte abrigada pelo cabo e por ilhotas, mas aberta a boa parte do mar, o que concorda com o juízo de Lucas. Ruínas na costa, um pouco a leste, achadas em 1856, costumam ser tidas como as de Laseia. Hoje Kaloi Limenes é uma pequena aldeia com uma capela de São Paulo e um depósito de combustível para navios na ilhota de São Paulo, em sua entrada."
  de:
    - "Schönhafen ist eine kleine Bucht an der Südküste Kretas, in der das Schiff mit Paulus auf dem Weg nach Rom anlegte. Nach langsamer Fahrt gegen den Wind fuhren sie an Salmone vorbei, „da kamen wir an eine Stätte, die heißt Gutfurt, dabei war nahe die Stadt Lasäa“. Es war schon spät in der Jahreszeit, „darum daß auch das Fasten schon vorüber war“, der Versöhnungstag im Herbst, und Paulus warnte, die Weiterfahrt werde „mit Leid und großem Schaden ergehen“. Aber „der Unterhauptmann glaubte dem Steuermann und dem Schiffsherrn mehr denn dem, was Paulus sagte“, und „da die Anfurt ungelegen war, zu überwintern“, rieten die meisten, weiterzufahren nach Phönix, einem besseren Hafen weiter westlich; vom Nordoststurm erfasst, wurde das Schiff nach Malta getrieben. Das Jahr ist umstritten, meist wird 59 oder 60 n. Chr. angesetzt."
    - "Das ist alles, was aus der Antike über den Ort bekannt ist. Der Name lebt als Kaloi Limenes fort, eine Bucht östlich des Kaps Lithino, teilweise durch das Kap und kleine Inseln geschützt, aber zu großen Teilen zum Meer offen, was mit Lukas’ Urteil übereinstimmt. Ruinen am Ufer ein Stück weiter östlich, 1856 gefunden, gelten meist als die von Lasäa. Heute ist Kaloi Limenes ein kleines Dorf mit einer Kapelle des heiligen Paulus und einem Treibstofflager für Schiffe auf dem Inselchen Agios Pavlos an seiner Einfahrt."
  fr:
    - "Beaux-Ports est une petite baie sur la côte sud de la Crète où le navire qui conduisait Paul à Rome fit escale. Après une navigation lente contre le vent, ils dépassèrent Salmone et arrivèrent à « un lieu nommé Beaux Ports, près duquel était la ville de Lasée ». La saison était déjà avancée, « car l’époque même du jeûne était déjà passée », le jour des Expiations à l’automne, et Paul avertit que « la navigation ne se fera pas sans péril et sans beaucoup de dommage ». Mais « le centenier écouta le pilote et le patron du navire », et « comme le port n’était pas bon pour hiverner », la plupart conseillèrent de poursuivre jusqu’à Phénix, meilleur port plus à l’ouest ; pris par la tempête du nord-est, le navire fut poussé jusqu’à Malte. L’année est débattue, le plus souvent placée en 59 ou 60 apr. J.-C."
    - "C’est tout ce que l’on sait du lieu dans l’Antiquité. Le nom survit sous la forme Kaloi Limenes, baie à l’est du cap Lithino, en partie abritée par le cap et de petites îles mais ouverte à une grande partie de la mer, ce qui s’accorde avec le jugement de Luc. Des ruines sur le rivage, un peu à l’est, trouvées en 1856, sont généralement tenues pour celles de Lasée. Aujourd’hui, Kaloi Limenes est un petit village avec une chapelle de saint Paul et un dépôt de carburant pour navires sur l’îlot Saint-Paul à son entrée."
  it:
    - "Buoni Porti è una piccola baia sulla costa meridionale di Creta dove approdò la nave che portava Paolo a Roma. Dopo una lenta navigazione contro vento oltrepassarono Salmone e «venimmo a un certo luogo, detto Beiporti, vicino al quale era la città di Lasea». Era già tardi nella stagione, «poiché anche il Digiuno era già passato», il Giorno dell’Espiazione in autunno, e Paolo avvertì che proseguire avrebbe portato «pericolo e grave danno». Ma «il centurione prestava più fede al pilota e al padron della nave», e «siccome quel porto non era adatto a svernare», i più consigliarono di proseguire fino a Fenice, un porto migliore più a ovest; colta dalla tempesta di nord-est, la nave fu spinta a Malta. L’anno è dibattuto, più spesso collocato nel 59 o 60 d.C."
    - "È tutto ciò che si sa del luogo nell’antichità. Il nome sopravvive come Kaloi Limenes, una baia a est di Capo Litino, in parte riparata dal capo e da piccole isole ma aperta a gran parte del mare, il che concorda con il giudizio di Luca. Rovine sulla riva poco più a est, trovate nel 1856, sono di solito ritenute quelle di Lasea. Oggi Kaloi Limenes è un piccolo villaggio con una cappella di San Paolo e un deposito di carburante per le navi sull’isolotto di San Paolo all’ingresso."
  pl:
    - "Piękne Przystanie to mała zatoka na południowym wybrzeżu Krety, do której zawinął okręt wiozący Pawła do Rzymu. Po powolnej żegludze pod wiatr minęli Salmone i — jak mówi opowieść — „przyszliśmy na miejsce niektóre, które zowią piękne porty, od którego blisko było miasto Lasea”. Było już późno w sezonie, „przeto iż już był i post przeminął”, czyli jesienny Dzień Pojednania, a Paweł ostrzegał, że żegluga dalej będzie „z ukrzywdzeniem i z wielką szkodą”. Lecz „setnik więcej ufał sprawcy okrętu i sternikowi”, i „gdy nie było portu sposobnego ku zimowaniu”, większość radziła płynąć dalej do Feniks, lepszego portu na zachodzie; złapany przez północno-wschodni sztorm, okręt został zepchnięty na Maltę. Rok jest dyskutowany, najczęściej podaje się 59 lub 60 r. n.e."
    - "To wszystko, co wiadomo o tym miejscu w starożytności. Nazwa przetrwała jako Kaloi Limenes, zatoka na wschód od przylądka Litino, częściowo osłonięta przez przylądek i małe wyspy, lecz otwarta na znaczną część morza, co zgadza się z oceną Łukasza. Ruiny na brzegu nieco na wschód, odkryte w 1856 r., uważa się zwykle za pozostałości Lasei. Dziś Kaloi Limenes to mała wieś z kaplicą św. Pawła i składem paliwa dla statków na wysepce św. Pawła u wejścia."
  nl:
    - "Schone Havens is een kleine baai aan de zuidkust van Kreta waar het schip met Paulus naar Rome binnenliep. Na trage vaart tegen de wind passeerden zij Salmone en “kwamen wij in een zekere plaats genaamd Schonehavens, waar de stad Lasea nabij was”. Het was al laat in het seizoen, “omdat ook de vasten nu voorbij was”, de Grote Verzoendag in de herfst, en Paulus waarschuwde dat doorvaren zou geschieden “met hinder en grote schade”. Maar “de hoofdman geloofde meer den stuurman en den schipper”, en “alzo de haven ongelegen was om te overwinteren” raadden de meesten aan door te varen naar Fenix, een betere haven verder westwaarts; door de noordoostelijke storm gegrepen werd het schip naar Malta gedreven. Het jaar is omstreden, meestal gesteld op 59 of 60 n.Chr."
    - "Dat is alles wat uit de oudheid over de plaats bekend is. De naam leeft voort als Kaloi Limenes, een baai ten oosten van Kaap Lithino, deels beschut door de kaap en kleine eilanden maar open naar een groot deel van de zee, wat met Lucas' oordeel overeenstemt. Ruïnes op de kust een eindje oostelijker, in 1856 gevonden, gelden meestal als die van Lasea. Tegenwoordig is Kaloi Limenes een klein dorp met een kapel van Sint-Paulus en een brandstofdepot voor schepen op het eilandje Sint-Paulus bij de ingang."
  cs:
    - "Dobré přístavy jsou malá zátoka na jižním pobřeží Kréty, kde přistála loď vezoucí Pavla do Říma. Po pomalé plavbě proti větru minuli Salmónu a „přijeli jsme na jedno místo, kteréž slove Pěkný břeh, od kteréhožto nedaleko bylo město Lasea“. Bylo už pozdě v sezóně, „neb již byl i půst pominul“, podzimní Den smíření, a Pavel varoval, že pokračovat znamená „s velikým ublížením a s mnohou škodou“. Ale „setník více věřil správci lodí a marináři, nežli tomu, co Pavel pravil“ a „když nebylo tu příhodného přístavu, kdež by pobyli přes zimu“, většina radila plout dál do Foiniku, lepšího přístavu dále na západ; zachycena severovýchodní vichřicí byla loď hnána k Maltě. Rok je sporný, nejčastěji se klade na 59 nebo 60 n. l."
    - "To je vše, co je o místě ve starověku známo. Jméno přežívá jako Kaloi Limenes, zátoka východně od mysu Lithino, částečně chráněná mysem a malými ostrovy, ale otevřená velké části moře, což souhlasí s Lukášovým soudem. Zříceniny na pobřeží kousek na východ, nalezené roku 1856, se obvykle pokládají za pozůstatky Lasaie. Dnes je Kaloi Limenes malá vesnice s kaplí svatého Pavla a zásobárnou paliva pro lodě na ostrůvku svatého Pavla u vchodu."
scripture:
