# Overview article (ADR 0007). Mainstream facts only; Taberah is unlocated; the view that it is another name for the Kibroth-hattaavah camp is given as a view.
id: taberah
place: a028191
title:
  en: "Taberah"
  ru: "Тавера"
  uk: "Тавера"
  es: "Tabera"
  pt: "Taberá"
  de: "Tabera"
  fr: "Tabeéra"
