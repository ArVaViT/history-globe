# Overview article (ADR 0007). Mainstream facts only; Taberah is unlocated; the view that it is another name for the Kibroth-hattaavah camp is given as a view.
id: taberah
place: a028191
title:
  en: "Taberah"
  ru: "Тавера"
  uk: "Тавера"
  es: "Tabera"
  pt: "Taberá"
  de: "Tabera"
  fr: "Tabeéra"
body:
  en:
    - "Taberah, “burning”, was a stopping place of Israel in the wilderness, named after the first of the complaints that followed the departure from Sinai: “when the people complained, it displeased the LORD”, and “the fire of the LORD burnt among them, and consumed them that were in the uttermost parts of the camp”; the people cried to Moses, he prayed, “the fire was quenched”, and “he called the name of the place Taberah: because the fire of the LORD burnt among them.” Moses recalls it in Deuteronomy: “And at Taberah, and at Massah, and at Kibroth-hattaavah, ye provoked the LORD to wrath.”"
    - "Nothing else is known of it, and it cannot be located. Taberah does not appear in the list of stations in Numbers 33, where Kibroth-hattaavah follows directly after the wilderness of Sinai, so some take Taberah for another name of the same camp, or a spot at its edge; others think the list simply skips it. Since the route of the Exodus and the site of Sinai are themselves disputed, the map places Taberah only roughly, within some 50 km of Kibroth-hattaavah."
  ru:
    - "Тавера, «пожар», — стоянка Израиля в пустыне, названная по первому из ропотов, начавшихся после ухода от Синая: «Народ стал роптать вслух Господа; и Господь услышал, и воспламенился гнев Его, и возгорелся у них огонь Господень, и начал истреблять край стана»; народ возопил к Моисею, Моисей помолился, «и утих огонь», «и нарекли имя месту сему: Тавера, потому что возгорелся у них огонь Господень». Моисей вспоминает её во Второзаконии: «И в Тавере, в Массе и в Киброт-Гаттааве вы раздражили Господа Бога вашего»."
    - "Больше о ней ничего не известно, и указать её место нельзя. В перечне стоянок в 33-й главе книги Чисел Тавера не упомянута: там Киброт-Гаттаава следует сразу за пустыней Синайской, поэтому одни считают Таверу другим именем того же стана или местом на его краю, а другие думают, что перечень её просто пропускает. Поскольку путь Исхода и место Синая сами спорны, на карте Тавера помещена лишь приблизительно — в пределах около 50 км от Киброт-Гаттаавы."
  uk:
    - "Тавера, «спалення», була стоянкою Ізраїлю в пустелі, названою за першим з нарікань, що почалися після відходу від Синаю: «люде нарікали так, що опротивіло Господеві», і «запалав гнїв його, і спихнув огонь між ними, і став пожирати конець табору»; народ заголосив до Мойсея, той благав Господа, «та й потахла пожежа», і «назвали те врочище Табера, бо палало між ними поломя Господнє». Мойсей згадує про це у Повторенні Закону: «Так само розгнївили ви Господа при Табері й при Массі і при Киброт-Гаттааві»."
    - "Більше про неї нічого не відомо, і її не можна розмістити на місцевості. Тавера не з’являється в переліку стоянок у Числах 33, де Кіброт-Гаттаава йде безпосередньо за пустелею Синай, тому дехто вважає Тавери іншою назвою того самого табору або місцем на його краю; інші думають, що перелік просто пропускає її. Оскільки і маршрут Виходу, і місце Синаю самі спірні, мапа позначає Таверу лише приблизно, в межах близько 50 км від Кіброт-Гаттааві."
  es:
    - "Tabera, «incendio», fue un lugar de parada de Israel en el desierto, nombrado a raíz de la primera de las quejas que siguieron a la partida del Sinaí: «el pueblo se quejó á oídos de Jehová», y «encendióse en ellos fuego de Jehová y consumió el un cabo del campo»; el pueblo dio voces a Moisés, este oró, «soterróse el fuego», y «llamó á aquel lugar Taberah; porque el fuego de Jehová se encendió en ellos». Moisés lo recuerda en el Deuteronomio: «También en Tabera, y en Massa, y en Kibroth-hataavah, enojasteis á Jehová»."
    - "No se sabe nada más de él, y no puede localizarse. Tabera no aparece en la lista de estaciones de Números 33, donde Kibrot-hataava sigue directamente al desierto de Sinaí, de modo que algunos toman Tabera por otro nombre del mismo campamento, o por un paraje en su borde; otros piensan que la lista sencillamente lo omite. Como la ruta del Éxodo y el emplazamiento del Sinaí son a su vez discutidos, el mapa sitúa Tabera solo de forma aproximada, a unos 50 km de Kibrot-hataava."
  pt:
    - "Taberá, “incêndio”, foi um lugar de parada de Israel no deserto, assim chamado pela primeira das queixas que se seguiram à partida do Sinai: “O povo estava reclamando aos ouvidos do SENHOR”, e “o fogo do SENHOR ardeu entre eles, e consumiu algumas das extremidades do acampamento”; o povo clamou a Moisés, ele orou, “o fogo diminuiu”, e “o nome daquele lugar foi chamado Taberá, porque o fogo do SENHOR ardeu entre eles”. Moisés o recorda em Deuteronômio: “Em Taberá, em Massá e em Quibrote-Hataavá você provocou a ira do SENHOR.”"
    - "Nada mais se sabe dele, e não é possível localizá-lo. Taberá não aparece na lista de estações de Números 33, onde Quibrote-Hataavá vem logo depois do deserto do Sinai, de modo que alguns tomam Taberá por outro nome do mesmo acampamento ou por um ponto em sua orla; outros pensam que a lista simplesmente o omite. Como a rota do Êxodo e o sítio do Sinai são eles mesmos discutidos, o mapa situa Taberá apenas aproximadamente, a uns 50 km de Quibrote-Hataavá."
  de:
    - "Tabera, „Brand“, war ein Rastplatz Israels in der Wüste, benannt nach der ersten der Klagen nach dem Aufbruch vom Sinai: „Und da sich das Volk ungeduldig machte, gefiel es übel vor den Ohren des HERRN“, und sein Zorn „zündete das Feuer des HERRN unter ihnen an; das verzehrte die äußersten Lager“; das Volk schrie zu Mose, er bat den HERRN, „da verschwand das Feuer“, und „man hieß die Stätte Thabeera, darum daß sich unter ihnen des HERRN Feuer angezündet hatte“. Mose erinnert im Deuteronomium daran: „So erzürntet ihr den HERRN auch zu Thabeera und zu Massa und bei den Lustgräbern.“"
    - "Sonst ist nichts über den Ort bekannt, und er lässt sich nicht lokalisieren. Tabera erscheint nicht in der Stationenliste von Numeri 33, wo Kibrot-Taawa unmittelbar auf die Wüste Sinai folgt; daher halten manche Tabera für einen anderen Namen desselben Lagers oder einen Ort an dessen Rand, andere meinen, die Liste übergehe es einfach. Da der Weg des Exodus und die Lage des Sinai selbst umstritten sind, setzt die Karte Tabera nur ungefähr an, innerhalb von etwa 50 km um Kibrot-Taawa."
  fr:
    - "Tabeéra, « embrasement », était une halte d’Israël dans le désert, ainsi nommée d’après la première des plaintes qui suivirent le départ du Sinaï : « Le peuple murmura et cela déplut aux oreilles de l’Éternel », et « le feu de l’Éternel s’alluma parmi eux, et dévora l’extrémité du camp » ; le peuple cria à Moïse, qui pria, et « le feu s’arrêta » : « On donna à ce lieu le nom de Tabeéra, parce que le feu de l’Éternel s’était allumé parmi eux. » Moïse le rappelle dans le Deutéronome : « À Tabeéra, à Massa, et à Kibroth-Hattaava, vous excitâtes la colère de l’Éternel. »"
    - "On ne sait rien d’autre de ce lieu, qui ne peut être localisé. Tabeéra ne figure pas dans la liste des étapes de Nombres 33, où Kibroth-Hattaava suit directement le désert du Sinaï ; certains y voient donc un autre nom du même camp, ou un point de sa périphérie, d’autres pensent que la liste l’omet simplement. Comme l’itinéraire de l’Exode et le site du Sinaï sont eux-mêmes discutés, la carte place Tabeéra de façon approximative seulement, à moins de 50 km de Kibroth-Hattaava."
scripture:
