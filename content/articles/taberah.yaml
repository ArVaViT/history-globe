# Overview article (ADR 0007). Mainstream facts only; Taberah is unlocated; the view that it is another name for the Kibroth-hattaavah camp is given as a view.
id: taberah
place: a028191
title:
  en: "Taberah"
  ru: "Тавера"
body:
  en:
    - "Taberah, “burning”, was a stopping place of Israel in the wilderness, named after the first of the complaints that followed the departure from Sinai: “when the people complained, it displeased the LORD”, and “the fire of the LORD burnt among them, and consumed them that were in the uttermost parts of the camp”; the people cried to Moses, he prayed, “the fire was quenched”, and “he called the name of the place Taberah: because the fire of the LORD burnt among them.” Moses recalls it in Deuteronomy: “And at Taberah, and at Massah, and at Kibroth-hattaavah, ye provoked the LORD to wrath.”"
    - "Nothing else is known of it, and it cannot be located. Taberah does not appear in the list of stations in Numbers 33, where Kibroth-hattaavah follows directly after the wilderness of Sinai, so some take Taberah for another name of the same camp, or a spot at its edge; others think the list simply skips it. Since the route of the Exodus and the site of Sinai are themselves disputed, the map places Taberah only roughly, within some 50 km of Kibroth-hattaavah."
  ru:
    - "Тавера, «пожар», — стоянка Израиля в пустыне, названная по первому из ропотов, начавшихся после ухода от Синая: «Народ стал роптать вслух Господа; и Господь услышал, и воспламенился гнев Его, и возгорелся у них огонь Господень, и начал истреблять край стана»; народ возопил к Моисею, Моисей помолился, «и утих огонь», «и нарекли имя месту сему: Тавера, потому что возгорелся у них огонь Господень». Моисей вспоминает её во Второзаконии: «И в Тавере, в Массе и в Киброт-Гаттааве вы раздражили Господа Бога вашего»."
    - "Больше о ней ничего не известно, и указать её место нельзя. В перечне стоянок в 33-й главе книги Чисел Тавера не упомянута: там Киброт-Гаттаава следует сразу за пустыней Синайской, поэтому одни считают Таверу другим именем того же стана или местом на его краю, а другие думают, что перечень её просто пропускает. Поскольку путь Исхода и место Синая сами спорны, на карте Тавера помещена лишь приблизительно — в пределах около 50 км от Киброт-Гаттаавы."
scripture:
  - Num.11.1-Num.11.3
  - Deut.9.22
  - Num.33.16
sources:
