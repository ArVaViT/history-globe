# Overview article (ADR 0007). Mainstream facts only; Shepham is unlocated and the article says so; the Shiphmite of 1 Chronicles 27:27 is linked to Shepham only as the Synodal Bible does, with Siphmoth as the alternative.
id: shepham
place: a9ba60c
