# Overview article (ADR 0007). Mainstream facts only; Shepham is unlocated and the article says so; the Shiphmite of 1 Chronicles 27:27 is linked to Shepham only as the Synodal Bible does, with Siphmoth as the alternative.
id: shepham
place: a9ba60c
title:
  en: "Shepham"
  ru: "Шефам"
  uk: "Шефам"
  es: "Sefam"
  pt: "Sefã"
  de: "Schefam"
  fr: "Schépham"
  it: "Sefam"
  pl: "Szefam"
  cs: "Šefam"
  nl: "Sefam"
  sv: "Shefam"
body:
  en:
    - "Shepham is a point on the eastern border of the promised land as Numbers draws it before the crossing of the Jordan: “And ye shall point out your east border from Hazar-enan to Shepham: And the coast shall go down from Shepham to Riblah, on the east side of Ain; and the border shall descend, and shall reach unto the side of the sea of Chinnereth eastward.” It thus lay between Hazar-enan, the north-eastern corner of the land at the border of Damascus, and a Riblah east of a spring called Ain, from which the line ran down to the Sea of Galilee; this Riblah is probably not the Riblah on the Orontes where the Babylonians judged Zedekiah, which seems too far north, but an unknown place, perhaps in the region of Mount Hermon and the Golan. Ezekiel's border for the restored land uses other names and leaves Shepham out."
    - "No site called Shepham is known, and no ancient writer placed it. Those who put Hazar-enan at the oasis of Qaryatein in the Syrian desert run the border far to the east, and those who put it near Banias keep it close to Hermon; Shepham moves with it, and the map keeps the point within reach of its Riblah without claiming more. The only other possible mention is David's officer Zabdi “the Shiphmite”, set “over the increase of the vineyards for the wine cellars”; the Synodal Bible makes him a man of Shepham, but he may as well have come from Siphmoth in the Negeb of Judah, to which David sent part of the Amalekite spoil, and the question cannot be decided."
  ru:
    - "Шефам — точка на восточной границе обетованной земли, как её проводит книга Чисел перед переходом через Иордан: «границу восточную проведите себе от Гацар-Енана к Шефаму, от Шефама пойдет граница к Рибле, с восточной стороны Аина, потом пойдет граница и коснется берегов моря Киннереф с восточной стороны». Он лежал, стало быть, между Гацар-Енаном, северо-восточным углом земли у границы Дамаска, и некоей Риблой к востоку от источника по имени Аин, откуда черта спускалась к Галилейскому морю; эта Рибла, вероятно, не Рибла на Оронте, где Вавилоняне судили Седекию, та, по-видимому, лежит слишком далеко на севере, а неизвестное место, возможно, в области Ермона и Голана. Граница восстановленной земли у Иезекииля пользуется другими именами и Шефама не называет."
    - "Места под именем Шефам не известно, и ни один древний писатель его не помещал. Те, кто ставит Гацар-Енан у оазиса Карьятейн в Сирийской пустыне, уводят границу далеко на восток, а те, кто ищет его у Баниаса, держат её близ Ермона; Шефам движется вместе с ней, и карта держит точку в пределах досягаемости от своей Риблы, не утверждая большего. Единственное другое возможное упоминание — Завдий, начальник Давида над запасами вина в виноградниках, по еврейскому тексту «Шифмитянин»; Синодальный перевод делает его человеком «из Шефама», но он с тем же правом мог быть родом из Шифмофа в Негеве Иудином, куда Давид послал часть амаликитской добычи, и решить этот вопрос нельзя."
  uk:
    - "Шефам — це точка на східному кордоні обітованої землі, як її накреслено в Числах перед переходом через Йордан: «І визначите собі всхідню гряницю від Газар Енану до Шефаму. І спуститься гряниця від Шефаму до Риблї на схід соньця від Аїну; і спуститься дальше гряниця та й торкнеться о беріг Кінерет озера од сходу». Отже, він лежав між Гацар-Енаном, північно-східним кутом країни на межі з Дамаском, і Рівлою на схід від джерела на ймення Аїн, звідки лінія йшла вниз до Галілейського моря; ця Рівла, імовірно, не Рівла на Оронті, де вавилоняни судили Седекію (вона, схоже, лежить надто далеко на північ), а невідоме місце, можливо, в районі гори Гермон і Голану. Кордон відновленої землі в Єзекіїля використовує інші назви й опускає Шефам."
    - "Села під назвою Шефам не відомо, і жоден давній автор його не локалізував. Ті, хто вміщує Гацар-Енан в оазі Карьятейн у Сирійській пустелі, відсувають кордон далеко на схід, а ті, хто вміщує його біля Баніаса, тримають його близько до Гермона; Шефам рухається разом із ним, і карта зберігає цю точку в межах досяжності від своєї Рівли, не стверджуючи більшого. Єдина інша можлива згадка — Давидів урядник Завдій, поставлений «над пивницями в виноградниках»; Кулішів переклад робить його вихідцем із Шефама («Забдїй з Шефама»), але він так само міг походити з Шифмота в Негеві Юдиному, куди Давид надіслав частину амалекитської здобичі, і питання вирішити не можна."
  es:
    - "Sefam es un punto de la frontera oriental de la tierra prometida tal como la traza Números antes del cruce del Jordán: «Y por término al oriente os señalaréis desde Hasar-enán hasta Sepham; Y bajará este término desde Sepham á Ribla, al oriente de Ain: y descenderá el término, y llegará á la costa de la mar de Cinnereth al oriente». Estaba así entre Hazar-enán, la esquina nororiental del país en la frontera de Damasco, y una Ribla al este de un manantial llamado Ain, de donde la línea descendía hasta el mar de Galilea; esta Ribla probablemente no es la Ribla del Orontes donde los babilonios juzgaron a Sedequías, que parece quedar demasiado al norte, sino un lugar desconocido, quizá en la región del monte Hermón y el Golán. La frontera de Ezequiel para el país restaurado usa otros nombres y omite Sefam."
    - "No se conoce ningún lugar llamado Sefam, y ningún escritor antiguo lo situó. Quienes ponen Hazar-enán en el oasis de Qaryatayn, en el desierto sirio, trazan la frontera muy al este, y quienes la ponen cerca de Baniás la mantienen cerca del Hermón; Sefam se mueve con ella, y el mapa mantiene el punto al alcance de su Ribla sin afirmar más. La única otra mención posible es la del oficial de David Zabdi, «Siphmita», puesto sobre «el fruto de las viñas para las bodegas»; la Biblia sinodal lo hace hombre de Sefam, pero pudo venir igualmente de Sifmot, en el Néguev de Judá, adonde David envió parte del botín amalecita, y la cuestión no puede decidirse."
  pt:
    - "Sefã é um ponto da fronteira leste da terra prometida como Números a traça antes da travessia do Jordão: “Vocês marcarão a sua fronteira leste de Hazar-Enã até Sefã. A fronteira descerá de Sefã até Ribla, no lado leste de Aim. A fronteira descerá, e chegará à margem do mar de Quinerete, para o leste.” Ficava assim entre Hazar-Enã, o canto nordeste da terra na fronteira de Damasco, e uma Ribla a leste de uma fonte chamada Aim, de onde a linha descia ao Mar da Galileia; essa Ribla provavelmente não é a Ribla do Orontes onde os babilônios julgaram Zedequias, que parece ficar longe demais ao norte, mas um lugar desconhecido, talvez na região do Monte Hermom e do Golã. A fronteira de Ezequiel para a terra restaurada usa outros nomes e deixa Sefã de fora."
    - "Nenhum local chamado Sefã é conhecido, e nenhum autor antigo a situou. Os que põem Hazar-Enã no oásis de Qaryatein, no deserto sírio, levam a fronteira muito a leste, e os que a põem perto de Banias a mantêm junto ao Hermom; Sefã se move com ela, e o mapa mantém o ponto ao alcance de sua Ribla sem afirmar mais. A única outra menção possível é o oficial de Davi Zabdi, “o sifmita”, posto “Sobre a produção das vinhas para as adegas de vinho”; a Bíblia Sinodal faz dele um homem de Sefã, mas pode igualmente ter vindo de Sifmote, no Neguebe de Judá, para onde Davi enviou parte do despojo amalequita, e a questão não pode ser decidida."
  de:
    - "Schefam ist ein Punkt an der Ostgrenze des verheißenen Landes, wie die Numeri sie vor dem Jordanübergang ziehen: „Und sollt messen die Grenze gegen Morgen vom Dorf Enan gen Sepham, und die Grenze gehe herab von Sepham gen Ribla morgenwärts von Ain; darnach gehe sie herab und lenke sich an die Seite des Meers Kinneret gegen Morgen.“ Es lag also zwischen Hazar-Enan, der nordöstlichen Ecke des Landes an der Grenze von Damaskus, und einem Ribla östlich einer Quelle namens Ajin, von dem die Linie zum See Genezareth hinabführte; dieses Ribla ist wohl nicht das Ribla am Orontes, wo die Babylonier Zedekia richteten, das zu weit nördlich zu liegen scheint, sondern ein unbekannter Ort, vielleicht im Gebiet des Hermon und des Golan. Hesekiels Grenze für das wiederhergestellte Land verwendet andere Namen und lässt Schefam aus."
    - "Keine Stätte namens Schefam ist bekannt, und kein antiker Autor verortete es. Wer Hazar-Enan in der Oase Karjatain in der syrischen Wüste ansetzt, zieht die Grenze weit nach Osten, wer es nahe Banias ansetzt, hält sie nah am Hermon; Schefam wandert mit, und die Karte hält den Punkt in Reichweite seines Ribla, ohne mehr zu behaupten. Die einzige andere mögliche Erwähnung ist Davids Beamter, von dem es heißt: „über die Weinkeller und Schätze des Weins war Sabdi, der Sephamiter“; die Synodalübersetzung macht ihn zu einem Mann aus Schefam, doch er mag ebenso aus Schifmot im Negev Judas stammen, wohin David einen Teil der amalekitischen Beute sandte, und die Frage lässt sich nicht entscheiden."
  fr:
    - "Schépham est un point de la frontière orientale de la terre promise telle que les Nombres la tracent avant la traversée du Jourdain : « Vous tracerez votre limite orientale de Hatsar-Énan à Schepham ; elle descendra de Schepham vers Ribla, à l’orient d’Aïn ; elle descendra, et s’étendra le long de la mer de Kinnéreth, à l’orient ». Elle se trouvait donc entre Hatsar-Énan, l’angle nord-est du pays à la frontière de Damas, et une Ribla à l’est d’une source appelée Aïn, d’où la ligne descendait vers la mer de Galilée ; cette Ribla n’est probablement pas la Ribla de l’Oronte où les Babyloniens jugèrent Sédécias, qui semble trop au nord, mais un lieu inconnu, peut-être dans la région du mont Hermon et du Golan. La frontière d’Ézéchiel pour le pays restauré emploie d’autres noms et omet Schépham."
    - "Aucun site appelé Schépham n’est connu, et nul auteur ancien ne l’a situé. Ceux qui placent Hatsar-Énan à l’oasis de Qaryatayn dans le désert syrien font courir la frontière très à l’est, et ceux qui la placent près de Banias la gardent près de l’Hermon ; Schépham se déplace avec elle, et la carte garde le point à portée de sa Ribla sans prétendre plus. L’unique autre mention possible est l’officier de David Zabdi, « de Schepham », placé « sur les provisions de vin dans les vignes » (« the Shiphmite » dans la King James) ; il pourrait aussi bien venir de Siphmoth, dans le Négev de Juda, où David envoya une part du butin amalécite, et la question ne peut être tranchée."
  it:
    - "Sefam è un punto sul confine orientale della terra promessa come lo traccia il libro dei Numeri prima dell’attraversamento del Giordano: «Traccerete la vostra frontiera orientale da Hatsar-Enan a Scefam; la frontiera scenderà da Scefam verso Ribla, a oriente di Ain; poi la frontiera scenderà, e si estenderà lungo il mare di Kinnereth, a oriente». Si trovava dunque tra Cazar-Enan, l’angolo nord-orientale del paese al confine di Damasco, e una Ribla a est di una sorgente chiamata Ain, da cui la linea scendeva al Lago di Tiberiade; questa Ribla probabilmente non è la Ribla sull’Oronte dove i Babilonesi giudicarono Sedecia, che sembra trovarsi troppo a nord, ma un luogo ignoto, forse nella regione del Monte Ermon e del Golan. Il confine di Ezechiele per il paese restaurato usa altri nomi e omette Sefam."
    - "Non si conosce alcun sito chiamato Sefam, e nessuno scrittore antico lo collocò. Chi pone Cazar-Enan all’oasi di Qaryatein nel deserto siriano porta il confine molto a est, e chi la pone vicino a Banias lo tiene vicino all’Ermon; Sefam si sposta con essa, e la mappa tiene il punto a portata della sua Ribla senza pretendere di più. L’unica altra possibile menzione è l’ufficiale di Davide Zabdi «da Sefam», posto «al prodotto de’ vigneti per fornire le cantine»; la Bibbia sinodale ne fa un uomo di Sefam, ma può altrettanto bene venire da Sifmot nel Negheb di Giuda, a cui Davide mandò parte del bottino amalechita, e la questione non si può decidere."
  pl:
    - "Szefam jest punktem na wschodniej granicy ziemi obiecanej, tak jak rysuje ją Księga Liczb przed przejściem Jordanu: „Granicę też od wschodu wymierzycie od wsi Enan aż do Sefama. A pójdzie ta granica od Sefama aż do Reblat, od wschodu miasta Ain; i uda się ta granica i dojdzie do brzegu morza Cyneret na wschód słońca”. Leżał więc między Chasar-Enan, północno-wschodnim narożnikiem kraju na granicy Damaszku, a Riblą na wschód od źródła zwanego Ain, skąd linia schodziła do Jeziora Galilejskiego; ta Ribla to zapewne nie Ribla nad Orontesem, gdzie Babilończycy sądzili Sedekiasza, która zdaje się leżeć zbyt daleko na północy, lecz nieznane miejsce, może w okolicy góry Hermon i Golanu. Granica Ezechiela dla odnowionego kraju używa innych nazw i pomija Szefam."
    - "Nie znamy żadnego stanowiska zwanego Szefam i żaden dawny pisarz go nie lokalizował. Ci, którzy umieszczają Chasar-Enan w oazie Karjatajn na pustyni syryjskiej, prowadzą granicę daleko na wschód, a ci, którzy umieszczają go blisko Banijas, trzymają ją blisko Hermonu; Szefam przesuwa się razem z nią, a mapa trzyma punkt w zasięgu jego Ribli, nie twierdząc więcej. Jedyna inna możliwa wzmianka to oficer Dawida Zabdi, „Zyfmejczyk”, postawiony „nad urodzajami winnic i nad piwnicami winnemi”; Biblia synodalna czyni go mieszkańcem Szefam, lecz równie dobrze mógł pochodzić z Sifmot w Negewie Judy, dokąd Dawid posłał część łupu amalekickiego, i pytania nie można rozstrzygnąć."
  cs:
    - "Šefam je bod na východní hranici zaslíbené země, jak ji kreslí Numeri před přechodem Jordánu: „Vyměříte sobě také pomezí k východu od vsi Enan až do Sefama. A od Sefama schýlí se to pomezí až k Reblata, od východu maje Ain; a schýlí se pomezí to, a přijde k straně moře Ceneret k východu.“ Ležel tedy mezi Chacar-enanem, severovýchodním rohem země na hranici Damašku, a Riblou východně od pramene zvaného Ajin, odkud čára scházela ke Galilejskému jezeru; tato Ribla nejspíš není Ribla na Orontu, kde Babylóňané soudili Sidkijáše, která se zdá ležet příliš na severu, ale neznámé místo, snad v oblasti hory Hermon a Golanu. Ezechielova hranice obnovené země užívá jiných jmen a Šefam vynechává."
    - "Žádné místo zvané Šefam není známo a žádný starověký spisovatel je nelokalizoval. Ti, kdo kladou Chacar-enan do oázy Karjatajn v syrské poušti, vedou hranici daleko na východ, a ti, kdo jej kladou k Baniásu, ji drží blízko Hermonu; Šefam se posouvá s ním a mapa ponechává bod na dosah své Ribly, aniž tvrdí víc. Jediná další možná zmínka je Davidův úředník Zabdi „Sifmejský“, ustanovený „nad úrodami z vinic i nad sklepy vinnými“; synodální Bible z něj činí muže ze Šefamu, ale stejně dobře mohl pocházet ze Sifmótu v judském Negevu, kam David poslal část amalečské kořisti, a otázku nelze rozhodnout."
  nl:
    - "Sefam is een punt op de oostgrens van het beloofde land zoals Numeri die tekent vóór de oversteek van de Jordaan: “Voorts zult gij u tot een landpale tegen het oosten aftekenen van Hazar-Enan naar Sefam. En deze landpale zal afgaan van Sefam naar Ribla, tegen het oosten van Ain; daarna zal deze landpale afgaan en strekken langs den oever van de zee Cinnereth oostwaarts.” Het lag dus tussen Hazar-Enan, de noordoosthoek van het land aan de grens van Damascus, en een Ribla ten oosten van een bron genaamd Ain, vanwaar de lijn naar het Meer van Galilea afdaalde; dit Ribla is waarschijnlijk niet het Ribla aan de Orontes waar de Babyloniërs Zedekia berechtten, dat te ver naar het noorden lijkt te liggen, maar een onbekende plaats, misschien in het gebied van de Hermon en de Golan. Ezechiëls grens voor het herstelde land gebruikt andere namen en laat Sefam weg."
    - "Geen plaats genaamd Sefam is bekend, en geen antieke schrijver plaatste het. Wie Hazar-Enan bij de oase Qaryatein in de Syrische woestijn zet, trekt de grens ver naar het oosten, en wie het bij Banias zet, houdt haar dicht bij de Hermon; Sefam verschuift mee, en de kaart houdt het punt binnen bereik van zijn Ribla zonder meer te beweren. De enige andere mogelijke vermelding is Davids ambtenaar Zabdi “de Sifmiet”, gesteld “over hetgeen dat van de wijnstokken kwam tot de schatten des wijns”; de Synodale Bijbel maakt hem een man van Sefam, maar hij kan evengoed uit Sifmot in de Negev van Juda zijn gekomen, waarheen David een deel van de Amalekitische buit stuurde, en de vraag is niet te beslechten."
  sv:
    - "Shefam är en punkt på det utlovade landets östra gräns så som Fjärde Mosebok drar den före övergången över Jordan: ”såsom eder gräns i öster skolen I draga upp en linje från Hasar-Enan fram till Sefam. Och från Sefam skall gränsen gå ned till Haribla, öster om Ain, och gränsen skall gå vidare ned och intill bergsluttningen vid Kinneretsjön, österut”. Det låg alltså mellan Hasar-Enan, landets nordöstra hörn vid Damaskus gräns, och ett Rivla öster om en källa kallad Ajin, varifrån linjen löpte ned till Galileiska sjön; detta Rivla är sannolikt inte Rivla vid Orontes där babylonierna dömde Sidkia, som förefaller för långt norrut, utan en okänd plats, kanske i trakten av Hermon och Golan. Hesekiels gräns för det återställda landet använder andra namn och utelämnar Shefam."
    - "Ingen plats som heter Shefam är känd, och ingen antik författare placerade den. De som placerar Hasar-Enan vid oasen Qaryatein i den syriska öknen drar gränsen långt österut, och de som placerar den nära Banias håller den nära Hermon; Shefam flyttar med den, och kartan håller punkten inom räckhåll för dess Rivla utan att hävda mer. Det enda andra möjliga omnämnandet är Davids tjänsteman Savdi, ”sifmiten Sabdi”, satt ”över de vinförråd som man hade samlat i vingårdarna”; den synodala bibeln gör honom till en man från Shefam, men han kan lika gärna ha kommit från Sifmot i Judas Negev, dit David sände en del av amalekiternas byte, och frågan kan inte avgöras."
scripture:
