# Overview article (ADR 0007). Mainstream facts only; Crowfoot's gate is given as the usual but not certain identification, and the date of his find as disputed.
id: valley-gate
place: a81b7b1
title:
  en: "Valley Gate"
  ru: "Ворота Долины"
  uk: "Ворота Долини"
  es: "Puerta del Valle"
  pt: "Porta do Vale"
  de: "Taltor"
  fr: "Porte de la Vallée"
body:
  en:
    - "The Valley Gate was a gate in the west wall of Jerusalem, named for the valley it opened on, whether the central valley that the Greeks called the Tyropoeon or the Hinnom beyond it. Nehemiah's account fixes its position relative to the Dung Gate, “a thousand cubits”, about 450 m, further along the wall to the south, and so near the south-west of the City of David. In 1927 J. W. Crowfoot cleared a massive gateway in the wall on the western slope of that hill above the Tyropoeon, which he and many since have taken for the Valley Gate, though the date of what he found, Jebusite or Hellenistic, and even whether it was a gate, are still argued. Those who think that Nehemiah's city still took in the western hill put the gate instead near today's Jaffa Gate, the second and less likely site on the map."
    - "Uzziah “built towers in Jerusalem at the corner gate, and at the valley gate, and at the turning of the wall, and fortified them”. By this gate Nehemiah rode out on his secret inspection: “I went out by night by the gate of the valley, even before the dragon well, and to the dung port, and viewed the walls of Jerusalem, which were broken down”, then up the brook Kidron, where his beast could no longer pass, “and turned back, and entered by the gate of the valley, and so returned”."
    - "In the repair that followed, “the valley gate repaired Hanun, and the inhabitants of Zanoah; they built it, and set up the doors thereof, the locks thereof, and the bars thereof, and a thousand cubits on the wall unto the dung gate”, the one stretch of the circuit with a measured length. Crowfoot's gate lies today within the City of David archaeological park in Silwan, on the slope above the road through the Tyropoeon, a short walk below the Dung Gate of the Ottoman wall, which keeps the old name a few hundred metres north of the ancient one."
  ru:
    - "Ворота Долины — ворота в западной стене Иерусалима, названные по долине, в которую они выходили: по центральной, которую греки звали Тиропеон, или по Енномовой за ней. Рассказ Неемии закрепляет их место относительно Навозных ворот — «тысячу локтей», около 450 м, дальше по стене к югу, то есть у юго-западной части города Давида. В 1927 году Дж. У. Кроуфут расчистил массивные ворота в стене на западном склоне этого холма над Тиропеоном, которые он и многие после него приняли за ворота Долины, хотя о времени найденного — иевусейском или эллинистическом — и даже о том, были ли это ворота, спорят до сих пор. Те, кто считает, что город Неемии ещё охватывал западный холм, помещают ворота у нынешних Яффских ворот — второе и менее вероятное место на карте."
    - "«Построил Озия башни в Иерусалиме над воротами угольными и над воротами долины и на углу, и укрепил их». Этими воротами Неемия выехал на тайный осмотр: «проехал я ночью через ворота Долины перед источником Драконовым к воротам Навозным, и осмотрел я стены Иерусалима разрушенные», затем поднялся по лощине Кедрона, где животному уже не было прохода, «и проехав опять воротами Долины, возвратился»."
    - "В последовавшей починке «Ворота Долины чинил Ханун и жители Заноаха: они построили их, и вставили двери их, замки их и засовы их, и еще чинили они тысячу локтей стены до ворот Навозных» — единственный участок обхода с измеренной длиной. Ворота Кроуфута лежат сегодня в археологическом парке «Город Давида» в Сильване, на склоне над дорогой через Тиропеон, недалеко вниз от Навозных ворот османской стены, которые сохранили старое имя в нескольких сотнях метров к северу от древних."
  uk:
    - "Ворота Долини були брамою в західному мурі Єрусалима, названою за долину, на яку вони відчинялися, — чи то центральну, яку греки звали Тиропеоном, чи Гінном за нею. Розповідь Неемії визначає її положення відносно Гноєвих воріт — «тисячу локот муру до Гнояних воріт», приблизно 450 м далі вздовж муру на південь, і тому близько південного заходу Міста Давида. У 1927 році Дж. В. Кроуфут розчистив масивну браму в мурі на західному схилі цього пагорба над Тиропеоном, яку він і багато хто після нього вважає Воротами Долини, хоч датування знайденого, євусейське чи елліністичне, і навіть те, чи це була брама, досі оспорюється. Ті, хто думає, що місто Неемії ще охоплювало західний пагорб, ставлять браму натомість біля нинішніх Яффських воріт — друге й менш імовірне місце на мапі."
    - "Уззія: «І збудував Озія башти в Ерусалимі над брамою угловою й над долинною брамою й на углї, та й скріпив їх». Цією брамою Неемія виїхав на свій таємний огляд: «І проїхав я вночі через Долинні ворота перед Драконовою криницею до воріт Гнояних, і оглядїв я розвалені мури Ерусалиму», потім угору потоком Кедрон, де його тварина вже не могла пройти, і, «проїхавши знов через Долинні ворота, вернувся»."
    - "У ремонті, що настав, «Ворота Долинні будував Ханун та осадники Заноаха: вони збудували їх і вставили браму в їх, замки їх і засуви їх, а до того лагодили вони ще тисячу локот муру до Гнояних воріт» — єдина ділянка обводу з виміряною довжиною. Брама Кроуфута нині лежить в археологічному парку Міста Давида в Сільвані, на схилі над дорогою крізь Тиропеон, за короткий перехід нижче від Гноєвих воріт османського муру, які зберігають стару назву за кілька сотень метрів на північ від давніх."
  es:
    - "La Puerta del Valle era una puerta en la muralla occidental de Jerusalén, llamada así por el valle al que se abría, fuera el valle central que los griegos llamaron Tiropeón o el de Hinnom más allá. El relato de Nehemías fija su posición respecto a la Puerta del Muladar, «mil codos», unos 450 m, más adelante en la muralla hacia el sur, y por tanto cerca del suroeste de la Ciudad de David. En 1927 J. W. Crowfoot despejó una puerta maciza en la muralla de la ladera occidental de esa colina, sobre el Tiropeón, que él y muchos desde entonces han tomado por la Puerta del Valle, aunque la fecha de lo que halló, jebuseo o helenístico, e incluso si era una puerta, siguen discutiéndose. Quienes piensan que la ciudad de Nehemías incluía aún la colina occidental sitúan la puerta más bien cerca de la actual Puerta de Jaffa, el segundo y menos probable emplazamiento del mapa."
    - "De Uzías se dice: «Edificó también Uzzías torres en Jerusalem, junto á la puerta del ángulo, y junto á la puerta del valle, y junto á las esquinas; y fortificólas». Por esta puerta salió Nehemías en su inspección secreta: «Y salí de noche por la puerta del Valle hacia la fuente del Dragón y á la puerta del Muladar; y consideré los muros de Jerusalem que estaban derribados», luego subió por el torrente Cedrón, donde su cabalgadura ya no podía pasar, «y regresando entré por la puerta del Valle, y volvíme»."
    - "En la reparación que siguió, «La puerta del Valle la restauró Hanún con los moradores de Zanoa: ellos la reedificaron, y levantaron sus puertas, con sus cerraduras y sus cerrojos, y mil codos en el muro hasta la puerta del Muladar», el único tramo del circuito con una longitud medida. La puerta de Crowfoot se encuentra hoy dentro del parque arqueológico de la Ciudad de David, en Silwan, en la ladera sobre el camino que atraviesa el Tiropeón, a corta distancia bajo la Puerta del Muladar de la muralla otomana, que conserva el nombre antiguo unos cientos de metros al norte de la antigua."
  pt:
    - "A Porta do Vale era uma porta na muralha oeste de Jerusalém, assim chamada pelo vale para o qual se abria, fosse o vale central que os gregos chamavam Tiropeão ou o Hinom, além dele. O relato de Neemias fixa sua posição em relação à Porta do Esterco, “mil côvados”, cerca de 450 m, mais adiante na muralha para o sul, e portanto perto do sudoeste da Cidade de Davi. Em 1927, J. W. Crowfoot desobstruiu um maciço portal na muralha da encosta ocidental dessa colina, acima do Tiropeão, que ele e muitos desde então tomaram pela Porta do Vale, embora a data do que achou, jebusita ou helenística, e até se era uma porta, ainda sejam discutidas. Os que pensam que a cidade de Neemias ainda abrangia a colina ocidental põem a porta perto da atual Porta de Jafa, o segundo e menos provável sítio do mapa."
    - "Uzias “construiu torres em Jerusalém, na porta da esquina, na porta do vale e no ângulo do muro, e as fortificou”. Por esta porta Neemias saiu em sua inspeção secreta: “Eu saí de noite pela Porta do Vale, em direção à Fonte do Chacal, e depois para a Porta do Esterco; e inspecionei as muralhas de Jerusalém, que estavam derrubadas”, depois subiu o ribeiro do Cedrom, onde seu animal já não passava, e “dei meia-volta, entrei pela Porta do Vale e assim retornei”."
    - "No reparo que se seguiu, “Hanum e os habitantes de Zanoa repararam a Porta do Vale. Eles a edificaram, e assentaram as suas portas, os seus ferrolhos e as suas trancas, e também mil côvados da muralha até a Porta do Esterco”, o único trecho do circuito com comprimento medido. A porta de Crowfoot fica hoje dentro do parque arqueológico da Cidade de Davi, em Silwan, na encosta acima da estrada pelo Tiropeão, a curta caminhada abaixo da Porta do Esterco da muralha otomana, que conserva o nome antigo algumas centenas de metros ao norte da antiga."
  de:
    - "Das Taltor war ein Tor in der Westmauer Jerusalems, benannt nach dem Tal, auf das es sich öffnete, sei es das Zentraltal, das die Griechen Tyropoion nannten, oder das Hinnomtal dahinter. Nehemias Bericht legt seine Lage relativ zum Misttor fest, „tausend Ellen“, etwa 450 m, weiter südlich an der Mauer entlang, und damit nahe dem Südwesten der Davidsstadt. 1927 legte J. W. Crowfoot am Westhang jenes Hügels oberhalb des Tyropoion ein massives Tor in der Mauer frei, das er und viele seither für das Taltor halten, obwohl die Datierung des Gefundenen, jebusitisch oder hellenistisch, und sogar, ob es ein Tor war, noch umstritten sind. Wer meint, dass Nehemias Stadt noch den Westhügel umfasste, setzt das Tor stattdessen nahe dem heutigen Jaffa-Tor an, der zweite und weniger wahrscheinliche Ort auf der Karte."
    - "Usija „baute Türme zu Jerusalem am Ecktor und am Taltor und am Winkel und befestigte sie“. Durch dieses Tor ritt Nehemia zu seiner heimlichen Besichtigung hinaus: „Und ich ritt zum Taltor aus bei der Nacht und gegen den Drachenbrunnen und an das Misttor; und es tat mir wehe, daß die Mauern Jerusalems eingerissen waren“, dann den Bach Kidron hinan, wo sein Tier nicht mehr weiterkam, „und kehrte um und kam zum Taltor wieder heim“."
    - "Bei der folgenden Instandsetzung: „Das Taltor bauten Hanun und die Bürger von Sanoah, sie bauten's und setzten ein seine Türen, Schlösser und Riegel, und tausend Ellen an der Mauer bis an das Misttor“, die einzige Strecke des Mauerrings mit gemessener Länge. Crowfoots Tor liegt heute im archäologischen Park der Davidsstadt in Silwan, am Hang über der Straße durch das Tyropoion, einen kurzen Fußweg unterhalb des Misttors der osmanischen Mauer, das den alten Namen einige hundert Meter nördlich des antiken Ortes bewahrt."
  fr:
    - "La Porte de la Vallée était une porte du mur ouest de Jérusalem, nommée d’après la vallée sur laquelle elle s’ouvrait, soit la vallée centrale que les Grecs appelaient le Tyropéon, soit celle de Hinnom au-delà. Le récit de Néhémie fixe sa position par rapport à la Porte du Fumier, à « mille coudées », environ 450 m, plus loin sur le mur vers le sud, donc près du sud-ouest de la Cité de David. En 1927, J. W. Crowfoot dégagea dans le mur, sur le versant ouest de cette colline au-dessus du Tyropéon, une porte massive qu’il a prise, comme beaucoup après lui, pour la Porte de la Vallée, bien que la date de sa trouvaille, jébusite ou hellénistique, et même son statut de porte, soient discutés. Ceux qui pensent que la ville de Néhémie englobait encore la colline occidentale la placent plutôt près de l’actuelle porte de Jaffa, second site, moins probable, de la carte."
    - "Ozias « bâtit des tours à Jérusalem sur la porte de l’angle, sur la porte de la vallée, et sur l’angle, et il les fortifia ». Par cette porte Néhémie sortit pour son inspection secrète : « Je sortis de nuit par la porte de la vallée, et je me dirigeai contre la source du dragon et vers la porte du fumier, considérant les murailles en ruines de Jérusalem », puis il remonta le torrent du Cédron, où sa bête ne pouvait plus passer, « Puis je rentrai par la porte de la vallée, et je fus ainsi de retour »."
    - "Dans la réparation qui suivit, « Hanun et les habitants de Zanoach réparèrent la porte de la vallée. Ils la bâtirent, et en posèrent les battants, les verrous et les barres. Ils firent de plus mille coudées de mur jusqu’à la porte du fumier », le seul tronçon du pourtour dont la longueur soit mesurée. La porte de Crowfoot se trouve aujourd’hui dans le parc archéologique de la Cité de David à Silwan, sur la pente au-dessus de la route qui traverse le Tyropéon, à quelques pas en contrebas de la Porte du Fumier de la muraille ottomane, qui garde l’ancien nom à quelques centaines de mètres au nord de l’ancienne."
