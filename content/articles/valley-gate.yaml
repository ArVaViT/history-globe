body:
  en:
    - "The Valley Gate was a gate in the west wall of Jerusalem, named for the valley it opened on, whether the central valley that the Greeks called the Tyropoeon or the Hinnom beyond it. Nehemiah's account fixes its position relative to the Dung Gate, “a thousand cubits”, about 450 m, further along the wall to the south, and so near the south-west of the City of David. In 1927 J. W. Crowfoot cleared a massive gateway in the wall on the western slope of that hill above the Tyropoeon, which he and many since have taken for the Valley Gate, though the date of what he found, Jebusite or Hellenistic, and even whether it was a gate, are still argued. Those who think that Nehemiah's city still took in the western hill put the gate instead near today's Jaffa Gate, the second and less likely site on the map."
    - "Uzziah “built towers in Jerusalem at the corner gate, and at the valley gate, and at the turning of the wall, and fortified them”. By this gate Nehemiah rode out on his secret inspection: “I went out by night by the gate of the valley, even before the dragon well, and to the dung port, and viewed the walls of Jerusalem, which were broken down”, then, past the place where his beast could no longer pass, up the brook Kidron, “and turned back, and entered by the gate of the valley, and so returned”."
    - "In the repair that followed, “the valley gate repaired Hanun, and the inhabitants of Zanoah; they built it, and set up the doors thereof, the locks thereof, and the bars thereof, and a thousand cubits on the wall unto the dung gate”, the one stretch of the circuit with a measured length. The site of Crowfoot's gate, in Silwan a little south of today's Givati parking lot, is now covered by modern buildings and cannot be seen; the Dung Gate of the Ottoman wall, a short walk to the north, keeps the old name a few hundred metres north of the ancient one."
  ru:
    - "Ворота Долины — ворота в западной стене Иерусалима, названные по долине, в которую они выходили: по центральной, которую греки звали Тиропеон, или по Енномовой за ней. Рассказ Неемии закрепляет их место относительно Навозных ворот — «тысячу локтей», около 450 м, дальше по стене к югу, то есть у юго-западной части города Давида. В 1927 году Дж. У. Кроуфут расчистил массивные ворота в стене на западном склоне этого холма над Тиропеоном, которые он и многие после него приняли за ворота Долины, хотя о времени найденного — иевусейском или эллинистическом — и даже о том, были ли это ворота, спорят до сих пор. Те, кто считает, что город Неемии ещё охватывал западный холм, помещают ворота у нынешних Яффских ворот — второе и менее вероятное место на карте."
    - "«Построил Озия башни в Иерусалиме над воротами угольными и над воротами долины и на углу, и укрепил их». Этими воротами Неемия выехал на тайный осмотр: «проехал я ночью через ворота Долины перед источником Драконовым к воротам Навозным, и осмотрел я стены Иерусалима разрушенные», затем, миновав место, где животному уже не было прохода, поднялся по лощине Кедрона, «и проехав опять воротами Долины, возвратился»."
    - "В последовавшей починке «Ворота Долины чинил Ханун и жители Заноаха: они построили их, и вставили двери их, замки их и засовы их, и еще чинили они тысячу локтей стены до ворот Навозных» — единственный участок обхода с измеренной длиной. Место ворот Кроуфута, в Сильване немного южнее нынешней автостоянки Гивати, сегодня застроено современными зданиями, и увидеть его нельзя; Навозные ворота османской стены, недалеко к северу, сохранили старое имя в нескольких сотнях метров к северу от древних."
  uk:
    - "Ворота Долини були брамою в західному мурі Єрусалима, названою за долину, на яку вони відчинялися, — чи то центральну, яку греки звали Тиропеоном, чи Гінном за нею. Розповідь Неемії визначає її положення відносно Гноєвих воріт — «тисячу локот муру до Гнояних воріт», приблизно 450 м далі вздовж муру на південь, і тому близько південного заходу Міста Давида. У 1927 році Дж. В. Кроуфут розчистив масивну браму в мурі на західному схилі цього пагорба над Тиропеоном, яку він і багато хто після нього вважає Воротами Долини, хоч датування знайденого, євусейське чи елліністичне, і навіть те, чи це була брама, досі оспорюється. Ті, хто думає, що місто Неемії ще охоплювало західний пагорб, ставлять браму натомість біля нинішніх Яффських воріт — друге й менш імовірне місце на мапі."
    - "Уззія: «І збудував Озія башти в Ерусалимі над брамою угловою й над долинною брамою й на углї, та й скріпив їх». Цією брамою Неемія виїхав на свій таємний огляд: «І проїхав я вночі через Долинні ворота перед Драконовою криницею до воріт Гнояних, і оглядїв я розвалені мури Ерусалиму», потім, повз місце, де його тварина вже не могла пройти, угору потоком Кедрон, і, «проїхавши знов через Долинні ворота, вернувся»."
    - "У ремонті, що настав, «Ворота Долинні будував Ханун та осадники Заноаха: вони збудували їх і вставили браму в їх, замки їх і засуви їх, а до того лагодили вони ще тисячу локот муру до Гнояних воріт» — єдина ділянка обводу з виміряною довжиною. Місце брами Кроуфута, у Сільвані трохи на південь від нинішньої автостоянки Гіваті, тепер забудоване сучасними будинками, і побачити його не можна; Гноєві ворота османського муру, за короткий перехід на північ, зберігають стару назву за кілька сотень метрів на північ від давніх."
  es:
    - "La Puerta del Valle era una puerta en la muralla occidental de Jerusalén, llamada así por el valle al que se abría, fuera el valle central que los griegos llamaron Tiropeón o el de Hinnom más allá. El relato de Nehemías fija su posición respecto a la Puerta del Muladar, «mil codos», unos 450 m, más adelante en la muralla hacia el sur, y por tanto cerca del suroeste de la Ciudad de David. En 1927 J. W. Crowfoot despejó una puerta maciza en la muralla de la ladera occidental de esa colina, sobre el Tiropeón, que él y muchos desde entonces han tomado por la Puerta del Valle, aunque la fecha de lo que halló, jebuseo o helenístico, e incluso si era una puerta, siguen discutiéndose. Quienes piensan que la ciudad de Nehemías incluía aún la colina occidental sitúan la puerta más bien cerca de la actual Puerta de Jaffa, el segundo y menos probable emplazamiento del mapa."
    - "De Uzías se dice: «Edificó también Uzzías torres en Jerusalem, junto á la puerta del ángulo, y junto á la puerta del valle, y junto á las esquinas; y fortificólas». Por esta puerta salió Nehemías en su inspección secreta: «Y salí de noche por la puerta del Valle hacia la fuente del Dragón y á la puerta del Muladar; y consideré los muros de Jerusalem que estaban derribados», luego, pasado el lugar donde su cabalgadura ya no podía pasar, subió por el torrente Cedrón, «y regresando entré por la puerta del Valle, y volvíme»."
    - "En la reparación que siguió, «La puerta del Valle la restauró Hanún con los moradores de Zanoa: ellos la reedificaron, y levantaron sus puertas, con sus cerraduras y sus cerrojos, y mil codos en el muro hasta la puerta del Muladar», el único tramo del circuito con una longitud medida. El lugar de la puerta de Crowfoot, en Silwan, un poco al sur del actual aparcamiento Givati, está hoy cubierto por edificios modernos y no puede verse; la Puerta del Muladar de la muralla otomana, a corta distancia al norte, conserva el nombre antiguo unos cientos de metros al norte de la antigua."
  pt:
    - "A Porta do Vale era uma porta na muralha oeste de Jerusalém, assim chamada pelo vale para o qual se abria, fosse o vale central que os gregos chamavam Tiropeão ou o Hinom, além dele. O relato de Neemias fixa sua posição em relação à Porta do Esterco, “mil côvados”, cerca de 450 m, mais adiante na muralha para o sul, e portanto perto do sudoeste da Cidade de Davi. Em 1927, J. W. Crowfoot desobstruiu um maciço portal na muralha da encosta ocidental dessa colina, acima do Tiropeão, que ele e muitos desde então tomaram pela Porta do Vale, embora a data do que achou, jebusita ou helenística, e até se era uma porta, ainda sejam discutidas. Os que pensam que a cidade de Neemias ainda abrangia a colina ocidental põem a porta perto da atual Porta de Jafa, o segundo e menos provável sítio do mapa."
    - "Uzias “construiu torres em Jerusalém, na porta da esquina, na porta do vale e no ângulo do muro, e as fortificou”. Por esta porta Neemias saiu em sua inspeção secreta: “Eu saí de noite pela Porta do Vale, em direção à Fonte do Chacal, e depois para a Porta do Esterco; e inspecionei as muralhas de Jerusalém, que estavam derrubadas”, depois, passado o lugar onde seu animal já não passava, subiu o ribeiro do Cedrom, e “dei meia-volta, entrei pela Porta do Vale e assim retornei”."
    - "No reparo que se seguiu, “Hanum e os habitantes de Zanoa repararam a Porta do Vale. Eles a edificaram, e assentaram as suas portas, os seus ferrolhos e as suas trancas, e também mil côvados da muralha até a Porta do Esterco”, o único trecho do circuito com comprimento medido. O local da porta de Crowfoot, em Silwan, um pouco ao sul do atual estacionamento Givati, está hoje coberto por edifícios modernos e não pode ser visto; a Porta do Esterco da muralha otomana, a curta caminhada ao norte, conserva o nome antigo algumas centenas de metros ao norte da antiga."
  de:
    - "Das Taltor war ein Tor in der Westmauer Jerusalems, benannt nach dem Tal, auf das es sich öffnete, sei es das Zentraltal, das die Griechen Tyropoion nannten, oder das Hinnomtal dahinter. Nehemias Bericht legt seine Lage relativ zum Misttor fest, „tausend Ellen“, etwa 450 m, weiter südlich an der Mauer entlang, und damit nahe dem Südwesten der Davidsstadt. 1927 legte J. W. Crowfoot am Westhang jenes Hügels oberhalb des Tyropoion ein massives Tor in der Mauer frei, das er und viele seither für das Taltor halten, obwohl die Datierung des Gefundenen, jebusitisch oder hellenistisch, und sogar, ob es ein Tor war, noch umstritten sind. Wer meint, dass Nehemias Stadt noch den Westhügel umfasste, setzt das Tor stattdessen nahe dem heutigen Jaffa-Tor an, der zweite und weniger wahrscheinliche Ort auf der Karte."
    - "Usija „baute Türme zu Jerusalem am Ecktor und am Taltor und am Winkel und befestigte sie“. Durch dieses Tor ritt Nehemia zu seiner heimlichen Besichtigung hinaus: „Und ich ritt zum Taltor aus bei der Nacht und gegen den Drachenbrunnen und an das Misttor; und es tat mir wehe, daß die Mauern Jerusalems eingerissen waren“, dann, vorbei an der Stelle, wo sein Tier nicht mehr weiterkam, den Bach Kidron hinan, „und kehrte um und kam zum Taltor wieder heim“."
    - "Bei der folgenden Instandsetzung: „Das Taltor bauten Hanun und die Bürger von Sanoah, sie bauten's und setzten ein seine Türen, Schlösser und Riegel, und tausend Ellen an der Mauer bis an das Misttor“, die einzige Strecke des Mauerrings mit gemessener Länge. Die Stelle von Crowfoots Tor, in Silwan etwas südlich des heutigen Givati-Parkplatzes, ist heute von modernen Gebäuden überbaut und nicht zu sehen; das Misttor der osmanischen Mauer, einen kurzen Fußweg nördlich, bewahrt den alten Namen einige hundert Meter nördlich des antiken Ortes bewahrt."
  fr:
    - "La Porte de la Vallée était une porte du mur ouest de Jérusalem, nommée d’après la vallée sur laquelle elle s’ouvrait, soit la vallée centrale que les Grecs appelaient le Tyropéon, soit celle de Hinnom au-delà. Le récit de Néhémie fixe sa position par rapport à la Porte du Fumier, à « mille coudées », environ 450 m, plus loin sur le mur vers le sud, donc près du sud-ouest de la Cité de David. En 1927, J. W. Crowfoot dégagea dans le mur, sur le versant ouest de cette colline au-dessus du Tyropéon, une porte massive qu’il a prise, comme beaucoup après lui, pour la Porte de la Vallée, bien que la date de sa trouvaille, jébusite ou hellénistique, et même son statut de porte, soient discutés. Ceux qui pensent que la ville de Néhémie englobait encore la colline occidentale la placent plutôt près de l’actuelle porte de Jaffa, second site, moins probable, de la carte."
    - "Ozias « bâtit des tours à Jérusalem sur la porte de l’angle, sur la porte de la vallée, et sur l’angle, et il les fortifia ». Par cette porte Néhémie sortit pour son inspection secrète : « Je sortis de nuit par la porte de la vallée, et je me dirigeai contre la source du dragon et vers la porte du fumier, considérant les murailles en ruines de Jérusalem », puis, passé l’endroit où sa bête ne pouvait plus passer, il remonta le torrent du Cédron, « Puis je rentrai par la porte de la vallée, et je fus ainsi de retour »."
    - "Dans la réparation qui suivit, « Hanun et les habitants de Zanoach réparèrent la porte de la vallée. Ils la bâtirent, et en posèrent les battants, les verrous et les barres. Ils firent de plus mille coudées de mur jusqu’à la porte du fumier », le seul tronçon du pourtour dont la longueur soit mesurée. L’emplacement de la porte de Crowfoot, à Silwan, un peu au sud de l’actuel parking Givati, est aujourd’hui recouvert de bâtiments modernes et ne peut être vu ; la Porte du Fumier de la muraille ottomane, à quelques pas au nord, garde l’ancien nom à quelques centaines de mètres au nord de l’ancienne."
  pl:
    - "Brama Doliny była bramą w zachodnim murze Jerozolimy, nazwaną od doliny, na którą się otwierała, czy to doliny środkowej, którą Grecy nazywali Tyropoeon, czy Hinnom za nią. Relacja Nehemiasza ustala jej położenie względem Bramy Gnojnej: „tysiąc łokci”, około 450 m, dalej wzdłuż muru na południe, a więc blisko południowego zachodu Miasta Dawida. W 1927 roku J. W. Crowfoot odsłonił masywną bramę w murze na zachodnim stoku tego wzgórza nad Tyropoeonem, którą on i wielu po nim uznało za Bramę Doliny, choć datowanie tego, co znalazł, jebusyckie czy hellenistyczne, a nawet to, czy była to brama, są nadal przedmiotem sporu. Ci, którzy uważają, że miasto Nehemiasza obejmowało jeszcze wzgórze zachodnie, umieszczają bramę raczej blisko dzisiejszej Bramy Jafskiej, drugie i mniej prawdopodobne stanowisko na mapie."
    - "Uzzjasz, jak czytamy: „I budował Uzyjasz wieże w Jeruzalemie nad bramą narożną, i nad bramą doliny, i nad Mikzoa, i umocnił je”. Tą bramą Nehemiasz wyjechał na swój tajny przegląd: „I wyjechałem bramą nad doliną w nocy, ku żródłu smoczemu, i ku bramie gnojowej, i oglądałem mury Jeruzalemskie, które były rozwalone”, potem, minąwszy miejsce, gdzie jego zwierzę nie mogło już przejść, w górę potoku Cedron, i „skąd wracając się, wyjechałem bramą nad doliną, i takiem powrócił”."
    - "Przy późniejszej naprawie „Bramy nad doliną poprawiał Chanun, i obywatele Zanoe; cić ją budowali, i przyprawili wrota do niej, zamki jej, i zawory jej; i na tysiąc łokci muru aż do bramy gnojowej”, jedyny odcinek obwodu o zmierzonej długości. Miejsce bramy Crowfoota, w Silwanie nieco na południe od dzisiejszego parkingu Givati, jest dziś zabudowane nowoczesnymi budynkami i nie można go zobaczyć; Brama Gnojna muru osmańskiego, krótki spacer na północ, zachowuje starą nazwę kilkaset metrów na północ od starożytnej."
  it:
    - "La Porta della Valle era una porta nel muro occidentale di Gerusalemme, così detta dalla valle su cui si apriva, fosse la valle centrale che i Greci chiamavano Tiropeo o quella di Innom al di là. Il racconto di Neemia ne fissa la posizione rispetto alla Porta del Letame: «mille cubiti», circa 450 m, più avanti lungo il muro verso sud, e quindi vicino al sud-ovest della Città di Davide. Nel 1927 J. W. Crowfoot liberò una massiccia porta nel muro sul pendio occidentale di quella collina sopra il Tiropeo, che egli e molti dopo di lui hanno ritenuto la Porta della Valle, benché la data di ciò che trovò, gebusea o ellenistica, e perfino se fosse una porta, siano ancora discusse. Chi pensa che la città di Neemia comprendesse ancora la collina occidentale pone la porta invece vicino all’odierna Porta di Giaffa, il secondo sito, meno probabile, sulla mappa."
    - "Ozia «costruì pure delle torri a Gerusalemme sulla porta dell’angolo, sulla porta della valle e sullo svolto, e le fortificò». Da questa porta Neemia uscì per la sua ispezione segreta: «Ed uscii di notte per la porta della Valle, e mi diressi verso la sorgente del Dragone e la porta del Letame, considerando le mura di Gerusalemme, com’erano rotte e come le sue porte erano consumate dal fuoco», poi, oltrepassato il punto dove la sua cavalcatura non poteva più passare, risalì il Cedron, e, «rientrato per la porta della Valle, me ne tornai a casa»."
    - "Nella riparazione che seguì, «Hanun e gli abitanti di Zanoah restaurarono la porta della Valle; la costruirono, vi posero le imposte, le serrature e le sbarre. Fecero inoltre mille cubiti di muro fino alla porta del Letame», l’unico tratto del circuito di cui sia data la lunghezza. Il luogo della porta di Crowfoot, a Silwan poco a sud dell’attuale parcheggio Givati, è oggi coperto da edifici moderni e non è visibile; la Porta del Letame del muro ottomano, a breve distanza a nord, conserva l’antico nome qualche centinaio di metri a nord di quella antica."
  nl:
    - "De Dalpoort was een poort in de westmuur van Jeruzalem, genoemd naar het dal waarop ze uitkwam, hetzij het middendal dat de Grieken het Tyropoeondal noemden, hetzij het Hinnomdal erachter. Het verslag van Nehemia legt haar ligging vast ten opzichte van de Mestpoort, “duizend ellen”, ongeveer 450 m, verder langs de muur naar het zuiden, en dus bij het zuidwesten van de Stad van David. In 1927 legde J.W. Crowfoot een massieve poortbouw bloot in de muur op de westelijke helling van die heuvel boven het Tyropoeon, die hij en velen sindsdien voor de Dalpoort hielden, hoewel de datering van wat hij vond, Jebusitisch of Hellenistisch, en zelfs of het een poort was, nog steeds wordt betwist. Wie meent dat de stad van Nehemia nog de westelijke heuvel omvatte, plaatst de poort liever in de buurt van de huidige Jaffapoort, de tweede en minder waarschijnlijke plek op de kaart."
    - "“Daartoe bouwde Uzzia torens te Jeruzalem, aan de Hoekpoort en aan de Dalpoort, en aan de hoeken; en hij sterkte ze.” Door deze poort trok Nehemia uit voor zijn geheime inspectie: “ik trok uit bij nacht door de Dalpoort, en voorbij de Drakenfontein, en naar de Mistpoort, en ik brak aan de muren van Jeruzalem, dewelke verscheurd waren”, daarna, voorbij de plek waar zijn dier niet verder kon, langs de beek Kidron omhoog, “en ik keerde weder, en kwam in door de Dalpoort; alzo keerde ik wederom”."
    - "Bij het herstel dat volgde: “De Dalpoort verbeterden Hanun, en de inwoners van Zanoah; zij bouwden die, en richtten haar deuren op, met haar sloten en haar grendelen; daartoe duizend ellen aan den muur, tot aan de Mistpoort”, het enige stuk van de omtrek met een gemeten lengte. De plek van de poort van Crowfoot, in Silwan iets ten zuiden van het huidige Givati-parkeerterrein, is nu door moderne gebouwen overdekt en niet te zien; de Mestpoort van de Ottomaanse muur, een korte wandeling naar het noorden, bewaart de oude naam enkele honderden meters ten noorden van de antieke."
  cs:
    - "Brána v údolí byla brána v západní hradbě Jeruzaléma, pojmenovaná podle údolí, na které se otevírala, ať už šlo o střední údolí, které Řekové nazývali Tyropoion, nebo o Hinnom za ním. Nehemjášův popis určuje její polohu vzhledem k Hnojné bráně, „na tisíc loket“, asi 450 m, dále po hradbě na jih, a tedy poblíž jihozápadu Města Davidova. V roce 1927 odkryl J. W. Crowfoot v hradbě na západním svahu onoho pahorku nad Tyropoionem mohutnou bránu, kterou on i mnozí od té doby pokládali za Bránu v údolí, ačkoli datování nálezu, jebúsejské nebo helénistické, a dokonce i to, zda šlo o bránu, je dosud sporné. Ti, kdo soudí, že Nehemjášovo město ještě zahrnovalo západní pahorek, kladou bránu místo toho poblíž dnešní Jaffské brány, druhého a méně pravděpodobného místa na mapě."
    - "Uzijáš „vzdělal … věže v Jeruzalémě u brány úhlové, a u brány údolí, a u Mikzoa, i upevnil je“. Touto branou vyjel Nehemjáš na své tajné ohledání: „I vyjel jsem branou při údolí v noci k studnici drakové a k bráně hnojné, a ohledoval jsem zdí Jeruzalémských, kteréž byly pobořené“, pak, kolem místa, kde jeho zvíře už nemohlo projít, vzhůru podél potoka Kidron, „vjel jsem branou při údolí, a tak jsem se navrátil“."
    - "Při následné opravě: „Bránu při údolí opravil Chanun s obyvateli Zanoe. Oni ji stavěli, a vstavili vrata její s zámky i závorami jejími, a zdi na tisíc loket až do brány hnojné“, což je jediný úsek obvodu s měřenou délkou. Místo Crowfootovy brány, v Silwánu kousek jižně od dnešního parkoviště Givati, je dnes zastavěno moderními budovami a není vidět; Hnojná brána osmanské hradby, kousek pěšky na sever, si podržela staré jméno několik set metrů severně od starověké."
  sv:
    - "Dalporten var en port i Jerusalems västra mur, uppkallad efter dalen den öppnade sig mot, antingen den centrala dalen som grekerna kallade Tyropoeon eller Hinnom bortom den. Nehemjas berättelse fastställer dess läge i förhållande till Dyngporten, ”ett tusen alnar”, omkring 450 m, längre fram på muren åt söder, och alltså nära sydvästra delen av Davids stad. År 1927 frilade J. W. Crowfoot en massiv portanläggning i muren på den kullens västra sluttning ovanför Tyropoeon, som han och många sedan har tagit för Dalporten, fast dateringen av vad han fann, jebusitisk eller hellenistisk, och till och med om det var en port, fortfarande diskuteras. De som menar att Nehemjas stad fortfarande omfattade västra kullen förlägger i stället porten nära dagens Jaffaport, den andra och mindre sannolika platsen på kartan."
    - "Ussia ”byggde torn i Jerusalem över Hörnporten och över Dalporten och över Vinkeln och befäste dem”. Genom denna port red Nehemja ut på sin hemliga inspektion: ”Och jag drog om natten ut genom Dalporten fram emot Drakkällan och Dyngporten och besåg Jerusalems murar, huru de voro nedbrutna”, sedan, förbi platsen där hans djur inte längre kunde passera, uppför bäcken Kidron, och ”vände sedan åter in genom Dalporten och kom så tillbaka”."
    - "Vid reparationen som följde, ”Dalporten sattes i stånd av Hanun och Sanoas invånare; de byggde upp den och satte in dess dörrar, dess riglar och bommar. De byggde ock ett tusen alnar på muren, ända fram till Dyngporten”, den enda sträckan av muren med uppmätt längd. Platsen för Crowfoots port, i Silwan något söder om dagens Givati-parkering, är nu täckt av moderna byggnader och kan inte ses; Dyngporten i den ottomanska muren, en kort promenad norrut, bevarar det gamla namnet några hundra meter norr om den forntida."
  nb:
    - "Dalporten var en port i Jerusalems vestmur, oppkalt etter dalen den åpnet mot, enten den sentrale dalen som grekerne kalte Tyropoion eller Hinnom hinsides den. Nehemjas beretning fastlegger beliggenheten i forhold til Møkkporten, «tusen alen», omkring 450 m, lenger sør langs muren, og dermed nær sørvest i Davidsbyen. I 1927 ryddet J. W. Crowfoot en massiv portåpning i muren på vestskråningen av den høyden over Tyropoion, som han og mange siden har tatt for Dalporten, selv om dateringen av det han fant, jebusittisk eller hellenistisk, og selv om det var en port, fortsatt diskuteres. De som mener at Nehemjas by fortsatt omfattet vesthøyden, plasserer porten i stedet nær dagens Jaffaporten, det andre og mindre sannsynlige stedet på kartet."
    - "Ussia «bygget tårn i Jerusalem ved Hjørneporten og ved Dalporten og ved Vinkelen og gjorde således disse steder faste og sterke». Gjennom denne porten red Nehemja ut på sin hemmelige inspeksjon: «Jeg drog om natten ut gjennem Dalporten og bortimot Dragekilden og kom til Møkkporten. Jeg så på Jerusalems murer som var nedrevet», så, forbi stedet der dyret hans ikke lenger kom fram, opp Kedron-dalen, «og gikk atter inn gjennem Dalporten og vendte så tilbake igjen»."
    - "I reparasjonen som fulgte heter det: «Dalporten blev satt i stand av Hanun og innbyggerne i Sanoah; de bygget den og satte inn dører, låser og slåer; de bygget også tusen alen av muren, til Møkkporten», den ene strekningen av omkretsen med målt lengde. Stedet for Crowfoots port, i Silwan litt sør for dagens Givati-parkeringsplass, er nå dekket av moderne bygninger og kan ikke ses; Møkkporten i den osmanske muren, en kort spasertur mot nord, bevarer det gamle navnet noen hundre meter nord for den antikke."
  tl:
    - "Ang Pintuang-bayan ng Libis ay pintuang-bayan sa kanlurang pader ng Jerusalem, ipinangalan sa libis na binubuksan nito, ang gitnang libis na tinawag ng mga Griego na Tyropoeon o ang Hinnom sa kabila nito. Itinatakda ng salaysay ni Nehemias ang posisyon nito kaugnay ng Pintuang-bayan ng Dumi, “isang libong siko”, mga 450 m, pa-timog sa pader, kaya malapit sa timog-kanluran ng Bayan ni David. Noong 1927, nilinis ni J. W. Crowfoot ang isang malaking pasukan sa pader sa kanlurang dalisdis ng burol na iyon sa itaas ng Tyropoeon, na kinilala niya at ng marami pagkaraan na Pintuang-bayan ng Libis, bagaman pinagtatalunan pa ang petsa ng natagpuan niya, Jebuseo o Helenistiko, at kung pintuan nga ito. Ang mga naniniwalang kasama pa sa lunsod ni Nehemias ang kanlurang burol ay naglalagay ng pintuan malapit sa Pintuang Jaffa ngayon, ang ikalawa at mas di-malamang na pook sa mapa."
    - "Si Uzzias ay “nagtayo ng mga moog sa Jerusalem sa pintuang-bayan na nasa panulok, at sa pintuang-bayan sa libis, at sa pagliko ng kuta, at mga pinagtibay”. Dito lumabas si Nehemias sa kaniyang lihim na pagsusuri: “lumabas ng kinagabihan sa pintuang-bayan ng libis, sa makatuwid baga'y sa dako ng balon ng dragon, at sa pintuang-bayan ng tapunan ng dumi, at minasdan ko ang mga kuta ng Jerusalem, na nangabagsak”, pagkatapos, lampas sa lugar na hindi na madaanan ng kaniyang hayop, paakyat sa batis ng Cedron, “ako'y bumalik, at pumasok sa pintuang-bayan ng libis, at sa gayo'y pumihit ako”."
    - "Sa sumunod na pagkukumpuni, “Ang pintuang-bayan ng libis ay hinusay ni Hanun, at ng mga taga Zanoa; kanilang itinayo, at inilagay ang mga pinto niyaon, ang mga trangka niyaon, at ang mga halang niyaon, at isang libong siko sa kuta hanggang sa pintuang-bayan ng tapunan ng dumi”, ang tanging bahagi ng palibot na may sukat ang haba. Ang pook ng pintuan ni Crowfoot, sa Silwan nang kaunti sa timog ng paradahan ng Givati ngayon, ay natatakpan na ng makabagong gusali at hindi makita; ang Pintuang-bayan ng Dumi ng pader na Otomano, maikling lakad sa hilaga, ay nagpapanatili ng lumang pangalan ilang daang metro sa hilaga ng sinaunang isa."
  da:
    - "Dalporten var en port i Jerusalems vestmur, opkaldt efter den dal, den åbnede mod, enten den centrale dal, som grækerne kaldte Tyropoion, eller Hinnom bagved. Nehemias' beretning fastlægger dens beliggenhed i forhold til Møgporten, »tusinde Alen«, omkring 450 m, videre ad muren mod syd, og dermed nær Davidsbyens sydvestlige del. I 1927 ryddede J. W. Crowfoot en massiv portåbning i muren på den vestlige skråning af den bakke over Tyropoion, som han og mange siden har taget for Dalporten, selv om dateringen af det, han fandt, jebusitisk eller hellenistisk, og endda om det var en port, stadig er omstridt. Dem, der mener, at Nehemias' by stadig omfattede den vestlige bakke, placerer porten i stedet nær nutidens Jaffa-port, kortets andet og mindre sandsynlige sted."
    - "Uzzija byggede »Taarne i Jerusalem ved Hjørneporten og ved Dalporten og paa Hjørnet og befæstede dem«. Ved denne port red Nehemias ud på sin hemmelige inspektion: »Og jeg drog ud ad Dalporten om Natten og hen imod Dragekilden og hen til Møgporten, og jeg undersøgte Jerusalems Mure, som vare nedrevne«, derefter, forbi det sted, hvor hans dyr ikke længere kunne komme frem, op ad Kedron-bækken, »og jeg vendte om og kom ind ad Dalporten og vendte tilbage«."
    - "Ved genopbygningen, der fulgte: »Dalporten istandsatte Hanun og Indbyggerne af Sanoa; de byggede den og indsatte dens Døre, med dens Laase og dens Stænger, og tusinde Alen paa Muren indtil Møgporten«, det ene stykke af omkredsen med en målt længde. Stedet for Crowfoots port, i Silwan lidt syd for nutidens Givati-parkeringsplads, er nu dækket af moderne bygninger og kan ikke ses; Møgporten i den osmanniske mur, et kort stykke mod nord, bevarer det gamle navn nogle hundrede meter nord for den antikke."
  sr:
    - "Капија долинска била је капија у западном зиду Јерусалима, названа по долини на коју се отварала, било да је то средишња долина коју су Грци звали Тиропеонском или долина Енон иза ње. Немијин извештај утврђује њен положај у односу на Ђубрену капију, „хиљаду лаката“, око 450 м, даље дуж зида на југ, и тако близу југозапада Давидовог града. Џ. В. Кроуфут је 1927. очистио масивни улаз у зиду на западној падини тог брда изнад Тиропеона, који су он и многи после њега узимали за Капију долинску, мада се још расправља о датуму онога што је нашао, јевусејском или хеленистичком, па чак и о томе да ли је била капија. Они који мисле да је Немијин град још обухватао западно брдо смештају капију уместо тога близу данашње Јафске капије, друго и мање вероватно налазиште на карти."
    - "„И сазида Озија куле у Јерусалиму на вратима на углу, и на вратима у долу, и на углу, и утврди их.“ Овом капијом Немија је излазио на своју тајну инспекцију: „изиђох ноћу на врата од долине, на извор змајевски, и на врата гнојна, и разгледах зидове јерусалимске како беху разваљени“, затим, мимо места где његова животиња више није могла проћи, уз поток Кедрон, „па се вратих на врата од долине, и тако дођох натраг“."
    - "У обнови која је уследила: „Врата долинска поправља Анун са становницима занојским; они их саградише и метнуше крила и браве и преворнице, и хиљаду лаката зида до гнојних врата“, једина деоница обима са измереном дужином. Место Кроуфутове капије, у Силвану нешто јужно од данашњег паркинга Гивати, сада је покривено савременим зградама и не може се видети; Ђубрена капија османског зида, кратка шетња на север, чува старо име неколико стотина метара северно од древне."
