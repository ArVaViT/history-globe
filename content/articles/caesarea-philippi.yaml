# Overview article (ADR 0007). Mainstream facts only; the founding is dated about 3 BC as in place-life.yaml, and the disputed site of Herod's temple to Augustus is named as such.
id: caesarea-philippi
place: ab7bf48
title:
  en: "Caesarea Philippi"
  ru: "Кесария Филиппова"
  uk: "Кесарія Пилипова"
  es: "Cesarea de Filipo"
  pt: "Cesareia de Filipe"
  de: "Caesarea Philippi"
  fr: "Césarée de Philippe"
  it: "Cesarea di Filippo"
  pl: "Cezarea Filipowa"
  nl: "Caesarea Filippi"
  cs: "Cesarea Filipova"
body:
  en:
    - "Caesarea Philippi lay at the southern foot of Mount Hermon, where one of the main springs of the Jordan flows out from below a cliff and a large cave; the site is today's Banias in the Golan Heights. In the Hellenistic age the cave was sacred to the Greek god Pan, and the place was called the Panium or Paneas. About 200 BC Antiochus III defeated the Ptolemaic general Scopas near the Panium, and the land passed from the Ptolemies to the Seleucids."
    - "In 20 BC Augustus gave Herod the Great the territory of Zenodorus, which included Paneas, and Herod built a temple of white stone to Augustus near the Panium. Where it stood is disputed: some place it in front of the cave, others at Omrit, a few kilometres to the south-west. Around 3 BC Herod's son Philip the tetrarch built a city at the springs as his capital and named it Caesarea; it was called Caesarea Philippi to tell it from Caesarea on the coast."
    - 'When Jesus came "into the coasts of Caesarea Philippi", he asked his disciples whom men said that he was, and Peter answered, "Thou art the Christ, the Son of the living God." In Matthew, Jesus then says to him, "thou art Peter, and upon this rock I will build my church", and promises him the keys of the kingdom of heaven. Mark tells the same exchange on the way to the towns of Caesarea Philippi.'
    - "King Agrippa II enlarged the city and renamed it Neronias in honour of Nero. In AD 67 Vespasian rested his army there for twenty days as Agrippa's guest, and in 70, after the fall of Jerusalem, Titus held games there in which many Jewish captives were killed. The city later went by the name of Paneas again. Eusebius saw there a bronze statue said to show the woman healed of an issue of blood kneeling before Jesus; Sozomen reports that under Julian it was pulled down and replaced by a statue of the emperor."
  ru:
    - "Кесария Филиппова лежала у южного подножия горы Ермон, там, где из-под скалы и большой пещеры выходит один из главных истоков Иордана; сегодня это Баниас на Голанских высотах. В эллинистическую эпоху пещера была посвящена греческому богу Пану, а место называлось Панион, или Панеада. Около 200 г. до н. э. Антиох III разбил у Паниона птолемеевского полководца Скопаса, и эта земля перешла от Птолемеев к Селевкидам."
    - "В 20 г. до н. э. Август отдал Ироду Великому владения Зенодора, включавшие Панеаду, и Ирод построил у Паниона храм Августу из белого камня. Где он стоял, спорят: одни помещают его перед пещерой, другие — в Омрите, в нескольких километрах к юго-западу. Около 3 г. до н. э. сын Ирода, четвертовластник Филипп, построил у источников город, сделал его своей столицей и назвал Кесарией; её называли Кесарией Филипповой, чтобы отличать от Кесарии на побережье."
    - "Придя «в страны Кесарии Филипповой», Иисус спросил учеников, за кого почитают Его люди, и Петр ответил: «Ты — Христос, Сын Бога Живаго». У Матфея Иисус затем говорит ему: «ты — Петр, и на сем камне Я создам Церковь мою», и обещает ему ключи Царства Небесного. Марк передаёт тот же разговор по дороге в селения Кесарии Филипповой."
    - "Царь Агриппа II расширил город и в честь Нерона переименовал его в Нерониаду. В 67 г. н. э. Веспасиан двадцать дней давал здесь отдых своему войску как гость Агриппы, а в 70 г., после падения Иерусалима, Тит устроил здесь зрелища, на которых погибло множество пленных иудеев. Позднее город снова стал называться Панеадой. Евсевий видел здесь бронзовую статую, которая, как говорили, изображала исцелённую от кровотечения женщину, преклонившую колени перед Иисусом; Созомен сообщает, что при Юлиане её сбросили и поставили на её место статую императора."
  uk:
    - "Кесарія Пилипова лежала біля південного підніжжя гори Гермон, де одне з головних джерел Йордану випливає з-під скелі та великої печери; це місце сьогодні — Баніяс на Голанських висотах. В елліністичну добу печера була присвячена грецькому богові Пану, а місце звалося Паніон, або Панеада. Близько 200 р. до н. е. Антіох III розбив птолемеївського полководця Скопаса біля Паніону, і земля перейшла від Птолемеїв до Селевкідів."
    - "У 20 р. до н. е. Август віддав Іродові Великому територію Зенодора, до якої входила Панеада, і Ірод збудував біля Паніону храм із білого каменю на честь Августа. Де він стояв, є спірним: одні розміщують його перед печерою, інші — в Омриті, за кілька кілометрів на південний захід. Близько 3 р. до н. е. син Ірода тетрарх Пилип збудував біля джерел місто як свою столицю і назвав його Кесарією; її звали Кесарією Пилиповою, щоб відрізняти від Кесарії на узбережжі."
    - "Коли Ісус прийшов «у сторони Кесариї Филипової», Він запитав учнів, за кого люди мають Його, і Петро відповів: «Ти єси Христос, Син Бога живого». У Матвія Ісус потім каже йому: «що ти єси Петр, і на сьому каменї збудую церкву мою», — і обіцяє йому ключі царства небесного. Марк розповідає ту саму розмову дорогою до сіл Кесарії Пилипової."
    - "Цар Агриппа II розбудував місто й перейменував його на Неронію на честь Нерона. У 67 р. н. е. Веспасіан відпочивав там зі своїм військом двадцять днів як гість Агриппи, а в 70 р., після падіння Єрусалима, Тит влаштував там ігри, під час яких було вбито багатьох юдейських полонених. Пізніше місто знову стало зватися Панеадою. Євсевій бачив там бронзову статую, яка нібито зображала жінку, зцілену від кровотечі, що клякне перед Ісусом; Созомен повідомляє, що за Юліана її скинули й замінили статуєю імператора."
  es:
    - "Cesarea de Filipo se hallaba al pie meridional del monte Hermón, donde una de las principales fuentes del Jordán brota bajo un risco y una gran cueva; el sitio es hoy Baniás, en los Altos del Golán. En la época helenística la cueva estaba consagrada al dios griego Pan, y el lugar se llamaba Panión o Paneas. Hacia el 200 a. C. Antíoco III derrotó al general ptolemaico Escopas cerca del Panión, y la región pasó de los Ptolomeos a los seléucidas."
    - "En el 20 a. C. Augusto dio a Herodes el Grande el territorio de Zenodoro, que incluía Paneas, y Herodes construyó un templo de piedra blanca a Augusto cerca del Panión. Dónde se alzaba es objeto de debate: unos lo sitúan frente a la cueva, otros en Omrit, a pocos kilómetros al suroeste. Hacia el 3 a. C. Filipo el tetrarca, hijo de Herodes, construyó una ciudad junto a las fuentes como capital suya y la llamó Cesarea; se la llamó Cesarea de Filipo para distinguirla de la Cesarea de la costa."
    - "Cuando Jesús llegó «á las partes de Cesarea de Filipo», preguntó a sus discípulos quién decían los hombres que era, y Pedro respondió: «Tú eres el Cristo, el Hijo del Dios viviente.» En Mateo, Jesús le dice entonces: «tú eres Pedro, y sobre esta piedra edificaré mi iglesia», y le promete las llaves del reino de los cielos. Marcos cuenta el mismo diálogo en el camino hacia las aldeas de Cesarea de Filipo."
    - "El rey Agripa II amplió la ciudad y la rebautizó Neronias en honor de Nerón. En el 67 d. C. Vespasiano dio allí descanso a su ejército durante veinte días como huésped de Agripa, y en el 70, tras la caída de Jerusalén, Tito celebró allí juegos en los que murieron muchos cautivos judíos. Más tarde la ciudad volvió a llamarse Paneas. Eusebio vio allí una estatua de bronce que, según se decía, representaba a la mujer curada del flujo de sangre arrodillada ante Jesús; Sozomeno refiere que bajo Juliano fue derribada y sustituida por una estatua del emperador."
  pt:
    - "Cesareia de Filipe ficava ao pé sul do Monte Hermom, onde uma das principais nascentes do Jordão brota sob um penhasco e uma grande gruta; o local é hoje Banias, nas Colinas de Golã. Na época helenística, a gruta era consagrada ao deus grego Pã, e o lugar chamava-se Panium ou Paneas. Por volta de 200 a.C., Antíoco III derrotou o general ptolomaico Escopas perto do Panium, e a região passou dos Ptolomeus aos Selêucidas."
    - "Em 20 a.C., Augusto deu a Herodes, o Grande, o território de Zenodoro, que incluía Paneas, e Herodes construiu perto do Panium um templo de pedra branca em honra de Augusto. Onde ficava é disputado: alguns o põem diante da gruta, outros em Omrit, a poucos quilômetros a sudoeste. Por volta de 3 a.C., Filipe, o tetrarca, filho de Herodes, construiu uma cidade junto às nascentes como sua capital e a chamou Cesareia; era chamada Cesareia de Filipe para distingui-la da Cesareia da costa."
    - "Quando Jesus chegou “à região de Cesareia de Filipe”, perguntou aos discípulos quem os homens diziam que ele era, e Pedro respondeu: “Tu és o Cristo, o Filho do Deus vivo.” Em Mateus, Jesus lhe diz então: “você é Pedro, e sobre esta pedra edificarei a minha igreja”, e lhe promete as chaves do Reino dos Céus. Marcos conta a mesma conversa no caminho para as aldeias de Cesareia de Filipe."
    - "O rei Agripa II ampliou a cidade e a rebatizou Neronias em honra de Nero. Em 67 d.C., Vespasiano repousou ali seu exército por vinte dias como hóspede de Agripa, e em 70, depois da queda de Jerusalém, Tito promoveu ali jogos em que muitos cativos judeus foram mortos. A cidade voltou depois a ser chamada Paneas. Eusébio viu ali uma estátua de bronze que, dizia-se, mostrava a mulher curada de hemorragia, ajoelhada diante de Jesus; Sozomeno relata que, sob Juliano, ela foi derrubada e substituída por uma estátua do imperador."
  de:
    - "Caesarea Philippi lag am Südfuß des Hermon, wo eine der Hauptquellen des Jordan unter einer Felswand und einer großen Höhle hervorfließt; der Ort ist das heutige Banias auf den Golanhöhen. In hellenistischer Zeit war die Höhle dem griechischen Gott Pan geweiht, und der Ort hieß Paneion oder Paneas. Um 200 v. Chr. besiegte Antiochos III. den ptolemäischen Feldherrn Skopas beim Paneion, und das Land ging von den Ptolemäern an die Seleukiden über."
    - "Im Jahr 20 v. Chr. gab Augustus Herodes dem Großen das Gebiet des Zenodoros, zu dem Paneas gehörte, und Herodes errichtete beim Paneion einen Tempel aus weißem Stein für Augustus. Wo er stand, ist umstritten: Manche setzen ihn vor die Höhle, andere nach Omrit, einige Kilometer südwestlich. Um 3 v. Chr. baute Herodes’ Sohn, der Tetrarch Philippus, an den Quellen eine Stadt als seine Hauptstadt und nannte sie Caesarea; sie hieß Caesarea Philippi, um sie von Caesarea an der Küste zu unterscheiden."
    - "Als Jesus „in die Gegend der Stadt Cäsarea Philippi“ kam, fragte er seine Jünger, für wen die Leute ihn hielten, und Petrus antwortete: „Du bist Christus, des lebendigen Gottes Sohn!“ Bei Matthäus sagt Jesus ihm daraufhin: „Du bist Petrus, und auf diesen Felsen will ich bauen meine Gemeinde“, und verheißt ihm die Schlüssel des Himmelreichs. Markus erzählt denselben Wortwechsel auf dem Weg zu den Dörfern bei Caesarea Philippi."
    - "König Agrippa II. erweiterte die Stadt und nannte sie zu Ehren Neros Neronias. Im Jahr 67 n. Chr. ließ Vespasian als Gast Agrippas sein Heer dort zwanzig Tage ruhen, und 70, nach dem Fall Jerusalems, hielt Titus dort Spiele ab, bei denen viele jüdische Gefangene getötet wurden. Später führte die Stadt wieder den Namen Paneas. Eusebius sah dort eine Bronzestatue, die die von einem Blutfluss geheilte Frau darstellen sollte, wie sie vor Jesus kniet; Sozomenos berichtet, dass sie unter Julian niedergerissen und durch eine Statue des Kaisers ersetzt wurde."
  fr:
    - "Césarée de Philippe s’étendait au pied sud du Mont Hermon, là où l’une des principales sources du Jourdain jaillit sous une falaise et une grande grotte ; le site est aujourd’hui Banias, sur le plateau du Golan. À l’époque hellénistique, la grotte était consacrée au dieu grec Pan, et le lieu s’appelait le Panion ou Paneas. Vers 200 av. J.-C., Antiochus III vainquit le général ptolémaïque Scopas près du Panion, et le pays passa des Ptolémées aux Séleucides."
    - "En 20 av. J.-C., Auguste donna à Hérode le Grand le territoire de Zénodore, qui comprenait Paneas, et Hérode bâtit près du Panion un temple de pierre blanche en l’honneur d’Auguste. Son emplacement est discuté : certains le placent devant la grotte, d’autres à Omrit, à quelques kilomètres au sud-ouest. Vers 3 av. J.-C., Philippe le tétrarque, fils d’Hérode, bâtit près des sources une ville qui fut sa capitale et la nomma Césarée ; on l’appela Césarée de Philippe pour la distinguer de Césarée du littoral."
    - "Lorsque Jésus vint « dans le territoire de Césarée de Philippe », il demanda à ses disciples qui les gens disaient qu’il était, et Pierre répondit : « Tu es le Christ, le Fils du Dieu vivant. » Dans Matthieu, Jésus lui dit ensuite : « Et moi, je te dis que tu es Pierre, et que sur cette pierre je bâtirai mon Église », et lui promet les clefs du royaume des cieux. Marc rapporte le même échange sur la route des bourgs de Césarée de Philippe."
    - "Le roi Agrippa II agrandit la ville et la rebaptisa Néronias en l’honneur de Néron. En 67 apr. J.-C., Vespasien y fit reposer son armée pendant vingt jours comme hôte d’Agrippa, et en 70, après la chute de Jérusalem, Titus y donna des jeux au cours desquels de nombreux captifs juifs furent tués. La ville reprit plus tard le nom de Paneas. Eusèbe y vit une statue de bronze censée représenter la femme guérie d’une perte de sang, agenouillée devant Jésus ; Sozomène rapporte que sous Julien elle fut abattue et remplacée par une statue de l’empereur."
  it:
    - "Cesarea di Filippo sorgeva ai piedi meridionali del Monte Ermon, dove una delle principali sorgenti del Giordano sgorga da sotto una rupe e una grande grotta; il sito è l’odierna Banias, sulle Alture del Golan. In età ellenistica la grotta era sacra al dio greco Pan, e il luogo si chiamava Panio o Paneas. Intorno al 200 a.C. Antioco III sconfisse presso il Panio il generale tolemaico Scopa, e il territorio passò dai Tolomei ai Seleucidi."
    - "Nel 20 a.C. Augusto diede a Erode il Grande il territorio di Zenodoro, che comprendeva Paneas, ed Erode costruì presso il Panio un tempio di pietra bianca in onore di Augusto. Dove sorgesse è controverso: alcuni lo collocano davanti alla grotta, altri a Omrit, qualche chilometro a sud-ovest. Intorno al 3 a.C. il figlio di Erode, il tetrarca Filippo, costruì presso le sorgenti una città come propria capitale e la chiamò Cesarea; fu detta Cesarea di Filippo per distinguerla da Cesarea sulla costa."
    - "Quando Gesù giunse «nelle parti di Cesarea di Filippo», chiese ai discepoli chi dicesse la gente che egli fosse, e Pietro rispose: «Tu sei il Cristo, il Figliuol dell’Iddio vivente.» In Matteo Gesù gli dice allora: «Tu sei Pietro, e su questa pietra edificherò la mia Chiesa», e gli promette le chiavi del regno dei cieli. Marco narra lo stesso scambio lungo il cammino verso le borgate di Cesarea di Filippo."
    - "Il re Agrippa II ampliò la città e la ribattezzò Neroniade in onore di Nerone. Nel 67 d.C. Vespasiano vi concesse venti giorni di riposo al suo esercito come ospite di Agrippa, e nel 70, dopo la caduta di Gerusalemme, Tito vi tenne giochi nei quali furono uccisi molti prigionieri giudei. In seguito la città tornò a chiamarsi Paneas. Eusebio vi vide una statua di bronzo che si diceva raffigurasse la donna guarita dal flusso di sangue inginocchiata davanti a Gesù; Sozomeno riferisce che sotto Giuliano fu abbattuta e sostituita da una statua dell’imperatore."
  pl:
    - "Cezarea Filipowa leżała u południowego podnóża Hermonu, gdzie jedno z głównych źródeł Jordanu wypływa spod skały i wielkiej jaskini; miejsce to jest dzisiejszym Banias na Wzgórzach Golan. W epoce hellenistycznej jaskinia była poświęcona greckiemu bogu Panowi, a miejsce nazywano Panium lub Paneas. Około 200 r. p.n.e. Antioch III pokonał ptolemejskiego wodza Skopasa koło Panium i ziemia przeszła od Ptolemeuszy do Seleucydów."
    - "W 20 r. p.n.e. August dał Herodowi Wielkiemu terytorium Zenodora, do którego należało Paneas, a Herod zbudował koło Panium świątynię z białego kamienia ku czci Augusta. Gdzie stała, jest sporne: jedni umieszczają ją przed jaskinią, inni w Omrit, kilka kilometrów na południowy zachód. Około 3 r. p.n.e. syn Heroda, tetrarcha Filip, zbudował przy źródłach miasto jako swoją stolicę i nazwał je Cezareą; zwano je Cezareą Filipową, by odróżnić od Cezarei nadmorskiej."
    - "Gdy Jezus przyszedł „w strony Cezaryi Filippowej”, zapytał uczniów, za kogo ludzie go uważają, a Piotr odpowiedział: „Tyś jest Chrystus, on Syn Boga żywego.” U Mateusza Jezus mówi mu potem: „A Ja ci też powiadam, żeś ty jest Piotr; a na tej opoce zbuduję kościół mój”, i obiecuje mu klucze królestwa niebieskiego. Marek opowiada tę samą rozmowę w drodze do miasteczek Cezarei Filipowej."
    - "Król Agryppa II powiększył miasto i przemianował je na Neronias ku czci Nerona. W 67 r. n.e. Wespazjan odpoczywał tam z wojskiem przez dwadzieścia dni jako gość Agryppy, a w 70 r., po upadku Jerozolimy, Tytus wyprawił tam igrzyska, w których zginęło wielu żydowskich jeńców. Miasto później znów było znane pod nazwą Paneas. Euzebiusz widział tam spiżowy posąg, który miał przedstawiać kobietę uzdrowioną z krwotoku, klęczącą przed Jezusem; Sozomen donosi, że za Juliana go zburzono i zastąpiono posągiem cesarza."
  nl:
    - "Caesarea Filippi lag aan de zuidelijke voet van de Hermon, waar een van de belangrijkste bronnen van de Jordaan onder een rotswand en een grote grot vandaan stroomt; de plaats is het huidige Banias op de Golanhoogten. In de hellenistische tijd was de grot gewijd aan de Griekse god Pan, en de plaats heette het Panium of Paneas. Omstreeks 200 v.Chr. versloeg Antiochus III de Ptolemeïsche generaal Scopas bij het Panium, en het land ging over van de Ptolemaeën naar de Seleuciden."
    - "In 20 v.Chr. gaf Augustus aan Herodes de Grote het gebied van Zenodorus, waartoe ook Paneas behoorde, en Herodes bouwde bij het Panium een tempel van witte steen voor Augustus. Waar die stond is omstreden: sommigen plaatsen hem voor de grot, anderen bij Omrit, enkele kilometers naar het zuidwesten. Omstreeks 3 v.Chr. bouwde Herodes' zoon, de tetrarch Filippus, bij de bronnen een stad als zijn hoofdstad en noemde haar Caesarea; zij werd Caesarea Filippi genoemd om haar te onderscheiden van Caesarea aan de kust."
    - "Toen Jezus kwam “in de delen van Cesarea Filippi”, vroeg hij zijn leerlingen wie de mensen zeiden dat hij was, en Petrus antwoordde: “Gij zijt de Christus, de Zoon des levenden Gods.” Bij Mattheüs zegt Jezus daarna tot hem: “gij zijt Petrus, en op deze petra zal Ik Mijn gemeente bouwen”, en belooft hem de sleutels van het koninkrijk der hemelen. Marcus vertelt hetzelfde gesprek onderweg naar de dorpen van Caesarea Filippi."
    - "Koning Agrippa II breidde de stad uit en noemde haar Neronias ter ere van Nero. In 67 n.Chr. liet Vespasianus zijn leger er twintig dagen rusten als gast van Agrippa, en in 70, na de val van Jeruzalem, hield Titus er spelen waarbij vele Joodse gevangenen werden gedood. Later droeg de stad weer de naam Paneas. Eusebius zag daar een bronzen standbeeld dat naar verluidt de vrouw voorstelde die van een bloedvloeiing was genezen en geknield voor Jezus lag; Sozomenus meldt dat het onder Julianus werd neergehaald en vervangen door een standbeeld van de keizer."
  cs:
    - "Cesarea Filipova ležela na jižním úpatí Hermonu, kde jeden z hlavních pramenů Jordánu vytéká zpod skály a velké jeskyně; místo je dnešní Banias na Golanských výšinách. V helénistické době byla jeskyně zasvěcena řeckému bohu Panovi a místo se jmenovalo Panium neboli Paneas. Kolem roku 200 př. n. l. porazil Antiochos III. u Pania ptolemaiovského vojevůdce Skopa a země přešla od Ptolemaiovců k Seleukovcům."
    - "Roku 20 př. n. l. dal Augustus Herodovi Velikému území Zenodora, které zahrnovalo Paneas, a Herodes postavil poblíž Pania chrám z bílého kamene Augustovi. Kde stál, je sporné: někteří jej kladou před jeskyni, jiní do Omritu, několik kilometrů jihozápadně. Kolem roku 3 př. n. l. postavil Herodův syn tetrarcha Filip u pramenů město jako své hlavní město a pojmenoval je Cesarea; nazývalo se Cesarea Filipova, aby se rozlišilo od Cesareje na pobřeží."
    - "Když Ježíš přišel „do krajin Cesaree Filipovy“, otázal se učedlníků, za koho ho lidé mají, a Petr odpověděl: „Ty jsi Kristus, Syn Boha živého.“ U Matouše mu Ježíš pak praví: „jáť pravím tobě, že jsi ty Petr, a na téť skále vzdělám církev svou“, a slibuje mu klíče království nebeského. Marek vypráví tutéž výměnu na cestě do městeček Cesaree Filipovy."
    - "Král Agrippa II. město rozšířil a na počest Nerona je přejmenoval na Neronias. Roku 67 n. l. dal Vespasianus svému vojsku odpočinek u něj po dvacet dní jako Agrippův host a roku 70, po pádu Jeruzaléma, uspořádal Titus ve městě hry, při nichž bylo zabito mnoho židovských zajatců. Později město opět neslo jméno Paneas. Eusebios tam viděl bronzovou sochu, o níž se říkalo, že představuje ženu uzdravenou z krvotoku, klečící před Ježíšem; Sozomenos uvádí, že za Juliána byla stržena a nahrazena sochou císaře."
