# Overview article (ADR 0007). Mainstream facts only; the Seleucid reading of Daniel 11 is the one shared by Jerome and modern commentators, and the two readings of verses 40-45 are given side by side without choosing.
id: north
place: a244929
title:
  en: "North"
  ru: "Царство северного царя"
  uk: "Північ"
  es: "Norte"
  pt: "Norte"
  de: "Reich des Königs des Nordens"
  fr: "Nord"
body:
  en:
    - "“The king of the north” is a figure of Daniel 11, where an angel tells Daniel of the long wars between him and “the king of the south”. Since Jerome, who drew on the pagan critic Porphyry, readers have agreed that the south is Ptolemaic Egypt and the north the Seleucid kingdom, which ruled Syria, Mesopotamia and for a time Persia from Antioch on the Orontes; the record here, the kingdom of the king of the north, stands at Antioch. The chapter's “glorious land” between the two is Judea, which passed from the one to the other, and the names it never gives are supplied by Polybius, Livy, Appian and 1 Maccabees."
    - "The kings can be followed one by one. “One of his princes” who grew stronger than Ptolemy I is Seleucus I, who won Babylon in 312 BC. “The king's daughter of the south” who “shall come to the king of the north” is Berenice, married to Antiochus II about 252 BC and murdered with her child after his death; her brother Ptolemy III then invaded Syria and carried home gods and treasure, the Third Syrian War of 246–241. The great army “given into his hand” is that of Antiochus III, beaten by Ptolemy IV at Raphia in 217; the “most fenced cities” Antiochus took after his victory at Panium in 200 BC include Sidon, and with them he gained Judea. His daughter Cleopatra was married to Ptolemy V, Rome broke him at Magnesia in 190, and he died in 187. His son Seleucus IV sent “a raiser of taxes”, Heliodorus, to the Temple."
    - "The “vile person” who follows is Antiochus IV Epiphanes, king from 175 to 164. He invaded Egypt twice: on the first return, in 169, he plundered the Temple, “and his heart shall be against the holy covenant”, and on the second, in 168, “the ships of Chittim”, the Roman envoy Popillius Laenas at Eleusis, turned him back. His soldiers then polluted the sanctuary and set up “the abomination that maketh desolate”, the altar of December 167 that 1 Maccabees describes and that provoked the Maccabean revolt. Verses 40–45, in which the king of the north dies between the sea and the holy mountain, do not match Antiochus' death in Persia in 164; most critical scholars therefore date the chapter to the months before it and read its ending as a prediction that failed, while others read these verses of a last enemy still to come. Both readings are old."
    - "The Seleucids lost Judea to the Hasmoneans and their kingdom to Pompey in 64 BC. Their capital Antioch is Antakya in southern Turkey, wrecked by the earthquake of February 2023."
  ru:
    - "«Царь северный», как называет его Синодальный перевод, — лицо из 11-й главы Даниила, где ангел рассказывает Даниилу о долгих войнах между ним и южным царём. Со времён Иеронима, опиравшегося на языческого критика Порфирия, читатели сходятся в том, что юг — это Египет Птолемеев, а север — царство Селевкидов, правивших Сирией, Месопотамией и одно время Персией из Антиохии на Оронте; запись «Царство северного царя» стоит здесь в Антиохии. Земля между ними, которую глава зовёт «славной», — Иудея, переходившая от одних к другим, а имена, которых глава не называет, дают Полибий, Ливий, Аппиан и Первая книга Маккавейская."
    - "Царей можно проследить одного за другим. «Один из князей», переросший Птолемея I, — Селевк I, взявший Вавилон в 312 г. до н. э. «Дочь южного царя», которая «придет к царю северному», — Береника, выданная за Антиоха II около 252 г. до н. э. и убитая вместе с ребёнком после его смерти; её брат Птолемей III вторгся затем в Сирию и увёз богов и сокровища — Третья Сирийская война 246–241 гг. Большое войско, о котором сказано «предано будет войско в руки его», — войско Антиоха III, разбитое Птолемеем IV при Рафии в 217 г.; «укрепленным городом», которым Антиох овладел после победы при Панионе в 200 г. до н. э., был Сидон, и вместе с ним он получил Иудею. Его дочь Клеопатру выдали за Птолемея V, Рим сломил его при Магнесии в 190 г., и он погиб в 187 г. Его сын Селевк IV послал к Храму «сборщика податей» Гелиодора."
    - "«Презренный», который следует далее, — Антиох IV Епифан, царь с 175 по 164 г. Он дважды вторгался в Египет: возвращаясь в первый раз, в 169 г., он ограбил Храм с «враждебным намерением против святаго завета», а во второй, в 168 г., «корабли Киттимские» — римский посол Попилий Ленат в Елевсине — повернули его назад. Затем его воины осквернили святилище и поставили «мерзость запустения» — жертвенник декабря 167 г., о котором рассказывает Первая книга Маккавейская и который вызвал восстание Маккавеев. Стихи 40–45, где царь северный гибнет между морем и святой горой, не сходятся со смертью Антиоха в Персии в 164 г.; поэтому большинство критических учёных датируют главу месяцами перед ней и читают её конец как несбывшееся предсказание, а другие относят эти стихи к последнему врагу, который ещё придёт. Оба прочтения стары."
    - "Селевкиды потеряли Иудею, отошедшую к Хасмонеям, а царство — в 64 г. до н. э., когда его упразднил Помпей. Их столица Антиохия — нынешняя Антакья на юге Турции, разрушенная землетрясением в феврале 2023 года."
  uk:
    - "Цар півночі — постать з розділу 11 Книги Даниїла, де ангел розповідає Даниїлові про довгі війни між ним і царем півдня. Від Єроніма, який спирався на язичницького критика Порфирія, читачі погоджуються, що південь — це Птолемеївський Єгипет, а північ — держава Селевкідів, яка правила Сирією, Месопотамією й деякий час Персією з Антіохії на Оронті; запис тут, царство царя півночі, розміщує його в Антіохії. Славна земля між ними, про яку говорить розділ, — це Юдея, що переходила від одного до другого, а імена, яких розділ ніколи не називає, подають Полібій, Лівій, Аппіан та Перша книга Макавеїв."
    - "За царями можна простежити по одному. Той, хто став сильнішим за Птолемея I, — «один із князїв» першого царя, — це Селевк I, який здобув Вавилон 312 р. до н. е. Та, що як «дочка південного царя» «прийде до царя північнього», — Береніка, видана заміж за Антіоха II близько 252 р. до н. е. і вбита разом з дитиною після його смерті; її брат Птолемей III тоді вторгся до Сирії й повіз додому богів і скарби — Третя Сирійська війна 246–241 рр. до н. е. Велике військо, що «віддане буде... в його руки», — це військо Антіоха III, розбите Птолемеєм IV під Рафією 217 р. до н. е.; найукріпленіші міста, які Антіох узяв після перемоги при Панії 200 р. до н. е., включають Сідон, а з ними він здобув Юдею. Його дочку Клеопатру видали за Птолемея V, Рим зламав його під Магнесією 190 р. до н. е., а помер він 187 р. до н. е. Його син Селевк IV послав до Храму «побірника податків», Геліодора."
    - "Той, хто йде слідом, «згірдний», — Антіох IV Епіфан, цар із 175 до 164 р. до н. е. Він двічі вторгався до Єгипту: першого разу, на зворотному шляху 169 р. до н. е., пограбував Храм і повернувся «з великим багацтвом і ворожими думками проти завіту сьвятого», а другого, 168 р. до н. е., його завернули назад «кораблї Киттимські» — римський посол Попілій Ленат в Елевсіні. Тоді його воїни осквернили святиню й поставили гидоту спустошення — вівтар грудня 167 р. до н. е., який описує Перша книга Макавеїв і який спровокував Макавейське повстання. Вірші 40–45, у яких цар північний гине між морем і святою горою, не відповідають смерті Антіоха в Персії 164 р. до н. е.; тому більшість критичних учених датує розділ місяцями до неї й читає його кінець як передбачення, що не справдилося, тоді як інші відносять ці вірші до останнього ворога, що ще має прийти. Обидва прочитання давні."
    - "Селевкіди втратили Юдею на користь Хасмонеїв, а своє царство — Помпеєві 64 р. до н. е. Їхня столиця Антіохія — це Антак'я на півдні Туреччини, зруйнована землетрусом у лютому 2023 року."
  es:
    - "«El rey del norte» es una figura de Daniel 11, donde un ángel habla a Daniel de las largas guerras entre él y «el rey del mediodía». Desde Jerónimo, que se apoyó en el crítico pagano Porfirio, los lectores coinciden en que el sur es el Egipto ptolemaico y el norte el reino seléucida, que gobernó Siria, Mesopotamia y durante un tiempo Persia desde Antioquía del Orontes; el registro de aquí, el reino del rey del norte, tiene su sede en Antioquía. La «tierra deseable» que el capítulo sitúa entre ambos es Judea, que pasó de uno a otro, y los nombres que nunca da los suplen Polibio, Livio, Apiano y 1 Macabeos."
    - "Los reyes pueden seguirse uno por uno. «Uno de los príncipes de aquél» que se hizo más fuerte que Tolomeo I es Seleuco I, que ganó Babilonia en 312 a. C. «La hija del rey del mediodía» que «vendrá al rey del norte» es Berenice, casada con Antíoco II hacia 252 a. C. y asesinada con su hijo tras la muerte de él; su hermano Tolomeo III invadió entonces Siria y se llevó a casa dioses y tesoros, la Tercera Guerra Siria de 246–241. La gran multitud «entregada en su mano» es el ejército de Antíoco III, vencido por Tolomeo IV en Rafia en 217; las ciudades más fortificadas que Antíoco tomó tras su victoria en Panion en 200 a. C. incluyen Sidón, y con ellas ganó Judea. Su hija Cleopatra se casó con Tolomeo V, Roma lo quebrantó en Magnesia en 190, y murió en 187. Su hijo Seleuco IV envió al templo a Heliodoro, el «exactor»."
    - "El «vil» que sigue es Antíoco IV Epífanes, rey de 175 a 164. Invadió Egipto dos veces: en el primer regreso, en 169, saqueó el templo, «y su corazón será contra el pacto santo», y en el segundo, en 168, «naves de Chîttim», el enviado romano Popilio Lenas en Eleusis, lo hicieron volver. Sus soldados contaminaron entonces el santuario y pusieron «la abominación espantosa», el altar de diciembre de 167 que describe 1 Macabeos y que provocó la revuelta macabea. Los versículos 40–45, en los que el rey del norte muere entre el mar y el monte santo, no concuerdan con la muerte de Antíoco en Persia en 164; por eso la mayoría de los estudiosos críticos fecha el capítulo en los meses anteriores y lee su final como una predicción que falló, mientras que otros leen estos versículos de un último enemigo aún por venir. Ambas lecturas son antiguas."
    - "Los seléucidas perdieron Judea ante los asmoneos y su reino ante Pompeyo en 64 a. C. Su capital, Antioquía, es Antakya, en el sur de Turquía, devastada por el terremoto de febrero de 2023."
  pt:
    - "“O rei do norte” é uma figura de Daniel 11, em que um anjo fala a Daniel das longas guerras entre ele e “o rei do sul”. Desde Jerônimo, que se apoiou no crítico pagão Porfírio, os leitores concordam que o sul é o Egito ptolemaico e o norte o reino selêucida, que governava a Síria, a Mesopotâmia e por algum tempo a Pérsia a partir de Antioquia do Orontes; o registro aqui, o reino do rei do norte, está em Antioquia. A “terra gloriosa” entre os dois, no capítulo, é a Judeia, que passou de um para o outro, e os nomes que o texto nunca dá são fornecidos por Políbio, Tito Lívio, Apiano e 1 Macabeus."
    - "Os reis podem ser acompanhados um a um. “Um de seus príncipes”, que se tornou mais forte do que Ptolomeu I, é Seleuco I, que conquistou Babilônia em 312 a.C. “A filha do rei do sul”, que “virá ao rei do norte”, é Berenice, casada com Antíoco II por volta de 252 a.C. e morta com o filho depois da morte dele; seu irmão Ptolomeu III invadiu então a Síria e levou para casa deuses e tesouros, na Terceira Guerra Síria, de 246–241. O grande exército “entregue em sua mão” é o de Antíoco III, derrotado por Ptolomeu IV em Ráfia, em 217; as cidades fortificadas que Antíoco tomou depois de sua vitória em Panion, em 200 a.C., incluem Sídon, e com elas ele ganhou a Judeia. Sua filha Cleópatra casou-se com Ptolomeu V, Roma o quebrou em Magnésia, em 190, e ele morreu em 187. Seu filho Seleuco IV enviou ao Templo “um cobrador de impostos”, Heliodoro."
    - "A “pessoa desprezível” que se segue é Antíoco IV Epifânio, rei de 175 a 164. Invadiu o Egito duas vezes: na primeira volta, em 169, saqueou o Templo, “O seu coração será contra a santa aliança”, e na segunda, em 168, “navios de Quitim”, o enviado romano Popílio Lenas em Elêusis, o fez recuar. Seus soldados profanaram então o santuário e estabeleceram “a abominação que causa desolação”, o altar de dezembro de 167 que 1 Macabeus descreve e que provocou a revolta dos macabeus. Os versículos 40–45, em que o rei do norte morre entre o mar e o monte santo, não coincidem com a morte de Antíoco na Pérsia em 164; a maioria dos estudiosos críticos data por isso o capítulo dos meses anteriores e lê seu final como uma predição que falhou, enquanto outros leem esses versículos a respeito de um último inimigo ainda por vir. Ambas as leituras são antigas."
    - "Os selêucidas perderam a Judeia para os hasmoneus e seu reino para Pompeu em 64 a.C. Sua capital, Antioquia, é Antakya, no sul da Turquia, devastada pelo terremoto de fevereiro de 2023."
  de:
    - "Der König des Nordens ist eine Gestalt aus Daniel 11, wo ein Engel Daniel von den langen Kriegen zwischen ihm und dem König des Südens berichtet. Seit Hieronymus, der sich auf den heidnischen Kritiker Porphyrios stützte, sind sich die Leser einig, dass der Süden das ptolemäische Ägypten und der Norden das Seleukidenreich ist, das von Antiochia am Orontes aus Syrien, Mesopotamien und zeitweise Persien beherrschte; die Karte setzt das Reich des Königs des Nordens hier nach Antiochia. Das „werte Land“ zwischen beiden ist Judäa, das vom einen an den anderen fiel, und die Namen, die das Kapitel nie nennt, liefern Polybios, Livius, Appian und das 1. Makkabäerbuch."
    - "Die Könige lassen sich einzeln verfolgen. „Seiner Fürsten einer“, mächtiger als Ptolemaios I., ist Seleukos I., der 312 v. Chr. Babylon gewann. „Die Tochter des Königs gegen Mittag“, die „kommen“ wird „zum König gegen Mitternacht“, ist Berenike, um 252 v. Chr. mit Antiochos II. vermählt und nach dessen Tod samt ihrem Kind ermordet; ihr Bruder Ptolemaios III. fiel in Syrien ein und führte Götter und Schätze heim (Dritter Syrischer Krieg, 246–241). Das große Heer, „in seine Hand gegeben“, ist das Antiochos' III., den Ptolemaios IV. 217 bei Raphia schlug; die festen Städte, die Antiochos nach seinem Sieg bei Paneas im Jahr 200 v. Chr. nahm, schließen Sidon ein, und mit ihnen gewann er Judäa. Seine Tochter Kleopatra heiratete Ptolemaios V., Rom brach ihn 190 bei Magnesia, 187 starb er. Sein Sohn Seleukos IV. schickte Heliodor, einen Steuereintreiber, zum Tempel."
    - "Der „Ungeachtete“ ist Antiochos IV. Epiphanes, König 175–164. Er fiel zweimal in Ägypten ein: Bei der ersten Rückkehr 169 plünderte er den Tempel, das Herz „wider den heiligen Bund“ gerichtet; bei der zweiten, 168, kamen „Schiffe aus Chittim“, der römische Gesandte Popillius Laenas bei Eleusis, und wiesen ihn zurück. Seine Soldaten entweihten dann das Heiligtum und richteten „einen Greuel der Verwüstung“ auf, den Altar vom Dezember 167, den 1. Makkabäer beschreibt und der den Makkabäeraufstand auslöste. Die Verse 40–45, in denen der König des Nordens zwischen dem Meer und dem heiligen Berg stirbt, passen nicht zu Antiochos' Tod in Persien 164; die meisten kritischen Gelehrten datieren das Kapitel daher auf die Monate davor und lesen das Ende als gescheiterte Vorhersage, andere beziehen die Verse auf einen letzten, noch kommenden Feind. Beide Deutungen sind alt."
    - "Die Seleukiden verloren Judäa an die Hasmonäer und ihr Reich 64 v. Chr. an Pompeius. Ihre Hauptstadt Antiochia ist Antakya im Süden der Türkei, im Februar 2023 durch das Erdbeben verwüstet."
  fr:
    - "« Le roi du septentrion » est une figure de Daniel 11, où un ange raconte à Daniel les longues guerres entre lui et « le roi du midi ». Depuis Jérôme, qui s’appuyait sur le critique païen Porphyre, on s’accorde à voir dans le sud l’Égypte lagide et dans le nord le royaume séleucide, qui régna sur la Syrie, la Mésopotamie et un temps la Perse depuis Antioche sur l’Oronte ; le relevé ici, le royaume du roi du Nord, est placé à Antioche. Le « plus beau des pays » entre les deux est la Judée, qui passa de l’un à l’autre, et les noms que le chapitre ne donne jamais sont fournis par Polybe, Tite-Live, Appien et 1 Maccabées."
    - "On peut suivre les rois un à un. « Un de ses chefs » devenu plus fort que Ptolémée Ier est Séleucos Ier, qui conquit Babylone en 312 av. J.-C. « La fille du roi du midi » qui « viendra vers le roi du septentrion » est Bérénice, mariée à Antiochos II vers 252 av. J.-C. et assassinée avec son enfant après la mort de celui-ci ; son frère Ptolémée III envahit alors la Syrie et rapporta dieux et trésors, troisième guerre de Syrie, 246–241. La grande armée « livrée entre ses mains » est celle d’Antiochos III, battu par Ptolémée IV à Raphia en 217 ; les « villes fortes » qu’Antiochos prit après sa victoire de Panion en 200 av. J.-C. comprennent Sidon, et avec elles il gagna la Judée. Sa fille Cléopâtre épousa Ptolémée V, Rome le brisa à Magnésie en 190, et il mourut en 187. Son fils Séleucos IV envoya « un exacteur », Héliodore, au Temple."
    - "« L’homme méprisé » qui suit est Antiochos IV Épiphane, roi de 175 à 164. Il envahit deux fois l’Égypte : à son premier retour, en 169, il pilla le Temple, « hostile à l’alliance sainte » dans son cœur, et à son second, en 168, « des navires de Kittim », l’envoyé romain Popilius Laenas à Éleusis, le firent rebrousser. Ses soldats profanèrent alors le sanctuaire et dressèrent « l’abomination du dévastateur », l’autel de décembre 167 que décrit 1 Maccabées et qui provoqua la révolte des Maccabées. Les versets 40–45, où le roi du septentrion meurt entre la mer et la montagne sainte, ne correspondent pas à la mort d’Antiochos en Perse en 164 ; la plupart des critiques datent donc le chapitre des mois qui précèdent et lisent sa fin comme une prédiction non réalisée, tandis que d’autres y voient un dernier ennemi à venir. Les deux lectures sont anciennes."
    - "Les Séleucides perdirent la Judée au profit des Hasmonéens et leur royaume au profit de Pompée en 64 av. J.-C. Leur capitale Antioche est Antakya, dans le sud de la Turquie, ravagée par le séisme de février 2023."
