body:
  en:
    - "“The king of the north” is a figure of Daniel 11, where an angel tells Daniel of the long wars between him and “the king of the south”. Since Jerome, who drew on the pagan critic Porphyry, readers have agreed that the south is Ptolemaic Egypt and the north the Seleucid kingdom, which ruled Syria, Mesopotamia and for a time Persia from Antioch on the Orontes; the record here, the kingdom of the king of the north, stands at Antioch. The chapter's “glorious land” between the two is Judea, which passed from the one to the other, and the names it never gives are supplied by Polybius, Livy, Appian and 1 Maccabees."
    - "The kings can be followed one by one. “One of his princes” who grew stronger than Ptolemy I is Seleucus I, who won Babylon in 312 BC. “The king's daughter of the south” who “shall come to the king of the north” is Berenice, married to Antiochus II about 252 BC and murdered with her child after his death; her brother Ptolemy III then invaded Syria and carried home gods and treasure, the Third Syrian War of 246–241. The great army “given into his hand” is that of Antiochus III, beaten by Ptolemy IV at Raphia in 217; the “most fenced cities” Antiochus took after his victory at Panium about 200 BC include Sidon, and with them he gained Judea. His daughter Cleopatra was married to Ptolemy V, Rome broke him at Magnesia in 190, and he died in 187. His son Seleucus IV sent “a raiser of taxes”, Heliodorus, to the Temple."
    - "The “vile person” who follows is Antiochus IV Epiphanes, king from 175 to 164. He invaded Egypt twice: on the first return, in 169, he plundered the Temple, “and his heart shall be against the holy covenant”, and on the second, in 168, “the ships of Chittim”, the Roman envoy Popillius Laenas at Eleusis, turned him back. His soldiers then polluted the sanctuary and set up “the abomination that maketh desolate”, the altar of December 167 that 1 Maccabees describes and that provoked the Maccabean revolt. Verses 40–45, in which the king of the north dies between the sea and the holy mountain, do not match Antiochus' death in Persia in 164; most critical scholars therefore date the chapter to the months before it and read its ending as a prediction that failed, while others read these verses of a last enemy still to come. Both readings are old."
    - "The Seleucids lost Judea to the Hasmoneans and their kingdom to Pompey in 64 BC. Their capital Antioch is Antakya in southern Turkey, wrecked by the earthquake of February 2023."
  ru:
    - "«Царь северный», как называет его Синодальный перевод, — лицо из 11-й главы Даниила, где ангел рассказывает Даниилу о долгих войнах между ним и южным царём. Со времён Иеронима, опиравшегося на языческого критика Порфирия, читатели сходятся в том, что юг — это Египет Птолемеев, а север — царство Селевкидов, правивших Сирией, Месопотамией и одно время Персией из Антиохии на Оронте; запись «Царство северного царя» стоит здесь в Антиохии. Земля между ними, которую глава зовёт «славной», — Иудея, переходившая от одних к другим, а имена, которых глава не называет, дают Полибий, Ливий, Аппиан и Первая книга Маккавейская."
    - "Царей можно проследить одного за другим. «Один из князей», переросший Птолемея I, — Селевк I, взявший Вавилон в 312 г. до н. э. «Дочь южного царя», которая «придет к царю северному», — Береника, выданная за Антиоха II около 252 г. до н. э. и убитая вместе с ребёнком после его смерти; её брат Птолемей III вторгся затем в Сирию и увёз богов и сокровища — Третья Сирийская война 246–241 гг. Большое войско, о котором сказано «предано будет войско в руки его», — войско Антиоха III, разбитое Птолемеем IV при Рафии в 217 г.; «укрепленным городом», которым Антиох овладел после победы при Панионе около 200 г. до н. э., был Сидон, и вместе с ним он получил Иудею. Его дочь Клеопатру выдали за Птолемея V, Рим сломил его при Магнесии в 190 г., и он погиб в 187 г. Его сын Селевк IV послал к Храму «сборщика податей» Гелиодора."
    - "«Презренный», который следует далее, — Антиох IV Епифан, царь с 175 по 164 г. Он дважды вторгался в Египет: возвращаясь в первый раз, в 169 г., он ограбил Храм с «враждебным намерением против святаго завета», а во второй, в 168 г., «корабли Киттимские» — римский посол Попилий Ленат в Елевсине — повернули его назад. Затем его воины осквернили святилище и поставили «мерзость запустения» — жертвенник декабря 167 г., о котором рассказывает Первая книга Маккавейская и который вызвал восстание Маккавеев. Стихи 40–45, где царь северный гибнет между морем и святой горой, не сходятся со смертью Антиоха в Персии в 164 г.; поэтому большинство критических учёных датируют главу месяцами перед ней и читают её конец как несбывшееся предсказание, а другие относят эти стихи к последнему врагу, который ещё придёт. Оба прочтения стары."
    - "Селевкиды потеряли Иудею, отошедшую к Хасмонеям, а царство — в 64 г. до н. э., когда его упразднил Помпей. Их столица Антиохия — нынешняя Антакья на юге Турции, разрушенная землетрясением в феврале 2023 года."
  uk:
    - "Цар півночі — постать з розділу 11 Книги Даниїла, де ангел розповідає Даниїлові про довгі війни між ним і царем півдня. Від Єроніма, який спирався на язичницького критика Порфирія, читачі погоджуються, що південь — це Птолемеївський Єгипет, а північ — держава Селевкідів, яка правила Сирією, Месопотамією й деякий час Персією з Антіохії на Оронті; запис тут, царство царя півночі, розміщує його в Антіохії. Славна земля між ними, про яку говорить розділ, — це Юдея, що переходила від одного до другого, а імена, яких розділ ніколи не називає, подають Полібій, Лівій, Аппіан та Перша книга Макавеїв."
    - "За царями можна простежити по одному. Той, хто став сильнішим за Птолемея I, — «один із князїв» першого царя, — це Селевк I, який здобув Вавилон 312 р. до н. е. Та, що як «дочка південного царя» «прийде до царя північнього», — Береніка, видана заміж за Антіоха II близько 252 р. до н. е. і вбита разом з дитиною після його смерті; її брат Птолемей III тоді вторгся до Сирії й повіз додому богів і скарби — Третя Сирійська війна 246–241 рр. до н. е. Велике військо, що «віддане буде... в його руки», — це військо Антіоха III, розбите Птолемеєм IV під Рафією 217 р. до н. е.; найукріпленіші міста, які Антіох узяв після перемоги при Панії близько 200 р. до н. е., включають Сідон, а з ними він здобув Юдею. Його дочку Клеопатру видали за Птолемея V, Рим зламав його під Магнесією 190 р. до н. е., а помер він 187 р. до н. е. Його син Селевк IV послав до Храму «побірника податків», Геліодора."
    - "Той, хто йде слідом, «згірдний», — Антіох IV Епіфан, цар із 175 до 164 р. до н. е. Він двічі вторгався до Єгипту: першого разу, на зворотному шляху 169 р. до н. е., пограбував Храм і повернувся «з великим багацтвом і ворожими думками проти завіту сьвятого», а другого, 168 р. до н. е., його завернули назад «кораблї Киттимські» — римський посол Попілій Ленат в Елевсіні. Тоді його воїни осквернили святиню й поставили гидоту спустошення — вівтар грудня 167 р. до н. е., який описує Перша книга Макавеїв і який спровокував Макавейське повстання. Вірші 40–45, у яких цар північний гине між морем і святою горою, не відповідають смерті Антіоха в Персії 164 р. до н. е.; тому більшість критичних учених датує розділ місяцями до неї й читає його кінець як передбачення, що не справдилося, тоді як інші відносять ці вірші до останнього ворога, що ще має прийти. Обидва прочитання давні."
    - "Селевкіди втратили Юдею на користь Хасмонеїв, а своє царство — Помпеєві 64 р. до н. е. Їхня столиця Антіохія — це Антак'я на півдні Туреччини, зруйнована землетрусом у лютому 2023 року."
  es:
    - "«El rey del norte» es una figura de Daniel 11, donde un ángel habla a Daniel de las largas guerras entre él y «el rey del mediodía». Desde Jerónimo, que se apoyó en el crítico pagano Porfirio, los lectores coinciden en que el sur es el Egipto ptolemaico y el norte el reino seléucida, que gobernó Siria, Mesopotamia y durante un tiempo Persia desde Antioquía del Orontes; el registro de aquí, el reino del rey del norte, tiene su sede en Antioquía. La «tierra deseable» que el capítulo sitúa entre ambos es Judea, que pasó de uno a otro, y los nombres que nunca da los suplen Polibio, Livio, Apiano y 1 Macabeos."
    - "Los reyes pueden seguirse uno por uno. «Uno de los príncipes de aquél» que se hizo más fuerte que Tolomeo I es Seleuco I, que ganó Babilonia en 312 a. C. «La hija del rey del mediodía» que «vendrá al rey del norte» es Berenice, casada con Antíoco II hacia 252 a. C. y asesinada con su hijo tras la muerte de él; su hermano Tolomeo III invadió entonces Siria y se llevó a casa dioses y tesoros, la Tercera Guerra Siria de 246–241. La gran multitud «entregada en su mano» es el ejército de Antíoco III, vencido por Tolomeo IV en Rafia en 217; las ciudades más fortificadas que Antíoco tomó tras su victoria en Panion hacia 200 a. C. incluyen Sidón, y con ellas ganó Judea. Su hija Cleopatra se casó con Tolomeo V, Roma lo quebrantó en Magnesia en 190, y murió en 187. Su hijo Seleuco IV envió al templo a Heliodoro, el «exactor»."
    - "El «vil» que sigue es Antíoco IV Epífanes, rey de 175 a 164. Invadió Egipto dos veces: en el primer regreso, en 169, saqueó el templo, «y su corazón será contra el pacto santo», y en el segundo, en 168, «naves de Chîttim», el enviado romano Popilio Lenas en Eleusis, lo hicieron volver. Sus soldados contaminaron entonces el santuario y pusieron «la abominación espantosa», el altar de diciembre de 167 que describe 1 Macabeos y que provocó la revuelta macabea. Los versículos 40–45, en los que el rey del norte muere entre el mar y el monte santo, no concuerdan con la muerte de Antíoco en Persia en 164; por eso la mayoría de los estudiosos críticos fecha el capítulo en los meses anteriores y lee su final como una predicción que falló, mientras que otros leen estos versículos de un último enemigo aún por venir. Ambas lecturas son antiguas."
    - "Los seléucidas perdieron Judea ante los asmoneos y su reino ante Pompeyo en 64 a. C. Su capital, Antioquía, es Antakya, en el sur de Turquía, devastada por el terremoto de febrero de 2023."
  pt:
    - "“O rei do norte” é uma figura de Daniel 11, em que um anjo fala a Daniel das longas guerras entre ele e “o rei do sul”. Desde Jerônimo, que se apoiou no crítico pagão Porfírio, os leitores concordam que o sul é o Egito ptolemaico e o norte o reino selêucida, que governava a Síria, a Mesopotâmia e por algum tempo a Pérsia a partir de Antioquia do Orontes; o registro aqui, o reino do rei do norte, está em Antioquia. A “terra gloriosa” entre os dois, no capítulo, é a Judeia, que passou de um para o outro, e os nomes que o texto nunca dá são fornecidos por Políbio, Tito Lívio, Apiano e 1 Macabeus."
    - "Os reis podem ser acompanhados um a um. “Um de seus príncipes”, que se tornou mais forte do que Ptolomeu I, é Seleuco I, que conquistou Babilônia em 312 a.C. “A filha do rei do sul”, que “virá ao rei do norte”, é Berenice, casada com Antíoco II por volta de 252 a.C. e morta com o filho depois da morte dele; seu irmão Ptolomeu III invadiu então a Síria e levou para casa deuses e tesouros, na Terceira Guerra Síria, de 246–241. O grande exército “entregue em sua mão” é o de Antíoco III, derrotado por Ptolomeu IV em Ráfia, em 217; as cidades fortificadas que Antíoco tomou depois de sua vitória em Panion, por volta de 200 a.C., incluem Sídon, e com elas ele ganhou a Judeia. Sua filha Cleópatra casou-se com Ptolomeu V, Roma o quebrou em Magnésia, em 190, e ele morreu em 187. Seu filho Seleuco IV enviou ao Templo “um cobrador de impostos”, Heliodoro."
    - "A “pessoa desprezível” que se segue é Antíoco IV Epifânio, rei de 175 a 164. Invadiu o Egito duas vezes: na primeira volta, em 169, saqueou o Templo, “O seu coração será contra a santa aliança”, e na segunda, em 168, “navios de Quitim”, o enviado romano Popílio Lenas em Elêusis, o fez recuar. Seus soldados profanaram então o santuário e estabeleceram “a abominação que causa desolação”, o altar de dezembro de 167 que 1 Macabeus descreve e que provocou a revolta dos macabeus. Os versículos 40–45, em que o rei do norte morre entre o mar e o monte santo, não coincidem com a morte de Antíoco na Pérsia em 164; a maioria dos estudiosos críticos data por isso o capítulo dos meses anteriores e lê seu final como uma predição que falhou, enquanto outros leem esses versículos a respeito de um último inimigo ainda por vir. Ambas as leituras são antigas."
    - "Os selêucidas perderam a Judeia para os hasmoneus e seu reino para Pompeu em 64 a.C. Sua capital, Antioquia, é Antakya, no sul da Turquia, devastada pelo terremoto de fevereiro de 2023."
  de:
    - "Der König des Nordens ist eine Gestalt aus Daniel 11, wo ein Engel Daniel von den langen Kriegen zwischen ihm und dem König des Südens berichtet. Seit Hieronymus, der sich auf den heidnischen Kritiker Porphyrios stützte, sind sich die Leser einig, dass der Süden das ptolemäische Ägypten und der Norden das Seleukidenreich ist, das von Antiochia am Orontes aus Syrien, Mesopotamien und zeitweise Persien beherrschte; die Karte setzt das Reich des Königs des Nordens hier nach Antiochia. Das „werte Land“ zwischen beiden ist Judäa, das vom einen an den anderen fiel, und die Namen, die das Kapitel nie nennt, liefern Polybios, Livius, Appian und das 1. Makkabäerbuch."
    - "Die Könige lassen sich einzeln verfolgen. „Seiner Fürsten einer“, mächtiger als Ptolemaios I., ist Seleukos I., der 312 v. Chr. Babylon gewann. „Die Tochter des Königs gegen Mittag“, die „kommen“ wird „zum König gegen Mitternacht“, ist Berenike, um 252 v. Chr. mit Antiochos II. vermählt und nach dessen Tod samt ihrem Kind ermordet; ihr Bruder Ptolemaios III. fiel in Syrien ein und führte Götter und Schätze heim (Dritter Syrischer Krieg, 246–241). Das große Heer, „in seine Hand gegeben“, ist das Antiochos' III., den Ptolemaios IV. 217 bei Raphia schlug; die festen Städte, die Antiochos nach seinem Sieg bei Paneas um 200 v. Chr. nahm, schließen Sidon ein, und mit ihnen gewann er Judäa. Seine Tochter Kleopatra heiratete Ptolemaios V., Rom brach ihn 190 bei Magnesia, 187 starb er. Sein Sohn Seleukos IV. schickte Heliodor, einen Steuereintreiber, zum Tempel."
    - "Der „Ungeachtete“ ist Antiochos IV. Epiphanes, König 175–164. Er fiel zweimal in Ägypten ein: Bei der ersten Rückkehr 169 plünderte er den Tempel, das Herz „wider den heiligen Bund“ gerichtet; bei der zweiten, 168, kamen „Schiffe aus Chittim“, der römische Gesandte Popillius Laenas bei Eleusis, und wiesen ihn zurück. Seine Soldaten entweihten dann das Heiligtum und richteten „einen Greuel der Verwüstung“ auf, den Altar vom Dezember 167, den 1. Makkabäer beschreibt und der den Makkabäeraufstand auslöste. Die Verse 40–45, in denen der König des Nordens zwischen dem Meer und dem heiligen Berg stirbt, passen nicht zu Antiochos' Tod in Persien 164; die meisten kritischen Gelehrten datieren das Kapitel daher auf die Monate davor und lesen das Ende als gescheiterte Vorhersage, andere beziehen die Verse auf einen letzten, noch kommenden Feind. Beide Deutungen sind alt."
    - "Die Seleukiden verloren Judäa an die Hasmonäer und ihr Reich 64 v. Chr. an Pompeius. Ihre Hauptstadt Antiochia ist Antakya im Süden der Türkei, im Februar 2023 durch das Erdbeben verwüstet."
  fr:
    - "« Le roi du septentrion » est une figure de Daniel 11, où un ange raconte à Daniel les longues guerres entre lui et « le roi du midi ». Depuis Jérôme, qui s’appuyait sur le critique païen Porphyre, on s’accorde à voir dans le sud l’Égypte lagide et dans le nord le royaume séleucide, qui régna sur la Syrie, la Mésopotamie et un temps la Perse depuis Antioche sur l’Oronte ; le relevé ici, le royaume du roi du Nord, est placé à Antioche. Le « plus beau des pays » entre les deux est la Judée, qui passa de l’un à l’autre, et les noms que le chapitre ne donne jamais sont fournis par Polybe, Tite-Live, Appien et 1 Maccabées."
    - "On peut suivre les rois un à un. « Un de ses chefs » devenu plus fort que Ptolémée Ier est Séleucos Ier, qui conquit Babylone en 312 av. J.-C. « La fille du roi du midi » qui « viendra vers le roi du septentrion » est Bérénice, mariée à Antiochos II vers 252 av. J.-C. et assassinée avec son enfant après la mort de celui-ci ; son frère Ptolémée III envahit alors la Syrie et rapporta dieux et trésors, troisième guerre de Syrie, 246–241. La grande armée « livrée entre ses mains » est celle d’Antiochos III, battu par Ptolémée IV à Raphia en 217 ; les « villes fortes » qu’Antiochos prit après sa victoire de Panion vers 200 av. J.-C. comprennent Sidon, et avec elles il gagna la Judée. Sa fille Cléopâtre épousa Ptolémée V, Rome le brisa à Magnésie en 190, et il mourut en 187. Son fils Séleucos IV envoya « un exacteur », Héliodore, au Temple."
    - "« L’homme méprisé » qui suit est Antiochos IV Épiphane, roi de 175 à 164. Il envahit deux fois l’Égypte : à son premier retour, en 169, il pilla le Temple, « hostile à l’alliance sainte » dans son cœur, et à son second, en 168, « des navires de Kittim », l’envoyé romain Popilius Laenas à Éleusis, le firent rebrousser. Ses soldats profanèrent alors le sanctuaire et dressèrent « l’abomination du dévastateur », l’autel de décembre 167 que décrit 1 Maccabées et qui provoqua la révolte des Maccabées. Les versets 40–45, où le roi du septentrion meurt entre la mer et la montagne sainte, ne correspondent pas à la mort d’Antiochos en Perse en 164 ; la plupart des critiques datent donc le chapitre des mois qui précèdent et lisent sa fin comme une prédiction non réalisée, tandis que d’autres y voient un dernier ennemi à venir. Les deux lectures sont anciennes."
    - "Les Séleucides perdirent la Judée au profit des Hasmonéens et leur royaume au profit de Pompée en 64 av. J.-C. Leur capitale Antioche est Antakya, dans le sud de la Turquie, ravagée par le séisme de février 2023."
  it:
    - "«Il re del settentrione» è una figura di Daniele 11, dove un angelo parla a Daniele delle lunghe guerre tra lui e «il re del mezzogiorno». Da Girolamo, che attingeva al critico pagano Porfirio, gli interpreti concordano che il sud sia l’Egitto tolemaico e il nord il regno seleucide, che dominava Siria, Mesopotamia e per un periodo la Persia da Antiochia sull’Oronte; la voce qui, il regno del re del settentrione, ha sede ad Antiochia. Il «paese splendido» tra i due, nel capitolo, è la Giudea, che passò dall’uno all’altro, e i nomi che il testo non fa mai sono forniti da Polibio, Livio, Appiano e dal primo libro dei Maccabei."
    - "I re si possono seguire uno per uno. «Uno dei suoi capi» che divenne più forte di Tolomeo I è Seleuco I, che conquistò Babilonia nel 312 a.C. «La figliuola del re del mezzogiorno» che «verrà al re del settentrione» è Berenice, sposata ad Antioco II verso il 252 a.C. e uccisa con il figlio dopo la morte di lui; suo fratello Tolomeo III invase allora la Siria e portò in patria dèi e tesori, la terza guerra siriaca del 246–241. La grande moltitudine che «sarà data in mano del re del mezzogiorno» è l’esercito di Antioco III, battuto da Tolomeo IV a Rafia nel 217; le città più fortificate che Antioco prese dopo la vittoria di Panion verso il 200 a.C. includono Sidone, e con esse acquisì la Giudea. Sua figlia Cleopatra fu data in moglie a Tolomeo V, Roma lo piegò a Magnesia nel 190, ed egli morì nel 187. Suo figlio Seleuco IV mandò al Tempio «un esattore di tributi», Eliodoro."
    - "L’«uomo spregevole» che segue è Antioco IV Epifane, re dal 175 al 164. Invase l’Egitto due volte: al primo ritorno, nel 169, saccheggiò il Tempio, e «il suo cuore formerà dei disegni contro al patto santo»; al secondo, nel 168, «delle navi di Kittim», l’inviato romano Popilio Lenate a Eleusi, lo fecero tornare indietro. I suoi soldati profanarono il santuario e vi collocarono «l’abominazione, che cagiona la desolazione», l’altare del dicembre 167 che descrive 1 Maccabei e che provocò la rivolta dei Maccabei. I versetti 40–45, in cui il re del nord muore tra il mare e il monte santo, non corrispondono alla morte di Antioco in Persia nel 164; la maggior parte degli studiosi critici data perciò il capitolo ai mesi precedenti e ne legge la conclusione come una predizione fallita, mentre altri vi vedono un ultimo nemico ancora a venire. Entrambe le letture sono antiche."
    - "I Seleucidi persero la Giudea a favore degli Asmonei e il loro regno a favore di Pompeo nel 64 a.C. La loro capitale Antiochia è Antakya, nel sud della Turchia, devastata dal terremoto del febbraio 2023."
  pl:
    - "„Król północny” to postać z 11. rozdziału Księgi Daniela, w którym anioł mówi Danielowi o długich wojnach: „król północny” staje przeciw „królowi z południa”. Od czasów Hieronima, który oparł się na pogańskim krytyku Porfiriuszu, czytelnicy zgadzają się, że południe to Egipt Ptolemeuszów, a północ to państwo Seleucydów, które rządziło Syrią, Mezopotamią i przez pewien czas Persją z Antiochii nad Orontesem; punkt na mapie, królestwo króla północy, leży w Antiochii. Leżąca między nimi „ziemia ozdobna” rozdziału to Judea, która przechodziła od jednego do drugiego, a imion, których rozdział nigdy nie podaje, dostarczają Polibiusz, Liwiusz, Appian i 1 Księga Machabejska."
    - "Królów można prześledzić jednego po drugim. „Jeden z książąt jego”, który stał się mocniejszy od Ptolemeusza I, to Seleukos I, który zdobył Babilon w 312 roku p.n.e. „Córka króla od południa”, która „pójdzie za króla północnego”, to Berenika, wydana około 252 roku p.n.e. za Antiocha II i zamordowana z dzieckiem po jego śmierci; jej brat Ptolemeusz III najechał wtedy Syrię i uwiózł bogów i skarby, w trzeciej wojnie syryjskiej (246–241). Wielkie mnóstwo, które „będzie podane w rękę jego”, to wojsko Antiocha III, pobitego przez Ptolemeusza IV pod Rafią w 217; po zwycięstwie pod Panion około 200 roku p.n.e. wziął „miasto obronne”, a wśród zdobytych miast był Sydon, i zyskał Judeę. Jego córkę Kleopatrę wydano za Ptolemeusza V, Rzym złamał go pod Magnezją w 190, a zmarł w 187. Jego syn Seleukos IV „roześle poborców”: to Heliodor, posłany do Świątyni."
    - "„Wzgardzony”, który następuje, to Antioch IV Epifanes, król w latach 175–164. Dwukrotnie najechał Egipt: po pierwszym powrocie, w 169, złupił Świątynię, „a serce jego obróci się przeciwko przymierzu świętemu”, a w drugim, w 168, zawróciły go „okręty z Cytym”, czyli rzymski poseł Popiliusz Laenas pod Eleusis. Jego żołnierze splugawili potem sanktuarium i postawili „obrzydliwość spustoszenia”, ołtarz z grudnia 167, opisany w 1 Księdze Machabejskiej, który wywołał powstanie machabejskie. Wersety 40–45, w których król północny umiera między morzem a świętą górą, nie zgadzają się ze śmiercią Antiocha w Persji w 164; większość uczonych krytycznych datuje więc rozdział na miesiące przed nią i czyta zakończenie jako przepowiednię, która zawiodła, inni zaś odnoszą te wersety do ostatniego wroga, który ma jeszcze nadejść. Obie interpretacje są stare."
    - "Seleucydzi stracili Judeę na rzecz Hasmoneuszy, a swoje królestwo na rzecz Pompejusza w 64 roku p.n.e. Ich stolica Antiochia to dzisiejsza Antakya w południowej Turcji, zniszczona trzęsieniem ziemi w lutym 2023 roku."
  cs:
    - "„Král půlnoční“ je postava z Daniele 11, kde anděl vypráví Danielovi o dlouhých válkách, v nichž proti sobě stojí on a „král polední“. Od Jeronýma, který vycházel z pohanského kritika Porfyria, se čtenáři shodují, že jih je ptolemaiovský Egypt a sever říše Seleukovců, která vládla Sýrii, Mezopotámii a čas i Persii z Antiochie nad Orontem; záznam zde, království krále severního, leží v Antiochii. „Slavná země“ kapitoly mezi nimi je Judsko, které přecházelo od jednoho k druhému, a jména, která kapitola nikdy neuvádí, doplňují Polybios, Livius, Appianos a 1. Makabejská."
    - "Krále lze sledovat jednoho po druhém. „Jedno z knížat jeho“, které zesílilo nad Ptolemaia I., je Seleukos I., který roku 312 př. n. l. získal Babylón. „Dcera krále poledního dostane se za krále půlnočního“ je Bereníké, provdaná asi roku 252 př. n. l. za Antiocha II. a po jeho smrti zavražděná i s dítětem; její bratr Ptolemaios III. pak vpadl do Sýrie a odvezl domů bohy a poklady, třetí syrská válka 246–241. Velké vojsko, které „bude vydáno ... v ruku jeho“, je vojsko Antiocha III., poražené Ptolemaiem IV. u Rafie roku 217; „měst hrazených“, jichž Antiochos po vítězství u Paneia kolem roku 200 př. n. l. dobyl, patří i Sidón, a s nimi získal Judsko. Jeho dcera Kleopatra byla provdána za Ptolemaia V., Řím ho zlomil u Magnésie roku 190 a roku 187 zemřel. Jeho syn Seleukos IV. poslal do Chrámu Héliodóra, toho, „kterýž rozešle výběrčí“."
    - "„Nevzácný“, který následuje, je Antiochos IV. Epifanés, král v letech 175–164. Dvakrát vpadl do Egypta: při prvním návratu roku 169 vyplenil Chrám, „a srdce jeho bude proti smlouvě svaté“, a při druhém roku 168 ho obrátily zpět „lodí Citejské“, římský vyslanec Popilius Laenas u Eleusíny. Jeho vojáci pak znesvětili svatyni a postavili „ohavnost zpuštění“, oltář z prosince 167, který popisuje 1. Makabejská a který vyvolal makabejské povstání. Verše 40–45, v nichž král půlnoční umírá mezi mořem a svatou horou, neodpovídají smrti Antiocha v Persii roku 164; většina kritických učenců proto kapitolu datuje do měsíců před ní a její konec čte jako neuskutečněnou předpověď, jiní tyto verše čtou o posledním nepříteli, který teprve přijde. Obě čtení jsou stará."
    - "Seleukovci ztratili Judsko ve prospěch Hasmoncovců a své království roku 64 př. n. l. ve prospěch Pompeia. Jejich hlavní město Antiochie je Antakya v jižním Turecku, zpustošená zemětřesením v únoru 2023."
  nl:
    - "“De koning van het Noorden” is een figuur uit Daniël 11, waar een engel Daniël vertelt over de lange oorlogen tussen hem en “de koning van het Zuiden”. Sinds Hieronymus, die steunde op de heidense criticus Porfyrius, zijn lezers het erover eens dat het zuiden het Ptolemeïsche Egypte is en het noorden het Seleucidenrijk, dat vanuit Antiochië aan de Orontes over Syrië, Mesopotamië en een tijd lang Perzië heerste; de kaartvermelding hier, het koninkrijk van de koning van het Noorden, staat bij Antiochië. Het “land des sieraads” van het hoofdstuk, tussen beide in, is Judea, dat van de een op de ander overging, en de namen die het nooit geeft worden aangevuld door Polybios, Livius, Appianus en 1 Makkabeeën."
    - "De koningen zijn een voor een te volgen. “Een van zijn vorsten” die sterker werd dan Ptolemaeus I is Seleucus I, die in 312 v.Chr. Babylon won. “De dochter des konings van het Zuiden” die “zal komen tot de koning van het Noorden” is Berenice, omstreeks 252 v.Chr. gehuwd met Antiochus II en na zijn dood met haar kind vermoord; haar broer Ptolemaeus III viel Syrië binnen en nam goden en schatten mee, de Derde Syrische Oorlog van 246–241. Het grote leger dat “in zijn hand gegeven” werd, is dat van Antiochus III, in 217 bij Raphia door Ptolemaeus IV verslagen; de “vaste steden” die Antiochus na zijn overwinning bij Panium omstreeks 200 v.Chr. innam, omvatten Sidon, en met hen won hij Judea. Zijn dochter Cleopatra trouwde met Ptolemaeus V, Rome brak hem bij Magnesia in 190, en hij stierf in 187. Zijn zoon Seleucus IV zond “een geldeiser”, Heliodorus, naar de tempel."
    - "De “verachte” die volgt is Antiochus IV Epifanes, koning van 175 tot 164. Hij viel tweemaal Egypte binnen: bij de eerste terugkeer, in 169, plunderde hij de tempel, “en zijn hart zal zijn tegen het heilig verbond”, en bij de tweede, in 168, hielden “schepen van Chittim”, de Romeinse gezant Popillius Laenas bij Eleusis, hem tegen. Zijn soldaten ontheiligden daarna het heiligdom en stelden “een verwoestenden gruwel” op, het altaar van december 167 uit 1 Makkabeeën, dat de Makkabeese opstand uitlokte. De verzen 40–45, waarin de koning van het Noorden tussen de zee en de heilige berg sterft, komen niet overeen met Antiochus’ dood in Perzië in 164; daarom dateren de meeste kritische geleerden het hoofdstuk in de maanden ervoor en lezen het slot als een voorspelling die mislukte, terwijl anderen ze op een toekomstige laatste vijand betrekken. Beide lezingen zijn oud."
    - "De Seleuciden verloren Judea aan de Hasmoneeën en hun koninkrijk in 64 v.Chr. aan Pompeius. Hun hoofdstad Antiochië is Antakya in het zuiden van Turkije, verwoest door de aardbeving van februari 2023."
  sv:
    - "”Konungen i Nordlandet” är en gestalt i Daniel 11, där en ängel berättar för Daniel om de långa krigen mellan honom och ”konungen i Söderlandet”. Sedan Hieronymus, som byggde på den hedniske kritikern Porfyrios, har läsare varit överens om att söder är det ptolemaiska Egypten och norr det seleukidiska riket, som från Antiochia vid Orontes härskade över Syrien, Mesopotamien och en tid Persien; posten här, konungen i Nordlandets rike, står vid Antiochia. Kapitlets ”det härliga landet” mellan de två är Judeen, som gick från den ena till den andra, och de namn som aldrig anges tillhandahålls av Polybios, Livius, Appianos och Första Mackabeerboken."
    - "Kungarna kan följas en efter en. ”En av hans furstar” som blev starkare än Ptolemaios I är Seleukos I, som vann Babylon 312 f.Kr. ”Söderlandskonungens dotter”, som ”skall draga till konungen i Nordlandet”, är Berenike, gift med Antiochos II omkring 252 f.Kr. och mördad med sitt barn efter hans död; hennes bror Ptolemaios III invaderade då Syrien och förde hem gudar och skatter, det tredje syriska kriget 246–241. Den stora hären som blev ”given i den andres hand” är Antiochos III:s, besegrad av Ptolemaios IV vid Raphia 217; de starkast befästa städerna, som Antiochos tog efter sin seger vid Panion omkring 200 f.Kr., inbegriper Sidon, och med dem vann han Judeen. Hans dotter Kleopatra gifte sig med Ptolemaios V, Rom krossade honom vid Magnesia 190, och han dog 187. Hans son Seleukos IV sände ”en fogde”, Heliodoros, till templet."
    - "”En föraktlig man” som följer är Antiochos IV Epifanes, kung 175–164. Han invaderade Egypten två gånger: vid den första hemkomsten, 169, plundrade han templet och skulle ”lägga planer mot det heliga förbundet”, och vid den andra, 168, vände ”skepp från Kittim”, den romerske sändebudet Popilius Laenas vid Eleusis, honom tillbaka. Hans soldater orenade sedan helgedomen och ställde upp ”förödelsens styggelse”, altaret från december 167 som Första Mackabeerboken beskriver och som utlöste det mackabeiska upproret. Verserna 40–45, där konungen i Nordlandet dör mellan havet och det heliga berget, stämmer inte med Antiochos död i Persien 164; de flesta kritiska forskare daterar därför kapitlet till månaderna före den och läser dess slut som en förutsägelse som misslyckades, medan andra läser dessa verser om en sista fiende som ännu ska komma. Båda tolkningarna är gamla."
    - "Seleukiderna förlorade Judeen till hasmoneerna och sitt rike till Pompejus 64 f.Kr. Deras huvudstad Antiochia är Antakya i södra Turkiet, förstörd av jordbävningen i februari 2023."
  nb:
    - "«Nordens konge» er en skikkelse i Daniel 11, der en engel forteller Daniel om de lange krigene mellom ham og «Sydens konge». Siden Hieronymus, som bygde på den hedenske kritikeren Porfyrios, har lesere vært enige om at sør er det ptolemaiske Egypt og nord det seleukidiske riket, som styrte Syria, Mesopotamia og en tid Persia fra Antiokia ved Orontes; kartoppføringen her, Nordkongens rike, står ved Antiokia. Kapitlets «fagre land» mellom de to er Judea, som gikk fra den ene til den andre, og de navnene som aldri gis, leveres av Polybios, Livius, Appian og 1. Makkabeerbok."
    - "Kongene kan følges én for én. «En av hans fyrster» som ble mektigere enn Ptolemaios I er Seleukos I, som vant Babylon i 312 f.Kr. «En datter av Sydens konge» som «skal komme til Nordens konge» er Berenike, gift med Antiokhos II omkring 252 f.Kr. og drept med barnet sitt etter hans død; hennes bror Ptolemaios III invaderte da Syria og førte guder og skatter hjem, den tredje syriske krig 246–241. Den store hæren som «gis i hans hånd» er Antiokhos III's, slått av Ptolemaios IV ved Rafia i 217; de sterke byene Antiokhos tok etter seieren ved Panion omkring 200 f.Kr. omfatter Sidon, og med dem vant han Judea. Datteren Kleopatra ble gift med Ptolemaios V, Roma knuste ham ved Magnesia i 190, og han døde i 187. Sønnen Seleukos IV sendte «en skattekrever», Heliodoros, til tempelet."
    - "«Et foraktelig menneske» følger, og det er Antiokhos IV Epifanes, konge fra 175 til 164. Han invaderte Egypt to ganger: ved den første hjemreisen, i 169, plyndret han tempelet, og «han skal legge op råd mot den hellige pakt», og ved den andre, i 168, snudde «skib fra Kittim», den romerske utsendingen Popillius Laenas ved Eleusis, ham. Soldatene hans vanhelliget så helligdommen og reiste «den ødeleggende vederstyggelighet», alteret fra desember 167 som 1. Makkabeerbok beskriver, og som utløste makkabeeropprøret. Versene 40–45, der Nordens konge dør mellom havet og det hellige fjell, stemmer ikke med Antiokhos' død i Persia i 164; de fleste kritiske forskere daterer derfor kapitlet til månedene før og leser slutten som en spådom som slo feil, mens andre leser disse versene om en siste fiende som ennå skal komme. Begge lesningene er gamle."
    - "Seleukidene mistet Judea til hasmoneerne og riket sitt til Pompeius i 64 f.Kr. Hovedstaden Antiokia er Antakya i Sør-Tyrkia, ødelagt av jordskjelvet i februar 2023."
  tl:
    - "Ang “hari sa hilagaan” ay isang tauhan sa Daniel 11, kung saan sinasabi ng isang anghel kay Daniel ang mahahabang digmaan sa pagitan niya at ng “hari sa timugan”. Mula pa kay Jerome, na umasa sa paganong kritikong si Porphyry, nagkakasundo ang mga mambabasa na ang timog ay ang Egipto ng mga Ptolemeo at ang hilaga ay ang kahariang Seleucida, na namahala sa Siria, Mesopotamia at sa loob ng ilang panahon sa Persia mula sa Antioquia sa Orontes; ang tala rito, ang kaharian ng hari sa hilagaan, ay nasa Antioquia. Ang “maluwalhating lupain” ng kabanata sa pagitan ng dalawa ay ang Judea, na lumipat mula sa isa patungo sa isa, at ang mga pangalang hindi nito ibinibigay ay inilalaan nina Polibio, Livio, Apiano at ng 1 Macabeo."
    - "Masusundan ang mga hari. Ang “isa sa kaniyang mga prinsipe” na lumakas kaysa kay Ptolemeo I ay si Seleuco I, nagwagi sa Babilonia noong 312 BK. Ang “anak na babae ng hari sa timugan” na “paroroon sa hari sa hilagaan” ay si Berenice, ikinasal kay Antioco II mga 252 BK at pinatay kasama ng anak pagkamatay niya; sinalakay ng kapatid niyang Ptolemeo III ang Siria at iniuwi ang mga diyos at yaman (Ikatlong Digmaang Siryano 246–241). Ang malaking hukbong “mabibigay sa kaniyang kamay” ay kay Antioco III, natalo ni Ptolemeo IV sa Raphia noong 217; kabilang sa “bayan na nakukutaang mabuti” na kinuha niya matapos manalo sa Panium mga 200 BK ang Sidon, at nakuha rin ang Judea. Ikinasal si Cleopatra, anak niya, kay Ptolemeo V; dinurog siya ng Roma sa Magnesia noong 190 at namatay noong 187. Isinugo ng anak niyang si Seleuco IV ang “maniningil” na si Heliodoro sa Templo."
    - "Ang “hamak na tao” na sumusunod ay si Antioco IV Epiphanes (175–164). Dalawang beses niyang sinalakay ang Egipto: pagbalik noong 169, ninakawan ang Templo, “at ang kaniyang puso ay magiging laban sa banal na tipan”, at noong 168 ay pinabalik siya ng “mga sasakyan sa Chittim”, ang sugong Romano na si Popilio Laenas sa Eleusis. Nilapastangan ng mga sundalo ang santuwaryo at inilagay ang “kasuklamsuklam na naninira”, ang dambana ng Disyembre 167 sa 1 Macabeo na nagpasimula ng paghihimagsik ng Macabeo. Ang mga talata 40–45, kung saan namatay ang hari sa hilagaan sa pagitan ng dagat at banal na bundok, ay di tugma sa pagkamatay ni Antioco sa Persia noong 164; kaya ipinepetsa ng karamihan ng kritiko ang kabanata bago iyon at binabasa ang wakas bilang hulang nabigo, habang iniuugnay ng iba ang mga ito sa huling kaaway na darating. Luma ang parehong pagbasa."
    - "Nawala sa mga Seleucida ang Judea sa mga Hasmoneo at ang kanilang kaharian kay Pompeyo noong 64 BK. Ang kanilang kabisera, ang Antioquia, ay ang Antakya sa timog Turkey, na winasak ng lindol noong Pebrero 2023."
  da:
    - "»Kongen af Norden« er en skikkelse i Dan 11, hvor en engel fortæller Daniel om de lange krige mellem ham og »Kongen af Sønden«. Siden Hieronymus, der byggede på den hedenske kritiker Porfyr, har læserne været enige om, at syd er det ptolemæiske Egypten og nord det seleukidiske rige, som herskede over Syrien, Mesopotamien og en tid Persien fra Antiokia ved Orontes; posten her, kongen af Nordens rige, ligger i Antiokia. Kapitlets »det herlige Land« mellem de to er Judæa, som gik fra den ene til den anden, og de navne, det aldrig nævner, leveres af Polybios, Livius, Appian og 1 Makkabæerbog."
    - "Kongerne kan følges én for én. »En af hans Fyrster«, der blev mægtigere end Ptolemaios 1., er Seleukos 1., som vandt Babylon i 312 f.Kr. »Kongen af Søndens Datter«, der »skal drage ind til Kongen af Norden«, er Berenike, gift med Antiochos 2. omkring 252 f.Kr. og myrdet med sit barn efter hans død; hendes bror Ptolemaios 3. faldt da ind i Syrien og førte guder og skatte hjem, Den Tredje Syriske Krig 246–241. Den store hær, som »gives i hans Haand«, er Antiochos 3.'s, slået af Ptolemaios 4. ved Raphia i 217; blandt de byer, Antiochos indtog efter sin sejr ved Panion omkring 200 f.Kr., og som svarer til »en stærkt befæstet Stad«, er Sidon, og med dem vandt han Judæa. Hans datter Kleopatra blev gift med Ptolemaios 5., Rom knækkede ham ved Magnesia i 190, og han døde i 187. Hans søn Seleukos 4. sendte »en Plager«, Heliodoros, til templet."
    - "»En foragtet«, der følger, er Antiochos 4. Epifanes, konge fra 175 til 164. Han faldt to gange ind i Egypten: på den første hjemvej, i 169, plyndrede han templet, og »hans Hjerte skal lægge Raad op imod den hellige Pagt«, og på den anden, i 168, vendte »Skibe fra Kithim«, den romerske udsending Popillius Laenas ved Eleusis, ham om. Hans soldater vanhelligede derpå helligdommen og opstillede »den ødelæggende Vederstyggelighed«, alteret fra december 167, som 1 Makkabæerbog beskriver, og som udløste makkabæeropstanden. Vers 40–45, hvor kongen af Norden dør mellem havet og det hellige bjerg, stemmer ikke med Antiochos' død i Persien i 164; de fleste kritiske forskere dater derfor kapitlet til månederne før og læser dets slutning som en spådom, der slog fejl, mens andre læser disse vers om en sidste fjende, der endnu skal komme. Begge læsninger er gamle."
    - "Seleukiderne mistede Judæa til hasmonæerne og deres rige til Pompejus i 64 f.Kr. Deres hovedstad Antiokia er Antakya i det sydlige Tyrkiet, ødelagt af jordskælvet i februar 2023."
  sr:
    - "„Цар северни“ је лик из 11. главе Књиге пророка Данила, где анђео казује Данилу о дугим ратовима између њега и „цара јужног“. Од Јеронима, који се ослањао на незнабожачког критичара Порфирија, тумачи се слажу да је југ птолемејски Египат, а север селеукидско царство, које је владало Сиријом, Месопотамијом и за неко време Персијом из Антиохије на Оронту; запис овде, царство цара северног, стоји у Антиохији. Земља између двојице, која се у тој глави назива „красна“, јесте Јудеја, која је прелазила с једног на другог, а имена која глава никад не даје, допуњују Полибије, Ливије, Апијан и 1. Макавејска."
    - "Цареви се могу пратити један по један. „Један од кнезова његових“ који је ојачао више од Птолемеја I јесте Селевк I, који је освојио Вавилон 312. п. н. е. „Кћи јужног цара“ која „доћи ће к цару северном“ јесте Береника, удата за Антиоха II око 252. п. н. е. и убијена са дететом после његове смрти; њен брат Птолемеј III тада је напао Сирију и однео кући богове и благо, Трећи сиријски рат 246–241. Велика војска која ће „бити дата у руке“ јесте војска Антиоха III, коју је Птолемеј IV победио код Рафије 217; „тврде градове“ које је Антиох узео после победе код Паниона око 200. п. н. е. укључују Сидон, а с њима је добио и Јудеју. Његова кћи Клеопатра удата је за Птолемеја V, Рим га је сломио код Магнезије 190, а умро је 187. Његов син Селевк IV послао је у Храм „настојника“, Хелиодора."
    - "„Незнатан човек“ који следи јесте Антиох IV Епифан, цар од 175. до 164. Двапут је упао у Египат: при првом повратку, 169, опљачкао је Храм, „срце ће се његово обратити на свети завет“, а при другом, 168, „лађе китејске“, римски изасланик Попилије Ленат код Елеузине, вратиле су га. Његови војници потом су оскврнили светињу и поставили „гнусобу пустошну“, жртвеник из децембра 167. који описује 1. Макавејска и који је изазвао макавејски устанак. Стихови 40–45, у којима цар северни умире између мора и свете горе, не поклапају се са Антиоховом смрћу у Персији 164; већина критичких научника зато датира главу у месеце пре тога и крај чита као предвиђање које није испуњено, док други ове стихове односе на последњег непријатеља који тек долази. Оба читања су стара."
    - "Селеукиди су изгубили Јудеју од Хасмонејаца, а своје царство од Помпеја 64. п. н. е. Њихова престоница Антиохија је данашња Антакија у јужној Турској, разорена земљотресом у фебруару 2023."
  hu:
    - "„Az északi király” a Dán 11 alakja, ahol egy angyal Dánielnek az ő és „a déli király” közötti hosszú háborúkról beszél. Jeromos óta, aki a pogány Porphüriosz bírálatára támaszkodott, az olvasók egyetértenek abban, hogy a dél a Ptolemaida-kori Egyiptom, az észak pedig a szeleukida királyság, amely Szíriát, Mezopotámiát és egy ideig Perzsiát az Orontész menti Antiókhiából kormányozta; az itteni bejegyzés, az északi király királysága, Antiókhiánál áll. A fejezetben a kettő között fekvő „dicső földön” Júdeát kell érteni, amely az egyiktől a másikhoz került, a meg nem nevezett neveket pedig Polübiosz, Livius, Appianosz és az 1Makk adja."
    - "Aki „az ő vezérei közül is egyik”, és I. Ptolemaiosznál erősebb lett, I. Szeleukosz volt, aki Kr. e. 312-ben megszerezte Babilont. „A déli király leánya az északi királyhoz megy”: ő Bereniké, akit Kr. e. 252 körül II. Antiokhoszhoz adtak feleségül, és férje halála után gyermekével együtt megölték; fivére, III. Ptolemaiosz ezután betört Szíriába, isteneket és kincseket vitt haza (harmadik szíriai háború, Kr. e. 246–241). A nagy sereg, amely „annak a kezébe adatik”, III. Antiokhoszé, akit IV. Ptolemaiosz Kr. e. 217-ben Rafiánál megvert; az „erősített várost” pedig a Kr. e. 200 körüli paneioni győzelme után bevett városok jelentik, köztük Szidón, és velük Júdeát is megszerezte. Leánya, Kleopátra V. Ptolemaioszhoz ment férjhez; Róma Kr. e. 190-ben Magnésziánál összetörte, és Kr. e. 187-ben meghalt. Fia, IV. Szeleukosz adószedőt, Héliodórost küldte a Templomhoz."
    - "„Egy útálatos”, a következő király IV. Antiokhosz Epiphanész, Kr. e. 175-től 164-ig király. Kétszer tört be Egyiptomba: az elsőről visszatérve, Kr. e. 169-ben, kifosztotta a Templomot, „de az ő szíve a szent szövetség ellen van”, a másodikon pedig, Kr. e. 168-ban, „kitteus hajók”, azaz a római követ, Popillius Laenas Eleusisnál, fordították vissza. Katonái megfertőzték a szenthelyet, és felállították „a pusztító útálatosságot”, azt az oltárt (Kr. e. 167 decembere), amelyet az 1Makk leír, és amely a makkabeus felkelést kiváltotta. A 40–45. vers, amelyben az északi király a tenger és a szent hegy között hal meg, nem felel meg Antiokhosz Kr. e. 164-es perzsiai halálával; a legtöbb kritikus ezért a fejezetet az ezt megelőző hónapokra keltezi, a végét pedig meghiúsult jövendölésnek olvassa, mások egy eljövendő végső ellenségre értik. Mindkét olvasat régi."
    - "A szeleukidák a hasmóneusoknak elveszítették Júdeát, királyságukat pedig Pompeiusnak Kr. e. 64-ben. Fővárosuk, Antiókhia a dél-törökországi Antakya, amelyet 2023 februárjának földrengése lerombolt."
  fi:
    - "”Pohjan kuningas” on Danielin kirjan 11. luvun hahmo, jossa enkeli kertoo Danielille hänen ja ”Etelän kuninkaan” pitkistä sodista. Hieronymuksesta lähtien, joka nojasi pakanalliseen arvostelijaan Porfyrioon, lukijat ovat olleet yhtä mieltä siitä, että etelä on ptolemaiosten Egypti ja pohjoinen seleukidien kuningaskunta, joka hallitsi Syyriaa, Mesopotamiaa ja jonkin aikaa Persiaa Orontes-joen Antiokiasta käsin; tässä oleva merkintä, Pohjan kuninkaan valtakunta, sijaitsee Antiokiassa. Luvun Ihana maa näiden kahden välissä on Juudea, joka siirtyi toiselta toiselle, ja nimet, joita luku ei koskaan anna, antavat Polybios, Livius, Appianos ja 1. Makkabeusten kirja."
    - "Kuninkaat voi tunnistaa yksitellen. ”Yksi hänen ruhtinaistaan”, joka vahvistui Ptolemaios I:tä voimakkaammaksi, on Seleukos I, joka valloitti Babylonin vuonna 312 eaa. ”Etelän kuninkaan tytär”, joka ”menee Pohjan kuninkaan tykö”, on Berenike, joka meni naimisiin Antiokhos II:n kanssa noin 252 eaa. ja murhattiin lapsineen tämän kuoleman jälkeen; hänen veljensä Ptolemaios III hyökkäsi Syyriaan ja vei kotiin jumalia ja aarteita (kolmas Syyrian sota, 246–241). Suuri joukko, joka ”joutuu hänen valtaansa”, on Antiokhos III:n armeija, jonka Ptolemaios IV löi Raphiassa 217; Panionin voiton (noin 200 eaa.) jälkeen Antiokhos otti varustettuja kaupunkeja, Sidonin muassa, ja sai Juudean. Hänen tyttärensä Kleopatra naitettiin Ptolemaios V:lle, Rooma murskasi hänet Magnesiassa 190, ja hän kuoli 187. Hänen poikansa Seleukos IV lähetti ”veronvaatijan”, Heliodoroksen, temppeliin."
    - "Seuraava ”kelvoton” on Antiokhos IV Epifanes, kuningas 175–164. Hän hyökkäsi Egyptiin kahdesti: ensimmäisellä paluulla vuonna 169 hän ryösti temppelin, ”miettien hankkeita pyhää liittoa vastaan”, ja toisella, 168, ”kittiläisten laivat”, roomalainen lähettiläs Popillius Laenas Eleusiissa, käänsivät hänet takaisin. Hänen sotilaansa häpäisivät sitten pyhäkön ja pystyttivät ”hävityksen kauhistuksen”, joulukuun 167 alttarin, jonka 1. Makkabeusten kirja kuvaa ja joka sytytti makkabealaiskapinan. Jakeet 40–45, joissa pohjoisen kuningas kuolee meren ja pyhän vuoren välillä, eivät vastaa Antiokhoksen kuolemaa Persiassa 164; useimmat kriittiset tutkijat ajoittavat siksi luvun sitä edeltäviin kuukausiin ja lukevat sen lopun epäonnistuneena ennustuksena, kun taas toiset lukevat nämä jakeet vielä tulevasta viimeisestä viholliskuninkaasta. Molemmat tulkinnat ovat vanhoja."
    - "Seleukidit menettivät Juudean hasmonealaisille ja valtakuntansa Pompeiukselle vuonna 64 eaa. Heidän pääkaupunkinsa Antiokia on Antakya Etelä-Turkissa, jonka helmikuun 2023 maanjäristys tuhosi."
  vi:
    - "“Vua phương bắc” là một nhân vật của Đa-ni-ên 11, nơi một thiên sứ nói với Đa-ni-ên về những cuộc chiến dài giữa vua ấy và “vua phương nam”. Từ Jerome, người dựa vào nhà phê bình ngoại giáo Porphyry, các độc giả đều đồng ý rằng phương nam là Ai Cập thời Ptolemaios và phương bắc là vương quốc Seleucus, cai trị Sy-ri, Mê-sô-bô-ta-mi và có thời kỳ cả Phe-rơ-sơ từ An-ti-ốt trên sông Orontes; mục ở đây, vương quốc của vua phương bắc, đặt tại An-ti-ốt. “Đất vinh hiển” của chương nằm giữa hai bên là Giu-đê, bị chuyển từ bên này sang bên kia, và những tên mà chương không bao giờ nêu được bổ sung bởi Polybius, Livy, Appian và 1 Ma-ca-bê."
    - "Có thể lần theo từng vị vua. “Một trong các tướng của vua” trở nên mạnh hơn Ptolemaios I là Seleucus I, người chiếm Ba-by-lôn năm 312 TCN. “Công chúa vua phương nam” “đến cùng vua phương bắc” là Berenice, gả cho Antiochus II khoảng năm 252 TCN và bị giết cùng con sau khi ông qua đời; anh bà là Ptolemaios III bèn xâm lược Sy-ri và đem về nước các thần và của báu, tức Chiến tranh Sy-ri lần thứ ba, 246–241 TCN. Đạo quân lớn “phải phó vào tay người” là của Antiochus III, bị Ptolemaios IV đánh bại ở Raphia năm 217 TCN; “một thành vững bền” mà Antiochus chiếm sau chiến thắng ở Panium khoảng năm 200 TCN gồm có Si-đôn, và cùng với đó ông có được Giu-đê. Con gái ông là Cleopatra được gả cho Ptolemaios V, Rô-ma đánh gục ông ở Magnesia năm 190, và ông chết năm 187. Con trai ông là Seleucus IV sai “kẻ bức hiếp”, Heliodorus, đến Đền thờ."
    - "“Kẻ đáng khinh dể” kế tiếp là Antiochus IV Epiphanes, làm vua từ năm 175 đến 164. Ông hai lần xâm lược Ai Cập: lần trở về thứ nhất, năm 169, ông cướp phá Đền thờ, “lòng người đã rắp đối địch cùng giao ước thánh”, và lần thứ hai, năm 168, “những tàu ở Kít-tim”, tức sứ giả La Mã Popillius Laenas tại Eleusis, bắt ông quay về. Binh lính của ông sau đó làm ô uế nơi thánh và dựng “sự gớm ghiếc làm ra sự hoang vu”, tức bàn thờ tháng 12 năm 167 TCN mà 1 Ma-ca-bê mô tả và là nguyên nhân cuộc nổi dậy Ma-ca-bê. Các câu 40–45, trong đó vua phương bắc chết giữa biển và núi thánh, không khớp với cái chết của Antiochus ở Phe-rơ-sơ năm 164; vì thế đa số các học giả phê bình định niên đại của chương vào những tháng trước đó và đọc phần kết như một lời tiên đoán không thành, trong khi những người khác đọc các câu này về một kẻ thù cuối cùng còn sẽ đến. Cả hai cách đọc đều cổ xưa."
    - "Người Seleucus mất Giu-đê vào tay nhà Hasmonea và mất vương quốc vào tay Pompey năm 64 TCN. Thủ đô An-ti-ốt của họ là Antakya ở miền nam Thổ Nhĩ Kỳ, bị tàn phá bởi trận động đất tháng 2 năm 2023."
  ro:
    - "„Împăratul miezului nopței” este un personaj din Daniel 11, unde un înger îi vorbește lui Daniel despre lungile războaie dintre el și „împăratul austrului”. De la Ieronim, care s-a sprijinit pe criticul păgân Porfir, cititorii au căzut de acord că sudul este Egiptul ptolemeic, iar nordul regatul seleucid, care stăpânea Siria, Mesopotamia și, o vreme, Persia, din Antiohia de pe Orontes; punctul de pe hartă, regatul regelui de la miazănoapte, se află la Antiohia. Țara strălucită dintre cei doi este Iudeea, care a trecut de la unul la altul, iar numele pe care textul nu le dă sunt furnizate de Polibiu, Titus Liviu, Appian și 1 Macabei."
    - "Regii pot fi urmăriți pe rând. „Unul din boerii lui se va întărì asupra lui”: este Seleucus I, care a luat Babilonul în 312 î.Hr. Fiica regelui de la miazăzi, care „va intrà la împăratul miezului nopței”, este Berenice, măritată cu Antioh al II-lea în jurul anului 252 î.Hr. și ucisă cu copilul ei după moartea lui; fratele ei, Ptolemeu al III-lea, a invadat Siria și a dus acasă zei și comori, în al Treilea Război Sirian (246–241). Armata din „se va dà mulțimea în mâna lui” este cea a lui Antioh al III-lea, învins de Ptolemeu al IV-lea la Raphia, în 217; „cetăți tari” sunt cele luate de Antioh după Panium, în jurul anului 200 î.Hr., între ele Sidonul, și a câștigat astfel Iudeea. Fiica sa Cleopatra a fost măritată cu Ptolemeu al V-lea, Roma l-a zdrobit la Magnesia în 190, iar el a murit în 187. Fiul său Seleucus IV a trimis la Templu un perceptor de dări, pe Heliodor."
    - "Omul disprețuit care urmează este Antioh al IV-lea Epifanes, rege din 175 până în 164. A invadat Egiptul de două ori: la prima întoarcere, în 169, a jefuit Templul, iar inima lui s-a întors împotriva legământului sfânt, iar la a doua, în 168, corăbiile Kitimului, adică trimisul roman Popilius Laenas, la Eleusis, l-au făcut să se întoarcă. Soldații lui au pângărit apoi sanctuarul și au ridicat urâciunea pustiirii, altarul din decembrie 167, descris în 1 Macabei, care a provocat răscoala macabeilor. Versetele 40–45, în care regele de la miazănoapte moare între mare și muntele sfânt, nu se potrivesc cu moartea lui Antioh în Persia, în 164; de aceea cei mai mulți cercetători critici datează capitolul în lunile dinaintea ei și citesc încheierea ca pe o prevestire neîmplinită, iar alții raportează versetele la un ultim dușman încă viitor. Ambele interpretări sunt vechi."
    - "Seleucizii au pierdut Iudeea în fața hasmoneilor, iar regatul în fața lui Pompei, în 64 î.Hr. Capitala lor, Antiohia, este Antakya din sudul Turciei, devastată de cutremurul din februarie 2023."
  bg:
    - "„Северният цар“ е фигура от Даниил 11, където ангел разказва на Даниил за дългите войни между него и „южния цар“. От времето на Йероним, който черпел от езическия критик Порфирий, читателите са единодушни, че югът е Птолемеев Египет, а северът — Селевкидското царство, което управлявало Сирия, Месопотамия и известно време Персия от Антиохия на Оронт; затова записът тук, царството на северния цар, е поставен в Антиохия. „Земята на славата“ между двете в главата е Юдея, която преминавала от едното към другото, а имената, които главата никога не дава, допълват Полибий, Ливий, Апиан и 1 Макавейска."
    - "Царете могат да се проследят един по един. Един от „началниците му“, който станал по-силен от Птолемей I, е Селевк I, завладял Вавилон през 312 г. пр.н.е. „Дъщерята на южния цар“, която „ще дойде при северния цар“, е Береника, омъжена за Антиох II около 252 г. пр.н.е. и убита с детето си след смъртта му; брат ѝ Птолемей III нахлул в Сирия и отнесъл богове и съкровища — Третата сирийска война от 246–241 г. Голямото множество, което „ще се предаде в ръката му“, е войската на Антиох III, разбит от Птолемей IV при Рафия през 217 г.; „твърделните градове“, превзети от Антиох след победата при Панион около 200 г. пр.н.е., включват Сидон и с тях той спечелил Юдея. Дъщеря му Клеопатра била омъжена за Птолемей V, Рим го сломил при Магнезия през 190 г. и той умрял през 187 г. Синът му Селевк IV изпратил в Храма „бирник“, Хелиодор."
    - "„Един нищожен“, който идва след това, е Антиох IV Епифан, цар от 175 до 164 г. Два пъти нахлул в Египет: при първото завръщане, през 169 г., ограбил Храма и „сърдцето му“ ще е „против светия завет“, а при второто, през 168 г., „корабите на Китийците“ — римският пратеник Попилий Ленат при Елевзина — го върнали. Войниците му осквернили светилището и поставили „мерзостта на запустението“ — олтара от декември 167 г., описан в 1 Макавейска, който предизвикал Макавейското въстание. Стихове 40–45, в които северният цар загива между морето и святата планина, не съответстват на смъртта на Антиох в Персия през 164 г.; затова повечето критически учени датират главата в месеците преди нея и четат края ѝ като несбъднало се предсказание, а други четат стиховете като отнасящи се до последен враг, който тепърва ще дойде. И двете тълкувания са стари."
    - "Селевкидите загубили Юдея в полза на Хасмонеите, а царството си — в полза на Помпей през 64 г. пр.н.е. Столицата им Антиохия е Антакия в Южна Турция, разрушена от земетресението през февруари 2023 г."
