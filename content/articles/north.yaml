# Overview article (ADR 0007). Mainstream facts only; the Seleucid reading of Daniel 11 is the one shared by Jerome and modern commentators, and the two readings of verses 40-45 are given side by side without choosing.
id: north
place: a244929
title:
  en: "North"
  ru: "Царство северного царя"
body:
  en:
    - "“The king of the north” is a figure of Daniel 11, where an angel tells Daniel of the long wars between him and “the king of the south”. Since Jerome, who drew on the pagan critic Porphyry, readers have agreed that the south is Ptolemaic Egypt and the north the Seleucid kingdom, which ruled Syria, Mesopotamia and for a time Persia from Antioch on the Orontes; the record here, the kingdom of the king of the north, stands at Antioch. The chapter's “glorious land” between the two is Judea, which passed from the one to the other, and the names it never gives are supplied by Polybius, Livy, Appian and 1 Maccabees."
    - "The kings can be followed one by one. “One of his princes” who grew stronger than Ptolemy I is Seleucus I, who won Babylon in 312 BC. “The king's daughter of the south” who “shall come to the king of the north” is Berenice, married to Antiochus II about 252 BC and murdered with her child after his death; her brother Ptolemy III then invaded Syria and carried home gods and treasure, the Third Syrian War of 246–241. The great army “given into his hand” is that of Antiochus III, beaten by Ptolemy IV at Raphia in 217; the “most fenced cities” Antiochus took after his victory at Panium in 200 BC include Sidon, and with them he gained Judea. His daughter Cleopatra was married to Ptolemy V, Rome broke him at Magnesia in 190, and he died in 187. His son Seleucus IV sent “a raiser of taxes”, Heliodorus, to the Temple."
    - "The “vile person” who follows is Antiochus IV Epiphanes, king from 175 to 164. He invaded Egypt twice: on the first return, in 169, he plundered the Temple, “and his heart shall be against the holy covenant”, and on the second, in 168, “the ships of Chittim”, the Roman envoy Popillius Laenas at Eleusis, turned him back. His soldiers then polluted the sanctuary and set up “the abomination that maketh desolate”, the altar of December 167 that 1 Maccabees describes and that provoked the Maccabean revolt. Verses 40–45, in which the king of the north dies between the sea and the holy mountain, do not match Antiochus' death in Persia in 164; most critical scholars therefore date the chapter to the months before it and read its ending as a prediction that failed, while others read these verses of a last enemy still to come. Both readings are old."
    - "The Seleucids lost Judea to the Hasmoneans and their kingdom to Pompey in 64 BC. Their capital Antioch is Antakya in southern Turkey, wrecked by the earthquake of February 2023."
  ru:
    - "«Царь северный», как называет его Синодальный перевод, — лицо из 11-й главы Даниила, где ангел рассказывает Даниилу о долгих войнах между ним и южным царём. Со времён Иеронима, опиравшегося на языческого критика Порфирия, читатели сходятся в том, что юг — это Египет Птолемеев, а север — царство Селевкидов, правивших Сирией, Месопотамией и одно время Персией из Антиохии на Оронте; запись «Царство северного царя» стоит здесь в Антиохии. Земля между ними, которую глава зовёт «славной», — Иудея, переходившая от одних к другим, а имена, которых глава не называет, дают Полибий, Ливий, Аппиан и Первая книга Маккавейская."
    - "Царей можно проследить одного за другим. «Один из князей», переросший Птолемея I, — Селевк I, взявший Вавилон в 312 г. до н. э. «Дочь южного царя», которая «придет к царю северному», — Береника, выданная за Антиоха II около 252 г. до н. э. и убитая вместе с ребёнком после его смерти; её брат Птолемей III вторгся затем в Сирию и увёз богов и сокровища — Третья Сирийская война 246–241 гг. Большое войско, о котором сказано «предано будет войско в руки его», — войско Антиоха III, разбитое Птолемеем IV при Рафии в 217 г.; «укрепленным городом», которым Антиох овладел после победы при Панионе в 200 г. до н. э., был Сидон, и вместе с ним он получил Иудею. Его дочь Клеопатру выдали за Птолемея V, Рим сломил его при Магнесии в 190 г., и он погиб в 187 г. Его сын Селевк IV послал к Храму «сборщика податей» Гелиодора."
    - "«Презренный», который следует далее, — Антиох IV Епифан, царь с 175 по 164 г. Он дважды вторгался в Египет: возвращаясь в первый раз, в 169 г., он ограбил Храм с «враждебным намерением против святаго завета», а во второй, в 168 г., «корабли Киттимские» — римский посол Попилий Ленат в Елевсине — повернули его назад. Затем его воины осквернили святилище и поставили «мерзость запустения» — жертвенник декабря 167 г., о котором рассказывает Первая книга Маккавейская и который вызвал восстание Маккавеев. Стихи 40–45, где царь северный гибнет между морем и святой горой, не сходятся со смертью Антиоха в Персии в 164 г.; поэтому большинство критических учёных датируют главу месяцами перед ней и читают её конец как несбывшееся предсказание, а другие относят эти стихи к последнему врагу, который ещё придёт. Оба прочтения стары."
    - "Селевкиды потеряли Иудею, отошедшую к Хасмонеям, а царство — в 64 г. до н. э., когда его упразднил Помпей. Их столица Антиохия — нынешняя Антакья на юге Турции, разрушенная землетрясением в феврале 2023 года."
