# Overview article (ADR 0007). Mainstream facts only; a wilderness station usually placed at Faynan, the copper district of Edom; the link with the bronze serpent is given as a suggestion only.
id: punon
place: a9ecc26
title:
  en: "Punon"
  ru: "Пунон"
  uk: "Пунон"
  es: "Funón"
  pt: "Punom"
  de: "Punon"
  fr: "Punon"
body:
  en:
    - "Punon is one of the last camps of Israel on the way round Edom, named only in the itinerary of Numbers 33: “And they departed from Zalmonah, and pitched in Punon. And they departed from Punon, and pitched in Oboth.” The Bible tells nothing that happened there; some have connected it with the bronze serpent, made at a camp in this stretch of the journey, because Punon was a place of copper, but the text does not name the camp."
    - "Punon is generally identified with Khirbet Faynan on the eastern side of the Arabah, about 40 km south of the Dead Sea, the richest copper district of the southern Levant; the Edomite chief Pinon may bear the same name. Copper was mined and smelted there from the Chalcolithic period; Iron Age smelting reached its height at nearby Khirbat en-Nahas, and in Roman times the mines of Phaeno were a place of condemnation where Christians laboured in the persecution of Diocletian, as Eusebius records. Faynan is today in the Dana Biosphere Reserve in Jordan."
  ru:
    - "Пунон — один из последних станов Израиля на пути в обход Едома, названный только в перечне 33-й главы книги Чисел: «И отправились из Салмона и расположились станом в Пуноне. И отправились из Пунона и расположились станом в Овофе». Библия не рассказывает, что там произошло; некоторые связывали его с медным змеем, сделанным на одном из станов этого отрезка пути, поскольку Пунон был краем меди, но текст этот стан не называет."
    - "Пунон обычно отождествляют с Хирбет-Файнаном на восточной стороне Аравы, примерно в 40 км к югу от Мёртвого моря, богатейшим медным краем южного Леванта; имя едомского князя Пинона, возможно, то же самое. Медь там добывали и плавили с энеолита; в железном веке плавка достигла расцвета в соседнем Хирбет-эн-Нахасе, а в римское время рудники Фено были местом ссылки, где во время гонения Диоклетиана трудились христиане, как пишет Евсевий. Файнан сегодня входит в биосферный заповедник Дана в Иордании."
  uk:
    - "Пунон — один з останніх таборів Ізраїля на шляху в обхід Едому, названий лише в переліку стоянок Числа 33: «І рушили із Залмони та й отаборились у Пупонї. І рушили із Пупона та й отаборились в Оботї.» Біблія нічого не розповідає про те, що там сталося; дехто пов’язував його з мідним зміїм, зробленим у таборі на цьому відтинку шляху, бо Пунон був місцем міді, але текст цей табір не називає."
    - "Пунон зазвичай ототожнюють з Хірбет-Файнан на східному боці Арави, приблизно за 40 км на південь від Мертвого моря, найбагатшим мідним районом південного Леванту; едомський вожд Пінон, можливо, носить те саме ім’я. Мідь добували й виплавляли там з мідно-кам’яної доби; виплавка доби заліза досягла розквіту в сусідньому Хірбат-ен-Нахасі, а за римських часів копальні Фено були місцем покарання, де християни працювали під час гонінь Діоклетіана, як повідомляє Євсевій. Файнан сьогодні лежить у біосферному заповіднику Дана в Йорданії."
  es:
    - "Funón es uno de los últimos campamentos de Israel en el rodeo de Edom, nombrado solo en el itinerario de Números 33: «Y partidos de Salmona, asentaron en Phunón. Y partidos de Phunón, asentaron en Oboth». La Biblia no cuenta nada de lo que allí sucedió; algunos lo han relacionado con la serpiente de bronce, hecha en un campamento de este tramo del viaje, porque Funón era un lugar del cobre, pero el texto no nombra el campamento."
    - "Funón se identifica por lo común con Khirbet Faynan, en el lado oriental del Arabá, a unos 40 km al sur del mar Muerto, el distrito cuprífero más rico del Levante meridional; el jefe edomita Pinón puede llevar el mismo nombre. Allí se extrajo y fundió cobre desde el período calcolítico; la fundición de la Edad del Hierro alcanzó su apogeo en la cercana Khirbat en-Nahas, y en época romana las minas de Feno fueron un lugar de condena donde trabajaron cristianos en la persecución de Diocleciano, como registra Eusebio. Faynan se encuentra hoy en la Reserva de la Biosfera de Dana, en Jordania."
  pt:
    - "Punom é um dos últimos acampamentos de Israel no caminho em volta de Edom, citado apenas no itinerário de Números 33: “Partiram de Salmona e acamparam em Punom. Partiram de Punom e acamparam em Obote.” A Bíblia nada conta do que ali aconteceu; alguns a ligaram à serpente de bronze, feita num acampamento deste trecho da jornada, porque Punom era um lugar de cobre, mas o texto não nomeia o acampamento."
    - "Punom é geralmente identificada com Khirbet Faynan, no lado oriental da Arabá, a cerca de 40 km ao sul do Mar Morto, o mais rico distrito de cobre do Levante meridional; o chefe edomita Pinom pode ter o mesmo nome. O cobre foi extraído e fundido ali desde o período calcolítico; a fundição da Idade do Ferro atingiu o auge na vizinha Khirbat en-Nahas, e em época romana as minas de Feno eram um lugar de condenação onde cristãos trabalharam na perseguição de Diocleciano, como registra Eusébio. Faynan está hoje na Reserva da Biosfera de Dana, na Jordânia."
  de:
    - "Punon ist eines der letzten Lager Israels auf dem Weg um Edom herum, nur in der Stationenliste von Numeri 33 genannt: „Von Zalmona zogen sie aus und lagerten sich in Phunon. Von Phunon zogen sie aus und lagerten sich in Oboth.“ Die Bibel berichtet nichts, was dort geschah; manche haben es mit der ehernen Schlange verbunden, die an einem Lager auf diesem Abschnitt der Reise gemacht wurde, weil Punon ein Kupferort war, doch der Text nennt das Lager nicht."
    - "Punon wird allgemein mit Chirbet Fainan auf der Ostseite der Araba gleichgesetzt, etwa 40 km südlich des Toten Meeres, dem reichsten Kupferrevier der südlichen Levante; der edomitische Fürst Pinon mag denselben Namen tragen. Kupfer wurde dort seit der Kupfersteinzeit abgebaut und verhüttet; die eisenzeitliche Verhüttung erreichte ihren Höhepunkt im nahen Chirbet en-Nahas, und in römischer Zeit waren die Minen von Phaeno ein Verbannungsort, wo Christen in der Verfolgung unter Diokletian arbeiteten, wie Eusebius berichtet. Fainan liegt heute im Dana-Biosphärenreservat in Jordanien."
  fr:
    - "Punon est l’un des derniers campements d’Israël sur le contournement d’Édom, nommé seulement dans l’itinéraire de Nombres 33 : « Ils partirent de Tsalmona, et campèrent à Punon. Ils partirent de Punon, et campèrent à Oboth. » La Bible ne rapporte rien qui s’y soit passé ; certains l’ont rattachée au serpent d’airain, fait à un campement de cette étape du voyage, parce que Punon était un lieu de cuivre, mais le texte ne nomme pas le campement."
    - "Punon est généralement identifiée à Khirbet Faynan, du côté oriental de l’Araba, à environ 40 km au sud de la mer Morte, le district cuprifère le plus riche du Levant méridional ; le chef édomite Pinon pourrait porter le même nom. Le cuivre y fut extrait et fondu dès le Chalcolithique ; la fonte de l’âge du Fer atteignit son sommet à Khirbat en-Nahas, tout près, et à l’époque romaine les mines de Phaeno furent un lieu de condamnation où des chrétiens travaillèrent lors de la persécution de Dioclétien, comme le consigne Eusèbe. Faynan se trouve aujourd’hui dans la Réserve de biosphère de Dana, en Jordanie."
