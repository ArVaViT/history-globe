# Overview article (ADR 0007). Mainstream facts only; the link of Lycia with the Bronze Age Lukka lands is the usual view; annexation by Claudius is dated AD 43, the joint province with Pamphylia AD 74.
id: lycia
place: a19fd03
title:
  en: "Lycia"
  ru: "Ликия"
  uk: "Лікія"
  es: "Licia"
  pt: "Lícia"
  de: "Lykien"
  fr: "Lycie"
  it: "Licia"
  nl: "Lycië"
  pl: "Licja"
  cs: "Lykie"
body:
  en:
    - "Lycia was the mountainous land on the south-west coast of Asia Minor, between Caria to the west and Pamphylia to the east, where the Taurus ranges run down into the sea. Its chief cities, Xanthos, Patara, Pinara, Tlos, Myra and Olympos, lay in the river valleys and on the coast. The region is usually taken to be part of the Lukka lands of Hittite and Egyptian records of the Late Bronze Age. The Lycians spoke an Anatolian language of the Luwian branch and wrote it in their own alphabet, adapted from the Greek, in inscriptions of about 500–300 BC; their house-shaped rock tombs are still seen above many towns. The area lies today in the provinces of Antalya and Muğla in Turkey."
    - "Lycia appears in the voyages of Paul. At the end of his third journey he came “unto Rhodes, and from thence unto Patara”, a Lycian port, and there his company found “a ship sailing over unto Phenicia”. As a prisoner on the way to Rome, he and his guards sailed along the coast: “And when we had sailed over the sea of Cilicia and Pamphylia, we came to Myra, a city of Lycia.” At Myra the centurion moved them to a ship of Alexandria bound for Italy. 1 Maccabees also names Lycia among the states to which the Roman consul wrote on behalf of the Jews."
    - "Herodotus tells how in the 540s BC the Persian general Harpagus marched on Xanthos; the Xanthians shut their women, children and goods in the citadel, burned it and died fighting. In Hellenistic and Roman times the cities formed the Lycian League; Strabo says it had twenty-three cities, the largest with three votes in the common council, the middle ones two and the rest one, and he praises it as well governed. In AD 43 Claudius took away the Lycians' freedom after strife in which Romans were killed and made Lycia a province, and in 74 Vespasian joined it with Pamphylia. Xanthos and its sanctuary of Leto, where a trilingual inscription in Lycian, Greek and Aramaic was found in 1973, are on the UNESCO World Heritage list."
  ru:
    - "Ликия — гористая страна на юго-западном побережье Малой Азии, между Карией на западе и Памфилией на востоке, где хребты Тавра спускаются к морю. Её главные города — Ксанф, Патара, Пинара, Тлос, Миры и Олимп — лежали в речных долинах и на побережье. Эту область обычно считают частью страны Лукка хеттских и египетских источников позднего бронзового века. Ликийцы говорили на анатолийском языке лувийской ветви и писали на нём собственным алфавитом, созданным на основе греческого, в надписях примерно 500–300 гг. до н. э.; их скальные гробницы в виде домов и сейчас видны над многими городами. Сегодня эта местность входит в провинции Анталья и Мугла в Турции."
    - "Ликия появляется в путешествиях Павла. В конце третьего путешествия он пришёл «в Родос и оттуда в Патару», ликийскую гавань, и там его спутники нашли «корабль, идущий в Финикию». Узником на пути в Рим он со стражей плыл вдоль берега: «и, переплыв море против Киликии и Памфилии, прибыли в Миры Ликийские». В Мирах сотник пересадил их на Александрийский корабль, плывущий в Италию. Первая книга Маккавейская также называет Ликию среди государств, которым римский консул писал в пользу иудеев."
    - "Геродот рассказывает, как в 540-х гг. до н. э. персидский полководец Гарпаг пошёл на Ксанф; ксанфийцы заперли жён, детей и имущество в акрополе, сожгли его и погибли в бою. В эллинистическое и римское время города составляли Ликийский союз; Страбон пишет, что в нём было двадцать три города, крупнейшие имели в общем совете по три голоса, средние по два, остальные по одному, и хвалит его как хорошо устроенный. В 43 г. н. э. Клавдий отнял у ликийцев свободу после смут, в которых были убиты римляне, и сделал Ликию провинцией, а в 74 г. Веспасиан соединил её с Памфилией. Ксанф и его святилище Лето, где в 1973 г. нашли трёхъязычную надпись на ликийском, греческом и арамейском, входят в список Всемирного наследия ЮНЕСКО."
  uk:
    - "Лікія була гірською країною на південно-західному узбережжі Малої Азії, між Карією на заході та Памфілією на сході, де хребти Тавра спускаються до моря. Її головні міста — Ксанф, Патара, Пінара, Тлос, Мири й Олімпос — лежали в річкових долинах і на узбережжі. Регіон зазвичай вважають частиною земель Лукка в хетських та єгипетських джерелах пізньої бронзової доби. Лікійці розмовляли анатолійською мовою лувійської гілки й записували її власним алфавітом, пристосованим з грецького, в написах приблизно 500–300 рр. до н. е.; їхні скельні гробниці у формі будинків досі видно над багатьма містами. Область лежить нині в провінціях Анталья та Мугла в Туреччині."
    - "Лікія з'являється в подорожах Павла. Наприкінці третьої подорожі він прибув «в Родос, а з відтіля в Патару», лікійський порт, і там його супутники знайшли «корабель, що плив у Финикию». Як в'язень по дорозі до Риму, він і його охоронці плили вздовж узбережжя: «І, перепливши море, що проти Киликиї та Памфилиї, прибули в Мири Ликийські.» У Мирах сотник пересадив їх на александрійський корабель, що плив в Італію. 1 Маккавеїв також називає Лікію серед держав, до яких римський консул писав від імені юдеїв."
    - "Геродот розповідає, як у 540-х рр. до н. е. перський полководець Гарпаг рушив на Ксанф; ксанфійці зачинили жінок, дітей і майно в цитаделі, спалили її й загинули в бою. В елліністичну та римську добу міста утворили Лікійський союз; Страбон каже, що він налічував двадцять три міста, найбільші мали по три голоси в спільній раді, середні — по два, решта — по одному, і хвалить його як добре врядований. 43 р. н. е. Клавдій відібрав у лікійців свободу після міжусобиць, у яких загинули римляни, й зробив Лікію провінцією, а 74 р. Веспасіан приєднав її до Памфілії. Ксанф і його святилище Лето, де 1973 р. знайдено тримовний напис лікійською, грецькою та арамейською мовами, внесені до Списку всесвітньої спадщини ЮНЕСКО."
  es:
    - "Licia era la tierra montañosa de la costa suroccidental de Asia Menor, entre Caria al oeste y Panfilia al este, donde las cordilleras del Tauro descienden hasta el mar. Sus ciudades principales, Janto, Pátara, Pínara, Tlos, Mira y Olimpo, se alzaban en los valles fluviales y en la costa. Suele considerarse que la región forma parte de las tierras Lukka de los registros hititas y egipcios de la Edad del Bronce Final. Los licios hablaban una lengua anatolia de la rama luvita y la escribían en su propio alfabeto, adaptado del griego, en inscripciones de hacia 500–300 a. C.; sus tumbas rupestres en forma de casa aún se ven sobre muchas ciudades. La zona se encuentra hoy en las provincias turcas de Antalya y Muğla."
    - "Licia aparece en los viajes de Pablo. Al final de su tercer viaje llegó «á Rhodas, y de allí á Pátara», puerto licio, y allí su grupo halló «un barco que pasaba á Fenicia». Como preso camino de Roma, él y sus guardias navegaron a lo largo de la costa: «Y habiendo pasado la mar de Cilicia y Pamphylia, arribamos á Mira, ciudad de Licia». En Mira el centurión los pasó a una nave de Alejandría con rumbo a Italia. También 1 Macabeos nombra Licia entre los estados a los que el cónsul romano escribió en favor de los judíos."
    - "Heródoto cuenta que en los años 540 a. C. el general persa Hárpago marchó sobre Janto; los janteos encerraron en la ciudadela a sus mujeres, hijos y bienes, le prendieron fuego y murieron combatiendo. En las épocas helenística y romana las ciudades formaron la Liga Licia; Estrabón dice que tenía veintitrés ciudades, las mayores con tres votos en el consejo común, las medianas con dos y las demás con uno, y la elogia por estar bien gobernada. En 43 d. C. Claudio privó a los licios de su libertad tras unas luchas en que murieron romanos y convirtió Licia en provincia, y en 74 Vespasiano la unió con Panfilia. Janto y su santuario de Leto, donde en 1973 se halló una inscripción trilingüe en licio, griego y arameo, figuran en la lista del Patrimonio Mundial de la UNESCO."
  pt:
    - "A Lícia era a terra montanhosa da costa sudoeste da Ásia Menor, entre a Cária a oeste e a Panfília a leste, onde as cordilheiras do Tauro descem até o mar. Suas principais cidades, Xanto, Pátara, Pinara, Tlos, Mira e Olimpo, ficavam nos vales dos rios e na costa. A região é geralmente tida como parte das terras Lukka dos registros hititas e egípcios do Bronze Final. Os lícios falavam uma língua anatólia do ramo luvita e a escreviam em seu próprio alfabeto, adaptado do grego, em inscrições de cerca de 500–300 a.C.; seus túmulos rupestres em forma de casa ainda são vistos acima de muitas cidades. A área fica hoje nas províncias de Antália e Muğla, na Turquia."
    - "A Lícia aparece nas viagens de Paulo. No fim de sua terceira viagem ele navegou “para Rodes, e dali para Pátara”, um porto lício, e ali seu grupo encontrou “um navio que fazia a travessia para a Fenícia”. Como prisioneiro a caminho de Roma, ele e seus guardas navegaram ao longo da costa: “Depois de atravessarmos o mar ao longo da Cilícia e da Panfília, chegamos a Mira, uma cidade da Lícia.” Em Mira o centurião os transferiu para um navio de Alexandria rumo à Itália. 1 Macabeus também menciona a Lícia entre os estados aos quais o cônsul romano escreveu em favor dos judeus."
    - "Heródoto conta como, na década de 540 a.C., o general persa Hárpago marchou sobre Xanto; os xantienses trancaram na cidadela suas mulheres, filhos e bens, queimaram-na e morreram lutando. Nos tempos helenístico e romano as cidades formaram a Liga Lícia; Estrabão diz que ela tinha vinte e três cidades, as maiores com três votos no conselho comum, as médias com dois e as demais com um, e a elogia como bem governada. Em 43 d.C. Cláudio retirou a liberdade dos lícios depois de conflitos em que romanos foram mortos e fez da Lícia uma província, e em 74 Vespasiano a uniu à Panfília. Xanto e seu santuário de Leto, onde em 1973 foi encontrada uma inscrição trilíngue em lício, grego e aramaico, constam da lista do Patrimônio Mundial da UNESCO."
  de:
    - "Lykien war das gebirgige Land an der Südwestküste Kleinasiens, zwischen Karien im Westen und Pamphylien im Osten, wo die Ketten des Taurus ins Meer abfallen. Seine wichtigsten Städte, Xanthos, Patara, Pinara, Tlos, Myra und Olympos, lagen in den Flusstälern und an der Küste. Die Region wird gewöhnlich als Teil der Lukka-Länder der hethitischen und ägyptischen Quellen der Spätbronzezeit angesehen. Die Lykier sprachen eine anatolische Sprache des luwischen Zweigs und schrieben sie in einem eigenen, vom Griechischen abgeleiteten Alphabet, in Inschriften von etwa 500–300 v. Chr.; ihre hausförmigen Felsgräber sieht man noch oberhalb vieler Städte. Das Gebiet liegt heute in den türkischen Provinzen Antalya und Muğla."
    - "Lykien erscheint in den Reisen des Paulus. Am Ende seiner dritten Reise kam er „gen Rhodus und von da nach Patara“, einem lykischen Hafen, und dort stieg seine Gruppe ein: „Und da wir ein Schiff fanden, das nach Phönizien fuhr, traten wir hinein und fuhren hin.“ Als Gefangener auf dem Weg nach Rom fuhr er mit seinen Bewachern an der Küste entlang: „schifften durch das Meer bei Zilizien und Pamphylien und kamen gen Myra in Lyzien“. In Myra ließ der Hauptmann sie auf ein alexandrinisches Schiff nach Italien umsteigen. Auch das Erste Makkabäerbuch nennt Lykien unter den Staaten, an die der römische Konsul zugunsten der Juden schrieb."
    - "Herodot erzählt, wie der persische Feldherr Harpagos in den 540er Jahren v. Chr. gegen Xanthos zog; die Xanthier schlossen Frauen, Kinder und Habe in der Burg ein, verbrannten sie und starben kämpfend. In hellenistischer und römischer Zeit bildeten die Städte den Lykischen Bund; Strabon sagt, er habe dreiundzwanzig Städte gehabt, die größten mit drei Stimmen im gemeinsamen Rat, die mittleren mit zwei und die übrigen mit einer, und er lobt ihn als gut regiert. Im Jahr 43 n. Chr. nahm Claudius den Lykiern nach Unruhen, bei denen Römer getötet wurden, die Freiheit und machte Lykien zur Provinz, und 74 vereinigte Vespasian es mit Pamphylien. Xanthos und sein Heiligtum der Leto, wo 1973 eine dreisprachige Inschrift auf Lykisch, Griechisch und Aramäisch gefunden wurde, stehen auf der UNESCO-Welterbeliste."
  fr:
    - "La Lycie était le pays montagneux de la côte sud-ouest de l’Asie Mineure, entre la Carie à l’ouest et la Pamphylie à l’est, où les chaînes du Taurus descendent dans la mer. Ses principales villes, Xanthos, Patara, Pinara, Tlos, Myra et Olympos, s’étendaient dans les vallées fluviales et sur la côte. On y voit d’ordinaire une partie des pays Lukka des textes hittites et égyptiens du Bronze récent. Les Lyciens parlaient une langue anatolienne de la branche louvite et l’écrivaient dans leur propre alphabet, adapté du grec, dans des inscriptions d’environ 500–300 av. J.-C. ; leurs tombes rupestres en forme de maisons se voient encore au-dessus de nombreuses villes. La région se trouve aujourd’hui dans les provinces d’Antalya et de Muğla, en Turquie."
    - "La Lycie apparaît dans les voyages de Paul. À la fin de son troisième voyage, il vint « à Rhodes, et de là à Patara », port lycien, et sa compagnie y trouva « un navire qui faisait la traversée vers la Phénicie ». Prisonnier en route vers Rome, il longea la côte avec ses gardes : « Après avoir traversé la mer qui baigne la Cilicie et la Pamphylie, nous arrivâmes à Myra en Lycie. » À Myra, le centurion les fit passer sur un navire d’Alexandrie à destination de l’Italie. 1 Maccabées nomme aussi la Lycie parmi les États auxquels le consul romain écrivit en faveur des Juifs."
    - "Hérodote raconte comment, dans les années 540 av. J.-C., le général perse Harpage marcha sur Xanthos ; les Xanthiens enfermèrent femmes, enfants et biens dans la citadelle, y mirent le feu et moururent en combattant. Aux époques hellénistique et romaine, les cités formèrent la ligue lycienne ; Strabon dit qu’elle comptait vingt-trois villes, les plus grandes avec trois voix au conseil commun, les moyennes deux et les autres une, et il la loue d’être bien gouvernée. En 43 apr. J.-C., Claude ôta aux Lyciens leur liberté après des troubles où des Romains avaient été tués et fit de la Lycie une province, et en 74 Vespasien la joignit à la Pamphylie. Xanthos et son sanctuaire de Léto, où l’on trouva en 1973 une inscription trilingue en lycien, grec et araméen, sont inscrits au patrimoine mondial de l’UNESCO."
  it:
    - "La Licia era la terra montuosa sulla costa sud-occidentale dell’Asia Minore, tra la Caria a ovest e la Panfilia a est, dove le catene del Tauro scendono fino al mare. Le sue città principali, Xanto, Patara, Pinara, Tlos, Mira e Olimpo, sorgevano nelle valli fluviali e sulla costa. La regione è di solito considerata parte delle terre di Lukka dei documenti ittiti ed egizi della tarda età del Bronzo. I Lici parlavano una lingua anatolica del ramo luvio e la scrivevano con un proprio alfabeto, adattato dal greco, in iscrizioni di circa 500–300 a.C.; le loro tombe rupestri a forma di casa si vedono ancora sopra molte città. L’area si trova oggi nelle province turche di Antalya e Muğla."
    - "La Licia compare nei viaggi di Paolo. Alla fine del terzo viaggio giunse «a Rodi, e di là a Patara», un porto licio, e là la sua compagnia trovò «una nave che passava in Fenicia». Da prigioniero in viaggio verso Roma, egli e le sue guardie navigarono lungo la costa: «E passato il mar di Cilicia e di Panfilia, arrivammo a Mira di Licia». A Mira il centurione li trasferì su una nave alessandrina diretta in Italia. Anche il Primo libro dei Maccabei nomina la Licia tra gli stati ai quali il console romano scrisse a favore dei Giudei."
    - "Erodoto racconta come negli anni 540 a.C. il generale persiano Arpago marciò su Xanto; gli Xanzi chiusero donne, bambini e beni nella cittadella, le diedero fuoco e morirono combattendo. In epoca ellenistica e romana le città formarono la Lega licia; Strabone dice che aveva ventitré città, le maggiori con tre voti nel consiglio comune, le medie due e le altre uno, e la loda come ben governata. Nel 43 d.C. Claudio tolse ai Lici la libertà dopo contrasti in cui furono uccisi dei Romani e fece della Licia una provincia, e nel 74 Vespasiano la unì alla Panfilia. Xanto e il suo santuario di Leto, dove nel 1973 fu trovata un’iscrizione trilingue in licio, greco e aramaico, sono nella lista del patrimonio mondiale dell’UNESCO."
  nl:
    - "Lycië was het bergachtige land aan de zuidwestkust van Klein-Azië, tussen Karië in het westen en Pamfylië in het oosten, waar de Taurusgebergten tot in zee lopen. De voornaamste steden, Xanthos, Patara, Pinara, Tlos, Myra en Olympos, lagen in de riviervalleien en aan de kust. De streek wordt gewoonlijk gerekend tot de Lukka-landen uit Hettitische en Egyptische bronnen van de late bronstijd. De Lyciërs spraken een Anatolische taal van de Luwische tak en schreven die in een eigen alfabet, aangepast uit het Grieks, in inscripties van ongeveer 500–300 v.Chr.; hun huisvormige rotsgraven zijn nog boven vele steden te zien. Het gebied ligt tegenwoordig in de provincies Antalya en Muğla in Turkije."
    - "Lycië komt voor in de reizen van Paulus. Aan het einde van zijn derde reis kwam hij “te Rhodus, en van daar te Patara”, een Lycische haven, en daar vond zijn gezelschap “een schip … dat naar Fenicië overvoer”. Als gevangene op weg naar Rome voer hij met zijn bewakers langs de kust: “En de zee, die langs Cilicië en Pamfylië is, doorgevaren zijnde, kwamen wij aan te Myra in Lycië.” Te Myra liet de hoofdman hen overgaan op een schip van Alexandrië dat naar Italië voer. 1 Makkabeeën noemt Lycië ook onder de staten aan wie de Romeinse consul ten gunste van de Joden schreef."
    - "Herodotus vertelt hoe de Perzische veldheer Harpagos in de jaren 540 v.Chr. tegen Xanthos optrok; de Xanthiërs sloten hun vrouwen, kinderen en have op in de burcht, verbrandden die en stierven vechtend. In hellenistische en Romeinse tijd vormden de steden de Lycische Bond; Strabo zegt dat die drieëntwintig steden telde, de grootste met drie stemmen in de gemeenschappelijke raad, de middelgrote met twee en de overige met één, en hij prijst haar als goed bestuurd. In 43 n.Chr. nam Claudius de Lyciërs hun vrijheid af na onlusten waarbij Romeinen waren gedood en maakte van Lycië een provincie, en in 74 voegde Vespasianus haar samen met Pamfylië. Xanthos en zijn heiligdom van Leto, waar in 1973 een drietalig opschrift in het Lycisch, Grieks en Aramees werd gevonden, staan op de werelderfgoedlijst van UNESCO."
  pl:
    - "Licja była górzystą krainą na południowo-zachodnim wybrzeżu Azji Mniejszej, między Karią na zachodzie a Pamfilią na wschodzie, gdzie pasma Taurusu opadają ku morzu. Jej główne miasta, Ksantos, Patara, Pinara, Tlos, Mira i Olimpos, leżały w dolinach rzek i na wybrzeżu. Region uważa się zwykle za część krain Lukka znanych z hetyckich i egipskich źródeł późnej epoki brązu. Licyjczycy mówili językiem anatolijskim z gałęzi luwijskiej i zapisywali go własnym alfabetem, przystosowanym z greckiego, w inskrypcjach z około 500-300 p.n.e.; ich skalne grobowce w kształcie domów widać do dziś nad wieloma miastami. Obszar leży dziś w prowincjach Antalya i Muğla w Turcji."
    - "Licja pojawia się w podróżach Pawła. Pod koniec trzeciej podróży przybył „do Rodu, a stamtąd do Patary”, licyjskiego portu, i tam jego towarzysze znaleźli „okręt, który miał płynąć do Fenicyi”. Jako więzień w drodze do Rzymu płynął wraz ze strażnikami wzdłuż wybrzeża: „A przepłynąwszy ono morze, które jest podle Cylicyi i Pamfilii, przybyliśmy do Miry, miasta Licyjskiego”. W Mirze setnik przeniósł ich na aleksandryjski okręt płynący do Italii. Pierwsza Księga Machabejska wymienia też Licję wśród państw, do których rzymski konsul pisał w sprawie Żydów."
    - "Herodot opowiada, że w latach 540. p.n.e. perski wódz Harpag ruszył na Ksantos; Ksantyjczycy zamknęli w cytadeli kobiety, dzieci i dobytek, podpalili ją i polegli w walce. W czasach hellenistycznych i rzymskich miasta tworzyły Związek Licyjski; Strabon mówi, że liczył dwadzieścia trzy miasta, z których największe miały trzy głosy we wspólnej radzie, średnie dwa, a pozostałe jeden, i chwali jego dobre rządy. W 43 r. n.e. Klaudiusz odebrał Licyjczykom wolność po rozruchach, w których zginęli Rzymianie, i uczynił Licję prowincją, a w 74 roku Wespazjan połączył ją z Pamfilią. Ksantos i jego sanktuarium Leto, gdzie w 1973 roku znaleziono trójjęzyczny napis licyjsko-grecko-aramejski, znajdują się na liście światowego dziedzictwa UNESCO."
  cs:
    - "Lykie byla hornatá země na jihozápadním pobřeží Malé Asie, mezi Kárií na západě a Pamfylií na východě, kde se pohoří Tauru svažují do moře. Její hlavní města Xanthos, Patara, Pinara, Tlos, Myra a Olympos ležela v říčních údolích a na pobřeží. Oblast se obvykle pokládá za součást zemí Lukka v chetitských a egyptských záznamech pozdní doby bronzové. Lykijci mluvili anatolským jazykem luvijské větve a psali jej vlastním písmem, upraveným z řeckého, v nápisech z let asi 500–300 př. n. l.; jejich skalní hrobky ve tvaru domů jsou dosud vidět nad mnoha městy. Oblast leží dnes v provinciích Antalya a Muğla v Turecku."
    - "Lykie se objevuje na Pavlových cestách. Na konci své třetí cesty přišel „do Ródu, a odtud do Patary“, lykijského přístavu, a tam jeho družina nalezla „lodí, kteráž měla plouti do Fenicen“. Jako vězeň na cestě do Říma plul se svými strážci podél pobřeží: „A tak přeplavivše se přes moře Cilické a Pamfylické, přišli jsme do města Myry, kteréž jest v krajině, jenž slove Lycia.“ V Myře setník přesadil vězně na alexandrijskou loď plující do Itálie. 1. kniha Makabejská také jmenuje Lykii mezi státy, jimž římský konzul psal ve prospěch Židů."
    - "Hérodotos vypráví, jak ve 40. letech 6. století př. n. l. táhl perský vojevůdce Harpagos na Xanthos; Xanthové zavřeli své ženy, děti a majetek do citadely, zapálili ji a zahynuli v boji. V helénistické a římské době tvořila města Lykijský spolek; Strabón říká, že měl třiadvacet měst, největší se třemi hlasy ve společné radě, střední se dvěma a ostatní s jedním, a chválí jej jako dobře spravovaný. Roku 43 n. l. Klaudius po rozbrojích, v nichž byli zabiti Římané, vzal Lykijcům svobodu a učinil z Lykie provincii a roku 74 ji Vespasianus spojil s Pamfylií. Xanthos a jeho svatyně Létó, kde byl roku 1973 nalezen trojjazyčný nápis lykijsky, řecky a aramejsky, jsou na seznamu světového dědictví UNESCO."
