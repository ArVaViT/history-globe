body:
  en:
    - "Zarephath was a Phoenician town on the coast between Sidon and Tyre, “which belongeth to Zidon”, at today's Sarafand in Lebanon, about 13 km south of Sidon. Its name may come from a root meaning to smelt or refine. Egyptian scribes of the thirteenth century BC knew it, and Sennacherib lists Sariptu among the towns he took from Luli of Sidon in 701 BC. James Pritchard's excavations of 1969–1974 on the headland of Ras el-Qantara found a town inhabited from the Late Bronze Age through the Iron Age without a break, with rows of potters' kilns, vats for purple dye from the murex, and a small shrine first built in the eighth century whose ivory plaque is inscribed to Tanit-Ashtart, the first evidence of Tanit's worship found in Phoenicia itself."
    - "In the drought Elijah was told, “Arise, get thee to Zarephath, which belongeth to Zidon, and dwell there: behold, I have commanded a widow woman there to sustain thee.” At the gate he found her gathering sticks for a last meal for herself and her son; she fed him first, and “the barrel of meal wasted not, neither did the cruse of oil fail, according to the word of the LORD”. When her son died Elijah carried him to the upper chamber and prayed him back to life, and she said, “Now by this I know that thou art a man of God”. Obadiah promises the exiles of Israel the Canaanite coast “even unto Zarephath”."
    - "At Nazareth Jesus reminded the synagogue that in Elijah's famine the prophet was sent to none of the widows of Israel, “save unto Sarepta, a city of Sidon, unto a woman that was a widow”, and the hearers rose to throw him out. Eusebius knew Sarepta on the road from Tyre to Sidon, and Jerome tells how Paula was shown there the little tower of Elijah. A Crusader chapel of the widow stood by the shore, and a Muslim shrine of el-Khidr, the saint identified with Elijah, remains. Sarafand today is a town of fishermen and glass-blowers in the Sidon district of South Lebanon, with the mound of the ancient town on the headland south of it."
  ru:
    - "Сарепта — финикийский город на берегу между Сидоном и Тиром, «Сарепта Сидонская», на месте нынешнего Сарафанда в Ливане, примерно в 13 км к югу от Сидона. Имя, возможно, от корня со значением «плавить, очищать». Египетские писцы XIII века до н. э. знали её, а Сеннахирим числит Сарипту среди городов, отнятых им у Лули Сидонского в 701 г. до н. э. Раскопки Джеймса Притчарда 1969–1974 годов на мысе Рас-эль-Кантара открыли город, населённый без перерыва от позднего бронзового века через весь железный, с рядами гончарных печей, чанами для пурпура из багрянки и маленьким святилищем, построенным в VIII веке, чья пластинка из слоновой кости посвящена Танит-Астарте, — первое свидетельство почитания Танит, найденное в самой Финикии."
    - "В засуху Илии было сказано: «встань и пойди в Сарепту Сидонскую, и оставайся там; Я повелел там женщине вдове кормить тебя». У ворот он застал её собирающей дрова для последней трапезы себе и сыну; она накормила сначала его, и «мука в кадке не истощалась, и масло в кувшине не убывало, по слову Господа». Когда её сын умер, Илия отнёс его в горницу и вымолил к жизни, и она сказала: «теперь-то я узнала, что ты человек Божий». Авдий обещает переселенцам Израиля ханаанский берег «до Сарепты»."
    - "В Назарете Иисус напомнил синагоге, что в голод при Илии пророк не был послан ни к одной из вдов Израиля, «а только ко вдове в Сарепту Сидонскую», и слушатели встали, чтобы выгнать его. Евсевий знал Сарепту на дороге из Тира в Сидон, а Иероним рассказывает, как Павле показали там башенку Илии. У берега стояла крестоносная часовня вдовы, и остаётся мусульманская святыня Эль-Хидра — святого, которого отождествляют с Илиёй. Сарафанд сегодня — городок рыбаков и стеклодувов в округе Сидон на юге Ливана, а холм древнего города лежит на мысе к югу от него."
  uk:
    - "Сарепта була фінікійським містом на узбережжі між Сідоном і Тіром, «Сарептою Сидонською», при нинішньому Сарафанді в Лівані, приблизно за 13 км на південь від Сідона. Її назва може походити від кореня, що означає плавити або очищати. Єгипетські писарі XIII ст. до н. е. знали її, а Сінаххеріб перелічує Саріпту серед міст, які він узяв у Лулі Сідонського в 701 р. до н. е. Розкопки Джеймса Прітчарда 1969–1974 років на мисі Рас-ель-Кантара виявили місто, заселене від пізньої бронзової доби через залізну без перерви, з рядами гончарних печей, чанами для пурпурової фарби з мурексу та малим святилищем, збудованим уперше у VIII столітті, чия слонова пластина має напис Таніт-Аштарт, перший доказ шанування Таніт, знайдений у самій Фінікії."
    - "Під час посухи Іллі було сказано: «Встань і йди в Сарепту Сидонську, та й пробувай там. Дав я там удові повелїннє кормити тебе». Біля воріт він знайшов її, що збирала тріски для останньої трапези для себе й сина; вона нагодувала його першого, і «Муки в глецї не меншіло й олїї в банцї не убувало, по слову Господньому». Коли її син помер, Ілля поніс його в горішню світличку і молитвою повернув до життя, і вона сказала: «Тепер я знаю, що ти чоловік Божий». Овадія обіцяє вигнанцям Ізраїлю ханаанське узбережжя «аж до Сарепти»."
    - "У Назареті Ісус нагадав синагозі, що за Іллиного голоду пророка не послано до жодної з удів Ізраїлю, «тільки в Сарепту Сидонську до жінки вдовицї», і слухачі підвелися, щоб вигнати Його. Євсевій знав Сарепту на дорозі від Тіру до Сідона, а Ієронім розповідає, як Павлі там показали малу вежу Іллі. Біля берега стояла каплиця вдови часів хрестоносців, і мусульманська святиня ель-Хідра, святого, ототожненого з Іллею, лишається. Сарафанд нині — містечко рибалок і склодувів у районі Сідон у Південному Лівані, з пагорбом давнього міста на мисі на південь від нього."
  es:
    - "Sarepta era una ciudad fenicia de la costa entre Sidón y Tiro, «Sarepta de Sidón», en la actual Sarafand, en el Líbano, a unos 13 km al sur de Sidón. Su nombre puede proceder de una raíz que significa fundir o refinar. Los escribas egipcios del siglo XIII a. C. la conocían, y Senaquerib enumera Sariptu entre las ciudades que tomó a Luli de Sidón en 701 a. C. Las excavaciones de James Pritchard de 1969–1974 en el promontorio de Ras el-Qantara hallaron una ciudad habitada sin interrupción desde el Bronce Final hasta la Edad del Hierro, con hileras de hornos de alfareros, cubas para el tinte de púrpura del múrex y un pequeño santuario construido por primera vez en el siglo VIII cuya placa de marfil está inscrita a Tanit-Astart, la primera prueba del culto de Tanit hallada en la propia Fenicia."
    - "En la sequía se dijo a Elías: «Levántate, vete á Sarepta de Sidón, y allí morarás: he aquí yo he mandado allí á una mujer viuda que te sustente». A la puerta la halló recogiendo leña para una última comida para ella y su hijo; ella lo alimentó primero, y «La tinaja de la harina no escaseó, ni menguó la botija del aceite, conforme á la palabra de Jehová». Cuando murió su hijo, Elías lo llevó a la cámara alta y con su oración lo devolvió a la vida, y ella dijo: «Ahora conozco que tú eres varón de Dios». Abdías promete a los desterrados de Israel la costa cananea «hasta Sarepta»."
    - "En Nazaret, Jesús recordó a la sinagoga que en la hambruna de Elías el profeta no fue enviado a ninguna de las viudas de Israel, «sino á Sarepta de Sidón, á una mujer viuda», y los oyentes se levantaron para echarlo fuera. Eusebio conocía Sarepta en el camino de Tiro a Sidón, y Jerónimo cuenta cómo a Paula le mostraron allí la torrecilla de Elías. Una capilla cruzada de la viuda se alzaba junto a la orilla, y subsiste un santuario musulmán de el-Jidr, el santo identificado con Elías. Sarafand es hoy una población de pescadores y sopladores de vidrio del distrito de Sidón, en el Líbano Meridional, con el montículo de la antigua ciudad en el promontorio al sur."
  pt:
    - "Sarepta era uma cidade fenícia na costa entre Sidom e Tiro, “que pertence a Sidom”, na atual Sarafand, no Líbano, uns 13 km ao sul de Sidom. Seu nome pode vir de uma raiz que significa fundir ou refinar. Escribas egípcios do século XIII a.C. a conheciam, e Senaqueribe lista Sariptu entre as cidades que tomou de Luli de Sidom em 701 a.C. As escavações de James Pritchard, em 1969–1974, no promontório de Ras el-Qantara, acharam uma cidade habitada do Bronze Final por toda a Idade do Ferro sem interrupção, com fileiras de fornos de oleiros, tinas para a tinta púrpura do múrex e um pequeno santuário construído no século VIII, cuja placa de marfim é inscrita a Tanit-Astarte, a primeira prova do culto de Tanit achada na própria Fenícia."
    - "Na seca, Elias ouviu: “Levante-se, vá para Sarepta, que pertence a Sidom, e fique lá. Eis que ordenei a uma viúva ali que o sustente.” À porta, achou-a juntando gravetos para uma última refeição para si e o filho; ela o alimentou primeiro, e “O pote de farinha não se acabou e o jarro de azeite não faltou, segundo a palavra do SENHOR”. Quando o filho dela morreu, Elias o levou ao quarto de cima e, orando, o trouxe de volta à vida, e ela disse: “Agora eu sei que você é um homem de Deus”. Obadias promete aos exilados de Israel a costa cananeia “até Sarepta”."
    - "Em Nazaré, Jesus lembrou à sinagoga que, na fome de Elias, o profeta não foi enviado a nenhuma das viúvas de Israel, “senão a Sarepta, na terra de Sidom, a uma mulher que era viúva”, e os ouvintes se levantaram para expulsá-lo. Eusébio conhecia Sarepta na estrada de Tiro a Sidom, e Jerônimo conta que ali mostraram a Paula a pequena torre de Elias. Uma capela cruzada da viúva ficava junto à praia, e permanece um santuário muçulmano de el-Khidr, o santo identificado com Elias. Sarafand é hoje uma cidade de pescadores e sopradores de vidro no distrito de Sidom, no Líbano do Sul, com o monte da antiga cidade no promontório ao sul dela."
  de:
    - "Sarepta war eine phönizische Stadt an der Küste zwischen Sidon und Tyrus, „welches bei Sidon liegt“, beim heutigen Sarafand im Libanon, etwa 13 km südlich von Sidon. Sein Name mag von einer Wurzel für Schmelzen oder Läutern kommen. Ägyptische Schreiber des dreizehnten Jahrhunderts v. Chr. kannten es, und Sanherib führt Sariptu unter den Städten auf, die er 701 v. Chr. Luli von Sidon abnahm. James Pritchards Grabungen 1969–1974 auf der Landzunge Ras el-Qantara fanden eine von der Spätbronzezeit bis durch die Eisenzeit ununterbrochen bewohnte Stadt mit Reihen von Töpferöfen, Becken für Purpurfarbstoff aus der Murex-Schnecke und einem kleinen Heiligtum, zuerst im achten Jahrhundert gebaut, dessen Elfenbeintäfelchen Tanit-Astarte gewidmet ist, der ersten in Phönizien selbst gefundenen Spur der Verehrung Tanits."
    - "In der Dürre wurde Elia gesagt: „Mache dich auf und gehe gen Zarpath, welches bei Sidon liegt, und bleibe daselbst; denn ich habe einer Witwe geboten, daß sie dich versorge.“ Am Tor fand er sie, wie sie Holz für eine letzte Mahlzeit für sich und ihren Sohn sammelte; sie speiste ihn zuerst: „Das Mehl im Kad ward nicht verzehrt, und dem Ölkrug mangelte nichts nach dem Wort des HERRN“. Als ihr Sohn starb, trug Elia ihn in die Oberstube und betete ihn ins Leben zurück, und sie sagte: „Nun erkenne ich, daß du ein Mann Gottes bist“. Obadja verheißt den Verbannten Israels die kanaanäische Küste „bis gen Zarpath“."
    - "In Nazaret erinnerte Jesus die Synagoge daran, dass in Elias Hungersnot der Prophet zu keiner der Witwen Israels gesandt wurde, „denn allein gen Sarepta der Sidonier zu einer Witwe“, und die Hörer standen auf, ihn hinauszuwerfen. Eusebius kannte Sarepta an der Straße von Tyrus nach Sidon, und Hieronymus erzählt, wie Paula dort das Türmchen des Elia gezeigt wurde. Eine Kreuzfahrerkapelle der Witwe stand am Ufer, und ein muslimischer Schrein des el-Khidr, des mit Elia gleichgesetzten Heiligen, besteht noch. Sarafand ist heute eine Stadt von Fischern und Glasbläsern im Bezirk Sidon im Südlibanon, mit dem Hügel der antiken Stadt auf der Landzunge südlich davon."
  fr:
    - "Sarepta était une ville phénicienne de la côte entre Sidon et Tyr, « qui appartient à Sidon », à l’actuelle Sarafand, au Liban, à environ 13 km au sud de Sidon. Son nom peut venir d’une racine signifiant fondre ou raffiner. Des scribes égyptiens du XIIIe siècle av. J.-C. la connaissaient, et Sanchérib cite Sariptu parmi les villes qu’il prit à Luli de Sidon en 701 av. J.-C. Les fouilles de James Pritchard en 1969-1974 sur le promontoire de Ras el-Qantara y trouvèrent une ville habitée sans interruption du bronze récent à l’âge du fer, avec des rangées de fours de potiers, des cuves pour la pourpre du murex et un petit sanctuaire bâti au VIIIe siècle dont une plaque d’ivoire est inscrite à Tanit-Ashtart, première preuve du culte de Tanit trouvée en Phénicie même."
    - "Pendant la sécheresse, Élie reçut cet ordre : « Lève-toi, va à Sarepta, qui appartient à Sidon, et demeure là. Voici, j’y ai ordonné à une femme veuve de te nourrir. » À la porte, il la trouva ramassant du bois pour un dernier repas pour elle et son fils ; elle le nourrit d’abord, et « la farine qui était dans le pot ne manqua point, et l’huile qui était dans la cruche ne diminua point, selon la parole que l’Éternel avait prononcée par Élie ». Quand son fils mourut, Élie le porta dans la chambre haute et le rappela à la vie par la prière, et elle dit : « Je reconnais maintenant que tu es un homme de Dieu ». Abdias promet aux exilés d’Israël le pays des Cananéens « jusqu’à Sarepta »."
    - "À Nazareth, Jésus rappela à la synagogue que, lors de la famine d’Élie, le prophète ne fut envoyé vers aucune des veuves d’Israël, « si ce n’est vers une femme veuve, à Sarepta, dans le pays de Sidon », et ses auditeurs se levèrent pour le jeter dehors. Eusèbe connaissait Sarepta sur la route de Tyr à Sidon, et Jérôme raconte que Paula s’y fit montrer la petite tour d’Élie. Une chapelle croisée de la veuve se dressait près du rivage, et un sanctuaire musulman d’el-Khidr, le saint identifié à Élie, subsiste. Sarafand est aujourd’hui une ville de pêcheurs et de souffleurs de verre du district de Sidon, au Liban-Sud, avec le tertre de l’ancienne ville sur le promontoire au sud."
  pl:
    - "Sarepta była fenickim miastem na wybrzeżu między Sydonem a Tyrem, należącym do Sydonu, w dzisiejszym Sarafand w Libanie, około 13 km na południe od Sydonu. Jej nazwa może pochodzić od rdzenia oznaczającego wytapianie lub oczyszczanie. Znali ją egipscy skrybowie z XIII wieku p.n.e., a Sennacheryb wymienia Sariptu wśród miast, które zabrał Luliemu z Sydonu w 701 roku p.n.e. Wykopaliska Jamesa Pritcharda z lat 1969–1974 na cyplu Ras el-Kantara odsłoniły miasto zamieszkane od późnej epoki brązu przez epokę żelaza bez przerwy, z rzędami garncarskich pieców, kadziami na purpurowy barwnik ze ślimaka murex i małym sanktuarium, zbudowanym po raz pierwszy w VIII wieku, którego kościana płytka ma napis dla Tanit-Asztart, pierwszy dowód kultu Tanit znaleziony w samej Fenicji."
    - "W czasie suszy Eliaszowi powiedziano: „Wstań, idź do Sarepty Sydońskiej, i mieszkaj tam; otom tam rozkazał niewieście wdowie, aby cię żywiła.” W bramie zastał ją zbierającą drewno na ostatni posiłek dla siebie i syna; nakarmiła go pierwszego, i „Nie była strawiona mąka z onego garnca, ani oliwy z bańki ubyło, według słowa Pańskiego”. Gdy jej syn umarł, Eliasz zaniósł go do górnej izby i modlitwą przywrócił go do życia, a ona rzekła: „Terazem poznała, iżeś jest mąż Boży”. Abdiasz obiecuje wygnańcom Izraela wybrzeże kananejskie „aż do Sarepty”."
    - "W Nazarecie Jezus przypomniał synagodze, że w głodzie za dni Eliasza prorok nie został posłany do żadnej z wdów Izraela, „tylko do Sarepty, miasta Sydońskiego, do jednej wdowy”, a słuchacze wstali, by go wyrzucić. Euzebiusz znał Sareptę przy drodze z Tyru do Sydonu, a Hieronim opowiada, jak Pauli pokazano tam wieżyczkę Eliasza. Kaplica krzyżowców wdowy stała nad brzegiem i pozostaje muzułmańskie sanktuarium el-Chidra, świętego utożsamianego z Eliaszem. Sarafand jest dziś miastem rybaków i szklarzy w okręgu Sydonu w Libanie Południowym, z kopcem starożytnego miasta na cyplu na południe od niego."
  it:
    - "Sarepta era una città fenicia sulla costa fra Sidone e Tiro, «Sarepta de’ Sidoni», all’odierna Sarafand in Libano, circa 13 km a sud di Sidone. Il suo nome può derivare da una radice che significa fondere o raffinare. Gli scribi egizi del XIII secolo a.C. la conoscevano, e Sennacherib elenca Sariptu fra le città che tolse a Luli di Sidone nel 701 a.C. Gli scavi di James Pritchard del 1969–1974 sul promontorio di Ras el-Qantara trovarono una città abitata dal Bronzo Tardo attraverso l’età del Ferro senza interruzione, con file di fornaci da vasai, vasche per la porpora dal murice e un piccolo santuario costruito per la prima volta nell’VIII secolo, la cui placca d’avorio è iscritta a Tanit-Astarte, la prima testimonianza del culto di Tanit trovata nella stessa Fenicia."
    - "Durante la siccità a Elia fu detto: «Lèvati, va a Sarepta de’ Sidoni, e fa’ quivi la tua dimora; ecco, io ho ordinato colà ad una vedova che ti dia da mangiare». Alla porta la trovò che raccoglieva legna per un ultimo pasto per sé e per il figlio; ella lo nutrì per primo, e «il vaso della farina non si esaurì, e l’orciuolo dell’olio non calò, secondo la parola che l’Eterno avea pronunziata per bocca d’Elia». Quando suo figlio morì Elia lo portò nella camera di sopra e pregò finché tornò alla vita, ed ella disse: «Ora riconosco che tu sei un uomo di Dio». Abdia promette agli esuli d’Israele la costa cananea «fino a Sarepta»."
    - "A Nazaret Gesù ricordò alla sinagoga che nella carestia di Elia il profeta non fu mandato a nessuna delle vedove d’Israele, «ma fu mandato a una vedova in Sarepta di Sidon», e gli ascoltatori si alzarono per cacciarlo. Eusebio conosceva Sarepta sulla strada da Tiro a Sidone, e Girolamo racconta che a Paola vi fu mostrata la torretta di Elia. Una cappella crociata della vedova sorgeva presso la riva, e resta un santuario musulmano di el-Khidr, il santo identificato con Elia. Sarafand è oggi una città di pescatori e soffiatori di vetro nel distretto di Sidone del Libano meridionale, con il tell dell’antica città sul promontorio a sud."
  nl:
    - "Sarefat was een Fenicische stad aan de kust tussen Sidon en Tyrus, “dat bij Sidon is”, bij het huidige Sarafand in Libanon, ongeveer 13 km ten zuiden van Sidon. De naam komt mogelijk van een wortel die smelten of zuiveren betekent. Egyptische schrijvers uit de dertiende eeuw v.Chr. kenden het, en Sanherib noemt Sariptu onder de steden die hij in 701 v.Chr. van Luli van Sidon nam. De opgravingen van James Pritchard in 1969–1974 op de landtong Ras el-Qantara vonden een stad die zonder onderbreking bewoond was van de Late Bronstijd tot en met de IJzertijd, met rijen pottenbakkersovens, kuipen voor purperverf uit de murex, en een klein heiligdom, voor het eerst gebouwd in de achtste eeuw, waarvan een ivoren plaatje is opgedragen aan Tanit-Astarte, het eerste bewijs van de verering van Tanit in Fenicië zelf."
    - "In de droogte kreeg Elia te horen: “Maak u op, ga heen naar Zarfath, dat bij Sidon is, en woon aldaar; zie, Ik heb daar een weduwvrouw geboden, dat zij u onderhoude.” Bij de poort vond hij haar hout lezend voor een laatste maaltijd voor haarzelf en haar zoon; zij voedde hem eerst, en “Het meel van de kruik werd niet verteerd, en de olie van de fles ontbrak niet, naar het woord des HEEREN”. Toen haar zoon stierf, droeg Elia hem naar de bovenkamer en bad hem terug tot leven, en zij zei: “Nu weet ik, dat gij een man Gods zijt”. Obadja belooft de ballingen van Israël de Kanaänitische kust “tot Zarfath toe”."
    - "In Nazareth herinnerde Jezus de synagoge eraan dat Elia in de hongersnood tot geen van de weduwen van Israël werd gezonden, “dan naar Sarepta Sidonis, tot een vrouw, die weduwe was”, en de toehoorders stonden op om hem eruit te gooien. Eusebius kende Sarepta aan de weg van Tyrus naar Sidon, en Hieronymus vertelt hoe Paula er het torentje van Elia te zien kreeg. Een kruisvaarderskapel van de weduwe stond aan de kust, en een islamitisch heiligdom van el-Khidr, de heilige die met Elia wordt vereenzelvigd, bestaat nog. Sarafand is tegenwoordig een stad van vissers en glasblazers in het district Sidon van Zuid-Libanon, met de heuvel van de antieke stad op de landtong ten zuiden ervan."
  cs:
    - "Sarepta bylo fénické město na pobřeží mezi Sidónem a Týrem, patřící k Sidónu, v dnešním Sarafandu v Libanonu, asi 13 km jižně od Sidónu. Jeho jméno může pocházet z kořene znamenajícího tavit nebo rafinovat. Egyptští písaři 13. stol. př. n. l. je znali a Senacherib uvádí Sariptu mezi městy, která roku 701 př. n. l. vzal Luliovi ze Sidónu. Vykopávky Jamese Pritcharda v letech 1969–1974 na výběžku Rás el-Kantara našly město osídlené od pozdní doby bronzové po dobu železnou bez přerušení, s řadami hrnčířských pecí, kádí na nachové barvivo z murexu a svatyní postavenou poprvé v 8. století, jejíž slonovinová destička nese nápis Tanit-Aštart, první doklad uctívání Tanit nalezený ve Fénicii samé."
    - "V suchu bylo Elijášovi řečeno: „Vstaň a jdi do Sarepty Sidonské, a buď tam. Aj, přikázal jsem ženě vdově, aby tě živila.“ U brány ji našel, jak sbírá dříví na poslední jídlo pro sebe a svého syna; nasytila nejprve jeho a „z kbelíka toho mouka nebyla strávena, aniž oleje v nádobce ubylo, vedlé řeči Hospodinovy“. Když její syn zemřel, Elijáš ho vynesl do horní místnosti a modlitbou ho přivedl zpět k životu a ona řekla: „Jižť jsem nyní poznala, že jsi muž Boží“. Obadjáš slibuje vyhnancům Izraele kanaánské pobřeží „až do Sarepty“."
    - "V nazaretské synagoze Ježíš připomněl, že za Elijášova hladu nebyl prorok poslán k žádné z izraelských vdov, „než toliko do Sarepty Sidonské k ženě vdově“, a posluchači vstali, aby ho vyhnali. Eusebius znal Sareptu na cestě z Týru do Sidónu a Jeroným vypráví, jak byla Paula na tom místě provedena kolem Elijášovy věžičky. Křižácká kaple vdovy stála u pobřeží a muslimská svatyně al-Chidra, světce ztotožněného s Elijášem, tam zůstává. Sarafand je dnes městem rybářů a sklářů v okrese Sidón v jižním Libanonu, s pahorkem starověkého města na výběžku jižně od něj."
