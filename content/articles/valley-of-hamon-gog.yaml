# Overview article (ADR 0007). Mainstream facts only; a prophetic name, not an identified place; the app's candidates are listed without a choice.
id: valley-of-hamon-gog
place: a2109c3
title:
  en: "Valley of Hamon-gog"
  ru: "Долина полчища Гогова"
  uk: "Долина війська Гога"
  es: "Valle de Hamón-gog"
  pt: "Vale de Hamom-Gogue"
  de: "Tal Hamon-Gog"
  fr: "Vallée d’Hamon-Gog"
  pl: "Dolina Chamon-Gog"
  it: "Valle di Camon-Gog"
  nl: "Dal van Hamon-Gog"
  cs: "Údolí Chamon-gogu"
body:
  en:
    - "The valley of Hamon-gog, “the multitude of Gog”, is not a place anyone has visited: it belongs to Ezekiel's vision of the last battle. After Gog of the land of Magog and his hordes fall on the mountains of Israel, the Lord says, “I will give unto Gog a place there of graves in Israel, the valley of the passengers on the east of the sea… and there shall they bury Gog and all his multitude: and they shall call it The valley of Hamon-gog.” For seven months the house of Israel buries the dead to cleanse the land; whoever finds a bone sets up a sign by it “till the buriers have buried it in the valley of Hamon-gog”, and a city there is to be called Hamonah, “multitude”."
    - "Commentators have tried to read a real landscape behind the vision. “The valley of the passengers on the east of the sea” has been taken as a valley on the road east of the Dead Sea, in the mountains of Abarim in Moab, though that would put the graves outside the land proper; some emend “passengers” to Abarim outright. Others think of the Transjordan more vaguely, of the valley of Jezreel, the old battlefield of the north, or of the valley of Hinnom with its associations of judgement. The map keeps these candidates without choosing. The name occurs nowhere else and no site has ever borne it; it is a prophetic name, not a place on the ground."
  ru:
    - "Долина полчища Гогова — не место, где кто-нибудь бывал: она принадлежит видению Иезекииля о последней битве. После того как Гог из земли Магог и его полчища падут на горах Израилевых, Господь говорит: «дам Гогу место для могилы в Израиле, долину прохожих на восток от моря, и она будет задерживать прохожих; и похоронят там Гога и все полчище его, и будут называть ее долиною полчища Гогова». Семь месяцев дом Израилев хоронит мёртвых, чтобы очистить землю; кто найдёт кость, ставит возле неё знак, «доколе погребатели не похоронят ее в долине полчища Гогова», а городу там будет имя Гамона, «полчище»."
    - "Толкователи пытались увидеть за видением настоящую местность. «Долину прохожих на восток от моря» понимали как долину на дороге к востоку от Мёртвого моря, в горах Аварим в Моаве, хотя тогда могилы оказались бы вне собственно земли Израиля; некоторые прямо исправляют «прохожих» на Аварим. Другие думают о Заиорданье вообще, о долине Изреельской, старом поле битв на севере, или о долине Хинном с её памятью о суде. Карта хранит этих кандидатов, не выбирая. Имя больше нигде не встречается, и ни одно место его никогда не носило; это имя пророческое, а не точка на земле."
  uk:
    - "Долина війська Гога, «товпи Гога», — не місце, яке хтось відвідував: вона належить до видіння Єзекіїля про останню битву. Після того як Гог із землі Магог та його орди обрушаться на гори Ізраїлю, Господь каже: «призначу місце Гогові на гробовище в Ізраїлї, — в мандрівній долинї, на всхід од моря, і будуть зʼупинятись на нїй прохожі. Так поховають Гога й усї товпи його, й прозвуть її Долиною товп Гогових». Сім місяців дім Ізраїлів ховає мертвих, щоб очистити землю; хто знайде кістку, ставить біля неї знак, «щоб погребачі ховали його в Долинї ватаг Гогових», а місто там зватиметься Гамона, «товпа»."
    - "Коментатори намагалися прочитати за видінням справжній краєвид. «Мандрівну долину на схід від моря» брали за долину на дорозі на схід від Мертвого моря, в горах Аварім у Моаві, хоч це поставило б могили поза власне краєм; деякі виправляють «мандрівну» прямо на Аварім. Інші думають про Трансйорданію загальніше, про долину Їзреель, давнє поле битв півночі, або про долину Гінном з її асоціаціями суду. Мапа зберігає цих кандидатів без вибору. Назва більше ніде не трапляється, і жодне місце ніколи її не носило; це пророча назва, а не місце на землі."
  es:
    - "El valle de Hamón-gog, «la multitud de Gog», no es un lugar que nadie haya visitado: pertenece a la visión de Ezequiel de la última batalla. Después de que Gog, de la tierra de Magog, y sus hordas caen sobre los montes de Israel, dice el Señor: «yo daré á Gog lugar para sepultura allí en Israel, el valle de los que pasan al oriente de la mar, … pues allí enterrarán á Gog y á toda su multitud: y lo llamarán, El valle de Hamón-gog». Durante siete meses la casa de Israel entierra a los muertos para limpiar la tierra; quien halla un hueso levanta un mojón junto a él «hasta que los entierren los sepultureros en el valle de Hamón-gog», y una ciudad allí se llamará Hamona, «multitud»."
    - "Los comentaristas han intentado leer un paisaje real tras la visión. «El valle de los que pasan al oriente de la mar» se ha tomado por un valle en el camino al este del mar Muerto, en las montañas de Abarim, en Moab, aunque eso pondría las tumbas fuera de la tierra propiamente dicha; algunos enmiendan «los que pasan» por Abarim sin más. Otros piensan, de manera más vaga, en Transjordania, en el valle de Jezreel, el antiguo campo de batalla del norte, o en el valle de Hinnom con sus asociaciones de juicio. El mapa conserva estos candidatos sin elegir. El nombre no aparece en ningún otro lugar y ningún sitio lo ha llevado jamás; es un nombre profético, no un lugar sobre el terreno."
  pt:
    - "O vale de Hamom-Gogue, “a multidão de Gogue”, não é um lugar que alguém tenha visitado: pertence à visão de Ezequiel sobre a última batalha. Depois que Gogue, da terra de Magogue, e suas hordes caem sobre os montes de Israel, o Senhor diz: “darei a Gogue um lugar para sepultamento em Israel, o vale dos viajantes, a leste do mar … Ali sepultarão Gogue e toda a sua multidão, e o chamarão de ‘O vale de Hamom-Gogue’.” Por sete meses a casa de Israel sepulta os mortos para purificar a terra; quem achar um osso põe um sinal junto a ele “até que os coveiros o tenham sepultado no vale de Hamom-Gogue”, e ali uma cidade se chamará Hamona, “multidão”."
    - "Comentaristas tentaram ler uma paisagem real por trás da visão. “O vale dos viajantes, a leste do mar” foi tomado como um vale na estrada a leste do Mar Morto, nas montanhas de Abarim, em Moabe, embora isso pusesse os túmulos fora da terra propriamente dita; alguns emendam “viajantes” para Abarim. Outros pensam de modo mais vago na Transjordânia, no vale de Jezreel, o velho campo de batalha do norte, ou no vale de Hinom, com suas associações de juízo. O mapa conserva esses candidatos sem escolher. O nome não ocorre em nenhum outro lugar e nenhum sítio jamais o levou; é um nome profético, não um lugar no terreno."
  de:
    - "Das Tal Hamon-Gog, „die Menge Gogs“, ist kein Ort, den je jemand besucht hat: Es gehört zu Hesekiels Vision der letzten Schlacht. Nachdem Gog aus dem Land Magog und seine Horden über die Berge Israels hergefallen sind, sagt der Herr: „da will ich Gog einen Ort geben zum Begräbnis in Israel, nämlich das Tal, da man geht am Meer gegen Morgen, … weil man daselbst Gog mit seiner Menge begraben hat; und soll heißen ‚Gogs Haufental‘“. Sieben Monate lang begräbt das Haus Israel die Toten, um das Land zu reinigen; wer ein Gebein findet, richtet ein Mal dabei auf, „bis es die Totengräber auch in Gogs Haufental begraben“, und eine Stadt dort soll Hamona heißen, „Menge“."
    - "Ausleger haben hinter der Vision eine wirkliche Landschaft zu lesen versucht. „Das Tal, da man geht am Meer gegen Morgen“ wurde als Tal an der Straße östlich des Toten Meeres gedeutet, im Gebirge Abarim in Moab, was die Gräber freilich außerhalb des eigentlichen Landes legte; manche ändern „die, so vorübergehen“ geradewegs in Abarim. Andere denken vager an das Ostjordanland, an die Jesreel-Ebene, das alte Schlachtfeld des Nordens, oder an das Hinnomtal mit seinen Gerichtsassoziationen. Die Karte behält diese Kandidaten, ohne zu wählen. Der Name kommt sonst nirgends vor, und keine Stätte hat ihn je getragen; es ist ein prophetischer Name, kein Ort im Gelände."
  fr:
    - "La vallée d’Hamon-Gog, « la multitude de Gog », n’est pas un lieu que quiconque ait visité : elle appartient à la vision d’Ézéchiel de la dernière bataille. Après que Gog, du pays de Magog, et ses hordes se sont abattus sur les montagnes d’Israël, le Seigneur dit : « Je donnerai à Gog un lieu qui lui servira de sépulcre en Israël, la vallée des voyageurs, à l’orient de la mer … C’est là qu’on enterrera Gog et toute sa multitude, et on appellera cette vallée la vallée de la multitude de Gog. » Pendant sept mois, la maison d’Israël enterre les morts pour purifier le pays ; quiconque trouve un os met un signe près de lui « jusqu’à ce que les fossoyeurs l’enterrent dans la vallée de la multitude de Gog », et une ville y sera appelée Hamona, « multitude »."
    - "Les commentateurs ont cherché un paysage réel derrière la vision. « La vallée des voyageurs, à l’orient de la mer » a été prise pour une vallée sur la route à l’est de la mer Morte, dans les montagnes d’Abarim, en Moab, ce qui placerait pourtant les tombes hors du pays proprement dit ; certains corrigent carrément « voyageurs » en Abarim. D’autres pensent plus vaguement à la Transjordanie, à la vallée de Jizreel, ancien champ de bataille du nord, ou à la vallée de Hinnom et ses associations de jugement. La carte garde ces candidats sans choisir. Le nom n’apparaît nulle part ailleurs et aucun site ne l’a jamais porté ; c’est un nom prophétique, non un lieu sur le terrain."
  pl:
    - "Dolina Chamon-Gog, „mnóstwo Goga”, nie jest miejscem, które ktokolwiek odwiedził: należy do widzenia Ezechiela o ostatniej bitwie. Gdy Gog z ziemi Magog i jego hordy polegną na górach Izraela, Pan mówi: „dam Gogowi miejsce na grób, tam w Izraelu, dolinę, którędy chodzą na wschód słońca ku morzu … i pogrzebią tam Goga i wszystkie zgraje jego, a będą ją zwać doliną mnóstwa Gogowego”. Przez siedem miesięcy dom Izraela grzebie zmarłych, by oczyścić ziemię; kto znajdzie kość, stawia przy niej znak, „aby je pochowali ci, co chowają umarłych, w dolini mnóstwa Gogowego”, a miasto tam ma być nazwane Hamona, „mnóstwo”."
    - "Komentatorzy próbowali odczytać za widzeniem rzeczywisty krajobraz. „Dolinę, którędy chodzą na wschód słońca ku morzu” brano za dolinę na drodze na wschód od Morza Martwego, w górach Abarim w Moabie, choć to umieściłoby groby poza właściwym krajem; niektórzy wprost poprawiają słowo oznaczające przechodzących na Abarim. Inni myślą ogólniej o Zajordaniu, o dolinie Jizreel, dawnym polu bitew na północy, albo o dolinie Hinnom z jej skojarzeniami sądu. Mapa zachowuje tych kandydatów bez wyboru. Nazwa nie występuje nigdzie indziej i żadne miejsce nigdy jej nie nosiło; jest to nazwa prorocka, nie miejsce w terenie."
  it:
    - "La valle di Camon-Gog, «la moltitudine di Gog», non è un luogo che qualcuno abbia visitato: appartiene alla visione di Ezechiele dell’ultima battaglia. Dopo che Gog del paese di Magog e le sue orde sono piombati sui monti d’Israele, il Signore dice: «io darò a Gog un luogo che gli servirà di sepoltura in Israele, la Valle de’ viandanti, a oriente del mare; … quivi sarà sepolto Gog con tutta la sua moltitudine; e quel luogo sarà chiamato la Valle d’Hamon-Gog». Per sette mesi la casa d’Israele seppellisce i morti per purificare il paese; chi trova delle ossa umane rizza lì vicino un segnale, «finché i seppellitori non li abbiano sotterrate nella Valle di Hamon-Gog», e una città vi si chiamerà Camona, «moltitudine»."
    - "I commentatori hanno cercato di leggere un paesaggio reale dietro la visione. «La Valle de’ viandanti, a oriente del mare» è stata intesa come una valle sulla strada a est del Mar Morto, sui monti di Abarim in Moab, benché ciò ponga le tombe fuori del paese propriamente detto; alcuni emendano senz’altro «viandanti» in Abarim. Altri pensano più vagamente alla Transgiordania, alla valle di Izreel, l’antico campo di battaglia del nord, o alla valle di Innom con le sue associazioni di giudizio. La mappa conserva questi candidati senza scegliere. Il nome non ricorre altrove e nessun luogo lo ha mai portato; è un nome profetico, non un luogo sul terreno."
  nl:
    - "Het dal van Hamon-Gog, “de menigte van Gog”, is geen plaats die iemand ooit heeft bezocht: het hoort bij het visioen van Ezechiël over de laatste strijd. Nadat Gog uit het land Magog en zijn horden op de bergen van Israël zijn gevallen, zegt de HEER: “dat Ik aan Gog aldaar een grafstede in Israël zal geven, het dal der doorgangers naar het oosten der zee … en aldaar zullen zij begraven Gog en zijn ganse menigte, en zullen het noemen: Het dal van Gogs menigte.” Zeven maanden lang begraaft het huis van Israël de doden om het land te reinigen; wie een bot vindt, richt er een teken bij op “totdat de doodgravers hetzelve zullen hebben begraven in het dal van Gogs menigte”, en een stad daar zal Chamona heten, “menigte”."
    - "Uitleggers hebben achter het visioen een werkelijk landschap proberen te lezen. “Het dal der doorgangers naar het oosten der zee” is opgevat als een dal aan de weg ten oosten van de Dode Zee, in het gebergte Abarim in Moab, hoewel dat de graven buiten het eigenlijke land zou plaatsen; sommigen veranderen “doorgangers” zonder meer in Abarim. Anderen denken vager aan Transjordanië, aan de vallei van Jizreël, het oude slagveld van het noorden, of aan het dal van Hinnom met zijn associaties met oordeel. De kaart houdt deze kandidaten zonder te kiezen. De naam komt nergens anders voor en geen plaats heeft hem ooit gedragen; het is een profetische naam, geen plaats op de grond."
  cs:
    - "Údolí Chamon-gogu, „množství Gogovo“, není místo, které by někdo navštívil: patří k Ezechielovu vidění poslední bitvy. Poté, co Gog z země Magog a jeho hordy padnou na izraelské hory, Hospodin praví: „dám Gogovi místo ku pohřbu tam v Izraeli, údolí, kudyž se jde k východní straně k moři, kteréžto zacpá ústa tudy jdoucích. I pohřbí tam Goga i všecko množství jeho, a nazovou je údolí množství Gogova“. Po sedm měsíců dům Izraelský pohřbívá mrtvé, aby očistil zemi; kdo najde kost, vztyčí u ní znamení, „aby je pohřbili hrobaři v údolí množství Gogova“, a tamní město se má jmenovat Chamona, „množství“."
    - "Vykladači se pokoušeli vyčíst za viděním skutečnou krajinu. Údolí pocestných východně od moře bylo pokládáno za údolí na cestě východně od Mrtvého moře, v horách Abárím v Moábu, ačkoli by to kladlo hroby mimo vlastní zemi; někteří rovnou opravují „pocestné“ na Abárím. Jiní myslí neurčitěji na Zajordánsko, na údolí Jizreel, staré bojiště severu, nebo na údolí Hinnom s jeho asociacemi soudu. Mapa ponechává tyto kandidáty bez volby. Jméno se nevyskytuje nikde jinde a žádné místo je nikdy nenosilo; je to prorocké jméno, ne místo na zemi."
