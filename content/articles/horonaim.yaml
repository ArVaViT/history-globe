body:
  en:
    - "Horonaim was a town of Moab known from the prophets' laments over that land. Isaiah's oracle sees the fugitives of Moab fleeing to Zoar: “by the mounting up of Luhith with weeping shall they go it up; for in the way of Horonaim they shall raise up a cry of destruction”. Jeremiah, who reworks the same oracle, hears “A voice of crying shall be from Horonaim”, says that “in the going down of Horonaim the enemies have heard a cry of destruction”, and stretches the lament “from Zoar even unto Horonaim”. The pairing of the ascent of Luhith and the descent of Horonaim, and the road to Zoar at the south end of the Dead Sea, put the town on the steep western edge of the Moabite plateau, where the roads climb from the Dead Sea shore to the tableland south of the Arnon."
    - "The town is older than the prophets. The Mesha Stele, the inscription of the king of Moab who rebelled after Ahab's death, ends with a campaign against Hauronen: Chemosh told Mesha “go down, fight against Hauronen”, and he went down; the broken lines that follow seem to say that he took it. Later Josephus lists Oronaim among the Moabite towns held by Alexander Jannaeus and promised back to the Nabataean king Aretas by Hyrcanus II. Where it stood is not settled: surveys of the Kerak plateau have proposed several ruins on the western scarp above the Dead Sea, among them el-Iraq, ed-Deir, Kathrabba, Khirbet Dhubab and Khirbet Meidan, and none has been excavated or has produced the name. Kathrabba is also a candidate for Luhith, so the two cannot both be right."
    - "The region is today the Karak governorate of Jordan, where the road from the Dead Sea at Mazraa climbs the escarpment to Kerak, the ancient Kir-hareseth, through the kind of country the prophets describe."
  ru:
    - "Оронаим — город Моава, известный по плачам пророков об этой земле. Пророчество Исаии видит беглецов Моава, бегущих к Сигору: «восходят на Лухит с плачем; по дороге Хоронаимской поднимают страшный крик». Иеремия, перерабатывающий то же пророчество, слышит «вопль от Оронаима», говорит, что «на спуске с Оронаима неприятель слышит вопль о разорении», и растягивает плач «от Сигора до Оронаима». Пара восхождения в Лухит и спуска с Оронаима, а также дорога к Сигору на южном конце Мёртвого моря помещают город на крутой западный край Моавитского плато, где дороги поднимаются от берега Мёртвого моря на плоскогорье к югу от Арнона."
    - "Город древнее пророков. Стела Меши, надпись царя Моава, отложившегося после смерти Ахава, кончается походом на Хауронен: Кемош сказал Месе «сойди, воюй с Хауроненом», и тот сошёл; повреждённые строки дальше, по-видимому, говорят, что он его взял. Позже Иосиф Флавий называет Оронаим среди моавитских городов, которыми владел Александр Яннай и которые Гиркан II обещал вернуть набатейскому царю Арете. Где он стоял, не решено: обследования плато Керак предложили несколько развалин на западном обрыве над Мёртвым морем, среди них Эль-Ирак, Эд-Дейр, Катрабба, Хирбет-Зубаб и Хирбет-Мейдан, и ни одна не раскопана и не дала имени. Катрабба к тому же претендует на Лухит, так что оба отождествления сразу верными быть не могут."
    - "Сегодня это иорданская провинция Эль-Карак, где дорога от Мёртвого моря у Мазраа поднимается по уступу к Кераку, древнему Кирхарешету, через ту самую местность, какую описывают пророки."
  uk:
    - "Хоронаїм було містом Моава, відомим із плачів пророків над цим краєм. Оракул Ісаї бачить, як втікачі Моава біжать до Сігору: «виходять, плачучи, на Лухит; по Хоронаїмській дорозї гірко голосять». Єремія, який переробляє той самий оракул, чує «Чути крик і з Оронаїму», каже, що «від спускаючихся в низ із Оронаїму зачуває ворог риданнє по спустошенню», і розтягує плач «від Сигора до Оронаїму». Зв’язок підйому Лухіту і спуску Хоронаїму та дорога до Сігору на південному кінці Мертвого моря розміщують місто на крутому західному краї моавського плато, де дороги здіймаються від берега Мертвого моря до високого плато на південь від Арнону."
    - "Місто давніше за пророків. Стела Меші, напис царя Моава, який повстав по смерті Ахава, закінчується походом проти Гауронена: Хемош сказав Меші «Зійди, воюй проти Гауронена», і той зійшов; уривчасті рядки, що йдуть далі, схоже, кажуть, що він його взяв. Пізніше Йосиф Флавій перелічує Оронаїм серед моавських міст, які утримував Александр Яннай і які Гіркан II пообіцяв повернути набатейському цареві Арете. Де воно стояло, не вирішено: обстеження плато Керака запропонували кілька руїн на західному схилі над Мертвим морем, серед них ель-Ірак, ед-Дейр, Катраба, Хірбет-Дзубаб і Хірбет-Мейдан, і жодна не була розкопана чи дала назву. Катраба також кандидат на Лухіт, тож обидва не можуть бути правильними."
    - "Цей край нині — губернаторство Карак Йорданії, де дорога від Мертвого моря біля Мазраа здіймається схилом до Керака, давнього Кір-Харешету, країною, яку описують пророки."
  es:
    - "Horonaim era una población de Moab conocida por las lamentaciones de los profetas sobre esa tierra. El oráculo de Isaías ve a los fugitivos de Moab huir hacia Zoar: «Por la cuesta de Luhith subirán llorando, y levantarán grito de quebrantamiento por el camino de Horonaim». Jeremías, que reelabora el mismo oráculo, oye «Voz de clamor de Horonaim», dice que «á la bajada de Horonaim los enemigos oyeron clamor de quebranto», y extiende el lamento «desde Zoar hasta Horonaim». El emparejamiento de la subida de Luhit y la bajada de Horonaim, y el camino a Zoar en el extremo sur del mar Muerto, sitúan la población en el escarpado borde occidental de la meseta de Moab, donde los caminos suben de la orilla del mar Muerto a la altiplanicie al sur del Arnón."
    - "La población es más antigua que los profetas. La estela de Mesa, la inscripción del rey de Moab que se rebeló tras la muerte de Acab, termina con una campaña contra Hauronen: Quemós dijo a Mesa «baja, combate contra Hauronen», y él bajó; las líneas rotas que siguen parecen decir que la tomó. Más tarde Josefo enumera Oronaim entre las ciudades moabitas en poder de Alejandro Janeo y prometidas de nuevo al rey nabateo Aretas por Hircano II. Dónde estuvo no está resuelto: las prospecciones de la meseta de Kerak han propuesto varias ruinas en el escarpe occidental sobre el mar Muerto, entre ellas el-Iraq, ed-Deir, Kathrabba, Khirbet Dhubab y Khirbet Meidan, y ninguna ha sido excavada ni ha dado el nombre. Kathrabba es también candidata para Luhit, de modo que las dos no pueden ser ciertas a la vez."
    - "La región es hoy la gobernación de Karak, en Jordania, donde la carretera desde el mar Muerto en Mazraa sube el escarpe hasta Kerak, la antigua Kir-hareset, por el tipo de país que describen los profetas."
  pt:
    - "Horonaim era uma cidade de Moabe conhecida pelos lamentos dos profetas sobre aquela terra. O oráculo de Isaías vê os fugitivos de Moabe fugindo para Zoar: “pois sobem pela subida de Luíte com choro; pois no caminho para Horonaim, eles levantam um clamor de destruição”. Jeremias, que retrabalha o mesmo oráculo, ouve “O som de um clamor vem de Horonaim”, diz que “na descida de Horonaim ouviram a angústia do clamor de destruição” e estende o lamento “desde Zoar até Horonaim”. O par formado pela subida de Luíte e pela descida de Horonaim, e a estrada para Zoar, no extremo sul do mar Morto, põem a cidade na íngreme borda ocidental do planalto moabita, onde as estradas sobem da margem do mar Morto para o altiplano ao sul do Arnom."
    - "A cidade é mais antiga que os profetas. A Estela de Mesa, a inscrição do rei de Moabe que se revoltou depois da morte de Acabe, termina com uma campanha contra Hauronen: Quemós disse a Mesa: “Desce, combate contra Hauronen”, e ele desceu; as linhas quebradas que seguem parecem dizer que a tomou. Mais tarde Josefo lista Oronaim entre as cidades moabitas mantidas por Alexandre Janeu e prometidas de volta ao rei nabateu Aretas por Hircano II. Onde ficava não está resolvido: prospecções do planalto de Kerak propuseram várias ruínas na escarpa ocidental acima do mar Morto, entre elas el-Iraq, ed-Deir, Kathrabba, Khirbet Dhubab e Khirbet Meidan, e nenhuma foi escavada ou produziu o nome. Kathrabba é também candidata a Luíte, de modo que as duas não podem estar ambas certas."
    - "A região é hoje a província de Karak, na Jordânia, onde a estrada do mar Morto em Mazraa sobe a escarpa até Kerak, a antiga Quir-Haresete, por um tipo de terreno como o que os profetas descrevem."
  de:
    - "Horonajim war eine Stadt Moabs, bekannt aus den Klageliedern der Propheten über dieses Land. Jesajas Orakel sieht die Flüchtlinge Moabs nach Zoar fliehen: „Denn sie gehen gen Luhith hinan und weinen, und auf dem Wege nach Horonaim zu erhebt sich ein Jammergeschrei.“ Jeremia, der dasselbe Orakel umarbeitet, hört: „Man hört ein Geschrei zu Horonaim von Verstören und großem Jammer“, sagt, „die Feinde hören ein Jammergeschrei den Weg von Horonaim herab“, und dehnt die Klage „von Zoar an bis gen Horonaim“ aus. Die Paarung des Aufstiegs von Luhit und des Abstiegs von Horonajim und die Straße nach Zoar am Südende des Toten Meeres setzen die Stadt an den steilen Westrand der moabitischen Hochebene, wo die Wege vom Ufer des Toten Meeres zum Tafelland südlich des Arnon hinaufführen."
    - "Die Stadt ist älter als die Propheten. Die Mesa-Stele, die Inschrift des Königs von Moab, der nach Ahabs Tod aufbegehrte, endet mit einem Feldzug gegen Hauronen: Kemosch sagte zu Mesa: „Geh hinab, kämpfe gegen Hauronen“, und er ging hinab; die abgebrochenen Zeilen danach scheinen zu sagen, dass er sie einnahm. Später führt Josephus Oronaim unter den moabitischen Städten auf, die Alexander Jannäus hielt und die Hyrkanos II. dem Nabatäerkönig Aretas zurückzugeben versprach. Wo es stand, ist nicht entschieden: Surveys der Hochebene von Kerak haben mehrere Ruinen an der Westflanke über dem Toten Meer vorgeschlagen, darunter el-Iraq, ed-Deir, Kathrabba, Chirbet Dhubab und Chirbet Meidan; keine ist ausgegraben oder hat den Namen geliefert. Kathrabba ist auch ein Kandidat für Luhit, beide können also nicht zugleich recht haben."
    - "Die Gegend ist heute das Gouvernement Karak in Jordanien, wo die Straße vom Toten Meer bei Masraa die Steilstufe nach Kerak, dem antiken Kir-Heres, hinaufführt, durch jene Art Land, die die Propheten beschreiben."
  fr:
    - "Choronaïm était une ville de Moab connue par les lamentations des prophètes sur ce pays. L’oracle d’Ésaïe voit les fugitifs de Moab se sauver jusqu’à Tsoar : « ils font, en pleurant, la montée de Luchith, et ils jettent des cris de détresse sur le chemin de Choronaïm ». Jérémie, qui reprend le même oracle, entend « Des cris partent de Choronaïm », dit que « des cris de détresse retentissent à la descente de Choronaïm », et étend la lamentation « depuis Tsoar jusqu’à Choronaïm ». L’association de la montée de Luchith et de la descente de Choronaïm, et la route de Tsoar au sud de la mer Morte, placent la ville sur le bord occidental escarpé du plateau moabite, là où les routes montent de la rive de la mer Morte vers le plateau au sud de l’Arnon."
    - "La ville est plus ancienne que les prophètes. La stèle de Mescha, l’inscription du roi de Moab qui se révolta après la mort d’Achab, s’achève par une campagne contre Hauronen : Chemosh dit à Mescha « descends, combats contre Hauronen », et il descendit ; les lignes brisées qui suivent semblent dire qu’il la prit. Plus tard, Josèphe énumère Oronaïm parmi les villes moabites tenues par Alexandre Jannée et promises de nouveau au roi nabatéen Arétas par Hyrcan II. L’emplacement n’est pas fixé : des prospections du plateau de Kerak ont proposé plusieurs ruines sur l’escarpement occidental au-dessus de la mer Morte, dont el-Iraq, ed-Deir, Kathrabba, Khirbet Dhubab et Khirbet Meidan, et aucune n’a été fouillée ni n’a livré le nom. Kathrabba est aussi candidate pour Luchith, de sorte que les deux ne peuvent avoir raison à la fois."
    - "La région est aujourd’hui le gouvernorat de Karak, en Jordanie, où la route de la mer Morte à Mazraa monte l’escarpement jusqu’à Kerak, l’antique Kir-Haréseth, à travers le genre de pays que décrivent les prophètes."
  pl:
    - "Choronaim było miastem Moabu znanym z lamentów proroków nad tym krajem. Orędzie Izajasza widzi uciekinierów z Moabu uciekających do Soar: „drogą Luchytską z płaczem pójdzie, a na drodze Choronaim krzyk jako w porażce podniosą”. Jeremiasz, który przerabia to samo orędzie, słyszy: „Głos krzyku z Choronaim”, mówi, że „którędy zstępują do Choronaim, nieprzyjaciele krzyk zburzenia słyszeć będą”, i rozciąga lament „od Zoar aż do Choronaim”. Zestawienie wzniesienia Luchit i zejścia do Choronaim oraz droga do Soar na południowym krańcu Morza Martwego umieszczają miasto na stromym zachodnim skraju płaskowyżu Moabu, gdzie drogi wspinają się od brzegu Morza Martwego na wyżynę na południe od Arnonu."
    - "Miasto jest starsze niż prorocy. Stela Meszy, napis króla Moabu, który zbuntował się po śmierci Achaba, kończy się kampanią przeciw Hauronen: Kemosz powiedział Meszy: „Zstąp, walcz przeciw Hauronen”, i zstąpił; urwane wiersze, które następują, zdają się mówić, że je zdobył. Później Józef Flawiusz wymienia Oronaim wśród miast moabskich w rękach Aleksandra Janneusza i obiecanych z powrotem królowi Nabatejczyków Aretasowi przez Hirkana II. Gdzie stało, nie jest rozstrzygnięte: badania powierzchniowe płaskowyżu Karaku proponowały kilka ruin na zachodnim zboczu nad Morzem Martwym, wśród nich el-Iraq, ed-Deir, Katrabba, Chirbet Dubab i Chirbet Mejdan, a żadna nie była wykopana ani nie dostarczyła nazwy. Katrabba jest też kandydatem na Luchit, więc obie propozycje nie mogą być słuszne."
    - "Region to dziś prowincja Karak w Jordanii, gdzie droga od Morza Martwego w al-Mazra'a wspina się po skarpie do Karaku, starożytnego Kir-Chareszet, przez kraj taki, jaki opisują prorocy."
  it:
    - "Coronaim era una città di Moab nota dai lamenti dei profeti su quel paese. L’oracolo di Isaia vede i fuggiaschi di Moab fuggire a Soar: «fanno, piangendo, la salita di Luhit e mandan grida d’angoscia sulla via di Horonaim». Geremia, che rielabora lo stesso oracolo, ode: «Delle grida vengon da Horonaim», dice che «giù per la discesa di Horonaim s’ode il grido, angoscioso della rotta», ed estende il lamento «da Tsoar fino a Horonaim». L’accoppiamento della salita di Luchit e della discesa di Coronaim, e la strada per Soar all’estremità meridionale del Mar Morto, pongono la città sul ripido margine occidentale dell’altopiano moabita, dove le strade salgono dalla riva del Mar Morto al tavolato a sud dell’Arnon."
    - "La città è più antica dei profeti. La Stele di Mesa, l’iscrizione del re di Moab che si ribellò dopo la morte di Acab, termina con una campagna contro Hauronen: Camos disse a Mesa «scendi, combatti contro Hauronen», ed egli scese; le righe spezzate che seguono sembrano dire che la prese. Più tardi Giuseppe Flavio elenca Oronaim fra le città moabite tenute da Alessandro Ianneo e promesse di nuovo al re nabateo Areta da Ircano II. Dove sorgesse non è stabilito: le ricognizioni dell’altopiano di Kerak hanno proposto varie rovine sulla scarpata occidentale sopra il Mar Morto, fra cui el-Iraq, ed-Deir, Kathrabba, Khirbet Dhubab e Khirbet Meidan, e nessuna è stata scavata né ha restituito il nome. Kathrabba è candidata anche per Luchit, perciò le due non possono essere entrambe giuste."
    - "La regione è oggi il governatorato giordano di Karak, dove la strada dal Mar Morto a Mazraa sale la scarpata fino a Kerak, l’antica Kir-Cheres, attraverso il genere di paese che i profeti descrivono."
  nl:
    - "Choronaïm was een stad van Moab, bekend uit de klaagliederen van de profeten over dat land. Jesaja’s godsspraak ziet de vluchtelingen van Moab naar Zoar vluchten: “hij gaat op met geween naar den opgang van Luhith, want op den weg naar Horonaim verwekken zij een jammergeschrei”. Jeremia, die dezelfde godsspraak bewerkt, hoort: “Er is een stem des gekrijts van Horonaim”, zegt: “in den afgang van Horonaim hebben Moabs wederpartijders een jammergeschrei gehoord”, en rekt de klacht “van Zoar tot aan Horonaim”. De combinatie van de opgang van Luchit en de afgang van Choronaïm, en de weg naar Zoar aan het zuideinde van de Dode Zee, plaatsen de stad op de steile westrand van het plateau van Moab, waar de wegen van de oever van de Dode Zee omhoog klimmen naar het hoogland ten zuiden van de Arnon."
    - "De stad is ouder dan de profeten. De Mesa-stele, het opschrift van de koning van Moab die in opstand kwam na Achabs dood, eindigt met een veldtocht tegen Hauronen: Kemosj zei tegen Mesa “ga naar beneden, strijd tegen Hauronen”, en hij ging naar beneden; de gebroken regels die volgen lijken te zeggen dat hij haar innam. Later noemt Josephus Oronaim onder de Moabitische steden die Alexander Jannaeus in handen had en die Hyrcanus II aan de Nabateese koning Aretas terugbelooft. Waar zij stond, is niet vastgesteld: onderzoeken van het plateau van Kerak hebben verscheidene ruïnes op de westelijke steilrand boven de Dode Zee voorgesteld, onder meer el-Iraq, ed-Deir, Kathrabba, Khirbet Dhubab en Khirbet Meidan, en geen is opgegraven of heeft de naam opgeleverd. Kathrabba is ook kandidaat voor Luchit, dus ze kunnen niet allebei kloppen."
    - "De streek is nu het Jordaanse gouvernement Karak, waar de weg van de Dode Zee bij Mazraa de steilrand opklimt naar Kerak, het oude Kir-Hareset, door het soort land dat de profeten beschrijven."
  cs:
    - "Choronajim bylo město Moábu známé z nářků proroků nad touto zemí. Izajášův výrok vidí uprchlíky z Moábu prchající do Soaru: „nebo cestou Luchitskou s pláčem půjde, a kudyž se chodí k Choronaim, křik hrozný vydávati budou“. Jeremjáš, který tentýž výrok přepracovává, slyší: „Hlas žalostný z Choronaim“, praví, že „kudyž se chodí k Choronaim, nepřátelé křik hrozný slyšeti budou“, a rozšiřuje nářek „od Ségor až do Choronaim“. Dvojice výstupu Lúchitu a sestupu Choronajim a cesta do Soaru na jižním konci Mrtvého moře kladou město na strmý západní okraj moábské náhorní plošiny, kde cesty stoupají od břehu Mrtvého moře na vysočinu jižně od Arnonu."
    - "Město je starší než proroci. Mešova stéla, nápis krále Moábu, který se vzbouřil po Achabově smrti, končí tažením proti Hauronenu: Kemoš řekl Mešovi „Sestup, bojuj proti Hauronenu“, a on sestoupil; roztříštěné řádky, které následují, zdají se říkat, že je dobyl. Později Josephus uvádí Oronaim mezi moábskými městy drženými Alexandrem Jannaiem a slíbenými zpět nabatejskému králi Aretovi Hyrkánem II. Kde stálo, není rozhodnuto: průzkumy planiny Kerak navrhly několik zřícenin na západním svahu nad Mrtvým mořem, mezi nimi el-Iraq, ed-Deir, Kathrabba, Khirbet Dhubab a Khirbet Meidan, a žádná nebyla vykopána ani nepřinesla jméno. Kathrabba je také kandidátem na Lúchit, takže obě nemohou být správná."
    - "Oblast je dnes jordánská gubernie Karak, kde cesta od Mrtvého moře v Mazraa stoupá srázem ke Karaku, starověkému Kír-chareset, krajinou, jakou proroci popisují."
scripture:
  - Isa.15.5
  - Jer.48.3
  - Jer.48.5
  - Jer.48.34
