body:
  en:
    - "Makkedah was a Canaanite town in the Shephelah of Judah, remembered for a cave. After the battle at Gibeon Joshua's men chased the five Amorite kings “to Azekah, and unto Makkedah”, and the kings “hid themselves in a cave at Makkedah”. Joshua had the cave's mouth blocked with great stones until the pursuit was over, then brought the kings out, had his captains set their feet on their necks, killed them and hanged them on five trees till evening, and at sunset threw the bodies back into the cave and sealed it with stones “which remain until this very day”. The same day he took Makkedah and did to its king “as he did unto the king of Jericho”; the king is counted among the thirty-one. Joshua's town list sets Makkedah in the Shephelah with Gederoth, Beth-dagon and Naamah."
    - "That is all the Bible says, and the site is disputed; the map gives five candidates. Eusebius placed Makkedah eight Roman miles east of Eleutheropolis (Beit Guvrin), and on that basis David Dorsey in 1980 proposed Khirbet el-Qom, a village site some 12 km west of Hebron on the road from Lachish, with Iron Age remains and caves to fit. Khirbet el-Qom is better known for its eighth-century BC tomb inscriptions, one of which blesses a man by Yahweh and “his asherah”. Khirbet Beit Maqdum beside it may preserve the name. Older proposals are Tell Beit Mirsim to the south-west, excavated by Albright, and the mounds of Tel Goded and Tell Bornat nearer Lachish."
    - "Nothing has been dug at el-Qom with Makkedah in view, and the question stays open. Today the candidates lie in the low hills between Hebron and Lachish, Khirbet el-Qom on the West Bank side of the Green Line and Tel Goded and Tell Bornat on the Israeli side."
  ru:
    - "Македа была ханаанским городом в Шефеле Иудиной, памятным своей пещерой. После битвы при Гаваоне воины Иисуса Навина преследовали пятерых царей Аморрейских «до Азека и до Македа», и цари «скрылись в пещере в Македе». Иисус велел завалить вход большими камнями, пока не кончится погоня, затем вывел царей, велел вождям поставить ноги на их шеи, убил их и повесил на пяти деревах до вечера, а на закате бросил тела обратно в пещеру и завалил её камнями, «которые там даже до сего дня». В тот же день он взял Македу и поступил с её царём «так же, как поступил с царем Иерихонским»; царь её числится среди тридцати одного. Список городов Иисуса Навина ставит Македу в Шефеле рядом с Гедерофом, Беф-Дагоном и Наемой."
    - "Это всё, что говорит Библия, а место спорно; карта даёт пять кандидатов. Евсевий помещал Македу в восьми римских милях к востоку от Элевтерополя (Бейт-Гуврина), и на этом основании Дэвид Дорси в 1980 году предложил Хирбет-эль-Ком — поселение примерно в 12 км к западу от Хеврона на дороге из Лахиса, с подходящими остатками железного века и пещерами. Хирбет-эль-Ком больше известен гробничными надписями VIII века до н. э., одна из которых благословляет человека Яхве и «его ашерой». Соседний Хирбет-Бейт-Макдум, возможно, хранит имя. Более старые предложения — Телль-Бейт-Мирсим к юго-западу, раскопанный Олбрайтом, и холмы Тель-Годед и Телль-Борнат ближе к Лахису."
    - "В Эль-Коме никто не копал в поисках Македы, и вопрос остаётся открытым. Сегодня кандидаты лежат в холмах между Хевроном и Лахисом: Хирбет-эль-Ком — на Западном берегу, Тель-Годед и Телль-Борнат — по израильскую сторону Зелёной линии."
  uk:
    - "Македа була ханаанським містом Шефели Юди, пам’ятним печерою. Після битви при Гаваоні люди Ісуса Навина гнали п’ятьох аморейських царів «аж до Азека й Македа», і царі «поховались у печері під Македою». Ісус звелів закрити отвір печери великим камінням, поки не скінчилося переслідування, потім вивів царів, звелів своїм начальникам поставити ноги на їхні шиї, убив їх і повісив на п’яти деревах до вечора, а на заході сонця кинув тіла назад до печери й запечатав її камінням, де «вони лежать і по сей день». Того самого дня він узяв Македу і вчинив з її царем так, «як із царем Ерихонським»; цар зарахований до тридцяти одного. Перелік міст Ісуса Навина розміщує Македу в Шефелі разом з Гедеротом, Бет-Дагоном і Наамою."
    - "Це все, що каже Біблія, і місце спірне; мапа дає п’ять кандидатів. Євсевій розміщував Македу за вісім римських миль на схід від Елевтерополя (Бейт-Гуврін), і на цій підставі Девід Дорсі 1980 р. запропонував Хірбет-ель-Ком, селище приблизно за 12 км на захід від Хеврона на дорозі від Лахіша, із залишками залізної доби та печерами, що пасують. Хірбет-ель-Ком краще відомий написами на гробницях VIII ст. до н. е., один із яких благословляє чоловіка Яхве та «його ашерою». Хірбет-Бейт-Макдум поруч, можливо, зберігає назву. Давніші пропозиції — Телль-Бейт-Мірсім на південному заході, розкопаний Олбрайтом, і пагорби Тель-Годед та Телль-Борнат ближче до Лахіша."
    - "В ель-Комі нічого не копали з огляду на Македу, і питання залишається відкритим. Сьогодні кандидати лежать у низьких пагорбах між Хевроном і Лахішем: Хірбет-ель-Ком з боку Західного берега від Зеленої лінії, а Тель-Годед і Телль-Борнат — з ізраїльського боку."
  es:
    - "Maceda era una ciudad cananea de la Sefelá de Judá, recordada por una cueva. Tras la batalla de Gabaón, los hombres de Josué persiguieron a los cinco reyes amorreos «hasta Azeca y Maceda», y los reyes «se escondieron en una cueva en Maceda». Josué hizo bloquear la boca de la cueva con grandes piedras hasta que terminó la persecución; luego sacó a los reyes, hizo que sus capitanes pusieran los pies sobre sus cuellos, los mató y los colgó de cinco árboles hasta la tarde, y a la puesta del sol arrojó los cuerpos de nuevo a la cueva y la selló con «grandes piedras á la boca de la cueva, hasta hoy». Ese mismo día tomó Maceda e hizo a su rey «como había hecho al rey de Jericó»; el rey se cuenta entre los treinta y uno. La lista de ciudades de Josué sitúa Maceda en la Sefelá con Gederot, Bet-dagón y Naama."
    - "Eso es todo lo que dice la Biblia, y el sitio se discute; el mapa da cinco candidatos. Eusebio situó Maceda a ocho millas romanas al este de Eleuterópolis (Beit Guvrin), y sobre esa base David Dorsey propuso en 1980 Khirbet el-Qom, un sitio de aldea a unos 12 km al oeste de Hebrón, en el camino de Laquis, con restos de la Edad del Hierro y cuevas que concuerdan. Khirbet el-Qom es más conocido por sus inscripciones de tumbas del siglo VIII a. C., una de las cuales bendice a un hombre por Yahveh y «su asera». Khirbet Beit Maqdum, junto a él, puede conservar el nombre. Propuestas más antiguas son Tell Beit Mirsim, al sudoeste, excavado por Albright, y los montículos de Tel Goded y Tell Bornat, más cerca de Laquis."
    - "En el-Qom no se ha excavado nada con Maceda en mente, y la cuestión sigue abierta. Hoy los candidatos se encuentran en las colinas bajas entre Hebrón y Laquis, Khirbet el-Qom en el lado cisjordano de la Línea Verde, y Tel Goded y Tell Bornat en el lado israelí."
  pt:
    - "Maquedá era uma cidade cananeia na Sefelá de Judá, lembrada por uma caverna. Depois da batalha de Gibeão, os homens de Josué perseguiram os cinco reis amorreus “até Azeca e Maqueda”, e os reis “se esconderam na caverna em Maqueda”. Josué mandou bloquear a entrada da caverna com grandes pedras até o fim da perseguição, depois fez sair os reis, mandou seus chefes pôr-lhes os pés sobre os pescoços, matou-os e pendurou-os em cinco árvores até a tarde, e ao pôr do sol lançou os corpos de volta à caverna e a selou com pedras “que permanecem até o dia de hoje”. No mesmo dia tomou Maquedá e fez ao seu rei “como havia feito ao rei de Jericó”; o rei é contado entre os trinta e um. A lista de cidades de Josué põe Maquedá na Sefelá com Gederote, Bete-Dagom e Naamá."
    - "É tudo o que a Bíblia diz, e o sítio é disputado; o mapa dá cinco candidatos. Eusébio situou Maquedá a oito milhas romanas a leste de Eleuterópolis (Bet Guvrin), e com base nisso David Dorsey propôs em 1980 Khirbet el-Qom, um sítio de aldeia a uns 12 km a oeste de Hebrom, na estrada de Laquis, com vestígios da Idade do Ferro e cavernas que combinam. Khirbet el-Qom é mais conhecida por suas inscrições de túmulo do século VIII a.C., uma das quais abençoa um homem por Javé e “sua asherá”. Khirbet Beit Maqdum, ao lado, pode preservar o nome. Propostas mais antigas são Tell Beit Mirsim, a sudoeste, escavada por Albright, e os montículos de Tel Goded e Tell Bornat, mais perto de Laquis."
    - "Nada foi escavado em el-Qom com Maquedá em vista, e a questão permanece em aberto. Hoje os candidatos situam-se nas colinas baixas entre Hebrom e Laquis, Khirbet el-Qom do lado cisjordaniano da Linha Verde e Tel Goded e Tell Bornat do lado israelense."
  de:
    - "Makkeda war eine kanaanäische Stadt in der Schefela Judas, durch eine Höhle in Erinnerung geblieben. Nach der Schlacht bei Gibeon jagten Josuas Männer die fünf amoritischen Könige „bis gen Aseka und Makkeda“, und die Könige „hatten sich versteckt in die Höhle zu Makkeda“. Josua ließ den Eingang der Höhle mit großen Steinen verschließen, bis die Verfolgung vorüber war, ließ dann die Könige herausbringen, seine Obersten ihre Füße auf deren Hälse setzen, tötete sie und hängte sie bis zum Abend an fünf Bäume, ließ sie bei Sonnenuntergang wieder in die Höhle werfen und verschloss sie mit Steinen, „die sind noch da bis auf diesen Tag“. Am selben Tag nahm er Makkeda ein und „tat dem König zu Makkeda, wie er dem König zu Jericho getan hatte“; der König zählt zu den einunddreißig. Josuas Städteliste setzt Makkeda in die Schefela, mit Gederot, Bet-Dagon und Naama."
    - "Das ist alles, was die Bibel sagt, und die Lage ist umstritten; die Karte nennt fünf Kandidaten. Eusebius setzte Makkeda acht römische Meilen östlich von Eleutheropolis (Bet Guvrin) an, und daraufhin schlug David Dorsey 1980 Khirbet el-Qom vor, einen Siedlungsort etwa 12 km westlich von Hebron an der Straße von Lachisch, mit eisenzeitlichen Resten und Höhlen, die passen. Khirbet el-Qom ist besser bekannt für seine Grabinschriften des 8. Jahrhunderts v. Chr., von denen eine einen Mann durch Jahwe und „seine Aschera“ segnet. Khirbet Beit Maqdum daneben bewahrt vielleicht den Namen. Ältere Vorschläge sind Tell Beit Mirsim im Südwesten, von Albright ausgegraben, und die Hügel Tel Goded und Tell Bornat näher bei Lachisch."
    - "Bei el-Qom wurde mit Blick auf Makkeda nichts gegraben, und die Frage bleibt offen. Heute liegen die Kandidaten in den niedrigen Hügeln zwischen Hebron und Lachisch, Khirbet el-Qom auf der Westjordanland-Seite der Grünen Linie und Tel Goded und Tell Bornat auf der israelischen Seite."
  fr:
    - "Makkéda était une ville cananéenne de la Shéphéla de Juda, dont on se souvient pour une caverne. Après la bataille de Gabaon, les hommes de Josué poursuivirent les cinq rois amoréens « jusqu’à Azéka et à Makkéda », et les rois « se cachèrent dans une caverne à Makkéda ». Josué fit boucher l’entrée de la caverne avec de grosses pierres jusqu’à la fin de la poursuite, puis fit sortir les rois, fit poser à ses chefs le pied sur leur cou, les tua et les pendit à cinq arbres jusqu’au soir, et au coucher du soleil jeta les corps dans la caverne et la scella de pierres « qui y sont demeurées jusqu’à ce jour ». Le même jour il prit Makkéda et traita son roi « comme il avait traité le roi de Jéricho » ; ce roi est compté parmi les trente et un. La liste des villes de Josué place Makkéda dans la Shéphéla avec Guedéroth, Beth-Dagon et Naama."
    - "C’est tout ce que dit la Bible, et le site est discuté ; la carte donne cinq candidats. Eusèbe plaçait Makkéda à huit milles romains à l’est d’Éleuthéropolis (Beit Guvrin), et sur cette base David Dorsey proposa en 1980 Khirbet el-Qom, site de village à quelque 12 km à l’ouest d’Hébron sur la route de Lakis, avec des vestiges de l’âge du Fer et des grottes qui conviennent. Khirbet el-Qom est mieux connu pour ses inscriptions de tombes du VIIIe siècle av. J.-C., dont l’une bénit un homme par Yahvé et « son ashéra ». Khirbet Beit Maqdum, à côté, conserve peut-être le nom. Les propositions plus anciennes sont Tell Beit Mirsim, au sud-ouest, fouillé par Albright, et les tertres de Tel Goded et de Tell Bornat, plus près de Lakis."
    - "Rien n’a été fouillé à el-Qom en vue de Makkéda, et la question reste ouverte. Aujourd’hui, les candidats se trouvent dans les basses collines entre Hébron et Lakis, Khirbet el-Qom du côté cisjordanien de la ligne verte et Tel Goded et Tell Bornat du côté israélien."
  it:
    - "Makkeda era una città cananea nella Sefela di Giuda, ricordata per una grotta. Dopo la battaglia presso Gabaon gli uomini di Giosuè inseguirono i cinque re amorei «fino ad Azeka e a Makkeda», e i re «s’erano nascosti nella spelonca di Makkeda». Giosuè fece bloccare l’imboccatura della grotta con grosse pietre finché l’inseguimento fu finito, poi fece uscire i re, fece mettere ai suoi capi il piede sul loro collo, li uccise e li appese a cinque alberi fino a sera, e al tramonto gettò i corpi di nuovo nella grotta e la sigillò con pietre «le quali vi son rimaste fino al dì d’oggi». Lo stesso giorno prese Makkeda e trattò il suo re «come avea trattato il re di Gerico»; il re è contato tra i trentuno. L’elenco delle città di Giosuè pone Makkeda nella Sefela con Ghederòt, Bet-Dagon e Naama."
    - "Questo è tutto ciò che la Bibbia dice, e il sito è discusso; la mappa dà cinque candidati. Eusebio collocava Makkeda a otto miglia romane a est di Eleuteropoli (Bet Guvrin), e su questa base David Dorsey nel 1980 propose Khirbet el-Qom, un sito di villaggio a circa 12 km a ovest di Ebron sulla strada da Lachis, con resti dell’età del Ferro e grotte adatte. Khirbet el-Qom è più nota per le sue iscrizioni tombali dell’VIII secolo a.C., una delle quali benedice un uomo per Yahweh e «la sua asherah». Khirbet Beit Maqdum, accanto, può conservare il nome. Proposte più antiche sono Tell Beit Mirsim a sud-ovest, scavata da Albright, e i tell di Tel Goded e Tell Bornat più vicini a Lachis."
    - "A el-Qom nulla è stato scavato avendo in vista Makkeda, e la questione resta aperta. Oggi i candidati giacciono nelle basse colline tra Ebron e Lachis, Khirbet el-Qom dal lato cisgiordano della Linea Verde e Tel Goded e Tell Bornat dal lato israeliano."
  pl:
    - "Makkeda było kananejskim miastem w Szefeli Judy, zapamiętanym z powodu jaskini. Po bitwie pod Gibeonem ludzie Jozuego ścigali pięciu królów amorejskich „aż do Aseka i aż do Maceda”, a królowie „skryli się w jaskinią przy Maceda”. Jozue kazał zawalić wejście do jaskini wielkimi kamieniami do końca pościgu, potem wyprowadził królów, kazał swoim dowódcom postawić stopy na ich karkach, zabił ich i powiesił na pięciu drzewach do wieczora, a o zachodzie słońca wrzucił ciała z powrotem do jaskini i zamknął ją kamieniami, „które tam są jeszcze i do dnia tego”. Tego samego dnia zdobył Makkedę i uczynił jej królowi, „jako uczynił królowi Jerycha”; król ten jest liczony wśród trzydziestu jeden. Lista miast u Jozuego umieszcza Makkedę w Szefeli z Gederot, Bet-Dagon i Naamą."
    - "Tyle mówi Biblia, a położenie jest sporne; mapa podaje pięciu kandydatów. Euzebiusz umieszczał Makkedę osiem mil rzymskich na wschód od Eleuteropolis (Bet Guvrin), i na tej podstawie David Dorsey w 1980 r. zaproponował Khirbet el-Qom, stanowisko wsi około 12 km na zachód od Hebronu przy drodze z Lakisz, z pozostałościami z epoki żelaza i jaskiniami pasującymi do opowieści. Khirbet el-Qom jest lepiej znane z inskrypcji grobowych z VIII w. p.n.e., z których jedna błogosławi człowieka przez Jahwe i „jego aszerę”. Khirbet Beit Maqdum obok może zachowywać nazwę. Starsze propozycje to Tell Beit Mirsim na południowym zachodzie, wykopywany przez Albrighta, oraz kopce Tel Goded i Tell Bornat bliżej Lakisz."
    - "W el-Qom nic nie wykopywano z myślą o Makkedzie, a sprawa pozostaje otwarta. Dziś kandydaci leżą w niskich wzgórzach między Hebronem a Lakisz, Khirbet el-Qom po zachodniobrzeżnej stronie Zielonej Linii, a Tel Goded i Tell Bornat po stronie izraelskiej."
  nl:
    - "Makkeda was een Kanaänitische stad in de Sefela van Juda, bekend om een grot. Na de slag bij Gibeon achtervolgden Jozua's mannen de vijf Amorietische koningen “tot Azeka en tot Makkeda toe”, en de koningen hadden zich “verborgen in de spelonk bij Makkeda”. Jozua liet de ingang van de grot met grote stenen afsluiten tot de achtervolging voorbij was, haalde de koningen toen naar buiten, liet zijn aanvoerders hun voeten op hun nekken zetten, doodde hen en hing hen tot de avond aan vijf bomen, en wierp bij zonsondergang de lichamen terug in de grot en verzegelde die met stenen die er zijn “tot op dezen zelven dag”. Dezelfde dag nam hij Makkeda in en deed de koning ervan “gelijk als hij den koning van Jericho gedaan had”; de koning wordt tot de eenendertig gerekend. Jozua's lijst van steden plaatst Makkeda in de Sefela met Gederot, Beth-Dagon en Naäma."
    - "Dat is alles wat de Bijbel zegt, en de ligging is omstreden; de kaart geeft vijf kandidaten. Eusebius plaatste Makkeda acht Romeinse mijlen ten oosten van Eleutheropolis (Beit Guvrin), en op grond daarvan stelde David Dorsey in 1980 Khirbet el-Qom voor, een dorpsterrein zo'n 12 km ten westen van Hebron aan de weg vanuit Lachis, met resten uit de ijzertijd en passende grotten. Khirbet el-Qom is beter bekend om zijn grafinscripties uit de achtste eeuw v.Chr., waarvan één een man zegent door Jahweh en “zijn asjera”. Khirbet Beit Maqdum ernaast bewaart misschien de naam. Oudere voorstellen zijn Tell Beit Mirsim in het zuidwesten, door Albright opgegraven, en de heuvels Tel Goded en Tell Bornat dichter bij Lachis."
    - "Bij el-Qom is niets opgegraven met Makkeda in gedachten, en de vraag blijft open. Tegenwoordig liggen de kandidaten in de lage heuvels tussen Hebron en Lachis, Khirbet el-Qom aan de Westoever-zijde van de Groene Lijn en Tel Goded en Tell Bornat aan de Israëlische zijde."
  cs:
    - "Makeda bylo kanaánské město v judské Šefele, připomínané pro jeskyni. Po bitvě u Gibeonu Jozuovi muži honili pět amorejských králů „až do Azeka a až do Maceda“ a králové „skryli se v jeskyni při Maceda“. Jozue dal otvor jeskyně zatarasit velkými kameny, dokud pronásledování neskončilo, pak krále vyvedl, dal svým velitelům šlapat jim po hrdlech, zabil je a pověsil na pěti stromech do večera a při západu slunce hodil těla zpět do jeskyně a zapečetil ji kamením, „kteréž jest tu až do tohoto dne“. Téhož dne dobyl Makedu a učinil jejímu králi „jako učinil králi Jericha“; král se počítá mezi jednatřicet. Jozuův seznam měst klade Makedu do Šefely s Gederótem, Bét-dagonem a Naamou."
    - "To je vše, co Bible praví, a poloha je sporná; mapa uvádí pět kandidátů. Eusebius kladl Makedu osm římských mil východně od Eleutheropole (Bejt Guvrin) a na tomto základě navrhl David Dorsey roku 1980 Khirbet el-Qom, místo vesnice asi 12 km západně od Hebronu při cestě z Lachiše, s pozůstatky z doby železné a jeskyněmi, které by odpovídaly. Khirbet el-Qom je lépe známý svými hrobovými nápisy z 8. století př. n. l., z nichž jeden žehná muži u Jahve a „jeho ašery“. Khirbet Beit Maqdum vedle něj může uchovávat jméno. Starší návrhy jsou Tell Beit Mirsim na jihozápadě, vykopaný Albrightem, a pahorky Tel Goded a Tell Bornat blíže Lachiši."
    - "V el-Qom nic nebylo vykopáváno s ohledem na Makedu a otázka zůstává otevřená. Dnes kandidáti leží v nízkých pahorcích mezi Hebronem a Lachišem, Khirbet el-Qom na straně Západního břehu od Zelené linie a Tel Goded a Tell Bornat na izraelské straně."
  sv:
    - "Mackeda var en kanaaneisk stad i Judas Shefela, ihågkommen för en grotta. Efter slaget vid Gibeon jagade Josuas män de fem amoreiska konungarna ”ända till Aseka och Mackeda”, och konungarna ”gömde sig i grottan vid Mackeda”. Josua lät blockera grottans mynning med stora stenar tills förföljelsen var över, förde sedan ut konungarna, lät sina hövdingar sätta fötterna på deras nackar, dräpte dem och hängde dem på fem träd till kvällen, och vid solnedgången kastade han tillbaka kropparna i grottan och förseglade den med stenar, ”som ligga kvar där ännu i denna dag”. Samma dag intog han Mackeda och gjorde med dess konung ”på samma sätt som han hade gjort med konungen i Jeriko”; konungen räknas bland de trettioen. Josuas stadsförteckning förlägger Mackeda i Shefela med Gederot, Bet-Dagon och Naama."
    - "Det är allt Bibeln säger, och platsen är omstridd; kartan ger fem kandidater. Eusebios förlade Mackeda åtta romerska mil öster om Eleutheropolis (Beit Guvrin), och på den grunden föreslog David Dorsey 1980 Khirbet el-Qom, en bosättningsplats omkring 12 km väster om Hebron vid vägen från Lakish, med lämningar från järnåldern och grottor som passar. Khirbet el-Qom är bättre känt för sina gravinskrifter från 700-talet f.Kr., av vilka en välsignar en man genom Jahve och ”hans asherah”. Khirbet Beit Maqdum intill kan bevara namnet. Äldre förslag är Tell Beit Mirsim i sydväst, utgrävd av Albright, och kullarna Tel Goded och Tell Bornat närmare Lakish."
    - "Ingenting har grävts vid el-Qom med Mackeda i sikte, och frågan förblir öppen. I dag ligger kandidaterna i de låga kullarna mellan Hebron och Lakish, Khirbet el-Qom på Västbankssidan av Gröna linjen och Tel Goded och Tell Bornat på den israeliska sidan."
  nb:
    - "Makkeda var en kanaanittisk by i Sjefela i Juda, husket for en hule. Etter slaget ved Gibeon forfulgte Josvas menn de fem amorittiske kongene «helt til Aseka og Makkeda», og kongene «skjulte sig i hulen ved Makkeda». Josva lot hulens munning stenge med store stener til forfølgelsen var over, førte så kongene ut, lot sine høvdinger sette foten på nakken deres, drepte dem og hengte dem på fem trær til aften, og ved solnedgang kastet han likene tilbake i hulen og forseglet den med stener, «som ligger der den dag idag». Samme dag inntok han Makkeda og gjorde med dens konge «som han hadde gjort med kongen i Jeriko»; kongen regnes blant de en og tretti. Josvas byliste setter Makkeda i Sjefela sammen med Gederot, Bet-Dagon og Naama."
    - "Det er alt Bibelen sier, og stedet er omstridt; kartet gir fem kandidater. Eusebius plasserte Makkeda åtte romerske mil øst for Eleutheropolis (Bet Guvrin), og på det grunnlaget foreslo David Dorsey i 1980 Khirbet el-Qom, et landsbysted omkring 12 km vest for Hebron ved veien fra Lakisj, med levninger fra jernalderen og huler som passer. Khirbet el-Qom er bedre kjent for sine gravinnskrifter fra 700-tallet f.Kr., hvorav én velsigner en mann ved Jahve og «hans asjera». Khirbet Beit Maqdum ved siden av kan bevare navnet. Eldre forslag er Tell Beit Mirsim i sørvest, utgravd av Albright, og haugene Tel Goded og Tell Bornat nærmere Lakisj."
    - "Ingenting er gravd ved el-Qom med Makkeda i sikte, og spørsmålet forblir åpent. I dag ligger kandidatene i de lave åsene mellom Hebron og Lakisj, Khirbet el-Qom på Vestbreddens side av Den grønne linjen og Tel Goded og Tell Bornat på den israelske siden."
  tl:
    - "Ang Maceda ay bayang Cananeo sa Sephela ng Juda, naaalala dahil sa yungib. Pagkatapos ng labanan sa Gabaon, hinabol ng mga tauhan ni Josue ang limang haring Amorrheo “hanggang sa Azeca, at sa Maceda”, at ang mga hari ay “nagsipagkubli sa yungib sa Maceda”. Ipinasara ni Josue ang bunganga ng yungib ng malalaking bato hanggang matapos ang paghabol, saka inilabas ang mga hari, ipinaapak sa mga kapitan ang paa sa kanilang leeg, pinatay sila at ibinitin sa limang puno hanggang gabi, at sa paglubog ng araw ay ibinalik ang mga bangkay sa yungib at tinakpan ito ng mga batong naroon pa “hanggang sa araw na ito”. Sinakop niya ang Maceda nang araw ding iyon at ginawa sa hari nito “ang gaya ng kaniyang ginawa sa hari ng Jerico”; kabilang ang hari sa tatlumpu't isa. Inilalagay ng talaan ng mga bayan ni Josue ang Maceda sa Sephela kasama ng Gederoth, Beth-dagon at Naama."
    - "Iyon lamang ang sinasabi ng Biblia, at pinagtatalunan ang pook; nagbibigay ang mapa ng limang kandidato. Inilagay ni Eusebio ang Maceda walong milyang Romano sa silangan ng Eleutheropolis (Beit Guvrin), at batay rito ay iminungkahi ni David Dorsey noong 1980 ang Khirbet el-Qom, isang pook-nayon mga 12 km sa kanluran ng Hebron sa daan mula Lachis, na may mga labi ng Panahon ng Bakal at mga yungib na akma. Mas kilala ang Khirbet el-Qom dahil sa mga inskripsiyon ng libingan nito noong ika-8 siglo BK, na ang isa ay nagpapala sa isang tao kay Yahweh at sa “kaniyang asherah”. Maaaring nag-iingat ng pangalan ang Khirbet Beit Maqdum sa tabi nito. Ang mas lumang mga mungkahi ay ang Tell Beit Mirsim sa timog-kanluran, na hinukay ni Albright, at ang mga burol ng Tel Goded at Tell Bornat na mas malapit sa Lachis."
    - "Wala pang nahukay sa el-Qom na may Maceda sa isip, at bukas ang tanong. Ngayon ang mga kandidato ay nasa mababang mga burol sa pagitan ng Hebron at Lachis, ang Khirbet el-Qom sa panig ng West Bank ng Green Line at ang Tel Goded at Tell Bornat sa panig ng Israel."
  da:
    - "Makkeda var en kana'anæisk by i Judas Sjefela, husket for en hule. Efter slaget ved Gibeon forfulgte Josvas mænd de fem amoritiske konger »indtil Aseka og indtil Makkeda«, og kongerne havde »skjult sig i den Hule ved Makkeda«. Josva lod hulens munding spærre med store sten, til forfølgelsen var forbi, bragte derpå kongerne ud, lod sine hærførere sætte deres fødder på deres halse, dræbte dem og hængte dem på fem træer til aften, og ved solnedgang kastede han ligene tilbage i hulen og lukkede den med sten, »hvor de ere indtil denne Dag«. Samme dag indtog han Makkeda og gjorde mod dens konge, »ligesom han gjorde mod Kongen af Jeriko«; kongen regnes blandt de enogtredive. Josvas byliste placerer Makkeda i Sjefela med Gederot, Bet-Dagon og Naama."
    - "Det er alt, Bibelen siger, og stedet er omstridt; kortet giver fem kandidater. Eusebius placerede Makkeda otte romerske mil øst for Eleutheropolis (Beit Guvrin), og på det grundlag foreslog David Dorsey i 1980 Khirbet el-Qom, en bosættelsesplads omkring 12 km vest for Hebron på vejen fra Lakisj, med levn fra jernalderen og huler, der passer. Khirbet el-Qom er bedre kendt for sine gravindskrifter fra 700-tallet f.Kr., hvoraf én velsigner en mand ved Jahve og »hans asjera«. Khirbet Beit Maqdum ved siden af kan bevare navnet. Ældre forslag er Tell Beit Mirsim mod sydvest, udgravet af Albright, og højene Tel Goded og Tell Bornat nærmere Lakisj."
    - "Intet er gravet ved el-Qom med Makkeda for øje, og spørgsmålet forbliver åbent. I dag ligger kandidaterne i de lave bakker mellem Hebron og Lakisj, Khirbet el-Qom på Vestbredds-siden af Den Grønne Linje og Tel Goded og Tell Bornat på den israelske side."
  sr:
    - "Макида је био ханаански град у јудејској Сефели, запамћен по пећини. После битке код Гаваона Исусови људи гонили су пет аморејских царева „до Азике и до Макиде“, а цареви су „сакрише се у пећину код Макиде“. Исус је наредио да се врата пећине затворе великим камењем док потера не заврши, затим је извео цареве, наредио заповедницима да им ставе ноге на вратове, погубио их и обесио на пет дрвета до вечери, а о заходу сунца бацио тела натраг у пећину и затворио је камењем које „оста онде до данас“. Истог дана заузео је Макиду и учинио с њеним царем „као што учини с царем јерихонским“; тај цар се убраја међу тридесет и једног. Исусов списак градова смешта Макиду у Сефелу уз Гедирот, Вет-Дагон и Наму."
    - "То је све што Библија каже, а налазиште је спорно; мапа даје пет кандидата. Јевсевије је сместио Макиду осам римских миља источно од Елевтеропоља (Бејт Гуврин), и на тој основи Дејвид Дорси је 1980. предложио Хирбет ел-Ком, село око 12 км западно од Хеврона на путу од Лахиса, с остацима из гвозденог доба и пећинама које одговарају. Хирбет ел-Ком је познатији по гробним натписима из VIII века п. н. е., од којих један благосиља човека Јахвеом и „његовом ашером“. Хирбет Бајт Макдум поред њега можда чува име. Старији предлози су Тел Бејт Мирсим на југозападу, који је ископавао Олбрајт, и хумке Тел Годед и Тел Борнат ближе Лахису."
    - "У Хирбет ел-Кому се ништа није копало с погледом на Макиду, и питање остаје отворено. Данас кандидати леже у ниским брдима између Хеврона и Лахиса, Хирбет ел-Ком на страни Западне обале од Зелене линије, а Тел Годед и Тел Борнат на израелској страни."
