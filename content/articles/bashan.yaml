body:
  en:
    - 'Bashan is the broad tableland east of the Sea of Galilee and north of the Yarmuk, stretching from Mount Hermon and Geshur in the north-west to the hills of the Hauran in the east; its rich volcanic soil made it the granary and pasture of the region. Its cities were Ashtaroth and Edrei, the royal seats of Og, Salcah on the Hauran, and Golan, a city of refuge. The Bible speaks of its oaks, its "rams of the breed of Bashan", its "strong bulls" and its "kine of Bashan", Amos'' name for the pampered women of Samaria, and of "the hill of Bashan", perhaps Hermon or the volcanic cones of the Hauran.'
    - 'Og, "king of Bashan", came out against Israel at Edrei and was destroyed, and his land, "all the region of Argob" with "threescore cities" fenced with high walls, fell to the half-tribe of Manasseh; Jair took Argob and named the towns Havoth-jair. Og alone "remained of the remnant of giants", and his iron bedstead was shown at Rabbah. Solomon''s officer in Ramoth-gilead governed Argob, and the Levites held Golan and Ashtaroth. Hazael of Damascus took Bashan with Gilead, and in 732 BC Tiglath-pileser III, taking Damascus, made it Assyrian. The prophets promise that Israel will feed again "on Carmel and Bashan".'
    - 'In Greek and Roman times the land was known by its districts: Gaulanitis in the west, Batanaea, the old Bashan, in the centre, Trachonitis on the lava fields of the Leja and Auranitis in the Hauran. Augustus gave them to Herod the Great, and after him they were the tetrarchy of Philip, named by Luke as tetrarch "of Ituraea and of the region of Trachonitis"; Philip rebuilt Paneas as Caesarea Philippi, where Peter confessed Jesus to be the Christ. Agrippa II held them until his death towards the end of the first century AD, after which they passed to the province of Syria; later the Hauran was transferred to Arabia, whose capital Bostra lay at its edge.'
    - "The black basalt villages and churches of the Hauran, many of them from the Roman and Byzantine centuries, are among the best preserved of late antiquity. Today Bashan is divided: the Golan Heights, taken by Israel from Syria in 1967 and annexed in 1981, a step not recognised by the United Nations; and the Syrian provinces of Daraa, the ancient Edrei, and Suwayda in the Hauran."
  ru:
    - "Васан — широкое плоскогорье к востоку от Галилейского моря и к северу от Ярмука, простирающееся от горы Ермон и Гесура на северо-западе до холмов Аврана на востоке; его тучная вулканическая почва сделала его житницей и пастбищем края. Его городами были Астароф и Едреи, столицы Ога, Салха на Авране и Голан, город убежища. Библия говорит о его дубах и овнах, о тучных быках Васанских, обступивших страдальца в псалме («тучные Васанские окружили меня»), а «телицы Васанские» у Амоса — изнеженные женщины Самарии; псалом восклицает: «Гора Божия — гора Васанская!» — быть может, это Ермон или вулканические конусы Аврана."
    - "Ог, «царь Васанский», вышел против Израиля при Едреи и был истреблён, а его землю, «всю область Аргов» с шестьюдесятью городами, укреплёнными высокими стенами, Моисей отдал половине колена Манассиина; Иаир взял Аргов и назвал селения своим именем. Один Ог «оставался из Рефаимов», и его железный одр показывали в Равве. Приставник Соломона в Рамофе Галаадском управлял Арговом, а левиты держали Голан и Астароф. Азаил Дамасский отнял Васан вместе с Галаадом, а в 732 г. до н. э. Феглаффелласар III, взяв Дамаск, сделал его ассирийским. Пророки обещают, что Израиль снова будет пастись «на Кармиле и Васане»."
    - "В греческое и римское время эта земля была известна по своим областям: Гавланитида на западе, Батанея — древний Васан — в середине, Трахонитида на лавовых полях Леджи и Авранитида на Авране. Август отдал их Ироду Великому, а после него они составили тетрархию Филиппа, которого Лука называет четвертовластником «в Итурее и Трахонитской области»; Филипп отстроил Панеаду как Кесарию Филиппову, где Пётр исповедал Иисуса Христом. Агриппа II владел ими до своей смерти в конце I века н. э., после чего они отошли к провинции Сирия; позднее Авран передали Аравии, чья столица Бостра лежала на его краю."
    - "Чёрные базальтовые селения и церкви Аврана, многие из которых стоят с римских и византийских веков, — среди лучше всего сохранившихся памятников поздней античности. Сегодня Васан разделён: Голанские высоты, взятые Израилем у Сирии в 1967 году и присоединённые в 1981-м, чего не признаёт ООН; и сирийские провинции Деръа — древние Едреи — и Эс-Сувейда на Авране."
  uk:
    - "Башан — широке плато на схід від Галілейського моря і на північ від Ярмуку, що тягнеться від гори Хермон і Гешура на північному заході до пагорбів Хавран на сході; його багатий вулканічний ґрунт зробив його коморою й пасовиськом краю. Його міста — Аштарот і Едреї, царські резиденції Ога, Салка на Хаврані та Голан, місто прибіжища. Біблія згадує його дуби; про нього вона каже: «баранів Базанських», «бугаї Базанські», «Базанські телицї» (так Амос називає розніжених жінок Самарії) та «Гора Базанська», можливо, Хермон або вулканічні конуси Хавраню."
    - "Ог, «царь Базанський», вийшов проти Ізраїлю при Едреї й був знищений, а його земля, «вся полоса Аргоб» із «шістьдесять міст», укріплених високими мурами, дісталася половині племені Манасії; Яір узяв Аргов і назвав міста Хавот-Яір. Лише Ог «зоставсь з останнїх велетнїв», і його залізне ложе показували в Равві. Соломонів урядник у Рамоті Гілеадському керував Аргобом, а левіти володіли Голаном та Аштаротом. Азаїл Дамаський узяв Башан разом із Гілеадом, а в 732 р. до н. е. Тіглатпаласар III, узявши Дамаск, зробив його ассирійським. Пророки обіцяють, що Ізраїль знову пастиметься «на Кармелї й Базанї»."
    - "У грецькі й римські часи край був відомий за округами: Гауланіт на заході, Батанея, давній Башан, у центрі, Трахонітида на лавових полях Леджі та Авранітида на Хаврані. Август віддав їх Іродові Великому, а після нього вони були тетрархією Пилипа, названого Лукою четверовладником «в Ітуреї і Трахонській землї»; Пилип відбудував Панеас як Кесарію Пилипову, де Петро визнав Ісуса Христом. Агриппа II тримав їх до своєї смерті наприкінці I століття н. е., після чого вони перейшли до провінції Сирія; пізніше Хавран передали Аравії, чия столиця Бостра лежала на його краю."
    - "Чорні базальтові села й церкви Хавраню, багато з яких із римських і візантійських століть, належать до найкраще збережених пам'яток пізньої давнини. Нині Башан поділений: Голанські висоти, які Ізраїль узяв у Сирії в 1967 році й анексував у 1981-му — крок, не визнаний Організацією Об'єднаних Націй; і сирійські провінції Дераа, давній Едреї, та Сувейда на Хаврані."
  es:
    - "Basán es la amplia meseta al este del mar de Galilea y al norte del Yarmuk, que se extiende desde el monte Hermón y Gesur en el noroeste hasta las colinas del Haurán en el este; su rico suelo volcánico la convirtió en el granero y pastizal de la región. Sus ciudades eran Astarot y Edrei, sedes reales de Og, Salca en el Haurán, y Golán, ciudad de refugio. La Biblia habla de sus encinas, de sus «carneros de Basán», de sus «fuertes toros de Basán» y de las «vacas de Basán», nombre dado por Amós a las mujeres mimadas de Samaria, y de «el monte de Basán», quizá el Hermón o los conos volcánicos del Haurán."
    - "Og, «rey de Basán», salió contra Israel en Edrei y fue destruido, y su tierra, «toda la tierra de Argob» con «sesenta ciudades» fortalecidas con alto muro, correspondió a la media tribu de Manasés; Jair tomó Argob y llamó a las ciudades Havot-jair. Solo Og «había quedado de los gigantes que quedaron», y su cama de hierro se mostraba en Rabá. El oficial de Salomón en Ramot de Galaad gobernaba Argob, y los levitas poseían Golán y Astarot. Hazael de Damasco tomó Basán junto con Galaad, y en 732 a. C. Tiglat-pileser III, al tomar Damasco, la hizo asiria. Los profetas prometen que Israel volverá a apacentarse «en el Carmelo y en Basán»."
    - "En época griega y romana la tierra era conocida por sus distritos: Gaulanítide en el oeste, Batanea, el antiguo Basán, en el centro, Traconítide en los campos de lava del Leja y Auranítide en el Haurán. Augusto los dio a Herodes el Grande, y después de él fueron la tetrarquía de Felipe, nombrado por Lucas tetrarca «de Iturea y de la provincia de Traconite»; Felipe reconstruyó Paneas como Cesarea de Filipo, donde Pedro confesó a Jesús como el Cristo. Agripa II los poseyó hasta su muerte hacia finales del siglo I d. C., después de lo cual pasaron a la provincia de Siria; más tarde el Haurán fue transferido a Arabia, cuya capital Bosra se hallaba en su borde."
    - "Las aldeas e iglesias de basalto negro del Haurán, muchas de ellas de los siglos romanos y bizantinos, se cuentan entre las mejor conservadas de la Antigüedad tardía. Hoy Basán está dividida: los Altos del Golán, tomados por Israel a Siria en 1967 y anexionados en 1981, una medida no reconocida por las Naciones Unidas; y las provincias sirias de Daraa, la antigua Edrei, y Suwayda, en el Haurán."
  pt:
    - "Basã é o amplo altiplano a leste do mar da Galileia e ao norte do Yarmuk, que se estende do monte Hermom e de Gesur, no noroeste, às colinas do Haurã, no leste; seu rico solo vulcânico fez dela o celeiro e a pastagem da região. Suas cidades eram Astarote e Edrei, sedes reais de Ogue, Salca, no Haurã, e Golã, cidade de refúgio. A Bíblia fala de seus carvalhos, de seus “carneiros da raça de Basã”, de seus “Fortes touros de Basã” e das “vacas de Basã”, nome dado por Amós às mulheres mimadas de Samaria, e dos “montes de Basã”, talvez o Hermom ou os cones vulcânicos do Haurã."
    - "Ogue, “rei de Basã”, saiu contra Israel em Edrei e foi destruído, e sua terra, “toda a região de Argobe”, com “sessenta cidades” de altos muros, coube à meia tribo de Manassés; Jair tomou Argobe e chamou as cidades Havote-Jair. Só Ogue “restou do remanescente dos refains”, e seu leito de ferro era mostrado em Rabá. O oficial de Salomão em Ramote-Gileade governava Argobe, e os levitas possuíam Golã e Astarote. Hazael de Damasco tomou Basã com Gileade, e em 732 a.C. Tiglate-Pileser III, tomando Damasco, tornou-a assíria. Os profetas prometem que Israel se alimentará de novo “no Carmelo e em Basã”."
    - "Em tempos gregos e romanos a terra era conhecida por seus distritos: Gaulanítide, no oeste, Batanéia, a antiga Basã, no centro, Traconites, nos campos de lava do Leja, e Haurânite, no Haurã. Augusto os deu a Herodes, o Grande, e depois dele foram a tetrarquia de Filipe, que Lucas nomeia tetrarca “da região da Itureia e Traconites”; Filipe reconstruiu Paneas como Cesareia de Filipe, onde Pedro confessou Jesus como o Cristo. Agripa II os manteve até a morte, no fim do século I d.C., e depois passaram à província da Síria; mais tarde o Haurã foi transferido para a da Arábia, cuja capital, Bostra, ficava em sua borda."
    - "As aldeias e igrejas de basalto negro do Haurã, muitas dos séculos romanos e bizantinos, estão entre as mais bem conservadas da Antiguidade tardia. Hoje Basã está dividida: as colinas de Golã, tomadas por Israel à Síria em 1967 e anexadas em 1981, medida não reconhecida pelas Nações Unidas; e as províncias sírias de Daraa, a antiga Edrei, e Suwayda, no Haurã."
  de:
    - "Baschan ist das weite Hochland östlich des Sees Genezareth und nördlich des Jarmuk, vom Hermon und Geschur im Nordwesten bis zu den Bergen des Hauran im Osten; sein reicher vulkanischer Boden machte es zur Kornkammer und Weide der Gegend. Seine Städte waren Astarot und Edrei, die Residenzen Ogs, Salecha am Hauran und Golan, eine Freistadt. Die Bibel spricht von seinen Eichen, seinen „feisten Widdern und Böcken“, seinen „gewaltigen Stieren“ und seinen „fetten Kühen“, Amos' Name für die verwöhnten Frauen Samarias, und vom „Gebirge Basans“, vielleicht dem Hermon oder den Vulkankegeln des Hauran."
    - "Og, „der König von Basan“, zog Israel bei Edrei entgegen und wurde vernichtet, und sein Land, „die ganze Gegend Argob“ mit „sechzig Städten“, fest mit hohen Mauern, fiel an den halben Stamm Manasse; Jaïr nahm Argob und nannte die Orte Hawot-Jaïr. Og allein „war noch übrig von den Riesen“, und sein eisernes Bett wurde in Rabba gezeigt. Salomos Beamter in Ramot in Gilead verwaltete Argob, und die Leviten hielten Golan und Astarot. Hasaël von Damaskus nahm Baschan mit Gilead, und 732 v. Chr. machte Tiglat-Pileser III. es bei der Einnahme von Damaskus assyrisch. Die Propheten verheißen, dass Israel wieder „auf Karmel und Basan weiden“ wird."
    - "In griechischer und römischer Zeit kannte man das Land nach seinen Bezirken: Gaulanitis im Westen, Batanäa, das alte Baschan, in der Mitte, Trachonitis auf den Lavafeldern der Leja und Auranitis im Hauran. Augustus gab sie Herodes dem Großen, und nach ihm waren sie die Tetrarchie des Philippus, von Lukas genannt als Vierfürst „in Ituräa und in der Gegend Trachonitis“; Philippus baute Paneas als Cäsarea Philippi wieder auf, wo Petrus bekannte, dass Jesus der Christus ist. Agrippa II. hielt sie bis zu seinem Tod gegen Ende des 1. Jahrhunderts n. Chr., danach kamen sie an die Provinz Syrien; später wurde der Hauran Arabien zugeschlagen, dessen Hauptstadt Bostra an seinem Rand lag."
    - "Die schwarzen Basaltdörfer und Kirchen des Hauran, viele aus römischer und byzantinischer Zeit, gehören zu den am besten erhaltenen der Spätantike. Heute ist Baschan geteilt: die Golanhöhen, 1967 von Israel Syrien abgenommen und 1981 annektiert, ein Schritt, den die Vereinten Nationen nicht anerkennen; und die syrischen Provinzen Daraa, das antike Edrei, und Suwaida im Hauran."
  fr:
    - "Le Basan est le large haut plateau à l’est de la mer de Galilée et au nord du Yarmouk, qui s’étend du mont Hermon et de Gueschur au nord-ouest jusqu’aux collines du Havran à l’est ; son riche sol volcanique en faisait le grenier et le pâturage de la région. Ses villes étaient Aschtaroth et Édréi, résidences royales d’Og, Salca sur le Havran, et Golan, ville de refuge. La Bible parle de ses chênes, de ses « béliers de Basan », de ses « taureaux de Basan » et de ses « génisses de Basan », nom que donne Amos aux femmes choyées de Samarie, et des « montagnes de Basan », peut-être l’Hermon ou les cônes volcaniques du Havran."
    - "Og, « roi de Basan », sortit contre Israël à Édréi et fut détruit, et son pays, « soixante villes, toute la contrée d’Argob », fortifiées de hautes murailles, échut à la demi-tribu de Manassé ; Jaïr prit Argob et nomma les bourgs Havoth-Jaïr. Og « était resté seul de la race des Rephaïm », et son lit de fer était montré à Rabba. L’officier de Salomon à Ramoth en Galaad gouvernait Argob, et les lévites tenaient Golan et Aschtaroth. Hazaël de Damas prit le Basan avec Galaad, et en 732 av. J.-C., Tiglath-Piléser III, prenant Damas, le rendit assyrien. Les prophètes promettent qu’Israël aura de nouveau « ses pâturages du Carmel et du Basan »."
    - "Aux époques grecque et romaine, le pays se connaissait par ses districts : la Gaulanitide à l’ouest, la Batanée, l’ancien Basan, au centre, la Trachonite sur les coulées de lave du Léja et l’Auranitide dans le Havran. Auguste les donna à Hérode le Grand, et après lui ils formèrent la tétrarchie de Philippe, nommé par Luc tétrarque « de l’Iturée et du territoire de la Trachonite » ; Philippe rebâtit Paneas sous le nom de Césarée de Philippe, où Pierre confessa Jésus comme le Christ. Agrippa II les tint jusqu’à sa mort vers la fin du Ier siècle apr. J.-C., après quoi ils passèrent à la province de Syrie ; plus tard, le Havran fut rattaché à l’Arabie, dont la capitale Bostra se trouvait à sa lisière."
    - "Les villages et églises de basalte noir du Havran, dont beaucoup datent des siècles romains et byzantins, comptent parmi les mieux conservés de l’Antiquité tardive. Aujourd’hui le Basan est partagé : le plateau du Golan, pris par Israël à la Syrie en 1967 et annexé en 1981, geste non reconnu par l’ONU ; et les provinces syriennes de Deraa, l’antique Édréi, et de Soueïda dans le Havran."
  it:
    - "Basan è il vasto altopiano a est del Lago di Tiberiade e a nord dello Yarmuk, che si estende dal monte Ermon e da Ghesur a nord-ovest fino alle colline dell’Auran a est; il suo ricco suolo vulcanico ne faceva il granaio e il pascolo della regione. Le sue città erano Astarot ed Edrei, sedi reali di Og, Salca sull’Auran, e Golan, città di rifugio. La Bibbia parla delle sue querce, dei suoi «montoni di Basan», dei suoi «potenti tori» e delle sue «vacche di Basan», nome che Amos dà alle donne viziate di Samaria, e del «monte di Basan», forse l’Ermon o i coni vulcanici dell’Auran."
    - "Og, «re di Bashan», uscì contro Israele a Edrei e fu distrutto, e la sua terra, «tutta la regione di Argob» con «sessanta città» fortificate da alte mura, toccò alla mezza tribù di Manasse; Iair prese Argob e chiamò le città Avvot-Iair. Og «era rimasto solo della stirpe dei Refaim», e il suo letto di ferro era mostrato a Rabba. L’ufficiale di Salomone a Ramot di Galaad governava Argob, e i leviti tenevano Golan e Astarot. Cazaèl di Damasco prese Basan con Galaad, e nel 732 a.C. Tiglat-Pilèser III, prendendo Damasco, la rese assira. I profeti promettono che Israele pascerà di nuovo «al Carmel e in Basan»."
    - "In epoca greca e romana la terra era nota per i suoi distretti: Gaulanitide a ovest, Batanea, l’antico Basan, al centro, Traconitide sui campi di lava del Leja e Auranitide nell’Auran. Augusto li diede a Erode il Grande, e dopo di lui furono la tetrarchia di Filippo, nominato da Luca tetrarca «dell’Iturea e della Traconitide»; Filippo ricostruì Paneas come Cesarea di Filippo, dove Pietro confessò Gesù come il Cristo. Agrippa II li tenne fino alla morte verso la fine del I secolo d.C., dopo di che passarono alla provincia di Siria; più tardi l’Auran fu trasferito all’Arabia, la cui capitale Bostra sorgeva al suo margine."
    - "I villaggi e le chiese di basalto nero dell’Auran, molti dei secoli romani e bizantini, sono fra i meglio conservati della tarda antichità. Oggi Basan è divisa: le alture del Golan, prese da Israele alla Siria nel 1967 e annesse nel 1981, passo non riconosciuto dalle Nazioni Unite; e le province siriane di Daraa, l’antica Edrei, e Suwayda nell’Auran."
  pl:
    - "Baszan to rozległa wyżyna na wschód od Jeziora Galilejskiego i na północ od Jarmuku, ciągnąca się od góry Hermon i Geszur na północnym zachodzie po wzgórza Hauranu na wschodzie; jej żyzna gleba wulkaniczna czyniła z niej spichlerz i pastwisko regionu. Jej miastami były Asztarot i Edrei, siedziby królewskie Oga, Salka na Hauranie i Golan, miasto ucieczki. Biblia mówi o jej dębach, „barany odchowane w Basan”, „byki z Basan” i „krowy Basańskie”, jak Amos nazywa rozpieszczone kobiety Samarii, oraz o „górze Basańskiej”, może Hermonie albo wulkanicznych stożkach Hauranu."
    - "Og, „król Basański”, wyciągnął przeciw Izraelowi pod Edrei i został zniszczony; jego ziemię, „wszystkę krainę Argob” z miastami obwarowanymi wysokimi murami, w liczbie „sześćdziesiąt miast”, otrzymała połowa pokolenia Manassesa; Jair zajął Argob i nazwał miasta Chawot-Jair. Sam Og „pozostał był z olbrzymów”, a jego żelazne łoże pokazywano w Rabbie. Urzędnik Salomona w Ramot w Gileadzie zarządzał Argobem, a lewici otrzymali Golan i Asztarot. Chazael z Damaszku zajął Baszan wraz z Gileadem, a w 732 r. p.n.e. Tiglat-Pileser III, zdobywając Damaszek, uczynił go asyryjskim. Prorocy obiecują, że Izrael znów będzie się paść „na Karmelu, i na Basanie”."
    - "W czasach greckich i rzymskich kraj znano według okręgów: Gaulanitis na zachodzie, Batanea, dawny Baszan, w środku, Trachonitida na polach lawy Leja i Auranitis w Hauranie. August dał je Herodowi Wielkiemu, a po nim stanowiły tetrarchię Filipa, nazwanego przez Łukasza tetrarchą „Iturejskim i krainy Trachonickiej”; Filip odbudował Paneas jako Cezareę Filipową, gdzie Piotr wyznał Jezusa jako Chrystusa. Agryppa II trzymał je do swojej śmierci pod koniec I wieku n.e., po czym przeszły do prowincji Syria; później Hauran przeniesiono do Arabii, której stolica Bostra leżała na jego skraju."
    - "Czarne bazaltowe wsie i kościoły Hauranu, wiele z nich z wieków rzymskich i bizantyjskich, należą do najlepiej zachowanych w późnej starożytności. Dziś Baszan jest podzielony: Wzgórza Golan, odebrane Syrii przez Izrael w 1967 roku i anektowane w 1981, czego Organizacja Narodów Zjednoczonych nie uznaje; oraz syryjskie prowincje Daraa, dawne Edrei, i Suwayda w Hauranie."
  nl:
    - "Basan is het brede tafelland ten oosten van het Meer van Galilea en ten noorden van de Yarmuk, zich uitstrekkend van de Hermon en Gesur in het noordwesten tot de heuvels van de Hauran in het oosten; zijn rijke vulkanische grond maakte het tot de graanschuur en weide van de streek. Zijn steden waren Astarot en Edrei, de koninklijke zetels van Og, Salka op de Hauran, en Golan, een vrijstad. De Bijbel spreekt over zijn eiken, zijn “rammen, die in Bazan weiden”, zijn “sterke stieren van Basan” en zijn “koeien van Basan”, Amos’ naam voor de verwende vrouwen van Samaria, en over “de berg Basan”, misschien de Hermon of de vulkanische kegels van de Hauran."
    - "Og, “koning van Basan”, trok tegen Israël uit bij Edrei en werd vernietigd, en zijn land, “de ganse landstreek van Argob” met “zestig steden” versterkt met hoge muren, viel aan de halve stam Manasse; Jaïr nam Argob en noemde de steden Havoth-Jaïr. Og alleen was “van de overigen der reuzen overgebleven”, en zijn ijzeren bed werd te Rabba getoond. Salomo’s hoofdman in Ramot in Gilead bestuurde Argob, en de Levieten bezaten Golan en Astarot. Hazaël van Damascus nam Basan in met Gilead, en in 732 v.Chr. maakte Tiglat-Pileser III het, Damascus innemend, Assyrisch. De profeten beloven dat Israël weer zal weiden “op den Karmel en op den Basan”."
    - "In Griekse en Romeinse tijd was het land bekend onder zijn districten: Gaulanitis in het westen, Batanea, het oude Basan, in het midden, Trachonitis op de lavavelden van de Leja en Auranitis in de Hauran. Augustus gaf ze aan Herodes de Grote, en na hem vormden ze de tetrarchie van Filippus, door Lukas genoemd als viervorst “over Iturea en over het land Trachonitis”; Filippus herbouwde Paneas als Caesarea Filippi, waar Petrus Jezus als de Christus beleed. Agrippa II hield ze tot zijn dood tegen het einde van de eerste eeuw n.Chr., waarna ze overgingen naar de provincie Syrië; later werd de Hauran overgeheveld naar Arabië, wiens hoofdstad Bostra aan zijn rand lag."
    - "De zwarte basaltdorpen en kerken van de Hauran, velen uit de Romeinse en Byzantijnse eeuwen, behoren tot de best bewaarde van de late oudheid. Tegenwoordig is Basan verdeeld: de Golanhoogten, door Israël in 1967 op Syrië veroverd en in 1981 geannexeerd, een stap die de Verenigde Naties niet erkennen; en de Syrische provincies Daraa, het oude Edrei, en Suwayda in de Hauran."
  cs:
    - "Bášan je rozsáhlá náhorní plošina východně od Galilejského jezera a severně od Jarmúku, sahající od hory Chermon a Gešuru na severozápadě k pahorkům Havranu na východě; její úrodná sopečná půda z ní činila obilnici a pastvinu oblasti. Jeho města byla Aštarót a Edrej, královská sídla Ogova, Salka na Havranu a Golán, město útočiště. Bible zná jeho duby, jeho dobytek — „beránky a skopci z Bázan“, „silní volové z Bázan“ a „krávy Bázanské“, Amosovo jméno pro rozmazlené ženy Samaří — a „hoře v Bázan“, snad Chermon nebo sopečné kužely Havranu."
    - "Og, „král Bázan“, vytáhl proti Izraeli u Edrejí a byl zničen a Izrael obdržel jeho zemi: „šedesáte měst, všecku krajinu Argob, království Oga v Bázan“, „ohražená zdmi vysokými“, a ta připadla polovičnímu pokolení Manasesovu; Jaír vzal Argob a pojmenoval města Chavot-jaír. Sám Og „z jiných obrů byl pozůstal“ a jeho železné lůžko se ukazovalo v Rabbě. Šalomounův správce v Rámotu v Gileadu spravoval Argob a levité drželi Golán a Aštarót. Chazael Damašský vzal Bášan s Gileadem a roku 732 př. n. l. jej Tiglatpilesar III., když dobyl Damašek, učinil asyrským. Proroci slibují, že se Izrael bude opět pást „na Karmeli a Bázan“."
    - "V řecké a římské době byla země známa podle svých okresů: Gaulanitida na západě, Batanaia, starý Bášan, uprostřed, Trachonitida na lávových polích Leji a Auranitida na Havranu. Augustus je dal Herodovi Velikému a po něm byly tetrarchií Filipovou, kterého Lukáš jmenuje čtvrtákem „Iturejské a Trachonitidské krajiny“; Filip přestavěl Paneas jako Cesareu Filipovu, kde Petr vyznal Ježíše za Krista. Agrippa II. je držel do své smrti koncem 1. století n. l., načež přešly do provincie Sýrie; později byl Havran převeden k Arábii, jejíž hlavní město Bostra leželo na jeho okraji."
    - "Černé čedičové vesnice a kostely Havranu, mnohé z římských a byzantských století, patří k nejlépe dochovaným z pozdní antiky. Dnes je Bášan rozdělen: Golanské výšiny, které Izrael vzal Sýrii roku 1967 a připojil roku 1981, což Organizace spojených národů neuznává; a syrské provincie Dará, starověká Edrej, a Suvajdá na Havranu."
  sv:
    - "Bashan är den vida högplatån öster om Galileiska sjön och norr om Yarmuk, som sträcker sig från Hermon och Geshur i nordväst till Haurans berg i öster; dess rika vulkaniska jord gjorde det till traktens spannmålsbod och betesmark. Dess städer var Ashtarot och Edrei, Ogs kungasäten, Salka i Hauran och Golan, en tillflyktsstad. Bibeln talar om dess ekar, dess ”vädurar från Basan”, dess ”Basans oxar” och dess ”Basans-kor”, Amos’ namn på Samarias bortskämda kvinnor, och om ”Basans berg”, kanske Hermon eller Haurans vulkankäglor."
    - "Og, ”konungen i Basan”, drog ut mot Israel vid Edrei och förgjordes, och hans land, ”hela landsträckan Argob” med ”sextio städer” ”befästa med höga murar”, gick till Manasses halva stam; Jair tog Argov och kallade städerna Jairs byar. Og ensam ”var den ende som fanns kvar av de sista rafaéerna”, och hans järnsäng visades i Rabba. Salomos ämbetsman i Ramot-Gilead styrde Argov, och leviterna höll Golan och Ashtarot. Hasael av Damaskus tog Bashan med Gilead, och år 732 f.Kr. gjorde Tiglat-Pileser III, som intog Damaskus, det assyriskt. Profeterna lovar att Israel åter ska beta ”på Karmel och i Basan”."
    - "Under grekisk och romersk tid var landet känt efter sina distrikt: Gaulanitis i väster, Batanaea, det gamla Bashan, i mitten, Trachonitis på lavafälten i Leja och Auranitis i Hauran. Augustus gav dem till Herodes den store, och efter honom var de Filippos’ tetrarki, nämnd av Lukas som tetrark ”i Itureen och Trakonitis-landet”; Filippos byggde upp Paneas som Caesarea Filippi, där Petrus bekände Jesus som Kristus. Agrippa II höll dem till sin död mot slutet av första århundradet e.Kr., varefter de övergick till provinsen Syrien; senare fördes Hauran över till Arabien, vars huvudstad Bostra låg vid dess kant."
    - "Haurans svarta basaltbyar och kyrkor, många av dem från romerska och bysantinska århundraden, hör till de bäst bevarade från senantiken. I dag är Bashan delat: Golanhöjderna, som Israel tog från Syrien 1967 och annekterade 1981, ett steg som Förenta nationerna inte erkänner; och de syriska provinserna Daraa, det forna Edrei, och Suwayda i Hauran."
  nb:
    - "Basan er det brede høylandet øst for Galileasjøen og nord for Yarmuk, fra Hermon og Gesjur i nordvest til åsene i Havran i øst; den rike vulkanske jorden gjorde det til kornkammer og beiteland for regionen. Byene var Asjtarot og Edrei, Ogs kongeseter, Salka i Havran, og Golan, en tilfluktsby. Bibelen taler om dets eker, dets «vær fra Basan», dets «sterke okser» og «Basan-kyr», Amos' navn på de bortskjemte kvinnene i Samaria, og om «Basans fjell», kanskje Hermon eller de vulkanske kjeglene i Havran."
    - "Og, «kongen i Basan», drog ut mot Israel ved Edrei og ble utryddet, og landet hans, «hele Argob-landet» med «seksti byer» med høye murer, falt til den halve Manasse stamme; Jair tok Argob og kalte byene Havvot-Jair. Og alene var «den siste som var tilbake av refa'ittene», og jernsengen hans ble vist i Rabba. Salomos embetsmann i Ramot-Gilead styrte Argob, og levittene hadde Golan og Asjtarot. Hasael av Damaskus tok Basan med Gilead, og i 732 f.Kr. gjorde Tiglat-Pileser III det assyrisk ved å innta Damaskus. Profetene lover at Israel igjen skal beite «på Karmel og i Basan»."
    - "I gresk og romersk tid var landet kjent etter sine distrikter: Gaulanitis i vest, Bataneia, det gamle Basan, i midten, Trakonitis på lavafeltene i Leja og Auranitis i Havran. Augustus ga dem til Herodes den store, og etter ham var de Filips fjerdingsfyrstedømme, nevnt av Lukas, der Filip var fjerdingsfyrste «i det itureiske og trakonittiske land»; Filip gjenreiste Paneas som Cæsarea Filippi, der Peter bekjente Jesus som Kristus. Agrippa II holdt dem til sin død mot slutten av det første århundre e.Kr., og deretter gikk de til provinsen Syria; senere ble Havran overført til Arabia, hvis hovedstad Bostra lå i dets kant."
    - "De svarte basaltlandsbyene og kirkene i Havran, mange av dem fra romersk og bysantinsk tid, er blant de best bevarte fra senantikken. I dag er Basan delt: Golanhøydene, tatt av Israel fra Syria i 1967 og annektert i 1981, et skritt som ikke er anerkjent av De forente nasjoner; og de syriske provinsene Daraa, det gamle Edrei, og Suwayda i Havran."
  tl:
    - "Ang Basan ay malawak na kapatagang mataas sa silangan ng Dagat ng Galilea at hilaga ng Yarmuk, mula sa Bundok Hermon at Gessur sa hilagang-kanluran hanggang sa mga burol ng Hauran sa silangan; ang mayamang lupang bulkaniko nito ang naging kamalig at pastulan ng rehiyon. Ang mga lungsod nito ay Astarot at Edrei, mga maharlikang luklukan ni Og, Salcha sa Hauran, at Golan, lungsod ng kanlungan. Binabanggit ng Biblia ang mga encina nito, ang “mga tupang lalake sa Basan”, ang “malakas na toro ng Basan” at ang “mga baka ng Basan”, ang tawag ni Amos sa mga babaeng pinalayaw ng Samaria, at ang “bundok ng Basan”, marahil ang Hermon o ang mga kono ng bulkan ng Hauran."
    - "Si Og, “hari sa Basan”, ay lumabas laban sa Israel sa Edrei at nawasak, at ang kaniyang lupain, “ang buong lupain ng Argob” na may “anim na pung bayan” na may matataas na kuta, ay napunta sa kalahating lipi ni Manases; sinakop ni Jair ang Argob at pinangalanan ang mga bayan na Havoth-jair. Si Og lamang ang “nalalabi sa natira sa mga Rephaim”, at ipinakita ang kaniyang higaang bakal sa Rabba. Pinamunuan ng opisyal ni Salomon sa Ramoth-galaad ang Argob, at hinawakan ng mga Levita ang Golan at Astarot. Kinuha ni Hazael ng Damasco ang Basan kasama ng Gilead, at noong 732 BK, ginawa itong Asirio ni Tiglath-pileser III nang sakupin ang Damasco. Ipinangako ng mga propeta na muling “sasabsab” ang Israel “sa Carmel at sa Basan”."
    - "Noong panahong Griyego at Romano, kilala ang lupain sa mga distrito nito: Gaulanitis sa kanluran, Batanaea, ang dating Basan, sa gitna, Traconite sa mga bukirang lava ng Leja at Auranitis sa Hauran. Ibinigay ni Augusto ang mga ito kay Herodes na Dakila, at pagkatapos niya ay naging tetrarkiya ni Felipe, na pinangalanan ni Lucas na tetrarka “sa lalawigan ng Iturea at Traconite”; muling itinayo ni Felipe ang Paneas bilang Cesarea ni Filipo, kung saan ipinahayag ni Pedro na si Jesus ang Cristo. Hinawakan ni Agripa II ang mga ito hanggang sa kaniyang kamatayan malapit sa katapusan ng unang siglo AD, at pagkatapos ay napunta sila sa lalawigan ng Siria; kalaunan, inilipat ang Hauran sa Arabia, na ang kabisera nitong Bostra ay nasa gilid nito."
    - "Ang mga itim na nayong basalto at mga simbahan ng Hauran, marami ay mula sa mga siglong Romano at Bisantino, ay kabilang sa pinakamahusay na napanatili ng huling sinaunang panahon. Hati ang Basan ngayon: ang Kabundukang Golan, na kinuha ng Israel sa Siria noong 1967 at isinanib noong 1981, hakbang na hindi kinikilala ng Mga Bansang Nagkakaisa; at ang mga lalawigan ng Siria na Daraa, ang sinaunang Edrei, at Suwayda sa Hauran."
  da:
    - "Basan er det brede højland øst for Genesaret Sø og nord for Yarmuk, strakt fra Hermon og Gesjur i nordvest til Haurans bjerge i øst; dets rige vulkanske jord gjorde det til egnens kornkammer og græsgang. Dets byer var Asjtarot og Edre'i, Ogs kongesæder, Salka i Hauran og Golan, en tilflugtsby. Bibelen taler om dets ege, dets »Vædre, fødte i Basan«, »Basans Tyre« og »Basans Køer«, Amos' navn for Samarias forkælede kvinder, og om »Basans Bjerg«, måske Hermon eller Haurans vulkankegler."
    - "Og, »Kongen af Basan«, drog ud imod Israel ved Edre'i og blev tilintetgjort, og hans land, »hele Egnen Argob« med »Tresindstyve Stæder« forsynet med høje mure, gik til Manasse halve stamme; Jair tog Argob og kaldte byerne Havot-Jair. Og var »ene tilbage af de overblevne Kæmper«, og hans jernseng blev vist i Rabba. Salomos embedsmand i Ramot i Gilead styrede Argob, og leviterne holdt Golan og Asjtarot. Hazael af Damaskus tog Basan med Gilead, og i 732 f.Kr. gjorde Tiglat-Pileser 3., der indtog Damaskus, det assyrisk. Profeterne lover, at Israel igen skal græsse »paa Karmel og Basan«."
    - "I græsk og romersk tid var landet kendt under sine distrikter: Gaulanitis i vest, Batanæa, det gamle Basan, i midten, Trakonitis på Lejas lavamarker og Auranitis i Hauran. Augustus gav dem til Herodes den Store, og efter ham var de Filips tetrarki, af Lukas nævnt som tetrark »i Ituræa og Trakonitis's Land«; Filip genopbyggede Paneas som Cæsarea Filippi, hvor Peter bekendte Jesus som Kristus. Agrippa 2. holdt dem til sin død mod slutningen af første århundrede e.Kr., hvorefter de gik til provinsen Syrien; senere blev Hauran overført til Arabien, hvis hovedstad Bostra lå ved dets kant."
    - "Haurans sorte basaltlandsbyer og kirker, mange fra de romerske og byzantinske århundreder, er blandt sen oldtids bedst bevarede. I dag er Basan delt: Golanhøjderne, taget af Israel fra Syrien i 1967 og annekteret i 1981, et skridt, som FN ikke anerkender; og de syriske provinser Daraa, det gamle Edre'i, og Suwayda i Hauran."
  sr:
    - "Васан је широка висораван источно од Галилејског мора и северно од Јармука, која се протеже од горе Ермон и Гесура на северозападу до брда Аврана на истоку; његово богато вулканско тло чинило га је житницом и пашњаком краја. Његови градови били су Астарот и Едрајин, краљевска седишта Огова, Салха на Аврану и Голан, град уточишта. Библија спомиње његове храстове и овнове, „јаке волове васанске“ и „краве васанске“ (Амосов назив за размажене жене Самарије), као и „гору хумовиту“ васанску, можда Ермон или вулканске купе Аврана."
    - "Ог, „цар васански“, изашао је против Израиља код Едрајина и био уништен, а његова земља, „сав крај арговски“ са „шездесет градова“ утврђених високим зидовима, припала је половини племена Манасијиног; Јаир је узео Аргов и назвао градове Јаировим селима. Само Ог „беше остао од дивова“, а његов гвоздени одар показиван је у Рави. Соломунов намесник у Рамоту Галадском управљао је Арговом, а левити су држали Голан и Астарот. Азаило из Дамаска узео је Васан с Галадом, а 732. п. н. е. Теглат-Феласар III, заузевши Дамаск, учинио га је асирским. Пророци обећавају да ће Израиљ поново пасти „по Кармилу и Васану“."
    - "У грчко и римско доба земља је била позната по својим окрузима: Гауланитида на западу, Батанеја, стари Васан, у средини, Трахонитска област на лавним пољима Леџе и Авранитида у Аврану. Август их је дао Ироду Великом, а после њега били су тетрархија Филипова, коју Лука именује као тетрарха „у Итуреји и у трахонитској“; Филип је обновио Панеју као Цезареју Филипову, где је Петар исповедио Исуса за Христа. Агрипа II држао их је до смрти крајем 1. века н. е., после чега су прешле у провинцију Сирију; касније је Авран пренет у Арабију, чија је престоница Бостра лежала на његовом рубу."
    - "Црна базалтна села и цркве Аврана, многе из римских и византијских векова, међу најбоље су очуваним из касне антике. Данас је Васан подељен: Голанска висораван, коју је Израел узео од Сирије 1967. и анектирао 1981, корак који Уједињене нације не признају; и сиријске провинције Дараа, древни Едрајин, и Суваида у Аврану."
  hu:
    - "Básán a Galileai-tengertől keletre és a Jarmuktól északra fekvő széles fennsík, amely a Hermon-hegytől és Gesúrtól északnyugaton a keleti Hauran dombjaiig húzódik; gazdag vulkáni talaja a vidék éléstárává és legelőjévé tette. Városai Astarót és Edrei, Óg királyi székhelyei, Szalka a Haurannál, és Gólán, menedékváros. A Biblia említ tölgyeket, „básáni kosokat”, erős bikákat, Szamária elpuhult asszonyait pedig Ámós „Básánnak ünői” néven nevezi; említi továbbá Básán hegyét, amely talán a Hermon vagy a Hauran vulkáni kúpjai."
    - "„Og, Básán királya” kijött Izráel ellen Edreinél, és elpusztult, földje – „hatvan várost, Argóbnak egész vidékét”, magas kőfalakkal megerősítve – Manassé fél törzséhez került; Jaír elfoglalta Argóbot, és a városokat Hávvót-Jaírnak nevezte. Csak Óg „maradt meg az óriások maradéka közül”, vas-ágyát Rabbában mutatták. Salamon Rámót-Gileádban székelő tisztje kormányozta Argóbot, a léviták pedig Gólánt és Astarótot birtokolták. Házael damaszkuszi király elfoglalta Básánt Gileáddal együtt, és Kr. e. 732-ben III. Tiglat-Pileszer Damaszkusz elfoglalásával asszírrá tette. A próféták megígérik, hogy Izráel ismét legelni fog: „Básánban legel és a Kármelen”."
    - "A görög és római korban a földet kerületei szerint ismerték: nyugaton Gaulanitisz, középen a régi Básán, Batanaia, a Leja lávamezőin Trakhonitisz és a Hauranban Auranitisz. Augusztus Nagy Heródesnek adta őket, utána pedig Fülöp tetrarchiája voltak, akit Lukács így nevez meg: „Iturea és Trakhónitis tartományának pedig negyedes fejedelme”; Fülöp újjáépítette Paneaszt Fülöp Cézáreájaként, ahol Péter Jézust Krisztusnak vallotta. II. Agrippa a Kr. u. 1. század vége felé bekövetkezett haláláig birtokolta őket, ezután Szíria provinciához kerültek; később a Hauran Arábiához került, amelynek fővárosa, Boszra a szélén feküdt."
    - "A Hauran fekete bazaltfalvai és templomai, sokuk a római és bizánci századokból, a késő ókor legjobban megőrzött emlékei közé tartoznak. Ma Básán megosztott: a Gólán-fennsík, amelyet Izrael 1967-ben vett el Szíriától és 1981-ben annektált, ezt a lépést az Egyesült Nemzetek nem ismeri el; valamint a szíriai Dara tartomány, az ókori Edrei, és Szuvejda a Hauranban."
  fi:
    - "Basan on laaja ylätasanko Galileanjärven itäpuolella ja Jarmukin pohjoispuolella, joka ulottuu luoteesta, Hermonvuorelta ja Gesurista, itään Hauranin kukkuloille; sen rikas tulivuorimaa teki siitä alueen viljamakasiinin ja laitumen. Sen kaupunkeja olivat Astarot ja Edrei, Oogin kuninkaalliset asuinpaikat, Salka Hauranissa ja Golan, turvakaupunki. Raamattu mainitsee sen tammet, Basanin rotuiset oinaat, ”väkevät sonnit” ja ”Baasanin lehmät”, Aamoksen nimityksen Samarian hemmotelluille naisille, sekä psalmin ”Baasanin vuori”, ehkä Hermon tai Hauranin tulivuorikartiot."
    - "”Oog, Baasanin kuningas” lähti Israelia vastaan Edreihin ja tuhottiin, ja hänen maansa, ”kuusikymmentä kaupunkia, koko Argobin seudun” korkeilla muureilla varustettuine kaupunkeineen, joutui Manassen puolisukukunnalle; Jair valtasi Argobin ja nimesi kaupungit Havvot-Jairiksi. Vain Oog ”oli yksin enää jäljellä viimeisistä refalaisista”, ja hänen rautasänkynsä näytettiin Rabbassa. Salomon virkamies Ramot-Gileadissa hallitsi Argobia, ja leeviläiset hallitsivat Golania ja Astarotia. Damaskoksen Hasael valtasi Basanin Gileadin mukana, ja vuonna 732 eaa. Tiglat-Pileser III teki sen Damaskoksen valtauksen yhteydessä assyrialaiseksi. Profeetat lupaavat, että Israel laiduntaa taas ”Karmelilla ja Baasanissa”."
    - "Kreikkalaisella ja roomalaisella ajalla maa tunnettiin piirinsä mukaan: Gaulanitis lännessä, Batanaia, vanha Basan, keskellä, Trachonitis Lejan laavakentillä ja Auranitis Hauranissa. Augustus antoi ne Herodes Suurelle, ja hänen jälkeensä ne olivat Filippoksen tetrarkia, jonka Luukas nimeää: Filippos oli ”Iturean ja Trakonitiinmaan neljännysruhtinaana”; Filippos rakensi Paneaan uudelleen Filippoksen Kesareaksi, jossa Pietari tunnusti Jeesuksen Kristukseksi. Agrippa II hallitsi niitä kuolemaansa asti 1. vuosisadan lopulla jaa., minkä jälkeen ne siirtyivät Syyrian provinssille; myöhemmin Hauran siirrettiin Arabialle, jonka pääkaupunki Bostra sijaitsi sen reunalla."
    - "Hauranin mustat basalttikylät ja kirkot, monet roomalaisten ja bysanttilaisten vuosisatojen ajoilta, ovat myöhäisantiikin parhaiten säilyneitä. Nykyisin Basan on jaettu: Golanin kukkulat, jotka Israel otti Syyrialta 1967 ja liitti itseensä 1981, mitä Yhdistyneet kansakunnat ei tunnusta; sekä Syyrian provinssit Daraa, muinainen Edrei, ja Suwayda Hauranissa."
  vi:
    - "Ba-san là cao nguyên rộng phía đông Biển Ga-li-lê và phía bắc Yarmuk, trải từ Núi Hẹt-môn và Ghê-su-rơ ở tây bắc đến các đồi Ha-vơ-ran ở phía đông; đất núi lửa phì nhiêu của nó khiến nó là kho lúa và đồng cỏ của vùng. Các thành của nó là Ách-ta-rốt và Ết-rê-i, nơi ngự của Óc, Sanh-ca (Salcah) trên Ha-vơ-ran, và Gô-lan, một thành ẩn náu. Kinh Thánh nói về những cây dẽ của nó, “Chiên đực sanh tại Ba-san”, “Những bò đực hung mạnh của Ba-san”, và “bò cái của Ba-san”, tên A-mốt gọi những phụ nữ được nuông chiều của Sa-ma-ri, và về “Núi Ba-san”, có lẽ là Hẹt-môn hay các nón núi lửa của Ha-vơ-ran."
    - "Óc, “vua Ba-san”, ra nghịch cùng Y-sơ-ra-ên tại Ết-rê-i và bị diệt, và đất của ông, “toàn miền Ạt-gốp” với “sáu mươi cái thành” có vách cao, thuộc về nửa chi phái Ma-na-se; Giai-rơ chiếm Ạt-gốp và đặt tên các thành là các thôn Giai-rơ. “Chỉ có một mình Óc, vua Ba-san, còn lại”, và giường sắt của ông được chỉ ở Ráp-ba. Quan của Sa-lô-môn ở Ra-mốt Ga-la-át cai trị Ạt-gốp, và người Lê-vi giữ Gô-lan và Ách-ta-rốt. Ha-xa-ên của Đa-mách chiếm Ba-san cùng Ga-la-át, và năm 732 TCN Tiếc-la-Phi-lê-se III, khi chiếm Đa-mách, biến nó thành đất A-si-ri. Các tiên tri hứa rằng Y-sơ-ra-ên sẽ lại “ăn cỏ trên Cạt-mên và Ba-san”."
    - "Vào thời Hy Lạp và La Mã, vùng đất được biết theo các quận của nó: Gaulanitis ở phía tây, Batanaea, Ba-san cũ, ở giữa, Trachonitis trên các cánh đồng dung nham Leja và Auranitis ở Ha-vơ-ran. Au-gút-tơ trao chúng cho Hê-rốt Đại đế, và sau ông chúng là tứ phân lãnh thổ của Phi-líp, được Lu-ca nêu là Phi-líp “làm vua chư hầu xứ Y-tu-rê và tỉnh Tra-cô-nít”; Phi-líp xây lại Paneas thành Sê-sa-rê Phi-líp, nơi Phi-e-rơ xưng Giê-su là Đấng Christ. Ạc-ríp-ba II giữ chúng cho đến khi qua đời vào cuối thế kỷ 1, sau đó chúng chuyển vào tỉnh Sy-ri; về sau Ha-vơ-ran được chuyển cho A-ra-bi, mà kinh đô Bostra nằm ở rìa nó."
    - "Các làng và nhà thờ bazan đen của Ha-vơ-ran, nhiều nơi từ các thế kỷ La Mã và Byzantine, nằm trong số những nơi được bảo tồn tốt nhất của hậu kỳ cổ đại. Ngày nay Ba-san bị chia: Cao nguyên Gô-lan, bị Israel lấy từ Sy-ri năm 1967 và sáp nhập năm 1981, một bước mà Liên Hợp Quốc không công nhận; và các tỉnh Sy-ri Daraa, Ết-rê-i cổ, và Suwayda ở Ha-vơ-ran."
  ro:
    - "Basanul este larga câmpie înaltă de la est de Marea Galileii și la nord de Yarmuk, întinzându-se de la muntele Hermon și Gheșur în nord-vest până la dealurile Haurânului în est; solul lui vulcanic bogat l-a făcut grânarul și pășunea regiunii. Cetățile lui erau Astarot și Edrei, reședințele regale ale lui Og, Salca pe Hauran și Golan, o cetate de scăpare. Biblia vorbește despre stejarii lui, despre berbecii din rasa Basanului, despre taurii lui puternici și despre vacile Basanului, numele dat de Amos femeilor răsfățate ale Samariei, și despre dealul Basanului, poate Hermonul sau conurile vulcanice ale Haurânului."
    - "„Og împăratul Vasanului” a ieșit împotriva lui Israel la Edrei și a fost nimicit, iar țara lui, „șasezeci de cetăți și toate cele de prin prejurul Argovului”, cu ziduri înalte, a revenit jumătății de seminție a lui Manase; Iair a luat Argobul și a numit cetățile Havot-Iair. Doar Og era „cel ce rămăsese din uriașii”, iar patul lui de fier era arătat la Raba. Dregătorul lui Solomon din Ramot din Galaad conducea Argobul, iar leviții stăpâneau Golanul și Astarotul. Hazael al Damascului a luat Basanul împreună cu Galaadul, iar în 732 î.Hr. Tiglat-Pileser al III-lea, luând Damascul, l-a făcut asirian. Profeții făgăduiesc că Israel se va paște din nou pe Carmel și în Basan."
    - "În vremea greacă și romană, ținutul era cunoscut după districtele sale: Gaulanitis în vest, Batanea, vechiul Basan, în centru, Trahonitida pe câmpurile de lavă ale Lejei și Auranitis în Hauran. Augustus le-a dat lui Irod cel Mare, iar după el au fost tetrarhia lui Filip, numit de Luca tetrarh „pre Ituria și pre laturea Trahoniei”; Filip a reconstruit Paneasul ca Cezareea lui Filip, unde Petru l-a mărturisit pe Isus drept Hristosul. Agripa al II-lea le-a stăpânit până la moartea sa, spre sfârșitul secolului I d.Hr., după care au trecut la provincia Siria; mai târziu Haurânul a fost transferat Arabiei, a cărei capitală, Bostra, se afla la marginea lui."
    - "Satele și bisericile de bazalt negru din Hauran, multe din secolele romane și bizantine, sunt printre cele mai bine păstrate din Antichitatea târzie. Astăzi Basanul este împărțit: Înălțimile Golanului, luate de Israel de la Siria în 1967 și anexate în 1981, un pas nerecunoscut de Organizația Națiunilor Unite; și provinciile siriene Daraa, vechiul Edrei, și Suwayda din Hauran."
  bg:
    - "Васан е широката висока равнина на изток от Галилейско езеро и на север от Ярмук, простираща се от планината Ермон и Гесур на северозапад до хълмовете на Хауран на изток; богатата му вулканична почва го направила житница и пасище на областта. Градовете му били Астарот и Едреи, царските седалища на Ог, Салха на Хауран и Голан, град на прибежище. Библията говори за дъбовете му, за „овни Васански“, за „Бикове силни от Васан“ и за кравите на Васан, названието на Амос за разглезените жени на Самария, както и за „гората Васан“, може би Ермон или вулканичните конуси на Хауран."
    - "Ог, цар на Васан, излязъл срещу Израил при Едреи и бил унищожен, а земята му, „всичката област на Аргов“ с „шестдесет градове“, укрепени с високи стени, паднала на половината от племето на Манасия; Яир взел Аргов и нарекъл градовете Хавот-Яир. Само Ог бил „останал от остатъка на исполините“ и желязното му легло се показвало в Рава. Служителят на Соломон в Рамот Галаадски управлявал Аргов, а левитите държали Голан и Астарот. Азаил от Дамаск взел Васан с Галаад, а през 732 г. пр.н.е. Теглатфеласар III, превземайки Дамаск, го направил асирийски. Пророците обещават, че Израил ще пасе отново „в Кармил и Васан“."
    - "В гръцко и римско време земята била известна по областите си: Гавланитида на запад, Батанея, старият Васан, в средата, Трахонитида на лавовите полета на Леджа и Хауранитида в Хауран. Август ги дал на Ирод Велики, а след него те били тетрархията на Филип, назован от Лука тетрарх „в Итурея и в Трахонитската страна“; Филип възстановил Панеас като Кесария Филипова, където Петър изповядал Исус като Христос. Агрипа II ги държал до смъртта си към края на I в. н.е., след което преминали към провинция Сирия; по-късно Хауран бил прехвърлен към Арабия, чиято столица Босра лежала на края му."
    - "Черните базалтови села и църкви на Хауран, много от тях от римските и византийските векове, са сред най-добре запазените от късната античност. Днес Васан е разделен: Голанските възвишения, взети от Израил от Сирия през 1967 г. и анексирани през 1981 г. — стъпка, непризната от Организацията на обединените нации; и сирийските провинции Дараа, древният Едреи, и Сувейда в Хауран."
