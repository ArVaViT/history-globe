body:
  en:
    - "Kanah, “reeds”, was a town on the northern border of Asher, named once in the list of its towns: “And Hebron, and Rehob, and Hammon, and Kanah, even unto great Zidon”. It is distinct from the brook Kanah between Ephraim and Manasseh and from Cana of Galilee in the Gospel of John. Edward Robinson identified it with Qana, a large village on high ground about 10 km south-east of Tyre in southern Lebanon, which keeps the name; there are many ancient ruins around it."
    - "The Survey of Western Palestine in 1881 described Qana as a large village of well-built houses, partly Christian and partly Muslim, among olives and figs, with a church and two springs; Victor Guérin, a few years earlier, found its highest and oldest quarter, Kana el-Foqa, almost abandoned. An old local tradition holds that Qana was the Cana where Jesus turned water into wine, a claim set out in the article on Cana."
    - "The rocks around Qana are full of ancient work. Ernest Renan, exploring the district for his Mission de Phénicie, met rock-cut monuments at every step between the monument called Hiram's Tomb and Qana, by the hundred: tombs, caves, presses, chambers and basins. On the north face of a rocky hill near the village he recorded rows of rude human figures carved in the rock, and the Survey noted a few Greek letters on a stone of the water trough at the spring. Eusebius, in his Onomasticon, listed Kana as a town of Asher near great Sidon and took it for the Cana where Jesus turned water into wine, the home of Nathanael. Jerome repeated this in his Latin version."
  ru:
    - "Кана, «тростник», — город на северной границе Асира, названный однажды в списке его городов: «Еврон, Рехов, Хаммон и Кана, до Сидона великого». Это не поток Кана между Ефремом и Манассией и не Кана Галилейская Евангелия от Иоанна. Эдвард Робинсон отождествил её с Каной — большим селением на возвышенности примерно в 10 км к юго-востоку от Тира на юге Ливана, сохранившим имя; вокруг него много древних развалин."
    - "«Обзор Западной Палестины» в 1881 г. описывал Кану как большое селение из добротных домов, отчасти христианское, отчасти мусульманское, среди олив и смоковниц, с церковью и двумя источниками; Виктор Герен незадолго до того нашёл её верхний и древнейший квартал, Кана-эль-Фока, почти покинутым. Давнее местное предание считает Кану той Каной, где Иисус претворил воду в вино; это притязание изложено в статье о Кане Галилейской."
    - "Скалы вокруг Каны полны древних работ. Эрнест Ренан, обследовавший округу для своего труда «Mission de Phénicie», на каждом шагу между памятником, называемым гробницей Хирама, и Каной встречал высеченные в скале сооружения, сотнями: гробницы, пещеры, давильни, камеры и водоёмы. На северном склоне скалистого холма у селения он описал ряды грубых человеческих фигур, высеченных в скале, а «Обзор Западной Палестины» отметил несколько греческих букв на камне водопойного корыта у источника. Евсевий в «Ономастиконе» назвал Кану городом Асира близ великого Сидона и счёл её той Каной, где Иисус претворил воду в вино, родиной Нафанаила. Иероним повторил это в своём латинском переводе."
  uk:
    - "Кана, «очерет», була містом на північній межі Асіра, названим один раз у переліку його міст: «Геброн, Рехов, Хаммон та Кана, до великого Сидону». Вона відмінна від потоку Кана між Єфремом і Манассією та від Кани Галілейської в Євангелії від Івана. Едвард Робінсон ототожнив її з великим селом Кана на високому місці приблизно за 10 км на південний схід від Тіра на півдні Лівану, яке зберігає назву; довкола нього багато давніх руїн."
    - "«Survey of Western Palestine» 1881 р. описав це село як велике, з добре збудованими будинками, почасти християнське, почасти мусульманське, серед оливок і смокв, із церквою та двома джерелами; Віктор Ґерен кількома роками раніше знайшов його найвищий і найдавніший квартал, Кана-ель-Фока, майже покинутим. Давнє місцеве передання вважає, що це та Кана, де Ісус перетворив воду на вино, — твердження, викладене в статті «Кана Галілейська»."
    - "Скелі довкола Кани повні давніх робіт. Ернест Ренан, досліджуючи округу для своєї праці «Mission de Phénicie», на кожному кроці між спорудою, званою гробницею Хірама, і Каною натрапляв на висічені в скелі витвори, сотнями: гробниці, печери, чавильні, камери й водойми. На північному схилі скелястого пагорба біля села він описав ряди грубих людських постатей, висічених у скелі, а «Survey of Western Palestine» відзначив кілька грецьких літер на камені корита біля джерела. Євсевій в «Ономастиконі» назвав Кану містом Асіра біля великого Сидону й ототожнив її з тією Каною, де Ісус перетворив воду на вино, батьківщиною Натанаїла. Ієронім повторив це у своєму латинському перекладі."
  es:
    - "Caná, «cañas», era una ciudad en la frontera septentrional de Aser, nombrada una vez en la lista de sus ciudades: «Hebrón, y Rehob, y Hammón, y Cana, hasta la gran Sidón». Es distinta del arroyo de Caná entre Efraín y Manasés y de la Caná de Galilea del Evangelio de Juan. Edward Robinson la identificó con Qana, una gran aldea en terreno alto a unos 10 km al sureste de Tiro, en el sur del Líbano, que conserva el nombre; hay muchas ruinas antiguas a su alrededor."
    - "El Survey of Western Palestine describió en 1881 Qana como una gran aldea de casas bien construidas, en parte cristiana y en parte musulmana, entre olivos e higueras, con una iglesia y dos manantiales; Victor Guérin, pocos años antes, había hallado su barrio más alto y antiguo, Kana el-Foqa, casi abandonado. Una antigua tradición local sostiene que Qana fue la Caná donde Jesús convirtió el agua en vino, afirmación expuesta en el artículo sobre Caná."
    - "Las rocas en torno a Qana están llenas de obras antiguas. Ernest Renan, que exploró la comarca para su Mission de Phénicie, encontró a cada paso, entre el monumento llamado Tumba de Hiram y Qana, obras talladas en la roca por centenares: tumbas, cuevas, lagares, cámaras y pilas. En la cara norte de una colina rocosa junto a la aldea registró hileras de toscas figuras humanas talladas en la roca, y el Survey of Western Palestine anotó unas pocas letras griegas en una piedra del abrevadero del manantial. Eusebio, en su Onomasticon, incluyó a Caná entre las ciudades de Aser cerca de la gran Sidón y la tomó por la Caná donde Jesús convirtió el agua en vino, patria de Natanael. Jerónimo lo repitió en su versión latina."
  pt:
    - "Caná, “juncos”, era uma cidade na fronteira norte de Aser, nomeada uma vez na lista de suas cidades: “e Ebrom, Reobe, Hamom e Caná, até a grande Sidom”. É distinta do ribeiro de Caná entre Efraim e Manassés e da Caná da Galileia no Evangelho de João. Edward Robinson a identificou com Qana, uma grande aldeia em terreno elevado cerca de 10 km a sudeste de Tiro, no sul do Líbano, que conserva o nome; há muitas ruínas antigas em torno dela."
    - "O Survey of Western Palestine, em 1881, descreveu Qana como uma grande aldeia de casas bem construídas, em parte cristã e em parte muçulmana, entre oliveiras e figueiras, com uma igreja e duas fontes; Victor Guérin, alguns anos antes, encontrou seu bairro mais alto e mais antigo, Kana el-Foqa, quase abandonado. Uma antiga tradição local sustenta que Qana era a Caná onde Jesus transformou água em vinho, afirmação exposta no artigo sobre Caná."
    - "As rochas em torno de Qana estão cheias de obras antigas. Ernest Renan, explorando a região para a sua Mission de Phénicie, encontrou a cada passo, entre o monumento chamado Túmulo de Hirão e Qana, obras talhadas na rocha às centenas: túmulos, grutas, lagares, câmaras e tanques. Na face norte de uma colina rochosa junto à aldeia registrou fileiras de toscas figuras humanas entalhadas na rocha, e o Survey of Western Palestine notou algumas letras gregas numa pedra do bebedouro junto à fonte. Eusébio, no seu Onomasticon, listou Caná como cidade de Aser perto da grande Sidom e a tomou pela Caná onde Jesus transformou água em vinho, terra de Natanael. Jerônimo repetiu isso em sua versão latina."
  de:
    - "Kana, „Schilf“, war eine Stadt an der Nordgrenze Assers, einmal in der Liste seiner Städte genannt: „Ebron, Rehob, Hammon, Kana bis an Groß-Sidon“. Es ist vom Bach Kana zwischen Ephraim und Manasse und von Kana in Galiläa im Johannesevangelium zu unterscheiden. Edward Robinson setzte es mit Qana gleich, einem großen Dorf auf einer Anhöhe etwa 10 km südöstlich von Tyrus im Südlibanon, das den Namen bewahrt; rings um es gibt es viele antike Ruinen."
    - "Der Survey of Western Palestine beschrieb Qana 1881 als großes Dorf mit gut gebauten Häusern, teils christlich, teils muslimisch, zwischen Oliven und Feigen, mit einer Kirche und zwei Quellen; Victor Guérin fand einige Jahre früher sein höchstes und ältestes Viertel, Kana el-Fauqa, fast verlassen. Eine alte örtliche Überlieferung hält Qana für das Kana, wo Jesus Wasser in Wein verwandelte, eine Behauptung, die im Artikel über Kana dargelegt wird."
    - "Die Felsen um Qana sind voller antiker Arbeiten. Ernest Renan, der die Gegend für seine Mission de Phénicie erkundete, traf zwischen dem sogenannten Hiramsgrab und Qana auf Schritt und Tritt in den Fels gehauene Anlagen, zu Hunderten: Gräber, Höhlen, Keltern, Kammern und Becken. An der Nordseite eines felsigen Hügels beim Dorf verzeichnete er Reihen grober Menschenfiguren, die in den Fels gemeißelt sind, und der Survey of Western Palestine vermerkte einige griechische Buchstaben auf einem Stein des Wassertrogs an der Quelle. Eusebius führte Kana im Onomastikon als Stadt Assers nahe Groß-Sidon und hielt es für das Kana, wo Jesus Wasser in Wein verwandelte, die Heimat Nathanaels. Hieronymus wiederholte das in seiner lateinischen Fassung."
  fr:
    - "Kana, « roseaux », était une ville de la frontière nord d’Aser, nommée une fois dans la liste de ses villes : « et vers Ébron, Rehob, Hammon et Kana, jusqu’à Sidon la grande ». Elle se distingue du torrent de Kana entre Éphraïm et Manassé et de Cana de Galilée dans l’Évangile de Jean. Edward Robinson l’identifia avec Qana, grand village sur une hauteur à environ 10 km au sud-est de Tyr, dans le sud du Liban, qui garde le nom ; il y a de nombreuses ruines antiques alentour."
    - "Le Survey of Western Palestine décrivit en 1881 Qana comme un grand village de maisons bien bâties, en partie chrétien et en partie musulman, parmi les oliviers et les figuiers, avec une église et deux sources ; Victor Guérin, quelques années plus tôt, avait trouvé son quartier le plus haut et le plus ancien, Kana el-Foqa, presque abandonné. Une ancienne tradition locale tient Qana pour la Cana où Jésus changea l’eau en vin, thèse exposée dans l’article Cana."
    - "Les rochers autour de Qana sont couverts d’ouvrages antiques. Ernest Renan, qui explora la région pour sa Mission de Phénicie, rencontra à chaque pas, entre le monument appelé tombeau d’Hiram et Qana, des ouvrages taillés dans le roc, par centaines : tombeaux, grottes, pressoirs, chambres et bassins. Sur la face nord d’une colline rocheuse près du village, il releva des rangées de figures humaines grossières sculptées dans le roc, et le Survey of Western Palestine nota quelques lettres grecques sur une pierre de l’abreuvoir de la source. Eusèbe, dans son Onomasticon, compta Kana parmi les villes d’Aser près de Sidon la grande et la prit pour la Cana où Jésus changea l’eau en vin, patrie de Nathanaël. Jérôme le répéta dans sa version latine."
  it:
    - "Cana, «canne», era una città sul confine settentrionale di Aser, nominata una sola volta nell’elenco delle sue città: «verso Ebron, Rehob, Hammon e Kana, fino a Sidon la grande». È distinta dal torrente Cana tra Efraim e Manasse e dalla Cana di Galilea del Vangelo di Giovanni. Edward Robinson la identificò con Qana, un grande villaggio in posizione elevata a circa 10 km a sud-est di Tiro, nel Libano meridionale, che ne conserva il nome; vi sono molte antiche rovine intorno."
    - "Il Survey of Western Palestine nel 1881 descrisse Qana come un grande villaggio di case ben costruite, in parte cristiano e in parte musulmano, tra ulivi e fichi, con una chiesa e due sorgenti; Victor Guérin, pochi anni prima, aveva trovato quasi abbandonato il suo quartiere più alto e più antico, Kana el-Foqa. Un’antica tradizione locale sostiene che Qana fosse la Cana dove Gesù trasformò l’acqua in vino, pretesa esposta nella voce Cana."
    - "Le rocce intorno a Qana sono piene di opere antiche. Ernest Renan, esplorando la zona per la sua Mission de Phénicie, incontrò a ogni passo, tra il monumento detto Tomba di Hiram e Qana, opere scavate nella roccia a centinaia: tombe, grotte, torchi, camere e vasche. Sulla parete nord di un colle roccioso presso il villaggio registrò file di rozze figure umane scolpite nella roccia, e il Survey of Western Palestine notò alcune lettere greche su una pietra dell’abbeveratoio presso la sorgente. Eusebio, nel suo Onomasticon, elencò Cana tra le città di Aser vicino a Sidon la grande e la identificò con la Cana dove Gesù trasformò l’acqua in vino, patria di Natanaele. Girolamo lo ripeté nella sua versione latina."
  nl:
    - "Kana, ‘riet’, was een stad op de noordgrens van Aser, eenmaal genoemd in de lijst van zijn steden: “En Ebron, en Rehob, en Hammon, en Kana, tot aan groot Sidon.” Het is te onderscheiden van de beek Kana tussen Efraïm en Manasse en van Kana in Galilea in het Johannesevangelie. Edward Robinson vereenzelvigde het met Qana, een groot dorp op hoge grond ongeveer 10 km ten zuidoosten van Tyrus in Zuid-Libanon, dat de naam bewaart; er zijn veel antieke ruïnes omheen."
    - "De Survey of Western Palestine beschreef Qana in 1881 als een groot dorp met goed gebouwde huizen, deels christelijk en deels moslim, tussen olijfbomen en vijgenbomen, met een kerk en twee bronnen; Victor Guérin vond enkele jaren eerder de hoogste en oudste wijk, Kana el-Foqa, bijna verlaten. Een oude plaatselijke overlevering houdt Qana voor het Kana waar Jezus water in wijn veranderde, een bewering die in het artikel over Kana wordt uiteengezet."
    - "De rotsen rond Qana zijn vol oude werken. Ernest Renan, die de streek verkende voor zijn Mission de Phénicie, trof tussen het monument dat het graf van Hiram heet en Qana bij elke stap in de rots uitgehouwen werken aan, bij honderden: graven, grotten, persen, kamers en bekkens. Op de noordwand van een rotsheuvel bij het dorp beschreef hij rijen ruwe mensenfiguren die in de rots zijn uitgehakt, en de Survey of Western Palestine zag enkele Griekse letters op een steen van de drinkbak bij de bron. Eusebius noemde Kana in zijn Onomasticon een stad van Aser bij groot Sidon en hield het voor het Kana waar Jezus water in wijn veranderde, de woonplaats van Natanaël. Hiëronymus herhaalde dit in zijn Latijnse versie."
  pl:
    - "Kana, „trzciny”, było miastem na północnej granicy Aszera, wymienionym raz na liście jego miast: „I do Hebronu, i Rohob, i Hamon, i Kana, aż do Sydonu wielkiego”. Różni się od potoku Kana między Efraimem a Manassesem i od Kany Galilejskiej w Ewangelii Jana. Edward Robinson utożsamił je z Kana, dużą wsią na wzniesieniu około 10 km na południowy wschód od Tyru w południowym Libanie, która zachowuje nazwę; wokół niej jest wiele starożytnych ruin."
    - "Survey of Western Palestine w 1881 roku opisał Kana jako dużą wieś dobrze zbudowanych domów, częściowo chrześcijańską, a częściowo muzułmańską, wśród oliw i fig, z kościołem i dwoma źródłami; Victor Guérin kilka lat wcześniej zastał jej najwyższą i najstarszą dzielnicę, Kana al-Fuqa, prawie opuszczoną. Stara miejscowa tradycja głosi, że Kana była tą Kaną, w której Jezus zamienił wodę w wino, o czym mowa w haśle Kana Galilejska."
    - "Skały wokół Kana pełne są starożytnych prac. Ernest Renan, badając okolicę na potrzeby swojej Mission de Phénicie, na każdym kroku między pomnikiem zwanym grobem Hirama a Kana spotykał wykute w skale dzieła, setkami: groby, jaskinie, tłocznie, komory i baseny. Na północnej ścianie skalistego wzgórza przy wsi opisał rzędy prymitywnych postaci ludzkich wykutych w skale, a Survey of Western Palestine odnotował kilka greckich liter na kamieniu koryta przy źródle. Euzebiusz w Onomastikonie wymienił Kanę jako miasto Aszera blisko wielkiego Sydonu i uznał ją za Kanę, w której Jezus zamienił wodę w wino, ojczyznę Natanaela. Hieronim powtórzył to w swojej wersji łacińskiej."
  cs:
    - "Kána, „rákosí“, bylo město na severní hranici Ašeru, jmenované jednou v seznamu jeho měst: „A do Ebron a Rohob, a Hamon a Kána až do Sidonu velikého“. Je odlišná od potoka Kána mezi Efrajimem a Manasesem a od Kány Galilejské v Janově evangeliu. Edward Robinson ji ztotožnil s Kánou, velkou vesnicí na vyvýšeném místě asi 10 km jihovýchodně od Týru v jižním Libanonu, která jméno zachovala; kolem ní je mnoho starověkých zřícenin."
    - "Průzkum západní Palestiny roku 1881 popsal Kánu jako velkou vesnici dobře postavených domů, zčásti křesťanskou a zčásti muslimskou, mezi olivami a fíky, s kostelem a dvěma prameny; Victor Guérin o několik let dříve shledal její nejvyšší a nejstarší čtvrť, Kana el-Foqa, téměř opuštěnou. Stará místní tradice tvrdí, že Kána byla tou Kánou, kde Ježíš proměnil vodu ve víno, což je tvrzení vyložené v článku o Káně."
    - "Skály kolem Kány jsou plné starověkých děl. Ernest Renan, který oblast prozkoumal pro své dílo Mission de Phénicie, potkával mezi památkou zvanou Chíramův hrob a Kánou na každém kroku díla vytesaná do skály, po stovkách: hroby, jeskyně, lisy, komory a nádrže. Na severní stěně skalnatého pahorku u vesnice zaznamenal řady hrubých lidských postav vytesaných do skály a Průzkum západní Palestiny si všiml několika řeckých písmen na kameni koryta u pramene. Eusebios v Onomastikonu uvedl Kánu jako město Ašeru u velikého Sidonu a pokládal ji za Kánu, kde Ježíš proměnil vodu ve víno, domov Natanaele. Jeroným to zopakoval ve svém latinském překladu."
  sv:
    - "Kana, ”vass”, var en stad vid Ashers norra gräns, nämnd en gång i förteckningen över dess städer: ”Ebron, Rehob, Hammon och Kana, ända upp till Stora Sidon”. Den är skild från Kanabäcken mellan Efraim och Manasse och från Kana i Galileen i Johannesevangeliet. Edward Robinson identifierade den med Qana, en stor by på hög mark omkring 10 km sydost om Tyros i södra Libanon, som bevarar namnet; det finns många antika ruiner runt den."
    - "The Survey of Western Palestine beskrev 1881 Qana som en stor by med välbyggda hus, delvis kristen och delvis muslimsk, bland oliver och fikon, med en kyrka och två källor; Victor Guérin fann några år tidigare dess högsta och äldsta kvarter, Kana el-Foqa, nästan övergivet. En gammal lokal tradition håller före att Qana var det Kana där Jesus förvandlade vatten till vin, ett påstående som redovisas i artikeln om Kana."
    - "Klipporna kring Qana är fulla av forntida arbeten. Ernest Renan, som undersökte trakten för sin Mission de Phénicie, mötte vid varje steg mellan monumentet som kallas Hirams grav och Qana verk huggna i berget, i hundratal: gravar, grottor, pressar, kammare och bassänger. På norrsidan av en klippig kulle nära byn beskrev han rader av grova människofigurer huggna i klippan, och The Survey of Western Palestine noterade några grekiska bokstäver på en sten i vattentråget vid källan. Eusebios förde i sitt Onomastikon upp Kana som en stad i Asher nära Stora Sidon och tog den för det Kana där Jesus förvandlade vatten till vin, Natanaels hem. Hieronymus upprepade detta i sin latinska version."
  nb:
    - "Kana, «siv», var en by på den nordlige grensen til Asjer, nevnt én gang i listen over dens byer: «Ebron og Rehob og Hammon og Kana, helt til det store Sidon». Den er forskjellig fra Kana-bekken mellom Efraim og Manasse og fra Kana i Galilea i Johannesevangeliet. Edward Robinson identifiserte den med Qana, en stor landsby på høytliggende grunn omkring 10 km sørøst for Tyros i Sør-Libanon, som har beholdt navnet; det finnes mange eldgamle ruiner rundt den."
    - "Survey of Western Palestine beskrev i 1881 Qana som en stor landsby med velbygde hus, dels kristen og dels muslimsk, blant oliven og fiken, med en kirke og to kilder; Victor Guérin fant noen år tidligere dens høyeste og eldste bydel, Kana el-Foqa, nesten forlatt. En gammel lokal tradisjon mener at Qana var Kana der Jesus gjorde vann til vin, en påstand som er framlagt i artikkelen om Kana."
    - "Klippene rundt Qana er fulle av eldgamle arbeider. Ernest Renan, som utforsket distriktet for sin Mission de Phénicie, møtte ved hvert skritt mellom monumentet som kalles Hirams grav og Qana verk hogd i fjellet, i hundrevis: graver, huler, presser, kamre og bassenger. På nordsiden av en steinete haug ved landsbyen beskrev han rekker av grove menneskefigurer hogd i fjellet, og Survey of Western Palestine noterte noen greske bokstaver på en stein i vanntrauet ved kilden. Eusebios førte i sitt Onomastikon opp Kana som en by i Asjer nær det store Sidon og tok den for det Kana der Jesus gjorde vann til vin, Natanaels hjemsted. Hieronymus gjentok dette i sin latinske versjon."
  tl:
    - "Ang Cana, “mga tambo”, ay bayan sa hilagang hangganan ng Aser, na minsan lamang binanggit sa talaan ng mga bayan nito: “At Hebron, at Rehob, at Hammon, at Cana, hanggang sa malaking Sidon”. Hiwalay ito sa batis ng Cana sa pagitan ng Ephraim at Manases at sa Cana ng Galilea sa Ebanghelyo ni Juan. Kinilala ito ni Edward Robinson sa Qana, isang malaking nayon sa mataas na lupa mga 10 km sa timog-silangan ng Tiro sa katimugang Libano, na nagtataglay ng pangalan; maraming sinaunang guho sa paligid nito."
    - "Inilarawan ng Survey of Western Palestine noong 1881 ang Qana bilang malaking nayon ng mga bahay na mahusay ang pagkakagawa, bahagyang Kristiyano at bahagyang Muslim, sa gitna ng mga olibo at igos, na may simbahan at dalawang bukal; ilang taon bago nito, natagpuan ni Victor Guérin na halos abandonado ang pinakamataas at pinakamatandang purok nito, ang Kana el-Foqa. Isang lumang tradisyon sa lugar ang nagsasabing ang Qana ang Cana kung saan ginawang alak ni Jesus ang tubig, isang pahayag na inilatag sa artikulo tungkol sa Cana."
    - "Puno ng sinaunang gawa ang mga bato sa paligid ng Qana. Si Ernest Renan, na nagsuri sa pook para sa kaniyang Mission de Phénicie, ay nakatagpo sa bawat hakbang, mula sa monumentong tinatawag na Libingan ni Hiram hanggang Qana, ng daan-daang gawang inukit sa bato: mga libingan, yungib, pigaan, silid at tipunan ng tubig. Sa hilagang mukha ng isang mabatong burol malapit sa nayon, itinala niya ang mga hanay ng magaspang na pigura ng tao na inukit sa bato, at napansin ng Survey of Western Palestine ang ilang titik na Griyego sa isang bato ng painuman sa bukal. Itinala ni Eusebio sa kaniyang Onomasticon ang Cana bilang bayan ng Aser malapit sa malaking Sidon at itinuring itong Cana kung saan ginawang alak ni Jesus ang tubig, ang bayan ni Natanael. Inulit ito ni Jeronimo sa kaniyang bersiyong Latin."
  da:
    - "Kana, »rør«, var en by på Asers nordgrænse, nævnt én gang i opregningen af dens byer: »og Ebron og Rehob og Hammon og Kana, indtil det store Zidon«. Den er forskellig fra bækken Kana mellem Efraim og Manasse og fra Kana i Galilæa i Johannesevangeliet. Edward Robinson identificerede den med Qana, en stor landsby på højt terræn omkring 10 km sydøst for Tyrus i det sydlige Libanon, som bevarer navnet; der er mange oldtidsruiner omkring den."
    - "The Survey of Western Palestine beskrev i 1881 Qana som en stor landsby med velbyggede huse, dels kristen og dels muslimsk, mellem oliventræer og figentræer, med en kirke og to kilder; Victor Guérin fandt nogle år tidligere dens højeste og ældste kvarter, Kana el-Foqa, næsten forladt. En gammel lokal tradition hævder, at Qana var det Kana, hvor Jesus forvandlede vand til vin, en påstand, der er fremsat i artiklen om Kana."
    - "Klipperne omkring Qana er fulde af oldtidsarbejder. Ernest Renan, der udforskede egnen til sin Mission de Phénicie, mødte ved hvert skridt mellem monumentet kaldet Hirams grav og Qana værker hugget i klippen, i hundredvis: grave, huler, perser, kamre og bassiner. På nordsiden af en klippehøj ved landsbyen beskrev han rækker af grove menneskefigurer hugget i klippen, og The Survey of Western Palestine noterede nogle græske bogstaver på en sten i vandtruget ved kilden. Eusebios opførte i sit Onomastikon Kana som en by i Aser nær det store Zidon og tog den for det Kana, hvor Jesus forvandlede vand til vin, Natanaels hjem. Hieronymus gentog dette i sin latinske version."
  sr:
    - "Кана, „трске“, био је град на северној међи Асира, једном наведен у списку његових градова: „и Хеврон и Реов и Амон и Кана скроз до Сидона великог“. Разликује се од потока Кане између Јефрема и Манасије и од Кане Галилејске у Јовановом јеванђељу. Едвард Робинсон ју је поистоветио с Каном, великим селом на узвишици око 10 км југоисточно од Тира у јужном Ливану, које чува име; око њега има много древних рушевина."
    - "Survey of Western Palestine из 1881. описао је Кану као велико село добро грађених кућа, делом хришћанско, делом муслиманско, међу маслинама и смоквама, с црквом и два извора; Виктор Герен, неколико година раније, нашао је њену највишу и најстарију четврт, Кана ел-Фока, готово напуштену. Старо локално предање држи да је Кана била она Кана где је Исус претворио воду у вино, што је изложено у чланку о Кани Галилејској."
    - "Стене око Кане пуне су древних радова. Ернест Ренан, који је истраживао крај за своје дело Mission de Phénicie, на сваком кораку између споменика званог Хирамов гроб и Кане наилазио је на дела исклесана у стени, на стотине: гробове, пећине, муљаче, одаје и базене. На северној страни стеновитог брда крај села описао је редове грубих људских ликова исклесаних у стени, а Survey of Western Palestine забележио је неколико грчких слова на камену појила крај извора. Јевсевије је у Ономастикону навео Кану као град Асира близу великог Сидона и сматрао је оном Каном где је Исус претворио воду у вино, завичајем Натанаила. Јероним је то поновио у свом латинском преводу."
  hu:
    - "Kána, „nádasok”, város volt Áser északi határán, amelyet egyszer neveznek meg a városai jegyzékében: „És Ebronnak, Rehobnak, Hammonnak és Kánának a nagy Czidonig”. Különbözik az Efraim és Manassé között folyó Kána-pataktól és János evangéliumának galileai Kánájától. Edward Robinson a Qanával azonosította, egy nagy faluval, magasabb fekvésen, Tírusztól mintegy 10 km-re délkeletre, Dél-Libanonban, amely megőrizte a nevet; körülötte sok ókori rom van."
    - "A Survey of Western Palestine 1881-ben a Qanát jó házakból álló nagy falunak írta le, részben keresztény, részben muszlim lakossággal, olajfák és fügefák között, templommal és két forrással; Victor Guérin néhány évvel korábban legmagasabb és legrégibb negyedét, a Kana el-Foqát szinte elhagyatottnak találta. Egy régi helyi hagyomány szerint a Qana az a Kána, ahol Jézus a vizet borrá változtatta; ezt az állítást a Kánáról szóló cikk ismerteti."
    - "A Qana körüli sziklák tele vannak ókori munkákkal. Ernest Renan, aki a Mission de Phénicie című művéhez járta be a vidéket, a Hírám sírjának nevezett emlékmű és Qana között minden lépésnél sziklába vágott alkotásokra bukkant, százával: sírokra, barlangokra, présekre, kamrákra és medencékre. A falu melletti sziklás domb északi oldalán durva, sziklába faragott emberalakok sorait jegyezte fel, a Survey of Western Palestine pedig néhány görög betűt látott a forrásnál álló itatóvályú egyik kövén. Eusebios az Onomasztikonban Áser városaként sorolta fel Kánát a nagy Szidón közelében, és azt a Kánát látta benne, ahol Jézus a vizet borrá változtatta, Natánael otthonát. Jeromos ezt latin változatában megismételte."
  fi:
    - "Kana, ”ruokoja”, oli Asserin pohjarajalla sijainnut kaupunki, joka mainitaan kerran sen kaupunkien luettelossa: ”Ebroniin, Rehobiin, Hammoniin ja Kaanaan, aina suureen Siidoniin saakka”. Se on eri paikka kuin Kana-puro Efraimin ja Manassen välillä ja Johanneksen evankeliumin Galilean Kaana. Edward Robinson tunnisti sen paikaksi Qana, suuri kylä korkealla maalla noin 10 km Tyroksesta kaakkoon Etelä-Libanonissa, joka on säilyttänyt nimen; sen ympärillä on paljon muinaisia raunioita."
    - "Survey of Western Palestine kuvasi vuonna 1881 Qanan suureksi kyläksi, jossa oli hyvin rakennettuja taloja, osin kristittyjä ja osin muslimeja, oliivi- ja viikunapuiden keskellä, kirkko ja kaksi lähdettä; Victor Guérin oli muutamia vuosia aiemmin havainnut sen korkeimman ja vanhimman kaupunginosan, Kana el-Foqan, lähes hylätyksi. Vanha paikallinen perimätieto pitää Qanaa Kaanana, jossa Jeesus muutti veden viiniksi; väite on esitetty Kaanaa käsittelevässä artikkelissa."
    - "Qanan ympäristön kallioissa on runsaasti muinaisia töitä. Ernest Renan, joka tutki seutua teostaan Mission de Phénicie varten, kohtasi Hiramin haudaksi kutsutun muistomerkin ja Qanan välillä joka askeleella kallioon hakattuja töitä, satamäärin: hautoja, luolia, puristimia, kammioita ja altaita. Kylän lähellä olevan kallioisen kukkulan pohjoisrinteeltä hän kirjasi rivejä karkeita, kallioon hakattuja ihmishahmoja, ja Survey of Western Palestine pani merkille muutamia kreikkalaisia kirjaimia lähteen juottokaukalon kivessä. Eusebios luetteli Onomastikonissaan Kanan Asserin kaupungiksi suuren Siidonin lähellä ja piti sitä Kaanana, jossa Jeesus muutti veden viiniksi, Natanaelin kotipaikkana. Hieronymus toisti tämän latinankielisessä versiossaan."
  vi:
    - "Ca-na, nghĩa là “sậy”, là một thành ở biên giới phía bắc của A-se, được nêu một lần trong danh sách các thành của chi phái: “Ếp-rôn, Rê-hốp, Ham-môn, và Ca-na, cho đến thành lớn Si-đôn”. Thành khác với khe Ca-na giữa Ép-ra-im và Ma-na-se và với Ca-na xứ Ga-li-lê trong Phúc Âm Giăng. Edward Robinson đồng nhất nơi này với Qana, một làng lớn trên đất cao cách Ty-rơ khoảng 10 km về phía đông nam, ở nam Li-ban, vẫn giữ tên; quanh làng có nhiều di tích cổ."
    - "Survey of Western Palestine năm 1881 mô tả Qana là một làng lớn có những ngôi nhà xây tốt, một phần là người Cơ Đốc, một phần là người Hồi giáo, giữa các vườn ô-liu và vả, có một nhà thờ và hai mạch nước; Victor Guérin, vài năm trước đó, thấy khu cao nhất và cổ nhất của làng, Kana el-Foqa, gần như bị bỏ hoang. Một truyền thống địa phương lâu đời cho rằng Qana là Ca-na nơi Giê-su biến nước thành rượu, một ý kiến được trình bày trong bài về Ca-na."
    - "Đá quanh Qana đầy những công trình cổ. Ernest Renan, khi khảo sát vùng này cho bộ Mission de Phénicie, gặp ở mỗi bước, giữa đài được gọi là Mộ Hi-ram và Qana, hàng trăm công trình đục vào đá: mộ, hang, bàn ép, phòng và bể nước. Trên mặt phía bắc của một ngọn đồi đá gần làng, ông ghi lại những hàng hình người thô sơ chạm vào đá, và Survey of Western Palestine ghi nhận vài chữ Hy Lạp trên một tảng đá của máng nước ở mạch nước. Eusebius, trong Onomasticon, ghi Ca-na là một thành của A-se gần thành lớn Si-đôn và cho đó là Ca-na nơi Giê-su biến nước thành rượu, quê của Na-tha-na-ên. Jerome lặp lại điều này trong bản tiếng La-tinh của ông."
  ro:
    - "Cana, „trestii”, era o cetate la hotarul de nord al lui Așer, numită o singură dată în lista cetăților sale: „Ahran, Roov, Amon și Kana până la Sidonul cel mare”. Este deosebită de pârâul Cana dintre Efraim și Manase și de Cana Galileii din Evanghelia după Ioan. Edward Robinson a identificat-o cu Qana, un sat mare pe un loc înalt, la circa 10 km sud-est de Tir, în sudul Libanului, care păstrează numele; în jurul lui se află multe ruine antice."
    - "Survey of Western Palestine a descris în 1881 Qana ca pe un sat mare cu case bine zidite, în parte creștin și în parte musulman, printre măslini și smochini, cu o biserică și două izvoare; Victor Guérin, cu câțiva ani mai devreme, găsise cartierul ei cel mai înalt și mai vechi, Kana el-Foqa, aproape părăsit. O veche tradiție locală susține că Qana ar fi Cana în care Isus a prefăcut apa în vin, o pretenție expusă în articolul despre Cana."
    - "Stâncile din jurul satului Qana sunt pline de lucrări antice. Ernest Renan, cercetând ținutul pentru a sa Mission de Phénicie, a întâlnit la fiecare pas, între monumentul numit Mormântul lui Hiram și Qana, lucrări tăiate în stâncă, cu sutele: morminte, peșteri, teascuri, camere și bazine. Pe fața de nord a unui deal stâncos de lângă sat a consemnat șiruri de figuri omenești grosolane sculptate în stâncă, iar Survey of Western Palestine a observat câteva litere grecești pe o piatră a jgheabului de adăpat de la izvor. Eusebiu, în Onomasticon, a trecut Cana printre cetățile lui Așer, lângă Sidonul cel mare, și a socotit-o Cana în care Isus a prefăcut apa în vin, patria lui Natanael. Ieronim a repetat aceasta în versiunea sa latină."
  bg:
    - "Кана, „тръстики“, е бил град на северната граница на Асир, назован веднъж в списъка на неговите градове: „и Еврон, и Роов, и Амон, и Кана до големия Сидон“. Той е различен от потока Кана между Ефрем и Манасия и от Кана Галилейска в Евангелието на Йоан. Едуард Робинсън го отъждествява с Кана, голямо село на възвишение на около 10 км югоизточно от Тир в Южен Ливан, което пази името; около него има много древни развалини."
    - "Survey of Western Palestine от 1881 г. описва Кана като голямо село с добре построени къщи, отчасти християнско и отчасти мюсюлманско, сред маслини и смокини, с църква и два извора; Виктор Герен няколко години по-рано намира най-високия и най-стар негов квартал, Кана ел-Фока, почти изоставен. Стара местна традиция твърди, че Кана е онази Кана, в която Исус претворил водата във вино — твърдение, изложено в статията за Кана."
    - "Скалите около Кана са пълни с древни съоръжения. Ернест Ренан, който проучвал околността за своя труд Mission de Phénicie, на всяка крачка между паметника, наречен гробницата на Хирам, и Кана срещал изсечени в скалата съоръжения, със стотици: гробници, пещери, преси, камери и басейни. На северния склон на скалист хълм край селото той описал редици от груби човешки фигури, изсечени в скалата, а Survey of Western Palestine отбелязал няколко гръцки букви върху камък от коритото при извора. Евсевий в „Ономастикон“ посочил Кана като град на Асир близо до големия Сидон и го смятал за онази Кана, в която Исус претворил водата във вино, родното място на Натанаил. Йероним повторил това в своя латински превод."
