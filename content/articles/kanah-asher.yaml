# Overview article (ADR 0007). Kanah of Asher = Qana south-east of Tyre (Robinson, per the SWP; ISBE); the Lebanese tradition of Cana of John 2 is in cana.yaml. Not the brook Kanah (kanah-brook.yaml). Modern events are left out as outside an article on the biblical place.
id: kanah-asher
place: ac3233c
title:
  en: "Kanah in Asher"
  ru: "Кана в Асире"
  uk: "Кана в Асірі"
  es: "Caná en Aser"
  pt: "Caná em Aser"
  de: "Kana in Asser"
  fr: "Kana (Aser)"
  it: "Cana in Aser"
  nl: "Kana in Aser"
  pl: "Kana w Aszerze"
  cs: "Kána v Ašeru"
  sv: "Kana i Asher"
  nb: "Kana i Asjer"
  tl: "Cana sa Aser"
  da: "Kana i Aser"
  sr: "Кана у Асиру"
body:
  en:
    - "Kanah, “reeds”, was a town on the northern border of Asher, named once in the list of its towns: “And Hebron, and Rehob, and Hammon, and Kanah, even unto great Zidon”. It is distinct from the brook Kanah between Ephraim and Manasseh and from Cana of Galilee in the Gospel of John. Edward Robinson identified it with Qana, a large village on high ground about 10 km south-east of Tyre in southern Lebanon, which keeps the name; there are many ancient ruins around it."
    - "The Survey of Western Palestine in 1881 described Qana as a large village of well-built houses, partly Christian and partly Muslim, among olives and figs, with a church and two springs; Victor Guérin, a few years earlier, found its highest and oldest quarter, Kana el-Foqa, almost abandoned. An old local tradition holds that Qana was the Cana where Jesus turned water into wine, a claim set out in the article on Cana."
  ru:
    - "Кана, «тростник», — город на северной границе Асира, названный однажды в списке его городов: «Еврон, Рехов, Хаммон и Кана, до Сидона великого». Это не поток Кана между Ефремом и Манассией и не Кана Галилейская Евангелия от Иоанна. Эдвард Робинсон отождествил её с Каной — большим селением на возвышенности примерно в 10 км к юго-востоку от Тира на юге Ливана, сохранившим имя; вокруг него много древних развалин."
    - "«Обзор Западной Палестины» в 1881 г. описывал Кану как большое селение из добротных домов, отчасти христианское, отчасти мусульманское, среди олив и смоковниц, с церковью и двумя источниками; Виктор Герен незадолго до того нашёл её верхний и древнейший квартал, Кана-эль-Фока, почти покинутым. Давнее местное предание считает Кану той Каной, где Иисус претворил воду в вино; это притязание изложено в статье о Кане Галилейской."
  uk:
    - "Кана, «очерет», була містом на північній межі Асіра, названим один раз у переліку його міст: «Геброн, Рехов, Хаммон та Кана, до великого Сидону». Вона відмінна від потоку Кана між Єфремом і Манассією та від Кани Галілейської в Євангелії від Івана. Едвард Робінсон ототожнив її з великим селом Кана на високому місці приблизно за 10 км на південний схід від Тіра на півдні Лівану, яке зберігає назву; довкола нього багато давніх руїн."
    - "«Survey of Western Palestine» 1881 р. описав це село як велике, з добре збудованими будинками, почасти християнське, почасти мусульманське, серед оливок і смокв, із церквою та двома джерелами; Віктор Ґерен кількома роками раніше знайшов його найвищий і найдавніший квартал, Кана-ель-Фока, майже покинутим. Давнє місцеве передання вважає, що це та Кана, де Ісус перетворив воду на вино, — твердження, викладене в статті «Кана Галілейська»."
  es:
    - "Caná, «cañas», era una ciudad en la frontera septentrional de Aser, nombrada una vez en la lista de sus ciudades: «Hebrón, y Rehob, y Hammón, y Cana, hasta la gran Sidón». Es distinta del arroyo de Caná entre Efraín y Manasés y de la Caná de Galilea del Evangelio de Juan. Edward Robinson la identificó con Qana, una gran aldea en terreno alto a unos 10 km al sureste de Tiro, en el sur del Líbano, que conserva el nombre; hay muchas ruinas antiguas a su alrededor."
    - "El Survey of Western Palestine describió en 1881 Qana como una gran aldea de casas bien construidas, en parte cristiana y en parte musulmana, entre olivos e higueras, con una iglesia y dos manantiales; Victor Guérin, pocos años antes, había hallado su barrio más alto y antiguo, Kana el-Foqa, casi abandonado. Una antigua tradición local sostiene que Qana fue la Caná donde Jesús convirtió el agua en vino, afirmación expuesta en el artículo sobre Caná."
  pt:
    - "Caná, “juncos”, era uma cidade na fronteira norte de Aser, nomeada uma vez na lista de suas cidades: “e Ebrom, Reobe, Hamom e Caná, até a grande Sidom”. É distinta do ribeiro de Caná entre Efraim e Manassés e da Caná da Galileia no Evangelho de João. Edward Robinson a identificou com Qana, uma grande aldeia em terreno elevado cerca de 10 km a sudeste de Tiro, no sul do Líbano, que conserva o nome; há muitas ruínas antigas em torno dela."
    - "O Survey of Western Palestine, em 1881, descreveu Qana como uma grande aldeia de casas bem construídas, em parte cristã e em parte muçulmana, entre oliveiras e figueiras, com uma igreja e duas fontes; Victor Guérin, alguns anos antes, encontrou seu bairro mais alto e mais antigo, Kana el-Foqa, quase abandonado. Uma antiga tradição local sustenta que Qana era a Caná onde Jesus transformou água em vinho, afirmação exposta no artigo sobre Caná."
  de:
    - "Kana, „Schilf“, war eine Stadt an der Nordgrenze Assers, einmal in der Liste seiner Städte genannt: „Ebron, Rehob, Hammon, Kana bis an Groß-Sidon“. Es ist vom Bach Kana zwischen Ephraim und Manasse und von Kana in Galiläa im Johannesevangelium zu unterscheiden. Edward Robinson setzte es mit Qana gleich, einem großen Dorf auf einer Anhöhe etwa 10 km südöstlich von Tyrus im Südlibanon, das den Namen bewahrt; rings um es gibt es viele antike Ruinen."
    - "Der Survey of Western Palestine beschrieb Qana 1881 als großes Dorf mit gut gebauten Häusern, teils christlich, teils muslimisch, zwischen Oliven und Feigen, mit einer Kirche und zwei Quellen; Victor Guérin fand einige Jahre früher sein höchstes und ältestes Viertel, Kana el-Fauqa, fast verlassen. Eine alte örtliche Überlieferung hält Qana für das Kana, wo Jesus Wasser in Wein verwandelte, eine Behauptung, die im Artikel über Kana dargelegt wird."
  fr:
    - "Kana, « roseaux », était une ville de la frontière nord d’Aser, nommée une fois dans la liste de ses villes : « et vers Ébron, Rehob, Hammon et Kana, jusqu’à Sidon la grande ». Elle se distingue du torrent de Kana entre Éphraïm et Manassé et de Cana de Galilée dans l’Évangile de Jean. Edward Robinson l’identifia avec Qana, grand village sur une hauteur à environ 10 km au sud-est de Tyr, dans le sud du Liban, qui garde le nom ; il y a de nombreuses ruines antiques alentour."
    - "Le Survey of Western Palestine décrivit en 1881 Qana comme un grand village de maisons bien bâties, en partie chrétien et en partie musulman, parmi les oliviers et les figuiers, avec une église et deux sources ; Victor Guérin, quelques années plus tôt, avait trouvé son quartier le plus haut et le plus ancien, Kana el-Foqa, presque abandonné. Une ancienne tradition locale tient Qana pour la Cana où Jésus changea l’eau en vin, thèse exposée dans l’article Cana."
  it:
    - "Cana, «canne», era una città sul confine settentrionale di Aser, nominata una sola volta nell’elenco delle sue città: «verso Ebron, Rehob, Hammon e Kana, fino a Sidon la grande». È distinta dal torrente Cana tra Efraim e Manasse e dalla Cana di Galilea del Vangelo di Giovanni. Edward Robinson la identificò con Qana, un grande villaggio in posizione elevata a circa 10 km a sud-est di Tiro, nel Libano meridionale, che ne conserva il nome; vi sono molte antiche rovine intorno."
    - "Il Survey of Western Palestine nel 1881 descrisse Qana come un grande villaggio di case ben costruite, in parte cristiano e in parte musulmano, tra ulivi e fichi, con una chiesa e due sorgenti; Victor Guérin, pochi anni prima, aveva trovato quasi abbandonato il suo quartiere più alto e più antico, Kana el-Foqa. Un’antica tradizione locale sostiene che Qana fosse la Cana dove Gesù trasformò l’acqua in vino, pretesa esposta nella voce Cana."
  nl:
    - "Kana, ‘riet’, was een stad op de noordgrens van Aser, eenmaal genoemd in de lijst van zijn steden: “En Ebron, en Rehob, en Hammon, en Kana, tot aan groot Sidon.” Het is te onderscheiden van de beek Kana tussen Efraïm en Manasse en van Kana in Galilea in het Johannesevangelie. Edward Robinson vereenzelvigde het met Qana, een groot dorp op hoge grond ongeveer 10 km ten zuidoosten van Tyrus in Zuid-Libanon, dat de naam bewaart; er zijn veel antieke ruïnes omheen."
    - "De Survey of Western Palestine beschreef Qana in 1881 als een groot dorp met goed gebouwde huizen, deels christelijk en deels moslim, tussen olijfbomen en vijgenbomen, met een kerk en twee bronnen; Victor Guérin vond enkele jaren eerder de hoogste en oudste wijk, Kana el-Foqa, bijna verlaten. Een oude plaatselijke overlevering houdt Qana voor het Kana waar Jezus water in wijn veranderde, een bewering die in het artikel over Kana wordt uiteengezet."
  pl:
    - "Kana, „trzciny”, było miastem na północnej granicy Aszera, wymienionym raz na liście jego miast: „I do Hebronu, i Rohob, i Hamon, i Kana, aż do Sydonu wielkiego”. Różni się od potoku Kana między Efraimem a Manassesem i od Kany Galilejskiej w Ewangelii Jana. Edward Robinson utożsamił je z Kana, dużą wsią na wzniesieniu około 10 km na południowy wschód od Tyru w południowym Libanie, która zachowuje nazwę; wokół niej jest wiele starożytnych ruin."
    - "Survey of Western Palestine w 1881 roku opisał Kana jako dużą wieś dobrze zbudowanych domów, częściowo chrześcijańską, a częściowo muzułmańską, wśród oliw i fig, z kościołem i dwoma źródłami; Victor Guérin kilka lat wcześniej zastał jej najwyższą i najstarszą dzielnicę, Kana al-Fuqa, prawie opuszczoną. Stara miejscowa tradycja głosi, że Kana była tą Kaną, w której Jezus zamienił wodę w wino, o czym mowa w haśle Kana Galilejska."
  cs:
    - "Kána, „rákosí“, bylo město na severní hranici Ašeru, jmenované jednou v seznamu jeho měst: „A do Ebron a Rohob, a Hamon a Kána až do Sidonu velikého“. Je odlišná od potoka Kána mezi Efrajimem a Manasesem a od Kány Galilejské v Janově evangeliu. Edward Robinson ji ztotožnil s Kánou, velkou vesnicí na vyvýšeném místě asi 10 km jihovýchodně od Týru v jižním Libanonu, která jméno zachovala; kolem ní je mnoho starověkých zřícenin."
    - "Průzkum západní Palestiny roku 1881 popsal Kánu jako velkou vesnici dobře postavených domů, zčásti křesťanskou a zčásti muslimskou, mezi olivami a fíky, s kostelem a dvěma prameny; Victor Guérin o několik let dříve shledal její nejvyšší a nejstarší čtvrť, Kana el-Foqa, téměř opuštěnou. Stará místní tradice tvrdí, že Kána byla tou Kánou, kde Ježíš proměnil vodu ve víno, což je tvrzení vyložené v článku o Káně."
  sv:
    - "Kana, ”vass”, var en stad vid Ashers norra gräns, nämnd en gång i förteckningen över dess städer: ”Ebron, Rehob, Hammon och Kana, ända upp till Stora Sidon”. Den är skild från Kanabäcken mellan Efraim och Manasse och från Kana i Galileen i Johannesevangeliet. Edward Robinson identifierade den med Qana, en stor by på hög mark omkring 10 km sydost om Tyros i södra Libanon, som bevarar namnet; det finns många antika ruiner runt den."
    - "The Survey of Western Palestine beskrev 1881 Qana som en stor by med välbyggda hus, delvis kristen och delvis muslimsk, bland oliver och fikon, med en kyrka och två källor; Victor Guérin fann några år tidigare dess högsta och äldsta kvarter, Kana el-Foqa, nästan övergivet. En gammal lokal tradition håller före att Qana var det Kana där Jesus förvandlade vatten till vin, ett påstående som redovisas i artikeln om Kana."
  nb:
    - "Kana, «siv», var en by på den nordlige grensen til Asjer, nevnt én gang i listen over dens byer: «Ebron og Rehob og Hammon og Kana, helt til det store Sidon». Den er forskjellig fra Kana-bekken mellom Efraim og Manasse og fra Kana i Galilea i Johannesevangeliet. Edward Robinson identifiserte den med Qana, en stor landsby på høytliggende grunn omkring 10 km sørøst for Tyros i Sør-Libanon, som har beholdt navnet; det finnes mange eldgamle ruiner rundt den."
    - "Survey of Western Palestine beskrev i 1881 Qana som en stor landsby med velbygde hus, dels kristen og dels muslimsk, blant oliven og fiken, med en kirke og to kilder; Victor Guérin fant noen år tidligere dens høyeste og eldste bydel, Kana el-Foqa, nesten forlatt. En gammel lokal tradisjon mener at Qana var Kana der Jesus gjorde vann til vin, en påstand som er framlagt i artikkelen om Kana."
  tl:
    - "Ang Cana, “mga tambo”, ay bayan sa hilagang hangganan ng Aser, na minsan lamang binanggit sa talaan ng mga bayan nito: “At Hebron, at Rehob, at Hammon, at Cana, hanggang sa malaking Sidon”. Hiwalay ito sa batis ng Cana sa pagitan ng Ephraim at Manases at sa Cana ng Galilea sa Ebanghelyo ni Juan. Kinilala ito ni Edward Robinson sa Qana, isang malaking nayon sa mataas na lupa mga 10 km sa timog-silangan ng Tiro sa katimugang Libano, na nagtataglay ng pangalan; maraming sinaunang guho sa paligid nito."
    - "Inilarawan ng Survey of Western Palestine noong 1881 ang Qana bilang malaking nayon ng mga bahay na mahusay ang pagkakagawa, bahagyang Kristiyano at bahagyang Muslim, sa gitna ng mga olibo at igos, na may simbahan at dalawang bukal; ilang taon bago nito, natagpuan ni Victor Guérin na halos abandonado ang pinakamataas at pinakamatandang purok nito, ang Kana el-Foqa. Isang lumang tradisyon sa lugar ang nagsasabing ang Qana ang Cana kung saan ginawang alak ni Jesus ang tubig, isang pahayag na inilatag sa artikulo tungkol sa Cana."
  da:
    - "Kana, »rør«, var en by på Asers nordgrænse, nævnt én gang i opregningen af dens byer: »og Ebron og Rehob og Hammon og Kana, indtil det store Zidon«. Den er forskellig fra bækken Kana mellem Efraim og Manasse og fra Kana i Galilæa i Johannesevangeliet. Edward Robinson identificerede den med Qana, en stor landsby på højt terræn omkring 10 km sydøst for Tyrus i det sydlige Libanon, som bevarer navnet; der er mange oldtidsruiner omkring den."
    - "The Survey of Western Palestine beskrev i 1881 Qana som en stor landsby med velbyggede huse, dels kristen og dels muslimsk, mellem oliventræer og figentræer, med en kirke og to kilder; Victor Guérin fandt nogle år tidligere dens højeste og ældste kvarter, Kana el-Foqa, næsten forladt. En gammel lokal tradition hævder, at Qana var det Kana, hvor Jesus forvandlede vand til vin, et krav, der er fremlagt i artiklen om Kana."
  sr:
    - "Кана, „трске“, био је град на северној међи Асира, једном наведен у списку његових градова: „и Хеврон и Реов и Амон и Кана скроз до Сидона великог“. Разликује се од потока Кане између Јефрема и Манасије и од Кане Галилејске у Јовановом јеванђељу. Едвард Робинсон ју је поистоветио с Каном, великим селом на узвишици око 10 км југоисточно од Тира у јужном Ливану, које чува име; око њега има много древних рушевина."
    - "Survey of Western Palestine из 1881. описао је Кану као велико село добро грађених кућа, делом хришћанско, делом муслиманско, међу маслинама и смоквама, с црквом и два извора; Виктор Герен, неколико година раније, нашао је њену највишу и најстарију четврт, Кана ел-Фока, готово напуштену. Старо локално предање држи да је Кана била она Кана где је Исус претворио воду у вино, што је изложено у чланку о Кани Галилејској."
scripture:
  - Josh.19.28
sources:
