# Overview article (ADR 0007). Mainstream facts only; the site is unknown and the app's six candidates are named without choosing.
id: hormah
place: ada25df
title:
  en: "Hormah"
  ru: "Хорма"
body:
  en:
    - "Hormah was a Canaanite town in the Negeb, the dry country south of the Judean hills, somewhere between Beersheba and Arad. Its name is from the Hebrew herem, the ban that devotes a thing to destruction, and the Bible gives two accounts of how it got it: after the victory over the king of Arad Israel “utterly destroyed them and their cities: and he called the name of the place Hormah”; and in the days of the judges Judah and Simeon took Zephath “and utterly destroyed it. And the name of the city was called Hormah”. Before that, Hormah was the limit of Israel's first, forbidden attempt on the land, when the Amalekites and Canaanites “smote them, and discomfited them, even unto Hormah”."
    - "Joshua's list of defeated kings pairs “the king of Hormah” with the king of Arad; the town is counted among the southern towns of Judah and again in the lot of Simeon, and David, from Ziklag, sent part of the Amalekite spoil “to them which were in Hormah”. Nothing more is heard of it."
    - "The site is not known, and six mounds in the Beersheba valley and on its edges have been proposed. The usual favourite is Tel Masos (Khirbet el-Meshash), a large unwalled settlement of the twelfth and eleventh centuries BC dug by Fritz and Kempinski in 1972–1975; others prefer Tel Halif (Lahav) on the edge of the hills, Tel Malhata, Tell esh-Sharia (Tel Sera') further west, Tel Ira or Tell Beit Mirsim. None has yielded its name, and the ancient notices do not settle it. The valley is farmed with irrigation today, between Beersheba, Israel's desert city, and the Bedouin towns around it."
  ru:
    - "Хорма была ханаанским городом в Негеве, сухом крае к югу от Иудейских гор, где-то между Вирсавией и Арадом. Имя происходит от еврейского херем — заклятия, обрекающего что-либо на истребление, и Библия дважды объясняет, откуда оно: после победы над царём Арада Израиль «положил заклятие на них и на города их и нарек имя месту тому: Хорма», а во дни судей Иуда с Симеоном взяли Цефаф «и предали его заклятию, и оттого называется город сей Хорма». Ещё раньше Хорма была пределом первой, запрещённой попытки Израиля войти в землю, когда Амаликитяне и Хананеи «разбили их, и гнали их до Хормы»."
    - "Список побеждённых Иисусом Навином царей ставит «царь Хормы» рядом с царём Арада; город числится среди южных городов Иуды и снова в уделе Симеона, а Давид из Секелага послал часть амаликитской добычи старейшинам «в Хорме». Больше о ней ничего не слышно."
    - "Место неизвестно, и предлагали шесть холмов в долине Беэр-Шевы и по её краям. Чаще всего называют Тель-Масос (Хирбет-эль-Мешаш), большое неукреплённое поселение XII–XI веков до н. э., которое Фриц и Кемпински раскапывали в 1972–1975 годах; другие предпочитают Тель-Халиф (Лахав) на краю гор, Тель-Малхату, Телль-эш-Шариа (Тель-Сера) западнее, Тель-Иру или Телль-Бейт-Мирсим. Ни один не выдал своего имени, и древние свидетельства вопроса не решают. Долина сегодня возделывается с орошением, между Беэр-Шевой, пустынным городом Израиля, и бедуинскими городами вокруг неё."
