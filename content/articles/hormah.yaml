body:
  en:
    - "Hormah was a Canaanite town in the Negeb, the dry country south of the Judean hills, somewhere between Beersheba and Arad. Its name is from the Hebrew herem, the ban that devotes a thing to destruction, and the Bible gives two accounts of how it got it: after the victory over the king of Arad Israel “utterly destroyed them and their cities: and he called the name of the place Hormah”; and in the days of the judges Judah and Simeon took Zephath “and utterly destroyed it. And the name of the city was called Hormah”. Before that, Hormah was the limit of Israel's first, forbidden attempt on the land, when the Amalekites and Canaanites “smote them, and discomfited them, even unto Hormah”."
    - "Joshua's list of defeated kings pairs “the king of Hormah” with the king of Arad; the town is counted among the southern towns of Judah and again in the lot of Simeon, and David, from Ziklag, sent part of the Amalekite spoil “to them which were in Hormah”. Nothing more is heard of it."
    - "The site is not known, and six mounds in the Beersheba valley and on its edges have been proposed. The usual favourite is Tel Masos (Khirbet el-Meshash), a large unwalled settlement of the twelfth and eleventh centuries BC dug by Fritz and Kempinski in 1972–1975; others prefer Tel Halif (Lahav) on the edge of the hills, Tel Malhata, Tell esh-Sharia (Tel Sera') further west, Tel Ira or Tell Beit Mirsim. None has yielded its name, and the ancient notices do not settle it. The valley is farmed with irrigation today, between Beersheba, Israel's desert city, and the Bedouin towns around it."
  ru:
    - "Хорма была ханаанским городом в Негеве, сухом крае к югу от Иудейских гор, где-то между Вирсавией и Арадом. Имя происходит от еврейского херем — заклятия, обрекающего что-либо на истребление, и Библия дважды объясняет, откуда оно: после победы над царём Арада Израиль «положил заклятие на них и на города их и нарек имя месту тому: Хорма», а во дни судей Иуда с Симеоном взяли Цефаф «и предали его заклятию, и оттого называется город сей Хорма». Ещё раньше Хорма была пределом первой, запрещённой попытки Израиля войти в землю, когда Амаликитяне и Хананеи «разбили их, и гнали их до Хормы»."
    - "Список побеждённых Иисусом Навином царей ставит «царь Хормы» рядом с царём Арада; город числится среди южных городов Иуды и снова в уделе Симеона, а Давид из Секелага послал часть амаликитской добычи старейшинам «в Хорме». Больше о ней ничего не слышно."
    - "Место неизвестно, и предлагали шесть холмов в долине Беэр-Шевы и по её краям. Чаще всего называют Тель-Масос (Хирбет-эль-Мешаш), большое неукреплённое поселение XII–XI веков до н. э., которое Фриц и Кемпински раскапывали в 1972–1975 годах; другие предпочитают Тель-Халиф (Лахав) на краю гор, Тель-Малхату, Телль-эш-Шариа (Тель-Сера) западнее, Тель-Иру или Телль-Бейт-Мирсим. Ни один не выдал своего имени, и древние свидетельства вопроса не решают. Долина сегодня возделывается с орошением, между Беэр-Шевой, пустынным городом Израиля, и бедуинскими городами вокруг неё."
  uk:
    - "Хорма було ханаанським містом у Негеві, сухому краї на південь від юдейських пагорбів, десь між Беер-Шевою та Арадом. Її назва від давньоєврейського херем, закляття, що присвячує річ на знищення, і Біблія дає два пояснення, як вона її отримала: після перемоги над царем Араду Ізраїль «він знищив їх і городи їх. І назвали врочище те Горма»; а за днів суддів Юда й Симеон узяли Цефат і «роспростерли на нього проклін. Через те проложено йому прізвіще Горма-город». Перед тим Хорма була межею першої, забороненої спроби Ізраїлю на цю землю, коли амаликитяни й ханаанці розбили їх і розпорошили аж до Хорми."
    - "Перелік переможених царів у Книзі Ісуса Навина зіставляє «Царь Хормійський, один» із царем Араду; місто зараховано до південних міст Юди й знову в жереб Симеона, а Давид із Ціклага послав частину амаликитської здобичі «Тим що в Хормі». Більше про нього нічого не чути."
    - "Місце невідоме, і пропонували шість городищ у долині Беер-Шеви та на її краях. Звичайний фаворит — Тель-Масос (Хірбет-ель-Мешаш), велике необнесене поселення XII–XI ст. до н. е., розкопане Фріцем і Кемпінскі в 1972–1975 роках; інші віддають перевагу Тель-Халіфу (Лахав) на краю пагорбів, Тель-Малхаті, Телль-еш-Шарії (Тель-Сера) далі на захід, Тель-Ірі або Телль-Бейт-Мірсіму. Жодне не дало її назви, і давні згадки не вирішують питання. Долина сьогодні обробляється зі зрошенням, між Беер-Шевою, пустельним містом Ізраїлю, та бедуїнськими містами довкола."
  es:
    - "Horma era una población cananea en el Néguev, el país seco al sur de las colinas de Judea, en algún lugar entre Beerseba y Arad. Su nombre procede del hebreo herem, el anatema que consagra algo a la destrucción, y la Biblia da dos relatos de cómo lo recibió: tras la victoria sobre el rey de Arad, Israel «destruyólos á ellos y á sus ciudades; y llamó el nombre de aquel lugar Horma»; y en los días de los jueces Judá y Simeón tomaron Sefat, «y asoláronla: y pusieron por nombre á la ciudad, Horma». Antes de eso, Horma fue el límite del primer intento prohibido de Israel sobre la tierra, cuando los amalecitas y los cananeos «é hiriéronlos y derrotáronlos, persiguiéndolos hasta Horma»."
    - "La lista de reyes derrotados de Josué empareja a «El rey de Horma» con el rey de Arad; la población se cuenta entre las ciudades meridionales de Judá y de nuevo en la suerte de Simeón, y David, desde Siclag, envió parte del botín de los amalecitas «á los que estaban en Horma». No se vuelve a oír nada de ella."
    - "El sitio no se conoce, y se han propuesto seis montículos en el valle de Beerseba y en sus bordes. El favorito habitual es Tel Masos (Khirbet el-Meshash), un gran asentamiento sin muralla de los siglos XII y XI a. C. excavado por Fritz y Kempinski en 1972–1975; otros prefieren Tel Halif (Lahav), en el borde de las colinas, Tel Malhata, Tell esh-Sharia (Tel Sera') más al oeste, Tel Ira o Tell Beit Mirsim. Ninguno ha dado su nombre, y las noticias antiguas no lo resuelven. El valle se cultiva hoy con riego, entre Beerseba, la ciudad del desierto de Israel, y las ciudades beduinas de alrededor."
  pt:
    - "Hormá era uma cidade cananeia no Neguebe, a terra seca ao sul das colinas da Judeia, em algum ponto entre Berseba e Arade. Seu nome vem do hebraico herem, o interdito que consagra algo à destruição, e a Bíblia dá dois relatos de como o recebeu: depois da vitória sobre o rei de Arade, Israel “os destruíram totalmente, junto com as suas cidades. O nome do lugar foi chamado Horma”; e nos dias dos juízes Judá e Simeão tomaram Zefate “e a destruíram totalmente. O nome da cidade foi chamado Horma”. Antes disso, Hormá fora o limite da primeira tentativa de Israel sobre a terra, proibida, quando os amalequitas e os cananeus “os atacaram, e os derrotaram até Horma”."
    - "A lista de reis derrotados de Josué emparelha “o rei de Hormá” com o rei de Arade; a cidade é contada entre as cidades do sul de Judá e de novo na porção de Simeão, e Davi, desde Ziclague, enviou parte dos despojos dos amalequitas “aos que estavam em Hormá”. Nada mais se ouve dela."
    - "O sítio não é conhecido, e seis montes no vale de Berseba e em suas bordas foram propostos. O favorito usual é Tel Masos (Khirbet el-Meshash), um grande povoado sem muralha dos séculos XII e XI a.C. escavado por Fritz e Kempinski em 1972–1975; outros preferem Tel Halif (Lahav), na orla das colinas, Tel Malhata, Tell esh-Sharia (Tel Sera’), mais a oeste, Tel Ira ou Tell Beit Mirsim. Nenhum produziu o seu nome, e as notícias antigas não resolvem a questão. O vale é hoje cultivado com irrigação, entre Berseba, a cidade do deserto de Israel, e as cidades beduínas em torno."
  de:
    - "Horma war eine kanaanitische Stadt im Negev, dem trockenen Land südlich des judäischen Berglands, irgendwo zwischen Beerscheba und Arad. Sein Name kommt vom hebräischen cherem, dem Bann, der etwas der Vernichtung weiht, und die Bibel gibt zwei Berichte, wie es ihn erhielt: Nach dem Sieg über den König von Arad „verbannten sie“ die Kanaaniter „samt ihren Städten und hießen die Stätte Horma“; und in der Richterzeit „schlugen“ Juda und Simeon „die Kanaaniter zu Zephath und verbannten sie und nannten die Stadt Horma“. Zuvor war Horma die Grenze von Israels erstem, verbotenem Versuch auf das Land gewesen, als die Amalekiter und Kanaaniter „schlugen und zersprengten sie bis gen Horma“."
    - "Josuas Liste der besiegten Könige stellt „der König zu Horma“ neben den König von Arad; die Stadt wird zu den Südstädten Judas und noch einmal zum Los Simeons gezählt, und David sandte von Ziklag aus einen Teil der amalekitischen Beute „denen zu Horma“. Weiter hört man nichts von ihr."
    - "Die Stätte ist nicht bekannt, und sechs Hügel im Beerschebatal und an seinen Rändern sind vorgeschlagen worden. Der übliche Favorit ist Tel Masos (Chirbet el-Meschasch), eine große unummauerte Siedlung des 12. und 11. Jahrhunderts v. Chr., 1972–1975 von Fritz und Kempinski ausgegraben; andere bevorzugen Tel Halif (Lachav) am Rand des Berglands, Tel Malhata, Tell esch-Scharia (Tel Sera') weiter westlich, Tel Ira oder Tell Beit Mirsim. Keiner hat seinen Namen geliefert, und die antiken Nachrichten entscheiden es nicht. Das Tal wird heute mit Bewässerung bewirtschaftet, zwischen Beerscheba, Israels Wüstenstadt, und den Beduinenstädten ringsum."
  fr:
    - "Horma était une ville cananéenne du Négev, le pays aride au sud des collines de Judée, quelque part entre Beer-Schéba et Arad. Son nom vient de l’hébreu herem, l’interdit qui voue une chose à la destruction, et la Bible donne deux récits de la manière dont elle le reçut : après la victoire sur le roi d’Arad, « on les dévoua par interdit, eux et leurs villes ; et l’on nomma ce lieu Horma » ; et du temps des juges, Juda et Siméon battirent les Cananéens de Tsephath, « ils dévouèrent la ville par interdit, et on l’appela Horma ». Auparavant, Horma avait été la limite de la première tentative d’Israël sur le pays, interdite, quand les Amalécites et les Cananéens « les battirent, et les taillèrent en pièces jusqu’à Horma »."
    - "La liste des rois vaincus de Josué associe « le roi de Horma » au roi d’Arad ; la ville est comptée parmi les villes méridionales de Juda et de nouveau dans le lot de Siméon, et David, depuis Tsiklag, envoya une partie du butin amalécite « à ceux de Horma ». On n’en entend plus parler."
    - "Le site n’est pas connu, et six tertres de la vallée de Beer-Schéba et de ses bords ont été proposés. Le favori habituel est Tel Masos (Khirbet el-Meshash), grande implantation sans murs des XIIe et XIe siècles av. J.-C. fouillée par Fritz et Kempinski en 1972–1975 ; d’autres préfèrent Tel Halif (Lahav), en bordure des collines, Tel Malhata, Tell esh-Sharia (Tel Sera’) plus à l’ouest, Tel Ira ou Tell Beit Mirsim. Aucun n’a livré son nom, et les notices antiques ne tranchent pas. La vallée est aujourd’hui cultivée en irrigation, entre Beer-Schéba, ville du désert d’Israël, et les villes bédouines alentour."
