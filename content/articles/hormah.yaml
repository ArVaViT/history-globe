body:
  en:
    - "Hormah was a Canaanite town in the Negeb, the dry country south of the Judean hills, probably between Beersheba and Arad. Its name is from the Hebrew herem, the ban that devotes a thing to destruction, and the Bible gives two accounts of how it got it: after the victory over the king of Arad Israel “utterly destroyed them and their cities: and he called the name of the place Hormah”; and in the days of the judges Judah and Simeon took Zephath “and utterly destroyed it. And the name of the city was called Hormah”. Before that, Hormah was the limit of Israel's first, forbidden attempt on the land, when the Amalekites and Canaanites “smote them, and discomfited them, even unto Hormah”."
    - "Joshua's list of defeated kings pairs “the king of Hormah” with the king of Arad; the town is counted among the southern towns of Judah and again in the lot of Simeon, and David, from Ziklag, sent part of the Amalekite spoil “to them which were in Hormah”. Nothing more is heard of it."
    - "The site is not known, and six mounds in the Beersheba valley and on its edges have been proposed. The usual favourite is Tel Masos (Khirbet el-Meshash), a large unwalled settlement of the twelfth and eleventh centuries BC dug by Aharoni, Fritz and Kempinski in 1972–1975; others prefer Tel Halif (Lahav) on the edge of the hills, Tel Malhata, Tell esh-Sharia (Tel Sera') further west, Tel Ira or Tell Beit Mirsim. None has yielded its name, and the ancient notices do not settle it. The valley is farmed with irrigation today, between Beersheba, Israel's desert city, and the Bedouin towns around it."
  ru:
    - "Хорма была ханаанским городом в Негеве, сухом крае к югу от Иудейских гор, вероятно, между Вирсавией и Арадом. Имя происходит от еврейского херем — заклятия, обрекающего что-либо на истребление, и Библия дважды объясняет, откуда оно: после победы над царём Арада Израиль «положил заклятие на них и на города их и нарек имя месту тому: Хорма», а во дни судей Иуда с Симеоном взяли Цефаф «и предали его заклятию, и оттого называется город сей Хорма». Ещё раньше Хорма была пределом первой, запрещённой попытки Израиля войти в землю, когда Амаликитяне и Хананеи «разбили их, и гнали их до Хормы»."
    - "Список побеждённых Иисусом Навином царей ставит «царь Хормы» рядом с царём Арада; город числится среди южных городов Иуды и снова в уделе Симеона, а Давид из Секелага послал часть амаликитской добычи старейшинам «в Хорме». Больше о ней ничего не слышно."
    - "Место неизвестно, и предлагали шесть холмов в долине Беэр-Шевы и по её краям. Чаще всего называют Тель-Масос (Хирбет-эль-Мешаш), большое неукреплённое поселение XII–XI веков до н. э., которое Ахарони, Фриц и Кемпински раскапывали в 1972–1975 годах; другие предпочитают Тель-Халиф (Лахав) на краю гор, Тель-Малхату, Телль-эш-Шариа (Тель-Сера) западнее, Тель-Иру или Телль-Бейт-Мирсим. Ни один не выдал своего имени, и древние свидетельства вопроса не решают. Долина сегодня возделывается с орошением, между Беэр-Шевой, пустынным городом Израиля, и бедуинскими городами вокруг неё."
  uk:
    - "Хорма було ханаанським містом у Негеві, сухому краї на південь від юдейських пагорбів, ймовірно, між Беер-Шевою та Арадом. Її назва від давньоєврейського херем, закляття, що присвячує річ на знищення, і Біблія дає два пояснення, як вона її отримала: після перемоги над царем Араду Ізраїль «він знищив їх і городи їх. І назвали врочище те Горма»; а за днів суддів Юда й Симеон узяли Цефат і «роспростерли на нього проклін. Через те проложено йому прізвіще Горма-город». Перед тим Хорма була межею першої, забороненої спроби Ізраїлю на цю землю, коли амаликитяни й ханаанці розбили їх і розпорошили аж до Хорми."
    - "Перелік переможених царів у Книзі Ісуса Навина зіставляє «Царь Хормійський, один» із царем Араду; місто зараховано до південних міст Юди й знову в жереб Симеона, а Давид із Ціклага послав частину амаликитської здобичі «Тим що в Хормі». Більше про нього нічого не чути."
    - "Місце невідоме, і пропонували шість городищ у долині Беер-Шеви та на її краях. Звичайний фаворит — Тель-Масос (Хірбет-ель-Мешаш), велике необнесене поселення XII–XI ст. до н. е., розкопане Ахароні, Фріцем і Кемпінскі в 1972–1975 роках; інші віддають перевагу Тель-Халіфу (Лахав) на краю пагорбів, Тель-Малхаті, Телль-еш-Шарії (Тель-Сера) далі на захід, Тель-Ірі або Телль-Бейт-Мірсіму. Жодне не дало її назви, і давні згадки не вирішують питання. Долина сьогодні обробляється зі зрошенням, між Беер-Шевою, пустельним містом Ізраїлю, та бедуїнськими містами довкола."
  es:
    - "Horma era una población cananea en el Néguev, el país seco al sur de las colinas de Judea, probablemente entre Beerseba y Arad. Su nombre procede del hebreo herem, el anatema que consagra algo a la destrucción, y la Biblia da dos relatos de cómo lo recibió: tras la victoria sobre el rey de Arad, Israel «destruyólos á ellos y á sus ciudades; y llamó el nombre de aquel lugar Horma»; y en los días de los jueces Judá y Simeón tomaron Sefat, «y asoláronla: y pusieron por nombre á la ciudad, Horma». Antes de eso, Horma fue el límite del primer intento prohibido de Israel sobre la tierra, cuando los amalecitas y los cananeos «é hiriéronlos y derrotáronlos, persiguiéndolos hasta Horma»."
    - "La lista de reyes derrotados de Josué empareja a «El rey de Horma» con el rey de Arad; la población se cuenta entre las ciudades meridionales de Judá y de nuevo en la suerte de Simeón, y David, desde Siclag, envió parte del botín de los amalecitas «á los que estaban en Horma». No se vuelve a oír nada de ella."
    - "El sitio no se conoce, y se han propuesto seis montículos en el valle de Beerseba y en sus bordes. El favorito habitual es Tel Masos (Khirbet el-Meshash), un gran asentamiento sin muralla de los siglos XII y XI a. C. excavado por Aharoni, Fritz y Kempinski en 1972–1975; otros prefieren Tel Halif (Lahav), en el borde de las colinas, Tel Malhata, Tell esh-Sharia (Tel Sera') más al oeste, Tel Ira o Tell Beit Mirsim. Ninguno ha dado su nombre, y las noticias antiguas no lo resuelven. El valle se cultiva hoy con riego, entre Beerseba, la ciudad del desierto de Israel, y las ciudades beduinas de alrededor."
  pt:
    - "Hormá era uma cidade cananeia no Neguebe, a terra seca ao sul das colinas da Judeia, provavelmente entre Berseba e Arade. Seu nome vem do hebraico herem, o interdito que consagra algo à destruição, e a Bíblia dá dois relatos de como o recebeu: depois da vitória sobre o rei de Arade, Israel “os destruíram totalmente, junto com as suas cidades. O nome do lugar foi chamado Horma”; e nos dias dos juízes Judá e Simeão tomaram Zefate “e a destruíram totalmente. O nome da cidade foi chamado Horma”. Antes disso, Hormá fora o limite da primeira tentativa de Israel sobre a terra, proibida, quando os amalequitas e os cananeus “os atacaram, e os derrotaram até Horma”."
    - "A lista de reis derrotados de Josué emparelha “o rei de Hormá” com o rei de Arade; a cidade é contada entre as cidades do sul de Judá e de novo na porção de Simeão, e Davi, desde Ziclague, enviou parte dos despojos dos amalequitas “aos que estavam em Hormá”. Nada mais se ouve dela."
    - "O sítio não é conhecido, e seis montes no vale de Berseba e em suas bordas foram propostos. O favorito usual é Tel Masos (Khirbet el-Meshash), um grande povoado sem muralha dos séculos XII e XI a.C. escavado por Aharoni, Fritz e Kempinski em 1972–1975; outros preferem Tel Halif (Lahav), na orla das colinas, Tel Malhata, Tell esh-Sharia (Tel Sera’), mais a oeste, Tel Ira ou Tell Beit Mirsim. Nenhum produziu o seu nome, e as notícias antigas não resolvem a questão. O vale é hoje cultivado com irrigação, entre Berseba, a cidade do deserto de Israel, e as cidades beduínas em torno."
  de:
    - "Horma war eine kanaanitische Stadt im Negev, dem trockenen Land südlich des judäischen Berglands, wahrscheinlich zwischen Beerscheba und Arad. Sein Name kommt vom hebräischen cherem, dem Bann, der etwas der Vernichtung weiht, und die Bibel gibt zwei Berichte, wie es ihn erhielt: Nach dem Sieg über den König von Arad „verbannten sie“ die Kanaaniter „samt ihren Städten und hießen die Stätte Horma“; und in der Richterzeit „schlugen“ Juda und Simeon „die Kanaaniter zu Zephath und verbannten sie und nannten die Stadt Horma“. Zuvor war Horma die Grenze von Israels erstem, verbotenem Versuch auf das Land gewesen, als die Amalekiter und Kanaaniter „schlugen und zersprengten sie bis gen Horma“."
    - "Josuas Liste der besiegten Könige stellt „der König zu Horma“ neben den König von Arad; die Stadt wird zu den Südstädten Judas und noch einmal zum Los Simeons gezählt, und David sandte von Ziklag aus einen Teil der amalekitischen Beute „denen zu Horma“. Weiter hört man nichts von ihr."
    - "Die Stätte ist nicht bekannt, und sechs Hügel im Beerschebatal und an seinen Rändern sind vorgeschlagen worden. Der übliche Favorit ist Tel Masos (Chirbet el-Meschasch), eine große unummauerte Siedlung des 12. und 11. Jahrhunderts v. Chr., 1972–1975 von Aharoni, Fritz und Kempinski ausgegraben; andere bevorzugen Tel Halif (Lachav) am Rand des Berglands, Tel Malhata, Tell esch-Scharia (Tel Sera') weiter westlich, Tel Ira oder Tell Beit Mirsim. Keiner hat seinen Namen geliefert, und die antiken Nachrichten entscheiden es nicht. Das Tal wird heute mit Bewässerung bewirtschaftet, zwischen Beerscheba, Israels Wüstenstadt, und den Beduinenstädten ringsum."
  fr:
    - "Horma était une ville cananéenne du Négev, le pays aride au sud des collines de Judée, probablement entre Beer-Schéba et Arad. Son nom vient de l’hébreu herem, l’interdit qui voue une chose à la destruction, et la Bible donne deux récits de la manière dont elle le reçut : après la victoire sur le roi d’Arad, « on les dévoua par interdit, eux et leurs villes ; et l’on nomma ce lieu Horma » ; et du temps des juges, Juda et Siméon battirent les Cananéens de Tsephath, « ils dévouèrent la ville par interdit, et on l’appela Horma ». Auparavant, Horma avait été la limite de la première tentative d’Israël sur le pays, interdite, quand les Amalécites et les Cananéens « les battirent, et les taillèrent en pièces jusqu’à Horma »."
    - "La liste des rois vaincus de Josué associe « le roi de Horma » au roi d’Arad ; la ville est comptée parmi les villes méridionales de Juda et de nouveau dans le lot de Siméon, et David, depuis Tsiklag, envoya une partie du butin amalécite « à ceux de Horma ». On n’en entend plus parler."
    - "Le site n’est pas connu, et six tertres de la vallée de Beer-Schéba et de ses bords ont été proposés. Le favori habituel est Tel Masos (Khirbet el-Meshash), grande implantation sans murs des XIIe et XIe siècles av. J.-C. fouillée par Aharoni, Fritz et Kempinski en 1972–1975 ; d’autres préfèrent Tel Halif (Lahav), en bordure des collines, Tel Malhata, Tell esh-Sharia (Tel Sera’) plus à l’ouest, Tel Ira ou Tell Beit Mirsim. Aucun n’a livré son nom, et les notices antiques ne tranchent pas. La vallée est aujourd’hui cultivée en irrigation, entre Beer-Schéba, ville du désert d’Israël, et les villes bédouines alentour."
  pl:
    - "Horma było kananejskim miastem w Negewie, suchym kraju na południe od wzgórz judzkich, prawdopodobnie między Beer-Szebą a Aradem. Jego nazwa pochodzi od hebrajskiego cherem, klątwy poświęcającej coś na zniszczenie, a Biblia podaje dwa opisy, jak ją otrzymało: po zwycięstwie nad królem Aradu Izrael „wytracił je z gruntu, i miasta ich, a nazwał imię onego miejsca Chorma”; a za dni sędziów Juda i Symeon zdobyli Sefat, „a zburzyli je, i nazwali imię miasta onego Horma”. Wcześniej Horma była kresem pierwszej, zakazanej próby Izraela wejścia do kraju, gdy Amalekici i Kananejczycy „porazili je, i gonili je aż do Hormy”."
    - "Wykaz pokonanych królów u Jozuego zestawia króla Hormy z królem Aradu; miasto jest zaliczone do południowych miast Judy i ponownie w losie Symeona, a Dawid z Siklag posłał część amalekickiej zdobyczy do tych, „co byli w Horma”. Nic więcej o nim nie słychać."
    - "Położenie nie jest znane, a zaproponowano sześć pagórków w dolinie Beer-Szeby i na jej skrajach. Zwykłym faworytem jest Tel Masos (Chirbet el-Meszasz), duże niemurowane osiedle z XII i XI w. p.n.e., badane przez Yohanana Aharoniego, Volkmara Fritza i Aharona Kempinskiego w latach 1972–1975; inni wolą Tel Chalif (Lachaw) na skraju wzgórz, Tel Malchata, Tell esz-Szaria (Tel Sera) dalej na zachód, Tel Ira lub Tell Bet Mirsim. Żaden nie dostarczył nazwy, a starożytne wzmianki sprawy nie rozstrzygają. Dolina jest dziś uprawiana z nawadnianiem, między Beer-Szebą, pustynnym miastem Izraela, a beduińskimi miastami wokół niej."
  it:
    - "Corma era una città cananea nel Negheb, la terra arida a sud dei colli di Giuda, probabilmente fra Bersabea e Arad. Il suo nome deriva dall’ebraico herem, il bando che consacra una cosa alla distruzione, e la Bibbia dà due racconti di come lo ricevette: dopo la vittoria sul re di Arad «Israele votò allo sterminio i Cananei e le loro città, e a quel luogo fu posto nome Horma»; e ai giorni dei giudici Giuda e Simeone presero Sefat: «distrussero interamente la città, che fu chiamata Hormah». Prima ancora, Corma fu il limite del primo, vietato tentativo di Israele sul paese, quando gli Amalechiti e i Cananei «li batterono, e li fecero a pezzi fino a Hormah»."
    - "L’elenco dei re sconfitti da Giosuè accoppia «il re di Horma» al re di Arad; la città è annoverata fra le città meridionali di Giuda e di nuovo nel lotto di Simeone, e Davide, da Siclag, mandò parte del bottino amalechita «a quelli di Horma». Di essa non si sente più parlare."
    - "Il sito non è noto, e sono stati proposti sei tell nella valle di Bersabea e ai suoi margini. Il favorito consueto è Tel Masos (Khirbet el-Meshash), un grande insediamento non murato dei secoli XII e XI a.C. scavato da Aharoni, Fritz e Kempinski nel 1972–1975; altri preferiscono Tel Halif (Lahav) al margine delle colline, Tel Malhata, Tell esh-Sharia (Tel Sera’) più a ovest, Tel Ira o Tell Beit Mirsim. Nessuno ha restituito il suo nome, e le notizie antiche non decidono. La valle è oggi coltivata con irrigazione, fra Bersabea, la città del deserto d’Israele, e le città beduine attorno ad essa."
  nl:
    - "Chorma was een Kanaänitische stad in de Negev, het droge land ten zuiden van het Judese bergland, waarschijnlijk tussen Berseba en Arad. De naam komt van het Hebreeuwse cherem, de ban die iets aan vernietiging wijdt, en de Bijbel geeft twee verhalen over hoe zij die kreeg: na de overwinning op de koning van Arad “verbande” hij “hen en hun steden; en hij noemde den naam dier plaats Horma”; en in de dagen van de richters sloegen Juda en Simeon Zefat, “en zij verbanden hen; en men noemde den naam dezer stad Horma”. Daarvoor was Chorma de grens van Israëls eerste, verboden poging om het land binnen te trekken, toen de Amalekieten en Kanaänieten kwamen en “sloegen hen, en versmeten hen, tot Horma toe”."
    - "Jozua’s lijst van verslagen koningen paart “de koning van Horma” aan de koning van Arad; de stad wordt gerekend tot de zuidelijke steden van Juda en opnieuw tot het lot van Simeon, en David stuurde vanuit Ziklag een deel van de Amalekitische buit “tot die te Horma”. Verder wordt er niets van haar vernomen."
    - "De plaats is onbekend, en zes heuvels in de vallei van Berseba en aan de randen ervan zijn voorgesteld. De gebruikelijke favoriet is Tel Masos (Khirbet el-Meshash), een grote onommuurde nederzetting uit de 12e en 11e eeuw v.Chr., opgegraven door Aharoni, Fritz en Kempinski in 1972–1975; anderen geven de voorkeur aan Tel Halif (Lahav) aan de rand van de heuvels, Tel Malhata, Tell esh-Sharia (Tel Sera’) verder westelijk, Tel Ira of Tell Beit Mirsim. Geen heeft de naam opgeleverd, en de oude berichten beslissen het niet. De vallei wordt nu bevloeid bebouwd, tussen Berseba, Israëls woestijnstad, en de bedoeïenensteden eromheen."
  cs:
    - "Chorma bylo kanaánské město v Negevu, suchém kraji jižně od judských hor, pravděpodobně mezi Beer-šebou a Aradem. Jeho jméno je z hebrejského cherem, klatby, která zasvěcuje věc zkáze, a Bible podává dvě vyprávění, jak je získalo: po vítězství nad králem Aradu Izrael „kterýžto do gruntu zkazil je i města jejich, a nazval jméno toho místa Horma“; a za dnů soudců Juda a Simeon dobyli Cefat „a zkazili je. I nazváno jest jméno města toho Horma“. Předtím byla Chorma mezí prvního, zakázaného pokusu Izraele o zemi, kdy Amalechitští a Kananejští „porazili je, a potírali je až do Horma“."
    - "Jozuův seznam poražených králů spojuje „Král Horma“ s králem Aradu; město se počítá mezi jižní města Judy a znovu v losu Simeonově a David ze Siklagu poslal část amalechitské kořisti „I těm, kteříž v Horma“. Nic dalšího se o něm neslyší."
    - "Poloha není známa a navrženo bylo šest pahorků v údolí Beer-šeby a na jeho okrajích. Obvyklým favoritem je Tel Masos (Chirbet el-Meshash), velké neopevněné sídliště z 12. a 11. stol. př. n. l., vykopávané Jochananem Aharonim, Volkmarem Fritzem a Aharonem Kempinskim v letech 1972–1975; jiní dávají přednost Tel Halif (Lahav) na okraji hor, Tel Malhata, Tell esh-Sharia (Tel Sera') dále na západ, Tel Ira nebo Tell Bejt Mirsim. Žádný nepřinesl své jméno a starověké zmínky věc nerozhodují. Údolí je dnes zavlažováno a obdělávano, mezi Beer-šebou, izraelským pouštním městem, a beduínskými městy kolem ní."
  sv:
    - "Horma var en kananeisk stad i Negev, det torra landet söder om de judeiska bergen, sannolikt mellan Beer Sheva och Arad. Dess namn kommer av hebreiskans herem, bannet som vigde något åt förstörelse, och Bibeln ger två berättelser om hur den fick det: efter segern över Arads kung ”de gåvo dem och deras städer till spillo; så fick stället namnet Horma”; och på domarnas tid intog Juda och Simeon Sefat och ”de gåvo staden till spillo; så fick den namnet Horma”. Dessförinnan var Horma gränsen för Israels första, förbjudna försök att inta landet, när amalekiterna och kananéerna ”slogo dem och förskingrade dem och drevo dem ända till Horma”."
    - "Josuas förteckning över besegrade kungar parar ”konungen i Horma” med kungen i Arad; staden räknas bland Judas sydliga städer och åter i Simeons lott, och David sände från Siklag en del av amalekitbytet till ”de äldste i Horma”. Mer hörs inte om den."
    - "Platsen är inte känd, och sex kullar i Beer Sheva-dalen och dess kanter har föreslagits. Den vanliga favoriten är Tel Masos (Khirbet el-Meshash), en stor bosättning utan stadsmur från 1100- och 1000-talen f.Kr. som grävdes av Aharoni, Fritz och Kempinski 1972–1975; andra föredrar Tel Halif (Lahav) i bergens kant, Tel Malhata, Tell esh-Sharia (Tel Sera') längre västerut, Tel Ira eller Tell Beit Mirsim. Ingen har gett sitt namn, och de antika notiserna avgör det inte. Dalen brukas i dag med bevattning, mellan Beer Sheva, Israels ökenstad, och beduinstäderna runt omkring."
  nb:
    - "Horma var en kanaanittisk by i Negev, det tørre landet sør for de judeiske åsene, trolig mellom Beer-Sjeba og Arad. Navnet kommer av det hebraiske herem, bannet som vier noe til ødeleggelse, og Bibelen gir to beretninger om hvordan den fikk det: etter seieren over kongen av Arad Israel «slo dem og deres byer med bann; og de kalte stedet Horma»; og i dommertiden tok Juda og Simeon Sefat: «de slo byen med bann; derfor kalte de den Horma». Før det var Horma grensen for Israels første, forbudte forsøk på landet, da amalekittene og kanaanittene «slo dem sønder og sammen og forfulgte dem like til Horma»."
    - "Josvas liste over beseirede konger parer «kongen i Horma» med kongen av Arad; byen regnes blant Judas sørlige byer og igjen i Simeons lodd, og David sendte fra Siklag en del av amalekittbyttet «til dem i Horma». Mer høres ikke om den."
    - "Stedet er ikke kjent, og seks hauger i Beer-Sjeba-dalen og i dens kanter er foreslått. Den vanlige favoritten er Tel Masos (Khirbet el-Meshash), en stor ubefestet bosetning fra 1100- og 1000-tallet f.Kr. gravd ut av Aharoni, Fritz og Kempinski i 1972–1975; andre foretrekker Tel Halif (Lahav) i kanten av åsene, Tel Malhata, Tell esh-Sharia (Tel Sera') lenger vest, Tel Ira eller Tell Beit Mirsim. Ingen har gitt navnet, og de antikke omtalene avgjør det ikke. Dalen dyrkes i dag med vanning, mellom Beer-Sjeba, Israels ørkenby, og beduinbyene rundt den."
  tl:
    - "Ang Horma ay isang bayang Cananeo sa Negeb, ang tuyong lupain sa timog ng mga burol ng Judea, marahil sa pagitan ng Beer-seba at Arad. Ang pangalan nito ay mula sa Hebreong herem, ang pagbabawal na nagtatalaga ng isang bagay sa pagkawasak, at may dalawang salaysay ang Biblia kung paano ito nagkaroon ng gayong pangalan: matapos ang tagumpay laban sa hari ng Arad, “kanilang lubos na nilipol sila at ang kanilang mga bayan: at ang ipinangalan sa dakong yaon ay Horma”; at nang mga araw ng mga hukom, kinuha ng Juda at ni Simeon ang Sephath, “at lubos na pinuksa. At ang pangalan ng bayan ay tinawag na Horma”. Bago noon, ang Horma ang hangganan ng una at ipinagbabawal na pagtatangka ng Israel sa lupain, nang “sinaktan sila at nilupig silang hinabol, hanggang sa Horma” ng mga Amalecita at mga Cananeo."
    - "Ipinapares ng talaan ni Josue ng mga natalong hari ang “Ang hari sa Horma” sa hari ng Arad; binibilang ang bayan sa mga bayan sa timog ng Juda at muli sa bahagi ni Simeon, at si David, mula sa Siclag, ay nagpadala ng bahagi ng samsam mula sa mga Amalecita “sa kanila na sa Horma”. Wala nang naririnig tungkol dito."
    - "Hindi alam ang kinalalagyan nito, at anim na burol sa libis ng Beer-seba at sa mga gilid nito ang iminungkahi. Ang karaniwang paborito ay ang Tel Masos (Khirbet el-Meshash), isang malaking pamayanang walang pader noong ika-12 at ika-11 siglo BK na hinukay nina Aharoni, Fritz at Kempinski noong 1972–1975; mas gusto ng iba ang Tel Halif (Lahav) sa gilid ng mga burol, ang Tel Malhata, ang Tell esh-Sharia (Tel Sera') na higit na kanluran, ang Tel Ira o ang Tell Beit Mirsim. Wala sa mga ito ang nagbunga ng pangalan nito, at hindi ito mapagpasyahan ng mga sinaunang tala. Sinasaka ang libis ngayon sa tulong ng irigasyon, sa pagitan ng Beer-seba, ang lungsod ng Israel sa disyerto, at ng mga bayan ng mga Beduino sa paligid nito."
  da:
    - "Horma var en kana'anæisk by i Negev, det tørre land syd for de judæiske bjerge, sandsynligvis mellem Beersheba og Arad. Dens navn er af det hebraiske herem, banlysningen, der viser en ting til ødelæggelse, og Bibelen giver to beretninger om, hvordan den fik det: efter sejren over kongen af Arad: »man bandlyste dem og deres Stæder og kaldte det Steds Navn Horma«; og i dommertiden indtog Juda og Simeon Sefat: »de bandlyste den, og man kaldte Stadens Navn Horma«. Før det var Horma grænsen for Israels første, forbudte forsøg på landet, da amalekitterne og kana'anæerne »sloge dem og sønderknusede dem indtil Horma«."
    - "Josvas liste over besejrede konger parrer »Kongen af Horma« med kongen af Arad; byen regnes blandt Judas sydlige byer og igen i Simeons lod, og David sendte fra Siklag en del af det amalekitiske bytte »til dem i Horma«. Intet mere høres om den."
    - "Stedet kendes ikke, og seks høje i Beersheba-dalen og på dens kanter er foreslået. Den sædvanlige favorit er Tel Masos (Khirbet el-Meshash), en stor ubefæstet bebyggelse fra 1100-tallet og 1000-tallet f.Kr., udgravet af Aharoni, Fritz og Kempinski i 1972–1975; andre foretrækker Tel Halif (Lahav) i udkanten af bjergene, Tel Malhata, Tell esh-Sharia (Tel Sera') længere mod vest, Tel Ira eller Tell Beit Mirsim. Ingen har givet sit navn, og de gamle notitser afgør det ikke. Dalen dyrkes i dag med kunstvanding, mellem Beersheba, Israels ørkenby, og beduinbyerne omkring den."
  sr:
    - "Хорма је била ханански град у Негеву, сувом крају јужно од јудејских брда, вероватно између Вирсавеје и Арада. Име потиче од хебрејског херем, забране која посвећује ствар уништењу, а Библија даје два извештаја како га је добио: после победе над царем Арада Израиљ „затре њих и градове њихове, и прозва оно место Орма“; а у доба судија Јуда и Симеун су узели Сефат „и раскопаше га, и прозва се град Орма“. Пре тога, Хорма је била граница првог, забрањеног Израиљевог покушаја на земљу, кад су Амалик и Хананеј „разбише их и бацише дори до Орме“."
    - "Исусов списак побеђених царева упарује „цар орамски“ са царем Арада; град се убраја међу јужне градове Јуде и поново у Симеуновом жребу, а Давид је из Сиклага послао део амаличког плена „онима у Орми“. Више се о њему ништа не чује."
    - "Место није познато, а предложено је шест хумки у долини Вирсавеје и на њеним ободима. Уобичајени фаворит је Тел Масос (Хирбет ел-Мешаш), велико незидано насеље 12. и 11. века п. н. е. које су 1972–1975. копали Ахарони, Фриц и Кемпински; други воле Тел Халиф (Лахав) на ободу брда, Тел Малхату, Тел еш-Шарију (Тел Сера) даље на запад, Тел Иру или Тел Бејт Мирсим. Ни једна није дала своје име, а древни помени не решавају питање. Долина је данас обрађена наводњавањем, између Вирсавеје, пустињског града Израила, и бедуинских градова око ње."
