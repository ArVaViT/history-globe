# Overview article (ADR 0007). Mainstream facts only; a minor place: unlocated, and said so; Eusebius' village is given as a suggestion, not a fact.
id: dinhabah
place: ae28fc7
title:
  en: "Dinhabah"
  ru: "Дингава"
  uk: "Дінгава"
  es: "Dinaba"
  pt: "Dinabá"
  de: "Dinhaba"
  fr: "Dinhaba"
body:
  en:
    - "Dinhabah is named only as the city of Bela son of Beor, the first in the list of “the kings that reigned in the land of Edom before any king reigned over the children of Israel”: “Bela the son of Beor reigned in Edom: and the name of his city was Dinhabah.” The list in Genesis is repeated, almost word for word, in Chronicles. Nothing else is said of it. The list gives a city for some of the eight kings and a region for others, and since they were not of one family, each city was that king's own seat rather than a capital of all Edom."
    - "Where it stood is unknown. Under the name Eusebius notes two villages of his own day, Dannea eight miles from Areopolis on the road to the Arnon and Danaba on Mount Peor seven miles from Heshbon, without proving either the king's city. The map's candidates are that Dannea and Khirbet el-Muhatta on the plateau north-east of the Dead Sea; but both lie in Moab, north of Edom proper, and no site has produced the name or anything to tie it to the Edomite king. Neither is proved."
  ru:
    - "Дингава названа только как город Белы, сына Веора, первого в списке, который открывают слова «Сии суть цари, царствовавшие в земле Едома, прежде нежели воцарился царь над сынами Израилевыми». О нём сказано: «царствовал в Едоме Бела, сын Веоров, а имя городу его Дингава». Список из книги Бытия почти слово в слово повторён в Паралипоменоне. Больше о ней ничего не сказано. Для одних из восьми царей список называет город, для других — область, и, поскольку они не были одной семьёй, каждый город был собственной резиденцией своего царя, а не столицей всего Едома."
    - "Где она стояла, неизвестно. Под этим именем Евсевий отмечает два селения своего времени: Даннею в восьми милях от Ареополя по дороге к Арнону и Данаву на горе Фегор в семи милях от Есевона, — не доказывая, что одно из них и есть город царя. На карте кандидаты — эта Даннея и Хирбет-эль-Мухатта на плато к северо-востоку от Мёртвого моря; но оба места лежат в Моаве, к северу от собственно Едома, и ни одно не дало ни имени, ни чего-либо, что связало бы его с едомским царём. Ни один не доказан."
  uk:
    - "Дінгава названа лише як місто Бели, сина Веора, першого в переліку «царі, що царювали в Едом землї, перш нїж царював там який царь в Ізраїлї»: «Царював у Едомі Бела Бейоренко; прозивався ж город його Динхаба». Перелік у Книзі Буття майже слово в слово повторено в Хроніках. Більше про неї нічого не сказано. Перелік подає місто для одних із восьми царів, а область для інших, і оскільки вони не були з одного роду, кожне місто було власною резиденцією того царя, а не столицею всього Едому."
    - "Де воно стояло, невідомо. Під цією назвою Євсевій відзначає два села своєї доби, Даннею за вісім миль від Ареополя на дорозі до Арнону й Данабу на горі Пеор за сім миль від Гесбона, не доводячи, що котресь із них є містом царя. Кандидати на мапі — ця Даннея і Хірбет-ель-Мухатта на плато на північний схід від Мертвого моря; але обидва лежать у Моаві, на північ від власне Едому, і жодне місце не дало цієї назви чи будь-чого, що пов'язувало б його з едомським царем. Жодне не доведене."
  es:
    - "Dinaba se nombra solo como la ciudad de Bela hijo de Beor, el primero de la lista de «los reyes que reinaron en la tierra de Edom, antes que reinase rey sobre los hijos de Israel»: «Bela, hijo de Beor, reinó en Edom: y el nombre de su ciudad fué Dinaba.» La lista del Génesis se repite, casi palabra por palabra, en Crónicas. No se dice nada más de ella. La lista da una ciudad para algunos de los ocho reyes y una región para otros, y como no eran de una misma familia, cada ciudad era la sede propia de ese rey y no una capital de todo Edom."
    - "Se desconoce dónde estaba. Bajo este nombre Eusebio anota dos aldeas de su tiempo, Dannea, a ocho millas de Areópolis en el camino al Arnón, y Danaba, en el monte Peor, a siete millas de Hesbón, sin probar que ninguna fuera la ciudad del rey. Los candidatos del mapa son esa Dannea y Khirbet el-Muhatta, en la meseta al nordeste del mar Muerto; pero ambas se hallan en Moab, al norte del Edom propiamente dicho, y ningún sitio ha dado el nombre ni nada que lo vincule con el rey edomita. Ninguno está probado."
  pt:
    - "Dinabá é nomeada apenas como a cidade de Belá, filho de Beor, o primeiro da lista dos “reis que reinaram na terra de Edom, antes que qualquer rei reinasse sobre os filhos de Israel”: “Belá, filho de Beor, reinou em Edom. O nome da sua cidade era Dinabá.” A lista do Gênesis é repetida, quase palavra por palavra, nas Crônicas. Nada mais se diz dela. A lista dá uma cidade para alguns dos oito reis e uma região para outros, e como eles não eram de uma só família, cada cidade era a sede própria do rei, e não a capital de todo Edom."
    - "Onde ficava é desconhecido. Sob o nome, Eusébio anota duas aldeias de seu tempo, Dannea, a oito milhas de Areópolis, na estrada para o Arnom, e Danaba, no monte Peor, a sete milhas de Hesbom, sem provar que uma delas fosse a cidade do rei. Os candidatos do mapa são essa Dannea e Khirbet el-Muhatta, no planalto a nordeste do Mar Morto; mas ambas ficam em Moabe, ao norte do Edom propriamente dito, e nenhum local produziu o nome ou algo que o ligue ao rei edomita. Nenhuma está provada."
  de:
    - "Dinhaba wird nur als Stadt Belas, des Sohnes Beors, genannt, des Ersten in der Liste der Könige, „die im Lande Edom regiert haben, ehe denn die Kinder Israel Könige hatten“: „Bela war König in Edom, ein Sohn Beors, und seine Stadt hieß Dinhaba.“ Die Liste in der Genesis wird in der Chronik fast wörtlich wiederholt. Sonst wird nichts über sie gesagt. Die Liste nennt für einige der acht Könige eine Stadt und für andere eine Region, und da sie nicht einer Familie angehörten, war jede Stadt der eigene Sitz des jeweiligen Königs und nicht eine Hauptstadt ganz Edoms."
    - "Wo sie stand, ist unbekannt. Unter dem Namen vermerkt Eusebius zwei Dörfer seiner Zeit, Dannea acht Meilen von Areopolis an der Straße zum Arnon und Danaba am Berg Peor sieben Meilen von Heschbon, ohne dass eines davon als Stadt des Königs erwiesen wäre. Die Kandidaten der Karte sind dieses Dannea und Khirbet el-Muhatta auf der Hochebene nordöstlich des Toten Meeres; beide liegen aber in Moab, nördlich des eigentlichen Edom, und kein Ort hat den Namen oder etwas geliefert, das ihn mit dem edomitischen König verbände. Keiner ist erwiesen."
  fr:
    - "Dinhaba n’est nommée que comme la ville de Béla, fils de Béor, premier de la liste des « rois qui ont régné dans le pays d’Édom, avant qu’un roi régnât sur les enfants d’Israël » : « Béla, fils de Béor, régna sur Édom ; et le nom de sa ville était Dinhaba. » La liste de la Genèse est reprise, presque mot pour mot, dans les Chroniques. On n’en dit rien d’autre. La liste donne une ville pour certains des huit rois et une région pour d’autres, et comme ils n’étaient pas d’une même famille, chaque ville était le siège propre de ce roi plutôt que la capitale de tout Édom."
    - "On ignore où elle se trouvait. Sous ce nom, Eusèbe note deux villages de son temps, Dannea à huit milles d’Aréopolis sur la route de l’Arnon et Danaba sur le mont Peor à sept milles de Hesbon, sans prouver que l’un ou l’autre soit la ville du roi. Les candidats de la carte sont cette Dannea et Khirbet el-Muhatta sur le plateau au nord-est de la mer Morte ; mais tous deux se trouvent en Moab, au nord d’Édom proprement dit, et aucun site n’a livré le nom ni rien qui le rattache au roi édomite. Aucun n’est prouvé."
scripture:
  - Gen.36.31-Gen.36.32
  - 1Chr.1.43
sources:
