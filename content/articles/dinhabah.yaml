body:
  en:
    - "Dinhabah is named only as the city of Bela son of Beor, the first in the list of “the kings that reigned in the land of Edom before any king reigned over the children of Israel”: “Bela the son of Beor reigned in Edom: and the name of his city was Dinhabah.” The list in Genesis is repeated, almost word for word, in Chronicles. Nothing else is said of it. The list gives a city for some of the eight kings and a region for others, and since no king is said to be his predecessor's son, each city was probably that king's own seat rather than a capital of all Edom."
    - "Where it stood is unknown. Under the name Eusebius notes two villages of his own day, Dannea eight miles from Areopolis on the road to the Arnon and Danaba on Mount Peor seven miles from Heshbon, without proving either the king's city. The map's candidates are that Dannea and Khirbet el-Muhatta on the plateau north-east of the Dead Sea; but both lie in Moab, north of Edom proper, and no site has produced the name or anything to tie it to the Edomite king. Neither is proved."
  ru:
    - "Дингава названа только как город Белы, сына Веора, первого в списке, который открывают слова «Сии суть цари, царствовавшие в земле Едома, прежде нежели воцарился царь над сынами Израилевыми». О нём сказано: «царствовал в Едоме Бела, сын Веоров, а имя городу его Дингава». Список из книги Бытия почти слово в слово повторён в Паралипоменоне. Больше о ней ничего не сказано. Для одних из восьми царей список называет город, для других — область, и, поскольку ни один царь не назван сыном своего предшественника, каждый город был, вероятно, собственной резиденцией своего царя, а не столицей всего Едома."
    - "Где она стояла, неизвестно. Под этим именем Евсевий отмечает два селения своего времени: Даннею в восьми милях от Ареополя по дороге к Арнону и Данаву на горе Фегор в семи милях от Есевона, — не доказывая, что одно из них и есть город царя. На карте кандидаты — эта Даннея и Хирбет-эль-Мухатта на плато к северо-востоку от Мёртвого моря; но оба места лежат в Моаве, к северу от собственно Едома, и ни одно не дало ни имени, ни чего-либо, что связало бы его с едомским царём. Ни один не доказан."
  uk:
    - "Дінгава названа лише як місто Бели, сина Веора, першого в переліку «царі, що царювали в Едом землї, перш нїж царював там який царь в Ізраїлї»: «Царював у Едомі Бела Бейоренко; прозивався ж город його Динхаба». Перелік у Книзі Буття майже слово в слово повторено в Хроніках. Більше про неї нічого не сказано. Перелік подає місто для одних із восьми царів, а область для інших, і оскільки жоден цар не названий сином свого попередника, кожне місто було, імовірно, власною резиденцією того царя, а не столицею всього Едому."
    - "Де воно стояло, невідомо. Під цією назвою Євсевій відзначає два села своєї доби, Даннею за вісім миль від Ареополя на дорозі до Арнону й Данабу на горі Пеор за сім миль від Гесбона, не доводячи, що котресь із них є містом царя. Кандидати на мапі — ця Даннея і Хірбет-ель-Мухатта на плато на північний схід від Мертвого моря; але обидва лежать у Моаві, на північ від власне Едому, і жодне місце не дало цієї назви чи будь-чого, що пов'язувало б його з едомським царем. Жодне не доведене."
  es:
    - "Dinaba se nombra solo como la ciudad de Bela hijo de Beor, el primero de la lista de «los reyes que reinaron en la tierra de Edom, antes que reinase rey sobre los hijos de Israel»: «Bela, hijo de Beor, reinó en Edom: y el nombre de su ciudad fué Dinaba.» La lista del Génesis se repite, casi palabra por palabra, en Crónicas. No se dice nada más de ella. La lista da una ciudad para algunos de los ocho reyes y una región para otros, y como de ningún rey se dice que fuera hijo de su predecesor, cada ciudad era probablemente la sede propia de ese rey y no una capital de todo Edom."
    - "Se desconoce dónde estaba. Bajo este nombre Eusebio anota dos aldeas de su tiempo, Dannea, a ocho millas de Areópolis en el camino al Arnón, y Danaba, en el monte Peor, a siete millas de Hesbón, sin probar que ninguna fuera la ciudad del rey. Los candidatos del mapa son esa Dannea y Khirbet el-Muhatta, en la meseta al nordeste del mar Muerto; pero ambas se hallan en Moab, al norte del Edom propiamente dicho, y ningún sitio ha dado el nombre ni nada que lo vincule con el rey edomita. Ninguno está probado."
  pt:
    - "Dinabá é nomeada apenas como a cidade de Belá, filho de Beor, o primeiro da lista dos “reis que reinaram na terra de Edom, antes que qualquer rei reinasse sobre os filhos de Israel”: “Belá, filho de Beor, reinou em Edom. O nome da sua cidade era Dinabá.” A lista do Gênesis é repetida, quase palavra por palavra, nas Crônicas. Nada mais se diz dela. A lista dá uma cidade para alguns dos oito reis e uma região para outros, e como de nenhum rei se diz que fosse filho de seu predecessor, cada cidade era provavelmente a sede própria do rei, e não a capital de todo Edom."
    - "Onde ficava é desconhecido. Sob o nome, Eusébio anota duas aldeias de seu tempo, Dannea, a oito milhas de Areópolis, na estrada para o Arnom, e Danaba, no monte Peor, a sete milhas de Hesbom, sem provar que uma delas fosse a cidade do rei. Os candidatos do mapa são essa Dannea e Khirbet el-Muhatta, no planalto a nordeste do Mar Morto; mas ambas ficam em Moabe, ao norte do Edom propriamente dito, e nenhum local produziu o nome ou algo que o ligue ao rei edomita. Nenhuma está provada."
  de:
    - "Dinhaba wird nur als Stadt Belas, des Sohnes Beors, genannt, des Ersten in der Liste der Könige, „die im Lande Edom regiert haben, ehe denn die Kinder Israel Könige hatten“: „Bela war König in Edom, ein Sohn Beors, und seine Stadt hieß Dinhaba.“ Die Liste in der Genesis wird in der Chronik fast wörtlich wiederholt. Sonst wird nichts über sie gesagt. Die Liste nennt für einige der acht Könige eine Stadt und für andere eine Region, und da kein König als Sohn seines Vorgängers bezeichnet wird, war jede Stadt wohl der eigene Sitz des jeweiligen Königs und nicht eine Hauptstadt ganz Edoms."
    - "Wo sie stand, ist unbekannt. Unter dem Namen vermerkt Eusebius zwei Dörfer seiner Zeit, Dannea acht Meilen von Areopolis an der Straße zum Arnon und Danaba am Berg Peor sieben Meilen von Heschbon, ohne dass eines davon als Stadt des Königs erwiesen wäre. Die Kandidaten der Karte sind dieses Dannea und Khirbet el-Muhatta auf der Hochebene nordöstlich des Toten Meeres; beide liegen aber in Moab, nördlich des eigentlichen Edom, und kein Ort hat den Namen oder etwas geliefert, das ihn mit dem edomitischen König verbände. Keiner ist erwiesen."
  fr:
    - "Dinhaba n’est nommée que comme la ville de Béla, fils de Béor, premier de la liste des « rois qui ont régné dans le pays d’Édom, avant qu’un roi régnât sur les enfants d’Israël » : « Béla, fils de Béor, régna sur Édom ; et le nom de sa ville était Dinhaba. » La liste de la Genèse est reprise, presque mot pour mot, dans les Chroniques. On n’en dit rien d’autre. La liste donne une ville pour certains des huit rois et une région pour d’autres, et comme aucun roi n’est dit fils de son prédécesseur, chaque ville était probablement le siège propre de ce roi plutôt que la capitale de tout Édom."
    - "On ignore où elle se trouvait. Sous ce nom, Eusèbe note deux villages de son temps, Dannea à huit milles d’Aréopolis sur la route de l’Arnon et Danaba sur le mont Peor à sept milles de Hesbon, sans prouver que l’un ou l’autre soit la ville du roi. Les candidats de la carte sont cette Dannea et Khirbet el-Muhatta sur le plateau au nord-est de la mer Morte ; mais tous deux se trouvent en Moab, au nord d’Édom proprement dit, et aucun site n’a livré le nom ni rien qui le rattache au roi édomite. Aucun n’est prouvé."
  it:
    - "Dinaba è nominata solo come la città di Bela figlio di Beor, il primo dell’elenco de «i re che regnarono nel paese di Edom, prima che alcun re regnasse sui figliuoli d’Israele»: «Bela, figliuolo di Beor, regnò in Edom, e il nome della sua città fu Dinhaba.» L’elenco della Genesi è ripetuto, quasi parola per parola, nelle Cronache. Null’altro se ne dice. L’elenco dà una città per alcuni degli otto re e una regione per altri, e poiché di nessun re si dice che fosse figlio del predecessore, ogni città era probabilmente la sede propria di quel re e non la capitale di tutto Edom."
    - "Dove sorgesse è ignoto. Sotto questo nome Eusebio annota due villaggi dei suoi giorni, Dannea a otto miglia da Areopoli sulla strada dell’Arnon e Danaba sul Monte Peor a sette miglia da Chesbon, senza provare che l’uno o l’altro sia la città del re. I candidati sulla mappa sono quella Dannea e Khirbet el-Muhatta sull’altopiano a nord-est del Mar Morto; ma entrambe si trovano in Moab, a nord di Edom propriamente detta, e nessun sito ha restituito il nome o alcunché che lo colleghi al re edomita. Nessuna delle due è provata."
  pl:
    - "Dinhaba jest wymieniona tylko jako miasto Beli, syna Beora, pierwszego z królów, o których mówi się: „którzy królowali w ziemi Edomskiej, przedtem niż królował król nad synami Izraelskimi”: „Królował tedy w Edom Bela, syn Beorów, a imię miasta jego Dynhaba.” Lista z Księgi Rodzaju powtarza się, niemal słowo w słowo, w Księdze Kronik. Nic więcej o niej nie powiedziano. Lista podaje miasto dla niektórych z ośmiu królów, a region dla innych, a ponieważ żaden król nie jest nazwany synem swego poprzednika, każde miasto było zapewne osobistą siedzibą króla, a nie stolicą całego Edomu."
    - "Gdzie stała, nie wiadomo. Pod tą nazwą Euzebiusz notuje dwie wsie swoich czasów, Dannea w odległości ośmiu mil od Areopolis przy drodze do Arnonu i Danabę na górze Peor siedem mil od Cheszbonu, nie dowodząc, że któraś była miastem króla. Kandydaci na mapie to ta Dannea i Chirbet el-Muchatta na płaskowyżu na północny wschód od Morza Martwego; lecz obie leżą w Moabie, na północ od właściwego Edomu, a żadne stanowisko nie dało tej nazwy ani niczego, co wiązałoby je z edomickim królem. Żadnego nie udowodniono."
  nl:
    - "Dinhaba wordt alleen genoemd als de stad van Bela, zoon van Beor, de eerste in de lijst van “koningen, die geregeerd hebben in het land Edom, eer een koning regeerde over de kinderen Israëls”: “Bela dan, de zoon van Beor, regeerde in Edom, en de naam zijner stad was Dinhaba.” De lijst in Genesis wordt, bijna woordelijk, herhaald in Kronieken. Verder wordt niets van haar gezegd. De lijst geeft voor sommige van de acht koningen een stad en voor andere een gebied, en aangezien van geen koning wordt gezegd dat hij de zoon van zijn voorganger was, was elke stad waarschijnlijk de eigen zetel van die koning en niet een hoofdstad van heel Edom."
    - "Waar zij stond, is onbekend. Onder die naam noteert Eusebius twee dorpen uit zijn eigen tijd, Dannea op acht mijl van Areopolis aan de weg naar de Arnon en Danaba op de berg Peor op zeven mijl van Chesbon, zonder te bewijzen dat een van beide de stad van de koning is. De kandidaten op de kaart zijn dat Dannea en Khirbet el-Muhatta op het plateau ten noordoosten van de Dode Zee; maar beide liggen in Moab, ten noorden van het eigenlijke Edom, en geen plaats heeft de naam of iets wat haar aan de Edomitische koning bindt opgeleverd. Geen van beide is bewezen."
  cs:
    - "Dinhaba je jmenována jen jako město Bely, syna Beórova, prvního v seznamu „králové, kteříž kralovali v zemi Idumejské, prvé než kraloval král nad syny Izraelskými“: „Kraloval tedy v Edom Béla, syn Beorův, a jméno města jeho Denaba.“ Seznam v Genesi se téměř slovo od slova opakuje v Letopisech. Nic jiného se o ní neříká. Seznam uvádí u některých z osmi králů město a u jiných oblast, a protože o žádném králi se neříká, že byl synem svého předchůdce, bylo každé město nejspíš vlastním sídlem krále, a ne hlavním městem celého Edómu."
    - "Kde stála, není známo. Pod tímto jménem Eusebios poznamenává dvě vesnice své doby, Danneu osm mil od Areopole na cestě k Arnonu a Danabu na hoře Peór sedm mil od Chešbónu, aniž by dokázal, že některá z nich je městem královým. Kandidáty mapy jsou tato Dannea a Khirbet el-Muhatta na náhorní plošině severovýchodně od Mrtvého moře; obě však leží v Moábu, severně od vlastního Edómu, a žádné místo nevydalo jméno ani nic, co by je vázalo k edómskému králi. Žádná není prokázána."
  sv:
    - "Dinhaba nämns bara som Belas, Beors sons, stad, den första i förteckningen över ”de konungar som regerade i Edoms land, innan ännu någon israelitisk konung var konung där”: ”Bela, Beors son, var konung i Edom, och hans stad hette Dinhaba.” Förteckningen i Första Mosebok upprepas, nästan ord för ord, i Krönikeboken. Inget mer sägs om den. Förteckningen anger en stad för några av de åtta kungarna och en region för andra, och eftersom ingen kung sägs vara sin företrädares son var varje stad sannolikt just den kungens eget säte snarare än en huvudstad för hela Edom."
    - "Var den låg är okänt. Under namnet noterar Eusebios två byar från hans egen tid, Dannea åtta romerska mil från Areopolis på vägen till Arnon och Danaba på berget Peor sju romerska mil från Heshbon, utan att bevisa någondera som kungens stad. Kartans kandidater är det nämnda Dannea och Khirbet el-Muhatta på platån nordost om Döda havet; men båda ligger i Moab, norr om egentliga Edom, och ingen plats har givit namnet eller något som knyter den till den edomitiske kungen. Ingendera är bevisad."
  nb:
    - "Dinhaba er nevnt bare som byen til Bela, Beors sønn, den første i listen over «de konger som regjerte i Edom-landet før det regjerte nogen konge over Israels barn»: «Bela, Beors sønn, var konge i Edom, og hans by hette Dinhaba.» Listen i 1. Mosebok gjentas, nesten ord for ord, i Krønikebøkene. Intet annet sies om den. Listen oppgir en by for noen av de åtte kongene og en region for andre, og siden ingen konge sies å være sin forgjengers sønn, var hver by trolig kongens eget sete snarere enn en hovedstad for hele Edom."
    - "Hvor den lå, er ukjent. Under navnet nevner Eusebius to landsbyer fra sin egen tid, Dannea åtte romerske mil fra Areopolis på veien til Arnon og Danaba på Peor sju romerske mil fra Hesjbon, uten å bevise at noen av dem er kongens by. Kartets kandidater er denne Dannea og Khirbet el-Muhatta på platået nordøst for Dødehavet; men begge ligger i Moab, nord for selve Edom, og ingen plass har gitt navnet eller noe som knytter det til den edomittiske kongen. Ingen av dem er bevist."
  tl:
    - "Ang Dinaba ay pinangalanan lamang bilang lungsod ni Bela na anak ni Beor, ang una sa talaan ng “mga hari na nagsipaghari sa lupain ng Edom bago naghari ang sinomang hari sa mga anak ni Israel”: “si Bela na anak ni Beor ay naghari sa Edom; at ang pangalan ng kaniyang bayan ay Dinaba.” Ang talaan sa Genesis ay inuulit sa Mga Cronica, halos magkapareho ang pananalita. Wala nang ibang sinasabi tungkol dito. Naglalagay ang talaan ng lungsod para sa ilan sa walong hari at rehiyon para sa iba, at yamang walang haring sinasabing anak ng sinundan niya, marahil bawat lungsod ay sariling luklukan ng hari at hindi kabisera ng buong Edom."
    - "Hindi alam kung saan ito nakatayo. Sa ilalim ng pangalang ito, itinatala ni Eusebio ang dalawang nayon noong kaniyang panahon, ang Dannea walong milya mula sa Areopolis sa daan patungong Arnon at ang Danaba sa Bundok Peor pitong milya mula sa Hesbon, nang hindi pinatutunayan na lungsod ng hari ang alinman. Ang mga kandidato ng mapa ay ang Dannea na iyon at ang Khirbet el-Muhatta sa talampas sa hilagang-silangan ng Dagat na Patay; ngunit parehong nasa Moab, sa hilaga ng Edom mismo, at walang pook na nagbunga ng pangalan o anumang nag-uugnay rito sa haring Edomita. Walang napatunayan."
  da:
    - "Dinhaba nævnes kun som byen tilhørende Bela, Beors søn, den første i listen over »de Konger, som regerede i Edoms Land, førend der regerede en Konge over Israels Børn«: »Bela, Beors Søn, var Konge i Edom, og hans Stads Navn var Dinhaba.« Listen i 1 Mosebog gentages næsten ordret i Krønikebøgerne. Intet andet siges om den. Listen angiver en by for nogle af de otte konger og en region for andre, og da ingen konge siges at være sin forgængers søn, var hver by sandsynligvis den pågældende konges eget sæde snarere end en hovedstad for hele Edom."
    - "Hvor den lå, er ukendt. Under navnet noterer Eusebios to landsbyer fra sin egen tid, Dannea otte romerske mil fra Areopolis på vejen til Arnon og Danaba på Peor-bjerget syv romerske mil fra Hesjbon, uden at bevise nogen af dem som kongens by. Kortets kandidater er den Dannea og Khirbet el-Muhatta på plateauet nordøst for Det Døde Hav; men begge ligger i Moab, nord for selve Edom, og intet sted har givet navnet eller noget, der knytter det til den edomitiske konge. Ingen af dem er bevist."
  sr:
    - "Денава се помиње само као град Веле, сина Веоровог, првог на списку царева „који цароваше у земљи едомској пре него се зацари цар над синовима Израиљевим“: „Царова у едомској Валак син Веоров, а граду му беше име Денава“. Списак у Постању понавља се, готово реч по реч, у Летописима. О њој се не казује ништа више. Списак даје град за неке од осам царева а област за друге, и пошто се ни за једног цара не каже да је син свог претходника, сваки град је вероватно био лично седиште тог цара, а не престоница целог Едома."
    - "Где је стајала, непознато је. Под тим именом Јевсевије бележи два села свог времена, Данеу осам миља од Ареополиса на путу за Арнон и Данабу на гори Фегор седам миља од Есевона, не доказујући да је иједно царев град. Кандидати на карти су та Данеа и Хирбет ел Мухата на висоравни североисточно од Мртвог мора; али оба леже у Моаву, северно од самог Едома, и ниједно налазиште није дало име нити нешто што би га везало за едомског цара. Ниједно није доказано."
  hu:
    - "Dinhába csak mint Béla, Beór fia városa ismert, első a „a királyok, kik uralkodtak Edóm földén minekelőtte Izráel fiai között király uralkodott volna” jegyzékében: „Király vala Edómban Bela, Behor fia, s az ő városának neve Dinhába vala.” A Mózes első könyvében lévő jegyzéket a Krónikák szinte szó szerint megismétli. Mást nem mondanak róla. A jegyzék a nyolc király egy részének várost, másoknak vidéket ad, és mivel egyik királyról sem mondják, hogy elődjének fia, minden város valószínűleg az adott király saját székhelye volt, nem egész Edom fővárosa."
    - "Hogy hol állt, ismeretlen. A név alatt Eusebius két korabeli falut jegyez fel: Danneát, nyolc mérföldre Areopolisztól az Arnonhoz vezető úton, és Danabát a Peór-hegyen, hét mérföldre Hesbontól, anélkül hogy bármelyiket a király városának bizonyítaná. A térkép jelöltjei ez a Dannea és a Holt-tengertől északkeletre fekvő fennsíkon lévő Khirbet el-Muhatta; de mindkettő Moábban van, a tulajdonképpeni Edomtól északra, és egyik hely sem hozta elő a nevet vagy bármit, ami az edómi királyhoz kötné. Egyik sem bizonyított."
  fi:
    - "Dinhaba mainitaan vain Bela Beorin pojan kaupunkina, ensimmäisenä luettelossa, joka alkaa sanoin ”Ja nämä olivat ne kuninkaat, jotka hallitsivat Edomin maassa, ennenkuin mikään kuningas oli hallinnut israelilaisia”: ”Bela, Beorin poika, oli kuninkaana Edomissa, ja hänen kaupunkinsa nimi oli Dinhaba.” 1. Mooseksen kirjan luettelo toistuu lähes sanasta sanaan Aikakirjoissa. Muuta ei kerrota. Luettelo antaa kaupungin joillekin kahdeksasta kuninkaasta ja alueen toisille, ja koska yhdenkään kuninkaan ei sanota olevan edeltäjänsä poika, kukin kaupunki oli luultavasti kyseisen kuninkaan oma asuinpaikka eikä koko Edomin pääkaupunki."
    - "Missä se sijaitsi, ei tiedetä. Nimen alla Eusebios mainitsee kaksi oman aikansa kylää, Danneaan kahdeksan mailin päässä Areopoliksesta Arnonille johtavan tien varrella ja Danaban Peor-vuorella seitsemän mailin päässä Hesbonista, todistamatta kumpaakaan kuninkaan kaupungiksi. Kartan ehdokkaat ovat tuo Dannea ja Khirbet el-Muhatta Kuolleenmeren koillispuolisella ylätasangolla; mutta molemmat sijaitsevat Moabissa, varsinaisen Edomin pohjoispuolella, eikä mikään paikka ole tuottanut nimeä tai mitään, mikä sitoisi sen edomilaiseen kuninkaaseen. Kumpaakaan ei ole todistettu."
  vi:
    - "Đin-ha-ba chỉ được nêu tên là thành của Bê-la con của Bê-ô, người đứng đầu danh sách mở đầu bằng “Trước khi dân Y-sơ-ra-ên chưa có một vua nào cai trị, thì đây là các vua trị vì xứ Ê-đôm”: “Bê-la, con trai Bê-ô, trị vì xứ Ê-đôm; tên thành người là Đin-ha-ba.” Danh sách trong sách Sáng thế ký được lặp lại gần như từng chữ trong sách Sử Ký. Không nói gì thêm về nó. Danh sách cho một thành đối với một số trong tám vua và một vùng đối với những vị khác, và vì không vua nào được nói là con của người tiền nhiệm, nên mỗi thành có lẽ là trụ sở riêng của vua ấy chứ không phải kinh đô của toàn Ê-đôm."
    - "Không biết nó ở đâu. Dưới tên này Eusebius ghi hai làng của thời ông, Dannea cách Areopolis tám dặm trên đường đến Ạt-nôn và Danaba trên núi Phê-ô cách Hết-bôn bảy dặm, mà không chứng minh làng nào là thành của vị vua. Các ứng viên của bản đồ là Dannea đó và Khirbet el-Muhatta trên cao nguyên đông bắc Biển Chết; nhưng cả hai đều nằm ở Mô-áp, phía bắc Ê-đôm đúng nghĩa, và không địa điểm nào cho ra tên này hay bất cứ điều gì gắn nó với vị vua Ê-đôm. Không nơi nào được chứng minh."
  ro:
    - "Dinhaba este numită numai ca cetatea lui Bela fiul lui Beor, primul din lista introdusă prin cuvintele „aceștia sunt împărații, carii au împărățit în Edom mai ’nainte de a împărățì împărat în Israil”: „a împărățit în Edom Valac feciorul lui Veor, și numele Cetății lui: Denava”. Lista din Geneza este repetată, aproape cuvânt cu cuvânt, în Cronici. Nimic altceva nu se spune despre ea. Lista dă o cetate pentru unii dintre cei opt regi și o regiune pentru alții, iar fiindcă niciun rege nu este numit fiul predecesorului său, fiecare cetate era probabil reședința proprie a regelui respectiv, nu capitala întregului Edom."
    - "Unde se afla nu se știe. Sub acest nume Eusebiu notează două sate din vremea lui, Dannea, la opt mile de Areopolis pe drumul spre Arnon, și Danaba, pe Muntele Peor, la șapte mile de Hesbon, fără a dovedi vreunul cetatea regelui. Candidații hărții sunt acel Dannea și Khirbet el-Muhatta de pe podișul de la nord-est de Marea Moartă; dar ambele se află în Moab, la nord de Edomul propriu-zis, și niciun loc nu a dat numele sau ceva care să-l lege de regele edomit. Niciunul nu este dovedit."
  bg:
    - "Динхава е назована само като града на Бела, син на Веор, първия в списъка на „царете които царуваха в земята Едом преди да се възцари цар над синовете Израилеви“: „И царува в Едом Вела синът на Веора; а името на града му бе Денпава.“ Списъкът в Битие е повторен почти дума по дума в Летописи. Нищо друго не се казва за нея. Списъкът дава град за някои от осемте царе и област за други, а понеже никой цар не е назован син на предшественика си, всеки град вероятно бил собственото седалище на своя цар, а не столица на целия Едом."
    - "Къде е стояла, не се знае. Под това име Евсевий отбелязва две села от своето време, Данея на осем мили от Ареопол по пътя към Арнон и Данаба на планината Фегор на седем мили от Есевон, без да доказва, че някое от тях е градът на царя. Кандидатите на картата са тази Данея и Хирбет ел-Мухата на платото североизточно от Мъртво море; но и двете лежат в Моав, северно от същинския Едом, и никое място не е дало името или нещо, което да го свърже с едомския цар. Нито едното не е доказано."
