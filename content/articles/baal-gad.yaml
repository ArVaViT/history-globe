body:
  en:
    - "Baal-gad marked the northern end of the land Joshua conquered, as Mount Halak marked the southern. Joshua took the whole land “from the mount Halak, that goeth up to Seir, even unto Baal-gad in the valley of Lebanon under mount Hermon”, and the list of the defeated kings runs “from Baal-gad in the valley of Lebanon even unto the mount Halak”. Among the lands still to be taken was all Lebanon toward the east, “from Baal-gad under mount Hermon unto the entering into Hamath”. The name means Baal of good fortune, Gad being a god of luck, and the place was no doubt a sanctuary of Baal at the foot of Hermon. Many take it to be the same as Baal-hermon, from which Judges and Chronicles measure the land in the same words."
    - "Where it stood is not known, and the “valley of Lebanon” is itself read in two ways: as the Beqaa, the long valley between Lebanon and Anti-Lebanon, or as the smaller valleys at Hermon's western and southern foot. The map shows six candidates. Older writers proposed Baalbek, the Heliopolis of the Beqaa with its great temple of Jupiter, though it lies far to the north, and Edward Robinson Banias, the great spring of the Jordan under Hermon where Caesarea Philippi later stood; F.-M. Abel preferred Hasbaya in the Wadi et-Teim on Hermon's western slope, and J. Simons the small mound of Tell Haush; Ain Jedeideh is also listed. Surveys suggest that neither Banias nor Hasbaya was settled before the Hellenistic age. No excavation has yet given the name to any site."
    - "Today Banias is a nature reserve in the Golan Heights, Hasbaya a town in southern Lebanon, and Baalbek the site of the largest Roman temples in the Levant."
  ru:
    - "Ваал-Гад отмечал северный край земли, завоёванной Иисусом Навином, как гора Халак — южный. Иисус взял всю землю «от горы Халак, простирающейся к Сеиру, до Ваал-Гада в долине Ливанской, подле горы Ермона», а перечень побеждённых царей идёт «от Ваал-Гада на долине Ливанской до Халака, горы, простирающейся к Сеиру». Среди земель, которые ещё предстояло взять, был весь Ливан к востоку, «от Ваал-Гада, что подле горы Ермона, до входа в Емаф». Имя значит «Ваал удачи», Гад был богом счастья, и место было, несомненно, святилищем Ваала у подножия Ермона. Многие считают его тем же, что Ваал-Ермон, от которого книги Судей и Паралипоменон отмеряют землю теми же словами."
    - "Где он стоял, неизвестно, и сама «долина Ливанская» читается двояко: как Бекаа, длинная долина между Ливаном и Антиливаном, или как малые долины у западного и южного подножия Ермона. На карте отмечено шесть кандидатов. Старые авторы предлагали Баальбек, Гелиополь долины Бекаа с его огромным храмом Юпитера, хотя он лежит далеко на севере, а Эдвард Робинсон — Баниас, большой исток Иордана под Ермоном, где позже встала Кесария Филиппова; Ф.-М. Абель предпочитал Хасбаю в Вади-эт-Тейм на западном склоне Ермона, а Я. Симонс — небольшой холм Телль-Хауш; называют и Айн-Джедейде. Разведки показывают, что ни Баниас, ни Хасбая не были заселены до эллинистической эпохи. Ни одни раскопки пока не дали этого имени ни одному месту."
    - "Сегодня Баниас — заповедник на Голанских высотах, Хасбая — город на юге Ливана, а Баальбек — место самых больших римских храмов Леванта."
  uk:
    - "Ваал-Гад позначав північний край землі, яку завоював Ісус Навин, так само як гора Халак позначала південний. Ісус Навин узяв усю землю «Від гори Халак, що тягнесь до Сеїру, аж до Баал-Гаду в Ливанській долинї під Ермоном», а перелік переможених царів іде «від Баал-Гаду, в Ливан-долинї та й до Лисих гір, що тягнуться до Сеїру». Серед земель, що їх ще треба було взяти, був увесь Ліван на схід, «від Баал-Гаду під Ермон-горами аж поти, де вона йде на Емат». Назва означає Ваала доброї долі, Гад — божество щастя, і це місце, безсумнівно, було святилищем Ваала біля підніжжя Хермону. Багато хто вважає його тим самим, що й Ваал-Хермон, від якого книги Суддів і Хронік відмірюють землю тими самими словами."
    - "Де він стояв, невідомо, і сама «Ливан-долина» читається двояко: як Бекаа, довга долина між Ліваном і Антиліваном, або як менші долини біля західного та південного підніжжя Хермону. Мапа показує шістьох кандидатів. Старіші автори пропонували Баальбек, Геліополь Бекаа з його великим храмом Юпітера, хоч він лежить далеко на півночі, а Едвард Робінсон — Банияс, велике джерело Йордану під Хермоном, де згодом стояла Кесарія Пилипова; Ф.-М. Абель віддавав перевагу Хасбеї у вадії ет-Теїм на західному схилі Хермону, а Й. Сімонс — малому пагорбу Телль-Хауш; Айн-Джедейде теж у переліку. Розвідки свідчать, що ні Банияс, ні Хасбея не були заселені до елліністичної доби. Жодні розкопки досі не дали цієї назви жодному місцю."
    - "Нині Банияс — природний заповідник на Голанських висотах, Хасбея — місто в південному Лівані, а Баальбек — місце найбільших римських храмів Леванту."
  es:
    - "Baal-gad señalaba el extremo septentrional de la tierra que Josué conquistó, como el monte Halac señalaba el meridional. Josué tomó toda la tierra «desde el monte de Halac, que sube hasta Seir, hasta Baal-gad en la llanura del Líbano, á las raíces del monte Hermón», y la lista de los reyes vencidos va «desde Baal-gad en el llano del Líbano hasta el monte de Halac». Entre las tierras que quedaban por tomar estaba todo el Líbano hacia oriente, «desde Baal-gad á las raíces del monte Hermón, hasta entrar en Hamath». El nombre significa Baal de la buena fortuna, siendo Gad un dios de la suerte, y el lugar fue sin duda un santuario de Baal al pie del Hermón. Muchos lo toman por el mismo que Baal-hermón, desde el cual Jueces y Crónicas miden la tierra en los mismos términos."
    - "No se sabe dónde estaba, y la «llanura del Líbano» se lee a su vez de dos maneras: como la Becá, el largo valle entre el Líbano y el Antilíbano, o como los valles menores al pie occidental y meridional del Hermón. El mapa muestra seis candidatos. Autores antiguos propusieron Baalbek, la Heliópolis de la Becá con su gran templo de Júpiter, aunque se halla muy al norte, y Edward Robinson, Banias, el gran manantial del Jordán bajo el Hermón donde más tarde se alzó Cesarea de Filipo; F.-M. Abel prefirió Hasbaya, en el uadi et-Teim, en la ladera occidental del Hermón, y J. Simons el pequeño montículo de Tell Haush; también figura Ain Jedeideh. Las prospecciones sugieren que ni Banias ni Hasbaya fueron habitadas antes de la época helenística. Ninguna excavación ha dado aún el nombre a ningún sitio."
    - "Hoy Banias es una reserva natural en los Altos del Golán, Hasbaya una ciudad del sur del Líbano y Baalbek el sitio de los mayores templos romanos del Levante."
  pt:
    - "Baal-Gade marcava o extremo norte da terra que Josué conquistou, como o monte Halaque marcava o sul. Josué tomou toda a terra “desde o monte Halaque, que sobe para Seir, até Baal-Gade, no vale do Líbano, ao pé do monte Hermom”, e a lista dos reis vencidos vai “desde Baal-Gade, no vale do Líbano, até o monte Halaque”. Entre as terras ainda por tomar estava todo o Líbano, para o nascente, “desde Baal-Gade, ao pé do monte Hermom, até a entrada de Hamate”. O nome significa Baal da boa sorte, sendo Gade um deus da sorte, e o lugar era sem dúvida um santuário de Baal ao pé do Hermom. Muitos o tomam pelo mesmo que Baal-Hermom, a partir do qual Juízes e Crônicas medem a terra nos mesmos termos."
    - "Onde ficava não se sabe, e o “vale do Líbano” é ele mesmo lido de dois modos: como a Beqaa, o longo vale entre o Líbano e o Antilíbano, ou como os vales menores ao pé ocidental e meridional do Hermom. O mapa mostra seis candidatos. Escritores antigos propuseram Baalbek, a Heliópolis da Beqaa com seu grande templo de Júpiter, embora fique muito ao norte, e Edward Robinson, Banias, a grande fonte do Jordão sob o Hermom, onde mais tarde se ergueu Cesareia de Filipe; F.-M. Abel preferiu Hasbaya, no uádi et-Teim, na encosta ocidental do Hermom, e J. Simons o pequeno montículo de Tell Haush; Ain Jedeideh também é listada. Levantamentos sugerem que nem Banias nem Hasbaya foram povoadas antes da época helenística. Nenhuma escavação deu ainda o nome a algum sítio."
    - "Hoje Banias é uma reserva natural nas colinas de Golã, Hasbaya uma cidade do sul do Líbano e Baalbek o sítio dos maiores templos romanos do Levante."
  de:
    - "Baal-Gad bezeichnete das Nordende des von Josua eroberten Landes, wie der Berg Halak das Südende. Josua nahm das ganze Land „von dem kahlen Gebirge an, das aufsteigt gen Seir, bis gen Baal-Gad in der Ebene beim Berge Libanon, unten am Berge Hermon“, und die Liste der besiegten Könige reicht „von Baal-Gad an auf der Ebene beim Berge Libanon bis an das kahle Gebirge, das aufsteigt gen Seir“. Unter den noch einzunehmenden Ländern war der ganze Libanon gegen Osten, „von Baal-Gad an unter dem Berge Hermon, bis man kommt gen Hamath“. Der Name bedeutet Baal des Glücks, Gad ist ein Glücksgott, und der Ort war zweifellos ein Baalsheiligtum am Fuß des Hermon. Viele halten ihn für dasselbe wie Baal-Hermon, von dem Richter und Chronik das Land mit denselben Worten ausmessen."
    - "Wo er lag, ist nicht bekannt, und die „Ebene beim Berge Libanon“ wird selbst auf zweierlei Weise gelesen: als die Bekaa, das lange Tal zwischen Libanon und Antilibanon, oder als die kleineren Täler am West- und Südfuß des Hermon. Die Karte zeigt sechs Kandidaten. Ältere Autoren schlugen Baalbek vor, das Heliopolis der Bekaa mit seinem großen Jupitertempel, obwohl es weit nördlich liegt, und Edward Robinson Banias, die große Jordanquelle unter dem Hermon, wo später Cäsarea Philippi stand; F.-M. Abel bevorzugte Hasbaya im Wadi et-Teim am Westhang des Hermon und J. Simons den kleinen Hügel Tell Hausch; auch Ain Dschedide wird genannt. Surveys deuten darauf, dass weder Banias noch Hasbaya vor der hellenistischen Zeit besiedelt war. Keine Grabung hat bisher einer Stätte den Namen gegeben."
    - "Heute ist Banias ein Naturreservat auf den Golanhöhen, Hasbaya eine Stadt im Südlibanon und Baalbek die Stätte der größten römischen Tempel der Levante."
  fr:
    - "Baal-Gad marquait l’extrémité nord du pays que Josué conquit, comme le mont Halak en marquait le sud. Josué prit tout le pays « depuis la montagne nue qui s’élève vers Séir jusqu’à Baal-Gad, dans la vallée du Liban, au pied de la montagne d’Hermon », et la liste des rois vaincus va « depuis Baal-Gad dans la vallée du Liban jusqu’à la montagne nue qui s’élève vers Séir ». Parmi les terres restant à prendre était tout le Liban vers l’orient, « depuis Baal-Gad au pied de la montagne d’Hermon jusqu’à l’entrée de Hamath ». Le nom signifie Baal de la bonne fortune, Gad étant un dieu de la chance, et le lieu était sans doute un sanctuaire de Baal au pied de l’Hermon. Beaucoup le tiennent pour le même que Baal-Hermon, d’où les Juges et les Chroniques mesurent le pays dans les mêmes termes."
    - "On ignore où il se trouvait, et la « vallée du Liban » se lit elle-même de deux façons : comme la Bekaa, la longue vallée entre le Liban et l’Anti-Liban, ou comme les petites vallées au pied occidental et méridional de l’Hermon. La carte montre six candidats. Les anciens auteurs proposèrent Baalbek, l’Héliopolis de la Bekaa avec son grand temple de Jupiter, bien qu’elle soit très au nord, et Edward Robinson Banias, la grande source du Jourdain sous l’Hermon où s’éleva plus tard Césarée de Philippe ; F.-M. Abel préférait Hasbaya, dans le Wadi et-Teim sur le versant occidental de l’Hermon, et J. Simons le petit tertre de Tell Haush ; Ain Jedeideh figure aussi. Les prospections suggèrent que ni Banias ni Hasbaya ne furent habitées avant l’époque hellénistique. Aucune fouille n’a encore donné le nom à un site."
    - "Aujourd’hui Banias est une réserve naturelle du plateau du Golan, Hasbaya une ville du sud du Liban, et Baalbek le site des plus grands temples romains du Levant."
