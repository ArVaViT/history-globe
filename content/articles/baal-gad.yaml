body:
  en:
    - "Baal-gad marked the northern end of the land Joshua conquered, as Mount Halak marked the southern. Joshua took the whole land “from the mount Halak, that goeth up to Seir, even unto Baal-gad in the valley of Lebanon under mount Hermon”, and the list of the defeated kings runs “from Baal-gad in the valley of Lebanon even unto the mount Halak”. Among the lands still to be taken was all Lebanon toward the east, “from Baal-gad under mount Hermon unto the entering into Hamath”. The name means Baal of good fortune, Gad being a god of luck, and the place was probably a sanctuary of Baal at the foot of Hermon. Many take it to be the same as Baal-hermon, from which Judges and Chronicles measure the land in the same words."
    - "Where it stood is not known, and the “valley of Lebanon” is itself read in two ways: as the Beqaa, the long valley between Lebanon and Anti-Lebanon, or as the smaller valleys at Hermon's western and southern foot. The map shows six candidates. Older writers proposed Baalbek, the Heliopolis of the Beqaa with its great temple of Jupiter, though it lies far to the north, and Edward Robinson Banias, the great spring of the Jordan under Hermon where Caesarea Philippi later stood; F.-M. Abel preferred Hasbaya in the Wadi et-Teim on Hermon's western slope, and J. Simons the small mound of Tell Haush; Ain Jedeideh is also listed. Surveys suggest that neither Banias nor Hasbaya was settled before the Hellenistic age. No excavation has yet given the name to any site."
    - "Today Banias is a nature reserve in the Golan Heights, Hasbaya a town in southern Lebanon, and Baalbek the site of the largest Roman temples in the Levant."
  ru:
    - "Ваал-Гад отмечал северный край земли, завоёванной Иисусом Навином, как гора Халак — южный. Иисус взял всю землю «от горы Халак, простирающейся к Сеиру, до Ваал-Гада в долине Ливанской, подле горы Ермона», а перечень побеждённых царей идёт «от Ваал-Гада на долине Ливанской до Халака, горы, простирающейся к Сеиру». Среди земель, которые ещё предстояло взять, был весь Ливан к востоку, «от Ваал-Гада, что подле горы Ермона, до входа в Емаф». Имя значит «Ваал удачи», Гад был богом счастья, и место было, вероятно, святилищем Ваала у подножия Ермона. Многие считают его тем же, что Ваал-Ермон, от которого книги Судей и Паралипоменон отмеряют землю теми же словами."
    - "Где он стоял, неизвестно, и сама «долина Ливанская» читается двояко: как Бекаа, длинная долина между Ливаном и Антиливаном, или как малые долины у западного и южного подножия Ермона. На карте отмечено шесть кандидатов. Старые авторы предлагали Баальбек, Гелиополь долины Бекаа с его огромным храмом Юпитера, хотя он лежит далеко на севере, а Эдвард Робинсон — Баниас, большой исток Иордана под Ермоном, где позже встала Кесария Филиппова; Ф.-М. Абель предпочитал Хасбаю в Вади-эт-Тейм на западном склоне Ермона, а Я. Симонс — небольшой холм Телль-Хауш; называют и Айн-Джедейде. Разведки показывают, что ни Баниас, ни Хасбая не были заселены до эллинистической эпохи. Ни одни раскопки пока не дали этого имени ни одному месту."
    - "Сегодня Баниас — заповедник на Голанских высотах, Хасбая — город на юге Ливана, а Баальбек — место самых больших римских храмов Леванта."
  uk:
    - "Ваал-Гад позначав північний край землі, яку завоював Ісус Навин, так само як гора Халак позначала південний. Ісус Навин узяв усю землю «Від гори Халак, що тягнесь до Сеїру, аж до Баал-Гаду в Ливанській долинї під Ермоном», а перелік переможених царів іде «від Баал-Гаду, в Ливан-долинї та й до Лисих гір, що тягнуться до Сеїру». Серед земель, що їх ще треба було взяти, був увесь Ліван на схід, «від Баал-Гаду під Ермон-горами аж поти, де вона йде на Емат». Назва означає Ваала доброї долі, Гад — божество щастя, і це місце, імовірно, було святилищем Ваала біля підніжжя Хермону. Багато хто вважає його тим самим, що й Ваал-Хермон, від якого книги Суддів і Хронік відмірюють землю тими самими словами."
    - "Де він стояв, невідомо, і сама «Ливан-долина» читається двояко: як Бекаа, довга долина між Ліваном і Антиліваном, або як менші долини біля західного та південного підніжжя Хермону. Мапа показує шістьох кандидатів. Старіші автори пропонували Баальбек, Геліополь Бекаа з його великим храмом Юпітера, хоч він лежить далеко на півночі, а Едвард Робінсон — Банияс, велике джерело Йордану під Хермоном, де згодом стояла Кесарія Пилипова; Ф.-М. Абель віддавав перевагу Хасбеї у вадії ет-Теїм на західному схилі Хермону, а Й. Сімонс — малому пагорбу Телль-Хауш; Айн-Джедейде теж у переліку. Розвідки свідчать, що ні Банияс, ні Хасбея не були заселені до елліністичної доби. Жодні розкопки досі не дали цієї назви жодному місцю."
    - "Нині Банияс — природний заповідник на Голанських висотах, Хасбея — місто в південному Лівані, а Баальбек — місце найбільших римських храмів Леванту."
  es:
    - "Baal-gad señalaba el extremo septentrional de la tierra que Josué conquistó, como el monte Halac señalaba el meridional. Josué tomó toda la tierra «desde el monte de Halac, que sube hasta Seir, hasta Baal-gad en la llanura del Líbano, á las raíces del monte Hermón», y la lista de los reyes vencidos va «desde Baal-gad en el llano del Líbano hasta el monte de Halac». Entre las tierras que quedaban por tomar estaba todo el Líbano hacia oriente, «desde Baal-gad á las raíces del monte Hermón, hasta entrar en Hamath». El nombre significa Baal de la buena fortuna, siendo Gad un dios de la suerte, y el lugar fue probablemente un santuario de Baal al pie del Hermón. Muchos lo toman por el mismo que Baal-hermón, desde el cual Jueces y Crónicas miden la tierra en los mismos términos."
    - "No se sabe dónde estaba, y la «llanura del Líbano» se lee a su vez de dos maneras: como la Becá, el largo valle entre el Líbano y el Antilíbano, o como los valles menores al pie occidental y meridional del Hermón. El mapa muestra seis candidatos. Autores antiguos propusieron Baalbek, la Heliópolis de la Becá con su gran templo de Júpiter, aunque se halla muy al norte, y Edward Robinson, Banias, el gran manantial del Jordán bajo el Hermón donde más tarde se alzó Cesarea de Filipo; F.-M. Abel prefirió Hasbaya, en el uadi et-Teim, en la ladera occidental del Hermón, y J. Simons el pequeño montículo de Tell Haush; también figura Ain Jedeideh. Las prospecciones sugieren que ni Banias ni Hasbaya fueron habitadas antes de la época helenística. Ninguna excavación ha dado aún el nombre a ningún sitio."
    - "Hoy Banias es una reserva natural en los Altos del Golán, Hasbaya una ciudad del sur del Líbano y Baalbek el sitio de los mayores templos romanos del Levante."
  pt:
    - "Baal-Gade marcava o extremo norte da terra que Josué conquistou, como o monte Halaque marcava o sul. Josué tomou toda a terra “desde o monte Halaque, que sobe para Seir, até Baal-Gade, no vale do Líbano, ao pé do monte Hermom”, e a lista dos reis vencidos vai “desde Baal-Gade, no vale do Líbano, até o monte Halaque”. Entre as terras ainda por tomar estava todo o Líbano, para o nascente, “desde Baal-Gade, ao pé do monte Hermom, até a entrada de Hamate”. O nome significa Baal da boa sorte, sendo Gade um deus da sorte, e o lugar era provavelmente um santuário de Baal ao pé do Hermom. Muitos o tomam pelo mesmo que Baal-Hermom, a partir do qual Juízes e Crônicas medem a terra nos mesmos termos."
    - "Onde ficava não se sabe, e o “vale do Líbano” é ele mesmo lido de dois modos: como a Beqaa, o longo vale entre o Líbano e o Antilíbano, ou como os vales menores ao pé ocidental e meridional do Hermom. O mapa mostra seis candidatos. Escritores antigos propuseram Baalbek, a Heliópolis da Beqaa com seu grande templo de Júpiter, embora fique muito ao norte, e Edward Robinson, Banias, a grande fonte do Jordão sob o Hermom, onde mais tarde se ergueu Cesareia de Filipe; F.-M. Abel preferiu Hasbaya, no uádi et-Teim, na encosta ocidental do Hermom, e J. Simons o pequeno montículo de Tell Haush; Ain Jedeideh também é listada. Levantamentos sugerem que nem Banias nem Hasbaya foram povoadas antes da época helenística. Nenhuma escavação deu ainda o nome a algum sítio."
    - "Hoje Banias é uma reserva natural nas colinas de Golã, Hasbaya uma cidade do sul do Líbano e Baalbek o sítio dos maiores templos romanos do Levante."
  de:
    - "Baal-Gad bezeichnete das Nordende des von Josua eroberten Landes, wie der Berg Halak das Südende. Josua nahm das ganze Land „von dem kahlen Gebirge an, das aufsteigt gen Seir, bis gen Baal-Gad in der Ebene beim Berge Libanon, unten am Berge Hermon“, und die Liste der besiegten Könige reicht „von Baal-Gad an auf der Ebene beim Berge Libanon bis an das kahle Gebirge, das aufsteigt gen Seir“. Unter den noch einzunehmenden Ländern war der ganze Libanon gegen Osten, „von Baal-Gad an unter dem Berge Hermon, bis man kommt gen Hamath“. Der Name bedeutet Baal des Glücks, Gad ist ein Glücksgott, und der Ort war wahrscheinlich ein Baalsheiligtum am Fuß des Hermon. Viele halten ihn für dasselbe wie Baal-Hermon, von dem Richter und Chronik das Land mit denselben Worten ausmessen."
    - "Wo er lag, ist nicht bekannt, und die „Ebene beim Berge Libanon“ wird selbst auf zweierlei Weise gelesen: als die Bekaa, das lange Tal zwischen Libanon und Antilibanon, oder als die kleineren Täler am West- und Südfuß des Hermon. Die Karte zeigt sechs Kandidaten. Ältere Autoren schlugen Baalbek vor, das Heliopolis der Bekaa mit seinem großen Jupitertempel, obwohl es weit nördlich liegt, und Edward Robinson Banias, die große Jordanquelle unter dem Hermon, wo später Cäsarea Philippi stand; F.-M. Abel bevorzugte Hasbaya im Wadi et-Teim am Westhang des Hermon und J. Simons den kleinen Hügel Tell Hausch; auch Ain Dschedide wird genannt. Surveys deuten darauf, dass weder Banias noch Hasbaya vor der hellenistischen Zeit besiedelt war. Keine Grabung hat bisher einer Stätte den Namen gegeben."
    - "Heute ist Banias ein Naturreservat auf den Golanhöhen, Hasbaya eine Stadt im Südlibanon und Baalbek die Stätte der größten römischen Tempel der Levante."
  fr:
    - "Baal-Gad marquait l’extrémité nord du pays que Josué conquit, comme le mont Halak en marquait le sud. Josué prit tout le pays « depuis la montagne nue qui s’élève vers Séir jusqu’à Baal-Gad, dans la vallée du Liban, au pied de la montagne d’Hermon », et la liste des rois vaincus va « depuis Baal-Gad dans la vallée du Liban jusqu’à la montagne nue qui s’élève vers Séir ». Parmi les terres restant à prendre était tout le Liban vers l’orient, « depuis Baal-Gad au pied de la montagne d’Hermon jusqu’à l’entrée de Hamath ». Le nom signifie Baal de la bonne fortune, Gad étant un dieu de la chance, et le lieu était probablement un sanctuaire de Baal au pied de l’Hermon. Beaucoup le tiennent pour le même que Baal-Hermon, d’où les Juges et les Chroniques mesurent le pays dans les mêmes termes."
    - "On ignore où il se trouvait, et la « vallée du Liban » se lit elle-même de deux façons : comme la Bekaa, la longue vallée entre le Liban et l’Anti-Liban, ou comme les petites vallées au pied occidental et méridional de l’Hermon. La carte montre six candidats. Les anciens auteurs proposèrent Baalbek, l’Héliopolis de la Bekaa avec son grand temple de Jupiter, bien qu’elle soit très au nord, et Edward Robinson Banias, la grande source du Jourdain sous l’Hermon où s’éleva plus tard Césarée de Philippe ; F.-M. Abel préférait Hasbaya, dans le Wadi et-Teim sur le versant occidental de l’Hermon, et J. Simons le petit tertre de Tell Haush ; Ain Jedeideh figure aussi. Les prospections suggèrent que ni Banias ni Hasbaya ne furent habitées avant l’époque hellénistique. Aucune fouille n’a encore donné le nom à un site."
    - "Aujourd’hui Banias est une réserve naturelle du plateau du Golan, Hasbaya une ville du sud du Liban, et Baalbek le site des plus grands temples romains du Levant."
  it:
    - "Baal-Gad segnava l’estremità settentrionale della terra conquistata da Giosuè, come il monte Calak segnava quella meridionale. Giosuè prese tutto il paese «dalla montagna brulla che s’eleva verso Seir, fino a Baal-Gad nella valle del Libano appiè del monte Hermon», e l’elenco dei re sconfitti va «da Baal-Gad nella valle del Libano fino alla montagna brulla che si eleva verso Seir». Fra le terre ancora da prendere vi era tutto il Libano verso il levante, «da Baal-Gad, appiè del monte Hermon, sino all’ingresso di Hamath». Il nome significa Baal della buona sorte, Gad essendo un dio della fortuna, e il luogo era probabilmente un santuario di Baal ai piedi dell’Hermon. Molti lo ritengono lo stesso di Baal-Ermon, da cui i Giudici e le Cronache misurano il paese con le stesse parole."
    - "Dove sorgesse non si sa, e la «valle del Libano» è essa stessa letta in due modi: come la Beqaa, la lunga valle tra il Libano e l’Antilibano, o come le valli minori ai piedi occidentali e meridionali dell’Hermon. La carta mostra sei candidati. Scrittori più antichi proposero Baalbek, l’Eliopoli della Beqaa con il suo grande tempio di Giove, benché sia molto più a nord, ed Edward Robinson Banias, la grande sorgente del Giordano sotto l’Hermon dove poi sorse Cesarea di Filippo; F.-M. Abel preferì Hasbaya nello Wadi et-Teim sul pendio occidentale dell’Hermon, e J. Simons il piccolo tell di Tell Haush; è elencata anche Ain Jedeideh. Le ricognizioni suggeriscono che né Banias né Hasbaya fossero abitate prima dell’età ellenistica. Nessuno scavo ha finora dato il nome a un sito."
    - "Oggi Banias è una riserva naturale sulle alture del Golan, Hasbaya una città del Libano meridionale, e Baalbek il sito dei più grandi templi romani del Levante."
  pl:
    - "Baal-Gad wyznaczało północny kraniec ziemi zdobytej przez Jozuego, tak jak góra Chalak południowy. Jozue wziął całą ziemię „Od góry Halak, która idzie ku Seir, aż do Baalgad, w równinie Libańskiej pod górą Hermon”, a wykaz pokonanych królów biegnie „od Baalgad na polu Libańskiem, i aż do Halak, która idzie ku Seir”. Wśród ziem, które pozostały do zdobycia, był cały Liban na wschodzie, „od Baalgad pod górę Hermon, aż gdzie chodzą do Emat”. Nazwa znaczy Baal szczęścia, bo Gad był bogiem losu, a miejsce było prawdopodobnie sanktuarium Baala u stóp Hermonu. Wielu uważa je za to samo co Baal-Hermon, od którego Księga Sędziów i Kronik mierzą ziemię tymi samymi słowami."
    - "Gdzie leżało, nie wiadomo, a sama dolina Libanu jest rozumiana na dwa sposoby: jako Bekaa, długa dolina między Libanem a Antylibanem, albo jako mniejsze doliny u zachodniego i południowego stoku Hermonu. Mapa pokazuje sześciu kandydatów. Starsi autorzy proponowali Baalbek, Heliopolis w Bekaa z wielką świątynią Jowisza, choć leży daleko na północy, a Edward Robinson Banias, wielkie źródło Jordanu pod Hermonem, gdzie później stała Cezarea Filipowa; F.-M. Abel wolał Hasbaję w Wadi et-Teim na zachodnim stoku Hermonu, a J. Simons mały tell Tell Haush; wymieniany jest też Ain Jedeideh. Badania powierzchniowe sugerują, że ani Banias, ani Hasbaja nie były zasiedlone przed epoką hellenistyczną. Żadne wykopaliska nie nadały dotąd tej nazwy żadnemu stanowisku."
    - "Dziś Banias jest rezerwatem przyrody na Wzgórzach Golan, Hasbaja miastem w południowym Libanie, a Baalbek miejscem największych rzymskich świątyń Lewantu."
  nl:
    - "Baäl-Gad markeerde het noordelijke einde van het land dat Jozua veroverde, zoals de berg Chalak het zuidelijke markeerde. Jozua nam het hele land “van den kalen berg, die opwaarts naar Seir gaat, tot Baal-Gad toe, in het dal van den Libanon, onder aan den berg Hermon”, en de lijst van de verslagen koningen loopt “van Baal-Gad aan, in het dal van den Libanon, en tot aan den kalen berg”. Onder de nog te veroveren landen was de hele Libanon naar het oosten, “van Baal-Gad, onder aan den berg Hermon, tot aan den ingang van Hamath”. De naam betekent Baäl van het geluk, Gad zijnde een god van het lot, en de plaats was waarschijnlijk een heiligdom van Baäl aan de voet van de Hermon. Velen houden haar voor dezelfde als Baäl-Hermon, van waaruit Richteren en Kronieken het land op dezelfde wijze afmeten."
    - "Waar het stond, is niet bekend, en het “dal van den Libanon” wordt zelf op twee manieren gelezen: als de Beqaa, de lange vallei tussen de Libanon en de Anti-Libanon, of als de kleinere dalen aan de westelijke en zuidelijke voet van de Hermon. De kaart toont zes kandidaten. Oudere schrijvers stelden Baalbek voor, het Heliopolis van de Beqaa met zijn grote Jupitertempel, al ligt het ver naar het noorden, en Edward Robinson Banias, de grote bron van de Jordaan onder de Hermon waar later Caesarea Filippi stond; F.-M. Abel verkoos Hasbaya in de Wadi et-Teim aan de westhelling van de Hermon, en J. Simons de kleine heuvel Tell Haush; ook Ain Jedeideh wordt genoemd. Verkenningen suggereren dat noch Banias noch Hasbaya vóór de hellenistische tijd bewoond was. Geen opgraving heeft de naam tot nu toe aan een plaats gegeven."
    - "Tegenwoordig is Banias een natuurreservaat op de Golanhoogten, Hasbaya een stad in Zuid-Libanon, en Baalbek de plaats van de grootste Romeinse tempels van de Levant."
  cs:
    - "Báal-gad označoval severní konec země, kterou Jozue dobyl, jako hora Chalak označovala jižní. Jozue vzal celou zemi „Od hory Halak, kteráž se táhne do Seir, až k Balgad na rovině Libánské, pod horou Hermon“ a seznam poražených králů sahá „od Balgad, kteréž jest na poli Libánském, až k hoře lysé, kteráž se táhne až do Seir“. Mezi zeměmi, které zbývalo dobýt, byl celý Libanon k východu, „od Balgad pod horou Hermon, až kde se vchází do Emat“. Jméno znamená Baal štěstí, Gád je bůh štěstěny, a místo bylo pravděpodobně svatyní Baalovou na úpatí Chermonu. Mnozí je pokládají za totéž co Báal-chermon, od něhož Kniha Soudců a Letopisy měří zemi stejnými slovy."
    - "Kde stál, není známo, a „rovina Libánská“ sama se čte dvojím způsobem: jako Bikáa, dlouhé údolí mezi Libanonem a Antilibanonem, nebo jako menší údolí na západním a jižním úpatí Chermonu. Mapa ukazuje šest kandidátů. Starší autoři navrhovali Baalbek, Héliopolis Bikáy s velkým chrámem Jupiterovým, ač leží daleko na severu, a Edward Robinson Banías, velký pramen Jordánu pod Chermonem, kde později stála Cesarea Filipova; F.-M. Abel dával přednost Hasbáji ve Wadi et-Teim na západním svahu Chermonu a J. Simons malému pahorku Tell Haush; uveden je i Ain Jedeideh. Průzkumy naznačují, že Banías ani Hasbája nebyly osídleny před helénistickou dobou. Žádné vykopávky dosud nedaly jméno žádnému místu."
    - "Dnes je Banías přírodní rezervací na Golanských výšinách, Hasbája městem v jižním Libanonu a Baalbek místem největších římských chrámů na Levantě."
  sv:
    - "Baal-Gad markerade norra änden av det land Josua erövrade, liksom berget Halak markerade den södra. Josua intog hela landet ”från Halakberget, som höjer sig mot Seir, ända till Baal-Gad i Libanonsdalen nedanför berget Hermon”, och förteckningen över de besegrade kungarna löper ”från Baal-Gad i Libanonsdalen ända till Halakberget”. Bland de landområden som ännu återstod att inta var hela Libanon österut, ”från Baal-Gad, nedanför berget Hermon, ända dit där vägen går till Hamat”. Namnet betyder lyckans Baal, Gad var en lyckogud, och platsen var sannolikt en Baalshelgedom vid Hermons fot. Många tar den för densamma som Baal-Hermon, varifrån Domarboken och Krönikeböckerna mäter landet med samma ord."
    - "Var det låg är inte känt, och ”Libanonsdalen” läses själv på två sätt: som Beqaa, den långa dalen mellan Libanon och Antilibanon, eller som de mindre dalarna vid Hermons västra och södra fot. Kartan visar sex kandidater. Äldre författare föreslog Baalbek, Beqaas Heliopolis med sitt stora Jupiterstempel, fastän det ligger långt norrut, och Edward Robinson Banias, Jordans stora källa under Hermon där Caesarea Filippi senare stod; F.-M. Abel föredrog Hasbaya i Wadi et-Teim på Hermons västra sluttning, och J. Simons den lilla kullen Tell Haush; Ajin Jedeideh finns också upptagen. Undersökningar tyder på att varken Banias eller Hasbaya var bebodda före den hellenistiska tiden. Ingen utgrävning har ännu givit namnet åt någon plats."
    - "I dag är Banias ett naturreservat på Golanhöjderna, Hasbaya en stad i södra Libanon och Baalbek platsen för Levantens största romerska tempel."
  nb:
    - "Baal-Gad markerte nordenden av landet Josva erobret, slik Halak-fjellet markerte sørenden. Josva tok hele landet «fra det nakne fjell som strekker sig op imot Se'ir, til Ba'al-Gad i Libanon-dalen ved foten av Hermon-fjellet», og listen over de beseirede kongene går «fra Ba'al-Gad i Libanon-dalen til det nakne fjell som strekker sig op imot Se'ir». Blant landene som ennå gjensto å innta, var hele Libanon mot øst, «fra Ba'al-Gad ved foten av Hermon-fjellet like til Hamat-veien». Navnet betyr Baal av lykke, Gad er en lykkegud, og stedet var trolig en Baal-helligdom ved foten av Hermon. Mange regner det for det samme som Baal-Hermon, hvorfra Dommerboken og Krønikebøkene måler landet i de samme ordene."
    - "Hvor det lå, er ukjent, og «Libanon-dalen» leses selv på to måter: som Bekaa, den lange dalen mellom Libanon og Anti-Libanon, eller som de mindre dalene ved Hermons vestlige og sørlige fot. Kartet viser seks kandidater. Eldre forfattere foreslo Baalbek, Bekaas Heliopolis med sitt store tempel for Jupiter, selv om det ligger langt mot nord, og Edward Robinson Banias, den store kilden til Jordan under Hermon der Cæsarea Filippi senere sto; F.-M. Abel foretrakk Hasbaya i Wadi et-Teim på Hermons vestlige skråning, og J. Simons den lille tellen Tell Haush; Ajin Jedeideh er også oppført. Undersøkelser tyder på at verken Banias eller Hasbaya var bosatt før hellenistisk tid. Ingen utgravning har så langt gitt navnet til noe sted."
    - "I dag er Banias et naturreservat på Golanhøydene, Hasbaya en by i Sør-Libanon, og Baalbek stedet for de største romerske templene i Levanten."
  tl:
    - "Minarkahan ng Baal-gad ang hilagang dulo ng lupaing sinakop ni Josue, gaya ng Bundok Halac sa timog. Sinakop ni Josue ang buong lupain “Mula sa bundok ng Halac na paahon sa Seir, hanggang sa Baal-gad sa libis ng Libano sa ibaba ng bundok Hermon”, at tumatakbo ang talaan ng mga natalong hari “mula sa Baal-gad na libis ng Libano hanggang sa bundok ng Halac”. Kabilang sa mga lupaing hindi pa nasasakop ang buong Libano sa silangan, “mula sa Baal-gad, sa ibaba ng bundok Hermon hanggang sa pasukan sa Hamat”. Ang pangalan ay nangangahulugang Baal ng magandang kapalaran, si Gad ay diyos ng swerte, at ang lugar ay marahil santuwaryo ni Baal sa paanan ng Hermon. Itinuturing ng marami na ito ang Baal-hermon, kung saan sinusukat ng Mga Hukom at Mga Cronica ang lupain sa parehong pananalita."
    - "Hindi alam kung saan ito nakatayo, at ang “libis ng Libano” mismo ay binabasa sa dalawang paraan: bilang Beqaa, ang mahabang libis sa pagitan ng Libano at Anti-Libano, o bilang mas maliliit na libis sa kanluran at timog na paanan ng Hermon. Ipinapakita ng mapa ang anim na kandidato. Iminungkahi ng mga lumang manunulat ang Baalbek, ang Heliopolis ng Beqaa na may dakilang templo ni Jupiter, bagaman malayo ito sa hilaga, at ni Edward Robinson ang Banias, ang dakilang bukal ng Jordan sa ilalim ng Hermon kung saan kalaunang tumayo ang Cesarea ni Filipo; pinili ni F.-M. Abel ang Hasbaya sa Wadi et-Teim sa kanlurang dalisdis ng Hermon, at ni J. Simons ang burol ng Tell Haush; nakalista rin ang Ain Jedeideh. Ipinahihiwatig ng mga sarbey na hindi tinirhan ang Banias o Hasbaya bago ang panahong Helenistiko. Wala pang paghuhukay na nagpangalan sa alinmang lugar."
    - "Ang Banias ay reserbang pangkalikasan sa Kabundukang Golan ngayon, ang Hasbaya ay bayan sa timog Libano, at ang Baalbek ang lugar ng pinakamalalaking templong Romano sa Levante."
  da:
    - "Ba'al-Gad markerede nordenden af det land, Josva erobrede, som Halak-bjerget markerede sydenden. Josva indtog hele landet »fra det slette Bjerg, som strækker sig op mod Sejr, og indtil Baal-Gad ved Libanons Dal neden for det Bjerg Hermon«, og listen over de besejrede konger løber »fra Baal-Gad i Libanons Dal og indtil det slette Bjerg, som strækker sig op imod Sejr«. Blandt de lande, der endnu skulle indtages, var hele Libanon mod øst, »fra Baal-Gad neden for Hermons Bjerg, indtil man kommer til Hamath«. Navnet betyder Ba'al for lykke, Gad er en lykkegud, og stedet var sandsynligvis en Ba'al-helligdom ved foden af Hermon. Mange regner det for det samme som Ba'al-Hermon, hvorfra Dommerbogen og Krønikebøgerne måler landet med de samme ord."
    - "Hvor det lå, vides ikke, og »Libanons Dal« læses selv på to måder: som Bekaa, den lange dal mellem Libanon og Anti-Libanon, eller som de mindre dale ved Hermons vestlige og sydlige fod. Kortet viser seks kandidater. Ældre forfattere foreslog Baalbek, Bekaas Heliopolis med dens store Jupiter-tempel, skønt det ligger langt mod nord, og Edward Robinson Banias, Jordans store kilde under Hermon, hvor Cæsarea Filippi senere lå; F.-M. Abel foretrak Hasbaya i Wadi et-Teim på Hermons vestlige skråning og J. Simons den lille tell Tell Haush; Ain Jedeideh er også opført. Undersøgelser tyder på, at hverken Banias eller Hasbaya var bosat før den hellenistiske tid. Ingen udgravning har endnu givet navnet til noget sted."
    - "I dag er Banias et naturreservat på Golanhøjderne, Hasbaya en by i det sydlige Libanon og Baalbek stedet for Levantens største romerske templer."
  sr:
    - "Вал-Гад је означавао северни крај земље коју је Исус освојио, као што је гора Алак означавала јужни. Исус је узео целу земљу „Од горе Алака, која се пружа к Сиру, до Вал-Гада у пољу ливанском, под гором Ермоном“, а списак побеђених царева иде „од Вал-Гада у пољу ливанском па до горе Алака“. Међу земљама које су тек требале бити узете био је сав Ливан к истоку, „од Вал-Гада под гором Ермоном па до уласка ематског“. Име значи Вал среће, јер је Гад бог среће, а место је вероватно било светилиште Вала у подножју Ермона. Многи узимају да је исто што и Вал-Ермон, од кога Судије и Летописи мере земљу истим речима."
    - "Где је стајао, није познато, а сам израз „у пољу ливанском“ чита се на два начина: као Бека, дуга долина између Ливана и Антиливана, или као мање долине у западном и јужном подножју Ермона. Карта приказује шест кандидата. Старији писци предлагали су Баалбек, Хелиополис Беке са великим храмом Јупитера, мада лежи далеко на северу, а Едвард Робинсон Банијас, велико врело Јордана под Ермоном где је касније стајала Цезареја Филипова; Ф.-М. Абел давао је предност Хасбаји у Вади ет-Теиму на западној падини Ермона, а Ј. Симонс малој хумци Тел Хауш; наведен је и Аин Џедејде. Истраживања наговештавају да ни Банијас ни Хасбаја нису били насељени пре хеленистичког доба. Ниједно ископавање још није дало име ниједном налазишту."
    - "Данас је Банијас резерват природе на Голанској висоравни, Хасбаја град у јужном Ливану, а Баалбек налазиште највећих римских храмова на Леванту."
  hu:
    - "Baál-Gád jelölte Józsué által meghódított föld északi végét, ahogy a Halak-hegy a délit. Józsué az egész földet elfoglalta „a kopasz hegytől fogva, a mely Szeír felé emelkedik, egészen Baál-Gádig, a Libanon völgyében, a Hermon hegye alatt”, a legyőzött királyok jegyzéke pedig így szól: „Baál-Gádtól fogva, a mely van a Libánon völgyében, egészen a kopasz hegyig, a mely Szeír felé emelkedik”. A még elfoglalandó földek között volt az egész Libanon kelet felé, „Baál-Gádtól fogva, a mely a Hermon hegy alatt van, egészen addig, a hol Hamáthba mennek”. A név Baál szerencséjét jelenti, Gád a szerencse istene, a hely pedig valószínűleg Baál szentélye volt a Hermon lábánál. Sokan azonosnak tartják Baál-Hermonnal, ahonnan a Bírák könyve és a Krónikák ugyanezekkel a szavakkal mérik a földet."
    - "Hol állt, nem ismert, és a „Libanon völgyét” magát is kétféleképpen olvassák: a Bekaa-völggyel, a Libanon és az Antilibanon közötti hosszú völggyel, vagy a Hermon nyugati és déli lábánál fekvő kisebb völgyekkel. A térkép hat jelöltet mutat. A régebbi írók Baalbeket javasolták, a Bekaa-völgy Héliopoliszát nagy Jupiter-templomával, bár az messze északra fekszik, Edward Robinson Banias, a Jordán nagy forrását a Hermon alatt, ahol később Fülöp Cézáreája állt; F.-M. Abel a Hermon nyugati lejtőjén, a Wadi et-Teimben fekvő Hasbayát részesítette előnyben, J. Simons a kis Tell Haush halmot; az Ain Jedeideh is szerepel. A felmérések szerint sem Banias, sem Hasbaya nem volt lakott a hellenisztikus kor előtt. Egyetlen ásatás sem adta még meg a nevet egyetlen lelőhelynek sem."
    - "Ma Banias természetvédelmi terület a Gólán-fennsíkon, Hasbaya város Dél-Libanonban, Baalbek pedig a Levante legnagyobb római templomainak helye."
  fi:
    - "Baal-Gad merkitsi Joosuan valloittaman maan pohjoispäätä, kuten Halakvuori eteläpäätä. Joosua valloitti koko maan ”Seiriin päin kohoavasta Sileästä vuoresta aina Baal-Gaadiin saakka, Libanonin laaksoon, Hermonin vuoren juurelle”, ja voitettujen kuninkaiden luettelo kulkee ”Libanonin laaksossa olevasta Baal-Gaadista aina Seiriin päin kohoavaan Sileään vuoreen saakka”. Valloittamatta olevien maiden joukossa oli koko Libanon idässä, ”Hermonin vuoren juurella olevasta Baal-Gaadista siihen saakka, mistä mennään Hamatiin”. Nimi tarkoittaa onnen Baalia, Gadin ollessa onnen jumala, ja paikka oli luultavasti Baalin pyhäkkö Hermonin juurella. Monet pitävät sitä samana kuin Baal-Hermon, josta Tuomarien kirja ja Aikakirjat mittaavat maata samoin sanoin."
    - "Missä se sijaitsi, ei tiedetä, ja itse ”Libanonin laakso” luetaan kahdella tavalla: Beqaana, Libanonin ja Anti-Libanonin välisenä pitkänä laaksona, tai pienempinä laaksoina Hermonin länsi- ja eteläjuurella. Kartta näyttää kuusi ehdokasta. Vanhemmat kirjoittajat ehdottivat Baalbekia, Beqaan Heliopolista suuren Jupiterin temppelinsä kanssa, vaikka se sijaitsee kaukana pohjoisessa, ja Edward Robinson Baniasia, Jordanin suurta lähdettä Hermonin alla, missä Filippoksen Kesarea myöhemmin sijaitsi; F.-M. Abel piti parempana Hasbayaa Wadi et-Teimissä Hermonin länsirinteellä ja J. Simons pientä Tell Haushin kumpua; myös Ain Jedeideh luetellaan. Kartoitukset viittaavat siihen, ettei Baniasia eikä Hasbayaa asutettu ennen hellenististä aikaa. Mikään kaivaus ei ole vielä antanut nimeä millekään paikalle."
    - "Nykyisin Banias on luonnonsuojelualue Golanin kukkuloilla, Hasbaya kaupunki Etelä-Libanonissa ja Baalbek Levantin suurimpien roomalaisten temppelien paikka."
  vi:
    - "Ba-anh-Gát đánh dấu cực bắc của vùng đất Giô-suê chinh phục, như núi Ha-lác đánh dấu cực nam. Giô-suê chiếm toàn xứ “từ phía núi trụi mọc lên phía Sê-i-rơ cho đến Ba-anh-Gát trong trũng Li-ban, tại chân núi Hẹt-môn”, và danh sách các vua bị đánh bại chạy “từ Ba-anh-Gát trong trũng Li-ban, cho đến núi trụi nổi lên về hướng Sê-i-rơ”. Trong các vùng còn phải chiếm có cả Li-ban về phía đông, “từ Ba-anh-Gát ở dưới chân núi Hẹt-môn, cho đến nơi vào ranh Ha-mát”. Tên có nghĩa là Ba-anh của vận may, Gát là một thần của may mắn, và nơi này có lẽ là thánh địa của Ba-anh dưới chân Hẹt-môn. Nhiều người cho nó là cùng với Ba-anh-Hẹt-môn, từ đó sách Các Quan Xét và Sử Ký đo xứ bằng cùng những lời."
    - "Nó đứng ở đâu thì không biết, và “trũng Li-ban” tự nó được đọc theo hai cách: là Beqaa, thung lũng dài giữa Li-ban và Anti-Li-ban, hoặc là các thung lũng nhỏ hơn ở chân tây và nam của Hẹt-môn. Bản đồ cho thấy sáu ứng viên. Các tác giả cũ đề xuất Baalbek, Hê-li-ô-bô-li của Beqaa với đền thờ lớn của Jupiter, dù nó nằm xa về phía bắc, và Edward Robinson đề xuất Banias, mạch nước lớn của sông Giô-đanh dưới Hẹt-môn nơi Sê-sa-rê Phi-líp về sau đứng; F.-M. Abel ưa Hasbaya ở Wadi et-Teim trên sườn tây Hẹt-môn, và J. Simons ưa gò nhỏ Tell Haush; Ain Jedeideh cũng được liệt kê. Các cuộc khảo sát cho thấy cả Banias lẫn Hasbaya đều chưa có người định cư trước thời Hy Lạp hóa. Chưa cuộc khai quật nào gán tên cho một địa điểm."
    - "Ngày nay Banias là khu bảo tồn thiên nhiên trên Cao nguyên Gô-lan, Hasbaya là một thị trấn ở nam Li-ban, và Baalbek là nơi có các đền La Mã lớn nhất ở Levant."
  ro:
    - "Baal-Gad marca capătul de nord al țării cucerite de Iosua, așa cum muntele Halac marca capătul de sud. Iosua a luat toată țara „Dela muntele Helha care se sue la Siir până la Valagad, și câmpul Livanului supt muntele Ermonului”, iar lista regilor învinși merge „la marea Valagad în câmpul Livanului și până la muntele Alog, care se sue spre Siir”. Printre ținuturile care mai rămâneau de luat era tot Libanul spre răsărit, de la Baal-Gad, de sub muntele Hermon, până la intrarea în Hamat. Numele înseamnă Baal al norocului, Gad fiind un zeu al norocului, iar locul era probabil un sanctuar al lui Baal la poalele Hermonului. Mulți îl socotesc același cu Baal-Hermon, de la care Judecătorii și Cronicile măsoară țara cu aceleași cuvinte."
    - "Unde se afla nu se știe, iar „valea Libanului” este ea însăși citită în două feluri: ca Bekaa, valea lungă dintre Liban și Anti-Liban, sau ca văile mai mici de la poalele de vest și de sud ale Hermonului. Harta arată șase candidați. Scriitori mai vechi au propus Baalbek, Heliopolisul din Bekaa cu marele său templu al lui Jupiter, deși se află mult mai la nord, iar Edward Robinson Banias, marele izvor al Iordanului de sub Hermon, unde a fost mai târziu Cezareea lui Filip; F.-M. Abel a preferat Hasbaya din Wadi et-Teim, pe versantul de vest al Hermonului, iar J. Simons micul tell Tell Haush; este înșirat și Ain Jedeideh. Cercetările de suprafață sugerează că nici Banias, nici Hasbaya nu au fost locuite înainte de epoca elenistică. Nicio excavare nu a dat încă numele vreunui sit."
    - "Astăzi Banias este o rezervație naturală pe înălțimile Golanului, Hasbaya un oraș din sudul Libanului, iar Baalbek locul celor mai mari temple romane din Levant."
  bg:
    - "Ваал-Гад бележел северния край на земята, която Иисус Навин завладял, както планината Халак бележела южния. Иисус Навин превзел цялата земя „от гората Алак която възходи към Сиир дори до Ваалгад в дола на Ливан, под гората Ермон“, а списъкът на победените царе върви „от Ваалгад в дола на Ливан дори до гората Халак“. Сред земите, които още предстояло да бъдат взети, бил целият Ливан на изток, „от Ваалгад под гората Ермон, до входа Емат“. Името означава Ваал на късмета, Гад бил бог на късмета, а мястото вероятно било светилище на Ваал в подножието на Ермон. Мнозина го смятат за същото като Ваал-Ермон, от който Съдии и Летописи отмерват земята със същите думи."
    - "Къде е стоял, не се знае, а самият израз „в дола на Ливан“ се чете по два начина: като Бекаа, дългата долина между Ливан и Антиливан, или като по-малките долини в западното и южното подножие на Ермон. Картата показва шест кандидата. По-старите автори предлагали Баалбек, Хелиополис на Бекаа с големия му храм на Юпитер, макар да лежи далеч на север, а Едуард Робинсън — Банияс, големия извор на Йордан под Ермон, където по-късно стояла Кесария Филипова; Ф.-М. Абел предпочитал Хасбая във Вади ет-Теим на западния склон на Ермон, а Й. Симонс — малката могила Тел Хауш; изброява се и Айн Джедейде. Проучванията сочат, че нито Банияс, нито Хасбая са били заселени преди елинистическата епоха. Никакви разкопки още не са дали името на никое място."
    - "Днес Банияс е природен резерват в Голанските възвишения, Хасбая — град в южен Ливан, а Баалбек — мястото на най-големите римски храмове в Леванта."
