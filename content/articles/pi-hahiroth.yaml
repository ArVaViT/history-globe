# Overview article (ADR 0007). Mainstream facts only; the site depends on the disputed route of the Exodus, and the candidates are given without choosing.
id: pi-hahiroth
place: ababfd2
title:
  en: "Pi-hahiroth"
  ru: "Пи-Гахироф"
  uk: "Пі-Гахірот"
  es: "Pi-hahirot"
  pt: "Pi-Hairote"
  de: "Pi-Hahirot"
  fr: "Pi-Hahiroth"
  it: "Pi-Achirot"
  pl: "Pi-Hachirot"
  cs: "Pi-hachirót"
  nl: "Pi-Hachirot"
  sv: "Pi-Hachirot"
  nb: "Pi-Hakirot"
body:
  en:
    - "Pi-hahiroth was the last camp of Israel before the crossing of the sea. From Etham on the edge of the wilderness the LORD told Moses to turn back and “encamp before Pi-hahiroth, between Migdol and the sea, over against Baal-zephon”, so that Pharaoh would think the people trapped; there the Egyptian chariots overtook them “beside Pi-hahiroth, before Baal-zephon”, and from there, the itinerary says, they “passed through the midst of the sea into the wilderness” and marched three days to Marah. The name has an Egyptian look, with the pi, “house”, of Pithom and Pi-beseth, but the rest is unexplained: a “house of Hathor” and a Semitic “mouth of the canals” have both been proposed, the latter with the frontier canal of the eastern delta in mind."
    - "Where the camp lay depends on where one puts the sea and Baal-zephon, and that is disputed. The first candidate on the map keeps Pi-hahiroth beside Baal-zephon, which some place at Tell Defenneh, the later Daphnae on the eastern delta, because a Phoenician letter from Egypt invokes “Baal-zephon and all the gods of Tahpanhes”; others place Baal-zephon at the shrine of Zeus Casius on the bar of Lake Bardawil and bring Israel along the Mediterranean shore. Those who take the sea for the Bitter Lakes or the Gulf of Suez look to the plain under Jebel Jinayfah or Jebel Abu Hasa near Suez; Pelusium and Qantara have also been named. No inscription has settled it, and the question stays open."
    - "Today the candidate sites lie along the Suez Canal, from the marshes of the eastern delta down to the Bitter Lakes and the city of Suez."
  ru:
    - "Пи-Гахироф — последний стан Израиля перед переходом через море. От Ефама на краю пустыни Господь велел Моисею повернуть назад, чтобы народ расположился «станом пред Пи-Гахирофом, между Мигдолом и между морем, пред Ваал-Цефоном», и фараон решил, что они в ловушке; там египетские колесницы настигли их «при Пи-Гахирофе пред Ваал-Цефоном», и оттуда, по перечню станов, они «прошли среди моря в пустыню» и три дня шли до Мерры. Имя выглядит по-египетски, с тем же «пи», «дом», что в Пифоме и Пи-Бесете, но остальное не объяснено: предлагали и «дом Хатхор», и семитское «устье каналов», во втором случае имея в виду пограничный канал восточной дельты."
    - "Где лежал стан, зависит от того, где искать море и Ваал-Цефон, а это спорно. Первый кандидат на карте оставляет Пи-Гахироф рядом с Ваал-Цефоном, который одни помещают в Телль-Дефенне, позднейшую Дафну в восточной дельте, потому что финикийское письмо из Египта призывает «Ваал-Цефона и всех богов Тахпанхеса»; другие ставят Ваал-Цефон у святилища Зевса Касия на косе озера Бардавиль и ведут Израиль вдоль берега Средиземного моря. Те, кто считает морем Горькие озёра или Суэцкий залив, смотрят на равнину под горой Джинейфа или Джебель-Абу-Хаса близ Суэца; называли также Пелусий и Эль-Кантару. Ни одна надпись вопроса не решила, и он остаётся открытым."
    - "Сегодня места-кандидаты лежат вдоль Суэцкого канала, от болот восточной дельты до Горьких озёр и города Суэц."
  uk:
    - "Пі-Гахірот був останнім табором Ізраїля перед переходом через море. З Етаму на краю пустелі Господь звелів Мойсею повернути назад, щоб ізраїльтяни «отаборились перед Пі-Гахиротом, між Микдолом і морем; перед Бааль-Цефоном отаборитесь навпроти його, при морі», аби фараон подумав, що народ у пастці; там єгипетські колесниці наздогнали їх «при Пі-Гахиротї, по близу Бааль-Цефону», і звідти, сказано в переліку стоянок, вони «перебріли серединою моря в степ» і три дні йшли до Мерри. Назва має єгипетський вигляд — з пі, «дім», як у Пітомі й Бубасті, — але решта лишається нез’ясованою: пропонували і «дім Хатхор», і семітське «гирло каналів», останнє — з думкою про прикордонний канал східної дельти."
    - "Де лежав табір, залежить від того, де містити море й Ваал-Цефон, а це спірно. Перший кандидат на мапі лишає Пі-Гахірот поруч із Ваал-Цефоном, який дехто шукає в Телль-Дефенні, пізнішій Дафні на східній дельті, бо фінікійський лист з Єгипту закликає «Ваал-Цефона і всіх богів Тафніса»; інші поміщають Ваал-Цефон у святилищі Зевса Касія на косі озера Бардавіл і проводять Ізраїль середземноморським берегом. Ті, хто вбачає море в Гірких озерах чи Суецькій затоці, дивляться на рівнину під Джебель-Джинайфою або Джебель-Абу-Хасою поблизу Суеца; називали також Пелусій і Кантару. Жоден напис не розв’язав питання, і воно лишається відкритим."
    - "Сьогодні місця-кандидати лежать уздовж Суецького каналу, від боліт східної дельти до Гірких озер і міста Суец."
  es:
    - "Pi-hahirot fue el último campamento de Israel antes del cruce del mar. Desde Etam, en el borde del desierto, el Señor mandó a Moisés dar la vuelta y que «asienten su campo delante de Pihahiroth, entre Migdol y la mar hacia Baalzephón», para que Faraón pensara que el pueblo estaba atrapado; allí los carros egipcios los alcanzaron «al lado de Pihahiroth, delante de Baalzephón», y desde allí, dice el itinerario, «pasaron por medio de la mar al desierto» y marcharon tres días hasta Mara. El nombre tiene aspecto egipcio, con el pi, «casa», de Pitón y Pi-beset, pero el resto no se explica: se han propuesto tanto una «casa de Hathor» como una «boca de los canales» semítica, esta última con el canal fronterizo del delta oriental en mente."
    - "Dónde estaba el campamento depende de dónde se sitúen el mar y Baal-zefón, y eso se discute. El primer candidato del mapa mantiene Pi-hahirot junto a Baal-zefón, que algunos sitúan en Tell Defenneh, la posterior Dafne del delta oriental, porque una carta fenicia de Egipto invoca a «Baal-zefón y a todos los dioses de Tafnes»; otros sitúan Baal-zefón en el santuario de Zeus Casio en la barra del lago Bardawil y hacen avanzar a Israel por la costa mediterránea. Quienes toman el mar por los Lagos Amargos o el golfo de Suez miran a la llanura bajo el Jebel Jinayfah o el Jebel Abu Hasa, cerca de Suez; también se han nombrado Pelusio y Qantara. Ninguna inscripción lo ha resuelto, y la cuestión sigue abierta."
    - "Hoy los lugares candidatos se encuentran a lo largo del canal de Suez, desde las marismas del delta oriental hasta los Lagos Amargos y la ciudad de Suez."
  pt:
    - "Pi-Hairote foi o último acampamento de Israel antes da travessia do mar. De Etã, na orla do deserto, o SENHOR mandou Moisés dizer ao povo que voltasse e “acampem diante de Pi-Hairote, entre Migdol e o mar, diante de Baal-Zefom”, para que o Faraó julgasse o povo encurralado; ali os carros egípcios os alcançaram “perto de Pi-Hairote, diante de Baal-Zefom”, e dali, diz o itinerário, “atravessaram pelo meio do mar em direção ao deserto” e marcharam três dias até Mara. O nome tem ar egípcio, com o pi, “casa”, de Pitom e Pi-Beset, mas o resto é inexplicado: uma “casa de Hator” e uma “boca dos canais” semítica foram ambas propostas, esta com o canal de fronteira do delta oriental em mente."
    - "Onde ficava o acampamento depende de onde se põem o mar e Baal-Zefom, o que é disputado. O primeiro candidato do mapa mantém Pi-Hairote junto a Baal-Zefom, que alguns situam em Tell Defenneh, a posterior Dafne do delta oriental, porque uma carta fenícia do Egito invoca “Baal-Zefom e todos os deuses de Tafnes”; outros põem Baal-Zefom no santuário de Zeus Cássio na barra do lago Bardawil e levam Israel pela costa do Mediterrâneo. Os que tomam o mar pelos Lagos Amargos ou pelo golfo de Suez olham para a planície sob o Jebel Jinayfah ou o Jebel Abu Hasa, perto de Suez; Pelúsio e Qantara também foram citadas. Nenhuma inscrição resolveu, e a questão continua aberta."
    - "Hoje os locais candidatos ficam ao longo do Canal de Suez, dos pântanos do delta oriental aos Lagos Amargos e à cidade de Suez."
  de:
    - "Pi-Hahirot war Israels letztes Lager vor dem Zug durch das Meer. Von Etam am Rand der Wüste ließ der HERR Mose umkehren und sich „lagern bei Pihachiroth, zwischen Migdol und dem Meer, gegen Baal-Zephon“, damit Pharao glaubte, das Volk sei eingeschlossen; dort ereilten die ägyptischen Wagen sie „bei Pihachiroth, gegen Baal-Zephon“, und von dort, sagt die Stationenliste, „gingen mitten durchs Meer in die Wüste“ und zogen drei Tage bis Mara. Der Name wirkt ägyptisch, mit dem pi, „Haus“, von Pitom und Pi-Beset, doch der Rest ist ungeklärt: ein „Haus der Hathor“ und eine semitische „Mündung der Kanäle“ sind beide vorgeschlagen worden, Letzteres mit dem Grenzkanal des östlichen Deltas im Blick."
    - "Wo das Lager lag, hängt davon ab, wo man das Meer und Baal-Zefon ansetzt, und das ist umstritten. Der erste Kandidat auf der Karte belässt Pi-Hahirot neben Baal-Zefon, das manche bei Tell Defenne ansetzen, dem späteren Daphnai im östlichen Delta, weil ein phönizischer Brief aus Ägypten „Baal-Zefon und alle Götter von Tachpanhes“ anruft; andere setzen Baal-Zefon an das Heiligtum des Zeus Kasios auf der Nehrung des Bardawil-Sees und lassen Israel an der Mittelmeerküste entlangziehen. Wer das Meer für die Bitterseen oder den Golf von Sues hält, sucht die Ebene unter dem Gebel Dschinaifa oder dem Gebel Abu Hasa bei Sues; auch Pelusium und Qantara wurden genannt. Keine Inschrift hat es entschieden, und die Frage bleibt offen."
    - "Heute liegen die Kandidatenorte entlang des Sueskanals, von den Sümpfen des östlichen Deltas bis zu den Bitterseen und der Stadt Sues."
  fr:
    - "Pi-Hahiroth fut le dernier campement d’Israël avant la traversée de la mer. D’Étham, au bord du désert, l’Éternel dit à Moïse de faire demi-tour et de « camper devant Pi-Hahiroth, entre Migdol et la mer, vis-à-vis de Baal-Tsephon », afin que Pharaon croie le peuple pris au piège ; là les chars égyptiens les atteignirent « près de la mer, vers Pi-Hahiroth, vis-à-vis de Baal-Tsephon », et de là, dit l’itinéraire, ils « passèrent au milieu de la mer dans la direction du désert » et marchèrent trois jours jusqu’à Mara. Le nom a une allure égyptienne, avec le pi, « maison », de Pithom et de Pi-Beseth, mais le reste est inexpliqué : une « maison d’Hathor » et une « bouche des canaux » sémitique ont été proposées, la seconde avec en vue le canal frontalier du delta oriental."
    - "L’emplacement du camp dépend de celui qu’on donne à la mer et à Baal-Tsephon, et c’est disputé. Le premier candidat de la carte garde Pi-Hahiroth à côté de Baal-Tsephon, que certains placent à Tell Defenneh, la Daphné postérieure du delta oriental, parce qu’une lettre phénicienne d’Égypte invoque « Baal-Tsephon et tous les dieux de Tachpanès » ; d’autres placent Baal-Tsephon au sanctuaire de Zeus Casios sur le cordon du lac Bardawil et font longer à Israël le rivage de la Méditerranée. Ceux qui prennent la mer pour les lacs Amers ou le golfe de Suez regardent la plaine sous le Djebel Jinayfah ou le Djebel Abu Hasa près de Suez ; Péluse et Qantara ont aussi été nommées. Aucune inscription n’a tranché, et la question reste ouverte."
    - "Aujourd’hui, les sites candidats s’échelonnent le long du canal de Suez, des marais du delta oriental jusqu’aux lacs Amers et à la ville de Suez."
  it:
    - "Pi-Achirot fu l’ultimo accampamento di Israele prima dell’attraversamento del mare. Da Etam, al margine del deserto, il Signore disse a Mosè di far tornare indietro il popolo: «s’accampino di rimpetto a Pi-Hahiroth, fra Migdol e il mare, di fronte a Baal-Tsefon», perché il Faraone pensasse che il popolo fosse in trappola; là i carri egiziani li raggiunsero «vicino a Pi-Hahiroth, di fronte a Baal-Tsefon», e da lì, dice l’itinerario, attraversarono il mare verso il deserto e marciarono tre giorni fino a Mara. Il nome ha un aspetto egizio, con il pi, «casa», di Pitom e Pi-Beset, ma il resto è inspiegato: sono state proposte una «casa di Hathor» e una «bocca dei canali» semitica, quest’ultima con in mente il canale di frontiera del delta orientale."
    - "Dove sorgesse l’accampamento dipende da dove si pongono il mare e Baal-Zefon, ed è controverso. Il primo candidato sulla mappa tiene Pi-Achirot accanto a Baal-Zefon, che alcuni collocano a Tell Defenneh, la successiva Dafne del delta orientale, perché una lettera fenicia dall’Egitto invoca «Baal-Zefon e tutti gli dèi di Tafni»; altri pongono Baal-Zefon al santuario di Zeus Casio sulla barra del Lago Bardawil e conducono Israele lungo la costa mediterranea. Chi identifica il mare con i Laghi Amari o con il Golfo di Suez guarda alla pianura sotto il Jebel Jinayfah o il Jebel Abu Hasa presso Suez; sono stati nominati anche Pelusio e Qantara. Nessuna iscrizione ha risolto la questione, che resta aperta."
    - "Oggi i siti candidati si trovano lungo il Canale di Suez, dalle paludi del delta orientale giù fino ai Laghi Amari e alla città di Suez."
  pl:
    - "Pi-Hachirot było ostatnim obozem Izraela przed przejściem przez morze. Z Etam na skraju pustyni Pan kazał Mojżeszowi mówić Izraelitom, „niech się wrócą i położą obozem przed Fihahirot między Migdoł, i między morzem, przeciw Baalsefon”, aby faraon pomyślał, że lud jest w pułapce; tam egipskie rydwany dogoniły ich „nie daleko Fihahirot, przeciw Baalsefon”, a stamtąd, jak mówi itinerarium, „przeszli przez pośrodek morza na puszczą” i szli trzy dni do Mara. Nazwa ma wygląd egipski, z pi, „dom”, jak w Pitom i Pi-Beset, lecz reszta jest niewyjaśniona: proponowano „dom Hathor” oraz semickie „ujście kanałów”, to drugie z myślą o granicznym kanale wschodniej delty."
    - "Gdzie leżał obóz, zależy od tego, gdzie umieści się morze i Baal-Sefon, a to jest sporne. Pierwszy kandydat na mapie umieszcza Pi-Hachirot obok Baal-Sefon, który niektórzy lokalizują w Tell Defenne, późniejszym Dafne na wschodniej delcie, ponieważ fenicki list z Egiptu przywołuje „Baal-Sefon i wszystkich bogów Tachpanches”; inni umieszczają Baal-Sefon przy świątyni Zeusa Kasiosa na mierzei jeziora Bardawil i prowadzą Izraela wzdłuż brzegu Morza Śródziemnego. Ci, którzy morze utożsamiają z Jeziorami Gorzkimi lub Zatoką Sueską, szukają równiny pod Dżabal Dżinajfa lub Dżabal Abu Hasa koło Suezu; wymieniano też Peluzjum i Kantarę. Żaden napis nie rozstrzygnął sprawy i pytanie pozostaje otwarte."
    - "Dziś miejsca kandydujące leżą wzdłuż Kanału Sueskiego, od bagien wschodniej delty po Jeziora Gorzkie i miasto Suez."
  cs:
    - "Pi-hachirót byl poslední tábor Izraele před přechodem moře. Z Etamu na okraji pouště Hospodin řekl Mojžíšovi, aby mluvil k synům Izraelským, „ať navrátíce se, rozbijí stany před Fiarot, mezi Magdalem a mořem, proti Belsefon“, aby si Farao myslel, že je lid v pasti; tam je egyptské vozy dostihly „podlé Fiarot, před Belsefon“ a odtud podle itineráře „šli prostředkem moře na poušť“ a tři dny pochodovali do Máry. Jméno vypadá egyptsky, s pi, „dům“, jako v Pitomu a Pí-besetu, ale zbytek je nevysvětlen: navrženo bylo „dům Hathory“ i semitské „ústí kanálů“, to druhé s ohledem na hraniční kanál východní delty."
    - "Kde tábor ležel, závisí na tom, kam se klade moře a Báal-cefón, a to je sporné. První kandidát na mapě ponechává Pi-hachirót vedle Báal-cefónu, který někteří kladou do Tell Defenne, pozdějších Dafnai ve východní deltě, protože jeden fénický dopis z Egypta vzývá „Báal-cefón a všechny bohy Tachpanchésu“; jiní kladou Báal-cefón ke svatyni Dia Kasia na kose jezera Bardavíl a vedou Izrael podél středomořského břehu. Ti, kdo pokládají moře za Hořká jezera nebo Suezský záliv, hledají rovinu pod Džabal Džanífa či Džabal Abú Hasa poblíž Suezu; jmenovány byly i Pelúsium a Kantara. Žádný nápis věc nerozhodl a otázka zůstává otevřená."
    - "Dnes leží kandidátská místa podél Suezského průplavu, od bažin východní delty dolů k Hořkým jezerům a městu Suez."
  nl:
    - "Pi-Hachirot was het laatste kamp van Israël vóór de doortocht door de zee. Vanuit Etam aan de rand van de woestijn zei de HEER tot Mozes: “Spreek tot de kinderen Israels, dat zij wederkeren, en zich legeren voor Pi-Hachiroth, tussen Migdol en tussen de zee, voor Baal-Zefon”, zodat Farao zou denken dat het volk gevangen zat; daar achterhaalden de Egyptische wagens hen “nevens Pi-Hachiroth, voor Baal-Zefon”, en vandaar, zegt de reisroute, “gingen over, door het midden van de zee, naar de woestijn” en marcheerden drie dagen naar Mara. De naam heeft een Egyptische klank, met het pi, “huis”, van Pitom en Bubastis, maar de rest is onverklaard: een “huis van Hathor” en een Semitische “monding van de kanalen” zijn beide voorgesteld, de laatste met het grenskanaal van de oostelijke delta in gedachten."
    - "Waar het kamp lag, hangt af van waar men de zee en Baäl-Zefon plaatst, en dat is omstreden. De eerste kandidaat op de kaart houdt Pi-Hachirot naast Baäl-Zefon, dat sommigen bij Tell Defenneh, het latere Daphne in de oostelijke delta, plaatsen, omdat een Fenicische brief uit Egypte “Baäl-Zefon en alle goden van Tachpanhes” aanroept; anderen plaatsen Baäl-Zefon bij het heiligdom van Zeus Kasios op de landtong van het Bardawil-meer en laten Israël langs de Middellandse Zeekust trekken. Wie de zee voor de Bittermeren of de Golf van Suez houdt, zoekt de vlakte onder Jebel Jinayfah of Jebel Abu Hasa bij Suez; ook Pelusium en Qantara zijn genoemd. Geen opschrift heeft het beslecht, en de kwestie blijft open."
    - "Tegenwoordig liggen de kandidaatplaatsen langs het Suezkanaal, van de moerassen van de oostelijke delta tot de Bittermeren en de stad Suez."
  sv:
    - "Pi-Hachirot var Israels sista läger före havsövergången. Från Etam i utkanten av öknen sade HERREN åt Mose att vända om och ”lägra sig framför Pi-Hahirot, mellan Migdol och havet; mitt framför Baal-Sefon”, så att Farao skulle tro att folket var instängt; där hann de egyptiska vagnarna upp dem ”vid Pi-Hahirot, framför Baal-Sefon”, och därifrån, säger vandringsförteckningen, att de ”gingo mitt igenom havet in i öknen” och tågade tre dagar till Mara. Namnet ser egyptiskt ut, med pi, ”hus”, som i Pitom och Pi-Beset, men resten är oförklarat: ett ”Hathors hus” och ett semitiskt ”kanalernas mynning” har båda föreslagits, det senare med tanke på gränskanalen i östra deltat."
    - "Var lägret låg beror på var man placerar havet och Baal-Sefon, och det är omstritt. Den första kandidaten på kartan håller Pi-Hachirot vid Baal-Sefon, som vissa placerar vid Tell Defenneh, det senare Daphnai i östra deltat, eftersom ett feniciskt brev från Egypten åkallar ”Baal-Sefon och alla Tachpanches gudar”; andra förlägger Baal-Sefon till Zeus Kasios helgedom på revet vid Bardawilsjön och låter Israel följa Medelhavsstranden. De som tar havet för Bittersjöarna eller Suezbukten söker slätten under Jebel Jinayfah eller Jebel Abu Hasa nära Suez; Pelusium och Qantara har också nämnts. Ingen inskription har avgjort saken, och frågan förblir öppen."
    - "I dag ligger kandidatplatserna längs Suezkanalen, från träsken i östra deltat ned till Bittersjöarna och staden Suez."
  nb:
    - "Pi-Hakirot var Israels siste leir før havovergangen. Fra Etam ved kanten av ørkenen sa Herren til Moses at han skulle snu og «slå leir foran Pi-Hakirot, mellem Migdol og havet; midt imot Ba'al-Sefon», slik at Farao skulle tro at folket satt i saksa; der innhentet de egyptiske vognene dem «ved Pi-Hakirot, foran Ba'al-Sefon», og derfra, sier ferdaberetningen, «gikk [de] gjennem havet til ørkenen» og marsjerte tre dager til Mara. Navnet ser egyptisk ut, med pi, «hus», som i Pitom og Pi-Beset, men resten er uforklart: et «Hathors hus» og et semittisk «kanalenes munning» er begge foreslått, det siste med tanke på grensekanalen i det østlige deltaet."
    - "Hvor leiren lå, avhenger av hvor man setter havet og Baal-Sefon, og det er omstridt. Den første kandidaten på kartet holder Pi-Hakirot ved siden av Baal-Sefon, som noen plasserer ved Tell Defenneh, det senere Daphnae i det østlige deltaet, fordi et fønikisk brev fra Egypt påkaller «Baal-Sefon og alle Tahpanhes' guder»; andre plasserer Baal-Sefon ved helligdommen for Zevs Kasios på sandbanken ved Bardawil-sjøen og lar Israel følge Middelhavskysten. De som tar havet for Bittersjøene eller Suezbukta, ser mot sletten under Jebel Jinayfah eller Jebel Abu Hasa nær Suez; Pelusium og Qantara er også nevnt. Ingen inskripsjon har avgjort saken, og spørsmålet står åpent."
    - "I dag ligger kandidatstedene langs Suezkanalen, fra myrene i det østlige deltaet ned til Bittersjøene og byen Suez."
