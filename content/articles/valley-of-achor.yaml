body:
  en:
    - "The Valley of Achor, “trouble”, is the valley near Jericho where Achan was stoned, and a landmark on the northern border of Judah, which “went up toward Debir from the valley of Achor” on its way to the ascent of Adummim and Jerusalem. Its site is uncertain. Eusebius placed it north of Jericho; most modern maps, and the first candidate on the map, take it for el-Buqei'a, the high desert plateau south-west of Jericho behind Qumran, where Frank Cross and Józef Milik explored three Iron Age settlements in the 1950s; the Wadi Qelt, the gorge that opens on Jericho from the west, is another candidate. The Copper Scroll from Qumran begins its list of hidden treasure with a ruin in the valley of Achor."
    - "After Jericho fell Achan son of Carmi “took of the accursed thing”, and Israel was beaten before Ai. Found by lot, he confessed: “I saw among the spoils a goodly Babylonish garment, and two hundred shekels of silver, and a wedge of gold of fifty shekels weight, then I coveted them, and took them”. Joshua and all Israel brought him, his family, his cattle and the spoil “unto the valley of Achor”; “Why hast thou troubled us?” Joshua said, “the LORD shall trouble thee this day”, and they stoned him and raised over him “a great heap of stones unto this day. So the LORD turned from the fierceness of his anger. Wherefore the name of that place was called, The valley of Achor”. Chronicles remembers him as Achar, “the troubler of Israel”."
    - "The prophets turned the name round. Isaiah promises that Sharon will be a fold of flocks “and the valley of Achor a place for the herds to lie down in, for my people that have sought me”, and Hosea, that the Lord will bring Israel back as to the wilderness of her youth and give her “the valley of Achor for a door of hope”. Today the Buqei'a is a bare plateau of the Judean desert above the Dead Sea, crossed by Bedouin tracks, and the Wadi Qelt carries the aqueduct to the monastery of St George and the ruins of Herod's winter palaces at the mouth of the gorge."
  ru:
    - "Долина Ахор, «беда», — долина близ Иерихона, где побили камнями Ахана, и примета на северной границе Иуды, которая восходит «к Давиру от долины Ахор» на пути к возвышенности Адуммима и Иерусалиму. Место её неясно. Евсевий помещал её к северу от Иерихона; большинство современных карт, как и первый кандидат, отмеченный на карте, видят в ней эль-Букейю, высокое пустынное плато к юго-западу от Иерихона за Кумраном, где Фрэнк Кросс и Юзеф Милик в 1950-х годах обследовали три поселения железного века; Вади-Кельт, ущелье, выходящее к Иерихону с запада, — ещё один кандидат. Медный свиток из Кумрана начинает перечень спрятанных сокровищ с развалины в долине Ахор."
    - "После падения Иерихона Ахан, сын Хармия, «взял из заклятого», и Израиль был разбит перед Гаем. Найденный по жребию, он признался: «между добычею увидел я одну прекрасную Сеннаарскую одежду и двести сиклей серебра и слиток золота весом в пятьдесят сиклей; это мне полюбилось, и я взял это». Иисус и все Израильтяне вывели его, его семью, скот и добычу «на долину Ахор»; «за то, что ты навел на нас беду, Господь на тебя наводит беду в день сей», — сказал Иисус, и его побили камнями и набросали на него «большую груду камней, которая уцелела и до сего дня. После сего утихла ярость гнева Господня. Посему то место называется долиною Ахор». В Паралипоменоне он «Ахар, наведший беду на Израиля»."
    - "Пророки перевернули это имя. Исаия обещает, что Сарон будет пастбищем для овец, а долина Ахор — «местом отдыха для волов народа Моего, который взыскал Меня», а Осия — что Господь вернёт Израиль, как в пустыню его юности, и даст ему «долину Ахор, в преддверие надежды». Сегодня Букейя — голое плато Иудейской пустыни над Мёртвым морем, пересечённое бедуинскими тропами, а Вади-Кельт несёт водопровод к монастырю святого Георгия и к развалинам зимних дворцов Ирода в устье ущелья."
  uk:
    - "Долина Ахор, «лихо», — долина поблизу Єрихона, де побили Ахана камінням, і орієнтир на північній межі Юди, що «тягнеться гряниця вгору на Дебир від Ахор-долини» на шляху до підйому Адуммім і Єрусалима. Її місце непевне. Євсевій розмістив її на північ від Єрихона; більшість сучасних мап, і перший кандидат на мапі, беруть за неї ель-Букейа, високе пустельне плато на південний захід від Єрихона за Кумраном, де Френк Кросс і Юзеф Мілік у 1950-х роках дослідили три поселення залізної доби; Вади-Кельт, ущелина, що відкривається на Єрихон із заходу, — ще один кандидат. Мідний сувій з Кумрана починає свій перелік захованих скарбів з руїни в долині Ахор."
    - "Після падіння Єрихона Ахан, син Хармі, «взяв із заклятого», і Ізраїль був побитий перед Гаєм. Знайдений жеребом, він признався: «Побачив я між лупом гарне убраннє Синеарське та дві сотнї сиклів срібла та золотий язик вагою в пятьдесять сиклів. Полакомивсь на се, узяв тайкома». Ісус Навин і весь Ізраїль привели його, його родину, його худобу й здобич «на Ахор-долину»; «Про що довів єси нас до недолї? Тепер подасть тебе в недолю Господь», — сказав Ісус Навин, і вони побили його камінням і насипали над ним «високу могилу камяну, що стоїть там й по сей день. Господь же обернувся від завзятого гнїва свого. Тим прозивається те врочище Ахор-долина й по сей день». Хроніки пам’ятають його як Ахара, «що накликав лихо на Ізраїля»."
    - "Пророки обернули назву. Ісая обіцяє, що Шарон стане пасовищем овець, «а долина Ахор — місцем спочивку для волів народу мого, що до мене горнувся», а Осія — що Господь поверне Ізраїль, як до пустелі її молодості, і дасть їй: «долина Ахор (сумна) буде їй дверима до надїї». Нині Букейа — гола рівнина юдейської пустелі над Мертвим морем, перетята бедуїнськими стежками, а Вади-Кельт несе акведук до монастиря св. Георгія та руїн Іродових зимових палаців біля гирла ущелини."
  es:
    - "El valle de Acor, «turbación», es el valle cercano a Jericó donde fue apedreado Acán, y un hito de la frontera norte de Judá, que «torna á subir este término á Debir desde el valle de Achôr» de camino a la subida de Adumim y Jerusalén. Su emplazamiento es incierto. Eusebio lo situó al norte de Jericó; la mayoría de los mapas modernos, y el primer candidato del mapa, lo toman por el-Buqei'a, la meseta desértica alta al suroeste de Jericó, detrás de Qumrán, donde Frank Cross y Józef Milik exploraron en la década de 1950 tres asentamientos de la Edad del Hierro; el Wadi Qelt, la garganta que se abre sobre Jericó desde el oeste, es otro candidato. El Rollo de Cobre de Qumrán comienza su lista de tesoro escondido con una ruina en el valle de Acor."
    - "Tras la caída de Jericó, Acán hijo de Carmi «tomó del anatema», e Israel fue derrotado ante Hai. Descubierto por suertes, confesó: «vi entre los despojos un manto babilónico muy bueno, y doscientos siclos de plata, y un changote de oro de peso de cincuenta siclos; lo cual codicié, y tomé». Josué y todo Israel lo llevaron a él, a su familia, su ganado y los despojos «al valle de Achôr»; «¿Por qué nos has turbado?», dijo Josué, «Túrbete Jehová en este día», y lo apedrearon y levantaron sobre él «un gran montón de piedras, hasta hoy. Y Jehová se tornó de la ira de su furor. Y por esto fué llamado aquel lugar el Valle de Achôr». Crónicas lo recuerda como Acar, «el que alborotó á Israel»."
    - "Los profetas dieron la vuelta al nombre. Isaías promete que Sarón será habitación de ovejas «y el valle de Achôr para majada de vacas, á mi pueblo que me buscó», y Oseas, que el Señor hará volver a Israel como al desierto de su juventud y le dará «el valle de Achôr por puerta de esperanza». Hoy la Buqei'a es una meseta desnuda del desierto de Judea sobre el mar Muerto, cruzada por sendas de beduinos, y el Wadi Qelt lleva el acueducto al monasterio de San Jorge y a las ruinas de los palacios de invierno de Herodes en la boca de la garganta."
  pt:
    - "O Vale de Acor, “desgraça”, é o vale perto de Jericó onde Acã foi apedrejado, e um marco da fronteira norte de Judá, que “subia a Debir desde o vale de Acor” a caminho da subida de Adumim e de Jerusalém. Seu sítio é incerto. Eusébio o pôs ao norte de Jericó; a maioria dos mapas modernos, e o primeiro candidato do mapa, o tomam por el-Buqei'a, o alto planalto desértico a sudoeste de Jericó, atrás de Qumran, onde Frank Cross e Józef Milik exploraram na década de 1950 três povoados da Idade do Ferro; o Wadi Qelt, a garganta que se abre sobre Jericó pelo oeste, é outro candidato. O Rolo de Cobre de Qumran começa sua lista de tesouro escondido com uma ruína no vale de Acor."
    - "Depois da queda de Jericó, Acã, filho de Carmi, “pegou algumas das coisas consagradas”, e Israel foi vencido diante de Ai. Achado por sorteio, confessou: “Quando vi entre os despojos uma bela capa babilônica, duzentos siclos de prata, e uma barra de ouro pesando cinquenta siclos, então eu os cobicei e os peguei”. Josué e todo o Israel o levaram, com sua família, seu gado e o despojo, “ao vale de Acor”; “Por que você nos trouxe desgraça? O SENHOR trará desgraça sobre você hoje”, disse Josué, e o apedrejaram e levantaram sobre ele “um grande monte de pedras que permanece até o dia de hoje. O SENHOR se afastou do furor da sua ira. Por isso o nome daquele lugar foi chamado ‘O vale de Acor’”. Crônicas o recorda como Acar, “o perturbador de Israel”."
    - "Os profetas inverteram o nome. Isaías promete que Sarom será um curral de rebanhos “e o vale de Acor um lugar para o gado se deitar, para o meu povo que me buscou”, e Oseias, que o Senhor trará Israel de volta como ao deserto de sua juventude e lhe dará “o vale de Acor como uma porta de esperança”. Hoje a Buqei'a é um planalto nu do deserto de Judá acima do Mar Morto, cruzado por trilhas beduínas, e o Wadi Qelt leva o aqueduto ao mosteiro de São Jorge e às ruínas dos palácios de inverno de Herodes na boca da garganta."
  de:
    - "Das Achortal, „Unheil“, ist das Tal bei Jericho, wo Achan gesteinigt wurde, und ein Grenzpunkt an der Nordgrenze Judas, die „herauf gen Debir vom Tal Achor“ ging, auf ihrem Weg zur Steige Adummim und nach Jerusalem. Seine Lage ist unsicher. Eusebius setzte es nördlich von Jericho an; die meisten modernen Karten und der erste Kandidat der Karte halten es für el-Buqei'a, die hohe Wüstenhochfläche südwestlich von Jericho hinter Qumran, wo Frank Cross und Józef Milik in den 1950er Jahren drei eisenzeitliche Siedlungen erkundeten; das Wadi Qelt, die Schlucht, die sich von Westen auf Jericho öffnet, ist ein weiterer Kandidat. Die Kupferrolle von Qumran beginnt ihre Liste verborgener Schätze mit einer Ruine im Tal Achor."
    - "Nach dem Fall Jerichos nahm Achan, der Sohn Karmis, „des Verbannten etwas“, und Israel wurde vor Ai geschlagen. Durch das Los entdeckt, gestand er: „ich sah unter dem Raub einen köstlichen babylonischen Mantel und zweihundert Silberlinge und eine goldene Stange, fünfzig Lot am Gewicht; des gelüstete mich, und ich nahm es“. Josua und ganz Israel führten ihn, seine Familie, sein Vieh und den Raub „hinauf ins Tal Achor“; Josua sprach: „Weil du uns betrübt hast, so betrübe dich der HERR an diesem Tage“, und sie steinigten ihn, und danach „machten sie über sie einen großen Steinhaufen, der bleibt bis auf diesen Tag. Also kehrte sich der HERR von dem Grimm seines Zorns. Daher heißt derselbe Ort das Tal Achor bis auf diesen Tag“. Die Chronik erinnert ihn als Achar, „welcher Israel betrübte“."
    - "Die Propheten wendeten den Namen um. Jesaja verheißt: „Saron soll eine Weide für die Herde und das Tal Achor soll zum Viehlager werden meinem Volk, das mich sucht“, und Hosea, dass der Herr Israel wie in die Wüste ihrer Jugend zurückführen und ihr „das Tal Achor zum Tor der Hoffnung“ geben werde. Heute ist die Buqei'a eine kahle Hochfläche der Judäischen Wüste über dem Toten Meer, von Beduinenpfaden durchzogen, und das Wadi Qelt führt die Wasserleitung zum Kloster St. Georg und zu den Ruinen der Winterpaläste des Herodes an der Mündung der Schlucht."
  fr:
    - "La vallée d’Acor, « trouble », est la vallée près de Jéricho où Acan fut lapidé, et un repère de la frontière nord de Juda, qui « montait à Debir, à quelque distance de la vallée d’Acor » en allant vers la montée d’Adummim et Jérusalem. Son site est incertain. Eusèbe la plaçait au nord de Jéricho ; la plupart des cartes modernes, et le premier candidat de la carte, y voient el-Buqei’a, le haut plateau désertique au sud-ouest de Jéricho, derrière Qumrân, où Frank Cross et Józef Milik explorèrent dans les années 1950 trois établissements de l’âge du fer ; le Wadi Qelt, la gorge qui s’ouvre sur Jéricho à l’ouest, est un autre candidat. Le Rouleau de cuivre de Qumrân commence sa liste de trésors cachés par une ruine de la vallée d’Acor."
    - "Après la chute de Jéricho, Acan fils de Carmi « prit des choses dévouées », et Israël fut battu devant Aï. Désigné par le sort, il avoua : « J’ai vu dans le butin un beau manteau de Schinear, deux cents sicles d’argent, et un lingot d’or du poids de cinquante sicles ; je les ai convoités, et je les ai pris ». Josué et tout Israël l’amenèrent, avec sa famille, ses bêtes et le butin, « dans la vallée d’Acor » ; « Pourquoi nous as-tu troublés ? » dit Josué, « L’Éternel te troublera aujourd’hui », et ils le lapidèrent et élevèrent sur lui « un grand monceau de pierres, qui subsiste encore aujourd’hui. Et l’Éternel revint de l’ardeur de sa colère. C’est à cause de cet événement qu’on a donné jusqu’à ce jour à ce lieu le nom de vallée d’Acor ». Les Chroniques se souviennent de lui sous le nom d’Acar, « qui troubla Israël »."
    - "Les prophètes retournèrent le nom. Ésaïe promet que le Saron sera un pâturage pour le menu bétail « et la vallée d’Acor servira de gîte au gros bétail, pour mon peuple qui m’aura cherché », et Osée, que le Seigneur ramènera Israël au désert comme au temps de sa jeunesse et lui donnera « la vallée d’Acor, comme une porte d’espérance ». Aujourd’hui, la Buqei’a est un plateau nu du désert de Judée au-dessus de la mer Morte, sillonné de pistes bédouines, et le Wadi Qelt porte l’aqueduc vers le monastère Saint-Georges et les ruines des palais d’hiver d’Hérode à l’entrée de la gorge."
  pl:
    - "Dolina Achor, „kłopot”, to dolina koło Jerycha, gdzie ukamienowano Achana, i punkt orientacyjny na północnej granicy Judy, o której mówi się: „Idzie także ta granica do Dabir od doliny Achor”; biegła ona w drodze do wzniesienia Adummim i Jerozolimy. Jej położenie jest niepewne. Euzebiusz umieszczał ją na północ od Jerycha; większość współczesnych map i pierwszy kandydat na mapie biorą ją za el-Bukeja, wysoki pustynny płaskowyż na południowy zachód od Jerycha za Qumran, gdzie Frank Cross i Józef Milik zbadali w latach pięćdziesiątych XX wieku trzy osady z epoki żelaza; Wadi Kelt, wąwóz otwierający się na Jerycho od zachodu, jest kolejnym kandydatem. Zwój Miedziany z Qumran zaczyna swój wykaz ukrytych skarbów od ruiny w dolinie Achor."
    - "Po upadku Jerycha Achan, syn Karmiego, „wziął nieco z rzeczy przeklętych”, i Izrael został pobity pod Aj. Wykryty losem, przyznał się: „Widziałem między łupy płaszcz babiloński jeden, piękny, i dwieście syklów srebra, i pręt złoty jeden, pięćdziesiąt syklów ważący, i pożądałem tego, i wziąłem to”. Jozue i cały Izrael zaprowadzili go, jego rodzinę, bydło i łup „na dolinę Achor”; „Przeczżeś nas potrwożył? niechże cię też Pan zatrwoży dnia tego”, rzekł Jozue, i ukamienowali go oraz wznieśli nad nim „wielką kupę kamieni, która trwa aż do dnia tego. I odwrócił się Pan od gniewu zapalczywości swojej; przetoż nazwane jest imię miejsca onego, dolina Achor”. Księgi Kronik wspominają go jako Achara, „który zamięszanie uczynił w Izraelu”."
    - "Prorocy odwrócili tę nazwę. Izajasz obiecuje, że Szaron będzie pastwiskiem owiec, „a dolina Achor za legowisko wołów ludu mojego, którzy mię szukali”, a Ozeasz, że Pan przywiedzie Izraela z powrotem jak na pustynię jej młodości i da jej „i dolinę Achor, miasto drzwi nadziei”. Dziś Bukeja jest nagim płaskowyżem Pustyni Judzkiej nad Morzem Martwym, przeciętym beduińskimi ścieżkami, a Wadi Kelt niesie akwedukt do klasztoru św. Jerzego i do ruin zimowych pałaców Heroda u wylotu wąwozu."
  it:
    - "La Valle di Acor, «turbamento», è la valle presso Gerico dove Acan fu lapidato, e un punto di riferimento sul confine settentrionale di Giuda, che «partendo dalla valle di Acor, saliva a Debir» verso la salita di Adummim e Gerusalemme. Il suo sito è incerto. Eusebio la collocava a nord di Gerico; la maggior parte delle carte moderne, e il primo candidato sulla mappa, la identifica con el-Buqei’a, l’altopiano desertico a sud-ovest di Gerico dietro Qumran, dove Frank Cross e Józef Milik esplorarono negli anni 1950 tre insediamenti dell’età del ferro; l’uadi Qelt, la gola che si apre su Gerico da ovest, è un altro candidato. Il Rotolo di Rame di Qumran apre il suo elenco di tesori nascosti con una rovina nella valle di Acor."
    - "Dopo la caduta di Gerico Acan figlio di Carmi «prese dell’interdetto», e Israele fu battuto davanti ad Ai. Scoperto per sorteggio, confessò: «Ho veduto fra le spoglie un bel mantello di Scinear, duecento sicli d’argento e una verga d’oro del peso di cinquanta sicli; ho bramato quelle cose, le ho prese». Giosuè e tutto Israele lo condussero, con la famiglia, il bestiame e il bottino, «nella valle di Acor»; «Perché ci hai tu conturbati? L’Eterno conturberà te in questo giorno!» disse Giosuè, e lo lapidarono e ammassarono sopra di lui «un gran mucchio di pietre, che dura fino al dì d’oggi. E l’Eterno s’acquetò dell’ardente sua ira. Perciò quel luogo è stato chiamato fino al dì d’oggi “valle di Acòr”». Le Cronache lo ricordano con il nome di Acar, quello «che conturbò Israele»."
    - "I profeti capovolsero il nome. Isaia promette che Saron sarà un chiuso di greggi «e la valle d’Acor, un luogo di riposo alle mandre, per il mio popolo che m’avrà cercato», e Osea che il Signore riporterà Israele come al deserto della sua giovinezza e le darà «la valle d’Acor come porta di speranza». Oggi la Buqei’a è un altopiano spoglio del deserto di Giuda sopra il Mar Morto, attraversato da piste beduine, e l’uadi Qelt porta l’acquedotto al monastero di San Giorgio e alle rovine dei palazzi invernali di Erode alla foce della gola."
  nl:
    - "Het Dal van Achor, “beroering”, is het dal bij Jericho waar Achan werd gestenigd, en een oriëntatiepunt op de noordgrens van Juda, die zou “opgaan naar Debir, van het dal van Achor” op weg naar de klim van Adummim en Jeruzalem. De ligging is onzeker. Eusebius plaatste het ten noorden van Jericho; de meeste moderne kaarten, en de eerste kandidaat op de kaart, nemen het voor el-Buqei’a, het hoge woestijnplateau ten zuidwesten van Jericho achter Qumran, waar Frank Cross en Józef Milik in de jaren 1950 drie nederzettingen uit de IJzertijd verkenden; de Wadi Qelt, de kloof die vanuit het westen op Jericho uitkomt, is een andere kandidaat. De Koperrol uit Qumran begint zijn lijst van verborgen schatten met een ruïne in het dal van Achor."
    - "Nadat Jericho was gevallen, “nam” Achan, de zoon van Karmi, “van het verbannene”, en Israël werd verslagen voor Ai. Door het lot aangewezen, bekende hij: “ik zag onder den roof een schoon sierlijk Babylonisch overkleed, en tweehonderd sikkelen zilvers, en een gouden tong, welker gewicht was vijftig sikkelen; en ik kreeg lust daartoe, en ik nam ze”. Jozua en heel Israël voerden hem, zijn gezin, zijn vee en de buit “naar het dal Achor”; “Hoe hebt gij ons beroerd? De HEERE zal u beroeren te dezen dage!” zei Jozua, en zij stenigden hem en richtten over hem “een groten steenhoop, zijnde tot op dezen dag. Alzo keerde zich de HEERE van de hittigheid Zijns toorns. Daarom noemde men den naam dier plaats het dal van Achor, tot dezen dag toe”. Kronieken herinnert hem als Achar, “de beroerder van Israël”."
    - "De profeten keerden de naam om. Jesaja belooft dat Saron een schaapskooi zal worden “en het dal van Achor tot een runderleger, voor Mijn volk, dat Mij gezocht heeft”, en Hosea dat de HEER Israël zal terugbrengen als naar de woestijn van haar jeugd en haar “het dal Achor, tot een deur der hoop” zal geven. Tegenwoordig is de Buqei’a een kaal plateau van de Judese woestijn boven de Dode Zee, doorkruist door bedoeïenenpaden, en voert de Wadi Qelt het aquaduct naar het klooster van Sint-Joris en de ruïnes van de winterpaleizen van Herodes aan de monding van de kloof."
  cs:
    - "Achórské údolí, „soužení“, je údolí poblíž Jericha, kde byl ukamenován Achan, a orientační bod na severní hranici Judy, která „vstupuje ta meze do Dabir od údolí Achor“ na své cestě k výstupu Adumím a Jeruzalému. Jeho poloha je nejistá. Eusebius je kladl severně od Jericha; většina moderních map a první kandidát na mapě pokládají za ně el-Buqej'a, vysokou pouštní plošinu jihozápadně od Jericha za Kumránem, kde Frank Cross a Józef Milik v 50. letech prozkoumali tři sídliště z doby železné; Wádí Kelt, soutěska, která se otevírá do Jericha ze západu, je další kandidát. Měděný svitek z Kumránu začíná svůj seznam ukrytého pokladu zříceninou v Achórském údolí."
    - "Po pádu Jericha Achan, syn Karmiho, „vzal něco z věcí proklatých“ a Izrael byl poražen před Ajem. Losem nalezen, přiznal se: „Viděl jsem mezi loupeží plášť jeden Babylonský pěkný, a dvě stě lotů stříbra, a prut zlatý jeden, padesáte lotů ztíží, čehož požádav, vzal jsem to“. Jozue a všecken Izrael ho přivedli i s rodinou, dobytkem a loupeží „do údolí Achor“; „Proč jsi zkormoutil nás? Zkormutiž tebe Hospodin v tento den“, řekl Jozue, a ukamenovali ho a naházeli na něj „hromadu kamení velikou, kteráž trvá až do tohoto dne; a tak odvrácen jest Hospodin od hněvu prchlivosti své. Protož nazváno jest jméno místa toho údolí Achor“. Kroniky ho připomínají jako Achara, „kterýž zkormoutil Izraele“."
    - "Proroci jméno obrátili. Izajáš slibuje: „Lid pak můj, kteříž by mne hledali, budou míti Sáron za pastviště ovcím, a údolí Achor za odpočivadlo skotům“, a Ozeáš, že Pán přivede Izrael zpět jako na poušť jeho mládí a dá mu „údolé Achor místo dveří naděje“. Dnes je Buqej'a holá plošina Judské pouště nad Mrtvým mořem, protkaná beduínskými stezkami, a Wádí Kelt nese akvadukt ke klášteru svatého Jiří a zříceninám Herodových zimních paláců u ústí soutěsky."
  sv:
    - "Akordalen, ”olycka”, är dalen nära Jeriko där Akan stenades, och ett landmärke på Judas norra gräns, som ”drog sig … upp till Debir från Akors dal” på väg mot uppstigningen till Adummim och Jerusalem. Dess läge är osäkert. Eusebios placerade den norr om Jeriko; de flesta moderna kartor, och den första kandidaten på kartan, tar den för el-Buqei'a, den höglänta ökenplatån sydväst om Jeriko bakom Qumran, där Frank Cross och Józef Milik undersökte tre bosättningar från järnåldern på 1950-talet; Wadi Qelt, ravinen som öppnar sig mot Jeriko från väster, är en annan kandidat. Kopparrullen från Qumran inleder sin förteckning över dold skatt med en ruin i Akordalen."
    - "Sedan Jeriko fallit ”tog” Akan, Karmis son, ”något av det tillspillogivna”, och Israel slogs tillbaka inför Ai. Funnen genom lottning bekände han: ”jag såg ibland bytet en dyrbar mantel från Sinear och två hundra siklar silver och en guldplatta, femtio siklar i vikt, och till detta fick begärelse och tog det”. Josua och hela Israel förde honom, hans familj, hans boskap och bytet ”upp till Akors dal”; ”Varför drog du olycka över oss?” sade Josua, ”Nu skall ock HERREN i dag låta olycka komma över dig”, och de stenade honom och kastade över honom ”ett stort stenröse, som finnes kvar ännu i dag; och så vände sig HERREN ifrån sin vredes glöd. Därav fick det stället namnet Akors dal, såsom det heter ännu i dag”. Krönikeboken minns honom som Akar, ”som drog olycka över Israel”."
    - "Profeterna vände på namnet. Jesaja lovar att Saron ska bli en betesmark för får ”och Akors dal en lägerplats för fäkreatur, och de skola givas åt mitt folk, när det söker mig”, och Hosea att Herren ska föra Israel tillbaka som till hennes ungdoms öken och göra ”Akors dal till en hoppets port”. I dag är Buqei'a en kal platå i Judeens öken ovanför Döda havet, genomkorsad av beduinstigar, och Wadi Qelt bär akvedukten till Sankt Georgs kloster och ruinerna av Herodes' vinterpalats vid ravinens mynning."
  nb:
    - "Akor-dalen, «ulykke», er dalen nær Jeriko der Akan ble steinet, og et landemerke på Judas nordgrense: «Så gikk grensen fra Akor-dalen op til Debir», på vei til oppstigningen til Adummim og Jerusalem. Beliggenheten er usikker. Eusebius plasserte den nord for Jeriko; de fleste moderne kart, og det første kandidatstedet på kartet, tar den for el-Buqei'a, ørkenplatået sørvest for Jeriko bak Qumran, der Frank Cross og Józef Milik undersøkte tre bosetninger fra jernalderen på 1950-tallet; Wadi Qelt, juvet som åpner seg mot Jeriko fra vest, er en annen kandidat. Kobberrullen fra Qumran begynner listen over skjult skatt med en ruin i Akor-dalen."
    - "Etter at Jeriko falt, Akan, Karmis sønn, «tok noget av det som var bannlyst», og Israel ble slått foran Ai. Da han ble funnet ved loddkasting, tilsto han: «Jeg så blandt byttet en kostelig babylonisk kappe og to hundre sekel sølv og en gullstang som veide femti sekel; disse ting fikk jeg lyst på og tok dem». Josva og hele Israel førte ham, familien hans, storfeet hans og byttet «op i Akor-dalen»; «For en ulykke du har ført over oss! Idag skal Herren føre ulykke over dig!» sa Josva, og de stenet ham: «Derefter kastet de en stor stenrøs sammen over ham, som er der den dag idag; og Herren vendte om fra sin brennende vrede. Derfor kaltes dette sted Akor-dalen». Krønikebøkene husker ham som Akar, «som førte Israel i ulykke»."
    - "Profetene snudde navnet. Jesaja lover at Sjaron skal bli en beitemark for småfe «og Akors dal til et hvilested for storfe, til gagn for mitt folk, som søker mig», og Hosea at Herren vil føre Israel tilbake som til ungdommens ørken og «gjøre Akors dal til en håpets dør for henne». I dag er Buqei'a et bart platå i Judeaørkenen over Dødehavet, krysset av beduinstier, og Wadi Qelt bærer akvedukten til Sankt Georg-klosteret og ruinene av Herodes' vinterpalasser ved munningen av juvet."
  tl:
    - "Ang Libis ng Achor, “gulo”, ay ang libis malapit sa Jerico kung saan binato si Achan, at palatandaan sa hilagang hangganan ng Juda, na “pasampa sa Debir mula sa libis ng Achor” patungo sa pag-akyat ng Adummim at Jerusalem. Hindi tiyak ang pook nito. Inilagay ito ni Eusebio sa hilaga ng Jerico; karamihan ng makabagong mapa, at ang unang kandidato ng mapa, ay kumikilala rito sa el-Buqei'a, ang mataas na talampas ng disyerto sa timog-kanluran ng Jerico sa likod ng Qumran, kung saan sinuri nina Frank Cross at Józef Milik ang tatlong paninirahan ng Panahong Bakal noong dekada 1950; ang Wadi Qelt, ang bangin na bumubukas sa Jerico mula kanluran, ay isa pang kandidato. Ang Balumbon na Tanso ng Qumran ay nagsisimula sa talaan ng nakatagong kayamanan sa isang guho sa libis ng Achor."
    - "Pagkabagsak ng Jerico, si Achan na anak ni Carmi ay “kumuha sa itinalagang bagay”, at natalo ang Israel sa harap ng Ai. Natagpuan sa palabunutan, nagtapat siya: “Nang aking makita sa samsam ang mainam na balabal na yaring Babilonia, at ang dalawang daang siklong pilak, at ang isang dila na ginto, na limang pung siklo ang timbang, ay akin ngang inimbot, at aking kinuha”. Dinala siya ni Josue at ng buong Israel, kasama ang kaniyang pamilya, baka at samsam, “sa libis ng Achor”; “Bakit mo kami binagabag? babagabagin ka sa araw na ito ng Panginoon”, sabi ni Josue, at binato nila siya at binuntunan siya ng “malaking bunton na mga bato, hanggang sa araw na ito; at ang Panginoon ay nagpigil ng kabangisan ng kaniyang galit. Kaya't ang pangalan ng dakong yaon ay tinawag na, Ang libis ng Achor”. Inaalala siya ng Mga Cronica bilang Achar, “na mangbabagabag ng Israel”."
    - "Binaligtad ng mga propeta ang pangalan. Ipinangako ni Isaias na ang Saron ay magiging kulungan ng mga kawan, “at ang libis ng Achor ay dakong higaan ng mga bakahan, dahil sa aking bayan na humanap sa akin”, at ni Oseas, na ibabalik ng Panginoon ang Israel gaya sa ilang ng kaniyang kabataan at ibibigay sa kaniya “ang libis ng Achor na pinakapintuan ng pagasa”. Ngayon ang Buqei'a ay hubad na talampas ng disyerto ng Judea sa itaas ng Dagat na Patay, tinatawid ng mga landas ng Beduino, at dinadala ng Wadi Qelt ang aqueduct sa monasteryo ni San Jorge at sa mga guho ng mga palasyong taglamig ni Herodes sa bukana ng bangin."
  da:
    - "Akordalen, »forstyrrelse«, er dalen nær Jeriko, hvor Akan blev stenet, og et landemærke på Judas nordgrænse, som »gaar op til Debir fra Akors Dal« på vej til Adummims opstigning og Jerusalem. Dens sted er usikkert. Eusebius placerede den nord for Jeriko; de fleste moderne kort, og kortets første kandidat, tager den for el-Buqei'a, den høje ørkenslette sydvest for Jeriko bag Qumran, hvor Frank Cross og Józef Milik i 1950'erne undersøgte tre bosættelser fra jernalderen; Wadi Qelt, kløften, der åbner sig mod Jeriko fra vest, er en anden kandidat. Kobberrullen fra Qumran begynder sin liste over skjulte skatte med en ruin i Akordalen."
    - "Efter Jerikos fald »tog af det bandlyste« Akan, Karmis søn, og Israel blev slået foran Ai. Udpeget ved lod tilstod han: »Thi jeg saa en kostelig babylonisk Kappe iblandt Byttet og to Hundrede Sekel Sølv og en Guldtunge, hvis Vægt var halvtredsindstyve Sekel, og jeg fik Lyst til dem og tog dem«. Josva og hele Israel førte ham, hans familie, hans kvæg og byttet »op i Akors Dal«; »Hvi har du forstyrret os? Herren skal forstyrre dig paa denne Dag«, sagde Josva, og de stenede ham og »opkastede en stor Stenhob over ham indtil denne Dag, og Herren vendte om fra sin strenge Vrede; derfor kaldte man det samme Steds Navn Akors Dal«. Krønikebøgerne husker ham som Akar, »som forstyrrede Israel«."
    - "Profeterne vendte navnet om. Esajas lover, at Saron skal blive »til en Græsgang for Faar og Akors Dal til et Leje for Øksne, for mit Folk, for dem, som søge mig«, og Hoseas, at Herren vil føre Israel tilbage som til ørkenen i hendes ungdom og give hende »Akors Dal som en Haabets Port«. I dag er Buqei'a en nøgen slette i Judæas ørken over Dødehavet, krydset af beduinstier, og Wadi Qelt fører akvæduktet til Sankt Georgs kloster og ruinerne af Herodes' vinterpaladser ved kløftens munding."
