# Overview article (ADR 0007). Mainstream facts only; the site is uncertain and the app's candidates (el-Buqei'a, Wadi Qelt) are given with Eusebius's placing north of Jericho, without a choice.
id: valley-of-achor
place: a31492f
title:
  en: "Valley of Achor"
  ru: "Долина Ахор"
  uk: "Долина Ахор"
  es: "Valle de Acor"
  pt: "Vale de Acor"
  de: "Achortal"
  fr: "Vallée d’Acor"
body:
  en:
    - "The Valley of Achor, “trouble”, is the valley near Jericho where Achan was stoned, and a landmark on the northern border of Judah, which “went up toward Debir from the valley of Achor” on its way to the ascent of Adummim and Jerusalem. Its site is uncertain. Eusebius placed it north of Jericho; most modern maps, and the first candidate on the map, take it for el-Buqei'a, the high desert plateau south-west of Jericho behind Qumran, where Frank Cross and Józef Milik found three fortified farms of the kings of Judah in 1955; the Wadi Qelt, the gorge that opens on Jericho from the west, is the other candidate. The Copper Scroll from Qumran begins its list of hidden treasure with a ruin in the valley of Achor."
    - "After Jericho fell Achan son of Carmi “took of the accursed thing”, and Israel was beaten before Ai. Found by lot, he confessed: “I saw among the spoils a goodly Babylonish garment, and two hundred shekels of silver, and a wedge of gold of fifty shekels weight, then I coveted them, and took them”. Joshua and all Israel brought him, his family, his cattle and the spoil “unto the valley of Achor”; “Why hast thou troubled us?” Joshua said, “the LORD shall trouble thee this day”, and they stoned him and raised over him “a great heap of stones unto this day. So the LORD turned from the fierceness of his anger. Wherefore the name of that place was called, The valley of Achor”. Chronicles remembers him as Achar, “the troubler of Israel”."
    - "The prophets turned the name round. Isaiah promises that Sharon will be a fold of flocks “and the valley of Achor a place for the herds to lie down in, for my people that have sought me”, and Hosea, that the Lord will bring Israel back as to the wilderness of her youth and give her “the valley of Achor for a door of hope”. Today the Buqei'a is a bare plateau of the Judean desert above the Dead Sea, crossed by Bedouin tracks, and the Wadi Qelt carries the aqueduct to the monastery of St George and the ruins of Herod's winter palaces at the mouth of the gorge."
  ru:
    - "Долина Ахор, «беда», — долина близ Иерихона, где побили камнями Ахана, и примета на северной границе Иуды, которая восходит «к Давиру от долины Ахор» на пути к возвышенности Адуммима и Иерусалиму. Место её неясно. Евсевий помещал её к северу от Иерихона; большинство современных карт, как и первый кандидат, отмеченный на карте, видят в ней эль-Букейю, высокое пустынное плато к юго-западу от Иерихона за Кумраном, где Фрэнк Кросс и Юзеф Милик в 1955 году нашли три укреплённые усадьбы царей Иудеи; Вади-Кельт, ущелье, выходящее к Иерихону с запада, — второй кандидат. Медный свиток из Кумрана начинает перечень спрятанных сокровищ с развалины в долине Ахор."
    - "После падения Иерихона Ахан, сын Хармия, «взял из заклятого», и Израиль был разбит перед Гаем. Найденный по жребию, он признался: «между добычею увидел я одну прекрасную Сеннаарскую одежду и двести сиклей серебра и слиток золота весом в пятьдесят сиклей; это мне полюбилось, и я взял это». Иисус и все Израильтяне вывели его, его семью, скот и добычу «на долину Ахор»; «за то, что ты навел на нас беду, Господь на тебя наводит беду в день сей», — сказал Иисус, и его побили камнями и набросали на него «большую груду камней, которая уцелела и до сего дня. После сего утихла ярость гнева Господня. Посему то место называется долиною Ахор». В Паралипоменоне он «Ахар, наведший беду на Израиля»."
    - "Пророки перевернули это имя. Исаия обещает, что Сарон будет пастбищем для овец, а долина Ахор — «местом отдыха для волов народа Моего, который взыскал Меня», а Осия — что Господь вернёт Израиль, как в пустыню его юности, и даст ему «долину Ахор, в преддверие надежды». Сегодня Букейя — голое плато Иудейской пустыни над Мёртвым морем, пересечённое бедуинскими тропами, а Вади-Кельт несёт водопровод к монастырю святого Георгия и к развалинам зимних дворцов Ирода в устье ущелья."
  uk:
    - "Долина Ахор, «лихо», — долина поблизу Єрихона, де побили Ахана камінням, і орієнтир на північній межі Юди, що «тягнеться гряниця вгору на Дебир від Ахор-долини» на шляху до підйому Адуммім і Єрусалима. Її місце непевне. Євсевій розмістив її на північ від Єрихона; більшість сучасних мап, і перший кандидат на мапі, беруть за неї ель-Букейа, високе пустельне плато на південний захід від Єрихона за Кумраном, де Френк Кросс і Юзеф Мілік 1955 року знайшли три укріплені ферми царів Юди; Вади-Кельт, ущелина, що відкривається на Єрихон із заходу, — другий кандидат. Мідний сувій з Кумрана починає свій перелік захованих скарбів з руїни в долині Ахор."
    - "Після падіння Єрихона Ахан, син Хармі, «взяв із заклятого», і Ізраїль був побитий перед Гаєм. Знайдений жеребом, він признався: «Побачив я між лупом гарне убраннє Синеарське та дві сотнї сиклів срібла та золотий язик вагою в пятьдесять сиклів. Полакомивсь на се, узяв тайкома». Ісус Навин і весь Ізраїль привели його, його родину, його худобу й здобич «на Ахор-долину»; «Про що довів єси нас до недолї? Тепер подасть тебе в недолю Господь», — сказав Ісус Навин, і вони побили його камінням і насипали над ним «високу могилу камяну, що стоїть там й по сей день. Господь же обернувся від завзятого гнїва свого. Тим прозивається те врочище Ахор-долина й по сей день». Хроніки пам’ятають його як Ахара, «що накликав лихо на Ізраїля»."
    - "Пророки обернули назву. Ісая обіцяє, що Шарон стане пасовищем овець, «а долина Ахор — місцем спочивку для волів народу мого, що до мене горнувся», а Осія — що Господь поверне Ізраїль, як до пустелі її молодості, і дасть їй: «долина Ахор (сумна) буде їй дверима до надїї». Нині Букейа — гола рівнина юдейської пустелі над Мертвим морем, перетята бедуїнськими стежками, а Вади-Кельт несе акведук до монастиря св. Георгія та руїн Іродових зимових палаців біля гирла ущелини."
  es:
    - "El valle de Acor, «turbación», es el valle cercano a Jericó donde fue apedreado Acán, y un hito de la frontera norte de Judá, que «torna á subir este término á Debir desde el valle de Achôr» de camino a la subida de Adumim y Jerusalén. Su emplazamiento es incierto. Eusebio lo situó al norte de Jericó; la mayoría de los mapas modernos, y el primer candidato del mapa, lo toman por el-Buqei'a, la meseta desértica alta al suroeste de Jericó, detrás de Qumrán, donde Frank Cross y Józef Milik hallaron en 1955 tres granjas fortificadas de los reyes de Judá; el Wadi Qelt, la garganta que se abre sobre Jericó desde el oeste, es el otro candidato. El Rollo de Cobre de Qumrán comienza su lista de tesoro escondido con una ruina en el valle de Acor."
    - "Tras la caída de Jericó, Acán hijo de Carmi «tomó del anatema», e Israel fue derrotado ante Hai. Descubierto por suertes, confesó: «vi entre los despojos un manto babilónico muy bueno, y doscientos siclos de plata, y un changote de oro de peso de cincuenta siclos; lo cual codicié, y tomé». Josué y todo Israel lo llevaron a él, a su familia, su ganado y los despojos «al valle de Achôr»; «¿Por qué nos has turbado?», dijo Josué, «Túrbete Jehová en este día», y lo apedrearon y levantaron sobre él «un gran montón de piedras, hasta hoy. Y Jehová se tornó de la ira de su furor. Y por esto fué llamado aquel lugar el Valle de Achôr». Crónicas lo recuerda como Acar, «el que alborotó á Israel»."
    - "Los profetas dieron la vuelta al nombre. Isaías promete que Sarón será habitación de ovejas «y el valle de Achôr para majada de vacas, á mi pueblo que me buscó», y Oseas, que el Señor hará volver a Israel como al desierto de su juventud y le dará «el valle de Achôr por puerta de esperanza». Hoy la Buqei'a es una meseta desnuda del desierto de Judea sobre el mar Muerto, cruzada por sendas de beduinos, y el Wadi Qelt lleva el acueducto al monasterio de San Jorge y a las ruinas de los palacios de invierno de Herodes en la boca de la garganta."
  pt:
    - "O Vale de Acor, “desgraça”, é o vale perto de Jericó onde Acã foi apedrejado, e um marco da fronteira norte de Judá, que “subia a Debir desde o vale de Acor” a caminho da subida de Adumim e de Jerusalém. Seu sítio é incerto. Eusébio o pôs ao norte de Jericó; a maioria dos mapas modernos, e o primeiro candidato do mapa, o tomam por el-Buqei'a, o alto planalto desértico a sudoeste de Jericó, atrás de Qumran, onde Frank Cross e Józef Milik acharam em 1955 três fazendas fortificadas dos reis de Judá; o Wadi Qelt, a garganta que se abre sobre Jericó pelo oeste, é o outro candidato. O Rolo de Cobre de Qumran começa sua lista de tesouro escondido com uma ruína no vale de Acor."
    - "Depois da queda de Jericó, Acã, filho de Carmi, “pegou algumas das coisas consagradas”, e Israel foi vencido diante de Ai. Achado por sorteio, confessou: “Quando vi entre os despojos uma bela capa babilônica, duzentos siclos de prata, e uma barra de ouro pesando cinquenta siclos, então eu os cobicei e os peguei”. Josué e todo o Israel o levaram, com sua família, seu gado e o despojo, “ao vale de Acor”; “Por que você nos trouxe desgraça? O SENHOR trará desgraça sobre você hoje”, disse Josué, e o apedrejaram e levantaram sobre ele “um grande monte de pedras que permanece até o dia de hoje. O SENHOR se afastou do furor da sua ira. Por isso o nome daquele lugar foi chamado ‘O vale de Acor’”. Crônicas o recorda como Acar, “o perturbador de Israel”."
    - "Os profetas inverteram o nome. Isaías promete que Sarom será um curral de rebanhos “e o vale de Acor um lugar para o gado se deitar, para o meu povo que me buscou”, e Oseias, que o Senhor trará Israel de volta como ao deserto de sua juventude e lhe dará “o vale de Acor como uma porta de esperança”. Hoje a Buqei'a é um planalto nu do deserto de Judá acima do Mar Morto, cruzado por trilhas beduínas, e o Wadi Qelt leva o aqueduto ao mosteiro de São Jorge e às ruínas dos palácios de inverno de Herodes na boca da garganta."
  de:
    - "Das Achortal, „Unheil“, ist das Tal bei Jericho, wo Achan gesteinigt wurde, und ein Grenzpunkt an der Nordgrenze Judas, die „herauf gen Debir vom Tal Achor“ ging, auf ihrem Weg zur Steige Adummim und nach Jerusalem. Seine Lage ist unsicher. Eusebius setzte es nördlich von Jericho an; die meisten modernen Karten und der erste Kandidat der Karte halten es für el-Buqei'a, die hohe Wüstenhochfläche südwestlich von Jericho hinter Qumran, wo Frank Cross und Józef Milik 1955 drei befestigte Gehöfte der Könige von Juda fanden; das Wadi Qelt, die Schlucht, die sich von Westen auf Jericho öffnet, ist der andere Kandidat. Die Kupferrolle von Qumran beginnt ihre Liste verborgener Schätze mit einer Ruine im Tal Achor."
    - "Nach dem Fall Jerichos nahm Achan, der Sohn Karmis, „des Verbannten etwas“, und Israel wurde vor Ai geschlagen. Durch das Los entdeckt, gestand er: „ich sah unter dem Raub einen köstlichen babylonischen Mantel und zweihundert Silberlinge und eine goldene Stange, fünfzig Lot am Gewicht; des gelüstete mich, und ich nahm es“. Josua und ganz Israel führten ihn, seine Familie, sein Vieh und den Raub „hinauf ins Tal Achor“; Josua sprach: „Weil du uns betrübt hast, so betrübe dich der HERR an diesem Tage“, und sie steinigten ihn, und danach „machten sie über sie einen großen Steinhaufen, der bleibt bis auf diesen Tag. Also kehrte sich der HERR von dem Grimm seines Zorns. Daher heißt derselbe Ort das Tal Achor bis auf diesen Tag“. Die Chronik erinnert ihn als Achar, „welcher Israel betrübte“."
    - "Die Propheten wendeten den Namen um. Jesaja verheißt: „Saron soll eine Weide für die Herde und das Tal Achor soll zum Viehlager werden meinem Volk, das mich sucht“, und Hosea, dass der Herr Israel wie in die Wüste ihrer Jugend zurückführen und ihr „das Tal Achor zum Tor der Hoffnung“ geben werde. Heute ist die Buqei'a eine kahle Hochfläche der Judäischen Wüste über dem Toten Meer, von Beduinenpfaden durchzogen, und das Wadi Qelt führt die Wasserleitung zum Kloster St. Georg und zu den Ruinen der Winterpaläste des Herodes an der Mündung der Schlucht."
  fr:
    - "La vallée d’Acor, « trouble », est la vallée près de Jéricho où Acan fut lapidé, et un repère de la frontière nord de Juda, qui « montait à Debir, à quelque distance de la vallée d’Acor » en allant vers la montée d’Adummim et Jérusalem. Son site est incertain. Eusèbe la plaçait au nord de Jéricho ; la plupart des cartes modernes, et le premier candidat de la carte, y voient el-Buqei’a, le haut plateau désertique au sud-ouest de Jéricho, derrière Qumrân, où Frank Cross et Józef Milik trouvèrent en 1955 trois fermes fortifiées des rois de Juda ; le Wadi Qelt, la gorge qui s’ouvre sur Jéricho à l’ouest, est l’autre candidat. Le Rouleau de cuivre de Qumrân commence sa liste de trésors cachés par une ruine de la vallée d’Acor."
    - "Après la chute de Jéricho, Acan fils de Carmi « prit des choses dévouées », et Israël fut battu devant Aï. Désigné par le sort, il avoua : « J’ai vu dans le butin un beau manteau de Schinear, deux cents sicles d’argent, et un lingot d’or du poids de cinquante sicles ; je les ai convoités, et je les ai pris ». Josué et tout Israël l’amenèrent, avec sa famille, ses bêtes et le butin, « dans la vallée d’Acor » ; « Pourquoi nous as-tu troublés ? » dit Josué, « L’Éternel te troublera aujourd’hui », et ils le lapidèrent et élevèrent sur lui « un grand monceau de pierres, qui subsiste encore aujourd’hui. Et l’Éternel revint de l’ardeur de sa colère. C’est à cause de cet événement qu’on a donné jusqu’à ce jour à ce lieu le nom de vallée d’Acor ». Les Chroniques se souviennent de lui sous le nom d’Acar, « qui troubla Israël »."
    - "Les prophètes retournèrent le nom. Ésaïe promet que le Saron sera un pâturage pour le menu bétail « et la vallée d’Acor servira de gîte au gros bétail, pour mon peuple qui m’aura cherché », et Osée, que le Seigneur ramènera Israël au désert comme au temps de sa jeunesse et lui donnera « la vallée d’Acor, comme une porte d’espérance ». Aujourd’hui, la Buqei’a est un plateau nu du désert de Judée au-dessus de la mer Morte, sillonné de pistes bédouines, et le Wadi Qelt porte l’aqueduc vers le monastère Saint-Georges et les ruines des palais d’hiver d’Hérode à l’entrée de la gorge."
