# Overview article (ADR 0007). Mainstream facts only; the site is uncertain and the app's candidates (el-Buqei'a, Wadi Qelt) are given with Eusebius's placing north of Jericho, without a choice.
id: valley-of-achor
place: a31492f
title:
  en: "Valley of Achor"
  ru: "Долина Ахор"
body:
  en:
    - "The Valley of Achor, “trouble”, is the valley near Jericho where Achan was stoned, and a landmark on the northern border of Judah, which “went up toward Debir from the valley of Achor” on its way to the ascent of Adummim and Jerusalem. Its site is uncertain. Eusebius placed it north of Jericho; most modern maps, and the first candidate on the map, take it for el-Buqei'a, the high desert plateau south-west of Jericho behind Qumran, where Frank Cross and Józef Milik found three fortified farms of the kings of Judah in 1955; the Wadi Qelt, the gorge that opens on Jericho from the west, is the other candidate. The Copper Scroll from Qumran begins its list of hidden treasure with a ruin in the valley of Achor."
    - "After Jericho fell Achan son of Carmi “took of the accursed thing”, and Israel was beaten before Ai. Found by lot, he confessed: “I saw among the spoils a goodly Babylonish garment, and two hundred shekels of silver, and a wedge of gold of fifty shekels weight, then I coveted them, and took them”. Joshua and all Israel brought him, his family, his cattle and the spoil “unto the valley of Achor”; “Why hast thou troubled us?” Joshua said, “the LORD shall trouble thee this day”, and they stoned him and raised over him “a great heap of stones unto this day. So the LORD turned from the fierceness of his anger. Wherefore the name of that place was called, The valley of Achor”. Chronicles remembers him as Achar, “the troubler of Israel”."
    - "The prophets turned the name round. Isaiah promises that Sharon will be a fold of flocks “and the valley of Achor a place for the herds to lie down in, for my people that have sought me”, and Hosea, that the Lord will bring Israel back as to the wilderness of her youth and give her “the valley of Achor for a door of hope”. Today the Buqei'a is a bare plateau of the Judean desert above the Dead Sea, crossed by Bedouin tracks, and the Wadi Qelt carries the aqueduct to the monastery of St George and the ruins of Herod's winter palaces at the mouth of the gorge."
  ru:
    - "Долина Ахор, «беда», — долина близ Иерихона, где побили камнями Ахана, и примета на северной границе Иуды, которая восходит «к Давиру от долины Ахор» на пути к возвышенности Адуммима и Иерусалиму. Место её неясно. Евсевий помещал её к северу от Иерихона; большинство современных карт, как и первый кандидат, отмеченный на карте, видят в ней эль-Букейю, высокое пустынное плато к юго-западу от Иерихона за Кумраном, где Фрэнк Кросс и Юзеф Милик в 1955 году нашли три укреплённые усадьбы царей Иудеи; Вади-Кельт, ущелье, выходящее к Иерихону с запада, — второй кандидат. Медный свиток из Кумрана начинает перечень спрятанных сокровищ с развалины в долине Ахор."
    - "После падения Иерихона Ахан, сын Хармия, «взял из заклятого», и Израиль был разбит перед Гаем. Найденный по жребию, он признался: «между добычею увидел я одну прекрасную Сеннаарскую одежду и двести сиклей серебра и слиток золота весом в пятьдесят сиклей; это мне полюбилось, и я взял это». Иисус и все Израильтяне вывели его, его семью, скот и добычу «на долину Ахор»; «за то, что ты навел на нас беду, Господь на тебя наводит беду в день сей», — сказал Иисус, и его побили камнями и набросали на него «большую груду камней, которая уцелела и до сего дня. После сего утихла ярость гнева Господня. Посему то место называется долиною Ахор». В Паралипоменоне он «Ахар, наведший беду на Израиля»."
    - "Пророки перевернули это имя. Исаия обещает, что Сарон будет пастбищем для овец, а долина Ахор — «местом отдыха для волов народа Моего, который взыскал Меня», а Осия — что Господь вернёт Израиль, как в пустыню его юности, и даст ему «долину Ахор, в преддверие надежды». Сегодня Букейя — голое плато Иудейской пустыни над Мёртвым морем, пересечённое бедуинскими тропами, а Вади-Кельт несёт водопровод к монастырю святого Георгия и к развалинам зимних дворцов Ирода в устье ущелья."
