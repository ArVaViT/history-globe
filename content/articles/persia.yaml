# Overview article (ADR 0007). Mainstream facts only; the identification of Ahasuerus with Xerxes is the usual one, and the date of Ezra's mission is noted as debated.
id: persia
place: ab9696f
title:
  en: "Persia"
  ru: "Персия"
  uk: "Персія"
  es: "Persia"
  pt: "Pérsia"
  de: "Persien"
  fr: "Perse"
  it: "Persia"
  pl: "Persja"
  cs: "Persie"
  nl: "Perzië"
body:
  en:
    - 'Persia in the strict sense is Persis or Parsa, the modern province of Fars in south-western Iran, a highland behind the Persian Gulf with its old capitals Pasargadae and Persepolis; in the Bible and in common use it is the empire that the kings of this land ruled. The Persians, an Iranian people, had settled there by the seventh century BC under kings who traced themselves to Achaemenes, and were at first subjects of the Medes, their kinsmen. The empire of the Medes and Persians, as Daniel and Esther name it, reigned "from India even unto Ethiopia, over an hundred and seven and twenty provinces".'
    - 'Cyrus II, the Great, overthrew the Median king Astyages about 550 BC, took Lydia and in 539 Babylon, where the Cyrus Cylinder records his restoration of exiled peoples and their gods. The Bible sees him as the Lord''s shepherd and anointed, "Cyrus king of Persia", whose decree in his first year let the Jews go up to Jerusalem and build the house of the LORD; Daniel "prospered in the reign of Darius, and in the reign of Cyrus the Persian". Cambyses took Egypt in 525; Darius I (522–486), whose inscription at Behistun tells of his rise, built Persepolis and a palace at Susa, organised the satrapies and confirmed the decree of Cyrus found at Ecbatana, so that the temple was finished in his sixth year, 515 BC.'
    - 'The Ahasuerus of Esther, who reigned at Shushan, is usually identified with Xerxes (486–465), the invader of Greece. Under Artaxerxes I (465–424) Nehemiah, his cupbearer, was sent in his twentieth year, 445 BC, to rebuild the walls of Jerusalem, and Ezra came with the king''s letter in his seventh year, 458 BC, though some scholars put Ezra under Artaxerxes II, in 398. The Jews of the empire lived under the Persian peace for two centuries, in Judah, in Babylonia and at Elephantine, where their Aramaic papyri survive. Persian words and institutions mark the books of Ezra, Nehemiah, Esther and Daniel, which also sees "the prince of the kingdom of Persia" and foretells a king of Greece who will overthrow it.'
    - "Alexander defeated Darius III at Issus and Gaugamela and burned Persepolis in 330 BC. Persia rose again under the Parthians and then the Sasanians (224–651), who fought Rome and Byzantium until the Arab conquest. Fars is today a province of the Islamic Republic of Iran, with Shiraz as its capital; the ruins of Persepolis and the tomb of Cyrus at Pasargadae are UNESCO sites, and Iran still has a small Jewish community that traces itself to the exile."
  ru:
    - "Персия в узком смысле — это Персида, или Парса, нынешняя провинция Фарс на юго-западе Ирана, нагорье за Персидским заливом с древними столицами Пасаргадами и Персеполем; в Библии и в обычном словоупотреблении это держава, которой правили цари этой земли. Персы, иранский народ, поселились там к VII веку до н. э. под властью царей, возводивших себя к Ахемену, и сперва были подданными Мидян, своих родичей. Царство Мидян и Персов, как называют его Даниил и книга Есфири, простиралось «над ста двадцатью семью областями от Индии и до Ефиопии»."
    - "Кир II Великий низверг мидийского царя Астиага около 550 г. до н. э., взял Лидию, а в 539 г. — Вавилон, где Цилиндр Кира сообщает о возвращении им изгнанных народов и их богов. Библия видит в нём пастыря и помазанника Господня, «Кира, царя Персидского», чей указ в первый год его царствования позволил Иудеям идти в Иерусалим и строить дом Господень; Даниил «благоуспевал и в царствование Дария, и в царствование Кира Персидского». Камбиз взял Египет в 525 г.; Дарий I (522–486), чья надпись в Бехистуне рассказывает о его возвышении, строил Персеполь и дворец в Сузах, устроил сатрапии и подтвердил указ Кира, найденный в Екбатане, так что храм был окончен в шестой год его царствования, в 515 г. до н. э."
    - "Артаксеркса книги Есфири (в еврейском тексте — Ахашвероша), царствовавшего в Сузах, обычно отождествляют с Ксерксом (486–465), вторгшимся в Грецию. При Артаксерксе I (465–424) его виночерпий Неемия был послан в двадцатый год царя, в 445 г. до н. э., восстановить стены Иерусалима, а Ездра пришёл с письмом царя в седьмой его год, в 458 г., хотя некоторые учёные относят Ездру ко времени Артаксеркса II, к 398 г. Иудеи державы два века жили под персидским миром — в Иудее, в Вавилонии и на Элефантине, где сохранились их арамейские папирусы. Персидские слова и учреждения отмечают книги Ездры, Неемии, Есфири и Даниила, где «князь царства Персидского» противится вестнику и предречён царь Греции, который низвергнет Персию."
    - "Александр разбил Дария III при Иссе и Гавгамелах и сжёг Персеполь в 330 г. до н. э. Персия вновь поднялась при Парфянах, а затем при Сасанидах (224–651), воевавших с Римом и Византией вплоть до арабского завоевания. Фарс сегодня — провинция Исламской Республики Иран со столицей в Ширазе; развалины Персеполя и гробница Кира в Пасаргадах — объекты ЮНЕСКО, а в Иране до сих пор живёт небольшая еврейская община, возводящая себя к пленению."
  uk:
    - "Персія у вузькому розумінні — це Персида, або Парса, нинішня провінція Фарс на південному заході Ірану, нагір’я за Перською затокою зі стародавніми столицями Пасаргади та Персеполь; у Біблії й у загальному вжитку так називають імперію, якою правили царі цієї землі. Перси, іранський народ, оселилися там до VII ст. до н. е. під владою царів, що виводили свій рід від Ахемена, і спершу були підданими мідян, своїх родичів. Царство мідян і персів, як його називають книги Даниїла та Естер, панувало «над сто двайцятьма сьома країнами від Индиї до Етиопиї»."
    - "Кір II Великий скинув мідійського царя Астіага близько 550 р. до н. е., підкорив Лідію, а 539 р. до н. е. — Вавилон, де Циліндр Кіра повідомляє про повернення ним вигнаних народів та їхніх богів. Біблія бачить у ньому Господнього пастиря й помазаника — «Кира, царя Перського», — чий указ у перший рік царювання дозволив юдеям вирушити до Єрусалима й збудувати дім Господній; про Даниїла сказано: «добре дїялось Даниїлові так за царювання Дарія як і за царя Кира Перського». Камбіз узяв Єгипет 525 р. до н. е.; Дарій I (522–486 рр. до н. е.), чий напис у Бехістуні розповідає про його піднесення, збудував Персеполь і палац у Сузах, упорядкував сатрапії й підтвердив указ Кіра, знайдений в Екбатані, так що храм було завершено на шостий рік його правління, 515 р. до н. е."
    - "Ахашвероша з книги Естер, який царював у Сузах, зазвичай ототожнюють з Ксерксом (486–465 рр. до н. е.), що вдерся до Греції. За Артаксеркса I (465–424 рр. до н. е.) Неемію, його чашника, було послано на двадцятий рік царя, 445 р. до н. е., відбудувати мури Єрусалима, а Ездра прибув із листом царя на його сьомий рік, 458 р. до н. е., хоч деякі вчені відносять Ездру до часів Артаксеркса II, до 398 р. до н. е. Юдеї імперії жили під перським миром два століття — в Юді, у Вавилонії та на Елефантині, де збереглися їхні арамейські папіруси. Перські слова й установи позначають книги Ездри, Неемії, Естер і Даниїла; остання бачить також «князь (ангел) царства Перського» і провіщає царя Греції, який повалить це царство."
    - "Александр розбив Дарія III під Іссом і Гавгамелами та спалив Персеполь 330 р. до н. е. Персія піднялася знову за парфян, а потім за Сасанідів (224–651), які воювали з Римом і Візантією аж до арабського завоювання. Фарс сьогодні — провінція Ісламської Республіки Іран зі столицею в Ширазі; руїни Персеполя та гробниця Кіра в Пасаргадах є об’єктами ЮНЕСКО, а в Ірані й досі живе невелика єврейська громада, що виводить себе від вигнання."
  es:
    - "Persia en sentido estricto es Persis o Parsa, la actual provincia de Fars, en el suroeste de Irán, una región montañosa detrás del golfo Pérsico con sus antiguas capitales Pasargada y Persépolis; en la Biblia y en el uso común es el imperio que gobernaron los reyes de esta tierra. Los persas, un pueblo iranio, se habían establecido allí en el siglo VII a. C. bajo reyes que se remontaban a Aquemenes, y fueron al principio súbditos de los medos, sus parientes. El imperio de los medos y los persas, como lo nombran Daniel y Ester, reinó «desde la India hasta la Etiopía sobre ciento veinte y siete provincias»."
    - "Ciro II el Grande derrocó al rey medo Astiages hacia 550 a. C., tomó Lidia y en 539 Babilonia, donde el Cilindro de Ciro registra su restauración de los pueblos exiliados y de sus dioses. La Biblia lo ve como pastor y ungido del Señor, «Ciro rey de Persia», cuyo decreto en su primer año permitió a los judíos subir a Jerusalén y edificar la casa del Señor; Daniel «fué prosperado durante el reinado de Darío, y durante el reinado de Ciro, Persa». Cambises tomó Egipto en 525; Darío I (522–486), cuya inscripción en Behistún cuenta su ascenso, construyó Persépolis y un palacio en Susa, organizó las satrapías y confirmó el decreto de Ciro hallado en Ecbatana, de modo que el templo se terminó en su sexto año, 515 a. C."
    - "El Asuero de Ester, que reinó en Susán, suele identificarse con Jerjes (486–465), el invasor de Grecia. Bajo Artajerjes I (465–424) Nehemías, su copero, fue enviado en su año veinte, 445 a. C., a reconstruir las murallas de Jerusalén, y Esdras vino con la carta del rey en su año séptimo, 458 a. C., aunque algunos estudiosos sitúan a Esdras bajo Artajerjes II, en 398. Los judíos del imperio vivieron bajo la paz persa durante dos siglos, en Judá, en Babilonia y en Elefantina, donde se conservan sus papiros arameos. Palabras e instituciones persas marcan los libros de Esdras, Nehemías, Ester y Daniel, que ve también a «el príncipe del reino de Persia» y anuncia un rey de Grecia que lo derrocará."
    - "Alejandro derrotó a Darío III en Isos y Gaugamela e incendió Persépolis en 330 a. C. Persia resurgió bajo los partos y luego bajo los sasánidas (224–651), que lucharon contra Roma y Bizancio hasta la conquista árabe. Fars es hoy una provincia de la República Islámica de Irán, con Shiraz como capital; las ruinas de Persépolis y la tumba de Ciro en Pasargada son sitios de la UNESCO, e Irán aún tiene una pequeña comunidad judía que se remonta al exilio."
  pt:
    - "Pérsia em sentido estrito é a Pérside ou Parsa, a atual província de Fars, no sudoeste do Irã, um planalto atrás do golfo Pérsico com suas antigas capitais Pasárgada e Persépolis; na Bíblia e no uso comum é o império que os reis dessa terra governaram. Os persas, povo iraniano, ali se haviam fixado no século VII a.C. sob reis que se faziam descender de Aquêmenes, e foram a princípio súditos dos medos, seus parentes. O império dos medos e persas, como o chamam Daniel e Ester, reinava “desde a Índia até a Etiópia, sobre cento e vinte e sete províncias”."
    - "Ciro II, o Grande, derrubou o rei medo Astíages por volta de 550 a.C., tomou a Lídia e, em 539, a Babilônia, onde o Cilindro de Ciro registra sua restauração dos povos exilados e de seus deuses. A Bíblia o vê como pastor e ungido do Senhor, “Ciro, rei da Pérsia”, cujo decreto em seu primeiro ano permitiu que os judeus subissem a Jerusalém e edificassem a casa do SENHOR; Daniel “prosperou no reinado de Dario e no reinado de Ciro, o persa”. Cambises tomou o Egito em 525; Dario I (522–486), cuja inscrição em Behistun conta sua ascensão, construiu Persépolis e um palácio em Susã, organizou as satrapias e confirmou o decreto de Ciro achado em Ecbatana, de modo que o templo foi concluído em seu sexto ano, 515 a.C."
    - "O Assuero de Ester, que reinou em Susã, é geralmente identificado com Xerxes (486–465), o invasor da Grécia. Sob Artaxerxes I (465–424), Neemias, seu copeiro, foi enviado no vigésimo ano, 445 a.C., para reconstruir os muros de Jerusalém, e Esdras veio com a carta do rei no sétimo ano, 458 a.C., embora alguns estudiosos ponham Esdras sob Artaxerxes II, em 398. Os judeus do império viveram sob a paz persa por dois séculos, em Judá, na Babilônia e em Elefantina, onde sobrevivem seus papiros aramaicos. Palavras e instituições persas marcam os livros de Esdras, Neemias, Ester e Daniel, que também vê “o príncipe do reino da Pérsia” e prediz um rei da Grécia que a derrubará."
    - "Alexandre derrotou Dario III em Isso e Gaugamela e queimou Persépolis em 330 a.C. A Pérsia ressurgiu sob os partas e depois os sassânidas (224–651), que lutaram contra Roma e Bizâncio até a conquista árabe. Fars é hoje uma província da República Islâmica do Irã, com Xiraz como capital; as ruínas de Persépolis e o túmulo de Ciro em Pasárgada são sítios da UNESCO, e o Irã ainda tem uma pequena comunidade judaica que se faz descender do exílio."
  de:
    - "Persien im engeren Sinn ist Persis oder Parsa, die heutige Provinz Fars im Südwesten Irans, ein Hochland hinter dem Persischen Golf mit den alten Hauptstädten Pasargadai und Persepolis; in der Bibel und im allgemeinen Gebrauch ist es das Reich, das die Könige dieses Landes beherrschten. Die Perser, ein iranisches Volk, hatten sich dort im 7. Jahrhundert v. Chr. unter Königen niedergelassen, die sich auf Achaimenes zurückführten, und waren zunächst Untertanen der Meder, ihrer Verwandten. Das Reich der Meder und Perser, wie Daniel und Ester es nennen, herrschte von Indien bis Äthiopien „über hundert und siebenundzwanzig Länder“."
    - "Kyrus II., der Große, stürzte um 550 v. Chr. den Mederkönig Astyages, nahm Lydien und 539 Babylon, wo der Kyrus-Zylinder seine Rückführung verbannter Völker und ihrer Götter verzeichnet. Die Bibel sieht in ihm den Hirten und Gesalbten des Herrn, „Kores, der König in Persien“, dessen Erlass in seinem ersten Jahr die Juden nach Jerusalem ziehen und das Haus des HERRN bauen ließ; Daniel „ward gewaltig im Königreich des Darius und auch im Königreich des Kores, des Persers“. Kambyses nahm 525 Ägypten ein; Darius I. (522–486), dessen Inschrift von Behistun von seinem Aufstieg erzählt, baute Persepolis und einen Palast in Susa, ordnete die Satrapien und bestätigte den in Ekbatana gefundenen Erlass des Kyrus, sodass der Tempel in seinem sechsten Jahr, 515 v. Chr., fertig wurde."
    - "Der Ahasveros des Buches Ester, der in Susa regierte, wird meist mit Xerxes (486–465), dem Eroberer Griechenlands, gleichgesetzt. Unter Artaxerxes I. (465–424) wurde Nehemia, sein Mundschenk, in dessen zwanzigstem Jahr, 445 v. Chr., gesandt, die Mauern Jerusalems wiederaufzubauen, und Esra kam mit dem Brief des Königs in dessen siebtem Jahr, 458 v. Chr., obwohl manche Gelehrte Esra unter Artaxerxes II. setzen, 398. Die Juden des Reiches lebten zwei Jahrhunderte unter dem persischen Frieden, in Juda, in Babylonien und in Elephantine, wo ihre aramäischen Papyri erhalten sind. Persische Wörter und Einrichtungen prägen die Bücher Esra, Nehemia, Ester und Daniel, in dem auch „der Fürst des Königreiches im Perserland“ erscheint und ein König von Griechenland angekündigt wird, der es stürzen wird."
    - "Alexander besiegte Darius III. bei Issos und Gaugamela und verbrannte 330 v. Chr. Persepolis. Persien erstand wieder unter den Parthern und dann den Sasaniden (224–651), die gegen Rom und Byzanz kämpften, bis die arabische Eroberung kam. Fars ist heute eine Provinz der Islamischen Republik Iran mit Schiras als Hauptstadt; die Ruinen von Persepolis und das Grab des Kyrus bei Pasargadai sind UNESCO-Stätten, und im Iran gibt es noch eine kleine jüdische Gemeinde, die sich auf das Exil zurückführt."
  fr:
    - "La Perse au sens strict est la Perside ou Parsa, l’actuelle province du Fars, dans le sud-ouest de l’Iran, haute terre derrière le golfe Persique avec ses anciennes capitales Pasargades et Persépolis ; dans la Bible et l’usage courant, c’est l’empire qu’y régnèrent ses rois. Les Perses, peuple iranien, s’y étaient installés dès le VIIe siècle av. J.-C. sous des rois qui se rattachaient à Achéménès, et furent d’abord sujets des Mèdes, leurs parents. L’empire des Mèdes et des Perses, comme le nomment Daniel et Esther, régnait « depuis l’Inde jusqu’en Éthiopie sur cent vingt-sept provinces »."
    - "Cyrus II le Grand renversa le roi mède Astyage vers 550 av. J.-C., prit la Lydie et, en 539, Babylone, où le Cylindre de Cyrus consigne le rétablissement des peuples exilés et de leurs dieux. La Bible le voit comme le berger et l’oint du Seigneur, « Cyrus, roi de Perse », dont l’édit de la première année permit aux Juifs de monter à Jérusalem et de rebâtir la maison de l’Éternel ; « Daniel prospéra sous le règne de Darius, et sous le règne de Cyrus, le Perse ». Cambyse prit l’Égypte en 525 ; Darius Ier (522–486), dont l’inscription de Behistun raconte l’ascension, bâtit Persépolis et un palais à Suse, organisa les satrapies et confirma l’édit de Cyrus trouvé à Ecbatane, si bien que le temple fut achevé dans sa sixième année, en 515 av. J.-C."
    - "L’Assuérus d’Esther, qui régnait à Suse, est d’ordinaire identifié à Xerxès (486–465), l’envahisseur de la Grèce. Sous Artaxerxès Ier (465–424), Néhémie, son échanson, fut envoyé dans sa vingtième année, en 445 av. J.-C., rebâtir les murs de Jérusalem, et Esdras vint avec la lettre du roi dans sa septième année, en 458 av. J.-C., bien que certains placent Esdras sous Artaxerxès II, en 398. Les Juifs de l’empire vécurent deux siècles sous la paix perse, en Juda, en Babylonie et à Éléphantine, dont subsistent les papyrus araméens. Des mots et des institutions perses marquent les livres d’Esdras, de Néhémie, d’Esther et de Daniel, qui voit aussi « le chef du royaume de Perse » et annonce un roi de Grèce qui le renversera."
    - "Alexandre vainquit Darius III à Issos et à Gaugamèles et brûla Persépolis en 330 av. J.-C. La Perse se releva sous les Parthes puis sous les Sassanides (224–651), qui combattirent Rome et Byzance jusqu’à la conquête arabe. Le Fars est aujourd’hui une province de la République islamique d’Iran, avec Chiraz pour capitale ; les ruines de Persépolis et le tombeau de Cyrus à Pasargades sont inscrits par l’UNESCO, et l’Iran garde une petite communauté juive qui se rattache à l’exil."
  it:
    - "La Persia in senso stretto è la Perside o Parsa, l’odierna provincia di Fars nell’Iran sud-occidentale, un altopiano dietro il Golfo Persico con le sue antiche capitali Pasargade e Persepoli; nella Bibbia e nell’uso comune è l’impero che i re di questa terra governarono. I Persiani, popolo iranico, vi si erano stabiliti entro il VII secolo a.C. sotto re che si facevano discendere da Achemene, ed erano in origine sudditi dei Medi, loro congiunti. L’impero dei Medi e dei Persiani, come lo chiamano Daniele ed Ester, regnava «dall’India sino all’Etiopia sopra centoventisette province»."
    - "Ciro II il Grande rovesciò il re dei Medi Astiage verso il 550 a.C., prese la Lidia e nel 539 Babilonia, dove il Cilindro di Ciro registra la sua restaurazione dei popoli esiliati e dei loro dèi. La Bibbia lo vede come pastore e unto del Signore, «Ciro, re di Persia», il cui editto del primo anno lasciò salire i Giudei a Gerusalemme per edificare la casa dell’Eterno; Daniele «prosperò sotto il regno di Dario, e sotto il regno di Ciro, il Persiano». Cambise prese l’Egitto nel 525; Dario I (522–486), la cui iscrizione di Behistun narra la sua ascesa, costruì Persepoli e un palazzo a Susa, organizzò le satrapie e confermò l’editto di Ciro trovato a Ecbatana, così che il tempio fu terminato nel suo sesto anno, il 515 a.C."
    - "L’Assuero di Ester, che regnava a Susa, è di solito identificato con Serse (486–465), l’invasore della Grecia. Sotto Artaserse I (465–424) Neemia, suo coppiere, fu mandato nel suo ventesimo anno, il 445 a.C., a ricostruire le mura di Gerusalemme, ed Esdra venne con la lettera del re nel suo settimo anno, il 458 a.C., benché alcuni studiosi collochino Esdra sotto Artaserse II, nel 398. Gli Ebrei dell’impero vissero per due secoli sotto la pace persiana, in Giuda, in Babilonia e a Elefantina, dove sopravvivono i loro papiri aramaici. Parole e istituzioni persiane segnano i libri di Esdra, Neemia, Ester e Daniele, il quale vede anche «il capo del regno di Persia» e predice un re di Grecia che lo rovescerà."
    - "Alessandro sconfisse Dario III a Isso e a Gaugamela e bruciò Persepoli nel 330 a.C. La Persia risorse sotto i Parti e poi i Sasanidi (224–651), che combatterono Roma e Bisanzio fino alla conquista araba. Il Fars è oggi una provincia della Repubblica Islamica dell’Iran, con Shiraz come capoluogo; le rovine di Persepoli e la tomba di Ciro a Pasargade sono siti UNESCO, e l’Iran ha ancora una piccola comunità ebraica che si fa risalire all’esilio."
  pl:
    - "Persja w ścisłym sensie to Persyda, czyli Parsa, dzisiejsza prowincja Fars w południowo-zachodnim Iranie, wyżyna za Zatoką Perską z dawnymi stolicami Pasargadami i Persepolis; w Biblii i w mowie potocznej jest to imperium, którym rządzili królowie tej ziemi. Persowie, lud irański, osiedlili się tam do VII wieku p.n.e. pod władzą królów wywodzących się od Achemenesa i byli z początku poddanymi Medów, swoich pobratymców. Imperium Medów i Persów, jak nazywają je Daniel i Estera, panowało od Indii aż do Etiopii, nad stu dwudziestoma siedmioma krainami."
    - "Cyrus II Wielki obalił medyjskiego króla Astyagesa około 550 roku p.n.e., zdobył Lidię, a w 539 Babilon, gdzie Cylinder Cyrusa zapisuje jego przywrócenie wygnanych ludów i ich bogów. Biblia widzi w nim pasterza i pomazańca Pana; w pierwszym roku „Cyrusa, króla Perskiego” jego dekret pozwolił Żydom udać się do Jerozolimy i zbudować dom Pański; „A Danijelowi się szczęśliwie powodziło w królestwie Daryjusza, i w królestwie Cyrusa, Persy”. Kambyzes zdobył Egipt w 525; Dariusz I (522–486), którego napis w Behistun opowiada o jego dojściu do władzy, zbudował Persepolis i pałac w Suzie, zorganizował satrapie i potwierdził dekret Cyrusa znaleziony w Ekbatanie, tak że świątynię ukończono w jego szóstym roku, 515 p.n.e."
    - "Aswerus z Księgi Estery, który panował w Suzie, utożsamiany jest zwykle z Kserksesem (486–465), najeźdźcą Grecji. Za Artakserksesa I (465–424) Nehemiasz, jego podczaszy, został posłany w dwudziestym roku jego panowania, 445 p.n.e., by odbudować mury Jerozolimy, a Ezdrasz przybył z listem króla w siódmym roku, 458 p.n.e., choć niektórzy uczeni umieszczają Ezdrasza za Artakserksesa II, w 398. Żydzi imperium żyli pod perskim pokojem przez dwa stulecia, w Judzie, w Babilonii i w Elefantynie, gdzie przetrwały ich aramejskie papirusy. Perskie słowa i instytucje znamionują księgi Ezdrasza, Nehemiasza, Estery i Daniela, w której występuje też „książę królestwa Perskiego” i zapowiedź króla Grecji, który je obali."
    - "Aleksander pokonał Dariusza III pod Issos i Gaugamelą i spalił Persepolis w 330 roku p.n.e. Persja podniosła się pod Partami, a potem pod Sasanidami (224–651), którzy walczyli z Rzymem i Bizancjum aż do podboju arabskiego. Fars jest dziś prowincją Islamskiej Republiki Iranu, ze stolicą w Szirazie; ruiny Persepolis i grobowiec Cyrusa w Pasargadach są obiektami UNESCO, a w Iranie nadal żyje niewielka społeczność żydowska, która wywodzi się od wygnania."
  cs:
    - "Persie v užším smyslu je Persis či Parsa, dnešní provincie Fárs v jihozápadním Íránu, vysočina za Perským zálivem se starými hlavními městy Pasargady a Persepolis; v Bibli a v běžném užití je to říše, kterou králové této země vládli. Peršané, íránský národ, se tam usadili do 7. století př. n. l. pod králi, kteří se odvozovali od Achaimena, a byli zprvu poddanými Médů, svých příbuzných. Říše Médů a Peršanů, jak ji nazývají Daniel a Ester, vládla „od Indie až k Mouřenínské zemi nad sto dvadcíti a sedmi krajinami“."
    - "Kýros II. Veliký svrhl kolem roku 550 př. n. l. médského krále Astyaga, dobyl Lýdii a roku 539 Babylón, kde Kýrův válec zaznamenává jeho navrácení vyhnaných národů a jejich bohů. Bible v něm vidí Hospodinova pastýře a pomazaného, „Cýrus král Perský“, jehož výnos v prvním roce dovolil Židům vystoupit do Jeruzaléma a vystavět dům Hospodinův; Danielovi „šťastně se vedlo v království Dariovu, a v království Cýra Perského“. Kambýsés dobyl Egypt roku 525; Dareios I. (522–486), jehož nápis v Bísutunu vypráví o jeho vzestupu, vystavěl Persepolis a palác v Susách, uspořádal satrapie a potvrdil Kýrův výnos nalezený v Ekbatanách, takže chrám byl dokončen v jeho šestém roce, 515 př. n. l."
    - "Achašveroš z Ester, který vládl v Susách, se obvykle ztotožňuje s Xerxem (486–465), dobyvatelem Řecka. Za Artaxerxa I. (465–424) byl Nehemjáš, jeho číšník, poslán ve dvacátém roce, 445 př. n. l., znovu vystavět hradby Jeruzaléma a Ezdráš přišel s královým listem v sedmém roce, 458 př. n. l., ač někteří učenci kladou Ezdráše za Artaxerxa II., do roku 398. Židé říše žili pod perským pokojem dvě století, v Judsku, v Babylonii a na Elefantině, odkud se dochovaly jejich aramejské papyry. Perská slova a instituce poznamenávají knihy Ezdráš, Nehemjáš, Ester a Daniel, jenž také vidí „kníže království Perského“ a předpovídá krále řeckého, který je svrhne."
    - "Alexandr porazil Dareia III. u Issu a Gaugamél a roku 330 př. n. l. spálil Persepolis. Persie znovu povstala pod Parthy a pak Sásánovci (224–651), kteří bojovali s Římem a Byzancí až do arabského dobytí. Fárs je dnes provincie Íránské islámské republiky s hlavním městem Šírázem; zříceniny Persepolis a Kýrova hrobka v Pasargadech jsou památky UNESCO a Írán má stále malou židovskou obec, která se odvozuje od exilu."
  nl:
    - "Perzië in strikte zin is Persis of Parsa, de moderne provincie Fars in het zuidwesten van Iran, een hoogland achter de Perzische Golf met de oude hoofdsteden Pasargadae en Persepolis; in de Bijbel en in het gewone spraakgebruik is het het rijk dat de koningen van dit land bestuurden. De Perzen, een Iraans volk, hadden zich er in de 7e eeuw v.Chr. gevestigd onder koningen die zich op Achaemenes beriepen, en waren eerst onderdanen van de Meden, hun verwanten. Het rijk van de Meden en Perzen, zoals Daniël en Ester het noemen, regeerde “van Indië af tot aan Morenland toe, honderd zeven en twintig landschappen”."
    - "Cyrus II de Grote wierp omstreeks 550 v.Chr. de Medische koning Astyages ten val, nam Lydië en in 539 Babylon, waar de Cyruscilinder zijn herstel van verbannen volken en hun goden vermeldt. De Bijbel ziet hem als de herder en gezalfde van de HEER, “Kores, koning van Perzië”, wiens besluit in zijn eerste jaar de Joden naar Jeruzalem liet optrekken om het huis van de HEER te bouwen; Daniël “had voorspoed in het koninkrijk van Darius, en in het koninkrijk van Kores, den Perziaan”. Cambyses nam Egypte in 525; Darius I (522–486), wiens opschrift bij Behistun zijn opkomst vertelt, bouwde Persepolis en een paleis in Susa, organiseerde de satrapieën en bevestigde het te Ekbatana gevonden besluit van Cyrus, zodat de tempel in zijn zesde jaar, 515 v.Chr., voltooid werd."
    - "De Ahasveros van Ester, die in Susan regeerde, wordt meestal gelijkgesteld met Xerxes (486–465), de indringer van Griekenland. Onder Artaxerxes I (465–424) werd Nehemia, zijn schenker, in zijn twintigste jaar, 445 v.Chr., gezonden om de muren van Jeruzalem te herbouwen, en Ezra kwam met de brief van de koning in diens zevende jaar, 458 v.Chr., al plaatsen sommige geleerden Ezra onder Artaxerxes II, in 398. De Joden van het rijk leefden twee eeuwen onder de Perzische vrede, in Juda, in Babylonië en op Elefantine, waar hun Aramese papyri bewaard zijn. Perzische woorden en instellingen kenmerken de boeken Ezra, Nehemia, Ester en Daniël, dat ook “de vorst des koninkrijks van Perzië” ziet en een koning van Griekenland voorspelt die het zal omverwerpen."
    - "Alexander versloeg Darius III bij Issos en Gaugamela en verbrandde Persepolis in 330 v.Chr. Perzië herrees onder de Parthen en daarna de Sassaniden (224–651), die tot de Arabische verovering tegen Rome en Byzantium vochten. Fars is tegenwoordig een provincie van de Islamitische Republiek Iran, met Shiraz als hoofdstad; de ruïnes van Persepolis en het graf van Cyrus te Pasargadae zijn UNESCO-erfgoed, en Iran heeft nog een kleine Joodse gemeenschap die zich op de ballingschap beroept."
