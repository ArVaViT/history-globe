body:
  en:
    - "Rhodes is the largest island of the Dodecanese, off the south-west corner of Asia Minor; its city of the same name stands at the island's northern tip. In the Iliad the Rhodians come to Troy from three towns, Lindus, Ialysus and Camirus. In 408/407 BC the people of these three towns joined to found one new city, Rhodes, with several harbours; Strabo says it was laid out by the same architect as the Piraeus."
    - "In 305–304 BC Demetrius Poliorcetes besieged the city for a year with huge siege engines, but failed and made peace, leaving it free and ungarrisoned. With the money raised from the engines he left behind, the Rhodians set up the bronze Colossus of Helios, about seventy cubits high, the work of Chares of Lindus and one of the Seven Wonders; an earthquake threw it down about 226 BC. Rhodes was a leading naval and trading power and a friend of Rome, but after Rome made Delos a free port in 166 BC, Rhodian envoys complained that their harbour dues had fallen from a million drachmas to 150,000."
    - 'Returning to Jerusalem at the end of his third journey, Paul sailed from Miletus by way of Coos and came "the day following unto Rhodes, and from thence unto Patara", where his company found a ship sailing over to Phoenicia. This is the only time the island is named in the New Testament.'
    - "In 43 or 42 BC Cassius took the city, put about fifty citizens to death and seized the gold and silver of its temples and treasury. The future emperor Tiberius lived on Rhodes in retirement from 6 BC. Rome took away the city's freedom more than once: Claudius gave it back, but Vespasian made Rhodes part of a province. A violent earthquake under Antoninus Pius overthrew Rhodes, and the emperor paid to rebuild it. In late antiquity Rhodes was the capital of the province of the Islands and the seat of a metropolitan bishop."
  ru:
    - "Родос — крупнейший остров Додеканеса, у юго-западной оконечности Малой Азии; одноимённый город стоит на северной оконечности острова. В «Илиаде» родосцы приходят под Трою из трёх городов — Линда, Иалиса и Камира. В 408/407 г. до н. э. жители этих трёх городов объединились и основали один новый город, Родос, с несколькими гаванями; Страбон пишет, что его спланировал тот же зодчий, что и Пирей."
    - "В 305–304 гг. до н. э. Деметрий Полиоркет целый год осаждал город огромными осадными машинами, но не взял его и заключил мир, оставив город свободным и без гарнизона. На деньги, вырученные от брошенных им машин, родосцы поставили бронзовый Колосс Гелиоса высотой около семидесяти локтей, работу Хареса из Линда, одно из семи чудес света; около 226 г. до н. э. его повалило землетрясение. Родос был ведущей морской и торговой державой и другом Рима, но после того как Рим в 166 г. до н. э. сделал Делос свободным портом, родосские послы жаловались, что их портовые пошлины упали с миллиона драхм до 150 000."
    - "Возвращаясь в Иерусалим в конце третьего путешествия, Павел отплыл из Милита через Кос и пришёл «на другой день в Родос и оттуда в Патару», где его спутники нашли корабль, идущий в Финикию. Это единственное упоминание острова в Новом Завете."
    - "В 43 или 42 г. до н. э. Кассий взял город, казнил около пятидесяти граждан и забрал золото и серебро из его храмов и казны. Будущий император Тиберий с 6 г. до н. э. жил на Родосе в уединении. Рим не раз отнимал у города свободу: Клавдий вернул её, но Веспасиан включил Родос в провинцию. При Антонине Пии сильное землетрясение разрушило Родос, и император дал средства на его восстановление. В поздней античности Родос был столицей провинции Острова и кафедрой митрополита."
  uk:
    - "Родос — найбільший острів Додеканесу, біля південно-західного кута Малої Азії; його однойменне місто стоїть на північному краю острова. В «Іліаді» родосці приходять до Трої з трьох міст — Ліндоса, Ялісоса й Каміроса. У 408/407 р. до н. е. мешканці цих трьох міст об’єдналися, щоб заснувати одне нове місто — Родос, із кількома гаванями; Страбон каже, що його спланував той самий архітектор, що й Пірей."
    - "У 305–304 рр. до н. е. Деметрій Поліоркет облягав місто рік величезними облоговими машинами, але зазнав невдачі й уклав мир, залишивши його вільним і без гарнізону. За гроші, виручені від залишених машин, родосці спорудили бронзового Колоса Геліоса заввишки близько сімдесяти ліктів, творіння Харета з Ліндоса й одне із семи чудес світу; землетрус повалив його близько 226 р. до н. е. Родос був провідною морською й торговою державою та другом Риму, але після того, як Рим 166 р. до н. е. зробив Делос вільним портом, родоські посланці скаржилися, що їхні портові збори впали з мільйона драхм до 150 000."
    - "Повертаючись до Єрусалима наприкінці своєї третьої подорожі, Павло відплив із Мілета через Кос і прибув «другого ж дня в Родос, а з відтіля в Патару», де його супутники знайшли корабель, що йшов до Фінікії. Це єдиний раз, коли острів названо в Новому Заповіті."
    - "У 43 або 42 р. до н. е. Кассій узяв місто, стратив близько п’ятдесяти громадян і забрав золото й срібло його храмів і казни. Майбутній імператор Тиверій жив на Родосі, відійшовши від справ, з 6 р. до н. е. Рим не раз відбирав у міста свободу: Клавдій повернув її, але Веспасіан зробив Родос частиною провінції. Руйнівний землетрус за Антоніна Пія повалив Родос, і імператор заплатив за його відбудову. У пізню античність Родос був столицею провінції Острови й осідком митрополичого єпископа."
  es:
    - "Rodas es la mayor isla del Dodecaneso, frente a la esquina suroeste de Asia Menor; su ciudad del mismo nombre se alza en el extremo norte de la isla. En la Ilíada los rodios llegan a Troya desde tres ciudades, Lindos, Ialiso y Camiro. En 408/407 a. C. los habitantes de estas tres ciudades se unieron para fundar una ciudad nueva, Rodas, con varios puertos; Estrabón dice que la trazó el mismo arquitecto que el Pireo."
    - "En 305–304 a. C. Demetrio Poliorcetes sitió la ciudad durante un año con enormes máquinas de asedio, pero fracasó e hizo la paz, dejándola libre y sin guarnición. Con el dinero obtenido de las máquinas que dejó atrás, los rodios erigieron el Coloso de bronce de Helios, de unos setenta codos de altura, obra de Cares de Lindos y una de las Siete Maravillas; un terremoto lo derribó hacia 226 a. C. Rodas fue una potencia naval y comercial de primer orden y amiga de Roma, pero después de que Roma hiciera de Delos un puerto franco en 166 a. C., los enviados rodios se quejaron de que sus derechos portuarios habían caído de un millón de dracmas a 150 000."
    - "De regreso a Jerusalén al final de su tercer viaje, Pablo zarpó de Mileto por Coos y llegó «al día siguiente á Rhodas, y de allí á Pátara», donde su comitiva halló una nave que pasaba a Fenicia. Es la única vez que la isla se nombra en el Nuevo Testamento."
    - "En 43 o 42 a. C. Casio tomó la ciudad, ejecutó a unos cincuenta ciudadanos y se apoderó del oro y la plata de sus templos y del tesoro. El futuro emperador Tiberio vivió en Rodas retirado desde 6 a. C. Roma quitó más de una vez la libertad de la ciudad: Claudio se la devolvió, pero Vespasiano hizo de Rodas parte de una provincia. Un violento terremoto bajo Antonino Pío derribó Rodas, y el emperador pagó su reconstrucción. En la Antigüedad tardía Rodas fue la capital de la provincia de las Islas y sede de un obispo metropolitano."
  pt:
    - "Rodes é a maior ilha do Dodecaneso, ao largo do canto sudoeste da Ásia Menor; sua cidade de mesmo nome fica na ponta norte da ilha. Na Ilíada os rodienses vão a Troia vindos de três cidades, Lindos, Ialiso e Camiro. Em 408/407 a.C. o povo dessas três cidades se uniu para fundar uma só cidade nova, Rodes, com vários portos; Estrabão diz que foi traçada pelo mesmo arquiteto do Pireu."
    - "Em 305–304 a.C. Demétrio Poliorcetes sitiou a cidade por um ano com enormes máquinas de cerco, mas fracassou e fez a paz, deixando-a livre e sem guarnição. Com o dinheiro obtido das máquinas que deixou, os rodienses ergueram o Colosso de bronze de Hélio, com cerca de setenta côvados de altura, obra de Cares de Lindos e uma das Sete Maravilhas; um terremoto o derrubou por volta de 226 a.C. Rodes foi uma potência naval e comercial de primeira ordem e amiga de Roma, mas depois que Roma fez de Delos um porto livre em 166 a.C., enviados rodienses se queixaram de que suas taxas portuárias haviam caído de um milhão de dracmas para 150 mil."
    - "Voltando a Jerusalém no fim de sua terceira viagem, Paulo navegou de Mileto por Cós e foi “no dia seguinte para Rodes, e dali para Pátara”, onde seu grupo achou um navio que fazia a travessia para a Fenícia. É a única vez que a ilha é citada no Novo Testamento."
    - "Em 43 ou 42 a.C. Cássio tomou a cidade, mandou matar cerca de cinquenta cidadãos e confiscou o ouro e a prata de seus templos e do tesouro. O futuro imperador Tibério viveu em Rodes em retiro a partir de 6 a.C. Roma tirou a liberdade da cidade mais de uma vez: Cláudio a devolveu, mas Vespasiano fez de Rodes parte de uma província. Um violento terremoto sob Antonino Pio arrasou Rodes, e o imperador pagou para reconstruí-la. Na Antiguidade tardia Rodes foi a capital da província das Ilhas e sede de um bispo metropolita."
  de:
    - "Rhodos ist die größte Insel des Dodekanes, vor der Südwestecke Kleinasiens; ihre gleichnamige Stadt liegt an der Nordspitze der Insel. In der Ilias kommen die Rhodier aus drei Städten nach Troja, Lindos, Ialysos und Kameiros. In den Jahren 408/407 v. Chr. vereinigten sich die Bewohner dieser drei Städte zur Gründung einer neuen Stadt, Rhodos, mit mehreren Häfen; Strabon sagt, sie sei vom selben Architekten angelegt worden wie der Piräus."
    - "In den Jahren 305–304 v. Chr. belagerte Demetrios Poliorketes die Stadt ein Jahr lang mit riesigen Belagerungsmaschinen, scheiterte aber und schloss Frieden, wobei er sie frei und ohne Besatzung ließ. Mit dem Erlös der zurückgelassenen Maschinen errichteten die Rhodier den bronzenen Koloss des Helios, etwa siebzig Ellen hoch, Werk des Chares von Lindos und eines der Sieben Weltwunder; ein Erdbeben stürzte ihn um 226 v. Chr. um. Rhodos war eine führende See- und Handelsmacht und ein Freund Roms, doch nachdem Rom 166 v. Chr. Delos zum Freihafen gemacht hatte, klagten rhodische Gesandte, ihre Hafenabgaben seien von einer Million Drachmen auf 150.000 gesunken."
    - "Auf der Rückreise nach Jerusalem am Ende seiner dritten Reise fuhr Paulus von Milet über Kos und kam „am folgenden Tage gen Rhodus und von da nach Patara“, wo seine Gruppe ein Schiff fand, das nach Phönizien fuhr. Dies ist das einzige Mal, dass die Insel im Neuen Testament genannt wird."
    - "Im Jahr 43 oder 42 v. Chr. nahm Cassius die Stadt, ließ etwa fünfzig Bürger hinrichten und beschlagnahmte das Gold und Silber ihrer Tempel und ihrer Staatskasse. Der spätere Kaiser Tiberius lebte ab 6 v. Chr. in Zurückgezogenheit auf Rhodos. Rom nahm der Stadt mehr als einmal die Freiheit: Klaudius gab sie zurück, doch Vespasian machte Rhodos zum Teil einer Provinz. Ein heftiges Erdbeben unter Antoninus Pius zerstörte Rhodos, und der Kaiser zahlte den Wiederaufbau. In der Spätantike war Rhodos Hauptstadt der Provinz der Inseln und Sitz eines Metropolitanbischofs."
  fr:
    - "Rhodes est la plus grande île du Dodécanèse, au large de l’angle sud-ouest de l’Asie Mineure ; sa ville du même nom se dresse à la pointe nord de l’île. Dans l’Iliade, les Rhodiens viennent à Troie de trois villes, Lindos, Ialysos et Camiros. En 408/407 av. J.-C., les habitants de ces trois villes s’unirent pour fonder une ville nouvelle, Rhodes, dotée de plusieurs ports ; Strabon dit qu’elle fut tracée par le même architecte que le Pirée."
    - "En 305–304 av. J.-C., Démétrius Poliorcète assiégea la ville un an avec d’énormes machines de siège, mais échoua et fit la paix, la laissant libre et sans garnison. Avec l’argent tiré des machines qu’il laissa, les Rhodiens érigèrent le Colosse de bronze d’Hélios, haut d’environ soixante-dix coudées, œuvre de Charès de Lindos et l’une des sept merveilles du monde ; un séisme l’abattit vers 226 av. J.-C. Rhodes était une grande puissance navale et commerciale et amie de Rome, mais après que Rome eut fait de Délos un port franc en 166 av. J.-C., des envoyés rhodiens se plaignirent que leurs droits de port étaient tombés d’un million de drachmes à 150 000."
    - "Revenant à Jérusalem à la fin de son troisième voyage, Paul fit voile de Milet par Cos et vint « le lendemain à Rhodes, et de là à Patara », où sa troupe trouva un navire faisant la traversée vers la Phénicie. C’est la seule fois que l’île est nommée dans le Nouveau Testament."
    - "En 43 ou 42 av. J.-C., Cassius prit la ville, mit à mort une cinquantaine de citoyens et s’empara de l’or et de l’argent de ses temples et de son trésor. Le futur empereur Tibère vécut à Rhodes en retraite dès 6 av. J.-C. Rome ôta plus d’une fois sa liberté à la ville : Claude la lui rendit, mais Vespasien fit de Rhodes une partie d’une province. Un violent séisme sous Antonin le Pieux renversa Rhodes, et l’empereur paya sa reconstruction. À l’Antiquité tardive, Rhodes fut la capitale de la province des Îles et le siège d’un évêque métropolitain."
  it:
    - "Rodi è la maggiore isola del Dodecaneso, al largo dell’angolo sud-occidentale dell’Asia Minore; la città omonima sorge sulla punta settentrionale dell’isola. Nell’Iliade i Rodii vengono a Troia da tre città, Lindo, Ialiso e Camiro. Nel 408/407 a.C. gli abitanti di queste tre città si unirono per fondare una nuova città, Rodi, con diversi porti; Strabone dice che fu progettata dallo stesso architetto del Pireo."
    - "Nel 305–304 a.C. Demetrio Poliorcete assediò la città per un anno con enormi macchine d’assedio, ma fallì e fece pace, lasciandola libera e senza guarnigione. Con il denaro ricavato dalle macchine che lasciò, i Rodii eressero il Colosso di bronzo di Helios, alto circa settanta cubiti, opera di Carete di Lindo e una delle Sette Meraviglie; un terremoto lo abbatté verso il 226 a.C. Rodi fu una potenza navale e commerciale di primo piano e amica di Roma, ma dopo che Roma fece di Delo un porto franco nel 166 a.C., gli inviati rodii si lamentarono che i loro diritti portuali erano scesi da un milione di dracme a 150.000."
    - "Tornando a Gerusalemme alla fine del suo terzo viaggio, Paolo salpò da Mileto passando per Cos e giunse «il giorno seguente a Rodi, e di là a Patara», dove i suoi compagni trovarono una nave diretta in Fenicia. È l’unica volta che l’isola è nominata nel Nuovo Testamento."
    - "Nel 43 o 42 a.C. Cassio prese la città, mise a morte una cinquantina di cittadini e si impadronì dell’oro e dell’argento dei suoi templi e del tesoro. Il futuro imperatore Tiberio visse a Rodi in ritiro dal 6 a.C. Roma tolse più di una volta la libertà alla città: Claudio gliela restituì, ma Vespasiano fece di Rodi parte di una provincia. Un violento terremoto sotto Antonino Pio abbatté Rodi, e l’imperatore pagò per ricostruirla. Nella tarda antichità Rodi fu la capitale della provincia delle Isole e sede di un vescovo metropolita."
  pl:
    - "Rodos to największa wyspa Dodekanezu, u południowo-zachodniego narożnika Azji Mniejszej; jej miasto o tej samej nazwie stoi na północnym cyplu wyspy. W Iliadzie Rodyjczycy przybywają pod Troję z trzech miast, Lindos, Ialisos i Kamiros. W 408/407 roku p.n.e. mieszkańcy tych trzech miast połączyli się, by założyć jedno nowe miasto, Rodos, z kilkoma portami; Strabon mówi, że wytyczył je ten sam architekt co Pireus."
    - "W latach 305–304 p.n.e. Demetriusz Poliorketes oblegał miasto przez rok ogromnymi machinami oblężniczymi, lecz poniósł klęskę i zawarł pokój, zostawiając je wolne i bez garnizonu. Za pieniądze uzyskane z machin, które zostawił, Rodyjczycy wznieśli spiżowy Kolos Heliosa, wysoki na około siedemdziesiąt łokci, dzieło Charesa z Lindos i jeden z Siedmiu Cudów Świata; trzęsienie ziemi obaliło go około 226 roku p.n.e. Rodos było czołową potęgą morską i handlową oraz przyjacielem Rzymu, lecz gdy Rzym uczynił Delos portem wolnym w 166 roku p.n.e., rodyjscy posłowie skarżyli się, że ich opłaty portowe spadły z miliona drachm do 150 000."
    - "Wracając do Jerozolimy pod koniec swej trzeciej podróży, Paweł odpłynął z Miletu przez Kos i przybył „a nazajutrz do Rodu, a stamtąd do Patary”, gdzie jego towarzysze znaleźli okręt płynący do Fenicji. Jest to jedyny raz, gdy wyspa jest wymieniona w Nowym Testamencie."
    - "W 43 lub 42 roku p.n.e. Kasjusz zdobył miasto, kazał stracić około pięćdziesięciu obywateli i zagarnął złoto i srebro jego świątyń i skarbca. Przyszły cesarz Tyberiusz mieszkał na Rodos w odosobnieniu od 6 roku p.n.e. Rzym odbierał miastu wolność więcej niż raz: Klaudiusz ją przywrócił, lecz Wespazjan włączył Rodos do prowincji. Gwałtowne trzęsienie ziemi za Antoninusa Piusa obaliło Rodos, a cesarz zapłacił za odbudowę. W późnej starożytności Rodos było stolicą prowincji Wysp i siedzibą biskupa metropolity."
  cs:
    - "Rhodos je největší ostrov Dodekanésu, u jihozápadního rohu Malé Asie; jeho stejnojmenné město leží na severním cípu ostrova. V Íliadě přicházejí Rhodští k Tróji ze tří měst, Lindu, Ialysu a Kameiru. V letech 408/407 př. n. l. se obyvatelé těchto tří měst spojili a založili jedno nové město, Rhodos, s několika přístavy; Strabón praví, že je vytyčil tentýž architekt jako Pireus."
    - "V letech 305–304 př. n. l. oblehl město Démétrios Poliorkétés po celý rok obrovskými obléhacími stroji, ale neuspěl a uzavřel mír, čímž je nechal svobodné a bez posádky. Z peněz získaných za stroje, které zanechal, postavili Rhodští bronzového Kolosa Hélia, vysokého asi sedmdesát loktů, dílo Charéta z Lindu a jeden ze Sedmi divů světa; zemětřesení jej srazilo asi roku 226 př. n. l. Rhodos byl vedoucí námořní a obchodní mocností a přítelem Říma, ale když Řím roku 166 př. n. l. učinil z Délu svobodný přístav, rhodští vyslanci si stěžovali, že jejich přístavní poplatky klesly z milionu drachem na 150 000."
    - "Při návratu do Jeruzaléma na konci své třetí cesty odplul Pavel z Milétu přes Kós a „druhý den do Ródu, a odtud do Patary“, kde jeho družina našla loď plující do Fénicie. Je to jediné místo v Novém zákoně, kde je ostrov jmenován."
    - "Roku 43 nebo 42 př. n. l. dobyl Cassius město, dal popravit asi padesát občanů a zmocnil se zlata a stříbra jeho chrámů a pokladnice. Budoucí císař Tiberius žil na Rhodu v ústraní od roku 6 př. n. l. Řím městu svobodu odňal víc než jednou: Klaudius ji vrátil, ale Vespasianus učinil Rhodos částí provincie. Prudké zemětřesení za Antonina Pia Rhodos zničilo a císař zaplatil jeho obnovu. V pozdní antice byl Rhodos hlavním městem provincie Ostrovů a sídlem metropolitního biskupa."
  nl:
    - "Rhodos is het grootste eiland van de Dodekanesos, voor de zuidwesthoek van Klein-Azië; de gelijknamige stad ligt aan de noordpunt van het eiland. In de Ilias komen de Rhodiërs vanuit drie steden naar Troje, Lindos, Ialysos en Kameiros. In 408/407 v.Chr. verenigden de bewoners van die drie steden zich om één nieuwe stad te stichten, Rhodos, met meerdere havens; Strabo zegt dat ze door dezelfde architect werd aangelegd als Piraeus."
    - "In 305–304 v.Chr. belegerde Demetrios Poliorketes de stad een jaar lang met enorme belegeringswerktuigen, maar mislukte en sloot vrede, waarbij hij haar vrij en zonder garnizoen liet. Met het geld van de werktuigen die hij achterliet, richtten de Rhodiërs de bronzen Kolossus van Helios op, zo’n zeventig el hoog, het werk van Chares van Lindos en een van de Zeven Wereldwonderen; een aardbeving wierp hem omstreeks 226 v.Chr. omver. Rhodos was een vooraanstaande zee- en handelsmacht en een vriend van Rome, maar nadat Rome Delos in 166 v.Chr. tot vrijhaven maakte, klaagden Rhodische gezanten dat hun havengelden van een miljoen drachmen tot 150.000 waren gedaald."
    - "Terugkerend naar Jeruzalem aan het einde van zijn derde reis voer Paulus van Milete via Kos en kwam “den dag daaraan te Rhodus, en van daar te Patara”, waar zijn gezelschap een schip vond dat naar Fenicië overvoer. Dit is de enige keer dat het eiland in het Nieuwe Testament wordt genoemd."
    - "In 43 of 42 v.Chr. nam Cassius de stad in, liet zo’n vijftig burgers doden en nam het goud en zilver van haar tempels en schatkist in beslag. De latere keizer Tiberius woonde vanaf 6 v.Chr. teruggetrokken op Rhodos. Rome nam de stad meer dan eens haar vrijheid af: Claudius gaf haar terug, maar Vespasianus maakte Rhodos deel van een provincie. Een hevige aardbeving onder Antoninus Pius wierp Rhodos omver, en de keizer betaalde de herbouw. In de late oudheid was Rhodos de hoofdstad van de provincie van de Eilanden en de zetel van een metropoliet."
  sv:
    - "Rhodos är den största ön i Dodekanesos, utanför sydvästra hörnet av Mindre Asien; staden med samma namn ligger på öns norra spets. I Iliaden kommer rhodierna till Troja från tre städer, Lindos, Ialysos och Kameiros. År 408/407 f.Kr. slöt sig invånarna i dessa tre städer samman för att grunda en ny stad, Rhodos, med flera hamnar; Strabon säger att den lades ut av samme arkitekt som Peiraieus."
    - "Åren 305–304 f.Kr. belägrade Demetrios Poliorketes staden i ett år med enorma belägringsmaskiner, men misslyckades och slöt fred och lämnade den fri och utan garnison. Med pengarna från de maskiner han lämnade kvar reste rhodierna Helios bronskolloss, omkring sjuttio alnar hög, verk av Chares från Lindos och ett av de sju underverken; en jordbävning fällde den omkring 226 f.Kr. Rhodos var en ledande sjö- och handelsmakt och en vän till Rom, men sedan Rom gjort Delos till frihamn 166 f.Kr. klagade rhodiska sändebud över att deras hamnavgifter hade fallit från en miljon drachmer till 150 000."
    - "På väg tillbaka till Jerusalem i slutet av sin tredje resa seglade Paulus från Miletos via Kos, och de ”kommo dagen därefter till Rodus och därifrån till Patara”, där hans sällskap fann ett skepp på väg över till Fenicien. Detta är den enda gången ön nämns i Nya testamentet."
    - "År 43 eller 42 f.Kr. intog Cassius staden, lät avrätta omkring femtio medborgare och beslagtog guldet och silvret i dess tempel och skattkammare. Den blivande kejsaren Tiberius bodde på Rhodos i tillbakadragenhet från 6 f.Kr. Rom tog ifrån staden dess frihet mer än en gång: Claudius gav tillbaka den, men Vespasianus gjorde Rhodos till en del av en provins. En våldsam jordbävning under Antoninus Pius fällde Rhodos, och kejsaren bekostade återuppbyggnaden. Under senantiken var Rhodos huvudstad i provinsen Öarna och säte för en metropolit."
