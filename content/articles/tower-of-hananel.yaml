# Overview article (ADR 0007). Mainstream facts only; the tower is unlocated and its place at the later Antonia is given as the usual inference; the Synodal spelling varies between books, which the text notes.
id: tower-of-hananel
place: af58391
title:
  en: "Tower of Hananel"
  ru: "Башня Хананела"
  uk: "Вежа Хананела"
  es: "Torre de Hananeel"
  pt: "Torre de Hananeel"
  de: "Turm Hananel"
  fr: "Tour de Hananeel"
  pl: "Wieża Chananeel"
  it: "Torre di Cananeèl"
  nl: "Toren van Chananeël"
  cs: "Chananelova věž"
  sv: "Hananeltornet"
  nb: "Hananel-tårnet"
  tl: "Moog ng Hananeel"
  da: "Hanan'els Tårn"
  sr: "Кула Ананеилова"
body:
  en:
    - "The tower of Hananel stood in the north wall of Jerusalem, beside the tower of Meah (the Hundred) and between the Sheep Gate and the Fish Gate, on the north side of the city above the Temple, the side from which Jerusalem was most often attacked. The name means “God has been gracious” and may be that of its builder. Nothing of the tower is known from the ground; the prophets name it as the city's northern landmark, and it is often placed at the rock that later carried the Hasmonean Baris and Herod's fortress Antonia, at the north-west corner of the Temple Mount. The Synodal Bible writes the name as Hananel in Nehemiah and as Anameil in Jeremiah and Zechariah."
    - "Nehemiah's priests built the Sheep Gate and sanctified the wall “even unto the tower of Meah they sanctified it, unto the tower of Hananeel”, and at the dedication the second choir passed “the tower of Hananeel, and the tower of Meah, even unto the sheep gate”. The tower was older than Nehemiah: Jeremiah had promised that “the city shall be built to the LORD from the tower of Hananeel unto the gate of the corner”, measuring the restored Jerusalem from its north-east to its north-west corner, and Zechariah sees the city inhabited “from the tower of Hananeel unto the king's winepresses”, from its northern height to the royal gardens at its southern tip."
    - "Herod rebuilt the Baris as the Antonia, which Josephus describes as a tower on a rock at the corner of the Temple courts; the Romans stormed it in AD 70. Today the scarp lies beneath the Umariya school on the Via Dolorosa, at its first station, by the north-west corner of the Haram esh-Sharif."
  ru:
    - "Башня Хананела стояла в северной стене Иерусалима, рядом с башней Меа («Сто») и между Овечьими и Рыбными воротами, на северной стороне города над Храмом, с той стороны, откуда на Иерусалим чаще всего нападали. Имя значит «Бог помиловал» и, возможно, принадлежало её строителю. Из земли о башне ничего не известно; пророки называют её северной межой города, и её часто помещают на скале, которая позже несла хасмонейскую Барис и крепость Ирода Антонию у северо-западного угла Храмовой горы. Синодальный перевод пишет имя как Хананел у Неемии и как Анамеил у Иеремии и Захарии."
    - "Священники Неемии построили Овечьи ворота и освятили стену «от башни Меа освятили их до башни Хананела», а при освящении стены второй хор прошёл мимо «башни Хананела, и башни Меа, к Овечьим воротам». Башня старше Неемии: Иеремия обещал, что «город устроен будет во славу Господа от башни Анамеила до ворот угольных», отмеряя восстановленный Иерусалим от северо-восточного угла до северо-западного, а Захария видит город населённым «от башни Анамеила до царских точил» — от его северной высоты до царских садов у южной оконечности."
    - "Ирод перестроил Барис в Антонию, которую Иосиф Флавий описывает как башню на скале у угла храмовых дворов; римляне взяли её штурмом в 70 году н. э. Сегодня этот скальный уступ лежит под школой Умария на Виа Долороза, у её первой остановки, возле северо-западного угла Харам-эш-Шариф."
  uk:
    - "Вежа Хананела стояла в північному мурі Єрусалима, поряд із вежею Мея (Сотні), між Овечими й Рибними воротами, на північному боці міста над Храмом, звідки Єрусалим найчастіше штурмували. Ім’я означає «Бог був милостивий» і може бути ім’ям її будівничого. Про саму вежу з розкопок нічого не відомо; пророки називають її північним орієнтиром міста, і її часто ставлять на скелю, що згодом несла хасмонейський Баріс і Іродову фортецю Антонія, на північно-західному куті Храмової гори. Синодальний переклад пише ім’я як Хананел у Неемії та як Анамеїл у Єремії й Захарії."
    - "Священики Неемії збудували Овечі ворота і посвятили мур: «посьвятили їх від башти Меа до башти Хананела», а на освяченні другий хор пройшов повз «башту Хананела і башту Меа, до Овечих воріт». Вежа була старшою за Неемію: Єремія обіцяв, що «одбудують ізнов город на славу Господеві від башти Анамеїлевої до углових воріт», міряючи відновлений Єрусалим від його північно-східного до північно-західного кута, а Захарія бачить місто заселеним «від Ананеїлової башти до царських тискарень», від його північної висоти до царських садів на південному кінці."
    - "Ірод перебудував Баріс в Антонію, яку Йосиф Флавій описує як вежу на скелі на куті подвір’їв Храму; римляни взяли її штурмом 70 року н. е. Нині уступ лежить під школою Умарійя на Віа Долороза, біля її першої станції, поряд із північно-західним кутом Харам аш-Шарифа."
  es:
    - "La torre de Hananeel se alzaba en la muralla norte de Jerusalén, junto a la torre de Meah (de los Cien) y entre la Puerta de las Ovejas y la Puerta del Pescado, en el lado norte de la ciudad sobre el Templo, el lado por el que Jerusalén fue atacada con más frecuencia. El nombre significa «Dios ha sido misericordioso» y puede ser el de su constructor. Nada de la torre se conoce sobre el terreno; los profetas la nombran como el hito septentrional de la ciudad, y a menudo se la sitúa en la roca que más tarde llevó la Baris asmonea y la fortaleza Antonia de Herodes, en el ángulo noroeste del Monte del Templo. La Biblia sinodal escribe el nombre como Hananel en Nehemías y como Anameil en Jeremías y Zacarías."
    - "Los sacerdotes de Nehemías edificaron la Puerta de las Ovejas y consagraron la muralla «hasta la torre de Meah», «hasta la torre de Hananeel», y en la dedicación el segundo coro pasó la torre de Hananeel y la torre de Meah «hasta la puerta de las Ovejas». La torre era anterior a Nehemías: Jeremías había prometido que «la ciudad será edificada á Jehová, desde la torre de Hananeel hasta la puerta del rincón», midiendo la Jerusalén restaurada desde su ángulo noreste hasta el noroeste, y Zacarías ve la ciudad habitada «desde la torre de Hananeel hasta los lagares del rey», desde su altura septentrional hasta los jardines reales de su extremo sur."
    - "Herodes reconstruyó la Baris como la Antonia, que Josefo describe como una torre sobre una roca en el ángulo de los atrios del Templo; los romanos la tomaron al asalto en el 70 d. C. Hoy el escarpe yace bajo la escuela Umariya, en la Vía Dolorosa, en su primera estación, junto al ángulo noroeste del Haram esh-Sharif."
  pt:
    - "A torre de Hananeel ficava na muralha norte de Jerusalém, ao lado da torre de Meá (dos Cem) e entre a Porta das Ovelhas e a Porta do Peixe, no lado norte da cidade, acima do Templo, o lado de onde Jerusalém era mais atacada. O nome significa “Deus foi misericordioso” e pode ser o de seu construtor. Nada da torre se conhece no terreno; os profetas a nomeiam como marco setentrional da cidade, e muitas vezes ela é posta na rocha que mais tarde sustentou a Baris hasmoneia e a fortaleza Antônia de Herodes, no canto noroeste do Monte do Templo. A Bíblia Sinodal escreve o nome como Hananel em Neemias e como Anameil em Jeremias e Zacarias."
    - "Os sacerdotes de Neemias edificaram a Porta das Ovelhas e consagraram a muralha: “Eles a consagraram até a torre de Meá, e até a torre de Hananel”, e na dedicação o segundo coro passou “pela Torre de Hananeel e pela Torre de Meá, até a Porta das Ovelhas”. A torre era mais antiga que Neemias: Jeremias havia prometido que “a cidade será edificada para o SENHOR, desde a torre de Hananeel até a porta da esquina”, medindo a Jerusalém restaurada de seu canto nordeste ao noroeste, e Zacarias vê a cidade habitada “desde a torre de Hananel até os lagares do rei”, de sua altura setentrional aos jardins reais na ponta sul."
    - "Herodes reconstruiu a Baris como a Antônia, que Josefo descreve como uma torre sobre uma rocha no canto dos pátios do Templo; os romanos a tomaram de assalto em 70 d.C. Hoje o escarpado fica sob a escola Umariya, na Via Dolorosa, em sua primeira estação, junto ao canto noroeste do Haram esh-Sharif."
  de:
    - "Der Turm Hananel stand in der Nordmauer Jerusalems, neben dem Turm Mea (der Hundert) und zwischen dem Schaftor und dem Fischtor, auf der Nordseite der Stadt oberhalb des Tempels, der Seite, von der aus Jerusalem am häufigsten angegriffen wurde. Der Name bedeutet „Gott hat sich gnädig erwiesen“ und mag der seines Erbauers sein. Vom Turm ist im Gelände nichts bekannt; die Propheten nennen ihn als nördliches Wahrzeichen der Stadt, und oft setzt man ihn an den Felsen, der später die hasmonäische Baris und Herodes' Festung Antonia trug, an der Nordwestecke des Tempelbergs. Die Synodalbibel schreibt den Namen bei Nehemia Hananel und bei Jeremia und Sacharja Anameil."
    - "Nehemias Priester bauten das Schaftor und heiligten die Mauer: „Sie heiligten es aber bis an den Turm Mea, bis an den Turm Hananeel“, und bei der Einweihung zog der zweite Chor „zum Turm Hananeel und zum Turm Mea bis an das Schaftor“. Der Turm war älter als Nehemia: Jeremia hatte verheißen, dass „die Stadt des HERRN soll gebaut werden vom Turm Hananeel an bis ans Ecktor“, und maß so das wiederhergestellte Jerusalem von seiner Nordost- zur Nordwestecke, und Sacharja sieht die Stadt bewohnt „vom Turm Hananeel bis an des Königs Kelter“, von ihrer nördlichen Höhe bis zu den königlichen Gärten an ihrer Südspitze."
    - "Herodes baute die Baris zur Antonia um, die Josephus als Turm auf einem Felsen an der Ecke der Tempelhöfe beschreibt; die Römer stürmten sie im Jahr 70 n. Chr. Heute liegt die Felsstufe unter der Umariya-Schule an der Via Dolorosa, an ihrer ersten Station, an der Nordwestecke des Haram esh-Sharif."
  fr:
    - "La tour de Hananeel se dressait dans le mur nord de Jérusalem, à côté de la tour de Méa (des Cent) et entre la porte des Brebis et la porte des Poissons, sur le côté nord de la ville au-dessus du Temple, celui d’où Jérusalem était le plus souvent attaquée. Le nom signifie « Dieu a fait grâce » et peut être celui de son bâtisseur. On ne sait rien de la tour par le terrain ; les prophètes la nomment comme repère septentrional de la ville, et on la place souvent sur le rocher qui porta plus tard la Baris hasmonéenne et la forteresse Antonia d’Hérode, à l’angle nord-ouest du mont du Temple. La Bible synodale écrit le nom Hananel chez Néhémie et Anameïl chez Jérémie et Zacharie."
    - "Les prêtres de Néhémie bâtirent la porte des Brebis et consacrèrent le mur : « ils la consacrèrent, depuis la tour de Méa jusqu’à la tour de Hananeel », et à la dédicace le second chœur alla « de la tour de Hananeel et de la tour de Méa, jusqu’à la porte des brebis ». La tour était plus ancienne que Néhémie : Jérémie avait promis que « la ville sera rebâtie à l’honneur de l’Éternel, depuis la tour de Hananeel jusqu’à la porte de l’angle », mesurant la Jérusalem restaurée de son angle nord-est à son angle nord-ouest, et Zacharie voit la ville habitée « depuis la tour de Hananeel jusqu’aux pressoirs du roi », de sa hauteur nord aux jardins royaux de sa pointe sud."
    - "Hérode rebâtit la Baris en Antonia, que Josèphe décrit comme une tour sur un rocher à l’angle des parvis du Temple ; les Romains la prirent d’assaut en 70 apr. J.-C. Aujourd’hui, l’escarpement se trouve sous l’école Umariya, sur la Via Dolorosa, à sa première station, près de l’angle nord-ouest du Haram esh-Sharif."
  pl:
    - "Wieża Chananeel stała w północnym murze Jerozolimy, obok wieży Mea (Setnej) i między Bramą Owczą a Bramą Rybną, po północnej stronie miasta nad Świątynią, z której Jerozolima była najczęściej atakowana. Nazwa znaczy „Bóg okazał łaskę” i może być imieniem jej budowniczego. Z terenu nic o wieży nie wiadomo; prorocy wymieniają ją jako północny punkt orientacyjny miasta, a często umieszcza się ją na skale, która później niosła hasmonejski Baris i twierdzę Heroda Antonię, w północno-zachodnim narożniku Wzgórza Świątynnego. Biblia synodalna zapisuje to imię jako Chananel u Nehemiasza i jako Anameil u Jeremiasza i Zachariasza."
    - "Kapłani Nehemiasza zbudowali Bramę Owczą i poświęcili mur: „aż do wieży Mea zbudowali ją, i aż do wieży Chananeel”, a przy poświęceniu drugi chór minął „i wieży Chananeel, i wieży Mea, aż do bramy owczej”. Wieża była starsza niż Nehemiasz: Jeremiasz obiecał, że „zbudowane to miasto Panu od wieży Chananeel aż do bramy narożnej”, mierząc odnowioną Jerozolimę od jej północno-wschodniego do północno-zachodniego narożnika, a Zachariasz widzi miasto zamieszkane „od wieży Chananeel aż do pras królewskich”, od jego północnego wzniesienia do królewskich ogrodów na południowym krańcu."
    - "Herod przebudował Baris na Antonię, którą Józef Flawiusz opisuje jako wieżę na skale przy narożniku dziedzińców Świątyni; Rzymianie zdobyli ją szturmem w 70 roku n.e. Dziś skarpa leży pod szkołą Umarijja przy Via Dolorosa, przy jej pierwszej stacji, obok północno-zachodniego narożnika Haram asz-Szarif."
  it:
    - "La torre di Cananeèl sorgeva nel muro settentrionale di Gerusalemme, accanto alla torre di Mea (dei Cento) e fra la Porta delle Pecore e la Porta dei Pesci, sul lato nord della città sopra il Tempio, il lato da cui Gerusalemme era più spesso attaccata. Il nome significa «Dio è stato benigno» e può essere quello del suo costruttore. Della torre non si sa nulla dal terreno; i profeti la nominano come punto di riferimento settentrionale della città, e spesso la si pone sulla roccia che portò poi la Baris asmonea e la fortezza Antonia di Erode, all’angolo nord-occidentale del Monte del Tempio. La Bibbia sinodale scrive il nome Hananel in Neemia e Anameil in Geremia e Zaccaria."
    - "I sacerdoti di Neemia costruirono la Porta delle Pecore e consacrarono il muro «fino alla torre di Mea, che consacrarono, e fino alla Torre di Hananeel», e alla dedicazione il secondo coro passò sopra la porta dei Pesci, «della torre di Hananeel, della torre di Mea, fino alla porta delle Pecore». La torre era più antica di Neemia: Geremia aveva promesso che «questa città sarà riedificata in onore dell’Eterno, dalla torre di Hananeel alla porta dell’angolo», misurando la Gerusalemme restaurata dal suo angolo nord-orientale a quello nord-occidentale, e Zaccaria vede la città abitata «dalla torre di Hananeel agli strettoi del re», dall’altura settentrionale ai giardini reali alla sua punta meridionale."
    - "Erode ricostruì la Baris come Antonia, che Giuseppe Flavio descrive come una torre su una roccia all’angolo dei cortili del Tempio; i Romani la presero d’assalto nel 70 d.C. Oggi la scarpata si trova sotto la scuola Umariya sulla Via Dolorosa, alla sua prima stazione, presso l’angolo nord-occidentale dell’Haram esh-Sharif."
  nl:
    - "De toren van Chananeël stond in de noordmuur van Jeruzalem, naast de toren van Mea (de Honderd) en tussen de Schaapspoort en de Vispoort, aan de noordzijde van de stad boven de tempel, de zijde van waaruit Jeruzalem het vaakst werd aangevallen. De naam betekent “God is genadig geweest” en kan die van de bouwer zijn. Van de toren is op het terrein niets bekend; de profeten noemen hem als het noordelijke oriëntatiepunt van de stad, en hij wordt vaak geplaatst op de rots die later de Hasmoneese Baris en Herodes’ vesting Antonia droeg, aan de noordwesthoek van de Tempelberg. De Synodale Bijbel schrijft de naam als Hananel bij Nehemia en als Anameil bij Jeremia en Zacharia."
    - "De priesters van Nehemia bouwden de Schaapspoort en heiligden de muur: “zij heiligden ze tot aan den toren Mea, tot aan den toren Hananeel”, en bij de inwijding passeerde het tweede koor “den toren Hananeel, en den toren Mea, tot aan de Schaapspoort”. De toren was ouder dan Nehemia: Jeremia had beloofd dat “deze stad den HEERE zal herbouwd worden, van den toren Hananeel af tot aan de Hoekpoort”, waarmee hij het herstelde Jeruzalem meette van zijn noordoost- tot zijn noordwesthoek, en Zacharia ziet de stad bewoond “van den toren van Hananeel, tot aan des konings wijnbakken toe”, van haar noordelijke hoogte tot de koninklijke tuinen aan haar zuidpunt."
    - "Herodes herbouwde de Baris als de Antonia, die Flavius Josephus beschrijft als een toren op een rots aan de hoek van de tempelhoven; de Romeinen namen haar in 70 n.Chr. stormenderhand in. Tegenwoordig ligt de rotswand onder de Umariya-school aan de Via Dolorosa, bij de eerste statie, bij de noordwesthoek van de Haram esh-Sharif."
  cs:
    - "Chananelova věž stála v severní hradbě Jeruzaléma, vedle věže Méa (Sta) a mezi Ovčí bránou a Rybí bránou, na severní straně města nad chrámem, ze které byl Jeruzalém nejčastěji napadán. Jméno znamená „Bůh byl milostivý“ a může to být jméno jejího stavitele. Nic z věže není z terénu známo; proroci ji jmenují jako severní orientační bod města a často se klade na skálu, která později nesla hasmonejský Baris a Herodovu pevnost Antonii, v severozápadním rohu Chrámové hory. Synodální překlad píše jméno jako Chananel u Nehemjáše a jako Anameil u Jeremjáše a Zacharjáše."
    - "Nehemjášovi kněží „stavěli bránu bravnou, (tiť jsou ji vystavěli, a zavěsili vrata její, až k věži Mea vystavěli ji), až k věži Chananeel“ a při vysvěcení druhý sbor šel dál „k bráně rybné, a věži Chananeel, a věži Mea, až k bráně bravné“. Věž byla starší než Nehemjáš: Jeremjáš slíbil, že „vystaveno bude město toto Hospodinu, od věže Chananeel až k bráně úhlu“, čímž měřil obnovený Jeruzalém od jeho severovýchodního po severozápadní roh, a Zacharjáš vidí město obydlené „od věže Chananeel až k presu královskému“, od severní výšiny k královským zahradám na jeho jižním cípu."
    - "Herodes přestavěl Baris na Antonii, kterou Josephus popisuje jako věž na skále v rohu chrámových nádvoří; Římané ji roku 70 n. l. dobyli. Dnes leží skarpa pod školou Umarija na Via Dolorosa, u její první zastávky, u severozápadního rohu Haram aš-Šaríf."
  sv:
    - "Hananeltornet stod i Jerusalems norra mur, bredvid Hammeatornet (Hundratornet) och mellan Fårporten och Fiskporten, på stadens norra sida ovanför templet, den sida från vilken Jerusalem oftast angreps. Namnet betyder ”Gud har varit nådig” och kan vara byggarens. Ingenting av tornet är känt från marken; profeterna nämner det som stadens nordliga landmärke, och det förläggs ofta till klippan som senare bar den hasmoneiska Baris och Herodes' fäste Antonia, vid Tempelbergets nordvästra hörn. Den synodala bibeln skriver namnet Hananel i Nehemja och Anameil i Jeremia och Sakarja."
    - "Nehemjas präster byggde Fårporten och helgade muren: de byggde ”ända fram till Hammeatornet, som de helgade, och vidare fram till Hananeltornet”, och vid invigningen gick den andra lovsångskören ”genom Hananeltornet, ända fram till Fårporten”. Tornet var äldre än Nehemja: Jeremia hade lovat att ”staden åter skall varda uppbyggd till HERRENS ära, från Hananeltornet intill Hörnporten”, vilket mäter det återställda Jerusalem från dess nordöstra till dess nordvästra hörn, och Sakarja ser staden bebodd ”till Hörnporten och Hananeltornet och till de kungliga vinpressarna”, från dess norra höjd till de kungliga trädgårdarna vid dess södra spets."
    - "Herodes byggde om Baris till Antonia, som Josefus beskriver som ett torn på en klippa vid hörnet av tempelgårdarna; romarna stormade den år 70 e.Kr. I dag ligger bergsbranten under Umariya-skolan vid Via Dolorosa, vid dess första station, intill Haram esh-Sharifs nordvästra hörn."
  nb:
    - "Hananel-tårnet sto i Jerusalems nordmur, ved siden av Mea-tårnet (Hundretårnet) og mellom Saueporten og Fiskeporten, på nordsiden av byen over tempelet, den siden Jerusalem oftest ble angrepet fra. Navnet betyr «Gud har vært nådig» og kan være navnet på byggeren. Ingenting av tårnet er kjent fra bakken; profetene nevner det som byens nordlige landemerke, og det plasseres ofte ved berget som senere bar den hasmoneiske Baris og Herodes' festning Antonia, i nordvesthjørnet av Tempelhøyden. Synodalbibelen skriver navnet Hananel i Nehemja og Anameil i Jeremia og Sakarja."
    - "Nehemjas prester bygde Saueporten og helliget muren: «så bygget de videre til Mea-tårnet, som de helliget, og videre frem til Hananel-tårnet», og ved innvielsen gikk det andre lovsangskoret «forbi Hananel-tårnet og Mea-tårnet, helt frem til Fåreporten». Tårnet var eldre enn Nehemja: Jeremia hadde lovet at «byen skal bygges for Herren, fra Hananels tårn like til Hjørneporten», og målte den gjenreiste Jerusalem fra nordøsthjørnet til nordvesthjørnet, og Sakarja ser byen bebodd «fra Hananels tårn til kongens vinperser», fra nordhøyden til de kongelige hagene i sør."
    - "Herodes bygde Baris om til Antonia, som Josefus beskriver som et tårn på et berg i hjørnet av tempelforgårdene; romerne stormet det i 70 e.Kr. I dag ligger skrenten under Umariya-skolen ved Via Dolorosa, ved den første stasjonen, ved nordvesthjørnet av Haram esh-Sharif."
  tl:
    - "Ang moog ng Hananeel ay nakatayo sa hilagang pader ng Jerusalem, sa tabi ng moog ng Meah (ng Isandaan) at sa pagitan ng Pintuang-bayan ng mga Tupa at ng Pintuang-bayan ng mga Isda, sa hilagang panig ng lunsod sa itaas ng Templo, ang panig na pinakamadalas salakayin. Ang pangalan ay nangangahulugang “Naging mapagbiyaya ang Diyos” at maaaring pangalan ng nagtayo nito. Walang nalalaman sa lupa tungkol sa moog; pinangalanan ito ng mga propeta bilang hilagang palatandaan ng lunsod, at madalas itong ilagay sa batong kalaunang nagdala ng Baris ng mga Hasmoneo at ng kutang Antonia ni Herodes, sa hilagang-kanlurang sulok ng Bundok ng Templo. Isinusulat ng Bibliyang Synodal ang pangalan na Hananel sa Nehemias at Anameil sa Jeremias at Zacharias."
    - "Itinayo ng mga saserdote ni Nehemias ang Pintuang-bayan ng mga Tupa at itinalaga ang pader: “hanggang sa moog ng Meah ay kanilang itinalaga, hanggang sa moog ng Hananeel”, at sa pagtatalaga ay dumaan ang ikalawang koro “sa moog ng Hananel, at sa moog ng Meah, hanggang sa pintuang-bayan ng mga tupa”. Mas matanda ang moog kaysa kay Nehemias: ipinangako na ni Jeremias na “ang bayan ay matatayo sa Panginoon mula sa moog ni Hananeel hanggang sa pintuang-bayan sa sulok”, na sinusukat ang naibalik na Jerusalem mula sa hilagang-silangang sulok hanggang sa hilagang-kanluran, at nakikita ni Zacharias ang lunsod na tinitirhan “mula sa moog ng Hananel hanggang sa pisaan ng ubas ng hari”, mula sa hilagang taluktok hanggang sa maharlikang halamanan sa timugang dulo."
    - "Itinayong muli ni Herodes ang Baris bilang Antonia, na inilalarawan ni Josefo bilang moog sa isang bato sa sulok ng mga bulwagan ng Templo; sinalakay ito ng mga Romano noong 70 AD. Ngayon ang dalisdis ay nasa ilalim ng paaralang Umariya sa Via Dolorosa, sa unang istasyon nito, sa tabi ng hilagang-kanlurang sulok ng Haram esh-Sharif."
  da:
    - "Hanan'els Tårn stod i Jerusalems nordmur, ved siden af Meas (Hundredes) tårn og mellem Fåreporten og Fiskeporten, på byens nordside oven for templet, den side, hvorfra Jerusalem oftest blev angrebet. Navnet betyder »Gud har været nådig« og kan være navnet på dets bygger. Intet af tårnet kendes fra terrænet; profeterne nævner det som byens nordlige landemærke, og det placeres ofte ved klippen, der senere bar den hasmonæiske Baris og Herodes' fæstning Antonia, i Tempelbjergets nordvestlige hjørne. Synodalbibelen skriver navnet som Hananel hos Nehemias og som Anameil hos Jeremias og Zakarias."
    - "Nehemias' præster byggede Fåreporten og helligede muren, »de helligede den indtil Meas Taarn, indtil Hananeels Taarn«, og ved indvielsen gik det andet kor »forbi Hananeels Taarn og Meas Taarn og indtil Faareporten«. Tårnet var ældre end Nehemias: Jeremias havde lovet, at »Staden skal bygges for Herren, fra Hananeels Taarn indtil Hjørneporten«, og målte det genoprettede Jerusalem fra dets nordøstlige til dets nordvestlige hjørne, og Zakarias ser byen beboet »fra Hananeels Taarn indtil Kongens Vinperser«, fra dens nordlige højde til de kongelige haver ved dens sydspids."
    - "Herodes genopbyggede Baris som Antonia, som Josephus beskriver som et tårn på en klippe ved hjørnet af templets forgårde; romerne stormede den i 70 e.Kr. I dag ligger skrænten under Umariya-skolen på Via Dolorosa, ved dens første station, ved Haram esh-Sharifs nordvestlige hjørne."
  sr:
    - "Кула Ананеилова стајала је у северном зиду Јерусалима, поред куле Меје (Стотина) и између Овчје капије и Рибље капије, на северној страни града изнад Храма, са које је Јерусалим најчешће нападан. Име значи „Бог је био милостив“ и можда је име њеног градитеља. О кули се с терена ништа не зна; пророци је именују као северно обележје града, и често се смешта на стену која је касније носила хасмонејски Барис и Иродову тврђаву Антонију, на северозападном углу Храмовне горе. Руска синодална Библија пише име као Ананеил у Немији, а као Анамеил у Јеремији и Захарији."
    - "Немијини свештеници саградили су Овчју капију и осветили зид: „и осветише их до куле Меје, до куле Ананилове“, а при посвећењу је други хор прошао „ка кули Ананеиловој и кули Меји, па до врата овчијих“. Кула је била старија од Немије: Јеремија је обећао да „ће се сазидати Господу овај град од куле Ананеилове до врата на углу“, мерећи обновљени Јерусалим од његовог североисточног до северозападног угла, а Захарија види град насељен „од куле Ананеилове до теска царевог“, од његове северне висине до краљевских вртова на јужном врху."
    - "Ирод је обновио Барис као Антонију, коју Јосиф Флавије описује као кулу на стени на углу дворишта Храма; Римљани су је заузели јуришем 70. н. е. Данас се стеновита ивица налази испод школе Умарија на Виа Долорози, код прве станице, крај северозападног угла Харам еш Шарифа."
