# Overview article (ADR 0007). Mainstream facts only; the tower is unlocated and its place at the later Antonia is given as the usual inference; the Synodal spelling varies between books, which the text notes.
id: tower-of-hananel
place: af58391
title:
  en: "Tower of Hananel"
  ru: "Башня Хананела"
  uk: "Вежа Хананела"
  es: "Torre de Hananeel"
  pt: "Torre de Hananeel"
  de: "Turm Hananel"
  fr: "Tour de Hananeel"
body:
  en:
    - "The tower of Hananel stood in the north wall of Jerusalem, beside the tower of Meah (the Hundred) and between the Sheep Gate and the Fish Gate, on the north side of the city above the Temple, the side from which Jerusalem was most often attacked. The name means “God has been gracious” and may be that of its builder. Nothing of the tower is known from the ground; the prophets name it as the city's northern landmark, and most scholars put it at the rock that later carried the Hasmonean Baris and Herod's fortress Antonia, at the north-west corner of the Temple Mount. The Synodal Bible writes the name as Hananel in Nehemiah and as Anameil in Jeremiah and Zechariah."
    - "Nehemiah's priests built the Sheep Gate and sanctified the wall “even unto the tower of Meah they sanctified it, unto the tower of Hananeel”, and at the dedication the second choir passed “the tower of Hananeel, and the tower of Meah, even unto the sheep gate”. The tower was older than Nehemiah: Jeremiah had promised that “the city shall be built to the LORD from the tower of Hananeel unto the gate of the corner”, measuring the restored Jerusalem from its north-east to its north-west corner, and Zechariah sees the city inhabited “from the tower of Hananeel unto the king's winepresses”, from its northern height to the royal gardens at its southern tip."
    - "Herod rebuilt the Baris as the Antonia, which Josephus describes as a tower on a rock at the corner of the Temple courts; the Romans stormed it in AD 70. Today the scarp lies beneath the Umariya school on the Via Dolorosa, at its first station, by the north-west corner of the Haram esh-Sharif."
  ru:
    - "Башня Хананела стояла в северной стене Иерусалима, рядом с башней Меа («Сто») и между Овечьими и Рыбными воротами, на северной стороне города над Храмом, с той стороны, откуда на Иерусалим чаще всего нападали. Имя значит «Бог помиловал» и, возможно, принадлежало её строителю. Из земли о башне ничего не известно; пророки называют её северной межой города, и большинство учёных помещают её на скале, которая позже несла хасмонейскую Барис и крепость Ирода Антонию у северо-западного угла Храмовой горы. Синодальный перевод пишет имя как Хананел у Неемии и как Анамеил у Иеремии и Захарии."
    - "Священники Неемии построили Овечьи ворота и освятили стену «от башни Меа освятили их до башни Хананела», а при освящении стены второй хор прошёл мимо «башни Хананела, и башни Меа, к Овечьим воротам». Башня старше Неемии: Иеремия обещал, что «город устроен будет во славу Господа от башни Анамеила до ворот угольных», отмеряя восстановленный Иерусалим от северо-восточного угла до северо-западного, а Захария видит город населённым «от башни Анамеила до царских точил» — от его северной высоты до царских садов у южной оконечности."
    - "Ирод перестроил Барис в Антонию, которую Иосиф Флавий описывает как башню на скале у угла храмовых дворов; римляне взяли её штурмом в 70 году н. э. Сегодня этот скальный уступ лежит под школой Умария на Виа Долороза, у её первой остановки, возле северо-западного угла Харам-эш-Шариф."
  uk:
    - "Вежа Хананела стояла в північному мурі Єрусалима, поряд із вежею Мея (Сотні), між Овечими й Рибними воротами, на північному боці міста над Храмом, звідки Єрусалим найчастіше штурмували. Ім’я означає «Бог був милостивий» і може бути ім’ям її будівничого. Про саму вежу з розкопок нічого не відомо; пророки називають її північним орієнтиром міста, і більшість учених ставлять її на скелю, що згодом несла хасмонейський Баріс і Іродову фортецю Антонія, на північно-західному куті Храмової гори. Синодальний переклад пише ім’я як Хананел у Неемії та як Анамеїл у Єремії й Захарії."
    - "Священики Неемії збудували Овечі ворота і посвятили мур: «посьвятили їх від башти Меа до башти Хананела», а на освяченні другий хор пройшов повз «башту Хананела і башту Меа, до Овечих воріт». Вежа була старшою за Неемію: Єремія обіцяв, що «одбудують ізнов город на славу Господеві від башти Анамеїлевої до углових воріт», міряючи відновлений Єрусалим від його північно-східного до північно-західного кута, а Захарія бачить місто заселеним «від Ананеїлової башти до царських тискарень», від його північної висоти до царських садів на південному кінці."
    - "Ірод перебудував Баріс в Антонію, яку Йосиф Флавій описує як вежу на скелі на куті подвір’їв Храму; римляни взяли її штурмом 70 року н. е. Нині уступ лежить під школою Умарійя на Віа Долороза, біля її першої станції, поряд із північно-західним кутом Харам аш-Шарифа."
  es:
    - "La torre de Hananeel se alzaba en la muralla norte de Jerusalén, junto a la torre de Meah (de los Cien) y entre la Puerta de las Ovejas y la Puerta del Pescado, en el lado norte de la ciudad sobre el Templo, el lado por el que Jerusalén fue atacada con más frecuencia. El nombre significa «Dios ha sido misericordioso» y puede ser el de su constructor. Nada de la torre se conoce sobre el terreno; los profetas la nombran como el hito septentrional de la ciudad, y la mayoría de los estudiosos la sitúan en la roca que más tarde llevó la Baris asmonea y la fortaleza Antonia de Herodes, en el ángulo noroeste del Monte del Templo. La Biblia sinodal escribe el nombre como Hananel en Nehemías y como Anameil en Jeremías y Zacarías."
    - "Los sacerdotes de Nehemías edificaron la Puerta de las Ovejas y consagraron la muralla «hasta la torre de Meah», «hasta la torre de Hananeel», y en la dedicación el segundo coro pasó la torre de Hananeel y la torre de Meah «hasta la puerta de las Ovejas». La torre era anterior a Nehemías: Jeremías había prometido que «la ciudad será edificada á Jehová, desde la torre de Hananeel hasta la puerta del rincón», midiendo la Jerusalén restaurada desde su ángulo noreste hasta el noroeste, y Zacarías ve la ciudad habitada «desde la torre de Hananeel hasta los lagares del rey», desde su altura septentrional hasta los jardines reales de su extremo sur."
    - "Herodes reconstruyó la Baris como la Antonia, que Josefo describe como una torre sobre una roca en el ángulo de los atrios del Templo; los romanos la tomaron al asalto en el 70 d. C. Hoy el escarpe yace bajo la escuela Umariya, en la Vía Dolorosa, en su primera estación, junto al ángulo noroeste del Haram esh-Sharif."
  pt:
    - "A torre de Hananeel ficava na muralha norte de Jerusalém, ao lado da torre de Meá (dos Cem) e entre a Porta das Ovelhas e a Porta do Peixe, no lado norte da cidade, acima do Templo, o lado de onde Jerusalém era mais atacada. O nome significa “Deus foi misericordioso” e pode ser o de seu construtor. Nada da torre se conhece no terreno; os profetas a nomeiam como marco setentrional da cidade, e a maioria dos estudiosos a põe na rocha que mais tarde sustentou a Baris hasmoneia e a fortaleza Antônia de Herodes, no canto noroeste do Monte do Templo. A Bíblia Sinodal escreve o nome como Hananel em Neemias e como Anameil em Jeremias e Zacarias."
    - "Os sacerdotes de Neemias edificaram a Porta das Ovelhas e consagraram a muralha: “Eles a consagraram até a torre de Meá, e até a torre de Hananel”, e na dedicação o segundo coro passou “pela Torre de Hananeel e pela Torre de Meá, até a Porta das Ovelhas”. A torre era mais antiga que Neemias: Jeremias havia prometido que “a cidade será edificada para o SENHOR, desde a torre de Hananeel até a porta da esquina”, medindo a Jerusalém restaurada de seu canto nordeste ao noroeste, e Zacarias vê a cidade habitada “desde a torre de Hananel até os lagares do rei”, de sua altura setentrional aos jardins reais na ponta sul."
    - "Herodes reconstruiu a Baris como a Antônia, que Josefo descreve como uma torre sobre uma rocha no canto dos pátios do Templo; os romanos a tomaram de assalto em 70 d.C. Hoje o escarpado fica sob a escola Umariya, na Via Dolorosa, em sua primeira estação, junto ao canto noroeste do Haram esh-Sharif."
  de:
    - "Der Turm Hananel stand in der Nordmauer Jerusalems, neben dem Turm Mea (der Hundert) und zwischen dem Schaftor und dem Fischtor, auf der Nordseite der Stadt oberhalb des Tempels, der Seite, von der aus Jerusalem am häufigsten angegriffen wurde. Der Name bedeutet „Gott hat sich gnädig erwiesen“ und mag der seines Erbauers sein. Vom Turm ist im Gelände nichts bekannt; die Propheten nennen ihn als nördliches Wahrzeichen der Stadt, und die meisten Forscher setzen ihn an den Felsen, der später die hasmonäische Baris und Herodes' Festung Antonia trug, an der Nordwestecke des Tempelbergs. Die Synodalbibel schreibt den Namen bei Nehemia Hananel und bei Jeremia und Sacharja Anameil."
    - "Nehemias Priester bauten das Schaftor und heiligten die Mauer: „Sie heiligten es aber bis an den Turm Mea, bis an den Turm Hananeel“, und bei der Einweihung zog der zweite Chor „zum Turm Hananeel und zum Turm Mea bis an das Schaftor“. Der Turm war älter als Nehemia: Jeremia hatte verheißen, dass „die Stadt des HERRN soll gebaut werden vom Turm Hananeel an bis ans Ecktor“, und maß so das wiederhergestellte Jerusalem von seiner Nordost- zur Nordwestecke, und Sacharja sieht die Stadt bewohnt „vom Turm Hananeel bis an des Königs Kelter“, von ihrer nördlichen Höhe bis zu den königlichen Gärten an ihrer Südspitze."
    - "Herodes baute die Baris zur Antonia um, die Josephus als Turm auf einem Felsen an der Ecke der Tempelhöfe beschreibt; die Römer stürmten sie im Jahr 70 n. Chr. Heute liegt die Felsstufe unter der Umariya-Schule an der Via Dolorosa, an ihrer ersten Station, an der Nordwestecke des Haram esh-Sharif."
  fr:
    - "La tour de Hananeel se dressait dans le mur nord de Jérusalem, à côté de la tour de Méa (des Cent) et entre la porte des Brebis et la porte des Poissons, sur le côté nord de la ville au-dessus du Temple, celui d’où Jérusalem était le plus souvent attaquée. Le nom signifie « Dieu a fait grâce » et peut être celui de son bâtisseur. On ne sait rien de la tour par le terrain ; les prophètes la nomment comme repère septentrional de la ville, et la plupart des spécialistes la placent sur le rocher qui porta plus tard la Baris hasmonéenne et la forteresse Antonia d’Hérode, à l’angle nord-ouest du mont du Temple. La Bible synodale écrit le nom Hananel chez Néhémie et Anameïl chez Jérémie et Zacharie."
    - "Les prêtres de Néhémie bâtirent la porte des Brebis et consacrèrent le mur : « ils la consacrèrent, depuis la tour de Méa jusqu’à la tour de Hananeel », et à la dédicace le second chœur alla « de la tour de Hananeel et de la tour de Méa, jusqu’à la porte des brebis ». La tour était plus ancienne que Néhémie : Jérémie avait promis que « la ville sera rebâtie à l’honneur de l’Éternel, depuis la tour de Hananeel jusqu’à la porte de l’angle », mesurant la Jérusalem restaurée de son angle nord-est à son angle nord-ouest, et Zacharie voit la ville habitée « depuis la tour de Hananeel jusqu’aux pressoirs du roi », de sa hauteur nord aux jardins royaux de sa pointe sud."
    - "Hérode rebâtit la Baris en Antonia, que Josèphe décrit comme une tour sur un rocher à l’angle des parvis du Temple ; les Romains la prirent d’assaut en 70 apr. J.-C. Aujourd’hui, l’escarpement se trouve sous l’école Umariya, sur la Via Dolorosa, à sa première station, près de l’angle nord-ouest du Haram esh-Sharif."
