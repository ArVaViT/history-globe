  pl: "Piękna Brama"
  nl: "Schone Poort"
  cs: "Krásná brána"
body:
  en:
    - "The Beautiful Gate was a gate of Herod's Temple in Jerusalem, known from one story. A man “lame from his mother’s womb was carried, whom they laid daily at the gate of the temple which is called Beautiful, to ask alms of them that entered into the temple”; Peter and John, going up at the hour of prayer, had no silver or gold and healed him instead, and the crowd “knew that it was he which sat for alms at the Beautiful gate of the temple”. He went with them into Solomon's porch, the colonnade along the east side of the outer court, where Peter preached. No other ancient writer calls any gate of the Temple “Beautiful”."
    - "Which gate it was is therefore guessed from the sources on the Temple. Josephus describes nine gates of the inner courts plated with silver and gold and one, outside the sanctuary, of Corinthian bronze that far surpassed them in value; the Mishnah says all the gates were changed to gold except the gates of Nicanor, because of a miracle done for them. Most scholars take the Beautiful Gate to be that bronze gate of Nicanor, on the east side of the inner courts, though they differ on exactly where it stood; others, because the lame man went out into Solomon's porch, prefer the eastern gate of the outer court, the Shushan Gate of the Mishnah. Nothing of either survives. The sealed Golden Gate in the eastern wall of the Temple Mount, which Christian pilgrims have long called the Beautiful Gate, is a building of the Byzantine or early Islamic period."
  ru:
    - "Красные двери — ворота Иродова храма в Иерусалиме, известные по одному рассказу. Был «человек, хромой от чрева матери его, которого носили и сажали каждый день при дверях храма, называемых Красными, просить милостыни у входящих в храм»; Пётр и Иоанн, шедшие в час молитвы, не имели ни серебра, ни золота и вместо того исцелили его, и народ узнал, «что это был тот, который сидел у Красных дверей храма для милостыни». Он вошёл с ними в притвор Соломонов, колоннаду вдоль восточной стороны внешнего двора, где Пётр произнёс проповедь. Никакой другой древний писатель не называет ни одни ворота храма «Красными»."
    - "Поэтому о том, какие это были ворота, гадают по источникам о храме. Иосиф Флавий описывает девять ворот внутренних дворов, обитых серебром и золотом, и одни, вне святилища, из коринфской бронзы, намного превосходившие их ценностью; Мишна говорит, что все ворота заменили золотыми, кроме ворот Никанора, ради чуда, с ними случившегося. Большинство учёных видят в Красных дверях эти бронзовые ворота Никанора на восточной стороне внутренних дворов, хотя расходятся в том, где именно они стояли; другие, поскольку хромой вышел в притвор Соломонов, предпочитают восточные ворота внешнего двора, Шушанские ворота Мишны. Ни от тех, ни от других ничего не сохранилось. Заложенные Золотые ворота в восточной стене Храмовой горы, которые христианские паломники издавна зовут Красными, — постройка византийского или раннеисламского времени."
  uk:
    - "Прекрасні ворота були воротами Іродового храму в Єрусалимі, відомими з однієї історії. Чоловіка, «що був кривий від утроби матери своєї, котрого кладено що дня перед церковними дверима, званими Гарними, просити милостинї в тих, що входили в церкву», несли до воріт; Петро та Іван, ідучи на молитву, не мали ні срібла, ні золота і зцілили його, а люди «знали його, що се той, що для милостинї сидїв коло Гарних дверей церковних». Він пішов з ними до Соломонового ходника, колонади вздовж східного боку зовнішнього двору, де Петро проповідував. Жоден інший давній автор не називає жодних воріт Храму «Прекрасними»."
    - "Які це були ворота, тому вгадують із джерел про Храм. Йосиф Флавій описує дев'ять воріт внутрішніх дворів, обкладених сріблом і золотом, і одні, поза святинею, з коринфської бронзи, що далеко перевершували їх вартістю; Мішна каже, що всі ворота замінили на золоті, окрім воріт Никанора, через чудо, звершене для них. Більшість учених вважає Прекрасні ворота тими бронзовими воротами Никанора, на східному боці внутрішніх дворів, хоча сперечаються, де саме вони стояли; інші, бо кульгавий вийшов до Соломонового ходника, віддають перевагу східним воротам зовнішнього двору, воротам Шушан з Мішни. Від жодних нічого не лишилося. Замуровані Золоті ворота у східному мурі Храмової гори, які християнські прочани здавна називають Прекрасними, — споруда візантійського або раннього ісламського періоду."
  es:
    - "La Puerta la Hermosa era una puerta del Templo de Herodes en Jerusalén, conocida por una sola historia. Un hombre «cojo desde el vientre de su madre, era traído; al cual ponían cada día á la puerta del templo que se llama la Hermosa, para que pidiese limosna de los que entraban en el templo»; Pedro y Juan, que subían a la hora de la oración, no tenían plata ni oro y lo sanaron en cambio, y la multitud «conocían que él era el que se sentaba á la limosna á la puerta del templo, la Hermosa». Fue con ellos al pórtico de Salomón, la columnata a lo largo del lado oriental del atrio exterior, donde Pedro predicó. Ningún otro escritor antiguo llama «Hermosa» a ninguna puerta del Templo."
    - "Cuál era la puerta se conjetura por las fuentes del Templo. Josefo describe nueve puertas de los atrios interiores recubiertas de plata y oro y una, fuera del santuario, de bronce de Corinto, que las superaba con mucho; la Misná dice que todas las puertas fueron cambiadas por otras de oro excepto las de Nicanor, a causa de un milagro hecho por ellas. La mayoría identifica la Puerta la Hermosa con la de bronce de Nicanor, en el lado oriental de los atrios interiores, aunque discrepan sobre dónde se alzaba exactamente; otros, porque el cojo salió al pórtico de Salomón, prefieren la puerta oriental del atrio exterior, la Puerta de Susa de la Misná. Ninguna subsiste. La sellada Puerta Dorada de la muralla oriental del monte del Templo, que los peregrinos cristianos llaman desde antiguo la Puerta la Hermosa, es de época bizantina o islámica temprana."
  pt:
    - "A Porta Formosa era uma porta do Templo de Herodes em Jerusalém, conhecida por uma só história. Um homem “coxo desde o ventre de sua mãe, era carregado; eles o colocavam diariamente à porta do templo chamada Formosa, para pedir esmolas aos que entravam no templo”; Pedro e João, subindo na hora da oração, não tinham prata nem ouro e o curaram, e a multidão “Reconheceram que era ele quem costumava ficar sentado pedindo esmolas à Porta Formosa do templo”. Ele foi com eles ao Pórtico de Salomão, a colunata ao longo do lado leste do pátio exterior, onde Pedro pregou. Nenhum outro escritor antigo chama “Formosa” a qualquer porta do Templo."
    - "Por isso se adivinha qual porta era a partir das fontes sobre o Templo. Josefo descreve nove portas dos pátios interiores revestidas de prata e ouro e uma, fora do santuário, de bronze coríntio, que as superava de longe em valor; a Mishná diz que todas as portas foram mudadas para ouro, exceto as portas de Nicanor, por causa de um milagre feito por elas. A maioria dos estudiosos toma a Porta Formosa por essa porta de bronze de Nicanor, no lado leste dos pátios interiores, embora divirjam sobre onde exatamente ficava; outros, porque o coxo saiu para o Pórtico de Salomão, preferem a porta oriental do pátio exterior, a Porta de Susã da Mishná. Nada de nenhuma subsiste. A Porta Dourada selada, na muralha leste do monte do Templo, que peregrinos cristãos chamam há muito Porta Formosa, é uma construção do período bizantino ou islâmico antigo."
  de:
    - "Die Schöne Pforte war ein Tor des herodianischen Tempels in Jerusalem, aus einer einzigen Geschichte bekannt. Ein Mann, „lahm von Mutterleibe“, „ließ sich tragen; und sie setzten ihn täglich vor des Tempels Tür, die da heißt ‚die schöne‘, daß er bettelte das Almosen von denen, die in den Tempel gingen“; Petrus und Johannes, die zur Gebetsstunde hinaufgingen, hatten weder Silber noch Gold und heilten ihn stattdessen, und das Volk „kannte ihn auch, daß er's war, der um Almosen gesessen hatte vor der schönen Tür des Tempels“. Er ging mit ihnen in die Halle Salomos, die Säulenhalle an der Ostseite des äußeren Vorhofs, wo Petrus predigte. Kein anderer antiker Autor nennt irgendein Tor des Tempels „schön“."
    - "Welches Tor es war, wird daher aus den Quellen zum Tempel erraten. Josephus beschreibt neun mit Silber und Gold überzogene Tore der inneren Vorhöfe und eines außerhalb des Heiligtums aus korinthischem Erz, das sie an Wert weit übertraf; die Mischna sagt, alle Tore seien in Gold verwandelt worden außer den Toren des Nikanor, wegen eines für sie gewirkten Wunders. Die meisten Gelehrten halten die Schöne Pforte für dieses Erztor des Nikanor an der Ostseite der inneren Vorhöfe, obwohl sie sich uneins sind, wo genau es stand; andere ziehen, weil der Lahme in die Halle Salomos hinausging, das Osttor des äußeren Vorhofs vor, das Susator der Mischna. Von keinem ist etwas erhalten. Das vermauerte Goldene Tor in der Ostmauer des Tempelbergs, das christliche Pilger lange die Schöne Pforte nannten, ist ein Bau der byzantinischen oder frühislamischen Zeit."
  fr:
    - "La Porte Belle était une porte du Temple d’Hérode à Jérusalem, connue par une seule histoire. Un homme « boiteux de naissance, qu’on portait et qu’on plaçait tous les jours à la porte du temple appelée la Belle, pour qu’il demandât l’aumône à ceux qui entraient dans le temple » ; Pierre et Jean, montant à l’heure de la prière, n’avaient ni argent ni or et le guérirent à la place, et la foule reconnaissait « celui qui était assis à la Belle porte du temple pour demander l’aumône ». Il entra avec eux sous le portique de Salomon, la colonnade du côté est de la cour extérieure, où Pierre prêcha. Aucun autre écrivain ancien n’appelle « Belle » une porte du Temple."
    - "Quelle porte c’était se devine donc d’après les sources sur le Temple. Josèphe décrit neuf portes des cours intérieures plaquées d’argent et d’or et une, hors du sanctuaire, en bronze de Corinthe, qui les surpassait de beaucoup en valeur ; la Mishna dit que toutes les portes furent changées en or sauf celles de Nicanor, à cause d’un miracle. La plupart des savants tiennent la Porte Belle pour cette porte de bronze de Nicanor, du côté est des cours intérieures, sans accord sur son emplacement exact ; d’autres, l’infirme étant sorti sous le portique de Salomon, préfèrent la porte orientale de la cour extérieure, la porte de Suse de la Mishna. Rien de l’une ni de l’autre ne subsiste. La Porte Dorée murée du mur oriental du mont du Temple, que les pèlerins chrétiens appellent depuis longtemps Porte Belle, date de l’époque byzantine ou du début de l’époque islamique."
  it:
    - "La Porta Bella era una porta del Tempio di Erode a Gerusalemme, nota da un solo racconto. Un uomo «zoppo fin dalla nascita» veniva portato ogni giorno e deposto «alla porta del tempio detta “Bella”, per chieder l’elemosina a coloro che entravano nel tempio»; Pietro e Giovanni, saliti all’ora della preghiera senza argento né oro, lo guarirono, e la folla lo riconobbe «per quello che sedeva a chieder l’elemosina alla porta “Bella” del tempio». Entrò con loro nel portico di Salomone, il colonnato sul lato orientale del cortile esterno, dove Pietro predicò. Nessun altro scrittore antico chiama «Bella» alcuna porta del Tempio."
    - "Quale porta fosse si congettura dunque dalle fonti sul Tempio. Flavio Giuseppe descrive nove porte dei cortili interni rivestite d’argento e d’oro e una, fuori del santuario, di bronzo corinzio che le superava di gran lunga in valore; la Mishnah dice che tutte le porte furono mutate in oro tranne le porte di Nicanore, a causa di un miracolo avvenuto per esse. La maggior parte degli studiosi ritiene la Porta Bella quella porta di bronzo di Nicanore, sul lato orientale dei cortili interni, benché non concordino sul punto esatto; altri, poiché lo zoppo uscì nel portico di Salomone, preferiscono la porta orientale del cortile esterno, la Porta di Shushan della Mishnah. Nulla di entrambe sopravvive. La Porta Dorata murata nel muro orientale del Monte del Tempio, che i pellegrini cristiani hanno a lungo chiamato Porta Bella, è un edificio bizantino o paleoislamico."
  pl:
    - "Piękna Brama była bramą Świątyni Heroda w Jerozolimie, znaną z jednej opowieści. „A mąż niektóry będąc chromy, zaraz z żywota matki swojej był noszony, którego na każdy dzień sadzano u drzwi kościelnych, które zwano piękne, aby prosił jałmużny od tych, którzy wchodzili do kościoła”; Piotr i Jan, idąc na modlitwę, nie mieli srebra ani złota i uzdrowili go, a tłum, jak czytamy, „poznali go, iż to on był, który dla jałmużny siadał u drzwi pięknych kościelnych”. Weszli z nim do Krużganka Salomona, kolumnady po wschodniej stronie dziedzińca zewnętrznego, gdzie Piotr przemawiał. Żaden inny starożytny pisarz nie nazywa żadnej bramy Świątyni „piękną”."
    - "Którą bramą była, można więc tylko zgadywać ze źródeł o Świątyni. Józef Flawiusz opisuje dziewięć bram dziedzińców wewnętrznych pokrytych srebrem i złotem oraz jedną, na zewnątrz sanktuarium, z brązu korynckiego, która znacznie je przewyższała wartością; Miszna mówi, że wszystkie bramy zmieniono na złote oprócz bram Nikanora, z powodu cudu, który dla nich uczyniono. Większość uczonych uważa Piękną Bramę za tę brązową bramę Nikanora, po wschodniej stronie dziedzińców wewnętrznych, choć różnią się co do tego, gdzie dokładnie stała; inni, ponieważ chromy wyszedł do Krużganka Salomona, wolą wschodnią bramę dziedzińca zewnętrznego, Bramę Szuszan z Miszny. Nic z żadnej nie przetrwało. Zamurowana Złota Brama we wschodnim murze Wzgórza Świątynnego, którą chrześcijańscy pielgrzymi od dawna nazywają Piękną Bramą, jest budowlą z okresu bizantyjskiego lub wczesnoislamskiego."
  nl:
    - "De Schone Poort was een poort van Herodes’ tempel in Jeruzalem, bekend uit één verhaal. Een man “die kreupel was van zijner moeders lijf, werd gedragen, welken zij dagelijks zetten aan de deur des tempels, genaamd de Schone, om een aalmoes te begeren van degenen, die in den tempel gingen”; Petrus en Johannes, opgaand op het uur van gebed, hadden geen zilver of goud en genazen hem in plaats daarvan, en de menigte “kenden hem, dat hij die was, die om een aalmoes gezeten had aan de Schone poort des tempels”. Hij ging met hen mee naar Salomo’s zuilengang, de galerij langs de oostkant van het buitenhof, waar Petrus predikte. Geen andere antieke schrijver noemt een tempelpoort “Schoon”."
    - "Welke poort het was, wordt dus afgeleid uit de bronnen over de tempel. Josephus beschrijft negen poorten van de binnenhoven, bekleed met zilver en goud, en één, buiten het heiligdom, van Korinthisch brons die hen ver in waarde overtrof; de Misjna zegt dat alle poorten tot goud werden veranderd behalve de poorten van Nicanor, wegens een wonder dat voor hen was gedaan. De meeste geleerden houden de Schone Poort voor die bronzen poort van Nicanor, aan de oostkant van de binnenhoven, al verschillen zij over waar precies zij stond; anderen verkiezen, omdat de kreupele naar Salomo’s zuilengang ging, de oostelijke poort van het buitenhof, de Sjoesjanpoort van de Misjna. Niets van beide is bewaard. De gesloten Gouden Poort in de oostmuur van de Tempelberg, die christelijke pelgrims lang de Schone Poort noemden, is een Byzantijns of vroeg-islamitisch gebouw."
  cs:
    - "Krásná brána byla brána Herodova chrámu v Jeruzalémě, známá z jednoho příběhu. Muž „chromý tak narozený z života matky své, nesen byl, kteréhož sázeli na každý den u dveří chrámových, kteréž slouly Krásné, aby prosil za almužnu těch, kteříž vcházeli do chrámu“; Petr a Jan, kteří vstupovali v hodinu modlitební, neměli stříbro ani zlato a uzdravili ho, a lidé ho poznali: „kterýž na almužně sedával u dveří Krásných chrámových“. Šel s nimi do „síňce, kteráž sloula Šalomounova“, sloupořadí podél východní strany vnějšího nádvoří, kde Petr kázal. Žádný jiný starověký spisovatel nenazývá žádnou bránu chrámu „Krásnou“."
    - "Která brána to byla, se tedy odhaduje podle pramenů o chrámu. Josephus Flavius popisuje devět bran vnitřních nádvoří pokrytých stříbrem a zlatem a jednu, mimo svatyni, z korintského bronzu, která je hodnotou daleko převyšovala; Mišna praví, že všechny brány byly změněny na zlaté kromě bran Nikanórových kvůli zázraku, který se jim stal. Většina badatelů pokládá Krásnou bránu za onu bronzovou bránu Nikanórovu na východní straně vnitřních nádvoří, ač se neshodují, kde přesně stála; jiní, protože chromý vyšel do Šalomounovy síně, dávají přednost východní bráně vnějšího nádvoří, bráně Šušan z Mišny. Z žádné nic nezbylo. Zazděná Zlatá brána ve východní hradbě Chrámové hory, kterou křesťanští poutníci dlouho nazývají Krásnou branou, je stavbou z byzantského nebo raně islámského období."
scripture:
