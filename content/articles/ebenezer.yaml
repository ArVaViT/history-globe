# Overview article (ADR 0007). Mainstream facts only; the Izbet Sartah proposal is given as a proposal; the relation to Samuel's stone (1 Sam 7:12) is left open as scholars leave it.
id: ebenezer
place: abfdefc
title:
  en: "Ebenezer"
  ru: "Авен-Езер"
  uk: "Авен-Езер"
  es: "Ebenezer"
  pt: "Ebenézer"
  de: "Eben-Eser"
