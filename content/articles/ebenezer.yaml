body:
  en:
    - "Ebenezer, “the stone of help”, is the place where Israel camped against the Philistines in the days of Eli: “Israel went out against the Philistines to battle, and pitched beside Eben-ezer: and the Philistines pitched in Aphek.” Israel lost about four thousand men, then fetched the ark from Shiloh; in the second battle thirty thousand fell, Hophni and Phinehas died, and “the Philistines took the ark of God, and brought it from Eben-ezer unto Ashdod”. The name is that of the stone Samuel set up years later “between Mizpeh and Shen” after his own victory, saying “Hitherto hath the LORD helped us”; whether the two are one place, the narrator using the later name, or two places far apart, is debated."
    - "The battlefield is fixed only by Aphek, generally taken for Tel Aphek (Ras el-Ain) at the springs of the Yarkon, the later Antipatris. On the first hills to the east, in sight of Aphek, Izbet Sartah, a small village of the early Iron Age excavated by Moshe Kochavi and Israel Finkelstein in 1976-1978, has been proposed as Ebenezer: it faces the Philistine camp from the Israelite side and yielded an ostracon with an early alphabet; but no inscription names it, and others leave Ebenezer unlocated, perhaps near Majdal Yaba a little to the south. The site today lies on the eastern edge of Rosh HaAyin in Israel, opposite the Aphek springs."
  ru:
    - "Авен-Езер, «камень помощи», — место, где Израиль стал станом против Филистимлян во дни Илия: «выступили Израильтяне против Филистимлян на войну и расположились станом при Авен-Езере, а Филистимляне расположились при Афеке». Израиль потерял около четырёх тысяч человек, затем принёс ковчег из Силома; во второй битве пало тридцать тысяч, погибли Офни и Финеес, и «Филистимляне же взяли ковчег Божий и принесли его из Авен-Езера в Азот». Так же назван камень, который Самуил годы спустя поставил «между Массифою и между Сеном» после собственной победы со словами «до сего места помог нам Господь»; одно ли это место, названное рассказчиком по позднейшему имени, или два далёких друг от друга, — спорно."
    - "Поле битвы определяется только Афеком, который обычно отождествляют с Тель-Афеком (Рас-эль-Айн) у истоков Яркона, позднейшим Антипатридой. На первых холмах к востоку, в виду Афека, Избет-Сарта — небольшое селение раннего железного века, раскопанное Моше Кохави и Израилем Финкельштейном в 1976–1978 годах, — была предложена как Авен-Езер: она смотрит на филистимский стан с израильской стороны и дала остракон с ранним алфавитом; но никакая надпись её не называет, и другие оставляют Авен-Езер без места, быть может, у Мадждаль-Ябы чуть южнее. Сегодня это место лежит на восточной окраине Рош-ха-Аина в Израиле, напротив источников Афека."
  uk:
    - "Авен-Езер, «камінь допомоги», — місце, де Ізраїль отаборився проти филистимлян за днів Ілія: «виступили Ізрайлитяне на війну проти Филистіїв та й отаборились при Авен-Езері, тим часом як Филистії отаборились під Афеком». Ізраїль втратив близько чотирьох тисяч чоловік, потім привіз скриню із Шіло; у другій битві полягло тридцять тисяч, загинули Офні та Финеес, і «Филистії ж узяли скриню Божу до себе та й перенесли її з Абен-Езера в Азот». Це ім'я каменя, який Самуїл поставив через роки «між Массифою і Сеном» після власної перемоги, сказавши: «Ось поки Господь дав нам підмогу!»; чи це одне місце, а оповідач вживає пізнішу назву, чи два місця далеко одне від одного, є предметом суперечки."
    - "Поле битви визначається лише Афеком, який загалом ототожнюють із Телль-Афеком (Рас-ель-Айн) біля джерел Яркону, пізнішою Антипатридою. На перших пагорбах на схід, у видноті Афека, як Авен-Езер запропонували Ізбет-Сарту, мале село ранньої залізної доби, розкопане Моше Кохаві та Ізраелем Фінкельштейном у 1976–1978 рр.: воно дивиться на филистимський табір з ізраїльського боку й дало остракон із раннім алфавітом; але жоден напис не називає його, а інші лишають Авен-Езер нелокалізованим, можливо, поблизу Маджаль-Яби трохи на південь. Місце сьогодні лежить на східному краї Рош-ха-Аїна в Ізраїлі, навпроти джерел Афека."
  es:
    - "Ebenezer, «la piedra de la ayuda», es el lugar donde Israel acampó contra los filisteos en los días de Elí: «salió Israel á encontrar en batalla á los Filisteos, y asentó campo junto á Eben-ezer, y los Filisteos asentaron el suyo en Aphec». Israel perdió unos cuatro mil hombres, luego trajo el arca de Silo; en la segunda batalla cayeron treinta mil, murieron Ofni y Finees, y «los Filisteos, tomada el arca de Dios, trajéronla desde Eben-ezer á Asdod». Es también el nombre de la piedra que Samuel erigió años después «entre Mizpa y Sen» tras su propia victoria, diciendo: «Hasta aquí nos ayudó Jehová»; si ambos son un mismo lugar, usando el narrador el nombre posterior, o dos lugares muy distantes, es objeto de debate."
    - "El campo de batalla se fija solo por Afec, que suele tomarse por Tel Afec (Ras el-Ain), en las fuentes del Yarkón, la posterior Antípatris. En las primeras colinas al este, a la vista de Afec, se ha propuesto como Ebenezer Izbet Sartah, una pequeña aldea de comienzos de la Edad del Hierro excavada por Moshe Kochavi e Israel Finkelstein en 1976–1978: mira al campamento filisteo desde el lado israelita y dio un óstracon con un alfabeto temprano; pero ninguna inscripción la nombra, y otros dejan Ebenezer sin localizar, quizá cerca de Majdal Yaba, un poco más al sur. El sitio se halla hoy en el borde oriental de Rosh HaAyin, en Israel, frente a las fuentes de Afec."
  pt:
    - "Ebenézer, “pedra de ajuda”, é o lugar onde Israel acampou contra os filisteus nos dias de Eli: “Israel saiu para guerrear contra os filisteus e acampou perto de Ebenézer; e os filisteus acamparam em Afeque.” Israel perdeu cerca de quatro mil homens, depois foi buscar a arca em Siló; na segunda batalha caíram trinta mil, Hofni e Fineias morreram, e “Os filisteus tomaram a arca de Deus e a levaram de Ebenézer para Asdode”. O nome é o da pedra que Samuel erigiu anos depois “entre Mispá e Sem”, após a sua própria vitória, dizendo: “Até aqui o SENHOR nos ajudou”; se os dois são um só lugar, usando o narrador o nome posterior, ou dois lugares distantes, é debatido."
    - "O campo de batalha é fixado apenas por Afeque, geralmente tida como Tel Aphek (Ras el-Ain), nas nascentes do Yarkon, a posterior Antipátride. Nas primeiras colinas a leste, à vista de Afeque, Izbet Sartah, uma pequena aldeia do início da Idade do Ferro escavada por Moshe Kochavi e Israel Finkelstein em 1976-1978, foi proposta como Ebenézer: ela encara o acampamento filisteu do lado israelita e rendeu um óstraco com um alfabeto antigo; mas nenhuma inscrição a nomeia, e outros deixam Ebenézer sem localização, talvez perto de Majdal Yaba, um pouco ao sul. O local fica hoje no limite leste de Rosh HaAyin, em Israel, diante das nascentes de Afeque."
  de:
    - "Eben-Eser, „Stein der Hilfe“, ist der Ort, an dem Israel in den Tagen Elis gegen die Philister lagerte: „Israel aber zog aus, den Philistern entgegen, in den Streit, und lagerten sich bei Eben-Ezer. Die Philister aber hatten sich gelagert zu Aphek.“ Israel verlor etwa viertausend Mann, holte dann die Lade aus Silo; in der zweiten Schlacht fielen dreißigtausend, Hofni und Pinhas starben, und die Philister „nahmen die Lade Gottes und brachten sie von Eben-Ezer gen Asdod“. Den Namen trägt der Stein, den Samuel Jahre später nach seinem eigenen Sieg „zwischen Mizpa und Sen“ aufstellte, mit den Worten: „Bis hierher hat uns der HERR geholfen“; ob beides derselbe Ort ist und der Erzähler den späteren Namen gebraucht oder ob es zwei weit voneinander entfernte Orte sind, ist umstritten."
    - "Das Schlachtfeld ist nur durch Afek festgelegt, gewöhnlich für Tel Afek (Ras el-Ain) an den Quellen des Jarkon gehalten, das spätere Antipatris. Auf den ersten Hügeln im Osten, in Sichtweite von Afek, ist Izbet Sartah, ein kleines Dorf der frühen Eisenzeit, das Moshe Kochavi und Israel Finkelstein 1976–1978 ausgruben, als Eben-Eser vorgeschlagen worden: Es liegt dem Lager der Philister von der israelitischen Seite gegenüber und lieferte ein Ostrakon mit einem frühen Alphabet; doch keine Inschrift nennt es, und andere lassen Eben-Eser unlokalisiert, vielleicht nahe Majdal Yaba etwas weiter südlich. Der Ort liegt heute am Ostrand von Rosh HaAyin in Israel, gegenüber den Quellen von Afek."
  fr:
    - "Ében-Ézer, « la pierre du secours », est le lieu où Israël campa contre les Philistins du temps d’Éli : « Israël sortit à la rencontre des Philistins, pour combattre. Ils campèrent près d’Ében-Ézer, et les Philistins étaient campés à Aphek. » Israël perdit environ quatre mille hommes, puis fit venir l’arche de Silo ; à la seconde bataille, trente mille tombèrent, Hophni et Phinées moururent, et « les Philistins prirent l’arche de Dieu, et ils la transportèrent d’Ében-Ézer à Asdod ». C’est le nom de la pierre que Samuel dressa des années plus tard « entre Mitspa et Schen » après sa propre victoire, en disant : « Jusqu’ici l’Éternel nous a secourus » ; on débat de savoir si les deux sont un même lieu, le narrateur employant le nom ultérieur, ou deux lieux éloignés."
    - "Le champ de bataille n’est fixé que par Aphek, généralement tenue pour Tel Aphek (Ras el-Ain), aux sources du Yarkon, la future Antipatris. Sur les premières collines à l’est, en vue d’Aphek, Izbet Sartah, petit village du début de l’âge du Fer fouillé par Moshe Kochavi et Israel Finkelstein en 1976-1978, a été proposé comme Ében-Ézer : il fait face au camp philistin du côté israélite et a livré un ostracon portant un alphabet ancien ; mais aucune inscription ne le nomme, et d’autres laissent Ében-Ézer sans localisation, peut-être près de Majdal Yaba un peu plus au sud. Le site se trouve aujourd’hui à la lisière est de Rosh HaAyin, en Israël, face aux sources d’Aphek."
  it:
    - "Eben-Ezer, «la pietra dell’aiuto», è il luogo dove Israele si accampò contro i Filistei ai giorni di Eli: «Israele uscì contro i Filistei per dar battaglia, e si accampò presso Eben-Ezer; i Filistei erano accampati presso Afek.» Israele perse circa quattromila uomini, poi fece venire l’arca da Silo; nella seconda battaglia ne caddero trentamila, Ofni e Pincas morirono, e «I Filistei, dunque, presero l’arca di Dio, e la trasportarono da Eben-Ezer a Asdod». Il nome è quello della pietra che Samuele pose anni dopo «tra Mitspa e Scen» dopo la propria vittoria, dicendo: «Fin qui l’Eterno ci ha soccorsi»; se i due luoghi siano uno solo, con il narratore che usa il nome più tardo, o due luoghi lontani, è dibattuto."
    - "Il campo di battaglia è fissato soltanto da Afek, generalmente identificata con Tel Afek (Ras el-Ain) alle sorgenti dello Yarkon, la successiva Antipatride. Sulle prime colline a est, in vista di Afek, Izbet Sartah, un piccolo villaggio della prima età del Ferro scavato da Moshe Kochavi e Israel Finkelstein nel 1976–1978, è stato proposto come Eben-Ezer: guarda al campo filisteo dal lato israelita e ha restituito un ostrakon con un alfabeto arcaico; ma nessuna iscrizione lo nomina, e altri lasciano Eben-Ezer non localizzata, forse presso Majdal Yaba un po’ a sud. Il sito si trova oggi al margine orientale di Rosh HaAyin in Israele, di fronte alle sorgenti di Afek."
  pl:
    - "Eben-Ezer, „kamień pomocy”, jest miejscem, gdzie Izrael obozował przeciw Filistynom za dni Heliego: „gdy wyciągnął Izrael przeciw Filistynom na wojnę, a położył się obozem u Ebenezer, Filistynowie zaś położyli się obozem w Afeku”. Izrael stracił około czterech tysięcy ludzi, po czym sprowadził arkę z Szilo; w drugiej bitwie padło trzydzieści tysięcy, zginęli Chofni i Pinchas, a „Filistynowie wzięli skrzynię Bożą, i zanieśli ją z Ebenezer do Azotu”. Nazwa jest nazwą kamienia, który Samuel postawił lata później „między Masfa a między Sen” po własnym zwycięstwie, mówiąc: „Aż póty pomagał nam Pan”; czy oba są jednym miejscem, a narrator używa późniejszej nazwy, czy dwoma miejscami daleko od siebie, jest dyskutowane."
    - "Pole bitwy wyznacza tylko Afek, zwykle uważany za Tel Afek (Ras al-Ajn) przy źródłach Jarkonu, późniejszą Antypatris. Na pierwszych wzgórzach na wschodzie, w polu widzenia Afeku, Izbet Sarta, mała wieś z wczesnej epoki żelaza badana przez Moshe Kochaviego i Israela Finkelsteina w latach 1976–1978, została zaproponowana jako Eben-Ezer: patrzy ona na obóz filistyński ze strony izraelskiej i dała ostrakon z wczesnym alfabetem; lecz żaden napis jej nie nazywa, a inni zostawiają Eben-Ezer bez lokalizacji, być może blisko Madżdal Jaba nieco na południe. Miejsce leży dziś na wschodnim skraju Rosz ha-Ajin w Izraelu, naprzeciw źródeł Afeku."
  nl:
    - "Eben-Haëzer, “de steen van hulp”, is de plaats waar Israël zich legerde tegen de Filistijnen in de dagen van Eli: “Israël toog uit, den Filistijnen tegemoet, ten strijde, en legerde zich bij Eben-Haezer, maar de Filistijnen legerden zich bij Afek.” Israël verloor zo'n vierduizend man, haalde toen de ark uit Silo; in de tweede slag vielen er dertigduizend, Chofni en Pinechas stierven, en “De Filistijnen nu namen de ark Gods, en zij brachten ze van Eben-Haezer tot Asdod”. De naam is die van de steen die Samuël jaren later opstelde “tussen Mizpa en tussen Sen” na zijn eigen overwinning, zeggend: “Tot hiertoe heeft de HEERE ons geholpen”; of beide dezelfde plaats zijn, waarbij de verteller de latere naam gebruikt, of twee ver uiteen gelegen plaatsen, is omstreden."
    - "Het slagveld wordt alleen door Afek vastgelegd, algemeen opgevat als Tel Afek (Ras el-Ain) bij de bronnen van de Jarkon, het latere Antipatris. Op de eerste heuvels ten oosten, in zicht van Afek, is Izbet Sartah, een klein dorp uit de vroege IJzertijd, door Moshe Kochavi en Israel Finkelstein in 1976–1978 opgegraven, voorgesteld als Eben-Haëzer: het ligt aan Israëlitische zijde tegenover het Filistijnse kamp en leverde een ostrakon met een vroeg alfabet; maar geen inscriptie noemt het, en anderen laten Eben-Haëzer ongelokaliseerd, misschien bij Majdal Yaba iets ten zuiden. De plaats ligt nu aan de oostrand van Rosj Ha'Ayin in Israël, tegenover de bronnen van Afek."
  cs:
    - "Eben-ezer, „kámen pomoci“, je místo, kde se Izrael utábořil proti Pelištejcům za dnů Élího: „když vytáhl Izrael proti Filistinským k boji, a položili se při Eben-Ezer, Filistinští pak položili se v Afeku“. Izrael ztratil asi čtyři tisíce mužů, pak přinesl truhlu ze Šíla; ve druhé bitvě padlo třicet tisíc, Chofni a Pinchas zemřeli a „Filistinští pak vzali truhlu Boží, a zanesli ji z Eben-Ezer do Azotu“. Jméno nese kámen, který Samuel postavil o léta později „mezi Masfa a mezi Sen“ po svém vlastním vítězství, řka „Až potud pomáhal nám Hospodin“; zda jsou obě místa jedno, přičemž vypravěč užívá pozdějšího jména, nebo dvě místa daleko od sebe, je sporné."
    - "Bojiště je určeno jen Afekem, obecně pokládaným za Tel Aphek (Ras el-Ain) u pramenů Yarkonu, pozdější Antipatris. Na prvních pahorcích na východ, v dohledu Afeku, byl jako Eben-ezer navržen Izbet Sartah, malá vesnice rané doby železné, kterou v letech 1976–1978 vykopávali Moshe Kochavi a Israel Finkelstein: hledí na pelištejský tábor z izraelské strany a vydala ostrakon s raným písmem; žádný nápis ji však nejmenuje a jiní nechávají Eben-ezer nelokalizován, snad poblíž Majdal Yaba o něco jižněji. Místo dnes leží na východním okraji Rosh HaAyin v Izraeli, naproti pramenům Afeku."
