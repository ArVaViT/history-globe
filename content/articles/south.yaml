body:
  en:
    - "The South of Daniel 11 is a kingdom, not a country: the “king of the south” who wars through the chapter with the “king of the north”. Since Jerome, who answered the pagan Porphyry on this chapter, readers have agreed that the south is Egypt under the Ptolemies and the north is Syria under the Seleucids, two of the Greek dynasties that divided Alexander's empire; Egypt lies south of Judah, and the chapter itself names Egypt as the land where the king of the south carries off captured gods. The Ptolemies ruled from Alexandria from 305 to 30 BC, and for a century they also held Judea, which lay between the two kingdoms and changed hands in their wars."
    - "The vision follows those wars: “the king of the south shall be strong, and one of his princes; and he shall be strong above him”: Ptolemy I and his former general Seleucus I. “the king's daughter of the south shall come to the king of the north to make an agreement”: Berenice, daughter of Ptolemy II, married Antiochus II about 252 BC and was murdered. Her brother Ptolemy III invaded Syria and carried gods and treasure “into Egypt”; his Adulis inscription boasts of sacred things brought home. Antiochus III was beaten by Ptolemy IV at Raphia in 217 BC, but at Panium in 200 he took Judea: “the arms of the south shall not withstand”. His daughter Cleopatra was given to Ptolemy V. Antiochus IV twice invaded Egypt, in 170 and 168 BC; the second time, “at the time appointed”, the Romans turned him back at Alexandria, “but it shall not be as the former”. Returning, he fell on Jerusalem."
    - "After verse 39 the vision and the known history part: the last war of the king of the south, in which the king of the north overruns Egypt and dies, does not match what is known of Antiochus, who died in Persia in 164 BC. Readers have differed ever since over whether the chapter looks beyond him. Most modern scholars date the chapter to about 165 BC, during the Maccabean crisis; the traditional view holds it to be a prophecy of the sixth century. In either case the kingdom of the south is the Egypt of Alexandria, whose last queen, Cleopatra VII, died in 30 BC, when Egypt became a Roman province."
  ru:
    - "Юг в одиннадцатой главе Даниила — не страна, а царство: «южный царь», который на протяжении всей главы воюет с царём северным. Со времён Иеронима, отвечавшего язычнику Порфирию по поводу этой главы, читатели сходятся в том, что юг — это Египет Птолемеев, а север — Сирия Селевкидов, двух из греческих династий, поделивших державу Александра; Египет лежит к югу от Иудеи, и сама глава называет Египет землёй, куда южный царь увозит захваченных богов. Птолемеи правили из Александрии с 305 по 30 г. до н. э. и около века держали и Иудею, лежавшую между двумя царствами и переходившую из рук в руки в их войнах."
    - "Видение идёт за этими войнами: «И усилится южный царь и один из князей его пересилит его и будет владычествовать»: Птолемей I и его бывший полководец Селевк I. «дочь южного царя придет к царю северному, чтобы установить правильные отношения между ними»: Береника, дочь Птолемея II, около 252 г. до н. э. вышла за Антиоха II и была убита. Её брат Птолемей III вторгся в Сирию и увёз богов и сокровища «в плен в Египет»; надпись в Адулисе хвалится возвращёнными святынями. Антиох III был разбит Птолемеем IV при Рафии в 217 г. до н. э., но при Панионе в 200 г. взял Иудею: «не устоят мышцы юга». Его дочь Клеопатра была отдана Птолемею V. Антиох IV Епифан дважды вторгался в Египет, в 170 и 168 гг. до н. э.; во второй раз, «в назначенное время», римляне повернули его назад у Александрии, и «последний поход не такой будет, как прежний». Возвращаясь, он обрушился на Иерусалим и Храм."
    - "После 39-го стиха видение и известная история расходятся: последняя война южного царя, в которой царь северный захватывает Египет и гибнет, не совпадает с тем, что известно об Антиохе, умершем в Персии в 164 г. до н. э. С тех пор читатели спорят, не смотрит ли глава дальше него. Большинство современных учёных датируют главу примерно 165 г. до н. э., временем Маккавейского кризиса; традиционный взгляд считает её пророчеством VI века. В любом случае царство южного царя — это Египет Александрии, последняя царица которого, Клеопатра VII, умерла в 30 г. до н. э., когда Египет стал римской провинцией."
  uk:
    - "Південь у Книзі Даниїла 11 — це царство, а не країна: «південний цар», який воює впродовж розділу з «північним царем». Від Ієроніма, що відповідав на цьому розділі язичницькому філософові Порфирію, читачі погодилися, що південь — це Єгипет за Птолемеїв, а північ — Сирія за Селевкідів, дві з грецьких династій, що поділили імперію Александра; Єгипет лежить на південь від Юди, і сам розділ називає Єгипет країною, куди південний цар забирає захоплених богів. Птолемеї правили з Александрії з 305 до 30 р. до н. е. і століття також володіли Юдеєю, яка лежала між двома царствами й переходила з рук у руки в їхніх війнах."
    - "Видіння простежує ці війни: «вбється в силу царь із полудня, та один із князїв того першого переможе його» — Птолемей I і його колишній полководець Селевк I. «дочка південного царя прийде до царя північнього, щоб їх поєднати»: Береніка, донька Птолемея II, близько 252 р. до н. е. вийшла за Антіоха II і була вбита. Її брат Птолемей III вторгся в Сирію і привіз богів та скарби «в Египет»; його напис з Адуліса вихваляється священними речами, привезеними додому. Антіоха III Птолемей IV розбив під Рафією 217 р. до н. е., але під Паніумом 200 року він узяв Юдею: «не вдержать рамена півдня». Його доньку Клеопатру віддали за Птолемея V. Антіох IV двічі вторгався до Єгипту — 170 і 168 р. до н. е.; удруге «в призначений час» римляни завернули його під Александрією, «але останнїй похід не буде такий, як переднїйший». Повертаючись, він напав на Єрусалим."
    - "Після 39-го вірша видіння і відома історія розходяться: остання війна південного царя, в якій північний цар поневолює Єгипет і помирає, не збігається з тим, що відомо про Антіоха, який помер у Персії 164 р. до н. е. Відтоді читачі розходяться в тому, чи розділ дивиться далі за нього. Більшість сучасних учених датують розділ близько 165 р. до н. е., часом макавейської кризи; традиційний погляд вважає його пророцтвом VI століття. У кожному разі царство півдня — це Єгипет Александрії, чия остання цариця Клеопатра VII померла 30 р. до н. е., коли Єгипет став римською провінцією."
  es:
    - "El Sur de Daniel 11 es un reino, no un país: el «rey del mediodía» que guerrea a lo largo del capítulo con el «rey del norte». Desde Jerónimo, que respondió al pagano Porfirio sobre este capítulo, los lectores han coincidido en que el sur es Egipto bajo los Ptolomeos y el norte es Siria bajo los seléucidas, dos de las dinastías griegas que se repartieron el imperio de Alejandro; Egipto queda al sur de Judá, y el propio capítulo nombra a Egipto como la tierra adonde el rey del mediodía lleva los dioses capturados. Los Ptolomeos gobernaron desde Alejandría del 305 al 30 a. C., y durante un siglo tuvieron también Judea, que estaba entre los dos reinos y cambió de manos en sus guerras."
    - "La visión sigue esas guerras: «haráse fuerte el rey del mediodía: mas uno de los príncipes de aquél le sobrepujará»: Ptolomeo I y su antiguo general Seleuco I. «la hija del rey del mediodía vendrá al rey del norte para hacer los conciertos»: Berenice, hija de Ptolomeo II, se casó con Antíoco II hacia 252 a. C. y fue asesinada. Su hermano Ptolomeo III invadió Siria y llevó dioses y tesoros «á Egipto»; su inscripción de Adulis se jacta de las cosas sagradas traídas a casa. Antíoco III fue derrotado por Ptolomeo IV en Rafia en 217 a. C., pero en Panion, en 200, tomó Judea: «los brazos del mediodía no podrán permanecer». Su hija Cleopatra fue dada a Ptolomeo V. Antíoco IV invadió Egipto dos veces, en 170 y 168 a. C.; la segunda vez, «al tiempo señalado», los romanos lo hicieron volver atrás en Alejandría, «mas no será la postrera venida como la primera». A su regreso, cayó sobre Jerusalén."
    - "Después del versículo 39 la visión y la historia conocida se separan: la última guerra del rey del mediodía, en la que el rey del norte invade Egipto y muere, no concuerda con lo que se sabe de Antíoco, que murió en Persia en 164 a. C. Desde entonces los lectores han discrepado sobre si el capítulo mira más allá de él. La mayoría de los estudiosos modernos fechan el capítulo hacia 165 a. C., durante la crisis macabea; la opinión tradicional lo tiene por una profecía del siglo VI a. C. En ambos casos el reino del sur es el Egipto de Alejandría, cuya última reina, Cleopatra VII, murió en 30 a. C., cuando Egipto se convirtió en provincia romana."
  pt:
    - "O Sul de Daniel 11 é um reino, não um país: o “rei do sul” que guerreia ao longo do capítulo com o “rei do norte”. Desde Jerônimo, que respondeu ao pagão Porfírio sobre este capítulo, os leitores concordam que o sul é o Egito sob os ptolomeus e o norte é a Síria sob os selêucidas, duas das dinastias gregas que dividiram o império de Alexandre; o Egito fica ao sul de Judá, e o próprio capítulo nomeia o Egito como a terra para onde o rei do sul leva deuses capturados. Os ptolomeus governaram de Alexandria de 305 a 30 a.C., e por um século também detiveram a Judeia, que ficava entre os dois reinos e mudava de mãos em suas guerras."
    - "A visão acompanha essas guerras: “O rei do sul será forte. Um de seus príncipes se tornará mais forte do que ele”: Ptolomeu I e seu antigo general Seleuco I. “a filha do rei do sul virá ao rei do norte para fazer um acordo”: Berenice, filha de Ptolomeu II, casou-se com Antíoco II por volta de 252 a.C. e foi assassinada. Seu irmão Ptolomeu III invadiu a Síria e levou deuses e tesouros “para o Egito”; sua inscrição de Adúlis se gaba das coisas sagradas trazidas para casa. Antíoco III foi vencido por Ptolomeu IV em Ráfia, em 217 a.C., mas em Pânio, em 200, tomou a Judeia: “as forças do sul não resistirão”. Sua filha Cleópatra foi dada a Ptolomeu V. Antíoco IV invadiu duas vezes o Egito, em 170 e 168 a.C.; na segunda, “no tempo determinado”, os romanos o fizeram recuar em Alexandria, “mas não será na última vez como foi na primeira”. Ao voltar, atacou Jerusalém."
    - "Depois do versículo 39, a visão e a história conhecida se separam: a última guerra do rei do sul, na qual o rei do norte invade o Egito e morre, não corresponde ao que se sabe de Antíoco, que morreu na Pérsia em 164 a.C. Desde então os leitores divergem sobre se o capítulo olha além dele. A maioria dos estudiosos modernos data o capítulo de cerca de 165 a.C., durante a crise dos macabeus; a visão tradicional o tem por profecia do século VI. Em ambos os casos, o reino do sul é o Egito de Alexandria, cuja última rainha, Cleópatra VII, morreu em 30 a.C., quando o Egito se tornou província romana."
  de:
    - "Der Süden in Daniel 11 ist ein Königreich, kein Land: der „König gegen Mittag“, der im ganzen Kapitel mit dem „König gegen Mitternacht“ Krieg führt. Seit Hieronymus, der in diesem Kapitel dem Heiden Porphyrios antwortete, sind sich die Leser einig, dass der Süden das Ägypten der Ptolemäer und der Norden das Syrien der Seleukiden ist, zweier der griechischen Dynastien, die Alexanders Reich unter sich teilten; Ägypten liegt südlich von Juda, und das Kapitel selbst nennt Ägypten als das Land, wohin der König des Südens erbeutete Götter fortführt. Die Ptolemäer herrschten von 305 bis 30 v. Chr. von Alexandria aus, und ein Jahrhundert lang hielten sie auch Judäa, das zwischen den beiden Königreichen lag und in ihren Kriegen mehrfach den Besitzer wechselte."
    - "Die Vision folgt ihnen: „Der König gegen Mittag … wird mächtig werden; aber gegen ihn wird einer auch mächtig sein“: Ptolemaios I. und sein General Seleukos I. „Die Tochter des Königs gegen Mittag wird kommen zum König gegen Mitternacht, Einigkeit zu machen“ – Berenike, Tochter Ptolemaios' II., heiratete um 252 v. Chr. Antiochos II. und wurde ermordet. Ihr Bruder Ptolemaios III. holte Götter und Schätze aus Syrien „nach Ägypten“; die Adulis-Inschrift rühmt heimgebrachte Heiligtümer. Antiochos III. unterlag 217 v. Chr. bei Raphia Ptolemaios IV., nahm aber 200 bei Paneion Judäa: „Die Mittagsheere werden's nicht können wehren“. Seine Tochter Kleopatra heiratete Ptolemaios V. Antiochos IV. fiel 170 und 168 v. Chr. in Ägypten ein; beim zweiten Mal wies Rom ihn „zu gelegener Zeit“ bei Alexandria ab, „es wird ihm zum andernmal nicht geraten wie zum erstenmal“. Heimkehrend überfiel er Jerusalem."
    - "Nach Vers 39 gehen Vision und bekannte Geschichte auseinander: Der letzte Krieg des Königs des Südens, in dem der König des Nordens Ägypten überrennt und stirbt, entspricht nicht dem, was von Antiochos bekannt ist, der 164 v. Chr. in Persien starb. Ob das Kapitel über ihn hinausblickt, ist seither unter den Lesern umstritten. Die meisten modernen Forscher datieren das Kapitel auf etwa 165 v. Chr., in die Krise der Makkabäerzeit; die traditionelle Ansicht hält es für eine Weissagung des sechsten Jahrhunderts. In beiden Fällen ist das Königreich des Südens das Ägypten von Alexandria, dessen letzte Königin, Kleopatra VII., 30 v. Chr. starb, als Ägypten römische Provinz wurde."
  fr:
    - "Le Midi de Daniel 11 est un royaume, non un pays : le « roi du midi » qui, tout au long du chapitre, fait la guerre au « roi du septentrion ». Depuis Jérôme, qui répondit au païen Porphyre sur ce chapitre, les lecteurs s’accordent à voir dans le midi l’Égypte des Ptolémées et dans le nord la Syrie des Séleucides, deux des dynasties grecques qui se partagèrent l’empire d’Alexandre ; l’Égypte est au sud de Juda, et le chapitre lui-même nomme l’Égypte comme le pays où le roi du midi emporte les dieux pris. Les Ptolémées régnèrent depuis Alexandrie de 305 à 30 av. J.-C. et tinrent aussi la Judée pendant un siècle ; située entre les deux royaumes, elle changea de mains au fil de leurs guerres."
    - "La vision les suit : « Le roi du midi deviendra fort. Mais un de ses chefs sera plus fort que lui » : Ptolémée Ier et son ex-général Séleucos Ier. « La fille du roi du midi viendra vers le roi du septentrion pour rétablir la concorde » : Bérénice, fille de Ptolémée II, épousa Antiochos II vers 252 av. J.-C. puis fut tuée. Son frère Ptolémée III envahit la Syrie et rapporta dieux et trésors « en Égypte », ce que vante l’inscription d’Adoulis. Antiochos III, battu à Raphia par Ptolémée IV en 217 av. J.-C., prit la Judée à Panion en 200 : « Les troupes du midi … ne résisteront pas ». Sa fille Cléopâtre épousa Ptolémée V. Antiochos IV envahit l’Égypte en 170 et 168 av. J.-C. ; la seconde fois, « à une époque fixée », les Romains le renvoyèrent d’Alexandrie : « mais cette dernière fois les choses ne se passeront pas comme précédemment ». Revenu, il fondit sur Jérusalem."
    - "Après le verset 39, la vision et l’histoire connue divergent : la dernière guerre du roi du midi, où le roi du nord submerge l’Égypte et meurt, ne correspond pas à ce que l’on sait d’Antiochos, mort en Perse en 164 av. J.-C. Les lecteurs se divisent depuis sur la question de savoir si le chapitre regarde au-delà de lui. La plupart des spécialistes modernes datent le chapitre d’environ 165 av. J.-C., pendant la crise des Maccabées ; la vue traditionnelle y voit une prophétie du VIe siècle. Dans les deux cas, le royaume du midi est l’Égypte d’Alexandrie, dont la dernière reine, Cléopâtre VII, mourut en 30 av. J.-C., quand l’Égypte devint province romaine."
  pl:
    - "Południe z Księgi Daniela 11 jest królestwem, nie krajem: „królem z południa”, który przez cały rozdział walczy z „królem północy”. Od Hieronima, który odpowiadał na ten rozdział poganinowi Porfiriuszowi, czytelnicy zgadzają się, że południe to Egipt pod Ptolemeuszami, a północ to Syria pod Seleucydami, dwie z greckich dynastii, które podzieliły imperium Aleksandra; Egipt leży na południe od Judy, a sam rozdział wymienia Egipt jako kraj, dokąd król południa uprowadza zdobyte bóstwa. Ptolemeusze władali z Aleksandrii w latach 305–30 p.n.e., a przez stulecie dzierżyli też Judeę, która leżała między oboma królestwami i przechodziła z rąk do rąk w ich wojnach."
    - "Widzenie opisuje wojny: „Tedy się zmocni król z południa i jeden z książąt jego; ten mocniejszy będzie nadeń” to Ptolemeusz I i dawny wódz Seleukos I. „Córka króla od południa pójdzie za króla północnego, aby uczyniła przymierze” to Berenika, córka Ptolemeusza II, wydana około 252 roku p.n.e. za Antiocha II i zamordowana. Jej brat Ptolemeusz III najechał Syrię i uprowadził bogów i skarby „do Egiptu”; napis z Adulis chlubi się zwiezionymi świętościami. Ptolemeusz IV pobił Antiocha III pod Rafią w 217 roku p.n.e., ale pod Panion w 200 roku ten zajął Judeę: „ramiona południowe nie oprą się”. Jego córkę Kleopatrę wydano za Ptolemeusza V. Antioch IV najechał Egipt w 170 i 168 roku p.n.e.; za drugim razem, „czasu zamierzonego”, Rzymianie zawrócili go pod Aleksandrią, „ale mu się nie tak powiedzie, jako za pierwszym i za ostatnim razem”. Wracając, uderzył na Jerozolimę."
    - "Po wersecie 39 widzenie i znana historia się rozchodzą: ostatnia wojna króla południa, w której król północy zalewa Egipt i umiera, nie zgadza się z tym, co wiadomo o Antiochu, który zmarł w Persji w 164 roku p.n.e. Czytelnicy od tamtej pory spierają się, czy rozdział spogląda poza niego. Większość współczesnych badaczy datuje rozdział na około 165 rok p.n.e., czas kryzysu machabejskiego; pogląd tradycyjny uważa go za proroctwo z VI wieku. W obu przypadkach królestwo południa to Egipt aleksandryjski, którego ostatnia królowa, Kleopatra VII, zmarła w 30 roku p.n.e., gdy Egipt stał się prowincją rzymską."
  it:
    - "Il Mezzogiorno di Daniele 11 è un regno, non un paese: il «re del mezzogiorno» che nel capitolo fa guerra al «re del settentrione». Da Girolamo, che rispose a Porfirio su questo capitolo, i lettori concordano nel ritenere che il mezzogiorno sia l’Egitto dei Tolomei e il settentrione la Siria dei Seleucidi, due delle dinastie greche che si spartirono l’impero di Alessandro; l’Egitto sta a sud della Giudea, e il capitolo stesso nomina l’Egitto come la terra dove il re del mezzogiorno porta gli dèi catturati. I Tolomei regnarono da Alessandria dal 305 al 30 a.C., e per un secolo tennero anche la Giudea, che stava tra i due regni e passava di mano nelle loro guerre."
    - "La visione segue quelle guerre: «Il re del mezzogiorno diventerà forte; ma uno dei suoi capi diventerà più forti di lui»: Tolomeo I e l’ex generale Seleuco I. «La figliuola del re del mezzogiorno verrà al re del settentrione per fare un accordo»: Berenice, figlia di Tolomeo II, sposò Antioco II verso il 252 a.C. e fu uccisa. Suo fratello Tolomeo III invase la Siria e portò dèi e tesori «in Egitto»; l’iscrizione di Adulis vanta le cose sacre riportate in patria. Antioco III fu battuto da Tolomeo IV a Rafia nel 217 a.C., ma a Panion nel 200 prese la Giudea: «né le forze del mezzogiorno … avran la forza di resistere». Sua figlia Cleopatra sposò Tolomeo V. Antioco IV invase l’Egitto nel 170 e nel 168 a.C.; la seconda volta, «al tempo stabilito», i Romani lo respinsero ad Alessandria, «ma quest’ultima volta la cosa non riuscirà come la prima». Tornando, assalì Gerusalemme."
    - "Dopo il versetto 39 la visione e la storia nota si separano: l’ultima guerra del re del mezzogiorno, in cui il re del settentrione invade l’Egitto e muore, non corrisponde a quanto si sa di Antioco, morto in Persia nel 164 a.C. Da allora i lettori discutono se il capitolo guardi oltre di lui. La maggior parte degli studiosi moderni data il capitolo al 165 a.C. circa, durante la crisi dei Maccabei; la tradizione lo ritiene una profezia del VI secolo. In entrambi i casi il regno del mezzogiorno è l’Egitto di Alessandria, la cui ultima regina, Cleopatra VII, morì nel 30 a.C., quando l’Egitto divenne provincia romana."
  nl:
    - "Het Zuiden van Daniël 11 is een koninkrijk, geen land: de “koning van het Zuiden” die in het hele hoofdstuk oorlog voert met de “koning van het Noorden”. Sinds Hieronymus, die op dit hoofdstuk de heidense Porfyrius antwoordde, zijn lezers het erover eens dat het zuiden Egypte onder de Ptolemaeën is en het noorden Syrië onder de Seleuciden, twee van de Griekse dynastieën die het rijk van Alexander verdeelden; Egypte ligt ten zuiden van Juda, en het hoofdstuk zelf noemt Egypte als het land waarheen de koning van het zuiden veroverde goden meevoert. De Ptolemaeën regeerden van 305 tot 30 v.Chr. vanuit Alexandrië, en een eeuw lang hielden zij ook Judea in handen, dat tussen de twee koninkrijken lag en in hun oorlogen van hand wisselde."
    - "Het visioen: “De koning van het Zuiden, die een van zijn vorsten is, zal sterk worden; doch een ander zal sterker worden dan hij” (Ptolemaeus I en generaal Seleucus I); “de dochter des konings van het Zuiden zal komen tot de koning van het Noorden, om billijke voorwaarden te maken” (Berenice, dochter van Ptolemaeus II, trouwde ca. 252 v.Chr. met Antiochus II en werd vermoord). Haar broer Ptolemaeus III viel Syrië binnen en voerde goden en schatten “naar Egypte” (Adulis-opschrift). Antiochus III verloor in 217 v.Chr. bij Raphia van Ptolemaeus IV, maar nam in 200 bij Panium Judea in: “de armen van het Zuiden zullen niet bestaan”. Zijn dochter Cleopatra trouwde met Ptolemaeus V. Antiochus IV viel in 170 en 168 v.Chr. Egypte binnen; de tweede keer, “ter bestemder tijd”, stuurden de Romeinen hem bij Alexandrië terug, “doch het zal niet zijn gelijk de eerste”. Daarna viel hij Jeruzalem aan."
    - "Na vers 39 gaan het visioen en de bekende geschiedenis uiteen: de laatste oorlog van de koning van het zuiden, waarin de koning van het noorden Egypte overspoelt en sterft, komt niet overeen met wat van Antiochus bekend is, die in 164 v.Chr. in Perzië stierf. Lezers verschillen sindsdien van mening over de vraag of het hoofdstuk verder kijkt dan hij. De meeste moderne geleerden dateren het hoofdstuk omstreeks 165 v.Chr., tijdens de Makkabeese crisis; de traditionele opvatting houdt het voor een profetie uit de 6e eeuw v.Chr. In beide gevallen is het koninkrijk van het zuiden het Egypte van Alexandrië, waarvan de laatste koningin, Cleopatra VII, in 30 v.Chr. stierf, toen Egypte een Romeinse provincie werd."
  cs:
    - "Jih z Daniele 11 je království, a ne země: „král polední“, který se touto kapitolou potýká s „králem půlnočním“. Od Jeronýma, který na této kapitole odpovídal pohanu Porfyriovi, se vykladači shodují, že jihem je Egypt za Ptolemaiovců a severem Sýrie za Seleukovců, dvě z řeckých dynastií, které si rozdělily Alexandrovu říši; Egypt leží jižně od Judy a sama kapitola jmenuje Egypt jako zemi, kam král polední odváží zajaté bohy. Ptolemaiovci vládli z Alexandrie od roku 305 do 30 př. n. l. a po století drželi i Judsko, které leželo mezi oběma královstvími a v jejich válkách přecházelo z rukou do rukou."
    - "Vidění sleduje tyto války: „posilní se král polední, ano i jedno z knížat jeho, a mocnější bude nad něho“: Ptolemaios I. a jeho bývalý generál Seleukos I. „dcera krále poledního dostane se za krále půlnočního, aby učinila příměří“: Berenika, dcera Ptolemaia II., se kolem roku 252 př. n. l. provdala za Antiocha II. a byla zavražděna. Její bratr Ptolemaios III. vpadl do Sýrie a odvezl bohy a poklady „do Egypta“; jeho nápis z Adulis se chlubí svatými předměty přivezenými domů. Antiochos III. byl poražen Ptolemaiem IV. u Rafie roku 217 př. n. l., ale u Panionu roku 200 dobyl Judsko: „ramena poledního neostojí“. Jeho dcera Kleopatra byla provdána za Ptolemaia V. Antiochos IV. dvakrát vpadl do Egypta, roku 170 a 168 př. n. l.; podruhé jej „v uložený čas“ Římané zahnali u Alexandrie, „ale to nebude podobné prvnímu“. Na zpáteční cestě se obořil na Jeruzalém."
    - "Po verši 39 se vidění a známé dějiny rozcházejí: poslední válka krále poledního, v níž král půlnoční přepadne Egypt a umírá, neodpovídá tomu, co je známo o Antiochovi, který zemřel v Persii roku 164 př. n. l. Vykladači se od té doby rozcházejí v tom, zda kapitola hledí za něj. Většina moderních učenců datuje kapitolu kolem roku 165 př. n. l., do doby makabejské krize; tradiční názor ji pokládá za proroctví ze 6. stol. př. n. l. V obou případech je královstvím jihu Egypt Alexandrie, jehož poslední královna Kleopatra VII. zemřela roku 30 př. n. l., kdy se Egypt stal římskou provincií."
  sv:
    - "Söderlandet i Daniel 11 är ett rike, inte ett land: ”konungen i Söderlandet” som genom hela kapitlet för krig med ”konungen i Nordlandet”. Sedan Hieronymus, som besvarade hedningen Porfyrios om detta kapitel, har läsare varit eniga om att söder är Egypten under ptolemeerna och norr är Syrien under seleukiderna, två av de grekiska dynastier som delade Alexanders rike; Egypten ligger söder om Juda, och kapitlet själv nämner Egypten som det land dit ”konungen i Söderlandet” för bortförda gudar. Ptolemeerna regerade från Alexandria från 305 till 30 f.Kr., och under ett sekel höll de också Judeen, som låg mellan de två rikena och bytte herre i deras krig."
    - "Synen följer dessa krig: ”konungen i Söderlandet skall bliva mäktig … ja, denne skall bliva en ännu mäktigare … än han själv”: Ptolemaios I och hans förre general Seleukos I. ”Söderlandskonungens dotter skall draga till konungen i Nordlandet för att komma åstad förlikning”: Berenike, Ptolemaios II:s dotter, gifte sig omkring 252 f.Kr. med Antiochos II och mördades. Brodern Ptolemaios III invaderade Syrien och förde gudar och skatter ”till Egypten”; Adulisinskriften skryter med hemförda heliga föremål. Antiochos III slogs av Ptolemaios IV vid Rafia 217 f.Kr., men intog Judeen vid Panion 200: ”Söderlandets makt skall icke kunna hålla stånd”. Dottern Kleopatra gavs åt Ptolemaios V. Antiochos IV angrep Egypten 170 och 168 f.Kr.; andra gången, ”på bestämd tid”, vände romarna honom vid Alexandria, ”men denna senare gång skall det ej gå såsom den förra”. På hemvägen föll han över Jerusalem."
    - "Efter vers 39 skiljs synen och den kända historien åt: Söderlandskonungens sista krig, där konungen i Nordlandet översvämmar Egypten och dör, stämmer inte med vad som är känt om Antiochos, som dog i Persien 164 f.Kr. Läsare har sedan dess varit oeniga om huruvida kapitlet ser bortom honom. De flesta moderna forskare daterar kapitlet till omkring 165 f.Kr., under den makkabeiska krisen; den traditionella uppfattningen håller det för en profetia från 500-talet f.Kr. I båda fallen är Söderlandets rike det Egypten som styrdes från Alexandria, vars sista drottning, Kleopatra VII, dog 30 f.Kr., då Egypten blev en romersk provins."
  nb:
    - "Sør i Daniel 11 er et kongerike, ikke et land: «Sydens konge», som fører krig gjennom kapitlet med «Nordens konge». Siden Hieronymus, som svarte hedningen Porfyrios om dette kapitlet, har leserne vært enige om at sør er Egypt under ptolemeerne og nord er Syria under seleukidene, to av de greske dynastiene som delte Aleksanders rike; Egypt ligger sør for Juda, og kapitlet selv nevner Egypt som landet der Sydens konge fører bort erobrede guder. Ptolemeerne regjerte fra Aleksandria fra 305 til 30 f.Kr., og i et århundre hadde de også Judea, som lå mellom de to rikene og skiftet hender i krigene deres."
    - "Synet følger krigene: «Sydens konge skal bli mektig, og en av hans fyrster skal bli mektigere enn han»: Ptolemaios I og hans tidligere general Seleukos I. «En datter av Sydens konge skal komme til Nordens konge for å skape vennskap mellem dem»: Berenike, datter av Ptolemaios II, giftet seg med Antiokhos II omkring 252 f.Kr. og ble myrdet. Broren Ptolemaios III invaderte Syria og førte guder og skatter «til Egypten»; hans Adulis-innskrift praler av hellige ting brakt hjem. Antiokhos III ble slått av Ptolemaios IV ved Rafia (217 f.Kr.), men tok Judea ved Panion i 200: «Sydens makt skal ikke kunne holde stand». Datteren Kleopatra ble gitt til Ptolemaios V. Antiokhos IV invaderte Egypt i 170 og 168 f.Kr.; andre gang, «til fastsatt tid», snudde romerne ham ved Aleksandria, «men den siste gang skal det ikke gå som første gang». På hjemveien falt han over Jerusalem."
    - "Etter vers 39 skilles synet og den kjente historien: den siste krigen til Sydens konge, der Nordens konge legger Egypt under seg og dør, stemmer ikke med det som er kjent om Antiokhos, som døde i Persia i 164 f.Kr. Lesere har siden vært uenige om hvorvidt kapitlet ser forbi ham. De fleste moderne forskere daterer kapitlet til omkring 165 f.Kr., under makkabeerkrisen; den tradisjonelle oppfatningen holder det for en profeti fra 500-tallet. I begge tilfeller er riket i sør Egypt med Aleksandria som hovedstad, hvis siste dronning, Kleopatra VII, døde i 30 f.Kr., da Egypt ble en romersk provins."
  tl:
    - "Ang Timugan ng Daniel 11 ay isang kaharian, hindi isang bansa: ang “hari sa timugan” na nakikidigma sa buong kabanata laban sa “hari sa hilagaan”. Mula kay Jeronimo, na sumagot sa paganong si Porphyry tungkol sa kabanatang ito, sumasang-ayon ang mga mambabasa na ang timugan ay ang Egipto sa ilalim ng mga Ptolemeo at ang hilagaan ay ang Siria sa ilalim ng mga Seleucida, dalawa sa mga dinastiyang Griego na naghati sa imperyo ni Alejandro; ang Egipto ay nasa timog ng Juda, at ang kabanata mismo ang nagpapangalan sa Egipto bilang lupain kung saan dinadala ng hari sa timugan ang nabihag na mga diyos. Naghari ang mga Ptolemeo mula sa Alejandria mula 305 hanggang 30 BK, at sa loob ng isang siglo ay hawak din nila ang Judea, na nasa pagitan ng dalawang kaharian at nagpapalit ng kamay sa kanilang mga digmaan."
    - "Sinusundan nito ang mga digmaan: “Ang hari sa timugan ay magiging malakas …” (Ptolemeo I, at ang dati niyang heneral na si Seleucus I, na mas malakas pa). “Ang anak na babae ng hari sa timugan ay paroroon sa hari sa hilagaan …” (Berenice, anak ni Ptolemeo II, kasal kay Antiochus II mga 252 BK, pinaslang). Sinalakay ng kapatid niyang si Ptolemeo III ang Siria, nagdala ng diyos at yaman “sa Egipto”, na ipinagyayabang ng inskripsiyon sa Adulis. Natalo si Antiochus III ni Ptolemeo IV sa Raphia (217 BK), ngunit nakuha niya ang Judea sa Panium (200): “ang pulutong ng timugan ay hindi makatatayo”. Ibinigay niya kay Ptolemeo V ang anak niyang si Cleopatra. Sinalakay ni Antiochus IV ang Egipto noong 170 at 168 BK; sa ikalawa, “sa takdang panahon”, pinabalik siya ng mga Romano sa Alejandria, “nguni't hindi magiging gaya ng una ang huli”. Pagbalik, nilusob niya ang Jerusalem."
    - "Pagkatapos ng talatang 39, naghihiwalay ang pangitain at ang kilalang kasaysayan: ang huling digmaan ng hari sa timugan, kung saan sinasakop ng hari sa hilagaan ang Egipto at namatay, ay hindi tumutugma sa nalalaman tungkol kay Antiochus, na namatay sa Persia noong 164 BK. Magmula noon, hindi nagkakasundo ang mga mambabasa kung ang kabanata ay tumitingin sa kabila niya. Karamihan ng makabagong iskolar ay nagpepetsa sa kabanata sa mga 165 BK, sa panahon ng krisis ng mga Macabeo; ang tradisyonal na pananaw ay itinuturing itong hula ng ikaanim na siglo. Sa alinmang kaso, ang kaharian sa timugan ay ang Egipto ng Alejandria, na ang huling reina, si Cleopatra VII, ay namatay noong 30 BK, nang ang Egipto ay naging lalawigang Romano."
  da:
    - "Sydens Rige i Daniel 11 er et kongerige, ikke et land: »Kongen af Sønden«, der fører krig gennem kapitlet med »Kongen af Norden«. Siden Hieronymus, der besvarede hedningen Porfyr om dette kapitel, har læserne været enige om, at syd er Egypten under ptolemæerne, og at nord er Syrien under seleukiderne, to af de græske dynastier, der delte Alexanders rige; Egypten ligger syd for Juda, og kapitlet nævner selv Egypten som det land, hvortil Sydens konge fører erobrede guder. Ptolemæerne herskede fra Alexandria fra 305 til 30 f.Kr., og i et århundrede holdt de også Judæa, der lå mellem de to riger og skiftede hænder i deres krige."
    - "Synet følger dem: Kongen af Sønden »skal vorde mægtig … en af hans Fyrster … skal blive mægtigere end han«: Ptolemaios 1. og hans gamle general Seleukos 1. »Kongen af Søndens Datter skal drage ind til Kongen af Norden for at bringe et redeligt Forhold til Veje«: Berenike, Ptolemaios 2.s datter, blev ca. 252 f.Kr. gift med Antiochos 2. og myrdet. Hendes bror Ptolemaios 3. angreb Syrien og førte guder og skatte »til Ægypten«; Adulis-indskriften praler af hjembragte hellige ting. Antiochos 3. tabte til Ptolemaios 4. ved Rafia i 217 f.Kr., men tog Judæa ved Panion i 200: »Søndens Arme skulle ikke kunne holde ud«. Hans datter Kleopatra blev gift med Ptolemaios 5. Antiochos 4. angreb Egypten i 170 og 168 f.Kr.; anden gang, »paa den bestemte Tid«, vendte romerne ham om ved Alexandria, »men det skal ikke gaa den sidste Gang som den første«. Hjemvendt overfaldt han Jerusalem."
    - "Efter vers 39 skilles synet og den kendte historie: Sydens konges sidste krig, hvor Nordens konge overløber Egypten og dør, svarer ikke til det, der vides om Antiochos, som døde i Persien i 164 f.Kr. Læserne har lige siden været uenige om, hvorvidt kapitlet ser ud over ham. De fleste moderne forskere dater kapitlet til omkring 165 f.Kr., under den makkabæiske krise; den traditionelle opfattelse holder det for en profeti fra 500-tallet f.Kr. Under alle omstændigheder er Sydens rige Egypten med Alexandria, hvis sidste dronning, Kleopatra 7., døde i 30 f.Kr., da Egypten blev en romersk provins."
  sr:
    - "Југ из Књиге пророка Данила 11 јесте краљевство, а не земља: „цар јужни“ који се кроз главу рати са „царем северним“. Од Јеронима, који је на ову главу одговарао незнабошцу Порфирију, читаоци су сагласни да је југ Египат под Птолемејцима, а север Сирија под Селеукидима, двема од грчких династија које су поделиле Александрово царство; Египат лежи јужно од Јуде, а сама глава именује Египат као земљу у коју цар јужни односи заробљене богове. Птолемејци су владали из Александрије од 305. до 30. п. н. е. и читав један век држали су и Јудеју, која је лежала између два краљевства и мењала господаре у њиховим ратовима."
    - "Виђење прати те ратове: „цар јужни осилиће, и један од кнезова његових, и биће силнији од њега“: Птолемеј I и његов некадашњи војсковођа Селеук I. „кћи јужног цара доћи ће к цару северном да учини погодбу“: Береника, кћи Птолемеја II, удала се за Антиоха II око 252. п. н. е. и била убијена. Њен брат Птолемеј III напао је Сирију и однео богове и благо „у Мисир“; његов Адулски натпис хвали се светим стварима донетим кући. Антиоха III победио је Птолемеј IV код Рафије 217. п. н. е., али је Антиох код Паниона 200. заузео Јудеју: „мишице јужног цара неће одолети“. Његова кћи Клеопатра дата је Птолемеју V. Антиох IV два пута је напао Египат, 170. и 168. п. н. е.; други пут, „у одређено време“, Римљани су га вратили код Александрије, „али други пут неће бити као први пут“. Враћајући се, напао је Јерусалим."
    - "После 39. стиха виђење и позната историја се раздвајају: последњи рат цара јужног, у којем цар северни преплави Египат и умре, не одговара ономе што се зна о Антиоху, који је умро у Персији 164. п. н. е. Читаоци се од тада разилазе око тога да ли глава гледа даље од њега. Већина савремених научника датира главу око 165. п. н. е., у доба макавејске кризе; традиционално гледиште држи да је то пророчанство из 6. века. У оба случаја краљевство југа јесте Египат Александрије, чија је последња царица, Клеопатра VII, умрла 30. п. н. е., када је Египат постао римска провинција."
  hu:
    - "A Dániel 11. fejezetének Dél birodalma királyság, nem ország: a „déli király”, aki a fejezetben végig háborúzik az „északi királylyal”. Jeromos óta, aki a fejezetről a pogány Porphüriosznak válaszolt, az olvasók egyetértenek abban, hogy a dél a Ptolemaiosz-dinasztia alatti Egyiptom, az észak pedig a Szeleukidák alatti Szíria, a Nagy Sándor birodalmát felosztó két görög dinasztia; Egyiptom Júdától délre fekszik, és maga a fejezet Egyiptomot nevezi meg annak a földnek, ahová a déli király elhurcolja a zsákmányolt isteneket. A Ptolemaioszok Alexandriából uralkodtak Kr. e. 305-től 30-ig, és egy évszázadig Júdeát is birtokolták, amely a két királyság között feküdt, és háborúik során gazdát cserélt."
    - "Ezt követi a látomás: „elhatalmasodik a déli király, de az ő vezérei közül is egyik, és ez hatalmat vesz rajta”: I. Ptolemaiosz és volt hadvezére, I. Szeleukosz. „a déli király leánya az északi királyhoz megy, hogy békéltessen”: Bereniké, II. Ptolemaiosz lánya, Kr. e. 252 körül hozzáment II. Antiokhoszhoz, majd megölték. Fivére, III. Ptolemaiosz megszállta Szíriát, és isteneket, kincseket vitt „Égyiptomba”; adulisi felirata a hazahozott szent tárgyakkal kérkedik. III. Antiokhoszt IV. Ptolemaiosz Kr. e. 217-ben Rafiánál legyőzte, de Kr. e. 200-ban Panionnál elfoglalta Júdeát: „délnek seregei meg nem állnak”. Lánya, Kleopátra V. Ptolemaioszé lett. IV. Antiokhosz kétszer támadta meg Egyiptomot, Kr. e. 170-ben és 168-ban; másodszor „Bizonyos időben” a rómaiak Alexandriánál visszafordították, „de nem lesz utolszor úgy, mint először volt”. Visszatérve Jeruzsálemre rontott."
    - "A 39. vers után a látomás és az ismert történelem elválik: a déli király utolsó háborúja, amelyben az északi király elárasztja Egyiptomot és meghal, nem egyezik azzal, amit Antiokhoszról tudunk, aki Kr. e. 164-ben Perzsiában halt meg. Az olvasók azóta is vitatkoznak azon, hogy a fejezet túlmutat-e rajta. A legtöbb modern tudós a fejezetet Kr. e. 165 körülre keltezi, a makkabeusi válság idejére; a hagyományos nézet szerint a 6. századi jövendölés. Mindkét esetben a déli királyság az alexandriai Egyiptom, amelynek utolsó királynője, VII. Kleopátra Kr. e. 30-ban halt meg, amikor Egyiptom római provincia lett."
  fi:
    - "Danielin 11. luvun Etelä on kuningaskunta eikä maa: ”Etelän kuningas”, jonka kanssa ”Pohjan kuningas” käy sotaa läpi koko luvun. Hieronymuksesta lähtien, joka vastasi pakanalliselle Porfyriokselle tästä luvusta, lukijat ovat olleet yhtä mieltä siitä, että etelä on Ptolemaiosten Egypti ja pohjoinen seleukidien Syyria, kaksi Aleksandroksen valtakunnan jakaneista kreikkalaisista dynastioista; Egypti sijaitsee Juudan eteläpuolella, ja luku itse mainitsee Egyptin maaksi, johon Etelän kuningas vie otetut jumalat. Ptolemaiokset hallitsivat Aleksandriasta vuodesta 305 vuoteen 30 eaa., ja vuosisadan ajan he hallitsivat myös Juudeaa, joka sijaitsi kahden kuningaskunnan välissä ja vaihtoi omistajaa niiden sodissa."
    - "Näky seuraa: ”Etelän kuningas on voimistuva sekä yksi hänen ruhtinaistaan; tämä on voimistuva vielä enemmän kuin hän”: Ptolemaios I ja entinen kenraali Seleukos I. ”Etelän kuninkaan tytär menee Pohjan kuninkaan tykö saadakseen aikaan sopimuksen”: Berenike, Ptolemaios II:n tytär, meni noin 252 eaa. Antiokhos II:lle vaimoksi ja murhattiin. Hänen veljensä Ptolemaios III hyökkäsi Syyriaan ja vei jumalia ja aarteita ”Egyptiin”; Adulis-kirjoitus kerskuu tuoduista pyhistä esineistä. Antiokhos III hävisi Ptolemaios IV:lle Rafiassa 217 eaa., mutta valtasi Juudean Panionissa 200: ”Eivät kestä Etelän käsivarret”. Hänen tyttärensä Kleopatra naitettiin Ptolemaios V:lle. Antiokhos IV hyökkäsi Egyptiin 170 ja 168 eaa.; toisella kerralla, ”määräaikana”, roomalaiset käänsivät hänet pois Aleksandriassa, ja ”… ei käy niinkuin ensimmäisellä”. Palatessaan hän hyökkäsi Jerusalemiin."
    - "Jakeen 39 jälkeen näky ja tunnettu historia eroavat toisistaan: Etelän kuninkaan viimeinen sota, jossa Pohjan kuningas valtaa Egyptin ja kuolee, ei vastaa sitä, mitä Antiokhoksesta tiedetään; hän kuoli Persiassa vuonna 164 eaa. Lukijat ovat siitä lähtien olleet eri mieltä siitä, katsooko luku hänen yli. Useimmat nykytutkijat ajoittavat luvun noin vuoteen 165 eaa., makkabealaisten kriisin aikaan; perinteisen käsityksen mukaan se on 500-luvun eaa. ennustus. Kummassakin tapauksessa etelän kuningaskunta on Aleksandrian Egypti, jonka viimeinen kuningatar Kleopatra VII kuoli vuonna 30 eaa., kun Egyptistä tuli Rooman provinssi."
  vi:
    - "Nam Phương trong Đa-ni-ên 11 là một vương quốc, không phải một xứ: “vua phương nam” giao chiến suốt chương với “vua phương bắc”. Từ Hieronymus, người đã đáp lại Porphyry ngoại giáo về chương này, các độc giả đều đồng ý rằng phương nam là Ê-díp-tô dưới các vua Ptolemy và phương bắc là Sy-ri dưới nhà Seleucus, hai triều đại Hy Lạp đã chia nhau đế quốc của A-léc-xan-đơ; Ê-díp-tô nằm ở phía nam Giu-đa, và chính chương này nêu Ê-díp-tô là xứ nơi vua phương nam đem các thần bị bắt về. Các vua Ptolemy cai trị từ A-léc-xan-tri từ năm 305 đến 30 TCN, và trong một thế kỷ họ cũng giữ Giu-đê, xứ nằm giữa hai vương quốc và đổi chủ trong các cuộc chiến của họ."
    - "Khải tượng theo sát các cuộc chiến ấy: “Vua phương nam sẽ được mạnh; nhưng một trong các tướng của vua sẽ được mạnh hơn vua”: Ptolemy I và vị tướng cũ Seleucus I. “công chúa vua phương nam đến cùng vua phương bắc để kết hòa hảo”: Berenice, con gái Ptolemy II, kết hôn với Antiochus II khoảng năm 252 TCN và bị giết. Anh bà là Ptolemy III xâm lăng Sy-ri và đem các thần cùng của cải “sang nước Ê-díp-tô”; bia Adulis của ông khoe những vật thiêng đem về. Antiochus III bị Ptolemy IV đánh bại tại Raphia năm 217 TCN, nhưng tại Panium năm 200 ông chiếm Giu-đê: “quân phương nam … cũng không thể đứng vững được”. Con gái ông là Cleopatra được gả cho Ptolemy V. Antiochus IV hai lần xâm lăng Ê-díp-tô, năm 170 và 168 TCN; lần thứ hai, “đến kỳ đã định”, người La Mã đẩy ông lui tại A-léc-xan-tri, “nhưng lần sau không giống như lần trước”. Trên đường về ông đánh Giê-ru-sa-lem."
    - "Sau câu 39, khải tượng và lịch sử đã biết tách nhau: cuộc chiến cuối cùng của vua phương nam, trong đó vua phương bắc tràn qua Ê-díp-tô rồi chết, không khớp với những gì biết về Antiochus, người chết ở Phe-rơ-sơ năm 164 TCN. Từ đó các độc giả bất đồng về việc chương này có nhìn vượt qua ông hay không. Đa số học giả hiện đại định niên đại chương này vào khoảng năm 165 TCN, trong cuộc khủng hoảng thời Maccabee; quan điểm truyền thống cho đó là lời tiên tri của thế kỷ 6. Dù thế nào, vương quốc phương nam là Ê-díp-tô của A-léc-xan-tri, nơi nữ hoàng cuối cùng là Cleopatra VII qua đời năm 30 TCN, khi Ê-díp-tô trở thành một tỉnh La Mã."
  ro:
    - "Miazăzi din Daniel 11 este un regat, nu o țară: „împăratul austrului”, care poartă războaie de-a lungul capitolului cu „împăratul miezului nopței”. Încă de la Ieronim, care i-a răspuns păgânului Porfir în privința acestui capitol, cititorii au căzut de acord că miazăzi este Egiptul sub Ptolemei, iar miazănoapte este Siria sub Seleucizi, două dintre dinastiile grecești care au împărțit imperiul lui Alexandru; Egiptul se află la sud de Iuda, iar capitolul însuși numește Egiptul drept țara unde împăratul austrului duce zeii capturați. Ptolemeii au domnit de la Alexandria din 305 până în 30 î.Hr., iar timp de un secol au stăpânit și Iudeea, aflată între cele două regate și trecută din mână în mână în războaiele lor."
    - "Viziunea urmează aceste războaie: „se va întărì împăratul austrului, și unul din boerii lui se va întărì asupra lui” (Ptolemeu I și generalul său Seleucos I); „fata împăratului austrului va intrà la împăratul miezului nopței, ca să facă tocmele cu el” (Berenice, fiica lui Ptolemeu al II-lea, măritată pe la 252 î.Hr. cu Antioh al II-lea și ucisă). Fratele ei Ptolemeu al III-lea a invadat Siria, ducând zei și comori „la Eghipet”; inscripția lui de la Adulis se laudă cu obiectele sfinte aduse acasă. Antioh al III-lea, învins de Ptolemeu al IV-lea la Rafia (217 î.Hr.), a luat Iudeea la Panion (200): „brațele împăratului austrului nu vor stà”. Fiica lui, Cleopatra, a fost dată lui Ptolemeu al V-lea. Antioh al IV-lea a invadat Egiptul de două ori, în 170 și 168 î.Hr.; a doua oară romanii l-au oprit la Alexandria: „La vreme … nu va fì ca cea dintâiu și ca cea de apoi”. Apoi a lovit Ierusalimul."
    - "După versetul 39, viziunea și istoria cunoscută se despart: ultimul război al împăratului austrului, în care împăratul miezului nopței invadează Egiptul și moare, nu se potrivește cu ce se știe despre Antioh, care a murit în Persia în 164 î.Hr. De atunci, cititorii au fost de păreri diferite dacă capitolul privește dincolo de el. Cei mai mulți cercetători moderni datează capitolul pe la 165 î.Hr., în timpul crizei macabeene; punctul de vedere tradițional îl socotește o profeție din secolul al VI-lea. În ambele cazuri, regatul de la miazăzi este Egiptul din Alexandria, a cărui ultimă regină, Cleopatra a VII-a, a murit în 30 î.Hr., când Egiptul a devenit provincie romană."
  bg:
    - "Югът в Дан. 11 е царство, а не страна: „царят на юг“, който през цялата глава воюва със „северния цар“. Още от Йероним, който отговаря на езичника Порфирий за тази глава, читателите са съгласни, че югът е Египет при Птолемеите, а северът — Сирия при Селевкидите, две от гръцките династии, разделили империята на Александър; Египет лежи на юг от Юда, а самата глава назовава Египет като земята, в която южният цар отнася пленени богове. Птолемеите управлявали от Александрия от 305 до 30 г. пр.н.е. и цял век владеели и Юдея, която лежала между двете царства и минавала от ръка на ръка в техните войни."
    - "Видението следва тези войни: „царят на юг ще се укрепи … и ще се укрепи повече от него“ — Птолемей I и бившият му пълководец Селевк I. „Дъщерята на южния цар ще дойде при северния цар за да направи съгласие“: Береника, дъщеря на Птолемей II, се омъжила за Антиох II около 252 г. пр.н.е. и била убита. Брат ѝ Птолемей III нахлул в Сирия и отнесъл богове и съкровища „в Египет“; надписът му от Адулис се хвали с върнатите свещени предмети. Антиох III бил разбит от Птолемей IV при Рафия през 217 г. пр.н.е., но при Панион през 200 г. завзел Юдея: „мишците на юг не ще противостанат“. Дъщеря му Клеопатра била дадена на Птолемей V. Антиох IV два пъти нахлувал в Египет, през 170 и 168 г. пр.н.е.; втория път, „в определеното време“, римляните го върнали при Александрия и не станало като първия път. На връщане той се нахвърлил върху Йерусалим."
    - "След стих 39 видението и известната история се разделят: последната война на южния цар, в която северният цар завладява Египет и умира, не отговаря на известното за Антиох, който умрял в Персия през 164 г. пр.н.е. Оттогава читателите спорят дали главата не гледа отвъд него. Повечето съвременни учени датират главата около 165 г. пр.н.е., по време на Макавейската криза; традиционното схващане я смята за пророчество от VI в. И в двата случая царството на юга е Египет на Александрия, чиято последна царица, Клеопатра VII, умряла през 30 г. пр.н.е., когато Египет станал римска провинция."
