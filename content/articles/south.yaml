# Overview article (ADR 0007). Mainstream facts only; the "king of the south" of Daniel 11 is read, as nearly all commentators read it, as the Ptolemaic kingdom; the date of the chapter is given as debated.
id: south
place: a1c0469
title:
  en: "South"
  ru: "Царство южного царя"
