body:
  en:
    - "Dophkah is a station of the wilderness journey known only from the itinerary in Numbers: Israel “took their journey out of the wilderness of Sin, and encamped in Dophkah”, and “departed from Dophkah, and encamped in Alush”, from which they went on to Rephidim. Exodus, telling the same stretch of the journey, passes straight from the wilderness of Sin to Rephidim and does not name it. Nothing else is said of the place."
    - "Where it lay depends on where one puts Mount Sinai. On the traditional route to Jebel Musa in the south of the peninsula, Dophkah is often sought at Serabit el-Khadim, the Egyptian turquoise mines with their temple of Hathor, where Flinders Petrie's expedition of 1904-05 found the Proto-Sinaitic inscriptions; the guess rests on a suggested link between the name and the Egyptian word for turquoise and on the mines lying inland from the coastal plain where the wilderness of Sin is usually placed. Nothing on the ground confirms it, and those who put Sinai elsewhere put Dophkah elsewhere too. Serabit el-Khadim today is a plateau in South Sinai, Egypt, with the ruined temple and the mine galleries still open."
  ru:
    - "Дофка — стан пустынного странствия, известный только по перечню в книге Чисел: Израильтяне «отправились из пустыни Син и расположились станом в Дофке», затем «отправились из Дофки и расположились станом в Алуше», откуда пошли в Рефидим. Книга Исход, рассказывая о том же отрезке пути, переходит прямо от пустыни Син к Рефидиму и Дофки не называет. Больше об этом месте ничего не сказано."
    - "Где она лежала, зависит от того, где искать гору Синай. На традиционном пути к Джебель-Муса на юге полуострова Дофку часто помещают в Серабит-эль-Хадим, египетские бирюзовые рудники с храмом Хатхор, где экспедиция Флиндерса Питри в 1904–1905 годах нашла протосинайские надписи; догадка опирается на предполагаемую связь имени с египетским словом «бирюза» и на то, что рудники лежат в глубине полуострова за прибрежной равниной, где обычно помещают пустыню Син. Ничто на месте этого не подтверждает, а кто ищет Синай в другом месте, тот и Дофку ищет в другом. Серабит-эль-Хадим сегодня — плато на Южном Синае, в Египте, где по-прежнему открыты развалины храма и штольни рудников."
  uk:
    - "Дофка — стоянка мандрівки пустелею, відома лише з переліку в Книзі Чисел: ізраїльтяни «рушили із Син степу та й отаборились у Дофцї» і «рушили з Дофки, та й отаборились в Алушу», звідки пішли далі до Рефідіма. Книга Виходу, розповідаючи про той самий відтинок мандрівки, переходить прямо від пустелі Сін до Рефідіма й не називає її. Про саме місце більше нічого не сказано."
    - "Де воно лежало, залежить від того, де ставити гору Синай. На традиційному маршруті до Джебель-Муси на півдні півострова Дофку часто шукають у Серабіт-ель-Хадімі, єгипетських бірюзових копальнях із їхнім храмом Хатхор, де експедиція Фліндерса Петрі в 1904–1905 рр. знайшла протосинайські написи; припущення спирається на припущений зв'язок назви з єгипетським словом для бірюзи та на те, що копальні лежать углиб суходолу від прибережної рівнини, де зазвичай розміщують пустелю Сін. Ніщо на місцевості цього не підтверджує, і ті, хто розташовує Синай деінде, розташовують деінде й Дофку. Серабіт-ель-Хадім сьогодні — плато в Південному Синаї, в Єгипті, зі зруйнованим храмом і досі відкритими штольнями копалень."
  es:
    - "Dofca es una estación del viaje por el desierto conocida solo por el itinerario de Números: Israel, «partidos del desierto de Sin, asentaron en Dophca», y «partidos de Dophca, asentaron en Alús», de donde siguieron hacia Refidim. El Éxodo, al contar el mismo tramo del viaje, pasa directamente del desierto de Sin a Refidim y no la nombra. No se dice nada más del lugar."
    - "Dónde estaba depende de dónde se sitúe el monte Sinaí. En la ruta tradicional hacia el Yebel Musa, en el sur de la península, Dofca se busca a menudo en Serabit el-Khadim, las minas egipcias de turquesa con su templo de Hathor, donde la expedición de Flinders Petrie halló en 1904–1905 las inscripciones protosinaíticas; la conjetura se apoya en un supuesto vínculo entre el nombre y la palabra egipcia para turquesa y en que las minas se hallan tierra adentro respecto de la llanura costera donde suele situarse el desierto de Sin. Nada sobre el terreno lo confirma, y quienes sitúan el Sinaí en otra parte sitúan también Dofca en otra. Serabit el-Khadim es hoy una meseta del Sinaí Meridional, en Egipto, con el templo en ruinas y las galerías de las minas todavía abiertas."
  pt:
    - "Dofca é uma estação da jornada no deserto conhecida apenas pelo itinerário de Números: Israel, de quem se diz: “Partiram do deserto de Sim e acamparam em Dofca”, e “Partiram de Dofca e acamparam em Alus”, de onde seguiram para Refidim. O Êxodo, ao contar o mesmo trecho da jornada, passa direto do deserto de Sim a Refidim e não a nomeia. Nada mais se diz do lugar."
    - "Onde ficava depende de onde se põe o Monte Sinai. Na rota tradicional para o Jebel Musa, no sul da península, Dofca é muitas vezes procurada em Serabit el-Khadim, as minas egípcias de turquesa com seu templo de Hator, onde a expedição de Flinders Petrie achou em 1904–1905 as inscrições protossinaíticas; o palpite repousa numa sugerida ligação entre o nome e a palavra egípcia para turquesa e no fato de as minas ficarem para o interior, em relação à planície costeira onde o deserto de Sim costuma ser situado. Nada no terreno o confirma, e os que põem o Sinai em outro lugar põem Dofca em outro lugar também. Serabit el-Khadim é hoje um planalto no Sinai do Sul, no Egito, com o templo em ruínas e as galerias das minas ainda abertas."
  de:
    - "Dofka ist eine Station des Wüstenzugs, die nur aus dem Verzeichnis im Buch Numeri bekannt ist. Dort heißt es: „Von der Wüste Sin zogen sie aus und lagerten sich in Dophka“ und „Von Dophka zogen sie aus und lagerten sich in Alus“, von wo sie nach Refidim weiterzogen. Das Buch Exodus, das dieselbe Wegstrecke erzählt, geht unmittelbar von der Wüste Sin nach Refidim über und nennt sie nicht. Sonst wird nichts über den Ort gesagt."
    - "Wo sie lag, hängt davon ab, wo man den Berg Sinai ansetzt. Auf der traditionellen Route zum Dschebel Musa im Süden der Halbinsel wird Dofka oft in Serabit el-Khadim gesucht, den ägyptischen Türkisminen mit ihrem Tempel der Hathor, wo die Expedition von Flinders Petrie 1904–1905 die protosinaitischen Inschriften fand; die Vermutung beruht auf einem vorgeschlagenen Zusammenhang zwischen dem Namen und dem ägyptischen Wort für Türkis und darauf, dass die Minen im Landesinneren hinter der Küstenebene liegen, wo man gewöhnlich die Wüste Sin ansetzt. Nichts vor Ort bestätigt es, und wer den Sinai anderswo ansetzt, setzt auch Dofka anderswo an. Serabit el-Khadim ist heute ein Plateau im Südsinai in Ägypten, mit dem zerfallenen Tempel und den noch offenen Minengängen."
  fr:
    - "Dophka est une étape du voyage dans le désert connue seulement par l’itinéraire des Nombres : « Ils partirent du désert de Sin, et campèrent à Dophka », puis « Ils partirent de Dophka, et campèrent à Alusch », d’où ils allèrent à Rephidim. L’Exode, qui raconte le même tronçon du voyage, passe directement du désert de Sin à Rephidim sans la nommer. On n’en dit rien d’autre."
    - "Son emplacement dépend de celui que l’on donne au Mont Sinaï. Sur l’itinéraire traditionnel vers le Djebel Moussa, dans le sud de la péninsule, on cherche souvent Dophka à Serabit el-Khadim, les mines de turquoise égyptiennes avec leur temple d’Hathor, où l’expédition de Flinders Petrie trouva en 1904-1905 les inscriptions protosinaïtiques ; cette hypothèse repose sur un lien suggéré entre le nom et le mot égyptien pour la turquoise, et sur la situation des mines à l’intérieur des terres par rapport à la plaine côtière où l’on place d’ordinaire le désert de Sin. Rien sur le terrain ne la confirme, et ceux qui situent le Sinaï ailleurs placent aussi Dophka ailleurs. Serabit el-Khadim est aujourd’hui un plateau du Sud-Sinaï, en Égypte, avec le temple en ruine et les galeries de mines encore ouvertes."
  it:
    - "Dofka è una stazione del viaggio nel deserto nota solo dall’itinerario di Numeri: «Partirono dal deserto di Sin e si accamparono a Dofka», e «Partirono da Dofka e si accamparono ad Alush», da dove proseguirono verso Refidim. L’Esodo, narrando lo stesso tratto del viaggio, passa direttamente dal deserto di Sin a Refidim e non la nomina. Null’altro si dice del luogo."
    - "Dove si trovasse dipende da dove si pone il Monte Sinai. Sul percorso tradizionale verso il Jebel Musa nel sud della penisola, Dofka è spesso cercata a Serabit el-Khadim, le miniere egizie di turchese con il loro tempio di Hathor, dove la spedizione di Flinders Petrie nel 1904–1905 trovò le iscrizioni protosinaitiche; l’ipotesi poggia su un presunto legame fra il nome e la parola egizia per turchese e sul fatto che le miniere si trovano nell’interno rispetto alla pianura costiera dove di solito si colloca il deserto di Sin. Nulla sul terreno la conferma, e chi pone il Sinai altrove pone altrove anche Dofka. Serabit el-Khadim è oggi un altopiano nel Sinai meridionale, in Egitto, con il tempio in rovina e le gallerie delle miniere ancora aperte."
  pl:
    - "Dofka jest stacją wędrówki przez pustynię znaną tylko z wykazu w Księdze Liczb: „A ruszywszy się z puszczy Syn, położyli się obozem w Dafka”, a potem „A ruszywszy się z Dafka, położyli się obozem w Alus”, skąd poszli do Refidim. Księga Wyjścia, opowiadając ten sam odcinek drogi, przechodzi prosto od pustyni Sin do Refidim i nie wymienia jej. Nic więcej o tym miejscu nie powiedziano."
    - "Gdzie leżała, zależy od tego, gdzie umieszcza się górę Synaj. Na tradycyjnej trasie do Dżabal Musa na południu półwyspu Dofki często szuka się w Serabit el-Chadim, egipskich kopalniach turkusu z ich świątynią Hathor, gdzie wyprawa Flindersa Petriego w latach 1904–1905 znalazła napisy protosynajskie; przypuszczenie opiera się na proponowanym związku nazwy z egipskim słowem oznaczającym turkus oraz na tym, że kopalnie leżą w głębi lądu od równiny nadmorskiej, gdzie zwykle umieszcza się pustynię Sin. Nic w terenie tego nie potwierdza, a ci, którzy umieszczają Synaj gdzie indziej, umieszczają tam też Dofkę. Serabit el-Chadim to dziś płaskowyż w Synaju Południowym w Egipcie, z ruinami świątyni i wciąż otwartymi galeriami kopalnianymi."
  nl:
    - "Dofka is een halte van de woestijntocht die alleen bekend is uit het reisverhaal in Numeri, waar over Israël staat: “En zij verreisden uit de woestijn Sin, en zij legerden zich in Dofka”, en “verreisden van Dofka, en legerden zich in Aluz”, vanwaar zij verder trokken naar Refidim. Exodus, dat hetzelfde stuk van de tocht vertelt, gaat direct van de woestijn Sin naar Refidim en noemt haar niet. Verder wordt niets van de plaats gezegd."
    - "Waar zij lag, hangt af van waar men de Sinaï plaatst. Op de traditionele route naar de Jebel Musa in het zuiden van het schiereiland wordt Dofka vaak gezocht bij Serabit el-Khadim, de Egyptische turkooismijnen met hun tempel van Hathor, waar de expeditie van Flinders Petrie in 1904–1905 de Proto-Sinaïtische inscripties vond; de gissing berust op een voorgesteld verband tussen de naam en het Egyptische woord voor turkoois en op het feit dat de mijnen landinwaarts van de kustvlakte liggen waar de woestijn Sin gewoonlijk wordt geplaatst. Niets ter plaatse bevestigt het, en wie de Sinaï elders plaatst, plaatst ook Dofka elders. Serabit el-Khadim is nu een plateau in Zuid-Sinaï, Egypte, met de ruïne van de tempel en de mijngangen nog open."
  cs:
    - "Dofka je stanice putování pouští známá jen z itineráře v Numeri: „A když se hnuli z pouště Sin, položili se v Dafka“ a „hnuvše se z Dafka, položili se v Halus“, odkud šli dál do Refídimu. Exodus, vyprávějící tentýž úsek cesty, přechází přímo od pouště Sín do Refídimu a Dofku nejmenuje. Nic jiného se o místě neříká."
    - "Kde ležela, závisí na tom, kam kdo klade horu Sinaj. Na tradiční trase k Jebel Musa na jihu poloostrova se Dofka často hledá v Serabit el-Khadim, egyptských tyrkysových dolech s jejich chrámem Hathor, kde výprava Flinderse Petrieho v letech 1904–1905 našla protosinajské nápisy; domněnka spočívá na navrhované souvislosti jména s egyptským slovem pro tyrkys a na tom, že doly leží ve vnitrozemí od pobřežní roviny, kam se obvykle klade poušť Sín. Nic na místě ji nepotvrzuje a ti, kdo kladou Sinaj jinam, kladou jinam i Dofku. Serabit el-Khadim je dnes plošina v Jižním Sinaji v Egyptě se zříceným chrámem a dosud otevřenými důlními štolami."
  sv:
    - "Dofka är en station på ökenvandringen som bara är känd från marschrutten i Fjärde Mosebok: Israel ”bröto upp från öknen Sin och lägrade sig i Dofka”, och ”bröto upp från Dofka och lägrade sig i Alus”, varifrån de gick vidare till Refidim. Andra Mosebok, som berättar om samma sträcka, går direkt från Sins öken till Refidim och nämner den inte. Inget annat sägs om platsen."
    - "Var den låg beror på var man placerar Sinaiberget. På den traditionella vägen till Jebel Musa i halvöns södra del söks Dofka ofta vid Serabit el-Khadim, de egyptiska turkosgruvorna med sitt tempel åt Hathor, där Flinders Petries expedition 1904–05 fann de protosinaitiska inskrifterna; gissningen vilar på en föreslagen koppling mellan namnet och det egyptiska ordet för turkos och på att gruvorna ligger inåt land från kustslätten där Sins öken vanligen placeras. Inget på platsen bekräftar det, och de som placerar Sinai någon annanstans placerar Dofka någon annanstans också. Serabit el-Khadim är i dag en platå i Södra Sinai i Egypten, med det raserade templet och gruvgångarna fortfarande öppna."
