# Overview article (ADR 0007). Mainstream facts only; Calno/Calneh of the prophets taken as Assyrian Kullania; Tell Tayinat is the usual site, the other candidates are named; distinct from Calneh of Genesis 10.10.
id: calneh
place: a7be664
title:
  en: "Calneh"
  ru: "Калне"
body:
  en:
    - "Calneh, called Calno in Isaiah, was a city of northern Syria that the prophets cite as a byword for a kingdom fallen to Assyria. Amos challenges Samaria's complacent rulers: “Pass ye unto Calneh, and see; and from thence go ye to Hamath the great: then go down to Gath of the Philistines: be they better than these kingdoms?” In Isaiah the king of Assyria boasts of his conquests: “Is not Calno as Carchemish? is not Hamath as Arpad? is not Samaria as Damascus?” It is not the same place as the Calneh in the land of Shinar in Genesis, one of the first cities of Nimrod's kingdom. The Synodal Bible spells the name Kalne in Amos but Khalne in Isaiah."
    - "The city is generally taken to be Kullania (Kunulua), capital of the kingdom of Unqi or Patina in the Amuq plain, which Tiglath-pileser III took in 738 BC and made the seat of an Assyrian province; whether Amos' words came before that fall or look back on it is debated. The usual site is Tell Tayinat in Turkey's Hatay province, near Antakya, where Chicago excavators in the 1930s found a Neo-Hittite palace and temple, and the University of Toronto's project since 1999 has uncovered an Assyrian-era temple holding a copy of Esarhaddon's succession treaty, found in 2009. Kullanköy, north of Aleppo near Arpad, and Chatal Hüyük in the Amuq are older proposals."
  ru:
    - "Калне, у Исаии Халне, — город Северной Сирии, который пророки приводят как пример царства, павшего пред Ассирией. Амос обличает беспечных правителей Самарии: «Пройдите в Калне и посмотрите, оттуда перейдите в Емаф великий и спуститесь в Геф Филистимский: не лучше ли они сих царств?» У Исаии царь Ассирийский хвалится победами: «Халне не то же ли, что Кархемис? Емаф не то же ли, что Арпад? Самария не то же ли, что Дамаск?» Это не тот Халне в земле Сеннаар из книги Бытия, один из первых городов царства Нимрода. Синодальный перевод пишет имя «Калне» у Амоса, но «Халне» у Исаии."
    - "Город обычно отождествляют с Куллани (Кунулуа), столицей царства Унки, или Патины, на равнине Амук, которую Феглаффелласар III взял в 738 г. до н. э. и сделал центром ассирийской провинции; сказаны ли слова Амоса до её падения или с оглядкой на него, спорят. Обычное место — Телль-Тайинат в турецкой провинции Хатай близ Антакьи, где чикагские археологи в 1930-х годах нашли неохеттские дворец и храм, а проект Торонтского университета с 1999 года открыл храм ассирийского времени с копией договора о престолонаследии Асардана, найденной в 2009 году. Кулланкёй к северу от Алеппо близ Арпада и Чатал-Хююк на Амуке — более старые предположения."
scripture:
