# Overview article (ADR 0007). Mainstream facts only; Calno/Calneh of the prophets taken as Assyrian Kullania; Tell Tayinat is the usual site, the other candidates are named; distinct from Calneh of Genesis 10.10.
id: calneh
place: a7be664
title:
  en: "Calneh"
  ru: "Калне"
  uk: "Калне"
  es: "Calne"
  pt: "Calné"
  de: "Kalne"
  fr: "Calné"
body:
  en:
    - "Calneh, called Calno in Isaiah, was a city of northern Syria that the prophets cite as a byword for a kingdom fallen to Assyria. Amos challenges Samaria's complacent rulers: “Pass ye unto Calneh, and see; and from thence go ye to Hamath the great: then go down to Gath of the Philistines: be they better than these kingdoms?” In Isaiah the king of Assyria boasts of his conquests: “Is not Calno as Carchemish? is not Hamath as Arpad? is not Samaria as Damascus?” It is not the same place as the Calneh in the land of Shinar in Genesis, one of the first cities of Nimrod's kingdom. The Synodal Bible spells the name Kalne in Amos but Khalne in Isaiah."
    - "The city is generally taken to be Kullania (Kunulua), capital of the kingdom of Unqi or Patina in the Amuq plain, which Tiglath-pileser III took in 738 BC and made the seat of an Assyrian province; whether Amos' words came before that fall or look back on it is debated. The usual site is Tell Tayinat in Turkey's Hatay province, near Antakya, where Chicago excavators in the 1930s found a Neo-Hittite palace and temple, and the University of Toronto's project since 1999 has uncovered an Assyrian-era temple holding a copy of Esarhaddon's succession treaty, found in 2009. Kullanköy, north of Aleppo near Arpad, and Chatal Hüyük in the Amuq are older proposals."
  ru:
    - "Калне, у Исаии Халне, — город Северной Сирии, который пророки приводят как пример царства, павшего пред Ассирией. Амос обличает беспечных правителей Самарии: «Пройдите в Калне и посмотрите, оттуда перейдите в Емаф великий и спуститесь в Геф Филистимский: не лучше ли они сих царств?» У Исаии царь Ассирийский хвалится победами: «Халне не то же ли, что Кархемис? Емаф не то же ли, что Арпад? Самария не то же ли, что Дамаск?» Это не тот Халне в земле Сеннаар из книги Бытия, один из первых городов царства Нимрода. Синодальный перевод пишет имя «Калне» у Амоса, но «Халне» у Исаии."
    - "Город обычно отождествляют с Куллани (Кунулуа), столицей царства Унки, или Патины, на равнине Амук, которую Феглаффелласар III взял в 738 г. до н. э. и сделал центром ассирийской провинции; сказаны ли слова Амоса до её падения или с оглядкой на него, спорят. Обычное место — Телль-Тайинат в турецкой провинции Хатай близ Антакьи, где чикагские археологи в 1930-х годах нашли неохеттские дворец и храм, а проект Торонтского университета с 1999 года открыл храм ассирийского времени с копией договора о престолонаследии Асардана, найденной в 2009 году. Кулланкёй к северу от Алеппо близ Арпада и Чатал-Хююк на Амуке — более старые предположения."
  uk:
    - "Калне, зване в Ісаї Хальне, було містом північної Сирії, яке пророки наводять як приклад царства, що впало перед Ассирією. Амос кидає виклик самовдоволеним правителям Самарії: «Ійдїте лиш в Калне та подивітесь, а звідти перейдїть у Емат Великий, та ще спустїтесь у Гет Филистійський: Чи лучше ж там, анїж у вас у царстві?» В Ісаї цар Ассирії хвалиться своїми завоюваннями: «Хиба Хальне не те, що й Кархемис? або Емат не те, що й Арпад? а Самария не те, що Дамаск?» Це не те саме місце, що Калне в землі Сеннаар у Книзі Буття, одне з перших міст царства Німрода. Синодальний переклад пише ім'я «Калне» в Амоса, а в Ісаї — «Халне»."
    - "Місто зазвичай вважають Куллані (Кунулуа), столицею царства Ункі, або Патіни, в рівнині Амук, яку Тіглатпаласар III узяв у 738 р. до н. е. й зробив осередком ассирійської провінції; чи слова Амоса передували цьому падінню, чи озираються на нього, — предмет суперечки. Звичайне місце — Телль-Тайінат у турецькій провінції Хатай, поблизу Антак'ї, де чиказькі розкопувачі в 1930-х рр. знайшли неохетський палац і храм, а проєкт Торонтського університету від 1999 р. відкрив храм ассирійської доби з копією договору Асархаддона про престолонаслідування, знайденою в 2009 р. Кулланкьой, на північ від Алеппо поблизу Арпаду, і Чатал-Гююк в Амуку — давніші пропозиції."
  es:
    - "Calne, llamada Calno en Isaías, era una ciudad del norte de Siria que los profetas citan como ejemplo proverbial de un reino caído ante Asiria. Amós interpela a los despreocupados gobernantes de Samaria: «Pasad á Calne, y mirad; y de allí id á la gran Hamath; descended luego á Gath de los Palestinos: ved si son aquellos reinos mejores que estos reinos». En Isaías el rey de Asiria se jacta de sus conquistas: «¿No es Calno como Carchêmis, Hamath como Arphad, y Samaria como Damasco?». No es el mismo lugar que la Calne de la tierra de Sinar en el Génesis, una de las primeras ciudades del reino de Nimrod. La Biblia sinodal escribe el nombre Kalne en Amós, pero Khalne en Isaías."
    - "Se suele identificar la ciudad con Kullania (Kunulua), capital del reino de Unqi o Patina, en la llanura de Amuq, que Tiglat-pileser III tomó en el 738 a. C. y convirtió en sede de una provincia asiria; se debate si las palabras de Amós fueron anteriores a esa caída o la miran en retrospectiva. El emplazamiento habitual es Tell Tayinat, en la provincia turca de Hatay, cerca de Antakya, donde los excavadores de Chicago hallaron en la década de 1930 un palacio y un templo neohititas, y donde el proyecto de la Universidad de Toronto, desde 1999, ha sacado a la luz un templo de época asiria que contenía una copia del tratado de sucesión de Esar-hadón, hallada en 2009. Kullanköy, al norte de Alepo, cerca de Arfad, y Chatal Hüyük, en el Amuq, son propuestas más antiguas."
  pt:
    - "Calné, chamada Calno em Isaías, era uma cidade do norte da Síria que os profetas citam como símbolo de um reino caído diante da Assíria. Amós desafia os governantes complacentes de Samaria: “Vão a Calné, e vejam. De lá, vão à grande Hamate. Depois desçam a Gate dos filisteus. São eles melhores do que estes reinos?” Em Isaías, o rei da Assíria se gaba de suas conquistas: “Não é Calno como Carquemis? Não é Hamate como Arpade? Não é Samaria como Damasco?” Não é o mesmo lugar que a Calné da terra de Sinar, no Gênesis, uma das primeiras cidades do reino de Ninrode. A Bíblia Sinodal grafa o nome Kalne em Amós, mas Khalne em Isaías."
    - "A cidade é geralmente tida como Kullania (Kunulua), capital do reino de Unqi ou Patina, na planície do Amuq, que Tiglate-Pileser III tomou em 738 a.C. e tornou sede de uma província assíria; se as palavras de Amós vieram antes dessa queda ou olham para trás para ela, é debatido. O local habitual é Tell Tayinat, na província turca de Hatay, perto de Antáquia, onde escavadores de Chicago, na década de 1930, encontraram um palácio e um templo neo-hititas, e o projeto da Universidade de Toronto, desde 1999, trouxe à luz um templo da época assíria com uma cópia do tratado de sucessão de Esar-Hadom, achada em 2009. Kullanköy, ao norte de Alepo, perto de Arpade, e Chatal Hüyük, no Amuq, são propostas mais antigas."
  de:
    - "Kalne, bei Jesaja Kalno genannt, war eine Stadt in Nordsyrien, die die Propheten als Inbegriff eines an Assyrien gefallenen Reiches anführen. Amos fordert die selbstzufriedenen Herrscher Samarias heraus: „Gehet hin gen Kalne und schauet, und von da gen Hamath, die große Stadt, und zieht hinab gen Gath der Philister, welche bessere Königreiche gewesen sind denn diese“. Bei Jesaja rühmt sich der König von Assyrien seiner Eroberungen: „Ist Kalno nicht wie Karchemis? ist Hamath nicht wie Arpad? ist nicht Samaria wie Damaskus?“ Es ist nicht derselbe Ort wie das Kalne im Land Schinar in der Genesis, eine der ersten Städte von Nimrods Reich. Die Synodalbibel schreibt den Namen bei Amos Kalne, bei Jesaja aber Chalne."
    - "Die Stadt wird allgemein für Kullania (Kunulua) gehalten, die Hauptstadt des Königreichs Unqi oder Patina in der Amuq-Ebene, die Tiglat-Pileser III. 738 v. Chr. einnahm und zum Sitz einer assyrischen Provinz machte; ob Amos’ Worte vor diesem Fall gesprochen wurden oder auf ihn zurückblicken, ist umstritten. Der übliche Ort ist Tell Tayinat in der türkischen Provinz Hatay nahe Antakya, wo Ausgräber aus Chicago in den 1930er Jahren einen neohethitischen Palast und Tempel fanden und das Projekt der Universität Toronto seit 1999 einen Tempel aus assyrischer Zeit freigelegt hat, der eine 2009 gefundene Abschrift von Asarhaddons Thronfolgevertrag enthielt. Kullanköy, nördlich von Aleppo nahe Arpad, und Çatal Höyük im Amuq sind ältere Vorschläge."
  fr:
    - "Calné, appelée Calno chez Ésaïe, était une ville du nord de la Syrie que les prophètes citent comme exemple d’un royaume tombé aux mains de l’Assyrie. Amos interpelle les chefs de Samarie, satisfaits d’eux-mêmes : « Passez à Calné et voyez, allez de là jusqu’à Hamath la grande, et descendez à Gath chez les Philistins : ces villes sont-elles plus prospères que vos deux royaumes… » Chez Ésaïe, le roi d’Assyrie se vante de ses conquêtes : « N’en a-t-il pas été de Calno comme de Carkemisch ? N’en a-t-il pas été de Hamath comme d’Arpad ? N’en a-t-il pas été de Samarie comme de Damas ? » Elle n’est pas la même que la Calné du pays de Schinear dans la Genèse, l’une des premières villes du royaume de Nimrod. La Bible synodale écrit le nom Kalne chez Amos mais Khalne chez Ésaïe."
    - "La ville est généralement identifiée à Kullania (Kunulua), capitale du royaume d’Unqi ou Patina dans la plaine de l’Amuq, que Tiglath-Piléser III prit en 738 av. J.-C. et dont il fit le siège d’une province assyrienne ; on discute si les paroles d’Amos précèdent cette chute ou la rappellent. Le site habituel est Tell Tayinat, dans la province turque de Hatay, près d’Antakya, où les fouilleurs de Chicago trouvèrent dans les années 1930 un palais et un temple néo-hittites, et où le projet de l’Université de Toronto a mis au jour depuis 1999 un temple de l’époque assyrienne contenant un exemplaire du traité de succession d’Esar-Haddon, découvert en 2009. Kullanköy, au nord d’Alep près d’Arpad, et Chatal Hüyük dans l’Amuq sont des propositions plus anciennes."
