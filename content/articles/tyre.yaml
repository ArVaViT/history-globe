# Overview article (ADR 0007). Mainstream facts only; disputed things are said to be disputed.
id: tyre
place: a160272
title:
  en: "Tyre"
  ru: "Тир"
  uk: "Тір"
  es: "Tiro"
  pt: "Tiro"
  de: "Tyrus"
  fr: "Tyr"
  pl: "Tyr"
  it: "Tiro"
