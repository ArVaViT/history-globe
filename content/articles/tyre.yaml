body:
  en:
    - "Tyre was built on a rocky island just off the coast of southern Phoenicia, with a town on the mainland opposite, Ushu, later called Old Tyre, that gave it water and farmland. Herodotus was told by its priests that the city had been founded about 2,300 years before his visit, that is about 2750 BC, and soundings on the island have reached levels of the Early Bronze Age. In the fourteenth century BC its ruler Abimilku wrote to Pharaoh in the Amarna letters. Joshua names it as the fortified city on the border of Asher."
    - "Under Hiram I in the tenth century BC Tyre led Phoenician seafaring. The Bible tells how Hiram sent cedar and craftsmen for David's house and Solomon's Temple, and Josephus, citing the Tyrian annals as given by Menander, describes his reign. Tyrians founded colonies across the Mediterranean, Carthage by tradition in 814 BC, and grew rich on trade and purple dye. Jezebel, wife of Ahab, was the daughter of Ethbaal, whom the Bible calls king of the Sidonians and Josephus king of the Tyrians and Sidonians."
    - "Tyre paid tribute to the Assyrian kings but kept its island. Isaiah and Ezekiel foretold its fall, and Ezekiel says that Nebuchadnezzar's army wore itself out against Tyre without reward. Josephus, citing Phoenician records, says the Babylonian siege lasted thirteen years; it is usually dated to the 580s and 570s BC. In 332 BC Alexander the Great took the island after a siege of about seven months by building a causeway from the mainland; silt gathered along it, and Tyre has been joined to the shore ever since."
    - "Tyre won its independence from the Seleucids in 126 BC and kept a privileged status under Rome after 64 BC. Jesus went into the region of Tyre and Sidon, and Paul stayed a week with the disciples there on his way to Jerusalem. Septimius Severus, who created the province of Syria Phoenice about AD 194, made Tyre its capital and a Roman colony. Origen died and was buried there, Eusebius spoke at the dedication of Bishop Paulinus's great church about 315, and a church council met at Tyre in 335."
  ru:
    - "Тир был построен на скалистом острове у берега южной Финикии, а напротив, на материке, стоял город Ушу, позже названный Старым Тиром, который давал острову воду и пашни. Жрецы Тира говорили Геродоту, что город основан примерно за 2300 лет до его посещения, то есть около 2750 г. до н. э., а раскопки на острове дошли до слоёв раннего бронзового века. В XIV веке до н. э. его правитель Абимилку писал фараону в Амарнских письмах. Книга Иисуса Навина называет его укреплённым городом на границе удела Асира."
    - "При Хираме I в X веке до н. э. Тир возглавил финикийское мореплавание. Библия рассказывает, как Хирам присылал кедры и мастеров для дома Давида и для Храма Соломона, а Иосиф Флавий, ссылаясь на тирские летописи в передаче Менандра, описывает его царствование. Тиряне основывали колонии по всему Средиземноморью, Карфаген — по преданию, в 814 г. до н. э., и богатели на торговле и пурпурной краске. Иезавель, жена Ахава, была дочерью Ефваала, которого Библия называет царём Сидонским, а Иосиф Флавий — царём тирян и сидонян."
    - "Тир платил дань ассирийским царям, но сохранял свой остров. Исаия и Иезекииль предсказывали его падение, и Иезекииль говорит, что войско Навуходоносора изнурилось у Тира без вознаграждения. Иосиф Флавий, ссылаясь на финикийские записи, сообщает, что вавилонская осада длилась тринадцать лет; обычно её относят к 580-м и 570-м гг. до н. э. В 332 г. до н. э. Александр Македонский взял остров после примерно семимесячной осады, насыпав дамбу от материка; вдоль неё нанесло песок, и с тех пор Тир соединён с берегом."
    - "В 126 г. до н. э. Тир добился независимости от Селевкидов и сохранил особое положение под властью Рима после 64 г. до н. э. Иисус приходил в пределы Тирские и Сидонские, а Павел по пути в Иерусалим провёл там семь дней с учениками. Септимий Север, создавший около 194 г. н. э. провинцию Сирия Финикийская, сделал Тир её столицей и римской колонией. Здесь умер и был погребён Ориген, Евсевий произнёс речь при освящении великого храма епископа Павлина около 315 г., а в 335 г. в Тире собрался церковный собор."
  uk:
    - "Тір збудували на скелястому острові просто біля узбережжя південної Фінікії, з містом на материку навпроти, Ушу, пізніше званим Старим Тіром, що давало йому воду й ріллю. Геродотові його жерці казали, що місто засноване приблизно за 2300 років до його візиту, тобто близько 2750 р. до н. е., і зондування на острові досягли шарів ранньої бронзової доби. У XIV ст. до н. е. його правитель Абімілку писав фараонові в листах з Амарни. Ісус Навин називає його укріпленим містом на межі Асіра."
    - "За Хірама I в X ст. до н. е. Тір очолював фінікійське мореплавство. Біблія розповідає, як Хірам надіслав кедр і майстрів для дому Давида і Храму Соломона, а Йосиф Флавій, посилаючись на тірські аннали за Менандром, описує його царювання. Тірці заснували колонії по всьому Середземномор’ю, за переказом Карфаген у 814 р. до н. е., і розбагатіли на торгівлі та пурпуровій фарбі. Єзавель, дружина Ахава, була донькою Ефваала, якого Біблія називає царем сідонян, а Йосиф Флавій — царем тірців і сідонян."
    - "Тір платив данину ассірійським царям, але зберіг свій острів. Ісая й Єзекіїль передрекли його падіння, а Єзекіїль каже, що військо Навуходоносора виснажилося проти Тіру без винагороди. Йосиф Флавій, посилаючись на фінікійські записи, каже, що вавилонська облога тривала тринадцять років; її зазвичай датують 580-ми й 570-ми роками до н. е. У 332 р. до н. е. Александр Великий взяв острів після облоги близько семи місяців, збудувавши дамбу від материка; мул наростав уздовж неї, і Тір відтоді з’єднаний з берегом."
    - "Тір здобув незалежність від Селевкідів у 126 р. до н. е. і зберіг привілейований статус під Римом після 64 р. до н. е. Ісус ходив у краї Тіру й Сідону, а Павло пробув тиждень з учнями там на шляху до Єрусалима. Септимій Север, який створив провінцію Сирія Фінікійська близько 194 року н. е., зробив Тір її столицею і римською колонією. Там помер і був похований Оріген, Євсевій виголосив промову на освяченні великої церкви єпископа Павлінія близько 315 року, а 335 року в Тірі зібрався церковний собор."
  es:
    - "Tiro fue construida sobre una isla rocosa justo frente a la costa del sur de Fenicia, con una ciudad en tierra firme enfrente, Ushu, llamada después Tiro Antigua, que le proporcionaba agua y tierras de labor. A Heródoto sus sacerdotes le dijeron que la ciudad había sido fundada unos 2300 años antes de su visita, es decir, hacia 2750 a. C., y los sondeos en la isla han alcanzado niveles del Bronce Antiguo. En el siglo XIV a. C. su gobernante Abimilku escribió al faraón en las cartas de Amarna. Josué la nombra como la ciudad fortificada en la frontera de Aser."
    - "Bajo Hiram I, en el siglo X a. C., Tiro encabezó la navegación fenicia. La Biblia cuenta cómo Hiram envió cedro y artesanos para la casa de David y el Templo de Salomón, y Josefo, citando los anales tirios según los da Menandro, describe su reinado. Los tirios fundaron colonias por todo el Mediterráneo, Cartago según la tradición en 814 a. C., y se enriquecieron con el comercio y el tinte de púrpura. Jezabel, esposa de Acab, era hija de Et-baal, a quien la Biblia llama rey de los sidonios y Josefo rey de los tirios y sidonios."
    - "Tiro pagaba tributo a los reyes asirios pero conservó su isla. Isaías y Ezequiel anunciaron su caída, y Ezequiel dice que el ejército de Nabucodonosor se agotó contra Tiro sin recompensa. Josefo, citando registros fenicios, dice que el asedio babilonio duró trece años; suele fecharse en los años 580 y 570 a. C. En 332 a. C. Alejandro Magno tomó la isla tras un asedio de unos siete meses construyendo una calzada desde tierra firme; el cieno se acumuló a lo largo de ella, y Tiro ha estado unida a la costa desde entonces."
    - "Tiro conquistó su independencia de los seléucidas en 126 a. C. y conservó un estatus privilegiado bajo Roma después de 64 a. C. Jesús fue a la región de Tiro y de Sidón, y Pablo pasó una semana con los discípulos allí camino de Jerusalén. Septimio Severo, que creó la provincia de Siria Fenicia hacia el 194 d. C., hizo de Tiro su capital y una colonia romana. Orígenes murió y fue sepultado allí, Eusebio habló en la dedicación de la gran iglesia del obispo Paulino hacia 315, y un concilio de la Iglesia se reunió en Tiro en 335."
  pt:
    - "Tiro foi construída numa ilha rochosa junto à costa do sul da Fenícia, com uma cidade no continente em frente, Ushu, depois chamada Tiro Antiga, que lhe dava água e terras de cultivo. Os sacerdotes de Tiro disseram a Heródoto que a cidade fora fundada cerca de 2.300 anos antes de sua visita, isto é, por volta de 2750 a.C., e sondagens na ilha atingiram níveis da Idade do Bronze Antigo. No século XIV a.C., seu governante Abimilku escreveu ao Faraó nas cartas de Amarna. Josué a nomeia como a cidade fortificada na fronteira de Aser."
    - "Sob Hirão I, no século X a.C., Tiro liderou a navegação fenícia. A Bíblia conta como Hirão enviou cedro e artífices para a casa de Davi e o Templo de Salomão, e Josefo, citando os anais tírios segundo Menandro, descreve seu reinado. Os tírios fundaram colônias por todo o Mediterrâneo, Cartago, pela tradição, em 814 a.C., e enriqueceram com o comércio e a tinta púrpura. Jezabel, esposa de Acabe, era filha de Etbaal, que a Bíblia chama de rei dos sidônios e Josefo de rei dos tírios e sidônios."
    - "Tiro pagou tributo aos reis assírios, mas conservou sua ilha. Isaías e Ezequiel predisseram sua queda, e Ezequiel diz que o exército de Nabucodonosor se desgastou contra Tiro sem recompensa. Josefo, citando registros fenícios, diz que o cerco babilônico durou treze anos; costuma ser datado das décadas de 580 e 570 a.C. Em 332 a.C., Alexandre, o Grande, tomou a ilha depois de um cerco de cerca de sete meses, construindo um dique desde o continente; o limo se acumulou ao longo dele, e Tiro está unida à costa desde então."
    - "Tiro conquistou a independência dos selêucidas em 126 a.C. e manteve um estatuto privilegiado sob Roma depois de 64 a.C. Jesus foi à região de Tiro e Sidom, e Paulo ficou uma semana com os discípulos ali, a caminho de Jerusalém. Sétimo Severo, que criou a província da Síria Fenícia por volta de 194 d.C., fez de Tiro sua capital e uma colônia romana. Orígenes morreu e foi sepultado ali, Eusébio discursou na dedicação da grande igreja do bispo Paulino por volta de 315, e um concílio de igreja reuniu-se em Tiro em 335."
  de:
    - "Tyrus wurde auf einer felsigen Insel unmittelbar vor der Küste Südphöniziens erbaut, mit einer Stadt auf dem gegenüberliegenden Festland, Uschu, später Alt-Tyrus genannt, die es mit Wasser und Ackerland versorgte. Herodot sagten die Priester der Stadt, sie sei etwa 2300 Jahre vor seinem Besuch gegründet worden, also um 2750 v. Chr., und Sondierungen auf der Insel haben Schichten der Frühbronzezeit erreicht. Im vierzehnten Jahrhundert v. Chr. schrieb sein Herrscher Abimilku in den Amarna-Briefen an den Pharao. Josua nennt es als befestigte Stadt an der Grenze Assers."
    - "Unter Hiram I. im zehnten Jahrhundert v. Chr. führte Tyrus die phönizische Seefahrt an. Die Bibel erzählt, wie Hiram Zedern und Handwerker für Davids Haus und Salomos Tempel sandte, und Josephus beschreibt unter Berufung auf die tyrischen Annalen nach Menander seine Herrschaft. Tyrer gründeten Kolonien im ganzen Mittelmeer, Karthago der Überlieferung nach 814 v. Chr., und wurden reich durch Handel und Purpurfarbstoff. Isebel, die Frau Ahabs, war die Tochter Ethbaals, den die Bibel König der Sidonier und Josephus König der Tyrer und Sidonier nennt."
    - "Tyrus zahlte den assyrischen Königen Tribut, behielt aber seine Insel. Jesaja und Hesekiel sagten seinen Fall voraus, und Hesekiel sagt, das Heer Nebukadnezars habe sich vor Tyrus ohne Lohn aufgerieben. Josephus sagt unter Berufung auf phönizische Aufzeichnungen, die babylonische Belagerung habe dreizehn Jahre gedauert; sie wird meist in die 580er und 570er Jahre v. Chr. datiert. 332 v. Chr. nahm Alexander der Große die Insel nach einer Belagerung von etwa sieben Monaten durch den Bau eines Damms vom Festland; Schwemmsand sammelte sich daran, und Tyrus ist seither mit der Küste verbunden."
    - "Tyrus gewann 126 v. Chr. seine Unabhängigkeit von den Seleukiden und behielt nach 64 v. Chr. unter Rom einen privilegierten Status. Jesus ging in die Gegend von Tyrus und Sidon, und Paulus blieb auf dem Weg nach Jerusalem eine Woche bei den Jüngern dort. Septimius Severus, der um 194 n. Chr. die Provinz Syria Phoenice schuf, machte Tyrus zu ihrer Hauptstadt und zur römischen Kolonie. Origenes starb dort und wurde dort begraben, Eusebius sprach um 315 bei der Weihe der großen Kirche des Bischofs Paulinus, und 335 tagte in Tyrus ein Kirchenkonzil."
  fr:
    - "Tyr fut bâtie sur une île rocheuse juste au large de la côte du sud de la Phénicie, avec en face, sur le continent, une ville, Ouchou, plus tard appelée Vieille Tyr, qui lui fournissait eau et terres cultivables. Les prêtres de Tyr dirent à Hérodote que la ville avait été fondée environ 2 300 ans avant sa visite, soit vers 2750 av. J.-C., et des sondages dans l’île ont atteint des niveaux du bronze ancien. Au XIVe siècle av. J.-C., son souverain Abimilku écrivait au pharaon dans les lettres d’Amarna. Josué la nomme comme la ville forte à la frontière d’Aser."
    - "Sous Hiram Ier, au Xe siècle av. J.-C., Tyr mena la navigation phénicienne. La Bible raconte comment Hiram envoya cèdre et artisans pour la maison de David et le Temple de Salomon, et Josèphe, citant les annales tyriennes rapportées par Ménandre, décrit son règne. Les Tyriens fondèrent des colonies à travers la Méditerranée, Carthage selon la tradition en 814 av. J.-C., et s’enrichirent par le commerce et la teinture de pourpre. Jézabel, femme d’Achab, était la fille d’Ethbaal, que la Bible appelle roi des Sidoniens et Josèphe roi des Tyriens et des Sidoniens."
    - "Tyr paya tribut aux rois assyriens mais garda son île. Ésaïe et Ézéchiel annoncèrent sa chute, et Ézéchiel dit que l’armée de Nebucadnetsar s’épuisa contre Tyr sans salaire. Josèphe, citant des annales phéniciennes, dit que le siège babylonien dura treize ans ; on le date d’ordinaire des années 580 et 570 av. J.-C. En 332 av. J.-C., Alexandre le Grand prit l’île après un siège d’environ sept mois en construisant une digue depuis le continent ; le limon s’y accumula, et Tyr est depuis lors reliée au rivage."
    - "Tyr conquit son indépendance sur les Séleucides en 126 av. J.-C. et garda un statut privilégié sous Rome après 64 av. J.-C. Jésus alla dans la région de Tyr et de Sidon, et Paul demeura une semaine avec les disciples de la ville en allant à Jérusalem. Septime Sévère, qui créa la province de Syrie-Phénicie vers 194 apr. J.-C., fit de Tyr sa capitale et une colonie romaine. Origène y mourut et y fut enterré, Eusèbe parla à la dédicace de la grande église de l’évêque Paulin vers 315, et un concile se réunit à Tyr en 335."
  pl:
    - "Tyr zbudowano na skalistej wyspie tuż przy wybrzeżu południowej Fenicji, z miastem na stałym lądzie naprzeciw, Uszu, zwanym później Starym Tyrem, które dostarczało mu wody i pól uprawnych. Herodotowi kapłani opowiadali, że miasto założono około 2300 lat przed jego wizytą, czyli około 2750 roku p.n.e., a sondaże na wyspie dotarły do warstw wczesnej epoki brązu. W XIV wieku p.n.e. jego władca Abimilki pisał do faraona w listach z Amarna. Jozue wymienia je jako warowne miasto na granicy Aszera."
    - "Pod Hiramem I w X wieku p.n.e. Tyr przewodził fenickiemu żeglarstwu. Biblia opowiada, jak Hiram słał cedr i rzemieślników do domu Dawida i Świątyni Salomona, a Józef Flawiusz, powołując się na roczniki tyryjskie w przekazie Menandra, opisuje jego panowanie. Tyryjczycy zakładali kolonie w całym basenie Morza Śródziemnego, Kartaginę według tradycji w 814 roku p.n.e., i bogacili się na handlu i purpurowym barwniku. Izebel, żona Achaba, była córką Etbaala, którego Biblia nazywa królem Sydończyków, a Józef Flawiusz królem Tyryjczyków i Sydończyków."
    - "Tyr płacił daninę królom asyryjskim, ale zachował swą wyspę. Izajasz i Ezechiel zapowiedzieli jego upadek, a Ezechiel mówi, że wojsko Nabuchodonozora zmęczyło się przeciw Tyrowi bez nagrody. Józef Flawiusz, powołując się na zapisy fenickie, mówi, że babilońskie oblężenie trwało trzynaście lat; datuje się je zwykle na lata osiemdziesiąte i siedemdziesiąte VI wieku p.n.e. W 332 roku p.n.e. Aleksander Wielki zdobył wyspę po oblężeniu trwającym około siedmiu miesięcy, budując groblę od lądu; wzdłuż niej zbierał się muł i Tyr od tego czasu jest połączony z brzegiem."
    - "Tyr wywalczył niepodległość od Seleucydów w 126 roku p.n.e. i zachował uprzywilejowany status pod Rzymem po 64 roku p.n.e. Jezus udał się w strony Tyru i Sydonu, a Paweł spędził tam tydzień z uczniami w drodze do Jerozolimy. Septymiusz Sewer, który około 194 roku n.e. utworzył prowincję Syria Fenicja, uczynił Tyr jej stolicą i rzymską kolonią. Orygenes zmarł tam i został pochowany, Euzebiusz przemawiał na poświęceniu wielkiego kościoła biskupa Paulina około 315 roku, a w 335 roku w Tyrze zebrał się sobór."
  it:
    - "Tiro sorse su un’isola rocciosa appena al largo della costa della Fenicia meridionale, con una città sulla terraferma di fronte, Ushu, poi detta Tiro Vecchia, che le forniva acqua e terre coltivabili. Erodoto seppe dai suoi sacerdoti che la città era stata fondata circa 2.300 anni prima della sua visita, cioè verso il 2750 a.C., e i sondaggi sull’isola hanno raggiunto livelli del Bronzo Antico. Nel XIV secolo a.C. il suo sovrano Abimilku scrisse al Faraone nelle lettere di Amarna. Giosuè la nomina come città fortificata sul confine di Aser."
    - "Sotto Chiram I, nel X secolo a.C., Tiro guidò la navigazione fenicia. La Bibbia racconta come Chiram mandò cedro e artigiani per la casa di Davide e il Tempio di Salomone, e Giuseppe Flavio, citando gli annali tirii secondo Menandro, descrive il suo regno. I Tirii fondarono colonie in tutto il Mediterraneo, Cartagine per tradizione nell’814 a.C., e si arricchirono col commercio e con la porpora. Gezabele, moglie di Acab, era figlia di Et-Baal, che la Bibbia chiama re dei Sidoni e Giuseppe Flavio re dei Tirii e dei Sidoni."
    - "Tiro pagò tributo ai re assiri ma conservò la sua isola. Isaia ed Ezechiele ne predissero la caduta, ed Ezechiele dice che l’esercito di Nabucodonosor si logorò contro Tiro senza compenso. Giuseppe Flavio, citando documenti fenici, dice che l’assedio babilonese durò tredici anni; di solito è datato agli anni 580 e 570 a.C. Nel 332 a.C. Alessandro Magno prese l’isola dopo un assedio di circa sette mesi costruendo un molo dalla terraferma; vi si accumulò il limo, e da allora Tiro è unita alla riva."
    - "Tiro conquistò l’indipendenza dai Seleucidi nel 126 a.C. e mantenne uno status privilegiato sotto Roma dopo il 64 a.C. Gesù andò nella regione di Tiro e di Sidone, e Paolo rimase una settimana con i discepoli di lì durante il viaggio verso Gerusalemme. Settimio Severo, che creò la provincia di Siria Fenicia verso il 194 d.C., fece di Tiro la sua capitale e una colonia romana. Vi morì e vi fu sepolto Origene, Eusebio parlò alla dedicazione della grande chiesa del vescovo Paolino verso il 315, e un concilio si riunì a Tiro nel 335."
  nl:
    - "Tyrus werd gebouwd op een rotsig eiland vlak voor de kust van zuidelijk Fenicië, met aan de overkant op het vasteland een stad, Ushu, later Oud-Tyrus genoemd, die het van water en akkerland voorzag. Herodotus kreeg van de priesters te horen dat de stad ongeveer 2300 jaar vóór zijn bezoek was gesticht, dat is omstreeks 2750 v.Chr., en boringen op het eiland hebben lagen uit de Vroege Bronstijd bereikt. In de veertiende eeuw v.Chr. schreef zijn heerser Abimilku aan Farao in de Amarnabrieven. Jozua noemt het als de versterkte stad op de grens van Aser."
    - "Onder Hiram I in de tiende eeuw v.Chr. was Tyrus de leider van de Fenicische zeevaart. De Bijbel vertelt hoe Hiram ceder en ambachtslieden zond voor het huis van David en de tempel van Salomo, en Flavius Josephus beschrijft, de Tyrische annalen volgens Menander aanhalend, zijn regering. De Tyriërs stichtten kolonies over de hele Middellandse Zee, Carthago volgens de overlevering in 814 v.Chr., en werden rijk door handel en purperverf. Izebel, de vrouw van Achab, was de dochter van Etbaäl, die de Bijbel koning van de Sidoniërs noemt en Flavius Josephus koning van de Tyriërs en Sidoniërs."
    - "Tyrus betaalde schatting aan de Assyrische koningen maar behield zijn eiland. Jesaja en Ezechiël voorspelden zijn val, en Ezechiël zegt dat het leger van Nebukadnessar zich zonder loon tegen Tyrus uitputte. Flavius Josephus zegt, Fenicische bronnen aanhalend, dat het Babylonische beleg dertien jaar duurde; het wordt gewoonlijk gedateerd in de jaren 580 en 570 v.Chr. In 332 v.Chr. nam Alexander de Grote het eiland in na een beleg van ongeveer zeven maanden door een dam vanaf het vasteland aan te leggen; slib verzamelde zich langs de dam, en Tyrus is sindsdien met de kust verbonden."
    - "Tyrus verwierf in 126 v.Chr. zijn onafhankelijkheid van de Seleuciden en behield na 64 v.Chr. onder Rome een bevoorrechte status. Jezus ging naar het gebied van Tyrus en Sidon, en Paulus bleef er een week bij de discipelen op weg naar Jeruzalem. Septimius Severus, die omstreeks 194 n.Chr. de provincie Syria Phoenice instelde, maakte Tyrus tot haar hoofdstad en tot Romeinse kolonie. Origenes stierf en werd er begraven, Eusebius sprak omstreeks 315 bij de inwijding van de grote kerk van bisschop Paulinus, en in 335 kwam in Tyrus een kerkelijke synode bijeen."
  cs:
    - "Týr byl vystavěn na skalnatém ostrově těsně u pobřeží jižní Fénicie, s městem na protilehlé pevnině, Ušu, později zvaným Starý Týr, které mu dodávalo vodu a ornou půdu. Hérodotovi řekli jeho kněží, že město bylo založeno asi 2300 let před jeho návštěvou, tedy kolem roku 2750 př. n. l., a sondy na ostrově dosáhly vrstev rané doby bronzové. Ve 14. stol. př. n. l. psal jeho vládce Abimilku faraonovi v amarnských listech. Jozue ho jmenuje jako opevněné město na hranici Ašera."
    - "Za Chíramovy vlády (Chíram I.) v 10. stol. př. n. l. vedl Týr fénickou mořeplavbu. Bible vypráví, jak Chíram poslal cedr a řemeslníky pro Davidův dům a Šalomounův chrám, a Josephus, citující tyrské annály podle Menandra, popisuje jeho vládu. Tyrští založili kolonie přes celé Středomoří, Kartágo podle tradice roku 814 př. n. l., a zbohatli na obchodu a nachovém barvivu. Jezábel, žena Achabova, byla dcerou Etbaala, jehož Bible nazývá králem Sidonských a Josephus králem Tyrských a Sidonských."
    - "Týr platil tribut asyrským králům, ale podržel svůj ostrov. Izajáš a Ezechiel předpověděli jeho pád a Ezechiel říká, že vojsko Nebukadnesarovo se u Týru vyčerpalo bez odměny. Josephus, citující fénické záznamy, říká, že babylónské obléhání trvalo třináct let; obvykle se datuje do 80. a 70. let 6. stol. př. n. l. V roce 332 př. n. l. dobyl Alexandr Veliký ostrov po asi sedmiměsíčním obléhání stavbou hráze z pevniny; podél ní se usazoval nános a Týr je od té doby spojen s pobřežím."
    - "Týr získal nezávislost na Seleukovcích roku 126 př. n. l. a po roce 64 př. n. l. si pod Římem podržel výsadní postavení. Ježíš šel do kraje Týru a Sidónu a Pavel zůstal týden s tamními učedníky na cestě do Jeruzaléma. Septimius Severus, který kolem roku 194 n. l. zřídil provincii Syria Phoenice, učinil z Týru její hlavní město a římskou kolonii. Órigenés tam zemřel a byl pohřben, Eusebius promluvil při vysvěcení velkého kostela biskupa Paulina kolem roku 315 a roku 335 se v Týru sešel církevní koncil."
  sv:
    - "Tyros byggdes på en klippig ö alldeles utanför södra Feniciens kust, med en stad på fastlandet mittemot, Usu, senare kallad Gamla Tyros, som gav den vatten och åkermark. Herodotos fick av dess präster veta att staden grundats omkring 2 300 år före hans besök, det vill säga omkring 2750 f.Kr., och sondering på ön har nått lager från tidiga bronsåldern. På 1300-talet f.Kr. skrev dess härskare Abimilku till farao i Amarnabreven. Josua nämner den som den befästa staden vid Ashers gräns."
    - "Under Hiram I på 900-talet f.Kr. ledde Tyros den feniciska sjöfarten. Bibeln berättar hur Hiram sände ceder och hantverkare till Davids hus och Salomos tempel, och Josefus, med hänvisning till de tyriska annalerna i Menanders återgivning, beskriver hans regering. Tyrier grundade kolonier över hela Medelhavet, Kartago enligt traditionen 814 f.Kr., och blev rika på handel och purpurfärg. Isebel, Achavs hustru, var dotter till Etbaal, som Bibeln kallar sidoniernas kung och Josefus tyriernas och sidoniernas kung."
    - "Tyros betalade tribut till de assyriska kungarna men behöll sin ö. Jesaja och Hesekiel förutsade dess fall, och Hesekiel säger att Nebukadnessars här slet ut sig mot Tyros utan lön. Josefus, med hänvisning till feniciska handlingar, säger att den babyloniska belägringen varade i tretton år; den dateras vanligen till 580- och 570-talen f.Kr. År 332 f.Kr. intog Alexander den store ön efter en belägring på omkring sju månader genom att bygga en vägbank från fastlandet; sand samlades längs den, och Tyros har sedan dess varit förenat med stranden."
    - "Tyros vann sitt oberoende från seleukiderna 126 f.Kr. och behöll en privilegierad ställning under Rom efter 64 f.Kr. Jesus gick in i trakten av Tyros och Sidon, och Paulus stannade en vecka hos lärjungarna där på väg till Jerusalem. Septimius Severus, som omkring 194 e.Kr. skapade provinsen Syria Phoenice, gjorde Tyros till dess huvudstad och en romersk koloni. Origenes dog och begravdes där, Eusebios talade vid invigningen av biskop Paulinus' stora kyrka omkring 315, och ett kyrkomöte sammanträdde i Tyros 335."
  nb:
    - "Tyros ble bygd på en klippeøy like ved kysten av det sørlige Fønikia, med en by på fastlandet overfor, Ushu, senere kalt Gamle Tyros, som ga den vann og jordbruksland. Herodot fikk høre av prestene der at byen var grunnlagt omkring 2300 år før hans besøk, det vil si omkring 2750 f.Kr., og sonderinger på øya har nådd lag fra tidlig bronsealder. På 1300-tallet f.Kr. skrev herskeren Abimilku til farao i Amarna-brevene. Josva nevner den som den befestede byen på Asjers grense."
    - "Under Hiram I på 900-tallet f.Kr. ledet Tyros den fønikiske sjøfarten. Bibelen forteller hvordan Hiram sendte sedertre og håndverkere til Davids hus og Salomos tempel, og Josefus, som viser til de tyriske annalene slik Menander gjengir dem, beskriver hans regjeringstid. Tyrerne grunnla kolonier over hele Middelhavet, Kartago etter tradisjonen i 814 f.Kr., og ble rike på handel og purpurfarge. Jesabel, Ahabs hustru, var datter av Etbaal, som Bibelen kaller sidoniernes konge og Josefus kaller tyrernes og sidoniernes konge."
    - "Tyros betalte tributt til de assyriske kongene, men beholdt øya sin. Jesaja og Esekiel forutsa fallet, og Esekiel sier at Nebukadnesars hær slet seg ut mot Tyros uten lønn. Josefus, som viser til fønikiske opptegnelser, sier at den babylonske beleiringen varte i tretten år; den dateres vanligvis til 580- og 570-årene f.Kr. I 332 f.Kr. tok Aleksander den store øya etter en beleiring på omkring sju måneder ved å bygge en voll fra fastlandet; slam samlet seg langs den, og Tyros har siden vært forbundet med kysten."
    - "Tyros vant sin uavhengighet fra seleukidene i 126 f.Kr. og beholdt en privilegert status under Roma etter 64 f.Kr. Jesus dro inn i Tyros' og Sidons område, og Paulus ble en uke hos disiplene der på vei til Jerusalem. Septimius Severus, som skapte provinsen Syria Phoenice omkring 194 e.Kr., gjorde Tyros til hovedstad og romersk koloni. Origenes døde og ble gravlagt der, Eusebius talte ved innvielsen av biskop Paulinus' store kirke omkring 315, og et kirkemøte ble holdt i Tyros i 335."
