body:
  en:
    - "Nebo was a town of Moab on the plateau north of the Arnon, near the mountain of the same name from which Moses saw the land; the mountain is a separate place on the map. When the tribes of Reuben and Gad asked for the land east of Jordan they named Nebo among its towns, with Heshbon, Elealeh and Baal-meon, and Reuben rebuilt it, “their names being changed”, perhaps because Nebo was also the name of a Babylonian god. Israel's last camp before the plains of Moab was “in the mountains of Abarim, before Nebo”. The Reubenite Bela “dwelt in Aroer, even unto Nebo and Baal-meon”."
    - "Mesha, king of Moab, tells the rest on his stele: Chemosh said to him, “Go, take Nebo from Israel”; he went by night, fought from daybreak until noon, took the town, killed its seven thousand people as a devotion to Ashtar-Chemosh, and carried the vessels of Yahweh before Chemosh. So in Isaiah's day Nebo was Moabite again, and “Moab shall howl over Nebo, and over Medeba”; Jeremiah's oracle on Moab opens “Woe unto Nebo! for it is spoiled”, and names it again with Dibon and Beth-diblathaim."
    - "Two sites in the hills around Mount Nebo claim the town. Khirbet el-Mukhayyat, on a spur 3 km south-east of the summit, has Iron Age sherds and tombs and the Byzantine village with the churches of Saints Lot and Procopius, of Amos and Casiseus and of Saint George, whose mosaics the Franciscans uncovered from the 1930s; Sylvester Saller and Bellarmino Bagatti published it as “the town of Nebo”. Khirbet Ayun Musa, by the springs of Moses in the valley to the north, is the other candidate; Egeria, probably in 384, was shown the springs and climbed from them to the church on the summit. The Nebo that Eusebius knew as a deserted place near Heshbon is probably Mukhayyat."
    - "Today both lie in the Madaba governorate of Jordan, a few kilometres from the Memorial of Moses on Siyagha, and the mosaics of Mukhayyat are open to visitors."
  ru:
    - "Нево был городом Моава на плато к северу от Арнона, близ одноимённой горы, с которой Моисей видел землю; гора — отдельное место на карте. Когда колена Рувима и Гада просили землю за Иорданом, они назвали Нево среди её городов, вместе с Есевоном, Елеале и Ваал-Меоном, и Рувим отстроил его — города, «которых имена переменены», быть может, потому что Нево было и именем вавилонского бога. Последний стан Израиля перед равнинами Моавитскими был «на горах Аваримских пред Нево». Рувимлянин Бела «обитал в Ароере до Нево и Ваал-Меона»."
    - "Остальное рассказывает на своей стеле Меса, царь Моавитский: Хамос сказал ему: «Иди, возьми Нево у Израиля»; он пошёл ночью, бился от рассвета до полудня, взял город, убил его семь тысяч жителей как посвящение Аштар-Хамосу и отнёс сосуды Яхве пред лицо Хамоса. Так во дни Исаии Нево снова был моавитским, и «Моав рыдает над Нево и Медевою»; пророчество Иеремии о Моаве начинается словами «горе Нево! он опустошен» и называет его снова вместе с Дивоном и Бет-Дивлафаимом."
    - "На город притязают два места в холмах вокруг горы Нево. Хирбет-эль-Мухайят, на отроге в 3 км к юго-востоку от вершины, хранит черепки и гробницы железного века и византийское селение с церквами святых Лота и Прокопия, Амоса и Касисея и святого Георгия, чьи мозаики францисканцы открывали с 1930-х; Сильвестр Саллер и Беллармино Багатти издали его как «город Нево». Хирбет-Аюн-Муса, у источников Моисея в долине к северу, — второй кандидат; Эгерии, вероятно, в 384 году показали источники, и от них она поднялась к церкви на вершине. Нево, которое Евсевий знал как заброшенное место близ Есевона, — вероятно, Мухайят."
    - "Сегодня оба места лежат в провинции Мадаба в Иордании, в нескольких километрах от Мемориала Моисея на Сияге, и мозаики Мухайята открыты для посетителей."
  uk:
    - "Нево було містом Моаву на плато на північ від Арнону, поблизу однойменної гори, з якої Мойсей побачив землю; гора — окреме місце на карті. Коли племена Рувима й Гада попросили землю на схід від Йордану, вони назвали Нево серед її міст разом з Гесбоном, Елеале й Ваал-Меоном, і Рувим його відбудував, «перемінивши їх імена», можливо, тому що Нево було й іменем вавилонського бога. Останній табір Ізраїлю перед моавськими рівнинами був «під Абарим горами на проти Небо». Рувимів Бела «жив ув Ароері до Нево та Баал-Меона»."
    - "Решту розповідає на своїй стелі Меша, цар Моаву: Кемош сказав йому: «Іди, візьми Нево в Ізраїлю»; він пішов уночі, бився від світанку до полудня, взяв місто, вбив його сім тисяч мешканців як присвяту Аштар-Кемошу й забрав посуд Яхве та відніс перед Кемоша. Тож за днів Ісаї Нево знову було моавським, і «Моаб ридає над Набою й Медевою»; пророцтво Єремії про Моав починається словами «Горе Неву-місту! воно спустошене буде» і називає його ще раз разом з Дівоном і Бет-Дівлатаїмом."
    - "Два місця в горах навколо гори Нево претендують на місто. Хірбет-ель-Мухайят, на відрозі за 3 км на південний схід від вершини, має уламки кераміки та гробниці залізної доби й візантійське село з церквами святих Лота й Прокопія, Амоса й Касіза та святого Георгія, мозаїки яких францисканці відкрили з 1930-х років; Сильвестр Саллер і Белларміно Баґатті опублікували його як «місто Нево». Хірбет-Айун-Муса, біля Мойсеєвих джерел у долині на півночі, — другий кандидат; Егерії, ймовірно, 384 року показали ці джерела, і від них вона піднялася до церкви на вершині. Нево, яке Євсевій знав як покинуте місце поблизу Гесбона, ймовірно, Мухайят."
    - "Нині обидва лежать у провінції Мадаба в Йорданії, за кілька кілометрів від Меморіалу Мойсея на Сіяґі, а мозаїки Мухайяту відкриті для відвідувачів."
  es:
    - "Nebo era una ciudad de Moab en la meseta al norte del Arnón, cerca del monte del mismo nombre desde el cual Moisés vio la tierra; el monte es un lugar distinto en el mapa. Cuando las tribus de Rubén y de Gad pidieron la tierra al este del Jordán, nombraron Nebo entre sus ciudades, con Hesbón, Eleale y Baal-meón, y Rubén la reedificó, «mudados los nombres», quizá porque Nebo era también el nombre de un dios babilonio. El último campamento de Israel antes de las llanuras de Moab fue «en los montes de Abarim, delante de Nebo». El rubenita Bela «habitó en Aroer hasta Nebo y Baal-meón»."
    - "Mesa, rey de Moab, cuenta el resto en su estela: Quemós le dijo: «Ve, toma Nebo a Israel»; fue de noche, combatió desde el amanecer hasta el mediodía, tomó la ciudad, mató a sus siete mil habitantes como consagración a Astar-Quemós y llevó los vasos de Yahvé ante Quemós. Así, en tiempos de Isaías, Nebo volvía a ser moabita, y «sobre Nebo y sobre Medeba aullará Moab»; el oráculo de Jeremías sobre Moab comienza: «¡Ay de Nebo! que fué destruída», y la nombra de nuevo con Dibón y Bet-diblataim."
    - "Dos lugares en las colinas alrededor del monte Nebo reclaman la ciudad. Khirbet el-Mukhayyat, en un espolón a 3 km al sureste de la cumbre, tiene fragmentos cerámicos y tumbas de la Edad del Hierro y la aldea bizantina con las iglesias de los santos Lot y Procopio, de Amós y Casiseo y de san Jorge, cuyos mosaicos sacaron a la luz los franciscanos desde la década de 1930; Silvestre Saller y Bellarmino Bagatti la publicaron como «la ciudad de Nebo». Khirbet Ayun Musa, junto a las fuentes de Moisés en el valle del norte, es el otro candidato; Egeria, probablemente en 384, vio las fuentes y subió desde ellas a la iglesia de la cumbre. El Nebo que Eusebio conocía como lugar desierto cerca de Hesbón es probablemente Mukhayyat."
    - "Hoy ambos se encuentran en la gobernación de Madaba, en Jordania, a pocos kilómetros del Memorial de Moisés en Siyagha, y los mosaicos de Mukhayyat están abiertos a los visitantes."
  pt:
    - "Nebo era uma cidade de Moabe no planalto ao norte do Arnom, perto do monte de mesmo nome de onde Moisés viu a terra; o monte é um lugar à parte no mapa. Quando as tribos de Rúben e Gade pediram a terra a leste do Jordão, citaram Nebo entre as suas cidades, com Hesbom, Eleale e Baal-Meom, e Rúben a reconstruiu, “tendo seus nomes mudados”, talvez porque Nebo fosse também o nome de um deus babilônico. O último acampamento de Israel antes das planícies de Moabe foi “nas montanhas de Abarim, diante de Nebo”. O rubenita Bela “habitou em Aroer, até Nebo e Baal-Meom”."
    - "Mesa, rei de Moabe, conta o resto em sua estela: Camos lhe disse: “Vai, toma Nebo de Israel”; ele foi de noite, lutou do amanhecer até o meio-dia, tomou a cidade, matou seus sete mil habitantes como dedicação a Ashtar-Camos e levou os vasos de Javé diante de Camos. Assim, no tempo de Isaías, Nebo era de novo moabita, e “Moabe lamenta sobre Nebo e sobre Medeba”; o oráculo de Jeremias sobre Moabe abre com “Ai de Nebo! Pois está devastada”, e a cita outra vez com Dibom e Bete-Diblataim."
    - "Dois sítios nas colinas ao redor do Monte Nebo reivindicam a cidade. Khirbet el-Mukhayyat, num esporão a 3 km a sudeste do cume, tem cacos e túmulos da Idade do Ferro e a aldeia bizantina com as igrejas dos Santos Ló e Procópio, de Amós e Cásiseo e de São Jorge, cujos mosaicos os franciscanos descobriram a partir da década de 1930; Silvestre Saller e Bellarmino Bagatti a publicaram como “a cidade de Nebo”. Khirbet Ayun Musa, junto às fontes de Moisés no vale ao norte, é o outro candidato; Egéria, provavelmente em 384, viu as fontes e subiu delas até a igreja do cume. O Nebo que Eusébio conheceu como lugar deserto perto de Hesbom é provavelmente Mukhayyat."
    - "Hoje ambos ficam na província de Madaba, na Jordânia, a poucos quilômetros do Memorial de Moisés em Siyagha, e os mosaicos de Mukhayyat estão abertos à visitação."
  de:
    - "Nebo war eine Stadt Moabs auf der Hochfläche nördlich des Arnon, nahe dem gleichnamigen Berg, von dem aus Mose das Land sah; der Berg ist auf der Karte ein eigener Ort. Als die Stämme Ruben und Gad das Land östlich des Jordan erbaten, nannten sie Nebo unter seinen Städten, mit Heschbon, Elale und Baal-Meon, und Ruben baute es wieder auf, wobei sie „die Namen änderten“, vielleicht weil Nebo auch der Name eines babylonischen Gottes war. Israels letztes Lager vor den Steppen Moabs war „in dem Gebirge Abarim vor dem Nebo“. Der Rubenit Bela „wohnte zu Aroer und bis gen Nebo und Baal-Meon“."
    - "Den Rest erzählt Mesa, der König von Moab, auf seiner Stele: Kemosch sprach zu ihm: „Geh, nimm Nebo von Israel“; er zog bei Nacht aus, kämpfte vom Morgengrauen bis zum Mittag, nahm die Stadt, erschlug ihre siebentausend Einwohner als Bann für Aschtar-Kemosch und trug die Gefäße Jahwes vor Kemosch her. So war Nebo zu Jesajas Zeit wieder moabitisch, und Moab werde „heulen über Nebo und Medeba“; Jeremias Weissagung gegen Moab beginnt mit „Weh der Stadt Nebo! denn sie ist zerstört“ und nennt es wieder mit Dibon und Bet-Diblatajim."
    - "Zwei Stätten in den Hügeln um den Berg Nebo beanspruchen die Stadt. Chirbet el-Mucheijat, auf einem Ausläufer 3 km südöstlich des Gipfels, hat Scherben und Gräber der Eisenzeit sowie das byzantinische Dorf mit den Kirchen der Heiligen Lot und Prokop, von Amos und Kasiseos und des heiligen Georg, deren Mosaiken die Franziskaner seit den 1930er Jahren freilegten; Sylvester Saller und Bellarmino Bagatti veröffentlichten sie als „die Stadt Nebo“. Chirbet Ajun Musa bei den Mosequellen im Tal weiter nördlich ist der andere Kandidat; Egeria wurden wahrscheinlich 384 die Quellen gezeigt, und von dort stieg sie zur Kirche auf dem Gipfel. Das Nebo, das Eusebius als verlassenen Ort bei Heschbon kannte, ist wahrscheinlich Mucheijat."
    - "Heute liegen beide im Gouvernement Madaba in Jordanien, wenige Kilometer von der Mose-Gedenkstätte auf dem Siyagha entfernt, und die Mosaiken von Mucheijat sind für Besucher geöffnet."
  fr:
    - "Nebo était une ville de Moab, sur le plateau au nord de l’Arnon, près de la montagne du même nom d’où Moïse vit le pays ; la montagne est un lieu distinct sur la carte. Quand les tribus de Ruben et de Gad demandèrent le pays à l’est du Jourdain, elles nommèrent Nebo parmi ses villes, avec Hesbon, Élealé et Baal-Meon, et Ruben la rebâtit, « dont les noms furent changés », peut-être parce que Nebo était aussi le nom d’un dieu babylonien. Le dernier campement d’Israël avant les plaines de Moab fut « aux montagnes d’Abarim, devant Nebo ». Le Rubénite Béla « habitait à Aroër, et jusqu’à Nebo et à Baal-Meon »."
    - "Mescha, roi de Moab, raconte la suite sur sa stèle : Kemosch lui dit : « Va, prends Nebo à Israël » ; il y alla de nuit, combattit de l’aube jusqu’à midi, prit la ville, tua ses sept mille habitants en les vouant à Ashtar-Kemosch, et emporta les vases de Yahvé devant Kemosch. Aussi, du temps d’Ésaïe, Nebo était de nouveau moabite : « Moab est en lamentations, sur Nebo et sur Médeba » ; l’oracle de Jérémie sur Moab s’ouvre par « Malheur à Nebo, car elle est ravagée ! » et la nomme encore avec Dibon et Beth-Diblathaïm."
    - "Deux sites des collines autour du mont Nebo revendiquent la ville. Khirbet el-Mukhayyat, sur un éperon à 3 km au sud-est du sommet, a livré des tessons et des tombes de l’âge du Fer et le village byzantin avec les églises des saints Lot et Procope, d’Amos et Casiséus et de saint Georges, dont les franciscains mirent au jour les mosaïques dès les années 1930 ; Sylvester Saller et Bellarmino Bagatti l’ont publié comme « la ville de Nebo ». Khirbet Ayun Musa, près des sources de Moïse dans la vallée au nord, est l’autre candidat ; probablement en 384, on montra les sources à Égérie, qui monta de là à l’église du sommet. Le Nebo qu’Eusèbe connaissait comme un lieu désert près de Hesbon est probablement Mukhayyat."
    - "Aujourd’hui, les deux se trouvent dans le gouvernorat de Madaba, en Jordanie, à quelques kilomètres du Mémorial de Moïse sur Siyagha, et les mosaïques de Mukhayyat sont ouvertes aux visiteurs."
  it:
    - "Nebo era una città di Moab sull’altopiano a nord dell’Arnon, vicino al monte omonimo da cui Mosè vide la terra; il monte è un luogo distinto sulla mappa. Quando le tribù di Ruben e di Gad chiesero la terra a est del Giordano, nominarono Nebo tra le sue città, con Chesbon, Eleale e Baal-Meon, e Ruben la ricostruì, «i cui nomi furon mutati», forse perché Nebo era anche il nome di un dio babilonese. L’ultimo accampamento di Israele prima delle pianure di Moab fu «ai monti d’Abarim dirimpetto a Nebo». Il rubenita Bela «dimorava ad Aroer e si estendeva fino a Nebo ed a Baal-Meon»."
    - "Il resto lo racconta Mesa, re di Moab, sulla sua stele: Camos gli disse: «Va’, prendi Nebo a Israele»; egli andò di notte, combatté dall’alba fino a mezzogiorno, prese la città, uccise i suoi settemila abitanti votandoli ad Ashtar-Camos e portò i vasi di Yahweh davanti a Camos. Così ai tempi di Isaia Nebo era di nuovo moabita, e «Moab urla su Nebo e su Medeba»; l’oracolo di Geremia su Moab si apre con «Guai a Nebo! poiché è devastata», e la nomina ancora con Dibon e Bet-Diblataim."
    - "Due siti sulle colline attorno al Monte Nebo rivendicano la città. Khirbet el-Mukhayyat, su uno sperone 3 km a sud-est della cima, ha cocci e tombe dell’età del Ferro e il villaggio bizantino con le chiese dei Santi Lot e Procopio, di Amos e Casiseo e di San Giorgio, i cui mosaici furono portati alla luce dai Francescani dagli anni 1930; Sylvester Saller e Bellarmino Bagatti lo pubblicarono come «The Town of Nebo». Khirbet Ayun Musa, presso le sorgenti di Mosè nella valle a nord, è l’altro candidato; probabilmente nel 384 a Egeria furono mostrate le sorgenti ed ella salì da lì alla chiesa sulla vetta. Il Nebo che Eusebio conosceva come luogo deserto presso Chesbon è probabilmente Mukhayyat."
    - "Oggi entrambi si trovano nel governatorato di Màdaba, in Giordania, a pochi chilometri dal Memoriale di Mosè a Siyagha, e i mosaici di Mukhayyat sono aperti ai visitatori."
  pl:
    - "Nebo było miastem Moabu na płaskowyżu na północ od Arnonu, w pobliżu góry o tej samej nazwie, z której Mojżesz ujrzał ziemię; góra jest na mapie osobnym miejscem. Gdy pokolenia Rubena i Gada prosiły o ziemię na wschód od Jordanu, wymieniły Nebo wśród jej miast, obok Cheszbonu, Eleale i Baal-Meonu, a Ruben odbudował je, „odmieniwszy im imiona”, być może dlatego, że Nebo było też imieniem babilońskiego boga. Ostatni obóz Izraela przed równinami Moabu leżał „na górach Abarym, przeciwko Nebo”. Rubenita Bela „mieszkał w Aroer aż ku Nebo i Baalmeon”."
    - "Resztę opowiada na swojej steli Mesza, król Moabu: Kemosz rzekł do niego: „Idź, zabierz Nebo Izraelowi”; poszedł w nocy, walczył od świtu do południa, zdobył miasto, wymordował jego siedem tysięcy mieszkańców jako ofiarę dla Asztar-Kemosza i zaniósł naczynia Jahwe przed Kemosza. Tak w dniach Izajasza Nebo znów było moabickie i „nad Nebo, i nad Medebą Moab kwilić będzie”; wyrocznia Jeremiasza o Moabie zaczyna się od słów „Biada miastu Nebo, bo spustoszone będzie” i wymienia je ponownie obok Dibonu i Bet-Diblataim."
    - "O miano miasta ubiegają się dwa stanowiska we wzgórzach wokół góry Nebo. Chirbet el-Mukhajjat, na ostrodze 3 km na południowy wschód od szczytu, ma skorupy i groby z epoki żelaza oraz bizantyńską wieś z kościołami świętych Lota i Prokopa, Amosa i Kasyzeusza oraz świętego Jerzego, których mozaiki franciszkanie odsłonili od lat trzydziestych XX wieku; Sylvester Saller i Bellarmino Bagatti opublikowali ją jako „The Town of Nebo”. Drugim kandydatem jest Chirbet Ajun Musa, przy źródłach Mojżesza w dolinie na północy; Egerii prawdopodobnie w 384 roku pokazano te źródła i wspięła się od nich do kościoła na szczycie. Nebo, które Euzebiusz znał jako miejsce opuszczone w pobliżu Cheszbonu, to prawdopodobnie Mukhajjat."
    - "Dziś oba leżą w muhafazie Madaba w Jordanii, kilka kilometrów od Memoriału Mojżesza na Sijaga, a mozaiki z Mukhajjat są dostępne dla zwiedzających."
  cs:
    - "Nebo bylo město v Moábu na náhorní plošině severně od Arnonu, poblíž stejnojmenné hory, z níž Mojžíš spatřil zemi; hora je na mapě samostatné místo. Když pokolení Rúben a Gád žádala o zemi na východ od Jordánu, jmenovala Nebo mezi jejími městy, vedle Chešbónu, Elale a Báal-meónu, a Rúben je znovu vystavěl, „změnivše jim jména“, snad proto, že Nebo bylo také jménem babylónského boha. Poslední tábor Izraele před moábskými pláněmi byl „na horách Abarim proti Nébo“. Rúbenec Bela „bydlil v Aroer až do Nébo a Balmeon“."
    - "Zbytek vypráví na své stéle moábský král Meša: Kemoš mu řekl: „Jdi, dobyj Nebo od Izraele“; šel v noci, bojoval od svítání do poledne, město dobyl, jeho sedm tisíc lidí zabil jako zasvěcení Aštar-Kemošovi a nádoby Jahveho odnesl před Kemoše. Tak bylo Nebo za Izajášových dnů opět moábské a „nad Nébo a nad Medaba Moáb kvíliti bude“; Jeremjášova věštba o Moábu začíná „Běda městu Nébo, neboť popléněno bude“ a jmenuje je znovu s Dibonem a Bét-diblatajimem."
    - "Na město si činí nárok dvě místa v pahorcích kolem hory Nebo. Chirbet el-Mucchajjat, na ostrohu 3 km jihovýchodně od vrcholu, má střepy a hrobky z doby železné a byzantskou vesnici s kostely svatých Lota a Prokopia, Amose a Kasiszea a svatého Jiří, jejichž mozaiky františkáni odkryli od 30. let 20. století; Sylvester Saller a Bellarmino Bagatti je zveřejnili jako „město Nebo“. Chirbet Ajún Músa u Mojžíšových pramenů v údolí na severu je druhým kandidátem; Egerie byla pravděpodobně roku 384 k pramenům zavedena a od nich vystoupila ke kostelu na vrcholu. Nebo, které Eusebius znal jako opuštěné místo poblíž Chešbónu, je pravděpodobně Mucchajjat."
    - "Dnes obě leží v guvernorátu Mádaba v Jordánsku, několik kilometrů od Mojžíšova památníku na Sijáze, a mozaiky v Mucchajjatu jsou přístupné návštěvníkům."
  nl:
    - "Nebo was een stad van Moab op het plateau ten noorden van de Arnon, bij de gelijknamige berg vanwaar Mozes het land zag; de berg is op de kaart een aparte plaats. Toen de stammen Ruben en Gad om het land ten oosten van de Jordaan vroegen, noemden zij Nebo onder de steden daar, met Chesbon, Eleale en Baäl-Meon, en Ruben herbouwde haar, “veranderd zijnde van naam”, misschien omdat Nebo ook de naam van een Babylonische god was. Israëls laatste kamp vóór de vlakten van Moab lag “in de bergen Abarim, tegen Nebo”. De Rubeniet Bela “woonde te Aroër, en tot aan Nebo, en Baäl-Meon”."
    - "De rest vertelt Mesa, koning van Moab, op zijn stele: Kemos zei tot hem: “Ga, neem Nebo van Israël”; hij trok ’s nachts op, streed van de dageraad tot de middag, nam de stad in, doodde haar zevenduizend bewoners als ban voor Astar-Kemos en voerde de voorwerpen van JHWH voor Kemos weg. Zo was Nebo in de dagen van Jesaja weer Moabitisch, en “over Nebo en over Medeba zal Moab huilen”; Jeremia’s godsspraak over Moab opent met “Wee over Nebo, want zij is verstoord”, en noemt haar opnieuw met Dibon en Beth-Diblataïm."
    - "Twee plaatsen in de heuvels rond de berg Nebo maken aanspraak op de stad. Khirbet el-Mukhayyat, op een uitloper 3 km ten zuidoosten van de top, heeft scherven en graven uit de ijzertijd en het Byzantijnse dorp met de kerken van de heiligen Lot en Procopius, van Amos en Casiseus en van Sint-Joris, waarvan de franciscanen vanaf de jaren 1930 de mozaïeken blootlegden; Sylvester Saller en Bellarmino Bagatti publiceerden het als “de stad Nebo”. Khirbet Ayun Musa, bij de bronnen van Mozes in de vallei ten noorden, is de andere kandidaat; Egeria kreeg waarschijnlijk in 384 de bronnen te zien en klom daarvandaan naar de kerk op de top. Het Nebo dat Eusebius kende als een verlaten plaats bij Chesbon is waarschijnlijk Mukhayyat."
    - "Beide liggen tegenwoordig in het gouvernement Madaba in Jordanië, enkele kilometers van het Gedenkteken van Mozes op de Siyagha, en de mozaïeken van Mukhayyat zijn voor bezoekers geopend."
  sv:
    - "Nebo var en stad i Moab på platån norr om Arnon, nära berget med samma namn varifrån Mose såg landet; berget är en särskild plats på kartan. När Rubens och Gads stammar bad om landet öster om Jordan nämnde de Nebo bland dess städer, tillsammans med Heshbon, Elale och Baal-Meon, och Ruben byggde upp det, och städernas ”namn hava ändrats”, kanske därför att Nebo också var namnet på en babylonisk gud. Israels sista läger före Moabs hedar låg ”vid Abarimbergen, framför Nebo”. Om rubeniten Bela heter det: ”han bodde i Aroer, och hans boningsplatser nådde ända till Nebo och Baal-Meon”."
    - "Mesa, Moabs kung, berättar resten på sin stele: Kemosh sade till honom: ”Gå, ta Nebo från Israel”; han gick på natten, stred från gryningen till middagstid, intog staden, dödade dess sjutusen invånare som ett bann åt Ashtar-Kemosh och förde Jahves kärl fram inför Kemosh. Så var Nebo åter moabitiskt på Jesajas tid, och ”uppe i Nebo och Medeba jämrar sig Moab”; Jeremias orakel över Moab inleds med ”Ve över Nebo, ty det är förstört!” och nämner det på nytt tillsammans med Dibon och Bet-Divlatajim."
    - "Två platser i bergen kring berget Nebo gör anspråk på staden. Khirbet el-Mukhayyat, på en udde 3 km sydost om toppen, har skärvor och gravar från järnåldern och den bysantinska byn med kyrkorna för helgonen Lot och Prokopios, för Amos och Kasiseus samt för Sankt Georg, vilkas mosaiker franciskanerna avtäckte från 1930-talet; Sylvester Saller och Bellarmino Bagatti publicerade den som ”staden Nebo”. Khirbet Ayun Musa, vid Moses källor i dalen i norr, är den andra kandidaten; Egeria fick, troligen 384, se källorna och steg från dem upp till kyrkan på toppen. Det Nebo som Eusebios kände som en öde plats nära Heshbon är sannolikt Mukhayyat."
    - "I dag ligger båda i guvernementet Madaba i Jordanien, några kilometer från Moses-minnesmärket på Siyagha, och Mukhayyats mosaiker är öppna för besökare."
  nb:
    - "Nebo var en by i Moab på platået nord for Arnon, nær fjellet med samme navn som Moses så landet fra; fjellet er et eget sted på kartet. Da stammene Ruben og Gad ba om landet øst for Jordan, nevnte de Nebo blant byene, med Hesjbon, Elale og Baal-Meon, og Ruben bygde den opp igjen, «hvis navn blev forandret», kanskje fordi Nebo også var navnet på en babylonsk gud. Israels siste leir før Moabs sletter lå «ved Abarim-fjellene, foran Nebo». Rubenitten Bela «bodde i Aroer og helt til Nebo og Ba'al-Meon»."
    - "Mesa, Moabs konge, forteller resten på sin stele: Kemosj sa til ham: «Gå, ta Nebo fra Israel»; han dro om natten, kjempet fra daggry til middag, inntok byen, drepte dens syv tusen innbyggere som en bannlysning til Astar-Kemosj og bar Jahves kar fram for Kemosj. Så på Jesajas tid var Nebo igjen moabittisk, og «på Nebo og på Medeba skal Moab hyle»; Jeremias spådom mot Moab åpner «Ve over Nebo, for det er ødelagt», og nevner det igjen sammen med Dibon og Bet-Diblatajim."
    - "To steder i åsene rundt Nebo-fjellet gjør krav på byen. Khirbet el-Mukhayyat, på en utløper 3 km sørøst for toppen, har skår og graver fra jernalderen og den bysantinske landsbyen med kirkene for de hellige Lot og Prokopios, for Amos og Kasiseus og for den hellige Georg, hvis mosaikker franziskanerne avdekket fra 1930-årene; Sylvester Saller og Bellarmino Bagatti publiserte den som «The Town of Nebo». Khirbet Ayun Musa, ved Moses' kilder i dalen i nord, er den andre kandidaten; Egeria, trolig i 384, ble vist kildene og gikk opp fra dem til kirken på toppen. Det Nebo som Eusebius kjente som et øde sted nær Hesjbon, er trolig Mukhayyat."
    - "I dag ligger begge i guvernementet Madaba i Jordan, noen få kilometer fra Moses-minnesmerket på Siyagha, og mosaikkene i Mukhayyat er åpne for besøkende."
  tl:
    - "Ang Nebo ay isang bayan ng Moab sa talampas sa hilaga ng Arnon, malapit sa bundok na may gayon ding pangalan kung saan nakita ni Moises ang lupain; ang bundok ay hiwalay na lugar sa mapa. Nang humingi ang mga lipi ni Ruben at Gad ng lupain sa silangan ng Jordan, pinangalanan nila ang Nebo sa mga bayan nito, kasama ang Hesbon, Eleale at Baal-meon, at itinayo itong muli ni Ruben, “na ang pangalan ng mga yaon ay binago”, marahil dahil ang Nebo ay pangalan din ng isang diyos na Babilonio. Ang huling kampo ng Israel bago ang mga kapatagan ng Moab ay “sa mga bundok ng Abarim, sa harap ng Nebo”. Si Bela na Rubenita ay “tumatahan sa Aroer, hanggang sa Nebo at Baal-meon”."
    - "Isinasalaysay ni Mesa, hari ng Moab, ang iba pa sa kaniyang estela: sinabi sa kaniya ni Chemos, “Yumaon ka, kunin mo ang Nebo mula sa Israel”; yumaon siya nang gabi, lumaban mula sa pagbubukang-liwayway hanggang tanghali, kinuha ang bayan, pinatay ang pitong libong tao nito bilang pagtatalaga kay Ashtar-Chemos, at dinala ang mga sisidlan ni Yahweh sa harap ni Chemos. Kaya sa kapanahunan ni Isaias ay Moabita muli ang Nebo, at “ang Moab ay umaangal sa Nebo, at sa Medeba”; ang orakulo ni Jeremias tungkol sa Moab ay nagsisimula sa “Sa aba ng Nebo! sapagka't nalagay na sira”, at pinangalanan itong muli kasama ng Dibon at Beth-diblathaim."
    - "Dalawang lugar sa mga burol sa palibot ng Bundok Nebo ang umaangkin sa bayan. Ang Khirbet el-Mukhayyat, sa isang sanga ng bundok 3 km sa timog-silangan ng tuktok, ay may mga basag na palayok at libingan mula sa Panahong Bakal at ang nayong Bisantino na may mga simbahan ng mga Santo Lot at Procopio, nina Amos at Casiseus at ni San Jorge, na ang mga mosaiko ay inilantad ng mga Pransiskano mula noong dekada 1930; inilathala ito nina Sylvester Saller at Bellarmino Bagatti bilang “the town of Nebo”. Ang Khirbet Ayun Musa, sa tabi ng mga bukal ni Moises sa libis sa hilaga, ang kabilang kandidato; ipinakita kay Egeria ang mga bukal, marahil noong 384, at umakyat siya mula roon patungo sa simbahan sa tuktok. Ang Nebo na kilala ni Eusebio bilang isang lugar na pinabayaan malapit sa Hesbon ay marahil ang Mukhayyat."
    - "Sa ngayon, ang dalawa ay nasa Gobernorato ng Madaba sa Jordan, ilang kilometro mula sa Memorial ni Moises sa Siyagha, at bukás sa mga bisita ang mga mosaiko ng Mukhayyat."
  da:
    - "Nebo var en by i Moab på højsletten nord for Arnon, nær bjerget af samme navn, hvorfra Moses så landet; bjerget er et særskilt sted på kortet. Da stammerne Ruben og Gad bad om landet øst for Jordan, nævnte de Nebo blandt dets byer sammen med Hesjbon, El'ale og Ba'al-Meon, og Ruben genopbyggede den, »som de forandrede Navnene paa«, måske fordi Nebo også var navnet på en babylonisk gud. Israels sidste lejr før Moabs sletter var »ved Abarims Bjerge, foran Nebo«. Rubeniten Bela »boede i Aroer og indtil Nebo og Baal-Meon«."
    - "Mesja, Moabs konge, fortæller resten på sin stele: Kemosj sagde til ham: »Gå, tag Nebo fra Israel«; han gik om natten, kæmpede fra daggry til middag, indtog byen, dræbte dens syv tusind indbyggere som et bandlysningsoffer til Ashtar-Kemosj og bar Jahves kar frem for Kemosj. Så i Esajas' dage var Nebo igen moabitisk, og »paa Nebo og paa Medba hyler Moab«; Jeremias' udsagn mod Moab begynder »Ve, Nebo! thi den er ødelagt« og nævner den igen sammen med Dibon og Bet-Diblatajim."
    - "To steder i bjergene omkring Nebo-bjerget gør krav på byen. Khirbet el-Mukhayyat, på en udløber 3 km sydøst for toppen, har jernaldersherver og grave og den byzantinske landsby med kirkerne for Sankt Lot og Prokopius, for Amos og Kasiseus og for Sankt Georg, hvis mosaikker franciskanerne afdækkede fra 1930'erne; Sylvester Saller og Bellarmino Bagatti offentliggjorde den som »byen Nebo«. Khirbet Ayun Musa, ved Moses' kilder i dalen mod nord, er den anden kandidat; Egeria blev sandsynligvis i 384 vist kilderne og steg fra dem op til kirken på toppen. Det Nebo, som Eusebius kendte som et forladt sted nær Hesjbon, er sandsynligvis Mukhayyat."
    - "I dag ligger begge i Madaba-guvernementet i Jordan, få kilometer fra Mindesmærket for Moses på Siyagha, og Mukhayyats mosaikker er åbne for besøgende."
  sr:
    - "Нево је био град Моава на висоравни северно од Арнона, близу истоимене планине са које је Мојсије видео земљу; планина је на карти посебно место. Кад су племена Рувимово и Гадово тражила земљу источно од Јордана, именовала су Нево међу њеним градовима, с Есевоном, Елеалијом и Вал-Меоном, а Рувим га је обновио „преденувши им имена“, можда зато што је Нево било и име једног вавилонског бога. Последњи израиљски логор пред пољем моавским био је „у планинама аваримским према Нававу“. Рувимовац Вела „живљаше у Ароиру и до Невона и Валмеона“."
    - "Остало казује на својој стели Миса, цар Моава: Хамос му је рекао: „Иди, узми Нево од Израиља“; он је отишао ноћу, борио се од свитања до подне, заузео град, побио његових седам хиљада становника као заветну жртву Аштар-Хамосу и однео посуђе Јахвеово пред Хамоса. Тако је у Исаијино доба Нево поново био моавски, и „Моав ће ридати за Невоном и за Медевом“; Јеремијино пророштво о Моаву започиње: „Тешко Невону! Јер ће се опустошити“, и поново га наводи с Девоном и Вет-Девлатајимом."
    - "Два места у брдима око горе Нево траже град за себе. Хирбет ел-Мухајат, на огранку 3 км југоисточно од врха, има делове керамике и гробнице гвозденог доба и византијско село с црквама светог Лота и Прокопија, Амоса и Касисеја и светог Ђорђа, чије су мозаике фрањевци открили од 1930-их; Силвестар Салер и Белармино Багати објавили су га као „град Нево“. Хирбет Ајун Муса, поред Мојсијевих извора у долини на северу, други је кандидат; Егерији су, вероватно 384, показани извори и она се од њих попела до цркве на врху. Нево који је Јевсевије знао као напуштено место код Есевона вероватно је Мухајат."
    - "Данас оба леже у мадабском гувернорату Јордана, неколико километара од Споменика Мојсију на Сијаги, а мозаици Мухајата су отворени за посетиоце."
