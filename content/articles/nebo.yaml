# Overview article (ADR 0007). Mainstream facts only; the town of Nebo, not the mountain, which is a separate record on the map; the two candidate sites are given without choosing.
id: nebo
place: ab5bd29
title:
  en: "Nebo"
  ru: "Нево"
  uk: "Нево"
  es: "Nebo"
  pt: "Nebo"
  de: "Nebo"
  fr: "Nebo"
body:
  en:
    - "Nebo was a town of Moab on the plateau north of the Arnon, near the mountain of the same name from which Moses saw the land; the mountain is a separate place on the map. When the tribes of Reuben and Gad asked for the land east of Jordan they named Nebo among its towns, with Heshbon, Elealeh and Baal-meon, and Reuben rebuilt it, “their names being changed”, perhaps because Nebo was also the name of a Babylonian god. Israel's last camp before the plains of Moab was “in the mountains of Abarim, before Nebo”. The Reubenite Bela “dwelt in Aroer, even unto Nebo and Baal-meon”."
    - "Mesha, king of Moab, tells the rest on his stele: Chemosh said to him, “Go, take Nebo from Israel”; he went by night, fought from daybreak until noon, took the town, killed its seven thousand people as a devotion to Ashtar-Chemosh, and carried the vessels of Yahweh before Chemosh. So in Isaiah's day Nebo was Moabite again, and “Moab shall howl over Nebo, and over Medeba”; Jeremiah's oracle on Moab opens “Woe unto Nebo! for it is spoiled”, and names it again with Dibon and Beth-diblathaim."
    - "Two sites in the hills around Mount Nebo claim the town. Khirbet el-Mukhayyat, on a spur 3 km south-east of the summit, has Iron Age sherds and tombs and the Byzantine village with the churches of Saints Lot and Procopius, of Amos and Casiseus and of Saint George, whose mosaics the Franciscans uncovered from the 1930s; Sylvester Saller and Bellarmino Bagatti published it as “the town of Nebo”. Khirbet Ayun Musa, by the springs of Moses in the valley to the north, is the other candidate; Egeria in 384 was shown the springs and climbed from them to the church on the summit. The Nebo that Eusebius knew as a deserted place near Heshbon is probably Mukhayyat."
    - "Today both lie in the Madaba governorate of Jordan, a few kilometres from the Memorial of Moses on Siyagha, and the mosaics of Mukhayyat are open to visitors."
  ru:
    - "Нево был городом Моава на плато к северу от Арнона, близ одноимённой горы, с которой Моисей видел землю; гора — отдельное место на карте. Когда колена Рувима и Гада просили землю за Иорданом, они назвали Нево среди её городов, вместе с Есевоном, Елеале и Ваал-Меоном, и Рувим отстроил его — города, «которых имена переменены», быть может, потому что Нево было и именем вавилонского бога. Последний стан Израиля перед равнинами Моавитскими был «на горах Аваримских пред Нево». Рувимлянин Бела «обитал в Ароере до Нево и Ваал-Меона»."
    - "Остальное рассказывает на своей стеле Меса, царь Моавитский: Хамос сказал ему: «Иди, возьми Нево у Израиля»; он пошёл ночью, бился от рассвета до полудня, взял город, убил его семь тысяч жителей как посвящение Аштар-Хамосу и отнёс сосуды Яхве пред лицо Хамоса. Так во дни Исаии Нево снова был моавитским, и «Моав рыдает над Нево и Медевою»; пророчество Иеремии о Моаве начинается словами «горе Нево! он опустошен» и называет его снова вместе с Дивоном и Бет-Дивлафаимом."
    - "На город притязают два места в холмах вокруг горы Нево. Хирбет-эль-Мухайят, на отроге в 3 км к юго-востоку от вершины, хранит черепки и гробницы железного века и византийское селение с церквами святых Лота и Прокопия, Амоса и Касисея и святого Георгия, чьи мозаики францисканцы открывали с 1930-х; Сильвестр Саллер и Беллармино Багатти издали его как «город Нево». Хирбет-Аюн-Муса, у источников Моисея в долине к северу, — второй кандидат; Эгерии в 384 году показали источники, и от них она поднялась к церкви на вершине. Нево, которое Евсевий знал как заброшенное место близ Есевона, — вероятно, Мухайят."
    - "Сегодня оба места лежат в провинции Мадаба в Иордании, в нескольких километрах от Мемориала Моисея на Сияге, и мозаики Мухайята открыты для посетителей."
  uk:
    - "Нево було містом Моаву на плато на північ від Арнону, поблизу однойменної гори, з якої Мойсей побачив землю; гора — окреме місце на карті. Коли племена Рувима й Гада попросили землю на схід від Йордану, вони назвали Нево серед її міст разом з Гесбоном, Елеале й Ваал-Меоном, і Рувим його відбудував, «перемінивши їх імена», можливо, тому що Нево було й іменем вавилонського бога. Останній табір Ізраїлю перед моавськими рівнинами був «під Абарим горами на проти Небо». Рувимів Бела «жив ув Ароері до Нево та Баал-Меона»."
    - "Решту розповідає на своїй стелі Меша, цар Моаву: Кемош сказав йому: «Іди, візьми Нево в Ізраїлю»; він пішов уночі, бився від світанку до полудня, взяв місто, вбив його сім тисяч мешканців як присвяту Аштар-Кемошу й забрав посуд Яхве та відніс перед Кемоша. Тож за днів Ісаї Нево знову було моавським, і «Моаб ридає над Набою й Медевою»; пророцтво Єремії про Моав починається словами «Горе Неву-місту! воно спустошене буде» і називає його ще раз разом з Дівоном і Бет-Дівлатаїмом."
    - "Два місця в горах навколо гори Нево претендують на місто. Хірбет-ель-Мухайят, на відрозі за 3 км на південний схід від вершини, має уламки кераміки та гробниці залізної доби й візантійське село з церквами святих Лота й Прокопія, Амоса й Касіза та святого Георгія, мозаїки яких францисканці відкрили з 1930-х років; Сильвестр Саллер і Белларміно Баґатті опублікували його як «місто Нево». Хірбет-Айун-Муса, біля Мойсеєвих джерел у долині на півночі, — другий кандидат; Егерії 384 року показали ці джерела, і від них вона піднялася до церкви на вершині. Нево, яке Євсевій знав як покинуте місце поблизу Гесбона, ймовірно, Мухайят."
    - "Нині обидва лежать у провінції Мадаба в Йорданії, за кілька кілометрів від Меморіалу Мойсея на Сіяґі, а мозаїки Мухайяту відкриті для відвідувачів."
  es:
    - "Nebo era una ciudad de Moab en la meseta al norte del Arnón, cerca del monte del mismo nombre desde el cual Moisés vio la tierra; el monte es un lugar distinto en el mapa. Cuando las tribus de Rubén y de Gad pidieron la tierra al este del Jordán, nombraron Nebo entre sus ciudades, con Hesbón, Eleale y Baal-meón, y Rubén la reedificó, «mudados los nombres», quizá porque Nebo era también el nombre de un dios babilonio. El último campamento de Israel antes de las llanuras de Moab fue «en los montes de Abarim, delante de Nebo». El rubenita Bela «habitó en Aroer hasta Nebo y Baal-meón»."
    - "Mesa, rey de Moab, cuenta el resto en su estela: Quemós le dijo: «Ve, toma Nebo a Israel»; fue de noche, combatió desde el amanecer hasta el mediodía, tomó la ciudad, mató a sus siete mil habitantes como consagración a Astar-Quemós y llevó los vasos de Yahvé ante Quemós. Así, en tiempos de Isaías, Nebo volvía a ser moabita, y «sobre Nebo y sobre Medeba aullará Moab»; el oráculo de Jeremías sobre Moab comienza: «¡Ay de Nebo! que fué destruída», y la nombra de nuevo con Dibón y Bet-diblataim."
    - "Dos lugares en las colinas alrededor del monte Nebo reclaman la ciudad. Khirbet el-Mukhayyat, en un espolón a 3 km al sureste de la cumbre, tiene fragmentos cerámicos y tumbas de la Edad del Hierro y la aldea bizantina con las iglesias de los santos Lot y Procopio, de Amós y Casiseo y de san Jorge, cuyos mosaicos sacaron a la luz los franciscanos desde la década de 1930; Silvestre Saller y Bellarmino Bagatti la publicaron como «la ciudad de Nebo». Khirbet Ayun Musa, junto a las fuentes de Moisés en el valle del norte, es el otro candidato; Egeria, en 384, vio las fuentes y subió desde ellas a la iglesia de la cumbre. El Nebo que Eusebio conocía como lugar desierto cerca de Hesbón es probablemente Mukhayyat."
    - "Hoy ambos se encuentran en la gobernación de Madaba, en Jordania, a pocos kilómetros del Memorial de Moisés en Siyagha, y los mosaicos de Mukhayyat están abiertos a los visitantes."
  pt:
    - "Nebo era uma cidade de Moabe no planalto ao norte do Arnom, perto do monte de mesmo nome de onde Moisés viu a terra; o monte é um lugar à parte no mapa. Quando as tribos de Rúben e Gade pediram a terra a leste do Jordão, citaram Nebo entre as suas cidades, com Hesbom, Eleale e Baal-Meom, e Rúben a reconstruiu, “tendo seus nomes mudados”, talvez porque Nebo fosse também o nome de um deus babilônico. O último acampamento de Israel antes das planícies de Moabe foi “nas montanhas de Abarim, diante de Nebo”. O rubenita Bela “habitou em Aroer, até Nebo e Baal-Meom”."
    - "Mesa, rei de Moabe, conta o resto em sua estela: Camos lhe disse: “Vai, toma Nebo de Israel”; ele foi de noite, lutou do amanhecer até o meio-dia, tomou a cidade, matou seus sete mil habitantes como dedicação a Ashtar-Camos e levou os vasos de Javé diante de Camos. Assim, no tempo de Isaías, Nebo era de novo moabita, e “Moabe lamenta sobre Nebo e sobre Medeba”; o oráculo de Jeremias sobre Moabe abre com “Ai de Nebo! Pois está devastada”, e a cita outra vez com Dibom e Bete-Diblataim."
    - "Dois sítios nas colinas ao redor do Monte Nebo reivindicam a cidade. Khirbet el-Mukhayyat, num esporão a 3 km a sudeste do cume, tem cacos e túmulos da Idade do Ferro e a aldeia bizantina com as igrejas dos Santos Ló e Procópio, de Amós e Cásiseo e de São Jorge, cujos mosaicos os franciscanos descobriram a partir da década de 1930; Silvestre Saller e Bellarmino Bagatti a publicaram como “a cidade de Nebo”. Khirbet Ayun Musa, junto às fontes de Moisés no vale ao norte, é o outro candidato; Egéria, em 384, viu as fontes e subiu delas até a igreja do cume. O Nebo que Eusébio conheceu como lugar deserto perto de Hesbom é provavelmente Mukhayyat."
    - "Hoje ambos ficam na província de Madaba, na Jordânia, a poucos quilômetros do Memorial de Moisés em Siyagha, e os mosaicos de Mukhayyat estão abertos à visitação."
  de:
    - "Nebo war eine Stadt Moabs auf der Hochfläche nördlich des Arnon, nahe dem gleichnamigen Berg, von dem aus Mose das Land sah; der Berg ist auf der Karte ein eigener Ort. Als die Stämme Ruben und Gad das Land östlich des Jordan erbaten, nannten sie Nebo unter seinen Städten, mit Heschbon, Elale und Baal-Meon, und Ruben baute es wieder auf, wobei sie „die Namen änderten“, vielleicht weil Nebo auch der Name eines babylonischen Gottes war. Israels letztes Lager vor den Steppen Moabs war „in dem Gebirge Abarim vor dem Nebo“. Der Rubenit Bela „wohnte zu Aroer und bis gen Nebo und Baal-Meon“."
    - "Den Rest erzählt Mesa, der König von Moab, auf seiner Stele: Kemosch sprach zu ihm: „Geh, nimm Nebo von Israel“; er zog bei Nacht aus, kämpfte vom Morgengrauen bis zum Mittag, nahm die Stadt, erschlug ihre siebentausend Einwohner als Bann für Aschtar-Kemosch und trug die Gefäße Jahwes vor Kemosch her. So war Nebo zu Jesajas Zeit wieder moabitisch, und Moab werde „heulen über Nebo und Medeba“; Jeremias Weissagung gegen Moab beginnt mit „Weh der Stadt Nebo! denn sie ist zerstört“ und nennt es wieder mit Dibon und Bet-Diblatajim."
    - "Zwei Stätten in den Hügeln um den Berg Nebo beanspruchen die Stadt. Chirbet el-Mucheijat, auf einem Ausläufer 3 km südöstlich des Gipfels, hat Scherben und Gräber der Eisenzeit sowie das byzantinische Dorf mit den Kirchen der Heiligen Lot und Prokop, von Amos und Kasiseos und des heiligen Georg, deren Mosaiken die Franziskaner seit den 1930er Jahren freilegten; Sylvester Saller und Bellarmino Bagatti veröffentlichten sie als „die Stadt Nebo“. Chirbet Ajun Musa bei den Mosequellen im Tal weiter nördlich ist der andere Kandidat; Egeria wurden 384 die Quellen gezeigt, und von dort stieg sie zur Kirche auf dem Gipfel. Das Nebo, das Eusebius als verlassenen Ort bei Heschbon kannte, ist wahrscheinlich Mucheijat."
    - "Heute liegen beide im Gouvernement Madaba in Jordanien, wenige Kilometer von der Mose-Gedenkstätte auf dem Siyagha entfernt, und die Mosaiken von Mucheijat sind für Besucher geöffnet."
  fr:
    - "Nebo était une ville de Moab, sur le plateau au nord de l’Arnon, près de la montagne du même nom d’où Moïse vit le pays ; la montagne est un lieu distinct sur la carte. Quand les tribus de Ruben et de Gad demandèrent le pays à l’est du Jourdain, elles nommèrent Nebo parmi ses villes, avec Hesbon, Élealé et Baal-Meon, et Ruben la rebâtit, « dont les noms furent changés », peut-être parce que Nebo était aussi le nom d’un dieu babylonien. Le dernier campement d’Israël avant les plaines de Moab fut « aux montagnes d’Abarim, devant Nebo ». Le Rubénite Béla « habitait à Aroër, et jusqu’à Nebo et à Baal-Meon »."
    - "Mescha, roi de Moab, raconte la suite sur sa stèle : Kemosch lui dit : « Va, prends Nebo à Israël » ; il y alla de nuit, combattit de l’aube jusqu’à midi, prit la ville, tua ses sept mille habitants en les vouant à Ashtar-Kemosch, et emporta les vases de Yahvé devant Kemosch. Aussi, du temps d’Ésaïe, Nebo était de nouveau moabite : « Moab est en lamentations, sur Nebo et sur Médeba » ; l’oracle de Jérémie sur Moab s’ouvre par « Malheur à Nebo, car elle est ravagée ! » et la nomme encore avec Dibon et Beth-Diblathaïm."
    - "Deux sites des collines autour du mont Nebo revendiquent la ville. Khirbet el-Mukhayyat, sur un éperon à 3 km au sud-est du sommet, a livré des tessons et des tombes de l’âge du Fer et le village byzantin avec les églises des saints Lot et Procope, d’Amos et Casiséus et de saint Georges, dont les franciscains mirent au jour les mosaïques dès les années 1930 ; Sylvester Saller et Bellarmino Bagatti l’ont publié comme « la ville de Nebo ». Khirbet Ayun Musa, près des sources de Moïse dans la vallée au nord, est l’autre candidat ; en 384, on montra les sources à Égérie, qui monta de là à l’église du sommet. Le Nebo qu’Eusèbe connaissait comme un lieu désert près de Hesbon est probablement Mukhayyat."
    - "Aujourd’hui, les deux se trouvent dans le gouvernorat de Madaba, en Jordanie, à quelques kilomètres du Mémorial de Moïse sur Siyagha, et les mosaïques de Mukhayyat sont ouvertes aux visiteurs."
