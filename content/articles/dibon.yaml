body:
  en:
    - "Dibon lay in Moab, east of the Dead Sea and a few kilometres north of the Arnon gorge, on a mound beside the modern town of Dhiban in Jordan, where the King's Highway passed. Excavations by the American Schools of Oriental Research in the 1950s and, since 2004, by the Dhiban Excavation and Development Project have found traces of settlement in the Early Bronze Age, in the third millennium BC, and a sizeable town of the Iron Age."
    - 'In Numbers, the old song about Heshbon, the city of Sihon, king of the Amorites, says that "Heshbon is perished even unto Dibon"; Israel then took the land, the children of Gad built Dibon, and on the way through the wilderness Israel camped at Dibon-gad. Joshua assigns Dibon to Reuben. In Isaiah and Jeremiah it is again a town of Moab, mourning in the oracles against that land.'
    - "In August 1868 the missionary F. A. Klein was shown a basalt stele lying among the ruins of Dhiban. Before it could be taken away, local Bedouin broke it to pieces, but a paper squeeze made for Charles Clermont-Ganneau allowed the text to be restored, and the stone is now in the Louvre. In it Mesha, king of Moab, the Dibonite, says that Omri, king of Israel, and his son had oppressed Moab, that he took back the land, captured Ataroth and Nebo, and in Qarhoh, usually taken to be the royal quarter of Dibon, built walls, gates, towers, a palace and reservoirs, with Israelite prisoners put to the digging. 2 Kings tells how Mesha rebelled against Israel after the death of Ahab."
    - "Little is known of Dibon in the Persian and Hellenistic periods. From the middle of the first century BC it belonged to the Nabataeans, who built a temple there, and in AD 106 it passed with the rest of the Nabataean kingdom into the Roman province of Arabia. Early in the fourth century Eusebius knew Dibon as a very large village near the Arnon. Excavations have uncovered a bath house and two churches of the late Roman and Byzantine periods."
  ru:
    - "Дивон находился в Моаве, к востоку от Мёртвого моря и в нескольких километрах к северу от ущелья Арнона, на холме рядом с современным городком Дибан в Иордании, у которого проходила Царская дорога. Раскопки Американских школ восточных исследований в 1950-х годах и, с 2004 года, Дибанского проекта раскопок и развития обнаружили следы поселения раннего бронзового века, III тысячелетия до н. э., и значительный город железного века."
    - "В книге Чисел древняя песнь о Есевоне, городе Сигона, царя Аморрейского, говорит: «погиб Есевон до Дивона»; затем этой землёй овладел Израиль, сыны Гадовы построили Дивон, а на пути через пустыню Израиль стоял станом в Дивон-Гаде. Книга Иисуса Навина отдаёт Дивон Рувиму. У Исаии и Иеремии он снова город Моава, оплакивающий себя в пророчествах против этой земли."
    - "В августе 1868 года миссионеру Ф. А. Клейну показали базальтовую стелу, лежавшую среди развалин Дибана. Прежде чем её успели увезти, местные бедуины разбили её на куски, но бумажный оттиск, снятый для Шарля Клермон-Ганно, позволил восстановить текст, и камень теперь хранится в Лувре. В надписи Меса, царь Моавитский, дивонитянин, говорит, что Амврий, царь Израильский, и его сын угнетали Моав, что он вернул землю, взял Атароф и Нево, а в Кархо, которое обычно считают царским кварталом Дивона, построил стены, ворота, башни, дворец и водоёмы, а копать заставил израильских пленников. Четвёртая книга Царств рассказывает, как Меса отложился от Израиля после смерти Ахава."
    - "О Дивоне в персидское и эллинистическое время известно мало. С середины I века до н. э. он принадлежал набатеям, построившим здесь храм, а в 106 г. н. э. он вместе со всем Набатейским царством вошёл в римскую провинцию Аравия. В начале IV века Евсевий знал Дивон как очень большое селение близ Арнона. Раскопки открыли баню и две церкви позднеримского и византийского времени."
  uk:
    - "Дівон лежав у Моаві, на схід від Мертвого моря й за кілька кілометрів на північ від ущелини Арнону, на горбі поряд із сучасним містом Дхібан в Йорданії, де проходила Царська дорога. Розкопки Американських шкіл східних досліджень у 1950-х рр. і, від 2004 р., Проєкту розкопок і розвитку Дхібана знайшли сліди поселення в ранню бронзову добу, в III тис. до н. е., і значне місто залізної доби."
    - "У Книзі Чисел стара пісня про Гесбон, місто Сігона, царя аморіїв, каже: «Зруйновали ми осади Гесбон до Дибону»; Ізраїль тоді взяв землю, сини Гада збудували Дівон, а на шляху пустелею Ізраїль отаборився в Дівон-Гаді. Ісус Навин відводить Дівон Рувимові. В Ісаї та Єремії він знову місто Моаву, що оплакує долю в оракулах проти цієї землі."
    - "У серпні 1868 р. місіонерові Ф. А. Кляйну показали базальтову стелу, що лежала серед руїн Дхібана. Перш ніж її можна було забрати, місцеві бедуїни розбили її на шматки, але паперовий відбиток, зроблений для Шарля Клермона-Ганно, дав змогу відновити текст, і камінь нині в Луврі. У ньому Меша, цар Моаву, дівонець, каже, що Омрі, цар Ізраїлю, і його син гнобили Моав, що він повернув землю, здобув Атарот і Нево, а в Карха, яку зазвичай вважають царським кварталом Дівона, збудував мури, брами, башти, палац і водосховища, а ізраїльські полонені копали. 2 Книга Царів розповідає, як Меша збунтувався проти Ізраїлю по смерті Ахава."
    - "Про Дівон у персидський та елліністичний періоди відомо мало. Від середини I ст. до н. е. він належав набатеям, які збудували там храм, а в 106 р. н. е. разом з рештою Набатейського царства перейшов до римської провінції Аравія. На початку IV ст. Євсевій знав Дівон як дуже велике село поблизу Арнону. Розкопки відкрили лазню та дві церкви пізньоримського й візантійського періодів."
  es:
    - "Dibón se hallaba en Moab, al este del mar Muerto y a pocos kilómetros al norte de la garganta del Arnón, en un montículo junto a la actual ciudad de Dhiban, en Jordania, por donde pasaba el Camino Real. Las excavaciones de las Escuelas Americanas de Investigación Oriental en la década de 1950 y, desde 2004, del Proyecto de Excavación y Desarrollo de Dhiban han hallado huellas de población en la Edad del Bronce Antiguo, en el tercer milenio a. C., y una ciudad considerable de la Edad del Hierro."
    - "En Números, el antiguo canto sobre Hesbón, la ciudad de Sehón, rey de los amorreos, dice que «pereció Hesbón hasta Dibón»; Israel tomó entonces la tierra, los hijos de Gad edificaron Dibón, y en el camino por el desierto Israel acampó en Dibón-gad. Josué asigna Dibón a Rubén. En Isaías y Jeremías vuelve a ser una ciudad de Moab, que se lamenta en los oráculos contra esa tierra."
    - "En agosto de 1868 se mostró al misionero F. A. Klein una estela de basalto que yacía entre las ruinas de Dhiban. Antes de que pudiera ser retirada, los beduinos locales la rompieron en pedazos, pero un calco en papel hecho para Charles Clermont-Ganneau permitió restaurar el texto, y la piedra está hoy en el Louvre. En ella Mesa, rey de Moab, el dibonita, dice que Omri, rey de Israel, y su hijo habían oprimido a Moab, que él recuperó la tierra, capturó Atarot y Nebo y, en Qarhoh, que suele tenerse por el barrio real de Dibón, construyó murallas, puertas, torres, un palacio y depósitos de agua, con prisioneros israelitas puestos a cavar. 2 Reyes cuenta cómo Mesa se rebeló contra Israel tras la muerte de Acab."
    - "Poco se sabe de Dibón en los periodos persa y helenístico. Desde mediados del siglo I a. C. perteneció a los nabateos, que construyeron allí un templo, y en el 106 d. C. pasó con el resto del reino nabateo a la provincia romana de Arabia. A comienzos del siglo IV Eusebio conocía Dibón como una aldea muy grande cerca del Arnón. Las excavaciones han sacado a la luz unos baños y dos iglesias de las épocas romana tardía y bizantina."
  pt:
    - "Dibom ficava em Moabe, a leste do Mar Morto e a poucos quilômetros ao norte da garganta do Arnom, num monte junto à atual cidade de Dhiban, na Jordânia, por onde passava a Estrada Real. Escavações das Escolas Americanas de Pesquisa Oriental na década de 1950 e, desde 2004, do Projeto de Escavação e Desenvolvimento de Dhiban encontraram vestígios de ocupação na Idade do Bronze Antigo, no terceiro milênio a.C., e uma cidade considerável da Idade do Ferro."
    - "Em Números, a antiga canção sobre Hesbom, a cidade de Seom, rei dos amorreus, diz que “Hesbom pereceu até Dibom”; Israel tomou então a terra, os filhos de Gade construíram Dibom, e no caminho pelo deserto Israel acampou em Dibom-Gade. Josué atribui Dibom a Rúben. Em Isaías e Jeremias ela é de novo uma cidade de Moabe, em luto nos oráculos contra aquela terra."
    - "Em agosto de 1868, o missionário F. A. Klein foi levado a ver uma estela de basalto caída entre as ruínas de Dhiban. Antes que pudesse ser levada, beduínos locais a quebraram em pedaços, mas uma impressão em papel feita para Charles Clermont-Ganneau permitiu restaurar o texto, e a pedra está agora no Louvre. Nela, Mesa, rei de Moabe, o dibonita, diz que Onri, rei de Israel, e seu filho haviam oprimido Moabe, que ele recuperou a terra, tomou Atarote e Nebo e, em Qarhoh, geralmente tido como o bairro real de Dibom, construiu muros, portões, torres, um palácio e reservatórios, com prisioneiros israelitas postos a escavar. 2 Reis conta como Mesa se rebelou contra Israel depois da morte de Acabe."
    - "Pouco se sabe de Dibom nos períodos persa e helenístico. Desde meados do século I a.C. pertenceu aos nabateus, que ali construíram um templo, e em 106 d.C. passou, com o resto do reino nabateu, à província romana da Arábia. No início do século IV, Eusébio conhecia Dibom como uma aldeia muito grande perto do Arnom. As escavações trouxeram à luz uma casa de banhos e duas igrejas dos períodos romano tardio e bizantino."
  de:
    - "Dibon lag in Moab, östlich des Toten Meeres und wenige Kilometer nördlich der Arnonschlucht, auf einem Hügel neben der heutigen Stadt Dhiban in Jordanien, wo die Königsstraße vorbeiführte. Ausgrabungen der American Schools of Oriental Research in den 1950er Jahren und seit 2004 des Dhiban Excavation and Development Project haben Spuren von Besiedlung in der Frühen Bronzezeit im 3. Jahrtausend v. Chr. und eine ansehnliche Stadt der Eisenzeit gefunden."
    - "In den Numeri sagt das alte Lied über Heschbon, die Stadt Sihons, des Königs der Amoriter: „Ihre Herrlichkeit ist zunichte worden von Hesbon bis gen Dibon“; Israel nahm dann das Land, die Kinder Gad bauten Dibon, und auf dem Zug durch die Wüste lagerte Israel in Dibon-Gad. Josua teilt Dibon Ruben zu. Bei Jesaja und Jeremia ist es wieder eine Stadt Moabs, die in den Orakeln gegen dieses Land trauert."
    - "Im August 1868 wurde dem Missionar F. A. Klein eine Basaltstele gezeigt, die zwischen den Ruinen von Dhiban lag. Ehe sie weggebracht werden konnte, zerschlugen sie einheimische Beduinen in Stücke, doch ein Papierabklatsch, den man für Charles Clermont-Ganneau angefertigt hatte, ermöglichte die Wiederherstellung des Textes, und der Stein befindet sich heute im Louvre. Darin sagt Mesa, König von Moab, der Dibonit, Omri, der König von Israel, und sein Sohn hätten Moab bedrückt, er habe das Land zurückgenommen, Atarot und Nebo erobert und in Karcha, gewöhnlich für das Königsviertel von Dibon gehalten, Mauern, Tore, Türme, einen Palast und Wasserbecken gebaut, wobei israelitische Gefangene zum Graben eingesetzt worden seien. Das 2. Buch der Könige erzählt, wie Mesa nach dem Tod Ahabs gegen Israel rebellierte."
    - "Über Dibon in der Perserzeit und der hellenistischen Zeit ist wenig bekannt. Ab der Mitte des 1. Jahrhunderts v. Chr. gehörte es den Nabatäern, die dort einen Tempel bauten, und im Jahr 106 n. Chr. ging es mit dem übrigen nabatäischen Königreich in die römische Provinz Arabien über. Anfang des 4. Jahrhunderts kannte Eusebius Dibon als sehr großes Dorf nahe dem Arnon. Ausgrabungen haben ein Badehaus und zwei Kirchen der spätrömischen und byzantinischen Zeit freigelegt."
  fr:
    - "Dibon se trouvait en Moab, à l’est de la mer Morte et à quelques kilomètres au nord de la gorge de l’Arnon, sur un tertre à côté de la ville moderne de Dhiban, en Jordanie, là où passait la route royale. Les fouilles des American Schools of Oriental Research dans les années 1950 et, depuis 2004, du Dhiban Excavation and Development Project ont trouvé des traces d’occupation à l’âge du Bronze ancien, au IIIe millénaire av. J.-C., et une ville importante de l’âge du Fer."
    - "Dans les Nombres, le vieux chant sur Hesbon, la ville de Sihon, roi des Amoréens, dit : « De Hesbon à Dibon tout est détruit » ; Israël prit ensuite le pays, les fils de Gad bâtirent Dibon, et sur la route à travers le désert Israël campa à Dibon-Gad. Josué attribue Dibon à Ruben. Chez Ésaïe et Jérémie, c’est de nouveau une ville de Moab, en deuil dans les oracles contre ce pays."
    - "En août 1868, le missionnaire F. A. Klein se vit montrer une stèle de basalte gisant parmi les ruines de Dhiban. Avant qu’on pût l’emporter, des Bédouins du lieu la brisèrent en morceaux, mais un estampage sur papier fait pour Charles Clermont-Ganneau permit de restituer le texte, et la pierre est aujourd’hui au Louvre. Mescha, roi de Moab, le Dibonite, y dit qu’Omri, roi d’Israël, et son fils avaient opprimé Moab, qu’il reprit le pays, s’empara d’Atharoth et de Nebo, et construisit à Qarhoh, généralement tenue pour le quartier royal de Dibon, remparts, portes, tours, un palais et des réservoirs, avec des prisonniers israélites mis aux travaux de terrassement. 2 Rois raconte comment Mescha se révolta contre Israël après la mort d’Achab."
    - "On sait peu de choses de Dibon aux époques perse et hellénistique. À partir du milieu du Ier siècle av. J.-C., elle appartint aux Nabatéens, qui y bâtirent un temple, et en 106 apr. J.-C. elle passa avec le reste du royaume nabatéen dans la province romaine d’Arabie. Au début du IVe siècle, Eusèbe connaissait Dibon comme un très grand village près de l’Arnon. Les fouilles ont mis au jour un bain et deux églises des époques romaine tardive et byzantine."
  it:
    - "Dibon sorgeva in Moab, a est del Mar Morto e pochi chilometri a nord della gola dell’Arnon, su un tell accanto alla moderna Dhiban in Giordania, dove passava la Via del Re. Gli scavi delle American Schools of Oriental Research negli anni 1950 e, dal 2004, del Dhiban Excavation and Development Project hanno trovato tracce di insediamento nel Bronzo Antico, nel III millennio a.C., e una città di dimensioni considerevoli dell’età del Ferro."
    - "In Numeri l’antico canto su Chesbon, la città di Sicon, re degli Amorei, dice che «Heshbon è distrutta fino a Dibon»; Israele prese allora il paese, i figli di Gad costruirono Dibon, e durante il cammino nel deserto Israele si accampò a Dibon-Gad. Giosuè assegna Dibon a Ruben. In Isaia e in Geremia è di nuovo una città di Moab, in lutto negli oracoli contro quel paese."
    - "Nell’agosto del 1868 il missionario F. A. Klein vide una stele di basalto fra le rovine di Dhiban. Prima che potesse essere portata via, i beduini del luogo la ruppero in pezzi, ma uno stampo di carta fatto per Charles Clermont-Ganneau permise di restaurare il testo, e la pietra è ora al Louvre. In essa Mesa, re di Moab, il Dibonita, dice che Omri, re d’Israele, e suo figlio avevano oppresso Moab, che egli riprese la terra, prese Atarot e Nebo, e a Qarhoh, di solito ritenuto il quartiere reale di Dibon, costruì mura, porte, torri, un palazzo e serbatoi, impiegando prigionieri israeliti negli scavi. 2 Re racconta come Mesa si ribellò a Israele dopo la morte di Acab."
    - "Poco si sa di Dibon nei periodi persiano ed ellenistico. Dalla metà del I secolo a.C. appartenne ai Nabatei, che vi costruirono un tempio, e nel 106 d.C. passò con il resto del regno nabateo nella provincia romana d’Arabia. All’inizio del IV secolo Eusebio conosceva Dibon come un villaggio molto grande presso l’Arnon. Gli scavi hanno portato alla luce un bagno e due chiese del periodo tardo romano e bizantino."
  pl:
    - "Dibon leżało w Moabie, na wschód od Morza Martwego i kilka kilometrów na północ od wąwozu Arnonu, na kopcu obok dzisiejszego miasta Dhiban w Jordanii, przy którym przebiegała Droga Królewska. Wykopaliska Amerykańskich Szkół Badań Orientalnych w latach pięćdziesiątych XX w. oraz, od 2004 r., Dhiban Excavation and Development Project odsłoniły ślady osadnictwa we wczesnej epoce brązu, w III tysiącleciu p.n.e., i spore miasto z epoki żelaza."
    - "W Księdze Liczb stara pieśń o Cheszbonie, mieście Sychona, króla Amorytów, mówi: „A zaginęło panowanie ich od Hesebona aż do Dybona”; Izrael zajął potem tę ziemię, synowie Gada zbudowali Dibon, a w drodze przez pustynię Izrael obozował w Dibon-Gad. Jozue przydziela Dibon Rubenowi. U Izajasza i Jeremiasza jest ono znowu miastem Moabu, lamentującym w wyroczniach przeciw temu krajowi."
    - "W sierpniu 1868 r. misjonarzowi F. A. Kleinowi pokazano bazaltową stelę leżącą wśród ruin Dhiban. Zanim zdołano ją zabrać, miejscowi Beduini rozbili ją na kawałki, lecz papierowy odcisk wykonany dla Charlesa Clermont-Ganneau pozwolił odtworzyć tekst, a kamień znajduje się dziś w Luwrze. Mesza, król Moabu, Dibończyk, mówi w nim, że Omri, król Izraela, i jego syn gnębili Moab, że odzyskał ziemię, zdobył Atarot i Nebo, a w Karchoh, uważanym zwykle za dzielnicę królewską Dibon, zbudował mury, bramy, wieże, pałac i zbiorniki, wykorzystując do kopania izraelskich jeńców. Druga Księga Królewska opowiada, jak Mesza zbuntował się przeciw Izraelowi po śmierci Achaba."
    - "O Dibon w okresie perskim i hellenistycznym wiadomo niewiele. Od połowy I w. p.n.e. należało do Nabatejczyków, którzy zbudowali tam świątynię, a w 106 r. n.e. wraz z resztą królestwa nabatejskiego weszło do rzymskiej prowincji Arabii. Na początku IV w. Euzebiusz znał Dibon jako bardzo dużą wieś koło Arnonu. Wykopaliska odsłoniły łaźnię i dwa kościoły z późnego okresu rzymskiego i bizantyjskiego."
  nl:
    - "Dibon lag in Moab, ten oosten van de Dode Zee en een paar kilometer ten noorden van de Arnonkloof, op een heuvel naast de moderne stad Dhiban in Jordanië, waar de Koningsweg liep. Opgravingen van de American Schools of Oriental Research in de jaren 1950 en, sinds 2004, van het Dhiban Excavation and Development Project hebben sporen van bewoning gevonden uit de Vroege Bronstijd, in het derde millennium v.Chr., en een aanzienlijke stad uit de IJzertijd."
    - "In Numeri zegt het oude lied over Chesbon, de stad van Sihon, koning van de Amorieten: “Hesbon is verloren tot Dibon toe”; Israël nam daarna het land in, de kinderen van Gad bouwden Dibon, en op de tocht door de woestijn legerde Israël zich te Dibon-Gad. Jozua wijst Dibon toe aan Ruben. In Jesaja en Jeremia is het weer een stad van Moab, die in de orakels tegen dat land rouwt."
    - "In augustus 1868 kreeg zendeling F.A. Klein een basalten stèle te zien tussen de ruïnes van Dhiban. Voordat zij kon worden weggehaald, braken plaatselijke bedoeïenen haar in stukken, maar een papieren afdruk voor Charles Clermont-Ganneau maakte herstel van de tekst mogelijk, en de steen staat nu in het Louvre. Daarin zegt Mesa, koning van Moab, de Dibonieter, dat Omri, koning van Israël, en zijn zoon Moab hadden onderdrukt, dat hij het land heroverde, Atarot en Nebo innam en in Qarchoh, gewoonlijk gezien als het koninklijk kwartier van Dibon, muren, poorten, torens, een paleis en reservoirs bouwde, met Israëlitische gevangenen aan het graven. 2 Koningen vertelt hoe Mesa na Achabs dood tegen Israël opstond."
    - "Over Dibon in de Perzische en hellenistische tijd is weinig bekend. Vanaf het midden van de eerste eeuw v.Chr. behoorde het aan de Nabateeërs, die er een tempel bouwden, en in 106 n.Chr. ging het met de rest van het Nabateese koninkrijk over in de Romeinse provincie Arabië. In het begin van de 4e eeuw kende Eusebius Dibon als een zeer groot dorp bij de Arnon. Opgravingen hebben een badhuis en twee kerken uit de late Romeinse en Byzantijnse tijd blootgelegd."
  cs:
    - "Dibon ležel v Moábu, východně od Mrtvého moře a několik kilometrů severně od soutěsky Arnonu, na pahorku vedle dnešního města Dhiban v Jordánsku, kudy procházela Královská cesta. Vykopávky Amerických škol orientálního bádání v 50. letech a od roku 2004 projektu Dhiban Excavation and Development Project nalezly stopy osídlení v rané době bronzové, ve 3. tisíciletí př. n. l., a značné město z doby železné."
    - "V Numeri praví stará píseň o Chešbónu, městě Sichona, krále Amorejců, že „království jejich zahynulo od Ezebon až do Dibon“; Izrael pak zemi vzal, synové Gádovi vzdělali Dibon a na cestě pouští se Izrael utábořil v Dibon-gadu. Jozue přiděluje Dibon Rúbenovi. U Izajáše a Jeremjáše je opět městem Moábu, truchlícím ve věštbách proti té zemi."
    - "V srpnu 1868 byla misionáři F. A. Kleinovi ukázána čedičová stéla ležící mezi zříceninami Dhibanu. Než ji bylo možné odvézt, místní beduíni ji rozbili na kusy, ale papírový otisk pořízený pro Charlese Clermont-Ganneaua umožnil text obnovit a kámen je nyní v Louvru. Meša, král Moábu, Dibonský, v něm říká, že Omrí, král Izraele, a jeho syn utiskovali Moáb, že zemi získal zpět, dobyl Atarót a Nebo a v Qarhoh, které se obvykle pokládá za královskou čtvrť Dibonu, postavil hradby, brány, věže, palác a nádrže, přičemž izraelští zajatci byli nasazeni na kopání. Druhá kniha Královská vypráví, jak se Meša po smrti Achabově vzbouřil proti Izraeli."
    - "O Dibonu v perském a helénistickém období se ví málo. Od poloviny 1. století př. n. l. patřil Nabatejcům, kteří tam postavili chrám, a roku 106 n. l. přešel s ostatkem nabatejského království do římské provincie Arábie. Na počátku 4. století znal Eusebios Dibon jako velmi velkou vesnici u Arnonu. Vykopávky odkryly lázně a dva kostely z pozdního římského a byzantského období."
  sv:
    - "Dibon låg i Moab, öster om Döda havet och några kilometer norr om Arnonklyftan, på en kulle intill den moderna staden Dhiban i Jordanien, där Kungsvägen gick fram. Utgrävningar av American Schools of Oriental Research på 1950-talet och, sedan 2004, av Dhiban Excavation and Development Project har funnit spår av bebyggelse under äldre bronsålder, på tredje årtusendet f.Kr., och en ansenlig stad från järnåldern."
    - "I Fjärde Mosebok säger den gamla sången om Heshbon, Sichons, amoréernas kungs, stad: ”förlorat var Hesbon, landet ända till Dibon”; Israel intog sedan landet, Gads barn byggde upp Dibon, och på vägen genom öknen lägrade Israel sig i Dibon-Gad. Josua tilldelar Dibon åt Ruben. Hos Jesaja och Jeremia är det åter en stad i Moab, som sörjer i domsorden mot landet."
    - "I augusti 1868 visades missionären F. A. Klein en basaltstele som låg bland ruinerna i Dhiban. Innan den kunde föras bort slog lokala beduiner sönder den, men ett pappersavtryck som gjorts åt Charles Clermont-Ganneau gjorde det möjligt att återställa texten, och stenen finns nu i Louvren. I den säger Mesha, Moabs kung, från Dibon, att Omri, Israels kung, och hans son hade förtryckt Moab, att han tog tillbaka landet, intog Atarot och Nebo, och i Qarhoh, vanligen ansett vara Dibons kungliga kvarter, byggde murar, portar, torn, ett palats och cisterner, med israelitiska fångar satta att gräva. Andra Konungaboken berättar hur Mesha gjorde uppror mot Israel efter Achavs död."
    - "Litet är känt om Dibon under persisk och hellenistisk tid. Från mitten av första århundradet f.Kr. tillhörde det nabatéerna, som byggde ett tempel där, och år 106 e.Kr. gick det med resten av det nabatéiska kungariket över till den romerska provinsen Arabien. I början av 300-talet kände Eusebios Dibon som en mycket stor by nära Arnon. Utgrävningar har blottat ett badhus och två kyrkor från sen romersk och bysantinsk tid."
  nb:
    - "Dibon lå i Moab, øst for Dødehavet og noen kilometer nord for Arnon-juvet, på en haug ved siden av den moderne byen Dhiban i Jordan, der Kongeveien gikk. Utgravninger av American Schools of Oriental Research på 1950-tallet og, siden 2004, av Dhiban Excavation and Development Project har funnet spor av bosetning i tidlig bronsealder, i det tredje årtusen f.Kr., og en betydelig by fra jernalderen."
    - "I 4. Mosebok sier den gamle sangen om Hesjbon, byen til Sihon, amorittenes konge: «ødelagt er Hesbon, like til Dibon!»; Israel tok så landet, Gads barn bygde opp Dibon, og på veien gjennom ørkenen leiret Israel seg i Dibon-Gad. Josva tildeler Dibon til Ruben. Hos Jesaja og Jeremia er den igjen en by i Moab, som sørger i orakelene mot dette landet."
    - "I august 1868 ble misjonæren F. A. Klein vist en basaltstele som lå blant ruinene av Dhiban. Før den kunne fjernes, slo lokale beduiner den i stykker, men et papiravtrykk laget for Charles Clermont-Ganneau gjorde det mulig å gjenopprette teksten, og steinen er nå i Louvre. I den sier Mesa, konge av Moab, dibonitten, at Omri, konge av Israel, og hans sønn hadde undertrykt Moab, at han tok landet tilbake, inntok Atarot og Nebo, og i Qarhoh, vanligvis regnet for å være Dibons kongelige kvarter, bygde murer, porter, tårn, et palass og reservoarer, med israelittiske fanger satt til gravingen. 2. Kongebok forteller hvordan Mesa gjorde opprør mot Israel etter Akabs død."
    - "Lite er kjent om Dibon i persertiden og den hellenistiske tiden. Fra midten av det første århundre f.Kr. hørte den til nabateerne, som bygde et tempel der, og i 106 e.Kr. gikk den sammen med resten av det nabateiske riket over til den romerske provinsen Arabia. Tidlig på 300-tallet kjente Eusebius Dibon som en meget stor landsby nær Arnon. Utgravninger har avdekket et badehus og to kirker fra sen romertid og bysantinsk tid."
  tl:
    - "Ang Dibon ay nasa Moab, sa silangan ng Dagat na Patay at ilang kilometro sa hilaga ng bangin ng Arnon, sa isang tel sa tabi ng makabagong bayan ng Dhiban sa Jordan, kung saan dumaan ang Lansangan ng Hari. Ang mga paghuhukay ng American Schools of Oriental Research noong dekada 1950 at, mula 2004, ng Dhiban Excavation and Development Project ay nakatagpo ng bakas ng paninirahan sa Maagang Panahon ng Tanso, noong ika-3 milenyo BK, at isang malaking bayan ng Panahon ng Bakal."
    - "Sa Mga Bilang, sinasabi ng matandang awit tungkol sa Hesbon, ang lungsod ni Sehon, hari ng mga Amorreo, na “ang Hesbon ay namatay hanggang sa Dibon”; sinakop ng Israel pagkatapos ang lupain, itinayo ng mga anak ni Gad ang Dibon, at sa paglalakbay sa ilang ay humimpil ang Israel sa Dibon-gad. Itinakda ni Josue ang Dibon sa Ruben. Sa Isaias at Jeremias, muli itong bayan ng Moab, na tumatangis sa mga orakulo laban sa lupaing iyon."
    - "Noong Agosto 1868, ipinakita sa misyonerong si F. A. Klein ang isang estelang basalto na nakahiga sa mga guho ng Dhiban. Bago ito madala, binasag ito ng mga Bedouin sa mga piraso, ngunit ang isang hulmang papel (impresyon) na ginawa para kay Charles Clermont-Ganneau ay nagpahintulot na maibalik ang teksto, at ang bato ay nasa Louvre ngayon. Dito sinasabi ni Mesa, hari ng Moab, ang Dibonita, na pinahirapan ni Omri, hari ng Israel, at ng kaniyang anak ang Moab, na binawi niya ang lupain, nakuha ang Ataroth at Nebo, at sa Qarhoh, karaniwang itinuturing na maharlikang purok ng Dibon, nagtayo ng mga pader, pintuan, tore, palasyo at imbakan ng tubig, na ang mga bilanggong Israelita ay inilagay sa paghuhukay. Isinasalaysay ng 2 Mga Hari kung paano naghimagsik si Mesa laban sa Israel pagkamatay ni Achab."
    - "Kaunti ang alam tungkol sa Dibon sa mga panahong Persiano at Helenistiko. Mula sa gitna ng ika-1 siglo BK, pag-aari ito ng mga Nabateo, na nagtayo roon ng templo, at noong 106 AD ay napunta ito, kasama ang natitirang kaharian ng Nabateo, sa lalawigang Romano ng Arabia. Maaga sa ika-4 na siglo, kilala ni Eusebio ang Dibon bilang napakalaking nayon malapit sa Arnon. Ang mga paghuhukay ay nakatuklas ng bahay-paliguan at dalawang simbahan ng huling panahong Romano at Bizantino."
  da:
    - "Dibon lå i Moab, øst for Det Døde Hav og nogle få kilometer nord for Arnon-kløften, på en høj ved siden af den moderne by Dhiban i Jordan, hvor Kongevejen passerede. Udgravninger af American Schools of Oriental Research i 1950'erne og siden 2004 af Dhiban Excavation and Development Project har fundet spor af bebyggelse i tidlig bronzealder, i 3. årtusinde f.Kr., og en anselig jernalderby."
    - "I 4 Mosebog siger den gamle sang om Hesjbon, byen tilhørende Sihon, amoritternes konge, at »Hesbon er tabt indtil Dibon«; Israel tog derpå landet, Gads børn byggede Dibon, og på vejen gennem ørkenen lejrede Israel sig i Dibon-Gad. Josva tildeler Dibon til Ruben. Hos Esajas og Jeremias er den igen en by i Moab, der sørger i orakler mod det land."
    - "I august 1868 blev missionæren F. A. Klein vist en basaltstele, der lå blandt ruinerne af Dhiban. Før den kunne føres væk, slog lokale beduiner den i stykker, men et papiraftryk, lavet til Charles Clermont-Ganneau, gjorde det muligt at genskabe teksten, og stenen er nu i Louvre. I den siger Mesja, Moabs konge, dibonitten, at Omri, Israels konge, og hans søn havde undertrykt Moab, at han tog landet tilbage, indtog Atarot og Nebo, og i Qarhoh, sædvanligvis anset for Dibons kongekvarter, byggede mure, porte, tårne, et palads og reservoirer, med israelitiske fanger sat til gravearbejdet. 2 Kongebog fortæller, hvordan Mesja gjorde oprør mod Israel efter Akabs død."
    - "Der vides lidt om Dibon i den persiske og hellenistiske tid. Fra midten af 1. århundrede f.Kr. hørte den til nabatæerne, som byggede et tempel dér, og i 106 e.Kr. gik den sammen med resten af det nabatæiske kongerige over i den romerske provins Arabien. I begyndelsen af 300-tallet kendte Eusebios Dibon som en meget stor landsby nær Arnon. Udgravninger har afdækket et badehus og to kirker fra sen romersk og byzantinsk tid."
  sr:
    - "Девон је лежао у Моаву, источно од Мртвог мора и неколико километара северно од кланца Арнона, на хумци поред савременог града Дибана у Јордану, где је пролазио Краљев пут. Ископавања Америчких школа оријенталних истраживања 1950-их и, од 2004, Пројекта ископавања и развоја Дибана нашла су трагове насељавања у раном бронзаном добу, у 3. миленијуму п. н. е., и знатан град из гвозденог доба."
    - "У Књизи Бројева, стара песма о Есевону, граду Сиона, цара аморејског, каже: „пропаде Есевон до Девона“; Израиљ је затим узео земљу, синови Гадови саградили су Девон, а на путу кроз пустињу Израиљ се улогорио у Девон-Гаду. Исус Навин додељује Девон Рувиму. Код Исаије и Јеремије он је поново град Моава, који жали у пророчанствима против те земље."
    - "У августу 1868. мисионару Ф. А. Клајну показана је базалтна стела која је лежала међу рушевинама Дибана. Пре него што је могла бити однета, месни бедуини су је разбили на комаде, али папирни отисак начињен за Шарла Клермон-Ганоа омогућио је да се текст поврати, и камен је сада у Лувру. У њему Миса, цар моавски, Девонац, каже да су Амрије, цар Израиља, и његов син угњетавали Моав, да је он вратио земљу, заузео Атарот и Нево, и у Кархи, која се обично схвата као краљевска четврт Девона, саградио зидове, капије, куле, палату и резервоаре, а израиљске заробљенике ставио на копање. Књига о царевима приповеда како се Миса побунио против Израиља после Ахавове смрти."
    - "О Девону у персијском и хеленистичком периоду зна се мало. Од средине 1. века п. н. е. припадао је Набатејцима, који су тамо саградили храм, а 106. н. е. прешао је са остатком набатејског краљевства у римску провинцију Арабију. Почетком 4. века Јевсевије је знао Девон као веома велико село близу Арнона. Ископавања су открила купатило и две цркве из касног римског и византијског периода."
  hu:
    - "Dibon Moábban feküdt, a Holt-tengertől keletre és az Arnon-szurdoktól néhány kilométerre északra, a jordániai Dhiban város melletti halmon, ahol a Királyi út haladt. Az Amerikai Keleti Kutatóintézet (ASOR) 1950-es évekbeli, valamint a Dhiban Excavation and Development Project 2004 óta folyó ásatásai a korai bronzkori, a Kr. e. 3. évezredi település nyomait és a vaskor jelentős városát tárták fel."
    - "A Számok könyvében a Hesbonról, Szihon, az emoreusok királya városáról szóló régi ének azt mondja: „elveszett Hesbon Dibonig”; Izráel ezután elfoglalta a földet, Gád fiai megépítették Dibont, és a pusztai úton Izráel Dibon-Gádban táborozott. Józsué Dibont Rúbennek jelöli ki. Ézsaiásnál és Jeremiásnál ismét Moáb városa, amely az e földről szóló jövendölésekben gyászol."
    - "1868 augusztusában F. A. Klein misszionáriusnak megmutattak egy bazaltsztélét, amely Dhiban romjai között hevert. Mielőtt elvihették volna, helyi beduinok darabokra törték, de egy papírlenyomat, amelyet Charles Clermont-Ganneau számára készítettek, lehetővé tette a szöveg helyreállítását, és a kő ma a Louvre-ban van. Benne Mésa, Moáb dibóni királya azt mondja, hogy Omri, Izráel királya és fia elnyomta Moábot, ő visszavette a földet, elfoglalta Atarótot és Nébót, és Qarkhóban, amelyet rendszerint Dibon királyi negyedének tartanak, falakat, kapukat, tornyokat, palotát és víztárolókat épített, az ásást izraelita foglyokkal végeztetve. A 2Királyok elmondja, hogyan lázadt fel Mésa Izráel ellen Aháb halála után."
    - "Dibonról keveset tudunk a perzsa és a hellénisztikus korból. A Kr. e. 1. század közepétől a nabateusoké volt, akik templomot építettek ott, és Kr. u. 106-ban a nabateus királyság többi részével együtt Arábia római tartományába került. A 4. század elején Eusebius Dibont az Arnon melletti igen nagy falunak ismerte. Az ásatások egy fürdőt és a késő római és bizánci kor két templomát tárták fel."
  fi:
    - "Dibon sijaitsi Moabissa, Kuolleenmeren itäpuolella ja muutaman kilometrin Arnonin rotkosta pohjoiseen, kumpareella nykyisen Dhibanin kaupungin vieressä Jordaniassa, missä Kuninkaantie kulki. American Schools of Oriental Researchin kaivaukset 1950-luvulla ja vuodesta 2004 Dhiban Excavation and Development Project ovat löytäneet jälkiä asutuksesta varhaispronssikaudelta, kolmannelta vuosituhannelta eaa., sekä huomattavan rautakauden kaupungin."
    - "Neljännessä Mooseksen kirjassa vanha laulu Hesbonista, amorilaisten kuninkaan Sihonin kaupungista, sanoo: ”Hesbon kukistui Diibonia myöten”; Israel valtasi sitten maan, Gaadin lapset rakensivat Dibonin, ja erämaan halki kulkiessaan Israel leiriytyi Dibon-Gaadiin. Joosua antaa Dibonin Ruubenille. Jesajan ja Jeremian kirjoissa se on jälleen Moabin kaupunki, joka murehtii kyseistä maata vastaan kohdistetuissa ennustuksissa."
    - "Elokuussa 1868 lähetyssaarnaaja F. A. Klein sai nähdä basalttisen steelan, joka makasi Dhibanin raunioiden joukossa. Ennen kuin sen ehdittiin viedä pois, paikalliset beduiinit rikkoivat sen kappaleiksi, mutta Charles Clermont-Ganneaulle tehty paperivedos mahdollisti tekstin palauttamisen, ja kivi on nyt Louvressa. Siinä Mesa, Moabin kuningas, dibonilainen, sanoo, että Omri, Israelin kuningas, ja hänen poikansa olivat sortaneet Moabia, että hän otti maan takaisin, valtasi Atarotin ja Nebon, ja Qarhohissa, jota yleensä pidetään Dibonin kuninkaallisena kaupunginosana, rakensi muureja, portteja, torneja, palatsin ja vesisäiliöitä, kaivuutyöhön pantuina israelilaisia vankeja. 2. Kuninkaiden kirja kertoo, kuinka Mesa kapinoi Israelia vastaan Ahabin kuoleman jälkeen."
    - "Dibonista tiedetään vähän persialaisella ja hellenistisellä kaudella. Ensimmäisen vuosisadan eaa. puolivälistä se kuului nabatealaisille, jotka rakensivat sinne temppelin, ja vuonna 106 jaa. se siirtyi muun nabatealaisen kuningaskunnan mukana Rooman Arabian provinssiin. 300-luvun alussa Eusebios tunsi Dibonin hyvin suurena kylänä lähellä Arnonia. Kaivauksissa on paljastunut myöhäisroomalaisen ja bysanttilaisen ajan kylpylä ja kaksi kirkkoa."
  vi:
    - "Đi-bôn nằm ở Mô-áp, phía đông Biển Chết và cách hẻm Ạt-nôn vài kilômét về phía bắc, trên một gò cạnh thị trấn Dhiban ngày nay ở Jordan, nơi Đường Cái của Vua đi qua. Các cuộc khai quật của Hội các Trường Đông phương Hoa Kỳ (ASOR) vào những năm 1950 và, từ năm 2004, của Dự án Khai quật và Phát triển Dhiban đã tìm thấy dấu vết định cư thời đồ đồng sớm, thiên niên kỷ 3 TCN, và một thị trấn khá lớn của thời đồ sắt."
    - "Trong sách Dân số Ký, bài ca xưa về Hết-bôn, thành của Si-hôn, vua dân A-mô-rít, nói rằng “Hết-bôn đã bị hủy diệt cho đến Đi-bôn”; sau đó Y-sơ-ra-ên chiếm xứ, con cháu Gát xây Đi-bôn, và trên đường qua đồng vắng Y-sơ-ra-ên đóng trại tại Đi-bôn-Gát. Giô-suê ban Đi-bôn cho Ru-bên. Trong Ê-sai và Giê-rê-mi, nó lại là một thành của Mô-áp, than khóc trong các lời sấm nghịch cùng xứ ấy."
    - "Tháng 8 năm 1868, nhà truyền giáo F. A. Klein được chỉ cho thấy một bia bazan nằm giữa phế tích Dhiban. Trước khi mang đi được, người Bedouin địa phương đập nó vỡ, nhưng một bản dập giấy do Charles Clermont-Ganneau thực hiện đã cho phép phục hồi bản văn, và phiến đá nay ở Louvre. Trong đó Mê-sa, vua Mô-áp, người Đi-bôn, nói rằng Ôm-ri, vua Y-sơ-ra-ên, và con trai ông đã áp bức Mô-áp, rằng ông đã đoạt lại đất, chiếm A-ta-rốt và Nê-bô, và tại Qarhoh, thường được coi là khu hoàng gia của Đi-bôn, xây tường, cổng, tháp, một cung điện và các bể chứa, với tù binh Y-sơ-ra-ên bị bắt đào. 2 Các Vua kể Mê-sa nổi dậy chống Y-sơ-ra-ên sau cái chết của A-háp."
    - "Biết rất ít về Đi-bôn trong các thời Ba Tư và Hy Lạp hóa. Từ giữa thế kỷ 1 TCN, nó thuộc người Nabataea, những người xây một đền thờ ở đó, và năm 106 nó cùng phần còn lại của vương quốc Nabataea vào tỉnh A-ra-bi của La Mã. Đầu thế kỷ 4, Eusebius biết Đi-bôn là một làng rất lớn gần Ạt-nôn. Các cuộc khai quật đã phát hiện một nhà tắm và hai nhà thờ của cuối thời La Mã và Byzantine."
  ro:
    - "Dibon se afla în Moab, la est de Marea Moartă și la câțiva kilometri nord de defileul Arnon, pe o movilă lângă orașul actual Dhiban din Iordania, pe unde trecea Drumul Regelui. Săpăturile American Schools of Oriental Research din anii 1950 și, din 2004, ale Dhiban Excavation and Development Project au găsit urme de așezare din epoca bronzului timpuriu, în mileniul al III-lea î.Hr., și o cetate însemnată din epoca fierului."
    - "În Numeri, vechea cântare despre Hesbon, cetatea lui Sihon, regele amoriților, spune: „Sămânța lor piere, Esevon până la Devon”; Israel a luat apoi țara, fiii lui Gad au zidit Dibonul, iar în drumul prin pustie Israel a tăbărât la Dibon-Gad. Iosua atribuie Dibonul lui Ruben. La Isaia și Ieremia este din nou o cetate a Moabului, care se tânguie în oracolele împotriva țării."
    - "În august 1868, misionarul F. A. Klein a fost dus să vadă o stelă de bazalt zăcând printre ruinele de la Dhiban. Înainte să poată fi luată, beduinii din partea locului au sfărâmat-o, dar o amprentă pe hârtie făcută pentru Charles Clermont-Ganneau a îngăduit refacerea textului, iar piatra se află acum la Luvru. În ea, Meșa, regele Moabului, dibonitul, spune că Omri, regele lui Israel, și fiul său apăsaseră Moabul, că el a luat înapoi țara, a cucerit Atarot și Nebo și, în Qarhoh, socotit de obicei cartierul regal al Dibonului, a zidit ziduri, porți, turnuri, un palat și rezervoare, punând prizonieri israeliți la săpat. 2 Regi povestește cum Meșa s-a răsculat împotriva lui Israel după moartea lui Ahab."
    - "Se știe puțin despre Dibon în perioadele persană și elenistică. Din mijlocul secolului I î.Hr., a aparținut nabateenilor, care au zidit acolo un templu, iar în 106 d.Hr. a trecut, împreună cu restul regatului nabateean, în provincia romană Arabia. La începutul secolului al IV-lea, Eusebiu cunoștea Dibonul ca pe un sat foarte mare lângă Arnon. Săpăturile au scos la iveală o baie și două biserici din perioadele romană târzie și bizantină."
  bg:
    - "Дивон лежал в Моав, източно от Мъртво море и на няколко километра северно от клисурата на Арнон, на могила до днешното градче Дибан в Йордания, откъдето минавал Царският път. Разкопките на Американските школи за ориенталски изследвания през 50-те години на XX в. и, от 2004 г., на Дибанския проект за разкопки и развитие откриха следи от селище от ранната бронзова епоха, през III хил. пр.н.е., и значителен град от желязната епоха."
    - "В Числа старата песен за Есевон, града на Сихон, цар на аморейците, казва: „Есевон погина до Девон“; после Израил превзел земята, синовете на Гад съградили Дивон, а по пътя през пустинята Израил се разположил на стан в Дивон-Гад. Книгата Иисус Навин дава Дивон на Рувим. У Исаия и Йеремия той отново е град на Моав, който ридае в пророчествата срещу тази земя."
    - "През август 1868 г. на мисионера Ф. А. Клайн била показана базалтова стела, лежаща сред руините на Дибан. Преди да бъде отнесена, местни бедуини я разбили на парчета, но хартиен отпечатък, направен за Шарл Клермон-Гано, позволил текстът да бъде възстановен и камъкът днес е в Лувъра. В него Меша, цар на Моав, дивонецът, казва, че Омри, цар на Израил, и синът му угнетявали Моав, че той си върнал земята, превзел Атарот и Нево и в Кархо, обикновено смятано за царския квартал на Дивон, построил стени, порти, кули, дворец и водоеми, като накарал израилски пленници да копаят. 4 Царе разказва как Меша се вдигнал срещу Израил след смъртта на Ахав."
    - "Малко се знае за Дивон през персийския и елинистическия период. От средата на I в. пр.н.е. той принадлежал на набатейците, които построили там храм, а през 106 г. н.е. преминал заедно с останалата част от Набатейското царство в римската провинция Арабия. В началото на IV в. Евсевий познавал Дивон като много голямо село близо до Арнон. Разкопките откриха баня и две църкви от късноримския и византийския период."
