body:
  en:
    - "Carmel was a town in the hill country of Judah, south-east of Hebron, not to be confused with Mount Carmel by the sea. The name means a garden or orchard land, and the town lay on the edge of the settled hills, where the wilderness of Judah begins. Joshua lists it in one district with Maon, Ziph and Juttah: “Maon, Carmel, and Ziph, and Juttah”. The site is Khirbet el-Kirmil, about 12 km from Hebron and a short walk from Maon (Khirbet Ma'in); the Arabic name has kept the old one, and Edward Robinson recognised it there in 1838."
    - "After his victory over Amalek “Saul came to Carmel, and, behold, he set him up a place”, a monument, before going down to Gilgal. Here lived Nabal, “a man in Maon, whose possessions were in Carmel”, “very great”, with three thousand sheep and a thousand goats, who was shearing them in Carmel when David's men asked for food and were refused. His wife Abigail, “a woman of good understanding, and of a beautiful countenance”, met David with provisions and turned him from bloodshed; when Nabal died she became David's wife, and she is afterwards called “Abigail the Carmelitess” or the wife of “Nabal the Carmelite”. Her son, Chileab or Daniel, was born at Hebron. Hezrai the Carmelite was one of David's thirty mighty men. The Chronicler says that Uzziah had vine dressers “in the mountains, and in Carmel”, though the word there may simply mean the orchard land."
    - "Eusebius, in the fourth century, knew Chermala as a village east of Hebron with a Roman garrison, and the ruins of Khirbet el-Kirmil include a large ancient reservoir, remains of a Byzantine church and a tower of the Crusader period. The site lies today in the southern Hebron hills of the West Bank, beside the village of al-Karmil near Yatta."
  ru:
    - "Кармил был городом в нагорье Иудеи к юго-востоку от Хеврона; его не следует путать с горой Кармил у моря. Имя значит сад или плодовую землю, и город стоял на краю обжитых гор, где начинается пустыня Иудейская. Книга Иисуса Навина называет его в одном округе с Маоном, Зифом и Ютой: «Маон, Кармил, Зиф и Юта». Это Хирбет-эль-Кирмиль, примерно в 12 км от Хеврона и в получасе ходьбы от Маона (Хирбет-Маин); арабское название сохранило древнее, и Эдвард Робинсон узнал его здесь в 1838 году."
    - "После победы над Амаликом «Саул ходил на Кармил и там поставил себе памятник», прежде чем сойти в Галгал. Здесь жил Навал: «Был некто в Маоне, а имение его на Кармиле, человек очень богатый; у него было три тысячи овец и тысяча коз», и он стриг их на Кармиле, когда люди Давида попросили пищи и получили отказ. Его жена Авигея, «весьма умная и красивая лицем», вышла навстречу Давиду с припасами и отвратила его от кровопролития; когда Навал умер, она стала женой Давида, и с тех пор её называют Кармилитянкой или бывшей женой Навала. Её сын, Далуиа, родился в Хевроне. Хецрай Кармилитянин был одним из тридцати храбрых Давида. Летописец говорит, что у Озии были садовники «на горах и на Кармиле», хотя слово здесь может означать просто плодовые земли."
    - "Евсевий в IV веке знал Хермалу как селение к востоку от Хеврона с римским гарнизоном, а среди развалин Хирбет-эль-Кирмиля — большой древний водоём, остатки византийской церкви и башня времён крестоносцев. Сегодня это место лежит в южных Хевронских горах на Западном берегу, рядом с селением Эль-Кармиль близ Ятты."
  uk:
    - "Кармель був містом у гірській країні Юди, на південний схід від Хеврона, його не слід плутати з горою Кармель біля моря. Назва означає сад або садову землю, і місто лежало на краю заселених пагорбів, де починається Юдейська пустеля. Ісус Навин перелічує його в одному окрузі з Маоном, Зіфом і Юттою: «Маон, Кармил, Сиф і Юта». Місце — Хірбет-ель-Кірмиль, приблизно за 12 км від Хеврона й недалеко пішки від Маона (Хірбет-Маїн); арабська назва зберегла давню, і Едвард Робінсон упізнав її там у 1838 р."
    - "Після перемоги над Амаликом «Саул ходив у Кармиль і там построїв собі ворота побідні», тобто пам'ятник, перед тим як спуститися до Гілгала. Тут жив Навал, «в Маонї чоловік, а майно його було в Кармелї», «вельми багатий», із трьома тисячами овець і тисячею кіз, який стриг їх у Кармелі, коли люди Давида попросили їжі й дістали відмову. Його дружина Авігея, «молодиця з добрим розумом і хороша вродою», зустріла Давида з харчами й відвела його від кровопролиття; коли Навал помер, вона стала дружиною Давида, і відтоді її називають «Кармелїйкою» або жінкою «Кармелїя Набала». Її син, Далуїя, або Даниїл, народився в Хевроні. Гезро з Кармелю був одним із тридцяти Давидових силачів. Літописець каже, що в Уззії були хлібороби та виноградарі «на горах і на Кармелї», хоча слово там може означати просто садову землю."
    - "Євсевій у IV ст. знав Хермалу як село на схід від Хеврона з римським гарнізоном, а руїни Хірбет-ель-Кірмиля містять велике давнє водосховище, рештки візантійської церкви та вежу доби хрестоносців. Місце лежить сьогодні в південних Хевронських горах Західного берега, поряд із селом аль-Кармиль біля Ятти."
  es:
    - "Carmel era una ciudad en la región montañosa de Judá, al sudeste de Hebrón, que no debe confundirse con el monte Carmelo junto al mar. El nombre significa tierra de huertos o jardín, y la ciudad se hallaba en el borde de las colinas pobladas, donde comienza el desierto de Judá. Josué la enumera en un mismo distrito con Maón, Zif y Jutá: «Maón, Carmel, y Ziph, y Juta». El sitio es Khirbet el-Kirmil, a unos 12 km de Hebrón y a corta distancia de Maón (Khirbet Ma'in); el nombre árabe ha conservado el antiguo, y Edward Robinson lo reconoció allí en 1838."
    - "Tras vencer a Amalec, «Saúl ha venido al Carmel, y he aquí él se ha levantado un trofeo», un monumento, antes de bajar a Gilgal. Aquí vivía Nabal: «en Maón había un hombre que tenía su hacienda en el Carmelo», «muy rico», con tres mil ovejas y mil cabras, que esquilaba en Carmel cuando los hombres de David pidieron comida y se les negó. Su mujer Abigail, de «buen entendimiento y de buena gracia», salió al encuentro de David con provisiones y lo apartó de derramar sangre; al morir Nabal, pasó a ser mujer de David, y en adelante se la llama «Abigail de Carmelo» o mujer de «Nabal, el del Carmelo». Su hijo Quileab, o Daniel, nació en Hebrón. Hesrai el carmelita fue de los treinta valientes de David. Uzías tenía, dice el cronista, viñas y labranzas «así en los montes como en los llanos fértiles», aunque la palabra hebrea puede significar simplemente tierra de huertos."
    - "Eusebio, en el siglo IV, conocía Chermala como una aldea al este de Hebrón con una guarnición romana, y las ruinas de Khirbet el-Kirmil incluyen un gran depósito de agua antiguo, restos de una iglesia bizantina y una torre de la época de los cruzados. El sitio se halla hoy en las colinas meridionales de Hebrón, en Cisjordania, junto a la aldea de al-Karmil, cerca de Yatta."
  pt:
    - "Carmelo era uma cidade nas montanhas de Judá, a sudeste de Hebrom, que não se deve confundir com o Monte Carmelo junto ao mar. O nome significa terra de jardins ou pomares, e a cidade ficava na orla das colinas habitadas, onde começa o deserto de Judá. Josué a lista num mesmo distrito com Maom, Zife e Jutá: “Maom, Carmelo, Zife, Jutá”. O local é Khirbet el-Kirmil, a cerca de 12 km de Hebrom e a uma curta caminhada de Maom (Khirbet Ma'in); o nome árabe conservou o antigo, e Edward Robinson o reconheceu ali em 1838."
    - "Depois de sua vitória sobre Amaleque, “Saul foi para o Carmelo e, eis que levantou um monumento para si mesmo”, antes de descer a Gilgal. Aqui vivia Nabal, “um homem em Maom que tinha as suas propriedades no Carmelo”, “muito rico”, com três mil ovelhas e mil cabras, que as tosquiava no Carmelo quando os homens de Davi pediram comida e foram recusados. Sua mulher Abigail, “inteligente e muito formosa”, foi ao encontro de Davi com provisões e o demoveu de derramar sangue; quando Nabal morreu, ela se tornou mulher de Davi, e desde então é chamada “Abigail, a carmelita” ou “a viúva de Nabal, o carmelita”. Seu filho, Quileabe ou Daniel, nasceu em Hebrom. Hezro, o carmelita, foi um dos trinta valentes de Davi. O cronista diz que Uzias tinha vinhateiros “nas montanhas e nos campos férteis”, embora a palavra ali (Carmelo, no hebraico) possa significar simplesmente terra de pomares."
    - "Eusébio, no século IV, conhecia Chermala como uma aldeia a leste de Hebrom com guarnição romana, e as ruínas de Khirbet el-Kirmil incluem um grande reservatório antigo, restos de uma igreja bizantina e uma torre do período dos cruzados. O local fica hoje nas colinas do sul de Hebrom, na Cisjordânia, junto à aldeia de al-Karmil, perto de Yatta."
  de:
    - "Karmel war eine Stadt im Bergland von Juda, südöstlich von Hebron, nicht zu verwechseln mit dem Berg Karmel am Meer. Der Name bedeutet Garten oder Obstland, und die Stadt lag am Rand der besiedelten Hügel, wo die Wüste Juda beginnt. Josua führt sie in einem Bezirk mit Maon, Sif und Juta auf: „Maon, Karmel, Siph, Jutta“. Der Ort ist Khirbet el-Kirmil, etwa 12 km von Hebron und einen kurzen Fußweg von Maon (Khirbet Ma’in) entfernt; der arabische Name hat den alten bewahrt, und Edward Robinson erkannte ihn dort 1838."
    - "Nach seinem Sieg über Amalek wurde Samuel gemeldet, dass Saul „gen Karmel gekommen wäre und hätte sich ein Siegeszeichen aufgerichtet“, ehe er nach Gilgal hinabzog. Hier lebte Nabal, „ein Mann zu Maon und sein Wesen zu Karmel“, „sehr großen Vermögens“, mit dreitausend Schafen und tausend Ziegen; er schor sie in Karmel, als Davids Männer Nahrung erbaten und abgewiesen wurden. Seine Frau Abigajil, „ein Weib von guter Vernunft und schön von Angesicht“, kam David mit Vorräten entgegen und hielt ihn vom Blutvergießen ab; nach Nabals Tod wurde sie Davids Frau und heißt fortan die Karmeliterin oder „Nabals Weib, des Karmeliten“. Ihr Sohn Kileab oder Daniel wurde in Hebron geboren. Hezrai der Karmeliter war einer von Davids Dreißig. Nach dem Chronisten hatte Usija „Ackerleute und Weingärtner an den Bergen und am Karmel“, doch das Wort kann dort schlicht das Obstland meinen."
    - "Eusebius kannte im 4. Jahrhundert Chermala als Dorf östlich von Hebron mit einer römischen Garnison, und zu den Ruinen von Khirbet el-Kirmil gehören ein großes antikes Reservoir, Reste einer byzantinischen Kirche und ein Turm aus der Kreuzfahrerzeit. Der Ort liegt heute in den südlichen Hebron-Bergen im Westjordanland, neben dem Dorf al-Karmil bei Yatta."
  fr:
    - "Carmel était une ville des montagnes de Juda, au sud-est d’Hébron, à ne pas confondre avec le Mont Carmel en bord de mer. Le nom désigne un jardin ou un pays de vergers, et la ville se trouvait à la lisière des collines habitées, là où commence le désert de Juda. Josué la range dans un même district avec Maon, Ziph et Jutta : « Maon, Carmel, Ziph, Juta ». Le site est Khirbet el-Kirmil, à environ 12 km d’Hébron et à courte distance de Maon (Khirbet Ma’in) ; le nom arabe a gardé l’ancien, et Edward Robinson l’y reconnut en 1838."
    - "Après sa victoire sur Amalek, « Saül est allé à Carmel, et voici, il s’est érigé un monument », avant de descendre à Guilgal. Ici vivait Nabal, de Maon, « un homme fort riche, possédant des biens à Carmel », avec trois mille brebis et mille chèvres, qui les tondait à Carmel quand les gens de David demandèrent des vivres et furent refusés. Sa femme Abigaïl, « une femme de bon sens et belle de figure », vint au-devant de David avec des provisions et le détourna de verser le sang ; après la mort de Nabal, elle épousa David, et elle est dès lors appelée « Abigaïl de Carmel » ou « femme de Nabal ». Son fils, Kileab ou Daniel, naquit à Hébron. Hetsraï de Carmel fut l’un des trente vaillants de David. Le Chroniqueur dit qu’Ozias avait des vignerons « dans les montagnes et au Carmel », mais le mot peut désigner simplement le pays de vergers."
    - "Eusèbe, au IVe siècle, connaissait Chermala comme un village à l’est d’Hébron avec une garnison romaine, et les ruines de Khirbet el-Kirmil comprennent un grand réservoir antique, les restes d’une église byzantine et une tour de l’époque des croisés. Le site se trouve aujourd’hui dans le sud des monts d’Hébron, en Cisjordanie, à côté du village d’al-Karmil près de Yatta."
  it:
    - "Carmelo era una città sulle alture di Giuda, a sud-est di Ebron, da non confondere con il Monte Carmelo presso il mare. Il nome significa terra di giardini o frutteti, e la città sorgeva al margine delle colline abitate, dove comincia il deserto di Giuda. Giosuè la elenca in un unico distretto con Maon, Zif e Iutta: «Maon, Carmel, Zif, Iuta». Il sito è Khirbet el-Kirmil, a circa 12 km da Ebron e a breve distanza a piedi da Maon (Khirbet Ma’in); il nome arabo ha conservato quello antico, e Edward Robinson lo riconobbe là nel 1838."
    - "Dopo la vittoria su Amalek, «Saul è andato a Carmel, ed ecco che vi s’è eretto un trofeo», un monumento, prima di scendere a Gàlgala. Qui abitava Nabal, «un uomo a Maon, che aveva i suoi beni a Carmel», «molto ricco», con tremila pecore e mille capre, che tosava a Carmel quando gli uomini di Davide chiesero cibo e furono respinti. Sua moglie Abigail, «donna di buon senso e di bell’aspetto», andò incontro a Davide con provviste e lo distolse dallo spargimento di sangue; alla morte di Nabal divenne moglie di Davide, e da allora è chiamata «Abigail, la Carmelita» o quella «ch’era stata moglie di Nabal». Il figlio di lei, Chileab o Daniele, nacque a Ebron. Chezrai il Carmelita era uno dei trenta prodi di Davide. Il Cronista dice che Ozia aveva vignaiuoli sui monti e a Carmelo, benché la parola possa indicare semplicemente la terra dei frutteti."
    - "Eusebio, nel IV secolo, conosceva Chermala come un villaggio a est di Ebron con una guarnigione romana, e le rovine di Khirbet el-Kirmil comprendono un grande antico serbatoio, resti di una chiesa bizantina e una torre di epoca crociata. Il sito si trova oggi nelle colline meridionali di Ebron, in Cisgiordania, accanto al villaggio di al-Karmil, presso Yatta."
  pl:
    - "Karmel było miastem w górach Judy, na południowy wschód od Hebronu, nie mylić z górą Karmel nad morzem. Nazwa oznacza ogród lub kraj sadów, a miasto leżało na skraju zasiedlonych wzgórz, gdzie zaczyna się pustynia judzka. Jozue wymienia je w jednym okręgu z Maon, Zif i Jutta: „Maon, Karmel, i Zyf, i Juta”. Miejsce to Chirbet el-Kirmil, około 12 km od Hebronu i krótki spacer od Maon (Chirbet Ma'in); arabska nazwa zachowała dawną, a Edward Robinson rozpoznał ją tam w 1838 r."
    - "Po zwycięstwie nad Amalekiem „Przyszedł Saul do Karmelu, tamże wystawił sobie pamiątkę zwycięstwa”, zanim zszedł do Gilgal. Tu mieszkał Nabal, „mąż w Maon, który miał majętność na Karmelu”, „możny bardzo”, z trzema tysiącami owiec i tysiącem kóz, który strzygł je na Karmelu, gdy ludzie Dawida poprosili o jedzenie i im odmówiono. Jego żona Abigail, „mądra, i piękna”, wyszła naprzeciw Dawidowi z żywnością i odwiodła go od rozlewu krwi; gdy Nabal umarł, została żoną Dawida, a odtąd nazywa się ją Abigail Karmelitką albo żoną Nabalową z Karmelu. Jej syn, Kileab czyli Daniel, urodził się w Hebronie. Chesraj Karmelita był jednym z trzydziestu bohaterów Dawida. Kronikarz mówi, że Uzzjasz miał winiarzy „po górach, i na Karmelu”, choć słowo to może tam oznaczać po prostu kraj sadów."
    - "Euzebiusz w IV w. znał Chermalę jako wieś na wschód od Hebronu z rzymską załogą, a w ruinach Chirbet el-Kirmil znajduje się duży starożytny zbiornik wody, pozostałości kościoła bizantyjskiego i wieża z okresu krzyżowców. Miejsce leży dziś w południowych Wzgórzach Hebrońskich na Zachodnim Brzegu, obok wsi al-Karmil koło Jatty."
  nl:
    - "Karmel was een stad in het bergland van Juda, ten zuidoosten van Hebron, niet te verwarren met de berg Karmel aan de zee. De naam betekent tuin of boomgaardland, en de stad lag aan de rand van de bewoonde heuvels, waar de woestijn van Juda begint. Jozua noemt haar in één district met Maön, Zif en Juta: “Maon, Karmel, en Zif, en Juta”. De plaats is Khirbet el-Kirmil, ongeveer 12 km van Hebron en op korte loopafstand van Maön (Khirbet Ma'in); de Arabische naam heeft de oude bewaard, en Edward Robinson herkende haar daar in 1838."
    - "Na zijn overwinning op Amalek: “Saul is te Karmel gekomen, en zie, hij heeft zich een pilaar gesteld”, een gedenkteken, voor hij naar Gilgal afdaalde. Hier woonde Nabal, “een man te Maon, en zijn bedrijf was te Karmel”, “zeer groot”, met drieduizend schapen en duizend geiten, die ze te Karmel aan het scheren was toen Davids mannen om voedsel vroegen en werden afgewezen. Zijn vrouw Abigaïl, “goed van verstand, en schoon van gedaante”, kwam David met proviand tegemoet en hield hem van bloedvergieten af; na Nabals dood werd zij Davids vrouw, en voortaan heet zij “Abigail, de Karmelietische” of “de huisvrouw van Nabal, den Karmeliet”. Haar zoon Kileab of Daniël werd te Hebron geboren. Chezrai de Karmeliet was een van Davids dertig helden. Kronieken zegt dat Uzzia “wijngaardeniers op de bergen en op de vruchtbare velden” had, al kan het woord daar het boomgaardland betekenen."
    - "Eusebius kende in de 4e eeuw Chermala als een dorp ten oosten van Hebron met een Romeins garnizoen, en de ruïnes van Khirbet el-Kirmil omvatten een groot oud waterreservoir, resten van een Byzantijnse kerk en een toren uit de kruisvaarderstijd. De plaats ligt tegenwoordig in de zuidelijke heuvels van Hebron op de Westelijke Jordaanoever, naast het dorp al-Karmil bij Yatta."
  cs:
    - "Karmel bylo město v judských horách, jihovýchodně od Hebronu, které se nemá zaměňovat s Karmelem u moře. Jméno znamená zahradu nebo sadovou zemi a město leželo na okraji osídlených hor, kde začíná judská poušť. Jozue je uvádí v jednom okrese s Maonem, Zífem a Jutou: „Maon, Karmel a Zif, a Juta“. Místem je Khirbet el-Kirmil, asi 12 km od Hebronu a kousek pěšky od Maonu (Khirbet Ma'in); arabský název zachoval starý a Edward Robinson tam místo poznal roku 1838."
    - "Po svém vítězství nad Amalekem „Saul přišel na Karmel, a aj, připravil sobě místo“, pomník, než sestoupil do Gilgalu. Zde žil Nábal, člověk, který „byl v Maon“ a „statek svůj měl na Karmeli“, „možný velmi“, s třemi tisíci ovcí a tisícem koz, jež na Karmelu stříhal, když David poslal své muže prosit o potravu a byli odmítnuti. Jeho žena Abigajil, „žena ta opatrná a krásné tváři“, vyšla Davidovi vstříc s potravinami a odvrátila ho od krveprolití; když Nábal zemřel, stala se Davidovou ženou a od té doby se jí říká „Abigail Karmelská“ nebo „žena někdy Nábale Karmelského“. Její syn Kileab neboli Daniel se narodil v Hebronu. Checraj Karmelský byl jedním z Davidových třiceti hrdinů. Letopisec říká, že Uzijáš měl vinaře „po horách i na místech úrodných“, kde stojí hebrejské slovo karmel, které může znamenat prostě sadovou zemi."
    - "Eusebios ve 4. století znal Chermalu jako vesnici východně od Hebronu s římskou posádkou a ve zříceninách Khirbet el-Kirmil je velká starověká nádrž, zbytky byzantského kostela a věž z doby křižáků. Lokalita leží dnes v jižních hebronských horách Západního břehu, vedle vesnice al-Karmil u Yatty."
  sv:
    - "Karmel var en stad i Judas bergsland, sydost om Hebron, inte att förväxla med berget Karmel vid havet. Namnet betyder trädgård eller fruktträdgårdsland, och staden låg vid kanten av de bebodda bergen, där Judas öken börjar. Josua för upp den i ett distrikt med Maon, Sif och Jutta: ”Maon, Karmel, Sif, Juta”. Platsen är Khirbet el-Kirmil, omkring 12 km från Hebron och en kort promenad från Maon (Khirbet Ma’in); det arabiska namnet har bevarat det gamla, och Edward Robinson kände igen det där 1838."
    - "Efter segern över Amalek hade Saul ”kommit till Karmel och där rest åt sig en minnesstod”, innan han gick ner till Gilgal. Här bodde Naval, en man i Maon ”som hade sin boskapsskötsel i Karmel, och den mannen var mycket rik”, med tre tusen får och ett tusen getter, och som klippte dem i Karmel när Davids män bad om mat och blev avvisade. Hans hustru Avigajil, en kvinna med ”ett gott förstånd och ett skönt utseende”, mötte David med förråd och avvände honom från blodsutgjutelse; när Naval dog blev hon Davids hustru, och hon kallas därefter ”Abigail, karmeliten Nabals hustru”. Hennes son, Kilav eller Daniel, föddes i Hebron. ”Hesro från Karmel” var en av Davids trettio hjältar. Krönikeboken säger att Ussia hade jordbruks- och vingårdsarbetare ”i bergsbygden och på de bördiga fälten” (hebreiska Karmel), fast ordet där kan helt enkelt betyda fruktträdgårdsland."
    - "Eusebios kände på 300-talet Chermala som en by öster om Hebron med romersk garnison, och ruinerna vid Khirbet el-Kirmil omfattar en stor antik cistern, lämningar av en bysantinsk kyrka och ett torn från korstågstiden. Platsen ligger i dag i södra Hebronbergen på Västbanken, intill byn al-Karmil nära Yatta."
  nb:
    - "Karmel var en by i Judas fjellland, sørøst for Hebron, ikke å forveksle med Karmelfjellet ved havet. Navnet betyr en hage eller et frukthageland, og byen lå i kanten av de bebodde åsene, der Juda-ørkenen begynner. Josva fører den opp i ett distrikt med Maon, Sif og Juta: «Maon, Karmel og Sif og Juta». Stedet er Khirbet el-Kirmil, omtrent 12 km fra Hebron og et kort stykke fra Maon (Khirbet Ma'in); det arabiske navnet har bevart det gamle, og Edward Robinson kjente det igjen der i 1838."
    - "Etter sin seier over Amalek ble det meldt: «Saul er kommet til Karmel, og der har han reist sig et minnesmerke», før han drog ned til Gilgal. Her bodde Nabal: «I Maon var det en mann som hadde sin buskap i Karmel. Det var en meget rik mann», med tre tusen sauer og tusen geiter, som klippet dem i Karmel da Davids menn ba om mat og ble avvist. Hans hustru Abigajil, «en forstandig og fager kvinne», møtte David med forsyninger og avverget at han utgjøt blod; da Nabal døde, ble hun Davids hustru, og hun kalles siden «Abiga'il fra Karmel» eller «karmelitten Nabals hustru». Hennes sønn, Kilab eller Daniel, ble født i Hebron. «Karmelitten Hesro» var en av Davids tretti helter. Krønikeren sier at Ussia hadde «jordbrukere og vingårdsmenn på fjellene og i havene», men ordet «Karmel» i grunnteksten kan der bare bety hageland."
    - "Eusebius kjente på 300-tallet Chermala som en landsby øst for Hebron med en romersk garnison, og ruinene av Khirbet el-Kirmil omfatter et stort gammelt reservoar, rester av en bysantinsk kirke og et tårn fra korsfarertiden. Stedet ligger i dag i de sørlige Hebron-åsene på Vestbredden, ved siden av landsbyen al-Karmil nær Yatta."
