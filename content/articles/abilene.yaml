body:
  en:
    - "Abilene was the small territory of Abila, a town in the gorge of the Barada river in the Anti-Lebanon, on the road from Damascus to Heliopolis, now Baalbek. Abila is the present village of Souq Wadi Barada, north-west of Damascus in Syria. Ptolemy the geographer calls it “Abila of Lysanias”, and Josephus speaks of “Abila of Lysanias” and of “the tetrarchy of Lysanias”: the district was a remnant of the Ituraean principality of Chalcis, whose ruler Lysanias, son of Ptolemy son of Mennaeus, Antony put to death about 36 BC at Cleopatra's instigation."
    - "Luke dates the beginning of John the Baptist's preaching by the rulers of the time: “in the fifteenth year of the reign of Tiberius Cæsar”, with Pilate governor of Judaea, Herod tetrarch of Galilee and Philip of Ituraea and Trachonitis, “and Lysanias the tetrarch of Abilene”, under the high priests Annas and Caiaphas. Since Josephus names no later Lysanias, some critics charged Luke with an error; most scholars, following Emil Schürer, hold that he means a younger Lysanias, tetrarch of Abila alone in the time of Tiberius."
    - "A Greek inscription from Abila supports this view: Nymphaeus, a freedman of Lysanias the tetrarch, dedicated a temple and built a road for the welfare of the lords Augusti, usually taken to be Tiberius and his mother Livia, which places it between AD 14 and 29. Caligula gave the tetrarchy of Lysanias to Agrippa I in AD 37, Claudius confirmed Abila to him in 41, and in 53 it passed to Agrippa II. In the Barada gorge a Latin inscription cut in the rock records that Marcus Aurelius and Lucius Verus restored the road, broken away by the river, at the cost of the Abilenians."
  ru:
    - "Авилинея — небольшая область Абилы, города в ущелье реки Барады в Антиливане, на дороге из Дамаска в Гелиополь, нынешний Баальбек. Абила — это нынешнее село Сук-Вади-Барада к северо-западу от Дамаска в Сирии. Географ Птолемей называет её «Абилой Лисания», и Иосиф Флавий говорит об «Абиле Лисания» и о «тетрархии Лисания»: округ был остатком итурейского княжества Халкиды, правителя которого Лисания, сына Птолемея, сына Меннея, Антоний казнил ок. 36 г. до н. э. по наущению Клеопатры."
    - "Лука датирует начало проповеди Иоанна Крестителя по тогдашним правителям: «В пятнадцатый же год правления Тиверия кесаря», когда Пилат начальствовал в Иудее, Ирод был четвертовластником в Галилее, а Филипп — в Итурее и Трахонитской области, «а Лисаний четвертовластником в Авилинее», при первосвященниках Анне и Каиафе. Так как Иосиф Флавий не знает позднейшего Лисания, некоторые критики обвиняли Луку в ошибке; большинство учёных вслед за Эмилем Шюрером считают, что он говорит о младшем Лисании, четвертовластнике одной Абилы во времена Тиверия."
    - "Это подтверждает греческая надпись из Абилы: Нимфей, вольноотпущенник Лисания-тетрарха, посвятил храм и проложил дорогу ради благополучия «владык Августов», которыми обычно считают Тиверия и его мать Ливию, что относит её к 14–29 гг. н. э. Калигула отдал тетрархию Лисания Агриппе I в 37 г. н. э., Клавдий подтвердил за ним Абилу в 41 г., а в 53 г. она перешла к Агриппе II. В ущелье Барады латинская надпись, высеченная в скале, сообщает, что Марк Аврелий и Луций Вер восстановили дорогу, разрушенную рекой, на средства жителей Абилы."
  uk:
    - "Авілінея була невеликою областю навколо Абіли — міста в ущелині річки Барада в Антилібані, на дорозі з Дамаска до Геліополя, нині Баальбека. Абіла — це сучасне село Сук-Ваді-Барада на північний захід від Дамаска в Сирії. Географ Птолемей називає її «Абілою Лісанія», а Йосиф Флавій говорить про «Абілу Лісанія» і про «тетрархію Лісанія»: округ був залишком ітурейського князівства Халкіди, правителя якого Лісанія, сина Птолемея, сина Меннея, Антоній стратив близько 36 р. до н. е. з намови Клеопатри."
    - "Лука датує початок проповіді Івана Христителя за тодішніми правителями: «У пятнайцятий же рік правлення Тиверия кесаря», коли Пилат був правителем Юдеї, Ірод — тетрархом Галілеї, Пилип — Ітуреї й Трахонітської області, «а Лисаний четверовластником в Авилинї», за первосвящеників Анни й Каяфи. Оскільки Йосиф Флавій не називає пізнішого Лісанія, деякі критики закидали Луці помилку; більшість учених услід за Емілем Шюрером вважають, що він має на увазі молодшого Лісанія, тетрарха самої лише Абіли за часів Тиверія."
    - "Грецький напис з Абіли підтверджує цей погляд: Німфей, відпущеник тетрарха Лісанія, присвятив храм і збудував дорогу на благо панів Августів, якими зазвичай вважають Тиверія та його матір Лівію, що датує напис між 14 і 29 р. н. е. Калігула віддав тетрархію Лісанія Агріппі I 37 р. н. е., Клавдій 41 р. підтвердив за ним Абілу, а 53 р. вона перейшла до Агріппи II. В ущелині Баради вирубаний у скелі латинський напис повідомляє, що Марк Аврелій і Луцій Вер відновили дорогу, зруйновану річкою, коштом абілінців."
  es:
    - "Abilene era el pequeño territorio de Abila, población de la garganta del río Barada, en el Antilíbano, en el camino de Damasco a Heliópolis, hoy Baalbek. Abila es la actual aldea de Suq Wadi Barada, al noroeste de Damasco, en Siria. El geógrafo Ptolomeo la llama «Abila de Lisanias», y Josefo habla de «Abila de Lisanias» y de «la tetrarquía de Lisanias»: el distrito era un resto del principado itureo de Calcis, cuyo gobernante Lisanias, hijo de Ptolomeo hijo de Meneo, fue ejecutado por Antonio hacia 36 a. C. por instigación de Cleopatra."
    - "Lucas fecha el comienzo de la predicación de Juan el Bautista por los gobernantes de la época: «en el año quince del imperio de Tiberio César», con Pilato gobernador de Judea, Herodes tetrarca de Galilea y Felipe tetrarca de Iturea y de Traconite, «y Lisanias tetrarca de Abilinia», bajo los sumos sacerdotes Anás y Caifás. Como Josefo no nombra a ningún Lisanias posterior, algunos críticos acusaron a Lucas de error; la mayoría de los estudiosos, siguiendo a Emil Schürer, sostiene que se refiere a un Lisanias más joven, tetrarca solo de Abila en tiempos de Tiberio."
    - "Una inscripción griega de Abila apoya esta opinión: Ninfeo, liberto de Lisanias el tetrarca, dedicó un templo y construyó un camino por la salvación de los señores Augustos, que suelen identificarse con Tiberio y su madre Livia, lo cual la sitúa entre 14 y 29 d. C. Calígula dio la tetrarquía de Lisanias a Agripa I en 37 d. C., Claudio le confirmó Abila en 41, y en 53 pasó a Agripa II. En la garganta del Barada, una inscripción latina grabada en la roca recuerda que Marco Aurelio y Lucio Vero restauraron, a costa de los abilenos, el camino que el río había arrancado."
  pt:
    - "Abilene era o pequeno território de Abila, uma cidade na garganta do rio Barada, no Antilíbano, na estrada de Damasco a Heliópolis, hoje Baalbek. Abila é a atual aldeia de Souq Wadi Barada, a noroeste de Damasco, na Síria. O geógrafo Ptolomeu a chama de “Abila de Lisânias”, e Josefo fala de “Abila de Lisânias” e da “tetrarquia de Lisânias”: o distrito era um resquício do principado itureu de Cálcis, cujo governante Lisânias, filho de Ptolomeu, filho de Meneu, Antônio mandou matar por volta de 36 a.C., por instigação de Cleópatra."
    - "Lucas data o início da pregação de João Batista pelos governantes da época: “No décimo quinto ano do reinado de Tibério César”, sendo Pilatos governador da Judeia, Herodes tetrarca da Galileia, Filipe da Itureia e Traconites, “e Lisânias tetrarca de Abilene”, sob os sumos sacerdotes Anás e Caifás. Como Josefo não menciona nenhum Lisânias posterior, alguns críticos acusaram Lucas de erro; a maioria dos estudiosos, seguindo Emil Schürer, entende que ele se refere a um Lisânias mais jovem, tetrarca somente de Abila no tempo de Tibério."
    - "Uma inscrição grega de Abila apoia essa interpretação: Nimfeu, liberto de Lisânias, o tetrarca, dedicou um templo e construiu uma estrada pelo bem-estar dos senhores Augustos, em geral entendidos como Tibério e sua mãe Lívia, o que a situa entre 14 e 29 d.C. Calígula deu a tetrarquia de Lisânias a Agripa I em 37 d.C., Cláudio lhe confirmou Abila em 41, e em 53 ela passou a Agripa II. Na garganta do Barada, uma inscrição latina gravada na rocha registra que Marco Aurélio e Lúcio Vero restauraram, à custa dos abilenos, a estrada arrancada pelo rio."
  de:
    - "Abilene war das kleine Gebiet von Abila, einer Stadt in der Schlucht des Flusses Barada im Antilibanon, an der Straße von Damaskus nach Heliopolis, dem heutigen Baalbek. Abila ist das heutige Dorf Suk Wadi Barada nordwestlich von Damaskus in Syrien. Der Geograph Ptolemäus nennt es „Abila des Lysanias“, und Josephus spricht von „Abila des Lysanias“ und von „der Tetrarchie des Lysanias“: Der Bezirk war ein Überrest des ituräischen Fürstentums Chalkis, dessen Herrscher Lysanias, Sohn des Ptolemäus, des Sohnes des Mennaios, Antonius um 36 v. Chr. auf Betreiben Kleopatras hinrichten ließ."
    - "Lukas datiert den Beginn der Predigt Johannes des Täufers nach den Herrschern der Zeit: „in dem fünfzehnten Jahr des Kaisertums Kaisers Tiberius“, als Pilatus Landpfleger in Judäa war, Herodes Vierfürst in Galiläa, Philippus Vierfürst in Ituräa und Trachonitis „und Lysanias ein Vierfürst zu Abilene“, unter den Hohepriestern Hannas und Kaiphas. Da Josephus keinen späteren Lysanias nennt, warfen einige Kritiker Lukas einen Irrtum vor; die meisten Gelehrten halten im Anschluss an Emil Schürer dafür, dass er einen jüngeren Lysanias meint, der zur Zeit des Tiberius allein Tetrarch von Abila war."
    - "Eine griechische Inschrift aus Abila stützt diese Ansicht: Nymphaios, ein Freigelassener des Tetrarchen Lysanias, weihte einen Tempel und baute eine Straße zum Wohl der Herren Augusti, gewöhnlich als Tiberius und seine Mutter Livia verstanden, was die Inschrift in die Jahre 14 bis 29 n. Chr. datiert. Caligula gab die Tetrarchie des Lysanias 37 n. Chr. an Agrippa I., Claudius bestätigte ihm Abila 41, und 53 fiel es an Agrippa II. In der Baradaschlucht hält eine in den Fels gehauene lateinische Inschrift fest, dass Mark Aurel und Lucius Verus die vom Fluss weggerissene Straße auf Kosten der Abilener wiederherstellten."
  fr:
    - "L’Abilène était le petit territoire d’Abila, ville des gorges du Barada, dans l’Anti-Liban, sur la route de Damas à Héliopolis, aujourd’hui Baalbek. Abila est l’actuel village de Souq Wadi Barada, au nord-ouest de Damas, en Syrie. Le géographe Ptolémée l’appelle « Abila de Lysanias », et Josèphe mentionne « Abila de Lysanias » et « la tétrarchie de Lysanias » : le district était un reste de la principauté ituréenne de Chalcis, dont le souverain Lysanias, fils de Ptolémée fils de Mennaios, fut mis à mort par Antoine vers 36 av. J.-C., à l’instigation de Cléopâtre."
    - "Luc date le début de la prédication de Jean-Baptiste par les dirigeants du moment : « la quinzième année du règne de Tibère César », Pilate étant gouverneur de la Judée, Hérode tétrarque de la Galilée et Philippe de l’Iturée et de la Trachonite, « Lysanias tétrarque de l’Abilène », sous les souverains sacrificateurs Anne et Caïphe. Comme Josèphe ne nomme aucun Lysanias plus tardif, certains critiques ont accusé Luc d’erreur ; la plupart des exégètes, à la suite d’Emil Schürer, estiment qu’il pense à un Lysanias plus jeune, tétrarque d’Abila seule au temps de Tibère."
    - "Une inscription grecque d’Abila appuie cette vue : Nymphaeus, affranchi de Lysanias le tétrarque, y consacra un temple et construisit une route pour le salut des seigneurs Augustes, que l’on tient d’ordinaire pour Tibère et sa mère Livie, ce qui la place entre 14 et 29 apr. J.-C. Caligula donna la tétrarchie de Lysanias à Agrippa Ier en 37, Claude lui confirma Abila en 41, et en 53 elle passa à Agrippa II. Dans les gorges du Barada, une inscription latine gravée dans le roc rapporte que Marc Aurèle et Lucius Verus restaurèrent aux frais des Abiléniens la route, emportée par le fleuve."
  it:
    - "L’Abilene era il piccolo territorio di Abila, una città nella gola del fiume Barada, nell’Antilibano, sulla strada da Damasco a Eliopoli, oggi Baalbek. Abila è l’attuale villaggio di Souq Wadi Barada, a nord-ovest di Damasco, in Siria. Il geografo Tolomeo la chiama «Abila di Lisania», e Giuseppe Flavio parla di «Abila di Lisania» e della «tetrarchia di Lisania»: il distretto era un resto del principato iturèo di Calcide, il cui sovrano Lisania, figlio di Tolomeo figlio di Mennèo, fu messo a morte da Antonio verso il 36 a.C. per istigazione di Cleopatra."
    - "Luca data l’inizio della predicazione di Giovanni Battista in base ai governanti del tempo: «nell’anno decimoquinto dell’impero di Tiberio Cesare», quando Ponzio Pilato era «governatore della Giudea», Erode «tetrarca della Galilea» e Filippo «tetrarca dell’Iturea e della Traconitide», «e Lisania tetrarca dell’Abilene», «sotto i sommi sacerdoti Anna e Caiàfa». Poiché Giuseppe Flavio non nomina un Lisania più tardo, alcuni critici accusarono Luca di errore; la maggior parte degli studiosi, sulla scia di Emil Schürer, ritiene che si tratti di un Lisania più giovane, tetrarca della sola Abila al tempo di Tiberio."
    - "Un’iscrizione greca di Abila sostiene questa tesi: Ninfeo, liberto del tetrarca Lisania, dedicò un tempio e costruì una strada per la salute dei signori Augusti, di norma identificati con Tiberio e sua madre Livia, il che la colloca tra il 14 e il 29 d.C. Caligola diede la tetrarchia di Lisania ad Agrippa I nel 37 d.C., Claudio gli confermò Abila nel 41, e nel 53 passò ad Agrippa II. Nella gola del Barada un’iscrizione latina incisa nella roccia ricorda che Marco Aurelio e Lucio Vero ripristinarono la strada, rovinata dal fiume, a spese degli Abilenesi."
  nl:
    - "Abilene was het kleine gebied van Abila, een stad in de kloof van de Barada in de Anti-Libanon, aan de weg van Damascus naar Heliopolis, het huidige Baalbek. Abila is het huidige dorp Souq Wadi Barada, ten noordwesten van Damascus in Syrië. De geograaf Ptolemaeus noemt het ‘Abila van Lysanias’, en Josephus spreekt van ‘Abila van Lysanias’ en van ‘de tetrarchie van Lysanias’: het district was een overblijfsel van het Iturese vorstendom Chalcis, waarvan de heerser Lysanias, zoon van Ptolemaeus, zoon van Mennaeus, omstreeks 36 v.Chr. door Antonius op aandringen van Cleopatra ter dood werd gebracht."
    - "Lukas dateert het begin van de prediking van Johannes de Doper naar de heersers van die tijd: “in het vijftiende jaar der regering van den keizer Tiberius”, toen Pilatus stadhouder was over Judea, Herodes viervorst over Galilea en Filippus over Iturea en Trachonitis, “en Lysanias een viervorst over Abilene”, onder de hogepriesters Annas en Kajafas. Omdat Josephus geen latere Lysanias noemt, beschuldigden sommige critici Lukas van een vergissing; de meeste geleerden menen met Emil Schürer dat hij een jongere Lysanias bedoelt, die in de tijd van Tiberius alleen tetrarch van Abila was."
    - "Een Griekse inscriptie uit Abila ondersteunt deze opvatting: Nymphaeus, een vrijgelatene van de tetrarch Lysanias, wijdde een tempel en legde een weg aan voor het heil van de heren Augusti, gewoonlijk opgevat als Tiberius en zijn moeder Livia, wat haar tussen 14 en 29 n.Chr. plaatst. Caligula gaf de tetrarchie van Lysanias in 37 n.Chr. aan Agrippa I, Claudius bevestigde hem Abila in 41, en in 53 ging het over op Agrippa II. In de kloof van de Barada vermeldt een in de rots gehouwen Latijnse inscriptie dat Marcus Aurelius en Lucius Verus de weg, die door de rivier was weggeslagen, op kosten van de Abilenen herstelden."
  pl:
    - "Abilena była niewielkim obszarem należącym do Abili, miasta w wąwozie rzeki Barady w Antylibanie, przy drodze z Damaszku do Heliopolis, dzisiejszego Baalbeku. Abila to dzisiejsza wieś Suk Wadi Barada, na północny zachód od Damaszku w Syrii. Geograf Ptolemeusz nazywa ją „Abilą Lizaniasza”, a Józef Flawiusz mówi o „Abili Lizaniasza” i o „tetrarchii Lizaniasza”: okręg ten był pozostałością iturejskiego władztwa Chalkis, którego władcę Lizaniasza, syna Ptolemeusza, syna Menneusza, Antoniusz kazał zabić około 36 r. p.n.e. z namowy Kleopatry."
    - "Łukasz wyznacza początek nauczania Jana Chrzciciela według ówczesnych władców: „roku piętnastego panowania Tyberyjusza Cesarza”, gdy Piłat był namiestnikiem Judei, Herod tetrarchą Galilei, a Filip tetrarchą Iturei i Trachonitydy, „a Lizanijasz Tetrarchą Abileńskim”, za najwyższych kapłanów Annasza i Kajfasza. Ponieważ Józef Flawiusz nie wymienia późniejszego Lizaniasza, niektórzy krytycy zarzucali Łukaszowi błąd; większość uczonych, idąc za Emilem Schürerem, uważa, że ma on na myśli młodszego Lizaniasza, tetrarchę samej Abili za czasów Tyberiusza."
    - "Przemawia za tym grecki napis z Abili: Nimfajos, wyzwoleniec tetrarchy Lizaniasza, poświęcił świątynię i zbudował drogę dla pomyślności panów Augustów, zwykle rozumianych jako Tyberiusz i jego matka Liwia, co umieszcza napis między 14 a 29 r. n.e. Kaligula oddał tetrarchię Lizaniasza Agryppie I w 37 r. n.e., Klaudiusz zatwierdził mu Abilę w 41, a w 53 przeszła ona na Agryppę II. W wąwozie Barady łaciński napis wykuty w skale głosi, że Marek Aureliusz i Lucjusz Werus odnowili drogę zerwaną przez rzekę, na koszt Abileńczyków."
  cs:
    - "Abiléna bylo malé území města Abila, které leželo v soutěsce řeky Barada v Antilibanonu na cestě z Damašku do Héliopole, dnešního Baalbeku. Abila je dnešní vesnice Súk Wádí Barada severozápadně od Damašku v Sýrii. Geograf Ptolemaios ji nazývá „Abila Lysaniova“ a Josephus Flavius mluví o „Abile Lysaniově“ a o „tetrarchii Lysaniově“: oblast byla zbytkem iturejského knížectví Chalkis, jehož vládce Lysaniase, syna Ptolemaia syna Mennaiova, dal Antonius kolem roku 36 př. n. l. na popud Kleopatry popravit."
    - "Lukáš datuje počátek kázání Jana Křtitele podle tehdejších vládců: „Léta pak patnáctého císařství Tiberia císaře“, kdy Pilát spravoval Judsko, Herodes byl tetrarchou Galileje, Filip tetrarchou Iturejské a Trachonitské krajiny, „a Lyzaniáš čtvrtákem Abilinským“, za nejvyšších kněží Annáše a Kaifáše. Protože Josephus Flavius žádného pozdějšího Lysaniase nejmenuje, někteří kritikové Lukáše viní z omylu; většina učenců po Emilu Schürerovi soudí, že má na mysli mladšího Lysaniase, tetrarchu samotné Abily za Tiberiových časů."
    - "Tento názor podporuje řecký nápis z Abily: Nymfaios, propuštěnec tetrarchy Lysaniase, zasvětil chrám a vystavěl cestu pro blaho pánů Augustů, což se obvykle vykládá jako Tiberius a jeho matka Livia, a nápis se tak klade mezi roky 14 a 29 n. l. Kaligula dal tetrarchii Lysaniovu roku 37 n. l. Agrippovi I., Klaudius mu roku 41 potvrdil Abilu a roku 53 připadla Agrippovi II. V soutěsce Barada se zachoval latinský nápis vytesaný do skály, který uvádí, že Marcus Aurelius a Lucius Verus na náklady Abilenských obnovili cestu, kterou řeka podemlela."
  sv:
    - "Abilene var det lilla område som hörde till Abila, en stad i Baradaflodens ravin i Antilibanon, vid vägen från Damaskus till Heliopolis, nuvarande Baalbek. Abila är nuvarande byn Souq Wadi Barada, nordväst om Damaskus i Syrien. Geografen Ptolemaios kallar den ”Lysanias Abila”, och Josefus talar om ”Lysanias Abila” och om ”Lysanias tetrarki”: distriktet var en rest av det itureiska furstendömet Chalkis, vars härskare Lysanias, son till Ptolemaios Mennaios son, Antonius lät avrätta omkring 36 f.Kr. på Kleopatras tillskyndan."
    - "Lukas daterar början på Johannes döparens predikan efter tidens härskare: ”I femtonde året av kejsar Tiberius’ regering”, då Pilatus var landshövding i Judeen, Herodes landsfurste i Galileen och Filippos i Itureen och Trakonitis, ”och Lysanias landsfurste i Abilene”, under översteprästerna Hannas och Kajafas. Eftersom Josefus inte nämner någon senare Lysanias har vissa kritiker anklagat Lukas för ett misstag; de flesta forskare, efter Emil Schürer, anser att han menar en yngre Lysanias, tetrark över enbart Abila på Tiberius’ tid."
    - "En grekisk inskription från Abila stöder denna uppfattning: Nymphaios, en frigiven åt tetrarken Lysanias, helgade ett tempel och byggde en väg för de herrar Augustis välfärd, vilka vanligen antas vara Tiberius och hans mor Livia, vilket placerar den mellan 14 och 29 e.Kr. Caligula gav Lysanias tetrarki åt Agrippa I år 37 e.Kr., Claudius bekräftade Abila åt honom år 41, och år 53 gick det till Agrippa II. I Baradaravinen anger en latinsk inskription huggen i berget att Marcus Aurelius och Lucius Verus lät återställa vägen, som floden hade brutit bort, på abilenernas bekostnad."
  nb:
    - "Abilene var det lille området rundt Abila, en by i kløften til elven Barada i Anti-Libanon, ved veien fra Damaskus til Heliopolis, nå Baalbek. Abila er den nåværende landsbyen Souq Wadi Barada, nordvest for Damaskus i Syria. Geografen Ptolemaios kaller den «Abila til Lysanias», og Josefus taler om «Abila til Lysanias» og om «Lysanias' fjerdingsfyrstedømme»: distriktet var en rest av det ituraiske fyrstedømmet Khalkis, hvis hersker Lysanias, sønn av Ptolemaios, Mennaios' sønn, ble henrettet av Antonius omkring 36 f.Kr. etter Kleopatras tilskyndelse."
    - "Lukas daterer begynnelsen på døperen Johannes' forkynnelse ved tidens herskere: «I det femtende år av keiser Tiberius' regjering», med Pilatus som landshøvding i Judea, Herodes som fjerdingsfyrste i Galilea og Filip over Iturea og Trakonitis, «og Lysanias fjerdingsfyrste i Abilene», under yppersteprestene Annas og Kaifas. Siden Josefus ikke nevner noen senere Lysanias, anklaget noen kritikere Lukas for en feil; de fleste forskere, i tråd med Emil Schürer, mener at han sikter til en yngre Lysanias, fjerdingsfyrste over Abila alene på Tiberius' tid."
    - "En gresk innskrift fra Abila støtter dette synet: Nymfaios, en frigitt slave av fjerdingsfyrsten Lysanias, viet et tempel og bygde en vei til vel for herrene Augusti, vanligvis forstått som Tiberius og hans mor Livia, noe som plasserer den mellom 14 og 29 e.Kr. Caligula ga Lysanias' fjerdingsfyrstedømme til Agrippa I i 37 e.Kr., Klaudius stadfestet Abila som hans i 41, og i 53 gikk det over til Agrippa II. I Baradakløften forteller en latinsk innskrift hugget i fjellet at Marcus Aurelius og Lucius Verus gjenreiste veien, som elven hadde revet bort, på abilenernes bekostning."
