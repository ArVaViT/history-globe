body:
  en:
    - "Tamar, “palm”, is the southern anchor of the border of the land in Ezekiel's vision of its restoration: “And the south side southward, from Tamar even to the waters of strife in Kadesh, the river to the great sea”, and again for the lot of Gad, “from Tamar unto the waters of strife in Kadesh”. Some read the name also at the end of the eastern border, where the Hebrew letters that the King James Version takes as “ye shall measure” can be read as Tamar. The place was thus a known point south of the Dead Sea, on the way between the Arabah and the Negeb. The written Hebrew text of 1 Kings says that Solomon built “Tamar in the wilderness, in the land”, which the reading tradition and Chronicles turn into Tadmor, Palmyra in Syria; many scholars think the Judean Tamar is meant, a fort on the road to Edom and the Red Sea. Hazazon-tamar, “which is En-gedi”, is a different place."
    - "In Roman and Byzantine times a fort called Thamara stood in the same region: Eusebius describes it as a garrisoned village a day's journey from Mampsis on the road to Aila, and it appears on the Peutinger map. Two sites compete for both names. At En Hazeva (Ain Husb), an oasis in the northern Arabah some 35 km south of the Dead Sea, Rudolph Cohen and Yigal Yisrael excavated in 1987–1995 a series of fortresses from the tenth or ninth to the sixth century BC, the largest of them of the ninth and eighth centuries, and beside the last, smaller fort of the seventh and sixth centuries a pit of smashed cult vessels in Edomite style, and over them a Roman fort; many now call this Tamar. Mezad Tamar (Qasr el-Juheiniye), a small Roman fort in the hills south-west of the Dead Sea, excavated by Mordechai Gichon in 1973–1975, who identified it with Thamara, is the other candidate; the map shows both."
    - "En Hazeva today lies beside the Arabah road in Israel, with the partly restored fortresses open to visitors near the moshav of Ein Hatzeva; Mezad Tamar, a small square fort of the Roman period, stands in the Negev hills some 24 km to the north."
  ru:
    - "Тамара, «пальма», — южная опора границы земли в видении Иезекииля о её восстановлении: «А южный край с полуденной стороны от Тамары до вод пререкания при Кадисе, и по течению потока до великого моря», и снова для удела Гада — «от Тамары к водам пререкания при Кадисе». Некоторые читают это имя и в конце восточной границы, где еврейские буквы, понятые Библией короля Иакова как «отмерьте», можно прочесть как Тамара. Место, стало быть, было известной точкой к югу от Мёртвого моря, на пути между Аравой и Негевом. Еврейский текст Третьей книги Царств в написанном виде говорит, что Соломон построил «Тамар в пустыне, в земле», что чтение по традиции и Паралипоменон превращают в Фадмор, сирийскую Пальмиру; многие учёные думают, что имеется в виду иудейская Тамара, крепость на дороге в Едом и к Чермному морю. Хацацон-Фамар, «то есть в Енгедди», — другое место."
    - "В римское и византийское время в тех же краях стояла крепость Фамара: Евсевий описывает её как селение в дне пути от Мампсиса по дороге в Аилу, с гарнизоном, и она есть на Певтингеровой карте. За библейское и римское имя спорят два места. В Эйн-Хацеве (Айн-Хусб), оазисе в северной Араве примерно в 35 км к югу от Мёртвого моря, Рудольф Коэн и Игаль Исраэль раскопали в 1987–1995 годах ряд крепостей от X или IX до VI века до н. э., крупнейшую из них — IX–VIII веков, а рядом с последней, меньшей крепостью VII–VI веков — яму разбитых культовых сосудов в едомском стиле, а над ними римский форт; многие теперь называют это место Тамарой. Мецад-Тамар (Каср-эль-Джухейние), небольшой римский форт в горах к юго-западу от Мёртвого моря, раскопанный Мордехаем Гихоном в 1973–1975 годах, был отождествлён им с Фамарой и остаётся вторым кандидатом; на карте показаны оба."
    - "Эйн-Хацева сегодня лежит у дороги по Араве в Израиле, и частично восстановленные крепости открыты для посетителей рядом с мошавом Эйн-Хацева; Мецад-Тамар, небольшой квадратный форт римского времени, стоит в Негевских горах примерно в 24 км к северу."
  uk:
    - "Тамар, «пальма», — південний якір межі краю у видінні Єзекіїля про його відновлення: «полуденнїй бік на полуднї … від Тамару до вод переріку коло Кадесу, й попри потік до великого моря», і знову для уділу Гада: «від Тамару до вод переріку коло Кадесу». Дехто читає цю назву також наприкінці східної межі, де староєврейські літери, які Біблія короля Якова розуміє як «ви виміряєте», можна прочитати як Тамар. Отже, це було відоме місце на південь від Мертвого моря, на шляху між Аравою і Негевом. Староєврейський писаний текст Першої книги Царів каже, що Соломон збудував Тамар у пустелі, в тій землі; а усна традиція читання й Хроніки перетворюють це на Тадмор, Пальміру в Сирії; багато вчених думають, що йдеться про юдейський Тамар, фортецю на дорозі до Едому й Червоного моря. Хацацон-Тамар, «се б то в Енгеддї», — інше місце."
    - "У римську та візантійську добу в тому ж краю стояв форт Тамара: Євсевій описує його як село за день дороги від Мампсіса на шляху до Аїли, з гарнізоном, і він з’являється на Певтінгеровій карті. Два місця змагаються за обидві назви. У Ен-Хацеві (Айн-Хусб), оазі в північній Арабі приблизно за 35 км на південь від Мертвого моря, Рудольф Коен та Їгал Ісраель розкопали в 1987–1995 роках низку фортець від X чи IX до VI ст. до н. е., найбільшу з них — IX–VIII ст., а біля останньої, меншої фортеці VII–VI ст. — яму розбитих культових посудин в едомському стилі, а над ними римський форт; багато хто тепер називає це Тамаром. Мецад-Тамар (Каср-ель-Джухейнія), невеликий римський форт у пагорбах на південний захід від Мертвого моря, розкопаний Мордехаєм Гіхоном у 1973–1975 роках, був ототожнений розкопувачем із Тамарою і є другим кандидатом; мапа показує обидва."
    - "Ен-Хацева нині лежить біля дороги вздовж Арави в Ізраїлі, з частково відновленими фортецями, відкритими для відвідувачів поблизу мошаву Ейн-Хацева; Мецад-Тамар, невеликий квадратний форт римської доби, стоїть у пагорбах Негеву приблизно за 24 км на північ."
  es:
    - "Tamar, «palmera», ancla meridional de la frontera de la tierra en la visión restauradora de Ezequiel: «Y al lado del mediodía, hacia el mediodía, desde Tamar hasta las aguas de las rencillas; desde Cades y el arroyo hasta la gran mar», y de nuevo para la parte de Gad, «desde Tamar hasta las aguas de las rencillas». Algunos leen también el nombre al final de la frontera oriental, donde las letras hebreas que la King James toma como «mediréis» pueden leerse Tamar. Era un punto conocido al sur del mar Muerto, en el camino entre el Arabá y el Néguev. El texto hebreo escrito de 1 Reyes dice que Salomón edificó Tamar en el desierto, en aquella tierra, que la tradición de lectura y Crónicas convierten en Tadmor, Palmira, en Siria; muchos estudiosos creen que es el Tamar de Judá, un fuerte en el camino de Edom y el Mar Rojo. Hazezon-tamar, «que es Engedi», es otro lugar."
    - "En épocas romana y bizantina un fuerte llamado Thamara se alzaba en la misma región: Eusebio lo describe como aldea a una jornada de Mampsis en el camino de Aila, con guarnición, y aparece en la Tabla de Peutinger. Dos sitios compiten por ambos nombres. En En Hazeva (Ain Husb), un oasis del norte del Arabá, a unos 35 km al sur del mar Muerto, Rudolph Cohen y Yigal Yisrael excavaron en 1987–1995 fortalezas sucesivas del siglo X o IX al VI a. C., la mayor de ellas de los siglos IX y VIII, y junto a la última, menor, de los siglos VII y VI, una fosa de vasos de culto rotos en estilo edomita, y sobre ellas un fuerte romano; muchos lo llaman hoy Tamar. Mezad Tamar (Qasr el-Juheiniye), un pequeño fuerte romano en las colinas al suroeste del mar Muerto, excavado por Mordechai Gichon en 1973–1975, fue identificado con Thamara por su excavador, y es el otro candidato; el mapa muestra ambos."
    - "En Hazeva se encuentra hoy junto a la carretera del Arabá, en Israel, con las fortalezas parcialmente restauradas abiertas a los visitantes cerca del moshav de Ein Hatzeva; Mezad Tamar, un pequeño fuerte cuadrado de época romana, se alza en las colinas del Néguev unos 24 km al norte."
  pt:
    - "Tamar, “palmeira”, é o ponto sul de ancoragem da fronteira da terra na visão de Ezequiel sobre sua restauração: “O lado sul, em direção ao sul, será desde Tamar até as águas de Meribá-Cades, até o ribeiro, até o Mar Grande”, e de novo para o lote de Gade, “desde Tamar até as águas de Meribá-Cades”. Alguns leem o nome também no fim da fronteira leste, onde as letras hebraicas que a versão King James toma por “vocês medirão” podem ser lidas como Tamar. O lugar era, portanto, um ponto conhecido ao sul do Mar Morto, no caminho entre a Arabá e o Neguebe. O texto hebraico escrito de 1 Reis diz que Salomão construiu Tamar no deserto, na terra, o que a tradição de leitura e Crônicas transformam em Tadmor, Palmira, na Síria; muitos estudiosos pensam que se trata da Tamar de Judá, um forte na estrada para Edom e o Mar Vermelho. Hazazom-Tamar, “que é En-Gedi”, é outro lugar."
    - "Em tempos romanos e bizantinos, um forte chamado Thamara ficava na mesma região: Eusébio o descreve como uma aldeia a um dia de viagem de Mampsis, na estrada para Aila, com guarnição, e ele figura no mapa de Peutinger. Dois sítios disputam ambos os nomes. Em En Hazeva (Ain Husb), oásis no norte da Arabá cerca de 35 km ao sul do Mar Morto, Rudolph Cohen e Yigal Yisrael escavaram em 1987–1995 uma série de fortalezas do século X ou IX ao VI a.C., a maior delas dos séculos IX e VIII, e junto à última, menor, dos séculos VII e VI, uma fossa de vasos cultuais quebrados em estilo edomita, e sobre elas um forte romano; muitos hoje a chamam de Tamar. Mezad Tamar (Qasr el-Juheiniye), pequeno forte romano nas colinas a sudoeste do Mar Morto, escavado por Mordechai Gichon em 1973–1975, foi identificado com Thamara por seu escavador e é o outro candidato; o mapa mostra ambos."
    - "En Hazeva fica hoje junto à estrada da Arabá, em Israel, com as fortalezas parcialmente restauradas abertas a visitantes perto do moshav de Ein Hatzeva; Mezad Tamar, um pequeno forte quadrado do período romano, ergue-se nas colinas do Neguebe, uns 24 km ao norte."
  de:
    - "Tamar, „Palme“, ist der südliche Eckpunkt der Landesgrenze in Hesekiels Vision der Wiederherstellung: „die Grenze gegen Mittag ist von Thamar bis ans Haderwasser zu Kades und den Bach hinab bis an das große Meer“, ebenso für Gad: „von Thamar bis ans Haderwasser zu Kades“. Manche lesen den Namen auch am Ende der Ostgrenze, wo die Buchstaben, die man als „sollt ihr messen“ liest, auch Tamar ergeben können. Der Ort war also ein bekannter Punkt südlich des Toten Meeres, zwischen Araba und Negev. Nach dem geschriebenen Text von 1. Könige baute Salomo „Thamar in der Wüste im Lande“, was Leseüberlieferung und Chronik zu Tadmor, dem syrischen Palmyra, machen; viele meinen das judäische Tamar, eine Festung an der Straße nach Edom und zum Roten Meer. Hazezon-Tamar, „das ist Engedi“, ist ein anderer Ort."
    - "In römisch-byzantinischer Zeit stand in derselben Gegend ein Kastell Thamara: Eusebius beschreibt es als Dorf mit Garnison, eine Tagesreise von Mampsis an der Straße nach Aila, und steht auf der Peutinger-Karte. Zwei Stätten konkurrieren. In En Hazeva (Ain Husb), einer Oase der nördlichen Araba, 35 km südlich des Toten Meeres, legten Rudolph Cohen und Yigal Yisrael 1987–1995 mehrere Festungen vom zehnten oder neunten bis zum sechsten Jahrhundert v. Chr. frei, die größte aus dem neunten und achten, neben der letzten, kleineren aus dem siebten und sechsten Jahrhundert eine Grube zerschlagener Kultgefäße im edomitischen Stil, darüber ein römisches Kastell; viele nennen es Tamar. Mezad Tamar (Qasr el-Juheiniye), ein kleines römisches Kastell südwestlich des Toten Meeres, von Mordechai Gichon 1973–1975 ausgegraben und mit Thamara gleichgesetzt, ist der andere Kandidat; die Karte zeigt beide."
    - "En Hazeva liegt heute an der Straße durch die Araba in Israel, mit den teilweise restaurierten Festungen, die nahe dem Moschaw Ein Hatzeva Besuchern offenstehen; Mezad Tamar, ein kleines quadratisches Kastell der Römerzeit, steht in den Hügeln des Negev etwa 24 km nördlich."
  fr:
    - "Thamar, « palmier », ancre au sud la frontière du pays dans la vision de sa restauration chez Ézéchiel : « Le côté méridional, au midi, ira depuis Thamar jusqu’aux eaux de Meriba à Kadès, jusqu’au torrent vers la grande mer », et de nouveau pour le lot de Gad, « depuis Thamar, jusqu’aux eaux de Meriba à Kadès ». Certains lisent aussi le nom à la fin de la frontière orientale, où les lettres hébraïques que la King James rend par « vous mesurerez » peuvent se lire Thamar. C’était donc un point connu au sud de la mer Morte, sur le chemin entre l’Araba et le Négev. Selon le texte écrit de 1 Rois, Salomon bâtit Thamar au désert, dans le pays, que la tradition de lecture et les Chroniques changent en Thadmor, Palmyre en Syrie ; beaucoup pensent à la Thamar de Juda, fort sur la route d’Édom et de la mer Rouge. Hatsatson-Thamar, « qui est En-Guédi », est un autre lieu."
    - "À l’époque romaine et byzantine, un fort appelé Thamara se dressait dans la même région : Eusèbe le décrit comme un village à une journée de Mampsis sur la route d’Aila, avec une garnison, et il figure sur la Table de Peutinger. Deux sites se disputent les deux noms. À En Hazeva (Aïn Husb), oasis du nord de l’Araba à environ 35 km au sud de la mer Morte, Rudolph Cohen et Yigal Yisrael fouillèrent en 1987-1995 une série de forteresses du Xe ou IXe au VIe siècle av. J.-C., la plus grande des IXe et VIIIe siècles, et près de la dernière, plus petite, des VIIe et VIe siècles, une fosse de vases cultuels brisés de style édomite, et par-dessus un fort romain ; beaucoup y voient Thamar. Mezad Tamar (Qasr el-Juheiniye), petit fort romain au sud-ouest de la mer Morte, fouillé par Mordechai Gichon en 1973-1975, qui l’identifia à Thamara, est l’autre candidat ; la carte montre les deux."
    - "En Hazeva se trouve aujourd’hui au bord de la route de l’Araba, en Israël, avec ses forteresses en partie restaurées ouvertes aux visiteurs près du moshav d’Ein Hatzeva ; Mezad Tamar, petit fort carré de l’époque romaine, se dresse dans les collines du Négev à environ 24 km au nord."
  pl:
    - "Tamar, „palma”, jest południowym punktem oparcia granicy ziemi w widzeniu Ezechiela o jej odnowieniu: „A strona południowa na południe od Tamar aż do wód poswarków w Kades, od potoku aż do morza wielkiego”, i znowu przy dziale Gada: „od Tamar aż do wód poswarku w Kades”. Niektórzy czytają tę nazwę także na końcu granicy wschodniej, gdzie hebrajskie litery, które Biblia Króla Jakuba bierze za „mierzyć będziecie”, można odczytać jako Tamar. Miejsce było więc znanym punktem na południe od Morza Martwego, na drodze między Arabą a Negewem. Hebrajski tekst pisany 1 Księgi Królewskiej mówi, że Salomon zbudował Tamar na pustyni w tym kraju, co tradycja odczytywania i Księgi Kronik zmieniają w Tadmor, Palmyrę w Syrii; wielu badaczy sądzi, że chodzi o judejskie Tamar, fort przy drodze do Edomu i Morza Czerwonego. Chasason-Tamar, „które jest Engaddy”, to miejsce inne."
    - "W czasach rzymskich i bizantyjskich w tym samym regionie stał fort zwany Thamara: Euzebiusz opisuje go jako wieś o dzień drogi od Mampsis na drodze do Aili, z załogą, a figuruje on na tablicy Peutingerów. Dwa stanowiska rywalizują o obie. W En Chaceva (Ajn Husb), oazie w północnej Arabie około 35 km na południe od Morza Martwego, Rudolph Cohen i Jigal Jisrael wykopali w latach 1987–1995 szereg fortec od X lub IX do VI wieku p.n.e., z których największa pochodzi z IX i VIII wieku, a obok ostatniej, mniejszej, z VII i VI wieku dół ze stłuczonymi naczyniami kultowymi w stylu edomickim, a nad nimi fort rzymski; wielu nazywa dziś to miejsce Tamar. Mecad Tamar (Kasr el-Dżuchejnije), mały fort rzymski na wzgórzach na południowy zachód od Morza Martwego, badany przez Mordechaja Gichona w latach 1973–1975, został przez odkrywcę utożsamiony z Thamarą i jest drugim kandydatem; mapa pokazuje oba."
    - "En Chaceva leży dziś przy drodze wzdłuż Araby w Izraelu, z częściowo odnowionymi fortecami dostępnymi dla zwiedzających w pobliżu moszawu Ejn Chaceva; Mecad Tamar, mały kwadratowy fort z okresu rzymskiego, stoi na wzgórzach Negewu około 24 km na północ."
  it:
    - "Tamar, «palma», è l’ancora meridionale del confine del paese nella visione ezechielica della sua restaurazione: «La parte meridionale si dirigerà verso mezzogiorno, da Tamar fino alle acque di Meriboth di Kades, fino al torrente che va nel mar Grande», e di nuovo per il lotto di Gad, «da Tamar fino alle acque di Meriba di Kades». Alcuni leggono il nome anche in fondo al confine orientale, dove le lettere ebraiche rese «ye shall measure» dalla King James Version possono leggersi Tamar. Era dunque un punto noto a sud del Mar Morto, sulla via fra l’Araba e il Negheb. Il testo ebraico scritto di 1 Re dice che Salomone costruì Tamar nella parte deserta del paese, e la tradizione di lettura e le Cronache lo mutano in Tadmor, Palmira in Siria; molti pensano alla Tamar giudea, un forte sulla strada per Edom e il Mar Rosso. Casason-Tamar, «che è En-Ghedi», è altro luogo."
    - "In epoca romana e bizantina un forte chiamato Thamara sorgeva nella stessa regione: Eusebio lo descrive come un villaggio a un giorno di cammino da Mampsis sulla strada per Aila, con una guarnigione, e compare sulla Tavola Peutingeriana. Due siti si contendono i nomi. A En Hazeva (Ain Husb), un’oasi nell’Araba settentrionale a circa 35 km a sud del Mar Morto, Rudolph Cohen e Yigal Yisrael scavarono nel 1987–1995 una serie di fortezze dal X o IX al VI secolo a.C., la maggiore delle quali del IX e VIII secolo, e accanto all’ultima, più piccola, del VII e VI secolo una fossa di vasi cultuali frantumati in stile edomita, e sopra un forte romano; molti oggi la chiamano Tamar. Mezad Tamar (Qasr el-Juheiniye), un piccolo forte romano sulle colline a sud-ovest del Mar Morto, scavato da Mordechai Gichon nel 1973–1975, che lo identificò con Thamara, è l’altro candidato; la mappa mostra entrambi."
    - "En Hazeva si trova oggi accanto alla strada dell’Araba, in Israele, con le fortezze parzialmente restaurate aperte ai visitatori presso il moshav di Ein Hatzeva; Mezad Tamar, un piccolo forte quadrato di epoca romana, sorge sulle colline del Negheb a circa 24 km a nord."
  nl:
    - "Tamar, “palm”, is het zuidelijke ankerpunt van de grens van het land in Ezechiëls visioen van het herstel: “En den zuiderhoek zuidwaarts van Thamar af, tot aan het twistwater van Kades, voorts naar de beek henen, tot aan de grote zee”, en voor het gebied van Gad, “van Thamar af, naar het twistwater van Kades”. Sommigen lezen de naam ook aan het eind van de oostgrens, waar Hebreeuwse letters die de King James Version als “ye shall measure” opvat, ook Tamar kunnen zijn. Het was dus een bekend punt ten zuiden van de Dode Zee, tussen Araba en Negev. Volgens de geschreven Hebreeuwse tekst van 1 Koningen bouwde Salomo “Tamor in de woestijn, in dat land”, wat de leestraditie en Kronieken tot Tadmor, Palmyra in Syrië, maken; velen menen dat het Judese Tamar bedoeld is, een fort aan de weg naar Edom en de Rode Zee. Hazezon-Tamar, “hetwelk is Engedi”, is een andere plaats."
    - "In de Romeinse en Byzantijnse tijd stond in die streek een fort Thamara: Eusebius beschrijft het als een dorp op een dagreis van Mampsis aan de weg naar Aila, met een garnizoen, en het staat op de Peutingerkaart. Twee plaatsen dingen mee. Bij En Hazeva (Ain Husb), een oase in de noordelijke Araba zo’n 35 km ten zuiden van de Dode Zee, groeven Rudolph Cohen en Yigal Yisrael in 1987–1995 een reeks vestingen op uit de 10e of 9e tot de 6e eeuw v.Chr., de grootste uit de 9e en 8e eeuw, en naast de laatste, kleinere uit de 7e en 6e eeuw een kuil met verbrijzelde cultusvaten in Edomitische stijl, en erboven een Romeins fort; velen noemen dit Tamar. Mezad Tamar (Qasr el-Juheiniye), een klein Romeins fort in de heuvels ten zuidwesten van de Dode Zee, door Mordechai Gichon in 1973–1975 opgegraven en door hem met Thamara vereenzelvigd, is de andere kandidaat; de kaart toont beide."
    - "En Hazeva ligt tegenwoordig naast de weg door de Araba in Israël, met de gedeeltelijk herstelde vestingen open voor bezoekers bij de mosjav Ein Hatzeva; Mezad Tamar, een klein vierkant fort uit de Romeinse tijd, staat in de heuvels van de Negev zo’n 24 km naar het noorden."
  cs:
    - "Tamar, „palma“, je jižní kotva hranice země ve vidění jejího obnovení u Ezechiela: „Strana pak polední na poledne, od Támar až k vodám sváru v Kádes, od potoka až k moři velikému“, a znovu pro úděl Gádův „od Támar až k vodám sváru v Kádes“. Někteří čtou jméno i na konci východní hranice, kde hebrejská písmena, jež King James Version bere jako „budete měřit“, lze číst jako Tamar. Místo tedy bylo známým bodem jižně od Mrtvého moře, na cestě mezi Arabou a Negevem. Psaný hebrejský text 1. Královské praví, že Šalomoun vystavěl Tamar na poušti v zemi, což čtená tradice a Kroniky mění na Tadmor, Palmýru v Sýrii; mnozí učenci míní judský Tamar, pevnost na cestě do Edómu a k Rudému moři. Chacacon-tamar, „jenž jest Engadi“, je jiné místo."
    - "V římské a byzantské době stála ve stejné oblasti pevnost zvaná Thamara: Eusebius ji popisuje jako vesnici denní cesty od Mampsidy na cestě do Ailu, s posádkou, a objevuje se na Peutingerově mapě. O obě jména soupeří dvě lokality. V Én Chacévě (Ajn Husb), oáze v severní Arabě asi 35 km jižně od Mrtvého moře, Rudolph Cohen a Jigal Jisrael v letech 1987–1995 vykopali řadu pevností od 10. či 9. do 6. stol. př. n. l., největší z nich z 9. a 8. století, vedle poslední, menší pevnosti ze 7. a 6. století jámu rozbitých kultovních nádob v edómském stylu a nad nimi římskou pevnost; mnozí ji nyní nazývají Tamar. Mecad Tamar (Qasr el-Juheiniye), malá římská pevnost v kopcích jihozápadně od Mrtvého moře, kterou v letech 1973–1975 vykopal Mordechaj Gichon, byla svým vykopávačem ztotožněna s Thamarou a je druhým kandidátem, a mapa ukazuje obě."
    - "Én Chacéva dnes leží u silnice po Arabě v Izraeli, s částečně obnovenými pevnostmi přístupnými návštěvníkům poblíž mošavu Ejn Chacéva; Mecad Tamar, malá čtvercová pevnost z římského období, stojí v kopcích Negevu asi 24 km na sever."
  sv:
    - "Tamar, ”palm”, är den södra fixpunkten för landets gräns i Hesekiels syn av dess återupprättelse: ”Och på sydsidan, söderut, skall gränsen gå från Tamar till Meribots vatten vid Kades, till bäcken, fram till Stora havet”, och åter för Gads lott, ”från Tamar över Meribas vatten vid Kades”. Några läser namnet också i slutet av östgränsen, där de hebreiska bokstäver som King James-översättningen tar som ”ye shall measure” kan läsas som Tamar. Platsen var alltså en känd punkt söder om Döda havet, på vägen mellan Arava och Negev. Den skrivna hebreiska texten i Första Kungaboken säger att Salomo byggde ”Tamar i öknen där i landet”, vilket läsetraditionen och Krönikeboken gör till Tadmor, Palmyra i Syrien; många forskare menar att det judeiska Tamar avses, ett fort på vägen till Edom och Sävhavet. Hasason-Tamar, ”det är En-Gedi”, är en annan plats."
    - "Under romersk och bysantinsk tid fanns ett fort kallat Thamara i samma region: Eusebios beskriver det som en garnisonsby en dagsresa från Mampsis på vägen till Aila, och det finns på Peutingerkartan. Två platser tävlar om båda namnen. Vid En Hazeva (Ain Husb), en oas i norra Arava omkring 35 km söder om Döda havet, grävde Rudolph Cohen och Yigal Yisrael 1987–1995 ut en serie fästningar från 900- eller 800-talet till 500-talet f.Kr., den största från 800- och 700-talen, och bredvid det sista, mindre fortet från 600- och 500-talen en grop med krossade kultkärl i edomitisk stil, och över dem ett romerskt fort; många kallar nu detta Tamar. Mezad Tamar (Qasr el-Juheiniye), ett litet romerskt fort i bergen sydväst om Döda havet, utgrävt av Mordechai Gichon 1973–1975, som identifierade det med Thamara, är den andra kandidaten; kartan visar båda."
    - "En Hazeva ligger i dag vid Aravavägen i Israel, med de delvis restaurerade fästningarna öppna för besökare nära moshavet Ein Hatzeva; Mezad Tamar, ett litet kvadratiskt fort från romartiden, står i Negevbergen omkring 24 km norrut."
