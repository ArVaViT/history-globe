body:
  en:
    - "Ephrathah, a longer form of Ephrath, is the old name of Bethlehem in Judah, or of the clan and district around it; David's father Jesse is called “that Ephrathite of Beth-lehem-judah”, and Micah addresses “Beth-lehem Ephratah”. This place on the map stands for two verses. In Ruth the people and elders at the gate bless Boaz as he takes Ruth to wife: “do thou worthily in Ephratah, and be famous in Beth-lehem”, the two names set side by side as one place. Chronicles lists “the sons of Hur, the firstborn of Ephratah, the father of Beth-lehem”."
    - "The second verse is harder. Psalm 132 recalls David's search for a resting place for the ark: “Lo, we heard of it at Ephratah: we found it in the fields of the wood.” The “fields of the wood”, in Hebrew sedeh ya'ar and in the Synodal Russian the fields of Jarim, are usually taken as Kiriath-jearim, where the ark stayed twenty years. Some read Ephratah here as Bethlehem, David's home, where the news was heard; others as the Ephrathite clan that, by the genealogy of Chronicles, also founded Kiriath-jearim; still others as the land of Ephraim, where the ark once stood at Shiloh. The verse does not settle it."
  ru:
    - "Ефрафа — древнее имя Вифлеема в Иудее или рода и округи вокруг него; о Давиде сказано, что он был «сын Ефрафянина из Вифлеема Иудина», а Михей обращается: «И ты, Вифлеем-Ефрафа». Эта точка на карте стоит за двумя стихами. В книге Руфь народ и старейшины у ворот благословляют Вооза, берущего Руфь в жёны: «приобретай богатство в Ефрафе, и да славится имя твое в Вифлееме», ставя оба имени рядом как одно место. В Паралипоменоне названы «сыновья Хура, первенца Ефрафы, отца Вифлеема»."
    - "Второй стих труднее. Псалом 131 (в еврейском счёте 132) вспоминает, как Давид искал место покоя для ковчега: «Вот, мы слышали о нем в Ефрафе, нашли его на полях Иарима». Слова «на полях Иарима», по-еврейски «сде яар», «поля леса», обычно понимают как Кириаф-Иарим, где ковчег пробыл двадцать лет. Одни видят в Ефрафе здесь Вифлеем, родину Давида, где о ковчеге услышали; другие — род Ефрафы, который, по родословию Паралипоменона, основал и Кириаф-Иарим; третьи — землю Ефрема, где ковчег некогда стоял в Силоме. Стих этого не решает."
  uk:
    - "Ефрафа, довша форма Ефрати, — давня назва Вифлеєму в Юді або роду й округи навколо нього; Давидового батька Єссея названо «Ефратїя із Бетлеєма Юдиного», а Міха звертається: «Бетлеєме — ти, Ефрато». Це місце на мапі відповідає двом віршам. У Книзі Рут народ і старійшини в брамі благословляють Вооза, коли він бере Рут за жінку: «Надбай богацтва в Ефратї, і нехай славиться у Вефлеємі імя твоє!», дві назви поставлено поряд як одне місце. Хроніки перелічують «сини в Гура, найстаршого в Ефратї, Бетлеємського батька (князя)»."
    - "Другий вірш важчий. Псалом 132 згадує пошуки Давидом місця спочинку для ковчега: «Ось ми чували про неї в Ефратї, знайшли її на полях Яарських». «Поля лісу», єврейською седе я'ар, а в Синодальному російському — поля Яріма, зазвичай вважають Кіріят-Єарімом, де ковчег пробув двадцять років. Одні читають тут Ефрафу як Вифлеєм, дім Давида, де почули звістку; інші — як рід ефратян, який, за родоводом Хронік, заснував також Кіріят-Єарим; ще інші — як землю Єфрема, де колись ковчег стояв у Шіло. Вірш цього не вирішує."
  es:
    - "Efrata (en hebreo Efratá), forma más larga de Efrat, es el antiguo nombre de Belén de Judá, o del clan y el distrito que lo rodean; Isaí, el padre de David, es llamado «aquel hombre Ephrateo de Beth-lehem de Judá», y Miqueas se dirige a «Beth-lehem Ephrata». Este lugar del mapa representa dos versículos. En Rut, el pueblo y los ancianos a la puerta bendicen a Booz cuando toma a Rut por mujer: «tú seas ilustre en Ephrata, y tengas nombradía en Beth-lehem», los dos nombres puestos juntos como un solo lugar. Crónicas enumera «los hijos de Hur, primogénito de Ephrata, padre de Beth-lehem»."
    - "El segundo versículo es más difícil. El Salmo 132 recuerda la búsqueda de David de un lugar de reposo para el arca: «He aquí, en Ephrata oímos de ella: hallámosla en los campos del bosque.» Los «campos del bosque», en hebreo sedeh ya'ar y en la Biblia sinodal rusa los campos de Jarim, suelen tomarse por Quiriat-jearim, donde el arca permaneció veinte años. Algunos leen aquí Efrata como Belén, la patria de David, donde se oyó la noticia; otros como el clan efrateo que, según la genealogía de Crónicas, fundó también Quiriat-jearim; otros aún como la tierra de Efraín, donde estuvo el arca en otro tiempo, en Silo. El versículo no lo decide."
  pt:
    - "Efrate, forma mais longa de Efrata, é o antigo nome de Belém de Judá, ou do clã e do distrito em torno dela; Jessé, pai de Davi, é chamado “daquele efrateu de Belém de Judá”, e Miqueias se dirige a “Belém Efrata”. Este lugar no mapa representa dois versículos. Em Rute, o povo e os anciãos à porta abençoam Boaz ao tomar Rute por esposa: “que você prospere em Efrata e seja famoso em Belém”, os dois nomes postos lado a lado como um só lugar. As Crônicas listam “os filhos de Hur, o primogênito de Efrata, o pai de Belém”."
    - "O segundo versículo é mais difícil. O Salmo 132 recorda a busca de Davi por um lugar de repouso para a arca: “Eis que ouvimos falar dela em Efrata. Nós a encontramos no campo de Jaar.” O “campo de Jaar”, em hebraico sedeh ya'ar e no russo Sinodal os campos de Jarim, costuma ser tomado por Quiriate-Jearim, onde a arca ficou vinte anos. Alguns leem aqui Efrata como Belém, a terra de Davi, onde a notícia foi ouvida; outros, como o clã efrateu que, segundo a genealogia das Crônicas, fundou também Quiriate-Jearim; outros ainda, como a terra de Efraim, onde a arca esteve outrora em Siló. O versículo não decide."
  de:
    - "Ephratha, eine längere Form von Efrata, ist der alte Name von Bethlehem in Juda oder des Geschlechts und Bezirks um es; von Davids Vater heißt es: „David aber war jenes ephrathischen Mannes Sohn von Bethlehem-Juda, der hieß Isai“, und Micha redet an: „Bethlehem Ephrata“. Dieser Ort auf der Karte steht für zwei Verse. Im Buch Rut segnen das Volk und die Ältesten am Tor Boas, als er Rut zur Frau nimmt: „und wachse sehr in Ephratha und werde gepriesen zu Bethlehem“, die beiden Namen nebeneinandergestellt als ein Ort. Die Chronik führt „die Söhne Hurs, des ersten Sohns von der Ephratha“ auf, „des Vaters Bethlehems“."
    - "Der zweite Vers ist schwieriger. Psalm 132 erinnert an Davids Suche nach einer Ruhestätte für die Lade: „Siehe, wir hörten von ihr in Ephratha; wir haben sie gefunden auf dem Felde des Waldes.“ Das „Feld des Waldes“, hebräisch sedeh ja‘ar und in der russischen Synodalbibel die Felder von Jarim, wird gewöhnlich als Kirjat-Jearim verstanden, wo die Lade zwanzig Jahre blieb. Manche lesen Ephratha hier als Bethlehem, Davids Heimat, wo man die Nachricht hörte; andere als das ephrathische Geschlecht, das nach der Genealogie der Chronik auch Kirjat-Jearim gründete; wieder andere als das Land Ephraim, wo die Lade einst in Silo stand. Der Vers entscheidet es nicht."
  fr:
    - "Éphratha, forme plus longue d’Éphrata, est l’ancien nom de Bethléem de Juda, ou du clan et du district qui l’entourent ; Isaï, père de David, est appelé « cet Éphratien de Bethléhem de Juda », et Michée s’adresse à « Bethléhem Éphrata ». Ce lieu de la carte tient pour deux versets. Dans Ruth, le peuple et les anciens à la porte bénissent Boaz qui prend Ruth pour femme : « Manifeste ta force dans Éphrata, et fais-toi un nom dans Bethléhem », les deux noms posés côte à côte comme un seul lieu. Les Chroniques énumèrent « les fils de Hur, premier-né d’Éphrata, père de Bethléhem »."
    - "Le second verset est plus difficile. Le psaume 132 rappelle la recherche par David d’un lieu de repos pour l’arche : « Voici, nous en entendîmes parler à Éphrata, nous la trouvâmes dans les champs de Jaar ». Les « champs de Jaar » (« champs de la forêt »), en hébreu sedeh ya’ar et, dans la Bible russe synodale, les champs de Jarim, sont généralement tenus pour Kirjath-Jearim, où l’arche resta vingt ans. Certains lisent ici Éphratha comme Bethléem, patrie de David, où la nouvelle fut entendue ; d’autres comme le clan éphratien qui, selon la généalogie des Chroniques, fonda aussi Kirjath-Jearim ; d’autres encore comme le pays d’Éphraïm, où l’arche se tint jadis à Silo. Le verset ne tranche pas."
  it:
    - "Efrata, forma più lunga di Efrat, è l’antico nome di Betlemme di Giuda, o del clan e del distretto attorno ad essa; il padre di Davide, Iesse, è chiamato «quell’Efrateo di Bethlehem di Giuda», e Michea si rivolge a «Bethlehem Efrata». Questo luogo sulla mappa sta per due versetti. In Rut il popolo e gli anziani alla porta benedicono Booz mentre prende Rut in moglie: «Spiega la tua forza in Efrata, e fatti un nome in Bethlehem!», i due nomi posti accanto come un solo luogo. Le Cronache elencano «i figliuoli di Hur, primogenito di Efrata, padre di Bethlehem»."
    - "Il secondo versetto è più difficile. Il Salmo 132 ricorda la ricerca di Davide di un luogo di riposo per l’arca: «Ecco abbiamo udito che l’Arca era in Efrata; l’abbiam trovata nei campi di Jaar.» I «campi di Jaar» (in ebraico sedeh ya‘ar, «campi del bosco», e nel russo sinodale i campi di Jarim) sono di solito identificati con Kiriat-Iearim, dove l’arca rimase vent’anni. Alcuni leggono qui Efrata come Betlemme, la patria di Davide, dove la notizia fu udita; altri come il clan efrateo che, secondo la genealogia delle Cronache, fondò anche Kiriat-Iearim; altri ancora come la terra di Efraim, dove l’arca stette un tempo a Silo. Il versetto non decide."
  pl:
    - "Efrata (hebr. Efratah), dłuższa postać Efrat, jest dawną nazwą Betlejem w Judzie albo rodu i okręgu wokół niego; Dawid jest „synem męża Efratejczyka z Betlehem Juda”, to znaczy Jessego, a Mika zwraca się do „Betlehemie Efrata”. To miejsce na mapie stoi za dwa wersety. W Księdze Rut lud i starsi w bramie błogosławią Booza, gdy bierze Rut za żonę: „Poczynajże sobie mężnie w Efracie, zjednaj sobie imię w Betlehemie”, dwie nazwy ustawione obok siebie jako jedno miejsce. Księga Kronik wymienia: „synowie Hura, pierworodnego Efraty, ojca Betlehemczyków”."
    - "Drugi werset jest trudniejszy. Psalm 132 przypomina poszukiwania przez Dawida miejsca spoczynku dla arki: „Oto usłyszawszy o niej w Efracie, znaleźliśmy ją na polach leśnych.” „Pola leśne”, po hebrajsku sedeh ja'ar, a w rosyjskim synodalnym pola Jarim, uważa się zwykle za Kiriat-Jearim, gdzie arka przebywała dwadzieścia lat. Niektórzy odczytują tu Efratę jako Betlejem, dom Dawida, gdzie usłyszano wieść; inni jako ród Efratejczyków, który według rodowodu z Księgi Kronik założył też Kiriat-Jearim; jeszcze inni jako ziemię Efraima, gdzie arka niegdyś stała w Szilo. Werset tego nie rozstrzyga."
  nl:
    - "Efratha, een langere vorm van Efrata, is de oude naam van Bethlehem in Juda, of van de clan en het district eromheen; Davids vader Isaï heet “den Efrathischen man van Bethlehem-Juda”, en Micha spreekt “Bethlehem Efratha” toe. Deze plaats op de kaart staat voor twee verzen. In Ruth zegenen het volk en de oudsten in de poort Boaz als hij Ruth tot vrouw neemt: “handel kloekelijk in Efratha, en maak uw naam vermaard in Bethlehem”, de twee namen naast elkaar als één plaats. Kronieken vermeldt “de kinderen van Hur, den eerstgeborene van Efratha, den vader van Bethlehem”."
    - "Het tweede vers is moeilijker. Psalm 132 herinnert aan Davids zoektocht naar een rustplaats voor de ark: “Ziet, wij hebben van haar gehoord in Efratha; wij hebben haar gevonden in de velden van Jaar.” De “velden van Jaar”, in het Hebreeuws sedeh ya'ar en in de Synodale Russische Bijbel de velden van Jarim, worden gewoonlijk opgevat als Kirjat-Jearim, waar de ark twintig jaar bleef. Sommigen lezen Efratha hier als Bethlehem, Davids thuis, waar het nieuws werd gehoord; anderen als de Efrathitische clan die volgens het geslachtsregister van Kronieken ook Kirjat-Jearim stichtte; weer anderen als het land Efraïm, waar de ark eens te Silo stond. Het vers beslist het niet."
  cs:
    - "Efrata, delší tvar jména Efrat, je staré jméno Betléma v Judsku nebo rodu a okresu kolem něj; David je označen jako „syn muže Efratejského z Betléma Judova“, tedy Jišaje, a Micheáš oslovuje „Betléme Efrata“. Toto místo na mapě stojí za dva verše. V Rut lid a starší v bráně žehnají Bóazovi, když bere Rut za ženu: „Počínejž sobě zmužile v Efratě, a dosáhni jména v Betlémě“, obě jména postavená vedle sebe jako jedno místo. Letopisy uvádějí: „Ti jsou synové Hur prvorozeného Efraty, otce Betlémských“."
    - "Druhý verš je těžší. Žalm 132 připomíná Davidovo hledání místa odpočinku pro truhlu: „Aj, uslyšavše o ní, že byla v kraji Efratském, našli jsme ji na polích Jaharských“. Pole lesa, hebrejsky sede jaar, a v synodálním ruském textu pole Jarim, se obvykle pokládají za Kirjat-jearím, kde truhla zůstala dvacet let. Někteří čtou Efratu zde jako Betlém, Davidův domov, kde se zpráva uslyšela; jiní jako efratejský rod, který podle rodopisu v Letopisech založil také Kirjat-jearím; ještě jiní jako zemi Efrajim, kde truhla kdysi stála v Šílu. Verš to nerozhoduje."
  sv:
    - "Efrata, en längre form av Efrat, är det gamla namnet på Betlehem i Juda, eller på släkten och distriktet kring det; Davids far Isai kallas ”den omtalade efratiten från Bet-Lehem i Juda”, och Mika vänder sig till ”du Bet-Lehem Efrata”. Denna plats på kartan står för två verser. I Rut välsignar folket och de äldste i porten Boas när han tar Rut till hustru: ”Och må du förkovra dig storligen i Efrata och göra dig ett namn i Bet-Lehem”, de två namnen sida vid sida som en och samma plats. Krönikeboken förtecknar ”söner till Hur, Efratas förstfödde, Bet-Lehems fader”."
    - "Den andra versen är svårare. Psalm 132 erinrar om Davids sökande efter en viloplats för arken: ”Ja, vi hörde därom i Efrata, vi förnummo det i skogsbygden.” ”Skogsbygden”, på hebreiska sedeh ya’ar och i den ryska synodala bibeln Jearims fält, tas vanligen som Kirjat-Jearim, där arken stannade tjugu år. Några läser Efrata här som Betlehem, Davids hem, där nyheten hördes; andra som den efratitiska släkt som, enligt släktregistret i Krönikeboken, också grundade Kirjat-Jearim; ytterligare andra som Efraims land, där arken en gång stod i Shilo. Versen avgör det inte."
  nb:
    - "Efrata, en lengre form av Efrat, er det gamle navnet på Betlehem i Juda, eller på slekten og distriktet rundt den; Davids far Isai kalles «efratitt fra Betlehem i Juda», og Mika taler til «Betlehem, Efrata». Dette stedet på kartet står for to vers. I Rut velsigner folket og de eldste i porten Boas når han tar Rut til hustru: «gid du må bli en mektig mann i Efrata og få en navnkundig sønn i Betlehem!», de to navnene satt side om side som ett sted. Krønikebøkene lister «sønner av Hur, Efratas førstefødte sønn og far til Betlehem»."
    - "Det andre verset er vanskeligere. Salme 132 minner om Davids leting etter et hvilested for arken: «Se, vi hørte om den i Efrata, vi fant den i skogsbygden.» «Skogsbygden», på hebraisk sedeh ya'ar og i den russiske synodale Jarims marker, regnes vanligvis for Kirjat-Jearim, der arken ble i tjue år. Noen leser Efrata her som Betlehem, Davids hjem, der nyheten ble hørt; andre som den efratittiske slekten som, ifølge Krønikebøkenes slektsregistre, også grunnla Kirjat-Jearim; atter andre som Efraims land, der arken en gang sto i Sjilo. Verset avgjør det ikke."
  tl:
    - "Ang Ephratah, mas mahabang anyo ng Ephrath, ay ang lumang pangalan ng Bethlehem sa Juda, o ng angkan at distrito sa palibot nito; si Isai, ama ni David, ay tinatawag na “anak niyaong Ephrateo sa Bethlehem-juda”, at kinakausap ni Mikas ang “Beth-lehem Ephrata”. Ang lugar na ito sa mapa ay para sa dalawang talata. Sa Ruth, binabasbasan ng bayan at ng mga matanda sa pintuang-bayan si Booz nang kunin niya si Ruth bilang asawa: “maging makapangyarihan ka sa Ephrata, at maging bantog sa Bethlehem”, na magkatabi ang dalawang pangalan bilang iisang pook. Inililista ng Mga Cronica ang “mga anak ni Hur, na panganay ni Ephrata, na ama ni Bethlehem”."
    - "Mas mahirap ang ikalawang talata. Inaalala ng Awit 132 ang paghahanap ni David ng pahingahan para sa kaban: “Narito, narinig namin sa Ephrata: aming nasumpungan sa mga parang ng gubat.” Ang “mga parang ng gubat”, sa Hebreo na sedeh ya'ar at sa Sinodal na Ruso ay mga parang ng Jarim, ay karaniwang itinuturing na Kiriath-jearim, kung saan nanatili ang kaban nang dalawampung taon. Binabasa ng ilan ang Ephrata rito bilang Bethlehem, tahanan ni David, kung saan narinig ang balita; ng iba bilang angkang Ephrateo na, ayon sa talaan ng lahi sa Mga Cronica, ay nagtatag din ng Kiriath-jearim; at ng iba pa bilang lupain ni Ephraim, kung saan minsang nakatayo ang kaban sa Shiloh. Hindi ito napagpapasyahan ng talata."
  da:
    - "Efrata, en længere form af Efrat, er det gamle navn for Betlehem i Juda, eller for slægten og distriktet omkring det; David er »hin efratitiske Mands Søn fra Bethlehem i Juda«, nemlig Isajs, og Mika tiltaler »Bethlehem Efrata«. Dette sted på kortet står for to vers. I Ruth velsigner folket og de ældste i porten Boaz, da han tager Ruth til hustru: »bliv du mægtig i Efrata og bliv navnkundig i Bethlehem«, de to navne sat side om side som ét sted. Krønikebøgerne opregner »Børn af Hur, som var Efratas førstefødte, Bethlehems Fader«."
    - "Det andet vers er sværere. Salme 132 erindrer Davids søgen efter et hvilested for arken: »Se, vi hørte om den i Efrata; vi fandt den paa Jaars Mark.« »Jaars Mark«, på hebraisk sedeh ya'ar og i den russiske synodalbibel Jarims marker, antages sædvanligvis at være Kirjat-Jearim, hvor arken blev i tyve år. Nogle læser Efrata her som Betlehem, Davids hjem, hvor nyheden blev hørt; andre som den efratitiske slægt, der ifølge Krønikebøgernes slægtsregister også grundlagde Kirjat-Jearim; atter andre som Efraims land, hvor arken engang stod i Silo. Verset afgør det ikke."
