# Overview article (ADR 0007). Mainstream facts only; the Gospel sites are given as the traditional ones; heights are approximate.
id: mount-of-olives
place: ac2c4c5
title:
  en: "Mount of Olives"
  ru: "Гора Елеонская"
body:
  en:
    - "The Mount of Olives is the ridge east of Jerusalem, across the Kidron valley from the Temple Mount, which it overlooks by some 80 m; its main summit rises above 800 m, and Mount Scopus continues the ridge to the north. Its name comes from its old olive groves. On its western slope lies the Jewish cemetery, used for burial since antiquity and the most revered in Judaism, and at its foot the Kidron tombs and the garden of Gethsemane."
    - "David fled from Absalom this way: he “went up by the ascent of mount Olivet, and wept as he went up”, barefoot, with his head covered. Solomon built high places “in the hill that is before Jerusalem” for Chemosh and Molech, which Josiah defiled three centuries later. Ezekiel saw the glory of the LORD leave the city and stand “upon the mountain which is on the east side of the city”, and Zechariah foretold the day of the LORD: “his feet shall stand in that day upon the mount of Olives, which is before Jerusalem on the east, and the mount of Olives shall cleave in the midst thereof”. The Mishnah records that the red heifer was burnt on the mount and the new-moon beacon lit there."
    - "In the Gospels the mount frames the last week of Jesus. From Bethphage he sent for the colt and rode down into the city; at the descent the crowd praised God, and he wept over Jerusalem. He taught in the temple by day, “and at night he went out, and abode in the mount that is called the mount of Olives”; sitting there “over against the temple”, he spoke of the end. After the last supper he went “as he was wont, to the mount of Olives”, to the place called Gethsemane, where he prayed and was arrested. Luke places the ascension on the mount, “which is from Jerusalem a sabbath day's journey”. Josephus tells how in AD 70 the Tenth Legion camped on the mount, and how an Egyptian prophet had gathered his followers there."
    - "Constantine and his mother Helena built the basilica of Eleona over the cave where Jesus was believed to have taught, and late in the fourth century the round church of the Imbomon stood on the summit; Egeria describes the Palm Sunday procession down the mount and the night vigils at Gethsemane. The small Chapel of the Ascension, rebuilt by the Crusaders, has been a mosque since Saladin. Today the mount, in East Jerusalem, carries the village of at-Tur, the Russian church of Mary Magdalene, the Church of All Nations at Gethsemane (1924), Dominus Flevit (1955) and the Pater Noster convent on the site of the Eleona."
  ru:
    - "Гора Елеонская — известняковая гряда к востоку от Иерусалима, за Кедронской долиной напротив Храмовой горы, над которой она возвышается примерно на 80 м; её главная вершина поднимается выше 800 м, а к северу гряду продолжает гора Скопус. Имя дано по оливковым рощам, некогда покрывавшим гору. На западном склоне лежит еврейское кладбище, где хоронят с древности, самое почитаемое в иудаизме, а у подножия — гробницы Кедрона и Гефсиманский сад."
    - "Этим путём Давид бежал от Авессалома: «Давид пошел на гору Елеонскую, шел и плакал», босой, с покрытой головой. Соломон построил капища Хамосу и Молоху «на горе, которая пред Иерусалимом», и три века спустя Иосия их осквернил; книга Царств называет это место «направо от Масличной горы». Иезекииль видел, как слава Господня покинула город и «остановилась над горою, которая на восток от города», а Захария предрёк день Господень: «И станут ноги Его в тот день на горе Елеонской, которая перед лицем Иерусалима к востоку; и раздвоится гора Елеонская». Мишна сообщает, что на горе, лицом к святилищу, сжигали рыжую телицу и что здесь зажигали огонь, возвещавший новомесячие."
    - "В Евангелиях гора обрамляет последнюю неделю Иисуса. Из Виффагии Он послал за ослёнком и спустился в город; у спуска с горы народ славил Бога, а Он заплакал об Иерусалиме. Днём Он учил в храме, «а ночи, выходя, проводил на горе, называемой Елеонскою»; сидя там «против храма», Он говорил о конце. После Тайной вечери Он пошёл «по обыкновению на гору Елеонскую», на место, называемое Гефсимания, где молился и был взят. Лука помещает вознесение на эту гору, которая «находится близ Иерусалима, в расстоянии субботнего пути». Иосиф Флавий рассказывает, как в 70 г. н. э. Тит поставил на горе Елеонской стан Десятого легиона и как некий пророк из Египта собирал на ней своих последователей."
    - "Константин и его мать Елена построили базилику Элеона над пещерой, где, по преданию, учил Иисус, а в конце IV века на вершине встала круглая церковь Имвомон; Эгерия описывает шествие в Вербное воскресенье вниз с горы и ночные бдения в Гефсимании. Малая часовня Вознесения, перестроенная крестоносцами, со времён Саладина служит мечетью. Сегодня на горе, в Восточном Иерусалиме, стоят селение Эт-Тур, русская церковь Марии Магдалины, церковь Всех Наций в Гефсимании (1924), церковь Dominus Flevit (1955) и монастырь Pater Noster на месте Элеоны."
