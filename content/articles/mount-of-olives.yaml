body:
  en:
    - "The Mount of Olives is the ridge east of Jerusalem, across the Kidron valley from the Temple Mount, which it overlooks by some 80 m; its main summit rises above 800 m, and Mount Scopus continues the ridge to the north. Its name comes from its old olive groves. On its western slope lies the Jewish cemetery, used for burial since antiquity and the most revered in Judaism, and at its foot the Kidron tombs and the garden of Gethsemane."
    - "David fled from Absalom this way: he “went up by the ascent of mount Olivet, and wept as he went up”, barefoot, with his head covered. Solomon built high places “in the hill that is before Jerusalem” for Chemosh and Molech, which Josiah defiled three centuries later. Ezekiel saw the glory of the LORD leave the city and stand “upon the mountain which is on the east side of the city”, and Zechariah foretold the day of the LORD: “his feet shall stand in that day upon the mount of Olives, which is before Jerusalem on the east, and the mount of Olives shall cleave in the midst thereof”. The Mishnah records that the red heifer was burnt on the mount and the new-moon beacon lit there."
    - "In the Gospels the mount frames the last week of Jesus. From Bethphage he sent for the colt and rode down into the city; at the descent the crowd praised God, and he wept over Jerusalem. He taught in the temple by day, “and at night he went out, and abode in the mount that is called the mount of Olives”; sitting there “over against the temple”, he spoke of the end. After the last supper he went “as he was wont, to the mount of Olives”, to the place called Gethsemane, where he prayed and was arrested. Luke places the ascension on the mount, “which is from Jerusalem a sabbath day's journey”. Josephus tells how in AD 70 the Tenth Legion camped on the mount, and how an Egyptian prophet had gathered his followers there."
    - "Constantine and his mother Helena built the basilica of Eleona over the cave where Jesus was believed to have taught, and late in the fourth century the round church of the Imbomon stood on the summit; Egeria describes the Palm Sunday procession down the mount and the night vigils at Gethsemane. The small Chapel of the Ascension, rebuilt by the Crusaders, has been a mosque since Saladin. Today the mount, in East Jerusalem, carries the village of at-Tur, the Russian church of Mary Magdalene, the Church of All Nations at Gethsemane (1924), Dominus Flevit (1955) and the Pater Noster convent on the site of the Eleona."
  ru:
    - "Гора Елеонская — известняковая гряда к востоку от Иерусалима, за Кедронской долиной напротив Храмовой горы, над которой она возвышается примерно на 80 м; её главная вершина поднимается выше 800 м, а к северу гряду продолжает гора Скопус. Имя дано по оливковым рощам, некогда покрывавшим гору. На западном склоне лежит еврейское кладбище, где хоронят с древности, самое почитаемое в иудаизме, а у подножия — гробницы Кедрона и Гефсиманский сад."
    - "Этим путём Давид бежал от Авессалома: «Давид пошел на гору Елеонскую, шел и плакал», босой, с покрытой головой. Соломон построил капища Хамосу и Молоху «на горе, которая пред Иерусалимом», и три века спустя Иосия их осквернил; книга Царств называет это место «направо от Масличной горы». Иезекииль видел, как слава Господня покинула город и «остановилась над горою, которая на восток от города», а Захария предрёк день Господень: «И станут ноги Его в тот день на горе Елеонской, которая перед лицем Иерусалима к востоку; и раздвоится гора Елеонская». Мишна сообщает, что на горе, лицом к святилищу, сжигали рыжую телицу и что здесь зажигали огонь, возвещавший новомесячие."
    - "В Евангелиях гора обрамляет последнюю неделю Иисуса. Из Виффагии Он послал за ослёнком и спустился в город; у спуска с горы народ славил Бога, а Он заплакал об Иерусалиме. Днём Он учил в храме, «а ночи, выходя, проводил на горе, называемой Елеонскою»; сидя там «против храма», Он говорил о конце. После Тайной вечери Он пошёл «по обыкновению на гору Елеонскую», на место, называемое Гефсимания, где молился и был взят. Лука помещает вознесение на эту гору, которая «находится близ Иерусалима, в расстоянии субботнего пути». Иосиф Флавий рассказывает, как в 70 г. н. э. Тит поставил на горе Елеонской стан Десятого легиона и как некий пророк из Египта собирал на ней своих последователей."
    - "Константин и его мать Елена построили базилику Элеона над пещерой, где, по преданию, учил Иисус, а в конце IV века на вершине встала круглая церковь Имвомон; Эгерия описывает шествие в Вербное воскресенье вниз с горы и ночные бдения в Гефсимании. Малая часовня Вознесения, перестроенная крестоносцами, со времён Саладина служит мечетью. Сегодня на горе, в Восточном Иерусалиме, стоят селение Эт-Тур, русская церковь Марии Магдалины, церковь Всех Наций в Гефсимании (1924), церковь Dominus Flevit (1955) и монастырь Pater Noster на месте Элеоны."
  uk:
    - "Оливкова гора — хребет на схід від Єрусалима, через долину Кедрон від Храмової гори, над якою вона височіє приблизно на 80 м; її головна вершина здіймається понад 800 м, а гора Скопус продовжує хребет на північ. Назва походить від її давніх оливкових гаїв. На її західному схилі лежить єврейський цвинтар, що вживається для поховань з давнини й є найшанованішим в іудаїзмі, а біля її підніжжя — гробниці Кедрону й сад Гетсиманії."
    - "Давид утікав від Авесалома цим шляхом: «Давид же ійшов на Оливну Гору, плачучи й окривши голову», босоніж. Соломон збудував на «горі, що проти Ерусалиму» висоти для Хемоша й Молоха, які Йосія осквернив три століття потому. Єзекіїль бачив, як слава Господня покинула місто й зупинилася «над горою, що на востоцї од городу», а Захарія провістив день Господа: «І стануть ноги його на горі Оливній, що навпроти Ерусалиму до сходу сонця, й розпадеться Оливна гора надвоє по серединї». Мішна записує, що на горі спалювали руду телицю і запалювали вогонь новомісяччя."
    - "В Євангеліях гора обрамлює останній тиждень Ісуса. З Віфагії він послав по осля й в’їхав у місто; на спуску натовп хвалив Бога, і він заплакав над Єрусалимом. Він навчав у храмі вдень, «ночами ж виходячи, пробував на горі, званій Оливною»; сидячи там «навпроти церкви», він говорив про кінець. Після Таємної вечері він «пійшов по звичаю на гору Оливну», до місця Гетсиманія, де молився й був схоплений. Лука розміщує Вознесіння на горі, «що поблизу Єрусалиму на субітнїй день ходи». Йосиф Флавій розповідає, як 70 р. н. е. X легіон розташувався табором на горі і як єгипетський пророк збирав там своїх послідовників."
    - "Костянтин і його мати Єлена збудували базиліку Елеона над печерою, де, як вірили, навчав Ісус, а наприкінці IV ст. на вершині стояла кругла церква Імбомон; Егерія описує процесію Вербної неділі вниз по горі та нічні чування в Гетсиманії. Мала каплиця Вознесіння, відбудована хрестоносцями, є мечеттю від часів Салах-ад-Діна. Сьогодні гора, у Східному Єрусалимі, несе село ат-Тур, російську церкву Марії Магдалини, Церкву Всіх Націй у Гетсиманії (1924), Домінус Флевіт (1955) і монастир Патер Ностер на місці Елеони."
  es:
    - "El monte de los Olivos es la cresta al este de Jerusalén, al otro lado del valle del Cedrón respecto al Monte del Templo, al que domina unos 80 m; su cumbre principal se eleva por encima de los 800 m, y el monte Scopus continúa la cresta hacia el norte. Su nombre procede de sus antiguos olivares. En su ladera occidental se halla el cementerio judío, usado para entierros desde la antigüedad y el más venerado del judaísmo, y a su pie las tumbas del Cedrón y el huerto de Getsemaní."
    - "David huyó de Absalón por este camino: «subió la cuesta de las olivas; y subió [...] llorando», descalzo y con la cabeza cubierta. Salomón construyó lugares altos «en el monte que está enfrente de Jerusalem» para Quemós y Moloc, que Josías profanó tres siglos después. Ezequiel vio la gloria de Jehová salir de la ciudad y detenerse «sobre el monte que está al oriente de la ciudad», y Zacarías anunció el día de Jehová: «Y afirmaránse sus pies en aquel día sobre el monte de las Olivas, que está en frente de Jerusalem á la parte de oriente: y el monte de las Olivas, se partirá por medio de sí». La Misná registra que la vaca roja se quemaba en el monte y que allí se encendía el fuego de aviso de la luna nueva."
    - "En los Evangelios el monte enmarca la última semana de Jesús. Desde Betfagé mandó a buscar el pollino y bajó cabalgando a la ciudad; en la bajada la multitud alabó a Dios, y él lloró sobre Jerusalén. Enseñaba en el templo de día, «y de noche saliendo, estábase en el monte que se llama de las Olivas»; sentado allí «delante del templo», habló del fin. Tras la última cena fue, «como solía, al monte de las Olivas», al lugar llamado Getsemaní, donde oró y fue arrestado. Lucas sitúa la ascensión en el monte, «el cual está cerca de Jerusalem camino de un sábado». Josefo cuenta que en 70 d. C. la Legión Décima acampó en el monte, y que un profeta egipcio había reunido allí a sus seguidores."
    - "Constantino y su madre Elena construyeron la basílica de Eleona sobre la cueva donde se creía que Jesús había enseñado, y a finales del siglo IV la iglesia circular del Imbomon se alzaba en la cumbre; Egeria describe la procesión del Domingo de Ramos bajando por el monte y las vigilias nocturnas en Getsemaní. La pequeña Capilla de la Ascensión, reconstruida por los cruzados, es una mezquita desde Saladino. Hoy el monte, en Jerusalén Este, tiene la aldea de at-Tur, la iglesia rusa de María Magdalena, la Iglesia de Todas las Naciones en Getsemaní (1924), Dominus Flevit (1955) y el convento del Pater Noster en el lugar de la Eleona."
  pt:
    - "O monte das Oliveiras é a crista a leste de Jerusalém, do outro lado do vale do Cedrom a partir do Monte do Templo, que domina por uns 80 m; seu cume principal se eleva acima de 800 m, e o monte Scopus prolonga a crista para o norte. Seu nome vem de seus antigos olivais. Em sua encosta ocidental fica o cemitério judaico, usado para sepultamento desde a Antiguidade e o mais venerado no judaísmo, e ao seu pé os túmulos do Cedrom e o jardim do Getsêmani."
    - "Davi fugiu de Absalão por aqui: “subia pela encosta do Monte das Oliveiras, e chorava enquanto subia”, descalço, com a cabeça coberta. Salomão construiu altos “no monte que está em frente a Jerusalém” para Camos e Moloque, que Josias profanou três séculos depois. Ezequiel viu a glória do SENHOR deixar a cidade e parar “sobre o monte que está ao lado leste da cidade”, e Zacarias predisse o dia do SENHOR: “os seus pés estarão sobre o monte das Oliveiras, que está em frente a Jerusalém, a leste; e o monte das Oliveiras será fendido ao meio”. A Mishná registra que a novilha vermelha era queimada no monte e o sinal de fogo da lua nova era aceso ali."
    - "Nos Evangelhos, o monte emoldura a última semana de Jesus. De Betfagé ele mandou buscar o jumentinho e desceu à cidade; na descida a multidão louvou a Deus, e ele chorou sobre Jerusalém. Ensinava no templo de dia, e “todas as noites ele saía e passava a noite no monte que é chamado das Oliveiras”; sentado ali “de frente para o templo”, falou do fim. Depois da última ceia foi, “como era o seu costume, para o Monte das Oliveiras”, ao lugar chamado Getsêmani, onde orou e foi preso. Lucas situa a ascensão no monte, “que fica perto de Jerusalém, à distância de uma jornada de sábado”. Josefo conta como em 70 d.C. a Décima Legião acampou no monte, e como um profeta egípcio reunira ali seus seguidores."
    - "Constantino e sua mãe Helena construíram a basílica do Eleona sobre a caverna onde se cria que Jesus ensinara, e no fim do século IV a igreja redonda do Imbomon ficava no cume; Egéria descreve a procissão do Domingo de Ramos descendo o monte e as vigílias noturnas no Getsêmani. A pequena Capela da Ascensão, reconstruída pelos cruzados, é mesquita desde Saladino. Hoje o monte, em Jerusalém Oriental, abriga a aldeia de at-Tur, a igreja russa de Maria Madalena, a Igreja de Todas as Nações no Getsêmani (1924), o Dominus Flevit (1955) e o convento do Pater Noster no sítio do Eleona."
  de:
    - "Der Ölberg ist der Höhenzug östlich von Jerusalem, jenseits des Kidrontals vom Tempelberg, den er um etwa 80 m überragt; sein Hauptgipfel steigt über 800 m, und der Skopusberg setzt den Rücken nach Norden fort. Sein Name stammt von seinen alten Olivenhainen. An seinem Westhang liegt der jüdische Friedhof, seit der Antike für Bestattungen genutzt und der am meisten verehrte im Judentum, und an seinem Fuß die Kidrongräber und der Garten Gethsemane."
    - "David floh auf diesem Weg vor Absalom: „David aber ging den Ölberg hinan und weinte, und sein Haupt war verhüllt, und er ging barfuß.“ Salomo baute Höhen für Kemosch und Moloch „auf dem Berge, der vor Jerusalem liegt“, die Josia drei Jahrhunderte später verunreinigte. Hesekiel sah die Herrlichkeit des HERRN die Stadt verlassen und sich „auf den Berg, der gegen Morgen vor der Stadt liegt“, stellen, und Sacharja kündigte den Tag des HERRN an: „Und seine Füße werden stehen zu der Zeit auf dem Ölberge, der vor Jerusalem liegt gegen Morgen. Und der Ölberg wird sich mitten entzwei spalten“. Die Mischna berichtet, dass die rote Kuh auf dem Berg verbrannt und das Neumondfeuer dort entzündet wurde."
    - "In den Evangelien rahmt der Berg die letzte Woche Jesu. Von Betphage aus ließ er das Fohlen holen und ritt in die Stadt hinab; beim Abstieg lobte die Menge Gott, und er weinte über Jerusalem. Er lehrte am Tag im Tempel, „des Nachts aber ging er hinaus und blieb über Nacht am Ölberge“; dort saß er „gegenüber dem Tempel“ und sprach vom Ende. Nach dem letzten Abendmahl ging er „nach seiner Gewohnheit an den Ölberg“, an den Ort namens Gethsemane, wo er betete und gefangen genommen wurde. Lukas legt die Himmelfahrt auf den Berg, „welcher ist nahe bei Jerusalem und liegt einen Sabbatweg davon“. Josephus erzählt, wie im Jahr 70 n. Chr. die Zehnte Legion auf dem Berg lagerte und wie ein ägyptischer Prophet seine Anhänger dort gesammelt hatte."
    - "Konstantin und seine Mutter Helena bauten die Basilika Eleona über der Höhle, in der Jesus gelehrt haben sollte, und im späten 4. Jahrhundert stand auf dem Gipfel die Rundkirche des Imbomon; Egeria beschreibt die Palmsonntagsprozession den Berg hinab und die Nachtwachen in Gethsemane. Die kleine Himmelfahrtskapelle, von den Kreuzfahrern wieder aufgebaut, ist seit Saladin eine Moschee. Heute trägt der Berg, in Ostjerusalem, das Dorf at-Tur, die russische Kirche der Maria Magdalena, die Kirche aller Nationen in Gethsemane (1924), Dominus Flevit (1955) und das Pater-Noster-Kloster an der Stelle der Eleona."
  fr:
    - "Le mont des Oliviers est la crête à l’est de Jérusalem, de l’autre côté de la vallée du Cédron en face du mont du Temple, qu’il domine d’environ 80 m ; son principal sommet s’élève à plus de 800 m, et le mont Scopus prolonge la crête vers le nord. Son nom vient de ses anciennes oliveraies. Sur sa pente occidentale se trouve le cimetière juif, utilisé depuis l’Antiquité et le plus vénéré du judaïsme, et à son pied les tombes du Cédron et le jardin de Gethsémané."
    - "David fuit Absalom par ce chemin : il « monta la colline des oliviers. Il montait en pleurant », pieds nus, la tête couverte. Salomon bâtit des hauts lieux « sur la montagne qui est en face de Jérusalem » pour Kemosch et Moloc, que Josias souilla trois siècles plus tard. Ézéchiel vit la gloire de l’Éternel quitter la ville et se placer « sur la montagne qui est à l’orient de la ville », et Zacharie annonça le jour de l’Éternel : « Ses pieds se poseront en ce jour sur la montagne des oliviers, qui est vis-à-vis de Jérusalem, du côté de l’orient ; la montagne des oliviers se fendra par le milieu ». La Michna rapporte que la vache rousse était brûlée sur le mont et que le signal de la nouvelle lune y était allumé."
    - "Dans les Évangiles, le mont encadre la dernière semaine de Jésus. De Bethphagé il envoya chercher l’ânon et descendit, monté dessus, dans la ville ; à la descente, la foule loua Dieu, et il pleura sur Jérusalem. Il enseignait le jour dans le temple, et il « allait passer la nuit à la montagne appelée montagne des oliviers » ; assis là « en face du temple », il parla de la fin. Après le dernier repas, il alla « selon sa coutume, à la montagne des oliviers », au lieu appelé Gethsémané, où il pria et fut arrêté. Luc place l’ascension sur le mont, « qui est près de Jérusalem, à la distance d’un chemin de sabbat ». Flavius Josèphe raconte qu’en 70 apr. J.-C. la Xe légion campa sur le mont, et qu’un prophète égyptien y avait rassemblé ses partisans."
    - "Constantin et sa mère Hélène bâtirent la basilique de l’Éléona sur la grotte où l’on croyait que Jésus avait enseigné, et à la fin du IVe siècle l’église ronde de l’Imbomon se dressait au sommet ; Égérie décrit la procession des Rameaux descendant le mont et les veillées nocturnes à Gethsémané. La petite chapelle de l’Ascension, rebâtie par les croisés, est une mosquée depuis Saladin. Aujourd’hui, le mont, à Jérusalem-Est, porte le village d’at-Tur, l’église russe Sainte-Marie-Madeleine, l’église de toutes les Nations à Gethsémané (1924), Dominus Flevit (1955) et le couvent du Pater Noster sur l’emplacement de l’Éléona."
  it:
    - "Il Monte degli Ulivi è la dorsale a est di Gerusalemme, al di là della valle del Cedron rispetto al Monte del Tempio, che sovrasta di circa 80 m; la sua cima principale supera gli 800 m, e il Monte Scopus continua la dorsale a nord. Il nome viene dai suoi antichi uliveti. Sul suo pendio occidentale giace il cimitero ebraico, usato per le sepolture fin dall’antichità e il più venerato dell’ebraismo, e ai suoi piedi le tombe del Cedron e il giardino del Getsemani."
    - "Davide fuggì da Assalonne per questa via: «Davide saliva il monte degli Ulivi; saliva piangendo», con il capo coperto e a piedi scalzi. Salomone costruì alti luoghi «sul monte che sta dirimpetto a Gerusalemme» per Chemosh e Molec, che Giosia contaminò tre secoli dopo. Ezechiele vide la gloria dell’Eterno lasciare la città e fermarsi «sul monte ch’è ad oriente della città», e Zaccaria predisse il giorno dell’Eterno: «I suoi piedi si poseranno in quel giorno sul monte degli Ulivi ch’è dirimpetto a Gerusalemme a levante, e il monte degli Ulivi si spaccherà per il mezzo». La Mishnà registra che la giovenca rossa veniva bruciata sul monte e vi si accendeva il fuoco del novilunio."
    - "Nei Vangeli il monte incornicia l’ultima settimana di Gesù. Da Betfage mandò a prendere l’asinello e scese a cavallo nella città; alla discesa la folla lodò Dio, ed egli pianse su Gerusalemme. Di giorno insegnava nel tempio, «e la notte usciva e la passava sul monte detto degli Ulivi»; seduto là «dirimpetto al tempio», parlò della fine. Dopo l’ultima cena andò, «secondo il suo solito, al monte degli Ulivi», nel luogo detto Getsemani, dove pregò e fu arrestato. Luca colloca l’ascensione sul monte, «il quale è vicino a Gerusalemme, non distandone che un cammin di sabato». Giuseppe Flavio racconta che nel 70 d.C. la Decima Legione si accampò sul monte e che un profeta egiziano vi aveva radunato i suoi seguaci."
    - "Costantino e sua madre Elena costruirono la basilica dell’Eleona sopra la grotta dove si credeva che Gesù avesse insegnato, e alla fine del IV secolo la chiesa rotonda dell’Imbomon sorgeva sulla cima; Egeria descrive la processione della domenica delle Palme lungo il monte e le veglie notturne al Getsemani. La piccola Cappella dell’Ascensione, ricostruita dai Crociati, è una moschea dai tempi di Saladino. Oggi il monte, a Gerusalemme Est, ospita il villaggio di at-Tur, la chiesa russa di Maria Maddalena, la Chiesa di Tutte le Nazioni al Getsemani (1924), il Dominus Flevit (1955) e il convento del Pater Noster sul sito dell’Eleona."
  pl:
    - "Góra Oliwna to grzbiet na wschód od Jerozolimy, po drugiej stronie doliny Cedron od Góry Świątynnej, którą góruje o około 80 m; jej główny szczyt wznosi się ponad 800 m, a Góra Skopus kontynuuje grzbiet na północ. Nazwa pochodzi od dawnych gajów oliwnych. Na jej zachodnim zboczu leży żydowski cmentarz, używany do pochówków od starożytności i najbardziej czczony w judaizmie, a u jej stóp grobowce Cedronu i ogród Getsemani."
    - "Dawid tędy uciekał przed Absalomem: „szedł na górę oliwną wstępując i płacząc”, boso, z nakrytą głową. Salomon zbudował wyżyny „na górze przeciw Jeruzalemowi” dla Kemosza i Moloka, które Jozjasz splugawił trzy wieki później. Ezechiel ujrzał chwałę Pana opuszczającą miasto i stającą „na górze, która jest na wschód miasta”, a Zachariasz zapowiedział dzień Pański: „I staną nogi jego w on dzień na górze Oliwnej, która jest przeciwko Jeruzalemowi na wschód słońca, a góra Oliwna się na poły rozszczepi”. Miszna zapisuje, że na górze palono czerwoną jałówkę i zapalano tam pochodnię nowiu."
    - "W Ewangeliach góra otacza ostatni tydzień Jezusa. Z Betfage posłał po oślę i wjechał do miasta; na zejściu tłum chwalił Boga, a on płakał nad Jerozolimą. Za dnia nauczał w świątyni, „ale w nocy wychodząc, przebywał na górze, którą zowią oliwną”; siedząc tam „przeciwko kościołowi”, czyli naprzeciw Świątyni, mówił o końcu. Po ostatniej wieczerzy poszedł „według zwyczaju na górę Oliwną”, na miejsce zwane Getsemani, gdzie się modlił i został pojmany. Łukasz umieszcza wniebowstąpienie na górze, „która jest blisko Jeruzalemu, mając drogi przez jeden sabat”. Józef Flawiusz opowiada, jak w 70 r. n.e. Dziesiąta Legia obozowała na górze i jak egipski prorok zebrał tam swoich zwolenników."
    - "Konstantyn i jego matka Helena zbudowali bazylikę Eleona nad jaskinią, w której Jezus miał nauczać, a pod koniec IV w. na szczycie stał okrągły kościół Imbomon; Egeria opisuje procesję Niedzieli Palmowej w dół góry i nocne czuwania w Getsemani. Mała Kaplica Wniebowstąpienia, odbudowana przez krzyżowców, jest meczetem od czasów Saladyna. Dziś na górze, we Wschodniej Jerozolimie, leży wieś at-Tur, rosyjski kościół Marii Magdaleny, Bazylika Wszystkich Narodów w Getsemani (1924), Dominus Flevit (1955) i klasztor Pater Noster na miejscu Eleony."
  nl:
    - "De Olijfberg is de bergrug ten oosten van Jeruzalem, aan de overkant van het Kidrondal van de Tempelberg, die hij zo'n 80 m overziet; zijn hoofdtop rijst boven 800 m, en de Scopusberg zet de rug naar het noorden voort. Zijn naam komt van zijn oude olijfgaarden. Op zijn westelijke helling ligt de joodse begraafplaats, sinds de oudheid in gebruik en de meest vereerde in het jodendom, en aan zijn voet de Kidrongraven en de hof van Getsemane."
    - "David vluchtte langs deze weg voor Absalom: “David ging op door den opgang der olijven, opgaande en wenende”, blootsvoets, met zijn hoofd bedekt. Salomo bouwde offerhoogten “op den berg, die voor Jeruzalem is” voor Kemos en Molech, die Josia drie eeuwen later ontheiligde. Ezechiël zag de heerlijkheid van de HEER de stad verlaten en staan “op den berg, die tegen het oosten der stad is”, en Zacharia voorspelde de dag van de HEER: “En Zijn voeten zullen te dien dage staan op den Olijfberg, die voor Jeruzalem ligt, tegen het oosten; en de Olijfberg zal in tweeën gespleten worden”. De Misjna vermeldt dat de rode koe op de berg werd verbrand en het nieuwemaansbaken er werd ontstoken."
    - "In de evangeliën omlijst de berg de laatste week van Jezus. Vanuit Bethfage liet Hij het veulen halen en reed de stad in; bij de afdaling prees de menigte God, en Hij weende over Jeruzalem. Overdag onderwees Hij in de tempel, “maar des nachts ging Hij uit, en vernachtte op den berg, genaamd den Olijf berg”; daar gezeten “tegen den tempel over” sprak Hij over het einde. Na het laatste avondmaal ging Hij, “gelijk Hij gewoon was, naar den Olijfberg”, naar de plaats genaamd Getsemane, waar Hij bad en gevangen werd genomen. Lukas plaatst de hemelvaart op de berg, “liggende van daar een sabbatsreize” van Jeruzalem. Josephus vertelt hoe in 70 n.Chr. het Tiende Legioen op de berg kampeerde en hoe een Egyptische profeet er zijn volgelingen had verzameld."
    - "Constantijn en zijn moeder Helena bouwden de basiliek van Eleona boven de grot waar Jezus volgens de overlevering had onderwezen, en laat in de vierde eeuw stond de ronde kerk van de Imbomon op de top; Egeria beschrijft de Palmzondagprocessie van de berg af en de nachtwaken te Getsemane. De kleine Hemelvaartskapel, door de kruisvaarders herbouwd, is sinds Saladin een moskee. Tegenwoordig draagt de berg, in Oost-Jeruzalem, het dorp at-Tur, de Russische kerk van Maria Magdalena, de Kerk van alle Naties te Getsemane (1924), Dominus Flevit (1955) en het Pater Noster-klooster op de plaats van de Eleona."
  cs:
    - "Olivová hora je hřbet východně od Jeruzaléma, přes údolí Kidron od Chrámové hory, nad kterou se zvedá asi o 80 m; její hlavní vrchol vystupuje nad 800 m a hora Scopus pokračuje hřbetem na sever. Jméno má podle starých olivových hájů. Na jejím západním svahu leží židovský hřbitov, od starověku užívaný k pohřbům a nejuctívanější v judaismu, a u jejího úpatí kidronské hrobky a zahrada Getsemane."
    - "David tudy utíkal před Abšalomem: „šel vzhůru k vrchu hory Olivetské, vstupuje a pláče“, bos, s přikrytou hlavou. Šalomoun postavil výsosti „na hoře, kteráž jest naproti Jeruzalému“ pro Kemoše a Molocha, které Jošijáš poškvrnil o tři století později. Ezechiel viděl slávu Hospodinovu opustit město a stanout „na hoře, kteráž jest na východ městu“ a Zacharjáš předpověděl den Hospodinův: „I stanou nohy jeho v ten den na hoře Olivetské, kteráž jest naproti Jeruzalému od východu, a rozdvojí se hora Olivetská napoly“. Mišna zaznamenává, že na hoře byla spalována rudá jalovice a zapalován maják novoluní."
    - "V evangeliích hora rámuje poslední týden Ježíšův. Z Betfage poslal pro oslátko a sjel do města; při sestupu dav chválil Boha a on plakal nad Jeruzalémem. Ve dne učil v chrámě, „v noci vycházeje, přebýval na hoře, kteráž slove Olivetská“; sedě tam „proti chrámu“, mluvil o konci. Po poslední večeři „podle obyčeje svého, šel na horu Olivovou“, na místo zvané Getsemane, kde se modlil a byl zatčen. Lukáš klade nanebevstoupení na horu, „kteráž jest blízko Jeruzaléma, vzdálí cesty jednoho dne svátečního“. Josephus vypráví, jak se roku 70 n. l. na hoře utábořila Desátá legie a jak tam egyptský prorok shromáždil své stoupence."
    - "Konstantin a jeho matka Helena postavili baziliku Eleony nad jeskyní, kde se podle víry Ježíš učil, a koncem 4. století stál na vrcholu kruhový kostel Imbomon; Egerie popisuje procesí na Květnou neděli dolů z hory a noční vigilie v Getsemane. Malá kaple Nanebevstoupení, přestavěná křižáky, je od Saladina mešitou. Dnes hora ve východním Jeruzalémě nese vesnici at-Tur, ruský kostel Marie Magdalské, Kostel všech národů v Getsemane (1924), Dominus Flevit (1955) a klášter Pater noster na místě Eleony."
  sv:
    - "Olivberget är åsen öster om Jerusalem, på andra sidan Kidrondalen från Tempelberget, som den överblickar med omkring 80 m; dess huvudtopp reser sig över 800 m, och Skopusberget fortsätter åsen norrut. Namnet kommer från dess gamla olivlundar. På dess västra sluttning ligger den judiska begravningsplatsen, använd sedan antiken och den mest vördade i judendomen, och vid dess fot Kidrongravarna och Getsemane trädgård."
    - "David flydde från Absalom denna väg: han ”gick gråtande uppför Oljeberget med överhöljt huvud ock bara fötter”. Salomo byggde offerhöjder ”på berget öster om Jerusalem” åt Kemosh och Molok, vilka Josia orenade tre århundraden senare. Hesekiel såg HERRENS härlighet lämna staden och stanna ”på berget öster om staden”, och Sakarja förutsade Herrens dag: ”Och han skall den dagen stå med sina fötter på Oljeberget, gent emot Jerusalem, österut; och Oljeberget skall rämna mitt itu”. Mishna uppger att den röda kvigan brändes på berget och att nymånefyren tändes där."
    - "I evangelierna ramar berget in Jesu sista vecka. Från Betfage sände han efter fålen och red ned i staden; vid nedfarten prisade folket Gud, och han grät över Jerusalem. Han undervisade i templet om dagarna, och ”om aftnarna gick han ut till det berg som kallas Oljeberget och stannade där över natten”; sittande där ”mitt emot helgedomen” talade han om slutet. Efter den sista måltiden gick han ”till Oljeberget, såsom hans sed var”, till platsen som kallas Getsemane, där han bad och greps. Lukas förlägger himmelsfärden till berget, ”vilket ligger nära Jerusalem, icke längre därifrån, än man får färdas på en sabbat”. Josefus berättar hur tionde legionen år 70 slog läger på berget, och hur en egyptisk profet hade samlat sina anhängare där."
    - "Konstantin och hans mor Helena byggde Eleonabasilikan över grottan där Jesus ansågs ha undervisat, och sent på 300-talet stod den runda Imbomonkyrkan på toppen; Egeria beskriver palmsöndagsprocessionen ned för berget och nattvakorna i Getsemane. Det lilla Himmelsfärdskapellet, ombyggt av korsfararna, har varit en moské sedan Saladin. I dag bär berget, i Östra Jerusalem, byn at-Tur, Maria Magdalenas ryska kyrka, Alla nationers kyrka i Getsemane (1924), Dominus Flevit (1955) och Pater Noster-klostret på Eleonas plats."
  nb:
    - "Oljeberget er ryggen øst for Jerusalem, på den andre siden av Kedron-dalen fra Tempelhøyden, som den overskuer med omkring 80 m; dens hovedtopp stiger over 800 m, og Skopusfjellet fortsetter ryggen mot nord. Navnet kommer fra de gamle oljelundene. På dens vestlige skråning ligger den jødiske gravlunden, brukt til begravelser siden oldtiden og den mest ærede i jødedommen, og ved foten Kedron-gravene og Getsemane hage."
    - "David flyktet fra Absalom denne veien: «David gikk gråtende opefter Oljeberget med tilhyllet hode og barfotet». Salomo bygde offerhauger «på det fjell som ligger midt imot Jerusalem» for Kemosj og Molok, som Josjia vanhelliget tre århundrer senere. Esekiel så Herrens herlighet forlate byen og stå «på det berg som er østenfor staden», og Sakarja forutsa Herrens dag: «På den dag skal hans føtter stå på Oljeberget, som ligger midt imot Jerusalem i øst, og Oljeberget skal revne tvert over». Mishnah forteller at den røde kvigen ble brent på fjellet og at nymånebålet ble tent der."
    - "I evangeliene rammer fjellet Jesu siste uke. Fra Betfage sendte han bud etter føllet og red ned i byen; ved nedgangen priste folkemengden Gud, og han gråt over Jerusalem. Han underviste i tempelet om dagen, «men om nettene gikk han ut av byen og overnattet på det berg som kalles Oljeberget»; sittende der «rett imot templet» talte han om enden. Etter den siste måltid gikk han «efter sedvane til Oljeberget», til stedet som heter Getsemane, der han ba og ble arrestert. Lukas plasserer himmelfarten på fjellet, «som kalles Oljeberget og ligger nær ved Jerusalem, en sabbatsreise derfra». Josefus forteller hvordan Den tiende legion i 70 e.Kr. slo leir på fjellet, og hvordan en egyptisk profet hadde samlet sine tilhengere der."
    - "Konstantin og hans mor Helena bygde basilikaen Eleona over hulen der Jesus ble antatt å ha undervist, og sent på 300-tallet sto den runde Imbomon-kirken på toppen; Egeria beskriver palmesøndagsprosesjonen ned fjellet og nattevaktene i Getsemane. Det lille Himmelfartskapellet, gjenoppbygd av korsfarerne, har vært en moské siden Saladin. I dag bærer fjellet, i Øst-Jerusalem, landsbyen at-Tur, den russiske kirken for Maria Magdalena, Alle nasjoners kirke i Getsemane (1924), Dominus Flevit (1955) og Pater Noster-klosteret på stedet for Eleona."
  tl:
    - "Ang Bundok ng mga Olibo ay ang tagaytay sa silangan ng Jerusalem, sa kabila ng libis ng Cedron mula sa Bundok ng Templo, na tinatanaw nito mula sa mga 80 m na taas; tumataas ang pangunahing tuktok nito sa mahigit 800 m, at ipinagpapatuloy ng Bundok Scopus ang tagaytay sa hilaga. Ang pangalan ay mula sa dating mga kakahuyan ng olibo. Sa kanlurang dalisdis nito ay ang libingang Judio, ginagamit sa paglilibing mula pa noong unang panahon at pinakaiginagalang sa Judaismo, at sa paanan nito ang mga libingan ng Cedron at ang halamanan ng Getsemani."
    - "Dito tumakas si David kay Absalom: “umahon si David sa ahunan sa bundok ng mga Olibo, at umiiyak habang siya'y umaahon”, walang sapin sa paa, takip ang ulo. Nagtayo si Salomon ng mga mataas na dako “sa bundok na nasa tapat ng Jerusalem” para kay Chemos at Moloch, na dinumihan ni Josias makalipas ang tatlong siglo. Nakita ni Ezekiel na lumisan ang kaluwalhatian ng Panginoon sa lungsod at lumagay “sa ibabaw ng bundok na nasa dakong silanganan ng bayan”, at inihula ni Zacharias ang araw ng Panginoon: “At ang kaniyang mga paa ay magsisitayo sa araw na yaon sa bundok ng mga Olivo, na nasa tapat ng Jerusalem sa dakong silanganan; at ang bundok ng mga Olivo ay mahahati sa gitna niya”. Itinatala ng Mishnah na sinunog sa bundok ang pulang baka at sinindihan doon ang ilaw ng bagong buwan."
    - "Sa mga Ebanghelyo, binabalangkas ng bundok ang huling linggo ni Jesus. Mula sa Betfage ay ipinasundo niya ang bisiro at sumakay pababa sa lungsod; sa pagbaba, pinuri ng karamihan ang Diyos, at iniyakan niya ang Jerusalem. Nagturo siya sa templo sa araw, at “lumalabas gabi-gabi at tumatahan sa bundok na tinatawag na Olivo”; habang nakaupo roon “sa tapat ng templo”, nagsalita siya tungkol sa wakas. Pagkatapos ng huling hapunan ay pumaroon siya, “ayon sa kaniyang kaugalian, sa bundok ng mga Olivo”, sa lugar na tinatawag na Getsemani, kung saan siya nanalangin at dinakip. Inilalagay ni Lucas ang pag-akyat sa langit sa bundok, “na isang araw ng sabbath lakarin” mula sa Jerusalem. Isinasalaysay ni Josefo kung paano noong 70 AD nagkampo sa bundok ang Ikasampung Legyon, at kung paano nagtipon doon ng kaniyang mga tagasunod ang isang propetang Egipcio."
    - "Itinayo nina Constantino at ng kaniyang inang si Elena ang basilika ng Eleona sa ibabaw ng yungib kung saan pinaniniwalaang nagturo si Jesus, at sa huling bahagi ng ika-4 na siglo ay nakatayo sa tuktok ang bilog na simbahan ng Imbomon; inilalarawan ni Egeria ang prusisyon ng Linggo ng Palaspas pababa sa bundok at ang mga pagpupuyat sa gabi sa Getsemani. Ang maliit na Kapilya ng Pag-akyat sa Langit, na itinayong muli ng mga Krusado, ay moske mula kay Saladin. Ngayon ang bundok, sa Silangang Jerusalem, ay may nayon ng at-Tur, ang simbahang Ruso ni Maria Magdalena, ang Simbahan ng Lahat ng Bansa sa Getsemani (1924), Dominus Flevit (1955) at ang kumbento ng Pater Noster sa pook ng Eleona."
  da:
    - "Oliebjerget er højderyggen øst for Jerusalem, på tværs af Kedron-dalen fra Tempelbjerget, som det overskuer med omkring 80 m; dets hovedtop hæver sig over 800 m, og Scopus-bjerget fortsætter ryggen mod nord. Dets navn kommer af dets gamle oliventræslunde. På dets vestlige skråning ligger den jødiske kirkegård, brugt til begravelse siden oldtiden og den mest ærede i jødedommen, og ved dets fod Kedron-gravene og haven Getsemane."
    - "David flygtede fra Absalon denne vej: han »gik op ad Opgangen til Oliebjerget. Som han gik op, saa græd han«, barfodet, med tilhyllet hoved. Salomo byggede offerhøje »paa Bjerget, som ligger lige for Jerusalem« for Kamos og Molek, som Josias vanhelligede tre århundreder senere. Ezekiel så Herrens herlighed forlade byen og blive stående »paa Bjerget, som er Østen for Staden«, og Zakarias forudsagde Herrens dag: »hans Fødder skulle paa den Dag staa paa Oliebjerget, som er lige over for Jerusalem imod Østen, og Oliebjerget skal revne fra dets Midte af«. Mishnaen optegner, at den røde kvie blev brændt på bjerget og nymånefyret tændt dér."
    - "I evangelierne rammer bjerget Jesu sidste uge ind. Fra Betfage sendte han bud efter føllet og red ned i byen; ved nedstigningen priste mængden Gud, og han græd over Jerusalem. Han underviste i templet om dagen, men »om Nætterne gik han ud og overnattede paa det Bjerg, som kaldes Oliebjerget«; siddende dér »lige over for Helligdommen« talte han om enden. Efter den sidste nadver gik han »efter sin Sædvane til Oliebjerget«, til stedet kaldet Getsemane, hvor han bad og blev arresteret. Lukas placerer himmelfarten på bjerget: »fra det Bjerg, som kaldes Oliebjerget og er nær ved Jerusalem, en Sabbatsvej derfra«. Josefus fortæller, hvordan den tiende legion i 70 e.Kr. lejrede sig på bjerget, og hvordan en egyptisk profet havde samlet sine tilhængere dér."
    - "Konstantin og hans mor Helena byggede Eleona-basilikaen over hulen, hvor Jesus menes at have undervist, og sent i 300-tallet stod den runde Imbomon-kirke på toppen; Egeria beskriver palmesøndagsprocessionen ned ad bjerget og nattevagterne ved Getsemane. Det lille Himmelfartskapel, genopbygget af korsfarerne, har været en moské siden Saladin. I dag bærer bjerget, i Østjerusalem, landsbyen at-Tur, den russiske kirke for Maria Magdalene, Alle Nationers Kirke ved Getsemane (1924), Dominus Flevit (1955) og Pater Noster-klosteret på Eleonas sted."
  sr:
    - "Маслинска гора је гребен источно од Јерусалима, преко долине Кедрона од Храмовне горе, коју надвисује за око 80 м; њен главни врх диже се изнад 800 м, а Скопус наставља гребен на север. Име потиче од њених старих маслињака. На њеној западној падини лежи јеврејско гробље, у употреби од старине и најпоштованије у јудаизму, а у њеном подножју кедронске гробнице и Гетсимански врт."
    - "Давид је овуда бежао од Авесалома: „иђаше уз гору маслинску, и идући плакаше“, бос и покривене главе. Соломун је подигао висине „на гори према Јерусалиму“ за Хамоса и Молоха, које је Јосија оскврнио три столећа касније. Језекиљ је видео славу Господњу како напушта град и стаје „на гори која је с истока граду“, а Захарија је прорекао дан Господњи: „И ноге ће Његове стати у тај дан на гори маслинској која је према Јерусалиму с истока, и гора ће се маслинска распасти по среди на исток и на запад“. Мишна бележи да је црвена јуница спаљена на гори и да се ту палила ватра за нови месец."
    - "У јеванђељима гора уоквирује последњу седмицу Исуса. Из Витфаге је послао по магаре и јашући сишао у град; на силаску је мноштво хвалило Бога, а он је заплакао над Јерусалимом. Дању је учио у храму, а „ноћу излажаше и ноћиваше на гори која се зове маслинска“; седећи тамо „према цркви“, говорио је о крају. После Тајне вечере отишао је „по обичају на гору маслинску“, на место звано Гетсиманија, где се молио и био ухапшен. Лука смешта вазнесење на гору, „која је близу Јерусалима један суботни дан хода“. Јосиф Флавије приповеда како се 70. н. е. Десета легија улогорила на гори, и како је један египатски пророк тамо окупио своје следбенике."
    - "Константин и његова мајка Јелена саградили су базилику Елеону над пећином у којој се веровало да је Исус поучавао, а касније у IV веку на врху је стајала кружна црква Имбомона; Егерија описује цветну поворку низ гору и ноћна бденија у Гетсиманији. Мала капела Вазнесења, обновљена од крсташа, џамија је од Саладина. Данас гора, у Источном Јерусалиму, носи село ет-Тур, руску цркву Марије Магдалине, Цркву свих народа у Гетсиманији (1924), Доминус Флевит (1955) и манастир Патер Ностер на месту Елеоне."
  hu:
    - "Az Olajfák hegye a Jeruzsálemtől keletre húzódó gerinc, a Kidron-völgy túloldalán a Templomhegyről, amely fölé mintegy 80 m-rel emelkedik; fő csúcsa 800 m fölé ér, és a Szkopusz-hegy folytatja a gerincet északra. Nevét régi olajfaligeteiről kapta. Nyugati lejtőjén fekszik az ókor óta használt zsidó temető, a judaizmus legtiszteltebbike, lábánál a Kidron-sírok és a Gecsemáné-kert."
    - "Dávid erre menekült Absolon elől: „felméne az olajfáknak hegyén, mentében sírva, fejét beborítva, saru nélkül ment”. Salamon magaslatokat épített „a hegyen, a mely Jeruzsálem átellenében van” Kemósnak és Moloknak, amelyeket Jósiás három évszázaddal később megfertőztetett. Ezékiel látta az Úr dicsőségét elhagyni a várost és megállni „a hegyre, mely a várostól keletre van”, Zakariás pedig megjövendölte az Úr napját: „És azon a napon az Olajfák hegyére veti lábait, a mely szemben van Jeruzsálemmel napkelet felől, és az Olajfák hegye közepén ketté válik”. A Misna följegyzi, hogy a vörös üszőt a hegyen égették el, és az újholdi jelzőtüzet ott gyújtották."
    - "Az evangéliumokban a hegy keretezi Jézus utolsó hetét. Betfagéból küldött a szamárcsikóért, és lovagolt le a városba; a lejtőn a tömeg dicsérte Istent, ő pedig sírt Jeruzsálem fölött. Nappal a templomban tanított, „éjszakára pedig kimenvén, a hegyen vala, mely Olajfák hegyének neveztetik”; ott ülve „a templom átellenében” beszélt a végről. Az utolsó vacsora után „méne az ő szokása szerint az Olajfák hegyére”, a Gecsemáné nevű helyre, ahol imádkozott, és elfogták. Lukács a mennybemenetelt a hegyre helyezi, „mely Jeruzsálem mellett van, egy szombatnapi járóföldre”. Josephus elmondja, hogyan táborozott Kr. u. 70-ben a X. légió a hegyen, és hogyan gyűjtötte ott követőit egy egyiptomi próféta."
    - "Konstantin és anyja, Heléna felépítette az Eleona-bazilikát a barlang fölött, ahol Jézus a hit szerint tanított, a 4. század végén pedig a csúcson állt az Imbomon kerek temploma; Egeria leírja a virágvasárnapi körmenetet a hegyről lefelé és az éjszakai virrasztásokat Gecsemánéban. A kis Mennybemenetel-kápolna, amelyet a keresztesek újjáépítettek, Szaladin óta mecset. Ma a hegyen, Kelet-Jeruzsálemben, at-Tur falu áll, Mária Magdolna orosz temploma, a gecsemánéi Minden nemzetek temploma (1924), a Dominus Flevit (1955) és az Eleona helyén álló Pater Noster-kolostor."
  fi:
    - "Öljymäki on Jerusalemin itäpuolinen harjanne Kidronin laakson toisella puolella Temppelivuoresta, jonka yläpuolella se kohoaa noin 80 m; sen päähuippu nousee yli 800 metrin, ja Skopusvuori jatkaa harjannetta pohjoiseen. Nimi tulee sen vanhoista oliivilehdoista. Sen länsirinteellä on juutalainen hautausmaa, jota on käytetty antiikista asti ja joka on juutalaisuuden kunnioitetuin, ja sen juurella Kidronin haudat ja Getsemanen puutarha."
    - "Daavid pakeni Absalomia tätä tietä: hän ”kulki itkien Öljymäkeä ylös, pää peitettynä ja paljain jaloin”. Salomo rakensi uhrikukkulat Kemokselle ja Molokille ”vuorelle, joka on itään päin Jerusalemista”, jotka Josia saastutti kolme vuosisataa myöhemmin. Hesekiel näki Herran kirkkauden lähtevän kaupungista ja asettuvan ”vuorelle, joka on itään päin kaupungista”, ja Sakarja ennusti Herran päivän: ”Hänen jalkansa seisovat sinä päivänä Öljymäellä, joka on Jerusalemin edustalla itää kohti. Ja Öljymäki halkeaa kahtia”. Mishna kertoo, että punainen mullikka poltettiin vuorella ja uudenkuun majakka sytytettiin siellä."
    - "Evankeliumeissa vuori kehystää Jeesuksen viimeistä viikkoa. Betfagesta hän lähetti hakemaan varsan ja ratsasti alas kaupunkiin; laskeutuessa kansanjoukko ylisti Jumalaa, ja hän itki Jerusalemia. Hän opetti pyhäkössä päivisin, ”mutta öiksi hän lähti pois ja vietti ne vuorella, jota kutsutaan Öljymäeksi”; istuessaan siellä ”vastapäätä pyhäkköä” hän puhui lopusta. Viimeisen aterian jälkeen hän ”lähti tapansa mukaan Öljymäelle”, paikkaan nimeltä Getsemane, jossa hän rukoili ja otettiin kiinni. Luukas sijoittaa taivaaseenastumisen vuorelle, ”joka on lähellä Jerusalemia, sapatinmatkan päässä”. Josephus kertoo, kuinka vuonna 70 jaa. kymmenes legioona leiriytyi vuorelle ja kuinka egyptiläinen profeetta oli koonnut seuraajansa sinne."
    - "Konstantinus ja hänen äitinsä Helena rakensivat Eleonan basilikan luolan päälle, jossa Jeesuksen uskottiin opettaneen, ja 300-luvun lopulla huipulla seisoi Imbomonin pyöreä kirkko; Egeria kuvaa palmusunnuntain kulkueen vuorelta alas ja yövalvomiset Getsemanessa. Pieni Taivaaseenastumisen kappeli, ristiretkeläisten uudelleen rakentama, on ollut moskeija Saladinin ajoista. Nykyään vuorella, Itä-Jerusalemissa, ovat at-Turin kylä, Maria Magdaleenan venäläinen kirkko, Kaikkien kansojen kirkko Getsemanessa (1924), Dominus Flevit (1955) ja Pater Noster -luostari Eleonan paikalla."
  vi:
    - "Núi Ô-li-ve là sống đồi phía đông Giê-ru-sa-lem, bên kia thung lũng Xết-rôn so với Núi Đền Thờ, mà nó nhìn xuống khoảng 80 m; đỉnh chính cao hơn 800 m, và núi Scopus nối tiếp sống đồi về phía bắc. Tên đến từ các vườn ô-liu xưa. Trên sườn tây là nghĩa trang Do Thái, dùng để chôn từ thời cổ và được tôn kính nhất trong Do Thái giáo, và ở chân là các ngôi mộ Xết-rôn và vườn Ghết-sê-ma-nê."
    - "Đa-vít chạy trốn Áp-sa-lôm qua lối này: “Đa-vít trèo lên núi Ô-li-ve; người vừa leo lên vừa khóc”, chân không, đầu trùm lại. Sa-lô-môn xây các nơi cao “tại trên núi đối ngang Giê-ru-sa-lem” cho Chemosh và Molech, mà Giô-si-a làm ô uế ba thế kỷ sau. Ê-xê-chi-ên thấy vinh quang Đức Giê-hô-va rời thành và “đứng trên núi phía đông thành”, và Xa-cha-ri báo trước ngày của Đức Giê-hô-va: “chơn Ngài sẽ đứng trên núi ô-li-ve, là núi đối ngang Giê-ru-sa-lem về phía đông; và núi ô-li-ve sẽ bị xé ra chính giữa”. Mishnah ghi rằng con bò cái tơ đỏ được đốt trên núi và ngọn lửa hiệu trăng non được thắp ở đó."
    - "Trong các sách Phúc Âm, ngọn núi là khung cảnh của tuần cuối cùng của Giê-su. Từ Bê-pha-giê, Ngài sai đi lấy lừa con và cưỡi xuống thành; ở dốc xuống, đám đông ngợi khen Đức Chúa Trời, và Ngài khóc về Giê-ru-sa-lem. Ngài dạy trong đền thờ ban ngày, “còn đến chiều, Ngài đi lên núi, gọi là núi Ô-li-ve, mà ở đêm tại đó”; ngồi ở đó “đối ngang đền thờ”, Ngài nói về tận thế. Sau bữa ăn cuối, Ngài “lên núi Ô-li-ve theo như thói quen”, đến chỗ gọi là Ghết-sê-ma-nê, nơi Ngài cầu nguyện và bị bắt. Lu-ca đặt sự thăng thiên trên núi, “núi ấy cách thành Giê-ru-sa-lem một quãng đường ước đi một ngày Sa-bát”. Josephus kể năm 70 Quân đoàn X đóng trại trên núi, và một nhà tiên tri Ai Cập đã tập hợp các môn đồ ở đó."
    - "Constantine và mẹ ông Helena xây thánh đường Eleona trên hang nơi Giê-su được tin là đã giảng dạy, và cuối thế kỷ 4 nhà thờ tròn Imbomon đứng trên đỉnh; Egeria mô tả đám rước Chúa nhật Lễ Lá xuống núi và các buổi canh thức đêm ở Ghết-sê-ma-nê. Nhà nguyện Thăng thiên nhỏ, do quân Thập tự chinh xây lại, là đền Hồi giáo từ thời Saladin. Ngày nay ngọn núi, ở Đông Giê-ru-sa-lem, có làng at-Tur, nhà thờ Nga Thánh Ma-ri Ma-đơ-len, Nhà thờ Vạn Quốc ở Ghết-sê-ma-nê (1924), Dominus Flevit (1955) và tu viện Pater Noster trên nền Eleona."
  ro:
    - "Muntele Măslinilor este creasta de la est de Ierusalim, peste valea Chedronului de Muntele Templului, pe care îl domină cu vreo 80 m; vârful său principal se ridică peste 800 m, iar Muntele Scopus continuă creasta spre nord. Numele vine de la vechile lui livezi de măslini. Pe versantul lui vestic se află cimitirul evreiesc, folosit pentru înmormântări din Antichitate și cel mai venerat din iudaism, iar la poalele lui mormintele Chedronului și grădina Ghetsimani."
    - "David a fugit de Absalom pe aici: „se suià pre coasta muntelui maslinilor, se suià plângând”, desculț, cu capul acoperit. Solomon a zidit capiști pentru Chemoș și Moloh pe „muntele cel din fața Ierusalimului”, pe care Iosia le-a spurcat trei secole mai târziu. Ezechiel a văzut slava Domnului părăsind cetatea și oprindu-se pe muntele din partea de est, iar Zaharia a proorocit ziua Domnului: „Și vor stà picioarele lui în ziua aceea pre muntele Maslinilor cel din preajma Ierusalimului despre răsărit, și se va desface muntele Maslinilor”. Mișna consemnează că junica roșie era arsă pe munte și că acolo se aprindea focul de semnalizare al lunii noi."
    - "În Evanghelii, muntele încadrează ultima săptămână a lui Isus. Din Betfage a trimis după mânz și a coborât călare în oraș; la coborâre mulțimea l-a lăudat pe Dumnezeu, iar el a plâns peste Ierusalim. Ziua învăța în templu, „iar noaptea ieșind petreceà în muntele ce se chiamă al Maslinilor”; șezând acolo „în preajma bisericei”, a vorbit despre sfârșit. După cina cea de taină, a mers „după obiceiu în muntele Maslinilor”, în locul numit Ghetsimani, unde s-a rugat și a fost arestat. Luca așază înălțarea pe munte, „care este aproape de Ierusalim, calea sâmbetei având”. Iosif Flaviu povestește cum în 70 d.Hr. Legiunea a X-a a tăbărât pe munte și cum un proroc egiptean își adunase acolo urmașii."
    - "Constantin și mama sa Elena au zidit bazilica Eleona deasupra peșterii unde se credea că Isus a învățat, iar la sfârșitul secolului al IV-lea biserica rotundă Imbomon stătea pe culme; Egeria descrie procesiunea Floriilor pe coborâre și privegherile de noapte de la Ghetsimani. Mica Capelă a Înălțării, reconstruită de cruciați, este moschee de pe vremea lui Saladin. Astăzi muntele, în Ierusalimul de Est, poartă satul at-Tur, biserica rusă a Mariei Magdalena, Biserica Tuturor Neamurilor de la Ghetsimani (1924), Dominus Flevit (1955) și mănăstirea Pater Noster pe locul Eleonei."
  bg:
    - "Елеонският хълм е ридът на изток от Йерусалим, отвъд долината Кедрон срещу Храмовия хълм, над който се издига с около 80 м; главният му връх е над 800 м, а планината Скопус продължава рида на север. Името му идва от старите му маслинови горички. На западния му склон се намира юдейското гробище, използвано за погребения от древността и най-почитаното в юдаизма, а в подножието му — гробниците в Кедрон и Гетсиманската градина."
    - "Давид бягаше от Авесалом по този път: той „възхождаше през възхода на маслинената гора, възхождаше и плачеше“, бос и с покрита глава. Соломон съгради високи места „в гората която е срещу Ерусалим“ за Хамос и Молох, които Йосия оскверни три века по-късно. Йезекиил видя славата Господня да напуска града и да застава „на гората която е към Изток на града“, а Захария предрече деня Господен: „нозете му ще застанат в онзи ден На Елеонската гора, която е среща Ерусалим към изток: И Елеонската гора ще се разцепи“. Мишна отбелязва, че червената юница се изгаряла на хълма и там се палел сигналният огън за новолунието."
    - "В Евангелията хълмът обрамчва последната седмица на Исус. От Витфагия Той изпрати за осличето и слезе на него в града; при спускането народът хвалеше Бога, а Той плака за Йерусалим. Денем поучаваше в храма, „а ноще излезваше та нощуваше на гората нарицаема Елеонска“; седнал там, „срещу храма“, Той говори за края. След последната вечеря отиде „по обичай на гората Елеонска“, на мястото, наречено Гетсимания, където се моли и беше задържан. Лука поставя възнесението на хълма, който „е близу до Ерусалим един съботен ден път“. Йосиф Флавий разказва как през 70 г. н.е. Десети легион се разположил на хълма и как един египетски пророк бил събрал последователите си там."
    - "Константин и майка му Елена построяват базиликата Елеона над пещерата, където според вярването Исус поучавал, а в края на IV в. на върха стои кръглата църква Имбомон; Егерия описва шествието на Цветница надолу по хълма и нощните бдения в Гетсимания. Малкият параклис на Възнесението, възстановен от кръстоносците, е джамия от времето на Саладин. Днес хълмът, в Източен Йерусалим, носи село ат-Тур, руската църква „Света Мария Магдалина“, църквата на Всички народи в Гетсимания (1924), Dominus Flevit (1955) и манастира „Отче наш“ на мястото на Елеона."
