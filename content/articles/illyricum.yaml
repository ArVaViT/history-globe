body:
  en:
    - "Illyricum was the Roman name for the lands of the Illyrians along the eastern shore of the Adriatic and inland to the Sava and the Danube, in today's western Balkans. In 59 BC the Vatinian law gave Julius Caesar Cisalpine Gaul “with Illyricum added”. Under Augustus it was extended to the Danube; it was shaken by the great revolt of AD 6–9, after which it was divided into Upper Illyricum on the coast, governed from Salona near modern Split, and Lower Illyricum to the north. These became the provinces of Dalmatia and Pannonia; P. Kovács dates a separate Pannonia to Nero's reign, Marjeta Šašel Kos to Vespasian's."
    - "Writing to the Romans, Paul sums up his work: “so that from Jerusalem, and round about unto Illyricum, I have fully preached the gospel of Christ.” Acts never names Illyricum. The Greek word for “unto” can include the place or stop at it: Paul may have gone into Illyricum itself, perhaps as far as Dyrrhachium on the Adriatic, or preached through Macedonia up to the Illyrian frontier. M. N. Tod, in the International Standard Bible Encyclopedia, prefers the second, since Acts records no journey beyond Macedonia, and places it in the tour of Acts 20, when Paul “had gone over those parts” before he “came into Greece”, which W. M. Ramsay set in the summer and autumn of AD 56. Later Titus went “unto Dalmatia”, the coastal part of Illyricum."
  ru:
    - "Иллирик — римское название земель иллирийцев вдоль восточного берега Адриатики и вглубь материка до Савы и Дуная, на нынешних западных Балканах. В 59 г. до н. э. Ватиниев закон дал Юлию Цезарю Цизальпинскую Галлию «с присоединением Иллирика». При Августе её границы продвинули до Дуная; её потрясло великое восстание 6–9 гг. н. э., после которого её разделили на Верхний Иллирик на побережье, которым управляли из Салоны близ нынешнего Сплита, и Нижний Иллирик к северу. Из них выросли провинции Далмация и Паннония; П. Ковач относит отдельную Паннонию ко времени Нерона, Марьета Шашель Кос — ко времени Веспасиана."
    - "В Послании к Римлянам Павел подводит итог своему труду: «благовествование Христово распространено мною от Иерусалима и окрестности до Иллирика». В Деяниях Иллирик не назван. Греческое слово «до» может включать место или останавливаться на нём: Павел мог зайти в сам Иллирик, возможно до Диррахия на Адриатике, или проповедовать по Македонии до иллирийской границы. М. Н. Тод в Международной стандартной библейской энциклопедии предпочитает второе, поскольку Деяния не упоминают пути за пределы Македонии, и относит эту проповедь к путешествию из 20-й главы Деяний, когда Павел, «пройдя… те места», пришёл «в Елладу»; У. М. Рамзай датировал это путешествие летом и осенью 56 г. н. э. Позже Тит пошёл «в Далматию», приморскую часть Иллирика."
  uk:
    - "Іллірик — римська назва земель іллірійців уздовж східного берега Адріатики й углиб до Сави та Дунаю, у нинішніх західних Балканах. 59 р. до н. е. закон Ватинія дав Юлію Цезарю Цизальпійську Галлію «з додаванням Іллірика». За Августа його розширили до Дунаю; його сколихнуло велике повстання 6–9 рр. н. е., після якого його поділили на Верхній Іллірик на узбережжі, яким керували із Салони поблизу сучасного Спліта, і Нижній Іллірик на півночі. З них постали провінції Далмація та Паннонія; П. Ковач датує окрему Паннонію часами Нерона, Марієта Шашель-Кос — часами Веспасіана."
    - "Пишучи до римлян, Павло підсумовує свою працю: «так що я від Єрусалиму і кругом аж до Ілирика сповнив благовістє Христове». Діяння ніколи не називають Іллірика. Грецьке слово, що відповідає українському «аж до», може включати саме місце або зупинятися перед ним: Павло міг дійти до самого Іллірика, можливо, аж до Діррахія на Адріатиці, або проповідувати по Македонії до іллірійського кордону. М. Н. Тод в International Standard Bible Encyclopedia віддає перевагу другому, бо Діяння не згадують подорожі за межі Македонії, і відносить це до поїздки з Діянь 20, коли Павло, за словами Діянь, «пройшовши ж ті сторони», «прийшов у Грецію», що В. М. Ремзі відніс до літа й осені 56 р. н. е. Пізніше, як сказано в Другому посланні до Тимофія, «Тит в Далматию», у прибережну частину Іллірика."
  es:
    - "Ilírico era el nombre romano de las tierras de los ilirios a lo largo de la orilla oriental del Adriático y tierra adentro hasta el Sava y el Danubio, en los actuales Balcanes occidentales. En 59 a. C. la ley Vatinia dio a Julio César la Galia Cisalpina «con el Ilírico añadido». Bajo Augusto se extendió hasta el Danubio; la gran rebelión de 6–9 d. C. lo sacudió, y después fue dividido en Alto Ilírico, en la costa, gobernado desde Salona, cerca de la actual Split, y Bajo Ilírico, al norte. Estos se convirtieron en las provincias de Dalmacia y Panonia; P. Kovács fecha una Panonia separada en el reinado de Nerón, y Marjeta Šašel Kos en el de Vespasiano."
    - "Escribiendo a los romanos, Pablo resume su obra: «de manera que desde Jerusalem, y por los alrededores hasta Ilírico, he llenado todo del evangelio de Cristo». Los Hechos nunca nombran Ilírico. La palabra griega que significa «hasta» puede incluir el lugar o detenerse en él: Pablo pudo haber entrado en el propio Ilírico, quizá hasta Dirraquio, en el Adriático, o predicar por Macedonia hasta la frontera ilírica. M. N. Tod, en la International Standard Bible Encyclopedia, prefiere lo segundo, pues los Hechos no registran ningún viaje más allá de Macedonia, y lo sitúa en el recorrido de Hechos 20, cuando Pablo, «andado que hubo aquellas partes», «vino á Grecia», lo que W. M. Ramsay fechó en el verano y el otoño de 56 d. C. Más tarde Tito fue «á Dalmacia», la parte costera de Ilírico."
  de:
    - "Illyrien war der römische Name für die Länder der Illyrer entlang der Ostküste der Adria und landeinwärts bis zur Save und zur Donau, im heutigen westlichen Balkan. Im Jahr 59 v. Chr. gab das Vatinische Gesetz Julius Caesar das Diesseitige Gallien „mit Illyrien als Zugabe“. Unter Augustus wurde es bis zur Donau erweitert; es wurde vom großen Aufstand der Jahre 6–9 n. Chr. erschüttert, danach in Ober-Illyrien an der Küste, von Salona nahe dem heutigen Split aus regiert, und Unter-Illyrien im Norden geteilt. Daraus wurden die Provinzen Dalmatien und Pannonien; P. Kovács datiert ein eigenes Pannonien in die Regierungszeit Neros, Marjeta Šašel Kos in die Vespasians."
    - "Im Brief an die Römer fasst Paulus sein Werk zusammen: „also daß ich von Jerusalem an und umher bis Illyrien alles mit dem Evangelium Christi erfüllt habe“. Die Apostelgeschichte nennt Illyrien nie. Das griechische Wort für „bis“ kann den Ort einschließen oder vor ihm enden: Paulus kann in Illyrien selbst gewesen sein, vielleicht bis Dyrrhachion an der Adria, oder er hat durch Mazedonien bis zur illyrischen Grenze gepredigt. M. N. Tod bevorzugt in der International Standard Bible Encyclopedia das Zweite, da die Apostelgeschichte keine Reise über Mazedonien hinaus verzeichnet, und ordnet es der Reise von Apostelgeschichte 20 zu, als Paulus „diese Länder durchzogen“ hatte, bevor er „nach Griechenland“ kam, was W. M. Ramsay in Sommer und Herbst des Jahres 56 n. Chr. ansetzte. Später ging Titus „nach Dalmatien“, in den Küstenteil Illyriens."
  fr:
    - "L’Illyrie était le nom romain des terres des Illyriens le long de la rive orientale de l’Adriatique et à l’intérieur jusqu’à la Save et au Danube, dans l’actuel ouest des Balkans. En 59 av. J.-C., la loi Vatinia donna à Jules César la Gaule cisalpine « avec l’Illyrie en sus ». Sous Auguste, il fut étendu jusqu’au Danube ; il fut ébranlé par la grande révolte de 6–9 apr. J.-C., après laquelle il fut divisé en Haute-Illyrie, sur la côte, gouvernée depuis Salone, près de l’actuelle Split, et Basse-Illyrie, au nord. Elles devinrent les provinces de Dalmatie et de Pannonie ; P. Kovács date une Pannonie distincte du règne de Néron, Marjeta Šašel Kos de celui de Vespasien."
    - "Écrivant aux Romains, Paul résume son œuvre : « depuis Jérusalem et les pays voisins jusqu’en Illyrie, j’ai abondamment répandu l’Évangile de Christ. » Les Actes ne nomment jamais l’Illyrie. Le mot grec traduit par « jusqu’en » peut inclure le lieu ou s’arrêter à lui : Paul a pu entrer en Illyrie même, peut-être jusqu’à Dyrrachium sur l’Adriatique, ou prêcher à travers la Macédoine jusqu’à la frontière illyrienne. M. N. Tod, dans l’International Standard Bible Encyclopedia, préfère la seconde hypothèse, puisque les Actes ne notent aucun voyage au-delà de la Macédoine, et la place dans la tournée d’Actes 20, où Paul « parcourut cette contrée » avant de se rendre en Grèce, que W. M. Ramsay situait à l’été et à l’automne de l’an 56 apr. J.-C. Plus tard, Tite alla « en Dalmatie », la partie côtière de l’Illyrie."
  pt:
    - "O Ilírico era o nome romano das terras dos ilírios ao longo da costa oriental do Adriático e para o interior até o Sava e o Danúbio, nos atuais Bálcãs ocidentais. Em 59 a.C. a lei Vatínia deu a Júlio César a Gália Cisalpina “com o Ilírico acrescentado”. Sob Augusto foi estendido até o Danúbio; foi abalado pela grande revolta de 6–9 d.C., depois da qual foi dividido em Alto Ilírico, na costa, governado de Salona, perto da atual Split, e Baixo Ilírico, ao norte. Estes tornaram-se as províncias da Dalmácia e da Panônia; P. Kovács data uma Panônia separada do reinado de Nero, Marjeta Šašel Kos do de Vespasiano."
    - "Escrevendo aos romanos, Paulo resume sua obra: “desde Jerusalém e as regiões vizinhas até o Ilírico, preguei plenamente o Evangelho de Cristo”. Atos nunca nomeia o Ilírico. A palavra grega para “até” pode incluir o lugar ou parar nele: Paulo pode ter entrado no próprio Ilírico, talvez até Dirráquio, no Adriático, ou pregado pela Macedônia até a fronteira ilíria. M. N. Tod, na International Standard Bible Encyclopedia, prefere a segunda, já que Atos não registra nenhuma viagem além da Macedônia, e a situa no percurso de Atos 20, quando Paulo, depois de “passar por aquelas regiões”, “chegou à Grécia”, o que W. M. Ramsay situou no verão e no outono de 56 d.C. Mais tarde Tito foi “para a Dalmácia”, a parte costeira do Ilírico."
  it:
    - "L’Illirico era il nome romano delle terre degli Illiri lungo la sponda orientale dell’Adriatico e all’interno fino alla Sava e al Danubio, negli odierni Balcani occidentali. Nel 59 a.C. la legge Vatinia diede a Giulio Cesare la Gallia Cisalpina «con l’aggiunta dell’Illirico». Sotto Augusto fu esteso fino al Danubio; fu scosso dalla grande rivolta del 6–9 d.C., dopo la quale fu diviso in Illirico superiore, sulla costa, governato da Salona presso l’odierna Spalato, e Illirico inferiore, a nord. Essi divennero le province di Dalmazia e di Pannonia; P. Kovács data una Pannonia separata al regno di Nerone, Marjeta Šašel Kos a quello di Vespasiano."
    - "Scrivendo ai Romani, Paolo riassume la sua opera: «da Gerusalemme e dai luoghi intorno fino all’Illiria, ho predicato dovunque l’Evangelo di Cristo». Gli Atti non nominano mai l’Illirico. La parola greca per «fino a» può includere il luogo o fermarsi ad esso: Paolo può essere andato nell’Illirico stesso, forse fino a Durazzo sull’Adriatico, oppure aver predicato attraverso la Macedonia fino alla frontiera illirica. M. N. Tod, nella International Standard Bible Encyclopedia, preferisce la seconda ipotesi, poiché gli Atti non registrano alcun viaggio oltre la Macedonia, e la colloca nel giro di Atti 20, quando Paolo, «dopo aver traversato quelle parti», «venne in Grecia», che W. M. Ramsay collocò nell’estate e nell’autunno del 56 d.C. Più tardi Tito andò «in Dalmazia», la parte costiera dell’Illirico."
  nl:
    - "Illyricum was de Romeinse naam voor de landen van de Illyriërs langs de oostkust van de Adriatische Zee en landinwaarts tot aan de Sava en de Donau, in het huidige westelijke Balkangebied. In 59 v.Chr. gaf de Vatinische wet Julius Caesar Gallia Cisalpina “met Illyricum erbij”. Onder Augustus werd het tot de Donau uitgebreid; het werd geschud door de grote opstand van 6–9 n.Chr., waarna het werd verdeeld in Boven-Illyricum aan de kust, bestuurd vanuit Salona bij het moderne Split, en Neder-Illyricum in het noorden. Deze werden de provincies Dalmatië en Pannonië; P. Kovács dateert een afzonderlijk Pannonië onder Nero, Marjeta Šašel Kos onder Vespasianus."
    - "Schrijvend aan de Romeinen vat Paulus zijn werk samen: “zodat ik, van Jeruzalem af, en rondom, tot Illyrikum toe, het Evangelie van Christus vervuld heb.” Handelingen noemt Illyricum nooit. Het Griekse woord voor “tot” kan de plaats insluiten of ervoor ophouden: Paulus kan in Illyricum zelf zijn gekomen, misschien tot Dyrrhachium aan de Adriatische Zee, of door Macedonië tot aan de Illyrische grens hebben gepredikt. M. N. Tod geeft in de International Standard Bible Encyclopedia de voorkeur aan het tweede, omdat Handelingen geen reis voorbij Macedonië vermeldt, en plaatst het in de tocht van Handelingen 20, toen Paulus “die delen doorgereisd” had en vervolgens “kwam hij in Griekenland”, wat W. M. Ramsay in de zomer en herfst van 56 n.Chr. plaatste. Later ging Titus “naar Dalmatië”, het kustdeel van Illyricum."
  pl:
    - "Illiryk (Illyricum) było rzymską nazwą ziem Ilirów wzdłuż wschodniego brzegu Adriatyku i w głąb lądu aż do Sawy i Dunaju, na terenie dzisiejszych zachodnich Bałkanów. W 59 p.n.e. ustawa Watyniusza dała Juliuszowi Cezarowi Galię Przedalpejską „z dodaniem Iliryku”. Za Augusta rozciągnięto go do Dunaju; wstrząsnęło nim wielkie powstanie z lat 6-9 n.e., po którym podzielono go na Illiryk Górny na wybrzeżu, rządzony z Salony koło dzisiejszego Splitu, i Illiryk Dolny na północy. Stały się one prowincjami Dalmacji i Panonii; P. Kovács datuje odrębną Panonię na czasy Nerona, Marjeta Šašel Kos na czasy Wespazjana."
    - "Pisząc do Rzymian, Paweł podsumowuje swoją pracę: „tak iżem od Jeruzalemu i okolicznych krain aż do Iliryku napełnił Ewangieliją Chrystusową”. Dzieje Apostolskie nigdy nie wymieniają Iliryku. Greckie słowo oznaczające „aż do” może obejmować dane miejsce lub zatrzymywać się przed nim: Paweł mógł wejść do samego Iliryku, może aż do Dyrrachium nad Adriatykiem, albo głosić przez Macedonię aż do granicy iliryjskiej. M. N. Tod w International Standard Bible Encyclopedia woli drugą możliwość, ponieważ Dzieje nie zapisują wyprawy poza Macedonię, i umieszcza ją w podróży z Dz 20, gdy Paweł „przeszedłszy one strony”, zanim „przyszedł do Grecyi”, co W. M. Ramsay datował na lato i jesień 56 roku n.e. Później Tytus udał się „do Dalmacyi”, nadmorskiej części Iliryku."
  cs:
    - "Illyrikum bylo římské jméno pro země Illyrů podél východního břehu Jaderského moře a ve vnitrozemí až k Sávě a Dunaji, v dnešním západním Balkáně. Roku 59 př. n. l. dal Vatiniův zákon Juliu Caesarovi Galii Cisalpinskou „s přidaným Illyrikem“. Za Augusta bylo rozšířeno až k Dunaji; otřáslo jím velké povstání v letech 6–9 n. l., po němž bylo rozděleno na Horní Illyrikum na pobřeží, spravované ze Salony poblíž dnešního Splitu, a Dolní Illyrikum na severu. Z nich se staly provincie Dalmácie a Pannonie; P. Kovács klade samostatnou Pannonii do doby Neronovy, Marjeta Šašel Kos do doby Vespasianovy."
    - "V listu Římanům Pavel shrnuje své dílo: „takže jsem od Jeruzaléma vůkol až k Ilyrické zemi naplnil evangelium Kristovým“. Skutky Illyrikum nikdy nejmenují. Řecké slovo pro „až k“ může místo zahrnovat, nebo před ním končit: Pavel mohl vstoupit do samotného Illyrika, snad až k Dyrrhachiu na Jadranu, nebo kázal po Makedonii až k illyrské hranici. M. N. Tod v International Standard Bible Encyclopedia dává přednost druhému výkladu, protože Skutky nezaznamenávají žádnou cestu za Makedonii, a klade to do cesty z Sk 20, kdy Pavel „prošel krajiny ty“, než „přišel do země Řecké“, což W. M. Ramsay datoval do léta a podzimu roku 56 n. l. Později šel Titus „do Dalmacie“, pobřežní části Illyrika."
  sv:
    - "Illyrien var det romerska namnet på illyriernas länder längs Adriatiska havets östra kust och inåt landet till Sava och Donau, på dagens västra Balkan. År 59 f.Kr. gav Vatinius lag Julius Caesar Gallia Cisalpina ”med Illyrien tillagt”. Under Augustus utvidgades det till Donau; det skakades av det stora upproret år 6–9 e.Kr., varefter det delades i Övre Illyrien vid kusten, styrt från Salona nära dagens Split, och Nedre Illyrien i norr. Dessa blev provinserna Dalmatien och Pannonien; P. Kovács daterar en särskild Pannonien till Neros regering, Marjeta Šašel Kos till Vespasianus."
    - "I brevet till romarna sammanfattar Paulus sitt verk: ”Så har jag, från Jerusalem och runt omkring ända till Illyrien, överallt förkunnat evangelium om Kristus.” Apostlagärningarna nämner aldrig Illyrien. Det grekiska ordet för ”ända till” kan inbegripa platsen eller stanna vid den: Paulus kan ha gått in i själva Illyrien, kanske så långt som till Dyrrhachion vid Adriatiska havet, eller predikat genom Makedonien upp till den illyriska gränsen. M. N. Tod i International Standard Bible Encyclopedia föredrar det andra, eftersom Apostlagärningarna inte registrerar någon resa bortom Makedonien, och placerar det i rundresan i Apg 20, när Paulus, sedan han ”hade färdats genom det landet”, kom till Grekland, vilket W. M. Ramsay förlade till sommaren och hösten år 56 e.Kr. Senare gick Titus ”till Dalmatien”, den kustnära delen av Illyrien."
  nb:
    - "Illyria var det romerske navnet på landene til illyrerne langs den østlige kysten av Adriaterhavet og innover til Sava og Donau, i dagens vestlige Balkan. I 59 f.Kr. ga Vatinius-loven Julius Caesar Gallia Cisalpina «med Illyria lagt til». Under Augustus ble det utvidet til Donau; det ble rystet av det store opprøret i 6–9 e.Kr., hvoretter det ble delt i Øvre Illyria på kysten, styrt fra Salona nær dagens Split, og Nedre Illyria i nord. Disse ble provinsene Dalmatia og Pannonia; P. Kovács daterer en egen Pannonia til Neros regjeringstid, Marjeta Šašel Kos til Vespasians."
    - "I brevet til romerne oppsummerer Paulus sitt arbeid: «så at jeg fra Jerusalem og rundt omkring like til Illyria har fullt kunngjort Kristi evangelium.» Apostlenes gjerninger nevner aldri Illyria. Det greske ordet for «like til» kan omfatte stedet eller stoppe ved det: Paulus kan ha reist inn i selve Illyria, kanskje så langt som til Dyrrhachion ved Adriaterhavet, eller forkynt gjennom Makedonia opp til den illyriske grensen. M. N. Tod, i International Standard Bible Encyclopedia, foretrekker det siste, siden Apostlenes gjerninger ikke melder om noen reise utover Makedonia, og plasserer det i turen i Apg 20, da Paulus hadde «reist gjennem disse landskaper» før han «kom til Grekenland», som W. M. Ramsay satte til sommeren og høsten 56 e.Kr. Senere dro Titus «til Dalmatia», den kystnære delen av Illyria."
  tl:
    - "Ang Ilirico ang pangalang Romano para sa mga lupain ng mga Ilirio sa silangang baybayin ng Adriatico at papaloob hanggang sa Sava at Danubio, sa kanlurang Balkan ngayon. Noong 59 BK, ibinigay ng batas Vatinia kay Julio Cesar ang Galia Cisalpina “kasama ang Ilirico”. Sa ilalim ni Augusto ay pinalawak ito hanggang sa Danubio; niyanig ito ng malaking paghihimagsik noong 6–9 AD, at pagkatapos nito ay hinati ito sa Mataas na Ilirico sa baybayin, pinamamahalaan mula sa Salona malapit sa makabagong Split, at Mababang Ilirico sa hilaga. Ang mga ito ay naging mga lalawigan ng Dalmacia at Pannonia; itinatala ni P. Kovács ang hiwalay na Pannonia sa paghahari ni Nero, ni Marjeta Šašel Kos sa kay Vespasiano."
    - "Sa pagsulat sa mga taga-Roma, ibinubuod ni Pablo ang kaniyang gawain: “buhat sa Jerusalem, at sa palibotlibot hanggang sa Ilirico, ay aking ipinangaral na lubos ang evangelio ni Cristo.” Hindi pinangalanan ng Mga Gawa ang Ilirico. Ang salitang Griyego para sa “hanggang sa” ay maaaring kasama ang lugar o huminto rito: maaaring pumasok si Pablo sa Ilirico mismo, marahil hanggang Dyrrhachium sa Adriatico, o nangaral sa buong Macedonia hanggang sa hangganan ng Ilirico. Pinipili ni M. N. Tod, sa International Standard Bible Encyclopedia, ang ikalawa, yamang walang itinalang paglalakbay ang Mga Gawa lampas sa Macedonia, at inilalagay ito sa paglalakbay sa Gawa 20, nang “matahak na niya ang mga dakong yaon” bago “napasa Grecia”, na inilagay ni W. M. Ramsay sa tag-init at taglagas ng 56 AD. Nang huli, si Tito ay pumunta “sa Dalmacia”, ang baybaying bahagi ng Ilirico."
  da:
    - "Illyrien var det romerske navn for illyrernes lande langs Adriaterhavets østkyst og ind i landet til Sava og Donau, i nutidens vestlige Balkan. I 59 f.Kr. gav Vatinius-loven Julius Cæsar Gallia Cisalpina »med Illyrien lagt til«. Under Augustus blev det udvidet til Donau; det blev rystet af det store oprør i 6–9 e.Kr., hvorefter det blev delt i Øvre Illyrien ved kysten, styret fra Salona nær nutidens Split, og Nedre Illyrien mod nord. Disse blev til provinserne Dalmatien og Pannonien; P. Kovács datérer en særskilt Pannonien til Neros regering, Marjeta Šašel Kos til Vespasians."
    - "I brevet til romerne opsummerer Paulus sit arbejde: »saa at jeg fra Jerusalem og trindt omkring indtil Illyrien har til fulde forkyndt Kristi Evangelium.« Apostlenes Gerninger nævner aldrig Illyrien. Det græske ord for »indtil« kan omfatte stedet eller standse ved det: Paulus kan have været i selve Illyrien, måske så langt som til Dyrrhachium ved Adriaterhavet, eller forkyndt gennem Makedonien op til den illyriske grænse. M. N. Tod foretrækker i International Standard Bible Encyclopedia det sidste, da Apostlenes Gerninger ikke optegner nogen rejse ud over Makedonien, og placerer det i rejsen i ApG 20, hvor Paulus »var dragen igennem disse Egne« og derpå »kom han til Grækenland«, hvilket W. M. Ramsay satte til sommeren og efteråret 56 e.Kr. Senere hedder det: »Titus til Dalmatien«, den kystnære del af Illyrien."
  sr:
    - "Илирик је био римско име за земље Илира дуж источне обале Јадрана и у унутрашњости до Саве и Дунава, у данашњем западном Балкану. Године 59. п. н. е. Ватинијев закон дао је Јулију Цезару Цизалпинску Галију „са придодатим Илириком“. Под Августом је проширен до Дунава; потресао га је велики устанак 6–9. н. е., после кога је подељен на Горњи Илирик на обали, којим се управљало из Салоне близу данашњег Сплита, и Доњи Илирик на северу. Из њих су постале провинције Далмација и Панонија; П. Ковач датује засебну Панонију у Неронову владавину, Марјета Шашел Кос у Веспазијанову."
    - "Пишући Римљанима, Павле сажима свој рад: „од Јерусалима и наоколо тја до Илирика напуних јеванђељем Христовим.“ Дела никад не именују Илирик. Грчка реч за „до“ може обухватати место или стати пред њим: Павле је можда отишао у сам Илирик, можда до Дирахијума на Јадрану, или је проповедао кроз Македонију до илирске границе. М. Н. Тод, у Међународној стандардној библијској енциклопедији, више воли друго, јер Дела не бележе путовање даље од Македоније, и смешта га у путовање из Дела 20, када Павле, „прошавши оне земље“, „дође у Грчку“, што је В. М. Рамзи ставио у лето и јесен 56. н. е. Касније је Тит отишао „у Далмацију“, приобални део Илирика."
  hu:
    - "Illirikum az illírek földjének római neve az Adria keleti partja mentén és a Száváig és a Dunáig benyúlva, a mai nyugati Balkánon. Kr. e. 59-ben a Vatinius-törvény Július Caesarnak adta a Gallia Cisalpinát, „Illyricummal kiegészítve”. Augusztus alatt a Dunáig terjesztették ki; a Kr. u. 6–9-es nagy felkelés megrázta, ami után Felső-Illirikumra osztották a tengerparton, amelyet a mai Split melletti Szalonából kormányoztak, és Alsó-Illirikumra északon. Ezekből lett Dalmácia és Pannónia provincia; P. Kovács egy külön Pannóniát Nero uralkodására, Marjeta Šašel Kos Vespasianuséra keltezi."
    - "A Rómaiakhoz írva Pál összefoglalja munkáját: „Jeruzsálemtől és környékétől fogva Illyriáig betöltöttem a Krisztus evangyéliomát.” Az Apostolok cselekedetei sosem nevezi meg Illirikumot. Az „-ig” görög szava magában foglalhatja a helyet, vagy megállhat előtte: Pál bemehetett magába Illirikumba, talán az Adria menti Dürrhakhionig, vagy Macedónián át az illír határig prédikált. M. N. Tod a Nemzetközi Szabványos Bibliai Enciklopédiában az utóbbit részesíti előnyben, mivel az Apostolok cselekedetei nem jegyez fel Macedónián túli utat, és az ApCsel 20 útjába helyezi, amikor Pál „azokat a tartományokat eljárta”, mielőtt „Görögországba méne”, amelyet W. M. Ramsay Kr. u. 56 nyarára és őszére tett. Később Titusz „Dalmátziába” ment, Illirikum tengerparti részébe."
  fi:
    - "Illyrikum oli roomalainen nimi illyrialaisten maille Adrianmeren itärannalla ja sisämaassa Savaan ja Tonavaan asti, nykyisellä läntisellä Balkanilla. Vuonna 59 eaa. Vatiniuksen laki antoi Julius Caesarille Gallia Cisalpinan ”Illyrikum lisättynä”. Augustuksen aikana se laajennettiin Tonavaan; sen järkytti suuri kapina vuosina 6–9 jaa., jonka jälkeen se jaettiin rannikon Ylä-Illyrikumiin, jota hallittiin Salonasta nykyisen Splitin lähellä, ja pohjoisempaan Ala-Illyrikumiin. Näistä tuli Dalmatian ja Pannonian provinssit; P. Kovács ajoittaa erillisen Pannonian Neron aikaan, Marjeta Šašel Kos Vespasianuksen."
    - "Roomalaisille kirjoittaessaan Paavali tiivistää työnsä: ”niin että minä Jerusalemista ja sen ympäristöstä alkaen Illyrikoniin saakka olen suorittanut Kristuksen evankeliumin julistamisen”. Apostolien teot eivät koskaan nimeä Illyrikumia. Kreikan sana ”saakka” voi sisältää paikan tai pysähtyä siihen: Paavali on voinut mennä itse Illyrikumiin, ehkä aina Dyrrhachioniin Adrianmeren rannalla, tai saarnata Makedonian halki Illyrian rajalle. M. N. Tod International Standard Bible Encyclopediassa pitää parempana jälkimmäistä, koska Apostolien teot eivät kirjaa matkaa Makedoniaa pidemmälle, ja sijoittaa sen luvun 20 kierrokseen, kun Paavali oli ”kuljettuaan niiden paikkakuntien läpi” ennen kuin ”tuli Kreikkaan”, minkä W. M. Ramsay ajoitti kesään ja syksyyn 56 jaa. Myöhemmin Titus meni ”Dalmatiaan”, Illyrikumin rannikko-osaan."
  vi:
    - "I-ly-ri là tên La Mã chỉ xứ của người Illyria dọc bờ đông biển Adriatic và vào nội địa đến sông Sava và sông Danube, ở tây Balkan ngày nay. Năm 59 TCN, đạo luật Vatinius cho Julius Caesar vùng Gaul bên này dãy Alps “thêm I-ly-ri”. Dưới Au-gút-tơ, vùng được mở rộng đến sông Danube; nó bị chấn động bởi cuộc nổi dậy lớn năm 6–9, sau đó được chia thành Thượng I-ly-ri ở ven biển, cai trị từ Salona gần Split hiện đại, và Hạ I-ly-ri ở phía bắc. Chúng trở thành các tỉnh Đa-ma-ti và Pannonia; P. Kovács định niên đại Pannonia riêng vào triều Nero, Marjeta Šašel Kos vào triều Vespasian."
    - "Viết cho người Rô-ma, Phao-lô tóm lược công việc của mình: “từ thành Giê-ru-sa-lem và các miền xung quanh cho đến xứ I-ly-ri, tôi đã đem đạo Tin Lành của Đấng Christ đi khắp chốn”. Sách Công vụ không bao giờ nêu I-ly-ri. Từ Hy Lạp chỉ “cho đến” có thể gồm nơi ấy hoặc dừng trước nơi ấy: Phao-lô có thể đã vào chính I-ly-ri, có lẽ đến tận Dyrrhachium trên biển Adriatic, hoặc giảng qua Ma-xê-đoan đến biên giới I-ly-ri. M. N. Tod, trong International Standard Bible Encyclopedia, ưa cách thứ hai, vì Công vụ không ghi chuyến đi nào ngoài Ma-xê-đoan, và đặt nó trong chuyến đi của Công vụ 20, khi Phao-lô “trải khắp trong miền nầy” trước khi “tới nước Gờ-réc”, mà W. M. Ramsay đặt vào mùa hè và mùa thu năm 56. Về sau Tít đi “xứ Đa-ma-ti”, phần ven biển của I-ly-ri."
  ro:
    - "Iliria era numele roman al țărilor ilirilor de-a lungul țărmului estic al Adriaticii și în interior până la Sava și Dunăre, în vestul Balcanilor de azi. În 59 î.Hr., legea Vatinia i-a dat lui Iulius Caesar Galia Cisalpină „cu Illyricum adăugat”. Sub Augustus a fost extinsă până la Dunăre; a fost zguduită de marea răscoală din 6–9 d.Hr., după care a fost împărțită în Iliria Superioară, pe coastă, guvernată de la Salona, lângă Splitul de azi, și Iliria Inferioară, la nord. Acestea au devenit provinciile Dalmatia și Pannonia; P. Kovács datează o Pannonia separată în domnia lui Nero, iar Marjeta Šašel Kos în cea a lui Vespasian."
    - "Scriind romanilor, Pavel își rezumă lucrarea: „din Ierusalim și împrejur până la Iliric, am plinit Evanghelia lui Hristos”. Faptele nu numesc niciodată Iliria. Cuvântul grecesc pentru „până la” poate include locul sau se poate opri la el: Pavel ar fi putut merge în Iliria însăși, poate până la Dyrrhachium, pe Adriatica, sau ar fi putut predica prin Macedonia până la frontiera ilirică. M. N. Tod, în International Standard Bible Encyclopedia, o preferă pe a doua, fiindcă Faptele nu consemnează nicio călătorie dincolo de Macedonia, și o plasează în călătoria din Fapte 20, când Pavel a trecut „prin părțile acelea” înainte să vină „în Elada”, ceea ce W. M. Ramsay a așezat în vara și toamna anului 56 d.Hr. Mai târziu Tit a plecat în Dalmația, partea de coastă a Iliriei."
  bg:
    - "Илирик беше римското име на земите на илирите по източния бряг на Адриатика и навътре до Сава и Дунав, в днешните Западни Балкани. През 59 г. пр.н.е. законът на Ватиний даде на Юлий Цезар Цизалпийска Галия „с добавяне на Илирик“. При Август той беше разширен до Дунав; беше разтърсен от голямото въстание от 6–9 г. н.е., след което беше разделен на Горен Илирик на брега, управляван от Салона близо до днешен Сплит, и Долен Илирик на север. Те станаха провинциите Далмация и Панония; П. Ковач датира отделната Панония към царуването на Нерон, Марйета Шашел Кос — към това на Веспасиан."
    - "Пишейки до римляните, Павел обобщава делото си: „така що от Ерусалим и наоколо даже до Илирик изпълних с проповедта на Христовото евангелие“. Деянията никога не назовават Илирик. Гръцката дума за „до“ може да включва мястото или да спира при него: Павел може да е влязъл в самия Илирик, може би до Дирахиум на Адриатика, или да е проповядвал през Македония до илирийската граница. М. Н. Тод в International Standard Bible Encyclopedia предпочита второто, понеже Деянията не отбелязват пътуване отвъд Македония, и го поставя в обиколката от Деян. 20, когато Павел „премина онези места“, преди да „дойде в Елада“, която У. М. Рамзи отнася към лятото и есента на 56 г. н.е. По-късно Тит отиде „в Далмация“, крайбрежната част на Илирик."
