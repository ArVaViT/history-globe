body:
  en:
    - "The East Gate here is the eastern gate of the Temple courts in Jerusalem, the gate that faced the sunrise and the Mount of Olives, not a gate of the city wall. In the organisation of the gatekeepers under David “the lot eastward fell to Shelemiah”, the chief of the Korahite porters; under Hezekiah “Kore the son of Imnah the Levite, the porter toward the east, was over the freewill offerings of God”; and among those who rebuilt Nehemiah's wall, beside the priests opposite their houses, was “Shemaiah the son of Shechaniah, the keeper of the east gate”. The gate that Jeremiah calls the east gate in the King James Version, the way out to the valley of Hinnom, is a different one, the Potsherd Gate; the Synodal text names it Harshith."
    - "Ezekiel makes this gate the hinge of his visions. Through it the glory of God leaves the Temple: the cherubim rose and “every one stood at the door of the east gate of the LORD's house; and the glory of the God of Israel was over them above”. Then the spirit “brought me unto the east gate of the LORD's house, which looketh eastward: and behold at the door of the gate five and twenty men”, the princes who gave wicked counsel. In the vision of the new Temple the glory returns the same way, “from the way of the east”, and the outer east gate is then shut: “This gate shall be shut, it shall not be opened, and no man shall enter in by it; because the LORD, the God of Israel, hath entered in by it”."
    - "The Mishnah calls the eastern gate of Herod's Temple the Shushan Gate, from a picture of Susa upon it. The gate now in the eastern wall of the Temple Mount, the Golden Gate, is a double gate built, scholars argue, in the late Byzantine or early Umayyad period and walled up by the Ottomans; Jews, Christians and Muslims have all read Ezekiel's shut gate in it, and a Muslim cemetery lies before it."
  ru:
    - "Восточные ворота здесь — восточные ворота храмовых дворов в Иерусалиме, ворота, обращённые к восходу и к Елеонской горе, а не ворота городской стены. При устроении привратников у Давида «выпал жребий на восток Шелемии», главе кореевых привратников; при Езекии «Коре, сын Имны, левит, привратник на восточной стороне, был при добровольных приношениях Богу»; а среди строителей стены Неемии, рядом со священниками против их домов, был «Шемаия, сын Шехании, сторож восточных ворот». Ворота, через которые Иеремия выходит в долину сыновей Енномовых, — другие, ворота Харшиф; английская Библия короля Иакова зовёт и их восточными."
    - "Иезекииль делает эти ворота осью своих видений. Через них слава Божия покидает Храм: Херувимы поднялись и «стали у входа в восточные врата Дома Господня, и слава Бога Израилева вверху над ними». Затем дух «привел меня к восточным воротам дома Господня, которые обращены к востоку. И вот, у входа в ворота двадцать пять человек» — князья, дававшие злой совет. В видении нового Храма слава возвращается тем же путём, «от востока», и внешние восточные ворота затем затворяются: «ворота сии будут затворены, не отворятся, и никакой человек не войдет ими, ибо Господь, Бог Израилев, вошел ими»."
    - "Мишна зовёт восточные ворота Иродова храма воротами Шушан — по изображению Суз на них. Ворота, что стоят ныне в восточной стене Храмовой горы, Золотые ворота, — двойные ворота, построенные, как считают учёные, в поздневизантийское или раннеомейядское время и замурованные Османами; иудеи, христиане и мусульмане видели в них затворённые ворота Иезекииля, а перед ними лежит мусульманское кладбище."
  uk:
    - "Східні ворота тут — східна брама дворів храму в Єрусалимі, брама, що дивилася на схід сонця й на Оливкову гору, а не ворота міського муру. В упорядкуванні воротарів за Давида «випав жереб від сходу на Шелемія», старшого з корахітських воротарів; за Єзекії «Коре, син Імнин, левіт, дверник на східньому боцї, був при доброхітнїх приносах Богові»; а серед тих, хто відбудовував мур Неемії, поряд із священниками навпроти їхніх домів, був «Шемая, син Шеханїїн, вартовий коло східнїх воріт». Ворота, які Єремія в перекладі короля Якова називає східними, вихід до долини Гінном, — інші, Черепяна брама; Синодальний текст називає їх Харшіф."
    - "Єзекіїль робить ці ворота віссю своїх видінь. Крізь них слава Божа залишає храм: херувими знялися, і «зʼупинились вони коло ввіходу в восточню браму в Господньому дому, а над ними сияла слава Бога Ізрайлевого». Потім дух «принїс мене до восточньої брами в дому Господньому, що стояла на схід сонця. Там, коло ввіходу в ворота стояло двайцять і пять чоловіка», князі, що давали лиху раду. У видінні нового храму слава повертається тим самим шляхом, «йде від востоку», і зовнішні східні ворота тоді зачиняються: «Брама ся буде зачинена, й не відчиниться, й нїяка людина не ввійде нею, бо Господь Бог Ізраїля увійшов нею, й буде вона зачинена»."
    - "Мішна називає східну браму Іродового храму воротами Шушан від зображення Сузи на них. Брама, що нині в східному мурі Храмової гори, Золоті ворота, — подвійна брама, збудована, як доводять учені, наприкінці візантійського або на початку омеядського періоду й замурована османами; юдеї, християни та мусульмани читали в ній зачинену браму Єзекіїля, а перед нею лежить мусульманський цвинтар."
  es:
    - "La Puerta Oriental de que se trata aquí es la puerta oriental de los atrios del Templo en Jerusalén, la que miraba hacia el amanecer y el monte de los Olivos, no una puerta de la muralla de la ciudad. En la organización de los porteros bajo David, «cayó la suerte al oriente á Selemía», jefe de los porteros coreítas; bajo Ezequías, «Coré hijo de Imna Levita, portero al oriente, tenía cargo de las limosnas de Dios»; y entre quienes reconstruyeron el muro de Nehemías, junto a los sacerdotes frente a sus casas, estaba «Semaías hijo de Sechânías, guarda de la puerta oriental». La puerta que Jeremías llama puerta oriental en la versión King James, la salida al valle de Hinom, es otra distinta, la Puerta de los Tiestos; el texto sinodal la llama Harshith."
    - "Ezequiel hace de esta puerta el eje de sus visiones. Por ella sale la gloria de Dios del Templo: los querubines se alzaron y «paráronse á la entrada de la puerta oriental de la casa de Jehová, y la gloria del Dios de Israel estaba arriba sobre ellos». Luego el espíritu «metióme por la puerta oriental de la casa de Jehová, la cual mira hacia el oriente: y he aquí á la entrada de la puerta veinticinco varones», los príncipes que daban mal consejo. En la visión del nuevo Templo la gloria regresa por el mismo camino, «que venía de hacia el oriente», y la puerta oriental exterior queda entonces cerrada: «Esta puerta ha de estar cerrada: no se abrirá, ni entrará por ella hombre, porque Jehová Dios de Israel entró por ella»."
    - "La Misná llama a la puerta oriental del Templo de Herodes la Puerta de Susa, por una pintura de Susa que había en ella. La puerta que hay hoy en el muro oriental del monte del Templo, la Puerta Dorada, es una puerta doble construida, según argumentan los estudiosos, a finales del periodo bizantino o comienzos del omeya y tapiada por los otomanos; judíos, cristianos y musulmanes han leído en ella la puerta cerrada de Ezequiel, y un cementerio musulmán se extiende ante ella."
  pt:
    - "A Porta Oriental de que se trata aqui é a porta leste dos átrios do Templo em Jerusalém, a que dava para o nascer do sol e para o Monte das Oliveiras, e não uma porta do muro da cidade. Na organização dos porteiros sob Davi, “A sorte para o leste caiu para Selemias”, chefe dos porteiros coreítas; sob Ezequias, “Coré, filho de Imná, o levita, o porteiro da porta leste, estava encarregado das ofertas voluntárias feitas a Deus”; e entre os que reconstruíram o muro de Neemias, ao lado dos sacerdotes em frente às suas casas, estava “Semaías, filho de Secanias, o guarda da porta leste”. A porta que Jeremias chama de porta oriental na King James Version, a saída para o vale de Hinom, é outra, a Porta dos Cacos; o texto sinodal a chama de Harshith."
    - "Ezequiel faz desta porta o eixo de suas visões. Por ela a glória de Deus deixa o Templo: os querubins se elevaram e “pararam à entrada da porta oriental da casa do SENHOR; e a glória do Deus de Israel estava no alto, sobre eles”. Depois o espírito “me levou à porta leste da casa do SENHOR, que está voltada para o leste. Eis que vinte e cinco homens estavam à entrada da porta”, os príncipes que davam conselho perverso. Na visão do novo Templo, a glória volta pelo mesmo caminho, “do caminho do leste”, e a porta oriental exterior é então fechada: “Esta porta permanecerá fechada. Ela não será aberta, nenhum homem entrará por ela; pois o SENHOR, o Deus de Israel, entrou por ela”."
    - "A Mishná chama a porta oriental do Templo de Herodes de Porta de Susã, por uma pintura de Susã nela. A porta que hoje existe no muro oriental do Monte do Templo, a Porta Dourada, é uma porta dupla construída, sustentam os estudiosos, no fim do período bizantino ou no início do omíada e emparedada pelos otomanos; judeus, cristãos e muçulmanos leram nela a porta fechada de Ezequiel, e um cemitério muçulmano se estende diante dela."
  de:
    - "Das Osttor ist hier das östliche Tor der Tempelhöfe in Jerusalem, das Tor, das dem Sonnenaufgang und dem Ölberg zugewandt war, nicht ein Tor der Stadtmauer. In der Ordnung der Torhüter unter David: „Das Los gegen Morgen fiel auf Meselemja“, den Obersten der korachitischen Torhüter; unter Hiskia: „Kore, der Sohn Jimnas, der Levit, der Torhüter gegen Morgen, war über die freiwilligen Gaben Gottes“; und unter denen, die Nehemias Mauer wieder aufbauten, war neben den Priestern gegenüber ihren Häusern „Semaja, der Sohn Sechanjas, der Hüter des Tores gegen Morgen“. Das Tor, das Jeremia in der King-James-Bibel Osttor nennt, der Ausgang zum Hinnomtal, ist ein anderes, das Scherbentor; der synodale Text nennt es Harshith."
    - "Hesekiel macht dieses Tor zum Angelpunkt seiner Visionen. Durch es verlässt die Herrlichkeit Gottes den Tempel: Die Cherubim erhoben sich, „und sie traten zum Tor am Hause des HERRN, gegen Morgen, und die Herrlichkeit des Gottes Israels war oben über ihnen“. Dann: „Und mich hob ein Wind auf und brachte mich zum Tor am Hause des HERRN, das gegen Morgen sieht; und siehe, unter dem Tor waren fünfundzwanzig Männer“, die Fürsten, die bösen Rat gaben. In der Vision des neuen Tempels kehrt die Herrlichkeit auf demselben Weg zurück, sie „kam von Morgen“, und das äußere Osttor wird dann verschlossen: „Dies Tor soll zugeschlossen bleiben und nicht aufgetan werden, und soll niemand dadurchgehen; denn der HERR, der Gott Israels, ist dadurch eingegangen“."
    - "Die Mischna nennt das Osttor des herodianischen Tempels das Schuschan-Tor, nach einem Bild von Susa darauf. Das heutige Tor in der Ostmauer des Tempelbergs, das Goldene Tor, ist ein Doppeltor, das, wie Gelehrte vertreten, in spätbyzantinischer oder frühumayyadischer Zeit gebaut und von den Osmanen zugemauert wurde; Juden, Christen und Muslime haben in ihm Hesekiels verschlossenes Tor gesehen, und ein muslimischer Friedhof liegt davor."
  fr:
    - "La Porte Orientale désigne ici la porte est des parvis du Temple à Jérusalem, celle qui faisait face au soleil levant et au Mont des Oliviers, et non une porte du rempart de la ville. Dans l’organisation des portiers sous David, « le sort échut à Schélémia pour le côté de l’orient », chef des portiers coréites ; sous Ézéchias, « le Lévite Koré, fils de Jimna, portier de l’orient, avait l’intendance des dons volontaires faits à Dieu » ; et parmi ceux qui rebâtirent le mur de Néhémie, à côté des prêtres en face de leurs maisons, se trouvait « Schemaeja, fils de Schecania, gardien de la porte de l’orient ». La porte que Jérémie appelle porte orientale dans la version du roi Jacques, la sortie vers la vallée de Hinnom, est une autre, la Porte des Tessons ; le texte synodal la nomme Harshith."
    - "Ézéchiel fait de cette porte le pivot de ses visions. Par elle la gloire de Dieu quitte le Temple : les chérubins s’élevèrent de terre et « s’arrêtèrent à l’entrée de la porte de la maison de l’Éternel vers l’orient ; et la gloire du Dieu d’Israël était sur eux, en haut ». Puis l’esprit « m’enleva, et me transporta à la porte orientale de la maison de l’Éternel, à celle qui regarde l’orient. Et voici, à l’entrée de la porte, il y avait vingt-cinq hommes », les princes qui donnaient de mauvais conseils. Dans la vision du nouveau Temple, la gloire revient par le même chemin, elle « s’avançait de l’orient », et la porte extérieure orientale est alors fermée : « Cette porte sera fermée, elle ne s’ouvrira point, et personne n’y passera ; car l’Éternel, le Dieu d’Israël est entré par là »."
    - "La Michna appelle la porte orientale du Temple d’Hérode la porte de Suse (Shushan), d’après une image de Suse qui s’y trouvait. La porte qui s’ouvre aujourd’hui dans le mur oriental du Mont du Temple, la Porte Dorée, est une porte double bâtie, selon les spécialistes, à la fin de l’époque byzantine ou au début de l’époque omeyyade et murée par les Ottomans ; Juifs, chrétiens et musulmans y ont tous lu la porte fermée d’Ézéchiel, et un cimetière musulman s’étend devant elle."
  it:
    - "La Porta Orientale qui è la porta orientale dei cortili del Tempio a Gerusalemme, la porta che guardava verso il sorgere del sole e il Monte degli Ulivi, non una porta delle mura cittadine. Nell’organizzazione dei portieri sotto Davide «Per il lato d’oriente la sorte designò Scelemia», capo dei portieri coraiti; sotto Ezechia «il Levita Kore, figliuolo di Imna, guardiano della porta orientale, era preposto ai doni volontari fatti a Dio»; e fra quelli che ricostruirono le mura di Neemia, accanto ai sacerdoti dirimpetto alle loro case, c’era «Scemaia figliuolo di Scecania, guardiano della porta orientale». La porta che Geremia chiama porta orientale nella King James Version, la via d’uscita verso la valle di Hinnom, è un’altra, la Porta dei Cocci; il testo sinodale la chiama Harshith."
    - "Ezechiele fa di questa porta il cardine delle sue visioni. Da essa la gloria di Dio lascia il Tempio: i cherubini s’innalzarono e «Si fermarono all’ingresso della porta orientale della casa dell’Eterno; e la gloria dell’Iddio d’Israele stava sopra di loro, su in alto». Poi lo spirito «mi menò alla porta orientale della casa dell’Eterno che guarda verso levante; ed ecco, all’ingresso della porta, venticinque uomini», i capi che davano consigli malvagi. Nella visione del nuovo Tempio la gloria torna per la stessa via, «dal lato d’oriente», e la porta esterna orientale viene poi chiusa: «Questa porta sarà chiusa, essa non s’aprirà, e nessuno entrerà per essa, poiché per essa è entrato l’Eterno, l’Iddio d’Israele»."
    - "La Mishnah chiama la porta orientale del Tempio di Erode Porta di Susa, da un’immagine di Susa che portava. La porta oggi nel muro orientale del Monte del Tempio, la Porta d’Oro, è una porta doppia costruita, sostengono gli studiosi, nel tardo periodo bizantino o all’inizio di quello omayyade e murata dagli Ottomani; Ebrei, cristiani e musulmani vi hanno letto la porta chiusa di Ezechiele, e un cimitero musulmano si stende davanti ad essa."
  pl:
    - "Brama Wschodnia to tu wschodnia brama dziedzińców świątyni w Jerozolimie, brama zwrócona ku wschodowi słońca i Górze Oliwnej, a nie brama muru miejskiego. W organizacji odźwiernych za Dawida „padł los na wschód słońca Selemijaszowy”, naczelnika odźwiernych korachickich; za Ezechiasza „Kore też, syn Jemny, Lewita, odźwierny bramy na wschód słońca, był nad rzeczami dobrowolnie ofiarowanemi Bogu”; a wśród tych, którzy odbudowywali mur Nehemiasza, obok kapłanów naprzeciw ich domów, był „Semejasz, syn Sechenijaszowy, stróż bramy wschodniej”. Brama, którą Jeremiasz nazywa bramą wschodnią w przekładzie Króla Jakuba, wyjście do doliny Hinnom, jest inną bramą, Bramą Garncarską; tekst synodalny nazywa ją Charsit."
    - "Ezechiel czyni tę bramę zawiasem swych wizji. Przez nią chwała Boża opuszcza świątynię: cherubini podnieśli się i „stanęli w wejściu bramy domu Pańskiego wschodniej, tedy chwała Boga Izraelskiego z wierzchu nad nimi była”. Potem duch „przywiódł mię do bramy domu Pańskiego wschodniej, która patrzy na wschód słońca; a oto w wejściu onej bramy było dwadzieścia i pięć mężów”, książąt, którzy dawali zła radę. W wizji nowej świątyni chwała wraca tą samą drogą, „drogą od wschodu”, a zewnętrzna brama wschodnia zostaje wtedy zamknięta: „Ta brama zamkniona będzie, nie będzie otworzona, a żaden nie wnijdzie przez nią; bo Pan, Bóg Izraelski, przeszedł przez nią”."
    - "Miszna nazywa wschodnią bramę Świątyni Heroda Bramą Szuszan, od obrazu Suzy na niej. Brama w obecnym wschodnim murze Wzgórza Świątynnego, Złota Brama, jest bramą podwójną zbudowaną, jak twierdzą uczeni, w późnym okresie bizantyjskim lub wczesnym omajjadzkim i zamurowaną przez Osmanów; Żydzi, chrześcijanie i muzułmanie widzieli w niej zamkniętą bramę Ezechiela, a przed nią leży cmentarz muzułmański."
  nl:
    - "De Oostpoort is hier de oostelijke poort van de tempelhoven in Jeruzalem, de poort die naar de zonsopgang en de Olijfberg keek, geen poort van de stadsmuur. Bij de indeling van de poortwachters onder David geldt: “Het lot nu tegen het oosten viel op Salemja”, de overste van de Korachitische poortiers; onder Chizkia: “Kore, de zoon van Jimna, de Leviet, de poortier tegen het oosten, was over de vrijwillige gaven Gods”; en onder hen die Nehemia's muur herstelden, naast de priesters tegenover hun huizen, was “Semaja, de zoon van Sechanja, de bewaarder van de Oostpoort”. De poort die Jeremia in de King James Version de oostpoort noemt, de uitgang naar het dal van Hinnom, is een andere, de Potscherfpoort; de Synodale tekst noemt haar Charsit."
    - "Ezechiël maakt deze poort tot spil van zijn visioenen. Hierdoor verlaat Gods heerlijkheid de tempel: de cherubs hieven zich op en “elkeen stond aan de deur der Oostpoort van het huis des HEEREN; en de heerlijkheid des Gods Israëls was van boven over hen”. Daarna bracht de Geest hem “tot de Oostpoort van het huis des HEEREN, dewelke ziet oostwaarts; en ziet, aan de deur der poort waren vijf en twintig mannen”, de vorsten die slechte raad gaven. In het visioen van de nieuwe tempel keert de heerlijkheid langs dezelfde weg terug, “van den weg naar het oosten”, en wordt de buitenste oostpoort gesloten: “Deze poort zal toegesloten zijn, zij zal niet geopend worden, noch iemand door dezelve ingaan, omdat de HEERE, de God Israëls, door dezelve is ingegaan”."
    - "De Misjna noemt de oostpoort van Herodes' tempel de Sjoesjanpoort, naar een afbeelding van Susa erop. De poort in de oostmuur van de Tempelberg nu, de Gouden Poort, is een dubbele poort die volgens geleerden in de late Byzantijnse of vroege Omajjadische tijd werd gebouwd en door de Ottomanen dichtgemetseld; Joden, christenen en moslims hebben er Ezechiëls gesloten poort in gelezen, en een moslimbegraafplaats ligt ervoor."
  cs:
    - "Východní brána je zde východní brána nádvoří chrámu v Jeruzalémě, brána obrácená k východu slunce a k Olivové hoře, ne brána městské hradby. Při uspořádání strážců bran za Davida „I padl los k východu Selemiášovi“, vedoucímu korachovských vrátných; za Chizkijáše „Chóre pak syn Imny, Levíta, vrátný brány východní, byl nad tím, což dobrovolně obětovali Bohu“; a mezi těmi, kdo přestavovali Nehemjášovu hradbu, vedle kněží naproti jejich domům, byl „Semaiáš syn Sechaniášův, strážný brány východní“. Brána, kterou Jeremjáš v Bibli krále Jakuba nazývá východní, cesta ven do Hinnomova údolí, je jiná, Střepová brána; synodální text ji jmenuje Charšit."
    - "Ezechiel činí z této brány kloub svých vidění. Jí opouští chrám sláva Boží: cherubínové se vznesli a „stála u vrat brány domu Hospodinova východní, a sláva Boha Izraelského svrchu nad nimi“. Potom Duch „přivedl mne k bráně východní domu Hospodinova, kteráž patří na východ, a aj, ve vratech brány té pětmecítma mužů“, knížat, kteří dávali zlé rady. Ve vidění nového chrámu se sláva vrací toutéž cestou, „přicházela od východu“, a vnější východní brána je pak zavřena: „Brána tato zavřená bude, nebudeť otvírána, aniž kdo bude vcházeti skrze ni. Nebo Hospodin Bůh Izraelský všel skrze ni“."
    - "Mišna nazývá východní bránu Herodova chrámu Susanskou bránou podle obrazu Sus na ní. Brána ve východní zdi Chrámové hory dnes, Zlatá brána, je dvojitá brána vystavěná, jak badatelé tvrdí, v pozdní byzantské nebo rané umajjovské době a zazděná Osmany; Židé, křesťané i muslimové v ní četli Ezechielovu zavřenou bránu a před ní leží muslimský hřbitov."
  sv:
    - "Östra porten här är den östra porten till tempelförgårdarna i Jerusalem, porten som vette mot soluppgången och Olivberget, inte en port i stadsmuren. I organisationen av dörrvaktarna under David gäller att ”den lott som angav öster föll då på Selemja”, chef för de korahitiska dörrvaktarna; under Hiskia hade ”leviten Kore, Jimnas son, som var dörrvaktare på östra sidan, … uppsikten över de frivilliga gåvorna åt Gud”; och bland dem som byggde upp Nehemjas mur, bredvid prästerna mitt emot sina hus, fanns ”Semaja, Sekanjas son, som hade vakten vid Östra porten”. Porten som Jeremia i King James-bibeln kallar östra porten, vägen ut till Hinnoms dal, är en annan, Lerskärvsporten; den synodala texten kallar den Harshith."
    - "Hesekiel gör denna port till angelpunkten i sina syner. Genom den lämnar Guds härlighet templet: keruberna höjde sig och ”stannade vid ingången till östra porten på HERRENS hus, och Israels Guds härlighet vilade ovanpå dem”. Sedan förde andekraften honom ”till östra porten på HERRENS hus, den som vetter åt öster. Där fick jag se tjugufem män stå vid ingången till porten”, furstarna som gav onda råd. I synen av det nya templet återvänder härligheten samma väg, ”österifrån”, och den yttre östra porten stängs sedan: ”Denna port skall förbliva stängd och icke mer öppnas, och ingen skall gå in genom den, ty HERREN, Israels Gud, har gått in genom den”."
    - "Mishnan kallar östra porten till Herodes tempel Shushanporten, efter en bild av Susa på den. Porten som nu finns i den östra muren av Tempelberget, Gyllene porten, är en dubbelport som, hävdar forskare, byggdes under sen bysantinsk eller tidig umayyadisk tid och murades igen av osmanerna; judar, kristna och muslimer har alla läst Hesekiels stängda port i den, och en muslimsk begravningsplats ligger framför den."
  nb:
    - "Østporten her er den østre porten til tempelgårdene i Jerusalem, porten som vendte mot soloppgangen og Oljeberget, ikke en port i bymuren. Ved ordningen av dørvokterne under David heter det: «Loddet mot øst falt på Selemja», lederen for korahittenes dørvoktere; under Hiskia var «levitten Kore, Jimnas sønn, som var dørvokter mot øst», den som «hadde opsynet over de frivillige gaver til Gud»; og blant dem som bygde opp Nehemjas mur, ved siden av prestene midt imot sine hus, var «Semaja, Sekanjas sønn, som hadde vaktholdet ved den østre port». Porten som Jeremia i King James-oversettelsen kaller østporten, veien ut til Hinnoms dal, er en annen, Potteskårporten; den synodale teksten kaller den Harshith."
    - "Esekiel gjør denne porten til hengslet i sine syner. Gjennom den forlater Guds herlighet tempelet: kjerubene hevet seg og «de blev stående ved inngangen til den østre port i Herrens hus, og Israels Guds herlighet var ovenover dem». Så førte Ånden ham «til den østre port i Herrens hus, den som vender mot øst, og ved inngangen til porten så jeg fem og tyve menn», høvdingene som gav onde råd. I synet av det nye tempelet vender herligheten tilbake samme vei, «fra øst», og den ytre østporten lukkes da: «Denne port skal være lukket, den skal ikke åpnes, og ingen skal gå inn gjennem den; for Herren, Israels Gud, har gått inn gjennem den»."
    - "Mishnaen kaller den østre porten i Herodes' tempel Sjusjan-porten, etter et bilde av Susa på den. Porten som nå står i østmuren av Tempelhøyen, Den gylne port, er en dobbeltport bygd, hevder forskerne, i sen bysantinsk eller tidlig umayyadisk tid og murt igjen av osmanerne; jøder, kristne og muslimer har alle lest Esekiels lukkede port i den, og en muslimsk gravplass ligger foran den."
  tl:
    - "Ito ay ang silangang pintuan ng mga bakuran ng Templo sa Jerusalem, ang pintuang nakaharap sa pagsikat ng araw at sa Bundok ng mga Olibo, hindi pintuan ng pader ng lungsod. Sa pagsasaayos ng mga tagatanod-pinto ni David, “ang kapalaran sa dakong silanganan ay nahulog kay Selemia”, ang pinuno ng mga tagatanod-pinto na Korahita; sa ilalim ni Ezechias, “si Core na anak ni Imna na Levita, na tagatanod-pinto sa silanganang pintuang-daan, ay katiwala sa mga kusang handog sa Dios”; at sa mga nagtayong muli ng pader ni Nehemias, sa tabi ng mga saserdoteng kaharap ng kanilang mga bahay, ay si “Semaias na anak ni Sechanias na tagatanod ng pintuang silanganan”. Ang tinatawag ni Jeremias na pintuan sa silangan sa King James Version, ang labasan patungo sa libis ng Hinnom, ay ibang pintuan, ang Pintuang-bayan ng Harsit; Harshith ang pangalan nito sa tekstong Sinodal."
    - "Ginagawa ni Ezekiel ang pintuang ito na bisagra ng kaniyang mga pangitain. Dito lumalabas ang kaluwalhatian ng Dios sa Templo: tumaas ang mga kerubin at “sila'y nagsitayo sa pintuan ng pintuang-daang silanganan ng bahay ng Panginoon; at ang kaluwalhatian ng Dios ng Israel ay nasa itaas nila”. Pagkatapos “dinala ako sa pintuang-daang silanganan ng bahay ng Panginoon, na nakaharap sa dakong silanganan: at narito, nasa pinto ng pintuang-daan ang dalawang pu't limang lalake”, ang mga prinsipeng nagbigay ng masamang payo. Sa pangitain ng bagong Templo, bumabalik sa gayunding daan ang kaluwalhatian, “nanggagaling sa dakong silanganan”, at isinasara pagkatapos ang panlabas na pintuan sa silangan: “Ang pintuang-daang ito ay sasarhan, hindi bubuksan, o papasukan man ng sinoman, sapagka't pinasukan ng Panginoon, ng Dios ng Israel”."
    - "Tinatawag ng Mishnah ang silangang pintuan ng Templo ni Herodes na Pintuang-bayan ng Susan, mula sa isang larawan ng Susa sa ibabaw nito. Ang pintuang nasa silangang pader ngayon ng Bundok ng Templo, ang Gintong Pintuan, ay dobleng pintuang itinayo, ayon sa mga iskolar, noong huling panahong Bizantino o maagang Umayyad at tinakpan ng mga Otomano; nabasa ng mga Judio, Kristiyano at Muslim ang saradong pintuan ni Ezekiel dito, at isang sementeryo ng mga Muslim ang nasa harap nito."
  da:
    - "Østporten er her den østlige port til tempelforgårdene i Jerusalem, den port, der vendte mod solopgangen og Oliebjerget, ikke en port i bymuren. Ved organiseringen af portnerne under David hedder det: »Lodden imod Østen faldt for Selemia«, den korahitiske portners leder; under Hizkija var »Kore, Jimnas Søn, Leviten, Portneren imod Østen«, »sat over de frivillige Gaver til Gud«; og blandt dem, der genopbyggede Nehemias' mur, ved siden af præsterne ud for deres huse, var »Semaja, Sekanjas Søn, som tog Vare paa Østerporten«. Den port, som Jeremias i King James-oversættelsen kalder østporten, udgangen til Hinnoms dal, er en anden, Potteskårsporten; den synodale tekst kalder den Harshith."
    - "Ezekiel gør denne port til angelpunktet i sine syner. Gennem den forlader Guds herlighed templet: Keruberne hævede sig, og de »bleve staaende ved Indgangen til den østre Port paa Herrens Hus, og Israels Guds Herlighed var oven over dem«. Derpå førte ånden ham »til den østre Port paa Herrens Hus, den, som er vendt imod Østen, og se, ved Indgangen til Porten var der fem og tyve Mænd«, de fyrster, der gav ugudelige råd. I synet af det nye tempel vender herligheden tilbage samme vej, »fra Østen af«, og den ydre østport lukkes derpå: »Denne Port skal være tillukket, den skal ikke oplades, og ingen Mand skal gaa ind ad den, thi Herren, Israels Gud, er gaaet ind ad den«."
    - "Mishnaen kalder østporten i Herodes' tempel Susan-porten efter et billede af Susa på den. Den port, der nu står i Tempelbjergets østmur, Den Gyldne Port, er en dobbeltport bygget, hævder forskere, i sen byzantinsk eller tidlig umayyadisk tid og tilmuret af osmannerne; jøder, kristne og muslimer har alle læst Ezekiels lukkede port ind i den, og en muslimsk kirkegård ligger foran den."
  sr:
    - "Источна капија овде је источна капија храмовних дворишта у Јерусалиму, капија окренута излазећем сунцу и Маслинској гори, а не капија градског зида. У организацији вратара под Давидом „паде жреб на исток Селимији“, поглавару вратара из рода Корејевог; под Језекијом „Кореј син Јемне Левита, вратар на истоку, беше над оним што се драговољно приношаше Богу“; а међу онима који су обнављали Немијин зид, поред свештеника наспрам својих кућа, био је „Семаја, син Сеханијин, чувар врата источних“. Капија коју Јеремија у преводу Краља Џејмса назива источном, излаз у долину Хином, друга је, Капија од црепова; синодални текст је зове Харсит."
    - "Језекиљ ову капију чини стожером својих виђења. Кроз њу слава Божја напушта Храм: херувими су се подигли и „стадоше на источним вратима дома Господњег, и слава Бога Израиљевог беше озго над њима“. Затим, како каже, дух „однесе ме на источна врата дома Господњег, која гледају на исток, и гле, на вратима беше двадесет и пет људи“, кнезове који су давали зле савете. У виђењу новог Храма слава се враћа истим путем, „дохођаше од истока“, а спољашња источна капија тада се затвара: „Ова врата нека буду затворена и да се не отварају, и нико да не улази на њих, јер је Господ Бог Израиљев ушао на њих“."
    - "Мишна источну капију Иродовог Храма зове Сушанска капија, по слици Суса на њој. Капија која је данас у источном зиду Храмовне горе, Златна капија, двојна је капија саграђена, тврде научници, у касно византијско или рано омајадско доба и зазидана од Османлија; Јевреји, хришћани и муслимани у њој су читали Језекиљеву затворену капију, а муслиманско гробље лежи пред њом."
  hu:
    - "A Keleti kapu itt a jeruzsálemi Templom udvarainak keleti kapuja, a napkeltére és az Olajfák hegyére néző kapu, nem a városfal kapuja. A kapuőrök Dávid alatti szervezésében „esék a napkelet felé való kapunak őrizete sors szerint Selémiásra”, a kórita kapuőrök vezetőjére; Ezékiás alatt „Kóré Lévita pedig, a Jemna fia, a ki ajtónálló vala napkelet felől, az Isten számára tett önkéntes adományok gondviselője volt”; és a Nehémiás falát újjáépítők között, a papok mellett, akik a házukkal szemben dolgoztak, ott volt „Semája, Sekaniás fia, a napkeleti kapu őrizője”. Az a kapu, amelyet a King James-fordítás Jeremiásnál keleti kapunak nevez, a Hinnom-völgybe vezető kijárat, más: a Cserépkapu; a Szinodális szöveg Harsitnak nevezi."
    - "Ezékiel látomásainak ez a kapu a sarokpontja. Rajta át hagyja el Isten dicsősége a Templomot: a kérubok felemelkedtek, és „megállának az Úr háza keleti kapujának bejáratánál, és Izráel Istenének dicsősége vala felül ő rajtok”. Majd a lélek „bevive az Úr házának keleti kapujához, a mely néz keletnek, és ímé, a kapu bejáratánál huszonöt férfi vala”, a gonosz tanácsot adó fejedelmek. Az új Templom látomásában a dicsőség ugyanazon az úton tér vissza, „napkelet felől”, és a külső keleti kapu ezután zárva marad: „Ez a kapu be lesz zárva, meg nem nyílik és senki rajta be nem megy, mert az Úr, az Izráel Istene ment be rajta”."
    - "A Misna Heródes Templomának keleti kapuját Susán-kapunak nevezi, a rajta lévő Susán-képről. A Templom-hegy keleti falában ma álló kapu, az Aranykapu kettős kapu, amelyet a tudósok szerint a késő bizánci vagy korai omajjád korban építettek, és az oszmánok befalaztak; zsidók, keresztények és muszlimok egyaránt benne olvasták Ezékiel zárt kapuját, és előtte muszlim temető fekszik."
  fi:
    - "Itäportti tarkoittaa tässä Jerusalemin temppelin esipihojen itäporttia, porttia, joka oli auringonnousua ja Öljymäkeä päin, ei kaupunginmuurin porttia. Ovenvartijoiden järjestyksessä Daavidin aikana ”Itäpuolen arpa lankesi Selemjalle”, korahilaisten ovenvartijoiden päällikölle; Hiskian aikana ”leeviläinen Koore, Jimnan poika, joka oli ovenvartijana idän puolella, hoiti Jumalalle annetut vapaaehtoiset lahjat”; ja Nehemian muurin uudelleen rakentajien joukossa, pappien jälkeen heidän talojensa kohdalla, oli ”Semaja, Sekanjan poika, Itäportin vartija”. Portti, jota Jeremia King James -käännöksessä kutsuu itäportiksi, ulospääsy Hinnomin laaksoon, on eri portti, Saviastiaportti; synodaalinen teksti nimeää sen Harshithiksi."
    - "Hesekiel tekee tästä portista näkyjensä saranan. Sen kautta Jumalan kirkkaus lähtee temppelistä: kerubit nousivat ja ”ne seisahtuivat Herran huoneen itäportin ovelle, ja niiden yläpuolella oli Israelin Jumalan kirkkaus”. Sitten Henki ”vei minut Herran huoneen itäportille, joka on itään päin. Ja katso: portin ovella oli kaksikymmentä viisi miestä”, ruhtinaat, jotka antoivat pahoja neuvoja. Uuden temppelin näyssä kirkkaus palaa samaa tietä, ”idästä päin”, ja ulompi itäportti suljetaan: ”Tämä portti on oleva suljettuna: sitä ei saa avata, eikä kenkään saa käydä siitä sisälle, sillä Herra, Israelin Jumala, on käynyt siitä sisälle”."
    - "Mishna kutsuu Herodeksen temppelin itäporttia Shushanin portiksi, sen päällä olevan Susan kuvan mukaan. Temppelivuoren itämuurissa nykyisin oleva portti, Kultainen portti, on kaksoisportti, jonka tutkijat katsovat rakennetun myöhäisbysanttilaisella tai varhaisella umayyadikaudella ja jonka ottomaanit muurasivat umpeen; juutalaiset, kristityt ja muslimit ovat kaikki lukeneet siinä Hesekielin suljetun portin, ja muslimihautausmaa on sen edessä."
  vi:
    - "Cửa Đông ở đây là cổng đông của các sân Đền Thờ ở Giê-ru-sa-lem, cổng hướng về mặt trời mọc và Núi Ô-li-ve, không phải một cổng của tường thành. Trong việc tổ chức người giữ cửa dưới thời Đa-vít, “Cái thăm về cửa đông trúng nhằm Sê-lê-mia”, trưởng những người giữ cửa thuộc dòng Cô-rê; dưới thời Ê-xê-chia, “Cô-rê, con trai của Dim-na, người Lê-vi, là kẻ giữ cửa phía đông, được đặt cai quản các lễ vật lạc ý dâng cho Đức Chúa Trời”; và trong số những người xây lại tường của Nê-hê-mi, bên cạnh các thầy tế lễ đối ngang nhà họ, có “Sê-ma-gia, con trai Sê-ca-nia, kẻ giữ cửa đông”. Cổng mà Giê-rê-mi gọi là cổng đông trong Bản King James, lối ra thung lũng Hi-nôm, là một cổng khác, Cửa Gốm; bản Synodal gọi nó là Harshith."
    - "Ê-xê-chi-ên lấy cổng này làm bản lề cho các khải tượng của mình. Qua đó vinh quang của Đức Chúa Trời rời Đền Thờ: các chê-ru-bin dấy lên và “dừng nơi lối vào cửa đông nhà Đức Giê-hô-va, và sự vinh hiển của Đức Chúa Trời Y-sơ-ra-ên ở trên chúng nó”. Rồi Thần “đem đến cửa đông nhà Đức Giê-hô-va, là cửa ở về phía đông. Nầy, nơi lối vào cửa có hai mươi lăm người”, các quan trưởng đã đưa ra mưu gian ác. Trong khải tượng về Đền Thờ mới, vinh quang trở về cùng đường ấy, “từ phương đông mà đến”, và cổng đông ngoài khi ấy bị đóng: “Hiên cửa nầy sẽ đóng luôn không mở nữa. Chẳng ai được vào bởi hiên cửa nầy, vì Giê-hô-va Đức Chúa Trời của Y-sơ-ra-ên đã vào bởi đó; vậy cửa ấy sẽ đóng lại”."
    - "Mishnah gọi cổng đông của Đền Thờ Hê-rốt là Cổng Shushan, theo một hình vẽ Su-xơ trên đó. Cổng hiện nay trong tường đông của Núi Đền Thờ, Cổng Vàng, là một cổng đôi được xây, theo các học giả, vào cuối thời Byzantine hoặc đầu thời Umayyad và bị người Ottoman xây bít; người Do Thái, Cơ Đốc nhân và người Hồi giáo đều đọc cổng đóng của Ê-xê-chi-ên nơi đó, và một nghĩa địa Hồi giáo nằm trước nó."
  ro:
    - "Poarta de Răsărit de aici este poarta de est a curților Templului din Ierusalim, poarta care privea spre răsărit și spre Muntele Măslinilor, nu o poartă a zidului cetății. În rânduirea portarilor sub David, „a căzut sorțul celor despre răsărit lui Selemia”, căpetenia portarilor coreiți; sub Ezechia, „Core al lui Iemna levitul, portarul despre răsărit, erà preste daruri”; iar printre cei care au zidit zidul lui Neemia, alături de preoți, în dreptul caselor lor, era „Samaia fiul lui Sehenia păzitorul porții despre răsărit”. Poarta pe care Ieremia o numește poarta de răsărit în King James Version, ieșirea spre valea Hinom, este alta, Poarta Oalelor; textul sinodal o numește Harshith."
    - "Ezechiel face din această poartă balamaua vedeniilor sale. Prin ea părăsește slava lui Dumnezeu Templul: heruvimii s-au ridicat și „au stătut la tinda porții casii Domnului cei din preajmă, și slava Dumnezeului lui Israil erà preste ei deasupra”. Apoi, după spusa lui, „m’au adus la poarta casii Domnului cei din preajmă, care caută către răsărit, și iată la tinda porții, ca la vr-o douăzeci și cinci de bărbați”, căpeteniile care dăduseră sfaturi rele. În vedenia noului Templu, slava se întoarce pe aceeași cale, dinspre răsărit, iar poarta de răsărit din afară este apoi închisă: poarta aceasta va fi încuiată, nu se va deschide și nimeni nu va intra pe ea, pentru că Domnul, Dumnezeul lui Israel, a intrat pe ea."
    - "Mișna numește poarta de est a Templului lui Irod Poarta Shushan, după o imagine a Susei de pe ea. Poarta de acum din zidul de est al Muntelui Templului, Poarta de Aur, este o poartă dublă zidită, susțin cercetătorii, la sfârșitul perioadei bizantine sau la începutul celei omeiade și astupată de otomani; iudeii, creștinii și musulmanii au citit în ea poarta închisă a lui Ezechiel, iar un cimitir musulman se află în fața ei."
  bg:
    - "Източната порта тук е източната порта на храмовите дворове в Йерусалим, портата, която гледала към изгрева и към Елеонския хълм, а не порта на градската стена. При разпределението на вратарите при Давид „падна жребието на Селемия към изток“, началника на кореевските вратари; при Езекия „Коре синът на Иемна Левитина, вратарят към изток бе над самоволните приноси Богу“; а сред онези, които възстановили стената на Неемия, до свещениците срещу домовете им, бил „Семаия Сеханиевът син, стражът на източната порта“. Портата, която Йеремия нарича източна в Библията на крал Джеймс, изходът към долината Еном, е друга — Портата на глинените отломки; Синодалният текст я назовава Харшит."
    - "Йезекиил прави тази порта ос на своите видения. През нея славата Божия напуска Храма: херувимите се издигнали и всеки застанал „във входа на източните врата на дома Господен; и славата на Бога Израилева бе на тях отгоре“. После „дигна ме Духът та ме отнесе на източните врата на дома Господен, които гледат към изток; и ето във входа на вратата двадесет и пет мъже“, князете, които давали лош съвет. Във видението за новия Храм славата се връща по същия път, „от източния път“, и тогава външната източна порта е затворена: „Тези врата ще са затворени, няма да се отворят, и человек няма да влезе през тях; защото Господ Бог Израилев влезе през тях“."
    - "Мишна нарича източната порта на Иродовия храм Портата Шушан, по изображение на Суза върху нея. Портата, която днес е в източната стена на Храмовия хълм, Златната порта, е двойна порта, построена, според учените, в късновизантийския или ранноомаядския период и зазидана от османците; юдеи, християни и мюсюлмани са виждали в нея затворената порта на Йезекиил, а пред нея лежи мюсюлманско гробище."
