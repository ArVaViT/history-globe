# Overview article (ADR 0007). Mainstream facts only; Gozan is Tell Halaf as generally held; the Yahwistic names in Assyrian documents are reported as a possible, not proven, trace of the exiles.
id: habor
place: af19252
title:
  en: "Habor"
  ru: "Хавор"
body:
  en:
    - "The Habor is the Khabur, the largest tributary of the Euphrates in Syria. It rises from great springs near Ras al-Ayn on the Turkish border, gathers the streams of the Jazira and flows south through steppe to join the Euphrates near Busayra, the ancient Circesium. Its upper valley was the Aramean kingdom of Bit-Bahiani with its capital Gozan, the mound of Tell Halaf beside the springs; Assyria made it the province of Guzana in 808 BC, and the river's banks were lined with Assyrian towns and estates, among them Dur-Katlimmu, now Tell Sheikh Hamad. In Mesopotamian texts the river is the Habur, and the Bible's “Habor by the river of Gozan” means the Habor, the river of the land of Gozan."
    - "Here the Assyrians settled the exiles of the northern kingdom. When Samaria fell in 722 BC the king of Assyria “carried Israel away into Assyria, and placed them in Halah and in Habor by the river of Gozan, and in the cities of the Medes”, a sentence Kings repeats in the story of Hezekiah; and the Chronicler says that Tiglath-pileser had already deported the tribes of Reuben, Gad and half Manasseh east of the Jordan “unto Halah, and Habor, and Hara, and to the river Gozan”, where they remained “unto this day”. Assyrian documents of the seventh century from Guzana name a few men with names formed on the name of Israel's God, which some take for descendants of the exiles; beyond that the lost tribes left no trace on the Khabur."
    - "Max von Oppenheim excavated Tell Halaf in 1911–1913 and 1929 and found the palace of the Aramean kings with its basalt statues and reliefs, and the river gave its name to the painted pottery of the sixth millennium BC first found there. The Khabur today runs through the Hasakah governorate of north-eastern Syria, its flow much reduced by dams and irrigation; Assyrian Christians settled its villages in the 1930s, and Tell Halaf, on the edge of Ras al-Ayn, was excavated again from 2006 until the civil war."
  ru:
    - "Хавор — это Хабур, самый большой приток Евфрата в Сирии. Он начинается из больших источников у Рас-эль-Айна на турецкой границе, собирает потоки Джазиры и течёт на юг через степь, впадая в Евфрат у Бусайры, древнего Киркесия. В его верхней долине лежало арамейское царство Бит-Бахиани со столицей Гозан, холм Телль-Халаф у источников; Ассирия сделала его провинцией Гузана в 808 г. до н. э., и берега реки были усеяны ассирийскими городами и поместьями, среди них Дур-Катлимму, нынешний Телль-Шейх-Хамад. В месопотамских текстах река зовётся Хабур, а библейское «в Хаворе, при реке Гозан» означает Хавор, реку земли Гозан."
    - "Здесь ассирийцы поселили изгнанников северного царства. Когда в 722 г. до н. э. пала Самария, царь Ассирийский «переселил Израильтян в Ассирию, и поселил их в Халахе и в Хаворе, при реке Гозан, и в городах Мидийских», и книга Царств повторяет эту фразу в рассказе о Езекии; а летописец говорит, что Феглафелласар ещё раньше увёл колена Рувима, Гада и половину Манассии из-за Иордана «в Халах, и Хавор, и Ару, и на реку Гозан», где они оставались до сего дня. Ассирийские документы VII века из Гузаны называют нескольких людей с именами, образованными от имени Бога Израилева, в которых некоторые видят потомков изгнанников; кроме этого потерянные колена не оставили на Хабуре следа."
    - "Макс фон Оппенгейм раскапывал Телль-Халаф в 1911–1913 и 1929 годах и нашёл дворец арамейских царей с базальтовыми статуями и рельефами, а река дала имя расписной керамике шестого тысячелетия до н. э., впервые найденной там. Хабур сегодня течёт через провинцию Хасеке на северо-востоке Сирии, и его сток сильно сократили плотины и орошение; в 1930-х годах его деревни заселили ассирийцы-христиане, а Телль-Халаф на окраине Рас-эль-Айна снова раскапывали с 2006 года до гражданской войны."
