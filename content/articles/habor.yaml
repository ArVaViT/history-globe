# Overview article (ADR 0007). Mainstream facts only; Gozan is Tell Halaf as generally held; the Yahwistic names in Assyrian documents are reported as a possible, not proven, trace of the exiles.
id: habor
place: af19252
title:
  en: "Habor"
  ru: "Хавор"
  uk: "Хавор"
  es: "Habor"
  pt: "Habor"
  de: "Habor"
  fr: "Chabor"
body:
  en:
    - "The Habor is the Khabur, the largest tributary of the Euphrates in Syria. It rises from great springs near Ras al-Ayn on the Turkish border, gathers the streams of the Jazira and flows south through steppe to join the Euphrates near Busayra, the ancient Circesium. Its upper valley was the Aramean kingdom of Bit-Bahiani with its capital Gozan, the mound of Tell Halaf beside the springs; Assyria made it the province of Guzana in 808 BC, and the river's banks were lined with Assyrian towns and estates, among them Dur-Katlimmu, now Tell Sheikh Hamad. In Mesopotamian texts the river is the Habur, and the Bible's “Habor by the river of Gozan” means the Habor, the river of the land of Gozan."
    - "Here the Assyrians settled the exiles of the northern kingdom. When Samaria fell in 722 BC the king of Assyria “carried Israel away into Assyria, and placed them in Halah and in Habor by the river of Gozan, and in the cities of the Medes”, a sentence Kings repeats in the story of Hezekiah; and the Chronicler says that Tiglath-pileser had already deported the tribes of Reuben, Gad and half Manasseh east of the Jordan “unto Halah, and Habor, and Hara, and to the river Gozan”, where they remained “unto this day”. Assyrian documents of the seventh century from Guzana name a few men with names formed on the name of Israel's God, which some take for descendants of the exiles; beyond that the lost tribes left no trace on the Khabur."
    - "Max von Oppenheim excavated Tell Halaf in 1911–1913 and 1929 and found the palace of the Aramean kings with its basalt statues and reliefs, and the river gave its name to the painted pottery of the sixth millennium BC first found there. The Khabur today runs through the Hasakah governorate of north-eastern Syria, its flow much reduced by dams and irrigation; Assyrian Christians settled its villages in the 1930s, and Tell Halaf, on the edge of Ras al-Ayn, was excavated again from 2006 until the civil war."
  ru:
    - "Хавор — это Хабур, самый большой приток Евфрата в Сирии. Он начинается из больших источников у Рас-эль-Айна на турецкой границе, собирает потоки Джазиры и течёт на юг через степь, впадая в Евфрат у Бусайры, древнего Киркесия. В его верхней долине лежало арамейское царство Бит-Бахиани со столицей Гозан, холм Телль-Халаф у источников; Ассирия сделала его провинцией Гузана в 808 г. до н. э., и берега реки были усеяны ассирийскими городами и поместьями, среди них Дур-Катлимму, нынешний Телль-Шейх-Хамад. В месопотамских текстах река зовётся Хабур, а библейское «в Хаворе, при реке Гозан» означает Хавор, реку земли Гозан."
    - "Здесь ассирийцы поселили изгнанников северного царства. Когда в 722 г. до н. э. пала Самария, царь Ассирийский «переселил Израильтян в Ассирию, и поселил их в Халахе и в Хаворе, при реке Гозан, и в городах Мидийских», и книга Царств повторяет эту фразу в рассказе о Езекии; а летописец говорит, что Феглафелласар ещё раньше увёл колена Рувима, Гада и половину Манассии из-за Иордана «в Халах, и Хавор, и Ару, и на реку Гозан», где они оставались до сего дня. Ассирийские документы VII века из Гузаны называют нескольких людей с именами, образованными от имени Бога Израилева, в которых некоторые видят потомков изгнанников; кроме этого потерянные колена не оставили на Хабуре следа."
    - "Макс фон Оппенгейм раскапывал Телль-Халаф в 1911–1913 и 1929 годах и нашёл дворец арамейских царей с базальтовыми статуями и рельефами, а река дала имя расписной керамике шестого тысячелетия до н. э., впервые найденной там. Хабур сегодня течёт через провинцию Хасеке на северо-востоке Сирии, и его сток сильно сократили плотины и орошение; в 1930-х годах его деревни заселили ассирийцы-христиане, а Телль-Халаф на окраине Рас-эль-Айна снова раскапывали с 2006 года до гражданской войны."
  uk:
    - "Хавор — це Хабур, найбільша притока Євфрату в Сирії. Він бере початок із великих джерел поблизу Рас-ель-Айна на турецькому кордоні, збирає потоки Джазіри й тече на південь степом, щоб злитися з Євфратом поблизу Бусайри, давнього Кіркесія. Його верхня долина була арамейським царством Бит-Бахіані зі столицею Гозан, городищем Телль-Халаф біля джерел; Ассирія зробила її провінцією Гузана 808 р. до н. е., і береги річки були вкриті ассирійськими містами й маєтками, серед них Дур-Катліму, нині Телль-Шейх-Хамад. У месопотамських текстах річка зветься Хабур, а біблійний «Хавор при ріцї Гозан» означає Хабур, річку краю Гозан."
    - "Тут ассирійці оселили вигнанців північного царства. Коли 722 р. до н. е. упала Самарія, цар Ассирії «одвів Ізрайлитян полонянами в Ассирию й поселив їх в Халасї й в Хаборі, при ріцї Гозан, та по Мидийських городах» — речення, яке Книги Царів повторюють в оповіді про Єзекію; а літописець каже, що Тіглатпаласар уже вивів племена Рувима, Гада й половини Манасії зі сходу від Йордану «в Халах і Хавір, і Ару, й на ріку Гозан, — де вони й до сього часу». Ассирійські документи VII ст. з Гузани називають кількох людей з іменами, утвореними від імені Бога Ізраїлю, які дехто вважає нащадками вигнанців; понад те, загублені коліна не залишили на Хабурі жодного сліду."
    - "Макс фон Оппенгайм розкопував Телль-Халаф у 1911–1913 і 1929 роках і знайшов палац арамейських царів з базальтовими статуями та рельєфами, а річка дала назву мальованій кераміці VI тисячоліття до н. е., уперше знайденій там. Нині Хабур тече через губернаторство Хасеке на північному сході Сирії, його стік сильно зменшений греблями й зрошенням; ассирійські християни заселили його села в 1930-х роках, а Телль-Халаф, на краю Рас-ель-Айна, розкопували знову з 2006 року до громадянської війни."
  es:
    - "El Habor es el Khabur, el mayor afluente del Éufrates en Siria. Nace de grandes manantiales cerca de Ras al-Ayn, en la frontera turca, recoge los arroyos de la Yazira y fluye hacia el sur por la estepa hasta unirse al Éufrates cerca de Busayra, la antigua Circesio. Su valle alto fue el reino arameo de Bit-Bahiani, con su capital Gozán, el montículo de Tell Halaf junto a los manantiales; Asiria lo convirtió en la provincia de Guzana en el 808 a. C., y las orillas del río se llenaron de ciudades y fincas asirias, entre ellas Dur-Katlimmu, hoy Tell Sheikh Hamad. En los textos mesopotámicos el río es el Habur, y el «Habor, junto al río de Gozán» de la Biblia significa el Habor, el río de la tierra de Gozán."
    - "Aquí los asirios establecieron a los desterrados del reino del norte. Cuando Samaria cayó en el 722 a. C., el rey de Asiria «trasportó á Israel á Asiria, y púsolos en Hala, y en Habor, junto al río de Gozán, y en las ciudades de los Medos», frase que Reyes repite en la historia de Ezequías; y el Cronista dice que Tiglat-pileser había deportado ya a las tribus de Rubén, Gad y media de Manasés, al este del Jordán, «á Halad, y á Habor y á Ara, y al río de Gozán», donde permanecieron «hasta hoy». Documentos asirios del siglo VII procedentes de Guzana nombran a unos pocos hombres con nombres formados sobre el nombre del Dios de Israel, que algunos toman por descendientes de los desterrados; fuera de eso, las tribus perdidas no dejaron rastro en el Khabur."
    - "Max von Oppenheim excavó Tell Halaf en 1911–1913 y 1929 y halló el palacio de los reyes arameos con sus estatuas y relieves de basalto, y el río dio nombre a la cerámica pintada del sexto milenio a. C. hallada allí por primera vez. Hoy el Khabur corre por la gobernación de Hasaka, en el nordeste de Siria, con su caudal muy reducido por las presas y el riego; cristianos asirios poblaron sus aldeas en los años treinta, y Tell Halaf, en el borde de Ras al-Ayn, fue excavada de nuevo desde 2006 hasta la guerra civil."
  pt:
    - "O Habor é o Khabur, o maior afluente do Eufrates na Síria. Nasce de grandes fontes perto de Ras al-Ayn, na fronteira turca, reúne os riachos da Jazira e corre para o sul pela estepe para se juntar ao Eufrates perto de Busayra, a antiga Circésio. Seu vale superior era o reino arameu de Bit-Bahiani, com capital em Gozã, o monte de Tell Halaf junto às fontes; a Assíria fez dele a província de Guzana em 808 a.C., e as margens do rio se alinharam de cidades e propriedades assírias, entre elas Dur-Katlimmu, hoje Tell Sheikh Hamad. Nos textos mesopotâmicos o rio é o Habur, e o “Habor, o rio de Gozã” da Bíblia significa o Habor, o rio da terra de Gozã."
    - "Aqui os assírios estabeleceram os exilados do reino do norte. Quando Samaria caiu em 722 a.C., o rei da Assíria “levou Israel cativo para a Assíria, e os colocou em Hala, e junto a Habor, o rio de Gozã, e nas cidades dos medos”, frase que Reis repete na história de Ezequias; e o cronista diz que Tiglate-Pileser já havia deportado as tribos de Rúben, Gade e meia Manassés a leste do Jordão “para Hala, Habor, Hara e para o rio Gozã”, onde permaneceram “até o dia de hoje”. Documentos assírios do século VII vindos de Guzana nomeiam alguns homens com nomes formados sobre o nome do Deus de Israel, que alguns tomam por descendentes dos exilados; além disso, as tribos perdidas não deixaram vestígio no Khabur."
    - "Max von Oppenheim escavou Tell Halaf em 1911–1913 e 1929 e achou o palácio dos reis arameus com suas estátuas e relevos de basalto, e o rio deu nome à cerâmica pintada do sexto milênio a.C. ali encontrada pela primeira vez. Hoje o Khabur corre pela província de Hasakah, no nordeste da Síria, com seu fluxo muito reduzido por represas e irrigação; cristãos assírios povoaram suas aldeias na década de 1930, e Tell Halaf, na orla de Ras al-Ayn, foi escavada de novo de 2006 até a guerra civil."
  de:
    - "Der Habor ist der Chabur, der größte Nebenfluss des Euphrat in Syrien. Er entspringt großen Quellen bei Ras al-Ain an der türkischen Grenze, sammelt die Bäche der Dschasira und fließt durch die Steppe nach Süden, um nahe Busaira, dem antiken Circesium, in den Euphrat zu münden. Sein oberes Tal war das aramäische Königreich Bit-Bahiani mit der Hauptstadt Gosan, dem Hügel Tell Halaf bei den Quellen; Assyrien machte es 808 v. Chr. zur Provinz Guzana, und an den Ufern des Flusses reihten sich assyrische Städte und Güter, darunter Dur-Katlimmu, heute Tell Scheich Hamad. In mesopotamischen Texten heißt der Fluss Habur, und die Wendung der Bibel „an den Habor, an das Wasser Gosan“ meint den Habur, den Fluss des Landes Gosan."
    - "Hier siedelten die Assyrer die Verbannten des Nordreichs an. Als Samaria 722 v. Chr. fiel, „führte“ der König von Assyrien „Israel weg nach Assyrien und setzte sie nach Halah und an den Habor, an das Wasser Gosan und in die Städte der Meder“, ein Satz, den die Königsbücher in der Hiskia-Geschichte wiederholen; und der Chronist sagt, Tiglat-Pileser habe schon die Stämme Ruben, Gad und den halben Stamm Manasse östlich des Jordan „gen Halah und an den Habor und gen Hara und an das Wasser Gosan“ gebracht, wo sie blieben „bis auf diesen Tag“. Assyrische Urkunden des 7. Jahrhunderts aus Guzana nennen einige Männer mit Namen, die auf den Namen von Israels Gott gebildet sind, die manche für Nachkommen der Verbannten halten; darüber hinaus haben die verlorenen Stämme am Chabur keine Spur hinterlassen."
    - "Max von Oppenheim grub 1911–1913 und 1929 in Tell Halaf und fand den Palast der aramäischen Könige mit seinen Basaltstatuen und Reliefs, und der Fluss gab der dort zuerst gefundenen bemalten Keramik des 6. Jahrtausends v. Chr. ihren Namen. Der Chabur fließt heute durch das Gouvernement Hasaka im Nordosten Syriens, seine Wassermenge durch Dämme und Bewässerung stark vermindert; assyrische Christen besiedelten seine Dörfer in den 1930er Jahren, und Tell Halaf am Rand von Ras al-Ain wurde von 2006 bis zum Bürgerkrieg erneut ausgegraben."
  fr:
    - "Le Chabor est le Khabour, le plus grand affluent de l’Euphrate en Syrie. Il naît de grandes sources près de Ras al-Ayn, à la frontière turque, recueille les cours d’eau de la Djézireh et coule vers le sud à travers la steppe pour rejoindre l’Euphrate près de Busayra, l’antique Circesium. Sa haute vallée était le royaume araméen de Bit-Bahiani, dont la capitale Gozan est le tertre de Tell Halaf près des sources ; l’Assyrie en fit la province de Guzana en 808 av. J.-C., et les rives du fleuve se couvrirent de villes et de domaines assyriens, dont Dur-Katlimmu, aujourd’hui Tell Sheikh Hamad. Dans les textes mésopotamiens, le fleuve est le Habur, et le « Chabor, fleuve de Gozan » de la Bible désigne le Chabor, le fleuve du pays de Gozan."
    - "C’est ici que les Assyriens établirent les exilés du royaume du nord. Quand Samarie tomba en 722 av. J.-C., le roi d’Assyrie « emmena Israël captif en Assyrie. Il les fit habiter à Chalach, et sur le Chabor, fleuve de Gozan, et dans les villes des Mèdes », phrase que les Rois répètent dans l’histoire d’Ézéchias ; et le Chroniqueur dit que Tiglath-Piléser avait déjà déporté les tribus de Ruben, de Gad et la demi-tribu de Manassé, à l’est du Jourdain, « à Chalach, à Chabor, à Hara, et au fleuve de Gozan, où ils sont demeurés jusqu’à ce jour ». Des documents assyriens du VIIe siècle venus de Guzana nomment quelques hommes dont les noms sont formés sur celui du Dieu d’Israël, que certains prennent pour des descendants des exilés ; au-delà, les tribus perdues n’ont laissé aucune trace sur le Khabour."
    - "Max von Oppenheim fouilla Tell Halaf en 1911–1913 et en 1929 et y trouva le palais des rois araméens avec ses statues et ses reliefs de basalte, et le fleuve donna son nom à la poterie peinte du VIe millénaire av. J.-C. qui y fut d’abord découverte. Le Khabour traverse aujourd’hui le gouvernorat de Hassaké, dans le nord-est de la Syrie, son débit très réduit par les barrages et l’irrigation ; des chrétiens assyriens peuplèrent ses villages dans les années 1930, et Tell Halaf, en lisière de Ras al-Ayn, fut fouillé de nouveau de 2006 jusqu’à la guerre civile."
