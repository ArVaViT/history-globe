body:
  en:
    - "The Habor is the Khabur, the largest tributary of the Euphrates in Syria. It rises from great springs near Ras al-Ayn on the Turkish border, gathers the streams of the Jazira and flows south through steppe to join the Euphrates near Busayra, the ancient Circesium. Its upper valley was the Aramean kingdom of Bit-Bahiani with its capital Gozan, the mound of Tell Halaf beside the springs; Assyria made it the province of Guzana in 808 BC, and the river's banks were lined with Assyrian towns and estates, among them Dur-Katlimmu, now Tell Sheikh Hamad. In Mesopotamian texts the river is the Habur, and the Bible's “Habor by the river of Gozan” means the Habor, the river of the land of Gozan."
    - "Here the Assyrians settled the exiles of the northern kingdom. When Samaria fell in 722 BC the king of Assyria “carried Israel away into Assyria, and placed them in Halah and in Habor by the river of Gozan, and in the cities of the Medes”, a sentence Kings repeats in the story of Hezekiah; and the Chronicler says that Tiglath-pileser had already deported the tribes of Reuben, Gad and half Manasseh east of the Jordan “unto Halah, and Habor, and Hara, and to the river Gozan”, where they remained “unto this day”. Assyrian documents from Guzana name a few men with names formed on the name of Israel's God, which some take for descendants of the exiles; beyond that the lost tribes left no trace on the Khabur."
    - "Max von Oppenheim excavated Tell Halaf in 1911–1913 and 1929 and found the palace of the Aramean kings with its basalt statues and reliefs, and the river gave its name to the painted pottery of the sixth millennium BC first found there. The Khabur today runs through the Hasakah governorate of north-eastern Syria, its flow much reduced by dams and irrigation; Assyrian Christians settled its villages in the 1930s, and Tell Halaf, on the edge of Ras al-Ayn, was excavated again from 2006 until the civil war."
  ru:
    - "Хавор — это Хабур, самый большой приток Евфрата в Сирии. Он начинается из больших источников у Рас-эль-Айна на турецкой границе, собирает потоки Джазиры и течёт на юг через степь, впадая в Евфрат у Бусайры, древнего Киркесия. В его верхней долине лежало арамейское царство Бит-Бахиани со столицей Гозан, холм Телль-Халаф у источников; Ассирия сделала его провинцией Гузана в 808 г. до н. э., и берега реки были усеяны ассирийскими городами и поместьями, среди них Дур-Катлимму, нынешний Телль-Шейх-Хамад. В месопотамских текстах река зовётся Хабур, а библейское «в Хаворе, при реке Гозан» означает Хавор, реку земли Гозан."
    - "Здесь ассирийцы поселили изгнанников северного царства. Когда в 722 г. до н. э. пала Самария, царь Ассирийский «переселил Израильтян в Ассирию, и поселил их в Халахе и в Хаворе, при реке Гозан, и в городах Мидийских», и книга Царств повторяет эту фразу в рассказе о Езекии; а летописец говорит, что Феглафелласар ещё раньше увёл колена Рувима, Гада и половину Манассии из-за Иордана «в Халах, и Хавор, и Ару, и на реку Гозан», где они оставались до сего дня. Ассирийские документы из Гузаны называют нескольких людей с именами, образованными от имени Бога Израилева, в которых некоторые видят потомков изгнанников; кроме этого потерянные колена не оставили на Хабуре следа."
    - "Макс фон Оппенгейм раскапывал Телль-Халаф в 1911–1913 и 1929 годах и нашёл дворец арамейских царей с базальтовыми статуями и рельефами, а река дала имя расписной керамике шестого тысячелетия до н. э., впервые найденной там. Хабур сегодня течёт через провинцию Хасеке на северо-востоке Сирии, и его сток сильно сократили плотины и орошение; в 1930-х годах его деревни заселили ассирийцы-христиане, а Телль-Халаф на окраине Рас-эль-Айна снова раскапывали с 2006 года до гражданской войны."
  uk:
    - "Хавор — це Хабур, найбільша притока Євфрату в Сирії. Він бере початок із великих джерел поблизу Рас-ель-Айна на турецькому кордоні, збирає потоки Джазіри й тече на південь степом, щоб злитися з Євфратом поблизу Бусайри, давнього Кіркесія. Його верхня долина була арамейським царством Бит-Бахіані зі столицею Гозан, городищем Телль-Халаф біля джерел; Ассирія зробила її провінцією Гузана 808 р. до н. е., і береги річки були вкриті ассирійськими містами й маєтками, серед них Дур-Катліму, нині Телль-Шейх-Хамад. У месопотамських текстах річка зветься Хабур, а біблійний «Хавор при ріцї Гозан» означає Хабур, річку краю Гозан."
    - "Тут ассирійці оселили вигнанців північного царства. Коли 722 р. до н. е. упала Самарія, цар Ассирії «одвів Ізрайлитян полонянами в Ассирию й поселив їх в Халасї й в Хаборі, при ріцї Гозан, та по Мидийських городах» — речення, яке Книги Царів повторюють в оповіді про Єзекію; а літописець каже, що Тіглатпаласар уже вивів племена Рувима, Гада й половини Манасії зі сходу від Йордану «в Халах і Хавір, і Ару, й на ріку Гозан, — де вони й до сього часу». Ассирійські документи з Гузани називають кількох людей з іменами, утвореними від імені Бога Ізраїлю, які дехто вважає нащадками вигнанців; понад те, загублені коліна не залишили на Хабурі жодного сліду."
    - "Макс фон Оппенгайм розкопував Телль-Халаф у 1911–1913 і 1929 роках і знайшов палац арамейських царів з базальтовими статуями та рельєфами, а річка дала назву мальованій кераміці VI тисячоліття до н. е., уперше знайденій там. Нині Хабур тече через губернаторство Хасеке на північному сході Сирії, його стік сильно зменшений греблями й зрошенням; ассирійські християни заселили його села в 1930-х роках, а Телль-Халаф, на краю Рас-ель-Айна, розкопували знову з 2006 року до громадянської війни."
  es:
    - "El Habor es el Khabur, el mayor afluente del Éufrates en Siria. Nace de grandes manantiales cerca de Ras al-Ayn, en la frontera turca, recoge los arroyos de la Yazira y fluye hacia el sur por la estepa hasta unirse al Éufrates cerca de Busayra, la antigua Circesio. Su valle alto fue el reino arameo de Bit-Bahiani, con su capital Gozán, el montículo de Tell Halaf junto a los manantiales; Asiria lo convirtió en la provincia de Guzana en el 808 a. C., y las orillas del río se llenaron de ciudades y fincas asirias, entre ellas Dur-Katlimmu, hoy Tell Sheikh Hamad. En los textos mesopotámicos el río es el Habur, y el «Habor, junto al río de Gozán» de la Biblia significa el Habor, el río de la tierra de Gozán."
    - "Aquí los asirios establecieron a los desterrados del reino del norte. Cuando Samaria cayó en el 722 a. C., el rey de Asiria «trasportó á Israel á Asiria, y púsolos en Hala, y en Habor, junto al río de Gozán, y en las ciudades de los Medos», frase que Reyes repite en la historia de Ezequías; y el Cronista dice que Tiglat-pileser había deportado ya a las tribus de Rubén, Gad y media de Manasés, al este del Jordán, «á Halad, y á Habor y á Ara, y al río de Gozán», donde permanecieron «hasta hoy». Documentos asirios procedentes de Guzana nombran a unos pocos hombres con nombres formados sobre el nombre del Dios de Israel, que algunos toman por descendientes de los desterrados; fuera de eso, las tribus perdidas no dejaron rastro en el Khabur."
    - "Max von Oppenheim excavó Tell Halaf en 1911–1913 y 1929 y halló el palacio de los reyes arameos con sus estatuas y relieves de basalto, y el río dio nombre a la cerámica pintada del sexto milenio a. C. hallada allí por primera vez. Hoy el Khabur corre por la gobernación de Hasaka, en el nordeste de Siria, con su caudal muy reducido por las presas y el riego; cristianos asirios poblaron sus aldeas en los años treinta, y Tell Halaf, en el borde de Ras al-Ayn, fue excavada de nuevo desde 2006 hasta la guerra civil."
  pt:
    - "O Habor é o Khabur, o maior afluente do Eufrates na Síria. Nasce de grandes fontes perto de Ras al-Ayn, na fronteira turca, reúne os riachos da Jazira e corre para o sul pela estepe para se juntar ao Eufrates perto de Busayra, a antiga Circésio. Seu vale superior era o reino arameu de Bit-Bahiani, com capital em Gozã, o monte de Tell Halaf junto às fontes; a Assíria fez dele a província de Guzana em 808 a.C., e as margens do rio se alinharam de cidades e propriedades assírias, entre elas Dur-Katlimmu, hoje Tell Sheikh Hamad. Nos textos mesopotâmicos o rio é o Habur, e o “Habor, o rio de Gozã” da Bíblia significa o Habor, o rio da terra de Gozã."
    - "Aqui os assírios estabeleceram os exilados do reino do norte. Quando Samaria caiu em 722 a.C., o rei da Assíria “levou Israel cativo para a Assíria, e os colocou em Hala, e junto a Habor, o rio de Gozã, e nas cidades dos medos”, frase que Reis repete na história de Ezequias; e o cronista diz que Tiglate-Pileser já havia deportado as tribos de Rúben, Gade e meia Manassés a leste do Jordão “para Hala, Habor, Hara e para o rio Gozã”, onde permaneceram “até o dia de hoje”. Documentos assírios vindos de Guzana nomeiam alguns homens com nomes formados sobre o nome do Deus de Israel, que alguns tomam por descendentes dos exilados; além disso, as tribos perdidas não deixaram vestígio no Khabur."
    - "Max von Oppenheim escavou Tell Halaf em 1911–1913 e 1929 e achou o palácio dos reis arameus com suas estátuas e relevos de basalto, e o rio deu nome à cerâmica pintada do sexto milênio a.C. ali encontrada pela primeira vez. Hoje o Khabur corre pela província de Hasakah, no nordeste da Síria, com seu fluxo muito reduzido por represas e irrigação; cristãos assírios povoaram suas aldeias na década de 1930, e Tell Halaf, na orla de Ras al-Ayn, foi escavada de novo de 2006 até a guerra civil."
  de:
    - "Der Habor ist der Chabur, der größte Nebenfluss des Euphrat in Syrien. Er entspringt großen Quellen bei Ras al-Ain an der türkischen Grenze, sammelt die Bäche der Dschasira und fließt durch die Steppe nach Süden, um nahe Busaira, dem antiken Circesium, in den Euphrat zu münden. Sein oberes Tal war das aramäische Königreich Bit-Bahiani mit der Hauptstadt Gosan, dem Hügel Tell Halaf bei den Quellen; Assyrien machte es 808 v. Chr. zur Provinz Guzana, und an den Ufern des Flusses reihten sich assyrische Städte und Güter, darunter Dur-Katlimmu, heute Tell Scheich Hamad. In mesopotamischen Texten heißt der Fluss Habur, und die Wendung der Bibel „an den Habor, an das Wasser Gosan“ meint den Habur, den Fluss des Landes Gosan."
    - "Hier siedelten die Assyrer die Verbannten des Nordreichs an. Als Samaria 722 v. Chr. fiel, „führte“ der König von Assyrien „Israel weg nach Assyrien und setzte sie nach Halah und an den Habor, an das Wasser Gosan und in die Städte der Meder“, ein Satz, den die Königsbücher in der Hiskia-Geschichte wiederholen; und der Chronist sagt, Tiglat-Pileser habe schon die Stämme Ruben, Gad und den halben Stamm Manasse östlich des Jordan „gen Halah und an den Habor und gen Hara und an das Wasser Gosan“ gebracht, wo sie blieben „bis auf diesen Tag“. Assyrische Urkunden aus Guzana nennen einige Männer mit Namen, die auf den Namen von Israels Gott gebildet sind, die manche für Nachkommen der Verbannten halten; darüber hinaus haben die verlorenen Stämme am Chabur keine Spur hinterlassen."
    - "Max von Oppenheim grub 1911–1913 und 1929 in Tell Halaf und fand den Palast der aramäischen Könige mit seinen Basaltstatuen und Reliefs, und der Fluss gab der dort zuerst gefundenen bemalten Keramik des 6. Jahrtausends v. Chr. ihren Namen. Der Chabur fließt heute durch das Gouvernement Hasaka im Nordosten Syriens, seine Wassermenge durch Dämme und Bewässerung stark vermindert; assyrische Christen besiedelten seine Dörfer in den 1930er Jahren, und Tell Halaf am Rand von Ras al-Ain wurde von 2006 bis zum Bürgerkrieg erneut ausgegraben."
  fr:
    - "Le Chabor est le Khabour, le plus grand affluent de l’Euphrate en Syrie. Il naît de grandes sources près de Ras al-Ayn, à la frontière turque, recueille les cours d’eau de la Djézireh et coule vers le sud à travers la steppe pour rejoindre l’Euphrate près de Busayra, l’antique Circesium. Sa haute vallée était le royaume araméen de Bit-Bahiani, dont la capitale Gozan est le tertre de Tell Halaf près des sources ; l’Assyrie en fit la province de Guzana en 808 av. J.-C., et les rives du fleuve se couvrirent de villes et de domaines assyriens, dont Dur-Katlimmu, aujourd’hui Tell Sheikh Hamad. Dans les textes mésopotamiens, le fleuve est le Habur, et le « Chabor, fleuve de Gozan » de la Bible désigne le Chabor, le fleuve du pays de Gozan."
    - "C’est ici que les Assyriens établirent les exilés du royaume du nord. Quand Samarie tomba en 722 av. J.-C., le roi d’Assyrie « emmena Israël captif en Assyrie. Il les fit habiter à Chalach, et sur le Chabor, fleuve de Gozan, et dans les villes des Mèdes », phrase que les Rois répètent dans l’histoire d’Ézéchias ; et le Chroniqueur dit que Tiglath-Piléser avait déjà déporté les tribus de Ruben, de Gad et la demi-tribu de Manassé, à l’est du Jourdain, « à Chalach, à Chabor, à Hara, et au fleuve de Gozan, où ils sont demeurés jusqu’à ce jour ». Des documents assyriens venus de Guzana nomment quelques hommes dont les noms sont formés sur celui du Dieu d’Israël, que certains prennent pour des descendants des exilés ; au-delà, les tribus perdues n’ont laissé aucune trace sur le Khabour."
    - "Max von Oppenheim fouilla Tell Halaf en 1911–1913 et en 1929 et y trouva le palais des rois araméens avec ses statues et ses reliefs de basalte, et le fleuve donna son nom à la poterie peinte du VIe millénaire av. J.-C. qui y fut d’abord découverte. Le Khabour traverse aujourd’hui le gouvernorat de Hassaké, dans le nord-est de la Syrie, son débit très réduit par les barrages et l’irrigation ; des chrétiens assyriens peuplèrent ses villages dans les années 1930, et Tell Halaf, en lisière de Ras al-Ayn, fut fouillé de nouveau de 2006 jusqu’à la guerre civile."
  pl:
    - "Chabur to rzeka Chabur, największy dopływ Eufratu w Syrii. Wypływa z wielkich źródeł koło Ras al-Ajn na granicy tureckiej, zbiera strumienie Dżaziry i płynie na południe przez step, by wpaść do Eufratu koło Busajry, starożytnego Kirkesion. Jej górna dolina była aramejskim królestwem Bit-Bahiani ze stolicą Gozan, pagórkiem Tell Halaf przy źródłach; Asyria uczyniła ją prowincją Guzana w 808 r. p.n.e., a brzegi rzeki pokrywały asyryjskie miasta i posiadłości, wśród nich Dur-Katlimmu, dziś Tell Szajch Hamad. W tekstach mezopotamskich rzeka to Habur, a biblijny „Habor nad rzeką Gozan” oznacza Chabur, rzekę ziemi Gozan."
    - "Tu Asyryjczycy osiedlili wygnańców z królestwa północnego. Gdy w 722 r. p.n.e. padła Samaria, król Asyrii „przeniósł Izraela do Assyryi, a osadził je w Hala i w Habor nad rzeką Gozan i w miastach Medskich”, zdanie, które Księgi Królewskie powtarzają w opowieści o Ezechiaszu; a Kronikarz mówi, że Tiglat-Pileser już wcześniej wywiózł pokolenia Rubena, Gada i połowę Manassesa ze wschodu od Jordanu „do Hela, i Haboru, i do Ara, i do rzeki Gozan”, gdzie pozostali „aż do dnia tego”. Asyryjskie dokumenty z Guzany wymieniają kilku ludzi z imionami utworzonymi od imienia Boga Izraela, w których niektórzy widzą potomków wygnańców; poza tym zaginione pokolenia nie zostawiły śladu nad Chaburem."
    - "Max von Oppenheim prowadził wykopaliska w Tell Halaf w latach 1911–1913 i 1929 i znalazł pałac aramejskich królów z bazaltowymi posągami i reliefami, a rzeka dała nazwę malowanej ceramice VI tysiąclecia p.n.e., znalezionej tam po raz pierwszy. Chabur płynie dziś przez muhafazę Hasaka w północno-wschodniej Syrii, a jego przepływ mocno zmniejszyły tamy i nawadnianie; asyryjscy chrześcijanie zasiedlili jego wsie w latach trzydziestych XX w., a Tell Halaf, na skraju Ras al-Ajn, badano ponownie od 2006 r. do wojny domowej."
  it:
    - "Il Cabor è il Khabur, il maggiore affluente dell’Eufrate in Siria. Nasce da grandi sorgenti presso Ras al-Ayn al confine turco, raccoglie i corsi d’acqua della Jazira e scorre verso sud attraverso la steppa per unirsi all’Eufrate presso Busayra, l’antica Circesio. La sua valle superiore era il regno aramaico di Bit-Bahiani con capitale Gozan, il tell di Tell Halaf accanto alle sorgenti; l’Assiria ne fece la provincia di Guzana nell’808 a.C., e le rive del fiume furono costellate di città e tenute assire, fra cui Dur-Katlimmu, oggi Tell Sheikh Hamad. Nei testi mesopotamici il fiume è lo Habur, e lo «Habor, fiume di Gozan» della Bibbia significa il Cabor, il fiume del paese di Gozan."
    - "Qui gli Assiri stabilirono gli esuli del regno del nord. Quando Samaria cadde nel 722 a.C., il re d’Assiria «trasportò gl’Israeliti in Assiria e li collocò in Halah, e sullo Habor, fiume di Gozan, e nelle città dei Medi», frase che i Re ripetono nella storia di Ezechia; e il Cronista dice che Tiglat-Pilèser aveva già deportato le tribù di Ruben, di Gad e metà di Manasse a est del Giordano «a Halah, ad Habor, ad Hara e presso al fiume di Gozan», dove «son rimasti fino al dì d’oggi». Documenti assiri da Guzana nominano alcuni uomini con nomi formati sul nome del Dio d’Israele, che alcuni ritengono discendenti degli esuli; oltre a ciò le tribù perdute non lasciarono traccia sul Khabur."
    - "Max von Oppenheim scavò Tell Halaf nel 1911–1913 e nel 1929 e trovò il palazzo dei re aramei con le sue statue e i rilievi di basalto, e il sito diede il nome alla ceramica dipinta del VI millennio a.C. qui trovata per la prima volta. Il Khabur oggi attraversa il governatorato di Hasaka nella Siria nord-orientale, con una portata molto ridotta da dighe e irrigazione; cristiani assiri ne popolarono i villaggi negli anni Trenta, e Tell Halaf, ai margini di Ras al-Ayn, fu scavato di nuovo dal 2006 fino alla guerra civile."
  nl:
    - "De Chabor is de Khabur, de grootste zijrivier van de Eufraat in Syrië. Hij ontspringt aan grote bronnen bij Ras al-Ayn aan de Turkse grens, verzamelt de stromen van de Jazira en loopt zuidwaarts door de steppe om bij Busayra, het oude Circesium, in de Eufraat uit te monden. Zijn bovendal was het Aramese koninkrijk Bit-Bahiani met als hoofdstad Gozan, de heuvel Tell Halaf bij de bronnen; Assyrië maakte er in 808 v.Chr. de provincie Guzana van, en de oevers van de rivier lagen vol Assyrische steden en landgoederen, onder meer Dur-Katlimmu, nu Tell Sheikh Hamad. In Mesopotamische teksten heet de rivier de Habur, en de “Habor aan de rivier Gozan” van de Bijbel is de Chabor, de rivier van het land Gozan."
    - "Hier vestigden de Assyriërs de ballingen van het noordelijke koninkrijk. Toen Samaria in 722 v.Chr. viel, voerde de koning van Assyrië “Israel weg in Assyrie, en deed ze wonen in Halah, en in Habor, aan de rivier Gozan, en in de steden der Meden”, een zin die Koningen herhaalt in het verhaal van Chizkia; en de kroniekschrijver zegt dat Tiglat-Pileser de stammen Ruben, Gad en de halve Manasse ten oosten van de Jordaan al had weggevoerd naar “Halah, en Habor, en Hara, en aan de rivier Gozan”, waar zij bleven “tot op dezen dag”. Assyrische documenten uit Guzana noemen enkele mannen met namen gevormd op de naam van Israëls God, die sommigen voor nakomelingen van de ballingen houden; verder lieten de verloren stammen geen spoor op de Khabur na."
    - "Max von Oppenheim groef Tell Halaf op in 1911–1913 en 1929 en vond het paleis van de Aramese koningen met zijn basaltbeelden en reliëfs, en de rivier gaf haar naam aan het beschilderde aardewerk van het 6e millennium v.Chr. dat daar het eerst werd gevonden. De Khabur stroomt nu door het gouvernement Hasakah in het noordoosten van Syrië, met een sterk verminderde afvoer door dammen en irrigatie; Assyrische christenen vestigden zich in de jaren dertig in zijn dorpen, en Tell Halaf, aan de rand van Ras al-Ayn, werd van 2006 tot de burgeroorlog opnieuw opgegraven."
  cs:
    - "Chabór je Chábúr, největší přítok Eufratu v Sýrii. Pramení z velkých zdrojů poblíž Rás al-'Ajn na turecké hranici, sbírá potoky Džazíry a teče na jih stepí, aby se u Busajry, starověkého Kirkesia, vlil do Eufratu. Jeho horní údolí bylo aramejským královstvím Bít-Bachiáni s hlavním městem Gózan, pahorkem Tell Halaf u pramenů; Asýrie z něj roku 808 př. n. l. učinila provincii Guzanu a břehy řeky lemovala asyrská města a statky, mezi nimi Dúr-Katlimmu, dnes Tell Sheikh Hamad. V mezopotámských textech je řeka Habur a biblický „Chabor při řece Gozan“ znamená Chabór, řeku země Gózan."
    - "Zde Asyřané usadili vyhnance severního království. Když roku 722 př. n. l. padlo Samaří, král asyrský „přenesl Izraele do Assyrie, a osadil je v Chelach a v Chabor při řece Gozan, a v městech Médských“, věta, kterou Královská opakují v příběhu o Chizkijášovi; a kronikář praví, že Tiglatpilesar již dříve odvedl kmeny Rúbenův, Gádův a polovinu Manasesova z území východně od Jordánu „do Chelach a do Chabor, až do Hara a k řece Gozan“, kde zůstali „až do dnešního dne“. Asyrské dokumenty z Guzany jmenují několik mužů se jmény utvořenými z jména Boha Izraele, které někteří pokládají za potomky vyhnanců; jinak ztracené kmeny na Chábúru nezanechaly stopu."
    - "Max von Oppenheim vykopával Tell Halaf v letech 1911–1913 a 1929 a nalezl palác aramejských králů s čedičovými sochami a reliéfy a řeka dala jméno malované keramice 6. tisíciletí př. n. l., poprvé tam nalezené. Chábúr dnes protéká gubernií Hasaka v severovýchodní Sýrii, jeho průtok je silně snížen přehradami a zavlažováním; asyrští křesťané osídlili jeho vesnice ve 30. letech 20. století a Tell Halaf na okraji Rás al-'Ajn byl znovu vykopáván od roku 2006 do občanské války."
  sv:
    - "Habor är Khabur, den största bifloden till Eufrat i Syrien. Den rinner upp ur stora källor nära Ras al-Ayn vid turkiska gränsen, samlar bäckarna i Jazira och flyter söderut genom stäppen för att förena sig med Eufrat nära Busayra, forntidens Kirkesion. Dess övre dal var det arameiska kungariket Bit-Bahiani med huvudstad Gosan, kullen Tell Halaf vid källorna; Assyrien gjorde den till provinsen Guzana år 808 f.Kr., och flodens stränder kantades av assyriska städer och gods, bland dem Dur-Katlimmu, nu Tell Sheikh Hamad. I mesopotamiska texter heter floden Habur, och Bibelns ”Habor – en ström i Gosan” betyder Habor, floden i landet Gosan."
    - "Här bosatte assyrierna det norra rikets landsflyktiga. När Samaria föll år 722 f.Kr. ”förde” Assyriens kung ”Israel bort till Assyrien och lät dem bo i Hala och vid Habor – en ström i Gosan – och i Mediens städer”, en mening som Kungaboken upprepar i berättelsen om Hiskia; och krönikeskrivaren säger att Tiglat-Pileser redan hade fört rubeniterna, gaditerna och halva Manasse öster om Jordan bort ”till Hala, Habor, Hara och Gosans ström, där de äro ännu i dag”. Assyriska dokument från Guzana nämner några män med namn bildade på Israels Guds namn, vilka somliga tar för de landsflyktigas ättlingar; utöver det lämnade de förlorade stammarna inga spår vid Khabur."
    - "Max von Oppenheim grävde i Tell Halaf 1911–1913 och 1929 och fann de arameiska kungarnas palats med dess basaltstatyer och reliefer, och floden gav namn åt den målade keramiken från sjätte årtusendet f.Kr. som först hittades där. Khabur rinner i dag genom guvernementet Hasakah i nordöstra Syrien, dess flöde kraftigt minskat av dammar och bevattning; assyriska kristna bosatte sig i dess byar på 1930-talet, och Tell Halaf, i utkanten av Ras al-Ayn, grävdes åter ut från 2006 till inbördeskriget."
  nb:
    - "Habor er Khabur, den største sideelven til Eufrat i Syria. Den springer ut av store kilder nær Ras al-Ayn ved den tyrkiske grensen, samler bekkene i Jazira og renner sørover gjennom steppe for å møte Eufrat nær Busayra, det gamle Circesium. Dens øvre dal var det arameiske kongedømmet Bit-Bahiani med hovedstaden Gosan, haugen Tell Halaf ved kildene; Assyria gjorde det til provinsen Guzana i 808 f.Kr., og elvebreddene var kantet av assyriske byer og gods, blant dem Dur-Katlimmu, nå Tell Sheikh Hamad. I mesopotamiske tekster er elven Habur, og Bibelens «Habor, en elv i Gosan» betyr Habor, elven i landet Gosan."
    - "Her bosatte assyrerne de bortførte fra nordriket. Da Samaria falt i 722 f.Kr., «bortførte» kongen av Assyria «Israel til Assyria; og han lot dem bo i Halah og ved Habor, en elv i Gosan, og i Medias byer», en setning Kongebøkene gjentar i fortellingen om Hiskia; og kronikeren sier at Tiglat-Pileser allerede hadde bortført stammene Ruben, Gad og halve Manasse øst for Jordan og «flyttet dem til Halah og Habor og Hara og Gosan-elven, og der er de den dag idag». Assyriske dokumenter fra Guzana nevner noen få menn med navn dannet av navnet på Israels Gud, som noen tar for etterkommere av de bortførte; utover det etterlot de tapte stammene ingen spor ved Khabur."
    - "Max von Oppenheim gravde ut Tell Halaf i 1911–1913 og 1929 og fant palasset til de arameiske kongene med dets basaltstatuer og relieffer, og elven ga navn til den malte keramikken fra det sjette årtusen f.Kr. som først ble funnet der. Khabur renner i dag gjennom guvernementet Hasakah i nordøstlige Syria, med sterkt redusert vannføring på grunn av demninger og vanning; assyriske kristne bosatte dens landsbyer i 1930-årene, og Tell Halaf, i utkanten av Ras al-Ayn, ble gravd ut på nytt fra 2006 til borgerkrigen."
  tl:
    - "Ang Habor ay ang Khabur, ang pinakamalaking sanga ng Eufrates sa Siria. Nagmumula ito sa malalaking bukal malapit sa Ras al-Ayn sa hangganan ng Turkey, tinitipon ang mga batis ng Jazira, at tumutuloy sa timog sa mga damuhan hanggang sumanib sa Eufrates malapit sa Busayra, ang sinaunang Circesium. Ang itaas na libis nito ay ang kahariang Arameo ng Bit-Bahiani na may kabisera sa Gozan, ang burol ng Tell Halaf sa tabi ng mga bukal; ginawa itong lalawigan ng Guzana ng Asiria noong 808 BK, at ang mga pampang ng ilog ay napuno ng mga bayan at lupain ng mga Asirio, kabilang ang Dur-Katlimmu, na ngayon ay Tell Sheikh Hamad. Sa mga tekstong Mesopotamiano, Habur ang ilog, at ang “Habor, sa ilog ng Gozan” ng Biblia ay nangangahulugang ang Habor, ang ilog ng lupain ng Gozan."
    - "Dito pinatira ng mga Asirio ang mga itinapon mula sa hilagang kaharian. Nang sakupin ng hari ng Asiria ang Samaria noong 722 BK, “dinala ang Israel sa Asiria, at inilagay sila sa Hala, at sa Habor, sa ilog ng Gozan, at sa mga bayan ng mga Medo”, isang pangungusap na inuulit ng Mga Hari sa salaysay tungkol kay Ezechias; at sinasabi ng may-akda ng Mga Cronica na si Tiglath-pileser ay nauna nang nagpatapon sa mga lipi ni Ruben, Gad at kalahati ng Manases sa silangan ng Jordan “hanggang sa Hala, at sa Habor, at sa Hara, at sa ilog ng Gozan”, kung saan sila nanatili “hanggang sa araw na ito”. Ang mga dokumentong Asirio mula sa Guzana ay may pangalan ng ilang lalaki na hinango sa pangalan ng Diyos ng Israel, na itinuturing ng ilan na mga inapo ng mga itinapon; maliban dito, walang iniwang bakas ang mga nawalang lipi sa Khabur."
    - "Hinukay ni Max von Oppenheim ang Tell Halaf noong 1911–1913 at 1929 at natagpuan ang palasyo ng mga haring Arameo na may mga estatwa at relyebe ng basalto, at ang ilog ang nagbigay ng pangalan sa pininturahang palayok ng ika-6 na milenyo BK na unang natagpuan doon. Ang Khabur ngayon ay dumadaloy sa lalawigan ng Hasakah sa hilagang-silangan ng Siria, at lubhang nabawasan ang daloy nito dahil sa mga dam at patubig; tinirhan ng mga Kristiyanong Asirio ang mga nayon nito noong dekada 1930, at ang Tell Halaf, sa gilid ng Ras al-Ayn, ay muling hinukay mula 2006 hanggang sa digmaang sibil."
  da:
    - "Habor er Khabur, den største biflod til Eufrat i Syrien. Den udspringer fra store kilder nær Ras al-Ayn ved den tyrkiske grænse, samler Jaziras vandløb og flyder mod syd gennem steppe for at slutte sig til Eufrat nær Busayra, det gamle Circesium. Dens øvre dal var det aramæiske kongerige Bit-Bahiani med hovedstaden Gozan, højen Tell Halaf ved kilderne; Assyrien gjorde det til provinsen Guzana i 808 f.Kr., og flodens bredder var kantet med assyriske byer og godser, blandt dem Dur-Katlimmu, nu Tell Sheikh Hamad. I mesopotamiske tekster er floden Habur, og Bibelens »Habor ved Floden Gosan« betyder Habor, floden i landet Gozan."
    - "Her bosatte assyrerne det nordlige riges landflygtige. Da Samaria faldt i 722 f.Kr., indtog Assyriens konge byen og »førte Israel bort til Assyrien; og han lod dem bo i Hala og i Habor ved Floden Gosan og i Medernes Stæder«, en sætning Kongebøgerne gentager i beretningen om Hizkija; og Krønikeskriveren siger, at Tiglat-Pileser allerede havde bortført Rubens, Gads og halve Manasses stammer øst for Jordan »til Hala og Habor og Hara og til Floden Gosan«, hvor de blev »indtil denne Dag«. Assyriske dokumenter fra Guzana nævner nogle få mænd med navne dannet af navnet på Israels Gud, som nogle regner for efterkommere af de landflygtige; ud over det efterlod de tabte stammer intet spor ved Khabur."
    - "Max von Oppenheim udgravede Tell Halaf i 1911–1913 og 1929 og fandt de aramæiske kongers palads med dets basaltstatuer og relieffer, og floden gav navn til den malede keramik fra 6. årtusinde f.Kr., som først blev fundet dér. Khabur løber i dag gennem Hasakah-guvernementet i det nordøstlige Syrien, dens vandføring stærkt formindsket af dæmninger og kunstvanding; assyriske kristne bosatte dens landsbyer i 1930'erne, og Tell Halaf, i udkanten af Ras al-Ayn, blev udgravet igen fra 2006 til borgerkrigen."
  sr:
    - "Хавор је Хабур, највећа притока Еуфрата у Сирији. Извире из великих извора близу Рас ел-Аина на турској граници, скупља потоке Џезире и тече на југ кроз степу да се улије у Еуфрат близу Бусајре, древног Киркесијума. Његова горња долина била је арамејско краљевство Бит-Бахијани с престоницом Гозаном, хумком Тел Халаф поред извора; Асирија је од њега 808. п. н. е. направила покрајину Гузану, а обале реке биле су испуњене асирским градовима и имањима, међу њима Дур-Катлиму, данас Тел Шејх Хамад. У месопотамским текстовима река је Хабур, а библијско „у Авору на води Гозану“ значи Хабур, реку земље Гозан."
    - "Овде су Асирци населили изгнанике северног краљевства. Кад је Самарија пала 722. п. н. е., асирски цар „одведе Израиља у Асирију и насели у Алају и у Авору на води Гозану и у градовима мидским“, реченица коју Цареви понављају у причи о Језекији; а Летописац каже да је Теглат-Феласар већ био преселио племена Рувимово, Гадово и половину Манасијиног источно од Јордана „у Алу и у Авор и у Ару, и на реку Гозан“, где су остали „до данас“. Асирски документи из Гузане именују неколико људи с именима грађеним на име Израиљевог Бога, које неки узимају за потомке изгнаника; осим тога изгубљена племена нису оставила трага на Хабуру."
    - "Макс фон Опенхајм ископавао је Тел Халаф 1911–1913. и 1929. и нашао палату арамејских царева с базалтним статуама и рељефима, а река је дала име осликаној керамици шестог миленијума п. н. е. први пут пронађеној тамо. Хабур данас тече кроз гувернорат Хасака у североисточној Сирији, а његов ток је много смањен бранама и наводњавањем; асирски хришћани населили су његова села тридесетих година 20. века, а Тел Халаф, на ободу Рас ел-Аина, поново је ископаван од 2006. до грађанског рата."
