body:
  en:
    - 'Macedonia is the land north of Greece around the Thermaic Gulf and the lower Axios (Vardar), Strymon and Nestos, ringed by mountains, with the old royal seat at Aegae (Vergina) and the later capital at Pella. The Macedonians spoke a Greek dialect and worshipped the Greek gods, though southern Greeks often counted them as half-barbarian. Philip II (359–336 BC) united them, took the gold mines of Mount Pangaeum and founded Philippi, and at Chaeronea in 338 made himself master of Greece. His son Alexander crossed into Asia in 334 and in a decade overthrew the Persian empire; the rough goat of Daniel, whose "great horn" is "the first king" of Greece, is read as a figure of him, and the first book of Maccabees opens with Alexander of Macedon.'
    - "After Alexander's death his generals fought over the kingdom; the Antigonids held Macedonia from 276 BC until Rome defeated Philip V at Cynoscephalae in 197 and his son Perseus at Pydna in 168 BC. The Romans first split the land into four republics and in 146 BC, after the revolt of Andriscus, made it the province of Macedonia with its seat at Thessalonica. The Via Egnatia, built soon after, ran from the Adriatic through Thessalonica and Philippi eastward to Cypsela on the Hebrus in Thrace. In 42 BC Antony and Octavian defeated Brutus and Cassius at Philippi, and in 27 BC Augustus made Macedonia a senatorial province under a proconsul."
    - 'At Troas Paul saw in the night "a man of Macedonia" who prayed him, "Come over into Macedonia, and help us", and he sailed with Silas and Timothy, and, by tradition, Luke, to Neapolis, about AD 49 or 50. At Philippi Lydia believed and the jailer was baptised; at Thessalonica the synagogue was divided, and at Berea many believed until Jews from Thessalonica stirred up the people; from Berea Paul was sent on to Athens. The Macedonian churches became his support: the Philippians alone sent him help when he "departed from Macedonia", the brethren from Macedonia supplied his wants at Corinth, and in "a great trial of affliction" and "deep poverty" the churches of Macedonia gave beyond their power for the saints in Jerusalem. Paul passed through Macedonia again on his way to Greece and back, and Aristarchus of Thessalonica sailed with him to Rome.'
    - "The Thessalonians and Philippians received the earliest and the warmest of Paul's letters. Thessalonica remained the capital of Macedonia and became the second city of the Byzantine empire. The ancient land is today divided between the Greek region of Macedonia, with Thessaloniki, Vergina, Pella and Philippi, the Republic of North Macedonia, which took that name by the Prespa agreement of 2018, and south-western Bulgaria."
  ru:
    - "Македония — страна к северу от Греции вокруг Термического залива и нижнего течения Аксия (Вардара), Стримона и Неста, окружённая горами, с древней царской резиденцией в Эгах (Вергине) и позднейшей столицей в Пелле. Македоняне говорили на греческом наречии и чтили греческих богов, хотя южные греки часто считали их полуварварами. Филипп II (359–336 гг. до н. э.) объединил их, захватил золотые рудники горы Пангей, основал Филиппы и при Херонее в 338 г. стал господином Греции. Его сын Александр переправился в Азию в 334 г. и за десять лет сокрушил Персидскую державу; косматого козла Даниила, у которого «большой рог, который между глазами его, это первый ее царь», читают как образ Александра, а Первая книга Маккавейская начинается с Александра Македонянина."
    - "После смерти Александра его полководцы боролись за царство; Антигониды держали Македонию с 276 г. до н. э., пока Рим не разбил Филиппа V при Киноскефалах в 197 г., а его сына Персея при Пидне в 168 г. до н. э. Римляне сперва разделили страну на четыре республики, а в 146 г. до н. э., после восстания Андриска, сделали её провинцией Македония с центром в Фессалонике. Вскоре проложенная Эгнатиева дорога шла от Адриатики через Фессалонику и Филиппы на восток, к Кипселам на Гебре во Фракии. В 42 г. до н. э. Антоний и Октавиан разбили Брута и Кассия при Филиппах, а в 27 г. до н. э. Август сделал Македонию сенатской провинцией под управлением проконсула."
    - "В Троаде Павлу было ночью видение: «некий муж, Македонянин», просивший: «приди в Македонию и помоги нам», — и он отплыл с Силой и Тимофеем, а по преданию и с Лукой, в Неаполь, около 49 или 50 г. н. э. В Филиппах уверовала Лидия и крестился темничный страж; в Фессалонике синагога разделилась, а в Верии многие уверовали, пока иудеи из Фессалоники не возмутили народ; из Верии Павла проводили в Афины. Македонские церкви стали его опорой: одни Филиппийцы послали ему помощь, когда он «вышел из Македонии», братия, пришедшие из Македонии, восполнили его недостаток в Коринфе, а церкви Македонии «среди великого испытания скорбями» и при глубокой нищете дали сверх сил для святых в Иерусалиме. Павел снова прошёл Македонию по пути в Елладу и обратно, а Аристарх из Фессалоники плыл с ним в Рим."
    - "Фессалоникийцы и Филиппийцы получили самые ранние и самые тёплые из посланий Павла. Фессалоника оставалась столицей Македонии и стала вторым городом Византийской империи. Древняя страна сегодня разделена между греческой областью Македония — с Салониками, Вергиной, Пеллой и Филиппами, — Республикой Северная Македония, принявшей это имя по Преспанскому соглашению 2018 года, и юго-западом Болгарии."
  uk:
    - "Македонія — край на північ від Еллади навколо Термейської затоки та нижніх течій Аксія (Вардар), Стримона й Нестоса, оточений горами, зі старою царською резиденцією в Егах (Вергіна) та пізнішою столицею в Пеллі. Македоняни говорили грецьким діалектом і вклонялися грецьким богам, хоча південні греки часто вважали їх напівварварами. Пилип II (359–336 рр. до н. е.) об’єднав їх, захопив золоті копальні гори Пангей і заснував Філіппи, а при Херонеї 338 р. став господарем Еллади. Його син Александр перейшов до Азії 334 р. і за десять років скинув Перську імперію; кудлатий цап Даниїла, чий «здоровенний ріг» є «перший потугою царь» Греції, тлумачать як образ його, а перша книга Макавеїв починається Александром Македонським."
    - "Після смерті Александра його воєначальники билися за царство; Антигоніди тримали Македонію від 276 р. до н. е., аж поки Рим не переміг Пилипа V при Кіноскефалах 197 р. і його сина Персея при Підні 168 р. до н. е. Римляни спершу розділили край на чотири республіки, а 146 р. до н. е., після повстання Андріска, зробили його провінцією Македонія із осередком у Солуні. Егнатієва дорога, збудована невдовзі, йшла від Адріатики через Солунь й Філіппи на схід до Кіпсели на Гебрі у Фракії. У 42 р. до н. е. Антоній і Октавіан розбили Брута й Кассія при Філіппах, а 27 р. до н. е. Август зробив Македонію сенатською провінцією під проконсулом."
    - "У Троаді Павло побачив уночі «один чоловік Македонець», що благав його: «Прийшовши в Македонию, поможи нам», і він відплив із Силою і Тимофієм, а за переданням і з Лукою, до Неаполя, близько 49 чи 50 р. н. е. У Філіппах Лідія увірувала, а темничний сторож охрестився; в Солуні синагога розділилася, а у Верії багато хто увірував, доки юдеї з Солуня не збурили народ; з Верії Павла вислали до Афін. Македонські церкви стали його опорою: самі филип’яни допомогли йому, коли він «вийшов я з Македониї», брати з Македонії задовольнили його потреби в Коринті, а «у великому допустї горя» та «до глибини убожество їх» церкви Македонії давали над силу для святих у Єрусалимі. Павло знову проходив Македонією на шляху до Греції й назад, а Аристарх із Солуня плив із ним до Риму."
    - "Солунь й Філіппи отримали найраніші й найтепліші послання Павла. Солунь залишалися столицею Македонії й стали другим містом Візантійської імперії. Давній край сьогодні поділений між грецьким регіоном Македонія з Солунем, Вергіною, Пеллою та Філіппами, Республікою Північна Македонія, що прийняла цю назву за Преспанською угодою 2018 р., і південно-західною Болгарією."
  es:
    - "Macedonia es la tierra al norte de Grecia, en torno al golfo Termaico y a los cursos bajos del Axio (Vardar), el Estrimón y el Nesto, rodeada de montañas, con la antigua sede real en Egas (Vergina) y la capital posterior en Pela. Los macedonios hablaban un dialecto griego y adoraban a los dioses griegos, aunque los griegos del sur los consideraban a menudo semibárbaros. Filipo II (359–336 a. C.) los unió, se apoderó de las minas de oro del monte Pangeo y fundó Filipos, y en Queronea, en 338, se hizo dueño de Grecia. Su hijo Alejandro pasó a Asia en 334 y en una década derribó el imperio persa; se entiende que el macho cabrío velludo de Daniel, cuyo «cuerno grande» es «el rey primero» de Grecia, es una figura de él, y el primer libro de los Macabeos se abre con Alejandro de Macedonia."
    - "Tras la muerte de Alejandro, sus generales se disputaron el reino; los antigónidas tuvieron Macedonia desde 276 a. C. hasta que Roma derrotó a Filipo V en Cinoscéfalas en 197 y a su hijo Perseo en Pidna en 168 a. C. Los romanos dividieron primero la tierra en cuatro repúblicas y en 146 a. C., tras la rebelión de Andrisco, la convirtieron en la provincia de Macedonia con sede en Tesalónica. La Vía Egnatia, construida poco después, iba desde el Adriático, por Tesalónica y Filipos, hacia el este hasta Cípsela, sobre el Hebro, en Tracia. En 42 a. C. Antonio y Octaviano derrotaron a Bruto y Casio en Filipos, y en 27 a. C. Augusto hizo de Macedonia una provincia senatorial bajo un procónsul."
    - "En Troas, Pablo vio de noche «Un varón Macedonio» que le rogaba: «Pasa á Macedonia, y ayúdanos», y navegó con Silas y Timoteo, y, según la tradición, con Lucas, hasta Neápolis, hacia 49 o 50 d. C. En Filipos creyó Lidia y fue bautizado el carcelero; en Tesalónica la sinagoga se dividió, y en Berea muchos creyeron hasta que judíos de Tesalónica alborotaron al pueblo; desde Berea Pablo fue enviado a Atenas. Las iglesias macedonias se convirtieron en su apoyo: solo los filipenses le enviaron ayuda cuando «partí de Macedonia», los hermanos de Macedonia suplieron sus necesidades en Corinto, y «en grande prueba de tribulación» y en «su profunda pobreza» las iglesias de Macedonia dieron más allá de sus fuerzas para los santos de Jerusalén. Pablo volvió a pasar por Macedonia en su viaje a Grecia y de regreso, y Aristarco de Tesalónica navegó con él hacia Roma."
    - "Los tesalonicenses y los filipenses recibieron las más antiguas y las más cálidas de las cartas de Pablo. Tesalónica siguió siendo la capital de Macedonia y llegó a ser la segunda ciudad del imperio bizantino. La antigua tierra está hoy dividida entre la región griega de Macedonia, con Salónica, Vergina, Pela y Filipos, la República de Macedonia del Norte, que adoptó ese nombre por el acuerdo de Prespa de 2018, y el sudoeste de Bulgaria."
  pt:
    - "A Macedônia é a terra ao norte da Grécia em torno do golfo Termaico e dos baixos Axios (Vardar), Estrímon e Nesto, cercada de montanhas, com a antiga sede real em Egas (Vergina) e a capital posterior em Pela. Os macedônios falavam um dialeto grego e adoravam os deuses gregos, embora os gregos do sul muitas vezes os contassem como meio bárbaros. Filipe II (359–336 a.C.) os uniu, tomou as minas de ouro do monte Pangeu e fundou Filipos, e em Queroneia, em 338, fez-se senhor da Grécia. Seu filho Alexandre passou à Ásia em 334 e em uma década derrubou o império persa; o bode peludo de Daniel, cujo “grande chifre” é “o primeiro rei” da Grécia, é lido como figura dele, e o primeiro livro dos Macabeus abre com Alexandre da Macedônia."
    - "Depois da morte de Alexandre, seus generais disputaram o reino; os antigônidas mantiveram a Macedônia de 276 a.C. até que Roma derrotou Filipe V em Cinoscéfalas, em 197, e seu filho Perseu em Pidna, em 168 a.C. Os romanos primeiro dividiram a terra em quatro repúblicas e, em 146 a.C., depois da revolta de Andrisco, fizeram dela a província da Macedônia, com sede em Tessalônica. A Via Egnácia, construída logo depois, ia do Adriático por Tessalônica e Filipos rumo ao leste até Cipsela, no Hebro, na Trácia. Em 42 a.C. Antônio e Otaviano derrotaram Bruto e Cássio em Filipos, e em 27 a.C. Augusto fez da Macedônia uma província senatorial sob um procônsul."
    - "Em Trôade, Paulo viu de noite “um homem da Macedônia”, que lhe rogava: “Passa à Macedônia e ajuda-nos”, e navegou com Silas e Timóteo e, segundo a tradição, com Lucas até Neápolis, por volta de 49 ou 50 d.C. Em Filipos, Lídia creu e o carcereiro foi batizado; em Tessalônica a sinagoga se dividiu, e em Bereia muitos creram até que judeus de Tessalônica agitaram o povo; de Bereia Paulo foi enviado a Atenas. As igrejas macedônias tornaram-se seu apoio: só os filipenses lhe enviaram ajuda “quando parti da Macedônia”, os irmãos vindos da Macedônia supriram suas necessidades em Corinto e, numa “severa prova de aflição” e “profunda pobreza”, as igrejas da Macedônia deram além de suas possibilidades pelos santos de Jerusalém. Paulo passou de novo pela Macedônia a caminho da Grécia e na volta, e Aristarco de Tessalônica navegou com ele para Roma."
    - "Os tessalonicenses e os filipenses receberam as mais antigas e mais calorosas das cartas de Paulo. Tessalônica continuou capital da Macedônia e tornou-se a segunda cidade do império bizantino. A antiga terra divide-se hoje entre a região grega da Macedônia, com Tessalônica (Salônica), Vergina, Pela e Filipos, a República da Macedônia do Norte, que tomou esse nome pelo Acordo de Prespa de 2018, e o sudoeste da Bulgária."
  de:
    - "Mazedonien ist das Land nördlich von Griechenland um den Thermaischen Golf und den unteren Axios (Vardar), Strymon und Nestos, von Bergen umgeben, mit dem alten Königssitz in Aigai (Vergina) und der späteren Hauptstadt Pella. Die Mazedonier sprachen einen griechischen Dialekt und verehrten die griechischen Götter, obwohl die Südgriechen sie oft als halbe Barbaren ansahen. Philipp II. (359–336 v. Chr.) einte sie, nahm die Goldminen des Pangaion, gründete Philippi und machte sich 338 bei Chaironeia zum Herrn Griechenlands. Sein Sohn Alexander setzte 334 nach Asien über und stürzte in einem Jahrzehnt das Perserreich; der Ziegenbock Daniels, „der König in Griechenland“, dessen Horn zwischen den Augen „der erste König“ ist, wird als Bild auf ihn gedeutet, und das erste Makkabäerbuch beginnt mit Alexander von Mazedonien."
    - "Nach Alexanders Tod kämpften seine Generäle um das Reich; die Antigoniden hielten Mazedonien ab 276 v. Chr., bis Rom Philipp V. bei Kynoskephalai 197 und seinen Sohn Perseus bei Pydna 168 v. Chr. besiegte. Die Römer teilten das Land zuerst in vier Republiken und machten es 146 v. Chr. nach dem Aufstand des Andriskos zur Provinz Mazedonien mit Sitz in Thessalonich. Die kurz darauf gebaute Via Egnatia führte von der Adria über Thessalonich und Philippi ostwärts nach Kypsela am Hebros in Thrakien. 42 v. Chr. besiegten Antonius und Oktavian Brutus und Cassius bei Philippi, und 27 v. Chr. machte Augustus Mazedonien zur senatorischen Provinz unter einem Prokonsul."
    - "In Troas sah Paulus in der Nacht einen Mann aus Mazedonien, der ihn bat: „Komm herüber nach Mazedonien und hilf uns!“, und er fuhr mit Silas und Timotheus, der Überlieferung nach mit Lukas, nach Neapolis, um 49 oder 50 n. Chr. In Philippi glaubte Lydia und der Kerkermeister ließ sich taufen; in Thessalonich spaltete sich die Synagoge, und in Beröa glaubten viele, bis Juden aus Thessalonich das Volk aufwiegelten; von Beröa wurde Paulus nach Athen geleitet. Die mazedonischen Gemeinden wurden seine Stütze: Die Philipper allein halfen ihm, „da ich auszog aus Mazedonien“, in Korinth versorgten ihn die Brüder aus Mazedonien, und durch „viel Trübsal“ und trotz Armut („sehr arm“) gaben die Gemeinden Mazedoniens „über Vermögen“ für die Heiligen in Jerusalem. Paulus zog auf dem Weg nach Griechenland und zurück erneut durch Mazedonien, und Aristarch aus Thessalonich fuhr mit ihm nach Rom."
    - "Die Thessalonicher und Philipper erhielten die frühesten und herzlichsten Briefe des Paulus. Thessalonich blieb die Hauptstadt Mazedoniens und wurde die zweite Stadt des byzantinischen Reiches. Das antike Land ist heute geteilt zwischen der griechischen Region Mazedonien mit Thessaloniki, Vergina, Pella und Philippi, der Republik Nordmazedonien, die diesen Namen durch das Abkommen von Prespa 2018 annahm, und dem Südwesten Bulgariens."
  fr:
    - "La Macédoine est le pays au nord de la Grèce autour du golfe Thermaïque et du cours inférieur de l’Axios (Vardar), du Strymon et du Nestos, ceinturé de montagnes, avec l’ancien siège royal à Aigai (Vergina) et la capitale plus tardive à Pella. Les Macédoniens parlaient un dialecte grec et adoraient les dieux grecs, bien que les Grecs du sud les aient souvent tenus pour à demi barbares. Philippe II (359–336 av. J.-C.) les unit, prit les mines d’or du mont Pangée, fonda Philippes, et se fit maître de la Grèce à Chéronée en 338. Son fils Alexandre passa en Asie en 334 et, en une décennie, renversa l’empire perse ; le bouc velu de Daniel, dont « la grande corne » est « le premier roi » de la Grèce, se lit comme une figure de lui, et le premier livre des Maccabées s’ouvre avec Alexandre de Macédoine."
    - "Après la mort d’Alexandre, ses généraux se disputèrent le royaume ; les Antigonides tinrent la Macédoine de 276 av. J.-C. jusqu’à ce que Rome vainquît Philippe V à Cynoscéphales en 197 et son fils Persée à Pydna en 168 av. J.-C. Les Romains partagèrent d’abord le pays en quatre républiques et, en 146 av. J.-C., après la révolte d’Andriscos, en firent la province de Macédoine, avec siège à Thessalonique. La Via Egnatia, construite peu après, allait de l’Adriatique vers l’est par Thessalonique et Philippes jusqu’à Cypsèle sur l’Hèbre, en Thrace. En 42 av. J.-C., Antoine et Octavien vainquirent Brutus et Cassius à Philippes, et en 27 av. J.-C. Auguste fit de la Macédoine une province sénatoriale sous un proconsul."
    - "À Troas, Paul vit de nuit « un Macédonien » qui le priait : « Passe en Macédoine, secours-nous ! », et embarqua avec Silas et Timothée, et, selon la tradition, Luc, pour Néapolis, vers 49 ou 50 apr. J.-C. À Philippes, Lydie crut et le geôlier fut baptisé ; à Thessalonique, la synagogue se divisa, et à Bérée beaucoup crurent jusqu’à ce que des Juifs de Thessalonique agitent la foule ; de Bérée, Paul fut envoyé à Athènes. Les Églises de Macédoine devinrent son soutien : les Philippiens seuls lui envoyèrent de l’aide quand il « partit de la Macédoine », à Corinthe, des frères de Macédoine pourvurent à ses besoins, et « au milieu de beaucoup de tribulations » et dans leur « pauvreté profonde », elles donnèrent « au-delà de leurs moyens » pour les saints de Jérusalem. Paul repassa par la Macédoine en allant en Grèce et au retour, et Aristarque de Thessalonique embarqua avec lui pour Rome."
    - "Les Thessaloniciens et les Philippiens reçurent les plus anciennes et les plus chaleureuses des lettres de Paul. Thessalonique resta la capitale de la Macédoine et devint la deuxième ville de l’empire byzantin. Le pays antique est aujourd’hui partagé entre la région grecque de Macédoine, avec Thessalonique, Vergina, Pella et Philippes, la République de Macédoine du Nord, qui prit ce nom par l’accord de Prespa de 2018, et le sud-ouest de la Bulgarie."
  it:
    - "La Macedonia è la terra a nord della Grecia intorno al Golfo Termaico e al basso Assio (Vardar), Strimone e Nesto, cinta di montagne, con l’antica sede regia a Ege (Vergina) e la capitale successiva a Pella. I Macedoni parlavano un dialetto greco e adoravano gli dèi greci, benché i Greci del sud li considerassero spesso mezzi barbari. Filippo II (359–336 a.C.) li unì, prese le miniere d’oro del Monte Pangeo e fondò Filippi, e a Cheronea nel 338 si fece padrone della Grecia. Suo figlio Alessandro passò in Asia nel 334 e in un decennio abbatté l’impero persiano; il becco peloso di Daniele, il cui «gran corno» è il «primo re» di Grecia, è letto come una figura di lui, e il primo libro dei Maccabei si apre con Alessandro di Macedonia."
    - "Dopo la morte di Alessandro i suoi generali si contesero il regno; gli Antigonidi tennero la Macedonia dal 276 a.C. finché Roma sconfisse Filippo V a Cinoscefale nel 197 e suo figlio Perseo a Pidna nel 168 a.C. I Romani dapprima divisero il paese in quattro repubbliche e nel 146 a.C., dopo la rivolta di Andrisco, ne fecero la provincia di Macedonia con sede a Tessalonica. La Via Egnatia, costruita poco dopo, correva dall’Adriatico attraverso Tessalonica e Filippi verso est fino a Cipsela sull’Ebro in Tracia. Nel 42 a.C. Antonio e Ottaviano sconfissero Bruto e Cassio a Filippi, e nel 27 a.C. Augusto fece della Macedonia una provincia senatoria sotto un proconsole."
    - "A Troade Paolo vide di notte «Un uomo macedone» che lo pregava: «Passa in Macedonia e soccorrici», e salpò con Sila e Timoteo e, secondo la tradizione, con Luca per Neapoli, verso il 49 o 50 d.C. A Filippi Lidia credette e il carceriere fu battezzato; a Tessalonica la sinagoga si divise, e a Berea molti credettero finché Giudei di Tessalonica sobillarono la folla; da Berea Paolo fu inviato ad Atene. Le chiese macedoni divennero il suo sostegno: i soli Filippesi gli mandarono aiuto quando ebbe «lasciato la Macedonia», i fratelli venuti dalla Macedonia provvidero ai suoi bisogni a Corinto, e tra «molte afflizioni con le quali esse sono provate» e «profonda povertà» le chiese di Macedonia diedero al di là delle loro forze per i santi di Gerusalemme. Paolo attraversò di nuovo la Macedonia andando in Grecia e tornando, e Aristarco di Tessalonica navigò con lui verso Roma."
    - "I Tessalonicesi e i Filippesi ricevettero le più antiche e le più calorose lettere di Paolo. Tessalonica rimase la capitale della Macedonia e divenne la seconda città dell’impero bizantino. L’antica terra è oggi divisa tra la regione greca della Macedonia, con Salonicco, Vergina, Pella e Filippi, la Repubblica di Macedonia del Nord, che ha assunto questo nome con l’accordo di Prespa del 2018, e la Bulgaria sud-occidentale."
  pl:
    - "Macedonia to kraina na północ od Grecji wokół Zatoki Termajskiej i dolnego Aksiosu (Wardar), Strymonu i Nestosu, otoczona górami, ze starą siedzibą królewską w Ajgaj (Vergina) i późniejszą stolicą w Pelli. Macedończycy mówili dialektem greckim i czcili greckich bogów, choć południowi Grecy często uważali ich za na wpół barbarzyńców. Filip II (359–336 p.n.e.) zjednoczył ich, zajął kopalnie złota góry Pangajon i założył Filippi, a pod Cheroneą w 338 r. został panem Grecji. Jego syn Aleksander przeprawił się do Azji w 334 r. i w dekadę obalił imperium perskie; kosmaty kozieł Daniela, którego „róg wielki” to „król pierwszy” Grecji, jest odczytywany jako jego obraz, a pierwsza Księga Machabejska zaczyna się od Aleksandra Macedońskiego."
    - "Po śmierci Aleksandra jego wodzowie walczyli o królestwo; Antygonidzi trzymali Macedonię od 276 r. p.n.e., aż Rzym pokonał Filipa V pod Kynoskefalaj w 197 r. i jego syna Perseusza pod Pydną w 168 r. p.n.e. Rzymianie najpierw podzielili kraj na cztery republiki, a w 146 r. p.n.e., po buncie Andriskosa, uczynili z niego prowincję Macedonię z siedzibą w Tesalonice. Via Egnatia, zbudowana wkrótce potem, biegła znad Adriatyku przez Tesalonikę i Filippi na wschód do Kypseli nad Hebrosem w Tracji. W 42 r. p.n.e. Antoniusz i Oktawian pobili pod Filippi Brutusa i Kasjusza, a w 27 r. p.n.e. August uczynił z Macedonii prowincję senatorską pod rządami prokonsula."
    - "W Troadzie Paweł ujrzał w nocy widzenie: „Mąż niejaki Macedończyk stał, prosząc go i mówiąc: Przepraw się do Macedonii, a ratuj nas”, i popłynął z Sylasem i Tymoteuszem, a według tradycji z Łukaszem, do Neapolis, około 49 lub 50 r. n.e. W Filippi uwierzyła Lidia i ochrzczono stróża więzienia; w Tesalonice synagoga się podzieliła, a w Berei wielu uwierzyło, dopóki Żydzi z Tesaloniki nie podburzyli ludu; z Berei Paweł został posłany dalej do Aten. Kościoły macedońskie stały się jego oparciem: tylko Filipianie przysłali mu pomoc, „gdym wyszedł z Macedonii”, bracia z Macedonii zaspokoili jego potrzeby w Koryncie, a zbory Macedonii, choć było u nich „w rozlicznem doświadczeniu utrapienia” i „bardzo wielkie ubóstwo ich”, dały ponad możność dla świętych w Jerozolimie. Paweł przeszedł przez Macedonię znów w drodze do Grecji i z powrotem, a Arystarch z Tesaloniki płynął z nim do Rzymu."
    - "Tesaloniczanie i Filipianie otrzymali najwcześniejszy i najserdeczniejszy z listów Pawła. Tesalonika pozostała stolicą Macedonii i stała się drugim miastem cesarstwa bizantyjskiego. Dawna kraina jest dziś podzielona między grecki region Macedonii, z Salonikami, Ajgaj, Pellą i Filippi, Republikę Macedonii Północnej, która przyjęła tę nazwę na mocy umowy z Prespy z 2018 r., oraz południowo-zachodnią Bułgarię."
  nl:
    - "Macedonië is het land ten noorden van Griekenland rond de Thermaïsche Golf en de benedenloop van de Axios (Vardar), Strymon en Nestos, omringd door bergen, met de oude koningszetel Aigai (Vergina) en de latere hoofdstad Pella. De Macedoniërs spraken een Grieks dialect en vereerden de Griekse goden, al rekenden zuidelijke Grieken hen vaak half tot de barbaren. Filips II (359–336 v.Chr.) verenigde hen, nam de goudmijnen van de Pangaion in bezit, stichtte Filippi en maakte zich in 338 bij Chaeronea meester van Griekenland. Zijn zoon Alexander stak in 334 over naar Azië en wierp in een decennium het Perzische rijk omver; de harige bok van Daniël, wiens “grote hoorn” “de eerste koning” van Griekenland is, wordt als een beeld van hem gelezen, en het eerste boek der Makkabeeën opent met Alexander van Macedonië."
    - "Na Alexanders dood vochten zijn generaals om het koninkrijk; de Antigoniden bezaten Macedonië van 276 v.Chr. tot Rome Filips V bij Cynoscephalae in 197 en zijn zoon Perseus bij Pydna in 168 v.Chr. versloeg. De Romeinen splitsten het land eerst in vier republieken en maakten het in 146 v.Chr., na de opstand van Andriscus, tot de provincie Macedonië met Tessalonica als zetel. De Via Egnatia, kort daarna aangelegd, liep van de Adriatische Zee via Tessalonica en Filippi oostwaarts naar Cypsela aan de Hebrus in Thracië. In 42 v.Chr. versloegen Antonius en Octavianus Brutus en Cassius bij Filippi, en in 27 v.Chr. maakte Augustus Macedonië tot een senatoriale provincie onder een proconsul."
    - "Te Troas zag Paulus in de nacht “een Macedonisch man” die hem bad: “Kom over in Macedonië, en help ons”, en hij voer met Silas en Timoteüs, en naar overlevering Lukas, naar Neapolis, rond 49 of 50 n.Chr. In Filippi kwam Lydia tot geloof en werd de cipier gedoopt; in Tessalonica raakte de synagoge verdeeld, en in Berea geloofden velen totdat Joden uit Tessalonica het volk opstookten; van Berea werd Paulus doorgestuurd naar Athene. De Macedonische gemeenten werden zijn steun: alleen de Filippenzen stuurden hem hulp toen hij “van Macedonië vertrokken” was, de broeders uit Macedonië voorzagen in Korinthe in zijn behoeften, en “in vele beproeving der verdrukking” en door hun “zeer diepe armoede” gaven deze gemeenten boven hun macht voor de heiligen in Jeruzalem. Paulus trok nogmaals door Macedonië op weg naar Griekenland en terug, en Aristarchus van Tessalonica voer met hem naar Rome."
    - "De Tessalonicenzen en Filippenzen ontvingen de vroegste en de hartelijkste brieven van Paulus. Tessalonica bleef de hoofdstad van Macedonië en werd de tweede stad van het Byzantijnse rijk. Het oude land is tegenwoordig verdeeld tussen de Griekse regio Macedonië, met Thessaloniki, Vergina, Pella en Filippi, de Republiek Noord-Macedonië, die die naam kreeg door het akkoord van Prespa van 2018, en het zuidwesten van Bulgarije."
  cs:
    - "Makedonie je země severně od Řecka kolem Thermaického zálivu a dolního toku řek Axios (Vardar), Strymon a Nestos, obklopená horami, se starým královským sídlem v Aigai (Vergina) a pozdějším hlavním městem v Pelle. Makedonci mluvili řeckým nářečím a uctívali řecké bohy, ač je jižní Řekové často pokládali za poloviční barbary. Filip II. (359–336 př. n. l.) je sjednotil, získal zlaté doly na hoře Pangaion a založil Filipy a u Chairóneie roku 338 se stal pánem Řecka. Jeho syn Alexandr přešel roku 334 do Asie a za deset let svrhl perskou říši; chlupatý kozel Danielův, jehož „roh ten veliký“ je „král první“ Řecka, se vykládá jako jeho obraz a první kniha Makabejských začíná Alexandrem Makedonským."
    - "Po Alexandrově smrti o království bojovali jeho vojevůdci; Antigonovci drželi Makedonii od roku 276 př. n. l., dokud Řím nepřemohl Filipa V. u Kynoskefal roku 197 a jeho syna Persea u Pydny roku 168 př. n. l. Římané nejprve rozdělili zemi na čtyři republiky a roku 146 př. n. l. po vzpouře Andriska z ní učinili provincii Makedonii se sídlem v Tesalonice. Via Egnatia, vybudovaná brzy poté, vedla od Jadranu přes Tesaloniku a Filipy na východ ke Kypselám na Hebru v Thrákii. Roku 42 př. n. l. porazili Antonius a Octavianus Bruta a Cassia u Filip a roku 27 př. n. l. učinil Augustus z Makedonie senátní provincii pod prokonzulem."
    - "V Troadě viděl Pavel v noci vidění: „muž nějaký Macedonský stál, a prosil ho, řka: Přijda do Macedonie, pomoz nám“, a vyplul se Silou a Timoteem a podle tradice i s Lukášem do Neapole asi roku 49 nebo 50 n. l. Ve Filipech uvěřila Lýdie a žalářník byl pokřtěn; v Tesalonice se synagoga rozdělila a v Beroii mnozí uvěřili, dokud Židé z Tesaloniky nepoštvali lid; z Beroie byl Pavel poslán dál do Atén. Makedonské církve se staly jeho oporou: sami Filipští mu poslali pomoc, jak sám píše, „když jsem šel z Macedonie“, bratří z Macedonie doplnili jeho nedostatek v Korintu a církve Makedonie přispěly pro svaté v Jeruzalémě nad své možnosti, „v mnohém zkušení rozličných soužení“ a při „převeliké chudobě“. Pavel prošel Makedonií znovu na cestě do Řecka a zpět a Aristarchos z Tesaloniky s ním plul do Říma."
    - "Tesaloničané a Filipští dostali nejstarší a nejvřelejší z Pavlových listů. Tesalonika zůstala hlavním městem Makedonie a stala se druhým městem byzantské říše. Starověká země je dnes rozdělena mezi řeckou oblast Makedonii se Soluní, Verginou, Pellou a Filipy, Republiku Severní Makedonii, která přijala toto jméno Prespanskou dohodou z roku 2018, a jihozápadní Bulharsko."
