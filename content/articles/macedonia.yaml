# Overview article (ADR 0007). Mainstream facts only; the Roman dates are the usual ones; the year of Paul's crossing is given as approximate.
id: macedonia
place: a69e1b8
title:
  en: "Macedonia"
  ru: "Македония"
  uk: "Македонія"
  es: "Macedonia"
  pt: "Macedônia"
  de: "Mazedonien"
  fr: "Macédoine"
  it: "Macedonia"
  pl: "Macedonia"
  nl: "Macedonië"
