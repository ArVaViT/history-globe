# Overview article (ADR 0007). Mainstream facts only; the date of the rise of the Edomite kingdom and of the Faynan copper mining is named as debated.
id: edom
place: a2735ff
title:
  en: "Edom"
  ru: "Едом"
  uk: "Едом"
  es: "Edom"
