body:
  en:
    - 'Edom was the hill country south of the Dead Sea, east of the Arabah, from the Zered (Wadi Hasa) south towards the Gulf of Aqaba; the Bible also calls it Seir, and the Edomites "the children of Esau, which dwell in Seir". The name means "red", from the sandstone of its mountains and, in Genesis, from the red pottage for which Esau sold his birthright. Its towns were Bozrah (Busayra), Teman and Sela, whose people, Obadiah says, dwell "in the clefts of the rock"; Sela is placed by some at Umm el-Biyara above Petra and by others at es-Sela near Bozrah. The copper mines of Faynan in the Arabah were worked in the Iron Age; whether a kingdom already existed there in the tenth century BC or only from the eighth is disputed.'
    - 'Genesis lists the kings "that reigned in the land of Edom, before there reigned any king over the children of Israel". When Moses asked leave to pass along the king''s highway, "Edom said unto him, Thou shalt not pass by me", and Israel turned away; yet the Law forbade them to abhor an Edomite, "for he is thy brother". Saul fought Edom, and David put garrisons through all of it after the slaughter in the valley of salt. In the days of Joram "Edom revolted from under the hand of Judah, and made a king over themselves"; Amaziah took Sela, and Uzziah rebuilt Elath on the Red Sea, which Rezin recovered under Ahaz.'
    - 'Assyrian lists name Qaush-malaka, Aiarammu and Qaush-gabri, kings of Edom, among those who paid tribute from the 730s to the 670s BC; the royal names honour Qaus, the god of Edom. In 587 BC the Edomites stood by at the fall of Jerusalem: "Remember, O LORD, the children of Edom in the day of Jerusalem; who said, Rase it, rase it", and Obadiah, Ezekiel and Malachi condemn them for it. The Nabonidus Chronicle seems to have the Babylonian king encamp against Edom in 553/552 BC, after which the kingdom fades. Edomites moved into the Negeb south of Hebron, which became Idumea, and Arabs and then the Nabataeans took their old land and built Petra.'
    - "In the late second century BC John Hyrcanus conquered Idumea and, Josephus says, made its people live by the Jewish law; Herod the Great was of Idumean descent. The old Edom became part of the Roman province of Arabia in AD 106, and Eusebius knew Idumea as the country round Petra. Today it is the south of Jordan: Tafila, Shawbak and the ruins of Petra, inscribed by UNESCO in 1985, with the port of Aqaba at its southern end."
  ru:
    - "Едом — горная страна к югу от Мёртвого моря, к востоку от Аравы, от Зареда (Вади-Хаса) на юг к заливу Акаба; Библия зовёт её также Сеиром, а Идумеев знает как «сынов Исавовых, живущих на Сеире». Имя значит «красный»: от песчаника её гор и, по книге Бытия, от красной похлёбки, за которую Исав продал первородство. Её городами были Восор (Бусейра), Феман и Села, о жителях которой Авдий говорит: «ты живешь в расселинах скал»; Селу одни помещают на Умм-эль-Бияре над Петрой, другие — в Эс-Селе близ Восора. Медные рудники Файнана в Араве разрабатывались в железном веке; существовало ли там царство уже в X веке до н. э. или лишь с VIII века — спорно."
    - "Книга Бытия открывает их список словами: «Вот цари, царствовавшие в земле Едома, прежде царствования царей у сынов Израилевых». Когда Моисей просил позволить пройти дорогою царскою, «Едом сказал ему: не проходи через меня», и Израиль пошёл в сторону; но Закон запрещал гнушаться Идумеянином, «ибо он брат твой». Саул воевал с Едомом, а Давид после побоища в долине Соляной поставил охранные войска по всей Идумее. Во дни Иорама «выступил Едом из-под руки Иуды, и поставили они над собою царя»; Амасия взял Селу, а Озия отстроил Елаф на Чермном море, который при Ахазе вернул себе Рецин."
    - "Ассирийские списки называют Кауш-малаку, Айарамму и Кауш-габри, царей Едома, среди плативших дань с 730-х по 670-е годы до н. э.; царские имена чтут Кауса, бога Едома. В 587 г. до н. э. Идумеи стояли в стороне при падении Иерусалима: «Припомни, Господи, сынам Едомовым день Иерусалима», — и Авдий, Иезекииль и Малахия осуждают их за это. По Хронике Набонида вавилонский царь, по-видимому, встал лагерем против Едома в 553/552 г. до н. э., после чего царство угасает. Идумеи переселились в Негев южнее Хеврона, который стал Идумеей, а их прежнюю землю заняли арабы, а затем Набатеи, построившие Петру."
    - "Во второй половине II века до н. э. Иоанн Гиркан покорил Идумею и, по словам Иосифа Флавия, заставил её жителей жить по иудейскому закону; Ирод Великий был идумейского рода. Древний Едом в 106 г. н. э. вошёл в римскую провинцию Аравия, и Евсевий знал Идумею как страну вокруг Петры. Сегодня это юг Иордании: Эт-Тафила, Шобак и развалины Петры, внесённые в список ЮНЕСКО в 1985 году, а на южном краю — порт Акаба."
  uk:
    - "Едом був гірською країною на південь від Мертвого моря, на схід від Арави, від Заред (ваді Хаса) на південь до Акабської затоки; Біблія також називає його Сеір, а едомітів — «синів Єзавових, що живуть на Сеїр-горах». Назва означає «червоний», від пісковику його гір і, в Книзі Буття, від червоної юшки, за яку Ісав продав своє первородство. Його містами були Боцра (Бусайра), Теман і Села, чиї мешканці, каже Овадія, живуть «у провалах між скелями»; Селу одні розташовують в Умм-ель-Бійарі над Петрою, інші — в ес-Селі біля Боцри. Мідні копальні Файнана в Араві розробляли в залізну добу; чи існувало там царство вже в X ст. до н. е., чи лише з VIII ст., є предметом суперечки."
    - "Книга Буття перелічує царів, «що царювали в Едом землї, перш нїж царював там який царь в Ізраїлї». Коли Мойсей просив дозволу пройти царською дорогою, «відказав йому Едом: Не переходити меш в мене», і Ізраїль звернув убік; проте Закон забороняв гидувати едомітом, «він бо тобі брат». Саул воював з Едомом, а Давид розставив залоги по всьому ньому після різні в Соляній долині. За днів Йорама «визволились Едомії зпід верховоду Юдиного та й поставили царя над собою»; Амассія взяв Селу, а Уззія відбудував Елат на Червоному морі, який за Ахаза повернув Рецін."
    - "Ассирійські списки називають Каушмалаку, Айарамму та Каушгабрі, царів Едому, серед тих, хто сплачував данину від 730-х до 670-х рр. до н. е.; царські імена шанують Кауса, бога Едому. У 587 р. до н. е. едоміти стояли осторонь під час падіння Єрусалима: «Не забудь, Господи, день Єрусалима синам Едомським, що кричали: Руйнуйте, до нащадку його руйнуйте!», — і Овадія, Єзекіїль і Малахія засуджують їх за це. Хроніка Набоніда, схоже, подає вавилонського царя в таборі проти Едому в 553/552 р. до н. е., після чого царство згасає. Едоміти перебралися в Негев на південь від Хеврона, що став Ідумеєю, а араби, потім набатеї посіли їхню давню землю й збудували Петру."
    - "Наприкінці II ст. до н. е. Іван Гіркан підкорив Ідумею і, каже Йосиф Флавій, змусив її мешканців жити за юдейським законом; Ірод Великий був ідумейського роду. Давній Едом став частиною римської провінції Аравія в 106 р. н. е., а Євсевій знав Ідумею як країну навколо Петри. Сьогодні це південь Йорданії: Тафіла, Шаубак і руїни Петри, внесені ЮНЕСКО в 1985 р., з портом Акаба на південному кінці."
  es:
    - "Edom era la región montañosa al sur del mar Muerto, al este de la Arabá, desde el Zered (uadi Hasa) hacia el sur, en dirección al golfo de Áqaba; la Biblia la llama también Seir, y a los edomitas, «los hijos de Esaú, que habitan en Seir». El nombre significa «rojo», por la arenisca de sus montañas y, en el Génesis, por el guiso rojo por el que Esaú vendió su primogenitura. Sus ciudades eran Bosra (Busayra), Temán y Sela, cuyo pueblo, dice Abdías, habita «en las hendiduras de las peñas»; Sela se sitúa por unos en Umm el-Biyara, sobre Petra, y por otros en es-Sela, cerca de Bosra. Las minas de cobre de Faynan, en la Arabá, se explotaron en la Edad del Hierro; se debate si ya existía allí un reino en el siglo X a. C. o solo desde el VIII."
    - "El Génesis enumera los reyes que «reinaron en la tierra de Edom, antes que reinase rey sobre los hijos de Israel». Cuando Moisés pidió permiso para pasar por el camino real, «Edom le respondió: No pasarás por mi país», e Israel se apartó; sin embargo, la Ley les prohibía abominar de un edomita: «No abominarás al Idumeo, que tu hermano es». Saúl combatió a Edom, y David puso guarniciones por todo su territorio tras la matanza en el valle de la Sal. En tiempos de Joram, «se rebeló Edom de debajo de la mano de Judá, y pusieron rey sobre sí»; Amasías tomó Sela, y Uzías reconstruyó Elat, en el mar Rojo, que Rezín recuperó bajo Acaz."
    - "Las listas asirias nombran a Qaush-malaka, Aiarammu y Qaush-gabri, reyes de Edom, entre los que pagaron tributo desde la década del 730 hasta la del 670 a. C.; los nombres reales honran a Qaus, el dios de Edom. En el 587 a. C. los edomitas se quedaron mirando la caída de Jerusalén: «Acuérdate, oh Jehová, de los hijos de Edom en el día de Jerusalem; quienes decían: Arrasadla, arrasadla hasta los cimientos», y Abdías, Ezequiel y Malaquías los condenan por ello. La Crónica de Nabónido parece hacer que el rey babilonio acampe contra Edom en 553/552 a. C., tras lo cual el reino se desvanece. Los edomitas se trasladaron al Néguev, al sur de Hebrón, que pasó a ser Idumea, y los árabes y luego los nabateos ocuparon su antigua tierra y construyeron Petra."
    - "A finales del siglo II a. C. Juan Hircano conquistó Idumea y, según Josefo, hizo que su pueblo viviera conforme a la ley judía; Herodes el Grande era de ascendencia idumea. La antigua Edom pasó a formar parte de la provincia romana de Arabia en el 106 d. C., y Eusebio conocía Idumea como la región en torno a Petra. Hoy es el sur de Jordania: Tafila, Shawbak y las ruinas de Petra, inscritas por la UNESCO en 1985, con el puerto de Áqaba en su extremo sur."
  pt:
    - "Edom era a região montanhosa ao sul do Mar Morto, a leste da Arabá, do Zerede (uádi Hasa) para o sul em direção ao Golfo de Aqaba; a Bíblia a chama também Seir, e os edomitas, “os filhos de Esaú, que habitam em Seir”. O nome significa “vermelho”, pelo arenito de suas montanhas e, no Gênesis, pelo ensopado vermelho pelo qual Esaú vendeu seu direito de primogenitura. Suas cidades eram Bozra (Busayra), Temã e Sela, cujo povo, diz Obadias, habita “nas fendas da rocha”; Sela é situada por alguns em Umm el-Biyara, acima de Petra, e por outros em es-Sela, perto de Bozra. As minas de cobre de Faynan, na Arabá, foram exploradas na Idade do Ferro; se já existia ali um reino no século X a.C. ou só a partir do VIII é disputado."
    - "O Gênesis lista os reis “que reinaram na terra de Edom, antes que qualquer rei reinasse sobre os filhos de Israel”. Quando Moisés pediu licença para passar pela estrada do rei, Edom lhe disse: “Você não passará por mim”, e Israel se desviou; contudo a Lei proibia abominar um edomita, “pois ele é seu irmão”. Saul combateu Edom, e Davi pôs guarnições em todo ele depois da matança no Vale do Sal. Nos dias de Jorão, “Edom se rebelou contra o domínio de Judá e constituiu um rei sobre si mesmos”; Amazias tomou Sela, e Uzias reconstruiu Elate, no Mar Vermelho, que Rezim recuperou sob Acaz."
    - "Listas assírias nomeiam Qaus-Malaca, Aiarammu e Qaus-Gabri, reis de Edom, entre os que pagaram tributo da década de 730 à de 670 a.C.; os nomes reais honram Qaus, o deus de Edom. Em 587 a.C., os edomitas ficaram de lado na queda de Jerusalém: “Lembra-te, SENHOR, contra os filhos de Edom, no dia de Jerusalém, que disseram: ‘Arrasem-na! Arrasem-na até os seus alicerces!’”, e Obadias, Ezequiel e Malaquias os condenam por isso. A Crônica de Nabonido parece fazer o rei babilônico acampar contra Edom em 553/552 a.C., após o que o reino se apaga. Edomitas passaram ao Neguebe ao sul de Hebrom, que se tornou a Iduméia, e árabes e depois os nabateus tomaram sua antiga terra e construíram Petra."
    - "No fim do século II a.C., João Hircano conquistou a Iduméia e, diz Josefo, fez seu povo viver pela lei judaica; Herodes, o Grande, era de ascendência idumeia. O antigo Edom passou a fazer parte da província romana da Arábia em 106 d.C., e Eusébio conhecia a Iduméia como o país em torno de Petra. Hoje é o sul da Jordânia: Tafila, Shawbak e as ruínas de Petra, inscritas pela UNESCO em 1985, com o porto de Aqaba em sua extremidade sul."
  de:
    - "Edom war das Bergland südlich des Toten Meeres, östlich der Araba, vom Sered (Wadi Hasa) nach Süden in Richtung des Golfs von Akaba; die Bibel nennt es auch Seir, und die Edomiter „Kinder Esau“, „die zu Seir wohnen“. Der Name bedeutet „rot“, vom Sandstein seiner Berge und, in der Genesis, vom roten Gericht, für das Esau sein Erstgeburtsrecht verkaufte. Seine Städte waren Bozra (Busayra), Teman und Sela, deren Bewohner nach Obadja „in der Felsen Klüften“ wohnen; Sela wird von manchen bei Umm el-Biyara oberhalb von Petra angesetzt, von anderen bei es-Sela nahe Bozra. Die Kupferminen von Faynan in der Araba wurden in der Eisenzeit betrieben; ob dort schon im 10. Jahrhundert v. Chr. ein Königreich bestand oder erst ab dem 8., ist umstritten."
    - "Die Genesis führt die Könige auf, „die im Lande Edom regiert haben, ehe denn die Kinder Israel Könige hatten“. Als Mose um Erlaubnis bat, auf der Königsstraße zu ziehen, „Edom aber sprach zu ihnen: Du sollst nicht durch mich ziehen“, und Israel wandte sich ab; doch verbot das Gesetz, einen Edomiter für einen Greuel zu halten, „er ist dein Bruder“. Saul kämpfte gegen Edom, und David legte nach dem Gemetzel im Salztal Besatzungen in das ganze Land. In den Tagen Jorams „fielen die Edomiter ab von Juda und machten einen König über sich“; Amazja nahm Sela, und Usija baute Elat am Roten Meer wieder auf, das Rezin unter Ahas zurückgewann."
    - "Assyrische Listen nennen Qaus-malaka, Aja-rammu und Qaus-gabri, Könige von Edom, unter denen, die von den 730er bis zu den 670er Jahren v. Chr. Tribut zahlten; die Königsnamen ehren Qaus, den Gott Edoms. Im Jahr 587 v. Chr. sahen die Edomiter beim Fall Jerusalems zu: „HERR, gedenke der Kinder Edom den Tag Jerusalems, die da sagten: ‚Rein ab, rein ab bis auf ihren Boden!‘“, und Obadja, Hesekiel und Maleachi verurteilen sie dafür. Die Nabonid-Chronik scheint den babylonischen König 553/552 v. Chr. gegen Edom lagern zu lassen, wonach das Königreich verblasst. Edomiter zogen in den Negev südlich von Hebron, der Idumäa wurde, und Araber und dann die Nabatäer nahmen ihr altes Land ein und bauten Petra."
    - "Im späten 2. Jahrhundert v. Chr. eroberte Johannes Hyrkanos Idumäa und, wie Josephus sagt, ließ dessen Bewohner nach dem jüdischen Gesetz leben; Herodes der Große war idumäischer Abstammung. Das alte Edom wurde 106 n. Chr. Teil der römischen Provinz Arabien, und Eusebius kannte Idumäa als das Land um Petra. Heute ist es der Süden Jordaniens: Tafila, Schaubak und die Ruinen von Petra, 1985 von der UNESCO eingetragen, mit dem Hafen Akaba am Südende."
  fr:
    - "Édom était la région montagneuse au sud de la mer Morte, à l’est de l’Araba, du Zéred (Wadi Hasa) vers le sud en direction du golfe d’Aqaba ; la Bible l’appelle aussi Séir, et les Édomites « les enfants d’Ésaü, qui habitent en Séir ». Le nom signifie « rouge », d’après le grès de ses montagnes et, dans la Genèse, d’après le potage rouge pour lequel Ésaü vendit son droit d’aînesse. Ses villes étaient Botsra (Busayra), Théman et Séla, dont les habitants, dit Abdias, habitent « le creux des rochers » ; Séla est située par les uns à Umm el-Biyara au-dessus de Pétra et par d’autres à es-Sela près de Botsra. Les mines de cuivre de Faynan dans l’Araba furent exploitées à l’âge du Fer ; on débat si un royaume y existait déjà au Xe siècle av. J.-C. ou seulement à partir du VIIIe."
    - "La Genèse énumère les rois « qui ont régné dans le pays d’Édom, avant qu’un roi régnât sur les enfants d’Israël ». Quand Moïse demanda la permission de passer par la route royale, « Édom lui dit : Tu ne passeras point chez moi », et Israël fit demi-tour ; pourtant la Loi leur interdit de tenir l’Édomite en abomination, « car il est ton frère ». Saül combattit Édom, et David mit des garnisons dans tout le pays après le carnage de la vallée du Sel. Du temps de Joram, « Édom se révolta contre l’autorité de Juda, et se donna un roi » ; Amatsia prit Séla, et Ozias rebâtit Élath sur la mer Rouge, que Retsin reprit sous Achaz."
    - "Des listes assyriennes nomment Qaush-malaka, Aiarammu et Qaush-gabri, rois d’Édom, parmi ceux qui payèrent tribut des années 730 aux années 670 av. J.-C. ; les noms royaux honorent Qaus, le dieu d’Édom. En 587 av. J.-C., les Édomites restèrent spectateurs de la chute de Jérusalem : « Éternel, souviens-toi des enfants d’Édom, qui, dans la journée de Jérusalem, disaient : Rasez, rasez jusqu’à ses fondements ! », et Abdias, Ézéchiel et Malachie les en condamnent. La Chronique de Nabonide semble faire camper le roi babylonien contre Édom en 553/552 av. J.-C., après quoi le royaume s’efface. Des Édomites passèrent dans le Négev au sud d’Hébron, qui devint l’Idumée, et les Arabes puis les Nabatéens prirent leur ancien pays et bâtirent Pétra."
    - "À la fin du IIe siècle av. J.-C., Jean Hyrcan conquit l’Idumée et, dit Josèphe, obligea ses habitants à vivre selon la loi juive ; Hérode le Grand était d’ascendance iduméenne. L’ancien Édom devint une partie de la province romaine d’Arabie en 106 apr. J.-C., et Eusèbe connaissait l’Idumée comme le pays autour de Pétra. Aujourd’hui, c’est le sud de la Jordanie : Tafila, Shawbak et les ruines de Pétra, inscrites par l’UNESCO en 1985, avec le port d’Aqaba à son extrémité sud."
  it:
    - "Edom era la regione collinare a sud del Mar Morto, a est dell’Araba, dallo Zered (Wadi Hasa) verso sud fino al Golfo di Aqaba; la Bibbia la chiama anche Seir, e gli Edomiti «i figliuoli d’Esaù che abitano in Seir». Il nome significa «rosso», dall’arenaria dei suoi monti e, nella Genesi, dalla minestra rossa per cui Esaù vendette la primogenitura. Le sue città erano Bosra (Busayra), Teman e Sela, i cui abitanti, dice Abdia, abitano «fra le spaccature delle rocce»; Sela è collocata da alcuni a Umm el-Biyara sopra Petra e da altri a es-Sela presso Bosra. Le miniere di rame di Faynan nell’Araba furono sfruttate nell’età del Ferro; se un regno vi esistesse già nel X secolo a.C. o solo dall’VIII è controverso."
    - "La Genesi elenca i re «che regnarono nel paese di Edom, prima che alcun re regnasse sui figliuoli d’Israele». Quando Mosè chiese di passare lungo la strada del re, «Edom gli rispose: Tu non passerai sul mio territorio», e Israele si volse altrove; eppure la Legge vietava di aborrire un Edomita, «poich’egli è tuo fratello». Saul combatté Edom, e Davide pose guarnigioni in tutto il paese dopo la strage nella valle del Sale. Ai giorni di Ioram «Edom si ribellò, sottraendosi al giogo di Giuda e si dette un re»; Amazia prese Sela, e Ozia ricostruì Elat sul Mar Rosso, che Resin riconquistò sotto Acaz."
    - "Elenchi assiri nominano Qaush-malaka, Aiarammu e Qaush-gabri, re di Edom, fra quelli che pagarono tributo dagli anni 730 agli anni 670 a.C.; i nomi regali onorano Qaus, il dio di Edom. Nel 587 a.C. gli Edomiti stettero a guardare la caduta di Gerusalemme: «Ricordati, o Eterno, dei figliuoli di Edom, che nel giorno di Gerusalemme dicevano: Spianatela, spianatela, fin dalle fondamenta!», e Abdia, Ezechiele e Malachia li condannano per questo. La Cronaca di Nabonedo sembra far accampare il re babilonese contro Edom nel 553/552 a.C., dopo di che il regno svanisce. Gli Edomiti si spostarono nel Negheb a sud di Ebron, che divenne Idumea, e gli Arabi e poi i Nabatei presero la loro antica terra e costruirono Petra."
    - "Alla fine del II secolo a.C. Giovanni Ircano conquistò l’Idumea e, dice Giuseppe Flavio, fece vivere il suo popolo secondo la legge ebraica; Erode il Grande era di discendenza idumea. L’antica Edom entrò nella provincia romana d’Arabia nel 106 d.C., ed Eusebio conosceva l’Idumea come il paese intorno a Petra. Oggi è il sud della Giordania: Tafila, Shawbak e le rovine di Petra, iscritte dall’UNESCO nel 1985, con il porto di Aqaba all’estremità meridionale."
  pl:
    - "Edom to górski kraj na południe od Morza Martwego, na wschód od Araby, od Zared (Wadi Hasa) ku południowi w stronę Zatoki Akaba; Biblia nazywa go też Seir, a Edomitów — „synów Ezawowych, którzy mieszkają w Seir”. Nazwa znaczy „czerwony”, od piaskowca jego gór oraz, w Księdze Rodzaju, od czerwonej strawy, za którą Ezaw sprzedał pierworództwo. Jego miastami były Bosra (Busajra), Teman i Sela, których mieszkańcy, mówi Abdiasz, mieszkają „w rozpadlinach skalnych”; Selę umieszczają niektórzy w Umm el-Bajjara nad Petrą, a inni w es-Sela koło Bosry. Kopalnie miedzi w Fajnan w Arabie eksploatowano w epoce żelaza; czy królestwo istniało tam już w X w. p.n.e., czy dopiero od VIII, jest sporne."
    - "Księga Rodzaju wymienia królów, „którzy królowali w ziemi Edomskiej, pierwej niż królował król nad syny Izraelskimi”. Gdy Mojżesz prosił o pozwolenie przejścia drogą królewską, „odpowiedział mu Edom: Nie pójdziesz przez moję ziemię”, i Izrael zawrócił; a jednak Prawo zakazało im brzydzić się Edomitą: „Nie będziesz się brzydził Idumejczykiem, bo bratem twoim jest”. Saul walczył z Edomem, a Dawid założył garnizony w całym kraju po rzezi w dolinie Soli. Za dni Jorama „odstąpił Edom, aby nie był pod mocą Judy; i postanowili nad sobą króla”; Amazjasz zdobył Selę, a Uzzjasz odbudował Elat nad Morzem Czerwonym, który odzyskał Resin za Achaza."
    - "Listy asyryjskie wymieniają Kaus-malakę, Ajaramu i Kaus-gabri, królów Edomu, wśród płacących daninę od lat 730. do 670. p.n.e.; imiona królewskie czczą Kausa, boga Edomu. W 587 r. p.n.e. Edomici stali bezczynnie przy upadku Jerozolimy: „Wspomnij, Panie! na synów Edomskich, i na dzień Jeruzalemski, w który mówili: Poburzcie, poburzcie aż do gruntu w nim”, a Abdiasz, Ezechiel i Malachiasz potępiają ich za to. Kronika Nabonida zdaje się mówić, że król babiloński wyruszył przeciw Edomowi w 553/552 r. p.n.e., po czym królestwo gaśnie. Edomici przenieśli się do Negewu na południe od Hebronu, który stał się Idumeą, a Arabowie i potem Nabatejczycy zajęli ich dawny kraj i zbudowali Petrę."
    - "Pod koniec II w. p.n.e. Jan Hyrkan podbił Idumeę i, jak mówi Józef Flawiusz, kazał jej mieszkańcom żyć według prawa żydowskiego; Herod Wielki był pochodzenia idumejskiego. Dawny Edom stał się częścią rzymskiej prowincji Arabii w 106 r. n.e., a Euzebiusz znał Idumeę jako kraj wokół Petry. Dziś jest to południe Jordanii: Tafila, Szaubak i ruiny Petry, wpisane przez UNESCO w 1985 r., z portem Akaba na jej południowym krańcu."
  nl:
    - "Edom was het bergland ten zuiden van de Dode Zee, ten oosten van de Araba, van de Zered (Wadi Hasa) zuidwaarts naar de Golf van Akaba; de Bijbel noemt het ook Seïr, en de Edomieten “de kinderen van Ezau, die in Seir wonen”. De naam betekent “rood”, naar het zandsteen van zijn bergen en, in Genesis, naar het rode gerecht waarvoor Ezau zijn eerstgeboorterecht verkocht. Zijn steden waren Bozra (Busayra), Teman en Sela, wier bewoners volgens Obadja wonen “in de kloven der steenrotsen”; Sela wordt door sommigen bij Umm el-Biyara boven Petra geplaatst, door anderen bij es-Sela nabij Bozra. De kopermijnen van Faynan in de Araba werden in de IJzertijd bewerkt; of er al in de tiende eeuw v.Chr. een koninkrijk bestond of pas vanaf de achtste, is omstreden."
    - "Genesis somt de koningen op “die geregeerd hebben in het land Edom, eer een koning regeerde over de kinderen Israëls”. Toen Mozes vroeg over de koningsweg te mogen trekken, luidde het antwoord: “Doch Edom zeide tot hem: Gij zult door mij niet trekken”, en Israël week uit; toch verbood de Wet een Edomiet te verafschuwen, “want hij is uw broeder”. Saul bestreed Edom, en David legde na de slachting in het zoutdal bezettingen in heel het land. In Jorams dagen “vielen de Edomieten van onder het gebied van Juda af, en maakten een koning over zich”; Amazia nam Sela, en Uzzia herbouwde Elat aan de Rode Zee, dat Rezin onder Achaz terugwon."
    - "Assyrische lijsten noemen Qaus-malaka, Aiarammu en Qaus-gabri, koningen van Edom, onder hen die schatting betaalden van de jaren 730 tot 670 v.Chr.; de koningsnamen eren Qaus, de god van Edom. In 587 v.Chr. stonden de Edomieten erbij bij de val van Jeruzalem: “HEERE! gedenk aan de kinderen van Edom, aan den dag van Jeruzalem; die daar zeiden: Ontbloot ze, ontbloot ze”, en Obadja, Ezechiël en Maleachi veroordelen hen daarom. De Kroniek van Nabonidus lijkt de Babylonische koning in 553/552 v.Chr. tegen Edom te laten kamperen, waarna het koninkrijk vervaagt. Edomieten trokken naar de Negev ten zuiden van Hebron, dat Idumea werd, en Arabieren en daarna de Nabateeërs namen hun oude land en bouwden Petra."
    - "In de late tweede eeuw v.Chr. veroverde Johannes Hyrcanus Idumea en liet, zegt Josephus, zijn bewoners volgens de Joodse wet leven; Herodes de Grote was van Idumese afkomst. Het oude Edom werd in 106 n.Chr. deel van de Romeinse provincie Arabië, en Eusebius kende Idumea als het land rond Petra. Nu is het het zuiden van Jordanië: Tafila, Shawbak en de ruïnes van Petra, in 1985 door UNESCO ingeschreven, met de haven Akaba aan het zuideinde."
  cs:
    - "Edóm byl pahorkatinou jižně od Mrtvého moře, východně od Araby, od Zeredu (Wadi Hasa) na jih směrem k Akabskému zálivu; Bible jej nazývá také Seír a o jeho obyvatelích mluví jako o lidu „synů Ezau, kteříž bydlí v Seir“. Jméno znamená „červený“, podle pískovce jeho hor a v Genesi podle červené krmě, za niž Ezau prodal své prvorozenství. Jeho městy byly Bosra (Busayra), Témán a Sela, jejichž lid, praví Obadjáš, bydlí „v rozsedlinách skalních“; Sela se klade jedněmi do Umm el-Biyara nad Petrou, jinými do es-Sela u Bosry. Měděné doly Faynanu v Arabě se těžily v době železné; zda tam království existovalo již v 10. století př. n. l., nebo teprve od 8., je sporné."
    - "Genesis uvádí krále, „kteříž kralovali v zemi Idumejské, prvé než kraloval král nad syny Izraelskými“. Když Mojžíš žádal o povolení projít po královské cestě, Edóm mu odpověděl: „Nechoď skrze mou zemi“ a Izrael se odvrátil; přece však Zákon zakazoval mít Edómce v ohavnosti: „Nebudeš míti v ohavnosti Idumejského, nebo bratr tvůj jest“. Saul bojoval s Edómem a David osadil posádkami celou zemi po porážce v údolí solném. Za dnů Jorama „odstoupil Edom od království Judského, a ustanovili nad sebou krále“; Amacjáš dobyl Selu a Uzijáš znovu vystavěl Élat na Rudém moři, který Resín zase získal za Achaze."
    - "Asyrské seznamy jmenují Qaush-malaku, Aiarammua a Qaush-gabriho, krále Edómu, mezi těmi, kdo platili tribut od 730. do 670. let př. n. l.; královská jména ctí Qause, boha Edómu. Roku 587 př. n. l. stáli Edómci stranou při pádu Jeruzaléma: „Rozpomeň se, Hospodine, na Idumejské, a na den Jeruzaléma, kteříž pravili: Rozbořte, rozbořte až do základů v něm“ a Obadjáš, Ezechiel a Malachiáš je za to odsuzují. Nabonidova kronika zřejmě uvádí, že babylónský král se utábořil proti Edómu v letech 553/552 př. n. l., načež království mizí. Edómci se přesunuli do Negevu jižně od Hebronu, který se stal Idumeou, a Arabové a pak Nabatejci převzali jejich starou zemi a vybudovali Petru."
    - "Koncem 2. století př. n. l. dobyl Jan Hyrkanos Idumeu a podle Josepha přinutil její lid žít podle židovského zákona; Herodes Veliký byl idumejského původu. Starý Edóm se roku 106 n. l. stal součástí římské provincie Arábie a Eusebios znal Idumeu jako zemi kolem Petry. Dnes je to jih Jordánska: Tafila, Shawbak a zříceniny Petry, zapsané UNESCO roku 1985, s přístavem Akaba na jižním konci."
