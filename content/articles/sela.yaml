body:
  en:
    - "Sela, “the rock”, is used in the Bible both as a common noun and as the name of an Edomite stronghold, and it is not always clear which is meant. Judges draws the Amorite border “from the going up to Akrabbim, from the rock, and upward”, where the Hebrew reads “from Sela”; and after Amaziah of Judah had killed ten thousand Edomites in the Valley of Salt, his men took another ten thousand captive and “brought them unto the top of the rock, and cast them down from the top of the rock, that they all were broken in pieces”. The parallel in Kings says that Amaziah “took Selah by war, and called the name of it Joktheel”, so the rock of Chronicles is most naturally that Sela, the Edomite fortress. The map keeps the two apart; this entry covers the verses in Judges and Chronicles."
    - "Where the Edomite Sela was is disputed. The old identification is with Petra, the Nabataean city whose Greek name also means “rock”, and in particular with the sheer-sided massif of Umm el-Biyara above it; many now prefer es-Sela, a rock-cut stronghold near Buseirah (Bozrah) in the Tafila governorate of Jordan, on whose cliff a relief and inscription of Nabonidus, king of Babylon, were published in 1997. For the border of Judges, which runs from the ascent of Akrabbim south of the Dead Sea, a rock nearer that pass has also been suggested, and the map shows both possibilities. Petra, Umm el-Biyara and es-Sela are all in southern Jordan; es-Sela has been surveyed in recent years, but Amaziah's rock has not been identified on the ground."
  ru:
    - "Села, «скала», употребляется в Библии и как нарицательное слово, и как имя едомской твердыни, и не всегда ясно, что имеется в виду. Книга Судей проводит границу аморреев «от возвышенности Акравим и от Селы», где русский перевод оставил имя как есть; а после того как Амасия Иудейский перебил десять тысяч идумеев в долине Соляной, его люди взяли ещё десять тысяч в плен, «и привели их на вершину скалы, и низринули их с вершины скалы, и все они разбились совершенно». Параллельное место в книге Царств говорит, что Амасия «взял Селу войною, и дал ей имя Иокфеил», так что скала Паралипоменон — скорее всего та самая Села, крепость едомлян. На карте их держат врозь; эта статья охватывает стихи Судей и Паралипоменон."
    - "Где стояла едомская Села, спорно. Старое отождествление — с Петрой, набатейским городом, чьё греческое имя тоже значит «скала», и особенно с отвесным массивом Умм-эль-Бияра над ней; ныне многие предпочитают Эс-Селу, вырубленную в скале крепость близ Бусейры (Восора) в иорданской провинции Эт-Тафила, на утёсе которой находятся рельеф и надпись Набонида, царя Вавилона, опубликованные в 1997 году. Для границы из книги Судей, идущей от подъёма Акравим к югу от Мёртвого моря, предлагали и скалу поближе к этому перевалу, и на карте показаны обе возможности. Петра, Умм-эль-Бияра и Эс-Села лежат на юге Иордании; Эс-Селу в последние годы обследовали, но скала Амасии на местности не опознана."
  uk:
    - "Села, «скеля», вживається в Біблії і як загальний іменник, і як назва едомської твердині, і не завжди ясно, яке значення мається на увазі. Книга Суддів проводить кордон амореїв від Акраббіма, «від скелі» й угору, де в івриті стоїть «від Сели» (у Біблії Куліша: «від Скорпийонового проходу далеко в гори»); а коли Амасія Юдейський убив десять тисяч едомітян у Солоній долині, його люди взяли в полон ще десять тисяч і «вивели їх на верх скелї, та й поскидали їх з верха скелї, і всї вони порозбивались». Паралельне місце в Царів каже, що Амасія «завоював Селу, й назвав її Йоктеїл», тож скеля Хронік найприродніше є тією Селою, едомською фортецею. Карта розрізняє їх; ця стаття охоплює вірші Суддів і Хронік."
    - "Де була едомська Села, є спірним. Давнє ототожнення — з Петрою, набатейським містом, чия грецька назва також означає «скеля», і зокрема з урвистим масивом Умм-ель-Бійара над нею; багато хто нині віддає перевагу ес-Селі, висіченій у скелі твердині поблизу Бусейри (Боцри) в мухафазі Тафіла в Йорданії, на скелі якої є рельєф і напис Набоніда, царя Вавилона, опубліковані 1997 р.. Для кордону Суддів, що йде від підйому Акраббім на південь від Мертвого моря, запропоновано також скелю ближче до цього перевалу, і карта показує обидві можливості. Петра, Умм-ель-Бійара та ес-Села лежать на півдні Йорданії; ес-Села обстежувалася в останні роки, але скелю Амасії на місцевості не виявлено."
  es:
    - "Sela, «la roca», se usa en la Biblia tanto como nombre común como nombre de una fortaleza edomita, y no siempre está claro cuál se quiere decir. Jueces traza la frontera amorrea «desde la subida de Acrabim, desde la piedra, y arriba», donde el hebreo lee «desde Sela»; y después de que Amasías de Judá matara a diez mil edomitas en el Valle de la Sal, sus hombres tomaron vivos a otros diez mil «los cuales llevaron á la cumbre de un peñasco, y de allí los despeñaron, y todos se hicieron pedazos». El paralelo de Reyes dice que Amasías «tomó á Sela por guerra, y llamóla Jocteel», de modo que la roca de Crónicas es con mayor naturalidad esa Sela, la fortaleza edomita. El mapa mantiene separadas las dos; esta entrada trata los versículos de Jueces y Crónicas."
    - "Dónde estaba la Sela edomita se discute. La identificación antigua es con Petra, la ciudad nabatea cuyo nombre griego significa también «roca», y en particular con el macizo de laderas verticales de Umm el-Biyara que la domina; muchos prefieren hoy es-Sela, una fortaleza excavada en la roca cerca de Buseirah (Bosra), en la gobernación jordana de Tafila, en cuyo acantilado hay un relieve y una inscripción de Nabonido, rey de Babilonia, publicados en 1997. Para la frontera de Jueces, que corre desde la subida de Acrabim, al sur del mar Muerto, se ha sugerido también una roca más cercana a ese paso, y el mapa muestra ambas posibilidades. Petra, Umm el-Biyara y es-Sela están todas en el sur de Jordania; es-Sela ha sido prospectada en los últimos años, pero la roca de Amasías no ha sido identificada sobre el terreno."
  pt:
    - "Sela, “a rocha”, é usada na Bíblia tanto como substantivo comum quanto como nome de uma fortaleza edomita, e nem sempre fica claro qual se tem em vista. Juízes traça a fronteira amorreia “desde a subida de Acrabim, desde a rocha, e para cima”, onde o hebraico lê “desde Sela”; e depois que Amazias de Judá matou dez mil edomitas no Vale do Sal, seus homens levaram outros dez mil cativos e “os trouxeram para o topo da rocha, e os atiraram para baixo do topo da rocha, de modo que todos foram despedaçados”. O paralelo em Reis diz que Amazias “tomou Sela na guerra, e a chamou de Jocteel”, de modo que a rocha de Crônicas é, mais naturalmente, essa Sela, a fortaleza edomita. O mapa mantém as duas separadas; este verbete cobre os versículos de Juízes e Crônicas."
    - "Onde ficava a Sela edomita é disputado. A identificação antiga é com Petra, a cidade nabateia cujo nome grego também significa “rocha”, e em particular com o maciço de paredes verticais de Umm el-Biyara acima dela; muitos preferem hoje es-Sela, uma fortaleza escavada na rocha perto de Buseirah (Bosra), na província de Tafila, na Jordânia, em cujo penhasco um relevo e uma inscrição de Nabonido, rei da Babilônia, foram publicados em 1997. Para a fronteira de Juízes, que parte da subida de Acrabim ao sul do Mar Morto, também se sugeriu uma rocha mais perto dessa passagem, e o mapa mostra as duas possibilidades. Petra, Umm el-Biyara e es-Sela ficam todas no sul da Jordânia; es-Sela foi prospectada nos últimos anos, mas a rocha de Amazias não foi identificada no terreno."
  de:
    - "Sela, „der Fels“, wird in der Bibel sowohl als Gattungswort wie als Name einer edomitischen Festung gebraucht, und nicht immer ist klar, was gemeint ist. Die Richter ziehen die Amoritergrenze „da man nach Akrabbim hinaufgeht, von dem Fels an und weiter hinauf“, wo der hebräische Text „von Sela“ liest; und nachdem Amazja von Juda im Salztal zehntausend Edomiter erschlagen hatte, fingen seine Männer weitere zehntausend lebendig, „führten sie auf die Spitze eines Felsen und stürzten sie von der Spitze des Felsens, daß sie alle zerbarsten“. Die Parallele in den Königen sagt, Amazja „gewann die Stadt Sela mit Streit und hieß sie Joktheel“, sodass der Fels der Chronik am ehesten jenes Sela ist, die edomitische Festung. Die Karte hält beides getrennt; dieser Eintrag behandelt die Verse in Richter und Chronik."
    - "Wo das edomitische Sela lag, ist umstritten. Die alte Gleichsetzung ist mit Petra, der nabatäischen Stadt, deren griechischer Name ebenfalls „Fels“ bedeutet, und insbesondere mit dem steilwandigen Massiv Umm el-Biyara darüber; viele bevorzugen heute es-Sela, eine in den Fels gehauene Festung nahe Buseira (Bozra) im jordanischen Gouvernement Tafila, an deren Felswand ein Relief und eine Inschrift Nabonids, des Königs von Babylon, sind, die 1997 veröffentlicht wurden. Für die Grenze der Richter, die vom Aufstieg von Akrabbim südlich des Toten Meeres verläuft, wurde auch ein Fels näher an diesem Pass vorgeschlagen, und die Karte zeigt beide Möglichkeiten. Petra, Umm el-Biyara und es-Sela liegen alle in Südjordanien; es-Sela wurde in den letzten Jahren vermessen, doch Amazjas Fels ist vor Ort nicht identifiziert."
  fr:
    - "Séla, « le rocher », est employé dans la Bible à la fois comme nom commun et comme nom d’une forteresse édomite, et l’on ne voit pas toujours lequel est visé. Les Juges tracent la frontière amoréenne « depuis la montée d’Akrabbim, depuis Séla, et en dessus », où la King James rend le mot par « the rock » ; et après qu’Amatsia de Juda eut tué dix mille Édomites dans la vallée du Sel, ses hommes en saisirent dix mille autres vivants, « qu’ils menèrent au sommet d’un rocher, d’où ils les précipitèrent ; et tous furent écrasés ». Le parallèle des Rois dit qu’Amatsia, « durant la guerre, prit Séla, et l’appela Joktheel », de sorte que le rocher des Chroniques est le plus naturellement cette Séla, la forteresse édomite. La carte garde les deux séparés ; cette notice couvre les versets des Juges et des Chroniques."
    - "L’emplacement de la Séla édomite est disputé. L’ancienne identification est avec Pétra, la ville nabatéenne dont le nom grec signifie aussi « rocher », et en particulier avec le massif à parois verticales d’Umm el-Biyara au-dessus d’elle ; beaucoup préfèrent aujourd’hui es-Sela, forteresse taillée dans le roc près de Buseirah (Botsra), dans le gouvernorat de Tafila, en Jordanie, sur la falaise de laquelle un relief et une inscription de Nabonide, roi de Babylone, ont été publiés en 1997. Pour la frontière des Juges, qui court de la montée d’Akrabbim au sud de la mer Morte, un rocher plus proche de ce col a aussi été suggéré, et la carte montre les deux possibilités. Pétra, Umm el-Biyara et es-Sela sont toutes dans le sud de la Jordanie ; es-Sela a été prospectée ces dernières années, mais le rocher d’Amatsia n’a pas été identifié sur le terrain."
  it:
    - "Sela, «la roccia», è usata nella Bibbia sia come nome comune sia come nome di una roccaforte edomita, e non è sempre chiaro quale sia inteso. I Giudici tracciano il confine amorreo «dalla salita di Akrabbim, movendo da Sela, e su verso il nord», dove l’ebraico legge «da Sela»; e dopo che Amazia di Giuda ebbe ucciso diecimila Edomiti nella Valle del Sale, i suoi uomini ne catturarono altri diecimila e «li menarono in cima alla Ròcca, e li precipitaron giù dall’alto della Ròcca, sì che tutti rimasero sfracellati». Il passo parallelo dei Re dice che Amazia «prese Sela e le dette il nome di Joktheel», per cui la Ròcca delle Cronache è molto naturalmente quella Sela, la fortezza edomita. La mappa tiene separate le due; questa voce copre i versetti dei Giudici e delle Cronache."
    - "Dove fosse la Sela edomita è controverso. L’identificazione antica è con Petra, la città nabatea il cui nome greco significa anch’esso «roccia», e in particolare con il massiccio dai fianchi scoscesi di Umm el-Biyara che la sovrasta; molti ora preferiscono es-Sela, una roccaforte scavata nella roccia presso Buseirah (Bosra) nel governatorato di Tafila in Giordania, sulla cui parete si trovano un rilievo e un’iscrizione di Nabonedo, re di Babilonia, pubblicati nel 1997. Per il confine dei Giudici, che parte dalla salita di Akrabbim a sud del Mar Morto, è stata suggerita anche una roccia più vicina a quel passo, e la mappa mostra entrambe le possibilità. Petra, Umm el-Biyara ed es-Sela sono tutte nella Giordania meridionale; es-Sela è stata oggetto di ricognizioni negli ultimi anni, ma la roccia di Amazia non è stata identificata sul terreno."
  pl:
    - "Sela, „skała”, występuje w Biblii zarówno jako rzeczownik pospolity, jak i jako nazwa edomickiej twierdzy, i nie zawsze jest jasne, o które chodzi. Księga Sędziów prowadzi granicę Amorytów „od góry, gdzie wstępują do niedźwiadków, od skały ich i wyżej”, gdzie tekst hebrajski ma „od Sela”; a gdy Amazjasz z Judy zabił dziesięć tysięcy Edomitów w Dolinie Soli, jego ludzie wzięli żywcem drugie dziesięć tysięcy i „przywiedli ich na wierzch skały, i zrzucili ich z wierzchu skały, aż się wszyscy porozpukali”. Paralela w Księgach Królewskich mówi, że Amazjasz „wziął mocą Selę, a nazwał imię jej Jokteel”, więc skała z Kronik jest najprościej tą Selą, edomicką twierdzą. Mapa trzyma je osobno; to hasło obejmuje wersety z Księgi Sędziów i Kronik."
    - "Gdzie leżała edomicka Sela, jest sporne. Dawne utożsamienie to Petra, nabatejskie miasto, którego greckie imię też znaczy „skała”, a zwłaszcza o stromych ścianach masyw Umm el-Bijara nad nią; wielu woli dziś es-Sela, skalną twierdzę koło Buseiry (Bosry) w muhafazie Tafila w Jordanii, na której skale są relief i napis Nabonida, króla Babilonu, opublikowane w 1997 roku. Dla granicy z Księgi Sędziów, biegnącej od wzniesienia Akrabbim na południe od Morza Martwego, proponowano też skałę bliższą tej przełęczy, a mapa pokazuje obie możliwości. Petra, Umm el-Bijara i es-Sela leżą w południowej Jordanii; es-Sela badano w ostatnich latach, lecz skała Amazjasza nie została zidentyfikowana w terenie."
  cs:
    - "Sela, „skála“, se v Bibli užívá jak jako obecné jméno, tak jako jméno edomské pevnosti, a nejde vždy poznat, co se myslí. Kniha Soudců vede amorejskou hranici „od začátku hor Akrabim, od skály jejich i výše“, kde hebrejsky stojí „od Sely“; a poté, co Amacjáš Judský pobil deset tisíc Edomských v Solném údolí, jeho muži zajali dalších deset tisíc a „vedli na vrch skály, a sházeli je s vrchu té skály, tak že se všickni zrozráželi“. Paralela v Královských praví, že Amacjáš „dobyl Sela bojem. I nazval jméno jeho Jektehel až do tohoto dne“, takže skála Kronik je nejpřirozeněji ta Sela, edomská pevnost. Mapa je ponechává oddělené; toto heslo pokrývá verše v Soudcích a Kronikách."
    - "Kde edomská Sela byla, je sporné. Staré ztotožnění je s Petrou, nabatejským městem, jehož řecké jméno také znamená „skála“, a zvláště s masivem Umm el-Bijára nad ním se strmými stěnami; mnozí dnes dávají přednost es-Sele, skalní pevnosti poblíž Buseiry (Bosry) v guvernorátu Tafíla v Jordánsku, na jejíž skále je reliéf a nápis Nabonida, krále Babylónu, publikovaný roku 1997. Pro hranici Soudců, která vede od výstupu Akrabím jižně od Mrtvého moře, byla navržena i skála blíže tomuto průsmyku a mapa ukazuje obě možnosti. Petra, Umm el-Bijára i es-Sela leží v jižním Jordánsku; es-Sela byla v posledních letech prozkoumána, ale Amacjášova skála nebyla na zemi určena."
  nl:
    - "Sela, “de rots”, wordt in de Bijbel zowel als soortnaam gebruikt als de naam van een Edomitische vesting, en het is niet altijd duidelijk welke bedoeld is. Richteren trekt de Amorietische grens “van den opgang van Akrabbim, van den rotssteen, en opwaarts heen”, waar het Hebreeuws “van Sela” leest; en nadat Amazia van Juda tienduizend Edomieten in het Zoutdal had gedood, namen zijn mannen nog tienduizend gevangen en “brachten ze op de hoogte der steenrots, en stieten hen van de spits der steenrots af, dat zij allen barstten”. De parallel in Koningen zegt van Amazia: “nam Sela in met krijg, en noemde haar naam Jokteel”; de rots van Kronieken is dus het natuurlijkst te zien als dat Sela, de Edomitische vesting. De kaart houdt de twee gescheiden; dit artikel behandelt de verzen in Richteren en Kronieken."
    - "Waar het Edomitische Sela lag, is omstreden. De oude identificatie is met Petra, de Nabateese stad wier Griekse naam ook “rots” betekent, en in het bijzonder met het steile massief van Umm el-Biyara erboven; velen geven nu de voorkeur aan es-Sela, een uit de rots gehouwen vesting bij Buseirah (Bozra) in het gouvernement Tafila in Jordanië, op welks klif een reliëf en opschrift van Nabonidus, koning van Babylon, staan, die in 1997 werden gepubliceerd. Voor de grens van Richteren, die van de klim van Akrabbim ten zuiden van de Dode Zee loopt, is ook een rots dichter bij die pas voorgesteld, en de kaart toont beide mogelijkheden. Petra, Umm el-Biyara en es-Sela liggen alle in het zuiden van Jordanië; es-Sela is de laatste jaren onderzocht, maar Amazia’s rots is op de grond niet geïdentificeerd."
  sv:
    - "Sela, ”klippan”, används i Bibeln både som substantiv och som namn på en edomitisk fästning, och det är inte alltid klart vilket som avses. Domarboken drar amoréernas gräns ”från Skorpionhöjden, från Sela vidare uppåt”; och sedan Amasja av Juda dödat tio tusen edoméer i Saltdalen tog hans män ytterligare tio tusen till fånga, ”dem förde de upp på spetsen av en klippa och störtade dem ned från klippspetsen, så att de alla krossades”. Parallellen i Konungaböckerna säger att Amasja ”intog Sela med strid och gav det namnet Jokteel”, så klippan i Krönikeböckerna är mest naturligt det Sela, den edomitiska fästningen. Kartan håller de två isär; denna artikel behandlar verserna i Domarboken och Krönikeböckerna."
    - "Var edomiternas Sela låg är omstritt. Den gamla identifikationen är med Petra, den nabatéiska staden vars grekiska namn också betyder ”klippa”, och särskilt med det branta massivet Umm el-Biyara ovanför den; många föredrar nu es-Sela, en klipphuggen fästning nära Buseirah (Bosra) i guvernementet Tafila i Jordanien, på vars klippvägg en relief och en inskription av Nabonid, kung av Babylon, publicerades 1997. För gränsen i Domarboken, som löper från Akrabbims uppstigning söder om Döda havet, har också en klippa närmare det passet föreslagits, och kartan visar båda möjligheterna. Petra, Umm el-Biyara och es-Sela ligger alla i södra Jordanien; es-Sela har undersökts de senaste åren, men Amasjas klippa har inte identifierats på marken."
  nb:
    - "Sela, «klippen», brukes i Bibelen både som fellesnavn og som navnet på en edomittisk festning, og det er ikke alltid klart hvilket som menes. Dommernes bok trekker amorittenes grense «fra Akrabbim-skaret, fra Hassela og opefter», der hebraisk lyder «fra Sela»; og etter at Amasja av Juda hadde drept ti tusen edomitter i Saltdalen, tok hans menn ytterligere ti tusen til fange og «førte dem op på toppen av en klippe og styrtet dem ned derfra, så de alle knustes». Parallellen i Kongebøkene sier at Amasja «inntok Sela og kalte det Jokte'el», så klippen i Krønikebøkene er mest naturlig det Sela, den edomittiske festningen. Kartet holder de to fra hverandre; denne artikkelen dekker versene i Dommernes bok og Krønikebøkene."
    - "Hvor det edomittiske Sela lå, er omstridt. Den gamle identifikasjonen er med Petra, den nabateiske byen hvis greske navn også betyr «klippe», og særlig med det steilsidige massivet Umm el-Biyara over den; mange foretrekker nå es-Sela, en bergskåret festning nær Buseirah (Bosra) i guvernementet Tafila i Jordan, på hvis klippevegg et relieff og en inskripsjon av Nabonid, Babylons konge, ble publisert i 1997. For grensen i Dommernes bok, som løper fra oppstigningen til Akrabbim sør for Dødehavet, er også en klippe nærmere det passet foreslått, og kartet viser begge muligheter. Petra, Umm el-Biyara og es-Sela ligger alle i sørlige Jordan; es-Sela er kartlagt de siste årene, men Amasjas klippe er ikke identifisert på bakken."
  tl:
    - "Ang Sela, “ang bato”, ay ginagamit sa Bibliya bilang karaniwang pangngalan at pangalan ng kutang Edomita, at hindi laging malinaw kung alin ang tinutukoy. Iginuhit ng Mga Hukom ang hangganan ng mga Amorrheo “mula sa sampahan ng Acrabim, buhat sa batuhan, at paitaas”, kung saan ang Hebreo ay bumabasa ng “mula sa Sela”; at matapos patayin ni Amasias ng Juda ang sampung libong Edomita sa Libis ng Asin, binihag ng kaniyang mga tauhan ang sampung libo pa at “dinala sila sa taluktok ng burol at inihagis sila mula sa taluktok ng burol na anopa't silang lahat ay nagkawaraywaray”. Sinasabi ng katapat sa Mga Hari na “sinakop ang Sela sa pakikipagdigma, at pinanganlang Jocteel”, kaya pinakamadaling ituring na Sela ang bato ng Mga Cronica, ang kutang Edomita. Pinaghihiwalay ng mapa ang dalawa; saklaw ng artikulong ito ang mga talata sa Mga Hukom at Mga Cronica."
    - "Pinagtatalunan kung saan ang Sela ng mga Edomita. Ang lumang pagkilala ay sa Petra, ang lungsod ng mga Nabateo na ang pangalang Griyego ay nangangahulugan ding “bato”, at lalo na sa kabundukang may matatarik na gilid ng Umm el-Biyara sa itaas nito; marami na ngayon ang mas gusto ang es-Sela, isang kutang tinabas sa bato malapit sa Buseirah (Bozra) sa gobernorato ng Tafila ng Jordan, na ang isang relyebo at inskripsiyon ni Nabonidus, hari ng Babilonia, sa bangin nito ay inilathala noong 1997. Para sa hangganan ng Mga Hukom, na tumatakbo mula sa pag-akyat ng Acrabbim sa timog ng Dagat na Patay, iminungkahi rin ang isang batong mas malapit sa daanang iyon, at ipinapakita ng mapa ang dalawang posibilidad. Ang Petra, Umm el-Biyara at es-Sela ay pawang nasa timog Jordan; sinuri ang es-Sela sa mga nakaraang taon, ngunit hindi pa natutukoy sa lupa ang bato ni Amasias."
  da:
    - "Sela, »klippen«, bruges i Bibelen både som fællesnavn og som navn på en edomitisk fæstning, og det er ikke altid klart, hvilket der menes. Dommerbogen trækker amoritternes grænse »fra Opgangen til Akrabbim, fra Klippen og op efter«, hvor hebraisk læser »fra Sela«; og efter at Amazja af Juda havde dræbt ti tusind edomitter i Saltdalen, tog hans mænd yderligere ti tusind til fange og »førte dem op paa Klippens Top, og de kastede dem ned fra Klippens Top, saa de alle sammen bleve knuste«. Parallellen i Kongebøgerne siger, at Amazja »indtog Sela i samme Krig og kaldte dens Navn Jokthel«, så Krønikebøgernes klippe er mest naturligt det Sela, den edomitiske fæstning. Kortet holder de to adskilt; denne artikel dækker versene i Dommerbogen og Krønikebøgerne."
    - "Hvor det edomitiske Sela lå, er omstridt. Den gamle identifikation er med Petra, den nabatæiske by, hvis græske navn også betyder »klippe«, og især med det lodrette massiv Umm el-Biyara over den; mange foretrækker nu es-Sela, en klippehugget fæstning nær Buseira (Bosra) i Tafila-guvernementet i Jordan, på hvis klippe et relief og en indskrift af Nabonid, Babylons konge, blev offentliggjort i 1997. For grænsen i Dommerbogen, der løber fra opstigningen til Akrabbim syd for Det Døde Hav, er en klippe nærmere det pas også blevet foreslået, og kortet viser begge muligheder. Petra, Umm el-Biyara og es-Sela ligger alle i det sydlige Jordan; es-Sela er blevet undersøgt i de senere år, men Amazjas klippe er ikke identificeret på stedet."
  sr:
    - "Села, „стена“, у Библији се употребљава и као заједничка именица и као име едомске тврђаве, и није увек јасно која се мисли. Судије повлаче аморејску границу „од горе акравимске, од стене па навише“, где хебрејски чита „од Села“; а пошто је Амасија Јудин побио десет хиљада Едомаца у Долини сланој, његови људи заробили су још десет хиљада и „одведоше их на врх стене, и побацаше их са врх стене да се сви распадоше“. Паралела у Књигама о царевима каже за Амасију: „узе Селу ратом, и прозва је Јоктеил“, па је стена из Летописа најприродније та Села, едомска тврђава. Карта их држи одвојено; овај унос обухвата стихове у Судијама и Летописима."
    - "Где је била едомска Села, спорно је. Старо поистовећење је с Петром, набатејским градом чије грчко име такође значи „стена“, а посебно са стрмо одсеченим масивом Ум ел-Бијаре изнад ње; многи сада више воле ес-Селу, у стени усечену тврђаву близу Бусејре (Восора) у гувернорату Тафила у Јордану, на чијој литици су 1997. објављени рељеф и натпис Набонида, цара Вавилона. За границу из Судија, која иде од успона Акравима јужно од Мртвог мора, предложена је и стена ближе том превоју, а карта приказује обе могућности. Петра, Ум ел-Бијара и ес-Села све су у јужном Јордану; ес-Села је последњих година прегледана, али Амасијина стена на терену није идентификована."
  hu:
    - "Szela, „a szikla”, a Bibliában köznévként és egy edomita erődítmény neveként is szerepel, és nem mindig világos, melyiket értik. A Bírák könyve az emoreus határt „Akrabbim hágójától és Sélától fölfelé” húzza, ahol a héber „Szelától” áll; és miután Amácja, Júda királya a Sóvölgyben tízezer edomitát megölt, emberei másik tízezret fogtak el, és „egy magas kőszikla tetejére vivének, és letaszították őket a magas kőszikláról, és mindnyájan összeroncsoltattak”. A Királyok könyvének párhuzamos helye szerint Amácja „bevette Sélát ostrommal, és ezt nevezé Jokteélnek”, így a Krónikák sziklája legtermészetesebben az a Szela, az edomita erőd. A térkép külön tartja a kettőt; ez a bejegyzés a Bírák és a Krónikák verseit fedi."
    - "Hogy hol volt az edomita Szela, vitatott. A régi azonosítás Petrával van, a nabateus várossal, amelynek görög neve is „sziklát” jelent, és különösen a fölötte álló, meredek oldalú Umm el-Biyara tömbbel; sokan ma inkább az es-Selát részesítik előnyben, egy sziklába vájt erődöt Boszra közelében Jordánia Tafila kormányzóságában, amelynek sziklafalán Nabonidusz, Babilon királya domborművét és feliratát 1997-ben publikálták. A Bírák könyvének határára, amely az Akrabbim felvezető útjától fut a Holt-tengertől délre, ahhoz a hágóhoz közelebbi sziklát is javasoltak, és a térkép mindkét lehetőséget mutatja. Petra, Umm el-Biyara és es-Sela mind Dél-Jordániában van; es-Selát az utóbbi években felmérték, de Amácja sziklája a terepen nem azonosított."
  fi:
    - "Sela, ”kallio”, on Raamatussa sekä yleisnimi että edomilaisen linnakkeen nimi, eikä aina ole selvää, kumpaa tarkoitetaan. Tuomarien kirja vetää amorilaisten rajan: ”Skorpionisolasta, Seelasta, ylöspäin”, missä heprea lukee ”Selasta”; ja kun Juudan Amasja oli surmannut kymmenentuhatta edomilaista Suolalaaksossa, hänen miehensä ottivat vielä kymmenentuhatta vangiksi: ”Nämä he veivät kallion laelle ja syöksivät heidät kallion laelta alas, niin että he kaikki ruhjoutuivat”. Kuninkaiden kirjojen rinnakkaiskohta sanoo Amasjan ”valloittaneen Seelan asevoimalla ja antaneen sille nimen Jokteel”, joten Aikakirjojen kallio on luontevimmin tuo Sela, edomilainen linnake. Kartta pitää nämä kaksi erillään; tämä merkintä kattaa Tuomarien kirjan ja Aikakirjojen jakeet."
    - "Missä edomilainen Sela oli, on kiistanalaista. Vanha tunnistus on Petra, nabatealainen kaupunki, jonka kreikkalainen nimikin merkitsee ”kalliota”, ja erityisesti sen yläpuolella oleva jyrkkäseinäinen Umm el-Biyara -massiivi; monet pitävät nyt parempana es-Selaa, kallioon hakattua linnaketta Buseirahin (Bosran) lähellä Jordanian Tafilan kuvernementissa, jonka kalliolla Babylonin kuninkaan Nabonidin reliefi ja kirjoitus julkaistiin 1997. Tuomarien kirjan rajaa varten, joka kulkee Kuolleenmeren eteläpuolisesta Akrabbimin noususta, on ehdotettu myös lähempänä sitä solaa olevaa kalliota, ja kartta näyttää molemmat mahdollisuudet. Petra, Umm el-Biyara ja es-Sela ovat kaikki Etelä-Jordaniassa; es-Selaa on kartoitettu viime vuosina, mutta Amasjan kalliota ei ole tunnistettu maastossa."
  vi:
    - "Sê-la, “tảng đá”, được dùng trong Kinh Thánh cả như danh từ chung và như tên một thành lũy của Ê-đôm, và không phải lúc nào cũng rõ là nghĩa nào. Sách Các Quan Xét vạch biên giới A-mô-rít “chạy từ dốc Ạc-ráp-bim, từ Sê-la trở lên”, nơi bản Hê-bơ-rơ đọc “từ Sê-la”; và sau khi A-ma-xia của Giu-đa giết mười nghìn người Ê-đôm ở Trũng Muối, người của ông bắt thêm mười nghìn người và “đem chúng nó lên trên chót hòn đá, rồi từ trên chót hòn đá xô chúng nó xuống, thảy đều bị giập chết hết”. Câu song song trong sách Các Vua nói A-ma-xia “hãm lấy thành Sê-la, và đặt tên là Giốc-then, hãy còn đến ngày nay”, nên hòn đá của sách Sử Ký tự nhiên nhất là Sê-la ấy, thành lũy Ê-đôm. Bản đồ giữ hai nơi riêng; mục này bàn các câu trong Các Quan Xét và Sử Ký."
    - "Sê-la của Ê-đôm nằm đâu còn tranh luận. Sự đồng nhất cũ là với Petra, thành Nabataea mà tên Hy Lạp cũng có nghĩa “tảng đá”, và đặc biệt với khối núi vách thẳng Umm el-Biyara phía trên; nhiều người nay ưa es-Sela, một thành lũy đục trong đá gần Buseirah (Bốt-ra) trong tỉnh Tafila của Jordan, trên vách đá của nó có một phù điêu và bia ký của Nabonidus, vua Ba-by-lôn, được công bố năm 1997. Đối với biên giới trong Các Quan Xét, chạy từ dốc Ạc-ráp-bim phía nam Biển Chết, một tảng đá gần đèo ấy hơn cũng đã được đề xuất, và bản đồ cho thấy cả hai khả năng. Petra, Umm el-Biyara và es-Sela đều ở nam Jordan; es-Sela đã được khảo sát những năm gần đây, nhưng hòn đá của A-ma-xia chưa được xác định trên thực địa."
  ro:
    - "Sela, „stânca”, este folosit în Biblie atât ca substantiv comun, cât și ca nume al unei fortărețe edomite, și nu este întotdeauna limpede care dintre ele este înțeles. Judecătorii trasează hotarul amoritean de la urcușul Acrabimului, de la stâncă, în sus, unde ebraica citește „de la Sela”; iar după ce Amația al lui Iuda a ucis zece mii de edomiți în Valea Sării, oamenii lui au prins vii alți zece mii și „i-au adus pre ei în vârful stâncii, și i-au aruncat pre ei din vârful stâncii, și toți au crăpat”. Paralela din Regi spune că Amația „a luat întăritura în răsboiul acela, și a chemat numele ei Ietoil până în ziua aceasta”, așa că stânca din Cronici este în chip firesc acel Sela, fortăreața edomită. Harta le ține separat; această intrare cuprinde versetele din Judecători și Cronici."
    - "Unde se afla Sela edomit este disputat. Vechea identificare este cu Petra, orașul nabateean al cărui nume grecesc înseamnă tot „stâncă”, și anume cu masivul cu pereți abrupți Umm el-Biyara de deasupra ei; mulți preferă acum es-Sela, o fortăreață săpată în stâncă lângă Buseirah (Boțra), în guvernoratul Tafila din Iordania, pe a cărei stâncă un relief și o inscripție ale lui Nabonid, regele Babilonului, au fost publicate în 1997. Pentru hotarul din Judecători, care pornește de la urcușul Acrabimului, la sud de Marea Moartă, a fost sugerată și o stâncă mai apropiată de acea trecătoare, iar harta arată ambele posibilități. Petra, Umm el-Biyara și es-Sela se află toate în sudul Iordaniei; es-Sela a fost cercetată în ultimii ani, dar stânca lui Amația nu a fost identificată pe teren."
  bg:
    - "Села, „скалата“, се използва в Библията и като нарицателно съществително, и като име на едомска крепост, и не винаги е ясно кое се има предвид. Съдии очертава границата на аморейците „от възхода на Акравим, от камика и нагоре“, където еврейският текст чете „от Села“; а след като юдейският цар Амасия убил десет хиляди едомци в Солната долина, хората му пленили още десет хиляди и „закараха ги на върха на скалата та ги низринаха от върха на скалата; и всичките се строшиха“. Успоредният текст в Царете казва, че Амасия „превзе града Села с бой, и нарече името му Иоктеил“, така че скалата от Летописи най-естествено е тази Села, едомската крепост. Картата държи двете отделно; този запис обхваща стиховете в Съдии и Летописи."
    - "Къде е била едомската Села, е спорно. Старото отъждествяване е с Петра, набатейския град, чието гръцко име също означава „скала“, и по-специално с отвесния масив Ум ел-Бияра над него; мнозина днес предпочитат ес-Села, изсечена в скалата крепост близо до Бусейра (Восор) в губернаторство Тафила в Йордания, върху чиято скала през 1997 г. бяха публикувани релеф и надпис на вавилонския цар Набонид. За границата от Съдии, която започва от възхода на Акравим южно от Мъртво море, е предлагана и скала по-близо до този проход, и картата показва двете възможности. Петра, Ум ел-Бияра и ес-Села се намират в Южна Йордания; ес-Села е обследвана през последните години, но скалата на Амасия не е установена на терена."
