# Overview article (ADR 0007). Mainstream facts only; this id covers the "rock" of Judges 1 and 2 Chronicles 25; the Petra/Umm el-Biyara and es-Sela identifications are given as the two views, the app's two candidates named, none chosen.
id: sela
place: a98b02e
