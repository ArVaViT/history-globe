# Overview article (ADR 0007). Mainstream facts only; this id covers the "rock" of Judges 1 and 2 Chronicles 25; the Petra/Umm el-Biyara and es-Sela identifications are given as the two views, the app's two candidates named, none chosen.
id: sela
place: a98b02e
title:
  en: "Sela"
  ru: "Села"
  uk: "Села"
  es: "Sela"
  pt: "Sela"
  de: "Sela"
  fr: "Séla"
body:
  en:
    - "Sela, “the rock”, is used in the Bible both as a common noun and as the name of an Edomite stronghold, and it is not always clear which is meant. Judges draws the Amorite border “from the going up to Akrabbim, from the rock, and upward”, where the Hebrew reads “from Sela”; and after Amaziah of Judah had killed ten thousand Edomites in the Valley of Salt, his men took another ten thousand captive and “brought them unto the top of the rock, and cast them down from the top of the rock, that they all were broken in pieces”. The parallel in Kings says that Amaziah “took Selah by war, and called the name of it Joktheel”, so the rock of Chronicles is most naturally that Sela, the Edomite fortress. The map keeps the two apart; this entry covers the verses in Judges and Chronicles."
    - "Where the Edomite Sela was is disputed. The old identification is with Petra, the Nabataean city whose Greek name also means “rock”, and in particular with the sheer-sided massif of Umm el-Biyara above it; many now prefer es-Sela, a rock-cut stronghold near Buseirah (Bozrah) in the Tafila governorate of Jordan, on whose cliff a relief and inscription of Nabonidus, king of Babylon, were identified in 1994. For the border of Judges, which runs from the ascent of Akrabbim south of the Dead Sea, a rock nearer that pass has also been suggested, and the map shows both possibilities. Petra, Umm el-Biyara and es-Sela are all in southern Jordan; es-Sela has been surveyed in recent years, but Amaziah's rock has not been identified on the ground."
  ru:
    - "Села, «скала», употребляется в Библии и как нарицательное слово, и как имя едомской твердыни, и не всегда ясно, что имеется в виду. Книга Судей проводит границу аморреев «от возвышенности Акравим и от Селы», где русский перевод оставил имя как есть; а после того как Амасия Иудейский перебил десять тысяч идумеев в долине Соляной, его люди взяли ещё десять тысяч в плен, «и привели их на вершину скалы, и низринули их с вершины скалы, и все они разбились совершенно». Параллельное место в книге Царств говорит, что Амасия «взял Селу войною, и дал ей имя Иокфеил», так что скала Паралипоменон — скорее всего та самая Села, крепость едомлян. На карте их держат врозь; эта статья охватывает стихи Судей и Паралипоменон."
    - "Где стояла едомская Села, спорно. Старое отождествление — с Петрой, набатейским городом, чьё греческое имя тоже значит «скала», и особенно с отвесным массивом Умм-эль-Бияра над ней; ныне многие предпочитают Эс-Селу, вырубленную в скале крепость близ Бусейры (Восора) в иорданской провинции Эт-Тафила, на утёсе которой в 1994 году опознали рельеф и надпись Набонида, царя Вавилона. Для границы из книги Судей, идущей от подъёма Акравим к югу от Мёртвого моря, предлагали и скалу поближе к этому перевалу, и на карте показаны обе возможности. Петра, Умм-эль-Бияра и Эс-Села лежат на юге Иордании; Эс-Селу в последние годы обследовали, но скала Амасии на местности не опознана."
  uk:
    - "Села, «скеля», вживається в Біблії і як загальний іменник, і як назва едомської твердині, і не завжди ясно, яке значення мається на увазі. Книга Суддів проводить кордон амореїв від Акраббіма, «від скелі» й угору, де в івриті стоїть «від Сели» (у Біблії Куліша: «від Скорпийонового проходу далеко в гори»); а коли Амасія Юдейський убив десять тисяч едомітян у Солоній долині, його люди взяли в полон ще десять тисяч і «вивели їх на верх скелї, та й поскидали їх з верха скелї, і всї вони порозбивались». Паралельне місце в Царів каже, що Амасія «завоював Селу, й назвав її Йоктеїл», тож скеля Хронік найприродніше є тією Селою, едомською фортецею. Карта розрізняє їх; ця стаття охоплює вірші Суддів і Хронік."
    - "Де була едомська Села, є спірним. Давнє ототожнення — з Петрою, набатейським містом, чия грецька назва також означає «скеля», і зокрема з урвистим масивом Умм-ель-Бійара над нею; багато хто нині віддає перевагу ес-Селі, висіченій у скелі твердині поблизу Бусейри (Боцри) в мухафазі Тафіла в Йорданії, на скелі якої в 1994 р. розпізнали рельєф і напис Набоніда, царя Вавилона. Для кордону Суддів, що йде від підйому Акраббім на південь від Мертвого моря, запропоновано також скелю ближче до цього перевалу, і карта показує обидві можливості. Петра, Умм-ель-Бійара та ес-Села лежать на півдні Йорданії; ес-Села обстежувалася в останні роки, але скелю Амасії на місцевості не виявлено."
  es:
    - "Sela, «la roca», se usa en la Biblia tanto como nombre común como nombre de una fortaleza edomita, y no siempre está claro cuál se quiere decir. Jueces traza la frontera amorrea «desde la subida de Acrabim, desde la piedra, y arriba», donde el hebreo lee «desde Sela»; y después de que Amasías de Judá matara a diez mil edomitas en el Valle de la Sal, sus hombres tomaron vivos a otros diez mil «los cuales llevaron á la cumbre de un peñasco, y de allí los despeñaron, y todos se hicieron pedazos». El paralelo de Reyes dice que Amasías «tomó á Sela por guerra, y llamóla Jocteel», de modo que la roca de Crónicas es con mayor naturalidad esa Sela, la fortaleza edomita. El mapa mantiene separadas las dos; esta entrada trata los versículos de Jueces y Crónicas."
    - "Dónde estaba la Sela edomita se discute. La identificación antigua es con Petra, la ciudad nabatea cuyo nombre griego significa también «roca», y en particular con el macizo de laderas verticales de Umm el-Biyara que la domina; muchos prefieren hoy es-Sela, una fortaleza excavada en la roca cerca de Buseirah (Bosra), en la gobernación jordana de Tafila, en cuyo acantilado se identificaron en 1994 un relieve y una inscripción de Nabonido, rey de Babilonia. Para la frontera de Jueces, que corre desde la subida de Acrabim, al sur del mar Muerto, se ha sugerido también una roca más cercana a ese paso, y el mapa muestra ambas posibilidades. Petra, Umm el-Biyara y es-Sela están todas en el sur de Jordania; es-Sela ha sido prospectada en los últimos años, pero la roca de Amasías no ha sido identificada sobre el terreno."
  pt:
    - "Sela, “a rocha”, é usada na Bíblia tanto como substantivo comum quanto como nome de uma fortaleza edomita, e nem sempre fica claro qual se tem em vista. Juízes traça a fronteira amorreia “desde a subida de Acrabim, desde a rocha, e para cima”, onde o hebraico lê “desde Sela”; e depois que Amazias de Judá matou dez mil edomitas no Vale do Sal, seus homens levaram outros dez mil cativos e “os trouxeram para o topo da rocha, e os atiraram para baixo do topo da rocha, de modo que todos foram despedaçados”. O paralelo em Reis diz que Amazias “tomou Sela na guerra, e a chamou de Jocteel”, de modo que a rocha de Crônicas é, mais naturalmente, essa Sela, a fortaleza edomita. O mapa mantém as duas separadas; este verbete cobre os versículos de Juízes e Crônicas."
    - "Onde ficava a Sela edomita é disputado. A identificação antiga é com Petra, a cidade nabateia cujo nome grego também significa “rocha”, e em particular com o maciço de paredes verticais de Umm el-Biyara acima dela; muitos preferem hoje es-Sela, uma fortaleza escavada na rocha perto de Buseirah (Bosra), na província de Tafila, na Jordânia, em cujo penhasco um relevo e uma inscrição de Nabonido, rei da Babilônia, foram identificados em 1994. Para a fronteira de Juízes, que parte da subida de Acrabim ao sul do Mar Morto, também se sugeriu uma rocha mais perto dessa passagem, e o mapa mostra as duas possibilidades. Petra, Umm el-Biyara e es-Sela ficam todas no sul da Jordânia; es-Sela foi prospectada nos últimos anos, mas a rocha de Amazias não foi identificada no terreno."
  de:
    - "Sela, „der Fels“, wird in der Bibel sowohl als Gattungswort wie als Name einer edomitischen Festung gebraucht, und nicht immer ist klar, was gemeint ist. Die Richter ziehen die Amoritergrenze „da man nach Akrabbim hinaufgeht, von dem Fels an und weiter hinauf“, wo der hebräische Text „von Sela“ liest; und nachdem Amazja von Juda im Salztal zehntausend Edomiter erschlagen hatte, fingen seine Männer weitere zehntausend lebendig, „führten sie auf die Spitze eines Felsen und stürzten sie von der Spitze des Felsens, daß sie alle zerbarsten“. Die Parallele in den Königen sagt, Amazja „gewann die Stadt Sela mit Streit und hieß sie Joktheel“, sodass der Fels der Chronik am ehesten jenes Sela ist, die edomitische Festung. Die Karte hält beides getrennt; dieser Eintrag behandelt die Verse in Richter und Chronik."
    - "Wo das edomitische Sela lag, ist umstritten. Die alte Gleichsetzung ist mit Petra, der nabatäischen Stadt, deren griechischer Name ebenfalls „Fels“ bedeutet, und insbesondere mit dem steilwandigen Massiv Umm el-Biyara darüber; viele bevorzugen heute es-Sela, eine in den Fels gehauene Festung nahe Buseira (Bozra) im jordanischen Gouvernement Tafila, an deren Felswand 1994 ein Relief und eine Inschrift Nabonids, des Königs von Babylon, erkannt wurden. Für die Grenze der Richter, die vom Aufstieg von Akrabbim südlich des Toten Meeres verläuft, wurde auch ein Fels näher an diesem Pass vorgeschlagen, und die Karte zeigt beide Möglichkeiten. Petra, Umm el-Biyara und es-Sela liegen alle in Südjordanien; es-Sela wurde in den letzten Jahren vermessen, doch Amazjas Fels ist vor Ort nicht identifiziert."
  fr:
    - "Séla, « le rocher », est employé dans la Bible à la fois comme nom commun et comme nom d’une forteresse édomite, et l’on ne voit pas toujours lequel est visé. Les Juges tracent la frontière amoréenne « depuis la montée d’Akrabbim, depuis Séla, et en dessus », où la King James rend le mot par « the rock » ; et après qu’Amatsia de Juda eut tué dix mille Édomites dans la vallée du Sel, ses hommes en saisirent dix mille autres vivants, « qu’ils menèrent au sommet d’un rocher, d’où ils les précipitèrent ; et tous furent écrasés ». Le parallèle des Rois dit qu’Amatsia, « durant la guerre, prit Séla, et l’appela Joktheel », de sorte que le rocher des Chroniques est le plus naturellement cette Séla, la forteresse édomite. La carte garde les deux séparés ; cette notice couvre les versets des Juges et des Chroniques."
    - "L’emplacement de la Séla édomite est disputé. L’ancienne identification est avec Pétra, la ville nabatéenne dont le nom grec signifie aussi « rocher », et en particulier avec le massif à parois verticales d’Umm el-Biyara au-dessus d’elle ; beaucoup préfèrent aujourd’hui es-Sela, forteresse taillée dans le roc près de Buseirah (Botsra), dans le gouvernorat de Tafila, en Jordanie, sur la falaise de laquelle un relief et une inscription de Nabonide, roi de Babylone, furent identifiés en 1994. Pour la frontière des Juges, qui court de la montée d’Akrabbim au sud de la mer Morte, un rocher plus proche de ce col a aussi été suggéré, et la carte montre les deux possibilités. Pétra, Umm el-Biyara et es-Sela sont toutes dans le sud de la Jordanie ; es-Sela a été prospectée ces dernières années, mais le rocher d’Amatsia n’a pas été identifié sur le terrain."
