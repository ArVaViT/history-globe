# Overview article (ADR 0007). Mainstream facts only; the date of the Thasian foundation is not fixed and is given only as archaic.
id: neapolis
place: a6a7150
title:
  en: "Neapolis"
  ru: "Неаполь"
  uk: "Неаполь"
  es: "Neápolis"
  pt: "Neápolis"
  de: "Neapolis"
  fr: "Néapolis"
body:
  en:
    - 'Neapolis, the "new city", is modern Kavala in eastern Macedonia, on a promontory facing the island of Thasos. It was founded in the archaic period by settlers from Thasos as a harbour on the mainland opposite. Its patron goddess was the Parthenos, the Virgin, whose temple stood on the promontory. In the fifth century BC the town struck its own silver coins and belonged to the Athenian alliance; Pliny lists it on the coast beyond the Strymon, with Philippi inland.'
    - "In the last years of the Peloponnesian War Thasos broke with Athens and, with the Peloponnesians, besieged Neapolis, but the town would not revolt. Athenian decrees of 410/409 and about 407 BC praise the Neapolitans for it, and order that a copy be set up in the temple of the Parthenos. When Philip II took the inland town of Crenides, about 15 km away, and renamed it Philippi, Neapolis became its port. In 42 BC, before the battles at Philippi, Brutus and Cassius kept their fleet at Neapolis, and in Roman times the Via Egnatia, the road across the Balkans, came down to the sea here."
    - 'Here Paul first landed on the European mainland. After a vision of a man of Macedonia calling him over, he and his companions sailed from Troas "with a straight course to Samothracia, and the next day to Neapolis", and went on from there to Philippi. This is the only place in the Bible where Neapolis is named.'
    - 'About AD 110, by the usual dating, Ignatius of Antioch, taken under guard to Rome, wrote to Polycarp that he had to sail suddenly from Troas to Neapolis, and asked him to write to the churches he had no time to write to himself. In the Byzantine period the town was renamed Christoupolis, "city of Christ", a name first recorded in the ninth century.'
  ru:
    - "Неаполь, то есть «новый город», — нынешняя Кавала в восточной Македонии, на мысу напротив острова Фасос. Его основали в архаическую эпоху переселенцы с Фасоса как гавань на лежащем напротив материке. Покровительницей города была Парфенос, то есть Дева, храм которой стоял на мысу. В V веке до н. э. город чеканил собственную серебряную монету и входил в афинский союз; Плиний помещает его на побережье за Стримоном, а Филиппы — в глубине суши."
    - "В последние годы Пелопоннесской войны Фасос отпал от Афин и вместе с пелопоннесцами осадил Неаполь, но город не изменил Афинам. Афинские постановления 410/409 и около 407 г. до н. э. восхваляют за это неапольцев и велят поставить копию в храме Парфенос. Когда Филипп II взял городок Крениды в глубине суши, примерно в 15 км отсюда, и назвал его Филиппами, Неаполь стал их гаванью. В 42 г. до н. э., перед сражениями при Филиппах, Брут и Кассий держали в Неаполе свой флот, а в римское время здесь выходила к морю Эгнатиева дорога, пересекавшая Балканы."
    - "Здесь Павел впервые ступил на европейский материк. Увидев в ночном видении мужа-македонянина, звавшего его в Македонию, Павел вместе со спутниками отплыл из Троады; они «прямо прибыли в Самофракию, а на другой день в Неаполь», а оттуда пришли в Филиппы. Это единственное место в Библии, где назван Неаполь."
    - "Около 110 г. н. э., по обычной датировке, Игнатий Антиохийский, которого под стражей везли в Рим, писал Поликарпу, что ему приходится внезапно отплыть из Троады в Неаполь, и просил его написать тем церквам, которым сам не успел написать. В византийское время город переименовали в Христополь, «город Христа»; это имя впервые засвидетельствовано в IX веке."
  uk:
    - "Неаполь, «нове місто», — це сучасна Кавала у східній Македонії, на мисі навпроти острова Тасос. Його в архаїчну добу заснували поселенці з Тасоса як гавань на материку навпроти. Покровителькою міста була богиня Партенос, Діва, храм якої стояв на мисі. У V столітті до н. е. місто карбувало власні срібні монети й належало до Афінського союзу; Пліній перелічує його на узбережжі за Стримоном, а Філіппи — в глибині суходолу."
    - "В останні роки Пелопоннеської війни Тасос порвав з Афінами і разом із пелопоннесцями облягав Неаполь, але місто не схотіло повставати. Афінські декрети 410/409 і близько 407 р. до н. е. хвалять за це неаполітанців і наказують виставити копію в храмі Партенос. Коли Пилип II узяв місто Креніди в глибині суходолу, приблизно за 15 км, і перейменував його на Філіппи, Неаполь став його портом. У 42 р. до н. е., перед боями під Філіппами, Брут і Кассій тримали свій флот у Неаполі, а за римських часів Егнатієва дорога, шлях через Балкани, спускалася тут до моря."
    - "Тут Павло вперше висадився на європейському материку. Після видіння македонянина, що кликав його, він із супутниками відплив з Троади прямим курсом: «приспіли ми в Самотракию, другого ж дня в Неаполь», — і звідти рушили до Філіпп. Це єдине місце в Біблії, де названо Неаполь."
    - "Близько 110 р. н. е., за звичною датою, Ігнатій Антіохійський, якого під вартою везли до Рима, писав Полікарпові, що мусив раптово відплисти з Троади до Неаполя, і просив його написати до церков, до яких сам не мав часу писати. У візантійський період місто було перейменоване на Христополь, «місто Христа» — назву, вперше засвідчену в IX столітті."
  es:
    - "Neápolis, la «ciudad nueva», es la actual Kavala, en la Macedonia oriental, en un promontorio frente a la isla de Tasos. Fue fundada en el período arcaico por colonos de Tasos como puerto en la tierra firme de enfrente. Su diosa patrona era la Partenos, la Virgen, cuyo templo se alzaba en el promontorio. En el siglo V a. C. la ciudad acuñó moneda propia de plata y perteneció a la alianza ateniense; Plinio la enumera en la costa más allá del Estrimón, con Filipos tierra adentro."
    - "En los últimos años de la guerra del Peloponeso, Tasos rompió con Atenas y, con los peloponesios, sitió Neápolis, pero la ciudad no quiso rebelarse. Decretos atenienses de 410/409 y de hacia 407 a. C. elogian por ello a los neapolitanos y ordenan que se coloque una copia en el templo de la Partenos. Cuando Filipo II tomó la ciudad interior de Crénides, a unos 15 km, y la rebautizó Filipos, Neápolis se convirtió en su puerto. En el 42 a. C., antes de las batallas de Filipos, Bruto y Casio mantuvieron su flota en Neápolis, y en época romana la Vía Egnatia, el camino que cruzaba los Balcanes, bajaba hasta el mar aquí."
    - "Aquí desembarcó Pablo por primera vez en el continente europeo. Después de una visión de un varón macedonio que lo llamaba, él y sus compañeros zarparon de Troas y «vinimos camino derecho á Samotracia, y el día siguiente á Neápolis», y de allí siguieron a Filipos. Es el único lugar de la Biblia donde se nombra Neápolis."
    - "Hacia el 110 d. C., según la datación habitual, Ignacio de Antioquía, llevado bajo custodia a Roma, escribió a Policarpo que había tenido que zarpar de repente de Troas a Neápolis, y le pidió que escribiera a las iglesias a las que él no tenía tiempo de escribir. En el período bizantino la ciudad fue rebautizada Cristópolis, «ciudad de Cristo», nombre registrado por primera vez en el siglo IX."
  pt:
    - "Neápolis, a “cidade nova”, é a atual Cavala, no leste da Macedônia, num promontório de frente para a ilha de Tasos. Foi fundada no período arcaico por colonos de Tasos como porto no continente defronte. Sua deusa protetora era a Partenos, a Virgem, cujo templo se erguia no promontório. No século V a.C. a cidade cunhava moedas de prata próprias e pertencia à aliança ateniense; Plínio a lista na costa além do Estrímon, com Filipos no interior."
    - "Nos últimos anos da Guerra do Peloponeso, Tasos rompeu com Atenas e, com os peloponésios, sitiou Neápolis, mas a cidade não quis se revoltar. Decretos atenienses de 410/409 e de cerca de 407 a.C. louvam os neapolitanos por isso e ordenam que uma cópia seja afixada no templo da Partenos. Quando Filipe II tomou a cidade interior de Crênides, a cerca de 15 km, e a rebatizou Filipos, Neápolis tornou-se o seu porto. Em 42 a.C., antes das batalhas de Filipos, Bruto e Cássio mantiveram a sua frota em Neápolis, e na época romana a Via Egnácia, a estrada que cruzava os Bálcãs, descia até o mar aqui."
    - "Aqui Paulo desembarcou pela primeira vez no continente europeu. Depois de uma visão de um homem da Macedônia que o chamava, ele e seus companheiros partiram de Trôade — “fizemos uma rota direta para Samotrácia, e no dia seguinte para Neápolis” — e dali seguiram para Filipos. É o único lugar da Bíblia em que Neápolis é citada."
    - "Por volta de 110 d.C., segundo a datação habitual, Inácio de Antioquia, levado sob guarda a Roma, escreveu a Policarpo que precisara navegar de repente de Trôade a Neápolis, e pediu-lhe que escrevesse às igrejas a que ele próprio não tivera tempo de escrever. No período bizantino a cidade foi rebatizada Christoupolis, “cidade de Cristo”, nome registrado pela primeira vez no século IX."
  de:
    - "Neapolis, die „Neustadt“, ist das heutige Kavala im östlichen Mazedonien, auf einer Landzunge gegenüber der Insel Thasos. Es wurde in archaischer Zeit von Siedlern aus Thasos als Hafen auf dem gegenüberliegenden Festland gegründet. Seine Schutzgöttin war die Parthenos, die Jungfrau, deren Tempel auf der Landzunge stand. Im 5. Jahrhundert v. Chr. prägte die Stadt eigene Silbermünzen und gehörte dem Athenischen Bund an; Plinius nennt sie an der Küste jenseits des Strymon, mit Philippi im Landesinnern."
    - "In den letzten Jahren des Peloponnesischen Krieges brach Thasos mit Athen und belagerte zusammen mit den Peloponnesiern Neapolis, doch die Stadt wollte nicht abfallen. Athenische Beschlüsse von 410/409 und um 407 v. Chr. loben die Neapolitaner dafür und ordnen an, eine Abschrift im Tempel der Parthenos aufzustellen. Als Philipp II. die Binnenstadt Krenides, etwa 15 km entfernt, einnahm und in Philippi umbenannte, wurde Neapolis ihr Hafen. Im Jahr 42 v. Chr., vor den Schlachten bei Philippi, hielten Brutus und Cassius ihre Flotte in Neapolis, und in römischer Zeit führte die Via Egnatia, die Straße quer über den Balkan, hier ans Meer hinab."
    - "Hier betrat Paulus zum ersten Mal das europäische Festland. Nach einer Vision, in der ihn ein Mann aus Mazedonien herüberrief, fuhr er mit seinen Gefährten von Troas ab, „geradewegs kamen wir gen Samothrazien, des andern Tages gen Neapolis“, und zog von dort weiter nach Philippi. Dies ist die einzige Stelle der Bibel, an der Neapolis genannt wird."
    - "Um 110 n. Chr., nach der üblichen Datierung, schrieb Ignatius von Antiochia, unter Bewachung nach Rom gebracht, an Polykarp, er habe plötzlich von Troas nach Neapolis segeln müssen, und bat ihn, an die Gemeinden zu schreiben, an die er selbst keine Zeit zum Schreiben hatte. In byzantinischer Zeit wurde die Stadt in Christupolis, „Stadt Christi“, umbenannt, ein Name, der erstmals im 9. Jahrhundert belegt ist."
  fr:
    - "Néapolis, la « ville nouvelle », est l’actuelle Kavala, en Macédoine orientale, sur un promontoire face à l’île de Thasos. Elle fut fondée à l’époque archaïque par des colons de Thasos comme port sur le continent d’en face. Sa déesse protectrice était la Parthénos, la Vierge, dont le temple se dressait sur le promontoire. Au Ve siècle av. J.-C., la ville frappa sa propre monnaie d’argent et appartint à l’alliance athénienne ; Pline la range sur la côte au-delà du Strymon, avec Philippes dans l’intérieur."
    - "Dans les dernières années de la guerre du Péloponnèse, Thasos rompit avec Athènes et, avec les Péloponnésiens, assiégea Néapolis, mais la ville ne voulut pas se révolter. Des décrets athéniens de 410/409 et d’environ 407 av. J.-C. en louent les Néapolitains et ordonnent d’en placer une copie dans le temple de la Parthénos. Quand Philippe II prit la ville intérieure de Crénides, à environ 15 km, et la rebaptisa Philippes, Néapolis devint son port. En 42 av. J.-C., avant les batailles de Philippes, Brutus et Cassius tinrent leur flotte à Néapolis, et à l’époque romaine la voie Egnatia, la route qui traversait les Balkans, descendait ici jusqu’à la mer."
    - "C’est ici que Paul toucha terre pour la première fois sur le continent européen. Après une vision d’un homme de Macédoine qui l’appelait, lui et ses compagnons prirent la mer à Troas : « nous fîmes voile directement vers la Samothrace, et le lendemain nous débarquâmes à Néapolis », puis ils allèrent de là à Philippes. C’est le seul endroit de la Bible où Néapolis soit nommée."
    - "Vers 110 apr. J.-C., selon la datation habituelle, Ignace d’Antioche, emmené sous escorte à Rome, écrivit à Polycarpe qu’il avait dû s’embarquer brusquement de Troas pour Néapolis, et le pria d’écrire aux Églises auxquelles il n’avait pas le temps d’écrire lui-même. À l’époque byzantine, la ville fut rebaptisée Christoupolis, « ville du Christ », nom attesté pour la première fois au IXe siècle."
