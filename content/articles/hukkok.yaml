body:
  en:
    - "Hukkok was a point on the border of Naphtali, west of the Sea of Galilee. It is usually identified with Huqoq, the Arab village of Yaquq, in Lower Galilee about 12.5 km north of Tiberias, on the hills above Capernaum and Magdala, where the ancient name survived. The International Standard Bible Encyclopedia finds the identification plausible but thinks the site may lie too far from Tabor."
    - "Joshua traces the southern and western border of Naphtali: “the coast turneth westward to Aznoth-tabor, and goeth out from thence to Hukkok, and reacheth to Zebulun on the south side, and reacheth to Asher on the west side”. This is its only mention; the Hukok of 1 Chronicles 6, a Levitical town of Asher, is often taken to be a different place."
    - "Huqoq was a Jewish village in Roman and Byzantine times, and rabbinic literature mentions the mustard grown there. Since 2011 a team led by Jodi Magness of the University of North Carolina, with Shua Kisilevitz of the Israel Antiquities Authority, has excavated a fifth-century synagogue there, whose mosaic floor shows Samson, among other scenes tying torches to the tails of foxes, Noah's ark, the twelve spies and the crossing of the Red Sea, and a meeting of a commander with a Jewish elder that some take for Alexander the Great. The Arab village was abandoned in the war of 1948."
  ru:
    - "Хуккок — точка на границе удела Неффалимова к западу от моря Галилейского. Его обычно отождествляют с Хукоком, арабской деревней Якук в Нижней Галилее, примерно в 12,5 км к северу от Тивериады, на холмах над Капернаумом и Магдалой, где сохранилось древнее имя. Международная стандартная библейская энциклопедия считает это отождествление правдоподобным, но полагает, что место может быть слишком далеко от Фавора."
    - "Книга Иисуса Навина описывает южную и западную границу Неффалима: «возвращается предел на запад к Азноф-Фавору и идет оттуда к Хуккоку, и примыкает к Завулону с юга, и к Асиру примыкает с запада». Это единственное его упоминание; Хукок из 1 Паралипоменон 6, левитский город Асира, часто считают другим местом."
    - "В римское и византийское время Хукок был иудейским селением, и раввинская литература упоминает выращиваемую здесь горчицу. С 2011 г. экспедиция под руководством Джоди Магнесс из Университета Северной Каролины вместе с Шуа Кисилевиц из Управления древностей Израиля раскапывает здесь синагогу V в., на мозаичном полу которой изображены Самсон, в том числе привязывающий факелы к хвостам лисиц, Ноев ковчег, двенадцать соглядатаев и переход через Чермное море, а также встреча военачальника с иудейским старцем, в которой некоторые видят Александра Македонского. Арабская деревня опустела в войну 1948 г."
  uk:
    - "Хуккок був пунктом на межі Нефталима, на захід від Галілейського моря. Його зазвичай ототожнюють із Хукоком, арабським селом Якук, у Нижній Галілеї приблизно за 12,5 км на північ від Тіверіади, на пагорбах над Капернаумом і Магдалою, де давня назва збереглася. International Standard Bible Encyclopedia вважає ототожнення правдоподібним, але думає, що місце може лежати надто далеко від Фавору."
    - "Ісус Навин прослідковує південну й західну межу Нефталима: «Звідсї гряниця повертає на захід сонця на Аснот-Табор, а звідти йде на Гуккок, і стикається на полуднї з Забулоном, а з Ассиром стикаяться від заходу». Це єдина його згадка; Хукок із 1 Хронік 6, левітське місто Асіра, часто вважають іншим місцем."
    - "Хукок був єврейським селом за римських і візантійських часів, і рабинська література згадує гірчицю, яку там вирощували. Від 2011 р. група під керівництвом Джоді Маґнесс з Університету Північної Кароліни разом із Шуа Кісілевіц з Управління старожитностей Ізраїлю розкопує там синагогу V ст., мозаїчна підлога якої показує, серед інших сцен, Самсона, що прив'язує смолоскипи до хвостів лисиць, Ноїв ковчег, дванадцять розвідників і перехід через Червоне море, а також зустріч полководця з єврейським старійшиною, в якому дехто вбачає Александра Македонського. Арабське село покинули під час війни 1948 р."
  es:
    - "Hucoc era un punto de la frontera de Neftalí, al oeste del mar de Galilea. Suele identificarse con Huqoq, la aldea árabe de Yaquq, en la Baja Galilea, a unos 12,5 km al norte de Tiberias, en las colinas sobre Cafarnaúm y Magdala, donde sobrevivió el nombre antiguo. La International Standard Bible Encyclopedia considera plausible la identificación, pero piensa que el lugar puede estar demasiado lejos del Tabor."
    - "Josué traza la frontera meridional y occidental de Neftalí: «tornando de allí este término hacia el occidente á Aznot-tabor, pasa de allí á Hucuca, y llega hasta Zabulón al mediodía, y al occidente confina con Aser». Es su única mención; el Hucoc de 1 Crónicas 6, ciudad levítica de Aser, a menudo se toma por otro lugar."
    - "Huqoq fue una aldea judía en época romana y bizantina, y la literatura rabínica menciona la mostaza que allí se cultivaba. Desde 2011 un equipo dirigido por Jodi Magness, de la Universidad de Carolina del Norte, con Shua Kisilevitz, de la Autoridad de Antigüedades de Israel, excava allí una sinagoga del siglo V, cuyo pavimento de mosaico muestra a Sansón atando antorchas a las colas de zorros, entre otras escenas, el arca de Noé, los doce espías y el paso del mar Rojo, y un encuentro de un comandante con un anciano judío que algunos toman por Alejandro Magno. La aldea árabe fue abandonada en la guerra de 1948."
  de:
    - "Hukkok war ein Punkt an der Grenze Naftalis, westlich des Sees Genezareth. Es wird gewöhnlich mit Huqoq gleichgesetzt, dem arabischen Dorf Jaquq in Untergaliläa etwa 12,5 km nördlich von Tiberias, auf den Hügeln oberhalb von Kapernaum und Magdala, wo der antike Name überlebte. Die International Standard Bible Encyclopedia hält die Gleichsetzung für plausibel, meint aber, die Stätte könne zu weit vom Tabor entfernt liegen."
    - "Josua beschreibt die südliche und westliche Grenze Naftalis: „und die Grenze wendet sich zum Abend gen Asnoth-Thabor und kommt von da hinaus gen Hukkok und stößt an Sebulon gegen Mittag und an Asser gegen Abend“. Dies ist die einzige Erwähnung; das Hukok von 1. Chronik 6, eine Levitenstadt Assers, wird oft für einen anderen Ort gehalten."
    - "Huqoq war in römischer und byzantinischer Zeit ein jüdisches Dorf, und die rabbinische Literatur erwähnt den dort angebauten Senf. Seit 2011 gräbt dort ein Team unter Jodi Magness von der University of North Carolina mit Shua Kisilevitz von der israelischen Altertümerbehörde eine Synagoge des fünften Jahrhunderts aus, deren Mosaikboden unter anderen Szenen Simson zeigt, wie er Fackeln an die Schwänze von Füchsen bindet, die Arche Noahs, die zwölf Kundschafter und den Durchzug durch das Rote Meer sowie die Begegnung eines Feldherrn mit einem jüdischen Ältesten, in dem manche Alexander den Großen sehen. Das arabische Dorf wurde im Krieg von 1948 verlassen."
  fr:
    - "Hukkok était un point de la frontière de Nephthali, à l’ouest de la mer de Galilée. On l’identifie d’ordinaire avec Huqoq, le village arabe de Yaquq, en Basse Galilée, à environ 12,5 km au nord de Tibériade, sur les collines au-dessus de Capernaüm et de Magdala, où l’ancien nom a survécu. L’International Standard Bible Encyclopedia juge l’identification plausible mais pense que le site pourrait être trop éloigné du Thabor."
    - "Josué trace la frontière méridionale et occidentale de Nephthali : « Elle tournait vers l’occident à Aznoth-Thabor, et de là continuait à Hukkok ; elle touchait à Zabulon du côté du midi, à Aser du côté de l’occident ». C’est sa seule mention ; le Hukok de 1 Chroniques 6, ville lévitique d’Aser, est souvent tenu pour un lieu différent."
    - "Huqoq était un village juif aux époques romaine et byzantine, et la littérature rabbinique mentionne la moutarde qu’on y cultivait. Depuis 2011, une équipe dirigée par Jodi Magness, de l’université de Caroline du Nord, avec Shua Kisilevitz, de l’Autorité des antiquités d’Israël, y fouille une synagogue du Ve siècle, dont le pavement de mosaïque montre Samson attachant des torches à la queue de renards, entre autres scènes, l’arche de Noé, les douze espions et la traversée de la mer Rouge, ainsi qu’une rencontre entre un chef militaire et un ancien juif que certains prennent pour Alexandre le Grand. Le village arabe fut abandonné lors de la guerre de 1948."
  pt:
    - "Hucoque era um ponto na fronteira de Naftali, a oeste do mar da Galileia. É geralmente identificada com Huqoq, a aldeia árabe de Yaquq, na Baixa Galileia, cerca de 12,5 km ao norte de Tiberíades, nas colinas acima de Cafarnaum e Magdala, onde o nome antigo sobreviveu. A International Standard Bible Encyclopedia considera a identificação plausível, mas pensa que o sítio talvez fique longe demais do Tabor."
    - "Josué traça a fronteira meridional e ocidental de Naftali: “A fronteira virava para o oeste até Aznote-Tabor, e dali saía para Hucoque. Chegava a Zebulom, ao sul, e chegava a Aser, ao oeste”. Esta é a sua única menção; a Hucoque de 1 Crônicas 6, cidade levítica de Aser, é muitas vezes tomada por um lugar diferente."
    - "Huqoq era uma aldeia judaica nos tempos romano e bizantino, e a literatura rabínica menciona a mostarda ali cultivada. Desde 2011 uma equipe liderada por Jodi Magness, da Universidade da Carolina do Norte, com Shua Kisilevitz, da Autoridade de Antiguidades de Israel, escava ali uma sinagoga do século V, cujo piso de mosaico mostra Sansão, entre outras cenas, amarrando tochas às caudas de raposas, a arca de Noé, os doze espiões e a travessia do mar Vermelho, e um encontro de um comandante com um ancião judeu que alguns tomam por Alexandre, o Grande. A aldeia árabe foi abandonada na guerra de 1948."
  it:
    - "Cuccoc era un punto del confine di Neftali, a ovest del mare di Galilea. Si identifica di solito con Huqoq, il villaggio arabo di Yaquq, nella Galilea inferiore a circa 12,5 km a nord di Tiberiade, sulle colline sopra Cafarnao e Magdala, dove sopravvisse il nome antico. La International Standard Bible Encyclopedia trova plausibile l’identificazione, ma pensa che il sito possa trovarsi troppo lontano dal Tabor."
    - "Giosuè traccia il confine meridionale e occidentale di Neftali: «il confine girava a occidente verso Aznoth-Tabor, di là continuava verso Hukkok; giungeva a Zabulon dal lato di mezzogiorno, a Ascer dal lato d’occidente». È l’unica menzione; il Cuccok di 1 Cronache 6, città levitica di Aser, è spesso ritenuto un luogo diverso."
    - "Huqoq era un villaggio ebraico in epoca romana e bizantina, e la letteratura rabbinica menziona la senape che vi cresceva. Dal 2011 una squadra guidata da Jodi Magness dell’Università della Carolina del Nord, con Shua Kisilevitz dell’Israel Antiquities Authority, vi scava una sinagoga del V secolo, il cui pavimento a mosaico mostra, tra altre scene, Sansone che lega torce alle code delle volpi, l’arca di Noè, i dodici esploratori e il passaggio del Mar Rosso, e l’incontro di un comandante con un anziano ebreo che alcuni ritengono Alessandro Magno. Il villaggio arabo fu abbandonato nella guerra del 1948."
  nl:
    - "Chukok was een punt op de grens van Naftali, ten westen van het Meer van Galilea. Het wordt gewoonlijk vereenzelvigd met Huqoq, het Arabische dorp Yaquq, in Neder-Galilea ongeveer 12,5 km ten noorden van Tiberias, op de heuvels boven Kafarnaüm en Magdala, waar de oude naam bewaard bleef. De International Standard Bible Encyclopedia acht de gelijkstelling aannemelijk maar meent dat de plaats te ver van de Tabor kan liggen."
    - "Jozua beschrijft de zuid- en westgrens van Naftali: “deze landpale wendt zich westwaarts naar Asnoth-Thabor, en van daar gaat zij voort naar Hukkok, en zij reikt aan Zebulon tegen het zuiden, en aan Aser reikt zij tegen het westen”. Dit is de enige vermelding; het Chukok van 1 Kronieken 6, een levitische stad van Aser, wordt vaak voor een andere plaats gehouden."
    - "Huqoq was in de Romeinse en Byzantijnse tijd een Joods dorp, en de rabbijnse literatuur vermeldt de mosterd die er werd geteeld. Sinds 2011 graaft een team onder leiding van Jodi Magness van de University of North Carolina, met Shua Kisilevitz van de Israel Antiquities Authority, daar een synagoge uit de vijfde eeuw op, met een mozaïekvloer die onder meer Simson toont die fakkels aan de staarten van vossen bindt, Noachs ark, de twaalf verspieders en de doortocht door de Rode Zee, en een ontmoeting van een bevelhebber met een Joodse oudste die sommigen voor Alexander de Grote houden. Het Arabische dorp werd in de oorlog van 1948 verlaten."
  pl:
    - "Chukkok był punktem na granicy Neftalego, na zachód od Jeziora Galilejskiego. Utożsamia się go zwykle z Huqoq, arabską wsią Jaquk w Dolnej Galilei około 12,5 km na północ od Tyberiady, na wzgórzach nad Kafarnaum i Magdalą, gdzie przetrwała dawna nazwa. International Standard Bible Encyclopedia uważa to utożsamienie za prawdopodobne, lecz sądzi, że miejsce może leżeć zbyt daleko od Taboru."
    - "Jozue kreśli południową i zachodnią granicę Neftalego: „obraca ta granica ku morzu do Asanot Tabor; a stamtąd bieży ku Hukoka, i idzie do Zabulonu na południe, a do Asar przychodzi ku zachodu”. Jest to jedyna jego wzmianka; Chukok z 1 Kron 6, lewickie miasto Aszera, uważa się często za inne miejsce."
    - "Huqoq było wsią żydowską w czasach rzymskich i bizantyjskich, a literatura rabiniczna wspomina o rosnącej tam gorczycy. Od 2011 roku zespół pod kierunkiem Jodi Magness z University of North Carolina, wraz z Szuą Kisilevitz z Izraelskiej Służby Starożytności, bada tam synagogę z V wieku, której mozaikowa posadzka przedstawia między innymi Samsona wiążącego pochodnie do ogonów lisów, arkę Noego, dwunastu zwiadowców i przejście przez Morze Czerwone oraz spotkanie dowódcy z żydowskim starszym, które niektórzy biorą za Aleksandra Wielkiego. Arabska wieś została opuszczona w wojnie 1948 roku."
  cs:
    - "Chukok byl bod na hranici Neftalí, západně od Galilejského jezera. Obvykle se ztotožňuje s Huqoqem, arabskou vesnicí Jakúk, v Dolní Galileji asi 12,5 km severně od Tiberiady, na návrších nad Kafarnaem a Magdalou, kde se staré jméno zachovalo. International Standard Bible Encyclopedia pokládá toto ztotožnění za pravděpodobné, ale soudí, že místo může ležet příliš daleko od Tábora."
    - "Jozue sleduje jižní a západní hranici Neftalí: „Potom navracuje se meze na západ k Azanot Tábor, a odtud jde do Hukuka, a vpadá k Zabulonovu od poledne, a k Asserovu přibíhá od západu“. Je to jeho jediná zmínka; Chukok z 1 Pa 6, levitské město Ašeru, se často pokládá za jiné místo."
    - "Huqoq byl v římské a byzantské době židovskou vesnicí a rabínská literatura zmiňuje hořčici, která se tam pěstovala. Od roku 2011 tým vedený Jodi Magness z University of North Carolina se Shua Kisilevitz z Izraelského úřadu pro starožitnosti kope synagogu z pátého století, jejíž mozaiková podlaha zobrazuje mimo jiné výjevy Samsona, který přivazuje pochodně k ocasům lišek, Noemovu archu, dvanáct zvědů a přechod Rudého moře i setkání velitele s židovským starším, v němž někteří vidí Alexandra Velikého. Arabská vesnice byla opuštěna ve válce roku 1948."
  sv:
    - "Huckok var en punkt på Naftalis gräns, väster om Galileiska sjön. Det identifieras vanligen med Huqoq, den arabiska byn Yaquq, i nedre Galileen omkring 12,5 km norr om Tiberias, på bergen ovanför Kafarnaum och Magdala, där det antika namnet levde kvar. International Standard Bible Encyclopedia finner identifieringen rimlig men menar att platsen kan ligga för långt från Tabor."
    - "Josua drar Naftalis södra och västra gräns: ”gränsen vände sig västerut till Asnot-Tabor och gick vidare därifrån till Huckok; den träffade Sebulon i söder, och Aser träffade den i väster”. Detta är dess enda omnämnande; Hukok i 1 Krön 6, en levitstad i Asher, tas ofta för en annan plats."
    - "Huqoq var en judisk by under romersk och bysantinsk tid, och rabbinsk litteratur nämner senapen som odlades där. Sedan 2011 har ett team under ledning av Jodi Magness vid University of North Carolina, med Shua Kisilevitz från Israels fornminnesmyndighet, grävt ut en synagoga från 400-talet där, vars mosaikgolv bland andra scener visar Simson som binder fackor vid rävarnas svansar, Noas ark, de tolv spejarna och tåget genom Röda havet, och ett möte mellan en befälhavare och en judisk äldste som några tar för Alexander den store. Den arabiska byn övergavs i kriget 1948."
  nb:
    - "Hukkok var et punkt på Naftalis grense, vest for Galileasjøen. Det identifiseres vanligvis med Huqoq, den arabiske landsbyen Yaquq, i nedre Galilea omtrent 12,5 km nord for Tiberias, på åsene over Kapernaum og Magdala, der det gamle navnet overlevde. International Standard Bible Encyclopedia finner identifikasjonen sannsynlig, men mener at stedet kan ligge for langt fra Tabor."
    - "Josva trekker Naftalis sør- og vestgrense: «Så vendte grensen sig vestover til Asnot-Tabor og holdt frem til Hukkok og støtte i syd til Sebulon og i vest til Aser». Det er den eneste omtalen; Hukok i Første Krønikebok 6, en levittby i Asjer, tas ofte for et annet sted."
    - "Huqoq var en jødisk landsby i romersk og bysantinsk tid, og rabbinsk litteratur nevner sennepen som ble dyrket der. Siden 2011 har et team ledet av Jodi Magness ved Universitetet i Nord-Carolina, sammen med Shua Kisilevitz fra Israels oldsaksmyndighet, gravd ut en synagoge fra 400-tallet der, hvis mosaikkgulv blant andre scener viser Samson som binder fakler til halene på rever, Noahs ark, de tolv speiderne og krysningen av Rødehavet, og et møte mellom en hærfører og en jødisk eldste som noen tar for Aleksander den store. Den arabiske landsbyen ble forlatt i krigen i 1948."
  tl:
    - "Ang Hucuca ay isang puntong nasa hangganan ng Nephtali, sa kanluran ng Dagat ng Galilea. Karaniwan itong itinutugma sa Huqoq, ang nayong Arabe ng Yaquq, sa Mababang Galilea mga 12.5 km sa hilaga ng Tiberias, sa mga burol sa itaas ng Capernaum at Magdala, kung saan nanatili ang sinaunang pangalan. Nakikita ng International Standard Bible Encyclopedia na kapani-paniwala ang pagkakakilanlan ngunit inaakalang maaaring masyadong malayo ang lugar sa Tabor."
    - "Iginuguhit ni Josue ang timog at kanlurang hangganan ng Nephtali: “ang hangganan ay paliko sa dakong kalunuran sa Aznot-tabor, at palabas sa Hucuca mula roon; at abot sa Zabulon sa timugan, at abot sa Aser sa kalunuran”. Ito lamang ang banggit dito; ang Ucoc ng 1 Cronica 6, isang bayang Levita ng Aser, ay madalas ituring na ibang lugar."
    - "Ang Huqoq ay isang nayong Judio noong panahong Romano at Bizantino, at binabanggit ng panitikang rabiniko ang mustasang itinanim doon. Mula 2011, isang pangkat na pinangungunahan ni Jodi Magness ng University of North Carolina, kasama si Shua Kisilevitz ng Israel Antiquities Authority, ay naghuhukay roon ng isang sinagoga noong ika-5 siglo, na ang sahig na mosaiko ay nagpapakita kay Samson, bukod sa ibang eksena, na nagtatali ng mga sulo sa buntot ng mga soro, ang arka ni Noe, ang labindalawang espiya at ang pagtawid sa Dagat na Pula, at isang pagtatagpo ng isang kumander at isang matandang Judio na inakala ng ilan na si Alejandro Magno. Iniwan ang nayong Arabe noong digmaan ng 1948."
  da:
    - "Hukkok var et punkt på Naftalis grænse, vest for Genesaret Sø. Det identificeres sædvanligvis med Huqoq, den arabiske landsby Yaquq, i Nedre Galilæa omkring 12,5 km nord for Tiberias, på bakkerne over Kapernaum og Magdala, hvor det gamle navn overlevede. International Standard Bible Encyclopedia finder identifikationen sandsynlig, men mener, at stedet kan ligge for langt fra Tabor."
    - "Josva trækker Naftalis syd- og vestgrænse: »Og Landemærket vender sig mod Vesten til Asnoth-Thabor og gaar ud derfra til Hukok og støder op til Sebulon mod Sønden og støder til Aser mod Vesten«. Det er den eneste omtale; Hukok i Første Krønikebog 6, en levitisk by i Aser, tages ofte for et andet sted."
    - "Huqoq var en jødisk landsby i romersk og byzantinsk tid, og rabbinsk litteratur nævner den sennep, der dyrkedes der. Siden 2011 har et hold ledet af Jodi Magness fra University of North Carolina, sammen med Shua Kisilevitz fra Israels Oldsagsmyndighed, udgravet en synagoge fra 400-tallet der, hvis mosaikgulv viser blandt andre scener Samson, der binder fakler til rævenes haler, Noas ark, de tolv spejdere og krydsningen af Det Røde Hav, og et møde mellem en hærfører og en jødisk ældste, som nogle tager for Alexander den Store. Den arabiske landsby blev forladt i krigen i 1948."
  sr:
    - "Хукок је био тачка на граници Нефталима, западно од Галилејског мора. Обично се поистовећује с Хукоком, арапским селом Јакук, у Доњој Галилеји око 12,5 км северно од Тиверијаде, на брдима изнад Капернаума и Магдале, где је древно име преживело. International Standard Bible Encyclopedia сматра поистовећење уверљивим, али мисли да налазиште можда лежи предалеко од Тавора."
    - "Исус Навин прати јужну и западну границу Нефталима: „потом се обрће међа на запад к Азнот-Тавору, и иде на Укок, и допире до Завулона с југа и до Асира са запада“. То је једини помен; Хукок из 1. Летописа 6, левитски град Асира, често се узима за друго место."
    - "Хукок је био јеврејско село у римско и византијско доба, а рабинска књижевност помиње слачицу која је ту расла. Од 2011. тим под вођством Џоди Магнес са Универзитета Северне Каролине, са Шуом Кисилевицем из Израелске управе за старине, ископава ту синагогу из петог века, чији мозаички под приказује Самсона, међу осталим призорима, како веже бакље за репове лисица, Нојеву барку, дванаест ухода и прелаз преко Црвеног мора, и сусрет заповедника с јеврејским старцем који неки узимају за Александра Великог. Арапско село напуштено је у рату 1948."
scripture:
