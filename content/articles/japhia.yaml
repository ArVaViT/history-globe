body:
  en:
    - "Japhia was a point on the border of Zebulun, which Joshua draws from Sarid “unto the border of Chisloth-tabor, and then goeth out to Daberath, and goeth up to Japhia”; it is named only here. It is identified with Yafa an-Naseriyye (Yafa), an Arab town about 3 km south-west of Nazareth in northern Israel, which keeps the name; it is the Japha of Josephus."
    - "Josephus calls Japha the largest village of Galilee and fortified it in AD 66. During the siege of Jotapata in 67, Vespasian sent Trajan, commander of the tenth legion and father of the future emperor, against the town, which had a double wall. The defenders who came out to fight were shut out by their own people between the two walls, and twelve thousand were killed; Titus then took the town after six hours' fighting in its streets. Josephus counts fifteen thousand dead in all and 2,130 captives. Remains of a synagogue with mosaic floors were excavated at Yafa by E. L. Sukenik in 1950."
  ru:
    - "Иафия — точка на границе Завулона, которую книга Иисуса Навина проводит от Сарида «до предела Кислоф-Фавора; отсюда идет к Даврафу и восходит к Иафии»; названа она только здесь. Её отождествляют с Яфой-ан-Насирийе (Яфа), арабским городом примерно в 3 км к юго-западу от Назарета на севере Израиля, сохранившим имя; это Иафа Иосифа Флавия."
    - "Иосиф Флавий называет Иафу крупнейшим селением Галилеи и в 66 г. н. э. укрепил её. Во время осады Иотапаты в 67 г. Веспасиан послал против города, окружённого двойной стеной, Траяна, командира десятого легиона и отца будущего императора. Защитников, вышедших на бой, свои же не впустили, и они оказались заперты между двумя стенами; двенадцать тысяч были перебиты, а затем Тит взял город после шести часов боя на его улицах. Всего Иосиф насчитывает пятнадцать тысяч убитых и 2130 пленных. Остатки синагоги с мозаичными полами раскопал в Яфе Э. Л. Сукеник в 1950 г."
  de:
    - "Jafia war ein Punkt an der Grenze Sebulons, die Josua von Sarid aus zieht: Sie „wendet sich von Sarid gegen der Sonne Aufgang bis an die Grenze Kisloth-Thabor und kommt hinaus gen Dabrath und reicht hinauf gen Japhia“; es wird nur hier genannt. Es wird mit Jafa an-Nasirijje (Jafa) gleichgesetzt, einer arabischen Stadt etwa 3 km südwestlich von Nazareth im Norden Israels, die den Namen bewahrt; es ist das Japha des Josephus."
    - "Josephus nennt Japha das größte Dorf Galiläas und befestigte es im Jahr 66 n. Chr. Während der Belagerung von Jotapata im Jahr 67 sandte Vespasian Trajan, den Befehlshaber der zehnten Legion und Vater des späteren Kaisers, gegen die Stadt, die eine doppelte Mauer hatte. Die Verteidiger, die zum Kampf herausgekommen waren, wurden von ihren eigenen Leuten zwischen den beiden Mauern ausgesperrt, und zwölftausend wurden getötet; Titus nahm die Stadt danach nach sechsstündigem Kampf in ihren Straßen. Josephus zählt insgesamt fünfzehntausend Tote und 2130 Gefangene. Reste einer Synagoge mit Mosaikböden wurden 1950 von E. L. Sukenik in Jafa ausgegraben."
  fr:
    - "Japhia était un point de la frontière de Zabulon, que Josué trace depuis Sarid « jusqu’à la frontière de Kisloth-Thabor, continuait à Dabrath, et montait à Japhia » ; elle n’est nommée qu’ici. On l’identifie avec Yafa an-Naseriyye (Yafa), ville arabe à environ 3 km au sud-ouest de Nazareth, dans le nord d’Israël, qui garde le nom ; c’est le Japha de Josèphe."
    - "Josèphe appelle Japha le plus grand village de Galilée et la fortifia en 66 apr. J.-C. Pendant le siège de Jotapata, en 67, Vespasien envoya Trajan, commandant de la dixième légion et père du futur empereur, contre la ville, qui avait une double muraille. Les défenseurs sortis pour combattre furent enfermés dehors par les leurs entre les deux murs, et douze mille furent tués ; Titus prit ensuite la ville après six heures de combat dans ses rues. Josèphe compte quinze mille morts en tout et 2 130 captifs. Des vestiges d’une synagogue aux pavements de mosaïque furent fouillés à Yafa par E. L. Sukenik en 1950."
  pt:
    - "Jáfia era um ponto na fronteira de Zebulom, que Josué traça a partir de Saride “até a fronteira de Quislote-Tabor. Saía para Daberate e subia a Jafia”; é nomeada somente aqui. É identificada com Yafa an-Naseriyye (Yafa), uma cidade árabe cerca de 3 km a sudoeste de Nazaré, no norte de Israel, que conserva o nome; é a Japha de Josefo."
    - "Josefo chama Japha de a maior aldeia da Galileia e a fortificou em 66 d.C. Durante o cerco de Jotapata, em 67, Vespasiano enviou Trajano, comandante da décima legião e pai do futuro imperador, contra a cidade, que tinha muralha dupla. Os defensores que saíram para combater foram deixados de fora, entre as duas muralhas, pelos seus próprios companheiros, e doze mil foram mortos; Tito tomou então a cidade depois de seis horas de combate em suas ruas. Josefo conta quinze mil mortos no total e 2.130 cativos. Restos de uma sinagoga com pisos de mosaico foram escavados em Yafa por E. L. Sukenik em 1950."
  it:
    - "Iafia era un punto del confine di Zabulon, che Giosuè traccia da Sarid: «girava ad oriente, verso il sol levante, sino al confine di Kisloth-Tabor; poi continuava verso Dabrath, e saliva a Iafia»; è nominata solo qui. Si identifica con Yafa an-Naseriyye (Yafa), una città araba a circa 3 km a sud-ovest di Nazaret, nel nord di Israele, che ne conserva il nome; è la Iafa di Giuseppe Flavio."
    - "Giuseppe Flavio chiama Iafa il più grande villaggio della Galilea e la fortificò nel 66 d.C. Durante l’assedio di Iotapata, nel 67, Vespasiano mandò contro la città, che aveva una doppia cinta, Traiano, comandante della decima legione e padre del futuro imperatore. I difensori usciti a combattere furono chiusi fuori dai loro stessi concittadini tra le due mura, e dodicimila furono uccisi; Tito prese poi la città dopo sei ore di combattimento nelle sue strade. Giuseppe Flavio conta in tutto quindicimila morti e 2130 prigionieri. Resti di una sinagoga con pavimenti a mosaico furono scavati a Yafa da E. L. Sukenik nel 1950."
  nl:
    - "Jafia was een punt op de grens van Zebulon, die Jozua trekt van Sarid “tot de landpale van Chisloth-Thabor, en zij komt uit te Dobrath, en gaat opwaarts naar Jafia”; het wordt alleen hier genoemd. Het wordt vereenzelvigd met Yafa an-Naseriyye (Yafa), een Arabische stad ongeveer 3 km ten zuidwesten van Nazareth in het noorden van Israël, die de naam bewaart; het is het Japha van Josephus."
    - "Josephus noemt Japha het grootste dorp van Galilea en versterkte het in 66 n.Chr. Tijdens het beleg van Jotapata in 67 zond Vespasianus Trajanus, bevelhebber van het tiende legioen en vader van de latere keizer, tegen de stad, die een dubbele muur had. De verdedigers die uittrokken om te vechten werden door hun eigen mensen buitengesloten tussen de twee muren, en twaalfduizend werden gedood; Titus nam de stad daarna in na zes uur strijd in haar straten. Josephus telt in totaal vijftienduizend doden en 2130 gevangenen. Resten van een synagoge met mozaïekvloeren werden in 1950 door E. L. Sukenik bij Yafa opgegraven."
  pl:
    - "Jafia była punktem na granicy Zabulona, którą Jozue prowadzi od Sarid „ku granicy Chasalek Tabor, a stamtąd bieży do Daberet, i ciągnie się do Jafije”; jest wymieniona tylko tu. Utożsamia się ją z Jafa an-Nasirijja (Jafa), arabskim miastem około 3 km na południowy zachód od Nazaretu w północnym Izraelu, które zachowuje tę nazwę; jest to Japha Józefa Flawiusza."
    - "Józef Flawiusz nazywa Japhę największą wsią Galilei i obwarował ją w 66 r. n.e. Podczas oblężenia Jotapaty w 67 roku Wespazjan wysłał przeciw miastu, mającemu podwójny mur, Trajana, dowódcę X legionu i ojca przyszłego cesarza. Obrońców, którzy wyszli walczyć, zamknęli między murami ich własni ludzie i zginęło dwanaście tysięcy; Tytus zajął potem miasto po sześciu godzinach walk na jego ulicach. Józef Flawiusz liczy w sumie piętnaście tysięcy zabitych i 2130 jeńców. Szczątki synagogi z posadzkami mozaikowymi odkopał w Jafie E. L. Sukenik w 1950 roku."
  uk:
    - "Яфія була пунктом на межі Завулона, яку Ісус Навин веде від Саріда: «на займище Кислот-Таборське, відсї йде на Даверат та тягнеться на Яфію»; вона названа лише тут. Її ототожнюють з Яфа-ан-Насіріє (Яфа), арабським містом приблизно за 3 км на південний захід від Назарета на півночі Ізраїлю, яке зберігає назву; це Яфа Йосифа Флавія."
    - "Йосиф Флавій називає Яфу найбільшим селом Галілеї й укріпив її 66 р. н. е. Під час облоги Йотапати 67 р. Веспасіан послав проти міста, що мало подвійний мур, Траяна, командира десятого легіону і батька майбутнього імператора. Захисників, які вийшли битися, власні люди не пустили назад між двома мурами, і дванадцять тисяч було вбито; потім Тит узяв місто після шестигодинного бою на його вулицях. Йосиф Флавій нараховує загалом п'ятнадцять тисяч убитих і 2130 полонених. Рештки синагоги з мозаїчними підлогами розкопав у Яфі Е. Л. Сукеник 1950 р."
  cs:
    - "Jafia byla bod na hranici Zebulunu, kterou Jozue vede od Saridu „ku pomezí Chazelet Tábor, a odtud táhne se k Daberet, a vstupuje do Jafie“; je jmenována jen zde. Ztotožňuje se s Jafou an-Nasirijjou (Jafa), arabským městem asi 3 km jihozápadně od Nazareta v severním Izraeli, které jméno zachovalo; je to Josephova Japha."
    - "Josephus Flavius nazývá Japhu největší vesnicí Galileje a opevnil ji roku 66 n. l. Během obléhání Jotapaty roku 67 poslal Vespasianus proti městu, které mělo dvojí hradbu, Traiana, velitele desáté legie a otce pozdějšího císaře. Obránci, kteří vyšli bojovat, byli vlastními lidmi zavřeni mezi oběma hradbami venku a dvanáct tisíc jich bylo zabito; Titus pak město dobyl po šesti hodinách boje v ulicích. Josephus počítá celkem patnáct tisíc mrtvých a 2 130 zajatých. Zbytky synagogy s mozaikovými podlahami vykopal v Jafě E. L. Sukenik roku 1950."
  es:
    - "Jafía era un punto de la frontera de Zabulón, que Josué traza desde Sarid «al término de Chisiloth-tabor, sale á Dabrath, y sube á Japhia»; solo se nombra aquí. Se identifica con Yafa an-Naseriyye (Yafa), una ciudad árabe a unos 3 km al suroeste de Nazaret, en el norte de Israel, que conserva el nombre; es la Jafa de Josefo."
    - "Josefo llama a Jafa la mayor aldea de Galilea y la fortificó en 66 d. C. Durante el asedio de Jotapata, en 67, Vespasiano envió contra la ciudad, que tenía doble muralla, a Trajano, comandante de la legión décima y padre del futuro emperador. Los defensores que salieron a combatir fueron dejados fuera por los suyos entre las dos murallas, y doce mil murieron; Tito tomó luego la ciudad tras seis horas de combate en sus calles. Josefo cuenta quince mil muertos en total y 2130 cautivos. E. L. Sukenik excavó en Yafa en 1950 restos de una sinagoga con pavimentos de mosaico."
  sv:
    - "Jafia var en punkt på Sebulons gräns, som Josua drar från Sarid ”åt Kislot-Tabors område och gick vidare till Dobrat och upp till Jafia”; den nämns bara här. Den identifieras med Yafa an-Naseriyye (Yafa), en arabisk stad omkring 3 km sydväst om Nasaret i norra Israel, som bevarar namnet; det är Josefus Japha."
    - "Josefus kallar Japha Galileens största by och befäste den år 66 e.Kr. Under belägringen av Jotapata år 67 sände Vespasianus Trajanus, befälhavare för tionde legionen och far till den blivande kejsaren, mot staden, som hade en dubbel mur. Försvararna som kom ut för att strida stängdes ute av sitt eget folk mellan de två murarna, och tolvtusen dödades; Titus intog sedan staden efter sex timmars strid på dess gator. Josefus räknar femtontusen döda sammanlagt och 2 130 fångar. Lämningar av en synagoga med mosaikgolv grävdes ut i Yafa av E. L. Sukenik 1950."
  nb:
    - "Jafia var et punkt på Sebulons grense, som Josva trekker fra Sarid: «bøide den sig fra Sarid bort til Kislot-Tabors enemerker og gikk frem til Haddaberat og op til Jafia»; den nevnes bare her. Den identifiseres med Yafa an-Naseriyye (Yafa), en arabisk by omtrent 3 km sørvest for Nasaret i det nordlige Israel, som bevarer navnet; det er Josefus' Japha."
    - "Josefus kaller Japha den største landsbyen i Galilea og befestet den i 66 e.Kr. Under beleiringen av Jotapata i 67 sendte Vespasian Trajan, sjef for tiende legion og far til den senere keiseren, mot byen, som hadde en dobbel mur. Forsvarerne som kom ut for å kjempe, ble stengt ute av sitt eget folk mellom de to murene, og tolv tusen ble drept; Titus inntok så byen etter seks timers kamp i gatene. Josefus regner femten tusen døde i alt og 2130 fanger. Rester av en synagoge med mosaikkgulv ble gravd ut i Yafa av E. L. Sukenik i 1950."
  tl:
    - "Ang Japhia ay isang punto sa hangganan ng Zabulon, na iginuguhit ni Josue mula sa Sarid “hanggang sa hangganan ng Chisiloth-tabor, at palabas sa Dabrath, at pasampa sa Japhia”; dito lamang ito pinangalanan. Tinutukoy ito sa Yafa an-Naseriyye (Yafa), isang bayang Arabe mga 3 km sa timog-kanluran ng Nazaret sa hilagang Israel, na nagpapanatili ng pangalan; ito ang Japha ni Josephus."
    - "Tinatawag ni Josephus ang Japha na pinakamalaking nayon ng Galilea at pinatibay ito noong 66 AD. Sa pagkubkob sa Jotapata noong 67, ipinadala ni Vespasian si Trajan, kumander ng ikasampung legion at ama ng magiging emperador, laban sa bayan, na may dobleng pader. Ang mga tagapagtanggol na lumabas upang makipaglaban ay isinara sa labas ng sarili nilang mga tao sa pagitan ng dalawang pader, at labindalawang libo ang napatay; sinakop pagkatapos ni Tito ang bayan pagkatapos ng anim na oras na labanan sa mga kalye nito. Bumibilang si Josephus ng labinlimang libong patay sa kabuuan at 2,130 bihag. Ang mga labi ng isang sinagoga na may sahig na mosaiko ay hinukay sa Yafa ni E. L. Sukenik noong 1950."
  da:
    - "Jafia var et punkt på Zebulons grænse, som Josva trækker fra Sarid »ved Kisloth-Thabors Landemærke, og gaar ud til Dabrath og gaar op til Jafia«; den nævnes kun her. Den identificeres med Yafa an-Naseriyye (Yafa), en arabisk by omkring 3 km sydvest for Nazaret i det nordlige Israel, som bevarer navnet; det er Josefus' Japha."
    - "Josefus kalder Japha den største landsby i Galilæa og befæstede den i 66 e.Kr. Under belejringen af Jotapata i 67 sendte Vespasian Trajan, kommandant for den tiende legion og far til den senere kejser, mod byen, som havde en dobbelt mur. Forsvarerne, der kom ud for at kæmpe, blev lukket ude af deres eget folk mellem de to mure, og tolv tusind blev dræbt; Titus indtog derefter byen efter seks timers kamp i dens gader. Josefus tæller i alt femten tusind døde og 2.130 fanger. Levn af en synagoge med mosaikgulve blev udgravet i Yafa af E. L. Sukenik i 1950."
  sr:
    - "Јафија је била тачка на граници Завулона, коју Исус Навин повлачи: „па се окреће од Сариде на исток до међе кислот-таворске, и иде на Даврат и излази до Јафе“; именује се само овде. Поистовећује се с Јафом ан-Насиријом (Јафа), арапским градом око 3 км југозападно од Назарета у северном Израилу, који чува име; то је Јафа Јосифа Флавија."
    - "Јосиф Флавије назива Јафу највећим селом Галилеје и утврдио ју је 66. н. е. Током опсаде Јотапате 67. Веспазијан је послао Трајана, заповедника десете легије и оца будућег цара, против града, који је имао двоструки зид. Бранитељи који су изашли да се боре били су затворени од сопственог народа између два зида и дванаест хиљада је убијено; Тит је затим узео град после шест сати борбе по његовим улицама. Јосиф Флавије броји петнаест хиљада мртвих укупно и 2.130 заробљеника. Остатке синагоге са мозаичким подовима ископао је у Јафи Е. Л. Сукеник 1950."
  hu:
    - "Jáfia Zebulon határának egyik pontja volt, amelyet Józsué Száridtól húz meg „Kiszloth-Tábor határára, és tova megy Daberáthnak, és felmegy Jafiának”; csak itt szerepel. Jáfa an-Naszirijával (Jáfa) azonosítják, egy arab várossal mintegy 3 km-re délnyugatra Názárettől Észak-Izraelben, amely megőrzi a nevet; ez Josephus Japhája."
    - "Josephus Japhát Galilea legnagyobb falujának nevezi, és Kr. u. 66-ban megerősítette. A 67-es jotapatai ostrom idején Vespasianus Traianust, a tizedik légió parancsnokát, a későbbi császár apját küldte a város ellen, amelyet kettős fal védett. A kitörő védőket saját népük kizárta a két fal közé, és tizenkétezret öltek meg; Titusz ezután hat órás utcai harc után elfoglalta a várost. Josephus összesen tizenötezer halottat és 2130 foglyot számol. Mozaikpadlós zsinagóga maradványait E. L. Sukenik tárta fel Jáfában 1950-ben."
  fi:
    - "Jafia oli kohta Sebulonin rajalla, jonka Joosua vetää Saaridista: ”kääntyy raja Saaridista Kislot-Taaborin alueelle ja jatkuu Daberatiin ja nousee Jaafiaan”; se mainitaan vain tässä. Se tunnistetaan Yafa an-Naseriyyeksi (Yafa), arabikaupungiksi noin 3 km Nasaretista lounaaseen Pohjois-Israelissa, joka säilyttää nimen; se on Josephuksen Japha."
    - "Josephus kutsuu Japhaa Galilean suurimmaksi kyläksi ja linnoitti sen vuonna 66 jaa. Jotapatan piirityksen aikana vuonna 67 Vespasianus lähetti Trajanuksen, kymmenennen legioonan komentajan ja tulevan keisarin isän, kaupunkia vastaan, jolla oli kaksinkertainen muuri. Taistelemaan tulleet puolustajat suljettiin ulos omiensa toimesta kahden muurin väliin, ja kaksitoista tuhatta tapettiin; Titus valtasi sitten kaupungin kuuden tunnin katutaistelun jälkeen. Josephus laskee kaikkiaan viisitoista tuhatta kuollutta ja 2 130 vankia. E. L. Sukenik kaivoi Yafassa vuonna 1950 synagogan jäännökset mosaiikkilattioineen."
  vi:
    - "Gia-phia là một điểm trên ranh giới Sa-bu-lôn, mà Giô-suê vạch từ Sa-rít “trên giáp giới Kít-lốt-Tha-bô; đoạn đi về hướng Đáp-rát, và lên đến Gia-phia”; chỉ được nêu ở đây. Nơi này được đồng nhất với Yafa an-Naseriyye (Yafa), một thị trấn A-ráp cách Na-xa-rét khoảng 3 km về phía tây nam ở bắc Israel, vẫn giữ tên; đó là Japha của Josephus."
    - "Josephus gọi Japha là làng lớn nhất của Ga-li-lê và củng cố nó năm 66. Trong cuộc vây Jotapata năm 67, Vespasian sai Trajan, chỉ huy quân đoàn thứ mười và là cha của hoàng đế tương lai, đánh thành, nơi có hai lớp tường. Những người phòng thủ ra đánh bị chính dân mình nhốt ngoài giữa hai lớp tường, và mười hai ngàn người bị giết; Tít sau đó chiếm thành sau sáu giờ chiến đấu trong các phố. Josephus đếm tổng cộng mười lăm ngàn người chết và 2.130 tù binh. Di tích một hội đường có nền khảm được E. L. Sukenik khai quật ở Yafa năm 1950."
  ro:
    - "Iafia era un punct de pe hotarul lui Zabulon, pe care Iosua îl trasează de la Sarid: „Și se întoarce dela Sarid din preajma dela răsăritul Sames la hotarele Haselatdavor, și trece la Davrat, și se sue la Iafia”; este numit doar aici. Este identificat cu Yafa an-Naseriyye (Yafa), un oraș arab la circa 3 km spre sud-vest de Nazaret, în nordul Israelului, care păstrează numele; este Japha a lui Iosif Flaviu."
    - "Iosif Flaviu numește Japha cel mai mare sat al Galileii și l-a fortificat în 66 d.Hr. În timpul asediului Iotapatei din 67, Vespasian l-a trimis împotriva orașului, care avea un zid dublu, pe Traian, comandantul legiunii a zecea și tatăl viitorului împărat. Apărătorii care ieșiseră să lupte au fost lăsați afară de proprii lor oameni, între cele două ziduri, și doisprezece mii au fost uciși; Tit a luat apoi orașul după șase ore de luptă pe străzile lui. Iosif Flaviu numără cincisprezece mii de morți în total și 2130 de prizonieri. Rămășițele unei sinagogi cu podele de mozaic au fost săpate la Yafa de E. L. Sukenik în 1950."
  bg:
    - "Яфия беше точка на границата на Завулон, която книгата на Иисус Навин прокарва от Сарид „в предела на Кислот-тавор, и излазяше в Даврат, и възлазяше в Яфия“; тя се назовава само тук. Отъждествява се с Яфа ан-Насирия (Яфа), арабски град на около 3 км югозападно от Назарет в Северен Израел, който пази името; това е Яфа на Йосиф Флавий."
    - "Йосиф Флавий нарича Яфа най-голямото село в Галилея и го укрепи през 66 г. н.е. По време на обсадата на Йотапата през 67 г. Веспасиан изпрати срещу града, който имаше двойна стена, Траян — командира на десети легион и баща на бъдещия император. Защитниците, които излязоха да се бият, бяха оставени от собствените си хора отвън между двете стени и дванадесет хиляди бяха убити; после Тит превзе града след шестчасови боеве по улиците му. Йосиф Флавий брои общо петнадесет хиляди убити и 2130 пленници. Останки от синагога с мозаечни подове бяха разкопани в Яфа от Е. Л. Сукеник през 1950 г."
scripture:
