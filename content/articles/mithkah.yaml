body:
  en:
    - "Mithkah, Mithcah in the King James Version, is a camp of Israel in the wilderness, named only in the list of stations: “And they removed from Tarah, and pitched in Mithcah. And they went from Mithcah, and pitched in Hashmonah.” It belongs to the long run of stations between Hazeroth and Ezion-gaber of which no events are told. The name means “sweetness”, and readers have guessed at sweet water there, but the text says nothing of it."
    - "Its site is unknown. The map draws only a wide circle, within some 50 km of its guess for Hashmonah, in the north-eastern Sinai and the Negev highlands, and gives a point along Wadi Abu Taqiya as a second, weaker guess. Since even the course of this part of the route is reconstructed, the map can show no more than the general area."
  ru:
    - "Мифка — стан Израиля в пустыне, известный только по перечню станов: «И отправились из Тараха и расположились станом в Мифке. И отправились из Мифки и расположились станом в Хашмон». Она входит в длинный ряд станов между Асирофом и Ецион-Гавером, о которых не рассказано никаких событий. Имя значит «сладость», и читатели догадывались о сладкой воде в этом месте, но текст об этом молчит."
    - "Место её неизвестно. На карте очерчен лишь широкий круг радиусом около 50 км вокруг предполагаемой Хашмоны на северо-востоке Синая и в Негевском нагорье и даёт вторую, более слабую догадку — точку вдоль Вади Абу-Такия. Поскольку восстанавливается предположительно даже направление этой части пути, карта может показать лишь общую область."
  uk:
    - "Мітка, у Біблії короля Якова Мітка (Mithcah), — табір Ізраїлю в пустелі, названий лише в переліку стоянок: «І рушили з Тарати та й отаборились у Митцї. І рушили з Митки та й отаборились у Гашмонї.» Вона належить до довгої низки стоянок між Хацеротом і Ецйон-Гевером, про які не розповідається подій. Назва означає «солодкість», і читачі припускали там солодку воду, але текст про це нічого не каже."
    - "Місце її невідоме. Мапа креслить лише широке коло, в межах приблизно 50 км від її здогадки для Хашмони, на північному сході Синаю й нагір’ї Негеву, і дає точку вздовж Ваді-Абу-Такія як другу, слабшу здогадку. Оскільки навіть хід цієї частини маршруту є реконструкцією, мапа може показати не більше, ніж загальну місцевість."
  es:
    - "Mitca, Mithcah en la versión del rey Jacobo, es un campamento de Israel en el desierto, nombrado solo en la lista de estaciones: «Y partidos de Tara, asentaron en Mithca. Y partidos de Mithca, asentaron en Hasmona». Pertenece a la larga serie de estaciones entre Haserot y Ezión-geber de las que no se cuenta ningún suceso. El nombre significa «dulzura», y los lectores han conjeturado que allí había agua dulce, pero el texto no dice nada de ello."
    - "Su emplazamiento se desconoce. El mapa traza solo un amplio círculo, a menos de unos 50 km de su conjetura para Hasmona, en el nordeste del Sinaí y las tierras altas del Néguev, y da un punto a lo largo del Wadi Abu Taqiya como segunda conjetura, más débil. Dado que hasta el curso de esta parte de la ruta es una reconstrucción, el mapa no puede mostrar más que la zona general."
  pt:
    - "Mitca, Mithcah na King James Version, é um acampamento de Israel no deserto, citado apenas na lista de etapas: “Partiram de Tera e acamparam em Mitca. Partiram de Mitca e acamparam em Hasmona.” Pertence à longa sequência de etapas entre Hazerote e Eziom-Geber das quais não se contam acontecimentos. O nome significa “doçura”, e os leitores conjecturaram água doce ali, mas o texto nada diz a respeito."
    - "Seu sítio é desconhecido. O mapa traça apenas um amplo círculo, a até uns 50 km de seu palpite para Hasmona, no nordeste do Sinai e nas terras altas do Neguebe, e dá um ponto ao longo do Wadi Abu Taqiya como segundo palpite, mais fraco. Como até o curso desta parte da rota é reconstruído, o mapa não pode mostrar mais que a área geral."
  de:
    - "Mitka, in der King-James-Version Mithcah, ist ein Lager Israels in der Wüste, nur in der Stationenliste genannt: „Von Tharah zogen sie aus und lagerten sich in Mithka. Von Mithka zogen sie aus und lagerten sich in Hasmona.“ Es gehört zu der langen Reihe von Stationen zwischen Hazerot und Ezjon-Geber, von denen keine Ereignisse erzählt werden. Der Name bedeutet „Süße“, und Leser haben dort auf süßes Wasser geschlossen, doch der Text sagt davon nichts."
    - "Seine Lage ist unbekannt. Die Karte zeichnet nur einen weiten Kreis, im Umkreis von etwa 50 km um ihre Vermutung für Haschmona, im nordöstlichen Sinai und im Negev-Hochland, und nennt einen Punkt am Wadi Abu Taqiya als zweite, schwächere Vermutung. Da selbst der Verlauf dieses Teils der Route rekonstruiert ist, kann die Karte nicht mehr als die ungefähre Gegend zeigen."
  fr:
    - "Mithka, Mithcah dans la version du roi Jacques, est un campement d’Israël dans le désert, nommé seulement dans la liste des étapes : « Ils partirent de Tarach, et campèrent à Mithka. Ils partirent de Mithka, et campèrent à Haschmona. » Elle appartient à la longue série d’étapes entre Hatséroth et Étsjon-Guéber dont aucun événement n’est raconté. Le nom signifie « douceur », et l’on a supposé de l’eau douce en ce lieu, mais le texte n’en dit rien."
    - "Son site est inconnu. La carte ne trace qu’un large cercle, à quelque 50 km de son hypothèse pour Haschmona, dans le nord-est du Sinaï et les hautes terres du Négev, et donne un point le long de l’ouadi Abou Taqiya comme seconde hypothèse, plus faible. Comme même le tracé de cette partie de l’itinéraire est reconstitué, la carte ne peut montrer que la région générale."
  it:
    - "Mitka, Mithcah nella King James Version, è un accampamento d’Israele nel deserto, nominato solo nell’elenco delle tappe: «Partirono da Tarach e si accamparono a Mithka. Partirono da Mithka e si accamparono a Hashmona». Appartiene alla lunga serie di tappe tra Cazerot ed Ezion-Gheber di cui non si narra alcun evento. Il nome significa «dolcezza», e si è congetturata là acqua dolce, ma il testo non ne dice nulla."
    - "Il suo sito è sconosciuto. La mappa traccia solo un ampio cerchio, entro circa 50 km dalla sua ipotesi per Asmona, nel Sinai nord-orientale e negli altopiani del Negheb, e dà un punto lungo il Wadi Abu Taqiya come seconda ipotesi, più debole. Poiché anche il percorso di questo tratto è ricostruito, la mappa non può mostrare più della zona generale."
  pl:
    - "Mitka, w Biblii Króla Jakuba Mithcah, to obóz Izraela na pustyni, wymieniony tylko na liście stacji: „A ruszywszy się z Tare, położyli się obozem w Metka. A ruszywszy się z Metka, położyli się obozem w Hesman.” Należy do długiego ciągu stacji między Chasserot a Esjon-Geber, o których nie opowiada się żadnych wydarzeń. Nazwa znaczy „słodycz” i czytelnicy zgadywali, że była tam słodka woda, ale tekst nic o tym nie mówi."
    - "Jego położenie jest nieznane. Mapa rysuje tylko szerokie koło, w promieniu około 50 km od jej domysłu dla Chaszmony, w północno-wschodnim Synaju i na wyżynach Negewu, i podaje punkt wzdłuż Wadi Abu Taqiya jako drugi, słabszy domysł. Ponieważ nawet przebieg tego odcinka trasy jest rekonstruowany, mapa może pokazać nie więcej niż ogólny obszar."
  nl:
    - "Mitka, in de King James Version Mithcah, is een legerplaats van Israël in de woestijn, alleen genoemd in de lijst van pleisterplaatsen: “En zij verreisden van Tharah, en legerden zich in Mithka. En zij verreisden van Mithka, en legerden zich in Hasmona.” Het hoort bij de lange reeks pleisterplaatsen tussen Hazerot en Ezeon-Geber waarvan geen gebeurtenissen worden verteld. De naam betekent “zoetheid”, en lezers hebben gegist op zoet water daar, maar de tekst zegt er niets over."
    - "De ligging is onbekend. De kaart tekent slechts een brede cirkel, binnen zo'n 50 km van zijn gok voor Chasmona, in het noordoosten van de Sinaï en het Negevhoogland, en geeft een punt langs de Wadi Abu Taqiya als tweede, zwakkere gok. Aangezien zelfs het verloop van dit deel van de route gereconstrueerd is, kan de kaart niet meer tonen dan het algemene gebied."
  cs:
    - "Mitka, v anglické Bibli krále Jakuba Mithcah, je tábor Izraele na poušti, uvedený jen v seznamu stanic: „A když se hnuli z Tár, položili se v Metka. A hnuvše se z Metka, položili se v Esmona.“ Patří k dlouhé řadě stanic mezi Chacerótem a Ecjon-geberem, o nichž se nevypráví žádné události. Jméno znamená „sladkost“ a čtenáři se dohadovali o sladké vodě, ale text o ní nic neříká."
    - "Jeho poloha je neznámá. Mapa kreslí jen široký kruh, do vzdálenosti asi 50 km od svého dohadu pro Chašmonu, v severovýchodním Sinaji a negevské vysočině, a jako druhý, slabší dohad uvádí bod na Wádí Abu Taqiya. Protože i průběh této části trasy je rekonstruován, může mapa ukázat jen obecnou oblast."
  sv:
    - "Mitka, Mithcah i King James Version, är ett läger för Israel i öknen, nämnt endast i förteckningen över stationer: ”Och de bröto upp från Tera och lägrade sig i Mitka. Och de bröto upp från Mitka och lägrade sig i Hasmona.” Det hör till den långa raden av stationer mellan Haserot och Esjon-Geber om vilka inga händelser berättas. Namnet betyder ”sötma”, och läsare har gissat på sött vatten där, men texten säger ingenting om det."
    - "Dess läge är okänt. Kartan ritar bara en vid cirkel, inom omkring 50 km från sin gissning för Hashmona, i nordöstra Sinai och Negevs högland, och ger en punkt längs Wadi Abu Taqiya som en andra, svagare gissning. Eftersom till och med färdvägens sträckning i denna del är rekonstruerad kan kartan inte visa mer än det allmänna området."
  nb:
    - "Mitka, Mithcah i King James-oversettelsen, er en leirplass for Israel i ørkenen, nevnt bare i listen over stasjoner: «Og de drog fra Tarah og leiret sig i Mitka. Og de drog fra Mitka og leiret sig i Hasmona.» Den hører til den lange rekken av stasjoner mellom Haserot og Esjon-Geber som ingen hendelser fortelles om. Navnet betyr «sødme», og lesere har gjettet på søtt vann der, men teksten sier ingenting om det."
    - "Beliggenheten er ukjent. Kartet tegner bare en vid sirkel, innen omkring 50 km fra sitt gjett for Hasjmona, i det nordøstlige Sinai og Negev-høylandet, og gir et punkt langs Wadi Abu Taqiya som et annet, svakere gjett. Siden selv forløpet av denne delen av ruten er rekonstruert, kan kartet ikke vise mer enn det generelle området."
  tl:
    - "Ang Mithca, Mithcah sa King James Version, ay kampo ng Israel sa ilang, na pinangalanan lamang sa talaan ng mga himpilan: “At sila'y naglakbay mula sa Tara, at humantong sa Mithca. At sila'y naglakbay mula sa Mithca, at humantong sa Hasmona.” Bahagi ito ng mahabang hanay ng mga himpilan sa pagitan ng Haseroth at Esion-geber na walang isinasalaysay na pangyayari. Ang pangalan ay nangangahulugang “tamis”, at hinulaan ng mga mambabasa na may matamis na tubig doon, ngunit walang sinasabi ang teksto tungkol dito."
    - "Hindi alam ang pook nito. Gumuguhit lamang ang mapa ng malawak na bilog, sa loob ng mga 50 km mula sa hula nito para sa Hasmona, sa hilagang-silangang Sinai at kabundukan ng Negeb, at nagbibigay ng isang punto sa Wadi Abu Taqiya bilang ikalawa, mas mahinang hula. Yamang maging ang takbo ng bahaging ito ng ruta ay muling binubuo, hindi makapagpapakita ang mapa ng higit sa pangkalahatang lugar."
scripture:
  - Num.33.17-Num.33.35
sources:
  - "G. I. Davies, The Way of the Wilderness: A Geographical Study of the Wilderness Itineraries in the Old Testament (1979)"
  - "B. A. Levine, Numbers 21-36 (Anchor Bible 4A, 2000)"
