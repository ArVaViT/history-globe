body:
  en:
    - "Mount Tabor is a lone, rounded hill at the north-eastern edge of the Jezreel valley, about 575 m above the sea and some 400 m above the plain, with the Sea of Galilee 17 km to the east. Its shape made it a proverb: “as Tabor is among the mountains, and as Carmel by the sea”, says Jeremiah, and a psalm has “Tabor and Hermon” rejoice in God's name. Here the lands of Issachar, Zebulun and Naphtali met, and a town of the same name at its foot was given to the Levites. Hosea's “net spread upon Tabor” suggests that a sanctuary stood on it."
    - "Its great biblical day is the war of Deborah. She sent for Barak and told him, “Go and draw toward mount Tabor, and take with thee ten thousand men of the children of Naphtali and of the children of Zebulun”; Sisera brought his nine hundred chariots to the Kishon below, and “Barak went down from mount Tabor” and routed them. Gideon later asked the kings of Midian about the men “whom ye slew at Tabor”, and learned they were his own brothers."
    - "The hill was a fortress in later ages. Antiochus III took Atabyrion from the Ptolemies in 218 BC; Gabinius defeated the Hasmonean Alexander near it in 55 BC; and in AD 66 Josephus, as commander in Galilee, walled the summit in forty days, only for the Romans under Placidus to take it the next year. The Gospels say that Jesus was transfigured on “an high mountain apart” without naming it, but a tradition going back at least to the fourth century, found in Cyril of Jerusalem and Jerome, placed the Transfiguration on Tabor, and the Gospel according to the Hebrews quoted by Origen already spoke of “the great mountain Tabor”. By the sixth century three churches stood on the top; crusaders and then Saladin's successors held it, and Baybars destroyed its church in 1263."
    - "Today the summit, reached by a hairpin road from the Arab village of Daburiyya, carries the Franciscan basilica of the Transfiguration, built in 1924 to the design of Antonio Barluzzi on the ruins of the crusader church, and the Greek Orthodox monastery of St Elias. The slopes are a nature reserve of Tabor oak, and the view takes in the whole Jezreel valley from Carmel to Gilboa."
  ru:
    - "Гора Фавор — одинокий округлый холм у северо-восточного края Изреельской долины, около 575 м над уровнем моря и примерно на 400 м выше равнины; Галилейское море лежит в 17 км к востоку. Её очертания вошли в пословицу: «как Фавор среди гор и как Кармил при море», говорит Иеремия, а в псалме «Фавор и Ермон о имени Твоем радуются». Здесь сходились земли Иссахара, Завулона и Неффалима, а одноимённый город у подножия был отдан левитам. Слова Осии о священниках, бывших «сетью, раскинутою на Фаворе», наводят на мысль, что на горе стояло святилище."
    - "Её великий библейский день — война Деворы. Она призвала Варака и сказала: «пойди, взойди на гору Фавор и возьми с собою десять тысяч человек из сынов Неффалимовых и сынов Завулоновых»; Сисара привёл свои девятьсот колесниц к Киссону внизу, и «сошел Варак с горы Фавора» и разбил их. Позже Гедеон спросил царей Мадиамских о тех, «которых вы убили на Фаворе», и узнал, что это были его братья."
    - "В позднейшие века холм был крепостью. Антиох III взял Атавирион у Птолемеев в 218 г. до н. э.; Габиний разбил близ него Хасмонея Александра в 55 г. до н. э.; а в 66 г. н. э. Иосиф Флавий, начальствуя в Галилее, за сорок дней обнёс вершину стеной, но уже на следующий год её взяли римляне под началом Плацида. Евангелия говорят, что Иисус возвёл учеников «на гору высокую» и преобразился, не называя горы, но предание, восходящее по меньшей мере к IV веку, у Кирилла Иерусалимского и Иеронима, поместило Преображение на Фавор, а Евангелие евреев, которое цитирует Ориген, уже говорило о «великой горе Фавор». К VI веку на вершине стояли три церкви; ею владели крестоносцы, затем преемники Саладина, а в 1263 г. Бейбарс разрушил её церковь."
    - "Сегодня на вершине, куда ведёт серпантин от арабской деревни Дабурия, стоят францисканская базилика Преображения, построенная в 1924 г. по проекту Антонио Барлуцци на развалинах церкви крестоносцев, и греческий православный монастырь Святого Илии. Склоны — заповедник фаворского дуба, а с вершины видна вся Изреельская долина от Кармила до Гелвуя."
  uk:
    - "Гора Фавор — самотній округлий пагорб на північно-східному краю Їзреельської долини, близько 575 м над морем і приблизно на 400 м над рівниною, із Галілейським морем за 17 км на схід. Її форма зробила її прислів’ям: «що Тавор належить між гори, а Кармель стоїть над морем», каже Єремія, а псалом каже, що «Табор і Гермон торжествують» задля імені Бога. Тут сходилися землі Іссахара, Завулона й Нефталима, а місто з тією самою назвою біля підніжжя було віддане левітам. «Сїттю, що на Таворі заставляють» в Осії вказує, що на ній стояло святилище."
    - "Її великий біблійний день — війна Дебори. Вона послала по Варака й сказала йому: «Лаштуйсь у дорогу, виступай на Табор-гору і возьми з собою десять тисяч чоловіка із Нефталиміїв та з Зебулонїїв»; Сісара привів свої дев’ятсот колісниць до Кішону внизу, і «спустивсь Барак з Табор-гори» та розгромив їх. Гедеон пізніше запитав царів Мадіама про мужів, «що ви побили їх на Таворі», і довідався, що це були його власні брати."
    - "У пізніші віки пагорб був фортецею. Антіох III узяв Атабірій у Птолемеїв 218 р. до н. е.; Габіній переміг хасмонея Александра біля нього 55 р. до н. е.; а 66 р. н. е. Йосиф Флавій, як начальник у Галілеї, обніс вершину муром за сорок днів, але римляни під командою Плацида взяли її наступного року. Євангелія кажуть, що Ісус преобразився «на гору високу окроме», не називаючи її, але традиція принаймні від IV ст., знайдена в Кирила Єрусалимського й Ієроніма, розміщувала Преображення на Фаворі, а Євангеліє від євреїв, цитоване Орігеном, уже говорило про «велику гору Фавор». До VI ст. на вершині стояли три церкви; хрестоносці, а потім наступники Салах-ад-Діна тримали її, а Бейбарс зруйнував її церкву 1263 р."
    - "Сьогодні вершина, до якої веде серпантинна дорога від арабського села Дабурія, несе францисканську базиліку Преображення, збудовану 1924 р. за проєктом Антоніо Барлуцці на руїнах церкви хрестоносців, і грецький православний монастир святого Іллі. Схили — заповідник фаворського дуба, а вид охоплює всю Їзреельську долину від Кармеля до Гільбоа."
  es:
    - "El monte Tabor es una colina aislada y redondeada en el borde nordeste del valle de Jezreel, a unos 575 m sobre el nivel del mar y unos 400 m sobre la llanura, con el Mar de Galilea a 17 km al este. Su forma lo convirtió en proverbio: «como Tabor entre los montes, y como Carmelo en la mar», dice Jeremías, y un salmo dice: «Tabor y Hermón cantarán en tu nombre». Aquí se encontraban las tierras de Isacar, Zabulón y Neftalí, y una ciudad del mismo nombre a su pie fue dada a los levitas. La «red extendida sobre Tabor» de Oseas sugiere que en él se alzaba un santuario."
    - "Su gran día bíblico es la guerra de Débora. Ella mandó llamar a Barac y le dijo: «Ve, y haz gente en el monte de Tabor, y toma contigo diez mil hombres de los hijos de Nephtalí, y de los hijos de Zabulón»; Sísara llevó sus novecientos carros al Cisón, abajo, y «Barac descendió del monte de Tabor» y los puso en fuga. Gedeón preguntó más tarde a los reyes de Madián por los hombres «que matasteis en Tabor», y supo que eran sus propios hermanos."
    - "La colina fue una fortaleza en épocas posteriores. Antíoco III tomó Atabirion a los Ptolomeos en 218 a. C.; Gabinio derrotó cerca de ella al asmoneo Alejandro en 55 a. C.; y en el año 66 d. C. Josefo, como comandante en Galilea, amuralló la cumbre en cuarenta días, solo para que los romanos al mando de Plácido la tomaran al año siguiente. Los Evangelios dicen que Jesús se transfiguró en un «monte alto» a donde llevó «aparte» a sus discípulos, sin nombrarlo, pero una tradición que se remonta al menos al siglo IV, presente en Cirilo de Jerusalén y Jerónimo, situó la Transfiguración en el Tabor, y el Evangelio según los Hebreos citado por Orígenes ya hablaba de «el gran monte Tabor». En el siglo VI había tres iglesias en la cima; los cruzados y luego los sucesores de Saladino lo ocuparon, y Baybars destruyó su iglesia en 1263."
    - "Hoy la cumbre, a la que se llega por una carretera en zigzag desde la aldea árabe de Daburiyya, tiene la basílica franciscana de la Transfiguración, construida en 1924 según el diseño de Antonio Barluzzi sobre las ruinas de la iglesia cruzada, y el monasterio ortodoxo griego de San Elías. Las laderas son una reserva natural de roble del Tabor, y la vista abarca todo el valle de Jezreel, del Carmelo al Gilboa."
  pt:
    - "O monte Tabor é uma colina isolada e arredondada na borda nordeste do vale de Jezreel, a cerca de 575 m acima do mar e uns 400 m acima da planície, com o Mar da Galileia a 17 km a leste. Sua forma o fez proverbial: “como o Tabor entre os montes, e como o Carmelo junto ao mar”, diz Jeremias, e um salmo faz “Tabor e Hermom” se alegrarem no nome de Deus. Aqui se encontravam as terras de Issacar, Zebulom e Naftali, e uma cidade do mesmo nome ao seu pé foi dada aos levitas. A “rede estendida sobre o Tabor” de Oseias sugere que um santuário se erguia nele."
    - "Seu grande dia bíblico é a guerra de Débora. Ela mandou chamar Baraque e disse-lhe: “Vá e marche para o monte Tabor, e leve com você dez mil homens dos filhos de Naftali e dos filhos de Zebulom”; Sísera trouxe seus novecentos carros ao Quisom, abaixo, e “Baraque desceu do monte Tabor” e os derrotou. Gideão mais tarde perguntou aos reis de Midiã sobre os homens “que vocês mataram em Tabor”, e soube que eram seus próprios irmãos."
    - "A colina foi fortaleza em eras posteriores. Antíoco III tomou Atabírion dos Ptolomeus em 218 a.C.; Gabínio derrotou perto dela o asmoneu Alexandre em 55 a.C.; e em 66 d.C. Josefo, como comandante na Galileia, murou o cume em quarenta dias, só para os romanos sob Plácido tomá-lo no ano seguinte. Os Evangelhos dizem que Jesus foi transfigurado “em particular a um alto monte” sem o nomear, mas uma tradição que remonta ao menos ao século IV, achada em Cirilo de Jerusalém e Jerônimo, situou a Transfiguração no Tabor, e o Evangelho segundo os Hebreus citado por Orígenes já falava do “grande monte Tabor”. No século VI três igrejas se erguiam no topo; cruzados e depois os sucessores de Saladino o mantiveram, e Baybars destruiu sua igreja em 1263."
    - "Hoje o cume, alcançado por uma estrada em ziguezague a partir da aldeia árabe de Daburiyya, abriga a basílica franciscana da Transfiguração, construída em 1924 segundo o projeto de Antonio Barluzzi sobre as ruínas da igreja cruzada, e o mosteiro greco-ortodoxo de São Elias. As encostas são uma reserva natural de carvalho-do-Tabor, e a vista abarca todo o vale de Jezreel, do Carmelo ao Gilboa."
  de:
    - "Der Tabor ist ein einzeln stehender, gerundeter Hügel am Nordostrand der Jesreelebene, etwa 575 m über dem Meer und rund 400 m über der Ebene, mit dem See Genezareth 17 km östlich. Seine Form machte ihn zum Sprichwort: „so hoch, wie der Berg Thabor unter den Bergen ist und wie der Karmel am Meer ist“, sagt Jeremia, und in einem Psalm heißt es: „Thabor und Hermon jauchzen in deinem Namen“. Hier trafen die Gebiete von Issachar, Sebulon und Naftali zusammen, und eine Stadt gleichen Namens an seinem Fuß wurde den Leviten gegeben. Hoseas „ausgespanntes Netz zu Thabor“ deutet an, dass auf ihm ein Heiligtum stand."
    - "Sein großer biblischer Tag ist der Krieg der Debora. Sie ließ Barak rufen und sagte ihm: „Gehe hin und zieh auf den Berg Thabor und nimm zehntausend Mann mit dir von den Kindern Naphthali und Sebulon“; Sisera brachte seine neunhundert eisernen Wagen an den Kischon unten, und es heißt: „Also zog Barak von dem Berge Thabor herab“, und er schlug sie in die Flucht. Gideon fragte später die Könige von Midian nach den Männern, „die ihr erwürgtet zu Thabor“, und erfuhr, dass es seine eigenen Brüder waren."
    - "Der Hügel war in späteren Zeiten eine Festung. Antiochos III. nahm Atabyrion 218 v. Chr. den Ptolemäern ab; Gabinius besiegte den Hasmonäer Alexander 55 v. Chr. in seiner Nähe; und 66 n. Chr. ummauerte Josephus als Befehlshaber in Galiläa den Gipfel in vierzig Tagen, nur damit die Römer unter Placidus ihn im folgenden Jahr nahmen. Die Evangelien sagen, Jesus sei „beiseits auf einen hohen Berg“ geführt und verklärt worden, ohne ihn zu nennen, doch eine Überlieferung, die mindestens bis ins 4. Jahrhundert zurückgeht, bei Kyrill von Jerusalem und Hieronymus zu finden, legte die Verklärung auf den Tabor, und das von Origenes zitierte Hebräerevangelium sprach schon vom großen Berg Tabor. Im 6. Jahrhundert standen drei Kirchen auf dem Gipfel; Kreuzfahrer und dann Saladins Nachfolger hielten ihn, und Baibars zerstörte seine Kirche 1263."
    - "Heute trägt der Gipfel, über eine Serpentinenstraße vom arabischen Dorf Daburiyya aus erreichbar, die franziskanische Basilika der Verklärung, 1924 nach dem Entwurf Antonio Barluzzis auf den Ruinen der Kreuzfahrerkirche gebaut, und das griechisch-orthodoxe Kloster des heiligen Elias. Die Hänge sind ein Naturreservat der Tabor-Eiche, und die Aussicht umfasst das ganze Jesreeltal vom Karmel bis zum Gilboa."
  fr:
    - "Le mont Thabor est une colline isolée et arrondie au bord nord-est de la vallée de Jizreel, à environ 575 m au-dessus de la mer et à quelque 400 m au-dessus de la plaine, avec la mer de Galilée à 17 km à l’est. Sa forme en fit un proverbe : « Comme le Thabor parmi les montagnes, comme le Carmel qui s’avance dans la mer », dit Jérémie, et un psaume dit que « le Thabor et l’Hermon se réjouissent à ton nom ». Là se rencontraient les territoires d’Issacar, de Zabulon et de Nephthali, et une ville du même nom à son pied fut donnée aux lévites. Le « filet tendu sur le Thabor » d’Osée suggère qu’un sanctuaire s’y dressait."
    - "Son grand jour biblique est la guerre de Débora. Elle fit appeler Barak et lui dit : « Va, dirige-toi sur le mont Thabor, et prends avec toi dix mille hommes des enfants de Nephthali et des enfants de Zabulon » ; Sisera amena ses neuf cents chars au Kison en contrebas, et « Barak descendit du mont Thabor » et les mit en déroute. Gédéon demanda plus tard aux rois de Madian comment étaient « les hommes que vous avez tués au Thabor », et apprit que c’étaient ses propres frères."
    - "La colline fut une forteresse dans les âges suivants. Antiochos III prit Atabyrion aux Ptolémées en 218 av. J.-C. ; Gabinius y vainquit le Hasmonéen Alexandre en 55 av. J.-C. ; et en 66 apr. J.-C. Flavius Josèphe, commandant en Galilée, ceignit le sommet d’un mur en quarante jours, pour que les Romains sous Placide le prennent l’année suivante. Les Évangiles disent que Jésus fut transfiguré « à l’écart sur une haute montagne » sans la nommer, mais une tradition remontant au moins au IVe siècle, présente chez Cyrille de Jérusalem et Jérôme, plaça la Transfiguration au Thabor, et l’Évangile selon les Hébreux cité par Origène parlait déjà de « la grande montagne du Thabor ». Au VIe siècle, trois églises se dressaient au sommet ; les croisés puis les successeurs de Saladin la tinrent, et Baybars en détruisit l’église en 1263."
    - "Aujourd’hui, le sommet, atteint par une route en lacets depuis le village arabe de Daburiyya, porte la basilique franciscaine de la Transfiguration, bâtie en 1924 sur les plans d’Antonio Barluzzi sur les ruines de l’église des croisés, et le monastère grec orthodoxe Saint-Élie. Les pentes forment une réserve naturelle de chênes du Thabor, et la vue embrasse toute la vallée de Jizreel du Carmel au Guilboa."
  it:
    - "Il Monte Tabor è una collina isolata e rotondeggiante al margine nord-orientale della valle di Izreel, a circa 575 m sul mare e circa 400 m sopra la pianura, con il Lago di Tiberiade a 17 km a est. La sua forma ne fece un proverbio: «un Tabor fra le montagne, come un Carmel che s’avanza sul mare», dice Geremia, e un salmo fa gioire «il Tabor e l’Hermon» al nome di Dio. Qui si incontravano le terre di Issacar, Zabulon e Neftali, e una città dello stesso nome ai suoi piedi fu data ai leviti. La «rete tesa sul Tabor» di Osea suggerisce che vi sorgesse un santuario."
    - "Il suo grande giorno biblico è la guerra di Debora. Ella mandò a chiamare Barak e gli disse: «Va’, raduna sul monte Tabor e prendi teco diecimila uomini de’ figliuoli di Neftali e de’ figliuoli di Zabulon»; Sisara portò i suoi novecento carri al Kison sotto, e «Barak scese dal monte Tabor» e li mise in rotta. Gedeone chiese poi ai re di Madian degli uomini «che avete uccisi al Tabor», e apprese che erano i suoi stessi fratelli."
    - "La collina fu una fortezza nelle età successive. Antioco III prese Atabirio ai Tolomei nel 218 a.C.; Gabinio sconfisse l’asmoneo Alessandro presso di essa nel 55 a.C.; e nel 66 d.C. Giuseppe Flavio, comandante in Galilea, ne cinse la cima di mura in quaranta giorni, ma i Romani sotto Placido la presero l’anno seguente. I Vangeli dicono che Gesù fu trasfigurato su «un alto monte, in disparte» senza nominarlo, ma una tradizione che risale almeno al IV secolo, presente in Cirillo di Gerusalemme e Girolamo, pose la Trasfigurazione sul Tabor, e il Vangelo secondo gli Ebrei citato da Origene parlava già del «grande monte Tabor». Nel VI secolo tre chiese sorgevano in cima; i Crociati e poi i successori di Saladino lo tennero, e Baibars ne distrusse la chiesa nel 1263."
    - "Oggi la cima, raggiunta da una strada a tornanti dal villaggio arabo di Daburiyya, ospita la basilica francescana della Trasfigurazione, costruita nel 1924 su progetto di Antonio Barluzzi sulle rovine della chiesa crociata, e il monastero greco-ortodosso di sant’Elia. I pendii sono una riserva naturale di quercia del Tabor, e la vista abbraccia l’intera valle di Izreel dal Carmelo al Gelboe."
  pl:
    - "Góra Tabor to samotne, zaokrąglone wzgórze na północno-wschodnim skraju doliny Jizreel, około 575 m n.p.m. i mniej więcej 400 m nad równiną, z Jeziorem Galilejskim 17 km na wschód. Jej kształt uczynił ją przysłowiem: „jako Tabor między górami, i jako Karmel przy morzu”, mówi Jeremiasz, a psalm mówi: „Tabor i Hermon śpiewają o imieniu twojem”. Tu stykały się ziemie Issachara, Zabulona i Neftalego, a miasto o tej samej nazwie u jej stóp zostało oddane Lewitom. Ozeasz oskarża: „żeście sidłem w Masfa, a siecią rozciągnioną na wierzchu Tabor”, co sugeruje, że stało na niej sanktuarium."
    - "Jej wielki biblijny dzień to wojna Debory. Posłała po Baraka i rzekła mu: „idź, a zbierz lud na górze Tabor, a weźmij z sobą dziesięć tysięcy mężów z synów Neftalimowych, i z synów Zabulonowych”; Sisera sprowadził swoje dziewięćset wozów nad Kiszon poniżej, a „zszedł Barak z góry Tabor” i je rozgromił. Gedeon zapytał później królów Madianu o mężów, „któreście pobili w Tabor”, i dowiedział się, że byli jego braćmi."
    - "Wzgórze było twierdzą w późniejszych wiekach. Antioch III zdobył Atabyrion od Ptolemeuszów w 218 r. p.n.e.; Gabiniusz pokonał hasmonejskiego Aleksandra koło niego w 55 r. p.n.e.; a w 66 r. n.e. Józef Flawiusz, jako dowódca w Galilei, obwarował szczyt murem w czterdzieści dni, by Rzymianie pod Placydusem zdobyli go w następnym roku. Ewangelie mówią, że Jezus wprowadził uczniów „na górę wysoką osobno”, i został przemieniony, nie wymieniając jej nazwy, ale tradycja sięgająca co najmniej IV w., obecna u Cyryla Jerozolimskiego i Hieronima, umieściła Przemienienie na Taborze, a Ewangelia według Hebrajczyków, cytowana przez Orygenesa, mówiła już o „wielkiej górze Tabor”. W VI w. na szczycie stały trzy kościoły; trzymali ją krzyżowcy, a potem następcy Saladyna, a Bajbars zniszczył jej kościół w 1263 r."
    - "Dziś szczyt, osiągalny serpentynową drogą z arabskiej wsi Daburiyya, nosi franciszkańską bazylikę Przemienienia, zbudowaną w 1924 r. według projektu Antonia Barluzziego na ruinach kościoła krzyżowców, i grecko-prawosławny klasztor św. Eliasza. Zbocza to rezerwat przyrody z dębem taborskim, a widok obejmuje całą dolinę Jizreel od Karmelu do Gilboa."
  nl:
    - "De Tabor is een alleenstaande, ronde heuvel aan de noordoostrand van de vallei van Jizreël, ongeveer 575 m boven zee en zo'n 400 m boven de vlakte, met het Meer van Galilea 17 km naar het oosten. Zijn vorm maakte hem spreekwoordelijk: “als Thabor onder de bergen, en als Karmel bij de zee”, zegt Jeremia, en een psalm zegt: “Thabor en Hermon juichen in Uw Naam”. Hier kwamen de gebieden van Issachar, Zebulon en Naftali samen, en een stad met dezelfde naam aan zijn voet werd aan de Levieten gegeven. Hosea's “uitgespannen net op Thabor” doet vermoeden dat er een heiligdom op stond."
    - "Zijn grote bijbelse dag is de oorlog van Debora. Zij ontbood Barak en zei hem: “Ga heen en trek op den berg Thabor, en neem met u tien duizend man, van de kinderen van Nafthali, en van de kinderen van Zebulon”; Sisera bracht zijn negenhonderd wagens naar de Kison beneden, en “Zo trok Barak van den berg Thabor af” en versloeg hen. Gideon vroeg later de koningen van Midian naar de mannen “die gij te Thabor doodsloegt”, en vernam dat het zijn eigen broers waren."
    - "De heuvel was in latere tijden een vesting. Antiochus III nam Atabyrion in 218 v.Chr. van de Ptolemaeën in; Gabinius versloeg de Hasmoneeër Alexander in 55 v.Chr. in de buurt; en in 66 n.Chr. versterkte Josephus, als bevelhebber in Galilea, de top in veertig dagen met een muur, alleen opdat de Romeinen onder Placidus hem het volgende jaar innamen. De evangeliën zeggen dat Jezus van gedaante veranderde op “een hogen berg alleen” zonder hem te noemen, maar een overlevering die minstens teruggaat tot de vierde eeuw, bij Cyrillus van Jeruzalem en Hiëronymus, plaatste de Gedaanteverandering op de Tabor, en het Evangelie naar de Hebreeën, geciteerd door Origenes, sprak al van “de grote berg Tabor”. In de zesde eeuw stonden drie kerken op de top; kruisvaarders en daarna Saladins opvolgers hielden hem, en Baibars vernielde zijn kerk in 1263."
    - "Tegenwoordig draagt de top, bereikt via een haarspeldweg vanuit het Arabische dorp Daburiyya, de Franciscaanse basiliek van de Gedaanteverandering, in 1924 gebouwd naar een ontwerp van Antonio Barluzzi op de ruïnes van de kruisvaarderskerk, en het Grieks-orthodoxe klooster van Sint-Elia. De hellingen zijn een natuurreservaat van taboreiken, en het uitzicht omvat de hele vallei van Jizreël van de Karmel tot de Gilboa."
  cs:
    - "Tábor je osamělý, oblý pahorek na severovýchodním okraji Jizreelského údolí, asi 575 m nad mořem a asi 400 m nad rovinou, s Galilejským jezerem 17 km na východ. Jeho tvar z něj udělal přísloví: „jakž jest Tábor mezi horami, a jako Karmel při moři“, praví Jeremjáš, a žalm praví: „Tábor a Hermon o tvém jménu zpívají“. Zde se stýkaly země Isacharova, Zebulunova a Neftalího a stejnojmenné město na jeho úpatí bylo dáno levitům. Ozeášovo „sítka rozestřená na vrchu Tábor“ nasvědčuje, že na něm stála svatyně."
    - "Jeho velký biblický den je válka Debořina. Debora poslala pro Báraka a řekla mu, že Hospodin přikázal: „shromáždě lid na horu Tábor, vezmi s sebou deset tisíc mužů z synů Neftalím a z synů Zabulon“; Sisera přivedl svých devět set vozů ke Kíšonu dole a „sstoupil Barák s hory Tábor“ a rozprášil je. Gedeon se později ptal králů Midjánu na muže, „kteréž jste pobili na hoře Tábor“, a poznal, že to byli jeho vlastní bratři."
    - "Pahorek byl v pozdějších věcích pevností. Antiochos III. vzal Atabyrion Ptolemaiovcům roku 218 př. n. l.; Gabinius porazil hasmonejského Alexandra poblíž něj roku 55 př. n. l.; a roku 66 n. l. Josephus, velitel v Galileji, obehnal vrchol zdí za čtyřicet dní, jen aby jej příštího roku vzali Římané pod Placidem. Evangelia praví, že Ježíš uvedl učedníky „na horu vysokou soukromí“, kde byl proměněn, aniž ji jmenují, ale tradice sahající nejméně do 4. století, doložená u Cyrila Jeruzalémského a Jeronýma, kladla Proměnění na Tábor, a Evangelium podle Hebrejů, citované Origenem, mluvilo už o „velké hoře Tábor“. V 6. století stály na vrcholu tři kostely; křižáci a pak Saladinovi nástupci jej drželi a Bajbars zničil jeho kostel roku 1263."
    - "Dnes na vrcholu, dostupném serpentinovou silnicí od arabské vesnice Daburiyya, stojí františkánská bazilika Proměnění, postavená roku 1924 podle návrhu Antonia Barluzziho na troskách křižáckého kostela, a řecký pravoslavný klášter svatého Elijáše. Svahy jsou přírodní rezervací táborského dubu a výhled zahrnuje celé Jizreelské údolí od Karmelu po Gilboa."
  sv:
    - "Tabor är en ensam, rundad kulle vid Jisreeldalens nordöstra kant, omkring 575 m över havet och ungefär 400 m över slätten, med Galileiska sjön 17 km åt öster. Dess form gjorde det till ett ordspråk: Jeremia säger ”väldig såsom Tabor ibland bergen, såsom Karmel vid havet”, och en psalm låter ”Tabor och Hermon jubla i ditt namn”. Här möttes Isaskars, Sebulons och Naftalis områden, och en stad med samma namn vid dess fot gavs åt leviterna. Hoseas ”nät, utbrett på Tabor” tyder på att en helgedom stod på berget."
    - "Dess stora bibliska dag är Deboras krig. Hon lät kalla på Barak och sade till honom: ”Drag åstad upp på berget Tabor och tag med dig tio tusen man av Naftali barn och Sebulons barn”; Sisera förde sina niohundra stridsvagnar till Kishon nedanför. ”Så drog då Barak ned från berget Tabor”, och Siseras här slogs på flykten. Gideon frågade senare Midjans kungar om de män ”som I dräpten på Tabor” och fick veta att det var hans egna bröder."
    - "Kullen var en fästning under senare tider. Antiochos III tog Atabyrion från ptolemaierna 218 f.Kr.; Gabinius besegrade hasmoneen Alexander i närheten 55 f.Kr.; och år 66 e.Kr. lät Josefus, som befälhavare i Galileen, mura in toppen på fyrtio dagar, men romarna under Placidus intog den året därpå. Evangelierna säger att Jesus förklarades på ”ett högt berg, där de voro allena” utan att nämna det vid namn, men en tradition som går tillbaka åtminstone till 300-talet, hos Kyrillos av Jerusalem och Hieronymus, förlade förklaringen till Tabor, och Hebreerevangeliet som Origenes citerade talade redan om ”det stora berget Tabor”. På 500-talet stod tre kyrkor på toppen; korsfarare och därefter Saladins efterträdare höll berget, och Baybars förstörde dess kyrka 1263."
    - "I dag bär toppen, som nås via en serpentinväg från den arabiska byn Daburiyya, den franciskanska förklaringsbasilikan, byggd 1924 efter ritningar av Antonio Barluzzi på ruinerna av korsfararkyrkan, och det grekisk-ortodoxa klostret S:t Elias. Sluttningarna är ett naturreservat med tabor-ek, och utsikten omfattar hela Jisreeldalen från Karmel till Gilboa."
  nb:
    - "Tabor er en enslig, avrundet høyde i den nordøstlige kanten av Jisreel-dalen, omtrent 575 m over havet og rundt 400 m over sletten, med Galileasjøen 17 km mot øst. Formen gjorde den til et ordtak: «Som Tabor iblandt fjellene og som Karmel ved havet», sier Jeremia, og en salme lar «Tabor og Hermon» juble «over ditt navn». Her møttes områdene til Issakar, Sebulon og Naftali, og en by med samme navn ved foten ble gitt til levittene. Hoseas «utspent nett på Tabor» tyder på at det lå en helligdom der."
    - "Dens store bibelske dag er Deboras krig. Hun sendte bud etter Barak og sa til ham: «Gå av sted og dra op på Tabor-fjellet og ta med dig ti tusen mann av Naftalis barn og av Sebulons barn!» Sisera førte sine ni hundre vogner til Kisjon nedenfor, og da «drog Barak ned fra Tabor-fjellet» og slo dem på flukt. Gideon spurte senere Midjans konger om mennene «som I slo ihjel på Tabor», og fikk vite at det var hans egne brødre."
    - "Høyden var en festning i senere tider. Antiokhos III tok Atabyrion fra ptolemeerne i 218 f.Kr.; Gabinius beseiret hasmoneeren Aleksander ved den i 55 f.Kr.; og i 66 e.Kr. murte Josefus, som sjef i Galilea, toppen i løpet av førti dager, bare for at romerne under Placidus inntok den året etter. Evangeliene sier at Jesus ble forklaret på «et høit fjell» avsides uten å nevne navnet, men en tradisjon som går tilbake til minst 300-tallet, hos Kyrillos av Jerusalem og Hieronymus, plasserte forklarelsen på Tabor, og Hebreerevangeliet, sitert av Origenes, talte allerede om «det store fjellet Tabor». På 500-tallet sto det tre kirker på toppen; korsfarerne og deretter Saladins etterfølgere holdt den, og Baybars ødela kirken i 1263."
    - "I dag har toppen, som nås med en vei med hårnålssvinger fra den arabiske landsbyen Daburiyya, den franciskanske forklarelsesbasilikaen, bygd i 1924 etter tegninger av Antonio Barluzzi på ruinene av korsfarerkirken, og det gresk-ortodokse klosteret Sankt Elia. Skråningene er et naturreservat med tabor-eik, og utsikten omfatter hele Jisreel-dalen fra Karmel til Gilboa."
