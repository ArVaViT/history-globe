body:
  en:
    - "In the New Testament Asia is not the continent but the Roman province of that name: the western third of Asia Minor, the Aegean coast with its old Greek cities and the valleys of the Hermus, Cayster and Maeander running inland through Mysia, Lydia, Caria and Phrygia. Attalus III of Pergamum bequeathed his kingdom to Rome in 133 BC, and after the revolt of Aristonicus it was organised as a province in 129 BC. It was among the richest in the empire, governed by a proconsul of senatorial rank; Pergamum was its first seat, Ephesus its real capital by the first century AD. The “chief of Asia” of Acts, the Asiarchs, were leading men of its cities, and the cities vied for the title of warden of a temple of the emperors."
    - "Jews from Asia heard the apostles at Pentecost. On his second journey Paul and his companions were “forbidden of the Holy Ghost to preach the word in Asia”; on the third he taught more than two years at Ephesus, “so that all they which dwelt in Asia heard the word of the Lord Jesus, both Jews and Greeks”. Demetrius the silversmith complained that “not alone at Ephesus, but almost throughout all Asia” Paul had turned people from the gods, and some Asiarchs, Paul's friends, begged him not to venture into the theatre. Tychicus and Trophimus “of Asia” travelled with him; he sailed past Ephesus so as not to spend time in Asia; and it was “the Jews which were of Asia” who seized him in the temple at Jerusalem."
    - "The letters show the churches of the province: “The churches of Asia salute you”, Paul writes from Ephesus to Corinth; later he recalls “our trouble which came to us in Asia” and laments that “all they which are in Asia be turned away from me”. Epaenetus is the firstfruits of Asia in the oldest manuscripts of Romans, of Achaia in the King James and Synodal texts. Peter writes to the strangers of Pontus, Galatia, Cappadocia, Asia and Bithynia, and John “to the seven churches which are in Asia”: Ephesus, Smyrna, Pergamos, Thyatira, Sardis, Philadelphia and Laodicea, which lie on a circuit of roads through the province. Colossae and Hierapolis belonged to it too. In the second century Ignatius wrote to its churches, Polycarp led Smyrna, Melito Sardis and Papias Hierapolis."
    - "Diocletian broke the great province into smaller ones, and the name lived on as a diocese of the later empire. Today the land is the west of Turkey: İzmir on the site of Smyrna, Bergama at Pergamum, Selçuk beside the ruins of Ephesus, Sart, Alaşehir and Denizli near Laodicea."
  ru:
    - "В Новом Завете Асия — не материк, а римская провинция с таким именем: западная треть Малой Азии, эгейское побережье со старыми греческими городами и долины Герма, Каистра и Меандра, уходящие вглубь через Мисию, Лидию, Карию и Фригию. Аттал III Пергамский завещал своё царство Риму в 133 г. до н. э., и после восстания Аристоника оно в 129 г. до н. э. было устроено как провинция. Она была одной из богатейших в империи и управлялась проконсулом сенаторского ранга; Пергам был её первой резиденцией, Ефес к I веку н. э. — настоящей столицей. Асийские начальники из Деяний, асиархи, были первыми людьми её городов, а города соперничали за звание стража храма императоров."
    - "Иудеи из Асии слышали апостолов в день Пятидесятницы. Во втором путешествии Павел и его спутники «не были допущены Духом Святым проповедывать слово в Асии»; в третьем он учил более двух лет в Ефесе, «так что все жители Асии слышали проповедь о Господе Иисусе, как Иудеи, так и Еллины». Серебряник Димитрий жаловался, что «не только в Ефесе, но почти во всей Асии» Павел отвратил людей от богов, а некоторые асиархи, друзья Павла, просили его не показываться на зрелище. Асийцы Тихик и Трофим сопровождали его; он миновал Ефес, чтобы не замедлить в Асии; и именно «Асийские Иудеи» схватили его в храме в Иерусалиме."
    - "Послания показывают церкви провинции: «Приветствуют вас церкви Асийские», пишет Павел из Ефеса в Коринф; позже он вспоминает «о скорби нашей, бывшей с нами в Асии», и сетует: «все Асийские оставили меня». Епенет в древнейших рукописях — начаток Асии, в тексте Короля Иакова и в Синодальном — Ахаии. Пётр пишет пришельцам Понта, Галатии, Каппадокии, Асии и Вифинии, а Иоанн — «семи церквам, находящимся в Асии»: в Ефес, Смирну, Пергам, Фиатиру, Сардис, Филадельфию и Лаодикию, лежащие на кольце дорог провинции. К ней относились и Колоссы с Иераполем. Во II веке Игнатий писал её церквам, Поликарп возглавлял Смирну, Мелитон — Сардис, Папий — Иераполь."
    - "Диоклетиан разделил большую провинцию на меньшие, и имя осталось за диоцезом поздней империи. Сегодня это запад Турции: Измир на месте Смирны, Бергама у Пергама, Сельчук рядом с развалинами Ефеса, Сарт, Алашехир и Денизли близ Лаодикии."
  uk:
    - "У Новому Завіті Азія — не материк, а римська провінція з такою назвою: західна третина Малої Азії, егейське узбережжя зі старими грецькими містами та долинами Герма, Каїстра і Меандра, що йдуть углиб через Місію, Лідію, Карію та Фрігію. Аттал III Пергамський заповів своє царство Римові в 133 р. до н. е., і після повстання Арістоніка його організовано як провінцію в 129 р. до н. е. Вона була однією з найбагатших в імперії, під управою проконсула сенаторського рангу; Пергам був її першою резиденцією, Ефес — справжньою столицею вже в I столітті н. е. Азийська старшина в Діях, тобто асіархи, — провідні люди її міст, і міста змагалися за звання храмоохоронця імператорських храмів."
    - "Юдеї з Азії чули апостолів у П'ятидесятницю. У другій подорожі, коли Павло з супутниками проходили Фрігію й Галацьку сторону, «заборонив їм сьвятий Дух промовляти слово в Азиї»; у третій він навчав понад два роки в Ефесі, «так що всї, що проживали в Азиї, слухали слово Господа Ісуса, — Жиди й Єленяне». Димитрій срібляр скаржився, що «не то в Єфесї, а мало не по всїй Азиї» Павло відвернув народ від богів, а деякі асіархи, друзі Павла, благали його не йти до театру. Тихик і Трофим, «Азияне», подорожували з ним; він проплив повз Ефес, щоб не гаятися в Азії; і саме «Азийські Жиди» схопили його в храмі в Єрусалимі."
    - "Послання показують церкви провінції: «Витають вас церкви Азийські», пише Павло з Ефеса до Коринта; згодом він згадує «горе наше, що було нам в Азиї» і жалкує, що «одвернулись од мене всї, що в Азиї». Епенет у найдавніших рукописях Послання до римлян — первоплід Азії, а в тексті короля Якова і в Синодальному — Ахаї. Петро пише захожанам Понту, Галатії, Каппадокії, Азії та Віфінії, а Іван — «семи церквам, що в Азиї»: Ефесу, Смирні, Пергаму, Тіатирі, Сардам, Філадельфії та Лаодікеї, які лежать на колі доріг провінції. Колоси та Ієраполіс теж належали до неї. У II столітті Ігнатій писав її церквам, Полікарп очолював Смирну, Мелітон — Сарди, а Папій — Ієраполіс."
    - "Діоклетіан розбив велику провінцію на менші, і назва жила далі як діоцез пізньої імперії. Нині ця земля — захід Туреччини: Ізмір на місці Смирни, Бергама на місці Пергаму, Сельчук біля руїн Ефеса, Сарт, Алашехір і Денізлі поблизу Лаодікеї."
  es:
    - "En el Nuevo Testamento Asia no es el continente sino la provincia romana de ese nombre: el tercio occidental del Asia Menor, la costa del Egeo con sus antiguas ciudades griegas y los valles del Hermo, el Caístro y el Meandro que penetran tierra adentro por Misia, Lidia, Caria y Frigia. Átalo III de Pérgamo legó su reino a Roma en 133 a. C., y tras la revuelta de Aristónico fue organizado como provincia en 129 a. C. Fue una de las más ricas del imperio, gobernada por un procónsul de rango senatorial; Pérgamo fue su primera sede, Éfeso su verdadera capital en el siglo I d. C. Los «principales de Asia» de los Hechos, los asiarcas, eran hombres destacados de sus ciudades, y las ciudades rivalizaban por el título de guardianas de un templo de los emperadores."
    - "Judíos de Asia oyeron a los apóstoles en Pentecostés. En su segundo viaje, a Pablo y sus compañeros «les fué prohibido por el Espíritu Santo hablar la palabra en Asia»; en el tercero enseñó más de dos años en Éfeso, «de manera que todos los que habitaban en Asia, Judíos y Griegos, oyeron la palabra del Señor Jesús». Demetrio el platero se quejó de que «no solamente en Efeso, sino á muchas gentes de casi toda el Asia» Pablo había apartado a la gente de los dioses, y algunos asiarcas, amigos de Pablo, le rogaron que no se presentase en el teatro. Tíquico y Trófimo, «de Asia», viajaron con él; pasó de largo ante Éfeso para no detenerse en Asia; y fueron «unos Judíos de Asia» quienes lo apresaron en el templo de Jerusalén."
    - "Las cartas muestran las iglesias de la provincia: «Las iglesias de Asia os saludan», escribe Pablo desde Éfeso a Corinto; más tarde recuerda «nuestra tribulación que nos fué hecha en Asia» y se lamenta de que «me han sido contrarios todos los que son en Asia». Epeneto es las primicias de Asia en los manuscritos más antiguos de Romanos, de Acaya en los textos de la versión del rey Jacobo y sinodal. Pedro escribe a los extranjeros de Ponto, Galacia, Capadocia, Asia y Bitinia, y Juan «á las siete iglesias que están en Asia»: Éfeso, Esmirna, Pérgamo, Tiatira, Sardis, Filadelfia y Laodicea, que se hallan en un circuito de caminos por la provincia. También pertenecían a ella Colosas y Hierápolis. En el siglo II Ignacio escribió a sus iglesias, Policarpo dirigió Esmirna, Melitón Sardis y Papías Hierápolis."
    - "Diocleciano dividió la gran provincia en otras menores, y el nombre sobrevivió como diócesis del imperio tardío. Hoy la tierra es el oeste de Turquía: İzmir en el sitio de Esmirna, Bergama en Pérgamo, Selçuk junto a las ruinas de Éfeso, Sart, Alaşehir y Denizli cerca de Laodicea."
  pt:
    - "No Novo Testamento, a Ásia não é o continente, mas a província romana desse nome: o terço ocidental da Ásia Menor, a costa do Egeu com suas antigas cidades gregas e os vales do Hermo, do Caístro e do Meandro, que penetram pela Mísia, Lídia, Cária e Frígia. Átalo III de Pérgamo legou seu reino a Roma em 133 a.C., e depois da revolta de Aristônico foi organizado como província em 129 a.C. Estava entre as mais ricas do império, governada por um procônsul de posição senatorial; Pérgamo foi a primeira sede, Éfeso a verdadeira capital no século I d.C. Os asiarcas de Atos eram os principais de suas cidades, que disputavam o título de guardiã do templo dos imperadores."
    - "Judeus da Ásia ouviram os apóstolos em Pentecostes. Na segunda viagem, Paulo e seus companheiros foram impedidos pelo Espírito Santo “de anunciar a palavra na Ásia”; na terceira, ele ensinou mais de dois anos em Éfeso, “de modo que todos os que habitavam na Ásia ouviram a palavra do Senhor Jesus, tanto judeus como gregos”. O ourives Demétrio queixou-se de que “não somente em Éfeso, mas em quase toda a Ásia” Paulo desviara as pessoas dos deuses, e alguns asiarcas, amigos de Paulo, pediram-lhe que não se arriscasse a ir ao teatro. Tíquico e Trófimo, “da Ásia”, viajaram com ele; ele passou ao largo de Éfeso para não se demorar na Ásia; e foram “os judeus da Ásia” que o agarraram no templo de Jerusalém."
    - "As cartas mostram as igrejas da província: “As igrejas da Ásia os saúdam”, escreve Paulo de Éfeso a Corinto; depois recorda “a aflição que nos sobreveio na Ásia” e lamenta que “todos os que estão na Ásia se afastaram de mim”. Epêneto é as primícias da Ásia nos manuscritos mais antigos de Romanos, da Acaia nos textos King James e sinodal. Pedro escreve aos estrangeiros do Ponto, Galácia, Capadócia, Ásia e Bitínia, e João “às sete igrejas que estão na Ásia”: Éfeso, Esmirna, Pérgamo, Tiatira, Sardes, Filadélfia e Laodiceia, que ficam num circuito de estradas pela província. Colossos e Hierápolis também lhe pertenciam. No século II, Inácio escreveu às suas igrejas, Policarpo dirigiu Esmirna, Melitão Sardes e Papias Hierápolis."
    - "Diocleciano dividiu a grande província em menores, e o nome sobreviveu como diocese do Império tardio. Hoje a terra é o oeste da Turquia: İzmir no lugar de Esmirna, Bergama em Pérgamo, Selçuk junto às ruínas de Éfeso, Sart, Alaşehir e Denizli perto de Laodiceia."
  de:
    - "Asien ist im Neuen Testament nicht der Kontinent, sondern die römische Provinz dieses Namens: das westliche Drittel Kleinasiens, die Ägäisküste mit ihren alten griechischen Städten und die Täler von Hermos, Kaystros und Mäander, die durch Mysien, Lydien, Karien und Phrygien landeinwärts führen. Attalos III. von Pergamon vermachte sein Königreich 133 v. Chr. Rom, und nach dem Aufstand des Aristonikos wurde es 129 v. Chr. als Provinz eingerichtet. Sie gehörte zu den reichsten des Reiches, von einem Prokonsul senatorischen Ranges verwaltet; Pergamon war ihr erster Sitz, Ephesus im 1. Jahrhundert n. Chr. ihre eigentliche Hauptstadt. Die „Obersten in Asien“ der Apostelgeschichte, die Asiarchen, waren führende Männer ihrer Städte, und die Städte wetteiferten um den Titel eines Tempelhüters der Kaiser."
    - "Juden aus Asien hörten die Apostel zu Pfingsten. Auf der zweiten Reise „ward ihnen gewehrt von dem heiligen Geiste, zu reden das Wort in Asien“; auf der dritten lehrte Paulus über zwei Jahre in Ephesus, „also daß alle, die in Asien wohnten, das Wort des HERRN Jesus hörten, beide, Juden und Griechen“. Der Silberschmied Demetrius klagte, „nicht allein zu Ephesus sondern auch fast in ganz Asien“ mache Paulus Volk von den Göttern abfällig, und einige Asiarchen, Freunde des Paulus, baten ihn, sich nicht ins Theater zu begeben. Tychikus und Trophimus, „aus Asien“, reisten mit ihm; er segelte an Ephesus vorbei, um nicht in Asien Zeit zu verlieren; und „die Juden aus Asien“ ergriffen ihn im Tempel zu Jerusalem."
    - "Die Briefe zeigen die Gemeinden der Provinz: „Es grüßen euch die Gemeinden in Asien“, schreibt Paulus aus Ephesus nach Korinth; später erinnert er an „unsre Trübsal, die uns in Asien widerfahren ist“ und klagt, „daß sich von mir gewandt haben alle, die in Asien sind“. Epänetus ist in den ältesten Handschriften des Römerbriefs der Erstling Asiens, in den Texten der King-James- und der Synodalbibel Achajas. Petrus schreibt an die Fremdlinge in Pontus, Galatien, Kappadokien, Asien und Bithynien, und Johannes „den sieben Gemeinden in Asien“: Ephesus, Smyrna, Pergamon, Thyatira, Sardes, Philadelphia und Laodizea, die an einem Straßenring durch die Provinz liegen. Auch Kolossae und Hierapolis gehörten dazu. Im 2. Jahrhundert schrieb Ignatius an ihre Gemeinden, Polykarp leitete Smyrna, Melito Sardes und Papias Hierapolis."
    - "Diokletian zerlegte die große Provinz in kleinere, und der Name lebte als Diözese des späteren Reiches fort. Heute ist das Land der Westen der Türkei: Izmir an der Stelle Smyrnas, Bergama bei Pergamon, Selçuk neben den Ruinen von Ephesus, Sart, Alaşehir und Denizli bei Laodizea."
  fr:
    - "Dans le Nouveau Testament, l’Asie n’est pas le continent mais la province romaine de ce nom : le tiers occidental de l’Asie Mineure, la côte égéenne avec ses vieilles cités grecques et les vallées de l’Hermos, du Caÿstre et du Méandre pénétrant dans les terres à travers la Mysie, la Lydie, la Carie et la Phrygie. Attale III de Pergame légua son royaume à Rome en 133 av. J.-C., et après la révolte d’Aristonicos il fut organisé en province en 129 av. J.-C. Elle était parmi les plus riches de l’Empire, gouvernée par un proconsul de rang sénatorial ; Pergame fut son premier siège, Éphèse sa vraie capitale au Ier siècle apr. J.-C. Les asiarques des Actes, « chefs de l’Asie », étaient des notables de ses villes, et les villes se disputaient le titre de gardienne du temple des empereurs."
    - "Des Juifs d’Asie entendirent les apôtres à la Pentecôte. Lors de son deuxième voyage, Paul et ses compagnons furent « empêchés par le Saint-Esprit d’annoncer la parole dans l’Asie » ; lors du troisième, il enseigna plus de deux ans à Éphèse, « de sorte que tous ceux qui habitaient l’Asie, Juifs et Grecs, entendirent la parole du Seigneur ». L’orfèvre Démétrius se plaignit que « non seulement à Éphèse, mais dans presque toute l’Asie », Paul avait détourné les gens des dieux, et quelques asiarques, amis de Paul, le prièrent de ne pas se rendre au théâtre. Tychique et Trophime, « originaires d’Asie », voyageaient avec lui ; il passa devant Éphèse pour ne pas perdre de temps « en Asie » ; et ce furent « les Juifs d’Asie » qui le saisirent dans le temple à Jérusalem."
    - "Les épîtres montrent les Églises de la province : « Les Églises d’Asie vous saluent », écrit Paul d’Éphèse à Corinthe ; plus tard il rappelle « la tribulation qui nous est survenue en Asie » et se plaint que « tous ceux qui sont en Asie m’ont abandonné ». Épaïnète est les prémices de l’Asie dans les plus anciens manuscrits de Romains, de l’Achaïe dans les textes King James et synodal. Pierre écrit aux étrangers du Pont, de la Galatie, de la Cappadoce, de l’Asie et de la Bithynie, et Jean « aux sept Églises qui sont en Asie » : Éphèse, Smyrne, Pergame, Thyatire, Sardes, Philadelphie et Laodicée, situées sur un circuit routier de la province. Colosses et Hiérapolis en faisaient aussi partie. Au IIe siècle, Ignace écrivit à ses Églises, Polycarpe dirigea Smyrne, Méliton Sardes et Papias Hiérapolis."
    - "Dioclétien morcela la grande province en provinces plus petites, et le nom survécut comme diocèse du Bas-Empire. Aujourd’hui le pays est l’ouest de la Turquie : İzmir à l’emplacement de Smyrne, Bergama à Pergame, Selçuk à côté des ruines d’Éphèse, Sart, Alaşehir et Denizli près de Laodicée."
  it:
    - "Nel Nuovo Testamento l’Asia non è il continente ma la provincia romana di tale nome: il terzo occidentale dell’Asia Minore, la costa egea con le sue antiche città greche e le valli dell’Ermo, del Caistro e del Meandro che salgono nell’interno attraverso Misia, Lidia, Caria e Frigia. Attalo III di Pergamo lasciò in eredità il suo regno a Roma nel 133 a.C., e dopo la rivolta di Aristonico fu organizzato come provincia nel 129 a.C. Fu fra le più ricche dell’impero, governata da un proconsole di rango senatorio; Pergamo fu la prima sede, Efeso la vera capitale dal I secolo d.C. I «magistrati dell’Asia» degli Atti, gli Asiarchi, erano uomini eminenti delle sue città, che gareggiavano per il titolo di custode di un tempio degli imperatori."
    - "Giudei dell’Asia ascoltarono gli apostoli a Pentecoste. Nel secondo viaggio Paolo e i suoi compagni ricevettero il divieto, «avendo lo Spirito Santo vietato loro d’annunziar la Parola in Asia»; nel terzo insegnò più di due anni a Efeso, «talché tutti coloro che abitavano nell’Asia, Giudei e Greci, udirono la parola del Signore». Demetrio l’argentiere si lamentò che «non solo in Efeso, ma quasi in tutta l’Asia» Paolo aveva distolto la gente dagli dèi, e alcuni Asiarchi, amici di Paolo, lo pregarono di non avventurarsi nel teatro. Tichico e Trofimo «della provincia d’Asia» viaggiarono con lui; egli navigò oltre Efeso per non perdere tempo in Asia; e furono «i Giudei dell’Asia» a prenderlo nel tempio di Gerusalemme."
    - "Le lettere mostrano le chiese della provincia: «Le chiese dell’Asia vi salutano», scrive Paolo da Efeso a Corinto; più tardi ricorda «l’afflizione che ci colse in Asia» e lamenta che «tutti quelli che sono in Asia mi hanno abbandonato». Epeneto è la primizia dell’Asia nei più antichi manoscritti di Romani, dell’Acaia nei testi King James e sinodale. Pietro scrive ai forestieri del Ponto, della Galazia, della Cappadocia, dell’Asia e della Bitinia, e Giovanni «alle sette chiese che sono nell’Asia»: Efeso, Smirne, Pergamo, Tiatira, Sardi, Filadelfia e Laodicea, che stanno su un circuito di strade attraverso la provincia. Anche Colosse e Gerapoli le appartenevano. Nel II secolo Ignazio scrisse alle sue chiese, Policarpo guidò Smirne, Melitone Sardi e Papia Gerapoli."
    - "Diocleziano spezzò la grande provincia in province minori, e il nome sopravvisse come diocesi del tardo impero. Oggi la terra è l’ovest della Turchia: İzmir sul sito di Smirne, Bergama a Pergamo, Selçuk accanto alle rovine di Efeso, Sart, Alaşehir e Denizli presso Laodicea."
  pl:
    - "W Nowym Testamencie Azja to nie kontynent, lecz rzymska prowincja o tej nazwie: zachodnia trzecia część Azji Mniejszej, wybrzeże Morza Egejskiego ze starymi miastami greckimi i doliny Hermosu, Kaistrosu i Meandru biegnące w głąb lądu przez Myzję, Lidię, Karię i Frygię. Attalos III z Pergamonu zapisał swe królestwo Rzymowi w 133 r. p.n.e., a po powstaniu Arystonikosa zorganizowano je jako prowincję w 129 r. p.n.e. Należała do najbogatszych w cesarstwie, rządzona przez prokonsula rangi senatorskiej; jej pierwszą siedzibą był Pergamon, a prawdziwą stolicą w I wieku n.e. Efez. Dzieje wspominają „przedniejszych mężów Azyjackich”, azjarchów, czołowych ludzi jej miast, które rywalizowały o tytuł opiekuna świątyni cesarzy."
    - "Żydzi z Azji słyszeli apostołów w dniu Pięćdziesiątnicy. W drugiej podróży Paweł i jego towarzysze byli „zawściągnieni będąc od Ducha Świętego, aby nie opowiadali słowa Bożego w Azyi”; w trzeciej nauczał ponad dwa lata w Efezie, „tak iż wszyscy, którzy mieszkali w Azyi, słuchali słowa Pana Jezusowego, tak Żydowie, jako i Grekowie”. Demetriusz złotnik skarżył się, że „nie tylko w Efezie, ale mało nie po wszystkiej Azyi” Paweł odwrócił ludzi od bogów, a niektórzy azjarchowie, przyjaciele Pawła, prosili go, by nie szedł do teatru. Tychik i Trofim, pochodzący z Azji, podróżowali z nim; ominął Efez w żegludze, by nie tracić czasu w Azji; a to „Żydowie z Azyi” pochwycili go w świątyni w Jerozolimie."
    - "Listy ukazują zbory prowincji: „Pozdrawiają was zbory, które są w Azyi”, pisze Paweł z Efezu do Koryntu; później wspomina „o ucisku naszym, który nas spotkał w Azyi” i skarży się, że „mię odstąpili wszyscy, którzy są w Azyi”. Epenet jest pierwiastkiem Azji w najstarszych rękopisach Listu do Rzymian, a Achai w tekstach Biblii króla Jakuba i synodalnym. Piotr pisze do przybyszów w Poncie, Galacji, Kapadocji, Azji i Bitynii, a Jan „siedmiu zborom, które są w Azyi”: Efezowi, Smyrnie, Pergamonowi, Tiatyrze, Sardes, Filadelfii i Laodycei, leżącym na kręgu dróg przez prowincję. Należały do niej także Kolosy i Hierapolis. W II wieku Ignacy pisał do jej kościołów, Polikarp prowadził Smyrnę, Melitón Sardes, a Papiasz Hierapolis."
    - "Dioklecjan podzielił wielką prowincję na mniejsze, a nazwa przetrwała jako diecezja późniejszego cesarstwa. Dziś ziemia ta to zachód Turcji: İzmir na miejscu Smyrny, Bergama przy Pergamonie, Selçuk obok ruin Efezu, Sart, Alaşehir i Denizli w pobliżu Laodycei."
  nl:
    - "Azië is in het Nieuwe Testament niet het continent maar de Romeinse provincie van die naam: het westelijke derde deel van Klein-Azië, de Egeïsche kust met haar oude Griekse steden en de dalen van de Hermos, de Kaystros en de Maiandros die landinwaarts door Mysië, Lydië, Karië en Frygië lopen. Attalus III van Pergamon liet zijn koninkrijk in 133 v.Chr. aan Rome na, en na de opstand van Aristonicus werd het in 129 v.Chr. als provincie ingericht. Het was een van de rijkste van het rijk, bestuurd door een proconsul van senatorsrang; Pergamon was de eerste zetel, Efeze in de eerste eeuw n.Chr. de eigenlijke hoofdstad. De “oversten van Azië” uit Handelingen, de Asiarchen, waren vooraanstaande mannen van de steden, en de steden wedijverden om de titel van hoedster van een tempel van de keizers."
    - "Joden uit Azië hoorden de apostelen met Pinksteren. Op zijn tweede reis werden Paulus en zijn metgezellen “van den Heiligen Geest verhinderd het Woord in Azië te spreken”; op de derde onderwees hij ruim twee jaar te Efeze, “alzo dat allen, die in Azië woonden, het Woord van den Heere Jezus hoorden, beiden Joden en Grieken”. De zilversmid Demetrius klaagde dat Paulus “niet alleen van Efeze, maar ook bijna van geheel Azië” veel volk van de goden had afgekeerd, en enkele Asiarchen, Paulus’ vrienden, smeekten hem zich niet in het theater te begeven. Tychikus en Trofimus, “van die van Azië”, reisden met hem mee; hij voer Efeze voorbij om geen tijd in Azië te verliezen; en het waren “de Joden van Azië” die hem in de tempel te Jeruzalem grepen."
    - "De brieven tonen de gemeenten van de provincie: “U groeten de Gemeenten van Azië”, schrijft Paulus vanuit Efeze aan Korinthe; later herinnert hij aan “onze verdrukking, die ons in Azië overkomen is” en klaagt dat “allen, die in Azië zijn, zich van mij afgewend hebben”. Epenetus is de eersteling van Azië in de oudste handschriften van Romeinen, van Achaja in de teksten van de King James en de Synodale vertaling. Petrus schrijft aan de vreemdelingen van Pontus, Galatië, Cappadocië, Azië en Bithynië, en Johannes aan “de zeven Gemeenten, die in Azië zijn”: Efeze, Smyrna, Pergamon, Thyatira, Sardes, Filadelfia en Laodicea, die op een rondgaande weg door de provincie liggen. Ook Kolosse en Hiërapolis behoorden erbij. In de tweede eeuw schreef Ignatius aan haar gemeenten, leidde Polycarpus Smyrna, Melito Sardes en Papias Hiërapolis."
    - "Diocletianus brak de grote provincie in kleinere op, en de naam leefde voort als diocese van het latere rijk. Tegenwoordig is het land het westen van Turkije: İzmir op de plaats van Smyrna, Bergama bij Pergamon, Selçuk naast de ruïnes van Efeze, Sart, Alaşehir en Denizli bij Laodicea."
  cs:
    - "V Novém zákoně není Asie světadílem, ale římskou provincií téhož jména: západní třetinou Malé Asie, egejským pobřežím s jeho starými řeckými městy a údolími Hermu, Kaystru a Maiandru, vedoucími do vnitrozemí přes Mýsii, Lýdii, Kárii a Frygii. Attalos III. Pergamský odkázal své království Římu roku 133 př. n. l. a po vzpouře Aristonika bylo roku 129 př. n. l. zorganizováno jako provincie. Patřila k nejbohatším v říši, spravovaná prokonzulem senátorského stavu; Pergamon byl jejím prvním sídlem, Efez jejím skutečným hlavním městem v 1. století n. l. Asiarchové, ve Skutcích „někteří z předních mužů Azianských“, byli čelní muži jejích měst a města soupeřila o titul strážce chrámu císařů."
    - "Židé z Asie slyšeli apoštoly o Letnicích. Na druhé cestě bylo Pavlovi a jeho společníkům „zabráněno od Ducha svatého, aby nemluvili slova Božího v Azii“; na třetí učil více než dva roky v Efezu, „takže všickni, kteříž přebývali v Azii, poslouchali slova Pána Ježíše, i Židé i Řekové“. Démétrios stříbrník si stěžoval, že Pavel odvrátil lidi od bohů „netoliko v Efezu, ale téměř po vší Azii“, a někteří asiarchové, Pavlovi přátelé, ho prosili, aby se neodvažoval do divadla. Tychikos a Trofimos, „z Azianských“, cestovali s ním; proplul kolem Efezu, aby nemeškal v Asii; a právě „Židé někteří z Azie“ ho zadrželi v chrámě v Jeruzalémě."
    - "Listy ukazují církve provincie: „Pozdravujíť vás sborové, kteříž jsou v Azii“, píše Pavel z Efezu do Korintu; později vzpomíná na „soužení našem, kteréž jsme měli v Azii“ a naříká, že „se odvrátili ode mne všickni, kteříž jsou v Azii“. Epainetos je prvotinou Asie v nejstarších rukopisech listu Římanům, prvotinou Achaje v textech krále Jakuba a synodálním. Petr píše příchozím v Pontu, Galacii, Kappadokii, Asii a Bithýnii a Jan „sedmi církvím, kteréž jsou v Azii“: Efez, Smyrna, Pergamon, Tyatira, Sardy, Filadelfie a Laodikeia, které leží na okruhu silnic procházejících provincií. Patřily k ní i Kolosy a Hierapolis. Ve 2. století psal Ignác jejím církvím, Polykarp vedl Smyrnu, Melitón Sardy a Papias Hierapolis."
    - "Diocletianus rozdělil velkou provincii na menší a jméno žilo dál jako diecéze pozdější říše. Dnes je tato země západním Tureckem: İzmir na místě Smyrny, Bergama u Pergamonu, Selçuk vedle zřícenin Efezu, Sart, Alaşehir a Denizli poblíž Laodikeie."
  sv:
    - "I Nya testamentet är Asien inte kontinenten utan den romerska provinsen med det namnet: den västra tredjedelen av Mindre Asien, Egeiska kusten med dess gamla grekiska städer och dalarna kring Hermos, Kaystros och Maiandros som löper inåt landet genom Mysien, Lydien, Karien och Frygien. Attalos III av Pergamon testamenterade sitt rike till Rom år 133 f.Kr., och efter Aristonikos’ uppror organiserades det som provins år 129 f.Kr. Det var bland de rikaste i riket, styrt av en prokonsul av senatorisk rang; Pergamon var dess första säte, Efesos dess verkliga huvudstad under första århundradet e.Kr. Apostlagärningarnas asiarker var ledande män i dess städer, och städerna tävlade om titeln tempelvårdare för ett kejsartempel."
    - "Judar från Asien hörde apostlarna på pingsten. På sin andra resa fick Paulus och hans följeslagare inte tala i Asien; de ”förhindrades nämligen av den helige Ande att förkunna ordet i provinsen Asien”; på den tredje undervisade han mer än två år i Efesos: ”alla provinsen Asiens inbyggare, både judar och greker, fingo på detta sätt höra Herrens ord”. Silversmeden Demetrios klagade att Paulus ”icke allenast i Efesus, utan i nästan hela provinsen Asien” hade förlett folk från gudarna, och några asiarker, Paulus’ vänner, bad honom att inte ge sig in på skådebanan. Tykikos och Trofimos ”från provinsen Asien” följde honom; han seglade förbi Efesos för att inte fördröja sig i Asien; och det var ”judarna från provinsen Asien” som grep honom i templet i Jerusalem."
    - "Breven visar provinsens församlingar: ”Församlingarna i provinsen Asien hälsar eder”, skriver Paulus från Efesos till Korinth; senare minns han ”vilken nöd vi fingo utstå i provinsen Asien” och klagar att ”alla i provinsen Asien hava vänt sig ifrån mig”. Epainetos är förstlingen i Asien i de äldsta handskrifterna till Romarbrevet, i Achaia i King James-översättningen och synodaltexterna. Petrus skriver till främlingarna i Pontos, Galatien, Kappadokien, Asien och Bitynien, och Johannes ”hälsar de sju församlingarna i provinsen Asien”: Efesos, Smyrna, Pergamon, Tyatira, Sardes, Filadelfia och Laodikeia, som ligger på en rundväg genom provinsen. Kolossai och Hierapolis hörde också dit. På 100-talet skrev Ignatios till dess församlingar, Polykarpos ledde Smyrna, Melito Sardes och Papias Hierapolis."
    - "Diocletianus delade upp den stora provinsen i mindre, och namnet levde kvar som diocesen i det senare riket. I dag är landet västra Turkiet: İzmir på Smyrnas plats, Bergama vid Pergamon, Selçuk intill Efesos ruiner, Sart, Alaşehir och Denizli nära Laodikeia."
  nb:
    - "I Det nye testamente er Asia ikke kontinentet, men den romerske provinsen med det navnet: den vestlige tredjedelen av Lilleasia, Egeerhavskysten med sine gamle greske byer og dalene til Hermos, Kaystros og Maiander som løper innover gjennom Mysia, Lydia, Karia og Frygia. Attalos III av Pergamon testamenterte riket sitt til Roma i 133 f.Kr., og etter Aristonikos' opprør ble det organisert som provins i 129 f.Kr. Den var blant de rikeste i riket, styrt av en prokonsul av senatorisk rang; Pergamon var det første setet, Efesos den virkelige hovedstaden i det første århundre e.Kr. Asiarkene i Apostlenes gjerninger var ledende menn i byene, og byene konkurrerte om tittelen tempelvokter for keiserne."
    - "Jøder fra Asia hørte apostlene til pinse. På sin andre reise ble Paulus og følgesvennene «hindret av den Hellige Ånd fra å tale ordet i Asia»; på den tredje underviste han i mer enn to år i Efesos, «så alle som bodde i Asia, fikk høre Herrens ord, både jøder og grekere». Sølvsmeden Demetrios klaget over at «ikke bare i Efesus, men i næsten hele Asia» hadde Paulus fått folk bort fra gudene, og noen av asiarkene, Paulus' venner, «sendte bud til ham og bad ham at han ikke måtte gå inn i teatret». Tykikos og Trofimos «fra Asia» reiste med ham; han seilte forbi Efesos for ikke å bruke tid i Asia; og det var «jødene fra Asia» som grep ham i tempelet i Jerusalem."
    - "Brevene viser provinsens menigheter: «Menighetene i Asia hilser eder», skriver Paulus fra Efesos til Korint; senere minnes han «den trengsel som kom over oss i Asia» og klager over at «alle de i Asia vendte sig fra mig». Epenetos er «Asias førstegrøde for Kristus» i de eldste håndskriftene til Romerbrevet, Akaias førstegrøde i King James- og synodalteksten. Peter skriver til utlendingene i Pontos, Galatia, Kappadokia, Asia og Bitynia, og Johannes «til de syv menigheter i Asia»: Efesos, Smyrna, Pergamon, Tyatira, Sardes, Filadelfia og Laodikea, som ligger på en rundtur av veier gjennom provinsen. Kolossai og Hierapolis hørte også til den. På 100-tallet skrev Ignatios til menighetene der, Polykarp ledet Smyrna, Melito Sardes og Papias Hierapolis."
    - "Diokletian delte den store provinsen i mindre, og navnet levde videre som en administrativ diocesis i det senere riket. I dag er landet vestlige Tyrkia: İzmir på stedet for Smyrna, Bergama ved Pergamon, Selçuk ved ruinene av Efesos, Sart, Alaşehir og Denizli nær Laodikea."
  tl:
    - "Sa Bagong Tipan, ang Asia ay hindi ang kontinente kundi ang lalawigang Romano na may ganoong pangalan: ang kanlurang ikatlo ng Asia Minor, ang baybayin ng Aegean na may mga lumang lungsod na Griyego at ang mga libis ng Hermus, Cayster at Meandro na tumatakbo sa loob ng lupain sa Misia, Lidia, Caria at Frigia. Ipinamana ni Attalus III ng Pergamo ang kaniyang kaharian sa Roma noong 133 BK, at pagkatapos ng paghihimagsik ni Aristonicus ay inorganisa ito bilang lalawigan noong 129 BK. Isa ito sa pinakamayaman sa imperyo, na pinamunuan ng proconsul na may ranggong senador; ang Pergamo ang unang luklukan nito, ang Efeso ang tunay na kabisera nito pagsapit ng unang siglo AD. Ang “mga puno sa Asia” ng Mga Gawa, ang mga Asiarka, ay mga pinuno ng mga lungsod nito, at nag-agawan ang mga lungsod sa titulong tagapag-ingat ng templo ng mga emperador."
    - "Narinig ng mga Judio mula sa Asia ang mga apostol sa Pentecostes. Sa ikalawang paglalakbay, “pinagbawalan sila ng Espiritu Santo na saysayin ang salita sa Asia”; sa ikatlo, nagturo siya nang mahigit dalawang taon sa Efeso, kaya “ang lahat ng mga nagsisitahan sa Asia ay nangakarinig ng salita ng Panginoon, ang mga Judio at gayon din ang mga Griego”. Nagreklamo ang panday-pilak na si Demetrio na “hindi lamang sa Efeso, kundi halos sa buong Asia” inilayo ni Pablo ang mga tao sa mga diyos, at ilang Asiarka, mga kaibigan ni Pablo, ang nakiusap sa kaniyang huwag pumasok sa dulaan. Sinamahan siya nina Tiquico at Trofimo na taga-Asia; nilampasan niya ang Efeso upang hindi gumugol ng panahon sa Asia; at ang “mga Judiong taga Asia” ang dumakip sa kaniya sa templo sa Jerusalem."
    - "Ipinapakita ng mga liham ang mga iglesia ng lalawigan: “Binabati kayo ng mga iglesia sa Asia”, sulat ni Pablo mula Efeso sa Corinto; kalaunan, naaalala niya ang “mga kapighatian namin na nangyari sa Asia” at nananaghoy na “nagsihiwalay sa akin ang lahat ng nangasa Asia”. Si Epeneto ang pangunahing bunga ng Asia sa pinakamatandang manuskrito ng Mga Taga-Roma, ng Acaya sa mga tekstong King James at Sinodal. Sumulat si Pedro sa mga dayuhan ng Ponto, Galacia, Capadocia, Asia at Bitinia, at si Juan “sa pitong iglesia na nasa Asia”: Efeso, Smirna, Pergamo, Tiatira, Sardis, Filadelfia at Laodicea, na nasa isang ikot ng mga daan sa lalawigan. Kabilang din ang Colosas at Hierapolis. Noong ika-2 siglo, sumulat si Ignacio sa mga iglesia nito, pinamunuan ni Polycarp ang Smirna, ni Melito ang Sardis at ni Papias ang Hierapolis."
    - "Hinati ni Diocleciano ang malaking lalawigan sa mas maliliit, at nabuhay ang pangalan bilang diyosesis ng huling imperyo. Ang lupain ay ang kanluran ng Turkey ngayon: İzmir sa lugar ng Smirna, Bergama sa Pergamo, Selçuk sa tabi ng mga guho ng Efeso, Sart, Alaşehir at Denizli malapit sa Laodicea."
  da:
    - "I Det Nye Testamente er Asia ikke kontinentet Asien, men den romerske provins af det navn: den vestlige tredjedel af Lilleasien, Ægæerhavskysten med sine gamle græske byer og dalene ved Hermos, Kaystros og Maiander, der løber ind i landet gennem Mysien, Lydien, Karien og Frygien. Attalos 3. af Pergamon testamenterede sit rige til Rom i 133 f.Kr., og efter Aristonikos' oprør blev det organiseret som provins i 129 f.Kr. Det var blandt rigets rigeste, styret af en prokonsul af senatorisk rang; Pergamon var det første sæde, Efesos den virkelige hovedstad i første århundrede e.Kr. »Asiarkerne« i Apostlenes Gerninger var ledende mænd i dets byer, og byerne kappedes om titlen som vogter af et tempel for kejserne."
    - "Jøder fra Asia hørte apostlene til pinse. På sin anden rejse blev Paulus og hans ledsagere »af den Helligaand ... forhindrede i at tale Ordet i Asien«; på den tredje underviste han i over to år i Efesos, »saa at alle, som boede i Asien, baade Jøder og Grækere, hørte Herrens Ord«. Sølvsmeden Demetrius klagede over, at »ikke alene i Efesus, men næsten i hele Asien« havde Paulus vendt folk bort fra guderne, og nogle asiarker, Paulus' venner, bad ham ikke vove sig hen til teatret. Tykikus og Trofimus, »Asiaterne«, rejste med ham; han sejlede Efesos forbi for ikke at spilde tid i Asia; og det var »Jøderne fra Asien«, der greb ham i templet i Jerusalem."
    - "Brevene viser provinsens menigheder: »Menighederne i Asien hilse eder«, skriver Paulus fra Efesos til Korinth; senere minder han om »den Trængsel, som kom over os i Asien«, og klager over, at »alle de i Asien have vendt sig fra mig«. Epænetus er Asias førstegrøde i Romerbrevets ældste håndskrifter, Akajas i King James- og synodalteksterne. Peter skriver til de fremmede i »Pontus, Galatien, Kappadokien, Asien og Bithynien«, og Johannes »til de syv Menigheder i Asien«: Efesos, Smyrna, Pergamon, Thyatira, Sardes, Filadelfia og Laodikea, som ligger på en rundtur af veje gennem provinsen. Kolossæ og Hierapolis hørte også til den. I andet århundrede skrev Ignatius til dens menigheder, Polykarp ledede Smyrna, Melito Sardes og Papias Hierapolis."
    - "Diocletian opdelte den store provins i mindre, og navnet levede videre som et diocese i det senere rige. I dag er landet Tyrkiets vest: İzmir på Smyrnas sted, Bergama ved Pergamon, Selçuk ved Efesos' ruiner, Sart, Alaşehir og Denizli nær Laodikea."
  sr:
    - "У Новом завету Азија није континент него римска провинција тог имена: западна трећина Мале Азије, егејска обала са старим грчким градовима и долинама Херма, Кајстра и Меандра које воде у унутрашњост кроз Мисију, Лидију, Карију и Фригију. Атал III Пергамски оставио је своје краљевство Риму у наслеђе 133. п. н. е., а после Аристоникове побуне оно је 129. п. н. е. уређено као провинција. Била је међу најбогатијима у царству, под управом проконзула сенаторског ранга; Пергам је био њено прво седиште, а Ефес њена права престоница до 1. века н. е. Азијарси, азијски поглавари из Дела, били су истакнути људи њених градова, а градови су се такмичили за титулу неокора храма царева."
    - "Јевреји из Азије слушали су апостоле на Педесетницу. На другом путовању Павле и његови другови су добили забрану: „забрани им Дух Свети говорити реч у Азији“; на трећем је више од две године учио у Ефесу, „тако да сви који живљаху у Азији, и Јевреји и Грци, чуше реч Господа Исуса“. Димитрије, сребрар, жалио се да Павле „не само у Ефесу него готово по свој Азији“ одвраћа народ од богова, а неки азијарси, Павлови пријатељи, молили су га да не излази у позориште. Тихик и Трофим „из Азије“ путовали су с њим; он је пловио мимо Ефеса да се не би задржавао у Азији; а „они Јевреји што беху из Азије“ ухватили су га у храму у Јерусалиму."
    - "Посланице показују цркве провинције: „Поздрављају вас цркве азијске“, пише Павле из Ефеса Коринту; касније пише да не жели затајити „невољу нашу која нам се догоди у Азији“ и јадикује: „одвратише од мене сви у Азији“. Епенет је првенац Азије у најстаријим рукописима Посланице Римљанима, а Ахаје у текстовима Библије краља Џејмса и синодалном. Петар пише дошљацима у Понту, Галатији, Кападокији, Азији и Витинији, а Јован „на седам цркава које су у Азији“: у Ефес, Смирну, Пергам, Тијатир, Сард, Филаделфију и Лаодикију, које леже на кругу путева кроз провинцију. Колосе и Хијераполис су такође припадали њој. У 2. веку Игњатије је писао њеним црквама, Поликарп је предводио Смирну, Мелитон Сард, а Папија Хијераполис."
    - "Диоклецијан је разбио велику провинцију на мање, а име је живело као дијецеза каснијег царства. Данас је та земља запад Турске: Измир на месту Смирне, Бергама на Пергаму, Селчук поред рушевина Ефеса, Сарт, Алашехир и Денизли близу Лаодикије."
  hu:
    - "Az Újszövetségben Ázsia nem a kontinens, hanem az azonos nevű római provincia: Kis-Ázsia nyugati harmada, az égei-tengeri part régi görög városaival, valamint a Hermosz, a Kaüsztrosz és a Maiandrosz völgye, amelyek Müsián, Lüdián, Kárián és Frígián át futnak befelé. III. Attalosz pergamoni király Kr. e. 133-ban Rómára hagyta királyságát, és Arisztonikosz lázadása után Kr. e. 129-ben provinciává szervezték. A birodalom leggazdagabb provinciái közé tartozott, szenátori rangú proconsul kormányozta; első székhelye Pergamon volt, valódi fővárosa Kr. u. az 1. századra Efezus. Az Apostolok cselekedeteiben szereplő „ázsiai főpapok”, az aszarkhák városainak vezető emberei voltak, a városok pedig versengtek a császárok templomőre (neókorosz) címért."
    - "Ázsiából való zsidók hallgatták az apostolokat pünkösdkor. Második útján Pál és társai „eltiltatának a Szent Lélektől, hogy az ígét Ázsiában hirdessék”; a harmadikon több mint két évig tanított Efezusban, „úgyannyira, hogy mindazok, kik lakoznak vala Ázsiában, mind zsidók, mind görögök, hallgaták az Úr Jézusnak ígéjét”. Démétriusz, az ezüstműves azt panaszolta, hogy Pál „nemcsak Efézusnak, hanem közel az egész Ázsiának sok népét eláltatván, elfordította” az istenektől, és néhány aszarkha, Pál barátai, kérték, hogy ne merészkedjen a színházba. Tükhikosz és Trofimusz, „Ázsiabeliek” kísérték; elhajózott Efezus mellett, hogy ne kelljen időt töltenie Ázsiában; és „az Ázsiából való zsidók” fogták el a jeruzsálemi templomban."
    - "A levelek a provincia gyülekezeteit mutatják: „Köszöntenek titeket Ázsia gyülekezetei”, írja Pál Efezusból Korinthusba; később megemlékezik „a mi nyomorúságunk felől, a mely Ázsiában esett rajtunk”, és panaszkodik, hogy „elfordultak tőlem az Ázsiabeliek mind”. Epainetosz a Római levél legrégibb kéziratai szerint Ázsia zsengéje, a King James- és a szinodális szövegben pedig Akhája zsengéje. Péter Pontus, Galácia, Kappadókia, Ázsia és Bithünia jövevényeinek ír, János pedig „a hét gyülekezetnek, a mely Ázsiában van”: Efezus, Szmürna, Pergamon, Thiatira, Szárdisz, Filadelfia és Laodicea, amelyek a provinciát átszelő úthálózat egy körén feküdnek. Kolossze és Hierapolisz is hozzá tartozott. A 2. században Ignatiosz leveleket írt gyülekezeteihez, Polükarposz Szmürnát, Melitón Szárdiszt, Papiász pedig Hierapoliszt vezette."
    - "Diocletianus a nagy provinciát kisebbekre törte, a név pedig a későbbi birodalom egyik diocesise néven élt tovább. Ma a terület Törökország nyugati része: İzmir Szmürna helyén, Bergama Pergamonnál, Selçuk Efezus romjai mellett, Sart, Alaşehir és Denizli Laodicea közelében."
  fi:
    - "Uudessa testamentissa Aasia ei ole maanosa vaan samanniminen Rooman provinssi: Vähän-Aasian läntinen kolmannes, Egeanmeren rannikko vanhoine kreikkalaisine kaupunkeineen sekä sisämaahan Mysian, Lyydian, Karian ja Fryygian halki kulkevat Hermoksen, Kaystroksen ja Maiandroksen laaksot. Pergamonin Attalos III testamenttasi valtakuntansa Roomalle 133 eaa., ja Aristonikoksen kapinan jälkeen se järjestettiin provinssiksi 129 eaa. Se oli valtakunnan rikkaimpia, senaattoriarvoisen prokonsulin hallitsema; Pergamon oli sen ensimmäinen hallintopaikka, Efesos sen todellinen pääkaupunki ensimmäiselle vuosisadalle jaa. mennessä. Apostolien tekojen ”muutamat Aasian hallitusmiehistä”, asiarkit, olivat sen kaupunkien johtavia miehiä, ja kaupungit kilpailivat keisarien temppelin vartijan arvonimestä."
    - "Aasian juutalaiset kuulivat apostoleja helluntaina. Toisella matkallaan Paavalin seurue ei saanut julistaa sanaa Aasiassa, sillä ”Pyhä Henki esti heitä julistamasta sanaa Aasiassa”; kolmannella hän opetti yli kaksi vuotta Efesoksessa, ”niin että kaikki Aasian asukkaat, sekä juutalaiset että kreikkalaiset, saivat kuulla Herran sanan”. Hopeaseppä Demetrios valitti, että Paavali oli ”ei ainoastaan Efesossa, vaan melkein koko Aasiassa” vienyt ihmiset pois jumalilta, ja jotkut asiarkit, Paavalin ystävät, pyysivät häntä olemaan menemättä teatteriin. Tykikos ja Trofimos, ”aasialaiset”, matkustivat hänen kanssaan; hän purjehti Efesoksen ohi, ettei joutuisi viettämään aikaa Aasiassa; ja ”Aasiasta tulleet juutalaiset” tarttuivat häneen Jerusalemin temppelissä."
    - "Kirjeet osoittavat provinssin seurakunnat: ”Aasian seurakunnat tervehtivät teitä”, Paavali kirjoittaa Efesoksesta Korinttiin; myöhemmin hän muistaa ”ahdistuksesta, jossa me olimme Aasiassa”, ja valittaa, että ”kaikki aasialaiset ovat kääntyneet minusta pois”. Epainetos on Aasian ensi hedelmä Roomalaiskirjeen vanhimmissa käsikirjoituksissa, Akaian ensi hedelmä King Jamesin ja synodaalisessa tekstissä. Pietari kirjoittaa Pontoksen, Galatian, Kappadokian, Aasian ja Bitynian muukalaisille, ja Johannes ”seitsemälle Aasian seurakunnalle”: Efesos, Smyrna, Pergamon, Tyatira, Sardes, Filadelfia ja Laodikea, jotka sijaitsevat provinssin halki kulkevalla tiepiirillä. Myös Kolossai ja Hierapolis kuuluivat siihen. 100-luvulla Ignatios kirjoitti sen seurakunnille, Polykarpos johti Smyrnaa, Melito Sardesta ja Papias Hierapolista."
    - "Diocletianus jakoi suuren provinssin pienempiin, ja nimi säilyi myöhäisen valtakunnan hiippakuntana. Nykyisin maa on Turkin länsiosaa: İzmir Smyrnan paikalla, Bergama Pergamonissa, Selçuk Efesoksen rauniokaupungin vieressä, Sart, Alaşehir ja Denizli Laodikean lähellä."
  vi:
    - "Trong Tân Ước, A-si không phải là châu lục mà là tỉnh La Mã mang tên ấy: một phần ba phía tây của Tiểu Á, bờ biển Aegean với các thành Hy Lạp cổ và những thung lũng Hermus, Cayster và Maeander chạy vào nội địa qua My-si, Ly-đi, Caria và Phi-ri-gi. Attalus III của Bẹt-găm để lại vương quốc của mình cho Rô-ma năm 133 TCN, và sau cuộc nổi dậy của Aristonicus, nó được tổ chức thành tỉnh năm 129 TCN. Đó là một trong những tỉnh giàu nhất của đế quốc, do một thống đốc thuộc hàng nguyên lão cai trị; Bẹt-găm là trụ sở đầu tiên, Ê-phê-sô là kinh đô thực sự vào thế kỷ 1 SCN. Các “quan lớn ở xứ A-si” trong sách Công Vụ, tức Asiarch, là những người đứng đầu các thành của nó, và các thành tranh nhau danh hiệu giữ đền thờ các hoàng đế."
    - "Người Do Thái từ A-si nghe các sứ đồ vào ngày Lễ Ngũ Tuần. Trong chuyến đi thứ hai, Phao-lô và các bạn đồng hành bị “Đức Thánh Linh đã cấm truyền đạo trong cõi A-si”; trong chuyến thứ ba, ông dạy hơn hai năm tại Ê-phê-sô, “đến nỗi mọi người ở trong cõi A-si, hoặc người Giu-đa hay là người Gờ-réc, đều nghe đạo Chúa”. Đê-mê-triu, người thợ bạc, than phiền rằng “không những tại thành Ê-phê-sô thôi, gần suốt hết cõi A-si nữa”, Phao-lô đã lôi kéo người ta lìa bỏ các thần, và mấy Asiarch, bạn hữu của Phao-lô, xin ông chớ liều mình đi tới rạp hát. Ti-chi-cơ và Trô-phim “quê A-si” đi cùng ông; ông chạy thuyền qua Ê-phê-sô để khỏi mất thì giờ ở A-si; và chính “các người Giu-đa, quê A-si” đã bắt ông trong đền thờ ở Giê-ru-sa-lem."
    - "Các thư cho thấy các hội thánh của tỉnh: “Các Hội thánh ở xứ A-si chào thăm anh em”, Phao-lô viết từ Ê-phê-sô cho Cô-rinh-tô; về sau ông nhớ lại “sự khốn nạn đã xảy đến cho chúng tôi trong xứ A-si” và than rằng “mọi người ở xứ A-si đã lìa bỏ ta”. Ê-bai-nết là “trái đầu mùa trong xứ A-si” trong các bản chép tay cổ nhất của thư Rô-ma, nhưng là của A-chai trong các bản văn King James và Synodal. Phi-e-rơ viết cho những người kiều ngụ “trong xứ Bông, Ga-la-ti, Cáp-ba-đốc, A-si và Bi-thi-ni”, và Giăng gửi “cho bảy Hội thánh ở xứ A-si”: Ê-phê-sô, Si-miệc-nơ, Bẹt-găm, Thi-a-ti-rơ, Sạt-đe, Phi-la-đen-phi và Lao-đi-xê, nằm trên một vòng đường đi qua tỉnh. Cô-lô-se và Hi-ê-ra-bô-li cũng thuộc về nó. Vào thế kỷ 2, Ignatius viết cho các hội thánh của nó, Polycarp lãnh đạo Si-miệc-nơ, Melito lãnh đạo Sạt-đe và Papias lãnh đạo Hi-ê-ra-bô-li."
    - "Diocletianus chia tỉnh lớn thành các tỉnh nhỏ hơn, và tên còn lại như một giáo khu của đế quốc về sau. Ngày nay vùng đất là miền tây Thổ Nhĩ Kỳ: İzmir ở chỗ Si-miệc-nơ, Bergama ở Bẹt-găm, Selçuk bên tàn tích Ê-phê-sô, Sart, Alaşehir và Denizli gần Lao-đi-xê."
  ro:
    - "În Noul Testament, Asia nu este continentul, ci provincia romană cu acest nume: treimea de vest a Asiei Mici, coasta egeeană cu vechile ei cetăți grecești și văile Hermos, Caister și Meandru, care se întind spre interior prin Misia, Lidia, Caria și Frigia. Attalos al III-lea din Pergam și-a lăsat regatul Romei prin testament în 133 î.Hr., iar după revolta lui Aristonic a fost organizat ca provincie în 129 î.Hr. A fost printre cele mai bogate ale imperiului, guvernată de un proconsul de rang senatorial; Pergamul a fost prima ei reședință, iar Efesul adevărata ei capitală în secolul I d.Hr. „Mai marii Asiei” din Faptele Apostolilor, asiarhii, erau oameni de frunte ai cetăților ei, iar cetățile se întreceau pentru titlul de păzitor al unui templu al împăraților."
    - "Iudei din Asia i-au auzit pe apostoli la Rusalii. În a doua sa călătorie, Pavel și tovarășii lui au fost „opriți de Sfântul Duh a grăì cuvântul în Asia”; în a treia, a învățat peste doi ani la Efes, „cât toți cei ce locuiau în Asia au auzit cuvântul Domnului Iisus, și Iudeii și Elinii”. Dimitrie argintarul s-a plâns că „nu numai în Efes, ci mai în toată Asia” Pavel a abătut oamenii de la zei, iar unii asiarhi, prieteni ai lui Pavel, l-au rugat să nu se aventureze în teatru. Tihic și Trofim, „din Asia”, au călătorit cu el; a trecut cu corabia pe lângă Efes ca să nu piardă timp în Asia; și au fost „Iudeii cei din Asia” cei care l-au prins în templu la Ierusalim."
    - "Epistolele arată bisericile provinciei: „Închină-se vouă bisericile Asiei”, scrie Pavel de la Efes către Corint; mai târziu își amintește „necazul nostru ce s’a făcut nouă în Asia” și se tânguiește că „s’au întors dela mine toți cei din Asia”. Epenet este pârga Asiei în cele mai vechi manuscrise ale Romanilor, iar a Ahaiei în textele King James și sinodal. Petru scrie nemernicilor din Pont, Galatia, Capadocia, Asia și Bitinia, iar Ioan „celor șapte biserici care sunt în Asia”: Efes, Smirna, Pergam, Tiatira, Sardes, Filadelfia și Laodiceea, care se află pe un circuit de drumuri prin provincie. Colose și Hierapole îi aparțineau și ele. În secolul al II-lea, Ignatie a scris bisericilor ei, Policarp a condus Smirna, Melito Sardes, iar Papias Hierapole."
    - "Dioclețian a fărâmițat marea provincie în provincii mai mici, iar numele a trăit ca dioceză a imperiului târziu. Astăzi ținutul este vestul Turciei: İzmir în locul Smirnei, Bergama la Pergam, Selçuk lângă ruinele Efesului, Sart, Alaşehir și Denizli lângă Laodiceea."
  bg:
    - "В Новия завет Азия не е континентът, а римската провинция с това име: западната третина на Мала Азия, бреговете на Егейско море със старите гръцки градове и долините на Хермос, Кайстър и Меандър, вървящи навътре през Мизия, Лидия, Кария и Фригия. Аттал III от Пергам завещал царството си на Рим през 133 г. пр.н.е. и след въстанието на Аристоник то било организирано като провинция през 129 г. пр.н.е. Била сред най-богатите в империята, управлявана от проконсул със сенаторски ранг; Пергам бил първото ѝ седалище, а Ефес — истинската ѝ столица към I в. н.е. „Азийските началници“ от Деяния, азиарсите, били водещи мъже на градовете ѝ, а градовете се състезавали за титлата пазител на храм на императорите."
    - "Юдеи от Азия чули апостолите на Петдесетница. При второто си пътуване Павел и спътниците му били възпрени „от Духа Светаго да проповедат словото в Азия“; при третото той учил над две години в Ефес, „така щото всички които живееха в Азия, Юдеи и Елини, чуха словото на Господа Исуса“. Сребърникът Димитър се оплакал, че „не само в Ефес, но току-речи във всичка Азия“ Павел отклонил хората от боговете, а някои азиарси, приятели на Павел, го молели да не се показва в театъра. Тихик и Трофим, „Азийците“, пътували с него; той минал покрай Ефес, за да не се бави в Азия; и именно „Юдеите от Азия“ го хванали в храма в Йерусалим."
    - "Посланията показват църквите на провинцията: „Поздравяват ви църквите които са в Азия“, пише Павел от Ефес до Коринт; по-късно си спомня „нашата скърб която ни се случи в Азия“ и тъгува, че „всички които са в Азия отвърнаха се от мене“. Епенет е първият плод на Азия в най-старите ръкописи на Римляни, на Ахая в текстовете на крал Джеймс и Синодалния. Петър пише до преселниците в Понт, Галатия, Кападокия, Азия и Витиния, а Йоан — „на седемте църкви които са в Азия“: Ефес, Смирна, Пергам, Тиатира, Сарди, Филаделфия и Лаодикия, които лежат на кръг от пътища през провинцията. Колоса и Йерапол също принадлежали към нея. През II в. Игнатий писал до църквите ѝ, Поликарп ръководел Смирна, Мелитон — Сарди, а Папий — Йерапол."
    - "Диоклетиан разбил голямата провинция на по-малки и името останало като диоцез на по-късната империя. Днес земята е западът на Турция: Измир на мястото на Смирна, Бергама при Пергам, Селчук до развалините на Ефес, Сарт, Алашехир и Денизли близо до Лаодикия."
