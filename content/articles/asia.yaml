# Overview article (ADR 0007). Mainstream facts only; the textual question in Romans 16:5 (Asia or Achaia) is named as such.
id: asia
place: a197f19
title:
  en: "Asia"
  ru: "Асия"
  uk: "Азія"
  es: "Asia"
  pt: "Ásia"
  de: "Asien"
  fr: "Asie"
body:
  en:
    - "In the New Testament Asia is not the continent but the Roman province of that name: the western third of Asia Minor, the Aegean coast with its old Greek cities and the valleys of the Hermus, Cayster and Maeander running inland through Mysia, Lydia, Caria and Phrygia. Attalus III of Pergamum bequeathed his kingdom to Rome in 133 BC, and after the revolt of Aristonicus it was organised as a province in 129 BC. It was among the richest in the empire, governed by a proconsul of senatorial rank; Pergamum was its first seat, Ephesus its real capital by the first century AD. The “chief of Asia” of Acts, the Asiarchs, were leading men of its cities, and the cities vied for the title of warden of a temple of the emperors."
    - "Jews from Asia heard the apostles at Pentecost. On his second journey Paul and his companions were “forbidden of the Holy Ghost to preach the word in Asia”; on the third he taught more than two years at Ephesus, “so that all they which dwelt in Asia heard the word of the Lord Jesus, both Jews and Greeks”. Demetrius the silversmith complained that “not alone at Ephesus, but almost throughout all Asia” Paul had turned people from the gods, and some Asiarchs, Paul's friends, kept him out of the theatre. Tychicus and Trophimus “of Asia” travelled with him; he sailed past Ephesus so as not to spend time in Asia; and it was “the Jews which were of Asia” who seized him in the temple at Jerusalem."
    - "The letters show the churches of the province: “The churches of Asia salute you”, Paul writes from Ephesus to Corinth; later he recalls “our trouble which came to us in Asia” and laments that “all they which are in Asia be turned away from me”. Epaenetus is the firstfruits of Asia in the oldest manuscripts of Romans, of Achaia in the King James and Synodal texts. Peter writes to the strangers of Pontus, Galatia, Cappadocia, Asia and Bithynia, and John “to the seven churches which are in Asia”: Ephesus, Smyrna, Pergamos, Thyatira, Sardis, Philadelphia and Laodicea, which lie on a circuit of roads through the province. Colossae and Hierapolis belonged to it too. In the second century Ignatius wrote to its churches, Polycarp led Smyrna, Melito Sardis and Papias Hierapolis."
    - "Diocletian broke the great province into smaller ones, and the name lived on as a diocese of the later empire. Today the land is the west of Turkey: İzmir on the site of Smyrna, Bergama at Pergamum, Selçuk beside the ruins of Ephesus, Sart, Alaşehir and Denizli near Laodicea."
  ru:
    - "В Новом Завете Асия — не материк, а римская провинция с таким именем: западная треть Малой Азии, эгейское побережье со старыми греческими городами и долины Герма, Каистра и Меандра, уходящие вглубь через Мисию, Лидию, Карию и Фригию. Аттал III Пергамский завещал своё царство Риму в 133 г. до н. э., и после восстания Аристоника оно в 129 г. до н. э. было устроено как провинция. Она была одной из богатейших в империи и управлялась проконсулом сенаторского ранга; Пергам был её первой резиденцией, Ефес к I веку н. э. — настоящей столицей. Асийские начальники из Деяний, асиархи, были первыми людьми её городов, а города соперничали за звание стража храма императоров."
    - "Иудеи из Асии слышали апостолов в день Пятидесятницы. Во втором путешествии Павел и его спутники «не были допущены Духом Святым проповедывать слово в Асии»; в третьем он учил более двух лет в Ефесе, «так что все жители Асии слышали проповедь о Господе Иисусе, как Иудеи, так и Еллины». Серебряник Димитрий жаловался, что «не только в Ефесе, но почти во всей Асии» Павел отвратил людей от богов, а некоторые асиархи, друзья Павла, удержали его от зрелища. Асийцы Тихик и Трофим сопровождали его; он миновал Ефес, чтобы не замедлить в Асии; и именно «Асийские Иудеи» схватили его в храме в Иерусалиме."
    - "Послания показывают церкви провинции: «Приветствуют вас церкви Асийские», пишет Павел из Ефеса в Коринф; позже он вспоминает «о скорби нашей, бывшей с нами в Асии», и сетует: «все Асийские оставили меня». Епенет в древнейших рукописях — начаток Асии, в тексте Короля Иакова и в Синодальном — Ахаии. Пётр пишет пришельцам Понта, Галатии, Каппадокии, Асии и Вифинии, а Иоанн — «семи церквам, находящимся в Асии»: в Ефес, Смирну, Пергам, Фиатиру, Сардис, Филадельфию и Лаодикию, лежащие на кольце дорог провинции. К ней относились и Колоссы с Иераполем. Во II веке Игнатий писал её церквам, Поликарп возглавлял Смирну, Мелитон — Сардис, Папий — Иераполь."
    - "Диоклетиан разделил большую провинцию на меньшие, и имя осталось за диоцезом поздней империи. Сегодня это запад Турции: Измир на месте Смирны, Бергама у Пергама, Сельчук рядом с развалинами Ефеса, Сарт, Алашехир и Денизли близ Лаодикии."
  uk:
    - "У Новому Завіті Азія — не материк, а римська провінція з такою назвою: західна третина Малої Азії, егейське узбережжя зі старими грецькими містами та долинами Герма, Каїстра і Меандра, що йдуть углиб через Місію, Лідію, Карію та Фрігію. Аттал III Пергамський заповів своє царство Римові в 133 р. до н. е., і після повстання Арістоніка його організовано як провінцію в 129 р. до н. е. Вона була однією з найбагатших в імперії, під управою проконсула сенаторського рангу; Пергам був її першою резиденцією, Ефес — справжньою столицею вже в I столітті н. е. Азийська старшина в Діях, тобто асіархи, — провідні люди її міст, і міста змагалися за звання храмоохоронця імператорських храмів."
    - "Юдеї з Азії чули апостолів у П'ятидесятницю. У другій подорожі, коли Павло з супутниками проходили Фрігію й Галацьку сторону, «заборонив їм сьвятий Дух промовляти слово в Азиї»; у третій він навчав понад два роки в Ефесі, «так що всї, що проживали в Азиї, слухали слово Господа Ісуса, — Жиди й Єленяне». Димитрій срібляр скаржився, що «не то в Єфесї, а мало не по всїй Азиї» Павло відвернув народ від богів, а деякі асіархи, друзі Павла, не пустили його до театру. Тихик і Трофим, «Азияне», подорожували з ним; він проплив повз Ефес, щоб не гаятися в Азії; і саме «Азийські Жиди» схопили його в храмі в Єрусалимі."
    - "Послання показують церкви провінції: «Витають вас церкви Азийські», пише Павло з Ефеса до Коринта; згодом він згадує «горе наше, що було нам в Азиї» і жалкує, що «одвернулись од мене всї, що в Азиї». Епенет у найдавніших рукописях Послання до римлян — первоплід Азії, а в тексті короля Якова і в Синодальному — Ахаї. Петро пише захожанам Понту, Галатії, Каппадокії, Азії та Віфінії, а Іван — «семи церквам, що в Азиї»: Ефесу, Смирні, Пергаму, Тіатирі, Сардам, Філадельфії та Лаодікеї, які лежать на колі доріг провінції. Колоси та Ієраполіс теж належали до неї. У II столітті Ігнатій писав її церквам, Полікарп очолював Смирну, Мелітон — Сарди, а Папій — Ієраполіс."
    - "Діоклетіан розбив велику провінцію на менші, і назва жила далі як діоцез пізньої імперії. Нині ця земля — захід Туреччини: Ізмір на місці Смирни, Бергама на місці Пергаму, Сельчук біля руїн Ефеса, Сарт, Алашехір і Денізлі поблизу Лаодікеї."
  es:
    - "En el Nuevo Testamento Asia no es el continente sino la provincia romana de ese nombre: el tercio occidental del Asia Menor, la costa del Egeo con sus antiguas ciudades griegas y los valles del Hermo, el Caístro y el Meandro que penetran tierra adentro por Misia, Lidia, Caria y Frigia. Átalo III de Pérgamo legó su reino a Roma en 133 a. C., y tras la revuelta de Aristónico fue organizado como provincia en 129 a. C. Fue una de las más ricas del imperio, gobernada por un procónsul de rango senatorial; Pérgamo fue su primera sede, Éfeso su verdadera capital en el siglo I d. C. Los «principales de Asia» de los Hechos, los asiarcas, eran hombres destacados de sus ciudades, y las ciudades rivalizaban por el título de guardianas de un templo de los emperadores."
    - "Judíos de Asia oyeron a los apóstoles en Pentecostés. En su segundo viaje, a Pablo y sus compañeros «les fué prohibido por el Espíritu Santo hablar la palabra en Asia»; en el tercero enseñó más de dos años en Éfeso, «de manera que todos los que habitaban en Asia, Judíos y Griegos, oyeron la palabra del Señor Jesús». Demetrio el platero se quejó de que «no solamente en Efeso, sino á muchas gentes de casi toda el Asia» Pablo había apartado a la gente de los dioses, y algunos asiarcas, amigos de Pablo, le impidieron entrar en el teatro. Tíquico y Trófimo, «de Asia», viajaron con él; pasó de largo ante Éfeso para no detenerse en Asia; y fueron «unos Judíos de Asia» quienes lo apresaron en el templo de Jerusalén."
    - "Las cartas muestran las iglesias de la provincia: «Las iglesias de Asia os saludan», escribe Pablo desde Éfeso a Corinto; más tarde recuerda «nuestra tribulación que nos fué hecha en Asia» y se lamenta de que «me han sido contrarios todos los que son en Asia». Epeneto es las primicias de Asia en los manuscritos más antiguos de Romanos, de Acaya en los textos de la versión del rey Jacobo y sinodal. Pedro escribe a los extranjeros de Ponto, Galacia, Capadocia, Asia y Bitinia, y Juan «á las siete iglesias que están en Asia»: Éfeso, Esmirna, Pérgamo, Tiatira, Sardis, Filadelfia y Laodicea, que se hallan en un circuito de caminos por la provincia. También pertenecían a ella Colosas y Hierápolis. En el siglo II Ignacio escribió a sus iglesias, Policarpo dirigió Esmirna, Melitón Sardis y Papías Hierápolis."
    - "Diocleciano dividió la gran provincia en otras menores, y el nombre sobrevivió como diócesis del imperio tardío. Hoy la tierra es el oeste de Turquía: İzmir en el sitio de Esmirna, Bergama en Pérgamo, Selçuk junto a las ruinas de Éfeso, Sart, Alaşehir y Denizli cerca de Laodicea."
  pt:
    - "No Novo Testamento, a Ásia não é o continente, mas a província romana desse nome: o terço ocidental da Ásia Menor, a costa do Egeu com suas antigas cidades gregas e os vales do Hermo, do Caístro e do Meandro, que penetram pela Mísia, Lídia, Cária e Frígia. Átalo III de Pérgamo legou seu reino a Roma em 133 a.C., e depois da revolta de Aristônico foi organizado como província em 129 a.C. Estava entre as mais ricas do império, governada por um procônsul de posição senatorial; Pérgamo foi a primeira sede, Éfeso a verdadeira capital no século I d.C. Os asiarcas de Atos eram os principais de suas cidades, que disputavam o título de guardiã do templo dos imperadores."
    - "Judeus da Ásia ouviram os apóstolos em Pentecostes. Na segunda viagem, Paulo e seus companheiros foram impedidos pelo Espírito Santo “de anunciar a palavra na Ásia”; na terceira, ele ensinou mais de dois anos em Éfeso, “de modo que todos os que habitavam na Ásia ouviram a palavra do Senhor Jesus, tanto judeus como gregos”. O ourives Demétrio queixou-se de que “não somente em Éfeso, mas em quase toda a Ásia” Paulo desviara as pessoas dos deuses, e alguns asiarcas, amigos de Paulo, o impediram de entrar no teatro. Tíquico e Trófimo, “da Ásia”, viajaram com ele; ele passou ao largo de Éfeso para não se demorar na Ásia; e foram “os judeus da Ásia” que o agarraram no templo de Jerusalém."
    - "As cartas mostram as igrejas da província: “As igrejas da Ásia os saúdam”, escreve Paulo de Éfeso a Corinto; depois recorda “a aflição que nos sobreveio na Ásia” e lamenta que “todos os que estão na Ásia se afastaram de mim”. Epêneto é as primícias da Ásia nos manuscritos mais antigos de Romanos, da Acaia nos textos King James e sinodal. Pedro escreve aos estrangeiros do Ponto, Galácia, Capadócia, Ásia e Bitínia, e João “às sete igrejas que estão na Ásia”: Éfeso, Esmirna, Pérgamo, Tiatira, Sardes, Filadélfia e Laodiceia, que ficam num circuito de estradas pela província. Colossos e Hierápolis também lhe pertenciam. No século II, Inácio escreveu às suas igrejas, Policarpo dirigiu Esmirna, Melitão Sardes e Papias Hierápolis."
    - "Diocleciano dividiu a grande província em menores, e o nome sobreviveu como diocese do Império tardio. Hoje a terra é o oeste da Turquia: İzmir no lugar de Esmirna, Bergama em Pérgamo, Selçuk junto às ruínas de Éfeso, Sart, Alaşehir e Denizli perto de Laodiceia."
  de:
    - "Asien ist im Neuen Testament nicht der Kontinent, sondern die römische Provinz dieses Namens: das westliche Drittel Kleinasiens, die Ägäisküste mit ihren alten griechischen Städten und die Täler von Hermos, Kaystros und Mäander, die durch Mysien, Lydien, Karien und Phrygien landeinwärts führen. Attalos III. von Pergamon vermachte sein Königreich 133 v. Chr. Rom, und nach dem Aufstand des Aristonikos wurde es 129 v. Chr. als Provinz eingerichtet. Sie gehörte zu den reichsten des Reiches, von einem Prokonsul senatorischen Ranges verwaltet; Pergamon war ihr erster Sitz, Ephesus im 1. Jahrhundert n. Chr. ihre eigentliche Hauptstadt. Die „Obersten in Asien“ der Apostelgeschichte, die Asiarchen, waren führende Männer ihrer Städte, und die Städte wetteiferten um den Titel eines Tempelhüters der Kaiser."
    - "Juden aus Asien hörten die Apostel zu Pfingsten. Auf der zweiten Reise „ward ihnen gewehrt von dem heiligen Geiste, zu reden das Wort in Asien“; auf der dritten lehrte Paulus über zwei Jahre in Ephesus, „also daß alle, die in Asien wohnten, das Wort des HERRN Jesus hörten, beide, Juden und Griechen“. Der Silberschmied Demetrius klagte, „nicht allein zu Ephesus sondern auch fast in ganz Asien“ mache Paulus Volk von den Göttern abfällig, und einige Asiarchen, Freunde des Paulus, hielten ihn vom Theater fern. Tychikus und Trophimus, „aus Asien“, reisten mit ihm; er segelte an Ephesus vorbei, um nicht in Asien Zeit zu verlieren; und „die Juden aus Asien“ ergriffen ihn im Tempel zu Jerusalem."
    - "Die Briefe zeigen die Gemeinden der Provinz: „Es grüßen euch die Gemeinden in Asien“, schreibt Paulus aus Ephesus nach Korinth; später erinnert er an „unsre Trübsal, die uns in Asien widerfahren ist“ und klagt, „daß sich von mir gewandt haben alle, die in Asien sind“. Epänetus ist in den ältesten Handschriften des Römerbriefs der Erstling Asiens, in den Texten der King-James- und der Synodalbibel Achajas. Petrus schreibt an die Fremdlinge in Pontus, Galatien, Kappadokien, Asien und Bithynien, und Johannes „den sieben Gemeinden in Asien“: Ephesus, Smyrna, Pergamon, Thyatira, Sardes, Philadelphia und Laodizea, die an einem Straßenring durch die Provinz liegen. Auch Kolossae und Hierapolis gehörten dazu. Im 2. Jahrhundert schrieb Ignatius an ihre Gemeinden, Polykarp leitete Smyrna, Melito Sardes und Papias Hierapolis."
    - "Diokletian zerlegte die große Provinz in kleinere, und der Name lebte als Diözese des späteren Reiches fort. Heute ist das Land der Westen der Türkei: Izmir an der Stelle Smyrnas, Bergama bei Pergamon, Selçuk neben den Ruinen von Ephesus, Sart, Alaşehir und Denizli bei Laodizea."
  fr:
    - "Dans le Nouveau Testament, l’Asie n’est pas le continent mais la province romaine de ce nom : le tiers occidental de l’Asie Mineure, la côte égéenne avec ses vieilles cités grecques et les vallées de l’Hermos, du Caÿstre et du Méandre pénétrant dans les terres à travers la Mysie, la Lydie, la Carie et la Phrygie. Attale III de Pergame légua son royaume à Rome en 133 av. J.-C., et après la révolte d’Aristonicos il fut organisé en province en 129 av. J.-C. Elle était parmi les plus riches de l’Empire, gouvernée par un proconsul de rang sénatorial ; Pergame fut son premier siège, Éphèse sa vraie capitale au Ier siècle apr. J.-C. Les asiarques des Actes, « chefs de l’Asie », étaient des notables de ses villes, et les villes se disputaient le titre de gardienne du temple des empereurs."
    - "Des Juifs d’Asie entendirent les apôtres à la Pentecôte. Lors de son deuxième voyage, Paul et ses compagnons furent « empêchés par le Saint-Esprit d’annoncer la parole dans l’Asie » ; lors du troisième, il enseigna plus de deux ans à Éphèse, « de sorte que tous ceux qui habitaient l’Asie, Juifs et Grecs, entendirent la parole du Seigneur ». L’orfèvre Démétrius se plaignit que « non seulement à Éphèse, mais dans presque toute l’Asie », Paul avait détourné les gens des dieux, et quelques asiarques, amis de Paul, l’empêchèrent d’aller au théâtre. Tychique et Trophime, « originaires d’Asie », voyageaient avec lui ; il passa devant Éphèse pour ne pas perdre de temps « en Asie » ; et ce furent « les Juifs d’Asie » qui le saisirent dans le temple à Jérusalem."
    - "Les épîtres montrent les Églises de la province : « Les Églises d’Asie vous saluent », écrit Paul d’Éphèse à Corinthe ; plus tard il rappelle « la tribulation qui nous est survenue en Asie » et se plaint que « tous ceux qui sont en Asie m’ont abandonné ». Épaïnète est les prémices de l’Asie dans les plus anciens manuscrits de Romains, de l’Achaïe dans les textes King James et synodal. Pierre écrit aux étrangers du Pont, de la Galatie, de la Cappadoce, de l’Asie et de la Bithynie, et Jean « aux sept Églises qui sont en Asie » : Éphèse, Smyrne, Pergame, Thyatire, Sardes, Philadelphie et Laodicée, situées sur un circuit routier de la province. Colosses et Hiérapolis en faisaient aussi partie. Au IIe siècle, Ignace écrivit à ses Églises, Polycarpe dirigea Smyrne, Méliton Sardes et Papias Hiérapolis."
    - "Dioclétien morcela la grande province en provinces plus petites, et le nom survécut comme diocèse du Bas-Empire. Aujourd’hui le pays est l’ouest de la Turquie : İzmir à l’emplacement de Smyrne, Bergama à Pergame, Selçuk à côté des ruines d’Éphèse, Sart, Alaşehir et Denizli près de Laodicée."
