body:
  en:
    - "Arpad was the capital of an Aramaean kingdom of northern Syria, Bit-Agusi, “the house of Gusi”, named after its founder of the ninth century BC. The site is Tell Rifaat, a large mound about 30 km north of Aleppo, where M. V. Seton-Williams dug in 1956, 1960 and 1964 and found massive mud-brick fortifications and Iron Age levels, though the city is still mostly unexcavated. The kingdom reached from the Afrin valley to the Euphrates and for a time led the Aramaean states of the north."
    - "Arpad's history is known from its neighbours and enemies. About 800 BC its king joined the coalition that Bar-hadad of Damascus led against Zakkur of Hamath, as Zakkur's stele records. Three stelae found at Sefire, south-east of Aleppo, carry the treaty that Mati'el of Arpad swore about 754 BC with a king called Bar-ga'yah of KTK, the longest Aramaic inscription of the period, with curses that resemble those of Deuteronomy; the same Mati'-ilu had sworn a treaty to Ashur-nirari V of Assyria. He then went over to Urartu, and Tiglath-pileser III besieged Arpad for three years, from 743 BC, took it in 740 and made it the seat of an Assyrian province. It rose once more with Hamath and Damascus in 720 and was crushed by Sargon II."
    - "This is why Arpad is a byword in the Bible for a city that could not be saved. Sennacherib's Rabshakeh asked under the walls of Jerusalem, “Where are the gods of Hamath, and of Arpad?”, and his letter to Hezekiah, “Where is the king of Hamath, and the king of Arpad?”; Isaiah's Assyrian boasts, “is not Hamath as Arpad?”; Jeremiah's oracle on Damascus begins, “Hamath is confounded, and Arpad”. Tall Rifaat today is a town of the Aleppo governorate of Syria, which changed hands more than once in the Syrian war; the mound rises beside it."
  ru:
    - "Арпад был столицей арамейского царства северной Сирии, Бит-Агуси, «дома Гуси», названного по его основателю IX века до н. э. Это Телль-Рифаат, большой холм примерно в 30 км к северу от Алеппо, где М. В. Сетон-Уильямс копала в 1956, 1960 и 1964 гг. и нашла мощные сырцовые укрепления и слои железного века, хотя город по большей части ещё не раскопан. Царство простиралось от долины Африна до Евфрата и одно время возглавляло арамейские государства севера."
    - "История Арпада известна от его соседей и врагов. Около 800 г. до н. э. его царь вошёл в коалицию, которую Бар-Хадад Дамасский повёл против Закура Емафского, как записано на стеле Закура. Три стелы, найденные в Сефире к юго-востоку от Алеппо, несут договор, который Матиэль Арпадский заключил около 754 г. до н. э. с царём по имени Бар-Гайя из КТК, — самую длинную арамейскую надпись того времени, с проклятиями, похожими на проклятия Второзакония; тот же Мати-илу присягал по договору Ашшур-нирари V Ассирийскому. Затем он перешёл к Урарту, и Феглаффелласар III три года, с 743 г. до н. э., осаждал Арпад, взял его в 740 г. и сделал центром ассирийской провинции. Город поднялся ещё раз вместе с Емафом и Дамаском в 720 г. и был раздавлен Саргоном II."
    - "Потому Арпад в Библии — пример города, который не удалось спасти. Рабсак Сеннахирима спрашивал под стенами Иерусалима: «Где боги Емафа и Арпада?», а его письмо Езекии: «Где царь Емафа, и царь Арпада?»; Ассириец у Исаии хвалится: «Емаф не то же ли, что Арпад?»; пророчество Иеремии о Дамаске начинается словами: «Посрамлены Емаф и Арпад». Телль-Рифаат сегодня — город провинции Алеппо в Сирии, не раз переходивший из рук в руки в сирийской войне; холм поднимается рядом с ним."
  uk:
    - "Арпад був столицею арамейського царства північної Сирії, Біт-Агусі, «дому Гусі», названого за засновником IX століття до н. е. Місце — Телль-Ріфаат, великий пагорб приблизно за 30 км на північ від Алеппо, де М. В. Сетон-Вільямс розкопувала в 1956, 1960 і 1964 роках і знайшла масивні мурування з необпаленої цегли та шари залізної доби, хоча місто здебільшого досі не розкопане. Царство сягало від долини Афріну до Євфрату і якийсь час очолювало арамейські держави півночі."
    - "Історію Арпаду відомо з його сусідів і ворогів. Близько 800 р. до н. е. його цар приєднався до коаліції, яку Бар-Гадад Дамаський очолив проти Закіра Хаматського, як записує стела Закіра. Три стели, знайдені в Сефіре на південний схід від Алеппо, містять договір, який Матіїл з Арпаду склав близько 754 р. до н. е. з царем на ім'я Бар-Гаях із КТК — найдовший арамейський напис того часу, з прокляттями, що нагадують Второзаконня; той самий Матіїл склав договір з Ашшур-нірарі V Ассирійським. Потім він перейшов до Урарту, і Тіглатпаласар III облягав Арпад три роки, з 743 р. до н. е., узяв його в 740-му і зробив осередком ассирійської провінції. Місто знову повстало з Хаматом і Дамаском у 720-му й було розтрощене Саргоном II."
    - "Тому Арпад у Біблії — прислів'я міста, яке не змогло врятуватися. Рабсак Сінаххеріба питав під мурами Єрусалима: «Де боги Ематові й Арпадові?», а лист до Єзекії: «Де царь Ематський й царь Арпадський», Ісаїні ассирійські хвальки: «Емат не те, що й Арпад?»; Єремієве пророцтво про Дамаск починається: «Осоромлені Емат і Арпад». Телль-Ріфаат нині — місто мухафази Алеппо в Сирії, яке не раз переходило з рук у руки під час сирійської війни; пагорб здіймається поряд."
  es:
    - "Arfad fue la capital de un reino arameo del norte de Siria, Bit-Agusi, «la casa de Gusi», llamado así por su fundador del siglo IX a. C. El sitio es Tell Rifaat, un gran montículo a unos 30 km al norte de Alepo, donde M. V. Seton-Williams excavó en 1956, 1960 y 1964 y halló fortificaciones masivas de adobe y niveles de la edad del Hierro, aunque la ciudad está aún en su mayor parte sin excavar. El reino se extendía desde el valle del Afrin hasta el Éufrates y durante un tiempo dirigió los estados arameos del norte."
    - "La historia de Arfad se conoce por sus vecinos y enemigos. Hacia 800 a. C. su rey se unió a la coalición que Bar-hadad de Damasco encabezó contra Zakkur de Hamat, como registra la estela de Zakkur. Tres estelas halladas en Sefire, al sudeste de Alepo, llevan el tratado que Mati'el de Arfad juró hacia 754 a. C. con un rey llamado Bar-ga'yah de KTK, la inscripción aramea más larga de la época, con maldiciones que se parecen a las del Deuteronomio; el mismo Mati'-ilu había jurado un tratado a Asur-nirari V de Asiria. Luego se pasó a Urartu, y Tiglat-pileser III asedió Arfad durante tres años, desde 743 a. C., la tomó en 740 y la hizo sede de una provincia asiria. Resurgió una vez más con Hamat y Damasco en 720 y fue aplastada por Sargón II."
    - "Por eso Arfad es en la Biblia sinónimo de una ciudad que no pudo salvarse. El Rabsaces de Senaquerib preguntó bajo los muros de Jerusalén: «¿Dónde está el dios de Hamath, y de Arphad?», y su carta a Ezequías: «¿Dónde está el rey de Hamath, el rey de Arphad...?»; en Isaías, la jactancia asiria: «Hamath como Arphad»; el oráculo de Jeremías sobre Damasco comienza: «Confundióse Hamath, y Arphad». Tall Rifaat es hoy una ciudad de la gobernación de Alepo, en Siria, que cambió de manos más de una vez en la guerra de Siria; el montículo se alza junto a ella."
  pt:
    - "Arpade foi a capital de um reino arameu do norte da Síria, Bit-Agusi, “a casa de Gusi”, que recebeu o nome de seu fundador do século IX a.C. O sítio é Tell Rifaat, um grande montículo cerca de 30 km ao norte de Alepo, onde M. V. Seton-Williams escavou em 1956, 1960 e 1964 e achou maciças fortificações de tijolos de barro e níveis da Idade do Ferro, embora a cidade ainda esteja em boa parte sem escavar. O reino ia do vale do Afrin ao Eufrates e por algum tempo liderou os Estados arameus do norte."
    - "A história de Arpade é conhecida por seus vizinhos e inimigos. Por volta de 800 a.C., seu rei juntou-se à coalizão que Bar-Hadad de Damasco liderou contra Zakkur de Hamate, como registra a estela de Zakkur. Três estelas achadas em Sefire, a sudeste de Alepo, trazem o tratado que Mati'el de Arpade jurou por volta de 754 a.C. com um rei chamado Bar-ga'yah de KTK, a mais longa inscrição aramaica da época, com maldições semelhantes às de Deuteronômio; o mesmo Mati'-ilu havia jurado um tratado a Assur-nirari V da Assíria. Depois passou a Urartu, e Tiglate-Pileser III sitiou Arpade por três anos, desde 743 a.C., tomou-a em 740 e fez dela sede de uma província assíria. Ergueu-se mais uma vez com Hamate e Damasco em 720 e foi esmagada por Sargão II."
    - "Por isso Arpade é na Bíblia um símbolo de cidade que não pôde ser salva. O Rabsaqué de Senaqueribe perguntou diante das muralhas de Jerusalém: “Onde estão os deuses de Hamate e de Arpade?”, e sua carta a Ezequias: “Onde está o rei de Hamate, o rei de Arpade”; as jactâncias assírias em Isaías: “Não é Hamate como Arpade?”; o oráculo de Jeremias sobre Damasco começa: “Hamate e Arpade estão envergonhadas”. Tall Rifaat é hoje uma cidade da província de Alepo, na Síria, que mudou de mãos mais de uma vez na guerra síria; o montículo se ergue ao lado dela."
  de:
    - "Arpad war die Hauptstadt eines aramäischen Königreichs in Nordsyrien, Bit-Agusi, „Haus des Gusi“, nach seinem Gründer aus dem 9. Jahrhundert v. Chr. benannt. Die Stätte ist Tell Rifaat, ein großer Hügel etwa 30 km nördlich von Aleppo, wo M. V. Seton-Williams 1956, 1960 und 1964 grub und mächtige Lehmziegelbefestigungen und Schichten der Eisenzeit fand, doch ist die Stadt noch überwiegend unausgegraben. Das Königreich reichte vom Afrin-Tal bis zum Euphrat und führte zeitweise die aramäischen Staaten des Nordens an."
    - "Arpads Geschichte kennt man von seinen Nachbarn und Feinden. Um 800 v. Chr. schloss sich sein König der Koalition an, die Bar-Hadad von Damaskus gegen Zakkur von Hamat führte, wie Zakkurs Stele berichtet. Drei in Sefire südöstlich von Aleppo gefundene Stelen tragen den Vertrag, den Mati'el von Arpad um 754 v. Chr. mit einem König namens Bar-ga'yah von KTK schwor, die längste aramäische Inschrift der Zeit, mit Flüchen, die denen des Fünften Buches Mose ähneln; derselbe Mati'-ilu hatte Aschschur-nirari V. von Assyrien einen Vertrag geschworen. Dann ging er zu Urartu über, und Tiglat-Pileser III. belagerte Arpad ab 743 v. Chr. drei Jahre, nahm es 740 ein und machte es zum Sitz einer assyrischen Provinz. Mit Hamat und Damaskus erhob es sich 720 noch einmal und wurde von Sargon II. niedergeworfen."
    - "Darum ist Arpad in der Bibel ein Sinnbild für eine Stadt, die nicht zu retten war. Sanheribs Rabsake fragte unter den Mauern Jerusalems: „Wo sind die Götter zu Hamath und Arpad?“, und sein Brief an Hiskia: „Wo ist der König von Hamath, der König zu Arpad?“; Jesajas Assyrer prahlt: „ist Hamath nicht wie Arpad?“; Jeremias Spruch gegen Damaskus beginnt: „Hamath und Arpad stehen jämmerlich; sie sind verzagt“. Tall Rifaat ist heute eine Stadt im Gouvernement Aleppo in Syrien, die im syrischen Krieg mehr als einmal den Besitzer wechselte; der Hügel erhebt sich neben ihr."
  fr:
    - "Arpad était la capitale d’un royaume araméen du nord de la Syrie, Bit-Agusi, « la maison de Gusi », nommé d’après son fondateur du IXe siècle av. J.-C. Le site est Tell Rifaat, grand tertre à environ 30 km au nord d’Alep, où M. V. Seton-Williams fouilla en 1956, 1960 et 1964 et trouva de massives fortifications en briques crues et des niveaux de l’âge du Fer, bien que la ville reste en grande partie non fouillée. Le royaume allait de la vallée de l’Afrin à l’Euphrate et mena un temps les États araméens du nord."
    - "L’histoire d’Arpad se connaît par ses voisins et ses ennemis. Vers 800 av. J.-C., son roi rejoignit la coalition que Bar-Hadad de Damas mena contre Zakkur de Hamath, comme le consigne la stèle de Zakkur. Trois stèles trouvées à Sfiré, au sud-est d’Alep, portent le traité que Mati’el d’Arpad jura vers 754 av. J.-C. avec un roi nommé Bar-ga’yah de KTK, la plus longue inscription araméenne de l’époque, avec des malédictions semblables à celles du Deutéronome ; le même Mati’-ilu avait juré un traité à Assour-nirari V d’Assyrie. Il passa ensuite à l’Urartu, et Tiglath-Piléser III assiégea Arpad trois ans à partir de 743 av. J.-C., la prit en 740 et en fit le siège d’une province assyrienne. Elle se releva avec Hamath et Damas en 720 et fut écrasée par Sargon II."
    - "C’est pourquoi Arpad est dans la Bible le symbole d’une ville qui ne put être sauvée. Le Rabschaké de Sanchérib demanda sous les murs de Jérusalem : « Où sont les dieux de Hamath et d’Arpad ? », et sa lettre à Ézéchias : « Où sont le roi de Hamath, le roi d’Arpad ? » ; chez Ésaïe, les vantardises assyriennes : « N’en a-t-il pas été de Hamath comme d’Arpad ? » ; l’oracle de Jérémie sur Damas commence : « Hamath et Arpad sont confuses ». Tall Rifaat est aujourd’hui une ville du gouvernorat d’Alep, en Syrie, qui a changé de mains plus d’une fois pendant la guerre de Syrie ; le tertre s’élève à côté."
  it:
    - "Arpad era la capitale di un regno aramaico della Siria settentrionale, Bit-Agusi, «la casa di Gusi», dal nome del suo fondatore del IX secolo a.C. Il sito è Tell Rifaat, un grande tell a circa 30 km a nord di Aleppo, dove M. V. Seton-Williams scavò nel 1956, 1960 e 1964 e trovò massicce fortificazioni di mattoni crudi e livelli dell’età del Ferro, benché la città sia ancora in gran parte non scavata. Il regno si estendeva dalla valle dell’Afrin all’Eufrate e per un periodo guidò gli stati aramei del nord."
    - "La storia di Arpad è nota dai suoi vicini e nemici. Intorno all’800 a.C. il suo re si unì alla coalizione che Bar-Hadad di Damasco guidò contro Zakkur di Camat, come registra la stele di Zakkur. Tre stele trovate a Sefire, a sud-est di Aleppo, recano il trattato che Mati‘el di Arpad giurò intorno al 754 a.C. con un re chiamato Bar-ga’yah di KTK, la più lunga iscrizione aramaica del periodo, con maledizioni simili a quelle del Deuteronomio; lo stesso Mati‘-ilu aveva giurato un trattato con Assur-nirari V d’Assiria. Passò poi a Urartu, e Tiglat-Pilèser III assediò Arpad per tre anni, dal 743 a.C., la prese nel 740 e ne fece la sede di una provincia assira. Si sollevò ancora con Camat e Damasco nel 720 e fu schiacciata da Sargon II."
    - "Per questo Arpad è nella Bibbia sinonimo di una città che non poté essere salvata. Il Rabsache di Sennacherib chiese sotto le mura di Gerusalemme: «Dove sono gli dèi di Hamath e d’Arpad?», e la sua lettera a Ezechia: «Dov’è il re di Hamath, il re d’Arpad»; le millanterie dell’Assiro in Isaia: «Di Hamath come d’Arpad?»; l’oracolo di Geremia su Damasco comincia: «Hamath e Arpad sono confuse». Tall Rifaat è oggi una città del governatorato di Aleppo in Siria, passata di mano più volte nella guerra siriana; il tell sorge accanto ad essa."
  pl:
    - "Arpad było stolicą aramejskiego królestwa północnej Syrii, Bit-Agusi, „domu Gusiego”, nazwanego od jego założyciela z IX wieku p.n.e. Miejscem jest Tell Rifaat, wielki tell około 30 km na północ od Aleppo, gdzie M. V. Seton-Williams kopała w 1956, 1960 i 1964 roku i znalazła potężne umocnienia z cegły mułowej i warstwy z epoki żelaza, choć miasto w większości wciąż jest niewykopane. Królestwo sięgało od doliny Afrin do Eufratu i przez pewien czas przewodziło aramejskim państwom północy."
    - "Dzieje Arpad znamy od jego sąsiadów i wrogów. Około 800 r. p.n.e. jego król przystąpił do koalicji, którą Bar-Hadad z Damaszku poprowadził przeciw Zakkurowi z Chamat, jak zapisuje stela Zakkura. Trzy stele znalezione w Sefire, na południowy wschód od Aleppo, niosą traktat, który Mati'el z Arpad zaprzysiągł około 754 r. p.n.e. z królem zwanym Bar-Ga'yah z KTK, najdłuższy napis aramejski tej epoki, z klątwami podobnymi do tych z Księgi Powtórzonego Prawa; ten sam Mati'-ilu zaprzysiągł traktat z Aszur-nirarim V z Asyrii. Potem przeszedł do Urartu, a Tiglat-Pileser III oblegał Arpad przez trzy lata, od 743 r. p.n.e., zdobył je w 740 i uczynił siedzibą asyryjskiej prowincji. Podniosło się raz jeszcze z Chamat i Damaszkiem w 720 r. i zostało zmiażdżone przez Sargona II."
    - "Dlatego Arpad jest w Biblii przysłowiem miasta, którego nie dało się ocalić. Rabszake Sennacheryba pytał pod murami Jerozolimy: „Gdzież są bogowie Emat i Arfad?”, a jego list do Ezechiasza: „Gdzież jest król Emat, i król Arfad”; asyryjskie przechwałki u Izajasza: „Izali Arfat nie jest jako Emat?”; wyrocznia Jeremiasza o Damaszku zaczyna się: „Zawstydzi się Emat i Arfad”. Tall Rifaat jest dziś miastem w muhafazie Aleppo w Syrii, które nie raz zmieniało rąk w wojnie syryjskiej; tell wznosi się obok niego."
  nl:
    - "Arpad was de hoofdstad van een Arameeës koninkrijk in Noord-Syrië, Bit-Agusi, “het huis van Gusi”, genoemd naar zijn stichter uit de negende eeuw v.Chr. De plaats is Tell Rifaat, een grote heuvel zo’n 30 km ten noorden van Aleppo, waar M. V. Seton-Williams in 1956, 1960 en 1964 groef en massieve lemen vestingmuren en ijzertijdlagen vond, al is de stad nog grotendeels onopgegraven. Het koninkrijk reikte van het Afrindal tot de Eufraat en leidde een tijd de Arameese staten van het noorden."
    - "Arpads geschiedenis is bekend uit zijn buren en vijanden. Omstreeks 800 v.Chr. sloot zijn koning zich aan bij de coalitie die Bar-Hadad van Damascus leidde tegen Zakkur van Hamat, zoals Zakkurs stèle vermeldt. Drie stèles gevonden bij Sefire, ten zuidoosten van Aleppo, dragen het verdrag dat Mati’el van Arpad omstreeks 754 v.Chr. zwoer met een koning Bar-ga’yah van KTK, het langste Arameese opschrift van die tijd, met vloeken die op die van Deuteronomium lijken; dezelfde Mati’-ilu had een verdrag gezworen aan Assur-nirari V van Assyrië. Daarna liep hij over naar Urartu, en Tiglat-Pileser III belegerde Arpad drie jaar, vanaf 743 v.Chr., nam het in 740 in en maakte het de zetel van een Assyrische provincie. Het kwam in 720 met Hamat en Damascus nog eens in opstand en werd door Sargon II verpletterd."
    - "Daarom is Arpad in de Bijbel een spreekwoord voor een stad die niet te redden was. Sanheribs Rabsake vroeg onder de muren van Jeruzalem: “Waar zijn de goden van Hamath, en van Arpad?”, en zijn brief aan Chizkia: “Waar is de koning van Hamath, en de koning van Arpad”; in Jesaja’s Assyrische grootspraak staat: “Is Hamath niet gelijk Arfad?”; Jeremia’s godsspraak over Damascus begint: “Beschaamd is Hamath en Arpad”. Tall Rifaat is nu een stad in het gouvernement Aleppo in Syrië, die in de Syrische oorlog meer dan eens van hand wisselde; de heuvel rijst ernaast op."
  cs:
    - "Arpád byl hlavním městem aramejského království v severní Sýrii, Bít-Agusi, „domu Gusiho“, pojmenovaného podle zakladatele z 9. století př. n. l. Místem je Tell Rifaat, velký pahorek asi 30 km severně od Aleppa, kde M. V. Seton-Williams kopala v letech 1956, 1960 a 1964 a našla mohutné opevnění z nepálených cihel a vrstvy z doby železné, ač je město stále převážně nevykopáno. Království sahalo od údolí Afrínu k Eufratu a po čas vedlo aramejské státy severu."
    - "Dějiny Arpádu známe od jeho sousedů a nepřátel. Kolem roku 800 př. n. l. se jeho král připojil ke koalici, kterou vedl Bar-hadad Damašský proti Zakkurovi z Chamatu, jak zaznamenává Zakkurova stéla. Tři stély nalezené v Sefire, jihovýchodně od Aleppa, nesou smlouvu, kterou Mati'el z Arpádu přísahal kolem roku 754 př. n. l. s králem zvaným Bar-ga'jah z KTK, nejdelší aramejský nápis své doby, s kletbami podobnými těm v Deuteronomiu; týž Mati'-ilu přísahal smlouvu Aššúr-nárárímu V. Asyrskému. Poté přešel k Urartu a Tiglatpilesar III. obléhal Arpád tři roky, od roku 743 př. n. l., v roce 740 jej dobyl a učinil z něj sídlo asyrské provincie. S Chamatem a Damaškem povstal znovu v roce 720 a byl rozdrcen Sargonem II."
    - "Proto je Arpád v Bibli příslovím pro město, které nešlo zachránit. Senacheribův Rab-šake se pod hradbami Jeruzaléma ptal: „Kdež jsou bohové Emat a Arfad?“ a jeho list Chizkijášovi: „Kde jest král Emat, a král Arfad“; v Izajášovi se Asyřan chlubí: „Zdali není jako Arfad Emat?“; Jeremjášovo proroctví o Damašku začíná: „Zastydí se Emat i Arfad“. Tall Rifaat je dnes městem v guvernorátu Aleppo v Sýrii, které za syrské války několikrát změnilo majitele; pahorek se zdvíhá vedle něj."
  sv:
    - "Arpad var huvudstad i ett arameiskt kungarike i norra Syrien, Bit-Agusi, ”Gusis hus”, uppkallat efter sin grundare på 800-talet f.Kr. Platsen är Tell Rifaat, en stor kulle omkring 30 km norr om Aleppo, där M. V. Seton-Williams grävde 1956, 1960 och 1964 och fann massiva befästningar av lertegel och järnåldersskikt, fastän staden fortfarande mestadels är outgrävd. Riket nådde från Afrindalen till Eufrat och ledde en tid de arameiska staterna i norr."
    - "Arpads historia är känd från dess grannar och fiender. Omkring 800 f.Kr. anslöt sig dess kung till den koalition som Bar-Hadad av Damaskus ledde mot Zakkur av Hamat, som Zakkurs stele berättar. Tre stelar funna vid Sefire, sydost om Aleppo, bär fördraget som Mati'el av Arpad svor omkring 754 f.Kr. med en kung som kallas Bar-ga'yah av KTK, den längsta arameiska inskriften från tiden, med förbannelser som liknar dem i Femte Mosebok; samme Mati'-ilu hade svurit ett fördrag med Ashur-nirari V av Assyrien. Han gick sedan över till Urartu, och Tiglat-Pileser III belägrade Arpad i tre år från 743 f.Kr., intog det 740 och gjorde det till säte för en assyrisk provins. Det reste sig en gång till med Hamat och Damaskus år 720 och krossades av Sargon II."
    - "Därför är Arpad i Bibeln ett ordspråk för en stad som inte kunde räddas. Sanheribs Rab-Shake frågade under Jerusalems murar: ”Var äro Hamats och Arpads gudar?”, och hans brev till Hiskia: ”Var är Hamats konung och Arpads konung”; i Jesajas assyriska skryt: ”Har det icke gått Kalno såsom Karkemis, och Hamat såsom Arpad”; Jeremias utsaga om Damaskus börjar: ”Hamat och Arpad komma på skam”. Tall Rifaat är i dag en stad i guvernementet Aleppo i Syrien, som bytte händer mer än en gång under kriget i Syrien; kullen reser sig bredvid den."
  nb:
    - "Arpad var hovedstaden i et arameisk rike i Nord-Syria, Bit-Agusi, «Gusis hus», oppkalt etter grunnleggeren fra 800-tallet f.Kr. Stedet er Tell Rifaat, en stor tell omtrent 30 km nord for Aleppo, der M. V. Seton-Williams gravde i 1956, 1960 og 1964 og fant massive befestninger av leirstein og lag fra jernalderen, selv om byen fortsatt for det meste er uutgravd. Riket rakk fra Afrin-dalen til Eufrat og ledet en tid de arameiske statene i nord."
    - "Arpads historie er kjent fra naboene og fiendene. Omkring 800 f.Kr. sluttet kongen seg til koalisjonen som Bar-Hadad av Damaskus ledet mot Zakkur av Hamat, slik Zakkurs stele forteller. Tre steler funnet ved Sefire, sørøst for Aleppo, bærer traktaten som Mati'el av Arpad sverget omkring 754 f.Kr. med en konge kalt Bar-ga'yah av KTK, den lengste arameiske innskriften fra perioden, med forbannelser som ligner dem i 5. Mosebok; den samme Mati'-ilu hadde sverget en traktat til Assur-nirari V av Assyria. Han gikk så over til Urartu, og Tiglat-Pileser III beleiret Arpad i tre år fra 743 f.Kr., inntok den i 740 og gjorde den til sete for en assyrisk provins. Den reiste seg igjen sammen med Hamat og Damaskus i 720 og ble knust av Sargon II."
    - "Derfor er Arpad i Bibelen et ordspråk om en by som ikke kunne reddes. Sankeribs Rabsjake spurte under Jerusalems murer: «Hvor er Hamats og Arpads guder?», og brevet hans til Hiskia: «Hvor er nu Hamats konge og Arpads konge»; Jesajas assyriske skryt: «Er det ikke gått Hamat som Arpad?»; Jeremias utsagn mot Damaskus begynner: «Hamat og Arpad er blitt til skamme». Tall Rifaat er i dag en by i Aleppo-guvernementet i Syria, som skiftet hender mer enn én gang i den syriske krigen; tellen hever seg ved siden av."
  tl:
    - "Ang Arphad ay kabisera ng kahariang Arameo sa hilagang Siria, ang Bit-Agusi, “bahay ni Gusi”, na ipinangalan sa tagapagtatag nito noong ika-9 na siglo BK. Ang lugar ay ang Tell Rifaat, malaking burol mga 30 km sa hilaga ng Aleppo, kung saan naghukay si M. V. Seton-Williams noong 1956, 1960 at 1964 at nakatuklas ng malalaking kutang laryo-putik at mga antas ng Panahon ng Bakal, bagaman halos hindi pa nahuhukay ang lungsod. Umabot ang kaharian mula sa libis ng Afrin hanggang Eufrates at sa ilang panahon ay pinamunuan ang mga estadong Arameo sa hilaga."
    - "Kilala ang kasaysayan ng Arphad mula sa mga kapitbahay at kaaway nito. Mga 800 BK, sumali ang hari nito sa koalisyong pinamunuan ni Bar-hadad ng Damasco laban kay Zakkur ng Hamath, gaya ng itinatala ng estela ni Zakkur. Tatlong estelang natagpuan sa Sefire, sa timog-silangan ng Aleppo, ang may kasunduang isinumpa ni Mati'el ng Arphad mga 754 BK sa isang haring tinatawag na Bar-ga'yah ng KTK, ang pinakamahabang inskripsiyong Arameo ng panahon, na may mga sumpang kahawig ng sa Deuteronomio; ang parehong Mati'-ilu ay nanumpa ng kasunduan kay Ashur-nirari V ng Asiria. Pagkatapos ay lumipat siya sa Urartu, at kinubkob ni Tiglath-pileser III ang Arphad nang tatlong taon, mula 743 BK, kinuha ito noong 740 at ginawang luklukan ng lalawigang Asirio. Muli itong bumangon kasama ng Hamath at Damasco noong 720 at dinurog ni Sargon II."
    - "Kaya ang Arphad ay kasabihan sa Biblia para sa lungsod na hindi mailigtas. Itinanong ng Rabsaces ni Sennacherib sa ilalim ng mga pader ng Jerusalem, “Saan nandoon ang mga dios ng Hamath, at ng Arphad?”, at ng kaniyang liham kay Ezechias, “Saan nandoon ang hari sa Hamath, at ang hari sa Arphad”; sa mga pagyayabang na Asirio sa Isaias, “hindi ba ang Hamath ay gaya ng Arphad?”; at ang hula ni Jeremias tungkol sa Damasco ay nagsisimula, “Ang Hamath ay napahiya, at ang Arphad”. Ang Tall Rifaat ay bayan ng Gobernorado ng Aleppo sa Siria ngayon, na ilang beses nagpalit ng kamay sa digmaan sa Siria; ang burol ay tumataas sa tabi nito."
  da:
    - "Arpad var hovedstad i et arameisk kongerige i det nordlige Syrien, Bit-Agusi, »Gusis hus«, opkaldt efter dets grundlægger fra 800-tallet f.Kr. Stedet er Tell Rifaat, en stor tell omkring 30 km nord for Aleppo, hvor M. V. Seton-Williams gravede i 1956, 1960 og 1964 og fandt massive lerstensbefæstninger og jernalderlag, skønt byen stadig for størstedelen er uudgravet. Riget nåede fra Afrin-dalen til Eufrat og ledede en tid de arameiske stater i nord."
    - "Arpads historie kendes fra dets naboer og fjender. Omkring 800 f.Kr. sluttede dets konge sig til den koalition, som Bar-Hadad af Damaskus ledede mod Zakkur af Hamat, som Zakkurs stele beretter. Tre steler fundet ved Sefire, sydøst for Aleppo, bærer den traktat, som Mati'el af Arpad omkring 754 f.Kr. svor med en konge ved navn Bar-ga'yah af KTK, den længste arameiske indskrift fra perioden, med forbandelser, der ligner dem i Femte Mosebog; den samme Mati'-ilu havde svoret en traktat til Assur-nirari 5. af Assyrien. Han gik så over til Urartu, og Tiglat-Pileser 3. belejrede Arpad i tre år fra 743 f.Kr., indtog den i 740 og gjorde den til sæde for en assyrisk provins. Den rejste sig igen med Hamat og Damaskus i 720 og blev knust af Sargon 2."
    - "Derfor er Arpad et mundheld i Bibelen for en by, der ikke kunne reddes. Sankeribs Rabsjake spurgte under Jerusalems mure: »Hvor ere de Guder af Hamath og Arfad?«, og hans brev til Hizkija: »Hvor er Kongen af Hamath og Kongen af Arfad?«; Esajas' assyriske praleri: »ikke Hamath som Arpad?«; Jeremias' udsagn om Damaskus begynder: »Hamat og Arfad ere beskæmmede«. Tall Rifaat er i dag en by i Aleppo-guvernementet i Syrien, som skiftede hænder mere end én gang i den syriske krig; tellen rejser sig ved siden af."
  sr:
    - "Арфад је био престоница арамејског краљевства у северној Сирији, Бит-Агуси, „дом Гусијев“, названог по његовом оснивачу из 9. века п. н. е. Налазиште је Тел Рифат, велика хумка око 30 км северно од Алепа, где је М. В. Сетон-Вилијамс копао 1956, 1960. и 1964. и нашао масивна утврђења од сирове опеке и слојеве гвозденог доба, мада је град још углавном неископан. Краљевство је допирало од долине Африна до Еуфрата и неко време предводило арамејске државе севера."
    - "Историја Арфада позната је из његових суседа и непријатеља. Око 800. п. н. е. његов краљ се придружио коалицији коју је Бар-Хадад из Дамаска водио против Закура из Емата, како бележи Закурова стела. Три стеле нађене у Сефиреу, југоисточно од Алепа, носе уговор који је Матиел из Арфада заклео око 754. п. н. е. с краљем званим Бар-Гајах из КТК, најдужи арамејски натпис тог доба, с клетвама налик онима из Поновљеног закона; исти Мати-илу био је заклео уговор Ашур-нерарију V Асирском. Затим је прешао на Урарту, а Теглат-Феласар III опседао је Арфад три године, од 743. п. н. е., заузео га 740. и учинио седиштем асирске провинције. Године 720. придружио се побуни Емата и Дамаска, али га је Саргон II сатро."
    - "Зато је Арфад у Библији синоним за град који се није могао спасти. Сенахиримов Равсак питао је под зидинама Јерусалима: „Где су богови ематски и арфадски?“, а његово писмо Језекији: „Где је цар ематски и цар арфадски…“; Исаијино асирско хвалисање: „Није ли Емат као Арфад?“; Јеремијино пророштво о Дамаску почиње: „Посрами се Емат и Арфад“. Тал Рифат је данас град у алепском гувернорату Сирије, који је у сиријском рату више пута мењао господара; хумка се уздиже поред њега."
