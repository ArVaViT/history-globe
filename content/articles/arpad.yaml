# Overview article (ADR 0007). Mainstream facts only; Assyrian dates follow the eponym chronicle; the Sefire treaty date is given as approximate.
id: arpad
place: a173c40
title:
  en: "Arpad"
  ru: "Арпад"
  uk: "Арпад"
  es: "Arfad"
  pt: "Arpade"
  de: "Arpad"
  fr: "Arpad"
