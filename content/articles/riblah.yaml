body:
  en:
    - "Riblah lay on the east bank of the Orontes, at the village of Rableh in western Syria near the Lebanese border, about 33 km south-south-west of Homs. It stood at a bend of the river, at the northern end of the valley between Lebanon and Anti-Lebanon, where a broad and fertile plain opens. Edward Robinson, who camped there in 1852, wrote that no one questioned its identity with biblical Riblah. Numbers names a Riblah on the eastern border of the promised land; whether that is the same place is disputed."
    - "The plain around Riblah had long been a crossroads and a battlefield. Tell Nebi Mend, ancient Kadesh, where Ramesses II fought the Hittites in the thirteenth century BC, is within sight about 12 km to the north. Water, grain and forage were at hand, and roads led from here north to the Euphrates and south to Palestine and Egypt, which made the place a natural camp for great armies."
    - 'In 609 BC Pharaoh Necho marched north to help the last Assyrian king against Babylon, as the Babylonian Chronicle also records; on the way he killed Josiah at Megiddo. Josiah''s son Jehoahaz reigned only three months before Necho "put him in bands at Riblah in the land of Hamath"; Necho set Eliakim on the throne as Jehoiakim and took Jehoahaz to Egypt, where he died. In 605 BC Nebuchadnezzar routed the Egyptians at Carchemish and took the whole region of Hamath. During the siege of Jerusalem he himself stayed at Riblah, and when the city fell in 587 or 586 BC Zedekiah was brought to him here: his sons were killed before his eyes, he was blinded and taken to Babylon. Nebuzaradan later brought the chief priest Seraiah and other leaders of Judah to Riblah, where the king had them put to death.'
    - "After this Riblah disappears from history. In the fourth century AD Eusebius knew Rebla only as the place in the land of Hamath where Pharaoh led Jehoahaz away, and Jerome took Riblah for Antioch. Robinson noted that Riblah does not appear in the lists of early church sees. The plain passed to the Seleucid kings and then to Roman Syria, whose chief city nearby was Emesa, the modern Homs."
  ru:
    - "Ривла лежала на восточном берегу Оронта, у селения Рабле на западе Сирии, близ границы с Ливаном, примерно в 33 км к юго-юго-западу от Хомса. Она стояла у изгиба реки, у северного конца долины между Ливаном и Антиливаном, где открывается широкая и плодородная равнина. Эдвард Робинсон, ставший здесь лагерем в 1852 г., писал, что её тождество с библейской Ривлой никто не оспаривает. Книга Чисел называет Риблу на восточной границе обетованной земли; то же ли это место — спорно."
    - "Равнина вокруг Ривлы издавна была перекрёстком дорог и полем битв. Примерно в 12 км к северу, в пределах видимости, стоит Телль-Неби-Менд — древний Кадеш, у которого Рамсес II сражался с хеттами в XIII веке до н. э. Вода, хлеб и корм для скота были под рукой, а дороги вели отсюда на север к Евфрату и на юг в Палестину и Египет, и потому место было естественным лагерем для больших армий."
    - "В 609 г. до н. э. фараон Нехао пошёл на север помогать последнему ассирийскому царю против Вавилона, о чём сообщает и Вавилонская хроника; по пути он умертвил Иосию в Мегиддоне. Сын Иосии Иоахаз царствовал лишь три месяца, а затем «задержал его фараон Нехао в Ривле, в земле Емафской»; Нехао воцарил Елиакима под именем Иоакима, а Иоахаза отвёл в Египет, где тот и умер. В 605 г. до н. э. Навуходоносор разбил египтян при Кархемисе и взял всю область Емафа. Во время осады Иерусалима он сам находился в Ривле, и когда город пал в 587 или 586 г. до н. э., к нему сюда привели Седекию: сыновей его закололи у него на глазах, а его ослепили и отвели в Вавилон. Позже Навузардан привёл в Ривлу первосвященника Сераию и других вождей Иудеи, и царь умертвил их."
    - "После этого Ривла исчезает из истории. В IV веке н. э. Евсевий знал Ривлу лишь как место в земле Емафской, откуда фараон увёл Иоахаза, а Иероним принимал Ривлу за Антиохию. Робинсон заметил, что Ривлы нет в списках ранних церковных кафедр. Равнина перешла к царям Селевкидам, а затем к римской Сирии, чьим главным городом поблизости была Эмеса — нынешний Хомс."
  uk:
    - "Рівла лежала на східному березі Оронту, біля села Рабле на заході Сирії поблизу ліванського кордону, приблизно за 33 км на південь-південний захід від Хомса. Вона стояла на вигині річки, на північному краї долини між Ліваном та Антиліваном, де відкривається широка й родюча рівнина. Едвард Робінсон, що таборував там 1852 року, писав, що ніхто не ставить під сумнів її тотожність із біблійною Рівлою. Книга Чисел називає Рівлу на східному кордоні обітованої землі; чи це те саме місце, спірно."
    - "Рівнина навколо Рівли давно була перехрестям і полем битв. Телль-Неби-Менд, давній Кадеш, де Рамсес II бився з хеттами в XIII ст. до н. е., лежить на видноколі приблизно за 12 км на північ. Вода, зерно й фураж були під рукою, а дороги вели звідси на північ до Євфрату й на південь до Палестини та Єгипту, що робило це місце природним табором для великих армій."
    - "У 609 р. до н. е. фараон Нехао рушив на північ допомогти останньому ассирійському цареві проти Вавилона, як фіксує й Вавилонська хроніка; дорогою він убив Йосію в Мегіддо. Син Йосії Йоахаз царював лише три місяці, перш ніж Нехао «задержав його в неволї в Ривлї, в країнї Ематській»; Нехао посадив на престол Еліакіма як Йоакима, а Йоахаза забрав до Єгипту, де той помер. У 605 р. до н. е. Навуходоносор розбив єгиптян під Каркемишем і взяв увесь край Хамата. Під час облоги Єрусалима він сам перебував у Рівлі, і коли місто впало в 587 або 586 р. до н. е., Седекію привели до нього сюди: його синів убили на його очах, а його самого осліпили й відвели до Вавилона. Навузардан пізніше привів до Рівли головного священика Сераїю й інших вождів Юди, де цар наказав їх стратити."
    - "Після цього Рівла зникає з історії. У IV ст. н. е. Євсевій знав Ревлу лише як місце в краї Хамата, куди фараон відвів Йоахаза, а Єронім вважав Рівлу за Антіохію. Робінсон зауважив, що Рівла не фігурує в списках ранніх церковних кафедр. Рівнина перейшла до Селевкідів, а потім до римської Сирії, головним містом якої поблизу була Емеса, сучасний Хомс."
  es:
    - "Ribla estaba en la orilla oriental del Orontes, en la aldea de Rableh, en el oeste de Siria, cerca de la frontera libanesa, a unos 33 km al sur-suroeste de Homs. Se alzaba en un recodo del río, en el extremo norte del valle entre el Líbano y el Antilíbano, donde se abre una llanura ancha y fértil. Edward Robinson, que acampó allí en 1852, escribió que nadie ponía en duda su identidad con la Ribla bíblica. Números nombra una Ribla en la frontera oriental de la tierra prometida; si es el mismo lugar se discute."
    - "La llanura en torno a Ribla fue durante mucho tiempo encrucijada y campo de batalla. Tell Nebi Mend, la antigua Cades, donde Ramsés II combatió a los hititas en el siglo XIII a. C., está a la vista, a unos 12 km al norte. Había agua, grano y forraje a mano, y desde aquí los caminos llevaban al norte hasta el Éufrates y al sur hasta Palestina y Egipto, lo que hacía del lugar un campamento natural para grandes ejércitos."
    - "En 609 a. C. el faraón Necao marchó al norte para ayudar al último rey asirio contra Babilonia, como registra también la Crónica babilónica; de camino mató a Josías en Meguido. Joacaz, hijo de Josías, reinó solo tres meses; luego, según el texto, «echólo preso Faraón Nechâo en Ribla en la provincia de Hamath»; Necao puso en el trono a Eliaquim como Joacim y se llevó a Joacaz a Egipto, donde murió. En 605 a. C. Nabucodonosor derrotó a los egipcios en Carquemis y tomó toda la región de Hamat. Durante el asedio de Jerusalén él mismo permaneció en Ribla, y cuando la ciudad cayó en 587 o 586 a. C., Sedequías le fue traído aquí: sus hijos fueron muertos ante sus ojos, él fue cegado y llevado a Babilonia. Nabuzaradán trajo más tarde a Ribla al sumo sacerdote Seraías y a otros jefes de Judá, donde el rey los hizo ejecutar."
    - "Después de esto Ribla desaparece de la historia. En el siglo IV d. C. Eusebio conocía Rebla solo como el lugar en la tierra de Hamat adonde el faraón llevó preso a Joacaz, y Jerónimo tomó Ribla por Antioquía. Robinson notó que Ribla no figura en las listas de sedes de la Iglesia primitiva. La llanura pasó a los reyes seléucidas y luego a la Siria romana, cuya ciudad principal cercana era Emesa, la actual Homs."
  pt:
    - "Ribla ficava na margem leste do Orontes, na aldeia de Rableh, no oeste da Síria, perto da fronteira libanesa, a cerca de 33 km a su-sudoeste de Homs. Ficava numa curva do rio, na ponta norte do vale entre o Líbano e o Anti-Líbano, onde se abre uma ampla e fértil planície. Edward Robinson, que acampou ali em 1852, escreveu que ninguém punha em dúvida sua identidade com a Ribla bíblica. Números nomeia uma Ribla na fronteira oriental da terra prometida; se é o mesmo lugar, é disputado."
    - "A planície em torno de Ribla fora havia muito tempo uma encruzilhada e um campo de batalha. Tell Nebi Mend, a antiga Cades, onde Ramessés II lutou contra os hititas no século XIII a.C., fica à vista, a cerca de 12 km ao norte. Água, grãos e forragem estavam à mão, e estradas levavam daqui ao norte, ao Eufrates, e ao sul, à Palestina e ao Egito, o que fazia do lugar um acampamento natural para grandes exércitos."
    - "Em 609 a.C. o faraó Neco marchou para o norte para ajudar o último rei assírio contra a Babilônia, como também registra a Crônica Babilônica; no caminho matou Josias em Megido. O filho de Josias, Jeoacaz, reinou apenas três meses antes que Neco “o colocou em correntes em Ribla, na terra de Hamate”; Neco pôs Eliaquim no trono como Jeoaquim e levou Jeoacaz ao Egito, onde morreu. Em 605 a.C. Nabucodonosor derrotou os egípcios em Carquemis e tomou toda a região de Hamate. Durante o cerco de Jerusalém ele próprio ficou em Ribla, e quando a cidade caiu, em 587 ou 586 a.C., Zedequias lhe foi trazido aqui: seus filhos foram mortos diante de seus olhos, ele foi cegado e levado à Babilônia. Nebuzaradã trouxe mais tarde a Ribla o sumo sacerdote Seraías e outros chefes de Judá, onde o rei os mandou matar."
    - "Depois disso Ribla desaparece da história. No século IV d.C., Eusébio conhecia Rebla apenas como o lugar na terra de Hamate onde o Faraó levou Jeoacaz, e Jerônimo tomou Ribla por Antioquia. Robinson notou que Ribla não aparece nas listas das antigas sedes episcopais. A planície passou aos reis selêucidas e depois à Síria romana, cuja principal cidade nas proximidades era Emesa, a atual Homs."
  de:
    - "Ribla lag am Ostufer des Orontes, beim Dorf Rableh in Westsyrien nahe der libanesischen Grenze, etwa 33 km südsüdwestlich von Homs. Es stand an einer Flussbiegung, am Nordende des Tals zwischen Libanon und Antilibanon, wo sich eine breite, fruchtbare Ebene öffnet. Edward Robinson, der 1852 dort lagerte, schrieb, niemand bezweifle seine Gleichheit mit dem biblischen Ribla. Die Numeri nennen ein Ribla an der Ostgrenze des verheißenen Landes; ob das derselbe Ort ist, ist umstritten."
    - "Die Ebene um Ribla war lange ein Kreuzungspunkt und Schlachtfeld. Tell Nebi Mend, das antike Kadesch, wo Ramses II. im 13. Jahrhundert v. Chr. gegen die Hethiter kämpfte, liegt etwa 12 km nördlich in Sichtweite. Wasser, Getreide und Futter waren zur Hand, und von hier führten Straßen nach Norden zum Euphrat und nach Süden nach Palästina und Ägypten, was den Ort zu einem natürlichen Lager für große Heere machte."
    - "Im Jahr 609 v. Chr. zog Pharao Necho nach Norden, um dem letzten assyrischen König gegen Babylon zu helfen, wie auch die Babylonische Chronik verzeichnet; unterwegs tötete er Josia bei Megiddo. Josias Sohn Joahas regierte nur drei Monate, bevor Necho „ihn ins Gefängnis zu Ribla im Lande Hamath“ legte; Necho setzte Eljakim als Jojakim auf den Thron und brachte Joahas nach Ägypten, wo er starb. Im Jahr 605 v. Chr. schlug Nebukadnezar die Ägypter bei Karkemisch und nahm das ganze Gebiet von Hamat. Während der Belagerung Jerusalems hielt er selbst sich in Ribla auf, und als die Stadt 587 oder 586 v. Chr. fiel, wurde Zedekia hier vor ihn gebracht: Seine Söhne wurden vor seinen Augen getötet, er wurde geblendet und nach Babylon gebracht. Nebusaradan brachte später den Oberpriester Seraja und andere Führer Judas nach Ribla, wo der König sie hinrichten ließ."
    - "Danach verschwindet Ribla aus der Geschichte. Im 4. Jahrhundert n. Chr. kannte Eusebius Rebla nur als den Ort im Land Hamat, wohin Pharao Joahas führte, und Hieronymus hielt Ribla für Antiochia. Robinson bemerkte, dass Ribla in den Listen früher Bischofssitze nicht vorkommt. Die Ebene fiel an die Seleukidenkönige und dann an das römische Syrien, dessen Hauptstadt in der Nähe Emesa war, das heutige Homs."
  fr:
    - "Ribla se trouvait sur la rive orientale de l’Oronte, au village de Rableh, dans l’ouest de la Syrie près de la frontière libanaise, à environ 33 km au sud-sud-ouest de Homs. Elle s’élevait à un coude du fleuve, à l’extrémité nord de la vallée entre le Liban et l’Anti-Liban, où s’ouvre une large et fertile plaine. Edward Robinson, qui y campa en 1852, écrivit que nul ne contestait son identité avec la Ribla biblique. Les Nombres nomment une Ribla sur la frontière orientale de la terre promise ; est-ce le même lieu, c’est disputé."
    - "La plaine autour de Ribla fut longtemps un carrefour et un champ de bataille. Tell Nebi Mend, l’antique Qadesh, où Ramsès II combattit les Hittites au XIIIe siècle av. J.-C., est en vue à environ 12 km au nord. Eau, grain et fourrage étaient à portée, et des routes menaient d’ici au nord vers l’Euphrate et au sud vers la Palestine et l’Égypte, ce qui faisait du lieu un camp naturel pour de grandes armées."
    - "En 609 av. J.-C., le pharaon Néco marcha vers le nord pour aider le dernier roi assyrien contre Babylone, comme le consigne aussi la Chronique babylonienne ; en chemin il tua Josias à Meguiddo. Le fils de Josias, Joachaz, ne régna que trois mois : Pharaon Néco « l’enchaîna à Ribla, dans le pays de Hamath » ; Néco établit Éliakim roi sous le nom de Jojakim et emmena Joachaz en Égypte, où il mourut. En 605 av. J.-C., Nebucadnetsar écrasa les Égyptiens à Carkemisch et prit toute la région de Hamath. Pendant le siège de Jérusalem, il resta lui-même à Ribla, et quand la ville tomba en 587 ou 586 av. J.-C., Sédécias lui fut amené ici : ses fils furent tués sous ses yeux, il fut aveuglé et emmené à Babylone. Nebuzaradan amena plus tard à Ribla le grand prêtre Seraja et d’autres chefs de Juda, que le roi fit mettre à mort."
    - "Après cela, Ribla disparaît de l’histoire. Au IVe siècle apr. J.-C., Eusèbe ne connaissait Rebla que comme le lieu du pays de Hamath où Pharaon emmena Joachaz, et Jérôme prit Ribla pour Antioche. Robinson nota que Ribla ne figure pas dans les listes des sièges ecclésiastiques anciens. La plaine passa aux rois séleucides puis à la Syrie romaine, dont la principale ville voisine était Émèse, l’actuelle Homs."
  it:
    - "Ribla sorgeva sulla riva orientale dell’Oronte, al villaggio di Rableh nella Siria occidentale presso il confine libanese, circa 33 km a sud-sud-ovest di Homs. Si trovava in un’ansa del fiume, all’estremità settentrionale della valle tra il Libano e l’Antilibano, dove si apre un’ampia e fertile pianura. Edward Robinson, che vi si accampò nel 1852, scrisse che nessuno metteva in dubbio la sua identità con la Ribla biblica. I Numeri nominano una Ribla sul confine orientale della terra promessa; se sia lo stesso luogo è controverso."
    - "La pianura attorno a Ribla era da tempo un crocevia e un campo di battaglia. Tell Nebi Mend, l’antica Kades, dove Ramses II combatté gli Ittiti nel XIII secolo a.C., è in vista circa 12 km a nord. Acqua, grano e foraggio erano a portata di mano, e le strade portavano da qui a nord verso l’Eufrate e a sud verso la Palestina e l’Egitto, il che faceva del luogo un naturale accampamento per grandi eserciti."
    - "Nel 609 a.C. il faraone Necao marciò a nord per aiutare l’ultimo re assiro contro Babilonia, come registra anche la Cronaca babilonese; lungo la strada uccise Giosia a Meghiddo. Il figlio di Giosia, Ioacaz, regnò solo tre mesi prima che Necao «lo mise in catene a Ribla, nel paese di Hamath»; Necao mise sul trono Eliakim come Ioiakim e portò Ioacaz in Egitto, dove morì. Nel 605 a.C. Nabucodonosor sbaragliò gli Egiziani a Carchemis e prese l’intera regione di Camat. Durante l’assedio di Gerusalemme egli stesso rimase a Ribla, e quando la città cadde nel 587 o 586 a.C. Sedecia gli fu portato qui: i suoi figli furono uccisi sotto i suoi occhi, egli fu accecato e portato a Babilonia. Nebuzaradan portò poi a Ribla il sommo sacerdote Seraia e altri capi di Giuda, dove il re li fece mettere a morte."
    - "Dopo questo Ribla scompare dalla storia. Nel IV secolo d.C. Eusebio conosceva Rebla solo come il luogo nella terra di Camat dove il faraone condusse via Ioacaz, e Girolamo prese Ribla per Antiochia. Robinson notò che Ribla non compare negli elenchi delle antiche sedi vescovili. La pianura passò ai re seleucidi e poi alla Siria romana, la cui città principale nelle vicinanze era Emesa, l’odierna Homs."
  pl:
    - "Ribla leżała na wschodnim brzegu Orontesu, we wsi Rableh w zachodniej Syrii, blisko granicy libańskiej, około 33 km na południe-południowy zachód od Hims. Stała na zakolu rzeki, na północnym końcu doliny między Libanem a Antylibanem, gdzie otwiera się szeroka i żyzna równina. Edward Robinson, który obozował tam w 1852 roku, napisał, że nikt nie kwestionował jej tożsamości z biblijną Riblą. Księga Liczb wymienia Riblę na wschodniej granicy ziemi obiecanej; czy jest to to samo miejsce, jest sporne."
    - "Równina wokół Ribli od dawna była skrzyżowaniem dróg i polem bitew. Tell Nebi Mend, starożytne Kadesz, gdzie Ramzes II walczył z Hetytami w XIII wieku p.n.e., leży w zasięgu wzroku około 12 km na północ. Woda, zboże i pasza były pod ręką, a drogi prowadziły stąd na północ do Eufratu i na południe do Palestyny i Egiptu, co czyniło to miejsce naturalnym obozem wielkich armii."
    - "W 609 roku p.n.e. faraon Neko pomaszerował na północ, by pomóc ostatniemu królowi asyryjskiemu przeciw Babilonowi, co odnotowuje też Kronika babilońska; po drodze zabił Jozjasza pod Megiddo. Syn Jozjasza, Joachaz, panował tylko trzy miesiące: „I związał go Farao Necho w Rebli w ziemi Emat”; Neko osadził na tronie Eliakima jako Jojakima, a Joachaza zabrał do Egiptu, gdzie umarł. W 605 roku p.n.e. Nabuchodonozor rozgromił Egipcjan pod Karkemisz i zajął cały region Chamat. Podczas oblężenia Jerozolimy sam przebywał w Ribli, a gdy miasto padło w 587 lub 586 roku p.n.e., przyprowadzono do niego tutaj Sedekiasza: jego synów zabito na jego oczach, oślepiono go i zabrano do Babilonu. Nebuzaradan przywiódł później do Ribli arcykapłana Serajasza i innych przywódców Judy, gdzie król kazał ich stracić."
    - "Potem Ribla znika z historii. W IV wieku n.e. Euzebiusz znał Reblę tylko jako miejsce w ziemi Chamat, dokąd faraon uprowadził Joachaza, a Hieronim wziął Riblę za Antiochię. Robinson zauważył, że Ribla nie występuje na listach wczesnochrześcijańskich stolic biskupich. Równina przeszła do królów seleucydzkich, a potem do rzymskiej Syrii, której głównym miastem w pobliżu była Emesa, dzisiejszy Hims."
  cs:
    - "Ribla ležela na východním břehu Orontu, u vesnice Rabla v západní Sýrii poblíž libanonské hranice, asi 33 km jihojihozápadně od Homsu. Stála na ohybu řeky, na severním konci údolí mezi Libanonem a Antilibanonem, kde se otevírá široká úrodná rovina. Edward Robinson, který tam roku 1852 tábořil, napsal, že nikdo nepochybuje o její totožnosti s biblickou Riblou. Numeri jmenuje Riblu na východní hranici zaslíbené země; zda je to totéž místo, je sporné."
    - "Rovina kolem Ribly byla dávno křižovatkou a bojištěm. Tell Nabí Mind, starověký Kádeš, kde Ramesse II. bojoval s Chetity ve 13. století př. n. l., je na dohled asi 12 km na sever. Voda, obilí a pastva byly po ruce a cesty vedly odtud na sever k Eufratu a na jih do Palestiny a Egypta, což z místa činilo přirozený tábor velkých vojsk."
    - "Roku 609 př. n. l. táhl faraon Nékó na sever na pomoc poslednímu asyrskému králi proti Babylónu, jak zaznamenává i babylónská kronika; cestou zabil Jošijáše u Megida. Jošijášův syn Joachaz kraloval jen tři měsíce a pak „svázal ho Farao Nécho v Ribla, v zemi Emat“; Nékó dosadil na trůn Eliakima jako Jójakima a Joachaza odvedl do Egypta, kde zemřel. Roku 605 př. n. l. Nebukadnesar rozprášil Egypťany u Karkemíše a zmocnil se celé oblasti Chamatu. Během obléhání Jeruzaléma sám pobýval v Ribla a když město padlo roku 587 nebo 586 př. n. l., byl sem k němu přiveden Sidkijáš: jeho synové byli zabiti před jeho očima, byl oslepen a odveden do Babylóna. Nebuzaradan později přivedl do Ribly velekněze Serajáše a další vůdce Judy, kde je král dal popravit."
    - "Potom Ribla z dějin mizí. Ve 4. století n. l. znal Eusebius Reblu jen jako místo v zemi Chamat, kam Farao odvedl Joachaza, a Jeroným pokládal Riblu za Antiochii. Robinson poznamenal, že Ribla se neobjevuje v seznamech raných církevních sídel. Rovina připadla seleukovským králům a pak římské Sýrii, jejímž hlavním městem v blízkosti byla Emesa, dnešní Homs."
  nl:
    - "Ribla lag aan de oostoever van de Orontes, bij het dorp Rableh in West-Syrië nabij de Libanese grens, ongeveer 33 km zuidzuidwest van Homs. Het lag op een bocht van de rivier, aan het noordeinde van de vallei tussen de Libanon en de Anti-Libanon, waar een brede, vruchtbare vlakte opengaat. Edward Robinson, die er in 1852 kampeerde, schreef dat niemand de identiteit met het bijbelse Ribla betwijfelde. Numeri noemt een Ribla aan de oostgrens van het beloofde land; of dat dezelfde plaats is, is omstreden."
    - "De vlakte rond Ribla was lang een kruispunt en een slagveld. Tell Nebi Mend, het oude Kades, waar Ramses II in de 13e eeuw v.Chr. tegen de Hettieten vocht, ligt binnen zicht zo’n 12 km naar het noorden. Water, graan en voer waren bij de hand, en wegen leidden van hier naar het noorden tot de Eufraat en naar het zuiden naar Palestina en Egypte, wat de plaats een natuurlijk kamp voor grote legers maakte."
    - "In 609 v.Chr. trok farao Necho naar het noorden om de laatste Assyrische koning tegen Babylon te helpen, zoals ook de Babylonische Kroniek meldt; onderweg doodde hij Josia bij Megiddo. Josia’s zoon Joachaz regeerde slechts drie maanden; toen, zegt Koningen, “Farao Necho liet hem binden te Ribla in het land van Hamath”; Necho zette Eljakim als Jojakim op de troon en nam Joachaz mee naar Egypte, waar hij stierf. In 605 v.Chr. versloeg Nebukadnessar de Egyptenaren bij Karkemis en nam het hele gebied van Hamat in. Tijdens het beleg van Jeruzalem verbleef hij zelf te Ribla, en toen de stad in 587 of 586 v.Chr. viel, werd Zedekia hier bij hem gebracht: zijn zonen werden voor zijn ogen gedood, hij werd verblind en naar Babylon gevoerd. Nebuzaradan bracht later de hogepriester Seraja en andere leiders van Juda naar Ribla, waar de koning hen ter dood liet brengen."
    - "Hierna verdwijnt Ribla uit de geschiedenis. In de 4e eeuw n.Chr. kende Eusebius Rebla alleen als de plaats in het land van Hamat waar farao Joachaz wegvoerde, en Hieronymus hield Ribla voor Antiochië. Robinson merkte op dat Ribla niet voorkomt in de lijsten van vroegchristelijke bisschopszetels. De vlakte ging over op de Seleucidische koningen en daarna op Romeins Syrië, wier hoofdstad in de buurt Emesa was, het moderne Homs."
  sv:
    - "Rivla låg på Orontes östra strand, vid byn Rableh i västra Syrien nära den libanesiska gränsen, cirka 33 km sydsydväst om Homs. Det låg vid en krök av floden, vid norra änden av dalen mellan Libanon och Antilibanon, där en bred och bördig slätt öppnar sig. Edward Robinson, som slog läger där 1852, skrev att ingen betvivlade dess identitet med bibliska Rivla. Fjärde Mosebok nämner ett Rivla på det utlovade landets östra gräns; om det är samma plats är omstritt."
    - "Slätten kring Rivla hade länge varit en korsning och ett slagfält. Tell Nebi Mend, forntida Kadesh, där Ramses II stred mot hettiterna på 1200-talet f.Kr., ligger inom synhåll cirka 12 km norrut. Vatten, spannmål och foder fanns till hands, och vägar ledde härifrån norrut till Eufrat och söderut till Palestina och Egypten, vilket gjorde platsen till ett naturligt läger för stora arméer."
    - "År 609 f.Kr. marscherade farao Neko norrut för att hjälpa den siste assyriske kungen mot Babylon, vilket också Babyloniska krönikan berättar; på vägen dödade han Josia vid Megiddo. Josias son Joachas regerade bara tre månader innan Neko ”lät sätta honom i fängelse i Ribla i Hamats land”; Neko satte Eljakim på tronen som Jojakim och tog Joachas till Egypten, där han dog. År 605 f.Kr. slog Nebukadnessar egyptierna vid Karkemish och intog hela Hamats område. Under belägringen av Jerusalem stannade han själv i Rivla, och när staden föll 587 eller 586 f.Kr. fördes Sidkia till honom här: hans söner dödades inför hans ögon, han blindades och fördes till Babylon. Nebusaradan förde senare översteprästen Seraja och andra ledare i Juda till Rivla, där kungen lät avrätta dem."
    - "Efter detta försvinner Rivla ur historien. På 300-talet e.Kr. kände Eusebios Rebla bara som platsen i Hamats land dit farao förde bort Joachas, och Hieronymus tog Rivla för Antiochia. Robinson noterade att Rivla inte förekommer i de tidiga kyrkliga biskopssätenas förteckningar. Slätten övergick till de seleukidiska kungarna och sedan till romerska Syrien, vars huvudstad i närheten var Emesa, nuvarande Homs."
  nb:
    - "Ribla lå på østbredden av Orontes, ved landsbyen Rableh i det vestlige Syria nær den libanesiske grensen, omtrent 33 km sør-sørvest for Homs. Det lå i en sving av elven, i den nordlige enden av dalen mellom Libanon og Anti-Libanon, der en bred og fruktbar slette åpner seg. Edward Robinson, som slo leir der i 1852, skrev at ingen stilte spørsmål ved at det var det samme som bibelske Ribla. 4. Mosebok nevner en Ribla på østgrensen av det lovede land; om det er det samme stedet, er omstridt."
    - "Sletten rundt Ribla hadde lenge vært et veiskille og en slagmark. Tell Nebi Mend, det gamle Kadesj, der Ramses II kjempet mot hettittene på 1200-tallet f.Kr., ligger innen synsvidde omtrent 12 km mot nord. Vann, korn og for var for hånden, og veier førte herfra nordover til Eufrat og sørover til Palestina og Egypt, noe som gjorde stedet til en naturlig leir for store hærer."
    - "I 609 f.Kr. marsjerte farao Neko nordover for å hjelpe den siste assyriske kongen mot Babylon, slik den babylonske kronikken også forteller; på veien drepte han Josjia ved Megiddo. Josjias sønn Joahas regjerte bare tre måneder før Neko «la ham i lenker i Ribla i Hamat-landet»; Neko satte Eljakim på tronen som Jojakim og tok Joahas med til Egypt, der han døde. I 605 f.Kr. slo Nebukadnesar egypterne ved Karkemisj og tok hele Hamat-området. Under beleiringen av Jerusalem oppholdt han seg selv i Ribla, og da byen falt i 587 eller 586 f.Kr., ble Sidkia ført til ham her: sønnene hans ble drept for øynene på ham, han ble blindet og ført til Babylon. Nebusaradan brakte senere ypperstepresten Seraja og andre ledere i Juda til Ribla, der kongen lot dem henrette."
    - "Etter dette forsvinner Ribla fra historien. På 300-tallet e.Kr. kjente Eusebius Rebla bare som stedet i Hamat-landet der farao førte Joahas bort, og Hieronymus tok Ribla for Antiokia. Robinson bemerket at Ribla ikke står i listene over de tidlige kirkesetene. Sletten gikk til de seleukidiske kongene og så til romersk Syria, hvis hovedby i nærheten var Emesa, dagens Homs."
  tl:
    - "Ang Ribla ay nasa silangang pampang ng Orontes, sa nayon ng Rableh sa kanlurang Siria malapit sa hangganan ng Libano, mga 33 km sa timog-timog-kanluran ng Homs. Nakatayo ito sa liko ng ilog, sa hilagang dulo ng libis sa pagitan ng Libano at Anti-Libano, kung saan bumubukas ang malawak at matabang kapatagan. Isinulat ni Edward Robinson, na nagkampo roon noong 1852, na walang nagtatanong sa pagkakakilanlan nito sa Ribla ng Bibliya. Pinangalanan ng Mga Bilang ang isang Ribla sa silangang hangganan ng lupang pangako; pinagtatalunan kung iisang lugar ito."
    - "Matagal nang sangandaan at larangan ng digmaan ang kapatagan sa palibot ng Ribla. Ang Tell Nebi Mend, ang sinaunang Cades, kung saan nakipaglaban si Ramesses II sa mga Hetheo noong ika-13 siglo BK, ay tanaw sa mga 12 km sa hilaga. Malapit ang tubig, butil at pagkain ng hayop, at may mga daang patungo mula rito sa hilaga hanggang sa Eufrates at sa timog hanggang sa Palestina at Egipto, na ginawa itong likas na kampo para sa malalaking hukbo."
    - "Noong 609 BK, nagmartsa pahilaga si Faraon Neco para tulungan ang huling haring Asiryo laban sa Babilonia, gaya rin ng Kronikang Babilonio; pinatay niya si Josias sa Megiddo sa daan. Tatlong buwan lamang naghari ang anak ni Josias na si Joachaz bago “inilagay ni Faraon-nechao siya sa pangawan sa Ribla, sa lupain ng Hamath”; ginawa ni Neco si Eliacim na Joacim sa trono at dinala si Joachaz sa Egipto, na doon namatay. Noong 605 BK, dinurog ni Nabucodonosor ang mga Egipcio sa Carchemis at kinuha ang buong Hamath. Sa pagkubkob sa Jerusalem, nanatili siya sa Ribla, at nang bumagsak ang lungsod noong 587 o 586 BK, dinala rito sa kaniya si Sedecias: pinatay ang mga anak niya sa harap niya, binulag siya at dinala sa Babilonia. Kalaunan, dinala ni Nabuzaradan sa Ribla ang pinakapunong saserdoteng si Seraias at iba pang pinuno ng Juda, na ipinapatay ng hari."
    - "Pagkatapos nito, naglalaho ang Ribla sa kasaysayan. Noong ika-4 na siglo AD, kilala ni Eusebio ang Rebla bilang lugar lamang sa lupain ng Hamath kung saan dinala ni Faraon si Joachaz, at inakala ni Jerome na ang Ribla ay Antioquia. Napansin ni Robinson na hindi lumilitaw ang Ribla sa mga listahan ng mga sinaunang luklukan ng iglesia. Napunta ang kapatagan sa mga haring Seleucida at pagkatapos sa Romanong Siria, na ang pangunahing lungsod sa malapit ay ang Emesa, ang makabagong Homs."
  da:
    - "Ribla lå på Orontes' østbred, ved landsbyen Rableh i det vestlige Syrien nær den libanesiske grænse, omkring 33 km syd-sydvest for Homs. Den lå ved et sving af floden, ved den nordlige ende af dalen mellem Libanon og Anti-Libanon, hvor en bred og frugtbar slette åbner sig. Edward Robinson, der slog lejr dér i 1852, skrev, at ingen betvivlede dens identitet med Bibelens Ribla. 4. Mosebog nævner en Ribla på det forjættede lands østgrænse; om det er det samme sted, er omstridt."
    - "Sletten omkring Ribla havde længe været et vejkryds og en slagmark. Tell Nebi Mend, det gamle Kadesj, hvor Ramses 2. kæmpede mod hittitterne i 1200-tallet f.Kr., ligger inden for synsvidde omkring 12 km mod nord. Vand, korn og foder var ved hånden, og veje førte herfra nordpå til Eufrat og sydpå til Palæstina og Egypten, hvilket gjorde stedet til en naturlig lejr for store hære."
    - "I 609 f.Kr. marcherede farao Neko nordpå for at hjælpe den sidste assyriske konge mod Babylon, som Den babylonske krønike også optegner; på vejen dræbte han Josias i Megiddo. Josias' søn Joakaz regerede kun tre måneder, før Neko »lod ham lægge i Lænker i Ribla udi Hamaths Land«; Neko satte Eljakim på tronen som Jojakim og tog Joakaz med til Egypten, hvor han døde. I 605 f.Kr. slog Nebukadnezar egypterne ved Karkemisj og tog hele Hamats egn. Under belejringen af Jerusalem opholdt han sig selv i Ribla, og da byen faldt i 587 eller 586 f.Kr., blev Zedekias bragt til ham her: hans sønner blev dræbt for hans øjne, han blev blindet og ført til Babylon. Nebuzaradan bragte senere ypperstepræsten Seraja og andre ledere af Juda til Ribla, hvor kongen lod dem dræbe."
    - "Herefter forsvinder Ribla fra historien. I 300-tallet e.Kr. kendte Eusebios Rebla kun som stedet i Hamats land, hvor farao førte Joakaz bort, og Hieronymus tog Ribla for Antiokia. Robinson bemærkede, at Ribla ikke optræder i listerne over tidlige kirkelige bispesæder. Sletten gik til de seleukidiske konger og derefter til det romerske Syrien, hvis hovedby i nærheden var Emesa, nutidens Homs."
  sr:
    - "Ривла је лежала на источној обали Оронта, у селу Раблех у западној Сирији близу границе с Либаном, око 33 км јужно-југозападно од Хомса. Стајала је на окуци реке, на северном крају долине између Ливана и Антиливана, где се отвара широка плодна равница. Едвард Робинсон, који је ту логоровао 1852, писао је да нико не доводи у питање њено поистовећење са библијском Ривлом. Књига бројева именује Ривлу на источној граници обећане земље; да ли је то исто место, спорно је."
    - "Равница око Ривле одавно је била раскршће и бојиште. Тел Неби Менд, древни Кадис, где се Рамзес II борио с Хетитима у 13. веку п. н. е., у видокругу је око 12 км северно. Вода, жито и сточна храна били су при руци, а путеви су одавде водили на север до Еуфрата и на југ у Палестину и Египат, што је место чинило природним логором великих војски."
    - "Године 609. п. н. е. фараон Нехо кренуо је на север да помогне последњем асирском краљу против Вавилона, како бележи и Вавилонска хроника; успут је убио Јосију код Мегида. Јосијин син Јоахаз владао је само три месеца пре него што га је Нехо „свеза … у Ривли, у земљи ематској“; Нехо је поставио Елијакима на престо као Јоакима, а Јоахаза одвео у Египат, где је умро. Године 605. п. н. е. Навуходоносор је разбио Египћане код Хархемиса и узео целу област Емата. За време опсаде Јерусалима сам је боравио у Ривли, а кад је град пао 587. или 586. п. н. е., Седекија је овамо доведен к њему: синови су му побијени пред очима, ослепљен је и одведен у Вавилон. Невузардан је касније довео првосвештеника Сераја и друге вође Јуде у Ривлу, где их је цар погубио."
    - "После тога Ривла нестаје из историје. У 4. веку н. е. Јевсевије је знао Ревлу само као место у земљи ематској где је фараон одвео Јоахаза, а Јероним је Ривлу узео за Антиохију. Робинсон је приметио да се Ривла не јавља на списковима раних црквених седишта. Равница је прешла селеукидским царевима, а потом римској Сирији, чији је главни град у близини била Емеса, данашњи Хомс."
  hu:
    - "Ribla az Orontész keleti partján feküdt, Rableh falunál Nyugat-Szíriában, a libanoni határ közelében, Homsztól mintegy 33 km-re dél-délnyugatra. A folyó egyik kanyarulatában állt, a Libanon és az Antilibanon közötti völgy északi végén, ahol széles, termékeny síkság nyílik. Edward Robinson, aki 1852-ben ott táborozott, azt írta, hogy senki sem kérdőjelezte meg azonosságát a bibliai Riblával. A 4Móz említ egy Riblát az ígéret földjének keleti határán; hogy az ugyanaz a hely, vitatott."
    - "A Ribla körüli síkság régóta keresztút és csatatér volt. A Tell Nebi Mend, az ókori Kádes, ahol II. Ramszesz a Kr. e. 13. században a hettitákkal harcolt, látótávolságban van mintegy 12 km-re északra. Víz, gabona és takarmány volt kéznél, és innen utak vezettek északra az Eufráteszhez és délre Palesztinába és Egyiptomba, ami a helyet nagy seregek természetes táborhelyévé tette."
    - "Kr. e. 609-ben Nekó fáraó észak felé vonult, hogy segítse az utolsó asszír királyt Babilon ellen, ahogyan a Babiloni krónika is feljegyzi; útközben Megiddónál megölte Jósiást. Jósiás fia, Jóáház csak három hónapig uralkodott, mielőtt Nekó „bilincsekbe verte őt Riblában, Hámát földjén”; Nekó Eljákimot ültette a trónra Jójákim néven, Jóáházt pedig Egyiptomba vitte, ahol meghalt. Kr. e. 605-ben Nabukodonozor Karkemisnél szétverte az egyiptomiakat, és elfoglalta Hamát egész vidékét. Jeruzsálem ostroma alatt maga Riblában maradt, és amikor a város Kr. e. 587 vagy 586-ban elesett, Sedékiást hozták elé ide: fiait szeme láttára megölték, őt megvakították és Babilonba vitték. Nebuzaradán később Szerája főpapot és Júda más vezetőit Riblába hozta, ahol a király kivégeztette őket."
    - "Ezután Ribla eltűnik a történelemből. A Kr. u. 4. században Euszebiosz Reblát csak mint Hamát földjén lévő helyet ismerte, ahová a fáraó Jóáházt elvitte, Jeromos pedig Riblát Antiókhiának vette. Robinson megjegyezte, hogy Ribla nem szerepel a korai egyházi püspöki székhelyek jegyzékében. A síkság a szeleukida királyokhoz, majd Róma Szíria provinciájához került, amelynek fő városa a közelben Emesza, a mai Homsz volt."
  fi:
    - "Ribla sijaitsi Orontesin itärannalla Rablehin kylässä Länsi-Syyriassa Libanonin rajan lähellä, noin 33 km Homsista etelä-lounaaseen. Se seisoi joen mutkassa Libanonin ja Anti-Libanonin välisen laakson pohjoispäässä, missä aukeaa leveä ja hedelmällinen tasanko. Edward Robinson, joka leiriytyi sinne 1852, kirjoitti, ettei kukaan kyseenalaistanut sen samuutta Raamatun Riblan kanssa. 4. Mooseksen kirja mainitsee Riblan luvatun maan itärajalla; onko se sama paikka, on kiistanalaista."
    - "Riblan ympärillä oleva tasanko oli pitkään ollut risteyskohta ja taistelukenttä. Tell Nebi Mend, muinainen Kades, jossa Ramses II taisteli heettiläisiä vastaan 1200-luvulla eaa., on näköetäisyydellä noin 12 km pohjoiseen. Vettä, viljaa ja rehua oli käsillä, ja tiet johtivat täältä pohjoiseen Eufratille ja etelään Palestiinaan ja Egyptiin, mikä teki paikasta luontaisen suurten armeijoiden leirin."
    - "Vuonna 609 eaa. farao Neko marssi pohjoiseen auttamaan Assyrian viimeistä kuningasta Babylonia vastaan, kuten Babylonialainen kronikka myös kertoo; matkalla hän surmasi Josian Megiddossa. Josian poika Joahas hallitsi vain kolme kuukautta, ennen kuin Neko ”vangitutti hänet Riblassa, Hamatin maassa”; Neko asetti valtaistuimelle Eljakimin Jojakimina ja vei Joahaan Egyptiin, missä tämä kuoli. Vuonna 605 eaa. Nebukadnessar löi egyptiläiset Karkemisissa ja otti koko Hamatin seudun. Jerusalemin piirityksen aikana hän itse oleskeli Riblassa, ja kun kaupunki kaatui 587 tai 586 eaa., Sidkia tuotiin hänen eteensä tänne: hänen poikansa tapettiin hänen silmiensä edessä, hänet sokaistiin ja vietiin Babyloniin. Nebusaradan toi myöhemmin ylimmäisen papin Serajan ja muita Juudan johtajia Riblaan, missä kuningas antoi surmata heidät."
    - "Tämän jälkeen Ribla katoaa historiasta. 300-luvulla jaa. Eusebios tunsi Rebla-nimisen paikan vain siellä, missä Hamatin maassa farao vei Joahaan pois, ja Hieronymus piti Riblaa Antiokiana. Robinson huomautti, ettei Ribla esiinny varhaisten kirkon piispanistuinten luetteloissa. Tasanko siirtyi seleukidikuninkaille ja sitten Rooman Syyrialle, jonka päälähikaupunki oli Emesa, nykyinen Homs."
  vi:
    - "Ríp-la nằm ở bờ đông sông Orontes, tại làng Rableh ở tây Sy-ri gần biên giới Li-ban, cách Homs khoảng 33 km về phía nam tây nam. Nó đứng ở một khúc quanh của sông, ở đầu bắc của thung lũng giữa Li-ban và Anti-Li-ban, nơi mở ra một đồng bằng rộng và phì nhiêu. Edward Robinson, người cắm trại ở đó năm 1852, viết rằng không ai nghi ngờ sự đồng nhất của nó với Ríp-la trong Kinh Thánh. Sách Dân Số Ký nêu một Ríp-la ở biên giới phía đông của đất hứa; đó có phải cùng một nơi hay không còn tranh luận."
    - "Đồng bằng quanh Ríp-la từ lâu là ngã tư và chiến trường. Tell Nebi Mend, Ca-đe cổ, nơi Ramesses II giao chiến với người Hittite vào thế kỷ 13 TCN, nằm trong tầm mắt cách khoảng 12 km về phía bắc. Nước, lúa và cỏ có sẵn, và các con đường từ đây dẫn lên bắc đến sông Ơ-phơ-rát và xuống nam đến Palestine và Ai Cập, khiến nơi này thành nơi đóng quân tự nhiên của các đạo quân lớn."
    - "Năm 609 TCN, Pha-ra-ôn Nê-cô hành quân lên bắc giúp vua A-si-ri cuối cùng chống Ba-by-lôn, như Biên niên sử Ba-by-lôn cũng ghi; trên đường đi, ông giết Giô-si-a tại Mê-ghi-đô. Con của Giô-si-a là Giô-a-cha chỉ trị vì ba tháng trước khi Nê-cô “bắt giam người tại Ríp-la, trong xứ Ha-mát”; Nê-cô đặt Ê-li-a-kim lên ngai với tên Giê-hô-gia-kim và đem Giô-a-cha sang Ai Cập, nơi ông qua đời. Năm 605 TCN, Nê-bu-cát-nết-sa đánh tan người Ai Cập tại Cạt-kê-mít và chiếm cả vùng Ha-mát. Trong cuộc vây hãm Giê-ru-sa-lem, chính ông ở tại Ríp-la, và khi thành thất thủ năm 587 hoặc 586 TCN, Sê-đê-kia được đưa đến ông tại đây: các con trai ông bị giết trước mắt, ông bị làm mù và đưa sang Ba-by-lôn. Nê-bu-xa-ra-đan về sau đem thầy tế lễ thượng phẩm Sê-ra-gia và các lãnh đạo khác của Giu-đa đến Ríp-la, nơi nhà vua cho xử tử họ."
    - "Sau đó Ríp-la biến mất khỏi lịch sử. Vào thế kỷ 4, Eusebius chỉ biết Rebla như nơi trong xứ Ha-mát mà Pha-ra-ôn dẫn Giô-a-cha đi, và Jerome coi Ríp-la là An-ti-ốt. Robinson ghi nhận rằng Ríp-la không xuất hiện trong danh sách các tòa giám mục thời đầu. Đồng bằng chuyển sang các vua Seleucus rồi Sy-ri thuộc La Mã, có thành chính gần đó là Emesa, Homs ngày nay."
  ro:
    - "Ribla se afla pe malul estic al Orontelui, la satul Rableh din vestul Siriei, lângă granița libaneză, la circa 33 km sud-sud-vest de Homs. Stătea la o cotitură a râului, la capătul nordic al văii dintre Liban și Antiliban, unde se deschide o câmpie largă și fertilă. Edward Robinson, care a tăbărât acolo în 1852, a scris că nimeni nu pune la îndoială identitatea ei cu Ribla biblică. Numeri numește o Ribla la hotarul estic al țării făgăduite; dacă este același loc este disputat."
    - "Câmpia din jurul Riblei fusese de mult o răscruce și un câmp de bătălie. Tell Nebi Mend, vechiul Cades, unde Ramses al II-lea s-a luptat cu hitiții în secolul al XIII-lea î.Hr., se află în vedere, la circa 12 km spre nord. Apă, grâne și furaje erau la îndemână, iar drumuri duceau de aici spre nord la Eufrat și spre sud în Palestina și Egipt, ceea ce făcea din loc o tabără firească pentru marile armate."
    - "În 609 î.Hr., faraonul Necho a mers spre nord ca să ajute ultimul rege asirian împotriva Babilonului, după cum consemnează și Cronica babiloniană; pe drum l-a ucis pe Iosia la Meghido. Fiul lui Iosia, Ioahaz, a domnit doar trei luni înainte ca Necho să-l pună în lanțuri la Ribla, în țara Hamatului; Necho l-a așezat pe tron pe Eliachim ca Ioiachim și l-a dus pe Ioahaz în Egipt, unde a murit. În 605 î.Hr., Nebucadnețar i-a zdrobit pe egipteni la Carchemiș și a luat toată regiunea Hamatului. În timpul asediului Ierusalimului a stat el însuși la Ribla, iar când cetatea a căzut, în 587 sau 586 î.Hr., Zedechia i-a fost adus aici: fiii lui au fost uciși sub ochii lui, el a fost orbit și dus la Babilon. Nebuzaradan a adus mai târziu la Ribla pe marele preot Seraia și pe alți conducători ai Iudei, unde regele i-a pus la moarte."
    - "După aceasta, Ribla dispare din istorie. În secolul al IV-lea d.Hr., Eusebiu cunoștea Rebla doar ca locul din țara Hamatului unde faraonul l-a dus pe Ioahaz, iar Ieronim a luat Ribla drept Antiohia. Robinson a notat că Ribla nu apare în listele vechilor scaune bisericești. Câmpia a trecut la regii seleucizi și apoi la Siria romană, al cărei oraș principal din apropiere era Emesa, actualul Homs."
  bg:
    - "Ривла се намирала на източния бряг на Оронт, при селото Рабле в Западна Сирия близо до ливанската граница, на около 33 км юг-югозападно от Хомс. Тя стояла на завой на реката, в северния край на долината между Ливан и Антиливан, където се открива широка и плодородна равнина. Едуард Робинсън, който лагерувал там през 1852 г., писал, че никой не оспорва тъждеството ѝ с библейската Ривла. Числа назовава една Ривла на източната граница на обещаната земя; дали това е същото място, е спорно."
    - "Равнината около Ривла отдавна била кръстопът и бойно поле. Тел Неби Менд, древният Кадеш, където Рамзес II воювал с хетите през XIII в. пр.н.е., се вижда на около 12 км на север. Вода, зърно и фураж били под ръка, а пътищата водели оттук на север към Ефрат и на юг към Палестина и Египет, което правело мястото естествен лагер за големи армии."
    - "През 609 г. пр.н.е. фараон Нехао тръгнал на север, за да помогне на последния асирийски цар срещу Вавилон, както записва и Вавилонската хроника; по пътя убил Йосия при Мегидо. Синът на Йосия, Йоахаз, царувал само три месеца, преди Нехао да го „затвори … в Ривла в земята Емат“; Нехао поставил на престола Елиаким като Йоаким и отвел Йоахаз в Египет, където той умрял. През 605 г. пр.н.е. Навуходоносор разбил египтяните при Кархемис и завладял цялата област Емат. По време на обсадата на Йерусалим самият той стоял в Ривла и когато градът паднал през 587 или 586 г. пр.н.е., Седекия бил доведен при него тук: синовете му били убити пред очите му, а той бил ослепен и отведен във Вавилон. По-късно Навузардан довел в Ривла първосвещеника Сераия и други водачи на Юда, където царят наредил да бъдат убити."
    - "След това Ривла изчезва от историята. През IV в. н.е. Евсевий познавал Ребла само като мястото в земята Емат, откъдето фараонът отвел Йоахаз, а Йероним смятал Ривла за Антиохия. Робинсън отбелязал, че Ривла не се среща в списъците на ранните църковни седалища. Равнината преминала към селевкидските царе, а после към римска Сирия, чийто главен град наблизо бил Емеса, днешният Хомс."
